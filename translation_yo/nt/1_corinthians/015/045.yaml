  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: yo
  text: 'Bẹ́ẹ̀ náà ni a kọ ọ́ sílẹ̀ pé: “Ènìyàn àkọ́kọ́, Ádámù, di ẹ̀dá alààyè”[a]; ṣùgbọ́n Ádámù ìkẹyìn di ẹ̀mí tí ń fúnni ní ìyè.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkàn alààyè,” gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀ ti Jẹ́nẹ́sísì 2:7.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ ọ́ pé, “ẹ̀mí afúnni-ní-ìyè.” Gbólóhùn náà ń ṣàpèjúwe Ádámù ìkẹyìn ní ìyàtọ̀ sí Ádámù àkọ́kọ́; Gíríìkì náà ń ṣàpèjúwe irú ẹ̀mí tí ó jẹ́, kò sì fi dandan hàn pé Kristi àti Ẹ̀mí Mímọ́ jẹ́ ẹni kan náà.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: Bẹ́ẹ̀ ni a sì ti kọ ọ́ pé
  rationale: “Bẹ́ẹ̀ ni” ń pa ipa ìtọ́kasí οὕτως mọ́, “sì” sì ń fi καί hàn gẹ́gẹ́ bí ìsopọ̀ pẹ̀lú àríyànjiyàn tó ṣáájú. “A ti kọ ọ́” jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ ìtọ́kasí Ìwé Mímọ́.
- source_word: Ἐγένετο
  choice: di
  rationale: “Di” fi ìyípadà tàbí ipò tí ohun dé sí hàn ní ṣókí, ó sì bá γίνομαι mu ju ìtumọ̀ tí yóò sọ pé a dá a lọ.
- source_word: ὁ πρῶτος ἄνθρωπος Ἀδὰμ
  choice: Ádámù, ènìyàn àkọ́kọ́
  rationale: “Ènìyàn àkọ́kọ́” pa ìtumọ̀ ἄνθρωπος àti ipa Ádámù gẹ́gẹ́ bí aṣojú ènìyàn mọ́, nígbà tí àtòjọ ọ̀rọ̀ Yorùbá yìí jẹ́ ti àdánidá.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: ẹ̀dá alààyè
  rationale: Nínú ìtọ́kasí sí Jẹ́nẹ́sísì 2:7, ψυχή túmọ̀ sí ẹni tàbí ẹ̀dá tó ní ìyè, kì í ṣe dandan apá àìlórí-ara kan. “Ẹ̀dá alààyè” mú ìtumọ̀ yẹn jáde láìfi ẹ̀kọ́ nípa ẹ̀dá ènìyàn tí ọ̀rọ̀ náà kò sọ kún un.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: Ádámù ìkẹyìn
  rationale: Èyí pa ìfiwéra àpẹẹrẹ tí Pọ́ọ̀lù ṣe láàárín Ádámù àkọ́kọ́ àti Kristi mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: di ẹ̀mí tí ń fúnni ní ìyè
  rationale: “Ẹ̀mí” bá πνεῦμα mu, gbólóhùn “tí ń fúnni ní ìyè” sì ṣàfihàn ipa ζῳοποιοῦν ní Yorùbá àdánidá. A kò sọ ọ́ di orúkọ àdámọ̀ “Ẹ̀mí” nítorí pé ọ̀rọ̀ Gíríìkì náà kò ní article, ó sì ní agbára àpèjúwe.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nínú ìtọ́kasí Jẹ́nẹ́sísì
  choice: ẹ̀dá alààyè
  alternative: ọkàn alààyè
  rationale: Àyíká ìṣẹ̀dá ń sọ nípa Ádámù gẹ́gẹ́ bí ẹni tó wà láàyè, kì í ṣe ní pàtàkì nípa ọkàn tí a lè yà sọ́tọ̀ kúrò lára. A fi ìtumọ̀ ìbílẹ̀ sí àlàyé ìsàlẹ̀ láti pa ìró Jẹ́nẹ́sísì mọ́.
- issue: Ìtumọ̀ “Ádámù ìkẹyìn di ẹ̀mí tí ń fúnni ní ìyè”
  choice: Pa ìfiwéra náà mọ́ gẹ́gẹ́ bí àpèjúwe ànímọ́, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Ádámù ìkẹyìn di Ẹ̀mí afúnni-ní-ìyè.
  rationale: Nítorí πνεῦμα kò ní article, ó ṣeé ṣe jù láti ka gbólóhùn náà gẹ́gẹ́ bí àpèjúwe ohun tí Ádámù ìkẹyìn jẹ́ àti ohun tó ń ṣe. Èyí kò fi tipátipá dá Kristi mọ̀ Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni kan náà, bẹ́ẹ̀ ni kò sì sẹ́ ìbáṣepọ̀ iṣẹ́ wọn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́wọ̀, àdánidá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Ádámù” gẹ́gẹ́ bí ìkọ̀wé orúkọ tí ó wọ́pọ̀ ní Yorùbá.
