id: 1CO.15.5
reference: 1 Corinthians 15:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅτι ὤφθη Κηφᾷ, εἶτα τοῖς δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/005.yaml
  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: yo
  text: àti pé ó farahàn[a] fún Kéfà[b], lẹ́yìn náà fún àwọn méjìlá.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kéfà rí i.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní ìrísí aláìṣiṣẹ́ ní gírámà, ṣùgbọ́n nínú àwọn ọ̀rọ̀ nípa ìfarahàn lẹ́yìn àjíǹde, a sábà máa ń túmọ̀ rẹ̀ sí “ó farahàn.”
    reason: lexical_alternative
  - marker: b
    text: Kéfà jẹ́ orúkọ Árámáíkì tó bá orúkọ Pétérù dọ́gba.
    reason: cross_reference
  - marker: c
    text: “Àwọn méjìlá” jẹ́ orúkọ tí a ti fi mọ ẹgbẹ́ àwọn àpọ́sítélì Jésù, bí iye àwọn tó wà nínú ẹgbẹ́ náà kò tilẹ̀ jẹ́ méjìlá ní gbogbo ìgbà.
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: ó fara hàn
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ọ̀nà tí Gíríìkì fi sábà ń sọ nípa ẹni tí a rí; nínú àwọn ìtàn nípa àjíǹde, ‘ó fara hàn’ jẹ́ èdè Yorùbá àdánidá tí ó fi hàn pé Jésù jẹ́ kí àwọn ẹlẹ́rìí rí òun, láì ṣàfikún bí ìfarahàn náà ṣe rí.
- source_word: Κηφᾷ
  choice: Kéfà
  rationale: Èyí jẹ́ orúkọ ẹni ní ipò olùgbà. A ṣe àfọwọkọ ìró orúkọ Gíríìkì náà dípò yíyí i padà sí Pétérù.
- source_word: εἶτα
  choice: lẹ́yìn náà
  rationale: Ó ń tọ́ka sí ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ nínú àṣà ìjẹ́wọ́ tí Pọ́ọ̀lù ń sọ; ‘lẹ́yìn náà’ jẹ́ èdè Yorùbá tí ó ṣe kedere, tí ó sì bójú mu.
- source_word: τοῖς δώδεκα
  choice: àwọn méjìlá
  rationale: A pa àpèjúwe ẹgbẹ́ àwọn àpọ́sítélì Jésù mọ́ gẹ́gẹ́ bí Gíríìkì ṣe wí, láì yí i padà sí ‘àwọn àpọ́sítélì’ tàbí ‘àwọn mọ́kànlá.’
- source_word: καὶ ὅτι
  choice: àti pé
  rationale: Ó ń bá ìtẹ̀síwájú àwọn gbólóhùn ohun tí Pọ́ọ̀lù gbà tí ó sì fi lé wọn lọ́wọ́ mu; ‘àti pé’ pa ìṣètò ìpilẹ̀ṣẹ̀ náà mọ́.
theological_decisions:
- issue: Èdè nípa ìfarahàn lẹ́yìn àjíǹde
  choice: ó fara hàn
  alternative: Kéfà rí i
  rationale: ‘Ó fara hàn’ sọ ìjẹ́rìí nípa ìfarahàn Kristi lẹ́yìn àjíǹde láì ṣàlàyé ọ̀nà tàbí irú ìfarahàn náà ju ohun tí Gíríìkì sọ lọ; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ aláìṣe tààrà mọ́.
- issue: Ìtọ́kasí sí ‘àwọn méjìlá’ lẹ́yìn àìsí Júdásì
  choice: àwọn méjìlá
  alternative: àwọn àpọ́sítélì; àwọn mọ́kànlá
  rationale: Gíríìkì lo orúkọ ẹgbẹ́ tí a ti mọ̀ sí τοῖς δώδεκα. Mímú ‘àwọn méjìlá’ dúró kò fi ìṣọ̀kan tí kò sí nínú ẹsẹ̀ náà kún un, bẹ́ẹ̀ ni kò yí orúkọ ẹgbẹ́ náà padà nítorí àtúnṣe iye wọn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó lọ́lá, tó sì ṣe kedere fún òǹkàwé gbogbogbò. Àwọn àmì ohùn wà ní ibi tí ó yẹ. Àtúnṣe ọ̀rọ̀-ìṣe kejì nínú ‘ó fara hàn àwọn méjìlá’ mú gbólóhùn náà jẹ́ àdánidá ní Yorùbá, bó tilẹ̀ jẹ́ pé Gíríìkì fi ọ̀rọ̀-ìṣe náà sílẹ̀ láti inú gbólóhùn kejì.
