id: 1CO.15.38
reference: 1 Corinthians 15:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: yo
  text: Ṣùgbọ́n Ọlọ́run ń fún un ní ara gẹ́gẹ́ bí ó ti fẹ́, ó sì ń fún ọ̀kọ̀ọ̀kan àwọn irúgbìn náà ní ara tirẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “irúgbìn kọ̀ọ̀kan ní ara tirẹ̀.” Ní ti gidi, èdè Gíríìkì sọ pé “ọ̀kọ̀ọ̀kan àwọn irúgbìn,” ṣùgbọ́n ó lè ní ìtumọ̀ pínpín.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίδωσιν
  choice: ń fún … ní
  rationale: Ọ̀rọ̀ yìí jẹ́ ìṣe àsìkò ìsinsìnyí; ‘ń fún … ní’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹnì kan fún ohun kan ní nǹkan, ó sì pa àpẹẹrẹ irúgbìn náà mọ́.
- source_word: αὐτῷ
  choice: un
  rationale: Arọ́pò-orúkọ náà ń tọ́ka sí irúgbìn tí ẹsẹ tó ṣáájú mẹ́nu kàn. ‘Fún un ní ara’ jẹ́ èdè Yorùbá tó rọrùn, láìfi ‘irúgbìn náà’ kún ọ̀rọ̀ Gíríìkì.
- source_word: σῶμα
  choice: ara
  rationale: ‘Ara’ ni ìtumọ̀ Yorùbá tó ṣe déédé fún σῶμα, ó sì pa ìsopọ̀ ọ̀rọ̀ náà mọ́ pẹ̀lú àjíǹde ara nínú gbogbo orí náà.
- source_word: καθὼς ἠθέλησεν
  choice: gẹ́gẹ́ bí ó ti fẹ́
  rationale: Èyí fi ìfẹ́ àti ìpinnu Ọlọ́run hàn láìṣe àlàyé ju ohun tí Gíríìkì sọ lọ. ‘Ti fẹ́’ tún fi ìrísí ìṣe tí a rí nínú aorist hàn lọ́nà àdánidá.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: ọ̀kọ̀ọ̀kan àwọn irúgbìn náà
  rationale: 'Èyí pa ìtumọ̀ pínpín àti ìṣètò partitive náà mọ́: ọ̀kọ̀ọ̀kan lára àwọn irúgbìn. A kò fi ‘irú’ tàbí ‘ẹ̀yà’ kún un, nítorí èyí kò fara hàn gbangba nínú Gíríìkì.'
- source_word: ἴδιον
  choice: ara tirẹ̀
  rationale: ‘Tirẹ̀’ fi hàn pé ara náà jẹ́ èyí tó jẹ́ ti irúgbìn kọ̀ọ̀kan ní pàtó, bí ἴδιον ṣe ń tẹnumọ́.
theological_decisions:
- issue: Iṣẹ́ àti ìfẹ́ Ọlọ́run nínú àpẹẹrẹ irúgbìn àti ara
  choice: A sọ pé Ọlọ́run fún irúgbìn ní ara gẹ́gẹ́ bí ó ti fẹ́, àti pé ó fún ọ̀kọ̀ọ̀kan ní ara tirẹ̀.
  alternative: A lè túmọ̀ ọ̀rọ̀ náà ní ọ̀nà àlàyé sí i gẹ́gẹ́ bí ‘ara tó bá irú rẹ̀ mu’ tàbí ‘ara tó yàtọ̀ fún ẹ̀yà kọ̀ọ̀kan.’
  rationale: Ìtumọ̀ tí a yàn tẹnumọ́ iṣẹ́ àti ìfẹ́ Ọlọ́run, ó sì pa ìyàtọ̀ ara kọ̀ọ̀kan mọ́, ṣùgbọ́n kò fi èrò nípa ẹ̀yà tàbí doctrine kan kún ohun tí ọ̀rọ̀ Gíríìkì sọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A tún ‘ń fún’ sọ ní abala kejì kí gbólóhùn náà lè ṣàn dáadáa ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe kan ṣoṣo ni Gíríìkì lò fún àwọn abala méjèèjì. Àmì ohùn ni a lò ní kíkún níbi tí ó ti yẹ.
