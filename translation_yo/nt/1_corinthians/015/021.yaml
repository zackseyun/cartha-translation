id: 1CO.15.21
reference: 1 Corinthians 15:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: yo
  text: Nítorí pé nípasẹ̀ ènìyàn kan ni ikú ti wá[a][b], bẹ́ẹ̀ sì ni àjíǹde àwọn òkú ti wá nípasẹ̀ ènìyàn kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ọwọ́ ènìyàn kan” nínú apá méjèèjì; ọ̀rọ̀-ìṣáájú Gíríìkì náà lè fi olùṣe hàn, tàbí ọ̀nà tí ohun kan gbà ṣẹlẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Àyíká ọ̀rọ̀ Pọ́ọ̀lù fi hàn pé Ádámù àti Mèsáyà ni àwọn ènìyàn méjì náà (wo 15:22, 45).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Nítorí pé
  rationale: Àpapọ̀ ọ̀rọ̀ yìí ń ṣàlàyé ìdí fún ohun tí ó ṣáájú. “Nítorí pé” jẹ́ ọ̀nà Yorùbá àdánidá láti fi agbára ìdí àti àlàyé rẹ̀ hàn.
- source_word: δι’ ἀνθρώπου
  choice: nípasẹ̀ ènìyàn kan
  rationale: διά pẹ̀lú genitive lè tọ́ka sí ẹni tí a fi ṣe ohun kan tàbí ọ̀nà tí ohun náà gbà ṣẹlẹ̀. “Nípasẹ̀ ènìyàn kan” pa ìtumọ̀ méjèèjì mọ́, ó sì dáàbò bo àfiwé Pọ́ọ̀lù láàárín Ádámù àti Mèsáyà láìfi orúkọ wọn kún ẹsẹ náà.
- source_word: θάνατος
  choice: ikú ti wá
  rationale: Gbólóhùn Gíríìkì kò ní ọ̀rọ̀-ìṣe ní gbangba. Fífi “ti wá” kún un mú un jẹ́ Yorùbá àdánidá, ó sì fi ìfarahàn ikú nípasẹ̀ ènìyàn hàn.
- source_word: ἀνάστασις νεκρῶν
  choice: àjíǹde àwọn òkú
  rationale: Èyí sọ ní tààrà nípa jíjí àwọn tí ó ti kú dìde, gẹ́gẹ́ bí àríyànjiyàn Pọ́ọ̀lù nínú orí 15, kì í ṣe ìyè lẹ́yìn ikú lásán tàbí àjíǹde nípa ẹ̀mí nìkan.
- source_word: καὶ
  choice: bẹ́ẹ̀ sì ni
  rationale: Níhìn-ín καί so apá kejì mọ́ apá àkọ́kọ́ gẹ́gẹ́ bí ohun tí ó bá a dọ́gba. “Bẹ́ẹ̀ sì ni” mú ìfararọ̀ àwọn gbólóhùn méjèèjì hàn ní Yorùbá àdánidá.
- source_word: δι’ ἀνθρώπου
  choice: nípasẹ̀ ènìyàn kan
  rationale: 'A tún ọ̀rọ̀ kan náà lò láti pa ìfararọ̀ tí Pọ́ọ̀lù mọ̀ọ́mọ̀ ṣe mọ́: ènìyàn kan ni ikú ti ipa rẹ̀ wá, ènìyàn kan sì ni àjíǹde àwọn òkú ti ipa rẹ̀ wá.'
theological_decisions:
- issue: Ìyàtọ̀ aṣojú láàárín Ádámù àti Kristi
  choice: A pa “ènìyàn kan” mọ́ nínú apá méjèèjì, láìsọ orúkọ àwọn ọkùnrin náà nínú ẹsẹ pàtó yìí.
  alternative: “nípasẹ̀ ọkùnrin kan … nípasẹ̀ ọkùnrin kan,” tàbí “nípasẹ̀ Ádámù … nípasẹ̀ Kristi.”
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Ádámù àti Kristi ni a ń tọ́ka sí, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò dárúkọ wọn. Yíyan “ènìyàn kan” pa ọ̀rọ̀ Gíríìkì aláìní article àti ìfararọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́ láìfi ohun tí kò sí nínú ẹsẹ kún un.
- issue: Irú àjíǹde tí a ń sọ
  choice: àjíǹde àwọn òkú
  alternative: àjíǹde nípa ẹ̀mí; ìyè lẹ́yìn ikú
  rationale: Nínú 1 Kọ́ríńtì 15, Pọ́ọ̀lù ń jiyàn fún àjíǹde gidi àwọn tí ó ti kú. Ìtumọ̀ náà kò gbọdọ̀ sọ ọ́ di ìyè lẹ́yìn ikú lásán tàbí ohun ti ẹ̀mí nìkan.
translation_notes:
  register: A lo Yorùbá àtijọ́-kò-jù, ọ̀wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àtòpọ̀ “nípasẹ̀ … ni” jẹ́ àdánidá ní Yorùbá, ó sì pa ìtẹnumọ́ àti ìfararọ̀ Gíríìkì mọ́. Àmì ohùn ni a fi sí àwọn ọ̀rọ̀ níbi tí ó bá yẹ.
