id: 1CO.15.41
reference: 1 Corinthians 15:41
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: yo
  text: Ògo kan ni ti oòrùn, ògo mìíràn ni ti òṣùpá, ògo mìíràn sì ni ti àwọn ìràwọ̀; nítorí ìràwọ̀ kan yàtọ̀ sí ìràwọ̀ mìíràn ní ògo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλη
  choice: jẹ́ ọ̀tọ̀
  rationale: Àtúnsọ ἄλλη ń fi ìyàtọ̀ láàárín oòrùn, òṣùpá, àti àwọn ìràwọ̀ hàn. ‘Jẹ́ ọ̀tọ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìfiwéra náà mọ́.
- source_word: δόξα
  choice: ògo
  rationale: Nínú àpẹẹrẹ yìí, δόξα lè tọ́ka sí ìmọ́lẹ̀ tàbí ẹwà tí ojú rí, ṣùgbọ́n ‘ògo’ pa ọ̀rọ̀ pàtàkì tí Pọ́ọ̀lù ń tún lò nínú àríyànjiyàn rẹ̀ nípa àjíǹde mọ́.
- source_word: ἡλίου
  choice: oòrùn
  rationale: Ẹni tí ògo náà jẹ́ tirẹ̀ ni oòrùn; ìṣètò ‘ògo oòrùn’ jẹ́ ti Yorùbá àdánidá.
- source_word: σελήνης
  choice: òṣùpá
  rationale: Ẹni tí ògo náà jẹ́ tirẹ̀ ni òṣùpá, ní ìbámu pẹ̀lú ìtẹ̀lé oòrùn, òṣùpá, àti ìràwọ̀.
- source_word: ἀστέρων
  choice: àwọn ìràwọ̀
  rationale: Ọ̀pọ̀-orúkọ náà ni a pa mọ́ láti parí ìtẹ̀lé àwọn ohun ojú ọ̀run mẹ́ta.
- source_word: ἀστὴρ ... ἀστέρος
  choice: ìràwọ̀ kan ... òmíràn
  rationale: Èyí pa ìfiwéra láàárín ìràwọ̀ kọ̀ọ̀kan mọ́ ní Yorùbá tí ó ṣe kedere àti àdánidá.
- source_word: γὰρ
  choice: nítorí
  rationale: γάρ ń mú ìdí tàbí àlàyé fún gbólóhùn tó ṣáájú wọlé; ‘nítorí’ mú iṣẹ́ yẹn ṣẹ.
- source_word: διαφέρει
  choice: yàtọ̀
  rationale: Ọ̀rọ̀-ìṣe náà sọ ìyàtọ̀ níbí, láìfi dandan túmọ̀ sí pé ọ̀kan ga ju òmíràn lọ.
- source_word: ἐν δόξῃ
  choice: ní ògo
  rationale: Gbólóhùn yìí sọ ibi tí ìyàtọ̀ wọn wà, ó sì pa àtúnsọ δόξα mọ́.
theological_decisions:
- issue: Ìtumọ̀ δόξα nínú àpẹẹrẹ àwọn ohun ojú ọ̀run láàrín àríyànjiyàn nípa àjíǹde
  choice: ògo
  alternative: ìmọ́lẹ̀ dídán / ọlá ńlá
  rationale: Bí ó tilẹ̀ jẹ́ pé ohun tí a rí lójú lẹ́sẹ̀kẹsẹ̀ ni ìtànṣán àwọn ohun ojú ọ̀run, ‘ògo’ pa ìsopọ̀ ọ̀rọ̀ àti ẹ̀kọ́ inú àyíká ọ̀rọ̀ nípa ara àjíǹde mọ́, láìdín ìtumọ̀ rẹ̀ kù sí ìmọ́lẹ̀ ara nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìsọ̀rọ̀ náà jẹ́ ti òde òní, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò; a lo ‘jẹ́ ọ̀tọ̀’ àti ‘yàtọ̀ sí’ láti yà ìtẹ̀lé àwọn ẹ̀ka kúrò ní ìfiwéra láàárín ìràwọ̀ kọ̀ọ̀kan.
