id: 1CO.15.50
reference: 1 Corinthians 15:50
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: yo
  text: 'Ohun tí mo ń sọ ni èyí, ẹ̀yin arákùnrin[a]: ẹran ara àti ẹ̀jẹ̀[b] kò lè jogún ìjọba Ọlọ́run, bẹ́ẹ̀ ni ohun tí ó lè díbàjẹ́ kò jogún ohun tí kò lè díbàjẹ́.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀yin arákùnrin àti arábìnrin.” Ọ̀rọ̀ Gíríìkì sọ pé “arákùnrin,” ṣùgbọ́n ó lè ń tọ́ka sí gbogbo ìjọ lápapọ̀.
    reason: lexical_alternative
  - marker: b
    text: “Ẹran ara àti ẹ̀jẹ̀” jẹ́ àṣà-ọ̀rọ̀ fún ìwàláàyè ènìyàn tó lè kú nínú ipò rẹ̀ báyìí; kò túmọ̀ sí pé àjíǹde ara kò ní sí.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: Ohun tí mo ń sọ ni èyí
  rationale: Ìtumọ̀ yìí pa ọ̀nà ọ̀rọ̀ Pọ́ọ̀lù mọ́ gẹ́gẹ́ bí àlàyé tààrà, ó sì jẹ́ èdè Yorùbá àdánidá. Agbára ìsopọ̀ δέ wà nínú bí gbólóhùn náà ṣe ń tẹ̀ síwájú láti inú àyíká ọ̀rọ̀, láìfi ọ̀rọ̀ àkókò kún un.
- source_word: ἀδελφοί
  choice: ẹ̀yin arákùnrin
  rationale: Ó pa ọ̀rọ̀ akọ ní Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó lè ń bá gbogbo ìjọ, títí kan àwọn obìnrin, sọ̀rọ̀.
- source_word: σὰρξ καὶ αἷμα
  choice: ẹran ara àti ẹ̀jẹ̀
  rationale: Ó pa àwòrán àti àṣà-ọ̀rọ̀ orísun mọ́, nígbà tí ó tún jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá lè lóye.
- source_word: βασιλείαν θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe kedere, tó sì pa ìbáṣepọ̀ àwọn ọ̀rọ̀ orísun àti ìwúwo ẹ̀kọ́ ìgbàgbọ́ wọn mọ́.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: jogún / jogún
  rationale: “Jogún” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún gbígba ogún, ó sì pa ìtumọ̀ májẹ̀mú àti ti ọjọ́ iwájú mọ́; lílo ọ̀rọ̀ kan náà lẹ́ẹ̀mejì tún pa ìbáradọ́gba gbólóhùn Gíríìkì mọ́.
- source_word: οὐ δύναται
  choice: kò lè
  rationale: Ó sọ àìlèṣe náà ní ṣókí àti ní kedere.
- source_word: ἡ φθορά
  choice: ohun tí ó lè díbàjẹ́
  rationale: Nínú ọ̀rọ̀ nípa àjíǹde yìí, ó tọ́ka sí ohun tó wà lábẹ́ ìbàjẹ́. Gbólóhùn yìí túmọ̀ ìtumọ̀ náà sí Yorùbá òde òní láìdá a pọ̀ mọ́ ikú nìkan.
- source_word: τὴν ἀφθαρσίαν
  choice: ohun tí kò lè díbàjẹ́
  rationale: Ó pa ìtakora pẹ̀lú φθορά mọ́, kò sì fi “àìleèkú” dípò rẹ̀, nítorí ἀφθαρσία àti ἀθανασία ní ìtumọ̀ tó jọra ṣùgbọ́n tí kò dójú ìwọ̀n pátápátá.
theological_decisions:
- issue: Ìtumọ̀ “ẹran ara àti ẹ̀jẹ̀” ní ìbáṣepọ̀ pẹ̀lú àjíǹde
  choice: Àṣà-ọ̀rọ̀ fún ìwàláàyè ènìyàn tó lè kú, tó sì lè díbàjẹ́ nínú ipò rẹ̀ báyìí
  alternative: Pé ohun gbogbo tó jẹ́ ti ara kò lè wọ ìjọba Ọlọ́run
  rationale: Àyíká ọ̀rọ̀ ń kọ́ni nípa yíyí ara tó lè díbàjẹ́ padà sí ara tí kò lè díbàjẹ́, kì í ṣe nípa fífi ara sílẹ̀ pátápátá. A pa àṣà-ọ̀rọ̀ náà mọ́, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
- issue: Àwọn tí ἀδελφοί ń tọ́ka sí
  choice: A lo “ẹ̀yin arákùnrin” nínú ẹsẹ̀, a sì sọ nínú àlàyé pé ó ṣeé ṣe kí ó kó gbogbo ìjọ sínú
  alternative: ẹ̀yin ará; ẹ̀yin arákùnrin àti arábìnrin
  rationale: Èyí pa ìrísí akọ ọ̀rọ̀ Gíríìkì mọ́ láìṣàìjẹ́wọ́ pé nínú lẹ́tà Pọ́ọ̀lù ó sábà máa ń tọ́ka sí gbogbo ìjọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìpele àárín tó lọ́lá, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn níbi tó bá yẹ, a sì yan “ohun tí ó lè/kò lè díbàjẹ́” láti mú ìtakora φθορά/ἀφθαρσία yé ni kedere láìlo ọ̀rọ̀ ẹ̀kọ́ tó le.
