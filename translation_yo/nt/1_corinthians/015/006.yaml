id: 1CO.15.6
reference: 1 Corinthians 15:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: yo
  text: Lẹ́yìn náà, ó farahàn fún àwọn arákùnrin tí ó ju ẹ̀ẹ́dẹ́gbẹ̀ta lọ lẹ́ẹ̀kan náà[a]. Ọ̀pọ̀ jù lọ nínú wọn ṣì wà títí di ìsinsìnyí, ṣùgbọ́n àwọn kan ti sùn lọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin.” Gíríìkì sọ pé “àwọn arákùnrin,” ṣùgbọ́n láàárín àwọn Kristẹni ìgbà àkọ́kọ́, ọ̀rọ̀ náà lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, wọ́n ti kú. Pọ́ọ̀lù lo “sùn lọ,” ọ̀nà tí àwọn Kristẹni ìgbà àkọ́kọ́ sábà máa ń gbà sọ̀rọ̀ nípa ikú nítorí ìrètí àjíǹde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Lẹ́yìn náà
  rationale: Ó fi ìtẹ̀síwájú nínú àtòjọ àwọn ìfarahàn hàn ní Yorùbá àdánidá.
- source_word: ὤφθη
  choice: ó farahàn
  rationale: Nínú ọ̀rọ̀ nípa àjíǹde, ọ̀rọ̀ náà túmọ̀ sí pé Kristi farahàn; ìtumọ̀ yìí jẹ́ àdánidá ju ‘a rí i’ lọ, ó sì pa ìṣẹ̀lẹ̀ ìfarahàn mọ́.
- source_word: ἐπάνω πεντακοσίοις
  choice: tí ó ju ẹ̀ẹ́dẹ́gbẹ̀ta lọ
  rationale: Ó sọ iye tí ó pọ̀ ju ọ̀ọ́dúnrún márùn-ún lọ ní kedere àti ní Yorùbá àdánidá.
- source_word: ἀδελφοῖς
  choice: àwọn arákùnrin
  rationale: A pa irú akọ ọ̀pọ̀ inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ìwé sọ pé ó lè tọ́ka sí àwùjọ àwọn onígbàgbọ́ lápapọ̀.
- source_word: ἐφάπαξ
  choice: lẹ́ẹ̀kan náà
  rationale: Ó fi hàn pé gbogbo wọn rí ìfarahàn náà ní àkókò kan náà, kì í ṣe ní onírúurú àkókò.
- source_word: οἱ πλείονες
  choice: Ọ̀pọ̀ jù lọ nínú wọn
  rationale: Ó mú ìtumọ̀ ‘ọ̀pọ̀ jù lọ’ tàbí ‘ẹgbẹ́ tí ó pọ̀ jù’ jáde ní ọ̀nà tí ó ṣe kedere.
- source_word: μένουσιν ἕως ἄρτι
  choice: ṣì wà títí di ìsinsìnyí
  rationale: Ó pa ìtumọ̀ ‘wà dúró ṣinṣin títí di báyìí’ mọ́, nígbà tí àyíká ọ̀rọ̀ ń jẹ́ kí a mọ̀ pé wọ́n ṣì wà láàyè.
- source_word: τινὲς δὲ
  choice: ṣùgbọ́n àwọn kan
  rationale: ‘Ṣùgbọ́n’ mú ìyàtọ̀ kékeré láàárín ọ̀pọ̀ tí ó ṣì wà àti àwọn díẹ̀ tí ó ti kú hàn.
- source_word: ἐκοιμήθησαν
  choice: ti sùn lọ
  rationale: Ó pa àwòrán oorun tí Pọ́ọ̀lù lò fún ikú mọ́, pàápàá nínú àyíká ẹ̀kọ́ nípa àjíǹde.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφοῖς níbi tí ẹgbẹ́ náà ti lè ní ọkùnrin àti obìnrin
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀, nítorí náà a pa ìrísí rẹ̀ mọ́ nínú ẹsẹ̀; síbẹ̀, àlàyé sọ pé lílò rẹ̀ láàárín àwọn Kristẹni ìgbà àkọ́kọ́ lè gba gbogbo àwùjọ àwọn onígbàgbọ́.
- issue: Bí a ṣe túmọ̀ ἐκοιμήθησαν nínú àyíká àjíǹde
  choice: ti sùn lọ
  alternative: ti kú
  rationale: Àwòrán oorun fún ikú ní ìbáṣepọ̀ pẹ̀lú ìrètí àjíǹde nínú orí yìí; pípa àwòrán náà mọ́ kò jẹ́ kí a sọ ìtumọ̀ Pọ́ọ̀lù di pẹlẹbẹ.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. A lo “ó farahàn” fún ìfarahàn Kristi, “ṣì wà” láti pa ìtumọ̀ μένω mọ́, àti “ti sùn lọ” láti pa àwòrán ikú inú ọ̀rọ̀ orísun mọ́.
