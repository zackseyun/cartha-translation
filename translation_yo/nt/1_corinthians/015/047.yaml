base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: yo
  text: Ọkùnrin àkọ́kọ́ jẹ́ ti ilẹ̀, ó jẹ́ ti erùpẹ̀; ọkùnrin kejì sì jẹ́ ti ọ̀run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oníerùpẹ̀.” Ọ̀rọ̀ Gíríìkì χοϊκός ń tọ́ka sí ẹni tí ó jẹ́ ti erùpẹ̀, ó sì tún rántí bí a ti dá Ádámù láti inú erùpẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: àkọ́kọ́
  rationale: Ó jẹ́ nọ́ńbà ipò tí ó fi Ádámù, ẹni àkọ́kọ́, ṣe ìyàtọ̀ sí ẹni kejì.
- source_word: ἄνθρωπος
  choice: ọkùnrin
  rationale: Ní ẹsẹ yìí ọ̀rọ̀ náà tọ́ka sí Ádámù àti Kristi gẹ́gẹ́ bí ọkùnrin méjì tí Pọ́ọ̀lù fi wéra; ‘ọkùnrin’ pa ìṣọ̀kan àpẹẹrẹ náà mọ́.
- source_word: ἐκ γῆς
  choice: ti inú ilẹ̀ ni
  rationale: Gbólóhùn náà sọ orísun ẹni àkọ́kọ́, ó sì tún rántí bí a ti dá Ádámù láti inú ilẹ̀.
- source_word: χοϊκός
  choice: a fi erùpẹ̀ dá a
  rationale: Ìtumọ̀ ajẹtífù náà ni ‘ẹni tí ó jẹ́ ti erùpẹ̀’ tàbí ‘ẹni tí a fi erùpẹ̀ ṣe’; yíyan ọ̀rọ̀ yìí mú ìtọ́kasí sí ìṣẹ̀dá Ádámù yé òǹkàwé Yorùbá láì sọ ọ́ di ànímọ́ ènìyàn.
- source_word: δεύτερος
  choice: kejì
  rationale: Ó pa ìfiwéra tó mọ́ láàárín ọkùnrin àkọ́kọ́ àti ọkùnrin kejì mọ́.
- source_word: ἐξ οὐρανοῦ
  choice: ti ọ̀run ni
  rationale: Ó sọ orísun ti ọ̀run, kì í ṣe ojú ọ̀run lásán, ó sì bá ìyàtọ̀ tí Pọ́ọ̀lù ń ṣe mu.
theological_decisions:
- issue: Agbára ẹ̀kọ́ nípa Kristi nínú ‘ọkùnrin kejì’
  choice: A fi ‘ọkùnrin kejì’ sílẹ̀ láì fi orúkọ ‘Kristi’ kún un.
  alternative: Ọkùnrin kejì, Kristi, ti ọ̀run ni.
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Kristi ni Pọ́ọ̀lù ń tọ́ka sí, ṣùgbọ́n ẹsẹ yìí kò dárúkọ rẹ̀ ní tààrà; ìtumọ̀ náà kò fi àlàyé kún ọ̀rọ̀ orísun.
- issue: Àkókò ọ̀rọ̀-ìṣe nínú apá kejì
  choice: A lo gbólóhùn aláìlákòókò ‘ti ọ̀run ni.’
  alternative: Ọkùnrin kejì wá láti ọ̀run.
  rationale: Gíríìkì kò ní ọ̀rọ̀-ìṣe àsopọ̀ ní tààrà nínú apá méjèèjì. Ìṣètò Yorùbá yìí jẹ́ àdánidá, ó sì yẹra fún fífi àkókò tí ọ̀rọ̀ orísun kò sọ ní kedere múlẹ̀.
translation_notes:
  register: A lo Yorùbá tó bójú mu, tó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. Ìṣètò ‘ti … ni’ pa ìbáramu apá méjèèjì mọ́, nígbà tí ‘a fi erùpẹ̀ dá a’ mú àwòrán ìṣẹ̀dá Ádámù hàn ní èdè àdánidá.
