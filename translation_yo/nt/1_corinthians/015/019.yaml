id: 1CO.15.19
reference: 1 Corinthians 15:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: yo
  text: Bí ó bá jẹ́ pé nínú ìgbésí ayé yìí nìkan ni a ti gbé ìrètí wa lé Mèsáyà[c][a], a yẹ fún àánú ju gbogbo ènìyàn lọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tí a lè túmọ̀ sí “Kristi” tàbí “Mèsáyà”; níbí a lo “Mèsáyà” láti pa ìtumọ̀ oyè náà mọ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwa ni ẹni tí ó yẹ kí a ṣàánú jù lọ lára gbogbo ènìyàn.” A lè sọ ọ̀rọ̀ afiwéra Gíríìkì náà ní ọ̀nà tí ó dà bí gíga-jù-lọ nínú àyíká yìí.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Bí ó bá jẹ́ pé nínú ìgbésí ayé yìí nìkan ni a ti ní ìrètí nínú Mèsáyà.”
    reason: previous_rendering
lexical_decisions:
- source_word: εἰ
  choice: Bí ó bá jẹ́ pé
  rationale: Ó ṣe àfihàn gbólóhùn onígbọ̀wọ̀ ní Yorùbá lọ́nà àdánidá.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: fún ayé yìí
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí ìgbésí ayé ayé òde òní gẹ́gẹ́ bí ibi tí ìrètí náà mọ sí; ‘fún ayé yìí’ mú ìtumọ̀ náà hàn kedere ní Yorùbá.
- source_word: ἐν Χριστῷ
  choice: lé Mèsáyà
  rationale: ‘Gbé ìrètí lé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a fi ìgbẹ́kẹ̀lé sínú ẹnì kan; ‘Mèsáyà’ sì pa agbára Χριστός gẹ́gẹ́ bí oyè mọ́.
- source_word: ἠλπικότες ἐσμὲν
  choice: a ti gbé ìrètí wa lé
  rationale: Ìlò ‘ti’ ń fi ipò ìrètí tí a ti dá sílẹ̀, tí ó sì ń bá a lọ títí di ìsinsìnyí, hàn.
- source_word: μόνον
  choice: nìkan
  rationale: Ó fi ààlà ìrètí náà sí ayé yìí ṣoṣo, kì í ṣe pé ìrètí nìkan ni àwọn onígbàgbọ́ ti ní.
- source_word: ἐλεεινότεροι
  choice: a yẹ fún àánú ju … lọ
  rationale: Ó pa ìlànà afiwéra Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání.
- source_word: πάντων ἀνθρώπων
  choice: gbogbo ènìyàn
  rationale: ἄνθρωποι níbí túmọ̀ sí gbogbo ẹ̀dá ènìyàn, kì í ṣe àwọn ọkùnrin nìkan.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστῷ nínú gbólóhùn Páùlù ἐν Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: ‘Mèsáyà’ ń pa ìtumọ̀ oyè náà mọ́; àlàyé ìsàlẹ̀ ojú ewé jẹ́ kí òǹkàwé mọ àṣà ìtumọ̀ ‘Kristi’ pẹ̀lú.
- issue: Ààlà ọ̀rọ̀ Páùlù nípa ìrètí
  choice: Ìrètí tí ó mọ sí ayé yìí nìkan
  alternative: Àlàyé tí yóò túmọ̀ ọ̀rọ̀ náà sí ẹ̀kọ́ ìgbàgbọ́ tó gbooro nípa ayé ọjọ́ iwájú
  rationale: Ìtumọ̀ náà pa ipò onígbọ̀wọ̀ àti agbára ọ̀rọ̀ Páùlù mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ yìí kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. Gbólóhùn “gbé ìrètí lé” jẹ́ àdánidá fún òǹkàwé Yorùbá, nígbà tí àlàyé [c] pa ìṣètò ọ̀rọ̀ tó sún mọ́ Gíríìkì mọ́. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
