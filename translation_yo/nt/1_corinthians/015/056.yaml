base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: yo
  text: Oró ikú ni ẹ̀ṣẹ̀, agbára[a] ẹ̀ṣẹ̀ sì ni òfin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “okun”: “Okun ẹ̀ṣẹ̀ sì ni òfin.”'
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “òfin” tọ́ka ní pàtàkì sí Òfin Mósè nínú ìjíròrò Pọ́ọ̀lù, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè ní ìtumọ̀ gbígbòòrò nípa ipa òfin nínú ṣíṣí ẹ̀ṣẹ̀ payá àti mímú kí ipa rẹ̀ le sí i.
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: oró
  rationale: “Oró” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ohun apanilára tí ohun tí ń ta ń fi ṣe ni; nínú àwòrán yìí, ẹ̀ṣẹ̀ ni ohun tí ikú fi ń pa lára. Ó mú ìtumọ̀ “oró ohun tí ń ta” jáde láìyí àwòrán náà sí ọ̀pá ìdarí ẹranko.
- source_word: θανάτου
  choice: ikú
  rationale: A pa ìbáṣepọ̀ genitive náà mọ́ ní ṣókí gẹ́gẹ́ bí “oró ikú,” ìyẹn, oró tí ó jẹ́ ti ikú.
- source_word: ἁμαρτία
  choice: ẹ̀ṣẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹ̀ṣẹ̀; ẹyọ ọ̀rọ̀ náà tún pa ìfihàn ẹ̀ṣẹ̀ gẹ́gẹ́ bí agbára tàbí ìlànà kan mọ́.
- source_word: δύναμις
  choice: agbára
  rationale: “Agbára” sọ ipa tàbí okun tí ẹ̀ṣẹ̀ fi ń ṣiṣẹ́ ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó bá ọ̀rọ̀ náà mu.
- source_word: νόμος
  choice: òfin
  rationale: “Òfin” pa ọ̀rọ̀ Gíríìkì náà mọ́ láìfi tipátipá sọ pé Òfin Mósè nìkan ni, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Pọ́ọ̀lù lè tọ́ka sí i ní pàtàkì.
- source_word: δὲ
  choice: sì
  rationale: Nínú gbólóhùn kejì, “sì” fi ìtẹ̀síwájú àti ìbáṣepọ̀ àwọn apá méjèèjì hàn láìsọ pé ìtakora líle wà. A kò fi ọ̀rọ̀ ìbẹ̀rẹ̀ kún apá àkọ́kọ́ nítorí δέ kò béèrè fún “nísinsìnyí.”
theological_decisions:
- issue: Ìtumọ̀ “òfin” nínú gbólóhùn pé òfin ni agbára ẹ̀ṣẹ̀
  choice: A lò “òfin” ní gbogbogbò láìfi àmì tàbí ọ̀rọ̀ míì dín un kù sí Òfin Mósè nìkan.
  alternative: “Òfin Mósè” ní pàtó, tàbí òfin gẹ́gẹ́ bí ìlànà gbogboogbò.
  rationale: Àyíká ọ̀rọ̀ Pọ́ọ̀lù lè mú Òfin Mósè wá sí ọkàn ní pàtàkì, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ “Mósè.” Ìtumọ̀ náà pa ààyè àti ìnira ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tí ó ní àmì ohùn kíkún ni a lò. Gbólóhùn náà kúrú, ó ní iyì, ó sì pa ìfarawé àti ìṣọ̀kan èdè orísun mọ́; “sì” jẹ́ kí ìṣàn ọ̀rọ̀ náà jẹ́ ti àdánidá ní Yorùbá.
