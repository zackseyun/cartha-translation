  naturalness: Ìbéèrè méjèèjì jẹ́ kedere, wọ́n sì pa ìpè ewì sí Ikú mọ́. “Níbo ni ... wà?” jẹ́ ìlò Yorùbá tí ó dára, ó sì yọ àìní àmì ohùn nínú “ibo” kúrò. “Oró” jẹ́ ọ̀rọ̀ ìbílẹ̀ tí a ti fìdí múlẹ̀ nínú Yorùbá Bíbélì fún “sting” nínú àyíká yìí.
  terminology: “Ìṣẹ́gun” jẹ́ ìtumọ̀ tó pé fún νῖκος. “Oró” bó tilẹ̀ jẹ́ pé ó lè túmọ̀ sí májèlé ní àwọn àyíká míì, ó jẹ́ ìlò Bíbélì Yorùbá tó mọ̀ wọ́pọ̀ fún κέντρον nínú ẹsẹ yìí, ó sì dá ìfarahàn rẹ̀ gẹ́gẹ́ bí ohun tí ń pa/ń ta ni mọ́. “Rẹ̀” ni àmì ohùn tó yẹ fún “your” (ẹni kejì); “rẹ” lè tọ́ka sí “his/her/its.”
