  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: yo
  text: '“Ikú, níbo ni ìṣẹ́gun rẹ̀ wà?[a]


    Ikú, níbo ni oró rẹ̀ wà?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Àwọn àfọwọ́kọ kan ní ní abala àkọ́kọ́: “Ikú, níbo ni oró rẹ̀ wà?” Kíkà yìí fara hàn nínú KJV àti àwọn ìtumọ̀ Bíbélì ìbílẹ̀ mìíràn.'
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: ibo ni ... wà?
  rationale: Ọ̀rọ̀ ìbéèrè yìí ń bẹ̀rẹ̀ ìbéèrè àsọyé ẹlẹ́gàn. ‘Ibo ni ... wà?’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa agbára ìbéèrè náà mọ́ láìfi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: σου
  choice: rẹ
  rationale: Arọ́pò-orúkọ olóhun ẹni kejì ni; ‘rẹ’ ni ìtumọ̀ Yorùbá tó ṣe déédéé, tó sì bá gbólóhùn méjèèjì mu.
- source_word: θάνατε
  choice: Ikú
  rationale: Ọ̀rọ̀ náà jẹ́ àpèjúwe olùgbà tí a ń bá sọ̀rọ̀ ní tààrà, níbi tí a ti sọ ikú di ẹni. Pípè é ní ‘Ikú’ ní tààrà pa agbára ewì àti ìpè náà mọ́ láìlo ọ̀rọ̀ àjèjì bí ‘Ìwọ Ikú.’
- source_word: νῖκος
  choice: ìṣẹ́gun
  rationale: νῖκος túmọ̀ sí ìṣẹ́gun tàbí ríri ọ̀tá ṣẹ́gun. ‘Ìṣẹ́gun’ ṣe kedere, ó sì bá àyíká ọ̀rọ̀ nípa ikú tí a fi ìṣẹ́gun gbé mì ní ẹsẹ 54 mu.
- source_word: κέντρον
  choice: oró
  rationale: κέντρον lè jẹ́ ohun mímú tí ẹranko fi ń ta ni tàbí ọ̀pá olórí mímú. Nínú àkópọ̀ ọ̀rọ̀ yìí, ‘oró’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ń ta ni, ó sì bá àlàyé ẹsẹ 56 mu.
theological_decisions:
- issue: Kíkà ọ̀rọ̀ inú àfọwọ́kọ àríwísí ní abala àkọ́kọ́
  choice: Túmọ̀ νῖκος sí ‘ìṣẹ́gun’ nínú ọ̀rọ̀ pàtàkì.
  alternative: Túmọ̀ abala àkọ́kọ́ pẹ̀lú ‘oró’ gẹ́gẹ́ bí àwọn àfọwọ́kọ kan àti àṣà Textus Receptus/KJV ṣe ní.
  rationale: SBLGNT tí a fún wa ka νῖκος ní abala àkọ́kọ́, nítorí náà ó yẹ kí ọ̀rọ̀ pàtàkì jẹ́ ‘ìṣẹ́gun ... oró.’ Èyí tún bá ọ̀rọ̀ Paulu ní ẹsẹ 54 nípa fífi ìṣẹ́gun gbé ikú mì mu. A fi kíkà mìíràn sínú àlàyé ìsàlẹ̀ nítorí pé ó ṣe pàtàkì nínú àṣà àwọn Bíbélì àtijọ́, ó sì ní ìbáṣepọ̀ pẹ̀lú Hóséà 13:14.
translation_notes:
  register: Yorùbá Àjùmọ̀lò tó ní àmì ohùn ní kíkún níbi tó bá bá àṣà mu. Ìforúkọsílẹ̀ náà kúrú, ó ní iyì, ó sì pa ìbéèrè àsọyé ẹlẹ́gàn àti fífi ikú ṣe bí ẹni tí a ń bá sọ̀rọ̀ mọ́.
