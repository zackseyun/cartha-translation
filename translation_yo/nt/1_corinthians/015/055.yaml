  - severity: low
    issue: “ibo” kò ní àmì ohùn, ó sì lè dà bí ọ̀rọ̀ tí a kò mọ̀ dájú ní Yorùbá oníàmì-ohùn.
    rationale: “Níbo” jẹ́ ọ̀nà ìbéèrè ibi tó dára, tó sì ní àwọn àmì ohùn tó yẹ.
  - severity: low
    issue: Ọ̀rọ̀ àlàyé ìsàlẹ̀ “Kíkà yìí fara hàn nínú KJV” kò rọrùn bí “Àwọn àfọwọ́kọ kan ní ...”
