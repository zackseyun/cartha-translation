id: 1CO.15.22
reference: 1 Corinthians 15:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí gbogbo ènìyàn ti ń kú nínú Ádámù, bẹ́ẹ̀ náà ni a ó sọ gbogbo ènìyàn di alààyè nínú Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Kristi.” A lè pe oyè Gíríìkì Χριστός ní “Kristi” tàbí kí a túmọ̀ rẹ̀ sí “Mèsáyà”; níbí, a túmọ̀ oyè náà gẹ́gẹ́ bí ìtumọ̀ rẹ̀.
    reason: Àṣàyàn ìtúmọ̀ míì fún oyè Χριστός.
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: “Nítorí” ń pa ipa ìṣopọ̀ àti àlàyé γάρ mọ́, “gẹ́gẹ́ bí” sì ń fi ìfiwéra ὥσπερ hàn ní Yorùbá àdánidá.
- source_word: ἐν τῷ Ἀδὰμ
  choice: nínú Ádámù
  rationale: Ó tẹ̀ lé ìsọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì pa èrò ìdánimọ̀ tàbí ìṣọ̀kan pẹ̀lú Ádámù mọ́ láì sọ ἐν di ohun èlò bí “nípasẹ̀ Ádámù.”
- source_word: πάντες … πάντες
  choice: gbogbo ènìyàn … gbogbo ènìyàn
  rationale: Ó pa ìbáradọ́gba àwọn ọ̀rọ̀ méjèèjì àti àyè gbígbòòrò πάντες mọ́. Fífi “ènìyàn” kún un jẹ́ kí gbolohun náà ṣe kedere àti kí ó dùn bí Yorùbá àdánidá, láì dín ìtumọ̀ rẹ̀ kù.
- source_word: ἀποθνῄσκουσιν
  choice: ti ń kú
  rationale: Àpẹẹrẹ “ń kú” fi ìṣe tí ó ń ṣẹlẹ̀ gẹ́gẹ́ bí ipò gbogbogbò hàn, ó sì bá agbára àsìkò ìsinsìnyí Gíríìkì mu.
- source_word: οὕτως καὶ
  choice: bẹ́ẹ̀ náà ni
  rationale: Ó pa ìbáṣepọ̀ ìfiwéra pẹ̀lú ὥσπερ àti agbára àfikún καί mọ́ ní ọ̀nà Yorùbá tí ó rọrùn.
- source_word: ἐν τῷ Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός jẹ́ oyè níbí; “Mèsáyà” tú ìtumọ̀ oyè náà, ó sì pa ìfarajọ rẹ̀ mọ́ pẹ̀lú “nínú Ádámù.”
- source_word: ζῳοποιηθήσονται
  choice: a ó sọ … di alààyè
  rationale: Àgbékalẹ̀ aláìlórúkọ “a ó sọ” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣe tí ẹni mìíràn ṣe sí wọn hàn; “ó” pa ìtọ́ka sí ọjọ́ iwájú mọ́, “sọ … di alààyè” sì fi ζῳοποιέω hàn ní kedere.
theological_decisions:
- issue: Ibi tí “gbogbo ènìyàn” dé nínú ìpín méjèèjì
  choice: A pa “gbogbo ènìyàn” mọ́ láì fi àlàyé tó dín un sí ẹgbẹ́ kan kún un.
  alternative: Kí a tú “gbogbo ènìyàn” kejì sí “gbogbo onígbàgbọ́,” tàbí kí a sọ pé àwọn méjèèjì ní ìtumọ̀ kan náà pátápátá.
  rationale: Gíríìkì fi πάντες … πάντες ṣe ìbáradọ́gba ní tààrà, kò sì ṣàlàyé ibi tí ọ̀kọ̀ọ̀kan dé nínú ẹsẹ yìí. Ìtumọ̀ náà fi ìfojúsùn ẹ̀kọ́ ìgbàgbọ́ yìí sílẹ̀ láì yan ojú ìwòye ẹ̀sìn kan.
- issue: Aṣeyọrí ìṣe nínú “a ó sọ … di alààyè”
  choice: A lo àgbékalẹ̀ tí kò dárúkọ ẹni tó ṣe ìṣe náà.
  alternative: “Ọlọ́run yóò sọ gbogbo ènìyàn di alààyè.”
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ aláìṣe (passive), kò sì dárúkọ Ọlọ́run ní tààrà nínú ẹsẹ náà. Àgbékalẹ̀ Yorùbá yìí pa ìṣe tí a ṣe sí wọn mọ́ láì fi kókó ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ. Àtúnṣe “gẹ́gẹ́ bí … bẹ́ẹ̀ náà ni” pa ìbáradọ́gba ọ̀rọ̀ Pọ́ọ̀lù mọ́.
