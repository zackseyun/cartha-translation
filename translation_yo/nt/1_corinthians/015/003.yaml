id: 1CO.15.3
reference: 1 Corinthians 15:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: yo
  text: 'Nítorí, gẹ́gẹ́ bí ohun tí ó ṣe pàtàkì jù lọ, mo fi ohun tí èmi náà gbà lé yín lọ́wọ́: pé Mèsáyà[a] kú fún àwọn ẹ̀ṣẹ̀ wa, gẹ́gẹ́ bí àwọn Ìwé Mímọ́ ti wí[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi kú fún àwọn ẹ̀ṣẹ̀ wa.” Ọ̀rọ̀ Gíríìkì Χριστός lè jẹ́ “Mèsáyà” níbi tí ó ti ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ní ìbámu pẹ̀lú àwọn Ìwé Mímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: mo fi lé yín lọ́wọ́
  rationale: Ó ń sọ nípa fífi ẹ̀kọ́ tàbí àṣà ìgbàgbọ́ tí ẹni gba tẹ́lẹ̀ ránṣẹ́ sí àwọn ẹlòmíràn; ọ̀rọ̀ yìí pa ìtumọ̀ ìfiranṣẹ́ oníṣẹ́-aṣẹ náà mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tó ṣáájú rẹ̀ gẹ́gẹ́ bí àlàyé.
- source_word: ἐν πρώτοις
  choice: gẹ́gẹ́ bí ohun tó ṣe pàtàkì jù lọ
  rationale: Nínú àyíká yìí, gbólóhùn náà tọ́ka sí ipò pàtàkì jù lọ, kì í ṣe dandan pé ohun tó kọ́kọ́ ṣẹlẹ̀ ní àkókò.
- source_word: ὃ καὶ παρέλαβον
  choice: ohun tí èmi náà gbà
  rationale: Ó pa ìbáṣepọ̀ tó wà láàárín ohun tí Paulu gbà àti ohun tí ó fi lé wọn lọ́wọ́ mọ́.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Nínú àkótán ìjẹ́wọ́ ìgbàgbọ́ yìí, Χριστός ní agbára oyè, ìyẹn ẹni àmì òróró tí a ṣèlérí.
- source_word: ἀπέθανεν
  choice: kú
  rationale: Ọ̀rọ̀ aorist náà tọ́ka sí ìṣẹ̀lẹ̀ ikú gẹ́gẹ́ bí ohun tó ṣẹlẹ̀ nígbà kan rí.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: fún àwọn ẹ̀ṣẹ̀ wa
  rationale: Ó jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ ‘fún’ tàbí ‘nítorí’ wa láìfi ẹ̀kọ́ pàtó kan nípa ètùtù kún ọ̀rọ̀ Gíríìkì.
- source_word: κατὰ τὰς γραφάς
  choice: gẹ́gẹ́ bí àwọn Ìwé Mímọ́ ti wí
  rationale: Ó fi hàn pé ikú náà bá ohun tí àwọn Ìwé Mímọ́ sọ mu, ó sì pa ọ̀pọ̀ γραφάς mọ́ ní ‘àwọn Ìwé Mímọ́.’
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè nínú àkótán ìjẹ́wọ́ yìí; ‘Mèsáyà’ pa ìtumọ̀ ẹni àmì òróró tí a ṣèlérí mọ́.
- issue: Agbára ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: fún àwọn ẹ̀ṣẹ̀ wa
  alternative: nítorí àwọn ẹ̀ṣẹ̀ wa
  rationale: ‘Fún àwọn ẹ̀ṣẹ̀ wa’ pa ìkéde ìgbàlà náà mọ́ láìdín ὑπέρ kù sí àlàyé kan ṣoṣo nípa bí ètùtù ṣe ń ṣiṣẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘fi lé … lọ́wọ́’ fún ìtẹ̀síwájú ẹ̀kọ́ tí a gbà, ‘Mèsáyà’ fún oyè Χριστός, àti ‘àwọn Ìwé Mímọ́’ láti pa ọ̀pọ̀ nínú Gíríìkì mọ́.
