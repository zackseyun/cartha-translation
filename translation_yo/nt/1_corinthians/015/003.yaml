  to: 'Nítorí, gẹ́gẹ́ bí ohun tí ó ṣe pàtàkì jù lọ, mo fi ohun tí èmi náà gbà lé yín lọ́wọ́: pé Mèsáyà[a] kú fún àwọn ẹ̀ṣẹ̀ wa, gẹ́gẹ́ bí àwọn Ìwé Mímọ́ ti wí[b],'
  rationale: A tún ìlànà gbolóhùn ṣe kí ó lè fi hàn ní kedere pé ohun tí Paulu gba ni ó fi lé àwọn olùgbọ́ rẹ̀ lọ́wọ́, àti pé ó gbé e kalẹ̀ gẹ́gẹ́ bí ohun tó ṣe pàtàkì jù lọ. A kò yí ìtumọ̀ ìpìlẹ̀ ẹsẹ̀ náà, ìforúkọsílẹ̀ ọ̀wọ̀, Mèsáyà, tàbí ìtumọ̀ nípa àwọn Ìwé Mímọ́ padà. A sì sọ ẹsẹ̀ ìsàlẹ̀ a di Yorùbá tí ó rọrùn síi.
