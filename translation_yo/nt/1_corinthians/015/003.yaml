  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa gbogbo àwọn ìpìlẹ̀ Gíríìkì mọ́: γάρ gẹ́gẹ́ bí ìdí/àlàyé, ìtẹ̀síwájú ohun tí a gbà fún παρέδωκα àti παρέλαβον, ìpàtàkì ἐν πρώτοις, Mèsáyà fún Χριστός, ‘fún àwọn ẹ̀ṣẹ̀ wa’ fún ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν, àti ìbámu pẹ̀lú àwọn Ìwé Mímọ́. Àmọ́ ìlànà gbolóhùn nínú àkọsílẹ̀ yìí—‘ohun tí mo fi ... ni ohun tí èmi náà gbà’—le dà bí ìfọkànsìn pé ohun tí Paulu fi lé wọn lọ́wọ́ ni ohun kan náà péré tí ó gbà, dípò pé ó fi ohun tí ó gbà lé wọn lọ́wọ́ gẹ́gẹ́ bí ohun tó ṣe pàtàkì jù lọ.'
  naturalness: A lè mú un rọrùn, kedere, àti dáa fún kíkà ní gbangba nípa fífi olùgbà ‘ohun tí èmi náà gbà’ sún mọ́ ìṣe ‘fi lé yín lọ́wọ́.’ ‘gẹ́gẹ́ bí àwọn Ìwé Mímọ́ ti wí’ jẹ́ èdè Yorùbá adayeba, ó sì ṣe aṣojú ‘according to the Scriptures’ dáadáa nínú àyíká yìí.
  terminology: ‘Mèsáyà’ dáa fún Χριστός gẹ́gẹ́ bí oyè nínú àkótán ìjẹ́wọ́ yìí. ‘Àwọn Ìwé Mímọ́’ pa ọ̀pọ̀ γραφάς mọ́. ‘Fún àwọn ẹ̀ṣẹ̀ wa’ jẹ́ fífi ὑπέρ hàn láìfi ìmọ̀-ẹ̀sìn ètùtù pàtó kún un.
