id: 1CO.15.10
reference: 1 Corinthians 15:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: yo
  text: Ṣùgbọ́n nípa oore-ọ̀fẹ́ Ọlọ́run ni mo fi jẹ́ ẹni tí mo jẹ́, oore-ọ̀fẹ́ rẹ̀ sí mi kò já sí asán[a]. Kàkà bẹ́ẹ̀, mo ṣiṣẹ́ takuntakun ju gbogbo wọn lọ—síbẹ̀, kì í ṣe èmi, bí kò ṣe oore-ọ̀fẹ́ Ọlọ́run tí ó wà pẹ̀lú mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò di ohun asán” tàbí “kò jẹ́ lásán.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: Ṣùgbọ́n nípa oore-ọ̀fẹ́ Ọlọ́run
  rationale: “Nípa” fi ipa ohun èlò dative χάριτι hàn, “ṣùgbọ́n” sì mú ìyàtọ̀ pẹ̀lẹ́ ti δέ jáde. A pa ọ̀rọ̀ pàtàkì Pọ́ọ̀lù, “oore-ọ̀fẹ́,” mọ́.
- source_word: εἰμι ὅ εἰμι
  choice: ni mo fi jẹ́ ẹni tí mo jẹ́
  rationale: Èyí pa àtúnwí Gíríìkì mọ́ ní ọ̀nà Yorùbá tó ṣe déédéé, ó sì ń tọ́ka sí ipò àti irú ẹni tí Pọ́ọ̀lù jẹ́ nísinsìnyí.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: oore-ọ̀fẹ́ rẹ̀ sí mi
  rationale: “Sí mi” pa ìtọ́sọ́nà εἰς mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó rọrùn.
- source_word: οὐ κενὴ ἐγενήθη
  choice: kò sì já sí asán
  rationale: “Já sí asán” fi èrò pé oore-ọ̀fẹ́ náà kò di ohun tí kò ní èso tàbí àbájáde hàn, láìsọ àwòrán κενός nù.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: Kàkà bẹ́ẹ̀, mo ṣiṣẹ́ takuntakun ju gbogbo wọn lọ
  rationale: “Ṣiṣẹ́ takuntakun” mú ìsapá líle inú κοπιάω jáde; “ju gbogbo wọn lọ” sì fi ìfiwéra náà hàn ní kedere.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: síbẹ̀, kì í ṣe èmi, bí kò ṣe oore-ọ̀fẹ́ Ọlọ́run
  rationale: 'Ọ̀rọ̀ yìí pa ìdánilójú méjèèjì mọ́: Pọ́ọ̀lù ṣiṣẹ́ ní tòótọ́, ṣùgbọ́n ó fi agbára iṣẹ́ náà fún oore-ọ̀fẹ́ Ọlọ́run.'
- source_word: ἡ σὺν ἐμοί
  choice: tí ó wà pẹ̀lú mi
  rationale: Èyí tú σύν pẹ̀lú dative sí Yorùbá àdánidá, ó sì so gbólóhùn náà mọ́ “oore-ọ̀fẹ́ Ọlọ́run.”
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín iṣẹ́ takuntakun Pọ́ọ̀lù àti oore-ọ̀fẹ́ Ọlọ́run
  choice: A jẹ́wọ́ iṣẹ́ gidi Pọ́ọ̀lù àti agbára oore-ọ̀fẹ́ Ọlọ́run lẹ́gbẹ̀ẹ́ ara wọn.
  alternative: Kí a tú u sí pé Ọlọ́run àti Pọ́ọ̀lù ṣiṣẹ́ pọ̀ ní ìwọ̀n kan náà, tàbí kí a sọ ọ́ lọ́nà tí yóò dín iṣẹ́ Pọ́ọ̀lù kù.
  rationale: Gíríìkì sọ pé Pọ́ọ̀lù “ṣiṣẹ́ takuntakun ju” àwọn yòókù lọ, ó sì tún sọ pé “kì í ṣe èmi, bí kò ṣe oore-ọ̀fẹ́ Ọlọ́run.” Ìtumọ̀ náà kò yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbà tó tẹ̀ lé e nípa fífi ọ̀kan pa èkejì rẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò; a lo “oore-ọ̀fẹ́” gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀kọ́ pàtàkì tí ó ti wọ́pọ̀.
