  to: Ṣùgbọ́n nípa oore-ọ̀fẹ́ Ọlọ́run ni mo fi jẹ́ ẹni tí mo jẹ́, oore-ọ̀fẹ́ rẹ̀ sí mi kò já sí asán[a]. Kàkà bẹ́ẹ̀, mo ṣiṣẹ́ takuntakun ju gbogbo wọn lọ—síbẹ̀, kì í ṣe èmi, bí kò ṣe oore-ọ̀fẹ́ Ọlọ́run tí ó wà pẹ̀lú mi.
