id: 1CO.15.42
reference: 1 Corinthians 15:42
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: yo
  text: 'Bẹ́ẹ̀ náà ni àjíǹde àwọn òkú: a gbìn ín nínú ìdíbàjẹ́[a]; a jí i dìde nínú àìlèdíbàjẹ́.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ní ipò tí ó lè ṣègbé ... ní ipò tí kò lè ṣègbé.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Bẹ́ẹ̀ náà ni
  rationale: Ó so ọ̀rọ̀ yìí mọ́ àpèjúwe irúgbìn tí ó ṣáájú, ó sì pa agbára ìfiwéra àti ìparí èrò Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: àjíǹde àwọn òkú
  rationale: Èyí bá ìtumọ̀ gírámà àti ọ̀rọ̀ Pọ́ọ̀lù nípa àjíǹde ara àwọn tí ó ti kú mu; kò yí i sí ‘àjíǹde kúrò láàárín àwọn òkú.’
- source_word: σπείρεται
  choice: a gbìn ín
  rationale: Àpẹẹrẹ iṣẹ́ àgbẹ̀ ti fífi irúgbìn sínú ilẹ̀ wà ní kíkún. Yorùbá sábà máa ń lo ‘a’ aláìdárúkọ fún gbólóhùn tí kò sọ ẹni tó ṣe iṣẹ́, nítorí náà ó mú ìṣe-àfarawé Gíríìkì jáde lọ́nà àdánidá.
- source_word: ἐν φθορᾷ
  choice: sínú ìdíbàjẹ́
  rationale: ‘Ìdíbàjẹ́’ níbí tọ́ka sí ipò ara tí ó lè bàjẹ́, ṣùgbọ́n ó tún pa ìtakora pẹ̀lú ‘àìlèdíbàjẹ́’ mọ́. Àlàyé ìsàlẹ̀ fi ọ̀nà míì tí ó tẹnu mọ́ àìlèpé títí hàn.
- source_word: ἐγείρεται
  choice: a jí i dìde
  rationale: Ó pa ìtumọ̀ pé a ṣe ohun kan sí ara náà mọ́, kì í ṣe pé ó jí dìde fúnra rẹ̀; ó sì jẹ́ gbólóhùn Yorùbá tí ó wọ́pọ̀ fún àjíǹde.
- source_word: ἐν ἀφθαρσίᾳ
  choice: sínú àìlèdíbàjẹ́
  rationale: Ó dá ìtakora taara sí ‘ìdíbàjẹ́,’ ó sì túmọ̀ sí ipò tí kò lè bàjẹ́ mọ́, láìfi ẹ̀kọ́ ìsìn mìíràn kún un.
theological_decisions:
- issue: Irú ara àjíǹde nínú ìtakora Pọ́ọ̀lù
  choice: Pa àpẹẹrẹ fífún irúgbìn àti jíjí i dìde mọ́, pẹ̀lú ìtumọ̀ pé a ṣe iṣẹ́ náà sí ara.
  alternative: Túmọ̀ ọ́ ní tààrà sí ‘a sin ara ... a sì jí i dìde láìlèṣègbé,’ tàbí ka ìtakora náà sí ti ìwà nìkan.
  rationale: Àyíká ọ̀rọ̀ ń jiyàn fún àjíǹde ara nípasẹ̀ àpẹẹrẹ irúgbìn. Ìtumọ̀ yìí kò sọ àpẹẹrẹ náà di àsọyé lasán, bẹ́ẹ̀ ni kò yanjú ìfararora àti ìyàtọ̀ ara ìsinsìnyí àti ara àjíǹde kọjá ohun tí ọ̀rọ̀ sọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní ni a lò. ‘Àjíǹde’ àti ‘jí ... dìde’ jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá mọ̀ dáadáa; ‘ìdíbàjẹ́/àìlèdíbàjẹ́’ pa ìtakora orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ mú ìtumọ̀ àìlèpé títí hàn.
