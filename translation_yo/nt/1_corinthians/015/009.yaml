  to: Nítorí èmi ni ẹni tí ó kéré jù lọ nínú àwọn àpọ́sítélì, ẹni tí kò yẹ[a] kí a pè ní àpọ́sítélì, nítorí mo ṣe ìnúnibíni sí ìjọ Ọlọ́run.
