  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà dáadáa: Pọ́ọ̀lù ka ara rẹ̀ sí ọ̀kan nínú àwọn àpọ́sítélì, ṣùgbọ́n ó sọ pé òun kò yẹ fún orúkọ náà nítorí ìnúnibíni tí ó ṣe sí ìjọ Ọlọ́run. Síbẹ̀, “láti máa pè ní” fi àṣà ìṣe-tẹ̀síwájú/habitual kún ọ̀rọ̀ náà láìní ìdí nínú Gíríìkì, ó sì jẹ́ kí ẹni tí a ń pè ní àpọ́sítélì má hàn gbangba.'
  naturalness: “Ẹni tí kò yẹ kí a pè ní àpọ́sítélì” jẹ́ Yorùbá boṣewa tí ó rọrùn, tí ó sì ṣe kedere ju “ẹni tí kò yẹ láti máa pè ní àpọ́sítélì” lọ. “Nínú àwọn àpọ́sítélì” tún jẹ́ ọ̀nà àdánidá láti sọ ipò ẹni nínú ẹgbẹ́ kan.
  terminology: “Àpọ́sítélì,” “ìjọ Ọlọ́run,” àti “ìnúnibíni” yẹ fún ìtumọ̀ ọ̀rọ̀ náà àti fún ìforúkọsílẹ̀ ẹ̀sìn Yorùbá òde òní. A tún ṣàtúnṣe àmì ohùn nínú “ìnúnibíni.” Àmì àlàyé ìsàlẹ̀ ojú ewé gbọ́dọ̀ wà lórí “yẹ,” nítorí ἱκανός ni àlàyé náà ń ṣàlàyé, kì í ṣe àpọ́sítélì.
