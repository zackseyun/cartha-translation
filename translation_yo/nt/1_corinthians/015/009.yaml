    rationale: Gíríìkì náà kan sọ pé Pọ́ọ̀lù kò yẹ kí a pè é ní àpọ́sítélì. “Kí a pè ní” pa ìtumọ̀ yìí mọ́ láìfi ìṣesíwájú kún un.
