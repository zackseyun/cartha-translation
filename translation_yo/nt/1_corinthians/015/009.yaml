id: 1CO.15.9
reference: 1 Corinthians 15:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: yo
  text: Nítorí èmi ni ẹni tí ó kéré jù lọ nínú àwọn àpọ́sítélì, ẹni tí kò yẹ[a] kí a pè ní àpọ́sítélì, nítorí mo ṣe ìnúnibíni sí ìjọ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tóótun” tàbí “tó yẹ” kí a pè ní àpọ́sítélì.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé mọ́ pẹ̀lú ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti fi ìdí ọ̀rọ̀ múlẹ̀ ní Yorùbá.
- source_word: ἐλάχιστος
  choice: ó kéré jù lọ
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí ipò Pọ́ọ̀lù láàárín àwọn àpọ́sítélì, kì í ṣe bí ara rẹ̀ ṣe tóbi tàbí kéré.
- source_word: ἀπόστολος / ἀποστόλων
  choice: àpọ́sítélì / àwọn àpọ́sítélì
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹgbẹ́ àti iṣẹ́ àpọ́sítélì tí a mọ̀ dáadáa, kì í ṣe òjíṣẹ́ lásán.
- source_word: ἱκανός
  choice: yẹ
  rationale: “Yẹ” bá ìrẹ̀lẹ̀ Pọ́ọ̀lù mu, ó sì lè ní ìtumọ̀ jíjẹ́ ẹni tó tó, tó yẹ, tàbí tó pé fún orúkọ náà; àlàyé ìsàlẹ̀ ojú ewé pa àwọn ìtumọ̀ mìíràn mọ́.
- source_word: καλεῖσθαι
  choice: láti máa pè ní
  rationale: Ó ṣe àfihàn ìṣe aláìṣe-taara inú Gíríìkì ní Yorùbá àdánidá, ní ìtumọ̀ pé kí a máa fi orúkọ tàbí oyè náà pe e.
- source_word: διότι
  choice: nítorí
  rationale: Ó ṣàfihàn ìdí pàtó tí Pọ́ọ̀lù fi sọ pé òun kò yẹ fún orúkọ náà.
- source_word: ἐδίωξα
  choice: mo ṣe inúnibíni sí
  rationale: Ó sọ ìwà ọ̀tá àti ìpẹ̀yà tí Pọ́ọ̀lù ṣe sí àwọn onígbàgbọ́ tẹ́lẹ̀ ní kedere.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: ìjọ Ọlọ́run
  rationale: “Ìjọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwùjọ àwọn onígbàgbọ́, “Ọlọ́run” sì pa ìbátan inú gbolohun Gíríìkì mọ́.
- source_word: ὃς
  choice: ẹni tí
  rationale: Ó so ẹni tí Pọ́ọ̀lù jẹ́ mọ́ gbólóhùn tó sọ nípa àìyẹ rẹ̀, ó sì dùn mọ́ etí ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Pọ́ọ̀lù nípa jíjẹ́ àpọ́sítélì
  choice: Pọ́ọ̀lù fi ara rẹ̀ sínú ẹgbẹ́ àwọn àpọ́sítélì, síbẹ̀ ó sọ pẹ̀lú ìrẹ̀lẹ̀ pé òun kò yẹ fún orúkọ náà nítorí inúnibíni tí ó ṣe tẹ́lẹ̀.
  alternative: Kí a túmọ̀ ọ́ bí ẹni pé Pọ́ọ̀lù ń sẹ́ pé òun jẹ́ àpọ́sítélì rárá, tàbí pé ipò àwùjọ nìkan ló ń sọ̀rọ̀ nípa rẹ̀.
  rationale: “Èmi ni ó kéré jù lọ lára àwọn àpọ́sítélì” fi hàn pé ó ka ara rẹ̀ sí ọ̀kan lára wọn; “kò yẹ láti máa pè ní àpọ́sítélì” sì pa ìrẹ̀lẹ̀ àti ìdájọ́ ara rẹ̀ nítorí ìṣe rẹ̀ àtijọ́ mọ́, láìyọ ẹdọfu méjèèjì kúrò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọ̀wọ̀, àdánidá, tó ṣeé lóye fún òǹkàwé òde òní. A lo “ṣe inúnibíni sí” dípò ọ̀rọ̀ àtijọ́ tàbí èdè ẹ̀sìn tó le, a sì pa àtúnṣe ìrẹ̀lẹ̀ Pọ́ọ̀lù àti ìjẹ́pàtàkì oyè àpọ́sítélì mọ́.
