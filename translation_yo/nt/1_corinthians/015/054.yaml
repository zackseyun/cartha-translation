- from: 'Ṣùgbọ́n nígbà tí ohun tí ó ń díbàjẹ́ yìí bá wọ àìdíbàjẹ́, tí ohun tí ó lè kú yìí sì bá wọ àìkú, nígbà náà ni ọ̀rọ̀ tí a kọ sílẹ̀ yóò ṣẹ[a]: “A ti gbé ikú mì nínú ìṣẹ́gun.”[b]'
  to: 'Ṣùgbọ́n nígbà tí ohun tí ó lè díbàjẹ́ yìí bá wọ àìdíbàjẹ́, tí ohun tí ó lè kú yìí sì bá wọ àìkú, nígbà náà ni ọ̀rọ̀ tí a kọ sílẹ̀ yóò ṣẹ[a]: “A ti gbé ikú mì nínú ìṣẹ́gun.”[b]'
  rationale: Only φθαρτόν is adjusted, from an ongoing-decay expression to a dispositional expression meaning “liable to decay/perishable.” This improves fidelity while retaining the draft’s syntax, register, imagery, and theological neutrality.
