id: 1CO.15.54
reference: 1 Corinthians 15:54
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: yo
  text: 'Ṣùgbọ́n nígbà tí ohun tí ó lè díbàjẹ́ yìí bá wọ àìdíbàjẹ́, tí ohun tí ó lè kú yìí sì bá wọ àìkú, nígbà náà ni ọ̀rọ̀ tí a kọ sílẹ̀ yóò ṣẹ[a]: “A ti gbé ikú mì nínú ìṣẹ́gun.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà sí i: “ọ̀rọ̀ tí a kọ sílẹ̀ yóò ṣẹlẹ̀.” A tún lè túmọ̀ rẹ̀ pé, “yóò wá sí ìmúṣẹ̀.”'
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ yìí wá láti Aísáyà 25:8; ìsọ̀rọ̀ rẹ̀ fara mọ́ àṣà ọ̀rọ̀ Gíríìkì tí Pọ́ọ̀lù fa yọ.
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: ohun tí ó ń díbàjẹ́
  rationale: Ó fi ohun tí ìbàjẹ́ ń ṣẹlẹ̀ sí hàn gẹ́gẹ́ bí orúkọ, láìfi ‘ara’ kún ọ̀rọ̀ Gíríìkì ní tààràtà; ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere.
- source_word: ἐνδύσηται
  choice: bá wọ
  rationale: Ó pa àwòrán fífi aṣọ wọ̀ mọ́, bí ó tilẹ̀ jẹ́ pé ohun tí a wọ̀ níbí jẹ́ ànímọ́ tuntun.
- source_word: ἀφθαρσίαν
  choice: àìdíbàjẹ́
  rationale: Ó bá ‘ohun tí ó ń díbàjẹ́’ ṣe àtakò ní kedere, ó sì túmọ̀ sí ipò tí kò sí lábẹ́ ìbàjẹ́ mọ́.
- source_word: θνητὸν
  choice: ohun tí ó lè kú
  rationale: Ó sọ ipò jíjẹ́ ẹni tí ikú lè dé bá ní Yorùbá àdánidá, láìsọ pé ó ti kú.
- source_word: ἀθανασίαν
  choice: àìkú
  rationale: Ọ̀rọ̀ Yorùbá ṣókí, tààrà, tí ó túmọ̀ sí ipò tí ikú kò lè dé bá.
- source_word: γενήσεται
  choice: yóò ṣẹ
  rationale: Ní ìbámu pẹ̀lú ọ̀rọ̀ tí a ti kọ, ‘yóò ṣẹ’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ọ̀rọ̀ náà yóò wá sí ìmúṣẹ̀ tàbí yóò di ohun tí ó ṣẹlẹ̀, láìlo àgbékalẹ̀ líle tí kò wọ́pọ̀.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: ọ̀rọ̀ tí a kọ sílẹ̀
  rationale: Ó pa λόγος àti participle γεγραμμένος mọ́ ní ọ̀nà Yorùbá tí ó ṣe kedere, ó sì tọ́ka sí gbólóhùn Ìwé Mímọ́ tí ó tẹ̀ lé e.
- source_word: Κατεπόθη
  choice: A ti gbé ... mì
  rationale: Ó pa ohùn àìṣe-aláṣẹ àti àwòrán gbígbé ohun mì mọ́; perfect Yorùbá ‘A ti ...’ bá ìkéde tí a rí bí ohun tí ó ti ṣẹ ní àkókò ọjọ́ iwájú mu.
- source_word: εἰς νῖκος
  choice: nínú ìṣẹ́gun
  rationale: Ó sọ àbájáde ìparun ikú nínú ìṣẹ́gun ní Yorùbá tí ó lè yé ni, láìyí ìṣẹ́gun padà sí ẹni tí ó ṣe iṣẹ́ náà.
theological_decisions:
- issue: Ìtumọ̀ γενήσεται ní ìbáṣepọ̀ pẹ̀lú ọ̀rọ̀ Ìwé Mímọ́
  choice: yóò ṣẹ
  alternative: yóò ṣẹlẹ̀; yóò wá sí ìmúṣẹ̀
  rationale: ‘Yóò ṣẹ’ jẹ́ àdánidá pẹ̀lú ‘ọ̀rọ̀’ ní Yorùbá, ó sì pa ìtumọ̀ pé ohun tí a kọ yóò di òtítọ́ mọ́. Àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan ti γίνομαι hàn.
- issue: Àkókò àti aspect nínú Κατεπόθη ὁ θάνατος
  choice: A ti gbé ikú mì
  alternative: A gbé ikú mì; A ó gbé ikú mì
  rationale: Àpẹẹrẹ perfect Yorùbá mú kí ọ̀rọ̀ náà dúró gẹ́gẹ́ bí ohun tí ó ti pé ní àkókò ọjọ́ iwájú tí Pọ́ọ̀lù ń sọ̀rọ̀ nípa rẹ̀, láìsọ ọ́ di òtítọ́ aláìlópin tàbí yí aorist náà sí future.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ṣùgbọ́n ó lo ọ̀rọ̀ ìgbàlódé tí òǹkàwé lásán lè lóye. A pa àwòrán aṣọ nínú ἐνδύσηται àti àwòrán gbígbé ikú mì mọ́, a kò sì fi ‘ara’ sínú ọ̀rọ̀ pàtàkì bí ó tilẹ̀ jẹ́ pé àyíká ń tọ́ka sí ara.
