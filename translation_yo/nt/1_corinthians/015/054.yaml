review_pass:
  verdict: revise
  source_fidelity: The verse’s two parallel conditional clauses, clothing imagery, future realization of the written saying, and the passive swallowing image are substantially retained. However, “ohun tí ó ń díbàjẹ́” presents φθαρτόν as something presently decaying rather than as that which is perishable/liable to decay. “Ohun tí ó lè díbàjẹ́” better preserves the adjective’s dispositional force and its parallelism with “ohun tí ó lè kú.”
  naturalness: The Yoruba is generally clear, dignified, and natural. The revised wording makes the two substantival adjectives more balanced without making the phrasing technical.
  terminology: “Àìdíbàjẹ́,” “àìkú,” “ọ̀rọ̀ tí a kọ sílẹ̀,” and “ìṣẹ́gun” are suitable equivalents. The quotation’s generic-agent construction, “A ti gbé ikú mì,” preserves the Greek passive without identifying an agent.
  issues:
  - severity: low
    issue: Aspectual force of φθαρτόν
    rationale: “Ó ń díbàjẹ́” normally suggests an ongoing process of decay. In context φθαρτόν denotes what is perishable or subject to decay. “Ó lè díbàjẹ́” conveys this semantic force more accurately.
  revised_text: 'Ṣùgbọ́n nígbà tí ohun tí ó lè díbàjẹ́ yìí bá wọ àìdíbàjẹ́, tí ohun tí ó lè kú yìí sì bá wọ àìkú, nígbà náà ni ọ̀rọ̀ tí a kọ sílẹ̀ yóò ṣẹ[a]: “A ti gbé ikú mì nínú ìṣẹ́gun.”[b]'
