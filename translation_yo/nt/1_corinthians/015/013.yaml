  terminology: “Àjíǹde,” “àwọn òkú,” àti “Mèsáyà” bá ìtumọ̀ àti ìforúkọ oyè mu. “Krístì” gẹ́gẹ́ bí yíyàn mìíràn nínú àlàyé jẹ́ ìtọ́kasí tó bófin mu. Àlàyé ohùn àgbàṣe yẹ kí ó lo àpẹẹrẹ Yorùbá tó bá ìtumọ̀ àtúnṣe mu gan-an.
