  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ìjọ̀wọ́ ìdí-òfin εἰ δέ, ìtumọ̀ “àjíǹde àwọn òkú,” agbára ìfẹ̀sùn-ún-ròyìn οὐδέ, oyè Χριστός, àti ohùn àgbàṣe pípé ti ἐγήγερται mọ́. Àmọ́ ìkọ́lé àìfẹ́sẹ̀múlẹ̀ “a kò tilẹ̀ ti jí Mèsáyà dìde” nílò àtúnṣe sí ọ̀nà Yorùbá tí ó hàn gbangba jù.'
