  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: yo
  text: Ṣùgbọ́n bí kò bá sí àjíǹde àwọn òkú, nígbà náà a kò tilẹ̀ tíì jí Mèsáyà dìde.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Krístì.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tí ó túmọ̀ sí ẹni tí a fòróró yàn; “Mèsáyà” ni a lò nínú ẹsẹ yìí láti pa ìtumọ̀ oyè náà mọ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “Mèsáyà kò tíì jí dìde.” Ọ̀rọ̀-ìṣe Gíríìkì wà ní ohùn àgbàṣe (“a ti jí Mèsáyà dìde”), èyí tí ó lè tọ́ka sí ìṣe Ọlọ́run láì sọ ẹni tó ṣe é ní tààràtà.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: “Bí” ṣe àgbékalẹ̀ gbólóhùn oníwọ̀n, “ṣùgbọ́n” sì pa ìyípadà kékeré nínú àríyànjiyàn Paulu mọ́.
- source_word: ἀνάστασις νεκρῶν
  choice: àjíǹde àwọn òkú
  rationale: Èyí túmọ̀ sí àjíǹde àwọn ènìyàn tí ó ti kú gẹ́gẹ́ bí ẹgbẹ́ kan, kì í ṣe kìkì jíjáde láti àárín àwọn òkú.
- source_word: οὐκ ἔστιν
  choice: kò bá sí
  rationale: Ó fi ìṣàìsí tàbí àìní òtítọ́ àjíǹde hàn ní èdè Yorùbá àdánidá.
- source_word: οὐδὲ
  choice: nígbà náà, a kò tilẹ̀
  rationale: “Nígbà náà” mú àbájáde ọgbọ́n inú gbólóhùn náà hàn, “tilẹ̀” sì pa agbára ‘kódà ... kò’ mọ́.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Ní ibi yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
- source_word: ἐγήγερται
  choice: a kò ... ti jí ... dìde
  rationale: Ìkọ́lé aláìdárúkọ olùṣe yìí pa ohùn àgbàṣe àti ìtumọ̀ ìṣe tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ ṣì wà mọ́, láì sọ pé ta ni olùṣe.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Krístì
  rationale: “Mèsáyà” fi oyè ẹni tí a fòróró yàn hàn ní kedere, nígbà tí “Krístì” lè dà bí orúkọ lásán ní èdè Yorùbá.
- issue: Ohùn ἐγήγερται
  choice: a kò ti jí Mèsáyà dìde
  alternative: Mèsáyà kò ti jí dìde
  rationale: Àṣàyàn náà pa ohùn àgbàṣe Gíríìkì mọ́, ó sì fi ẹni tó ṣe ìṣe náà sílẹ̀ láìdárúkọ, dípò kí ó yí i padà sí ìṣe tí Mèsáyà fúnra rẹ̀ ṣe.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí ó ṣeé yé fún òǹkàwé òde òní ni a lò. “Àjíǹde” jẹ́ ọ̀rọ̀ ìgbàgbọ́ tí ó wọ́pọ̀, “Mèsáyà” sì pa ìtumọ̀ oyè Χριστός mọ́. Ìkọ́lé aláìdárúkọ “a ... jí ... dìde” jẹ́ àdánidá ní Yorùbá, ó sì yẹra fún fífi olùṣe kan sínú ọ̀rọ̀ tí Gíríìkì kò dárúkọ.
