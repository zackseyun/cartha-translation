  - severity: medium
    issue: Ìtumọ̀ ‘Ẹni Àmì Òróró’ nínú àlàyé (a)
    rationale: Èyí kì í ṣe àlàyé Yorùbá àdánidá fún ‘Anointed One’ ó sì lè dà bí ẹni tí a fi àmì òróró sàmì. ‘Ẹni tí a fi òróró yàn’ sọ ìtumọ̀ oyè náà ní kedere.
  - severity: low
    issue: ‘wíwà níbẹ̀’ nínú àlàyé (b)
    rationale: Ó túmọ̀ sí ‘being there’ ju ‘presence’ lọ. ‘Wíwà’ jẹ́ àṣàyàn tó kúrò ní ẹ̀kọ́ ìtumọ̀ àfikún, tí ó sì bá παρουσία mu.
