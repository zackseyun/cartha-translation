id: 1CO.15.23
reference: 1 Corinthians 15:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: yo
  text: 'Ṣùgbọ́n olúkúlùkù ní ìtòlẹ́sẹẹsẹ tirẹ̀: Mèsáyà ni àkọ́so,[a] lẹ́yìn náà àwọn tí ó jẹ́ ti Mèsáyà nígbà wíwá rẹ̀.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi” dípò “Mèsáyà” (Χριστός). Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “Ẹni tí a fi òróró yàn.”
    reason: alternative_reading
  - marker: b
    text: Tàbí “wíwà” tàbí “dídé” fún “wíwá” (παρουσία); ṣùgbọ́n nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí wíwá rẹ̀ ní ọjọ́ iwájú.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ó fi hàn pé ẹnì kọ̀ọ̀kan tàbí ẹgbẹ́ kọ̀ọ̀kan wà nínú ìtẹ̀lé àjíǹde tí àyíká ọ̀rọ̀ ń sọ.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: ní ipò tirẹ̀
  rationale: τάγμα lè túmọ̀ sí ipò, ìpele, tàbí ètò ìtẹ̀lé; ‘ní ipò tirẹ̀’ jẹ́ èdè Yorùbá àdánidá tí kò sọ àwòrán ológun di pàtàkì jù.
- source_word: ἀπαρχὴ
  choice: àkọ́so
  rationale: ‘Àkọ́so’ pa àwòrán èso àkọ́kọ́ tí a yà sí mímọ́ mọ́, ó sì ń tọ́ka sí ohun tí yóò tẹ̀ lé e.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Níhìn-ín ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè fún Ẹni Àmì Òróró, kì í ṣe bí orúkọ lásán.
- source_word: οἱ τοῦ Χριστοῦ
  choice: àwọn tí ó jẹ́ ti Mèsáyà
  rationale: Ó ṣàfihàn ìní àti jíjẹ́ tirẹ̀ ní kedere, láìfi ìtumọ̀ míì kún un.
- source_word: παρουσίᾳ
  choice: nígbà wíwá rẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ ọjọ́ iwájú yìí, παρουσία ń tọ́ka sí wíwá tàbí dé Mèsáyà; ‘wíwá’ jẹ́ kedere, ó sì pa ààyè ìtumọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστός níbi tí ó ti jẹ́ oyè tó ní ìtumọ̀ nípa àkókò ìkẹyìn
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń fi Ẹni Àmì Òróró àti àwọn tirẹ̀ wéra nínú ètò àjíǹde; nítorí náà, ìtumọ̀ oyè náà hàn gbangba.
- issue: Bóyá παρουσία yẹ kí a fi ọ̀rọ̀ ẹ̀kọ́ ìgbà ìkẹyìn tó jẹ́ ti ẹ̀ka ìgbàgbọ́ kan túmọ̀
  choice: wíwá
  alternative: wíwà níbẹ̀ tàbí dídé
  rationale: ‘Wíwá’ sọ ìṣẹ̀lẹ̀ ọjọ́ iwájú náà ní kedere láìdá àríyànjiyàn nípa ẹ̀kúnrẹ́rẹ́ ìṣẹ̀lẹ̀ náà parí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìtòlẹ́sẹẹsẹ gbolohun náà pa ìfi Mèsáyà sí ipò àkọ́so mọ́, láìfi ‘gẹ́gẹ́ bí’ kún apposition Gíríìkì.
