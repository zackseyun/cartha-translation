  to: 'Ṣùgbọ́n olúkúlùkù ní ìtòlẹ́sẹẹsẹ tirẹ̀: Mèsáyà ni àkọ́so,[a] lẹ́yìn náà àwọn tí ó jẹ́ ti Mèsáyà nígbà wíwá rẹ̀.[b]'
