id: 1CO.15.57
reference: 1 Corinthians 15:57
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: yo
  text: Ṣùgbọ́n ọpẹ́ ni fún Ọlọ́run, ẹni tí ó ń fún wa ní ìṣẹ́gun nípasẹ̀ Olúwa wa, Jésù, ẹni tí í ṣe Mèsáyà náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ Yorùbá ìbílẹ̀: “Jésù Kristi.” Orúkọ oyè Gíríìkì Χριστός túmọ̀ sí “Mèsáyà.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: ọpẹ́ ni fún
  rationale: Nínú gbólóhùn ìdúpẹ́ yìí, χάρις túmọ̀ sí fífi ọpẹ́ fún Ọlọ́run, kì í ṣe ‘oore-ọ̀fẹ́.’ ‘Ọpẹ́ ni fún Ọlọ́run’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ìyìn náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δὲ fi ìyípadà kékeré tí ó ní ìtakora hàn láti inú ọ̀rọ̀ ikú sí ìdúpẹ́ fún ìṣẹ́gun; ‘Ṣùgbọ́n’ mú ìyípadà àsọyé náà jáde.
- source_word: τῷ θεῷ
  choice: fún Ọlọ́run
  rationale: Dative náà fi ẹni tí a ń fún ní ọpẹ́ hàn; ‘fún Ọlọ́run’ jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere.
- source_word: τῷ διδόντι
  choice: ẹni tí ó ń fún
  rationale: Participle oní-àpilẹ̀kọ náà ṣàpèjúwe Ọlọ́run gẹ́gẹ́ bí olùfúnni. ‘Ń fún’ pa ìṣe tí ó ń bá a lọ tàbí ìṣe àṣà mọ́ láìfi àkókò kan pàtó lé e.
- source_word: ἡμῖν
  choice: wa
  rationale: Ó jẹ́ indirect object tí ó tọ́ka sí àwọn onígbàgbọ́ nínú ọ̀rọ̀ yìí.
- source_word: τὸ νῖκος
  choice: ìṣẹ́gun
  rationale: Ó tọ́ka sí ìṣẹ́gun pàtó lórí ikú tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ rẹ̀; ‘ìṣẹ́gun’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún νῖκος.
- source_word: διὰ
  choice: nípasẹ̀
  rationale: Pẹ̀lú genitive, διά fi ọ̀nà tàbí ẹni tí a fi ṣe ohun kan hàn; ‘nípasẹ̀’ pa ìtumọ̀ yẹn mọ́.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Olúwa wa
  rationale: ‘Olúwa’ jẹ́ ìtumọ̀ ọlá tó yẹ fún κύριος gẹ́gẹ́ bí orúkọ oyè Kristológì; ‘wa’ dúró fún ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Jésù ni orúkọ ẹni; Χριστός jẹ́ orúkọ oyè tó túmọ̀ sí ‘Mèsáyà,’ ẹni àmì òróró. Fífi ‘Mèsáyà’ sílẹ̀ mú ìtumọ̀ oyè náà hàn gbangba ju lílo ‘Kristi’ gẹ́gẹ́ bí apá orúkọ lọ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Mèsáyà nínú ọ̀rọ̀ àkọ́kọ́ (‘Jésù Mèsáyà’)
  alternative: Kristi (‘Jésù Kristi’)
  rationale: Χριστός lè dà bí apá orúkọ nínú lílò ìbílẹ̀, ṣùgbọ́n ó tún jẹ́ orúkọ oyè tó túmọ̀ sí ẹni àmì òróró, ìyẹn Mèsáyà. Ọ̀rọ̀ àkọ́kọ́ túmọ̀ oyè náà; àlàyé ìsàlẹ̀ pa àṣà ‘Kristi’ mọ́ fún àfiwé láìyanju gbogbo ìṣòro náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá ìpele àárín tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ọpẹ́ ni fún Ọlọ́run’ jẹ́ gbólóhùn ìdúpẹ́ àdánidá; ‘ẹni tí ó ń fún wa’ sì pa ànímọ́ ìṣe present participle mọ́. A fi àmì àlàyé [a] lẹ́yìn ‘Mèsáyà,’ ibi tí àlàyé náà kan ní tààrà.
