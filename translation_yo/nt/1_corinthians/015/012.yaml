id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: yo
  text: Ṣùgbọ́n bí a bá ń kéde pé a ti jí Mèsáyà dìde kúrò nínú àwọn òkú,[a] báwo ni àwọn kan láàárín yín ṣe lè sọ pé àjíǹde àwọn òkú kò sí?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ń kéde pé a ti jí Kristi dìde kúrò nínú àwọn òkú.” Ọ̀rọ̀ Gíríìkì Χριστός lè túmọ̀ sí “Mèsáyà” tàbí “Kristi”; a lo ìtumọ̀ oyè náà nínú ìtumọ̀ àkọ́kọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn, dípò lílo ‘Kristi’ bí ẹni pé ó jẹ́ orúkọ lásán.
- source_word: κηρύσσεται
  choice: a bá ń kéde
  rationale: Ìṣe àṣeparí aláìṣe (present passive) náà tọ́ka sí ìkéde ní gbangba tí ó ń bá a lọ; àkójọpọ̀ ‘a bá ń kéde’ jẹ́ èdè Yorùbá àdánidá tí ó tún pa agbára passive mọ́ láì sọ ẹni tó ń kéde ní pàtó.
- source_word: ἐκ νεκρῶν
  choice: kúrò nínú àwọn òkú
  rationale: Èyí pa àwòrán orísun náà mọ́ pé ó jáde láàárín àwọn tí ó ti kú, ó sì jẹ́ gbolohun Yorùbá tí ó ṣe kedere.
- source_word: ἐγήγερται
  choice: a ti jí ... dìde
  rationale: Perfect passive náà fi ìṣe tí a ti parí àti ipò tí àbájáde rẹ̀ ṣì dúró hàn; ‘a ti jí ... dìde’ tún pa passive náà mọ́, tí kò sì sọ ẹni tó ṣe ìṣe náà ní tààrà.
- source_word: πῶς
  choice: báwo ni ... ṣe lè
  rationale: 'Ọ̀nà yìí mú agbára ìbéèrè àtakò náà jáde ní Yorùbá: ọ̀rọ̀ àwọn kan kò bá ìkéde nípa Mèsáyà mu.'
- source_word: ἐν ὑμῖν τινες
  choice: àwọn kan láàárín yín
  rationale: Ó fi hàn pé àwọn tí Pọ́ọ̀lù ń tọ́ka sí jẹ́ apá kan nínú ìjọ Kọ́ríńtì.
- source_word: ἀνάστασις νεκρῶν
  choice: àjíǹde àwọn òkú
  rationale: Èyí túmọ̀ genitive náà gẹ́gẹ́ bí àjíǹde tí ó kan àwọn ẹni tí ó ti kú lápapọ̀, kì í ṣe ìṣẹ̀lẹ̀ àjíǹde ẹnì kan ṣoṣo.
- source_word: οὐκ ἔστιν
  choice: kò sí
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé jù lọ láti sọ pé ohun kan kò wà rárá.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú àríyànjiyàn Pọ́ọ̀lù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín, Χριστός ní agbára oyè ẹni tí a fòróró yàn. ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́, ṣùgbọ́n àkọ́lé ìsàlẹ̀ jẹ́ kí òǹkàwé mọ̀ pé ‘Kristi’ tún jẹ́ ìtumọ̀ tí ó ṣeé lò.
- issue: Ẹni tó jí Mèsáyà dìde
  choice: 'A kò dárúkọ ẹni náà ní tààrà: ‘a ti jí Mèsáyà dìde’'
  alternative: Ọlọ́run ti jí Mèsáyà dìde
  rationale: Gíríìkì lo passive láì dárúkọ olùṣe. Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Pọ́ọ̀lù sábà máa ń tọ́ka sí Ọlọ́run gẹ́gẹ́ bí olùṣe, a kò fi ohun tí kò hàn gbangba sínú ẹsẹ yìí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Ṣùgbọ́n’ ṣe aṣojú δὲ gẹ́gẹ́ bí àsopọ̀ ìyàtọ̀, láì fi ọ̀rọ̀ àkókò bí ‘ní báyìí’ kun un.
