id: 1CO.15.28
reference: 1 Corinthians 15:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí a bá ti fi ohun gbogbo sábẹ́ rẹ̀[a], nígbà náà ni a ó fi Ọmọ fúnra rẹ̀ pẹ̀lú sábẹ́ ẹni tí ó fi ohun gbogbo sábẹ́ rẹ̀, kí Ọlọ́run lè jẹ́ ohun gbogbo nínú ohun gbogbo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí “gbogbo nǹkan.” Gíríìkì tún “ohun gbogbo” ṣe léraléra, láti fi ìwọ̀n àgbáyé àríyànjiyàn Pọ́ọ̀lù hàn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ sí “kí Ọlọ́run lè jẹ́ ohun gbogbo nínú gbogbo ènìyàn.” Gbólóhùn Gíríìkì náà ṣókí, ó sì banilẹ́rù; kò sọ ní pàtó bóyá πᾶσιν (“gbogbo”) ń tọ́ka sí ohun gbogbo tàbí sí gbogbo ènìyàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: Ó so gbólóhùn yìí mọ́ àríyànjiyàn tó ṣáájú, ó sì fi àkókò hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ὑποταγῇ / ὑποταγήσεται / ὑποτάξαντι
  choice: fi ... sábẹ́ / wà lábẹ́
  rationale: Àwọn ọ̀rọ̀ wọ̀nyí pa ìtumọ̀ ìtẹríba tàbí fífi sí abẹ́ àṣẹ mọ́. A lo àpẹẹrẹ ọ̀rọ̀ kan náà ní gbogbo ẹsẹ̀, ṣùgbọ́n ‘wà lábẹ́’ jẹ́ ọ̀nà Yorùbá tó ṣe é ka fún passive ọjọ́ iwájú.
- source_word: αὐτῷ
  choice: rẹ̀
  rationale: Ní àyíká ẹsẹ̀ náà, arọ́pò-orúkọ náà ń tọ́ka sí Ọmọ.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì pa ìwọ̀n gbogbo àgbáyé tí ọ̀rọ̀ Gíríìkì náà ní mọ́.
- source_word: τότε
  choice: nígbà náà
  rationale: Ó fi ìpele tó tẹ̀ lé e nínú ìtòlẹ́sẹẹsẹ Pọ́ọ̀lù hàn ní kedere.
- source_word: αὐτὸς ὁ υἱὸς
  choice: Ọmọ fúnra rẹ̀ pẹ̀lú
  rationale: ‘Fúnra rẹ̀’ mú ìtẹnumọ́ αὐτός jáde, ‘pẹ̀lú’ sì fi hàn pé Ọmọ náà wà nínú ìtẹ̀síwájú fífi gbogbo ohun sábẹ́.
- source_word: τῷ ὑποτάξαντι
  choice: ẹni tí ó fi ... sábẹ́
  rationale: Ó pa ipa participle olórúkọ mọ́ láì fi orúkọ tí Gíríìkì kò sọ sínú gbólóhùn.
- source_word: ἵνα ᾖ
  choice: kí ... lè jẹ́
  rationale: Ó lè gbé ète tàbí àbájáde tí ἵνα pẹ̀lú subjunctive ní jáde ní Yorùbá.
- source_word: πάντα ἐν πᾶσιν
  choice: ohun gbogbo nínú ohun gbogbo
  rationale: Ó pa kíkún àti àìṣàlàyé gbólóhùn Pọ́ọ̀lù mọ́, dípò dídín πᾶσιν kù sí ‘gbogbo ènìyàn.’
theological_decisions:
- issue: Ìtẹríba Ọmọ fún ẹni tí ó fi ohun gbogbo sábẹ́ rẹ̀
  choice: A sọ ní tààrà pé Ọmọ fúnra rẹ̀ yóò wà lábẹ́ ẹni náà.
  alternative: Ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ìtẹríba nínú iṣẹ́ ìgbàlà nìkan, tàbí yíyẹra fún ọ̀rọ̀ ìtẹríba.
  rationale: Gíríìkì sọ ìtẹríba Ọmọ ní kedere. Ìtumọ̀ náà kò yẹ kí ó mú ọ̀rọ̀ náà rọ̀, bẹ́ẹ̀ ni kò yẹ kí ó fi ìtumọ̀ ẹ̀kọ́ ìsìn tó dé lẹ́yìn kún un.
- issue: Ìwọ̀n τὰ πάντα àti πάντα ἐν πᾶσιν
  choice: ohun gbogbo; ohun gbogbo nínú ohun gbogbo
  alternative: gbogbo nǹkan; ohun gbogbo nínú gbogbo ènìyàn
  rationale: Àṣàyàn yìí pa àtúnsọ àti ìwọ̀n àgbáyé ọ̀rọ̀ πᾶς mọ́, kò sì fi àlàyé pàtó kan lé πᾶσιν lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. Èdè náà ní iyì, ó ṣe é lóye fún òǹkàwé òde òní, ó sì pa àtúnsọ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìsìn inú Gíríìkì mọ́.
