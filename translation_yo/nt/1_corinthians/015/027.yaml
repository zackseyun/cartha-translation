id: 1CO.15.27
reference: 1 Corinthians 15:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: yo
  text: Nítorí ó ti tẹ ohun gbogbo sábẹ́ ẹsẹ̀ rẹ̀. Ṣùgbọ́n nígbà tí a bá sọ pé, “A ti tẹ ohun gbogbo sábẹ́ rẹ̀,” ó ṣe kedere pé ẹni tí ó tẹ ohun gbogbo sábẹ́ rẹ̀ kò sí lára “ohun gbogbo” náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àyàfi ẹni tí ó tẹ ohun gbogbo sábẹ́ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ ọ̀pọ̀ aláìlẹ́mìí yìí ní ìtumọ̀ tó gbòòrò sí gbogbo ohun, kì í ṣe gbogbo ènìyàn nìkan; ó sì pa ìtẹnumọ́ Sáàmù 8 mọ́.
- source_word: ὑπέταξεν / ὑποτέτακται
  choice: tẹ ... sábẹ́ / a ti tẹ ... sábẹ́
  rationale: ‘Tẹ ... sábẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ohun kan sí ipò ìṣàkóso ẹlòmíràn. ‘A ti tẹ’ fi ohùn àìṣe àti ipò tí ó ń bá a lọ hàn.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: sábẹ́ ẹsẹ̀ rẹ̀
  rationale: A pa àwòrán ọ̀rọ̀ inú Ìwé Mímọ́ fún ìṣàkóso àti ìṣẹ́gun mọ́ ní tààràtà.
- source_word: ὅταν δὲ εἴπῃ
  choice: nígbà tí Ìwé Mímọ́ sọ pé
  rationale: Gíríìkì kò sọ olùṣe náà ní kedere. Àyíká tọ́ka sí gbólóhùn Ìwé Mímọ́ tí Pọ́ọ̀lù ń tọ́ka sí; yíyan ‘Ìwé Mímọ́’ mú èyí yé kedere láì sọ pé Ọlọ́run fúnra rẹ̀ ni kókó ọ̀rọ̀-ìṣe náà.
- source_word: δῆλον
  choice: ó ṣe kedere
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bá ìdálẹ́kọ̀ọ́ tí Pọ́ọ̀lù retí kí olùkà rí mu.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: ẹni tí ó tẹ ohun gbogbo sábẹ́ rẹ̀ kò sí lára ‘ohun gbogbo’ náà
  rationale: Èyí tú ìtumọ̀ ìyọkúrò ti ἐκτός jáde ní Yorùbá àdánidá, ó sì fi hàn pé ẹni tó tẹ gbogbo ohun sábẹ́ Ọmọ náà kò wà nínú àwọn ohun tí a tẹ sábẹ́ rẹ̀.
- source_word: αὐτῷ
  choice: sábẹ́ rẹ̀
  rationale: Pẹ̀lú ọ̀rọ̀-ìṣe ‘tẹ ... sábẹ́,’ èyí jẹ́ ìṣètò Yorùbá àdánidá fún ẹni tí a fi gbogbo ohun sábẹ́ ìṣàkóso rẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ Ọmọ náà àti ẹni tí ó tẹ ohun gbogbo sábẹ́ rẹ̀
  choice: A sọ ní kedere pé ẹni tí ó tẹ ohun gbogbo sábẹ́ Ọmọ náà kò sí lára ‘ohun gbogbo’ tí a tẹ sábẹ́ rẹ̀.
  alternative: ‘àyàfi ẹni tí ó tẹ ohun gbogbo sábẹ́ rẹ̀’
  rationale: Ọ̀rọ̀ Pọ́ọ̀lù yà Ọmọ náà sọ́tọ̀ kúrò lọ́dọ̀ Ọlọ́run, ẹni tó tẹ gbogbo ohun sábẹ́ rẹ̀, láì dín iyì Ọmọ náà kù. Ìtumọ̀ náà pa ìyọkúrò àti ẹ̀dùn ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ẹsẹ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán ‘sábẹ́ ẹsẹ̀’ mọ́ nítorí ìbáṣepọ̀ rẹ̀ pẹ̀lú Sáàmù 8, a sì lo àlàyé díẹ̀ ní ìpín kejì láti jẹ́ kí ọgbọ́n ìyọkúrò Gíríìkì ṣe kedere.
