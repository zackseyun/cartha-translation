id: 1CO.15.1
reference: 1 Corinthians 15:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: yo
  text: Mo sì ń jẹ́ kí ẹ mọ̀, ẹ̀yin arákùnrin[a], ìhìn rere náà tí mo kéde fún yín, tí ẹ náà ti gbà, nínú rẹ̀ ni ẹ sì dúró ṣinṣin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin arákùnrin àti arábìnrin.” Ọ̀rọ̀ Gíríìkì náà ní “arákùnrin,” ṣùgbọ́n a sábà máa ń lo irú ọ̀rọ̀ akọ yìí láti bá gbogbo àwùjọ àwọn onígbàgbọ́ sọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: Mo ń sọ … di mímọ̀ fún yín
  rationale: Ó túmọ̀ sí láti sọ ohun kan di mímọ̀ tàbí láti jẹ́ kí ẹlòmíràn mọ̀ ọ́. Èyí tẹ̀ lé ìtumọ̀ gígùn ju ‘Mo ń rán yín létí’ lọ, nítorí ọ̀rọ̀ Gíríìkì náà kì í ṣe ọ̀rọ̀ pàtó fún rírántí.
- source_word: δὲ
  choice: sì
  rationale: δέ jẹ́ àmì ìyípadà ọ̀rọ̀ tí kò lágbára bí ìtakora; ‘sì’ jẹ́ ọ̀nà àdánidá láti so apá yìí mọ́ ohun tó ṣáájú láì fi ‘nísinsin yìí’ kún un.
- source_word: ἀδελφοί
  choice: ẹ̀yin arákùnrin
  rationale: A pa irú akọ ọ̀rọ̀ ìpè Gíríìkì mọ́. Nínú àwọn lẹ́tà Paulu, ó sábà máa ń tọ́ka sí gbogbo ìjọ, torí náà àlàyé wà ní àlàyé ìsàlẹ̀.
- source_word: τὸ εὐαγγέλιον
  choice: ìhìn rere náà
  rationale: ‘Ìhìn rere’ sọ ìtumọ̀ εὐαγγέλιον ní Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: εὐηγγελισάμην
  choice: mo kéde
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípolongo ìhìn rere. ‘Kéde’ jẹ́ Yorùbá àdánidá, ó sì yẹra fún àtúnsọ tí kò dùn bí ‘mo sọ ìhìn rere náà gẹ́gẹ́ bí ìhìn rere.’
- source_word: παρελάβετε
  choice: ẹ̀yin pẹ̀lú sì gbà
  rationale: ‘Gbà’ lè tọ́ka sí gbígba ìhìn tàbí àṣà tí a fi léni lọ́wọ́, láì fi ìtumọ̀ tó lágbára jù bí ‘ẹ fara mọ́ ọn’ sí i.
- source_word: ἐν ᾧ
  choice: nínú èyí tí
  rationale: A pa àwòrán ìhìn rere gẹ́gẹ́ bí ipò tàbí ààyè tí wọ́n dúró sí mọ́; ‘nínú èyí tí’ kò gbé ìtumọ̀ ẹsẹ kejì wá sí ẹsẹ yìí.
- source_word: ἑστήκατε
  choice: ẹ sì dúró ṣinṣin
  rationale: Perfect ἕστηκα ń fi ipò tí ó wà nísinsin yìí, tí ó jẹ́ àbájáde ohun tó ti ṣẹlẹ̀, hàn. ‘Dúró ṣinṣin’ sọ ìdúró tí kò yí padà ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοί nígbà tí a ń bá ìjọ tí ọkùnrin àti obìnrin wà nínú rẹ̀ sọ̀rọ̀
  choice: ‘ẹ̀yin arákùnrin’ nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé pé ó lè kan gbogbo àwọn onígbàgbọ́
  alternative: ‘ẹ̀yin arákùnrin àti arábìnrin’ tàbí ‘ẹ̀yin ọmọ ìyá’
  rationale: Èyí pa irú akọ tí Gíríìkì lò mọ́, ṣùgbọ́n kò fi òtítọ́ pé Paulu sábà máa ń fi ọ̀rọ̀ náà pe gbogbo ìjọ pamọ́.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A lò ‘ẹ̀yin’ fún àwùjọ, a sì pa ìtẹ̀síwájú àwọn gbólóhùn ìbátan inú Gíríìkì mọ́ láì mú kí Yorùbá le láti lóye.
