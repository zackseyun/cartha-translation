id: 1CO.15.31
reference: 1 Corinthians 15:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: yo
  text: Mo ń kú lójoojúmọ́—mo fi ìṣògo nítorí yín, tí mo ní gẹ́gẹ́ bí mo ti wà nínú Mèsáyà Jésù, Olúwa wa, búra pé òótọ́ ni.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní tààràtà sí i, “Lójoojúmọ́ ni mo ń kú.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì náà jẹ́ ọ̀rọ̀ ìbúra. Ó tún lè túmọ̀ sí, “Gẹ́gẹ́ bí ìṣògo tí mo ní nítorí yín ti dájú tó,” tàbí “mo fi ìṣògo yín búra.” Bí àpólà ìṣògo náà ṣe so mọ́ gbólóhùn yìí ṣì jẹ́ ohun tí a ń jiyàn lé lórí.
    reason: alternative_reading
  - marker: c
    text: 'Ìtumọ̀ ìbílẹ̀: “Kristi Jésù.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: lójoojúmọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘ní ọjọ́ kọ̀ọ̀kan’ tàbí ‘ojoojúmọ́,’ ó sì pa agbára ohun tí ń ṣẹlẹ̀ lemọ́lemọ́ mọ́.
- source_word: ἀποθνῄσκω
  choice: Mo ń kú
  rationale: Ọ̀rọ̀-ìṣe náà wà ní àkókò ìsinsìnyí, ó sì jẹ́ àwòrán ọ̀rọ̀ tó lágbára. ‘Mo ń kú’ kò túmọ̀ rẹ̀ sí ‘mo ń dojú kọ ikú’ lọ́nà àlàyé.
- source_word: νὴ
  choice: mo fi … búra pé òótọ́ ni
  rationale: νὴ jẹ́ patíkù ìmúdájú tí a máa ń lò nínú ọ̀rọ̀ ìbúra. Gbólóhùn Yorùbá yìí mú iṣẹ́ rẹ̀ hàn ní kedere ju lílo ‘nípasẹ̀’ lọ.
- source_word: τὴν ὑμετέραν καύχησιν
  choice: ìṣògo nítorí yín
  rationale: καύχησις lè túmọ̀ sí ìṣògo tàbí ohun tí ènìyàn fi ń ṣògo. Àpólà ἣν ἔχω mú kí ó ṣeé ṣe jù pé ìṣògo Pọ́ọ̀lù nípa àwọn ará Kọ́ríńtì ni, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìṣòro gírámà náà mọ́.
- source_word: ἣν ἔχω
  choice: tí mo ní
  rationale: Èyí túmọ̀ gbólóhùn arọ́pò-orúkọ náà ní tààràtà àti ní Yorùbá àdánidá.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: ‘Mèsáyà’ túmọ̀ Χριστός gẹ́gẹ́ bí oyè, ‘nínú’ sì pa èdè pàtàkì Pọ́ọ̀lù nípa ìṣọ̀kan pẹ̀lú Mèsáyà mọ́.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: Olúwa wa
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún κύριος pẹ̀lú arọ́pò-orúkọ ἡμῶν.
theological_decisions:
- issue: 'Bí a ó ṣe túmọ̀ Χριστῷ: oyè tàbí ọ̀nà orúkọ'
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Χριστός ní agbára oyè níbí; ‘Mèsáyà’ jẹ́ kí ìtumọ̀ oyè náà hàn, nígbà tí àṣàyàn ìbílẹ̀ wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ καύχησις pẹ̀lú ὑμετέραν
  choice: Ìṣògo Pọ́ọ̀lù nítorí àwọn ará Kọ́ríńtì
  alternative: Ìṣògo àwọn ará Kọ́ríńtì fúnra wọn / ìṣògo yín
  rationale: ‘Tí mo ní’ tọ́ka sí ohun tí Pọ́ọ̀lù ní, nítorí náà ìṣògo rẹ̀ nítorí wọn ló ṣeé ṣe jù. Síbẹ̀, ọ̀nà tí ὑμετέραν àti àpólà ìbúra náà gbà so pọ̀ kò ṣe kedere pátápátá, a sì ṣàkọsílẹ̀ èyí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò. A tú νὴ sí ọ̀rọ̀ ìbúra tó ye olùkà Yorùbá, dípò kí a da àkójọpọ̀ ọ̀rọ̀ Gíríìkì kọ́ ní líle. Àwọn àmì ohùn ni a fi sí ibi tí ó bá yẹ.
