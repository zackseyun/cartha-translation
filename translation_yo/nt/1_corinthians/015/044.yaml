revisions:
- from: A fún un sílẹ̀ gẹ́gẹ́ bí ara ti ẹ̀mí ẹ̀dá ènìyàn ń darí; a sì jí i dìde gẹ́gẹ́ bí ara tí Ẹ̀mí ń darí. Bí ara ti ẹ̀mí ẹ̀dá ènìyàn ń darí bá wà,[a] ara tí Ẹ̀mí ń darí sì wà pẹ̀lú.
  to: A gbìn ín gẹ́gẹ́ bí ara tí ìyè ẹ̀dá ènìyàn ń darí; a sì jí i dìde gẹ́gẹ́ bí ara tí Ẹ̀mí ń darí. Bí ara tí ìyè ẹ̀dá ènìyàn ń darí bá wà,[a] ara tí Ẹ̀mí ń darí náà sì wà.
  rationale: A rọ́pò “a fún un sílẹ̀” pẹ̀lú “a gbìn ín” láti tú σπείρεται sí ọ̀nà tó péye, tó sì mú àwòrán irúgbìn inú àyíká ẹsẹ̀ náà wá síta. A tún ṣe ìkẹyìn gbólóhùn náà ní kúkúrú pẹ̀lú “náà,” láìyí agbára àfikún καὶ tàbí ìtumọ̀ ẹsẹ̀ náà padà. Àmì akọ́sẹ̀ [a] wà ní ibi tó yẹ, a sì pa àìdánilójú ìtumọ̀ ọrọ̀ ψυχικόν/πνευματικόν mọ́ nínú àlàyé.
