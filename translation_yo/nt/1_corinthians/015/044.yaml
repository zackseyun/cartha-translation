id: 1CO.15.44
reference: 1 Corinthians 15:44
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: yo
  text: A gbìn ín gẹ́gẹ́ bí ara tí ìyè ẹ̀dá ènìyàn ń darí; a sì jí i dìde gẹ́gẹ́ bí ara tí Ẹ̀mí ń darí. Bí ara tí ìyè ẹ̀dá ènìyàn ń darí bá wà,[a] ara tí Ẹ̀mí ń darí náà sì wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí “ara ọlọ́kàn” ... “ara ti ẹ̀mí.” Ìyàtọ̀ tí Pọ́ọ̀lù ń fi hàn kì í ṣe láàárín ara ohun èlò àti ohun tí kì í ṣe ohun èlò, bí kò ṣe láàárín ara tí ìyè ẹ̀dá ènìyàn ń darí àti ara tí Ẹ̀mí ń darí.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεται
  choice: a fún un sílẹ̀
  rationale: Ọ̀rọ̀ yìí pa àwòrán fífún irúgbìn sílẹ̀ mọ́, ó sì bá àyíká ọ̀rọ̀ ikú àti àjíǹde mu; ìṣe aláìlórúkọ inú Gíríìkì náà ni a pa mọ́.
- source_word: σῶμα
  choice: ara
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ara ènìyàn, ó sì pa ìtumọ̀ àjíǹde ara mọ́.
- source_word: ψυχικόν
  choice: tí ẹ̀mí ẹ̀dá ènìyàn ń darí
  rationale: Ìtumọ̀ yìí jẹ́ kó yé òǹkàwé pé ara tó ń gbé nípa ìyè ẹ̀dá lásán ni Pọ́ọ̀lù ń sọ, kì í ṣe pé ara náà jẹ́ ohun ti ara nìkan tàbí pé ó burú nípa ti ẹ̀mí.
- source_word: ἐγείρεται
  choice: a jí i dìde
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere fún àjíǹde, ó sì pa ìṣe aláìlórúkọ orísun náà mọ́.
- source_word: πνευματικόν
  choice: tí Ẹ̀mí ń darí
  rationale: Ìtumọ̀ yìí fi ìbáṣepọ̀ pẹ̀lú Ẹ̀mí hàn láìsọ ara àjíǹde di ohun àìlẹ́ran tàbí ohun tí kò ní ara.
- source_word: Εἰ
  choice: Bí ... bá
  rationale: Èyí pa ìrísí gbólóhùn oníṣ条件 Gíríìkì mọ́ láìyí i sí ‘níwọ̀n bí’.
- source_word: καὶ
  choice: sì ... pẹ̀lú
  rationale: Ó fi agbára àfikún ọ̀rọ̀ náà hàn pé irú ara kejì náà tún wà.
theological_decisions:
- issue: Ìyàtọ̀ láàárín σῶμα ψυχικόν àti σῶμα πνευματικόν
  choice: Ara tí ẹ̀mí ẹ̀dá ènìyàn ń darí àti ara tí Ẹ̀mí ń darí
  alternative: ‘ara àdánidá’ àti ‘ara ti ẹ̀mí’; tàbí ‘ara ọlọ́kàn’ àti ‘ara ẹ̀mí’
  rationale: Yíyan ọ̀rọ̀ yìí pa ìyàtọ̀ Pọ́ọ̀lù mọ́ láàárín ìyè ẹ̀dá ènìyàn àti ìyè tí Ẹ̀mí ń darí, láìdá ìyàtọ̀ mìíràn sílẹ̀ láàárín ara ohun èlò àti ìwàláàyè àìní-ara.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ tó lọ́lá ṣùgbọ́n tó ṣeé lóye. A yà ‘ẹ̀mí ẹ̀dá ènìyàn’ sí kékeré kúrò lọ́dọ̀ ‘Ẹ̀mí’ tó ń tọ́ka sí Ẹ̀mí Ọlọ́run. Gbólóhùn ‘a fún un sílẹ̀’ pa àpẹẹrẹ irúgbìn inú àyíká ọ̀rọ̀ mọ́.
