revisions:
- from: Nígbà náà, a ó tilẹ̀ rí i pé ẹlẹ́rìí èké nípa Ọlọ́run ni àwa jẹ́[a], nítorí a jẹ́rìí nípa Ọlọ́run pé ó jí Mèsáyà náà dìde[b]—ẹni tí kò jí dìde, bí ó bá jẹ́ pé a kò jí àwọn òkú dìde ní tòótọ́.
  to: Nígbà náà, a sì rí wa gẹ́gẹ́ bí àwọn ẹlẹ́rìí èké nípa Ọlọ́run[a], nítorí a jẹ́rìí nípa Ọlọ́run pé ó jí Mèsáyà náà dìde[b]—ẹni tí Ọlọ́run kò jí dìde, bí ó bá jẹ́ pé a kò jí àwọn òkú dìde ní tòótọ́.
  rationale: The revision corrects the central agency error in the relative clause by making Ọlọ́run the subject of “kò jí dìde,” as required by the Greek. It also makes the plural false-witness predicate explicit and slightly improves the rendering of the passive “are found.” The lexical ambiguity concerning testimony “about” versus “against” God remains preserved in footnote a.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the inferential force, false witness terminology, the disputed relation to God, Messiah as a title, and the conditional assertion about resurrection. However, the relative clause “ẹni tí kò jí dìde” reverses the Greek voice/agency: it naturally says that the Messiah did not rise, whereas ὃν οὐκ ἤγειρεν says that God did not raise him.'
  naturalness: The Yoruba is generally clear and appropriately formal. “A sì rí wa gẹ́gẹ́ bí” gives a more direct and natural rendering of the passive εὑρισκόμεθα than “a ó tilẹ̀ rí i pé,” while retaining the logical consequence.
  terminology: “àwọn ẹlẹ́rìí èké,” “jẹ́rìí,” “Ọlọ́run,” “Mèsáyà,” and “jí ... dìde” are suitable Standard Yoruba choices. The note responsibly preserves the possible adversative force of κατὰ τοῦ θεοῦ without imposing it on the text.
  issues:
  - severity: high
    issue: The relative clause omits God as the agent and makes the Messiah the subject of “jí dìde.”
    rationale: 'The Greek relative pronoun is the object of ἤγειρεν, whose understood subject remains God: “whom he did not raise.” Yoruba must explicitly retain God as the one who did not raise the Messiah.'
  - severity: low
    issue: “ẹlẹ́rìí èké” is singular although Paul refers to plural witnesses.
    rationale: Using “àwọn ẹlẹ́rìí èké” better reflects ψευδομάρτυρες and is more natural with the plural subject àwa.
  revised_text: Nígbà náà, a sì rí wa gẹ́gẹ́ bí àwọn ẹlẹ́rìí èké nípa Ọlọ́run[a], nítorí a jẹ́rìí nípa Ọlọ́run pé ó jí Mèsáyà náà dìde[b]—ẹni tí Ọlọ́run kò jí dìde, bí ó bá jẹ́ pé a kò jí àwọn òkú dìde ní tòótọ́.
  revised_footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹlẹ́rìí èké lòdì sí Ọlọ́run ni àwa jẹ́ ... nítorí a jẹ́rìí lòdì sí Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹ̀rí nípa Ọlọ́run; ṣùgbọ́n gbólóhùn tó tẹ̀ lé e tún lè ní ìtumọ̀ tó lágbára pé ẹ̀rí èké náà ń tako Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.'
    reason: alternative_reading
  revision_rationale: The revision corrects the central agency error in the relative clause by making Ọlọ́run the subject of “kò jí dìde,” as required by the Greek. It also makes the plural false-witness predicate explicit and slightly improves the rendering of the passive “are found.” The lexical ambiguity concerning testimony “about” versus “against” God remains preserved in footnote a.
