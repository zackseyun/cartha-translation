id: 1CO.15.15
reference: 1 Corinthians 15:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: yo
  text: Nígbà náà, a sì rí wa gẹ́gẹ́ bí àwọn ẹlẹ́rìí èké nípa Ọlọ́run[a], nítorí a jẹ́rìí nípa Ọlọ́run pé ó jí Mèsáyà náà dìde[b]—ẹni tí Ọlọ́run kò jí dìde, bí ó bá jẹ́ pé a kò jí àwọn òkú dìde ní tòótọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹlẹ́rìí èké lòdì sí Ọlọ́run ni àwa jẹ́ ... nítorí a jẹ́rìí lòdì sí Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ẹ̀rí nípa Ọlọ́run; ṣùgbọ́n gbólóhùn tó tẹ̀ lé e tún lè ní ìtumọ̀ tó lágbára pé ẹ̀rí èké náà ń tako Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: a ó rí i pé ... ni àwa jẹ́
  rationale: 'Ó mú ìtumọ̀ pàsífù Gíríìkì náà jáde ní Yorùbá àdánidá: a ó fi hàn tàbí a ó mọ̀ wá sí irú ẹni bẹ́ẹ̀.'
- source_word: δὲ καὶ
  choice: Nígbà náà, a ó tilẹ̀
  rationale: “Nígbà náà” fi àbájáde ìjiyàn hàn, “tilẹ̀” sì pa agbára ìfikún καὶ mọ́.
- source_word: ψευδομάρτυρες
  choice: ẹlẹ́rìí èké
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ẹni tí ń jẹ́rìí èké, ó sì pa àwọ̀ ìdájọ́ ọ̀rọ̀ náà mọ́.
- source_word: τοῦ θεοῦ
  choice: nípa Ọlọ́run
  rationale: A mú jenitífù náà gẹ́gẹ́ bí ohun tí ẹ̀rí náà dá lé lórí; àlàyé ìtumọ̀ míì wà nínú àkọsílẹ̀ [a].
- source_word: ἐμαρτυρήσαμεν
  choice: a jẹ́rìí
  rationale: Ó pa ìtumọ̀ fífi ẹ̀rí hàn mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ àti tó níyì.
- source_word: κατὰ τοῦ θεοῦ
  choice: nípa Ọlọ́run
  rationale: Nínú àyíká yìí, a ka κατά pẹ̀lú jenitífù gẹ́gẹ́ bí ẹ̀rí tó ní Ọlọ́run gẹ́gẹ́ bí kókó; ìtumọ̀ “lòdì sí Ọlọ́run” ṣì ṣeé ṣe, a sì sọ ọ́ ní àkọsílẹ̀ [a].
- source_word: ἤγειρεν
  choice: ó jí ... dìde
  rationale: Ìṣe àkókò àtijọ́ náà ni a túmọ̀ sí ìgbésẹ̀ Ọlọ́run tó ti ṣẹlẹ̀.
- source_word: τὸν Χριστόν
  choice: Mèsáyà náà
  rationale: Àpilẹ̀kọ àti àyíká ìjiyàn nípa àjíǹde fi hàn pé Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí.
- source_word: ὃν οὐκ ἤγειρεν
  choice: ẹni tí kò jí dìde
  rationale: Ó pa gbólóhùn ìbátan àti àtúnṣe ọ̀rọ̀-ìṣe ṣáájú mọ́ fún agbára ìjiyàn.
- source_word: εἴπερ ἄρα
  choice: bí ó bá jẹ́ pé ... ní tòótọ́
  rationale: Ó fi àdéhùn tí Pọ́ọ̀lù ń lò fún ìjiyàn hàn láì sọ pé òun fúnra rẹ̀ gbà á.
- source_word: νεκροὶ
  choice: àwọn òkú
  rationale: Ó tọ́ka sí gbogbo àwọn ènìyàn tí ó ti kú, bí àfikún-orúkọ Gíríìkì tí a lò gẹ́gẹ́ bí orúkọ.
- source_word: οὐκ ἐγείρονται
  choice: a kò jí àwọn òkú dìde
  rationale: Ìṣètò Yorùbá yìí pa ohùn pàsífù Gíríìkì mọ́ ní ọ̀nà àdánidá, láì dárúkọ ẹni tó ń ṣe iṣẹ́ náà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà náà
  alternative: Kristi náà
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ní agbára oyè ju bí orúkọ ẹni lọ; “Mèsáyà” fi oyè ẹni àmì òróró náà hàn.
- issue: Agbára κατὰ τοῦ θεοῦ
  choice: nípa Ọlọ́run
  alternative: lòdì sí Ọlọ́run
  rationale: Ọ̀rọ̀ tó tẹ̀ lé e ṣàlàyé pé ẹ̀rí náà sọ ohun tí Ọlọ́run ṣe. Síbẹ̀, κατά pẹ̀lú jenitífù lè ní agbára “lòdì sí”; a pa ìṣòro yìí mọ́ nínú àkọsílẹ̀ dípò kí a dá a parí ní ìdákẹ́jẹ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “a ó rí i pé” láti mú ìmọ̀ràn ìdájọ́ inú εὑρισκόμεθα jáde, a sì yà gbólóhùn ìbátan náà sọ́tọ̀ pẹ̀lú àmì gígùn fún kíkà tó rọrùn.
