  text: ⸀ἄφρων, σὺ ὃ σπείρεις, οὐ ζῳοποιεῖται ἐὰν μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: yo
  text: Ìwọ aláìgbọ́n! Ohun tí ìwọ ń fún kì í yè bí kò bá kú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kì í sọ ọ́ di alààyè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: Ìwọ aláìlóye!
  rationale: Ó mú ìbáwí tààrà àti agbára ọ̀rọ̀ àpèjúwe náà hàn ní Yorùbá òde òní, láì jẹ́ ọ̀rọ̀ ẹ̀gàn tí ó le ju ti Gíríìkì lọ.
- source_word: σὺ
  choice: ìwọ
  rationale: A pa ọ̀rọ̀ arọ́pò-orúkọ tí a tẹnumọ́ ní Gíríìkì mọ́ nípasẹ̀ “ìwọ,” nínú ìkíni àti nínú gbólóhùn tó tẹ̀ lé e.
- source_word: ὃ σπείρεις
  choice: Ohun tí ìwọ ń fún
  rationale: “Fún” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún fífi irúgbìn sínú ilẹ̀, ó sì pa àwòrán iṣẹ́ àgbẹ̀ mọ́.
- source_word: ζῳοποιεῖται
  choice: kì í di alààyè
  rationale: Ó fi ìtumọ̀ gbígbé ohun wọ inú ìyè hàn ní èdè Yorùbá tí ó rọrùn; fọ́ọ̀mù aláìṣeṣe Gíríìkì kò ṣeé mú jáde ní ti gidi láì mú kí Yorùbá le.
- source_word: ἐὰν μὴ
  choice: bí kò bá
  rationale: Èyí ni ìṣàpẹẹrẹ àdánidá fún ipò tí ó túmọ̀ sí “àfi bí” tàbí “unless” ní Yorùbá.
- source_word: ἀποθάνῃ
  choice: kú
  rationale: Ọ̀rọ̀ náà jẹ́ títọ́, ó sì jẹ́ kí ohun tí a fún ni ẹni tí ó ń kú gẹ́gẹ́ bí àwòrán Gíríìkì.
theological_decisions:
- issue: Ìbáṣepọ̀ àkàwé ikú irúgbìn àti ìyè àjíǹde
  choice: Pa àkàwé iṣẹ́ àgbẹ̀ mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Ṣàlàyé gbólóhùn náà ní tààrà gẹ́gẹ́ bí ìlànà nípa àjíǹde ara.
  rationale: Pọ́ọ̀lù lo àpẹẹrẹ ohun tí a fún láti dá ìṣiyèméjì nípa àjíǹde lóhùn; ìtumọ̀ kò gbọ́dọ̀ yanjú àkàwé náà pẹ̀lú ọ̀rọ̀ tí kò sí nínú ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. “Aláìlóye” pa ìbáwí líle mọ́ láì lo ọ̀rọ̀ ẹ̀gàn tó le ju; “fún” sì pa àkàwé fífún irúgbìn mọ́.
