  text: μὴ πλανᾶσθε· φθείρουσιν ἤθη χρηστὰ ὁμιλίαι κακαί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/033.yaml
  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: yo
  text: 'Ẹ má ṣe jẹ́ kí a tàn yín jẹ́: “Ìbákẹ́gbẹ́ búburú ń ba ìwà rere jẹ́.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìjíròrò búburú ń ba ìwà rere jẹ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìbákẹ́gbẹ́ tàbí ìjíròrò; ìtumọ̀ tó gbòòrò, “ìbákẹ́gbẹ́,” ló bá àyíká ọ̀rọ̀ mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Ẹ má ṣe jẹ́ kí a tàn yín jẹ
  rationale: Ó jẹ́ ìkìlọ̀ tí ó bá ìrísí passive/middle Gíríìkì mu, láì fi dandan sọ bóyá ẹni náà ń tan ara rẹ̀ jẹ tàbí àwọn ẹlòmíràn ló ń tàn án.
- source_word: φθείρουσιν
  choice: ń ba ... jẹ́
  rationale: Ọ̀rọ̀ yìí sọ nípa bí ohun kan ṣe ń bàjẹ́ tàbí ṣe ń sọ ìwà di búburú; ‘ń ba ... jẹ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó pa agbára òwe náà mọ́.
- source_word: ἤθη
  choice: ìwà
  rationale: Níhìn-ín, ó tọ́ka sí ìwà rere tàbí àṣà ìgbé ayé ẹni, kì í ṣe ìlànà ìbáṣepọ̀ lasán. ‘Ìwà’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ fún èrò yìí.
- source_word: χρηστὰ
  choice: rere
  rationale: ‘Rere’ túmọ̀ ìtumọ̀ ìwà rere tí χρηστός ní ní àyíká yìí ní èdè Yorùbá tó rọrùn, tó sì bójú mu.
- source_word: ὁμιλίαι
  choice: ẹgbẹ́
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìbákẹ́gbẹ́ tàbí ìjíròrò. ‘Ẹgbẹ́’ mú ìtumọ̀ ìbákẹ́gbẹ́ pẹ̀lú àwọn ènìyàn jáde, èyí tí ó bá àyíká ọ̀rọ̀ mu dáadáa; a pa ìtumọ̀ ‘ọ̀rọ̀/ìjíròrò’ mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: κακαί
  choice: búburú
  rationale: ‘Búburú’ jẹ́ ìtumọ̀ tààrà, àdánidá fún ohun tí ó lè ṣèpalára nípa ìwà, láì mú un le ju bí ọ̀rọ̀ Gíríìkì ṣe béèrè lọ.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ṣe kedere, tó ní iyì, tí ó sì yẹ fún òwe. A lo ‘ẹgbẹ́ búburú’ gẹ́gẹ́ bí gbólóhùn àdánidá fún ìbákẹ́gbẹ́ tó lè ba ìwà jẹ́; àmì ohùn ni a fi sí ibi tí ó yẹ.
