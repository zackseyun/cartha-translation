id: 1CO.15.43
reference: 1 Corinthians 15:43
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: yo
  text: A gbìn ín nínú àìníyì; a jí i dìde nínú ògo. A gbìn ín nínú àìlera; a jí i dìde nínú agbára.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: A gbìn ín
  rationale: Ọ̀rọ̀ yìí pa àpèjúwe irúgbìn mọ́, ó sì lo ìṣètò Yorùbá àdáyébá fún ọ̀rọ̀ ìṣe tí a kò dárúkọ olùṣe rẹ̀. Arọ́pò-orúkọ ‘ín’ ń tọ́ka sí ara tí àyíká ọ̀rọ̀ ti mẹ́nu kàn.
- source_word: ἀτιμίᾳ
  choice: nínú àìníyì
  rationale: ‘Àìníyì’ túmọ̀ sí ipò tí kò ní ọlá tàbí iyì, ó sì dúró ní ìtakò kedere sí ‘ògo’ láìfi ìtumọ̀ ìtìjú ọkàn kún un.
- source_word: ἐγείρεται
  choice: a jí i dìde
  rationale: ‘Jí ... dìde’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún jíjí ẹni tàbí ohun dìde, pàápàá nínú ọ̀rọ̀ àjíǹde. Ìṣètò ‘a’ tí kò dárúkọ olùṣe pa Ọlọ́run gẹ́gẹ́ bí olùṣe mọ́ ní àìsọ̀rọ̀, bí Gíríìkì ṣe rí.
- source_word: δόξῃ
  choice: nínú ògo
  rationale: ‘Ògo’ ni ọ̀rọ̀ Yorùbá tó gún régé fún δόξα nínú àyíká àjíǹde, ó sì pa ìtakò rẹ̀ pẹ̀lú ‘àìníyì’ mọ́.
- source_word: ἀσθενείᾳ
  choice: nínú àìlera
  rationale: ‘Àìlera’ gbé ìtumọ̀ ailágbára àti ẹlẹ́gẹ́ ara jáde láìdín ọ̀rọ̀ Gíríìkì náà kù sí àìsàn nìkan.
- source_word: δυνάμει
  choice: nínú agbára
  rationale: ‘Agbára’ jẹ́ ìtakò àdáyébá sí ‘àìlera’ ó sì lè tọ́ka sí agbára ìyè tuntun, kì í ṣe okun ara nìkan.
theological_decisions:
- issue: Ohùn ọ̀rọ̀ àti olùṣe nínú èdè àjíǹde
  choice: Lo ‘a jí i dìde’ láìdárúkọ Ọlọ́run gẹ́gẹ́ bí olùṣe.
  alternative: Ọlọ́run jí i dìde.
  rationale: Gíríìkì lo ọ̀rọ̀ ìṣe aláìṣe, kò sì dárúkọ olùṣe. Ìtumọ̀ yìí pa iṣẹ́ Ọlọ́run tí a lóye mọ́ ní àìsọ̀rọ̀ dípò fífi ohun tí kò hàn gbangba sínú ọ̀rọ̀.
- issue: Ohun tí arọ́pò-orúkọ tí a kò sọ ní Gíríìkì ń tọ́ka sí
  choice: Lo ‘ín/i’ fún ara tí àyíká ọ̀rọ̀ ń sọ̀rọ̀ nípa rẹ̀.
  alternative: Tun ‘ara’ sọ nínú ìpín ọ̀rọ̀ kọ̀ọ̀kan.
  rationale: Àyíká ẹsẹ tó yí i ká ti fi ara hàn gẹ́gẹ́ bí ohun tí ọ̀rọ̀ ń tọ́ka sí. Arọ́pò-orúkọ Yorùbá mú kí gbolohun náà ṣàn dáradára láìfi àlàyé àfikún sí i.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó ní àmì ohùn, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. A pa ìṣọ̀kan àti ìtakò inú gbolohun Gíríìkì mọ́ nípasẹ̀ àtúnṣe ‘A gbìn ín ...; a jí i dìde ...’.
