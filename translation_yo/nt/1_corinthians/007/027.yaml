id: 1CO.7.27
reference: 1 Corinthians 7:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δέδεσαι γυναικί; μὴ ζήτει λύσιν· λέλυσαι ἀπὸ γυναικός; μὴ ζήτει γυναῖκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: yo
  text: Ṣé a ti dè ọ́ mọ́ aya? Má ṣe wá ìtúsílẹ̀[a]. Ṣé a ti tú ọ́ sílẹ̀ kúrò lọ́dọ̀ aya? Má ṣe wá aya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ tó túmọ̀ sí i síwájú sí i: “Ṣé o ti gbéyàwó? Má ṣe wá ìkọ̀sílẹ̀. Ṣé a ti kọ̀ ọ́ sílẹ̀? Má ṣe wá aya.” Ní ti gidi, Gíríìkì sọ nípa jíjẹ́ ẹni tí “a dè” àti ẹni tí “a tú sílẹ̀.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: a dè ọ́ mọ́
  rationale: Ó pa àwòrán ìdè inú ọ̀rọ̀ Gíríìkì mọ́, ó sì bá ìtúsílẹ̀/ìtú sílẹ̀ ní apá kejì mu, dípò lílo ọ̀rọ̀ ìtumọ̀ tó ṣe pàtó jù bí ‘o ti gbéyàwó.’
- source_word: γυναικί
  choice: aya
  rationale: Nínú ọ̀rọ̀ tó dá lórí ìgbéyàwó yìí, γυνή túmọ̀ sí aya, kì í ṣe obìnrin lásán.
- source_word: ζήτει
  choice: wá
  rationale: ‘Wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ζητέω, ó sì pa agbára àṣẹ náà mọ́.
- source_word: λύσιν
  choice: ìtúsílẹ̀
  rationale: Ó pa èrò yíyan ìdè tàbí ìtúsílẹ̀ mọ́, ó sì yẹra fún fífi ‘ìkọ̀sílẹ̀’ tó ṣe pàtó jù sínú ọ̀rọ̀ Gíríìkì.
- source_word: λέλυσαι
  choice: a ti tú ọ́ sílẹ̀
  rationale: Ìṣe àṣepé náà fi ipò tó jẹ́ àbájáde ìtúsílẹ̀ hàn; yíyan yìí sì pa ìbáṣepọ̀ rẹ̀ pẹ̀lú λύσιν mọ́.
- source_word: ἀπὸ γυναικός
  choice: kúrò lọ́dọ̀ aya
  rationale: ‘Kúrò lọ́dọ̀’ sọ ìyapa ἀπό ní Yorùbá àdánidá, ‘aya’ sì bá àyíká ìgbéyàwó mu.
- source_word: γυναῖκα
  choice: aya
  rationale: Ní àṣẹ ìparí, àyíká náà ń tọ́ka sí wíwá ẹni láti fẹ́, nítorí náà ‘aya’ péye ju ‘obìnrin’ lọ.
theological_decisions:
- issue: Bóyá kí a lo ọ̀rọ̀ ìgbéyàwó tó ṣe pàtó (‘gbéyàwó/kọ̀ sílẹ̀’) tàbí kí a pa àwòrán ìdè àti ìtúsílẹ̀ Pọ́ọ̀lù mọ́.
  choice: Pa àwòrán ‘dè’ àti ‘tú sílẹ̀’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Ṣé o ti gbéyàwó? Má ṣe wá ìkọ̀sílẹ̀. Ṣé a ti kọ̀ ọ́ sílẹ̀? Má ṣe wá aya.
  rationale: Gíríìkì lo èdè δέω/λύω, kì í ṣe ọ̀rọ̀ tó ṣe pàtó fún ìgbéyàwó tàbí ìkọ̀sílẹ̀. Àwòrán náà dáàbò bo àìdánilójú tó wà nínú orísun, kò sì dín ìtumọ̀ rẹ̀ kù sí ìkọ̀sílẹ̀ nìkan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Ìbéèrè ‘Ṣé’ jẹ́ àdánidá, àwọn àmì ohùn sì pé. A lo ìgbékalẹ̀ aláìdárúkọ ‘a dè ọ́/a ti tú ọ́’ láti fi ohùn passive Gíríìkì hàn láìsọ ẹni tó ṣe ìṣe náà.
