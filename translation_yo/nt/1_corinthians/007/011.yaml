  source_fidelity: Ìtumọ̀ náà mú ìyàtọ̀ tó wà láàárín χωρισθῇ (‘yà kúrò/yapa’) àti ἀφιέναι (‘fi/kọ aya sílẹ̀’) dáadáa. Àṣẹ méjèèjì náà, ìyẹn pé kí obìnrin náà máa wà láìgbéyàwó tàbí kí ó làjà pẹ̀lú ọkọ rẹ̀, àti pé ọkọ kò gbọdọ̀ fi aya rẹ̀ sílẹ̀, wà ní ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì.
  naturalness: Àtúnṣe kékeré sí ‘yà kúrò’ jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání ju ‘yapa’ lọ nínú àyíká ìyapa ọkọ àti aya. Ó tún jẹ́ kí àlàyé ẹsẹ̀-àlàyé [a] bá ọ̀rọ̀ àkọ́kọ́ mu dáadáa.
  terminology: ‘Láìgbéyàwó,’ ‘bá ọkọ rẹ̀ làjà,’ àti ‘kọ aya rẹ̀ sílẹ̀’ jẹ́ àwọn ọ̀rọ̀ tó bójú mu. ‘Kọ aya rẹ̀ sílẹ̀’ ṣàfihàn agbára ìgbéyàwó ti ἀφιέναι, láìfi ìtumọ̀ òfin kan tí kò dájú sínú χωρισθῇ.
  issues:
