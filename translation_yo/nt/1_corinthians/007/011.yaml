id: 1CO.7.11
reference: 1 Corinthians 7:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: yo
  text: Ṣùgbọ́n bí ó bá tilẹ̀ yà kúrò[a], kí ó dúró láìgbéyàwó, tàbí kí ó bá ọkọ rẹ̀ làjà—ọkọ kò sì gbọdọ̀ kọ aya rẹ̀ sílẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n bí ó bá yà kúrò.” Ọ̀rọ̀ Gíríìkì náà lè tún ní ìtumọ̀ ‘kódà bí ó bá yà kúrò’ díẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “má ṣe fi aya rẹ̀ sílẹ̀” tàbí “má ṣe lé aya rẹ̀ lọ.” Nínú àyíká ìgbéyàwó, ọ̀rọ̀ náà sábà máa ń tọ́ka sí kíkọ aya sílẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ χωρισθῇ
  choice: Ṣùgbọ́n bí ó bá tilẹ̀ yapa
  rationale: “Yapa” fi ìtumọ̀ ìyapa ọkọ àti aya hàn láìsọ ọ́ di ìkọ̀sílẹ̀ lábẹ́ òfin. “Bá tilẹ̀” tún pa agbára ìyọ̀ǹda tí καί lè ní mọ́.
- source_word: μενέτω ἄγαμος
  choice: kí ó dúró láìgbéyàwó
  rationale: “Kí ó dúró” mú àṣẹ μενέτω jáde, “láìgbéyàwó” sì sọ ipò ἄγαμος ní tààrà láìfi èrò míì kún un.
- source_word: καταλλαγήτω
  choice: kí ó bá ọkọ rẹ̀ làjà
  rationale: Ọ̀rọ̀ Yorùbá “bá … làjà” jẹ́ ọ̀nà àdánidá láti sọ ìpadà sí àlàáfíà àti ìbáṣepọ̀ rere tí καταλλάσσω ń tọ́ka sí.
- source_word: τῷ ἀνδρί
  choice: ọkọ rẹ̀
  rationale: Nínú àyíká ìgbéyàwó yìí, ἀνήρ túmọ̀ sí ọkọ, kì í ṣe ọkùnrin lásán.
- source_word: ἄνδρα γυναῖκα μὴ ἀφιέναι
  choice: ọkọ kò sì gbọdọ̀ kọ aya rẹ̀ sílẹ̀
  rationale: Gbólóhùn yìí fi ìfòfindè hàn. “Kọ aya rẹ̀ sílẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún fífi aya sílẹ̀ tàbí kọ ọ́ sílẹ̀ nínú ìgbéyàwó.
theological_decisions:
- issue: Bóyá χωρισθῇ àti ἀφιέναι yẹ kí a túmọ̀ wọn pẹ̀lú ọ̀rọ̀ kan náà
  choice: Lo “yapa” fún χωρισθῇ, kí a sì lo “kọ aya rẹ̀ sílẹ̀” fún ἀφιέναι.
  alternative: Lo “kọ ara wọn sílẹ̀” tàbí ọ̀rọ̀ ìkọ̀sílẹ̀ kan náà fún àwọn méjèèjì.
  rationale: Pọ́ọ̀lù lo ọ̀rọ̀ Gíríìkì méjì ọ̀tọ̀. Mímú ìyàtọ̀ náà dúró kò jẹ́ ká fi ìtumọ̀ ìkọ̀sílẹ̀ lábẹ́ òfin sínú χωρισθῇ, ó sì jẹ́ kí agbára ἀφιέναι nínú àyíká ìgbéyàwó hàn.
- issue: Bóyá a ó sọ akọ tàbí abo ẹni tó jẹ́ olùṣe χωρισθῇ ní gbangba
  choice: Lo arọ́pò-orúkọ abo “ó” ní ìbámu pẹ̀lú aya tí ẹsẹ tó ṣáájú ń sọ̀rọ̀ sí.
  alternative: Fi “aya náà” sínú ẹsẹ yìí ní gbangba.
  rationale: Èdè Gíríìkì kò tún orúkọ ẹni náà sọ nínú gbólóhùn yìí, ṣùgbọ́n àyíká fi hàn pé aya ni. Arọ́pò-orúkọ náà pa ìṣàn ọ̀rọ̀ mọ́ láìfi orúkọ tí kò sí nínú gbólóhùn orísun kún un.
translation_notes:
  register: A lo Yorùbá àkọ́sọ tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àmì ohùn wà níbi tí ó ti jẹ́ àdánidá. A gbé àmì àlàyé [b] sí ẹ̀yìn “kọ aya rẹ̀ sílẹ̀,” nítorí ibẹ̀ ni àlàyé nípa ἀφιέναι ti yẹ.
