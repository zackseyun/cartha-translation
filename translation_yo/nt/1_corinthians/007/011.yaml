revisions:
- from: Ṣùgbọ́n bí ó bá tilẹ̀ yapa[a], kí ó dúró láìgbéyàwó, tàbí kí ó bá ọkọ rẹ̀ làjà—ọkọ kò sì gbọdọ̀ kọ aya rẹ̀ sílẹ̀[b].
  to: Ṣùgbọ́n bí ó bá tilẹ̀ yà kúrò[a], kí ó dúró láìgbéyàwó, tàbí kí ó bá ọkọ rẹ̀ làjà—ọkọ kò sì gbọdọ̀ kọ aya rẹ̀ sílẹ̀[b].
  rationale: A tún ‘yapa’ ṣe sí ‘yà kúrò’ fún ìmúrasílẹ̀ Yorùbá tó rọrùn àti tó ṣe kedere nínú àyíká ìgbéyàwó. A tún ẹsẹ̀-àlàyé [a] kọ kí ó ṣàlàyé agbára ìfàsẹ́yìn tí καί lè ní, nígbà tí ọ̀rọ̀ àkọ́kọ́ kò fi ìtumọ̀ ìkọ̀sílẹ̀ pàtó sínú χωρισθῇ. Àwọn apá yòókù ni a pa mọ́ nítorí wọ́n jẹ́ olóòtọ́ sí orísun, wọ́n sì jẹ́ Yorùbá àkọ́sọ tó dára.
