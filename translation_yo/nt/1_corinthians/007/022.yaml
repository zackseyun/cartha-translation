reference: 1 Corinthians 7:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: yo
  text: Nítorí ẹrú tí a pè nínú Olúwa jẹ́ ẹni tí Olúwa ti dá sílẹ̀[a]; bákan náà, ẹni òmìnira tí a pè jẹ́ ẹrú Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ gangan: “ẹni tí Olúwa ti dá sílẹ̀,” tàbí “ẹni òmìnira ti Olúwa.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní pàtó sí ẹni tí a dá sílẹ̀ kúrò nínú ìfàṣẹrú.'
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹrú Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός túmọ̀ sí “Mèsáyà,” ìyẹn ẹni àmì-òróró.
    reason: title_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: ẹrú
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹni tí ó wà lábẹ́ ìní àti àṣẹ olúwa, kì í ṣe òṣìṣẹ́ tàbí ìránṣẹ́ lásán. ‘Ẹrú’ pa ìtakora tí Paulu fẹ́ hàn mọ́ nínú apá méjèèjì ẹsẹ náà.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Èyí pa àkànlò Pọ́ọ̀lù mọ́, ó sì lè túmọ̀ sí ipò tàbí ìṣọ̀kan ẹni náà pẹ̀lú Olúwa láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: κληθεὶς
  choice: nígbà tí a pè é
  rationale: Ó fi ohùn àìṣe ti ọ̀rọ̀ Gíríìkì hàn, ó sì jẹ́ èdè Yorùbá àdánidá fún ẹni tí ó ti jẹ́ ẹrú tàbí òmìnira nígbà ìpè náà.
- source_word: ἀπελεύθερος
  choice: ẹni tí Olúwa dá sílẹ̀ kúrò ní oko ẹrú
  rationale: Ọ̀rọ̀ náà ń tọ́ka ní pàtó sí ẹni tí a dá sílẹ̀ kúrò ní oko ẹrú. Gbólóhùn yìí ṣe kedere ní Yorùbá, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí ẹni tí a bí sí òmìnira.
- source_word: ὁμοίως
  choice: bákan náà
  rationale: Ó pa ìbáradọ́gba àti ìtakora ọ̀rọ̀ apá méjèèjì mọ́ ní èdè Yorùbá tó rọrùn.
- source_word: ἐλεύθερος
  choice: ẹni tí ó jẹ́ òmìnira
  rationale: Èyí ń sọ ipò ẹni tí kì í ṣe ẹrú, ó sì bá ìyàtọ̀ àwùjọ tí ẹsẹ náà dá lé mu.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni àmì-òróró náà níbí; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde dípò kí a lò ó bí orúkọ lásán.
- source_word: κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ jẹ́ oyè ọlọ́lá tí ó yẹ fún κύριος ní àyíká ọ̀rọ̀ nípa Jésù, ó sì ju ìbáṣepọ̀ olúwa àti ẹrú lásán lọ.
theological_decisions:
- issue: Ìtakora láàárín ipò ẹrú tàbí òmìnira ní àwùjọ àti jíjẹ́ ti Olúwa
  choice: A pa ‘ẹrú’ àti ‘ẹni tí a dá sílẹ̀ kúrò ní oko ẹrú’ mọ́ ní kíkún.
  alternative: Lílo ‘ìránṣẹ́’ àti ‘ẹni òmìnira’ ní ọ̀nà tí yóò mú ìtakora náà rọ̀.
  rationale: 'Paulu mọ̀ọ́mọ̀ yí ipò méjèèjì padà: ẹrú ní ti àwùjọ jẹ́ ẹni tí Olúwa dá sílẹ̀, ṣùgbọ́n ẹni òmìnira ní ti àwùjọ jẹ́ ẹrú Mèsáyà. Ìtumọ̀ kò gbọ́dọ̀ dín agbára ìtakora yìí kù.'
- issue: Ìtumọ̀ Χριστοῦ gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ọba ẹni àmì-òróró; ‘Mèsáyà’ jẹ́ kí agbára oyè náà hàn gbangba.
- issue: Ẹni tó ń dá ẹrú sílẹ̀ àti ẹni tí ẹni òmìnira náà jẹ́ tirẹ̀
  choice: Gbólóhùn àkọ́kọ́ sọ pé Olúwa dá ẹni náà sílẹ̀, nígbà tí ìtumọ̀ ìní inú κυρίου ṣì wà nínú àyíká ọ̀rọ̀.
  alternative: ‘Ẹni òmìnira ti Olúwa,’ èyí tí ó pa ìní mọ́ ní tààrà ṣùgbọ́n tí kò fi hàn gbangba pé ẹni náà ti jáde kúrò ní oko ẹrú.
  rationale: ἀπελεύθερος jẹ́ ọ̀rọ̀ fún ẹrú tí a dá sílẹ̀, ṣugbọn genitive κυρίου tún lè tẹnu mọ́ pé ẹni náà jẹ́ ti Olúwa. Àlàyé ìsàlẹ̀ ojú ìwé pa àṣàyàn kejì mọ́.
translation_notes:
  register: A lo Yorùbá àpéjọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A fi àmì ohùn síbi tí ó yẹ. Gbólóhùn náà pa ìṣọ̀kan apá méjèèjì àti ìtakora ẹrú/òmìnira mọ́, láì mú un di ẹ̀kọ́ ìjọ kan pàtó.
