base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: yo
  text: 'Ní ti àwọn ohun tí ẹ kọ̀wé nípa wọn: ó dára fún ọkùnrin láti má ṣe fọwọ́ kan obìnrin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gbólóhùn Gíríìkì náà túmọ̀ ní ti gidi sí “má fọwọ́ kan obìnrin”; nínú àyíká yìí, ó lè jẹ́ ọ̀rọ̀ àfiwé fún ṣíṣe ìbálòpọ̀.
    reason: Láti ṣàlàyé ìtumọ̀ àfiwé tí ó ṣeé ṣe láìpa àwòrán ọ̀rọ̀ orísun rẹ̀ nínú ẹsẹ̀.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: Ní ti àwọn ohun tí ẹ kọ̀wé nípa rẹ̀
  rationale: “Ní ti” ń fi ìyípadà sí kókó tí ó tẹ̀ lé hàn lọ́nà àdánidá, ó sì pa ìtumọ̀ “nípa àwọn ohun tí ẹ kọ” mọ́ láìfi ọ̀rọ̀ bí “nísinsìnyí” kún un.
- source_word: καλὸν ἀνθρώπῳ
  choice: ó dára fún ọkùnrin
  rationale: Èyí ṣe àfihàn ìdájọ́ “ó dára” àti ἀνθρώπῳ gẹ́gẹ́ bí ọkùnrin ní ìbámu pẹ̀lú γυναικός tó tẹ̀ lé e.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: láti má fi ọwọ́ kan obìnrin
  rationale: Ìtumọ̀ yìí pa àwòrán ọ̀rọ̀ Gíríìkì “má ṣe fọwọ́ kan obìnrin” mọ́, dípò yíyanju rẹ̀ ní pàtó sí ìbálòpọ̀, nítorí gbólóhùn náà lè jẹ́ ọ̀rọ̀ àfiwé fún ìbálòpọ̀ nínú àyíká yìí.
theological_decisions:
- issue: Bóyá “má fi ọwọ́ kan obìnrin” túmọ̀ sí fífi ọwọ́ kàn án ní ti ara tàbí ó jẹ́ ọ̀rọ̀ àfiwé fún ìbálòpọ̀
  choice: Pa àwòrán ọ̀rọ̀ náà mọ́ nínú ẹsẹ̀, kí àlàyé ìtumọ̀ àfiwé wà ní àlàyé ìsàlẹ̀.
  alternative: Túmọ̀ ọ́ ní tààrà sí “má ní ìbálòpọ̀ pẹ̀lú obìnrin.”
  rationale: Gíríìkì lo ἅπτεσθαι ní ti gidi, ṣùgbọ́n àyíká 1 Kọ́ríńtì 7 mú kí ìtumọ̀ àfiwé nípa ìbálòpọ̀ ṣeé ṣe gan-an. Pípa gbólóhùn náà mọ́ kò fi ipá yan ìtumọ̀ kan ṣoṣo.
- issue: Bóyá gbólóhùn “ó dára…” jẹ́ ọ̀rọ̀ tí àwọn ará Kọ́ríńtì kọ tàbí ìdáhùn Pọ́ọ̀lù
  choice: A kò fi àmì ọ̀rọ̀-àyọlò sí i.
  alternative: Fi àmì ọ̀rọ̀-àyọlò sí i láti fi hàn pé Pọ́ọ̀lù ń fa ọ̀rọ̀ wọn yọ.
  rationale: Àkọsílẹ̀ Gíríìkì kò ní àmì tó lè pinnu èyí, nítorí náà a pa àìdánilójú náà mọ́.
translation_notes:
  register: Èdè Yorùbá àgbàṣe, ọ̀wọ̀, tí ó sì yé òǹkàwé òde òní ni a lò. “Ẹ” dúró fún ọ̀pọ̀ ènìyàn tí Pọ́ọ̀lù ń bá sọ̀rọ̀. A yàgò fún èdè ẹ̀kọ́ ìsìn ẹ̀ka kan àti fún ṣíṣe àlàyé tó ju ohun tí orísun sọ lọ.
