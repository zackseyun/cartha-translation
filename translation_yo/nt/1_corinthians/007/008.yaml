id: 1CO.7.8
reference: 1 Corinthians 7:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγω δὲ τοῖς ἀγάμοις καὶ ταῖς χήραις, καλὸν ⸀αὐτοῖς ἐὰν μείνωσιν ὡς κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: yo
  text: 'Mo sì wí fún àwọn tí kò ní ọkọ tàbí aya[a] àti fún àwọn opó obìnrin pé: Ó dára fún wọn bí wọ́n bá dúró bí èmi náà ṣe wà[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọkùnrin tí kò ní aya,” nítorí ọ̀rọ̀ Gíríìkì náà wà ní ìrísí akọ púpọ̀; síbẹ̀, ìrísí akọ púpọ̀ lè dúró fún gbogbo ẹ̀ka náà nínú àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “gẹ́gẹ́ bí èmi náà [ṣe rí].”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Mo sì ń sọ
  rationale: δέ jẹ́ àsopọ̀ pẹ̀lẹ́; “sì” fi ìtẹ̀síwájú ọ̀rọ̀ hàn láì sọ ọ́ di àtakò líle, “ń sọ” sì jẹ́ ọ̀nà àdánidá láti gbé ọ̀rọ̀ ìmọ̀ràn yìí kalẹ̀.
- source_word: τοῖς ἀγάμοις
  choice: fún àwọn tí kò ní ọkọ tàbí aya
  rationale: ἄγαμος túmọ̀ sí ẹni tí kò ṣègbéyàwó. Gbólóhùn Yorùbá yìí jẹ́ kedere, ó sì jẹ́ kí ìtumọ̀ lè kan ọkùnrin àti obìnrin, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ìrísí akọ púpọ̀.
- source_word: ταῖς χήραις
  choice: fún àwọn opó
  rationale: χήρα ń tọ́ka pàtó sí obìnrin tí ọkọ rẹ̀ ti kú; “opó” ni ọ̀rọ̀ Yorùbá tó yẹ, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà fúnra rẹ̀ lè gbooro sí akọ tàbí abo ní Yorùbá.
- source_word: καλὸν
  choice: Ó dára
  rationale: καλός níbí sọ ohun tó dára tàbí tó yẹ, kì í ṣe dandan pé ó sàn ju ohun mìíràn lọ.
- source_word: αὐτοῖς
  choice: fún wọn
  rationale: Dátífù náà bá ọ̀rọ̀ Yorùbá “ó dára fún wọn” mu lọ́nà àdánidá.
- source_word: ἐὰν μείνωσιν
  choice: bí wọ́n bá dúró
  rationale: μένω túmọ̀ sí láti dúró tàbí máa bá ipò kan lọ; àyíká ọ̀rọ̀ fi hàn pé ó ń sọ nípa dídúró láìní ọkọ tàbí aya.
- source_word: ὡς κἀγώ
  choice: bí èmi náà ti wà
  rationale: κἀγώ jẹ́ καὶ ἐγώ, “èmi náà”; “ti wà” tọ́ka sí ipò Paulu nígbà náà láì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Ìwọ̀n àwọn tí τοῖς ἀγάμοις ń tọ́ka sí ní ìbáṣepọ̀ pẹ̀lú àwọn opó
  choice: Lo “àwọn tí kò ní ọkọ tàbí aya,” kí ó lè jẹ́ ẹ̀ka gbogbogbò, nígbà tí a tún mẹ́nu kan àwọn opó lọ́tọ̀.
  alternative: “Àwọn ọkùnrin tí kò ní aya,” gẹ́gẹ́ bí ìrísí akọ púpọ̀ ti Gíríìkì.
  rationale: Ìrísí Gíríìkì lè jẹ́ akọ ní pàtó tàbí akọ aṣojú gbogbo ènìyàn. Gbólóhùn gbogbogbò pa àìdánilójú yìí mọ́, àlàyé ìsàlẹ̀ sì sọ ìrísí akọ náà di mímọ̀.
- issue: Agbára καλὸν nínú ìmọ̀ràn Paulu
  choice: “Ó dára,” kì í ṣe “ó sàn jù.”
  alternative: “Ó sàn jù” tàbí “ó yẹ.”
  rationale: Ọ̀rọ̀ Gíríìkì náà kì í ṣe afiwéra níbí; “ó dára” kò fi ìdájọ́ afiwéra tí kò sí nínú orísun kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kedere ni a lò. “Kò ní ọkọ tàbí aya” yàgò fún “àpọ́n,” èyí tí ó lè dà bí ẹni tí kò tíì ṣègbéyàwó nìkan, ó sì dáàbò bo ìwọ̀n ìtumọ̀ ἄγαμος. Àmì ohùn ni a fi sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu.
