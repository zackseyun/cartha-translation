id: 1CO.7.21
reference: 1 Corinthians 7:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: yo
  text: A pè ọ́ nígbà tí o jẹ́ ẹrú? Má ṣe jẹ́ kí ó dààmú ọ. Ṣùgbọ́n bí o bá tilẹ̀ lè di òmìnira, kúkú lo àǹfààní náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kúkú lo ipò tí o wà nísinsìnyí,” ìyẹn ni pé, dúró gẹ́gẹ́ bí o ti wà. Ọ̀rọ̀ Gíríìkì náà, “kúkú lò ó,” kò sọ ohun tí a ó lò ní gbangba; a sì ti lóye rẹ̀ ní ọ̀nà méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: ẹrú
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ó wà lábẹ́ ìní àti àṣẹ olówó rẹ̀, kì í ṣe ìránṣẹ́ lásán; ọ̀rọ̀ nípa dídá sílẹ̀ di òmìnira mú ìtumọ̀ yìí ṣe kedere.
- source_word: ἐκλήθης
  choice: nígbà tí a pè ọ́
  rationale: Èyí pa ìṣe aláìlórúkọ inú Gíríìkì mọ́, ó sì jẹ́ kí àyíká ọ̀rọ̀ fi hàn pé ìpè Ọlọ́run ni, láìfi àlàyé tí kò sí nínú gbólóhùn náà kún un.
- source_word: μή σοι μελέτω
  choice: Má ṣe jẹ́ kí ó dààmú ọ
  rationale: Ó sọ ìtọ́ni pé kí ipò náà má ṣe fa àníyàn tàbí ìdààmú; gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa agbára ìtọ́ni onífẹ̀ẹ́ náà mọ́.
- source_word: ἐλεύθερος γενέσθαι
  choice: di òmìnira
  rationale: Ó fi ìyípadà láti ipò ẹrú sí ipò ẹni òmìnira hàn ní ṣókí àti ní èdè Yorùbá àdánidá.
- source_word: μᾶλλον χρῆσαι
  choice: kúkú lo àǹfààní náà
  rationale: Nítorí ohun tí a ó lò kò fara hàn gbangba nínú Gíríìkì, àyíká tó sún mọ́ ọn jù lọ ń tọ́ka sí àǹfààní láti di òmìnira. Àmọ́, a pa òye kejì mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Àìdánilójú ìtumọ̀ μᾶλλον χρῆσαι
  choice: Pọ́ọ̀lù ń gba ẹrú níyànjú láti lo àǹfààní òmìnira bí ó bá ṣeé ṣe.
  alternative: Pọ́ọ̀lù ń sọ pé kí ẹrú náà kúkú lo ipò tó wà nísinsìnyí, ìyẹn ni pé kí ó dúró gẹ́gẹ́ bí ó ti wà.
  rationale: Ìsọ̀kan gbólóhùn tó sún mọ́ ọn jù lọ mú kí àǹfààní dídọ̀mìnira jẹ́ ohun tí a kò sọ ní tààràtà lẹ́yìn ‘lò.’ Síbẹ̀, Gíríìkì kò sọ ohun náà ní gbangba, òye kejì sì ní ìtìlẹ́yìn pípẹ́; nítorí náà a kò mú àìdánilójú náà kúrò, ṣùgbọ́n a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ jẹ́ ti òde òní, ọlọ́lá, ó sì rọrùn fún òǹkàwé gbogbo. ‘Ẹrú’ ni a lò dípò ‘ìránṣẹ́’ láti fi ipò ìdè tí àyíká ọ̀rọ̀ ń sọ hàn. A lo ‘Ṣé’ gẹ́gẹ́ bí ìbẹ̀rẹ̀ ìbéèrè àdánidá, àti ‘kúkú’ láti mú agbára μᾶλλον jáde.
