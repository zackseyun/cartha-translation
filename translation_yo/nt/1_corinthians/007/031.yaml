id: 1CO.7.31
reference: 1 Corinthians 7:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: yo
  text: àti àwọn tí ń lo ayé, bí ẹni pé wọn kò lò ó dé ẹ̀kúnrẹ́rẹ́[a]; nítorí ìrísí ayé yìí[b] ń kọjá lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹni pé wọn kò lò ó ní kíkún”; ọ̀rọ̀ ìṣe náà tún lè ní ìtumọ̀ “bí ẹni pé wọn kò lò ó ní ọ̀nà àìtọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìrísí òde” tàbí “ìṣètò” ayé yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι
  choice: tí ń lo
  rationale: Ó túmọ̀ sí lílo tàbí fífi ohun kan ṣe iṣẹ́; ọ̀rọ̀ yìí rọrùn, ó sì pa ìtumọ̀ participle náà mọ́.
- source_word: τὸν κόσμον
  choice: ayé yìí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, κόσμος ń tọ́ka sí ètò ayé àti àwọn ohun inú rẹ̀ tí ènìyàn ń bá lò; ‘ayé yìí’ tún bá τούτου tó wà ní apá kejì mu.
- source_word: ὡς μὴ καταχρώμενοι
  choice: bí ẹni pé wọn kò lò ó dé ẹ̀kúnrẹ́rẹ́
  rationale: καταχράομαι lè túmọ̀ sí lílo ohun dé ẹ̀kúnrẹ́rẹ́ tàbí lílò ó ní ọ̀nà àìtọ́. Ìtumọ̀ yìí pa ìṣeré-ọ̀rọ̀ χρώμενοι/καταχρώμενοι mọ́ láì fi ìtumọ̀ ìwà búburú kan ṣoṣo lé e lórí.
- source_word: παράγει
  choice: ń kọjá lọ
  rationale: Ọ̀rọ̀ ìṣe ní àsìkò ìsinsìnyí ń fi ìlànà tó ń bá a lọ hàn; ‘ń kọjá lọ’ ṣàfihàn pé kò dúró pẹ́.
- source_word: σχῆμα
  choice: ìrísí
  rationale: σχῆμα ń tọ́ka sí fọ́ọ̀mù, ìrísí, tàbí ìṣètò tí ohun kan ní ní àkókò yìí, kì í ṣe dandan ìṣedá inú rẹ̀.
- source_word: τοῦ κόσμου τούτου
  choice: ayé yìí
  rationale: ‘Yìí’ pa agbára demonstrative τούτου mọ́, ó sì tọ́ka sí ètò ayé tó wà nísinsìnyí.
theological_decisions:
- issue: Ìtumọ̀ καταχρώμενοι ní ìbáṣepọ̀ pẹ̀lú χρώμενοι
  choice: Kí àwọn onígbàgbọ́ má ṣe lo ayé dé ẹ̀kúnrẹ́rẹ́ bí ẹni pé gbogbo ohun wọn wà nínú rẹ̀.
  alternative: Kí wọn má ṣe lo ayé ní ọ̀nà àìtọ́ tàbí fìyà jẹ ẹ́.
  rationale: Àpapọ̀ χρώμενοι àti καταχρώμενοι ní ìṣeré-ọ̀rọ̀ ‘lílo/lílo dé ẹ̀kúnrẹ́rẹ́.’ Àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘lílò ní ọ̀nà àìtọ́’ mọ́ gẹ́gẹ́ bí ohun tó ṣeé ṣe, láì yanju àìdánilójú náà ní ìkọ̀kọ̀.
- issue: Ìtumọ̀ σχῆμα
  choice: Ìrísí tàbí ìṣètò ayé tí ó wà nísinsìnyí, tí kò ní dúró.
  alternative: Ìrísí òde ayé nìkan, tàbí ìṣedá pàtàkì ayé.
  rationale: σχῆμα dá lórí fọ́ọ̀mù tàbí ìṣètò tí ayé ní báyìí, kì í ṣe ìṣedá inú rẹ̀; èyí bá παράγει, ‘ń kọjá lọ,’ mu.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘bí ẹni pé’ láti mú ὡς μὴ jáde lọ́nà àdánidá, a sì pa àìdánilójú lexical mọ́ nínú àlàyé ìsàlẹ̀.
