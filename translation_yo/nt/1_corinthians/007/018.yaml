id: 1CO.7.18
reference: 1 Corinthians 7:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: yo
  text: Ǹjẹ́ a pe ẹnikẹ́ni nígbà tí ó jẹ́ ẹni ìkọlà? Kí ó má ṣe gbìyànjú láti fi àmì ìkọlà rẹ̀ pamọ́ tàbí láti yí i padà[a]. Ǹjẹ́ a pe ẹnikẹ́ni nígbà tí ó jẹ́ aláìkọlà? Kí a má ṣe kọ ọ́ ní ilà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ gangan, “Kí ó má ṣe di aláìkọlà.” Èyí ń tọ́ka sí ìgbìyànjú láti bo tàbí yí ipa ìkọlà padà.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: nígbà tí ó ti kọlà
  rationale: Ọ̀rọ̀ náà jẹ́ perfect participle, ó sì tọ́ka sí ipò ẹni tí a ti kọ ní ilà tẹ́lẹ̀; gbolohun Yorùbá yìí sọ ipò yẹn ní kedere.
- source_word: ἐκλήθη / κέκληταί
  choice: a pe
  rationale: Ó pa èdè ìpè mọ́ láì túmọ̀ rẹ̀ sí ‘yí padà’ tàbí ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ mìíràn, bó tilẹ̀ jẹ́ pé nínú àyíká ọ̀rọ̀ ó ṣeé ṣe kí ó jẹ́ ìpè Ọlọ́run.
- source_word: ἐπισπάσθω
  choice: kí ó má ṣe gbìyànjú láti mú àmì ìkọlà náà kúrò
  rationale: Ìṣe náà túmọ̀ sí fífi ara pamọ́ tàbí yí àmì ìkọlà padà. Ìtumọ̀ yìí yé òǹkàwé òde òní, ó sì fi ìtumọ̀ gidi náà sí àlàyé ìsàlẹ̀.
- source_word: ἐν ἀκροβυστίᾳ
  choice: nígbà tí kò kọlà
  rationale: Ó sọ ipò àìkọlà ní Yorùbá àdánidá dípò lílo ọ̀rọ̀ gangan tí kò ní rọrùn láti lóye.
- source_word: περιτεμνέσθω
  choice: kí ó má ṣe kọlà
  rationale: Ìlànà pẹ̀lú μή jẹ́ ìdènà; ‘kí ó má ṣe’ fi agbára ìdènà náà hàn ní Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Ìtumọ̀ ‘a pe’ nínú àwọn gbólóhùn méjèèjì
  choice: A pa ‘a pe’ mọ́ gẹ́gẹ́ bí ìpè, tí àyíká ọ̀rọ̀ fi hàn pé ó ṣeé ṣe kí ó jẹ́ ìpè Ọlọ́run sínú ìgbésí ayé Kristẹni.
  alternative: Láti túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí ‘nígbà tí ó di onígbàgbọ́.’
  rationale: ‘A pe’ tẹ̀ lé καλέω, ó sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo lé e lórí, nígbà tí àyíká 1 Kọ́ríńtì 7 ń tọ́ka sí ìpè Ọlọ́run.
translation_notes:
  register: Èdè Yorùbá àfọwọ́ṣe tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. ‘Kọlà’ ni a lò gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìkọlà.
