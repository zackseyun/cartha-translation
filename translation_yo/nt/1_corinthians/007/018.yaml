  source_fidelity: Ìtumọ̀ náà ń tẹ̀ lé ìtumọ̀ gbogbogbò ti àwọn gbólóhùn Gíríìkì náà, ṣùgbọ́n “ó ti kọlà” àti “kò kọlà” lè dà bí iṣe tí ẹni náà fúnra rẹ̀ ṣe, níbi tí Gíríìkì ti ń sọ nípa ipò ẹni tí a ti kọ ní ilà tàbí tí a kò kọ ní ilà. Pẹ̀lú náà, “mú àmì ìkọlà náà kúrò” lè sọ pé a lè pa àmì náà rẹ́ pátápátá, nígbà tí ἐπισπάσθω ń tọ́ka ní pàtó sí ìgbìyànjú láti bo tàbí yí ipa ìkọlà padà.
