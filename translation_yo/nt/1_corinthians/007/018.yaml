  to: Ǹjẹ́ a pe ẹnikẹ́ni nígbà tí ó jẹ́ ẹni ìkọlà? Kí ó má ṣe gbìyànjú láti fi àmì ìkọlà rẹ̀ pamọ́ tàbí láti yí i padà[a]. Ǹjẹ́ a pe ẹnikẹ́ni nígbà tí ó jẹ́ aláìkọlà? Kí a má ṣe kọ ọ́ ní ilà.
