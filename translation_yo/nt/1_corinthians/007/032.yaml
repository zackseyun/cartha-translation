  - severity: low
    issue: “Ọkùnrin tí kò gbéyàwó”
    rationale: Ó lè túmọ̀ sí ọkùnrin tí kò tíì gbéyàwó rí. “Ọkùnrin tí kò ní aya” tọ́ka dáadáa sí ipò àìníyàwó tí ἄγαμος ń ṣàpèjúwe, láìfi ìtàn ìgbéyàwó rẹ̀ pinnu.
