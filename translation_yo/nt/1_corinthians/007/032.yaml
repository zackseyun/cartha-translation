review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ Gíríìkì dáadáa ní gbogbogbòò: δέ, ìfẹ́ Pọ́ọ̀lù, ìfẹ́ rẹ̀ pé àwọn olùgbọ́ má ṣe ní àníyàn, àti ìyàtọ̀ akọ-ẹyọ náà wà nínú rẹ̀. Síbẹ̀, “bí yóò ṣe wu Olúwa” lè dà bí ìwòye ọjọ́ iwájú tí ń sọ ohun tí yóò ṣẹlẹ̀ dájúdájú, dípò ìbéèrè/ète tí subjunctive ἀρέσῃ ń fihàn. “Tí kò gbéyàwó” sì lè gbọ́ bí ẹni tí kò tíì gbéyàwó rí, nígbà tí ὁ ἄγαμος ń tọ́ka ní fífẹ̀ sí ọkùnrin tí kò ní aya ní ipò òde-òní.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa, ó sì ní àmì ohùn tó péye ní púpọ̀. “Máa ń ronú nípa” jẹ́ èdè àdánidá, ṣùgbọ́n “máa ń bìkítà nípa” sun mọ́ μεριμνᾷ dáadáa ní àyíká yìí. “Bí ó ṣe lè mú inú Olúwa dùn” jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n-dání àti tó dá ìtumọ̀ πῶς ... ἀρέσῃ ṣẹ́.
  terminology: “Olúwa” yẹ fún κύριος. “Àwọn ohun ti Olúwa” pa ìfẹ̀ sí gbòòrò ti τὰ τοῦ κυρίου mọ́. A gbọdọ̀ pa “ọkùnrin” mọ́ nínú ọ̀rọ̀ pàtàkì, nítorí akọ ẹyọ ni Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ lè mẹ́nu kàn án pé ìtumọ̀ aláìlábùkù ni a lè lò ní àyíká.
