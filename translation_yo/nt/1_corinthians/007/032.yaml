id: 1CO.7.32
reference: 1 Corinthians 7:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: yo
  text: Ṣùgbọ́n mo fẹ́ kí ẹ má ní àníyàn. Ọkùnrin tí kò ní aya máa ń bìkítà nípa àwọn ohun ti Olúwa[a], bí ó ṣe lè mú inú Olúwa dùn;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí kò ní ọkọ tàbí aya.” Ọ̀rọ̀ Gíríìkì jẹ́ akọ ẹyọ (“ọkùnrin tí kò ní aya”), bí ó tilẹ̀ jẹ́ pé nínú àwọn ẹsẹ̀ tó yí i ká, Pọ́ọ̀lù ń sọ̀rọ̀ nípa ipò àwọn tí kò ní ọkọ tàbí aya àti àwọn tó ti gbéyàwó, ní ti ọkùnrin àti obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: Ṣùgbọ́n mo fẹ́
  rationale: θέλω jẹ́ ìfẹ́ tàbí ìfẹ́-ọkàn, δέ sì lè fi ìyàtọ̀ onírẹ̀lẹ̀ hàn sí ọ̀rọ̀ tó ṣáájú; “Ṣùgbọ́n” bá ìsopọ̀ náà mu.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: kí ẹ má ṣe ní àníyàn
  rationale: Ọ̀rọ̀ ἀμέριμνος túmọ̀ sí jíjẹ́ òmìnira kúrò nínú àníyàn tàbí ìdààmú ọkàn, kì í ṣe àìbìkítà pátápátá.
- source_word: ὁ ἄγαμος
  choice: Ọkùnrin tí kò gbéyàwó
  rationale: Ìṣètò Gíríìkì jẹ́ akọ ẹyọ; yíyan “ọkùnrin” pa ìtọ́kasí akọ mọ́, bí ó tilẹ̀ jẹ́ pé àyíká ẹsẹ̀ náà ń jíròrò ipò àwọn ọkùnrin àti obìnrin.
- source_word: μεριμνᾷ
  choice: máa ń ronú nípa
  rationale: μεριμνάω lè túmọ̀ sí ní àníyàn tàbí fi ọkàn sí ohun kan. Níhìn-ín, “ronú nípa” sọ ìtọ́jú àti ìfọkànsìn jáde láìjẹ́ kí ìtumọ̀ dà bí àníyàn búburú nìkan, ó sì pa ìbáṣepọ̀ pẹ̀lú ἀμερίμνους mọ́.
- source_word: τὰ τοῦ κυρίου
  choice: àwọn ohun ti Olúwa
  rationale: Gbólóhùn náà gbòòrò, ó ń tọ́ka sí àwọn ọ̀ràn tàbí ohun tó jẹ́ ti Olúwa; ìtumọ̀ yìí kò dín ìwọ̀n rẹ̀ kù.
- source_word: κυρίου / κυρίῳ
  choice: Olúwa
  rationale: “Olúwa” ni ọ̀rọ̀ Yorùbá tó yẹ fún κύριος gẹ́gẹ́ bí orúkọ oyè Kristẹni níhìn-ín.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: bí yóò ṣe wu Olúwa
  rationale: πῶς ń tọ́ka sí ọ̀nà tàbí ète, ἀρέσῃ sì jẹ́ subjunctive tó ń fi ìṣe tí a ń gbèrò hàn; “bí yóò ṣe wu” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún bí ẹni yóò ṣe mú inú Olúwa dùn.
theological_decisions:
- issue: Ìtọ́kasí akọ ẹyọ nínú ìfiwéra Pọ́ọ̀lù láàárín ẹni tí kò gbéyàwó àti ẹni tó ti gbéyàwó
  choice: 'Pa akọ ẹyọ mọ́ nínú ọ̀rọ̀ pàtàkì: “Ọkùnrin tí kò gbéyàwó”'
  alternative: “Ẹni tí kò gbéyàwó”
  rationale: ὁ ἄγαμος jẹ́ akọ ẹyọ ní gírámà, àwọn ẹsẹ̀ tó yí i ká sì ń sọ̀rọ̀ nípa ọkùnrin àti obìnrin lọ́tọ̀ọ̀tọ̀. Àlàyé ìsàlẹ̀ fi hàn pé ìjíròrò àyíká náà gbòòrò ju ọkùnrin nìkan lọ, láìyí fọ́ọ̀mù orísun padà.
translation_notes:
  register: Yorùbá boṣewa oníyì, tó ṣe kedere fún òǹkàwé òde òní. A lo “kí ẹ” fún ὑμᾶς ọ̀pọ̀ ènìyàn, a sì lo “máa ń ronú nípa” láti fi ìfọkànsìn tó ń bá a lọ hàn láìsọ ọ́ di àníyàn búburú nìkan. Àmì ohùn ni a fi sí ibi tí ó bá àṣà ìkọ̀wé Yorùbá mu.
