id: 1CO.7.33
reference: 1 Corinthians 7:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῇ γυναικί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: yo
  text: Ṣùgbọ́n ọkùnrin tí ó ti gbéyàwó ń fi ọkàn sí àwọn ohun ti ayé[a], bí yóò ṣe tẹ́ aya rẹ̀ lọ́rùn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọ̀ràn ayé” tàbí “àwọn àlámọ̀rí ayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: Ṣùgbọ́n ọkùnrin tí ó ti gbéyàwó
  rationale: Àpólà aláṣepọ̀ aorist tí ó ní article dúró gẹ́gẹ́ bí orúkọ, ó sì ń tọ́ka sí ọkùnrin tó ti gbéyàwó ní ìyàtọ̀ sí ẹni tí kò gbéyàwó nínú àyíká ọ̀rọ̀. ‘Ọkùnrin tí ó ti gbéyàwó’ pa akọ ẹyọ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μεριμνᾷ
  choice: ń ṣe àníyàn nípa
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ṣíṣe àníyàn, fífi ọkàn sí, tàbí àbójútó. Níhìn-ín kò pọn dandan kí ó túmọ̀ sí ìdààmú ẹ̀ṣẹ̀; ó ṣàpèjúwe bí ojúṣe ìgbéyàwó ṣe ń gba àfiyèsí ẹni.
- source_word: τὰ τοῦ κόσμου
  choice: àwọn ohun ti ayé
  rationale: Ìtumọ̀ yìí pa àkójọpọ̀ ọ̀rọ̀ náà mọ́, ó sì tọ́ka sí àwọn ọ̀ràn ìgbésí ayé ojoojúmọ́ láìfi ìtumọ̀ pé wọ́n burú ní ti ìwà kún un.
- source_word: πῶς ἀρέσῃ
  choice: bí yóò ṣe wu
  rationale: 'πῶς pẹ̀lú subjunctive ṣàlàyé ohun tí àníyàn rẹ̀ dá lé: ọ̀nà tí yóò fi ṣe ohun tí aya rẹ̀ fẹ́ tàbí tí yóò tẹ́ aya rẹ̀ lọ́rùn. ‘Bí yóò ṣe wu’ jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ náà mọ́.'
- source_word: τῇ γυναικί
  choice: aya rẹ̀
  rationale: Nínú àyíká ìgbéyàwó yìí, γυνή túmọ̀ sí ‘aya,’ kì í ṣe ‘obìnrin’ lásán. ‘Rẹ̀’ mú ìbáṣepọ̀ tí Gíríìkì fi sílẹ̀ láti lóye hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá κόσμος níhìn-ín ní ìtumọ̀ ìwà búburú
  choice: Túmọ̀ ọ́ láìdájọ́ gẹ́gẹ́ bí ‘ayé’ oziroma ‘àwọn ohun ti ayé.’
  alternative: Lílo ọ̀rọ̀ tí yóò fi hàn pé àwọn ohun náà jẹ́ ti ayé ní ọ̀nà búburú tàbí ẹlẹ́ṣẹ̀.
  rationale: Nínú àyíká ọ̀rọ̀, Pọ́ọ̀lù ń fi àwọn ojúṣe ìgbéyàwó wé fífi ọkàn tí kò pínyà sin Olúwa; kò sọ pé ìgbéyàwó tàbí àwọn ojúṣe ìgbésí ayé jẹ́ búburú. Ìtumọ̀ aláìdájọ́ pa ìfàgídí ẹ̀kọ́ inú ọ̀rọ̀ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Ń ṣe àníyàn nípa’ gba ìwọ̀n ìtumọ̀ μεριμνᾷ láàyè, nígbà tí àlàyé ẹsẹ̀ ìsàlẹ̀ fún τὰ τοῦ κόσμου ní àwọn ọ̀nà míì tí ó ṣeé lò.
