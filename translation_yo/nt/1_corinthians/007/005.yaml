id: 1CO.7.5
reference: 1 Corinthians 7:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: yo
  text: Ẹ má ṣe gba ara yín ní ohun tí ó yẹ fún ọkọọkan yín, àfi bóyá ẹ bá jọ fohùn ṣọ̀kan[a] fún àkókò kan, kí ẹ lè fi ara yín fún àdúrà. Lẹ́yìn náà, kí ẹ tún wà papọ̀[b], kí Sátánì má bàa dẹ yín wò nítorí àìlera láti kó ara yín níjàánu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “àfi bóyá pẹ̀lú ìfọwọ́sí pọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “kí ẹ tún wà papọ̀.” Nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí pípadà sí ìgbésí ayé papọ̀ gẹ́gẹ́ bí ọkọ àti aya, títí kan ìbáṣepọ̀ tímọ́tímọ́ wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστερεῖτε ἀλλήλους
  choice: fi ara yín dù ara yín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí dídá ohun tí ó tọ́ sí ẹnì kejì dúró. Nínú àyíká ọ̀rọ̀ ìgbéyàwó yìí, gbólóhùn Yorùbá yìí sọ ìtumọ̀ náà ní ọ̀nà àdánidá, pẹ̀lú ìwọ̀ntúnwọ̀nsì tí ó bá ti Gíríìkì mu.
- source_word: εἰ μήτι ἂν ἐκ συμφώνου
  choice: àfi bóyá bí ẹ bá jọ fohùn ṣọ̀kan
  rationale: “Àfi bóyá” pa ìṣọ́ra inú gbólóhùn Gíríìkì mọ́, “jọ fohùn ṣọ̀kan” sì fi hàn pé ọkọ àti aya méjèèjì gbọ́dọ̀ fara mọ́ ìpinnu náà.
- source_word: πρὸς καιρόν
  choice: fún ìgbà díẹ̀
  rationale: Ó fi hàn pé ìyapa náà jẹ́ ti àkókò tí a mọ̀, kì í ṣe ohun tí yóò máa bá a lọ láìlópin.
- source_word: σχολάσητε τῇ προσευχῇ
  choice: fi ara yín fún àdúrà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi àkókò àti àfiyèsí ẹni sí àdúrà.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: kí ẹ tún wà papọ̀
  rationale: Ó pa ọ̀nà ìsọ̀rọ̀ tí kò ṣe kedere jù ti Gíríìkì mọ́, nígbà tí àyíká ọ̀rọ̀ fi hàn pé ó kan pípadà sí ìbáṣepọ̀ ọkọ àti aya.
- source_word: πειράζῃ
  choice: dán yín wò
  rationale: Pẹ̀lú Sátánì gẹ́gẹ́ bí olùṣe, gbólóhùn náà ní ìtumọ̀ ìdẹwò sí ẹ̀ṣẹ̀; “dán yín wò” jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ fún èyí nínú àyíká bẹ́ẹ̀.
- source_word: ἀκρασίαν
  choice: àìní ìkóra-ẹni-níjàánu
  rationale: Ó sọ àìlera láti kó ìfẹ́ ara ẹni níjàánu ní kedere, láìlo ọ̀rọ̀ àtijọ́ tàbí ọ̀rọ̀ tí ó lè ṣìnà.
- source_word: Σατανᾶς
  choice: Sátánì
  rationale: Orúkọ ẹni ni a ṣe àkọsílẹ̀ rẹ̀ ní ìbámu pẹ̀lú ìlò Yorùbá tí ó ti fìdí múlẹ̀.
theological_decisions:
- issue: Bóyá kí a sọ πάλιν ἐπὶ τὸ αὐτὸ ἦτε ní kedere pé kí wọ́n tún ní ìbálòpọ̀
  choice: kí ẹ tún wà papọ̀
  alternative: kí ẹ tún ní ìbálòpọ̀
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ìbáṣepọ̀ tímọ́tímọ́ ọkọ àti aya, ṣùgbọ́n Gíríìkì sọ ọ́ ní ọ̀nà tí kò ṣe tààrà. Ìtumọ̀ yìí pa ìwọ̀ntúnwọ̀nsì àti àìṣedéédé rẹ̀ mọ́.
- issue: Bóyá Σατανᾶς jẹ́ orúkọ ẹ̀dá búburú kan tàbí àmì fún ọ̀tá lápapọ̀
  choice: Sátánì
  alternative: ọ̀tá náà
  rationale: Níbi yìí, Pọ́ọ̀lù ń tọ́ka sí Sátánì gẹ́gẹ́ bí ẹni kan; lílo orúkọ náà kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀, àti àmì ohùn ní kíkún. Gbólóhùn náà jẹ́ kedere fún òǹkàwé òde òní, ṣùgbọ́n ó pa ìsọ̀rọ̀ oníwọ̀ntúnwọ̀nsì ti orísun Gíríìkì mọ́, pàápàá nípa ìbálòpọ̀ ọkọ àti aya.
