id: 1CO.7.39
reference: 1 Corinthians 7:39
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: yo
  text: Aya kan wà lábẹ́ ìdè níwọ̀n ìgbà tí ọkọ rẹ̀ bá wà láàyè; ṣùgbọ́n bí ọkọ rẹ̀ bá sùn[a], ó ní òmìnira láti fẹ́ ẹni tí ó bá fẹ́, kìkì nínú Olúwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “bá kú.” Gíríìkì lo “bá sùn” gẹ́gẹ́ bí ọ̀rọ̀ ìrọ̀rùn tí ó wọ́pọ̀ fún ikú.'
    reason: lexical_alternative
  - marker: b
    text: A sábà máa ń lóye “kìkì nínú Olúwa” sí pé kí ó fẹ́ kìkì ẹni tí ó jẹ́ ti Olúwa, ìyẹn, onígbàgbọ́ mìíràn.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: Aya kan
  rationale: Nínú ọ̀rọ̀ tó dá lórí ìgbéyàwó yìí, γυνή túmọ̀ sí aya, kì í ṣe obìnrin lásán.
- source_word: δέδεται
  choice: wà ní ìdè
  rationale: Perfect passive náà fi ipò ìdè tó ń bá a lọ hàn; ‘wà ní ìdè’ pa agbára òfin àti ìbáṣepọ̀ ọ̀rọ̀ náà mọ́ láìfi ‘nípa òfin’ kún un.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: ní gbogbo ìgbà tí ... bá wà láàyè
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ iye àkókò tí ipò náà fi ń bá a lọ.
- source_word: ἀνήρ
  choice: ọkọ
  rationale: Àyíká ìgbéyàwó mú kí ἀνήρ túmọ̀ sí ọkọ níhìn-ín.
- source_word: κοιμηθῇ
  choice: bá sùn
  rationale: A pa àkàwé orísun náà mọ́; nínú àyíká yìí ‘sùn’ jẹ́ ọ̀rọ̀ ìrọ̀rùn fún ikú, a sì ṣàlàyé rẹ̀ ní àlàyé ìsàlẹ̀.
- source_word: ἐλευθέρα ἐστίν
  choice: ó ní òmìnira
  rationale: Ó fi ìtúsílẹ̀ kúrò nínú ìdè ìgbéyàwó àkọ́kọ́ hàn ní Yorùbá tó ṣe kedere.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: láti fẹ́ ẹni tí ó bá fẹ́
  rationale: Yorùbá sábà máa ń lo ‘fẹ́’ fún gbígbéyàwó, àyíká sì yà á sọ́tọ̀ kúrò nínú ìtumọ̀ ‘fẹ́ràn’ tàbí ‘fẹ́ ṣe’; gbólóhùn náà pa òmìnira yíyan ọkọ tuntun mọ́.
- source_word: μόνον ἐν κυρίῳ
  choice: kìkì nínú Olúwa
  rationale: Ìtumọ̀ yìí pa ìhámọ́ μόνον àti ọ̀rọ̀ Pọ́ọ̀lù ‘nínú Olúwa’ mọ́ láìṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ ‘nínú Olúwa’ nínú ìtọ́ni nípa ṣíṣe ìgbéyàwó lẹ́ẹ̀kan sí i
  choice: kìkì nínú Olúwa
  alternative: kìkì sí ẹni tí ó jẹ́ ti Olúwa; tàbí ní ọ̀nà tó bá ìfọkànsìn sí Olúwa mu
  rationale: ἐν κυρίῳ jẹ́ gbólóhùn ṣókí tó ní agbára ẹ̀kọ́ ìgbàgbọ́, ó sì lè gba ìtumọ̀ tó ju ẹyọ kan lọ. Mímú un wá ní tààrà pa ìṣòro ìtumọ̀ náà mọ́, kò sì fi ẹ̀kọ́ ẹgbẹ́ ìjọ kan kún ọ̀rọ̀.
- issue: Lílo àkàwé oorun fún ikú
  choice: bá sùn
  alternative: bá kú
  rationale: κοιμηθῇ lo àkàwé oorun dípò ọ̀rọ̀ tààrà fún ikú. A pa àkàwé náà mọ́ nínú àyọkà, a sì fún ni ní ìtumọ̀ kedere ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní èdè àdánidá, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. ‘Wà ní ìdè’ àti ‘nínú Olúwa’ mọ́ ìfarahàn òfin àti ìmọ̀ ẹ̀kọ́ ìgbàgbọ́ ti orísun náà; ‘bá sùn’ sì pa àkàwé Gíríìkì mọ́.
