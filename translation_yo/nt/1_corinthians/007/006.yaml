  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω κατὰ συγγνώμην, οὐ κατ’ ἐπιταγήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: yo
  text: Ṣùgbọ́n mo sọ èyí gẹ́gẹ́ bí ìyọ̀ǹda[a], kì í ṣe gẹ́gẹ́ bí àṣẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ìfààyè” tàbí “nípasẹ̀ ìfààyè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí tọ́ka sí ohun tí Pọ́ọ̀lù ń sọ ní àyíká ẹsẹ náà, láì fi tipátipá pinnu bóyá ó ń tọ́ka sẹ́yìn tàbí síwájú.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn láàárín gbólóhùn yìí àti àṣẹ tí ó mẹ́nu kàn.
- source_word: λέγω
  choice: mo sọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí ní àyíká yìí.
- source_word: κατὰ συγγνώμην
  choice: gẹ́gẹ́ bí ààyè tí mo ń fún yín
  rationale: Ó sọ pé ohun tí Pọ́ọ̀lù ń sọ jẹ́ ohun tí ó yọ̀ǹda fún wọn, kì í ṣe ohun tí ó pàṣẹ; ọ̀rọ̀ yìí sì ṣe kedere fún òǹkàwé Yorùbá òde òní.
- source_word: οὐ κατ’ ἐπιταγήν
  choice: kì í ṣe gẹ́gẹ́ bí àṣẹ
  rationale: Ó pa ìyàtọ̀ tó wà nínú Gíríìkì mọ́ láàárín ìyọ̀ǹda àti àṣẹ aláṣẹ.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Pọ́ọ̀lù jẹ́ ìyọ̀ǹda tàbí àṣẹ tí ó dè gbogbo ènìyàn
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí ààyè tí Pọ́ọ̀lù ń fún wọn, kì í ṣe àṣẹ.
  alternative: A lè ka ọ̀rọ̀ náà sí ìmọ̀ràn tí ó ṣì ní agbára àpọ́sítélì.
  rationale: Ẹsẹ náà fúnra rẹ̀ fi ìyọ̀ǹda àti àṣẹ wé ara wọn; ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́ láì dín ipò Pọ́ọ̀lù kù tàbí yanju ìforígbárí ẹ̀kọ́ ìgbàgbọ́ ju ohun tí ọ̀rọ̀ náà sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “ààyè tí mo ń fún yín” láti mú ìtumọ̀ συγγνώμην jáde ní èdè àdánidá, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ọ̀nà títúmọ̀ míì mọ́.
