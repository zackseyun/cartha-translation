  source_fidelity: Ìtumọ̀ náà ń pa ìyàtọ̀ pàtàkì tó wà láàárín συγγνώμην (‘ìyọ̀ǹda/ìfààyè’) àti ἐπιταγήν (‘àṣẹ’) mọ́. Síbẹ̀, gbolohun “ààyè tí mo ń fún yín” fi ohun-ìṣe ‘yín’ kún un tí kò sí nínú Gíríìkì, ó sì mú kí ìtumọ̀ náà hàn bí ìfààyè pàtó tí a ń fi fún àwọn olùgbọ́ dípò ìsọ̀rí ìtumọ̀ Pọ́ọ̀lù gẹ́gẹ́ bí concessive.
