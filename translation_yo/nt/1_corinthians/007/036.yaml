  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbo rẹ̀: ó pa àìdánilójú tó wà nínú “παρθένον αὐτοῦ” mọ́, ó sì túmọ̀ ìdíwọ̀n ìwà, ipò ọjọ́-orí, ìjẹ́pàtàkì tí a kò ṣàlàyé, ìyọ̀ǹda, àti àṣẹ ìkẹyìn ní òtítọ́. Síbẹ̀, “ṣe ìgbéyàwó” lè túmọ̀ sí ṣíṣe ayẹyẹ ìgbéyàwó dípò wíwọ ìdè ìgbéyàwó; “gbẹ́yàwó” dara jù fún γαμείτωσαν.'
