revisions:
- from: Ṣùgbọ́n bí ẹnikẹ́ni bá rò pé òun ń hùwà tí kò bójú mu sí wúńdíá tirẹ̀[a], bí ó bá ti kọjá ìgbà èwe rẹ̀, tí ó sì yẹ kí ó rí bẹ́ẹ̀, kí ó ṣe ohun tí ó fẹ́; kò dẹ́ṣẹ̀. Kí àwọn méjèèjì ṣe ìgbéyàwó.
  to: Ṣùgbọ́n bí ẹnikẹ́ni bá rò pé òun ń hùwà tí kò bójú mu sí wúńdíá tirẹ̀[a], bí wúńdíá náà bá ti kọjá ìgbà èwe rẹ̀, tí ó sì yẹ kí ó rí bẹ́ẹ̀, kí ó ṣe ohun tí ó fẹ́; kò dẹ́ṣẹ̀. Kí wọ́n gbéyàwó.
  rationale: 'Àtúnṣe náà kàn ìmúṣiṣẹ́ Yorùbá: a rọ́pò “ṣe ìgbéyàwó” pẹ̀lú “gbẹ́yàwó” kí àṣẹ Gíríìkì náà túmọ̀ sí wíwọ ìgbéyàwó, kì í ṣe ṣíṣe ayẹyẹ; a sì sọ “wúńdíá náà” di kókó-ọrọ ẹ̀ka ọjọ́-orí. Àìdánilójú nípa ìbátan ẹni náà sí wúńdíá ni a pa mọ́ nínú ọ̀rọ̀ àkọ́kọ́ àti àlàyé ìsàlẹ̀.'
