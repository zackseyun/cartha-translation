id: 1CO.7.36
reference: 1 Corinthians 7:36
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹnikẹ́ni bá rò pé òun ń hùwà tí kò bójú mu sí wúńdíá tirẹ̀[a], bí wúńdíá náà bá ti kọjá ìgbà èwe rẹ̀, tí ó sì yẹ kí ó rí bẹ́ẹ̀, kí ó ṣe ohun tí ó fẹ́; kò dẹ́ṣẹ̀. Kí wọ́n gbéyàwó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sí àfẹ́sọ́nà rẹ̀ tí ó jẹ́ wúńdíá”; ní àṣà ìtumọ̀ kan, “sí ọmọbìnrin rẹ̀ tí ó jẹ́ wúńdíá.” Ọ̀rọ̀ Gíríìkì kò fi èyí hàn ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: ń hùwà tí kò bójú mu
  rationale: Ó ṣàfihàn ìwà tí kò yẹ tàbí tí kò bójú mu láìfi ẹ̀sùn ìwà ìbàjẹ́ tó le jù kún ọ̀rọ̀ Gíríìkì.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: sí wúńdíá tirẹ̀
  rationale: “Wúńdíá” túmọ̀ παρθένος ní tààrà; “tirẹ̀” pa àìdánilójú αὐτοῦ mọ́, bóyá àfẹ́sọ́nà rẹ̀ ni tàbí ọmọbìnrin wúńdíá tó wà lábẹ́ àbójútó rẹ̀.
- source_word: ὑπέρακμος
  choice: ti kọjá ìgbà èwe rẹ̀
  rationale: Ó mú èrò pé ẹni náà ti kọjá òdòdó tàbí àkókò gíga ìgbà èwe jáde ní Yorùbá àdánidá, láìsọ ọjọ́-orí pàtó.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: tí ó sì yẹ kí ó rí bẹ́ẹ̀
  rationale: Ó pa ìtumọ̀ ojúṣe tàbí àìní náà mọ́, ó sì ṣọ́ra láti má ṣe sọ ohun tó fa àìní náà ní pàtó bí Gíríìkì kò ti ṣe sọ ọ́.
- source_word: ὃ θέλει ποιείτω
  choice: kí ó ṣe ohun tí ó fẹ́
  rationale: Ìtumọ̀ àṣẹ ìyọ̀ǹda tó ṣe kedere, tó sì jẹ́ Yorùbá àdánidá.
- source_word: οὐχ ἁμαρτάνει
  choice: kò dẹ́ṣẹ̀
  rationale: 'Ó sọ ìyọ̀ǹda nípa ìwà rere kedere: ìṣe náà kì í ṣe ẹ̀ṣẹ̀.'
- source_word: γαμείτωσαν
  choice: Kí àwọn méjèèjì ṣe ìgbéyàwó
  rationale: “Àwọn méjèèjì” mú ọ̀pọ̀ ẹni inú ọ̀rọ̀-ìṣe Gíríìkì hàn, “kí ... ṣe” sì pa agbára àṣẹ ẹni-kẹta mọ́.
theological_decisions:
- issue: Ta ni “wúńdíá tirẹ̀” (παρθένον αὐτοῦ) ń tọ́ka sí?
  choice: Ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú náà mọ́ pẹ̀lú “wúńdíá tirẹ̀.”
  alternative: Ó lè jẹ́ àfẹ́sọ́nà ọkùnrin náà, tàbí ọmọbìnrin wúńdíá rẹ̀ tó wà lábẹ́ àbójútó rẹ̀.
  rationale: Gbólóhùn Gíríìkì lè gba ìtumọ̀ méjèèjì, àyíká ẹsẹ̀ náà sì ti gba àwọn ìtumọ̀ wọ̀nyí nínú ìtàn ìtumọ̀. Nítorí náà, a kò yan ọ̀kan ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu, a sì pa àìdánilójú pàtàkì inú Gíríìkì mọ́.
