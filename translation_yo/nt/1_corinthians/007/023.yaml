  text: τιμῆς ἠγοράσθητε· μὴ γίνεσθε δοῦλοι ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: yo
  text: A rà yín ní iye kan; ẹ má ṣe di ẹrú àwọn ènìyàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Àwọn ènìyàn’ níhìn-ín kì í tọ́ka sí ọkùnrin nìkan, bí kò ṣe sí gbogbo ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμῆς
  choice: ní iye kan
  rationale: Ọ̀rọ̀ náà sọ iye tàbí owó tí a fi rà ohun; ‘ní iye kan’ jẹ́ ọ̀nà Yorùbá àdánidá láti pa àwòrán rírà mọ́ láì sọ iye náà ní pàtó.
- source_word: ἠγοράσθητε
  choice: Ẹ̀yin ni a rà
  rationale: Ìṣe àìpé tí a ṣe sí ẹni púpọ̀ ni; ìtumọ̀ yìí pa ohùn ìfaragà àti àwòrán rírà tí Pọ́ọ̀lù lò mọ́.
- source_word: μὴ γίνεσθε
  choice: ẹ má ṣe di
  rationale: γίνομαι túmọ̀ sí ‘di’ tàbí ‘wá sí ipò kan,’ kì í ṣe ‘jẹ́’ lásán; ọ̀rọ̀ yìí dáwọ́ dídà sí ipò ẹrú dúró.
- source_word: δοῦλοι
  choice: ẹrú
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ipò ẹni tí olúwa ní àti ìgbọràn sí olúwa ṣe pàtàkì; ‘ẹrú’ pa agbára àwòrán náà mọ́ ju ‘ìránṣẹ́’ lọ.
- source_word: ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹ̀dá ènìyàn lápapọ̀, ní ìyàtọ̀ sí Olúwa; ‘àwọn ènìyàn’ jẹ́ kedere, ó sì kò gbogbo ènìyàn sínú.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ δοῦλοι ἀνθρώπων ní ìbámu pẹ̀lú àwòrán ohun-ìní àti ìgbọràn
  choice: ẹrú àwọn ènìyàn
  alternative: ìránṣẹ́ àwọn ènìyàn
  rationale: Kókó ọ̀rọ̀ náà ni pé a ti rà àwọn onígbàgbọ́, nítorí náà wọn kò gbọdọ̀ fi ara wọn sábẹ́ ìṣàkóso ènìyàn bí olúwa tó ga jù lọ. ‘Ẹrú’ pa ìtumọ̀ ohun-ìní àti ìgbọràn yìí mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ẹ̀yin’ mú ẹni kejì ọ̀pọ̀ hàn kedere; ‘ní iye kan’ sì pa àwòrán ọjà Gíríìkì mọ́ ní ọ̀nà àdánidá.
