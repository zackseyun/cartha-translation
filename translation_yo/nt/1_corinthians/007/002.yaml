id: 1CO.7.2
reference: 1 Corinthians 7:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: yo
  text: Ṣùgbọ́n nítorí àwọn ìwà àgbèrè[a], kí olúkúlùkù ọkùnrin ní aya tirẹ̀, kí olúkúlùkù obìnrin sì ní ọkọ tirẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ìwà àgbèrè.” Ọ̀rọ̀ Gíríìkì wà ní ọ̀pọ̀: “àwọn ìwà àgbèrè.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: Ṣùgbọ́n nítorí
  rationale: “Nítorí” fi ìtumọ̀ okùnfà tí διά pẹ̀lú accusative ní hàn, “ṣùgbọ́n” sì pa ìyípadà tàbí ìtakora kékeré tí δέ ń fi hàn mọ́.
- source_word: τὰς πορνείας
  choice: àwọn ìwà àgbèrè
  rationale: πορνεία tọ́ka sí ìwà ìbálòpọ̀ tí kò bófin mu nípa ìwà rere; “àwọn” pa fọ́ọ̀mù ọ̀pọ̀ nínú Gíríìkì mọ́. “Ìwà àgbèrè” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó lóye, tí kò sì dín ìtumọ̀ náà kù sí irú ẹ̀ṣẹ̀ ìbálòpọ̀ kan ṣoṣo.
- source_word: ἕκαστος
  choice: olúkúlùkù ọkùnrin
  rationale: Fọ́ọ̀mù akọ tó wà ní ìbámu pẹ̀lú ἑκάστη àti pẹ̀lú aya/ọkọ fi hàn pé akọ ni a ń tọ́ka sí; “olúkúlùkù” pa ìtumọ̀ pínpín mọ́.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: aya tirẹ̀
  rationale: Nínú ìṣọ̀kan ọ̀rọ̀ ìgbéyàwó yìí, γυνή túmọ̀ sí “aya,” ἑαυτοῦ sì tẹnumọ́ pé aya ẹni náà fúnra rẹ̀ ni.
- source_word: ἐχέτω
  choice: kí ... ní
  rationale: Àṣẹ ẹni kẹta yìí ni Yorùbá lè sọ lọ́nà àdánidá pẹ̀lú “kí ... ní”; ó pa agbára àṣẹ mọ́ láì sọ ọ́ di dandan tó le ju ọ̀rọ̀ Gíríìkì lọ.
- source_word: καὶ ἑκάστη
  choice: kí olúkúlùkù obìnrin sì
  rationale: “Olúkúlùkù obìnrin” fi fọ́ọ̀mù abo àti ìtumọ̀ pínpín hàn; “sì” so gbólóhùn kejì mọ́ àkọ́kọ́ lọ́nà Yorùbá tó ṣe déédé.
- source_word: τὸν ἴδιον ἄνδρα
  choice: ọkọ tirẹ̀
  rationale: Nínú àyíká ìgbéyàwó àti ní ìbámu pẹ̀lú γυνή, ἀνήρ túmọ̀ sí “ọkọ”; ἴδιον tẹnumọ́ ohun-ìní ẹni náà, èyí tí “tirẹ̀” mú jáde.
theological_decisions:
- issue: Bóyá a ó tú ẹsẹ náà gẹ́gẹ́ bí ìyọ̀ǹda fún ìgbéyàwó láti yẹra fún ẹ̀ṣẹ̀ ìbálòpọ̀ tàbí gẹ́gẹ́ bí àṣẹ nípa ìbáṣepọ̀ ọkọ àti aya
  choice: A tú àṣẹ náà ní tààrà gẹ́gẹ́ bí ìtọ́nisọ́nà pé kí olúkúlùkù ọkùnrin ní aya tirẹ̀, kí olúkúlùkù obìnrin sì ní ọkọ tirẹ̀, nítorí àwọn ìwà àgbèrè.
  alternative: A lè túmọ̀ rẹ̀ ní ìtumọ̀ àfikún bí “kí olúkúlùkù ṣègbéyàwó” tàbí “kí wọ́n máa ṣe ojúṣe ìgbéyàwó wọn.”
  rationale: Gíríìkì lo ἐχέτω, “kí ... ní,” kì í ṣe ọ̀rọ̀-ìṣe pàtó fún ṣíṣe ìgbéyàwó tàbí fún ìbálòpọ̀ ọkọ àti aya. Ìtumọ̀ náà pa ọ̀rọ̀ àti ìfọ̀kànsìn rẹ̀ mọ́ láì fi ẹ̀kọ́ ìsìn àfikún sí i.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó bá ṣe àdánidá; èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣe kedere fún òǹkàwé gbogbo. A pa ìṣọ̀kan ọkùnrin/obìnrin àti aya/ọkọ mọ́, a sì yàgò fún ìtumọ̀ àfikún bí “ṣègbéyàwó.”
