id: 1CO.7.16
reference: 1 Corinthians 7:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: yo
  text: Nítorí báwo ni o ṣe mọ̀[a], ìwọ aya, bóyá ìwọ yóò gba ọkọ rẹ là? Tàbí báwo ni o ṣe mọ̀, ìwọ ọkọ, bóyá ìwọ yóò gba aya rẹ là?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ ọ́ lọ́nà àdánidá pé, “Báwo ni o ṣe lè mọ̀ ... bóyá o lè gba ... là?” Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ ti ọjọ́ iwájú (“ìwọ yóò gbà ... là”) nínú ìbéèrè aláìṣe-taara tí “bóyá” bẹ̀rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: Nítorí báwo ni o ṣe mọ̀
  rationale: “Báwo ni o ṣe mọ̀” ni ọ̀nà àdánidá láti sọ ìbéèrè àsọyé yìí ní Yorùbá, dípò títúmọ̀ τί gẹ́gẹ́ bí “kí ni.” “Nítorí” sì pa ipa ìṣàlàyé γάρ mọ́ ní ìbámu pẹ̀lú ọ̀rọ̀ tó ṣáájú.
- source_word: γύναι
  choice: ìwọ aya
  rationale: Nínú àyíká ọ̀rọ̀ ìgbéyàwó yìí, γυνή túmọ̀ sí “aya,” kì í ṣe “obìnrin” lásán; “ìwọ” mú kí ó hàn gbangba pé àpèjúwe tààrà ni.
- source_word: ἄνερ
  choice: ìwọ ọkọ
  rationale: Nínú àyíká ọ̀rọ̀ ìgbéyàwó, ἀνήρ níhìn-ín túmọ̀ sí “ọkọ,” kì í ṣe “ọkùnrin” lásán.
- source_word: σώσεις
  choice: ìwọ yóò ... gbà ... là
  rationale: “Yóò” dúró fún ọ̀rọ̀-ìṣe ọjọ́ iwájú Gíríìkì, nígbà tí “gbà ... là” pa ìtumọ̀ ìgbàlà mọ́ láì dín in kù sí mímú ẹni wá sí ìgbàgbọ́ tàbí pípa ìgbéyàwó mọ́.
- source_word: τὸν ἄνδρα
  choice: ọkọ rẹ
  rationale: Ní Yorùbá àdánidá, “ọkọ rẹ” fi ìbáṣepọ̀ tọkọtaya tí àpilẹ̀kọ Gíríìkì ń tọ́ka sí hàn kedere.
- source_word: τὴν γυναῖκα
  choice: aya rẹ
  rationale: “Aya rẹ” ni ọ̀nà Yorùbá àdánidá láti sọ ẹni tí ọ̀rọ̀ náà ń tọ́ka sí nínú ìbáṣepọ̀ ìgbéyàwó.
- source_word: ἢ
  choice: Tàbí
  rationale: “Tàbí” so àwọn ìbéèrè àsọyé méjèèjì pọ̀, ó sì pa ìfarajọ wọn mọ́.
theological_decisions:
- issue: Ìtumọ̀ “gbà ... là” nínú àyíká ọ̀rọ̀ tọkọtaya
  choice: Fi “gbà ... là” sílẹ̀ pẹ̀lú agbára ìtumọ̀ ìgbàlà rẹ.
  alternative: “mú wá sí ìgbàgbọ́” tàbí “dá ìgbéyàwó náà sí”
  rationale: σῴζω sábà máa ń ní ìtumọ̀ ìgbàlà nínú àwọn lẹ́tà Paulu. A kò túmọ̀ rẹ̀ sí ọ̀nà tó dín ìtumọ̀ rẹ̀ kù tàbí tó yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà fi sílẹ̀.
translation_notes:
  register: Èdè Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá; àtúnṣe gbolohun náà pa ìfarajọ àwọn ìbéèrè méjèèjì àti àìdánilójú “bóyá” mọ́.
