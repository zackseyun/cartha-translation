  text: ἕκαστος ἐν τῇ κλήσει ᾗ ἐκλήθη ἐν ταύτῃ μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/020.yaml
  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: yo
  text: Kí olúkúlùkù máa dúró nínú ìpè tí a pè é sí.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ipò,” “ipò ayé,” tàbí “ipò ẹni nínú ayé.” Ọ̀rọ̀ Gíríìkì náà ni “ìpè,” ó sì ṣẹ̀dá ìfararora ọ̀rọ̀ pẹ̀lú “a pè é” nínú ẹsẹ̀ kan náà.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì fún “olúkúlùkù” wà ní ẹ̀yà akọ ẹyọ gẹ́gẹ́ bí ọ̀nà aṣojú, ṣùgbọ́n ìtọ́ni náà kan onígbàgbọ́ kọ̀ọ̀kan. Arọ́pò-orúkọ Yorùbá “ó/ẹ̀” kò fi akọ tàbí abo hàn.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ó pa ìtumọ̀ alápín ẹnì kọ̀ọ̀kan mọ́, dípò gbólóhùn àpapọ̀ bíi ‘gbogbo ènìyàn.’
- source_word: κλήσει
  choice: ìpè
  rationale: ‘Ìpè’ ni ìtumọ̀ tààrà, ó sì pa ìbáṣepọ̀ ọ̀rọ̀ rẹ̀ pẹ̀lú ἐκλήθη (‘a pè é’) mọ́. Àyíká tún lè jẹ́ kí ó tọ́ka sí ipò ayé ẹni láìfi ìtumọ̀ yẹn dí ọ̀rọ̀ náà mọ́lẹ̀.
- source_word: ᾗ ἐκλήθη
  choice: tí ó wà nígbà tí a pè é
  rationale: Èyí sọ ìbáṣepọ̀ ìpè náà pẹ̀lú ipò ẹni nígbà ìpè ní Yorùbá àdánidá. ‘A pè é’ pa ọ̀nà ìṣe aláìdárúkọ tí ó lè tọ́ka sí Ọlọ́run mọ́, láìfi ẹni tó pè é kun ọ̀rọ̀ Gíríìkì.
- source_word: ἐν ταύτῃ
  choice: nínú ìpè tí ó wà
  rationale: A so ọ̀rọ̀ atọ́ka náà padà mọ́ ‘ìpè’ ní ọ̀nà tí ó ṣe kedere ní Yorùbá, láìṣe àtúnwí tí kò ní dùn létí.
- source_word: μενέτω
  choice: Kí ... máa dúró
  rationale: Ìṣesí àṣẹ onítẹ̀síwájú ni; ‘kí ... máa dúró’ fi àṣẹ láti tẹ̀ síwájú nínú ipò náà hàn láìsọ ọ́ di òfin aláìní ààyè rárá.
theological_decisions:
- issue: Ìtumọ̀ κλῆσις nínú àyíká ọ̀rọ̀
  choice: A lo ‘ìpè’ nínú ọ̀rọ̀ pàtàkì.
  alternative: ipò; ipò ayé; ipò tí ènìyàn wà
  rationale: Àyíká ń sọ nípa àwọn ipò bí ìkọlà àti ìsìnrú, ṣùgbọ́n Pọ́ọ̀lù mọ̀ọ́mọ̀ so κλήσει pọ̀ mọ́ ἐκλήθη. ‘Ìpè’ pa eré-ọ̀rọ̀ àti ìfarakanra láàárín ìpè Ọlọ́run àti ipò ayé ẹni mọ́.
- issue: Ẹ̀yà akọ nínú Gíríìkì
  choice: A lo arọ́pò-orúkọ Yorùbá ‘ó/é,’ tí kò fi akọ tàbí abo hàn.
  alternative: Láti fi ‘ọkùnrin náà’ tàbí ọ̀rọ̀ akọ mìíràn kun un
  rationale: Bó tilẹ̀ jẹ́ pé ẹ̀yà akọ ẹyọ ni Gíríìkì lò gẹ́gẹ́ bí aṣojú gbogbo onígbàgbọ́, Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ ẹni kẹta. Fífi ọ̀rọ̀ akọ kun un yóò fi ohun tí kò sí nínú ìtumọ̀ aṣojú náà kún ẹsẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Kí ... máa dúró’ jẹ́ àṣẹ tó ṣe kedere, ‘olúkúlùkù’ sì jẹ́ ọ̀rọ̀ àdánidá fún ìtọ́ka sí ẹnì kọ̀ọ̀kan. A pa ‘ìpè/a pè’ mọ́ láti ṣàfihàn ìbáṣepọ̀ ọ̀rọ̀ inú Gíríìkì.
