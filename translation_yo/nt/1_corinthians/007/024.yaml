source:
  edition: SBLGNT
  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: yo
  text: Ẹ̀yin ará[b], kí olúkúlùkù máa dúró ní ọ̀dọ̀ Ọlọ́run[a] nínú ipò tí a pè é sí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘níwájú Ọlọ́run’ tàbí ‘ní ojú Ọlọ́run.’
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ fọ́ọ̀mù púpọ̀ akọ tí ìtumọ̀ rẹ̀ jẹ́ ‘arákùnrin,’ ṣùgbọ́n níbí ó ń bá gbogbo ìjọ sọ̀rọ̀, títí kan àwọn obìnrin.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹnì kọ̀ọ̀kan lọ́tọ̀ọ̀tọ̀, ó sì jẹ́ ọ̀nà àdánidá láti fi ìtumọ̀ distributive singular hàn ní Yorùbá.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: nínú ipò tí ... nínú rẹ̀
  rationale: Àtúnsọ ἐν pẹ̀lú ọ̀rọ̀ arọ́pò ibátan àti atọ́ka ń tọ́ka sí ipò tàbí ipò ìgbésí ayé ẹni, kì í ṣe ibi tí ara wà lásán. Ìṣètò Yorùbá yìí pa ìbátan àwọn gbólóhùn méjèèjì mọ́.
- source_word: ἐκλήθη
  choice: a ti pè é
  rationale: A pa ọ̀rọ̀ náà mọ́ ní passive láìfi ‘Ọlọ́run’ kún un gẹ́gẹ́ bí olùṣe, nítorí pé bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ fi ìpè Ọlọ́run hàn, Gíríìkì kò sọ olùṣe náà ní tààrà.
- source_word: ἀδελφοί
  choice: Ẹ̀yin ará
  rationale: ‘Ẹ̀yin ará’ jẹ́ ọ̀rọ̀ ìpè àdánidá, ọlọ́lá, tí ìjọ Yorùbá sì lóye pé ó kan gbogbo àwọn onígbàgbọ́. Àlàyé ìsàlẹ̀ ojú ìwé pa irú ọkùnrin plural inú Gíríìkì àti agbára aṣojú rẹ̀ mọ́.
- source_word: μενέτω
  choice: kí ... máa dúró
  rationale: Ìṣètò ‘kí ... máa dúró’ fi àṣẹ ẹni kẹta àti ìtumọ̀ títẹ̀síwájú nínú ipò kan hàn lọ́nà àdánidá ní Yorùbá.
- source_word: παρὰ θεῷ
  choice: ní ọ̀dọ̀ Ọlọ́run
  rationale: ‘Ní ọ̀dọ̀ Ọlọ́run’ lè sọ ìsúnmọ́ àti ìbáṣepọ̀ pẹ̀lú Ọlọ́run, ó sì dáàbò bo ìkékúrú àti díẹ̀ lára àìdánilójú gbolohun Gíríìkì. Àwọn ìtumọ̀ ‘níwájú Ọlọ́run’ àti ‘ní ojú Ọlọ́run’ wà nínú àlàyé.
theological_decisions:
- issue: Bóyá kí a sọ Ọlọ́run ní gbangba gẹ́gẹ́ bí ẹni tó pè
  choice: A fi ọ̀rọ̀ náà sí passive pé ‘a ti pè é,’ láìfikún ‘Ọlọ́run.’
  alternative: ‘Ọlọ́run ti pè é’ tàbí ‘Ọlọ́run pè é.’
  rationale: Àyíká ọ̀rọ̀ Paulu mú kí ìpè Ọlọ́run ṣeé ṣe gidigidi, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò dárúkọ olùṣe; àyíká ni kí ó jẹ́ kí òǹkàwé mọ ẹni náà.
- issue: Bí a ṣe máa túmọ̀ ἀδελφοί nínú ọ̀rọ̀ sí ìjọ tí ọkùnrin àti obìnrin wà
  choice: ‘Ẹ̀yin ará,’ pẹ̀lú àlàyé pé Gíríìkì túmọ̀ sí ‘ará ọkùnrin’ ní ti gírámà ṣùgbọ́n ó ń bá gbogbo ìjọ sọ̀rọ̀.
  alternative: ‘Ẹ̀yin arákùnrin àti arábìnrin.’
  rationale: ‘Ẹ̀yin ará’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò yọ obìnrin sílẹ̀, nígbà tí àlàyé sì ń jẹ́ kí irú ọ̀rọ̀ orísun àti agbára aṣojú rẹ̀ hàn.
- issue: Ìtumọ̀ παρὰ θεῷ
  choice: ‘ní ọ̀dọ̀ Ọlọ́run.’
  alternative: ‘níwájú Ọlọ́run’ tàbí ‘ní ojú Ọlọ́run.’
  rationale: παρά pẹ̀lú dative lè fi ìsúnmọ́, ìbáṣepọ̀, tàbí wíwà ní iwájú ẹnì kan hàn. A kò fẹ́ fi ọ̀kan ṣoṣo nínú àwọn ìtumọ̀ wọ̀nyí di dandan; nítorí náà a yan ọ̀rọ̀ Yorùbá tó gbooro díẹ̀, a sì tọ́ka sí àwọn mìíràn ní àlàyé.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì pẹ̀lú àmì ohùn ní kíkún. ‘Olúkúlùkù’ àti ‘kí ... máa dúró’ jẹ́ àdánidá fún òǹkàwé gbogbogbò, nígbà tí ‘ní ọ̀dọ̀ Ọlọ́run’ pa ìkékúrú àti àìdánilójú díẹ̀ ti orísun mọ́.
