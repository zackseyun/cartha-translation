  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: yo
  text: Ṣùgbọ́n bí wọn kò bá lè kó ara wọn níjàánu, kí wọn gbéyàwó; nítorí ó sàn kí wọn gbéyàwó ju kí wọ́n máa jó lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní àyíká ọ̀rọ̀ yìí, a lè lóye “kí wọ́n máa jó” gẹ́gẹ́ bí jíjó pẹ̀lú ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀. Gíríìkì kò sọ ohun tí ń mú wọn jó ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: lè kó ara wọn níjàánu
  rationale: Ọ̀rọ̀ náà túmọ̀ sí lílo ìkóra-ẹni-níjàánu; nínú àyíká ọ̀rọ̀ yìí, ó ní í ṣe pàápàá pẹ̀lú ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀. Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìtumọ̀ náà mọ́.
- source_word: γαμησάτωσαν
  choice: kí wọn gbéyàwó
  rationale: Ó jẹ́ àṣẹ ẹni kẹta ọ̀pọ̀; ‘kí wọn gbéyàwó’ fi agbára àṣẹ tàbí ìtọ́ni náà hàn ní Yorùbá àdánidá.
- source_word: κρεῖττον
  choice: ó sàn
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé láti sọ ohun tí ó dára tàbí yẹ jù.
- source_word: γαμῆσαι
  choice: láti gbéyàwó
  rationale: Ó ṣe àfihàn infinitive Gíríìkì náà ní ṣókí, ó sì bá ọ̀rọ̀ àkọ́kọ́ nípa ìgbéyàwó mu.
- source_word: πυροῦσθαι
  choice: kí ìfẹ́kúfẹ̀ẹ́ máa jó wọn
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí jíjó tàbí jíjẹ́ ẹni tí iná ń jó. Nínú àyíká ìgbéyàwó àti ìkóra-ẹni-níjàánu, ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀ ni ó ṣeé ṣe jù pé ó ń tọ́ka sí; ìtumọ̀ yìí pa àwòrán iná mọ́ nípasẹ̀ ‘jó wọn.’
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré sí ohun tí a sọ ṣáájú hàn, ‘Ṣùgbọ́n’ sì mú ìyípadà náà jáde dáadáa.
theological_decisions:
- issue: Ìtumọ̀ πυροῦσθαι nínú àyíká ọ̀rọ̀
  choice: kí ìfẹ́kúfẹ̀ẹ́ máa jó wọn
  alternative: kí wọn máa jó
  rationale: Ọ̀rọ̀ tó yí ẹsẹ̀ náà ká ń sọ nípa àìlọ́kọ tàbí àìláya, ìgbéyàwó, àti ìkóra-ẹni-níjàánu; nítorí náà, jíjó pẹ̀lú ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀ ni ìtumọ̀ tó bá àyíká mu jù. Síbẹ̀, àlàyé ìsàlẹ̀ fi ọ̀nà gangan tí Gíríìkì gbà sọ ọ́ pamọ́ láìfi ‘ìfẹ́kúfẹ̀ẹ́’ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. ‘Gbéyàwó’ ni a lò ní ìtumọ̀ gbogbogbò fún àwọn tí Pọ́ọ̀lù ń tọ́ka sí, bí ó tilẹ̀ jẹ́ pé ní lílo Yorùbá kan ó sábà máa ń tọ́ka sí ọkùnrin.
