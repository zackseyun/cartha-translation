  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì ẹsẹ náà dáadáa: àfiwé μακαριωτέρα, ìdúró nínú ipò tí ó wà, ìmọ̀ràn Pọ́ọ̀lù fúnra rẹ̀, àti ìjẹ́wọ́ rẹ̀ pé òun náà ní Ẹ̀mí Ọlọ́run. Síbẹ̀, “yóò túbọ̀ láyọ̀” yí ìwà-asiko gbolóhùn Gíríìkì náà sí ọjọ́ iwájú. Gbolóhùn tí a tún ṣe pa ìtumọ̀ àfiwé ìsinsìnyí náà mọ́ láìsọ ìpò náà di ohun tí ó ju ohun tí àyíká sọ lọ.'
  naturalness: “Ó túbọ̀ láyọ̀ bí ó bá dúró bẹ́ẹ̀” jẹ́ ọ̀nà Yorùbá boṣewa, tó rọrùn láti ka, fún “is happier if she remains as she is.” “Gẹ́gẹ́ bí èrò mi” jẹ́ ìtumọ̀ àdánidá fún κατὰ τὴν ἐμὴν γνώμην. “Èmi náà ní Ẹ̀mí Ọlọ́run” fi κἀγώ hàn ní kedere.
  terminology: “Ẹ̀mí Ọlọ́run” yẹ fún πνεῦμα θεοῦ nínú àyíká Pọ́ọ̀lù. A pa ìrẹ̀lẹ̀ tí δοκῶ ń fi hàn mọ́ pẹ̀lú “mo sì rò pé,” láìsọ ọ́ di àìdánilójú. A tún ṣàtúnṣe ìsọ̀rọ̀ ìsàlẹ̀ kí “tó pọ̀ sí i” má bàa di “ga jù,” èyí tí ó lè fi ìtumọ̀ superlative kún comparative Gíríìkì náà.
