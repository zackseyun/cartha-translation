  to: Ṣùgbọ́n ó túbọ̀ láyọ̀ bí ó bá dúró bẹ́ẹ̀[a], gẹ́gẹ́ bí èrò mi; mo sì rò pé èmi náà ní Ẹ̀mí Ọlọ́run.
  rationale: Àtúnṣe náà yọ àmì ọjọ́ iwájú kúrò kí ó ba ἐστιν mu, ó yan “bẹ́ẹ̀” láti tọ́ka sí οὕτως láìṣàlàyé ipò obìnrin náà ju àyíká ẹsẹ lọ, ó sì lo “èrò mi” fún γνώμη ní ọ̀nà Yorùbá tí ó rọrùn. “Èmi náà” pa ìtẹnumọ́ àfikún κἀγώ mọ́. Ìsọ̀rọ̀ ìsàlẹ̀ náà sì dá ìtumọ̀ comparative ti μακαριωτέρα dúró.
