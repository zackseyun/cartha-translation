  - severity: low
    issue: Ìsọ̀rọ̀ ìsàlẹ̀ náà lo “tó ga jù.”
    rationale: μακαριωτέρα jẹ́ comparative, kì í ṣe superlative; “ipò ìbùkún tó pọ̀ sí i” dá ìpele àfiwé náà dúró.
