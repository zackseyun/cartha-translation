id: 1CO.7.40
reference: 1 Corinthians 7:40
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ, κατὰ τὴν ἐμὴν γνώμην, δοκῶ ⸀δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: yo
  text: Ṣùgbọ́n ó túbọ̀ láyọ̀ bí ó bá dúró bẹ́ẹ̀[a], gẹ́gẹ́ bí èrò mi; mo sì rò pé èmi náà ní Ẹ̀mí Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó túbọ̀ jẹ́ alábùkún.” Ọ̀rọ̀ Gíríìkì μακαριωτέρα lè tọ́ka sí ayọ̀ tó pọ̀ sí i tàbí ipò ìbùkún tó pọ̀ sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: yóò túbọ̀ láyọ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ àfiwé, ó sì lè túmọ̀ sí pé ayọ̀ rẹ̀ yóò pọ̀ sí i tàbí pé yóò túbọ̀ jẹ́ alábùkún. Nínú ìmọ̀ràn tó wúlò fún ìgbésí ayé ní àyíká ọ̀rọ̀ yìí, “yóò túbọ̀ láyọ̀” jẹ́ Yorùbá àdánidá tí ó pa agbára àfiwé náà mọ́ láìfi ìtumọ̀ ẹ̀sìn kan ṣoṣo lé e lórí.
- source_word: ἐὰν οὕτως μείνῃ
  choice: bí ó bá dúró bí ó ti wà
  rationale: “Dúró” fi ìtumọ̀ μένω hàn, “bí ó ti wà” sì tọ́ka padà sí ipò àìní ọkọ tí a ń sọ̀rọ̀ rẹ̀, láìṣàlàyé ju ohun tí Gíríìkì sọ lọ.
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: gẹ́gẹ́ bí ìdájọ́ mi
  rationale: “Ìdájọ́” níbí túmọ̀ sí èrò tí a ti gbé yẹ̀ wò, kì í ṣe ìdájọ́ ilé-ẹjọ́. Ó pa ìwọ̀ntúnwọ̀nsì ìmọ̀ràn Pọ́ọ̀lù mọ́ ju gbólóhùn àìfọ̀rọ̀sí lọ.
- source_word: δοκῶ
  choice: mo rò pé
  rationale: Ó pa ìrẹ̀lẹ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́, ṣùgbọ́n kò sọ ọ́ di ẹni tí kò dá ohun tó sọ lójú.
- source_word: κἀγὼ
  choice: èmi pẹ̀lú
  rationale: Ó fi ìtumọ̀ àfikún “èmi náà” hàn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti tẹ ẹni tó ń sọ̀rọ̀ mọ́lẹ̀.
- source_word: πνεῦμα θεοῦ
  choice: Ẹ̀mí Ọlọ́run
  rationale: Nínú lílo Pọ́ọ̀lù, gbólóhùn yìí tọ́ka sí Ẹ̀mí Ọlọ́run, kì í ṣe ìwà tàbí ìmọ̀lára ẹ̀mí lásán.
- source_word: ἔχειν
  choice: ní
  rationale: “Ní” jẹ́ ìtumọ̀ tààrà, tó sì ṣe déédéé ní Yorùbá fún jíjẹ́ ẹni tí Ẹ̀mí Ọlọ́run wà pẹ̀lú.
theological_decisions:
- issue: Bóyá πνεῦμα θεοῦ túmọ̀ sí Ẹ̀mí Mímọ́ tàbí ìwà ẹ̀mí kan lásán
  choice: Ẹ̀mí Ọlọ́run
  alternative: ẹ̀mí kan láti ọ̀dọ̀ Ọlọ́run tàbí òye ti ẹ̀mí
  rationale: Lílo gbólóhùn náà nínú àwọn lẹ́tà Pọ́ọ̀lù àti àyíká ọ̀rọ̀ yìí ń tọ́ka sí Ẹ̀mí Ọlọ́run gẹ́gẹ́ bí ìpìlẹ̀ ìmọ̀ràn rẹ̀; síbẹ̀, a kò sọ ọ̀rọ̀ náà di àṣẹ tààrà láti ọ̀dọ̀ Olúwa.
- issue: Agbára δοκῶ ... πνεῦμα θεοῦ ἔχειν nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: Ọ̀rọ̀ ìrẹ̀lẹ̀ tí ó tún jẹ́ ìjẹ́wọ́ gidi pé Ẹ̀mí ń darí ìmọ̀ràn rẹ̀
  alternative: Àìdánilójú pé bóyá ó ní Ẹ̀mí, tàbí ọ̀rọ̀ ẹ̀gàn sí àwọn alátakò
  rationale: “Mo rò pé” pa ìrẹ̀lẹ̀ ọ̀rọ̀ náà mọ́, ṣùgbọ́n àyíká rẹ̀ kò fi hàn pé Pọ́ọ̀lù ń ṣiyèméjì nípa wíwà Ẹ̀mí pẹ̀lú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Bí ó ti wà” jẹ́ ọ̀nà àdánidá láti tọ́ka sí ipò opó tí àyíká ẹsẹ náà ti ṣàlàyé.
