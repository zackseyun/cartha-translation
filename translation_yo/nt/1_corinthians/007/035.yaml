  verdict: revise
  source_fidelity: 'Àwọn èrò pàtàkì nínú Gíríìkì náà wà nínú àdàkọ náà: àǹfààní tiwọn gan-an, àwòrán okùn ìdẹ̀, ohun tí ó yẹ, àti ìfọkànsìn sí Olúwa tí kò ní ohun tí ń pín ọkàn. Síbẹ̀, ‘fífi ara yín fún Olúwa’ lè túmọ̀ sí ìfarajìn tàbí ìtẹríba ara ẹni, dípò εὐπάρεδρον, tí ó ń tọ́ka sí ìfọkànsìn/ìfaradà títì sí Olúwa. ‘Láti gbé ... ga’ tún ṣàfihàn dáadáa iṣẹ́ πρὸς nínú gbolohun àtakò náà.'
  naturalness: '‘Fún ohun tí ó yẹ àti fún fífi ara yín fún’ ní ìtúnlò ‘fún’ tí ó kéré sí ìròyìn Yorùbá. Àtúnṣe náà ń lo ìkọ̀wé tí ó rọrùn, tí ó sì ṣàn: ‘ṣùgbọ́n láti gbé ohun tí ó yẹ ga, àti láti mú kí ẹ lè ...’'
