id: 1CO.7.35
reference: 1 Corinthians 7:35
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: yo
  text: Mo sọ èyí fún àǹfààní tiyín fúnra yín, kì í ṣe láti fi okùn ìdẹ̀ sí ọrùn yín, ṣùgbọ́n láti gbé ohun tí ó yẹ ga, àti láti mú kí ẹ lè ní ìfọkànsìn sí Olúwa láìsí ìpínyà ọkàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: àǹfààní
  rationale: Ó túmọ̀ sí ohun tí ó ṣàǹfààní tàbí tí ó dára fún àwọn olùgbọ́; ‘àǹfààní tiyín fúnra yín’ mú ìtẹnumọ́ ὑμῶν αὐτῶν jáde.
- source_word: βρόχον
  choice: okùn sí ọrùn
  rationale: βρόχος jẹ́ okùn ìdẹ̀ tàbí okùn tí ń há ẹni mọ́lẹ̀; àwòrán yìí lágbára ju ‘ìdènà’ lọ, ó sì yẹ fún ọ̀rọ̀ nípa fífi ohun kan lé wọn lórí.
- source_word: εὔσχημον
  choice: ohun tí ó yẹ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ohun tí ó bójú mu, tí ó sì yẹ ní ìwà.
- source_word: εὐπάρεδρον
  choice: fífi ara yín fún
  rationale: Ọ̀rọ̀ náà ní èrò jíjẹ́ ẹni tí ó dúró tàbí jókòó tì ẹnì kan, nítorí náà ó ń sọ nípa ìfọkànsìn tí ó dúró ṣinṣin sí Olúwa.
- source_word: ἀπερισπάστως
  choice: láìsí ìpínyà ọkàn
  rationale: Ó ṣàpèjúwe jíjẹ́ aláìní ìpínyà tàbí ohun tí ń fa ọkàn sí ibòmíràn; gbolohun yìí jẹ́ Yorùbá àdánidá fún ìfọkànsìn aláìní ìdíwọ́.
theological_decisions:
- issue: Bí àṣẹ Pọ́ọ̀lù ṣe lágbára tó
  choice: ‘kì í ṣe láti fi okùn sí ọrùn yín’
  alternative: ‘kì í ṣe láti dá yín dúró’ tàbí ‘láti fi òfin mú yín’
  rationale: A pa àwòrán gidi βρόχον mọ́, kí a má bàa sọ ọ́ di òfin ìjọ tàbí ìdènà lásán; Pọ́ọ̀lù sọ pé ète rẹ̀ kì í ṣe láti há wọn mọ́lẹ̀.
- issue: Ìtumọ̀ εὐπάρεδρον τῷ κυρίῳ
  choice: ‘fún fífi ara yín fún Olúwa’
  alternative: ‘fún iṣẹ́ ìsìn Olúwa’ tàbí ‘fún jíjókòó lẹ́gbẹ̀ẹ́ Olúwa’
  rationale: Ìtumọ̀ yìí dá ìfọkànsìn sí Olúwa dúró láìfi èrò iṣẹ́ ìjọ kan pàtó tàbí àwòrán jíjókòó gangan kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye. A lo ‘tiyín’ gẹ́gẹ́ bí àkópọ̀ ‘ti yín’; ‘okùn sí ọrùn’ pa àwòrán ìdẹ̀ mọ́ láìjẹ́ kí gbolohun náà le koko ju bó ṣe yẹ lọ. ‘Ìpínyà ọkàn’ jẹ́ àfihàn àdánidá fún àìní ìyàlẹ́nu tàbí ohun tó ń fa ọkàn sí ibòmíràn.
