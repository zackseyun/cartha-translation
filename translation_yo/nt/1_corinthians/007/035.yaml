  to: Mo sọ èyí fún àǹfààní tiyín fúnra yín, kì í ṣe láti fi okùn ìdẹ̀ sí ọrùn yín, ṣùgbọ́n láti gbé ohun tí ó yẹ ga, àti láti mú kí ẹ lè ní ìfọkànsìn sí Olúwa láìsí ìpínyà ọkàn.
  rationale: A pa ìtẹnumọ́ ‘tiyín fúnra yín’ mọ́, a sì pa àwòrán βρόχος mọ́ ní ‘okùn ìdẹ̀ sí ọrùn yín.’ A tún ṣàtúnṣe apá εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως sí ‘ní ìfọkànsìn sí Olúwa láìsí ìpínyà ọkàn,’ kí ó lè sọ ìtumọ̀ ìfọkànsìn tí kò ní ìdíwọ́ náà ní Yorùbá àdánidá.
