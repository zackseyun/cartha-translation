  rationale: A tún gbolóhùn ìkẹyìn ṣe láti fi ìtumọ̀ ἠλεημένος ὑπὸ κυρίου hàn pé ẹni tí Olúwa ti ṣàánú fún ni Pọ́ọ̀lù, kì í ṣe pé àánú náà kan jẹ́ ọ̀nà ìṣe. A tún mú ìṣọ̀kan Yorùbá rẹ̀ rọrùn, a sì ṣàtúnṣe ọ̀rọ̀ yíyàn nínú akọsílẹ̀ c. Àwọn ìpinnu nípa ìtumọ̀ tí a kò dájú, pàápàá ‘wúńdíá,’ ni a pa mọ́ láì fi ìtumọ̀ ẹ̀kọ́ kan kún un.
