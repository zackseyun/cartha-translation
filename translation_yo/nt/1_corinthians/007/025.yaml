reference: 1 Corinthians 7:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: yo
  text: Ní ti àwọn wúńdíá[a], èmi kò ní àṣẹ kankan láti ọ̀dọ̀ Olúwa; ṣùgbọ́n mo ń sọ ìdájọ́ mi[b], gẹ́gẹ́ bí ẹni tí Olúwa ti ṣàánú fún, tí ó sì ṣeé fọkàn tán[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn obìnrin tí kò tíì gbéyàwó,” tàbí, gẹ́gẹ́ bí àwọn kan ṣe lóye àyíká ọ̀rọ̀ náà, “àwọn ọmọbìnrin wúńdíá.” Gíríìkì ní “àwọn wúńdíá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “èrò mi” tàbí “ìmọ̀ràn mi.” Níhìn-ín Pọ́ọ̀lù fi ìdájọ́ tí ó fara balẹ̀ ṣe yàtọ̀ sí àṣẹ tààrà “láti ọ̀dọ̀ Olúwa.”
    reason: alternative_reading
  - marker: c
    text: Tàbí “olùṣòtítọ́.” Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ẹni tí ó jẹ́ olùṣòtítọ́ tàbí ẹni tí ó ṣeé fọkàn tán; níhìn-ín ó ṣeé ṣe kó túmọ̀ sí pé, nípa àánú Olúwa, Pọ́ọ̀lù jẹ́ olùtọ́sọ́nà tí a lè gbára lé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ní ti
  rationale: Ó ṣàmì sí ìyípadà sí kókó tuntun láì fi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: τῶν παρθένων
  choice: àwọn wúńdíá
  rationale: Èyí pa ìtumọ̀ ìpìlẹ̀ ‘àwọn wúńdíá’ mọ́, kò sì fi tipátipá pinnu bóyá àwọn obìnrin tí kò tíì gbéyàwó tàbí àwọn ọmọbìnrin wúńdíá kan pàtó ni ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: ἐπιταγὴν κυρίου
  choice: àṣẹ kankan láti ọ̀dọ̀ Olúwa
  rationale: ‘Àṣẹ’ fi agbára ἐπιταγή hàn, ‘láti ọ̀dọ̀ Olúwa’ sì mú orísun àṣẹ náà ṣe kedere.
- source_word: γνώμην δὲ δίδωμι
  choice: ṣùgbọ́n mo ń sọ ìdájọ́ mi
  rationale: ‘Ìdájọ́ mi’ túmọ̀ γνώμη gẹ́gẹ́ bí èrò tí a ti fara balẹ̀ gbé yẹ̀ wò, ó sì pa ìyàtọ̀ rẹ̀ sí àṣẹ tààrà mọ́; ‘mo ń sọ’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi èrò tàbí ìdájọ́ ẹni hàn.
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: nípa àánú Olúwa
  rationale: Ó fi hàn ní ṣókí pé ipò Pọ́ọ̀lù dá lórí àánú tí ó rí gbà lọ́dọ̀ Olúwa.
- source_word: πιστὸς εἶναι
  choice: ó ṣeé fọkàn tán
  rationale: Nínú àyíká yìí, πιστός ń tẹnumọ́ pé a lè gbára lé Pọ́ọ̀lù gẹ́gẹ́ bí ẹni tó ń fúnni ní ìtọ́sọ́nà, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè túmọ̀ sí ‘olóòtítọ́.’
theological_decisions:
- issue: Irú àṣẹ tí Pọ́ọ̀lù ní nígbà tí kò ní àṣẹ tààrà láti ọ̀dọ̀ Olúwa
  choice: A fi ìyàtọ̀ hàn láàárín àṣẹ tààrà láti ọ̀dọ̀ Olúwa àti ìdájọ́ Pọ́ọ̀lù gẹ́gẹ́ bí ẹni tí ó ṣeé fọkàn tán nípa àánú Olúwa.
  alternative: Kí a pe ọ̀rọ̀ Pọ́ọ̀lù ní èrò ara ẹni lásán tí kò ní agbára, tàbí kí a mú un dọ́gba pátápátá pẹ̀lú àṣẹ tààrà kan láti ọ̀dọ̀ Jésù.
  rationale: Ìtakora tó wà láàárín ἐπιταγή àti γνώμη fi hàn pé kò sí àṣẹ tààrà tí a tọ́ka sí lórí ọ̀ràn yìí, ṣùgbọ́n Pọ́ọ̀lù ṣì gbé ìdájọ́ rẹ̀ kalẹ̀ gẹ́gẹ́ bí ẹni tí Olúwa ti ṣàánú fún tí ó sì ṣeé fọkàn tán. A pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láì dín tàbí pọ̀ sí i.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀nà ọ̀rọ̀ tó bójú mu, tó níyì, tí òǹkàwé òde òní sì lè lóye. A lo ‘wúńdíá’ láti pa àìdánilójú ẹni tí ọ̀rọ̀ náà ń tọ́ka sí mọ́, a sì lo ‘ó ṣeé fọkàn tán’ fún Yorùbá àdánidá tí ó bá ipa πιστός mu nínú àyíká yìí.
