  source_fidelity: 'Ìtumọ̀ náà dára ní gbogbo rẹ̀: ó pa ìyípadà kókó-ọ̀rọ̀, ‘àwọn wúńdíá,’ àìsí àṣẹ tààrà láti ọ̀dọ̀ Olúwa, àti ìdájọ́ Pọ́ọ̀lù mọ́. Síbẹ̀, ‘nípa àánú Olúwa’ kò fi pípé ìṣe àìgbẹ́yìn (ἠλεημένος, ‘ẹni tí a ti ṣàánú fún’) hàn kedere, ó sì lè dà bí àánú náà jẹ́ ọ̀nà tí ó fi di ẹni ṣeé fọkàn tán.'
  naturalness: ‘gẹ́gẹ́ bí ẹni tí, nípa àánú Olúwa, ó ṣeé fọkàn tán’ kò rọrùn tó nítorí ìsọ̀kan ‘ẹni tí ... ó’. Ìṣọ̀kan ‘gẹ́gẹ́ bí ẹni tí Olúwa ti ṣàánú fún, tí ó sì ṣeé fọkàn tán’ jẹ́ Yorùbá boṣewa tó yéye, ó sì tẹ̀lé ìkọ́sẹ̀jẹ Gíríìkì dáadáa.
  terminology: ‘Wúńdíá,’ ‘àṣẹ,’ ‘ìdájọ́ mi,’ àti ‘ṣeé fọkàn tán’ bá àyíká ọ̀rọ̀ mu. Nínú àlàyé akọsílẹ̀ c, ‘olùṣòtítọ́’ dára ju ‘olóòtítọ́’ lọ fún ìtumọ̀ yíyàn ‘faithful,’ níwọ̀n bí ‘olóòtítọ́’ ti lè tọ́ka sí ẹni tí ó sọ òtítọ́.
