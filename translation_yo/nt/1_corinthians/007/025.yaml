    rationale: Gíríìkì náà sọ pé Pọ́ọ̀lù jẹ́ ẹni tí Olúwa ti ṣàánú fún. Àtúnṣe náà pa ìtumọ̀ yìí mọ́, ó sì yẹra fún lílo ‘nípa àánú’ tó lè ní ìtumọ̀ ọ̀nà.
  - severity: low
    issue: Ìṣọ̀kan gbolóhùn ìgbẹ́kẹ̀lé kò rọrùn.
    rationale: ‘Ẹni tí ... ó ṣeé fọkàn tán’ lè jẹ́ ìtẹ̀síwájú tí kò dán mọ́rán; fífi ‘tí ó sì’ kun un mú un rọrùn, ó sì so àwọn apá méjèèjì pọ̀.
  - severity: low
    issue: Ọ̀rọ̀ yíyàn ‘faithful’ nínú akọsílẹ̀ c nílò ọ̀rọ̀ Yorùbá tó péye.
