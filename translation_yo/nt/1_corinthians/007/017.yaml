id: 1CO.7.17
reference: 1 Corinthians 7:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: yo
  text: 'Síbẹ̀, gẹ́gẹ́ bí Olúwa ti pín fún olúkúlùkù[a], gẹ́gẹ́ bí Ọlọ́run ti pè olúkúlùkù, bẹ́ẹ̀ ni kí olúkúlùkù máa rìn[b]. Báyìí ni mo ń pàṣẹ ní gbogbo àwọn ìjọ.


    [a] Tàbí, “ti yan ìpín fún olúkúlùkù” tàbí “ti fi fún olúkúlùkù.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ohun tí Olúwa pín tàbí yàn fún ẹnì kọ̀ọ̀kan.


    [b] “Máa rìn” jẹ́ àkàwé tí Bíbélì sábà máa ń lò fún bí ènìyàn ṣe ń gbé ìgbésí ayé rẹ̀; a tún lè túmọ̀ rẹ̀ sí “máa gbé ìgbésí ayé rẹ̀” tàbí “máa hùwà.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti yan ìpín fún olúkúlùkù” tàbí “ti fi fún olúkúlùkù.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ohun tí Olúwa pín tàbí yàn fún ẹnì kọ̀ọ̀kan.
    reason: lexical_alternative
  - marker: b
    text: “Máa rìn” jẹ́ àkàwé tí Bíbélì sábà máa ń lò fún bí ènìyàn ṣe ń gbé ìgbésí ayé rẹ̀; a tún lè túmọ̀ rẹ̀ sí “máa gbé ìgbésí ayé rẹ̀” tàbí “máa hùwà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: Àfi pé
  rationale: Ó fi ìyàsọ́tọ̀ tàbí ìyípadà ọ̀rọ̀ hàn níbí, kì í ṣe gbólóhùn oníṣ شرط gidi; “Àfi pé” pa ìfarahàn orísun mọ́ ní Yorùbá.
- source_word: ἑκάστῳ / ἕκαστον
  choice: olúkúlùkù
  rationale: A tún ọ̀rọ̀ náà sọ bí Gíríìkì ṣe tún un sọ, láti pa ìtumọ̀ pé ìlànà náà kan ẹnì kọ̀ọ̀kan mọ́.
- source_word: ἐμέρισεν
  choice: ti pín fún
  rationale: Ó lè túmọ̀ sí pípín, yíyan ìpín, tàbí fífi ipò kan fún ẹnì kọ̀ọ̀kan; “ti pín fún” jẹ́ kedere, ó sì ṣí àyè sí ìtumọ̀ wọ̀nyí.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó fìdí múlẹ̀ fún akọ́lé κύριος ní àyíká yìí.
- source_word: κέκληκεν
  choice: ti pè
  rationale: Ó sọ ìpè tí ó ti ṣẹlẹ̀ tí ipa rẹ̀ sì ṣì wà; ìṣètò “ti pè” mú èyí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Ìtumọ̀ Yorùbá tó ṣe déédéé fún θεός.
- source_word: οὕτως
  choice: bẹ́ẹ̀ ni / Bákan náà
  rationale: Àwọn ọ̀rọ̀ yìí pa agbára ọ̀nà tàbí ìlànà tí οὕτως ń tọ́ka sí mọ́, pẹ̀lú àtúnsọ rẹ̀ nínú ẹsẹ náà.
- source_word: περιπατείτω
  choice: kí ... máa rìn
  rationale: Ó pa àkàwé Pọ́ọ̀lù fún ìwàláàyè mọ́; àlàyé ìsàlẹ̀ ojú ìwé mú ìtumọ̀ rẹ̀ yé òǹkàwé òde òní.
- source_word: διατάσσομαι
  choice: mo ṣe ń pàṣẹ
  rationale: Ó fi àṣẹ Pọ́ọ̀lù nínú fífi ìlànà lélẹ̀ hàn, láìfi ìtumọ̀ mìíràn kún un.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: ní gbogbo àwọn ìjọ
  rationale: “Ìjọ” ni ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání fún àwọn àwùjọ Kristẹni agbègbè tí Pọ́ọ̀lù ń tọ́ka sí.
theological_decisions:
- issue: Ìyàtọ̀ láàárín “Olúwa” àti “Ọlọ́run”
  choice: 'A pa akọ́lé méjèèjì mọ́ lọ́tọ̀: “bí Olúwa ti pín ... bí Ọlọ́run ti pè.”'
  alternative: Kí a ka méjèèjì sí ọ̀nà ọ̀rọ̀ méjì fún ẹni àtọ̀runwá kan náà, kí a sì mú wọn dọ́gba nínú ìtumọ̀.
  rationale: Gíríìkì lo àwọn orúkọ méjì ọ̀tọ̀ ní àwọn gbólóhùn tó jọ ara wọn; ìtumọ̀ kò yẹ kí ó parẹ́ ìyàtọ̀ tàbí ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ yìí.
- issue: Àkàwé ìwàláàyè nínú περιπατείτω
  choice: A pa àkàwé náà mọ́ pẹ̀lú “kí ... máa rìn.”
  alternative: Kí a túmọ̀ rẹ̀ ní tààrà sí “kí ... máa gbé ìgbésí ayé rẹ̀.”
  rationale: Àkàwé náà ṣe pàtàkì nínú ọ̀rọ̀ Pọ́ọ̀lù, ó sì ṣeé lóye pẹ̀lú àlàyé kékeré; pípa á mọ́ kò fi ìtumọ̀ tóóró kan lé ọ̀rọ̀ náà lórí.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; a pa ìtòlẹ́sẹẹsẹ àti àtúnsọ Gíríìkì mọ́ níwọ̀n tí Yorùbá àdánidá gbà.
