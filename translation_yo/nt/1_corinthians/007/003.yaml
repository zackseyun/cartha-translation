  to: Kí ọkọ máa fún aya rẹ ní ohun tí ó yẹ fún un[a]; bákan náà ni kí aya náà máa fún ọkọ rẹ ní ohun tí ó yẹ fún un.
  rationale: A tún ìtumọ̀ náà ṣe kí ọ̀rọ̀ ὀφειλή (‘ohun tí a jẹ́ ẹni’) hàn ní ìwọ̀n kan náà fún aya àti ọkọ, gẹ́gẹ́ bí àgbékalẹ̀ Gíríìkì. ‘Ohun tí ó yẹ fún un’ jẹ́ àṣàyàn Yorùbá tó rọrùn, tó sì pa ìtumọ̀ gbooro náà mọ́; àlàyé ìsàlẹ̀ ṣàlàyé ìtumọ̀ rẹ̀ nínú àyíká láì sọ ọ́ di ìtumọ̀ pàtó ju orísun lọ.
