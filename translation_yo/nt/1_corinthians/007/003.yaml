    rationale: Ọ̀rọ̀ Gíríìkì ní ὁμοίως ... ἡ γυνὴ τῷ ἀνδρί, èyí tí ó ń tún ìṣe ‘fúnni ní ohun tí a jẹ́ ẹni’ ṣe fún aya. Títún un sọ ní Yorùbá ń pa ìdọ́gba gírámà àti ìtumọ̀ mọ́.
  - severity: low
    issue: ‘Ohun tí ó tọ́ sí i’ jẹ́ àṣàyàn tí kò wọ́pọ̀ tó, ó sì lè dà bí ohun tí ó tọ́ sí ibì kan.
    rationale: ‘Ohun tí ó yẹ fún un’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere jù fún ohun tí a yẹ kí a fún ẹni, nínú àyíká yìí.
  - severity: low
    issue: Àlàyé ‘ohun tí ó jẹ ẹ́ ní gbèsè’ nílò àtúnṣe gírámà.
    rationale: Fún ‘the duty owed to her,’ Yorùbá tó péye ni ‘ohun tí a jẹ ẹ́ ní gbèsè’ (tàbí ‘ohun tí a jẹ ẹni ní gbèsè’), kì í ṣe ‘ohun tí ó jẹ ẹ́ ní gbèsè.’
