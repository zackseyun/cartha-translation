id: 1CO.7.3
reference: 1 Corinthians 7:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: yo
  text: Kí ọkọ máa fún aya rẹ ní ohun tí ó yẹ fún un[a]; bákan náà ni kí aya náà máa fún ọkọ rẹ ní ohun tí ó yẹ fún un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun tí a jẹ ẹ́ ní gbèsè.” Ní ti gidi, ọ̀rọ̀ Gíríìkì túmọ̀ sí “gbèsè” tàbí “ojúṣe.” Nínú àyíká yìí, ó ń tọ́ka sí ojúṣe ìbálòpọ̀ tí ọkọ àti aya ní sí ara wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναικί
  choice: aya rẹ
  rationale: Nínú ọ̀rọ̀ tó yí ẹsẹ̀ náà ká, γυνή ń tọ́ka sí aya, kì í ṣe obìnrin lápapọ̀.
- source_word: ἀνήρ
  choice: ọkọ
  rationale: Nínú àyíká ìgbéyàwó yìí, ἀνήρ túmọ̀ sí ọkọ.
- source_word: ὀφειλήν
  choice: ohun tí ó tọ́ sí i nínú ìgbéyàwó
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtàkì sí ohun tí ẹnì kan jẹ ẹlòmíràn ní gbèsè tàbí ojúṣe láti fún un; àyíká ẹsẹ̀ yìí fi hàn pé ó jẹ́ ojúṣe ìbálòpọ̀ láàárín tọkọtaya, ṣùgbọ́n ìtumọ̀ yìí kò fi ọ̀rọ̀ tóóró ju ti Gíríìkì lọ sínú ẹsẹ̀ náà.
- source_word: ἀποδιδότω
  choice: kí ... máa fún
  rationale: Àṣẹ ìsinsìnyí náà ń sọ ojúṣe tí ó yẹ kí ó máa bá a lọ; ìlò ‘kí ... máa’ fi èyí hàn ní Yorùbá àdánidá.
- source_word: ὁμοίως δὲ καὶ
  choice: bákan náà
  rationale: Ó fi ìdọ́gba àti ojúṣe tí ọkọ àti aya ní sí ara wọn hàn ní ṣókí.
theological_decisions:
- issue: Bí a ṣe yẹ kí a sọ ojúṣe tí ὀφειλή ń tọ́ka sí ní kedere
  choice: ohun tí ó tọ́ sí i nínú ìgbéyàwó
  alternative: ojúṣe ìbálòpọ̀ rẹ; ohun tí ó jẹ ẹ́ ní gbèsè
  rationale: Àṣàyàn yìí pa ìtumọ̀ ‘ohun tí a jẹ ẹnì kejì’ mọ́, ó sì jẹ́ kí àyíká ìgbéyàwó ṣàlàyé irú ojúṣe náà láìsọ ọ́ di ọ̀rọ̀ tóóró tàbí ti òfin ju orísun lọ.
- issue: Ìdọ́gba ojúṣe ọkọ àti aya
  choice: Lo àgbékalẹ̀ tó dọ́gba fún ọkọ àti aya
  alternative: Ṣàlàyé ojúṣe ọkọ ní kíkún, kí a sì fi ti aya hàn ní ṣókí
  rationale: Ọ̀rọ̀ ὁμοίως àti ìṣọ̀kan àwọn gbólóhùn méjèèjì tẹnumọ́ pé ojúṣe náà jẹ́ ti ara wọn ní ìwọ̀n kan náà.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti òde òní ni a lò. Àgbékalẹ̀ ‘kí ... máa’ mú àṣẹ tí ń bá a lọ jáde, ‘bákan náà’ sì pa ìdọ́gba ọkọ àti aya mọ́.
