  - severity: low
    issue: ‘Wúńdíá tí ó jẹ́ tirẹ̀’ àti ‘ṣe rere’
    rationale: Wọ́n jẹ́ ìtumọ̀ tí a lè lóye, ṣùgbọ́n ‘wúńdíá rẹ̀’ àti ‘ṣe dáadáa’ jẹ́ Yorùbá òde òní tí ó rọrùn, tí ó sì pa ìtumọ̀ Gíríìkì mọ́.
