id: 1CO.7.38
reference: 1 Corinthians 7:38
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: yo
  text: Nítorí náà[a], ẹni tí ó fi wúńdíá rẹ̀ fún ọkọ ń ṣe dáadáa; ẹni tí kò sì fi í fún ọkọ yóò túbọ̀ ṣe dáadáa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó fẹ́ àfẹ́sọ́nà rẹ̀ tí ó jẹ́ wúńdíá ń ṣe dáadáa; ẹni tí kò sì fẹ́ ẹ yóò túbọ̀ ṣe dáadáa.” Ìtumọ̀ mìíràn tí ó wọ́pọ̀ ni “ọmọbìnrin rẹ̀ tí ó jẹ́ wúńdíá.” Ọ̀rọ̀-ìṣe Gíríìkì tí a lò níbí sábà máa ń túmọ̀ sí “fi fún ọkọ”; nítorí náà, ọ̀rọ̀ pàtàkì pa ìtumọ̀ yẹn mọ́, ṣùgbọ́n kò sọ ìbátan wọn ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ ìparí èrò tí Paulu ti ń ṣàlàyé ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ inferential náà ní Yorùbá.
- source_word: γαμίζων
  choice: ẹni tí ó fi ... fún ọkọ
  rationale: Ọ̀rọ̀-ìṣe γαμίζω ní ìtumọ̀ causative, ìyẹn ‘fi obìnrin fún ọkọ,’ dípò ‘fẹ́ obìnrin.’ Ìtumọ̀ yìí ń pa ìyàtọ̀ rẹ̀ mọ́ sí γαμέω.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: wúńdíá tí ó jẹ́ tirẹ̀
  rationale: ‘Wúńdíá’ túmọ̀ παρθένος, ‘tí ó jẹ́ tirẹ̀’ sì pa ìbátan tàbí ojúṣe tí ἑαυτοῦ tọ́ka sí mọ́ láì pinnu pé ọmọbìnrin rẹ̀ tàbí àfẹ́sọ́nà rẹ̀ ni.
- source_word: καλῶς ποιεῖ
  choice: ṣe rere
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere, tí ó sì pa ìdájọ́ rere inú Gíríìkì mọ́ láì sọ ọ́ di àṣẹ pípé.
- source_word: μὴ γαμίζων
  choice: ẹni tí kò sì fi í fún ọkọ
  rationale: A lo ìtumọ̀ causative kan náà gẹ́gẹ́ bí apá àkọ́kọ́; ‘í’ ń tọ́ka padà sí wúńdíá náà lọ́nà àdánidá.
- source_word: κρεῖσσον ποιήσει
  choice: yóò ṣe ohun tí ó dára jù
  rationale: ‘Dára jù’ fi ìfiwéra κρεῖσσον hàn, kì í sì í gbé e ga sí superlative bí ‘èyí tí ó dára jù lọ.’ ‘Yóò’ tún pa ọ̀nà ọjọ́ iwájú ποιήσει mọ́.
theological_decisions:
- issue: Ẹni tí ‘wúńdíá tí ó jẹ́ tirẹ̀’ ń tọ́ka sí àti ìtumọ̀ γαμίζω nínú 1 Kọrinti 7:38
  choice: Ọ̀rọ̀ pàtàkì lo ìtumọ̀ causative, ‘fi ... fún ọkọ,’ ó sì fi ìbátan wúńdíá náà sí ọkùnrin náà sílẹ̀ láì sọ pé ọmọbìnrin rẹ̀ gan-an ni.
  alternative: Ó ṣeé túmọ̀ sí, ‘ẹni tí ó fẹ́ àfẹ́sọ́nà rẹ̀ tí ó jẹ́ wúńdíá ṣe rere; ẹni tí kò sì fẹ́ ẹ yóò ṣe ohun tí ó dára jù.’ Ìtumọ̀ mìíràn tí ó wọ́pọ̀ ni pé wúńdíá náà jẹ́ ọmọbìnrin rẹ̀.
  rationale: Ẹsẹ 36–38 jẹ́ ibi tí àwọn onítúmọ̀ ti ní èrò ọ̀tọ̀ọ̀tọ̀. Ìtumọ̀ causative ni γαμίζω sábà máa ń ní, ṣùgbọ́n Gíríìkì kò sọ ní kedere bóyá wúńdíá náà jẹ́ ọmọbìnrin, ẹni tí ó wà lábẹ́ àbójútó rẹ̀, tàbí àfẹ́sọ́nà rẹ̀. Nítorí náà, a pa ìṣòro ìtumọ̀ náà mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé àwọn ìtumọ̀ míì nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àgbàṣe tí ó bójú mu, tí ó ní àmì ohùn níbi tí ó yẹ, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn ‘wúńdíá tí ó jẹ́ tirẹ̀’ jẹ́ àrà díẹ̀ ní Yorùbá, ṣùgbọ́n a mọ̀ọ́mọ̀ lò ó láti pa àìdájú tó wà nínú Gíríìkì mọ́; àlàyé ìsàlẹ̀ mú àwọn ìtumọ̀ àdánidá mìíràn hàn.
