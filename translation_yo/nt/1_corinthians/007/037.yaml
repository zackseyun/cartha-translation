id: 1CO.7.37
reference: 1 Corinthians 7:37
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: yo
  text: Ṣùgbọ́n ẹni tí ó dúró ṣinṣin nínú ọkàn rẹ̀, tí kò ní ìfipámúni kankan[a], ṣùgbọ́n tí ó ní àṣẹ lórí ìfẹ́-inú tirẹ̀, tí ó sì ti pinnu èyí nínú ọkàn tirẹ̀—láti pa wúńdíá tirẹ̀ mọ́[b]—yóò ṣe dáadáa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò sí ohun tí ó pọndandan fún un.”
    reason: lexical_alternative
  - marker: b
    text: “Wúńdíá tirẹ̀” lè tọ́ka sí ọmọbìnrin wúńdíá rẹ̀ tàbí sí àfẹ́sọ́nà wúńdíá rẹ̀; àwọn onímọ̀ ní èrò oríṣiríṣi nípa Gíríìkì náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: ó dúró ṣinṣin
  rationale: Ó fi ìpinnu inú tí ó ti fìdí múlẹ̀ hàn ní Yorùbá àdánidá.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: nínú ọkàn rẹ̀
  rationale: Ó pa àkàwé Bíbélì mọ́, ọkàn sì ń tọ́ka sí inú ẹni gẹ́gẹ́ bí ibùdó ìpinnu.
- source_word: μὴ ἔχων ἀνάγκην
  choice: tí kò sí ohun tí ó pọndandan fún un
  rationale: Ó pa ìtumọ̀ necessity mọ́ láì fi dandan túmọ̀ rẹ̀ sí ìfipámúni; àṣàyàn yẹn wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: tí ó ní àṣẹ lórí ìfẹ́ inú ara rẹ̀
  rationale: Àṣẹ ṣe aṣojú ἐξουσία, ìfẹ́ inú sì gba θέλημα gẹ́gẹ́ bí ìfẹ́ tàbí ète ẹni láì fi ìtumọ̀ ìbálòpọ̀ kún un.
- source_word: κέκρικεν
  choice: tí ó sì ti pinnu
  rationale: Àmì ‘ti’ fi hàn pé ìpinnu náà ti dé ipò tí ó fìdí múlẹ̀.
- source_word: τηρεῖν
  choice: láti pa ... mọ́
  rationale: Èyí ni ìtumọ̀ tó sún mọ́ ‘keep/preserve,’ láì ṣàfikún ‘láì gbéyàwó’ tí kò fara hàn gbangba nínú Gíríìkì.
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: wúńdíá tirẹ̀
  rationale: Ọ̀rọ̀ náà mọ̀ọ́mọ̀ pa àìdánilójú Gíríìkì mọ́ nípa bóyá ọmọbìnrin wúńdíá rẹ̀ ni tàbí àfẹ́sọ́nà rẹ̀.
- source_word: καλῶς ποιήσει
  choice: yóò ṣe dáadáa
  rationale: Gbólóhùn Yorùbá àdánidá tí ó túmọ̀ sí pé yóò hùwà lọ́nà tí ó yẹ tàbí tí ó yẹ fún ìyìn.
theological_decisions:
- issue: Ẹni tí ‘wúńdíá tirẹ̀’ (τὴν ἑαυτοῦ παρθένον) ń tọ́ka sí
  choice: Pa ọ̀rọ̀ àìdánilójú ‘wúńdíá tirẹ̀’ mọ́ nínú ẹsẹ̀.
  alternative: ‘ọmọbìnrin wúńdíá rẹ̀’ tàbí ‘àfẹ́sọ́nà wúńdíá rẹ̀’
  rationale: Gíríìkì kò fi kedere bóyá bàbá tàbí alágbàtọ́ ni a ń sọ̀rọ̀ rẹ̀, tàbí ọkùnrin kan àti àfẹ́sọ́nà rẹ̀; ìtumọ̀ kò gbọ́dọ̀ yan ọ̀kan ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye; a pa àkàwé ‘nínú ọkàn’ àti àìdánilójú pàtàkì nínú orísun mọ́. Gbogbo àmì àlàyé ìsàlẹ̀ [a], [b] fara hàn nínú ẹsẹ̀.
