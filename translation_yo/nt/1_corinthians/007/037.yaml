- from: Ṣùgbọ́n ẹni tí ó dúró ṣinṣin nínú ọkàn rẹ̀[a], tí kò sí ohun tí ó pọndandan fún un, ṣùgbọ́n tí ó ní àṣẹ lórí ìfẹ́ inú ara rẹ̀, tí ó sì ti pinnu èyí nínú ọkàn ara rẹ̀—láti pa wúńdíá tirẹ̀ mọ́[b]—yóò ṣe dáadáa.
  to: Ṣùgbọ́n ẹni tí ó dúró ṣinṣin nínú ọkàn rẹ̀, tí kò ní ìfipámúni kankan[a], ṣùgbọ́n tí ó ní àṣẹ lórí ìfẹ́-inú tirẹ̀, tí ó sì ti pinnu èyí nínú ọkàn tirẹ̀—láti pa wúńdíá tirẹ̀ mọ́[b]—yóò ṣe dáadáa.
  rationale: A tún gbe àmì [a] sí ibi tí ó ń tọ́ka sí ἀνάγκη, a sì tún ọrọ̀ náà ṣe sí Yorùbá tó rọrùn. A rọ́pò ‘ìfẹ́ inú ara rẹ̀’ pẹ̀lú ‘ìfẹ́-inú tirẹ̀’ láti fi θέλημα hàn láì mú ìtumọ̀ ìfẹ́ ara wá. Àìdánilójú nípa ‘wúńdíá tirẹ̀’ àti ìtumọ̀ ‘pa ... mọ́’ ni a pa mọ́.
