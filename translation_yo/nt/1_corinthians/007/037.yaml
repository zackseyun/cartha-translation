  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ètò Gíríìkì dáadáa: ìdúró ìfẹ̀sẹ̀múlẹ̀ nínú ọkàn, àìsí ìdíwọ́/ìfipámúni, àṣẹ lórí ìfẹ́-inú, ìpinnu tí a ti ṣe, àti ìṣe ‘mímú wúńdíá tirẹ̀ pamọ́’ ni a pa mọ́. Ó tún dá àìdánilójú τὴν ἑαυτοῦ παρθένον dúró láì yan ‘ọmọbìnrin’ tàbí ‘àfẹ́sọ́nà.’'
  naturalness: ‘Ohun tí ó pọndandan fún un’ lè yéni, ṣùgbọ́n kò rọrùn gan-an nínú Yorùbá ìgbàlódé nínú àyíká yìí. ‘Tí kò ní ìfipámúni kankan’ jẹ́ gbólóhùn tó ṣókí, tó dájú, tí ó sì bá ἀνάγκη mu. ‘Ìfẹ́ inú ara rẹ̀’ lè fa ìtumọ̀ ‘ìfẹ́ ara/bodily desire’; ‘ìfẹ́-inú tirẹ̀’ dára jù fún θέλημα.
  terminology: ‘Wúńdíá tirẹ̀’ jẹ́ yíyan tó yẹ, nítorí ó pa ìtumọ̀ παρθένος mọ́, ó sì fi ohun tí a ń jiyàn sílẹ̀ fún àlàyé ìsàlẹ̀. ‘Pa ... mọ́’ jẹ́ ìbámu tó péye fún τηρεῖν nínú ìtumọ̀ tó mọ̀ọ́mọ̀ fi ọ̀rọ̀ sílẹ̀ ní fífẹ̀.
  issues:
  - severity: medium
    issue: Àmì àlàyé [a] wà lẹ́yìn ‘nínú ọkàn rẹ̀,’ ṣùgbọ́n àlàyé rẹ̀ ń ṣàlàyé μὴ ἔχων ἀνάγκην.
    rationale: Àmì náà gbọ́dọ̀ wà lẹ́yìn gbolohun ‘tí kò ní ìfipámúni kankan’ (tàbí ìtumọ̀ ‘àìsí ìdíwọ́’) kí ìtọ́kasí rẹ̀ lè péye.
  - severity: medium
    issue: ‘Ìfẹ́ inú ara rẹ̀’ kò ṣàfihàn θέλημα ní kedere, ó sì lè ní ìtànná sí ìfẹ́ ara.
    rationale: θέλημα níbí ni ìfẹ́-inú/ìfẹ́ ẹni tàbí ète ẹni; ‘ìfẹ́-inú tirẹ̀’ dá ìtumọ̀ yẹn dúró dáadáa.
