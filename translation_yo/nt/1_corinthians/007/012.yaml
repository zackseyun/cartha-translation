review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ẹ̀kúnrẹ́rẹ́ èdè Gíríìkì dáadáa: ẹgbẹ́ ‘àwọn yòókù,’ ìtẹnumọ́ Paulu ní ìyàtọ̀ pẹ̀lú Olúwa, arákùnrin kan pẹ̀lú aya aláìgbọ́gbọ́, ìfẹ́ aya náà láti gbé pọ̀, àti àṣẹ pé kí ó má ṣe dá ìgbéyàwó náà dúró. Síbẹ̀, ‘ẹ̀mi ni ó sọ èyí’ wà ní àkókò tí ó ti kọjá, nígbà tí λέγω jẹ́ ìṣe òní (‘èmi ni mo wí’).'
  naturalness: Yorùbá náà jẹ́ ti ìlò òde òní, ó sì yẹ fún ìwé mímọ́. ‘Aya náà’ dára ju ‘obìnrin náà’ lọ ní ibi yìí, nítorí ó ń pa ìtọ́kasí ìbáṣepọ̀ ìgbéyàwó tí γυναῖκα ní mọ́ kedere.
  terminology: ‘Olúwa,’ ‘arákùnrin,’ ‘aya tí kò gbàgbọ́,’ àti ‘kọ̀ ọ́ sílẹ̀’ bá ọ̀rọ̀ inú ẹsẹ̀ náà mu. Àlàyé ìsàlẹ̀ nípa ἀφίημι yẹ kí ó lo ‘rán an lọ’ gẹ́gẹ́ bí àṣàyàn tó sún mọ́ ‘send away,’ dípò kí ó fi ‘lé e lọ’ hàn gẹ́gẹ́ bí ìtumọ̀ tààrà.
  issues:
  - severity: medium
    issue: ‘ẹ̀mi ni ó sọ èyí’
    rationale: Ó túmọ̀ λέγω, ọ̀rọ̀-ìṣe àkókò òní, bí ìṣe àkókò tí ó ti kọjá. ‘Èmi ni mo wí’ pa àkókò àti ìtẹnumọ́ ἐγώ mọ́.
  - severity: low
    issue: ‘obìnrin náà’
    rationale: Bó tilẹ̀ jẹ́ pé ó tọ́ka sí ẹni kan náà, ‘aya náà’ jẹ́ ìtọ́kasí tó péye sí γυναῖκα nínú àyíká ìgbéyàwó.
  - severity: low
    issue: Àṣàyàn ‘lé e lọ’ nínú àlàyé ìsàlẹ̀
    rationale: ‘Rán an lọ’ sún mọ́ ìtumọ̀ ‘send her away’ ju, ó sì yà kúrò nínú àwọ̀ ìtumọ̀ ‘lé’ tí ó lè túmọ̀ sí lé ẹni lọ pẹ̀lú ipá.
