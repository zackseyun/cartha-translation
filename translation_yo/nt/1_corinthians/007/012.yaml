id: 1CO.7.12
reference: 1 Corinthians 7:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: yo
  text: 'Ṣùgbọ́n fún àwọn yòókù, èmi ni mo wí, kì í ṣe Olúwa: bí arákùnrin kan bá ní aya tí kò gbàgbọ́, tí aya náà sì gbà láti máa gbé pẹ̀lú rẹ̀, kí ọkùnrin náà má ṣe kọ̀ ọ́ sílẹ̀.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “má ṣe fi í sílẹ̀” tàbí “má ṣe rán an lọ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní tààrà sí “fi sílẹ̀” tàbí “rán lọ,” ṣùgbọ́n níbí ó ń tọ́ka sí píparí ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: Ṣùgbọ́n fún àwọn yòókù
  rationale: Ó tọ́ka sí àwọn ènìyàn tó ṣẹ́ kù tí ìtọ́ni tó ṣáájú kò tíì kan; “ṣùgbọ́n” fi ìyípadà pẹ̀lẹ́pẹ̀lẹ́ tí δέ ní hàn.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: èmi ni ó sọ èyí, kì í ṣe Olúwa
  rationale: Ọ̀rọ̀ “èmi” tó ní ìtẹnumọ́ pa agbára ἐγώ mọ́, ó sì fi ìyàtọ̀ tó wà láàárín ìtọ́ni Paulu àti ọ̀rọ̀ tí Olúwa fúnra rẹ̀ ti sọ hàn láì sọ pé ìtọ́ni náà kò ní àṣẹ.
- source_word: ἀδελφὸς
  choice: arákùnrin kan
  rationale: Nínú àyíká yìí, akọ ẹyọ kan ni ọ̀rọ̀ náà ń tọ́ka sí, ní ìyàtọ̀ sí aya rẹ̀; “arákùnrin” tún fi hàn pé ó jẹ́ onígbàgbọ́.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: bá ní aya tí kò gbàgbọ́
  rationale: Ìtumọ̀ ìgbéyàwó ni ἔχει γυναῖκα níbí; gbólóhùn Yorùbá yìí jẹ́ adayeba, ó sì mú ἄπιστον gẹ́gẹ́ bí àìní ìgbàgbọ́, kì í ṣe àìṣòtítọ́ nínú ìgbéyàwó.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: tí obìnrin náà sì gbà
  rationale: “Gbà” fi ìfẹ́ inú àti ìfọwọ́sí obìnrin náà hàn lọ́nà tó rọrùn fún òǹkàwé òde òní.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: láti máa gbé pẹ̀lú rẹ̀
  rationale: Ó tọ́ka sí ìgbé ayé ilé tí tọkọtaya ń pín papọ̀; “máa gbé pẹ̀lú” jẹ́ Yorùbá adayeba.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: kí ọkùnrin náà má ṣe kọ̀ ọ́ sílẹ̀
  rationale: Nínú àyíká ìgbéyàwó, ἀφίημι túmọ̀ sí fífi tàbí dídá aya sílẹ̀. “Kọ̀ ọ́ sílẹ̀” mú ìparí ìgbéyàwó yé ni Yorùbá, ṣùgbọ́n ó tún pa àwọ̀ ìtumọ̀ gbooro ti ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ Paulu pé “èmi ... kì í ṣe Olúwa”
  choice: A pa ìyàtọ̀ láàárín ìtọ́ni Paulu àti ọ̀rọ̀ Olúwa tó ti wà tẹ́lẹ̀ mọ́.
  alternative: Kí a túmọ̀ rẹ̀ bí èrò ara Paulu lásán tí kò ní àṣẹ.
  rationale: Àyíká ọ̀rọ̀ náà fi ẹ̀kọ́ Olúwa tó ti wà tẹ́lẹ̀ wé bí Paulu ṣe ń lo àṣẹ aposteli sí ọ̀ràn tí Jésù kò sọ̀rọ̀ rẹ̀ ní tààràtà. Ìtumọ̀ náà kò yanjú ìfọ̀rọ̀wérọ̀ nípa ìmísí tàbí àṣẹ mọ́ ọn lọ́nà ẹ̀kọ́ ìjọ kan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti adayeba fún òǹkàwé òde òní. A lo “kí ... má ṣe” fún àṣẹ ẹni kẹta, a sì fi àmì ohùn sí ibi tí ó bá yẹ.
