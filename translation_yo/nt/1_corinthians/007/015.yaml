  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì SBLGNT dáadáa: ‘bí ẹni tí kò gbàgbọ́ bá yapa, kí ó yapa’ pa àtúnlò χωρίζεται/χωριζέσθω mọ́, ó sì fi ìyọ̀ǹda hàn dípò àṣẹ ìkọ̀sílẹ̀. ‘A kò sọ arákùnrin tàbí arábìnrin náà di ẹrú’ ń ṣàfihàn οὐ δεδούλωται ní ọ̀nà tí ó pa àwòrán δουλόω mọ́, láì yanjú ìbéèrè ẹ̀kọ́ nípa àtúnfẹ́-ìgbéyàwó. ‘Ọlọ́run ti pè wá nínú àlàáfíà’ bá κέκληκεν ἡμᾶς ὁ θεός mu, pẹ̀lú ‘wá’ gẹ́gẹ́ bí ẹ̀rí ọrọ̀ SBLGNT.'
