id: 1CO.7.15
reference: 1 Corinthians 7:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹni tí kò gbàgbọ́[a] bá yapa, kí ó yapa. A kò sọ arákùnrin tàbí arábìnrin náà di ẹrú nínú irú àwọn ọ̀ràn bẹ́ẹ̀[b]; ṣùgbọ́n Ọlọ́run ti pè wá[c] nínú àlàáfíà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “aláìgbàgbọ́,” tàbí, gẹ́gẹ́ bí àyíká ṣe fi hàn, “ọkọ tàbí aya tí kò gbàgbọ́.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé “kò sí lábẹ́ ìdè.” Ṣùgbọ́n ọ̀rọ̀-ìṣe Gíríìkì náà wá láti δουλόω (“sọ di ẹrú”), kì í ṣe ọ̀rọ̀ tí a sábà máa ń lò fún “dè.”
    reason: lexical_alternative
  - marker: c
    text: Àwọn ìwé-àfọwọ́kọ kan ní “yín” dípò “wá.”
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: ẹni tí kò gbàgbọ́
  rationale: Gbólóhùn yìí pa ìtumọ̀ ọ̀rọ̀-orúkọ ajẹtífù Gíríìkì mọ́ láì fi ‘ọkọ’ tàbí ‘aya’ kún ọ̀rọ̀ pàtó, bí ó tilẹ̀ jẹ́ pé àyíká fi hàn pé ẹni tí a ń sọ̀rọ̀ rẹ̀ ni ọkọ tàbí aya aláìgbàgbọ́.
- source_word: χωρίζεται / χωριζέσθω
  choice: bá yapa / kí ó yapa
  rationale: ‘Yapa’ pa àtúnlò ọ̀rọ̀-ìṣe náà mọ́, kò sì pinnu bóyá ìkọ̀sílẹ̀ lábẹ́ òfin ni tàbí kíkúrò nílé. ‘Kí ó yapa’ jẹ́ ìyọ̀ǹda, kì í ṣe àṣẹ pé kí ẹni náà kọ ọkọ tàbí aya sílẹ̀.
- source_word: οὐ δεδούλωται
  choice: A kò sọ ... di ẹrú
  rationale: Èyí ń tẹ̀ lé δουλόω, ‘sọ di ẹrú,’ dípò fífi ọ̀rọ̀ tí ó túmọ̀ sí ‘dè’ sí i. Ó tún jẹ́ kí ààlà òmìnira tí ẹsẹ náà ń sọ̀rọ̀ rẹ̀ má ṣe di ohun tí ìtumọ̀ pinnu ju orísun lọ.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: arákùnrin tàbí arábìnrin náà
  rationale: A pa èdè ìbátan tí Pọ́ọ̀lù lò fún àwọn onígbàgbọ́ mọ́, a sì darúkọ ọkùnrin àti obìnrin ní kedere.
- source_word: ἐν τοῖς τοιούτοις
  choice: nínú irú àwọn ọ̀ràn bẹ́ẹ̀
  rationale: Èyí jẹ́ Yorùbá àdánidá fún gbólóhùn Gíríìkì tí ó ń tọ́ka sí àwọn ipò bí èyí tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe.
- source_word: ἐν δὲ εἰρήνῃ
  choice: ṣùgbọ́n ... nínú àlàáfíà
  rationale: ‘Nínú àlàáfíà’ pa àwòrán àlàáfíà gẹ́gẹ́ bí ipò tàbí àyíká ìpè Ọlọ́run mọ́, láì yí i sí ìdí kan ṣoṣo tí ó pé wọn.
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: Ọlọ́run ti pè wá
  rationale: ‘Ti pè’ ṣàfihàn iṣẹ́ tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì dúró; ‘wá’ tẹ̀ lé ẹ̀rí SBLGNT, ἡμᾶς.
theological_decisions:
- issue: Ìtumọ̀ οὐ δεδούλωται nípa òpin ìgbéyàwó àti àtúnṣe ìgbéyàwó
  choice: A túmọ̀ rẹ̀ ní ti ọ̀rọ̀ gẹ́gẹ́ bí ‘A kò sọ ... di ẹrú,’ láì sọ pé ẹsẹ náà fúnra rẹ̀ ti yanjú gbogbo ọ̀ràn àtúnṣe ìgbéyàwó.
  alternative: ‘Kò ní ìdè mọ́’ gẹ́gẹ́ bí gbólóhùn amọ̀nà kan tí ó fún ẹni náà láṣẹ láti tún ṣe ìgbéyàwó; tàbí ‘kò sí lẹ́rú’ ní kíkàn án mọ́ ṣíṣe gbogbo ohun láti dá ẹni tó ń lọ dúró.
  rationale: δουλόω túmọ̀ sí sísọ ènìyàn di ẹrú, kì í ṣe ọ̀rọ̀ Gíríìkì tí a sábà máa ń lò fún ‘dè.’ Ẹsẹ náà kò ṣàlàyé gbogbo ohun tí òmìnira yìí kàn, nítorí náà a pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Ẹni tí ὁ ἄπιστος ń tọ́ka sí
  choice: ‘Ẹni tí kò gbàgbọ́’ ni ọ̀rọ̀ inú ẹsẹ, nígbà tí àyíká fi hàn pé ọkọ tàbí aya aláìgbàgbọ́ ni.
  alternative: ‘Aláìgbàgbọ́’ tàbí ‘ọkọ tàbí aya tí kò gbàgbọ́.’
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ Gíríìkì tí kò darúkọ ọkọ tàbí aya ní tààrà mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ohun tí àyíká ń tọ́ka sí hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ, ó sì jẹ́ ọ̀wọ̀, kedere, àti èyí tí òǹkàwé òde òní lè lóye. A yan ‘àlàáfíà’ fún εἰρήνη, ‘yapa’ fún χωρίζω, àti àkópọ̀ aláìlẹ́gbẹ́ ‘A kò sọ ... di ẹrú’ láti jẹ́ kí ọ̀rọ̀ náà dùn bí Yorùbá àdánidá nígbà tí ó ṣì pa agbára àwòrán Gíríìkì mọ́.
