  source_fidelity: 'Ìtumọ̀ náà gba èrò pàtàkì ẹsẹ̀ náà dáadáa: Pọ́ọ̀lù ń tọ́ka sí àkókò tí ó ti di kúkúrú, ó sì ń tẹ̀ síwájú sí ìtọnisọ́nà fún àwọn tó ní aya. Síbẹ̀, “máa dà bí ẹni pé” lè túmọ̀ sí ìfarahàn lásán (‘look/seem as though’), dípò ipò ìgbésí-ayé tí ὡς μὴ ἔχοντες ń fi hàn. Ìtúnṣe náà lo “wà bí ẹni pé” láti pa ìfiwéra náà mọ́ láìfi ìtumọ̀ ìmúlò míì kún un.'
  naturalness: Yorùbá náà jẹ́ èdè boṣewa tí ó ní àmì ohùn tó péye ní gbogbogbòò. “Èyí ni ohun tí mo ní lọ́kàn” ṣeé lóye, ṣùgbọ́n “Èyí ni mo fẹ́ sọ” jẹ́ ọ̀nà tí ó túbọ̀ sun mọ́ ọ̀rọ̀ ìṣáájú τοῦτο δέ φημι, ó sì jẹ́ àdánidá nínú Yorùbá òde òní. A tún yí “Nítorí náà” sí ìṣètò tí ó ń pa ìsopọ̀ ‘láti ìsinsin yìí lọ, kí...’ mọ́ dáadáa.
  terminology: “Ẹ̀yin ará” yẹ fún ἀδελφοί nínú àyíká àwọn onígbàgbọ́, “àkókò náà” yẹ fún ὁ καιρός, “ti kúrú” pa ipa ìṣe pípé tí ó fi ipò ìsinsin yìí hàn mọ́, àti “aya” ni ìtumọ̀ tó yẹ fún γυναῖκας nínú àyíká ẹsẹ̀ yìí. Àwọn akọsilẹ̀ ìsàlẹ̀ ti wà níbi tó tọ́, wọ́n sì bá àwọn àmì wọn mu.
