id: 1CO.7.29
reference: 1 Corinthians 7:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: yo
  text: 'Èyí ni mo fẹ́ sọ, ẹ̀yin ará[a]: àkókò náà ti kúrú[b]; láti ìsinsin yìí lọ, kí àwọn tí wọ́n ní aya pàápàá wà bí ẹni pé wọn kò ní aya,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì túmọ̀ ní tààràtà sí “ẹ̀yin arákùnrin,” ṣùgbọ́n ó lè jẹ́ ọ̀rọ̀ ìpè sí gbogbo àwọn onígbàgbọ́, ọkùnrin àti obìnrin.
    reason: cultural_note
  - marker: b
    text: Tàbí, “àkókò tí a yàn náà ti di kúkúrú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: Èyí ni ohun tí mo ní lọ́kàn
  rationale: Ó tú ọ̀rọ̀ ìṣáájú Pọ́ọ̀lù sí Yorùbá àdánidá gẹ́gẹ́ bí ìṣàlàyé ohun tó túmọ̀ sí, kì í ṣe gẹ́gẹ́ bí gbólóhùn pé ó kàn ń sọ̀rọ̀.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún àwọn onígbàgbọ́ ẹlẹgbẹ́, ó sì lè kan ọkùnrin àti obìnrin, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ẹ̀yà akọ.
- source_word: ὁ καιρός
  choice: àkókò náà
  rationale: “Àkókò” sọ ìgbà pàtàkì tàbí ìgbà tí a yàn ní kedere; “náà” tún pa àfihàn pàtó inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: συνεσταλμένος ἐστίν
  choice: ti kúrú
  rationale: Ìṣe àsìkò pípé yìí ń tọ́ka sí ipò ìsinsin yìí tí ó jẹ́ àbájáde dídín àkókò kù. “Ti kúrú” jẹ́ Yorùbá àdánidá tí ó pa ipò àbájáde náà mọ́ láìfi ẹni tó ṣe é kún ọ̀rọ̀.
- source_word: τὸ λοιπὸν
  choice: láti ìsinsin yìí lọ
  rationale: Ó fi ipa àsìkò hàn ní Yorùbá òde òní, ó sì ṣàfihàn bí àwọn onígbàgbọ́ ṣe yẹ kí wọ́n máa gbé ní àkókò tó ṣẹ́ kù.
- source_word: ἵνα
  choice: nítorí náà … kí
  rationale: Àkójọpọ̀ yìí so àkókò tó kúrú mọ́ ìlànà tó tẹ̀ lé e, láìpinnu jù bóyá ìdí tàbí àbájáde ni ἵνα ń fi hàn.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: àwọn tí wọ́n ní aya
  rationale: Nínú àyíká yìí, γυναῖκας túmọ̀ sí “aya,” kì í ṣe “àwọn obìnrin” lásán; ìtumọ̀ náà sì tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí ju “àwọn tó gbéyàwó” lọ.
- source_word: ὡς μὴ ἔχοντες
  choice: máa dà bí ẹni pé wọn kò ní aya
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti pa ìfiwéra tó múni ronú jinlẹ̀ náà mọ́, láìsọ ọ́ di àlàyé nípa ìmọ̀lára tàbí ṣíṣe àìgbọ́kànlé ojúṣe ìgbéyàwó.
theological_decisions:
- issue: Agbára ìtọ́nisọ́nà Pọ́ọ̀lù nípa ìgbéyàwó
  choice: A tú gbólóhùn náà ní tààràtà, a kò sì rọ ọ́ di ọ̀rọ̀ nípa yíyọ ọkàn kúrò nínú ìgbéyàwó tàbí fi hàn pé ojúṣe ọkọ sí aya ti parí.
  alternative: “Kí wọ́n má ṣe fi gbogbo ọkàn rọ̀ mọ́ ìgbéyàwó wọn” tàbí àtúnsọ míì tó máa dín ìforígbárí ọ̀rọ̀ náà kù.
  rationale: Ẹsẹ náà ń sọ pé nítorí àkókò pàtàkì tó kúrú, a gbọ́dọ̀ wo ipò ìgbéyàwó ní ìmọ́lẹ̀ tuntun. Ó yẹ kí ìtumọ̀ pa ìforígbárí ẹ̀kọ́ yìí mọ́, dípò kí ó yanju rẹ̀ nípasẹ̀ àlàyé tí kò sí nínú ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọlọ́lá tó ṣeé lóye fún òǹkàwé òde òní. A pa líle àti ìforígbárí ọ̀rọ̀ ìkẹyìn mọ́, láìfi ẹ̀kọ́ ẹ̀sìn ẹ̀ka kan tàbí àlàyé olùtumọ̀ kún un.
