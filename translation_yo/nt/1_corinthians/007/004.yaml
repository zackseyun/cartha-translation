id: 1CO.7.4
reference: 1 Corinthians 7:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: yo
  text: Aya kò ní àṣẹ lórí ara tirẹ̀[a], ṣùgbọ́n ọkọ rẹ̀ ni ó ní i; bákan náà, ọkọ kò ní àṣẹ lórí ara tirẹ̀, ṣùgbọ́n aya rẹ̀ ni ó ní i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò lo àṣẹ lórí ara tirẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì lè túmọ̀ sí níní àṣẹ tàbí lílo àṣẹ; níbí, ọkọ àti aya ní àṣẹ yìí lórí ara ara wọn nínú ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: aya
  rationale: Ní àyíká ọ̀rọ̀ ìgbéyàwó ní 1 Kọrinti 7, ọ̀rọ̀ náà ń tọ́ka sí obìnrin tí ó ní ọkọ; “aya” ṣe pàtó ju “obìnrin” lọ.
- source_word: ἀνήρ
  choice: ọkọ
  rationale: Nítorí a so ọ́ pọ̀ mọ́ γυνή nínú àyíká ìgbéyàwó, “ọkọ” ni ìtumọ̀ tó yẹ ju “ọkùnrin” lọ.
- source_word: ἰδίου σώματος
  choice: ara tirẹ̀
  rationale: Ó pa ìtẹnumọ́ ἴδιος mọ́ pé ara ẹni fúnra rẹ̀ ni a ń sọ̀rọ̀ nípa rẹ̀, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐξουσιάζει
  choice: ní àṣẹ lórí
  rationale: Ó fi ìtumọ̀ níní tàbí lílo àṣẹ hàn láìtúmọ̀ rẹ̀ sí ìṣàkóso onípá; ìṣọ̀kan gbolohun méjèèjì sì mú àṣẹ alábàápín nínú ìgbéyàwó hàn.
- source_word: ἀλλά
  choice: ṣùgbọ́n
  rationale: Ó pa ìyàtọ̀ tó lágbára láàárín ẹni àti ọkọ tàbí aya ẹni mọ́.
- source_word: ὁμοίως δὲ καὶ
  choice: bákan náà
  rationale: Ó sọ ìbáradọ́gba àti ìfèsì ọ̀rọ̀ kejì sí ti àkọ́kọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Irú àṣẹ tí ẹsẹ yìí sọ pé ó wà láàárín ọkọ àti aya
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí àṣẹ tí ọkọ àti aya ní lórí ara ara wọn ní ìbáṣepọ̀ ìgbéyàwó.
  alternative: Kí a sọ ọ́ di aláìlágbára sí i pé ara ẹni “kì í ṣe tirẹ̀,” tàbí kí a mú un le sí i pé ẹnì kejì “ń ṣàkóso” ara ẹni.
  rationale: 'Èdè Gíríìkì ṣe àgbékalẹ̀ tó dọ́gba ní ọ̀nà méjèèjì: ohun tí a sọ nípa aya ni a tún sọ nípa ọkọ. “Ní àṣẹ lórí” pa agbára ọ̀rọ̀-ìṣe náà mọ́, ṣùgbọ́n kò fi ìṣàkóso ẹnì kan ṣoṣo tàbí ìfipámúni kún ẹsẹ náà.'
translation_notes:
  register: Yorùbá àgbàṣe, tó níyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo “aya” àti “ọkọ” láti fi àyíká ìgbéyàwó hàn, a sì pa ìṣọ̀kan gbolohun Gíríìkì mọ́. Àmì ohùn ni a lò níbi tí ó bá jẹ́ àdánidá.
