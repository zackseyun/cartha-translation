id: 1CO.7.14
reference: 1 Corinthians 7:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: yo
  text: Nítorí a ti sọ ọkọ aláìgbàgbọ́ di mímọ́ nípasẹ̀ aya rẹ̀, a sì ti sọ aya aláìgbàgbọ́ di mímọ́ nípasẹ̀ arákùnrin náà[b]; bí kò bá rí bẹ́ẹ̀, àwọn ọmọ yín ìbá jẹ́ aláìmọ́, ṣùgbọ́n nísinsin yìí wọ́n jẹ́ mímọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A ti sọ di mímọ́” níbí ń tọ́ka sí ipò ìyàsọ́tọ̀ tàbí mímọ́ nínú ìbáṣepọ̀ ẹni náà pẹ̀lú ọkọ tàbí aya onígbàgbọ́ àti pẹ̀lú ẹbí; kò túmọ̀ sí dandan pé ẹni aláìgbàgbọ́ náà ti rí ìgbàlà.
    reason: cultural_note
  - marker: b
    text: 'Ní Gíríìkì: “arákùnrin náà.” Ó ṣeé ṣe kí Pọ́ọ̀lù lo “arákùnrin” ní ìtumọ̀ rẹ̀ tí ó wọ́pọ̀ fún onígbàgbọ́ ẹlẹgbẹ́; níbí, ó ṣeé ṣe kí ó tọ́ka sí ọkọ onígbàgbọ́. Àwọn ẹ̀dà mìíràn lè túmọ̀ ọ́ ní kíkún sí “ọkọ onígbàgbọ́.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασται
  choice: ni a ti sọ di mímọ́
  rationale: Ọ̀rọ̀ yìí fi iṣe tí ó ti ṣẹlẹ̀ àti ipò tí ó ṣì ń bá a lọ hàn. Ó tún pa ìbátan ọ̀rọ̀ mọ́ pẹ̀lú ἅγιά, ‘mímọ́,’ láì sọ ọ́ di ẹ̀kọ́ pé ẹni aláìgbàgbọ́ ti rí ìgbàlà dájúdájú.
- source_word: ἄπιστος
  choice: tí kò gba Ọlọ́run gbọ́
  rationale: Nínú ọ̀rọ̀ nípa ìgbéyàwó yìí, ó túmọ̀ sí ẹni tí kì í ṣe onígbàgbọ́, kì í ṣe ẹni tí kò ṣeé gbẹ́kẹ̀ lé.
- source_word: ἐν
  choice: nípasẹ̀
  rationale: Èyí mú ìtumọ̀ ìbáṣepọ̀ tàbí ọ̀nà tí ipò náà fi wáyé jáde ní Yorùbá, láì mú gbólóhùn náà le tàbí dà bí àtúmọ̀ ọ̀rọ̀-lẹ́nu-ọ̀rọ̀.
- source_word: ἀνήρ / γυνή
  choice: ọkọ / aya
  rationale: Àyíká ẹsẹ náà jẹ́ ti ìgbéyàwó, nítorí náà ‘ọkọ’ àti ‘aya’ ni ìtumọ̀ tó bá a mu.
- source_word: ἀδελφῷ
  choice: arákùnrin náà
  rationale: A pa ọ̀rọ̀ Gíríìkì náà mọ́ dípò lílo ‘ọkọ’ fún un. Ní ìlò Pọ́ọ̀lù, ó ṣeé ṣe kí ó tọ́ka sí ọkọ tí ó jẹ́ onígbàgbọ́; àlàyé wà nínú àlàyé ìsàlẹ̀.
- source_word: ἐπεὶ ἄρα
  choice: bí kò bá rí bẹ́ẹ̀
  rationale: Ó fi àbájáde ohun tí yóò jẹ́ òtítọ́ bí gbólóhùn tó ṣáájú kò bá rí bẹ́ẹ̀ hàn ní Yorùbá àdánidá.
- source_word: ἀκάθαρτα
  choice: aláìmọ́
  rationale: ‘Aláìmọ́’ pa ìtumọ̀ ìwẹ̀nùmọ́ àti ipò ẹ̀sìn tó wà nínú ọ̀rọ̀ Gíríìkì mọ́ ju ọ̀rọ̀ gbogbogbò fún ìbàjẹ́ lọ.
- source_word: νῦν δὲ
  choice: ṣùgbọ́n ní ti gidi
  rationale: Ó fi ipò gidi tí Pọ́ọ̀lù ń sọ hàn ní ìyàtọ̀ sí ohun àròsọ tó ṣáájú.
- source_word: ἅγιά
  choice: mímọ́
  rationale: Ó pa ìbátan ọ̀rọ̀ mọ́ pẹ̀lú ἡγίασται, ó sì dá ìforígbárí ‘aláìmọ́/mímọ́’ dúró.
theological_decisions:
- issue: Ìtumọ̀ pé a ti sọ ọkọ tàbí aya aláìgbàgbọ́ di mímọ́
  choice: A pa èdè ‘sọ di mímọ́’ mọ́ gẹ́gẹ́ bí ipò ìyàsọ́tọ̀ nínú ìbáṣepọ̀ ìgbéyàwó àti ẹbí, láì sọ pé ẹni náà ti rí ìgbàlà nípasẹ̀ ìgbéyàwó.
  alternative: Kí a túmọ̀ ọ́ pé ọkọ tàbí aya aláìgbàgbọ́ ti rí ìgbàlà, tàbí pé ọ̀rọ̀ náà kàn túmọ̀ sí pé ìbálòpọ̀ wọn bófin mu.
  rationale: Ìjiyàn Pọ́ọ̀lù so ipò ọkọ àti aya pọ̀ mọ́ ipò àwọn ọmọ. Ẹsẹ náà kò sọ ní tààrà pé ìgbàlà ara ẹni wá láìsí ìgbàgbọ́; bẹ́ẹ̀ ni kò dín ‘mímọ́’ kù sí ìbálòpọ̀ tó bófin mu nìkan.
- issue: Ẹni tí ἀδελφῷ ń tọ́ka sí
  choice: A lo ‘arákùnrin náà’ nínú ẹsẹ, a sì ṣàlàyé pé ó ṣeé ṣe kí ó jẹ́ ọkọ onígbàgbọ́.
  alternative: Kí a rọ́pò rẹ̀ ní tààrà pẹ̀lú ‘ọkọ’ tàbí ‘ọkọ onígbàgbọ́.’
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ‘arákùnrin,’ kì í ṣe ọ̀rọ̀ Gíríìkì fún ‘ọkọ.’ Pípa èyí mọ́ jẹ́ kí àwòrán èdè Pọ́ọ̀lù àti àìdánilójú kékeré inú ọ̀rọ̀ náà dúró.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún ní ibi tí ó bá èdè àdánidá mu. A pa àtúnwí ‘sọ di mímọ́’ àti ìyàtọ̀ ‘aláìmọ́/mímọ́’ mọ́ láti fi ìṣọ̀kan ọ̀rọ̀ Gíríìkì hàn.
