id: 1CO.7.13
reference: 1 Corinthians 7:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: yo
  text: Bí obìnrin kan bá ní ọkọ tí kò gba Kristi gbọ́, tí ọkọ náà sì gbà láti máa gbé pẹ̀lú rẹ̀, kí obìnrin náà má ṣe fi ọkọ rẹ̀ sílẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí obìnrin náà má ṣe kọ ọkọ rẹ̀ sílẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “fi sílẹ̀” tàbí “rán lọ”; níbí, ó ń tọ́ka sí píparí ìbáṣepọ̀ ìgbéyàwó.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: obìnrin
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘obìnrin’ tàbí ‘aya’; nínú gbólóhùn yìí, ‘obìnrin kan’ jẹ́ èdè Yorùbá àdánidá, nígbà tí ‘ọkọ’ mú kí ipò ìgbéyàwó hàn kedere.
- source_word: εἴ τις
  choice: bí obìnrin kan bá
  rationale: Èyí fi ipò àìdánimọ̀ gbogbogbò hàn lọ́nà tí ó bá èdè Yorùbá mu.
- source_word: ἄνδρα ἄπιστον
  choice: ọkọ tí kò gba Kristi gbọ́
  rationale: Nínú àyíká yìí ἀνήρ túmọ̀ sí ‘ọkọ,’ ἄπιστος sì ń tọ́ka sí ẹni tí kò ní ìgbàgbọ́ Kristẹni; fífi ‘Kristi’ kún un mú ohun tí a kò gbà gbọ́ yé kedere láìjẹ́ kí ó dà bí àìṣòtítọ́ nínú ìgbéyàwó.
- source_word: οὗτος
  choice: ọkọ náà
  rationale: Ó tọ́ka padà sí ọkọ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; àtúnlò orúkọ náà ṣe kedere, ó sì jẹ́ ti Yorùbá àdánidá.
- source_word: συνευδοκεῖ
  choice: gbà láti
  rationale: Ó sọ ìfọ̀kànsìn àti ìfaramọ́ láti ṣe ohun kan, kì í ṣe ìfaradà lásán.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: máa gbé pẹ̀lú rẹ̀
  rationale: Ó tọ́ka sí títẹ̀síwájú nínú ìgbé ayé ilé papọ̀; ‘máa’ mú ìtẹ̀síwájú náà hàn.
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: kí obìnrin náà má ṣe fi ọkọ rẹ̀ sílẹ̀
  rationale: ‘Fi … sílẹ̀’ pa ìtumọ̀ gbooro ἀφίημι mọ́, ó sì yẹ fún àyíká ìgbéyàwó láìfi ìtumọ̀ òfin ‘kọ̀ sílẹ̀’ lé ọ̀rọ̀ Gíríìkì lórí.
theological_decisions:
- issue: Ìtumọ̀ ἀφιέτω nínú ìtọ́ni nípa ìgbéyàwó ẹni tí ó gbàgbọ́ àti ẹni tí kò gbàgbọ́
  choice: kí obìnrin náà má ṣe fi ọkọ rẹ̀ sílẹ̀
  alternative: kí obìnrin náà má ṣe kọ ọkọ rẹ̀ sílẹ̀
  rationale: ‘Fi ọkọ rẹ̀ sílẹ̀’ sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa ààyè ìtumọ̀ rẹ̀ mọ́—yálà fífi alábàáṣègbé sílẹ̀ tàbí píparí ìbáṣepọ̀ ìgbéyàwó—dípò kí a sọ ọ́ di ìgbésẹ̀ òfin pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tí ó ṣeé yé; a lo àpẹẹrẹ àṣẹ ‘kí … má ṣe’ àti àmi ohùn ní kíkún níbi tí ó bá yẹ.
