reference: 1 Corinthians 7:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: yo
  text: Ṣùgbọ́n bí o tilẹ̀ bá ṣe ìgbéyàwó, ìwọ kò ṣẹ̀; bí wúńdíá náà sì bá ṣe ìgbéyàwó, òun kò ṣẹ̀. Síbẹ̀, àwọn irú ẹni bẹ́ẹ̀ yóò ní ìpọ́njú nínú ara[a], èmi sì fẹ́ dá yín sí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò ní ìnira tàbí wàhálà nínú ìgbésí ayé ti ara.” Ó ṣeé ṣe kí gbólóhùn náà tọ́ka sí ìnira ayé tàbí ti ara tó lè bá ìgbéyàwó lọ, kì í ṣe pàtó sí “ìwà ẹlẹ́ṣẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “èmi ń dá yín sí.” Pọ́ọ̀lù ń sọ ète rẹ̀ láti dá wọn sí kúrò nínú irú ìpọ́njú bẹ́ẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: bí ìwọ tilẹ̀ ṣe ìgbéyàwó
  rationale: Ọ̀rọ̀ yìí jẹ́ gbólóhùn oníṣ条件 ἐάν pẹ̀lú aorist subjunctive; ‘bí … ṣe ìgbéyàwó’ sọ ìṣe ọjọ́ iwájú náà ní Yorùbá àdánidá, ó sì yẹra fún fífi akọ tàbí abo kún ibi tí arọ́pò-orúkọ Gíríìkì kò ti sọ ọ́.
- source_word: ἥμαρτες / ἥμαρτεν
  choice: kò ṣẹ̀
  rationale: Ó sọ pé ṣíṣe ìgbéyàwó kì í ṣe ẹ̀ṣẹ̀. ‘Kò ṣẹ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìdájọ́ ìwà rere inú aorist indicative mu.
- source_word: ἡ παρθένος
  choice: wúńdíá náà
  rationale: ‘Wúńdíá’ pa ìtumọ̀ gangan ti παρθένος mọ́; ‘náà’ tún pa article Gíríìkì mọ́ gẹ́gẹ́ bí ẹni tí àyíká ọ̀rọ̀ ti ń tọ́ka sí.
- source_word: γήμῃ
  choice: ṣe ìgbéyàwó
  rationale: A lo ọ̀rọ̀ kan náà bíi ti gbólóhùn àkọ́kọ́ láti pa ìfarajọ rẹ̀ mọ́, ó sì ṣiṣẹ́ fún obìnrin láìsí ọ̀rọ̀ tí kò bójú mu.
- source_word: θλῖψιν
  choice: ìpọ́njú
  rationale: ‘Ìpọ́njú’ lè túmọ̀ sí wàhálà, ìnira, tàbí ìkálọ́wọ́kò tó le, nítorí náà ó mú agbára θλῖψις jáde láìfi dandan sọ ọ́ di ìṣẹ̀lẹ̀ eschatological.
- source_word: τῇ σαρκὶ
  choice: nínú ara
  rationale: Ìtumọ̀ yìí pa àwòrán ‘ara/flesh’ mọ́, kò sì túmọ̀ rẹ̀ sí ‘ìwà ẹlẹ́ṣẹ̀.’ Àlàyé ìsàlẹ̀ fi hàn pé ó ṣeé ṣe kí ó tọ́ka sí ìnira ayé tàbí ti ara.
- source_word: οἱ τοιοῦτοι
  choice: irú àwọn ẹni bẹ́ẹ̀
  rationale: Ó tọ́ka sí àwọn ẹni irú èyí tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn—àwọn tó ṣe ìgbéyàwó—láìfi àlàyé tó ju ti Gíríìkì lọ kún un.
- source_word: φείδομαι
  choice: èmi sì ń dá yín sí
  rationale: ‘Dá … sí’ túmọ̀ sí láti yọ ẹnì kan kúrò nínú ìnira tàbí láti má fi ẹrù kan kàn án; àmì ‘ń’ pa ìṣe present náà mọ́, ‘èmi’ sì tẹnu mọ́ ẹni tó ń sọ̀rọ̀.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú τῇ σαρκί
  choice: ‘nínú ara,’ tó tọ́ka sí ìgbésí ayé ti ara tàbí ti ayé
  alternative: ‘nínú ìwà ẹlẹ́ṣẹ̀’ tàbí ‘nínú ayé’
  rationale: Níhìn-ín Pọ́ọ̀lù ń kìlọ̀ nípa ìnira tí àwọn tó ṣe ìgbéyàwó yóò ní, kì í ṣe pé ó ń kọ́ni nípa ìwà ẹlẹ́ṣẹ̀. A pa ‘ara’ mọ́ láti yẹra fún yíyan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
- issue: Agbára ìtumọ̀ φείδομαι
  choice: ‘èmi sì ń dá yín sí’
  alternative: ‘èmi sì fẹ́ dá yín sí’
  rationale: Present Gíríìkì lè sọ ìṣe tí Pọ́ọ̀lù ń ṣe tàbí ète olùṣọ́-agùntàn rẹ̀. Àkọ́kọ́ ni a fi sínú ọ̀rọ̀ pàtàkì; àlàyé ìsàlẹ̀ pa ìtumọ̀ ète náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Ṣe ìgbéyàwó’ jẹ́ àṣàyàn tí kò dá lórí akọ tàbí abo, ó sì pa ìfarajọ àwọn gbólóhùn méjèèjì mọ́. ‘Wúńdíá’ jẹ́ ọ̀rọ̀ tó ṣe kedere fún παρθένος, ‘ìpọ́njú nínú ara’ sì pa ìṣòro àti àìdájú inú gbólóhùn Gíríìkì mọ́.
