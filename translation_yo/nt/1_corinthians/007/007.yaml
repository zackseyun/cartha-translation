id: 1CO.7.7
reference: 1 Corinthians 7:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: yo
  text: Ṣùgbọ́n mo fẹ́ kí gbogbo ènìyàn wà bí èmi fúnra mi. Síbẹ̀, olúkúlùkù ní ẹ̀bùn tirẹ̀ láti ọ̀dọ̀ Ọlọ́run, ọ̀kan ní ọ̀nà yìí, ẹlòmíràn sì ní ọ̀nà kejì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντας ἀνθρώπους
  choice: gbogbo ènìyàn
  rationale: Nínú Gíríìkì, ἀνθρώπους lè tọ́ka sí gbogbo ènìyàn lápapọ̀; “gbogbo ènìyàn” jẹ́ èdè Yorùbá àdánidá, kò sì fi ọkùnrin nìkan hàn láìnídìí.
- source_word: θέλω
  choice: mo fẹ́
  rationale: Ó túmọ̀ ìfẹ́ tàbí ohun tí ẹni ń fẹ́ kí ó rí bẹ́ẹ̀, láìsọ ọ́ di àṣẹ.
- source_word: χάρισμα
  choice: ẹ̀bùn
  rationale: “Ẹ̀bùn” mú èrò ohun tí Ọlọ́run fi oore-ọ̀fẹ́ fúnni jáde ní ọ̀nà tí òǹkàwé òde òní lè lóye.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: ẹnì kan ní irú èyí, ẹlòmíràn sì ní irú òmíràn
  rationale: Ó pa ìyàtọ̀ tí ọ̀rọ̀ Gíríìkì mọ́ láìsọ pàtó ohun tí oríṣìíríṣìí ẹ̀bùn náà jẹ́.
theological_decisions:
- issue: Ohun tí “dà bí èmi” túmọ̀ sí
  choice: A fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí orísun ṣe sọ ọ́, láìfi “àpọ́n” tàbí “aláìgbéyàwó” kún un.
  alternative: “kí gbogbo ènìyàn jẹ́ aláìgbéyàwó bí èmi”
  rationale: Àyíká ọ̀rọ̀ lè tọ́ka sí ipò àìgbéyàwó Paulu, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ sọ “bí èmi” nìkan; fífi àlàyé náà sínú ọ̀rọ̀ pàtàkì yóò mú ohun tí ó fara sin di pàtó ju orísun lọ.
- issue: Ìtumọ̀ ẹ̀bùn ọ̀tọ̀ọ̀tọ̀ láti ọ̀dọ̀ Ọlọ́run
  choice: A kò dá ẹ̀bùn náà mọ́ ipò ìgbéyàwó tàbí àìgbéyàwó nìkan.
  alternative: “Ọlọ́run fún ẹnì kọ̀ọ̀kan ní ẹ̀bùn tirẹ̀ láti gbéyàwó tàbí láti wà láìgbéyàwó”
  rationale: Ọ̀rọ̀ Gíríìkì pa àlàyé náà mọ́ ní gbòòrò pé ọ̀kọ̀ọ̀kan ní χάρισμα tirẹ̀; ìtumọ̀ náà yẹ kí ó pa àfojúdi àti ìdààmú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó rọrùn fún òǹkàwé òde òní, ó sì tẹ̀ lé ìṣètò àti àìsọ-pàtó inú Gíríìkì.
