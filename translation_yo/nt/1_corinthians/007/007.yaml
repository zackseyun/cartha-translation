revisions:
- from: Ṣùgbọ́n mo fẹ́ kí gbogbo ènìyàn dà bí èmi fúnra mi. Síbẹ̀, olúkúlùkù ní ẹ̀bùn tirẹ̀ láti ọ̀dọ̀ Ọlọ́run, ẹnì kan ní irú èyí, ẹlòmíràn sì ní irú òmíràn.
  to: Ṣùgbọ́n mo fẹ́ kí gbogbo ènìyàn wà bí èmi fúnra mi. Síbẹ̀, olúkúlùkù ní ẹ̀bùn tirẹ̀ láti ọ̀dọ̀ Ọlọ́run, ọ̀kan ní ọ̀nà yìí, ẹlòmíràn sì ní ọ̀nà kejì.
  rationale: The revision improves idiomatic Standard Yoruba and restores the source text’s concise, parallel contrast, while preserving its ambiguity about both Paul's particular condition and the particular gifts in view.
  reviewer_model: gpt-5.6-terra
