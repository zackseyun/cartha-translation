  rationale: 'The revision removes the added predicate “ni ó ṣe pàtàkì” so that the Yorùbá retains Paul’s concise Greek contrast: circumcision is nothing, uncircumcision is nothing, but keeping God’s commandments. The footnote is made explicitly symmetrical for both repeated expressions.'
