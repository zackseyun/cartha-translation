id: 1CO.7.19
reference: 1 Corinthians 7:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: yo
  text: Ìkọlà kò jẹ́ nǹkan kan[a], àìkọlà kò sì jẹ́ nǹkan kan, ṣùgbọ́n pípa àwọn àṣẹ Ọlọ́run mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìkọlà kò níye”; bákan náà, “àìkọlà kò níye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: Ìkọlà
  rationale: Ọ̀rọ̀-orúkọ Yorùbá yìí jẹ́ ìtumọ̀ àdánidá fún circumcision, ó sì pa ìfarawé pẹ̀lú ἀκροβυστία mọ́.
- source_word: οὐδέν ἐστιν
  choice: kò jẹ́ nǹkan kan
  rationale: Ó tẹ̀ lé gbólóhùn Gíríìkì ní pẹ́kípẹ́kí, ó sì pa bí Pọ́ọ̀lù ṣe sọ ọ́ ní tààràtà mọ́; àlàyé pé ‘kò níye’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἀκροβυστία
  choice: àìkọlà
  rationale: Ó jẹ́ òdìkejì ìkọlà ní ṣókí, ó sì pa ìwọ̀ntúnwọ̀nsì ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: ἀλλά
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín àwọn àmì ipò òde àti ohun tí ó ṣe pàtàkì.
- source_word: τήρησις
  choice: pípa ... mọ́
  rationale: Èyí ni ọ̀nà Yorùbá tó wọ́pọ̀, tó sì bójú mu fún ṣíṣe tàbí títẹ̀lé àṣẹ.
- source_word: ἐντολῶν θεοῦ
  choice: àwọn àṣẹ Ọlọ́run
  rationale: Ó pa ọ̀pọ̀ nǹkan inú ἐντολῶν àti ìbáṣepọ̀ genitive mọ́ ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Bí Pọ́ọ̀lù ṣe ka ìkọlà àti àìkọlà sí
  choice: Ẹsẹ náà sọ pé ìkọlà àti àìkọlà kò níye gẹ́gẹ́ bí àmì ipò ní ìfiwéra pẹ̀lú pípa àwọn àṣẹ Ọlọ́run mọ́.
  alternative: Ẹsẹ náà fòpin sí gbogbo ìtumọ̀ ìwà rere tí ìkọlà lè ní ní gbogbo ọ̀nà.
  rationale: Gíríìkì pe àwọn méjèèjì ní ‘nǹkan kan’ lásán, lẹ́yìn náà ó fi pípa àṣẹ Ọlọ́run mọ́ ṣe ìyàtọ̀ sí wọn. Ìtumọ̀ náà kò gbé ìpinnu ẹ̀kọ́ ìgbàgbọ́ tó kọjá ẹsẹ yìí wọlé.
translation_notes:
  register: Yorùbá ìwòde òní tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo ‘ni ó ṣe pàtàkì’ láti mú gbólóhùn aláìṣe Gíríìkì yé kedere ní Yorùbá láì yí ìyàtọ̀ pàtàkì rẹ̀ padà.
