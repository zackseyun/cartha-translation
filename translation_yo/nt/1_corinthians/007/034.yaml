review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s principal contrasts and the Greek ambiguity concerning ‘the unmarried woman and the virgin.’ However, ‘tí kò tíì ṣe ìgbéyàwó’ means specifically ‘who has not yet married,’ which narrows ἄγαμος beyond ‘unmarried.’ The revised wording avoids that unwarranted restriction. ‘Ó sì pínyà’ suitably retains the brief, context-dependent opening clause and its connection with the preceding male referent.
  naturalness: The revision uses more idiomatic, less negatively loaded expressions for focused concern and for pleasing one’s husband. ‘Ń bojú tó’ communicates μεριμνᾷ here without suggesting necessarily anxious worry.
  terminology: ‘Wúńdíá’ retains the lexical specificity of παρθένος. ‘Mímọ́ ní ti ara àti ní ti ẹ̀mí’ preserves holiness in both stated respects. ‘Àwọn ohun ti Olúwa/àwọn ohun ti ayé’ maintains Paul’s deliberate parallelism.
  issues:
  - severity: medium
    issue: ‘Obìnrin tí kò tíì ṣe ìgbéyàwó’ restricts the meaning of ἄγαμος.
    rationale: The phrase means a woman who has not yet married, whereas ἄγαμος denotes an unmarried woman without asserting that she has never previously been married.
  - severity: low
    issue: ‘Ń ṣe àníyàn nípa’ can imply troubling anxiety.
    rationale: In this context μεριμνᾷ denotes active concern or attention; ‘ń bojú tó’ is a more neutral natural Yoruba expression.
  - severity: low
    issue: ‘Bí yóò ṣe wu ọkọ rẹ̀’ is understandable but less direct in this context.
    rationale: ‘Bí yóò ṣe lè mú inú ọkọ rẹ̀ dùn’ naturally expresses how she may please her husband.
  revised_text: Ó sì pínyà. Obìnrin tí kò ní ọkọ[a], èyíinì ni wúńdíá, ń bojú tó àwọn ohun ti Olúwa, kí ó lè jẹ́ mímọ́ ní ti ara àti ní ti ẹ̀mí. Ṣùgbọ́n obìnrin tí ó ti ṣe ìgbéyàwó ń bojú tó àwọn ohun ti ayé, bí yóò ṣe lè mú inú ọkọ rẹ̀ dùn.
  revised_footnotes:
  - marker: a
    text: Tàbí, “Obìnrin tí kò ní ọkọ àti wúńdíá ń bojú tó àwọn ohun ti Olúwa.” A lè ka èdè Gíríìkì náà bí ẹni pé ó ń tọ́ka sí ẹ̀ka méjì, dípò pé “wúńdíá” ń ṣàlàyé “obìnrin tí kò ní ọkọ.”
    reason: alternative_reading
  revision_rationale: The revised text corrects the unnecessary ‘not yet married’ limitation, retains the appositional main-text reading while preserving the viable coordinated reading in the footnote, and improves idiomatic Yoruba without changing the verse’s meaning or resolving its syntactic ambiguity beyond the English audit trail.
