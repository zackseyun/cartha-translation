- from: Ó sì pínyà. Obìnrin tí kò tíì ṣe ìgbéyàwó[a], èyíinì ni wúńdíá, ń ṣe àníyàn nípa àwọn ohun ti Olúwa, kí ó lè jẹ́ mímọ́ ní ara àti ní ẹ̀mí. Ṣùgbọ́n obìnrin tí ó ti ṣe ìgbéyàwó ń ṣe àníyàn nípa àwọn ohun ti ayé, bí yóò ṣe wu ọkọ rẹ̀.
  to: Ó sì pínyà. Obìnrin tí kò ní ọkọ[a], èyíinì ni wúńdíá, ń bojú tó àwọn ohun ti Olúwa, kí ó lè jẹ́ mímọ́ ní ti ara àti ní ti ẹ̀mí. Ṣùgbọ́n obìnrin tí ó ti ṣe ìgbéyàwó ń bojú tó àwọn ohun ti ayé, bí yóò ṣe lè mú inú ọkọ rẹ̀ dùn.
