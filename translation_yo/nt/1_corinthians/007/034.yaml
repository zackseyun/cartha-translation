id: 1CO.7.34
reference: 1 Corinthians 7:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: yo
  text: Ó sì pínyà. Obìnrin tí kò ní ọkọ[a], èyíinì ni wúńdíá, ń bojú tó àwọn ohun ti Olúwa, kí ó lè jẹ́ mímọ́ ní ti ara àti ní ti ẹ̀mí. Ṣùgbọ́n obìnrin tí ó ti ṣe ìgbéyàwó ń bojú tó àwọn ohun ti ayé, bí yóò ṣe lè mú inú ọkọ rẹ̀ dùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Obìnrin tí kò ní ọkọ àti wúńdíá ń bojú tó àwọn ohun ti Olúwa.” A lè ka èdè Gíríìkì náà bí ẹni pé ó ń tọ́ka sí ẹ̀ka méjì, dípò pé “wúńdíá” ń ṣàlàyé “obìnrin tí kò ní ọkọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: Ó sì pínyà
  rationale: Ó pa ìtumọ̀ perfect passive/resultative mọ́, ó sì tẹ̀ síwájú láti inú èrò ẹsẹ tó ṣáájú láì túmọ̀ rẹ̀ ju bó ṣe yẹ lọ sí ‘ọkàn rẹ̀ dàrú.’
- source_word: γυνὴ ἡ ἄγαμος
  choice: obìnrin tí kò tíì ṣe ìgbéyàwó
  rationale: Èyí jẹ́ Yorùbá àdánidá fún obìnrin tí kò sí nínú ipò ìgbéyàwó, ó sì bá ìyàtọ̀ rẹ̀ sí obìnrin tó ti ṣe ìgbéyàwó mu.
- source_word: παρθένος
  choice: wúńdíá
  rationale: Ó pa ìtumọ̀ pàtó ti παρθένος mọ́ dípò fífi ọ̀rọ̀ gbogbogbò bí ‘ọmọbìnrin’ rọ́pò rẹ̀.
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: obìnrin tí kò tíì ṣe ìgbéyàwó, èyíinì ni wúńdíá
  rationale: A gbé e kalẹ̀ gẹ́gẹ́ bí àlàyé àfikún nítorí ọ̀rọ̀-ìṣe ẹyọ kan μεριμνᾷ, ṣùgbọ́n a fi ìkàwé tó ka àwọn méjèèjì sí ẹ̀ka ọ̀tọ̀ sínú àlàyé ìsàlẹ̀.
- source_word: μεριμνᾷ
  choice: ń ṣe àníyàn nípa
  rationale: Nínú àyíká yìí, gbólóhùn náà túmọ̀ sí ohun tí ọkàn ẹni gbájú mọ́ tàbí tí ó ń bìkítà nípa rẹ̀; ‘ṣe àníyàn nípa’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, láìjẹ́ dandan pé àníyàn ẹ̀ṣẹ̀ ni.
- source_word: τὰ τοῦ κυρίου
  choice: àwọn ohun ti Olúwa
  rationale: Ó pa ìfarawé ìṣètò ọ̀rọ̀ Gíríìkì àti ìyàtọ̀ rẹ̀ sí ‘àwọn ohun ti ayé’ mọ́.
- source_word: ἵνα ᾖ ἁγία
  choice: kí ó lè jẹ́ mímọ́
  rationale: Ó ṣàfihàn ète tàbí àbájáde tí ἵνα pẹ̀lú subjunctive ń tọ́ka sí, ó sì pa èdè ìwà-mímọ́ mọ́.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: ní ara àti ní ẹ̀mí
  rationale: Ó sọ ibi tàbí ọ̀nà méjèèjì tí ìwà-mímọ́ náà kan ní Yorùbá àdánidá, láìfi ẹ̀kọ́ nípa ìpín ẹ̀dá ènìyàn kún un.
- source_word: ἡ δὲ γαμήσασα
  choice: obìnrin tí ó ti ṣe ìgbéyàwó
  rationale: Ó tú participle náà sí ipò obìnrin tó ti gbéyàwó, ó sì bá ìyàtọ̀ tó wà nínú ẹsẹ náà mu.
- source_word: τὰ τοῦ κόσμου
  choice: àwọn ohun ti ayé
  rationale: Ó bá ‘àwọn ohun ti Olúwa’ dọ́gba ní ìṣètò, láìfi ìtumọ̀ burúkú tó lágbára ju àyíká lọ kún un.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: bí yóò ṣe wu ọkọ rẹ̀
  rationale: Nínú àyíká ìgbéyàwó, ἀνήρ túmọ̀ sí ọkọ; ‘wu ọkọ rẹ̀’ jẹ́ Yorùbá àdánidá fún ‘please her husband.’
theological_decisions:
- issue: Bóyá ‘obìnrin tí kò tíì ṣe ìgbéyàwó’ àti ‘wúńdíá’ jẹ́ ẹ̀ka méjì tàbí pé èkejì ń ṣàlàyé àkọ́kọ́
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí àlàyé àfikún: ‘obìnrin tí kò tíì ṣe ìgbéyàwó, èyíinì ni wúńdíá.’'
  alternative: ‘Obìnrin tí kò tíì ṣe ìgbéyàwó àti wúńdíá ń ṣe àníyàn nípa àwọn ohun ti Olúwa.’
  rationale: Ìṣètò Gíríìkì kúrú, ó sì lè gba ìkàwé méjèèjì. Ọ̀rọ̀-ìṣe ẹyọ kan ṣe ìtìlẹ́yìn fún àlàyé àfikún, ṣùgbọ́n a pa ìkàwé ẹ̀ka méjì mọ́ nínú àlàyé ìsàlẹ̀ kí a má bàa pa àìdánilójú ojúlówó rẹ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. A pa ìfarawé ‘àwọn ohun ti Olúwa/àwọn ohun ti ayé’ mọ́, a sì yàgò fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
