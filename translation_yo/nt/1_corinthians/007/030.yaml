id: 1CO.7.30
reference: 1 Corinthians 7:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: yo
  text: àti àwọn tí ń sunkún, bí ẹni pé wọn kò sunkún[a]; àti àwọn tí ń yọ̀, bí ẹni pé wọn kò yọ̀; àti àwọn tí ń rà, bí ẹni pé wọn kò ní í;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ọ̀nà míì, “gẹ́gẹ́ bí ẹni tí kò sunkún … gẹ́gẹ́ bí ẹni tí kò yọ̀ … gẹ́gẹ́ bí ẹni tí kò ní í.” Nínú Gíríìkì, a tún ὡς μή pẹ̀lú participle sọ; ó ń fi ìhùwàsí tàbí ọ̀nà ìgbésí ayé hàn, kì í sì í sẹ́ pé àwọn ìrírí wọ̀nyí ń ṣẹlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: àwọn tí ń sunkún
  rationale: Ọ̀rọ̀ náà jẹ́ participle tí article sọ di orúkọ-ẹgbẹ́, ó sì ń tọ́ka sí àwọn tí wọ́n ń sunkún. “Sunkún” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe tààrà, tí kò sì fi ìtumọ̀ “ṣọ̀fọ̀” kún un.
- source_word: ὡς μὴ κλαίοντες
  choice: bí ẹni pé wọn kò sunkún
  rationale: Ìṣọ̀kan ὡς μή pẹ̀lú participle ń fi ọ̀nà tàbí ìhùwàsí hàn, kì í ṣe pé sísunkún náà kò ṣẹlẹ̀. Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì pa ìfọwọ́ra ọ̀rọ̀ Gíríìkì mọ́.
- source_word: χαίροντες
  choice: àwọn tí ń yọ̀
  rationale: “Yọ̀” ni ọ̀rọ̀ Yorùbá tó ṣe tààrà fún χαίρω, ó sì bá ìforígbárí rẹ̀ pẹ̀lú “sunkún” mu.
- source_word: ὡς μὴ χαίροντες
  choice: bí ẹni pé wọn kò yọ̀
  rationale: A tún lo irú gbólóhùn kan náà láti pa ìṣọ̀kan àti ìlù ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: ἀγοράζοντες
  choice: àwọn tí ń rà
  rationale: “Ń rà” jẹ́ ọ̀nà Yorùbá òde òní tó rọrùn, tó sì ṣe tààrà fún iṣẹ́ rírà ohun.
- source_word: κατέχοντες
  choice: ní ohun tí wọ́n rà
  rationale: κατέχω lè túmọ̀ sí dímú, ní, tàbí ní ohun kan gẹ́gẹ́ bí ohun ìní. Nínú ìyàtọ̀ rẹ̀ sí rírà, gbólóhùn yìí mú ìtumọ̀ jíjẹ́ ẹni tó ní ohun tí a rà jáde ní Yorùbá àdánidá.
- source_word: καὶ
  choice: àti
  rationale: Àtúnlò “àti” ní gbogbo apá ń pa ìtẹ̀síwájú àti ìlù àkójọpọ̀ gbólóhùn Gíríìkì mọ́.
theological_decisions:
- issue: Agbára ìtumọ̀ gbólóhùn ὡς μὴ tí a tún sọ
  choice: A túmọ̀ rẹ̀ gẹ́gẹ́ bí ìpè láti má ṣe fi gbogbo ọkàn rọ̀ mọ́ ìrírí ìmọ̀lára àti ohun ìní ayé, kì í ṣe bí ìkọ̀sílẹ̀ pé àwọn ìrírí náà ń ṣẹlẹ̀.
  alternative: Kí a ka a sí àṣẹ líle pé ẹkún, ayọ̀, àti rírà jẹ́ ohun tí kò tọ́ fún onígbàgbọ́.
  rationale: ὡς pẹ̀lú μή àti participle ń sọ nípa ọ̀nà ìgbésí ayé tàbí ìhùwàsí. Àyíká ẹsẹ̀ 26 àti 31 tún ń tọ́ka sí ìdààmú ìsinsìnyí àti bí ìrísí ayé ṣe ń kọjá lọ; nítorí náà, a pa ẹ̀dọ̀fu ọ̀rọ̀ náà mọ́ láì sọ ọ́ di ìfòfindè ìgbésí ayé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Àtúnlò “àti” àti “bí ẹni pé wọn kò” pa ìlù àti ìbárapọ̀ ọ̀rọ̀ Gíríìkì mọ́.
