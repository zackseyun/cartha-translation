source:
  edition: SBLGNT
  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: yo
  text: 'Nítorí náà, mo rò pé èyí dára nítorí ìpọ́njú ìsinsìnyí: pé ó dára fún ènìyàn láti wà bí ó ti wà[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ohun tó di dandan nísinsìnyí,” tàbí “nítorí wàhálà tó ń bọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún ọkùnrin.” Ọ̀rọ̀ Gíríìkì náà, ἀνθρώπῳ, lè tọ́ka sí ènìyàn ní gbogbogbò; fọ́ọ̀mù akọ gírámà rẹ̀ kò fi dandan sọ ọkùnrin.
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “láti wà bẹ́ẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: mo rò
  rationale: Ó fi hàn pé Pọ́ọ̀lù ń sọ ìdájọ́ tí òun fúnra rẹ̀ gbé kalẹ̀, kì í ṣe àṣẹ tí kò ní àyípadà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ìjíròrò tó ṣáájú gẹ́gẹ́ bí àbájáde rẹ̀.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: èyí dára
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbólóhùn aláìlẹ́ni Gíríìkì náà, ó sì pa ìtumọ̀ καλός mọ́ gẹ́gẹ́ bí ohun tó dára tàbí tó yẹ.
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: nítorí ìpọ́njú tó wà nísinsìnyí
  rationale: ἀνάγκη lè túmọ̀ sí dandan, ìfipámúni, tàbí ìpọ́njú; nínú àyíká ọ̀rọ̀ yìí, “ìpọ́njú” dára jù lọ fún ipò líle tó ń tẹ̀ wọ́n. ἐνεστῶσαν tọ́ka sí ohun tó wà lọ́wọ́lọ́wọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣàfihàn àkóónú ohun tí Pọ́ọ̀lù rò.
- source_word: καλὸν
  choice: ó dára
  rationale: Ó pa àtúnṣe ọ̀rọ̀ καλός mọ́, láì fi ìtumọ̀ míì kún un.
- source_word: ἀνθρώπῳ
  choice: fún ọkùnrin
  rationale: ἄνθρωπος lè jẹ́ ti gbogbo ènìyàn níbí, ṣùgbọ́n yíyan “ọkùnrin” pa ìrísí akọ tó wà nínú orísun mọ́; àlàyé ìsàlẹ̀ fi àṣàyàn gbogbogbò hàn.
- source_word: τὸ οὕτως εἶναι
  choice: láti wà bí ó ti wà
  rationale: Ní tààrà, ó túmọ̀ sí “láti wà bẹ́ẹ̀.” Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì fi ìtọ́kasí sí ipò ẹni nínú àyíká ọ̀rọ̀ hàn láì sọ pé ó gbọdọ̀ máa bá a lọ ju bí Gíríìkì ṣe sọ lọ.
theological_decisions:
- issue: Irú ọ̀rọ̀ tí Pọ́ọ̀lù ń sọ
  choice: Ó ń fúnni ní ìdájọ́ tó bá ipò ìpọ́njú tó wà nígbà náà mu, kì í ṣe pé ó ń fi òfin àìnígbà-díẹ̀ kalẹ̀ lòdì sí ìgbéyàwó.
  alternative: Ó ń sọ pé àìgbéyàwó dára ju ìgbéyàwó lọ ní gbogbo ìgbà.
  rationale: “Mo rò” àti “nítorí ìpọ́njú tó wà nísinsìnyí” fi hàn pé ìmọ̀ràn olùṣọ́-àgùntàn tó dá lórí ipò kan ni; ìtumọ̀ náà kò gbọ́dọ̀ mú ìṣòro ẹ̀kọ́ ìgbàgbọ́ tó wà nínú ọ̀rọ̀ náà kúrò.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ìpọ́njú” jẹ́ ọ̀rọ̀ tí òǹkàwé lasán lè lóye, “láti wà bí ó ti wà” sì jẹ́ àdánidá ju ìtumọ̀ líle “láti wà bẹ́ẹ̀” lọ.
