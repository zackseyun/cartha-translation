source:
  edition: SBLGNT
  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: yo
  text: Ní ti àwọn tó ti ṣègbéyàwó, mo pàṣẹ fún wọn—kì í ṣe èmi, bí kò ṣe Olúwa—pé kí aya má ṣe pínyà[a] kúrò lọ́dọ̀ ọkọ rẹ̀—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kọ ọkọ rẹ̀ sílẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ìyapa nínú ìgbéyàwó, èyí tí ó lè ní ìtumọ̀ ìkọ̀sílẹ̀ nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: Ní ti àwọn tó ti ṣègbéyàwó
  rationale: “Ní ti” fi ìyípadà sí kókó tuntun tí δέ ń tọ́ka sí hàn láì fi ọ̀rọ̀ àsìkò kún un. “Àwọn tó ti ṣègbéyàwó” ṣàfihàn àwọn tí wọ́n wà nínú ipò ìgbéyàwó.
- source_word: παραγγέλλω
  choice: mo pàṣẹ fún wọn
  rationale: Ó pa agbára àṣẹ inú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àsọyé Yorùbá tó ṣe kedere.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: kì í ṣe èmi, bí kò ṣe Olúwa
  rationale: Ó pa ìyàtọ̀ tí Pọ́ọ̀lù tẹnumọ́ mọ́ láì túmọ̀ rẹ̀ sí pé ọ̀rọ̀ rẹ̀ kò ní àṣẹ.
- source_word: γυναῖκα
  choice: aya
  rationale: Nínú àyíká ìgbéyàwó, γυνή túmọ̀ sí aya, kì í ṣe obìnrin lásán.
- source_word: ἀπὸ ἀνδρὸς
  choice: kúrò lọ́dọ̀ ọkọ rẹ̀
  rationale: Àyíká náà fi hàn pé ἀνήρ túmọ̀ sí ọkọ; “rẹ̀” mú ìbátan ìgbéyàwó náà ṣe kedere ní Yorùbá.
- source_word: μὴ χωρισθῆναι
  choice: kí ... má ṣe pínyà
  rationale: “Pínyà” pa ìtumọ̀ ìyapa nínú ìgbéyàwó mọ́, láì dín ọ̀rọ̀ náà kù sí ìkọ̀sílẹ̀ lábẹ́ òfin nìkan.
theological_decisions:
- issue: Ìtumọ̀ “kì í ṣe èmi, bí kò ṣe Olúwa”
  choice: 'A pa ìyàtọ̀ náà mọ́ gẹ́gẹ́ bí ó ṣe wà nínú orísun: àṣẹ yìí ní ìbáṣepọ̀ pẹ̀lú ẹ̀kọ́ Olúwa.'
  alternative: Kí a túmọ̀ rẹ̀ bí ẹni pé Pọ́ọ̀lù ń sọ pé ọ̀rọ̀ tirẹ̀ kò ní àṣẹ.
  rationale: Ìtumọ̀ náà kò yanjú gbogbo ìbéèrè nípa àṣẹ Pọ́ọ̀lù dípò òǹkàwé, ó sì pa ìforígbárí inú gbólóhùn Gíríìkì mọ́.
- issue: Ìwọ̀n ìtumọ̀ χωρισθῆναι nínú ìgbéyàwó
  choice: pínyà
  alternative: kọ ọkọ rẹ̀ sílẹ̀
  rationale: Ọ̀rọ̀ náà lè kan ìyapa tí ó lè dé ìkọ̀sílẹ̀, ṣùgbọ́n “pínyà” kò fi ìtumọ̀ òfin tóóró kan ọ̀rọ̀ Gíríìkì náà.
translation_notes:
  register: Yorùbá ìgbàlódé, tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. “Ní ti” jẹ́ àmì ìyípadà kókó tó bá δέ mu; a kò fi “ní báyìí” tàbí ọ̀rọ̀ àsìkò míì kún orísun. Àmì gígùn ní òpin pa ìtẹ̀sí gbólóhùn sí ẹsẹ tó tẹ̀ lé e mọ́.
