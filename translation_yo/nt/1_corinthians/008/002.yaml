  text: ⸀εἴ τις δοκεῖ ⸀ἐγνωκέναι τι, ⸀οὔπω ⸀ἔγνω καθὼς δεῖ γνῶναι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá rò pé òun mọ̀ ohun kan[a], kò tíì mọ̀ bí ó ti yẹ kí ó mọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ẹnikẹ́ni bá rò pé òun ti mọ̀ ohun kan, kò tíì mọ̀ ní ọ̀nà tí ó yẹ kí ó mọ̀.”
    reason: Àṣàyàn ìtumọ̀ fún fọ́ọ̀mù pípé ἐγνωκέναι àti ọ̀nà tí καθὼς fi ń tọ́ka sí ìlànà tàbí ọ̀nà.
lexical_decisions:
- source_word: εἴ τις
  choice: Bí ẹnikẹ́ni bá
  rationale: Ó ṣe àfihàn gbólóhùn àídájú pẹ̀lú ẹni àìsọ pàtó tí ó dúró fún ẹnikẹ́ni.
- source_word: δοκεῖ
  choice: bá rò pé
  rationale: Nínú àyíká yìí, ó túmọ̀ sí èrò ẹni nípa ara rẹ̀, kì í ṣe bí ohun kan ṣe dàbí lásán.
- source_word: ἐγνωκέναι τι
  choice: òun mọ ohun kan
  rationale: Ọ̀rọ̀ ìṣe pípé náà ń tọ́ka sí ìgbàgbọ́ ẹni pé òun ti ní ìmọ̀ kan; ọ̀nà yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ náà mọ́.
- source_word: οὔπω ἔγνω
  choice: kò tíì mọ̀ ọ́n
  rationale: “Kò tíì” pa ìtumọ̀ pé ìmọ̀ ẹni náà kò tíì pé mọ́, láì sọ pé kò mọ ohunkóhun rárá.
- source_word: καθὼς δεῖ γνῶναι
  choice: bí ó ti yẹ kí ó mọ̀ ọ́n
  rationale: Ó pa ìtumọ̀ ọ̀nà tàbí ìwọ̀n ìmọ̀ tí ó yẹ mọ́, pẹ̀lú agbára ìlànà inú δεῖ.
theological_decisions:
- issue: Ìtọ́kasí ẹni àìsọ pàtó
  choice: ẹnikẹ́ni … òun … ó
  alternative: ẹnikẹ́ni … wọ́n
  rationale: τις jẹ́ ẹyọ ọ̀rọ̀ tí ó ní agbára gbogbogbò; “ẹnikẹ́ni” àti “òun/ó” jẹ́ àdánidá ní Yorùbá, wọn kò sì fi ọkùnrin nìkan hàn.
- issue: Irú àríwísí Pọ́ọ̀lù
  choice: Àìpé nínú ọ̀nà tàbí ìwọ̀n ìmọ̀
  alternative: Kíkọ gbogbo ìmọ̀ ènìyàn sílẹ̀ pátápátá
  rationale: “Kò tíì mọ̀ … bí ó ti yẹ” ń bá ìgbéraga nínú ìmọ̀ wí, ṣùgbọ́n kò sọ pé kò sí ìmọ̀ rárá; èyí pa ìforígbárí inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì. A lo “ẹnikẹ́ni” láti pa agbára gbogbogbò mọ́, “òun” sì mú kí ẹni tí ó rò pé ó mọ̀ jẹ́ kedere. Àmì ohùn ni a fi sí ibi tí ó bá yẹ ní ti àdánidá.
