review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ètò Gíríìkì dáadáa: ìpèníjà àídájú, ìrònú ìgbọ́kànlé ẹni pé òun ní ìmọ̀, àti ìpèníjà pé ìmọ̀ rẹ̀ kò tíì dé ìwọ̀n tó yẹ. Síbẹ̀, àmì ohùn ọrọ̀-ìṣe ''mọ̀'' kò sí ní ìgbà àkọ́kọ́, èyí tí ó yẹ kí a ṣàtúnṣe nínú Yorùbá boṣewa.'
  naturalness: Pípà 'ọ́n' mọ́ lẹ́yìn ìṣẹ̀lẹ̀ méjèèjì ṣeé lóye, ṣùgbọ́n ó wúwo díẹ̀, nígbà tí Gíríìkì kò sọ ohun tí a mọ̀ náà di kedere ní gbólóhùn kejì. 'Kò tíì mọ̀ bí ó ti yẹ kí ó mọ̀' jẹ́ Yorùbá adayébá, ó sì pa ìtumọ̀ àìpé ìmọ̀ náà mọ́.
  terminology: '''Ẹnikẹ́ni,'' ''rò pé,'' ''mọ̀,'' àti ''bí ó ti yẹ'' bá ìforúkọsílẹ̀ Yorùbá òde òní tó ní iyì mu. A tún ṣe àtúnṣe àlàyé ẹsẹ̀ ìsàlẹ̀ kí ''ohun kan'' lè bá τι mu, dípò ''ohunkóhun,'' kí ó má bàa yí agbára ọ̀rọ̀ orísun padà láìnídìí.'
  issues:
