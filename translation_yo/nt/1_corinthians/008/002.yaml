  - severity: low
    issue: Àfidípò 'ọ́n' lẹ́yìn 'mọ̀' ní gbólóhùn kejì kì í ṣe dandan, ó sì lè jẹ́ kí gbolohun náà wuwo.
    rationale: Ọ̀rọ̀ Gíríìkì ní 'kò tíì mọ̀ bí ó ti yẹ kí ó mọ̀,' láì tún sọ ohun tí a mọ̀ náà; Yorùbá lè pa èyí mọ́ ní ìrọ̀rùn.
  - severity: low
