id: 1CO.8.11
reference: 1 Corinthians 8:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: yo
  text: Nítorí ẹni tí ó jẹ́ aláìlera náà ń ṣègbé nípasẹ̀ ìmọ̀ rẹ[a]—arákùnrin náà[b] tí Mèsáyà[c] kú fún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ó ń parun” tàbí “ó ń bàjẹ́ gidigidi.” Ọ̀rọ̀ Gíríìkì náà lè fi ìparun tàbí ìpalára tó le gan-an hàn; àyọkà pàtàkì kò pinnu bóyá Pọ́ọ̀lù ní ìpalára tẹ̀mí nísinsìnyí, ìparun níkẹyìn, tàbí méjèèjì lọ́kàn.
    reason: alternative_reading
  - marker: b
    text: “Arákùnrin” níbí túmọ̀ sí onígbàgbọ́ ẹlẹgbẹ́; nínú ìlò, ó lè kan arákùnrin tàbí arábìnrin nínú ìgbàgbọ́.
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì ní “Kristi”; a túmọ̀ ọ́ sí “Mèsáyà” níbí nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: ń ṣègbé
  rationale: Ọ̀rọ̀ yìí fi ìparun tàbí ìpalára tó le gan-an hàn, ó sì lè tọ́ka sí ìpalára tẹ̀mí nísinsìnyí, ìparun níkẹyìn, tàbí méjèèjì. “Ń ṣègbé” tún fi ìṣe tó ń lọ tàbí àbájáde tó ń farahàn hàn láìfipá yanjú ìbéèrè ẹ̀kọ́ ìgbàgbọ́ náà.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìkìlọ̀ tó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí rẹ̀.
- source_word: ὁ ἀσθενῶν
  choice: ẹni tí ó jẹ́ aláìlera náà
  rationale: Ó pa ìtumọ̀ àbọ̀-orúkọ olùṣe ọ̀rọ̀ Gíríìkì mọ́, ó sì yẹra fún fífi “arákùnrin” wọ ibi yìí kí ọ̀rọ̀ náà tó tún farahàn lẹ́yìn.
- source_word: ἐν τῇ σῇ γνώσει
  choice: nípasẹ̀ ìmọ̀ rẹ
  rationale: Ní ibí yìí ἐν lè fi ọ̀nà tàbí ohun tó fa àbájáde hàn; ìtumọ̀ yìí sọ ní Yorùbá àdánidá pé lílo ìmọ̀ ẹni náà ló ń fa ìpalára.
- source_word: γνῶσις
  choice: ìmọ̀
  rationale: Ó bá ọ̀rọ̀ pàtàkì tí Pọ́ọ̀lù ń lò káàkiri àyíká ẹsẹ náà mu, ó sì pa ẹ̀gàn inú ọ̀rọ̀ náà mọ́ pé “ìmọ̀” lè ṣe ará kan ní ibi.
- source_word: ὁ ἀδελφός
  choice: arákùnrin náà
  rationale: Ó pa akọ ẹyọ kan inú Gíríìkì mọ́. Àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé pé ó túmọ̀ sí onígbàgbọ́ ẹlẹgbẹ́, àti pé ìlò rẹ̀ lè kan arákùnrin tàbí arábìnrin nínú ìgbàgbọ́.
- source_word: δι’ ὃν
  choice: tí ... kú fún
  rationale: Ìṣètò Yorùbá yìí sọ lọ́nà àdánidá pé arákùnrin náà ni ẹni tí ikú Mèsáyà ṣe fún tàbí ní tìtorí rẹ̀.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Ní àyíká yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, nítorí náà “Mèsáyà” mú ipa oyè náà jáde kedere.
- source_word: ἀπέθανεν
  choice: kú
  rationale: Ó jẹ́ ìtumọ̀ tààrà àti àdánidá fún aorist indicative, tó ń tọ́ka sí ìṣẹ̀lẹ̀ ikú tó ti ṣẹlẹ̀.
theological_decisions:
- issue: Bóyá ἀπόλλυται ń sọ ní pàtó pé onígbàgbọ́ tòótọ́ yóò parun títí láé
  choice: A lo “ń ṣègbé,” tó pa líle ìparun náà àti àìdánilójú ìwọ̀n rẹ̀ mọ́.
  alternative: “ń parun” tàbí “a ń pa ... run”
  rationale: Àyíká náà tẹnumọ́ ìpalára tẹ̀mí tó le tí lílo ìmọ̀ láìsí ìfẹ́ ń ṣe sí onígbàgbọ́ aláìlera. “Ń ṣègbé” kò dín líle ọ̀rọ̀ náà kù, bẹ́ẹ̀ ni kò fi tipátipá yanjú bóyá ìparun ìsinsìnyí, ìparun níkẹyìn, tàbí méjèèjì ni Pọ́ọ̀lù ní lọ́kàn.
- issue: Bóyá kí a sọ ἀδελφός di ọ̀rọ̀ tí kò fi akọ tàbí abo hàn nínú àyọkà pàtàkì
  choice: A lo “arákùnrin náà” nínú àyọkà, a sì ṣàlàyé ìlò tó gbòòrò nínú àlàyé ìsàlẹ̀ ojú ìwé.
  alternative: “onígbàgbọ́ ẹlẹgbẹ́” tàbí “arákùnrin tàbí arábìnrin”
  rationale: Gíríìkì jẹ́ akọ ẹyọ kan, torí náà àyọkà pàtàkì pa ìrísí orísun mọ́; síbẹ̀, ní àyíká yìí ọ̀rọ̀ náà ń tọ́ka sí onígbàgbọ́ ẹlẹgbẹ́, ìlò rẹ̀ sì lè kan ọkùnrin tàbí obìnrin.
- issue: Bóyá Χριστός jẹ́ orúkọ tàbí oyè níbí
  choice: A túmọ̀ ọ́ sí “Mèsáyà.”
  alternative: “Kristi”
  rationale: Ní gbólóhùn yìí ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, ó sì tẹnumọ́ ẹni tí ikú ìràpadà rẹ̀ ṣe fún arákùnrin náà.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú èdè òde òní tó ní iyì, tó sì rọrùn fún òǹkàwé gbogbo. Ìṣètò gbólóhùn náà pa ìfarahàn kejì ti ẹni aláìlera gẹ́gẹ́ bí “arákùnrin náà” mọ́, ó sì lo àmì gígùn láti fi apposition náà hàn.
