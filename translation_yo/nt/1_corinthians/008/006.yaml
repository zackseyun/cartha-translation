  source_fidelity: 'Àtúnyẹ̀wò náà ní ìṣòro pàtàkì kan: “a tipasẹ̀ rẹ̀ dá ohun gbogbo” fi ọ̀rọ̀-ìṣe “dá” kún δι’ οὗ τὰ πάντα. Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ìṣẹ̀dá lè bá àyíká mu, ọ̀rọ̀ Gíríìkì jẹ́ àkótán, ó sì yẹ kí ìtumọ̀ Yorùbá pa ìṣípayá náà mọ́. Àtúnṣe náà tún pa ìfarakanra tó wà láàárín “ohun gbogbo” àti “àwa” nínú àwọn gbólóhùn méjèèjì mọ́.'
  naturalness: “Fún àwa” kì í ṣe ọ̀nà ìsọ̀rọ̀ Standard Yoruba tó dára níbí; “fún wa” ni ó jẹ́ ti ẹ̀dá. “Baba náà” lè dà bí ẹni pé a ń tọ́ka sí Baba kan tí a ti mẹ́nu kàn tẹ́lẹ̀, nígbà tí “Baba” nínú ìfarakànra pẹ̀lú “Ọlọ́run kan ṣoṣo” jẹ́ adayeba sí i.
  terminology: “Ọlọ́run,” “Baba,” “Olúwa,” àti “Jesu Mèsáyà” jẹ́ yíyan tó yẹ. “Mèsáyà” pa agbára oyè Χριστός mọ́, àti àlàyé ìsàlẹ̀ ń fún “Jesu Kristi” ní ibi rẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
  issues:
  - severity: medium
    issue: Ọ̀rọ̀ “dá” ni a fi kún gbólóhùn δι’ οὗ τὰ πάντα.
    rationale: Gíríìkì náà sọ ní àkótán, “nípasẹ̀ ẹni tí ohun gbogbo [wà],” láìsọ “dá.” Fífi “dá” kún un ṣàlàyé ọ̀rọ̀ náà ju bí ó ṣe wà lọ, ó sì dín ìṣípayá tó wà nípa ìtumọ̀ “àwa ... nípasẹ̀ rẹ̀” kù.
  - severity: low
    issue: “Fún àwa” kò ṣẹ̀dá bí Standard Yoruba.
    rationale: Lẹ́yìn ọ̀rọ̀-ìbáṣepọ̀ “fún,” aṣojú ẹni àkọ́kọ́ púpọ̀ yẹ kí ó jẹ́ “wa.”
  - severity: low
    issue: Àmì àlàyé ìsàlẹ̀ kò ṣàlàyé yíyan “fún un” fún εἰς αὐτόν.
    rationale: Nítorí “fún un” ń tú εἰς sí ìfẹ́sí/ète, àlàyé ṣókí kan nípa “sí i” gẹ́gẹ́ bí ìtumọ̀ mìíràn ń jẹ́ kí ìpinnu yìí ṣeé yẹ̀wò, ó sì bá ìtàn àyẹ̀wò Gẹ̀ẹ́sì mu.
