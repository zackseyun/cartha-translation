id: 1CO.8.6
reference: 1 Corinthians 8:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: yo
  text: Ṣùgbọ́n fún wa, Ọlọ́run kan ṣoṣo ni ó wà, Baba, ẹni tí ohun gbogbo ti ọ̀dọ̀ rẹ̀ wá, tí àwa sì wà fún un[b]; Olúwa kan ṣoṣo sì ni ó wà, Jesu Mèsáyà[a], ẹni tí ohun gbogbo wà nípasẹ̀ rẹ̀, tí àwa pẹ̀lú sì wà nípasẹ̀ rẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jesu Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός lè jẹ́ oyè, “Mèsáyà,” tàbí kí ó ṣiṣẹ́ bí orúkọ-oyè, “Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “sí i.” Ọ̀rọ̀ náà lè fi ìhùwàsí sí, ibi àfojúsùn, tàbí ète ẹni hàn; “fún un” fi hàn pé Ọlọ́run ni ète wa.
    reason: lexical_alternative
  - marker: c
    text: Àwọn gbólóhùn “ohun gbogbo ti ọ̀dọ̀ rẹ̀ wá” àti “ohun gbogbo wà nípasẹ̀ rẹ̀” pa ìyàtọ̀ mọ́ láàárín Baba gẹ́gẹ́ bí orísun àti Jesu Mèsáyà gẹ́gẹ́ bí ẹni tí ohun gbogbo wà nípasẹ̀ rẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’ ἡμῖν
  choice: ṣùgbọ́n fún àwa
  rationale: Àkójọpọ̀ yìí fi ìyàtọ̀ sí ohun tí ó ṣáájú hàn, ó sì sọ ojú ìwòye ìjẹ́wọ́ àwọn onígbàgbọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: εἷς θεὸς ὁ πατήρ
  choice: Ọlọ́run kan ṣoṣo ni ó wà, Baba náà
  rationale: “Kan ṣoṣo” mú agbára nọ́ńbà àti ìjẹ́wọ́ pé Ọlọ́run kan ni wá; “Baba náà” pa ìdánimọ̀ onípènípè ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐξ οὗ τὰ πάντα
  choice: ẹni tí ohun gbogbo ti ọ̀dọ̀ rẹ̀ wá
  rationale: ἐξ tọ́ka sí orísun; gbólóhùn yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì fi Baba hàn gẹ́gẹ́ bí orísun ohun gbogbo.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: tí àwa sì wà fún un
  rationale: εἰς lè fi ìdarí, ibi àfojúsùn, tàbí ète hàn. “Wà fún un” pa ìtumọ̀ pé Ọlọ́run ni ìparí àti ète wa mọ́ láìfi àlàyé tí kò sí nínú ọ̀rọ̀ kún un.
- source_word: εἷς κύριος
  choice: Olúwa kan ṣoṣo
  rationale: Ó pa ìfarakanra pẹ̀lú “Ọlọ́run kan ṣoṣo” mọ́, ó sì fún κύριος ní ìwọ̀n ìjẹ́wọ́ tó ní nínú ẹsẹ yìí.
- source_word: Ἰησοῦς Χριστός
  choice: Jesu Mèsáyà
  rationale: Nínú àgbékalẹ̀ ìjẹ́wọ́ yìí, Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” mú agbára oyè yẹn hàn, nígbà tí àlàyé ìsàlẹ̀ fi “Kristi” sílẹ̀ gẹ́gẹ́ bí òmíràn tó bófin mu.
- source_word: δι’ οὗ τὰ πάντα
  choice: ẹni tí a tipasẹ̀ rẹ̀ dá ohun gbogbo
  rationale: διά pẹ̀lú genitive tọ́ka sí ọ̀nà tàbí aṣojú. Fífi “dá” hàn mú gbólóhùn Yorùbá ṣe kedere ní àyíká ohun gbogbo tí ó wà, láìsọ Jesu di orísun tí ἐξ fi mọ́ Baba.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: tí àwa pẹ̀lú sì wà nípasẹ̀ rẹ̀
  rationale: 'Ó pa àkótán Gíríìkì àti ìṣípayá rẹ̀ mọ́: ẹsẹ náà kò sọ ní kíkún bóyá ìwàláàyè, ìdásílẹ̀, tàbí ìgbàlà wa ni ó ń tẹnumọ́.'
theological_decisions:
- issue: Ìbáṣepọ̀ “Ọlọ́run kan ṣoṣo” àti “Olúwa kan ṣoṣo” nínú ìjẹ́wọ́ Ọlọ́run kan
  choice: 'A pa àfiwé náà mọ́: Ọlọ́run kan ṣoṣo, Baba náà ... àti Olúwa kan ṣoṣo, Jesu Mèsáyà.'
  alternative: Kí a dín ìwọ̀n “Olúwa” kù, tàbí kí a fi àlàyé ẹ̀kọ́ Mẹ́talọ́kan tó ju ohun tí ẹsẹ náà sọ lọ kún un.
  rationale: Ọ̀rọ̀ náà mú Baba àti Jesu jọ sínú ìjẹ́wọ́ tó lágbára, ṣùgbọ́n ó tún yà wọ́n sọ́tọ̀ nípasẹ̀ “láti ọ̀dọ̀” àti “nípasẹ̀.” Ìtumọ̀ náà kò rọ ọ̀kan lára wọn, bẹ́ẹ̀ ni kò fi àlàyé ẹ̀kọ́ ìgbà tó tẹ̀ lé e sínú ẹsẹ náà.
- issue: Àwọn ọ̀rọ̀ ìbáṣepọ̀ fún Baba àti Ọmọ
  choice: A fi ἐξ hàn gẹ́gẹ́ bí orísun, εἰς gẹ́gẹ́ bí ète/àfojúsùn, àti διά gẹ́gẹ́ bí ọ̀nà tàbí aṣojú.
  alternative: Kí a sọ gbogbo wọn di ọ̀rọ̀ kan náà, tàbí kí a tú εἰς sí “sí ọ̀dọ̀ rẹ̀” nìkan.
  rationale: 'Ìyàtọ̀ àwọn ọ̀rọ̀ wọ̀nyí ṣe pàtàkì sí àgbékalẹ̀ ẹsẹ náà: ohun gbogbo ti ọ̀dọ̀ Baba wá, àwa sì wà fún un; ohun gbogbo àti àwa wà nípasẹ̀ Jesu.'
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè tàbí orúkọ tí ó ti dúró ṣinṣin
  choice: A yan “Mèsáyà” nínú ọ̀rọ̀ àkọ́kọ́, a sì fi “Kristi” sí àlàyé ìsàlẹ̀.
  alternative: Jesu Kristi.
  rationale: Àwọn ìtumọ̀ méjèèjì ṣeé ṣe. Àgbékalẹ̀ “Olúwa kan ṣoṣo, Jesu Χριστός” lè gbé oyè náà jáde, ṣùgbọ́n a kò gbọdọ̀ pa ìlò rẹ̀ gẹ́gẹ́ bí orúkọ-oyè mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó bójú mu, tó ní àmì ohùn níbi tó bá yẹ, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “fún àwa” láti fi dative of reference hàn ní kedere, “kan ṣoṣo” fún agbára ìjẹ́wọ́ εἷς, àti àtúnṣe díẹ̀ sí gbólóhùn διά láti jẹ́ kí Yorùbá má bàjẹ́. Gbogbo àmì àlàyé ìsàlẹ̀ [a], [b] wà nínú ọ̀rọ̀ àkọ́kọ́.
