  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δέ τις ἀγαπᾷ τὸν θεόν, οὗτος ἔγνωσται ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹnikẹ́ni bá nífẹ̀ẹ́ Ọlọ́run, ẹni náà ni Ọlọ́run ti mọ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ọlọ́run dá ẹni náà mọ̀,” tàbí, “Ọlọ́run mọ̀ ẹni náà.” Ọ̀rọ̀-ìṣe Gíríìkì náà wà ní perfect passive; ó lè fi ipò tí ó ń bá a lọ hàn, tí ó jẹ́ àbájáde pé Ọlọ́run ti mọ ẹni náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Ṣùgbọ́n bí ... bá
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ pẹ̀lẹ́ sí ọ̀rọ̀ tó ṣáájú hàn, ìhun “bí ... bá” sì pa ìtumọ̀ àídájú mọ́ ní Yorùbá àdánidá.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ó jẹ́ ọ̀rọ̀ àìsọ pàtó tó kan gbogbo ènìyàn, láìfi akọ tàbí abo kún un.
- source_word: ἀγαπᾷ
  choice: nífẹ̀ẹ́
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣe kedere jù lọ láti sọ ìṣe fífẹ́.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: “Ọlọ́run” ni orúkọ Yorùbá àdánidá fún God nínú àyíká yìí.
- source_word: οὗτος
  choice: ẹni náà
  rationale: Ó pa ìtẹnumọ́ ọ̀rọ̀ atọ́ka Gíríìkì mọ́, ó sì tọ́ka sí ẹni tí a ṣẹ̀ṣẹ̀ ṣàpèjúwe.
- source_word: ἔγνωσται
  choice: ni ... mọ̀
  rationale: Ìhun yìí sọ pé Ọlọ́run mọ ẹni náà, ó sì lè gbé ìtumọ̀ ìbáṣepọ̀ tàbí ìdánimọ̀ láìdín ọ̀rọ̀ Gíríìkì kù sí ìmọ̀ lásán. Àlàyé ìsàlẹ̀ ojú-ewé tọ́ka sí ipò tó ń bá a lọ nínú perfect passive.
- source_word: ὑπ’ αὐτοῦ
  choice: Ọlọ́run
  rationale: A tún orúkọ antecedent náà sọ nítorí pé “òun” tàbí “rẹ̀” lè ṣòro láti túmọ̀ ní kedere nínú Yorùbá; èyí kò yí ẹni tí ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì ń tọ́ka sí padà.
theological_decisions:
- issue: Ìtumọ̀ pé Ọlọ́run “mọ” ẹni náà
  choice: Ọlọ́run mọ̀ ọ́, ní ọ̀nà tí a kò dín kù sí ìmọ̀ lásán tàbí ṣàlàyé gẹ́gẹ́ bí ìgbàlà ní pàtó
  alternative: Ọlọ́run tẹ́wọ́ gbà á; Ọlọ́run dá a mọ̀; Ọlọ́run ti mọ̀ ọ́ ní ọ̀nà ìgbàlà
  rationale: γινώσκω nígbà tí Ọlọ́run jẹ́ olùṣe lè ní ìtumọ̀ ìbáṣepọ̀, ìdánimọ̀, tàbí ìtẹ́wọ́gbà. Ọ̀rọ̀ Gíríìkì kò fi agbára mú wa yan ọ̀kan ṣoṣo, nítorí náà a pa ìfẹ̀ tó gbòòrò àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó bójú mu fún Ìwé Mímọ́ ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹni náà” láti pa ìtẹnumọ́ οὗτος mọ́, a sì tún “Ọlọ́run” sọ dípò arọ́pò-orúkọ tí ó lè mú àìdánilójú wá.
