id: 1CO.8.5
reference: 1 Corinthians 8:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: yo
  text: Nítorí, bí àwọn tí a ń pè ní ọlọ́run bá tilẹ̀ wà, yálà ní ọ̀run tàbí lórí ilẹ̀ ayé—gẹ́gẹ́ bí ọ̀pọ̀ ọlọ́run àti ọ̀pọ̀ olúwa[a] ti wà ní tòótọ́—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Olúwa” níbí túmọ̀ sí ọ̀pọ̀ oyè κύριος, ọ̀rọ̀ kan náà tí a sábà máa ń túmọ̀ sí “Olúwa.” Ó ń tọ́ka sí ọ̀pọ̀ ẹ̀dá tàbí agbára tí àwọn ènìyàn ń pè ní oyè yìí, kì í ṣe Olúwa kan ṣoṣo tí ẹsẹ 6 sọ.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí
  rationale: Ó so gbólóhùn yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àlàyé; ìtumọ̀ ìtẹnumọ́ καί tún hàn nínú ‘bá tilẹ̀.’
- source_word: εἴπερ
  choice: bí ... bá tilẹ̀
  rationale: Ó fi ààyè sílẹ̀ fún ọ̀rọ̀ àdéhùn tí Pọ́ọ̀lù gbà fún ìjíròrò, láì sọ ọ́ di ìjẹ́wọ́ pé wọ́n jẹ́ ọlọ́run tòótọ́.
- source_word: λεγόμενοι θεοὶ
  choice: àwọn tí a ń pè ní ọlọ́run
  rationale: Èyí pa ìtumọ̀ participle náà mọ́ pé orúkọ tàbí àpèjúwe ni àwọn ènìyàn fi ń pè wọ́n; ó tún jẹ́ èdè Yorùbá àdánidá ju ìtumọ̀ líle ti ‘àwọn ọlọ́run tí a ń pè bẹ́ẹ̀’ lọ.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: yálà ní ọ̀run tàbí lórí ilẹ̀ ayé
  rationale: Ó pa ìfiwéra àwọn agbègbè méjèèjì àti bí gbólóhùn náà ṣe gbooro tó mọ́.
- source_word: ὥσπερ
  choice: gẹ́gẹ́ bí ... ti wà ní tòótọ́
  rationale: Ó mú ìjẹ́rìí ìmúdájú inú gbólóhùn náà jáde láì yí i padà sí ìdí tàbí ìdánilójú pé àwọn wọ̀nyí jẹ́ Ọlọ́run ní ìtumọ̀ gidi.
- source_word: θεοὶ πολλοὶ καὶ κύριοι πολλοί
  choice: “ọ̀pọ̀ ọlọ́run” àti “ọ̀pọ̀ olúwa”
  rationale: Àwọn àmì àyọlò fi hàn pé àwọn orúkọ tí a mọ̀ sí wọn ni Pọ́ọ̀lù ń tọ́ka sí, wọ́n sì pa ìbáramu θεός/κύριος mọ́ fún ìyàtọ̀ ẹsẹ 6.
theological_decisions:
- issue: Ìjìnnà ọ̀rọ̀ Pọ́ọ̀lù sí àwọn òrìṣà tàbí ohun tí a kà sí ọlọ́run
  choice: àwọn tí a ń pè ní ọlọ́run
  alternative: àwọn ọlọ́run tí a ń pè bẹ́ẹ̀ / àwọn tí a pe ní ọlọ́run lásán
  rationale: Gíríìkì lè túmọ̀ sí ‘tí a ń pè,’ nígbà tí àyíká ọ̀rọ̀ fi ìjìnnà hàn. Ìtumọ̀ yìí pa àìdánilójú gírámà mọ́; àwọn àmì àyọlò ní apá kejì ń ràn án lọ́wọ́ láì fi ọ̀rọ̀ ẹ̀gàn kun orísun.
- issue: Ọ̀pọ̀ κύριοι ní ìyàtọ̀ sí Olúwa kan ṣoṣo ní ẹsẹ 6
  choice: ọ̀pọ̀ olúwa
  alternative: ọ̀pọ̀ ọ̀gá
  rationale: ‘Olúwa’ pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ pẹ̀lú κύριος ní ẹsẹ 6, ṣùgbọ́n lẹ́tà kékeré àti àyíká ọ̀rọ̀ yà àwọn tí ènìyàn ń fún ní oyè yìí sọ́tọ̀ kúrò lọ́dọ̀ Olúwa kan ṣoṣo.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. ‘Bí ... bá tilẹ̀’ mú concessive εἴπερ jáde lọ́nà àdánidá. A fi àmì àyọlò sí ‘ọ̀pọ̀ ọlọ́run’ àti ‘ọ̀pọ̀ olúwa’ láti fi designation hàn, láì mú àríyànjiyàn inú ẹsẹ náà kúrò.
