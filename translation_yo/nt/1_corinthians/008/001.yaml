id: 1CO.8.1
reference: 1 Corinthians 8:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: yo
  text: 'Ní ti oúnjẹ tí a fi rú ẹbọ sí àwọn òrìṣà: a mọ̀ pé gbogbo wa ní ìmọ̀[a]. Ìmọ̀ ń mú ènìyàn wú, ṣùgbọ́n ìfẹ́ ń gbé ènìyàn ró.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹran tí a fi rú ẹbọ sí àwọn òrìṣà,” tàbí, “àwọn ohun tí a fi rú ẹbọ sí àwọn òrìṣà.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí Pọ́ọ̀lù ń tún àsọyé kan tí àwọn ará Kọ́ríńtì máa ń sọ ṣe nínú ọ̀rọ̀ náà, “gbogbo wa ní ìmọ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ní ti
  rationale: Ó jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ láti yí ọ̀rọ̀ sí kókó tuntun, láìfi ọ̀rọ̀ àsìkò kan kún un.
- source_word: τῶν εἰδωλοθύτων
  choice: oúnjẹ tí a fi rú ẹbọ sí àwọn òrìṣà
  rationale: Ó ṣàlàyé ohun tí a fi fún òrìṣà nínú ìjọsìn, pàápàá oúnjẹ, láìdín ìtumọ̀ náà kù sí ẹran nìkan.
- source_word: οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν
  choice: a mọ̀ pé gbogbo wa ní ìmọ̀
  rationale: Ó pa àsọyé Gíríìkì mọ́ bí ó ti rí, pẹ̀lú ìṣòro ìtumọ̀ bóyá Pọ́ọ̀lù ń sọ ọ́ tàbí ń tún àsọyé àwọn ará Kọ́ríńtì sọ.
- source_word: ἡ γνῶσις
  choice: Ìmọ̀
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ‘ìmọ̀’ tó wà nínú gbólóhùn tó ṣáájú.
- source_word: φυσιοῖ
  choice: ń mú ènìyàn wú fùkẹ̀
  rationale: Ó pa àwòrán ohun tí afẹ́fẹ́ ń fẹ́ sí wú àti ìgbéraga tó wà nínú ọ̀rọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: ἡ δὲ ἀγάπη
  choice: ṣùgbọ́n ìfẹ́
  rationale: ‘Ìfẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἀγάπη, ‘ṣùgbọ́n’ sì pa ìyàtọ̀ rẹ̀ sí ìmọ̀ mọ́.
- source_word: οἰκοδομεῖ
  choice: ń gbé ènìyàn ró
  rationale: Ọ̀rọ̀ yìí jẹ́ ti ìkọ́lé ní ìpilẹ̀ṣẹ̀; ‘ń gbé ènìyàn ró’ pa èrò fífún ẹlòmíràn lókun mọ́ ní èdè tó ṣeé lóye.
theological_decisions:
- issue: Bóyá πάντες jẹ́ àsọyé gbogbo ènìyàn láìsí ààlà tàbí àsọyé àwọn ará Kọ́ríńtì tí Pọ́ọ̀lù ń tọ́ka sí
  choice: a mọ̀ pé gbogbo wa ní ìmọ̀
  alternative: gbogbo ènìyàn ní ìmọ̀; gbogbo wa ní ìmọ̀ yìí
  rationale: Gíríìkì kò fi àmì ọ̀rọ̀-ẹnu tàbí àmì jíjìnnà hàn gbangba; nítorí náà, ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú àti ìforígbárí ẹ̀kọ́ náà mọ́, àlàyé ìsàlẹ̀ sì sọ pé ó lè jẹ́ àsọyé àwọn ará Kọ́ríńtì.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá. ‘Wú fùkẹ̀’ pa àwòrán φυσιοῖ mọ́, ‘gbé ènìyàn ró’ sì sọ àwòrán ìkọ́lé di Yorùbá tó ṣe kedere láìsọ ìtumọ̀ rẹ̀ di ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
