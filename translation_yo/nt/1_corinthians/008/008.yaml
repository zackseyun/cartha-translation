id: 1CO.8.8
reference: 1 Corinthians 8:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: yo
  text: Ṣùgbọ́n oúnjẹ kì yóò mú wa dúró níwájú Ọlọ́run[a]; nítorí bí a bá jẹ, a kò ní ohun púpọ̀ sí i[b], bí a kò bá sì jẹ, a kò ṣe aláìní.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oúnjẹ kì yóò mú wa sún mọ́ Ọlọ́run,” tàbí, “oúnjẹ kì yóò fi wá hàn níwájú Ọlọ́run.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “bí a bá jẹ, ipò wa kò ní dára sí i; bí a kò bá sì jẹ, ipò wa kò ní burú sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: oúnjẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí oúnjẹ lápapọ̀, kì í ṣe ẹran tàbí irú oúnjẹ kan pàtó.
- source_word: παραστήσει
  choice: kì yóò mú wa dúró níwájú
  rationale: Èyí pa àwòrán ìpilẹ̀ṣẹ̀ ti mímú ẹnì kan wá síwájú ẹni mìíràn mọ́, láì pinnu bóyá ìtumọ̀ náà jẹ́ ìtẹ́wọ́gbà, ìsúnmọ́, tàbí ipò rere níwájú Ọlọ́run.
- source_word: τῷ θεῷ
  choice: níwájú Ọlọ́run
  rationale: Dátífù náà bá ọ̀rọ̀-ìṣe παραστήσει mu ní èdè Yorùbá nípasẹ̀ gbólóhùn ‘níwájú Ọlọ́run,’ ó sì jẹ́ kí ìtumọ̀ ìbáṣepọ̀ àti ipò ẹni ṣí sílẹ̀.
- source_word: περισσεύομεν
  choice: a kò ní ohun púpọ̀ sí i
  rationale: Ìtumọ̀ rẹ̀ níbí ni pé jíjẹ kò fún wa ní àfikún tàbí àǹfààní; yíyan ọ̀rọ̀ yìí tún pa ìtakora rẹ̀ pẹ̀lú ‘ṣe aláìní’ mọ́.
- source_word: ὑστερούμεθα
  choice: a kò ṣe aláìní
  rationale: Ó sọ pé àìjẹ kò sọ wá di aláìní tàbí ẹni tí ohun kan dín kù fún, láì fi ìdájọ́ ìwà rere tàbí búburú kún ọ̀rọ̀ náà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ onírẹ̀lẹ̀ hàn sí ohun tí a ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí fún gbólóhùn àkọ́kọ́.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ náà ń sọ nípa ìtẹ́wọ́gbà ẹ̀sìn níwájú Ọlọ́run tàbí àǹfààní nípa tẹ̀mí lápapọ̀
  choice: A pa ọ̀rọ̀ náà mọ́ pé oúnjẹ fúnra rẹ̀ kò mú wa dúró níwájú Ọlọ́run, jíjẹ tàbí àìjẹ kò sì fi ohun kan kún wa tàbí mú ohun kan dín kù fún wa.
  alternative: A lè túmọ̀ ọ́ pé oúnjẹ kò mú wa sún mọ́ Ọlọ́run, tàbí pé kò mú kí Ọlọ́run tẹ́wọ́ gbà wá.
  rationale: ‘Mú wa dúró níwájú Ọlọ́run’ sún mọ́ àwòrán παραστήσει, ó sì yẹra fún pípa ìtumọ̀ náà mọ́ sí ẹ̀kọ́ nípa ìgbàlà, ìsúnmọ́ tẹ̀mí, tàbí ìtẹ́wọ́gbà nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò. A pa ìṣọ̀kan ‘bí a bá jẹ … bí a kò bá sì jẹ’ mọ́, a sì lo ‘ohun púpọ̀ sí i/ṣe aláìní’ láti fi ìtakora περισσεύω àti ὑστερέω hàn láì mú ìtumọ̀ ẹ̀kọ́ ìsìn kan wọlé.
