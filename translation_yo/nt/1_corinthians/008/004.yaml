id: 1CO.8.4
reference: 1 Corinthians 8:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: yo
  text: Nítorí náà, ní ti jíjẹ oúnjẹ tí a fi rú ẹbọ sí àwọn òrìṣà, a mọ̀ pé òrìṣà kì í ṣe nǹkan kan ní ayé[a], àti pé kò sí Ọlọ́run mìíràn bí kò ṣe Ọ̀kan ṣoṣo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òrìṣà kò wà ní tòótọ́ ní ayé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kò sí ọlọ́run bí kò ṣe ọ̀kan ṣoṣo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: jíjẹ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìṣe jíjẹ, kì í ṣe oúnjẹ fúnra rẹ̀; “ní ti jíjẹ” sì bá ìhun περὶ pẹ̀lú ọ̀rọ̀-orúkọ náà mu lọ́nà àdánidá.
- source_word: εἰδωλοθύτων
  choice: oúnjẹ tí a fi rú ẹbọ sí àwọn òrìṣà
  rationale: Ó túmọ̀ sí oúnjẹ tí ó ní í ṣe pẹ̀lú ẹbọ sí òrìṣà, láì dín ìtumọ̀ rẹ̀ kù sí ẹran nìkan.
- source_word: οἴδαμεν
  choice: àwa mọ̀
  rationale: Ó pa ìtumọ̀ ìmọ̀ tí Pọ́ọ̀lù àti àwọn ará Kọ́ríńtì sọ pé wọ́n jọ ní mọ́, ìtẹnumọ́ “àwa” sì bá ẹni-kìíní ọ̀pọ̀ mu.
- source_word: οὐδὲν εἴδωλον
  choice: òrìṣà kò jẹ́ nǹkan kan
  rationale: Ìtumọ̀ yìí pa kíkún àti agbára gbólóhùn Gíríìkì mọ́, ó sì lè tọ́ka sí àìní ìwàláàyè gidi tàbí òfo rẹ̀ láì pinnu àìdánilójú náà pátápátá.
- source_word: ἐν κόσμῳ
  choice: ní ayé
  rationale: “Ayé” jẹ́ ọ̀nà Yorùbá àdánidá fún κόσμος níbí, ìyẹn agbègbè ohun tí ó wà ní ìṣẹ̀dá.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: kò sí ọlọ́run kan bí kò ṣe Ọ̀kan ṣoṣo
  rationale: Ó pa ẹ̀sùn pé ọlọ́run kan ṣoṣo ni ó wà mọ́, ṣùgbọ́n kò lo àkọlé lẹ́tà láti fi tipátipá pinnu bóyá θεός ní ìpín àkọ́kọ́ jẹ́ orúkọ oyè tàbí ẹ̀ka; “Ọ̀kan ṣoṣo” ń tẹnumọ́ εἷς.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìbáṣepọ̀ ìyọrísí pẹ̀lú ọ̀rọ̀ tó ṣáájú hàn kedere.
theological_decisions:
- issue: Ohun tí Pọ́ọ̀lù sọ nípa òfo òrìṣà àti Ọlọ́run kan ṣoṣo
  choice: Pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ìjẹ́wọ́ pé ọlọ́run kan ṣoṣo ni ó wà, kí a sì fi “òrìṣà kò jẹ́ nǹkan kan” sílẹ̀ ní kíkún rẹ̀.
  alternative: Ṣàlàyé rẹ̀ ní tààrà pé “òrìṣà kò ní ìwàláàyè gidi ní ayé,” tàbí kọ “Ọlọ́run” gẹ́gẹ́ bí orúkọ oyè.
  rationale: Gíríìkì fi òfo tàbí àìní ìwàláàyè gidi òrìṣà àti ìkanṣoṣo Ọlọ́run jọ; ìtumọ̀ yìí kò rọ ọ̀rọ̀ náà, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ìsìn tó kọjá ohun tí ẹsẹ̀ náà sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo “rú ẹbọ sí” fún ìṣe fífi oúnjẹ rúbọ, “òrìṣà” fún εἴδωλον nínú àyíká ìjọsìn, àti àmi ohùn ní kíkún níbi tí ó ti yẹ. Àwọn àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ pàtàkì.
