  verdict: revise
  source_fidelity: Ìtumọ̀ náà tẹ̀lé ìtumọ̀ Gíríìkì dáadáa nípa jíjẹ ohun tí a rú sí òrìṣà, òfo òrìṣà, àti ìkanṣoṣo Ọlọ́run. Síbẹ̀, “kò jẹ́ nǹkan kan” kì í ṣe ọ̀nà Yorùbá tó rọrùn jù lọ fún gbolohun predicate náà, àti àlàyé [a] yí ‘real existence’ padà sí ‘ìwàláàyè’ (ìyè), èyí tí kò péye.
  naturalness: Akọ́lé àti ìforúkọsílẹ̀ rẹ̀ dára, àmi ohùn sì péye lápapọ̀. “Ní ti jíjẹ oúnjẹ tí a fi rú ẹbọ sí àwọn òrìṣà” jẹ́ èdè boṣewa tó ṣe kedere. A tún ọ̀rọ̀ predicate náà ṣe sí “kì í ṣe nǹkan kan” fún ìlò Yorùbá tó dára síi.
