  - severity: low
    issue: “Òrìṣà kò jẹ́ nǹkan kan” kò rọrùn bí “Òrìṣà kì í ṣe nǹkan kan.”
    rationale: Ìyípadà náà jẹ́ gbolohun predicate Yorùbá tó ṣeé lóye síi, ó sì pa agbára οὐδὲν εἴδωλον mọ́.
