id: 1CO.8.10
reference: 1 Corinthians 8:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: yo
  text: Nítorí bí ẹnì kan bá rí ọ, ẹni tí ó ní ìmọ̀, tí ó jókòó níbi àsè nínú ilé òrìṣà, ṣé a kò ní gbé ẹ̀rí-ọkàn ẹni náà ró, níwọ̀n bí ẹni náà ti jẹ́ aláìlera, láti jẹ oúnjẹ tí a fi rúbọ sí òrìṣà?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mú un ní ìgboyà.” Ní Gíríìkì, ọ̀rọ̀ náà túmọ̀ ní tààrà pé “gbé ró”; ó jẹ́ ọ̀rọ̀ tí Pọ́ọ̀lù sábà máa ń lò fún fífi ẹnì kan múlẹ̀, ó sì ṣeé ṣe kí ó lò ó pẹ̀lú ìfọ̀rọ̀yà ẹ̀gàn níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìkìlọ̀ tó ṣáájú, ó sì bẹ̀rẹ̀ àlàyé ìdí rẹ̀.
- source_word: τις
  choice: ẹnì kan
  rationale: Ó pa ìtumọ̀ ẹni àìlórúkọ nínú àpẹẹrẹ àròsọ mọ́ ní Yorùbá àdánidá.
- source_word: ἴδῃ
  choice: bá rí
  rationale: Àpapọ̀ ‘bí … bá’ fi ipò àròsọ tí ó ṣeé ṣẹlẹ̀ hàn bí ἐὰν pẹ̀lú subjunctive ṣe rí.
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: ìwọ, ẹni tí ó ní ìmọ̀
  rationale: Ó dá ìwọ náà mọ̀ gẹ́gẹ́ bí ẹni tí ìmọ̀ ń ṣe àpèjúwe rẹ̀, ó sì pa ìtẹnumọ́ Gíríìkì mọ́.
- source_word: γνῶσιν
  choice: ìmọ̀
  rationale: Ó pa ọ̀rọ̀ pàtàkì tí Pọ́ọ̀lù ń lò káàkiri orí kẹjọ mọ́.
- source_word: ἐν εἰδωλείῳ
  choice: nínú ilé òrìṣà
  rationale: ‘Ilé òrìṣà’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ibi ìjọsìn tí a yà sí mímọ́ fún òrìṣà.
- source_word: κατακείμενον
  choice: tí o jókòó láti jẹun
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì ń tọ́ka sí títẹ̀ sílẹ̀ níbi àsè, ìtumọ̀ iṣẹ́ rẹ̀ ni wíwà níbi oúnjẹ; gbolohun yìí mú un yé olùkà Yorùbá òde òní láìfi àwòrán tí kò bójú mu kún un.
- source_word: οὐχὶ
  choice: ṣé a kò ní
  rationale: Ó pa ìbéèrè àsọyé tí ó ń retí ìdáhùn rere mọ́.
- source_word: ἡ συνείδησις αὐτοῦ
  choice: ẹ̀rí-ọkàn rẹ̀
  rationale: ‘Ẹ̀rí-ọkàn’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún agbára inú ẹni láti mọ ohun tó tọ́ tàbí tí kò tọ́.
- source_word: ἀσθενοῦς ὄντος
  choice: tí ó jẹ́ aláìlera
  rationale: Ó pa àpèjúwe ipò àìlera ẹni tó ń wò náà mọ́ láìsọ ìdí tàbí àbájáde sí i.
- source_word: οἰκοδομηθήσεται
  choice: a kò ní gbé … ró
  rationale: Ó pa àwòrán fífi ilé ró àti ọ̀rọ̀ Pọ́ọ̀lù nípa fífi ènìyàn múlẹ̀ mọ́, pẹ̀lú ìfọ̀rọ̀yà ẹ̀gàn tó wà nínú lílo rẹ̀ fún ìṣe tó lè ṣèpalára.
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: láti jẹ oúnjẹ tí a fi rúbọ sí òrìṣà
  rationale: Ó fi ìtẹ̀sí tàbí àbájáde tí èdè Gíríìkì sọ hàn ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ οἰκοδομηθήσεται níbi tí àfarawé náà ti lè ṣèpalára
  choice: gbé … ró
  alternative: mú … ní ìgboyà
  rationale: Ọ̀rọ̀ Gíríìkì ni ọ̀rọ̀ tí Pọ́ọ̀lù sábà máa ń lò fún fífi ẹnì kan múlẹ̀, ó sì ṣeé ṣe kí ó ní ìfọ̀rọ̀yà ẹ̀gàn níbí. Títúmọ̀ rẹ̀ sí ‘gbé ró’ pa ìdíwọ̀n àti ìforígbárí náà mọ́; àlàyé ìtumọ̀ iṣẹ́ rẹ̀ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ilé òrìṣà’ dípò ọ̀rọ̀ àyálò ‘tẹ́ńpìlì,’ a sì lo ìbéèrè ‘ṣé a kò ní …?’ láti pa agbára ìbéèrè àsọyé Gíríìkì mọ́.
