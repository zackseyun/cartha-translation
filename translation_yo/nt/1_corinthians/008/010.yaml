- from: Nítorí bí ẹnì kan bá rí ìwọ, ẹni tí ó ní ìmọ̀, tí o jókòó láti jẹun nínú ilé òrìṣà, ṣé a kò ní gbé ẹ̀rí-ọkàn rẹ̀ tí ó jẹ́ aláìlera ró[a] láti jẹ oúnjẹ tí a fi rúbọ sí òrìṣà?
  to: Nítorí bí ẹnì kan bá rí ọ, ẹni tí ó ní ìmọ̀, tí ó jókòó níbi àsè nínú ilé òrìṣà, ṣé a kò ní gbé ẹ̀rí-ọkàn ẹni náà ró, níwọ̀n bí ẹni náà ti jẹ́ aláìlera, láti jẹ oúnjẹ tí a fi rúbọ sí òrìṣà?[a]
  rationale: A tún ‘rí ìwọ’ ṣe sí ‘rí ọ,’ a ṣe àtúnṣe sí àpèjúwe jíjẹun níbi àsè, a sì sọ ní kedere pé ẹni tí ó rí i ni aláìlera. Àwọn àtúnṣe wọ̀nyí pa ìtumọ̀ Gíríìkì, ìbéèrè àsọyé rẹ̀, àti ìfọ̀rọ̀yà tí ó ṣeé ṣe nínú ‘gbé ró’ mọ́.
