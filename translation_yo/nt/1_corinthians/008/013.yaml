  terminology: Àwọn ọ̀rọ̀ pàtàkì náà wà ní ìbámu pẹ̀lú ìtumọ̀ wọn nínú ẹsẹ̀ yìí, pàápàá ìyàtọ̀ “oúnjẹ” sí “ẹran,” àti ìtumọ̀ àwòrán “kọsẹ̀.” Kò sí ìṣòro nípa orúkọ tàbí ọ̀rọ̀ ẹ̀kọ́ ìsìn, kò sì sí àmì ìsàlẹ̀ ojú-ewé tí a nílò.
