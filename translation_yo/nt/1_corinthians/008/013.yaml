id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: yo
  text: Nítorí náà, bí oúnjẹ bá ń mú arákùnrin mi kọsẹ̀, èmi kì yóò jẹ ẹran láéláé, kí èmi má bàa mú arákùnrin mi kọsẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: oúnjẹ
  rationale: Ọ̀rọ̀ náà túmọ̀ sí oúnjẹ ní gbogbogbòò, ní ìbámu pẹ̀lú ìyàtọ̀ rẹ̀ sí κρέα ní apá kejì.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: ń mú ... kọsẹ̀ / mú ... kọsẹ̀
  rationale: Àwòrán ‘kọsẹ̀’ pa ìtumọ̀ ìṣubú nípa ẹ̀rí-ọkàn tàbí ìgbàgbọ́ mọ́, láì fi ìtumọ̀ ẹ̀kọ́ kan pàtó kún un.
- source_word: κρέα
  choice: ẹran
  rationale: Èyí ni ìtumọ̀ pàtó ti ọ̀rọ̀ náà nínú àyíká yìí.
- source_word: οὐ μὴ φάγω ... εἰς τὸν αἰῶνα
  choice: èmi kì yóò jẹ ... láéláé
  rationale: Ìkọ̀ méjì οὐ μή jẹ́ ìkọ̀ tó lágbára, εἰς τὸν αἰῶνα sì ní agbára ‘láéláé’; gbolohun Yorùbá yìí jẹ́ adayeba, ó sì pa ìtẹnumọ́ náà mọ́.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: 'Ó sọ ète ìpinnu Paulu ní Yorùbá adayeba: kí abajade náà má ṣẹlẹ̀.'
theological_decisions:
- issue: Bóyá ‘láéláé’ túmọ̀ sí ìgbà gbogbo ní gígún tàbí ‘láéláé mọ́’ nínú ayé Paulu
  choice: láéláé
  alternative: láéláé mọ́ / ní gbogbo ìgbésí ayé mi
  rationale: A pa gbólóhùn Giriki εἰς τὸν αἰῶνα mọ́ ní ọ̀nà tó lágbára, láì dín ààlà rẹ̀ kù tàbí ṣàlàyé rẹ̀ ju ohun tí orísun sọ lọ.
- issue: Ìtumọ̀ σκανδαλίζω
  choice: mú ... kọsẹ̀
  alternative: mú ... ṣẹ̀ / mú ... ṣubú sínú ẹ̀ṣẹ̀
  rationale: ‘Kọsẹ̀’ dáàbò bo àwòrán àti àìdánilójú orísun, dípò yíyan ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘arákùnrin mi’ gẹ́gẹ́ bí ọ̀rọ̀ ìbátan inú ìjọ tí ó bá ἀδελφόν μου mu; kò sí àmì àlàyé ẹsẹ̀ nítorí kò sí àlàyé tó pọndandan.
