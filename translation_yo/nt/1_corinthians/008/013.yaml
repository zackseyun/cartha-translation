  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì náà dáadáa: διόπερ ni “Nítorí náà”; βρῶμα àti κρέα jẹ́ “oúnjẹ” àti “ẹran” ní ìyàtọ̀ tó yẹ; ìkọ̀-lẹ́ẹ̀mejì οὐ μὴ pẹ̀lú εἰς τὸν αἰῶνα ni “kì yóò ... láéláé”; ìpinnu ἵνα μὴ sì hàn nínú “kí ... má bàa.” “Mú arákùnrin mi kọsẹ̀” pa àwòrán σκανδαλίζω mọ́ láì fi ìtumọ̀ ẹ̀kọ́ kan kún un.'
