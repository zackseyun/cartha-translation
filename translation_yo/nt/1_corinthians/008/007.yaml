revisions:
- from: Ṣùgbọ́n kì í ṣe gbogbo ènìyàn ló ní ìmọ̀ yìí. Síbẹ̀, nítorí bí àwọn kan ti mọ òrìṣà náà tẹ́lẹ̀ títí di ìsinsìnyí,[a] wọ́n ń jẹ ẹ́ bí oúnjẹ tí a fi rú ẹbọ sí òrìṣà; ẹ̀rí-ọkàn wọn sì, nítorí tí ó jẹ́ aláìlera, di aláìmọ́.[b]
  to: Ṣùgbọ́n kì í ṣe gbogbo ènìyàn ló ní ìmọ̀ yìí. Àwọn kan sì, nítorí ìfaramọ́ tí ó ti di àṣà pẹ̀lú òrìṣà náà títí di ìsinsìnyí,[a] ń jẹ oúnjẹ náà gẹ́gẹ́ bí oúnjẹ tí a fi rú ẹbọ sí òrìṣà; ẹ̀rí-ọkàn wọn tí ó jẹ́ aláìlera sì di aláìmọ́.[b]
  rationale: A tún gbolóhùn àárín ṣe kí ó lè fi συνήθεια hàn gẹ́gẹ́ bí ìfaramọ́ tí ó ti di àṣà, dípò kí ó sọ ìmọ̀ lasan nípa òrìṣà. A pa ἕως ἄρτι mọ́ pẹ̀lú “títí di ìsinsìnyí,” a sì tún ìpínlẹ̀ ẹ̀rí-ọkàn aláìlera ṣe sí Yorùbá tó dára síi. Àwọn àmì ẹsẹ àti ìtumọ̀ àwọn àlàyé abẹ́lẹ̀ wà ní ipò tó yẹ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ náà dáadáa: kì í ṣe gbogbo ènìyàn ló ní ìmọ̀ náà; ìfaramọ́/àṣà ìjọsìn òrìṣà tí ó ṣì ń ní ipa lórí àwọn kan ló mú kí wọ́n ka oúnjẹ náà sí ohun tí a fi rú ẹbọ sí òrìṣà; ẹ̀rí-ọkàn aláìlera wọn sì di aláìmọ́. Síbẹ̀, “nítorí bí àwọn kan ti mọ òrìṣà náà” ń sọ pé ohun tí ó fa ìṣe náà ni ọ̀nà tí wọ́n ṣe mọ òrìṣà, kì í ṣe συνήθεια, ìyẹn ìfaramọ́ tàbí àṣà tí ó ti di mímú.'
  naturalness: 'Àtúnṣe náà mú gbólóhùn náà rọrùn síi nínú Yorùbá òde òní: “Àwọn kan sì, nítorí ìfaramọ́ ...” dára ju “Síbẹ̀, nítorí bí ...” lọ; a sì yọ ìtòlẹ́sẹẹsẹ tí ó wúwo “nítorí tí ó jẹ́ aláìlera” kúrò.'
  terminology: “Ìmọ̀,” “ẹ̀rí-ọkàn,” “aláìlera,” àti “oúnjẹ tí a fi rú ẹbọ sí òrìṣà” yẹ. “Òrìṣà” ní àyíká yìí ń tọ́ka sí εἴδωλον, kò sì jẹ́ ìjẹ́rìí pé ó jẹ́ ọlọ́run tòótọ́. “Di aláìmọ́” pa àwòrán ìdọ̀tí ìwà rere/ìsìn ti μολύνεται mọ́.
