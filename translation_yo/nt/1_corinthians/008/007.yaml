id: 1CO.8.7
reference: 1 Corinthians 8:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: yo
  text: Ṣùgbọ́n kì í ṣe gbogbo ènìyàn ló ní ìmọ̀ yìí. Àwọn kan sì, nítorí ìfaramọ́ tí ó ti di àṣà pẹ̀lú òrìṣà náà títí di ìsinsìnyí,[a] ń jẹ oúnjẹ náà gẹ́gẹ́ bí oúnjẹ tí a fi rú ẹbọ sí òrìṣà; ẹ̀rí-ọkàn wọn tí ó jẹ́ aláìlera sì di aláìmọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, “nítorí àṣà tàbí ìfaramọ́ wọn pẹ̀lú òrìṣà náà títí di ìsinsìnyí.” Gbólóhùn Gíríìkì náà ṣòro; ó ṣeé ṣe kí ó túmọ̀ sí pé ìbáṣepọ̀ wọn tẹ́lẹ̀ pẹ̀lú ìjọsìn òrìṣà ṣì ń ní ipa lórí wọn.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan ní ìyàtọ̀ nínú gbólóhùn yìí, títí kan ìka kan tí ó lè túmọ̀ sí “ẹ̀rí-ọkàn nípa òrìṣà.” Ọ̀rọ̀ inú ẹsẹ náà tẹ̀ lé SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: ìmọ̀
  rationale: Ó pa ìsopọ̀ mọ́ ọ̀rọ̀ Pọ́ọ̀lù ní àyíká ẹsẹ yìí nípa ohun tí àwọn kan ‘mọ̀,’ ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún knowledge.
- source_word: συνήθεια
  choice: bí … ti mọ … tẹ́lẹ̀
  rationale: Ó fi ìbáṣepọ̀ tàbí ìfaramọ́ tí ó ti di àṣà hàn ní Yorùbá àdánidá, láì sọ ọ́ di ‘ẹ̀rí-ọkàn,’ èyí tí ó jẹ́ àṣà ìtumọ̀ mìíràn.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: òrìṣà náà tẹ́lẹ̀ títí di ìsinsìnyí
  rationale: Ó pa ἕως ἄρτι (‘títí di ìsinsìnyí’) mọ́, ó sì so gbólóhùn náà mọ́ ìfaramọ́ wọn pẹ̀lú òrìṣà, bó tilẹ̀ jẹ́ pé èdè Gíríìkì náà ṣòro ní ìṣètò.
- source_word: εἰδωλόθυτον
  choice: oúnjẹ tí a fi rú ẹbọ sí òrìṣà
  rationale: Ó sọ ìtumọ̀ oúnjẹ tí a ti fi rú ẹbọ sí òrìṣà ní kedere àti ní Yorùbá tó wọ́pọ̀.
- source_word: συνείδησις
  choice: ẹ̀rí-ọkàn
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún agbára inú tí ń jẹ́rìí nípa rere àti búburú.
- source_word: ἀσθενής
  choice: aláìlera
  rationale: Ó tẹ̀ lé àwòrán ‘àìlera’ tí Pọ́ọ̀lù ń lò fún ẹni tí ẹ̀rí-ọkàn rẹ̀ kò lágbára nínú ọ̀ràn yìí.
- source_word: μολύνεται
  choice: di aláìmọ́
  rationale: Ó fi àbájáde ìbàjẹ́ tàbí ìdọ̀tí ní ti ìwà rere hàn ní ọ̀nà tó ṣe kedere sí òǹkàwé Yorùbá.
theological_decisions:
- issue: Bí a ṣe máa sọ ipò oúnjẹ tí a fi rú ẹbọ láì fi hàn pé òrìṣà jẹ́ ọlọ́run tòótọ́
  choice: wọ́n ń jẹ ẹ́ bí oúnjẹ tí a fi rú ẹbọ sí òrìṣà
  alternative: wọ́n ń jẹ ẹ́ gẹ́gẹ́ bí ẹbọ sí òrìṣà
  rationale: '‘Bí’ fi ojú tí àwọn olùjẹ náà fi ń wo oúnjẹ náà hàn, láì jẹ́rìí pé òrìṣà jẹ́ ọlọ́run tòótọ́. Ó pa ìfọ̀kànbalẹ̀ ẹ̀kọ́ inú orí náà mọ́: òrìṣà kì í ṣe nǹkan kan, síbẹ̀ ìjẹ oúnjẹ náà lè ba ẹ̀rí-ọkàn aláìlera jẹ́.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. ‘Òrìṣà’ ni a lò fún εἴδωλον gẹ́gẹ́ bí ohun tí a ń bọ̀ tí kì í ṣe Ọlọ́run tòótọ́; àyíká gbólóhùn náà kò fìdí òtítọ́ ìwàláàyè rẹ̀ gẹ́gẹ́ bí ọlọ́run múlẹ̀. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá èdè àdánidá mu.
