    rationale: Ó yé ẹni, ṣùgbọ́n kò rọrùn nínú Yorùbá. Àpèjúwe taara “ẹ̀rí-ọkàn wọn tí ó jẹ́ aláìlera” ń tẹ̀ lé participle Gíríìkì náà dáadáa.
