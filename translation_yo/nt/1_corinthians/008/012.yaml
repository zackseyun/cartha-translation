id: 1CO.8.12
reference: 1 Corinthians 8:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: yo
  text: Bẹ́ẹ̀ ni, bí ẹ ṣe ń ṣẹ̀ sí àwọn arákùnrin[b], tí ẹ sì ń pa ẹ̀rí-ọkàn wọn tí ó jẹ́ aláìlera lára, ẹ ń ṣẹ̀ sí Mèsáyà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Àwọn arákùnrin” níhìn-ín túmọ̀ sí àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn; àyíká ọ̀rọ̀ lè fi àwọn ọkùnrin àti obìnrin sínú rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà ni Χριστός (Khristós), ìyẹn ẹni àmì òróró.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Nípa bẹ́ẹ̀
  rationale: Ó so ọ̀rọ̀ yìí mọ́ ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ, ó sì tọ́ka sí ọ̀nà ìṣe tí a ṣàpèjúwe ṣáájú, láìfi ìtakora líle kún δέ.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: bí ẹ ṣe ń ṣẹ̀ sí àwọn arákùnrin
  rationale: Ìṣàpèjúwe ‘bí ẹ ṣe ń’ fi ìbáṣepọ̀ participle náà pẹ̀lú ọ̀rọ̀-ìṣe pàtàkì hàn; ‘ṣẹ̀ sí’ sì mú agbára ìtọ́sọ́nà εἰς sí ẹni tí a ṣẹ̀ sí jáde.
- source_word: τύπτοντες
  choice: ń pa ... lára
  rationale: Nínú àyíká àfiwé yìí, gbólóhùn Yorùbá náà jẹ́ àdánidá, ó sì pa agbára τύπτω mọ́ gẹ́gẹ́ bí ṣíṣe ìpalára, dípò lílu ní ti ara.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: ẹ̀rí-ọkàn wọn tí ó jẹ́ aláìlera
  rationale: ‘Ẹ̀rí-ọkàn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún συνείδησις; ẹyọ ọ̀rọ̀ náà pa nọ́ńbà ẹyọ Gíríìkì mọ́ ní ìtumọ̀ pínpín, ‘aláìlera’ sì ṣàfihàn ἀσθενοῦσαν.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: ẹ ń ṣẹ̀ sí Mèsáyà
  rationale: ‘Ṣẹ̀ sí’ tún pa agbára εἰς mọ́; ‘Mèsáyà’ sì mú ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè Ẹni Àmì-òróró jáde.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοὺς nínú àwùjọ àwọn onígbàgbọ́
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ akọ ní ọ̀pọ̀, ṣùgbọ́n nínú lẹ́tà sí ìjọ ó lè tọ́ka sí àwọn onígbàgbọ́ lápapọ̀. A pa fọ́ọ̀mù orísun mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ìbòòrò rẹ̀ ní àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ Χριστόν
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ oyè tó túmọ̀ sí Ẹni Àmì-òróró; ‘Mèsáyà’ pa agbára oyè náà mọ́, nígbà tí àṣàyàn ìbílẹ̀ ‘Kristi’ wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ̀rí-ọkàn’ fún conscience àti ìlànà ‘pa ... lára’ láti mú àfiwé ìpalára náà dun bí Yorùbá àdánidá.
