id: 1CO.8.9
reference: 1 Corinthians 8:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n ẹ ṣọ́ra kí ẹ̀tọ́ yín yìí má bàa di ohun ìkọ̀sẹ̀ fún àwọn aláìlera[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘òmìnira yín yìí.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘àṣẹ,’ ‘ẹ̀tọ́,’ tàbí ‘òmìnira’; níbí, ó tọ́ka sí òmìnira tí àwọn onígbàgbọ́ kan ní pé àwọn lè jẹ oúnjẹ tó ní í ṣe pẹ̀lú òrìṣà.
    reason: lexical_alternative
  - marker: b
    text: ‘Àwọn aláìlera’ níbí ni àwọn tí ẹ̀rí-ọkàn wọn kò lágbára nínú ọ̀ràn yìí.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: ẹ ṣọ́ra
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pe àwọn olùgbọ́ púpọ̀ sí ìṣọ́ra. ‘Ẹ ṣọ́ra’ jẹ́ Yorùbá àdánidá tí ó pa agbára ìkìlọ̀ náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré sí ìkìlọ̀ hàn lẹ́yìn ọ̀rọ̀ tó ṣáájú; ‘Ṣùgbọ́n’ bá ìtumọ̀ yìí mu.
- source_word: μή πως
  choice: kí ... má bàa
  rationale: Ìṣọ̀rọ̀ Yorùbá yìí fi ìkìlọ̀ lòdì sí ohun tí ó ṣeé ṣe kí ó ṣẹlẹ̀ hàn lọ́nà àdánidá, láì sọ pé ó dájú pé yóò ṣẹlẹ̀.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: ẹ̀tọ́ yín yìí
  rationale: Nínú àyíká ọ̀rọ̀, ἐξουσία tọ́ka sí òmìnira tàbí ẹ̀tọ́ tí àwọn kan ní pé àwọn lè jẹ oúnjẹ tó ní í ṣe pẹ̀lú òrìṣà. ‘Ẹ̀tọ́’ mú èrò ohun tí ènìyàn ní àṣẹ láti ṣe jáde kedere.
- source_word: πρόσκομμα
  choice: ohun ìkọ̀sẹ̀
  rationale: Ó pa àwòrán ohun tí ń mú ẹlòmíràn kọsẹ̀ mọ́, ó sì lè tọ́ka sí ìṣubú nípa ẹ̀rí-ọkàn tàbí ìgbàgbọ́.
- source_word: γένηται
  choice: di
  rationale: ‘Di’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì péye fún ìtumọ̀ ‘become’ nínú gbólóhùn yìí.
- source_word: τοῖς ἀσθενέσιν
  choice: fún àwọn aláìlera
  rationale: Ó pa ìsọ̀rí kúkúrú ti Gíríìkì mọ́. Àyíká orí náà ló ń fi hàn pé àìlera ẹ̀rí-ọkàn ni a ń sọ, kì í ṣe àìlera ara.
theological_decisions:
- issue: Ìtumọ̀ ἐξουσία nínú àyíká ọ̀rọ̀
  choice: Ó tọ́ka sí ẹ̀tọ́ tàbí òmìnira tí àwọn ará Kọ́ríńtì kan ń sọ pé àwọn ní nípa jíjẹ oúnjẹ tí a fi rúbọ sí òrìṣà.
  alternative: Ó lè túmọ̀ sí àṣẹ tàbí agbára ní ọ̀nà tó gbòòrò.
  rationale: Àyíká 1 Kọ́ríńtì 8 dá lórí bí ìmọ̀ àti òmìnira ẹni kan ṣe lè kan ẹ̀rí-ọkàn onígbàgbọ́ mìíràn. ‘Ẹ̀tọ́’ ṣàfihàn ọ̀ràn ìwà rere yìí láì mú èrò àṣẹ ilé-iṣẹ́ wọ inú rẹ̀.
- issue: Ìtumọ̀ τοῖς ἀσθενέσιν
  choice: Àwọn onígbàgbọ́ tí ẹ̀rí-ọkàn wọn kò lágbára nínú ọ̀ràn yìí.
  alternative: Àwọn aláìlera ní ọ̀nà gbogbogbòò tàbí nípa ara.
  rationale: Lílo ‘aláìlera’ léraléra nínú orí náà tọ́ka sí ẹ̀rí-ọkàn tí ó ṣeé farapa. A pa gbólóhùn kúkúrú náà mọ́ nínú ẹsẹ̀, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó ṣeé lóye. ‘Ẹ ṣọ́ra ... má bàa’ jẹ́ ìkìlọ̀ àdánidá; ‘ohun ìkọ̀sẹ̀’ sì pa àwòrán Gíríìkì mọ́. Gbogbo àmì àlàyé [a][b] wà nínú ọ̀rọ̀ pàtàkì.
