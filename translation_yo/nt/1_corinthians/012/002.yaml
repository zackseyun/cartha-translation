id: 1CO.12.2
reference: 1 Corinthians 12:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἴδατε ὅτι ὅτε ἔθνη ἦτε πρὸς τὰ εἴδωλα τὰ ἄφωνα ὡς ἂν ἤγεσθε ἀπαγόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: yo
  text: Ẹ mọ̀ pé nígbà tí ẹ̀yin jẹ́ Kèfèrí, a ń mú yín lọ sí ọ̀dọ̀ àwọn òrìṣà tí kò lè sọ̀rọ̀[a], bí a ti ń darí yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn òrìṣà aláìlèsọ̀rọ̀.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ pé, “a ń mú yín lọ sí ọ̀dọ̀ àwọn òrìṣà tí kò lè sọ̀rọ̀, bí a ti ń darí yín.” Ọ̀rọ̀ Gíríìkì fi hàn pé a ń darí wọn lọ nígbà náà, ṣùgbọ́n kò sọ ẹni tàbí ohun tí ń darí wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: Ẹ mọ̀
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìtọ́kasí ohun tí àwọn olùgbọ́ ti mọ̀ tẹ́lẹ̀.
- source_word: ἔθνη
  choice: Kèfèrí
  rationale: Nínú àyíká yìí, ó tọ́ka sí ipò wọn tẹ́lẹ̀ gẹ́gẹ́ bí àwọn tí kì í ṣe Júù tí wọ́n sì ń sin òrìṣà; “Kèfèrí” ṣókí, ó sì yé àwọn òǹkàwé Yorùbá.
- source_word: πρὸς τὰ εἴδωλα
  choice: lọ sọ́dọ̀ àwọn òrìṣà
  rationale: “Sọ́dọ̀” pa ìtumọ̀ ìlọ sí ọ̀dọ̀ ohun kan mọ́, “òrìṣà” sì jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún εἴδωλα nínú àyíká ìjọsìn èké.
- source_word: τὰ ἄφωνα
  choice: tí kò lè sọ̀rọ̀
  rationale: Ó sọ àìlágbára àwọn òrìṣà láti sọ̀rọ̀ ní kedere, ó sì pa ìyàtọ̀ tí ọ̀rọ̀ náà dá sílẹ̀ pẹ̀lú ọ̀rọ̀ tí Ẹ̀mí ń mú jáde mọ́.
- source_word: ἤγεσθε ἀπαγόμενοι
  choice: a máa ń fà yín lọ … a bá fi ń darí yín
  rationale: A lo arọ́pò-orúkọ aláìdánimọ̀ “a” láti fi ohùn ìṣe àfaradà Gíríìkì hàn ní Yorùbá; “máa ń” tún pa ìṣe tí ó ń lọ lọ́wọ́ ní àkókò àtijọ́ mọ́.
- source_word: ὡς ἂν
  choice: lọ́nà èyíkéyìí tí
  rationale: Ó mú ìtumọ̀ àìdánilójú tàbí ọ̀nà yòówù tí wọ́n fi ń darí wọn jáde láìyanju rẹ̀ sí ìtumọ̀ kan tóóró.
theological_decisions:
- issue: Ìtumọ̀ ἔθνη nípa ìgbésí ayé àwọn ará Kọ́ríńtì tẹ́lẹ̀
  choice: Kèfèrí
  alternative: àwọn tí kì í ṣe Júù; àwọn orílẹ̀-èdè
  rationale: Yíyan yìí pa apá ẹ̀yà àti ti ẹ̀sìn inú ọ̀rọ̀ Pọ́ọ̀lù mọ́, láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- issue: Ìyàtọ̀ láàárín àwọn òrìṣà aláìlèsọ̀rọ̀ àti ọ̀rọ̀ tí Ẹ̀mí ń mú jáde
  choice: àwọn òrìṣà tí kò lè sọ̀rọ̀
  alternative: àwọn òrìṣà aláìlẹ́nu-ọ̀rọ̀
  rationale: Ó pa agbára ọ̀rọ̀ àkọ́kọ́ mọ́, ṣùgbọ́n kò ṣàlàyé ìtumọ̀ ẹ̀kọ́ ìsìn ju ohun tí ẹsẹ náà sọ lọ.
- issue: Ohùn ìṣe àfaradà nínú ἤγεσθε ἀπαγόμενοι
  choice: a máa ń fà yín lọ … a bá fi ń darí yín
  alternative: ẹ máa ń lọ … bí wọ́n ti ń darí yín
  rationale: Ìtumọ̀ yìí tẹnumọ́ pé agbára mìíràn ló ń darí wọn tẹ́lẹ̀, ṣùgbọ́n kò sọ ẹni tàbí ohun tí agbára náà jẹ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó níyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ẹ” jẹ́ arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, “a” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe àfaradà láìdárúkọ olùṣe. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
