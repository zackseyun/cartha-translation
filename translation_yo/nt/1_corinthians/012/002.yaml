  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ọ̀pọ̀ ìtumọ̀ Gíríìkì mọ́: ìgbà tí àwọn olùgbọ́ jẹ́ Kèfèrí, ìsọ̀kalẹ̀ sí ọ̀dọ̀ àwọn òrìṣà aláìlèsọ̀rọ̀, àti ìdarí wọn láìsọ ẹni tó ń darí. Ṣùgbọ́n “a máa ń fà yín lọ” lè túmọ̀ sí fífa tàbí ìfipá ju ἀπαγόμενοι lọ; “mú yín lọ” jẹ́ ìbámu tó dáa sí i. “tí a bá fi ń darí yín” sì ní ìró ipò/àdéhùn (‘tí a bá fi’) tí kò hàn nínú ὡς ἂν.'
  naturalness: “Bí a ti ń darí yín” jẹ́ Yorùbá ìgbàlódé tó rọrùn, ó sì mú ‘however/as you were led’ jáde dáadáa. A tún yọ ìbéèrè tó lè dà bí ìfipá kúrò nínú “fà yín lọ.”
  terminology: “Kèfèrí” jẹ́ ọ̀rọ̀ ìtúmọ̀ Bíbélì Yorùbá tó wọ́pọ̀ fún ἔθνη nínú àyíká yìí, bí ó tilẹ̀ jẹ́ pé ó ní ìtumọ̀ ẹ̀sìn pẹ̀lú. “Àwọn òrìṣà tí kò lè sọ̀rọ̀” dá ìtumọ̀ εἴδωλα τὰ ἄφωνα dúró. Àlàyé ẹsẹ̀ [b] yẹ kí ó má ṣe sọ ‘agbára mìíràn,’ nítorí Gíríìkì kò dárúkọ olùdarí náà.
