id: 1CO.12.26
reference: 1 Corinthians 12:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: yo
  text: Bí ẹ̀yà ara kan bá ń jìyà, gbogbo àwọn ẹ̀yà ara ni ó ń bá a jìyà; bí a bá sì bu ọlá fún ẹ̀yà ara kan[a], gbogbo àwọn ẹ̀yà ara ni ó ń bá a yọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí a bá ṣe ẹ̀yà ara kan lógo.” Níhìn-ín, ó ṣeé ṣe kí ìtumọ̀ náà jẹ́ pé ẹ̀yà ara kan gba ọlá, gbogbo ara sì bá a yọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: bí … bá …; bí … bá sì
  rationale: Ìṣètò yìí sọ àwọn ipò méjì tí Pọ́ọ̀lù gbé kalẹ̀ ní ọ̀nà Yorùbá àdánidá, ó sì pa ìfarawé àwọn gbólóhùn méjèèjì mọ́.
- source_word: πάσχει
  choice: ń jìyà
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti fífarada ìrora tàbí wàhálà mọ́ láì sọ irú ìjìyà kan pàtó.
- source_word: ἓν μέλος / μέλος
  choice: ẹ̀yà ara kan
  rationale: Nínú àkàwé ara kan náà, ‘ẹ̀yà ara’ ṣe kedere sí òǹkàwé Yorùbá, ó sì dá àwòrán ara tí Pọ́ọ̀lù lò sí.
- source_word: συμπάσχει
  choice: ń bá a jìyà
  rationale: Ọ̀rọ̀ náà ní èrò fífi ara kún ìjìyà ẹlòmíràn; ‘bá a jìyà’ sọ ìṣọ̀kan yìí ní ṣókí àti ní ti ẹ̀dá.
- source_word: πάντα τὰ μέλη
  choice: gbogbo àwọn ẹ̀yà ara
  rationale: A tún ọ̀rọ̀ náà ṣe ní ìlà méjèèjì láti pa àtúnṣe àsọyé Gíríìkì àti àkàwé ara mọ́.
- source_word: δοξάζεται
  choice: a bá bu ọlá fún
  rationale: Nínú àyíká ọ̀rọ̀ ìtọ́jú ara-ẹni-láàárín ìjọ, gbígbé ẹ̀yà kan ga ní ọlá ni ìtumọ̀ tó ṣeé ṣe jù; ọ̀rọ̀ yìí tún pa ìṣe aláìṣeṣe Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: συγχαίρει
  choice: ń bá a yọ̀
  rationale: Ó sọ pé gbogbo ẹ̀yà ara ń pín ayọ̀ ẹ̀yà tí a bu ọlá fún, kì í ṣe pé wọ́n kàn ń yọ̀ lọ́tọ̀ọ̀tọ̀.
theological_decisions:
- issue: Ìtumọ̀ δοξάζεται nínú àkàwé ara ìjọ
  choice: a bu ọlá fún
  alternative: a ṣe lógo
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ìtọ́jú àti ìgbẹ́kẹ̀lé ara wọn láàárín àwọn ẹ̀yà ara kan. ‘Bu ọlá fún’ mú ìtumọ̀ ìbáṣepọ̀ yìí jáde láì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó wuwo, bí ògo ìkẹyìn, kún ẹsẹ náà; a sì tọ́ka sí ìtumọ̀ míì nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó bójú mu, tó sì ní iyì. Àkàwé ara àti ìfarawé àwọn gbólóhùn méjèèjì ni a pa mọ́; àmì àlàyé [a] wà lẹ́yìn ọ̀rọ̀ δοξάζεται tí àlàyé náà ń ṣàlàyé.
