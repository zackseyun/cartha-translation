id: 1CO.12.13
reference: 1 Corinthians 12:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: yo
  text: Nítorí ní tòótọ́, nínú Ẹ̀mí kan[a] ni a batisí gbogbo wa sínú ara kan—ìbáà ṣe Júù tàbí Gíríìkì, ìbáà ṣe ẹrú tàbí ẹni òmìnira—a sì fún gbogbo wa ní Ẹ̀mí kan[b] láti mu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ Ẹ̀mí kan,” tàbí “pẹ̀lú Ẹ̀mí kan.” Ọ̀rọ̀ Gíríìkì ἐν lè tọ́ka sí àyíká, ohun èlò, tàbí olùṣe.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ẹ̀mí kan”; ṣùgbọ́n ọ̀rọ̀ tó yí i ká tọ́ka gidigidi sí Ẹ̀mí Mímọ́.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “a sì fún wa gbogbo láti mu Ẹ̀mí kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí ní tòótọ́
  rationale: Ó pa agbára ìṣàlàyé γὰρ àti ìtẹnumọ́ καί mọ́, ní ọ̀nà tí ó bá èdè Yorùbá ọlọ́wọ̀ mu.
- source_word: ἐν ἑνὶ πνεύματι
  choice: nínú Ẹ̀mí kan
  rationale: “Nínú” tẹ̀lé ìtumọ̀ ibi tàbí àyíká ἐν, láì fi tipátipá pinnu pé Ẹ̀mí náà nìkan ni olùṣe; a fi ìtumọ̀ ohun èlò/olùṣe sí àlàyé ìsàlẹ̀.
- source_word: ἐβαπτίσθημεν
  choice: a batisí gbogbo wa
  rationale: “Batisí” ni ọ̀rọ̀ ìjọ tí ó wọ́pọ̀, ó sì pa ohùn àìṣe ti Gíríìkì mọ́ nípa ìlò àpólà aláìdárúkọ “a,” láì fi irú ọ̀nà ìbatisí kan lé ẹsẹ náà lórí.
- source_word: εἰς ἓν σῶμα
  choice: sínú ara kan
  rationale: “Sínú” fi ìdarí àti àbájáde ìdapọ̀ hàn, “ara kan” sì pa àwòrán ìṣọ̀kan ara tí Pọ́ọ̀lù ń lò mọ́.
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: Júù ... Gíríìkì
  rationale: Àwọn ọ̀rọ̀ wọ̀nyí pa ìyàtọ̀ ẹ̀yà àti ẹ̀sìn inú orísun náà mọ́; “Gíríìkì” kò gbòòrò sí “Kèfèrí” láìnídí.
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: ẹrú ... ẹni òmìnira
  rationale: Ìtakora ipò àwùjọ àti òfin ni a ń sọ níbí; “ẹrú” tú δοῦλος ní kíkún, “ẹni òmìnira” sì jẹ́ Yorùbá àdánidá fún ẹni tí kò sí lábẹ́ ìsìnrú.
- source_word: ἓν πνεῦμα
  choice: Ẹ̀mí kan
  rationale: Ọ̀rọ̀ tó yí ẹsẹ náà ká tọ́ka gidigidi sí Ẹ̀mí Mímọ́, nítorí náà a lo lẹ́tà ńlá; síbẹ̀ a pa àṣàyàn “ẹ̀mí kan” mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: ἐποτίσθημεν
  choice: a sì fún gbogbo wa ní Ẹ̀mí kan láti mu
  rationale: Ó pa ohùn àìṣe àti àwòrán mímu ti ποτίζω mọ́. Àlàyé ìsàlẹ̀ tún fúnni ní ìṣètò Yorùbá mìíràn tí ó tẹnumọ́ mímú wọn mu.
theological_decisions:
- issue: Bóyá ἐν ἑνὶ πνεύματι túmọ̀ sí wíwà “nínú” Ẹ̀mí tàbí pé Ẹ̀mí ni olùṣe/ohun èlò
  choice: nínú Ẹ̀mí kan
  alternative: nípasẹ̀ Ẹ̀mí kan; pẹ̀lú Ẹ̀mí kan
  rationale: Gíríìkì gba ìtumọ̀ àyíká àti ohun èlò/olùṣe láàyè. Àyànfẹ́ yìí sún mọ́ ìrísí orísun, àlàyé ìsàlẹ̀ sì dáàbò bo àìdánilójú ẹ̀kọ́ ìgbàgbọ́ náà.
- issue: Bóyá ἓν πνεῦμα ní gbólóhùn kejì ń tọ́ka sí Ẹ̀mí Mímọ́ tàbí sí ìpín ẹ̀mí kan náà
  choice: Ẹ̀mí kan
  alternative: ẹ̀mí kan
  rationale: Ìṣe ìṣọ̀kan Ẹ̀mí nínú àyíká ọ̀rọ̀ náà ṣe àtìlẹ́yìn fún Ẹ̀mí Mímọ́, ṣùgbọ́n lẹ́tà ńlá jẹ́ ìtumọ̀ olùtumọ̀, nítorí náà a mẹ́nu kan àṣàyàn kejì.
- issue: Bí a ṣe máa tú δοῦλοι nínú ìtakora pẹ̀lú ἐλεύθεροι
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Ipò ìdè ènìyàn ni ó ṣe pàtàkì nínú ìtakora “ẹrú/ẹni òmìnira”; “ìránṣẹ́” lè rọ ìtumọ̀ òfin àti àwùjọ náà jù.
translation_notes:
  register: Èdè Yorùbá àpéjọ tó lọ́lá, tó ṣe kedere fún òǹkàwé òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Ìbáà ṣe ... tàbí ...” ń gbé ìṣètò εἴτε ... εἴτε kalẹ̀ lọ́nà àdánidá, àwọn àmì gígùn sì pa ìtòlẹ́sẹẹsẹ ìtakora inú ẹsẹ náà mọ́.
