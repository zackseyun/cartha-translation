id: 1CO.12.6
reference: 1 Corinthians 12:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: yo
  text: Oríṣiríṣi ìṣiṣẹ́ sì wà,[b] ṣùgbọ́n Ọlọ́run kan náà ni ẹni tí ń ṣiṣẹ́ ohun gbogbo nínú gbogbo wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní ọ̀rọ̀ gangan, “nínú gbogbo.” Èdè Gíríìkì kò sọ orúkọ náà ní tààrà; àyíká ọ̀rọ̀ tọ́ka sí gbogbo àwọn ọmọ ìjọ tí Ọlọ́run ń ṣiṣẹ́ nínú wọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ṣùgbọ́n Ọlọ́run kan náà, ẹni tí ń ṣiṣẹ́ ohun gbogbo nínú gbogbo wọn.”
    reason: previous_rendering
lexical_decisions:
- source_word: διαιρέσεις
  choice: onírúurú
  rationale: Ó fi hàn pé oríṣiríṣi irú tàbí ìfarahàn ló wà, láìdámọ̀ràn pé ìyapa tàbí ìjà wà láàárín wọn.
- source_word: ἐνεργημάτων
  choice: ìṣiṣẹ́
  rationale: Ọ̀rọ̀ yìí lè tọ́ka sí àwọn iṣẹ́ tàbí àbájáde agbára tí ń ṣiṣẹ́. “Ìṣiṣẹ́” jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú ἐνεργῶν (“ń ṣiṣẹ́”) tí ó tẹ̀ lé e hàn gbangba.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: ṣùgbọ́n Ọlọ́run kan náà
  rationale: '“Ṣùgbọ́n” mú ìyàtọ̀ kékeré tí δέ ń fi hàn jáde: ìṣiṣẹ́ yàtọ̀ síra, ṣùgbọ́n orísun wọn jẹ́ Ọlọ́run kan náà.'
- source_word: ὁ ἐνεργῶν
  choice: ẹni tí ń ṣiṣẹ́
  rationale: Gbólóhùn àsopọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìtumọ̀ iṣẹ́ tí ń lọ lọ́wọ́ mọ́, pẹ̀lú ìbáṣepọ̀ ọ̀rọ̀ sí “ìṣiṣẹ́.”
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìtẹnumọ́ gbòòrò ti ọ̀rọ̀ Gíríìkì mọ́, láìfi “wọ̀nyí” kún un tí yóò dín ààlà ìtumọ̀ rẹ̀ kù.
- source_word: ἐν πᾶσιν
  choice: nínú gbogbo wọn
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ orúkọ tí “gbogbo” ń ṣàpèjúwe ní tààrà. “Nínú gbogbo wọn” jẹ́ Yorùbá àdánidá, ó tọ́ka sí àwọn ènìyàn inú àwùjọ tí àyíká ọ̀rọ̀ ń sọ̀rọ̀ nípa wọn, ó sì pa àìsọ pàtó inú orísun mọ́.
theological_decisions:
- issue: Ààlà iṣẹ́ Ọlọ́run nínú τὰ πάντα ἐν πᾶσιν
  choice: “ẹni tí ń ṣiṣẹ́ ohun gbogbo nínú gbogbo wọn”
  alternative: “ẹni tí ń ṣiṣẹ́ ohun gbogbo nínú gbogbo ènìyàn” tàbí “ẹni tí ń ṣiṣẹ́ gbogbo nǹkan wọ̀nyí nínú gbogbo wọn”
  rationale: Ìtumọ̀ náà pa ìfẹ̀ ti “ohun gbogbo” mọ́, ṣùgbọ́n kò fi “ènìyàn” tí kò sí ní tààrà sínú Gíríìkì kún un. Ní àyíká 1 Kọ́ríńtì 12, “gbogbo wọn” tọ́ka lọ́nà àdánidá sí àwọn ọmọ ìjọ tí Ọlọ́run ń ṣiṣẹ́ nínú wọn, láìsọ ọ̀rọ̀ náà di ẹ̀kọ́ àkànṣe tó kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ìṣiṣẹ́/ń ṣiṣẹ́” láti mú ìṣọ̀kan ọ̀rọ̀ inú Gíríìkì hàn.
