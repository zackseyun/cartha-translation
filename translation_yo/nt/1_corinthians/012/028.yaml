id: 1CO.12.28
reference: 1 Corinthians 12:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: yo
  text: 'Ọlọ́run sì ti fi àwọn kan sípò nínú ìjọ: èkíní, àwọn àpọ́sítélì; èkejì, àwọn wòlíì; ẹ̀kẹta, àwọn olùkọ́ni; lẹ́yìn náà, àwọn iṣẹ́ ìyanu[a]; lẹ́yìn náà, àwọn ẹ̀bùn ìmúláradá, àwọn iṣẹ́ ìrànlọ́wọ́, àwọn iṣẹ́ ìdarí[b], àti onírúurú ahọ́n[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn iṣẹ́ agbára.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn iṣẹ́ ìṣàkóso” tàbí “àwọn ọ̀nà ìtọ́sọ́nà.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “onírúurú èdè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ahọ́n” tàbí “èdè”; ọ̀rọ̀ inú ẹsẹ pa àìdánilójú yìí mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: ti fi … sípò
  rationale: Ó fi ìṣe Ọlọ́run tí ó yan tàbí gbé àwọn ènìyàn àti iṣẹ́ kalẹ̀ hàn, ó sì bá àyíká ìjọ mu ju ìtumọ̀ ibi lásán lọ.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: nínú ìjọ
  rationale: “Ìjọ” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ṣe kedere fún àwùjọ àwọn ènìyàn Ọlọ́run ní àyíká yìí.
- source_word: πρῶτον … δεύτερον … τρίτον
  choice: èkíní … èkejì … ẹ̀kẹta
  rationale: Àwọn ọ̀rọ̀ yìí pa ìtòlẹ́sẹẹsẹ Gíríìkì mọ́ láì pinnu bóyá ó jẹ́ ipò ọlá, àsìkò, tàbí pàtàkì iṣẹ́.
- source_word: ἀποστόλους
  choice: àwọn àpọ́sítélì
  rationale: Èyí ni ọ̀rọ̀ ìjọ tí a mọ̀ fún àwọn tí a rán ní iṣẹ́ àpọ́sítélì, kì í ṣe àwọn ońṣẹ́ lásán.
- source_word: προφήτας
  choice: àwọn wòlíì
  rationale: “Wòlíì” jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere fún ẹni tí ń sọ àsọtẹ́lẹ̀ tàbí ìfihàn láti ọ̀dọ̀ Ọlọ́run.
- source_word: διδασκάλους
  choice: àwọn olùkọ́ni
  rationale: Ó tọ́ka ní tààrà sí àwọn tí iṣẹ́ wọn jẹ́ kíkọ́ àwọn ènìyàn nínú ìjọ.
- source_word: δυνάμεις
  choice: àwọn iṣẹ́ ìyanu
  rationale: Nínú àtòjọ ẹ̀bùn yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn ìṣe agbára àrà ọ̀tọ̀. Àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan “iṣẹ́ agbára” mọ́.
- source_word: χαρίσματα ἰαμάτων
  choice: àwọn ẹ̀bùn ìmúláradá
  rationale: Ó fi ọ̀pọ̀ ẹ̀bùn àti ìṣe ìmúláradá hàn ní ọ̀nà Yorùbá tí ó ṣe kedere, láì dín gbólóhùn Gíríìkì kù sí ẹ̀bùn kan ṣoṣo.
- source_word: ἀντιλήμψεις
  choice: àwọn iṣẹ́ ìrànlọ́wọ́
  rationale: Ó sọ agbára tàbí àwọn ọ̀nà fífi ìrànlọ́wọ́ àti àtìlẹ́yìn ṣe ní kedere.
- source_word: κυβερνήσεις
  choice: àwọn iṣẹ́ ìdarí
  rationale: Ó pa àwòrán títọ́sọ́nà tàbí dídarí mọ́, láì fi dandan sọ pé ipò àṣẹ alákòóso kan pàtó ni.
- source_word: γένη γλωσσῶν
  choice: onírúurú ahọ́n
  rationale: “Ahọ́n” pa ọ̀rọ̀ àpèjúwe Gíríìkì mọ́, ó sì yẹra fún pípa àríyànjiyàn mọ́ lórí bóyá àwọn èdè ènìyàn nìkan ni a ń sọ. Àlàyé ìsàlẹ̀ fúnni ní “èdè” gẹ́gẹ́ bí ìtumọ̀ mìíràn.
theological_decisions:
- issue: Bóyá ìtòlẹ́sẹẹsẹ náà túmọ̀ sí ipò àṣẹ tí ó dúró, bí wọ́n ṣe farahàn ní àsìkò, tàbí bí iṣẹ́ wọn ṣe ṣe pàtàkì
  choice: Pa “èkíní … èkejì … ẹ̀kẹta … lẹ́yìn náà” mọ́ láì fi àlàyé míì kún un.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ipò àṣẹ, ìtòlẹ́sẹẹsẹ àsìkò, tàbí ìwọ̀n pàtàkì.
  rationale: Ẹsẹ náà fúnra rẹ̀ ṣe àtòjọ, ṣùgbọ́n kò sọ irú ìtòlẹ́sẹẹsẹ tí ó jẹ́. Ìtumọ̀ náà kò yanju ohun tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ ní àìdánilójú.
- issue: Ìtumọ̀ γλῶσσαι ní àyíká yìí
  choice: Lo “ahọ́n” nínú ẹsẹ, kí “èdè” wà nínú àlàyé ìsàlẹ̀.
  alternative: onírúurú èdè
  rationale: Èyí pa ìfojúrí ọ̀rọ̀ Gíríìkì sí “ahọ́n” mọ́, kò sì fi dandan pinnu irú ọ̀rọ̀ tí Pọ́ọ̀lù ń tọ́ka sí.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní àmì ohùn níbi tí ó yẹ. A lo àwọn ọ̀rọ̀ ìjọ tí gbogbo ènìyàn mọ̀, ṣùgbọ́n a yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan. Àtòjọ náà jẹ́ kedere, ó sì pa ìyípadà inú Gíríìkì láti àwọn ènìyàn sí àwọn iṣẹ́ tàbí ẹ̀bùn mọ́.
