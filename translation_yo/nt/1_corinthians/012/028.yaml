  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: “Ọlọ́run sì ti fi àwọn kan sípò nínú ìjọ” gbé ἔθετο ... ἐν τῇ ἐκκλησίᾳ wọ Yorùbá lọ́nà tó yẹ; àwọn òǹkà ìtòlẹ́sẹẹsẹ àti ìyípadà láti ipa àwọn ènìyàn sí ẹ̀bùn/ìṣiṣẹ́ ni a pa mọ́. “Lẹ́yìn náà” fún àwọn ἔπειτα méjèèjì kò fi ìtumọ̀ ipò-àṣẹ tàbí ìtòlẹ́sẹẹsẹ àsìkò kún un. “Onírúurú ahọ́n” sì dá àìdánilójú γένη γλωσσῶν dúró.'
  naturalness: Yorùbá náà jẹ́ ti ìgbàlódé, ó sì rọrùn láti ka nínú ìforígbárí àtòjọ. “Àwọn iṣẹ́ ìrànlọ́wọ́” àti “àwọn iṣẹ́ ìdarí” jẹ́ ọ̀nà àdánidá láti sọ àwọn ọ̀rọ̀ Gíríìkì ọ̀pọ̀ náà. Àmì ohùn àti àmì ìkọ̀wé wà níbi tó yẹ.
