  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: yo
  text: Kì í ṣe gbogbo wọn ló ní àwọn ẹ̀bùn ìmúláradá, bí?[a] Kì í ṣe gbogbo wọn ló ń sọ̀rọ̀ ní ahọ́n, bí?[b] Kì í ṣe gbogbo wọn ló ń túmọ̀ ọ̀rọ̀ náà, bí?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní Gíríìkì, ‘ẹ̀bùn’ àti ‘ìmúláradá’ wà ní ọ̀pọ̀: ‘àwọn ẹ̀bùn àwọn ìmúláradá.’ A tún lè sọ pé ‘àwọn ẹ̀bùn ìwòsàn.’'
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, ‘ní àwọn ahọ́n’ tàbí ‘ní àwọn èdè.’ Ní àyíká yìí, ó tọ́ka sí ẹ̀bùn tí a sábà máa ń pè ní ‘sísọ̀rọ̀ ní ahọ́n.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: Ṣé gbogbo wọn ... ni?
  rationale: Ìbéèrè pẹ̀lú μή ń retí ìdáhùn òdì. Ìṣètò ìbéèrè Yorùbá yìí, nínú ọ̀rọ̀ tó yí i ká, fi hàn pé ìdáhùn náà ni ‘rárá,’ láì lo ọ̀rọ̀ tí kò bá èdè Yorùbá mu.
- source_word: χαρίσματα
  choice: àwọn ẹ̀bùn
  rationale: ‘Àwọn ẹ̀bùn’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ ẹ̀bùn oore-ọ̀fẹ́ mu ní àyíká 1 Kọ́ríńtì 12.
- source_word: ἰαμάτων
  choice: ìmúláradá
  rationale: ‘Ìmúláradá’ túmọ̀ sí mímú ẹni padà bọ̀ sí ìlera. Àmì ọ̀pọ̀ wà lórí ‘àwọn ẹ̀bùn’; àkọsílẹ̀ ìsàlẹ̀ sì ṣàlàyé pé orúkọ Gíríìkì fún ìmúláradá náà tún jẹ́ ọ̀pọ̀.
- source_word: γλώσσαις
  choice: ní onírúurú èdè
  rationale: γλῶσσα lè túmọ̀ sí ‘ahọ́n’ tàbí ‘èdè.’ Ní ọ̀rọ̀ nípa ẹ̀bùn Ẹ̀mí yìí, ‘ní onírúurú èdè’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì pinnu irú àwọn èdè náà ju ohun tí Gíríìkì sọ lọ.
- source_word: λαλοῦσιν
  choice: ń sọ̀rọ̀
  rationale: Àkókò ìsinsìnyí níbí ń sọ nípa ohun tí ó máa ń ṣẹlẹ̀ tàbí agbára tí ènìyàn ní; ‘ń sọ̀rọ̀’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: διερμηνεύουσιν
  choice: ń túmọ̀ rẹ̀
  rationale: Ní àyíká 1 Kọ́ríńtì 12–14, ọ̀rọ̀ náà túmọ̀ sí mímú ohun tí a sọ ní èdè kan yé àwọn ẹlòmíràn. Arọ́pò-orúkọ ‘rẹ̀’ tọ́ka sí ọ̀rọ̀ inú onírúurú èdè láì fi ìtumọ̀ mìíràn kún un.
theological_decisions:
- issue: Ìwà àwọn ìbéèrè tí μή bẹ̀rẹ̀
  choice: Lo àwọn ìbéèrè tí àyíká wọn ń retí ìdáhùn ‘rárá’
  alternative: Sọ wọ́n bí ìbéèrè lásán láì jẹ́ kí ìdáhùn tí a retí hàn
  rationale: Èdè Gíríìkì fi hàn pé kì í ṣe gbogbo onígbàgbọ́ ni ó ní ẹ̀bùn kọ̀ọ̀kan. Ìtumọ̀ náà pa ìtẹnumọ́ Pọ́ọ̀lù mọ́ pé ẹ̀bùn yàtọ̀ síra nínú ara kan náà.
- issue: Ìtumọ̀ γλώσσαις
  choice: ní onírúurú èdè
  alternative: ní ahọ́n
  rationale: Yíyan ‘onírúurú èdè’ mú kí ọ̀rọ̀ náà yé òǹkàwé Yorùbá, ṣùgbọ́n kò sọ bóyá àwọn èdè náà jẹ́ èdè ènìyàn tí a mọ̀ tàbí irú ọ̀rọ̀ ẹ̀mí mìíràn; báyìí ni a ṣe pa àìdánilójú àyíká náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; ìbéèrè mẹ́tẹ̀ẹ̀ta pa ìṣísẹ̀ àti ìtẹnumọ́ ẹsẹ Gíríìkì mọ́.
