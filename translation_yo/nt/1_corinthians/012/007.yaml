id: 1CO.12.7
reference: 1 Corinthians 12:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: yo
  text: Ṣùgbọ́n a fi ìfarahàn Ẹ̀mí fún olúkúlùkù fún àǹfààní gbogbo wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ohun tí ó ṣàǹfààní,” tàbí, “fún ìre gbogbo wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστῳ
  choice: fún olúkúlùkù
  rationale: Ó pa agbára ìpínkiri ọ̀rọ̀ Gíríìkì mọ́, ó sì fi hàn pé olúkúlùkù nínú ara ni a ń sọ̀rọ̀ sí.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó ń fi ìyàtọ̀ kékeré tàbí ìyípadà ọ̀rọ̀ hàn láìsọ ìtakora náà di líle ju ti Gíríìkì lọ.
- source_word: δίδοται
  choice: a fi ... fún
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ohùn àìṣe-aláṣẹ Gíríìkì mọ́ láìfi ẹni tí ó ń fúnni kún ọ̀rọ̀ náà.
- source_word: φανέρωσις
  choice: ìfarahàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ohun tí ó mú iṣẹ́ Ẹ̀mí hàn gbangba tàbí jẹ́ kí a lè rí i nínú ìṣe.
- source_word: τοῦ πνεύματος
  choice: Ẹ̀mí
  rationale: Àyíká 1 Kọrinti 12 fi hàn pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; ṣùgbọ́n a kò fi “Mímọ́” kún un, nítorí kò sí nínú gbólóhùn Gíríìkì yìí.
- source_word: πρὸς τὸ συμφέρον
  choice: láti ṣe ire fún gbogbo ènìyàn
  rationale: Ó sọ ìtọ́sọ́nà sí àǹfààní tí ọ̀rọ̀ náà ní, ó sì mú ìtumọ̀ àwùjọ tí àyíká ara kan náà ń béèrè hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ẹni tí “Ẹ̀mí” ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́ ni, ṣùgbọ́n a túmọ̀ rẹ̀ sí “Ẹ̀mí” gẹ́gẹ́ bí Gíríìkì ṣe wí.
  alternative: ẹ̀mí ní ìtumọ̀ gbogbogbòò
  rationale: Àwọn ẹsẹ tó yí i ká ń sọ pé Ẹ̀mí kan náà ni orísun àwọn ẹ̀bùn náà; nítorí náà, Ẹ̀mí Mímọ́ ni itọ́kasí tó ṣe kedere.
- issue: Ìwọ̀n àǹfààní nínú συμφέρον
  choice: Ire náà jẹ́ fún gbogbo ìjọ tàbí gbogbo ènìyàn nínú ara.
  alternative: ohun tó ṣàǹfààní ní gbogbogbòò, tó sì lè kan ẹnì kọ̀ọ̀kan
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ohun tó ṣàǹfààní lásán, ṣùgbọ́n àyíká orí náà tẹnumọ́ ara kan àti bí àwọn ẹ̀bùn ṣe ń ṣe gbogbo ara ní ire. Àlàyé ìsàlẹ̀ pa ìtumọ̀ tó gbòòrò mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó níyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo “ìfarahàn” láti sọ bí iṣẹ́ Ẹ̀mí ṣe ń hàn gbangba, a sì lo gbólóhùn “láti ṣe ire fún gbogbo ènìyàn” láti mú ìdí àwùjọ tí àyíká náà ní yéni.
