id: 1CO.12.8
reference: 1 Corinthians 12:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: yo
  text: Nítorí pé a fi ọ̀rọ̀ ọgbọ́n[a] fún ẹnì kan nípasẹ̀ Ẹ̀mí, a sì fi ọ̀rọ̀ ìmọ̀[b] fún ẹlòmíràn ní ìbámu pẹ̀lú Ẹ̀mí kan náà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “àsọjáde ọgbọ́n” tàbí “ìkéde ọgbọ́n.”
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè jẹ́ “àsọjáde ìmọ̀” tàbí “ìkéde ìmọ̀.”
    reason: lexical_alternative
  - marker: c
    text: Ó tún lè jẹ́ “nípasẹ̀ Ẹ̀mí kan náà.” Nínú Gíríìkì, ọ̀rọ̀ ìṣáájú tí a lò níbí yàtọ̀ sí èyí tí a túmọ̀ sí “nípasẹ̀ Ẹ̀mí” ní apá àkọ́kọ́; ó ṣeé ṣe kó tẹnu mọ́ ìbámu pẹ̀lú Ẹ̀mí kan náà gẹ́gẹ́ bí orísun ìṣọ̀kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: fún ẹnì kan
  rationale: Ó fi ìpínkiri ẹ̀bùn sí àwọn ènìyàn ọ̀tọ̀ọ̀tọ̀ hàn lọ́nà Yorùbá tí ó ṣe déédé.
- source_word: διὰ τοῦ πνεύματος
  choice: nípasẹ̀ Ẹ̀mí
  rationale: Ó pa ìtumọ̀ ọ̀nà tàbí aṣojú tí διά pẹ̀lú jíníkítífù ní mọ́, ó sì jẹ́ kí Ẹ̀mí hàn gẹ́gẹ́ bí ẹni tí ẹ̀bùn náà ti ipa rẹ̀ wá.
- source_word: δίδοται
  choice: a fi ... fún
  rationale: Ìṣètò aláìlórúkọ yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìṣe aláìṣe-lójú, ó sì fi hàn pé a ń gba ẹ̀bùn náà, kì í ṣe pé ẹni náà dá a sílẹ̀ fúnra rẹ̀.
- source_word: λόγος σοφίας
  choice: ọ̀rọ̀ ọgbọ́n
  rationale: “Ọ̀rọ̀” lè túmọ̀ sí ohun tí a sọ tàbí iṣẹ́ tí a jíṣẹ́, nígbà tí “ọgbọ́n” pa ìbáṣepọ̀ jíníkítífù mọ́ láìfi ẹ̀kọ́ ìsìn kan kún un.
- source_word: ἄλλῳ
  choice: fún ẹlòmíràn
  rationale: Ó tẹ̀ síwájú nínú ìyàtọ̀ ìpínkiri tí ó bẹ̀rẹ̀ pẹ̀lú “fún ẹnì kan.”
- source_word: λόγος γνώσεως
  choice: ọ̀rọ̀ ìmọ̀
  rationale: A lo “ọ̀rọ̀” bí a ti lò ó nínú gbólóhùn tó ṣáájú, kí ìfarajọ tí ó wà nínú Gíríìkì lè dúró.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: ní ìbámu pẹ̀lú Ẹ̀mí kan náà
  rationale: Ó pa κατά mọ́ gẹ́gẹ́ bí ìbámu tàbí ìṣọ̀kan, ó sì yà á sọ́tọ̀ kúrò nínú διά (“nípasẹ̀”) tó wà ní apá àkọ́kọ́.
theological_decisions:
- issue: Ẹni tí “Ẹ̀mí” ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́, tí a fi lẹ́tà ńlá kọ “Ẹ̀mí” fún
  alternative: ẹ̀mí ènìyàn
  rationale: Àyíká 1 Kọ́ríńtì 12 ń sọ nípa Ẹ̀mí Ọlọ́run kan náà tí ń pín àwọn ẹ̀bùn; lẹ́tà ńlá ń ṣàfihàn ẹni tí ọ̀rọ̀ náà ń tọ́ka sí láìfi àlàyé ẹ̀kọ́ mìíràn kún un.
- issue: Ìtumọ̀ λόγος nínú àwọn gbólóhùn ẹ̀bùn Ẹ̀mí
  choice: ọ̀rọ̀
  alternative: iṣẹ́; àsọjáde
  rationale: “Ọ̀rọ̀” jẹ́ èdè Yorùbá tó rọrùn, ó sì lè gbé ìtumọ̀ ohun tí a sọ tàbí iṣẹ́ tí a jíṣẹ́; àlàyé ìsàlẹ̀ ojú-ewé pa àwọn ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàndá tí ó ní àmì ohùn ní kíkún, ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo “a fi ... fún” dípò ìṣe aláìṣe-lójú líle, a sì pa ìfarajọ àti ìyàtọ̀ àwọn ọ̀rọ̀ atọ́ka Gíríìkì mọ́.
