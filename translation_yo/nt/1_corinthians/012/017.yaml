id: 1CO.12.17
reference: 1 Corinthians 12:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: yo
  text: Bí gbogbo ara bá jẹ́ ojú kan, níbo ni ìgbọ́ yóò wà? Bí gbogbo rẹ̀ bá jẹ́ ìgbọ́, níbo ni agbára láti gbóòórùn yóò wà?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: gbogbo ara
  rationale: Ó túmọ̀ gbólóhùn náà ní tààrà, ó sì pa àwòrán Pọ́ọ̀lù mọ́ nípa ara tí gbogbo rẹ̀ dà bí ẹ̀yà kan ṣoṣo.
- source_word: ὀφθαλμός
  choice: ojú kan
  rationale: Ọ̀rọ̀ náà jẹ́ orúkọ ẹ̀yà ara ní ẹyọ kan; ‘ojú kan’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé gbogbo ara di ojú.
- source_word: ποῦ
  choice: ibo ni ... yóò wà?
  rationale: Èyí pa ìbéèrè ‘níbo?’ mọ́, nígbà tí ‘yóò wà’ mú ipa ipò àròsọ inú gbólóhùn náà jáde ní Yorùbá.
- source_word: ἀκοή
  choice: ìgbọ́ràn
  rationale: Nínú àyíká yìí, ‘ìgbọ́ràn’ ń tọ́ka sí agbára tàbí iṣẹ́ gbígbọ́, kì í ṣe etí gẹ́gẹ́ bí ẹ̀yà ara; ó tipa bẹ́ẹ̀ tẹ̀ lé ọ̀rọ̀ Gíríìkì.
- source_word: ὅλον
  choice: gbogbo rẹ̀
  rationale: Ó pa ìyọkúrò orúkọ ‘ara’ nínú gbólóhùn kejì mọ́ láì mú kí Yorùbá náà ṣòro láti lóye.
- source_word: ὄσφρησις
  choice: agbára láti gbóòórùn
  rationale: Ọ̀rọ̀ Gíríìkì ń tọ́ka sí agbára ìmọ̀lára gbígbọ́ òórùn, kì í ṣe imú fúnra rẹ̀; gbólóhùn yìí ṣe ìtumọ̀ náà kedere ní Yorùbá òde òní.
theological_decisions:
- issue: Ṣíṣe àpèjúwe ara nípasẹ̀ àwọn agbára ìmọ̀lára tàbí àwọn ẹ̀yà ara
  choice: Lo ‘ìgbọ́ràn’ àti ‘agbára láti gbóòórùn’ fún àwọn agbára ìmọ̀lára.
  alternative: Lo ‘etí’ àti ‘imú’ fún àwọn ẹ̀yà ara.
  rationale: Gíríìkì lo àwọn orúkọ tó túmọ̀ sí iṣẹ́ tàbí agbára gbígbọ́ àti gbígbọ́ òórùn, kì í ṣe àwọn ọ̀rọ̀ anatómì fún etí àti imú. Ìtumọ̀ yìí pa ìyàtọ̀ orísun náà mọ́ láì fi àwòrán tó ṣe pàtó jù kún un.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; àtúnṣe náà pa ìbéèrè àròsọ àti ìbáramu àwọn agbára ìmọ̀lára inú Gíríìkì mọ́.
