- from: Bí gbogbo ara bá jẹ́ ojú kan, ibo ni ìgbọ́ràn yóò wà? Bí gbogbo rẹ̀ bá jẹ́ ìgbọ́ràn, ibo ni agbára láti gbóòórùn yóò wà?
  to: Bí gbogbo ara bá jẹ́ ojú kan, níbo ni ìgbọ́ yóò wà? Bí gbogbo rẹ̀ bá jẹ́ ìgbọ́, níbo ni agbára láti gbóòórùn yóò wà?
  rationale: The correction is limited to restoring ‘hearing’ in both occurrences and standardizing the spelling of ‘níbo.’ The second sensory expression is retained because it faithfully conveys Greek ὄσφρησις as the capacity of smelling rather than the physical nose.
