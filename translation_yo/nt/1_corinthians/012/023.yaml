  source_fidelity: 'Ìtumọ̀ náà pa àwòrán ara, ìdájọ́ ènìyàn nínú δοκοῦμεν, àti ìfiwéra ọlá mọ́. Síbẹ̀, “ìbòjúwà” kì í ṣe ìbámu tó dára fún εὐσχημοσύνην nínú àyíká yìí: ó sábà ń tọ́ka sí ìwà ìtìjú/modesty, nígbà tí ọ̀rọ̀ Gíríìkì ń sọ nípa ìfarahàn tàbí ìrísí tó bójú mu. “Kò ní ọlá tó àwọn yòókù” tún lè dà bí ìfiwéra sí gbogbo ohun mìíràn, dípò sí àwọn ẹ̀yà ara yòókù tí ìtumọ̀ náà ń retí.'
  naturalness: “Wọ́n kéré ní ọlá ju àwọn mìíràn lọ” jẹ́ ọ̀nà Yorùbá boṣewa tó ṣe kedere fún afiwéra náà. “A ń fún àwọn wọ̀nyí ní ọlá púpọ̀ sí i” jẹ́ gbolohun adayeba, ó sì mú ìṣe περιτίθεμεν/‘bestow’ jáde dáadáa. “Ìfarahàn tó bójú mu sí i” bá ọ̀rọ̀ ìbora àti ìṣètò ẹ̀yà ara mu nípasẹ̀ ọ̀rọ̀ ìtumọ̀.
  terminology: A pa “ọlá” mọ́ fún τιμή, “tí kò yẹ ká fihàn” fún τὰ ἀσχήμονα, àti “ìfarahàn tó bójú mu” fún εὐσχημοσύνην. Àwọn ọ̀rọ̀ wọ̀nyí yẹ fún ìforúkọsílẹ̀ ọlọ́lá, ode-òní, láìsọ ìtumọ̀ náà di ìdájọ́ ìwà tàbí ẹ̀kọ́ ẹlẹ́gbẹ́ kan.
  issues:
