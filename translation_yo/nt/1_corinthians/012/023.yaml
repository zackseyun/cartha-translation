id: 1CO.12.23
reference: 1 Corinthians 12:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: yo
  text: àti àwọn ẹ̀yà ara tí a rò pé wọ́n kéré ní ọlá ju àwọn mìíràn lọ[a], àwọn wọ̀nyí ni a ń fún ní ọlá púpọ̀ sí i; àwọn ẹ̀yà ara wa tí kò yẹ ká fihàn sì ní ìfarahàn tó bójú mu sí i[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a kà sí aláìlọ́lá ju àwọn mìíràn lọ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹwà tó yẹ sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: tí a rò pé
  rationale: Ó fi hàn pé ìdájọ́ tàbí èrò ènìyàn ni, kì í ṣe pé ohun náà rí bẹ́ẹ̀ ní ti gidi.
- source_word: ἀτιμότερα
  choice: kò ní ọlá tó àwọn yòókù
  rationale: Èyí mú ìtumọ̀ afiwéra náà jáde ní èdè Yorùbá àdánidá, ó sì pa ìyàtọ̀ láàárín àìní ọlá àti fífi ọlá fún mọ́.
- source_word: τιμὴν περισσοτέραν περιτίθεμεν
  choice: à ń fi ọlá púpọ̀ sí i fún
  rationale: Ó sọ ìṣe fífi ọlá tí ó pọ̀ ju ti tẹ́lẹ̀ lọ fún àwọn ẹ̀yà náà ní ọ̀nà tí ó ṣe kedere, bó tilẹ̀ jẹ́ pé ó dín àwòrán gangan ti ‘fí ohun yí ká’ kù.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: àwọn ẹ̀yà ara wa tí kò yẹ ká fihàn
  rationale: Ó mú èrò ohun tí kò bójú mu láti fihàn ní gbangba jáde láì sọ ọ́ di ìwà búburú ní ti ìṣe.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: ń ní ìbòjúwà tó pọ̀ sí i
  rationale: ‘Ìbòjúwà’ níbí tọ́ka sí ìtọ́jú tó yẹ, ìbora, àti ìfarahàn tó bójú mu; afiwéra ‘tó pọ̀ sí i’ sì dúró gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
theological_decisions:
- issue: Àwòrán ara àti ọlá láwùjọ
  choice: Pa ọ̀rọ̀ nípa àwọn ẹ̀yà ara mọ́ gẹ́gẹ́ bí àwòrán tó ṣe kedere.
  alternative: Ṣàlàyé rẹ̀ tààrà gẹ́gẹ́ bí fífi ọlá fún àwọn ọmọ ìjọ tí a kà sí aláìlera.
  rationale: Ìjiyàn Pọ́ọ̀lù gbára lé ìbáṣepọ̀ láàárín bí a ṣe ń tọ́jú ara gangan àti ìjọ gẹ́gẹ́ bí ara Kristi; ìtumọ̀ kò gbọdọ̀ fi ìlò rẹ̀ rọ́pò àwòrán náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. A lo ‘kò yẹ ká fihàn’ fún ohun tí kò bójú mu ní gbangba, àti ‘ìbòjúwà’ fún ìtọ́jú tàbí ìfarahàn tó yẹ, láìfi ìtumọ̀ ẹ̀sìn ẹlẹ́gbẹ́ kan kún un.
