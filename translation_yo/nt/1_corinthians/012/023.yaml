  - severity: low
    issue: Ìfiwéra nínú “kò ní ọlá tó àwọn yòókù”
    rationale: Ó lè jẹ́ ìfiwéra tí kò péye sí ‘àwọn yòókù’ ní gbogbogbòò. Ṣíṣe ‘àwọn mìíràn’ ní kedere nínú àgbègbè àwọn ẹ̀yà ara ń mú comparative ἀτιμότερα hàn dáadáa.
