  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: ìyàtọ̀ sí ọ̀rọ̀ tó ṣáájú, Ọlọ́run gẹ́gẹ́ bí ẹni tí ó ń ṣe iṣẹ́ náà, àwọn ẹ̀yà ara lọ́kọ̀ọ̀kan, ipò wọn nínú ara, àti ìbámu iṣẹ́ náà pẹ̀lú ìfẹ́ rẹ̀. Síbẹ̀, “fi ... sí ipò wọn” túmọ̀ sí ìfihàn ipò tí kò hàn ní gbangba nínú ọ̀rọ̀ Gíríìkì, ó sì dà bíi pé ẹ̀yà kọ̀ọ̀kan ní ọ̀pọ̀ ipò. “ṣètò” jẹ́ ìtumọ̀ tó péye sí i ní àyíká àwòrán ara yìí.'
  naturalness: “Ṣùgbọ́n ní ti gidi” jẹ́ àsopọ̀ ìyàtọ̀ tó rọrùn, tó sì bá νυνὶ δὲ mu dáadáa. “Ọlọ́run ti ṣètò àwọn ẹ̀yà ara, ọ̀kọ̀ọ̀kan wọn, nínú ara” jẹ́ Yorùbá àpapọ̀ tó dáa, tí ó sì jẹ́ kí ìtẹnumọ́ pé a ṣètò ẹ̀yà kọ̀ọ̀kan hàn kedere. A yọ “gan-an,” nítorí “gẹ́gẹ́ bí” ti mú ìbámu καθὼς hàn tán.
