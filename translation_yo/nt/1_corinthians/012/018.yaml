  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: yo
  text: Ṣùgbọ́n ní ti gidi, Ọlọ́run ti ṣètò àwọn ẹ̀yà ara, ọ̀kọ̀ọ̀kan wọn, nínú ara[a], gẹ́gẹ́ bí ó ti fẹ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fi àwọn ẹ̀yà ara sí ipò” tàbí “gbé àwọn ẹ̀yà ara kalẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí ìfẹ́ rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ṣùgbọ́n bí ọ̀ràn ti rí
  rationale: Gbólóhùn yìí fi ìyàtọ̀ hàn sí àwọn àpẹẹrẹ àròsọ tó ṣáájú, ó sì dá ọ̀rọ̀ padà sí bí nǹkan ṣe rí ní tòótọ́; kò túmọ̀ sí àkókò ‘nísinsin yìí’ nìkan.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tààrà fún ẹni tó ṣe iṣẹ́ inú gbólóhùn náà.
- source_word: ἔθετο
  choice: fi ... sí ipò wọn
  rationale: Ó pa ìtumọ̀ fífi tàbí gbígbé ẹ̀yà kọ̀ọ̀kan sí ààyè rẹ̀ mọ́, ó sì bá àwòrán ara mu láì sọ pé ètò náà ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: τὰ μέλη
  choice: àwọn ẹ̀yà ara
  rationale: Ó ṣe kedere pé àwọn apá ara tó ń ṣiṣẹ́ pọ̀ nínú odindi ara ni Pọ́ọ̀lù ń sọ̀rọ̀ nípa wọn.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: ọ̀kọ̀ọ̀kan wọn
  rationale: Ó pa ìtẹnumọ́ Gíríìkì mọ́ pé gbogbo ẹ̀yà ni a gbé sí ipò tirẹ̀ lọ́kọ̀ọ̀kan.
- source_word: ἐν τῷ σώματι
  choice: nínú ara
  rationale: Ìtumọ̀ yìí rọrùn, ó sì pa àwòrán ara kan tí ó ní ọ̀pọ̀ ẹ̀yà mọ́.
- source_word: καθὼς ἠθέλησεν
  choice: gan-an gẹ́gẹ́ bí ó ti fẹ́
  rationale: Ó sọ pé fífi àwọn ẹ̀yà sí ipò jẹ́ ní ìbámu pẹ̀lú ìfẹ́ Ọlọ́run, ní èdè Yorùbá tó ṣe déédéé.
theological_decisions:
- issue: Ète Ọlọ́run nínú fífi ẹ̀yà kọ̀ọ̀kan sí ipò rẹ̀ nínú ara
  choice: Ọlọ́run fúnra rẹ̀ fi ẹ̀yà kọ̀ọ̀kan sí ipò rẹ̀ gẹ́gẹ́ bí ó ti fẹ́.
  alternative: Kí a sọ pé Ọlọ́run kàn gbé àwọn ẹ̀yà náà síbẹ̀ láì tẹnumọ́ ète tàbí ìfẹ́ rẹ̀.
  rationale: ἔθετο àti καθὼς ἠθέλησεν jọ fi hàn pé onírúurú ẹ̀yà ara kì í ṣe ohun tó ṣẹlẹ̀ lásán; ó bá ìfẹ́ Ọlọ́run mu. Ìtumọ̀ náà kò gbé ẹ̀kọ́ mìíràn wọ inú ẹsẹ yìí.
translation_notes:
  register: Èdè Yorùbá àpapọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere ni a lò. ‘Bí ọ̀ràn ti rí’ ń ṣiṣẹ́ gẹ́gẹ́ bí àsopọ̀ ìyàtọ̀, ‘àwọn ẹ̀yà ara’ sì yẹra fún ọ̀rọ̀ tó lè túmọ̀ sí ọwọ́ àti ẹsẹ̀ nìkan. Àwọn àmì ohùn ni a fi sí ibi tó yẹ.
