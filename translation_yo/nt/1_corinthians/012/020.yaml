id: 1CO.12.20
reference: 1 Corinthians 12:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νῦν δὲ πολλὰ ⸀μὲν μέλη, ἓν δὲ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/020.yaml
  text: But as it is[a], there are many parts, yet one body.
translation:
  language: yo
  text: Ṣùgbọ́n bí ó ti rí, ẹ̀yà ara pọ̀, ara kan ṣoṣo sì ni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν
  choice: bí ó ti rí
  rationale: Nínú ìjíròrò yìí, νῦν ń tọ́ka sí bí ọ̀ràn ṣe rí ní tòótọ́, kì í ṣe sí àkókò ‘nísinsìnyí’ lásán; ó sì dáhùn sí àròsọ ohun tí ó lè ṣẹlẹ̀ nínú ẹsẹ tó ṣáájú.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δὲ fi ìyàtọ̀ pẹ̀lẹ́ hàn láàárín òtítọ́ tó wà níbí àti àròsọ inú ẹsẹ tó ṣáájú.
- source_word: πολλὰ ... μέλη
  choice: ẹ̀yà ara pọ̀
  rationale: μέλη túmọ̀ sí àwọn ẹ̀yà ara nínú àkàwé ara; ‘ẹ̀yà ara’ jẹ́ èdè Yorùbá adayébá, ó sì pa àwòrán ara mọ́ láì sọ ọ́ di ọ̀rọ̀ ẹgbẹ́ tàbí ìjọ.
- source_word: μὲν ... δὲ
  choice: ẹ̀yà ara pọ̀, ara kan ṣoṣo sì ni
  rationale: Ìṣọ̀kan àwọn patikulu yìí fi ọ̀pọ̀ ẹ̀yà àti ara kan wé ara wọn; ìtumọ̀ yìí mú ìwọ̀ntúnwọ̀nsì àti ìyàtọ̀ náà jáde ní Yorùbá adayébá.
- source_word: ἓν
  choice: kan ṣoṣo
  rationale: ‘Kan ṣoṣo’ tẹnumọ́ ìṣọ̀kan ní ìtakò sí ọ̀pọ̀ ẹ̀yà.
- source_word: σῶμα
  choice: ara
  rationale: ‘Ara’ pa àwòrán gidi tí Pọ́ọ̀lù ń lò mọ́, ó sì lè ru ìtumọ̀ rẹ̀ nípa ìṣọ̀kan ìjọ nínú onírúurú.
theological_decisions:
- issue: Ìtumọ̀ μέλη nínú àkàwé ara
  choice: ẹ̀yà ara
  alternative: àwọn ọmọ ẹ̀yà
  rationale: ‘Ẹ̀yà ara’ sọ àwòrán anatómì náà di mímọ́ fún òǹkàwé Yorùbá, láì fi èrò ẹ̀kọ́ ìjọ kan kún un. Ní àyíká ọ̀rọ̀, àwọn ẹ̀yà ara náà ń ṣàpẹẹrẹ àwọn ènìyàn inú ìjọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘ẹ̀yà ara’ láti pa àkàwé anatómì mọ́; gbolohun náà tún pa ìtakò tó wà láàárín ọ̀pọ̀ àti ọ̀kan mọ́.
