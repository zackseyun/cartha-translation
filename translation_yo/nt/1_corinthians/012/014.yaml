  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ γὰρ τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/014.yaml
  text: For the body is not one member, but many.
translation:
  language: yo
  text: Nítorí ara kì í ṣe ẹ̀yà kan ṣoṣo, ṣùgbọ́n ọ̀pọ̀ ẹ̀yà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Nítorí
  rationale: Àpapọ̀ ọ̀rọ̀ yìí ń ṣàlàyé, ó sì so gbólóhùn náà mọ́ àríyànjiyàn tó ṣáájú. “Nítorí” fi ipa ìṣàlàyé náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: τὸ σῶμα
  choice: ara
  rationale: Èyí ni ìtumọ̀ tààrà fún ọ̀rọ̀ tó jẹ́ olùṣe nínú gbólóhùn náà. A pa àkàwé ara mọ́ láì túmọ̀ rẹ̀ sí ìjọ nínú ẹsẹ yìí.
- source_word: οὐκ ἔστιν
  choice: kì í ṣe
  rationale: Ọ̀nà yìí túmọ̀ àsopọ̀ ọ̀rọ̀ pẹ̀lú àìní tààrà, ó sì jẹ́ Yorùbá àdánidá fún òtítọ́ gbogbogbòò.
- source_word: ἓν μέλος
  choice: ẹ̀yà kan ṣoṣo
  rationale: “Ẹ̀yà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún apá ara kan, ó sì pa àwòrán ara mọ́. “Kan ṣoṣo” mú ìtẹnumọ́ ἓν hàn kedere.
- source_word: ἀλλὰ πολλά
  choice: bí kò ṣe ọ̀pọ̀ ẹ̀yà
  rationale: “Bí kò ṣe” fi ìyàtọ̀ ἀλλά hàn. A tún “ẹ̀yà” sọ nítorí pé fífi ọ̀rọ̀ náà sílẹ̀ lẹ́yìn “ọ̀pọ̀” kò ní ṣe kedere tó ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà wà ní àfiwé nínú Gíríìkì.
theological_decisions:
- issue: Ohun tí àkàwé “ara” ń tọ́ka sí
  choice: Pa “ara” mọ́ gẹ́gẹ́ bí àkàwé Pọ́ọ̀lù, láì fikún “ara Kristi” nínú ọ̀rọ̀ ẹsẹ náà.
  alternative: ara Kristi
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń sọ nípa ìjọ gẹ́gẹ́ bí ara Kristi, ẹsẹ yìí sọ “ara” nìkan. Fífi “Kristi” kún un yóò tú àlàyé àyíká ọ̀rọ̀ sínú ìtumọ̀ dípò títúmọ̀ àwọn ọ̀rọ̀ tó wà níbẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀yà” dípò ọ̀rọ̀ ìmọ̀ ẹ̀sìn kan, kí àwòrán ara lè dúró kedere.
