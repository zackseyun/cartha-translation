reference: 1 Corinthians 12:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: yo
  text: fún ẹlòmíràn, àwọn iṣẹ́ agbára[a]; fún ẹlòmíràn, àsọtẹ́lẹ̀; fún ẹlòmíràn, ìmòye àwọn ẹ̀mí; fún ẹlòmíràn, onírúurú èdè[b]; fún ẹlòmíràn, ìtumọ̀ àwọn èdè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn ìṣiṣẹ́ agbára,’ tàbí ‘àwọn iṣẹ́ ìyanu.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘onírúurú ahọ́n’ àti ‘ìtumọ̀ àwọn ahọ́n.’ Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘ahọ́n’ tàbí ‘èdè.’ A lò ‘èdè’ nítorí ó wọ́pọ̀ nínú àyíká ẹ̀bùn Ẹ̀mí ní Yorùbá, ṣùgbọ́n kò yanjú bóyá Pọ́ọ̀lù ń tọ́ka sí àwọn èdè ènìyàn tàbí irú ọ̀rọ̀ ẹ̀mí mìíràn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: àwọn iṣẹ́ agbára
  rationale: Ọ̀rọ̀ yìí ṣàfihàn àwọn iṣẹ́ tàbí àbájáde tí agbára ń mú wá. Gbólóhùn náà jẹ́ kíkà tó ṣeé yé, ó sì ṣì fi ìtumọ̀ ‘agbára’ àti ‘iṣẹ́ ìyanu’ sílẹ̀ láì fi tipátipá yan ọ̀kan.
- source_word: προφητεία
  choice: àsọtẹ́lẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ fún iṣẹ́ tàbí ọ̀rọ̀ wòlíì; kò fi ìtumọ̀ Gíríìkì náà mọ́ ohun kan tí óóró jù.
- source_word: διακρίσεις πνευμάτων
  choice: àwọn ìfòyemọ̀ àwọn ẹ̀mí
  rationale: ‘Àwọn ìfòyemọ̀’ pa ọ̀pọ̀ nọ́ńbà διακρίσεις mọ́, ó sì ń tọ́ka sí ríronú mọ̀ tàbí ṣe àyẹ̀wò orísun ẹ̀mí láì pinnu irú ẹ̀mí tí a ń sọ.
- source_word: γένη γλωσσῶν
  choice: onírúurú èdè
  rationale: ‘Onírúurú’ fi ìtumọ̀ γένη hàn ní èdè àdánidá. ‘Èdè’ ni ọ̀rọ̀ Yorùbá tó ṣeé lò fún èdè ènìyàn àti ohun tí a sábà ń pè ní sísọ̀rọ̀ ní èdè nínú àyíká ẹ̀bùn Ẹ̀mí.
- source_word: ἑρμηνεία γλωσσῶν
  choice: ìtumọ̀ àwọn èdè
  rationale: ‘Ìtumọ̀’ lè túmọ̀ sí mímú ọ̀rọ̀ yé ni èdè mìíràn tàbí ṣíṣe àlàyé rẹ̀, ó sì bá àìdánilójú inú ἑρμηνεία mu.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: fún ẹlòmíràn
  rationale: Àtúnsọ yìí fi bí a ṣe pín àwọn ẹ̀bùn fún onírúurú ènìyàn hàn. Kíkò tú ἑτέρῳ ní ọ̀nà tó yàtọ̀ kò sọ ìyàtọ̀ kan di pàtàkì ju bí àyíká ẹsẹ náà ṣe béèrè lọ.
theological_decisions:
- issue: Ìtumọ̀ δυνάμεων nínú àkójọ ẹ̀bùn Ẹ̀mí
  choice: A túmọ̀ rẹ̀ sí ‘agbára’ nínú ‘àwọn iṣẹ́ agbára,’ a sì fi ‘iṣẹ́ ìyanu’ sínú àlàyé ìsàlẹ̀.
  alternative: àwọn iṣẹ́ ìyanu; àwọn iṣẹ́ ńlá alágbára
  rationale: δυνάμεις lè tọ́ka sí iṣẹ́ ìyanu ní àyíká yìí, ṣùgbọ́n ìtumọ̀ gangan rẹ̀ ni ‘agbára.’ Yíyan ‘iṣẹ́ agbára’ pa ìsopọ̀ ọ̀rọ̀ náà mọ́, àlàyé ìsàlẹ̀ sì mú ohun tí ó ṣeé túmọ̀ sí nínú àyíká hàn.
- issue: Irú ohun tí γλωσσῶν ń tọ́ka sí
  choice: A lò ‘èdè,’ a kò sì pinnu bóyá ó jẹ́ èdè ènìyàn tí a mọ̀ tàbí ọ̀nà ọ̀rọ̀ ẹ̀mí mìíràn.
  alternative: ahọ́n; àwọn èdè ènìyàn
  rationale: Gíríìkì γλῶσσα lè túmọ̀ sí ahọ́n tàbí èdè. Àyíká ẹ̀bùn Ẹ̀mí ti fa onírúurú òye; ìtumọ̀ yìí kò yan èrò ẹ̀kọ́ ìgbàgbọ́ kan láìsí ìdí tó tó nínú ọ̀rọ̀ náà.
- issue: Ohun tí ‘àwọn ẹ̀mí’ nínú πνευμάτων ń tọ́ka sí
  choice: A fi ọ̀rọ̀ náà sílẹ̀ ní fífẹ̀ gẹ́gẹ́ bí ‘àwọn ẹ̀mí.’
  alternative: àwọn ọ̀rọ̀ tí ẹ̀mí mí sí; àwọn ẹ̀mí búburú; ẹ̀mí ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ pàtó bóyá àwọn ẹ̀mí rere, búburú, ti ènìyàn, tàbí orísun ẹ̀mí àwọn ọ̀rọ̀ ni. Ìtumọ̀ náà pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá àjùmọ̀lò tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Àtúnsọ ‘fún ẹlòmíràn’ pa ìrísí àkójọ Gíríìkì mọ́. ‘Ìfòyemọ̀’ jẹ́ ọ̀rọ̀ tí ó ṣeé yé fún ṣíṣe àyẹ̀wò tàbí mọ ìyàtọ̀, láì fi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
