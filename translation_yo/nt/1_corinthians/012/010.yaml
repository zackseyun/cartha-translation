  verdict: revise
  source_fidelity: Àwọn apá pàtàkì ẹsẹ náà wà nínú ìtumọ̀ náà, ó sì pa ìtòlẹ́sẹẹsẹ ìpínpín ‘fún ẹlòmíràn’ mọ́. Síbẹ̀, lílo ‘èdè’ gẹ́gẹ́ bí ọ̀rọ̀ ìtumọ̀ pàtó fún γλωσσῶν, nígbà tí àlàyé ìsàlẹ̀ sọ pé a kò pinnu ìtumọ̀ rẹ̀, kò pa àìdánilójú Gíríìkì náà mọ́ dáadáa. ‘Àwọn ìfòyemọ̀’ tún kéré sí ìṣe ìyàtọ̀/ìdánwò tí διακρίσεις ń tọ́ka sí ju ‘ìmòye’ lọ.
  naturalness: ‘Àwọn iṣẹ́ agbára,’ ‘àsọtẹ́lẹ̀,’ àti ìrísí àkójọ náà jẹ́ Yorùbá tí ó yéni. ‘Ìmòye àwọn ẹ̀mí’ jẹ́ ọ̀nà tó rọrùn, tó sì wọ́pọ̀ jù fún ìtumọ̀ ìṣàwárí tàbí ìdánwò àwọn ẹ̀mí. ‘Ahọ́n’ lè jẹ́ àjèjì níbi yìí bí kò bá ní àlàyé, nítorí náà a ṣàlàyé e nínú àlàyé ìsàlẹ̀ dípò kí a fi rọ́pò ọ̀rọ̀ àkọ́kọ́.
  terminology: A pa ‘àsọtẹ́lẹ̀,’ ‘ẹ̀mí,’ àti ‘ìtumọ̀’ mọ́. A ń lo ‘onírúurú èdè’ gẹ́gẹ́ bí ìfọ̀rọ̀wọ́pọ̀ Yorùbá tó wọ́pọ̀ nínú àyíká ẹ̀bùn Ẹ̀mí, ṣùgbọ́n àlàyé ìsàlẹ̀ tuntun sọ ní kedere pé èyí jẹ́ ìtumọ̀ àṣà-lílò, kì í sìí yanjú ìjiyàn bóyá γλῶσσα jẹ́ ahọ́n tàbí èdè.
