    rationale: Gíríìkì γλῶσσα lè túmọ̀ sí ahọ́n tàbí èdè, àti nínú àyíká yìí ìtọ́kasí rẹ̀ jẹ́ ohun tí a ń jiyàn lé lórí. Àlàyé náà gbọ́dọ̀ jẹ́ olóòtítọ́ nípa yíyan ọ̀rọ̀ Yorùbá náà, kí ó sì fi yíyan mìíràn àti àìdánilójú ìtumọ̀ hàn.
