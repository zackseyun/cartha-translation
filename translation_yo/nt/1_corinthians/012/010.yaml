  to: fún ẹlòmíràn, àwọn iṣẹ́ agbára[a]; fún ẹlòmíràn, àsọtẹ́lẹ̀; fún ẹlòmíràn, ìmòye àwọn ẹ̀mí; fún ẹlòmíràn, onírúurú èdè[b]; fún ẹlòmíràn, ìtumọ̀ àwọn èdè.
