    rationale: διακρίσεις jẹ́ ọ̀pọ̀ ìṣe ìdánwò, ìyàtọ̀, tàbí ìmòye. ‘Ìmòye’ jẹ́ ọ̀rọ̀ Yorùbá àjùmọ̀lò tó dára jù láì dín ohun tí ‘àwọn ẹ̀mí’ lè jẹ́ kù.
