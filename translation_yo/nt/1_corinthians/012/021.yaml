id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: yo
  text: Ṣùgbọ́n ojú kò lè sọ fún ọwọ́ pé, “Èmi kò nílò rẹ,” bẹ́ẹ̀ ni orí kò lè sọ fún àwọn ẹsẹ̀ pé, “Èmi kò nílò yín.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: kò lè
  rationale: Ó mú ìtumọ̀ àìlágbára tàbí àìṣíṣeéṣe jáde ní Yorùbá àdánidá, kì í ṣe pé ohun náà kò yẹ nìkan.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìtakora sí ọ̀rọ̀ tó ṣáájú hàn ní kedere.
- source_word: ὁ ὀφθαλμός
  choice: ojú
  rationale: Ó pa àwòrán àwọn ẹ̀yà ara tí Pọ́ọ̀lù ń lò mọ́.
- source_word: εἰπεῖν τῇ χειρί
  choice: sọ fún ọwọ́
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan bá ẹlòmíràn sọ̀rọ̀.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: Èmi kò nílò rẹ
  rationale: Ó túmọ̀ àìní ẹni náà ní ṣókí, láìfi ìtumọ̀ líle bí ‘mi ò rí àǹfààní rẹ’ kún un.
- source_word: ἢ πάλιν
  choice: tàbí kí ... pẹ̀lú
  rationale: Ó mú àpẹẹrẹ kejì tó jọ ti àkọ́kọ́ wọlé lọ́nà Yorùbá tó ṣàn.
- source_word: ἡ κεφαλή
  choice: orí
  rationale: Ó pa àwòrán ara mọ́ láìsí àlàyé ìtumọ̀ àpẹẹrẹ náà.
- source_word: τοῖς ποσίν
  choice: fún àwọn ẹsẹ̀
  rationale: ‘Àwọn’ fi ọ̀pọ̀ ẹsẹ̀ hàn gbangba, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe jẹ́ ọ̀pọ̀.
- source_word: ὑμῶν
  choice: yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ Yorùbá yìí pa ìyàtọ̀ láàárín rẹ (ẹyọ kan) àti yín (ọ̀pọ̀) mọ́ ní kedere.
theological_decisions:
- issue: Àwòrán ara gẹ́gẹ́ bí ìfihàn bí àwọn ọmọ ìjọ ṣe nílò ara wọn
  choice: Pa àwọn ẹ̀yà ara mọ́ gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe sọ
  alternative: Ṣàlàyé àwọn ẹ̀yà ara náà ní tààràtà gẹ́gẹ́ bí àwọn ọmọ ìjọ
  rationale: Kókó ẹ̀kọ́ Pọ́ọ̀lù wà nínú àwòrán ara náà; fífi àlàyé ìtumọ̀ rẹ̀ sínú ẹsẹ̀ yóò kọjá iṣẹ́ ìtumọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘rẹ’ fún ọwọ́ ẹyọ kan àti ‘yín’ fún àwọn ẹsẹ̀ ọ̀pọ̀, nítorí náà kò sí ìdí fún àlàyé ìsàlẹ̀ ojú ìwé bí ti Gẹ̀ẹ́sì.
