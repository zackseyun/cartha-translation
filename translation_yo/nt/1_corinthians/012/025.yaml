id: 1CO.12.25
reference: 1 Corinthians 12:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα μὴ ᾖ ⸀σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσι τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: yo
  text: kí ìyapa má bàa sí nínú ara,[a] ṣùgbọ́n kí àwọn ẹ̀yà ara máa ní ìbìkítà kan náà fún ara wọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìpínya” tàbí “yíya.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí yíya tàbí ìpínya; níhìn-ín, ó ń tọ́ka sí ìyapa nínú ara.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí àwọn ẹ̀yà ara máa bìkítà fún ara wọn dọ́gba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ ᾖ
  choice: kí ... má bàa sí
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti fi ìdí tàbí àbájáde tí a fẹ́ yẹra fún hàn.
- source_word: σχίσμα
  choice: ìyapa
  rationale: Ó túmọ̀ sí pínyà tàbí yíya sọ́tọ̀; “ìyapa” ṣe kedere nínú àkàwé ara àti nípa ìjọ láìfi ìtumọ̀ ẹ̀kọ́ ìjọ ti ìgbà tó tẹ̀ lé e kún un.
- source_word: σῶμα
  choice: ara
  rationale: Ó pa àkàwé ara mọ́ ní tààràtà, gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe wà nínú àyíká ẹsẹ̀ yìí.
- source_word: τὰ μέλη
  choice: àwọn ẹ̀yà ara
  rationale: Nínú Yorùbá, “àwọn ẹ̀yà ara” jẹ́ ọ̀nà tó ṣe kedere láti tọ́ka sí àwọn apá ara, ó sì tún pa àkàwé Pọ́ọ̀lù mọ́.
- source_word: τὸ αὐτό
  choice: ní ọ̀nà kan náà
  rationale: Gbólóhùn náà ń ṣàlàyé bí àwọn ẹ̀yà ara ṣe yẹ kí wọ́n bìkítà; ìtumọ̀ yìí pa èrò ìbìkítà tó dọ́gba tàbí tó jọra mọ́ láìfipá yan ọ̀kan ṣoṣo.
- source_word: ὑπὲρ ἀλλήλων
  choice: fún ara wọn
  rationale: Ó fi ìbìkítà tí olúkúlùkù ní sí ẹnì kejì hàn, kì í ṣe ìrọ́pò.
- source_word: μεριμνῶσι
  choice: máa bìkítà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà jẹ́ ìbìkítà rere fún ẹlòmíràn, kì í ṣe àníyàn búburú.
theological_decisions:
- issue: Ìtumọ̀ σχίσμα nínú àkàwé ìjọ gẹ́gẹ́ bí ara
  choice: ìyapa
  alternative: ìpínya; yíya
  rationale: “Ìyapa” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún pínyà láàárín ara kan, kò sì gbé ìtumọ̀ ọ̀rọ̀ amọ̀jùmọ̀ ẹ̀kọ́ ìjọ ti ìgbà tó tẹ̀ lé e wọ inú ẹsẹ̀ náà.
- issue: Bí a ṣe máa túmọ̀ τὸ αὐτό pẹ̀lú μεριμνῶσι
  choice: kí ... máa bìkítà ... ní ọ̀nà kan náà
  alternative: kí ... máa bìkítà fún ara wọn dọ́gba
  rationale: 'Èyí pa àìdánilójú díẹ̀ tó wà nínú Gíríìkì mọ́: ó lè tẹnumọ́ ìbìkítà kan náà tàbí ìbìkítà tó dọ́gba. A kò fi ọ̀rọ̀ “dọ́gba” sínú àkọ́kọ́ bí ẹni pé ìtumọ̀ yẹn nìkan ló ṣeé ṣe.'
translation_notes:
  register: Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ̀yà ara” dípò ọ̀rọ̀ tó lè dà bí àkọlé ọmọ ìjọ nìkan, kí àkàwé ara lè ṣe kedere. Àwọn àmì ohùn ni a fi sí gbogbo ibi tó yẹ.
