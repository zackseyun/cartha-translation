id: 1CO.12.4
reference: 1 Corinthians 12:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διαιρέσεις δὲ χαρισμάτων εἰσίν, τὸ δὲ αὐτὸ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: yo
  text: Oríṣiríṣi ẹ̀bùn[a] ni ó wà, ṣùgbọ́n Ẹ̀mí kan náà ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìpínpín ẹ̀bùn” tàbí “onírúurú ẹ̀bùn.” Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ ìyàtọ̀ tó wà láàárín àwọn ẹ̀bùn, kì í ṣe ìpínya nínú ìjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: Oríṣiríṣi
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí onírúurú tàbí ìyàtọ̀ láàárín àwọn ẹ̀bùn, kì í ṣe ìpínya nínú ìjọ. “Oríṣiríṣi” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi onírúurú hàn láìní ìtumọ̀ odi.
- source_word: δὲ ... δὲ
  choice: — ... ṣùgbọ́n
  rationale: A kò sọ δὲ àkọ́kọ́ ní ọ̀tọ̀ nítorí pé ó ń darí ọ̀rọ̀ sí kókó tuntun, èyí tí ìṣètò gbólóhùn Yorùbá ti fi hàn. A tú δὲ kejì sí “ṣùgbọ́n” láti pa ìyàtọ̀ láàárín onírúurú ẹ̀bùn àti Ẹ̀mí kan náà mọ́.
- source_word: χαρισμάτων
  choice: ẹ̀bùn
  rationale: “Ẹ̀bùn” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ohun tí a fi oore-ọ̀fẹ́ fúnni; ní àyíká yìí ó ń tọ́ka sí àwọn ẹ̀bùn tí Ẹ̀mí ń fúnni.
- source_word: τὸ ... αὐτὸ
  choice: kan náà
  rationale: “Kan náà” tẹnumọ́ pé Ẹ̀mí náà kò yàtọ̀, bí àwọn ẹ̀bùn tilẹ̀ ṣe oríṣiríṣi.
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Àyíká 1 Kọ́ríńtì 12:3–11 fi hàn pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; lílo lẹ́tà ńlá fún “Ẹ̀mí” jẹ́ kí ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ṣe kedere láìfi àlàyé kún ẹsẹ náà.
theological_decisions:
- issue: Ẹni tí πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí agbára tẹ̀mí kan
  rationale: Àwọn ẹsẹ tó yí i ká sọ pé Ẹ̀mí ni ó ń pín àwọn ẹ̀bùn fún àwọn onígbàgbọ́. “Ẹ̀mí” pẹ̀lú lẹ́tà ńlá bá ìtumọ̀ àyíká mu, láìtú “Mímọ́” sí i nínú ọ̀rọ̀ ẹsẹ náà.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìṣètò “Oríṣiríṣi ẹ̀bùn ni ó wà” jẹ́ àdánidá, ó sì pa ìfọwọ́sí orísun mọ́.
