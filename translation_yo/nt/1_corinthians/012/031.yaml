id: 1CO.12.31
reference: 1 Corinthians 12:31
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa fi ìtara fẹ́ àwọn ẹ̀bùn tí ó pọ̀ sí i.[a] Èmi yóò sì tún fi ọ̀nà kan tí ó tayọ gidigidi hàn yín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún ṣeé túmọ̀ sí, “Ṣùgbọ́n ẹ̀ ń fi ìtara fẹ́ àwọn ẹ̀bùn tí ó pọ̀ sí i.” Ìrísí ọ̀rọ̀ Gíríìkì ζηλοῦτε lè jẹ́ àṣẹ tàbí ọ̀rọ̀ ìròyìn níbí.
    reason: alternative_reading
  - marker: b
    text: Ìtumọ̀ tí a sábà máa ń lò ni, “ọ̀nà kan tí ó tayọ sí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: ẹ máa fi ìtara fẹ́
  rationale: Ọ̀rọ̀ náà ń sọ ìfẹ́ tí ó lágbára tàbí ìtara. Gbólóhùn àṣẹ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa okun ọ̀rọ̀ Gíríìkì mọ́.
- source_word: χαρίσματα
  choice: àwọn ẹ̀bùn
  rationale: “Ẹ̀bùn” túmọ̀ χάρισμα ní ṣókí; àyíká orí 12 ló mú kí ó ṣe kedere pé àwọn ẹ̀bùn tí Ẹ̀mí ń fúnni ni, láìfi ọ̀rọ̀ tí kò sí nínú gbólóhùn Gíríìkì kún un.
- source_word: μείζονα
  choice: tí ó tóbi jù
  rationale: Èyí pa ìfiwéra “greater” mọ́, láìsọ ní pàtó ohun tí ìtóbi náà dúró fún ju bí àyíká ṣe sọ lọ.
- source_word: καὶ ἔτι
  choice: Èmi yóò sì
  rationale: “Sì” so ọ̀rọ̀ náà mọ́ ohun tó ṣáájú, ìṣísẹ̀ sí ohun tí ó ju àwọn ẹ̀bùn lọ sì hàn nínú “tayọ rékọjá.”
- source_word: καθ’ ὑπερβολὴν
  choice: tí ó tayọ rékọjá
  rationale: Gbólóhùn yìí fi ìtayọ tí ó kọjá ìwọ̀n tàbí ohun mìíràn hàn, ó sì jẹ́ Yorùbá tó ṣe kedere ju ìtumọ̀ gígẹ́ ọ̀rọ̀ kọ̀ọ̀kan lọ.
- source_word: ὁδὸν
  choice: ọ̀nà kan
  rationale: “Ọ̀nà” pa àkàwé Gíríìkì mọ́ fún ìlànà ìgbésí ayé tàbí ìwà tí Pọ́ọ̀lù fẹ́ ṣàlàyé.
- source_word: δείκνυμι
  choice: Èmi yóò ... fi ... hàn yín
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì wà ní àkókò ìsinsìnyí, ìsọ̀rọ̀ ọjọ́ iwájú jẹ́ àdánidá ní Yorùbá nítorí Pọ́ọ̀lù ń tọ́ka sí àlàyé tí ó ń bẹ níwájú lẹ́sẹ̀kẹsẹ̀.
theological_decisions:
- issue: Agbára ζηλοῦτε
  choice: 'Àṣẹ: “ẹ máa fi ìtara fẹ́”'
  alternative: 'Ọ̀rọ̀ ìròyìn: “ẹ̀ ń fi ìtara fẹ́”'
  rationale: Ìrísí Gíríìkì náà lè jẹ́ àṣẹ tàbí ìròyìn. Àṣẹ bá ọ̀rọ̀ ìgbaniníyàn inú orí náà mu dáadáa, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́ kí a má bàa fi dájú ohun tí Gíríìkì kò mú dájú pátápátá.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo “yín” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn.
