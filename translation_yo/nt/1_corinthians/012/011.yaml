id: 1CO.12.11
reference: 1 Corinthians 12:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: yo
  text: Ṣùgbọ́n Ẹ̀mí kan náà[b] ni ó ń mú gbogbo nǹkan wọ̀nyí ṣẹlẹ̀[a]; ó ń pín wọn[c] fún ẹnì kọ̀ọ̀kan lọ́tọ̀ọ̀tọ̀, gẹ́gẹ́ bí ó ti fẹ́[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ó ń ṣe gbogbo nǹkan wọ̀nyí” tàbí “ó ń mú gbogbo nǹkan wọ̀nyí wá sí ìmúṣẹ.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “Ẹ̀mí kan náà gan-an”; èyí tẹnumọ́ pé orísun kan ṣoṣo ni gbogbo ẹ̀bùn oríṣiríṣi ti wá.
    reason: cross_reference
  - marker: c
    text: Tàbí “ó ń pín wọn fún ẹnì kọ̀ọ̀kan.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí “gẹ́gẹ́ bí ó ti yàn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífẹ́, yíyan, tàbí níní ìfẹ́-ọkàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Ṣùgbọ́n ... gbogbo nǹkan wọ̀nyí
  rationale: “Gbogbo nǹkan wọ̀nyí” pa ìtẹnumọ́ pé gbogbo àwọn ìfarahàn tí a ṣẹ̀ṣẹ̀ tò lẹ́sẹẹsẹ mọ́. “Ṣùgbọ́n” fi ìyípadà kékeré hàn láti orí onírúurú ẹ̀bùn sí orísun kan ṣoṣo wọn.
- source_word: ἐνεργεῖ
  choice: ni ó ń mú ... ṣẹlẹ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí iṣẹ́ alágbára tí ó ń mú ohun kan wá tàbí tí ó ń mú un ṣẹ. Gbólóhùn Yorùbá yìí ṣe kedere pé Ẹ̀mí ni olùṣe, láìṣàlàyé ọ̀nà iṣẹ́ náà ju ohun tí Gíríìkì sọ lọ.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: Ẹ̀mí kan náà
  rationale: “Kan náà” jẹ́ ọ̀nà Yorùbá àdánidá láti tẹnumọ́ pé Ẹ̀mí kan ṣoṣo, Ẹ̀mí náà gan-an, ni orísun gbogbo ẹ̀bùn oríṣiríṣi. A kọ “Ẹ̀mí” pẹ̀lú lẹ́tà ńlá nítorí àyíká ọ̀rọ̀ ń tọ́ka sí Ẹ̀mí Mímọ́.
- source_word: διαιροῦν
  choice: ó ń pín wọn
  rationale: 'Ọ̀rọ̀ aláìlẹ́mìí náà ṣàlàyé bí Ẹ̀mí ṣe ń ṣiṣẹ́: ó ń pín àwọn ẹ̀bùn náà. “Wọn” jẹ́ ohun tí àyíká ọ̀rọ̀ mú kedere, ó sì jẹ́ kí Yorùbá dùn mọ́ etí láìfi èrò ìpínyà búburú sínú ọ̀rọ̀ náà.'
- source_word: ἰδίᾳ ἑκάστῳ
  choice: fún ẹnì kọ̀ọ̀kan lọ́tọ̀ọ̀tọ̀
  rationale: 'Gbólóhùn yìí pa ìtumọ̀ aláṣàtọ̀ ti ἑκάστῳ àti ìtẹnumọ́ ἰδίᾳ mọ́: ẹnì kọ̀ọ̀kan ni ó ń gba ìpín tirẹ̀.'
- source_word: καθὼς βούλεται
  choice: gẹ́gẹ́ bí ó ti fẹ́
  rationale: Èyí pa ìfẹ́, ìpinnu, àti aṣàyàn ẹni tí ń ṣe iṣẹ́ náà mọ́. Arọ́pò-orúkọ Yorùbá “ó” kò fi akọ tàbí abo hàn, ṣùgbọ́n gbólóhùn náà ṣì fi Ẹ̀mí hàn gẹ́gẹ́ bí ẹni tí ó ní ìfẹ́ àti ìpinnu.
theological_decisions:
- issue: Ẹni tí πνεῦμα àti βούλεται ń tọ́ka sí, àti jíjẹ́ ẹni gidi ti Ẹ̀mí
  choice: “Ẹ̀mí” ń tọ́ka sí Ẹ̀mí Mímọ́; “gẹ́gẹ́ bí ó ti fẹ́” fi hàn pé Ẹ̀mí fúnra rẹ̀ ní ìfẹ́ àti ìpinnu.
  alternative: A lè fi ọ̀rọ̀ náà sílẹ̀ láìsọ ẹni tí ó fẹ́, bíi “gẹ́gẹ́ bí a ti pinnu rẹ̀,” tàbí ka πνεῦμα sí agbára aláìlẹ́ni.
  rationale: Bí ó tilẹ̀ jẹ́ pé πνεῦμα jẹ́ ọ̀rọ̀ akọ-nlá-àárín ní gírámà Gíríìkì, βούλεται sọ ìfẹ́ àti ìpinnu di ti Ẹ̀mí. Yorùbá kò nílò láti pinnu akọ tàbí abo nínú “ó,” nítorí náà ó lè pa jíjẹ́ ẹni gidi àti aṣojú olùṣe ti Ẹ̀mí mọ́ láìgbé àríyànjiyàn orí akọ tàbí abo wọ inú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá ìlò àdánidá mu. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìtẹnumọ́ orísun kan ṣoṣo àti ìpín ẹnì kọ̀ọ̀kan mọ́.
