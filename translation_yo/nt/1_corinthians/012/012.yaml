id: 1CO.12.12
reference: 1 Corinthians 12:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí ara ṣe jẹ́ ọ̀kan, tí ó sì ní ọ̀pọ̀ ẹ̀yà, tí gbogbo àwọn ẹ̀yà ara náà, bí wọ́n tilẹ̀ pọ̀, jẹ́ ara kan, bẹ́ẹ̀ náà ni Mèsáyà[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tó túmọ̀ sí ẹni tí a fi òróró yàn; a lo “Mèsáyà” níbí láti pa ìtumọ̀ oyè náà mọ́.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Pọ́ọ̀lù ní tààrà ni, “bẹ́ẹ̀ náà ni Mèsáyà.” Ó jẹ́ ọ̀rọ̀ kúkúrú tó kún fún ìtumọ̀, èyí tí àwọn ẹsẹ tó tẹ̀ lé ṣàlàyé nípa bí ọ̀pọ̀ ẹ̀yà ṣe parapọ̀ di ara kan.
    reason: cross_reference
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: “Nítorí” mú ipa ìṣàlàyé γάρ jáde, “gẹ́gẹ́ bí” sì pa ìfiwéra tí καθάπερ ń ṣe mọ́.
- source_word: σῶμα
  choice: ara
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ara, ó sì pa àkàwé ara ènìyàn mọ́ ní kedere.
- source_word: ἕν
  choice: ọ̀kan / kan
  rationale: “Ọ̀kan” tẹnu mọ́ ìṣọ̀kan ara; “kan” jẹ́ ìṣọ̀kan ọ̀rọ̀ Yorùbá tó bá “ara” mu nínú gbólóhùn àsọtẹ́lẹ̀ “ara kan.”
- source_word: μέλη
  choice: ẹ̀yà
  rationale: “Ẹ̀yà” túmọ̀ sí àwọn apá tó parapọ̀ di ara kan, ó sì bá àkàwé Pọ́ọ̀lù mu láìfi ìtumọ̀ ẹgbẹ́ tàbí ọmọ ẹgbẹ́ kún un.
- source_word: πολλὰ ὄντα
  choice: bí wọ́n tilẹ̀ pọ̀
  rationale: 'Èyí fi ipa ìyọ̀ǹda participle náà hàn lọ́nà Yorùbá àdánidá: bí ó tilẹ̀ jẹ́ pé àwọn ẹ̀yà náà pọ̀.'
- source_word: οὕτως καὶ
  choice: bẹ́ẹ̀ náà ni
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti parí ìfiwéra náà pẹ̀lú ìtumọ̀ “bẹ́ẹ̀ náà.”
- source_word: ὁ Χριστός
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè fún ẹni àmì òróró; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́ dípò kí a mú un bí orúkọ lásán.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn ẹ̀kọ́ ìgbàgbọ́ yìí, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè. “Mèsáyà” mú ìtumọ̀ ẹni àmì òróró náà hàn; àkọ́lé ìsàlẹ̀ ṣàfihàn “Kristi” gẹ́gẹ́ bí ọ̀nà mìíràn.
- issue: Ìtumọ̀ gbólóhùn οὕτως καὶ ὁ Χριστός
  choice: 'Pa ọ̀rọ̀ kúkúrú tó yani lẹ́nu náà mọ́: “bẹ́ẹ̀ náà ni Mèsáyà.”'
  alternative: “bẹ́ẹ̀ náà ni ara Mèsáyà” tàbí “bẹ́ẹ̀ náà ni ìjọ”
  rationale: Gíríìkì kò sọ “ara Mèsáyà” tàbí “ìjọ” ní tààrà. Fífi èyíkéyìí kún un yóò tú ìtumọ̀ tí àwọn ẹsẹ tó tẹ̀ lé ń ṣàlàyé sínú ẹsẹ yìí, tí yóò sì mú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ rọrùn ju bí orísun ṣe sọ ọ́ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. “Ẹ̀yà ara” jẹ́ ọ̀rọ̀ tí òǹkàwé lásán lè lóye, ó sì yàgò fún ìtumọ̀ ìṣètò tí “ọmọ ẹgbẹ́” lè mú wá. A kò fi “ara Mèsáyà” tàbí “ìjọ” kún ọ̀rọ̀ orísun.
