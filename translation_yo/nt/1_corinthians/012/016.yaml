id: 1CO.12.16
reference: 1 Corinthians 12:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: yo
  text: Bí etí bá sì sọ pé, “Nítorí èmi kì í ṣe ojú, èmi kì í ṣe apá kan nínú ara,” kì í ṣe nítorí èyí ni etí náà kò fi jẹ́ apá kan nínú ara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà Yorùbá tí ó rọrùn sí i: “Èyí kò mú kí etí náà má ṣe jẹ́ apá kan nínú ara.” Ọ̀rọ̀ Gíríìkì tún gbolohun náà, “apá kan nínú ara,” ṣe láti tẹnu mọ́ ọn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Àti
  rationale: Ó so àpẹẹrẹ etí yìí mọ́ àpẹẹrẹ ẹsẹ̀ tí ó ṣáájú, bí ìsopọ̀ ọ̀rọ̀ Gíríìkì ṣe rí.
- source_word: ἐὰν εἴπῃ
  choice: bí ... bá sọ
  rationale: Ìṣètò ‘bí ... bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìpèníjà àròsọ tí ἐὰν pẹ̀lú subjunctive ń gbé kalẹ̀ hàn.
- source_word: τὸ οὖς
  choice: etí
  rationale: Ọ̀rọ̀ ara gidi ni, tí Pọ́ọ̀lù sọ di ẹni bí ẹni pé ó lè sọ̀rọ̀.
- source_word: Ὅτι
  choice: Nítorí
  rationale: Ó mú ìdí tí etí fi ń pe ara rẹ̀ ní ẹni tí kò jẹ́ ti ara jáde, kì í ṣe àmì àyọlò lasán.
- source_word: ὀφθαλμός
  choice: ojú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá àdánidá fún ẹ̀yà ara tí a fi ń ríran.
- source_word: ἐκ τοῦ σώματος
  choice: ara kan lára ẹ̀yà ara
  rationale: Nínú àfiwé yìí, ἐκ τοῦ σώματος túmọ̀ sí jíjẹ́ apá kan ara; ìtumọ̀ yìí ṣe kedere ní Yorùbá, a sì tún un ṣe ní ibi méjèèjì láti pa ìtẹnumọ́ Gíríìkì mọ́.
- source_word: οὐ παρὰ τοῦτο
  choice: kì í ṣe nítorí èyí
  rationale: Ó kọ ìparí èrò etí sílẹ̀ lórí ìdí tí etí fún un.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: ni kò fi jẹ́ ara kan lára ẹ̀yà ara
  rationale: Àkójọpọ̀ ‘kì í ṣe ... ni kò fi’ pa ìkọ̀ méjì àti ìdáhùn àríyànjiyàn inú Gíríìkì mọ́ ní Yorùbá tí ó ṣeé lóye.
theological_decisions:
- issue: Bí a ṣe máa mú àfiwé ara Pọ́ọ̀lù rọrùn láì fi ìtumọ̀ ẹ̀kọ́ ìjọ kún un
  choice: A sọ jíjẹ́ ‘apá kan ara’ ní ọ̀nà Yorùbá àdánidá, a sì pa àtúnṣe gbolohun náà àti ìkọ̀ méjì mọ́.
  alternative: ‘Èyí kò lè mú kí ó má ṣe jẹ́ apá kan ara mọ́,’ èyí tí ó rọrùn sí i ṣùgbọ́n tí ó dín ìṣètò àríyànjiyàn orísun kù.
  rationale: Ẹsẹ náà ń fi jíjẹ́ ti ara hàn nípasẹ̀ àfiwé, kì í sì í ṣàlàyé gbogbo ẹ̀kọ́ nípa ìjọ. Ìtumọ̀ náà kò fi ọ̀rọ̀ ẹ̀kọ́ ìsìn tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: Yorùbá àkọ́ṣe, ọlọ́lá, tí àwọn òǹkàwé òde òní lè lóye. A lo ‘ẹ̀yà ara’ fún body-part àti ‘ara’ fún body, pẹ̀lú àtúnṣe gbolohun láti fara mọ́ ìtẹnumọ́ orísun.
