  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ‘oríṣiríṣi,’ ‘iṣẹ́ ìránṣẹ́,’ àti ‘Olúwa kan náà’ dáadáa. Ṣùgbọ́n ‘ṣùgbọ́n’ jẹ́ asopò ìlòdì síra, nígbà tí καὶ jẹ́ asopò ìfikún nínú ìtẹ̀lé ìṣọ̀kan ti ẹsẹ 4–6. ‘Ń bẹ’ tún lè fi abala ìlọsíwájú kún un níbi tí ọrọ̀ Gíríìkì ti kan ń sọ pé àwọn nǹkan wọ̀nyí wà.
  naturalness: ‘Oríṣiríṣi iṣẹ́ ìránṣẹ́ sì wà, Olúwa kan náà sì ni’ jẹ́ Yorùbá ìgbàlódé, tó mọ́gbọ́n dání, ó sì pa ìrísí tó jọra ti gbólóhùn méjèèjì mọ́.
  terminology: ‘Iṣẹ́ ìránṣẹ́’ jẹ́ ìtumọ̀ tó yẹ fún διακονιῶν nínú àyíká yìí, láì dín un kù sí ipò ṣọ́ọ̀ṣì. ‘Olúwa’ pa κύριος mọ́ gẹ́gẹ́ bí oyè, láì ṣàlàyé ẹni tí Pọ́ọ̀lù kò darúkọ nínú ẹsẹ náà.
