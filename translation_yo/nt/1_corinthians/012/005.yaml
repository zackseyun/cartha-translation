id: 1CO.12.5
reference: 1 Corinthians 12:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ διαιρέσεις διακονιῶν εἰσιν, καὶ ὁ αὐτὸς κύριος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/005.yaml
  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: yo
  text: Oríṣiríṣi iṣẹ́ ìránṣẹ́[a] sì wà, Olúwa kan náà sì ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “iṣẹ́ sísìn” tàbí “ọ̀nà iṣẹ́ ìránṣẹ́.”
    reason: Àṣàyàn ìtumọ̀ fún διακονιῶν; ó bá àmì àlàyé Gẹ̀ẹ́sì mu.
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: “Sì” so ẹsẹ yìí mọ́ àwọn gbólóhùn tó jọ ọ́ ní ẹsẹ 4–6, ó sì jẹ́ ọ̀nà àdánidá láti fi ìfikún hàn ní Yorùbá.
- source_word: διαιρέσεις
  choice: oríṣiríṣi
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí onírúurú irú, kì í ṣe ìyapa tàbí ìjà ẹgbẹ́; “oríṣiríṣi” fi ìyàtọ̀ inú ìṣọ̀kan hàn ní kedere.
- source_word: διακονιῶν
  choice: iṣẹ́ ìránṣẹ́
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí iṣẹ́ sísìn tàbí iṣẹ́ ìránṣẹ́. “Iṣẹ́ ìránṣẹ́” bá àyíká iṣẹ́ tí a ń ṣe láti sin Ọlọ́run àti àwọn ẹlòmíràn mu, kò sì fi hàn dandan pé ó jẹ́ ipò àṣẹ kan.
- source_word: εἰσιν
  choice: ń bẹ
  rationale: '“Ń bẹ” jẹ́ ìtumọ̀ Yorùbá àdánidá fún gbólóhùn wíwà níbí: àwọn onírúurú iṣẹ́ ìránṣẹ́ wà.'
- source_word: ὁ αὐτὸς
  choice: kan náà
  rationale: “Kan náà” pa ìtẹnumọ́ ìṣọ̀kan mọ́ láàárín àwọn iṣẹ́ ìránṣẹ́ tó yàtọ̀, ó sì bá àtúnsọ inú ẹsẹ 4–6 mu.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” pa oyè náà àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́, láì ṣe àlàyé ẹni tí ọ̀rọ̀ náà ń tọ́ka sí nínú ara ẹsẹ.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí nínú ìṣètò mẹ́ta ti 1 Kọ́ríńtì 12:4–6
  choice: A fi “Olúwa” sílẹ̀ gẹ́gẹ́ bí oyè, láì fi orúkọ ẹni náà kún un.
  alternative: Kí a ṣàlàyé rẹ̀ ní tààrà pé “Jésù Olúwa” tàbí kí a ka a sí ìtọ́ka gbogbogbò sí Ọlọ́run.
  rationale: Àyíká náà ní àtẹ̀lé Ẹ̀mí kan náà, Olúwa kan náà, àti Ọlọ́run kan náà. Ó ṣeé ṣe jù pé “Olúwa” ń tọ́ka sí Jésù Kristi, ṣùgbọ́n fífi oyè náà nìkan sílẹ̀ pa ọ̀rọ̀ Pọ́ọ̀lù àti ìwọ̀n àìdájú tó wà nínú rẹ̀ mọ́.
translation_notes:
  register: Yorùbá àṣàdédé, ọlọ́lá, tó sì yé òǹkàwé òde òní. “Iṣẹ́ ìránṣẹ́” jẹ́ kedere ju ọ̀rọ̀ awin bí “minisítrì” lọ, ó sì yẹra fún ìtumọ̀ pé ipò ṣọ́ọ̀ṣì pàtó ni gbogbo διακονίαι.
