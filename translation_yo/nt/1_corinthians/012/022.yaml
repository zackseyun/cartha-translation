  text: ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/022.yaml
  text: On the contrary[a], the parts of the body that seem to be weaker are necessary[c][b],
translation:
  language: yo
  text: Kàkà bẹ́ẹ̀, àwọn ẹ̀yà ara tí ó dà bí ẹni pé wọ́n jẹ́ aláìlera ju àwọn mìíràn lọ ṣe pàtàkì jù lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n, jù bẹ́ẹ̀ lọ, àwọn ẹ̀yà ara tí ó dà bí ẹni pé wọ́n jẹ́ aláìlera ju àwọn mìíràn lọ jẹ́ ohun tí a kò lè ṣe aláìní.” Ọ̀rọ̀ Gíríìkì náà ní ìtẹnumọ́ tó túmọ̀ sí “jù lọ” tàbí “ní ìwọ̀n púpọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ πολλῷ μᾶλλον
  choice: Kàkà bẹ́ẹ̀ ... ni
  rationale: Ó fi ìtakora tó lágbára hàn, ó sì mú agbára ọ̀rọ̀ ‘jù bẹ́ẹ̀ lọ’ wọ inú ìtẹnumọ́ Yorùbá lọ́nà àdánidá.
- source_word: τὰ δοκοῦντα
  choice: tí ó dà bí ẹni pé
  rationale: Ó tọ́ka sí bí àwọn ẹ̀yà náà ṣe farahàn tàbí bí a ṣe ń wò wọ́n, kì í ṣe pé wọ́n jẹ́ bẹ́ẹ̀ ní ti gidi.
- source_word: μέλη τοῦ σώματος
  choice: àwọn ẹ̀yà ara
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwọn apá ara, ó sì pa àwòrán ara tí Pọ́ọ̀lù lò mọ́.
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: wọ́n jẹ́ aláìlera jù
  rationale: Ó pa ìfiwéra inú ἀσθενέστερα mọ́, ó sì so mọ́ ohun tí ó dà bí ẹni pé ó rí bẹ́ẹ̀.
- source_word: ἀναγκαῖά ἐστιν
  choice: a kò lè ṣe aláìní wọn
  rationale: Ọ̀nà Yorùbá yìí fi hàn pé àwọn ẹ̀yà náà ṣe pàtàkì débi pé a kò lè yọ wọ́n sílẹ̀; ó bá agbára ‘necessary/indispensable’ mu.
theological_decisions:
- issue: Agbára àpẹẹrẹ ara nínú ọ̀rọ̀ nípa ìjọ
  choice: Pa àpẹẹrẹ gidi ti àwọn ẹ̀yà ara mọ́ láì túmọ̀ ọ́ tààrà sí àwọn ọmọ ìjọ.
  alternative: Lílo ọ̀rọ̀ tó ṣàlàyé pé àwọn ‘ẹ̀yà’ náà ni àwọn ọmọ ìjọ.
  rationale: Àyíká ọ̀rọ̀ fi àpẹẹrẹ náà kan ìjọ, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ ń sọ̀rọ̀ nípa àwọn ẹ̀yà ara; fífi àpẹẹrẹ náà sílẹ̀ ń yẹra fún àlàyé tó kọjá ohun tí orísun sọ.
translation_notes:
  register: Yorùbá boṣewa, tó ní ọ̀wọ̀, tó sì ṣe kedere fún òǹkàwé òde òní. ‘Àwọn ẹ̀yà ara’ jẹ́ àdánidá ju ‘àwọn ọmọ ara’ lọ; ‘a kò lè ṣe aláìní wọn’ fi agbára ἀναγκαῖα hàn ní ṣókí.
