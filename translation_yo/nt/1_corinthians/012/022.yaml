  source_fidelity: Àkọ́kọ́ ọ̀rọ̀ náà ń pa àwòrán ‘ẹ̀yà ara’ àti ìrísí tí a ń fi ojú wò wọn mọ́ dáadáa. Ṣùgbọ́n ìtẹnumọ́ πολλῷ μᾶλλον kò hàn nínú ọ̀rọ̀ àkọ́kọ́, àti ‘aláìlera jù’ nílò ohun tí a fi ń fiwéra rẹ̀ kí ìfiwéra ἀσθενέστερα lè péye.
  naturalness: ‘Àwọn ẹ̀yà ara’ àti ‘tí ó dà bí ẹni pé’ jẹ́ Yorùbá boṣewa, ó sì dára. ‘Wọ́n jẹ́ aláìlera ju àwọn mìíràn lọ’ jẹ́ kedere, ó sì ṣàn dáadáa ju ‘wọ́n jẹ́ aláìlera jù’ lọ. ‘Ṣe pàtàkì jù lọ’ jẹ́ ọ̀nà àdánidá láti fi ìdí pàtàkì/ìjẹ́-àìní-hàn hàn nínú àyíká yìí.
  terminology: ‘Ẹ̀yà ara’ yẹ fún μέλη τοῦ σώματος; kò yẹ kí a yí i padà sí àwọn ọmọ ìjọ nínú ẹsẹ yìí. ‘Ṣe pàtàkì’ ń mú ἀναγκαῖα hàn ní ìforígbárí, láì fi ìtumọ̀ ẹ̀kọ́ ìjọsìn kún un.
