source:
  edition: SBLGNT
  text: Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ καὶ μέλη ἐκ μέρους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/027.yaml
  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: yo
  text: Ẹ̀yin sì ni ara Mèsáyà, ẹnì kọ̀ọ̀kan yín sì jẹ́ ẹ̀yà ara.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ara Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός lè túmọ̀ sí “Mèsáyà” tàbí “Kristi”; níbí a túmọ̀ rẹ̀ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
  - marker: b
    text: Ní tààràtà, “ẹ̀yà ara láti apá kan,” tàbí “ẹ̀yà ara ní ti olúkúlùkù.” Ìtumọ̀ rẹ̀ ni pé ẹnì kọ̀ọ̀kan yín jẹ́ ẹ̀yà ara kan nínú gbogbo ara náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ẹni kejì ọ̀pọ̀ yìí jẹ́ mímú jáde fún ìtẹnumọ́; “ẹ̀yin” fi hàn pé gbogbo àwọn ará Kọ́ríńtì ni a ń bá sọ.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: δέ ṣe àṣàròyé kúrò nínú àpẹẹrẹ ara tí a ṣẹ̀ṣẹ̀ ṣàlàyé sí lílo rẹ̀ mọ́ àwọn olùgbọ́. “Ṣùgbọ́n” jẹ́ àsopọ̀ Yorùbá tó bójú mu, bí ó tilẹ̀ jẹ́ pé ìtakora rẹ̀ kò lágbára níbí.
- source_word: σῶμα Χριστοῦ
  choice: ara Mèsáyà
  rationale: Gbólóhùn náà dá àwọn onígbàgbọ́ mọ̀ gẹ́gẹ́ bí ara Mèsáyà; èyí pa àwòrán ara àti ìtumọ̀ oyè Χριστός mọ́.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí Ọlọ́run yàn, nítorí náà “Mèsáyà” ni a lò; “Kristi” jẹ́ ìtumọ̀ míì tí ó wọ́pọ̀.
- source_word: μέλη
  choice: ẹ̀yà ara
  rationale: Nínú àpẹẹrẹ ara, μέλη túmọ̀ sí àwọn apá tàbí ẹ̀yà tí ara kan ní. “Ẹ̀yà ara” jẹ́ kedere, ó sì pa àwòrán ara mọ́ láìdà á pọ̀ mọ́ ‘ọmọ ẹgbẹ́’.
- source_word: ἐκ μέρους
  choice: ẹnì kọ̀ọ̀kan yín
  rationale: 'Ní àyíká ọ̀rọ̀ yìí, gbólóhùn náà ń pín ìtumọ̀ náà fún olúkúlùkù: gbogbo wọn papọ̀ jẹ́ ara, ṣùgbọ́n ẹnì kọ̀ọ̀kan jẹ́ ẹ̀yà ara. Ìtumọ̀ yìí yẹra fún òye pé wọn jẹ́ ara náà ní apá kan ṣoṣo.'
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú ọ̀rọ̀ Pọ́ọ̀lù nípa ìjọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí. “Mèsáyà” mú ìtumọ̀ oyè náà jáde, láìyí ẹ̀kọ́ pé àwọn onígbàgbọ́ papọ̀ jẹ́ ara rẹ̀ padà.
- issue: Ìtumọ̀ ἐκ μέρους nínú καὶ μέλη ἐκ μέρους
  choice: ẹnì kọ̀ọ̀kan yín sì jẹ́ ẹ̀yà ara náà
  alternative: ẹ̀yin sì jẹ́ ẹ̀yà ara ní ọ̀kọ̀ọ̀kan
  rationale: Ìtumọ̀ píndarí yìí pa ìwọ̀ntúnwọ̀nsì Pọ́ọ̀lù mọ́ láàárín ìṣọ̀kan gbogbo ara àti ipa olúkúlùkù. Fífi “ara náà” kún un mú ohun tí gíríìkì fi sílẹ̀ láti lóye nínú àyíká ọ̀rọ̀ hàn ní Yorùbá, láìfi ẹ̀kọ́ tuntun kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́lá tó ṣe kedere fún òǹkàwé òde òní. A lò “ẹ̀yà ara” dípò “ọmọ ẹgbẹ́” láti pa àpẹẹrẹ ara mọ́. Àsopọ̀ δέ ni a fi “Ṣùgbọ́n” hàn gẹ́gẹ́ bí ìyípadà ọ̀rọ̀ onírẹ̀lẹ̀, kì í ṣe ìtakora líle.
