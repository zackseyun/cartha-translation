  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ἦν τὰ πάντα ἓν μέλος, ποῦ τὸ σῶμα;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/019.yaml
  text: If all were one member, where would the body be?
translation:
  language: yo
  text: Bí gbogbo wọn bá jẹ́ ẹ̀yà ara kan ṣoṣo, níbo ni ara náà ì bá wà?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: Bí ... bá
  rationale: Ó ṣe àfihàn gbólóhùn àdéhùn àròsọ; ìṣètò ‘Bí ... bá’ jẹ́ ọ̀nà àdéhùn tí ó bá Yorùbá mu.
- source_word: δὲ
  choice: —
  rationale: Níhìn-ín, δέ jẹ́ àsopọ̀ pẹ̀lẹ́pẹ̀lẹ́ nínú ìjiyàn; Yorùbá lè sọ ìtumọ̀ náà lọ́nà àdánidá láìfi àsopọ̀ hàn gbangba.
- source_word: ἦν
  choice: jẹ́
  rationale: Nínú àdéhùn àròsọ yìí, ‘bá jẹ́’ mú ipò àròsọ tí ọ̀rọ̀-ìṣe aláìpé Gíríìkì náà ń fi hàn jáde lọ́nà Yorùbá.
- source_word: τὰ πάντα
  choice: gbogbo wọn
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbogbo àwọn ẹ̀yà ara tí a ti ń sọ̀rọ̀ nípa wọn, kì í ṣe ‘ohun gbogbo’ lápapọ̀.
- source_word: ἓν
  choice: kan ṣoṣo
  rationale: Ó tẹnu mọ́ pé gbogbo àwọn ẹ̀yà náà di ẹ̀yà kan péré.
- source_word: μέλος
  choice: ẹ̀yà ara
  rationale: ‘Ẹ̀yà ara’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún apá kan nínú ara, ó sì pa àkàwé Pọ́ọ̀lù mọ́.
- source_word: ποῦ
  choice: ì bá wà níbo?
  rationale: Ìbéèrè àsọyé yìí béèrè ohun tí yóò ṣẹlẹ̀ sí wíwà ara náà nínú ipò àròsọ; ‘ì bá wà níbo?’ jẹ́ àdánidá ní Yorùbá.
- source_word: τὸ σῶμα
  choice: ara náà
  rationale: Atọ́ka ‘náà’ fi hàn pé ara tí àkàwé náà ń tọ́ka sí ni, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kún un.
theological_decisions:
- issue: Ìwọ̀n àkàwé ara
  choice: A túmọ̀ ẹsẹ náà gẹ́gẹ́ bí ìbéèrè àsọyé tó fi hàn pé onírúurú ẹ̀yà ṣe pàtàkì nínú ara kan, láìsọ ní pàtó pé ‘ara Kristi.’
  alternative: Kí a túmọ̀ ọ́ ní ṣíṣe àlàyé sí i gẹ́gẹ́ bí ‘ara Kristi.’
  rationale: Bí ó tilẹ̀ jẹ́ pé àyíká ẹsẹ náà ń sọ nípa ìjọ gẹ́gẹ́ bí ara Kristi, ẹsẹ yìí fúnra rẹ̀ sọ ‘ara’ nìkan. Ìtumọ̀ náà pa àkàwé àti ìwọ̀n ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé láti lóye. ‘Ẹ̀yà ara’ jẹ́ kedere ju ‘ẹ̀yà’ nìkan lọ, ‘kan ṣoṣo’ sì mú ìtẹnumọ́ ἓν hàn.
