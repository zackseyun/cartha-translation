id: 1CO.12.3
reference: 1 Corinthians 12:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: yo
  text: Nítorí náà, mo jẹ́ kí ẹ mọ̀ pé kò sí ẹni tí ń sọ̀rọ̀ nípasẹ̀ Ẹ̀mí Ọlọ́run tí ó máa ń sọ pé, “Ègún ni fún Jésù”[a]; bẹ́ẹ̀ ni kò sí ẹni tí ó lè sọ pé, “Jésù ni Olúwa”[b], bí kò ṣe nípasẹ̀ Ẹ̀mí Mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kí ègún wà lórí Jésù.” Gbólóhùn Gíríìkì Ἀνάθεμα Ἰησοῦς lè ní agbára àsọjáde ègún bẹ́ẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà nínú Gíríìkì, “Olúwa Jésù”; ní àyíká yìí, ìtumọ̀ rẹ̀ jẹ́ ìjẹ́wọ́ pé, “Jésù ni Olúwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ọ̀rọ̀ yìí so mọ́ ohun tí a sọ ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti fi ìsopọ̀ náà hàn ní Yorùbá.
- source_word: γνωρίζω ὑμῖν
  choice: mo jẹ́ kí ẹ mọ̀
  rationale: Ó pa ìtumọ̀ olùṣe ti γνωρίζω mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere tí kò fi èrò ìfẹ́ tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν πνεύματι θεοῦ
  choice: nípasẹ̀ Ẹ̀mí Ọlọ́run
  rationale: Ní ibi yìí ἐν lè tọ́ka sí aṣojú tàbí agbára tí ẹni fi ń sọ̀rọ̀; “nípasẹ̀” mú ipa Ẹ̀mí Ọlọ́run hàn kedere.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: Ègún ni fún Jésù
  rationale: Gbólóhùn Gíríìkì kò ní ọ̀rọ̀-ìṣe, ó sì lè jẹ́ ìkéde tàbí àsọjáde ègún. Ìtumọ̀ yìí pa agbára ἀνάθεμα mọ́ láì sọ ọ́ di àṣẹ ní pàtó.
- source_word: δύναται εἰπεῖν
  choice: ó lè sọ
  rationale: “Lè sọ” jẹ́ ọ̀nà Yorùbá àdánidá fún agbára tàbí ṣíṣeéṣe tí δύναται ń tọ́ka sí.
- source_word: Κύριος Ἰησοῦς
  choice: Jésù ni Olúwa
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtò Gíríìkì jẹ́ “Olúwa Jésù,” àyíká fi hàn pé ó jẹ́ ìjẹ́wọ́ pé Jésù ni Olúwa, kì í ṣe ìnagijẹ tàbí pípe e ní tààrà.
- source_word: εἰ μὴ ἐν πνεύματι ἁγίῳ
  choice: bí kò ṣe nípasẹ̀ Ẹ̀mí Mímọ́
  rationale: “Bí kò ṣe” fi ìyàsọ́tọ̀ kan ṣoṣo hàn, “nípasẹ̀” sì sọ ipa Ẹ̀mí Mímọ́ gẹ́gẹ́ bí aṣojú tàbí agbára di mímọ́.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ìjẹ́wọ́ Κύριος Ἰησοῦς
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” pa ìtumọ̀ orúkọ oyè náà àti ìwúwo rẹ̀ nínú ẹ̀kọ́ nípa Kristi mọ́, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ ní tààrà kún un.
- issue: Ohun tí agbára Ẹ̀mí Mímọ́ túmọ̀ sí nínú ìjẹ́wọ́ “Jésù ni Olúwa”
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ìjẹ́wọ́ tí ó wá nípasẹ̀ Ẹ̀mí Mímọ́
  alternative: Kí a dín un kù sí sísọ ọ̀rọ̀ lásán, tàbí kí a mú un gbòòrò sí gbogbo ẹ̀kọ́ nípa àtúnbí
  rationale: Ẹsẹ̀ náà so ìjẹ́wọ́ òtítọ́ nípa ipò Jésù gẹ́gẹ́ bí Olúwa mọ́ iṣẹ́ Ẹ̀mí Mímọ́, ṣùgbọ́n kò ṣàlàyé gbogbo ohun tí ìbáṣepọ̀ náà ní nínú; ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ yìí mọ́.
translation_notes:
  register: A lo Yorùbá àkànṣe tí ó bójú mu, tí ó ní àmì ohùn ní kíkún níbi tí ó jẹ́ àdánidá. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. “Ẹ” ni a lò fún ὑμῖν nítorí pé ọ̀pọ̀ ènìyàn ni Pọ́ọ̀lù ń bá sọ̀rọ̀; a sì lo “Olúwa” àti “Ẹ̀mí Mímọ́” gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀.
