source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: yo
  text: Ní ti àwọn ẹ̀bùn ti Ẹ̀mí[a], ẹ̀yin ará[b], èmi kò fẹ́ kí ẹ jẹ́ aláìmọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun ti Ẹ̀mí.” Ọ̀rọ̀ Gíríìkì gbòòrò ju “ẹ̀bùn” lọ, bí ó tilẹ̀ jẹ́ pé kókó pàtàkì nínú orí yìí ni àwọn ẹ̀bùn tí Ẹ̀mí ń fúnni.
    reason: alternative_reading
  - marker: b
    text: “Ẹ̀yin ará” ni ọ̀nà tí Pọ́ọ̀lù fi ń bá ìjọ sọ̀rọ̀ níbí; ó ṣeé ṣe kí ó ń bá àwọn obìnrin pẹ̀lú àwọn ọkùnrin sọ̀rọ̀.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ní ti
  rationale: Ó fi kókó tuntun hàn ní ọ̀nà àdánidá ní Yorùbá. A kò fi ọ̀rọ̀ tó túmọ̀ sí ‘nísinsìnyí’ kún un, nítorí kò sí ọ̀rọ̀ àkókò bẹ́ẹ̀ nínú Gíríìkì.
- source_word: τῶν πνευματικῶν
  choice: àwọn ẹ̀bùn ti Ẹ̀mí
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ àjùmọ̀lò àpèjúwe tí a lò bí orúkọ, ó sì lè túmọ̀ sí ‘àwọn ohun ti Ẹ̀mí’ ní gbòòrò. Ṣùgbọ́n ọ̀rọ̀ tó tẹ̀ lé e nínú orí 12 dá lórí àwọn ẹ̀bùn àti ìfihàn tí Ẹ̀mí ń pín, nítorí náà ‘àwọn ẹ̀bùn ti Ẹ̀mí’ mú ìtọ́kasí tó ṣeé ṣe jù lọ jáde. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gbòòrò mọ́.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: ‘Ẹ̀yin ará’ jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ tí a fi ń bá gbogbo ìjọ sọ̀rọ̀ ní Yorùbá. Ó lè gba ọkùnrin àti obìnrin, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní ẹ̀yà akọ; àlàyé ìsàlẹ̀ ojú ìwé ṣàlàyé èyí.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: èmi kò fẹ́ kí ẹ wà ní àìmọ̀ nípa wọn
  rationale: Èyí sọ àṣà ọ̀rọ̀ Pọ́ọ̀lù ní Yorùbá òde òní tó ṣe kedere, láìlo ọ̀rọ̀ ẹ̀gàn fún ẹni tí kò mọ̀.
theological_decisions:
- issue: Ìtumọ̀ τῶν πνευματικῶν
  choice: A túmọ̀ rẹ̀ sí ‘àwọn ẹ̀bùn ti Ẹ̀mí’ nínú ẹsẹ̀ pàtàkì.
  alternative: ‘àwọn ohun ti Ẹ̀mí’ tàbí, bó tilẹ̀ jẹ́ pé kò ṣeé ṣe tó bẹ́ẹ̀ níbí, ‘àwọn ẹni ti Ẹ̀mí ń darí’
  rationale: Gíríìkì kò sọ ‘ẹ̀bùn’ ní tààrà, ṣùgbọ́n 1 Kọrinti 12:4–11 ń sọ nípa àwọn ẹ̀bùn, iṣẹ́ àti ìfihàn Ẹ̀mí. Nítorí náà, a yan ìtumọ̀ tó bá àyíká mu, a sì fi àìdánilójú gidi náà pamọ́ sínú àlàyé ìsàlẹ̀ ojú ìwé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba nínú ìjọ. ‘Ẹ̀mí’ ni a kọ ní lẹ́tà ńlá láti fi hàn pé Ẹ̀mí Ọlọ́run ni àyíká ọ̀rọ̀ ń tọ́ka sí.
