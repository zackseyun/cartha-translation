id: 1CO.12.24
reference: 1 Corinthians 12:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ⸀ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ⸀ὑστεροῦντι περισσοτέραν δοὺς τιμήν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: yo
  text: ṣùgbọ́n àwọn ẹ̀yà ara wa tí ó bojú mu kò nílò. Dípò bẹ́ẹ̀, Ọlọ́run ṣàkópọ̀ ara náà[a], ó sì fi ọlá tí ó pọ̀ sí i fún ẹ̀yà tí ó ní ọlá kéré,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “dà ara pọ̀ di ọ̀kan.” Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ mímú àwọn ẹ̀yà oríṣiríṣi papọ̀ tàbí dídà wọ́n pọ̀ di odindi kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: àwọn ẹ̀yà ara wa tí ó bojú mu
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹ̀yà ara tí ó yẹ láti fihàn, tí kò sì tako ìwà ọmọlúwàbí. ‘Tí ó bojú mu’ jẹ́ ọ̀rọ̀ Yorùbá ìgbàlódé tó bá àfiwé ara mu, nígbà tí ‘àwọn ẹ̀yà ara’ jẹ́ àfikún tí àyíká gbólóhùn béèrè.
- source_word: χρείαν ἔχει
  choice: kò nílò
  rationale: Èyí pa ọ̀nà ìsọ̀rọ̀ Gíríìkì náà mọ́ láìfi ohun tí wọ́n nílò kún un, nítorí àyíká ẹsẹ tó ṣáájú ló ń ṣàlàyé rẹ̀.
- source_word: συνεκέρασεν
  choice: ṣe àkópọ̀
  rationale: ‘Ṣe àkópọ̀’ fi hàn pé Ọlọ́run mú àwọn ẹ̀yà oríṣiríṣi papọ̀ di odindi kan. Àlàyé ìsàlẹ̀ fúnni ní ọ̀nà míì tí ó tẹnu mọ́ dídà wọ́n pọ̀.
- source_word: σῶμα
  choice: ara
  rationale: Èyí pa àfiwé pàtàkì Paulu mọ́ láìfi ìtumọ̀ ṣọ́ọ̀ṣì kún ọ̀rọ̀ inú ẹsẹ náà.
- source_word: τῷ ὑστεροῦντι
  choice: fún ẹ̀yà tí kò ní ọlá tó bẹ́ẹ̀
  rationale: Àyíká fi hàn pé ohun tí ẹ̀yà náà ṣe aláìní ni ọlá, kì í ṣe pé iye tàbí ìwúlò rẹ̀ kéré ní ti ẹ̀dá.
- source_word: περισσοτέραν τιμήν
  choice: ọlá tí ó pọ̀ sí i
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára ìfiwéra περισσοτέραν mọ́.
- source_word: δοὺς
  choice: ó sì fi ... fún
  rationale: Ìlànà yìí sọ iṣẹ́ fífúnni náà di mímọ́ gẹ́gẹ́ bí ọ̀nà tí Ọlọ́run gbà ṣe àkópọ̀ ara, ó sì dun bí Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ iṣẹ́ Ọlọ́run nínú àfiwé ara
  choice: Ọlọ́run ló ṣe àkópọ̀ ara, ó sì fún ẹ̀yà tí kò ní ọlá tó bẹ́ẹ̀ ní ọlá púpọ̀ sí i.
  alternative: Kí a sọ pé Ọlọ́run kàn da àwọn ẹ̀yà ara pọ̀ nípa ti ara nìkan, tàbí kí a sọ gbangba pé ṣọ́ọ̀ṣì nìkan ni ‘ara’ túmọ̀ sí.
  rationale: Ìtumọ̀ yìí pa ìṣe Ọlọ́run tó ní ète àti àfiwé ara mọ́, ṣùgbọ́n kò fi ọ̀rọ̀ tí kò sí nínú ẹsẹ náà kún un tàbí fi tipátipá yanjú bí àfiwé náà ṣe kan ara ènìyàn àti ìjọ.
translation_notes:
  register: Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní ni a lò. A pa àkójọpọ̀ gbólóhùn mọ́ gẹ́gẹ́ bí apá kan ti ọ̀rọ̀ tó ń bá a lọ, a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
