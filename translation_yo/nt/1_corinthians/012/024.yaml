  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì náà dáadáa ní ìlànà: ìyàtọ̀ àwọn ẹ̀yà tí ó bojú mu, àìní àìní pàtàkì, ìṣe Ọlọ́run nínú pípa ara náà pọ̀, àti fífi ọlá tí ó pọ̀ sí i fún ẹ̀yà tí ó kù ní ọlá. Àtúnṣe kékeré ń mú συνεκέρασεν hàn gẹ́gẹ́ bí ìṣe ìṣọ̀kan, ó sì sọ τῷ ὑστεροῦντι di èyí tí ó rọrùn àti tí ó péye sí i nínú Yorùbá.'
