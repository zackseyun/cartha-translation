source:
  edition: SBLGNT
  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: yo
  text: fún ẹlòmíràn, ìgbàgbọ́[a] nípasẹ̀ Ẹ̀mí kan náà; fún ẹlòmíràn, àwọn ẹ̀bùn ìmúláradá[b] nípasẹ̀ Ẹ̀mí kan ṣoṣo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìṣòtítọ́” tàbí “ìgbẹ́kẹ̀lé” fún “ìgbàgbọ́” (πίστις).
    reason: lexical_alternative
  - marker: b
    text: Ní èdè Gíríìkì, “àwọn ẹ̀bùn àwọn ìmúláradá”; àwọn ọ̀rọ̀ méjèèjì wà ní ọ̀pọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: fún ẹlòmíràn
  rationale: Ọ̀rọ̀ yìí ń tẹ̀ síwájú nínú pípín àwọn ẹ̀bùn fún onírúurú ènìyàn. ‘Fún ẹlòmíràn’ jẹ́ Yorùbá àdánidá, kò sì fi ìyàtọ̀ tí kò ṣe kedere kún ἑτέρῳ àti ἄλλῳ.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ Yorùbá tó wọ́pọ̀ jù lọ, ó sì bá àyíká ẹ̀bùn tí Ẹ̀mí ń fi fúnni mu. Àwọn ìtumọ̀ míì tí ọ̀rọ̀ náà lè ní ni a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: nípasẹ̀ Ẹ̀mí kan náà
  rationale: ‘Nípasẹ̀’ sọ ipa Ẹ̀mí gẹ́gẹ́ bí olùfúnni ní ẹ̀bùn ní Yorùbá àdánidá; ‘kan náà’ sì pa ìtẹnumọ́ orísun kan náà mọ́.
- source_word: ἄλλῳ
  choice: fún ẹlòmíràn
  rationale: Ó ń bá ìlànà pípín ẹ̀bùn fún ẹnì kọ̀ọ̀kan lọ. Ṣíṣe ἑτέρῳ àti ἄλλῳ ní ọ̀nà kan náà níbí yàgò fún fífi ìyàtọ̀ tí àyíká kò fìdí rẹ̀ múlẹ̀ kún ẹsẹ náà.
- source_word: χαρίσματα
  choice: àwọn ẹ̀bùn
  rationale: Ọ̀pọ̀ nọ́ńbà yìí tọ́ka sí ohun tí a fi oore-ọ̀fẹ́ fúnni; ‘àwọn ẹ̀bùn’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: ἰαμάτων
  choice: ìmúláradá
  rationale: ‘Ìmúláradá’ sọ ìwòsàn di mímọ̀ ní Yorùbá òde òní. Nítorí pé ṣíṣe ọ̀rọ̀ náà ní ọ̀pọ̀ nọ́ńbà lẹ́yìn ‘àwọn ẹ̀bùn’ lè le ní etí Yorùbá, àlàyé ìsàlẹ̀ pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: nípasẹ̀ Ẹ̀mí kan ṣoṣo náà
  rationale: ‘Nípasẹ̀’ fi ipa Ẹ̀mí hàn, ‘kan ṣoṣo’ sì tẹnumọ́ ìṣọ̀kan tí ἑνί ní, láì sọ ìyàtọ̀ ọ̀rọ̀ Gíríìkì sí ‘kan náà’ di pẹlẹbẹ.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àyíká àwọn ẹ̀bùn Ẹ̀mí
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́ tàbí ìgbẹ́kẹ̀lé
  rationale: Àyíká náà fi hàn pé ẹ̀bùn kan ni, ṣùgbọ́n kò sọ irú ẹ̀kọ́ ìsìn pàtó kan nípa ìrírí ẹ̀bùn. A pa ìtumọ̀ tó gbòòrò jù lọ mọ́, a sì ṣàkọsílẹ̀ àwọn àṣàyàn gidi.
- issue: Ẹni tí πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí, pẹ̀lú lẹ́tà ńlá, gẹ́gẹ́ bí Ẹ̀mí Mímọ́
  alternative: ẹ̀mí
  rationale: Àyíká 1 Kọ́ríńtì 12 fi hàn pé Ẹ̀mí Mímọ́ ni olùpín àwọn ẹ̀bùn. Lẹ́tà ńlá ń fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí hàn láìfi ẹ̀kọ́ míì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé yé fún òǹkàwé òde òní. A lo àmi àárín gbólóhùn láti pa ìṣọ̀kan àti ìtẹ̀síwájú ìpín ẹ̀bùn inú ẹsẹ náà mọ́.
