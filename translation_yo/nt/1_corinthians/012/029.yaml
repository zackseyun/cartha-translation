  to: Kì í ṣe gbogbo wọn ni àpọ́sítélì, àbí? Kì í ṣe gbogbo wọn ni wòlíì, àbí? Kì í ṣe gbogbo wọn ni olùkọ́, àbí? Kì í ṣe gbogbo wọn ni wọ́n ń ṣe iṣẹ́ ìyanu[a], àbí?
  rationale: A ṣàtúnṣe ìbéèrè ìkẹyìn nìkan nípa fífi “wọ́n” kún ìkọ́lé ìfojúsùn-ọrọ. A tún ṣe ìṣàtúnṣe kékeré sí ìbẹ̀rẹ̀ àlàyé ẹsẹ̀-ìsàlẹ̀ (“Ní ìtumọ̀ gidi sí i”) kí ó lè rọrùn sí i ní Yorùbá. Ìtumọ̀, ìlànà ìbéèrè, àti ìdánimọ̀ δυνάμεις gẹ́gẹ́ bí iṣẹ́ ìyanu kò yí padà.
