id: 1CO.12.29
reference: 1 Corinthians 12:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: yo
  text: Kì í ṣe gbogbo wọn ni àpọ́sítélì, àbí? Kì í ṣe gbogbo wọn ni wòlíì, àbí? Kì í ṣe gbogbo wọn ni olùkọ́, àbí? Kì í ṣe gbogbo wọn ni wọ́n ń ṣe iṣẹ́ ìyanu[a], àbí?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ìtumọ̀ gidi sí i: “àwọn agbára” tàbí “àwọn iṣẹ́ agbára.” Ọ̀rọ̀ Gíríìkì náà dúró níbí fún àwọn iṣẹ́ ìyanu tàbí ṣíṣe irú iṣẹ́ bẹ́ẹ̀.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Kì í ṣe ... àbí?
  rationale: Ní ọ̀kọ̀ọ̀kan àwọn ìbéèrè náà, μὴ ń retí ìdáhùn òdì. Ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá tí ó sì pa ìtẹnumọ́ ìbéèrè àsọyé náà mọ́.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó túmọ̀ sí gbogbo àwọn ọmọ ara tí a ń sọ̀rọ̀ nípa wọn, ó sì pa àtúnṣe ọ̀rọ̀ inú Gíríìkì mọ́.
- source_word: ἀπόστολοι
  choice: àpọ́sítélì
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ipa iṣẹ́ ìránṣẹ́ tí a mọ̀ sí ti àwọn àpọ́sítélì, kì í ṣe òjíṣẹ́ lásán.
- source_word: προφῆται
  choice: wòlíì
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó ṣe kedere fún àwọn ẹni tí ń sọ àsọtẹ́lẹ̀ lábẹ́ ìmísí Ọlọ́run.
- source_word: διδάσκαλοι
  choice: olùkọ́
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ipa kíkọ́ni nínú ìjọ mu.
- source_word: δυνάμεις
  choice: ń ṣe iṣẹ́ ìyanu
  rationale: Orúkọ ọ̀pọ̀ δυνάμεις túmọ̀ ní ìpilẹ̀ sí ‘agbára’ tàbí ‘àwọn iṣẹ́ agbára,’ ṣùgbọ́n níbí ó dúró fún ṣíṣe iṣẹ́ ìyanu. Ìtumọ̀ ọ̀rọ̀-ìṣe yìí sọ ìtumọ̀ àyíká náà ní Yorùbá àdánidá.
theological_decisions:
- issue: Bí a ṣe lè tú δυνάμεις nínú àtòjọ àwọn ipa àti ẹ̀bùn
  choice: Kì í ṣe gbogbo wọn ni ń ṣe iṣẹ́ ìyanu, àbí?
  alternative: Kì í ṣe gbogbo wọn ni ó ní agbára, àbí?
  rationale: Gíríìkì lo orúkọ ‘àwọn agbára’ gẹ́gẹ́ bí ọ̀rọ̀ àkótán fún àwọn iṣẹ́ agbára tàbí ṣíṣe iṣẹ́ ìyanu. Ìtumọ̀ yìí kò sọ pé àwọn ènìyàn fúnra wọn jẹ́ ‘agbára,’ bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ìsìn kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe kedere fún òǹkàwé òde òní. Àtúnṣe ‘Kì í ṣe gbogbo wọn ... àbí?’ pa ìlù àti ìbéèrè àsọyé mẹ́rin inú orísun mọ́; àmì àlàyé sì wà lẹ́gbẹ̀ẹ́ ohun tí ó ń ṣàlàyé.
