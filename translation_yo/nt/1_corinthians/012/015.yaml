id: 1CO.12.15
reference: 1 Corinthians 12:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: yo
  text: Bí ẹsẹ̀ bá sọ pé,[a] “Nítorí èmi kì í ṣe ọwọ́, èmi kì í ṣe ti ara,” ṣé nítorí ìdí yìí ni kò fi jẹ́ ti ara?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà ọ̀rọ̀ tó rọrùn sí i: “Èmi kì í ṣe ọ̀kan nínú ara ... èyí kò mú kó má jẹ́ ti ara.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: Bí ... bá sọ pé
  rationale: Àkópọ̀ ‘bí ... bá’ fi ipò àròsọ tí ó lè ṣẹlẹ̀ hàn ní Yorùbá àdánidá, ó sì bá ἐὰν pẹ̀lú subjunctive mu.
- source_word: ὁ πούς
  choice: ẹsẹ̀
  rationale: A pa àwòrán ẹ̀yà ara tí Paulu lò mọ́; ‘ẹsẹ̀’ ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún πούς ní ibí yìí.
- source_word: Ὅτι
  choice: Nítorí
  rationale: Ní ibí yìí ὅτι ń fi ìdí tí ẹsẹ̀ fi sọ ọ̀rọ̀ rẹ̀ hàn, nítorí náà ‘Nítorí’ jẹ́ àdánidá, ó sì pa ìṣírò ọ̀rọ̀ náà mọ́.
- source_word: χείρ
  choice: ọwọ́
  rationale: Ìtumọ̀ tààrà yìí pa ìyàtọ̀ tó wà láàárín ẹsẹ̀ àti ọwọ́ nínú àkàwé ara mọ́.
- source_word: ἐκ τοῦ σώματος
  choice: ara kan lára ara
  rationale: Ní àyíká àkàwé yìí, gbolohun náà túmọ̀ sí jíjẹ́ ọ̀kan lára àwọn ẹ̀yà ara. Èyí jẹ́ Yorùbá tó ṣe kedere, a sì tún un ṣe ní ibi méjèèjì láti pa ìtẹnumọ́ orísun mọ́.
- source_word: οὐ παρὰ τοῦτο
  choice: ṣé nítorí ìdí yìí ni kò fi
  rationale: Ìṣètò yìí fi hàn pé Paulu ń kọ ìparí tí a gbé ka orí ìdí náà, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti gbé ìbéèrè àsọyé kalẹ̀.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: kò ... ṣe ara kan lára ara?
  rationale: A pa ìbéèrè àsọyé àti ìkọ̀ tí Gíríìkì ní mọ́ láì dá ìtumọ̀ rẹ̀ rú pẹ̀lú ìkọ̀ méjì tí kò ní ye òǹkà Yorùbá.
theological_decisions:
- issue: Bí a ṣe máa mú ọ̀rọ̀ àkàwé ara àti ìkọ̀ méjì náà rọrùn
  choice: Pa ìbéèrè àsọyé àti àtúnṣe ‘ara kan lára ara’ mọ́, ṣùgbọ́n sọ ìkọ̀ náà ní Yorùbá àdánidá.
  alternative: Tẹ̀ lé ìṣètò Gíríìkì pẹ̀lú ọ̀rọ̀ bí ‘kì í ṣe nítorí èyí ni kì í fi ṣe ti ara.’
  rationale: Yíyan yìí kò yanjú àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ kankan; ó pa agbára àríyànjiyàn Paulu àti àwòrán ara mọ́, nígbà tó yẹra fún gbolohun Yorùbá aláìmọ́ye.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ara kan lára ara’ jẹ́ ọ̀rọ̀ àdánidá fún jíjẹ́ ẹ̀yà ara, ó sì jẹ́ kí àkàwé Paulu yé òǹkà lójú ẹsẹ̀.
