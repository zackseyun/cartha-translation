  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: yo
  text: Lẹ́yìn tí ó dúpẹ́, ó bù ú, ó sì wí pé, “Èyí ni ara mi, tí ó jẹ́ fún yín[a][b]. Ẹ máa ṣe èyí láti máa rántí mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ní ipò yín’ tàbí ‘nítorí yín.’
    reason: lexical_alternative
  - marker: b
    text: 'Àwọn àfọwọ́kọ kan fi ‘tí a bù’ kún un lẹ́yìn ‘fún yín’: ‘Èyí ni ara mi, tí a bù fún yín.’'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: Lẹ́yìn tí ó dúpẹ́
  rationale: Ọ̀rọ̀ ìṣe alábápín aorist yìí ṣáájú ọ̀rọ̀ ìṣe pàtàkì; gbólóhùn yìí fi ìtẹ̀lé àwọn ìṣẹ̀lẹ̀ hàn ní Yorùbá àdánidá.
- source_word: ἔκλασεν
  choice: ó bù ú
  rationale: ‘Bù’ ni ọ̀rọ̀ Yorùbá tó bá bíbu búrẹ́dì mu; arọ́pò-orúkọ ‘ú’ tọ́ka sí búrẹ́dì tí àyíká ọ̀rọ̀ ti sọ di mímọ̀.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: Èyí ni ara mi
  rationale: A túmọ̀ gbólóhùn àsopọ̀ náà tààrà, láìfi ‘ṣàpẹẹrẹ’ tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: tí ó jẹ́ fún yín
  rationale: ‘Fún yín’ pa ìtumọ̀ àǹfààní tàbí ṣíṣe ní ipò ẹlòmíràn mọ́, láìsọ ọ́ di àlàyé pàtó nípa ètùtù.
- source_word: τοῦτο ποιεῖτε
  choice: Ẹ máa ṣe èyí
  rationale: ‘Ẹ máa ṣe’ fi àṣẹ fún ìṣe tí a ó máa tún ṣe hàn, ó sì pa ọ̀pọ̀ ènìyàn tí àṣẹ náà ń tọ́ka sí mọ́.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: láti máa rántí mi
  rationale: Èyí sọ ète ìṣe ìrántí tí a ń ṣe léraléra ní Yorùbá tó ṣe kedere, láìfi ìtumọ̀ ayẹyẹ ìsìnkú kún un.
theological_decisions:
- issue: Ìtumọ̀ ‘Èyí ni ara mi’ nínú ọ̀rọ̀ Oúnjẹ Alẹ́ Olúwa
  choice: Èyí ni ara mi
  alternative: Èyí dúró fún ara mi
  rationale: Ìtumọ̀ tààrà náà pa àìdánilójú àti ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tó wà nínú ọ̀rọ̀ Gíríìkì mọ́; kò pinnu bóyá ọ̀rọ̀ náà jẹ́ ti wíwà gidi nínú sacramenti tàbí àmì ìrántí nìkan.
- issue: Agbára ìtumọ̀ ὑπὲρ ὑμῶν
  choice: fún yín
  alternative: nítorí yín; ní ipò yín
  rationale: Ọ̀rọ̀ náà fi àǹfààní àwọn olùgbọ́ hàn, ṣùgbọ́n ‘fún yín’ kò fi èrò ẹ̀kọ́ ètùtù kan pàtó lé e lórí.
translation_notes:
  register: Yorùbá ìpele àárín tó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá. ‘Ẹ’ fi hàn pé ọ̀pọ̀ ènìyàn ni Jesu ń pàṣẹ fún.
