id: 1CO.11.18
reference: 1 Corinthians 11:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: yo
  text: Nítorí, ní àkọ́kọ́, nígbà tí ẹ bá péjọ gẹ́gẹ́ bí ìjọ[a], mo gbọ́ pé àwọn ìyapa wà láàárín yín, mo sì gbà á gbọ́ dé ìwọ̀n kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘nínú ìpéjọ’ tàbí ‘nínú ìjọ.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìjọ tí ó péjọ, kì í ṣe ilé kan ní pàtó.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν
  choice: lákọ̀ọ́kọ́
  rationale: Ó fi kókó àkọ́kọ́ nínú ọ̀rọ̀ Pọ́ọ̀lù hàn, láìfi dandan mú un pé àtòjọ tó ṣe déédé yóò tẹ̀ lé.
- source_word: συνερχομένων ὑμῶν
  choice: nígbà tí ẹ bá péjọ
  rationale: Ó tú genitive absolute náà sí ọ̀rọ̀ àkókò ní Yorùbá àdánidá, ó sì bá àyíká ìpéjọpọ̀ mu.
- source_word: ἐν ἐκκλησίᾳ
  choice: gẹ́gẹ́ bí ìjọ
  rationale: Níhìn-ín, ἐκκλησία ń tọ́ka sí àwọn onígbàgbọ́ tí wọ́n péjọ, kì í ṣe ilé ìjọsìn kan pàtó.
- source_word: ἀκούω
  choice: mo gbọ́
  rationale: Ó pa ìtumọ̀ ìròyìn tí Pọ́ọ̀lù gbọ́ mọ́ láìṣàfikún ohun tí Gíríìkì kò sọ.
- source_word: σχίσματα
  choice: ìyapa
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pínyà tàbí wíwà ní àìṣọ̀kan láàárín àwùjọ; ‘ìyapa’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tí kò sì fi ẹgbẹ́ òṣèlú tàbí ẹ̀ya kan kún un.
- source_word: ὑπάρχειν
  choice: wà
  rationale: ‘Wà’ ni ọ̀nà Yorùbá tó rọrùn jù lọ láti sọ pé ìyapa náà ń bẹ láàárín wọn.
- source_word: καὶ μέρος τι
  choice: mo sì gbà á gbọ́ dé ìwọ̀n kan
  rationale: Ó so ìdíwọ̀n náà mọ́ ìgbàgbọ́ Pọ́ọ̀lù, gẹ́gẹ́ bí Gíríìkì, ó sì fi hàn pé kò gba gbogbo ìròyìn náà gbọ́ láìsí àní-àní.
- source_word: πιστεύω
  choice: mo gbà á gbọ́
  rationale: Ọ̀rọ̀ arọ́pò ‘á’ mú ohun tí a gbà gbọ́—ìròyìn náà—ṣe kedere ní Yorùbá láìfi ìtumọ̀ tuntun kún un.
theological_decisions:
- issue: Ìtumọ̀ ἐκκλησία nínú àyíká yìí
  choice: àwọn onígbàgbọ́ tí wọ́n péjọ (‘gẹ́gẹ́ bí ìjọ’)
  alternative: nínú ìpéjọ; nínú ìjọ
  rationale: Àyíká náà jẹ́ ti ìpéjọ àwọn ará Kọ́ríńtì fún oúnjẹ Olúwa. Yíyan yìí yẹra fún ìtumọ̀ pé Pọ́ọ̀lù ń tọ́ka sí ilé ìjọsìn tàbí ètò àjọ kan.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ẹ’ ń fi hàn pé ọ̀pọ̀ ènìyàn ni Pọ́ọ̀lù ń bá sọ̀rọ̀. Gbólóhùn náà pa ìdánilójú tí a dín kù nínú ‘dé ìwọ̀n kan’ mọ́.
