  terminology: ‘Olúwa,’ ‘búrẹ́dì,’ ‘ife,’ ‘ikú,’ àti ‘kéde’ bá register ìjọsìn tó ní iyì mu, láìfi ìtúmọ̀ ẹ̀kọ́ sacrament ti ẹ̀ka kan kún ọrọ̀ náà.
