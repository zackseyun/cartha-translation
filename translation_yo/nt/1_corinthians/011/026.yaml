id: 1CO.11.26
reference: 1 Corinthians 11:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: yo
  text: Nítorí ní gbogbo ìgbà tí ẹ bá jẹ búrẹ́dì yìí, tí ẹ sì mu ife náà,[a] ẹ ń kéde ikú Olúwa títí Olúwa yóò fi dé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ‘ife náà’ ni, kì í ṣe ‘ife yìí’ nínú ẹsẹ yìí, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ tó sún mọ́ ọn fi ife tí a ń sọ̀rọ̀ rẹ̀ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: ní gbogbo ìgbà tí ẹ bá
  rationale: 'Ó fi ìṣẹ̀lẹ̀ tí ó ń ṣẹlẹ̀ léraléra hàn: ní gbogbo ìgbà tí wọ́n bá ṣe ohun náà. Èyí jẹ́ Yorùbá àdánidá tí ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.'
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìtọ́ni tó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí rẹ̀.
- source_word: ἐσθίητε
  choice: ẹ bá jẹ
  rationale: Ìlò bá nínú gbólóhùn àkókò aláìdájọ́ bá ìṣe subjunctive Gíríìkì mu ní Yorùbá.
- source_word: ἄρτον τοῦτον
  choice: búrẹ́dì yìí
  rationale: Búrẹ́dì jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó wọ́pọ̀ fún ἄρτος, yìí sì pa demonstrative τοῦτον mọ́.
- source_word: τὸ ποτήριον
  choice: ife náà
  rationale: Gíríìkì ní article ṣùgbọ́n kò ní demonstrative ‘yìí’; náà tọ́ka sí ife tí àyíká ọ̀rọ̀ ti dá mọ̀ láìfi ‘ife yìí’ kún un.
- source_word: καταγγέλλετε
  choice: ẹ ń kéde
  rationale: Kéde mú ìtumọ̀ ìpolongo tàbí ìjẹ́wọ́ ní gbangba jáde, ó sì yẹ fún register ọ̀wọ̀ ti àyíká yìí.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: ikú Olúwa
  rationale: Ìṣọ̀kan yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi genitive hàn, ó sì pa ìtẹnumọ́ ọ̀rọ̀ náà mọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: Olúwa ni ìtumọ̀ Yorùbá tí ó bójú mu fún κύριος nínú àyíká Pọ́ọ̀lù yìí.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: títí yóò fi dé
  rationale: Ó fi òpin àkókò ìkéde náà hàn. Kókó-ọ̀rọ̀ tí a kò sọ jáde ni Olúwa, bí àyíká ṣe fi hàn.
theological_decisions:
- issue: Ẹni tí kókó-ọ̀rọ̀ tí a kò sọ jáde nínú ἔλθῃ ń tọ́ka sí
  choice: Olúwa Jésù ni ẹni tí ‘yóò ... dé’ ń tọ́ka sí.
  alternative: Kí a tún orúkọ ‘Olúwa’ sọ ní gbangba nínú apá ìkẹyìn.
  rationale: ‘Olúwa’ ni antecedent tó sún mọ́ ọn jù, Yorùbá sì lè fi kókó-ọ̀rọ̀ náà sílẹ̀ láti inú àyíká bí Gíríìkì ṣe ṣe, láìfi ìtumọ̀ ẹ̀kọ́ mìíràn kún un.
- issue: Ọ̀rọ̀ Oúnjẹ Alẹ́ Olúwa àti ẹ̀kọ́ sacrament
  choice: A túmọ̀ jíjẹ búrẹ́dì, mímu ife, àti kíkéde ikú Olúwa ní tààrà.
  alternative: Àtúnsọ tí yóò pinnu rẹ̀ gẹ́gẹ́ bí sacrament ní ọ̀nà ẹ̀ka ìjọ kan tàbí gẹ́gẹ́ bí ìrántí nìkan.
  rationale: Ẹsẹ náà sọ pé ìṣe yìí ń kéde ikú Olúwa, ṣùgbọ́n kò ṣe àlàyé ẹ̀kọ́ sacrament ní kíkún; ìtumọ̀ náà kò gbọdọ̀ yanju ohun tí orísun kò yanju.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. ‘Ẹ’ ń bá plural 2nd person Gíríìkì mu; ‘ife náà’ sì yàtọ̀ sí ‘ife yìí’ gẹ́gẹ́ bí ẹ̀rí orísun.
