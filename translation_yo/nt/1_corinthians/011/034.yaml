id: 1CO.11.34
reference: 1 Corinthians 11:34
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: yo
  text: Bí ebi bá ń pa ẹnikẹ́ni, kí ó jẹun ní ilé, kí ẹ má bàa péjọ fún ìdájọ́.[a] Ní ti àwọn ohun tó kù, màá ṣètò àwọn ohun náà nígbà tí mo bá dé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìdálẹ́bi.” Ọ̀rọ̀ Gíríìkì κρίμα lè túmọ̀ sí “ìdájọ́” tàbí “ìdálẹ́bi”; níhìn-ín, “ìdájọ́” ló bá àyíká ọ̀rọ̀ mu jù, nítorí Pọ́ọ̀lù ń sọ̀rọ̀ nípa ìbáwí Olúwa nísinsìnyí dípò ìdálẹ́bi ìkẹyìn (ẹsẹ̀ 29–32).
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: ebi bá ń pa
  rationale: Ọ̀rọ̀ yìí ṣàpèjúwe ipò tí ebi ń pa ènìyàn lọ́wọ́lọ́wọ́; gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan ń pa á ní ebi.
- source_word: ἐν οἴκῳ
  choice: ní ilé
  rationale: Ó tọ́ka sí jíjẹun ní ibùgbé ẹni dípò ní àpéjọ ìjọ; “ní ilé” ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐσθιέτω
  choice: kí ó jẹun
  rationale: Ó pa àṣẹ ẹni-kẹta kan ṣoṣo mọ́ ní Yorùbá tó ṣe kedere.
- source_word: εἰς κρίμα
  choice: fún ìdájọ́
  rationale: “Ìdájọ́” pa ìtumọ̀ gbígbòòrò κρίμα mọ́ láìfi dandan mú un túmọ̀ sí ìdálẹ́bi ìkẹyìn.
- source_word: συνέρχησθε
  choice: kí ẹ má bàa péjọ
  rationale: “Péjọ” bá lílò ọ̀rọ̀ náà fún àpéjọ ìjọ mu, ó sì pa èrò abajade tí ἵνα μὴ fi hàn mọ́.
- source_word: Τὰ δὲ λοιπὰ
  choice: Ní ti àwọn ohun tó kù
  rationale: Èyí jẹ́ ìyípadà ọ̀rọ̀ àdánidá sí àwọn ọ̀ràn mìíràn tí Pọ́ọ̀lù kò tíì sọ tán.
- source_word: ὡς ἂν ἔλθω
  choice: nígbà tí mo bá dé
  rationale: Ó fi àkókò ìbẹ̀wò ọjọ́ iwájú tí a kò sọ pàtó hàn ní Yorùbá àdánidá.
- source_word: διατάξομαι
  choice: èmi yóò ṣètò wọn
  rationale: Ó mú ìtumọ̀ pípèsè tàbí fífi àwọn ọ̀ràn sí ìlànà hàn; fífi “èmi” síwájú ń tẹnumọ́ ẹni tí yóò ṣe é, bí ọ̀rọ̀ Gíríìkì ṣe gba láyè.
theological_decisions:
- issue: Ìtumọ̀ κρίμα nínú ìkìlọ̀ nípa àpéjọ Oúnjẹ Alẹ́ Olúwa
  choice: ìdájọ́
  alternative: ìdálẹ́bi
  rationale: Àyíká ẹsẹ 29–32 sọ̀rọ̀ nípa ìdájọ́ àti ìbáwí Olúwa, ó sì yà á sọ́tọ̀ sí ìdálẹ́bi pẹ̀lú ayé. “Ìdájọ́” pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìyanju rẹ̀ ju ohun tí ẹsẹ náà sọ lọ.
- issue: τις aláìlópin tó jẹ́ ẹyọ kan pẹ̀lú àṣẹ ẹni-kẹta
  choice: ẹnikẹ́ni ... kí ó jẹun
  alternative: ẹni náà ... kí wọ́n jẹun
  rationale: Yorùbá kò fi akọ tàbí abo hàn nínú arọ́pò-orúkọ ẹni-kẹta; “ẹnikẹ́ni ... ó” pa ẹyọ kan àti àṣẹ Gíríìkì mọ́ láìfi akọ tàbí abo kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ìgbàlódé ni a lò. “Ebi bá ń pa” àti “ní ilé” jẹ́ ọ̀nà àdánidá fún òǹkàwé gbogbogbòò; “ìdájọ́” àti “ṣètò” sì pa ìwọ̀n ọ̀rọ̀ ìpilẹ̀ṣẹ̀ àti ọlá ara lẹ́tà náà mọ́.
