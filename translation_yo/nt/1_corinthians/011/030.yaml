id: 1CO.11.30
reference: 1 Corinthians 11:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: yo
  text: Nítorí èyí ni ọ̀pọ̀ nínú yín fi jẹ́ aláìlera àti aláìsàn, tí ọ̀pọ̀ nínú yín sì ti sùn lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, ní ọ̀nà tó ṣe kedere sí i, “ti kú.” Ó ṣeé ṣe gan-an pé Pọ́ọ̀lù lo “sùn lọ” gẹ́gẹ́ bí àkàwé tí àwọn Kristẹni máa ń lò fún ikú.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí ni ... fi
  rationale: Ó pa agbára ìdí mú, ó sì tọ́ka sẹ́yìn sí ìwà tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ nípa rẹ̀; ìṣètò ‘ni ... fi’ jẹ́ àdánidá ní Yorùbá.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó fi hàn pé ipò náà wà nínú àwùjọ àwọn ará Kọ́ríńtì, kì í ṣe ohun tó wà nínú ara ẹni kọ̀ọ̀kan.
- source_word: πολλοὶ
  choice: ọ̀pọ̀
  rationale: Ìtumọ̀ iye tó ṣe tààrà, tó sì wọ́pọ̀ nínú Yorùbá òde òní.
- source_word: ἀσθενεῖς
  choice: aláìlera
  rationale: Ó pa ìyàtọ̀ mọ́ láàárín àìlera àti àìsàn tó tẹ̀ lé e.
- source_word: ἄρρωστοι
  choice: aláìsàn
  rationale: Ó túmọ̀ sí àwọn tó ní àìsàn, ó sì yàtọ̀ kedere sí ‘aláìlera.’
- source_word: κοιμῶνται
  choice: ti sùn lọ
  rationale: Ó pa àkàwé oorun fún ikú mọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ṣàlàyé ìtumọ̀ rẹ̀.
- source_word: ἱκανοί
  choice: iye púpọ̀
  rationale: Ó fi iye tó pọ̀ tó hàn láì tún ‘ọ̀pọ̀’ àkọ́kọ́ ṣe lọ́nà líle.
theological_decisions:
- issue: Bóyá κοιμῶνται yẹ kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí oorun tàbí ikú
  choice: A pa àkàwé náà mọ́ pẹ̀lú ‘ti sùn lọ.’
  alternative: ‘ti kú’ tàbí ‘ń sùn’ ní ti gidi
  rationale: Àyíká ìdájọ́ àti ìtẹ̀lé àìlera, àìsàn, àti oorun tọ́ka sí ikú; ṣùgbọ́n pípa àkàwé Pọ́ọ̀lù mọ́ kò jẹ́ ká tú ìtumọ̀ náà palẹ̀ ju ohun tí ọ̀rọ̀ orísun sọ lọ.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. ‘Aláìlera’ àti ‘aláìsàn’ pa ìlọsíwájú inú ọ̀rọ̀ orísun mọ́, ‘sùn lọ’ sì pa àkàwé ikú mọ́.
