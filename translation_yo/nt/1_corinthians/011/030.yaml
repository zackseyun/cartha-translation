    rationale: ἱκανοί jẹ́ àjẹ́tífù onípò-ẹgbẹ́ ẹni; ‘ọ̀pọ̀ nínú yín’ ń mú iye tí ó pọ̀ hàn kedere, ó sì tún so ẹgbẹ́ náà mọ́ àwùjọ Kọ́ríńtì.
