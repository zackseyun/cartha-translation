  to: Nítorí èyí ni ọ̀pọ̀ nínú yín fi jẹ́ aláìlera àti aláìsàn, tí ọ̀pọ̀ nínú yín sì ti sùn lọ.[a]
  rationale: Àtúnṣe kékeré yìí ń ṣe ‘a good number’ ní ọ̀nà Yorùbá tó ṣe kedere, nípa mímú ẹgbẹ́ ènìyàn tí a ń tọ́ka sí hàn. Ó pa ìtumọ̀, ìlọsíwájú, àkàwé ikú, àti àmì ìsàlẹ̀ ojú ewé ti ìtumọ̀ àkọ́kọ́ mọ́.
