id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: yo
  text: Nítorí bí obìnrin kan[a] kò bá bo orí rẹ̀, kí ó jẹ́ kí wọ́n gé irun rẹ̀ náà kúrú; ṣùgbọ́n bí ó bá jẹ́ ohun ìtìjú fún obìnrin láti jẹ́ kí wọ́n gé irun rẹ̀ kúrú tàbí láti fá orí rẹ̀, kí ó bo orí rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “aya”; ọ̀rọ̀ Gíríìkì náà, gynē, lè túmọ̀ sí “obìnrin” tàbí “aya,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “kí ó fi ìbòjú bo orí rẹ̀.” Ọ̀rọ̀ Gíríìkì náà sọ nípa jíjẹ́ ẹni tí a bò; àyíká ọ̀rọ̀ ló fi hàn pé orí ni a ń sọ̀rọ̀ nípa rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: kò bá bo orí rẹ̀ / kí ó bo orí rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí láti bò tàbí láti fi ìbòjú bò. Àyíká ẹsẹ̀ yìí fi hàn pé orí ni a ń sọ̀rọ̀ nípa rẹ̀; fífi “orí rẹ̀” hàn gbangba mú kí Yorùbá ṣe kedere láìsọ irú aṣọ kan pàtó.
- source_word: γυνή
  choice: obìnrin
  rationale: γυνή lè túmọ̀ sí “obìnrin” tàbí “aya.” Nítorí ẹsẹ̀ náà kò darúkọ ọkọ ní tààrà, “obìnrin” ni ìtumọ̀ tí kò dín ìtọ́kasí rẹ̀ kù; àṣàyàn “aya” wà nínú àlàyé ìsàlẹ̀.
- source_word: κείρασθω / τὸ κείρασθαι
  choice: kí ó gé irun rẹ̀ kúrò / láti gé irun rẹ̀ kúrò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí gígé irun kúrú tàbí pípa á kúrò, kì í ṣe gígé irun díẹ̀ lásán. Ìtumọ̀ yìí tún pa ìyàtọ̀ rẹ̀ mọ́ sí ξυρᾶσθαι, èyí tí ó túmọ̀ sí fífá.
- source_word: καί
  choice: pẹ̀lú
  rationale: '“Pẹ̀lú” pa ìtẹ̀síwájú àríyànjiyàn náà mọ́: bí kò bá bo orí rẹ̀, kí ó tún gba ìgbésẹ̀ kejì náà.'
- source_word: αἰσχρόν
  choice: ohun ìtìjú
  rationale: “Ohun ìtìjú” fi agbára ọ̀rọ̀ náà nípa ojú rere, ọlá, àti ìtìjú láwùjọ hàn ní Yorùbá àdánidá.
- source_word: ξυρᾶσθαι
  choice: láti fá orí rẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífá irun. Ṣíṣe “orí” ní ohun tí a ń fá jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, ó sì yà á sọ́tọ̀ sí gígé irun kúrú.
- source_word: γὰρ ... δέ
  choice: Nítorí ... ṣùgbọ́n
  rationale: Àwọn àsopọ̀ yìí pa ìdí tí Pọ́ọ̀lù ń fi ọ̀rọ̀ náà múlẹ̀ àti ìyàtọ̀ tó tẹ̀ lé e mọ́.
theological_decisions:
- issue: Bóyá γυνή yẹ kí a túmọ̀ sí “obìnrin” tàbí “aya”
  choice: obìnrin
  alternative: aya
  rationale: Kò sí ìtọ́kasí ọkọ ní tààrà nínú ẹsẹ̀ yìí, nítorí náà “obìnrin” pa ìtumọ̀ gbòòrò rẹ̀ mọ́, kò sì fi ẹsẹ̀ náà mọ́ àwọn obìnrin tó ti gbéyàwó nìkan. Síbẹ̀, “aya” ṣeé ṣe gẹ́gẹ́ bí àyíká ọ̀rọ̀, a sì pa á mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, tó bójú mu, tí ó sì níyì ni a lò. A yan gbólóhùn tó ṣe kedere fún òǹkàwé gbogbogbò, nígbà tí àwọn àlàyé ìsàlẹ̀ pa àìdánilójú γυνή àti ìtumọ̀ ọ̀rọ̀ nípa ìbòjú mọ́.
