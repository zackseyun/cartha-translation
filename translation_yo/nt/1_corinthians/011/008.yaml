id: 1CO.11.8
reference: 1 Corinthians 11:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀνὴρ ἐκ γυναικός, ἀλλὰ γυνὴ ἐξ ἀνδρός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: yo
  text: Nítorí ọkùnrin kò wá láti inú obìnrin,[a] ṣùgbọ́n obìnrin wá láti inú ọkùnrin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí ọkọ kò wá láti inú aya, ṣùgbọ́n aya wá láti inú ọkọ.” Àwọn ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ọkùnrin/obìnrin” tàbí “ọkọ/aya”; níbí, a yan ìtumọ̀ gbòòrò tó dá lórí ìṣẹ̀dá.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Nítorí
  rationale: Ó ń fi ìdí tàbí àlàyé fún ọ̀rọ̀ tó ṣáájú hàn; ‘Nítorí’ bá ìjiyàn inú àyíká yìí mu ní Yorùbá.
- source_word: ἀνὴρ / ἀνδρός
  choice: ọkùnrin
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ‘ọkọ,’ ìtọ́kasí sí ìṣẹ̀dá àti ìfiwéra rẹ̀ pẹ̀lú γυνή ń tọ́ka sí ọkùnrin àti obìnrin ní ìtumọ̀ gbòòrò.
- source_word: ἐκ / ἐξ
  choice: ti inú ... wá
  rationale: Àwọn ọ̀rọ̀ àsopọ̀ náà ń tọ́ka sí orísun. ‘Ti inú ... wá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìpilẹ̀ṣẹ̀ tàbí jíjẹ́ ẹni kan láti ara ẹlòmíràn.
- source_word: γυναικός / γυνὴ
  choice: obìnrin
  rationale: Nínú ìjiyàn nípa ìṣẹ̀dá yìí, ‘obìnrin’ ló pa ìfiwéra gbòòrò mọ́ ju ‘aya’ lọ.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára láàárín àwọn gbólóhùn méjèèjì hàn ní kedere.
- source_word: ἐστιν
  choice: kò ... wá / ni ó ... wá
  rationale: A túmọ̀ ọ̀rọ̀ ìṣe náà pẹ̀lú àkójọpọ̀ ọ̀rọ̀ Yorùbá àdánidá tó ń sọ orísun, dípò lílo ‘jẹ́’ lọ́nà líle.
theological_decisions:
- issue: Bóyá ἀνήρ/γυνή yẹ kí ó jẹ́ ‘ọkùnrin/obìnrin’ tàbí ‘ọkọ/aya’
  choice: ọkùnrin/obìnrin
  alternative: ọkọ/aya
  rationale: Ìjiyàn Pọ́ọ̀lù dá lórí ìpilẹ̀ṣẹ̀ nínú ìtàn ìṣẹ̀dá. ‘Ọkùnrin/obìnrin’ pa ìtumọ̀ gbòòrò yẹn mọ́, láì fi ọ̀rọ̀ náà mọ́ tọkọtaya nìkan; àmọ́ akọsilẹ̀ ẹsẹ̀ jẹ́wọ́ àìdánilójú gírámà Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún àti èdè àdánidá tó ní iyì. Àkójọpọ̀ ‘ti inú ... wá’ sọ ìpilẹ̀ṣẹ̀ ní kedere, ó sì yẹra fún ìtumọ̀ ọ̀rọ̀-ní-ọ̀rọ̀ tó le.
