id: 1CO.11.27
reference: 1 Corinthians 11:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: yo
  text: Nítorí náà, ẹnikẹ́ni tí ó bá jẹ búrẹ́dì náà tàbí mu ife Olúwa lọ́nà tí kò yẹ[a], yóò jẹ̀bi ní ti ara àti ẹ̀jẹ̀ Olúwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Lọ́nà tí kò yẹ’ túmọ̀ ọ̀rọ̀-àpèjúwe ìṣe kan; ó ń ṣàlàyé bí ẹni ṣe jẹ tàbí mu, kì í ṣe iye tàbí jíjẹ́-yẹ ẹni náà ní ti ara rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ ní ọ̀nà ìbílẹ̀ pé, ‘yóò jẹ̀bi ara àti ẹ̀jẹ̀ Olúwa.’ Ìṣètò ọ̀rọ̀ Gíríìkì gba ìtumọ̀ gígún yìí; ‘ní ti’ nínú àyọkà pàtàkì mú kó ṣe kedere pé ara àti ẹ̀jẹ̀ Olúwa ni ojúṣe ìdálẹ́bi náà kàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ tí a fa jáde láti inú ìjíròrò tó ṣáájú hàn ní èdè Yorùbá àdánidá.
- source_word: ὃς ἂν
  choice: ẹnikẹ́ni tí ó bá
  rationale: Àkópọ̀ ọ̀rọ̀ yìí fi ẹni àìsọ pàtó àti ipò gbogbogbò hàn; ‘ẹnikẹ́ni tí ó bá’ mú agbára yẹn jáde dáadáa.
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: jẹ àkàrà náà
  rationale: ‘Àkàrà náà’ tọ́ka sí oúnjẹ tí a ti ń sọ̀rọ̀ nípa rẹ̀, láìfi ọ̀rọ̀ itọ́ka míì kún Gíríìkì.
- source_word: ἢ
  choice: tàbí
  rationale: ἤ jẹ́ àsopọ̀ ayànmọ́ méjì; ‘tàbí’ pa ìkìlọ̀ mọ́ pé ìṣe èyíkéyìí nínú méjèèjì lè wáyé lọ́nà tí kò yẹ.
- source_word: πίνῃ τὸ ποτήριον
  choice: mu ife
  rationale: Èyí pa àpèjúwe àfidípò Gíríìkì mọ́, níbi tí ‘ife’ ti dúró fún ohun tí ó wà nínú rẹ̀, ó sì bá ọ̀nà ọ̀rọ̀ Oúnjẹ Alẹ́ Olúwa mu.
- source_word: ἀναξίως
  choice: lọ́nà tí kò yẹ
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀-àpèjúwe ìṣe; ó ṣàpèjúwe bí ẹni ṣe ń jẹ tàbí mu, kì í ṣe pé ẹni náà kò ní iye tàbí kò yẹ ní ti ara rẹ̀.
- source_word: ἔνοχος ἔσται
  choice: yóò jẹ̀bi
  rationale: Ó sọ ìdálẹ́bi tàbí jíjẹ́ ẹni tí ó ní láti dáhùn fún ohun kan; ‘yóò jẹ̀bi’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì pa ìwọ̀n ọ̀rọ̀ náà mọ́.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: nípa ti ara àti ẹ̀jẹ̀ Olúwa
  rationale: ‘Nípa ti’ fi ohun tí ìdálẹ́bi náà kan hàn láìyanju gbogbo ìtumọ̀ òfin tí gẹnitífù náà lè ní; ‘Olúwa’ sì pa κύριος mọ́ gẹ́gẹ́ bí orúkọ oyè.
theological_decisions:
- issue: Ìtumọ̀ ἀναξίως nípa kíkópa nínú Oúnjẹ Alẹ́ Olúwa
  choice: Ẹsẹ̀ náà dá jíjẹ àti mímu lọ́nà tí kò yẹ lẹ́bi, kì í sọ pé ẹni tí kò yẹ ní ti ara rẹ̀ nìkan ni ó ń kópa.
  alternative: Kí a ka ọ̀rọ̀ náà bí ẹni pé ó ń sọ nípa ẹni tí kò yẹ dípò ọ̀nà tí ó gbà jẹ tàbí mu.
  rationale: ἀναξίως jẹ́ ọ̀rọ̀-àpèjúwe ìṣe tí ó ń ṣàlàyé ἐσθίῃ àti πίνῃ. Ìtumọ̀ náà kò gbọdọ̀ yí ìdojúkọ gírámà náà sí ẹ̀kọ́ nípa iye ẹni.
- issue: Agbára ἢ láàárín jíjẹ àti mímu
  choice: Ìkìlọ̀ náà kan ẹni tí ó ṣe èyíkéyìí nínú ìṣe méjèèjì lọ́nà tí kò yẹ.
  alternative: Kí a ka ìṣe méjèèjì gẹ́gẹ́ bí àkópọ̀ kan, kí a sì túmọ̀ ἢ bí ‘àti.’
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ àsopọ̀ ayànmọ́; lílo ‘tàbí’ ń tẹ̀ lé ẹ̀rí orísun láìṣàtúnṣe rẹ̀ sí àṣà ìjọsìn.
- issue: Ìbáṣepọ̀ ἔνοχος pẹ̀lú gẹnitífù ara àti ẹ̀jẹ̀
  choice: A sọ pé ẹni náà ‘yóò jẹ̀bi nípa ti’ ara àti ẹ̀jẹ̀ Olúwa.
  alternative: A lè sọ ní ọ̀nà gígún pé ‘yóò jẹ̀bi ara àti ẹ̀jẹ̀ Olúwa.’
  rationale: Ọ̀nà àkọ́kọ́ jẹ́ kó ṣe kedere pé ara àti ẹ̀jẹ̀ Olúwa ni ìdálẹ́bi náà kàn, ṣùgbọ́n kò fi ìtumọ̀ òfin kan ṣoṣo lé gẹnitífù Gíríìkì lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Àkàrà’ àti ‘ife’ jẹ́ àwọn ọ̀rọ̀ tí ó wọ́pọ̀ fún àkàrà àti ohun èlò mímu; a pa àfidípò ‘mu ife’ mọ́ nítorí pé ó ṣe pàtàkì nínú ọ̀rọ̀ orísun. A yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìjọ kan pàtó.
