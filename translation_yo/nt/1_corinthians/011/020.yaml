  text: συνερχομένων οὖν ὑμῶν ἐπὶ τὸ αὐτὸ οὐκ ἔστιν κυριακὸν δεῖπνον φαγεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: yo
  text: Nítorí náà, nígbà tí ẹ bá péjọ ní ibi kan náà, kì í ṣe láti jẹ Oúnjẹ Alẹ́ Olúwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ kò jẹ Oúnjẹ Alẹ́ Olúwa,” èyí tó tẹnu mọ́ pé ìwà yín mú kí oúnjẹ náà kò tún yẹ kí a pè é ní orúkọ yẹn.
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: nígbà tí ẹ bá péjọ
  rationale: Àpólà alábápín pẹ̀lú ὑμῶν ní ìtumọ̀ àkókò, ‘nígbà tí ẹ bá péjọ’; ‘péjọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìkójọpọ̀ ìjọ.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde ọ̀rọ̀ tó ṣáájú hàn, pàápàá ìbáwí nípa ìyapa láàárín wọn.
- source_word: ἐπὶ τὸ αὐτό
  choice: sí ibì kan náà
  rationale: Ó pa ìtumọ̀ pé wọ́n kóra jọ sí ibi kan mọ́, láìṣe àtúnwí ‘péjọ’ lásán.
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: kì í ṣe láti jẹ
  rationale: 'Ó pa ìṣètò ọ̀rọ̀ Gíríìkì àti agbára ìdájọ́ rẹ̀ mọ́: ohun tí ìpéjọ wọn ń yọrí sí kò yẹ kí a pè ní jíjẹ Oúnjẹ Alẹ́ Olúwa.'
- source_word: κυριακὸν
  choice: Olúwa
  rationale: Nínú àpólà ‘Oúnjẹ Alẹ́ Olúwa,’ ó túmọ̀ sí ohun tí ó jẹ́ ti Olúwa.
- source_word: δεῖπνον
  choice: Oúnjẹ Alẹ́
  rationale: Ó jẹ́ ìtumọ̀ àdánidá ti oúnjẹ pàtàkì tí a ń jẹ ní ìrọ̀lẹ́, ó sì bá gbólóhùn Kristẹni tí a mọ̀ sí ‘Oúnjẹ Alẹ́ Olúwa’ mu.
- source_word: κυριακὸν δεῖπνον
  choice: Oúnjẹ Alẹ́ Olúwa
  rationale: Ó sọ ìbáṣepọ̀ ohun-ìní náà kedere, ó sì jẹ́ gbólóhùn Yorùbá tí ó bójú mu fún oúnjẹ tí ó jẹ́ ti Olúwa.
theological_decisions:
- issue: Bóyá Pọ́ọ̀lù ń sọ pé kò ṣeé ṣe láti jẹ oúnjẹ náà rárá, tàbí pé ìwà wọn mú kí ohun tí wọ́n ń jẹ má yẹ orúkọ Oúnjẹ Alẹ́ Olúwa
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ìdájọ́ pé ìpéjọ wọn kì í ṣe fún jíjẹ Oúnjẹ Alẹ́ Olúwa ní tòótọ́.
  alternative: ‘Ẹ kò jẹ Oúnjẹ Alẹ́ Olúwa,’ èyí tó tẹnu mọ́ pé ìwà wọn mú kí oúnjẹ náà má ṣe yẹ orúkọ yẹn mọ́.
  rationale: Àyíká ẹsẹ 21–22 fi hàn pé Pọ́ọ̀lù ń bá ọ̀nà tí wọ́n gbà ń jẹ oúnjẹ àjọṣe náà wí, kì í ṣe pé ó ń sọ pé jíjẹ rẹ̀ kò ṣeé ṣe nípa ìwàláàyè. Ìtumọ̀ àkọ́kọ́ pa ìṣòro àti ìṣókí Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ fúnni ní ọ̀nà míì.
translation_notes:
  register: Yorùbá àgbàṣe tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn sí ibi tí ó yẹ.
