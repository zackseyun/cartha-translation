base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/031.yaml
  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: yo
  text: Ṣùgbọ́n bí a bá ń dá ara wa lẹ́jọ́[a], a kì bá ní jẹ́ ẹni tí a dá lẹ́jọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ń yẹ ara wa wò” tàbí “ń mọ ara wa dáadáa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ṣíṣe àyẹ̀wò tàbí fífi ìyàtọ̀ mọ̀; a lo “dá … lẹ́jọ́” níbí láti pa ìbátan rẹ̀ mọ́ “dá lẹ́jọ́” nínú abala tó tẹ̀ lé.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: “Bí” fi ipò àídájú hàn, “ṣùgbọ́n” sì pa ìyàtọ̀ oníwọ̀nba tí δέ mú wá mọ́, ní Yorùbá àdánidá.
- source_word: ἑαυτοὺς
  choice: ara wa
  rationale: Ọ̀rọ̀ arọ́pò aṣepadà yìí ni ohun tí ọ̀rọ̀-ìṣe náà ń ṣiṣẹ́ lé lórí; “ara wa” ni ìtumọ̀ Yorùbá tó ṣe déédé.
- source_word: διεκρίνομεν
  choice: ń dá ara wa lẹ́jọ́
  rationale: Yíyan “dá … lẹ́jọ́” pa ìbátan ọ̀rọ̀ mọ́ κρίνω nínú gbólóhùn kejì, ó sì lè túmọ̀ sí ṣíṣe àyẹ̀wò àti ìdájọ́ ara ẹni ní àyíká Oúnjẹ Alẹ́ Olúwa.
- source_word: οὐκ ἂν
  choice: a kì bá tíì
  rationale: Ìṣọ̀kan yìí fi àbájáde ipò tí kò ṣẹ ní ti gidi hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: ἐκρινόμεθα
  choice: jẹ́ ẹni tí a ń dá lẹ́jọ́
  rationale: Ó pa ìbátan lexical mọ́ “dá ara wa lẹ́jọ́” ní abala àkọ́kọ́, láì sọ ọ́ di “dálẹ́bi,” èyí tí yóò lágbára ju ohun tí àyíká ẹsẹ náà béèrè lọ.
theological_decisions:
- issue: Bóyá abala kejì ń tọ́ka sí ìdálẹ́bi ìkẹyìn tàbí sí ìdájọ́/ìbáwí Ọlọ́run ní àkókò yìí
  choice: A lo “dá lẹ́jọ́,” tó jẹ́ ọ̀rọ̀ tí kò pinnu irú ìdájọ́ náà ju bí Gíríìkì ṣe pinnu rẹ̀ lọ.
  alternative: “dálẹ́bi,” tí ó lè túmọ̀ sí ìdálẹ́bi ìkẹyìn
  rationale: Ẹsẹ 32 yà ìdájọ́ àti ìbáwí Olúwa sọ́tọ̀ kúrò nínú dídálẹ́bi pẹ̀lú ayé. Nítorí náà, ìtumọ̀ kò gbọ́dọ̀ fi “dálẹ́bi” yanju ohun tí ẹsẹ yìí kò sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì. Àmì ohùn kún ibi tí ó yẹ. Ìṣètò “a kì bá tíì…” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ipò tí kò ṣẹ àti àbájáde rẹ̀ hàn.
