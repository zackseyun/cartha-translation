review_pass:
  verdict: revise
  source_fidelity: Àbala àkọ́kọ́ náà gba ìtumọ̀ διακρίνω gẹ́gẹ́ bí ìdájọ́/àgbéyẹ̀wò ara ẹni, ó sì pa ìfararora ọ̀rọ̀ mọ́ κρίνω nínú abala kejì. Ṣùgbọ́n “tíì” nínú “a kì bá tíì jẹ́” ń fi ìtumọ̀ ‘kò tíì’ (not yet) kún un, èyí tí kò sí nínú Gíríìkì. Ìṣe alákòókò “a ń dá lẹ́jọ́” nínú abala kejì tún lè dá ìdájọ́ náà hàn bí ohun tí ń ṣẹlẹ̀ lọ́wọ́lọ́wọ́ ju bí ἐκρινόμεθα ṣe béèrè lọ.
  naturalness: “Ṣùgbọ́n bí a bá ń dá ara wa lẹ́jọ́, a kì bá ní jẹ́ ẹni tí a dá lẹ́jọ́” jẹ́ Yorùbá boṣewa, ó sì ṣàfihàn ìpò àti àbájáde rẹ̀ ní kedere. Yíyọ “àwa” kúrò kò yí ìtumọ̀ padà, ó sì yẹra fún ìtẹnumọ́ tí Gíríìkì kò fi hàn. A tún tún ọ̀rọ̀ ìsàlẹ̀ ṣe kí àwọn àṣàyàn rẹ̀ jẹ́ Yorùbá àdánidá.
  terminology: “Dá ara wa lẹ́jọ́” àti “jẹ́ ẹni tí a dá lẹ́jọ́” pa ìbátan διακρίνω/κρίνω mọ́ láì sọ ἐκρινόμεθα di “dálẹ́bi.” Èyí bá àyíká ẹsẹ 32 mu, níbi tí ìdájọ́ Olúwa ti yà sílẹ̀ kúrò nínú ìdálẹ́bi pẹ̀lú ayé.
