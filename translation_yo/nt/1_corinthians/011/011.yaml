id: 1CO.11.11
reference: 1 Corinthians 11:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πλὴν οὔτε ⸂γυνὴ χωρὶς ἀνδρὸς οὔτε ἀνὴρ χωρὶς γυναικὸς⸃ ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: yo
  text: Síbẹ̀[a], nínú Olúwa, obìnrin kò wà láìsí ọkùnrin, bẹ́ẹ̀ ni ọkùnrin kò wà láìsí obìnrin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aya kò wà láìsí ọkọ, bẹ́ẹ̀ ni ọkọ kò wà láìsí aya.” Àwọn ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí obìnrin/ọkùnrin tàbí aya/ọkọ; a yan ìtumọ̀ tó gbòòrò níhìn-ín nítorí pé gbólóhùn náà dà bí ọ̀rọ̀ gbogbogbò, kì í ṣe èyí tí ó kan ìgbéyàwó nìkan.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Síbẹ̀
  rationale: Ó fi ìyípadà tí ń dọ́gba tàbí tí ń fi ààlà sí ọ̀rọ̀ tó ṣáájú hàn, láìsọ ìtumọ̀ náà di líle ju ti Gíríìkì lọ.
- source_word: γυνή
  choice: obìnrin
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘obìnrin’ tàbí ‘aya’; níhìn-ín, gbólóhùn gbogbogbò nípa ìbáṣepọ̀ ọkùnrin àti obìnrin nínú Olúwa ṣe àtìlẹ́yìn fún ìtumọ̀ tó gbòòrò.
- source_word: ἀνήρ
  choice: ọkùnrin
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘ọkùnrin’ tàbí ‘ọkọ’; bí ó ti rí pẹ̀lú γυνή, ìtumọ̀ gbogbogbò ‘ọkùnrin’ bá àyíká ọ̀rọ̀ mu jù.
- source_word: χωρὶς
  choice: láìsí
  rationale: Ó sọ àìyapa tàbí àìlèdá dúró lọ́tọ̀ hàn ní Yorùbá àdánidá, láìfi ìtumọ̀ míì kún un.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa ọ̀nà ọ̀rọ̀ Pọ́ọ̀lù mọ́, ó sì lè tọ́ka sí ipò tàbí ìbáṣepọ̀ àwọn onígbàgbọ́ pẹ̀lú Olúwa.
- source_word: οὔτε ... οὔτε
  choice: kò ... bẹ́ẹ̀ ni ... kò
  rationale: Ìṣètò yìí fi ìdọ́gba àwọn gbólóhùn méjèèjì hàn ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Bóyá γυνή / ἀνήρ yẹ kí a túmọ̀ sí ‘obìnrin/ọkùnrin’ tàbí ‘aya/ọkọ’
  choice: obìnrin/ọkùnrin
  alternative: aya/ọkọ
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ọkùnrin àti obìnrin nínú ìṣẹ̀dá àti ìjọsìn, ẹsẹ yìí sì jẹ́ ọ̀rọ̀ ìwọ̀ntúnwọ̀nsì nípa bí wọ́n ṣe ní í ṣe pẹ̀lú ara wọn. Àlàyé ìsàlẹ̀ pa ìtumọ̀ ti ìgbéyàwó tó tún ṣeé ṣe mọ́.
- issue: Ìtumọ̀ ἐν κυρίῳ
  choice: nínú Olúwa
  alternative: ní ìbáṣepọ̀ pẹ̀lú Olúwa
  rationale: Ìtumọ̀ gígùn ‘nínú Olúwa’ pa àìṣedéédé tó wà nínú ọ̀rọ̀ Pọ́ọ̀lù mọ́, dípò kíkó ìtumọ̀ rẹ̀ mọ́ ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘láìsí’ fún ìbáṣepọ̀ tí χωρίς ń sọ, a sì pa ìṣètò tó dọ́gba ti àwọn apá méjèèjì mọ́.
