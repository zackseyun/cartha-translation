  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ẹsẹ̀ Giriki dáadáa ní pàtàkì: δοκιμαζέτω ... ἑαυτόν ni ‘kí ... yẹ ara rẹ̀ wò,’ àti ìpàṣẹ méjì ‘kí ó jẹ ... kí ó sì mu’ ni a ti pa mọ́. Ṣùgbọ́n fífi ‘ní ọ̀nà yìí’ sí òpin gbolohun Yorùbá lè jẹ́ kí ó dà bí ẹni pé ó kan ìmú nìkan, nígbà tí οὕτως ń so ìyẹ̀wò ara ẹni ṣáájú pọ̀ mọ́ jíjẹ àti mímu tí ó tẹ̀ lé e.'
