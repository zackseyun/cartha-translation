  terminology: ‘Olúkúlùkù,’ ‘yẹ ara rẹ̀ wò,’ ‘búrẹ́dì,’ àti ‘ago’ jẹ́ àwọn ọ̀rọ̀ Yorùbá òde òní tó bójú mu. ‘Olúkúlùkù’ ń mú ìlò gbogbo-ẹni ti ἄνθρωπος jáde, láì fi ìdí ìtumọ̀ kún un.
