id: 1CO.11.28
reference: 1 Corinthians 11:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: yo
  text: Ṣùgbọ́n kí olúkúlùkù yẹ ara rẹ̀ wò, lẹ́yìn náà kí ó jẹ lára búrẹ́dì náà, kí ó sì mu nínú ago náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: kí ... yẹ ... wò
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ohun dánwò tàbí ṣàyẹ̀wò láti mọ bí ó ṣe rí; ‘yẹ ara rẹ̀ wò’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ἄνθρωπος
  choice: olúkúlùkù
  rationale: Ní àyíká yìí, ἄνθρωπος ń tọ́ka sí ẹnì kọ̀ọ̀kan láì fi ìtumọ̀ ọkùnrin nìkan sí i; ‘olúkúlùkù’ mú ìtumọ̀ gbogbo ẹni tó ń kópa jáde ní Yorùbá àdánidá.
- source_word: ἐκ τοῦ ἄρτου
  choice: nínú búrẹ́dì náà
  rationale: A pa ἐκ mọ́ gẹ́gẹ́ bí jíjẹ lára ohun tí a pín, dípò lílo ọ̀rọ̀ tó lè dà bí ẹni pé a jẹ gbogbo búrẹ́dì náà.
- source_word: ἐκ τοῦ ποτηρίου
  choice: nínú ago náà
  rationale: ‘Mu nínú ago náà’ jẹ́ ìtumọ̀ gígùn-ún-tọ́ ti ikosile Giriki, ó sì pa àwòrán ago tí a ti ń mu mọ́.
- source_word: οὕτως
  choice: ní ọ̀nà yìí
  rationale: Ó tọ́ka sí jíjẹ àti mímu lẹ́yìn tí ẹni náà bá ti yẹ ara rẹ̀ wò; a kò túmọ̀ rẹ̀ sí ìpinnu pé ẹni náà yẹ tàbí kò yẹ.
theological_decisions:
- issue: 'Ìtumọ̀ ἄνθρωπος: ‘ọkùnrin’ tàbí ‘ẹni’'
  choice: olúkúlùkù
  alternative: ọkùnrin kan
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄνθρωπος lè túmọ̀ sí ‘ọkùnrin’ ní àwọn àyíká kan, lílo rẹ̀ níbí jẹ́ ti gbogbo ènìyàn, ó sì ní ìṣe ẹnì kọ̀ọ̀kan lọ́kàn. Ìtumọ̀ yìí kò yọ obìnrin kúrò lára àwọn tí ìlànà náà kan.
- issue: Ohun tí yíyẹ ara ẹni wò ń béèrè
  choice: A fi gbolohun náà sílẹ̀ láì ṣàfikún àbájáde tàbí àṣẹ míì.
  alternative: Ṣàfikún pé ẹni náà gbọdọ̀ kọ́kọ́ rí ara rẹ̀ gẹ́gẹ́ bí ẹni tó yẹ kí ó tó jẹ.
  rationale: Ọ̀rọ̀ Giriki pàṣẹ fún yíyẹ ara ẹni wò, lẹ́yìn náà ó sọ pé kí ẹni náà jẹ, kí ó sì mu; kò sọ pé kí ẹni náà kọ ara rẹ̀ sílẹ̀ bí àbájáde ìyẹ̀wò náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘búrẹ́dì’ fún ἄρτος àti ‘ago’ fún ποτήριον gẹ́gẹ́ bí ọ̀rọ̀ tó wọ́pọ̀, tó sì ye òǹkàwé lónìí.
