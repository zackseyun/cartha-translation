id: 1CO.11.10
reference: 1 Corinthians 11:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: yo
  text: Nítorí èyí, ó yẹ kí obìnrin ní àṣẹ lórí orí rẹ̀[a], nítorí àwọn áńgẹ́lì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tí ó ṣàlàyé sí i, “ó yẹ kí ó wọ àmì àṣẹ lórí orí rẹ̀.” Ọ̀rọ̀ Gíríìkì sọ pé “àṣẹ”; kò sì sọ “àmì” tàbí “ìbòrí” ní kedere.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nítorí àwọn òjíṣẹ́,” bí ó tilẹ̀ jẹ́ pé “àwọn áńgẹ́lì” ló ṣeé ṣe jù lọ níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí
  rationale: Ó pa ìtumọ̀ ìdí àti àbájáde tí ọ̀rọ̀ Gíríìkì ní mọ́, ó sì jẹ́ ọ̀nà àdánidá láti so ẹsẹ yìí mọ́ àríyànjiyàn tó ṣáájú.
- source_word: ὀφείλει
  choice: ó yẹ kí
  rationale: Ó fi ojúṣe tàbí ohun tí ó tọ́ hàn láìsọ ọ́ di àṣẹ òfin líle ju bí ọ̀rọ̀ Gíríìkì ṣe béèrè lọ.
- source_word: ἡ γυνὴ
  choice: obìnrin
  rationale: Ó bá ìlò aṣojú-gbogbo ti ẹyọ ọ̀rọ̀ náà mu, kò sì dín ìtumọ̀ rẹ̀ kù sí ‘aya’ nìkan.
- source_word: ἐξουσίαν
  choice: àṣẹ
  rationale: Èyí ni ìtumọ̀ tààrà ọ̀rọ̀ Gíríìkì; a kò fi ‘àmì’ tàbí ‘ìbòrí’ kún un nínú ọ̀rọ̀ pàtàkì.
- source_word: ἔχειν
  choice: ní
  rationale: Ó túmọ̀ ọ̀rọ̀ náà ní tààrà gẹ́gẹ́ bí ‘ní,’ dípò fífi èrò ‘wọ̀’ tàbí ‘gbé’ kún un láti inú àyíká ọ̀rọ̀.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: lórí orí rẹ̀
  rationale: Ó pa àwòrán ibi tí ọ̀rọ̀ Gíríìkì fi hàn mọ́, bí ó tilẹ̀ jẹ́ pé àtúnwí ‘orí’ jẹ́ àbùdá gírámà Yorùbá tí ó ṣe kedere pé orí obìnrin náà ni.
- source_word: διὰ τοὺς ἀγγέλους
  choice: nítorí àwọn áńgẹ́lì
  rationale: διά pẹ̀lú ẹ̀sùn-asọ́rọ̀ ń fi ìdí hàn, ‘áńgẹ́lì’ sì ni ìtumọ̀ tó ṣeé ṣe jù lọ ní àyíká yìí, bí ‘ońṣẹ́’ tilẹ̀ ṣe ṣeé ṣe nípa ìtumọ̀ ọ̀rọ̀.
theological_decisions:
- issue: Ìtumọ̀ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ‘ní àṣẹ lórí orí rẹ̀.’
  alternative: ‘wọ àmì àṣẹ sí orí rẹ̀’ tàbí ‘ní ìbòrí orí gẹ́gẹ́ bí àmì àṣẹ.’
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ‘àmì’ tàbí ‘ìbòrí’ ní kedere. Nítorí pé ìtumọ̀ gbólóhùn náà ṣì jẹ́ ohun tí a ń jíròrò, ọ̀rọ̀ pàtàkì pa ìṣòro àti àìdánilójú rẹ̀ mọ́, àlàyé ẹsẹ̀ sì mẹ́nu kan ìtumọ̀ tí ó wọ́pọ̀.
- issue: Ohun tí ἀγγέλους ń tọ́ka sí
  choice: àwọn áńgẹ́lì
  alternative: àwọn ońṣẹ́
  rationale: ἄγγελος lè túmọ̀ sí áńgẹ́lì tàbí ońṣẹ́, ṣùgbọ́n bí a ṣe lò ó ní ọ̀pọ̀ láìsí àfikún ní ibi yìí, ‘áńgẹ́lì’ ló ṣeé ṣe jù. A kò fi èrò pàtó kan kún ìdí tí a fi mẹ́nu kàn wọ́n.
- issue: Ìwọ̀n ìtumọ̀ γυνή
  choice: obìnrin
  alternative: aya
  rationale: Àyíká náà ń sọ ní gbòòrò nípa ọkùnrin àti obìnrin, nítorí náà ‘obìnrin’ pa ìwọ̀n ọ̀rọ̀ náà mọ́ láìdín in kù sí ìgbéyàwó.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A yan gbólóhùn tó ṣeé lóye fún òǹkàwé òde òní, ṣùgbọ́n a mọ̀ọ́mọ̀ pa àìdánilójú inú gbólóhùn ‘ní àṣẹ lórí orí rẹ̀’ mọ́ dípò yíyan ìtumọ̀ ẹ̀kọ́ ìsìn kan.
