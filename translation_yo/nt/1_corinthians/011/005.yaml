- from: Ṣùgbọ́n gbogbo obìnrin[a] tí ó bá ń gbàdúrà tàbí sọ àsọtẹ́lẹ̀ láìbo orí rẹ̀[b] ń kó ìtìjú bá orí rẹ̀[a], nítorí pé ọ̀kan náà ni òun àti ẹni tí a ti fá orí rẹ̀.
  to: Ṣùgbọ́n gbogbo obìnrin[a] tí ń gbàdúrà tàbí tí ń sọ àsọtẹ́lẹ̀ láìbo orí rẹ̀[b] ń kó ìtìjú bá orí rẹ̀[a], nítorí pé ó jẹ́ ohun kan náà bí ẹni tí a ti fá orí rẹ̀.
  rationale: The revision removes an unintended conditional nuance and clarifies the Greek comparison with a shaved woman, while retaining the draft’s faithful treatment of the passage’s lexical ambiguities, public-reading register, and footnote anchors.
