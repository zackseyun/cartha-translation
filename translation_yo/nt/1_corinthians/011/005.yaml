id: 1CO.11.5
reference: 1 Corinthians 11:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: yo
  text: Ṣùgbọ́n gbogbo obìnrin[a] tí ń gbàdúrà tàbí tí ń sọ àsọtẹ́lẹ̀ láìbo orí rẹ̀[b] ń kó ìtìjú bá orí rẹ̀[a], nítorí pé ó jẹ́ ohun kan náà bí ẹni tí a ti fá orí rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘gbogbo aya tí ń gbàdúrà tàbí tí ń sọ àsọtẹ́lẹ̀ … ń kó ìtìjú bá ọkọ rẹ̀/orí rẹ̀.’ Ọ̀rọ̀ Gíríìkì gynē lè túmọ̀ sí ‘obìnrin’ tàbí ‘aya’; ‘orí’ náà sì lè jẹ́ orí ara tàbí kí ó ní ìtumọ̀ àpẹẹrẹ gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
    reason: alternative_reading
  - marker: b
    text: ‘Láìbo orí rẹ̀’ kò sọ irú ìbòjú náà ní pàtó. Àwọn atúmọ̀ yàtọ̀ lórí bóyá Pọ́ọ̀lù ń tọ́ka sí aṣọ ìbòjú ní pàtó tàbí sí orí tí a kò bò ní ọ̀nà gbogbogbò.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: obìnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ‘obìnrin’ tàbí ‘aya.’ Ní gbólóhùn yìí, ‘gbogbo obìnrin’ ni ó pa ìtumọ̀ ojú-ọ̀rọ̀ mọ́ láìfi ipò ìgbéyàwó kún un; a fi ‘aya’ sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: tí ó bá ń gbàdúrà tàbí sọ àsọtẹ́lẹ̀
  rationale: Èyí sọ àwọn ìṣe tí obìnrin náà ń ṣe ní àkókò náà ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: láìbo orí rẹ̀
  rationale: Èyí fi hàn pé orí rẹ̀ kò ní ìbòjú, ṣùgbọ́n kò sọ pé aṣọ ìbòjú, irun, tàbí ohun mìíràn pàtó ni a ń tọ́ka sí.
- source_word: καταισχύνει
  choice: ń kó ìtìjú bá
  rationale: Gbólóhùn yìí sọ ìtìjú tàbí ẹ̀gàn tí a mú bá ẹnì kan ní gbangba, ó sì bá àyíká ọlá àti ìtìjú mu.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: orí rẹ̀
  rationale: Ìtumọ̀ tààrà ni ‘orí rẹ̀.’ Ó tún lè tọ́ka sí orí ara tàbí sí ẹni tí a pè ní ‘orí’ rẹ̀ nínú àríyànjiyàn tó yí ẹsẹ náà ká; ìtumọ̀ náà kò yan ọ̀kan nínú wọn.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: nítorí pé ọ̀kan náà ni
  rationale: ‘Ọ̀kan náà ni’ pa agbára gbólóhùn Gíríìkì tó tẹnumọ́ ìdọ́gba mọ́ ní Yorùbá tó ṣe kedere.
- source_word: τῇ ἐξυρημένῃ
  choice: ẹni tí a ti fá orí rẹ̀
  rationale: ‘A ti fá’ fi ipò tí ó wáyé lẹ́yìn ìṣe fífá hàn, bí àkókò pípé nínú ọ̀rọ̀ Gíríìkì ṣe ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ ‘orí’ kejì nínú ‘ń kó ìtìjú bá orí rẹ̀’
  choice: A pa ọ̀rọ̀ tí kò yanju rẹ̀ mọ́ gẹ́gẹ́ bí ‘orí rẹ̀.’
  alternative: Ó lè jẹ́ orí ara rẹ̀ tàbí ‘orí’ rẹ̀ ní ìtumọ̀ ìbáṣepọ̀, ìyẹn ọkùnrin tàbí ọkọ rẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ gba ìtumọ̀ tààrà, ṣùgbọ́n àyíká ẹsẹ náà tún mú kí ìtumọ̀ àpẹẹrẹ ṣeé ṣe. A kò yanju ohun tí ọ̀rọ̀ náà kò yanju.
- issue: Irú ìbòjú tí ‘láìbo orí rẹ̀’ ń tọ́ka sí
  choice: A lò gbólóhùn gbogbogbò ‘láìbo orí rẹ̀.’
  alternative: Láìlo aṣọ ìbòjú, tàbí nípa bí irun ṣe wà.
  rationale: Ọ̀rọ̀ náà sọ pé orí kò ní ìbòjú, ṣùgbọ́n kò dá irú ìbòjú náà mọ̀. Sísọ pé aṣọ ìbòjú pàtó ni yóò fi ìtumọ̀ onítúmọ̀ kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè àdánidá mu. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A pa àìdánilójú nípa ‘obìnrin/aya,’ ‘orí,’ àti irú ìbòjú mọ́ nípasẹ̀ àwọn àlàyé ìsàlẹ̀.
