id: 1CO.11.7
reference: 1 Corinthians 11:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: yo
  text: Nítorí ọkùnrin[a] kò yẹ kí ó bo orí rẹ̀[b], níwọ̀n bí ó ti jẹ́ àwòrán àti ògo Ọlọ́run; ṣùgbọ́n obìnrin ni ògo ọkùnrin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọkọ” àti “aya” dípò “ọkùnrin” àti “obìnrin” ní gbogbo ẹsẹ yìí; àwọn ọ̀rọ̀ Gíríìkì ἀνήρ àti γυνή lè ní ọ̀kan nínú ìtumọ̀ méjèèjì yìí, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: alternative_reading
  - marker: b
    text: Tàbí “fi ìbòjú bo orí rẹ̀”; ọ̀rọ̀ Gíríìkì sọ ní gbogbogbòò pé “láti bo orí rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ / ἀνδρός
  choice: ọkùnrin
  rationale: “Ọkùnrin” ń pa ìtumọ̀ aṣojú akọ mọ́ nínú àríyànjiyàn nípa akọ àti abo. “Ọkọ” ṣeé ṣe nípa èdè Gíríìkì, ṣùgbọ́n yóò mú kí ọ̀rọ̀ náà dá lórí ìgbéyàwó ju bí àyíká ọ̀rọ̀ ṣe béèrè lọ.
- source_word: ὀφείλει
  choice: yẹ kí
  rationale: “Yẹ kí” fi ojúṣe tàbí ohun tí ó tọ́ hàn ní Yorùbá àdánidá láìsọ ọ́ di àṣẹ líle ju agbára ọ̀rọ̀ Gíríìkì lọ.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: bo orí rẹ̀
  rationale: Èyí túmọ̀ gbólóhùn náà ní tààràtà, ó sì yàgò fún “fi ìbòjú bo,” èyí tí ó lè sọ irú ohun ìbòrí kan pàtó ju ohun tí Gíríìkì sọ lọ.
- source_word: εἰκὼν
  choice: àwòrán
  rationale: “Àwòrán” ni ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ εἰκών mu, ó sì pa ìtọ́kasí sí èdè ìṣẹ̀dá mọ́ láìṣe àlàyé kún un.
- source_word: δόξα
  choice: ògo
  rationale: “Ògo” ni a lò ní ìgbà méjèèjì láti pa ìṣọ̀kan àti ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ ọ̀rọ̀ náà mọ́; “ọlá” lè dín ìtumọ̀ rẹ̀ kù.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: A pa ìbátan oníhun inú Gíríìkì mọ́ ní gbólóhùn “ògo Ọlọ́run,” láìfikún àlàyé.
- source_word: ὑπάρχων
  choice: níwọ̀n bí ó ti jẹ́
  rationale: Gbólóhùn yìí fi hàn pé jíjẹ́ àwòrán àti ògo Ọlọ́run ni ìdí fún gbólóhùn tó ṣáájú, ó sì dùn bí Yorùbá àdánidá.
- source_word: ἡ γυνὴ
  choice: obìnrin
  rationale: “Obìnrin” ń pa ìyàtọ̀ aṣojú láàárín akọ àti abo mọ́. “Aya” ṣeé ṣe nípa ọ̀rọ̀ Gíríìkì, ṣùgbọ́n kò pọn dandan nínú àyíká yìí.
theological_decisions:
- issue: Bóyá ἀνήρ àti γυνή yẹ kí a túmọ̀ sí ọkùnrin/obìnrin tàbí ọkọ/aya
  choice: ọkùnrin/obìnrin
  alternative: ọkọ/aya
  rationale: Àgbékalẹ̀ ẹsẹ náà ń ṣe ìyàtọ̀ láàárín akọ àti abo nínú ọ̀rọ̀ ìbòrí orí àti ìṣẹ̀dá. Yíyan “ọkùnrin/obìnrin” pa ìwọ̀n àríyànjiyàn náà mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé jẹ́wọ́ pé ìtumọ̀ ọkọ/aya tún ṣeé ṣe.
- issue: Bí a ṣe lè pa gbólóhùn tí kò dọ́gba pé “obìnrin ni ògo ọkùnrin” mọ́ láìrọ̀ ọ́
  choice: obìnrin ni ògo ọkùnrin
  alternative: obìnrin ń fi ògo ọkùnrin hàn
  rationale: Gíríìkì lo ἐστιν ní tààràtà. Ìtumọ̀ yìí pa agbára àti ìnira ẹ̀kọ́ ìgbàgbọ́ inú gbólóhùn náà mọ́, kò sì sọ ọ́ di àlàyé tí ó rọrùn ju orísun lọ.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti èdè tí ó yé òǹkàwé òde òní. A pa ìṣọ̀kan “ògo” mọ́ ní ibi méjèèjì, a sì fi àwọn àmì àlàyé [a] àti [b] sí ibi tí wọ́n bá ọ̀rọ̀ tí wọ́n ń ṣàlàyé mu.
