  - severity: low
    issue: “Bẹ́ẹ̀ gẹ́gẹ́ náà” jẹ́ àtúnlò díẹ̀, àti “láti máa rántí mi” túmọ̀ ète ìrántí ní ọ̀nà tí ó gbooro ju ìkọ̀lé orúkọ Gíríìkì lọ.
    rationale: “Bákan náà” jẹ́ ohun àdánidá, nígbà tí “ní ìrántí mi” pa ìṣọ̀kan ìfọkànsìn/ìrántí ti εἰς ... ἀνάμνησιν mọ́ pẹ̀lú ìtẹ́wọ́gbà Yorùbá.
