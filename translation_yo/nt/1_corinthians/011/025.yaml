revisions:
- from: Bẹ́ẹ̀ gẹ́gẹ́ náà, lẹ́yìn oúnjẹ alẹ́, ó mú ife náà, ó ní, “Ife yìí ni májẹ̀mú tuntun[a] nínú ẹ̀jẹ̀ mi. Ẹ máa ṣe èyí ní gbogbo ìgbà tí ẹ bá mu ún[b], láti máa rántí mi.”
  to: Bákan náà, lẹ́yìn oúnjẹ alẹ́, ó mú ife náà, ó ní, “Ife yìí ni májẹ̀mú tuntun[a] nínú ẹ̀jẹ̀ mi. Ẹ máa ṣe èyí ní gbogbo ìgbà tí ẹ bá mu ún[b], ní ìrántí mi.”
  rationale: A ṣàtúnṣe àlàyé ìsàlẹ̀ a láti mú ìtumọ̀ ìmọ̀-ọrọ̀ διαθήκη tọ́, láì fi ‘ogún’ tí kò jẹ́ ìtumọ̀ tó yẹ níbí kún un. A tún mú ìbẹ̀rẹ̀ gbolohun náà rọrùn, a sì lo “ní ìrántí mi” láti sún mọ́ ìkọ̀lé Gíríìkì, láì yí ìtumọ̀ tàbí ìdánimọ̀ taara ti ife náà pẹ̀lú májẹ̀mú tuntun padà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:15:28Z'
