  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fi ìtumọ̀ pàtàkì Gíríìkì hàn dáadáa: ìṣe náà bá ti búrẹ́dì mu, ó wá lẹ́yìn oúnjẹ, ife náà ni májẹ̀mú tuntun nínú ẹ̀jẹ̀ Jesu, àṣẹ náà sì jẹ́ ti ìtẹ̀síwájú ní àwọn ìgbà tí wọ́n bá ń mu ún. Ṣùgbọ́n àlàyé ìsàlẹ̀ a fi “ogún tuntun” hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn ti διαθήκη; èyí kò bá ìtumọ̀ ọ̀rọ̀ náà ní gbolohun yìí mu, ó sì lè ṣi òǹkàwé lọ sí ‘inheritance’ dípò májẹ̀mú tàbí will/testament.'
  naturalness: Ọ̀rọ̀ Yorùbá náà jẹ́ èdè boṣewa tó ṣe kedere. “Bẹ́ẹ̀ gẹ́gẹ́ náà” lè jẹ́ àtúnlò díẹ̀, nítorí náà “Bákan náà” jẹ́ ìbẹ̀rẹ̀ tó rọrùn, tó sì bá ὡσαύτως καί mu. “Ní ìrántí mi” jẹ́ ọ̀nà kíkún tó sun mọ́ εἰς τὴν ἐμὴν ἀνάμνησιν, ó sì dára fún ìforúkọsílẹ̀ Ìwé Mímọ́.
  terminology: “Májẹ̀mú tuntun” ni yíyàn tó tọ́ fún ἡ καινὴ διαθήκη nínú àyíká ìlérí májẹ̀mú àti ẹ̀jẹ̀. A yẹ kí àlàyé ìsàlẹ̀ a dín àwọn àṣàyàn rẹ̀ kù sí “tẹ́sítámẹ́ǹtì tuntun” (will/testament), kì í ṣe “ogún tuntun.”
  issues:
