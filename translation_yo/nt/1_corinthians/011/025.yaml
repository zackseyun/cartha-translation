id: 1CO.11.25
reference: 1 Corinthians 11:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: yo
  text: Bákan náà, lẹ́yìn oúnjẹ alẹ́, ó mú ife náà, ó ní, “Ife yìí ni májẹ̀mú tuntun[a] nínú ẹ̀jẹ̀ mi. Ẹ máa ṣe èyí ní gbogbo ìgbà tí ẹ bá mu ún[b], ní ìrántí mi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “tẹ́sítámẹ́ǹtì tuntun”; ṣùgbọ́n “májẹ̀mú tuntun” bá àyíká Ìwé Mímọ́ níbí mu jù.
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “nígbàkígbà tí ẹ bá mu.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìṣẹ̀lẹ̀ tí a ń tún ṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Bẹ́ẹ̀ gẹ́gẹ́ náà
  rationale: Ó fi ìṣe tí ó ṣe sí ife wé ìṣe tí ó ṣẹ̀ṣẹ̀ ṣe sí búrẹ́dì, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: τὸ ποτήριον
  choice: ife náà
  rationale: “Ife” ni ìtumọ̀ lasán tí ó ṣe kedere; kò fi èdè àkànṣe ìjọ kún ọ̀rọ̀ Gíríìkì.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: lẹ́yìn oúnjẹ alẹ́
  rationale: Ìkọ̀lé yìí tọ́ka sí àkókò lẹ́yìn jíjẹ oúnjẹ; “lẹ́yìn oúnjẹ alẹ́” bá àyíká àsè náà mu.
- source_word: λέγων
  choice: ó mú ife náà, ó ní
  rationale: “Ó ní” túmọ̀ participle náà, nígbà tí “ó mú ife náà” mú ìṣe tí a lóye láti inú ìfiwéra pẹ̀lú búrẹ́dì hàn ní Yorùbá àdánidá.
- source_word: ἡ καινὴ διαθήκη
  choice: májẹ̀mú tuntun
  rationale: “Májẹ̀mú” bá ìtàn májẹ̀mú inú Ìwé Mímọ́ àti àyíká ẹ̀jẹ̀ tó fi ìdí májẹ̀mú múlẹ̀ mu ju “ogún” tàbí “tẹ́sítámẹ́ǹtì” lọ.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: nínú ẹ̀jẹ̀ mi
  rationale: Ó pa preposition Gíríìkì mọ́ ní ọ̀nà tó sún mọ́ ọ̀rọ̀ ìpilẹ̀, láì pinnu pé ó túmọ̀ sí “nípasẹ̀” tàbí “tí ẹ̀jẹ̀ mi fi ìdí rẹ̀ múlẹ̀.”
- source_word: τοῦτο ποιεῖτε
  choice: Ẹ máa ṣe èyí
  rationale: Àṣẹ ìsinsìnyí náà àti gbólóhùn tó tẹ̀ lé e fi ìṣe tí a ń tún ṣe hàn; “ẹ máa ṣe” jẹ́ àṣẹ onítẹ̀sí ní Yorùbá.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: ní gbogbo ìgbà tí ẹ bá mu ún
  rationale: Ó fi hàn pé ọ̀rọ̀ náà kan gbogbo ìṣẹ̀lẹ̀ tí wọ́n bá tún mu ife náà; “ún” ni arọ́pò-orúkọ ohun tí a mú jáde láti inú “ife.”
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: láti máa rántí mi
  rationale: Ó sọ ète ìṣe náà gẹ́gẹ́ bí ìrántí tí a ń ṣe, ní èdè Yorùbá tó wọ́pọ̀, láì dín un kù sí àmì lásán.
theological_decisions:
- issue: Ìtumọ̀ διαθήκη nínú ọ̀rọ̀ nípa ife
  choice: májẹ̀mú
  alternative: ogún; tẹ́sítámẹ́ǹtì
  rationale: Àyíká ẹ̀jẹ̀ májẹ̀mú àti ìsọ̀rọ̀ májẹ̀mú tuntun inú Ìwé Mímọ́ ṣe àtìlẹ́yìn fún “májẹ̀mú,” ṣùgbọ́n àlàyé ìsàlẹ̀ fi ààyè sílẹ̀ fún ìtumọ̀ mìíràn ti ọ̀rọ̀ náà.
- issue: Ìbáṣepọ̀ ife náà pẹ̀lú májẹ̀mú tuntun
  choice: “Ife yìí ni májẹ̀mú tuntun nínú ẹ̀jẹ̀ mi” ni a pa mọ́ gẹ́gẹ́ bí ìdánimọ̀ tààrà
  alternative: “Ife yìí dúró fún májẹ̀mú tuntun”; “Ife yìí ni májẹ̀mú tuntun tí ẹ̀jẹ̀ mi fi ìdí rẹ̀ múlẹ̀”
  rationale: Gíríìkì sọ ìdánimọ̀ náà ní tààrà, kò sì ṣàlàyé bóyá ó jẹ́ àmì nìkan tàbí bí wíwà Kristi ṣe rí; ìtumọ̀ náà kò yan ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” púpọ̀ nítorí àwọn ọmọ-ẹ̀yìn ni àṣẹ náà ń bá sọ, a sì fi àmì ohùn síbi tí ó yẹ.
