id: 1CO.11.19
reference: 1 Corinthians 11:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: yo
  text: Nítorí ó gbọdọ̀ jẹ́ pé àwọn ẹgbẹ́ tó yapa sí ara wọn[a] pẹ̀lú wà láàárín yín, kí àwọn tí wọ́n ti ye àyẹ̀wò[b] lè farahàn ní gbangba láàárín yín pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìpínyà,” “àwọn ẹgbẹ́,” tàbí “àwọn ẹ̀ya.” Ní ìlò ọ̀rọ̀ náà nígbà tó yá, a tún lè túmọ̀ ọ́ sí “àwọn ẹ̀kọ́ àdàlù.” Ṣùgbọ́n níbí, ó ṣeé ṣe jù pé ó túmọ̀ sí àwọn ẹgbẹ́ tó ń fa ìpínyà nínú ìjọ.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ojúlówó” tàbí “àwọn tí a ti dán wò tí wọ́n sì jẹ́ ìtẹ́wọ́gbà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: ó gbọ́dọ̀ jẹ́ pé
  rationale: Èyí pa ìtumọ̀ àìní-àṣàyàn tàbí dandan mọ́, láì sọ bóyá dandan náà jẹ́ ti ìpèsè Ọlọ́run tàbí ohun tí ipò náà mú wá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé inú ẹsẹ tó ṣáájú.
- source_word: καὶ αἱρέσεις
  choice: ìpín sí ẹgbẹ́-ẹgbẹ́ ... pẹ̀lú
  rationale: Nínú àyíká ọ̀rọ̀ yìí, αἱρέσεις tọ́ka sí bí àwọn ènìyàn ṣe ń pín sí ẹgbẹ́ inú ìjọ, kì í ṣe dandan sí ẹ̀kọ́ èké gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe wá túmọ̀ sí nígbà tó yá. “Pẹ̀lú” fi καί hàn.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun náà ń ṣẹlẹ̀ nínú àwùjọ wọn.
- source_word: ἵνα
  choice: kí
  rationale: Ó lè fi ète tàbí àbájáde hàn, láì fi tipátipá yan ọ̀kan nínú méjèèjì.
- source_word: καὶ οἱ δόκιμοι
  choice: àwọn tí wọ́n ti ye àyẹ̀wò ... pẹ̀lú
  rationale: δόκιμοι ń sọ nípa àwọn tí ìdánwò ti fi hàn pé wọ́n jẹ́ ojúlówó tàbí ẹni ìtẹ́wọ́gbà. “Pẹ̀lú” tún pa καί kejì mọ́.
- source_word: φανεροὶ γένωνται
  choice: lè farahàn
  rationale: Ó fi hàn pé irú àwọn ẹni bẹ́ẹ̀ yóò wá di mímọ̀ ní gbangba.
theological_decisions:
- issue: Ìtumọ̀ αἱρέσεις
  choice: ìpín sí ẹgbẹ́-ẹgbẹ́
  alternative: àwọn ẹ̀ya ìjọ; ìyapa; ẹ̀kọ́ èké
  rationale: Àyíká àsè Olúwa àti ìyapa nínú ìjọ ń tọ́ka sí àwọn ẹgbẹ́ tó yapa sí ara wọn. Ìtumọ̀ yìí kò gbé ìtumọ̀ “heresy” ti ìgbà tó yá wọ inú ẹsẹ náà.
- issue: Agbára δεῖ
  choice: ó gbọ́dọ̀ jẹ́ pé
  alternative: kò lè ṣàì ṣẹlẹ̀; ó ṣe pàtàkì pé
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé ó jẹ́ dandan, ṣùgbọ́n kò sọ ní kedere bóyá Ọlọ́run ló pinnu rẹ̀ tàbí pé ipò ènìyàn ló mú un jẹ́ ohun tí kò lè ṣàì ṣẹlẹ̀; a pa àìdánilójú yẹn mọ́.
- issue: Ipa ἵνα
  choice: kí
  alternative: tí yóò fi jẹ́ pé
  rationale: “Kí” lè gba ìtumọ̀ ète àti àbájáde, ó sì yẹra fún yíyan ọ̀kan níbi tí ìkọ̀wé Gíríìkì kò ti fi ìyàtọ̀ náà múlẹ̀ patapata.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó níyì, ó sì rọrùn fún òǹkàwé gbogbogbòò. “Ìpín sí ẹgbẹ́-ẹgbẹ́” jẹ́ àdánidá ju lílo ọ̀rọ̀ àjèjì fún ‘faction’ lọ, “ye àyẹ̀wò” sì mú àwòrán dídán-ni-wò inú δόκιμοι jáde.
