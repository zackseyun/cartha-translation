  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: δεῖ jẹ́ ìdandan láì ṣàlàyé orísun rẹ̀; γάρ jẹ́ “Nítorí”; ìtẹnumọ́ καί méjèèjì wà; ἵνα ni “kí”; δόκιμοι ni àwọn tí wọ́n ti ye àyẹ̀wò; φανεροὶ γένωνται ni wíwá di ẹni tí a rí ní gbangba. Ṣùgbọ́n “ìpín sí ẹgbẹ́-ẹgbẹ́” kò rọrùn dáadáa gẹ́gẹ́ bí gbolohun Yorùbá, ó sì lè dà bí ìṣe pípín dípò àwọn ẹgbẹ́ ìpínyà (αἱρέσεις).'
