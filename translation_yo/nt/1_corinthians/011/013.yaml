  text: ἐν ὑμῖν αὐτοῖς κρίνατε· πρέπον ἐστὶν γυναῖκα ἀκατακάλυπτον τῷ θεῷ προσεύχεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: yo
  text: 'Ẹ dájọ́ fún ara yín: Ṣé ó yẹ kí obìnrin gbàdúrà sí Ọlọ́run láì bo orí rẹ̀?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “aya,” bí a bá lóye γυνή ní ìtumọ̀ ìgbéyàwó nínú àyíká gbooro ti apá yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: fún ara yín
  rationale: Ó sọ ìtẹnumọ́ ọ̀rọ̀ Gíríìkì ní Yorùbá àdánidá, nípa pípe àwọn ará Kọ́ríńtì láti fi ìmòye tiwọn ṣe àyẹ̀wò.
- source_word: κρίνατε
  choice: Ẹ dájọ́
  rationale: Ó pa agbára àṣẹ aorist mọ́, ó sì bá ìpè Pọ́ọ̀lù fún ìṣírò àti ìdájọ́ mu.
- source_word: πρέπον ἐστὶν
  choice: Ṣé ó yẹ
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún bíbéèrè bóyá ohun kan bá ìwà tó tọ́ tàbí ohun tó bójú mu mu.
- source_word: γυναῖκα
  choice: obìnrin
  rationale: γυνή lè túmọ̀ sí obìnrin tàbí aya; ẹsẹ yìí kò mẹ́nu kan ọkọ ní tààrà, nítorí náà ‘obìnrin’ ni àṣàyàn àkọ́kọ́ tó dára jù, nígbà tí àlàyé ìsàlẹ̀ pa ‘aya’ mọ́ gẹ́gẹ́ bí ìtumọ̀ míì tó ṣeé ṣe.
- source_word: ἀκατακάλυπτον
  choice: láìbo orí rẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘láìbò’; àyíká ẹsẹ náà fi hàn pé orí ni a ń sọ̀rọ̀ nípa rẹ̀, Yorùbá yìí sì mú un ṣe kedere láìfi ohun àjèjì kún un.
- source_word: τῷ θεῷ
  choice: sí Ọlọ́run
  rationale: Dative náà tọ́ka sí ẹni tí àdúrà ń lọ sí; ‘sí Ọlọ́run’ ni ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: προσεύχεσθαι
  choice: máa gbàdúrà
  rationale: Ó mú infinitive náà jáde ní Yorùbá àdánidá nínú ìbéèrè nípa bóyá ìṣe náà yẹ.
theological_decisions:
- issue: Ìtumọ̀ γυνή nínú ọ̀rọ̀ nípa ìbòrí orí
  choice: obìnrin
  alternative: aya
  rationale: Ẹsẹ náà kò sọ ní pàtó pé aya ní ìbáṣepọ̀ pẹ̀lú ọkọ ni, ó sì gbé ìbéèrè náà kalẹ̀ ní ọ̀nà gbogbogbò. Àkọ́lé ‘obìnrin’ kò dín ìtumọ̀ náà sí ẹ̀kọ́ nípa ìgbéyàwó, ṣùgbọ́n àlàyé ìsàlẹ̀ ṣì pa ‘aya’ mọ́ gẹ́gẹ́ bí àṣàyàn tó ṣeé ṣe nínú àyíká gbooro.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘Ṣé’ fún ìbéèrè àsọyé àdánidá, a sì fi àmì ohùn sí ibi tí ó bá yẹ.
