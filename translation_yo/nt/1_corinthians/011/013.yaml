  terminology: ‘Ẹ dájọ́,’ ‘ó yẹ,’ ‘obìnrin,’ ‘bo orí,’ ‘gbàdúrà,’ àti ‘Ọlọ́run’ bá ìforúkọsílẹ̀ Bíbélì Yorùbá òde òní mu. Àlàyé ìsàlẹ̀ náà tọ́ka dáadáa sí ìtumọ̀ mìíràn ‘aya’ láìfẹ̀sùn ìtumọ̀ kan gẹ́gẹ́ bí ẹni pé ó dájú.
