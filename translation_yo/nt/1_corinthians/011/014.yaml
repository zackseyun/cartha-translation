- from: Àní, ṣé ìṣẹ̀dá fúnra rẹ̀ kò kọ́ yín pé, bí ọkùnrin kan bá ní irun gígùn[a], àìníyì ni ó jẹ́ fún un[b]?
  to: Ṣé ìṣẹ̀dá fúnra rẹ̀[b] pàápàá kò kọ́ yín pé bí ọkùnrin kan bá ní irun gígùn[a], àìníyì ni fún un?
  rationale: Àtúnṣe náà mú οὐδὲ hàn gẹ́gẹ́ bí ‘pàápàá kò’ nínú ìbéèrè àsọ̀rọ̀yípadà, ó mú ìsọ̀rọ̀ Yorùbá rọrùn, ó sì gbe àmì [b] sí ‘ìṣẹ̀dá fúnra rẹ̀,’ níbi tí àlàyé rẹ̀ ti kan. A tún ṣàtúnṣe àlàyé [a] kí ó má bàa yí κομάω padà sí ìṣe ṣíṣe irun.
