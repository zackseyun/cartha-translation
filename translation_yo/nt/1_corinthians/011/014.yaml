source:
  edition: SBLGNT
  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: yo
  text: Ṣé ìṣẹ̀dá fúnra rẹ̀[b] pàápàá kò kọ́ yín pé bí ọkùnrin kan bá ní irun gígùn[a], àìníyì ni fún un?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ọkùnrin kan bá jẹ́ kí irun rẹ̀ gùn” tàbí “bí ọkùnrin kan bá ní irun gígùn.” Ọ̀rọ̀-ìṣe Gíríìkì náà tọ́ka sí níní tàbí gbígbé irun gígùn.
    reason: lexical_alternative
  - marker: b
    text: “Ìṣẹ̀dá fúnra rẹ̀” lè tọ́ka sí ìlànà ìṣẹ̀dá, òye àdánidá tí ó wọ́pọ̀ láàárín ènìyàn, tàbí ohun tí àṣà kan kà sí ohun tí ó bá ẹ̀dá mu; ọ̀rọ̀ Gíríìkì kò sọ ìtumọ̀ rẹ̀ di ọ̀kan nínú ìwọ̀nyí níbí.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Àní, ṣé ... kò
  rationale: Ó mú ìtẹnumọ́ àti ìbéèrè àsọ̀rọ̀yípadà inú ọ̀rọ̀ Gíríìkì jáde ní Yorùbá àdánidá.
- source_word: ἡ φύσις αὐτὴ
  choice: ìṣẹ̀dá fúnra rẹ̀
  rationale: “Fúnra rẹ̀” pa ìtẹnumọ́ αὐτή mọ́, “ìṣẹ̀dá” sì jẹ́ kí ìtumọ̀ φύσις wà ní fífẹ̀ láìfi dandan mọ́ ẹ̀kọ́ nípa ara tàbí àṣà nìkan.
- source_word: διδάσκει ὑμᾶς
  choice: kọ́ yín
  rationale: Ìtumọ̀ tààrà, tó sì wọ́pọ̀ fún iṣẹ́ ìkọ́ni tí ọ̀rọ̀-ìṣe náà ń sọ.
- source_word: ἀνὴρ
  choice: ọkùnrin kan
  rationale: Àyíká yìí ń fi akọ àti abo wé ara wọn, kì í ṣe ọkọ àti aya ní pàtó.
- source_word: ἐὰν κομᾷ
  choice: bí ọkùnrin kan bá ní irun gígùn
  rationale: Ó sọ pé ọkùnrin náà ní tàbí ń gbé irun gígùn, ó sì jẹ́ Yorùbá tó ṣe kedere àti àdánidá.
- source_word: ἀτιμία
  choice: àìníyì
  rationale: Ó mú èrò àìní ọlá tàbí ẹ̀gàn inú ἀτιμία jáde láìlo ọ̀rọ̀ tó le ju ìpilẹ̀ṣẹ̀ lọ.
- source_word: αὐτῷ ἐστιν
  choice: ni ó jẹ́ fún un
  rationale: Ó ṣe àfihàn ìsopọ̀ predikéètì àti dátífù náà ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ φύσις nínú àríyànjiyàn Pọ́ọ̀lù
  choice: ìṣẹ̀dá fúnra rẹ̀
  alternative: ìlànà ìṣẹ̀dá; òye àdánidá tí gbogbo ènìyàn ní; ohun tí àṣà kan kà sí ohun tó yẹ nípa ti ẹ̀dá
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ní pàtó bóyá Pọ́ọ̀lù ń tọ́ka sí ìlànà ẹ̀dá, òye tí ó wọ́pọ̀, tàbí ìbójúmu tí àṣà kà sí ti ẹ̀dá; ìtumọ̀ náà àti àlàyé ẹsẹ̀ pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. Ìbéèrè àsọ̀rọ̀yípadà àti ìtẹnumọ́ inú Gíríìkì ni a pa mọ́.
