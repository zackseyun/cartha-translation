  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: yo
  text: Mo sì yìn yín, nítorí ẹ rántí mi nínú ohun gbogbo, ẹ sì di àwọn àṣà náà mú ṣinṣin, gẹ́gẹ́ bí mo ti fi wọ́n lé yín lọ́wọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ẹ̀kọ́” tàbí “àwọn ìlànà”; ní Gíríìkì, “àwọn àṣà,” ìyẹn ni, àwọn ohun tí a fi léni lọ́wọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: Mo yìn yín
  rationale: Ó túmọ̀ sí láti yìn tàbí gbóríyìn fún; ọ̀rọ̀ yìí bá ìṣírí rere tí Pọ́ọ̀lù fi bẹ̀rẹ̀ abala náà mu.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, ó jẹ́ àsopọ̀ ìyípadà pẹ̀lẹ́, kì í ṣe ìtakora líle; “sì” jẹ́ ọ̀nà àdánidá láti so gbólóhùn mọ́ ọ̀rọ̀ tó ṣáájú.
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀; “yín” fi ọ̀pọ̀ hàn ní Yorùbá.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí Pọ́ọ̀lù fi yìn wọn.
- source_word: πάντα
  choice: nínú ohun gbogbo
  rationale: Ó pa ìwọ̀n gbòòrò ti ọ̀rọ̀ Gíríìkì mọ́ láì dín in sí “nígbà gbogbo.”
- source_word: μου μέμνησθε
  choice: ẹ rántí mi
  rationale: Ìtumọ̀ àdánidá ní Yorùbá, ó sì lè gbé èrò ìrántí tó ń bá a lọ.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu tó wà láàárín bí Pọ́ọ̀lù ṣe fi wọ́n lé wọn lọ́wọ́ àti bí wọ́n ṣe ń pa wọ́n mọ́ hàn.
- source_word: παρέδωκα
  choice: mo fi lé yín lọ́wọ́
  rationale: Àpólà yìí túmọ̀ sí fífi ohun tí a gbà tàbí mọ̀ ránṣẹ́ sí ẹlòmíràn; ó jẹ́ Yorùbá àdánidá fún ìranṣẹ́ ẹ̀kọ́ tàbí ìlànà.
- source_word: τὰς παραδόσεις
  choice: àwọn àṣà tí mo fi lé yín lọ́wọ́
  rationale: “Àṣà” pa ìtumọ̀ ohun tí a ń sọ̀kalẹ̀ láti ọ̀dọ̀ ẹni kan dé ọ̀dọ̀ ẹlòmíràn mọ́; gbólóhùn àfikún náà yà á sọ́tọ̀ kúrò lọ́dọ̀ àṣà àwùjọ lásán.
- source_word: κατέχετε
  choice: ẹ di ... mú ṣinṣin
  rationale: Ó sọ ìdúróṣinṣin nínú pípa ohun tí a gbà mọ́ ní Yorùbá òde òní.
theological_decisions:
- issue: Ìtumọ̀ παραδόσεις nínú àyíká ìjọ
  choice: àwọn àṣà tí mo fi lé yín lọ́wọ́
  alternative: àwọn ẹ̀kọ́ tàbí àwọn ìlànà
  rationale: Yíyan “àṣà” pa ẹ̀ka ọ̀rọ̀ Gíríìkì mọ́—ohun tí a fi ránṣẹ́ tàbí léni lọ́wọ́—láì sọ ọ́ di ẹ̀kọ́ gbogbogbòò, láì sì fi ẹ̀kọ́ ìsìn ẹgbẹ́ kan sí i. Àlàyé tó tẹ̀ lé e mú kó ṣe kedere pé ohun tí Pọ́ọ̀lù fúnra rẹ̀ fi lé wọn lọ́wọ́ ni.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. A lo “ẹ/yín” láti fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀. “Mo sì” jẹ́ àsopọ̀ pẹ̀lẹ́, kì í ṣe ọ̀rọ̀ àkókò bí “nísinsìnyí.”
