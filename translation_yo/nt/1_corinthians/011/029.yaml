id: 1CO.11.29
reference: 1 Corinthians 11:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: yo
  text: Nítorí ẹni tí ó ń jẹ, tí ó sì ń mu, ń jẹ, ó sì ń mu ìdájọ́ wá sórí ara rẹ̀, láìṣàyẹ̀wò ara náà dáadáa.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní ‘ara Olúwa’ dípò ‘ara náà.’
    reason: textual_variant
  - marker: b
    text: A tún lè tú u sí ‘láìfi ara náà sọ́tọ̀.’ Èyí lè tọ́ka sí mímọ̀ ìjẹ́pàtàkì Oúnjẹ Alẹ́ ti Olúwa, sí ìjọ àwọn onígbàgbọ́ tí ó péjọ gẹ́gẹ́ bí ara, tàbí sí àwọn méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: ìdájọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìdájọ́ tàbí ìpinnu adájọ́. “Ìdájọ́” gbòòrò ju “ìdálẹ́bi” lọ, ó sì bá àyíká ọ̀rọ̀ mu, níbi tí ẹsẹ tó tẹ̀ lé e ti ń sọ nípa ìbáwí Ọlọ́run, kì í ṣe dandan ìdálẹ́bi ayérayé.
- source_word: ἑαυτῷ
  choice: wá sórí ara rẹ̀
  rationale: Ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá fún àbájáde búburú tí ẹni náà mú bá ara rẹ̀.
- source_word: διακρίνων
  choice: fi ìyàtọ̀ sí
  rationale: Ó pa èrò ìṣe ìyàtọ̀ tàbí ṣíṣe àyẹ̀wò tó yẹ mọ́, láìfi ìtumọ̀ kan ṣoṣo lé ọ̀rọ̀ náà lórí.
- source_word: τὸ σῶμα
  choice: ara náà
  rationale: A pa ọ̀rọ̀ Gíríìkì tó ní ‘ara’ nìkan mọ́, láìṣàfikún ‘Olúwa,’ kí ìṣòro ìtumọ̀ tó wà láàárín ara Kristi nínú oúnjẹ náà àti ìjọ gẹ́gẹ́ bí ara Kristi lè dúró.
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: ẹni tí ó ń jẹ, tí ó sì ń mu
  rationale: Èyí tú ìsọ̀rí aláápọn onípò-orúkọ náà sí Yorùbá àdánidá, ó sì pa ìtumọ̀ ẹni-kọ̀ọ̀kan gbogbogbò mọ́.
- source_word: μὴ διακρίνων
  choice: láìfi ìyàtọ̀ sí
  rationale: Ìsọ̀rọ̀ ‘láì-’ tẹ̀lé ẹ̀ka participle Gíríìkì pẹ́kípẹ́kí, ó sì fi hàn pé jíjẹ àti mímu ìdájọ́ ní ìsopọ̀ pẹ̀lú àìṣe ìyàtọ̀ tó yẹ.
theological_decisions:
- issue: Ìtumọ̀ ‘ara náà’ nínú àyíká Oúnjẹ Alẹ́ Olúwa
  choice: Pa ‘ara náà’ mọ́ láìsọ bóyá ara Kristi, ara àwọn onígbàgbọ́ tí ó péjọ, tàbí àwọn méjèèjì ni.
  alternative: ‘ara Olúwa’ tàbí ‘ara àwọn onígbàgbọ́’
  rationale: Gíríìkì sọ ‘ara náà’ nìkan. Àyíká ọ̀rọ̀ náà ń tọ́ka sí Jesu àti sí bí àwọn ará Kọ́ríńtì ṣe ń hù sí ara wọn, nítorí náà a kò gbọdọ̀ yanju ìforígbárí ìtumọ̀ náà nínú ìtumọ̀.
- issue: Agbára ọ̀rọ̀ κρίμα
  choice: ìdájọ́
  alternative: ìdálẹ́bi
  rationale: Ẹsẹ 32 yà ìbáwí àwọn onígbàgbọ́ sọ́tọ̀ kúrò nínú ìdálẹ́bi ayé; nítorí náà ‘ìdájọ́’ kò sọ ohun tí ọ̀rọ̀ náà kò fi dandan sọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ìgbàlódé ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àtúnsọ ‘jẹ…mu’ ni a pa mọ́ nítorí ìtẹnumọ́ àti ìwọ̀ntúnwọ̀nsì inú Gíríìkì.
