  naturalness: Gbólóhùn àkọ́kọ́ jẹ́ Yorùbá tó ṣeé lóye. Síbẹ̀, ‘láìfi ìyàtọ̀ sí ara náà’ kò rọrùn ní ìtumọ̀ tí a fẹ́ níbí; ‘láìṣàyẹ̀wò ara náà dáadáa’ jẹ́ ìsọ̀rọ̀ Yorùbá boṣewa tó hàn gbangba síi.
  terminology: ‘Ìdájọ́’ yẹ fún κρίμα, ó sì yẹ kí a má lo ‘ìdálẹ́bi’ nínú ẹsẹ yìí. ‘Ara náà’ pa ìfojúsùn-ìtumọ̀ τὸ σῶμα mọ́. Àkọsílẹ̀ aṣàyàn yẹ kí ó lo ọ̀rọ̀ tí ó lè tú διακρίνων sí ‘fi ... sọ́tọ̀,’ dípò ‘ṣe ìyàtọ̀ nípa,’ tí ó kéré ní ìbámu pẹ̀lú ọ̀rọ̀ Gíríìkì náà.
