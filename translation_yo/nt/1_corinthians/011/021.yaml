id: 1CO.11.21
reference: 1 Corinthians 11:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἕκαστος γὰρ τὸ ἴδιον δεῖπνον προλαμβάνει ἐν τῷ φαγεῖν, καὶ ὃς μὲν πεινᾷ, ὃς δὲ μεθύει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: yo
  text: Nítorí nígbà tí ẹ bá ń jẹun, olúkúlùkù a máa kọ́kọ́ jẹ oúnjẹ alẹ́ tirẹ̀[a]; ebi ń pa ẹnì kan, ẹlòmíràn sì ń mutí yó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olúkúlùkù a máa gba oúnjẹ alẹ́ tirẹ̀ ṣáájú àwọn ẹlòmíràn.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè tẹnu mọ́ mímú ohun kan ṣáájú tàbí títẹ̀ síwájú láì dúró de àwọn ẹlòmíràn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ebi ń pa ẹnì kan, ẹlòmíràn sì ti mutí yó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ó pa agbára ìpínkiri ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ‘ẹnì kọ̀ọ̀kan.’
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìbáwí inú àyíká ọ̀rọ̀ gẹ́gẹ́ bí àlàyé ìdí rẹ̀.
- source_word: τὸ ἴδιον δεῖπνον
  choice: oúnjẹ alẹ́ tirẹ̀
  rationale: ‘Oúnjẹ alẹ́’ fi ìtumọ̀ δεῖπνον hàn, ‘tirẹ̀’ sì tẹnu mọ́ ohun ìní aládàáni ní ìyàtọ̀ sí oúnjẹ àjọṣe.
- source_word: προλαμβάνει
  choice: a máa kọ́kọ́ mú ... jẹ láì dúró de àwọn ẹlòmíràn
  rationale: Ó mú ìtumọ̀ ṣíṣe ohun ṣáájú tàbí títẹ̀ síwájú láì dúró de ẹlòmíràn jáde ní Yorùbá tó ṣe kedere, láì fi ọ̀kan ṣoṣo nínú àwọn ìtumọ̀ náà múlẹ̀ nínú àkọ́kọ́.
- source_word: ἐν τῷ φαγεῖν
  choice: nígbà tí ẹ bá ń jẹun
  rationale: Ó tú ìlànà ọ̀rọ̀ aláìlópin tí ἐν darí gẹ́gẹ́ bí àsìkò, ní ọ̀nà Yorùbá àdánidá láì fi ‘àsìkò láti jẹun’ kún un.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: ẹnì kan ... ẹlòmíràn
  rationale: Ó fi ìyàtọ̀ tó wà láàárín àwọn olùkópa méjì tàbí ẹgbẹ́ méjì hàn ní ṣókí.
- source_word: πεινᾷ
  choice: ebi ń pa
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ipò jíjẹ́ ẹni tí ebi ń pa.
- source_word: μεθύει
  choice: ń mutí yó
  rationale: Ó sọ ìmutípara gidi tí ọ̀rọ̀-ìṣe náà tọ́ka sí, kò sì rọ ìtumọ̀ náà sí àjẹjù lásán.
theological_decisions:
- issue: Ìtọ́kasí ẹnì kọ̀ọ̀kan nínú gbolohun ẹyọ
  choice: olúkúlùkù ... tirẹ̀
  alternative: gbogbo ènìyàn ... tiwọn
  rationale: Yorùbá kò pín arọ́pò-orúkọ ẹnìkẹta sí akọ àti abo. ‘Olúkúlùkù ... tirẹ̀’ pa ẹyọ ìpínkiri Gíríìkì mọ́ láì fi akọ tàbí abo tí èdè Yorùbá kò béèrè kún un.
- issue: Irú àṣìṣe tó wáyé ní Oúnjẹ Alẹ́ Olúwa
  choice: ń mutí yó
  alternative: ti mutí yó
  rationale: μεθύει lè túmọ̀ sí pé ẹni náà ń dé ipò ìmutípara tàbí ó ti wà nínú rẹ̀. Àkọ́kọ́ pa ipa ọ̀rọ̀-ìṣe ìsinsìnyí mọ́, àkọsílẹ̀ ìsàlẹ̀ sì jẹ́ kí àṣàyàn ipò náà hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún bí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì lo ‘ẹ’ ọ̀pọ̀ ènìyàn fún àwùjọ tí Pọ́ọ̀lù ń bá sọ̀rọ̀.
