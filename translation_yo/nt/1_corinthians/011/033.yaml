id: 1CO.11.33
reference: 1 Corinthians 11:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin arákùnrin mi[a], nígbà tí ẹ bá péjọ láti jẹun, ẹ dúró de ara yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin arákùnrin àti arábìnrin mi”; Gíríìkì lo ọ̀rọ̀ akọ ní ọ̀pọ̀, ẹni tí ó sábà máa ń bá gbogbo ìjọ sọ̀rọ̀, títí kan àwọn obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Nítorí náà
  rationale: Ó jẹ́ àsopọ̀ ìparí èrò tí ó fa àbájáde láti inú ìbáwí tó ṣáájú; ‘Nítorí náà’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ìtumọ̀ náà mọ́.
- source_word: ἀδελφοί μου
  choice: ẹ̀yin arákùnrin mi
  rationale: Ọ̀rọ̀ náà jẹ́ ìpè ní ọ̀pọ̀, pẹ̀lú arọ́pò-orúkọ ohun-ìní; ‘ẹ̀yin arákùnrin mi’ pa ìrísí akọ inú Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé gbogbo ìjọ ni ó lè kàn.
- source_word: συνερχόμενοι
  choice: nígbà tí ẹ bá péjọ
  rationale: Participle náà ń sọ ipò tàbí àkókò tí àṣẹ náà kan; gbolohun yìí jẹ́ ti Yorùbá àdánidá, ó sì bá èdè péjọpọ̀ inú orí náà mu.
- source_word: εἰς τὸ φαγεῖν
  choice: láti jẹun
  rationale: Àkójọpọ̀ preposition àti articular infinitive ń sọ ète; ‘láti jẹun’ mú ìtumọ̀ náà jáde ní ṣókí láì sọ irú oúnjẹ náà ní pàtó ju orísun lọ.
- source_word: ἀλλήλους
  choice: ara yín
  rationale: Arọ́pò-orúkọ àsọdápọ̀ náà túmọ̀ sí ‘ọ̀kan fún èkejì’; ní Yorùbá, ‘ara yín’ jẹ́ ọ̀nà àdánidá lẹ́yìn ‘dúró de’.
- source_word: ἐκδέχεσθε
  choice: ẹ dúró de
  rationale: Nínú àyíká ọ̀rọ̀, níbi tí àwọn kan ti ń jẹun ṣáájú àwọn mìíràn, ìtumọ̀ tó ṣeé ṣe jù ni pé kí wọ́n dúró de àwọn ẹlòmíràn; ọ̀rọ̀ náà tún lè ní ìmọ̀ ‘gbà’ tàbí ‘káàbọ̀,’ ṣùgbọ́n àyíká ẹsẹ̀ 21 àti 33 ṣe àtìlẹ́yìn fún ‘dúró de.’
theological_decisions:
- issue: Ìpè akọ aṣojú nínú ἀδελφοί
  choice: Pa ‘ẹ̀yin arákùnrin mi’ mọ́ nínú ẹsẹ̀, kí àlàyé ìsàlẹ̀ ṣàlàyé agbára ìtumọ̀ tó lè kan akọ àti abo.
  alternative: ‘ẹ̀yin arákùnrin àti arábìnrin mi’
  rationale: Gíríìkì lo ọ̀pọ̀ akọ ní gírámà, bí ó tilẹ̀ jẹ́ pé ó sábà máa ń tọ́ka sí gbogbo ìjọ, títí kan àwọn obìnrin. Ìtumọ̀ yìí pa ìrísí orísun mọ́ láì sẹ́ agbára àkópọ̀ rẹ̀.
translation_notes:
  register: Èdè Yorùbá àpéjọ tó mọ́gbọ́n dání, tó ní iyì, tó sì ṣeé yé fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá; àṣẹ ọ̀pọ̀ ‘ẹ dúró’ àti ‘ara yín’ jẹ́ kedere, kò sì fi ẹ̀kọ́ ẹ̀sìn ẹ̀gbẹ́ kan kún orísun.
