  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: yo
  text: Gbogbo ọkùnrin tí ń gbàdúrà tàbí tí ń sọ àsọtẹ́lẹ̀ pẹ̀lú ohun kan lórí orí rẹ̀, ń kó ìtìjú bá orí rẹ̀[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà ìtumọ̀ ìbílẹ̀, “tí ó bo orí rẹ̀.” Ní ti gidi, Gíríìkì náà lò ọ̀rọ̀ kan tó ní ìtumọ̀ “ní ohun kan láti orí sọ̀ kalẹ̀”; kò sì sọ irú ohun ìbòrí náà ní pàtó.
    reason: lexical_alternative
  - marker: b
    text: “Orí rẹ̀” lè túmọ̀ sí orí ara rẹ̀ ní ti gidi, ṣùgbọ́n ó tún lè jẹ́ ìró ìtọ́kasí sí ìlò “orí” fún ìbáṣepọ̀ nínú àyíká ọ̀rọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: Gbogbo ọkùnrin
  rationale: ἀνήρ lè túmọ̀ sí ọkùnrin tàbí ọkọ ní ìbámu pẹ̀lú àyíká ọ̀rọ̀. Níhìn-ín gbólóhùn náà jẹ́ ti gbogbo ọkùnrin, ó sì bá ‘gbogbo obìnrin’ ní ẹsẹ tó tẹ̀ lé mu; ‘gbogbo ọkùnrin’ kò fi ìtumọ̀ ọkọ-aya kan kún ọ̀rọ̀ náà láìdábọ̀.
- source_word: προσευχόμενος
  choice: tí ó bá ń gbàdúrà
  rationale: Participle ìsinsìnyí náà fi ọkùnrin tí ó wà nínú iṣẹ́ àdúrà hàn. Ìlò ‘ń’ pa ìṣe tí ń lọ lọ́wọ́ mọ́ ní Yorùbá àdánidá.
- source_word: προφητεύων
  choice: tàbí tí ó ń sọ àsọtẹ́lẹ̀
  rationale: Ọ̀rọ̀ náà tọ́ka sí sísọ ọ̀rọ̀ àsọtẹ́lẹ̀. ‘Sọ àsọtẹ́lẹ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì yàgò fún àlàyé àfikún.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: nígbà tí ohun kan wà lórí orí rẹ̀
  rationale: Gíríìkì náà túmọ̀ ní ti gidi sí níní ohun kan lórí tàbí sọ̀ kalẹ̀ láti orí, kò sì dárúkọ ohun ìbòrí pàtó. Yíyan yìí pa àìsọ pàtó náà mọ́, ó sì ṣeé lóye ní Yorùbá.
- source_word: καταισχύνει
  choice: ń tàbùkù sí
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí mímú ẹ̀gàn, ìtìjú, tàbí àìbọ̀wọ̀ wá bá ẹnì kan. ‘Tàbùkù sí’ jẹ́ èdè Yorùbá àdánidá tó mú ìtumọ̀ àìbọ̀wọ̀ àti ìtìjú náà jáde.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: orí rẹ̀
  rationale: ‘Orí rẹ̀’ pa àìṣe kedere mọ́ bóyá orí ara ọkùnrin náà ni tàbí ẹni tí a pè ní ‘orí’ rẹ̀ nínú àyíká ọ̀rọ̀.
theological_decisions:
- issue: Bóyá κεφαλή nínú apá ìkẹyìn jẹ́ orí ara ní ti gidi tàbí ‘orí’ ní ìbáṣepọ̀
  choice: Pa àìṣe kedere náà mọ́ pẹ̀lú ‘orí rẹ̀’
  alternative: ‘orí ara rẹ̀’ tàbí ‘ẹni tí í ṣe orí rẹ̀’
  rationale: 'Ọ̀rọ̀ Pọ́ọ̀lù lè ní ìró méjèèjì: orí ara àti ìlò ‘orí’ fún ìbáṣepọ̀ nínú àwọn ẹsẹ tó yí i ká. Kí ìtumọ̀ má ṣe yanju ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ Gíríìkì kò yanju.'
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àwọn àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa àìṣe kedere àti ìró méjì ti ọ̀rọ̀ Gíríìkì mọ́.
