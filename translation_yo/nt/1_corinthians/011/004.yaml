  terminology: “Ọkùnrin,” “gbàdúrà,” àti “sọ àsọtẹ́lẹ̀” yẹ. “Orí rẹ̀” ni a pa mọ́ láti má ṣe pinnu bóyá orí ara ni nìkan tàbí ìró ìtọ́kasí sí ìlò “orí” nínú àyíká.
  issues:
