  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí gbogbo ọkùnrin tí ń gbàdúrà tàbí tí ń sọ àsọtẹ́lẹ̀, àti pé ó pa àìdájú ohun tí κατὰ κεφαλῆς ἔχων ń sọ nípa ìbòrí mọ́. Ṣùgbọ́n “ń tàbùkù sí” kì í ṣe ọ̀nà tó péye jù lọ fún καταισχύνει nínú ọ̀rọ̀ yìí; ó lè dún bí ìfọ̀rọ̀wérọ̀ tàbí ìbújẹ, dípò mímú ìtìjú/dídín ọlá ẹni kù.
