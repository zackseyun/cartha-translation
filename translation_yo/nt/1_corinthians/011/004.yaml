- from: Gbogbo ọkùnrin tí ó bá ń gbàdúrà tàbí tí ó ń sọ àsọtẹ́lẹ̀ nígbà tí ohun kan wà lórí orí rẹ̀, ń tàbùkù sí orí rẹ̀[a][b].
  to: Gbogbo ọkùnrin tí ń gbàdúrà tàbí tí ń sọ àsọtẹ́lẹ̀ pẹ̀lú ohun kan lórí orí rẹ̀, ń kó ìtìjú bá orí rẹ̀[a][b].
  rationale: A rọ́pò ọ̀rọ̀ tó lè yí ìtumọ̀ καταισχύνει sí ìbújẹ pẹ̀lú “ń kó ìtìjú bá,” a sì mú ìṣọ̀kan àwọn participle náà dára sí i ní Yorùbá. Ìtumọ̀ “pẹ̀lú ohun kan lórí orí rẹ̀” pa ohun ìbòrí tí Gíríìkì kò dárúkọ mọ́, nígbà tí àlàyé ìsàlẹ̀ a ń fi yíyàn ìbílẹ̀ àti ìdí àìdájú ọ̀rọ̀ náà hàn. Àlàyé b pa ìró méjì “orí” mọ́ láìpinnu ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:15:12Z'
