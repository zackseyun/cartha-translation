id: 1CO.11.15
reference: 1 Corinthians 11:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γυνὴ δὲ ἐὰν κομᾷ, δόξα αὐτῇ ἐστιν; ὅτι ἡ κόμη ἀντὶ περιβολαίου ⸀δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: yo
  text: Ṣùgbọ́n bí obìnrin[a] bá ní irun gígùn, ṣé kì í ṣe ògo fún un ni? Nítorí a ti fi irun rẹ̀ fún un dípò ìbòrí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ‘aya,’ bí àyíká ọ̀rọ̀ bá ṣe pinnu.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí ‘gẹ́gẹ́ bí ìbòrí.’ Ọ̀rọ̀-atọ́ka Gíríìkì náà lè sọ ìbámu tàbí ìrọ́pò; gbólóhùn yìí nìkan kò pinnu bóyá irun náà fúnra rẹ̀ ni ìbòrí tàbí pé a fi í fún obìnrin ní ìbámu pẹ̀lú ìbòrí kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: obìnrin
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ‘obìnrin’ tàbí ‘aya’ gẹ́gẹ́ bí àyíká ọ̀rọ̀; gbólóhùn yìí jẹ́ ọ̀rọ̀ gbogbogbò, nítorí náà ‘obìnrin’ bá a mu jù.
- source_word: κομᾷ
  choice: ní irun gígùn
  rationale: Ọ̀rọ̀-ìṣe náà ń tọ́ka sí níní tàbí gbígbé irun gígùn, kì í ṣe níní irun lásán.
- source_word: δόξα
  choice: ògo
  rationale: ‘Ògo’ pa agbára ọ̀rọ̀ Gíríìkì mọ́, ó sì lè tọ́ka sí ohun tí ń mú ọlá wá fún ẹni.
- source_word: κόμη
  choice: irun
  rationale: Ọ̀rọ̀ náà túmọ̀ sí irun orí, ó sábà máa ń ní ìtumọ̀ irun tí ó gùn; ọ̀rọ̀-ìṣe tó ṣáájú ti sọ gígùn rẹ̀ di mímọ̀.
- source_word: ἀντί
  choice: dípò
  rationale: ‘Dípò’ ṣàfihàn ìtumọ̀ ìrọ́pò tàbí ìbámu pẹ̀lú ohun mìíràn, láìfi tipátipá parí bí ìbáṣepọ̀ náà ṣe rí.
- source_word: περιβολαίου
  choice: ìbòrí
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ gbogbogbò fún ohun tí a fi ń bo ara tàbí orí; ‘ìbòrí’ kò dín un kù sí ìbòjú tàbí aṣọ kan pàtó.
- source_word: δέδοται
  choice: a ti fi ... fún un
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe àti ipò tí ó jẹ́ àbájáde ohun tí a ti ṣe mọ́, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá περιβόλαιον yẹ kí a túmọ̀ rẹ̀ ní pàtó sí aṣọ ìbòrí orí, kí a sì fi irun náà hàn gẹ́gẹ́ bí gbogbo ìbòrí tí a ń béèrè nínú ẹsẹ yìí.
  choice: Lo ọ̀rọ̀ gbogbogbò ‘ìbòrí,’ kí a má sì fi ìtumọ̀ náà dá àríyànjiyàn tó gbòòrò sí i parí.
  alternative: ‘aṣọ ìbòrí orí’ tàbí ‘ìbòjú’
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò ju ‘ìbòjú’ lọ. ‘Ìbòrí’ pa àìdánilójú ọ̀rọ̀ náà mọ́ nípa bóyá irun fúnra rẹ̀ ń ṣiṣẹ́ gẹ́gẹ́ bí ìbòrí tàbí a fi í fún obìnrin ní ìbámu pẹ̀lú ìbòrí mìíràn.
- issue: Bóyá apá àkọ́kọ́ ẹsẹ náà jẹ́ gbólóhùn ìjẹ́rìí tàbí ìbéèrè àsọyé.
  choice: 'Ṣe é ní ìbéèrè àsọyé: ‘ṣé kì í ṣe ògo fún un ni?’'
  alternative: ‘ògo ni ó jẹ́ fún un’
  rationale: Àmì ìbéèrè inú ẹ̀dà SBLGNT àti ìṣàn àwọn ìbéèrè àsọyé inú àyíká ẹsẹ 14–15 ṣe àtìlẹ́yìn fún ìbéèrè; ìtumọ̀ pàtàkì náà ṣì jẹ́ pé irun gígùn jẹ́ ògo fún obìnrin.
translation_notes:
  register: Yorùbá àgbàlágba tí ó bójú mu, tí ó sì rọrùn fún òǹkàwé òde òní. A lo ‘ṣé kì í ṣe ... ni?’ fún ìbéèrè àsọyé àdánidá, ‘ní irun gígùn’ fún κομᾷ, àti ‘ìbòrí’ gẹ́gẹ́ bí ọ̀rọ̀ tí kò ní ààlà ẹ̀kọ́ ìsìn kan pàtó.
