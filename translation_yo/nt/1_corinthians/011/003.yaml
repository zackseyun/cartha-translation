id: 1CO.11.3
reference: 1 Corinthians 11:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: yo
  text: Ṣùgbọ́n mo fẹ́ kí ẹ mọ̀ pé orí[a] olúkúlùkù ọkùnrin ni Mèsáyà, orí obìnrin sì ni ọkùnrin[b], orí Mèsáyà sì ni Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, a lè lóye “orí” gẹ́gẹ́ bí “orisun” tàbí “ẹni tó ní àṣẹ lórí”; àyọkà pàtàkì pa àwòrán ọ̀rọ̀ Gíríìkì náà mọ́.
    reason: lexical_alternative
  - marker: b
    text: “Obìnrin” àti “ọkùnrin” níbí tún lè túmọ̀ sí “aya” àti “ọkọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω
  choice: mo fẹ́
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìfẹ́ Pọ́ọ̀lù ní àkókò yìí, ó sì pa agbára ọ̀rọ̀ ẹni-kìíní mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tàbí ìyàtọ̀ díẹ̀ hàn sí ohun tí a sọ ṣáájú.
- source_word: ὑμᾶς εἰδέναι
  choice: kí ẹ mọ̀
  rationale: Àpólà yìí túmọ̀ sí pé Pọ́ọ̀lù fẹ́ kí àwọn olùgbọ́ rẹ̀ ní ìmọ̀ nípa ohun tó tẹ̀ lé; “ẹ” fi hàn pé ọ̀pọ̀ ènìyàn ni ó ń bá sọ̀rọ̀.
- source_word: παντὸς ἀνδρὸς
  choice: olúkúlùkù ọkùnrin
  rationale: Ó pa ìtumọ̀ gbogbogbò ti πᾶς àti ìtumọ̀ ἀνήρ gẹ́gẹ́ bí “ọkùnrin” mọ́.
- source_word: κεφαλή
  choice: orí
  rationale: “Orí” ni ìtumọ̀ tààrà ti àwòrán ọ̀rọ̀ Gíríìkì; a kò yàn láàárín “orisun” àti “ẹni tó ní àṣẹ lórí” nínú ọ̀rọ̀ pàtàkì.
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, nítorí náà “Mèsáyà” ló yẹ, ó sì bá ìlànà iṣẹ́ náà mu.
- source_word: γυναικός
  choice: obìnrin
  rationale: γυνή lè túmọ̀ sí “obìnrin” tàbí “aya”; ọ̀rọ̀ gbogbogbò ni a lò nínú àyọkà pàtàkì, a sì fi ìtumọ̀ tọkọtaya sínú àlàyé ìsàlẹ̀.
- source_word: ὁ ἀνήρ
  choice: ọkùnrin
  rationale: ἀνήρ lè túmọ̀ sí “ọkùnrin” tàbí “ọkọ”; “ọkùnrin” pa ìṣòro yíyan ìtumọ̀ nínú àyíká ọ̀rọ̀ náà mọ́, nígbà tí àlàyé ìsàlẹ̀ sọ ọ̀nà kejì.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu fún θεός.
theological_decisions:
- issue: Ìtumọ̀ κεφαλή nínú àwọn gbólóhùn mẹ́tẹ̀ẹ̀ta
  choice: A pa àwòrán ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí “orí.”
  alternative: “orisun” tàbí “ẹni tó ní àṣẹ lórí”
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ lo àwòrán “orí,” ìtumọ̀ rẹ̀ sì jẹ́ ohun tí a ń jiyàn lé lórí. Títúmọ̀ rẹ̀ ní tààrà pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ náà mọ́ láìfi ìtumọ̀ kan lé e lórí.
- issue: Bóyá ἀνήρ àti γυνή túmọ̀ sí ọkùnrin/obìnrin tàbí ọkọ/aya
  choice: A lo “ọkùnrin” àti “obìnrin” nínú àyọkà pàtàkì.
  alternative: “ọkọ” àti “aya”
  rationale: Ìṣètò àwọn gbólóhùn tó jọra ṣe àtìlẹ́yìn fún ìtumọ̀ gbogbogbò, ṣùgbọ́n àwọn ọ̀rọ̀ náà lè tọ́ka sí tọkọtaya; àlàyé ìsàlẹ̀ pa ọ̀nà kejì yẹn mọ́.
- issue: Ìbáṣepọ̀ gbólóhùn ìkẹyìn pẹ̀lú ẹ̀kọ́ nípa Mèsáyà àti Ọlọ́run
  choice: A túmọ̀ ọ́ ní tààrà pé “orí Mèsáyà sì ni Ọlọ́run.”
  alternative: Àtúnsọ tó ṣàlàyé rẹ̀ gẹ́gẹ́ bí ipò iṣẹ́ nìkan
  rationale: Ìtumọ̀ tààrà pa ọ̀rọ̀ náà mọ́ bí a ṣe kọ ọ́, láìrẹ̀ ẹ́ kù tàbí fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú gbólóhùn náà kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ẹ” fún ọ̀pọ̀ ènìyàn, kì í ṣe gẹ́gẹ́ bí ọ̀rọ̀ ọ̀wọ̀ sí ẹni kan.
