id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: yo
  text: Nítorí gẹ́gẹ́ bí obìnrin ti wá láti ara ọkùnrin,[a] bẹ́ẹ̀ náà ni ọkùnrin ti wá nípasẹ̀ obìnrin; ṣùgbọ́n ohun gbogbo wá láti ọ̀dọ̀ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “aya” àti “ọkọ,” bí a bá ka àyíká ọ̀rọ̀ náà sí èyí tó dá lórí ìgbéyàwó dípò ìbáṣepọ̀ ọkùnrin àti obìnrin lápapọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Nítorí gẹ́gẹ́ bí
  rationale: Ó pa ìtumọ̀ ìdí tí γάρ ń fi hàn mọ́, ó sì bẹ̀rẹ̀ ìfiwéra ὥσπερ lọ́nà àdánidá ní Yorùbá.
- source_word: ἡ γυνή
  choice: obìnrin
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí obìnrin lápapọ̀, bí ó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí aya.
- source_word: ἐκ τοῦ ἀνδρός
  choice: wá láti ara ọkùnrin
  rationale: ἐκ ń fi orísun hàn; ‘láti ara’ tún mú ìtọ́kasí sí ìṣẹ̀dá obìnrin láti ara ọkùnrin yé kedere.
- source_word: ὁ ἀνήρ
  choice: ọkùnrin
  rationale: A yan ìtumọ̀ gbogbogbò ‘ọkùnrin’ nítorí ìbáramu rẹ̀ pẹ̀lú ‘obìnrin,’ bí ọ̀rọ̀ náà tilẹ̀ tún lè túmọ̀ sí ọkọ.
- source_word: διὰ τῆς γυναικός
  choice: nípasẹ̀ obìnrin
  rationale: διά pẹ̀lú genitive ń tọ́ka sí ọ̀nà tàbí aṣojú; ‘nípasẹ̀’ pa ìyàtọ̀ rẹ̀ sí ἐκ mọ́, ó sì ń tọ́ka sí bí a ṣe ń bí ọkùnrin láti ọwọ́ obìnrin.
- source_word: τὰ δὲ πάντα
  choice: ṣùgbọ́n ohun gbogbo
  rationale: ‘Ṣùgbọ́n’ fi ìyípadà kékeré tí δέ mú wá hàn, láti ìbáṣepọ̀ ènìyàn sí Ọlọ́run gẹ́gẹ́ bí orísun gbogbo.
- source_word: ἐκ τοῦ θεοῦ
  choice: wá láti ọ̀dọ̀ Ọlọ́run
  rationale: Gbólóhùn yìí fi Ọlọ́run hàn gẹ́gẹ́ bí orísun ìkẹyìn, ó sì jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ γυνή àti ἀνήρ nínú ẹsẹ yìí
  choice: obìnrin àti ọkùnrin ní ìtumọ̀ gbogbogbò
  alternative: aya àti ọkọ
  rationale: Ìtọ́kasí sí ìṣẹ̀dá àti sí bíbí ènìyàn mú kí àyíká náà gbòòrò ju ìgbéyàwó nìkan lọ; àlàyé ìsàlẹ̀ ṣì pa ìtumọ̀ tó jẹ mọ́ ìgbéyàwó mọ́ gẹ́gẹ́ bí ohun tó ṣeé ṣe.
- issue: Ìbáṣepọ̀ láàárín orísun obìnrin àti ọ̀nà tí ọkùnrin gbà wá
  choice: pa ìyàtọ̀ láàárín ἐκ (‘láti ara/láti ọ̀dọ̀’) àti διά (‘nípasẹ̀’) mọ́
  alternative: tú àwọn méjèèjì sí ‘láti’
  rationale: Ìyàtọ̀ náà pa ìtọ́kasí sí ìṣẹ̀dá obìnrin láti ara ọkùnrin àti bíbí ọkùnrin nípasẹ̀ obìnrin mọ́, láìpa ìwontúnwonsì àti ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà rẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè tó lọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘láti ara’ ní apá àkọ́kọ́ láti mú ìtọ́kasí ìṣẹ̀dá yé kedere, ‘nípasẹ̀’ sì pa ìyàtọ̀ ọ̀rọ̀ Gíríìkì mọ́.
