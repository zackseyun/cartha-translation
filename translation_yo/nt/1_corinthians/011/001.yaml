id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: yo
  text: Ẹ di aláfarawé mi, gẹ́gẹ́ bí èmi náà ṣe jẹ́ aláfarawé Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Kristi.”'
    reason: Àṣàyàn ìtumọ̀ ìbílẹ̀ fún Χριστοῦ.
lexical_decisions:
- source_word: μιμηταί
  choice: aláfarawé
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ẹni tí ó ń fara wé àpẹẹrẹ ẹlòmíràn. “Aláfarawé” pa èrò fífarawé mọ́ ju ọ̀rọ̀ gbogbogbò bí “ọmọlẹ́yìn” lọ.
- source_word: μου
  choice: mi
  rationale: Fífún “aláfarawé” ní “mi” fi hàn ní kedere pé Pọ́ọ̀lù ni àpẹẹrẹ tí wọ́n ń fara wé, láìfi ìní tí kò yẹ kún un.
- source_word: γίνεσθε
  choice: Ẹ di
  rationale: “Ẹ di” pa agbára àṣẹ àti ìtumọ̀ wíwọ inú ipò tàbí ìṣe tuntun mọ́, dípò kí a túmọ̀ rẹ̀ sí “ẹ jẹ́” nìkan.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìfiwéra tí ó ṣe kedere hàn.
- source_word: κἀγὼ
  choice: èmi náà
  rationale: Ó pa ìtẹnumọ́ καί + ἐγώ mọ́ pé Pọ́ọ̀lù náà ń ṣe ohun kan náà.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Ní ibi yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Jésù; “Mèsáyà” fi ìtumọ̀ oyè náà hàn, nígbà tí “Kristi” jẹ́ àṣàyàn ìbílẹ̀ tí a tọ́ka sí nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ Gíríìkì náà lè jẹ́ oyè, “Ẹni Àmì-Òróró,” tàbí kí ó fara hàn bí orúkọ tí a mọ̀ sí “Kristi.” Àkọ́kọ́ ni a lò nínú ọ̀rọ̀, a sì pa èkejì mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Àṣekún ọ̀rọ̀ tí a fi sílẹ̀ nínú gbólóhùn Gíríìkì
  choice: ti jẹ́ aláfarawé
  alternative: ti ń fara wé
  rationale: Gíríìkì kò tún μιμητής kọ sí apá kejì, ṣùgbọ́n ìfiwéra fi í hàn gbangba. Yorùbá nílò kí a mú un jáde fún gbólóhùn tó pé; lílo “aláfarawé” tún pa ìṣọ̀kan pẹ̀lú apá àkọ́kọ́ mọ́ láìyí ìtumọ̀ rẹ̀ sí jíjẹ́ ti Mèsáyà.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà jẹ́ kúkúrú, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní; “Ẹ” pa nọ́ńbà ọ̀pọ̀ àti ọ̀wọ̀ àṣẹ mọ́.
