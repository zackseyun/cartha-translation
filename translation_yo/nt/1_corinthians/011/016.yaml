source:
  edition: SBLGNT
  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹnikẹ́ni bá dà bí ẹni tó fẹ́ máa fa awuyewuye[a], àwa kò ní irú àṣà bẹ́ẹ̀[b], bẹ́ẹ̀ ni àwọn ìjọ Ọlọ́run kò ní irú àṣà bẹ́ẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tó fẹ́ràn àríyànjiyàn” tàbí “tó máa ń wá ìjà ọ̀rọ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Irú àṣà bẹ́ẹ̀” lè tọ́ka sí ìṣe fífa awuyewuye, tàbí sí ìṣe tí a ń jíròrò ní àwọn ẹsẹ tó ṣáájú.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: bá dà bí ẹni tó
  rationale: Ó mú ìtumọ̀ ‘seems’ jáde ní Yorùbá àdánidá, ó sì fi ààyè sílẹ̀ fún bí ìwà ẹni náà ṣe hàn láì sọ pé ìdájọ́ náà dájú pátápátá.
- source_word: φιλόνεικος
  choice: fẹ́ máa fa awuyewuye
  rationale: Ó ṣàpèjúwe ẹni tí ó ní ìfẹ́ sí ìjà ọ̀rọ̀ tàbí àríyànjiyàn; gbólóhùn yìí ṣe kedere sí òǹkàwé Yorùbá òde òní láì sọ ọ́ di ìjà ara.
- source_word: τοιαύτην
  choice: irú … bẹ́ẹ̀
  rationale: Ó pa ìtọ́ka sẹ́yìn mọ́ láì pinnu ohun pàtó tí ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: συνήθειαν
  choice: àṣà
  rationale: ‘Àṣà’ lè túmọ̀ sí ìṣe tí a ti máa ń ṣe tàbí ìlànà tí àwùjọ gbà, ó sì bá συνήθεια mu níhìn-ín.
- source_word: οὐκ ἔχομεν
  choice: àwa kò ní
  rationale: Ìtumọ̀ tààrà tí ó sì jẹ́ Yorùbá àdánidá; kò fi ìtumọ̀ míràn bí ‘a kò gbà láàyè’ kún ọ̀rọ̀ Gíríìkì.
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: àwọn ìjọ Ọlọ́run
  rationale: Ó pa ọ̀rọ̀ ìní náà mọ́, ó sì fi hàn pé àwọn ìjọ náà jẹ́ ti Ọlọ́run.
theological_decisions:
- issue: Ohun tí ‘irú àṣà bẹ́ẹ̀’ ń tọ́ka sí
  choice: A fi ọ̀rọ̀ náà sílẹ̀ ní fífẹ̀ gẹ́gẹ́ bí ‘irú àṣà bẹ́ẹ̀,’ láì sọ bóyá ó ń tọ́ka sí ìwà awuyewuye tàbí sí ìṣe tí àwọn ẹsẹ tó ṣáájú ń jíròrò.
  alternative: Kí a túmọ̀ ọ́ ní pàtó sí ‘àṣà fífa awuyewuye’ tàbí sí pé àwọn ìjọ kò ní ìṣe tí a ń jíròrò ní àwọn ẹsẹ tó ṣáájú.
  rationale: τοιαύτην συνήθειαν jẹ́ kúkúrú, ohun tí ó sì ń tọ́ka sí jẹ́ ohun tí a ń ṣe àríyànjiyàn lé lórí. Ìtumọ̀ náà pa àìṣe-kedere gidi inú orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘awuyewuye’ fún ìjà ọ̀rọ̀ alágbára, a sì pa àìṣe-kedere ti gbólóhùn kejì mọ́.
