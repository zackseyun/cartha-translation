revisions:
- from: Nítorí, ṣé ẹ̀yin kò ní ilé láti jẹ, láti sì mu? Tàbí ẹ̀yin ń tẹ́ńbẹ́lú ìjọ Ọlọ́run, ẹ sì ń dójú ti àwọn tí kò ní nǹkan kan? Kí ni kí n sọ fún yín? Ṣé kí n yìn yín? Ní ti èyí, èmi kò yìn yín.[a]
  to: Nítorí, ṣé ẹ̀yin kò ní ilé láti jẹ, láti sì mu? Tàbí ẹ̀yin ń kẹ́gàn ìjọ Ọlọ́run, ẹ sì ń mú ojú ti àwọn tí kò ní nǹkan? Kí ni kí n sọ fún yín? Ṣé kí n yìn yín? Ní ti èyí, èmi kò yìn yín.[a]
  rationale: 'A tún ọ̀rọ̀-ìṣe méjì ṣe nìkan láti mú ìtumọ̀ Gíríìkì àti Yorùbá boṣewa bá ara wọn mu: καταφρονεῖτε sí “ń kẹ́gàn,” àti καταισχύνετε sí “ń mú ojú ti.” Gbogbo àwọn ìbéèrè àròjinlẹ̀, ìfojú-kéré sí ìjọ Ọlọ́run, àti àìjẹ́pàtó nípa “àwọn tí kò ní nǹkan” ni a pa mọ́.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:15:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ètò àti agbára ìbéèrè àròjinlẹ̀ ti Gíríìkì dáadáa: àwọn ilé fún jíjẹ àti mímu, ìjọ Ọlọ́run, àwọn tí kò ní nǹkan, àti àìyìn Paulu. Síbẹ̀, àwọn ọ̀rọ̀-ìṣe méjì tí a lò fún καταφρονεῖτε àti καταισχύνετε kò dáa tó nínú Yorùbá boṣewa fún ìtumọ̀ ìbáwí náà.'
