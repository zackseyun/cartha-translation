id: 1CO.11.22
reference: 1 Corinthians 11:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: yo
  text: Nítorí, ṣé ẹ̀yin kò ní ilé láti jẹ, láti sì mu? Tàbí ẹ̀yin ń kẹ́gàn ìjọ Ọlọ́run, ẹ sì ń mú ojú ti àwọn tí kò ní nǹkan? Kí ni kí n sọ fún yín? Ṣé kí n yìn yín? Ní ti èyí, èmi kò yìn yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “àwọn òtòṣì” tàbí “àwọn tí kò ní oúnjẹ”; ní Gíríìkì, ní tààràtà, “àwọn tí kò ní.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: ilé
  rationale: Ó tọ́ka sí àwọn ilé aládàáni tí wọ́n yàtọ̀ sí ìpéjọpọ̀ ìjọ; ‘ilé’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè dúró fún ọ̀pọ̀ nínú àyíká yìí.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: láti jẹ, láti sì mu
  rationale: Ó fi ète hàn ní Yorùbá àdánidá, ó sì pa ìṣe méjèèjì mọ́.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: ìjọ Ọlọ́run
  rationale: Èyí ni ọ̀rọ̀ tí ó wọ́pọ̀, tí ó sì ṣe kedere fún àwùjọ àwọn ènìyàn Ọlọ́run tí wọ́n péjọ, láìfi ìtumọ̀ ètò-ajọ kún un.
- source_word: καταφρονεῖτε
  choice: ń tẹ́ńbẹ́lú
  rationale: Ó mú ìtumọ̀ ṣíṣe ohun kan bí ẹni pé kò níye lórí àti fífi ẹ̀gàn hàn jáde pẹ̀lú agbára ìbáwí ọ̀rọ̀ náà.
- source_word: καταισχύνετε
  choice: ń dójú ti
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a mú kí ẹlòmíràn tijú tàbí kí ojú tì í.
- source_word: τοὺς μὴ ἔχοντας
  choice: àwọn tí kò ní nǹkan kan
  rationale: Ó pa gbólóhùn Gíríìkì gbooro náà mọ́ láìdín in kù sí ‘àwọn òtòṣì’ tàbí ‘àwọn tí kò ní oúnjẹ,’ bí ó tilẹ̀ jẹ́ pé àyíká tọ́ka sí àìní ohun ìní tàbí oúnjẹ.
- source_word: τί εἴπω ὑμῖν;
  choice: Kí ni kí n sọ fún yín?
  rationale: Ìbéèrè àròjinlẹ̀ yìí jẹ́ Yorùbá òde òní tó ṣe kedere, ó sì pa ìdààmú ọ̀rọ̀ Paulu mọ́.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: Ṣé kí n yìn yín?
  rationale: Ó ṣe àfihàn ìbéèrè àròjinlẹ̀ tí ìdáhùn rẹ̀ yẹ kí ó jẹ́ bẹ́ẹ̀ kọ́.
- source_word: ἐν τούτῳ
  choice: Ní ti èyí
  rationale: Ó tọ́ka sí ọ̀ràn tí a ṣẹ̀ṣẹ̀ ń jíròrò ní ọ̀nà Yorùbá àdánidá.
- source_word: οὐκ ἐπαινῶ
  choice: èmi kò yìn yín
  rationale: Àtúnlò ‘yìn’ pa ìbáramu ọ̀rọ̀ mọ́ pẹ̀lú ἐπαινέσω, ‘èmi’ sì tẹnu mọ́ ìdáhùn òdì náà.
theological_decisions:
- issue: Ohun tí ‘àwọn tí kò ní’ ń tọ́ka sí nínú àyíká Oúnjẹ Alẹ́ Olúwa
  choice: àwọn tí kò ní nǹkan kan
  alternative: àwọn òtòṣì; àwọn tí kò ní oúnjẹ
  rationale: Àyíká fi hàn pé ó ṣeé ṣe kí ó tọ́ka sí àwọn onígbàgbọ́ tí wọn kò ní ohun ìní tàbí oúnjẹ tó, ṣùgbọ́n Gíríìkì sọ ní gbooro pé ‘àwọn tí kò ní.’ A pa ìfọ̀rọ̀wérọ̀ yìí mọ́, a sì ṣàlàyé àwọn àṣàyàn nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àwọn ìbéèrè àròjinlẹ̀ àti líle ìbáwí Paulu ni a pa mọ́; ‘ẹ̀yin/yín’ fi hàn pé ọ̀pọ̀ ènìyàn ni a ń bá sọ̀rọ̀.
