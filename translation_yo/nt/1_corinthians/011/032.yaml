id: 1CO.11.32
reference: 1 Corinthians 11:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κρινόμενοι δὲ ⸀ὑπὸ κυρίου παιδευόμεθα, ἵνα μὴ σὺν τῷ κόσμῳ κατακριθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Olúwa bá ń dá wa lẹ́jọ́,[a] ó ń bá wa wí láti tọ́ wa sọ́nà, kí a má bàa jẹ́ ẹni tí a dá lẹ́bi pẹ̀lú ayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí Olúwa ti ń dá wa lẹ́jọ́, bẹ́ẹ̀ ni ó ń bá wa wí láti tọ́ wa sọ́nà.” Àwọn ọ̀rọ̀ ìṣe Gíríìkì wà ní àkókò ìsinsìnyí, èyí tó lè tẹnu mọ́ iṣẹ́ tó ń bá a lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: nígbà tí Olúwa bá ń dá wa lẹ́jọ́
  rationale: Ọ̀rọ̀ ìṣe alábápín tó wà ní àkókò ìsinsìnyí jẹ́ kí ìtumọ̀ àkókò, ‘nígbà tí ... bá ń,’ bá ọ̀rọ̀ yìí mu, ó sì pa ìtumọ̀ ìdájọ́ κρίνω mọ́ láì sọ ó di ìdálẹ́bi.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ hàn sí ìkìlọ̀ inú ẹsẹ tó ṣáájú.
- source_word: ὑπὸ κυρίου
  choice: Olúwa ... ń
  rationale: ὑπό pẹ̀lú ọ̀rọ̀-orúkọ ní genitive fi ẹni tó ṣe iṣẹ́ hàn. Ìṣètò gbolohun Yorùbá tó jẹ́ adayeba yí passive náà sí active láì yí ẹni tó ṣe iṣẹ́ padà.
- source_word: παιδευόμεθα
  choice: ó ń bá wa wí láti tọ́ wa sọ́nà
  rationale: Ó mú ipa ìbáwí tó ń ṣe àtúnṣe, kì í ṣe ìjìyà lásán, jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: ἵνα μὴ
  choice: kí ... má bàa
  rationale: Ó pa ète tàbí àbájáde tí gbólóhùn náà ń tọ́ka sí mọ́ ní ọ̀nà adayeba.
- source_word: σὺν τῷ κόσμῳ
  choice: pọ̀ mọ́ ayé
  rationale: Ó fi ìkópa nínú àbájáde kan náà hàn; ‘ayé’ dúró fún ayé ènìyàn tó yà kúrò lọ́dọ̀ Ọlọ́run nínú àyíká yìí.
- source_word: κατακριθῶμεν
  choice: dá wa lẹ́bi
  rationale: Ó ṣe ìyàtọ̀ sí κρινόμενοι, ó sì sọ ìdájọ́ tí kò dára, ìyẹn ìdálẹ́bi, ní kedere.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìdájọ́ Olúwa nísinsìnyí àti ìdálẹ́bi pẹ̀lú ayé
  choice: A túmọ̀ ìdájọ́ Olúwa gẹ́gẹ́ bí ìbáwí tó ń tọ́ni sọ́nà, tí ète rẹ̀ ni kí a má ṣe ní ìdálẹ́bi kan náà pẹ̀lú ayé.
  alternative: A lè ka ẹsẹ náà gẹ́gẹ́ bí ìjìyà ní àkókò yìí láì fi kún un pé ó ń ṣe ìyàtọ̀ láàárín àwọn onígbàgbọ́ àti àwọn aláìgbàgbọ́.
  rationale: Ìyàtọ̀ tó wà láàárín κρινόμενοι àti κατακριθῶμεν, papọ̀ mọ́ παιδευόμεθα àti ἵνα μή, ń fi ìbáwí àtúnṣe àti ìdálẹ́bi hàn gẹ́gẹ́ bí ohun méjì ọ̀tọ̀. A kò fi ètò ẹ̀kọ́ ìsìn kan pàtó kún un.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣe kedere fún òǹkàwé gbogbogbò ni a lò. A lo ‘ń bá wa wí láti tọ́ wa sọ́nà’ láti mú ìtumọ̀ παιδεύω jáde kedere, a sì fi àmì ohùn síbi tó yẹ.
