  source_fidelity: 'Ìtumọ̀ náà mú ìyàtọ̀ pàtàkì tó wà láàárín κρινόμενοι (“nígbà tí Olúwa bá ń dá wa lẹ́jọ́”) àti κατακριθῶμεν (ìdálẹ́bi ìkẹyìn) jáde dáadáa. Ó tún fi παιδευόμεθα hàn gẹ́gẹ́ bí ìbáwí/títọ́nisọ́nà tó ní ète àtúnṣe. Ṣùgbọ́n gbolohun “kí a má bàa dá wa lẹ́bi” lè túmọ̀ sí pé àwọn ẹni náà ni wọ́n ń dá ara wọn lẹ́bi, nígbà tí Gíríìkì jẹ́ passive: “kí a má bàa jẹ́ ẹni tí a dá lẹ́bi.”'
