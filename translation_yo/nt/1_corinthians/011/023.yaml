revisions:
- from: 'Nítorí ohun tí mo gbà láti ọ̀dọ̀ Olúwa ni mo sì fi lé yín lọ́wọ́: pé ní alẹ́ tí a ń fi Jésù Olúwa lé wọn lọ́wọ́[a], ó mú búrẹ́dì,'
  to: 'Nítorí ohun tí mo gbà láti ọ̀dọ̀ Olúwa ni mo tún fi lé yín lọ́wọ́: pé Olúwa Jésù, ní òru tí a ń fi í lé ọwọ́[a], mú búrẹ́dì,'
  rationale: Àtúnṣe náà yọ “wọn” kúrò kí ó má bàa fi olùgbà ìṣẹ̀ handing-over kún ìtumọ̀ Gíríìkì. Ó lo “í” gẹ́gẹ́ bí aṣojú-ọrọ̀ fún Olúwa Jésù, nípasẹ̀ èyí tí a fi pa passive aláìlórúkọ àti ipa imperfect (“a ń fi”) mọ́. Àkọsílẹ̀ ìsàlẹ̀ ń fi ìtumọ̀ àṣà “was betrayed” hàn, ṣùgbọ́n kò fi í rọ́pò ìtumọ̀ gbooro nínú ọ̀rọ̀ àkọ́kọ́.
