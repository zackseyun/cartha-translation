  - severity: low
    issue: Àkọsílẹ̀ ìsàlẹ̀ kò sọ ohun tí “á” ń tọ́ka sí ní kedere
    rationale: Níbi tí a ti ya ọ̀rọ̀ àkọsílẹ̀ kúrò nínú gbolohun, “a” lè má ní olùtọ́kasí tó hàn. Mímú “Olúwa Jésù” wà nínú rẹ̀ jẹ́ kedere.
