  verdict: revise
  source_fidelity: 'Àwòkọ́ṣe náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: ìgbàgbọ́ Pọ́ọ̀lù láti ọ̀dọ̀ Olúwa, fífi ìtàn náà lé àwọn ará Kọ́ríńtì lọ́wọ́, àti bí Olúwa Jésù ṣe mú búrẹ́dì. Ṣùgbọ́n “a ń fi Jésù Olúwa lé wọn lọ́wọ́” fi “wọn” (àwọn olùgbà) kún un, nígbà tí ọrọ̀ Gíríìkì jẹ́ ìfẹ́hàn aláìlórúkọ ẹni tí a fi í lé lọ́wọ́. Àfikún yẹn kò yẹ.'
  naturalness: “Nítorí ohun tí mo gbà láti ọ̀dọ̀ Olúwa ni mo sì fi lé yín lọ́wọ́” lè yé ẹni, ṣùgbọ́n “mo tún fi ... lọ́wọ́” ṣàn dáadáa ju “ni mo sì fi” lọ ní àyíká yìí. “ní òru tí a ń fi í lé ọwọ́” jẹ́ Yorùbá ìgbàlódé tí ó dáa, ó sì yẹ fún ipa aláìparí (imperfect) ti παρεδίδετο.
  terminology: “Olúwa,” “gba,” “fi lé ... lọ́wọ́,” àti “búrẹ́dì” yẹ. A pa ìfararora láàrin gbigba àti fífi lé lọ́wọ́ mọ́, láì gbìyànjú láti mú παραδίδωμι ní gbolohun kejì náà dọ́gba pátápátá pẹ̀lú ti àkọ́kọ́ ní ọ̀nà tí yóò ba Yorùbá jẹ́.
