source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: yo
  text: 'Nítorí ohun tí mo gbà láti ọ̀dọ̀ Olúwa ni mo tún fi lé yín lọ́wọ́: pé Olúwa Jésù, ní òru tí a ń fi í lé ọwọ́[a], mú búrẹ́dì,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìtumọ̀ àṣà, “ní òru tí wọ́n ti dá Olúwa Jésù.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: mo gbà
  rationale: Ó sọ ní kedere pé Pọ́ọ̀lù gba ẹ̀kọ́ tàbí àṣà yìí; ó sì jẹ́ kí ìbáṣepọ̀ ọ̀rọ̀ rẹ̀ pẹ̀lú παρέδωκα hàn.
- source_word: ἀπὸ τοῦ κυρίου
  choice: láti ọ̀dọ̀ Olúwa
  rationale: Ó pa ìtumọ̀ orísun mọ́ láì fi ‘Jésù’ kún un níbi tí Gíríìkì kò ti ṣe bẹ́ẹ̀.
- source_word: παρέδωκα
  choice: mo sì fi lé yín lọ́wọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ẹ̀kọ́ tí ẹni gba kọjá sí ẹlòmíràn, ó sì tún pa àwòrán ‘fífi lé lọ́wọ́’ mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ń ṣàgbékalẹ̀ àkóónú ohun tí Pọ́ọ̀lù fi lé wọn lọ́wọ́.
- source_word: κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ pa agbára ọ̀wọ̀ àti ìtumọ̀ Kristi mọ́ nínú èdè Yorùbá Bíbélì tí ó ṣe déédé.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: ní alẹ́ tí
  rationale: Ìtumọ̀ àkókò náà ṣe kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: παρεδίδετο
  choice: a ń fi ... lé wọn lọ́wọ́
  rationale: Ìṣe aláìparí náà fi hàn pé ohun náà ń lọ lọ́wọ́ nígbà yẹn; ọ̀rọ̀ yìí sì pa ìtumọ̀ fífi ẹni lé ẹlòmíràn lọ́wọ́ mọ́ láì dín un kù sí ìwà ọ̀dàlẹ̀ nìkan.
- source_word: ἔλαβεν ἄρτον
  choice: ó mú búrẹ́dì
  rationale: Èyí jẹ́ ìtumọ̀ kedere, àdánidá fún gbígbé búrẹ́dì, láì fi ‘ìṣù’ kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ παρεδίδετο nínú ìtàn Oúnjẹ Alẹ́ Olúwa
  choice: a ń fi Jésù Olúwa lé wọn lọ́wọ́
  alternative: ní alẹ́ tí a dà á (Jésù Olúwa)
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí fífi ẹni lé ẹlòmíràn lọ́wọ́ tàbí dídà á. Ọ̀rọ̀ àkọ́kọ́ pa ààyè ìtumọ̀ rẹ̀ gbòòrò mọ́—ìṣe àwọn ènìyàn àti àyíká ìjìyà Jésù—láì fi ìtumọ̀ tóóró kan ṣoṣo lé e lórí.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘fi lé ... lọ́wọ́’ láti pa ìsopọ̀ ọ̀rọ̀ παρέδωκα/παρεδίδετο mọ́, bí ó tilẹ̀ jẹ́ pé a yí ètò gbólóhùn díẹ̀ padà kí ó lè ṣàn dáadáa ní Yorùbá.
