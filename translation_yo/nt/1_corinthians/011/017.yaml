id: 1CO.11.17
reference: 1 Corinthians 11:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: yo
  text: Ṣùgbọ́n bí mo ṣe ń fún yín ní ìtọ́ni yìí[a], èmi kò yìn yín, nítorí pé nígbà tí ẹ bá péjọ, ipò kì í sàn sí i, bí kò ṣe pé ó burú sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí mo ṣe ń fún yín ní àṣẹ yìí.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí fífúnni ní ìtọ́ni, ìdarí, tàbí àṣẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: yìí
  rationale: Ọ̀rọ̀ arọ́pò afihan yìí ń tọ́ka sí ìtọ́ni tí Pọ́ọ̀lù fẹ́ bẹ̀rẹ̀ sí í fún wọn; a so ó mọ́ ‘ìtọ́ni’ ní Yorùbá kí gbólóhùn lè ṣe kedere.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tí ó ní ìtakora díẹ̀ hàn láti inú ọ̀rọ̀ tó ṣáájú sí ìbáwí tí ó tẹ̀ lé e.
- source_word: παραγγέλλων
  choice: bí mo ṣe ń fún yín ní ìtọ́ni
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí fífúnni ní ìtọ́ni, ìdarí, tàbí àṣẹ. ‘Fún yín ní ìtọ́ni’ jẹ́ Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì mú un le ju bí orísun ṣe béèrè lọ.
- source_word: οὐκ ἐπαινῶ
  choice: èmi kò yìn yín
  rationale: Ó túmọ̀ sí pé Pọ́ọ̀lù kò gbóríyìn fún wọn tàbí fọwọ́ sí ìṣe wọn; ‘kò yìn yín’ tún bá ìyìn inú ẹsẹ 2 mu.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó ṣe àfihàn ìdí tí Pọ́ọ̀lù kò fi yìn wọn.
- source_word: οὐκ εἰς τὸ κρεῖσσον
  choice: kì í ṣe kí nǹkan lè sàn sí i
  rationale: Ó pa ìtumọ̀ ìfiwéra náà mọ́—pé àbájáde ìpéjọ wọn kì í mú ipò sunwọ̀n sí i.
- source_word: ἀλλὰ εἰς τὸ ἧσσον
  choice: bí kò ṣe kí ó lè burú sí i
  rationale: Ó pa ìtakora àti ìfiwéra pẹ̀lú ‘sàn sí i’ mọ́, láì sọ pàtó ohun tí orísun kò sọ.
- source_word: συνέρχεσθε
  choice: nígbà tí ẹ bá péjọ
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn onígbàgbọ́ ń kóra jọ fún ìpéjọ.
theological_decisions:
- issue: Ìwọ̀n agbára ọ̀rọ̀ παραγγέλλων
  choice: ìtọ́ni
  alternative: àṣẹ
  rationale: Ọ̀rọ̀ Gíríìkì lè ní agbára àṣẹ, ṣùgbọ́n ní ibi yìí ó ṣí ọ̀nà sí ìtọ́sọ́nà àti ìbáwí Pọ́ọ̀lù nípa ìpéjọ ìjọ. ‘Ìtọ́ni’ pa ọlá àṣẹ rẹ̀ mọ́ láì pinnu pé ìtumọ̀ tó le jù ni ó gbọ́dọ̀ jẹ́; àṣàyàn ‘àṣẹ’ wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, ti òde òní, tí ó ní ọlá, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìsọ̀rọ̀ ‘sàn sí i … burú sí i’ pa ìfiwéra inú orísun mọ́, ó sì ṣe kedere fún òǹkàwé lasán.
