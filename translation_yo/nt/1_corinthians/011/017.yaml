  to: Ṣùgbọ́n bí mo ṣe ń fún yín ní ìtọ́ni yìí[a], èmi kò yìn yín, nítorí pé nígbà tí ẹ bá péjọ, ipò kì í sàn sí i, bí kò ṣe pé ó burú sí i.
  rationale: 'The revision retains the draft’s accurate treatment of παραγγέλλων and its authoritative yet non-overstated register. It replaces purpose-like ‘kí ... lè’ wording with a direct result/evaluation contrast, preserving the Greek comparative sense: their gathering leaves matters worse, not better. The footnote alternative is also adjusted to a natural Yoruba construction while retaining the lexical option ‘àṣẹ.’'
