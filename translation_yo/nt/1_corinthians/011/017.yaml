review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the contrastive transition, Paul's refusal to commend the Corinthians, the causal clause, and the comparative contrast in their gatherings. A small revision makes the final clause more clearly express the actual adverse result of their assembling, rather than a purpose framed by ‘kí ... lè.’
  naturalness: The Yoruba is generally clear and appropriately formal. ‘Nígbà tí ẹ bá péjọ, ipò kì í sàn sí i, bí kò ṣe pé ó burú sí i’ is more idiomatic and directly communicates the comparative outcome.
  terminology: ‘Ìtọ́ni’ is a sound contextual rendering of παραγγέλλων. The footnote appropriately preserves ‘àṣẹ’ as a viable stronger alternative. ‘Yìn yín’ naturally renders Paul’s refusal to praise or commend them.
  issues:
  - severity: low
    issue: The wording ‘kì í ṣe kí nǹkan lè sàn sí i, bí kò ṣe kí ó lè burú sí i’ can be heard primarily as purpose (‘so that’), rather than as the evaluative/result contrast expressed by εἰς τὸ κρεῖσσον ... εἰς τὸ ἧσσον.
    rationale: 'The Greek idiom assesses the effect or direction of their coming together: it is not for the better but for the worse. Recasting the clause as the condition becoming better or worse retains the comparison without adding meaning.'
