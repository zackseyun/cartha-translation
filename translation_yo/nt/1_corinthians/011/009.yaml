source:
  edition: SBLGNT
  text: καὶ γὰρ οὐκ ἐκτίσθη ἀνὴρ διὰ τὴν γυναῖκα, ἀλλὰ γυνὴ διὰ τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: yo
  text: Nítorí pé ní tòótọ́, a kò ṣẹ̀dá ọkùnrin fún obìnrin,[a] ṣùgbọ́n obìnrin ni a ṣẹ̀dá fún ọkùnrin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: ‘nítorí ti obìnrin’ àti ‘nítorí ti ọkùnrin.’ Ọ̀rọ̀ Gíríìkì náà lè fi okùnfà tàbí ète hàn; níhìn-ín, a túmọ̀ ọ́ sí ‘fún’ nítorí àríyànjiyàn tó dá lórí ìṣẹ̀dá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí pé ní tòótọ́
  rationale: Ọ̀rọ̀ yìí so ẹsẹ náà mọ́ àlàyé tó ṣáájú rẹ̀, ó sì tún fi ìtẹnumọ́ díẹ̀ kún un. Gbólóhùn Yorùbá yìí mú ipa ìṣàlàyé γάρ àti ìtẹnumọ́ καί jáde lọ́nà àdánidá.
- source_word: ἐκτίσθη
  choice: a kò ṣẹ̀dá / a ṣẹ̀dá
  rationale: Ọ̀rọ̀ κτίζω túmọ̀ sí ‘ṣẹ̀dá.’ Lílò ‘a’ aláìdárúkọ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe àìṣe-lórúkọ tí ó wà nínú èdè Gíríìkì.
- source_word: ἀνὴρ / γυνὴ
  choice: ọkùnrin / obìnrin
  rationale: Níhìn-ín, àwọn ọ̀rọ̀ náà tọ́ka sí ọkùnrin àti obìnrin nínú ìtàn ìṣẹ̀dá, kì í ṣe ọkọ àti aya nìkan.
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: nítorí obìnrin / nítorí ọkùnrin
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative lè fi ìdí, ète tàbí àǹfààní hàn. ‘Nítorí’ pa àyè ìtumọ̀ yìí mọ́ láìfi ète tàbí okùnfà kan múlẹ̀ ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó ṣe kedere hàn láàárín abala méjèèjì.
theological_decisions:
- issue: Bóyá ἀνήρ àti γυνή yẹ kí a túmọ̀ sí ‘ọkùnrin/obìnrin’ tàbí ‘ọkọ/aya’
  choice: ọkùnrin/obìnrin
  alternative: ọkọ/aya
  rationale: Ìtọ́kasí sí ìṣẹ̀dá fi hàn pé Pọ́ọ̀lù ń fa ọ̀rọ̀ rẹ̀ yọ láti inú ìtàn Gẹnẹsisi. Nítorí náà, ‘ọkùnrin/obìnrin’ pa ìwọ̀n ọ̀rọ̀ náà mọ́, kò sì sọ ọ́ di ọ̀rọ̀ nípa ìgbéyàwó nìkan.
- issue: Bóyá διά yẹ kí ó fi okùnfà tàbí ète hàn ní pàtó
  choice: nítorí
  alternative: fún / nítorí ti
  rationale: Gíríìkì lè gba ìtumọ̀ okùnfà, ète tàbí àǹfààní. ‘Nítorí’ àti àlàyé ìsàlẹ̀ pa àìdánilójú gidi náà mọ́ láìyan ọ̀kan ṣoṣo.
translation_notes:
  register: A lo Yorùbá àtijọ́-kì-í-ṣe tí ó ní iyì, tó sì ṣe kedere fún òǹkàwé òde òní. Àmì ohùn wà níbi tí ó yẹ. Àtúnṣe ‘obìnrin ni a ṣẹ̀dá’ mú ìtakora abala kejì hàn ní Yorùbá àdánidá.
