id: 1CO.5.1
reference: 1 Corinthians 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: yo
  text: 'Ní tòótọ́, a ń gbọ́ ìròyìn pé ìwà àgbèrè wà láàárín yín—irú ìwà àgbèrè tí kò tilẹ̀ sí láàárín àwọn tí kì í ṣe Júù[a]: ọkùnrin kan ní aya baba rẹ̀.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín àwọn orílẹ̀-èdè”; àwọn ìtumọ̀ kan ní “láàárín àwọn Kèfèrí.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “láti ní aya baba rẹ̀”; ìyẹn ni pé, ó wà nínú ìbáṣepọ̀ ìbálòpọ̀ pẹ̀lú aya baba rẹ̀. Ó ṣeé ṣe kí obìnrin náà jẹ́ aya baba rẹ̀ tí kì í ṣe ìyá rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: Ní tòótọ́
  rationale: Gbólóhùn yìí fi ìyàlẹ́nu àti ìtẹnumọ́ Paulu hàn ní Yorùbá àdánidá, dípò kí a túmọ̀ ọ́ ní ọ̀nà iye bí ‘pátápátá.’
- source_word: ἀκούεται
  choice: a ń gbọ́ ìròyìn
  rationale: Ọ̀rọ̀ náà tọ́ka sí ohun tí a ń ròyìn ní gbangba; ‘a ń gbọ́ ìròyìn’ jẹ́ kedere, ó sì bá Yorùbá òde òní mu.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó fi hàn pé ohun náà ń ṣẹlẹ̀ nínú àwùjọ àwọn onígbàgbọ́ ní Kọ́ríńtì.
- source_word: πορνεία
  choice: ìwà àgbèrè
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ìbálòpọ̀ tí kò bófin mu; ‘ìwà àgbèrè’ jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání, tí ọ̀pọ̀ ènìyàn sì lóye.
- source_word: τοιαύτη πορνεία
  choice: irú ìwà àgbèrè
  rationale: Ó pa agbára ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́, nípa fífi irú ẹ̀ṣẹ̀ tó burú jáì náà hàn.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: tí kò tilẹ̀ sí láàárín àwọn tí kì í ṣe Júù
  rationale: ‘Àwọn tí kì í ṣe Júù’ ṣàlàyé ìyàtọ̀ Júù àti àwọn orílẹ̀-èdè mìíràn láìfi ìtumọ̀ ẹ̀gàn tí ‘Kèfèrí’ lè ní kún ọ̀rọ̀ orísun.
- source_word: ὥστε
  choice: ':'
  rationale: Àmì oníṣàmì méjì fi àlàyé ẹ̀ṣẹ̀ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn wọlé lọ́nà àdánidá, láìfipá mú ὥστε di gbólóhùn àbájáde.
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: aya baba rẹ̀
  rationale: Èyí tẹ̀ lé gbólóhùn orísun, kò sì fi ‘ìyá àfẹ́’ sínú ọ̀rọ̀ pàtàkì, nítorí ọ̀rọ̀ ìbátan pàtó yẹn kò sí nínú Gíríìkì.
- source_word: ἔχειν
  choice: ní
  rationale: Ó pa ọ̀nà ọ̀rọ̀ kúkúrú àti ìtumọ̀ àfiwé Gíríìkì mọ́; àlàyé ẹsẹ̀ ìsàlẹ̀ sọ pé ó ń tọ́ka sí ìbáṣepọ̀ ìbálòpọ̀.
theological_decisions:
- issue: Bí a ṣe yẹ kí a túmọ̀ ἔθνεσιν
  choice: àwọn tí kì í ṣe Júù
  alternative: àwọn orílẹ̀-èdè; àwọn Kèfèrí
  rationale: Yíyan ọ̀rọ̀ àlàyé tí kò ní ẹ̀gàn pa ìyàtọ̀ ẹ̀yà àti ẹ̀sìn tí Paulu ń lò mọ́, láìfi ìdájọ́ mìíràn kún un.
- issue: Bí a ṣe yẹ kí a pe obìnrin náà ní ìyá àfẹ́ nínú ẹsẹ̀
  choice: aya baba rẹ̀
  alternative: ìyá àfẹ́ rẹ̀
  rationale: Gíríìkì sọ ní tààrà pé ‘aya baba’; bí ó tilẹ̀ ṣeé ṣe kí obìnrin náà jẹ́ ìyá àfẹ́ ọkùnrin náà, kò yẹ kí ìtumọ̀ ṣàfikún ìsọfúnni tí orísun kò sọ ní pàtó.
- issue: Ìtumọ̀ ἔχειν nínú àyíká yìí
  choice: ní
  alternative: ń bá aya baba rẹ̀ lòpọ̀; ń gbé pẹ̀lú aya baba rẹ̀ bí aya
  rationale: ‘Ní’ pa àìsọ̀rọ̀-pọ̀ àti ìtumọ̀ àfiwé orísun mọ́; ẹsẹ̀ ìsàlẹ̀ ló ṣàlàyé pé ìbáṣepọ̀ ìbálòpọ̀ ni a ń tọ́ka sí, láìyan bóyá wọ́n ń gbé pọ̀.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì pa ìyàlẹ́nu Paulu àti ìṣọ̀kan gbólóhùn Gíríìkì mọ́.
