id: 1CO.5.12
reference: 1 Corinthians 5:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί γάρ ⸀μοι τοὺς ἔξω κρίνειν; οὐχὶ τοὺς ἔσω ὑμεῖς κρίνετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/012.yaml
  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: yo
  text: Nítorí kí ni ó kàn mí láti dá àwọn tí ó wà níta lẹ́jọ́?[a] Àwọn tí ó wà nínú ha kọ́ ni ẹ̀yin ń dá lẹ́jọ́?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí kí ni mo ní í ṣe pẹ̀lú dídá àwọn tí ó wà níta lẹ́jọ́?”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, àwọn tí ó wà nínú àwùjọ ìjọ.
    reason: cultural_note
lexical_decisions:
- source_word: τί γάρ μοι
  choice: Nítorí kí ni ó kàn mí
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ àpólà Gíríìkì tí ń béèrè ohun tí ọ̀ràn náà ní í ṣe pẹ̀lú olùsọ̀rọ̀ jáde, ó sì pa agbára ìbéèrè àsọyé àti γάρ mọ́.
- source_word: τοὺς ἔξω
  choice: àwọn tí ó wà níta
  rationale: Ó tọ́ka sí àwọn tí kò sí nínú àwùjọ ìjọ, kì í ṣe ipò ara níta nìkan; ó sì bá ‘àwọn tí ó wà nínú’ ṣe àtakò kedere.
- source_word: κρίνειν
  choice: láti dá ... lẹ́jọ́
  rationale: Nínú àyíká ọ̀rọ̀ náà, κρίνω jẹ́ dídájọ́ ní ti ìbáwí àwùjọ ìjọ. ‘Dá lẹ́jọ́’ pa ìtumọ̀ dídájọ́ mọ́ láì sọ ọ́ di ìwádìí tàbí ìṣírò lásán.
- source_word: οὐχὶ
  choice: ha kọ́ ni
  rationale: Àkójọpọ̀ ‘ha kọ́ ni’ jẹ́ ìbéèrè àsọyé tí ń retí ìdáhùn rere, gẹ́gẹ́ bí οὐχί ṣe rí.
- source_word: τοὺς ἔσω
  choice: àwọn tí ó wà nínú
  rationale: Ó pa àtakò ọ̀rọ̀ Gíríìkì láàárín àwọn tí ó wà níta àti àwọn tí ó wà nínú mọ́; àlàyé ìsàlẹ̀ ojú ewé sọ pé inú àwùjọ ìjọ ni.
- source_word: ὑμεῖς κρίνετε
  choice: ẹ̀yin ń dá lẹ́jọ́
  rationale: A pa ọ̀nà ìṣe àsìkò ìsinsìnyí Gíríìkì mọ́, pẹ̀lú ìtẹnumọ́ lórí ‘ẹ̀yin.’ Ìbéèrè àsọyé àti àyíká ọ̀rọ̀ lè fún un ní agbára ojúṣe láì fi ‘gbọ́dọ̀’ sínú ẹsẹ̀ náà.
theological_decisions:
- issue: Bóyá àtakò náà wà láàárín ìjọ àti ayé nípa dídájọ́ ìbáwí
  choice: Ẹsẹ̀ náà yà àwọn tí ó wà níta sí ọ̀tọ̀ kúrò lọ́dọ̀ àwọn tí ó wà nínú àwùjọ ìjọ, ó sì fi dídájọ́ tí àyíká ọ̀rọ̀ ń sọ lé àwọn inú àwùjọ náà lórí.
  alternative: Kí a ka a sí òfin gbogbogbò nípa gbogbo irú ìdájọ́ ìwà rere.
  rationale: Àyíká 1 Kọ́ríńtì 5:9–13 jẹ́ ti ìbáwí nínú ìjọ. Ìtumọ̀ náà pa àtakò ‘níta/n inú’ mọ́ láì gbé ẹ̀kọ́ tí ó gbòòrò ju ọ̀rọ̀ náà lọ wọlé.
- issue: Agbára ọ̀rọ̀ ὑμεῖς κρίνετε
  choice: A túmọ̀ ọ́ ní ìrísí ìbéèrè àsọyé pé ‘ẹ̀yin ń dá lẹ́jọ́,’ tí àyíká rẹ̀ lè fi ojúṣe hàn.
  alternative: ‘Àwọn tí ó wà nínú ni ẹ̀yin gbọ́dọ̀ dá lẹ́jọ́.’
  rationale: Ìrísí Gíríìkì jẹ́ indicative, bí ó tilẹ̀ jẹ́ pé àyíká lè fún un ní agbára ojúṣe. Yíyan ọ̀rọ̀ tí kò fi ‘gbọ́dọ̀’ kun un pa ìṣiyèméjì gírámà àti ìfọkànsìn ẹ̀kọ́ mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘àwọn tí ó wà níta/nínú’ láti pa àwòrán àtakò orísun mọ́, a sì lo ‘ẹ̀yin’ láti fi ìtẹnumọ́ ὑμεῖς hàn.
