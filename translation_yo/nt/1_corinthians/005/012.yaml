  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì: τί γὰρ μοι ... κρίνειν jẹ́ ìbéèrè àsọyé nípa àìní ìṣẹ́ Pọ́ọ̀lù láti dá àwọn tó wà níta lẹ́jọ́; ìyàtọ̀ láàárín τοὺς ἔξω àti τοὺς ἔσω sì wà ní kedere. ‘Ha kọ́ ni’ gbé ìbéèrè οὐχί tí ń retí ìdáhùn rere kalẹ̀ dáadáa. ‘Ẹ̀yin’ tún pa ìtẹnumọ́ ὑμεῖς mọ́. Ìrísí ‘ń dá lẹ́jọ́’ kò fi agbára ‘gbọ́dọ̀’ tí kò hàn ní gírámà orísun kún un.'
  naturalness: Èdè náà jẹ́ Yorùbá boṣewa, ó sì rọrùn láti ka. ‘Kí ni ó kàn mí’ jẹ́ ọ̀nà àdánidá láti sọ ìbéèrè ìbáṣepọ̀/ìnífẹ̀ẹ́ ẹni sí ọ̀ràn kan. Àwọn gbolohun ‘àwọn tí ó wà níta’ àti ‘àwọn tí ó wà nínú’ jẹ́ ìfararora tó yege, tí ó sì bá àtakò inú orísun mu.
  terminology: ‘Dá ... lẹ́jọ́’ jẹ́ ìtumọ̀ tó yẹ fún κρίνειν nínú àyíká ìbáwí ìjọ yìí, láì dín un kù sí ìṣàyẹ̀wò lasan tàbí láì gbòòrò sí gbogbo ìdájọ́ ìwà. Àlàyé [b] ṣàlàyé ‘nínú’ gẹ́gẹ́ bí inú àwùjọ ìjọ, láì jẹ́ kí àlàyé náà rọ́pò ọ̀rọ̀ ẹsẹ̀.
