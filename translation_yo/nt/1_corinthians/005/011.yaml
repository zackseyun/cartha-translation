id: 1CO.5.11
reference: 1 Corinthians 5:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: yo
  text: Ṣùgbọ́n nísinsìnyí mo kọ̀wé sí yín pé kí ẹ má ṣe darapọ̀ mọ́ ẹnikẹ́ni tí a ń pè ní arákùnrin, bí ó bá jẹ́ ẹni oníwà ìbálòpọ̀ tí kò tọ́, oníwọra, abọ̀rìṣà, ẹni tí ń búni, ọ̀mùtí, tàbí alọ́nilọ́wọ́gbà; ẹ má tilẹ̀ bá irú ẹni bẹ́ẹ̀ jẹun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: Ṣùgbọ́n nísinsìnyí, mo kọ̀wé
  rationale: A pa aorist ἔγραψα mọ́ gẹ́gẹ́ bí “mo kọ̀wé,” ní ìbámu pẹ̀lú orísun, láì yí i sí àsìkò ìsinsìnyí.
- source_word: μὴ συναναμίγνυσθαι
  choice: kí ẹ má ṣe ... kẹ́gbẹ́
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yíyẹra fún ìbákẹ́gbẹ́ tàbí ìdapọ̀ tímọ́tímọ́; “kẹ́gbẹ́” jẹ́ Yorùbá àdánidá tí ó mú èrò náà jáde.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: ẹnikẹ́ni tí a ń pè ní arákùnrin
  rationale: Èyí pa ìtumọ̀ pé ẹni náà ni a ń pè tàbí mọ̀ sí “arákùnrin” nínú àwùjọ àwọn onígbàgbọ́ mọ́, láì dájú sọ bóyá ìpè náà jẹ́ òtítọ́.
- source_word: πόρνος
  choice: oníṣekúṣe
  rationale: Ọ̀rọ̀ yìí tọ́ka sí ẹni tí ìwà ìbálòpọ̀ rẹ̀ jẹ́ àgbèrè tàbí èèwọ̀; “oníṣekúṣe” jẹ́ ọ̀rọ̀ tó ṣe kedere, tó sì ní iyì.
- source_word: πλεονέκτης
  choice: oníwọra
  rationale: Ó ṣàpèjúwe ẹni tí ìfẹ́ láti ní púpọ̀ sí i ń darí, pàápàá nípa ohun ìní.
- source_word: εἰδωλολάτρης
  choice: abọ̀rìṣà
  rationale: Ìtumọ̀ tààrà ni ẹni tí ń sin òrìṣà tàbí ère gẹ́gẹ́ bí ọlọ́run.
- source_word: λοίδορος
  choice: asọ̀rọ̀-èébú
  rationale: Ó túmọ̀ sí ẹni tí ó máa ń fi ọ̀rọ̀ bú, kẹ́gàn, tàbí ṣe ẹlòmíràn níṣà; yíyan yìí fojú kan ìwà ọ̀rọ̀ tí orísun ń dá lẹ́bi.
- source_word: μέθυσος
  choice: ọ̀mùtí
  rationale: Ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ẹni tí ó jẹ́ adití ọtí tàbí tí ó máa ń mutí yó.
- source_word: ἅρπαξ
  choice: alọ́nilọ́wọ́gbà
  rationale: Ó ṣàpèjúwe ẹni tí ń fi agbára, ẹ̀tàn, tàbí ìnilára gba ohun ẹlòmíràn; ó gbòòrò ju “olè” lásán lọ.
- source_word: μηδὲ συνεσθίειν
  choice: ẹ má tilẹ̀ bá irú ẹni bẹ́ẹ̀ jẹun
  rationale: A mú ìtẹnumọ́ μηδέ jáde pẹ̀lú “má tilẹ̀,” a sì pa ìṣe jíjẹun pọ̀ mọ́ ẹni náà mọ́ ní kedere.
theological_decisions:
- issue: Ìtumọ̀ ẹni tí a ń pè ní “arákùnrin”
  choice: “ẹnikẹ́ni tí a ń pè ní arákùnrin”
  alternative: “ẹnikẹ́ni tí ó pe ara rẹ̀ ní arákùnrin”
  rationale: Gíríìkì jẹ́ participle passive, ó sì lè túmọ̀ sí ẹni tí a mọ̀ tàbí tí a pè ní arákùnrin; a kò fi kún un pé òun fúnra rẹ̀ ló pe ara rẹ̀ bẹ́ẹ̀.
- issue: Ààlà ìjẹun pọ̀
  choice: “ẹ má tilẹ̀ bá irú ẹni bẹ́ẹ̀ jẹun” láì ṣàlàyé irú oúnjẹ náà
  alternative: Ṣíṣe é ní pàtó sí Oúnjẹ Olúwa tàbí sí gbogbo oúnjẹ ojoojúmọ́
  rationale: Orísun kò sọ bóyá oúnjẹ ìjọ tàbí gbogbo ìbákẹ́gbẹ́ oúnjẹ ni; ìtumọ̀ náà pa àìdájú yìí mọ́, kò sì gbé ẹ̀kọ́ ẹ̀ya ìjọ kan wọlé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “kẹ́gbẹ́” fún ìbáṣepọ̀ tímọ́tímọ́, a sì lo àwọn orúkọ ìwà tí ó ṣe kedere láì sọ ọ̀rọ̀ di asọ tàbí fi ẹ̀kọ́ ìjọ kan kún un.
