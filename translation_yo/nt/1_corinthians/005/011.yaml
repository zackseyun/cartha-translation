  naturalness: “Arákùnrin kẹ́gbẹ́” kò dára ní àyíká yìí, nítorí “arákùnrin” fúnra rẹ̀ ni ἀδελφός, “kẹ́gbẹ́” sì lè dà bí ìfikún tí kò sí nínú orísun. “Má ṣe ... darapọ̀” jẹ́ ọ̀nà àdánidá, tó sì bá ìtumọ̀ ìbákẹ́gbẹ́/ìdapọ̀ mu. “Ẹni tí ń búni” sì wọ́pọ̀, ó sì ṣe kedere ju “asọ̀rọ̀-èébú” lọ fún ẹni tí ń revile ẹlòmíràn.
