  source_fidelity: Ìtumọ̀ náà mú àkókò ìṣe ti Ἔγραψα, olùgbà ὑμῖν, àti àìdánilójú tó wà nínú ἐν τῇ ἐπιστολῇ jáde dáadáa. Ṣùgbọ́n ‘oníṣekúṣe’ kì í sọ ìwà ìbálòpọ̀ ní pàtó; ó lè túmọ̀ sí ẹni tí ó ń ṣe ohun búburú lápapọ̀. Nítorí náà, kò péye fún πόρνοις.
  naturalness: ‘Kí ẹ má ṣe bá ... pọ̀’ ṣeé yé, ṣùgbọ́n ‘kí ẹ má ṣe ní ìbákẹ́gbẹ́pọ̀ pẹ̀lú ...’ jẹ́ gbólóhùn Yorùbá boṣewa tó hàn gbangba síi fún ìtumọ̀ ‘not to associate with.’ ‘Àwọn oníwà àgbèrè’ jẹ́ èdè ìwàásù/ìwé mímọ́ tó ṣì jẹ́ èdè òde òní tí ó sì dá ìtumọ̀ sí ìwà ìbálòpọ̀.
