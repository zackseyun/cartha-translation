  yaml_path: translation/nt/1_corinthians/005/009.yaml
  text: I wrote to you in the letter not to associate with sexually immoral people[c][b][a],
translation:
  language: yo
  text: Mo kọ̀wé sí yín nínú lẹ́tà náà pé kí ẹ má ṣe ní ìbákẹ́gbẹ́pọ̀ pẹ̀lú àwọn oníwà àgbèrè.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú lẹ́tà mi.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí lẹ́tà kan tí Pọ́ọ̀lù ti kọ tẹ́lẹ̀ tàbí sí lẹ́tà yìí fúnra rẹ̀ ní apá kan tó ṣáájú.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “kí ẹ má ṣe bá wọn lò pọ̀” tàbí “kí ẹ má ṣe dàpọ̀ mọ́ wọn.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn tí ń ṣe àgbèrè.” Ọ̀rọ̀ Gíríìkì πόρνοις ń tọ́ka sí àwọn ènìyàn tí ìwà àgbèrè jẹ́ àpèjúwe wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψα
  choice: Mo kọ̀wé
  rationale: Aorist indicative náà dára láti túmọ̀ gẹ́gẹ́ bí ìṣe àtijọ́ tí ó rọrùn; ó sì fi ọ̀ràn bóyá lẹ́tà àtijọ́ ni tàbí lẹ́tà yìí sílẹ̀ láìdájọ́ rẹ̀.
- source_word: ὑμῖν
  choice: sí yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ dative náà ń tọ́ka sí àwọn tí Pọ́ọ̀lù kọ lẹ́tà sí.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: nínú lẹ́tà náà
  rationale: Àmì ìdánimọ̀ inú Gíríìkì tọ́ka sí lẹ́tà kan tí àwọn ará Kọ́ríńtì mọ̀; ‘lẹ́tà náà’ pa àìṣedéédé mọ́ nípa bóyá lẹ́tà iṣáájú ni tàbí lẹ́tà yìí fúnra rẹ̀.
- source_word: μὴ συναναμίγνυσθαι
  choice: kí ẹ má ṣe bá ... pọ̀
  rationale: Gbólóhùn Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì mú èrò dídapọ̀ tàbí ní ìbákẹ́gbẹ́pọ̀ tímọ́tímọ́ jáde láìfi ìtumọ̀ tóóró kún un.
- source_word: πόρνοις
  choice: àwọn oníṣekúṣe
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọ̀pọ̀ ènìyàn tí ìwà àgbèrè tàbí ìṣekúṣe ti dá mọ́; ‘àwọn oníṣekúṣe’ jẹ́ kedere, ó sì yẹ fún èdè Yorùbá òde òní.
theological_decisions:
- issue: Ohun tí ‘lẹ́tà náà’ ń tọ́ka sí
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí lẹ́tà pàtó kan tí àwọn ará Kọ́ríńtì mọ̀, láìsọ bóyá lẹ́tà iṣáájú ni tàbí lẹ́tà yìí.
  alternative: Ó lè jẹ́ lẹ́tà Pọ́ọ̀lù kan tó ṣáájú, tí a kò ní mọ́; tàbí apá kan tí ó kọ tẹ́lẹ̀ nínú 1 Kọ́ríńtì fúnra rẹ̀.
  rationale: ἐν τῇ ἐπιστολῇ ní àmì ìdánimọ̀, ṣùgbọ́n gírámà rẹ̀ nìkan kò yan ọ̀kan lára àwọn ìtumọ̀ ìtàn méjèèjì; ìtumọ̀ náà pa àìṣedéédé yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lasán. ‘Oníṣekúṣe’ yàgò fún ọ̀rọ̀ àtijọ́ tóóró, ó sì mú ìtumọ̀ gbogbogbò πόρνοις jáde.
