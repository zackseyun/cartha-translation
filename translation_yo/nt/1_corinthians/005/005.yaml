id: 1CO.5.5
reference: 1 Corinthians 5:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: yo
  text: láti fi irú ọkùnrin bẹ́ẹ̀ lé Sátánì lọ́wọ́ fún ìparun ara[a], kí ẹ̀mí náà lè rí ìgbàlà ní ọjọ́ Olúwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìbàjẹ́ ara.” Gbólóhùn náà lè tọ́ka sí ìdájọ́ líle tó dé bá ara, tàbí, lọ́nà àpẹẹrẹ, sí pípa ìtẹ̀sí ẹlẹ́ran-ara àti ẹ̀ṣẹ̀ ọkùnrin náà run.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ẹ̀dà àfọwọ́kọ kan ní “Olúwa wa Jésù” tàbí “Olúwa Jésù” dípò “Olúwa” nìkan.
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: láti fi ... lé ... lọ́wọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a fi ẹnì kan lé ẹlòmíràn lọ́wọ́, ó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τὸν τοιοῦτον
  choice: irú ọkùnrin bẹ́ẹ̀
  rationale: Ó tọ́ka sí ọkùnrin tó ṣẹ̀ náà ní pàtó, nígbà tó tún pa ìtumọ̀ ìsọ̀rí inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: Σατανᾷ
  choice: Sátánì
  rationale: Àkọsílẹ̀ orúkọ náà ní ìlànà Yorùbá tí ó wọ́pọ̀.
- source_word: εἰς ὄλεθρον τῆς σαρκός
  choice: fún ìparun ara
  rationale: ‘Ìparun’ pa bí ọ̀rọ̀ náà ṣe lágbára mọ́, ‘ara’ sì jẹ́ kí àìdánilójú tó wà láàárín ìdájọ́ ara àti pípa ìtẹ̀sí ẹlẹ́ran-ara run dúró.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ilana yìí sọ ète tàbí àbájáde ní Yorùbá àdánidá.
- source_word: τὸ πνεῦμα
  choice: ẹ̀mí náà
  rationale: Kò fi arọ́pò-orúkọ oníhun kún un; ‘náà’ ń ṣàfihàn atọ́ka pàtó tí atọ́ka Gíríìkì náà ní.
- source_word: σωθῇ
  choice: lè rí ìgbàlà
  rationale: Ó sọ èrò ìgbàlà inú ọ̀rọ̀ náà ní kedere, ó sì bá ipò àfihàn ohun tí a ń retí mu.
- source_word: ἐν τῇ ἡμέρᾳ τοῦ κυρίου
  choice: ní ọjọ́ Olúwa
  rationale: Ó jẹ́ gbólóhùn Yorùbá tó ṣe déédéé fún àkókò ọjọ́ ìkẹyìn, láìfi ‘Jésù’ tàbí ‘wa’ kún ẹ̀dà orísun.
theological_decisions:
- issue: Ìtumọ̀ ‘ìparun ara’
  choice: A pa gbólóhùn aláìdánilójú náà mọ́ nínú ẹsẹ̀.
  alternative: Ìjìyà líle tàbí ikú ara; tàbí pípa ìtẹ̀sí ẹlẹ́ran-ara àti ẹ̀ṣẹ̀ ọkùnrin náà run.
  rationale: Ọ̀rọ̀ Gíríìkì kò fipá múni láti yan ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí, nítorí náà a kò yanjú ẹ̀kọ́ ìsìn tí ẹsẹ̀ náà fúnra rẹ̀ fi sílẹ̀ ní àìdánilójú.
- issue: Ẹni tí ‘ẹ̀mí náà’ ń tọ́ka sí
  choice: ẹ̀mí náà
  alternative: ẹ̀mí rẹ̀
  rationale: Ó ṣeé ṣe gan-an pé ẹ̀mí ọkùnrin tó ṣẹ̀ ni, ṣùgbọ́n Gíríìkì kò ní arọ́pò-orúkọ oníhun; a kò fi ‘rẹ̀’ kún un.
- issue: ‘Ọjọ́ Olúwa’ gẹ́gẹ́ bí ọ̀rọ̀ ọjọ́ ìkẹyìn
  choice: ní ọjọ́ Olúwa
  alternative: ní ọjọ́ Olúwa wa Jésù; ní ọjọ́ Olúwa Jésù
  rationale: Ẹ̀dà SBLGNT tí a pèsè ní ‘Olúwa’ nìkan; àwọn àfikún inú ẹ̀dà mìíràn wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá ti jẹ́ àdánidá, a sì pa ìríjú ẹ̀kọ́ ìsìn àti àìdánilójú ọ̀rọ̀ orísun mọ́.
