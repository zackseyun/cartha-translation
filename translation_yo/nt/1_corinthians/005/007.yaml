    reason: alternative_reading
  - marker: b
    text: Ní Gíríìkì, “Ìrékọjá wa” ni ó wà ní tààràtà; a lè lóye rẹ̀ sí “ọ̀dọ́-àgùntàn Ìrékọjá wa” tàbí “ẹbọ Ìrékọjá wa.”
    reason: lexical_alternative
  revision_rationale: The sole textual revision replaces the perfective ti with ṣe in the comparison clause, yielding a present-state expression that corresponds directly to ἐστε. The wording, supplied Passover-lamb clarification, and both footnotes otherwise safely retain the source meaning and its lexical ambiguity.
