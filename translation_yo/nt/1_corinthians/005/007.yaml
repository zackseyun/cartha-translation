id: 1CO.5.7
reference: 1 Corinthians 5:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: yo
  text: Ẹ mú ìwúkàrà àtijọ́ kúrò pátápátá, kí ẹ lè jẹ́ ìyẹ̀fun tuntun tí a pò, gẹ́gẹ́ bí ẹ ṣe jẹ́ aláìwúkàrà. Nítorí a ti fi Mèsáyà[a], ọ̀dọ́-àgùntàn Ìrékọjá wa[b], rú ẹbọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ni Christos, ìyẹn “Ẹni tí a fi àmì òróró yàn”; a tún lè tú u sí “Kristi.”
    reason: alternative_reading
  - marker: b
    text: Ní Gíríìkì, “Ìrékọjá wa” ni ó wà ní tààràtà; a lè lóye rẹ̀ sí “ọ̀dọ́-àgùntàn Ìrékọjá wa” tàbí “ẹbọ Ìrékọjá wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: Ẹ mú … kúrò pátápátá
  rationale: Ọ̀rọ̀ àṣẹ yìí ń béèrè pé kí gbogbo wọn mú ohun náà kúrò gedegbe; “pátápátá” fi agbára ìṣe náà hàn ní Yorùbá àdánidá.
- source_word: παλαιὰν ζύμην
  choice: ìwúkàrà àtijọ́
  rationale: “Ìwúkàrà” pa àwòrán búrẹ́dì aláìwúkàrà àti Ìrékọjá mọ́, “àtijọ́” sì ṣàfihàn παλαιὰν.
- source_word: ἵνα ἦτε νέον φύραμα
  choice: kí ẹ lè jẹ́ ìyẹ̀fun tuntun tí a pò
  rationale: Gbólóhùn yìí ṣàfihàn ète àṣẹ náà, ó sì tú φύραμα sí ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye gẹ́gẹ́ bí ìyẹ̀fun tí a ti pò fún ṣíṣe búrẹ́dì.
- source_word: καθώς ἐστε ἄζυμοι
  choice: gẹ́gẹ́ bí ẹ ti jẹ́ aláìwúkàrà
  rationale: Èyí pa ìfọwọ́sowọ́pọ̀ tó wà láàárín àṣẹ láti di tuntun àti ipò tí wọ́n ti ní mọ́, láìyanjú ìforígbárí ọ̀rọ̀ náà.
- source_word: τὸ πάσχα ἡμῶν
  choice: ọ̀dọ́-àgùntàn Ìrékọjá wa
  rationale: Ní àyíká ἐτύθη, ọ̀rọ̀ náà ń tọ́ka sí ẹran ẹbọ Ìrékọjá; fífi “ọ̀dọ́-àgùntàn” kún un mú ohun tí àyíká túmọ̀ sí ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ ṣàkọsílẹ̀ ọ̀rọ̀ Gíríìkì gangan.
- source_word: ἐτύθη
  choice: a ti fi … rú ẹbọ
  rationale: Ọ̀rọ̀ yìí jẹ́ ìṣe aláìṣe-taara fún pípa ẹran gẹ́gẹ́ bí ẹbọ; àkójọpọ̀ “a ti fi … rú ẹbọ” jẹ́ Yorùbá àdánidá tó sì pa ìtumọ̀ ìrúbọ mọ́.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Ní àyíká Ìrékọjá yìí, Χριστός dúró gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fi àmì òróró yàn, nítorí náà “Mèsáyà” ló mú ìtumọ̀ oyè náà hàn dáadáa.
theological_decisions:
- issue: Ìtumọ̀ πάσχα ní ìbáṣepọ̀ rẹ̀ pẹ̀lú Mèsáyà
  choice: ọ̀dọ́-àgùntàn Ìrékọjá wa
  alternative: Ìrékọjá wa; ẹbọ Ìrékọjá wa
  rationale: Gíríìkì sọ ní ṣókí pé “Ìrékọjá wa,” ṣùgbọ́n ọ̀rọ̀ “a ti fi … rú ẹbọ” fi hàn pé ẹran ẹbọ Ìrékọjá ni àfojúsùn. Àlàyé ìsàlẹ̀ pa àìdánilójú ọ̀rọ̀ ìpilẹ̀ mọ́.
- issue: Bí a ṣe tú Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àyíká ìtàn ìgbàlà àti Ìrékọjá mú iṣẹ́ Χριστός gẹ́gẹ́ bí oyè ṣe pàtàkì; “Mèsáyà” kò sọ ọ́ di orúkọ lásán.
- issue: Ìforígbárí láàárín àṣẹ láti jẹ́ tuntun àti gbólóhùn pé wọ́n ti jẹ́ aláìwúkàrà
  choice: Pa méjèèjì mọ́ ní tààràtà
  alternative: Ṣàlàyé “aláìwúkàrà” gẹ́gẹ́ bí ẹni tí a ti sọ di mímọ́
  rationale: Ọ̀rọ̀ Gíríìkì mọ̀ọ́mọ̀ gbé ohun tí wọ́n gbọ́dọ̀ ṣe lẹ́gbẹ̀ẹ́ ohun tí wọ́n ti jẹ́. Ìtumọ̀ kò gbọ́dọ̀ yanjú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ yìí nípasẹ̀ àfikún àlàyé sínú ẹsẹ.
translation_notes:
  register: A lo Yorùbá ìpele ọ̀wọ̀, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. Àmì ohùn wà níbi tí wọ́n ti yẹ. Gbólóhùn “ìyẹ̀fun tuntun tí a pò” yẹra fún ọ̀rọ̀ ìjọ àtijọ́ tí kò wọ́pọ̀, ó sì pa àwòrán ìwúkàrà àti ìyẹ̀fun mọ́.
