  to: Ẹ mú ìwúkàrà àtijọ́ kúrò pátápátá, kí ẹ lè jẹ́ ìyẹ̀fun tuntun tí a pò, gẹ́gẹ́ bí ẹ ṣe jẹ́ aláìwúkàrà. Nítorí a ti fi Mèsáyà[a], ọ̀dọ́-àgùntàn Ìrékọjá wa[b], rú ẹbọ.
