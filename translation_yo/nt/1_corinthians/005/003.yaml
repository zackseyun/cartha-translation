reference: 1 Corinthians 5:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: yo
  text: Nítorí pé èmi, bí ó tilẹ̀ jẹ́ pé mi kò sí nípa ti ara, ṣùgbọ́n mo wà nípa ti ẹ̀mí[a], mo ti dá ẹni tí ó ṣe ohun yìí ní irú ọ̀nà bẹ́ẹ̀ lẹ́jọ́ tẹ́lẹ̀[b], bí ẹni pé mo wà níbẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe jù pé “nípa ti ẹ̀mí” ń tọ́ka sí ẹ̀mí Pọ́ọ̀lù fúnra rẹ̀, kì í ṣe Ẹ̀mí Mímọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mo ti ṣe ìdájọ́ lórí ẹni náà tẹ́lẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὼν τῷ σώματι
  choice: kò sí nípa ti ara
  rationale: Ó fi hàn pé Pọ́ọ̀lù kò sí níbẹ̀ lọ́nà ti ara, láìdábàá pé ẹ̀mí rẹ̀ ti jáde kúrò nínú ara tàbí pé ó ti kú.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: ṣùgbọ́n tí mo wà nípa ti ẹ̀mí
  rationale: Ó pa ìtakora tó wà láàárín σώματι àti πνεύματι mọ́, ó sì fi gbolohun náà sílẹ̀ láìfi èrò pàtó kan kún irú wíwà níbẹ̀ tí Pọ́ọ̀lù ń sọ.
- source_word: ἤδη κέκρικα
  choice: mo ti dá ... lẹ́jọ́ tẹ́lẹ̀
  rationale: Àkókò perfect fi ìdájọ́ tí a ti ṣe, tí ipa rẹ̀ sì ṣì dúró, hàn; ‘dá ... lẹ́jọ́’ bá ọ̀rọ̀ κρίνω àti ọ̀rọ̀ ìbáwí inú àyíká yìí mu.
- source_word: ὡς παρὼν
  choice: bí ẹni pé mo wà níbẹ̀
  rationale: Ó mú agbára àfiwé ὡς jáde lọ́nà Yorùbá tó ṣe déédéé, ó sì fi hàn pé ìdájọ́ rẹ̀ dúró bí ẹni pé ó wà pẹ̀lú wọn ní ti ara.
- source_word: τὸν ... κατεργασάμενον
  choice: ẹni tí ó ṣe
  rationale: Participle náà dúró gẹ́gẹ́ bí orúkọ ẹni; ‘ẹni tí ó ṣe’ kò fi ‘ọkùnrin’ kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: οὕτως τοῦτο
  choice: ohun yìí lọ́nà bẹ́ẹ̀
  rationale: ‘Ohun yìí’ ṣàfihàn τοῦτο, ‘lọ́nà bẹ́ẹ̀’ sì pa ipa οὕτως mọ́, dípò kí a sọ àwọn méjèèjì di ‘irú ohun yìí’ nìkan.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé tó ṣáájú gẹ́gẹ́ bí ìdí tàbí ìṣàlàyé.
- source_word: μὲν ... δὲ
  choice: bí ... tilẹ̀ ... ṣùgbọ́n
  rationale: Àgbékalẹ̀ Yorùbá yìí fi ìtakora àwọn particles méjèèjì hàn lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ‘wà nípa ti ẹ̀mí’
  choice: A pa gbolohun náà mọ́ gẹ́gẹ́ bí ìtakora sí àìsí Pọ́ọ̀lù nípa ti ara, ó sì ṣeé ṣe jù pé ẹ̀mí Pọ́ọ̀lù fúnra rẹ̀ ni ó túmọ̀ sí.
  alternative: Kí a túmọ̀ ọ́ sí wíwà nípasẹ̀ Ẹ̀mí Mímọ́ tàbí sí irú wíwà àdììtú kan láàárín wọn.
  rationale: Àìsí article pẹ̀lú πνεύματι àti ìtakora tààrà sí σώματι tọ́ka sí ẹ̀mí Pọ́ọ̀lù fúnra rẹ̀. Síbẹ̀, ìtumọ̀ náà kò ṣàlàyé bí wíwà nípa ti ẹ̀mí ṣe ń ṣiṣẹ́, nítorí náà a kò fi ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àwọn àmì àlàyé ìsàlẹ̀ ni a gbé síbi tí ọ̀rọ̀ tí wọ́n ń ṣàlàyé wà, nítorí àwọn àmì inú consultation layer Gẹ̀ẹ́sì kò bá àkóónú àlàyé wọn mu.
