id: 1CO.5.6
reference: 1 Corinthians 5:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: yo
  text: Ìṣògo yín kò dára. Ṣé ẹ kò mọ̀ pé ìwúkàrà díẹ̀ ni í mú gbogbo ìṣù ìyẹ̀fun[a] wú?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo ìṣù náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: dára
  rationale: Ọ̀rọ̀ náà ń ṣe ìdájọ́ ìwà àti ohun tí ó yẹ; “dára” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣe kedere.
- source_word: καύχημα
  choice: ìṣògo
  rationale: Ó lè tọ́ka sí ṣíṣe ìṣògo tàbí ohun tí a ń ṣògo lé lórí; “ìṣògo” pa àìdánilójú yẹn mọ́, ó sì bá ohùn ìbáwí mu.
- source_word: οὐκ οἴδατε
  choice: Ṣé ẹ kò mọ̀
  rationale: Èyí pa ìbéèrè àsọyé Pọ́ọ̀lù mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: μικρὰ ζύμη
  choice: ìwúkàrà díẹ̀
  rationale: “Ìwúkàrà” pa àwòrán ìṣe búrẹ́dì ìgbàanì àti ìtumọ̀ àkàwé rẹ̀ mọ́; “díẹ̀” fi ìwọ̀nba kékeré hàn.
- source_word: ὅλον τὸ φύραμα
  choice: gbogbo ìṣù ìyẹ̀fun
  rationale: “Ìṣù ìyẹ̀fun” ṣàlàyé ìyẹ̀fun tí a ti pò ní ọ̀nà tí òǹkàwé Yorùbá òde òní lè lóye, “gbogbo” sì pa ìtẹnumọ́ ὅλον mọ́.
- source_word: ζυμοῖ
  choice: ni í mú ... wú
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ipa ìwúkàrà lórí ìṣù ìyẹ̀fun, ó sì pa ìbáṣepọ̀ àwòrán náà mọ́.
theological_decisions:
- issue: Àkàwé ìwúkàrà
  choice: Pa àwòrán ìwúkàrà mọ́ láì fi ìtumọ̀ rẹ̀ sí ‘ẹ̀ṣẹ̀’ tàbí ‘ìjọ’ sínú ẹsẹ náà.
  alternative: Ṣàlàyé rẹ̀ gẹ́gẹ́ bí ‘ẹ̀ṣẹ̀ díẹ̀ ń ba gbogbo ìjọ jẹ́.’
  rationale: Pọ́ọ̀lù sọ òwe àkàwé kan; àyíká ọ̀rọ̀ ló ń fi ohun tí ó ń tọ́ka sí hàn. Fífi àlàyé náà sínú ẹsẹ yóò dín ìfọ̀rọ̀wérọ̀ àti agbára àwòrán Gíríìkì kù.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. Ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì pa ohùn ìbáwí àti ìbéèrè àsọyé Pọ́ọ̀lù mọ́.
