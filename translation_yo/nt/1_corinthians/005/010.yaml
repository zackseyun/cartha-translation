id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: yo
  text: Èyí kò túmọ̀ sí àwọn tí ń ṣe àgbèrè ní ayé yìí rárá, tàbí àwọn oníwọ̀ra, àwọn ọlọ́ṣà, tàbí àwọn abọ̀rìṣà;[a] bí ó bá rí bẹ́ẹ̀, ẹ̀yin ì bá ní láti jáde kúrò nínú ayé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn alọ́nilọ́wọ́gbà” fún “àwọn ọlọ́ṣà” (ἅρπαξιν); ọ̀rọ̀ náà lè tọ́ka sí àwọn tí ń gba ohun àwọn ẹlòmíràn nípa agbára tàbí ìjẹnilógún.
    reason: lexical_alternative
  - marker: b
    text: Pọ́ọ̀lù ń ṣàlàyé pé kò túmọ̀ sí pé kí àwọn onígbàgbọ́ yẹra fún gbogbo àwọn ènìyàn oníṣekúṣe tí wọ́n wà níta ìjọ; fi wé 1 Kọ́ríńtì 5:11.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: Èyí kò túmọ̀ sí ... rárá
  rationale: Ọ̀rọ̀ náà ń ṣàlàyé pé ohun tí Pọ́ọ̀lù kọ tẹ́lẹ̀ kò kan gbogbo irú àwọn ènìyàn wọ̀nyí láìsí ààlà; ìtumọ̀ yìí mú ìtẹnumọ́ àti iṣẹ́ àlàyé rẹ̀ jáde ní Yorùbá àdánidá.
- source_word: πόρνοις
  choice: àwọn oníṣekúṣe
  rationale: Ó tọ́ka sí àwọn tí ń ṣe ìwà ìbálòpọ̀ tí kò tọ́; ‘oníṣekúṣe’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì ní ìdíwọ̀n ọlá tó yẹ fún Bíbélì.
- source_word: τοῦ κόσμου τούτου
  choice: ti ayé yìí
  rationale: κόσμος níbí ń tọ́ka sí àwùjọ ènìyàn níta ìjọ; ‘ayé yìí’ pa àwòrán àti ìyàtọ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: πλεονέκταις
  choice: àwọn oníwọ̀ra
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe àwọn tí ìfẹ́ láti ní sí i ń darí, pẹ̀lú èrò ìfi ojúkòkòrò gba ohun ẹlòmíràn; ‘oníwọ̀ra’ jẹ́ kíkún, ó sì yé àwọn òǹkàwé òde òní.
- source_word: ἅρπαξιν
  choice: àwọn afiniṣèjẹ
  rationale: ἅρπαξ lè túmọ̀ sí ẹni tí ń fi agbára tàbí àǹfààní jẹ ẹlòmíràn ní nǹkan; ‘afiniṣèjẹ’ gba ìtumọ̀ ìjẹnilógún yìí, láìfi sí ọ̀nà jíjà kan ṣoṣo.
- source_word: εἰδωλολάτραις
  choice: àwọn abọ̀rìṣà
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwọn tí ń sin òrìṣà tàbí ère dípò Ọlọ́run.
- source_word: ἐπεὶ ... ὠφείλετε
  choice: bí ó bá rí bẹ́ẹ̀, ẹ̀yin ì bá ní láti
  rationale: 'Àkójọpọ̀ yìí fi àbájáde ohun tí kò ṣeé ṣe hàn: bí ìtọ́ni náà bá kan gbogbo àwọn ènìyàn bẹ́ẹ̀, jíjáde kúrò ní ayé ni yóò di dandan.'
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: jáde kúrò nínú ayé
  rationale: Ìtumọ̀ yìí pa àwòrán líle tí ọ̀rọ̀ Gíríìkì lò mọ́, ó sì fi àṣejù onígbọ̀nwọ̀ inú àríyànjiyàn náà hàn.
theological_decisions:
- issue: Ìwọ̀n ìyapa tí àyíká ẹsẹ̀ náà ń pàṣẹ
  choice: Pọ́ọ̀lù ń sọ pé ìtọ́ni rẹ̀ tẹ́lẹ̀ kò túmọ̀ sí kí àwọn onígbàgbọ́ ya ara wọn pátápátá sọ́tọ̀ kúrò lọ́dọ̀ gbogbo aláìgbàgbọ́ oníṣekúṣe ní àwùjọ.
  alternative: Kí àwọn onígbàgbọ́ jáwọ́ nínú gbogbo ìbáṣepọ̀ pẹ̀lú gbogbo ènìyàn oníṣekúṣe.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ fi ìtumọ̀ tí kò ní ààlà yẹn sílẹ̀ nítorí pé, bí bẹ́ẹ̀ kọ́, wọn ì bá ní láti jáde kúrò nínú ayé. Ìtumọ̀ náà pa iṣẹ́ àlàyé Pọ́ọ̀lù mọ́, láìgbé ẹ̀kọ́ ìyapa ẹ̀sìn tí ọ̀rọ̀ náà kò sọ wọ inú rẹ̀.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní ọlá, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Ẹ̀yin ì bá ní láti’ ń sọ ọ̀pọ̀ ènìyàn tí ὠφείλετε tọ́ka sí, ‘jáde kúrò nínú ayé’ sì pa ìtẹnumọ́ àwòrán orísun mọ́.
