revisions:
- from: Èyí kò túmọ̀ sí àwọn oníṣekúṣe ti ayé yìí rárá, tàbí àwọn oníwọ̀ra àti àwọn afiniṣèjẹ, tàbí àwọn abọ̀rìṣà;[a] bí ó bá rí bẹ́ẹ̀, ẹ̀yin ì bá ní láti jáde kúrò nínú ayé.[b]
  to: Èyí kò túmọ̀ sí àwọn tí ń ṣe àgbèrè ní ayé yìí rárá, tàbí àwọn oníwọ̀ra, àwọn ọlọ́ṣà, tàbí àwọn abọ̀rìṣà;[a] bí ó bá rí bẹ́ẹ̀, ẹ̀yin ì bá ní láti jáde kúrò nínú ayé.[b]
  rationale: A rọ́pò ọ̀rọ̀ gbooro “oníṣekúṣe” pẹ̀lú “àwọn tí ń ṣe àgbèrè” kí ìtumọ̀ ìbálòpọ̀ nínú πόρνοις má bàa sọnù. A tún rọ́pò “afiniṣèjẹ” pẹ̀lú “ọlọ́ṣà,” tí ó ṣe kedere sí i, nígbà tí àlàyé ẹsẹ̀ ìsàlẹ̀ ń dá ìtumọ̀ ἅρπαξιν tí ó lè kan ìjẹnilógún sílẹ̀. Ìtumọ̀ ìyókù pa ìfẹnu-kúrò tí kò ṣeé ṣe nínú àríyànjiyàn Pọ́ọ̀lù mọ́.
