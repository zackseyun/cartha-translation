id: 1CO.5.2
reference: 1 Corinthians 5:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: yo
  text: Ẹ̀yin sì ti kún fún ìgbéraga[a]. Kò ha yẹ kí ẹ kúkú ṣọ̀fọ̀, kí a lè mú ẹni tí ó ṣe iṣẹ́ yìí kúrò láàárín yín?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, “ẹ ti wú”; èyí jẹ́ àwòrán fún ìgbéraga.
    reason: Àlàyé ìtumọ̀ àwòrán
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: ti wú fún ìgbéraga
  rationale: Ó pa àwòrán ohun tí ó wú mọ́, ó sì fi hàn pé ìgbéraga ni Pọ́ọ̀lù ń bá wí; perfect náà tọ́ka sí ipò tí wọ́n ti wà nínú rẹ̀.
- source_word: οὐχὶ μᾶλλον
  choice: Kò ha yẹ kí ẹ kúkú
  rationale: Ó jẹ́ ìbéèrè ìbáwí tí ó fi ohun tí ó yẹ kí wọ́n ṣe wé ìwà tí wọ́n hù; ‘kúkú’ mú ìtumọ̀ ‘rather’ jáde lọ́nà Yorùbá àdánidá.
- source_word: ἐπενθήσατε
  choice: ṣọ̀fọ̀
  rationale: Ọ̀rọ̀ yìí lágbára ju ìbànújẹ́ lásán lọ, ó sì bá ẹ̀dùn ọkàn àwùjọ nípa ẹ̀ṣẹ̀ mu.
- source_word: ἵνα ἀρθῇ
  choice: kí a lè mú ... kúrò
  rationale: Ó pa ìtumọ̀ ète tàbí àbájáde mọ́, ó sì fi ohùn àìṣe-taara ti Gíríìkì hàn láì sọ ẹni tó máa ṣe ìgbésẹ̀ náà ní pàtó.
- source_word: ἐκ μέσου ὑμῶν
  choice: kúrò láàárín yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún yíyọ ẹni kan kúrò nínú àwùjọ wọn.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: ẹni tí ó ṣe iṣẹ́ yìí
  rationale: Ó dá ẹni tó ṣẹ̀ mọ̀ láì tún orúkọ rẹ̀ sọ, ó sì tẹ̀ lé ìtumọ̀ gbooro ἔργον láì fi àlàyé tí kò sí nínú ọ̀rọ̀ kún un.
theological_decisions:
- issue: Irú ìgbésẹ̀ tí a fẹ́ kí wọ́n gbé sí ẹni tó ṣẹ̀
  choice: mú ... kúrò láàárín yín
  alternative: yọ ọ́ kúrò nínú ìjọ; tàbí kí Ọlọ́run mú un kúrò
  rationale: ἀρθῇ lè túmọ̀ sí mímú ẹni náà kúrò ní gbogbogbòò. Àyíká ẹsẹ 3–5 àti 13 tọ́ka sí ìbáwí àwùjọ, ṣùgbọ́n a kò lo ọ̀rọ̀ ìtumọ̀-ẹ̀kọ́ bí ‘yọ kúrò nínú ìjọ,’ bẹ́ẹ̀ ni a kò sọ pé Ọlọ́run ló ṣe e, kí àìdánilójú inú ọ̀rọ̀ Gíríìkì lè dúró.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní. A lo ‘ẹ̀yin/ẹ/yín’ fún ọ̀pọ̀ ènìyàn. ‘Ṣọ̀fọ̀’ pa agbára ọ̀rọ̀ ìbànújẹ́ Gíríìkì mọ́; ‘mú ... kúrò láàárín yín’ sì yẹra fún pípa àìdánilójú theological rẹ́.
