- from: Ẹ̀yin sì ti wú fún ìgbéraga[a]. Kò ha yẹ kí ẹ kúkú ṣọ̀fọ̀, kí a lè mú ẹni tí ó ṣe iṣẹ́ yìí kúrò láàárín yín?
  to: Ẹ̀yin sì ti kún fún ìgbéraga[a]. Kò ha yẹ kí ẹ kúkú ṣọ̀fọ̀, kí a lè mú ẹni tí ó ṣe iṣẹ́ yìí kúrò láàárín yín?
  rationale: A tún ‘ti wú fún ìgbéraga’ ṣe sí ‘ti kún fún ìgbéraga’ fún Yorùbá boṣewa tó dára síi. A pa ìbéèrè ìbáwí, ìṣọ̀fọ̀ tó yẹ, ète/àbájáde, àti ohùn àìṣe-taara ti ìmúkúrò mọ́. Àlàyé ìsàlẹ̀ náà sì tún jẹ́ kó hàn pé àwòrán ‘wíwú’ Gíríìkì wà níbẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:55Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìbéèrè ìbáwí náà, ìpè sí ìṣọ̀fọ̀, àti ìtumọ̀ gbooro ti mímú ẹni náà kúrò nínú àwùjọ dáadáa. Síbẹ̀, ‘ti wú fún ìgbéraga’ kì í wọ́pọ̀ gẹ́gẹ́ bí ìsọ̀rọ̀ Yorùbá nínú àyíká yìí; ‘ti kún fún ìgbéraga’ jẹ́ kedere síi, bí ó tilẹ̀ jẹ́ pé ó fi àwòrán ‘wíwú’ sílẹ̀ nínú àlàyé ìsàlẹ̀.
  naturalness: ‘Kò ha yẹ kí ẹ kúkú ṣọ̀fọ̀’ jẹ́ ìbéèrè ìbáwí tí ó dára, ó sì mú μᾶλλον hàn lọ́nà àdánidá. Ìtúnṣe sí ‘ti kún fún ìgbéraga’ mú ìbẹ̀rẹ̀ ẹsẹ̀ náà rọrùn àti ìbílẹ̀ síi nínú Yorùbá òde òní.
  terminology: ‘Ṣọ̀fọ̀’ dá agbára ἐπενθήσατε mú. ‘Mú ẹni tí ó ṣe iṣẹ́ yìí kúrò láàárín yín’ pa ohùn àìṣe-taara ti ἀρθῇ mọ́, kò sì fi ẹni tí yóò ṣe ìmúkúrò náà tàbí irú ìbáwí kan pàtó kún un.
  issues:
  - severity: low
    issue: ‘Ti wú fún ìgbéraga’ kò rọrùn tó gẹ́gẹ́ bí ìsọ̀rọ̀ Yorùbá.
    rationale: Ìsọ̀rọ̀ náà lè yọrí sí ìmọ̀ ‘swollen because of pride’; ‘ti kún fún ìgbéraga’ sọ ipò πεφυσιωμένοι ní Yorùbá tó wọ́pọ̀ síi.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ ti àwòrán ‘wíwú’ lè jẹ́ kedere síi.
    rationale: Níwọ̀n bí ìtumọ̀ àkọ́kọ́ ṣe lo ‘kún fún ìgbéraga,’ àlàyé náà yẹ kí ó sọ pé ‘wú’ ni àwòrán Gíríìkì, kí ìpinnu ìtumọ̀ má bàa dà bí ìyàtọ̀ ìtumọ̀ pàtàkì.
