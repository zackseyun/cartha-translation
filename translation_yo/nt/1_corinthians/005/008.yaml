id: 1CO.5.8
reference: 1 Corinthians 5:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: yo
  text: Nítorí náà, ẹ jẹ́ kí a ṣe àjọyọ̀ náà[a], kì í ṣe pẹ̀lú ìwúkàrà àtijọ́, tàbí pẹ̀lú ìwúkàrà ìkà àti ìwà búburú, ṣùgbọ́n pẹ̀lú búrẹ́dì tí kò ní ìwúkàrà ti òótọ́ inú àti òtítọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘ẹ jẹ́ kí a ṣe ayẹyẹ,’ tàbí, ‘ẹ jẹ́ kí a máa pa àjọ náà mọ́.’ Ọ̀rọ̀ Gíríìkì náà ń tẹ̀ síwájú nínú àwòrán àjọ Ìrékọjá láti ẹsẹ̀ tó ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, Gíríìkì ní, ‘pẹ̀lú àwọn ohun aláìwúkàrà ti òótọ́ inú àti òtítọ́.’ A fi ‘búrẹ́dì’ kún un láti mú àwòrán Ìrékọjá ṣe kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi ìparí ọ̀rọ̀ tí ó jáde láti inú àríyànjiyàn ẹsẹ̀ tó ṣáájú hàn ní Yorùbá àdánidá.
- source_word: ἑορτάζωμεν
  choice: ẹ jẹ́ kí a máa ṣe àjọyọ̀ náà
  rationale: Ọ̀rọ̀ ìyànjú ni; ‘máa ṣe àjọyọ̀ náà’ pa àwòrán àjọ Ìrékọjá mọ́, ó sì tún lè tọ́ka sí ìgbé ayé ayẹyẹ tí ń bá a lọ.
- source_word: ζύμῃ παλαιᾷ
  choice: pẹ̀lú ìwúkàrà àtijọ́
  rationale: ‘Ìwúkàrà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ohun tí ń mú ìyẹ̀fun wú, ó sì pa àwòrán orísun mọ́.
- source_word: κακίας
  choice: ìkà
  rationale: Ó sọ ìwà tàbí èrò búburú sí ẹlòmíràn, ó sì yàtọ̀ díẹ̀ sí πονηρία.
- source_word: πονηρίας
  choice: ìwà búburú
  rationale: Ó mú ìtumọ̀ ìbàjẹ́ ní ti ìwà hàn ní èdè tí òǹkàwé òde òní lè lóye.
- source_word: ἀζύμοις
  choice: àkàrà aláìwúkàrà
  rationale: Ní Gíríìkì, ọ̀rọ̀ náà túmọ̀ sí ‘àwọn ohun aláìwúkàrà’; fífi ‘àkàrà’ kún un mú àwòrán àjọ Ìrékọjá ṣe kedere ní Yorùbá.
- source_word: εἰλικρινείας
  choice: òótọ́ inú
  rationale: Ó fi ìwà àìlábòsí àti ìjẹ́-ojúlówó hàn lọ́nà Yorùbá àdánidá.
- source_word: ἀληθείας
  choice: òtítọ́
  rationale: Ìtumọ̀ tààrà tí ó pa ìyàtọ̀ rẹ̀ mọ́ sí ‘òótọ́ inú’.
theological_decisions:
- issue: Àwòrán àjọ Ìrékọjá nínú ìyànjú Pọ́ọ̀lù
  choice: Pa ‘àjọyọ̀’ àti ‘àkàrà aláìwúkàrà’ mọ́ nínú ọ̀rọ̀ náà.
  alternative: Túmọ̀ rẹ̀ ní gbogbogbò gẹ́gẹ́ bí ‘ẹ jẹ́ kí a yọ̀’ tàbí ‘pẹ̀lú òótọ́ inú àti òtítọ́’ láìsọ àkàrà.
  rationale: Ọ̀rọ̀ tó ṣáájú pè Mèsáyà ní ọ̀dọ́-àgùntàn Ìrékọjá; nítorí náà, àwòrán àjọ àti àìwúkàrà jẹ́ apá pàtàkì nínú ìrònú Pọ́ọ̀lù, bí ó tilẹ̀ jẹ́ pé ìyànjú náà ní agbára ìwà rere pẹ̀lú.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ó bójú mu fún ìkàwé ní gbangba, ó sì lo àwọn ọ̀rọ̀ tí òǹkàwé òde òní lè lóye. A yàn ‘ìwúkàrà’ dípò ọ̀rọ̀ àtijọ́ tàbí àwòrán tí kò ṣe kedere.
