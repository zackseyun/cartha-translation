revisions:
- from: Nítorí náà, ẹ jẹ́ kí a máa ṣe àjọyọ̀ náà[a], kì í ṣe pẹ̀lú ìwúkàrà àtijọ́, tàbí pẹ̀lú ìwúkàrà ìkà àti ìwà búburú, ṣùgbọ́n pẹ̀lú àkàrà aláìwúkàrà ti òótọ́ inú àti òtítọ́[b].
  to: Nítorí náà, ẹ jẹ́ kí a ṣe àjọyọ̀ náà[a], kì í ṣe pẹ̀lú ìwúkàrà àtijọ́, tàbí pẹ̀lú ìwúkàrà ìkà àti ìwà búburú, ṣùgbọ́n pẹ̀lú búrẹ́dì tí kò ní ìwúkàrà ti òótọ́ inú àti òtítọ́[b].
  rationale: The revision preserves the Greek’s hortatory force, the repeated leaven metaphor, and the Passover-festival imagery. It removes an unwarranted iterative shade and uses an unambiguous modern Yoruba term for bread. Both footnotes remain anchored to the same places and now state lexical alternatives and the supplied noun accurately.
  reviewer_model: gpt-5.6-terra
