review_pass:
  verdict: revise
  source_fidelity: The draft retains Paul’s inferential exhortation and the contrasting Passover imagery of old leaven versus unleavened food. However, the iterative auxiliary “máa” is not required by the present hortatory subjunctive, and “àkàrà” ordinarily denotes a bean fritter in modern Yoruba, not bread. This can obscure the specific unleavened-bread image supplied by the translation.
  naturalness: “Ẹ jẹ́ kí a ṣe àjọyọ̀ náà” is a natural hortatory expression without adding a continuing or habitual nuance. “Búrẹ́dì tí kò ní ìwúkàrà” is clear contemporary Yoruba for unleavened bread. “Òótọ́ inú àti òtítọ́” preserves the two coordinated qualities naturally.
  terminology: “Ìwúkàrà” appropriately renders leaven/yeast, while “ìkà” and “ìwà búburú” maintain a useful distinction for κακία and πονηρία. Replacing “àkàrà aláìwúkàrà” with “búrẹ́dì tí kò ní ìwúkàrà” avoids an unintended reference to the familiar Yoruba bean cake while retaining the Passover metaphor.
  issues:
  - severity: medium
    issue: “Àkàrà aláìwúkàrà” is potentially misleading in modern Yoruba.
    rationale: In ordinary modern Yoruba, àkàrà primarily refers to a fried bean cake/fritter. The supplied referent in this Passover context is unleavened bread; “búrẹ́dì tí kò ní ìwúkàrà” communicates this accurately and clearly.
  - severity: low
    issue: “Máa” adds an unnecessary iterative/ongoing nuance to ἑορτάζωμεν.
    rationale: The Greek present hortatory subjunctive calls for “let us celebrate/keep the feast”; it need not explicitly mean “let us keep on celebrating.” Removing máa is closer and more idiomatic.
  - severity: low
    issue: Footnote a’s alternative “ẹ jẹ́ kí a máa yọ̀” weakens the lexical festival sense.
    rationale: ἑορτάζω means celebrate or observe a festival, not simply rejoice. The alternative should retain the celebration/festival concept.
  revised_text: Nítorí náà, ẹ jẹ́ kí a ṣe àjọyọ̀ náà[a], kì í ṣe pẹ̀lú ìwúkàrà àtijọ́, tàbí pẹ̀lú ìwúkàrà ìkà àti ìwà búburú, ṣùgbọ́n pẹ̀lú búrẹ́dì tí kò ní ìwúkàrà ti òótọ́ inú àti òtítọ́[b].
  revised_footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘ẹ jẹ́ kí a ṣe ayẹyẹ,’ tàbí, ‘ẹ jẹ́ kí a máa pa àjọ náà mọ́.’ Ọ̀rọ̀ Gíríìkì náà ń tẹ̀ síwájú nínú àwòrán àjọ Ìrékọjá láti ẹsẹ̀ tó ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, Gíríìkì ní, ‘pẹ̀lú àwọn ohun aláìwúkàrà ti òótọ́ inú àti òtítọ́.’ A fi ‘búrẹ́dì’ kún un láti mú àwòrán Ìrékọjá ṣe kedere.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek’s hortatory force, the repeated leaven metaphor, and the Passover-festival imagery. It removes an unwarranted iterative shade and uses an unambiguous modern Yoruba term for bread. Both footnotes remain anchored to the same places and now state lexical alternatives and the supplied noun accurately.
