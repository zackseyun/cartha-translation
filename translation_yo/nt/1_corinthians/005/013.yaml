id: 1CO.5.13
reference: 1 Corinthians 5:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοὺς δὲ ἔξω ὁ θεὸς ⸀κρίνει; ⸀ἐξάρατε τὸν πονηρὸν ἐξ ὑμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: yo
  text: Ṣùgbọ́n Ọlọ́run ń ṣe ìdájọ́ àwọn tí ó wà níta.[a][b] Ẹ yọ ọkùnrin búburú náà kúrò ní àárín yín.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ará òde.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀-ìṣe Gíríìkì wà ní ìgbà ìsinsìnyí (“ń ṣe ìdájọ́”), bí ó tilẹ̀ jẹ́ pé àwọn ìtumọ̀ kan túmọ̀ ọ́ sí “yóò ṣe ìdájọ́” nítorí àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Ẹ lé ọkùnrin búburú náà jáde kúrò ní àárín yín.” Ọ̀nà tí a gbà sọ ọ́ tún ń dún bí àwọn àṣẹ inú Diutarónómì láti mú ibi kúrò ní àárín àwọn ènìyàn májẹ̀mú.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: àwọn tí ó wà lóde
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí àwọn ènìyàn tí wọn kò sí nínú àwùjọ ìjọ. Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìbáṣepọ̀ ‘àwọn tí ó wà níta’ mọ́ láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn láàárín ojúṣe ìjọ sí àwọn tí ó wà nínú rẹ̀ àti ìdájọ́ Ọlọ́run lórí àwọn tí ó wà lóde.
- source_word: κρίνει
  choice: ń ṣe ìdájọ́
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì jẹ́ ìgbà ìsinsìnyí. ‘Ń ṣe ìdájọ́’ pa àkókò yẹn mọ́, ó sì lè sọ òtítọ́ tí ó máa ń rí bẹ́ẹ̀ ní gbogbo ìgbà.
- source_word: ἐξάρατε
  choice: Ẹ mú ... kúrò
  rationale: Àṣẹ náà ń béèrè ìgbésẹ̀ pàtó láti yọ ẹni náà kúrò nínú àwùjọ. Ọ̀rọ̀ yìí ṣe kedere ní Yorùbá láì fi ètò ìbáwí ìjọ tí ọ̀rọ̀ Gíríìkì kò sọ ní pàtó kún un.
- source_word: τὸν πονηρὸν
  choice: ọkùnrin búburú náà
  rationale: Àpólà Gíríìkì náà jẹ́ ẹyọ akọ, ó sì ń tọ́ka sí ọkùnrin tí a mẹ́nu kàn nínú ọ̀rọ̀ tó ṣáájú. ‘Ọkùnrin búburú náà’ pa ìtọ́kasí pàtó àti ìdájọ́ ìwà rẹ̀ mọ́.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: kúrò láàárín ara yín
  rationale: Èyí fi hàn pé kí wọ́n yọ ẹni náà kúrò nínú àwùjọ wọn fúnra wọn; ‘láàárín ara yín’ jẹ́ Yorùbá tí ó ṣe kedere fún ìtumọ̀ yìí.
theological_decisions:
- issue: Irú àṣẹ tí ẹsẹ̀ náà ń pa nípa ìbáwí nínú ìjọ
  choice: Àṣẹ náà ni pé kí ìjọ yọ ọkùnrin tó ṣẹ̀ náà kúrò nínú àwùjọ wọn, nígbà tí Ọlọ́run ni yóò ṣe ìdájọ́ àwọn tí ó wà lóde.
  alternative: A lè ka àṣẹ náà gẹ́gẹ́ bí àṣẹ gbogbogbò láti mú ibi kúrò nínú àwùjọ, láì sọ pé ó jẹ́ yíyọ ẹni kan kúrò nínú ìjọ ní ọ̀nà pàtó.
  rationale: Ní 1 Kọ́ríńtì 5, Pọ́ọ̀lù ń sọ̀rọ̀ nípa ọkùnrin kan pàtó àti ojúṣe ìjọ sí àwọn tí ó wà nínú rẹ̀, ní ìyàtọ̀ sí àwọn tí ó wà lóde. Síbẹ̀, ìtumọ̀ náà kò lo ọ̀rọ̀ ẹ̀kọ́ ìjọ tàbí ìlànà ìjọ tí kò sí nínú Gíríìkì.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì yàgò fún àwọn ọ̀rọ̀ ẹ̀ka ìjọ kan pàtó.
