id: 1CO.5.4
reference: 1 Corinthians 5:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: yo
  text: Ní orúkọ Olúwa wa Jésù,[a] nígbà tí ẹ bá péjọ, tí ẹ̀mí mi sì wà pẹ̀lú yín, pẹ̀lú agbára Olúwa wa Jésù,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ẹ bá ti péjọ, tí ẹ̀mí mi sì wà pẹ̀lú yín.” Èdè Gíríìkì lo ìṣètò genitive absolute tó ṣókí díẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: Ní orúkọ
  rationale: Ó pa àpẹẹrẹ ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá tí ó lè túmọ̀ sí ṣíṣe lábẹ́ àṣẹ Jésù.
- source_word: κυρίου
  choice: Olúwa
  rationale: Àkọ́lé Yorùbá tí ó wọ́pọ̀ fún κύριος ni, ó sì pa ìwọ̀n Kristológì ọ̀rọ̀ náà mọ́.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: Ìkọ̀wé orúkọ náà tẹ̀ lé àṣà Yorùbá tí ó fìdí múlẹ̀.
- source_word: συναχθέντων ὑμῶν
  choice: nígbà tí ẹ bá péjọ
  rationale: Ó sọ participle aorist passive inú genitive absolute di gbólóhùn àkókò tí ó ṣe kedere, tí ó sì jẹ́ Yorùbá àdánidá.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: tí ẹ̀mí mi sì wà pẹ̀lú yín
  rationale: Gíríìkì náà há díẹ̀; fífi ‘wà pẹ̀lú yín’ kún un mú ìtumọ̀ náà ṣe kedere láìṣe àlàyé ohun tí Pọ́ọ̀lù kò ṣàlàyé.
- source_word: σὺν
  choice: pẹ̀lú
  rationale: Ó fi ìbákẹ́gbẹ́ hàn ní ọ̀nà Yorùbá tí ó rọrùn.
- source_word: δυνάμει
  choice: agbára
  rationale: Ó tọ́ka sí agbára tí ń ṣiṣẹ́ nínú ìgbésẹ̀ ìbáwí náà, kì í ṣe àṣẹ lásán.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: Olúwa wa Jésù
  rationale: Ó pa genitive náà mọ́ lẹ́yìn ‘agbára,’ ó sì jẹ́ kí ìtumọ̀ orísun tàbí ohun-ìní dúró ní fífẹ̀ rẹ̀.
theological_decisions:
- issue: Irú bí Pọ́ọ̀lù ṣe wà ní àárín ìjọ náà
  choice: ‘ẹ̀mí mi sì wà pẹ̀lú yín’ fi hàn pé Pọ́ọ̀lù kópa pẹ̀lú wọn ní ọ̀nà tí kì í ṣe ti ara.
  alternative: Kí a tú ‘ẹ̀mí mi’ sí èrò tàbí ìfẹ́ Pọ́ọ̀lù nìkan, tàbí kí a sọ ó di ìwàníhìn-ín àràmàǹdà tó lágbára jù.
  rationale: Ẹsẹ̀ náà sọ pé ẹ̀mí Pọ́ọ̀lù wà pẹ̀lú wọn, ṣùgbọ́n kò ṣàlàyé ọ̀nà tàbí ìṣe rẹ̀; ìtumọ̀ náà pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìdáhùn sí i fún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa ìṣètò gbólóhùn náà mọ́ gẹ́gẹ́ bí apá kan ti gbolohun tó ń bá a lọ sí ẹsẹ̀ 5.
