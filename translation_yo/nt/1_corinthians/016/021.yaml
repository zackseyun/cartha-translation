lexical_decisions:
- source_word: Ὁ ἀσπασμός
  choice: ìkíni yìí
  rationale: Ó túmọ̀ sí ìkíni tí Pọ́ọ̀lù ń fi ránṣẹ́; ‘yìí’ jẹ́ kí itọ́ka náà ṣe kedere ní Yorùbá àdánidá.
- source_word: τῇ ἐμῇ χειρί
  choice: fi ọwọ́ ara mi kọ
  rationale: Lítírésọ̀ ni ‘nípasẹ̀ ọwọ́ tèmi’; fífi ‘kọ’ kún un mú ìtumọ̀ pé Pọ́ọ̀lù fúnra rẹ̀ kọ ọ́ ṣe kedere, bí ọ̀rọ̀ náà ṣe túmọ̀ sí nínú àyíká lẹ́tà.
- source_word: Παύλου
  choice: Èmi Pọ́ọ̀lù ni mo
  rationale: Orúkọ náà jẹ́ àmì pé Pọ́ọ̀lù fúnra rẹ̀ ni ó kọ ìkíni náà; ìṣètò yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ orísun mọ́.
