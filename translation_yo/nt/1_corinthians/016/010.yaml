id: 1CO.16.10
reference: 1 Corinthians 16:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: yo
  text: Bí Timotiu bá dé, ẹ rí i dájú pé ó lè wà láàárín yín láìbẹ̀rù, nítorí ó ń ṣe iṣẹ́ Olúwa, gẹ́gẹ́ bí èmi náà ti ń ṣe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν δὲ
  choice: Ṣùgbọ́n bí
  rationale: “Bí” túmọ̀ ìpèníjà ἐάν, “ṣùgbọ́n” sì pa ìyípadà ọ̀rọ̀ pẹ̀lẹ́ ti δέ mọ́ láìfi ìtakò líle kún un.
- source_word: ἔλθῃ Τιμόθεος
  choice: Timotiu bá dé
  rationale: Aorist subjunctive lẹ́yìn ἐάν tọ́ka sí ohun tí ó ṣeé ṣe ní ọjọ́ iwájú; “bá dé” jẹ́ ọ̀nà Yorùbá àdánidá fún ìpèníjà yìí.
- source_word: βλέπετε ἵνα
  choice: ẹ rí i dájú pé
  rationale: Ọ̀rọ̀ àṣẹ náà ń ké sí ìṣọ́ra àti ìgbésẹ̀ gidi; gbólóhùn yìí jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: ó lè wà láàárín yín láìbẹ̀rù
  rationale: Ìtumọ̀ yìí pa èrò ipò/wíwà Timotiu pẹ̀lú wọn mọ́, ó sì jẹ́ kí ἀφόβως túmọ̀ sí àìní ìbẹ̀rù láìdín in kù sí ìmọ̀lára ààbò nìkan.
- source_word: τὸ γὰρ ἔργον κυρίου ἐργάζεται
  choice: nítorí ó ń ṣe iṣẹ́ Olúwa
  rationale: “Ó ń ṣe” fi ìṣe tí ń lọ lọ́wọ́ hàn, “iṣẹ́ Olúwa” sì pa ìbáṣepọ̀ genitive náà mọ́ ní Yorùbá àdánidá.
- source_word: ὡς κἀγώ
  choice: gẹ́gẹ́ bí èmi náà ti ń ṣe
  rationale: κἀγώ túmọ̀ sí “èmi náà”; pípa ọ̀rọ̀-ìṣe náà dé ní kíkún jẹ́ kedere, ó sì fi iṣẹ́ Timotiu wé ti Paulu láìfi ìtumọ̀ míràn kún un.
theological_decisions:
- issue: Ẹni tí κυρίου (“Olúwa”) ń tọ́ka sí
  choice: A pa “Olúwa” mọ́ láìsọ ẹni náà ní kedere ju bí Gíríìkì ṣe sọ lọ.
  alternative: Kí a túmọ̀ rẹ̀ ní tààrà sí “Jésù Olúwa.”
  rationale: Nínú lílo Paulu, ó ṣeé ṣe gan-an pé Jésù ni ó ń tọ́ka sí, ṣùgbọ́n orísun sọ “Olúwa” nìkan; ìtumọ̀ náà kò gbọ́dọ̀ yanjú ohun tí a kò sọ ní kedere.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Ẹ” jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn; “láàárín yín” ṣe afihan wíwà Timotiu ní àwùjọ wọn.
