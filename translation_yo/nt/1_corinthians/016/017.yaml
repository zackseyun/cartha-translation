id: 1CO.16.17
reference: 1 Corinthians 16:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: yo
  text: Mo sì yọ̀ nípa dídé Sítéfánà, Fọ́túnátù àti Ákáíkù, nítorí àwọn wọ̀nyí ti pèsè ohun tí ó ṣàìkún láti ọ̀dọ̀ yín[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn wọ̀nyí ti dí àlàfo tí àìsí yín dá sílẹ̀.” Ó ṣeé ṣe kí Pọ́ọ̀lù ń tọ́ka sí bí àwọn ará Kọ́ríńtì kò ṣe lè wà pẹ̀lú rẹ̀ ní ti ara, kì í ṣe àbùkù ìwà rere wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: Mo sì yọ̀
  rationale: Ó pa ọ̀rọ̀ ẹni-àkọ́kọ́ àti ìtumọ̀ ayọ̀ Pọ́ọ̀lù mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: δὲ
  choice: sì
  rationale: Asopọ̀ pẹ̀lẹ́ ni δέ níbí, kì í ṣe ìtakora líle; “sì” bá ìṣàn ọ̀rọ̀ Yorùbá mu.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: nítorí dídé
  rationale: παρουσία ń tọ́ka sí dídé wọn àti wíwà wọn lọ́dọ̀ Pọ́ọ̀lù, kì í ṣe ìtumọ̀ nípa ìpadàbọ̀ Kristi.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: Sítéfánà, Fọ́túnátù àti Ákáíkù
  rationale: A ṣe àkọsílẹ̀ àwọn orúkọ Gíríìkì náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí Pọ́ọ̀lù fi yọ̀.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: ohun tí ó kù níhà ọ̀dọ̀ yín
  rationale: Èyí pa ààyè ìtumọ̀ ὑστέρημα mọ́ gẹ́gẹ́ bí ohun tí ó ṣáìkún láti ọ̀dọ̀ àwọn ará Kọ́ríńtì, láìdá a lójú nínú ọ̀rọ̀ pàtàkì pé àìsí wọn nìkan ni.
- source_word: οὗτοι
  choice: àwọn wọ̀nyí
  rationale: Ó pa ìtẹnumọ́ arọ́pò-orúkọ atọ́ka náà mọ́, ó sì tọ́ka kedere sí àwọn ọkùnrin mẹ́tẹ̀ẹ̀ta.
- source_word: ἀνεπλήρωσαν
  choice: ti pèsè
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí pípèsè tàbí mímú ohun tí ó kù kún; “ti pèsè” jẹ́ àdánidá, kò sì fi ìtumọ̀ míì kún un.
theological_decisions:
- issue: Bóyá ὑστέρημα túmọ̀ sí àìsí àwọn ará Kọ́ríńtì tàbí ohun mìíràn tí ó ṣáìkún láti ọ̀dọ̀ wọn
  choice: ohun tí ó kù níhà ọ̀dọ̀ yín
  alternative: àlàfo àìsí yín
  rationale: Ọ̀rọ̀ Gíríìkì gbòòrò ju “àìsí” lọ. Àkọsílẹ̀ pàtàkì náà pa àìdánilójú yìí mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ àyíká tí ó ṣeé ṣe hàn láìsọ ọ́ di dandan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A lo àmì ohùn níbi tí ó bá bá ìlò àdánidá mu, a sì pa ìṣàn lẹ́tà Pọ́ọ̀lù àti àìdánilójú ọ̀rọ̀ ὑστέρημα mọ́.
