  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐλεύσομαι δὲ πρὸς ὑμᾶς ὅταν Μακεδονίαν διέλθω, Μακεδονίαν γὰρ διέρχομαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/005.yaml
  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: yo
  text: Ṣùgbọ́n èmi yóò wá sọ́dọ̀ yín nígbà tí mo bá ti gba Makedóníà kọjá[a], nítorí mo ń gba Makedóníà kọjá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí mo bá gba Makedóníà kọjá.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè jẹ́ kí a sọ ọ́ ní ọ̀nà tó rọrùn báyìí, ṣùgbọ́n “bá ti gba … kọjá” túbọ̀ fi hàn pé Pọ́ọ̀lù yóò kọ́kọ́ gba Makedóníà kọjá kí ó tó wá sọ́dọ̀ wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: èmi yóò wá
  rationale: Ọ̀rọ̀ ọjọ́ iwájú náà fi èrò Pọ́ọ̀lù láti wá sọ́dọ̀ àwọn ará Kọ́ríńtì hàn; “wá” bá ìtọ́sọ́nà πρὸς ὑμᾶς mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó samisi ìyípadà díẹ̀ sí ètò ìrìn-àjò yìí láti inú ọ̀rọ̀ tó ṣáájú, láìfi àtakò líle hàn.
- source_word: πρὸς ὑμᾶς
  choice: sọ́dọ̀ yín
  rationale: πρός pẹ̀lú accusative lẹ́yìn ọ̀rọ̀-ìṣe ìṣípòpadà túmọ̀ sí lílọ sí ọ̀dọ̀ àwọn ènìyàn.
- source_word: ὅταν
  choice: nígbà tí
  rationale: Nínú ètò ìrìn-àjò ọjọ́ iwájú yìí, ó tọ́ka sí àkókò tí ìṣe náà yóò ṣẹlẹ̀.
- source_word: Μακεδονίαν
  choice: Makedóníà
  rationale: Àkọtọ̀ orúkọ agbègbè náà ní Yorùbá, pẹ̀lú àmì ohùn tó bá ìpè rẹ̀ mu.
- source_word: διέλθω
  choice: mo bá ti gba … kọjá
  rationale: Aorist subjunctive lẹ́yìn ὅταν jẹ́ kí ìṣe yìí ṣáájú wíwá Pọ́ọ̀lù; “bá ti” fi ìparí ṣáájú náà hàn, nígbà tí àpólà “gba … kọjá” jẹ́ Yorùbá àdánidá.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí Pọ́ọ̀lù fi pinnu àkókò ìbẹ̀wò rẹ̀ báyìí.
- source_word: διέρχομαι
  choice: mò ń gbà kọjá
  rationale: Ìṣe àsìkò ìsinsìnyí náà fi ọ̀nà ìrìn-àjò tó ń lọ tàbí tó ti pinnu hàn, ó sì yàtọ̀ sí ìṣe tí yóò ti parí nínú gbólóhùn àkọ́kọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “mò ń” dípò “mo ń” nítorí àmì ohùn àdánidá lórí arọ́pò-orúkọ ní àyíká yìí; “nítorí Makedóníà ni…” ń tẹnu mọ́ ọ̀nà tí Pọ́ọ̀lù yóò gbà.
