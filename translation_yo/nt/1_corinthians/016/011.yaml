  source_fidelity: Ìtumọ̀ náà ń pa ìfòfin μή τις οὖν, ète ἵνα, àti ìrètí tí ἐκδέχομαι ń sọ mọ́ dáadáa. Ṣùgbọ́n “tẹ́ńbẹ́lú” kì í ṣe ọ̀nà Standard Yorùbá tó dájú, tó sì wọ́pọ̀ láti túmọ̀ ἐξουθενέω; “kẹ́gàn” jẹ́ ìtumọ̀ tó péye, tó sì ṣe kedere. A tún tún ìkọ̀wé “rán án” ṣe pẹ̀lú àmì ohùn tó yẹ.
  naturalness: Pẹ̀lú “kẹ́gàn rẹ̀” àti “Ẹ sì rán án lọ,” gbolohun náà jẹ́ Yorùbá ìgbàlódé tó ní ìwọ̀ntúnwọ̀nsì, tó sì bá ìforígbárí Pọ́ọ̀lù mu. Àlàyé ìsàlẹ̀ náà ni a ṣàtúnṣe kí ó má ṣe sọ ní pàtó ohun tí ìbáṣepọ̀ “pẹ̀lú àwọn arákùnrin” nínú Gíríìkì kò fi dájú.
  terminology: “Àwọn arákùnrin” yẹ fún ἀδελφῶν nínú àkọlé pàtàkì, níwọ̀n bí ọ̀rọ̀ Gíríìkì ṣe jẹ́ akọ ọ̀pọ̀. Àlàyé ìsàlẹ̀ ń jẹ́ kí ìṣeéṣe ìtọ́kasí sí ẹgbẹ́ gbooro àwọn onígbàgbọ́ tàbí alábàáṣiṣẹ́ hàn láì fi ìtumọ̀ kan dì mú.
