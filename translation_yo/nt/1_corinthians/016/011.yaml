id: 1CO.16.11
reference: 1 Corinthians 16:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: yo
  text: Nítorí náà, kí ẹnikẹ́ni má ṣe kẹ́gàn rẹ̀. Ẹ sì rán án lọ ní àlàáfíà, kí ó lè wá sọ́dọ̀ mi, nítorí mo ń retí rẹ̀ pẹ̀lú àwọn arákùnrin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin,” bí “àwọn arákùnrin” bá ń tọ́ka sí ẹgbẹ́ gbooro àwọn onígbàgbọ́ tàbí alábàáṣiṣẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις οὖν
  choice: Nítorí náà, kí ẹnikẹ́ni má ṣe
  rationale: “Nítorí náà” ń pa ìsopọ̀ ìyọrísí οὖν mọ́; “kí ẹnikẹ́ni má ṣe” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfòfin òdì tí μή pẹ̀lú aorist subjunctive ń fi hàn.
- source_word: ἐξουθενήσῃ
  choice: tẹ́ńbẹ́lú rẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti ka ẹnìkan sí aláìníyelórí tàbí láti fojú tẹ́ńbẹ́lú rẹ̀; “tẹ́ńbẹ́lú” jẹ́ ọ̀rọ̀ Yorùbá tó lágbára, tó sì yé ni.
- source_word: προπέμψατε
  choice: ẹ ran an lọ
  rationale: Nínú ọ̀rọ̀ ìrìn-àjò, ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ rírán ẹni lọ síwájú pẹ̀lú ìrànlọ́wọ́ tó yẹ. “Ẹ ran an lọ” sọ èyí ní ṣókí àti ní èdè àdánidá.
- source_word: ἐν εἰρήνῃ
  choice: ní àlàáfíà
  rationale: Ìtumọ̀ yìí pa àwòrán gbolohun Gíríìkì mọ́, ó sì lè fi ìlọkúrò láìsí ìjà, ìdènà, tàbí ìkórìíra hàn.
- source_word: ἵνα ἔλθῃ πρός με
  choice: kí ó lè wá sọ́dọ̀ mi
  rationale: “Kí ó lè” ń fi ète tí ἵνα pẹ̀lú subjunctive ń sọ hàn; “sọ́dọ̀ mi” jẹ́ ọ̀nà Yorùbá tó bójú mu fún πρός με.
- source_word: ἐκδέχομαι
  choice: mo ń retí rẹ̀
  rationale: Àmì ìṣe tó ń lọ lọ́wọ́ nínú ọ̀rọ̀ Gíríìkì ni “ń retí” mú jáde lọ́nà àdánidá.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: pẹ̀lú àwọn arákùnrin
  rationale: ἀδελφῶν jẹ́ ọ̀pọ̀ akọ ní gírámà. Àkọlé pàtàkì pa “àwọn arákùnrin” mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ tó lè kan gbogbo àwọn onígbàgbọ́ tàbí alábàáṣiṣẹ́ hàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀδελφῶν níbi tí ó ti lè tọ́ka sí àwùjọ Kristẹni tó ní ọkùnrin àti obìnrin
  choice: àwọn arákùnrin
  alternative: àwọn arákùnrin àti arábìnrin
  rationale: Nítorí ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ọ̀pọ̀, àkọlé pàtàkì kò sọ ìtumọ̀ rẹ̀ di àwùjọ adalu láìsí ìdánilójú. Síbẹ̀, àlàyé ìsàlẹ̀ pa ìṣeéṣe pé ó ń tọ́ka sí ẹgbẹ́ àwọn onígbàgbọ́ tàbí alábàáṣiṣẹ́ adalu mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún ọ̀pọ̀ ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá, a sì pa ìtumọ̀ ìfòfin, ète, àti ìrètí ọ̀rọ̀ Gíríìkì mọ́.
