  to: Nítorí náà, kí ẹnikẹ́ni má ṣe kẹ́gàn rẹ̀. Ẹ sì rán án lọ ní àlàáfíà, kí ó lè wá sọ́dọ̀ mi, nítorí mo ń retí rẹ̀ pẹ̀lú àwọn arákùnrin.[a]
  rationale: A rọ́pò ọ̀rọ̀ tí kò dájú “tẹ́ńbẹ́lú” pẹ̀lú “kẹ́gàn,” èyí tó bá ìtumọ̀ ἐξουθενέω mu. A ṣàtúnṣe àmì ohùn nínú “rán án,” a sì mú àlàyé ìsàlẹ̀ kúrò nínú ìdánilójú nípa ipa àwọn arákùnrin tí Gíríìkì kò sọ ní kedere.
