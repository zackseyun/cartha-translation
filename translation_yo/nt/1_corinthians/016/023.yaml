id: 1CO.16.23
reference: 1 Corinthians 16:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/023.yaml
  text: The grace of the Lord Jesus be with you.
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ Olúwa Jésù wà pẹ̀lú yín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ èdè ìjọsìn tí ó ti fìdí múlẹ̀ fún oore àti ojúrere tí a kò tọ́ sí, ó sì bá ìbùkún Paulu mu.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” jẹ́ àkọ́lé Yorùbá tó bójú mu fún κύριος, ó sì pa agbára Krístì àti ìlò rẹ̀ gẹ́gẹ́ bí àkọ́lé mọ́.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: A ṣe orúkọ ẹni náà ní ìrísí Yorùbá tí ó wọ́pọ̀, kì í ṣe pé a túmọ̀ ìtumọ̀ orúkọ náà.
- source_word: μεθ’ ὑμῶν
  choice: wà pẹ̀lú yín
  rationale: Gíríìkì jẹ́ “pẹ̀lú yín” láìsí ọ̀rọ̀-ìṣe; fífi “wà” kún un mú kí ìbùkún náà jẹ́ èdè Yorùbá àdánidá láìfi ìtumọ̀ míì kún un.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Olúwa Jésù
  rationale: Ìṣọ̀kan orúkọ náà nínú “oore-ọ̀fẹ́ Olúwa Jésù” pa ìbáṣepọ̀ genitive Gíríìkì mọ́, tí ó lè tọ́ka sí ohun tí ó jẹ́ tirẹ̀ tàbí ohun tí ó ti ọ̀dọ̀ rẹ̀ wá.
theological_decisions:
- issue: Àdúrà ìbùkún tí kò ní ọ̀rọ̀-ìṣe ní Gíríìkì
  choice: A lo “Kí ... wà” láti fi agbára àdúrà ìbùkún hàn.
  alternative: “Oore-ọ̀fẹ́ Olúwa Jésù pẹ̀lú yín.”
  rationale: “Kí ... wà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfẹ́ tàbí ìbùkún tí Gíríìkì fi sílẹ̀ láìsọ ọ̀rọ̀-ìṣe, láìyí ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ padà.
- issue: Ìtumọ̀ genitive nínú τοῦ κυρίου Ἰησοῦ
  choice: “oore-ọ̀fẹ́ Olúwa Jésù”
  alternative: “oore-ọ̀fẹ́ láti ọ̀dọ̀ Olúwa Jésù”
  rationale: Àyànfẹ́ náà pa àìdánilójú tó bófin mu mọ́ láàárín ohun tí ó jẹ́ ti Olúwa Jésù àti oore-ọ̀fẹ́ tí ó ti ọ̀dọ̀ rẹ̀ wá; kò fi ipa mú un di ìtumọ̀ orísun nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, kúkúrú, ọlọ́lá, àti àdánidá fún ìbùkún ìparí lẹ́tà. A lo àmì ohùn ní kíkún níbi tó yẹ; “yín” fi ọ̀pọ̀ ènìyàn tí ὑμῶν ń tọ́ka sí hàn.
