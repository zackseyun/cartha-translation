id: 1CO.16.18
reference: 1 Corinthians 16:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνέπαυσαν γὰρ τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν. ἐπιγινώσκετε οὖν τοὺς τοιούτους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: yo
  text: Nítorí wọ́n ti mú kí ẹ̀mí mi àti ti yín tù. Nítorí náà, ẹ mọyì irú àwọn ọkùnrin bẹ́ẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ẹ mọ irú àwọn ènìyàn bẹ́ẹ̀’ tàbí ‘ẹ mọrírì irú àwọn ènìyàn bẹ́ẹ̀.’ Ìrísí ọ̀rọ̀ náà nínú èdè Gíríìkì jẹ́ ti akọ, ó sì ń tọ́ka ní pàtó sí àwọn ọkùnrin tí a ṣẹ̀ṣẹ̀ dárúkọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: wọ́n ti mú ... tù
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìtura àti ìmúdọ̀tun inú, kì í ṣe sí sísùn tàbí ìsinmi ara. ‘Mú ... tù’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n fún ẹ̀mí ẹni ní ìtura.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi ìdí tí Pọ́ọ̀lù fi sọ ọ̀rọ̀ ìṣáájú hàn, ó sì pa ìsopọ̀ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: πνεῦμα
  choice: ẹ̀mí
  rationale: Níhìn-ín, ó ń tọ́ka sí inú ẹni tàbí ipò ọkàn rẹ̀, kì í ṣe sí Ẹ̀mí Mímọ́. ‘Ẹ̀mí’ pa àwòrán àti ọ̀nà ọ̀rọ̀ Pọ́ọ̀lù mọ́.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: ẹ̀mí mi àti ti yín
  rationale: ‘Ti yín’ fi ọ̀rọ̀ ‘ẹ̀mí’ tí a kò tún sọ nínú Gíríìkì hàn lọ́nà Yorùbá tó ṣe kedere, tó sì ṣókí.
- source_word: ἐπιγινώσκετε
  choice: ẹ mọyì
  rationale: Àṣẹ náà ju dídá ẹni mọ̀ lásán lọ; ó ń pè wọ́n láti mọ iye àwọn ọkùnrin náà, kí wọ́n sì fún wọn ní ìfọwọ́sí tó yẹ. ‘Mọyì’ sọ èyí ní Yorùbá àdánidá láì gbé e ga dé àṣẹ láti bọ̀wọ̀ fún wọn ní ọ̀nà àkànṣe.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìparí tàbí ìmúṣẹ tí ó jáde láti inú gbólóhùn tó ṣáájú hàn.
- source_word: τοὺς τοιούτους
  choice: irú àwọn ọkùnrin bẹ́ẹ̀
  rationale: Ó ń tọ́ka padà sí Sítéfánà, Fọ́túnátù àti Akaíkù, tí gbogbo wọn jẹ́ ọkùnrin; yíyan ‘àwọn ọkùnrin’ pa ìtọ́kasí akọ tó wà nínú àyíká ọ̀rọ̀ mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ akọ nínú τοὺς τοιούτους
  choice: irú àwọn ọkùnrin bẹ́ẹ̀
  alternative: irú àwọn ènìyàn bẹ́ẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé gbólóhùn náà lè ní ìtumọ̀ gbogbogbò ní ibòmíràn, níhìn-ín ó ń tọ́ka sí àwọn alábàáṣiṣẹ́ ọkùnrin mẹ́ta tí a ṣẹ̀ṣẹ̀ dárúkọ. Ìtumọ̀ náà kò sọ ìtọ́kasí akọ yìí di aláìní akọ tàbí abo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, tó rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘ẹ̀mí’ láti pa àwòrán Pọ́ọ̀lù mọ́, a sì lo ‘mú ... tù’ àti ‘mọyì’ fún ìtumọ̀ àdánidá láì sọ ohun tí Gíríìkì kò sọ.
