  to: Ó sì ṣeé ṣe kí n dúró lọ́dọ̀ yín, tàbí kí n tilẹ̀ lo ìgbà òtútù pẹ̀lú yín, kí ẹ̀yin lè rán mi lọ síwájú sí ibikíbi tí mo bá ń lọ.[a]
