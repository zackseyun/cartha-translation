source:
  edition: SBLGNT
  text: πρὸς ὑμᾶς δὲ τυχὸν ⸀παραμενῶ ἢ ⸀καὶ παραχειμάσω, ἵνα ὑμεῖς με προπέμψητε οὗ ἐὰν πορεύωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/006.yaml
  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: yo
  text: Ó sì ṣeé ṣe kí n dúró lọ́dọ̀ yín, tàbí kí n tilẹ̀ lo ìgbà òtútù pẹ̀lú yín, kí ẹ̀yin lè rán mi lọ síwájú sí ibikíbi tí mo bá ń lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ràn mí lọ́wọ́ nínú ìrìn-àjò mi.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ sísọ arìnrìn-àjò di ọ̀nà nígbà tí ó ń lọ tàbí pípèsè ohun tí yóò nílò fún ìrìn-àjò rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: lọ́dọ̀ yín / pẹ̀lú yín
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe tí ó túmọ̀ sí dídúró, πρός + accusative tọ́ka sí wíwà ní àárín àwọn ènìyàn náà; ‘lọ́dọ̀ yín’ jẹ́ ọ̀nà Yorùbá àdánidá fún ibùgbé, ‘pẹ̀lú yín’ sì bá lílo gbogbo ìgbà òtútù mu.
- source_word: δὲ
  choice: sì
  rationale: Ó jẹ́ àsopọ̀ onírẹ̀lẹ̀ tí ń tẹ̀ síwájú nínú ètò ìrìn-àjò Pọ́ọ̀lù, kì í ṣe ìtakò líle.
- source_word: τυχὸν
  choice: Ó ṣeé ṣe kí
  rationale: Ó pa ìtumọ̀ àìdájú tàbí ohun tí ó lè ṣẹlẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: παραμενῶ
  choice: n dúró
  rationale: Ọ̀rọ̀ náà túmọ̀ sí láti dúró síbẹ̀ tàbí máa bá a lọ níbẹ̀; ‘dúró’ bá ọ̀rọ̀ ìrìn-àjò mu.
- source_word: ἢ καὶ
  choice: tàbí kí n tilẹ̀
  rationale: ‘Tilẹ̀’ fi ìtẹnumọ́ hàn pé àṣàyàn kejì gùn ju dídúró fún ìgbà díẹ̀ lọ.
- source_word: παραχειμάσω
  choice: lo ìgbà òtútù pẹ̀lú yín
  rationale: Ó sọ ní pàtó pé kí ènìyàn dúró ní ibì kan jálẹ̀ àsìkò òtútù.
- source_word: ἵνα
  choice: kí
  rationale: ‘Kí’ ṣàfihàn ète nínú gbólóhùn Yorùbá lọ́nà àdánidá.
- source_word: προπέμψητε
  choice: rán mi lọ
  rationale: Nínú ọ̀rọ̀ ìrìn-àjò, ọ̀rọ̀ náà lè túmọ̀ sí sísìn arìnrìn-àjò lọ síwájú, títẹ̀lé e díẹ̀, tàbí pípèsè ohun tí yóò nílò; ‘rán mi lọ’ pa ìtumọ̀ gbígbòòrò náà mọ́, a sì ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: οὗ ἐὰν πορεύωμαι
  choice: sí ibikíbi tí mo bá ń lọ
  rationale: ‘Ibikíbi’ àti ‘bá’ pa àìdájú ibi tí yóò lọ mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ìsinsìnyí tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. ‘Ìgbà òtútù’ jẹ́ ìtumọ̀ àdánidá fún àsìkò winter ní àyíká Mẹditarenia; a yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tàbí ìtumọ̀ ẹlẹ́gbẹ́ kan.
