  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: yo
  text: Bí ẹnikẹ́ni kò bá nífẹ̀ẹ́ Olúwa, kí ó wà lábẹ́ ègún[a]. Marana tha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “anatema,” ìyẹn ẹni tí ó wà lábẹ́ ègún.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Árámáíkì. Ó ṣeé ṣe kí ó túmọ̀ sí “Olúwa wa, wá!” tàbí “Olúwa wa ti dé.”
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: nífẹ̀ẹ́
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìfẹ́ àti ìfẹ́ni ti ara ẹni sí Olúwa. “Nífẹ̀ẹ́” jẹ́ ọ̀nà àdánidá, tí ó sì ṣe kedere ní Yorùbá láì fi ìtumọ̀ tóóró kan lé ọ̀rọ̀ náà lórí.
- source_word: κύριον
  choice: Olúwa
  rationale: Ní àyíká ọ̀rọ̀ Paulu yìí, orúkọ oyè náà ń tọ́ka sí Jésù. “Olúwa” pa ìwúwo Kristi àti ìlò tó ti fìdí múlẹ̀ nínú Májẹ̀mú Tuntun mọ́.
- source_word: ἤτω
  choice: kí ó jẹ́
  rationale: Àṣẹ ọ̀rọ̀-ìṣe εἰμί níbí ní agbára ìfẹ́ tàbí ìdájọ́ pé kí ohun náà rí bẹ́ẹ̀. “Kí ó jẹ́” mú agbára yẹn jáde ní Yorùbá tó ṣe kedere.
- source_word: ἀνάθεμα
  choice: ẹni ègún
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí a yà sílẹ̀ fún ìparun tàbí ẹni tí ó wà lábẹ́ ègún. “Ẹni ègún” pa ìrísí ọ̀rọ̀-orúkọ àti agbára ìdájọ́ gbólóhùn Gíríìkì mọ́; àlàyé ìtumọ̀ míì wà ní àkọ́silẹ̀.
- source_word: Μαράνα θά
  choice: Máránà thá
  rationale: Èyí jẹ́ gbólóhùn Árámáíkì tí a kọ ní lẹ́tà Gíríìkì. Títọ ohùn rẹ̀ jáde dípò títúmọ̀ rẹ̀ nínú ọ̀rọ̀ pàtàkì pa àìdánilójú nípa bí a ṣe lè pín un àti ìtumọ̀ rẹ̀ mọ́.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn Árámáíkì Μαράνα θά
  choice: 'A pa á mọ́ gẹ́gẹ́ bí ìkọ-ohùn nínú ọ̀rọ̀ pàtàkì: “Máránà thá.”'
  alternative: “Olúwa wa, wá!” tàbí “Olúwa wa ti dé.”
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà dúró ṣinṣin nínú ẹ̀rí àfọwọ́kọ, bí a ṣe pín àwọn ọ̀rọ̀ Árámáíkì náà àti ìtumọ̀ wọn ṣì jẹ́ ohun tí a ń jiyàn lé lórí. Ìkọ-ohùn kò yanjú àìdánilójú náà ní ìkọ̀kọ̀, àkọ́silẹ̀ sì fi àwọn ìtumọ̀ pàtàkì hàn.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀ àti ọ̀rọ̀ ṣókí ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ Yorùbá ní kíkún níbi tí ó bá bá àṣà mu. Àwọn àmì àkọ́silẹ̀ [a] àti [b] wà lẹ́yìn àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé, láì tẹ̀ lé àṣìṣe ìbámu àmì inú ẹ̀dà ìmọ̀ràn Gẹ̀ẹ́sì.
