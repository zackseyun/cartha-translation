  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: θύρα γάρ μοι ἀνέῳγεν μεγάλη καὶ ἐνεργής, καὶ ἀντικείμενοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: yo
  text: Nítorí ilẹ̀kùn ńlá kan tí ó sì gbéṣẹ́ ti ṣí sílẹ̀ fún mi[a], ọ̀pọ̀ sì ni àwọn alátakò.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àǹfààní ńlá kan tí ó sì gbéṣẹ́ ti ṣí sílẹ̀ fún mi.’ Pọ́ọ̀lù lo ‘ilẹ̀kùn’ gẹ́gẹ́ bí àkàwé fún ọ̀nà tí ó ṣí sílẹ̀ fún iṣẹ́ ìránṣẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: ilẹ̀kùn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘ilẹ̀kùn’ ní tààrà, Pọ́ọ̀lù sì lò ó gẹ́gẹ́ bí àkàwé fún àǹfààní iṣẹ́ ìránṣẹ́; pípa àwòrán náà mọ́ sun mọ́ orísun.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó fi ìdí ètò ìrìn-àjò Pọ́ọ̀lù tí ó wà ní àyíká ẹsẹ yìí hàn.
- source_word: μοι
  choice: fún mi
  rationale: Dátífù náà lè tọ́ka sí ẹni tí ìṣí sílẹ̀ náà jẹ́ fún; ‘fún mi’ jẹ́ èdè Yorùbá àdánidá ní ọ̀rọ̀ yìí.
- source_word: ἀνέῳγεν
  choice: ti ṣí sílẹ̀
  rationale: Ìṣe pípé náà ń tọ́ka sí ohun tí a ti ṣí, tí ó sì ṣì wà ní ṣíṣí; gbolohun yìí pa ipò àbájáde náà mọ́ láì sọ ẹni tí ó ṣí i.
- source_word: μεγάλη
  choice: ńlá
  rationale: Ó ń ṣàpèjúwe bí ilẹ̀kùn náà ti ṣe pàtàkì tàbí bí àǹfààní náà ti pọ̀ tó, nígbà tí ó tún pa àkàwé mọ́.
- source_word: ἐνεργής
  choice: tí ó sì mú iṣẹ́ ṣẹ
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ohun tí ń ṣiṣẹ́ lọ́nà eléso tàbí tí ó munadoko; gbólóhùn yìí jẹ́ kedere ní Yorùbá, ó sì bá àkàwé ilẹ̀kùn mu.
- source_word: ἀντικείμενοι
  choice: àwọn alátakò
  rationale: Partisípù náà dúró gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn tí wọ́n ń tako Pọ́ọ̀lù àti iṣẹ́ rẹ̀.
- source_word: πολλοί
  choice: ọ̀pọ̀
  rationale: Ó túmọ̀ sí pé àwọn alátakò náà pọ̀ ní iye.
theological_decisions:
- issue: Àkàwé ‘ilẹ̀kùn’ fún àǹfààní iṣẹ́ ìránṣẹ́
  choice: Pa ọ̀rọ̀ àkàwé ‘ilẹ̀kùn’ mọ́ nínú ẹsẹ náà.
  alternative: ‘Àǹfààní ńlá kan tí ó sì munadoko ti ṣí sílẹ̀ fún mi.’
  rationale: Orísun Gíríìkì lo àkàwé tí Pọ́ọ̀lù sábà máa ń lò. Pípa rẹ̀ mọ́ kò túmọ̀ rẹ̀ kọjá ohun tí orísun sọ, ó sì jẹ́ kí àlàyé ẹsẹ̀ ìsàlẹ̀ ṣàfihàn ìtumọ̀ iṣẹ́ ìránṣẹ́ rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye ni a lò. A pa àkàwé orísun mọ́, a sì lo ‘mú iṣẹ́ ṣẹ’ láti sọ agbára ἐνεργής ní èdè àdánidá láì sọ pé iṣẹ́ náà ti ní àṣeyọrí pátápátá.
