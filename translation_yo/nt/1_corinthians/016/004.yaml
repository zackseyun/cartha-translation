id: 1CO.16.4
reference: 1 Corinthians 16:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ ⸂ἄξιον ᾖ⸃ τοῦ κἀμὲ πορεύεσθαι, σὺν ἐμοὶ πορεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/004.yaml
  text: And if it is worthwhile for me to go also, they will go with me.
translation:
  language: yo
  text: Bí ó bá sì yẹ kí èmi náà lọ[a], wọn yóò bá mi lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó bá sì wúlò kí èmi náà lọ.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun tó yẹ, tó bá ipò mu, tàbí tó wúlò lábẹ́ àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Bí ó bá sì
  rationale: Àkójọpọ̀ yìí fi ipò àídájú hàn, ó sì so ẹsẹ̀ náà mọ́ ọ̀rọ̀ tó ṣáájú láìfi ìtakora líle kún un.
- source_word: ἄξιον ᾖ
  choice: ó yẹ
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ gbólóhùn aláìlẹ́ni-pàtó tó ń tọ́ka sí ohun tó bá ipò mu tàbí tó yẹ, kì í ṣe sí ìyì tàbí ìwà rere Pọ́ọ̀lù fúnra rẹ̀.
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: kí èmi náà lọ
  rationale: Èyí sọ ìṣe tí a ń wò bóyá ó yẹ di mímọ̀, ó sì pa agbára àfikún κἀμέ mọ́ nínú ‘èmi náà.’
- source_word: σὺν ἐμοὶ
  choice: bá mi
  rationale: Ìlò ‘bá mi lọ’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé àwọn ènìyàn náà yóò rin ìrìn àjò pọ̀ mọ́ Pọ́ọ̀lù.
- source_word: πορεύσονται
  choice: wọn yóò ... lọ
  rationale: Ó pa ìtumọ̀ ọjọ́ iwájú àti àtúnsọ ọ̀rọ̀-ìṣe ‘lọ’ mọ́, láìfi ìtumọ̀ tó lágbára ju ti Gíríìkì lọ kún un.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ àídájú Pọ́ọ̀lù nípa lílọ pẹ̀lú àwọn aṣojú
  choice: Pọ́ọ̀lù sọ pé bí ó bá yẹ kí òun náà lọ, àwọn aṣojú náà yóò bá a lọ.
  alternative: Ẹ̀bùn náà tóbi tó bẹ́ẹ̀ tí ó fi yẹ kí Pọ́ọ̀lù lọ; tàbí Pọ́ọ̀lù fúnra rẹ̀ yẹ ní ti ìwà láti lọ.
  rationale: ἄξιον jẹ́ aláìlẹ́ni-pàtó níbí, gbólóhùn infinitive náà sì ń ṣàlàyé ìṣe tí a ń wò bóyá ó yẹ. Àyíká ọ̀rọ̀ náà dá lórí ètò gbígbé ọrẹ lọ, kì í ṣe ìyì tàbí ìwà Pọ́ọ̀lù.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì rọrùn fún òǹkàwé lasán. A lo ‘ó yẹ’ gẹ́gẹ́ bí ìtumọ̀ àkọ́kọ́ nítorí pé ó dá ìbámu pẹ̀lú ipò hàn dáadáa; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ ‘ó wúlò’ mọ́.
