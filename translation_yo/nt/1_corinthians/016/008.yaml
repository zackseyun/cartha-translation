translation:
  language: yo
  text: Ṣùgbọ́n èmi yóò dúró ní Éfésù títí di Pẹntikosti[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Èmi yóò dúró ní Éfésù títí di Àjọ̀dún Àwọn Ọ̀sẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιμενῶ
  choice: èmi yóò dúró
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà, nínú àyíká ètò ìrìn-àjò, túmọ̀ sí pé Pọ́ọ̀lù yóò máa wà ní ibi kan fún àkókò kan. “Èmi yóò dúró” jẹ́ èdè Yorùbá àdánidá, ó sì fi àfojúsùn ẹni tí yóò dúró hàn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń fi ìyàtọ̀ díẹ̀ tàbí ìyípadà kúrò nínú ọ̀rọ̀ ètò ìrìn-àjò tó ṣáájú hàn; “Ṣùgbọ́n” dá ìtumọ̀ ìyàtọ̀ náà sí.
- source_word: ἐν Ἐφέσῳ
  choice: ní Éfésù
  rationale: ἐν pẹ̀lú dative jẹ́ àmì ibi níhìn-ín; “ní Éfésù” ni ọ̀nà Yorùbá tó ṣe déédéé fún ìtumọ̀ yìí.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: títí di Pẹ́ńtíkọ́stì
  rationale: ἕως pẹ̀lú genitive ń tọ́ka sí bí àkókò ṣe gùn dé ibi kan. “Pẹ́ńtíkọ́stì” ni orúkọ tí a mọ̀ sí ajọdún náà nínú Májẹ̀mú Tuntun.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó lọ́wọ́lọ́wọ́, tó ní iyì, tí ó sì rọrùn fún òǹkàwé lásán. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá, a sì ṣe àfihàn orúkọ ibi àti ajọdún gẹ́gẹ́ bí wọ́n ṣe wọ́pọ̀ nínú Yorùbá Kristẹni.
