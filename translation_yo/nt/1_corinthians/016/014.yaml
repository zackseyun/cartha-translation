translation:
  language: yo
  text: Kí ẹ máa ṣe ohun gbogbo nínú ìfẹ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó tẹ̀ lé ọ̀rọ̀ Gíríìkì náà ní pẹkipẹki, “Kí gbogbo ohun tí ó jẹ́ ti yín máa wáyé nínú ìfẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́mìí ní ọ̀pọ̀, ó sì ní ìtumọ̀ tó gba gbogbo nǹkan; ‘ohun gbogbo’ jẹ́ ọ̀nà àdánidá láti pa ìwọ̀n gbogbo rẹ̀ mọ́ ní Yorùbá.
- source_word: ὑμῶν
  choice: tí ẹ ń ṣe
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníwà-gírámà genitive yìí bá πάντα ṣe gbólóhùn tí a ti fi ìṣe kan sílẹ̀ láìsọ. ‘Tí ẹ ń ṣe’ mú ohun tí ó túmọ̀ sí ní àyíká ọ̀rọ̀ náà hàn ní Yorùbá láìfi èrò tuntun kún un.
- source_word: ἐν ἀγάπῃ
  choice: nínú ìfẹ́
  rationale: ‘Ìfẹ́’ ni ìtumọ̀ àkọ́kọ́ fún ἀγάπη. ‘Nínú ìfẹ́’ pa àwòrán preposition ἐν mọ́, ó sì lè tọ́ka sí ọ̀nà tàbí ipò inú èyí tí a ti ṣe gbogbo nǹkan.
- source_word: γινέσθω
  choice: kí ẹ máa ṣe
  rationale: Èyí jẹ́ àṣẹ ẹni-kẹta tí ó ń pe fún ìṣe tó ń bá a lọ. A tún ìṣètò gbólóhùn náà ṣe sí ọ̀nà àdánidá ní Yorùbá, nígbà tí ‘kí’ àti ‘máa’ pa agbára ìkìlọ̀ àti ìtẹ̀síwájú ìṣe náà mọ́.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé òde òní. Gbólóhùn pàtàkì náà jẹ́ àdánidá ní Yorùbá; àlàyé ìsàlẹ̀ ojú ìwé sì pa ìṣètò Gíríìkì tó jẹ́ gẹ́gẹ́ bí ‘gbogbo ohun ti yín’ mọ́.
