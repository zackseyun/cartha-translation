source:
  edition: SBLGNT
  text: ἡ ἀγάπη μου μετὰ πάντων ὑμῶν ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: yo
  text: Kí ìfẹ́ mi wà pẹ̀lú gbogbo yín nínú Mèsáyà Jésù[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Kristi Jésù.” Ọ̀rọ̀ Gíríìkì náà, Χριστός, lè túmọ̀ sí “Mèsáyà,” tàbí “Kristi” nínú ìlò ìbílẹ̀.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: Ọ̀rọ̀ Yorùbá yìí sọ ìfẹ́ onífẹ̀ẹ́, tí ń fi ara rẹ̀ fún ẹlòmíràn, ní ọ̀nà tó ṣe kedere tí ó sì bá èdè òde òní mu.
- source_word: μου
  choice: mi
  rationale: Ó pa ìtumọ̀ arọ́pò-orúkọ oní ohun mọ́, ó sì fi hàn pé Pọ́ọ̀lù ń sọ nípa ìfẹ́ tirẹ̀ sí àwọn olùgbọ́.
- source_word: μετὰ
  choice: wà pẹ̀lú
  rationale: Gíríìkì kò ní ọ̀rọ̀-ìṣe níhìn-ín; ‘wà pẹ̀lú’ jẹ́ ọ̀nà àdánidá láti sọ ìfẹ́ ìbùkún tí a fi ọ̀rọ̀-ìṣe sí nínú Yorùbá.
- source_word: πάντων ὑμῶν
  choice: gbogbo yín
  rationale: Ó pa ìtẹnumọ́ pé kò sí ẹnikẹ́ni nínú àwọn ará Kọ́ríńtì tí a yọ sílẹ̀ mọ́.
- source_word: ἐν
  choice: nínú
  rationale: Ó pa àwòrán Pọ́ọ̀lù ti wíwà ‘nínú’ Mèsáyà mọ́ láì sọ ìtumọ̀ rẹ̀ di pàtó ju orísun lọ.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mèsáyà Jesu
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni àmì òróró; ‘Mèsáyà’ pa iṣẹ́ rẹ̀ gẹ́gẹ́ bí oyè mọ́, nígbà tí ‘Jesu’ jẹ́ orúkọ tí a kọ sí Yorùbá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστός nínú gbólóhùn ἐν Χριστῷ Ἰησοῦ
  choice: Mèsáyà Jesu
  alternative: Kristi Jesu
  rationale: ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn gbangba, dípò kí a ṣe bí ẹni pé Χριστός jẹ́ apá kan orúkọ lásán; àkọsílẹ̀ ìsàlẹ̀ sì tọ́ka sí ọ̀nà ìbílẹ̀ ‘Kristi Jesu.’
- issue: Fífi ọ̀rọ̀-ìṣe kún gbólóhùn ìbùkún tí kò ní ọ̀rọ̀-ìṣe ní Gíríìkì
  choice: Kí … wà
  alternative: Ìfẹ́ mi wà pẹ̀lú gbogbo yín
  rationale: ‘Kí … wà’ mú ìrísí àdúrà tàbí ìfẹ́ ìbùkún inú ọ̀rọ̀ ìparí lẹ́tà hàn, láì sọ pé Gíríìkì ní ọ̀rọ̀-ìṣe tàbí àsìkò kan pàtó.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó ní ọlá, tó rọrùn fún òǹkàwé òde òní. A lo ‘kí’ láti fi ohùn ìbùkún ìparí lẹ́tà hàn, a sì fi àmì ohùn sí ibi tí ó yẹ.
