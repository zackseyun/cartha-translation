- from: 'Ǹjẹ́ mo rọ̀ yín[a], ẹ̀yin ará: ẹ mọ agbo ilé Sítéfánà, pé àwọn ni àkọ́so ti Ákáíà[b], wọ́n sì ti fi ara wọn fún iṣẹ́ ìránṣẹ́ sí àwọn ènìyàn mímọ́.'
  to: 'Mo sì rọ̀ yín[a], ẹ̀yin ará: ẹ mọ̀ àwọn ara ilé Sítéfánà, pé àwọn ni èso àkọ́kọ́ ilẹ̀ Akáyà[b], wọ́n sì ti fi ara wọn fún iṣẹ́ ìránṣẹ́ fún àwọn ènìyàn mímọ́.'
  rationale: The revision preserves every major semantic element of the Greek while using more idiomatic Standard Yoruba. It retains the metaphor of ἀπαρχή, the collective reference to Stephanas’s household, and the sense that they voluntarily committed themselves to service benefiting the saints. Footnote anchors and their lexical purposes are preserved.
