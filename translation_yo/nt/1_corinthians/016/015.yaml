id: 1CO.16.15
reference: 1 Corinthians 16:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: yo
  text: 'Mo sì rọ̀ yín[a], ẹ̀yin ará: ẹ mọ̀ àwọn ara ilé Sítéfánà, pé àwọn ni èso àkọ́kọ́ ilẹ̀ Akáyà[b], wọ́n sì ti fi ara wọn fún iṣẹ́ ìránṣẹ́ fún àwọn ènìyàn mímọ́.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “ẹ̀yin arákùnrin,” ṣùgbọ́n ó jẹ́ ọ̀nà ìpè tí ó lè kan gbogbo ìjọ, àwọn ọkùnrin àti obìnrin.
    reason: lexical_alternative
  - marker: b
    text: “Èso àkọ́kọ́” lè túmọ̀ sí pé wọ́n wà lára àwọn onígbàgbọ́ àkọ́kọ́ ní ilẹ̀ Akáyà; ó tún pa àwòrán ìpín àkọ́kọ́ tí a yà sọ́tọ̀ fún Ọlọ́run mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: mo rọ̀ yín
  rationale: Ó fi ẹ̀bẹ̀ onítẹnumọ́ hàn ní Yorùbá àdánidá, láì sọ ọ́ di àṣẹ líle.
- source_word: δὲ
  choice: Ǹjẹ́
  rationale: Ó ń samisi ìyípadà díẹ̀ nínú ọ̀rọ̀; kì í ṣe àsopọ̀ alatakò líle.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀nà ìpèjọ tí ó wọ́pọ̀, tó sì lè tọ́ka sí gbogbo ìjọ láìparẹ́ ànímọ́ ọ̀rọ̀ Gíríìkì.
- source_word: οἰκίαν Στεφανᾶ
  choice: agbo ilé Sítéfánà
  rationale: Ó ń tọ́ka sí gbogbo àwọn tó jẹ́ ti ilé rẹ̀, kì í ṣe ilé gẹ́gẹ́ bí ilé gbígbé nìkan.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: àkọ́so ti Ákáíà
  rationale: Ó pa àwòrán èso àkọ́kọ́ mọ́, pẹ̀lú ìtumọ̀ pé wọ́n wà lára àwọn onígbàgbọ́ àkọ́kọ́ ní agbègbè náà.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: fún iṣẹ́ ìránṣẹ́ sí àwọn ènìyàn mímọ́
  rationale: Ó fi iṣẹ́ tí ó ṣe àwọn onígbàgbọ́ láǹfààní hàn láìfi ipò ìjọ kan pàtó kún un.
- source_word: ἔταξαν ἑαυτούς
  choice: wọ́n ti fi ara wọn fún
  rationale: Ó sọ ìpinnu àti ìfọkànsìn wọn sí iṣẹ́ náà ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοί gẹ́gẹ́ bí ọ̀rọ̀ ìpèjọ
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: “Ẹ̀yin ará” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ìjọ aládàpọ̀, nígbà tí àlàyé ìsàlẹ̀ sọ pé fọ́ọ̀mù Gíríìkì jẹ́ akọ.
- issue: Àwòrán ἀπαρχή
  choice: àkọ́so
  alternative: àwọn onígbàgbọ́ àkọ́kọ́
  rationale: A pa àwòrán ohun àkọ́kọ́ tí a yà sọ́tọ̀ fún Ọlọ́run mọ́, láìdín ọ̀rọ̀ náà kù sí ìtẹ̀lé àkókò nìkan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ìbánisọ̀rọ̀ tó ṣeé lóye. A lo “agbo ilé” fún ẹgbẹ́ gbogbo tó jẹ́ ti ilé kan, “àkọ́so” láti pa àwòrán Pọ́ọ̀lù mọ́, àti “àwọn ènìyàn mímọ́” fún τοῖς ἁγίοις láìgbẹ́kẹ̀ lé orúkọ ẹ̀ka ìjọ kan.
