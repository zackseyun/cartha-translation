review_pass:
  verdict: revise
  source_fidelity: The draft conveys the appeal, Stephanas’s household, their status as Achaia’s firstfruits, and their self-devotion to serving the saints. However, "Ǹjẹ́" introduces a more conspicuous English-like discourse opener than the mild Greek δέ requires, and the wording for household and service is not the most idiomatic Standard Yoruba.
  naturalness: '"Àwọn ara ilé Sítéfánà" is more natural than "agbo ilé Sítéfánà" for a household. "Ẹ mọ̀" requires the low tone on mọ̀. "Èso àkọ́kọ́" expresses the retained agricultural metaphor more transparently than "àkọ́so," while the revised service clause is idiomatic and clearly benefactive.'
  terminology: '"Ẹ̀yin ará" is an appropriate congregational address and preserves the source’s ambiguity concerning the audience’s composition. "Àwọn ènìyàn mímọ́" is a suitable non-denominational rendering of τοῖς ἁγίοις. The footnotes retain the Greek masculine-form observation and the consecratory/temporal dimensions of ἀπαρχή.'
  issues:
  - severity: medium
    issue: '"agbo ilé Sítéfánà" is not the most natural expression for a household.'
    rationale: The Greek οἰκία refers to the persons belonging to Stephanas’s household in context. "Àwọn ara ilé Sítéfánà" clearly and idiomatically identifies that social unit.
  - severity: medium
    issue: '"àkọ́so" is comparatively opaque and does not naturally communicate the agricultural "firstfruits" metaphor.'
    rationale: '"Èso àkọ́kọ́" retains the metaphor in accessible Yoruba; the footnote can explain that it denotes the earliest believers and a portion set apart to God.'
  - severity: low
    issue: The main text has "ẹ mọ" rather than "ẹ mọ̀."
    rationale: The tone mark on mọ̀ is needed for the verb ‘know’ in careful Standard Yoruba orthography.
  - severity: low
    issue: '"Ǹjẹ́" gives δέ more prominence than needed at the opening.'
    rationale: A simple "sì" after the subject conveys the mild connective force without adding a marked introductory particle.
  revised_text: 'Mo sì rọ̀ yín[a], ẹ̀yin ará: ẹ mọ̀ àwọn ara ilé Sítéfánà, pé àwọn ni èso àkọ́kọ́ ilẹ̀ Akáyà[b], wọ́n sì ti fi ara wọn fún iṣẹ́ ìránṣẹ́ fún àwọn ènìyàn mímọ́.'
