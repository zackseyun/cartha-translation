  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν δὲ παραγένωμαι, οὓς ⸀ἐὰν δοκιμάσητε δι’ ἐπιστολῶν, τούτους πέμψω ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: yo
  text: Nígbà tí mo bá sì dé, àwọn tí ẹ̀yin bá fọwọ́ sí ni èmi yóò rán pẹ̀lú àwọn lẹ́tà, kí wọ́n lè gbé ẹ̀bùn yín lọ sí Jerúsálẹ́m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀bùn inú rere yín.” Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “oore-ọ̀fẹ́,” ṣùgbọ́n níbí ó tọ́ka sí ẹ̀bùn tàbí ìrànlọ́wọ́ tí wọ́n ń rán sí Jerúsálẹ́m.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: Nígbà tí mo bá sì dé
  rationale: ὅταν pẹ̀lú ọ̀rọ̀-ìṣe subjunctive tọ́ka sí ohun ọjọ́ iwájú tí a retí; “nígbà tí mo bá dé” jẹ́ Yorùbá àdánidá. “sì” mú ìsopọ̀ δέ jáde láìfi ìtakò líle kún un.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: àwọn tí ẹ̀yin bá fọwọ́ sí
  rationale: δοκιμάζω níbí túmọ̀ sí yíyan àwọn aṣojú lẹ́yìn àyẹ̀wò; “fọwọ́ sí” sọ ìtẹ́wọ́gbà wọn ní Yorùbá àdánidá, nígbà tí “ẹ̀yin” ń tẹnu mọ́ pé ìjọ ni yóò yan wọn.
- source_word: δι’ ἐπιστολῶν
  choice: fi àwọn lẹ́tà
  rationale: διά pẹ̀lú genitive fi ohun èlò tàbí ohun tí ó bá iṣẹ́ náà lọ hàn. Gbólóhùn yìí fi hàn pé àwọn aṣojú náà yóò lọ pẹ̀lú àwọn lẹ́tà, láìṣe àfikún pé lẹ́tà ìjìnlẹ̀rere ni.
- source_word: τούτους πέμψω
  choice: àwọn ... ni èmi yóò ... ránṣẹ́
  rationale: τούτους tún tọ́ka sí àwọn tí ìjọ fọwọ́ sí, ó sì ní ìtẹnumọ́. Ìṣètò “àwọn ... ni èmi yóò ránṣẹ́” pa ìtẹnumọ́ náà mọ́ ní Yorùbá.
- source_word: ἀπενεγκεῖν
  choice: láti gbé ... lọ
  rationale: Infinitive náà sọ ète ìránṣẹ́ wọn; “gbé ... lọ” bá ìrìn láti Kọ́ríńtì sí Jerúsálẹ́m mu ju “mú ... wá” lọ.
- source_word: τὴν χάριν ὑμῶν
  choice: ẹ̀bùn yín
  rationale: Nínú àyíká ọ̀rọ̀ yìí, χάρις ni ọrẹ owó tí a ń kó fún àwọn ènìyàn mímọ́ ní Jerúsálẹ́m. “Ẹ̀bùn” jẹ́ kedere, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ oore-ọ̀fẹ́ tàbí ìṣe inú rere rẹ̀ mọ́.
- source_word: εἰς Ἰερουσαλήμ
  choice: sí Jerúsálẹ́m
  rationale: εἰς pẹ̀lú orúkọ ìlú túmọ̀ sí ibi tí wọ́n ń lọ; “sí Jerúsálẹ́m” ni Yorùbá tó bá a mu.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú ọ̀rọ̀ ọrẹ fún Jerúsálẹ́m
  choice: Ẹ̀bùn tàbí ọrẹ ohun ìní tí ìjọ Kọ́ríńtì fi inú rere fúnni
  alternative: Oore-ọ̀fẹ́ ní ìtumọ̀ àìlérí, tàbí ìṣe inú rere
  rationale: Àyíká 1 Kọ́ríńtì 16 jẹ́ ti kíkó ọrẹ jọ fún àwọn ènìyàn mímọ́. Nítorí náà, ọ̀rọ̀ náà tọ́ka sí ẹ̀bùn gidi, bí ó tilẹ̀ jẹ́ pé ó tún ní ìmọ̀lára inú rere àti oore-ọ̀fẹ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá, pẹ̀lú àmì ohùn ní kíkún. A lo “fọwọ́ sí” fún ìtẹ́wọ́gbà àwọn aṣojú, “ránṣẹ́” fún pémpō, àti ìṣètò onítẹnumọ́ “àwọn ... ni èmi yóò ...” láti pa agbára τούτους mọ́. A fi àmì ìsàlẹ̀-ọ̀rọ̀ [a] sí lẹ́yìn gbogbo ẹsẹ̀ nítorí ó ṣàlàyé “ẹ̀bùn yín.”
