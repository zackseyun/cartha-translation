id: 1CO.16.7
reference: 1 Corinthians 16:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: yo
  text: Nítorí mi ò fẹ́ rí yín nísinsin yìí nígbà tí mo bá ń kọjá lọ[a]; mo ní ìrètí láti dúró lọ́dọ̀ yín fún àkókò kan, bí Olúwa bá yọ̀ǹda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ìgbà tí mo ń kọjá lọ” tàbí “lójú ọ̀nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω
  choice: èmi kò fẹ́
  rationale: Ó ṣàfihàn ìfẹ́ tàbí ète Pọ́ọ̀lù ní ọ̀nà àdánidá, láìsọ ọ́ di ọ̀rọ̀ ìpinnu líle ju bí Gíríìkì ṣe wí lọ.
- source_word: ἄρτι
  choice: nísinsin yìí
  rationale: Ó tọ́ka sí àkókò ìsinsin yìí, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἐν παρόδῳ
  choice: kìkì bí ẹni tó ń kọjá lọ
  rationale: Ó mú èrò ìbẹ̀wò ṣókí nígbà ìrìnàjò jáde, nígbà tí àlàyé ìsàlẹ̀ fi àwọn ọ̀nà mìíràn tí a lè gbà túmọ̀ ọ́ hàn.
- source_word: ἰδεῖν
  choice: rí yín
  rationale: Ó pa ìtumọ̀ gidi ti ‘rí’ mọ́, bó tilẹ̀ jẹ́ pé nínú àyíká yìí ó tún ní ìtumọ̀ bíbẹ̀ wọ́n wò.
- source_word: ἐλπίζω
  choice: mo ní ìrètí
  rationale: Ó fi ìrètí àti ìfojúsọ́nà hàn láìsọ ọ́ di ohun tó dájú.
- source_word: χρόνον τινά
  choice: fún àkókò díẹ̀
  rationale: Ó tọ́ka sí àkókò kan tí a kò pinnu gígùn rẹ̀ ní pàtó, ṣùgbọ́n tí kì í ṣe ìbẹ̀wò ojú-ọ̀nà lásán.
- source_word: ἐπιμεῖναι
  choice: láti dúró
  rationale: Ó túmọ̀ sí láti wà níbẹ̀ síwájú tàbí láti gbé pẹ̀lú wọn fún ìgbà kan.
- source_word: πρὸς ὑμᾶς
  choice: lọ́dọ̀ yín
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe ‘dúró,’ èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ wíwà pẹ̀lú àwọn ènìyàn náà.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: bí Olúwa bá yọ̀ǹda
  rationale: Ó pa gbólóhùn onípo mọ́, ó sì fi hàn pé ète Pọ́ọ̀lù sinmi lórí ìyọ̀ǹda Olúwa.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó yẹ fún κύριος ní àyíká yìí, láìfi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí kún un.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jésù; Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ní pàtó bóyá ó ń tọ́ka sí Jésù tàbí Ọlọ́run Baba. Nítorí náà, a pa àìsọ-ní-pàtó náà mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Gbólóhùn náà pa àtúnṣe γὰρ méjèèjì mọ́ nípasẹ̀ ‘nítorí,’ bí ó tilẹ̀ jẹ́ pé èyí fún un ní ìrísí ìjiyàn tó sún mọ́ ti orísun.
