  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: yo
  text: Ní ti ọrẹ tí a ń kó jọ fún àwọn ènìyàn mímọ́[a], gẹ́gẹ́ bí mo ṣe pàṣẹ fún àwọn ìjọ ní Galátíà ni kí ẹ̀yin náà ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọrẹ tí a ń kó jọ fún àwọn ènìyàn Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ní ti
  rationale: Ó ṣàgbékalẹ̀ kókó tuntun nínú lẹ́tà lọ́nà àdánidá, láìfi ọ̀rọ̀ àsìkò kan tí kò sí nínú Gíríìkì kún un.
- source_word: λογείας
  choice: ọrẹ tí a ń kó jọ
  rationale: Ó túmọ̀ sí owó tàbí ìrànlọ́wọ́ tí a ń kó jọ; ọ̀rọ̀ yìí jẹ́ kó ṣe kedere ní Yorùbá láìfi ìtumọ̀ ìrúbọ ẹ̀sìn tí kò pọndandan kún un.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: fún àwọn ènìyàn mímọ́
  rationale: Ó pa ìtumọ̀ àwọn olùgbà ọrẹ náà mọ́, ó sì ṣe àfihàn ọ̀nà tí Pọ́ọ̀lù máa ń gbà pe àwọn onígbàgbọ́ ní ‘àwọn mímọ́.’
- source_word: διέταξα
  choice: mo ti pàṣẹ
  rationale: διατάσσω ní agbára ìtọ́nisọ́nà tí ó láṣẹ; ‘pàṣẹ’ fi agbára ọ̀rọ̀ náà hàn ní kedere nínú àyíká yìí.
- source_word: ἐκκλησίαις
  choice: àwọn ìjọ
  rationale: Ní lílo Pọ́ọ̀lù, ó tọ́ka sí àwọn àwùjọ onígbàgbọ́; ‘àwọn ìjọ’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì péye.
- source_word: Γαλατίας
  choice: Galátíà
  rationale: Àkọsílẹ̀ orúkọ agbègbè náà ní Yorùbá pẹ̀lú àmì ohùn.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: bẹ́ẹ̀ náà ni kí ẹ̀yin pẹ̀lú ṣe
  rationale: Ó pa ìfiwéra àti agbára àṣẹ inú aorist imperative mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ἅγιοι ní àyíká ìrànlọ́wọ́ owó
  choice: àwọn ènìyàn mímọ́
  alternative: àwọn ènìyàn Ọlọ́run
  rationale: ‘Àwọn ènìyàn mímọ́’ pa àsopọ̀ ọ̀rọ̀ àti ẹ̀kọ́ ìgbàgbọ́ tí ó wà nínú bí Pọ́ọ̀lù ṣe ń lo ἅγιοι mọ́, láìtọ́ka sí ètò ìsọni-di-mímọ́ ti ìgbà tó tẹ̀ lé e.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. A lo ‘ẹ̀yin’ láti fi hàn pé ọ̀pọ̀ ènìyàn ni Pọ́ọ̀lù ń bá sọ̀rọ̀.
