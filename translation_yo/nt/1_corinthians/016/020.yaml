source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες. ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: yo
  text: Àwọn arákùnrin gbogbo ń kí yín[a]. Ẹ kí ara yín pẹ̀lú ìfẹnukonu mímọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn ará gbogbo ń kí yín.” Ọ̀rọ̀ Gíríìkì fún “àwọn arákùnrin” lè tọ́ka sí gbogbo àwọn onígbàgbọ́ lápapọ̀, àwọn arákùnrin àti arábìnrin.
    reason: lexical_alternative
  - marker: b
    text: “Ìfẹnukonu mímọ́” jẹ́ ìkíni tí ó wọ́pọ̀ láàárín àwọn onígbàgbọ́, tí ó ń fi ìwà mímọ́ àti ìbáṣepọ̀ wọn hàn.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: kí yín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ìkíni ránṣẹ́ tàbí kí ẹnì kan; “kí yín” jẹ́ ọ̀nà àdánidá àti ṣókí nínú lẹ́tà Yorùbá.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: Gbogbo àwọn arákùnrin
  rationale: Èyí pa ìrísí akọ púpọ̀ ti ọ̀rọ̀ Gíríìkì mọ́, láì fi “àti arábìnrin” kún ọ̀rọ̀ pàtàkì; àlàyé ìtumọ̀ àkópọ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἀσπάσασθε
  choice: Ẹ ... kí
  rationale: Àṣẹ tààrà ni ọ̀rọ̀ Gíríìkì; “Ẹ ... kí” jẹ́ àṣẹ ọlọ́wọ̀ tí ó bá ọ̀rọ̀ sí ìjọ mu, ó sì pa ìbámu pẹ̀lú “kí yín” ní ìdájọ́ àkọ́kọ́ mọ́.
- source_word: ἀλλήλους
  choice: ara yín
  rationale: “Ara yín” ni ọ̀nà Yorùbá àdánidá láti sọ ìṣe tí àwọn ènìyàn ń ṣe sí ara wọn.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: fi ìfẹnukonu mímọ́
  rationale: “Fi” sọ ọ̀nà tàbí ohun èlò ìkíni, “ìfẹnukonu” sì pa ìṣe ara tí ọ̀rọ̀ Gíríìkì sọ mọ́; “mímọ́” fi ìwà yíya sọ́tọ̀ fún Ọlọ́run àti ìwà pípé rẹ̀ hàn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφοί ní àyíká ìjọ
  choice: àwọn arákùnrin
  alternative: àwọn ará; àwọn arákùnrin àti arábìnrin
  rationale: Ọ̀rọ̀ pàtàkì pa akọ púpọ̀ Gíríìkì mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí ó hàn pé ọ̀rọ̀ náà lè tọ́ka sí gbogbo àwọn onígbàgbọ́, akọ àti abo, ní àyíká yìí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ẹ/yín” gẹ́gẹ́ bí ọ̀rọ̀-orúkọ púpọ̀ fún gbogbo ìjọ, kì í ṣe gẹ́gẹ́ bí àmì ọ̀wọ̀ sí ẹnì kan ṣoṣo. Àwọn àmì ohùn ni a fi síbi tí wọ́n ti yẹ.
