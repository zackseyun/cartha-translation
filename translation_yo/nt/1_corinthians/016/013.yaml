  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: yo
  text: 'Ẹ máa wà lójúfò; ẹ dúró ṣinṣin nínú ìgbàgbọ́; ẹ huwa bí ọkùnrin[a]; ẹ jẹ́ alágbára.[b]


    [a] Tàbí: “ẹ ní ìgboyà” tàbí “ẹ jẹ́ akíkanjú.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà pé “ẹ huwa bí ọkùnrin,” ṣùgbọ́n gẹ́gẹ́ bí àkànlò èdè, ó ń ké síni láti ní ìgboyà.


    [b] Tàbí: “ẹ jẹ́ kí a fún yín lókun.” Fọ́ọ̀mù Gíríìkì náà lè jẹ́ ti ohùn ìfaragba, bí ó tilẹ̀ jẹ́ pé “ẹ jẹ́ alágbára” jẹ́ ọ̀nà àdánidá láti sọ àṣẹ náà ní Yorùbá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ẹ ní ìgboyà” tàbí “ẹ jẹ́ akíkanjú.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà pé “ẹ huwa bí ọkùnrin,” ṣùgbọ́n gẹ́gẹ́ bí àkànlò èdè, ó ń ké síni láti ní ìgboyà.'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: “ẹ jẹ́ kí a fún yín lókun.” Fọ́ọ̀mù Gíríìkì náà lè jẹ́ ti ohùn ìfaragba, bí ó tilẹ̀ jẹ́ pé “ẹ jẹ́ alágbára” jẹ́ ọ̀nà àdánidá láti sọ àṣẹ náà ní Yorùbá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: Ẹ máa wà lójúfò
  rationale: Àṣẹ ìsinsìnyí elésìnrúpọ̀ ń tọ́ka sí ìṣọ́ra tí ó ń bá a lọ; “máa wà lójúfò” jẹ́ àkànlò Yorùbá àdánidá fún wíwà ní ìmúrasílẹ̀ àti ṣíṣọ́ra.
- source_word: στήκετε
  choice: ẹ dúró ṣinṣin
  rationale: Ó pa ìtumọ̀ àpẹẹrẹ ti dídúró láìyẹsẹ̀ mọ́, kì í ṣe dídúró nípa ara nìkan.
- source_word: ἐν τῇ πίστει
  choice: nínú ìgbàgbọ́
  rationale: “Nínú” pa ìtumọ̀ ààyè tàbí ìpìlẹ̀ mọ́; “ìgbàgbọ́” lè tọ́ka sí ìgbàgbọ́ Kristẹni láìfi ẹ̀kọ́ ẹ̀sìn kan tí óóró kún un.
- source_word: ἀνδρίζεσθε
  choice: ẹ ṣe bí ọkùnrin
  rationale: Ó pa àwòrán akọ tí ó wà nínú ọ̀rọ̀ Gíríìkì mọ́. Àlàyé ìsàlẹ̀ fi ìtumọ̀ àkànlò rẹ̀—níní ìgboyà—hàn, kí a má bàa fi hàn pé àwọn ọkùnrin nìkan ni a ń bá sọ̀rọ̀.
- source_word: κραταιοῦσθε
  choice: ẹ jẹ́ alágbára
  rationale: Ó jẹ́ àṣẹ Yorùbá tí ó rọrùn, tí ó sì bá ìtumọ̀ okun mu; àlàyé ìsàlẹ̀ pa ìró afarada Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ πίστις pẹ̀lú atọ́ka ọ̀rọ̀
  choice: nínú ìgbàgbọ́
  alternative: nínú ìgbàgbọ́ náà
  rationale: Atọ́ka Gíríìkì lè tọ́ka sí ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí ohun tí wọ́n gbà gbọ́, ṣùgbọ́n fífi “náà” sí i ní Yorùbá lè dún bí ohun kan tí a ti mẹ́nu kàn tẹ́lẹ̀. Ẹ̀dà pàtàkì pa gbolohun náà mọ́ ní ọ̀nà àdánidá láìfi ìtumọ̀ tóóró kan lé e lórí.
- issue: Agbára akọ nínú ἀνδρίζεσθε
  choice: ẹ ṣe bí ọkùnrin
  alternative: ẹ ní ìgboyà
  rationale: Ẹ̀dà pàtàkì pa àwòrán akọ inú ọ̀rọ̀ orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ ṣàlàyé pé ìpè sí ìgboyà ni àkànlò náà, kì í ṣe dídín àwọn tí a ń bá sọ̀rọ̀ kù sí ọkùnrin nìkan.
- issue: Ìró afarada nínú κραταιοῦσθε
  choice: ẹ jẹ́ alágbára
  alternative: ẹ jẹ́ kí a fún yín lókun
  rationale: Ìtumọ̀ àkọ́kọ́ jẹ́ Yorùbá àdánidá, ṣùgbọ́n a tọ́ka sí ṣíṣe àṣẹ náà ní ìró afarada nínú àlàyé nítorí fọ́ọ̀mù Gíríìkì lè túmọ̀ sí pé a ń fún wọn lókun.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ elésìnrúpọ̀ “ẹ,” àti àmì ohùn ní kíkún. Àwọn àṣẹ kúkúrú àti àmì olódì olójú méjì pa ìṣísẹ̀ ọ̀rọ̀ Gíríìkì mọ́, ní èdè òde òní tí ó ní iyì.
