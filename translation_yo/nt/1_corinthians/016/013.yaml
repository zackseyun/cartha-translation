  naturalness: “Ẹ máa wà lójúfò,” “ẹ dúró ṣinṣin nínú ìgbàgbọ́,” and “ẹ jẹ́ alágbára” are natural Standard Yoruba. “Ẹ huwa bí ọkùnrin” is more idiomatic and precise than “Ẹ ṣe bí ọkùnrin.”
  terminology: “Ìgbàgbọ́” appropriately renders πίστις without forcing a narrower doctrinal construal. The revised footnote uses “ohùn ìfaragba” for passive voice and qualifies the grammatical claim to reflect the Greek form’s middle/passive ambiguity.
