revisions:
- from: Àwọn ìjọ ní Éṣíà kí yín[a]. Ákílà àti Prísíkà, pẹ̀lú ìjọ tí ó wà ní ilé wọn, kí yín tọkàntọkàn nínú Olúwa[b].
  to: Àwọn ìjọ ní Éṣíà ń kí yín[a]. Ákílà àti Prísíkà[b], pẹ̀lú ìjọ tí ó wà ní ilé wọn, ń kí yín tọkàntọkàn nínú Olúwa.
  rationale: The revision preserves the source meaning while making the ongoing greetings explicit with ń kí yín. It moves note [b] to Prísíkà, its proper anchor, and slightly tightens note [a] so that it contrasts the Roman province with the modern continent without implying that the issue is only its extent.
