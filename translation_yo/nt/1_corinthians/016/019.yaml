id: 1CO.16.19
reference: 1 Corinthians 16:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: yo
  text: Àwọn ìjọ ní Éṣíà ń kí yín[a]. Ákílà àti Prísíkà[b], pẹ̀lú ìjọ tí ó wà ní ilé wọn, ń kí yín tọkàntọkàn nínú Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éṣíà” níbí ni ìpínlẹ̀ Róòmù tí a ń pè ní Éṣíà, ní apá ìwọ̀-oòrùn Éṣíà Kékeré; kì í ṣe kọ́ńtínẹ́ǹtì Éṣíà òde òní.
    reason: cultural_note
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ní “Prísíkà”; ní àwọn ibòmíràn, a tún ń pè é ní “Prísílà” (fún àpẹẹrẹ, Ìṣe 18:2, 18, 26; Róòmù 16:3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: kí yín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíkí tàbí fífi ìkíni ránṣẹ́; “kí yín” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá àyíká lẹ́tà mu.
- source_word: αἱ ἐκκλησίαι
  choice: àwọn ìjọ
  rationale: Nínú lílo Páùlù, ἐκκλησία ń tọ́ka sí àwọn àwùjọ onígbàgbọ́; “àwọn ìjọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀.
- source_word: τῆς Ἀσίας
  choice: ní Éṣíà
  rationale: Jẹ́nítífù Gíríìkì yìí ń tọ́ka sí ibi tí àwọn ìjọ wà. “Ní Éṣíà” jẹ́ àdàkọ Yorùbá àdánidá; àlàyé ìpínlẹ̀ Róòmù wà ní àlàyé ìsàlẹ̀.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ àti ìbáṣepọ̀ Kristẹni mọ́ láì fi ohun tí kò sí nínú ọ̀rọ̀ orísun kún un.
- source_word: πολλὰ
  choice: tọkàntọkàn
  rationale: Gẹ́gẹ́ bí ọ̀rọ̀ tó ń fún ìkíni náà ní agbára, πολλὰ fi ìtara àti ọ̀yàyà hàn. “Tọkàntọkàn” sọ agbára yìí ní Yorùbá àdánidá.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: Ákílà àti Prísíkà
  rationale: A kọ orúkọ méjèèjì gẹ́gẹ́ bí ìró wọn nínú Gíríìkì. Πρίσκα jẹ́ Prísíkà ní ẹsẹ yìí, kì í ṣe fọ́ọ̀mù gígùn Prísílà.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: pẹ̀lú ìjọ tí ó wà ní ilé wọn
  rationale: Èyí dúró nítòsí ọ̀rọ̀ orísun, ó sì fi hàn pé ìjọ kan wà ní ilé wọn, láì sọ ọ́ di ìdílé wọn nìkan tàbí fi àlàyé tó pọ̀ sí i sínú ẹsẹ.
theological_decisions:
- issue: Ìtumọ̀ ἐκκλησία ní àyíká ilé
  choice: ìjọ tí ó wà ní ilé wọn
  alternative: ìjọ tí ó máa ń péjọ ní ilé wọn
  rationale: Gbólóhùn náà tọ́ka sí àwùjọ àwọn onígbàgbọ́ ní ilé Ákílà àti Prísíkà, kì í ṣe àwọn ará ilé náà nìkan. Àṣàyàn yìí tún pa ìwòye kúkúrú ọ̀rọ̀ Gíríìkì mọ́.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος nínú àyíká ìjẹ́wọ́ àti ìbáṣepọ̀ Kristẹni yìí.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tó ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ Yorùbá àti àwọn orúkọ bí ó ti yẹ. A gbé àmì àlàyé [b] sí lẹ́yìn “Olúwa” ní òpin gbólóhùn kejì kí ó lè ṣàlàyé orúkọ Prísíkà láì dá ìṣàn ọ̀rọ̀ dúró.
