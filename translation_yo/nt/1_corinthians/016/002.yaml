id: 1CO.16.2
reference: 1 Corinthians 16:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ μίαν ⸀σαββάτου ἕκαστος ὑμῶν παρ’ ἑαυτῷ τιθέτω θησαυρίζων ὅ τι ⸀ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: yo
  text: Ní ọjọ́ kìíní ọ̀sẹ̀ kọ̀ọ̀kan[a], kí olúkúlùkù yín fi ohun kan sọ́tọ̀ lọ́dọ̀ ara rẹ̀[b], kí ó sì máa kó o jọ gẹ́gẹ́ bí ó bá ṣe ń rí rere[c], kí a má bàa ṣe àwọn àkójọ nígbà tí mo bá dé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Ní ọjọ́ kìíní ọ̀sẹ̀.” Ọ̀rọ̀ Gíríìkì níbí ń tọ́ka sí ohun tí a ń ṣe déédé ní ọ̀sẹ̀ kọ̀ọ̀kan.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “pẹ̀lú ara rẹ̀” tàbí “ní ọ̀dọ̀ ara rẹ̀.” Èyí lè túmọ̀ sí pé kí ẹnì kọ̀ọ̀kan ya ohun tí yóò fún sọ́tọ̀ fúnra rẹ̀, ó sì ṣeé ṣe kí ó jẹ́ ní ilé rẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ní ìbámu pẹ̀lú bí nǹkan bá ṣe ń lọ dáadáa fún un.” Ìtumọ̀ náà ni pé kí iye tí ẹnì kọ̀ọ̀kan yà sọ́tọ̀ bá aásìkí tí ó rí mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: Ní ọjọ́ kìíní ọ̀sẹ̀ kọ̀ọ̀kan
  rationale: Ọ̀rọ̀ Gíríìkì yìí ní ìtumọ̀ pínpín tí ó fi hàn pé ohun tí wọ́n ń ṣe déédé ní ọ̀sẹ̀ kọ̀ọ̀kan ni; èdè Yorùbá yìí mú ìtumọ̀ náà jáde ní kedere.
- source_word: ἕκαστος ὑμῶν
  choice: olúkúlùkù yín
  rationale: Ó pa àṣẹ náà mọ́ gẹ́gẹ́ bí ohun tí ó kan ẹnì kọ̀ọ̀kan nínú àwọn tí Pọ́ọ̀lù ń bá sọ̀rọ̀.
- source_word: παρ’ ἑαυτῷ
  choice: lọ́dọ̀ ara rẹ̀
  rationale: Ó pa ìtumọ̀ ‘pẹ̀lú ara rẹ̀’ tàbí ‘ní ọ̀dọ̀ ara rẹ̀’ mọ́, láì pinnu bóyá ilé ẹni gan-an ni a túmọ̀ sí.
- source_word: τιθέτω θησαυρίζων
  choice: fi ohun kan sọ́tọ̀ ... kí ó sì máa kó o jọ
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí fi àṣẹ tí ń bá a lọ àti ìkójọ díẹ̀díẹ̀ hàn, èyí tí gbolohun Yorùbá náà mú jáde lọ́nà àdánidá.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: gẹ́gẹ́ bí ó bá ṣe ń rí rere
  rationale: Ó pa àìdájú àti èrò ìlọsíwájú tàbí aásìkí inú ọ̀rọ̀ Gíríìkì mọ́, láì fi ‘owó oṣù,’ ‘èrè,’ tàbí pé Ọlọ́run ni olùṣe kún ohun tí ẹsẹ náà kò sọ ní tààrà.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: kí a má bàa ṣe àwọn àkójọ nígbà tí mo bá dé
  rationale: 'Ó mú ète ìtọ́ni náà jáde: kí wọ́n má ṣe bẹ̀rẹ̀ sí í gba ọrẹ jọ nígbà tí Pọ́ọ̀lù bá dé.'
theological_decisions:
- issue: Bóyá παρ’ ἑαυτῷ túmọ̀ sí pé kí ẹni náà fi owó pamọ́ sí ilé tàbí kí ó kàn yà á sọ́tọ̀ fúnra rẹ̀
  choice: lọ́dọ̀ ara rẹ̀
  alternative: ní ilé rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìpamọ́ ti ara ẹni, ṣùgbọ́n kò fi ‘ilé’ hàn láìsí àní-àní; nítorí náà, a pa ààyè ìtumọ̀ náà mọ́.
- issue: Olùṣe aásìkí nínú εὐοδῶται
  choice: gẹ́gẹ́ bí ó bá ṣe ń rí rere
  alternative: gẹ́gẹ́ bí Ọlọ́run bá ṣe ń bù kún un
  rationale: Fọ́ọ̀mù ọ̀rọ̀ náà lè ní ìtumọ̀ pé a ń ṣe rere fún ẹni náà, ṣùgbọ́n kò dárúkọ Ọlọ́run ní tààrà; a kò fi olùṣe tí a kò sọ sínú ọ̀rọ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘àkójọ’ fún ọrẹ owó tí a ń gbà jọ, a sì yẹra fún fífi ọ̀rọ̀ ẹ̀kọ́ ìsìn tàbí àlàyé tí kò sí nínú Gíríìkì kún un.
