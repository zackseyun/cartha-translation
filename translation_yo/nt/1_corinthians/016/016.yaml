  text: kí ẹ̀yin náà máa tẹrí bá fún irú àwọn ènìyàn bẹ́ẹ̀,[a] àti fún gbogbo ẹni tí ó ń ṣiṣẹ́ pọ̀, tí ó sì ń ṣe làálàá.[b]
  philosophy: optimal-equivalence
  footnotes:
