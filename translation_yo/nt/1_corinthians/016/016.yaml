    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí
  rationale: Ó ṣe àmì pé gbólóhùn yìí ń tẹ̀ síwájú nínú ìpè Pọ́ọ̀lù, ó sì lè fi ète tàbí àkóónú ohun tí ó ń rọ wọn láti ṣe hàn.
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin náà
  rationale: 'Ó pa ìtumọ̀ ìkópa àti ìtẹnumọ́ mọ́: àwọn ará Kọ́ríńtì pẹ̀lú gbọ́dọ̀ hùwà báyìí.'
- source_word: ὑποτάσσησθε
  choice: máa tẹrí ba fún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ara ẹni sábẹ́ ìdarí tàbí fífi ọ̀wọ̀ gba ipò ẹlòmíràn, láì sọ ọ́ di ìgbọràn aláìní ààlà.
- source_word: τοῖς τοιούτοις
  choice: fún irú àwọn ènìyàn bẹ́ẹ̀
  rationale: Ó tọ́ka sí àwọn ènìyàn bí Sítéfánà àti àwọn tó ya ara wọn sí mímọ́ fún iṣẹ́ ìránṣẹ́, láì fi ọ̀rọ̀ náà mọ́ akọ nìkan.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: fún olúkúlùkù ẹni tí ó ń fọwọ́ sowọ́ pọ̀
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe alábápín mọ́, ó sì fi hàn pé ẹni náà ń ṣiṣẹ́ pọ̀ pẹ̀lú àwọn ẹlòmíràn.
- source_word: καὶ κοπιῶντι
  choice: tí ó sì ń ṣe làálàá
  rationale: “Ṣe làálàá” fi iṣẹ́ takuntakun àti ìsapá líle tí κοπιάω ní hàn ju “ṣiṣẹ́” lásán lọ.
theological_decisions:
- issue: Irú ìtẹríba tí a pàṣẹ
  choice: Ìpè láti fi ara ẹni sábẹ́, kí a sì fi ọ̀wọ̀ gba àwọn òṣìṣẹ́ Kristẹni tí a mọ̀ sí ẹni ìránṣẹ́, bí àwọn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
  alternative: Ìgbọràn aláṣẹ tí kò ní ààlà nínú ètò ipò.
  rationale: Àyíká ẹsẹ 15–18 dá lórí agbo ilé Sítéfánà àti gbogbo àwọn tí ń kópa nínú iṣẹ́ náà. “Máa tẹrí ba fún” pa agbára àṣẹ náà mọ́ láì gbé ẹ̀kọ́ nípa àṣẹ aláìní ààlà wọ inú ẹsẹ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Gbólóhùn náà bẹ̀rẹ̀ pẹ̀lú “kí” nítorí pé ó ń tẹ̀ síwájú láti inú ìpè tó wà ní ẹsẹ tó ṣáájú.
