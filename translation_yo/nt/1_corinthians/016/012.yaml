id: 1CO.16.12
reference: 1 Corinthians 16:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: yo
  text: Ní ti Apólò, arákùnrin wa[a], mo rọ̀ ọ́ gidigidi pé kí ó bá àwọn arákùnrin náà wá sọ́dọ̀ yín; ṣùgbọ́n kò fẹ́ rárá láti wá nísinsìnyí[b]. Síbẹ̀, yóò wá nígbà tí ó bá rí àǹfààní.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Apólò, arákùnrin náà.” Gíríìkì sọ pé “arákùnrin náà,” kò sì ní arọ́pò-orúkọ ohun-ìní tó túmọ̀ sí “wa.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní ọ̀rọ̀ gẹ́gẹ́ bí ó ti wà ní Gíríìkì: “kò jẹ́ ìfẹ́ rẹ̀ rárá láti wá nísinsìnyí.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ní ti
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti yí sí kókó tuntun, láì fi ọ̀rọ̀ àkókò kan kún un.
- source_word: Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: Apólò arákùnrin wa
  rationale: A kọ orúkọ náà gẹ́gẹ́ bí ìpè Yorùbá; ‘arákùnrin wa’ sì jẹ́ ọ̀rọ̀ àdánidá fún arákùnrin nínú ìgbàgbọ́, bí ó tilẹ̀ jẹ́ pé Gíríìkì sọ ní tààrà pé ‘arákùnrin náà.’
- source_word: πολλὰ παρεκάλεσα
  choice: mo rọ̀ ọ́ gidigidi
  rationale: ‘Gidigidi’ mú agbára ìrọ̀ náà hàn ní Yorùbá tó ṣe kedere.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς
  choice: pé kí ó ... wá sọ́dọ̀ yín
  rationale: Ìkọ́lé ‘rọ̀ ọ́ pé kí ó’ sọ ohun tí Pọ́ọ̀lù rọ̀ ọ́ láti ṣe ní Yorùbá àdánidá.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: bá àwọn arákùnrin náà
  rationale: Ọ̀pọ̀ akọ ni ọ̀rọ̀ Gíríìkì, ó sì ṣeé ṣe kó tọ́ka sí àwọn ọkùnrin kan pàtó tí wọ́n ń rìnrìn àjò.
- source_word: καὶ πάντως οὐκ ἦν θέλημα
  choice: ṣùgbọ́n kò fẹ́ rárá
  rationale: Ìtumọ̀ yìí mú ìtẹnumọ́ πάντως àti ìfẹ́ tàbí ìmúratán θέλημα hàn ní Yorùbá tó rọrùn, láì sọ ọ́ di ìfẹ́ Ọlọ́run.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó tọ́ka sí àkókò ìsinsìnyí ní tààrà.
- source_word: ἐλεύσεται δὲ
  choice: Síbẹ̀, yóò wá
  rationale: ‘Síbẹ̀’ mú ìyàtọ̀ tó wà láàárín àìfẹ́ láti wá ní báyìí àti wíwá lọ́jọ́ iwájú hàn.
- source_word: ὅταν εὐκαιρήσῃ
  choice: nígbà tí ó bá rí àǹfààní
  rationale: Ó túmọ̀ sí nígbà tí àkókò tàbí àǹfààní tó yẹ bá sí, kì í ṣe ìrọ̀rùn ara ẹni lásán.
theological_decisions:
- issue: Ẹni tí θέλημα jẹ́ tirẹ̀ nínú οὐκ ἦν θέλημα
  choice: Apólò fúnra rẹ̀ ni kò fẹ́ láti wá nígbà náà.
  alternative: Kì í ṣe ìfẹ́ Ọlọ́run pé kí ó wá nígbà náà.
  rationale: Apólò ni ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, kò sì sí àmì kankan nínú àyíká ọ̀rọ̀ pé ‘ìfẹ́’ yìí jẹ́ ti Ọlọ́run. Nítorí náà, a kò fi ẹ̀kọ́ ìsìn tí orísun kò sọ kún un.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti ọ̀rọ̀ tó ṣe kedere fún òǹkàwé òde òní. A lo ‘arákùnrin’ fún àwọn akọ tí àyíká ọ̀rọ̀ tọ́ka sí, a sì pa ìyàtọ̀ tó wà láàárín àìfẹ́ Apólò ní báyìí àti ète rẹ̀ láti wá nígbà tó bá rí àǹfààní mọ́.
