id: 1CO.10.4
reference: 1 Corinthians 10:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: yo
  text: Gbogbo wọn sì mu ohun mímu ti ẹ̀mí kan náà, nítorí wọ́n ń mu láti inú àpáta ti ẹ̀mí kan tí ń tẹ̀lé wọn[a], àpáta náà sì ni Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti inú àpáta ti ẹ̀mí kan tó tẹ̀lé wọn.” Ọ̀rọ̀ ìṣe Gíríìkì náà lè jẹ́ “tó tẹ̀lé,” ṣùgbọ́n “tí ń tẹ̀lé” fi ìṣe tí ó ń bá a lọ hàn dáadáa sí i.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “Kristi.” Níhìn-ín a túmọ̀ rẹ̀ sí “Mèsáyà” nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, kì í ṣe bí orúkọ lásán.
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: ohun mímu ti ẹ̀mí
  rationale: Ó pa àpèjúwe Pọ́ọ̀lù mọ́ gẹ́gẹ́ bí ohun tí ó jẹ́ ti ìpèsè Ẹ̀mí Ọlọ́run, ó sì bá ọ̀rọ̀ ‘oúnjẹ ti ẹ̀mí’ ní ẹsẹ tó ṣáájú mu.
- source_word: ἔπιον
  choice: mu
  rationale: Ọ̀rọ̀ ìṣe aorist náà ṣàkópọ̀ ohun tí gbogbo ìran inú aginjù ní ìrírí rẹ̀; ‘mu’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ἔπινον
  choice: ń mu
  rationale: Àmì ‘ń’ fi ìṣe tí ó ń bá a lọ tàbí tí a ń ṣe léraléra hàn, ó sì yà ọ̀rọ̀ yìí sọ́tọ̀ kúrò lọ́dọ̀ aorist ἔπιον.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: láti inú àpáta ti ẹ̀mí kan tí ń tọ̀ wọ́n lẹ́yìn
  rationale: ‘Àpáta ... kan’ fi àìsí article nínú gbólóhùn Gíríìkì hàn, ‘tí ń tọ̀ wọ́n lẹ́yìn’ sì pa ìtumọ̀ ìṣe tí ó ń bá a lọ nínú present participle mọ́.
- source_word: πέτρα
  choice: àpáta
  rationale: πέτρα túmọ̀ sí àpáta ńlá, kì í ṣe òkúta kékeré; ó tún pa agbára àpẹẹrẹ ọ̀rọ̀ náà mọ́.
- source_word: ἡ πέτρα δὲ ἦν
  choice: àpáta náà sì ni
  rationale: ‘Sì’ jẹ́ asopọ̀ Yorùbá tó rọrùn fún δέ níbí, ‘ni’ sì fi gbólóhùn ìdánimọ̀ náà hàn ní kedere.
- source_word: ὁ Χριστός
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè nínú gbólóhùn ìdánimọ̀ yìí; ‘Mèsáyà’ sọ ìtumọ̀ oyè náà jáde dípò lílò ó bí orúkọ lásán.
- source_word: πάντες τὸ αὐτὸ
  choice: gbogbo wọn ... kan náà
  rationale: Ó pa ìtẹnumọ́ Pọ́ọ̀lù mọ́ pé gbogbo wọn pín ìrírí kan náà.
theological_decisions:
- issue: Gbólóhùn ìdánimọ̀ pé ‘àpáta náà ni Mèsáyà’
  choice: A túmọ̀ gbólóhùn náà ní tààrà, kí ìdánimọ̀ ti ẹ̀kọ́ ìgbàgbọ́ àti ti àpẹẹrẹ inú ọ̀rọ̀ Pọ́ọ̀lù lè dúró láìsọ pé ohun èlò àpáta àti ẹni Mèsáyà jẹ́ ohun kan nípa ẹ̀dá wọn.
  alternative: ‘Àpáta náà dúró fún Mèsáyà,’ tàbí pé ó jẹ́ ìtọ́kasí àṣà nípa àpáta iṣẹ́ ìyanu nìkan.
  rationale: Gíríìkì ní gbólóhùn ìdọ́gba tààrà, ἡ πέτρα δὲ ἦν ὁ Χριστός. Ìtumọ̀ kò gbọ́dọ̀ sọ agbára ìdánimọ̀ náà di àmì lásán tàbí ṣàlàyé rẹ̀ kọjá ohun tí ọ̀rọ̀ náà sọ.
- issue: Ìtumọ̀ ‘ti ẹ̀mí’ fún πνευματικός
  choice: A fi ‘ti ẹ̀mí’ sílẹ̀ gẹ́gẹ́ bí àpèjúwe Pọ́ọ̀lù fún ìpèsè tí Ọlọ́run fúnni, tí ó sì ní ìjẹ́pàtàkì ti ẹ̀kọ́ ìgbàgbọ́ àti ti àpẹẹrẹ.
  alternative: ‘Àmì,’ ‘tí ó ju ti ẹ̀dá lọ,’ tàbí ‘iṣẹ́ ìyanu.’
  rationale: πνευματικός ní ìwọ̀n ìtumọ̀ tó gbòòrò ju ọ̀kọ̀ọ̀kan àwọn àlàyé wọ̀nyí lọ; pípa ‘ti ẹ̀mí’ mọ́ kò dín ìtumọ̀ rẹ̀ kù.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ohun mímu ti ẹ̀mí’ àti ‘àpáta ti ẹ̀mí’ pa ìṣọ̀kan ọ̀rọ̀ Pọ́ọ̀lù mọ́; ‘ń mu’ àti ‘tí ń tọ̀’ sì fi abala ìṣe tí ó ń bá a lọ hàn.
