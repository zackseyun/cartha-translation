source:
  edition: SBLGNT
  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: yo
  text: Nítorí ilẹ̀ ayé àti gbogbo ohun tí ó wà nínú rẹ̀ jẹ́ ti Olúwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A yọ ọ́ láti Sáàmù 24:1. Ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀ ìpilẹ̀ jù, a lè tú apá ìkẹyìn náà sí “àti ìkún rẹ̀.”
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: ti Olúwa ni
  rationale: Ìhun gẹnitífù náà ń fi ìní hàn. “Ti Olúwa ni ilẹ̀ ayé” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ilẹ̀ ayé jẹ́ ti Olúwa, ó sì pa agbára ọ̀rọ̀ àyọlò Sáàmù mọ́.
- source_word: γάρ
  choice: Nítorí
  rationale: Ọ̀rọ̀ náà ń mú ẹ̀rí Ìwé Mímọ́ wá gẹ́gẹ́ bí ìdí fún ohun tí a sọ ṣáájú.
- source_word: γῆ
  choice: ilẹ̀ ayé
  rationale: Nínú àyọlò Sáàmù yìí, ọ̀rọ̀ náà tọ́ka sí gbogbo ayé, kì í ṣe ilẹ̀ agbègbè kan nìkan.
- source_word: πλήρωμα
  choice: gbogbo ohun tí ó kún inú rẹ̀
  rationale: Èyí sọ ìtumọ̀ ohun gbogbo tí ó wà nínú ayé ní Yorùbá tí ó ṣe kedere, nígbà tí ó ṣì pa àwòrán ohun tí ó kún ayé mọ́.
- source_word: αὐτῆς
  choice: inú rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka padà sí ilẹ̀ ayé; “inú rẹ̀” bá ìhun ọ̀rọ̀ Yorùbá mu ní ti ohun tí ó kún ayé.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ κύριος nínú àyọlò Ìwé Mímọ́ tí ó ní ìwọ̀n ẹ̀kọ́ nípa Ọlọ́run
  choice: Olúwa
  alternative: OLÚWA
  rationale: Pọ́ọ̀lù lo κύριος nínú èdè Gíríìkì. “Olúwa” pa ìtumọ̀ yẹn àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Sáàmù 24:1 mọ́ láìfi àṣà lẹ́tà ńlá tí a sábà lò fún YHWH nínú Hébérù kún ọ̀rọ̀ Gíríìkì náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkókò yìí tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. Ìhun “ti Olúwa ni ilẹ̀ ayé” jẹ́ ti Yorùbá àdánidá, ó sì pa ìtẹnumọ́ ìní inú ọ̀rọ̀ Gíríìkì mọ́.
