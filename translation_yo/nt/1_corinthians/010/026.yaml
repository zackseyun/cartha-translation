  source_fidelity: Ìtumọ̀ náà fi γάρ, ìní Olúwa lórí ilẹ̀ ayé, àti ohun tí ó kún inú rẹ̀ hàn dáadáa. Àmọ́ ìtòlẹ́sẹẹsẹ “ti Olúwa ni ilẹ̀ ayé” kì í ṣe èyí tí ó rọrùn jù lọ nínú Yorùbá òde òní; fífi kókó ọ̀rọ̀ náà síwájú ń jẹ́ kí ìní náà hàn kedere láìyí ìtumọ̀ padà.
  naturalness: “Ilẹ̀ ayé àti gbogbo ohun tí ó wà nínú rẹ̀ jẹ́ ti Olúwa” jẹ́ ìhun Yorùbá tó rọrùn, tó ní iyì, tí ó sì bójú mu fún àyọlò Sáàmù. “Gbogbo ohun tí ó wà nínú rẹ̀” jẹ́ ọ̀nà àdánidá láti sọ τὸ πλήρωμα αὐτῆς nínú àyíká yìí.
  terminology: “Olúwa” jẹ́ ìtumọ̀ tó yẹ fún κυρίου níbí. “Ilẹ̀ ayé” yẹ fún γῆ nínú àyọlò Sáàmù yìí. Àmì àlàyé náà ní “ẹ̀kún rẹ̀,” ṣùgbọ́n “ìkún rẹ̀” ni ìkọ̀wé tó yẹ fún “fullness,” ó sì yẹ kí a tún ọ̀rọ̀ àlàyé náà ṣe kí ó yege.
