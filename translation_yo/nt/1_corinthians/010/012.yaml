  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε ὁ δοκῶν ἑστάναι βλεπέτω μὴ πέσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/012.yaml
  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: yo
  text: Nítorí náà[a], ẹni tí ó rò pé òun dúró, kí ó ṣọ́ra kí ó má bàa ṣubú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nípa bẹ́ẹ̀, ẹnikẹ́ni tí ó rò pé òun dúró, kí ó ṣọ́ra kí ó má bàa ṣubú.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún ὥστε àti ὁ δοκῶν; ó pa ìtumọ̀ ìparí-èrò náà àti ipò dídúró mọ́ láìfi ìtumọ̀ míì kún un.
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó ń fi àbájáde ìkìlọ̀ inú àwọn àpẹẹrẹ tó ṣáájú hàn; ó jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ ìparí èrò náà ní Yorùbá.
- source_word: ὁ δοκῶν
  choice: ẹni tí ó rò
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí ẹnikẹ́ni gẹ́gẹ́ bí aṣojú; ‘ẹni tí ó rò’ pa ìtumọ̀ ìrònú ẹni náà mọ́ láìfi ìdánilójú kún un.
- source_word: ἑστάναι
  choice: pé òun dúró
  rationale: Ìṣe àṣepé náà tọ́ka sí ipò dídúró tí ó ti wà; ‘pé òun dúró’ jẹ́ èdè Yorùbá àdánidá, kò sì fi ‘dúró ṣinṣin’ tí kò ṣe kedere nínú Gíríìkì kún un.
- source_word: βλεπέτω
  choice: kí ó ṣọ́ra
  rationale: Àṣẹ àsìkò ìsinsìnyí ń béèrè fún ìṣọ́ra tí ń bá a lọ; ‘kí ó ṣọ́ra’ jẹ́ ìkìlọ̀ tó ṣe kedere, tó sì wọ́pọ̀ ní Yorùbá òde òní.
- source_word: μὴ πέσῃ
  choice: kí ó má bàa ṣubú
  rationale: μή pẹ̀lú ọ̀rọ̀-ìṣe subjunctive lẹ́yìn àṣẹ ń sọ ète òdì tàbí ìkìlọ̀; ọ̀rọ̀ Yorùbá yìí pa agbára ìkìlọ̀ àti àìsọ pàtó ohun tí ‘ṣubú’ túmọ̀ sí mọ́.
theological_decisions:
- issue: Irú ‘ṣíṣubú’ tí ìkìlọ̀ Paulu ń tọ́ka sí
  choice: A pa ọ̀rọ̀ gbogbogbò ‘ṣubú’ mọ́, láìsọ pé ó túmọ̀ sí yíyapa kúrò nínú ìgbàgbọ́, ṣíṣe ẹ̀ṣẹ̀, tàbí jíjìyà ìdájọ́.
  alternative: ṣubú sínú ẹ̀ṣẹ̀; bọ́ sábẹ́ ìdájọ́; ṣubú kúrò nínú ìgbàgbọ́
  rationale: Àyíká ẹsẹ náà ń kìlọ̀ lòdì sí ìgbẹ́kẹ̀lé ara ẹni nípasẹ̀ àpẹẹrẹ ìkùnà Ísírẹ́lì, ṣùgbọ́n πέσῃ fúnra rẹ̀ kò dín ìtumọ̀ náà sí ọ̀kan nínú àwọn yìí. Fífi ‘ṣubú’ sílẹ̀ pa àìpàdé ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- issue: Ọ̀rọ̀ akọ ẹyọ kan tí a lò gẹ́gẹ́ bí aṣojú
  choice: A lo ‘ẹni’ àti ‘ó/òun,’ èyí tí kò ní àmì akọ tàbí abo ní Yorùbá, fún ẹnì kọ̀ọ̀kan tí ọ̀rọ̀ náà kàn.
  alternative: Lílo gbólóhùn tó sọ akọ ní pàtó
  rationale: Gíríìkì jẹ́ akọ ẹyọ kan ní gírámà, ṣùgbọ́n ó ń ṣiṣẹ́ gẹ́gẹ́ bí aṣojú ẹnikẹ́ni. Yorùbá kò fi akọ tàbí abo hàn nínú ‘ó/òun’; fífi akọ kún un yóò jẹ́ àfikún tí èdè àfojúsùn kò béèrè.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Kí ó ṣọ́ra, kí ó má bàa ṣubú’ pa ohùn ìkìlọ̀ mọ́; ‘òun’ mú kí ó ṣe kedere pé ẹni náà ló ní èrò pé òun dúró.
