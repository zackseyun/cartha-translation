id: 1CO.10.7
reference: 1 Corinthians 10:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: yo
  text: Ẹ má sì di abọ̀rìṣà, bí àwọn kan nínú wọn ti jẹ́; gẹ́gẹ́ bí a ti kọ ọ́ pé, “Àwọn ènìyàn jókòó láti jẹ, láti sì mu, wọ́n sì dìde láti ṣeré[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n sì dìde láti ṣe àríyá.” Àyọlò yìí wá láti Ẹ́kísódù 32:6, níbi tí “ṣeré” náà ti ní í ṣe pẹ̀lú àsè ìbọ̀rìṣà àwọn ọmọ Ísírẹ́lì yí ọmọ màlúù wúrà ká.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Ẹ má sì
  rationale: Ó tẹ̀ síwájú nínú ìkìlọ̀ tí ó wà ní àyíká ọ̀rọ̀ náà; ‘sì’ pa ìsopọ̀ mọ́ láì jẹ́ kí Yorùbá le.
- source_word: εἰδωλολάτραι γίνεσθε
  choice: di abọ̀rìṣà
  rationale: ‘Di’ fi ìtumọ̀ γίνεσθε hàn gẹ́gẹ́ bí ìkìlọ̀ pé kí wọn má ṣe wọ inú irú ìwà bẹ́ẹ̀; ‘abọ̀rìṣà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tó ń sin òrìṣà.
- source_word: καθώς τινες αὐτῶν
  choice: bí àwọn kan nínú wọn ti jẹ́
  rationale: Ó fi ìfiwéra hàn, ó sì tọ́ka sí apá kan lára àwọn ọmọ Ísírẹ́lì nínú ìtàn aginjù.
- source_word: ὥσπερ γέγραπται
  choice: gẹ́gẹ́ bí a ti kọ ọ́ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá adayeba àti ọlọ́lá fún gbólóhùn ìtọ́kasí Ìwé Mímọ́.
- source_word: Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν
  choice: Àwọn ènìyàn jókòó láti jẹ, láti sì mu
  rationale: Ó pa ìtẹ̀lé àti ìtumọ̀ àwọn infinitive méjèèjì mọ́ ní Yorùbá adayeba.
- source_word: ἀνέστησαν
  choice: wọ́n sì dìde
  rationale: Ó fi ìlọsíwájú ìtàn aorist hàn ní ṣókí, ó sì bá ìlò Yorùbá mu.
- source_word: παίζειν
  choice: láti ṣeré
  rationale: ‘Ṣeré’ pa ìtumọ̀ ojú-ọ̀rọ̀ àti ìró àyọlò Ẹ́kísódù mọ́; ìtumọ̀ àsè aláriwo tó ní í ṣe pẹ̀lú ìbọ̀rìṣà wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bí a ṣe yẹ kí a túmọ̀ παίζειν nínú àyọlò Ẹ́kísódù 32:6
  choice: láti ṣeré
  alternative: láti ṣe àríyá aláriwo
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ṣíṣeré, ṣùgbọ́n nínú àyíká yìí ó ṣeé ṣe kí ó tọ́ka sí àríyá tó so mọ́ ìbọ̀rìṣà. Títọ́jú ‘ṣeré’ nínú ọ̀rọ̀ àkọ́kọ́ ń pa àìdánilójú gidi àti àyọlò náà mọ́, nígbà tí àlàyé ìsàlẹ̀ ń ṣí ìtumọ̀ àyíká rẹ̀ payá.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó yé àwọn òǹkàwé òde òní. A lo ‘Ẹ’ fún àṣẹ sí ọ̀pọ̀ ènìyàn, a sì fi àmì ohùn sí ibi tí ó bá yẹ. Àlàyé [a] dúró lẹ́yìn àyọlò náà kí ó má bà a dà bí ẹni pé ó kan ọ̀rọ̀ ‘abọ̀rìṣà’ nìkan.
