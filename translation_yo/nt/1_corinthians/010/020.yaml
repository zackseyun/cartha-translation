id: 1CO.10.20
reference: 1 Corinthians 10:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: yo
  text: Rárá; ṣùgbọ́n ohun tí wọ́n ń rú gẹ́gẹ́ bí ẹbọ, àwọn ẹ̀mí èṣù ni wọ́n ń rú un fún, kì í ṣe fún Ọlọ́run. Èmi kò sì fẹ́ kí ẹ di alábápín pẹ̀lú àwọn ẹ̀mí èṣù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó ń kópa pẹ̀lú àwọn ẹ̀mí èṣù,” tàbí “ẹni tí ó ní ìpín pẹ̀lú àwọn ẹ̀mí èṣù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: Rárá, ṣùgbọ́n
  rationale: 'Ó fi ọ̀nà àtúnṣe tí ọ̀rọ̀ náà gbà nínú àyíká hàn: Pọ́ọ̀lù kọ èrò tí ó lè yọ láti ẹsẹ tó ṣáájú, ó sì ṣàlàyé ohun tí ó túmọ̀ sí.'
- source_word: ἃ θύουσιν
  choice: ohun tí wọ́n fi rú ẹbọ
  rationale: Ó tọ́ka sí àwọn ohun ẹbọ ní gbogbogbò láì fi irú wọn kún ọ̀rọ̀, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: θύουσιν
  choice: wọ́n fi ń rú ẹbọ
  rationale: ‘Rú ẹbọ’ pa ìtumọ̀ ìṣe ìsìn àti fífi ohun kan ṣe ẹbọ mọ́.
- source_word: δαιμονίοις
  choice: fún àwọn ẹ̀mí èṣù
  rationale: Nínú Májẹ̀mú Tuntun, ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹ̀mí búburú, kì í ṣe àwọn òrìṣà kéékèèké tí kò dá sí rere tàbí búburú.
- source_word: καὶ οὐ θεῷ
  choice: kì í ṣe fún Ọlọ́run
  rationale: Ó pa ìyàtọ̀ tó ṣe kedere láàárín àwọn ẹ̀mí èṣù àti Ọlọ́run tòótọ́ mọ́.
- source_word: οὐ θέλω δὲ
  choice: èmi kò sì fẹ́
  rationale: ‘Sì’ mú ìtẹ̀síwájú pẹ̀lú ìyàtọ̀ díẹ̀ tí δέ ní wá sí Yorùbá àdánidá.
- source_word: κοινωνοὺς
  choice: alábápín
  rationale: Ó gbé ìtumọ̀ ẹni tí ó ní ìpín tàbí ìkópa nínú ohun kan jáde, láì dín un kù sí ìbáṣepọ̀ lásán.
- source_word: τῶν δαιμονίων
  choice: pẹ̀lú àwọn ẹ̀mí èṣù
  rationale: Ó sọ genitive náà di ọ̀rọ̀ Yorùbá tó ṣe kedere gẹ́gẹ́ bí ìkópa tàbí àjọṣepọ̀ pẹ̀lú wọn, kì í ṣe jíjẹ́ ohun-ìní wọn.
- source_word: γίνεσθαι
  choice: kí ẹ di
  rationale: ‘Di’ pa èrò wíwọ inú ipò tuntun mọ́, dípò jíjẹ́ nínú ipò náà lásán.
theological_decisions:
- issue: Irú ìsìn tí ẹbọ àwọn abọ̀rìṣà jẹ́
  choice: Àwọn ẹbọ náà ni wọ́n ń rú fún àwọn ẹ̀mí èṣù, kì í ṣe fún Ọlọ́run.
  alternative: Kí a ka ọ̀rọ̀ náà sí àpèjúwe ìtumọ̀ àwùjọ àsè òrìṣà lásán, tàbí kí ‘ẹ̀mí èṣù’ jẹ́ àkàwé fún òrìṣà èké.
  rationale: Ìyàtọ̀ gbangba tí ọ̀rọ̀ Gíríìkì ṣe—‘fún àwọn ẹ̀mí èṣù, kì í ṣe fún Ọlọ́run’—ni a pa mọ́ láì rọ ọ́ tàbí fi àlàyé míràn kún un.
- issue: Agbára κοινωνοὺς τῶν δαιμονίων
  choice: Ìkópa tàbí àjọṣepọ̀ gidi pẹ̀lú àwọn ẹ̀mí èṣù.
  alternative: Ìbáṣepọ̀ àwùjọ pẹ̀lú àwọn abọ̀rìṣà lásán, tàbí fífi ara ẹni fún àwọn ẹ̀mí èṣù ní kíkún.
  rationale: Àyíká ẹsẹ 16–18 ń lo èrò κοινωνία fún ìkópa gidi. ‘Alábápín pẹ̀lú’ pa ìwúwo yẹn mọ́ láì sọ ọ́ di ìfaramọ́ pátápátá ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní iyì, tó sì yé òǹkàwé òde òní ni a lò. ‘Rú ẹbọ’ jẹ́ ọ̀rọ̀ ìsìn tó wọ́pọ̀, ‘alábápín pẹ̀lú’ sì pa ìtumọ̀ ìkópa àti àjọṣepọ̀ mọ́. A fi àmì ohùn sí ibi tí ó bá yẹ.
