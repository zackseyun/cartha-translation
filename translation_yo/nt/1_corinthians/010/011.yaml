  to: Àwọn nǹkan wọ̀nyí sì ṣẹlẹ̀ sí wọn gẹ́gẹ́ bí àpẹẹrẹ[a], ṣùgbọ́n a kọ wọ́n sílẹ̀ fún ìtọ́ni wa[b]—àwa tí àwọn òpin àwọn sáà ayé ti dé bá[c].
