id: 1CO.10.11
reference: 1 Corinthians 10:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: yo
  text: Àwọn nǹkan wọ̀nyí sì ṣẹlẹ̀ sí wọn gẹ́gẹ́ bí àpẹẹrẹ[a], ṣùgbọ́n a kọ wọ́n sílẹ̀ fún ìtọ́ni wa[b]—àwa tí àwọn òpin àwọn sáà ayé ti dé bá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gẹ́gẹ́ bí àwòrán” tàbí “ní ìtumọ̀ àwòrán”; Pọ́ọ̀lù fi àwọn ìṣẹ̀lẹ̀ wọ̀nyí hàn gẹ́gẹ́ bí àpẹẹrẹ tí ó ní ẹ̀kọ́ fún àwọn onígbàgbọ́ tí ó wá lẹ́yìn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “fún ìkìlọ̀ wa” tàbí “fún ìbáwí wa”; ọ̀rọ̀ Gíríìkì náà ní ìtọ́ni tí ń ṣàtúnṣe àti ìkìlọ̀ nínú.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “àwa tí òpin àwọn sáà ayé ti dé bá.” Ọ̀rọ̀ Gíríìkì náà lo ọ̀pọ̀, “àwọn òpin àwọn sáà ayé,” èyí tí ó pa ọ̀nà tí Pọ́ọ̀lù gbà sọ̀rọ̀ nípa ìtàn ìgbàlà mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: gẹ́gẹ́ bí àpẹẹrẹ
  rationale: Ó fi hàn pé àwọn ìṣẹ̀lẹ̀ náà jẹ́ àwòrán tàbí àpẹẹrẹ tí ó ní ẹ̀kọ́ fún àwọn onígbàgbọ́ tí ó wá lẹ́yìn; ọ̀rọ̀ yìí ṣe kedere ju lílo ọ̀rọ̀ ìmọ̀-ẹ̀kọ́ àkànṣe lọ.
- source_word: συνέβαινεν
  choice: ṣẹlẹ̀
  rationale: Ìṣe aláìpé náà tọ́ka sí ohun tí ń ṣẹlẹ̀ ní àkókò àtijọ́; ọ̀rọ̀ Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì bá kókó ọ̀rọ̀ púpọ̀ náà mu.
- source_word: ἐκείνοις
  choice: sí wọn
  rationale: Ó tọ́ka sí àwọn ènìyàn ìran aginjù tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa wọn.
- source_word: ἐγράφη
  choice: a kọ wọ́n sílẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà wà ní ẹyọ, ìtumọ̀ rẹ̀ tọ́ka sí kíkọ àkọsílẹ̀ àwọn ìṣẹ̀lẹ̀ wọ̀nyí; ìṣọ̀kan Yorùbá yìí ṣe kedere, ó sì jẹ́ ti ẹ̀dá.
- source_word: πρὸς νουθεσίαν
  choice: fún ìtọ́ni wa
  rationale: “Ìtọ́ni” lè gba ìkọ́ni tí ń ṣàtúnṣe ènìyàn sínú, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè tẹnumọ́ ìkìlọ̀.
- source_word: εἰς οὓς
  choice: àwa tí ... ti dé bá
  rationale: Ìlànà yìí sọ ní Yorùbá àdánidá pé òtítọ́ nípa àwọn sáà ìkẹyìn ti dé sórí àwọn tí Pọ́ọ̀lù ń sọ̀rọ̀ nípa wọn.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: àwọn òpin àwọn sáà ayé
  rationale: A pa ọ̀pọ̀ nínú “àwọn òpin” àti “àwọn sáà ayé” mọ́, kí a má bàa sọ gbólóhùn Pọ́ọ̀lù di ẹyọ tàbí pinnu ìtumọ̀ rẹ̀ ju bí orísun ṣe ṣe lọ.
- source_word: κατήντηκεν
  choice: ti dé bá
  rationale: Ó fi ìdédé tí ó ti ṣẹlẹ̀ tán ṣùgbọ́n tí ipa rẹ̀ ṣì wà nísinsìnyí hàn, ní ìbámu pẹ̀lú àkókò pípé Gíríìkì.
theological_decisions:
- issue: Gbólóhùn Pọ́ọ̀lù nípa ìtàn ìgbàlà, τὰ τέλη τῶν αἰώνων
  choice: àwọn òpin àwọn sáà ayé ti dé bá
  alternative: òpin àwọn sáà ayé ti dé bá; ìmúṣẹ àwọn sáà ayé ti dé bá
  rationale: A pa ọ̀pọ̀ àti ìfọ̀kànbalẹ̀ ẹ̀kọ́ nípa àwọn sáà ìkẹyìn mọ́, dípò kí a sọ ọ́ di “òpin” kan ṣoṣo tàbí “ìmúṣẹ” tí yóò túmọ̀ rẹ̀ rékọjá ohun tí Gíríìkì sọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá. Èdè náà jẹ́ kedere, ọ̀wọ̀, ó sì yẹ fún òǹkàwé òde òní. “Sáà ayé” pa ìtumọ̀ àwọn àkókò ńlá inú ìtàn mọ́, nígbà tí “àwọn òpin” mọ̀ọ́mọ̀ pa àìṣàjùwe gbólóhùn orísun náà mọ́.
