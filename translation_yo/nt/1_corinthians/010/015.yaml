  yaml_path: translation/nt/1_corinthians/010/015.yaml
  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: yo
  text: Mo ń sọ̀rọ̀ sí yín gẹ́gẹ́ bí àwọn ènìyàn tí ó ní òye[a]; ẹ̀yin fúnra yín, ẹ ṣèdájọ́ ohun tí mo ń sọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí àwọn ọlọ́gbọ́n” tàbí “gẹ́gẹ́ bí àwọn ènìyàn ọlọ́gbọ́n nínú ìṣe.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ẹ ṣèdájọ́ fúnra yín ohun tí mo ń sọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: bí ẹni pé
  rationale: Ó fi ọ̀nà tí Pọ́ọ̀lù gbà ń bá wọn sọ̀rọ̀ hàn—ó ń bá wọn sọ̀rọ̀ gẹ́gẹ́ bí àwọn ẹni tí ó ní òye.
- source_word: φρονίμοις
  choice: olóye
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ẹni tí ó ní ọgbọ́n ìṣe àti agbára láti fi òye ṣe ìdájọ́; ‘olóye’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé, tí kò sì sọ ìyìn náà di ohun tó ga jù.
- source_word: λέγω
  choice: Mo ń bá yín sọ̀rọ̀
  rationale: Ìtumọ̀ yìí mú ìṣe Pọ́ọ̀lù gẹ́gẹ́ bí ẹni tó ń sọ̀rọ̀ sí àwọn olùgbọ́ rẹ̀ jáde ní Yorùbá àdánidá.
- source_word: κρίνατε
  choice: ẹ ṣèdájọ́
  rationale: Ó pa agbára àṣẹ aorist mọ́, ó sì fi ìṣe ṣíṣe àyẹ̀wò àti fífi ìdájọ́ lé ọ̀rọ̀ náà hàn.
- source_word: ὑμεῖς
  choice: ẹ̀yin fúnra yín
  rationale: Arọ́pò-orúkọ tí a sọ ní kedere nínú Gíríìkì ní ìtẹnumọ́; ‘ẹ̀yin fúnra yín’ pa ìtẹnumọ́ yẹn mọ́.
- source_word: ὅ
  choice: ohun tí
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá àdánidá fún arọ́pò-orúkọ ìbátan tí ó jẹ́ àfojúsùn κρίνατε.
- source_word: φημι
  choice: mo sọ
  rationale: Ó pa ìtumọ̀ ‘sọ/jẹ́rìí sí’ mọ́ ní kíkún, láì fi ‘ohun tí mo ní lọ́kàn’ kún un.
theological_decisions:
- issue: Bí Pọ́ọ̀lù ṣe pe àwọn ará Kọ́ríńtì ní φρόνιμοι
  choice: A túmọ̀ ọ́ sí ‘olóye,’ èyí tó pe wọn sí lílo òye láì sọ pé Pọ́ọ̀lù fọwọ́ sí gbogbo ìwà wọn.
  alternative: A lè túmọ̀ ọ́ sí ‘ọlọ́gbọ́n’ tàbí ka ọ̀rọ̀ náà sí ọ̀rọ̀ ẹ̀gàn.
  rationale: Gíríìkì kò fi hàn ní pàtó bóyá ìyìn tààrà ni tàbí ọ̀rọ̀ tí ó ní ìró ẹ̀gàn. Ìtumọ̀ náà pa àìdánilójú yìí mọ́, kò sì fipá mú ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan.
translation_notes:
  register: Yorùbá àgbàdojú-ìwọ̀n, ọlọ́lá, tó sì ṣeé lóye ni a lò. ‘Ẹ̀yin/ẹ’ ni a lò fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí Gíríìkì ṣe jẹ́ plural. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
