id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: yo
  text: Ago ìbùkún tí a ń bùkún—ṣé kì í ṣe ìkópa nínú ẹ̀jẹ̀ Mèsáyà ni? Búrẹ́dì tí a ń fọ́—ṣé kì í ṣe ìkópa nínú ara Mèsáyà ni?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “jíjẹ́ alábápín nínú” tàbí “àjọpín nínú.”
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: Christou; “Mèsáyà” ni a lò níhìn-ín nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè. Ní ìtumọ̀ ìbílẹ̀: “Kristi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ποτήριον
  choice: ife
  rationale: “Ife” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ohun èlò mímu mu láìfi èdè ìjọ ti ìgbà tó tẹ̀ lé e kún ọ̀rọ̀ náà.
- source_word: τῆς εὐλογίας / ὃ εὐλογοῦμεν
  choice: ìbùkún / tí a ń bù kún
  rationale: Ìtumọ̀ yìí pa àtúnṣe ọ̀rọ̀ orúkọ àti ọ̀rọ̀-ìṣe inú Gíríìkì mọ́, kò sì fi “ọpẹ́” nìkan ṣe àlàyé ohun tí ọ̀rọ̀ náà lè túmọ̀ sí.
- source_word: οὐχὶ
  choice: ṣé kì í ṣe ... ni?
  rationale: Èyí jẹ́ ìbéèrè àsọ̀rọ̀ Yorùbá tó ń retí ìdáhùn pé bẹ́ẹ̀ ni, gẹ́gẹ́ bí Gíríìkì.
- source_word: κοινωνία
  choice: ìkópa nínú
  rationale: “Ìkópa nínú” fi ìtumọ̀ pípín tàbí jíjẹ́ alábápín nínú ohun kan hàn, láìsọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
- source_word: τοῦ αἵματος
  choice: ẹ̀jẹ̀
  rationale: Ìtumọ̀ tààrà yìí pa agbára ọ̀rọ̀ nípa ẹbọ àti májẹ̀mú mọ́ láìfi àlàyé míì kún un.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn níhìn-ín; “Mèsáyà” mú oyè náà jáde kedere.
- source_word: ἄρτον
  choice: búrẹ́dì
  rationale: “Búrẹ́dì” ló ṣe kedere jù fún ọ̀pọ̀ àwọn olùka Yorùbá òde òní; “àkàrà” lè mú kí wọ́n ronú nípa àkàrà ẹ̀wà.
- source_word: ὃν κλῶμεν
  choice: tí a ń ṣẹ́
  rationale: Ọ̀rọ̀ yìí fi iṣẹ́ fífọ búrẹ́dì hàn ní èdè Yorùbá adayeba láìfi ìtumọ̀ àṣà míì kún un.
- source_word: τοῦ σώματος
  choice: ara
  rationale: “Ara” jẹ́ ìtumọ̀ tààrà tó pa ìwọ̀n ìtumọ̀ Gíríìkì àti ìṣòro ẹ̀kọ́ ìgbàgbọ́ inú gbólóhùn náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ κοινωνία ní àyíká oúnjẹ Olúwa
  choice: ìkópa nínú
  alternative: ìdàpọ̀ pẹ̀lú; jíjẹ́ alábápín nínú
  rationale: Àṣàyàn yìí jẹ́ kí ìbáṣepọ̀ gidi pẹ̀lú ẹ̀jẹ̀ àti ara Mèsáyà dúró, ṣùgbọ́n kò pinnu bí ìwàníhìn-ín rẹ̀ ṣe rí gẹ́gẹ́ bí ẹ̀kọ́ ẹgbẹ́ ìjọ kan.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ọ̀rọ̀ yìí, oyè ẹni tí a fòróró yàn ṣì lágbára; a fi “Kristi” pamọ́ sínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tó sì ní iyì. A lo “ṣé kì í ṣe ... ni?” láti mú ìbéèrè àsọ̀rọ̀ Gíríìkì wá sí Yorùbá adayeba. A yan “búrẹ́dì” dípò “àkàrà” fún ìtumọ̀ kedere lójú àwọn olùka òde òní, a sì pa ìṣòro ẹ̀kọ́ ìgbàgbọ́ tó wà nínú κοινωνία mọ́.
