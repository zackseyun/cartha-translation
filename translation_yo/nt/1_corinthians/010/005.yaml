source:
  edition: SBLGNT
  text: ἀλλ’ οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός, κατεστρώθησαν γὰρ ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: yo
  text: Síbẹ̀, inú Ọlọ́run kò dùn sí ọ̀pọ̀ jù lọ nínú wọn, nítorí a pa wọ́n lulẹ̀ ní aginjù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ṣubú lulẹ̀”; tàbí, “òkú wọn fọ́n káàkiri ní aginjù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Síbẹ̀
  rationale: Ó fi ìyàtọ̀ líle hàn sí àwọn àǹfààní tí a mẹ́nu kàn ní àwọn ẹsẹ tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: inú Ọlọ́run kò dùn sí ọ̀pọ̀ jù lọ nínú wọn
  rationale: Gbólóhùn yìí tú ìtumọ̀ ìṣọ̀kan εὐδοκέω pẹ̀lú ἐν jáde ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ọ̀pọ̀ jù lọ mọ́.
- source_word: ηὐδόκησεν
  choice: inú ... kò dùn sí
  rationale: Ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún ọ̀rọ̀ mímọ́, láti sọ pé ẹnì kan kò ní ìfẹ́ inú tàbí ìtẹ́lọ́rùn sí ẹlòmíràn.
- source_word: ὁ θεός
  choice: Ọlọ́run
  rationale: Ìtumọ̀ tààrà fún orúkọ olùṣe nínú gbólóhùn náà.
- source_word: κατεστρώθησαν
  choice: a tẹ́ wọn lulẹ̀
  rationale: Ó mú àwòrán ohun tí a ṣubú lulẹ̀ tàbí tí a fi sílẹ̀ sínú ikú jáde, láì fi ẹni tó ṣe iṣẹ́ náà kún ohun tí gíríìkì sọ ní tààrà.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí a fi sọ pé inú Ọlọ́run kò dùn sí wọn.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ní aginjù
  rationale: ‘Aginjù’ jẹ́ ọ̀rọ̀ Yorùbá tó bá àyíká ìrìn-àjò Ísírẹ́lì ní ẹkùn aṣálẹ̀ mu.
theological_decisions:
- issue: Irú ìdájọ́ tí κατεστρώθησαν ń tọ́ka sí
  choice: A tẹ́ wọn lulẹ̀ ní aginjù, èyí tó tọ́ka sí ikú wọn lábẹ́ ìdájọ́ Ọlọ́run ní àyíká ọ̀rọ̀ náà.
  alternative: A ṣubú wọn lulẹ̀ tàbí òkú wọn fọ́n káàkiri ní aginjù.
  rationale: Àyíká 1 Kọ́ríńtì 10 jẹ́ ìkìlọ̀ nípa ìkùnà Ísírẹ́lì àti àbájáde rẹ̀. ‘A tẹ́ wọn lulẹ̀’ pa agbára ìkìlọ̀ náà mọ́, ṣùgbọ́n kò sọ ní tààrà pé Ọlọ́run ni olùṣe nínú gbólóhùn kejì, níwọ̀n bí ọ̀rọ̀ gíríìkì ṣe jẹ́ àìṣe-lójú-ẹni.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye ni a lò. A pa àìṣe-lójú-ẹni inú κατεστρώθησαν mọ́, a sì fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu.
