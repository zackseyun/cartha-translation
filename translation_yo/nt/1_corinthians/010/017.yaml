id: 1CO.10.17
reference: 1 Corinthians 10:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: yo
  text: Nítorí pé búrẹ́dì kan ṣoṣo ni ó wà[a], àwa tí a pọ̀ jẹ́ ara kan, nítorí gbogbo wa ní ìpín nínú búrẹ́dì kan ṣoṣo náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “odindi búrẹ́dì kan,” níbi méjèèjì tí “búrẹ́dì kan ṣoṣo” ti fara hàn nínú ẹsẹ yìí. Ọ̀rọ̀ Gíríìkì náà, ἄρτος, lè túmọ̀ sí búrẹ́dì tàbí odindi búrẹ́dì kan; “odindi búrẹ́dì kan” lè mú àwòrán ọ̀pọ̀ ènìyàn tí wọ́n ń pín nínú ohun kan ṣoṣo hàn kedere sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí pé
  rationale: Ó fi ìdí tí ọ̀rọ̀ tó ṣáájú fi rí bẹ́ẹ̀ hàn, ó sì sọ ìtumọ̀ ìdí náà ní Yorùbá òde òní lọ́nà tó ṣe kedere.
- source_word: εἷς ἄρτος
  choice: búrẹ́dì kan ṣoṣo
  rationale: “Búrẹ́dì” pa ìtumọ̀ oúnjẹ náà mọ́, “kan ṣoṣo” sì tẹnumọ́ ẹyọ kan náà. Nítorí ἄρτος tún lè tọ́ka sí odindi ìṣù búrẹ́dì kan, a pa àṣàyàn yẹn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἓν σῶμα
  choice: ara kan
  rationale: Ó pa àwòrán Páùlù nípa ọ̀pọ̀ ènìyàn tí wọ́n jẹ́ ara kan mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: οἱ πολλοί ἐσμεν
  choice: àwa tí a pọ̀ jẹ́
  rationale: Ó mú ìyàtọ̀ tó wà láàárín ọ̀pọ̀ ènìyàn àti ara kan jáde ní Yorùbá àdánidá.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó ṣe àmì àlàyé tó fi ìdí gbólóhùn àkọ́kọ́ múlẹ̀.
- source_word: πάντες
  choice: gbogbo wa
  rationale: Ó tẹnumọ́ pé gbogbo ẹgbẹ́ náà lápapọ̀ ló ń kópa.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: nínú búrẹ́dì kan náà
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe μετέχομεν, gbólóhùn yìí fi orísun tàbí ohun tí gbogbo wọn jọ ń pín hàn. “Kan náà” jẹ́ kó ṣe kedere pé búrẹ́dì kan náà ni gbogbo wọn ní ìpín nínú rẹ̀.
- source_word: μετέχομεν
  choice: a ní ìpín nínú
  rationale: Ó sọ ìkópa àti pípín ohun kan papọ̀, kì í ṣe jíjẹ lásán, ó sì bá àyíká Oúnjẹ Alẹ́ Olúwa mu.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín búrẹ́dì kan náà àti ara kan
  choice: 'A pa ìsopọ̀ tí Páùlù ṣe mọ́: àwọn onígbàgbọ́ tí wọ́n pọ̀ jẹ́ ara kan nítorí gbogbo wọn ní ìpín nínú búrẹ́dì kan náà.'
  alternative: A lè túmọ̀ ọ́ ní ọ̀nà tó tẹnumọ́ àmì ìṣọ̀kan nìkan, tàbí ní ọ̀nà tó sọ pé ìkópa nínú búrẹ́dì náà fúnra rẹ̀ ló ń mú ìṣọ̀kan náà ṣẹ.
  rationale: Gíríìkì so búrẹ́dì kan àti ara kan pọ̀ ṣinṣin, ṣùgbọ́n kò yanju gbogbo àríyànjiyàn ẹ̀kọ́ ìsìn tó wáyé lẹ́yìn náà nípa irú ìbáṣepọ̀ yẹn. Ìtumọ̀ náà pa ìdọ̀tí ẹ̀kọ́ ìsìn kúrò, ó sì fi ìforígbárí ìtumọ̀ inú ẹsẹ náà sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn níbi tó yẹ ni a lò. Èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì yẹ fún kíkà ní gbangba. “A ní ìpín nínú” pa ìtumọ̀ ìkópa mọ́ láìdi ọ̀rọ̀ náà mọ́ jíjẹ lásán tàbí ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
