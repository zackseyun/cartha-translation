id: 1CO.10.33
reference: 1 Corinthians 10:33
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: yo
  text: Gẹ́gẹ́ bí èmi náà ti ń tẹ́ gbogbo ènìyàn lọ́rùn nínú ohun gbogbo[a], láì wá àǹfààní ara mi, bí kò ṣe àǹfààní ọ̀pọ̀ ènìyàn[b], kí wọ́n lè rí ìgbàlà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun gbogbo fún gbogbo ènìyàn.” Ní ti gidi, Gíríìkì sọ pé “gbogbo ènìyàn nínú ohun gbogbo,” èyí tó fi hàn pé ó ń fara mọ́ àwọn ẹlòmíràn ní ọ̀nà gbígbòòrò nítorí ire wọn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ohun tó ṣe mí láǹfààní ... ohun tó ṣe ọ̀pọ̀ ènìyàn láǹfààní.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: gẹ́gẹ́ bí èmi náà
  rationale: Ó pa agbára ìfiwéra καθὼς mọ́, ó sì fi κἀγὼ hàn gẹ́gẹ́ bí ‘èmi náà,’ níbi tí Pọ́ọ̀lù ti fi ara rẹ̀ ṣe àpẹẹrẹ.
- source_word: πάντα πᾶσιν
  choice: gbogbo ènìyàn ... nínú ohun gbogbo
  rationale: Ìtumọ̀ yìí tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì, ó sì fi bí Pọ́ọ̀lù ṣe ń fara mọ́ àwọn ẹlòmíràn ní ọ̀nà gbígbòòrò hàn láìdà á pọ̀ mọ́ gbólóhùn mìíràn ní 9:22.
- source_word: ἀρέσκω
  choice: ń tẹ́ ... lọ́rùn
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún ‘mú inú ẹni dùn/ṣe ohun tí ó tẹ́ ẹni lọ́rùn’; àwọn ọ̀rọ̀ tó tẹ̀ lé e ṣàlàyé pé ire wọn ni Pọ́ọ̀lù ń wá, kì í ṣe ìyìn ènìyàn.
- source_word: μὴ ζητῶν
  choice: láìwá
  rationale: Ó sọ ìṣe tó ń bá ọ̀rọ̀ àkọ́kọ́ lọ àti ète rẹ̀ ní ṣókí, ní èdè Yorùbá tó rọrùn.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: àǹfààní ara mi
  rationale: σύμφορον túmọ̀ sí ohun tó ṣàǹfààní tàbí tó ṣe ẹni lóore; ‘àǹfààní ara mi’ pa ìyàtọ̀ tó wà láàárín ire ara ẹni àti ire àwọn ẹlòmíràn mọ́.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: bí kò ṣe àǹfààní ọ̀pọ̀ ènìyàn
  rationale: A mú ọ̀rọ̀ tí Gíríìkì fi sílẹ̀ nítorí àkótán padà sínú Yorùbá kí ìtumọ̀ lè ṣe kedere, a sì pa ‘ọ̀pọ̀ ènìyàn’ mọ́ dípò yíyí i sí ‘àwọn ẹlòmíràn.’
- source_word: ἵνα σωθῶσιν
  choice: kí wọ́n lè rí ìgbàlà
  rationale: ‘Kí ... lè’ fi ète ἵνα hàn. ‘Rí ìgbàlà’ jẹ́ ọ̀nà Yorùbá àdánidá tó pa ìtumọ̀ ìgbàlà ti σῴζω mọ́ láìsọ ẹni tó ń gbani là ní pàtó.
theological_decisions:
- issue: Ìwọ̀n àti ìtumọ̀ σωθῶσιν
  choice: kí wọ́n lè rí ìgbàlà
  alternative: kí wọ́n lè rí ìrànlọ́wọ́; kí a lè dá wọn sí
  rationale: Nínú àyíká ìhìnrere yìí àti bí Pọ́ọ̀lù ṣe máa ń lo σῴζω, ọ̀rọ̀ náà ń tọ́ka sí ìgbàlà ní ìtumọ̀ ẹ̀mí àti ti ọjọ́ ìkẹyìn, kì í ṣe ìrànlọ́wọ́ lasán. Ìtumọ̀ náà kò sọ aṣojú ìgbàlà ní pàtó ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- issue: Ìtumọ̀ bí Pọ́ọ̀lù ṣe ń ‘tẹ́ gbogbo ènìyàn lọ́rùn’
  choice: fífi ara mọ́ àwọn ẹlòmíràn nítorí ire àti ìgbàlà wọn
  alternative: wíwá ìtẹ́wọ́gbà ènìyàn tàbí ṣíṣe àdéhùn tó tako òtítọ́
  rationale: Gbólóhùn tó tẹ̀ lé e—pé kì í wá àǹfààní ara rẹ̀ bí kò ṣe ti ọ̀pọ̀ ènìyàn—ló ń darí ìtumọ̀ ἀρέσκω. A pa ìtumọ̀ ọ̀rọ̀ náà mọ́, ṣùgbọ́n àyíká rẹ̀ kò jẹ́ kí ó túmọ̀ sí fífi òtítọ́ sílẹ̀ láti wu ènìyàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tó ní iyì ni a lò. A lo àmì ohùn níbi tó yẹ, a sì yan gbólóhùn tó ṣe kedere fún òǹkàwé lásán láìsọ ìṣòro ẹ̀kọ́ ìgbàgbọ́ di ohun tó rọrùn ju bí orísun ṣe gbé e kalẹ̀ lọ.
