id: 1CO.10.25
reference: 1 Corinthians 10:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: yo
  text: Ẹ máa jẹ ohunkóhun tí wọ́n bá ń tà ní ọjà ẹran, láìṣe ìwádìí kankan[a] nítorí ẹ̀rí-ọkàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìbéèrè ìbéèrè kankan” tàbí “láìṣàyẹ̀wò ohunkóhun”; ìtumọ̀ rẹ̀ ni pé kí wọn má ṣe wádìí ibi tí ẹran náà ti wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: ohunkóhun tí wọ́n bá ń tà
  rationale: Gbólóhùn yìí mú agbára ìtumọ̀ ‘gbogbo ohun/ohunkóhun tí a ń tà’ jáde ní Yorùbá àdánidá, nígbà tí ‘bá’ fi hàn pé kò sí irú ẹran kan tí ọ̀rọ̀ náà yọ sílẹ̀.
- source_word: ἐν μακέλλῳ
  choice: ní ọjà ẹran
  rationale: μάκελλον ń tọ́ka sí ibi tí a ti ń ta ẹran ní pàtó, kì í ṣe ọjà lásán; ‘ọjà ẹran’ ṣe àfihàn ibi náà ní kedere.
- source_word: ἐσθίετε
  choice: Ẹ máa jẹ
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn. ‘Ẹ máa jẹ’ jẹ́ àṣẹ Yorùbá àdánidá, ó sì lè gbé ìrísí ìṣe tí ń lọ tàbí àṣà tí àkókò-ìsinsìnyí Gíríìkì ní.
- source_word: μηδὲν ἀνακρίνοντες
  choice: láìṣe ìwádìí kankan
  rationale: ἀνακρίνω lè túmọ̀ sí ṣàyẹ̀wò, wádìí, tàbí béèrè ìbéèrè. Nínú àyíká yìí, gbólóhùn náà sọ pé kí wọn má ṣe wádìí ibi tí ẹran náà ti wá; ‘láìṣe ìwádìí kankan’ pa ìtumọ̀ náà mọ́ láìfi kún un.
- source_word: διὰ τὴν συνείδησιν
  choice: nítorí ẹ̀rí-ọkàn
  rationale: διά pẹ̀lú accusative ń sọ ìdí tàbí ohun tí a gbájú mọ́. ‘Nítorí ẹ̀rí-ọkàn’ jẹ́ Yorùbá tó ṣe kedere, kò sì sọ ẹni tí ẹ̀rí-ọkàn náà jẹ́ nígbà tí Gíríìkì kò sọ ọ́ ní ẹsẹ yìí.
theological_decisions:
- issue: Ẹni tí ‘ẹ̀rí-ọkàn’ tọ́ka sí
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ‘ẹ̀rí-ọkàn,’ láìsọ pé ó jẹ́ ti ẹni tó ń jẹun tàbí ti ẹlòmíràn.
  alternative: ‘ẹ̀rí-ọkàn yín’ tàbí ‘ẹ̀rí-ọkàn ẹlòmíràn’
  rationale: Ọ̀rọ̀ Gíríìkì ní ẹsẹ yìí kàn sọ ‘ẹ̀rí-ọkàn’ pẹ̀lú article; kò dá ẹni tó ni í mọ̀. Ìtumọ̀ náà pa àìdánilójú yìí mọ́ kí àyíká ọ̀rọ̀ tó tẹ̀ lé lè ṣàlàyé rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘Ẹ máa jẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn, ‘ọjà ẹran’ fún ibi pàtó náà, àti ‘ẹ̀rí-ọkàn’ láìfi ẹni tó ni í kún ọ̀rọ̀ Gíríìkì.
