id: 1CO.10.6
reference: 1 Corinthians 10:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: yo
  text: Àwọn nǹkan wọ̀nyí sì di àpẹẹrẹ fún wa[a], kí àwa má bàa jẹ́ àwọn tí ń fẹ́ àwọn ohun búburú, gẹ́gẹ́ bí àwọn wọ̀nyẹn náà ti fẹ́ wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwòṣe fún wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ tí ó ń tọ́ka sí àwọn ìṣẹ̀lẹ̀ inú aginjù tí a ṣẹ̀ṣẹ̀ sọ; yíyan ‘àwọn nǹkan wọ̀nyí’ kò fi ìtumọ̀ àfikún sí i.
- source_word: δὲ
  choice: sì
  rationale: ‘Sì’ jẹ́ àmì ìtẹ̀síwájú tàbí ìyípadà ọ̀rọ̀ tó bá ìṣàn Yorùbá mu, láì sọ ọ́ di àtakò líle.
- source_word: τύποι
  choice: àpẹẹrẹ
  rationale: Nínú ọ̀rọ̀ ìkìlọ̀ yìí, ‘àpẹẹrẹ’ mú agbára ìtọ́nisọ́nà àti ìkìlọ̀ τύποι jáde ní èdè Yorùbá tí ó ṣe kedere; àlàyé ìsàlẹ̀ fi ‘àwòrán’ àti ‘ìlànà’ hàn gẹ́gẹ́ bí àṣàyàn.
- source_word: ἡμῶν
  choice: fún wa
  rationale: Pípè wọ́n ní ‘àpẹẹrẹ fún wa’ ni ìtumọ̀ genitive náà tó bójú mu jù lọ ní Yorùbá.
- source_word: ἐγενήθησαν
  choice: di
  rationale: ‘Di’ pa ìtumọ̀ wíwá sí ipò tàbí iṣẹ́ kan mọ́, dípò kí a sọ pé wọ́n kàn ‘jẹ́’ àpẹẹrẹ.
- source_word: εἰς τὸ μὴ εἶναι
  choice: kí àwa má bàa jẹ́
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ète tàbí àbájáde ìkìlọ̀ hàn, ó sì pa εἶναι mọ́.
- source_word: ἐπιθυμητὰς
  choice: ẹni tí ń fẹ́
  rationale: Ọ̀rọ̀-orúkọ náà túmọ̀ sí ẹni tí ó ń fẹ́ tàbí ń ṣe ojúkòkòrò ohun kan; yíyan yìí kò fi ìfẹ́ ìbálòpọ̀ tí kò sí nínú àyíká kún un.
- source_word: κακῶν
  choice: àwọn ohun búburú
  rationale: Ó fi àwọn ohun tí wọ́n fẹ́ hàn ní kedere, ó sì pa ìwúlò ọ̀pọ̀ àti agbára ìwà búburú mọ́.
- source_word: καθὼς κἀκεῖνοι
  choice: gẹ́gẹ́ bí àwọn náà
  rationale: ‘Gẹ́gẹ́ bí’ fi ìfiwéra hàn, ‘àwọn náà’ sì pa agbára καί inú κἀκεῖνοι mọ́.
- source_word: ἐπεθύμησαν
  choice: ti fẹ́ wọn
  rationale: ‘Fẹ́’ tún ọ̀rọ̀ kan náà tí a lò fún ἐπιθυμητάς ṣe, ‘wọn’ sì tọ́ka padà sí àwọn ohun búburú fún ìmúlérí.
theological_decisions:
- issue: Ìtumọ̀ τύποι nípa ìrírí Ísírẹ́lì nínú aginjù
  choice: àpẹẹrẹ
  alternative: àwòrán; ìlànà
  rationale: Àyíká náà tẹnumọ́ ìkìlọ̀ ìwà fún ìjọ, kì í ṣe dandan ọ̀rọ̀ ẹ̀kọ́ ‘type’ ní ìtumọ̀ imọ̀-ẹ̀sìn tó dín. Àlàyé ìsàlẹ̀ pa ìtumọ̀ gbòòrò rẹ̀ mọ́.
- issue: Agbára ọ̀rọ̀ ἐπιθυμητάς/ἐπεθύμησαν
  choice: ẹni tí ń fẹ́ … ti fẹ́
  alternative: ẹni tí ń ṣe ojúkòkòrò … ṣe ojúkòkòrò
  rationale: ‘Fẹ́’ pa ìtumọ̀ ìfẹ́ búburú tó gbòòrò mọ́ láì sọ ọ́ di ìfẹ́ ìbálòpọ̀ nìkan; ‘àwọn ohun búburú’ ló mú ìdájọ́ ìwà rẹ̀ hàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘sì’ fún δέ nítorí pé Yorùbá sábà máa ń fi í ṣe àsopọ̀ ìtẹ̀síwájú; a kò fi ‘nísinsìnyí’ kún un. Gbólóhùn ‘kí àwa má bàa jẹ́ ẹni tí ń fẹ́’ mọ̀ọ́mọ̀ pa àkópọ̀ εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητάς mọ́.
