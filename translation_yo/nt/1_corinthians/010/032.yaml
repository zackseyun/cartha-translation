id: 1CO.10.32
reference: 1 Corinthians 10:32
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: yo
  text: Ẹ má ṣe jẹ́ ohun ìkọ̀sẹ̀[a] fún àwọn Júù, tàbí fún àwọn Gíríìkì[b], tàbí fún ìjọ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ má ṣe fa ohun ìbínú,” tàbí, “Ẹ jẹ́ aláìfa ìkọ̀sẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “àwọn Gíríìkì” níhìn-ín tọ́ka ní gbogbogbòò sí àwọn tí kì í ṣe Júù ní àyíká Pọ́ọ̀lù; ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà sọ ní pàtó pé “àwọn Gíríìkì.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: má ṣe jẹ́ ohun ìkọ̀sẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí jíjẹ́ ẹni tí kò fa ìkọ̀sẹ̀ tàbí ohun ìbínú tí yóò dí ẹlòmíràn lọ́nà. Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán ìkọ̀sẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: γίνεσθε
  choice: Ẹ má ṣe jẹ́
  rationale: Àṣẹ ìsinsìnyí ni; ìtumọ̀ yìí fi hàn pé ìwà tí wọ́n gbọ́dọ̀ máa tẹ̀ síwájú nínú rẹ̀ ni, láìfi dandan túmọ̀ ọ́ sí ìyípadà ẹ̀ẹ̀kan ṣoṣo.
- source_word: Ἰουδαίοις
  choice: àwọn Júù
  rationale: Ó ń tọ́ka sí àwọn Júù gẹ́gẹ́ bí ẹgbẹ́ ẹ̀yà àti ẹ̀sìn, kì í ṣe àwọn olùgbé ilẹ̀ Jùdíà nìkan.
- source_word: Ἕλλησιν
  choice: àwọn Gíríìkì
  rationale: Èyí ni ìtumọ̀ tààrà ọ̀rọ̀ Gíríìkì náà. Ní àyíká ọ̀rọ̀ Pọ́ọ̀lù, ó lè dúró fún àwọn tí kì í ṣe Júù ní gbogbogbòò; àlàyé yẹn wà nínú àkọsílẹ̀ ìsàlẹ̀ dípò kí a fi ‘Kèfèrí’ rọ́pò ọ̀rọ̀ inú ẹsẹ náà.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: ìjọ Ọlọ́run
  rationale: ‘Ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tí ó fìdí múlẹ̀ fún àwùjọ àwọn onígbàgbọ́, ‘Ọlọ́run’ sì pa ìbáṣepọ̀ oníhun inú τοῦ θεοῦ mọ́.
theological_decisions:
- issue: Pípín àwọn tí àṣẹ ìwà rere Pọ́ọ̀lù kan sí ẹgbẹ́
  choice: 'A pa àwọn ẹgbẹ́ mẹ́tẹ̀ẹ̀ta tí ẹsẹ náà dárúkọ mọ́: àwọn Júù, àwọn Gíríìkì, àti ìjọ Ọlọ́run.'
  alternative: A lè ka ‘àwọn Gíríìkì’ sí gbogbo àwọn tí kì í ṣe Júù, tàbí ka àṣẹ náà ní pàtàkì gẹ́gẹ́ bí ọgbọ́n iṣẹ́ ìhìnrere.
  rationale: Ẹsẹ náà fúnra rẹ̀ dárúkọ ẹgbẹ́ mẹ́tẹ̀ẹ̀ta. Ìtumọ̀ náà kò fẹ̀ wọ́n sí i, bẹ́ẹ̀ ni kò dín wọn kù, kò sì pinnu bóyá àṣẹ náà jẹ́ ọgbọ́n iṣẹ́ ìhìnrere nìkan tàbí ìlànà ìwà rere tó gbòòrò.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé lásán ni a lò. ‘Ohun ìkọ̀sẹ̀’ pa àwòrán orísun náà mọ́, nígbà tí àtúnsọ àṣẹ òdì ‘Ẹ má ṣe jẹ́’ mú kí gbólóhùn náà ṣàn lọ́nà àdánidá ní Yorùbá.
