  text: καὶ πάντες εἰς τὸν Μωϋσῆν ⸀ἐβαπτίσαντο ἐν τῇ νεφέλῃ καὶ ἐν τῇ θαλάσσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/002.yaml
  text: and all were baptized into Moses in the cloud and in the sea[b][a],
translation:
  language: yo
  text: Gbogbo wọn sì ni a batisí sínú Mósè nínú àwọsánmà àti nínú òkun.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a dá wọn pọ̀ mọ́ Mósè,” tàbí “wọ inú ìfẹ́sí sí Mósè.” Ní ti gidi, èdè Gíríìkì sọ pé “sínú Mósè,” èyí tí ó pa ìbámu àpẹẹrẹ Pọ́ọ̀lù pẹ̀lú batisí mọ́.
    reason: alternative_reading
  - marker: b
    text: Pọ́ọ̀lù sọ pé “nínú òkun,” kì í ṣe “gba inú òkun kọjá”; èyí pa ìbámu pẹ̀lú “nínú àwọsánmà” mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó tọ́ka sí gbogbo àwọn ọmọ Ísírẹ́lì tí àyíká ọ̀rọ̀ ń sọ̀rọ̀ nípa wọn, ó sì pa ìtẹnumọ́ Pọ́ọ̀lù mọ́.
- source_word: εἰς τὸν Μωϋσῆν
  choice: sínú Mósè
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ Gíríìkì aláìgbọ́dọ̀rọ̀ ‘sínú Mósè’ àti ìbámu àpẹẹrẹ rẹ̀ pẹ̀lú batisí mọ́, láìfi ìtumọ̀ ẹ̀kọ́ kan ṣoṣo lé e lórí.
- source_word: ἐβαπτίσαντο
  choice: ni a batisí
  rationale: Fọ́ọ̀mù àárín aorist náà dára jù láti sọ ní Yorùbá gẹ́gẹ́ bí ohun tí a ṣe fún wọn; ‘batisí’ pa ìlò àpẹẹrẹ Pọ́ọ̀lù mọ́ láìdín un kù sí rírì sínú omi.
- source_word: ἐν τῇ νεφέλῃ
  choice: nínú ìkùukùu
  rationale: Ó pa ἐν mọ́ gẹ́gẹ́ bí ‘nínú,’ ó sì jẹ́ kí àìdánilójú tó lè wà láàárín àyè, ọ̀nà, tàbí ìbáṣepọ̀ dúró.
- source_word: ἐν τῇ θαλάσσῃ
  choice: nínú òkun
  rationale: Pọ́ọ̀lù lo ἐν, kì í ṣe διά; ‘nínú òkun’ tún pa ìbámu pẹ̀lú ‘nínú ìkùukùu’ mọ́.
theological_decisions:
- issue: Ìtumọ̀ jíjẹ́ tí a batisí sínú Mósè
  choice: Pa èdè àpẹẹrẹ àti aṣojú náà mọ́ láìṣe àlàyé rẹ̀ sínú ẹ̀kọ́ kan ṣoṣo.
  alternative: ‘di ẹni tí a dá mọ̀ mọ́ Mósè’ tàbí ‘wọ inú ìgbọràn sí Mósè’
  rationale: Pọ́ọ̀lù ń fi ìrírí ìjádelọ àwọn ọmọ Ísírẹ́lì wé batisí Kristẹni; ‘sínú Mósè’ pa ìfaramọ́ àti ìnira ẹ̀kọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ adayeba, ọ̀wọ̀, ó sì pa àtẹ̀jáde gígùn àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́. Orúkọ Μωϋσῆν ni a kọ sí ‘Mósè,’ bí ó ṣe wọ́pọ̀ nínú Yorùbá.
