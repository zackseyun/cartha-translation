  source_fidelity: Ìtumọ̀ náà pa ìtúmọ̀ pàtàkì ti οὐ δύνασθε, ποτήριον, κυρίου, δαιμονίων, τραπέζης, àti ìfarahàn ìbámu-ṣùgbọ́n-kò-le-wà pọ̀ nínú àwọn gbólóhùn méjì náà mọ́. Síbẹ̀, ‘ṣe alábápín nínú’ kì í ṣe ọ̀nà Yorùbá tó dára jù láti tú μετέχειν; ‘ní ìpín nínú’ jẹ́ tààrà sí i, ó sì ń sọ ìkópa gidi.
  naturalness: ‘Ẹ kò lè’ àti ìlò ‘sì’ jẹ́ Yorùbá boṣewa tó dára. Àtúnṣe sí ‘ní ìpín nínú’ mú ìpín kejì rọrùn àti adayeba sí i. A tún gbe àmì àlàyé sí ọ̀rọ̀ tí àlàyé náà kan, dípò sí òpin ẹsẹ.
