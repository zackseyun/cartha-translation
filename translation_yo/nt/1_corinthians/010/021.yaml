  to: Ẹ kò lè mu ago Olúwa àti ago àwọn ẹ̀mí èṣù; ẹ kò sì lè ní ìpín[a] nínú tábìlì Olúwa àti nínú tábìlì àwọn ẹ̀mí èṣù.
  rationale: A rọ́pò ìsopọ̀ ọ̀rọ̀ tí kò dára gan-an, ‘ṣe alábápín nínú,’ pẹ̀lú ‘ní ìpín nínú,’ láti pa ìtumọ̀ μετέχειν mọ́ ní Yorùbá adayeba. A fi ‘nínú’ hàn níwájú tábìlì kejì fún ìbámu gbólóhùn, a sì gbe àmì akọsilẹ̀ sí ọ̀rọ̀ tí ó ń ṣàlàyé. Àwọn àtúnṣe wọ̀nyí kò yí ìtumọ̀ tàbí agbára ìkọ̀sẹ̀ Pọ́ọ̀lù padà.
