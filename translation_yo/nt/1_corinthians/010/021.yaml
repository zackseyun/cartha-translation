id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: yo
  text: Ẹ kò lè mu ago Olúwa àti ago àwọn ẹ̀mí èṣù; ẹ kò sì lè ní ìpín[a] nínú tábìlì Olúwa àti nínú tábìlì àwọn ẹ̀mí èṣù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kópa nínú.”
    reason: μετέχειν lè túmọ̀ sí ní ìpín nínú tàbí kópa nínú; àwọn méjèèjì ń tọ́ka sí ìkópa gidi.
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: Ẹ kò lè
  rationale: Ó fi àìṣeéṣe tàbí àìbáramu tó ṣe kedere hàn, ó sì pa agbára ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì sọ ọ́ di àṣẹ lásán.
- source_word: ποτήριον
  choice: ago
  rationale: ‘Ago’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àwòrán mímu àti ìkópa inú àjọjẹ mu.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó tú κύριος ní ọ̀nà tó ṣe déédéé nínú Májẹ̀mú Tuntun, ó sì pa ìbáradọ́gba ‘ago/tábìlì Olúwa’ mọ́.
- source_word: πίνειν
  choice: mu
  rationale: Èyí ni ìtumọ̀ tààrà, àdánidá fún ọ̀rọ̀ ìṣe náà lẹ́yìn ‘kò lè.’
- source_word: δαιμονίων
  choice: àwọn ẹ̀mí èṣù
  rationale: Ó pa ìtumọ̀ àwọn ẹ̀dá ẹ̀mí búburú tó wà nínú δαιμόνια mọ́, dípò kí a sọ ọ́ di ‘ibi’ lásán.
- source_word: τραπέζης
  choice: tábìlì
  rationale: Ó pa àwòrán ibi àjọjẹ àti ìkópa ẹ̀sìn mọ́ láì fi ‘pẹpẹ’ kún ohun tí Gíríìkì kò sọ ní pàtó.
- source_word: μετέχειν
  choice: ṣe alábápín nínú
  rationale: Gbólóhùn yìí fi ìkópa gidi àti jíjẹ́ alábàáṣiṣẹ́ hàn, kì í ṣe wíwà nítòsí tábìlì lásán.
- source_word: καὶ
  choice: àti / sì
  rationale: ‘Àti’ so àwọn ohun méjèèjì pọ̀ nínú gbólóhùn kọ̀ọ̀kan; ‘sì’ mú ìbáradọ́gba àti ìtẹ̀síwájú láàárín àwọn gbólóhùn méjì náà yéni ní Yorùbá.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín tábìlì Olúwa àti ìjọsìn àwọn ẹ̀mí èṣù
  choice: 'A tú οὐ δύνασθε lẹ́ẹ̀mejì gẹ́gẹ́ bí àìbáramu pátápátá: ‘Ẹ kò lè.’'
  alternative: Kí a tú un bí ìkìlọ̀ tàbí àṣẹ pé, ‘Ẹ kò gbọdọ̀.’
  rationale: Ọ̀rọ̀ Gíríìkì ń sọ pé àwọn ìkópa méjèèjì kò lè bá ara wọn mu; ìtumọ̀ náà kò sọ bó ṣe rí lọ́nà ẹ̀kọ́ ìsìn ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Ẹ’ fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ẹni tí Pọ́ọ̀lù ń bá gbogbo ìjọ sọ̀rọ̀. Àtúnṣe gírámà ‘sì’ ń mú ìṣọ̀kan àwọn ìlà méjì náà rọrùn láì dín agbára àtúnwí Gíríìkì kù.
