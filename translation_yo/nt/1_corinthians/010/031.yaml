source:
  edition: SBLGNT
  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: yo
  text: Nítorí náà, yálà ẹ ń jẹ, tàbí ẹ ń mu, tàbí ohunkóhun tí ẹ ń ṣe, ẹ ṣe ohun gbogbo fún ògo Ọlọ́run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: yálà ... tàbí ... tàbí
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ṣàfihàn àwọn ipò mìíràn tí ó lè ṣẹlẹ̀; “yálà ... tàbí” jẹ́ ọ̀nà Yorùbá àdánidá tí ó sì pa ìṣètò àsọyé Gíríìkì mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìkìlọ̀ yìí jẹ́ ìparí èrò tí Pọ́ọ̀lù ń gbé jáde láti inú ọ̀rọ̀ tó ṣáájú.
- source_word: ἐσθίετε
  choice: ẹ ń jẹ
  rationale: Ìṣe àsìkò ìsinsìnyí níbí tọ́ka sí ohun tí ènìyàn sábà máa ń ṣe, kì í ṣe jíjẹ ní àkókò kan pàtó.
- source_word: πίνετε
  choice: ẹ ń mu
  rationale: Gẹ́gẹ́ bí ἐσθίετε, ó ń sọ̀rọ̀ nípa ìṣe ojoojúmọ́ ní gbogbogbòò.
- source_word: τι
  choice: ohunkóhun
  rationale: Nínú ìṣètò ọ̀rọ̀ yìí, ó mú kí ohun tí ẹsẹ náà ń sọ gbòòrò ju jíjẹ àti mímu lọ.
- source_word: ποιεῖτε
  choice: ẹ bá ń ṣe / ẹ máa ṣe
  rationale: Ọ̀rọ̀-ìṣe náà ní ìtumọ̀ gbígbòòrò. “Ẹ bá ń ṣe” bá gbólóhùn abẹ́ mu, “ẹ máa ṣe” sì sọ àṣẹ ìyànjú inú gbólóhùn àkọ́kọ́ ní Yorùbá àdánidá.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó pa agbára ìtumọ̀ tí ó kárí gbogbo nǹkan mọ́ ní èdè Yorùbá tí ó ṣe kedere.
- source_word: εἰς δόξαν
  choice: fún ògo
  rationale: εἰς pẹ̀lú δόξαν ń sọ ète tàbí ibi tí ìṣe náà ń lọ; “fún ògo” pa ìbáṣepọ̀ yìí mọ́ láì fi àlàyé míì kún un.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Ní “ògo Ọlọ́run,” ìtẹ̀lé orúkọ méjèèjì fi ìbáṣepọ̀ genitive hàn lọ́nà Yorùbá àdánidá.
theological_decisions:
- issue: Bí ìkìlọ̀ Pọ́ọ̀lù ṣe gbòòrò tó
  choice: Ó bẹ̀rẹ̀ pẹ̀lú jíjẹ àti mímu, ó sì gbòòrò dé gbogbo ohun tí àwọn onígbàgbọ́ ń ṣe.
  alternative: Kí a ka á sí ìtọ́ni tó mọ sí ọ̀ràn oúnjẹ àti ohun mímu nìkan.
  rationale: “Ohunkóhun tí ẹ bá ń ṣe” àti “ohun gbogbo” mú ìlànà náà kárí gbogbo ìṣe, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ oúnjẹ àti ohun mímu ló fa a jáde.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó ṣe kedere fún òǹkàwé òde òní. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, nítorí pé àwọn olùgbọ́ ọ̀pọ̀ ni Gíríìkì ń bá sọ̀rọ̀. Gbogbo àmì ohùn ni a fi síbi tí ó yẹ.
