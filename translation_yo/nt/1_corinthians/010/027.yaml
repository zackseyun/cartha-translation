id: 1CO.10.27
reference: 1 Corinthians 10:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: yo
  text: Bí ẹnì kan lára àwọn aláìgbàgbọ́ bá pè yín, tí ẹ sì fẹ́ lọ, ẹ jẹ ohunkóhun tí a bá gbé kalẹ̀ fún yín, láìwádìí ohunkóhun[a], nítorí ẹ̀rí-ọkàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘láìṣàyẹ̀wò ohunkóhun’ tàbí ‘láìbéèrè ìbéèrè kankan.’ Èrò rẹ̀ ni pé kí ẹ má ṣe wádìí ibi tí oúnjẹ náà ti wá.
    reason: lexical_alternative
  - marker: b
    text: Ẹsẹ tó tẹ̀ lé túbọ̀ ṣàlàyé ‘ẹ̀rí-ọkàn’; níbẹ̀ Paulu fi ẹ̀rí-ọkàn ẹni kejì yàtọ̀ sí ti ẹ̀yin.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: àwọn aláìgbàgbọ́
  rationale: Ó ń tọ́ka sí àwọn ènìyàn tí wọn kò gba ìgbàgbọ́ Kristẹni; ọ̀rọ̀ yìí ṣe kedere, kò sì fi ọ̀tá kún ìtumọ̀ náà.
- source_word: καλεῖ
  choice: bá ké sí yín
  rationale: Nínú àyíká àsè yìí, ó túmọ̀ sí pípe tàbí fífi ìkésíni ránṣẹ́, kì í ṣe kíkàn pè ní ohùn lásán.
- source_word: θέλετε πορεύεσθαι
  choice: tí ẹ sì fẹ́ lọ
  rationale: Ó pa ìfẹ́ tàbí ìmúratán àwọn tí a pè mọ́, ó sì bá gbólóhùn oníṣ条件 náà mu lọ́nà àdánidá ní Yorùbá.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: ohunkóhun tí a bá gbé kalẹ̀ fún yín
  rationale: Ó ń sọ nípa gbogbo oúnjẹ tí a bá gbé wá fún wọn, láìfi ohun tí orísun kò sọ kún un.
- source_word: ἐσθίετε
  choice: ẹ jẹ
  rationale: Àṣẹ tó rọrùn, tó sì bójú mu fún ìtọ́ni gbogbogbò ni.
- source_word: μηδὲν ἀνακρίνοντες
  choice: láìwádìí ohunkóhun
  rationale: ἀνακρίνω lè túmọ̀ sí ṣàyẹ̀wò, wádìí, tàbí béèrè lọ́wọ́ ẹni; níbí, èrò rẹ̀ ni pé kí wọn má ṣe ṣe ìwádìí nípa oúnjẹ náà.
- source_word: διὰ τὴν συνείδησιν
  choice: nítorí ẹ̀rí-ọkàn
  rationale: Ó fi ẹ̀rí-ọkàn hàn gẹ́gẹ́ bí ìdí tàbí ohun tí a ń gbé yẹ̀ wò, láìsọ ní ẹsẹ yìí pé ẹ̀rí-ọkàn ta ni.
theological_decisions:
- issue: Ta ni συνείδησις (‘ẹ̀rí-ọkàn’) ń tọ́ka sí?
  choice: A fi ‘ẹ̀rí-ọkàn’ sílẹ̀ láìsọ pé ó jẹ́ ti onígbàgbọ́ tàbí ti ẹlòmíràn.
  alternative: Kí a sọ ní pàtó pé ó jẹ́ ẹ̀rí-ọkàn onígbàgbọ́, tàbí kí a sọ pé ó jẹ́ ti ẹni kejì tí ẹsẹ tó tẹ̀ lé mẹ́nu kàn.
  rationale: Ọ̀rọ̀ Gíríìkì inú ẹsẹ yìí kò sọ ẹni tí ẹ̀rí-ọkàn náà jẹ́ ní pàtó; ẹsẹ tó tẹ̀ lé ló túbọ̀ ṣàlàyé. Ìtumọ̀ náà pa àìdánilójú tó wà nínú orísun mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. ‘Ẹ jẹ’ àti ‘ẹ fẹ́ lọ’ pa ọ̀rọ̀ náà mọ́ sí ẹni púpọ̀ gẹ́gẹ́ bí ὑμᾶς/ὑμῖν.
