revisions:
- from: Bí ẹnì kan lára àwọn aláìgbàgbọ́ bá ké sí yín, tí ẹ sì fẹ́ lọ, ẹ jẹ ohunkóhun tí a bá gbé kalẹ̀ fún yín, láìwádìí ohunkóhun[a], nítorí ẹ̀rí-ọkàn[b].
  to: Bí ẹnì kan lára àwọn aláìgbàgbọ́ bá pè yín, tí ẹ sì fẹ́ lọ, ẹ jẹ ohunkóhun tí a bá gbé kalẹ̀ fún yín, láìwádìí ohunkóhun[a], nítorí ẹ̀rí-ọkàn[b].
  rationale: A rọ́pò ‘bá ké sí yín’ pẹ̀lú ‘bá pè yín’ láti fi ìtumọ̀ καλεῖ nínú àyíká ìkésíni hàn ní Yorùbá tó dára. A tún ṣàtúnṣe àwọn àlàyé ìsàlẹ̀ fún ìtọ́kasí ẹni tó péye àti kedere. Kò sí ìyípadà sí ìtumọ̀, ìwọ̀n ọ̀rọ̀, tàbí àìdánilójú nípa ẹni tí ẹ̀rí-ọkàn náà jẹ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:16:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ Gíríìkì mọ́ dáadáa: ìpè láti ọ̀dọ̀ aláìgbàgbọ́, ìfẹ́ láti lọ, jíjẹ ohun tí a gbé kalẹ̀, àti àìṣe ìwádìí nítorí ẹ̀rí-ọkàn. Ó tún fi ẹni tí ‘ẹ̀rí-ọkàn’ jẹ́ sílẹ̀ láìpinnu rẹ̀, gẹ́gẹ́ bí orísun ṣe ṣe.'
  naturalness: ‘Bá ké sí yín’ kì í ṣe ọ̀nà àdánidá tàbí tó péye láti sọ ‘invite’ nínú Yorùbá ìlànà; ‘bá pè yín’ ni ọ̀rọ̀ tó wọ́pọ̀, tó sì yẹ nínú àyíká ìkésíni sí àsè. Àwọn àtúnṣe kékeré nínú àwọn àlàyé ìsàlẹ̀ tún mú kí ẹni tí a ń bá sọ̀rọ̀ hàn gedegbe.
  terminology: ‘Àwọn aláìgbàgbọ́,’ ‘ẹ̀rí-ọkàn,’ àti ‘ohunkóhun tí a bá gbé kalẹ̀ fún yín’ bá ọ̀rọ̀ orísun mu, wọ́n sì jẹ́ Yorùbá òde òní tó ní ìwọ̀ntúnwọ̀nsì. ‘Ẹ̀rí-ọkàn’ jẹ́ ìlò tó bójú mu fún συνείδησις.
  issues:
  - severity: medium
    issue: ‘bá ké sí yín’
    rationale: ‘Ké sí’ sábà máa ń túmọ̀ sí ké pe ẹni tàbí pariwo sí ẹni, kì í sì ṣe ìkésíni sí oúnjẹ. Καλεῖ nínú àyíká yìí túmọ̀ sí ‘pè/pe sí àsè’; ‘bá pè yín’ ni ìtumọ̀ tó péye.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ a lo ‘kí wọn má ṣe’
    rationale: Àṣẹ inú ẹsẹ náà ń bá ‘ẹ’ (ẹ̀yin) sọ̀rọ̀; ‘kí ẹ má ṣe’ máa pa ìtọ́kasí ẹni náà mọ́.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ b sọ ‘ẹni tí ó ń bá sọ̀rọ̀’
    rationale: Èyí lè dà bí ẹni tí Paulu ń bá sọ̀rọ̀. Ẹsẹ 28 fi ẹ̀rí-ọkàn ẹni tí ó sọ ìsọfúnni náà wé ti ‘ẹ̀yin’ (àwọn olùgbọ́ ìwé náà); a lè sọ èyí ní kedere láìfi ìtumọ̀ ẹsẹ 27 pinnu.
