source:
  edition: SBLGNT
  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: yo
  text: 'Ẹ wo Ísírẹ́lì nípa ti ara[a]: ṣé àwọn tí ń jẹ àwọn ẹbọ kì í ṣe alábápín pẹpẹ ẹbọ[b] bí?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ísírẹ́lì nípa ìran ti ara.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, wọ́n ní ìpín nínú ohun tí ó ní í ṣe pẹ̀lú pẹpẹ ẹbọ.
    reason: clarity
lexical_decisions:
- source_word: βλέπετε
  choice: Ẹ wo
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; nínú àríyànjiyàn yìí, ó ń pe wọn láti fiyè sí àpẹẹrẹ Ísírẹ́lì, kì í ṣe wíwo ojú lásán.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: Ísírẹ́lì nípa ti ara
  rationale: Ó pa èdè ‘ara’ tí Pọ́ọ̀lù lò mọ́, láì sọ ọ́ di ‘ìwà ẹlẹ́ṣẹ̀’; níbí ó tọ́ka sí Ísírẹ́lì nípa ìran ti ara.
- source_word: οὐχ ... εἰσίν;
  choice: ṣé ... kì í ṣe ... bí?
  rationale: Ìbéèrè àsọyé ni tí ó ń retí ìdáhùn pé bẹ́ẹ̀ ni.
- source_word: οἱ ἐσθίοντες
  choice: àwọn tí ń jẹ
  rationale: Ó tú participle náà sí Yorùbá àdánidá, ó sì pa ìṣe jíjẹ gidi mọ́.
- source_word: τὰς θυσίας
  choice: àwọn ẹbọ
  rationale: ‘Ẹbọ’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun tí a fi rúbọ; àyíká pẹpẹ ẹbọ mú ìtumọ̀ rẹ̀ dájú.
- source_word: κοινωνοὶ
  choice: alábápín
  rationale: Ó fi hàn pé àwọn tó jẹ ẹbọ ní ìpín gidi nínú ohun tó ní í ṣe pẹlu pẹpẹ ẹbọ, láì fi ẹ̀kọ́ ìsìn míì kún un.
- source_word: τοῦ θυσιαστηρίου
  choice: pẹpẹ ẹbọ
  rationale: Genitive náà so àwọn alábápín pọ̀ mọ́ pẹpẹ; Yorùbá lè fi ìbáṣepọ̀ yìí hàn láì lo preposition àjèjì.
theological_decisions:
- issue: Ìtumọ̀ ‘Ísírẹ́lì nípa ti ara’
  choice: Ísírẹ́lì nípa ìran tàbí ìbí ti ara
  alternative: Ísírẹ́lì ní ojú ti ara nìkan
  rationale: Nínú àyíká yìí, gbolohun náà tọ́ka sí àwọn ọmọ Ísírẹ́lì nípa ìran, ṣùgbọ́n a pa àpẹẹrẹ ọ̀rọ̀ Pọ́ọ̀lù mọ́ kí a má bàa pinnu àríyànjiyàn ẹ̀kọ́ ìsìn tó gbòòrò sí i.
- issue: Ìbáṣepọ̀ κοινωνοὶ τοῦ θυσιαστηρίου
  choice: alábápín pẹpẹ ẹbọ
  alternative: àwọn tí ó ń ṣe alábápín pọ̀ pẹlu pẹpẹ ẹbọ
  rationale: Ìtumọ̀ náà pa èrò ìkópa nínú ayé ìrúbọ mọ́; kò tú u sí jíjẹ́ pẹpẹ fúnra rẹ̀ tàbí sí ìbáṣepọ̀ tí kò ṣe kedere.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. ‘Ẹ wo’ jẹ́ àṣẹ ọ̀pọ̀ ènìyàn; ‘ṣé ... kì í ṣe ... bí?’ sì jẹ́ ọ̀nà àdánidá láti fi ìbéèrè àsọyé tí ń retí ìdáhùn rere hàn. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
