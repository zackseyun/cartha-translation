id: 1CO.10.14
reference: 1 Corinthians 10:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διόπερ, ἀγαπητοί μου, φεύγετε ἀπὸ τῆς εἰδωλολατρίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin olùfẹ́ mi, ẹ sá fún ìbọ̀rìṣà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “jíjọ́sìn òrìṣà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: Nítorí náà
  rationale: Ó jẹ́ ọ̀rọ̀ ìparí èrò tí ó so àṣẹ yìí mọ́ àríyànjiyàn tó ṣáájú, ó sì pa agbára ìtumọ̀ ‘nítorí ìdí yìí’ mọ́ ní Yorùbá àdánidá.
- source_word: ἀγαπητοί μου
  choice: ẹ̀yin olùfẹ́ mi
  rationale: Ọ̀rọ̀ ìpè onífẹ̀ẹ́ ni; yíyan yìí pa ìfẹ́ inú ọ̀rọ̀ Pọ́ọ̀lù àti ìtumọ̀ arọ́pò-orúkọ ‘mi’ mọ́.
- source_word: φεύγετε
  choice: ẹ sá
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni, ó sì ń béèrè ìyapa kánkán bí ẹni tí ń sá kúrò nínú ewu; ‘ẹ sá’ mú agbára náà jáde.
- source_word: ἀπὸ
  choice: fún
  rationale: Nínú gbolohun Yorùbá ‘sá fún,’ ‘fún’ ni ọ̀nà àdánidá láti fi ohun tí a ń yẹra fún hàn, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ rẹ̀ nínú Gíríìkì jẹ́ ìyapa ‘kúrò lọ́dọ̀.’
- source_word: τῆς εἰδωλολατρίας
  choice: ìbọ̀rìṣà
  rationale: Ó túmọ̀ sí jíjọ́sìn tàbí sísìn òrìṣà; ‘ìbọ̀rìṣà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ní ààyè láti bo ìjọsìn àti àwọn ìṣe tó bá a rìn.
theological_decisions:
- issue: Ìwọ̀n ohun tí àṣẹ náà kà léèwọ̀
  choice: Àṣẹ tààrà láti yẹra fún ìbọ̀rìṣà àti kíkópa nínú àwọn ìṣe tó jẹ mọ́ ọn
  alternative: Ìkìlọ̀ tó dín kù sí fífi ọkàn sin òrìṣà nìkan
  rationale: Àyíká ẹsẹ̀ náà ń sọ̀rọ̀ nípa kíkópa nínú oúnjẹ àti ìṣe ìjọsìn àwọn abọ̀rìṣà. Ọ̀rọ̀ Gíríìkì náà gbòòrò ju ìfarasin inú ọkàn lọ, nítorí náà a kò dín ìtumọ̀ rẹ̀ kù.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ̀yin’ láti jẹ́ kí àdírẹ́sì ọ̀pọ̀ ènìyàn àti ìfẹ́ inú ọ̀rọ̀ náà hàn; gbogbo àmì ohùn ni a fi sí ibi tó yẹ.
