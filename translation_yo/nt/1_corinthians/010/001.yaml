id: 1CO.10.1
reference: 1 Corinthians 10:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: yo
  text: Nítorí, èmi kò fẹ́ kí ẹ má ṣe jẹ́ aláìmọ̀[a], ẹ̀yin ará, pé àwọn baba wa gbogbo wà lábẹ́ ìkùùkuu, gbogbo wọn sì la inú òkun kọjá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “kí ẹ má ṣe jẹ́ aláìmọ̀.” Ọ̀rọ̀ Gíríìkì fún “ẹ̀yin ará” jẹ́ ọ̀pọ̀ akọ (“ẹ̀yin arákùnrin”), ṣùgbọ́n ó lè jẹ́ ọ̀rọ̀ ìpè sí gbogbo ìjọ, títí kan àwọn obìnrin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: èmi kò fẹ́ kí ẹ má mọ̀
  rationale: Ó pa ìṣètò ọ̀rọ̀ òdì inú Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju lílo ọ̀rọ̀ tó lè túmọ̀ sí aláìmọ̀kan lọ.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé tàbí ń fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ àdánidá fún àwọn ọmọ ìjọ, ó sì lè tọ́ka sí ọkùnrin àti obìnrin láìsọ ìtumọ̀ àpapọ̀ ọ̀rọ̀ Gíríìkì nù; àlàyé ìbálòpọ̀ ọ̀rọ̀ náà wà ní àlàyé ìsàlẹ̀.
- source_word: οἱ πατέρες ἡμῶν
  choice: àwọn baba wa
  rationale: Ó pa àwòrán ìdílé àti ìdánimọ̀ Pọ́ọ̀lù pẹ̀lú ìtàn Ísírẹ́lì mọ́ ju “àwọn baba ńlá wa” tàbí “àwọn àgbà wa” lọ.
- source_word: πάντες
  choice: gbogbo ... gbogbo wọn
  rationale: A pa àtúnsọ πάντες méjèèjì mọ́ nítorí agbára ọ̀rọ̀ rẹ̀ nínú àríyànjiyàn apá yìí.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: wà lábẹ́ ìkùùkuu
  rationale: Ó jẹ́ ìtumọ̀ tààrà, tó sì pa ìtọ́kasí sí ìkùùkuu tó ń darí Ísírẹ́lì nígbà ìjádelọ mọ́.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: la inú òkun kọjá
  rationale: Ó sọ ìrìn wọn gba inú òkun ní Yorùbá àdánidá, láìfi àlàyé tí Gíríìkì kò sọ kún un.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοί gẹ́gẹ́ bí ọ̀rọ̀ ìpè sí ìjọ tó ní ọkùnrin àti obìnrin
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin; ẹ̀yin arákùnrin àti arábìnrin
  rationale: Ní Yorùbá, “ẹ̀yin ará” jẹ́ ọ̀rọ̀ ìpè ìdílé tó wọ́pọ̀, tí ó bo gbogbo ìjọ. Àlàyé ìsàlẹ̀ ṣàfihàn pé ọ̀rọ̀ Gíríìkì jẹ́ ọ̀pọ̀ akọ ṣùgbọ́n ó lè pe àwùjọ adalu.
- issue: Ìdánimọ̀ ìjọ tó ní àwọn Kèfèrí pẹ̀lú Ísírẹ́lì nínú “οἱ πατέρες ἡμῶν”
  choice: àwọn baba wa
  alternative: àwọn baba ńlá wa; àwọn baba wọn
  rationale: “Àwọn baba wa” pa ọ̀rọ̀ ìdílé Pọ́ọ̀lù àti bí ó ṣe kó àwọn onígbàgbọ́ Kọ́ríńtì sínú ìtàn Ísírẹ́lì mọ́, láìyí “wa” padà sí “wọn.”
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. A pa àsopọ̀ “Nítorí,” àtúnsọ “gbogbo,” àti èdè ìdílé “àwọn baba wa” mọ́. “Ìkùùkuu” ni a yàn fún νεφέλη gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá tó ṣe kedere fún cloud.
