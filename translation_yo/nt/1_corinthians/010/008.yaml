  source_fidelity: 'Ìtumọ̀ náà ń pa àgbékalẹ̀ Gíríìkì mọ́ dáadáa: ìkìlọ̀ ẹni-kìíní púpọ̀, àfiwé pẹ̀lú ‘àwọn kan lára wọn,’ nọ́ńbà ẹgbẹ̀rún mẹ́tàlélógún, àti ‘ní ọjọ́ kan.’ ‘Ṣubú’ tún dá ìtumọ̀ ἔπεσαν dúró láì sọ ikú di ọ̀rọ̀ pàtó nínú ẹsẹ̀.'
  naturalness: ‘Ṣe ìṣekúṣe nípa ìbálòpọ̀’ yé ẹni, ṣùgbọ́n kò rọrùn bẹ́ẹ̀ nínú Yorùbá ìgbàlódé. ‘Ṣe ìwà ìbálòpọ̀ tí kò tọ́’ jẹ́ ọ̀nà tí ó dáa síi láti sọ ìtumọ̀ gbòòrò πορνεύω. Orúkọ ìwé Mósè tó wọ́pọ̀ nínú Yorùbá ni ‘Nọ́ńbà,’ kì í ṣe ‘Númérì.’
  terminology: A ti pa àìlópín πορνεύω mọ́; àtúnṣe náà ń lo ‘ìwà ìbálòpọ̀ tí kò tọ́,’ tí kò dín ọ̀rọ̀ náà kù sí panṣágà tàbí àgbèrè nìkan. ‘Ṣubú’ yẹ kí ó wà nínú ọ̀rọ̀ pàtàkì, pẹ̀lú àlàyé ikú lábẹ́ ìdájọ́ nínú àlàyé ìsàlẹ̀.
