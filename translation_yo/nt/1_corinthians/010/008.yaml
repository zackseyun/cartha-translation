    rationale: Ó lè dà bí ìṣekúṣe gbogbogbò tí a fi àfikún ‘nípa ìbálòpọ̀’ ṣe àlàyé. ‘Ìwà ìbálòpọ̀ tí kò tọ́’ túmọ̀ ọ̀rọ̀ náà ní kedere, ó sì pa ìtumọ̀ rẹ̀ mọ́ ní fífẹ̀.
