id: 1CO.10.8
reference: 1 Corinthians 10:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: yo
  text: Kí a má sì ṣe ìwà ìbálòpọ̀ tí kò tọ́, gẹ́gẹ́ bí àwọn kan lára wọn ti ṣe ìwà ìbálòpọ̀ tí kò tọ́, tí ẹgbẹ̀rún mẹ́tàlélógún[b] sì ṣubú[a] ní ọjọ́ kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n kú” tàbí “a pa wọ́n.” Ọ̀rọ̀ Gíríìkì náà sọ pé “ṣubú,” ọ̀nà tí a sábà máa ń gbà sọ̀rọ̀ nípa ikú lábẹ́ ìdájọ́.
    reason: lexical_alternative
  - marker: b
    text: Nọ́ńbà 25:9 sọ pé ẹgbẹ̀rún mẹ́rìnlélógún ni. Níhìn-ín, Pọ́ọ̀lù sọ pé ẹgbẹ̀rún mẹ́tàlélógún ṣubú “ní ọjọ́ kan”; èyí lè fi iye àwọn tó kú ní ọjọ́ yẹn yàtọ̀ sí àpapọ̀ tó pọ̀ jù bẹ́ẹ̀ lọ. Síbẹ̀, ìtumọ̀ náà pa ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì fi dandan mú àwọn nọ́ńbà náà bá ara wọn mu.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: Kí a má sì
  rationale: Ó so ìkìlọ̀ yìí mọ́ àwọn ìkìlọ̀ tó ṣáájú, ó sì fi ìṣírí àṣẹ-àìṣe hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: ṣe ìṣekúṣe nípa ìbálòpọ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí lílọ́wọ́ nínú ìwà ìbálòpọ̀ tí kò tọ́. Gbólóhùn yìí yé kedere, kò sì dín ìtumọ̀ Gíríìkì náà kù sí panṣágà nìkan. Lílo ọ̀rọ̀ kan náà ní ìgbà méjèèjì tún pa àtúnwí inú orísun mọ́.
- source_word: καθώς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi àfiwé pẹ̀lú àpẹẹrẹ àwọn ọmọ Ísírẹ́lì hàn lọ́nà àdánidá.
- source_word: τινες αὐτῶν
  choice: àwọn kan lára wọn
  rationale: Ó tọ́ka sí díẹ̀ lára àwọn ọmọ Ísírẹ́lì ní ìran aginjù, ó sì jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání.
- source_word: ἔπεσαν
  choice: ṣubú
  rationale: Ìtumọ̀ tààrà πίπτω ni ‘ṣubú.’ Nínú àyíká ìdájọ́ yìí, ó ń tọ́ka sí ikú, ṣùgbọ́n ‘ṣubú’ pa àwòrán àti àìsọ̀rọ̀-pàtó orísun mọ́; àlàyé wà ní àlàyé ìsàlẹ̀ ojú ìwé.
- source_word: μιᾷ ἡμέρᾳ
  choice: ní ọjọ́ kan
  rationale: Ó sọ àkókò tí ìṣẹ̀lẹ̀ náà wáyé nínú rẹ̀, ó sì tẹnu mọ́ bí ìdájọ́ náà ṣe ṣẹlẹ̀ ní ọjọ́ kan ṣoṣo.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: ẹgbẹ̀rún mẹ́tàlélógún
  rationale: Èyí ni nọ́ńbà tí ọ̀rọ̀ Gíríìkì sọ ní tààrà, a sì kọ ọ́ ní ọ̀rọ̀ gẹ́gẹ́ bí ara gbólóhùn.
theological_decisions:
- issue: Ìbáṣepọ̀ nọ́ńbà yìí pẹ̀lú nọ́ńbà inú Númérì 25:9
  choice: A pa ‘ẹgbẹ̀rún mẹ́tàlélógún’ tí Pọ́ọ̀lù sọ mọ́ nínú ẹsẹ náà láì mú un bá nọ́ńbà mìíràn mu.
  alternative: Kí a yí i sí ‘ẹgbẹ̀rún mẹ́rìnlélógún,’ tàbí kí a sọ nínú ẹsẹ náà pé ọ̀kan jẹ́ iye ọjọ́ kan, èkejì sì jẹ́ àpapọ̀ gbogbo wọn.
  rationale: Ọ̀rọ̀ Gíríìkì 1 Kọ́ríńtì sọ ‘ẹgbẹ̀rún mẹ́tàlélógún’ ní kedere. Ìtumọ̀ gbọ́dọ̀ pa ọ̀rọ̀ Pọ́ọ̀lù mọ́, kí ó má sì fi ìṣọ̀kan tí orísun kò sọ kún un. Àlàyé ìṣòro nọ́ńbà náà yẹ fún àlàyé ìsàlẹ̀ ojú ìwé.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “Ìṣekúṣe nípa ìbálòpọ̀” jẹ́ kedere fún òǹkàwé lónìí, ó sì gbòòrò ju “àgbèrè,” èyí tí a lè lóye gẹ́gẹ́ bí panṣágà tàbí irú ẹ̀ṣẹ̀ kan pàtó. Àtúnwí inú Gíríìkì ni a pa mọ́, bẹ́ẹ̀ ni “ṣubú” àti ìyàtọ̀ nọ́ńbà náà kò jẹ́ kí a túmọ̀ ìṣòro ẹ̀kọ́ ìgbàgbọ́ náà ní ìkọ̀kọ̀.
