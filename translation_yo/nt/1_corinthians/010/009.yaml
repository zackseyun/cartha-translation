id: 1CO.10.9
reference: 1 Corinthians 10:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: yo
  text: Kí a má sì dán Mèsáyà[a] wò, gẹ́gẹ́ bí àwọn kan lára wọn ti dán an wò, tí àwọn ejò sì ń pa wọ́n run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní “Olúwa” dípò “Mèsáyà” (tàbí “Kristi”).
    reason: textual_variant
lexical_decisions:
- source_word: μηδὲ
  choice: Kí a má sì
  rationale: Ó ń tẹ̀ síwájú nínú àwọn ìkìlọ̀ tí ó wà ní àyíká ẹsẹ yìí, ó sì pa agbára ọ̀rọ̀ ìrọ̀rùn-àṣẹ náà mọ́ ní Yorùbá àdánidá.
- source_word: ἐκπειράζωμεν
  choice: dán ... wò
  rationale: ‘Dán ẹni wò’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a fi ẹnì kan sí àdánwò tí kò tọ́; kò sì mú ìtumọ̀ ‘tan sí ẹ̀ṣẹ̀’ wọ inú ọ̀rọ̀ náà.
- source_word: τὸν Χριστόν
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè níhìn-ín; ‘Mèsáyà’ ń fi ìtumọ̀ oyè náà hàn dípò lílo ‘Kristi’ bí ẹni pé ó jẹ́ orúkọ.
- source_word: καθώς
  choice: gẹ́gẹ́ bí
  rationale: Ó ṣe afíwé ìkìlọ̀ náà pẹ̀lú ohun tí àwọn ọmọ Ísírẹ́lì kan ṣe ní aginjù.
- source_word: τινες αὐτῶν
  choice: àwọn kan lára wọn
  rationale: Èyí jẹ́ Yorùbá tí ó ṣe kedere fún díẹ̀ lára gbogbo ẹgbẹ́ tí a ń tọ́ka sí.
- source_word: ἐπείρασαν
  choice: ti dán an wò
  rationale: Ó tọ́ka sí ìṣe ìgbà àtijọ́, ó sì pa ohun tí wọ́n dán wò mọ́ nípa arọ́pò-orúkọ ‘an.’
- source_word: ὑπὸ τῶν ὄφεων
  choice: àwọn ejò
  rationale: ‘Ejò’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu fún ὄφις, èyí tí ó lè jẹ́ ‘snake’ tàbí ‘serpent.’
- source_word: ἀπώλλυντο
  choice: ń pa wọ́n run
  rationale: Àmì àkókò aláìpé Gíríìkì fi ìparun tí ń lọ lọ́wọ́ hàn; ‘ń pa wọ́n run’ tún jẹ́ kí àwọn ejò gẹ́gẹ́ bí olùṣe ìṣe náà ṣe kedere.
theological_decisions:
- issue: Ẹni tí τὸν Χριστόν ń tọ́ka sí àti ìyàtọ̀ inú àwọn àfọwọ́kọ
  choice: Mèsáyà
  alternative: Olúwa; Kristi
  rationale: SBLGNT ka Χριστόν, nítorí náà a túmọ̀ oyè náà sí ‘Mèsáyà.’ Àwọn àfọwọ́kọ kan ka ‘Olúwa,’ a sì fi ìyàtọ̀ pàtàkì yẹn sínú àlàyé ìsàlẹ̀ dípò kí a yanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ, a sì pa ìsẹ̀lẹ̀ ìṣe tí ń lọ lọ́wọ́ mọ́ pẹ̀lú ‘ń pa wọ́n run.’
