  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtumọ̀ Gíríìkì dáadáa: ìfòfindè gbogbogbò náà, ìṣe ‘wá,’ àti ìyàtọ̀ láàárín ire ẹni àti ti ẹlòmíràn wà níbẹ̀. Síbẹ̀, ‘má ṣe máa wá’ lè fi ìtẹ̀síwájú tàbí àṣà kan kún ọ̀rọ̀ ìṣe náà ju bí ó ti yẹ lọ, nígbà tí ‘má ṣe wá’ ti tó láti gbé ìfòfindè náà kalẹ̀.'
