source:
  edition: SBLGNT
  text: μηδεὶς τὸ ἑαυτοῦ ζητείτω ἀλλὰ τὸ τοῦ ⸀ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: yo
  text: Kí ẹnikẹ́ni má ṣe wá ìre tirẹ̀, ṣùgbọ́n kí ó wá ìre ti ẹlòmíràn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηδεὶς
  choice: Kí ẹnikẹ́ni má ṣe
  rationale: Ó fi ìfòfindè gbogbogbò hàn ní Yorùbá àdánidá, ó sì bá agbára ọ̀rọ̀ àṣẹ ζητείτω mu.
- source_word: ζητείτω
  choice: má ṣe máa wá
  rationale: “Wá” pa ìtumọ̀ gbòòrò ti ζητέω mọ́; “má ṣe máa” sì sọ ìfòfindè sí ìwà tàbí ìlépa ènìyàn ní ọ̀nà tí ó ṣe kedere.
- source_word: τὸ ἑαυτοῦ
  choice: ire tirẹ̀
  rationale: Gíríìkì fi ohun tí a ń wá sílẹ̀ láì sọ ọ́ ní tààrà. “Ire tirẹ̀” mú ìtumọ̀ tó yẹ ní àyíká ẹsẹ náà jáde láì dín in kù sí ọrọ̀ ohun ìní tàbí èrè nìkan.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín wíwá ire ẹni àti wíwá ire ẹlòmíràn, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún adversative contrast yìí.
- source_word: τὸ τοῦ ἑτέρου
  choice: ire ti ẹlòmíràn
  rationale: Ó tún ohun tí a fi “ire” kún nínú gbólóhùn àkọ́kọ́ lò, ó sì pa ìtọ́kasí sí ẹni mìíràn mọ́.
theological_decisions:
- issue: Fífi ohun tí a kò sọ ní tààrà kún τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου
  choice: ire tirẹ̀ ... ire ti ẹlòmíràn
  alternative: ohun tí í ṣe tirẹ̀ ... ohun tí í ṣe ti ẹlòmíràn
  rationale: Àyíká 1 Kọ́ríńtì 10:23–33 ń sọ nípa ṣíṣe ohun tó ṣe ẹlòmíràn láǹfààní dípò lílépa èrè ẹni. “Ire” jẹ́ kí ọ̀rọ̀ náà yé òǹkàwé Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan àti àìsọ ohun náà ní tààrà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó lọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “ẹlòmíràn” dípò ọ̀rọ̀ tó lè dín ìtọ́kasí náà kù sí ẹgbẹ́ ènìyàn kan pàtó.
