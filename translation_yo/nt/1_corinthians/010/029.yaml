id: 1CO.10.29
reference: 1 Corinthians 10:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: yo
  text: Ẹ̀rí-ọkàn ẹlòmíràn ni mo túmọ̀ sí,[a] kì í ṣe tìrẹ. Nítorí kí ni a fi ń dá òmìnira mi lẹ́jọ́ ní ọwọ́ ẹ̀rí-ọkàn ẹlòmíràn?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀rọ̀-sí-ọ̀rọ̀ jù bẹ́ẹ̀ lọ: “kì í ṣe ti ara rẹ̀, bí kò ṣe ti ẹlòmíràn.” Àyíká ọ̀rọ̀ ṣe atilẹyin fún ìtumọ̀: “kì í ṣe tìrẹ, bí kò ṣe ti ẹlòmíràn.”'
    reason: lexical_alternative
  - marker: b
    text: A lè lóye ìbéèrè àsọyé yìí gẹ́gẹ́ bí ìpèníjà Paulu fúnra rẹ̀ tàbí gẹ́gẹ́ bí àtakò tí ó ń gbé jáde; Gíríìkì kò fi àmì ọ̀rọ̀-àyọkà tàbí àmì ìyípadà olùsọ hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: ẹ̀rí-ọkàn
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìmọ̀ inú nípa ohun tó tọ́ tàbí tí kò tọ́; “ẹ̀rí-ọkàn” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìlò Paulu mu.
- source_word: δὲ λέγω
  choice: ni mo ń sọ
  rationale: Níhìn-ín, Paulu ń ṣàlàyé ohun tó ní lọ́kàn nínú ọ̀rọ̀ tó ṣáájú, kì í ṣe pé ó ń fi àmì àsìkò tuntun kan hàn.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: Ẹ̀rí-ọkàn ẹni kejì ... kì í ṣe tìrẹ
  rationale: A yí ìtòlẹ́sẹẹsẹ̀ náà padà díẹ̀ kí ó lè ṣe kedere ní Yorùbá, nígbà tí a ṣì pa ìyàtọ̀ tó wà láàárín ẹ̀rí-ọkàn olùgbọ́ àti ti ẹni kejì mọ́.
- source_word: ἱνατί γὰρ
  choice: Nítorí kí ni
  rationale: Ó pa ìsopọ̀ àlàyé γάρ àti agbára ìbéèrè àsọyé ἱνατί mọ́ ní Yorùbá àdánidá.
- source_word: ἐλευθερία
  choice: òmìnira
  rationale: “Òmìnira” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ààyè ẹni láti ṣe ohun tí ó ní ẹ̀tọ́ sí.
- source_word: κρίνεται
  choice: a ... ń dá ... lẹ́jọ́
  rationale: Ìtumọ̀ náà pa ọ̀nà àìṣe κρίνεται àti ìtumọ̀ gbígbòòrò rẹ̀ mọ́ láì sọ ọ́ di ìdálẹ́bi pátápátá.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: nípasẹ̀ ẹ̀rí-ọkàn ẹlòmíràn
  rationale: Ó fi ẹ̀rí-ọkàn ẹlòmíràn hàn gẹ́gẹ́ bí ohun tí a fi ń ṣe ìdájọ́ náà, bí Gíríìkì ṣe sọ.
theological_decisions:
- issue: Ẹni tí ọ̀rọ̀ arọ́pò-orúkọ nínú gbólóhùn àkọ́kọ́ ń tọ́ka sí
  choice: A mú un gẹ́gẹ́ bí ẹ̀rí-ọkàn ẹni kejì, kì í ṣe ẹ̀rí-ọkàn ẹni tí Paulu ń bá sọ̀rọ̀.
  alternative: A lè tú fọ́ọ̀mù Gíríìkì náà ní tààràtà sí “kì í ṣe tirẹ̀ fúnra rẹ̀, bí kò ṣe ti ẹni kejì,” èyí tó lè dà bí ẹni pé ó ń tọ́ka sí ẹni kẹta.
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Paulu ń ṣàlàyé ìtọ́ni tó ṣáájú nípa ẹ̀rí-ọkàn ẹni kejì; Yorùbá àdánidá sì ń lo “tìrẹ” fún ẹni tí a ń bá sọ̀rọ̀.
- issue: Olùsọ ìbéèrè àsọyé ní ìparí ẹsẹ
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí ìbéèrè àsọyé láì pinnu ẹni tó ń sọ ọ́.
  alternative: A lè kà á sí ìpèníjà Paulu fúnra rẹ̀ tàbí sí àtakò tí ó ń gbé jáde láti ẹnu ará Kọrinti kan.
  rationale: Gíríìkì kò fi àmì ìyípadà olùsọ hàn; nítorí náà, ìtumọ̀ kò yẹ kí ó yan ọ̀kan lára àwọn ìtumọ̀ méjèèjì ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá ìwọ̀ntúnwọ̀nsì, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. “Ẹ̀rí-ọkàn” àti “òmìnira” jẹ́ àwọn ọ̀rọ̀ tó ṣe kedere fún òǹkàwé gbogbogbò.
