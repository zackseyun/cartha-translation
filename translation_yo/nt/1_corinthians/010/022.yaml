id: 1CO.10.22
reference: 1 Corinthians 10:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἢ παραζηλοῦμεν τὸν κύριον; μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: yo
  text: Àbí a ń mú Olúwa jowú ni? Ṣé àwa lágbára ju òun lọ ni?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: a fẹ́ mú ... jowú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí mímú ẹnì kan jowú tàbí ru owú rẹ̀ sókè. Ìbéèrè yìí ń tọ́ka sí ìṣe tí ó lè mú kí Olúwa jowú, ní ìbámu pẹ̀lú ọ̀rọ̀ nípa ìbọ̀rìṣà nínú àyíká ẹsẹ náà.
- source_word: τὸν κύριον
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún κύριος pẹ̀lú article nínú ọ̀rọ̀ yìí; a kò fi orúkọ Ọlọ́run kan tí Gíríìkì kò sọ kún un.
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: lágbára ju òun lọ
  rationale: 'Ó pa ìfiwéra Gíríìkì mọ́ ní ọ̀nà Yorùbá adayeba: ‘stronger than him.’'
- source_word: μὴ ... ἐσμεν
  choice: Ṣé àwa ... ni?
  rationale: μὴ nínú ìbéèrè yìí ń retí ìdáhùn òdì. Ìbéèrè Yorùbá yìí pa agbára ọ̀rọ̀ àríyànjiyàn náà mọ́ láì sọ ìdáhùn náà di gbólóhùn tààrà.
theological_decisions:
- issue: Owú Olúwa
  choice: mú kí Olúwa jowú
  alternative: mú Olúwa bínú
  rationale: ‘Jowú’ pa àwòrán àti ìfọkànsìn παραζηλόω mọ́, pàápàá nínú àyíká ìṣòtítọ́ sí Ọlọ́run ní ìdojúkọ ìbọ̀rìṣà; ‘bínú’ yóò sọ ìtumọ̀ náà di gbogbogbò ju.
- issue: Ìbéèrè tó retí ìdáhùn òdì
  choice: Ṣé àwa lágbára ju òun lọ ni?
  alternative: Dájúdájú, àwa kò lágbára ju òun lọ, àbí bẹ́ẹ̀ kọ́?
  rationale: Gíríìkì fi ìbéèrè pẹ̀lú μὴ hàn, kì í ṣe gbólóhùn ìjẹ́wọ́ tààrà. Ìtumọ̀ tí a yàn pa ìrísí àti ìpá ìbéèrè náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘Àbí’ láti so ẹsẹ yìí mọ́ àṣàyàn tí Pọ́ọ̀lù ń gbé kalẹ̀, a sì fi àmì ohùn sí ibi tí ó bá ìlò adayeba mu.
