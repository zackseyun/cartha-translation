id: 1CO.10.10
reference: 1 Corinthians 10:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: yo
  text: Ẹ má sì ṣe kùn, gẹ́gẹ́ bí àwọn kan nínú wọn ti kùn, tí olùparun[a] sì pa wọ́n run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “áńgẹ́lì apanirun.” Ọ̀rọ̀ Gíríìkì sọ pé “olùparun”; ó ṣeé ṣe kó ń tọ́ka sí aṣojú tó mú ìdájọ́ ìparun bá àwọn ọmọ Ísírẹ́lì ní aginjù.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: Ẹ má sì ṣe
  rationale: Ó so ìkìlọ̀ yìí mọ́ àwọn ìkìlọ̀ tó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ àṣẹ ìdènà ní Yorùbá.
- source_word: γογγύζετε / ἐγόγγυσαν
  choice: ṣe kùn / ti kùn
  rationale: ‘Kùn’ fi ẹ̀dùn ọkàn àti àìtẹ́lọ́rùn tí a ń sọ jáde hàn, ó sì bá àyíká ìkùn àwọn ọmọ Ísírẹ́lì ní aginjù mu.
- source_word: καθάπερ
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra àti agbára ìkìlọ̀ inú gbólóhùn náà hàn ní kedere.
- source_word: τινὲς αὐτῶν
  choice: àwọn kan nínú wọn
  rationale: Ó pa ìtumọ̀ apá kan lára ẹgbẹ́ àwọn ọmọ Ísírẹ́lì mọ́.
- source_word: ἀπώλοντο
  choice: pa wọ́n run
  rationale: A lo ọ̀nà gbólóhùn aláṣe tí ó jẹ́ àdánidá ní Yorùbá, nígbà tí a ṣì fi olùṣe ìparun tí ọ̀rọ̀ Gíríìkì tọ́ka sí hàn kedere.
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: olùparun
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ orúkọ oyè, ‘olùparun,’ kò sì sọ ní pàtó pé áńgẹ́lì ni; ìtumọ̀ yìí pa àìdánilójú ojúlówó náà mọ́.
theological_decisions:
- issue: Ta ni ὁ ὀλοθρευτής?
  choice: olùparun
  alternative: áńgẹ́lì apanirun
  rationale: Ẹsẹ̀ náà dárúkọ aṣojú ìparun kan láì sọ irú ẹni tí ó jẹ́ ní pàtó. ‘Olùparun’ kò fi ìdánimọ̀ tí ọ̀rọ̀ Gíríìkì kò sọ kún un; a fi ìtumọ̀ tó túmọ̀ sí ‘áńgẹ́lì apanirun’ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ kedere, ọlọ́wọ̀, ó sì yẹ fún òǹkàwé òde òní; lílo ‘ẹ’ bá àṣẹ tí a ń sọ fún gbogbo ìjọ mu.
