id: 1CO.10.30
reference: 1 Corinthians 10:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ἐγὼ χάριτι μετέχω, τί βλασφημοῦμαι ὑπὲρ οὗ ἐγὼ εὐχαριστῶ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: yo
  text: Bí mo bá ń jẹun pẹ̀lú ìdúpẹ́[a], èé ṣe tí a fi ń sọ̀rọ̀ burúkú sí mi nítorí ohun tí mo dúpẹ́ fún?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí mo bá ń jẹun nípa oore-ọ̀fẹ́, èé ṣe tí a fi ń sọ̀rọ̀ burúkú sí mi nítorí ohun tí mo dúpẹ́ fún?” Ọ̀rọ̀ Gíríìkì χάριτι lè túmọ̀ sí “nípa oore-ọ̀fẹ́”; ṣùgbọ́n nínú àyíká yìí, a sábà máa lóye rẹ̀ sí “pẹ̀lú ìdúpẹ́” nítorí ọ̀rọ̀ tó tẹ̀ lé e pé, “mo dúpẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: fi ọkàn ìdúpẹ́
  rationale: Nínú àyíká ọ̀rọ̀ nípa jíjẹ oúnjẹ àti ọ̀rọ̀ εὐχαριστῶ tó tẹ̀ lé e, gbólóhùn yìí túmọ̀ sí pé ẹni náà jẹun pẹ̀lú ìdúpẹ́. Ó yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìgbàlà sínú ‘oore-ọ̀fẹ́’ níbi tí àyíká ọ̀rọ̀ kò ti béèrè rẹ̀.
- source_word: μετέχω
  choice: jẹ ẹ́
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí kíkópa tàbí jíjẹ nínú ohun kan; ní àyíká oúnjẹ, ‘jẹ ẹ́’ jẹ́ Yorùbá àdánidá, ó sì mú ohun tí a ń tọ́ka sí hàn láìfi ohun tuntun kún un.
- source_word: βλασφημοῦμαι
  choice: a ... ń sọ̀rọ̀ burúkú sí mi
  rationale: Níhìn-ín ẹni tí wọ́n ń sọ̀rọ̀ lòdì sí ni Pọ́ọ̀lù, kì í ṣe Ọlọ́run. Ìtumọ̀ yìí ṣàfihàn ẹ̀gàn tàbí ọ̀rọ̀ ìbàjẹ́ láìlò ‘sọ̀rọ̀-òdì sí Ọlọ́run,’ èyí tí kò bá ohun tí ọ̀rọ̀ náà ń ṣe ní àyíká yìí mu.
- source_word: ὑπὲρ οὗ
  choice: nítorí ohun tí
  rationale: Ó ṣàfihàn ìdí tàbí ohun tí ẹ̀gàn náà dá lé lórí ní Yorùbá tó ṣe kedere.
- source_word: εὐχαριστῶ
  choice: mo dúpẹ́ fún
  rationale: Ó pa ìtumọ̀ ‘mo dúpẹ́’ mọ́, kò sì fi ‘Ọlọ́run’ kún ọ̀rọ̀ bí ó tilẹ̀ jẹ́ pé òun ni ẹni tí a ń dúpẹ́ lọ́wọ́ nínú àyíká.
- source_word: ἐγὼ ... ἐγὼ
  choice: mo ... mi ... mo
  rationale: Àwọn àmì ẹni àkọ́kọ́ nínú àwọn ọ̀rọ̀ Yorùbá náà pa ìdojúkọ ẹni náà mọ́ lọ́nà àdánidá; kò pọndandan láti fi ‘èmi’ méjì kún un.
- source_word: τί
  choice: èé ṣe
  rationale: Nínú ìbéèrè àríyànjiyàn yìí, τί túmọ̀ sí ‘kí ló dé?’ tàbí ‘èé ṣe?’; ‘èé ṣe’ bá ìforúkọsílẹ̀ ọ̀wọ̀ àti àdánidá mu.
theological_decisions:
- issue: Ìtumọ̀ χάριτι ní ìbáṣepọ̀ pẹ̀lú jíjẹ àti ìdúpẹ́
  choice: pẹ̀lú ọkàn ìdúpẹ́
  alternative: nípa oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ tó tẹ̀ lé e, ‘ohun tí mo dúpẹ́ fún,’ mú kí ìtumọ̀ ìdúpẹ́ lágbára sí i. Síbẹ̀, a fi àṣàyàn ‘nípa oore-ọ̀fẹ́’ sínú àlàyé ìsàlẹ̀ nítorí χάριτι lè ní ìtumọ̀ yẹn ní gírámà àti nípa ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, kò sì jẹ́ ti ẹ̀ya ìjọ kan. ‘Jẹ ẹ́’ jẹ́ àdánidá ju lílo ọ̀rọ̀ àjèjì tàbí gbólóhùn gígùn fún ‘partake’ lọ nínú àyíká oúnjẹ.
