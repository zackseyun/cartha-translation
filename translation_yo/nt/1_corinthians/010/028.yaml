id: 1CO.10.28
reference: 1 Corinthians 10:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹnì kan bá sọ fún yín pé, “A ti fi èyí rú ẹbọ,”[a] ẹ má ṣe jẹ ẹ́, nítorí ẹni tí ó sọ ọ́ fún yín àti nítorí ẹ̀rí-ọkàn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹran ẹbọ ni èyí.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ohun tí a fi rú ẹbọ.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni, nítorí ẹ̀rí-ọkàn ẹni kejì, kì í ṣe ti ẹ̀yin fúnra yín; ẹ wo ẹsẹ tó tẹ̀ lé.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: Ṣùgbọ́n bí ẹnì kan bá sọ fún yín pé
  rationale: “Bí ... bá” fi ipò àròsọ hàn lọ́nà àdánidá ní Yorùbá; “ẹnì kan” pa agbára àìdájú τις mọ́, “ṣùgbọ́n” sì gbé ìyàtọ̀ δέ jáde.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: A ti fi èyí rú ẹbọ
  rationale: Ọ̀rọ̀ ἱερόθυτος ń tọ́ka sí ohun tí a fi rú ẹbọ. Gbólóhùn yìí ṣe kedere ní Yorùbá láì fi “òrìṣà” kún ọ̀rọ̀ Gíríìkì fúnra rẹ̀; àṣàyàn “Ẹran ẹbọ ni èyí” wà nínú àlàyé ìsàlẹ̀.
- source_word: μὴ ἐσθίετε
  choice: ẹ má ṣe jẹ ẹ́
  rationale: Èèwọ̀ ni ọ̀rọ̀ ìṣe yìí; arọ́pò-orúkọ “ẹ́” tọ́ka sí oúnjẹ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: nítorí ẹni tí ó sọ ọ́ fún yín
  rationale: “Nítorí” lè fi ìdí tàbí ìkàsí ire ẹni náà hàn nínú àyíká yìí; “sọ ọ́ fún yín” tú μηνύσαντα sí èdè Yorùbá tí ó rọrùn, tí ó sì pa ìtumọ̀ fífi ohun náà tó wọn létí mọ́.
- source_word: καὶ τὴν συνείδησιν
  choice: àti nítorí ẹ̀rí-ọkàn
  rationale: “Ẹ̀rí-ọkàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún συνείδησις. A kò sọ ní pàtó nínú ẹsẹ yìí pé ti ta ni, kí a lè pa ìṣàn àti àìsọ̀rọ̀-kedere Gíríìkì mọ́; ẹsẹ tó tẹ̀ lé ló ṣàlàyé rẹ̀.
theological_decisions:
- issue: Ẹ̀rí-ọkàn ta ni τὴν συνείδησιν ń tọ́ka sí?
  choice: Ọ̀rọ̀ inú ẹsẹ náà dúró ní ṣókí gẹ́gẹ́ bí “ẹ̀rí-ọkàn,” ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé ẹ̀rí-ọkàn ẹni kejì ni.
  alternative: Kí a kọ “ẹ̀rí-ọkàn ẹni tí ó sọ ọ́ fún yín” tàbí kí a ka a sí ẹ̀rí-ọkàn ẹni tó fẹ́ jẹ ẹran náà.
  rationale: Ẹsẹ 29 ṣàlàyé pé kì í ṣe ẹ̀rí-ọkàn ẹni tó ń jẹun, bí kò ṣe ti ẹni kejì. Síbẹ̀, fífi ẹni náà sínú ọ̀rọ̀ pàtàkì ẹsẹ 28 yóò mú ohun tí Pọ́ọ̀lù fi sílẹ̀ fún ẹsẹ tó tẹ̀ lé wọ inú ẹsẹ yìí; nítorí náà a pa ọ̀rọ̀ náà mọ́ ní ṣókí, a sì ṣàlàyé ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. A lo arọ́pò-orúkọ ọ̀pọ̀ “yín/ẹ” gẹ́gẹ́ bí Gíríìkì ὑμῖν àti ἐσθίετε. Àmì ohùn àti àmì abẹ́ lẹ́tà wà níbi tí ó yẹ.
