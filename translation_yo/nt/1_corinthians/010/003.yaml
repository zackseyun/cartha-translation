translation:
  language: yo
  text: Gbogbo wọn sì jẹ oúnjẹ ẹ̀mí kan náà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oúnjẹ àràmàǹdà”; ó ṣeé ṣe kí gbólóhùn yìí ń tọ́ka sí mánà ní aginjù, ó sì lè ní ìtumọ̀ ìṣàpẹẹrẹ nínú àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú lọ́nà àdánidá nínú Yorùbá.
- source_word: πάντες
  choice: gbogbo wọn
  rationale: Ó tọ́ka sí gbogbo àwọn ọmọ Ísírẹ́lì tí Pọ́ọ̀lù ń fi ṣe àpẹẹrẹ, ó sì pa ìtẹnumọ́ pé gbogbo wọn mọ́.
- source_word: τὸ αὐτὸ
  choice: kan náà
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere láti fi ìṣọ̀kan tàbí jíjẹ́ ohun kan náà hàn.
- source_word: πνευματικὸν
  choice: ẹ̀mí
  rationale: Nínú àkópọ̀ ọ̀rọ̀ ‘oúnjẹ ẹ̀mí,’ ó pa ìtumọ̀ ohun tí ó ní í ṣe pẹ̀lú ẹ̀mí tàbí ìpèsè Ọlọ́run mọ́, láì dín in kù sí ìtumọ̀ kan ṣoṣo.
- source_word: βρῶμα
  choice: oúnjẹ
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe tààrà tí ó sì wọ́pọ̀ fún ohun tí a ń jẹ ni.
- source_word: ἔφαγον
  choice: jẹ
  rationale: Ó sọ ìṣe tí ó ti ṣẹlẹ̀ ní kedere àti ní ṣókí gẹ́gẹ́ bí aorist náà.
theological_decisions:
- issue: Ìtumọ̀ ‘oúnjẹ ẹ̀mí’ nínú àpẹẹrẹ Pọ́ọ̀lù nípa ìrìn-àjò aginjù
  choice: A fi ‘oúnjẹ ẹ̀mí’ sí ọ̀rọ̀ pàtàkì láì sọ ní pàtó pé manna ni tàbí pé ó ń tọ́ka sí Oúnjẹ Alẹ́ Olúwa.
  alternative: ‘oúnjẹ àràmàǹdà,’ ‘oúnjẹ tí Ẹ̀mí fi fún wọn,’ tàbí fífi ‘manna’ sínú ọ̀rọ̀ pàtàkì
  rationale: Ó ṣeé ṣe kí Pọ́ọ̀lù máa tọ́ka sí manna, ṣùgbọ́n ọ̀rọ̀ πνευματικός àti àyíká rẹ̀ ní agbára àpẹẹrẹ. Ìtumọ̀ yìí pa àìdánilójú àti ẹ̀dọ̀fu ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́ láì fi ìtumọ̀ ẹ̀sìn kan lé e lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tó sì rọrùn fún òǹkàwé gbogbogbò. ‘Gbogbo wọn’ mú ẹni tí a ń tọ́ka sí ṣe kedere, ‘oúnjẹ ẹ̀mí’ sì pa ìṣòro ìtumọ̀ πνευματικόν mọ́.
