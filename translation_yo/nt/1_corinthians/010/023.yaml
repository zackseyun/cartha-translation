  source_fidelity: Ìtumọ̀ náà ń pa ìtẹnumọ́ tó ń tún ara rẹ̀ ṣe nínú Πάντα ἔξεστιν mọ́, ó sì mú ìyàtọ̀ ἀλλά, ìwúlò (συμφέρει), àti ìgbéga/ìkọ́ni (οἰκοδομεῖ) hàn dáadáa. Àmì àyọlò jẹ́ ìpinnu ìsọ̀rọ̀ tó bójú mu fún ọ̀rọ̀ àyọlò tí ó ṣeé ṣe, láìjẹ́ pé a fi ìpinnu ìtumọ̀ náà lé lórí òǹkàwé.
  naturalness: Ìkọ̀wé “ni ó” lẹ́yìn “kì í ṣe ohun gbogbo” kì í ṣe aṣiṣe gidi, ṣùgbọ́n “ló” rọrùn, ó sì dára sí i nínú Yorùbá òde òní. Pẹ̀lú èyí, “ń gbé ni ró” ní ààyè lè dà bí “ń gbé ẹni kan ró”; a sábà kọ ọ́ ní ìṣọ̀kan gẹ́gẹ́ bí “ń gbéni ró.”
