base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: yo
  text: “Ohun gbogbo ni a gbà láàyè,” ṣùgbọ́n kì í ṣe ohun gbogbo ló wúlò[a]. “Ohun gbogbo ni a gbà láàyè,” ṣùgbọ́n kì í ṣe ohun gbogbo ló ń gbéni ró.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ohun gbogbo bófin mu.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun tí a yọ̀ǹda tàbí ohun tí ó bófin mu. Àmì àyọlò fi hàn pé ó ṣeé ṣe kí èyí jẹ́ ọ̀rọ̀ tí àwọn ará Kọ́ríńtì máa ń sọ, tí Pọ́ọ̀lù sì ń fi ààlà sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: Ohun gbogbo
  rationale: Ó mú ìwọ̀n gbòòrò ti ọ̀rọ̀ Gíríìkì náà jáde, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí a lè tún sọ lẹ́ẹ̀mejì gẹ́gẹ́ bí ìlà ọ̀rọ̀ kúkúrú.
- source_word: ἔξεστιν
  choice: ni a gbà láàyè
  rationale: Ó túmọ̀ sí ohun tí a yọ̀ǹda tàbí tí ó bófin mu. ‘A gbà láàyè’ ṣe kedere ní Yorùbá òde òní láìfi ọ̀rọ̀ náà sínú èdè òfin nìkan.
- source_word: ἀλλ’
  choice: ṣùgbọ́n
  rationale: Ó pa ìyàtọ̀ kúkúrú àti tààrà láàárín ọ̀rọ̀ tí a sọ àti ààlà tí Pọ́ọ̀lù fi sí i mọ́.
- source_word: συμφέρει
  choice: ni ó ṣàǹfààní
  rationale: Ó sọ ohun tí ó wúlò tàbí tí ó jẹ́ fún ire, láìmú ìtumọ̀ èrè owó wọ inú rẹ̀.
- source_word: οἰκοδομεῖ
  choice: ni ó ń gbé ni ró
  rationale: 'Ó pa àwòrán ìkọ́lé mọ́ ní ọ̀nà àdánidá: ohun tí ń fún ènìyàn tàbí ìjọ ní okun, tí ń mú wọn dàgbà. Ọ̀rọ̀ Gíríìkì kò sọ ẹni tí a ń gbé ró ní tààrà, nítorí náà ‘ni’ jẹ́ kí ìtumọ̀ náà má ṣe dín sí ẹni kan pàtó.'
theological_decisions:
- issue: Bóyá Πάντα ἔξεστιν jẹ́ ọ̀rọ̀ àyọlò tí àwọn ará Kọ́ríńtì máa ń sọ
  choice: 'Fi àmì àyọlò sí i: “Ohun gbogbo ni a gbà láàyè”'
  alternative: Kí a kọ ọ́ láìsí àmì àyọlò gẹ́gẹ́ bí gbólóhùn Pọ́ọ̀lù fúnra rẹ̀
  rationale: Ọ̀pọ̀ ẹ̀rí ìtumọ̀ fi hàn pé ó ṣeé ṣe kí Pọ́ọ̀lù máa fa ọ̀rọ̀ tí àwọn ará Kọ́ríńtì ń sọ yọ, kí ó sì fi ààlà sí i. Àwọn ìwé Gíríìkì àtijọ́ kò ní àmì àyọlò òde òní, nítorí náà èyí jẹ́ ìpinnu ìsọ̀rọ̀, kì í ṣe ìyàtọ̀ inú ọ̀rọ̀ ìwé.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé yé fún òǹkàwé òde òní. A lo ‘gbé ni ró’ láti pa àwòrán οἰκοδομεῖ mọ́, a sì fi àmì ohùn sí ibi tí ó bá yẹ.
