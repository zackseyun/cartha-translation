id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: yo
  text: Kò sí ìdẹwò kankan tí ó ti dé bá yín, àfi èyí tí ó wọ́pọ̀ fún ènìyàn[a]. Ṣùgbọ́n olóòtítọ́ ni Ọlọ́run; òun kì yóò jẹ́ kí a dẹ yín wò ju agbára tí ẹ ní láti fara dà lọ. Ṣùgbọ́n, pẹ̀lú ìdẹwò náà, yóò tún pèsè ọ̀nà àbáyọ[c], kí ẹ lè fara dà á.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àfi èyí tí ó jẹ́ ti ẹ̀dá ènìyàn.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àsálà” tàbí “àbájáde.” Gbólóhùn náà tẹnu mọ́ ohun tí Ọlọ́run pèsè, èyí tí ó mú kí ènìyàn lè fara da ìdẹwò náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: ìdẹwò / dẹ yín wò
  rationale: Àwọn ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìdẹwò sí ẹ̀ṣẹ̀ tàbí sí àdánwò. Nítorí àwọn ìkìlọ̀ nípa ìfẹ́kúfẹ̀ẹ́ búburú àti ìbọ̀rìṣà nínú àyíká ẹsẹ yìí, ‘ìdẹwò’ mú ìtumọ̀ ti ìwà rere àti ẹ̀ṣẹ̀ jáde, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘àdánwò’ mọ́.
- source_word: εἴληφεν
  choice: tí ó ti dé bá yín
  rationale: Ọ̀rọ̀ yìí sọ pé ìdẹwò ti dé bá wọn tàbí ti gbá wọn mú. ‘Ti dé bá yín’ jẹ́ Yorùbá àdánidá tí ó tún fi ipa perfect tense náà hàn.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: àfi èyí tí ó wọ́pọ̀ fún ènìyàn
  rationale: ἀνθρώπινος túmọ̀ sí ohun tí ó jẹ́ ti ènìyàn tàbí tí ó bá ìrírí ènìyàn mu. Gbólóhùn yìí fi hàn pé ìdẹwò wọn kì í ṣe ohun àrà ọ̀tọ̀ tàbí ohun tí ó ré kọjá ti ẹ̀dá ènìyàn.
- source_word: πιστός
  choice: olóòtítọ́
  rationale: Nípa Ọlọ́run, πιστός ń tẹnu mọ́ pé ó ṣeé gbẹ́kẹ̀ lé, ó sì dúró ṣinṣin nínú ohun tí ó ṣe.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: ju ohun tí ẹ lè gbà lọ
  rationale: Yíyàn yìí pa ìtumọ̀ ààlà agbára wọn mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí ènìyàn lè fara dà.
- source_word: ποιήσει
  choice: yóò tún pèsè
  rationale: Bí ó tilẹ̀ jẹ́ pé ποιέω lè túmọ̀ sí ‘ṣe,’ pẹ̀lú ἔκβασις ó ń sọ nípa ohun tí Ọlọ́run mú wà fún wọn; ‘pèsè’ ṣe ìtumọ̀ yẹn kedere ní Yorùbá.
- source_word: ἔκβασιν
  choice: ọ̀nà àbáyọ
  rationale: ἔκβασις lè jẹ́ ọ̀nà jíjáde, àbáyọ, tàbí àbájáde. ‘Ọ̀nà àbáyọ’ jẹ́ èdè Yorùbá tí ó yéni, ṣùgbọ́n gbólóhùn tó tẹ̀ lé e fi hàn pé àbáyọ náà ń fún wọn lágbára láti fara dà, kì í ṣe pé gbogbo ìdẹwò yóò dópin lẹ́sẹ̀kẹsẹ̀.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: kí ẹ lè fara dà á
  rationale: Gbólóhùn infinitive náà lè sọ ète tàbí àbájáde. ‘Kí ẹ lè fara dà á’ fi ìfaradà tí ὑποφέρω túmọ̀ sí hàn, ó sì sọ ohun tí a tọ́ka sí di kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ πειρασμός àti πειρασθῆναι
  choice: A lò ‘ìdẹwò’ àti ‘dẹ yín wò’ nínú ọ̀rọ̀ pàtàkì.
  alternative: A lè lò ‘àdánwò’ àti ‘dán yín wò,’ èyí tí ó lè ní ìtumọ̀ ìdánilẹ́kọ̀ọ́ tàbí ìṣòro tí ń yẹ ènìyàn wò.
  rationale: Àyíká ọ̀rọ̀ náà ń kìlọ̀ nípa ẹ̀ṣẹ̀ àti ìbọ̀rìṣà, nítorí náà ìtumọ̀ ìdẹwò sí ẹ̀ṣẹ̀ ṣe pàtàkì. Síbẹ̀, Gíríìkì gba ìtumọ̀ àdánwò pẹ̀lú, nítorí náà a pa á mọ́ nínú àlàyé láì sọ pé Ọlọ́run fúnra rẹ̀ ń tan ènìyàn sí ibi.
- issue: Bí ‘ọ̀nà àbáyọ’ ṣe bá ‘fara dà á’ mu
  choice: 'A pa àwọn méjèèjì mọ́: Ọlọ́run pèsè ọ̀nà àbáyọ kí àwọn onígbàgbọ́ lè fara da ìdẹwò náà.'
  alternative: A lè tú ἔκβασις sí ‘àbájáde’ tàbí ‘àsálà.’
  rationale: Ọ̀rọ̀ Gíríìkì kò fi dandan sọ pé ìdẹwò yóò kúrò lẹ́sẹ̀kẹsẹ̀; apá ìkẹyìn tẹnu mọ́ pé ohun tí Ọlọ́run pèsè ń mú kí ìfaradà ṣeé ṣe. Ìtumọ̀ náà kò yẹ kí ó pa ìforígbárí yìí rẹ́.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tí ó ní àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọlọ́wọ̀ àti àdánidá. Ọ̀rọ̀ náà ń bá ọ̀pọ̀ ènìyàn sọ, nítorí náà a lo ‘yín/ẹ.’ ‘Olóòtítọ́ ni Ọlọ́run’ pa ìtẹnumọ́ Gíríìkì mọ́, ‘ẹni tí’ kò sì pọn dandan nínú gbólóhùn Yorùbá kejì nítorí pé ‘òun’ tọ́ka sí Ọlọ́run ní kedere.
