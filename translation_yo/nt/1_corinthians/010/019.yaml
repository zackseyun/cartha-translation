id: 1CO.10.19
reference: 1 Corinthians 10:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί οὖν φημι; ὅτι ⸂εἰδωλόθυτόν τί ἐστιν, ἢ ὅτι εἴδωλόν⸃ τί ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/019.yaml
  text: What then am I saying? That food sacrificed to idols is anything[b][a], or that an idol is anything?
translation:
  language: yo
  text: Ǹjẹ́, kí ni mo ń sọ? Pé ohun jíjẹ́ tí a fi rúbọ sí òrìṣà ní ìjẹ́pàtàkì kankan[a][b], tàbí pé òrìṣà ní ìjẹ́pàtàkì kankan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pé ẹbọ sí òrìṣà ní ìjẹ́pàtàkì kankan.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, Pọ́ọ̀lù kò fi èyí sọ pé àwọn òrìṣà jẹ́ ọlọ́run gidi, tàbí pé ohun jíjẹ́ tí a fi rúbọ ní ìjẹ́pàtàkì tẹ̀mí nínú ara rẹ̀.
    reason: cross_reference
lexical_decisions:
- source_word: τί οὖν φημι
  choice: Ǹjẹ́ kí ni mo ń sọ?
  rationale: Ó pa ìbéèrè àsọyé, àkókò ìsinsìnyí, àti agbára ẹni àkọ́kọ́ nínú φημί mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ὅτι
  choice: Pé
  rationale: Ó fi àkóónú ohun tí a lè rò pé Pọ́ọ̀lù ń sọ hàn láì fi àlàyé míì kún un.
- source_word: εἰδωλόθυτόν
  choice: ohun tí a fi rúbọ sí òrìṣà
  rationale: Ó sọ ohun jíjẹ tàbí ẹran tí ó ní í ṣe pẹ̀lú ẹbọ òrìṣà ní ọ̀nà tí ó ṣe kedere, láì dín ọ̀rọ̀ náà sí ẹran nìkan.
- source_word: τί ἐστιν
  choice: jẹ́ nǹkan kan
  rationale: 'Ó pa kúkúrú àti àìṣedéédé ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́: bóyá ohun náà ní ìwàláàyè gidi tàbí ìjẹ́pàtàkì ní ọ̀nà tí àyíká ọ̀rọ̀ ń tọ́ka sí.'
- source_word: ἢ
  choice: tàbí
  rationale: Ó so àwọn gbólóhùn méjèèjì pọ̀ gẹ́gẹ́ bí àṣàyàn méjì tó jọra.
- source_word: εἴδωλον
  choice: òrìṣà
  rationale: Nínú àyíká ẹbọ àti ìjọsìn yìí, ‘òrìṣà’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ohun tàbí ẹni tí a ń bọ̀ gẹ́gẹ́ bí ọlọ́run èké; ó yẹra fún ‘ère’ tí ó lè túmọ̀ sí àwòrán lásán.
theological_decisions:
- issue: Bóyá ìbéèrè Pọ́ọ̀lù ń fi hàn pé òrìṣà tàbí ohun tí a fi rúbọ sí i ní ìwàláàyè tàbí agbára tẹ̀mí gidi
  choice: 'A túmọ̀ àwọn ìbéèrè náà ní tààràtà gẹ́gẹ́ bí ìbéèrè àsọyé: ‘Pé ohun tí a fi rúbọ sí òrìṣà jẹ́ nǹkan kan, tàbí pé òrìṣà jẹ́ nǹkan kan?’'
  alternative: Pé ẹbọ òrìṣà ní ìwàláàyè gidi kan, tàbí pé òrìṣà ní ìwàláàyè gidi kan?
  rationale: Ìtumọ̀ yìí pa àìṣedéédé àti ìforígbárí ẹ̀kọ́-ìgbàgbọ́ inú τί ἐστιν mọ́. Kò fi ìmọ̀ ọgbọ́n orí tàbí ìtumọ̀ ẹ̀sìn kan sínú ọ̀rọ̀ pàtàkì, bí ó tilẹ̀ jẹ́ pé àyíká fi hàn pé Pọ́ọ̀lù kò ka òrìṣà sí Ọlọ́run gidi tàbí ohun ẹbọ sí ohun tó ní agbára tẹ̀mí nínú ara rẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì rọrùn fún gbogbo ènìyàn. A lo ‘ohun tí a fi rúbọ sí òrìṣà’ láti yàgò fún dídi εἰδωλόθυτόν mọ́ ẹran nìkan. Àwọn àmì ohùn ni a fi sí ibi tí ó bá yẹ; ìtòlẹ́sẹẹsẹ [a][b] tẹ̀ lé ìfarahàn wọn lẹ́yìn gbólóhùn àkọ́kọ́.
