id: 1CO.13.1
reference: 1 Corinthians 13:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: yo
  text: Bí mo bá ń sọ̀rọ̀ ní àwọn èdè[a] ènìyàn[b] àti ti àwọn áńgẹ́lì, ṣùgbọ́n tí èmi kò ní ìfẹ́, mo ti di idẹ tí ń dún[c] tàbí ṣíńbálì tí ń pariwo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ahọ́n.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ahọ́n tàbí èdè; “àwọn ahọ́n” tún ní ìbáṣepọ̀ pẹ̀lú ìjíròrò nípa ọ̀rọ̀ tí Ẹ̀mí ń mú ẹni sọ ní Kọ́ríńtì.
    reason: lexical_alternative
  - marker: b
    text: “Ènìyàn” níhìn-ín túmọ̀ sí gbogbo ẹ̀dá ènìyàn, ní ìyàtọ̀ sí àwọn áńgẹ́lì.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “irin bàbà tí ń dún” tàbí “idẹ tí ń róhìn.” Ọ̀rọ̀ Gíríìkì fún apá àkọ́kọ́ yìí dárúkọ irin tó ń dún, kì í sì dárúkọ ohun èlò orin pàtó kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Bí ... bá
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí ni ọ̀nà àdánidá ní Yorùbá fún gbólóhùn àdéhùn àròsọ tàbí ohun tí a rò pé ó lè ṣẹlẹ̀.
- source_word: ταῖς γλώσσαις
  choice: ní àwọn èdè
  rationale: γλῶσσα lè túmọ̀ sí ahọ́n tàbí èdè. “Àwọn èdè” ṣe kedere sí òǹkàwé Yorùbá òde òní, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé pa ìtumọ̀ “àwọn ahọ́n” àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ọ̀rọ̀ fífi ẹ̀mí sọ̀rọ̀ mọ́.
- source_word: τῶν ἀνθρώπων
  choice: ènìyàn
  rationale: Níhìn-ín, ἄνθρωπος ń tọ́ka sí gbogbo ẹ̀dá ènìyàn ní ìyàtọ̀ sí àwọn áńgẹ́lì; “ènìyàn” jẹ́ ọ̀rọ̀ àdánidá, tí kò sì ní ìtumọ̀ akọ nìkan ní Yorùbá.
- source_word: λαλῶ
  choice: mo bá ń sọ̀rọ̀
  rationale: Ó mú ìṣe sísọ jáde ní ọ̀nà Yorùbá tó bá gbólóhùn àdéhùn mu.
- source_word: καὶ τῶν ἀγγέλων
  choice: àti ti àwọn áńgẹ́lì
  rationale: Ìyàtọ̀ tó wà láàárín ẹ̀dá ènìyàn àti àwọn ẹ̀dá ọ̀run fi hàn pé “áńgẹ́lì,” kì í ṣe “òjíṣẹ́,” ni ìtumọ̀ tó yẹ níhìn-ín.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu fún ἀγάπη láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan tí kò sí nínú ọ̀rọ̀ orísun kún un.
- source_word: δὲ μὴ ἔχω
  choice: ṣùgbọ́n tí èmi kò ní
  rationale: Ó pa ìtakora δέ àti èrò níní tàbí àìní ἀγάπη mọ́.
- source_word: γέγονα
  choice: mo ti di
  rationale: '“Mo ti di” pa ipa ọ̀rọ̀ perfect mọ́: ìyípadà ti ṣẹlẹ̀, ipò tó yọ lára rẹ̀ sì ń bá a lọ.'
- source_word: χαλκὸς ἠχῶν
  choice: bí idẹ tí ń dún
  rationale: “Idẹ” dúró fún irin bàbà/bronze tí ọ̀rọ̀ Gíríìkì ń dárúkọ, láìsọ ọ́ di ohun èlò orin pàtó. Fífi “bí” sí i jẹ́ àdánidá ní Yorùbá níbi tí ẹni kan ti sọ pé òun ti di ohun kan nínú àfiwé yìí.
- source_word: ἢ κύμβαλον ἀλαλάζον
  choice: tàbí aro tí ń pariwo
  rationale: “Aro” jẹ́ ohun èlò irin tí a máa ń lù kí ó dún; “tí ń pariwo” mú ariwo líle, aláriwo ti ἀλαλάζον jáde. Àlàyé ìsàlẹ̀ ojú-ewé jẹ́ kó ye ni pé κύμβαλον lè jẹ́ ṣimbali.
theological_decisions:
- issue: Ìtumọ̀ “àwọn èdè ènìyàn àti ti àwọn áńgẹ́lì”
  choice: A túmọ̀ ìyàtọ̀ náà ní tààrà láìpinnu bóyá èdè àwọn áńgẹ́lì jẹ́ èdè ọ̀run gidi tàbí ọ̀nà àsọdùn.
  alternative: Kí a sọ pé ó dájú pé ó ń tọ́ka sí èdè ọ̀run gidi, tàbí pé àsọdùn lásán ni.
  rationale: Ọ̀rọ̀ ẹsẹ̀ náà fúnra rẹ̀ kò yanju ọ̀ràn yìí; ìtumọ̀ náà pa àìdánilójú àti agbára ọ̀rọ̀ Pọ́ọ̀lù mọ́ láìfi ẹ̀kọ́ ẹgbẹ́ ìsìn kan kún un.
- issue: Ẹni tí τῶν ἀνθρώπων ń tọ́ka sí
  choice: Gbogbo ẹ̀dá ènìyàn, ní ìyàtọ̀ sí àwọn áńgẹ́lì.
  alternative: Àwọn ọkùnrin nìkan.
  rationale: Ọ̀rọ̀ orísun ń fi ìran ènìyàn wé àwọn áńgẹ́lì; kì í ṣe ìyàtọ̀ láàárín ọkùnrin àti obìnrin.
- issue: Àwòrán χαλκὸς ἠχῶν
  choice: A pa á mọ́ gẹ́gẹ́ bí idẹ tí ń dún, láìsọ pé ohun èlò pàtó kan ni.
  alternative: Agogo tàbí gong pàtó kan.
  rationale: Ọ̀rọ̀ Gíríìkì dárúkọ irin tó ń dún, ṣùgbọ́n kò fi dandan sọ irú ohun èlò náà; ìtumọ̀ náà kò gbọ́dọ̀ yan ohun tí orísun kò yan.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní, tó ní iyì, tí ó sì ṣe kedere ni a lò. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ. “Àwọn èdè” rọrùn fún òǹkàwé gbogbogbò, nígbà tí àlàyé [a] pa “àwọn ahọ́n” mọ́ gẹ́gẹ́ bí àṣàyàn. “Aro” jẹ́ ọ̀rọ̀ abinibi tó sun mọ́ ohun èlò irin aláriwo; a yàgò fún ìtumọ̀ tó lè fi ohun èlò kan pàtó sínú χαλκός.
