  yaml_path: translation/nt/1_corinthians/013/007.yaml
  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: yo
  text: Ó ń fara da ohun gbogbo[a], ó ń gba ohun gbogbo gbọ́[b], ó ń retí ohun gbogbo, ó sì ń farada ohun gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ó ń bo ohun gbogbo” tàbí “Ó ń dáàbò bo ohun gbogbo.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí bíbò tàbí dídáàbò bo, àti sí fífaradà.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń gbẹ́kẹ̀ lé ohun gbogbo.” Èyí kò túmọ̀ sí pé ìfẹ́ máa ń gba ohunkóhun gbọ́ láìronú, bí kò ṣe pé ó ní ìtẹ̀sí láti gbẹ́kẹ̀ lé.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ yìí fara mọ́ ìtumọ̀ gbòòrò ti πάντα, ó sì jẹ́ kí àtúnwí ọ̀rọ̀ náà hàn kedere nínú gbogbo gbólóhùn mẹ́rẹ̀ẹ̀rin.
- source_word: στέγει
  choice: ń fara da
  rationale: Ó sọ ìfaradà ìfẹ́ ní èdè Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ mìíràn, ‘bo mọ́lẹ̀’ tàbí ‘dáàbò bo,’ mọ́.
- source_word: πιστεύει
  choice: ń gba ... gbọ́
  rationale: Èyí ni ìtumọ̀ tààrà fún πιστεύει, ó sì pa ìbáramu ọ̀nà gbólóhùn Gíríìkì mọ́; àlàyé fi ‘gbẹ́kẹ̀ lé’ hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn láì sọ pé ìfẹ́ jẹ́ aláìlóye.
- source_word: ἐλπίζει
  choice: ń retí
  rationale: Ó jẹ́ ọ̀rọ̀ kúkúrú, àdánidá tí ó fi ìwà ìfẹ́ tí ń bá a lọ hàn.
- source_word: ὑπομένει
  choice: ń forí tì í dé òpin
  rationale: Gbólóhùn yìí fi ìdúró ṣinṣin lábẹ́ ìṣòro àti ìfaradà tí kò jáwọ́ hàn, ó sì yà á díẹ̀ sí στέγει nínú Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ àtúnwí πάντα nínú àpèjúwe ìfẹ́
  choice: A mú ‘ohun gbogbo’ wá ní gbogbo ìgbà láti pa ìtẹnumọ́ àti ìgbòòrò ọ̀rọ̀ Pọ́ọ̀lù mọ́.
  alternative: Kí a túmọ̀ rẹ̀ lọ́nà tó dín ìtumọ̀ rẹ̀ kù, tàbí bí ẹni pé ìfẹ́ ń gba gbogbo ẹ̀sùn tàbí gbogbo ohun búburú láàyè láìronú.
  rationale: Àyíká ọ̀rọ̀ jẹ́ àpèjúwe ewì nípa ìwà ìfẹ́. Àtúmọ̀ náà pa ìtẹnumọ́ gbòòrò mọ́ láìfi kún un pé ìfẹ́ kò ní ìfòyemọ̀ tàbí pé ó fọwọ́ sí ohun gbogbo.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì rọrùn fún gbogbo ènìyàn. A lo àtúnwí ‘ohun gbogbo’ láti pa ìlù àti ìtẹnumọ́ orísun Gíríìkì mọ́. A gbé àmì [b] sí lẹ́yìn πιστεύει, ibi tí àlàyé ‘gbẹ́kẹ̀ lé’ ti jẹ mọ́ ní ti ọ̀rọ̀ ìpilẹ̀.
