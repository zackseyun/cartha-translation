id: 1CO.13.2
reference: 1 Corinthians 13:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: yo
  text: Bí mo bá ní ẹ̀bùn àsọtẹ́lẹ̀, tí mo sì mọ gbogbo ohun ìjìnlẹ̀ àti gbogbo ìmọ̀, tí mo sì ní gbogbo ìgbàgbọ́ débi pé mo lè ṣí àwọn òkè kúrò ní ipò wọn, ṣùgbọ́n tí èmi kò ní ìfẹ́, èmi kò jẹ́ nǹkan kan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gbogbo ìgbàgbọ́” tún lè túmọ̀ sí “gbogbo ìgbẹ́kẹ̀lé”; ní ìtumọ̀ tí kò ṣeé ṣe jù, ó lè túmọ̀ sí “gbogbo ìdúróṣinṣin nínú ìgbàgbọ́.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ púpọ̀, ṣùgbọ́n níbí ó ṣeé ṣe jù pé ó ń tọ́ka sí ìgbàgbọ́ àràọ̀tọ̀ tí ó lè ṣe iṣẹ́ ìyanu.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείαν
  choice: ẹ̀bùn àsọtẹ́lẹ̀
  rationale: Nínú àyíká ọ̀rọ̀ nípa àwọn ẹ̀bùn ti Ẹ̀mí, yíyàn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ orúkọ náà mọ́ láì sọ ọ́ di ipò wòlíì.
- source_word: εἰδῶ
  choice: mọ
  rationale: “Mọ” bá ohun ìjìnlẹ̀ àti ìmọ̀ mu ní Yorùbá, ó sì fi ìmòye ẹni hàn láì ṣe àfikún ìtumọ̀ tí kò sí nínú Gíríìkì.
- source_word: μυστήρια
  choice: àwọn ohun ìjìnlẹ̀
  rationale: Èyí tọ́ka sí àwọn òtítọ́ tàbí ète tí ó farapamọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí òǹkàwé òde òní lè lóye.
- source_word: γνῶσιν
  choice: ìmọ̀
  rationale: Ìtumọ̀ tààrà yìí pa ìyàtọ̀ ọ̀rọ̀ mọ́ láàárín εἰδῶ, ìṣe ‘mọ,’ àti γνῶσις, orúkọ ‘ìmọ̀.’
- source_word: πᾶσαν τὴν πίστιν
  choice: gbogbo ìgbàgbọ́
  rationale: Ó tẹ̀ lé àfikún πᾶσαν, ó sì jẹ́ kí gbólóhùn àsọdùn nípa ìgbàgbọ́ alágbára láti ṣe iṣẹ́ ìyanu dúró láì sọ ọ́ di ẹ̀kọ́ nípa ìgbàlà.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: débi pé mo lè ṣí àwọn òkè kúrò ní ipò wọn
  rationale: Yíyàn yìí mú àwòrán Gíríìkì àti ìtumọ̀ àbájáde ὥστε jáde ní Yorùbá àdánidá.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá gbogbogbòò tí ó bá ἀγάπη mu nínú àyíká yìí, láì dín un kù sí àánú tàbí fífúnni nìkan.
- source_word: οὐθέν εἰμι
  choice: èmi kò jẹ́ nǹkan kan
  rationale: Ó pa ìtẹnumọ́ líle Pọ́ọ̀lù mọ́ pé gbogbo ẹ̀bùn wọ̀nyí kò fún ẹni náà ní iye bí ìfẹ́ kò bá sí.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àyíká agbára láti ṣí òkè
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Nínú gbólóhùn yìí, àwòrán ṣíṣí òkè fi ìgbàgbọ́ àràọ̀tọ̀ tí ó ní í ṣe pẹ̀lú iṣẹ́ ìyanu hàn. “Ìgbẹ́kẹ̀lé” ṣeé ṣe gẹ́gẹ́ bí ìtumọ̀ gbogbogbòò, ṣùgbọ́n “ìṣòtítọ́” kò fi bẹ́ẹ̀ bá ìṣètò ọ̀rọ̀ àti àyíká mu.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn láti ka. A lo “Bí mo tilẹ̀…” láti gbé àfọwọ̀ṣe àsọdùn Pọ́ọ̀lù jáde, a sì lo “èmi” ní ìparí fún ìtẹnumọ́.
