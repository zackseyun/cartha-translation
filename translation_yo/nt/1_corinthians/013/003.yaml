id: 1CO.13.3
reference: 1 Corinthians 13:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: yo
  text: Bí mo bá pín gbogbo ohun ìní mi fún àwọn ẹlòmíràn, tí mo sì fi ara mi jọ̀wọ́ kí a lè sun mí,[a] ṣùgbọ́n tí èmi kò ní ìfẹ́, èmi kò jèrè ohunkóhun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ní, “kí n lè ṣògo,” dípò “kí a lè sun mí.”
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: pín ... fún àwọn ẹlòmíràn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pípín ohun ní ìpín kéékèèké fún ẹlòmíràn, pàápàá gẹ́gẹ́ bí ìrànlọ́wọ́; yíyan yìí jẹ́ èdè Yorùbá àdánidá, ó sì fi ìṣe fífúnni hàn.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: gbogbo ohun ìní mi
  rationale: Ó tọ́ka sí gbogbo dúkìá tàbí ohun tí ẹni ní; ‘gbogbo ohun ìní mi’ ṣe kedere, ó sì pa ìtumọ̀ ohun-ìní ayé mọ́.
- source_word: παραδῶ
  choice: fi ... lé wọn lọ́wọ́
  rationale: Èyí pa ìtumọ̀ fífi ara ẹni lé ẹlòmíràn lọ́wọ́ mọ́ láì fi èrò ìrúbọ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
- source_word: τὸ σῶμά μου
  choice: ara mi
  rationale: Ìtumọ̀ tààrà fún gbólóhùn tí ń tọ́ka sí ara ènìyàn gan-an.
- source_word: ἵνα
  choice: kí a lè
  rationale: Ó fi ète tàbí àbájáde tí a fẹ́ hàn ní èdè Yorùbá tí ó rọrùn láti lóye.
- source_word: καυθήσομαι
  choice: kí a lè sun mí
  rationale: A tẹ̀lé àkọsílẹ̀ SBLGNT, ìṣe ọjọ́ iwájú aláìṣe láti inú καίω, ‘sun’; a kò fi àyípadà àfọwọ́kọ ‘ṣògo’ sínú ẹsẹ̀ pàtàkì.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: ‘Ìfẹ́’ ni ọ̀rọ̀ Yorùbá àdánidá tí ó bójú mu fún ἀγάπη nínú ọ̀rọ̀ yìí, láì dín ìtumọ̀ rẹ̀ kù sí fífúnni nìkan.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: èmi kò jèrè ohunkóhun
  rationale: Ó pa ìtumọ̀ pé ẹni náà kò rí àǹfààní tàbí èrè kankan mọ́, ó sì jẹ́ èdè Yorùbá tí ó ṣe kedere.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: Àti bí ... tí ... sì
  rationale: Ètò yìí pa ìlọsíwájú àwọn àpẹẹrẹ oníṣ条件 méjèèjì mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Àyípadà àfọwọ́kọ nínú gbólóhùn ète
  choice: A túmọ̀ καυθήσομαι gẹ́gẹ́ bí ‘kí a lè sun mí’ nínú ẹsẹ̀ pàtàkì.
  alternative: καυχήσωμαι — ‘kí n lè ṣògo’
  rationale: SBLGNT tí a pèsè ni a tẹ̀lé gẹ́gẹ́ bí orísun pàtàkì. Nítorí àyípadà náà lè yí ìtumọ̀ padà láti fífi ara ẹni fún jíjóná sí ṣíṣògo, a ṣàfihàn rẹ̀ ní àlàyé ìsàlẹ̀ láì pinnu ìjiyàn náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti ti òde òní ni a lò. A pa àtúnṣe ọ̀rọ̀ Pọ́ọ̀lù àti ìtẹnumọ́ ‘èmi’ nínú àbájáde mọ́; àmì àlàyé [a] wà lẹ́yìn gbólóhùn tí àyípadà àfọwọ́kọ kan.
