  to: Bí mo bá pín gbogbo ohun ìní mi fún àwọn ẹlòmíràn, tí mo sì fi ara mi jọ̀wọ́ kí a lè sun mí,[a] ṣùgbọ́n tí èmi kò ní ìfẹ́, èmi kò jèrè ohunkóhun.
