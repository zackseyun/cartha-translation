id: 1CO.13.13
reference: 1 Corinthians 13:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: yo
  text: Ṣùgbọ́n ní báyìí[a], ìgbàgbọ́[c], ìrètí àti ìfẹ́—àwọn mẹ́ta wọ̀nyí—ń dúró[b]. Ṣùgbọ́n èyí tí ó tóbi jù lọ nínú wọn ni ìfẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Ní báyìí sì”; ọ̀rọ̀ àsopọ̀ Gíríìkì náà lè fi ìtẹ̀síwájú tàbí ìyàtọ̀ hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ń bá a lọ” tàbí “ń wà títí”; ọ̀rọ̀ náà lè túmọ̀ sí dídúró, títẹ̀síwájú tàbí fífaradà.
    reason: lexical_alternative
  - marker: c
    text: “Ìgbàgbọ́” tún lè ní ìtumọ̀ gbígbòòrò ti “ìgbẹ́kẹ̀lé,” bí ó tilẹ̀ jẹ́ pé “ìgbàgbọ́” ló bá àyíká ọ̀rọ̀ yìí mu jù lọ.
    reason: alternative_reading
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ṣùgbọ́n ní báyìí
  rationale: “Ní báyìí” fi ìtumọ̀ νυνί hàn, “ṣùgbọ́n” sì mú agbára ìyàtọ̀ inú δέ jáde ní ìbámu pẹ̀lú ohun tí ó ṣáájú. Àlàyé ìsàlẹ̀ ojú-ìwé pa ìtumọ̀ àsopọ̀ míì mọ́.
- source_word: μένει
  choice: ń dúró
  rationale: Níhìn-ín μένω túmọ̀ sí pé ohun kan ń bá a lọ, kò sì kọjá lọ. “Ń dúró” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìyàtọ̀ sí àwọn ẹ̀bùn tí yóò dópin mu.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: Nínú àkójọpọ̀ yìí pẹ̀lú ìrètí àti ìfẹ́, “ìgbàgbọ́” ni ìtumọ̀ tó bójú mu jù lọ; ó tún lè ní ìfarahàn ìgbẹ́kẹ̀lé, èyí tí àlàyé ìsàlẹ̀ ojú-ìwé mẹ́nu kàn.
- source_word: ἐλπίς
  choice: ìrètí
  rationale: “Ìrètí” ni ọ̀rọ̀ Yorùbá àdánidá fún ἐλπίς, ó sì pa ìtumọ̀ fífi ọkàn sí ohun rere tí a ń retí mọ́.
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ìtumọ̀ Yorùbá tó ṣe kedere, tó gbòòrò, tí ó sì bá ọ̀rọ̀ Pọ́ọ̀lù ní orí yìí mu.
- source_word: τὰ τρία ταῦτα
  choice: àwọn mẹ́ta wọ̀nyí
  rationale: Gbólóhùn yìí tọ́ka padà sí ìgbàgbọ́, ìrètí àti ìfẹ́. Àmì gígùn méjì mú àfikún náà ṣe kedere láìfi ọ̀rọ̀ kún orísun.
- source_word: μείζων δὲ τούτων
  choice: Ṣùgbọ́n èyí tí ó tóbi jù lọ nínú wọn
  rationale: Bí ó tilẹ̀ jẹ́ pé μείζων jẹ́ ọ̀rọ̀ ìfiwéra, ìṣètò rẹ̀ pẹ̀lú τούτων fi hàn pé a ń yan èyí tó ga jù lọ láàárín àwọn mẹ́tẹ̀ẹ̀ta. “Tó tóbi jù lọ nínú wọn” sọ ìpele yìí ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àkójọpọ̀ ìgbàgbọ́, ìrètí àti ìfẹ́
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Àyíká ọ̀rọ̀ yìí ṣe àtìlẹ́yìn fún “ìgbàgbọ́” ju “ìṣòtítọ́” lọ. Síbẹ̀, àlàyé fi hàn pé èrò ìgbẹ́kẹ̀lé lè wà nínú ọ̀rọ̀ náà, láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Agbára ìfiwéra inú μείζων
  choice: èyí tí ó tóbi jù lọ nínú wọn ni ìfẹ́
  alternative: ìfẹ́ tóbi ju àwọn wọ̀nyí lọ
  rationale: Ìtumọ̀ tí a yàn fi ìfẹ́ hàn gẹ́gẹ́ bí èyí tó ga jù lọ láàárín àwọn mẹ́ta, ṣùgbọ́n kò sọ pé àwọn méjì yòókù kò ṣe pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. Àtòjọ tí a fi àmì gígùn méjì yà sọ́tọ̀ pa ìtẹnumọ́ Gíríìkì mọ́.
