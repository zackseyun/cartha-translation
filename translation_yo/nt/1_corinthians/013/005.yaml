  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń tẹ̀lé ìtòlẹ́sẹẹsẹ Gíríìkì dáadáa, ó sì pa àwòrán ‘kíkà/ìṣirò’ nínú λογίζεται mọ́. Síbẹ̀, ‘a kì í mú un bínú’ yí παροξύνεται padà sí ìṣe tí ẹni mìíràn ń ṣe sí ìfẹ́ (‘a kì í mú ìfẹ́ bínú’), dípò àpèjúwe ìfẹ́ fúnra rẹ̀ pé kò ní ìbínú. ‘Nìkan’ nínú ‘ohun ti ara rẹ̀ nìkan’ sì lè mú ìfọwọ́kànsí ‘only’ wá, tí kò hàn ní tààrà nínú orísun náà.
  naturalness: ‘Kì í bínú’ jẹ́ Yorùbá ìgbàlódé tó rọrùn, ó sì bá ẹ̀yà àwọn gbolohun àpèjúwe ìfẹ́ mu. ‘Kì í wá ohun tirẹ̀’ jẹ́ ìsọ̀rọ̀ adayébá, tí ó sì sọ ìmọtara-ẹni-nìkan láì fi àfikún ‘nìkan’ kún un.
  terminology: ‘Hùwà lọ́nà tí kò bójú mu’ ń ṣàfihàn ἀσχημονεῖ dáadáa láì dín un kù sí ìwà àìlẹ́gbẹ́ nìkan. ‘Ohun búburú’ ń pa ìfẹ̀gbẹ̀yà àìdánilójú τὸ κακόν mọ́; àlàyé ìsàlẹ̀ lè tọ́ka sí ìtumọ̀ ìbáṣepọ̀ rẹ̀.
