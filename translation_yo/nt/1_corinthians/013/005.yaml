translation:
  language: yo
  text: Kì í hùwà lọ́nà tí kò bójú mu[a], kì í wá ohun tirẹ̀[b], kì í bínú[c], kì í sì ka ohun búburú sílẹ̀[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í hùwà lọ́nà tí kò yẹ,” tàbí “kì í hùwà àìtọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “kì í wá ohun tirẹ̀”; ìyẹn ni pé, kì í ṣe onímọtara-ẹni-nìkan.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kì í ru sókè sínú ìbínú.” Gíríìkì kò ní ọ̀rọ̀ tó túmọ̀ sí “tètè” tàbí “rọrùn.”
    reason: source_clarification
  - marker: d
    text: Èyí tún lè túmọ̀ sí pé kì í pa àkọsílẹ̀ àwọn ohun búburú tí a ṣe sí i mọ́. Ní tààrà, “kì í ka ohun búburú sílẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: hùwà lọ́nà tí kò bójú mu
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìwà tí kò yẹ, tí ó lè kó ìtìjú báni tàbí tí kò bá ìlànà rere mu. Gbólóhùn Yorùbá yìí gbòòrò tó láì dín ìtumọ̀ rẹ̀ kù sí àìní ìwà ọmọlúwàbí nìkan.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: wá ohun ti ara rẹ̀ nìkan
  rationale: Èyí mú àwòrán ọ̀rọ̀ Gíríìkì, ‘wá àwọn ohun tirẹ̀,’ wá sí Yorùbá adayébá, ó sì fi ìwà ìmọtara-ẹni-nìkan hàn láì sọ pé ó ń fi tipátipá gba ọ̀nà tirẹ̀.
- source_word: παροξύνεται
  choice: a kì í mú un bínú
  rationale: Ìṣètò aláìṣe Gíríìkì ń sọ pé a kì í ru ìfẹ́ sókè sínú ìbínú. Ìtumọ̀ yìí kò fi ọ̀rọ̀ àfikún bí ‘ní kíákíá’ tàbí ‘rọrùn’ sí ohun tí orísun kò sọ ní tààrà.
- source_word: λογίζεται
  choice: ka ... sílẹ̀
  rationale: ‘Ka sílẹ̀’ ń pa àwòrán ìṣirò tàbí pípa àkọsílẹ̀ mọ́, ó sì jẹ́ ọ̀nà tí ó ṣeé lóye ní Yorùbá.
- source_word: τὸ κακόν
  choice: ohun búburú
  rationale: Ẹyọ ọ̀rọ̀ yìí lè túmọ̀ sí ibi ní gbogbogbòò tàbí ohun búburú tí ẹnì kan ṣe. ‘Ohun búburú’ pa àìdánilójú yẹn mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ ìbáṣepọ̀ hàn.
- source_word: ἀγάπη (kókó ọ̀rọ̀ tí àyíká fi hàn)
  choice: ó / un
  rationale: Àyíká ẹsẹ tó ṣáájú fi ‘ìfẹ́’ múlẹ̀ gẹ́gẹ́ bí olùṣe. Yorùbá lè máa bá àpèjúwe náà lọ pẹ̀lú arọ́pò-orúkọ láì tún ‘ìfẹ́’ sọ ní gbogbo gbólóhùn.
theological_decisions:
- issue: Bóyá kí παροξύνεται di ‘kì í tètè bínú’
  choice: a kì í mú un bínú
  alternative: kì í tètè bínú
  rationale: ‘Tètè’ fi ìwọ̀n tàbí bí ó ṣe rọrùn kun ọ̀rọ̀ náà, ṣùgbọ́n kò sí ọ̀rọ̀ tó bá a mu nínú Gíríìkì. A pa ìtumọ̀ aláìṣe àti líle ọ̀rọ̀ náà mọ́.
- issue: Bóyá kí λογίζεται τὸ κακόν túmọ̀ sí pípa àkọsílẹ̀ àwọn àṣìṣe tàbí ríronú ibi
  choice: kì í ka ohun búburú sílẹ̀
  alternative: kì í di àṣìṣe mú ẹni; kì í ronú ibi
  rationale: Gíríìkì lo ọ̀rọ̀ ìṣirò pẹ̀lú ‘ohun búburú’ ní ẹyọ kan. Ìtumọ̀ yìí pa àwòrán ìṣirò náà àti ìwọ̀n àìdánilójú rẹ̀ mọ́, láì sọ ọ́ di ẹ̀kọ́ pé ìfẹ́ ń foju kọ gbogbo ìdájọ́ ìwà rere tàbí ibi.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ adayébá. Gbólóhùn náà ń bá kókó ‘ìfẹ́’ láti inú àyíká lọ, ó sì pa ìṣọ̀kan àwọn gbólóhùn kúkúrú Gíríìkì mọ́.
