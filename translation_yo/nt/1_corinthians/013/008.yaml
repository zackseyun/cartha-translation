id: 1CO.13.8
reference: 1 Corinthians 13:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: yo
  text: Ìfẹ́ kì í kùnà láélá.[a] Ṣùgbọ́n bí àwọn àsọtẹ́lẹ̀ bá wà, a ó mú wọn kúrò ní lílò; bí àwọn ahọ́n[b] bá wà, wọn yóò dáwọ́ dúró; bí ìmọ̀ bá sì wà, a ó mú un kúrò ní lílò.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìfẹ́ kì í ṣubú láélá,” tàbí, “Ìfẹ́ kì í dópin láélá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn èdè.”
    reason: alternative_reading
  - marker: c
    text: Ọ̀rọ̀-ìṣe tí a túmọ̀ sí “mú ... kúrò ní lílò” jẹ́ ọ̀rọ̀ kan náà nínú gbólóhùn nípa “àwọn àsọtẹ́lẹ̀” àti èyí tó sọ nípa “ìmọ̀.”
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: Ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì gbòòrò tó láti sọ irú ìfẹ́ tí Pọ́ọ̀lù ń ṣàpèjúwe ní apá yìí.
- source_word: οὐδέποτε
  choice: kì í ... láélá
  rationale: 'Àpapọ̀ ọ̀rọ̀ yìí sọ ìkọ̀ pátápátá ní Yorùbá àdánidá: kò ṣẹlẹ̀ nígbà kankan.'
- source_word: πίπτει
  choice: kùnà
  rationale: Nínú àyíká yìí, πίπτει kì í ṣe ṣíṣubú ní ti ara; “kùnà” fi hàn pé ìfẹ́ dúró ṣinṣin, láì sọ ọ́ di ọ̀kan náà pẹ̀lú àwọn ọ̀rọ̀ ìdáwọ́dúró tó tẹ̀ lé e.
- source_word: εἴτε δὲ
  choice: Ṣùgbọ́n bí ... bá wà
  rationale: Èyí mú ìyípadà atakò àti ọ̀wọ́ àwọn ipò tí εἴτε gbé kalẹ̀ jáde ní Yorùbá tó ṣe kedere.
- source_word: προφητεῖαι
  choice: àwọn àsọtẹ́lẹ̀
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ọ̀rọ̀ tàbí iṣẹ́ àsọtẹ́lẹ̀; “àwọn àsọtẹ́lẹ̀” jẹ́ ìtumọ̀ Yorùbá tó mọ́gbọ́n dání.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: a ó mú wọn/un kúrò ní lílò
  rationale: Ìtumọ̀ yìí tẹnu mọ́ dídá iṣẹ́ wọn dúró láìfi ìparun pátápátá kún ọ̀rọ̀ náà; a tún lo gbolohun kan náà ní ibi méjèèjì.
- source_word: γλῶσσαι
  choice: àwọn ahọ́n
  rationale: “Àwọn ahọ́n” pa ọ̀rọ̀ àkànṣe inú 1 Kọ́ríńtì 12–14 mọ́, kò sì pinnu bóyá ó túmọ̀ sí àwọn èdè ènìyàn nìkan.
- source_word: παύσονται
  choice: wọn yóò dáwọ́ dúró
  rationale: Èyí jẹ́ ọ̀nà àdánidá láti sọ pé wọn yóò ṣíwọ́, ó sì pa ìyàtọ̀ rẹ̀ mọ́ sí καταργέω.
- source_word: γνῶσις
  choice: ìmọ̀
  rationale: “Ìmọ̀” bá lílo ọ̀rọ̀ náà ní àyíká lẹ́sẹ̀kẹsẹ̀ mu, níbi tí Pọ́ọ̀lù ti ń sọ nípa mímọ̀ ní apá kan.
theological_decisions:
- issue: Ìtumọ̀ πίπτει nínú gbólóhùn àkọ́kọ́
  choice: Ìfẹ́ kì í kùnà láélá
  alternative: Ìfẹ́ kì í ṣubú láélá; Ìfẹ́ kì í dópin láélá
  rationale: “Kùnà” fi ìdúróṣinṣin ìfẹ́ hàn, ṣùgbọ́n kò da πίπτει pọ̀ mọ́ àwọn ọ̀rọ̀ tó túmọ̀ sí dídáwọ́ dúró tàbí mímú kúrò ní lílò.
- issue: Ìtumọ̀ γλῶσσαι nínú orí yìí
  choice: àwọn ahọ́n
  alternative: àwọn èdè
  rationale: “Àwọn ahọ́n” pa ìtumọ̀ àkànṣe ẹ̀bùn tí a ń jíròrò mọ́, ó sì fi àríyànjiyàn nípa bí ìṣẹ̀lẹ̀ náà ṣe rí sílẹ̀ láìyanjú rẹ̀ nípasẹ̀ ìtumọ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún òǹkàwé gbogbo. A fi àmì ohùn sí ibi tó bá yẹ, a sì pa ìyàtọ̀ àwọn ọ̀rọ̀-ìṣe Gíríìkì mọ́ láàárín mímú kúrò ní lílò àti dídáwọ́ dúró.
