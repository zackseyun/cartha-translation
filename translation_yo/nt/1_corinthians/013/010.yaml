  text: ὅταν δὲ ἔλθῃ τὸ τέλειον, ⸀τὸ ἐκ μέρους καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ohun tí ó pé bá dé[a], a ó mú ohun tí ó jẹ́ apá kan di aláìṣiṣẹ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ohun tí ó kún” tàbí “ohun tí ó dàgbà dénú.” Gbólóhùn Gíríìkì náà (to teleion) lè túmọ̀ sí ìpéye, ìkúnrẹ́rẹ́, tàbí ìdàgbàdénú; ohun tí ó ń tọ́ka sí níhìn-ín jẹ́ ọ̀rọ̀ ìjiyàn.
    reason: alternative_reading
  - marker: b
    text: Tàbí “a ó mú un dópin,” “yóò kọjá lọ,” tàbí “a ó mú un di aláìṣiṣẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: nígbà tí ... bá
  rationale: Ìṣètò ‘nígbà tí ... bá’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi hàn pé iṣẹlẹ̀ ọjọ́ iwájú ni a ń retí, ó sì pa ìtumọ̀ àkókò àti àìdánilójú gírámà Gíríìkì mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn láàárín ohun tí ó jẹ́ apá kan nísinsìnyí àti ohun tí yóò dé.
- source_word: ἔλθῃ
  choice: bá dé
  rationale: Ọ̀rọ̀ yìí tọ́ka sí dídé ohun tí a ń retí lọ́jọ́ iwájú; ‘bá dé’ bá gbólóhùn àkókò Yorùbá mu.
- source_word: τὸ τέλειον
  choice: èyí tí ó pé
  rationale: Àṣàyàn yìí fi ọ̀rọ̀ náà sílẹ̀ gẹ́gẹ́ bí ohun tí ó pé tàbí tí ó kún, láì dá ohun tí ó ń tọ́ka sí mọ́ ní pàtó.
- source_word: τὸ ἐκ μέρους
  choice: èyí tí ó jẹ́ apá kan
  rationale: Ó ṣàfihàn ọ̀rọ̀-asọ́pò tí a fi ṣe ọ̀rọ̀-orúkọ nínú Gíríìkì, ó sì pa ìyàtọ̀ rẹ̀ sí ‘èyí tí ó pé’ mọ́.
- source_word: καταργηθήσεται
  choice: a ó mú ... kúrò
  rationale: Fọ́ọ̀mù aláìṣe Gíríìkì tọ́ka sí pé a ó sọ ohun tí ó jẹ́ apá kan di aláìṣiṣẹ́ tàbí mú un dé òpin; yíyan yìí kò túmọ̀ rẹ̀ sí ìparun pátápátá.
theological_decisions:
- issue: Ìtumọ̀ τὸ τέλειον
  choice: A túmọ̀ ọ́ ní gbogbogbòò sí ‘èyí tí ó pé,’ láì sọ ohun tí ó ń tọ́ka sí ní pàtó.
  alternative: ‘èyí tí ó kún,’ ‘èyí tí ó dàgbà dénú,’ tàbí ìpéye ọjọ́ iwájú tí a so mọ́ ìpadà Kristi àti mímọ̀ lójúkojú; àwọn kan tún ti kà á sí ìparí Ìwé Mímọ́.
  rationale: Gíríìkì ẹsẹ yìí kò dá ohun tí gbólóhùn náà ń tọ́ka sí mọ́. Fọ́ọ̀mù àárín akọ àti abo rẹ̀ lè tọ́ka sí èrò àìlódì tàbí ohun àpapọ̀, ṣùgbọ́n kò yanjú ìjiyàn náà. Nítorí náà, ìtumọ̀ náà pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Èyí tí ó pé’ àti ‘èyí tí ó jẹ́ apá kan’ pa ìfarawé ìtumọ̀ àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́, bí ó tilẹ̀ jẹ́ pé wọ́n ní ìwọ̀nba ìṣètò ọ̀rọ̀ tó ga ju èdè ojoojúmọ́ lọ.
