id: 1CO.13.11
reference: 1 Corinthians 13:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: yo
  text: Nígbà tí mo jẹ́ ọmọ kékeré, mo máa ń sọ̀rọ̀ bí ọmọ kékeré, mo máa ń ronú bí ọmọ kékeré, mo sì máa ń gbé ọ̀rọ̀ yẹ̀ wò bí ọmọ kékeré. Nígbà tí mo di ọkùnrin, mo ti fi àwọn ohun ti ọmọ kékeré sílẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn ohun ọmọdé” tàbí “àwọn ìwà ọmọ kékeré.” Ní tààràtà, Gíríìkì náà ní, “àwọn ohun ti ọmọ kékeré.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: ọmọ kékeré
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ọmọ tí kò tíì dàgbà, ó sì lè ní ìtumọ̀ àìgbó. “Ọmọ kékeré” jẹ́ èdè Yorùbá àdánidá, ó sì yẹra fún dídín ìtumọ̀ náà kù sí ọmọ ọwọ́ nìkan.
- source_word: ἐλάλουν
  choice: mo máa ń sọ̀rọ̀
  rationale: Àkókò ọ̀rọ̀ Gíríìkì fi ìṣe tí ó ń bá a lọ ní ìgbà àtijọ́ hàn; “máa ń sọ̀rọ̀” mú ìtumọ̀ ìṣe àṣà yẹn jáde dáadáa.
- source_word: ἐφρόνουν
  choice: mo máa ń ronú
  rationale: φρονέω lè túmọ̀ sí ríronú tàbí níní irú èrò inú kan. “Ronú” ṣe kedere, ó sì pa ìlànà ọ̀rọ̀ mẹ́ta inú ẹsẹ náà mọ́.
- source_word: ἐλογιζόμην
  choice: mo máa ń gbé ọ̀rọ̀ yẹ̀ wò
  rationale: λογίζομαι ń sọ nípa fífi èrò ṣe àgbéyẹ̀wò tàbí ríronú lórí ọ̀rọ̀ kan. Gbólóhùn yìí yà á sọ́tọ̀ kúrò nínú “ronú” láìsọ pé ìṣirò nọ́ńbà ni.
- source_word: γέγονα
  choice: mo di
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì wà ní perfect, “nígbà tí mo di” ni ìsọ̀rọ̀ Yorùbá tó ṣe déédéé fún ìyípadà sí ipò tuntun.
- source_word: ἀνήρ
  choice: ọkùnrin
  rationale: ἀνήρ jẹ́ ọ̀rọ̀ akọ ní pàtó, “ọkùnrin” sì pa ìyàtọ̀ tó wà láàárín ọmọ kékeré àti ọkùnrin mọ́.
- source_word: κατήργηκα
  choice: mo fi … sílẹ̀
  rationale: Nínú àpẹẹrẹ ìdàgbàsókè yìí, ọ̀rọ̀ náà túmọ̀ sí kí ènìyàn má ṣe lo àwọn ohun ọmọdé mọ́. “Fi sílẹ̀” jẹ́ ọ̀nà Yorùbá tó ṣe kedere tí kò sì le ju bí “fòpin sí” lọ.
- source_word: τὰ τοῦ νηπίου
  choice: àwọn ohun ti ó jẹ́ ti ọmọ kékeré
  rationale: Èyí tẹ̀ lé gbólóhùn Gíríìkì náà, “àwọn ohun ti ọmọ kékeré,” ní pẹkipẹki, ó sì fi ààyè sílẹ̀ fún ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ohun tàbí ìwà ọmọdé.
theological_decisions:
- issue: Ìyàtọ̀ akọ nínú ἀνήρ
  choice: ọkùnrin
  alternative: àgbàlagbà
  rationale: Gíríìkì lo ọ̀rọ̀ akọ ní pàtó, Pọ́ọ̀lù sì ń lo ara rẹ̀ gẹ́gẹ́ bí àpẹẹrẹ ìdàgbàsókè. “Ọkùnrin” pa àwòrán inú ọ̀rọ̀ náà mọ́ láìfi ẹ̀kọ́ pé akọ ga ju abo lọ kún un.
translation_notes:
  register: A lo Yorùbá àfẹnusọ òde òní tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. Àtúnṣe “máa ń” fi ìṣe tó ń ṣẹlẹ̀ léraléra ní àkókò ìgbà èwe hàn, ìtun ọ̀rọ̀ “ọmọ kékeré” sì pa ìró àti ìtẹnumọ́ Gíríìkì mọ́.
