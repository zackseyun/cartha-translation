  terminology: “Ọmọ kékeré” yẹ fún νήπιος nínú àpẹẹrẹ yìí, “ọkùnrin” sì tọ́ fún ἀνήρ, láìsọ ìtumọ̀ náà di ti gbogbo ènìyàn. Àlàyé ìsàlẹ̀ yẹ kí ó sọ pé Gíríìkì náà “ní” ní tààràtà, kì í ṣe pé ó “túmọ̀” ní tààràtà.
