    issue: ‘a ń ríran’
    rationale: Lẹ́yìn àmì ìtẹ̀síwájú ‘ń’, fọ́ọ̀mù ọ̀rọ̀-ìṣe tó dára nínú Yorùbá níbí ni ‘rí’, kì í ṣe ‘ríran’.
  - severity: medium
    issue: ‘ojúkojú ni’
    rationale: Ó jẹ́ gbolohun copula tí kò rọrùn, ó sì pa ìtọ́kasí sí ìṣe rírí (βλέπομεν) mọ́lẹ̀. ‘A ó rí lójúkojú’ mú ìṣe tí a fọ́ sílẹ̀ nínú Gíríìkì hàn ní ìbámu pẹ̀lú àyíká.
  - severity: low
    issue: ‘gẹ́gẹ́ bí a ti mọ̀ mí ní kíkún náà’
    rationale: ‘Náà’ lè fi ìtọ́kasí àfikún (‘that fullness’) wọ́lé, nígbà tí καθὼς καὶ ἐπεγνώσθην kò ní ìtọ́kasí irú bẹ́ẹ̀.
  - severity: low
    issue: Àkọsílẹ̀-ẹsẹ̀ náà sọ ‘nínú àlọ́’
    rationale: ‘Àlọ́’ kì í ṣe ìtumọ̀ tó péye fún αἴνιγμα nínú àyíká yìí. Àkọsílẹ̀ yẹ kí ó ṣàlàyé ‘nínú àdììtú’/ìtumọ̀ àìtòye, kí ó má bà a jẹ́ pé ó ń fúnni ní yíyan ọ̀rọ̀ tí kò bá orísun mu.
