id: 1CO.13.12
reference: 1 Corinthians 13:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: yo
  text: Nítorí ní báyìí a ń rí nípasẹ̀ dígí, nínú àdììtú[a]; ṣùgbọ́n nígbà náà a ó rí lójúkojú. Ní báyìí, mo mọ̀ ní apá kan; ṣùgbọ́n nígbà náà, èmi yóò mọ̀ ní kíkún, gẹ́gẹ́ bí a ti mọ̀ mí ní kíkún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, Gíríìkì náà sọ pé “nínú àdììtú.” Èyí ń tẹnu mọ́ ìríran tàbí ìmọ̀ tí kì í ṣe tààrà, tí ó sì ṣòro láti lóye.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: a ń ríran
  rationale: Ó pa àwòrán ìríran mọ́, ó sì fi hàn pé ohun tí ń ṣẹlẹ̀ lọ́wọ́lọ́wọ́ ni.
- source_word: ἄρτι
  choice: ní báyìí
  rationale: Ó fi ipò ìsinsìnyí wé τότε, ìyẹn ‘nígbà náà,’ ní ọ̀nà tí ó ṣe kedere.
- source_word: δι’ ἐσόπτρου
  choice: nípasẹ̀ dígí
  rationale: ‘Nípasẹ̀’ ṣàfihàn διά pẹ̀lú ọ̀rọ̀-orúkọ ní genitive, ó sì pa èrò ìríran tí ohun kan ń ṣe alárinà mọ́.
- source_word: ἐν αἰνίγματι
  choice: lọ́nà àdììtú[a]
  rationale: Àdììtú jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí kò ṣe kedere, tí ó sì ń béèrè ìtúmọ̀; ó pa agbára αἴνιγμα mọ́ ju ‘lọ́nà tí kò mọ́’ lọ.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: ojúkojú ni
  rationale: ‘Ojúkojú’ ni àṣàyàn Yorùbá àdánidá fún ìpàdé tàbí ìríran tààrà; ‘ni’ jẹ́ kí gbólóhùn tí kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì dúró dáadáa ní Yorùbá láìfi ẹni tí a rí kún un.
- source_word: γινώσκω ἐκ μέρους
  choice: mo mọ̀ ní apá kan
  rationale: Ó pa ìbáradọ́gba ‘mọ̀’ àti ‘ní apá kan’ mọ́, ó sì bá ìtumọ̀ ìmọ̀ tí kò tíì pé mu.
- source_word: ἐπιγνώσομαι
  choice: èmi yóò mọ̀ ní kíkún
  rationale: ‘Ní kíkún’ fi ìyàtọ̀ sí ìmọ̀ ní apá kan hàn, ṣùgbọ́n kò sọ pé ẹni náà yóò mọ ohun gbogbo bí Ọlọ́run.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: gẹ́gẹ́ bí a ti mọ̀ mí ní kíkún náà
  rationale: Ó tún ‘mọ̀ ní kíkún’ lò láti pa ìbátan ọ̀rọ̀-ìṣe méjèèjì mọ́; ìsọ̀rọ̀ aláìdárúkọ ‘a ti mọ̀ mí’ kò sọ ẹni tí ó mọ̀ mí jáde, gẹ́gẹ́ bí Gíríìkì.
theological_decisions:
- issue: Bí ìmọ̀ ọjọ́ iwájú ṣe gbòòrò tó nínú ἐπιγνώσομαι
  choice: èmi yóò mọ̀ ní kíkún
  alternative: èmi yóò mọ ohun gbogbo pátápátá
  rationale: Ọ̀rọ̀ náà tako ìmọ̀ ní apá kan pẹ̀lú ìmọ̀ tí ó pé sí i, ṣùgbọ́n kò fi dandan mú un pé ènìyàn yóò ní ìmọ̀ aláìlópin tàbí ìmọ̀ tó dọ́gba pẹ̀lú ti Ọlọ́run.
- issue: Ẹni tó ṣe iṣẹ́ nínú ἐπεγνώσθην, ọ̀rọ̀-ìṣe aláìṣeṣe
  choice: a ti mọ̀ mí ní kíkún
  alternative: Ọlọ́run ti mọ̀ mí ní kíkún
  rationale: A kò dárúkọ ẹni tó mọ̀ Pọ́ọ̀lù nínú Gíríìkì; fífi ọ̀rọ̀ náà sílẹ̀ láìdárúkọ ẹni náà pa àìsọ-kedere ojúlówó mọ́, bí ó tilẹ̀ jẹ́ pé àyíká le mú kí oníkà ronú nípa Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. A lo ‘ojúkojú’ dípò àkójọpọ̀ ọ̀rọ̀ tí yóò dà bí ìtumọ̀ lẹ́tà-dé-lẹ́tà, a sì pa ìṣọ̀kan ‘mọ̀ ní kíkún’ mọ́ nínú àwọn ọ̀rọ̀-ìṣe méjèèjì.
