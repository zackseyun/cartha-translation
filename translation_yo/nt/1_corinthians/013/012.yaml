  source_fidelity: Ìtumọ̀ náà ń pa ìyàtọ̀ ìsinsìnyí àti ìgbà náà mọ́, pẹ̀lú ìmọ̀ ní apá kan àti ìmọ̀ ní kíkún. Síbẹ̀, ó yẹ kí ọ̀rọ̀-ìṣe tí a fọ́ sílẹ̀ nínú πρόσωπον πρὸς πρόσωπον hàn ní Yorùbá gẹ́gẹ́ bí ìtẹ̀síwájú ‘rí’; ‘ojúkojú ni’ nìkan kò rọrùn, ó sì dín ìbátan rẹ̀ pẹ̀lú βλέπομεν kù. ‘Nínú àdììtú’ tún sún mọ́ ἐν αἰνίγματι ju ‘lọ́nà àdììtú’ lọ.
  naturalness: ‘A ń ríran’ kì í ṣe ìlò Yorùbá boṣewa tó rọrùn níbí; ‘a ń rí’ dára sí i. ‘A ó rí lójúkojú’ jẹ́ ọ̀nà adayeba tí ó ń mú ìtumọ̀ ‘face to face’ wá, láìfi ẹni tàbí ohun tí a rí kún ọ̀rọ̀ náà.
  terminology: ‘Dígí,’ ‘àdììtú,’ ‘ní apá kan,’ àti ‘ní kíkún’ yẹ, wọ́n sì pa àwòrán àti ìṣọ̀kan ọ̀rọ̀ Gíríìkì mọ́. A yọ ‘náà’ kúrò nínú gbolohun ìkẹyìn nítorí kò sí ìfihàn àfikún bẹ́ẹ̀ nínú Gíríìkì.
  issues:
