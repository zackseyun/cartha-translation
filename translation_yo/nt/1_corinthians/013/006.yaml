  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: yo
  text: Kì í yọ̀ sí àìṣòdodo[a], ṣùgbọ́n ó ń bá òtítọ́ yọ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwà búburú” tàbí “àìdájọ́ òdodo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń yọ̀ sí òtítọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí pé ẹnì kan ń bá ẹlòmíràn yọ̀, tàbí pé ó ń yọ̀ nítorí òtítọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ χαίρει
  choice: Kì í yọ̀
  rationale: ‘Yọ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún jíjẹ́ aláyọ̀ tàbí yíyọ̀; ‘kì í’ sì fi ìṣe tí ìfẹ́ kì í ṣe hàn nínú àkójọ yìí.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: sí àìṣòdodo
  rationale: Pẹ̀lú χαίρει, ἐπί àti dátífù ń tọ́ka sí ohun tí ayọ̀ dá lé tàbí ohun tí a ń yọ̀ sí. ‘Àìṣòdodo’ pa ìtumọ̀ ìwà búburú àti ìṣìnà kúrò ní ọ̀nà òdodo mọ́, láì dín un kù sí àìṣèdájọ́ òdodo láàárín ènìyàn nìkan.
- source_word: συγχαίρει
  choice: ó ń bá ... yọ̀
  rationale: Ìkọ̀lé ‘bá ... yọ̀’ mú agbára συν- jáde ní Yorùbá, ó sì pa ìtumọ̀ pínpín ayọ̀ mọ́.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó ṣe kedere hàn láàárín ohun tí ìfẹ́ kì í ṣe àti ohun tí ó ń ṣe.
- source_word: τῇ ἀληθείᾳ
  choice: òtítọ́
  rationale: ‘Òtítọ́’ jẹ́ àfihàn tó gbòòrò tí ó lè tọ́ka sí ohun tó jẹ́ òtítọ́ àti sí ìwà tí ó bá òtítọ́ mu; a kò fi ìtumọ̀ ihinrere tàbí ọ̀rọ̀ sísọ nìkan lé e lórí.
theological_decisions:
- issue: Ìtumọ̀ ἀδικία nínú ìyàtọ̀ ìwà rere tí Pọ́ọ̀lù gbé kalẹ̀
  choice: àìṣòdodo
  alternative: ìwà búburú; àìṣèdájọ́ òdodo
  rationale: ‘Àìṣòdodo’ pa ìwọ̀n ìwà rere àti ti ẹ̀kọ́ nípa Ọlọ́run mọ́, ó sì gbooro ju ìtumọ̀ òfin tàbí àìṣèdájọ́ òdodo láàárín ènìyàn lọ.
- issue: Agbára συν- nínú συγχαίρει àti ẹni tí a ń bá yọ̀
  choice: bá òtítọ́ yọ̀
  alternative: yọ̀ sí òtítọ́
  rationale: Ẹ̀dà Gíríìkì lè túmọ̀ sí pínpín ayọ̀ pọ̀ pẹlu òtítọ́ tàbí yíyọ̀ nítorí òtítọ́. Ọ̀rọ̀ inú àyọkà pa ìtumọ̀ àkọ́kọ́ mọ́; àlàyé ìsàlẹ̀ fi èkejì sílẹ̀ gẹ́gẹ́ bí àṣàyàn gidi.
translation_notes:
  register: Yorùbá ìgbàlódé tó mọ́gbọ́n dání, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘kì í ... ṣùgbọ́n ó ń ...’ láti pa ìwà àṣà tí àyọkà ń ṣàpèjúwe mọ́, a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
