  text: For we know in part[a], and we prophesy in part.
translation:
  language: yo
  text: Nítorí pé a mọ̀ ní apá kan[a], a sì ń sọ àsọtẹ́lẹ̀ ní apá kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “lọ́nà tí kò pé.” Lédè Gíríìkì, ọ̀rọ̀ náà ní ìtumọ̀ gangan “láti apá kan,” a sì tún un lò nínú àwọn abala méjèèjì fún ìtẹnumọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: jẹ́ apá kan ṣoṣo
  rationale: Ọ̀rọ̀ Gíríìkì yìí túmọ̀ sí pé ohun náà kò pé, ó jẹ́ apá kan péré. Àtúnlò gbólóhùn náà nínú abala méjèèjì pa ìfiwéra Pọ́ọ̀lù mọ́.
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ohun tí ó ṣáájú.
- source_word: γινώσκομεν
  choice: ìmọ̀ wa
  rationale: Àyípadà sí ọ̀rọ̀-orúkọ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘àwa mọ̀’ mọ́ láìfi ìtumọ̀ míì kún un.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so àwọn abala méjèèjì pọ̀ lọ́nà àdánidá, ó sì mú ìfarajọ wọn hàn.
- source_word: προφητεύομεν
  choice: àsọtẹ́lẹ̀ wa
  rationale: Ó tọ́ka sí iṣẹ́ sísọ ọ̀rọ̀ àsọtẹ́lẹ̀ láìdín in kù sí sísọ ohun ọjọ́ iwájú tàbí ìwàásù lásán.
theological_decisions:
- issue: Ìtumọ̀ iṣẹ́ àsọtẹ́lẹ̀ nínú ìjọ
  choice: àsọtẹ́lẹ̀ wa
  alternative: a ń sọ ohun tí yóò ṣẹlẹ̀ lọ́jọ́ iwájú; a ń wàásù
  rationale: Ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ ọ̀rọ̀ àsọtẹ́lẹ̀ tí Ọlọ́run mí sí ní ọ̀nà gbígbòòrò. Ìtumọ̀ yìí kò fi ọ̀rọ̀ náà mọ́ sísọ ọjọ́ iwájú tàbí ìwàásù nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo ìṣètò ọ̀rọ̀-orúkọ láti mú kí ìfarajọ àwọn abala méjèèjì ṣe kedere àti àdánidá.
