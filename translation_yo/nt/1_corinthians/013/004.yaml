id: 1CO.13.4
reference: 1 Corinthians 13:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: yo
  text: Ìfẹ́ a máa ní sùúrù, ìfẹ́ a sì máa fi inú rere hàn. Kì í ní ìlara[a], kì í fọ́nnu, kì í sì í gbéraga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kì í jowú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìtara rere tàbí owú/ìlara; ṣùgbọ́n àyíká ọ̀rọ̀ òdì níbí fara mọ́ “ìlara.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “kì í wú sókè.” Pọ́ọ̀lù lo àwòrán ohun tó kún fún afẹ́fẹ́, tó sì wú, láti sọ ìgbéraga.
    reason: metaphor
lexical_decisions:
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá tó gbòòrò, tó sì bá ìtumọ̀ ìwà àti ìbáṣepọ̀ ἀγάπη mu; kò dín in kù sí fífúnni ní ọrẹ nìkan.
- source_word: μακροθυμεῖ
  choice: a máa ní sùúrù
  rationale: Ó sọ nípa fífaradà pẹ́, pàápàá sí àwọn ẹlòmíràn. Ìlò “a máa” mú ìwà tó ń bá a lọ hàn ní Yorùbá àdánidá.
- source_word: χρηστεύεται
  choice: a máa fi inú rere hàn
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí ṣíṣe pẹ̀lú inú rere. Gbólóhùn yìí jẹ́ kó hàn pé ìfẹ́ ń ṣiṣẹ́ rere, kì í ṣe pé ó ní ànímọ́ rere lásán.
- source_word: ζηλοῖ
  choice: ṣe ìlara
  rationale: Ní àyíká ọ̀rọ̀ òdì yìí, ó ń tọ́ka sí ìlara tàbí owú, kì í ṣe ìtara rere. “Ṣe ìlara” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìfẹ́ ohun tí ẹlòmíràn ní pẹ̀lú inú búburú.
- source_word: περπερεύεται
  choice: fọ́nnu
  rationale: “Fọ́nnu” sọ ìṣehàn ara ẹni àti ṣíṣe yangàn ní kedere, ó sì bá ìforúkọsílẹ̀ ọlọ́lá ti ẹsẹ náà mu.
- source_word: φυσιοῦται
  choice: gbéraga
  rationale: Ọ̀rọ̀ Gíríìkì lo àwòrán ohun tó wú sókè fún ìgbéraga. “Gbéraga” ni ọ̀nà Yorùbá àdánidá tó mú kókó ìtumọ̀ náà jáde; àlàyé ìsàlẹ̀ sọ àwòrán inú ọ̀rọ̀ ìpilẹ̀.
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: Ìfẹ́ ... ìfẹ́ ... Kì í
  rationale: A pa àtúnwí “ìfẹ́” mọ́ nínú àwọn gbólóhùn rere méjì àkọ́kọ́ fún ìtẹnumọ́. Lẹ́yìn náà, Yorùbá lè máa lo “kì í” láì tún olùṣe sọ, nígbà tí “ìfẹ́” ṣì jẹ́ olùṣe tó ṣe kedere.
- source_word: οὐ
  choice: kì í
  rationale: “Kì í” jẹ́ ìkọ̀sílẹ̀ Yorùbá tó bójú mu fún ohun tí kì í ṣe ìwà àṣà tàbí ìṣe ìfẹ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀγάπη nínú ẹ̀kọ́ nípa ìwà àti ìgbàgbọ́
  choice: ìfẹ́
  alternative: ìfẹ́ àánú
  rationale: “Ìfẹ́” pa ìtumọ̀ gbòòrò ti ọ̀rọ̀ náà mọ́ láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un tàbí dín in kù sí àánú àti fífúnni nìkan.
translation_notes:
  register: Yorùbá àjọṣe òde òní tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Àtúnwí “ìfẹ́” pa ìlù ọ̀rọ̀ Gíríìkì mọ́; àwọn gbólóhùn kúkúrú “kì í” sì jẹ́ kí àkójọ ìwà náà ṣàn lọ́nà àdánidá. A gbé àmì àlàyé [a] sí “ìlara” àti [b] sí “gbéraga” gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
