id: 2JN.1.12
reference: 2 John 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: yo
  text: Bí mo tilẹ̀ ní ọ̀pọ̀ ohun láti kọ sí yín, mi ò fẹ́ ṣe bẹ́ẹ̀ pẹ̀lú bébà àti yíǹkì. Ṣùgbọ́n mo ní ìrètí láti wá sọ́dọ̀ yín, kí n sì bá yín sọ̀rọ̀ lójúkojú, kí ayọ̀ yín[a] lè kún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ẹ̀dà àfọwọ́kọ kan ní “ayọ̀ wa” dípò “ayọ̀ yín.”
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: Bí mo tilẹ̀ ní ọ̀pọ̀lọpọ̀ ohun láti kọ sí yín
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ concessive participle náà jáde ní Yorùbá àdánidá, ó sì pa ọ̀pọ̀ nǹkan tí Πολλά ń tọ́ka sí mọ́.
- source_word: οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος
  choice: èmi kò fẹ́ ṣe bẹ́ẹ̀ pẹ̀lú bébà àti yíǹkì
  rationale: “Kò fẹ́” fi ìfẹ́ tàbí ìpinnu inú tí βούλομαι túmọ̀ sí hàn; “pẹ̀lú” sì sọ bébà àti yíǹkì di ohun èlò tí a fi ń kọ̀wé.
- source_word: ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: mo ní ìrètí láti wá sọ́dọ̀ yín
  rationale: Ó pa ìrètí àti ìdarí wíwá sọ́dọ̀ àwọn olùgbà lẹ́tà mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe déédé.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: kí n sì bá yín sọ̀rọ̀ lójúkojú
  rationale: “Lójúkojú” ni àṣàyàn Yorùbá àdánidá fún ìjíròrò níwájú ara ẹni; títúmọ̀ ọ́ ní tààrà sí “ẹnu sí ẹnu” lè mú ìtumọ̀ mìíràn wá.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: kí ayọ̀ yín lè kún dé ẹ̀kúnrẹ́rẹ́
  rationale: “Kí” pa ìtumọ̀ ète ἵνα mọ́, “kún dé ẹ̀kúnrẹ́rẹ́” sì fi ipò ayọ̀ tí ó dé ìwọ̀n kíkún hàn.
theological_decisions:
- issue: Ìyàtọ̀ inú àwọn ẹ̀dà nípa ẹni tí ayọ̀ náà jẹ́ tirẹ̀
  choice: ayọ̀ yín
  alternative: ayọ̀ wa
  rationale: SBLGNT ka ὑμῶν (“yín”), nítorí náà èyí ni a lò nínú ọ̀rọ̀ pàtàkì. Àmọ́ a tọ́ka sí ἡμῶν (“wa”) tí àwọn ẹ̀dà kan ní nínú àlàyé ìsàlẹ̀, kí a má bàa pa ìyàtọ̀ tó ní ìtumọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn kíkún ni a lò. Ìforúkọsílẹ̀ náà jẹ́ ti lẹ́tà oníyì, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé òde òní; “lójúkojú” àti “kún dé ẹ̀kúnrẹ́rẹ́” jẹ́ àṣàyàn àdánidá dípò títúmọ̀ àwòrán Gíríìkì ní ọ̀rọ̀-ọ̀rọ̀.
