id: 2JN.1.10
reference: 2 John 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá wá sí ọ̀dọ̀ yín, tí kò sì mú ẹ̀kọ́ yìí wá[a], ẹ má ṣe gbà á sínú ilé yín, ẹ má sì ṣe kí i[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe kí ẹni náà jẹ́ olùkọ́ arìnrìn-àjò tí ọ̀rọ̀ rẹ̀ yà kúrò nínú ìjẹ́wọ́ nípa Kristi tí àwọn ẹsẹ tó yí i ká sọ.
    reason: cross_reference
  - marker: b
    text: Ní tààrà̀, Gíríìkì ní, “ẹ má ṣe sọ ìkíni fún un”; ìtumọ̀ àdánidá rẹ̀ ni, “ẹ má ṣe kí i.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: Bí ẹnikẹ́ni bá
  rationale: Ó fi ọ̀rọ̀ àídájú tí ó kan ẹnikẹ́ni hàn, ó sì bá ìlànà àdéhùn Yorùbá mu.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: wá sí ọ̀dọ̀ yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹnì kan tọ àwọn olùgbà lẹ́tà wá, láì fi ìtumọ̀ nípa ìjọ kún un.
- source_word: ταύτην τὴν διδαχήν
  choice: ẹ̀kọ́ yìí
  rationale: “Ẹ̀kọ́” ṣàfihàn διδαχή ní èdè òde òní, “yìí” sì pa agbára ọ̀rọ̀ atọ́ka ταύτην mọ́.
- source_word: οὐ φέρει
  choice: tí kò sì mú ... wá
  rationale: “Mú ... wá” pa àwòrán fífi ẹ̀kọ́ náà dé ọ̀dọ̀ wọn mọ́, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: ẹ má ṣe gbà á sínú ilé yín
  rationale: “Gbà á sínú ilé” ṣàfihàn gbígba àlejò wọlé, láì pinnu bóyá ilé aládàáni tàbí ibi ìpàdé ni ọ̀rọ̀ náà ń tọ́ka sí.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: ẹ má sì ṣe kí i
  rationale: Ọ̀nà Yorùbá àdánidá fún sísọ ìkíni ni “kí i”; àlàyé ìsàlẹ̀ ṣàfihàn bí Gíríìkì ṣe sọ ọ́ ní tààrà̀.
theological_decisions:
- issue: Ìwọ̀n èèwọ̀ nípa ẹni tí kò mú ẹ̀kọ́ yìí wá
  choice: A pa ọ̀rọ̀ pàtó nípa gbígbà á sínú ilé àti kíkí i mọ́.
  alternative: Kí a túmọ̀ rẹ̀ sí èèwọ̀ gbogbo ìbáṣepọ̀ pẹ̀lú irú ẹni bẹ́ẹ̀, tàbí kí a dín un kù sí gbígba olùkọ́ sínú ìpàdé ìjọ nìkan.
  rationale: Àyíká ọ̀rọ̀ lè ní àwọn olùkọ́ arìnrìn-àjò lọ́kàn, ṣùgbọ́n ẹsẹ̀ náà kò sọ gbogbo ìlò rẹ̀ di pàtó; nítorí náà, a kò fẹ̀ tàbí dín èèwọ̀ náà kù nínú ọ̀rọ̀ àkọ́kọ́.
- issue: Ẹni tí ọ̀rọ̀ náà ń tọ́ka sí
  choice: A lo àrọ́pò-orúkọ Yorùbá “á/i” tí kò fi akọ tàbí abo hàn.
  alternative: Kí a fi ọ̀rọ̀ akọ hàn ní pàtó bí Gíríìkì ṣe lo αὐτόν.
  rationale: Àrọ́pò-orúkọ ẹni kẹta ẹyọ kan ní Yorùbá kì í fi akọ tàbí abo hàn. Èyí kì í yí ẹyọ kan tàbí ìtọ́kasí Gíríìkì padà.
translation_notes:
  register: Yorùbá ìgbàlódé, tó ní iyì, tó sì ṣe kedere fún gbogbo ènìyàn ni a lò. A fi àmì ohùn síbi tí ó yẹ, a sì lo ọ̀pọ̀-orúkọ “ẹ” fún àwọn olùgbà lẹ́tà náà.
