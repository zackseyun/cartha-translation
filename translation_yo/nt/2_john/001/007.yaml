id: 2JN.1.7
reference: 2 John 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: yo
  text: Nítorí ọ̀pọ̀ àwọn ẹlẹ́tàn ti jáde lọ sínú ayé—àwọn tí kò jẹ́wọ́ Jésù, ẹni tí í ṣe Mèsáyà, gẹ́gẹ́ bí ẹni tí ń bọ̀ nínú ara. Ẹni bẹ́ẹ̀ ni ẹlẹ́tàn náà àti Aṣòdì sí Kristi náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ṣe àfihàn ìdí fún ìkìlọ̀ tó ṣáájú, ó sì bá ọ̀nà ìsọ̀rọ̀ Yorùbá mu.
- source_word: πολλοὶ πλάνοι
  choice: ọ̀pọ̀ àwọn ẹlẹ́tàn
  rationale: πλάνος níbí ń tọ́ka sí àwọn ènìyàn tí ń ṣi àwọn ẹlòmíràn lọ́nà, kì í ṣe àwọn tí wọ́n ṣìnà lásán.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: ti jáde lọ sínú ayé
  rationale: Ó pa ìtumọ̀ jáde lọ sí àárín ayé mọ́, láì fi ìtumọ̀ àfikún sí κόσμος.
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: àwọn tí kò jẹ́wọ́
  rationale: “Jẹ́wọ́” mú ìtumọ̀ ìkéde tàbí ìmúlẹ̀ ní gbangba tí ὁμολογέω ní nínú àyíká yìí.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésù Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” mú iṣẹ́ oyè náà hàn ní kedere.
- source_word: ἐρχόμενον
  choice: ń bọ̀
  rationale: Ọ̀rọ̀ ìṣe aláìparí ti Gíríìkì ni a pa mọ́ pẹ̀lú fọ́ọ̀mù ìṣe tó ń lọ lọ́wọ́, láì yí i sí “tí ó ti wá.”
- source_word: ἐν σαρκί
  choice: nínú ara
  rationale: Ó tọ́ka sí jíjẹ́ ènìyàn tòótọ́ pẹ̀lú ara, kì í ṣe ẹ̀dá ẹlẹ́ṣẹ̀; gbolohun náà tún pa àwòrán orísun mọ́.
- source_word: οὗτός ἐστιν ὁ πλάνος
  choice: Ẹni bẹ́ẹ̀ ni ẹlẹ́tàn
  rationale: “Ẹni bẹ́ẹ̀” mú ẹyọ ọ̀rọ̀ arọ́pò náà hàn, ó sì ń sọ irú ẹnikẹ́ni tí àpèjúwe ṣáájú bá mu.
- source_word: ὁ ἀντίχριστος
  choice: Aṣòdì-sí-Kristi
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún ẹni tí ó tako Kristi, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ pẹ̀lú ọ̀rọ̀ Jòhánù.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ìjẹ́wọ́ nípa ẹni tí Jésù jẹ́, Χριστός dúró gẹ́gẹ́ bí oyè; “Mèsáyà” jẹ́ kí èyí hàn láì fi ẹ̀kọ́ ẹgbẹ́ ìjọ kan kún un.
- issue: Agbára ἐρχόμενον ἐν σαρκί
  choice: ń bọ̀ nínú ara
  alternative: tí ó ti wá nínú ara
  rationale: A pa fọ́ọ̀mù àsìkò ìsinsìnyí ti Gíríìkì mọ́, kí a má bàa sọ ìtumọ̀ rẹ̀ di ohun tó parí ní àtijọ́ nìkan. Ó ṣì jẹ́wọ́ jíjẹ́ ènìyàn gidi ti Jésù.
- issue: Ìtumọ̀ σάρξ
  choice: ara gidi ti ènìyàn
  alternative: ìwà ẹlẹ́ṣẹ̀
  rationale: Nínú ọ̀rọ̀ nípa Jésù yìí, σάρξ túmọ̀ sí wíwà nínú ara ènìyàn gidi, kì í ṣe ìwà ẹlẹ́ṣẹ̀.
- issue: Ẹyọ ọ̀rọ̀ οὗτος lẹ́yìn àpèjúwe ọ̀pọ̀ ènìyàn
  choice: Ẹni bẹ́ẹ̀
  alternative: Èyí
  rationale: Ìtúmọ̀ yìí pa ẹyọ ọ̀rọ̀ náà mọ́, ó sì jẹ́ kedere pé ẹnikẹ́ni tó bá kọ ìjẹ́wọ́ náà ni a ń sọ̀rọ̀ rẹ̀.
translation_notes:
  register: Yorùbá àpéjọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, ni a lò. Àwọn àmì ohùn ni a fi síbi tó yẹ. “Ìyẹn” ń so àpèjúwe àwọn tí kò jẹ́wọ́ mọ́ “àwọn ẹlẹ́tàn” lọ́nà àdánidá; “Ẹni bẹ́ẹ̀” sì pa ìyípadà láti ọ̀pọ̀ sí ẹyọ tó wà nínú Gíríìkì mọ́.
