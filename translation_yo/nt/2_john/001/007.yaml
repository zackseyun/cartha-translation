  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ọ̀rọ̀ Gíríìkì ní gbogbogbòò: ó pa ìdí tí ὅτι ń fún, ọ̀pọ̀ àwọn aṣìnà, ìjáde wọn sínú ayé, àti ìyípadà láti ọ̀pọ̀ ènìyàn sí ẹyọ kan mọ́. Síbẹ̀, “ń bọ̀ nínú ara” lè dá òǹkàwé Yorùbá lójú pé a ń sọ̀rọ̀ nípa ìbọ̀ ọjọ́ iwájú; ó nílò ọ̀nà tí ó so participle náà mọ́ Jésù ní kedere, láì sọ ọ́ di ìṣẹ̀lẹ̀ tí ó ti parí.'
  naturalness: “Ìyẹn àwọn tí” kì í ṣe ọ̀nà Yorùbá tó rọrùn jù lọ fún àfikún àpèjúwe yìí. “àwọn tí” lẹ́yìn àmì-dáṣiṣẹ́ ń ṣàn dáadáa. “Jésù, ẹni tí í ṣe Mèsáyà” tún jẹ́ kí oyè náà hàn ní Yorùbá ní ti ẹ̀dá, dípò “Jésù Mèsáyà” tí ó lè dà bí orúkọ kan.
  terminology: “ẹlẹ́tàn” dára fún πλάνος. “Mèsáyà” dára fún Χριστός gẹ́gẹ́ bí oyè. “Aṣòdì sí Kristi” jẹ́ ọ̀rọ̀ tí ó mọ̀ sí etí àwọn òǹkàwé Yorùbá fún ἀντίχριστος; a fi “Kristi” síbẹ̀ gẹ́gẹ́ bí apá ọ̀rọ̀ ìbílẹ̀ náà, láì yí ìtumọ̀ Mèsáyà nínú ìjẹ́wọ́ pàtàkì padà.
  issues:
  - severity: medium
    issue: “Jésù Mèsáyà ń bọ̀ nínú ara” lè túmọ̀ sí ìbọ̀ Jésù ní ọjọ́ iwájú.
    rationale: Bó tilẹ̀ jẹ́ pé ἐρχόμενον jẹ́ participle àsìkò ìsinsìnyí, “ń bọ̀” ní Yorùbá sábà ń tọ́ka sí ìwáyé tàbí ìbọ̀ tó ń bọ̀. Fífún un ní ìṣọ̀kan “gẹ́gẹ́ bí ẹni tí ń bọ̀” pa fọ́ọ̀mù Gíríìkì mọ́ sí i, ó sì jẹ́ kedere pé ó jẹ́ ohun tí a kọ̀ láti jẹ́wọ́ nípa Jésù.
  - severity: low
    issue: “ìyẹn àwọn tí” kì í ṣàn dáadáa nínú gbolohun náà.
    rationale: Àmì-dáṣiṣẹ́ àti “àwọn tí” ń so ẹgbẹ́ àpèjúwe náà mọ́ “àwọn ẹlẹ́tàn” ní ọ̀nà tó dáa sí i.
  - severity: low
    issue: Oyè Mèsáyà kò hàn kedere nínú “Jésù Mèsáyà.”
