  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ⸂λέγων γὰρ⸃ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: yo
  text: Nítorí ẹni tí ó bá sọ fún un pé, “Mo kí ọ”[a], ń kópa nínú àwọn iṣẹ́ búburú rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Yọ̀.” Ọ̀rọ̀ Gíríìkì χαίρειν jẹ́ ọ̀nà ìkíni tí a sábà máa ń lò; nínú àyíká yìí, ó ní ìtumọ̀ gbígba ẹni náà tàbí fífi ìfọwọ́sí hàn, kì í ṣe pàṣípààrọ̀ ọ̀rọ̀ ọmọlúwàbí lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: ẹni tí ó bá sọ
  rationale: Àpilẹ̀kọ pẹ̀lú participle náà ń tọ́ka ní gbogbogbò sí ẹnikẹ́ni tí ó bá ṣe ohun yìí. Ìlò ‘ẹni tí ó bá sọ’ jẹ́ Yorùbá àdánidá, ó sì pa agbára gbogbogbò ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: γάρ
  choice: Nítorí
  rationale: Ọ̀rọ̀ náà ń fúnni ní ìdí fún ìkìlọ̀ ẹsẹ tó ṣáájú; ‘Nítorí’ fi ìbáṣepọ̀ àlàyé yìí hàn ní ṣókí.
- source_word: αὐτῷ
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí ẹni tí a sọ̀rọ̀ rẹ̀ ní ẹsẹ tó ṣáájú, láìfi àlàyé mìíràn kún un.
- source_word: χαίρειν
  choice: “Mo kí ọ”
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan rẹ̀ ní í ṣe pẹ̀lú yíyọ̀, níbí ó jẹ́ ọ̀nà ìkíni tí a sábà máa ń lò. ‘Mo kí ọ’ jẹ́ ìkíni Yorùbá tó ṣe kedere, láìsọ ọ́ di ‘káàbọ̀’ tàbí ìfọwọ́sí ní pàtó.
- source_word: κοινωνεῖ
  choice: ń ṣe alábàápín nínú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíkópa tàbí níní ìpín nínú ohun kan. Ìtumọ̀ yìí jẹ́ kedere, ó sì fi èrò ìdáríjọ́pọ̀ nínú iṣẹ́ búburú hàn láìfi èrò ẹ̀kọ́ ìjọ kan pàtó sí i.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: nínú àwọn iṣẹ́ búburú rẹ̀
  rationale: ‘Àwọn iṣẹ́ búburú rẹ̀’ pa ìtumọ̀ ἔργα àti àpèjúwe ìwà búburú πονηροῖς mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá ìkíni náà túmọ̀ sí ìwà ọmọlúwàbí lásán tàbí ìfọwọ́sí àti ìkópa nínú iṣẹ́ olùkọ́ èké
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ìkíni, nígbà tí ‘ń ṣe alábàápín nínú’ àti àyíká ẹsẹ 10 fi ewu ìfọwọ́sí tàbí ìrànlọ́wọ́ hàn.
  alternative: Kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ìfòfindè gbogbo irú ìkíni ọmọlúwàbí sí irú ẹni bẹ́ẹ̀ ní gbogbo ipò.
  rationale: χαίρειν jẹ́ ọ̀nà ìkíni, ṣùgbọ́n κοινωνεῖ àti àyíká gbígba olùkọ́ náà sínú ilé tọ́ka sí ìkópa tàbí ìtìlẹ́yìn. A kò mú ìtumọ̀ tó lágbára bí ‘káàbọ̀’ wọ inú ẹsẹ, bẹ́ẹ̀ ni a kò sọ ìkíni náà di ọ̀rọ̀ àìníjelórí lásán.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé yé ni a lò. ‘Ẹni tí ó bá’ fi ìtọ́kasí gbogbogbò hàn; ‘Mo kí ọ’ yàgò fún mímú ‘káàbọ̀’ tí ó lágbára ju ọ̀rọ̀ Gíríìkì lọ wọ inú ẹsẹ. Àmì ohùn ni a fi sí ibi tí ó yẹ.
