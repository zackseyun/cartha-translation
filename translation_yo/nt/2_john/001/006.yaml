id: 2JN.1.6
reference: 2 John 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: yo
  text: 'Èyí sì ni ìfẹ́: pé kí a máa rìn ní ìbámu pẹ̀lú àwọn àṣẹ rẹ̀. Èyí ni àṣẹ náà[a], gẹ́gẹ́ bí ẹ ti gbọ́ láti ìbẹ̀rẹ̀, pé kí ẹ máa rìn nínú rẹ̀.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pé kí ẹ máa rìn nínú ìfẹ́”; ọ̀rọ̀ arọ́pò “rẹ̀” lè tọ́ka sí “ìfẹ́” dípò “àṣẹ náà.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá tó ṣe déédé fún ἀγάπη, ó sì pa ìsopọ̀ ọ̀rọ̀ náà mọ́ pẹ̀lú bí Jòhánù ṣe ń lò ó ní àyíká ẹsẹ yìí.
- source_word: ἵνα περιπατῶμεν
  choice: pé kí á máa rìn
  rationale: Níhìn-ín ἵνα ń ṣàlàyé ohun tí ìfẹ́ túmọ̀ sí nínú ìṣe. “Kí á máa rìn” pa àwòrán ìrìn ìwà rere mọ́, “máa” sì fi ìṣe tí ń bá a lọ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: περιπατέω
  choice: máa rìn
  rationale: A kò sọ ọ́ di “máa gbé ayé” nítorí pé pípa àwòrán ìrìn mọ́ ṣe pàtàkì nínú èdè Jòhánù, ó sì pa ìtúnlò ọ̀rọ̀ náà mọ́ nínú àwọn abala méjèèjì.
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: ní ìbámu pẹ̀lú àwọn àṣẹ rẹ̀
  rationale: κατά pẹ̀lú accusative túmọ̀ sí ìṣe ní ìbámu pẹ̀lú ohun kan. Ìtumọ̀ yìí ṣe kedere, ó sì pa ọ̀pọ̀ “àwọn àṣẹ” mọ́.
- source_word: ἐντολάς / ἐντολή
  choice: àwọn àṣẹ / àṣẹ náà
  rationale: “Àṣẹ” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu, ó sì pa ìyàtọ̀ láàárín ọ̀pọ̀ nínú abala àkọ́kọ́ àti ẹyọ kan nínú abala kejì mọ́.
- source_word: αὕτη ἡ ἐντολή ἐστιν
  choice: Èyí ni àṣẹ náà
  rationale: Gíríìkì kò ní ọ̀rọ̀ arọ́pò oníhun níhìn-ín; nítorí náà, a kò fi “àṣẹ rẹ̀” kún un. “Náà” ń tọ́ka sí àṣẹ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: gẹ́gẹ́ bí ẹ ti gbọ́ láti ìbẹ̀rẹ̀
  rationale: Èyí pa aorist ἠκούσατε àti àṣà ọ̀rọ̀ Jòhánù “láti ìbẹ̀rẹ̀” mọ́ ní èdè Yorùbá tó ṣe déédé.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: pé kí ẹ máa rìn nínú rẹ̀
  rationale: “Nínú rẹ̀” pa ἐν αὐτῇ àti àwòrán “rìn” mọ́ láì fi ìtumọ̀ àlàyé sínú ẹsẹ náà. Ó lè tọ́ka sí “àṣẹ náà,” ṣùgbọ́n àfojúsùn mìíràn lè jẹ́ “ìfẹ́.”
theological_decisions:
- issue: Ohun tí αὐτῇ nínú abala ìkẹyìn ń tọ́ka sí
  choice: A fi “nínú rẹ̀” sílẹ̀, tí ó ṣeé kà pé ó tọ́ka sí “àṣẹ náà” tó sún mọ́ ọn jù.
  alternative: Ó tún lè tọ́ka sí “ìfẹ́” nínú abala àkọ́kọ́.
  rationale: ἐντολή àti ἀγάπη jẹ́ ọ̀rọ̀ abo ẹyọ kan ní Gíríìkì, nítorí náà méjèèjì lè jẹ́ ohun tí αὐτῇ ń tọ́ka sí. Bí ó tilẹ̀ jẹ́ pé “àṣẹ náà” ni antecedent tó sún mọ́ ọn jù, a pa àìdánilójú gidi náà mọ́ nínú àlàyé ìsàlẹ̀ dípò kí a yanju rẹ̀ ní ti ẹ̀kọ́ ìgbàgbọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ” fún ọ̀pọ̀ ẹni gẹ́gẹ́ bí Gíríìkì ṣe rí, a sì pa àwòrán ìwà gẹ́gẹ́ bí “rírìn” mọ́. Àmì ohùn ni a lò níbi tí ó bá jẹ́ àdánidá.
