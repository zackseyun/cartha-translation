id: 2JN.1.8
reference: 2 John 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: yo
  text: Ẹ máa ṣọ́ ara yín, kí ẹ má bàa pàdánù ohun tí àwa ti ṣiṣẹ́ fún, ṣùgbọ́n kí ẹ lè gba ẹ̀san kíkún.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan kà pé, “ohun tí ẹ̀yin ti ṣiṣẹ́ fún,” dípò “ohun tí àwa ti ṣiṣẹ́ fún.”
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: Ẹ máa ṣọ́ ara yín
  rationale: Ọ̀rọ̀ àṣẹ ní àkókò ìsinsìnyí àti arọ́pò-orúkọ afẹ̀yìntì ń pe ọ̀pọ̀ olùgbọ́ sí ìṣọ́ra tí ó ń bá a lọ. Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ‘ẹ ṣọ́ ara yín.’
- source_word: ἵνα μὴ ἀπολέσητε
  choice: kí ẹ má bà á jẹ́
  rationale: Ní àyíká yìí, ἀπόλλυμι túmọ̀ sí pípa èso iṣẹ́ tí a ti ṣe jẹ́ tàbí sísọnù rẹ̀, kì í ṣe píparun ohun kan ní ti gidi. ‘Má bà á jẹ́’ sọ ìkìlọ̀ náà ní Yorùbá àdánidá, ó sì bá ohun tí a ṣe làálàá fún mu.
- source_word: ἃ εἰργασάμεθα
  choice: ohun tí àwa ti ṣe làálàá fún
  rationale: Ìwé SBLGNT tí a pèsè ní ẹni àkọ́kọ́ ọ̀pọ̀, ‘àwa ti ṣiṣẹ́.’ Fífi ‘àwa’ hàn dá ìyàtọ̀ yìí mọ́, ‘ṣe làálàá fún’ sì sọ iṣẹ́ takuntakun àti èso rẹ̀ ní kedere.
- source_word: μισθὸν πλήρη
  choice: èrè kíkún
  rationale: Ní ọ̀rọ̀ ìṣírí ẹ̀mí yìí, μισθός jẹ́ ‘èrè’ ju ‘owó iṣẹ́’ lọ; ‘kíkún’ pa ìtumọ̀ πλήρη mọ́ gẹ́gẹ́ bí èrè tí kò dín kù.
- source_word: ἀπολάβητε
  choice: kí ẹ lè gba
  rationale: ‘Gba’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún gbígba èrè. A kò fi ìtumọ̀ ‘gba padà’ kún un, nítorí pé àyíká kò fi dandan mú ìtumọ̀ yẹn.
theological_decisions:
- issue: Ẹni tí εἰργασάμεθα ń tọ́ka sí
  choice: àwa ti ṣe làálàá fún
  alternative: ẹ̀yin ti ṣe làálàá fún
  rationale: Ọ̀rọ̀ Gíríìkì tí a pèsè ka εἰργασάμεθα, ẹni àkọ́kọ́ ọ̀pọ̀, nítorí náà ọ̀rọ̀ pàtàkì tọ́ka sí làálàá àwọn òjíṣẹ́. Àwọn àfọwọ́kọ kan ní ẹni kejì ọ̀pọ̀, èyí tí ó tọ́ka sí làálàá àwọn òǹkàwé; a pa á mọ́ sínú àlàyé ìsàlẹ̀.
- issue: Irú èrè tí μισθός túmọ̀ sí
  choice: èrè
  alternative: owó iṣẹ́
  rationale: Ẹsẹ̀ náà kò sọ irú tàbí àkókò èrè náà ní kíkún. ‘Èrè’ pa ọ̀rọ̀ náà sílẹ̀ láìfi ẹ̀kọ́ ìjọ kan tàbí àlàyé tí ọ̀rọ̀ kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ ọ̀wọ̀ fún ọ̀pọ̀ ènìyàn. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán; a yàgò fún ọ̀rọ̀ ẹ̀ka ìjọ.
