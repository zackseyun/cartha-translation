id: 2JN.1.9
reference: 2 John 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: yo
  text: Gbogbo ẹni tí ó ń lọ síwájú[a], tí kò sì dúró nínú ẹ̀kọ́ Mèsáyà[b], kò ní Ọlọ́run. Ẹni tí ó dúró nínú ẹ̀kọ́ náà, òun ni ó ní Bàbá àti Ọmọ méjèèjì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń lọ jù síwájú” tàbí “ń sáré síwájú”; àwọn àfọwọ́kọ kan ní “ń ṣá àṣẹ kọjá” dípò “ń lọ síwájú.”
    reason: textual_variant
  - marker: b
    text: Gbólóhùn náà “ẹ̀kọ́ Mèsáyà” lè túmọ̀ sí “ẹ̀kọ́ tí Mèsáyà fúnni” tàbí “ẹ̀kọ́ nípa Mèsáyà.”
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: Gbogbo ẹni tí ó ń lọ síwájú
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ pé ẹni náà ń lọ síwájú, láì fi ìtumọ̀ líle bí ‘ń ré àṣẹ kọjá’ sínú ọ̀rọ̀ pàtàkì.
- source_word: μὴ μένων
  choice: tí kò sì dúró
  rationale: ‘Dúró’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún mímáa wà tàbí fífìdí múlẹ̀ ní ohun kan, ó sì pa ìtẹnumọ́ Johanu lórí mímáa dúró mọ́.
- source_word: ἐν τῇ διδαχῇ τοῦ Χριστοῦ
  choice: nínú ẹ̀kọ́ Mèsáyà
  rationale: ‘Ẹ̀kọ́’ ṣe kedere sí òǹkàwé òde òní, ‘Mèsáyà’ sì fi Χριστός hàn gẹ́gẹ́ bí oyè. Ìsopọ̀ ọ̀rọ̀ náà kò pinnu bóyá ẹ̀kọ́ láti ọ̀dọ̀ Mèsáyà ni tàbí ẹ̀kọ́ nípa rẹ̀.
- source_word: θεὸν οὐκ ἔχει
  choice: kò ní Ọlọ́run
  rationale: Ìtumọ̀ tààrà yìí pa ọ̀rọ̀ líle àti kúkúrú inú Gíríìkì mọ́, láì ṣàfikún ‘ìdàpọ̀ pẹ̀lú Ọlọ́run.’
- source_word: ὁ μένων ἐν τῇ διδαχῇ, οὗτος
  choice: Ẹni tí ó dúró nínú ẹ̀kọ́ náà, òun ni
  rationale: ‘Òun ni’ fi ìtẹnumọ́ οὗτος hàn, ó sì bá ìlànà ọ̀rọ̀ Yorùbá mu.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: ó ní Baba àti Ọmọ, àwọn méjèèjì
  rationale: ‘Àwọn méjèèjì’ mú ìtumọ̀ καὶ…καὶ (‘àti…àti’) ṣe kedere, nígbà tí ‘Baba’ àti ‘Ọmọ’ pa àwọn oyè ìbátan náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ προάγων nínú àyọkà yìí
  choice: ń lọ síwájú
  alternative: ń lọ jù síwájú; ń sáré síwájú; ń ré àṣẹ kọjá
  rationale: SBLGNT ka προάγων, kì í ṣe παραβαίνων. ‘Ń lọ síwájú’ pa àkàwé ìlọsíwájú mọ́ láì pinnu ìtumọ̀ rẹ̀ ju ohun tí Gíríìkì sọ lọ; àlàyé ìyàtọ̀ àfọwọ́kọ wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ‘ẹ̀kọ́ Mèsáyà’
  choice: A pa ìsopọ̀ ọ̀rọ̀ náà mọ́ láì yàn ọ̀kan lára àwọn ìtumọ̀ méjì.
  alternative: ẹ̀kọ́ tí Mèsáyà fúnni; ẹ̀kọ́ nípa Mèsáyà
  rationale: Genitive τοῦ Χριστοῦ lè tọ́ka sí ẹni tí ẹ̀kọ́ ti ọ̀dọ̀ rẹ̀ wá tàbí ẹni tí ẹ̀kọ́ náà dá lé lórí. Àyọkà pàtàkì kò yẹ kí ó yanju àìdánilójú gidi yìí ní ìkọ̀kọ̀.
- issue: Oyè Kristi Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; ‘Mèsáyà’ tú ìtumọ̀ oyè náà jáde dípò lílo rẹ̀ bí orúkọ lásán.
- issue: Ìtumọ̀ ‘ní Ọlọ́run’
  choice: kò ní Ọlọ́run
  alternative: kò ní ìdàpọ̀ pẹ̀lú Ọlọ́run
  rationale: A pa ọ̀rọ̀ Johanu mọ́ bí ó ṣe rí, láì sọ ìtumọ̀ ìmọ̀-ẹ̀sìn kan di ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ‘òun ni’ láti fi ìtẹnumọ́ hàn, a sì lo ‘àwọn méjèèjì’ láti mú ìbáṣepọ̀ Baba àti Ọmọ nínú gbólóhùn náà ṣe kedere.
