id: 2JN.1.3
reference: 2 John 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: yo
  text: Oore-ọ̀fẹ́, àánú àti àlàáfíà yóò wà pẹ̀lú wa láti ọ̀dọ̀ Ọlọ́run Baba àti láti ọ̀dọ̀ Jésù Mèsáyà[a], Ọmọ Baba[b], nínú òtítọ́ àti ìfẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Jésù Kristi.” A lè ṣe àkọsílẹ̀ oyè Gíríìkì Χριστός gẹ́gẹ́ bí “Kristi”; níbí a túmọ̀ ọ́ sí “Mèsáyà” láti pa ìtumọ̀ rẹ̀ gẹ́gẹ́ bí oyè mọ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí “Ọmọ náà ti Baba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: yóò wà
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú ni ἔσται; “yóò wà” fi ìtumọ̀ ìtọ́ka ọjọ́ iwájú hàn láì sọ ọ́ di àṣẹ tàbí àdúrà.
- source_word: μεθ’ ἡμῶν
  choice: pẹ̀lú wa
  rationale: μετά pẹ̀lú ọ̀rọ̀-orúkọ nínú genitive túmọ̀ sí “pẹ̀lú”; èyí sì bá ìkíni ìbùkún inú lẹ́tà mu.
- source_word: χάρις ἔλεος εἰρήνη
  choice: Oore-ọ̀fẹ́, àánú àti àlàáfíà
  rationale: A pa àwọn ọ̀rọ̀ mẹ́tẹ̀ẹ̀ta àti ìtẹ̀lé wọn mọ́ gẹ́gẹ́ bí àwọn olùṣe ἔσται; àwọn yíyan Yorùbá wọ̀nyí jẹ́ ti ìlò Bíbélì tó wọ́pọ̀, wọ́n sì ṣe kedere.
- source_word: παρὰ θεοῦ πατρός
  choice: láti ọ̀dọ̀ Ọlọ́run Baba
  rationale: παρά pẹ̀lú genitive tọ́ka sí orísun; “láti ọ̀dọ̀” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá. A kò fi “wa” kún Baba nítorí kò sí nínú Gíríìkì.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: láti ọ̀dọ̀ Jésù Mèsáyà
  rationale: παρά tún tọ́ka sí orísun. Χριστός jẹ́ oyè; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́ dípò kí a kàn ṣàkọsílẹ̀ rẹ̀ gẹ́gẹ́ bí “Kristi.”
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: Ọmọ Baba
  rationale: Gbólóhùn genitive náà dúró ní apposition sí Jésù Mèsáyà, ó sì dá a mọ̀ gẹ́gẹ́ bí Ọmọ Baba. Ìtumọ̀ yìí kúrú, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: nínú òtítọ́ àti ìfẹ́
  rationale: “Nínú” fi ἐν hàn ní tààrà; a kò fi article kún àwọn orúkọ méjèèjì nítorí wọ́n jẹ́ àpèjúwe ànímọ́ níbí.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè tí a so mọ́ Jésù. “Mèsáyà” mú ìtumọ̀ oyè ẹni àmì òróró náà jáde; “Kristi” jẹ́ àkọsílẹ̀ oyè Gíríìkì tí ó wọ́pọ̀ nínú ìlò ìjọ.
- issue: Ìbáṣepọ̀ τοῦ υἱοῦ τοῦ πατρός pẹ̀lú Jésù
  choice: A fi “Ọmọ Baba” ṣe apposition tó dá Jésù Mèsáyà mọ̀
  alternative: Kí a ka a sí àpèjúwe tí kò so mọ́ ọn tímọ́tímọ́
  rationale: Ìṣètò Gíríìkì fi gbólóhùn náà mọ́ Jésù Mèsáyà ní tààrà, ṣùgbọ́n ìtumọ̀ kò fi èdè ẹ̀kọ́ ìgbàgbọ́ míì kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ni a lò, pẹ̀lú èdè ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. “Láti ọ̀dọ̀” àti “pẹ̀lú wa” jẹ́ àdánidá ju ìtumọ̀ gígùn lọ; a sì pa ìtẹ̀lé ìbùkún Gíríìkì mọ́.
