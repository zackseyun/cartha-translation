  terminology: «Arábìnrin» àti «àwọn ọmọ» dá ìbáṣepọ̀ ìdílé Gíríìkì dúró, láì pinnu bóyá wọ́n jẹ́ ẹni gidi tàbí àpẹẹrẹ ìjọ. «Ẹni tí a yàn» ń pa ìtumọ̀ ἐκλεκτή mọ́ láì sọ ẹni tó yàn án.
