  text: The children of your chosen sister greet you.
translation:
  language: yo
  text: Àwọn ọmọ arábìnrin rẹ̀, ẹni tí a yàn, ń kí ọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί σε
  choice: kí ọ
  rationale: Ọ̀rọ̀ ìkíni Yorùbá yìí fi ìṣe ìkíni sí ẹni tí a ń kọ̀wé sí hàn lọ́nà àdánidá.
- source_word: τὰ τέκνα
  choice: Àwọn ọmọ
  rationale: Ó túmọ̀ ọ̀pọ̀ ọmọ, bóyá ní ìtumọ̀ gidi tàbí gẹ́gẹ́ bí àpẹẹrẹ ìjọ.
- source_word: τῆς ἀδελφῆς σου
  choice: arábìnrin rẹ
  rationale: Ó pa ìbátan abo àti arọ́pò-orúkọ ẹni kejì mọ́.
- source_word: τῆς ἐκλεκτῆς
  choice: tí a yàn
  rationale: Ó fi ìtumọ̀ participle náà hàn láì sọ ẹni tó ṣe yíyàn ní kedere, bí Gíríìkì náà ṣe rí.
theological_decisions:
- issue: Bóyá ‘arábìnrin’ àti ‘àwọn ọmọ’ jẹ́ ẹni gidi tàbí àpẹẹrẹ ìjọ kan àti àwọn ọmọ ẹgbẹ́ rẹ̀
  choice: Pa àwòrán ìdílé náà mọ́ láì ṣàlàyé rẹ̀ nínú ẹsẹ̀.
  alternative: Túmọ̀ ọ́ ní tààrà gẹ́gẹ́ bí ‘ìjọ ... àti àwọn ọmọ ẹgbẹ́ rẹ̀.’
  rationale: Ọ̀rọ̀ Gíríìkì lè fara mọ́ ìtumọ̀ méjèèjì; títúmọ̀ àpẹẹrẹ náà síta yóò yanju àìdánilójú tí orísun kò yanju.
translation_notes:
  register: Yorùbá àkànṣe, pẹ̀lú àmì ohùn níbi tó yẹ; ọ̀rọ̀ náà kuru, níyì, ó sì ṣeé lóye fún òǹkàwé òde òní.
