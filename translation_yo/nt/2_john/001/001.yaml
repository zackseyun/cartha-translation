id: 2JN.1.1
reference: 2 John 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: yo
  text: Alàgbà náà, sí ìyáàfin àyànfẹ́[a] àti àwọn ọmọ rẹ̀, tí mo fẹ́ràn nínú òtítọ́[b]—kì í ṣe èmi nìkan ni, ṣùgbọ́n gbogbo àwọn tí wọ́n ti mọ òtítọ́ pẹ̀lú—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún ṣeé ṣe láti túmọ̀ rẹ̀ sí “sí ìyáàfin tí a yàn.” Àwọn kan gbà pé “ìyáàfin” jẹ́ àpèjúwe ìjọ agbègbè kan; àwọn mìíràn sì ka “Kyria” sí orúkọ obìnrin.
    reason: alternative_reading
  - marker: b
    text: Ó tún lè túmọ̀ sí “tọkàntọkàn”; gbólóhùn náà sì lè ní ìtumọ̀ tí ó wọ́pọ̀ nínú àwọn ìwé Johanu pé “nínú òtítọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Alàgbà náà
  rationale: “Alàgbà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tí a mọ̀ sí àgbà tàbí aṣáájú; ó pa àìdájú ọ̀rọ̀ Gíríìkì mọ́ láì fi ipò ẹ̀sìn kan pàtó kún un.
- source_word: ἐκλεκτῇ
  choice: àyànfẹ́
  rationale: Ó sọ ẹni tí a yàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn tí kò fi ẹ̀kọ́ ìsìn kan pàtó lé ọ̀rọ̀ náà lórí.
- source_word: κυρίᾳ
  choice: ìyáafin
  rationale: “Ìyáafin” ni ọ̀rọ̀ àdánidá àti ọ̀wọ̀ fún κυρία; ó jẹ́ kí a lè ka ọ̀rọ̀ náà sí obìnrin gidi tàbí sí àpèjúwe ìjọ kan.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: àwọn ọmọ rẹ̀
  rationale: τέκνα túmọ̀ sí àwọn ọmọ lápapọ̀, kì í ṣe àwọn ọmọkùnrin nìkan; “rẹ̀” kò sì yanjú bóyá ìyáafin gidi ni tàbí àpèjúwe ìjọ.
- source_word: οὓς ἐγὼ ἀγαπῶ
  choice: tí mo fẹ́ràn
  rationale: Èdè Yorùbá kò fi ìyàtọ̀ akọ, abo tàbí ọ̀pọ̀ hàn nínú arọ́pò-orúkọ àsopọ̀ “tí”; èyí jẹ́ kí ìtọ́kasí náà dúró ní fífẹ̀ bí ti Gíríìkì. “Fẹ́ràn” sì jẹ́ ìtumọ̀ àdánidá fún ἀγαπάω láì fi ìtẹnumọ́ tí kò sí kún un.
- source_word: ἐν ἀληθείᾳ
  choice: nínú òtítọ́
  rationale: 'Ó pa ìtumọ̀ méjèèjì mọ́: fífẹ́ tọkàntọkàn àti fífẹ́ láàárín tàbí ní ìbámu pẹ̀lú òtítọ́.'
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: kì í sì í ṣe èmi nìkan, ṣùgbọ́n gbogbo … pẹ̀lú
  rationale: Ìṣètò yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìyàtọ̀ tó wà láàárín òǹkọ̀wé àti gbogbo àwọn yòókù mọ́.
- source_word: οἱ ἐγνωκότες
  choice: àwọn tí ó ti mọ
  rationale: “Ó ti mọ” fi ipò ìsinsìnyí tí ó jẹ́ àbájáde bí wọ́n ṣe wá mọ̀ tẹ́lẹ̀ hàn, gẹ́gẹ́ bí ọ̀rọ̀ aláìlópìn Gíríìkì náà.
- source_word: τὴν ἀλήθειαν
  choice: òtítọ́
  rationale: “Òtítọ́” pa ìtumọ̀ ojoojúmọ́ àti ìtumọ̀ jíjinlẹ̀ ti ọ̀rọ̀ náà nínú àwọn ìwé Johanu mọ́.
theological_decisions:
- issue: Ta ni ἐκλεκτῇ κυρίᾳ ń tọ́ka sí?
  choice: A túmọ̀ rẹ̀ sí “ìyáafin àyànfẹ́,” bí ẹni pé obìnrin kan ni a ń kọ sí, ṣùgbọ́n a kò ti ilẹ̀kùn mọ́ ìtumọ̀ àpèjúwe ìjọ.
  alternative: Ó lè jẹ́ obìnrin Kristẹni kan àti àwọn ọmọ rẹ̀; ìjọ kan àti àwọn ọmọ ìjọ rẹ̀; tàbí “Kyria” gẹ́gẹ́ bí orúkọ obìnrin.
  rationale: Gíríìkì lè gba gbogbo ìtumọ̀ wọ̀nyí; nítorí náà, a kò yan ọ̀kan láti pa àwọn yòókù rẹ́.
- issue: Ìtumọ̀ ἐν ἀληθείᾳ
  choice: nínú òtítọ́
  alternative: tọkàntọkàn; nínú Òtítọ́
  rationale: Ìtumọ̀ tí a yàn lè tọ́ka sí ìfẹ́ tòótọ́, ó sì tún lè ní ìró ìtumọ̀ Johanu pé ìfẹ́ náà wà nínú tàbí ní ìbámu pẹ̀lú òtítọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá bá èdè mu. “Alàgbà” àti “ìyáafin” jẹ́ ọ̀rọ̀ tí òǹkàwé lásán lè lóye, láì mú èdè ẹ̀sìn onímọ̀ tàbí ìtumọ̀ ẹ̀ya ìjọ kan wọlé. Àwọn àmì ìdádúró ní òpin pa ìṣàn gbólóhùn tí ń tẹ̀ síwájú nínú ẹsẹ tó tẹ̀ lé e mọ́.
