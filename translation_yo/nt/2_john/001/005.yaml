id: 2JN.1.5
reference: 2 John 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: yo
  text: 'Àti nísinsin yìí, mo bẹ̀ ẹ, ìyáafin[a], kì í ṣe bí ẹni pé mo ń kọ òfin tuntun kan sí ẹ, ṣùgbọ́n òfin náà tí a ti ní láti ìbẹ̀rẹ̀: pé kí a nífẹ̀ẹ́ ara wa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó ṣeé ṣe kí “ìyáafin” tọ́ka sí ìjọ kan ní ọ̀nà ìṣàpẹẹrẹ, bí ó tilẹ̀ jẹ́ pé ó lè tọ́ka sí obìnrin kan; àwọn mìíràn sì ka Kíríà sí orúkọ obìnrin náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: mo bẹ̀ ọ́
  rationale: Nínú àyíká lẹ́tà yìí, ἐρωτάω túmọ̀ sí béèrè tàbí bẹ̀bẹ̀ pẹ̀lẹ́pẹ̀lẹ́. “Mo bẹ̀ ọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi agbára ọ̀rọ̀ náà ga ju bó ṣe yẹ lọ.
- source_word: κυρία
  choice: ìyá ọ̀wọ́n
  rationale: κυρία jẹ́ ọ̀rọ̀ ìpè fún obìnrin tí a bọ̀wọ̀ fún. “Ìyá ọ̀wọ́n” dá ìbòwọ̀ náà dúró, ó sì ṣì jẹ́ kí ó ṣeé ṣe pé obìnrin kan, ìjọ kan ní ìṣàpẹẹrẹ, tàbí orúkọ ẹni ni a ń tọ́ka sí.
- source_word: ἐντολὴν καινὴν
  choice: òfin tuntun kan
  rationale: “Òfin tuntun” jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún gbólóhùn náà, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ lílo ọ̀rọ̀ yìí nínú àwọn ìwé Johanu.
- source_word: γράφων σοι
  choice: mo ń kọ ... sí ọ
  rationale: A tú participle náà sí ọ̀rọ̀-ìṣe Yorùbá tó ń lọ lọ́wọ́ nínú ìkọ́lé “bí ẹni pé,” èyí tó jẹ́ àdánidá ní Yorùbá.
- source_word: ἣν εἴχομεν
  choice: èyí tí a ti ní
  rationale: “A ti ní” fi hàn pé ohun náà bẹ̀rẹ̀ ní ìgbà àtijọ́, ó sì ṣì wà pẹ̀lú wọn; ó bá ἀπ’ ἀρχῆς mu dáadáa.
- source_word: ἀπ’ ἀρχῆς
  choice: láti ìbẹ̀rẹ̀
  rationale: Èyí ni ìtumọ̀ tààrà, àdánidá, tó sì pa àṣà ọ̀rọ̀ Johanu mọ́.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: pé kí a máa nífẹ̀ẹ́ ara wa
  rationale: “Pé kí” fi àkóónú àti ìmúrasílẹ̀ subjunctive hàn; “máa nífẹ̀ẹ́” fi ìṣe tó ń bá a lọ hàn láìfi èrò ẹ̀kọ́ ìsìn míì kún un.
theological_decisions:
- issue: Ohun tí κυρία ń tọ́ka sí
  choice: Lo “ìyá ọ̀wọ́n” nínú ọ̀rọ̀ pàtàkì láìsọ bóyá obìnrin kan tàbí ìjọ ni.
  alternative: A lè túmọ̀ ọ́ sí ìjọ ní ìṣàpẹẹrẹ, tàbí kí a ka Κυρία sí orúkọ ẹni, Kíríà.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò yan ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí ní pàtó. Ìtumọ̀ náà àti àlàyé ìsàlẹ̀ yẹ kí wọ́n pa àìdánilójú tòótọ́ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo “ìyá ọ̀wọ́n” gẹ́gẹ́ bí ọ̀rọ̀ ìpè ọlọ́wọ̀ fún κυρία, kì í ṣe “ìyáafin,” nítorí “ìyáafin” lè mú èrò pé aya ẹnì kan ni, èyí tí Gíríìkì kò fi dandan hàn.
