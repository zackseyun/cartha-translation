  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: yo
  text: nítorí òtítọ́ tí ó ń dúró nínú wa[a], tí yóò sì wà pẹ̀lú wa títí láé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó ń gbé nínú wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: nítorí
  rationale: Pẹ̀lú ọ̀rọ̀-orúkọ ní accusative, διά ń fi ìdí tàbí okùnfà hàn. “Nítorí” jẹ́ ọ̀nà Yorùbá àdánidá láti so gbólóhùn yìí mọ́ ìfẹ́ tí ẹsẹ 1 mẹ́nu kàn.
- source_word: ἀλήθειαν
  choice: òtítọ́
  rationale: “Òtítọ́” túmọ̀ ἀλήθεια ní tààrà, ó sì pa ìtumọ̀ jíjinlẹ̀ àti ààyè ìtumọ̀ inú ọ̀rọ̀ Johanu mọ́ láìfi àlàyé onítumọ̀ kún un.
- source_word: τὴν μένουσαν
  choice: tí ó ń dúró
  rationale: Àpólà present participle μένουσαν ń tọ́ka sí ohun tí ó ń bá a lọ láti wà. “Tí ó ń dúró” jẹ́ èdè Yorùbá tó ṣe kedere, ó sì pa ìtumọ̀ ìtẹ̀síwájú náà mọ́.
- source_word: ἐν ἡμῖν
  choice: nínú wa
  rationale: ἐν pẹ̀lú dative túmọ̀ sí “nínú wa” ní tààrà níbí; èyí kò yí ọ̀rọ̀ náà sí “láàárín wa,” bó tilẹ̀ jẹ́ pé ìtumọ̀ yẹn lè ṣeé rò.
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: tí yóò sì wà pẹ̀lú wa
  rationale: μετά pẹ̀lú genitive ni “pẹ̀lú,” ἔσται sì jẹ́ ọ̀rọ̀ ọjọ́ iwájú fún “wà.” Fífi “dúró” kún un lẹ́ẹ̀kejì yóò fi ohun tí kò sí ní tààrà sínú apá yìí.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láé
  rationale: Àṣà-ọ̀rọ̀ Gíríìkì yìí ń tọ́ka sí ohun tí kò ní òpin; “títí láé” ni àfiwé Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
theological_decisions:
- issue: Ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ Johanu “òtítọ́”
  choice: A fi “òtítọ́” sílẹ̀ láìsọ pé ó túmọ̀ sí ìhìn rere, ẹ̀kọ́ tòótọ́, Kristi fúnra rẹ̀, tàbí ìṣípayá Ọlọ́run tí Ẹ̀mí ń mú ṣiṣẹ́.
  alternative: “òtítọ́ ìhìn rere” tàbí “ẹ̀kọ́ òtítọ́”
  rationale: Ọ̀rọ̀ Gíríìkì kò fi ìtumọ̀ náà mọ́ ọ̀kan ṣoṣo nínú àwọn àṣàyàn wọ̀nyí. “Òtítọ́” pa ìjìnlẹ̀ àti àìdánilójú tó mọ́gbọ́n dání nínú orísun náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ó ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A pa ìrísí gbólóhùn tó bẹ̀rẹ̀ pẹ̀lú “nítorí” mọ́, nítorí pé ó ń bá ẹsẹ 1 lọ dípò kí ó jẹ́ gbólóhùn olómìnira.
