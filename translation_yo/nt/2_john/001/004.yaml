id: 2JN.1.4
reference: 2 John 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: yo
  text: Inú mi dùn gidigidi pé mo ti rí àwọn kan lára àwọn ọmọ rẹ[b] tí ń rìn nínú òtítọ́[a], gẹ́gẹ́ bí a ti gba àṣẹ láti ọ̀dọ̀ Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní òtítọ́.” Gbolohun náà kò ṣeé dín kù sí jíjẹ́ olóòótọ́ nìkan; ó ṣeé ṣe kí ó túmọ̀ sí gbígbé ní ìbámu pẹ̀lú òtítọ́ tí a ti fi hàn.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “lára àwọn ọmọ rẹ”; ọ̀rọ̀ náà tọ́ka sí àwọn kan nínú wọn, kò sì fi dandan hàn pé gbogbo wọn ni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: Inú mi dùn gidigidi
  rationale: Ọ̀rọ̀ yìí fi ayọ̀ ńlá hàn ní Yorùbá àdánidá, ó sì pa agbára λίαν mọ́.
- source_word: εὕρηκα
  choice: mo ti rí
  rationale: Àkópọ̀ ‘ti’ àti ọ̀rọ̀-ìṣe náà fi ipò tí ó jẹ́ àbájáde ohun tí ẹni náà ti ṣàwárí hàn, bí perfect tense Gíríìkì.
- source_word: ἐκ τῶν τέκνων σου
  choice: àwọn kan lára àwọn ọmọ rẹ
  rationale: 'Èyí pa ìtumọ̀ partitive ti ἐκ mọ́: àwọn kan nínú wọn ni a rí, kì í ṣe pé gbogbo wọn ni ọ̀rọ̀ náà dá lé.'
- source_word: περιπατοῦντας
  choice: tí ń rìn
  rationale: A pa àkàwé Johannine ti ‘rìn’ mọ́ dípò yíyí i padà sí ‘gbé ìgbésí ayé,’ nígbà tí gbolohun náà ṣì ṣeé lóye ní Yorùbá.
- source_word: ἐν ἀληθείᾳ
  choice: nínú òtítọ́
  rationale: Èyí pa èrò pé òtítọ́ ni àyíká tàbí ìlànà ìgbé-ayé wọn mọ́, láì dín un kù sí jíjẹ́ olóòótọ́ nìkan.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìbámu láàárín ìrìn wọn àti àṣẹ tí a gbà hàn lọ́nà Yorùbá àdánidá.
- source_word: ἐντολὴν ἐλάβομεν
  choice: àṣẹ tí àwa gbà
  rationale: ‘Àṣẹ’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ἐντολή; fífi ‘àwa’ hàn tẹnu mọ́ plural ἐλάβομεν láì jẹ́ kí gbolohun náà le.
- source_word: παρὰ τοῦ πατρός
  choice: láti ọ̀dọ̀ Baba
  rationale: A pa orúkọ oyè ‘Baba’ mọ́ láì fi ‘Ọlọ́run’ kún ohun tí Gíríìkì kò sọ.
theological_decisions:
- issue: Ẹni tí ‘Baba’ ń tọ́ka sí
  choice: Baba
  alternative: Ọlọ́run Baba
  rationale: Gíríìkì sọ ‘Baba’ nìkan. Àyíká Johannine mú ẹni tí ó ń tọ́ka sí ṣe kedere, nítorí náà a kò fi ọ̀rọ̀ míì kún un.
- issue: Ìwọ̀n àwọn ‘ọmọ rẹ’ tí ọ̀rọ̀ náà kàn
  choice: àwọn kan lára àwọn ọmọ rẹ
  alternative: àwọn ọmọ rẹ
  rationale: ἐκ + genitive ní ìtumọ̀ partitive; ó sọ pé àwọn kan lára wọn ni, kò sì fi hàn pé gbogbo wọn ni.
- issue: Ìtumọ̀ ‘nínú òtítọ́’
  choice: Pa àkàwé àti ìtumọ̀ gbígbé ní ìbámu pẹ̀lú òtítọ́ mọ́
  alternative: ní òtítọ́ / pẹ̀lú òtítọ́ inú
  rationale: Gbolohun Johannine náà lè tọ́ka sí gbígbé lábẹ́ òtítọ́ tí a ti fi hàn, kì í ṣe òtítọ́ inú tàbí àìṣèké nìkan; a pa ìjinlẹ̀ yìí mọ́ láì túmọ̀ rẹ̀ jù.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. A pa àkàwé ‘rìn nínú òtítọ́’ mọ́ nítorí ipa rẹ̀ nínú ìwé Johanu. Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn gbolohun tí wọ́n ń ṣàlàyé.
