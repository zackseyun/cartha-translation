id: GAL.6.9
reference: Galatians 6:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: yo
  text: Kí a má ṣe rẹ̀wẹ̀sì ní ṣíṣe ohun rere[a], nítorí ní àkókò tí ó yẹ[b], a ó kórè, bí a kò bá jáwọ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ṣíṣe ohun tí ó dára.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní àkókò tirẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Ní ti gidi, “láìrẹ̀ tán.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: ní ṣíṣe ohun rere
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ṣíṣe ohun tí ó dára tàbí tí ó yẹ ní ti ìwà. ‘Ṣíṣe ohun rere’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ ìwà rere náà mọ́.
- source_word: μὴ ἐγκακῶμεν
  choice: Kí a má ṣe rẹ̀wẹ̀sì
  rationale: ἐγκακέω lè túmọ̀ sí kí ìrẹ̀wẹ̀sì má bà ènìyàn tàbí kí ènìyàn má sọ ìgboyà nù. ‘Rẹ̀wẹ̀sì’ fi ìpè sí ìfaradà hàn láì sọ pé àárẹ̀ ara lásán ni.
- source_word: καιρῷ ... ἰδίῳ
  choice: ní àkókò tí ó yẹ
  rationale: καιρός pẹ̀lú ἴδιος ń tọ́ka sí àkókò tí ó bá mu, tàbí àkókò tí a yàn fún ohun náà. Gbólóhùn Yorùbá yìí ṣe àfihàn èrò náà ní kedere.
- source_word: θερίσομεν
  choice: a ó kórè
  rationale: ‘Kórè’ pa àwòrán iṣẹ́ àgbẹ̀ tí ó wà nínú ọ̀rọ̀ Gíríìkì àti àyíká ẹsẹ náà mọ́.
- source_word: μὴ ἐκλυόμενοι
  choice: bí a kò bá jáwọ́
  rationale: 'Participle náà ní agbára ipò: ìkórè yóò dé bí wọn kò bá dẹ́kun ìsapá nítorí àárẹ̀ tàbí ìrẹ̀wẹ̀sì. ‘Jáwọ́’ yà á díẹ̀ sí ‘rẹ̀wẹ̀sì’ àkọ́kọ́, ó sì pa ìbáṣepọ̀ wọn mọ́.'
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ἐγκακῶμεν àti ἐκλυόμενοι
  choice: 'Lo ọ̀rọ̀ méjì tí ó jọra ṣùgbọ́n tí kò jẹ́ ọ̀kan náà: ‘rẹ̀wẹ̀sì’ àti ‘jáwọ́.’'
  alternative: Lo ‘rẹ̀wẹ̀sì’ fún àwọn méjèèjì, tàbí ‘sọ ìgboyà nù’ àti ‘rẹ̀ tán.’
  rationale: Pọ́ọ̀lù lo ọ̀rọ̀ méjì tí ìtumọ̀ wọn sún mọ́ra ṣùgbọ́n tí kò dọ́gba pátápátá. Yíyà wọn sọ́tọ̀ pa ìtẹnumọ́ ọ̀rọ̀ náà mọ́ láì fi èrò ẹ̀kọ́ ìsìn kún un.
- issue: Agbára ipò inú μὴ ἐκλυόμενοι
  choice: Túmọ̀ rẹ̀ sí ‘bí a kò bá jáwọ́.’
  alternative: ‘láìrẹ̀ tán’ tàbí ‘nígbà tí a kò rẹ̀wẹ̀sì.’
  rationale: Ìtumọ̀ onípò náà bá ìlò participle mu nínú àyíká yìí, ó sì jẹ́ kí ìbáṣepọ̀ láàárín ìfaradà àti ìkórè hàn, láì túbọ̀ ṣàlàyé irú ìkórè náà ju bí ọ̀rọ̀ ṣe sọ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tí ó níyì ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. A pa àwòrán ìkórè mọ́, a sì lo ‘rẹ̀wẹ̀sì’ àti ‘jáwọ́’ láti fi ìyàtọ̀ kékeré tó wà láàárín àwọn ọ̀rọ̀ Gíríìkì méjèèjì hàn.
