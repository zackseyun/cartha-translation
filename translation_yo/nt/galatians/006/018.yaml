id: GAL.6.18
reference: Galatians 6:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ Olúwa wa Jésù Mèsáyà[a] wà pẹ̀lú ẹ̀mí yín, ẹ̀yin ará[b]. Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìlò àṣà tí ó wọ́pọ̀, “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ orúkọ oyè tó túmọ̀ sí “Mèsáyà,” ẹni tí a fòróró yàn.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ἀδελφοί jẹ́ akọ ní ìrísí gírámà (“arákùnrin”), ṣùgbọ́n níbí ó ń bá gbogbo àwùjọ onígbàgbọ́ sọ̀rọ̀, ó sì lè ní àwọn ọkùnrin àti obìnrin nínú.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ Yòrùbá yìí jẹ́ ọ̀nà tí ó wọ́pọ̀, tí ó sì ní ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ tó yẹ fún χάρις nínú ìbùkún ìparí lẹ́tà Paulu.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó bá ìtumọ̀ κύριος gẹ́gẹ́ bí orúkọ oyè mu, ó sì jẹ́ èdè ìjẹ́wọ́ ìgbàgbọ́ tí àwọn Kristẹni Yòrùbá mọ̀ dáadáa.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ orúkọ oyè níbí; “Mèsáyà” pa ìtumọ̀ ẹni tí a fòróró yàn mọ́ dípò kí a fi sílẹ̀ bí orúkọ kejì lásán.
- source_word: μετὰ
  choice: kí ... wà pẹ̀lú
  rationale: Gíríìkì kò ní ọ̀rọ̀-ìṣe ní gbólóhùn ìbùkún yìí; fífi “kí ... wà” kún un mú un jẹ́ Yòrùbá àdánidá láì yí agbára ìbùkún náà padà.
- source_word: πνεύματος ὑμῶν
  choice: ẹ̀mí yín
  rationale: Ìtumọ̀ yìí pa “ẹ̀mí” tó jẹ́ ẹyọ kan àti “yín” tó ń tọ́ka sí ọ̀pọ̀ ènìyàn mọ́, gẹ́gẹ́ bí ìkọ̀wé Gíríìkì.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yòrùbá àdánidá fún àwọn ọmọ ìjọ kan náà, ó sì lè kan ọkùnrin àti obìnrin bí ọ̀rọ̀ Gíríìkì ṣe ń ṣiṣẹ́ ní àyíká yìí.
- source_word: ἀμήν
  choice: Àmín
  rationale: Ìkọ̀wé Yòrùbá tí a mọ̀ sí ọ̀nà ìparí ìbùkún àti àdúrà ni.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ìbùkún ìparí Paulu
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nítorí Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè, “Mèsáyà” mú ìtumọ̀ oyè náà hàn; àṣàyàn “Kristi” tí ó wọ́pọ̀ wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ἀδελφοί fún gbogbo àwùjọ onígbàgbọ́
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin; ẹ̀yin arákùnrin àti arábìnrin
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ akọ ní gírámà, ṣùgbọ́n ó ń bá gbogbo ìjọ sọ̀rọ̀. “Ẹ̀yin ará” jẹ́ Yòrùbá adayeba tí kò pa ìtumọ̀ ìbátan ẹbí ìgbàgbọ́ rẹ́, àlàyé ìsàlẹ̀ sì sọ ìrísí Gíríìkì di mímọ̀.
- issue: Ẹ̀mí ẹyọ kan pẹ̀lú arọ́pò-orúkọ ọ̀pọ̀
  choice: ẹ̀mí yín
  alternative: ẹ̀mí ọ̀kọ̀ọ̀kan yín; kí ó wà pẹ̀lú yín
  rationale: Ìtumọ̀ pàtó yìí pa ìfararora tó wà nínú πνεύματος ὑμῶν mọ́, láì pinnu bóyá Paulu ń tọ́ka sí ẹ̀mí àwùjọ tàbí ẹ̀mí ọ̀kọ̀ọ̀kan wọn.
translation_notes:
  register: Èdè náà jẹ́ Yòrùbá boṣewa, ọlọ́wọ̀, ṣókí, tí ó sì yẹ fún ìbùkún ìparí lẹ́tà. A lo àmì ohùn ní kíkún níbi tí ó ti jẹ́ àdánidá, a sì pa ìṣètò àti ìwọ̀n ọ̀rọ̀ Gíríìkì mọ́ ní Yòrùbá tó ṣeé lóye.
