  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: yo
  text: 'Ẹ má ṣe jẹ́ kí wọ́n tàn yín jẹ́: a kì í fi Ọlọ́run ṣe ẹlẹ́yà; nítorí ohun yòówù tí ènìyàn bá fúnrúgbìn, òun náà ni yóò ká.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Ẹ má ṣe jẹ́ kí a tàn yín jẹ
  rationale: Ó pa ìtumọ̀ àṣẹ ìkìlọ̀ oníbọ̀wọ̀ àti ọ̀pọ̀ ènìyàn mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé kí wọn má ṣe gba ẹ̀tàn.
- source_word: θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún θεός níbí.
- source_word: οὐ μυκτηρίζεται
  choice: A kò lè fi Ọlọ́run ṣe ẹlẹ́yà
  rationale: Ìtumọ̀ μυκτηρίζω ni fífi ẹnì kan ṣẹ̀sín tàbí hùwà sí i pẹ̀lú ẹ̀gàn. Ọ̀rọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa agbára òwe ìkìlọ̀ náà mọ́; ‘kò lè’ kò túmọ̀ sí àìlera gírámà, bí kò ṣe pé ẹ̀gàn sí Ọlọ́run kò lè borí tàbí yọrí sí lílọ láìsí èsì.
- source_word: ὃ γὰρ ἐὰν
  choice: nítorí ohun yòówù tí
  rationale: Ó fi ipò gbogbogbò tí àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà ń gbé kalẹ̀ hàn ní Yorùbá tó ṣe kedere.
- source_word: σπείρῃ
  choice: bá fúnrúgbìn
  rationale: Ó pa àwòrán iṣẹ́ àgbẹ̀ ti gbígbìn irúgbìn mọ́, ó sì bá ọ̀rọ̀ ‘ká’ mu.
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: ἄνθρωπος níbí ń tọ́ka sí ẹ̀dá ènìyàn lápapọ̀, kì í ṣe ọkùnrin ní ìyàtọ̀ sí obìnrin. ‘Ènìyàn’ jẹ́ ìbámu gangan, àdánidá, ó sì pa ìtumọ̀ aṣojú ẹyọ kan mọ́ láì nílò àlàyé ẹsẹ̀.
- source_word: τοῦτο καὶ θερίσει
  choice: òun náà ni yóò ká
  rationale: ‘Òun náà’ tẹnumọ́ pé ohun tí a gbìn gan-an ni a ó ká, ní ìbámu pẹ̀lú τοῦτο καί; ‘ká’ sì pa àwòrán ìkórè mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἄνθρωπος gẹ́gẹ́ bí ẹyọ aṣojú gbogbo ènìyàn
  choice: ènìyàn
  alternative: ọkùnrin kan
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἄνθρωπος jẹ́ gbogbogbò, ó kan ọkùnrin àti obìnrin. Yorùbá ‘ènìyàn’ pa ẹyọ aṣojú náà mọ́, kò sì mú ìtumọ̀ akọ tí kò ṣe pàtàkì wọlé.
- issue: Agbára gbólóhùn οὐ μυκτηρίζεται
  choice: A kò lè fi Ọlọ́run ṣe ẹlẹ́yà
  alternative: A kì í fi Ọlọ́run ṣe ẹlẹ́yà
  rationale: Àṣàyàn náà pa ìkìlọ̀ pé a kò lè hùwà ẹ̀gàn sí Ọlọ́run láìdojú kọ àbájáde mọ́, gẹ́gẹ́ bí àlàyé gbígbìn àti ìkórè ṣe ń fi hàn. Kò sọ pé ènìyàn kò lè gbìyànjú láti ṣẹ̀sín Ọlọ́run.
translation_notes:
  register: Yorùbá ìpele boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́wọ̀, kedere, ó sì ní ìró òwe. A lo ‘ẹ’ fún ọ̀pọ̀ ẹni tí àṣẹ Gíríìkì ń bá sọ̀rọ̀, ‘ènìyàn’ fún ẹyọ aṣojú gbogbo ẹ̀dá ènìyàn, àti ‘fúnrúgbìn/ká’ láti pa àwòrán iṣẹ́ àgbẹ̀ mọ́.
