id: GAL.6.8
reference: Galatians 6:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: yo
  text: Nítorí ẹni tí ó ń gbin sí ẹran ara tirẹ̀[a] yóò ká ìbàjẹ́[b] láti inú ẹran ara; ṣùgbọ́n ẹni tí ó ń gbin sí Ẹ̀mí[c] yóò ká ìyè àìnípẹ̀kun láti inú Ẹ̀mí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “sí ìwà ẹ̀ṣẹ̀ tirẹ̀.” Ọ̀rọ̀ Gíríìkì náà, sarx, lè túmọ̀ sí ẹran ara gan-an tàbí, nínú ìforígbárí ìwà tí Pọ́ọ̀lù ń ṣe, ìtẹ̀sí ènìyàn tó ṣubú tí ó lòdì sí Ẹ̀mí.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè jẹ́ “ìparun” tàbí “ìdíbàjẹ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìbàjẹ́, ìparun, tàbí díbàjẹ́ díẹ̀díẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni, Ẹ̀mí Mímọ́. Àwọn kan lè kọ ọ́ sí “ẹ̀mí” pẹ̀lú lẹ́tà kékeré, ṣùgbọ́n nínú Gálátíà, ìyàtọ̀ yìí sábà ń tọ́ka sí Ẹ̀mí Ọlọ́run.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń fi ìdí ọ̀rọ̀ ìṣírí tó ṣáájú múlẹ̀, ó sì bójú mu ní èdè Yorùbá.
- source_word: ὁ σπείρων
  choice: ẹni tí ó ń gbin
  rationale: Ó pa àwòrán iṣẹ́ àgbẹ̀ àti ìtumọ̀ gbogbogbò ti ọ̀rọ̀ arọ́pò-orúkọ olùṣe náà mọ́.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: sí ẹran ara tirẹ̀
  rationale: “Sí” ń ṣàfihàn ibi tàbí ohun tí iṣẹ́ gbígbìn náà dojú kọ; “tirẹ̀” sì pa ìtẹnumọ́ ἑαυτοῦ mọ́. “Ẹran ara” tún pa ọ̀rọ̀ pàtàkì tí Paulu lò mọ́ láì túmọ̀ rẹ̀ ní ọ̀nà ẹ̀kọ́ kan ṣoṣo.
- source_word: ἐκ τῆς σαρκὸς
  choice: láti inú ẹran ara
  rationale: Ó fi orísun èso náà hàn, ó sì bá gbólóhùn tó jọ ọ́ nípa Ẹ̀mí dọ́gba.
- source_word: θερίσει
  choice: yóò ká
  rationale: “Ká” jẹ́ ọ̀rọ̀ àgbẹ̀ tó bá “gbin” mu, ó sì pa àwòrán gbígbìn àti kíkórè mọ́.
- source_word: φθοράν
  choice: ìbàjẹ́
  rationale: Ọ̀rọ̀ yìí lè gba èrò ìdíbàjẹ́, ìrẹ̀wẹ̀sì tàbí ìparun; “ìbàjẹ́” pa ìtumọ̀ rẹ̀ ní fífẹ̀ mọ́ láì dín un kù sí ìparun nìkan.
- source_word: ὁ δὲ σπείρων
  choice: ṣùgbọ́n ẹni tí ó ń gbin
  rationale: “Ṣùgbọ́n” mú ìyàtọ̀ tó wà láàárín àwọn ọ̀nà méjèèjì jáde, ìlànà gbólóhùn náà sì dúró ní ìwọ̀ntúnwọ̀nsì.
- source_word: εἰς τὸ πνεῦμα
  choice: sí Ẹ̀mí
  rationale: Nínú ìwé Gálátíà, ìyàtọ̀ ẹran ara àti Ẹ̀mí sábà ń tọ́ka sí Ẹ̀mí Ọlọ́run; lílo lẹ́tà ńlá ń fi èyí hàn.
- source_word: ἐκ τοῦ πνεύματος
  choice: láti inú Ẹ̀mí
  rationale: Ó pa ìtumọ̀ orísun àti ìfarajọ pẹ̀lú “láti inú ẹran ara” mọ́.
- source_word: ζωὴν αἰώνιον
  choice: ìyè àìnípẹ̀kun
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó ṣe kedere, fún ìyè tí kò ní òpin.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ìyàtọ̀ ìwà rere tí Paulu ń ṣe
  choice: ẹran ara
  alternative: ìwà ẹ̀ṣẹ̀ inú ènìyàn
  rationale: “Ẹran ara” pa ọ̀rọ̀ àti ìforígbárí ẹ̀kọ́ Paulu mọ́; àlàyé ìsàlẹ̀ ojú ìwé ń jẹ́ kí òǹkàwé rí ìtumọ̀ àfidámọ̀ tó ṣeé ṣe láì fi í ṣe ìtumọ̀ kan ṣoṣo nínú àyọkà.
- issue: Ẹni tí πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí
  alternative: ẹ̀mí
  rationale: Àyíká ìwé Gálátíà, pàápàá ìyàtọ̀ ẹran ara àti Ẹ̀mí, mú kí Ẹ̀mí Mímọ́ jẹ́ ẹni tí ọ̀rọ̀ náà ṣeé ṣe jù lọ láti tọ́ka sí, bí ó tilẹ̀ jẹ́ pé lẹ́tà Gíríìkì fúnra rẹ̀ kò fi lẹ́tà ńlá yà á sọ́tọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbéléwọ̀n, ọ̀wọ̀, tí òǹkàwé òde òní lè lóye. A pa àwòrán iṣẹ́ àgbẹ̀ “gbin/ká” àti ìfarajọ àwọn apá méjèèjì mọ́; a sì lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
