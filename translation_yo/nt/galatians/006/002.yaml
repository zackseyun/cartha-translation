source:
  edition: SBLGNT
  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: yo
  text: 'Ẹ máa ru ẹrù ara yín, ní ọ̀nà yìí ẹ ó sì mú òfin Mèsáyà[a] ṣẹ.


    [a] Tàbí: “òfin Kristi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “òfin Kristi.”'
    reason: Ó fúnni ní àṣàyàn ìtumọ̀ àṣà fún Χριστοῦ láì yí oyè “Mèsáyà” inú ẹsẹ̀ pàtàkì padà.
lexical_decisions:
- source_word: ἀλλήλων
  choice: ara yín
  rationale: Ọ̀rọ̀ arọ́pò àsùnsì yìí fi hàn pé iṣẹ́ náà jẹ́ ti gbogbo wọn sí ara wọn; “ara yín” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìbáṣepọ̀ yìí.
- source_word: τὰ βάρη
  choice: ẹrù
  rationale: “Ẹrù” lè túmọ̀ sí ohun tó wuwo ní ti ara, ó sì tún lè dúró fún ìṣòro tàbí ìnira tí ẹnì kan ń fara dà; ó pa àkàwé Gíríìkì mọ́.
- source_word: βαστάζετε
  choice: Ẹ máa bá ... ru
  rationale: “Ẹ máa” mú ìlànà onítẹ̀síwájú inú ọ̀rọ̀ àṣẹ Gíríìkì jáde, “bá ... ru” sì jẹ́ ọ̀nà àdánidá láti sọ pé kí wọ́n kópa nínú rírú ẹrù ara wọn.
- source_word: οὕτως
  choice: tipa bẹ́ẹ̀
  rationale: Ó so ìgbọràn sí àṣẹ àkọ́kọ́ pọ̀ mọ́ àbájáde rẹ̀ ní Yorùbá òde òní.
- source_word: ἀναπληρώσετε
  choice: ẹ ó ... mú ... ṣẹ
  rationale: Ó pa ọ̀rọ̀-ìṣe ọjọ́ iwájú mọ́, “mú òfin ṣẹ” sì jẹ́ àsọyé Yorùbá tó bá “fulfill the law” mu.
- source_word: τὸν νόμον
  choice: òfin
  rationale: “Òfin” ni ìtumọ̀ tààrà tí ó sì pa ìbáṣepọ̀ ọ̀rọ̀ náà mọ́ pẹ̀lú ojúṣe ìwà rere àti àwọn lílo νόμος mìíràn nínú lẹ́tà náà.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Nínú gbólóhùn yìí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” túmọ̀ oyè náà, ó sì pa àyíká Júù rẹ̀ mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè nínú “òfin Mèsáyà”; “Mèsáyà” ń sọ ìtumọ̀ oyè náà, nígbà tí “Kristi” jẹ́ àṣà ìtumọ̀ tí ó gbilẹ̀, nítorí náà a fi í sínú àlàyé ìsàlẹ̀.
- issue: Ìbáṣepọ̀ “òfin” pẹ̀lú Mèsáyà
  choice: òfin Mèsáyà
  alternative: ìlànà Mèsáyà
  rationale: A pa genitive Gíríìkì àti ọ̀rọ̀ “òfin” mọ́ láì pinnu bóyá ó túmọ̀ sí òfin tí Mèsáyà fúnni, èyí tí ó jẹ́ tirẹ̀, tàbí èyí tí ìwà rẹ̀ ń ṣàpẹẹrẹ.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. “Ẹ máa bá ara yín ru ẹrù” jẹ́ àsọyé tí ó rọrùn fún òǹkàwé, ó sì pa ìtumọ̀ ìrànlọ́wọ́ alábàápín àti iṣẹ́ onítẹ̀síwájú mọ́. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
