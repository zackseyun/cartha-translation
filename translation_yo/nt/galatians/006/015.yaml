  to: Nítorí pé ìkọlà kò níye kankan[a], bẹ́ẹ̀ ni àìkọlà; ṣùgbọ́n ìṣẹ̀dá tuntun[b].
  rationale: Àtúnṣe náà rọ́pò àpólà tí kò péye fún τί ἐστιν pẹ̀lú “kò níye kankan,” èyí tí ó ṣe kedere, ó sì bá ìtumọ̀ ọ̀rọ̀ náà nínú àyíká Pọ́ọ̀lù mu. “Ṣùgbọ́n” pa ἀλλά mọ́ gẹ́gẹ́ bí ìtakora, “ìṣẹ̀dá tuntun” sì sọ καινὴ κτίσις ní ìtumọ̀ tó kúnrẹ́rẹ́ jù. A tún ọ̀rọ̀ ẹsẹ̀-ìsàlẹ̀ ṣe fún ìmọ́tótó Yorùbá àti ìbámu pẹ̀lú àwọn àṣàyàn ìtumọ̀.
