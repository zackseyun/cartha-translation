source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: yo
  text: Nítorí pé ìkọlà kò níye kankan[a], bẹ́ẹ̀ ni àìkọlà; ṣùgbọ́n ìṣẹ̀dá tuntun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò ṣe ohun kan” tàbí “kò ní ìjẹ́pàtàkì.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ̀dá tuntun”; ṣùgbọ́n ìtumọ̀ náà lè tọ́ka sí ẹni tuntun tí a dá, èyí tí kò fi bẹ́ẹ̀ bá àyíká ọ̀rọ̀ mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Nítorí pé … kò …, bẹ́ẹ̀ ni …
  rationale: “Nítorí pé” mú ìtumọ̀ ìṣàlàyé γάρ jáde, nígbà tí “kò …, bẹ́ẹ̀ ni …” fi ìbáṣepọ̀ οὔτε … οὔτε hàn lọ́nà Yorùbá àdánidá.
- source_word: περιτομή
  choice: ìkọlà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ fún iṣẹ́ ìkọlà; ó lè tọ́ka sí iṣẹ́ náà àti ipò májẹ̀mú tí iṣẹ́ náà ń ṣàmì sí.
- source_word: τί ἐστιν
  choice: kò já mọ́ nǹkan kan
  rationale: Àpólà yìí sọ pé kò ní ìjẹ́pàtàkì tàbí iye tí yóò pinnu ọ̀ràn; “kò já mọ́ nǹkan kan” jẹ́ Yorùbá àdánidá, ó sì pa ìsọ̀rọ̀ Gíríìkì mọ́ láìṣe àfikún ẹ̀kọ́ ìsìn.
- source_word: οὔτε ἀκροβυστία
  choice: bẹ́ẹ̀ ni àìkọlà
  rationale: “Àìkọlà” jẹ́ alátakò “ìkọlà” ní kedere, ó sì ń tọ́ka sí ipò ẹni tí a kò kọ ní ilà, kì í ṣe kìkì apá ara.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Ó fi ìtakora líle hàn, ó sì darí sí ohun kan ṣoṣo tí ó ṣe pàtàkì nínú gbólóhùn náà.
- source_word: καινὴ κτίσις
  choice: ẹ̀dá tuntun
  rationale: “Ẹ̀dá” lè túmọ̀ sí iṣẹ́ ìṣẹ̀dá tàbí ohun/ẹni tí a dá, gẹ́gẹ́ bí κτίσις; yíyan yìí pa fífẹ̀ ìtumọ̀ náà mọ́ dípò dídín in sí ẹni kọ̀ọ̀kan nìkan.
theological_decisions:
- issue: Ìtakora láàárín ìkọlà/àìkọlà àti ẹ̀dá tuntun
  choice: A sọ pé kò sí èyí nínú ipò méjèèjì tó já mọ́ nǹkan kan ní ìfiwéra pẹ̀lú ẹ̀dá tuntun.
  alternative: Kí a túmọ̀ ọ́ sí pé Pọ́ọ̀lù ń sọ nípa àmì ìdánimọ̀ láwùjọ nìkan, tàbí pé ipò méjèèjì jẹ́ ọ̀nà méjì tí ó dọ́gba.
  rationale: Ọ̀rọ̀ Gíríìkì kọ ìjẹ́pàtàkì ipò méjèèjì, ó sì fi “ẹ̀dá tuntun” takò wọ́n. Ìtumọ̀ náà pa ìtakora yìí mọ́ láìfi ẹ̀kọ́ ẹgbẹ́ ìsìn kan kún un.
translation_notes:
  register: Yorùbá àgbàṣe, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “kò já mọ́ nǹkan kan” fún ìtumọ̀ àdánidá tí kò sọ ìtumọ̀ ẹ̀kọ́ ìsìn ju ohun tí Gíríìkì sọ lọ; “ẹ̀dá tuntun” sì pa àìdánilójú κτίσις mọ́.
