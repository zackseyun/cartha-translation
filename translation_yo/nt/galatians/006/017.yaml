id: GAL.6.17
reference: Galatians 6:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: yo
  text: Láti ìsinsìnyí lọ, kí ẹnikẹ́ni má ṣe yọ mí lẹ́nu mọ́, nítorí mo ru àwọn àmì Jesu lára mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn àmì iná’; ọ̀rọ̀ náà lè tọ́ka sí àwọn àmì lára ẹni tí ń fi ẹni tí ó ni ẹni náà tàbí ẹni tí ẹni náà dúró tì hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Láti ìsinsìnyí lọ
  rationale: Ó jẹ́ gbólóhùn àkókò tó túmọ̀ sí ‘láti ìsinsìnyí lọ’; èyí jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì bá ìkìlọ̀ ìparí Paulu mu.
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: kí ẹnikẹ́ni má ṣe yọ mí lẹ́nu mọ́
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ yìí, κόπους παρέχειν túmọ̀ sí dídá ìṣòro tàbí ìyọnu sí ẹnì kan. ‘Yọ mí lẹ́nu’ sọ ìtumọ̀ náà ní Yorùbá òde òní, ‘mọ́’ sì mú ìfòfindè tó tẹ̀ síwájú àti ọ̀rọ̀ ‘láti ìsinsìnyí lọ’ hàn.
- source_word: τὰ στίγματα
  choice: àmì
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn àmì ara, títí kan àmì tí a fi ń dá ẹni tí ó jẹ́ ti olúwa kan mọ̀. ‘Àmì’ kò fi dandan sọ pé àpá ni tàbí àmì iná, nítorí náà ó pa àìdánilójú inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τοῦ Ἰησοῦ
  choice: Jesu
  rationale: Ìtumọ̀ ‘àmì Jesu’ pa ìbáṣepọ̀ gẹnitífù mọ́ láì pinnu bóyá ó túmọ̀ sí àmì tí Jesu ni, àmì nítorí Jesu, tàbí àmì tó ń fi ìjẹ́-tí-Jesu hàn.
- source_word: ἐν τῷ σώματί μου
  choice: lára mi
  rationale: ‘Lára mi’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ibi tí àwọn àmì ara wà, ó sì ṣàfihàn ara Paulu gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ti ṣe.
- source_word: βαστάζω
  choice: mo ru
  rationale: ‘Ru’ ní ìtumọ̀ gbígbé tàbí jíjẹ́ kí ohun kan wà lára ẹni; ó bá ìwọ̀ntúnwọ̀nsì àti ìtumọ̀ βαστάζω mu.
theological_decisions:
- issue: Irú àwọn στίγματα Paulu
  choice: A túmọ̀ ọ́ ní àìdásí gẹ́gẹ́ bí ‘àmì Jesu,’ láì sọ pàtó pé àpá inúnibíni, àmì ìní, tàbí àpẹẹrẹ ìjìyà ni.
  alternative: ‘Àpá nítorí Jesu’ tàbí ‘àmì ìní Jesu.’
  rationale: Ó ṣeé ṣe kí ọ̀rọ̀ náà tọ́ka sí àwọn àmì gidi lára Paulu nítorí ìjìyà, tí wọ́n tún ń fi hàn pé ó jẹ́ ti Jesu. Síbẹ̀, ẹsẹ náà kò fi ìtumọ̀ kan ṣoṣo múlẹ̀, nítorí náà a pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘yọ mí lẹ́nu’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún ìdíọ́mù Gíríìkì, a sì pa ‘àmì Jesu’ mọ́ láì tú ìtumọ̀ rẹ̀ sí ẹ̀kọ́ kan pàtó.
