  source_fidelity: Ìtumọ̀ náà mú àṣẹ ìṣe tí ń tẹ̀síwájú, ẹni tí ń gba ìkọ́ni, àti ẹni tí ń kọ́ni hàn dáadáa. Ṣùgbọ́n ìṣọ̀kan “máa bá ... pín nínú gbogbo ohun rere” lè túmọ̀ sí pípa ara ẹni pọ̀ nínú àwọn ohun rere, dípò pípin àwọn ohun rere fún/pẹ̀lú olùkọ́, èyí tí ìdàgbàsókè gírámà Gíríìkì ń tọ́ka sí.
  naturalness: “Máa pín gbogbo ohun rere pẹ̀lú ẹni tí ń kọ́ ọ” jẹ́ Yorùbá àgbéléwọ̀n tí ó túbọ̀ mọ́, ó sì sọ ìbáṣepọ̀ pípín náà di kedere. “Ọ̀rọ̀ náà” àti “ẹni tí a ń kọ́” jẹ́ ìlò tó dáa.
