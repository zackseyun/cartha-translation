  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Κοινωνείτω δὲ ὁ κατηχούμενος τὸν λόγον τῷ κατηχοῦντι ἐν πᾶσιν ἀγαθοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: yo
  text: Kí ẹni tí a ń kọ́ ní ọ̀rọ̀ náà máa pín gbogbo ohun rere pẹ̀lú ẹni tí ń kọ́ ọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “máa bá ẹni tí ń kọ́ ọ pín nínú gbogbo ohun rere”; ó ṣeé ṣe kí ìtumọ̀ náà ní ìrànlọ́wọ́ ohun ìní nínú.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κοινωνείτω
  choice: kí ... máa bá ... pín
  rationale: Ọ̀rọ̀ yìí jẹ́ àṣẹ tí ó ń tọ́ka sí ohun tí ó yẹ kí wọ́n máa ṣe déédéé. ‘Máa bá ... pín’ fi ìtumọ̀ ìkópa àti pípín ohun kan pẹ̀lú ẹlòmíràn hàn láì fi mọ́ owó nìkan.
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ asopọ̀ pàtó nínú ìtumọ̀
  rationale: δέ jẹ́ àmì ìyípadà kékeré nínú ọ̀rọ̀, kì í ṣe ìtakora líle. Ní Yorùbá, fífi sílẹ̀ mú kí gbólóhùn náà ṣàn lọ́nà àdánidá láì fi ‘ṣùgbọ́n’ tàbí ‘nísinsin yìí’ kún un.
- source_word: ὁ κατηχούμενος
  choice: ẹni tí a ń kọ́
  rationale: Ìṣe aláìparí tí ó wà ní ipò àfaragà tọ́ka sí ẹni tí ó ń gba ìkọ́ni. Èyí jẹ́ Yorùbá òde òní tí ó ṣe kedere, tí kò sì gbé ìtumọ̀ ìjọ tó wáyé lẹ́yìn náà wọ inú ẹsẹ náà.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: Nínú àyíká yìí, λόγος ni iṣẹ́ ìránṣẹ́ tàbí ẹ̀kọ́ ìhìn rere tí a ń kọ́ni. ‘Ọ̀rọ̀ náà’ pa ìfihàn Páùlù mọ́, ó sì yé àwọn òǹkàwé.
- source_word: τῷ κατηχοῦντι
  choice: ẹni tí ń kọ́ ọ
  rationale: Ìṣe aláìparí ní ipò olùṣe ń tọ́ka sí ẹni tí ń fún un ní ìkọ́ni; àṣàyàn yìí bá ‘ẹni tí a ń kọ́’ mu, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: nínú gbogbo ohun rere
  rationale: 'Àṣàyàn yìí dúró sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa ìbú ìtumọ̀ rẹ̀ mọ́: ó lè ní àwọn ohun ìní àti ìrànlọ́wọ́ gidi nínú, ṣùgbọ́n kò fi mọ́ owó nìkan.'
theological_decisions:
- issue: Irú ohun tí àṣẹ pípín náà túmọ̀ sí
  choice: Ẹni tí a ń kọ́ gbọ́dọ̀ máa bá olùkọ́ rẹ̀ pín nínú gbogbo ohun rere, èyí tí ó ṣeé ṣe kí ó ní ìrànlọ́wọ́ ohun ìní nínú.
  alternative: Ó ń sọ nípa ìdàpọ̀ tàbí ìbákẹ́gbẹ́ nípa ẹ̀mí nìkan, kì í ṣe ìrànlọ́wọ́ ohun ìní.
  rationale: Ìpapọ̀ κοινωνέω, ẹni tí a ń pín pẹ̀lú ní ọ̀nà dative, àti ‘nínú gbogbo ohun rere’ ń tọ́ka gidigidi sí pípín ohun lójú ayé tàbí ìrànlọ́wọ́ gidi. Síbẹ̀, ọ̀rọ̀ náà gbòòrò ju owó nìkan lọ, nítorí náà ìtumọ̀ náà kò dín in kù.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti èyí tí ó yé àwọn òǹkàwé òde òní ni a lò. ‘Máa’ fi hàn pé àṣẹ náà jẹ́ ìṣe tí ó yẹ kí ó máa bá a lọ; a kò lo ọ̀rọ̀ ìmọ̀-ẹ̀sìn àkànṣe.
