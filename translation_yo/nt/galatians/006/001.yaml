id: GAL.6.1
reference: Galatians 6:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: yo
  text: Ẹ̀yin ará[a], bí a tilẹ̀ bá mú ẹnì kan nínú ìrékọjá kan[b], ẹ̀yin tí ẹ jẹ́ àwọn ènìyàn tẹ̀mí, ẹ mú irú ẹni bẹ́ẹ̀ padà bọ̀ sípò pẹ̀lú ẹ̀mí ìwà tútù[c], níwọ̀n bí ìwọ náà ti ń ṣọ́ ara rẹ, kí ìwọ náà má baà bọ́ sínú ìdẹwò[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ará” níbí túmọ̀ ọ̀rọ̀ àdéhùn ọ̀pọ̀ Gíríìkì tí ìrísí rẹ̀ jẹ́ ti akọ, ṣùgbọ́n tí ó lè bá gbogbo àwọn onígbàgbọ́ ẹlẹgbẹ́ sọ̀rọ̀, yálà ọkùnrin tàbí obìnrin.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “bí ìrékọjá kan bá ṣàdéédé dé bá ẹnì kan” tàbí “bí ìrékọjá kan bá borí ẹnì kan.”
    reason: alternative_reading
  - marker: c
    text: “Ẹ̀mí ìwà tútù” lè tọ́ka sí ìhùwàsí onírẹ̀lẹ̀ ẹni náà, ó sì tún lè ní ìró ìwà tútù tí Ẹ̀mí Ọlọ́run ń mú jáde.
    reason: theological_ambiguity
  - marker: d
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “kí a dán ìwọ náà wò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ẹ̀yin ará
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdéhùn fún àwọn onígbàgbọ́ ẹlẹgbẹ́; “ará” jẹ́ àdéhùn Yorùbá tó bójú mu, ó sì lè tọ́ka sí àwùjọ ọkùnrin àti obìnrin láìsọ ìtumọ̀ rẹ̀ di èyí tí kò ṣe kedere.
- source_word: ἐὰν καὶ
  choice: bí ... tilẹ̀ bá
  rationale: Ìṣètò yìí fi ipò àdéhùn tó ní agbára ìyọ̀ǹda hàn, ó sì bá “even if” mu lọ́nà àdánidá ní Yorùbá.
- source_word: προλημφθῇ
  choice: bá mú
  rationale: Ó lè túmọ̀ sí mímú ẹnì kan nínú ìṣe tàbí pé ẹ̀ṣẹ̀ ṣàdéédé dé bá a. Àyọkà pàtàkì lo gbolohun tó rọrùn, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ kejì mọ́.
- source_word: ἄνθρωπος
  choice: ẹnì kan
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀rọ̀ ẹyọ tó ń tọ́ka sí ènìyàn lápapọ̀; “ẹnì kan” pa ẹyọ náà mọ́, ó sì jẹ́ Yorùbá àdánidá láìfi akọ tàbí abo tí àyíká kò fi dandan kún un.
- source_word: ἔν τινι παραπτώματι
  choice: nínú ìrékọjá kan
  rationale: “Ìrékọjá” fi àwòrán ìgbésẹ̀ tí ó kọjá ààlà àti ìwúlò ìwà búburú παράπτωμα hàn; “kan” ṣe aṣojú τινι.
- source_word: οἱ πνευματικοὶ
  choice: ẹ̀yin tí ẹ jẹ́ ẹni tẹ̀mí
  rationale: Ìtumọ̀ yìí pa àpèjúwe gbooro náà mọ́ láìfi dandan sọ pé ó túmọ̀ sí ìdàgbàsókè tẹ̀mí nìkan tàbí ìdarí Ẹ̀mí nìkan.
- source_word: καταρτίζετε
  choice: ẹ mú ... padà bọ̀ sípò
  rationale: Ọ̀rọ̀ náà ń sọ nípa títún ohun tí ó yapa ṣe kí ó padà sí ipò tó yẹ; ìtumọ̀ Yorùbá yìí jẹ́ àdánidá, ó sì mú àṣẹ ọ̀rọ̀-ìṣe náà hàn.
- source_word: τὸν τοιοῦτον
  choice: irú ẹni bẹ́ẹ̀
  rationale: Ó tọ́ka padà sí ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì pa ìtọ́kasí ẹyọ náà mọ́.
- source_word: ἐν πνεύματι πραΰτητος
  choice: pẹ̀lú ẹ̀mí ìwà tútù
  rationale: Ó pa “ẹ̀mí” àti “ìwà tútù” méjèèjì mọ́, láìpinnu patapata bóyá ìtẹnumọ́ wà lórí ìwà inú ènìyàn tàbí ìwà tí Ẹ̀mí Ọlọ́run ń mú jáde.
- source_word: σκοπῶν σεαυτόν
  choice: ìwọ náà, máa ṣọ́ ara rẹ
  rationale: Ìtumọ̀ náà pa ìyípadà láti ọ̀pọ̀ sí ẹyọ nínú Gíríìkì mọ́, ó sì sọ ìṣọ́ra ara ẹni ní Yorùbá tó ṣe kedere.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: kí ìwọ náà má baà bọ́ sínú ìdẹwò
  rationale: Gbolohun yìí fi ìkìlọ̀ pé ẹni tó ń tún ẹlòmíràn ṣe náà lè dojú kọ ìdẹwò hàn. “Náà” ṣe aṣojú καὶ, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ “dán wò” mọ́.
theological_decisions:
- issue: Àwọn tí οἱ πνευματικοὶ ń tọ́ka sí
  choice: ẹ̀yin tí ẹ jẹ́ ẹni tẹ̀mí
  alternative: ẹ̀yin tí Ẹ̀mí ń darí; ẹ̀yin tí ẹ dàgbà nípa tẹ̀mí
  rationale: Àpèjúwe Gíríìkì lè ní ìbáṣepọ̀ pẹ̀lú ìgbé ayé nípasẹ̀ Ẹ̀mí àti ìdàgbàsókè tẹ̀mí. A kò yan ọ̀kan ṣoṣo nínú wọn gẹ́gẹ́ bí ìtumọ̀ dandan.
- issue: Ìtumọ̀ πνεύματι nínú ἐν πνεύματι πραΰτητος
  choice: ẹ̀mí ìwà tútù
  alternative: pẹ̀lú ìwà tútù; nínú Ẹ̀mí tí ń mú ìwà tútù wá
  rationale: Gíríìkì lè tọ́ka sí ìhùwàsí inú ẹni, ṣùgbọ́n ó tún lè dún bí ìwà tí Ẹ̀mí ń mú jáde nínú àyíká lẹ́tà náà. A pa ìfọ̀rọ̀wérọ̀ yìí mọ́.
- issue: Ìdẹwò tàbí ìdánwò nínú πειρασθῇς
  choice: bọ́ sínú ìdẹwò
  alternative: kí a dán ìwọ náà wò
  rationale: Àyíká ìrékọjá mú kí “ìdẹwò” ṣeé ṣe jù, ṣùgbọ́n ọ̀rọ̀ náà tún lè túmọ̀ sí “dán wò”; àlàyé ìsàlẹ̀ ṣàfihàn ìtumọ̀ yẹn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Ẹ̀yin ará” jẹ́ àdéhùn ìjọ tó wọ́pọ̀, “padà bọ̀ sípò” sì sọ ète ìmúpadàbọ̀sípò kedere láìlo ọ̀rọ̀ ẹ̀kọ́ ìsìn tó le. Ìyípadà láti “ẹ̀yin” sí “ìwọ” pa ìyípadà ọ̀pọ̀-sí-ẹyọ inú orísun mọ́.
