  source_fidelity: Ìtumọ̀ náà gba ìṣọ̀kan ìjìnlẹ̀ γάρ–οὐδέ, ìtẹnumọ́ αὐτοὶ, ìyàtọ̀ ἀλλά, àti ète ἵνα dáadáa. Ṣùgbọ́n “nítorí ohun tí a ṣe sí ara yín” ṣàfikún “ohun tí a ṣe” tí kò wà nínú ọ̀rọ̀ Gíríìkì, ó sì yí ἐν τῇ ὑμετέρᾳ σαρκὶ ('nínú ara yín') padà sí ìdí. “Máa fọ́nnu” tún lè fi ìṣe àṣesìnlẹ̀ kún un.
  naturalness: “Àwọn tí a kọ nílà” àti “pa òfin mọ́” jẹ́ Yorùbá boṣewa tí ó ṣe kedere. “Àwọn náà fúnra wọn” mú ìtẹnumọ́ náà hàn ní kúnrẹ́rẹ́ ju ipò “pàápàá” nìkan lọ. “Fọ́nnu nínú ara yín” jẹ́ ọ̀nà tó sún mọ́ ọ̀rọ̀ orísun, bí ó tilẹ̀ jẹ́ pé àyíká ìkọlà ti jẹ́ kí ìtọ́kasí sí ara gidi hàn.
  terminology: A yẹ kí a pa “kọ nílà” mọ́ fún περιτέμνω, “òfin” fún νόμος, àti “ara” fún σάρξ níhìn-ín. “Ara” nínú ẹsẹ̀ yìí tọ́ka sí ara ti ara, kì í ṣe ìwà ẹlẹ́ṣẹ̀.
