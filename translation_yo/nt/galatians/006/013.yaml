  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: yo
  text: Nítorí pé àwọn tí a kọ nílà náà fúnra wọn kò pa òfin mọ́,[a] ṣùgbọ́n wọ́n fẹ́ kí a kọ yín nílà, kí wọ́n lè fọ́nnu nínú ara yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “àwọn akọlà.” Ọ̀rọ̀ Gíríìkì lò participle gẹ́gẹ́ bí ọ̀rọ̀-orúkọ: “àwọn tí a ń kọ nílà” tàbí “àwọn tí a kọ nílà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Nítorí pé ... pàápàá kò
  rationale: Ó pa agbára ìṣàlàyé γάρ mọ́, ó sì fi ìtẹnumọ́ οὐδέ hàn lọ́nà Yorùbá àdánidá.
- source_word: οἱ περιτεμνόμενοι
  choice: àwọn tí a kọ nílà
  rationale: Ó tẹ̀ lé participle tí a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ, láì túmọ̀ ẹgbẹ́ náà sí ‘àwọn tó ń polongo ìkọlà’ ju ohun tí Gíríìkì sọ lọ.
- source_word: αὐτοὶ
  choice: pàápàá
  rationale: Ó fi ìtẹnumọ́ hàn pé àwọn náà fúnra wọn kò pa òfin mọ́.
- source_word: νόμον φυλάσσουσιν
  choice: pa òfin mọ́
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe déédéé fún pípa òfin mọ́ tàbí ṣíṣe ohun tí òfin béèrè.
- source_word: ἀλλὰ θέλουσιν
  choice: ṣùgbọ́n wọ́n fẹ́
  rationale: Ó ṣe àfihàn ìyàtọ̀ àti ìfẹ́ inú wọn ní kedere.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: kí a kọ yín nílà
  rationale: Àkójọpọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ pé ẹlòmíràn ni yóò ṣe ìkọlà náà mọ́.
- source_word: ἵνα
  choice: kí wọ́n lè
  rationale: Ó sọ ète iṣẹ́ náà ní kedere.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: nítorí ohun tí a ṣe sí ara yín
  rationale: Nínú àyíká ìkọlà, σάρξ tọ́ka sí ara gidi àti àmì tí a ṣe sí i. Àtúmọ̀ yìí jẹ́ kedere ní Yorùbá láì mú ìtumọ̀ ‘ìwà ẹlẹ́ṣẹ̀’ wọlé.
- source_word: καυχήσωνται
  choice: máa fọ́nnu
  rationale: Ó mú agbára ọ̀rọ̀ Pọ́ọ̀lù pé wọ́n ń gbéraga tàbí ń fọ́nnu lórí ohun tí wọ́n ṣe hàn.
theological_decisions:
- issue: Ìtumọ̀ σάρξ níhìn-ín
  choice: ara gidi tí a ṣe àmì ìkọlà sí
  alternative: ẹ̀dá ẹlẹ́ṣẹ̀ tàbí ìwà ẹran ara
  rationale: Àyíká ẹsẹ̀ náà jẹ́ ti ìkọlà; nítorí náà, ara ènìyàn gidi ni Pọ́ọ̀lù ń tọ́ka sí, kì í ṣe ìwà ẹlẹ́ṣẹ̀.
- issue: Agbára participle περιτεμνόμενοι
  choice: àwọn tí a kọ nílà
  alternative: àwọn tó ń gbé ìkọlà lárugẹ
  rationale: Ọ̀rọ̀ Gíríìkì ṣe àpèjúwe wọn nípa ìkọlà; bó tilẹ̀ jẹ́ pé àyíká fi hàn pé wọ́n ń fẹ́ kí àwọn mìíràn kọ nílà, kò yẹ kí àtúmọ̀ fi ìtumọ̀ àfikún yẹn rọ́pò ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; èdè náà jẹ́ ọlọ́lá, ó ṣe kedere fún òǹkàwé òde òní. A lo ‘kọ nílà’ gẹ́gẹ́ bí ọ̀rọ̀ Yorùbá àdánidá fún ìkọlà, a sì tú ‘flesh’ ní ìbámu pẹ̀lú ara gidi nínú àyíká yìí.
