id: GAL.6.12
reference: Galatians 6:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: yo
  text: Gbogbo àwọn tí ó fẹ́ fi ara wọn hàn dáadáa ní ti ẹran ara[a], àwọn wọ̀nyí gan-an ni ń fi ipá mú yín láti gba ìkọlà, kìkì kí a má bàa ṣe inúnibíni sí wọn nítorí àgbélébùú[c] Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti hàn dáadáa ní ti òde.”
    reason: lexical_alternative
  - marker: b
    text: 'Ìtumọ̀ ìbílẹ̀: “Kristi.”'
    reason: alternative_reading
  - marker: c
    text: Tàbí, “kí a má bàa ṣe inúnibíni sí wọn ní ti àgbélébùú Mèsáyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: Gbogbo àwọn tí ó
  rationale: Ó fi gbogbo ẹgbẹ́ àwọn ènìyàn tí Pọ́ọ̀lù ń sọ̀rọ̀ nípa wọn hàn, ó sì bá agbára ọ̀rọ̀ Gíríìkì mu.
- source_word: θέλουσιν
  choice: fẹ́
  rationale: Ọ̀rọ̀ yìí sọ ìfẹ́ tàbí ète wọn ní èdè Yorùbá òde òní tí ó ṣe kedere.
- source_word: εὐπροσωπῆσαι
  choice: ṣe àṣehàn rere
  rationale: Ó túmọ̀ sí fífi ara ẹni hàn lọ́nà tí yóò dára lójú àwọn ẹlòmíràn; yíyan yìí tún pa ìbáwí Pọ́ọ̀lù sí ìṣehàn òde mọ́.
- source_word: ἐν σαρκί
  choice: nínú ẹran ara
  rationale: Ó pa àwòrán àti ìwọ̀n ìtumọ̀ σάρξ mọ́, láì dín in kù sí ‘ní ti òde’ nìkan; àlàyé ìsàlẹ̀ fún ni ní ìtumọ̀ àyíká ọ̀rọ̀.
- source_word: οὗτοι
  choice: àwọn wọ̀nyí gan-an
  rationale: '‘Gan-an’ mú ìtẹnumọ́ ọ̀rọ̀ arọ́pò-atọ́ka Gíríìkì jáde: àwọn ènìyàn wọ̀nyí pàápàá ni wọ́n ń ṣe bẹ́ẹ̀.'
- source_word: ἀναγκάζουσιν
  choice: ń fi ipá mú
  rationale: Ó sọ ìfipámúni tí ń lọ lọ́wọ́ ní kedere, ó sì pa ìṣe àsìkò ìsinsìnyí mọ́.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: mú yín pé kí a kọ yín ní ilà
  rationale: 'Ìkọ̀lé yìí pa ohùn àìṣe Gíríìkì mọ́: àwọn ará Gálátíà ni a fẹ́ kọ ní ilà, kì í ṣe pé àwọn fúnra wọn ni yóò kọ ẹlòmíràn ní ilà.'
- source_word: μόνον ἵνα
  choice: kìkì kí
  rationale: Ó fi hàn pé Pọ́ọ̀lù ń tọ́ka sí ìdí kan ṣoṣo tí ó sọ pé ó ń sún wọn ṣe bẹ́ẹ̀.
- source_word: τῷ σταυρῷ
  choice: nítorí àgbélébùú
  rationale: Dátífù náà lè fi ohun tó fa inúnibíni hàn; ‘nítorí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ ‘ní ti’ mọ́.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Nínú gbólóhùn yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a yàn; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde.
- source_word: μὴ διώκωνται
  choice: kí a má bàa ṣe inúnibíni sí wọn
  rationale: Ó pa ohùn àìṣe àti ète láti yẹra fún inúnibíni mọ́ ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú τῷ σταυρῷ τοῦ Χριστοῦ
  choice: àgbélébùú Mèsáyà
  alternative: àgbélébùú Kristi
  rationale: ‘Mèsáyà’ mú ipa Χριστός gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn hàn; àlàyé ìsàlẹ̀ pa ìtumọ̀ ìbílẹ̀ ‘Kristi’ mọ́.
- issue: Ìtumọ̀ ἐν σαρκί
  choice: nínú ẹran ara
  alternative: ní ti òde / nípa ìṣehàn òde
  rationale: Yíyan yìí pa ọ̀rọ̀ ẹ̀kọ́ Pọ́ọ̀lù àti àìdánilójú rẹ̀ mọ́, láì sọ ọ́ di ‘ìwà ẹlẹ́ṣẹ̀’ tàbí ìṣehàn òde nìkan.
- issue: Ìbáṣepọ̀ dátífù τῷ σταυρῷ pẹ̀lú διώκωνται
  choice: nítorí àgbélébùú
  alternative: ní ti àgbélébùú
  rationale: ‘Nítorí’ ka dátífù náà gẹ́gẹ́ bí ohun tó fa inúnibíni, ṣùgbọ́n ọ̀rọ̀ Gíríìkì tún lè tọ́ka sí inúnibíni ní ìbáṣepọ̀ pẹ̀lú àgbélébùú; a fi èyí sí àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àkọ́sọ tó níyì, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Ẹran ara’ àti ‘àgbélébùú’ pa àwọn àwòrán pàtàkì Pọ́ọ̀lù mọ́; ‘àwọn wọ̀nyí gan-an’ mú ìtẹnumọ́ rẹ̀ jáde. Gbogbo àmì àlàyé [a], [b], àti [c] wà nínú ọ̀rọ̀ pàtàkì.
