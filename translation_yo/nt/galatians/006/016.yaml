id: GAL.6.16
reference: Galatians 6:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: yo
  text: Àti gbogbo àwọn tí yóò máa rìn ní ìbámu pẹ̀lú ìlànà yìí[a]—kí àlàáfíà àti àánú wà lórí wọn, àti[c] lórí Ísírẹ́lì Ọlọ́run[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn tí yóò tẹ̀ lé òṣùwọ̀n yìí.” Ọ̀rọ̀-ìṣe náà ní èrò rírìn ní ìlà tàbí mímú ìṣísẹ̀ bá ìlànà kan mu.
    reason: lexical_alternative
  - marker: b
    text: 'Àwọn onímọ̀ ní èrò oríṣiríṣi nípa “Ísírẹ́lì Ọlọ́run”: ó lè túmọ̀ sí àwọn Júù onígbàgbọ́, gbogbo ìjọ, tàbí àwọn ènìyàn Ọlọ́run ní ìtumọ̀ tó gbòòrò. Ìtumọ̀ yìí pa ọ̀rọ̀ Gíríìkì mọ́ láì yanjú àríyànjiyàn náà.'
    reason: alternative_reading
  - marker: c
    text: A lè ka “àti” tó gbẹ̀yìn gẹ́gẹ́ bí àfikún ẹgbẹ́ mìíràn (“àti lórí Ísírẹ́lì Ọlọ́run”) tàbí gẹ́gẹ́ bí àtúnsọ ẹgbẹ́ kan náà (“àní lórí Ísírẹ́lì Ọlọ́run”).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: gbogbo àwọn tí
  rationale: Ó fi ìtumọ̀ àpapọ̀ tí ó tún kan ẹnì kọ̀ọ̀kan hàn lọ́nà àdánidá nínú Yorùbá.
- source_word: κανόνι
  choice: ìlànà
  rationale: Níhìn-ín, κανών túmọ̀ sí òṣùwọ̀n tàbí ìlànà tí a fi ń darí ìwà; “ìlànà” ṣe kedere, ó sì yẹ fún èdè Yorùbá òde òní.
- source_word: στοιχήσουσιν
  choice: yóò máa rìn ní ìbámu pẹ̀lú
  rationale: Ó pa àwòrán rírìn ní ìlà mọ́, ó sì fi ìṣe tí ń bá a lọ ní ìbámu pẹ̀lú ìlànà kan hàn.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún εἰρήνη, ó sì bá ọ̀rọ̀ ìbùkún mu.
- source_word: ἔλεος
  choice: àánú
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá tó ṣe déédéé fún ἔλεος, pàápàá nínú ọ̀rọ̀ ìbùkún.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: lórí wọn ... àti lórí
  rationale: Ó pa àtúnlò ἐπί mọ́, ó sì bá ìfẹ́ inú ọ̀rọ̀ ìbùkún mu.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: Ísírẹ́lì Ọlọ́run
  rationale: Ó tẹ̀ lé ìṣọ̀kan ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, láì pinnu ẹni pàtó tí gbólóhùn náà ń tọ́ka sí.
theological_decisions:
- issue: Ẹni tàbí ẹgbẹ́ tí “Ísírẹ́lì Ọlọ́run” ń tọ́ka sí
  choice: A túmọ̀ ọ́ ní tààrà sí “Ísírẹ́lì Ọlọ́run,” láì ṣàlàyé rẹ̀ sí ẹgbẹ́ kan pàtó.
  alternative: Àwọn Júù onígbàgbọ́; gbogbo ìjọ; tàbí gbogbo ènìyàn Ọlọ́run, Júù àti Kèfèrí.
  rationale: Ọ̀rọ̀ Gíríìkì kò fi dandan yan ìtumọ̀ kan ṣoṣo; títúmọ̀ rẹ̀ ní tààrà pa àìdánilójú àti ìforígbárí ìtumọ̀ náà mọ́.
- issue: Ìtumọ̀ καί tó gbẹ̀yìn ṣáájú “Ísírẹ́lì Ọlọ́run”
  choice: A túmọ̀ ọ́ sí “àti,” kí ó lè jẹ́ àfikún ẹgbẹ́ mìíràn tàbí àtúnsọ ẹgbẹ́ kan náà.
  alternative: “àní,” bí àlàyé tàbí àtúnsọ ẹgbẹ́ kan náà; tàbí “àti,” bí àfikún ẹgbẹ́ kejì.
  rationale: Àyíká ọ̀rọ̀ gba ìtumọ̀ méjèèjì láàyè; “àti” kò fi tipátipá yanjú ìbéèrè ẹ̀kọ́ ìgbàgbọ́ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Máa rìn ní ìbámu pẹ̀lú” pa àwòrán Pọ́ọ̀lù mọ́, nígbà tí “kí ... wà lórí wọn” ń gbé ìró ọ̀rọ̀ ìbùkún jáde.
