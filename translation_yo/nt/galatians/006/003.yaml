id: GAL.6.3
reference: Galatians 6:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: yo
  text: Nítorí bí ẹnikẹ́ni bá rò pé òun jẹ́ ẹni pàtàkì nígbà tí kò jẹ́ nǹkan kan, ó ń tan ara rẹ̀ jẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń ṣì ara rẹ̀ lọ́nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Nítorí bí
  rationale: Ó pa agbára ìṣàlàyé γάρ àti ìtumọ̀ onípò εἰ mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti so ẹsẹ yìí mọ́ ìkìlọ̀ tó ṣáájú.
- source_word: δοκεῖ
  choice: bá rò
  rationale: Níbí, ọ̀rọ̀ náà ń tọ́ka sí bí ẹni kan ṣe ń gbé ara rẹ̀ yẹ̀ wò, kì í ṣe bí ó ṣe farahàn sí àwọn ẹlòmíràn.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ó fi ìtumọ̀ gbogbogbò ti ọ̀rọ̀ arọ́pò-orúkọ aláìní pàtó hàn ní Yorùbá àdánidá.
- source_word: εἶναί τι
  choice: òun jẹ́ ẹni pàtàkì
  rationale: Àṣà-ọrọ Gíríìkì túmọ̀ sí kí ẹni ka ara rẹ̀ sí ẹni tó ní ìtumọ̀ tàbí ipò; ‘ẹni pàtàkì’ sọ èyí di mímọ́ fún òǹkà Yorùbá láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: μηδὲν ὤν
  choice: nígbà tí kò jẹ́ nǹkan kan
  rationale: Ó pa ìbátan participle náà àti ìyàtọ̀ tó wà láàárín ‘ẹni pàtàkì’ àti ‘nǹkan kan’ mọ́, láìfi agbára ìyọ̀ǹda ‘bí ó tilẹ̀ jẹ́ pé’ lé e lórí.
- source_word: φρεναπατᾷ
  choice: ó ń tan … jẹ́
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí pípa ọkàn ẹni jẹ tàbí ṣíṣi ara ẹni lọ́nà; ‘tan … jẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀.
- source_word: ἑαυτόν
  choice: ara rẹ̀
  rationale: Ó jẹ́ arọ́pò-orúkọ àpadà tó tọ́ka sí ẹni kan náà; Yorùbá kò nílò ìyàtọ̀ akọ tàbí abo níbí.
theological_decisions:
- issue: Ìtọ́kasí akọ ní ọ̀nà gbogbogbò
  choice: ẹnikẹ́ni … òun … ara rẹ̀
  alternative: ọkùnrin kan … ara rẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ẹyọ akọ ní gírámà, ìtọ́kasí rẹ̀ jẹ́ gbogbogbò. Yorùbá fi ‘ẹnikẹ́ni’ àti àwọn arọ́pò-orúkọ aláìṣàmì akọ tàbí abo sọ ìtumọ̀ yẹn ní pípé láìsọ ó di ọ̀pọ̀.
- issue: Ìtumọ̀ εἶναί τι
  choice: jẹ́ ẹni pàtàkì
  alternative: jẹ́ nǹkan kan
  rationale: ‘Ẹni pàtàkì’ mú ìtumọ̀ ìgbéraga àti ìṣírò ara ẹni tó wà nínú ọ̀rọ̀ Gíríìkì jáde ní Yorùbá àdánidá, nígbà tí apá kejì ṣi pa àwòrán ‘kò jẹ́ nǹkan kan’ mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ jẹ́ ti ode òní, tó ní iyì, tó sì ṣeé lóye fún òǹkà gbogbogbò. ‘Òun’ ń tẹnu mọ́ pé ìṣírò ara ẹni ni ọ̀rọ̀ náà ń sọ.
