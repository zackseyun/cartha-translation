  text: Ἴδετε πηλίκοις ὑμῖν γράμμασιν ἔγραψα τῇ ἐμῇ χειρί.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/011.yaml
  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: yo
  text: Ẹ wo bí àwọn lẹ́tà tí mo fi ọwọ́ ara mi kọ sí yín ṣe tóbi tó![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ wo bí lẹ́tà tí mo fi ọwọ́ ara mi kọ sí yín ṣe gùn tó!”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδετε
  choice: Ẹ wo
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni, ó sì ń pe àfiyèsí àwọn olùgbọ́ ní tààrà; “Ẹ wo” jẹ́ èdè Yorùbá àdánidá tí ó pa ìtẹnumọ́ náà mọ́.
- source_word: πηλίκοις
  choice: bí ... ńlá ... ṣe rí
  rationale: Ó ń tọ́ka sí bí ìwọ̀n àwọn àmì ìkọ̀wé náà ti tóbi; àkójọpọ̀ “bí ... ṣe rí” mú ìtumọ̀ “how large” jáde ní Yorùbá àdánidá.
- source_word: γράμμασιν
  choice: àwọn lẹ́tà
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe jù pé ó túmọ̀ sí àwọn lẹ́tà tàbí àmì ìkọ̀wé, kì í ṣe gbogbo lẹ́tà ìránṣẹ́ náà.
- source_word: ὑμῖν
  choice: sí yín
  rationale: Dátífù náà jẹ́ ẹni tí a kọ̀wé sí; “sí yín” ni ìtumọ̀ tààrà àti àdánidá.
- source_word: ἔγραψα
  choice: tí mo ... kọ
  rationale: Fọ́ọ̀mù àsìkò àtijọ́ náà ń tọ́ka sí ohun tí Pọ́ọ̀lù ti kọ, ṣùgbọ́n gbólóhùn abẹ́ “tí mo ... kọ” bá ìṣètò Yorùbá mu dáadáa láìfi ìtumọ̀ àsìkò míì kún un.
- source_word: τῇ ἐμῇ χειρί
  choice: fi ọwọ́ ara mi
  rationale: Ó jẹ́ irinṣẹ́ tí a fi kọ̀wé, “ara mi” sì mú ìtẹnumọ́ ἐμῇ jáde pé òun fúnra rẹ̀ ni ó kọ ọ́.
theological_decisions:
- issue: Ìtumọ̀ πηλίκοις γράμμασιν
  choice: ìwọ̀n títóbi àwọn lẹ́tà ìkọ̀wé
  alternative: bí lẹ́tà ìránṣẹ́ tí mo kọ sí yín ti gùn tó
  rationale: γράμματα àti mẹ́nu kíkàn ọwọ́ ara Pọ́ọ̀lù ṣe àtìlẹ́yìn fún ìtumọ̀ pé ó ń sọ nípa bí ìkọ̀wé rẹ̀ ti tóbi. Síbẹ̀, πηλίκοις lè tọ́ka sí ìwọ̀n tàbí bí ohun kan ti pọ̀ tó, nítorí náà a pa ìtumọ̀ pé gbogbo lẹ́tà ìránṣẹ́ náà gùn mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè àdánidá mu. A lo “lẹ́tà” fún àmì alfábẹ́ẹ̀tì ní ọ̀rọ̀ àkọ́kọ́, bí ó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí lẹ́tà ìránṣẹ́; àlàyé ìsàlẹ̀ ló ṣàlàyé ìtumọ̀ kejì.
