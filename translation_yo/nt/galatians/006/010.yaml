id: GAL.6.10
reference: Galatians 6:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: yo
  text: Nítorí náà, bí a ti ní àǹfààní[a], ẹ jẹ́ kí a máa ṣe ohun rere fún gbogbo ènìyàn, pàápàá jù lọ fún àwọn ará ilé ìgbàgbọ́[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níwọ̀n ìgbà tí a ní àkókò.” Ọ̀rọ̀ Gíríìkì καιρός tẹnumọ́ àkókò tí ó yẹ tàbí àǹfààní tó bá iṣẹ́ mu, kì í ṣe àkókò lásán.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdílé ìgbàgbọ́” tàbí “àwọn ọmọ ìdílé ìgbàgbọ́.” Ọ̀rọ̀ Gíríìkì náà lo àwòrán ilé tàbí ìdílé fún àwọn tí wọ́n jẹ́ ti àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: c
    text: “Ìgbàgbọ́” tún lè túmọ̀ sí “ìgbàgbọ́ náà,” ìyẹn ìjẹ́wọ́ ìgbàgbọ́ Kristẹni tí àwùjọ náà jọ pín.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Nítorí náà
  rationale: Àwọn ọ̀rọ̀ méjèèjì fi ìparí èrò tí ó tẹ̀ lé àlàyé ṣáájú hàn. “Nítorí náà” jẹ́ ọ̀nà Yorùbá àdánidá láti pa agbára ìtumọ̀ yìí mọ́.
- source_word: ὡς καιρὸν ἔχομεν
  choice: bí a ti ní àǹfààní
  rationale: καιρός ń tọ́ka sí àkókò tàbí àǹfààní tí ó bá iṣẹ́ náà mu, kì í ṣe àkókò lásán. Ọ̀rọ̀ yìí mú ìtumọ̀ àǹfààní láti ṣe rere jáde ní Yorùbá òde òní.
- source_word: ἐργαζώμεθα
  choice: ẹ jẹ́ kí a máa ṣe
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ ìṣírí sí gbogbo àwùjọ láti máa bá iṣẹ́ náà lọ. “Ẹ jẹ́ kí a máa ṣe” sọ ìṣírí apapọ̀ yìí ní èdè Yorùbá àdánidá.
- source_word: τὸ ἀγαθὸν
  choice: ohun rere
  rationale: Ajẹtífù aláìlẹ́ni náà dúró gẹ́gẹ́ bí orúkọ, ó sì túmọ̀ sí ohun tí ó dára ní ti ìwà. “Ohun rere” ṣe èyí ní kedere.
- source_word: πρὸς πάντας
  choice: fún gbogbo ènìyàn
  rationale: πρός tọ́ka sí àwọn ẹni tí iṣẹ́ rere náà ń lọ sí. “Fún gbogbo ènìyàn” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere pé kò sí ẹni tí a yọ sílẹ̀.
- source_word: μάλιστα δὲ
  choice: pàápàá jù lọ
  rationale: Ọ̀rọ̀ náà fi àkọ́kọ́ pàtàkì kan kún àṣẹ tó kan gbogbo ènìyàn; kò sọ pé kí a ṣe rere fún ẹgbẹ́ yìí nìkan.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: àwọn ará ilé ìgbàgbọ́
  rationale: οἰκεῖοι jẹ́ àwọn tí ó jẹ́ ọmọ ilé tàbí ará ilé kan. Ìtumọ̀ yìí pa àwòrán ìdílé mọ́ láì sọ ọ́ di ọ̀rọ̀ ẹgbẹ́ ìjọ tàbí ètò kan pàtó.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Ìtumọ̀ àkọ́kọ́ πίστις níbí ni “ìgbàgbọ́.” Ó lè tọ́ka sí ohun tí àwọn onígbàgbọ́ ní papọ̀ tàbí sí ẹ̀sìn tí wọ́n jẹ́wọ́; ọ̀rọ̀ àkọ́kọ́ kò fipá mú ká yan ọ̀kan ṣoṣo.
theological_decisions:
- issue: Ìwọ̀n àwọn tí a gbọ́dọ̀ ṣe rere sí àti ipò pàtàkì àwọn onígbàgbọ́
  choice: A gbọ́dọ̀ ṣe rere fún gbogbo ènìyàn, ṣùgbọ́n kí a fi àfiyèsí pàtàkì sí àwọn ará ilé ìgbàgbọ́.
  alternative: Kí a ṣe rere fún àwọn onígbàgbọ́ nìkan, tàbí kí a má ṣe fi ipò pàtàkì kankan fún wọn.
  rationale: πρὸς πάντας sọ pé àṣẹ náà kan gbogbo ènìyàn, nígbà tí μάλιστα fi ipò àkọ́kọ́ pàtàkì fún ará ilé ìgbàgbọ́. A pa àwọn méjèèjì mọ́ láì jẹ́ kí ọ̀kan pa èkejì rẹ́.
- issue: Ìtumọ̀ τῆς πίστεως nínú àpólà ará ilé ìgbàgbọ́
  choice: A lo “ìgbàgbọ́” gẹ́gẹ́ bí ohun tí ó dá àwọn ará ilé náà mọ̀.
  alternative: “Ẹ̀sìn ìgbàgbọ́” ní ìtumọ̀ ìjẹ́wọ́ ẹ̀kọ́ tí gbogbo wọn gbà, tàbí “ìṣòtítọ́” gẹ́gẹ́ bí ànímọ́.
  rationale: Orísun náà lè jẹ́ kí “ìgbàgbọ́” tọ́ka sí ìgbàgbọ́ tí wọ́n ní tàbí sí ìgbàgbọ́ Kristẹni tí wọ́n jọ jẹ́wọ́. Yíyan “ìgbàgbọ́” pa ààyè ìtumọ̀ yìí mọ́ láì dín un sí ẹ̀kọ́ è̩sìn kan pàtó.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. “Àwọn ará ilé” pa àwòrán ìdílé Gíríìkì mọ́, “máa ṣe” sì fi ìṣe tí ń bá a lọ hàn.
