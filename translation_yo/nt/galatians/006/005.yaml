  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: yo
  text: Nítorí olúkúlùkù yóò ru ẹrù tirẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí, “olúkúlùkù yóò gbé ẹrù tirẹ̀.” Ọ̀rọ̀ Gíríìkì φορτίον (“ẹrù tí a ń ru”) ni a lò níbí; ó yàtọ̀ sí βάρη (“àwọn ẹrù”) ní ẹsẹ 2.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹnì kọ̀ọ̀kan lọ́tọ̀ọ̀tọ̀, ó sì pa agbára ẹyọ ọ̀rọ̀ Gíríìkì mọ́ láìfi akọ tàbí abo kún un.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ohun tí ó ṣáájú; “Nítorí” jẹ́ àsopọ̀ Yorùbá tí ó ṣe déédéé fún ìbáṣepọ̀ ọgbọ́n yìí.
- source_word: τὸ ἴδιον
  choice: tirẹ̀ fúnra rẹ̀
  rationale: Àkójọpọ̀ yìí tẹnumọ́ pé ẹrù náà jẹ́ ti ẹni náà pàápàá, gẹ́gẹ́ bí ἴδιον ṣe ń fi ohun tí ó jẹ́ ti onítọ̀hún hàn.
- source_word: φορτίον
  choice: ẹrù
  rationale: “Ẹrù” jẹ́ ọ̀rọ̀ àdánidá fún ohun tí a gbé tàbí ru. Ó dá ìtumọ̀ φορτίον dúró láìsọ ọ́ di “ojúṣe” nìkan, èyí tí yóò túmọ̀ rẹ̀ jù.
- source_word: βαστάσει
  choice: yóò ru
  rationale: Ìṣe ọ̀la yìí bá future active indicative mu, “ru” sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún gbígbé ẹrù.
theological_decisions:
- issue: Ìbáṣepọ̀ Gálátíà 6:5 pẹ̀lú 6:2
  choice: A fi “ẹrù” sílẹ̀ gẹ́gẹ́ bí ohun tí ẹnì kọ̀ọ̀kan yóò ru, láìsọ nínú ọ̀rọ̀ pàtàkì pé ó túmọ̀ sí ìdájọ́ ọjọ́ ìkẹyìn tàbí ojúṣe nìkan.
  alternative: Kí a túmọ̀ φορτίον ní pàtó sí “ojúṣe,” tàbí kí a sọ pé ó jẹ́ ẹrù ní ọjọ́ ìdájọ́.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ ní ìtumọ̀ “ẹrù” tàbí ohun tí a ń ru. Itumọ̀ náà gbọ́dọ̀ pa ìfararora àti ìyàtọ̀ tó wà láàárín ẹsẹ 2 àti 5 mọ́, láìfi ojútùú ẹ̀kọ́ ìgbàgbọ́ kan sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì lo “olúkúlùkù” láti yàgò fún fífi akọ tàbí abo tí èdè Yorùbá kò béèrè kún ọ̀rọ̀ náà.
