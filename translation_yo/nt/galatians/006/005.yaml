  verdict: revise
  source_fidelity: 'Ìtumọ̀ pàtàkì náà tọ́ka dáadáa sí ἕκαστος, γάρ, φορτίον, àti βαστάσει: ẹni kọ̀ọ̀kan yóò ru ẹrù tí í ṣe tirẹ̀. Síbẹ̀, “fúnra rẹ̀” lẹ́yìn “tirẹ̀” lè fi ìmọ̀ afikun sí i pé ẹni náà gbọdọ̀ ru ẹrù náà láìsí ìrànlọ́wọ́, èyí tí Gíríìkì kò sọ ní pàtó.'
  naturalness: “Olúkúlùkù yóò ru ẹrù tirẹ̀” jẹ́ Yorùbá boṣewa, kedere, ó sì ń mú ìtẹnumọ́ τὸ ἴδιον wá láìjẹ́ àtúnlò tàbí àìdánidá. Àtúnṣe àlàyé ìsàlẹ̀ náà tún yàgò fún “fara da,” tí ó túmọ̀ sí ìfaradà ju gbígbé/rirú ẹrù lọ.
  terminology: “Ẹrù” àti “ru” bá φορτίον àti βαστάσει mu. Àlàyé ìsàlẹ̀ ń tọ́ka sí ìyàtọ̀ ọ̀rọ̀ Gíríìkì láàárín φορτίον ní ẹsẹ yìí àti βάρη ní ẹsẹ 2, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kan kún un.
  issues:
  - severity: medium
    issue: “tirẹ̀ fúnra rẹ̀”
    rationale: “Tirẹ̀” ti ń túmọ̀ τὸ ἴδιον (‘ti ara ẹni/tiẹ̀’) tán. “Fúnra rẹ̀” lè túmọ̀ sí ‘ní òun nìkan’ tàbí ‘láìsí ẹlòmíràn,’ èyí tí ó lè ṣàfikún ìmọ̀ tí kò sí nínú gbolohun Gíríìkì.
  - severity: medium
    issue: Àṣàyàn àlàyé ìsàlẹ̀ “yóò fara da ẹrù tirẹ̀”
    rationale: “Fara da” ń dojú kọ́ ìfaradà tàbí ìfaradà ìṣòro; kò ṣe ìbámu tó péye pẹ̀lú βαστάσει, ‘yóò ru/yóò gbé.’
  - severity: low
    issue: Ìtumọ̀ βάρη gẹ́gẹ́ bí “àwọn ẹrù wíwúwo” nínú àlàyé ìsàlẹ̀
    rationale: Àfikún “wíwúwo” lè jẹ́ ìtumọ̀ tó ṣeé ṣe nínú àyíká, ṣùgbọ́n kò yẹ kí àlàyé ìfiwéra ọ̀rọ̀ ṣe é bí ìtumọ̀ dandan. “Àwọn ẹrù” ń pa ìyàtọ̀ ọrọ̀ náà mọ́ láìsọ ju ohun tí ọ̀rọ̀ náà dájú lọ.
