revisions:
- from: Ṣùgbọ́n kí olúkúlùkù yẹ iṣẹ́ tirẹ̀ wò, nígbà náà ni yóò sì ní ìdí láti máa ṣògo nítorí ara rẹ̀ nìkan, kì í ṣe nípa fífi ara rẹ̀ wé ẹlòmíràn.[a]
  to: Ṣùgbọ́n kí olúkúlùkù yẹ iṣẹ́ tirẹ̀ wò, nígbà náà ni yóò sì ní ìdí ìṣògo ní ti ara rẹ̀ nìkan, kì í sì í ṣe ní ti ẹlòmíràn.[a]
  rationale: 'Àtúnṣe náà yọ ìtumọ̀ ‘nítorí’ kúrò nínú εἰς ἑαυτόν, ó sì tún fi ìtakora Gíríìkì náà hàn ní tààrà: ‘ní ti ara rẹ̀’ sí ‘ní ti ẹlòmíràn.’ Ó pa ìfiwéra mọ́ sí akọsilẹ̀ gẹ́gẹ́ bí ìmòye àyíká, kì í ṣe gẹ́gẹ́ bí ìtúmọ̀ tí a fi kún ọ̀rọ̀ pàtàkì.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:32:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú àṣẹ ‘kí ... yẹ ... wò,’ ọjọ́ iwájú ‘yóò ní,’ àti ìpínyà ‘olúkúlùkù’ hàn dáadáa. Ṣùgbọ́n ‘nítorí ara rẹ̀’ yí εἰς ἑαυτόν padà sí ‘because of himself,’ níbi tí ọ̀rọ̀ Gíríìkì ti ń fi ibi/ohun tí ìṣògo náà kan hàn: ‘ní ti ara rẹ̀.’ Bákan náà, ìfikún ‘nípa fífi ara rẹ̀ wé’ jẹ́ ìtúmọ̀ àlàyé tó lè tọ́ nínú àyíká, ṣùgbọ́n kò yẹ kí ó rọ́pò ‘kì í ṣe ní ti ẹlòmíràn’ nínú ọ̀rọ̀ pàtàkì.'
  naturalness: ‘Kí olúkúlùkù yẹ iṣẹ́ tirẹ̀ wò’ jẹ́ Yorùbá boṣewa tó dára. ‘Ní ìdí ìṣògo ní ti ara rẹ̀ nìkan’ jẹ́ ohun tí ó dáa síi fún kaύχημα gẹ́gẹ́ bí ìpìlẹ̀ tàbí ohun ìṣògo, ó sì pa ìtakora ọ̀rọ̀ náà mọ́ láì ṣàlàyé ju bó ṣe yẹ lọ.
  terminology: A pa ‘iṣẹ́,’ ‘yẹ ... wò,’ àti ‘olúkúlùkù’ mọ́. ‘Ìdí ìṣògo’ ń ṣàfihàn καύχημα gẹ́gẹ́ bí ìdí/ohun ìṣògo, kì í ṣe ìṣe ṣíṣògo lasán. ‘Ní ti ara rẹ̀ ... ní ti ẹlòmíràn’ ń fara mọ́ ìtòlẹ́sẹẹsẹ εἰς ... καὶ οὐκ εἰς.
  issues:
  - severity: medium
    issue: ‘nítorí ara rẹ̀’ fún εἰς ἑαυτόν μόνον
    rationale: ‘Nítorí’ sábà ń sọ ìdí tàbí ohun tó fa nkan; εἰς níbí ń sọ ìtọ́kasí sí ara ẹni, ní ìyàtọ̀ sí ẹlòmíràn.
  - severity: medium
    issue: ‘kì í ṣe nípa fífi ara rẹ̀ wé ẹlòmíràn’ rọ́pò apá ìkẹyìn
    rationale: Ìfiwéra jẹ́ àlàyé àyíká tó ṣeé ṣe, ṣùgbọ́n τὸν ἕτερον jẹ́ ‘ẹlòmíràn’; kí a má ṣe fi ìtumọ̀ àlàyé náà rọ́pò ọ̀rọ̀ ìpilẹ̀.
  - severity: low
    issue: Àlàyé ìsàlẹ̀ a ń pe ìfiwéra ní ‘ìtumọ̀ ọ̀rọ̀ náà’
    rationale: Ó yẹ kí akọsilẹ náà samisi ìfiwéra gẹ́gẹ́ bí àlàyé àyíká, kì í ṣe gẹ́gẹ́ bí ohun tí a sọ ní tààrà nínú Gíríìkì.
  revised_text: Ṣùgbọ́n kí olúkúlùkù yẹ iṣẹ́ tirẹ̀ wò, nígbà náà ni yóò sì ní ìdí ìṣògo ní ti ara rẹ̀ nìkan, kì í sì í ṣe ní ti ẹlòmíràn.[a]
