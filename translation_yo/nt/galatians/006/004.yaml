id: GAL.6.4
reference: Galatians 6:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: yo
  text: Ṣùgbọ́n kí olúkúlùkù yẹ iṣẹ́ tirẹ̀ wò, nígbà náà ni yóò sì ní ìdí ìṣògo ní ti ara rẹ̀ nìkan, kì í sì í ṣe ní ti ẹlòmíràn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ‘ní ti ara rẹ̀ nìkan ... ní ti ẹlòmíràn.’ Ó lè túmọ̀ sí ‘ohun ìṣògo’ tàbí ‘ìdí ìṣògo.’ Àyíká ọ̀rọ̀ náà ń dámọ̀ràn pé a má ṣe dá ìṣògo ẹni lórí fífi ara ẹni wé ẹlòmíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργον
  choice: iṣẹ́
  rationale: “Iṣẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó gbòòrò, ó sì lè tọ́ka sí ìṣe tàbí ìwà ẹni nínú àyíká ọ̀rọ̀ yìí.
- source_word: δοκιμαζέτω
  choice: kí ... yẹ ... wò
  rationale: Gbólóhùn yìí fi àṣẹ hàn láti ṣàyẹ̀wò ohun kan kí a lè mọ bí ó ṣe rí, láì sọ tẹ́lẹ̀ pé àbájáde yóò dára.
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ó pa agbára ìtumọ̀ tó ń pín ọ̀rọ̀ náà sí ẹnì kọ̀ọ̀kan mọ́.
- source_word: ἑαυτοῦ
  choice: tirẹ̀
  rationale: Ó fi hàn pé iṣẹ́ ẹni náà fúnra rẹ̀ ni kí ó yẹ̀ wò.
- source_word: εἰς ἑαυτὸν μόνον
  choice: nítorí ara rẹ̀ nìkan
  rationale: Ó pa ìdojúkọ sí ara ẹni àti agbára μόνον mọ́, ní ìyàtọ̀ sí fífi ara ẹni wé ẹlòmíràn.
- source_word: καύχημα
  choice: ìdí láti máa ṣògo
  rationale: Yíyan yìí lè túmọ̀ sí ìpìlẹ̀ tàbí ohun tí ẹni fi ń ṣògo, kì í ṣe ìṣe ṣíṣògo nìkan.
- source_word: ἕξει
  choice: yóò ní
  rationale: Ó túmọ̀ ọjọ́ iwájú gẹ́gẹ́ bí àbájáde ìyẹ̀wò iṣẹ́ ẹni.
- source_word: τὸν ἕτερον
  choice: ẹlòmíràn
  rationale: Ó tọ́ka sí ẹlòmíràn ní ìyàtọ̀ sí ẹni náà fúnra rẹ̀; nínú Yorùbá, àtakò náà ṣe àfihàn ìfiwéra ní kedere.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tó ní ìtakora sí ọ̀rọ̀ tó ṣáájú hàn.
theological_decisions:
- issue: Ìtumọ̀ καύχημα nínú ọ̀rọ̀ Paulu
  choice: “ìdí láti máa ṣògo”
  alternative: “ìṣògo” tàbí “ohun ìṣògo”
  rationale: Ó pa àìdánilójú mọ́ bóyá ọ̀rọ̀ náà ń tọ́ka sí ìṣe ṣíṣògo tàbí ìpìlẹ̀ rẹ̀, kò sì sọ pé ìgbéraga rere ni.
- issue: Ìfiwéra ara ẹni pẹ̀lú ẹlòmíràn
  choice: “kì í ṣe nípa fífi ara rẹ̀ wé ẹlòmíràn”
  alternative: “kì í ṣe nínú ẹlòmíràn”
  rationale: Èyí sọ agbára εἰς τὸν ἕτερον ní Yorùbá àdánidá, ó sì pa ìtakora láàárín ìyẹ̀wò ara ẹni àti fífi ara ẹni wé ẹlòmíràn mọ́.
- issue: Ẹni akọ gẹ́gẹ́ bí aṣojú gbogbo ènìyàn
  choice: A lo “olúkúlùkù” àti àrọ́pò-orúkọ tí kò fi akọ tàbí abo hàn.
  alternative: Lílo ọ̀rọ̀ tó sọ akọ ní pàtó
  rationale: Yorùbá kò ní ìyàtọ̀ akọ àti abo nínú àwọn àrọ́pò-orúkọ wọ̀nyí; “olúkúlùkù” pa ipa ẹnì kọ̀ọ̀kan nínú Gíríìkì mọ́ láì fi ohun tí èdè Yorùbá kò sábà fi hàn kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, títọ́, ọlọ́lá, tí ó sì yé òǹkàwé òde òní. A lo “yẹ ... wò” fún ìṣàyẹ̀wò pẹ̀lú ìdánwò, àti “ṣògo” láti yẹra fún fífi ìtumọ̀ ìgbéraga rere tàbí búburú kan ọ̀rọ̀ náà.
