reference: Galatians 6:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: yo
  text: 'Ṣùgbọ́n kí ó má ṣẹlẹ̀ fún mi láé láti ṣògo, bí kò ṣe nínú àgbélébùú Olúwa wa Jésù Mèsáyà[a], nípasẹ̀ èyí[b] tí a ti kan ayé mọ́ àgbélébùú fún mi, tí a sì ti kan mi mọ́ àgbélébùú fún ayé.


    [a] Ní Gíríìkì, “Jésù Kristi.” A tú ọ̀rọ̀ oyè Χριστός sí “Mèsáyà” níbí láti pa ìtumọ̀ rẹ̀ mọ́.


    [b] Tàbí, “nípasẹ̀ ẹni náà,” bí ọ̀rọ̀ arọ́pò-orúkọ náà bá tọ́ka sí Olúwa Jésù Mèsáyà dípò àgbélébùú.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “Jésù Kristi.” A tú ọ̀rọ̀ oyè Χριστός sí “Mèsáyà” níbí láti pa ìtumọ̀ rẹ̀ mọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ ẹni náà,” bí ọ̀rọ̀ arọ́pò-orúkọ náà bá tọ́ka sí Olúwa Jésù Mèsáyà dípò àgbélébùú.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: kí ó má ṣe rí bẹ́ẹ̀ fún mi láé
  rationale: Ọ̀rọ̀ yìí jẹ́ ìkọ̀sílẹ̀ líle tí ó ní agbára ẹni-kìíní; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtẹnumọ́ náà mọ́.
- source_word: καυχᾶσθαι
  choice: kí n máa ṣògo
  rationale: “Ṣògo” fi ìgbéraga tàbí fífi ohun kan ṣe ìpìlẹ̀ ìyìn ẹni hàn, ó sì bá ìyàtọ̀ tí Pọ́ọ̀lù ń ṣe nínú àyíká ọ̀rọ̀ mu.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Ó fi ohun kan ṣoṣo tí ó jẹ́ ìdí ṣíṣògo tó tọ́ hàn ní Yorùbá àdánidá.
- source_word: σταυρῷ
  choice: àgbélébùú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ jù lọ fún σταυρός nínú àyíká ikú Jésù.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” bá ìlò κύριος gẹ́gẹ́ bí orúkọ oyè nínú Májẹ̀mú Tuntun mu.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ orúkọ oyè tí ó túmọ̀ sí ẹni àmì òróró; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
- source_word: δι’ οὗ
  choice: nípasẹ̀ èyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà bá σταυρῷ mu, àgbélébùú sì ni ọ̀rọ̀ tó sún mọ́ ọn jù; akọsilẹ̀ ìsàlẹ̀ pa àṣàyàn “nípasẹ̀ ẹni tí” mọ́.
- source_word: κόσμος
  choice: ayé
  rationale: “Ayé” ni ìtumọ̀ Yorùbá tó gbòòrò, tó sì lè ru ìtumọ̀ ètò ayé tí ó yà sí Ọlọ́run láì fi àlàyé onítumọ̀ kún ọ̀rọ̀ náà.
- source_word: ἐσταύρωται
  choice: a ti kan … mọ́ àgbélébùú
  rationale: Ìlò “ti” pa ìṣe tí ó ti ṣẹlẹ̀ tí àbájáde rẹ̀ sì ń bá a lọ mọ́, ìtumọ̀ náà sì pa àwòrán àgbélébùú mọ́.
- source_word: κἀγὼ κόσμῳ
  choice: àti èmi fún ayé
  rationale: A pa àìsọ ọ̀rọ̀-ìṣe lẹ́ẹ̀kejì mọ́ gẹ́gẹ́ bí ó ti rí ní Gíríìkì, nígbà tí ìfararora gbólóhùn náà ṣì mú ìtumọ̀ rẹ̀ yé ni Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: A mú Χριστός gẹ́gẹ́ bí orúkọ oyè, a sì tú ìtumọ̀ rẹ̀ sí “Mèsáyà” láì gbé ẹ̀kọ́ ìjọ kan wọ ọ̀rọ̀ náà.
- issue: Ohun tí δι’ οὗ ń tọ́ka sí
  choice: 'àgbélébùú: “nípasẹ̀ èyí”'
  alternative: 'Olúwa Jésù Mèsáyà: “nípasẹ̀ ẹni tí”'
  rationale: Àgbélébùú ni ọ̀rọ̀ tó sún mọ́ ọ̀rọ̀ arọ́pò-orúkọ náà jù, ìbámu gírámà sì fara mọ́ ọn; síbẹ̀, akọsilẹ̀ pa ìtumọ̀ kejì tó ṣeé ṣe mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn “kí ó má ṣe rí bẹ́ẹ̀ fún mi láé” pa ìkọ̀sílẹ̀ líle ti Gíríìkì mọ́; a sì pa ìfararora ṣókí ti apá ìkẹyìn mọ́ dípò fífi ọ̀rọ̀-ìṣe tí Gíríìkì kò tún sọ kún un.
