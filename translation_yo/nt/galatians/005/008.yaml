  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: yo
  text: Ìmúnilọ́kàn yìí kò ti ọ̀dọ̀ ẹni tí ń pè yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìdarí yìí kò ti ọ̀dọ̀ ẹni tí ń pè yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισμονὴ
  choice: ìyípadà ọkàn
  rationale: Ọ̀rọ̀ Gíríìkì yìí jẹ́ ọ̀rọ̀-orúkọ tí ó ṣọ̀wọ́n, ó sì lè tọ́ka sí iṣẹ́ yíyí ẹnì kan lọ́kàn tàbí ipò jíjẹ́ ẹni tí a ti yí lọ́kàn. “Ìyípadà ọkàn” jẹ́ èdè Yorùbá àdánidá tí ó mú ipa tàbí àbájáde ìyínilérò yìí jáde láì sọ ó di ìgbọràn.
- source_word: ἐκ
  choice: ti ọ̀dọ̀
  rationale: ἐκ ń tọ́ka sí orísun. “Ti ọ̀dọ̀” sọ ní kedere pé ìyípadà ọkàn náà kò pilẹ̀ láti ọ̀dọ̀ ẹni náà.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: ẹni tí ń pè yín wá
  rationale: A pa àpólà aláìlórúkọ náà mọ́, a sì lo “ń pè” láti ṣàfihàn ìṣe tí ó ń lọ lọ́wọ́. “Wá” mú ìtumọ̀ ìpè náà jẹ́ àdánidá ní Yorùbá láì fi “Ọlọ́run” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: οὐκ
  choice: kò
  rationale: Àtakò tààrà ni; “kò” pa agbára ìkọ̀sílẹ̀ Pọ́ọ̀lù mọ́.
theological_decisions:
- issue: Ta ni “ẹni tí ń pè yín wá” ń tọ́ka sí?
  choice: A túmọ̀ ọ́ gẹ́gẹ́ bí “ẹni tí ń pè yín wá,” láì fi “Ọlọ́run” sínú ọ̀rọ̀ pàtàkì.
  alternative: “Ọlọ́run tí ń pè yín wá.”
  rationale: Àyíká Gálátíà fi hàn pé ó ṣeé ṣe kí Ọlọ́run ni Pọ́ọ̀lù ń tọ́ka sí, ṣùgbọ́n ọ̀rọ̀ Gíríìkì jẹ́ àpólà iṣe aláìlórúkọ, kì í ṣe orúkọ “Ọlọ́run.” Ìtumọ̀ náà pa ọ̀rọ̀ Pọ́ọ̀lù àti ààyè ìtumọ̀ rẹ̀ mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “Ìyípadà ọkàn” ṣe kedere fún òǹkàwé lasán, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé pa ìtumọ̀ míì, “ìdarí,” mọ́.
