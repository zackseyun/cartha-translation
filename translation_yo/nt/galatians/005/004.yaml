source:
  edition: SBLGNT
  text: κατηργήθητε ⸀ἀπὸ Χριστοῦ οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: yo
  text: Ẹ̀yin tí ẹ ń wá ìdáláre nípa òfin, a ti yà yín kúrò lọ́dọ̀ Kristi[a]; ẹ ti ṣubú kúrò nínú oore-ọ̀fẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti gé yín kúrò lọ́dọ̀ Kristi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθητε
  choice: a ti gé kúrò lọ́dọ̀
  rationale: Ọ̀rọ̀ yìí mú ìtumọ̀ ìyapa tó lágbára nínú καταργέω pẹ̀lú ἀπό jáde, láì sọ pé ẹ̀kọ́ ìgbàlà kan pàtó ni ẹsẹ̀ náà ń fìdí múlẹ̀.
- source_word: ἀπὸ Χριστοῦ
  choice: lọ́dọ̀ Kristi
  rationale: ἀπό ń tọ́ka sí ìyapa; “lọ́dọ̀ Kristi” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyapa nínú ìbáṣepọ̀. “Kristi” jẹ́ orúkọ oyè tí ó ti wọ́pọ̀, tí ó sì bójú mu ní èdè Bíbélì Yorùbá.
- source_word: οἵτινες
  choice: Ẹ̀yin tí
  rationale: Ó dá àwọn ẹni pàtó lára àwọn tí Pọ́ọ̀lù ń bá sọ̀rọ̀ mọ̀, ó sì pa agbára ẹni-kejì púpọ̀ mọ́.
- source_word: ἐν νόμῳ
  choice: nípa òfin
  rationale: Ó sọ òfin di ìpìlẹ̀ tàbí ọ̀nà tí wọ́n fi ń wá ìdáláre, láì fi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: δικαιοῦσθε
  choice: ẹ ń wá ọ̀nà láti di olódodo
  rationale: Ìṣe lọwọlọwọ aláìṣe náà lè túmọ̀ ní pàtó sí “ẹ ń di olódodo,” ṣùgbọ́n àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù ń bá àwọn tó ń gbìyànjú láti rí ìdáláre nípasẹ̀ òfin sọ̀rọ̀. Ìtumọ̀ yìí jẹ́ àdánidá, ó sì pa èrò ìdáláre mọ́.
- source_word: τῆς χάριτος
  choice: kúrò nínú oore-ọ̀fẹ́
  rationale: Pẹ̀lú ἐκπίπτω, gbolohun náà ń sọ ìṣubú tàbí yiyọ kúrò nínú ipò oore-ọ̀fẹ́.
- source_word: ἐξεπέσατε
  choice: ẹ ti ṣubú kúrò
  rationale: Ó pa àwòrán ìṣubú àti ìṣe tí ó ti ṣẹlẹ̀ mọ́, láì dín ìkìlọ̀ Pọ́ọ̀lù kù.
theological_decisions:
- issue: Bóyá a ó túmọ̀ ẹsẹ̀ náà láti pinnu àríyànjiyàn nípa pípadánù ìgbàlà tàbí kíkọ̀ ọ̀nà oore-ọ̀fẹ́ sílẹ̀
  choice: 'Pa ọ̀rọ̀ ìkìlọ̀ líle àti àwòrán ìyapa mọ́: “a ti gé kúrò lọ́dọ̀ Kristi; ẹ ti ṣubú kúrò nínú oore-ọ̀fẹ́.”'
  alternative: Lo ọ̀rọ̀ aláìlágbára bí “ẹ ti jìnnà sí Kristi,” tàbí túmọ̀ ọ́ sí “ẹ ti kọ ọ̀nà oore-ọ̀fẹ́ sílẹ̀.”
  rationale: Gíríìkì sọ̀rọ̀ líle nípa ìyapa kúrò lọ́dọ̀ Kristi àti ìṣubú kúrò nínú oore-ọ̀fẹ́. Ìtumọ̀ náà kò gbọ́dọ̀ dín èyí kù, bẹ́ẹ̀ ni kò gbọ́dọ̀ fi ìpinnu ẹ̀kọ́ ìsìn kan tí ọ̀rọ̀ náà kò sọ ní tààrà kun un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo “di olódodo” fún δικαιόω ní ọ̀nà àdánidá; a sì lo “Kristi” gẹ́gẹ́ bí orúkọ oyè tó ti fìdí múlẹ̀ ní Yorùbá. Àmì ohùn ni a fi sí ibi tí ó bá yẹ.
