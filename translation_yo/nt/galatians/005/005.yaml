id: GAL.5.5
reference: Galatians 5:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/005.yaml
  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: yo
  text: Nítorí nípasẹ̀ Ẹ̀mí[a], láti inú ìgbàgbọ́[b], àwa ń fi ìháragàgà dúró de ìrètí òdodo[c].[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Ẹ̀mí.” Dátífù πνεύματι lè túmọ̀ sí ohun èlò (“nípasẹ̀ Ẹ̀mí”) tàbí ààyè ìgbé-ayé (“nínú Ẹ̀mí”).
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “lórí ìpìlẹ̀ ìgbàgbọ́.” πίστις lè túmọ̀ sí “ìgbàgbọ́,” “ìgbẹ́kẹ̀lé,” tàbí, ní àwọn àyíká kan, “ìṣòtítọ́.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì δικαιοσύνη lè tọ́ka sí òdodo tàbí ìdájọ́ òdodo; “òdodo” ni a lò nínú ọ̀rọ̀ pàtàkì níbí.
    reason: alternative_reading
  - marker: d
    text: A tún lè ṣètò ọ̀rọ̀ náà pé, “Nítorí àwa, nípasẹ̀ Ẹ̀mí, láti inú ìgbàgbọ́, ń fi ìháragàgà dúró de ìrètí òdodo.” Èyí tẹ̀lé ìtòlẹ́sẹẹsẹ ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí.
    reason: previous_rendering
lexical_decisions:
- source_word: ἡμεῖς
  choice: àwa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́ díẹ̀ nítorí ipò rẹ̀; “àwa” mú ìtẹnumọ́ yẹn jáde ní Yorùbá.
- source_word: γὰρ
  choice: nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ àlàyé tàbí ìdí tí Pọ́ọ̀lù ń fi ohun tó ṣáájú múlẹ̀.
- source_word: πνεύματι
  choice: nípasẹ̀ Ẹ̀mí
  rationale: Dátífù náà lè tọ́ka sí ohun èlò tàbí ààyè ìgbé-ayé; “nípasẹ̀ Ẹ̀mí” fi ipa Ẹ̀mí hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- source_word: ἐκ πίστεως
  choice: lórí ìpìlẹ̀ ìgbàgbọ́
  rationale: ἐκ lè fi orísun tàbí ìpìlẹ̀ hàn. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ ìṣáájú náà mọ́ ju lílo “nípa” lásán lọ.
- source_word: ἐλπίδα
  choice: ìrètí
  rationale: Ó jẹ́ ohun tí ọ̀rọ̀-ìṣe ἀπεκδεχόμεθα ń darí sí; Yorùbá kò nílò àfihàn kan bí article Gẹ̀ẹ́sì.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: “Òdodo” ni ìtumọ̀ àkọ́kọ́ tó bójú mu ní àyíká ọ̀rọ̀ Pọ́ọ̀lù, ó sì tún lè gba ojú ìtumọ̀ ìdájọ́ òdodo láì fi ìtumọ̀ ẹ̀kọ́ kan pàṣẹ.
- source_word: ἀπεκδεχόμεθα
  choice: ń fi ìháragàgà dúró de
  rationale: Ó mú ìdúróde pẹ̀lú ìfẹ́kúfẹ̀ẹ́ àti ìfojúsọ́nà tó wà nínú ọ̀rọ̀-ìṣe Gíríìkì náà jáde.
theological_decisions:
- issue: Ohun tí πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn
  rationale: Ìyàtọ̀ láàárín Ẹ̀mí, ara, àti òfin nínú Gálátíà 5 mú kí Ẹ̀mí Mímọ́ ṣeé ṣe jù; lẹ́tà ńlá àti àlàyé ìsàlẹ̀ fi ìpinnu náà hàn láì pa gbogbo àṣàyàn gírámà rẹ́.
- issue: Ìtumọ̀ ἐλπίδα δικαιοσύνης
  choice: ìrètí òdodo
  alternative: òdodo tí a ń retí; ìrètí tí òdodo ń mú wá
  rationale: Ìtumọ̀ náà ṣeé ṣe kí ó tọ́ka sí òdodo ìkẹyìn tí a ń retí, ṣùgbọ́n gbólóhùn Yorùbá náà pa ìbáṣepọ̀ gẹnitífù Gíríìkì mọ́ dípò kí ó yan ìtumọ̀ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀, àti èdè òde òní ni a lò. “Ń fi ìháragàgà dúró de” ṣe kedere fún òǹkàwé lasán, nígbà tí “lórí ìpìlẹ̀ ìgbàgbọ́” mú ἐκ πίστεως jáde lọ́nà àdánidá. Gbogbo àmì àlàyé ìsàlẹ̀ wà nínú ọ̀rọ̀ pàtàkì.
