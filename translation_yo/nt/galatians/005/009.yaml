  source_fidelity: 'Ìtumọ̀ náà pa gbogbo àwọn èròjà Gíríìkì mọ́: μικρὰ (‘dìẹ̀’), ζύμη (‘ìwúkàrà’), ὅλον (‘gbogbo’), φύραμα (‘ìyẹ̀fun tí a pò’), àti ζυμοῖ (‘ń mú ... wú’). Ó tún pa àwòrán òwe náà mọ́ láì ṣàlàyé ìfiṣàpẹẹrẹ rẹ̀ ju ohun tí ẹsẹ náà sọ lọ.'
  naturalness: Ìwúkàrà àti ìyẹ̀fun tí a pò jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere. Síbẹ̀, ‘ni ń mú’ nínú ọ̀rọ̀ àkọ́kọ́ lè hàn bí ìfọkànsí/ìpínrọ̀ (‘ìwúkàrà díẹ̀ ni...’) tí Gíríìkì kò tẹnu mọ́. Yíyọ ‘ni’ kúrò mú un di òwe gígùn-kúkúrú, ti ara, àti aláìfi ìtẹnumọ́ kún un.
  terminology: ‘Ìwúkàrà’ dára fún ζύμη, ‘ìyẹ̀fun tí a pò’ dára fún φύραμα, àti ‘ń mú ... wú’ jẹ́ ọ̀nà Yorùbá ti ara fún ζυμοῖ. A ṣètúnṣe yíyan ọ̀rọ̀ nínú àlàyé-ẹsẹ̀ láti yàgò fún ‘ìṣù,’ tí ó lè mú ìrònú isu wá, kó sì tọ́ka sí odidi ìyẹ̀fun tí a pò.
