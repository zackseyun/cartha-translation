  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: yo
  text: Ìwúkàrà díẹ̀ ń mú gbogbo ìyẹ̀fun tí a pò wú[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìwúkàrà díẹ̀ ń mú odidi ìyẹ̀fun tí a pò wú.”
    reason: Àṣàyàn ọ̀rọ̀ míì fún φύραμα, èyí tí ó lè túmọ̀ sí odidi ìyẹ̀fun tí a pò.
lexical_decisions:
- source_word: μικρὰ
  choice: díẹ̀
  rationale: Nínú ọ̀rọ̀ òwe yìí, ó ń tọ́ka sí ìwọ̀n kékeré, kì í ṣe kìkì pé ohun náà kéré ní ìrísí. ‘Díẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: ζύμη
  choice: ìwúkàrà
  rationale: ‘Ìwúkàrà’ ni ohun tí ń mú ìyẹ̀fun tí a pò wú; ó pa àwòrán ìṣe yíyan búrẹ́dì àti agbára òwe inú ẹsẹ náà mọ́.
- source_word: ὅλον
  choice: gbogbo
  rationale: ‘Gbogbo’ fi hàn pé ipa ìwúkàrà náà dé gbogbo ìyẹ̀fun tí a pò, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe tẹnu mọ́ ọn.
- source_word: φύραμα
  choice: ìyẹ̀fun tí a pò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìyẹ̀fun tí a ti pò, tàbí odidi ìṣù rẹ̀. Yíyan ‘ìyẹ̀fun tí a pò’ jẹ́ kó ṣe kedere, ó sì pa àwòrán ìpilẹ̀ṣẹ̀ mọ́.
- source_word: ζυμοῖ
  choice: ń mú … wú
  rationale: Èdè Yorùbá àdánidá máa ń sọ pé ìwúkàrà ‘ń mú’ ìyẹ̀fun ‘wú.’ Èyí sọ ìṣe ọ̀rọ̀ Gíríìkì náà ní kedere láì tú àkàwé náà sílẹ̀.
theological_decisions:
- issue: Agbára àkàwé inú òwe náà
  choice: Pa àwòrán ìwúkàrà àti ìyẹ̀fun tí a pò mọ́, láì sọ ohun tí àkàwé náà dúró fún ní pàtó.
  alternative: Ìkọ́ni èké díẹ̀ ń tàn ká gbogbo ìjọ.
  rationale: Pọ́ọ̀lù sọ òwe kan ní ẹsẹ yìí; kò tú ìtumọ̀ rẹ̀ sílẹ̀ nínú gbólóhùn náà. Ṣíṣe àlàyé ohun tí ó ń tọ́ka sí sínú ọ̀rọ̀ àkọ́kọ́ yóò ré kọjá ohun tí orísun sọ, yóò sì dín agbára ọ̀rọ̀ òwe náà kù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo ìṣàpẹẹrẹ ọ̀rọ̀ tí ó wọ́pọ̀ nípa ìwúkàrà mímú ìyẹ̀fun wú, a sì pa ìrísí òwe kúkúrú ti orísun mọ́.
