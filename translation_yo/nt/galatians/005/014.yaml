revisions:
- from: 'Nítorí gbogbo Òfin ni a ti mú ṣẹ nínú ọ̀rọ̀ kan pé: “Kí ìwọ fẹ́ ọmọnìkejì rẹ gẹ́gẹ́ bí ara rẹ.”[a][b]'
  to: 'Nítorí gbogbo Òfin ni a ti mú ṣẹ nínú ọ̀rọ̀ kan náà: “Kí o fẹ́ràn ọmọnìkejì rẹ bí ara rẹ.”[a][b]'
  rationale: A ṣàtúnṣe ọ̀rọ̀ ìṣe ìfẹ́ sí “fẹ́ràn” fún ìtumọ̀ tó péye àti ìlò Yorùbá boṣewa. A ṣe ìmúrasílẹ̀ díẹ̀ sí gbolohun ìfiwéra àti sí ìtọ́kasí “ọ̀rọ̀ kan náà,” nígbà tí a pa ìmúṣẹ Òfin (πεπλήρωται), àìdánilójú λόγος, àti ìtumọ̀ gbòòrò πλησίον mọ́. Àwọn àmì ìsàlẹ̀ àti àkóónú wọn ṣì bá orísun mu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:32:09Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ gbòòrò ẹsẹ̀ náà mọ́: γάρ ni “Nítorí,” πᾶς νόμος ni “gbogbo Òfin,” àti πεπλήρωται ni ìmúṣẹ, kì í ṣe àkójọpọ̀ lásán. Ṣùgbọ́n ọ̀rọ̀ ìṣe inú àyọlò náà gbọ́dọ̀ jẹ́ “fẹ́ràn,” kì í ṣe “fẹ́,” nítorí “fẹ́” sábà máa ń túmọ̀ sí “want” nínú Yorùbá òde òní.'
  naturalness: “Kí ìwọ fẹ́ ọmọnìkejì rẹ” kì í dára gẹ́gẹ́ bí ọ̀nà àṣẹ ìfẹ́ nínú Yorùbá boṣewa lónìí. “Kí o fẹ́ràn ọmọnìkejì rẹ bí ara rẹ” jẹ́ èdè adayeba, ó sì bá ìrísí àṣẹ inú àyọlò Ìwé Mímọ́ mu. “Bí ara rẹ” tún rọrùn, ó sì dáa ju “gẹ́gẹ́ bí ara rẹ” ní ibi yìí.
  terminology: “Òfin” yẹ fún νόμος nínú àyíká yìí. “Ọmọnìkejì” jẹ́ ọ̀rọ̀ tí ó fìdí múlẹ̀ nínú àyọlò Bibeli fún πλησίον, ó sì gbòòrò ju ẹni tó ń gbé lẹ́gbẹ̀ẹ́ ẹni lọ; nítorí náà a pa á mọ́. A tún ṣètò ìtẹ̀síwájú gbolohun náà sí “nínú ọ̀rọ̀ kan náà” láti fi ἐν ἑνὶ λόγῳ hàn ní ti ara.
  issues:
  - severity: medium
    issue: “fẹ́” ni a lò fún Ἀγαπήσεις.
    rationale: Nínú Yorùbá òde òní, “fẹ́” ní ìtumọ̀ àkọ́kọ́ ‘fẹ́/want’; “fẹ́ràn” ni ọ̀rọ̀ ìṣe tó ṣe kedere fún ìfẹ́ ẹni. Ìyípadà yìí ṣe pàtàkì fún ìdúróṣinṣin ìtumọ̀ àṣẹ náà.
  - severity: low
    issue: “gẹ́gẹ́ bí ara rẹ” jẹ́ ìtẹ̀síwájú tí ó wuwo díẹ̀.
    rationale: “Bí ara rẹ” jẹ́ ìfiwéra Yorùbá tó rọrùn, ó sì ń ṣojú ὡς σεαυτόν dáadáa láì yi ìtumọ̀ padà.
  - severity: low
    issue: “kan náà” kò sí lẹ́yìn “ọ̀rọ̀ kan.”
    rationale: Fífi “náà” kún un jẹ́ ọ̀nà Yorùbá adayeba láti ṣàfihàn pé àṣẹ tí a ń bọ̀ ni ọ̀rọ̀/àsọjáde kan tí a sọ tẹ́lẹ̀; kò fi ìtumọ̀ tuntun kún orísun.
