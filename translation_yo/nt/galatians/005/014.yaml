source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: yo
  text: 'Nítorí gbogbo Òfin ni a ti mú ṣẹ nínú ọ̀rọ̀ kan náà: “Kí o fẹ́ràn ọmọnìkejì rẹ bí ara rẹ.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú gbólóhùn kan.” Ní tààràtà, Gíríìkì ní “nínú ọ̀rọ̀ kan,” èyí tó túmọ̀ sí àsọjáde tàbí àṣẹ kan ṣoṣo.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “a ti mú un ṣẹ,” tàbí, ní ìtumọ̀ àlàyé, “a ṣàkójọ rẹ̀.” Ọ̀rọ̀-ìṣe Gíríìkì túmọ̀ sí “a ti mú ṣẹ” ní pàtàkì, ó sì lè fi hàn pé ète Òfin dé ìmúṣẹ rẹ̀ nínú àṣẹ yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Nítorí
  rationale: γάρ ń fi ìdí tàbí àlàyé fún ọ̀rọ̀ tó ṣáájú hàn; “Nítorí” jẹ́ àsopọ̀ Yorùbá tó ṣe kedere níbí.
- source_word: πᾶς νόμος
  choice: gbogbo Òfin
  rationale: Ó tọ́ka sí Òfin gẹ́gẹ́ bí odindi kan, ó sì pa agbára àkópọ̀ πᾶς mọ́ láì fi ààlà tí Gíríìkì kò sọ kún un.
- source_word: ἐν ἑνὶ λόγῳ
  choice: nínú ọ̀rọ̀ kan
  rationale: λόγος lè túmọ̀ sí ọ̀rọ̀, gbólóhùn, tàbí àsọjáde. “Ọ̀rọ̀ kan” bá èdè Yorùbá mu, ó sì pa àìdánilójú tó wà láàárín ‘ọ̀rọ̀’ àti ‘àsọjáde’ mọ́.
- source_word: πεπλήρωται
  choice: ni a ti mú ṣẹ
  rationale: Àkókò perfect passive ń tọ́ka sí ohun tí a ti mú ṣẹ tí ipò rẹ̀ sì dúró. “A ti mú ṣẹ” pa ohùn àfarawà àti ìtumọ̀ ìmúṣẹ mọ́ ju ‘a ṣàkójọ rẹ̀’ lọ.
- source_word: ἐν τῷ
  choice: 'pé:'
  rationale: Àmì méjì àti “pé” fi àkóónú ọ̀rọ̀ kan náà hàn lọ́nà àdánidá ní Yorùbá.
- source_word: Ἀγαπήσεις
  choice: Kí ìwọ fẹ́
  rationale: Future indicative inú àyọlò Lefitiku 19:18 ní ipa àṣẹ. “Kí ìwọ fẹ́” jẹ́ ọ̀nà àṣẹ tó níyì, tó sì pa ìrísí àyọlò Ìwé Mímọ́ mọ́.
- source_word: τὸν πλησίον σου
  choice: ọmọnìkejì rẹ
  rationale: Nínú àyíká ìwà rere yìí, πλησίον túmọ̀ sí ẹni ẹlẹgbẹ́ tàbí aládùúgbò. “Ọmọnìkejì” jẹ́ ọ̀rọ̀ Yorùbá tó gbòòrò, tó sì yẹ fún àṣẹ Lefitiku 19:18.
- source_word: ὡς σεαυτόν
  choice: gẹ́gẹ́ bí ara rẹ
  rationale: Ó fi ìfiwéra náà hàn ní tààràtà àti ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ Pọ́ọ̀lù nípa ìbáṣepọ̀ Òfin pẹ̀lú àṣẹ ìfẹ́
  choice: Gbogbo Òfin ni a ti mú ṣẹ nínú àṣẹ láti fẹ́ ọmọnìkejì ẹni.
  alternative: Àṣẹ yìí kàn ṣàkójọ gbogbo Òfin; tàbí apá Òfin tó kan ìwà rere nìkan ni Pọ́ọ̀lù ní lọ́kàn.
  rationale: πληρόω túmọ̀ sí ìmúṣẹ ní pàtàkì, bí ó tilẹ̀ jẹ́ pé èrò àkójọpọ̀ sún mọ́ ọn nínú àyíká yìí. A kò fi ‘apá ìwà rere’ kún Òfin, nítorí Gíríìkì kò ṣe ààlà bẹ́ẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; ìforúkọsílẹ̀ náà níyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. “Òfin” ni a kọ pẹ̀lú lẹ́tà ńlá láti fi hàn pé Òfin Mósè ni àyíká náà ń tọ́ka sí, láì fi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un.
