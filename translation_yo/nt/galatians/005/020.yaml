translation:
  language: yo
  text: ìbọ̀rìṣà, iṣẹ́ oṣó[a], ìkórìíra, ìjà, owú, ìbínú gbígbóná, ìwà wíwá ire ti ara ẹni, ìyapa, ìpín sí ẹgbẹ́-ẹgbẹ́[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “iṣẹ́ àjẹ́” fún iṣẹ́ oṣó.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ẹgbẹ́ ìsìn” tàbí, gẹ́gẹ́ bí ọ̀rọ̀ náà ṣe di lílò nínú ìjọ ní ìgbà tó tẹ̀ lé e, “àwọn ẹ̀kọ́ èké.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδωλολατρία
  choice: ìbọ̀rìṣà
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí jíjọ́sìn tàbí sísìn òrìṣà; “ìbọ̀rìṣà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bójú mu nínú àkójọ ìwà búburú.
- source_word: φαρμακεία
  choice: iṣẹ́ oṣó
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí iṣẹ́ òkùnkùn tí ó ní í ṣe pẹ̀lú oògùn, àfọ̀ṣẹ tàbí idán, kì í ṣe ìlò egbòogi lápapọ̀.
- source_word: ἔχθραι
  choice: ìkórìíra
  rationale: Ọ̀pọ̀ nọ́ńbà Gíríìkì náà ń sọ̀rọ̀ nípa ìṣọ̀tá àti ìfarahàn rẹ̀; “ìkórìíra” jẹ́ àdánidá, ó sì lè bo ipò ọkàn àti ìwà ọ̀tá.
- source_word: ἔρις
  choice: ìjà
  rationale: Ó ń tọ́ka sí ìforígbárí àti àríyànjiyàn alájà; “ìjà” jẹ́ ọ̀rọ̀ kúkúrú, tó wọ́pọ̀, tó sì bá àkójọ náà mu.
- source_word: ζῆλος
  choice: owú
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí ìtara, nínú àkójọ ìwà búburú yìí ó ní ìtumọ̀ òdì ti owú àti ìfigagbága.
- source_word: θυμοί
  choice: ìbínú gbígbóná
  rationale: Ọ̀pọ̀ nọ́ńbà náà ń tẹnumọ́ ìbínú tó máa ń bú jáde léraléra; “ìbínú gbígbóná” mú agbára ìtumọ̀ náà jáde láìlo ọ̀rọ̀ àjèjì.
- source_word: ἐριθεῖαι
  choice: ìwà wíwá ire ti ara ẹni
  rationale: Ọ̀rọ̀ náà ní èrò ìtara fún èrè tàbí ipò ẹni fúnra rẹ̀, pàápàá nípasẹ̀ ìfigagbága; àyọkà yìí sọ ìdí inú náà di mímọ̀.
- source_word: διχοστασίαι
  choice: ìyapa
  rationale: Ó ń tọ́ka sí pínyà tàbí dídúró sí ẹgbẹ́ òdìkejì; “ìyapa” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìbàjẹ́ ìṣọ̀kan àwùjọ.
- source_word: αἱρέσεις
  choice: ìpín sí ẹgbẹ́-ẹgbẹ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà kọ́kọ́ ń tọ́ka sí ẹgbẹ́ oníjàngbọ̀n tàbí ìpín ẹgbẹ́, kì í ṣe dandan sí ẹ̀kọ́ ìgbàgbọ́ èké ní ìtumọ̀ ìjọ ti ọjọ́ iwájú.
theological_decisions:
- issue: Ìtumọ̀ αἱρέσεις
  choice: ìpín sí ẹgbẹ́-ẹgbẹ́
  alternative: àwọn ẹ̀ya ìsìn tàbí ẹ̀kọ́ èké
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ jẹ́ àkójọ ẹ̀ṣẹ̀ tó ń ba àjọṣe àti ìṣọ̀kan àwùjọ jẹ́. Nítorí náà, a pa ìtumọ̀ ẹgbẹ́ oníyapa mọ́, láìfi ìtumọ̀ imọ̀-ẹ̀sìn ti ìgbà tó tẹ̀ lé e wọ inú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àkójọ ọ̀rọ̀-orúkọ láti tẹ̀ lé ìṣètò Gíríìkì, a sì fi àmì ohùn sí ibi tí ó yẹ.
