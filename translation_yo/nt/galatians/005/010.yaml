id: GAL.5.10
reference: Galatians 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: yo
  text: Mo ní ìgbẹ́kẹ̀lé nínú Olúwa nípa yín pé ẹ̀yin kì yóò ní èrò mìíràn[a]. Ṣùgbọ́n ẹni tí ń dá yín láàmú yóò ru ìdájọ́ náà, kí ó jẹ́ ẹnikẹ́ni tí ó bá jẹ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ‘ẹ̀yin kì yóò ronú ohun mìíràn.’ Ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí níní tàbí gbígba ìwòye kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘kí ó jẹ́ ẹnikẹ́ni tí ó bá jẹ́.’
    reason: alternative_reading
lexical_decisions:
- source_word: πέποιθα εἰς ὑμᾶς
  choice: Mo ní ìgbẹ́kẹ̀lé ... nípa yín
  rationale: Perfect tense náà ń tọ́ka sí ipò ìgbẹ́kẹ̀lé tí ó fìdí múlẹ̀. ‘Nípa yín’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìgbẹ́kẹ̀lé Paulu nípa ìdáhùn àwọn ará Gálátíà hàn, láìsọ ọ́ di ìgbẹ́kẹ̀lé tí kò ní ààlà.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa ìtumọ̀ ibi tàbí ìpìlẹ̀ ìgbẹ́kẹ̀lé Paulu mọ́, ó sì jẹ́ gbólóhùn ẹ̀sìn tí ó ṣe kedere ní Yorùbá.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: ẹ̀yin kì yóò ní èrò mìíràn
  rationale: φρονέω lè túmọ̀ sí ríronú, ìwòye, tàbí èrò ọkàn. Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìtumọ̀ pé wọn kì yóò gba ìwòye mìíràn mọ́.
- source_word: ὁ δὲ ταράσσων ὑμᾶς
  choice: Ṣùgbọ́n ẹni tí ń dá yín láàmú
  rationale: Present participle náà ń tọ́ka sí ẹni tí ó ń fa ìdàrúdàpọ̀ lọ́wọ́lọ́wọ́; ‘ń dá yín láàmú’ jẹ́ èdè Yorùbá tí ó wọ́pọ̀, tí ó sì ní agbára tó yẹ.
- source_word: βαστάσει τὸ κρίμα
  choice: yóò ru ìdájọ́ náà
  rationale: ‘Ru’ pa àwòrán βαστάζω gẹ́gẹ́ bí gbígbé ẹrù mọ́. ‘Ìdájọ́’ kò pinnu bóyá κρίμα túmọ̀ sí ìdájọ́, gbolohun ẹ̀bi, tàbí ìyà tó tẹ̀ lé e.
- source_word: ὅστις ἐὰν ᾖ
  choice: ẹnikẹ́ni tí ó bá jẹ́
  rationale: Ìkọ́lé aláìlẹ́ni-pàtó náà fi hàn pé ẹni tí olùdàrúdàpọ̀ náà jẹ́ kò yí ìkìlọ̀ náà padà; èyí jẹ́ ọ̀nà Yorùbá tó bá ìtumọ̀ ‘whoever he may be’ mu.
theological_decisions:
- issue: Irú ìgbẹ́kẹ̀lé tí Paulu ní nípa àwọn ará Gálátíà
  choice: Paulu ní ìgbẹ́kẹ̀lé nípa èrò wọn lọ́jọ́ iwájú, ìgbẹ́kẹ̀lé náà sì wà nínú Olúwa.
  alternative: Kí a sọ ọ́ di ìdánilójú aláìnídìí pé gbogbo wọn yóò dúró ṣinṣin, tàbí kí a sọ ọ́ di ìrètí Paulu lásán.
  rationale: Ọ̀rọ̀ Gíríìkì so ìgbẹ́kẹ̀lé Paulu pọ̀ mọ́ ‘nínú Olúwa’ àti ìrètí ọjọ́ iwájú, ṣùgbọ́n kò ṣàlàyé gbogbo ọ̀nà tí èyí yóò gbà ṣẹ.
- issue: Agbára àti ìwọ̀n τὸ κρίμα
  choice: Ìdájọ́ tí olùdàrúdàpọ̀ náà yóò ru, láìsọ irú ìdájọ́ náà ní pàtó.
  alternative: Ìdálẹ́bi ayérayé nìkan, tàbí àbájáde láàárín ìjọ nìkan.
  rationale: κρίμα ní ìtumọ̀ tó gbòòrò ju ìdálẹ́bi ayérayé lọ, ẹsẹ̀ náà kò sì sọ irú tàbí àkókò ìdájọ́ náà ní pàtó.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, àti àdánidá, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo ‘ẹ̀yin’ láti fi ọ̀pọ̀ ènìyàn hàn, ‘Olúwa’ sì pa ọ̀nà ìtumọ̀ Pauline mọ́.
