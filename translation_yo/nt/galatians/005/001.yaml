id: GAL.5.1
reference: Galatians 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: yo
  text: Fún òmìnira ni Mèsáyà sọ wá di òmìnira[a]. Nítorí náà, ẹ dúró ṣinṣin, kí ẹ má sì tún fi ara yín sábẹ́ àjàgà ìsìnrú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nínú òmìnira ni Mèsáyà sọ wá di òmìnira.” Gbólóhùn dátífù tó bẹ̀rẹ̀ ẹsẹ yìí kúrú, ó sì lè ní ìtumọ̀ méjì tí ó sún mọ́ ara wọn.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí pé kí ẹ má ṣe jẹ́ kí àjàgà ìsìnrú tún dì yín mú tàbí kí ó tún ṣàkóso yín.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: Fún òmìnira
  rationale: Gbólóhùn dátífù yìí kúrú, ó sì lè tọ́ka sí ète tàbí àbájáde. “Fún òmìnira” pa ìtẹnumọ́ àti agbára ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì mú ìtumọ̀ náà dín kù sí ọ̀nà kan ṣoṣo.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: A túmọ̀ oyè náà dípò lílo ọ̀rọ̀ ìjọ tí a jogún, kí ìtumọ̀ rẹ̀ gẹ́gẹ́ bí Ẹni Àmì Òróró àti àyíká Mèsáyà ti Júù lè hàn.
- source_word: ἠλευθέρωσεν
  choice: sọ wá di òmìnira
  rationale: Ọ̀rọ̀-ìṣe náà túmọ̀ sí láti dá ẹni sílẹ̀ kúrò nínú ìdè. Yíyan ọ̀rọ̀ “òmìnira” tún pa ìbáṣepọ̀ ọ̀rọ̀ rẹ̀ pẹ̀lú ἐλευθερία mọ́.
- source_word: στήκετε
  choice: ẹ dúró ṣinṣin
  rationale: Àṣẹ àsìkò ìsinsìnyí ń pè fún ìdúróṣinṣin tí ó ń bá a lọ. Èdè yìí jẹ́ àdánidá, ó sì pa agbára ìṣírí náà mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ tó tẹ̀ lé e jẹ́ ìparí ọgbọ́n tí ó jáde láti inú gbólóhùn tó ṣáájú.
- source_word: ζυγῷ δουλείας
  choice: àjàgà ìsìnrú
  rationale: “Àjàgà” pa àwòrán ohun tí a fi ń tẹ ẹranko láti ṣàkóso rẹ̀ mọ́, “ìsìnrú” sì fi ipò ẹni tí kò lómìnira hàn ní kíkún.
- source_word: ἐνέχεσθε
  choice: fi ara yín sábẹ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà lè túmọ̀ sí jíjẹ́ ẹni tí ohun kan ń ṣàkóso tàbí dẹ mọ́. “Fi ara yín sábẹ́ àjàgà” bá àwòrán àjàgà mu, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: πάλιν
  choice: tún
  rationale: Ó tọ́ka sí pípadà sínú ipò tẹ́lẹ̀; “tún” ni ìtumọ̀ tààrà tí ó bá gbólóhùn Yorùbá mu.
theological_decisions:
- issue: Bóyá kí Χριστός jẹ́ oyè tàbí ọ̀rọ̀ tó dà bí orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí Ẹni Àmì Òróró. “Mèsáyà” mú ìtumọ̀ oyè náà àti ìpìlẹ̀ rẹ̀ nínú ìrètí àwọn Júù hàn, láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Bí a ṣe lè fi agbára δουλεία hàn
  choice: ìsìnrú
  alternative: ìdè
  rationale: “Ìsìnrú” sọ ipò ẹni tí a sọ di ẹrú ní kedere, ó sì pa ìyàtọ̀ tó lágbára láàárín òmìnira àti ìsìnrú mọ́ ju “ìdè” tó lè ní ìtumọ̀ gbòòrò lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn ní ibi tó yẹ. Ó jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àwòrán “àjàgà” àti ìtakora láàárín òmìnira àti ìsìnrú mọ́.
