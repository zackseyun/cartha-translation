revisions:
- from: Ẹ má ṣe jẹ́ kí a di agbéraga asán[a], kí a máa mú ara wa bínú, kí a sì máa ṣe ìlara ara wa.
  to: Kí a má di alágbéraga asán[a], kí a máa ta ara wa níjà, kí a sì máa ṣe ìlara ara wa.
  rationale: The revision uses a direct Yoruba first-person plural exhortation for μὴ γινώμεθα, renders κενόδοξοι with an idiomatic adjective, and replaces the anger-specific expression with wording that retains the Greek sense of reciprocal provocation or challenge. The parallel clauses preserve the participial coordination without specifying an unwarranted causal relationship.
