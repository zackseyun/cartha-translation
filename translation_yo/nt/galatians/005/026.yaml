id: GAL.5.26
reference: Galatians 5:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ γινώμεθα κενόδοξοι, ἀλλήλους προκαλούμενοι, ἀλλήλοις φθονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/026.yaml
  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: yo
  text: Kí a má di alágbéraga asán[a], kí a máa ta ara wa níjà, kí a sì máa ṣe ìlara ara wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oní ògo asán.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí ògo asán tàbí ìgbé ara ẹni ga tí kò ní ìpìlẹ̀ ń darí.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: Ẹ má ṣe jẹ́ kí a di
  rationale: Ìtumọ̀ yìí mú àṣẹ-ìṣírí ẹni àkọ́kọ́ púpọ̀ àti ìmọ̀ pé kí wọ́n má ṣe bẹ̀rẹ̀ sí í wà ní irú ipò náà jáde; ó bá ọ̀nà àdánidá tí Yorùbá fi ń sọ ‘ẹ jẹ́ kí a…’ mu.
- source_word: κενόδοξοι
  choice: agbéraga asán
  rationale: Ó fi ìgbéraga tàbí ìgbé ara ẹni ga tí kò ní ìpìlẹ̀ hàn, ó sì jẹ́ èdè tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: ἀλλήλους / ἀλλήλοις
  choice: ara wa
  rationale: ‘Ara wa’ ni ọ̀nà àdánidá láti sọ ìṣe tí àwọn ènìyàn ń ṣe sí ara wọn nínú ìṣírí ẹni àkọ́kọ́ púpọ̀.
- source_word: προκαλούμενοι
  choice: kí a máa mú ara wa bínú
  rationale: Ó pa ìtumọ̀ fífi ara ẹni ru tàbí dán ara ẹni níjà mọ́ láì dín un kù sí ìbínú lásán; nínú àyíká yìí, gbólóhùn náà túbọ̀ jẹ́ èdè Yorùbá àdánidá.
- source_word: φθονοῦντες
  choice: kí a sì máa ṣe ìlara ara wa
  rationale: Ó sọ ìmọ̀lára ìlara sí ẹlòmíràn ní kedere, ó sì pa ìbáramu àwọn ìṣe méjèèjì mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ àwọn participle pẹ̀lú ìṣírí pàtàkì
  choice: 'A túmọ̀ wọn gẹ́gẹ́ bí ìṣe tí ó ń bá ìgbéraga asán lọ: ‘kí a máa mú ara wa bínú, kí a sì máa ṣe ìlara ara wa.’'
  alternative: 'A lè kà wọ́n bí ohun tí ó ń ṣàlàyé ọ̀nà tí ìgbéraga asán gbà ń ṣẹlẹ̀: ‘nípa mímú ara wa bínú àti ṣíṣe ìlara ara wa.’'
  rationale: Ètò Gíríìkì fi κενόδοξοι hàn gẹ́gẹ́ bí àpèjúwe pàtàkì lẹ́yìn γινώμεθα, àwọn participle sì ń ṣàpèjúwe ìṣe tí ó ń bá a lọ. Ìtumọ̀ yìí kò fi ìbáṣepọ̀ ọgbọ́n kan tí ọ̀rọ̀ náà kò sọ ní pàtó kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. ‘Agbéraga asán’ jẹ́ kedere ju àkójọpọ̀ ọ̀rọ̀ tí ó lè dà bí ìtumọ̀ etymology lásán lọ; àmi ẹsẹ̀ [a] pa àṣàyàn lexical míì mọ́.
