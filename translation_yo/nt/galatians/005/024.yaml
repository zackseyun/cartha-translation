id: GAL.5.24
reference: Galatians 5:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ τοῦ ⸀Χριστοῦ τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: yo
  text: Àwọn tí ó jẹ́ ti Mèsáyà[a] ti kan ara mọ́ àgbélébùú, pẹ̀lú ìfẹ́kúfẹ̀ẹ́ rẹ̀ àti ìfẹ́kòkò rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ó jẹ́ ti Kristi.”
    reason: alternative_reading
  - marker: b
    text: “Ara” níhìn-ín ń tọ́ka sí ìwà ẹ̀dá ènìyàn tí ó ṣubú, tí ó sì dojú kọ Ẹ̀mí; àwọn ìtumọ̀ kan pè é ní “ìwà ẹ̀ṣẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... τοῦ Χριστοῦ
  choice: àwọn tí ó jẹ́ ti Mèsáyà
  rationale: Ìsọ̀rọ̀ yìí tọ́ka sí àwọn ènìyàn tí wọ́n jẹ́ tirẹ̀ tàbí tí wọ́n jẹ́ ọmọ-ẹ̀yìn rẹ̀. ‘Àwọn tí ó jẹ́ ti’ jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbáṣepọ̀ àti jíjẹ́ tirẹ̀ hàn.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyàtọ̀ pẹ̀lẹ́ hàn láàárín àwọn iṣẹ́ ara tí a mẹ́nu kàn ṣáájú àti àwọn tí wọ́n jẹ́ ti Mèsáyà; ‘Ṣùgbọ́n’ mú ìyàtọ̀ náà jáde láìfi agbára tí ó pọ̀ jù kún un.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí Ọlọ́run yàn tí ó sì fi òróró yàn. ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́; ‘Kristi’ wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn tí ó wọ́pọ̀.
- source_word: σάρκα
  choice: ara
  rationale: ‘Ara’ pa àwòrán àti ọ̀rọ̀ ẹ̀kọ́ Paulu mọ́. Níhìn-ín, kì í ṣe ẹran ara lásán, bí kò ṣe ìwà ẹ̀dá ènìyàn tí ó ṣubú tí ó sì dojú kọ Ẹ̀mí; àlàyé náà wà ní ìsàlẹ̀ láìyanju gbogbo ìfarapamọ́ ọ̀rọ̀ náà nínú ẹsẹ̀.
- source_word: ἐσταύρωσαν
  choice: ti kan ... mọ́ àgbélébùú
  rationale: Ọ̀rọ̀ Gíríìkì náà sọ ní pàtó nípa kíkàn mọ́ àgbélébùú, kì í ṣe pípa lásán. ‘Ti kan’ fi ìṣe tí a ti ṣe tẹ́lẹ̀ tí ipa rẹ̀ sì ń bá a lọ hàn ní Yorùbá.
- source_word: σὺν
  choice: pẹ̀lú
  rationale: ‘Pẹ̀lú’ fi hàn pé àwọn ìfẹ́ náà bá ara lọ sínú kíkàn mọ́ àgbélébùú.
- source_word: παθήμασιν
  choice: àwọn ìfẹ́kúfẹ̀ẹ́
  rationale: Nínú àyíká ìwà búburú yìí, πάθημα tọ́ka sí ìmọ̀lára tàbí ìfẹ́ líle tí ara ń ru, kì í ṣe ìjìyà. ‘Ìfẹ́kúfẹ̀ẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún irú ìfẹ́ aláìtọ́ bẹ́ẹ̀.
- source_word: ἐπιθυμίαις
  choice: àwọn ìfẹ́-ọkàn
  rationale: ἐπιθυμία lè túmọ̀ sí ìfẹ́ tàbí ìrònú líle, tí ó sábà máa ń jẹ́ aláìtọ́ nínú ọ̀rọ̀ Paulu. ‘Ìfẹ́-ọkàn’ pa ìtumọ̀ rẹ̀ gbòòrò mọ́ láìdín in kù sí ìfẹ́ ìbálòpọ̀ nìkan.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín, ọ̀rọ̀ náà lè ṣiṣẹ́ gẹ́gẹ́ bí oyè Jesu ẹni tí Ọlọ́run fi òróró yàn, nítorí náà ‘Mèsáyà’ ni a lò nínú ẹsẹ̀. ‘Kristi’ jẹ́ ìtumọ̀ ìbílẹ̀ tí ó ṣeé ṣe, a sì pa á mọ́ nínú àlàyé.
- issue: Bí a ṣe túmọ̀ σάρξ nínú ìyàtọ̀ tó wà láàárín ara àti Ẹ̀mí
  choice: ara
  alternative: ìwà ẹ̀ṣẹ̀
  rationale: ‘Ara’ pa ọ̀rọ̀ àpẹẹrẹ Paulu àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ rẹ̀ mọ́, dípò kí a sọ ìtumọ̀ àlàyé kan di ohun tí ẹsẹ̀ náà sọ ní tààrà. Àlàyé ìsàlẹ̀ ṣàlàyé pé ọ̀rọ̀ náà tọ́ka sí ìwà ẹ̀dá ènìyàn tí ó ṣubú.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tí ó lọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà pa àwòrán kíkàn mọ́ àgbélébùú àti ìyàtọ̀ ẹ̀kọ́ tó wà láàárín ‘ara’ àti Ẹ̀mí mọ́.
