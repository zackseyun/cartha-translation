  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì Gíríìkì náà dáadáa: àwọn tí ó jẹ́ ti Mèsáyà, ìṣe ìpinnu ti kíkàn ara mọ́ àgbélébùú, àti ìfẹ́ méjì tí ó bá a lọ. Síbẹ̀, ‘Ṣùgbọ́n’ lè fún δέ ní agbára ìtakora tó pọ̀ díẹ̀ ju àmì ìlọsíwájú pẹ̀lẹ́ tí ó ní lọ. Pẹ̀lú èyí, ipò ‘rẹ̀’ ní ìgbẹ̀yìn gbólóhùn àkọ́kọ́ lè dà bí ẹni pé ó ń tọ́ka sí ìfẹ́-ọkàn tó súnmọ́ ọ́, dípò ara.'
  naturalness: ‘Àwọn tí ó jẹ́ ti Mèsáyà’ àti ‘ti kan ara mọ́ àgbélébùú’ jẹ́ Yorùbá àdánidá tó sì yẹ fún ìforúkọsílẹ̀ ẹsẹ̀ mímọ́. ‘Ìfẹ́kúfẹ̀ẹ́ àti ìfẹ́kòkò’ jẹ́ ìsopọ̀ ọ̀rọ̀ tó mọ́gbọ́n dání láti yà ‘passions’ sí ‘desires,’ ó sì bá ìlò Yorùbá Bíbélì mu. Gbigbé ‘rẹ̀’ lé ọ̀kọ̀ọ̀kan àwọn ọ̀rọ̀ náà yọ àìdánilójú kúrò.
