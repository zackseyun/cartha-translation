  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: ìpè sí òmìnira, ìkìlọ̀ nípa σάρξ, àti ìránṣẹ́ onífẹ̀ẹ́ sí ara ẹni. Síbẹ̀, ó yí ipa àwọn asopọ̀ Gíríìkì méjì padà: μόνον ni ó yẹ kí ó ṣàfihàn ìdíwọ̀n náà (“kìkì”), nígbà tí ἀλλά ni ó yẹ kí ó jẹ́ ìyàtọ̀ (“ṣùgbọ́n”).'
  naturalness: “Ẹ máa fi ìfẹ́ sin ara yín” jẹ́ Yorùbá boṣewa, ó sì rọrùn ju “sin ara yín lẹ́nu iṣẹ́” lọ. Ìparí “dípò bẹ́ẹ̀” nínú ìtumọ̀ àkọ́kọ́ tún sọ ìyàtọ̀ náà ní ọ̀nà tó gbooro ju ọ̀rọ̀ Gíríìkì lọ.
