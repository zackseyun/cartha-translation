reference: Galatians 5:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: yo
  text: Nítorí a pè yín sí òmìnira, ẹ̀yin ará[a]; kìkì, ẹ má ṣe lo òmìnira yín gẹ́gẹ́ bí àǹfààní fún ẹran ara[b][c], ṣùgbọ́n ẹ máa fi ìfẹ́ sin ara yín[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní fọ́ọ̀mù, ṣùgbọ́n nínú lẹ́tà yìí ó ń tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́, títí kan àwọn obìnrin.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí “gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tàbí ibi ìbẹ̀rẹ̀ fún ẹran ara”; ìyẹn ni, gẹ́gẹ́ bí àǹfààní fún ìfẹ́kúfẹ̀ẹ́ ẹlẹ́ṣẹ̀ tó dojú kọ Ọlọ́run.
    reason: lexical_alternative
  - marker: c
    text: “Ẹran ara” níbí kò túmọ̀ sí ara ti ẹ̀dá nìkan; ó tún ń tọ́ka sí ìfẹ́kúfẹ̀ẹ́ àti ìtẹ̀sí ènìyàn tó ti ṣubú sínú ẹ̀ṣẹ̀. Àwọn ìtumọ̀ kan ń pè é ní “ìwà ẹ̀ṣẹ̀.”
    reason: alternative_reading
  - marker: d
    text: Ọ̀rọ̀-ìṣe tí a túmọ̀ sí “sin” ní ìbátan pẹ̀lú ọ̀rọ̀ Gíríìkì fún “ẹrú”; ó ní ìtumọ̀ fífi ara ẹni fún iṣẹ́ àwọn ẹlòmíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni ó hàn gbangba nínú Gíríìkì fún ìtẹnumọ́; àpẹẹrẹ ọ̀pọ̀ ‘yín’ jẹ́ èyí tí Yorùbá ìgbàlódé ń lò lọ́nà àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ àríyànjiyàn tó ṣáájú gẹ́gẹ́ bí àlàyé tàbí ìdí.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: sí òmìnira
  rationale: Ó fi òmìnira hàn gẹ́gẹ́ bí ipò tàbí ète tí a pè wọ́n sí, láìfi ipa mú ìtumọ̀ kan ṣoṣo láàárín ète àti ìpìlẹ̀.
- source_word: ἐκλήθητε
  choice: a pè yín
  rationale: Ìṣe aláìlórúkọ olùṣe nínú Gíríìkì ni; Yorùbá sábà máa ń lo ‘a’ láti pa olùṣe mọ́, nígbà tí àyíká ọ̀rọ̀ ń tọ́ka sí ìpè Ọlọ́run.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: ‘Ará’ jẹ́ ọ̀rọ̀ ìkíni àwùjọ tó bójú mu ní Yorùbá, ó sì lè tọ́ka sí gbogbo ìjọ láìsọ ìbálòpọ̀ gírámà Gíríìkì di ẹ̀kọ́ pàtó.
- source_word: μόνον μὴ...εἰς ἀφορμὴν
  choice: Ṣùgbọ́n ẹ má ṣe lo ... gẹ́gẹ́ bí àǹfààní
  rationale: ‘Ṣùgbọ́n’ mú ìkìlọ̀ tó ń dín òmìnira náà mọ́ hàn; ‘àǹfààní’ mú èrò ibi ìbẹ̀rẹ̀ tàbí àǹfààní fún ìṣe jáde ní Yorùbá àdánidá.
- source_word: σάρξ
  choice: ẹran ara
  rationale: A pa àwòrán ọ̀rọ̀ Pọ́ọ̀lù mọ́ dípò píparọ̀ rẹ̀ sí ‘ìwà ẹ̀ṣẹ̀’; àlàyé ìtumọ̀ ìwà àti ìfẹ́kúfẹ̀ẹ́ wà nínú àlàyé ìsàlẹ̀.
- source_word: διὰ τῆς ἀγάπης
  choice: fi ìfẹ́
  rationale: Ìṣètò ‘fi ...’ sọ iṣẹ́-irinṣẹ́ διά pẹ̀lú genitive jáde lọ́nà Yorùbá tó ṣe déédéé.
- source_word: δουλεύετε
  choice: sin ... lẹ́nu iṣẹ́
  rationale: Ó jẹ́ Yorùbá tó ṣe kedere fún iṣẹ́ ìránṣẹ́, nígbà tí àlàyé ìsàlẹ̀ ń pa ìró ẹrú tó wà nínú gbòǹgbò ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀλλήλοις
  choice: ara yín
  rationale: Ọ̀nà àdánidá ni Yorùbá fi ń sọ ìṣe tí àwọn ọmọ àwùjọ ń ṣe fún ara wọn.
theological_decisions:
- issue: Ìtumọ̀ ἀδελφοί nínú ìkíni sí àwùjọ tí ọkùnrin àti obìnrin wà
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ akọ ọ̀pọ̀, ṣùgbọ́n nínú lẹ́tà yìí ó ń bá gbogbo àwùjọ onígbàgbọ́ sọ̀rọ̀. ‘Ẹ̀yin ará’ jẹ́ ìkíni Yorùbá tó ní iyì, tó sì yẹ fún àwùjọ náà; àlàyé ìsàlẹ̀ sọ ìlò Gíríìkì di mímọ̀.
- issue: Ìtumọ̀ σάρξ nínú àyíká ìwà rere àti ẹ̀ṣẹ̀ ti Pọ́ọ̀lù
  choice: ẹran ara
  alternative: ìwà ẹ̀ṣẹ̀
  rationale: A pa ọ̀rọ̀ àwòrán àti ìdọ̀tí ẹ̀kọ́ inú rẹ̀ mọ́; a kò dín in kù sí ara ti ẹ̀dá nìkan, bẹ́ẹ̀ ni a kò túmọ̀ rẹ̀ sí èrò ẹ̀kọ́ kan ṣoṣo.
- issue: Ìtumọ̀ δουλεύετε pẹ̀lú ohun ìṣe alápàdé
  choice: ẹ máa ... sin ara yín lẹ́nu iṣẹ́
  alternative: ẹ máa ṣe ẹrú fún ara yín
  rationale: Gbólóhùn àkọ́kọ́ jẹ́ Yorùbá tó ṣe déédéé, kò sì mú kí òǹkàwé ronú pé Pọ́ọ̀lù ń fọwọ́ sí ìfiniṣẹrú; síbẹ̀, àlàyé ìsàlẹ̀ pa agbára àwòrán ẹrú mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ìjọsìn tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àṣẹ ọ̀pọ̀ ‘ẹ’ àti ‘yín’ láti fi àwùjọ tí Pọ́ọ̀lù ń bá sọ̀rọ̀ hàn.
