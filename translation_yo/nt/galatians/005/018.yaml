  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: yo
  text: Ṣùgbọ́n bí Ẹ̀mí bá ń darí yín[a], ẹ kò wà lábẹ́ òfin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “bí Ẹ̀mí bá ń ṣamọ̀nà yín.”
    reason: lexical_alternative
  - marker: b
    text: “Lábẹ́ òfin” túmọ̀ sí wíwà lábẹ́ àṣẹ tàbí ìṣàkóso òfin; fi Gálátíà 5:23 wé e.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ
  choice: bí ... bá
  rationale: Ọ̀nà àdáyébá Yorùbá ni èyí láti fi gbé gbólóhùn oníṣ شرط kalẹ̀, ó sì bá ìtumọ̀ ‘bí’ mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ hàn láàárín ìdarí Ẹ̀mí àti ìfẹ́kúfẹ̀ẹ́ ara nínú àyíká ọ̀rọ̀ náà.
- source_word: πνεύματι
  choice: Ẹ̀mí
  rationale: Nínú Gálátíà 5:16–25, ọ̀rọ̀ náà ń tọ́ka sí Ẹ̀mí Ọlọ́run, ẹni tí a fi wé ara ní òdìkejì. Lílò lẹ́tà ńlá ń jẹ́ kí ìtọ́kasí yìí ṣe kedere láìfi àlàyé míì kún ọ̀rọ̀ náà.
- source_word: ἄγεσθε
  choice: ń darí yín
  rationale: Ọ̀rọ̀-ìṣe yìí jẹ́ ti ìṣe tí ẹni mìíràn ń ṣe sí olùgbà, ó sì wà ní ìsinsìnyí. ‘ń darí yín’ jẹ́ Yorùbá àdáyébá tí ó pa ìtumọ̀ ìdarí tí ń lọ lọ́wọ́ mọ́.
- source_word: οὐκ ἐστὲ
  choice: ẹ kò sí
  rationale: Ìtumọ̀ tààrà àti àdáyébá ni fún gbólóhùn ìsopọ̀ tí a sẹ́.
- source_word: ὑπὸ νόμον
  choice: lábẹ́ òfin
  rationale: Ó pa àwòrán Pọ́ọ̀lù nípa wíwà lábẹ́ àṣẹ tàbí ìṣàkóso òfin mọ́, láìtú u sí ẹ̀kọ́ ìsìn gígùn.
theological_decisions:
- issue: Ohun tí πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Ọlọ́run
  alternative: ẹ̀mí ènìyàn
  rationale: Àyíká Gálátíà 5 fi Ẹ̀mí àti ara wé ara wọn, ó sì ṣàpèjúwe Ẹ̀mí gẹ́gẹ́ bí olùdarí àwọn onígbàgbọ́. ‘Ẹ̀mí’ pa ìtọ́kasí yẹn mọ́ láìfi ohun tí ẹsẹ̀ náà kò sọ kún un.
- issue: Ìtumọ̀ ὑπὸ νόμον
  choice: kò sí lábẹ́ òfin, ìyẹn lábẹ́ àṣẹ tàbí ìṣàkóso rẹ̀
  alternative: kò sí lábẹ́ òfin ní ìtumọ̀ gbogbogbòò
  rationale: Nínú Gálátíà, gbólóhùn náà sábà ń tọ́ka sí wíwà lábẹ́ ìṣàkóso Òfin Mósè. Ọ̀rọ̀ pàtàkì náà wà nínú ìtumọ̀, nígbà tí àlàyé kúkúrú wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn. A lo ‘ẹ’ àti ‘yín’ láti pa ọ̀pọ̀ ènìyàn tí ọ̀rọ̀ Gíríìkì ń bá sọ mọ́. Àmì ohùn wà níbi tí ó yẹ.
