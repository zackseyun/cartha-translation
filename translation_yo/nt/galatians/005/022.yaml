id: GAL.5.22
reference: Galatians 5:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: yo
  text: Ṣùgbọ́n èso ti Ẹ̀mí ni ìfẹ́, ayọ̀, àlàáfíà, sùúrù, inú rere, ìwà rere, ìgbàgbọ́[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìwà ìṣòtítọ́” tàbí “jíjẹ́ olóòtọ́.” Ọ̀rọ̀ Gíríìkì pistis lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé, tàbí ìwà ìṣòtítọ́; nínú àkójọ àwọn ìwà rere yìí, ó lè ṣàpèjúwe ẹni tí ó jẹ́ olóòtọ́, tí a sì lè gbára lé.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín èso Ẹ̀mí àti “àwọn iṣẹ́ ti ara” tí a ṣẹ̀ṣẹ̀ sọ ní ẹsẹ 19–21.
- source_word: καρπὸς
  choice: èso
  rationale: Ó pa àkàwé Pọ́ọ̀lù mọ́, ó sì jẹ́ ẹyọ kan gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì, tí ó ṣàfihàn àwọn ìwà wọ̀nyí gẹ́gẹ́ bí àbájáde kan ṣoṣo.
- source_word: τοῦ πνεύματός
  choice: ti Ẹ̀mí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, Ẹ̀mí Mímọ́ ni a ń tọ́ka sí; lílo lẹ́tà ńlá fún “Ẹ̀mí” mú èyí hàn láìfi ọ̀rọ̀ tí kò sí nínú Gíríìkì kún un.
- source_word: ἀγάπη
  choice: ìfẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ jù lọ fún ìfẹ́ ní àyíká yìí.
- source_word: χαρά
  choice: ayọ̀
  rationale: Ó jẹ́ ìtumọ̀ àdánidá, kúkúrú, tí ó sì bá àkójọ ìwà rere mu.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Ó lè gba ìtumọ̀ ìbágbépọ̀ pẹ̀lú ẹlòmíràn àti ìfọ̀kànbalẹ̀ láìdín ọ̀rọ̀ náà kù sí ọ̀kan nínú wọn.
- source_word: μακροθυμία
  choice: sùúrù
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá òde òní tí ó yé gbogbo ènìyàn fún fífaradà pẹ́ láìbínú.
- source_word: χρηστότης
  choice: inú rere
  rationale: Ó ṣàfihàn ìwà onínúure àti ṣíṣe rere sí ẹlòmíràn ní èdè Yorùbá àdánidá.
- source_word: ἀγαθωσύνη
  choice: ìwà rere
  rationale: Ó mú ìtumọ̀ gbooro ti jíjẹ́ ẹni rere ní ti ìwà àti ìṣe, ó sì yà á sí ọ̀tọ̀ kedere sí “inú rere.”
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ fún πίστις, ṣùgbọ́n “ìṣòtítọ́” tún ṣeé gbà nínú àkójọ àwọn ìwà rere; àlàyé ìsàlẹ̀ pa àṣàyàn náà mọ́.
theological_decisions:
- issue: Ẹni tí πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn
  rationale: Ìtakora tí ó wà láàárín Ẹ̀mí àti ara nínú Gálátíà 5, pẹ̀lú àríyànjiyàn Pọ́ọ̀lù lápapọ̀, fi hàn pé iṣẹ́ Ẹ̀mí Mímọ́ nínú àwọn onígbàgbọ́ ni ọ̀rọ̀ náà ń tọ́ka sí.
- issue: Ìtumọ̀ πίστις nínú àkójọ ìwà rere
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé, tàbí ìṣòtítọ́. A fi ìgbàgbọ́ sínú ọ̀rọ̀ pàtàkì, a sì pa ìtumọ̀ kejì tí ó ṣeé gbà mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pa “èso” mọ́ gẹ́gẹ́ bí ẹyọ kan, a sì fi àmì ẹsẹ̀ náà sí “ìgbàgbọ́,” ibi tí àlàyé rẹ̀ jẹ́ ti gidi.
