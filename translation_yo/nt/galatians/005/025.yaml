id: GAL.5.25
reference: Galatians 5:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: yo
  text: Bí a bá ń gbé nípa Ẹ̀mí[a], jẹ́ kí a náà máa rìn ní ìbámu pẹ̀lú Ẹ̀mí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí a bá ń gbé nínú Ẹ̀mí, jẹ́ kí a náà máa bá Ẹ̀mí rìn ní ìgbésẹ̀ kan náà.”
    reason: Àmì ọ̀rọ̀ dative πνεύματι lè túmọ̀ sí “nípa Ẹ̀mí” tàbí “nínú Ẹ̀mí”; στοιχῶμεν sì lè fi ìtumọ̀ pàtó ti rírìn ní ìlà, tàbí bíbá ẹnìkan rìn ní ìgbésẹ̀ kan náà, hàn.
lexical_decisions:
- source_word: εἰ
  choice: Bí ... bá
  rationale: Èyí pa ìrísí gbólóhùn àídájú Gíríìkì mọ́, láì yí i sí ‘Níwọ̀n bí’ tí yóò túmọ̀ rẹ̀ ju bí ọ̀rọ̀ ìpilẹ̀ ṣe sọ lọ.
- source_word: ζῶμεν
  choice: a bá ń gbé
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìwàláàyè tí ó ń bá a lọ; ní àyíká ẹsẹ̀ náà, ó ń tọ́ka sí ìyè tí ó wá nípa Ẹ̀mí.
- source_word: πνεύματι
  choice: nípa Ẹ̀mí
  rationale: ‘Nípa’ fi Ẹ̀mí hàn gẹ́gẹ́ bí orísun tàbí ọ̀nà ìyè. Àyíká Gálátíà 5 fi hàn pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí, nítorí náà a lo ‘Ẹ̀mí’ pẹ̀lú lẹ́tà ńlá.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ so ìgbé ayé nípa Ẹ̀mí pọ̀ mọ́ ìwà tí ó yẹ kí ó bá a mu, ó sì mú agbára ‘pẹ̀lú’ tàbí ‘bákan náà’ inú ọ̀rọ̀ Gíríìkì jáde lọ́nà Yorùbá àdánidá.
- source_word: στοιχῶμεν
  choice: ẹ jẹ́ kí a ... máa bá Ẹ̀mí rìn ní ìbámu
  rationale: Fáàbù náà jẹ́ ọ̀rọ̀ ìṣírí tí ó túmọ̀ sí láti máa rìn ní ìlà tàbí ní ìbámu. Ìtumọ̀ yìí pa àwòrán rírìn mọ́, ó sì mú ìtumọ̀ pàtó ti títẹ̀lé ìlà jáde.
theological_decisions:
- issue: Ẹni tí πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn
  rationale: Ìtakora láàárín ara àti Ẹ̀mí ní Gálátíà 5 mú kí Ẹ̀mí Mímọ́ jẹ́ ìtumọ̀ tí ó ṣeé gbà jù; lílo lẹ́tà ńlá fi ìdájọ́ yìí hàn láì fi ẹ̀kọ́ ẹ̀sìn mìíràn kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò. ‘Ẹ jẹ́ kí a’ jẹ́ ìṣírí àpapọ̀ tó bá hortatory subjunctive mu; ‘máa’ fi ìṣe tí ó ń bá a lọ hàn. Àmì ohùn kún níbi tí ó bá yẹ.
