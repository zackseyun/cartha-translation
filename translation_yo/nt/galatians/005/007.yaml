  source_fidelity: Ìtumọ̀ náà pa àwòrán sísáré, ìbéèrè nípa ẹni tí ó dá wọn dúró, àti ìtumọ̀ àkọ́kọ́ ‘ṣègbọràn sí òtítọ́’ mọ́. Síbẹ̀, ‘láti máa ṣègbọràn’ lè fi ìtumọ̀ ìtẹ̀síwájú/àṣà kún un tí kò yẹ kí a tẹnumọ́ níbí.
  naturalness: ‘Ẹ ń sáré dáadáa tẹ́lẹ̀’ jẹ́ ìsọ̀rọ̀ Yorùbá tó yéni, tí ó sì ń ṣàfihàn ìṣe tí ń lọ ní ìgbà àtijọ́. Ìtúnṣe náà mú gbolóhùn kejì, àti pàápàá àlàyé ìsàlẹ̀, rọrùn, kedere, ó sì dára sí i ní Yorùbá òde òní.
