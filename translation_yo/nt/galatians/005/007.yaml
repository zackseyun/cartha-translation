  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐτρέχετε καλῶς· τίς ὑμᾶς ἐνέκοψεν ⸀τῇ ἀληθείᾳ μὴ πείθεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/007.yaml
  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: yo
  text: Ẹ ń sáré dáadáa tẹ́lẹ̀. Ta ni ó dí yín lọ́wọ́ láti ṣègbọràn sí òtítọ́?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ta ni ó dí yín lọ́wọ́ láti gba òtítọ́ gbọ́?” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí “ṣègbọràn” tàbí “jẹ́ ẹni tí a ti dá lójú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: Ẹ ń sáré ... tẹ́lẹ̀
  rationale: Ó pa àwòrán eré ìje mọ́, ó sì fi hàn pé ohun tí wọ́n ń ṣe lọ́wọ́ ní àkókò kan sẹ́yìn ni; a kò fi ‘nínú eré ìje’ kún un nítorí kò sí ní pàtó nínú Gíríìkì.
- source_word: καλῶς
  choice: dáadáa
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé bí wọ́n ṣe ń sáré tàbí tẹ̀ síwájú tọ́.
- source_word: τίς
  choice: Ta ni
  rationale: Ọ̀rọ̀ ìbéèrè náà ń béèrè ẹni tí ó fa ìdènà náà.
- source_word: ἐνέκοψεν
  choice: ó dí yín lọ́wọ́
  rationale: Ó sọ ìdènà kedere ní Yorùbá, ó sì bá àwòrán ẹni tí a dá dúró nínú sísáré mu láìfi ohun tí kò sí nínú orísun kún un.
- source_word: τῇ ἀληθείᾳ
  choice: sí òtítọ́
  rationale: A so ó mọ́ ṣíṣègbọràn, gẹ́gẹ́ bí ìtumọ̀ tí ó ṣeé ṣe jù ní àyíká ọ̀rọ̀ yìí; ‘òtítọ́’ tọ́ka sí òtítọ́ ìhìn rere tí wọ́n ti gbà.
- source_word: μὴ πείθεσθαι
  choice: láti máa ṣègbọràn
  rationale: πείθομαι lè túmọ̀ sí ṣíṣègbọràn ní irú àyíká yìí. ‘Máa ṣègbọràn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn mọ́.
theological_decisions:
- issue: Ìtumọ̀ πείθεσθαι pẹ̀lú ἀληθείᾳ
  choice: ṣègbọràn sí òtítọ́
  alternative: jẹ́ kí òtítọ́ dá yín lójú
  rationale: Àyíká ọ̀rọ̀ náà dá lórí bí àwọn ará Gálátíà ṣe ń fèsì sí ìhìn rere, nítorí náà ‘ṣègbọràn’ pa apá ìṣe mọ́. Síbẹ̀, ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ jíjẹ́ kí ohun kan dá ẹni lójú, a sì pa èyí mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe, èdè òde òní tí ó ní iyì, tí ó sì yé òǹkàwé lásán. A lo ‘ẹ/yín’ fún ọ̀pọ̀ ènìyàn, a sì pa àwòrán sísáré ti Pọ́ọ̀lù mọ́.
