revisions:
- from: Ṣùgbọ́n èmi, ẹ̀yin ará[a], bí mo bá ṣì ń wàásù nípa ìdádọ̀dọ́, èé ṣe tí a fi ṣì ń ṣe inúnibíni sí mi? Bí ó bá rí bẹ́ẹ̀, a ti mú ohun ìkọ̀sẹ̀ àgbélébùú kúrò.[b]
  to: Ṣùgbọ́n èmi, ẹ̀yin ará[a], bí mo bá ṣì ń wàásù ìkọlà, èé ṣe tí wọ́n fi ṣì ń ṣe inúnibíni sí mi? Nígbà náà, ohun ìkọ̀sẹ̀ ti àgbélébùú[b] ti di asán.
  rationale: Àtúnṣe náà lo “ìkọlà” fún περιτομή, ó mú ìbéèrè aláìṣe náà rọrùn síi ní Yorùbá, ó sì tú κατήργηται gẹ́gẹ́ bí ipò ohun tí a ti sọ di asán/aláìṣiṣẹ́. A pa ìtumọ̀ ìṣọ̀kan ‘ohun ìkọ̀sẹ̀’ mọ́, pẹ̀lú àlàyé ìsàlẹ̀ ojú ìwé fún àṣàyàn tó ṣeé ṣe.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:32:09Z'
