id: GAL.5.11
reference: Galatians 5:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: yo
  text: Ṣùgbọ́n èmi, ẹ̀yin ará[a], bí mo bá ṣì ń wàásù ìkọlà, èé ṣe tí wọ́n fi ṣì ń ṣe inúnibíni sí mi? Nígbà náà, ohun ìkọ̀sẹ̀ ti àgbélébùú[b] ti di asán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “ẹ̀yin arákùnrin,” ṣùgbọ́n ó lè jẹ́ ọ̀rọ̀ ìpè sí àwùjọ tí àwọn ọkùnrin àti obìnrin wà nínú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ohun ìdènà ti àgbélébùú.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: Ọ̀rọ̀ ìpè yìí jẹ́ ọ̀nà Yorùbá àdánidá láti bá àwọn onígbàgbọ́ ẹlẹgbẹ́ sọ̀rọ̀; ó lè tọ́ka sí àwùjọ tí ọkùnrin àti obìnrin wà nínú rẹ̀, láìfi ìtumọ̀ ìbátan ẹ̀mí sí i ju bí ọ̀rọ̀ Gíríìkì ṣe béèrè lọ.
- source_word: περιτομήν
  choice: ìdádọ̀dọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tààrà fún ìṣe ìkọlà ẹ̀sìn tí Pọ́ọ̀lù ń tọ́ka sí; nínú Gálátíà, ó tún jẹ́ àmì ìtẹ̀lé Òfin.
- source_word: ἔτι
  choice: ṣì
  rationale: A pa àtúnlò ọ̀rọ̀ náà mọ́ ní àwọn gbólóhùn méjèèjì, gẹ́gẹ́ bí ó ti rí nínú orísun, láti fi ìjiyàn Pọ́ọ̀lù hàn.
- source_word: κηρύσσω
  choice: ń wàásù nípa
  rationale: Ó sọ ìkéde ní gbangba tí ó ń bá a lọ; ‘wàásù nípa’ jẹ́ ọ̀nà Yorùbá àdánidá ní àyíká yìí.
- source_word: διώκομαι
  choice: a ... ń ṣe inúnibíni sí mi
  rationale: Ó pa ohùn àìṣe ti Gíríìkì mọ́, ó sì fi ìtẹ̀sí ọ̀tá àti ìpọ́njú ẹ̀sìn hàn kedere.
- source_word: ἄρα
  choice: Bí ó bá rí bẹ́ẹ̀
  rationale: Ó mú àbájáde ọgbọ́n inú gbólóhùn àròsọ tó ṣáájú jáde ní Yorùbá tí ó ṣe kedere.
- source_word: κατήργηται
  choice: a ti mú ... kúrò
  rationale: Àkókò pípé aláìṣe tọ́ka sí ohun tí a ti sọ di aláìṣiṣẹ́ mọ́ pẹ̀lú ipò àbájáde rẹ̀; gbólóhùn yìí dá ìtumọ̀ yẹn sí.
- source_word: σκάνδαλον
  choice: ohun ìkọ̀sẹ̀
  rationale: Ó pa àwòrán ohun tí ń mú ènìyàn kọsẹ̀ mọ́, ó sì tún lè túmọ̀ sí ohun tí ń múni bínú tàbí kọ ohun kan sílẹ̀.
- source_word: σταυροῦ
  choice: àgbélébùú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ sí rere fún σταυρός nínú lílo ti Pọ́ọ̀lù.
theological_decisions:
- issue: Bí a ṣe máa tú ἀδελφοί nínú ọ̀rọ̀ ìkíni sí àwùjọ adalu
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: ‘Ẹ̀yin ará’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè gba gbogbo àwùjọ mọ́ra, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì ní ìrísí akọ; àlàyé ìsàlẹ̀ ojú ìwé ń jẹ́ kí èyí ṣe kedere.
- issue: Ìtumọ̀ σκάνδαλον τοῦ σταυροῦ
  choice: ohun ìkọ̀sẹ̀ àgbélébùú
  alternative: ohun ìbínú àgbélébùú
  rationale: ‘Ohun ìkọ̀sẹ̀’ pa àwòrán Gíríìkì àti àìdánilójú rẹ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń fi ìtumọ̀ míì tí ó ṣeé ṣe hàn. A kò yanjú ìnira ẹ̀kọ́ ìgbàgbọ́ náà sí ọ̀nà kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ìgbàlódé ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá àdánidá mu. Ìtòlẹ́sẹẹsẹ ìbéèrè àti àbájáde Pọ́ọ̀lù ni a pa mọ́; ‘ohun ìkọ̀sẹ̀’ dá àwòrán orísun sí ju ọ̀rọ̀ àlàyé tó dín ìtumọ̀ kù lọ.
