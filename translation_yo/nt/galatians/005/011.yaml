  source_fidelity: Ìtumọ̀ náà gba ìṣètò ìbéèrè Pọ́ọ̀lù, àtúnlò ἔτι, àti ohùn àìṣe ti διώκομαι mọ́. Síbẹ̀, “ìdádọ̀dọ́” kì í ṣe ọ̀rọ̀ boṣewa tí ó hàn gbangba jù fún περιτομή nínú àyíká yìí; “ìkọlà” jẹ́ ọ̀rọ̀ Yorùbá tí ó fìdí múlẹ̀. Gbólóhùn ìkẹyìn tún yẹ kí ó sọ abajade ἄρα àti ipò pípé aláìṣe κατήργηται—ohun ìkọ̀sẹ̀ náà ti di aláìṣiṣẹ́/asán—dípò pé a kan ‘mú un kúrò.’
  naturalness: “Èé ṣe tí a fi ...” lè yé ẹni, ṣùgbọ́n “èé ṣe tí wọ́n fi ...” dáa síi gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún ìṣe inúnibíni tí a ń ṣe sí ẹni. “Nígbà náà” jẹ́ ìsopò àbájáde tó rọrùn, ó sì yàgò fún ìdíwọ̀n àfikún nínú “Bí ó bá rí bẹ́ẹ̀.” A tún fi “ti” sí “ohun ìkọ̀sẹ̀ ti àgbélébùú” fún ìbáṣepọ̀ gírámà tó ṣe kedere.
  terminology: A rọ́pò “ìdádọ̀dọ́” pẹ̀lú “ìkọlà,” ọ̀rọ̀ tí ó wọ́pọ̀ fún περιτομή. “Àgbélébùú” àti “ohun ìkọ̀sẹ̀” yẹ, bí ó tilẹ̀ jẹ́ pé a ṣe gbolóhùn náà ní kíkún gẹ́gẹ́ bí “ohun ìkọ̀sẹ̀ ti àgbélébùú.” Àlàyé ìsàlẹ̀ ojú ìwé nípa σκάνδαλον ni a ṣàtúnṣe sí àṣàyàn tí ó sún mọ́ “ìkọ̀sẹ̀”/“ìdènà,” dípò “ohun ìbínú” nìkan.
