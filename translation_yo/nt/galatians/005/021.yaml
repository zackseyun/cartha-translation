id: GAL.5.21
reference: Galatians 5:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: yo
  text: ìlara, ìmutípara, àríyá ìwàkiwà[a], àti àwọn nǹkan tí ó jọ wọ̀nyí. Mo ń kìlọ̀ fún yín nípa àwọn nǹkan wọ̀nyí, gẹ́gẹ́ bí mo ti kìlọ̀ fún yín tẹ́lẹ̀, pé àwọn tí wọ́n ń ṣe irú àwọn nǹkan bẹ́ẹ̀ kì yóò jogún ìjọba Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìwàkiwà.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àríyá aláriwo tí ó kún fún àṣejù, tí ó sì sábà máa ń bá mímu ọtí lọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: ìlara
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ìbínú tàbí ìfẹ́ ohun rere tí ẹlòmíràn ní; “ìlara” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì yẹ fún àkójọ ìwà búburú yìí.
- source_word: μέθαι
  choice: ìmú ọtí àmujù
  rationale: Ó ń sọ nípa mímu ọtí dé ipò àmupara tàbí àṣejù; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá, ó sì dá ìṣe náà mọ̀ ní kedere.
- source_word: κῶμοι
  choice: àríyá aláìníjàánu[a]
  rationale: Ó túmọ̀ sí àríyá oníṣekúṣe àti àṣejù, ní ọ̀pọ̀ ìgbà pẹ̀lú mímu ọtí. Yíyan “aláìníjàánu” kò fi ìtumọ̀ ìbálòpọ̀ tí ọ̀rọ̀ Gíríìkì kò pọndandan ní kún un.
- source_word: τὰ ὅμοια τούτοις
  choice: àwọn nǹkan tí ó jọ wọ̀nyí
  rationale: Ó pa àkójọ náà mọ́ ní ṣíṣí sí àwọn ìwà mìíràn tí ó jọ àwọn tí a dárúkọ.
- source_word: ἃ προλέγω ὑμῖν
  choice: Mo ń kìlọ̀ fún yín nípa wọn
  rationale: Nínú àyíká ìkìlọ̀ nípa ìwà, προλέγω ní agbára “kìlọ̀ ṣáájú,” kì í ṣe sísọ lásán.
- source_word: καθὼς προεῖπον
  choice: gẹ́gẹ́ bí mo ti kìlọ̀ fún yín tẹ́lẹ̀
  rationale: Ó tọ́ka sí ìkìlọ̀ kan tí Pọ́ọ̀lù ti ṣe ṣáájú, ó sì pa ìtẹnumọ́ ìkìlọ̀ tí a tún sọ mọ́.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: àwọn tí wọ́n ń ṣe irú àwọn nǹkan bẹ́ẹ̀
  rationale: Àmì “ń” fi ìṣe tí ń bá a lọ tàbí tí ó di ìwà hàn láì sọ pé ẹ̀ṣẹ̀ ẹyọ kan ṣoṣo ni gbolohun náà ń tọ́ka sí.
- source_word: βασιλείαν θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tí ó ṣe déédéé, tí ó sì pa gbólóhùn ẹ̀kọ́ ìgbàgbọ́ Majẹ̀mú Tuntun mọ́.
- source_word: οὐ κληρονομήσουσιν
  choice: kì yóò jogún
  rationale: Ó pa àwòrán ogún àti agbára ọjọ́ iwájú inú ọ̀rọ̀ Gíríìkì mọ́ ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá ìkìlọ̀ Pọ́ọ̀lù ń tọ́ka sí ẹ̀ṣẹ̀ ẹyọ kan tàbí sí ìṣe tí ó di àṣà ìgbésí ayé
  choice: àwọn tí wọ́n ń ṣe irú àwọn nǹkan bẹ́ẹ̀
  alternative: àwọn tí wọ́n bá ṣe irú àwọn nǹkan bẹ́ẹ̀
  rationale: Participle àsìkò ìsinsìnyí πράσσοντες nínú àkójọ ìwà búburú yìí dára jù láti fi ìṣe tí ó ń bá a lọ tàbí ìwà tí ènìyàn ń hù hàn. Ìtumọ̀ náà pa ìkìlọ̀ mọ́ láì fi ẹ̀kọ́ ìsìn kan kún ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye ni a lò. A lo àkójọ àwọn orúkọ ìwà ní ìbẹ̀rẹ̀, lẹ́yìn náà a tún gbolohun náà ṣe díẹ̀ kí ìkìlọ̀ náà lè ṣàn lọ́nà àdánidá ní Yorùbá. A gbé àmì àlàyé [a] sí “àríyá aláìníjàánu,” nítorí pé àlàyé náà jẹ́ ti κῶμοι, kì í ṣe ti φθόνοι.
