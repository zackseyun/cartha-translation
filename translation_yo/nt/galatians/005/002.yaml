id: GAL.5.2
reference: Galatians 5:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: yo
  text: Ẹ kíyèsí! Èmi, Pọ́ọ̀lù, ni mo wí fún yín pé bí ẹ bá gba ìkọlà[a], Mèsáyà[b] kò ní wúlò fún yín rárá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “bí a bá kọ yín ní ilà” tàbí “bí ẹ bá jẹ́ kí wọ́n kọ yín ní ilà.”
    reason: lexical_alternative
  - marker: b
    text: Ní èdè Gíríìkì, “Kristi”; níhìn-ín a túmọ̀ rẹ̀ sí “Mèsáyà” nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: 'Kíyèsí i:'
  rationale: Ọ̀rọ̀ yìí ń pe àfiyèsí àwọn olùgbọ́ sí ìkìlọ̀ tó lágbára; “Kíyèsí i” jẹ́ èdè Yorùbá àdánidá, ọlọ́lá, tó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἐγὼ Παῦλος
  choice: Èmi Pọ́ọ̀lù ni
  rationale: Fífún arọ́pò-orúkọ “Èmi” àti orúkọ “Pọ́ọ̀lù” ní àfiyèsí pa ìtẹnumọ́ tó wà nínú Gíríìkì mọ́; ẹ̀ka ọ̀rọ̀ “ni mo” mú un dùn bí Yorùbá àdánidá.
- source_word: λέγω ὑμῖν
  choice: mo sọ fún yín
  rationale: Èyí túmọ̀ ìsọ̀rọ̀ tààrà sí ọ̀pọ̀ ènìyàn, ó sì bá ìtumọ̀ λέγω pẹ̀lú dative ὑμῖν mu.
- source_word: ἐὰν περιτέμνησθε
  choice: bí ẹ bá gba ìkọlà
  rationale: “Gba ìkọlà” fi hàn pé wọ́n ń tẹrí ba fún àṣà ìkọlà, ó sì pa ipa passive/subjunctive ti ọ̀rọ̀ Gíríìkì mọ́ láì fi ìtumọ̀ míì kún un.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; “Mèsáyà” mú agbára oyè náà jáde dípò kí ó dà bí orúkọ lásán.
- source_word: οὐδὲν ὠφελήσει
  choice: kò ní ṣe yín ní àǹfààní kankan
  rationale: Ọ̀rọ̀ yìí sọ àìsí àǹfààní pátápátá ní ọjọ́ iwájú; “kankan” pa ìtẹnumọ́ οὐδέν mọ́ ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Oyẹ Mèsáyà ṣì ṣe pàtàkì nínú ìkìlọ̀ yìí nípa ìkọlà àti ohun tí Mèsáyà lè ṣe fún wọn; yíyan “Mèsáyà” kò sọ ọ́ di orúkọ lásán.
- issue: Ìwọ̀n ìkìlọ̀ Pọ́ọ̀lù nípa ìkọlà
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ìkìlọ̀ sí àwọn tó ń gba ìkọlà nínú àríyànjiyàn lẹ́tà yìí.
  alternative: Kí a túmọ̀ ọ́ sí ìdálẹ́bi gbogbo ìkọlà, yálà fún ìlera tàbí fún ẹ̀yà.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò ṣàlàyé gbogbo ipò tí a ti lè ṣe ìkọlà. Nítorí náà, ìtumọ̀ náà kò gbòòrò ìkìlọ̀ Pọ́ọ̀lù kọjá ohun tó sọ tààrà, ó sì fi ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ inú àyíká lẹ́tà náà sílẹ̀ láì fi ìpinnu ẹ̀ya kan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tó sì ṣe kedere fún òǹkàwé òde òní. “Kíyèsí i” àti “Èmi Pọ́ọ̀lù ni mo sọ fún yín” pa ìtẹnumọ́ àti ìkìlọ̀ Pọ́ọ̀lù mọ́, nígbà tí “àǹfààní kankan” sọ àìsí èrè pátápátá ní ọ̀nà àdánidá.
