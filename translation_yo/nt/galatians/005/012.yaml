  text: ὄφελον καὶ ἀποκόψονται οἱ ἀναστατοῦντες ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/012.yaml
  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: yo
  text: Ìbá ṣe pé àwọn tí ń dá yín rú ìbá tilẹ̀ gé ara wọn lábùkù![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gígúnlẹ̀, “kí wọ́n gé ara wọn kúrò.” Nínú àyíká yìí, ó ṣeé ṣe kí Paulu túmọ̀ sí kí wọ́n kọjá ìkọlà lọ sí gígé ara wọn lábùkù tàbí sísọ ara wọn di àgàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí ń yọ yín lẹ́nu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: Ìbá ṣe pé
  rationale: Ọ̀rọ̀ yìí fi ìfẹ́-ọkàn líle hàn; “Ìbá ṣe pé” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ irú ìfẹ́ bẹ́ẹ̀.
- source_word: καὶ
  choice: tilẹ̀
  rationale: Níhìn-ín, καί ń mú ọ̀rọ̀ náà le sí i, kì í ṣe pé ó kàn ń so ohun méjì pọ̀; “tilẹ̀” fi ìgbésẹ̀ tí ó kọjá ìkọlà hàn.
- source_word: ἀποκόψονται
  choice: gé ara wọn lábùkù
  rationale: Ní àyíká àríyànjiyàn nípa ìkọlà, ọ̀rọ̀ náà ní ìtumọ̀ gígé ara ẹni ní ọ̀nà tí yóò sọ ara di aláìpé, ó sì lè tọ́ka sí sísọ ara ẹni di àgàn. Yíyan ọ̀rọ̀ yìí pa agbára àwítúnwí Paulu mọ́ láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: οἱ ἀναστατοῦντες
  choice: àwọn tí ń dá ... rú
  rationale: Ó ṣàpèjúwe àwọn olùdàrúdàpọ̀ tí ń fa ìdàrúdàpọ̀ láàárín àwọn onígbàgbọ́; gbolohun yìí jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere.
- source_word: ὑμᾶς
  choice: yín
  rationale: Arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni, tí ó ń tọ́ka sí àwọn ará Gálátíà lápapọ̀.
theological_decisions:
- issue: Ìtumọ̀ ìfẹ́-ọkàn líle Paulu ní ìbámu pẹ̀lú ìkọlà
  choice: Paulu ń lo àwítúnwí líle láti sọ pé kí àwọn tó ń gbé ìkọlà lárugẹ tilẹ̀ lọ jìnnà sí i, kí wọn gé ara wọn lábùkù.
  alternative: Ó lè túmọ̀ sí pé kí wọn gé ara wọn kúrò nínú àwùjọ àwọn onígbàgbọ́.
  rationale: Àyíká ẹsẹ̀ náà dá lórí ìkọlà, nítorí náà eré-ọ̀rọ̀ nípa gígé ara ni ìtumọ̀ tí ó bá àyíká mu jù. Síbẹ̀, àlàyé ìsàlẹ̀ fi ìtumọ̀ gígé ara ẹni kúrò sílẹ̀ gẹ́gẹ́ bí àṣàyàn gígúnlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. “Gé ara wọn lábùkù” pa líle ọ̀rọ̀ Paulu mọ́, ó sì yẹra fún sísọ ìṣe náà ní ọ̀nà ìṣègùn tó dín ìtumọ̀ rẹ̀ mọ́.
