base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹ bá ń bu ara yín jẹ, tí ẹ sì ń jẹ ara yín run, ẹ ṣọ́ra kí ara yín má bàa jẹ yín tán.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ kíyè sí i, kí ẹ má bàa parun nípasẹ̀ ara yín.”
    reason: Àṣàyàn ìtumọ̀ tí ó sọ ìparun tó ń ṣẹlẹ̀ nípasẹ̀ ara wọn ní ọ̀nà míràn.
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ṣùgbọ́n bí
  rationale: “Bí” fi gbólóhùn oní条件 hàn, “ṣùgbọ́n” sì pa ìyípadà onírẹ̀lẹ̀ láti inú ìṣírí tó ṣáájú mọ́.
- source_word: ἀλλήλους
  choice: ara yín
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìṣe tí àwọn ènìyàn ń ṣe sí ara wọn.
- source_word: δάκνετε
  choice: ń bu ... jẹ
  rationale: Ó pa àwòrán gidi ti jíjẹni mọ́, àmì “ń” sì lè fi ìṣe tí ń lọ lọ́wọ́ tàbí tí ó ti di àṣà hàn.
- source_word: κατεσθίετε
  choice: ń jẹ ... run
  rationale: “Jẹ run” lágbára ju jíjẹ lásán lọ, ó sì pa àwòrán ìwà ipá àti ìparun mọ́.
- source_word: βλέπετε
  choice: ẹ ṣọ́ra
  rationale: Gẹ́gẹ́ bí àṣẹ, ó jẹ́ ìkìlọ̀ kánjúkánjú tó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: μὴ
  choice: kí ẹ má bàa
  rationale: Ìkọ̀lé yìí sọ ìkìlọ̀ nípa ohun búburú tó ṣeé ṣe kí ó ṣẹlẹ̀ ní Yorùbá àdánidá.
- source_word: ὑπ’ ἀλλήλων
  choice: ara yín
  rationale: A fi ìṣe alápadà ṣe gẹ́gẹ́ bí Yorùbá ṣe sábà ń ṣe; ó ṣì fi hàn pé àwọn ọmọ ìjọ náà ni wọ́n ń fa ìparun ara wọn.
- source_word: ἀναλωθῆτε
  choice: jẹ ara yín run tán
  rationale: Ó tẹ̀ síwájú pẹ̀lú àwòrán jíjẹ run, “tán” sì fi ìparun pátápátá tí ọ̀rọ̀ náà ń kilọ̀ nípa rẹ̀ hàn láì sọ ọ́ di ẹ̀kọ́ míràn.
theological_decisions:
- issue: Àwòrán ìwà ipá láàárín àwọn onígbàgbọ́
  choice: Pa àwòrán ẹranko ti “bu jẹ” àti “jẹ run” mọ́ ní tààràtà.
  alternative: Túmọ̀ ọ́ sí “bí ẹ bá ń ṣe ara yín léṣe, tí ẹ sì ń pa ara yín run.”
  rationale: Ọ̀rọ̀ Pọ́ọ̀lù mọ̀ọ́mọ̀ lágbára, ó sì ń kilọ̀ pé ìjà láàárín wọn lè yọrí sí ìparun gbogbo àwùjọ; fífi ọ̀rọ̀ gbogbogbò rọ́pò àwòrán náà yóò dín agbára ìkìlọ̀ kù.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, a sì pa àwòrán líle ti orísun Gíríìkì mọ́.
