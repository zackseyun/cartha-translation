  source_fidelity: 'Ìbẹ̀rẹ̀ ẹsẹ̀ náà túmọ̀ εἰ δὲ, ἀλλήλους δάκνετε, àti κατεσθίετε dáadáa: “Ṣùgbọ́n bí ẹ bá ń bu ara yín jẹ, tí ẹ sì ń jẹ ara yín run.” Ìparí tí a kọ́ tẹlẹ̀, “kí ẹ má bàa jẹ ara yín run tán,” tún ṣe àwọn olùgbọ́ náà ní olùṣe ìṣe. Ní Gíríìkì, ἀναλωθῆτε jẹ́ aláìṣe, pẹ̀lú ὑπ’ ἀλλήλων (“nípasẹ̀ ara yín”). Àtúnṣe náà sọ ara wọn di olùṣe ìṣe, àwọn olùgbọ́ sì di ẹni tí ìṣe náà ń kan, ní ìbámu pẹ̀lú ìkìlọ̀ náà.'
  naturalness: “Bu ara yín jẹ” àti “jẹ ara yín run” jẹ́ èdè Yorùbá boṣewa tó dáa, wọ́n sì pa àwòrán líle náà mọ́. “Kí ara yín má bàa jẹ yín tán” jẹ́ ìkọ̀lé tó ṣeé lóye, ó sì fi ìparun tí jíjẹ-ni mú wá hàn ní kedere. A yọ àmì ìdákẹ́jẹ lẹ́yìn “ṣọ́ra” nítorí ìṣàn gbolohun náà rọrùn ju bẹ́ẹ̀ lọ.
  terminology: A pa ìbáṣepọ̀ àwòrán “bu jẹ / jẹ run / jẹ tán” mọ́, láì rọ́pò ọ́ pẹ̀lú ọ̀rọ̀ gbogbogbò bí “ṣe ìpalára.” “Ara yín” ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ ìfọ̀rọ̀wérọ̀ (“one another”) nínú àyíká yìí.
