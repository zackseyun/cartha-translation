  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: yo
  text: 'Àwọn iṣẹ́ ti ẹran ara[a] sì hàn gbangba: ìwà àgbèrè, ìwà àìmọ́, àti ìwà àìnítìjú,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwà ẹ̀dá ẹlẹ́ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà ni “ẹran ara” (σάρξ); níbí, Páùlù lò ó gẹ́gẹ́ bí àpèjúwe fún àwọn ìfẹ́kúfẹ̀ẹ́ àti ìtẹ̀sí ọkàn ẹ̀dá ènìyàn tó ti ṣubú sínú ẹ̀ṣẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: hàn gbangba
  rationale: Ó túmọ̀ sí ohun tí ó ṣe kedere, tí ó sì fara hàn fún gbogbo ènìyàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá.
- source_word: δέ
  choice: sì
  rationale: “Sì” ń fi ìyípadà kékeré tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn láìsọ ìtakora náà di líle ju bí Gíríìkì ṣe sọ ọ́.
- source_word: τὰ ἔργα
  choice: àwọn iṣẹ́
  rationale: Ó pa àwòrán Páùlù mọ́, ó sì bá ìyàtọ̀ tó wà láàárín “àwọn iṣẹ́” àti “èso” Ẹ̀mí nínú àyíká ọ̀rọ̀ mu.
- source_word: τῆς σαρκός
  choice: ti ẹran ara
  rationale: Ó pa àpèjúwe “ẹran ara” mọ́, dípò kí ó fi ìtumọ̀ kan ṣoṣo bí “ìwà ẹ̀dá ẹlẹ́ṣẹ̀” rọ́pò rẹ̀.
- source_word: ἅτινά ἐστιν
  choice: ':'
  rationale: Àmì méjì yìí ṣàfihàn àkójọ tó tẹ̀ lé e ní Yorùbá tó rọrùn, gẹ́gẹ́ bí gbólóhùn Gíríìkì ṣe ń ṣí àkójọ náà sílẹ̀.
- source_word: πορνεία
  choice: ìṣekúṣe
  rationale: Ọ̀rọ̀ yìí gbòòrò tó láti tọ́ka sí onírúurú ìbálòpọ̀ tí kò bófin mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí òǹkàwé òde òní lè lóye.
- source_word: ἀκαθαρσία
  choice: ìwà àìmọ́
  rationale: Ó mú èrò àìmọ́ nípa ìwà rere jáde, kì í ṣe ìdọ̀tí ara lásán.
- source_word: ἀσέλγεια
  choice: ìwà wọ̀bìà
  rationale: Ó ṣàfihàn ìwà búburú aláìní ìtìjú àti ìfẹ́kúfẹ̀ẹ́ tí kò ní ìjánu, pàápàá jù lọ nínú ọ̀ràn ìbálòpọ̀.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ọ̀rọ̀ Páùlù nípa ìwà
  choice: ẹran ara
  alternative: ìwà ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: “Ẹran ara” pa àpèjúwe Páùlù àti ìforígbárí tó fi hàn láàárín ẹran ara àti Ẹ̀mí mọ́. Fífì “ìwà ẹ̀dá ẹlẹ́ṣẹ̀” sí ọ̀rọ̀ pàtàkì yóò pinnu ìtumọ̀ rẹ̀ ju ohun tí orísun sọ lọ; a fi í sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ìtumọ̀ míì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́lá tó ṣe kedere fún òǹkàwé òde òní. A gbé àmì àlàyé [a] sí lẹ́yìn “ẹran ara,” nítorí ibẹ̀ ni àlàyé náà tọ́ka sí, kì í ṣe lẹ́yìn “ìṣekúṣe.”
