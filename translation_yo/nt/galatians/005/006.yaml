id: GAL.5.6
reference: Galatians 5:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: yo
  text: Nítorí nínú Mèsáyà Jésù[a], ìkọlà kò ní ìwúlò kankan, bẹ́ẹ̀ náà ni àìkọlà; ṣùgbọ́n ìgbàgbọ́[b] tí ń ṣiṣẹ́ nípasẹ̀ ìfẹ́[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Kristi Jésù.” Χριστός jẹ́ oyè tó túmọ̀ sí “Mèsáyà,” ẹni tí a fi òróró yàn.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì πίστις tún lè túmọ̀ sí “ìgbẹ́kẹ̀lé” tàbí “ìdúróṣinṣin.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ gbolohun náà sí “ìgbàgbọ́ tí ń ṣiṣẹ́ gidigidi nípasẹ̀ ìfẹ́,” “ìgbàgbọ́ tí ń fi ara rẹ̀ hàn nípasẹ̀ ìfẹ́,” tàbí “ìgbàgbọ́ tí a ń mú ṣiṣẹ́ nípasẹ̀ ìfẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa èdè Páùlù nípa ìṣọ̀kan pẹ̀lú Mèsáyà mọ́; “Mèsáyà” sì fi Χριστός hàn gẹ́gẹ́ bí oyè, kì í ṣe bí orúkọ lásán.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ìdí fún ọ̀rọ̀ tó ṣáájú.
- source_word: περιτομή / ἀκροβυστία
  choice: ìkọlà / àìkọlà
  rationale: Àwọn ọ̀rọ̀ méjèèjì pa ìyàtọ̀ tó wà láàárín àwọn ipò ìdánimọ̀ méjèèjì mọ́ ní ọ̀nà tó ṣe déédé.
- source_word: τι ἰσχύει
  choice: kò ní agbára kankan
  rationale: Èyí mú ìtumọ̀ agbára, ìmúnáṣẹ tàbí ipa tí ἰσχύει ní, láì dín un kù sí iye tàbí ọlá nìkan.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún πίστις; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ mìíràn tó ṣeé ṣe pamọ́.
- source_word: δι’ ἀγάπης
  choice: nípasẹ̀ ìfẹ́
  rationale: 'Ó pa ipa διά pẹ̀lú ẹ̀yà ọ̀rọ̀ oníṣe-mímúṣẹ mọ́: ìfẹ́ ni ọ̀nà tí ìgbàgbọ́ fi ń ṣiṣẹ́.'
- source_word: ἐνεργουμένη
  choice: tí ń ṣiṣẹ́
  rationale: Ìtumọ̀ yìí pa ìṣe tó ń bá a lọ mọ́, kò sì fi tipátipá yàn bóyá ọ̀rọ̀ náà jẹ́ àárín tàbí àbájáde.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; “Mèsáyà” mú ìtumọ̀ oyè náà jáde, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ ìbílẹ̀ “Kristi” mọ́.
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ìgbàgbọ́ tó ń ṣiṣẹ́ nípasẹ̀ ìfẹ́, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà lè ní àwọn ìtẹnumọ́ mìíràn; a kò fi àṣàyàn pàtó kan mú gbogbo ìtumọ̀ náà tán.
- issue: Ìbáṣepọ̀ ìgbàgbọ́ àti ìfẹ́
  choice: ìgbàgbọ́ tí ń ṣiṣẹ́ nípasẹ̀ ìfẹ́
  alternative: ìgbàgbọ́ tí a ń mú ṣiṣẹ́ nípasẹ̀ ìfẹ́
  rationale: Ọ̀rọ̀ yìí pa àìdánilójú èdè Gíríìkì mọ́ nípa bóyá ìgbàgbọ́ fúnra rẹ̀ ń ṣiṣẹ́ tàbí a ń mú un ṣiṣẹ́, láì dá ẹ̀kọ́ ẹ̀sìn kan lé e lórí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe tó bójú mu, tó ní ọlá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn níbi tó bá yẹ. “Ohun tó ṣe pàtàkì” mú ìtakora ἀλλά jáde ní Yorùbá adayeba, nígbà tí “kò ní agbára kankan” pa ìtumọ̀ ἰσχύει mọ́.
