    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ gbolohun náà sí “ìgbàgbọ́ tí ń ṣiṣẹ́ gidigidi nípasẹ̀ ìfẹ́,” “ìgbàgbọ́ tí ń fi ara rẹ̀ hàn nípasẹ̀ ìfẹ́,” tàbí “ìgbàgbọ́ tí a ń mú ṣiṣẹ́ nípasẹ̀ ìfẹ́.”
    reason: lexical_alternative
