  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: yo
  text: ìwà pẹ̀lẹ́, ìkóra-ẹni-níjàánu; lòdì sí irú àwọn nǹkan bẹ́ẹ̀[a], kò sí òfin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “lòdì sí irú àwọn ènìyàn bẹ́ẹ̀”; ṣùgbọ́n ó ṣeé ṣe jù pé gbólóhùn náà ń tọ́ka sí àwọn ànímọ́ tí a tò lẹ́sẹẹsẹ, kì í ṣe àwọn ènìyàn tí wọ́n ní wọn.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ ọ́ pé, “Kò sí òfin lòdì sí irú àwọn nǹkan bẹ́ẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτης
  choice: ìwà pẹ̀lẹ́
  rationale: Ó ń tọ́ka sí ìwà onírẹ̀lẹ̀, tí kò le koko tàbí ní ìkanra. “Ìwà pẹ̀lẹ́” jẹ́ ọ̀rọ̀ Yorùbá ti òde òní tí ó ṣe kedere, tí kò sì túmọ̀ sí àìlera.
- source_word: ἐγκράτεια
  choice: ìkóra-ẹni-níjàánu
  rationale: Ó túmọ̀ sí agbára láti ṣàkóso ìfẹ́kúfẹ̀ẹ́ àti ìsúnniṣe ara ẹni. Ọ̀rọ̀ yìí sọ èrò náà ní kedere àti ní ti ìwà rere.
- source_word: κατὰ τῶν τοιούτων
  choice: lòdì sí irú àwọn nǹkan bẹ́ẹ̀
  rationale: Bó tilẹ̀ jẹ́ pé τοιούτων lè tọ́ka sí ènìyàn tàbí ohun kan, àyíká ọ̀rọ̀ náà mú kí ó ṣeé ṣe jù pé ó ń tọ́ka sí àwọn ànímọ́ tí a ṣẹ̀ṣẹ̀ tò lẹ́sẹẹsẹ gẹ́gẹ́ bí èso Ẹ̀mí.
- source_word: νόμος
  choice: òfin
  rationale: Nítorí νόμος kò ní árítíkù nínú Gíríìkì, “òfin” pa gbólóhùn náà mọ́ ní ìtumọ̀ gbòòrò, láìfi dandan sọ ọ́ di Òfin Mósè nìkan.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ νόμος nínú gbólóhùn Pọ́ọ̀lù
  choice: “òfin” ní ìtumọ̀ gbòòrò
  alternative: “Òfin náà,” gẹ́gẹ́ bí ìtọ́ka pàtó sí Òfin Mósè
  rationale: 'Àríyànjiyàn Gálátíà ní í ṣe pẹ̀lú Òfin Mósè, ṣùgbọ́n bí νόμος ṣe wà láìsí árítíkù níbí jẹ́ kí gbólóhùn náà ní agbára gẹ́gẹ́ bí òwe gbogbogbò: kò sí òfin kankan tí ó lòdì sí irú àwọn ànímọ́ wọ̀nyí. Èyí kò yọ ìtumọ̀ Òfin Mósè kúrò, bẹ́ẹ̀ ni kò fi dandan mú un jẹ́ ìtumọ̀ kan ṣoṣo.'
translation_notes:
  register: A lo Yorùbá àfọwọ́ṣe tí ó bójú mu, tí ó ní àmì ohùn ní kíkún. “Ìwà pẹ̀lẹ́” àti “ìkóra-ẹni-níjàánu” jẹ́ ọ̀rọ̀ adayébá, òde òní, tí òǹkàwé lasán lè lóye. Ìṣètò “lòdì sí …, kò sí òfin” tẹ̀lé ìtẹnumọ́ Gíríìkì níwọ̀n díẹ̀, ó sì jẹ́ kí àwọn àmì àlàyé tẹ̀ lé ara wọn ní ọ̀nà tí ó mọ́.
