id: GAL.5.3
reference: Galatians 5:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: yo
  text: Mo sì tún jẹ́rìí fún olúkúlùkù ọkùnrin tí ó gba ìkọlà pé ó ní ojúṣe láti pa gbogbo Òfin mọ́[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún olúkúlùkù ènìyàn.” Ọ̀rọ̀ Gíríìkì lo ọ̀rọ̀ akọ ní ìtumọ̀ aláṣojú tàbí ìtumọ̀ gbogbogbò.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí a kọ ní ilà” tàbí “tí ó jẹ́ kí a kọ òun ní ilà.” Ọ̀rọ̀ Gíríìkì lè gba àwọn ìtumọ̀ tó sún mọ́ra wọ̀nyí; àyíká ọ̀rọ̀ ń tọ́ka sí ẹni tó tẹ́wọ́ gba ìkọlà nínú àríyànjiyàn yìí.
    reason: alternative_reading
  - marker: c
    text: Ní tààràtà, “ó jẹ́ ajigbèsè”; ìyẹn ni pé, ó wà lábẹ́ ojúṣe.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: Mo ... jẹ́rìí
  rationale: Ó pa agbára ọ̀rọ̀ ìjẹ́rìí tàbí ìjẹ́wọ́ pàtàkì mọ́ láì sọ ọ́ di ìkìlọ̀ nìkan.
- source_word: δὲ πάλιν
  choice: sì tún
  rationale: “Sì” so gbólóhùn náà mọ́ ohun tó ṣáájú pẹ̀lú ìtẹ̀síwájú díẹ̀, “tún” sì fi àtúnsọ tàbí ìtẹnumọ́ hàn.
- source_word: παντὶ ἀνθρώπῳ
  choice: fún olúkúlùkù ọkùnrin
  rationale: Ó pa ẹyọ ọ̀rọ̀ akọ àti ìtumọ̀ aláṣojú rẹ̀ mọ́; àlàyé ìsàlẹ̀ ṣàlàyé pé ó lè túmọ̀ sí olúkúlùkù ènìyàn.
- source_word: περιτεμνομένῳ
  choice: tí ó gba ìkọlà
  rationale: Ó tọ́ka sí ẹni tó tẹ́wọ́ gba kí a kọ ọ́ ní ilà nínú àríyànjiyàn yìí, kì í ṣe sí gbogbo ẹni tí a kọ ní ilà láti kékeré láìka ọ̀rọ̀ àyíká sí.
- source_word: ὀφειλέτης
  choice: ó di dandan fún un
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tó wà lábẹ́ ojúṣe; èyí jẹ́ Yorùbá àdánidá ju lílo àwòrán gbèsè tó lè mú òye owó wá.
- source_word: ὅλον τὸν νόμον
  choice: gbogbo Òfin
  rationale: Ó fi kíkún àti àpapọ̀ Òfin hàn.
- source_word: ποιῆσαι
  choice: láti pa ... mọ́
  rationale: Pẹ̀lú Òfin, gbólóhùn Yorùbá “pa Òfin mọ́” sọ ìgbọràn àti ṣíṣe ohun tí Òfin béèrè lọ́nà àdánidá.
theological_decisions:
- issue: Ìwọ̀n ọ̀rọ̀ Paulu nípa ìkọlà àti ojúṣe sí Òfin
  choice: Ọ̀rọ̀ náà ń tọ́ka sí ọkùnrin tó gba ìkọlà nínú ọ̀ràn àwọn ará Gálátíà, èyí tó mú kí ó wà lábẹ́ ojúṣe láti pa gbogbo Òfin mọ́.
  alternative: Ó lè dà bí ẹni pé ó ń tọ́ka sí gbogbo ọkùnrin tí a ti kọ ní ilà, títí kan àwọn Júù tí a kọ ní ilà ní ìkókó.
  rationale: Àyíká 5:2–3 àti ọ̀rọ̀ aláìparí περιτεμνομένῳ ṣètìlẹ́yìn fún ẹni tó ń tẹ́wọ́ gba ìkọlà nínú àríyànjiyàn yìí; ìtumọ̀ náà kò fi ète tí Gíríìkì kò sọ kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. “Ìkọlà” ni a lò fún circumcision, “Òfin” sì gba lẹ́tà ńlá nítorí pé ó tọ́ka sí Òfin Mósè nínú àyíká yìí.
