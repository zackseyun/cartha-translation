id: GAL.5.16
reference: Galatians 5:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: yo
  text: Ṣùgbọ́n mo ní, ẹ máa rìn nípasẹ̀ Ẹ̀mí, ẹ̀yin kì yóò sì mú ìfẹ́kúfẹ̀ẹ́ ti ẹran ara[a] ṣẹ rárá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwà ẹ̀ṣẹ̀ ènìyàn.” Ọ̀rọ̀ Gíríìkì náà ni “ẹran ara”; nínú àwọn lẹ́tà Paulu, ó lè tọ́ka sí ìwà ènìyàn tí ẹ̀ṣẹ̀ ti bàjẹ́, tí ó sì ń tako Ẹ̀mí.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω δέ
  choice: Ṣùgbọ́n mo ní
  rationale: “Ṣùgbọ́n” fi ìyípadà ọ̀rọ̀ tí δέ ń ṣe hàn láì sọ ìtakora náà di ohun tí ó lágbára jù; “mo ní” sì jẹ́ ọ̀nà Yorùbá àdánidá fún Λέγω.
- source_word: πνεύματι
  choice: nípa Ẹ̀mí
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ohun èlò tàbí ààyè ìgbésí ayé; “nípa Ẹ̀mí” fi iṣẹ́ àti ìdarí Ẹ̀mí hàn, ó sì bá ìyàtọ̀ láàárín Ẹ̀mí àti ẹran ara nínú àyíká ọ̀rọ̀ mu.
- source_word: περιπατεῖτε
  choice: ẹ máa rìn
  rationale: Ó pa àwòrán “rírìn” tí Paulu lò mọ́, nígbà tí “máa” fi hàn pé ó jẹ́ ìlànà ìgbésí ayé tí ń bá a lọ.
- source_word: ἐπιθυμίαν
  choice: ìfẹ́kúfẹ̀ẹ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìfẹ́ búburú tàbí ìfẹ́ tí ń fà ènìyàn sí ohun tí kò tọ́; “ìfẹ́kúfẹ̀ẹ́” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere láì dín un kù sí ìfẹ́ ìbálòpọ̀ nìkan.
- source_word: σαρκὸς
  choice: ẹran ara
  rationale: “Ẹran ara” pa àwòrán àti ẹ̀ka èrò Paulu mọ́ dípò yíyanjú rẹ̀ pátápátá sí “ìwà ẹ̀ṣẹ̀”; àlàyé ìtumọ̀ rẹ̀ nínú àyíká yìí wà ní àlàyé ìsàlẹ̀.
- source_word: οὐ μὴ τελέσητε
  choice: ẹ̀yin kì yóò sì mú ... ṣẹ rárá
  rationale: “Kì yóò ... rárá” mú ìkọ̀ emphatic οὐ μή jáde, “mú ... ṣẹ” sì sọ τελέω gẹ́gẹ́ bí mímú ìfẹ́ náà dé sí ìṣe.
theological_decisions:
- issue: Ohun tí πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí ìlànà ti ẹ̀mí lásán
  rationale: Àyíká Gálátíà 5 fi Ẹ̀mí àti ẹran ara dojú kọ ara wọn, ó sì tọ́ka sí iṣẹ́ Ẹ̀mí Ọlọ́run. Lílo lẹ́tà ńlá nínú “Ẹ̀mí” fi ìdájọ́ àyíká yìí hàn láì fi ọ̀rọ̀ míì kún ẹsẹ náà.
- issue: Ìtumọ̀ σαρκὸς
  choice: ẹran ara
  alternative: ìwà ẹ̀ṣẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ní ìtumọ̀ ìwà búburú níbí, pípa “ẹran ara” mọ́ ń dáàbò bo ọ̀rọ̀ àti ìforígbárí ẹ̀kọ́ Paulu, nígbà tí àlàyé ìsàlẹ̀ fúnni ní ìtumọ̀ àyíká.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Ẹ máa rìn” pa àwòrán orísun mọ́, “kì yóò ... rárá” sì jẹ́ ọ̀nà àdánidá láti fi ìkọ̀ tí ó lágbára hàn. A gbé àmì [a] sí “ẹran ara,” nítorí ibẹ̀ ni àlàyé náà ń tọ́ka sí.
