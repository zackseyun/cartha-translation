  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé èdè Gíríìkì dáadáa: ìfẹ̀hónúhàn δέ, àṣẹ tí ń bá a lọ nínú περιπατεῖτε, ìforígbárí Ẹ̀mí/ẹran ara, àti ìkọ̀ alágbára οὐ μὴ ni a ti pa mọ́. Síbẹ̀, “nípa Ẹ̀mí” lè túmọ̀ sí “nípa/kàn sí Ẹ̀mí,” kì í sì fi ohun èlò ìdarí dative náà hàn kedere bí “nípasẹ̀ Ẹ̀mí.”'
  naturalness: “Ẹ máa rìn” jẹ́ àdánidá, ó sì pa àwòrán Paulu mọ́. Ṣùgbọ́n “ìfẹ́kúfẹ̀ẹ́ ẹran ara” lè ní ìdààmú kékeré ní Yorùbá, nítorí ìfararọ̀ orúkọ lè jẹ́ kí a gbọ́ ọ́ gẹ́gẹ́ bí ìfẹ́ sí ẹran ara. “Ìfẹ́kúfẹ̀ẹ́ ti ẹran ara” sọ ìbáṣepọ̀ náà di mímọ́.
  terminology: “Ẹ̀mí” pẹ̀lú lẹ́tà ńlá jẹ́ ìpinnu tó dá lórí àyíká, ó sì yẹ. “Ẹran ara” pa ọrọ̀ σάρξ mọ́ nínú ìtumọ̀ àkọ́kọ́; àlàyé ìsàlẹ̀ yẹ kí ó sọ ìtumọ̀ àfidípò náà ní kedere, kí ó sì lo gbolohun Yorùbá tó pé.
  issues:
  - severity: medium
    issue: “nípa Ẹ̀mí” kò dá ìtumọ̀ dative πνεύματι hàn kedere.
    rationale: Ní Yorùbá òde òní, “nípa” sábà máa ń túmọ̀ sí “concerning/about,” bí ó tilẹ̀ lè ní ìtumọ̀ ọ̀nà ní àwọn àyíká kan. “Nípasẹ̀ Ẹ̀mí” dá ìdarí tàbí ọ̀nà tí ìtumọ̀ Gíríìkì àti ìtumọ̀ Gẹ̀ẹ́sì ń fi hàn sílẹ̀ láì yọ àwòrán “rìn” kúrò.
  - severity: low
    issue: Ìfararọ̀ nínú “ìfẹ́kúfẹ̀ẹ́ ẹran ara” lè ṣí sí ìtumọ̀ tí kò fẹ́ẹ̀ jẹ́.
    rationale: Fífi “ti” sí i—“ìfẹ́kúfẹ̀ẹ́ ti ẹran ara”—fi hàn pé ìfẹ́kúfẹ̀ẹ́ náà jẹ́ ti/ń wá láti ọwọ́ ẹran ara, kì í ṣe ìfẹ́kúfẹ̀ẹ́ sí i.
