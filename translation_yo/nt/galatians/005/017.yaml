id: GAL.5.17
reference: Galatians 5:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: yo
  text: Nítorí ara[a] ń fẹ́ ohun tí ó lòdì sí Ẹ̀mí[b], Ẹ̀mí sì ń fẹ́ ohun tí ó lòdì sí ara; nítorí àwọn méjèèjì yìí ń tako ara wọn, kí ẹ má lè ṣe ohun tí ẹ bá fẹ́ ṣe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìwà ẹlẹ́ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà ni σάρξ (sarx). Níhìn-ín Paulu ń lò ó ní ìtumọ̀ ìwà tó gbòòrò ju ara ti ara lásán lọ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ̀mí,” bí a bá gbà pé ó ń tọ́ka sí ẹ̀mí ènìyàn dípò Ẹ̀mí Mímọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: σὰρξ
  choice: ara
  rationale: A pa àwòrán ọ̀rọ̀ Paulu mọ́ pẹ̀lú “ara,” dípò kí a yanjú rẹ̀ sí “ìwà ẹlẹ́ṣẹ̀” nínú àyọkà. Àlàyé ìtumọ̀ rẹ̀ nínú ọ̀rọ̀ ìwà rere àti ìwà búburú wà ní àlàyé ìsàlẹ̀.
- source_word: ἐπιθυμεῖ
  choice: ń fẹ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfẹ́ tàbí ìtẹ̀sí líle; “ohun tí ó lòdì sí” ló mú ipa ọ̀tá inú gbólóhùn Gíríìkì náà hàn.
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: ohun tí ó lòdì sí Ẹ̀mí / ohun tí ó lòdì sí ara
  rationale: Fífì “ohun tí ó” kún un mú gbólóhùn náà ṣe kedere ní Yorùbá, ó sì pa ìtumọ̀ κατά pẹ̀lú ẹ̀yà ọ̀rọ̀ genitive mọ́ gẹ́gẹ́ bí ohun tí ó dojú kọ òmíràn.
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Àyíká Gálátíà 5 ń tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí ẹni tí ó ń tako ara; lẹ́tà ńlá fi ìtumọ̀ yìí hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ “ẹ̀mí ènìyàn” mọ́ gẹ́gẹ́ bí àṣàyàn.
- source_word: ἀλλήλοις ἀντίκειται
  choice: ń tako ara wọn
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì fi ìtakora alábápín àwọn méjèèjì hàn láìfi àlàyé míì kún un.
- source_word: ἵνα μὴ
  choice: èyí sì ń mú kí ... má ṣe
  rationale: Ìtumọ̀ yìí fi àbájáde ìtakora náà hàn ní Yorùbá àdánidá, nígbà tó ṣì pa àjọṣe ète/àbájáde inú ἵνα μὴ mọ́.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: àwọn ohun tí ẹ fẹ́ ṣe
  rationale: Ó mú ọ̀rọ̀ arọ́pò aláìnípinnu àti ohun púpọ̀ inú Gíríìkì náà jáde ní ọ̀nà Yorùbá tó rọrùn, láìfi ìtumọ̀ àṣà tàbí ìṣe lemọ́lemọ́ kún ποιέω.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ọ̀rọ̀ Paulu nípa ìwà
  choice: A lo “ara” nínú àyọkà láti pa àwòrán àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ Paulu mọ́.
  alternative: ìwà ẹlẹ́ṣẹ̀
  rationale: Níbi yìí σάρξ kọjá ara ti ẹran ara, ṣùgbọ́n “ìwà ẹlẹ́ṣẹ̀” jẹ́ ìtumọ̀ àlàyé tó lè ti ìtumọ̀ náà mọ́ sí ọ̀nà kan ṣoṣo. Àlàyé ìsàlẹ̀ ni a fi ṣàlàyé rẹ̀.
- issue: Ẹni tí πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí inú ènìyàn
  rationale: Àwọn ẹsẹ tó yí i ká nínú Gálátíà 5 ń sọ nípa rírìn nípasẹ̀ Ẹ̀mí àti bí Ẹ̀mí ṣe ń darí onígbàgbọ́, nítorí náà Ẹ̀mí Mímọ́ ni ó ṣeé ṣe jù. Síbẹ̀, a kò pa àṣàyàn ẹ̀mí ènìyàn rẹ́; a kọ ọ́ sínú àlàyé ìsàlẹ̀.
- issue: Ipa ἵνα μὴ nínú gbólóhùn náà
  choice: 'A túmọ̀ rẹ̀ gẹ́gẹ́ bí àbájáde ìtakora: “èyí sì ń mú kí...”'
  alternative: “kí ẹ má bàa...” gẹ́gẹ́ bí ète
  rationale: ἵνα lè fi ète tàbí àbájáde hàn. Ní àyíká yìí, ọ̀rọ̀ nípa bí ìtakora ṣe ń ní ipa lórí ohun tí àwọn olùgbọ́ ń ṣe jẹ́ Yorùbá tó ṣe kedere, láìsọ pé ẹ̀gbẹ́ kan ṣoṣo ló ní ète náà.
translation_notes:
  register: Yorùbá àkọ́tọ̀ tó bójú mu, pẹ̀lú àmì ohùn níbi tó yẹ, ni a lò. Ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún òǹkàwé gbogbogbò; “ń tako ara wọn” àti “èyí sì ń mú kí” yẹra fún ọ̀rọ̀ àtijọ́ tàbí àlàyé ẹ̀kọ́ ìjọ kan pàtó.
