  source_fidelity: 'Ìtumọ̀ náà mú ọ̀pọ̀ jù lọ nínú ìtumọ̀ Gíríìkì wá dáadáa: ìwà/ìgbé ayé tẹ́lẹ̀, Júùdáìsìmù, ìjọ Ọlọ́run, àti ìṣe tí imperfect fi hàn. Ṣùgbọ́n “ń gbìyànjú láti pa á run” fi ìtumọ̀ ìgbìyànjú kún ἐπόρθουν nígbà tí ìṣe pàtàkì ọ̀rọ̀ náà ni pípa run/rírú ìparun sí i. A tún lè sọ καθ’ ὑπερβολὴν ní Yorùbá ní ọ̀nà tí ó dára, kedere ju “dé àyè tí ó kọjá ìwọ̀n” lọ.'
