id: GAL.1.13
reference: Galatians 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: yo
  text: Nítorí ẹ ti gbọ́ nípa ìgbé ayé mi tẹ́lẹ̀ rí nínú ẹ̀sìn àwọn Júù,[a] pé mo ń ṣe inúnibíni sí ìjọ Ọlọ́run lọ́nà àṣejù,[b] mo sì ń pa á run.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú Júùdáìsìmù.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ní ìwọ̀n tí ó pọ̀ jù” tàbí “lọ́nà àrà ọ̀tọ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “mo sì ń gbìyànjú láti pa á run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: ìgbé ayé mi tẹ́lẹ̀ rí
  rationale: Àkójọpọ̀ yìí fi ọ̀nà ìgbé ayé Pọ́ọ̀lù ní àkókò ṣáájú hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju títúmọ̀ ọ́ sí ìwà díẹ̀ kan lọ.
- source_word: Ἰουδαϊσμῷ
  choice: ẹ̀sìn àwọn Júù
  rationale: Ó ṣàlàyé ìtumọ̀ Júùdáìsìmù ní èdè tí òǹkàwé Yorùbá òde òní lè lóye lẹ́sẹ̀kẹsẹ̀, láìfi ohun míì kún ìdánimọ̀ àti ìṣe ẹ̀sìn tí ọ̀rọ̀ Gíríìkì tọ́ka sí.
- source_word: καθ’ ὑπερβολὴν
  choice: dé àyè tí ó kọjá ìwọ̀n
  rationale: Gbólóhùn náà pa agbára ìtẹnumọ́ Gíríìkì mọ́, ó sì fi bí inúnibíni náà ti pọ̀ rékọjá hàn.
- source_word: ἐδίωκον
  choice: mo ti ń ṣe inúnibíni sí
  rationale: Àmì “ń” mú ìṣe tí ó ń lọ lọ́wọ́ ní àkókò àtijọ́ tí imperfect Gíríìkì fi hàn jáde.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: ìjọ Ọlọ́run
  rationale: “Ìjọ Ọlọ́run” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún àwùjọ àwọn onígbàgbọ́ tí Pọ́ọ̀lù ń ṣe inúnibíni sí.
- source_word: ἐπόρθουν
  choice: mo sì ń gbìyànjú láti pa á run
  rationale: Ọ̀rọ̀-ìṣe náà lè tọ́ka sí pípa run tàbí ìgbìyànjú láti pa run. Yíyan èyí pa ìfojúsùn ìṣe tí ń lọ lọ́wọ́ mọ́ láìsọ pé ìparun náà ṣẹ̀ ní kíkún.
theological_decisions:
- issue: Títúmọ̀ ἐκκλησία bí “ìjọ” tàbí “àpéjọ”
  choice: ìjọ Ọlọ́run
  alternative: àpéjọ Ọlọ́run
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí àwùjọ àwọn tó tẹ̀lé Mèsáyà. “Ìjọ” jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání, láìfi ẹ̀kọ́ ìsìn àfikún sí i.
- issue: Bóyá ἐπόρθουν sọ ìparun tí ó ṣẹ̀ tàbí ìgbìyànjú láti pa run
  choice: ń gbìyànjú láti pa á run
  alternative: ń pa á run
  rationale: Imperfect náà àti agbára ọ̀rọ̀-ìṣe náà lè gba ìtumọ̀ ìgbìyànjú ìparun; yíyan yìí kò sọ pé Pọ́ọ̀lù ṣàṣeyọrí láti pa ìjọ náà run.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “ẹ̀sìn àwọn Júù” dípò ọ̀rọ̀ àyálò “Jùúdáìsìmù” nínú ọ̀rọ̀ pàtàkì, a sì fi àṣàyàn náà sínú àlàyé ìsàlẹ̀.
