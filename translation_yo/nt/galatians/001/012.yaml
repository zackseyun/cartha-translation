  to: Nítorí èmi kò gba a láti ọ̀dọ̀ ènìyàn, bẹ́ẹ̀ ni a kò kọ́ mi nípa rẹ̀; ṣùgbọ́n nípasẹ̀ ìṣípayá Jésù Mèsáyà.[a]
  rationale: 'Àtúnṣe náà yí apá kan ṣoṣo tí kò ṣe kedere nínú Yorùbá padà: a fi “a kò kọ́ mi nípa rẹ̀” rọ́pò “a kò kọ́ ọ fún mi.” Èyí pa ìtumọ̀ ‘a kò kọ́ mí’ mọ́, ó sì tọ́ka sí ‘a’ (ìhìn rere) láìfi kókó tuntun kún un. A tún jẹ́ kí gbolohun ìkẹyìn dúró gẹ́gẹ́ bí gbolohun aláìlò-ọrọ-ìṣe nítorí èyí ń bá ìṣọ̀kan Gíríìkì mu, tí a sì pa àìdánilójú gẹnitífù mọ́ pẹ̀lú àlàyé ìsàlẹ̀.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:30:22Z'
