  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: yo
  text: Nítorí èmi kò gba a láti ọ̀dọ̀ ènìyàn, bẹ́ẹ̀ ni a kò kọ́ mi nípa rẹ̀; ṣùgbọ́n nípasẹ̀ ìṣípayá Jésù Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè túmọ̀ sí, “nípasẹ̀ ìṣípayá láti ọ̀dọ̀ Jésù Mèsáyà,” tàbí “nípasẹ̀ ìṣípayá nípa Jésù Mèsáyà.”
    reason: Ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì lè tọ́ka sí Jésù Mèsáyà gẹ́gẹ́ bí orísun ìṣípayá náà tàbí gẹ́gẹ́ bí ẹni tí ìṣípayá náà jẹ́ nípa rẹ̀.
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: láti ọ̀dọ̀ ènìyàn
  rationale: Ọ̀rọ̀ náà jẹ́ ẹyọ ṣùgbọ́n ó dúró fún ènìyàn lápapọ̀; ìtumọ̀ yìí fi orísun ènìyàn wé ìṣípayá láìtọ́ka sí ẹnì kan pàtó.
- source_word: παρέλαβον
  choice: mo gba a
  rationale: “Gba” bá èrò gbígba ohun tí a fi léni lọ́wọ́ tàbí àṣà tí a sọ̀kalẹ̀ mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: ἐδιδάχθην
  choice: a kò kọ́ ọ fún mi
  rationale: Ìṣe aláìṣe yìí fi hàn pé Pọ́ọ̀lù kò gba ìhìn rere náà nípasẹ̀ ẹ̀kọ́ láti ọ̀dọ̀ ẹlòmíràn.
- source_word: δι’ ἀποκαλύψεως
  choice: nípasẹ̀ ìṣípayá
  rationale: “Nípasẹ̀” ṣàfihàn ọ̀nà tàbí ohun èlò, “ìṣípayá” sì tọ́ka sí ohun tí a mú kúrò ní ìkọ̀kọ̀ tí a sì fi hàn.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: A pa ìbáṣepọ̀ gẹnitífù Gíríìkì mọ́ ní ọ̀nà tó ṣí sí ìtumọ̀ pé ìṣípayá náà wá láti ọ̀dọ̀ Jésù Mèsáyà tàbí pé ó jẹ́ nípa rẹ̀; àlàyé ìsàlẹ̀ fi àṣàyàn méjèèjì hàn.
theological_decisions:
- issue: Ìtumọ̀ gẹnitífù nínú ἀποκαλύψεως Ἰησοῦ Χριστοῦ
  choice: Gbólóhùn “ìṣípayá Jésù Mèsáyà” tí kò fi dandan pinnu bóyá Jésù ni orísun rẹ̀ tàbí kókó rẹ̀
  alternative: “ìṣípayá láti ọ̀dọ̀ Jésù Mèsáyà” tàbí “ìṣípayá nípa Jésù Mèsáyà”
  rationale: Gíríìkì lè túmọ̀ sí ìṣípayá tí Jésù Mèsáyà fúnni tàbí ìṣípayá nípa rẹ̀. Àyíká ọ̀rọ̀ tẹnu mọ́ orísun tí kì í ṣe ti ènìyàn, ṣùgbọ́n a kò gbọdọ̀ mú àìdánilójú gírámà náà kúrò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọ̀wọ̀, adayébá, tó ṣeé lóye. A lo “Mèsáyà” gẹ́gẹ́ bí oyè fún Χριστός, a sì yẹra fún fífi ẹ̀kọ́ ẹgbẹ́ ìjọ kan sínú ọ̀rọ̀ náà.
