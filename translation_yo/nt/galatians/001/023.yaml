  terminology: “Ṣe inúnibíni sí,” “ń kéde,” “ìgbàgbọ́ náà,” àti “pa run” bá ìforúkọsílẹ̀ ìtumọ̀ tó yẹ mu. “Ìgbàgbọ́ náà” ní àmì ìdánimọ̀ tó bá τὴν πίστιν mu, nígbà tí àlàyé ìsàlẹ̀ ń pa àṣàyàn “ìhìn rere” mọ́.
