source:
  edition: SBLGNT
  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: yo
  text: Wọ́n kàn ń gbọ́ pé, “Ẹni tí ó ṣe inúnibíni sí wa tẹ́lẹ̀ ń kéde ìgbàgbọ́ náà nísinsìnyí, èyí tí ó ń pa run tẹ́lẹ̀.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn rere.” Ọ̀rọ̀ Gíríìkì náà ní “ìgbàgbọ́ náà”; níbí ó lè túmọ̀ sí ìhìn tàbí ẹ̀kọ́ ìgbàgbọ́ Kristẹni tí ó ti ń kọlù tẹ́lẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: kàn
  rationale: 'Ó fi ààlà sí ohun tí wọ́n mọ̀: ìròyìn yìí nìkan ni wọ́n ń gbọ́.'
- source_word: ἀκούοντες ἦσαν
  choice: ń gbọ́
  rationale: Ìhun ọ̀rọ̀ náà ń tọ́ka sí ohun tí ó ń bá a lọ tàbí tí ó ń ṣẹlẹ̀ léraléra; “ń gbọ́” jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: Ẹni tí ó ń ṣe inúnibíni sí wa nígbà kan rí
  rationale: Ó pa àpèjúwe Pọ́ọ̀lù gẹ́gẹ́ bí ẹni tí ó ń ṣe inúnibíni sí wọn tẹ́lẹ̀ mọ́.
- source_word: νῦν εὐαγγελίζεται
  choice: ti ń kéde
  rationale: “Ń kéde” mú ìtumọ̀ iṣẹ́ ìpolongo ìhìn rere jáde láìfi ọ̀rọ̀ míì kún ohun tí ó tẹ̀ lé e, τὴν πίστιν.
- source_word: τὴν πίστιν
  choice: ìgbàgbọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ṣeé ṣe jù pé ó ń tọ́ka sí ìgbàgbọ́ Kristẹni gẹ́gẹ́ bí iṣẹ́ ìránṣẹ́ tàbí ohun tí a gbà gbọ́; a pa ọ̀rọ̀ orísun náà mọ́, a sì ṣàlàyé ìtumọ̀ míì nínú àlàyé ìsàlẹ̀.
- source_word: ἣν ποτε ἐπόρθει
  choice: tí ó ti ń gbìyànjú láti pa run tẹ́lẹ̀
  rationale: πορθέω túmọ̀ sí pípa run tàbí ṣíṣe ìparun; “ń gbìyànjú láti pa run” sọ ète ìkọlù rẹ̀ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ τὴν πίστιν
  choice: “ìgbàgbọ́” gẹ́gẹ́ bí ìhìn tàbí ẹ̀kọ́ ìgbàgbọ́ Kristẹni tí Pọ́ọ̀lù ń kéde
  alternative: “ìhìn rere,” tàbí ìgbàgbọ́ gẹ́gẹ́ bí ìṣe fífi ọkàn tán ohun kan
  rationale: Àyíká ọ̀rọ̀ náà fi ohun tí Pọ́ọ̀lù ń kéde nísinsìnyí wé ohun tí ó ń gbìyànjú láti pa run tẹ́lẹ̀. Àmì ìdánimọ̀ inú Gíríìkì tún ti ìtumọ̀ ohun tí a gbà gbọ́ lẹ́yìn, ṣùgbọ́n a kò yọ àwọn ìtumọ̀ mìíràn kúrò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “nígbà kan rí” àti “tẹ́lẹ̀” láti jẹ́ kí ìyàtọ̀ ποτε/νῦν hàn kedere, bí ó tilẹ̀ jẹ́ pé “nísinsìnyí” kò dúró lọ́tọ̀ nítorí ìhun “ti ń kéde” ti sọ ìyípadà sí ipò òde òní.
