  source_fidelity: Àtúnyẹ̀wò nílò nítorí pé ìtumọ̀ àkọ́kọ́ kò sọ νῦν (“nísinsìnyí”) hàn ní tààrà, ó sì lo “ti ń kéde,” èyí tí ó lè túmọ̀ sí ìṣe tí ó ti bẹ̀rẹ̀ ṣáájú tí ó sì ń tẹ̀síwájú, dípò ìyàtọ̀ “tẹ́lẹ̀/nísinsìnyí” nínú Gíríìkì. “Ń ṣe inúnibíni ... nígbà kan rí” tún lè dà bí ìṣe tí ń lọ, níbi tí ποτε ń ṣàpèjúwe ìṣe àtijọ́. Àtúnyẹ̀wò náà pa ìtumọ̀ τὴν πίστιν mọ́ gẹ́gẹ́ bí “ìgbàgbọ́ náà,” ó sì fi ìṣe ìparun tí ἐπόρθει ń tọ́ka sí hàn láìfi èrò ẹ̀sìn kan kún un.
