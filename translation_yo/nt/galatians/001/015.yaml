  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí ó wù ẹni tí ó yà mí sọ́tọ̀ láti inú ìkùn ìyá mi, tí ó sì pè mí nípasẹ̀ oore-ọ̀fẹ́ rẹ̀[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ìbí mi”; fi wé ọ̀rọ̀ nípa ìpè àwọn wòlíì nínú Jeremáyà 1:5 àti Aísáyà 49:1.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: Ó pa agbára àkókò ὅτε àti ìyípadà pẹ̀lẹ́ tí δέ ń mú wá mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: εὐδόκησεν
  choice: fẹ́ bẹ́ẹ̀
  rationale: Ó sọ ìtẹ́lọ́rùn àti ìfẹ́ rere Ọlọ́run láì sọ ọ́ di ìpinnu lásán; gbólóhùn náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
- source_word: ὁ ἀφορίσας με
  choice: ẹni tí ó ti yà mí sọ́tọ̀
  rationale: Ó fi participle oní-artíkù náà hàn gẹ́gẹ́ bí ẹni kan, ó sì pa ìtumọ̀ yíyà sí mímọ́ tàbí sí iṣẹ́ pàtàkì mọ́ láì fi ẹ̀kọ́ ìdìbò kan kún un.
- source_word: ἐκ κοιλίας μητρός μου
  choice: láti inú ìyá mi
  rationale: Ó pa àwòrán gidi inú ìyá àti èdè ìpè àwọn wòlíì mọ́; ó tún lè tọ́ka sí ìgbà láti ìbí, gẹ́gẹ́ bí àlàyé ìsàlẹ̀ ṣe sọ.
- source_word: καλέσας
  choice: tí ó sì pè mí
  rationale: “Pè” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún ìpè Ọlọ́run, ó sì lè ru ìtumọ̀ iṣẹ́ àti ìgbàlà láì nílò àfikún.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: nípasẹ̀ oore-ọ̀fẹ́ rẹ̀
  rationale: Ó fi διά pẹ̀lú genitive hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò ìpè Ọlọ́run, ó sì jẹ́ èdè Yorùbá tó bójú mu.
theological_decisions:
- issue: Bóyá ἀφορίσας yẹ kí a túmọ̀ ní ọ̀nà tí yóò fi ẹ̀kọ́ pàtó nípa àyànmọ́ tàbí ìdìbò sínú ẹsẹ náà
  choice: yà mí sọ́tọ̀
  alternative: yàn mí / fi mí sípò
  rationale: Gíríìkì ń sọ nípa yíyà Pọ́ọ̀lù sọ́tọ̀, ó sì ṣeé ṣe kí ó ń lo èdè ìpè wòlíì; kò béèrè pé kí a sọ ọ́ di ẹ̀kọ́ àyànmọ́ tàbí ìdìbò tó ti ṣe tán.
- issue: Bóyá ἐκ κοιλίας μητρός μου túmọ̀ sí láti ìgbà inú oyún tàbí láti ìbí
  choice: láti inú ìyá mi
  alternative: láti ìbí mi
  rationale: Ìtumọ̀ àkọ́kọ́ pa àwòrán orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé rí ìtumọ̀ míì tó ṣeé ṣe.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé yé. A lo “ẹni tí” dípò gbólóhùn tó le tàbí ti àtijọ́; a sì fi àmi ohùn sí ibi tí ó bá àdánidá mu. Ẹsẹ náà mọ̀ọ́mọ̀ dúró gẹ́gẹ́ bí apá gbólóhùn tó ń bá a lọ sí ẹsẹ 16, bí Gíríìkì ṣe rí.
