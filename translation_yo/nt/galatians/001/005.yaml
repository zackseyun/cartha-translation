lexical_decisions:
- source_word: ᾧ
  choice: Òun ni ... tirẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ dátífù yìí tọ́ka sí ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ìyẹn Ọlọ́run àti Baba wa; ìṣètò yìí mú ìtumọ̀ ‘ẹni tí ògo jẹ́ tirẹ̀’ jáde ní Yorùbá àdánidá.
- source_word: δόξα
  choice: ògo
  rationale: ‘Ògo’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún ìyìn Ọlọ́run nínú gbólóhùn ìjọsìn.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: láéláé àti láéláé
  rationale: Èyí jẹ́ gbólóhùn àkànṣe fún àkókò tí kò ní òpin; àtúnṣe ‘láéláé’ ń pa agbára ìtẹnumọ́ Gíríìkì mọ́ ní Yorùbá tó ṣe kedere.
- source_word: ἀμήν
  choice: Àmín
  rationale: A lo àfọwọ́kọ ọ̀rọ̀ yìí gẹ́gẹ́ bí ìjẹ́rìí tàbí ìfẹsẹ̀múlẹ̀ ọ̀wọ̀ ní òpin ọ̀rọ̀ ìyìn.
theological_decisions:
- issue: Ìṣe ọ̀rọ̀ tí a fi sílẹ̀ láìkọ nínú gbólóhùn ìyìn
  choice: Òun ni kí ògo jẹ́ tirẹ̀
  alternative: Òun ni ògo jẹ́ tirẹ̀
  rationale: Gíríìkì kò ní ọ̀rọ̀-ìṣe tó dúró gẹ́gẹ́ bí fíníítì; ‘kí ... jẹ́’ pa ìrísí àdúrà àti ìyìn mọ́ láìfi ẹ̀kọ́ ìgbàgbọ́ mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà ní ọlá, ó rọrùn fún òǹkàwé òde òní, ó sì bá àṣà gbólóhùn ìyìn mu.
