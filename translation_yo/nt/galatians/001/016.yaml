id: GAL.1.16
reference: Galatians 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: yo
  text: láti fi Ọmọ rẹ̀ hàn nínú mi[a], kí n lè polongo rẹ̀ láàárín àwọn tí kì í ṣe Júù, mi kò bá ẹran ara àti ẹ̀jẹ̀ gbìmọ̀ lẹ́sẹ̀kẹsẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “sí mi” tàbí “nípasẹ̀ mi.”
    reason: alternative_reading
  - marker: b
    text: “Ẹran ara àti ẹ̀jẹ̀” jẹ́ àkànlò-èdè tó túmọ̀ sí ènìyàn kan tàbí àwọn ènìyàn.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: láti fi … hàn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá fún ‘láti ṣí payá’ tàbí ‘láti fihàn,’ ó sì pa èrò ìṣípayá Ọlọ́run mọ́ láìfi àlàyé àfikún sí i.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Ọmọ rẹ̀
  rationale: Ó pa orúkọ ipò Ọmọ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ìbátan tí Gíríìkì sọ.
- source_word: ἐν ἐμοὶ
  choice: nínú mi
  rationale: Ìtumọ̀ gidi ti ἐν ni a pa mọ́, kí àìdánilójú tó wà láàárín ìṣípayá inú ọkàn, ìṣípayá sí Pọ́ọ̀lù, àti ìṣípayá nípasẹ̀ rẹ̀ má bàa sọnù.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: kí n lè polongo rẹ̀
  rationale: ‘Polongo rẹ̀’ pa Ọmọ náà mọ́ gẹ́gẹ́ bí ohun tí Pọ́ọ̀lù ń kéde ní tààràtà, dípò yíyí ọ̀rọ̀ náà padà sí ‘ìhìn rere nípa rẹ̀.’
- source_word: ἐν τοῖς ἔθνεσιν
  choice: láàárín àwọn tí kì í ṣe Júù
  rationale: Nínú àyíká lẹ́tà Pọ́ọ̀lù, ἔθνη ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù. Ìtumọ̀ yìí ṣe kedere ní Yorùbá òde òní, kò sì lo ọ̀rọ̀ tí ó lè ní ìtumọ̀ ẹ̀gàn.
- source_word: εὐθέως
  choice: lẹ́sẹ̀kẹsẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá, tó sì péye, fún ‘ní kánkán’ tàbí ‘ní ẹsẹ̀ kan náà.’
- source_word: οὐ προσανεθέμην
  choice: mi kò … gbìmọ̀
  rationale: Ọ̀rọ̀ ìṣe àárín yìí túmọ̀ sí bíbá ẹlòmíràn gbèrò tàbí wá ìmọ̀ràn; ‘bá … gbìmọ̀’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: σαρκὶ καὶ αἵματι
  choice: ẹran ara àti ẹ̀jẹ̀
  rationale: A pa àwòrán ọ̀rọ̀ Pọ́ọ̀lù mọ́ ní tààràtà; àlàyé ìtumọ̀ àkànlò-èdè rẹ̀ wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ ἐν ἐμοὶ nípa bí a ṣe fi Ọmọ náà hàn
  choice: A pa ‘nínú mi’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘sí mi’ tàbí ‘nípasẹ̀ mi’
  rationale: Gbólóhùn Gíríìkì lè tọ́ka sí ìṣípayá nínú Pọ́ọ̀lù, sí Pọ́ọ̀lù, tàbí nípasẹ̀ Pọ́ọ̀lù. Kí a má bàa yanju ìforígbárí ẹ̀kọ́ ìgbàgbọ́ tí orísun kò yanju, a fi àṣàyàn wọ̀nyí sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpéjọ, òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Àwọn tí kì í ṣe Júù’ ṣe kedere ju ọ̀rọ̀ àyálò kan lọ fún àwọn olùkà lónìí. A pa ìtẹ̀síwájú gírámà láti ẹsẹ tó ṣáájú mọ́ nípa bíbẹ̀rẹ̀ pẹ̀lú ‘láti.’
