source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: yo
  text: 'Gẹ́gẹ́ bí a ti sọ tẹ́lẹ̀, mo sì tún ń sọ báyìí pé: Bí ẹnikẹ́ni bá ń wàásù ìhìnrere kan fún yín tí ó lòdì sí ohun tí ẹ̀yin gbà[a], kí ẹni náà wà lábẹ́ ègún[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó kọjá ohun tí ẹ̀yin gbà”; gbólóhùn Gíríìkì náà lè tọ́ka sí yíyà kúrò nínú ìhìnrere tí ẹ ti gbà.
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí, “kí ẹni náà jẹ́ ẹni ègún”; ní Gíríìkì: anathema estō.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: Bí a ti sọ tẹ́lẹ̀
  rationale: Ó mú ìtumọ̀ ohun tí a ti sọ ṣáájú jáde, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé láì di líle.
- source_word: ἄρτι πάλιν λέγω
  choice: bẹ́ẹ̀ ni mo tún sọ nísinsin yìí
  rationale: “Nísinsin yìí” pa ìtọ́kasí sí àkókò ìsinsin mọ́, “tún” sì fi hàn pé Pọ́ọ̀lù ń ṣe àtúnsọ.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: Bí ẹnikẹ́ni bá ń wàásù ìhìnrere kan fún yín
  rationale: “Ń wàásù ìhìnrere” jẹ́ ọ̀nà àdánidá ní Yorùbá fún pípolongo ìhìnrere, “kan” sì jẹ́ kí ìyàtọ̀ láàárín ìhìnrere tí a gbà àti èyí tí ẹlòmíràn ń wàásù hàn kedere.
- source_word: παρ’ ὃ
  choice: tí ó lòdì sí ohun tí
  rationale: Nínú àyíká yìí, παρά fi ìyapa kúrò nínú iṣẹ́ tí wọ́n ti gbà hàn. “Lòdì sí” pa agbára ìkìlọ̀ Pọ́ọ̀lù mọ́; àṣàyàn “kọjá” wà nínú àlàyé ìsàlẹ̀.
- source_word: παρελάβετε
  choice: ẹ̀yin gbà
  rationale: “Gbà” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún gbígba iṣẹ́ tàbí ẹ̀kọ́ tí a fi léni lọ́wọ́.
- source_word: ἀνάθεμα ἔστω
  choice: kí ẹni náà wà lábẹ́ ègún
  rationale: Ó pa ìtumọ̀ ègún àti ìdájọ́ líle inú Gíríìkì mọ́, ó sì yàgò fún lílo ọ̀rọ̀ àjèjì tí ọ̀pọ̀ ènìyàn kò ní lóye.
theological_decisions:
- issue: Agbára ìdálẹ́bi inú ἀνάθεμα ἔστω
  choice: kí ẹni náà wà lábẹ́ ègún
  alternative: kí ẹni náà jẹ́ ẹni ègún
  rationale: Àṣàyàn yìí fi bí ìkìlọ̀ náà ṣe le tó hàn láì fi kún un pé Ọlọ́run ni a dárúkọ gẹ́gẹ́ bí ẹni tó ń fi ègún náà lé e, nítorí èyí kò hàn gbangba nínú gbólóhùn Gíríìkì.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì pa ìtẹnumọ́ àti ìkìlọ̀ líle Pọ́ọ̀lù mọ́.
