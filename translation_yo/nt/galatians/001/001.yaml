id: GAL.1.1
reference: Galatians 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: yo
  text: Pọ́ọ̀lù, àpọ́sítélì—tí kì í ṣe láti ọ̀dọ̀ àwọn ènìyàn, bẹ́ẹ̀ ni kì í ṣe nípasẹ̀ ènìyàn kan, ṣùgbọ́n nípasẹ̀ Jésù Mèsáyà àti Ọlọ́run Baba, ẹni tí ó jí i dìde láti inú àwọn òkú—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Ọ̀rọ̀ yìí jẹ́ oyè iṣẹ́ ìránṣẹ́ tí a fi àṣẹ rán, ó sì ti di ọ̀rọ̀ Bíbélì tí a mọ̀ ní Yorùbá; ó pa ìtumọ̀ ipa àti àṣẹ Pọ́ọ̀lù mọ́ ju ‘ojíṣẹ́’ lásán lọ.
- source_word: ἀπ’ ἀνθρώπων
  choice: láti ọ̀dọ̀ àwọn ènìyàn
  rationale: ἀπό pẹ̀lú genitive ń tọ́ka sí orísun. ‘Láti ọ̀dọ̀’ sọ orísun yẹn ní Yorùbá àdánidá, ‘àwọn ènìyàn’ sì pa plural mọ́.
- source_word: δι’ ἀνθρώπου
  choice: nípasẹ̀ ènìyàn kan
  rationale: διά pẹ̀lú genitive ń fi ẹni tí a lò gẹ́gẹ́ bí ọ̀nà tàbí aṣojú hàn. ‘Ẹ̀nìyàn kan’ pa singular mọ́, ó sì dá ìyàtọ̀ rẹ̀ sí ‘àwọn ènìyàn’ dúró.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ Jésù Mèsáyà
  rationale: Àtúnlò ‘nípasẹ̀’ pa ìbáramu àsọyé Greek mọ́. ‘Mèsáyà’ mú agbára oyè Χριστός jáde ní èdè Yorùbá láì sọ ọ́ di orúkọ ìdílé.
- source_word: θεοῦ πατρὸς
  choice: Ọlọ́run Baba
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ní iyì fún oyè apapọ̀ náà, ó sì pa Ọlọ́run Baba mọ́ gẹ́gẹ́ bí ẹni tí ó bá Jésù Mèsáyà ṣiṣẹ́ nínú rírán Pọ́ọ̀lù.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: ẹni tí ó jí i dìde kúrò nínú òkú
  rationale: Gbólóhùn náà ń ṣàpèjúwe Ọlọ́run Baba. ‘Jí i dìde kúrò nínú òkú’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ìjíǹde, tí ó sì pa ἐκ, ìjáde kúrò láàárín àwọn òkú, mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú ìkíni yìí, Χριστός ṣì ní agbára oyè ẹni tí a fòróró yàn, kì í ṣe orúkọ kejì lásán. ‘Mèsáyà’ pa agbára oyè náà mọ́, nígbà tí ‘Kristi’ jẹ́ àṣàyàn ibílẹ̀ tí ó wọ́pọ̀.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye. Àmì gígùn méjì yà àfikún ìtẹnumọ́ Pọ́ọ̀lù sọ́tọ̀, a sì fi gbólóhùn náà sílẹ̀ ní ìparí ṣíṣí nítorí pé ẹsẹ̀ 1 jẹ́ apá kan ti ìkíni tó ń tẹ̀ síwájú.
