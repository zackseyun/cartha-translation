  to: Pọ́ọ̀lù, àpọ́sítélì—tí kì í ṣe láti ọ̀dọ̀ àwọn ènìyàn, bẹ́ẹ̀ ni kì í ṣe nípasẹ̀ ènìyàn kan, ṣùgbọ́n nípasẹ̀ Jésù Mèsáyà àti Ọlọ́run Baba, ẹni tí ó jí i dìde láti inú àwọn òkú—
