id: GAL.1.4
reference: Galatians 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: yo
  text: ẹni tí ó fi ara rẹ̀ fún àwọn ẹ̀ṣẹ̀ wa, kí ó lè gbà wá là kúrò nínú ìgbà búburú tí ó wà nísinsìnyí[a], gẹ́gẹ́ bí ìfẹ́ Ọlọ́run àti Baba wa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ayé búburú ìsinsìnyí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόντος ἑαυτὸν
  choice: ẹni tí ó fi ara rẹ̀ fún
  rationale: Ó pa ìtumọ̀ fífi ara ẹni fúnni mọ́, ó sì fi hàn pé Kristi ṣe é tinútinú láìfi èrò mìíràn kún ọ̀rọ̀ náà.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: fún àwọn ẹ̀ṣẹ̀ wa
  rationale: “Fún” pa ìtumọ̀ ìràpadà àti aṣojú tó wà nínú ὑπέρ mọ́ láìsọ ọ́ di ẹ̀kọ́ pàtó kan nípa ètùtù; “àwọn ẹ̀ṣẹ̀” tún pa nọ́ńbà púpọ̀ Gíríìkì mọ́.
- source_word: ἐξέληται
  choice: gbà wá là kúrò nínú
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a yọ ènìyàn kúrò nínú ewu tàbí agbára ohun búburú.
- source_word: αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: ìgbà búburú tí ó wà nísinsìnyí
  rationale: “Ìgbà” mú ìtumọ̀ àkókò tàbí sáà inú αἰών jáde dáadáa ju “ayé” lọ; gbólóhùn ìbátan náà sì jẹ́ kó ṣe kedere pé sáà náà ni ó wà lọ́wọ́lọ́wọ́.
- source_word: κατὰ τὸ θέλημα
  choice: gẹ́gẹ́ bí ìfẹ́
  rationale: Ó sọ pé iṣẹ́ náà bá ète àti ìfẹ́ Ọlọ́run mu, ní ọ̀nà tí ó jẹ́ ti Yorùbá àdánidá.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: Ọlọ́run àti Baba wa
  rationale: Ó tẹ̀lé ìtò Gíríìkì, ó sì jẹ́ kí àwọn orúkọ méjèèjì tọ́ka sí ẹni kan náà.
theological_decisions:
- issue: Bóyá ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν yẹ kí a túmọ̀ rẹ̀ lọ́nà tí yóò sọ irú ètùtù kan pàtó
  choice: fún àwọn ẹ̀ṣẹ̀ wa
  alternative: nítorí àwọn ẹ̀ṣẹ̀ wa
  rationale: “Fún” pa agbára ẹ̀kọ́ ìràpadà inú ọ̀rọ̀ náà mọ́, ṣùgbọ́n kò dá ìtumọ̀ rẹ̀ mọ́ àlàyé ẹ̀kọ́ kan ṣoṣo.
- issue: Bóyá αἰών yẹ kí ó jẹ́ “ìgbà” tàbí “ayé”
  choice: ìgbà búburú tí ó wà nísinsìnyí
  alternative: ayé búburú ìsinsìnyí
  rationale: αἰών níbí ń tọ́ka ní pàtàkì sí sáà tàbí ètò àkókò tó wà lọ́wọ́lọ́wọ́; “ìgbà” pa ìtumọ̀ yẹn mọ́, nígbà tí àkọsílẹ̀ ìsàlẹ̀ ojú ìwé fi yíyan “ayé” hàn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A pa ìṣàn gbólóhùn ìbátan Gíríìkì mọ́ nítorí ẹsẹ yìí ń bá gbólóhùn ẹsẹ tó ṣáájú lọ.
