source:
  edition: SBLGNT
  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: yo
  text: Ṣùgbọ́n n kò rí àpọ́sítélì mìíràn, bí kò ṣe Jákọ́bù[a], arákùnrin Olúwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “N kò rí àpọ́sítélì mìíràn—Jákọ́bù nìkan ni mo rí, arákùnrin Olúwa.” Àwọn kan lóye ọ̀rọ̀ yìí pé kò ka Jákọ́bù sí àpọ́sítélì.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: ẹnikẹ́ni nínú … yòókù
  rationale: Pẹ̀lú τῶν ἀποστόλων, ọ̀rọ̀ náà ń tọ́ka sí ẹlòmíràn lára ẹgbẹ́ àwọn àpọ́sítélì; gbólóhùn Yòrùbá yìí sọ ìtumọ̀ apá-àpapọ̀ náà ní ti ẹ̀dá.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn sí ohun tí a sọ ṣáájú, “Ṣùgbọ́n” sì bá àyíká náà mu.
- source_word: ἀποστόλων
  choice: àwọn àpọ́sítélì
  rationale: Èyí ni ọ̀rọ̀ ìdásílẹ̀ tí ó mọ́gbọ́n dání fún ẹgbẹ́ àwọn tí a rán tí a mọ̀ sí àpọ́sítélì nínú àyíká Pọ́ọ̀lù.
- source_word: οὐκ εἶδον
  choice: n kò rí ẹnikẹ́ni
  rationale: Ó pa ìkọ̀sẹ̀ ìṣe àtijọ́ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti so mọ́ gbólóhùn apá-àpapọ̀ ní Yòrùbá.
- source_word: εἰ μὴ
  choice: bí kò ṣe
  rationale: Níhìn-ín ó mú ẹni tí a yọ sílẹ̀ wá, kì í ṣe gbólóhùn oníṣ شرط; “bí kò ṣe” ni ọ̀nà Yòrùbá tí ó bá a mu.
- source_word: Ἰάκωβον
  choice: Jákọ́bù
  rationale: Èyí ni àkọsílẹ̀ orúkọ Ἰάκωβος tí ó wọ́pọ̀ nínú Bíbélì Yòrùbá.
- source_word: ἀδελφὸν
  choice: arákùnrin
  rationale: Ìtumọ̀ tààrà tí ó wọ́pọ̀ jù ni arákùnrin; kò sí ohun kan nínú àyíká yìí tí ó béèrè fún ọ̀rọ̀ ìbátan tí ó gbòòrò sí i.
- source_word: τοῦ κυρίου
  choice: Olúwa
  rationale: Ọ̀nà ìní inú “arákùnrin Olúwa” jẹ́ Yòrùbá àdánidá, ó sì pa oyè κύριος mọ́ gẹ́gẹ́ bí “Olúwa.”
theological_decisions:
- issue: Bóyá gbólóhùn náà ka Jákọ́bù mọ́ àwọn àpọ́sítélì
  choice: Ọ̀rọ̀ àkọ́kọ́ fi Jákọ́bù hàn gẹ́gẹ́ bí ẹni tí a yọ sílẹ̀ kúrò nínú “àwọn àpọ́sítélì yòókù,” èyí tí ó sábà máa ń túmọ̀ sí pé a kà á mọ́ wọn.
  alternative: Àwọn kan lóye rẹ̀ pé Pọ́ọ̀lù kò rí àpọ́sítélì mìíràn yàtọ̀ sí Pétérù, ṣùgbọ́n ó tún rí Jákọ́bù láìfi dandan kà á sí àpọ́sítélì.
  rationale: εἰ μὴ sábà ń ṣàgbékalẹ̀ ohun tí a yọ sílẹ̀ nínú ọ̀rọ̀ tí ó ṣáájú. A pa ìṣòro ìtumọ̀ gidi náà mọ́ nípa fífi ẹsẹ̀ àlàyé hàn, láìfi ìdájọ́ ẹ̀kọ́ ìgbàgbọ́ kún ọ̀rọ̀ àkọ́kọ́.
translation_notes:
  register: Yòrùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere ni a lò. A lo “àpọ́sítélì” àti “Olúwa” gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tí àwọn òǹkàwé Yòrùbá mọ̀, pẹ̀lú àmì ohùn níbi tí ó bá yẹ.
