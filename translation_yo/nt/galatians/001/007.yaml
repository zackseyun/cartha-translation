base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: yo
  text: Èyí kì í ṣe ìhìn rere mìíràn; bí kò ṣe pé àwọn kan wà tí ń dá yín láàmú, tí wọ́n sì fẹ́ yí ìhìn rere Mèsáyà[a] padà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ba ìhìn rere Mèsáyà jẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: ìhìn rere mìíràn
  rationale: Orúkọ náà kò fara hàn nínú èdè Gíríìkì, ṣùgbọ́n εὐαγγέλιον inú ẹsẹ 6 ni a lóye; fífi “ìhìn rere” kún un mú kí Yorùbá ṣe kedere láì fi ìtumọ̀ tuntun kun un.
- source_word: εἰ μή
  choice: bí kò ṣe pé
  rationale: Níhìn-ín, gbólóhùn yìí ń ṣàlàyé ohun tó yàtọ̀ sí ọ̀rọ̀ tó ṣáájú, kì í ṣe pé ó ń gbé à条件 kan kalẹ̀; “bí kò ṣe pé” jẹ́ ọ̀nà Yorùbá tó bójú mu.
- source_word: ταράσσοντες
  choice: tí ń dá yín láàmú
  rationale: Ó fi ìṣe tó ń lọ lọ́wọ́ hàn, ó sì mú èrò ìdàrúdàpọ̀ àti wàhálà tí ọ̀rọ̀ Gíríìkì ní jáde ní Yorùbá adayeba.
- source_word: θέλοντες
  choice: tí wọ́n sì fẹ́
  rationale: “Fẹ́” sọ ète wọn ní kedere láì mú agbára ọ̀rọ̀ náà pọ̀ ju ti orísun lọ.
- source_word: μεταστρέψαι
  choice: yí ... po
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí yí ohun kan padà kúrò ní ìrísí tàbí ìtumọ̀ tó tọ́; “yí ... po” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún yíyí ìhìn rere dàrú.
- source_word: εὐαγγέλιον
  choice: ìhìn rere
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì ń pa agbára ọ̀rọ̀ ìkéde ìgbàlà mọ́.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ yìí, Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; “Mèsáyà” pa ìpilẹ̀ Júù ti oyè náà mọ́.
theological_decisions:
- issue: Bóyá Χριστοῦ jẹ́ oyè tàbí orúkọ tó ti dà bí orúkọ ẹni
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àyíká ọ̀rọ̀ lè gba “Kristi,” ṣùgbọ́n “Mèsáyà” mú oyè ẹni àmì-òróró náà hàn gbangba, láì pinnu bóyá ìhìn rere náà jẹ́ ti Mèsáyà tàbí nípa Mèsáyà; ìsopọ̀ orúkọ Yorùbá náà pa àìdánilójú genitive Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ adayeba, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. “Bí kò ṣe pé” pa ìbáṣepọ̀ ìṣàlàyé εἰ μή mọ́, “ìhìn rere Mèsáyà” sì kò fi tipátipá yan láàárín ìtumọ̀ ‘ti Mèsáyà’ àti ‘nípa Mèsáyà.’
