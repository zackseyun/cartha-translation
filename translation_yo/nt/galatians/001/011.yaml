id: GAL.1.11
reference: Galatians 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: yo
  text: Nítorí mo fẹ́ kí ẹ mọ̀, ẹ̀yin ará[a], pé ìhìn rere tí mo kéde kì í ṣe ti orísun ènìyàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní gírámà, ṣùgbọ́n ó lè túmọ̀ sí gbogbo àwọn arákùnrin àti arábìnrin nínú ìjọ.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “kò ṣe gẹ́gẹ́ bí ènìyàn”; gbólóhùn náà tún lè túmọ̀ sí pé kò bá ìlànà tàbí èrò ènìyàn mu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: mo fẹ́ kí ẹ mọ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ ní ti gidi sí ‘mo sọ di mímọ̀ fún yín,’ ṣùgbọ́n níhìn-ín ó jẹ́ ọ̀nà àdánidá láti mú àlàyé pàtàkì wọlé. ‘Mo fẹ́ kí ẹ mọ̀’ sọ agbára rẹ̀ jáde ní Yorùbá òde òní láìfi èrò kún un.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní gírámà, nínú lílò Pọ́ọ̀lù ó sábà máa ń tọ́ka sí gbogbo àwọn onígbàgbọ́. ‘Ẹ̀yin ará’ jẹ́ ọ̀rọ̀ àdánidá, ọlọ́lá, tí ó sì lè gba gbogbo ìjọ.
- source_word: εὐαγγέλιον
  choice: ìhìn rere
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó wọ́pọ̀, fún ìkéde ìgbàlà tí Pọ́ọ̀lù ń tọ́ka sí.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: tí mo kéde
  rationale: Ó pa ìtumọ̀ iṣẹ́ ìkéde ní gbangba mọ́, ó sì jẹ́ Yorùbá àdánidá.
- source_word: κατὰ ἄνθρωπον
  choice: ti orísun ènìyàn
  rationale: Àyíká ẹsẹ̀ 12 tẹnu mọ́ pé Pọ́ọ̀lù kò gba ìhìn rere náà lọ́wọ́ ènìyàn; nítorí náà, ìtumọ̀ tó kan orísun ló bá àríyànjiyàn náà mu jù. Àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
theological_decisions:
- issue: Bóyá κατὰ ἄνθρωπον ń tọ́ka sí orísun ènìyàn tàbí sí ìlànà/èrò ènìyàn
  choice: kì í ṣe ti orísun ènìyàn
  alternative: kò bá ìlànà ènìyàn mu; ní tààrà, ‘kò ṣe gẹ́gẹ́ bí ènìyàn’
  rationale: Ẹsẹ̀ tó tẹ̀ lé e sọ pé Pọ́ọ̀lù kò gba a lọ́wọ́ ènìyàn, bẹ́ẹ̀ ni ènìyàn kò kọ́ ọ nípa rẹ̀. Èyí mú ìtumọ̀ orísun lágbára, ṣùgbọ́n akọsilẹ̀ pa àìdánilójú gidi inú gbólóhùn Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, àti ‘ẹ̀yin ará’ gẹ́gẹ́ bí ìkíni ìjọ tó gba gbogbo ènìyàn.
