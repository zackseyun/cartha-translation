id: GAL.1.6
reference: Galatians 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: yo
  text: Ó yà mí lẹ́nu pé ẹ̀ ń fi ẹni tí ó pè yín nínú oore-ọ̀fẹ́ Mèsáyà[a][b] sílẹ̀ bẹ́ẹ̀ kíákíá, tí ẹ̀ sì ń yí sí ìhìn rere mìíràn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ oore-ọ̀fẹ́ Mèsáyà.” Ọ̀rọ̀ aṣáájú Gíríìkì náà lè túmọ̀ sí ààyè tí ìpè náà wà tàbí ohun èlò tí a fi pè wọ́n.
    reason: alternative_reading
  - marker: b
    text: Gíríìkì ní “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “sí ìhìn rere tí ó yàtọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: Ó yà mí lẹ́nu
  rationale: Ọ̀rọ̀ Yorùbá àdánidá yìí fi ìyàlẹ́nu líle àti àìtẹ́lọ́rùn Paulu hàn, kì í ṣe ìyanilẹ́nu aláìdásí-tọ́hùn-ún nìkan.
- source_word: οὕτως ταχέως
  choice: bẹ́ẹ̀ kíákíá
  rationale: Ó pa ìtẹnumọ́ mọ́ lórí bí ìyípadà wọn ṣe yára tó ní ọ̀nà tí ó bá Yorùbá òde òní mu.
- source_word: μετατίθεσθε
  choice: ẹ̀ ń fi … sílẹ̀ … tí ẹ̀ sì ń yí sí
  rationale: 'Ìtumọ̀ oníṣísẹ̀lẹ̀ yìí fi mejeeji hàn: pé wọ́n ń kọ ẹni tí ó pè wọ́n sílẹ̀, wọ́n sì ń yí sí ọ̀nà mìíràn; ó tún pa ìṣe tí ó ń lọ lọ́wọ́ nínú ọ̀rọ̀ Gíríìkì mọ́.'
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: ẹni tí ó pè yín
  rationale: Ó tọ́ka sí ìpè tí ó ti ṣẹlẹ̀, láì fi ‘Ọlọ́run’ tàbí ‘Mèsáyà’ kún ọ̀rọ̀ tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐν χάριτι Χριστοῦ
  choice: nínú oore-ọ̀fẹ́ Mèsáyà
  rationale: ‘Nínú’ pa ààyè ìtumọ̀ ἐν mọ́ gẹ́gẹ́ bí ipò tàbí agbègbè oore-ọ̀fẹ́, nígbà tí àlàyé ìsàlẹ̀ fi ọ̀nà ìtumọ̀ irinṣẹ́ (‘nípasẹ̀’) hàn.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; ‘Mèsáyà’ mú ìtumọ̀ oyè náà wá sínú Yorùbá dípò kí ó di orúkọ lásán.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: sí ìhìn rere mìíràn
  rationale: ‘Sí’ fi ìṣípò sí ibi tuntun hàn, ‘mìíràn’ sì pa ààyè mọ́ fún ìtumọ̀ ‘òmíràn’ tàbí ‘èyí tí ó yàtọ̀,’ gẹ́gẹ́ bí ẹsẹ tó tẹ̀ lé ṣe ń ṣàlàyé.
theological_decisions:
- issue: Ta ni ‘ẹni tí ó pè yín’ ń tọ́ka sí?
  choice: A kò sọ orúkọ ẹni náà ní tààrà nínú àkọsílẹ̀ pàtàkì.
  alternative: ‘Ọlọ́run tí ó pè yín’ tàbí ‘Mèsáyà tí ó pè yín.’
  rationale: Gíríìkì fi ẹni náà sílẹ̀ láì sọ orúkọ rẹ̀; ìtumọ̀ náà pa àìsọ-kedere yìí mọ́, kò sì yan ìpinnu ẹ̀kọ́ ìgbàgbọ́ kan fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìsọ̀rọ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé lasán; a yẹra fún ọ̀rọ̀ ìjọ kan pàtó àti fún ṣíṣe ẹni tí ó pè wọ́n ní kedere ju orísun lọ.
