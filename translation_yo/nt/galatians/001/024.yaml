id: GAL.1.24
reference: Galatians 1:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐδόξαζον ἐν ἐμοὶ τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/024.yaml
  text: And they glorified God because of me[a].
translation:
  language: yo
  text: Wọ́n sì ń yin Ọlọ́run lógo nítorí mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ gangan, “nínú mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: sì
  rationale: Asopọ̀ ìtàn tó bá èdè Yorùbá mu; ó ń tẹ̀síwájú láti inú ohun tí a sọ ṣáájú.
- source_word: ἐδόξαζον
  choice: ń yin … lógo
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí fífi ògo tàbí ọlá fún ẹni kan. Àmì “ń” fi ìṣe tó ń lọ lọ́wọ́ tàbí tó ń ṣẹlẹ̀ léraléra hàn, gẹ́gẹ́ bí àkókò imperfect Gíríìkì.
- source_word: ἐν ἐμοὶ
  choice: nítorí mi
  rationale: Nínú àyíká ọ̀rọ̀ náà, gbólóhùn yìí tọ́ka sí pé ohun tó ṣẹlẹ̀ sí Paulu ló mú kí wọ́n yin Ọlọ́run lógo. Ìtumọ̀ gangan, “nínú mi,” wà nínú àlàyé ìsàlẹ̀.
- source_word: τὸν θεόν
  choice: Ọlọ́run
  rationale: Ọlọ́run ni olùgbà ìṣe ἐδόξαζον; “Ọlọ́run” ni ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì bá àyíká mu.
theological_decisions:
- issue: Ìtumọ̀ ἐν ἐμοὶ
  choice: 'Ìtumọ̀ okùnfà/ìbáṣepọ̀: “nítorí mi”'
  alternative: 'Ìtumọ̀ ibi tàbí ọ̀nà: “nínú mi”'
  rationale: Àyíká ọ̀rọ̀ náà sọ bí àwọn ìjọ Jùdíà ṣe dáhùn sí ìròyìn nípa ìyípadà àti iṣẹ́ ìránṣẹ́ Paulu. “Nítorí mi” mú okùnfà ìyìn wọn yé kedere, ṣùgbọ́n a pa ìtumọ̀ gangan àti àìdánilójú tó wà nínú ọ̀rọ̀ Gíríìkì mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti èyí tí ó rọrùn fún òǹkàwé òde òní. A lo “ń” láti fi ìṣe tó ń bá a lọ hàn, a sì lo gbólóhùn àdábọ̀ Yorùbá “yin … lógo.”
