id: GAL.1.10
reference: Galatians 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: yo
  text: Nítorí, ṣé mo ń gbìyànjú láti mú àwọn ènìyàn gbàgbọ́ nísinsìnyí, tàbí Ọlọ́run?[a] Tàbí ṣé mo ń wá láti tẹ́ àwọn ènìyàn lọ́rùn? Bí mo bá ṣì ń tẹ́ àwọn ènìyàn lọ́rùn, èmi kì bá jẹ́ ẹrú Mèsáyà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣé ìtẹ́wọ́gbà àwọn ènìyàn ni mo ń wá nísinsìnyí, tàbí ti Ọlọ́run?”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìránṣẹ́ Kristi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: nísinsìnyí
  rationale: Ó fi ipò Pọ́ọ̀lù ní àkókò yìí hàn, ó sì lè yà á sọ́tọ̀ sí ìgbésí ayé rẹ̀ tẹ́lẹ̀.
- source_word: πείθω
  choice: ń gbìyànjú láti yí lọ́kàn padà
  rationale: Ó pa ìtumọ̀ ìṣe ìrọ̀rùn tàbí ìmúni gbàgbọ́ mọ́, láì tú ìbéèrè aláròjinlẹ̀ náà sí ìwá ìtẹ́wọ́gbà nìkan.
- source_word: ἀνθρώπους
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹ̀dá ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: θεόν
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ tààrà, ó sì pa ìtakora inú ìbéèrè náà mọ́.
- source_word: ζητῶ
  choice: mo ń wá ọ̀nà
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìsapá tí ń lọ lọ́wọ́.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: tẹ́ ... lọ́rùn / ń tẹ́ ... lọ́rùn
  rationale: Gbólóhùn Yorùbá yìí túmọ̀ sí ṣíṣe ohun tí yóò mú inú ẹni dùn tàbí rí ìtẹ́wọ́gbà rẹ̀.
- source_word: εἰ ἔτι
  choice: Ìbá ṣe pé mo ṣì
  rationale: Ó mú ipò àròsọ tí kò bá òtítọ́ lọ́wọ́ àti ìtumọ̀ ‘ṣì’ jáde ní Yorùbá.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: A lò orúkọ oyè náà níbí nítorí pé ìní àti ìfaramọ́ sí ẹni tí a yàn jẹ́ kókó ọ̀rọ̀ náà.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Ó pa agbára ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ẹni tí ó jẹ́ ohun-ìní olúwa tí ó sì fara mọ́ ọn pátápátá, dípò ìránṣẹ́ lásán.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ δοῦλος
  choice: ẹrú Mèsáyà
  alternative: ìránṣẹ́ Kristi
  rationale: ‘Ẹrú Mèsáyà’ fi ìní, ìgbọràn àti ìfaramọ́ pátápátá tí ó tako wíwá ìtẹ́wọ́gbà ènìyàn hàn; àmọ́ ‘ìránṣẹ́ Kristi’ jẹ́ ìtumọ̀ tí ó rọrùn sí etí tí ó sì wọ́pọ̀.
- issue: Ìtumọ̀ πείθω pẹ̀lú Ọlọ́run gẹ́gẹ́ bí ohun tí ìṣe náà kàn
  choice: ń gbìyànjú láti yí lọ́kàn padà
  alternative: ń wá ìtẹ́wọ́gbà lọ́dọ̀
  rationale: A pa ìbéèrè aláròjinlẹ̀ àti àìgbọ́dọ̀máṣe inú ọ̀rọ̀ Gíríìkì mọ́, dípò yíyan ìtumọ̀ ìtẹ́wọ́gbà láìjẹ́ kí òǹkàwé mọ̀ pé ìtumọ̀ mìíràn ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ; àwọn ìbéèrè méjèèjì dúró gẹ́gẹ́ bí ìbéèrè aláròjinlẹ̀, ìparí sì lo àkànṣe àìṣeéṣe ‘Ìbá ṣe pé ... kì bá ...’.
