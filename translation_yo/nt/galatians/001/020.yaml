  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: yo
  text: 'Ẹ kíyè sí i[a]: ohun tí mo sì ń kọ sí yín, níwájú Ọlọ́run[b], èmi kò purọ́.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ἰδού jẹ́ ọ̀rọ̀ ìtẹnumọ́ tó ń pe olùgbọ́ láti kíyè sí ohun tí ó tẹ̀ lé; a tún lè túmọ̀ rẹ̀ sí “ẹ wò ó.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ní ojú Ọlọ́run,” ìyẹn, ní iwájú rẹ̀ tàbí níbi tí ó ti ń jẹ́rìí sí ohun tí a sọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: Ohun tí
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ ọ̀pọ̀, ó ń ṣiṣẹ́ ní ọ̀nà àkójọpọ̀ níbí; “Ohun tí” jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí gbogbo ohun tí Pọ́ọ̀lù ń kọ.
- source_word: δὲ
  choice: sì
  rationale: “Sì” fi ìyípadà ọ̀rọ̀ pẹ̀lẹ́pẹ̀lẹ́ hàn láì sọ ọ́ di àtakò líle.
- source_word: γράφω ὑμῖν
  choice: mo ń kọ sí yín
  rationale: Àmì “ń” pa ìṣe àsìkò ìsinsìnyí mọ́, “sí yín” sì fi àwọn tí lẹ́tà náà ń lọ bá hàn.
- source_word: ἰδοὺ
  choice: ẹ kíyè sí i
  rationale: Ó mú ìtẹnumọ́ àti ìpe fún àfiyèsí tó wà nínú ἰδού jáde ní Yorùbá òde òní, láì lo ọ̀rọ̀ àtijọ́ tí kò ṣe kedere.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Ó pa ìtumọ̀ wíwà ní iwájú Ọlọ́run àti jíjẹ́ oníṣiro fún un mọ́, pẹ̀lú agbára ọ̀rọ̀ ìjẹ́rìí mímọ́.
- source_word: ὅτι
  choice: '[a kò túmọ̀ ọ́ lọ́tọ̀]'
  rationale: Ó ṣí àkóónú ìjẹ́rìí náà sílẹ̀, ṣùgbọ́n èdè Yorùbá sọ ọ́ lọ́nà àdánidá láì fi “pé” kún un níbí.
- source_word: οὐ ψεύδομαι
  choice: èmi kò purọ́
  rationale: “Èmi” mú ìtẹnumọ́ arọ́pò-orúkọ inú gbólóhùn Gíríìkì náà jáde, “kò purọ́” sì jẹ́ ìkọ̀sílẹ̀ tààrà pé ohun tí ó sọ kì í ṣe irọ́.
theological_decisions:
- issue: Agbára ìtọ́ka Pọ́ọ̀lù sí Ọlọ́run
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí ìjẹ́rìí mímọ́ níwájú Ọlọ́run: “níwájú Ọlọ́run, èmi kò purọ́.”'
  alternative: Kí a kà á sí ọ̀nà ìtẹnumọ́ lásán tí kò ní ìtumọ̀ jíjẹ́ oníṣiro níwájú Ọlọ́run.
  rationale: ἐνώπιον τοῦ θεοῦ fi hàn pé Pọ́ọ̀lù ń sọ̀rọ̀ gẹ́gẹ́ bí ẹni tó wà níwájú Ọlọ́run, ṣùgbọ́n a kò sọ ọ́ di ìbúra àgbékalẹ̀ kan tí Gíríìkì kò sọ ní tààrà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ti òde òní, tó ní iyì. Àmì ìdádúró yí “ẹ kíyè sí i” ká láti fi ìtẹnumọ́ ἰδού hàn, nígbà tí “níwájú Ọlọ́run” pa ìwọ̀n ọ̀rọ̀ ìjẹ́rìí mímọ́ náà mọ́.
