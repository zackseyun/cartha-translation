id: GAL.1.17
reference: Galatians 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: yo
  text: Èmi kò sì gòkè lọ sí Jerúsálẹ́mù sọ́dọ̀ àwọn tí wọ́n jẹ́ aposteli ṣáájú mi; ṣùgbọ́n mo lọ sí Arábíà, mo sì tún padà sí Damásíkù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Bẹ́ẹ̀ ni ... kò
  rationale: Ó so gbólóhùn yìí mọ́ ìsẹ̀lẹ̀ àkọ́kọ́, ó sì ń tẹ̀ síwájú nínú ìkọ̀sílẹ̀; ọ̀nà yìí jẹ́ Yorùbá àdánidá fún ‘nor ...’.
- source_word: ἀνῆλθον
  choice: gòkè lọ
  rationale: Ó pa ìtumọ̀ ìrìn-àjò gòkè lọ sí Jerúsálẹ́mù mọ́, gẹ́gẹ́ bí lílo ọ̀rọ̀ náà nígbà tí a ń lọ sí ìlú náà.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Orúkọ ìlú náà ní ìkọ̀wé Yorùbá tí ó wọ́pọ̀.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: sọ́dọ̀ àwọn tí ó ti jẹ́ aposteli ṣáájú mi
  rationale: ‘Sọ́dọ̀’ dúró fún ìlọ sí ọ̀dọ̀ àwọn ènìyàn, ‘ṣáájú mi’ sì fi ipò wọn ní àkókò hàn láì sọ pé wọ́n ga ní ipò ju Pọ́ọ̀lù lọ.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín àìlọ sí Jerúsálẹ́mù àti lílọ sí Arábíà.
- source_word: ἀπῆλθον
  choice: mo lọ
  rationale: Nínú Yorùbá, ‘mo lọ sí’ jẹ́ ọ̀nà àdánidá láti sọ ìkúrò lọ sí ibòmíràn; fífi ‘kúrò’ kún un kò pọndandan ní àyíká yìí.
- source_word: Ἀραβίαν
  choice: Arábíà
  rationale: Ìkọ̀wé Yorùbá fún orúkọ agbègbè náà, láì pinnu bí ààlà rẹ̀ ti tó ní ìtàn.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Damásíkù ni Pọ́ọ̀lù padà sí lẹ́ẹ̀kan sí i.
- source_word: ὑπέστρεψα
  choice: padà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìrìn-àjò padà sí ibi kan mu.
- source_word: Δαμασκόν
  choice: Damásíkù
  rationale: Ìkọ̀wé Yorùbá fún orúkọ ìlú náà.
theological_decisions:
- issue: Ìtumọ̀ ‘ṣáájú mi’ nípa àwọn aposteli
  choice: Àwọn tí wọ́n ti jẹ́ aposteli ní àkókò ṣáájú Pọ́ọ̀lù
  alternative: Àwọn aposteli tí wọ́n ga ní ipò ju Pọ́ọ̀lù lọ
  rationale: πρὸ ἐμοῦ sábà ń tọ́ka sí ṣíṣáájú ní àkókò. Ìtumọ̀ náà pa èyí mọ́, kò sì fi èrò nípa ipò ọlá kún ohun tí ẹsẹ náà kò sọ.
translation_notes:
  register: Yorùbá ìgbàlódé, tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn níbi tó bá yẹ; àwọn orúkọ ilẹ̀ òkèèrè ni a kọ ní ìbámu pẹ̀lú ìpè Yorùbá. ‘Aposteli’ ni a lò gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí ó ti wọ́pọ̀.
