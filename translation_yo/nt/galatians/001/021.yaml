  text: ἔπειτα ἦλθον εἰς τὰ κλίματα τῆς Συρίας καὶ τῆς Κιλικίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/021.yaml
  text: Then I went into the regions of Syria and Cilicia[a][b].
translation:
  language: yo
  text: Lẹ́yìn náà, mo lọ sí àwọn ẹkùn ilẹ̀ Síríà àti Kílíkíà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα
  choice: Lẹ́yìn náà
  rationale: Ó fi ìtẹ̀síwájú àkókò nínú ìtàn Pọ́ọ̀lù hàn ní èdè Yorùbá àdánidá.
- source_word: ἦλθον
  choice: mo lọ
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí ‘mo dé’ tàbí ‘mo wá,’ ‘mo lọ’ bá ìrìn-àjò kúrò ní ibi tí a mẹ́nu kàn tẹ́lẹ̀ mu jù lọ nínú àyíká ọ̀rọ̀ yìí.
- source_word: εἰς
  choice: sí
  rationale: ‘Sí’ sọ ìdarí ìrìn-àjò sí ibi kan ní kedere; Yorùbá kò nílò láti fi ìyàtọ̀ ‘sí/inú’ hàn níbi yìí.
- source_word: κλίματα
  choice: àwọn ẹkùn ilẹ̀
  rationale: Ó tọ́ka sí àwọn agbègbè ilẹ̀ tàbí àgbègbè ìṣàkóso, kì í ṣe ìlú kan ṣoṣo; ‘àwọn ẹkùn ilẹ̀’ jẹ́ kedere, ó sì bá ọ̀pọ̀ κλίματα mu.
- source_word: Συρίας
  choice: Síríà
  rationale: Ìkọ̀wé orúkọ ilẹ̀ náà ní Yorùbá pẹ̀lú àmì ohùn.
- source_word: Κιλικίας
  choice: Kílíkíà
  rationale: Ìkọ̀wé orúkọ ilẹ̀ náà ní Yorùbá pẹ̀lú àmì ohùn.
theological_decisions: []
