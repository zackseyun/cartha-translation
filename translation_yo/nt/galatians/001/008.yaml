  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: yo
  text: Ṣùgbọ́n bí àwa pàápàá, tàbí áńgẹ́lì kan láti ọ̀run, bá kéde ìhìn rere fún yín tí ó yàtọ̀ sí èyí tí àwa ti kéde ìhìn rere fún yín[a], kí ó wà lábẹ́ ègún[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó tako èyí tí àwa ti kéde ìhìn rere fún yín,” tàbí “tí ó kọjá èyí tí àwa ti kéde ìhìn rere fún yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ó jẹ́ anatema,” tàbí “kí ó jẹ́ ẹni ègún.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: Ṣùgbọ́n bí ... pàápàá ... bá
  rationale: Èyí mú ìtakò ἀλλά, ìtẹnumọ́ καί, àti ipò àròsọ ἐάν jáde ní Yorùbá àdánidá.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: àwa pàápàá tàbí áńgẹ́lì kan láti ọ̀run
  rationale: “Àwa pàápàá” fi ìtẹnumọ́ ara ẹni Paulu hàn, “áńgẹ́lì kan láti ọ̀run” sì pa ìyàtọ̀ gíga ti ońṣẹ́ ọ̀run mọ́.
- source_word: εὐαγγελίζηται
  choice: kéde ìhìn rere kan
  rationale: Ó tú ọ̀rọ̀-ìṣe Gíríìkì náà jáde ní tààrà, ní èdè Yorùbá tí ó ṣe kedere, dípò lílo ọ̀rọ̀-orúkọ kan ṣoṣo fún ‘ìhìnrere.’
- source_word: παρ’ ὃ
  choice: tí ó yàtọ̀ sí èyí tí
  rationale: “Yàtọ̀ sí” pa ààyè ìtumọ̀ παρά mọ́ láàárín ohun tí ó tako, ohun tí ó kọjá, tàbí ohun mìíràn ju ìkéde àkọ́kọ́ lọ, láìfi ìtumọ̀ kan ṣoṣo múlẹ̀ ju bí Gíríìkì ṣe ṣe lọ.
- source_word: εὐηγγελισάμεθα
  choice: àwa ti kéde fún yín
  rationale: Ó pa ìbáṣepọ̀ pẹ̀lú εὐαγγελίζηται mọ́, ṣùgbọ́n ó yẹra fún àtúnṣe gbolohun tí kò ṣe pàtàkì ní Yorùbá.
- source_word: ἀνάθεμα ἔστω
  choice: kí ẹni náà wà lábẹ́ ègún
  rationale: Ó sọ agbára ìdájọ́ àti ègún inú gbolohun náà ní èdè òde òní tí àwọn ènìyàn lè lóye, láìgbé ọ̀rọ̀ ìmọ̀-ẹ̀sìn àkànṣe wọlé.
theological_decisions:
- issue: Ìtumọ̀ àṣẹ ègún Paulu
  choice: “kí ẹni náà wà lábẹ́ ègún” gẹ́gẹ́ bí ìkéde ìdájọ́ gidi sí ẹni tí ó ń kéde ìhìn tí ó yàtọ̀ sí ti àwọn aposteli
  alternative: “kí ó di ẹni ègún” tàbí lílo “anatema” gẹ́gẹ́ bí ọ̀rọ̀ ìyọkúrò nínú ìjọ
  rationale: Ọ̀rọ̀ náà le, ó sì ní agbára ìdájọ́; ìtumọ̀ yìí pa ìwúwo náà mọ́ láìfi ìtumọ̀ ìlànà ìjọ ti ìgbà tó tẹ̀ lé e kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. “Ìhìn rere” tú ọ̀rọ̀-ìṣe Gíríìkì jáde, “lábẹ́ ègún” sì jẹ́ èdè òde òní tí ó pa ìwúwo ìdájọ́ mọ́.
