- from: Ṣùgbọ́n bí àwa pàápàá tàbí áńgẹ́lì kan láti ọ̀run bá kéde ìhìn rere kan fún yín tí ó yàtọ̀ sí èyí tí àwa ti kéde fún yín[a], kí ẹni náà wà lábẹ́ ègún[b].
  to: Ṣùgbọ́n bí àwa pàápàá, tàbí áńgẹ́lì kan láti ọ̀run, bá kéde ìhìn rere fún yín tí ó yàtọ̀ sí èyí tí àwa ti kéde ìhìn rere fún yín[a], kí ó wà lábẹ́ ègún[b].
  rationale: Àtúnṣe náà yọ ‘kan’ kúrò láti má ṣe dín tàbí yí ìtumọ̀ εὐαγγελίζηται padà. Ó tún ṣe àtúnṣe ìṣètò gbolohun àti àmì ìdákẹ́gbẹ́ fún Yorùbá adayeba. A tún ṣe àlàyé ìsàlẹ̀ nípa ἀνάθεμα kí ó má bàa sọ ìtumọ̀ ìkéde ègún di ohun tí ń ‘dé bá’ ènìyàn.
