    rationale: Ó jẹ́ ìlò tí kò wọ́pọ̀, ó sì dábàá pé anatema jẹ́ ohun tó ṣẹlẹ̀ sí ẹni náà, kì í ṣe ìkéde pé ẹni náà wà ní ipò ègún.
