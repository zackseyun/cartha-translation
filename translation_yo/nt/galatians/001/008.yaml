    issue: Ọ̀rọ̀ náà fi ‘kan’ kún ‘ìhìn rere.’
    rationale: ‘Kan’ kò wà nínú Gíríìkì gẹ́gẹ́ bí apá ìtumọ̀ tí ó yẹ níhìn-ín, ó sì lè jẹ́ kí ìtumọ̀ dà bí ẹni pé ọ̀pọ̀ ìhìn rere ló wà.
  - severity: low
    issue: Ìṣètò ‘àwa pàápàá tàbí áńgẹ́lì kan láti ọ̀run’ lè túbọ̀ ṣe kedere pẹ̀lú àmì ìdákẹ́gbẹ́.
    rationale: Àwọn àmì wọ̀nyí ń ya àwọn aṣàyàn méjèèjì sọ́tọ̀, wọ́n sì ń ràn olùkà lọ́wọ́ láti mọ ibi tí gbolohun ipò náà ti bẹ̀rẹ̀.
  - severity: medium
