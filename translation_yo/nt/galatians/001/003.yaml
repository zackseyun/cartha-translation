id: GAL.1.3
reference: Galatians 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸂καὶ κυρίου ἡμῶν⸃ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: yo
  text: Oore-ọ̀fẹ́ àti àlàáfíà fún yín láti ọ̀dọ̀ Ọlọ́run Baba wa àti Olúwa wa Jésù Mèsáyà,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Jésù Kristi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: Oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún oore tí a fi fúnni láìjẹ́ pé ẹni náà tọ́ sí i; ó tún pa ìtumọ̀ ìkíni àti ìbùkún inú lẹ́tà Paulu mọ́.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ọ̀nà àdánidá ni èdè Yorùbá láti sọ ẹni tí ìbùkún náà jẹ́ fún; ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ènìyàn náà sì hàn kedere.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìkíni àlàáfíà, ó sì lè gbé ìtumọ̀ ìbágbépọ̀ rere àti ìgbé-ayé pípé tí ọ̀rọ̀ Gíríìkì náà ní.
- source_word: ἀπό
  choice: láti ọ̀dọ̀
  rationale: Ó fi orísun oore-ọ̀fẹ́ àti àlàáfíà náà hàn ní Yorùbá àdánidá.
- source_word: θεοῦ πατρὸς
  choice: Ọlọ́run Baba wa
  rationale: Ìtumọ̀ yìí bá ìsopọ̀ gírámà tí ó lóye ἡμῶν pẹ̀lú πατρός mu, ó sì jẹ́ ọ̀nà àdánidá àti ọlọ́lá ní Yorùbá.
- source_word: κυρίου ἡμῶν
  choice: Olúwa wa
  rationale: “Olúwa” pa agbára orúkọ oyè κύριος àti ìtumọ̀ Kristẹni rẹ̀ mọ́; “wa” sì tú ἡμῶν ní tààrà.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: “Mèsáyà” tú Χριστός gẹ́gẹ́ bí orúkọ oyè ẹni àmì òróró, dípò kí a mú un bí orúkọ ìdílé; a fi ìtumọ̀ ìbílẹ̀ “Kristi” sí àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bóyá kí Χριστοῦ jẹ́ orúkọ oyè tí a tú sí “Mèsáyà” tàbí kí a lò ọ̀nà ìbílẹ̀ “Kristi”
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: Nínú ìkíni yìí, Χριστός ṣì ní agbára orúkọ oyè ẹni àmì òróró. “Mèsáyà” mú ìtumọ̀ náà hàn gbangba, nígbà tí àlàyé ìsàlẹ̀ pa ọ̀nà ìbílẹ̀ mọ́.
- issue: Ẹni tí ἡμῶν (“wa”) ń ṣàpèjúwe nínú gbolohun náà
  choice: Baba wa àti Olúwa wa
  alternative: Ọlọ́run Baba àti Olúwa wa
  rationale: Bí ó tilẹ̀ jẹ́ pé ἡμῶν dúró lẹ́yìn κυρίου nínú ìtẹ̀jáde Gíríìkì, ìṣètò ọ̀rọ̀ náà lè jẹ́ kí ó kan “Baba” àti “Olúwa” pọ̀; èyí sì ni ìtumọ̀ àdánidá jù lọ ní Yorùbá láìsọ pé Baba àti Olúwa jẹ́ ẹni kan náà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pa ìrísí ìkíni aláìlódì Gíríìkì mọ́ nípa gbólóhùn orúkọ “Oore-ọ̀fẹ́ àti àlàáfíà fún yín,” dípò fífi ọ̀rọ̀-ìṣe tí kò sí nínú orísun kún un.
