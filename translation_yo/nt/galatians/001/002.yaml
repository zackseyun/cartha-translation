  text: 'àti gbogbo àwọn arákùnrin tí wọ́n wà pẹ̀lú mi[a], sí àwọn ìjọ ní Galátíà:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn arákùnrin àti arábìnrin.” Ọ̀rọ̀ Gíríìkì náà ní “àwọn arákùnrin,” ṣùgbọ́n ó lè kan àwọn onígbàgbọ́ ọkùnrin àti obìnrin náà.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: àti gbogbo àwọn arákùnrin tí ó wà pẹ̀lú mi
  rationale: Ọ̀rọ̀ náà ń tẹ̀ síwájú láti ẹsẹ̀ 1, nítorí náà a lo “àti” ní lẹ́tà kékeré. ἀδελφοί jẹ́ ọ̀pọ̀ akọ ní gírámà, a sì túmọ̀ rẹ̀ sí “àwọn arákùnrin”; ó lè tọ́ka sí àwọn onígbàgbọ́ ọkùnrin àti obìnrin, a sì fi àlàyé yẹn sínú àlàyé ìsàlẹ̀.
- source_word: ἐκκλησίαις
  choice: àwọn ìjọ
  rationale: “Ìjọ” ni ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì jẹ́ àdánidá fún àwọn àwùjọ onígbàgbọ́ nínú ìkíni lẹ́tà Paulu.
- source_word: τῆς Γαλατίας
  choice: ní Galátíà
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lo ẹ̀yà oníhun, “àwọn ìjọ ní Galátíà” ni ọ̀nà Yorùbá tó ṣe àdánidá jù lọ láti fi hàn pé àwọn ìjọ náà wà ní agbègbè Galátíà.
- source_word: καὶ
  choice: àti
  rationale: Àsopọ̀ náà so àwọn olùránṣẹ́ yìí mọ́ Paulu ní ẹsẹ̀ 1; “àti” pa ìtẹ̀síwájú gbólóhùn náà mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣe kedere. A pa ìtẹ̀síwájú lẹ́tà náà mọ́ pẹ̀lú “àti” ní ìbẹ̀rẹ̀, a sì fi àmì ohùn sí ibi tí ó yẹ.
