source:
  edition: SBLGNT
  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: yo
  text: Lẹ́yìn náà, nígbà tí ọdún mẹ́ta ti kọjá, mo gòkè lọ sí Jerúsálẹ́mù láti bẹ Kéfà wò[a][b], mo sì dúró lọ́dọ̀ rẹ̀ fún ọjọ́ mẹ́ẹ̀ẹ́dógún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti lọ mọ Kéfà dáadáa”; ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí pípadé ẹnì kan kí ènìyàn lè mọ̀ ọ́n nípasẹ̀ ìbárẹ́ ara ẹni.
    reason: lexical_alternative
  - marker: b
    text: Kéfà ni orúkọ Aramaiki fún Pétérù.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔπειτα
  choice: Lẹ́yìn náà
  rationale: Ó fi ìṣẹ̀lẹ̀ tó tẹ̀ lé e hàn ní ọ̀nà àdánidá nínú Yorùbá.
- source_word: μετὰ ἔτη τρία
  choice: nígbà tí ọdún mẹ́ta ti kọjá
  rationale: Ó sọ àkókò tí ó kọjá ní kedere, ó sì yẹra fún àìdánilójú tí ‘lẹ́yìn ọdún mẹ́ta’ lè ní ní Yorùbá.
- source_word: ἀνῆλθον
  choice: mo gòkè lọ
  rationale: Ó pa ìtumọ̀ ìlọ sókè mọ́, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ nípa lílọ sí Jerúsálẹ́mù.
- source_word: Ἱεροσόλυμα
  choice: Jerúsálẹ́mù
  rationale: Èyí ni ọ̀nà ìkọ orúkọ ìlú náà tí ó wọ́pọ̀, pẹ̀lú àmì ohùn Yorùbá níbi tí ó yẹ.
- source_word: ἱστορῆσαι
  choice: láti lọ mọ
  rationale: Ó kọjá ìbẹ̀wò lásán, ó sì lè túmọ̀ sí pípadé ẹnì kan fún ìbárẹ́ ara ẹni tàbí láti mọ̀ ọ́n dáadáa; àlàyé ìtumọ̀ yìí wà nínú àlàyé ìsàlẹ̀.
- source_word: Κηφᾶν
  choice: Kéfà
  rationale: A pa orúkọ Aramaiki tí Pọ́ọ̀lù lò mọ́, dípò yíyí i padà sí Pétérù.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: mo sì dúró lọ́dọ̀ rẹ̀
  rationale: Ó sọ pípadà pẹ̀lú Kéfà fún àkókò kan ní Yorùbá àdánidá.
- source_word: ἡμέρας δεκαπέντε
  choice: fún ọjọ́ mẹ́ẹ̀ẹ́dógún
  rationale: ‘Fún’ mú ìtumọ̀ iye àkókò tí accusative Gíríìkì ń fi hàn ṣe kedere.
theological_decisions:
- issue: Ìdánimọ̀ Κηφᾶν
  choice: Kéfà nínú ọ̀rọ̀, pẹ̀lú àlàyé pé orúkọ Aramaiki Pétérù ni
  alternative: Pétérù nínú ọ̀rọ̀ pàtàkì
  rationale: Èyí tẹ̀ lé orúkọ tí Pọ́ọ̀lù kọ gan-an, láìfi ìdánimọ̀ ẹni náà pamọ́ fún òǹkàwé.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tí ó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa ìyàtọ̀ tó wà láàárín ìbẹ̀wò àti lílọ mọ ẹnì kan mọ́ nípasẹ̀ ọ̀rọ̀ pàtàkì àti àlàyé ìsàlẹ̀.
