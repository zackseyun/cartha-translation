language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: yo
  text: Mo sì ń tẹ̀ síwájú nínú ẹ̀sìn àwọn Júù[b] ju ọ̀pọ̀ àwọn ojúgbà mi láàárín àwọn ènìyàn mi lọ, níwọ̀n bí ìtara mi fún àwọn àṣà tí mo jogún láti ọ̀dọ̀ àwọn baba ńlá mi[a] ti pọ̀ ju tiwọn lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn àṣà baba ńlá mi.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ “ẹ̀sìn àwọn Júù” sí “ìsìn àwọn Júù” tàbí “ọ̀nà ìgbésí ayé àwọn Júù,” ní ìbámu pẹ̀lú bí a ṣe lóye Ἰουδαϊσμός ní àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: ń tẹ̀ síwájú
  rationale: Àkókò aláìparí nínú Gíríìkì fi ìlọsíwájú tí ó ń bá a lọ ní ìgbà àtijọ́ hàn; “ń tẹ̀ síwájú” pa ìtumọ̀ yẹn mọ́ láì sọ pé ó ti dé òpin àṣeyọrí.
- source_word: Ἰουδαϊσμῷ
  choice: nínú ẹ̀sìn àwọn Júù
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ètò ìgbàgbọ́ àti ìṣe àwọn Júù, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gbígbòòrò sí i sílẹ̀.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: ju ọ̀pọ̀ àwọn ojúgbà mi ... lọ
  rationale: “Ju ... lọ” fi ìfiwéra ὑπέρ hàn, “àwọn ojúgbà mi” sì tọ́ka sí àwọn ẹni tí ọjọ́ orí wọn sún mọ́ ti Pọ́ọ̀lù.
- source_word: ἐν τῷ γένει μου
  choice: láàárín àwọn ènìyàn mi
  rationale: Gẹ́gẹ́ bí ó ṣe rí ní àyíká ọ̀rọ̀ yìí, γένος tọ́ka sí ẹgbẹ́ ènìyàn tàbí ìran rẹ̀; yíyan yìí ṣe kedere láì lo ọ̀rọ̀ tí ó lè mú èrò ẹ̀yà-ara wọlé.
- source_word: περισσοτέρως ζηλωτὴς ὑπάρχων
  choice: mo sì ní ìtara púpọ̀ gidigidi
  rationale: Ọ̀rọ̀ yìí mú líle ìtara Pọ́ọ̀lù jáde ní Yorùbá àdánidá, láì pe e ní “olùfẹ̀sẹ̀múlẹ̀” tàbí ọ̀rọ̀ míì tí ó lè ní ìtumọ̀ ẹgbẹ́ òṣèlú.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: fún àwọn àṣà àtọwọ́dọ́wọ́ àwọn baba ńlá mi
  rationale: “Àṣà àtọwọ́dọ́wọ́” dúró fún ohun tí a fi ń sọ̀kalẹ̀ láti ìran dé ìran, “àwọn baba ńlá mi” sì pa ìtọ́ka πατρικῶν mọ́ ní ọ̀nà Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Bí a ṣe ní láti lóye Ἰουδαϊσμός
  choice: ẹ̀sìn àwọn Júù
  alternative: ọ̀nà ìgbésí ayé àwọn Júù
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ẹ̀sìn ní pàtó tàbí sí gbogbo ọ̀nà ìgbésí ayé àwọn Júù. Ọ̀rọ̀ inú ẹsẹ̀ yan ìtumọ̀ tí ó wọ́pọ̀ jù, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ gbígbòòrò náà mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní ọlá, ó sì rọrùn fún òǹkàwé gbogbogbò. Àmì ìdádúró olójú méjì pín ìlọsíwájú Pọ́ọ̀lù àti ìtara rẹ̀, bí ó tilẹ̀ jẹ́ pé àwọn méjèèjì wà nínú gbólóhùn kan ní orísun.
