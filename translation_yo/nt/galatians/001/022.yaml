id: GAL.1.22
reference: Galatians 1:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ìjọ ní Jùdíà tí ó wà nínú Mèsáyà[b] kò mọ̀ mí ní ojú.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kò mọ̀ mí ní ti ara ẹni.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú Kristi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìyàtọ̀ sí ọ̀rọ̀ tó ṣáájú hàn, bí δέ ṣe ń ṣe nínú àyíká yìí.
- source_word: ἤμην ἀγνοούμενος
  choice: kò tíì mọ ... mi
  rationale: 'Ìṣètò yìí sọ ipò tí ó ń bá a lọ nígbà náà: àwọn ìjọ náà kò mọ Pọ́ọ̀lù ní ti ara ẹni.'
- source_word: τῷ προσώπῳ
  choice: ojú mi
  rationale: Ọ̀rọ̀ Gíríìkì túmọ̀ sí pé wọn kò mọ̀ ọ́ ní ojú tàbí ní ti ara ẹni; ‘mọ ojú mi’ jẹ́ àdájú ọ̀rọ̀ Yorùbá tó ṣe déédé.
- source_word: ταῖς ἐκκλησίαις
  choice: àwọn ìjọ
  rationale: Nínú lílo Pọ́ọ̀lù, ἐκκλησίαις tọ́ka sí àwọn àwùjọ onígbàgbọ́; ‘àwọn ìjọ’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere.
- source_word: τῆς Ἰουδαίας
  choice: ní Jùdíà
  rationale: Ó tọ́ka sí ibi tí àwọn ìjọ náà wà; orúkọ ilẹ̀ náà ni ‘Jùdíà.’
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός ní agbára oyè ‘Ẹni Àmì-òróró’ níbí, èyí tí ‘Mèsáyà’ pa mọ́; ἐν sì fi ìbáṣepọ̀ ìṣọ̀kan wọn pẹ̀lú rẹ̀ hàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστῷ nínú ἐν Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: ‘Mèsáyà’ pa agbára oyè Χριστός mọ́ nínú gbolohun yìí, nígbà tí ‘Kristi’ lè dà bí orúkọ lásán; a kò sì fẹ́ pàdánù ìtumọ̀ Ẹni Àmì-òróró.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò. Àdájú ọ̀rọ̀ ‘mọ ojú mi’ mú τῷ προσώπῳ jáde lọ́nà àdánidá, láìfi èrò míì kún un. Àmì ohùn ni a fi síbi tó yẹ.
