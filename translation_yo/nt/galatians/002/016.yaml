id: GAL.2.16
reference: Galatians 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: yo
  text: Síbẹ̀, níwọ̀n bí a ti mọ̀ pé a kì í dá ènìyàn láre nípa àwọn iṣẹ́ òfin, bí kò ṣe nípasẹ̀ ìgbàgbọ́ nínú Jésù Mèsáyà[a], àwa náà ti gbàgbọ́ nínú Mèsáyà Jésù, kí a lè jẹ́ ẹni tí a dá láre nípa ìgbàgbọ́ nínú Mèsáyà[b], kì í sì í ṣe nípa àwọn iṣẹ́ òfin; nítorí nípa àwọn iṣẹ́ òfin, a kì yóò dá ẹran ara kankan láre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ìdúróṣinṣin Jésù Mèsáyà.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nípa ìdúróṣinṣin Mèsáyà.”
    reason: alternative_reading
  - marker: c
    text: Ní ọ̀rọ̀ gangan, “ẹran ara kankan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: dá … láre
  rationale: 'Ọ̀rọ̀ yìí pa ìtumọ̀ ìdájọ́ Pọ́ọ̀lù mọ́: pípolongo ènìyàn gẹ́gẹ́ bí ẹni tí ó tọ́, láìsọ ọ́ di àlàyé ẹ̀kọ́ ìsìn kan tí óóró jù.'
- source_word: ἄνθρωπος
  choice: ènìyàn
  rationale: “Ènìyàn” jẹ́ ọ̀nà Yorùbá àdánidá fún ẹyọ ọ̀rọ̀ tí ó dúró fún gbogbo ènìyàn, láìsọ ìtumọ̀ rẹ̀ di ọkùnrin nìkan.
- source_word: ἐξ ἔργων νόμου
  choice: nípa àwọn iṣẹ́ òfin
  rationale: Ó pa gbólóhùn pàtàkì Pọ́ọ̀lù mọ́, kò sì sọ ọ́ di “iṣẹ́ rere” lápapọ̀ tàbí àlàyé míì.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ ìgbàgbọ́ nínú Jésù Mèsáyà
  rationale: A mú ìtumọ̀ objective genitive wá sínú àkọ́kọ́ ọ̀rọ̀, ṣùgbọ́n a fi ìtumọ̀ subjective genitive tí ó ṣeé ṣe sí àlàyé ìsàlẹ̀.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: àwa pẹ̀lú ti ní ìgbàgbọ́ nínú Mèsáyà Jésù
  rationale: Ó jẹ́ Yorùbá àdánidá fún πιστεύω εἰς, ó sì fi hàn pé ìṣe náà ti ṣẹlẹ̀, tí ipa rẹ̀ sì wà títí di ìsinsìnyí.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: nípa ìgbàgbọ́ nínú Mèsáyà
  rationale: A lo ìpinnu kan náà fún πίστις Χριστοῦ ní gbogbo ẹsẹ̀ náà, a sì pa ìtumọ̀ kejì mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: A túmọ̀ oyè náà dípò kí a kàn kọ ìró Gíríìkì rẹ̀ sí Yorùbá.
- source_word: πᾶσα σάρξ
  choice: ẹnikẹ́ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ìtumọ̀ gbólóhùn náà ní àyíká yìí; àwòrán gangan “ẹran ara kankan” wà nínú àlàyé ìsàlẹ̀.
- source_word: εἰδότες δὲ
  choice: Síbẹ̀, níwọ̀n bí a ti mọ̀
  rationale: Ó mú agbára ìyàtọ̀ díẹ̀ ti δέ àti ìbáṣepọ̀ participle náà pẹ̀lú ọ̀rọ̀ tó ṣáájú jáde ní Yorùbá àdánidá.
- source_word: ἐὰν μὴ
  choice: bí kò ṣe nípasẹ̀
  rationale: 'Ó pa agbára ìyọkúrò náà mọ́: kì í ṣe láti inú iṣẹ́ òfin, bí kò ṣe nípasẹ̀ ìgbàgbọ́.'
theological_decisions:
- issue: Ìtumọ̀ πίστις Χριστοῦ / πίστεως Ἰησοῦ Χριστοῦ
  choice: ìgbàgbọ́ nínú Jésù Mèsáyà / nínú Mèsáyà
  alternative: ìṣòtítọ́ Jésù Mèsáyà / ìṣòtítọ́ Mèsáyà
  rationale: Ìbáṣepọ̀ genitive náà ní ìtumọ̀ méjì tí àwọn onímọ̀ ń jiyàn lé lórí. Àkọ́kọ́ ọ̀rọ̀ lo “ìgbàgbọ́ nínú,” ṣùgbọ́n àwọn àlàyé [a] àti [b] pa ìtumọ̀ “ìṣòtítọ́” mọ́ láìyanjú àìdánilójú náà ní ìkọ̀kọ̀.
- issue: Olùṣe nínú àwọn passive δικαιωθῶμεν / δικαιωθήσεται
  choice: a dá wa/ẹnikẹ́ni láre, láìdárúkọ olùṣe
  alternative: Ọlọ́run dá wa/ẹnikẹ́ni láre
  rationale: Gíríìkì kò dárúkọ olùṣe níbí. Yorùbá aláìdárúkọ olùṣe pa ìtọ́kasí Ọlọ́run tí ó ṣeé lóye mọ́ láìfi ọ̀rọ̀ tí kò sí nínú orísun kún un.
translation_notes:
  register: A lo Yorùbá àgbàṣe òde òní tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. “Dá … láre,” “àwọn iṣẹ́ òfin,” àti “ìgbàgbọ́ nínú” jẹ́ kedere fún òǹkàwé lásán, wọ́n sì pa ìlànà àti ìfọkànsìn ọ̀rọ̀ Pọ́ọ̀lù mọ́.
