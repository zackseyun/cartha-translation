  source_fidelity: Ìtumọ̀ náà pa ìlànà pàtàkì ẹsẹ̀ náà mọ́—ìdáláre kì í wá láti inú iṣẹ́ òfin, bí kò ṣe nípasẹ̀ ìgbàgbọ́ nínú Mèsáyà—ó sì tọ́ka sí ìtumọ̀ mìíràn ti πίστις Χριστοῦ nínú àlàyé. Síbẹ̀, “kí a lè dá wa láre” lè túmọ̀ sí pé àwa fúnra wa dá ara wa láre, nígbà tí Gíríìkì jẹ́ passive. Gbólóhùn ìkẹyìn náà náà nílò kí πᾶσα σάρξ jẹ́ kókó-ọrọ̀, kì í ṣe ohun tí olùṣe aláìdárúkọ ń dá láre.
  naturalness: “Àwa pẹ̀lú ti ní ìgbàgbọ́ nínú” kò rọrùn bí “àwa náà ti gbàgbọ́ nínú.” Ìlò “kì í sì í ṣe” sì jẹ́ àìrótẹ́lẹ̀ nínú ìṣọ̀kan gbolohun náà. Àtúnṣe náà ń lo Yorùbá òde òní tí ó bójú mu, pẹ̀lú àmì ohùn.
  terminology: “Dá ... láre,” “àwọn iṣẹ́ òfin,” àti “Mèsáyà” yẹ, wọ́n sì bá ìpinnu iṣẹ́ náà mu. Fún ìtumọ̀ subjective-genitive nínú àlàyé, “ìdúróṣinṣin” ṣàlàyé faithfulness dáadáa ju “ìṣòtítọ́,” tí ó sábà ń tọ́ka sí truthfulness, lọ.
