revisions:
- from: Síbẹ̀, níwọ̀n bí a ti mọ̀ pé a kì í dá ènìyàn láre nípa àwọn iṣẹ́ òfin, bí kò ṣe nípasẹ̀ ìgbàgbọ́ nínú Jésù Mèsáyà[a], àní àwa pẹ̀lú ti ní ìgbàgbọ́ nínú Mèsáyà Jésù, kí a lè dá wa láre nípa ìgbàgbọ́ nínú Mèsáyà[b], kì í sì í ṣe nípa àwọn iṣẹ́ òfin, nítorí pé nípa àwọn iṣẹ́ òfin, a kì yóò dá ẹnikẹ́ni láre[c].
  to: Síbẹ̀, níwọ̀n bí a ti mọ̀ pé a kì í dá ènìyàn láre nípa àwọn iṣẹ́ òfin, bí kò ṣe nípasẹ̀ ìgbàgbọ́ nínú Jésù Mèsáyà[a], àwa náà ti gbàgbọ́ nínú Mèsáyà Jésù, kí a lè jẹ́ ẹni tí a dá láre nípa ìgbàgbọ́ nínú Mèsáyà[b], kì í sì í ṣe nípa àwọn iṣẹ́ òfin; nítorí nípa àwọn iṣẹ́ òfin, a kì yóò dá ẹran ara kankan láre[c].
  rationale: A tún passive δικαιωθῶμεν ṣe kí Yorùbá má bà a jẹ́ reflexive active. A tún ṣe gbolohun ìkẹyìn kí “ẹran ara kankan” dúró fún πᾶσα σάρξ, bí ó tilẹ̀ jẹ́ pé Yorùbá ń lo olùṣe aláìdárúkọ nínú ìkọ́ passive. A mú ọ̀rọ̀ ìgbàgbọ́ àti ìṣọ̀kan gbolohun rọrùn, a sì pa ambiguity ti πίστις Χριστοῦ mọ́ nínú àlàyé.
