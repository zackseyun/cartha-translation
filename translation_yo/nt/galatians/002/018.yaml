  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: yo
  text: Nítorí bí mo bá tún àwọn ohun tí mo ti wó lulẹ̀ kọ́, mo fi ara mi hàn pé arúfin ni mo jẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo fi ara mi hàn gẹ́gẹ́ bí arúfin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Nítorí bí
  rationale: “Nítorí” ń pa ipa ìṣàlàyé γάρ mọ́, “bí” sì ń fi ipò àídájú εἰ hàn ní Yorùbá àdánidá.
- source_word: ἃ ... ταῦτα
  choice: àwọn ohun tí
  rationale: Èyí pa ìtumọ̀ ọ̀pọ̀ àti ìbátan ọ̀rọ̀ náà mọ́ láì mú kí gbolohun náà le ní Yorùbá.
- source_word: κατέλυσα
  choice: mo ti wó lulẹ̀
  rationale: Yíyan yìí pa àwòrán iṣẹ́ ìkọ́lé mọ́, ó sì bá “tún ... kọ́” mu dáadáa; kò fi ìtumọ̀ pàtó bí “fagilé” kún un.
- source_word: πάλιν οἰκοδομῶ
  choice: mo bá tún ... kọ́
  rationale: “Tún ... kọ́” jẹ́ ọ̀nà Yorùbá àdánidá fún pípa πάλιν àti οἰκοδομῶ pọ̀, ó sì pa àwòrán títún ilé kọ́ mọ́.
- source_word: παραβάτην
  choice: arúfin
  rationale: “Arúfin” fi ẹni tí ó ré òfin kọjá hàn, ó sì pa ìró ìwà àti òfin inú ọ̀rọ̀ Gíríìkì mọ́ láì dín un sí òfin kan pàtó.
- source_word: ἐμαυτὸν συνιστάνω
  choice: mo fi ara mi hàn pé mo jẹ́
  rationale: Èyí sọ ipa ọ̀rọ̀ arọ́pò-orúkọ tó ń tọ́ka sí ara ẹni àti ìtumọ̀ “fi hàn/mú ẹ̀rí dúró” ní Yorùbá tó ṣe kedere; àlàyé ìsàlẹ̀ fi ìtumọ̀ “jẹ́rìí sí” hàn.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde-òní ni a lò. Àwòrán wíwó lulẹ̀ àti títún kọ́ inú Gíríìkì ni a pa mọ́. A fi àmì ohùn sí ibi tí ó bá yẹ, pẹ̀lú ìyàtọ̀ láàárín kọ́ (build) àti kọ̀/kọ́ ní àwọn ìtumọ̀ mìíràn.
