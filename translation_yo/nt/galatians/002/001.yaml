source:
  edition: SBLGNT
  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: yo
  text: Lẹ́yìn náà, lẹ́yìn ọdún mẹ́rìnlá, mo tún gòkè lọ sí Jerusalẹmu pẹ̀lú Bánábà, mo sì mú Titu lọ náà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: Lẹ́yìn náà
  rationale: Ó ń tẹ ìtàn Paulu síwájú, ó sì fi hàn pé ohun tó tẹ̀ lé e ni èyí.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: nígbà tí ọdún mẹ́rìnlá ti kọjá
  rationale: Ó sọ àkókò tí ó ti kọjá ṣáájú ìṣẹ̀lẹ̀ tó tẹ̀ lé e ní ọ̀nà àdánidá ní Yorùbá, láì sọ ibi tí kíkà ọdún náà ti bẹ̀rẹ̀.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé Paulu ti lọ sí Jerusalẹmu rí, ó sì tún lọ ní ìgbà yìí.
- source_word: ἀνέβην
  choice: mo gòkè lọ
  rationale: Ó pa ìtumọ̀ lílọ sókè mọ́, gẹ́gẹ́ bí ọ̀nà tí orísun náà gbà sọ ìrìn-àjò lọ sí Jerusalẹmu.
- source_word: εἰς Ἱεροσόλυμα
  choice: sí Jerusalẹmu
  rationale: Àmì ibi tí ìrìn-àjò náà ń lọ ni gbólóhùn yìí, èyí tí “sí” sọ ní kedere ní Yorùbá.
- source_word: μετὰ Βαρναβᾶ
  choice: pẹ̀lú Banaba
  rationale: Ó sọ pé Banaba bá Paulu lọ ní ọ̀nà tó rọrùn, tó sì ṣe kedere.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: mo sì mú Titu lọ pẹ̀lú
  rationale: Ó mú ìṣe tó ń bá ọ̀rọ̀-ìṣe pàtàkì lọ jáde ní Yorùbá àdánidá, ó sì fi hàn pé Titu náà bá wọn lọ.
theological_decisions:
- issue: Ibi tí ọdún mẹ́rìnlá náà ti bẹ̀rẹ̀ sí í kà
  choice: A kò sọ ibi tí kíkà ọdún náà ti bẹ̀rẹ̀.
  alternative: Ṣíṣe àlàyé pé ó bẹ̀rẹ̀ láti ìṣẹ̀lẹ̀ kan pàtó nínú àyíká ọ̀rọ̀.
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ìṣẹ̀lẹ̀ pàtó tí ọdún mẹ́rìnlá náà bẹ̀rẹ̀ láti ọ̀dọ̀ rẹ̀; ìtumọ̀ náà kò gbọdọ̀ yanju àìdánilójú yìí fún òǹkàwé.
translation_notes:
  register: Yorùbá boṣewa, tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A pa àtẹ̀jáde ìtàn náà àti ọ̀rọ̀ lílọ “gòkè” sí Jerusalẹmu mọ́ láì mú kí gbólóhùn náà le.
