id: GAL.2.9
reference: Galatians 2:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: yo
  text: Nígbà tí Jákọ́bù, Kéfà àti Jòhánù—àwọn tí a kà sí òpó—ti mọ̀ oore-ọ̀fẹ́ tí a fi fún mi, wọ́n fi ọwọ́ ọ̀tún wọn fún mi àti Bánábà gẹ́gẹ́ bí àmì ìbáṣepọ̀[a], kí àwa lè lọ sọ́dọ̀ àwọn Kèfèrí[b], kí àwọn sì lọ sọ́dọ̀ àwọn oníkọlà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “wọ́n fún mi àti Bánábà ní ọwọ́ ọ̀tún ìbáṣepọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn orílẹ̀-èdè”; níbí ó túmọ̀ sí àwọn tí kì í ṣe Júù.
    reason: lexical_alternative
  - marker: c
    text: Ní tààràtà, “sí ọ̀dọ̀ ìkọlà,” ìyẹn ni, sí ọ̀dọ̀ àwọn Júù.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες
  choice: mọ̀
  rationale: Ó fi hàn pé wọ́n mọ ohun tí Ọlọ́run ti ṣe, wọ́n sì gbà á sílẹ̀ gẹ́gẹ́ bí ìdí fún ìṣe tí ó tẹ̀ lé e.
- source_word: χάριν τὴν δοθεῖσάν μοι
  choice: oore-ọ̀fẹ́ tí a ti fi fún mi
  rationale: Èyí pa èrò oore-ọ̀fẹ́ mọ́, kò sì dín un kù sí iṣẹ́ àpọ́sítélì nìkan; ọ̀nà àìdárúkọ olùṣe náà tún tẹ̀ lé passive Gíríìkì.
- source_word: Κηφᾶς
  choice: Kéfà
  rationale: A mú orúkọ tí ọ̀rọ̀ Gíríìkì lò wá taara, dípò fífi Pétérù rọ́pò rẹ̀.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: àwọn tí a kà sí òpó
  rationale: Èyí pa àwòrán ‘òpó’ àti ìtumọ̀ ipò tí àwọn ènìyàn mọ̀ sí wọn mọ́, láìsọ ọ̀rọ̀ Pọ́ọ̀lù di ẹ̀gàn.
- source_word: δεξιὰς ἔδωκαν ... κοινωνίας
  choice: wọ́n na ọwọ́ ọ̀tún ... gẹ́gẹ́ bí àmì ìdàpọ̀
  rationale: Ọ̀rọ̀ Yorùbá yìí ṣàlàyé ìṣe ìfọwọ́sowọ́pọ̀ náà lọ́nà àdánidá, ó sì pa àwòrán ọwọ́ ọ̀tún àti èrò ìdàpọ̀ iṣẹ́ mọ́.
- source_word: ἔθνη
  choice: àwọn Kèfèrí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí àwọn tí kì í ṣe Júù, kì í ṣe àwọn orílẹ̀-èdè gẹ́gẹ́ bí ìjọba.
- source_word: περιτομήν
  choice: àwọn tí a kọ nílà
  rationale: A tú metonym náà sí àwọn ènìyàn tí a kọ nílà, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé àwọn Júù ni a ń tọ́ka sí.
theological_decisions:
- issue: 'Bí a ṣe máa tú κοινωνίας: ìdàpọ̀ tàbí ìbáṣepọ̀ lásán'
  choice: ìdàpọ̀
  alternative: ìbáṣepọ̀
  rationale: Àyíká ọ̀rọ̀ jẹ́ ti ìfọwọ́sí iṣẹ́ àpọ́sítélì àti pínpín pápá iṣẹ́; ‘ìdàpọ̀’ lè gba ìbáṣepọ̀ àti iṣẹ́ àjọṣe méjèèjì láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Bí a ṣe máa tú περιτομήν gẹ́gẹ́ bí àfihàn àwọn Júù
  choice: àwọn tí a kọ nílà
  alternative: àwọn Júù
  rationale: Yíyan ọ̀rọ̀ yìí pa ìyàtọ̀ tí Pọ́ọ̀lù dá lórí ìkọlà mọ́; àlàyé ìsàlẹ̀ ló sọ ẹni tí ó ń tọ́ka sí ní kedere.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì pa àwọn àwòrán pàtàkì bí ‘òpó’ àti ‘ọwọ́ ọ̀tún’ mọ́.
