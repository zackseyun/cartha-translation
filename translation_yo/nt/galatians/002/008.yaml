id: GAL.2.8
reference: Galatians 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: yo
  text: Nítorí ẹni tí ó ṣiṣẹ́ nípasẹ̀ Peteru fún iṣẹ́ àpọ́sítélì sí àwọn oníkọlà[a] ṣiṣẹ́ nípasẹ̀ mi náà fún àwọn Kèfèrí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “fún iṣẹ́ àpọ́sítélì ti ìkọlà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: ṣiṣẹ́ / ṣiṣẹ́
  rationale: A lo ọ̀rọ̀-ìṣe kan náà ní ìgbà méjèèjì láti pa àtúnṣe ọ̀rọ̀ àti ìrẹ́pọ̀ tó wà láàárín iṣẹ́ Peteru àti ti Paulu mọ́, láìfi ìtumọ̀ bí ‘fún un ní agbára’ kún un.
- source_word: Πέτρῳ / ἐμοὶ
  choice: nípasẹ̀ Peteru / nípasẹ̀ èmi
  rationale: Ọ̀rọ̀ dative náà ń tọ́ka sí ẹni tí iṣẹ́ náà ti ọwọ́ rẹ̀ wáyé; ‘nípasẹ̀’ mú iṣẹ́ ìránṣẹ́ wọn hàn ní kedere, ó sì pa ìrẹ́pọ̀ àwọn gbólóhùn méjèèjì mọ́.
- source_word: εἰς ἀποστολὴν
  choice: fún iṣẹ́ àpọ́sítélì
  rationale: Èyí sọ ìdarí iṣẹ́ náà sí ojúṣe àpọ́sítélì ní Yorùbá tó ṣe kedere, láìdín ἀποστολή kù sí ìrìn-àjò tàbí iṣẹ́ ìwàásù nìkan.
- source_word: τῆς περιτομῆς
  choice: sí àwọn oníkọlà
  rationale: Nínú àyíká yìí, ‘ìkọlà’ dúró fún àwọn Júù tí a kọ ní ilà; ìtumọ̀ yìí jẹ́ kó ṣe kedere pé àwọn ènìyàn ni Paulu ń sọ̀rọ̀ nípa wọn, ó sì pa ìyàtọ̀ wọn sí àwọn Kèfèrí mọ́.
- source_word: τὰ ἔθνη
  choice: àwọn Kèfèrí
  rationale: Nínú àyíká Paulu, ọ̀rọ̀ náà ń tọ́ka sí àwọn tí kì í ṣe Júù, ní ìyàtọ̀ sí àwọn oníkọlà. ‘Àwọn Kèfèrí’ jẹ́ ọ̀rọ̀ Yorùbá Bíbélì tí ó mọ́, nígbà tí ‘àwọn orílẹ̀-èdè’ jẹ́ àṣàyàn gidi míì.
theological_decisions:
- issue: Bóyá kí a pe ẹni tó ń ṣiṣẹ́ náà ní ‘Ọlọ́run’ ní tààrà
  choice: ẹni tí ó ṣiṣẹ́
  alternative: Ọlọ́run, ẹni tí ó ṣiṣẹ́
  rationale: Gíríìkì ní articular participle, ‘ẹni tí ó ṣiṣẹ́,’ kò sì dárúkọ Ọlọ́run ní tààrà nínú ẹsẹ yìí. Ìtumọ̀ yìí pa ìrísí orísun náà mọ́, ó sì jẹ́ kí àyíká ló fi ẹni tí a ń tọ́ka sí hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó ṣeé yé. A lo ‘iṣẹ́ àpọ́sítélì’ fún apostleship, ‘àwọn oníkọlà’ fún ẹgbẹ́ àwọn Júù, àti ‘àwọn Kèfèrí’ fún àwọn tí kì í ṣe Júù. Ìtò gbólóhùn náà pa ìrẹ́pọ̀ iṣẹ́ Peteru àti Paulu mọ́.
