  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí Kéfà dé Áńtíókù,[a] mo dojú kọ ọ́ lójúkojú, nítorí ó wà lábẹ́ ìdálẹ́bi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kéfà ni orúkọ Árámáíkì tí a fi ń pe Pétérù.
    reason: cross_reference
  - marker: b
    text: Tàbí, “nítorí ó hàn gbangba pé ó wà ní àṣìṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: Ó pa ìyípadà àkókò àti ìtakora kékeré tí δέ ní mọ́, ní Yorùbá àdánidá.
- source_word: Κηφᾶς
  choice: Kéfà
  rationale: Ó ṣe àkọsílẹ̀ ohùn orúkọ inú Gíríìkì dípò fífi Pétérù rọ́pò rẹ̀; àlàyé ìdánimọ̀ rẹ̀ wà ní àlàyé ìsàlẹ̀.
- source_word: ἦλθεν εἰς Ἀντιόχειαν
  choice: dé Áńtíókù
  rationale: ‘Dé’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìwọlé sí ìlú kan nínú àyíká yìí.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: ní ojúkojú
  rationale: Ó pa àwòrán ìdojúkọ ẹni ní tààràtà mọ́ láì jẹ́ ọ̀rọ̀ líle tàbí àjèjì.
- source_word: ἀντέστην
  choice: mo dojú kọ ọ́
  rationale: Ó fi ìtakò Pọ́ọ̀lù ní gbangba àti ní tààràtà hàn ní Yorùbá tí ó ṣeé lóye.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàfihàn ìdí tí Pọ́ọ̀lù fi dojú kọ Kéfà ní kedere.
- source_word: κατεγνωσμένος ἦν
  choice: ó wà lábẹ́ ìdálẹ́bi
  rationale: Ó pa ìtumọ̀ ipò tí ó ti yọrí láti inú ọ̀rọ̀ àṣepọ̀ pípẹ̀ Gíríìkì mọ́, kò sì pinnu ẹni tí ó dá a lẹ́bi.
theological_decisions:
- issue: Ìdánimọ̀ àti ìtumọ̀ Κηφᾶς
  choice: Fi ‘Kéfà’ sí ọ̀rọ̀ pàtàkì
  alternative: Lo ‘Pétérù’ kí ó lè mọ́ àwọn òǹkàwé lára sí i
  rationale: Orúkọ Κηφᾶς gan-an ni ẹ̀rí Gíríìkì ní; fífi Kéfà sílẹ̀ pa irú orúkọ orísun mọ́, nígbà tí àlàyé ìsàlẹ̀ sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú Pétérù.
- issue: Agbára κατεγνωσμένος ἦν
  choice: ‘ó wà lábẹ́ ìdálẹ́bi’
  alternative: ‘ó hàn gbangba pé ó ṣe àṣìṣe’
  rationale: Àṣàyàn pàtàkì pa ohun àìsọ pàtó nínú ọ̀rọ̀ Gíríìkì mọ́ nípa ẹni tó dá a lẹ́bi, ó sì ṣètọju agbára ìdálẹ́bi rẹ̀; àlàyé ìsàlẹ̀ fúnni ní ìtumọ̀ míì tí ó ṣeé ṣe.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Dojú kọ’ àti ‘ní ojúkojú’ jẹ́ ọ̀rọ̀ àdánidá tó pa agbára ìdojúkọ tààràtà inú orísun mọ́.
