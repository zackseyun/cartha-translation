    rationale: Ó lè yí ìtumọ̀ εἴξαμεν (‘juwọ́ sílẹ̀/yield’) padà sí ìṣe ìforíbalẹ̀ ní ti ara, ‘fún’ sì jẹ́ àìfẹ́sẹ̀mulẹ̀ nínú ìṣọ̀kan náà. ‘Juwọ́ sílẹ̀ fún wọn ní ìtẹríba’ ṣe ìyà εἴξαμεν sí τῇ ὑποταγῇ dáadáa.
  - severity: low
