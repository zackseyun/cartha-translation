revisions:
- from: Àwọn ẹni náà ni àwa kò tẹrí ba fún ní ìtẹríba, àní fún ìṣẹ́jú kan pàápàá[a], kí òtítọ́ ìhìnrere lè dúró fún yín[b].
  to: Fún àwọn náà, a kò juwọ́ sílẹ̀ fún wọn ní ìtẹríba, àní fún ìgbà díẹ̀ pàápàá[a], kí òtítọ́ ìhìnrere lè dúró pẹ̀lú yín[b].
  rationale: A ṣe àtúnṣe ìṣọ̀kan ọ̀rọ̀-ìṣe náà kí ó lè fi εἴξαμεν (‘a kò juwọ́ sílẹ̀’) àti τῇ ὑποταγῇ (‘ní ìtẹríba’) hàn lọ́tọ̀ gẹ́gẹ́ bí Gíríìkì. A tún lo ọ̀rọ̀ àsọyé Yorùbá tó rọrùn fún πρὸς ὥραν, a sì ṣàtúnṣe àsìkò nínú àlàyé ìsàlẹ̀. ‘Pẹ̀lú yín’ ni a yàn fún πρὸς ὑμᾶς nítorí ó bá ‘dúró’ mu ní Yorùbá, nígbà tí ‘fún yín’ wà nínú àlàyé ìsàlẹ̀ láti pa ìṣeéṣe ìtumọ̀ mìíràn mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:30:43Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ní gbogbogbòò rẹ̀ tẹ̀lé Gíríìkì dáadáa, ṣùgbọ́n ìṣọ̀kan ‘tẹrí ba fún’ kì í ṣe ọ̀nà tó dára jù lọ láti gbé εἴξαμεν τῇ ὑποταγῇ. ‘Juwọ́ sílẹ̀ fún wọn ní ìtẹríba’ fi ìkọ̀ láti tẹ̀lé ìfipá-mú wọn hàn kedere. πρὸς ὑμᾶς ní àyíká yìí lè túmọ̀ sí ‘pẹ̀lú yín’; a pa ‘fún yín’ mọ́ gẹ́gẹ́ bí ìṣeéṣe nínú àlàyé ìsàlẹ̀.
  naturalness: ‘Àwọn ẹni náà ni àwa kò tẹrí ba fún’ dùn bí ìtúmọ̀ tààràtà, ó sì tún ní ‘fún’ tó lè jẹ́ àfikún àìní. ‘Fún àwọn náà, a kò juwọ́ sílẹ̀ fún wọn ní ìtẹríba’ jẹ́ Yorùbá àdánidá síi. ‘Fún ìgbà díẹ̀ pàápàá’ gbé ìsọ̀rọ̀ Gíríìkì náà lọ́nà àdánidá ju ‘fún ìṣẹ́jú kan’ lọ.
  terminology: ‘Òtítọ́ ìhìnrere’ jẹ́ ọ̀rọ̀ tó péye fún ἡ ἀλήθεια τοῦ εὐαγγελίου, ‘ìtẹríba’ sì dára fún ὑποταγή níbí. Àmì ohùn àti ìkọ̀wé orúkọ náà ti tọ́.
