  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: yo
  text: Fún àwọn náà, a kò juwọ́ sílẹ̀ fún wọn ní ìtẹríba, àní fún ìgbà díẹ̀ pàápàá[a], kí òtítọ́ ìhìnrere lè dúró pẹ̀lú yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ‘kò sì fún wákàtí kan pàápàá’; èyí jẹ́ ọ̀nà àsọyé tó túmọ̀ sí ‘kò sì fún ìgbà díẹ̀ pàápàá.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘fún yín.’
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: Àwọn ẹni náà ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ dative náà ń tọ́ka sí àwọn ènìyàn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ní ẹsẹ tó ṣáájú; ọ̀nà yìí mú ìtọ́kasí náà hàn ní Yorùbá àdánidá.
- source_word: οὐδὲ πρὸς ὥραν
  choice: àní fún ìṣẹ́jú kan pàápàá
  rationale: Gbólóhùn náà túmọ̀ sí pé kì í ṣe fún àkókò kúkúrú rárá; ‘ìṣẹ́jú kan’ sọ agbára àṣàyàn náà ní Yorùbá òde òní láì jẹ́ kí òǹkàwé rò pé wákàtí kan gan-an ni.
- source_word: εἴξαμεν
  choice: àwa kò tẹrí ba
  rationale: Èyí fi ìkọ̀ láti juwọ́ sílẹ̀ tàbí láti fi ọ̀nà sílẹ̀ hàn, láì dá a pọ̀ mọ́ ọ̀rọ̀ ὑποταγή tó tẹ̀ lé e.
- source_word: τῇ ὑποταγῇ
  choice: ní ìtẹríba
  rationale: Dative náà ṣàlàyé ọ̀nà tàbí ipò tí wọn kò fi tẹrí ba; ‘ní ìtẹríba’ pa ìtumọ̀ ìfaramọ́ abẹ́ àṣẹ mọ́.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò Yorùbá yìí fi ète tàbí àfojúsùn hàn ní kedere.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: òtítọ́ ìhìnrere
  rationale: Èyí jẹ́ gbólóhùn Pọ́ọ̀lù pàtàkì; ‘ìhìnrere’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì pa ìtumọ̀ εὐαγγέλιον mọ́.
- source_word: διαμείνῃ
  choice: lè dúró
  rationale: Ọ̀rọ̀-ìṣe náà ń sọ nípa títẹ̀síwájú tàbí pípa ohun kan mọ́; ‘dúró’ jẹ́ kedere, ó sì bá ìtumọ̀ náà mu.
- source_word: πρὸς ὑμᾶς
  choice: fún yín
  rationale: πρός pẹ̀lú accusative lè fi ìtọ́sọ́nà, ìbáṣepọ̀, tàbí àǹfààní hàn níbí; ‘fún yín’ bá àníyàn Pọ́ọ̀lù pé kí òtítọ́ náà wà ní àǹfààní wọn mu, bí ó tilẹ̀ jẹ́ pé ‘pẹ̀lú yín’ tún ṣeé ṣe.
theological_decisions:
- issue: Agbára ìkọ̀ Pọ́ọ̀lù sí àwọn alátakò
  choice: Pọ́ọ̀lù sọ pé àwọn kò tẹrí ba fún wọn rárá, kí òtítọ́ ìhìnrere lè dúró.
  alternative: Ó lè jẹ́ pé Pọ́ọ̀lù ń sọ nípa kí òun fúnra rẹ̀ má tẹrí ba, tàbí nípa kí àwọn má ṣe àdéhùn ti ètò kan.
  rationale: Èdè Gíríìkì sọ ní gbòòrò nípa kí wọn má tẹrí ba ‘ní ìtẹríba’; kò fi dandan sọ pé ọ̀ràn ti ara ẹni nìkan ni tàbí ti ètò ìjọ nìkan. Ìtumọ̀ náà kò fi ẹ̀kọ́ ìsìn kan kun un.
translation_notes:
  register: Yorùbá àpéwọ̀n tó níyì, tó ṣeé lóye fún òǹkàwé òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. A pa ìyàtọ̀ tó ṣeé ṣe nínú πρὸς ὑμᾶς mọ́ sínú àlàyé ìsàlẹ̀.
