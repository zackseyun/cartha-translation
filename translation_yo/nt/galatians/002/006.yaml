  terminology: ‘Ọlọ́run kì í ṣe ojúsàájú ènìyàn’ jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání láti túmọ̀ àkànlò πρόσωπον ... οὐ λαμβάνει. A pa ‘àwọn tí a kà sí ẹni pàtàkì’ mọ́, nítorí kò sọ àwọn aṣáájú náà di ẹni tí kò ní ipò tàbí ẹni ẹ̀gàn.
