  source_fidelity: 'Ìtumọ̀ náà pa ọ̀pọ̀ ìtumọ̀ Gíríìkì mọ́ dáadáa: ‘àwọn tí a kà sí ẹni pàtàkì’ ń mú δοκοῦντες hàn pẹ̀lú ìjìnnà ohùn Pọ́ọ̀lù; ‘irú ẹni yòówù tí wọ́n ti jẹ́ tẹ́lẹ̀’ àti ọ̀rọ̀ ojúsàájú náà sì péye. Ṣùgbọ́n ‘kò fi ohunkóhun kún un’ yí dative ἐμοί (‘sí mi’) padà sí ohun tí a ń fi kún (‘sí i’), nítorí náà ó nílò àtúnṣe.'
