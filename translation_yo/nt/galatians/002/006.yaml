id: GAL.2.6
reference: Galatians 2:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: yo
  text: Ṣùgbọ́n ní ti àwọn tí a kà sí ẹni pàtàkì[a]—irú ẹni yòówù tí wọ́n ti jẹ́ tẹ́lẹ̀ kò ṣe ìyàtọ̀ kankan sí mi; Ọlọ́run kì í ṣe ojúsàájú ènìyàn[b]—ní ti tèmi, àwọn tí a kà sí ẹni pàtàkì náà kò fi ohunkóhun kún mi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí ó dà bí ẹni pé wọ́n jẹ́ ẹni pàtàkì.”
    reason: lexical_alternative
  - marker: b
    text: Ní ọ̀rọ̀-ọ̀rọ̀, “Ọlọ́run kì í gba ojú ènìyàn”; àkànlò èdè ni fún pé Ọlọ́run kì í ṣe ojúsàájú.
    reason: cultural_note
  - marker: c
    text: Tàbí, “wọn kò gbé ohun míì lé mi lórí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: àwọn tí a kà sí ẹni pàtàkì
  rationale: Èyí ń tọ́ka sí bí àwọn ẹlòmíràn ṣe ka ipò wọn sí, ó sì pa ìyàtọ̀ kékeré tí Pọ́ọ̀lù fi sí orúkọ rere wọn mọ́ láì sọ ọ́ di ẹ̀gàn.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: irú ẹni yòówù tí wọ́n ti jẹ́ tẹ́lẹ̀
  rationale: Ó fi hàn pé irú ipò tàbí ọlá tí wọ́n ní tẹ́lẹ̀ kò ṣe pàtàkì sí ọ̀rọ̀ Pọ́ọ̀lù.
- source_word: οὐδέν μοι διαφέρει
  choice: kò ṣe ìyàtọ̀ kankan sí mi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ipò wọn kò yí ìdájọ́ Pọ́ọ̀lù padà.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: Ọlọ́run kì í ṣe ojúsàájú sí ènìyàn
  rationale: A túmọ̀ àkànlò èdè Gíríìkì ní ìtumọ̀ rẹ̀ gẹ́gẹ́ bí àìṣe ojúsàájú, dípò títúmọ̀ ‘gbígba ojú ènìyàn’ ní ọ̀rọ̀-ọ̀rọ̀.
- source_word: ἐμοὶ γὰρ
  choice: ní ti tèmi
  rationale: Ó pa dative ἐμοί mọ́ ní gbangba, ó sì so gbólóhùn náà mọ́ ìrírí Pọ́ọ̀lù láì fi agbára tí kò sí nínú γάρ kún un.
- source_word: οὐδὲν προσανέθεντο
  choice: kò fi ohunkóhun kún un
  rationale: Ọ̀rọ̀ yìí pa àìdánilójú mọ́ nípa ohun tí wọn kò fi kún un—yálà iṣẹ́ ìránṣẹ́, iṣẹ́ ìwàásù, tàbí ohun míì—láì pinnu ohun tí Gíríìkì kò sọ ní tààrà.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ Pọ́ọ̀lù jẹ́ ẹ̀gàn sí àwọn aṣáájú Jerúsálẹ́mù tàbí ìtẹnumọ́ pé ipò wọn kò ṣe ìdájọ́ òtítọ́ ìhìn rere rẹ̀
  choice: A lo ‘àwọn tí a kà sí ẹni pàtàkì,’ èyí tó ní ìjìnnà díẹ̀ ṣùgbọ́n tí kì í ṣe ẹ̀gàn.
  alternative: ‘Àwọn aṣáájú tí a fọwọ́ sí’ lè mú ohùn Pọ́ọ̀lù rọ̀ jù; ‘àwọn tí ó dà bí ẹni pé wọ́n ṣe pàtàkì’ sì lè mú un le ju.
  rationale: Kókó Pọ́ọ̀lù ni pé ọlá tàbí ipò wọn kò pinnu òtítọ́ ìhìn rere rẹ̀; kò pọndandan pé ó ń sọ pé aṣáájú wọn kò bófin mu.
- issue: Ohun tí ‘kò fi ohunkóhun kún un’ ń tọ́ka sí
  choice: A kò sọ ohun pàtó tí a fi kún un nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: A lè sọ ‘wọn kò fi ohunkóhun kún ìhìn rere mi’ tàbí ‘wọn kò gbé àṣẹ míì lé mi.’
  rationale: Gíríìkì kò sọ ohun tí wọ́n fi kún un ní tààrà, ó sì lè ní ìtumọ̀ fífi ohun kún iṣẹ́ tàbí fífi ohun míì lé Pọ́ọ̀lù lórí; ìtumọ̀ yìí pa ìfọ̀rọ̀wérọ̀ náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye. Àwọn àmi ohùn àti àmì abẹ́ lẹ́tà wà níbi tí wọ́n ti yẹ. Àwọn àmì gígùn náà pa ìdádúró àti ìfàsẹ́yìn inú gbólóhùn Gíríìkì mọ́ ní ọ̀nà tí Yorùbá òde òní lè gbà.
