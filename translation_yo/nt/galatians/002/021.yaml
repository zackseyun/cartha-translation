source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: yo
  text: Èmi kò sọ oore-ọ̀fẹ́ Ọlọ́run di asán; nítorí bí òdodo[a] bá wá nípasẹ̀ òfin, nígbà náà Mèsáyà[b] kú lásán.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́.”
    reason: lexical_alternative
  - marker: b
    text: 'Gíríìkì: Christos, ìyẹn ẹni tí a fi òróró yàn; a túmọ̀ ọ́ sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.'
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kú láìní èrè” tàbí “kú ní asán.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: sọ ... di asán
  rationale: Ó fi hàn pé a sọ ohun kan di aláìní agbára tàbí di aláìní èrè, ó sì bá ìjiyàn Paulu mu ju ọ̀rọ̀ tí ó kàn túmọ̀ sí ‘kọ̀’ lọ.
- source_word: χάριν
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bójú mu fún inú rere tí Ọlọ́run fi ń ṣe ojú rere sí ènìyàn láìjẹ́ pé ènìyàn tọ́ sí i.
- source_word: διὰ νόμου
  choice: nípasẹ̀ òfin
  rationale: Ó pa ìtumọ̀ διά pẹ̀lú ọ̀rọ̀-orúkọ inú genitive mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ohun tí ó jẹ́ ọ̀nà tàbí ohun èlò ní Yorùbá.
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: ‘Òdodo’ lè gbé èrò ìdúró títọ́ níwájú Ọlọ́run àti ìṣe ìdájọ́ òdodo, nítorí náà kò fi tipátipá yanjú àyè ìtumọ̀ ọ̀rọ̀ Gíríìkì.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn; ‘Mèsáyà’ mú iṣẹ́ oyè náà hàn kedere.
- source_word: δωρεὰν
  choice: lásán
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí pé ikú náà kò ní èrè tàbí ìdí tó pé; ‘kú lásán’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere tí ó sì ní agbára ìjiyàn náà.
theological_decisions:
- issue: Ìbáṣepọ̀ δικαιοσύνη, òfin, àti ikú Mèsáyà
  choice: Ẹsẹ̀ náà sọ pé bí òdodo bá lè wá nípasẹ̀ òfin, ikú Mèsáyà ì bá jẹ́ lásán.
  alternative: A tún lè gbọ́ δικαιοσύνη gẹ́gẹ́ bí ìdájọ́ òdodo tàbí ìmú ohun tí kò tọ́ padà sí ọ̀nà tó tọ́.
  rationale: Àyíká Gálátíà tẹnumọ́ pé òfin kì í ṣe ọ̀nà tí ènìyàn fi ń rí ìdúró títọ́ níwájú Ọlọ́run. Síbẹ̀, lílo ‘òdodo’ kò dín ọ̀rọ̀ Gíríìkì náà kù sí àlàyé ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo àkójọpọ̀ ọ̀rọ̀ ‘sọ ... di asán’ láti pa agbára ἀθετῶ mọ́, a sì lo ‘Mèsáyà’ gẹ́gẹ́ bí oyè.
