id: GAL.2.14
reference: Galatians 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí mo rí i pé wọn kò rìn ní ìbámu pẹ̀lú òtítọ́ ìhìn rere[a], mo sọ fún Kéfà níwájú gbogbo wọn pé, “Bí ó tilẹ̀ jẹ́ pé Júù ni ìwọ, tí o ń gbé bí ẹni tí kì í ṣe Júù, tí o kò sì ń gbé bí Júù, báwo ni o ṣe ń fi ipá mú àwọn tí kì í ṣe Júù láti máa gbé bí àwọn Júù[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní títẹ̀lé àwòrán ọ̀rọ̀ náà gan-an, “wọn kò rìn ní tààrà ní ìbámu pẹ̀lú òtítọ́ ìhìn rere.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti máa Judaise,” ìyẹn ni, láti tẹ̀lé ọ̀nà ìgbésí ayé àwọn Júù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: wọn kò rin ìrìn wọn ní ìbámu pẹ̀lú
  rationale: Ọ̀rọ̀ Gíríìkì náà ní àwòrán rírìn ní tààrà, ó sì ń tọ́ka sí ìwà tí kò bá ohun tí ó tọ́ mu. Gbólóhùn Yorùbá yìí pa àwòrán ìrìn mọ́, ó sì ṣe kedere pé ìwà wọn ni Pọ́ọ̀lù ń sọ̀rọ̀ nípa rẹ̀.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: ní ìbámu pẹ̀lú òtítọ́ ìhìn rere
  rationale: Pẹ̀lú ọ̀rọ̀ ìṣe ὀρθοποδοῦσιν, πρός ń fi ìbámu pẹ̀lú òṣùwọ̀n kan hàn, kì í ṣe ìtọ́sọ́nà ibi nìkan.
- source_word: Κηφᾷ
  choice: Kéfà
  rationale: A pa orúkọ tí Pọ́ọ̀lù lò níbí mọ́, dípò yíyí i padà sí Pétérù.
- source_word: ἐθνικῶς
  choice: bí ẹni tí kì í ṣe Júù
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe bí ènìyàn ṣe ń gbé. Ìtumọ̀ yìí mú ìyàtọ̀ láàárín Júù àti ẹni tí kì í ṣe Júù ṣe kedere láìfi èrò pé gbogbo wọn jẹ́ abọ̀rìṣà kún un.
- source_word: Ἰουδαϊκῶς
  choice: bí Júù
  rationale: A pa ìlòdì tó wà pẹ̀lú ἐθνικῶς mọ́ ní ọ̀nà Yorùbá tó rọrùn.
- source_word: ἀναγκάζεις
  choice: ń fi ipá mú
  rationale: Èyí fi agbára ìfipámú tí ọ̀rọ̀ Gíríìkì náà ní hàn, láìsọ bóyá ipá ara tàbí ìkìmọ́lẹ̀ ẹgbẹ́ ni.
- source_word: Ἰουδαΐζειν
  choice: láti máa gbé bí àwọn Júù
  rationale: Ọ̀rọ̀ ìṣe náà túmọ̀ sí gbígba ọ̀nà ìgbésí ayé àwọn Júù. Ìtumọ̀ yìí yé òǹkàwé òde òní, ó sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó lè mú ìtumọ̀ àkókò tó késẹ járí wọ inú ẹsẹ náà.
theological_decisions:
- issue: Bí a ṣe lè túmọ̀ Ἰουδαΐζειν láìfi àríyànjiyàn ẹ̀kọ́ ìsìn tó wá lẹ́yìn ìgbà náà kún ọ̀rọ̀ Pọ́ọ̀lù
  choice: láti máa gbé bí àwọn Júù
  alternative: láti tẹ̀lé àṣà àwọn Júù
  rationale: Àyíká ọ̀rọ̀ náà kan ìbágbépọ̀ níbi oúnjẹ àti àwọn ààlà ìdánimọ̀ ẹgbẹ́. Àṣàyàn yìí pa ìtumọ̀ gbígbé ní ọ̀nà Júù mọ́, láìdín in kù sí àṣà kan pàtó tàbí sọ ọ́ di ètò ẹ̀kọ́ ìsìn tí ó wá lẹ́yìn náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo “àwọn tí kì í ṣe Júù” dípò ọ̀rọ̀ tí ó lè túmọ̀ sí abọ̀rìṣà, nítorí ἔθνη ń tọ́ka sí ìyàtọ̀ ẹ̀yà àti ẹgbẹ́ ní àyíká yìí.
