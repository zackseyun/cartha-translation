id: GAL.2.20
reference: Galatians 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: yo
  text: Kì í ṣe èmi mọ́ ni mo ń wà láàyè, ṣùgbọ́n Mèsáyà ló ń gbé inú mi. Ìyè tí mo sì ń gbé nísinsìnyí nínú ara, mo ń gbé e nípa ìgbàgbọ́ nínú Ọmọ Ọlọ́run,[a] ẹni tí ó nífẹ̀ẹ́ mi, tí ó sì fi ara rẹ̀ fún mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo ń gbé nípa ìṣòtítọ́ Ọmọ Ọlọ́run.”
    reason: Ìṣọ̀kan ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ìgbàgbọ́ nínú Ọmọ Ọlọ́run tàbí ìṣòtítọ́ Ọmọ Ọlọ́run.
lexical_decisions:
- source_word: Χριστός
  choice: Mèsáyà
  rationale: A túmọ̀ akọ́lé Kristi náà gẹ́gẹ́ bí “Mèsáyà,” kí iṣẹ́ rẹ̀ gẹ́gẹ́ bí akọ́lé ẹni àmì-òróró Ọlọ́run lè hàn, dípò lílo “Kristi” nìkan.
- source_word: ὃ δὲ νῦν ζῶ
  choice: Ìyè tí mo sì ń gbé nísinsìnyí
  rationale: Gbólóhùn Gíríìkì náà jẹ́ àkíyèsí àdánù; fífi “ìyè” hàn gbangba jẹ́ èdè Yorùbá àdánidá, kò sì fi ìtumọ̀ tuntun kún un.
- source_word: σάρξ
  choice: ara
  rationale: Nínú àyíká yìí, “ara” ń tọ́ka sí ìwàláàyè ènìyàn nínú ara ní ayé yìí; a kò túmọ̀ ọ́ sí “ẹ̀dá ẹlẹ́ṣẹ̀,” nítorí ọ̀rọ̀ náà kò sọ bẹ́ẹ̀ ní kedere.
- source_word: πίστει
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ tó ṣe kedere, tó sì wọ́pọ̀ fún πίστις níbí; àṣàyàn “ìṣòtítọ́” wà nínú àlàyé ìsàlẹ̀.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: nínú Ọmọ Ọlọ́run
  rationale: A fi genitive náà hàn gẹ́gẹ́ bí ohun tí ìgbàgbọ́ dojú kọ—ìgbàgbọ́ nínú Ọmọ Ọlọ́run—ṣùgbọ́n a pa ìtumọ̀ mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: fi ara rẹ̀ fún mi
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìfara-ẹni-lélẹ̀ rẹ̀ nítorí Paulu, láìfi ọ̀rọ̀ bí “rúbọ” kún ohun tí gbólóhùn Gíríìkì sọ ní tààrà.
theological_decisions:
- issue: Ìtumọ̀ πίστις pẹ̀lú genitive nínú τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: nípa ìgbàgbọ́ nínú Ọmọ Ọlọ́run
  alternative: nípa ìṣòtítọ́ Ọmọ Ọlọ́run
  rationale: Ìṣọ̀kan ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìgbàgbọ́ tí ẹni kan ní nínú Ọmọ Ọlọ́run tàbí sí ìṣòtítọ́ Ọmọ Ọlọ́run fúnra rẹ̀. Àkọ́kọ́ wà nínú ẹsẹ̀, ṣùgbọ́n a kò pa èkejì rẹ́; a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní àmì ohùn, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ló ń gbé inú mi” jẹ́ ìtẹnumọ́ Yorùbá àdánidá tó pa ìyàtọ̀ tó wà láàárín “èmi” àti “Mèsáyà” mọ́.
