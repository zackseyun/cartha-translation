id: GAL.2.10
reference: Galatians 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μόνον τῶν πτωχῶν ἵνα μνημονεύωμεν, ὃ καὶ ἐσπούδασα αὐτὸ τοῦτο ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/010.yaml
  text: only that we should remember the poor, which was exactly what I was eager to do.
translation:
  language: yo
  text: Kìkì pé kí a máa rántí àwọn òtòṣì; èyí gan-an ni mo sì ti sapá láti ṣe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: Kìkì pé
  rationale: Ó fi hàn pé èyí nìkan ni ohun tí wọ́n béèrè gẹ́gẹ́ bí àfikún sí àdéhùn náà, ó sì bá ìlò Yorùbá mu ní ìbẹ̀rẹ̀ gbólóhùn yìí.
- source_word: τῶν πτωχῶν
  choice: àwọn òtòṣì
  rationale: Ó tọ́ka sí àwọn ènìyàn tí wọ́n jẹ́ aláìní tàbí tálákà; “àwọn òtòṣì” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún ìtumọ̀ yìí.
- source_word: ἵνα μνημονεύωμεν
  choice: kí a máa rántí
  rationale: Ẹ̀ka ἵνα náà sọ ohun kan ṣoṣo tí wọ́n béèrè. “Máa rántí” pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì lè ní ìtumọ̀ pé kí wọ́n máa fi ìtọ́jú hàn ní ti ìṣe.
- source_word: ὃ
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò yìí ń tọ́ka padà sí gbogbo ìbéèrè láti máa rántí àwọn òtòṣì, kì í ṣe sí àwọn òtòṣì fúnra wọn.
- source_word: ἐσπούδασα
  choice: mo ti fi taratara ṣe
  rationale: Ó mú ìtara àti ìsapá gidi tí ọ̀rọ̀ náà ní jáde, kì í ṣe ìfẹ́ inú lásán.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: èyí gan-an sì ni ... ṣe
  rationale: “Gan-an” pa ìtẹnumọ́ αὐτὸ τοῦτο (“ohun yìí gan-an”) mọ́ ní ọ̀nà tó jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Bóyá “rántí” túmọ̀ sí ìrántí inú nìkan tàbí ìtọ́jú nípa ìṣe
  choice: Pa “rántí” mọ́, kí ìtẹ̀sí sí ìṣe hàn nínú “ṣe.”
  alternative: Túmọ̀ ọ́ ní tààrà sí “ṣe ìrànlọ́wọ́ fún àwọn òtòṣì.”
  rationale: Ọ̀rọ̀ Gíríìkì lo μνημονεύω (“rántí”), ṣùgbọ́n àyíká ọ̀rọ̀ fi ìṣe hàn. Ìtumọ̀ yìí kò dín ọ̀rọ̀ náà kù sí ìrànlọ́wọ́ owó nìkan, bẹ́ẹ̀ ni kò sọ ọ́ di ìrántí inú lásán.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ó jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. “Fi taratara ṣe” sọ ìtara àti ìsapá jáde láì di ọ̀rọ̀ náà mọ́ ète ìjọ kan.
