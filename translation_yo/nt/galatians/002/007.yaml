id: GAL.2.7
reference: Galatians 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: yo
  text: Ṣùgbọ́n, ní ìdàkejì sí i[a], nígbà tí wọ́n rí i pé a ti fi ìhìn rere fún àwọn aláìkọlà lé mi lọ́wọ́, gẹ́gẹ́ bí a ti fi ìhìn rere fún àwọn tí a kọ ní ilà lé Peteru lọ́wọ́,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gangan, “ìhìn rere ti àìkọlà … ti ìkọlà”; ìyẹn ni, ìhìn rere tí a fi lé wọn lọ́wọ́ fún àwọn ẹgbẹ́ wọ̀nyẹn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: Ṣùgbọ́n ní òdì kejì
  rationale: Ó fi ìtakora líle hàn sí ohun tí a sọ ṣáájú, ó sì túmọ̀ ọ̀rọ̀ Gíríìkì náà lọ́nà àdánidá ní Yorùbá.
- source_word: ἰδόντες
  choice: nígbà tí wọ́n rí i
  rationale: Ọ̀rọ̀ ìṣe aláìlópìn aorist náà ń sọ ipò tí ó yí èrò pàtàkì náà ká; gbólóhùn yìí ṣe kedere ní Yorùbá.
- source_word: πεπίστευμαι
  choice: a ti fi ... lé mi lọ́wọ́
  rationale: Perfect passive náà ní ìtumọ̀ pé a ti gbé iṣẹ́ tàbí ohun ìgbẹ́kẹ̀lé kan lé Pọ́ọ̀lù lọ́wọ́; àkójọpọ̀ 'a ti fi ... lé ... lọ́wọ́' jẹ́ àdánidá, ó sì pa ipò passive mọ́.
- source_word: τὸ εὐαγγέλιον
  choice: ìhìn rere
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó wọ́pọ̀, tí ó sì pa ìtumọ̀ euangelion mọ́.
- source_word: τῆς ἀκροβυστίας
  choice: fún àwọn aláìkọlà
  rationale: Ó tú genitive náà gẹ́gẹ́ bí àwùjọ tí iṣẹ́ ìhìn rere náà dojú kọ, láì yí ọ̀rọ̀ Pọ́ọ̀lù padà sí 'Kèfèrí'.
- source_word: καθὼς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra tó wà láàárín iṣẹ́ Pọ́ọ̀lù àti ti Peteru hàn ní kedere.
- source_word: Πέτρος
  choice: Peteru
  rationale: Fọ́ọ̀mù orúkọ náà ni a mọ̀ sí ní ìlò Bíbélì Yorùbá.
- source_word: τῆς περιτομῆς
  choice: ti àwọn akọlà
  rationale: Ó ṣe ìwọ̀ntúnwọ̀nsì pẹ̀lú 'àwọn aláìkọlà' ó sì pa àmì májẹ̀mú-ẹ̀yà tí Gíríìkì lò mọ́.
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: a ti fi ... lé Peteru lọ́wọ́
  rationale: A tún èrò ìgbẹ́kẹ̀lé tí ó fara sin nínú Gíríìkì sọ, nítorí èdè Yorùbá nílò rẹ̀ kí ìfiwéra náà lè kún, láì fi èrò tuntun kún un.
theological_decisions:
- issue: Bóyá kí ἀκροβυστία / περιτομή jẹ́ orúkọ ẹ̀yà ('Kèfèrí' / 'Júù') tàbí kí a pa àmì ìkọlà tí Gíríìkì lò mọ́.
  choice: àwọn aláìkọlà / àwọn akọlà
  alternative: àwọn Kèfèrí / àwọn Júù; àìkọlà / ìkọlà
  rationale: Gíríìkì lo ipò ìkọlà gẹ́gẹ́ bí àmì májẹ̀mú àti ẹ̀yà. Ìtumọ̀ yìí pa ọ̀nà tí Pọ́ọ̀lù gbà sọ ọ́ mọ́, kò sì sọ ọ́ di àlàyé ẹ̀yà nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò. 'Aláìkọlà/akọlà' pa ìfiwéra Gíríìkì mọ́; àlàyé ẹsẹ̀ ìsàlẹ̀ sì tọ́ka sí ìṣètò ọ̀rọ̀ gangan.
