base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: yo
  text: Àwọn Júù yòókù náà sì bá a ṣe àgàbàgebè[a], tó bẹ́ẹ̀ tí àgàbàgebè wọn fi gbá Bánábà pàápàá lọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwọn Júù yòókù náà dara pọ̀ mọ́ ọn nínú àgàbàgebè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tó bẹ́ẹ̀ tí a fi fa Bánábà pàápàá lọ nípasẹ̀ àgàbàgebè wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: dara pọ̀ mọ́ ọn nínú àgàbàgebè
  rationale: Ó fi hàn pé àwọn yòókù bá a kópa nínú ìwà àgàbàgebè náà; ó sì pa agbára σύν- mọ́ ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: αὐτῷ
  choice: mọ́ ọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ dative náà tọ́ka sí ìbáṣepọ̀ pẹ̀lú Pétérù nínú ìṣe rẹ̀; ‘mọ́ ọn’ mú ìtumọ̀ yìí jáde lọ́nà àdánidá.
- source_word: οἱ λοιποὶ Ἰουδαῖοι
  choice: Àwọn Júù yòókù
  rationale: ‘Yòókù’ tọ́ka sí àwọn tó ṣẹ́ kù nínú ẹgbẹ́ àwọn Júù tí a ń sọ̀rọ̀ nípa wọn, ní ìyàtọ̀ sí Pétérù.
- source_word: συναπήχθη
  choice: fi fa ... lọ
  rationale: Ìtumọ̀ náà pa fọ́ọ̀mù àìṣe ti ọ̀rọ̀ Gíríìkì mọ́, ó sì fi hàn pé ipa ìwà àwọn ẹlòmíràn ló fà Bánábà tẹ̀ lé wọn.
- source_word: ὑποκρίσει
  choice: àgàbàgebè
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún ìwà ẹni tó ń ṣe bí ẹni pé ohun míì ni òun jẹ́; pípa á tún ṣe nínú ẹsẹ náà tẹnumọ́ ọ̀rọ̀ Pọ́ọ̀lù.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. A lo ‘àgàbàgebè’ láti mú ìtẹnumọ́ inú ọ̀rọ̀ Gíríìkì jáde, a sì tún un ṣe gẹ́gẹ́ bí orísun ṣe ṣe.
