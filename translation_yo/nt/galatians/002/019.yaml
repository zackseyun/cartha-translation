base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: yo
  text: Nítorí pé nípasẹ̀ òfin, mo kú sí òfin, kí n lè wà láàyè fún Ọlọ́run. A ti kàn mí mọ́ àgbélébùú pẹ̀lú Mèsáyà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé, ó sì ń fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀.
- source_word: διὰ νόμου
  choice: nípasẹ̀ òfin
  rationale: Ó pa ipa irinṣẹ́ ti διά pẹ̀lú gẹnitífù mọ́, láì ṣàlàyé ọ̀nà tí òfin gbà mú èyí ṣẹ.
- source_word: νόμῳ
  choice: sí òfin
  rationale: Ọ̀rọ̀ yìí pa dẹ́tífù àti ìtumọ̀ ìbáṣepọ̀ tí ikú ti dáwọ́ dúró mọ́; ó tún dá ìṣọ̀kan ‘mo kú sí òfin’ mọ́ ní Yorùbá.
- source_word: ἀπέθανον
  choice: mo kú
  rationale: Aorístì náà tọ́ka sí ìṣẹ̀lẹ̀ pàtó kan ní àtẹ̀yìnwá, èyí tí ọ̀rọ̀-ìṣe àtẹ̀yìnwá Yorùbá gbé jáde lọ́nà àdánidá.
- source_word: ἵνα
  choice: kí n lè
  rationale: Ó sọ ète ọ̀rọ̀ náà ní Yorùbá òde òní lọ́nà tó ṣe kedere.
- source_word: θεῷ ζήσω
  choice: kí n lè wà láàyè sí Ọlọ́run
  rationale: ‘Sí Ọlọ́run’ pa agbára ìtọ́sọ́nà àti ìbáṣepọ̀ dẹ́tífù mọ́, dípò kí a dín un kù sí ṣíṣe ohun kan fún Ọlọ́run nìkan.
- source_word: Χριστῷ
  choice: Mèsáyà
  rationale: Ó túmọ̀ àkọ́lé Χριστός gẹ́gẹ́ bí ẹni tí a fòróró yàn, kì í ṣe bí orúkọ lásán.
- source_word: συνεσταύρωμαι
  choice: A ti kàn mí mọ́ àgbélébùú pọ̀ mọ́
  rationale: Ìkọ̀ṣe ‘A ti…’ fi ìṣe tó ṣẹlẹ̀ tẹ́lẹ̀ tí àbájáde rẹ̀ ṣì dúró hàn; ‘pọ̀ mọ́’ sì pa ìtumọ̀ συν- mọ́.
theological_decisions:
- issue: Bóyá kí a tú ‘nípasẹ̀ òfin, mo kú sí òfin’ sí ọ̀rọ̀ ìtumọ̀ tó gùn sí i
  choice: Pa ọ̀rọ̀ kúkúrú náà mọ́ láì fi àlàyé kún un.
  alternative: ‘Nípasẹ̀ ìdálẹ́bi òfin, mo kú sí agbára òfin’ tàbí ‘òfin mú kí n jáwọ́ nínú pípa òfin mọ́.’
  rationale: Gíríìkì náà kúkúrú, ó sì ní ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ nínú. Fífi ‘ìdálẹ́bi’ tàbí ‘pípa òfin mọ́’ kún un yóò yan ìtumọ̀ kan tí orísun kò sọ ní tààrà.
- issue: Bóyá Χριστός jẹ́ orúkọ tàbí àkọ́lé níbí
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ìtumọ̀ àkọ́lé ẹni tí a fòróró yàn ṣì wúlò nínú àríyànjiyàn Páùlù; yíyan ‘Mèsáyà’ kò fi ẹ̀kọ́ ẹ̀ya ìjọ kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá àṣàtúnṣe tó bójú mu, tó ní àmì ohùn níbi tó yẹ. A lo ‘àgbélébùú’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tí gbogbo ènìyàn mọ̀, ‘wà láàyè sí Ọlọ́run’ sì mọ̀ọ́mọ̀ pa ìṣòro àti agbára ọ̀rọ̀ Gíríìkì mọ́ dípò lílo ọ̀rọ̀ tó rọrùn ṣùgbọ́n tó túmọ̀ sí ‘gbé ayé fún Ọlọ́run’ nìkan.
