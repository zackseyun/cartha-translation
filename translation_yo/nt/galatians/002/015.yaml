  yaml_path: translation/nt/galatians/002/015.yaml
  text: We are Jews by birth and not sinners from among the Gentiles[b][a],
translation:
  language: yo
  text: Àwa jẹ́ Júù nípa ìbí, kì í ṣe ẹlẹ́ṣẹ̀ lára àwọn Kèfèrí[b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “kì í ṣe àwọn ẹlẹ́ṣẹ̀ Kèfèrí.”'
    reason: lexical_alternative
  - marker: b
    text: “Nípa ìbí” túmọ̀ gbólóhùn kan tí ó túmọ̀ ní tààrà sí “nípa ẹ̀dá”; níhìn-ín, ó ń tọ́ka sí ìran tàbí ẹ̀yà ẹni láti ìbí.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς
  choice: Àwa
  rationale: A dá arọ́pò-orúkọ tí a sọ ní kedere sílẹ̀ láti pa ìtẹnumọ́ díẹ̀ tí ó wà nínú Gíríìkì mọ́.
- source_word: φύσει
  choice: nípa ìbí
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìran ẹni láti ìbí, kì í ṣe ìwà inú tàbí ẹ̀dá ìwà rere; “nípa ìbí” ṣe èrò náà kedere ní Yorùbá òde òní.
- source_word: Ἰουδαῖοι
  choice: Júù
  rationale: Èyí ni ọ̀nà àdánidá láti sọ ìdánimọ̀ ẹ̀yà tí a fi ṣe ìyàtọ̀ sí àwọn Kèfèrí.
- source_word: ἐξ ἐθνῶν
  choice: láti inú àwọn Kèfèrí
  rationale: Ó pa ìtumọ̀ gbólóhùn aṣáájú ọ̀rọ̀ náà àti ìyàtọ̀ ẹ̀yà mọ́; “Kèfèrí” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún àwọn tí kì í ṣe Júù ní àyíká Páùlù.
- source_word: ἁμαρτωλοί
  choice: ẹlẹ́ṣẹ̀
  rationale: A pa ọ̀rọ̀ ìṣe-ẹ̀sìn tí ó wọ́pọ̀ mọ́, láì dín ìyàtọ̀ líle tí gbólóhùn Gíríìkì ṣe kù.
theological_decisions:
- issue: Bóyá kí ẹsẹ yìí dà bí ẹni pé Páùlù ń fìdí ìwà rere àbínibí àwọn Júù ju àwọn Kèfèrí lọ múlẹ̀
  choice: A pa ìyàtọ̀ ẹ̀yà tí ọ̀rọ̀ náà sọ ní tààrà mọ́, láì fi àlàyé kún un pé àwọn Júù jẹ́ olódodo nípa ẹ̀dá.
  alternative: “a kò sì kà wá sí ẹlẹ́ṣẹ̀ bí àwọn Kèfèrí”
  rationale: Gíríìkì sọ ìyàtọ̀ náà ní ṣókí, ní tààrà. Àyíká tí ó tẹ̀ lé e ló ṣàlàyé rẹ̀; kò yẹ kí a kó àlàyé yẹn wọ inú ẹsẹ yìí.
translation_notes:
  register: Yorùbá àfọwọ́dá, ọ̀wọ̀, àti òde òní ni a lò. A yan “a kì í sì í ṣe” fún ìsọ̀rọ̀ àdánidá, nígbà tí “láti inú àwọn Kèfèrí” pa ìṣètò àti ìtumọ̀ Gíríìkì mọ́. Àwọn àmì àlàyé [b][a] wà nínú ọ̀rọ̀ gẹ́gẹ́ bí a ti béèrè.
