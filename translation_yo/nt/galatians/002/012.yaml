id: GAL.2.12
reference: Galatians 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: yo
  text: Nítorí, kí àwọn kan tó wá láti ọ̀dọ̀ Jákọ́bù[a], ó máa ń bá àwọn Kèfèrí jẹun; ṣùgbọ́n nígbà tí wọ́n dé, ó ń fà sẹ́yìn, ó sì ń ya ara rẹ̀ sọ́tọ̀, nítorí ó bẹ̀rù àwọn tí ó jẹ́ ti ìkọlà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn kan láti àwùjọ Jákọ́bù”; Gíríìkì fúnra rẹ̀ kò sọ ní pàtó pé Jákọ́bù ló rán wọn.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn ẹgbẹ́ ìkọlà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ γὰρ ἐλθεῖν
  choice: Nítorí kí ... tó wá
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣe tó ṣáájú ìṣẹ̀lẹ̀ mìíràn hàn, ó sì pa agbára àkókò πρό mọ́.
- source_word: τινας
  choice: àwọn kan
  rationale: Ọ̀rọ̀ náà tọ́ka sí àwọn ènìyàn kan láì sọ iye tàbí ẹni tí wọ́n jẹ́ ní pàtó; “àwọn kan” jẹ́ Yorùbá tó ṣe déédé.
- source_word: ἀπὸ Ἰακώβου
  choice: láti ọ̀dọ̀ Jákọ́bù
  rationale: Ó pa ìtumọ̀ orísun tàbí ìbáṣepọ̀ mọ́ láì fi kún un pé Jákọ́bù ló rán wọn ní àṣẹ.
- source_word: μετὰ τῶν ἐθνῶν
  choice: bá àwọn Kèfèrí
  rationale: Nínú lílò Páùlù, ἔθνη sábà máa ń tọ́ka sí àwọn tí kì í ṣe Júù; a kò fi “onígbàgbọ́” kún un nítorí kò sí nínú Gíríìkì.
- source_word: συνήσθιεν
  choice: ó máa ń ... jẹun
  rationale: Àkókò imperfect fi ìṣe àṣà tó ń ṣẹlẹ̀ léraléra hàn; “máa ń” mú èyí jáde ní Yorùbá.
- source_word: ὑπέστελλεν
  choice: ó bẹ̀rẹ̀ sí í fà sẹ́yìn
  rationale: Ó sọ ìyọkúrò díẹ̀díẹ̀ tàbí ìfàsẹ́yìn tó bẹ̀rẹ̀, gẹ́gẹ́ bí imperfect ṣe lè túmọ̀ nínú àyíká yìí.
- source_word: ἀφώριζεν ἑαυτόν
  choice: ó sì ya ara rẹ̀ sọ́tọ̀
  rationale: Ó pa agbára reflexive àti ìyapa láàárín àwọn ènìyàn mọ́.
- source_word: φοβούμενος
  choice: nítorí ó bẹ̀rù
  rationale: Participial phrase náà ní agbára ìdí nínú àyíká yìí; gbólóhùn yìí jẹ́ Yorùbá àdánidá tó sì pa ìtumọ̀ náà mọ́.
- source_word: τοὺς ἐκ περιτομῆς
  choice: àwọn tí ó jẹ́ ti ìdádọ̀dọ́
  rationale: Ó tẹ̀lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí, láì sọ wọ́n di ẹgbẹ́ olóṣèlú tàbí ẹ̀ya ìsìn kan ní kedere ju ohun tí ọ̀rọ̀ náà sọ lọ.
theological_decisions:
- issue: Bóyá ἀπὸ Ἰακώβου túmọ̀ sí pé Jákọ́bù fọwọ́ sí ìṣe àwọn ọkùnrin náà
  choice: láti ọ̀dọ̀ Jákọ́bù
  alternative: àwọn tó wá láti ẹgbẹ́ Jákọ́bù; àwọn tí Jákọ́bù rán
  rationale: Gíríìkì fi orísun tàbí ìbáṣepọ̀ hàn, ṣùgbọ́n kò sọ ní pàtó pé Jákọ́bù fún wọn ní àṣẹ. Ìtumọ̀ pàtàkì náà pa àìdánilójú yìí mọ́.
- issue: Bóyá τοὺς ἐκ περιτομῆς yẹ kí a pè ní ẹgbẹ́ ìdádọ̀dọ́
  choice: àwọn tí ó jẹ́ ti ìdádọ̀dọ́
  alternative: àwọn ẹgbẹ́ ìdádọ̀dọ́
  rationale: Ọ̀rọ̀ Gíríìkì dá àwọn ènìyàn náà mọ̀ nípa ìdádọ̀dọ́, ṣùgbọ́n kò pe wọ́n ní faction ní tààràtà; ìtumọ̀ náà yẹra fún fífi ìtumọ̀ àfikún lé e lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún gbogbo ènìyàn ni a lò. A fi àmì ohùn sí ibi tí ó yẹ. “Ó máa ń ... jẹun” mú ìṣe àṣà imperfect jáde, “ó bẹ̀rẹ̀ sí í fà sẹ́yìn” sì fi ìlọsíwájú ìyọkúrò hàn. Àwọn àlàyé ẹsẹ̀ pa àìdánilójú nípa ìbáṣepọ̀ pẹ̀lú Jákọ́bù àti ìdánimọ̀ ẹgbẹ́ ìdádọ̀dọ́ mọ́.
