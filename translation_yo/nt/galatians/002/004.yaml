    rationale: Ọ̀rọ̀ náà kì í ṣe ọ̀nà tó mọ́gbọ́n dání láti sọ ìwọlé àṣírí. ‘Tí wọ́n wọlé ní ìkọ̀kọ̀’ jẹ́ àdánidá, ó sì pa ìfẹ̀hónúhàn παρεισῆλθον mọ́.
