    issue: ‘láti ṣe amí sí òmìnira’
    rationale: Nínú Yorùbá, a sábà máa ń ‘ṣe amí lórí’ ohun kan. Àtúnṣe náà mú ìtumọ̀ κατασκοπῆσαι—ṣíṣe amí ní ìkọ̀kọ̀ lórí òmìnira wọn—kedere.
  - severity: low
