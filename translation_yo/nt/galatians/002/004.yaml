revisions:
- from: Ṣùgbọ́n nítorí àwọn arákùnrin èké[a] tí a mú wọlé ní ìkọ̀kọ̀, tí wọ́n yọ́ wọlé láti ṣe amí sí òmìnira tí a ní nínú Mèsáyà Jésù[b], kí wọ́n lè sọ wá di ẹrú—
  to: Ṣùgbọ́n nítorí àwọn arákùnrin èké[a] tí a mú wọlé ní ìkọ̀kọ̀, tí wọ́n wọlé ní ìkọ̀kọ̀ láti ṣe amí lórí òmìnira wa tí a ní nínú Mèsáyà Jésù[b], kí wọ́n lè sọ wá di ẹrú—
  rationale: 'A tún àwọn ọ̀rọ̀ méjì ṣe nìkan fún ìbámu pẹ̀lú ìlò Yorùbá: a lo ‘ṣe amí lórí’ dípò ‘ṣe amí sí,’ a sì lo ‘wọ́n wọlé ní ìkọ̀kọ̀’ dípò ‘wọ́n yọ́ wọlé.’ A tún sọ ‘òmìnira wa’ ní tààràtà láti fara mọ́ ἐλευθερίαν ἡμῶν. Àwọn ìyókù, pẹ̀lú àmì gígùn ìparí, ni a pa mọ́.'
  reviewer_model: gpt-5.6-terra
