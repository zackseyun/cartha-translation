review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ètò ọ̀rọ̀ Gíríìkì, ìfẹ̀hónúhàn ìwọlé àṣírí méjì, òmìnira ‘wa,’ ìdánimọ̀ Mèsáyà Jésù, àti ète láti sọ àwọn aposteli náà di ẹrú mọ́. Síbẹ̀, ‘ṣe amí sí’ kò fi ohun tí a ń ṣe amí lórí hàn ní Yorùbá lọ́nà tó péye; ‘lórí’ dáa sí i fún κατασκοπῆσαι.
  naturalness: ‘Wọ́n yọ́ wọlé’ lè dà bí ọ̀rọ̀ tí kò wọ́pọ̀ tàbí tí kò ní ìtumọ̀ ìfọ̀lọ́wọ́sí tí a fẹ́ níbí. ‘Wọ́n wọlé ní ìkọ̀kọ̀’ jẹ́ kedere, ó sì jẹ́ Yorùbá ìwé òde òní tó dáa.
  terminology: ‘Àwọn arákùnrin èké,’ ‘òmìnira,’ ‘Mèsáyà Jésù,’ àti ‘sọ wá di ẹrú’ bá ọ̀rọ̀ ìpilẹ̀ mu. Àwọn àmì àlàyé ìsàlẹ̀ a àti b wà ní ibi tó tọ́, wọ́n sì bá ọ̀rọ̀ wọn mu.
  issues:
