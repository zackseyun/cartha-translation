id: GAL.2.4
reference: Galatians 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: yo
  text: Ṣùgbọ́n nítorí àwọn arákùnrin èké[a] tí a mú wọlé ní ìkọ̀kọ̀, tí wọ́n wọlé ní ìkọ̀kọ̀ láti ṣe amí lórí òmìnira wa tí a ní nínú Mèsáyà Jésù[b], kí wọ́n lè sọ wá di ẹrú—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn arákùnrin èké” pa ọ̀rọ̀ ìbátan tí Pọ́ọ̀lù lò mọ́; gbólóhùn náà ń tọ́ka sí àwọn ènìyàn tí wọ́n fi ara wọn hàn bí àwọn onígbàgbọ́ ẹlẹgbẹ́ wọn.
    reason: cultural_note
  - marker: b
    text: Tàbí “Kristi Jésù.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρεισάκτους
  choice: tí a mú wọlé ní ìkọ̀kọ̀
  rationale: Ó fi hàn pé a mú wọn wọlé láti òde ní ọ̀nà àṣírí, ó sì yàtọ̀ sí ọ̀rọ̀-ìṣe παρεισῆλθον tí ó tẹ̀ lé e.
- source_word: ψευδαδέλφους
  choice: àwọn arákùnrin èké
  rationale: Ó pa àwòrán ìbátan tí Pọ́ọ̀lù lò mọ́, ó sì dá agbára ọ̀rọ̀ àríwísí náà sí.
- source_word: παρεισῆλθον
  choice: wọ́n yọ́ wọlé
  rationale: Ọ̀rọ̀ yìí sọ ìwọlé àṣírí tí a kò fẹ́ kí àwọn ẹlòmíràn kíyè sí ní Yorùbá àdánidá.
- source_word: κατασκοπῆσαι
  choice: láti ṣe amí sí
  rationale: Ó fi ète ọ̀tá àti ṣíṣe àkíyèsí ní ìkọ̀kọ̀ hàn kedere.
- source_word: ἐλευθερίαν
  choice: òmìnira
  rationale: Èyí ni ọ̀rọ̀ Yorùbá òde òní tí ó ṣe déédé jù lọ, ó sì pa agbára ẹ̀kọ́ ìgbàgbọ́ àti ti àwùjọ inú ọ̀rọ̀ náà mọ́.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: A túmọ̀ Χριστός gẹ́gẹ́ bí oyè níbí, nítorí pé ìtumọ̀ rẹ̀ gẹ́gẹ́ bí Ẹni Àmì-òróró náà ṣì ṣe pàtàkì nínú gbólóhùn yìí.
- source_word: καταδουλώσουσιν
  choice: sọ wá di ẹrú
  rationale: Ó sọ ìtumọ̀ fífi ènìyàn sábẹ́ ipá ẹrú ní kedere àti ní Yorùbá àdánidá.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: kí wọ́n lè sọ wá di ẹrú
  rationale: Ó fi ète tí wọ́n ní hàn, láìfi dájú pé ète náà yóò ṣàṣeyọrí.
theological_decisions:
- issue: Ṣíṣe Χριστῷ bí oyè tàbí bí apá kan orúkọ
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Ní àyíká ọ̀rọ̀ yìí, Χριστός ṣì lè jẹ́ oyè tí ó ń fi Jésù hàn gẹ́gẹ́ bí Mèsáyà, dípò kí ó dà bí orúkọ lásán. A fi àṣàyàn míì sí àlàyé ìsàlẹ̀ láti pa ìlò Kristi tí ó wọ́pọ̀ mọ́.
translation_notes:
  register: A lo Yorùbá ìwé mímọ́ tí ó ní iyì ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A pa dídá gbólóhùn náà dúró pẹ̀lú àmì gígùn (—), nítorí ẹsẹ yìí jẹ́ apá kan ṣoṣo nínú gbólóhùn Gíríìkì tí ó ń bá a lọ.
