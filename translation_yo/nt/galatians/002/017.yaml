id: GAL.2.17
reference: Galatians 2:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: yo
  text: 'Ṣùgbọ́n bí ó bá hàn pé àwa fúnra wa pẹ̀lú jẹ́ ẹlẹ́ṣẹ̀ nígbà tí a ń wá láti rí ìdáláre nínú Mèsáyà[a], ǹjẹ́ Mèsáyà wá jẹ́ ìránṣẹ́ ẹ̀ṣẹ̀? Kí ó má ṣe rí bẹ́ẹ̀ láé!


    [a] Mèsáyà: ọ̀rọ̀ tí a sábà máa ń túmọ̀ sí “Kristi” níbí àti ní ìlò kejì rẹ̀ nínú ẹsẹ yìí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mèsáyà: ọ̀rọ̀ tí a sábà máa ń túmọ̀ sí “Kristi” níbí àti ní ìlò kejì rẹ̀ nínú ẹsẹ yìí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: nígbà tí a ń wá
  rationale: Ó fi iṣẹ́ tí ń lọ ní àkókò kan náà pẹ̀lú gbólóhùn pàtàkì hàn, gẹ́gẹ́ bí participle Gíríìkì ṣe rí.
- source_word: δικαιωθῆναι
  choice: láti rí ìdáláre
  rationale: Ìṣọ̀rọ̀ yìí jẹ́ ti ẹjọ́, ó sì pa ìtumọ̀ jíjẹ́ ẹni tí a dá láre mọ́ láì sọ ẹni tó ṣe ìdáláre náà ní pàtó.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Ó pa ipa Χριστός gẹ́gẹ́ bí oyè mọ́, ó sì fi ìbáṣepọ̀ pẹ̀lú Mèsáyà hàn.
- source_word: εὑρέθημεν
  choice: ó bá hàn pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a rí wa ní ipò kan, láì pinnu ẹni tó ṣe àwárí náà.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: àwa fúnra wa pẹ̀lú jẹ́ ẹlẹ́ṣẹ̀
  rationale: “Àwa fúnra wa” mú ìtẹnumọ́ αὐτοὶ jáde, “pẹ̀lú” sì dúró fún καί.
- source_word: ἁμαρτίας διάκονος
  choice: ìránṣẹ́ ẹ̀ṣẹ̀
  rationale: Ó sọ ìbáṣepọ̀ iṣẹ́ tàbí ṣíṣe fún ẹ̀ṣẹ̀ ní kedere, láì mú èrò ipò iṣẹ́ ìjọ wọ inú rẹ̀.
- source_word: μὴ γένοιτο
  choice: Kí ó má ṣe rí bẹ́ẹ̀ láé!
  rationale: Ó pa agbára ìkọ̀sílẹ̀ Pọ́ọ̀lù àti ìrísí ìfẹ́-ọkàn òdì ti ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ náà yẹ kí ó fi hàn pé Mèsáyà ló ń fa ẹ̀ṣẹ̀.
  choice: ǹjẹ́ Mèsáyà wá jẹ́ ìránṣẹ́ ẹ̀ṣẹ̀?
  alternative: ǹjẹ́ Mèsáyà wá ń mú ènìyàn ṣẹ̀?
  rationale: Gíríìkì gbé àbájáde kan kalẹ̀ gẹ́gẹ́ bí ìbéèrè àsọyé tí Pọ́ọ̀lù kọ̀, kì í ṣe gẹ́gẹ́ bí ẹ̀kọ́ pé Mèsáyà ń fa ẹ̀ṣẹ̀. “Ìránṣẹ́ ẹ̀ṣẹ̀” pa ìfura tí a ń kọ̀ náà mọ́ láì ṣàlàyé rẹ̀ ré kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá boṣewa alámi-ohùn ni a lò, ní ìforúkọsílẹ̀ ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. “Ǹjẹ́ … wá” pa agbára ìbéèrè àsọyé ἆρα mọ́; “Kí ó má ṣe rí bẹ́ẹ̀ láé!” sì jẹ́ ìkọ̀sílẹ̀ líle ṣùgbọ́n àdánidá.
