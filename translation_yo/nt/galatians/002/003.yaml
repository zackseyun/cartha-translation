revisions:
- from: Síbẹ̀, a kò tilẹ̀ fipá mú Títù, ẹni tí ó wà pẹ̀lú mi, láti kọ ilà, bí ó tilẹ̀ jẹ́ ọmọ Gíríìkì.[a][b]
  to: Ṣùgbọ́n kódà Títù, ẹni tí ó wà pẹ̀lú mi, bí ó tilẹ̀ jẹ́ ọmọ Gíríìkì, ni a kò fipá mú láti kọ ilà.[a][b]
  rationale: Àtúnṣe náà fi ἀλλ’ hàn bí “Ṣùgbọ́n,” ó tumọ̀ οὐδὲ nípasẹ̀ “kódà,” ó sì ṣètò gbolohun náà kí ìṣe afarahẹ “ni a kò fipá mú” ba ἠναγκάσθη mu. A pa “ọmọ Gíríìkì” àti “kọ ilà” mọ́. A tún ṣe àtúnṣe àwọn àlàyé ìsàlẹ̀ kí wọ́n má bàa yí ìtumọ̀ ìyọ̀ǹda padà sí ìdí, tàbí kí wọ́n sọ ohun tí ọ̀rọ̀ orísun kò sọ ní tààràtà.
