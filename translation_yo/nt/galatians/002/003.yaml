base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: yo
  text: Ṣùgbọ́n kódà Títù, ẹni tí ó wà pẹ̀lú mi, bí ó tilẹ̀ jẹ́ ọmọ Gíríìkì, ni a kò fipá mú láti kọ ilà.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Títù, ẹni tí ó wà pẹ̀lú mi, tí ó jẹ́ ọmọ Gíríìkì.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ní “ọmọ Gíríìkì” ní pàtó, kì í ṣe “Kèfèrí” lásán. Nínú àyíká ọ̀rọ̀ náà, èyí ń tọ́ka sí ẹni tí kò jẹ́ Júù, ẹni tí a kò kọ ilà.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλ’
  choice: Síbẹ̀
  rationale: Ó fi ìyàtọ̀ sí ohun tí a sọ ṣáájú hàn ní ọ̀nà tí ó bá Yorùbá òde òní mu.
- source_word: οὐδὲ
  choice: a kò tilẹ̀
  rationale: Ó pa agbára ìsẹ́ pé ‘kódà ... kò’ mọ́, ó sì dojú ìtẹnumọ́ kọ Títù.
- source_word: Τίτος
  choice: Títù
  rationale: A kọ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe àwọn orúkọ inú Bíbélì ní Yorùbá.
- source_word: ὁ σὺν ἐμοί
  choice: ẹni tí ó wà pẹ̀lú mi
  rationale: Ó tú àpèjúwe tí ó ń dá Títù mọ̀ sí Yorùbá tí ó ṣe kedere, láìfi èrò míì kún un.
- source_word: Ἕλλην ὤν
  choice: bí ó tilẹ̀ jẹ́ ọmọ Gíríìkì
  rationale: 'Ọ̀rọ̀ alábápín náà ní agbára ìyọ̀ǹda nínú àyíká yìí: bí ó tilẹ̀ jẹ́ ọmọ Gíríìkì, wọn kò fipá mú un.'
- source_word: Ἕλλην
  choice: ọmọ Gíríìkì
  rationale: Ó pa ìtumọ̀ pàtó ti ẹni Gíríìkì mọ́ dípò gbígbòòrò rẹ̀ sí ‘Kèfèrí.’
- source_word: ἠναγκάσθη
  choice: a kò ... fipá mú
  rationale: Ìṣe afarahẹ Gíríìkì náà fi hàn pé ìfipámú láti ọ̀dọ̀ àwọn ẹlòmíràn ni; èyí ni ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: περιτμηθῆναι
  choice: láti kọ ilà
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́, tí ó sì sọ ìkọlà ní tààràtà.
theological_decisions:
- issue: Ṣíṣe Ἕλλην ní ọ̀rọ̀ ẹ̀yà-àṣà tàbí ní àkótán ìtumọ̀ ẹ̀sìn
  choice: ọmọ Gíríìkì
  alternative: Kèfèrí
  rationale: Ẹsẹ̀ náà sọ ẹni tí Títù jẹ́ gẹ́gẹ́ bí ọmọ Gíríìkì ní pàtó. Bí ó tilẹ̀ jẹ́ pé èyí túmọ̀ sí ẹni tí kò kọ ilà ní àyíká náà, ìtumọ̀ kò gbọ́dọ̀ sọ ọ̀rọ̀ pàtó inú orísun di ọ̀rọ̀ gbogbogbò.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó ní iyì, tí ó sì ṣeé lóye ni a lò. A lo ‘kọ ilà’ gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì Yorùbá tí ó mọ́ fún ìkọlà; a sì fi àmì ohùn sí ibi tí ó bá ọ̀nà ìkọ̀wé Yorùbá mu.
