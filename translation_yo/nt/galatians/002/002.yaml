id: GAL.2.2
reference: Galatians 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: yo
  text: Ṣùgbọ́n mo gòkè lọ nítorí ìfihàn kan[a], mo sì fi ìhìnrere tí mo ń wàásù láàárín àwọn Kèfèrí síwájú wọn; ṣùgbọ́n ní àdáni ni mo fi í síwájú àwọn tí a kà sí ẹni pàtàkì[b], kí ó má bàa jẹ́ pé mo ń sáré, tàbí mo ti sáré, lásán[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ìfihàn kan.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí ó dà bí ẹni pé wọ́n ní ipa.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí ó má bàa jẹ́ pé lásán ni mo ń sáré tàbí mo ti sáré.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: mo gòkè lọ
  rationale: Ó pa ìtumọ̀ rírìn ‘gòkè lọ’ mọ́ láì fi ibi tí a ń lọ kún ẹsẹ yìí, nítorí ibi náà wà nínú àyíká ọ̀rọ̀ ṣùgbọ́n kò sí nínú ẹsẹ náà fúnra rẹ̀.
- source_word: κατὰ ἀποκάλυψιν
  choice: nítorí ìfihàn kan
  rationale: Ní àyíká yìí, gbólóhùn náà fi ìdí tàbí ohun tó mú kí Pọ́ọ̀lù lọ hàn. ‘Nítorí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ orísun mu.
- source_word: ἀνεθέμην
  choice: Mo ṣàlàyé ... fún wọn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí fífi ohun kan síwájú àwọn ẹlòmíràn fún ìgbéyẹ̀wò. ‘Ṣàlàyé ... fún wọn’ jẹ́ èdè Yorùbá àdánidá tí kò sọ pé Pọ́ọ̀lù fi ara rẹ̀ sí abẹ́ àṣẹ wọn fún ìfọwọ́sí.
- source_word: τὸ εὐαγγέλιον
  choice: ìhìnrere
  rationale: ‘Ìhìnrere’ ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó bójú mu fún ìròyìn rere Ọlọ́run nínú àyíká ọ̀rọ̀ Pọ́ọ̀lù.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: láàárín àwọn Kèfèrí
  rationale: Nínú àyíká yìí, ἔθνη ń tọ́ka sí àwọn tí kì í ṣe Júù, kì í ṣe àwọn orílẹ̀-èdè gẹ́gẹ́ bí ìpín ìṣèlú.
- source_word: κατ’ ἰδίαν
  choice: ní ìkọ̀kọ̀
  rationale: Ó fi hàn pé ìfihàn ọ̀rọ̀ yìí sí àwọn ẹni pàtàkì ṣẹlẹ̀ ní àdáni, yàtọ̀ sí gbangba.
- source_word: τοῖς δοκοῦσιν
  choice: àwọn tí a kà sí ẹni pàtàkì
  rationale: 'Ó pa àìdánilójú kékeré inú δοκοῦσιν mọ́: àwọn wọ̀nyí ni a gbà pé wọ́n ní ipò tàbí ọlá, láì sọ ní pàtó pé Pọ́ọ̀lù ń fìdí ipò wọn múlẹ̀ tàbí ń kẹ́gàn wọn.'
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: kí ó má bàá jẹ́ pé lásán ni mò ń sáré tàbí tí mo ti sáré
  rationale: Ó pa àwòrán sísáré àti ìyàtọ̀ láàárín iṣẹ́ tó ń lọ lọ́wọ́ àti èyí tó ti kọjá mọ́; ‘lásán’ ṣàfihàn iṣẹ́ tí kò ní èso.
theological_decisions:
- issue: Bóyá fífi ìhìnrere náà síwájú àwọn aṣáájú túmọ̀ sí pé Pọ́ọ̀lù ń fi í sí abẹ́ àṣẹ wọn fún àtúnṣe tàbí ìfọwọ́sí
  choice: A lo ‘ṣàlàyé ... fún wọn,’ èyí tó fi ìgbékalẹ̀ ọ̀rọ̀ náà hàn láì sọ pé Pọ́ọ̀lù jẹ́ ẹni tó rẹlẹ̀ nípa ẹ̀kọ́ tàbí pé ó nílò àṣẹ wọn.
  alternative: ‘Mo fi ìhìnrere náà sí abẹ́ ìdájọ́ wọn’ tàbí ‘mo kàn sọ fún wọn.’
  rationale: ἀνατίθημι fi ìgbékalẹ̀ ohun kan síwájú ẹlòmíràn hàn, ṣùgbọ́n kò fi tipátipá sọ ìfọwọ́sí lábẹ́ àṣẹ tàbí ìsọfúnni lasán. Ìtumọ̀ àárín gbùngbùn pa ìforígbárí inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. A yà gbólóhùn ní ọ̀nà tó ṣe kedere fún òǹkàwé lasan, a sì pa àwòrán Pọ́ọ̀lù ti ‘sísáré’ mọ́. Àwọn àmì ohùn àti àmì abẹ́ lẹ́tà ni a lò níbi tí ó bá yẹ.
