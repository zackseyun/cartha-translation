revisions:
- from: Ṣùgbọ́n mo gòkè lọ nítorí ìfihàn kan[a]. Mo sì ṣàlàyé ìhìnrere tí mò ń wàásù láàárín àwọn Kèfèrí fún wọn; ṣùgbọ́n mo ṣe èyí ní ìkọ̀kọ̀ fún àwọn tí a kà sí ẹni pàtàkì[b], kí ó má bàá jẹ́ pé lásán ni mò ń sáré tàbí tí mo ti sáré[c].
  to: Ṣùgbọ́n mo gòkè lọ nítorí ìfihàn kan[a], mo sì fi ìhìnrere tí mo ń wàásù láàárín àwọn Kèfèrí síwájú wọn; ṣùgbọ́n ní àdáni ni mo fi í síwájú àwọn tí a kà sí ẹni pàtàkì[b], kí ó má bàa jẹ́ pé mo ń sáré, tàbí mo ti sáré, lásán[c].
  rationale: A rọ́pò ‘ní ìkọ̀kọ̀’ pẹ̀lú ‘ní àdáni’ láti yẹra fún ìtumọ̀ aṣírí tí kò wà ní dandan nínú κατ’ ἰδίαν. A sì rọ́pò ‘ṣàlàyé’ pẹ̀lú ‘fi ... síwájú’ láti pa agbára ἀνεθέμην mọ́ ní ọ̀nà àárín-gbùngbùn. A tún ṣètò gbolohun ìkẹyìn kí ìyàtọ̀ ìṣe lọ́wọ́lọwọ́ àti ìṣe tí ó ti kọjá lè hàn kedere.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:30:41Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ọ̀pọ̀ nínú ìtumọ̀ Gíríìkì mọ́, pẹ̀lú ‘gòkè lọ,’ ìhìnrere láàárín àwọn Kèfèrí, àti ìyàtọ̀ láàárín sísáré lọ́wọ́lọwọ́ àti sísáré tí ó ti kọjá. Síbẹ̀, ‘ní ìkọ̀kọ̀’ lè túmọ̀ sí ṣíṣe ohun kan ní ìpamọ́ tàbí ní aṣírí, èyí tí ó lágbára ju κατ’ ἰδίαν (‘ní àdáni’) lọ. ‘Ṣàlàyé’ sì lè dín ἀνεθέμην kù sí ìtumọ̀ ṣíṣàlàyé, dípò fífi ọ̀rọ̀ náà síwájú wọn fún ìgbéyẹ̀wò.
  naturalness: Àwọn gbolohun náà lóye, ṣùgbọ́n ‘ní àdáni’ dára ju ‘ní ìkọ̀kọ̀’ lọ nínú àyíká ìpàdé tàbí ìjíròrò. Àtúnṣe sí ìṣètò gbolohun ìkẹyìn tún mú un rọrùn láti ka ní Yorùbá.
  terminology: ‘Ìhìnrere,’ ‘àwọn Kèfèrí,’ àti ‘àwọn tí a kà sí ẹni pàtàkì’ yẹ, wọ́n sì pa ìtumọ̀ aláìgbẹ́kẹ̀lé ti τοῖς δοκοῦσιν mọ́. ‘Mo fi ... síwájú wọn’ jẹ́ ọ̀rọ̀ àárín-gbùngbùn tó sún mọ́ ἀνεθέμην ju ‘mo ṣàlàyé ... fún wọn’ lọ, láì fi ìtumọ̀ ìtẹríba sí abẹ́ ìfọwọ́sí wọn kún un.
  issues:
  - severity: medium
    issue: ‘Ní ìkọ̀kọ̀’ fún κατ’ ἰδίαν
    rationale: ‘Ní ìkọ̀kọ̀’ sábà máa ń tọ́ka sí ohun tí a ṣe ní aṣírí. Ọ̀rọ̀ Gíríìkì náà ń fi ìjíròrò tàbí ìpàdé aládàáni hàn, kì í ṣe ìfipamọ́ ohun kan ní dandan.
  - severity: medium
    issue: ‘Mo ṣàlàyé ìhìnrere ... fún wọn’ fún ἀνεθέμην
    rationale: Ọ̀rọ̀ náà lè hàn bí ìtúmọ̀ tàbí ìṣàlàyé nìkan. ‘Mo fi ìhìnrere náà síwájú wọn’ pa èrò fífi síwájú fún ìgbọ́ tàbí ìgbéyẹ̀wò mọ́ dáadáa, láì túmọ̀ sí fífi sí abẹ́ àṣẹ.
  - severity: low
    issue: Ìṣètò gbolohun ‘lásán ni mò ń sáré tàbí tí mo ti sáré’
    rationale: Ìtumọ̀ rẹ̀ hàn, ṣùgbọ́n fífi kókó-ọrọ náà hàn ní ẹgbẹ́ méjèèjì—‘mo ń sáré, tàbí mo ti sáré’—jẹ́ kedere, ó sì pa àkókò àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì mọ́.
