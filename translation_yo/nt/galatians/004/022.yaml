id: GAL.4.22
reference: Galatians 4:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: yo
  text: Nítorí a ti kọ ọ́ pé Abrahamu ní ọmọkùnrin méjì, ọ̀kan láti ọ̀dọ̀ ẹrúbìnrin[a], àti ọ̀kan láti ọ̀dọ̀ obìnrin òmìnira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìránṣẹ́bìnrin.” Ọ̀rọ̀ Gíríìkì παιδίσκη lè túmọ̀ sí ìránṣẹ́bìnrin, ṣùgbọ́n “ẹrúbìnrin” mú ìyàtọ̀ ẹrú àti òmìnira nínú àríyànjiyàn Pọ́ọ̀lù hàn kedere.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ perfect passive tí ń tọ́ka sí ohun tí Ìwé Mímọ́ kọ, ó sì pa ìtumọ̀ pé ohun náà ṣì dúró gẹ́gẹ́ bí àṣẹ mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ àríyànjiyàn tí ó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣàgbékalẹ̀ àkóónú ohun tí a kọ ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: Ἀβραὰμ
  choice: Abrahamu
  rationale: Èyí ni ìkọ orúkọ Abraham tó wọ́pọ̀ nínú Yorùbá.
- source_word: δύο υἱοὺς
  choice: ọmọkùnrin méjì
  rationale: υἱούς túmọ̀ sí àwọn ọmọkùnrin ní pàtó, kì í ṣe ọmọ lásán.
- source_word: ἔσχεν
  choice: bí
  rationale: Nínú ọ̀rọ̀ ìran yìí, ‘bí ọmọkùnrin méjì’ jẹ́ Yorùbá àdánidá fún pé Abrahamu ní wọn gẹ́gẹ́ bí ọmọ; kò túmọ̀ sí pé òun fúnra rẹ̀ ló lóyún tàbí ló bímọ.
- source_word: ἕνα ... καὶ ἕνα
  choice: ọ̀kan ... àti ọ̀kan
  rationale: Ó pa ìwọ̀ntúnwọ̀nsì àti ìfarawé ìṣètò Gíríìkì mọ́.
- source_word: ἐκ
  choice: láti ọ̀dọ̀
  rationale: Nínú ọ̀rọ̀ ìbímọ, èyí fi ìyá tí ọmọ kọ̀ọ̀kan ti ọ̀dọ̀ rẹ̀ wá hàn ní Yorùbá àdánidá.
- source_word: παιδίσκης
  choice: ẹrúbìnrin
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ìránṣẹ́bìnrin tàbí ẹrúbìnrin; ‘ẹrúbìnrin’ mú ipò ìdè àti ìyàtọ̀ ẹrú/òmìnira tó ṣe pàtàkì sí àríyànjiyàn Paulu hàn kedere.
- source_word: ἐλευθέρας
  choice: obìnrin òmìnira
  rationale: Adjective náà dúró bí orúkọ fún obìnrin tí kì í ṣe ẹrú; yíyan yìí pa ìyàtọ̀ rẹ̀ sí ẹrúbìnrin mọ́.
theological_decisions:
- issue: Ìyàtọ̀ ipò ẹrú àti òmìnira tó jẹ́ ọkàn àpèjúwe Paulu
  choice: ẹrúbìnrin / obìnrin òmìnira
  alternative: ìránṣẹ́bìnrin / obìnrin òmìnira
  rationale: Àyíká ọ̀rọ̀ Paulu gbára lé ìyàtọ̀ ẹrú àti òmìnira. ‘Ẹrúbìnrin’ mú ìyàtọ̀ náà hàn láìfi ẹ̀kọ́ míì kún ọ̀rọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘a ti kọ ọ́ pé’ gẹ́gẹ́ bí àṣà ìtọ́kasí Ìwé Mímọ́, a sì lo ‘láti ọ̀dọ̀’ láti sọ ìbátan ìbímọ ní ti ara.
