  text: ἡ δὲ ἄνω Ἰερουσαλὴμ ἐλευθέρα ἐστίν, ἥτις ἐστὶν ⸀μήτηρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: yo
  text: Ṣùgbọ́n Jerúsálẹ́mù ti òkè jẹ́ òmìnira; òun ni ìyá wa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí tí ó jẹ́ ìyá wa.” A lè túmọ̀ arọ́pò-orúkọ Gíríìkì náà ní ọ̀nà tí ó sún mọ́ ìrísí ọ̀rọ̀ rẹ̀, ṣùgbọ́n ẹsẹ yìí sọ Jerúsálẹ́mù bí ẹni pé ó jẹ́ ìyá.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín Jerúsálẹ́mù ìsinsìnyí tí ẹsẹ tó ṣáájú mẹ́nu kàn àti Jerúsálẹ́mù ti òkè.
- source_word: ἄνω
  choice: ti òkè
  rationale: Ó pa àwòrán ibi gíga mọ́, kò sì túmọ̀ ọ́ ju bí ọ̀rọ̀ Gíríìkì ṣe sọ lọ nípa lílo ‘ti ọ̀run.’
- source_word: Ἰερουσαλήμ
  choice: Jerúsálẹ́mù
  rationale: Orúkọ ibì kan ni; a kọ ọ́ ní ìlànà ìkọ̀wé Yorùbá tí ó wọ́pọ̀.
- source_word: ἐλευθέρα
  choice: lómìnira
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹni tàbí ohun kan ní òmìnira, ó sì pa ìyàtọ̀ ẹrú àti olómìnira inú àyíká ọ̀rọ̀ náà mọ́ láìfi ‘obìnrin’ kún un.
- source_word: ἥτις
  choice: òun sì
  rationale: Ó mú ìsọ̀sọ̀ Jerúsálẹ́mù bí obìnrin kan hàn ní Yorùbá, ó sì so gbólóhùn náà pọ̀ lọ́nà tí ó rọrùn.
- source_word: μήτηρ
  choice: ìyá
  rationale: Ó pa àwòrán ìyá tí ó ṣe pàtàkì nínú àpèjúwe Paulu mọ́.
- source_word: ἡμῶν
  choice: wa
  rationale: Èyí ni ọ̀nà àdánidá láti fi ohun-ìní ẹni àkọ́kọ́ ọ̀pọ̀ hàn ní Yorùbá.
theological_decisions:
- issue: Ohun tí ‘Jerúsálẹ́mù ti òkè’ ń tọ́ka sí àti bí a ṣe sọ ọ́ di ẹni
  choice: A sọ Jerúsálẹ́mù bí obìnrin kan pé, ‘òun sì ni ìyá wa.’
  alternative: ‘èyí tí í ṣe ìyá wa’
  rationale: Àríyànjiyàn àpèjúwe Paulu ń fi Jerúsálẹ́mù hàn gẹ́gẹ́ bí ìyá tí ó bá Sárà àti obìnrin olómìnira mu. ‘Òun’ mú ìsọ̀sọ̀ yìí ṣe kedere láìfi ẹ̀kọ́ mìíràn kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Lómìnira’ jẹ́ àdánidá ju ‘jẹ́ òmìnira’ lọ, ‘ti òkè’ sì pa àwòrán orísun mọ́.
