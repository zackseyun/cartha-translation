language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: yo
  text: Ṣùgbọ́n nígbà náà[a], nígbà tí ẹ kò mọ Ọlọ́run, ẹ jẹ́ ẹrú fún àwọn tí kì í ṣe ọlọ́run ní ti ìwà wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ṣùgbọ́n tẹ́lẹ̀ rí, nígbà tí ẹ kò mọ Ọlọ́run, ẹ sìn àwọn tí kì í ṣe ọlọ́run ní ti ìwà wọn.”
    reason: Àwọn ọ̀nà mìíràn tí a lè gbà tú τότε μὲν àti ἐδουλεύσατε láì yí ìtumọ̀ pàtàkì wọn padà.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí àríyànjiyàn tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ ìsopọ̀ àdánidá ní Yorùbá.
- source_word: τότε μὲν
  choice: nígbà náà
  rationale: Ó tọ́ka sí àkókò ìṣáájú nínú ìgbésí ayé àwọn ará Gálátíà; μέν sì ń pèsè ìyàtọ̀ tí ẹsẹ tó tẹ̀ lé yóò parí.
- source_word: οὐκ εἰδότες θεὸν
  choice: nígbà tí ẹ kò mọ Ọlọ́run
  rationale: A tú participle náà gẹ́gẹ́ bí gbólóhùn àkókò; “mọ” pa ìtumọ̀ ìmọ̀ Ọlọ́run mọ́ láì dín un kù sí wíwá ẹni mọ̀ lásán.
- source_word: θεὸν
  choice: Ọlọ́run
  rationale: Ọ̀rọ̀ ẹyọ kan náà ń tọ́ka sí Ọlọ́run tòótọ́, ní ìyàtọ̀ sí “àwọn ọlọ́run” tó wà lẹ́yìn rẹ̀.
- source_word: ἐδουλεύσατε
  choice: ẹ wà ní oko ẹrú fún
  rationale: Ó pa ìtumọ̀ ìdè ẹrú inú δουλεύω mọ́, èyí tó ṣe pàtàkì nínú àríyànjiyàn Gálátíà nípa ẹrú àti òmìnira; ó lágbára ju “ẹ sìn” lọ.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: fún àwọn tí ... kì í ṣe ọlọ́run
  rationale: “Àwọn” kò pinnu bóyá àwọn ohun tàbí àwọn ẹ̀dá ni wọ́n, nítorí náà kò fi “òrìṣà” tàbí “ẹ̀mí èṣù” kún ohun tí Pọ́ọ̀lù sọ.
- source_word: φύσει μὴ
  choice: kì í ṣe ... nípa ìṣẹ̀dá wọn
  rationale: Ó sọ ohun tí wọ́n jẹ́ ní ti gidi, kì í ṣe orúkọ tí ènìyàn ń pè wọ́n lásán.
- source_word: θεοῖς
  choice: ọlọ́run
  rationale: Nínú ọ̀rọ̀ “kì í ṣe ọlọ́run,” Yorùbá lè lo ọ̀rọ̀ náà láì fi àmì ọ̀pọ̀ sí i; ìtumọ̀ ọ̀pọ̀ wà nínú “àwọn.”
theological_decisions:
- issue: Irú àwọn ohun tí wọ́n ń sìn tẹ́lẹ̀
  choice: A tú ọ̀rọ̀ Pọ́ọ̀lù gẹ́gẹ́ bí ìkọ̀ pé àwọn náà kì í ṣe ọlọ́run nípa ìṣẹ̀dá wọn.
  alternative: “àwọn ohun tí kì í ṣe ọlọ́run ní ti gidi” tàbí “àwọn ẹ̀dá tí a ń pè ní ọlọ́run ní èké”
  rationale: φύσει μὴ οὖσι θεοῖς sọ ohun tí àwọn náà jẹ́ ní ti gidi. A kò sọ pé ère tàbí àwọn agbára ẹ̀mí èṣù ni wọ́n, nítorí ẹsẹ yìí fúnra rẹ̀ kò yan ọ̀kan nínú wọn.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ẹ” fún ọ̀pọ̀ ènìyàn, a sì fi gbogbo àmì ohùn sí ibi tí ó yẹ. “Wà ní oko ẹrú fún” pa àwòrán ìdè mọ́, bó tilẹ̀ jẹ́ pé ó lágbára díẹ̀ ju “sìn” lọ.
