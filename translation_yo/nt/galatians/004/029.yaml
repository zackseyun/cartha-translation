id: GAL.4.29
reference: Galatians 4:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: yo
  text: Ṣùgbọ́n gẹ́gẹ́ bí ẹni tí a bí nípa ti ara[a] ṣe ń ṣe inúnibíni sí ẹni tí a bí nípa ti Ẹ̀mí[b] nígbà náà, bẹ́ẹ̀ náà ni ó rí nísinsìnyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí a bí nípasẹ̀ ọ̀nà ẹ̀dá ènìyàn”; ní tààràtà, “ẹni tí a bí nípa ti ara.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni tí ó wà nípa ti Ẹ̀mí.” A mú ọ̀rọ̀ “a bí” wá láti apá àkọ́kọ́ láti mú ìfiwéra náà ṣe kedere ní Yorùbá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí ohun tí a sọ ṣáájú hàn ní ọ̀nà tó ṣe déédéé, tó sì mọ́ ní Yorùbá.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: gẹ́gẹ́ bí ... nígbà náà, bẹ́ẹ̀ náà ... nísinsìnyí
  rationale: Ó pa ìfiwéra tó wà nínú èdè Gíríìkì mọ́, ó sì fi ìgbà àtijọ́ àti ìsinsìnyí dojú kọ ara wọn ní Yorùbá àdánidá.
- source_word: ὁ ... γεννηθεὶς
  choice: ẹni tí a bí
  rationale: Ó tú participle tí a lò gẹ́gẹ́ bí orúkọ sí Yorùbá tó ṣe kedere láìfi ìtumọ̀ míì kún un.
- source_word: κατὰ σάρκα
  choice: nípa ti ara
  rationale: Ó pa ọ̀rọ̀ Pọ́ọ̀lù àti ìyàtọ̀ rẹ̀ pẹ̀lú Ẹ̀mí mọ́, nígbà tí àyíká ẹsẹ̀ náà ń tọ́ka sí ìbí nípasẹ̀ ọ̀nà ẹ̀dá ènìyàn, kì í ṣe sí ẹ̀dá ẹlẹ́ṣẹ̀.
- source_word: ἐδίωκε
  choice: ṣe ń ṣe inúnibíni sí
  rationale: Ìṣe tó ń lọ tàbí tó máa ń ṣẹlẹ̀ nígbà náà ni imperfect náà fi hàn; ‘ṣe inúnibíni sí’ sọ ìtakò oníwà ipá náà ní kedere.
- source_word: τὸν κατὰ πνεῦμα
  choice: ẹni tí a bí nípa ti Ẹ̀mí
  rationale: A tún ‘a bí’ sọ láti mú ìfiwéra náà ṣe kedere ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà farapamọ́ ní apá kejì nínú Gíríìkì.
- source_word: πνεῦμα
  choice: Ẹ̀mí
  rationale: Àyíká Gálátíà àti ìyàtọ̀ pẹ̀lú ara tọ́ka sí Ẹ̀mí Mímọ́; lílo lẹ́tà ńlá fi ìdájọ́ yìí hàn.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó so àpẹẹrẹ ìgbà náà pọ̀ mọ́ ipò tó ń ṣẹlẹ̀ ní àkókò Pọ́ọ̀lù.
theological_decisions:
- issue: Ìtumọ̀ κατὰ σάρκα nínú ìyàtọ̀ Iṣmaẹli àti Isaaki
  choice: Ìbí nípasẹ̀ ọ̀nà ẹ̀dá ènìyàn lasán
  alternative: Ìbí nípasẹ̀ ẹ̀dá ẹlẹ́ṣẹ̀ tàbí ọ̀nà ayé
  rationale: Àyíká Gálátíà 4:23, 29 ń fi ìbí Iṣmaẹli nípa ọ̀nà ẹ̀dá ènìyàn wé ìbí Isaaki nípasẹ̀ ìlérí àti Ẹ̀mí; kò pọndandan kí ‘ara’ túmọ̀ sí ẹ̀dá ẹlẹ́ṣẹ̀ níbí.
- issue: Ẹni tí πνεῦμα ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí agbára tẹ̀mí kan
  rationale: Nínú àlàyé Hágárì àti Sárà àti ìsopọ̀ rẹ̀ pẹ̀lú ìlérí, Ẹ̀mí jẹ́ aṣojú Ọlọ́run tó bá ìbí ọmọ ìlérí àti ìdánimọ̀ àwọn onígbàgbọ́ mu.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣe kedere fún òǹkàwé òde òní ni a lò. A pa ìtòlẹ́sẹẹsẹ ìfiwéra Pọ́ọ̀lù mọ́, a sì lo àmì ohùn ní kíkún níbi tó yẹ.
