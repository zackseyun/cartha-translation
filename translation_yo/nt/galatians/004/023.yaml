id: GAL.4.23
reference: Galatians 4:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: yo
  text: Ṣùgbọ́n ọmọ ẹrú obìnrin ni a bí nípa ti ara[a], ṣùgbọ́n ọmọ obìnrin òmìnira ni a bí nípasẹ̀ ìlérí[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ní ọ̀nà ìbímọ ènìyàn lásán” tàbí “nípasẹ̀ agbára ènìyàn.” Ní Gíríìkì: “gẹ́gẹ́ bí ara.”'
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípa ìlérí.” Gbólóhùn náà tọ́ka sí ìbí tí ó ṣẹlẹ̀ nítorí ìlérí Ọlọ́run, kì í ṣe nípasẹ̀ ìbímọ ènìyàn lásán.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: ẹrú obìnrin
  rationale: Ó pa ipò Hágárì gẹ́gẹ́ bí ẹni tí kò lómìnira mọ́, èyí sì ṣe pàtàkì fún ìyàtọ̀ tí Pọ́ọ̀lù ń fi hàn.
- source_word: κατὰ σάρκα
  choice: nípa ti ara
  rationale: Ó pa ọ̀rọ̀ Pọ́ọ̀lù nípa ‘ara’ mọ́, ṣùgbọ́n nínú àyíká yìí ó tọ́ka sí ìbí ní ọ̀nà ìbímọ ènìyàn lásán, kì í ṣe pé ara jẹ́ ẹlẹ́ṣẹ̀.
- source_word: γεγέννηται
  choice: a bí
  rationale: Èyí ni ọ̀nà Yorùbá adayébá fún passive perfect tí ń sọ nípa bí ọmọ ṣe wá sí ayé.
- source_word: ἐλευθέρα
  choice: obìnrin òmìnira
  rationale: Ó mú ìyàtọ̀ láàárín ẹni tí ó jẹ́ ẹrú àti ẹni tí ó lómìnira hàn kedere.
- source_word: δι’ ἐπαγγελίας
  choice: nípasẹ̀ ìlérí
  rationale: 'Ó pa ìtumọ̀ ohun èlò tàbí ọ̀nà tí ìbí náà fi ṣẹlẹ̀ mọ́: ìlérí Ọlọ́run ni ó mú un ṣẹ.'
- source_word: ὁ μὲν ... ὁ δὲ
  choice: ọmọ tí ... nígbà tí ... ọmọ tí
  rationale: Fífikun ‘ọmọ’ ní ẹ̀ka méjèèjì mú ẹni tí a ń tọ́ka sí yé kedere, ó sì pa ìfiwéra Gíríìkì mọ́.
theological_decisions:
- issue: Ìtumọ̀ κατὰ σάρκα ní ìyàtọ̀ sí δι’ ἐπαγγελίας
  choice: Ìbí ní ọ̀nà ìbímọ ènìyàn lásán ni a fi wé ìbí tí ìlérí Ọlọ́run mú ṣẹ.
  alternative: A lè túmọ̀ ọ́ ní kíkún sí ‘ní ọ̀nà ìbímọ ènìyàn lásán’ àti ‘nítorí ìlérí Ọlọ́run.’
  rationale: Àríyànjiyàn Pọ́ọ̀lù jẹ́ ti májẹ̀mú àti àpẹẹrẹ; kò sọ pé ara tàbí ìbí ti ara jẹ́ ẹ̀ṣẹ̀. Ọ̀rọ̀ àkọ́kọ́ pa àìdájú àti èdè Pọ́ọ̀lù mọ́, àlàyé ìsàlẹ̀ sì ṣàlàyé ìtumọ̀ nínú àyíká.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo ‘ẹrú obìnrin’ dípò ọ̀rọ̀ tí ó lè rọ ipò ìgbèkùn Hágárì; ‘obìnrin òmìnira’ sì mú ìyàtọ̀ náà hàn. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ.
