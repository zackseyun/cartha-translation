  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: yo
  text: Ṣùgbọ́n ó wà lábẹ́ àwọn alágbàtọ́ àti àwọn olùṣàkóso dúkìá[a] títí di àkókò tí baba rẹ̀ yàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn alábòójútó ilé tàbí dúkìá’; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn tó ń ṣàkóso ilé tàbí dúkìá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘títí di àkókò tí baba ti pinnu tẹ́lẹ̀.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ipò ọmọ ajogún tí kò tíì dàgbà yìí ṣe ìyàtọ̀ sí ohun tí ẹsẹ tó ṣáájú sọ.
- source_word: ὑπὸ
  choice: lábẹ́
  rationale: Pẹ̀lú àwọn ọ̀rọ̀ orúkọ tó tẹ̀ lé e, ó túmọ̀ sí wíwà lábẹ́ àṣẹ tàbí àbójútó.
- source_word: ἐπιτρόπους
  choice: àwọn alágbàtọ́
  rationale: Ó ń tọ́ka sí àwọn tí a fi ọmọ tí kò tíì dàgbà sí ìtọ́jú wọn; ‘alágbàtọ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún irú àbójútó bẹ́ẹ̀.
- source_word: ἐστὶ
  choice: ó wà
  rationale: A mú ẹni tí a ń sọ̀rọ̀ nípa rẹ̀ láti ẹsẹ tó ṣáájú wá; ‘ó wà’ jẹ́ gbólóhùn àdánidá ní Yorùbá.
- source_word: καὶ
  choice: àti
  rationale: Ó so oríṣi àwọn olùṣàkóso méjì pọ̀ láìfi ìtẹnumọ́ àfikún kún un.
- source_word: οἰκονόμους
  choice: àwọn olùṣàkóso dúkìá
  rationale: Ní àyíká yìí, ó ń tọ́ka sí àwọn tó ń bójú tó ilé tàbí dúkìá; yíyan ọ̀rọ̀ yìí tún jẹ́ kí ó yàtọ̀ sí àwọn alágbàtọ́ ọmọ.
- source_word: ἄχρι
  choice: títí di
  rationale: Ó fi ààlà àkókò tí ètò náà yóò fi wà hàn ní ọ̀nà tó ṣe déédé ní Yorùbá.
- source_word: τῆς προθεσμίας
  choice: àkókò tí ... yàn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí àkókò tí a ti pinnu tàbí yàn tẹ́lẹ̀; ìtumọ̀ yìí ṣe kedere, ó sì bójú mu ní Yorùbá òde òní.
- source_word: τοῦ πατρός
  choice: baba rẹ̀
  rationale: Àyíká àkàwé ọmọ ajogún fi hàn pé baba ọmọ náà ni ó yan àkókò; ‘rẹ̀’ mú ìbáṣepọ̀ náà ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe lóye genitive inú τοῦ πατρός
  choice: 'A túmọ̀ ọ́ gẹ́gẹ́ bí baba ọmọ náà ṣe jẹ́ ẹni tó yan àkókò: ‘àkókò tí baba rẹ̀ yàn.’'
  alternative: ‘àkókò tí baba yàn’ tàbí, ní títẹ̀lé ìrísí Gíríìkì pẹ́kípẹ́kí, ‘àkókò baba.’
  rationale: Nínú àkàwé Pọ́ọ̀lù nípa ọmọ ajogún tí kò tíì dàgbà, ó ṣeé ṣe jù pé baba ni ẹni tó pinnu àkókò náà. Èyí jẹ́ ìpinnu gírámà àti àyíká ọ̀rọ̀, kì í ṣe àfikún ẹ̀kọ́ ìsìn.
translation_notes:
  register: Yorùbá àpapọ̀ tó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lásán. ‘Dúkìá’ ṣe àlàyé iṣẹ́ οἰκονόμος ní kedere ju ọ̀rọ̀ àjèjì tàbí ọ̀rọ̀ ìjọ kan lọ.
