id: GAL.4.18
reference: Galatians 4:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: yo
  text: Ṣùgbọ́n ó dára kí a máa fi ìtara wá yín fún ète rere nígbà gbogbo[a][b], kì í ṣe nígbà tí mo bá wà pẹ̀lú yín nìkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “nínú ohun rere.” Ó ṣeé ṣe kí ó túmọ̀ sí pẹ̀lú ète rere tàbí fún ìdí rere.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “kí ẹ máa ní ìtara” tàbí “kí ẹ máa fi ìtara hàn.” A lè lóye infinitive Gíríìkì ζηλοῦσθαι ní ọ̀nà tó yàtọ̀; ṣùgbọ́n ìtumọ̀ ìrísí aláìṣe bá ìyàtọ̀ sí àwọn tó ń fi ìtara wá àwọn ará Gálátíà ní ẹsẹ tó ṣáájú mu.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν δὲ
  choice: Ṣùgbọ́n ó dára
  rationale: “Ṣùgbọ́n” fi ìyípadà ọ̀rọ̀ sí ìtara tí kò ní ète rere ní ẹsẹ ṣáájú hàn; “ó dára” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ajẹtífù tí a lò láìsọ olùṣe pàtó.
- source_word: ζηλοῦσθαι
  choice: kí a máa fi ìtara wá yín
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ infinitive aláìṣe ní ìrísí rẹ̀. Yorùbá kì í sábà lo ìrísí aláìṣe ní tààrà; “a” aláìdárúkọ olùṣe àti “wá yín” pa ìtumọ̀ pé àwọn ẹlòmíràn ń fi ìtara lépa àwọn ará Gálátíà mọ́, ní ìbámu pẹ̀lú ẹsẹ 17.
- source_word: ἐν καλῷ
  choice: fún ète rere
  rationale: Gbólóhùn náà túmọ̀ ní tààrà sí “nínú ohun rere,” ṣùgbọ́n nínú àyíká yìí ó ń tọ́ka sí ìtara tí ète tàbí ìdí rẹ̀ dára.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó pa ìtumọ̀ àkókò mọ́, ó sì ṣe àtakò kedere pẹ̀lú “kìkì nígbà tí” tó tẹ̀ lé e.
- source_word: καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: kì í sì í ṣe kìkì nígbà tí mo bá wà pẹ̀lú yín
  rationale: Ìtumọ̀ Yorùbá àdánidá ni fún articular infinitive tí ἐν fi hàn pé ó ń tọ́ka sí àkókò; ó pa àtakò wíwà Paulu níbẹ̀ mọ́.
theological_decisions:
- issue: Ohùn àti olùṣe ζηλοῦσθαι
  choice: 'Ìtumọ̀ aláìṣe: kí àwọn ẹlòmíràn máa fi ìtara wá àwọn ará Gálátíà'
  alternative: Kí ẹ máa ní ìtara tàbí kí ẹ máa fi ìtara hàn
  rationale: Ìlò ζηλόω ní ẹsẹ 17 tọ́ka sí àwọn ènìyàn tí ń fi ìtara wá àwọn ará Gálátíà pẹ̀lú ète búburú. Ìtumọ̀ aláìṣe mú kí ẹsẹ 18 jẹ́ ẹlẹgbẹ́ rere rẹ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ míì tó ṣeé ṣe mọ́.
- issue: Ìtumọ̀ ἐν καλῷ
  choice: fún ète rere
  alternative: nínú ohun rere / ní ọ̀nà rere
  rationale: Èyí mú ìyàtọ̀ tó wà láàárín ète búburú ní ẹsẹ 17 àti ète rere níbí hàn, láìfi ẹ̀kọ́ ìsìn àfikún sí ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, àti àmì ohùn níbi tó bá yẹ. Gbólóhùn “kí a máa fi ìtara wá yín” lo “a” gẹ́gẹ́ bí olùṣe aláìdárúkọ, èyí tó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtumọ̀ aláìṣe láìsọ ẹni tó ń ṣe iṣẹ́ náà pàtó.
