id: GAL.4.17
reference: Galatians 4:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: yo
  text: Wọ́n ń fi ìtara lépa yín[a], ṣùgbọ́n kì í ṣe ní ọ̀nà rere. Kàkà bẹ́ẹ̀, wọ́n fẹ́ yà yín sọ́tọ̀[b], kí ẹ̀yin lè fi ìtara lépa wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Wọ́n ń fi ìtara lépa yín, ṣùgbọ́n kì í ṣe pẹ̀lú ète rere.” Ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ wíwá ojú rere ẹnì kan tàbí fífi gbogbo ọkàn lépa rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “yọ yín kúrò.” Ó ṣeé ṣe kí ìtumọ̀ rẹ̀ jẹ́ pé wọ́n fẹ́ yà yín kúrò lọ́dọ̀ Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀, kí ẹ lè máa wá ojú rere wọn dípò ojú rere Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν … ζηλοῦτε (ζηλόω)
  choice: ní ìtara sí … ní ìtara sí
  rationale: Ọ̀rọ̀ yìí pa ìṣọ̀kan ọ̀rọ̀ Gíríìkì méjèèjì mọ́, ó sì lè sọ ìfẹ́ líle, ìlépa, tàbí fífẹ́ kí ẹlòmíràn fi ọkàn sí ẹni kan, láìfi ìtumọ̀ ìfẹ́ àfẹ́sọ́nà kún un.
- source_word: οὐ καλῶς
  choice: kì í ṣe lọ́nà rere
  rationale: Ó fi ìdájọ́ Pọ́ọ̀lù hàn pé ìtara náà kò tọ́ ní ọ̀nà tàbí ní ète, láìpinnu ju ohun tí Gíríìkì sọ lọ.
- source_word: ἀλλὰ
  choice: Kàkà bẹ́ẹ̀
  rationale: Ó mú ìyàtọ̀ líle tí ἀλλὰ ń fi hàn jáde, ó sì ṣàlàyé ète búburú tí ó wà lẹ́yìn ìtara wọn.
- source_word: ἐκκλεῖσαι ὑμᾶς
  choice: sé yín mọ́ta
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pípa ẹnì kan mọ́ síta tàbí yíyọ ọ́ kúrò nínú àjọṣe, láìsọ ní pàtó ohun tí wọ́n fẹ́ sé wọn mọ́ta kúrò nínú rẹ̀.
- source_word: θέλουσιν
  choice: wọ́n fẹ́
  rationale: Ó jẹ́ ìtumọ̀ Yorùbá àdánidá fún ọ̀rọ̀ ìfẹ́ tàbí ìpinnu.
- source_word: ἵνα
  choice: kí … lè
  rationale: Ó fi ète ìṣe wọn hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí àwọn olùkọ́ tí ń da wọn láàmú fẹ́ sé àwọn ará Gálátíà mọ́ta kúrò nínú rẹ̀
  choice: A kò sọ ohun náà ní pàtó nínú àyọkà pàtàkì.
  alternative: Kí a sọ pé wọ́n fẹ́ yà wọ́n kúrò lọ́dọ̀ Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀.
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ó ṣeé ṣe kí Pọ́ọ̀lù ń sọ nípa jíjẹ́ kí àjọṣe rẹ̀ pẹ̀lú wọn tú ká, ṣùgbọ́n ἐκκλεῖσαι kò dárúkọ ohun tí a yọ wọ́n kúrò nínú rẹ̀. Nítorí náà, àyọkà pàtàkì pa àìdánilójú yẹn mọ́, àlàyé sì wà ní àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A pa ìbáramu ζηλοῦσιν/ζηλοῦτε àti àìdánilójú ἐκκλεῖσαι mọ́.
