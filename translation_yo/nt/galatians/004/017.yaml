  to: Wọ́n ń fi ìtara lépa yín[a], ṣùgbọ́n kì í ṣe ní ọ̀nà rere. Kàkà bẹ́ẹ̀, wọ́n fẹ́ yà yín sọ́tọ̀[b], kí ẹ̀yin lè fi ìtara lépa wọn.
