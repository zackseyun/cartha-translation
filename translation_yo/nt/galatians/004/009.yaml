review_pass:
  verdict: revise
  source_fidelity: Àtúnṣe kékeré ni a nílò. Ìtumọ̀ àkọ́kọ́ mú ìyàlẹ́nu Pọ́ọ̀lù, àtúnṣe ‘a ti mọ̀ yín láti ọwọ́ Ọlọ́run,’ àti àwòrán ìsìnrú jáde dáadáa. Ṣùgbọ́n ‘láti ìbẹ̀rẹ̀’ lè dà bí ẹni pé ó ń ṣàlàyé ìgbà tí ìsìnrú bẹ̀rẹ̀, kì í sì mú πάλιν ἄνωθεν (‘tún... láti ìbẹ̀rẹ̀/a-tún-bẹ̀rẹ̀’) hàn ní kedere. A tún mú ἐπιστρέφετε, tó jẹ́ ìṣe tó ń lọ lọ́wọ́, hàn kedere.
  naturalness: ‘Báwo ni ẹ ṣe ń tún yí padà’ jẹ́ Yorùbá boṣewa tí ó dára fún ìbéèrè ìbáwí. ‘Tún bẹ̀rẹ̀ sí í di ẹrú fún wọn’ ń sọ ìtumọ̀ ‘again anew’ ní ti ara ju ‘di ẹrú wọn láti ìbẹ̀rẹ̀’ lọ.
  terminology: A pa ‘àwọn ohun ìpilẹ̀’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ gbooro fún στοιχεῖα, láìdájọ́ pé àwọn agbára ẹ̀mí ni tàbí ìlànà ẹ̀kọ́ nìkan. Àkọsílẹ̀ ìsàlẹ̀ ń fi àwọn yíyàn míì hàn. ‘Di ẹrú’ pa agbára δουλεύειν mọ́.
  issues:
