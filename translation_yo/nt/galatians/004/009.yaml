    rationale: Ó lè túmọ̀ sí pé wọ́n di ẹrú láti ìbẹ̀rẹ̀, dípò pé wọ́n fẹ́ padà sí ìsìnrú náà ní ọ̀nà tuntun láti ìbẹ̀rẹ̀.
  - severity: low
