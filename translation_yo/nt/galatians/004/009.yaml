id: GAL.4.9
reference: Galatians 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: yo
  text: Ṣùgbọ́n nísinsìnyí, lẹ́yìn tí ẹ ti wá mọ Ọlọ́run—tàbí, kí a tilẹ̀ sọ pé, lẹ́yìn tí Ọlọ́run ti mọ̀ yín—báwo ni ẹ ṣe ń tún yí padà sí àwọn ohun ìpilẹ̀ aláìlágbára àti aláìní[a], tí ẹ sì fẹ́ tún bẹ̀rẹ̀ sí í di ẹrú fún wọn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹ̀mí ìpilẹ̀ṣẹ̀,” “àwọn ìlànà ìpilẹ̀,” tàbí “àwọn ohun àkọ́bẹ̀rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες θεόν
  choice: lẹ́yìn tí ẹ ti mọ Ọlọ́run
  rationale: Ó fi ìṣe tí ó ṣáájú ìbéèrè pàtàkì hàn ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘wá mọ Ọlọ́run’ mọ́ láìfi àlàyé kún un.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: tàbí, kí a tilẹ̀ sọ pé, lẹ́yìn tí Ọlọ́run ti mọ̀ yín
  rationale: Ìtumọ̀ yìí mú agbára àtúnṣe μᾶλλον δέ jáde, ó sì pa Ọlọ́run mọ́ gẹ́gẹ́ bí ẹni tó ṣe ìṣe náà.
- source_word: πῶς ἐπιστρέφετε πάλιν
  choice: báwo ni ẹ ṣe tún lè yí padà
  rationale: ‘Báwo ni ... lè’ sọ ìyàlẹ́nu àti ìbáwí inú ìbéèrè náà; ‘tún ... yí padà’ pa ìtẹnumọ́ ìpadàbọ̀ mọ́.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: àwọn ohun ìpilẹ̀ṣẹ̀ aláìlágbára àti aláìní
  rationale: ‘Àwọn ohun ìpilẹ̀ṣẹ̀’ jẹ́ ọ̀rọ̀ tí kò fi tipátipá pinnu bóyá στοιχεῖα túmọ̀ sí àwọn agbára ẹ̀mí, àwọn ìlànà ìpilẹ̀, tàbí àwọn ohun àkọ́bẹ̀rẹ̀; ‘aláìlágbára’ àti ‘aláìní’ túmọ̀ àwọn àpèjúwe méjèèjì ní èdè òde òní.
- source_word: πάλιν ἄνωθεν δουλεύειν θέλετε
  choice: ẹ fẹ́ tún di ẹrú wọn láti ìbẹ̀rẹ̀
  rationale: Ó pa ìfẹ́-inú θέλετε, àwòrán ìsìnrú δουλεύειν, àti ìtẹnumọ́ πάλιν ἄνωθεν mọ́.
theological_decisions:
- issue: Ìtumọ̀ στοιχεῖα nínú Gálátíà 4:9
  choice: àwọn ohun ìpilẹ̀ṣẹ̀
  alternative: àwọn ẹ̀mí ìpilẹ̀ṣẹ̀; àwọn ìlànà ìpilẹ̀; àwọn ohun àkọ́bẹ̀rẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tí a ń jiyàn lé lórí. Àyípadà pàtàkì náà mọ̀ọ́mọ̀ ṣí sí àwọn ìtumọ̀ tó ṣeé ṣe, àkọsílẹ̀ ìsàlẹ̀ sì ṣàfihàn wọn.
- issue: Agbára gbólóhùn ‘Ọlọ́run ti mọ̀ yín’
  choice: Ọlọ́run ni olùṣe ìṣe náà, gbólóhùn náà sì ń ṣe àtúnṣe sí ‘ẹ ti mọ Ọlọ́run’
  alternative: Ìtẹnumọ́ ìbáṣepọ̀ nìkan láìtọ́ka sí ìṣáájú ìṣe Ọlọ́run
  rationale: μᾶλλον δέ ní agbára àtúnṣe gidi. A pa ìṣáájú Ọlọ́run mọ́ nínú gírámà láìfi ètò ẹ̀kọ́ ìsìn míì kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye. A lo arọ́pò-orúkọ ọ̀pọ̀ ‘ẹ’ nítorí àwọn ará Gálátíà ni Pọ́ọ̀lù ń bá sọ̀rọ̀. Gbólóhùn náà pa ìyàlẹ́nu àti ìbáwí Pọ́ọ̀lù mọ́, ó sì yẹra fún yíyan ìtumọ̀ kan ṣoṣo fún στοιχεῖα.
