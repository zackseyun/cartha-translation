  to: Ṣùgbọ́n nísinsìnyí, lẹ́yìn tí ẹ ti wá mọ Ọlọ́run—tàbí, kí a tilẹ̀ sọ pé, lẹ́yìn tí Ọlọ́run ti mọ̀ yín—báwo ni ẹ ṣe ń tún yí padà sí àwọn ohun ìpilẹ̀ aláìlágbára àti aláìní[a], tí ẹ sì fẹ́ tún bẹ̀rẹ̀ sí í di ẹrú fún wọn?
  rationale: 'A rọ́pò ‘mọ’ pẹ̀lú ‘wá mọ’ láti fi ìwọlé sínú ìmọ̀ náà hàn. A tún ṣàtúnṣe apá ìkẹyìn sí ‘tún bẹ̀rẹ̀ sí í di ẹrú fún wọn’ kí ó lè pa πάλιν ἄνωθεν δουλεύειν θέλετε mọ́: ìfẹ́ láti padà sí ìsìnrú, ní àtúnbẹ̀rẹ̀. Àkọsílẹ̀ ìsàlẹ̀ ṣi ìtumọ̀ στοιχεῖα sílẹ̀ gẹ́gẹ́ bí orísun ṣe béèrè.'
