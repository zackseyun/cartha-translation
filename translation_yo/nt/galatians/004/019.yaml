base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: yo
  text: Ẹ̀yin ọmọ mi, nítorí yín ni mo tún ń jẹ ìrora ìbímọ́[c] títí tí Mèsáyà[a] yóò fi ní ìrísí nínú yín.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “Mèsáyà” sí “Kristi.” Χριστός ni oyè náà; “Kristi” sì jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Bíbélì mọ̀ dáadáa.
    reason: lexical_alternative
  - marker: b
    text: “Nínú yín” tún lè túmọ̀ sí “láàárín yín,” èyí tí ó lè tẹnu mọ́ gbogbo wọn gẹ́gẹ́ bí àwùjọ.
    reason: lexical_alternative
  - marker: c
    text: Ní ti gidi, “mo tún ń rọbí” tàbí “mo tún wà nínú ìrora ìbímọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: Ẹ̀yin ọmọ mi
  rationale: Ọ̀rọ̀ ìfẹ́ ni Pọ́ọ̀lù fi ń pe ọ̀pọ̀ ènìyàn; “ọmọ mi” jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ láti sọ ọ́ ní Yorùbá láìfi ìtumọ̀ “ọmọ kékeré” kún un.
- source_word: οὓς
  choice: nítorí yín
  rationale: Èyí so àwọn ará Gálátíà pọ̀ mọ́ àkàwé ìrọbí lọ́nà tí ó bójú mu ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ arọ́pò-orúkọ afẹniṣe ní ìrísí rẹ̀.
- source_word: πάλιν
  choice: tún
  rationale: Ó fi hàn pé ìrora náà ń ṣẹlẹ̀ lẹ́ẹ̀kan sí i.
- source_word: ὠδίνω
  choice: ń jẹ ìrora ìrọbí
  rationale: Ó pa àwòrán ìyá tí ó wà nínú ìrora ìbímọ́ mọ́, ó sì ṣe kedere ní Yorùbá òde òní.
- source_word: μέχρις οὗ
  choice: títí tí … yóò fi
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ àkókò tàbí àfojúsùn tí yóò parí nígbà tí ohun kan bá ṣẹlẹ̀.
- source_word: μορφωθῇ
  choice: yóò fi ní ìrísí
  rationale: Ó mú èrò pé Mèsáyà ń gba ìrísí tàbí ń di ohun tí a lè rí nínú wọn wá, láìsọ àkàwé náà di ẹ̀kọ́ ìgbàgbọ́ kan pàtó. Bí ó tilẹ̀ jẹ́ pé Gíríìkì jẹ́ ọ̀rọ̀ àṣe aláìṣe, ìtumọ̀ yìí jẹ́ àdánidá ju gbolohun Yorùbá tí yóò dà bí ẹni pé ẹnì kan ń dá Mèsáyà sílẹ̀ lọ.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni tí Ọlọ́run yàn, èyí tí “Mèsáyà” ń sọ ní kedere; “Kristi” jẹ́ àṣàyàn tí ó ti mọ́ àwọn òǹkàwé Bíbélì lára.
- source_word: ἐν ὑμῖν
  choice: nínú yín
  rationale: Ó pa ìtumọ̀ inú ẹni mọ́, ṣùgbọ́n nítorí “yín” jẹ́ ọ̀pọ̀, ó ṣì lè ní ìtumọ̀ ti gbogbo ìjọ papọ̀.
theological_decisions:
- issue: Ìtumọ̀ Mèsáyà tí ń ní ìrísí nínú àwọn onígbàgbọ́
  choice: A pa àkàwé pé Mèsáyà ń ní ìrísí nínú wọn mọ́ láìṣàlàyé rẹ̀ gẹ́gẹ́ bí ètò ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí ìwà àti ìgbésí ayé Mèsáyà tí ń hàn nínú olúkúlùkù, tàbí gẹ́gẹ́ bí ohun tí ń ṣẹlẹ̀ láàárín wọn gẹ́gẹ́ bí àwùjọ.
  rationale: Gíríìkì gba ìtumọ̀ inú olúkúlùkù àti ti àwùjọ láyè; ìtumọ̀ náà kò yẹ kí ó yanjú ohun tí Pọ́ọ̀lù fi sílẹ̀ gẹ́gẹ́ bí àkàwé.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbolohun náà pa ìfẹ́ Pọ́ọ̀lù àti àwòrán ìrora ìbímọ́ rẹ̀ mọ́, kò sì fi èdè ẹ̀kọ́ ìjọ kan pàtó kún un.
