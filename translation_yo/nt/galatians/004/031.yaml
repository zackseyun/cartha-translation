  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀διό, ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin ará[a], àwa kì í ṣe ọmọ obìnrin ẹrú[b], bí kò ṣe ọmọ obìnrin òmìnira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ náà jẹ́ “arákùnrin,” ṣùgbọ́n ó lè dúró fún àwùjọ tí ọkùnrin àti obìnrin wà nínú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ọmọbìnrin ẹrú” tàbí “ọmọbìnrin ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí obìnrin ẹrú; níbí, ó ń fi Hágárì wé Sárà nínú àkàwé Pọ́ọ̀lù (Gálátíà 4:21–31).
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ ìparí ọ̀rọ̀ tí Pọ́ọ̀lù ń fà jáde láti inú àpèjúwe tó ṣáájú.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: Ọ̀rọ̀ Yorùbá “ará” jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ láti bá àwọn onígbàgbọ́ ẹlẹgbẹ́ sọ̀rọ̀, ó sì lè tọ́ka sí àwùjọ ọkùnrin àti obìnrin láìpa ìtumọ̀ ìbátan mọ́ra rẹ́.
- source_word: οὐκ ἐσμὲν
  choice: àwa kì í ṣe
  rationale: Ó pa ìkọ̀sẹ̀ àsìkò ìsinsìnyí mọ́ láìfi èrò “a kò ṣe mọ́” kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: παιδίσκης
  choice: obìnrin ẹrú
  rationale: Ipò ẹrú ni ohun pàtàkì nínú ìyàtọ̀ tí Pọ́ọ̀lù ń ṣe; “obìnrin ẹrú” mú un ṣe kedere ju “ọmọbìnrin ìránṣẹ́” lọ.
- source_word: τέκνα
  choice: ọmọ
  rationale: “Ọmọ” lè kan ọmọ ọkùnrin àti ọmọ obìnrin, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún τέκνα.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Ó sọ ìtakora láàárín irú ọmọ méjèèjì ní kedere àti ní Yorùbá àdánidá.
- source_word: τῆς ἐλευθέρας
  choice: obìnrin òmìnira
  rationale: Àpólà ajẹtífù abo náà ń tọ́ka sí Sárà; yíyàn yìí pa abo ẹni tí a ń tọ́ka sí àti ìtakora ẹrú–òmìnira mọ́.
theological_decisions:
- issue: Bí a ṣe máa sọ ìtakora Hágárì àti Sárà nínú àkàwé Pọ́ọ̀lù ní kedere
  choice: obìnrin ẹrú … obìnrin òmìnira
  alternative: ọmọbìnrin ìránṣẹ́ … obìnrin òmìnira
  rationale: Ọ̀rọ̀ Pọ́ọ̀lù ní Gálátíà 4:21–31 gbé ìtakora ẹrú àti òmìnira kalẹ̀. Ìtumọ̀ yìí pa agbára ìtakora náà mọ́ láìfi ẹ̀kọ́ mìíràn kún un.
- issue: Bí a ṣe máa túmọ̀ ἀδελφοί fún àwùjọ tí ọkùnrin àti obìnrin wà nínú rẹ̀
  choice: ẹ̀yin ará, pẹ̀lú àlàyé ìsàlẹ̀ ojú ìwé
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: “Ẹ̀yin ará” jẹ́ ọ̀rọ̀ Yorùbá tó ní iyì, tó sì lè gba gbogbo àwùjọ mọ́ra; àlàyé náà pa irisi ọ̀rọ̀ Gíríìkì mọ́ fún ẹni tó fẹ́ mọ̀ ọ́n.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó ṣe kedere, tó ní iyì, tí ó sì yẹ fún kíkà ní gbangba. Àtúnsọ “ọmọ” lẹ́yìn “bí kò ṣe” mú gbólóhùn náà yé kedere ní Yorùbá, bí ó tilẹ̀ jẹ́ pé Gíríìkì fi ọ̀rọ̀ náà sílẹ̀ ní apá kejì.
