  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: yo
  text: Mo ń bẹ̀rù fún yín[a], kí ó má bàa jẹ́ pé lásán ni mo ti ṣe làálàá fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo ń bẹ̀rù nípa yín, kí ó má bàa jẹ́ pé lásán ni mo ti ṣe làálàá fún yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι
  choice: Mo ń bẹ̀rù
  rationale: Ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí yìí fi ìbẹ̀rù Pọ́ọ̀lù tí ó ń bá a lọ hàn; ‘Mo ń bẹ̀rù’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ὑμᾶς
  choice: fún yín
  rationale: Pẹ̀lú φοβοῦμαι, ọ̀rọ̀ yìí tọ́ka sí àwọn tí Pọ́ọ̀lù ń ṣàníyàn nípa ire wọn, kì í ṣe pé ó bẹ̀rù wọn gẹ́gẹ́ bí ewu.
- source_word: μή πως
  choice: kí ó má bàá jẹ́ pé
  rationale: Gbólóhùn yìí mú ìṣiyèméjì àti ìbẹ̀rù pé ohun kan lè rí bẹ́ẹ̀ jáde lọ́nà Yorùbá tó ṣe déédé.
- source_word: εἰκῇ
  choice: lásán
  rationale: ‘Lásán’ túmọ̀ sí pé iṣẹ́ náà lè má mú èso tàbí àbájáde tí a fẹ́ wá.
- source_word: κεκοπίακα
  choice: mo ti ṣe làálàá
  rationale: Perfect active indicative náà tọ́ka sí iṣẹ́ líle tí Pọ́ọ̀lù ti ṣe, tí ipa rẹ̀ sì kan ipò ìsinsìnyí; ‘ṣe làálàá’ pa ìtumọ̀ ìsapá líle mọ́.
- source_word: εἰς ὑμᾶς
  choice: lórí yín
  rationale: εἰς tọ́ka sí àwọn ará Gálátíà gẹ́gẹ́ bí ibi tí ìsapá Pọ́ọ̀lù darí sí; ‘lórí yín’ fi ìsapá tí ó ná sí wọn hàn.
theological_decisions:
- issue: Irú ìbẹ̀rù Pọ́ọ̀lù
  choice: Ìbẹ̀rù olùṣọ́-àgùntàn ni pé iṣẹ́ líle tí ó ṣe láàárín wọn lè má so èso.
  alternative: A lè ka a sí àníyàn ara ẹni lásán, láì tẹnumọ́ pé iṣẹ́ ìhìnrere rẹ̀ lè já sí asán.
  rationale: Àpapọ̀ φοβοῦμαι, μή πως, àti εἰκῇ κεκοπίακα fi ìbẹ̀rù àbájáde iṣẹ́ rẹ̀ hàn, kì í ṣe àníyàn gbogbogbòò lásán.
translation_notes:
  register: Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì yé àwọn òǹkàwé lásán. Àmì ohùn ni a lò ní kíkún níbi tí ó bá jẹ́ àdánidá; a sì pa ìṣiyèméjì inú μή πως mọ́.
