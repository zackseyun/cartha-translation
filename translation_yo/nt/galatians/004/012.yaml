  source_fidelity: Àpá κἀγὼ ὡς ὑμεῖς kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì. Ìtumọ̀ akọ́kọ́ tí ó fi “ti dà” sí i yan ìtumọ̀ àyíká kan gẹ́gẹ́ bí ìtumọ̀ pàtó. “jẹ́ bí ẹ̀yin” ń fi ìtumọ̀ ‘am’ tí ó wà nínú ìtumọ̀ àfọwọ́yẹ Gẹ̀ẹ́sì hàn, ó sì jẹ́ ìpèsè Yorùbá tí ó kéré jù; ìtumọ̀ ‘became’ ni a pa mọ́ sínú àlàyé ìsàlẹ̀. Àpá ìkẹyìn yẹ kí ó sọ ‘rárá’ láti mú οὐδέν hàn kedere.
  naturalness: “Ẹ̀yin ará” jẹ́ ìpè Yorùbá àdánidá fún ẹgbẹ́ àwọn onígbàgbọ́. “Ẹ kò ṣe mí ní ibi rárá” dára síi ju “ní ibi kan” lọ fún ìtumọ̀ ‘you did me no wrong/not at all.’ Àmì ìdákẹ́jẹ àti àmì ìfẹnukò ni a ṣètò kí ìpè náà àti ẹ̀bẹ̀ Pọ́ọ̀lù hàn kedere.
