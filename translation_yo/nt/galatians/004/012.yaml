  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: yo
  text: 'Ẹ dà bí èmi[a], nítorí èmi pẹ̀lú jẹ́ bí ẹ̀yin[b], ẹ̀yin ará; mo bẹ̀ yín: ẹ kò ṣe mí ní ibi rárá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ dà bí mo ṣe jẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì kò tún ọ̀rọ̀-ìṣe sọ níhìn-ín. Ó tún lè túmọ̀ sí, “nítorí èmi pẹ̀lú ti dà bí ẹ̀yin.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γίνεσθε
  choice: Ẹ dà
  rationale: Àṣẹ fún ọ̀pọ̀ ènìyàn ni, ó sì ń pè wọ́n láti wọ ipò tàbí ìwà kan; “ẹ dà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyípadà yìí.
- source_word: ὡς ἐγώ
  choice: bí èmi
  rationale: Ó pa àfiwé Gíríìkì mọ́ láì fi ohun tí Pọ́ọ̀lù túmọ̀ sí kún un.
- source_word: ὅτι
  choice: nítorí
  rationale: Níbí, ọ̀rọ̀ náà fi ìdí tí Pọ́ọ̀lù fi ń rọ̀ wọ́n hàn.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: èmi pẹ̀lú ti dà bí ẹ̀yin
  rationale: Gbólóhùn Gíríìkì kò tún ọ̀rọ̀-ìṣe sọ. Fífi “ti dà” kún un mú ìtumọ̀ àyíká—pé Pọ́ọ̀lù ti fi ara rẹ̀ wé àwọn ará Gálátíà—yé kedere, ṣùgbọ́n a ṣàkọsílẹ̀ àǹfààní “mo sì wà bí ẹ̀yin” nínú àlàyé ìsàlẹ̀.
- source_word: ἀδελφοί
  choice: ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ ìpè Yorùbá tí ó bójú mu fún àwọn ọmọ ìjọ lápapọ̀, tí kò sì nílò fífi akọ tàbí abo tí Gíríìkì kò pinnu ní àyíká yìí lé e lórí.
- source_word: δέομαι ὑμῶν
  choice: Mo bẹ̀ yín
  rationale: Ó fi agbára ẹ̀bẹ̀ onítara náà hàn ní Yorùbá àdánidá.
- source_word: οὐδέν με ἠδικήσατε
  choice: ẹ kò ṣe mí ní ibi kan
  rationale: Ó fi ìkọ̀ àti ìtumọ̀ pé wọn kò hùwà àìtọ́ sí Pọ́ọ̀lù rárá hàn ní ọ̀nà Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἀδελφοί tí ó ń bá gbogbo ìjọ sọ̀rọ̀
  choice: ará
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìrísí, ṣùgbọ́n ó ṣeé ṣe kí ó ń bá gbogbo àwọn onígbàgbọ́, ọkùnrin àti obìnrin, sọ̀rọ̀. “Ará” ni Yorùbá ń lò lọ́nà àdánidá fún irú ìpè àpapọ̀ bẹ́ẹ̀, láì fi ẹ̀kọ́ ìsìn kan kún un.
- issue: Ọ̀rọ̀-ìṣe tí a kò sọ ní κἀγὼ ὡς ὑμεῖς
  choice: èmi pẹ̀lú ti dà bí ẹ̀yin
  alternative: èmi pẹ̀lú sì wà bí ẹ̀yin
  rationale: Àyíká lè tọ́ka sí bí Pọ́ọ̀lù ṣe ti dà bí àwọn Kèfèrí, ṣùgbọ́n Gíríìkì fúnra rẹ̀ kò ní ọ̀rọ̀-ìṣe ní apá kejì. Àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé yé fún òǹkàwé òde òní. A lo “ẹ/yín” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí Gíríìkì ṣe rí; àmì ohùn ni a fi sí ibi tí ó jẹ́ ti ìlànà Yorùbá.
