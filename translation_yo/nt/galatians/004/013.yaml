  to: Ṣùgbọ́n ẹ̀yin mọ̀ pé nítorí àìsàn ara ni mo kọ́kọ́ kéde ìhìn rere fún yín.[a]
  rationale: Àtúnṣe náà ṣàtúnṣe ìlò ọ̀rọ̀ Yorùbá sí “fún yín,” ó mú ìkọ́lé ìdí náà rọrùn láì yí ìtumọ̀ padà, ó sì ṣe àtúnṣe àlàyé ìsàlẹ̀ kí ó pa àìdájú tó wà láàárín “àìlera” àti “àìsàn” mọ́ láì lo ọ̀rọ̀ tí kò jẹ́ àdánidá.
