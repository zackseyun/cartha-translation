    issue: Ìlò “fún un yín”
    rationale: Ní Yorùbá boṣewa, “fún yín” ni a máa lò fún ẹni púpọ̀ nínú gbolóhùn yìí. “Fún un yín” kì í jẹ́ ìkọ́lé àdánidá.
  - severity: low
    issue: “fi” nínú “nítorí ... ni mo fi kọ́kọ́ kéde”
    rationale: Bí ó tilẹ̀ jẹ́ pé a lè gbọ́ ìkọ́lé náà ní ọ̀rọ̀ kan, “Nítorí ... ni mo kọ́kọ́ kéde” jẹ́ kedere, ó sì sún mọ́ ìbáṣiṣẹ́ ìdí nínú ọ̀rọ̀ Gíríìkì.
  - severity: medium
    issue: “ẹran ara” nínú àlàyé ìsàlẹ̀
    rationale: Ọ̀rọ̀ náà kì í ṣe ìtumọ̀ àdánidá nínú Yorùbá fún gbolóhùn yìí, ó sì lè dá ìtumọ̀ rú. “Ara” tàbí “ti ara” ń sọ ìtumọ̀ ti ara gangan náà ní kedere.
