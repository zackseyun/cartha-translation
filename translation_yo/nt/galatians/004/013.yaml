base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin mọ̀ pé nítorí àìsàn ara ni mo kọ́kọ́ kéde ìhìn rere fún yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí àìlera ara.” Ní tààrà, gbolóhùn Gíríìkì náà ní, “nítorí àìlera tàbí àìsàn ti ara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: ẹ̀yin mọ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ àsìkò ìsinsìnyí, ó sì ń tọ́ka sí ohun tí àwọn ará Gálátíà ti mọ̀ tẹ́lẹ̀.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà díẹ̀ tàbí ìtakora pẹ̀lẹ́ hàn láti inú ọ̀rọ̀ tó ṣáájú.
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: nítorí àìsàn ara
  rationale: διά pẹ̀lú accusative ń sọ ìdí; ἀσθένεια lè túmọ̀ sí àìlera tàbí àìsàn, τῆς σαρκὸς sì fi hàn pé ipò ti ara ni a ń sọ, kì í ṣe ẹ̀dá ẹlẹ́ṣẹ̀.
- source_word: εὐηγγελισάμην
  choice: mo ... kéde ìhìn rere
  rationale: Ó sọ nípa pípolongo ìhìn rere, ní èdè Yorùbá tó ṣe kedere tí kò gbára lé ọ̀rọ̀ ìjọ kan ṣoṣo.
- source_word: ὑμῖν
  choice: fún un yín
  rationale: Dative náà tọ́ka sí àwọn tí Pọ́ọ̀lù kéde ìhìn rere fún.
- source_word: τὸ πρότερον
  choice: kọ́kọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó tọ́ka sí ìgbà àkọ́kọ́ tí Pọ́ọ̀lù wà láàárín wọn, kì í ṣe ‘tẹ́lẹ̀ rí’ lásán.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ἀσθένειαν τῆς σαρκὸς
  choice: ara, ní ìtumọ̀ ti ara gangan
  alternative: àìlera lọ́nà àpẹẹrẹ tàbí ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ipò ara Pọ́ọ̀lù nígbà tó kọ́kọ́ dé ọ̀dọ̀ wọn; kò sí ìdí láti fi ìtumọ̀ ìwà ẹ̀ṣẹ̀ wọ ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kedere ni a lò. ‘Àìsàn ara’ jẹ́ àdánidá ju ‘àìsàn ẹran ara’ lọ nínú Yorùbá, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìṣòro àti ààyè ìtumọ̀ ọ̀rọ̀ Gíríìkì náà pamọ́.
