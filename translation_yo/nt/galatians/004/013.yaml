  source_fidelity: Ìtumọ̀ àkọ́kọ́ ń fi ìbáṣiṣẹ́ ìdí ti διὰ pẹ̀lú accusative, ìtọ́kasí ara ti τῆς σαρκὸς, ìkéde ìhìn rere, àti ìgbà àkọ́kọ́ ti τὸ πρότερον hàn dáadáa. Àmọ́, a tún un ṣe díẹ̀ kí ìlò ọ̀rọ̀ Yorùbá àti àlàyé ìsàlẹ̀ lè péye.
  naturalness: “Fún un yín” kò dára ní ipò yìí; “fún yín” ni ìlò boṣewa. A tún yọ “fi” kúrò nínú ìkọ́lé “nítorí ... ni mo ...” nítorí kò pọndandan, ó sì mú gbolóhùn náà rọrùn.
  terminology: “Àìsàn ara” jẹ́ ìtumọ̀ àdánidá fún ìtumọ̀ ti ara nínú àyíká yìí. Àlàyé ìsàlẹ̀ gbọdọ̀ má lo “ẹran ara,” nítorí kì í ṣe ọ̀nà Yorùbá àdánidá fún σάρξ níbí; “ara” dára, nígbà tí “àìlera ara” ń pa yíyàn lexical míì mọ́.
  issues:
