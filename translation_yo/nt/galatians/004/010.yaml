source:
  edition: SBLGNT
  text: ἡμέρας παρατηρεῖσθε καὶ μῆνας καὶ καιροὺς καὶ ἐνιαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/010.yaml
  text: You are carefully observing days and months and seasons and years.
translation:
  language: yo
  text: Ẹ̀ ń fi ìṣọ́ra pa àwọn ọjọ́ àti àwọn oṣù àti àwọn àkókò àti àwọn ọdún mọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ̀ ń pa àwọn ọjọ́ àti àwọn oṣù àti àwọn àkókò tí a yàn sílẹ̀ àti àwọn ọdún mọ́.” Àkójọ náà ń tọ́ka sí ìṣàkíyèsí àwọn àkókò kalẹ́ńdà; “àwọn àkókò tí a yàn sílẹ̀” tún lè jẹ́ ìtumọ̀ καιρούς.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: àwọn ọjọ́
  rationale: Ó túmọ̀ sí ‘days’ ní tààrà; a kò fi ‘àkànṣe’ tàbí ‘mímọ́’ kún un, nítorí àwọn ọ̀rọ̀ bẹ́ẹ̀ kò sí nínú Gíríìkì.
- source_word: παρατηρεῖσθε
  choice: Ẹ̀ ń fi ìṣọ́ra pa … mọ́
  rationale: Ìṣe tí ó ń bá a lọ ni fọ́ọ̀mù yìí ń tọ́ka sí; ‘fi ìṣọ́ra pa … mọ́’ mú èrò ṣíṣàkíyèsí tàbí pípa àwọn ìlànà kalẹ́ńdà mọ́ dáradára jáde láì sọ ó di ìtumọ̀ ẹ̀kọ́ ìsìn kan pàtó.
- source_word: μῆνας
  choice: àwọn oṣù
  rationale: Ìtumọ̀ tààrà ni, ó sì pa ìtòlẹ́sẹẹsẹ àwọn ìwọ̀n àkókò mọ́.
- source_word: καιρούς
  choice: àwọn àkókò
  rationale: καιρός lè túmọ̀ sí àkókò tàbí àkókò tí a yàn sílẹ̀; ‘àwọn àkókò’ pa ìtumọ̀ náà sílẹ̀ láì sọ ọ́ di ‘àjọ̀dún’ ní dandan.
- source_word: ἐνιαυτούς
  choice: àwọn ọdún
  rationale: Ìtumọ̀ tààrà ni, ó sì parí àkójọ àwọn ìwọ̀n kalẹ́ńdà náà.
- source_word: καὶ
  choice: àti
  rationale: A pa gbogbo àsopọ̀ inú àkójọ náà mọ́ láti fi ìlù ọ̀rọ̀ Gíríìkì hàn.
theological_decisions:
- issue: Bóyá kí a sọ ní kedere pé àwọn àkókò wọ̀nyí jẹ́ ti ẹ̀sìn Júù tàbí ti àjọ̀dún ìsìn
  choice: A fi àwọn ọ̀rọ̀ àkókò náà sílẹ̀ láì fi ‘mímọ́,’ ‘àkànṣe,’ ‘ti Júù,’ tàbí ‘àjọ̀dún’ kún wọn.
  alternative: Ẹ̀ ń pa àwọn ọjọ́ mímọ́, àwọn oṣù, àwọn àjọ̀dún àti àwọn ọdún mọ́.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kàn ṣe àkójọ àwọn ìwọ̀n àkókò. Àyíká ẹsẹ̀ náà fi hàn pé pípa kalẹ́ńdà ẹ̀sìn mọ́ ni ọ̀rọ̀ náà dá lé, ṣùgbọ́n kò yẹ kí àtúmọ̀ fi ohun tí kò fara hàn nínú gbólóhùn náà kún un.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. ‘Ẹ̀’ jẹ́ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀, ‘ń … pa … mọ́’ sì jẹ́ ọ̀nà àdánidá láti sọ ìṣe tí ó ń bá a lọ. Gbólóhùn náà jẹ́ ọ̀wọ̀, kedere, ó sì pa àsopọ̀ ‘àti’ tí a tún sọ léraléra nínú Gíríìkì mọ́.
