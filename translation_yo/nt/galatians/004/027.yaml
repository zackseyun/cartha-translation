  naturalness: Àtúnṣe náà lo Yorùbá boṣewa tí ó ṣeé ka, pẹ̀lú àmì ohùn. “Bú jáde, kí o sì ké” jẹ́ ìpè àsọtẹ́lẹ̀ tó dára jù, “tí kò ní ìrora ìbímọ” sì ṣì jẹ́ kedere. A tún ṣètò gbolohun ìkẹyìn kí ìbáṣepọ̀ àwọn ọmọ pẹ̀lú obìnrin kọ̀ọ̀kan má bàa dà rú.
