source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: yo
  text: 'Nítorí a ti kọ ọ pé: “Yọ̀[a], ìwọ obìnrin àgàn tí kò bímọ; bú jáde, kí o sì ké rara[b], ìwọ tí kò ní ìrora ìbímọ; nítorí àwọn ọmọ tí ó jẹ́ ti obìnrin tí a fi sílẹ̀[c] pọ̀ ju àwọn tí ó jẹ́ ti obìnrin tí ó ní ọkọ lọ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àyọlò láti inú Aísáyà 54:1.
    reason: cross_reference
  - marker: b
    text: Tàbí, “Yọ̀, ìwọ obìnrin àgàn tí kò bímọ … bú jáde, kí o sì hó.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ tí a túmọ̀ sí “obìnrin tí a fi sílẹ̀” tún lè túmọ̀ sí “obìnrin aṣálẹ̀” tàbí “obìnrin tí a kọ̀ sílẹ̀” nínú àwòrán yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: a ti kọ ọ
  rationale: Ó ṣe àfihàn ọ̀nà ìṣáájú àyọlò Ìwé Mímọ́ ní èdè Yorùbá, ó sì pa ìtumọ̀ perfect passive náà mọ́ pé ohun tí a kọ tẹ̀ síwájú láti dúró gẹ́gẹ́ bí ọ̀rọ̀ àṣẹ.
- source_word: Εὐφράνθητι
  choice: Máa yọ̀
  rationale: Àṣẹ ni láti yọ̀; ọ̀rọ̀ yìí jẹ́ ti ẹnu-ọ̀nà lójoojúmọ́, ó sì bá ìgbéga èdè àsọtẹ́lẹ̀ mu.
- source_word: στεῖρα
  choice: obìnrin àgàn
  rationale: Adjective náà dúró gẹ́gẹ́ bí orúkọ ẹni tí a ń bá sọ̀rọ̀; ‘obìnrin àgàn’ jẹ́ kedere, ó sì bá àwòrán ìbímọ mu.
- source_word: ἡ οὐ τίκτουσα
  choice: tí kò bímọ
  rationale: Ó sọ ipò àìbímọ tí ó ń bá a lọ ní ṣókí àti ní Yorùbá àdánidá.
- source_word: ῥῆξον καὶ βόησον
  choice: bú sí igbe ayọ̀, kí o sì ké rara
  rationale: Àkójọpọ̀ yìí mú ìtumọ̀ ìbújáde lojijì àti igbe ohùn rara jáde ní Yorùbá tó ṣeé lóye, láì sọ àwòrán àsọtẹ́lẹ̀ di pẹlẹbẹ.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: ìwọ tí kò ní ìrora ìbímọ
  rationale: ὠδίνω tọ́ka sí ìrora ìrọbí; gbolohun yìí ṣe kedere fún òǹkàwé òde òní, ó sì pa àwòrán ìyá tó ń bímọ mọ́.
- source_word: πολλὰ τὰ τέκνα ... μᾶλλον ἢ
  choice: àwọn ọmọ ... pọ̀ ju àwọn ọmọ ... lọ
  rationale: Ìṣètò afiwéra Yorùbá yìí jẹ́ ti àdánidá, ó sì sọ ìpọ̀ àwọn ọmọ di kedere.
- source_word: τῆς ἐρήμου
  choice: obìnrin tí a kọ̀ sílẹ̀
  rationale: Nínú àyọlò àsọtẹ́lẹ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tí a ti fi sílẹ̀ tàbí kọ̀ sílẹ̀, kì í ṣe aṣálẹ̀ lasán.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: obìnrin tí ó ní ọkọ
  rationale: Ó tẹ̀ lé ìtumọ̀ ἀνήρ gẹ́gẹ́ bí ‘ọkọ’ ní àfiwé pẹ̀lú obìnrin tí a kọ̀ sílẹ̀, láì sọ ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Àyọlò Aísáyà 54:1 nínú àríyànjiyàn àpẹẹrẹ Gálátíà 4
  choice: Túmọ̀ àyọlò àsọtẹ́lẹ̀ náà ní tààrà, kí àwòrán obìnrin àti ìbímọ rẹ̀ dúró bí ó ti rí.
  alternative: Ṣe ọ̀rọ̀ náà ní kedere sí i gẹ́gẹ́ bí ìtọ́ka sí Sárà tàbí Jerúsálẹ́mù ti òkè.
  rationale: Ẹsẹ̀ náà jẹ́ àyọlò Ìwé Mímọ́ ní gbangba. Ó yẹ kí àyíká àríyànjiyàn Pọ́ọ̀lù ló ṣàlàyé ìlò àpẹẹrẹ rẹ̀, dípò kí ìtumọ̀ fi ìdánimọ̀ náà sínú ọ̀rọ̀ Aísáyà.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀, kedere, àti ti àsọtẹ́lẹ̀. Àwọn ọ̀rọ̀ bí ‘obìnrin àgàn,’ ‘ìrora ìbímọ,’ àti ‘obìnrin tí ó ní ọkọ’ jẹ́ èyí tí òǹkàwé òde òní lè lóye, nígbà tí ìtẹ̀sí ewì àti afiwéra inú orísun sì dúró.
