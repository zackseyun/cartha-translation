id: GAL.4.14
reference: Galatians 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: yo
  text: Bí ó tilẹ̀ jẹ́ pé ipò ara mi jẹ́ ìdánwò fún yín[a], ẹ kò fi mí ṣe ẹni ẹ̀gàn, bẹ́ẹ̀ ni ẹ kò kọ̀ mí pẹ̀lú ìríra[b]; kàkà bẹ́ẹ̀, ẹ fi tọ̀wọ̀tọ̀wọ̀ gba mí bí áńgẹ́lì Ọlọ́run, bí Mèsáyà Jésù[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdánwò yín nínú ara mi.” Gbólóhùn Gíríìkì náà ṣòro ní ti ìtòlẹ́sẹẹsẹ ọ̀rọ̀, ó sì tún ní ìyàtọ̀ nínú àwọn ẹ̀dà àfọwọ́kọ.
    reason: alternative_reading
  - marker: b
    text: Ní tààrà, “ẹ kò tutọ́ síta” tàbí “ẹ kò tutọ́ sí mi”—ọ̀nà àsọyé tó ń fi ìríra tàbí ìkọ̀sílẹ̀ hàn.
    reason: lexical_alternative
  - marker: c
    text: 'Gíríìkì: “Kristi Jésù”; a túmọ̀ Χριστός sí “Mèsáyà” níhìn-ín nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν
  choice: ìdánwò
  rationale: Ní àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń tọ́ka sí ipò líle tàbí àdánwò tí ipò ara Paulu mú bá àwọn ará Gálátíà, kì í ṣe ìdẹwò sí ẹ̀ṣẹ̀.
- source_word: ὑμῶν ἐν τῇ σαρκί μου
  choice: ipò ara mi jẹ́ ìdánwò fún yín
  rationale: Èyí sọ ìtumọ̀ ti ara ní Yorùbá àdánidá, nígbà tí ó tún jẹ́ kí ó hàn pé àwọn ará Gálátíà ni ipò ara Paulu dán wò. A pa ìṣòro gírámà àti ọ̀nà mìíràn tí a lè gbà ka gbólóhùn náà mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἐξουθενήσατε
  choice: fi mí ṣe ẹni ẹ̀gàn
  rationale: Gbólóhùn Yorùbá yìí túmọ̀ sí fífi ẹnì kan ṣe aláìníyelórí tàbí lílo o pẹ̀lú ẹ̀gàn, ó sì bá agbára ọ̀rọ̀ Gíríìkì mu.
- source_word: ἐξεπτύσατε
  choice: kọ̀ mí pẹ̀lú ìríra
  rationale: Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ ní tààrà sí títutọ́ síta tàbí sí ẹnì kan gẹ́gẹ́ bí àmì ìríra. Ìtumọ̀ yìí mú iṣẹ́ àpẹẹrẹ náà jáde ní Yorùbá àdánidá, a sì fi àwòrán tààrà náà sínú àlàyé ìsàlẹ̀.
- source_word: ἐδέξασθέ
  choice: fi tọ̀wọ̀tọ̀wọ̀ gba mí
  rationale: Èyí fi ìtẹ́wọ́gbà onífẹ̀ẹ́ àti ọlá tí ọ̀rọ̀ náà ń sọ hàn ju ‘gba mí’ lásán lọ.
- source_word: ἄγγελον θεοῦ
  choice: áńgẹ́lì Ọlọ́run
  rationale: Bí ó tilẹ̀ jẹ́ pé ἄγγελος tún lè jẹ́ ‘ońṣẹ́,’ ìfiwéra gíga tí ó tẹ̀ lé e pẹ̀lú Mèsáyà Jésù ṣe àtìlẹ́yìn fún ‘áńgẹ́lì.’
- source_word: Χριστὸν Ἰησοῦν
  choice: Mèsáyà Jésù
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; ‘Mèsáyà’ pa ìtumọ̀ ẹni àmì òróró Ọlọ́run mọ́ dípò yíyí oyè náà padà sí orúkọ lásán.
theological_decisions:
- issue: Ìtumọ̀ ìfiwéra ‘bí áńgẹ́lì Ọlọ́run, bí Mèsáyà Jésù’
  choice: Ó ṣàpèjúwe bí àwọn ará Gálátíà ṣe fi ọlá ńlá gba Paulu.
  alternative: A lè ka ìfiwéra kejì sí ohun tí ó ń mú ti àkọ́kọ́ lágbára ní ọ̀nà àsọyé.
  rationale: Àwọn gbólóhùn ὡς méjèèjì sọ bí wọ́n ṣe gba Paulu; wọn kò sọ pé Paulu jẹ́ Jésù tàbí pé ìwà-Ọlọ́run kan náà ni wọ́n ní.
- issue: Ìtumọ̀ σάρξ
  choice: Ara Paulu àti ipò ti ara rẹ̀
  alternative: Ẹ̀dá ẹlẹ́ṣẹ̀ tàbí ìfẹ́kúfẹ̀ẹ́ ara
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa àìlera tàbí ipò ti ara Paulu; ìtumọ̀ nípa ìwà ẹ̀ṣẹ̀ kò bá ẹsẹ yìí mu.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ọ̀rọ̀ arọ́pò-orúkọ ‘ẹ’ mú ọ̀pọ̀ ènìyàn tí Paulu ń bá sọ hàn, ó sì jẹ́ èdè àdánidá. Gbólóhùn àkọ́kọ́ jẹ́ kedere fún òǹkàwé lasán, nígbà tí àlàyé [a] pa àìdánilójú inú orísun Gíríìkì mọ́.
