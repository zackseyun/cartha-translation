  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: yo
  text: Ṣùgbọ́n nígbà tí àkókò náà pé[a], Ọlọ́run rán Ọmọ rẹ̀ jáde[b], ẹni tí a bí láti ọ̀dọ̀ obìnrin[c], tí a sì bí lábẹ́ òfin[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí àkókò náà dé ìkúnrẹ́rẹ́ rẹ̀” tàbí “nígbà tí àkókò náà parí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “rán”; ọ̀rọ̀ ìṣe Gíríìkì náà jẹ́ ọ̀rọ̀ àkópọ̀ tó ní ìtumọ̀ “rán jáde.”
    reason: lexical_alternative
  - marker: c
    text: Ní tààrà, “ẹni tí a bí láti ọ̀dọ̀ obìnrin.” Gbólóhùn náà tẹnumọ́ ìbí ènìyàn gidi ti Ọmọ náà.
    reason: lexical_alternative
  - marker: d
    text: Ìyẹn ni pé, lábẹ́ àṣẹ òfin Mósè.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ṣùgbọ́n nígbà tí
  rationale: Ó fi ìyípadà ọ̀rọ̀ kékeré àti ìtọ́ka sí àkókò hàn, láìfi ìtakò tó lágbára ju ti Gíríìkì lọ.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: àkókò náà pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àkókò ti dé ìkúnrẹ́rẹ́ tàbí òpin tí a yàn fún un.
- source_word: ἐξαπέστειλεν
  choice: rán ... jáde
  rationale: Ó pa agbára ọ̀rọ̀ ìṣe àkópọ̀ náà mọ́ ju ‘rán’ nìkan lọ, ó sì bá iṣẹ́ tí Ọmọ náà wá ṣe mu.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Ọmọ rẹ̀
  rationale: Ìtumọ̀ Yorùbá tó ṣe déédé fún ohun tí Ọlọ́run rán; lílo lẹ́tà ńlá fi ẹni tí ọ̀rọ̀ náà ń tọ́ka sí hàn láìfi èrò tuntun kún un.
- source_word: γενόμενον ἐκ γυναικός
  choice: ẹni tí obìnrin bí
  rationale: Nínú àkópọ̀ ọ̀rọ̀ yìí, γενόμενον ń tọ́ka sí ìbí ènìyàn; gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì tẹnumọ́ pé ó ní ìbí ènìyàn gidi.
- source_word: γενόμενον ὑπὸ νόμον
  choice: tí a sì bí lábẹ́ òfin
  rationale: Ó pa ìfarajọ́ àwọn participle méjèèjì mọ́, ó sì sọ ipò rẹ̀ lábẹ́ àṣẹ òfin ní kedere.
- source_word: νόμον
  choice: òfin
  rationale: Gbólóhùn Páùlù jẹ́ kúkúrú; àyíká Gálátíà fi hàn pé òfin Mósè ni, ṣùgbọ́n a pa ìtumọ̀ yẹn sínú àlàyé ìsàlẹ̀ kí a má bàa fẹ ọ̀rọ̀ inú ẹsẹ̀ náà sí i.
theological_decisions:
- issue: Ìwà ènìyàn gidi ti Kristi nínú γενόμενον ἐκ γυναικός
  choice: ẹni tí obìnrin bí
  alternative: ẹni tí ó ti ọ̀dọ̀ obìnrin wá
  rationale: ‘Ẹni tí obìnrin bí’ sọ ìbí ènìyàn gidi ní kedere, nígbà tí ‘Ọlọ́run rán Ọmọ rẹ̀ jáde’ ṣì pa ìtumọ̀ pé Ọmọ náà ti wà ṣáájú iṣẹ́ ìránṣẹ́ rẹ̀ mọ́.
- issue: Ohun tí νόμος ń tọ́ka sí nínú ὑπὸ νόμον
  choice: lábẹ́ òfin, pẹ̀lú àlàyé pé òfin Mósè ni
  alternative: lábẹ́ òfin ní ìtumọ̀ gbogbogbò
  rationale: Lílo ọ̀rọ̀ náà nínú Gálátíà tọ́ka gidigidi sí àṣẹ májẹ̀mú òfin Mósè; síbẹ̀, a pa ọ̀rọ̀ Páùlù tó kúkúrú mọ́ nínú ẹsẹ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. “Àkókò náà pé” jẹ́ àdánidá ju ìtumọ̀ gígún bí “ìkúnrẹ́rẹ́ àkókò” lọ. Gbogbo àmì ohùn ni a lò níbi tí ó yẹ.
