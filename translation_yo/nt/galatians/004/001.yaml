id: GAL.4.1
reference: Galatians 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: yo
  text: Mo ní pé, níwọ̀n ìgbà tí ajogún bá ṣì jẹ́ ọmọdé[a], kò yàtọ̀ rárá sí ẹrú[b], bí ó tilẹ̀ jẹ́ olúwa ohun gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí kò tíì pé ọjọ́.” Ọ̀rọ̀ Gíríìkì νήπιος lè túmọ̀ sí ọmọ tí kò tíì dàgbà tàbí, nínú àyíká yìí, ẹni tí kò tíì pé ọjọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì δοῦλος sábà máa ń tọ́ka sí ẹrú tàbí ẹni tí ó wà lábẹ́ ìdè; a lò “ẹrú” níbí láti pa agbára àfiwé Pọ́ọ̀lù mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: Mo ní pé
  rationale: Ó mú ọ̀rọ̀ ìṣáájú wọ inú àlàyé yìí lọ́nà àdánidá, láì sọ δέ di àmì ìtakora tó lágbára.
- source_word: ἐφ’ ὅσον χρόνον
  choice: níwọ̀n ìgbà tí ... bá ṣì
  rationale: Ó fi iye àkókò tí ó ní òpin hàn, ó sì bá èdè Yorùbá òde òní mu.
- source_word: ὁ κληρονόμος
  choice: ajogún
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ẹni tí yóò jogún ohun ìní, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: νήπιός
  choice: ọmọdé
  rationale: Ó lè tọ́ka sí ọmọ kékeré tàbí ẹni tí kò tíì pé ọjọ́ lábẹ́ òfin; ‘ọmọdé’ dá àìpé ọjọ́ náà mọ́ láì fi ọjọ́ pàtó kún un.
- source_word: οὐδὲν διαφέρει
  choice: kò yàtọ̀ rárá sí
  rationale: Ó sọ àìsí ìyàtọ̀ ní ipò ìṣe ní kedere, ó sì jẹ́ Yorùbá àdánidá.
- source_word: δούλου
  choice: ẹrú
  rationale: Nínú àfiwé yìí, ipò ẹni tí ó wà lábẹ́ àṣẹ tí kò sì ní òmìnira ni ó ṣe pàtàkì; ‘ẹrú’ pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: κύριος πάντων ὤν
  choice: bí ó tilẹ̀ jẹ́ olúwa ohun gbogbo
  rationale: Àpólà aláìlópìn náà ní agbára ìyọ̀ǹda; ‘bí ó tilẹ̀ jẹ́’ mú un hàn, ‘olúwa’ sì tọ́ka sí ẹni tó ní ohun-ìní tàbí àṣẹ, kì í ṣe oyè Ọlọ́run níbí.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àfiwé Pọ́ọ̀lù
  choice: ẹrú
  alternative: ìránṣẹ́
  rationale: Àfiwé náà sinmi lórí àìní òmìnira àti wíwà lábẹ́ àṣẹ; ‘ẹrú’ mú ipò ìdè tó wà nínú δοῦλος hàn ju ‘ìránṣẹ́’ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ajogún,’ ‘ọmọdé,’ àti ‘ẹrú’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá tí ó pa àwòrán òfin àti agbára àfiwé náà mọ́.
