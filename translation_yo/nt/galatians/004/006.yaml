id: GAL.4.6
reference: Galatians 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: yo
  text: Nítorí pé ẹ̀yin jẹ́ àwọn ọmọkùnrin[a], Ọlọ́run rán Ẹ̀mí Ọmọ rẹ̀ sí inú àwọn ọkàn wa[b], tí ó ń ké pé, “Abba[c], Baba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn ọmọkùnrin” pa ọ̀rọ̀ Pọ́ọ̀lù nípa gbígba ẹni sí ipò ọmọ àti ẹ̀tọ́ ogún mọ́; gbogbo àwọn onígbàgbọ́ ni ìtọ́kasí náà kan, kì í ṣe àwọn ọkùnrin nìkan.
    reason: cultural_note
  - marker: b
    text: Àwọn àfọwọ́kọ kan ní “àwọn ọkàn yín” dípò “àwọn ọkàn wa.”
    reason: textual_variant
  - marker: c
    text: Abba jẹ́ ọ̀rọ̀ Árámáíkì fún “Baba”; a dá a sílẹ̀ nínú fọ́ọ̀mù ìpilẹ̀ rẹ̀ fún ìtẹnumọ́ rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: Àti nítorí
  rationale: Ó pa agbára ìsopọ̀ δέ àti ìtumọ̀ ìdí tí ὅτι ní mọ́, ní èdè Yorùbá tó ṣe déédé.
- source_word: υἱοί
  choice: ọmọkùnrin Ọlọ́run
  rationale: υἱοί jẹ́ akọ ní gírámà, ó sì ní í ṣe pẹ̀lú ipò ọmọ àti ogún nínú àríyànjiyàn Gálátíà 3–4. Fífi “Ọlọ́run” kún un mú ẹni tí wọ́n jẹ́ ọmọ rẹ̀ ṣe kedere ní Yorùbá, láìyí ìtumọ̀ padà; ó kan gbogbo onígbàgbọ́, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: ἐξαπέστειλεν
  choice: rán
  rationale: “Rán” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún iṣẹ́ Ọlọ́run tí ó ti ṣe ní kíkún.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: Ẹ̀mí Ọmọ rẹ̀
  rationale: Ó pa ìbáṣepọ̀ tí genitive Gíríìkì fi hàn mọ́, ó sì dáàbò bo ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ inú gbólóhùn náà.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: sínú ọkàn wa
  rationale: Ó tẹ̀lé ἡμῶν (“wa”) nínú SBLGNT, ó sì pa àwòrán Bíbélì nípa ọkàn gẹ́gẹ́ bí inú ẹni mọ́.
- source_word: κρᾶζον
  choice: ẹni tí ń ké pé
  rationale: Ẹ̀mí ni participle náà bá mu ní gírámà. “Ń ké pé” fi ohùn líle àti ìṣe tí ń lọ lọ́wọ́ hàn.
- source_word: Αββα
  choice: Ábà
  rationale: A ṣe àkọsílẹ̀ ìró ọ̀rọ̀ Árámáíkì náà ní Yorùbá dípò títúmọ̀ rẹ̀ kúrò, kí ìtẹnumọ́ àkọ́kọ́ rẹ̀ lè dúró.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Nínú àdúrà tàbí ìpè tààrà, “Baba” jẹ́ àdánidá ní Yorùbá, ó sì ṣe iṣẹ́ vocative tí gbólóhùn Gíríìkì náà ní.
theological_decisions:
- issue: Ìtumọ̀ υἱοί nínú ọ̀rọ̀ ipò ọmọ àti ogún
  choice: ọmọkùnrin Ọlọ́run
  alternative: àwọn ọmọ Ọlọ́run
  rationale: “Ọmọkùnrin” pa èdè òfin nípa ipò ọmọkùnrin àti ẹ̀tọ́ ogún nínú àríyànjiyàn Paulu mọ́. Àlàyé ìsàlẹ̀ ojú ìwé sọ pé gbogbo onígbàgbọ́ ló wà nínú rẹ̀, kì í ṣe akọ nìkan.
- issue: Ìyàtọ̀ àfọwọ́kọ ní ọ̀rọ̀ arọ́pò-orúkọ tó tẹ̀ lé “ọkàn”
  choice: ọkàn wa
  alternative: ọkàn yín
  rationale: SBLGNT tí a pèsè ní ἡμῶν (“wa”); a tẹ̀lé e nínú ẹsẹ̀, a sì fi “yín” sínú àlàyé ìsàlẹ̀ fún ìṣípayá ẹ̀rí.
- issue: Ta ni ó ń ké?
  choice: Ẹ̀mí Ọmọ Ọlọ́run ni ó ń ké
  alternative: àwọn onígbàgbọ́ ń ké nípasẹ̀ Ẹ̀mí
  rationale: κρᾶζον jẹ́ neuter singular tó bá τὸ πνεῦμα mu, nítorí náà Ẹ̀mí ni olùṣe tó hàn gbangba nínú gbólóhùn yìí, bí ó tilẹ̀ jẹ́ pé igbe náà tún ń ṣiṣẹ́ nínú ọkàn àwọn onígbàgbọ́.
translation_notes:
  register: Èdè Yorùbá ọ̀wọ̀, àdánidá, àti òde òní ni a lò. A pa àmì ohùn mọ́ níbi tó yẹ. “Ẹ̀yin” fi plural ἐστε hàn; “ẹni tí ń ké” yọ àìmọ̀ nípa ẹni tó ń ké kúrò ní ìbámu pẹ̀lú gírámà Gíríìkì. Àwọn àmì àlàyé [a] àti [b] wà nínú ẹsẹ̀.
