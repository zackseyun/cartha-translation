  source_fidelity: Ìtúmọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà mọ́, pẹ̀lú Ẹ̀mí gẹ́gẹ́ bí ẹni tí ń ké àti “wa” gẹ́gẹ́ bí ìfẹ̀hónúhàn SBLGNT. Ṣùgbọ́n “Ọlọ́run” tí a fi kún “ọmọkùnrin” kò sí nínú ọ̀rọ̀ Gíríìkì fúnra rẹ̀, “ọkàn wa” kò fi ọ̀pọ̀ καρδίας hàn, àti àlàyé ìyàtọ̀ ìwé ọwọ́ kò ní àmì tí ó so mọ́ “ọkàn.”
  naturalness: “Àti nítorí ẹ̀yin jẹ́” kò rọrùn gan-an ní Yorùbá òde òní. “Nítorí pé ẹ̀yin jẹ́...” jẹ́ àdánidá. “Tí ó ń ké pé” ní ìbámu kedere pẹ̀lú “Ẹ̀mí,” ó sì rọrùn ju “ẹni tí ń ké pé” lọ ní ọ̀nà yìí.
  terminology: “Àwọn ọmọkùnrin” ń pa υἱοί mọ́ nínú àyíká ipò ọmọ àti ogún. “Abba” ni a dá sílẹ̀ gẹ́gẹ́ bí fọ́ọ̀mù Árámáíkì, dípò yíyí i sí “Ábà,” nítorí kò yẹ kí a ṣe é bí ọ̀rọ̀ Yorùbá tuntun.
