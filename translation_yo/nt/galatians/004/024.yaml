id: GAL.4.24
reference: Galatians 4:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: yo
  text: 'Àwọn nǹkan wọ̀nyí ni a ń túmọ̀ lọ́nà àpẹẹrẹ[a], nítorí àwọn obìnrin wọ̀nyí ni májẹ̀mú méjì: ọ̀kan wá láti Òkè Sínáì, ó sì ń bí àwọn ọmọ sí ipò ẹrú[b]; òun ni Hágárì.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn nǹkan tí a ń túmọ̀ lọ́nà àpẹẹrẹ,” tàbí, “àwọn nǹkan wọ̀nyí jẹ́ àpèjúwe.” Ọ̀rọ̀ Gíríìkì fi hàn pé Pọ́ọ̀lù ń lo ìtàn tí ó ṣáájú lọ́nà àpẹẹrẹ.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún ìsìnrú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́mìí ọ̀pọ̀ yìí ń tọ́ka sí ìtàn Sárà àti Hágárì tí ó ṣáájú; gbólóhùn yìí ṣe kedere, ó sì bá Yorùbá òde òní mu.
- source_word: ἀλληγορούμενα
  choice: ni a ń túmọ̀ lọ́nà àpẹẹrẹ
  rationale: Ìtumọ̀ yìí pa ìṣe aláìlórúkọ àti ìṣe tí ń lọ lọ́wọ́ mọ́, ó sì fi hàn pé Pọ́ọ̀lù ń lo ìtàn náà lọ́nà àpẹẹrẹ, láìsọ pé àwọn ènìyàn inú ìtàn náà kì í ṣe ẹni ìtàn gidi.
- source_word: αὗται
  choice: àwọn obìnrin wọ̀nyí
  rationale: Ọ̀rọ̀ atọ́ka abo ọ̀pọ̀ náà ń tọ́ka pàtó sí àwọn obìnrin méjèèjì tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: διαθῆκαι
  choice: májẹ̀mú
  rationale: ‘Májẹ̀mú’ ni ọ̀rọ̀ Yorùbá tí ó bójú mu fún διαθήκη nínú àyíká Sínáì àti ìtàn ìgbàlà.
- source_word: μία μὲν
  choice: ọ̀kan
  rationale: μέν bẹ̀rẹ̀ ìyàtọ̀ tí ẹsẹ tó tẹ̀ lé máa parí; ‘ọ̀kan’ dá ìtumọ̀ náà dúró láìfi ọ̀rọ̀ àfikún tí kò wọ́pọ̀ sínú gbólóhùn.
- source_word: ἀπὸ ὄρους Σινᾶ
  choice: wá láti Òkè Sínáì
  rationale: Ó sọ orísun májẹ̀mú náà ní Yorùbá àdánidá.
- source_word: γεννῶσα
  choice: ń bí àwọn ọmọ
  rationale: Ó pa àwòrán ìyá tí ń bímọ mọ́, èyí tí ó ṣe pàtàkì fún ìfiwé Hágárì.
- source_word: εἰς δουλείαν
  choice: sí ipò ẹrú
  rationale: ‘Sí’ pa ìtọ́sọ́nà tàbí àbájáde εἰς mọ́, ‘ipò ẹrú’ sì mú agbára δουλεία gẹ́gẹ́ bí ìsìnrú ẹni tí a dè mọ́ iṣẹ́ hàn.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: òun ni Hágárì
  rationale: ‘Òun’ ń tọ́ka sí májẹ̀mú/obìnrin náà, ‘ni’ sì pa ìdánimọ̀ àpẹẹrẹ tí ọ̀rọ̀ Gíríìkì sọ mọ́.
theological_decisions:
- issue: Irú ọ̀nà tí Pọ́ọ̀lù gbà lo ìtàn Sárà àti Hágárì
  choice: A ń túmọ̀ tàbí lo ìtàn náà lọ́nà àpẹẹrẹ.
  alternative: Kí a sọ pé ìtàn náà kàn jẹ́ àròsọ tàbí pé àwọn ènìyàn inú rẹ̀ kò sí ní ìtàn gidi.
  rationale: ἀλληγορούμενα tọ́ka sí ọ̀nà ìtumọ̀ tàbí lílo ìtàn náà. Ìtumọ̀ Yorùbá kò tako jíjẹ́ ìtàn gidi, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ẹ̀sìn kan tí ẹsẹ náà kò sọ kún un.
- issue: Ìtumọ̀ δουλεία
  choice: ipò ẹrú
  alternative: ìsìnrú tàbí ìdè
  rationale: Àyíká náà ń tẹnu mọ́ ipò ẹni tí kò lómìnira; ‘ipò ẹrú’ lágbára, ó sì mú ìyàtọ̀ tí Pọ́ọ̀lù ń ṣe hàn kedere.
- issue: Ìdánimọ̀ àwọn obìnrin gẹ́gẹ́ bí májẹ̀mú méjì
  choice: àwọn obìnrin wọ̀nyí ni májẹ̀mú méjì
  alternative: àwọn obìnrin wọ̀nyí dúró fún májẹ̀mú méjì
  rationale: Ìtumọ̀ tààrà pa ìṣọ̀kan àpẹẹrẹ tí αὗται ... εἰσιν sọ mọ́, dípò yíyí rẹ̀ sí àlàyé tí ó túbọ̀ túmọ̀ ọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ kí ó yé òǹkàwé lásán; ‘Òkè Sínáì,’ ‘májẹ̀mú,’ àti ‘ipò ẹrú’ pa àwọ̀ Bíbélì àti agbára àyíká mọ́.
