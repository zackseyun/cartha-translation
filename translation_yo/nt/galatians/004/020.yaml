id: GAL.4.20
reference: Galatians 4:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: yo
  text: Ṣùgbọ́n ìbá wù mí kí n lè wà pẹ̀lú yín ní báyìí gan-an, kí n sì yí ohùn tí mo fi ń bá yín sọ̀rọ̀ padà[a], nítorí mo wà ní ìdàrúdàpọ̀ nípa yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yí ohùn mi padà.” Ní Gíríìkì, ó sọ ní tààrà pé “yí ohùn mi padà”; níbí, ó ṣeé ṣe kí ó tọ́ka sí yí ọ̀nà tàbí tóònù tí Pọ́ọ̀lù fi ń sọ̀rọ̀ padà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: ìbá wù mí kí n lè
  rationale: Ọ̀nà yìí fi ìfẹ́ tí Pọ́ọ̀lù ní nísinsìnyí hàn, pẹ̀lú òtítọ́ pé kò ṣeé ṣe fún un láti mú un ṣẹ nígbà náà; ó bá agbára imperfect náà mu ní Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìtakora pẹ̀lẹ́ láàárín ọ̀rọ̀ yìí àti ẹ̀bẹ̀ àti ìbáwí tó ṣáájú hàn.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: wà pẹ̀lú yín
  rationale: Ó sọ wíwà Pọ́ọ̀lù níbẹ̀ lọ́dọ̀ àwọn ará Gálátíà ní Yorùbá tó ṣe kedere, láìfi ọ̀rọ̀ àjèjì kún un.
- source_word: ἄρτι
  choice: ní báyìí gan-an
  rationale: “Gan-an” pa ìtẹnumọ́ ìsinsìnyí àti ìkánjú tí ἄρτι ní mọ́.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: yí ohùn tí mo fi ń bá yín sọ̀rọ̀ padà
  rationale: “Ohùn” pa àwòrán φωνή mọ́, nígbà tí gbólóhùn tó yí i ká jẹ́ kí òǹkàwé lóye pé ọ̀nà tàbí ìró tí Pọ́ọ̀lù yóò fi bá wọn sọ̀rọ̀ ló ń tọ́ka sí.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí tí Pọ́ọ̀lù fi fẹ́ wà pẹ̀lú wọn, gẹ́gẹ́ bí ὅτι ṣe ń ṣe níbí.
- source_word: ἀποροῦμαι
  choice: dà mí rú
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ìdàrúdàpọ̀ àti àìmọ ohun tó yẹ kí ènìyàn rò tàbí ṣe hàn, láìyanjú ìṣòro Pọ́ọ̀lù ju ohun tí Gíríìkì sọ lọ.
- source_word: ἐν ὑμῖν
  choice: ọ̀rọ̀ yín
  rationale: Ní àjọṣe rẹ̀ pẹ̀lú ἀποροῦμαι, gbólóhùn náà tọ́ka sí pé ìdàrúdàpọ̀ Pọ́ọ̀lù jẹ mọ́ àwọn ará Gálátíà. “Ọ̀rọ̀ yín” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtọ́kasí yìí, kì í ṣe pé ó wà ní inú wọn ní ti gidi.
theological_decisions:
- issue: Ìtumọ̀ φωνή nínú àyíká ọ̀rọ̀ yìí
  choice: Ó ń tọ́ka sí ohùn tàbí ọ̀nà tí Pọ́ọ̀lù yóò fi bá wọn sọ̀rọ̀.
  alternative: Ó ń tọ́ka kìkì sí ìró ohùn ara Pọ́ọ̀lù.
  rationale: Àyíká ọ̀rọ̀ jẹ́ ti ìbáwí àti àníyàn olùṣọ́; nítorí náà, ó ṣeé ṣe jù pé Pọ́ọ̀lù fẹ́ lè ṣàtúnṣe bí yóò ṣe bá wọn sọ̀rọ̀ nígbà tó bá wà níwájú wọn. Àkọsílẹ̀ ìsàlẹ̀ pa ìtumọ̀ gangan náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún ọ̀pọ̀ ènìyàn láti lóye. Àwọn àmì ohùn wà níbi tó yẹ. “Ní báyìí gan-an” fi ìkánjú hàn, “ọ̀rọ̀ yín dà mí rú” sì jẹ́ ọ̀nà àdánidá láti sọ ìdàrúdàpọ̀ Pọ́ọ̀lù láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
