id: GAL.4.25
reference: Galatians 4:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: yo
  text: Hágarì ni Òkè Sínáì ní ilẹ̀ Arábíà[a], ó sì bá Jerúsálẹ́mù ìsinsìnyí mu, nítorí ó wà ní ìsìnrú pẹ̀lú àwọn ọmọ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Hágarì yìí ni Òkè Sínáì ní ilẹ̀ Arábíà.” Èdè Gíríìkì ní àpilẹ̀kọ kan ṣáájú “Hágarì,” èyí sì mú kí gbólóhùn náà nira ní gírámà; àwọn ìtumọ̀ kan fi èyí hàn ní kedere sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: Hágarì
  rationale: A mú δέ gẹ́gẹ́ bí àmì ìtẹ̀síwájú kékeré tí kò pọndandan láti fi ọ̀rọ̀ míì hàn ní Yorùbá; àpilẹ̀kọ τὸ ṣáájú orúkọ náà nira ní gírámà Gíríìkì, a sì fi àlàyé rẹ̀ sínú àlàyé ìsàlẹ̀.
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: ni Òkè Sínáì ní ilẹ̀ Arábíà
  rationale: Èyí pa èdè ìdánimọ̀ tààrà mọ́, kò sì yí i sí ‘dúró fún’; ‘ilẹ̀ Arábíà’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti tọ́ka sí agbègbè náà láì sọ ààlà ìjọba kan pàtó.
- source_word: συστοιχεῖ
  choice: bá ... mu
  rationale: ‘Bá ... mu’ sọ ìbámu tàbí ìfọwọ́ra-ẹni tí ọ̀rọ̀ náà ní nínú àfiwé Pọ́ọ̀lù, ní èdè Yorùbá tó ṣe kedere.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: Jerúsálẹ́mù ìsinsìnyí
  rationale: ‘Ìsinsìnyí’ pa ìyàtọ̀ àkókò mọ́ láàárín Jerúsálẹ́mù ayé ìgbà Pọ́ọ̀lù àti ‘Jerúsálẹ́mù ti òkè’ nínú ẹsẹ tó tẹ̀ lé e.
- source_word: δουλεύει ... μετὰ τῶν τέκνων αὐτῆς
  choice: òun àti àwọn ọmọ rẹ̀ wà ní oko ẹrú
  rationale: ‘Wà ní oko ẹrú’ mú ipò ìsìnrú hàn gbangba, ó sì pa ìṣọ̀kan Hágarì pẹ̀lú àwọn ọmọ rẹ̀ mọ́.
theological_decisions:
- issue: Ìdánimọ̀ àkàwé Hágarì pẹ̀lú Òkè Sínáì àti ìbámu rẹ̀ pẹ̀lú Jerúsálẹ́mù
  choice: A túmọ̀ ọ́ ní tààrà pé ‘Hágarì ni Òkè Sínáì ... ó sì bá Jerúsálẹ́mù ìsinsìnyí mu.’
  alternative: ‘Hágarì dúró fún Òkè Sínáì’
  rationale: Gíríìkì lo ọ̀rọ̀ ìdánimọ̀ tààrà, lẹ́yìn náà ó lo ọ̀rọ̀ ìbámu; títúmọ̀ rẹ̀ báyìí pa agbára ọ̀rọ̀ Pọ́ọ̀lù àti ìnira ẹ̀kọ́ inú rẹ̀ mọ́ láì ṣàlàyé àkàwé náà ju ohun tí ẹsẹ sọ lọ.
translation_notes:
  register: Èdè Yorùbá àkókò yìí tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Oko ẹrú’ jẹ́ ọ̀rọ̀ tí òǹkàwé lásán lè lóye, ó sì pa àtakò ẹrú/òmìnira inú àyíká ọ̀rọ̀ mọ́.
