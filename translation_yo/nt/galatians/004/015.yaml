id: GAL.4.15
reference: Galatians 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: yo
  text: Níbo ni ìbùkún yín wà báyìí? Nítorí mo jẹ́rìí fún yín pé, bí ó bá ṣeé ṣe, ẹ ì bá ti hú ojú yín jáde, ẹ sì fi wọ́n fún mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gangan, Gíríìkì náà ní “lẹ́yìn tí ẹ ti hú ojú yín jáde.” Ó ṣeé ṣe kí ọ̀rọ̀ náà jẹ́ àsọdùn tó ń fi bí ìfẹ́ àti ìfọkànsìn wọn ti lágbára tẹ́lẹ̀ hàn; àwọn kan sì rí i gẹ́gẹ́ bí ìtọ́kasí tó ṣeé ṣe sí àìlera ara Pọ́ọ̀lù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: Ǹjẹ́ … dà?
  rationale: A lo ìbéèrè àròsọ Yorùbá tó túmọ̀ sí ‘kí ló ṣẹlẹ̀ sí … nígbà náà?’ láti fi agbára ìtẹ̀síwájú οὖν àti ìtumọ̀ ọ̀rọ̀ náà hàn láì fi kún un ju bó ṣe yẹ lọ.
- source_word: μακαρισμὸς ὑμῶν
  choice: ìbùkún tí ẹ ní
  rationale: μακαρισμός lè tọ́ka sí ipò ẹni tí a bù kún tàbí sí pípe ẹni ní alábùkún. ‘Ìbùkún tí ẹ ní’ jẹ́ èdè Yorùbá àdánidá tó pa ìtumọ̀ méjèèjì mọ́ dé ìwọ̀n kan.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: Nítorí mo jẹ́rìí fún yín
  rationale: Ó pa ohùn ìjẹ́rìí tó lágbára mọ́, ó sì bá èdè Yorùbá òde òní mu.
- source_word: εἰ δυνατὸν
  choice: ká ní ó ṣeé ṣe
  rationale: Àwọn ọ̀rọ̀ yìí fi ipò àròsọ tí kò ṣeé ṣẹ sílẹ̀ ní àdánidá, bí ọ̀rọ̀ Gíríìkì ṣe ṣe é ní ṣókí.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: ẹ ì bá ti hú ojú yín jáde
  rationale: ‘Hú … jáde’ pa àwòrán líle ti ἐξορύσσω mọ́; a kò sọ ọ́ di ọ̀rọ̀ gbogbogbò nípa ọ̀làwọ́.
- source_word: ἐδώκατέ μοι
  choice: kí ẹ sì fi wọ́n fún mi
  rationale: ‘Wọ́n’ tọ́ka sí ojú méjèèjì, ó sì mú ìbáṣepọ̀ participle àti ọ̀rọ̀-ìṣe pàtàkì náà ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Bóyá kí a rọ ọ̀rọ̀ nípa fífọ ojú jáde di gbólóhùn gbogbogbò nípa ìfọkànsìn
  choice: 'A pa àwòrán gangan náà mọ́: ‘hú ojú yín jáde.’'
  alternative: ‘Ẹ ì bá ti fi ohunkóhun fún mi.’
  rationale: Gíríìkì dárúkọ ojú ní pàtó, ó sì lo ọ̀rọ̀-ìṣe tó lágbára. Ó lè jẹ́ àṣejù láti fi ìfọkànsìn wọn hàn, tàbí kó ní ìbáṣepọ̀ pẹ̀lú àìlera Pọ́ọ̀lù; ìtumọ̀ kò gbọ́dọ̀ pinnu èyíkéyìí.
- issue: Ìtumọ̀ μακαρισμός gẹ́gẹ́ bí ipò alábùkún tàbí ìkéde pé ẹni jẹ́ alábùkún
  choice: ‘ìbùkún tí ẹ ní’
  alternative: ‘ayọ̀ yín’ tàbí ‘bí ẹ ti ka ara yín sí alábùkún’
  rationale: Yíyan yìí jẹ́ kí àìdánilójú ìtumọ̀ ọ̀rọ̀ Gíríìkì wà, dípò kí a fi í mọ́ ìmọ̀lára ayọ̀ nìkan tàbí ìkéde nìkan.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. A lo ‘ẹ/yín’ fún ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe rí. Àmì àlàyé [a] wà nínú ọ̀rọ̀ pàtàkì.
