  source_fidelity: Ìtumọ̀ náà pa ìjẹ́rìí Pọ́ọ̀lù, ìpèníjà ìbéèrè rẹ̀, àti àwòrán gangan ti yíyọ ojú jáde mọ́. Ṣùgbọ́n gbolohun àkọ́kọ́ náà, “ìbùkún tí ẹ ní nígbà náà dà,” kò jẹ́ ìbéèrè Yorùbá tó péye, kò sì fi ποῦ οὖν hàn ní kedere.
  naturalness: A nílò ìtúnṣe sí ìbéèrè àkọ́kọ́ àti sí ìdásílẹ̀ àmì-ẹsẹ̀. “Níbo ni ìbùkún yín wà báyìí?” jẹ́ Yorùbá àdánidá, ó sì fi ìbéèrè Pọ́ọ̀lù pé kí ni ó ṣẹlẹ̀ sí ìbùkún wọn tẹ́lẹ̀ hàn. “Bí ó bá ṣeé ṣe” jẹ́ ìṣètò ìpò tó rọrùn, tó sì yẹ níbí.
  terminology: “Ìbùkún yín” jẹ́ ìtumọ̀ tó bójú mu fún μακαρισμὸς ὑμῶν, bí ó tilẹ̀ jẹ́ pé ó lè ní ìfẹ̀sẹ̀mulẹ̀ sí ìkéde tàbí ìrírí alábùkún. “Mo jẹ́rìí fún yín,” “hú ojú yín jáde,” àti “fi wọ́n fún mi” pa ìtumọ̀ àti agbára ọ̀rọ̀ Gíríìkì mọ́.
