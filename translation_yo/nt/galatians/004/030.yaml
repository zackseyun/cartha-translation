id: GAL.4.30
reference: Galatians 4:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: yo
  text: Ṣùgbọ́n kí ni Ìwé Mímọ́ wí? “Lé ẹrú obìnrin náà àti ọmọ rẹ̀ jáde,[a][b] nítorí ọmọ ẹrú obìnrin náà kò ní jogún pẹ̀lú ọmọ obìnrin òmìnira náà rárá.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “obìnrin ìránṣẹ́ tí ó jẹ́ ẹrú.” Ọ̀rọ̀ Gíríìkì náà tọ́ka sí obìnrin tàbí ọmọbìnrin tí ó wà ní ipò ẹrú; “ẹrú obìnrin” ni a lò nítorí ìyàtọ̀ láàárín ìsìnrú àti òmìnira ṣe pàtàkì nínú àyíká ọ̀rọ̀ náà.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ àyọlò yìí ń ṣe ìrántí Jẹ́nẹ́sísì 21:10.
    reason: cross_reference
  - marker: c
    text: 'Ọ̀rọ̀ Gíríìkì lo ìkọ̀ tí a tẹnumọ́ gidigidi: “kò ní jogún ... rárá”; a tún lè túmọ̀ rẹ̀ sí “kò ní jogún láé.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ sí àríyànjiyàn tó ṣáájú hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: τί λέγει ἡ γραφή
  choice: kí ni Ìwé Mímọ́ wí?
  rationale: Ó pa àsìkò ìsinsìnyí àti bí a ṣe sọ Ìwé Mímọ́ di ẹni tó ń sọ̀rọ̀ mọ́; “Ìwé Mímọ́” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún γραφή ní irú ọ̀rọ̀ yìí.
- source_word: Ἔκβαλε
  choice: Lé ... jáde
  rationale: Ọ̀rọ̀ àṣẹ yìí lágbára, ó sì túmọ̀ sí mímú ẹni kúrò, kì í ṣe fífi ránṣẹ́ lọ lásán.
- source_word: παιδίσκην
  choice: ẹrú obìnrin
  rationale: Ó sọ ipò ìsìnrú obìnrin náà ní kedere, ó sì pa ìyàtọ̀ láàárín ẹrú àti òmìnira tó ṣe pàtàkì nínú àyíká ọ̀rọ̀ náà mọ́.
- source_word: υἱὸν αὐτῆς
  choice: ọmọ rẹ̀
  rationale: Ó ṣe àfihàn ìní ọ̀rọ̀ Gíríìkì ní tààrà láìfi ìtumọ̀ míì kún un.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: nítorí ... kò lè jogún ... láé
  rationale: Àkópọ̀ ìkọ̀ emphatic οὐ μή pẹ̀lú ọ̀rọ̀ ọjọ́ iwájú jẹ́ ìkọ̀ tó lágbára gan-an; “kò lè ... láé” mú ìdánilójú pé kò ní ṣẹlẹ̀ hàn ní Yorùbá àdánidá.
- source_word: κληρονομήσει
  choice: jogún
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó bójú mu fún gbígba ogún gẹ́gẹ́ bí ajogún nínú àyíká ẹbí àti òfin.
- source_word: μετὰ τοῦ υἱοῦ
  choice: pẹ̀lú ọmọ
  rationale: “Pẹ̀lú” fi ìbáṣepọ̀ tàbí jíjogún papọ̀ hàn ní ṣókí.
- source_word: τῆς ἐλευθέρας
  choice: obìnrin òmìnira náà
  rationale: Ó mú orúkọ tí ajẹtífù Gíríìkì fi pamọ́ jáde, ó sì jẹ́ kí ìyàtọ̀ sí ẹrú obìnrin náà ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ παιδίσκη nínú àpèjúwe Paulu nípa Hágárì àti Sárà
  choice: ẹrú obìnrin
  alternative: ọmọbìnrin ìránṣẹ́; obìnrin ìránṣẹ́
  rationale: Àríyànjiyàn tó yí ẹsẹ náà ká dá lórí ìyàtọ̀ láàárín ìsìnrú àti òmìnira. “Ẹrú obìnrin” pa kókó yẹn mọ́ láìfi ẹ̀kọ́ ẹ̀sìn míì kún ọ̀rọ̀ náà.
- issue: Agbára ìyọkúrò nínú οὐ γὰρ μὴ κληρονομήσει
  choice: kò lè jogún ... láé
  alternative: kò ní jogún rárá; kò sì ní jogún lọ́nàkọnà
  rationale: Ó pa ìkọ̀ Gíríìkì tó lágbára gan-an mọ́, ṣùgbọ́n kò ṣe àlàyé ẹni tàbí ohun tí ogún náà dúró fún kọjá ohun tí ẹsẹ náà sọ.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní, ni a lò pẹ̀lú àmì ohùn ní kíkún. “Wí” àti “jogún” jẹ́ ọ̀rọ̀ tó ní iyì ṣùgbọ́n tí ó ṣì wọ́pọ̀. Ìtò [a][b] lẹ́yìn gbólóhùn àkọ́kọ́ àti [c] lẹ́yìn ìkọ̀ tó lágbára mú kí àmì àlàyé kọ̀ọ̀kan sún mọ́ ọ̀rọ̀ tó ń ṣàlàyé.
