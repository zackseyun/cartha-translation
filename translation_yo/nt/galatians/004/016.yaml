translation:
  language: yo
  text: Nítorí náà[a], mo ha ti di ọ̀tá yín nípa sísọ òtítọ́ fún yín?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa sísọ̀rọ̀ ní òtítọ́ fún yín.” Ọ̀rọ̀ Gíríìkì náà, ἀληθεύων, lè túmọ̀ sí “sísọ̀rọ̀ ní òtítọ́” tàbí “sísọ òtítọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ǹjẹ́ nígbà náà
  rationale: Ó fa ìbéèrè ìparí jáde láti inú ọ̀rọ̀ tó ṣáájú; gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa agbára ìbéèrè àsọyé mọ́.
- source_word: ἐχθρὸς ὑμῶν
  choice: ọ̀tá yín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tí wọ́n kà sí ọ̀tá; ‘ọ̀tá yín’ jẹ́ kedere, ó sì ṣe àfihàn ìbáṣepọ̀ tí ẹ̀yà gírámà genitive náà ń sọ.
- source_word: γέγονα
  choice: mo ha ti di
  rationale: Perfect tense náà fi ìyípadà tó ti ṣẹlẹ̀ àti ipò tó ṣì wà hàn; ‘ti di’ mú àwọn méjèèjì jáde, ‘ha’ sì bá ìbéèrè àsọyé mu.
- source_word: ἀληθεύων ὑμῖν
  choice: nítorí pé mo ń sọ òtítọ́ fún yín
  rationale: Present participle náà lè tọ́ka sí sísọ òtítọ́ tàbí sísọ̀rọ̀ ní òtítọ́ sí wọn. Èdè yìí fi iṣẹ́ tí Pọ́ọ̀lù ń ṣe àti àwọn tí ó ń bá sọ̀rọ̀ hàn lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ ἀληθεύων nínú àsọyé Pọ́ọ̀lù
  choice: Pọ́ọ̀lù béèrè bóyá sísọ òtítọ́ fún àwọn ará Gálátíà ti mú kí ó di ọ̀tá wọn.
  alternative: Pọ́ọ̀lù béèrè bóyá jíjẹ́ olóòótọ́ sí wọn lápapọ̀ ti mú kí ó di ọ̀tá wọn.
  rationale: Àyíká ọ̀rọ̀ náà dá lórí ọ̀rọ̀ tààrà, ìbáwí, àti ẹ̀bẹ̀ Pọ́ọ̀lù. Bí ó tilẹ̀ jẹ́ pé ‘sísọ òtítọ́’ bá àyíká mu jù, àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ kejì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘Ǹjẹ́ … ha’ láti mú ìbéèrè àsọyé náà jáde; ‘ti di’ pa ipa perfect tense mọ́. Gbogbo àmì ohùn ni a fi sí ibi tí ó bá yẹ.
