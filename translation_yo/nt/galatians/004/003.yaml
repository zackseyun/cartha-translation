id: GAL.4.3
reference: Galatians 4:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà ni àwa pẹ̀lú, nígbà tí a jẹ́ ọmọdé, a wà lábẹ́ ìdè àwọn ìlànà ìpilẹ̀ṣẹ̀ ayé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn agbára ẹ̀mí ayé.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí àwọn ìlànà tàbí àwọn ohun ìpilẹ̀ṣẹ̀, tàbí sí àwọn agbára ẹ̀mí inú àgbáyé.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Bẹ́ẹ̀ náà ni ... pẹ̀lú
  rationale: Ó so ẹsẹ̀ yìí mọ́ àpẹẹrẹ ajogún tí ó ṣáájú, ó sì pa agbára ìfiwéra Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἡμεῖς
  choice: àwa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni àkọ́kọ́ púpọ̀ ni; lílo ‘àwa’ ní kedere pa ìtẹnumọ́ inú Gíríìkì mọ́.
- source_word: ὅτε ἦμεν νήπιοι
  choice: nígbà tí a jẹ́ ọmọdé
  rationale: Ó sọ àkókò àti ipò àìpéye ẹni tí kò tíì dàgbà nínú àpẹẹrẹ ajogún; ‘ọmọdé’ jẹ́ ọ̀rọ̀ àdánidá, kò sì dín ìtumọ̀ náà kù sí ọmọ ọwọ́ nìkan.
- source_word: ὑπὸ
  choice: lábẹ́
  rationale: Ó pa àwòrán ìṣàkóso àti ìtẹríba mọ́, ó sì bá lílo ‘lábẹ́’ ní àyíká ọ̀rọ̀ náà mu.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: àwọn ìpilẹ̀ṣẹ̀ ayé
  rationale: στοιχεῖα lè tọ́ka sí àwọn ìlànà tàbí ohun ìpilẹ̀ṣẹ̀, ó sì tún lè tọ́ka sí àwọn agbára ẹ̀mí inú ayé. ‘Àwọn ìpilẹ̀ṣẹ̀ ayé’ kò fi tipátipá yan ìtumọ̀ ẹ̀mí, ó sì fi àìdánilójú ọ̀rọ̀ náà sílẹ̀ fún àlàyé ìsàlẹ̀.
- source_word: ἤμεθα δεδουλωμένοι
  choice: a wà ní oko ẹrú
  rationale: Ó fi ipò ìdè àti ìṣàkóso líle tí passive Gíríìkì ń sọ hàn ní Yorùbá tí ó ṣe kedere, láìsọ ọ́ di ìtẹríba lasán.
theological_decisions:
- issue: Ìtumọ̀ τὰ στοιχεῖα τοῦ κόσμου
  choice: ‘àwọn ìpilẹ̀ṣẹ̀ ayé’ nínú ọ̀rọ̀ pàtàkì
  alternative: ‘àwọn ẹ̀mí agbára ayé’ tàbí ‘àwọn ohun ìpilẹ̀ṣẹ̀ inú ayé’
  rationale: 'Ọ̀rọ̀ Gíríìkì náà ní àríyànjiyàn: ó lè jẹ́ àwọn ìlànà tàbí ohun ìpilẹ̀ṣẹ̀, tàbí àwọn agbára ẹ̀mí inú àgbáyé. Àyíká ọ̀rọ̀ nípa ọmọ tí kò tíì dàgbà lábẹ́ alábojútó lè ṣe àtìlẹ́yìn fún ìtumọ̀ àkọ́kọ́, ṣùgbọ́n ẹsẹ̀ náà kò yọ ìtumọ̀ ẹ̀mí kúrò; nítorí náà, àlàyé ìsàlẹ̀ pa ìforígbárí náà mọ́.'
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé lasán. ‘Ní oko ẹrú’ pa agbára àwòrán ìdè mọ́; ‘àwọn ìpilẹ̀ṣẹ̀ ayé’ jẹ́ gbolohun ṣókí tí àlàyé ìsàlẹ̀ ń ṣàlàyé.
