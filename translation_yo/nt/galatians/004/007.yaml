  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: yo
  text: Nítorí náà, ìwọ kì í ṣe ẹrú mọ́, ṣùgbọ́n ọmọkùnrin ni[a]; bí o sì jẹ́ ọmọkùnrin, ajogún pẹ̀lú ni ọ nípasẹ̀ Ọlọ́run.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọmọ.” Ọ̀rọ̀ náà ní èdè Gíríìkì jẹ́ “ọmọkùnrin,” ó sì pa ìsopọ̀ pẹ̀lú ìsọdọmọ àti ẹ̀tọ́ sí ogún nínú àyíká ọ̀rọ̀ yìí mọ́, bí ó tilẹ̀ jẹ́ pé Paulu fi ipò yìí kan gbogbo onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Àwọn àfọwọ́kọ kan ní, “ajogún Ọlọ́run nípasẹ̀ Kristi” (tàbí “nípasẹ̀ Mèsáyà”), dípò “ajogún nípasẹ̀ Ọlọ́run.”
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi hàn pé gbólóhùn yìí jẹ́ àbájáde ìjiyàn tí ó ṣáájú.
- source_word: οὐκέτι εἶ δοῦλος
  choice: ìwọ kì í ṣe ẹrú mọ́
  rationale: ‘Mọ́’ ṣàfihàn ìyípadà ipò, ‘ẹrú’ sì pa agbára ìtumọ̀ ìdè tí δοῦλος ní mọ́.
- source_word: ἀλλὰ υἱός
  choice: bí kò ṣe ọmọkùnrin
  rationale: ‘Ọmọkùnrin’ tẹ̀ lé akọ ẹyọ υἱός, ó sì pa èrò ipò ọmọ tí ó ní ẹ̀tọ́ sí ogún mọ́; àlàyé ìfikún ṣàlàyé pé ipò náà kan gbogbo onígbàgbọ́.
- source_word: εἰ δὲ υἱός
  choice: bí o bá sì jẹ́ ọmọkùnrin
  rationale: Ó pa ìlọsíwájú ìjiyàn onípò náà mọ́ ní èdè Yorùbá àdánidá.
- source_word: καὶ κληρονόμος
  choice: ìwọ tún jẹ́ ajogún
  rationale: ‘Ajogún’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ẹni tí yóò gba ogún; ‘tún’ mú agbára καὶ jáde.
- source_word: διὰ θεοῦ
  choice: nípasẹ̀ Ọlọ́run
  rationale: Ó túmọ̀ ọ̀rọ̀ inú SBLGNT ní tààrà, láì fi ‘Kristi’ tàbí ‘Mèsáyà’ tí ó jẹ́ ti àwọn àfọwọ́kọ mìíràn kún un.
theological_decisions:
- issue: Èdè akọ ní υἱός àti bí ó ṣe kan gbogbo onígbàgbọ́
  choice: ọmọkùnrin
  alternative: ọmọ
  rationale: ‘Ọmọkùnrin’ pa èdè ìsọdọmọ àti ẹ̀tọ́ ogún inú ìjiyàn Paulu mọ́. Àlàyé ìfikún jẹ́ kó ṣe kedere pé ipò yìí kò mọ sí àwọn ọkùnrin nìkan.
- issue: Ìyàtọ̀ àfọwọ́kọ ní òpin ẹsẹ náà
  choice: nípasẹ̀ Ọlọ́run
  alternative: ajogún Ọlọ́run nípasẹ̀ Kristi (tàbí Mèsáyà)
  rationale: SBLGNT tí a fún wa ní διὰ θεοῦ; a tẹ̀ lé e nínú ọ̀rọ̀ pàtàkì, a sì tọ́ka sí ìyàtọ̀ àfọwọ́kọ nínú àlàyé ìfikún.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé yé ni a lò. A lo ‘ìwọ’ nítorí εἶ jẹ́ ẹni kejì ẹyọ, a sì yan ‘ẹrú’ dípò ọ̀rọ̀ tútù bí ‘ìránṣẹ́’ nítorí ìtakora láàárín ìdè àti ipò ọmọ-ajogún jẹ́ kókó nínú àyíká ọ̀rọ̀.
