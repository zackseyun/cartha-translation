id: GAL.4.21
reference: Galatians 4:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Λέγετέ μοι, οἱ ὑπὸ νόμον θέλοντες εἶναι, τὸν νόμον οὐκ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: yo
  text: 'Ẹ sọ fún mi, ẹ̀yin tí ẹ fẹ́ wà lábẹ́ òfin: ṣé ẹ kò gbọ́ ohun tí òfin náà ń sọ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “Ṣé ẹ kò fetí sí òfin náà?” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “gbọ́” tàbí “fetí sí.” Ó ṣeé ṣe kí “òfin” níbí tọ́ka sí Òfin Mósè, pàápàá jù lọ sí ìtàn inú Ìwé Mímọ́ tí Paulu tọ́ka sí lẹ́yìn èyí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: Ẹ sọ fún mi
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pe ọ̀pọ̀ ènìyàn níjà ní tààrà; ‘Ẹ sọ fún mi’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára àṣẹ náà mọ́.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: ẹ̀yin tí ẹ fẹ́ wà lábẹ́ òfin
  rationale: Ó pa àpèjúwe àwọn tí ìfẹ́ wọn ni láti wà ‘lábẹ́ òfin’ mọ́, bẹ́ẹ̀ ni ó tún pa àwòrán ipò tàbí àṣẹ tí ọ̀rọ̀ Gíríìkì náà ní mọ́.
- source_word: νόμον / τὸν νόμον
  choice: òfin / òfin náà
  rationale: Lílo gbólóhùn kan náà pa eré-ọ̀rọ̀ Paulu mọ́ láàárín wíwà lábẹ́ òfin àti gbígbọ́ ohun tí òfin náà sọ; ‘náà’ ní ìṣẹ̀lẹ̀ kejì bá akọ́tọ̀ pàtó τὸν mu.
- source_word: οὐκ ἀκούετε
  choice: ṣé ẹ kò gbọ́ ohun tí ... ń sọ?
  rationale: ἀκούω lè túmọ̀ sí gbígbọ́ lásán tàbí fífetí sí. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì lè gba ìtumọ̀ méjèèjì—gbígbọ́ àti kíka/fífetí sí ẹ̀rí Ìwé Mímọ́—láì fi ọ̀kan múlẹ̀ pátápátá.
theological_decisions:
- issue: Ohun tí ‘òfin’ ń tọ́ka sí
  choice: A lo ‘òfin’ ní ìṣẹ̀lẹ̀ méjèèjì, tí àyíká sì jẹ́ kí ó tọ́ka sí Òfin Mósè àti ìtàn Ìwé Mímọ́ tí Paulu yóò fa yọ.
  alternative: Láti ṣe àlàyé ní tààrà pé ‘Òfin Mósè’ tàbí ‘àwọn ìwé Òfin’.
  rationale: Paulu ń lo νόμος fún ipò májẹ̀mú tí àwọn kan fẹ́ wà lábẹ́ rẹ̀ àti fún ọ̀rọ̀ Ìwé Mímọ́ tí ó yẹ kí wọ́n gbọ́. ‘Òfin’ pa ìfọ̀rọ̀wérọ̀ àti ẹdọfu méjèèjì mọ́ láì dín ìtumọ̀ rẹ̀ kù.
- issue: Ìtumọ̀ ἀκούετε gẹ́gẹ́ bí ‘gbọ́’ tàbí ‘fetí sí’
  choice: A lo ‘gbọ́ ohun tí òfin náà ń sọ’ nínú ẹsẹ̀, a sì ṣàlàyé ‘fetí sí’ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
  alternative: ‘Ṣé ẹ kò fetí sí òfin náà?’
  rationale: Ọ̀rọ̀ Gíríìkì gba ìtumọ̀ méjèèjì. Àtúmọ̀ inú ẹsẹ̀ jẹ́ Yorùbá àdánidá, ó sì bá ọ̀rọ̀ ìjiyàn tó tẹ̀ lé e mu; àlàyé ìsàlẹ̀ pa àìdánilójú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́wọ̀, tààrà, tó sì ṣeé lóye. ‘Ẹ̀yin’ àti fọ́ọ̀mù ọ̀pọ̀ ‘ẹ’ ń fi hàn pé Paulu ń bá ẹgbẹ́ kan sọ̀rọ̀; àmì àdádúró lẹ́yìn ‘òfin’ mú ìbéèrè ìjàkadì tó tẹ̀ lé e hàn kedere.
