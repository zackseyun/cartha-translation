id: GAL.4.5
reference: Galatians 4:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: yo
  text: láti lè rà àwọn tí ó wà lábẹ́ Òfin padà, kí a lè gba ìgbàṣọmọ sí ipò ọmọkùnrin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìgbàṣọmọ” lásán. Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìgbàṣọmọ sí ipò ọmọkùnrin, ó sì tẹnumọ́ ipò ọmọ ní kíkún àti ẹ̀tọ́ ogún; ó kan gbogbo àwọn onígbàgbọ́, ọkùnrin àti obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: láti lè …; kí … lè
  rationale: Àwọn ọ̀rọ̀ méjèèjì fi ète hàn. Àyípadà kékeré yìí jẹ́ kí Yorùbá ṣàn dáadáa láìsọ agbára ète náà nù.
- source_word: τοὺς ὑπὸ νόμον
  choice: àwọn tí ó wà lábẹ́ Òfin
  rationale: Ó pa àwòrán jíjẹ́ lábẹ́ àṣẹ mọ́, Òfin sì tọ́ka sí Òfin Mósè gẹ́gẹ́ bí àyíká ọ̀rọ̀ Gálátíà ṣe fi hàn.
- source_word: ἐξαγοράσῃ
  choice: ra … padà
  rationale: Ó mú ìtumọ̀ ìràpadà tí ó ní àwòrán rírà àti dídá ẹni sílẹ̀ jáde ní èdè Yorùbá tí ó ṣe déédé.
- source_word: τὴν υἱοθεσίαν
  choice: ìgbàṣọmọ bí ọmọkùnrin
  rationale: Ìgbàṣọmọ jẹ́ ọ̀rọ̀ àárín gbùngbùn; ‘bí ọmọkùnrin’ sì pa agbára υἱοθεσία mọ́ nípa ipò ọmọ àti ẹ̀tọ́ ogún, láìfi àwọn obìnrin onígbàgbọ́ sílẹ̀.
- source_word: ἀπολάβωμεν
  choice: àwa lè gba
  rationale: ‘Gba’ jẹ́ ìtumọ̀ àdánidá fún gbígba ipò tí a fi fúnni; fífi ‘àwa’ hàn tún pa ìtẹnumọ́ arọ́pò-orúkọ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ υἱοθεσία àti ọ̀rọ̀ akọ
  choice: ìgbàṣọmọ bí ọmọkùnrin
  alternative: ìgbàṣọmọ; ipò ọmọ
  rationale: Ọ̀rọ̀ náà ní àyíká Páùlù ń tẹnumọ́ ipò ọmọ tí ó ní ẹ̀tọ́ ogún. Àlàyé ìsàlẹ̀ fi hàn pé ipò yìí kan gbogbo onígbàgbọ́, ọkùnrin àti obìnrin.
- issue: Àwọn tí ó wà lábẹ́ Òfin
  choice: Ó tọ́ka ní pàtàkì sí àwọn tí ó wà lábẹ́ Òfin Mósè
  alternative: Gbogbo àwọn tí ó wà lábẹ́ òfin ní ìtumọ̀ gbogbogbò
  rationale: Àyíká Gálátíà 4:4–5 àti lílo νόμος nínú lẹ́tà náà ṣètìlẹ́yìn fún Òfin Mósè, bí ó tilẹ̀ jẹ́ pé àbájáde ìgbàṣọmọ náà dé ọ̀dọ̀ gbogbo àwọn onígbàgbọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘Òfin’ gẹ́gẹ́ bí orúkọ pàtó fún Òfin Mósè, a sì pa ìtẹnumọ́ ipò ọmọ àti ogún mọ́ pẹ̀lú àlàyé tí kò yọ àwọn obìnrin kúrò.
