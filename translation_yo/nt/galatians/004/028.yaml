  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin, ará[a], gẹ́gẹ́ bí Isaaki, jẹ́ ọmọ ìlérí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a tú sí “ará” wà ní ọ̀pọ̀ akọ, ṣùgbọ́n nínú irú ìpè yìí ó sábà máa ń tọ́ka sí gbogbo ìjọ, títí kan àwọn ọkùnrin àti obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: ẹ̀yin
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì ọ̀pọ̀ ni, tí a sì fi hàn ní kedere fún ìtẹnumọ́ gẹ́gẹ́ bí Gíríìkì.
- source_word: δέ
  choice: ṣùgbọ́n
  rationale: Ó ń fi ìyàtọ̀ oníwọ̀ntúnwọ̀nsì hàn láàárín àwọn tí ẹsẹ yìí ń bá sọ̀rọ̀ àti ọmọ ẹrú tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ní àyíká ọ̀rọ̀; ‘ṣùgbọ́n’ jẹ́ ìsopọ̀ àdánidá ní Yorùbá.
- source_word: ἀδελφοί
  choice: ará
  rationale: Nígbà tí Gíríìkì lo ọ̀pọ̀ akọ, ‘ará’ jẹ́ ọ̀rọ̀ ìpè Yorùbá tó bójú mu fún àwọn ọmọ ìjọ lápapọ̀, láìfi akọ tàbí abo kún ohun tí ọ̀rọ̀ náà ń ṣe nínú àyíká yìí.
- source_word: κατὰ Ἰσαὰκ
  choice: bí Isaaki
  rationale: κατά níbí ń tọ́ka sí ìbámu tàbí àpẹẹrẹ; ‘bí Isaaki’ sọ ìfiwéra náà ní Yorùbá àdánidá.
- source_word: ἐπαγγελίας
  choice: ìlérí
  rationale: A pa gbólóhùn Pọ́ọ̀lù ‘ọmọ ìlérí’ mọ́, èyí tó lè túmọ̀ sí ọmọ tí ìlérí mú wá tàbí ẹni tó jẹ́ ti ìlérí.
- source_word: τέκνα
  choice: ọmọ
  rationale: ‘Ọmọ’ kò fi akọ tàbí abo hàn, ó sì lè dúró fún ọ̀pọ̀ lẹ́yìn ‘ẹ̀yin ... jẹ́’ ní Yorùbá.
- source_word: ἐστέ
  choice: jẹ́
  rationale: Ó túmọ̀ ọ̀rọ̀-ìṣe ẹni kejì ọ̀pọ̀ ‘ẹ jẹ́’ ní ìṣètò gbólóhùn Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Ìdámọ̀ àwọn onígbàgbọ́ pẹ̀lú Isaaki nínú àríyànjiyàn Pọ́ọ̀lù
  choice: “bí Isaaki, jẹ́ ọmọ ìlérí”
  alternative: “jẹ́ àwọn ọmọ tí a ṣèlérí, bí Isaaki”
  rationale: Yíyan yìí pa Isaaki mọ́ gẹ́gẹ́ bí àpẹẹrẹ, ó sì pa ‘ọmọ ìlérí’ mọ́ gẹ́gẹ́ bí àpèjúwe àwọn tí Pọ́ọ̀lù ń bá sọ̀rọ̀, láìmú ìtumọ̀ ẹ̀kọ́ kan lágbára ju Gíríìkì lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ‘ará’ gẹ́gẹ́ bí ìpè ìjọ tó jẹ́ àdánidá, a sì fi àmì ẹsẹ̀ [a] sí i. Orúkọ ‘Isaaki’ tẹ̀ lé ìlò Yorùbá tí ó wọ́pọ̀.
