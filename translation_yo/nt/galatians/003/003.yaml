source:
  edition: SBLGNT
  text: οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: yo
  text: Ṣé aláìlóye tó bẹ́ẹ̀ ni ẹ? Nígbà tí ẹ ti bẹ̀rẹ̀ nípasẹ̀ Ẹ̀mí[a], ṣé ní báyìí a ń mú yín dé ìmúṣẹ[c] nípasẹ̀ ẹran ara[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Ẹ̀mí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ ìsapá ènìyàn”; ó tún lè túmọ̀ sí “nípasẹ̀ ìwà ẹ̀ṣẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “a ń mú yín dé òpin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: tó bẹ́ẹ̀
  rationale: Ó fi ìwọ̀n àìlóye wọn hàn nínú ìbéèrè àtakò náà, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἀνόητοί
  choice: aláìlóye
  rationale: Ó túmọ̀ sí ẹni tí kò fi òye tàbí ìfòyemọ̀ ṣe ohun; kò le tó ọ̀rọ̀ ẹ̀gàn bí ‘òmùgọ̀.’
- source_word: ἐναρξάμενοι
  choice: lẹ́yìn tí ẹ ti bẹ̀rẹ̀
  rationale: Ó ṣe àfihàn pé ìbẹ̀rẹ̀ náà ti ṣẹlẹ̀ ṣáájú ohun tí wọ́n ń ṣe ní báyìí.
- source_word: πνεύματι
  choice: nípasẹ̀ Ẹ̀mí
  rationale: Dátífù náà ṣeé lóye gẹ́gẹ́ bí ọ̀nà tàbí agbára tí wọ́n fi bẹ̀rẹ̀; àyíká Gálátíà 3 ń tọ́ka sí Ẹ̀mí Mímọ́.
- source_word: νῦν
  choice: ní báyìí
  rationale: Ó pa ìyàtọ̀ àkókò mọ́ láàárín bí wọ́n ti bẹ̀rẹ̀ àti ohun tí wọ́n ń ṣe báyìí.
- source_word: σαρκὶ
  choice: nípa ti ara
  rationale: Ó pa àwòrán àti ìṣòro ìtumọ̀ ọ̀rọ̀ Páùlù mọ́, láì dín in kù sí ìsapá ènìyàn tàbí ẹ̀dá ẹlẹ́ṣẹ̀ nìkan.
- source_word: ἐπιτελεῖσθε
  choice: a ń mú yín dé ìpé
  rationale: Ìtumọ̀ aláìṣe taara yìí fi hàn pé a ń mú iṣẹ́ tí ó bẹ̀rẹ̀ tẹ́lẹ̀ dé òpin tàbí ìpé, ó sì bá ìṣe tí ń lọ lọ́wọ́ mu.
theological_decisions:
- issue: Ẹni tí πνεύματι ń tọ́ka sí
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí ìlànà ti ẹ̀mí
  rationale: Àyíká lẹ́sẹ̀kẹsẹ̀ sọ nípa gbígba Ẹ̀mí àti iṣẹ́ agbára Ọlọ́run, nítorí náà Ẹ̀mí Mímọ́ ni ìtumọ̀ tó lágbára jù.
- issue: Ìtumọ̀ σάρξ ní ìyàtọ̀ sí Ẹ̀mí
  choice: ara
  alternative: ìsapá ènìyàn tàbí ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: ‘Ara’ pa èdè Páùlù àti ìtumọ̀ rẹ̀ tó lè ní ẹ̀ka púpọ̀ mọ́; àlàyé ìsàlẹ̀ ni ó ṣàfihàn àwọn ìtumọ̀ míì láì yanju ìṣòro náà ní ìkọ̀kọ̀.
- issue: Ohun tí ἐπιτελεῖσθε túmọ̀ sí
  choice: a ń mú yín dé ìpé
  alternative: a ń mú yín dé òpin
  rationale: Ìtumọ̀ yìí pa èrò ìlọsíwájú sí ìpé mọ́, ṣùgbọ́n ó tún jẹ́ kí ìtumọ̀ ‘parí’ hàn nínú àlàyé.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Ìbéèrè méjèèjì pa ohùn ìbáwí Páùlù mọ́, ‘ara’ sì pa ìdààmú ìtumọ̀ ọ̀rọ̀ náà mọ́.
