  to: Ṣé aláìlóye tó bẹ́ẹ̀ ni ẹ? Nígbà tí ẹ ti bẹ̀rẹ̀ nípasẹ̀ Ẹ̀mí[a], ṣé ní báyìí a ń mú yín dé ìmúṣẹ[c] nípasẹ̀ ẹran ara[b]?
