id: GAL.3.23
reference: Galatians 3:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: yo
  text: Ṣùgbọ́n kí ìgbàgbọ́ tó dé, a ń ṣọ́ wa lábẹ́ òfin, a sì há wa mọ́ títí di ìgbàgbọ́ tí a máa ṣí payá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: kí ... tó dé
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìgbà tó ṣáájú ìṣẹ̀lẹ̀ kan, ó sì pa agbára gbólóhùn Gíríìkì mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ hàn sí ohun tí a sọ ṣáájú.
- source_word: τὴν πίστιν
  choice: ìgbàgbọ́
  rationale: Ìgbàgbọ́ ni ìtumọ̀ tó bá ọ̀rọ̀ inú Galatia 3 mu jù; a kò fi àlàyé kun un tí yóò pinnu bóyá ó túmọ̀ sí ìgbàgbọ́ ẹni kọ̀ọ̀kan tàbí sáà tuntun tó bẹ̀rẹ̀ nípasẹ̀ Kristi.
- source_word: ὑπὸ νόμον
  choice: lábẹ́ òfin
  rationale: Ó fi jíjẹ́ lábẹ́ àṣẹ tàbí ìṣàkóso Òfin hàn ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἐφρουρούμεθα
  choice: a ń ṣọ́ wa
  rationale: Fọ́ọ̀mù aláìpé àti àfiyèṣe Gíríìkì fi iṣẹ́ tó ń lọ ní àkókò àtijọ́ hàn; ọ̀rọ̀ yìí tún pa ìtumọ̀ ìṣọ́ mọ́ láìsọ ọ́ di ohun rere tàbí búburú pátápátá.
- source_word: συγκλειόμενοι
  choice: a sì há wa mọ́
  rationale: Ó sọ ìhámọ́ tàbí títìmọ́ hàn ní èdè Yorùbá àdánidá, ó sì pa agbára ìdènà inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: εἰς
  choice: títí di
  rationale: Nínú àyíká yìí, ó tọ́ka sí ààlà àkókò tó lọ síhà ìṣípayá ìgbàgbọ́ tó ń bọ̀.
- source_word: τὴν μέλλουσαν πίστιν
  choice: ìgbàgbọ́ tí a fẹ́ ṣí payá
  rationale: Ó pa ìfojúsọ́nà ọjọ́ iwájú inú μέλλουσαν mọ́, ó sì tún lo ìgbàgbọ́ ní ìṣọ̀kan pẹ̀lú ìfarahàn rẹ̀ àkọ́kọ́.
- source_word: ἀποκαλυφθῆναι
  choice: ṣí payá
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì bójú mu fún ohun tí a fi hàn tàbí ṣí payá.
theological_decisions:
- issue: Bóyá πίστις túmọ̀ sí ìgbàgbọ́ ẹni kọ̀ọ̀kan tàbí òtítọ́ ìgbàlà tó dé pẹ̀lú Kristi
  choice: ìgbàgbọ́
  alternative: ẹ̀sìn ìgbàgbọ́; ìṣòtítọ́
  rationale: Àyíká fi ìyàtọ̀ sáà ṣáájú àti lẹ́yìn dídé Kristi hàn, ṣùgbọ́n “ìgbàgbọ́” jẹ́ kí ìtumọ̀ ẹni kọ̀ọ̀kan àti ti sáà ìgbàlà dúró láìfi tipátipá yan ọ̀kan.
- issue: Bóyá ἐφρουρούμεθα ní ìtumọ̀ rere ti ààbò tàbí ìtumọ̀ ìhámọ́ ẹlẹ́wọ̀n
  choice: a ń ṣọ́ wa
  alternative: a wà ní àhámọ́
  rationale: Ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú ìṣọ́/ìtọ́jú mọ́, nígbà tí participle tó tẹ̀ lé e mú ìhámọ́ rẹ̀ hàn kedere.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ jẹ́ ti òde òní, ọ̀wọ̀, ó sì rọrùn fún òǹkàwé lasan. A lo “a” gẹ́gẹ́ bí àròpò-orúkọ àpapọ̀ tó bá “we” mu.
