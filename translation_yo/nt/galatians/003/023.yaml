review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìṣètò àti àwọn èrò pàtàkì Gíríìkì náà dáadáa: àkókò ṣáájú dídé ìgbàgbọ́, jíjẹ́ lábẹ́ òfin, ìṣọ́ tí ó ń tẹ̀síwájú, ìhámọ́, àti ìfojúsọ́nà sí ìṣípayá ìgbàgbọ́. Ṣùgbọ́n “tí a fẹ́ ṣí payá” túmọ̀ sí ‘tí a fẹ́ láti ṣí payá’ (‘which we want to reveal’), kì í sì ṣe aorist passive infinitive ἀποκαλυφθῆναι pọ̀ mọ́ μέλλουσαν.'
  naturalness: Gbólóhùn náà rọrùn láti ka, ìlò “kí ... tó dé” àti “títí di” sì jẹ́ Yorùbá boṣewa. “Tí a máa ṣí payá” jẹ́ ìlò àìlórúkọ ẹni-ṣe tó dára ní Yorùbá fún ohun tí a ó ṣí payá, ó sì yẹra fún ìtumọ̀ ‘fẹ́’ gẹ́gẹ́ bí ìfẹ́ ẹni.
  terminology: “Ìgbàgbọ́,” “lábẹ́ òfin,” “ṣọ́,” àti “há ... mọ́” pa ìbáṣepọ̀ ọ̀rọ̀ náà mọ́. A kò yẹ kí a fi “ẹ̀sìn” tàbí ìtumọ̀ ẹ̀kọ́ ìjọsìn míràn rọ́pò ìgbàgbọ́, nítorí ọ̀rọ̀ Gíríìkì náà ṣì ní àìdánilójú tí ìtumọ̀ náà gbọ́dọ̀ dá sílẹ̀.
  issues:
