id: GAL.3.12
reference: Galatians 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλ’· Ὁ ποιήσας ⸀αὐτὰ ζήσεται ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: yo
  text: Ṣùgbọ́n òfin kì í ṣe láti inú ìgbàgbọ́; ṣùgbọ́n, “Ẹni tí ó bá ṣe àwọn nǹkan wọ̀nyẹn yóò yè nípa wọn.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò yè nínú wọn.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí jẹ́ àyọlò láti inú Lefitíkù 18:5.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: òfin
  rationale: “Òfin” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún νόμος; kò fi ìtumọ̀ ẹ̀kọ́ kan kún un, ó sì jẹ́ kí àyíká ọ̀rọ̀ fi hàn pé Òfin Mósè wà ní ojú ìwòye.
- source_word: ἐκ πίστεως
  choice: láti inú ìgbàgbọ́
  rationale: Ó tẹ̀ lé àwòrán orísun tàbí ìpìlẹ̀ inú ἐκ, ó sì pa ìtakora Páùlù láàárín òfin àti ìgbàgbọ́ mọ́ láì túmọ̀ rẹ̀ kọjá ohun tí Gíríìkì sọ.
- source_word: ἀλλ’
  choice: dípò bẹ́ẹ̀
  rationale: Ó mú ìtakora tó lágbára hàn, ó sì ṣí ọ̀nà fún ọ̀rọ̀ Ìwé Mímọ́ tí ó tẹ̀ lé.
- source_word: ὁ ποιήσας αὐτά
  choice: Ẹni tí ó bá ṣe àwọn nǹkan wọ̀nyẹn
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá fún ẹni àpapọ̀ tí participle Gíríìkì ń tọ́ka sí; “àwọn nǹkan wọ̀nyẹn” pa ohun tí αὐτά ń tọ́ka sí mọ́ láì ṣàlàyé rẹ̀ ju ẹsẹ̀ náà lọ.
- source_word: ζήσεται
  choice: yóò yè
  rationale: “Yóò yè” fi ọjọ́ iwájú hàn ní èdè Yorùbá tó ṣe kedere, ó sì lè gbé ìtumọ̀ ìyè tí ọ̀rọ̀ Gíríìkì ní nínú àyíká yìí.
- source_word: ἐν αὐτοῖς
  choice: nípa wọn
  rationale: Nínú àyọlò Lefitíkù yìí, “nípa wọn” sọ ọ̀nà tàbí ìpìlẹ̀ ìyè di Yorùbá tó ṣe kedere; ìtumọ̀ gígùn sí i, “nínú wọn,” wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtakora Páùlù láàárín òfin àti ìgbàgbọ́
  choice: “òfin kì í ṣe láti inú ìgbàgbọ́”
  alternative: “òfin kò dá lórí ìgbàgbọ́” tàbí “òfin kì í ṣiṣẹ́ ní ìlànà ìgbàgbọ́”
  rationale: Àṣàyàn náà dúró sítòsí Gíríìkì, ó sì pa ìdààmú ẹ̀kọ́ inú ọ̀rọ̀ náà mọ́ láì fi àlàyé ẹ̀sìn kan sínú ìtumọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. “Kì í ṣe” àti “ẹni tí ó bá ṣe” mú gbólóhùn náà jẹ́ àdánidá fún olùkà Yorùbá, nígbà tí “láti inú ìgbàgbọ́” pa ìṣètò àti àìdánilójú Gíríìkì mọ́.
