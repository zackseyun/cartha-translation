id: GAL.3.11
reference: Galatians 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: yo
  text: 'Ó hàn gbangba pé kò sí ẹnikẹ́ni tí a dá láre níwájú Ọlọ́run nípasẹ̀ òfin[b], nítorí pé: “Olódodo yóò yè nípa ìgbàgbọ́.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Olódodo yóò yè nípa ìfẹ́ṣinṣin.”
    reason: lexical_alternative
  - marker: b
    text: Páùlù ń fa ọ̀rọ̀ yọ láti inú Hábákúkù 2:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι δὲ
  choice: Ó hàn gbangba pé
  rationale: A kò fi ọ̀rọ̀ àkókò bí ‘nísinsin yìí’ kún un; agbára ìyípadà kékeré tí δὲ ní nínú ìjiyàn náà wà nínú bí gbólóhùn Yorùbá ṣe ń tẹ̀ síwájú.
- source_word: ἐν νόμῳ
  choice: nípasẹ̀ òfin
  rationale: Ní àyíká ìdájọ́ yìí, ἐν ń tọ́ka sí ohun èlò tàbí ọ̀nà; ‘nípasẹ̀ òfin’ jẹ́ kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: οὐδεὶς
  choice: kò sí ẹnikẹ́ni
  rationale: Èyí pa ìkọ̀ pátápátá àti ìtumọ̀ gbogbo ènìyàn mọ́.
- source_word: δικαιοῦται
  choice: tí a ń dá láre
  rationale: Ìṣẹ̀dá aláìlórúkọ yìí mú ohùn àìṣe ti Gíríìkì jáde, ó sì pa ìtumọ̀ ìdájọ́—pé a kéde ẹni kan ní olódodo—mọ́.
- source_word: παρὰ τῷ θεῷ
  choice: níwájú Ọlọ́run
  rationale: Ó tọ́ka sí ipò ẹni ní ojú ìdájọ́ Ọlọ́run, láìfi àlàyé ẹ̀kọ́ ìsìn kún ọ̀rọ̀ náà.
- source_word: δῆλον
  choice: Ó hàn gbangba
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan ṣe kedere nínú ìjiyàn.
- source_word: Ὁ δίκαιος
  choice: Olódodo
  rationale: Ọ̀rọ̀ orúkọ-ajẹ́pè tí a lò gẹ́gẹ́ bí orúkọ ni Gíríìkì; ‘Olódodo’ mú irú ìtumọ̀ yẹn jáde ní ṣókí.
- source_word: ἐκ πίστεως
  choice: nípa ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ tí ó bá àyíká Páùlù àti Gíríìkì mu; a pa ìtumọ̀ mìíràn, ‘ìṣòtítọ́,’ mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ζήσεται
  choice: yóò yè
  rationale: Ó mú ìṣe ọjọ́ iwájú jáde ní Yorùbá òde òní, láì pinnu láìnídí bóyá ìyè ti ara, ìgbàlà, tàbí ìyè ní ìtumọ̀ tó gbòòrò ni a ń sọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Ὁ δίκαιος ἐκ πίστεως ζήσεται
  choice: Olódodo yóò yè nípa ìgbàgbọ́
  alternative: Olódodo yóò yè nípa ìṣòtítọ́; tàbí, Ẹni tí ó jẹ́ olódodo nípa ìgbàgbọ́ yóò yè
  rationale: Ọ̀rọ̀ inú ìwé pa ìtẹ̀lé Gíríìkì àti kíkà tí ó wọ́pọ̀ jù mọ́, ṣùgbọ́n kò gbìyànjú láti mú gbogbo àìdánilójú nípa πίστις tàbí ohun tí ἐκ πίστεως so mọ́ kúrò. Àlàyé ìsàlẹ̀ pa àṣàyàn ‘ìṣòtítọ́’ mọ́.
translation_notes:
  register: A lo Yorùbá ìwọ̀nba, ọ̀wọ̀, àti ti òde òní pẹ̀lú àmì ohùn níbi tí ó ti yẹ. ‘Dá láre’ pa àwọ̀ ìdájọ́ ti ọ̀rọ̀ Páùlù mọ́; ‘yè’ sì ṣókí, ó sì yẹ fún gbólóhùn àyọlò.
