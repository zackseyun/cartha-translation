review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìṣètò àti ìtumọ̀ gbòòrò ẹsẹ̀ Gíríìkì náà mọ́: Ìwé Mímọ́ ni kókó-ọrọ̀, ‘ohun gbogbo’ ni τὰ πάντα, ‘lábẹ́ ẹ̀ṣẹ̀’ sì dá àwòrán ìṣàkóso ẹ̀ṣẹ̀ dúró. Síbẹ̀, ‘sé ... mọ́’ túmọ̀ συνέκλεισεν (‘sé sínú/di mọ́’) dára ju ‘fi ... sé’ lọ, nítorí ó mú ìdènà tàbí ìkápá náà hàn kedere. Àmì àlàyé fún πίστις Ἰησοῦ Χριστοῦ gbọ́dọ̀ sọ ‘ìdúróṣinṣin’ dípò ‘ìṣòtítọ́,’ nítorí èyí ló sún mọ́ ‘faithfulness’ julọ.'
  naturalness: ‘Ṣùgbọ́n Ìwé Mímọ́ ti sé ohun gbogbo mọ́ lábẹ́ ẹ̀ṣẹ̀’ jẹ́ Yorùbá boṣewa, ó sì jẹ́ àdánidá. Ìṣètò ‘kí a lè fi ìlérí náà fún...’ dára fún ète inú ἵνα àti passive δοθῇ, láì sọ ẹni tí ń fún ní pàtó.
  terminology: ‘Ìwé Mímọ́,’ ‘ẹ̀ṣẹ̀,’ ‘ìlérí,’ ‘ìgbàgbọ́,’ àti ‘Jésù Mèsáyà’ bá ìforúkọsílẹ̀ ìtumọ̀ náà mu. ‘Ìdúróṣinṣin Jésù Mèsáyà’ ni ọ̀rọ̀ tó péye fún ìtumọ̀ míràn subjective-genitive; ‘ìṣòtítọ́’ sábà máa ń tọ́ka sí truth/honesty tàbí righteousness, kì í ṣe faithfulness ní pàtó.
  issues:
  - severity: medium
    issue: Àlàyé ìsàlẹ̀ a lo “ìṣòtítọ́” fún ‘faithfulness.’
    rationale: ‘Ìṣòtítọ́’ kò ṣàfihàn ìtumọ̀ subjective-genitive náà dáadáa; ‘ìdúróṣinṣin’ ni ó túmọ̀ faithfulness ní ti ara ẹni dára jù.
  - severity: low
    issue: Ọ̀rọ̀ pàtàkì lo “ti fi ... sé” fún συνέκλεισεν, nígbà tí àlàyé b lo “sé mọ́.”
    rationale: Fífi ‘mọ́’ sínú ọ̀rọ̀ pàtàkì mú ìtumọ̀ ìsẹ́wọ̀n/ìkápá ti συνέκλεισεν hàn kedere, ó sì mú kí ìyàtọ̀ àlàyé náà jẹ́ ìyàtọ̀ gidi.
