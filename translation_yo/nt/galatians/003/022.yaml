  to: Ṣùgbọ́n Ìwé Mímọ́ ti sé ohun gbogbo mọ́ lábẹ́ ẹ̀ṣẹ̀[b], kí a lè fi ìlérí náà fún àwọn tí ó gbàgbọ́ nípa ìgbàgbọ́ nínú Jésù Mèsáyà.[a]
