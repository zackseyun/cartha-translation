id: GAL.3.22
reference: Galatians 3:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: yo
  text: Ṣùgbọ́n Ìwé Mímọ́ ti sé ohun gbogbo mọ́ lábẹ́ ẹ̀ṣẹ̀[b], kí a lè fi ìlérí náà fún àwọn tí ó gbàgbọ́ nípa ìgbàgbọ́ nínú Jésù Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípa ìdúróṣinṣin Jésù Mèsáyà.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ti fi ohun gbogbo sé lábẹ́ ẹ̀ṣẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: ti fi ... sé
  rationale: Ó mú àwòrán ohun tí a sé mọ́ abẹ́ ìkápá tàbí ìṣàkóso kan jáde ní Yorùbá àdánidá, láì sọ ọ́ di àlàyé gígùn.
- source_word: ἡ γραφή
  choice: Ìwé Mímọ́
  rationale: Èyí ni ọ̀nà Yorùbá tí ó wọ́pọ̀, tí ó sì ní iyì, fún Scripture gẹ́gẹ́ bí ẹ̀rí kan ṣoṣo tí a sọ di ẹni tí ń ṣe iṣẹ́.
- source_word: τὰ πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìtúmọ̀ ọ̀pọ̀-orúkọ aláìní akọ tàbí abo tí ó gbòòrò mọ́, láì dín un kù sí àwọn ènìyàn nìkan.
- source_word: ὑπὸ ἁμαρτίαν
  choice: abẹ́ ẹ̀ṣẹ̀
  rationale: Ó pa àwòrán Pọ́ọ̀lù nípa jíjẹ́ abẹ́ agbára tàbí ìkápá ẹ̀ṣẹ̀ mọ́, láì fi àlàyé ìtumọ̀ kún ọ̀rọ̀ pàtàkì.
- source_word: ἡ ἐπαγγελία
  choice: ìlérí náà
  rationale: Ó túmọ̀ orúkọ náà ní tààrà, ó sì pa atọ́ka pàtó inú èdè Gíríìkì mọ́.
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: nípa ìgbàgbọ́ nínú Jésù Mèsáyà
  rationale: Ọ̀rọ̀ pàtàkì tẹ̀lé ìtumọ̀ objective genitive tí ó wọ́pọ̀, ìyẹn ìgbàgbọ́ tí a ní nínú Jésù; àmọ́ a pa ìtumọ̀ subjective genitive mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός jẹ́ oyè tí ó tẹ̀ lé orúkọ Jésù; “Mèsáyà” mú iṣẹ́ oyè náà hàn kedere.
- source_word: δοθῇ
  choice: kí a lè fi ... fún
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá fún passive subjunctive lẹ́yìn ἵνα, ó sì fi ète hàn láì sọ ẹni tí ń fún ní pàtó.
- source_word: τοῖς πιστεύουσιν
  choice: àwọn tí ó gbàgbọ́
  rationale: Ó pa agbára participle náà mọ́ gẹ́gẹ́ bí ìṣe ìgbàgbọ́, dípò fífi orúkọ ẹgbẹ́ kan lásán sí i.
theological_decisions:
- issue: 'πίστεως Ἰησοῦ Χριστοῦ: irú genitive wo ni?'
  choice: Ìgbàgbọ́ nínú Jésù Mèsáyà (objective genitive)
  alternative: Ìṣòtítọ́ Jésù Mèsáyà (subjective genitive)
  rationale: Ìkọ̀lé náà ní àríyànjiyàn tòótọ́ nínú ẹ̀kọ́ Pọ́ọ̀lù. Ọ̀rọ̀ pàtàkì yan ìtumọ̀ objective genitive tí ó wọ́pọ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́ kí a má bà a yanjú àìdájú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye. A lo “fi ... sé” fún àwòrán ìkápá, a sì ṣètò gbólóhùn ète náà ní ọ̀nà Yorùbá àdánidá.
