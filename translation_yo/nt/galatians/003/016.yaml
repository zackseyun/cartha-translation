id: GAL.3.16
reference: Galatians 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: yo
  text: 'Àwọn ìlérí náà ni a sọ fún Abrahamu àti fún irú-ọmọ rẹ̀[a]. Kò sọ pé, “Àti fún àwọn irú-ọmọ[b],” gẹ́gẹ́ bí ẹni tí ó ń tọ́ka sí ọ̀pọ̀ ènìyàn, ṣùgbọ́n gẹ́gẹ́ bí ẹni tí ó ń tọ́ka sí ẹnì kan ṣoṣo: “Àti fún irú-ọmọ rẹ,” ẹni tí í ṣe Mèsáyà[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “irúgbìn” ní gbogbo ẹsẹ yìí; Gíríìkì lo ọ̀rọ̀ àkójọpọ̀ kan ní ẹyọ kan, èyí tí ó ṣe pàtàkì sí ìjiyàn Paulu.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “Àti fún àwọn irúgbìn”; Paulu ń tẹnu mọ́ pé ọ̀rọ̀ tí a lò wà ní ẹyọ kan, kì í ṣe ní ọ̀pọ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí “Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: ni a sọ
  rationale: Ọ̀nà àìdá-ẹni-mọ̀ yìí tú passive Gíríìkì náà sí Yorùbá àdánidá, ó sì pa èrò ọ̀rọ̀ sísọ mọ́.
- source_word: ἐπαγγελίαι
  choice: àwọn ìlérí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ìtumọ̀ ìlérí Ọlọ́run mu.
- source_word: σπέρμα / σπέρματι
  choice: irú-ọmọ
  rationale: “Irú-ọmọ” lè jẹ́ ọ̀rọ̀ àkójọpọ̀ ní ẹyọ kan, ó sì jẹ́ kí ìjiyàn Paulu lórí ẹyọ kan àti ọ̀pọ̀ hàn.
- source_word: τοῖς σπέρμασιν
  choice: àwọn irú-ọmọ
  rationale: Fífi “àwọn” kún un mú ọ̀pọ̀ Gíríìkì náà hàn gbangba, nítorí ìyàtọ̀ yìí ṣe pàtàkì sí ìjiyàn náà.
- source_word: ὡς ἐπὶ πολλῶν / ὡς ἐφ’ ἑνός
  choice: bí ẹni pé ó ń tọ́ka sí ọ̀pọ̀ ènìyàn / bí ẹni pé ó ń tọ́ka sí ẹnì kan ṣoṣo
  rationale: Ó sọ ìtumọ̀ àwọn gbólóhùn náà ní Yorùbá tó ṣe kedere, ó sì pa ìfarakanra wọn mọ́.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Ní ìdánimọ̀ yìí, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró; “Mèsáyà” mú ìtumọ̀ oyè náà hàn.
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú gbólóhùn ìdánimọ̀ Paulu
  choice: Mèsáyà
  alternative: Kristi
  rationale: “Mèsáyà” pa agbára oyè Χριστός mọ́ níbi tí Paulu ti ń dá irú-ọmọ tí a ṣèlérí mọ̀; “Kristi” jẹ́ àṣàyàn tí ó mọ́gbọ́n dání ṣùgbọ́n ó lè dun bí orúkọ lasan.
- issue: Ẹni tí “irú-ọmọ” ń tọ́ka sí
  choice: ẹni tí í ṣe Mèsáyà
  alternative: èyí tí í ṣe Mèsáyà
  rationale: “Ẹni” bá ìdánimọ̀ ara ẹni ὅς mu, láìsọ ìjiyàn Paulu di ohun míì ju bí orísun ṣe gbé e kalẹ̀ lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ; èdè náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo “Abrahamu” àti “Mèsáyà” gẹ́gẹ́ bí ìkọ̀wé Yorùbá tí ó wọ́pọ̀. Àwọn àmì àlàyé [a], [b], àti [c] wà nínú ọ̀rọ̀ gangan.
