  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì ẹsẹ náà dáadáa: a sọ àwọn ìlérí fún Abrahamu àti irú-ọmọ rẹ̀, Paulu sì fi ìyàtọ̀ ẹyọ/ọ̀pọ̀ hàn, ó sì dá irú-ọmọ náà mọ̀ gẹ́gẹ́ bí Mèsáyà. Ṣùgbọ́n “bí ẹni pé” tú ὡς di ìfihàn ìròyìn tàbí ìṣàpẹẹrẹ (“as if”), nígbà tí ọ̀rọ̀ Gíríìkì ń ṣàlàyé ìtọ́kasí gangan (“gẹ́gẹ́ bí ẹni tí ó ń tọ́ka sí”).'
