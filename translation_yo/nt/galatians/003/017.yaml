id: GAL.3.17
reference: Galatians 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: yo
  text: 'Èyí ni mo sọ: òfin náà, tí ó wá lẹ́yìn irinwó àti ọgbọ̀n ọdún, kò sọ májẹ̀mú tí Ọlọ́run ti fìdí rẹ̀ múlẹ̀ tẹ́lẹ̀ di asán[a], láti mú ìlérí náà di aláìní agbára[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kò fagilé májẹ̀mú náà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “sọ ìlérí náà di asán” tàbí “fi ìlérí náà sí ẹ̀gbẹ́ kan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: Èyí ni ohun tí mo ní lọ́kàn
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ohun tí Pọ́ọ̀lù fẹ́ ṣàlàyé hàn, láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: διαθήκην
  choice: májẹ̀mú
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí májẹ̀mú Ọlọ́run pẹ̀lú Ábúráhámù, kì í ṣe ìwé ogún.
- source_word: προκεκυρωμένην
  choice: tí ... ti fìdí rẹ̀ múlẹ̀ tẹ́lẹ̀
  rationale: Ó pa ìtumọ̀ ìgbésẹ̀ tí a ti fọwọ́ sí ṣáájú mọ́, ó sì mú agbára perfect participle náà hàn ní Yorùbá àdánidá.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: tí Ọlọ́run ...
  rationale: Ó sọ Ọlọ́run di olùṣe ìgbésẹ̀ náà ní kedere, láìfi ìtẹnumọ́ tí kò sí nínú orísun kún un.
- source_word: ὁ ... γεγονὼς νόμος
  choice: òfin náà, tí ó dé
  rationale: ‘Dé’ fi hàn pé òfin náà wọ inú ìtàn nígbà tí ó tẹ̀ lé e, ó sì jẹ́ èdè Yorùbá tí ó rọrùn.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: ní irinwo ó lé ọgbọ̀n ọdún lẹ́yìn náà
  rationale: Ó sọ àárín ọdún 430 náà ní kedere, ó sì pa ìtumọ̀ ohun tí ó dé lẹ́yìn mọ́.
- source_word: οὐκ ἀκυροῖ
  choice: kò sọ ... di asán
  rationale: Ó mú ìtumọ̀ òfin ti fífi ohun tí a ti fọwọ́ sí di aláìfẹsẹ̀mú hàn ní Yorùbá tí òǹkàwé òde òní lè lóye.
- source_word: εἰς τὸ καταργῆσαι
  choice: kí ó sì tipa bẹ́ẹ̀ sọ ... di aláìní agbára
  rationale: Ó gba ìbáṣepọ̀ ète/àbájáde inú gbolohun Gíríìkì náà láyè, ó sì fi agbára ọ̀rọ̀ καταργέω hàn gẹ́gẹ́ bí mímú ohun kan má ṣiṣẹ́ mọ́.
- source_word: τὴν ἐπαγγελίαν
  choice: ìlérí náà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó péye fún ìlérí Ọlọ́run sí Ábúráhámù nínú àyíká ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ διαθήκη nínú àríyànjiyàn Pọ́ọ̀lù
  choice: májẹ̀mú
  alternative: ìwé ogún tàbí ètò tí ó ní agbára òfin
  rationale: Àyíká ọ̀rọ̀ náà dá lórí ìlérí tí Ọlọ́run ti ṣe fún Ábúráhámù; ‘májẹ̀mú’ pa ìtàn ìgbàlà àti ìbáṣepọ̀ Ọlọ́run pẹ̀lú rẹ̀ mọ́ láìyanjú gbogbo ẹ̀dọ̀fu inú àpèjúwe òfin náà.
- issue: Agbára εἰς τὸ καταργῆσαι gẹ́gẹ́ bí ète tàbí àbájáde
  choice: kí ó sì tipa bẹ́ẹ̀
  alternative: débi tí yóò fi
  rationale: Àṣàyàn yìí kò fi dandan pinnu bóyá Pọ́ọ̀lù ń tẹnumọ́ ète tàbí àbájáde; ó so fífi májẹ̀mú di asán mọ́ mímú ìlérí di aláìní agbára.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn níbi tó yẹ, a sì pa àwòrán òfin inú ẹsẹ náà mọ́ láìjẹ́ kí gbolohun di líle tàbí àjèjì.
