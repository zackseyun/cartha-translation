  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì dáadáa ní gbogbogbòò: ó pa àpèjúwe ènìyàn, májẹ̀mú tí a ti fìdí múlẹ̀, àti èrò pé a kò le fagilé tàbí fi ìpèsè kún un mọ́. Síbẹ̀, “kò sí ẹni tí ó lè” lè gbé ìtumọ̀ láti ọ̀dọ̀ ìṣètò òfin/ìlànà gbogbogbòò sí ọ̀dọ̀ agbára ẹni; a ti ṣe é ní ọ̀nà tí ó sọ ìṣe tí Gíríìkì náà ń kéde kedere.'
  naturalness: “Ẹ̀yin ará” jẹ́ ìpè Yorùbá àdánidá. “Mo ń sọ̀rọ̀ gẹ́gẹ́ bí ọ̀nà ènìyàn” jẹ́ ìtumọ̀ ìgbàlódé tó rọrùn fún κατὰ ἄνθρωπον λέγω ju “ní ọ̀nà ti ènìyàn” lọ. A tún tún gbolohun àlàyé ìsàlẹ̀ (a) ṣe kí ó jẹ́ Yorùbá tó péye.
