id: GAL.3.15
reference: Galatians 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: yo
  text: 'Ẹ̀yin ará[a], mo ń sọ̀rọ̀ gẹ́gẹ́ bí ọ̀nà ènìyàn: àní, májẹ̀mú ènìyàn tí a ti fìdí rẹ̀ múlẹ̀, kò sí ẹni tí ń sọ ọ́ di asán tàbí tí ń fi ohunkóhun kún un.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ìtumọ̀ gígún, ọ̀rọ̀ Gíríìkì náà jẹ́ ‘ẹ̀yin arákùnrin’; ó ṣeé ṣe kí Pọ́ọ̀lù máa bá gbogbo àwọn onígbàgbọ́ ẹlẹgbẹ́ rẹ̀ sọ̀rọ̀, títí kan àwọn obìnrin.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ẹ̀yin ará
  rationale: Ọ̀rọ̀ ìpè yìí túmọ̀ sí àwọn arákùnrin ní ìtumọ̀ gígún, ṣùgbọ́n ‘ẹ̀yin ará’ jẹ́ ọ̀nà Yorùbá àdánidá láti bá àwọn onígbàgbọ́ ẹlẹgbẹ́ sọ̀rọ̀, ó sì lè kan ọkùnrin àti obìnrin láìpa ìtumọ̀ ẹgbẹ́ náà run.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: mo ń sọ̀rọ̀ ní ọ̀nà ti ènìyàn
  rationale: Èyí fi hàn pé Pọ́ọ̀lù ń lo àpẹẹrẹ láti inú ìgbésí ayé àti ìṣe ènìyàn; ó pa àwòrán Gíríìkì mọ́ ní èdè Yorùbá tó ṣeé lóye.
- source_word: ὅμως
  choice: àní
  rationale: '‘Àní’ ń fi agbára kún àpẹẹrẹ náà: kódà nínú ọ̀ràn májẹ̀mú ènìyàn, ìlànà yìí dúró.'
- source_word: ἀνθρώπου
  choice: tí ènìyàn kan
  rationale: Ó pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n ‘ènìyàn’ ní Yorùbá kò fi akọ tàbí abo pàtó sí i.
- source_word: κεκυρωμένην
  choice: ti fìdí rẹ̀ múlẹ̀
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí sọ pé a ti mú ohun náà dájú, ó sì ti ní agbára; ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìfọwọ́sí tí ó ti pé.
- source_word: διαθήκην
  choice: májẹ̀mú
  rationale: ‘Májẹ̀mú’ bá àyíká ọ̀rọ̀ nípa ìlérí Ọlọ́run fún Ábúráhámù mu, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí ìwé ìfẹ́ ẹni.
- source_word: ἀθετεῖ
  choice: sọ ọ́ di asán
  rationale: Èyí mú ìtumọ̀ fífi ohun tí a ti fìdí múlẹ̀ sílẹ̀ tàbí sọ ọ́ di aláìní agbára jáde ní Yorùbá kedere.
- source_word: ἐπιδιατάσσεται
  choice: fi ohunkóhun kún un
  rationale: Ó ṣàfihàn fífi àfikún tàbí ìpèsè míì sí májẹ̀mú tí a ti fìdí rẹ̀ múlẹ̀.
theological_decisions:
- issue: Bóyá διαθήκη yẹ kí ó jẹ́ ‘májẹ̀mú’ tàbí ‘ìwé ìfẹ́ ẹni’
  choice: májẹ̀mú
  alternative: ìwé ìfẹ́ ẹni / ìwé ogún
  rationale: Àyíká Gálátíà 3 dá lórí ìlérí àti májẹ̀mú Ọlọ́run pẹ̀lú Ábúráhámù. Síbẹ̀, ìtumọ̀ òfin bí ‘ìwé ìfẹ́ ẹni’ jẹ́ ojúlówó àṣàyàn, nítorí náà a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. ‘Ẹ̀yin ará’ jẹ́ ọ̀nà ìpè àdánidá, ‘fìdí rẹ̀ múlẹ̀’ sì mú èrò ìfọwọ́sí òfin jáde láìsọ èdè náà di líle jù.
