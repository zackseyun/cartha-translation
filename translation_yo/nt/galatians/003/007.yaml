  source_fidelity: 'Ìbẹ̀rẹ̀ àti ìtẹnumọ́ gbólóhùn náà wà ní ìbámu pẹ̀lú Gíríìkì: Γινώσκετε ἄρα jẹ́ “Nítorí náà, ẹ mọ̀,” àti οὗτοι ń béèrè fún ìtẹnumọ́ tí “àwọn wọ̀nyí” ń mú. Ṣùgbọ́n “àwọn tí ó gbẹ́kẹ̀ lé ìgbàgbọ́” lè túmọ̀ sí àwọn tí wọ́n gbára lé ìgbàgbọ́ gẹ́gẹ́ bí ohun kan, nígbà tí οἱ ἐκ πίστεως ń fi ẹgbẹ́ àwọn ẹni tí a dá mọ́ ìgbàgbọ́ hàn. “Àwọn tí í ṣe ti ìgbàgbọ́” pa ìfarahàn Gíríìkì náà mọ́ dáadáa.'
  naturalness: “Àwọn tí í ṣe ti ìgbàgbọ́” jẹ́ èdè Yorùbá boṣewa tí ó dára fún ìforúkọsílẹ̀ Bíbélì, ó sì ṣàfihàn ìtumọ̀ náà láìfikún ìṣe tàbí àlàyé. “Àwọn ọmọ Abrahamu” jẹ́ kedere ju “ọmọ Abrahamu” lọ nínú àyíká ọ̀pọ̀ ẹni, bí ó tilẹ̀ jẹ́ pé “ọmọ” lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ àpapọ̀.
