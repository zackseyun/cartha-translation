  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: yo
  text: Nítorí náà, ẹ mọ̀ pé àwọn tí í ṣe ti ìgbàgbọ́—àwọn wọ̀nyí ni àwọn ọmọ Abrahamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: ẹ mọ̀
  rationale: Ọ̀rọ̀ Gíríìkì yìí lè jẹ́ àṣẹ, ‘Ẹ mọ̀,’ tàbí ìfihàn, ‘Ẹ mọ̀.’ Àkópọ̀ ọ̀rọ̀ náà kò yanjú ìyàtọ̀ náà pátápátá; èdè Yorùbá yìí sì lè gbé méjèèjì.
- source_word: ἄρα
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò tí Pọ́ọ̀lù mú jáde láti inú ẹsẹ tó ṣáájú hàn.
- source_word: οἱ ἐκ πίστεως
  choice: àwọn tí ó gbẹ́kẹ̀ lé ìgbàgbọ́
  rationale: Gbólóhùn ‘àwọn tí ó wá láti inú ìgbàgbọ́’ kì í ṣe Yorùbá àdánidá. Yíyan yìí sọ ìtumọ̀ ẹgbẹ́ àwọn tí ìgbésí ayé wọn dúró lórí ìgbàgbọ́, láìfi ‘iṣẹ́’ tàbí ẹ̀kọ́ ẹ̀sìn míì kún un.
- source_word: οὗτοι
  choice: àwọn wọ̀nyí
  rationale: 'A pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì mọ́: àwọn ènìyàn wọ̀nyí gan-an ni a ń sọ̀rọ̀ nípa wọn.'
- source_word: υἱοί ... Ἀβραάμ
  choice: ọmọ Abrahamu
  rationale: Nínú Yorùbá, ‘ọmọ’ kò ní láti gba àmì ọ̀pọ̀ lẹ́yìn ‘àwọn wọ̀nyí’; ó tún lè tọ́ka sí ọmọ tàbí àtọmọdọ́mọ. Èyí pa àwòrán ìbátan ìdílé mọ́ láìdín un sí akọ nìkan.
theological_decisions:
- issue: Ìtumọ̀ àwọn tí a pè ní ọmọ Abrahamu
  choice: A sọ pé àwọn tí ó gbẹ́kẹ̀ lé ìgbàgbọ́ ni ọmọ Abrahamu.
  alternative: A lè sọ ‘àwọn onígbàgbọ́ ni àtọmọdọ́mọ Abrahamu.’
  rationale: ‘Ọmọ Abrahamu’ pa àwòrán àti ìtẹnumọ́ υἱοί mọ́, kò sì ṣàlàyé irú ìbátan náà ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, tó níyì, tó sì ṣeé lóye. Àmì gígùn lẹ́yìn ‘àwọn tí ó gbẹ́kẹ̀ lé ìgbàgbọ́’ ń pa ìtẹnumọ́ οὗτοι mọ́. A lo ‘Abrahamu’ gẹ́gẹ́ bí ìkọ̀wé orúkọ tó wọ́pọ̀ nínú Bíbélì Yorùbá.
