id: GAL.3.8
reference: Galatians 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: yo
  text: Ìwé Mímọ́ sì ti rí i ṣáájú pé nípa ìgbàgbọ́ ni Ọlọ́run ń dá àwọn orílẹ̀-èdè[a] láre; ó sì kéde ìhìn rere ṣáájú[b] fún Ábúráhámù pé, “Gbogbo àwọn orílẹ̀-èdè ni a ó bùkún nínú rẹ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn Kèfèrí”; ọ̀rọ̀ Gíríìkì ἔθνη lè túmọ̀ sí “àwọn orílẹ̀-èdè” tàbí “àwọn Kèfèrí.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ti wàásù ìhìn rere ṣáájú fún Ábúráhámù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: ti rí i ṣáájú
  rationale: Ó fi ìríran ohun tí yóò ṣẹlẹ̀ hàn ní ọ̀nà Yorùbá tó ṣe déédé, ó sì pa ìtumọ̀ àkókò ti aorist participle mọ́.
- source_word: ἡ γραφή
  choice: Ìwé Mímọ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún Ìwé Mímọ́; a tún pa àpèjúwe rẹ̀ bí ẹni pé ó ń ríran, ó sì ń kéde mọ́.
- source_word: ἐκ πίστεως
  choice: nípa ìgbàgbọ́
  rationale: Ó ṣàfihàn ìgbàgbọ́ gẹ́gẹ́ bí ọ̀nà tàbí ìpìlẹ̀, láìfi àlàyé ẹ̀kọ́ ìsìn kún un.
- source_word: δικαιοῖ
  choice: ń dá ... láre
  rationale: ‘Dá ẹni láre’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún ìtumọ̀ ìdájọ́ δικαιόω, ó sì pa present tense tí ń sọ òtítọ́ gbogbogbò mọ́.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: àwọn orílẹ̀-èdè ... gbogbo àwọn orílẹ̀-èdè
  rationale: Ó pa àtúnwí ọ̀rọ̀ Gíríìkì mọ́, ó sì so gbólóhùn Pọ́ọ̀lù mọ́ ìlérí Ábúráhámù. Àṣàyàn ‘àwọn Kèfèrí’ wà nínú àlàyé ìsàlẹ̀.
- source_word: προευηγγελίσατο
  choice: kéde ìhìn rere ṣáájú
  rationale: Ó pa èrò εὐαγγελ- (‘ìhìn rere’) àti ìtumọ̀ ‘ṣáájú’ tí πρό- ń fún un mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: τῷ Ἀβραὰμ
  choice: fún Ábúráhámù
  rationale: Ó tú dative indirect object náà sí Yorùbá lọ́nà àdánidá, pẹ̀lú orúkọ tí ó wọ́pọ̀ nínú Bíbélì Yorùbá.
- source_word: Ἐνευλογηθήσονται
  choice: a ó bù kún
  rationale: Ìlò ‘a’ aláìní ẹni pàtó fi passive náà hàn lọ́nà Yorùbá àdánidá, láìsọ ẹni tó ṣe ìbùkún ní tààràtà nínú ọ̀rọ̀ àyọlò.
- source_word: ἐν σοὶ
  choice: Nínú rẹ
  rationale: Ó tẹ̀ lé preposition Gíríìkì àti ìrísí ọ̀rọ̀ àyọlò Jẹ́nẹ́sísì, láìyí i sí ‘nípasẹ̀ rẹ’ tàbí fi ìtumọ̀ mìíràn lé e lórí.
theological_decisions:
- issue: Bóyá kí ἔθνη jẹ́ ‘àwọn orílẹ̀-èdè’ tàbí ‘àwọn Kèfèrí’
  choice: ‘àwọn orílẹ̀-èdè’ ní ibi méjèèjì
  alternative: ‘àwọn Kèfèrí’ ní ibi àkọ́kọ́, àti ‘àwọn orílẹ̀-èdè’ nínú ọ̀rọ̀ àyọlò
  rationale: Àṣàyàn yìí pa àtúnwí ọ̀rọ̀ kan náà nínú Gíríìkì mọ́, ó sì mú ìsopọ̀ láàárín dídá láre nípa ìgbàgbọ́ àti ìlérí fún gbogbo orílẹ̀-èdè hàn gbangba, láìpa ìtumọ̀ ‘Kèfèrí’ rẹ́; a tọ́ka sí i nínú àlàyé ìsàlẹ̀.
- issue: Agbára àpèjúwe Ìwé Mímọ́ gẹ́gẹ́ bí ẹni tó ríran tó sì kéde
  choice: Pa àpèjúwe náà mọ́ ní tààràtà
  alternative: Ṣàlàyé rẹ̀ pé Ọlọ́run ló ríran, ó sì sọ̀rọ̀ nínú Ìwé Mímọ́
  rationale: Gíríìkì fúnra rẹ̀ sọ Ìwé Mímọ́ di ẹni tó ń ṣe àwọn ìṣe méjèèjì. Fífi Ọlọ́run rọ́pò subject náà yóò tú ìtumọ̀ rẹ̀ ju ohun tí ọ̀rọ̀ sọ lọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ ti ẹ̀dá èdè. ‘Ń dá ... láre’ jẹ́ ọ̀rọ̀ ìdájọ́ tó ṣe déédé; ‘kéde ìhìn rere ṣáájú’ sì yẹra fún ọ̀rọ̀ ìjọ kan pàtó, bó tilẹ̀ jẹ́ pé ó pa ìtumọ̀ ihinrere Gíríìkì mọ́.
