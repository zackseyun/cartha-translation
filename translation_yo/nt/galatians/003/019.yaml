    issue: Ìrísí ọ̀rọ̀ ìṣe “A fi í kún un”
    rationale: Àmì “í” ń fún un ní ìtumọ̀ ìṣe àṣà tàbí ìṣe tí ń tẹ̀síwájú. Aorist passive προσετέθη ń tọ́ka sí pé a fi Òfin kún un ní ìṣẹ̀lẹ̀ kan; “A fi kún un” bójú mu.
  - severity: medium
    issue: “Láti ọwọ́ alárinà”
    rationale: “Láti ọwọ́” sábà ń tọ́ka sí orísun ẹni tí ohun ti wá, nígbà tí ἐν χειρὶ μεσίτου ń sọ ọ̀nà/ìlaja. “Ní ọwọ́ alárinà kan” pa ọ̀rọ̀ ọwọ́ mọ́, ó sì fi ipa alárinà hàn dáadáa.
  - severity: low
    issue: Ibi àmì-ẹsẹ̀ akọsilẹ̀ [c]
    rationale: Nínú ìtumọ̀ àkọ́kọ́, [c] wà lẹ́yìn “Òfin náà” bí ó tilẹ̀ jẹ́ pé ó ń ṣàlàyé “ṣètò.” A ti gbe e sí lẹ́yìn ọ̀rọ̀ ìṣe tí ó yẹ.
