id: GAL.3.19
reference: Galatians 3:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: yo
  text: Ǹjẹ́, kí wá ni ète Òfin? A fi kún un nítorí àwọn ìrékọjá[b], títí irú-ọmọ[a] tí a ti ṣe ìlérí náà fún yóò fi dé; a sì gbé e kalẹ̀[c] nípasẹ̀ àwọn áńgẹ́lì, ní ọwọ́ alárinà kan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ọmọ” tàbí “àtọmọdọ́mọ.”
    reason: lexical_alternative
  - marker: b
    text: “Nítorí àwọn ìrékọjá” lè túmọ̀ sí pé kí Òfin kojú wọn, fi wọ́n hàn, tàbí dá wọn dúró; Gíríìkì kò sọ èwo ní pàtó.
    reason: alternative_reading
  - marker: c
    text: Tàbí “ṣètò” tàbí “fi lélẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: Ǹjẹ́, kí wá ni ète Òfin?
  rationale: Ìbéèrè kúkúrú Gíríìkì ń béèrè nípa ìdí tàbí ète Òfin nínú ìjiyàn Paulu, kì í ṣe ìtumọ̀ ohun tí òfin jẹ́.
- source_word: νόμος
  choice: Òfin
  rationale: Níbí, ọ̀rọ̀ náà tọ́ka sí Òfin Mósè gẹ́gẹ́ bí ohun tí àwọn oníkàwé ti mọ̀ tẹ́lẹ̀.
- source_word: τῶν παραβάσεων χάριν
  choice: nítorí àwọn ìrékọjá
  rationale: Èyí pa àìdánilójú mọ́ bóyá Òfin náà wà láti kojú, fi hàn, tàbí dá ìrékọjá dúró.
- source_word: προσετέθη
  choice: A fi í kún un
  rationale: Ó fi ìṣe àfikún tí ọ̀rọ̀ ìṣe àìṣe Gíríìkì sọ hàn, láìsọ ohun tí a fi Òfin kún un ní pàtó.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: títí ... yóò fi dé
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí fún ààlà àkókò tí ó ń dúró de ìṣẹ̀lẹ̀ ọjọ́ iwájú.
- source_word: τὸ σπέρμα
  choice: irú-ọmọ
  rationale: “Irú-ọmọ” pa ìsopọ̀ pẹ̀lú èdè ìlérí fún Ábúráhámù mọ́, ó sì lè tọ́ka sí ọmọ tàbí àtọmọdọ́mọ gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe ń béèrè.
- source_word: ᾧ ἐπήγγελται
  choice: tí a ti ṣe ìlérí náà fún
  rationale: Ó mú ẹni tí ìlérí náà jẹ́ fún hàn, ó sì pa ipò ìlérí tí a ti ṣe tẹ́lẹ̀ tí ó ṣì dúró mọ́.
- source_word: διαταγεὶς
  choice: A sì ṣètò Òfin náà
  rationale: “Ṣètò” sọ ìdásílẹ̀ tàbí ìṣètò aláṣẹ tí διατάσσω lè túmọ̀ sí, láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: δι’ ἀγγέλων
  choice: nípasẹ̀ àwọn áńgẹ́lì
  rationale: Ó pa ipa àwọn áńgẹ́lì gẹ́gẹ́ bí ọ̀nà àlárin gbígbé Òfin náà kalẹ̀ mọ́.
- source_word: ἐν χειρὶ μεσίτου
  choice: láti ọwọ́ alárinà
  rationale: Èyí pa àwòrán “ọwọ́” Gíríìkì mọ́ nínú àṣà ọ̀rọ̀ Yorùbá tí ó ṣeé lóye, ó sì fi iṣẹ́ alárinà hàn.
theological_decisions:
- issue: Ìtumọ̀ “nítorí àwọn ìrékọjá”
  choice: A túmọ̀ ọ́ ní gbòòrò bí “nítorí àwọn ìrékọjá.”
  alternative: Láti dá ìrékọjá dúró; láti fi ìrékọjá hàn; tàbí ní ti àwọn ìrékọjá.
  rationale: Gíríìkì kò sọ ní pàtó bóyá ète náà ni dídènà, ṣíṣí payá, tàbí ṣíṣe àkóso ìrékọjá; nítorí náà a kò yanju àìdánilójú náà nínú ẹsẹ̀.
- issue: Ìtumọ̀ σπέρμα nínú ìjiyàn Paulu
  choice: A lo “irú-ọmọ” nínú ẹsẹ̀.
  alternative: Ọmọ; àtọmọdọ́mọ.
  rationale: “Irú-ọmọ” ń pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ìlérí Ábúráhámù, ó sì gba ìfọkànsìn Paulu nínú àyíká ẹsẹ̀ náà láyè láìfi ìtumọ̀ tóóró lé ọ̀rọ̀ náà lórí.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè tó ṣeé lóye. A kọ “Òfin” pẹ̀lú lẹ́tà ńlá láti tọ́ka sí Òfin Mósè nínú àyíká yìí; a sì lo “alárinà” fún ẹni tí ń ṣe àárín ẹni méjì.
