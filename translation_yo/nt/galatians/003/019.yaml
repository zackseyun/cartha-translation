revisions:
- from: Ǹjẹ́, kí wá ni ète Òfin? A fi í kún un nítorí àwọn ìrékọjá[b], títí irú-ọmọ[a] tí a ti ṣe ìlérí náà fún yóò fi dé. A sì ṣètò Òfin náà[c] nípasẹ̀ àwọn áńgẹ́lì, láti ọwọ́ alárinà.
  to: Ǹjẹ́, kí wá ni ète Òfin? A fi kún un nítorí àwọn ìrékọjá[b], títí irú-ọmọ[a] tí a ti ṣe ìlérí náà fún yóò fi dé; a sì gbé e kalẹ̀[c] nípasẹ̀ àwọn áńgẹ́lì, ní ọwọ́ alárinà kan.
  rationale: A tún ìrísí ìṣe àfikún ṣe kí ó ṣàfihàn aorist Gíríìkì, a ṣàtúnṣe ọ̀nà tí alárinà ń ṣiṣẹ́ kí “láti ọwọ́” má bàa yí ìtumọ̀ pada sí ìpilẹ̀ṣẹ̀, a sì gbe àmì akọsilẹ̀ [c] sí ọ̀rọ̀ ìṣe διαταγεὶς. Àìdánilójú τῶν παραβάσεων χάριν àti ìtànkálẹ̀ ìtumọ̀ σπέρμα ni a pa mọ́ nínú ẹsẹ̀ àti akọsilẹ̀.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:31:42Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà gba ìbéèrè ète Òfin, ìdí tí a fi fi kún un, ààlà dé ìgbà tí irú-ọmọ náà yóò dé, àti ipa àwọn áńgẹ́lì àti alárinà mọ́. Ṣùgbọ́n “A fi í kún un” ní ìrísí àṣà/ìṣe tí ń tẹ̀síwájú, níbi tí προσετέθη jẹ́ ìṣẹ̀lẹ̀ ìgbà kan ní ìgbà tí ó kọjá. “Láti ọwọ́ alárinà” sì lè sọ ìpilẹ̀ṣẹ̀ láti ọ̀dọ̀ alárinà, dípò ọ̀nà ìlaja tí ἐν χειρὶ μεσίτου ń fi hàn.
  naturalness: Àtúnṣe náà lo Yorùbá àpapọ̀ tó rọrùn, ó sì jẹ́ kí ìṣe ìgbà kọjá hàn ní kedere. “Ní ọwọ́ alárinà kan” pa àwòrán Gíríìkì mọ́, ó sì yà “alárinà kan” sọ́tọ̀ gẹ́gẹ́ bí ẹni tí a kò sọ ní pàtó.
  terminology: “Òfin,” “ìrékọjá,” “irú-ọmọ,” “ìlérí,” “áńgẹ́lì,” àti “alárinà” yẹ fún àyíká Pọ́ọ̀lù. “Irú-ọmọ” dá ìsopọ̀ σπέρμα mọ́ láìfi ìtumọ̀ Kristẹni tàbí ẹ̀kọ́ kan lé e lórí.
  issues:
