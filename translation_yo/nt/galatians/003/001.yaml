id: GAL.3.1
reference: Galatians 3:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: yo
  text: Ẹ̀yin ará Gálátíà aláìlóye[a], ta ni ó ṣàjẹ́ yín[b], níwájú ojú yín ni a ti ṣàfihàn Jésù Mèsáyà ní gbangba[c] gẹ́gẹ́ bí ẹni tí a kàn mọ́ àgbélébùú?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “aláìronú.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tàbí: “ta ni ó tàn yín jẹ?” Ọ̀rọ̀ Gíríìkì náà ń mú àwòrán ìṣàjẹ́ tàbí fífi ojú búburú wò ènìyàn wá.'
    reason: lexical_alternative
  - marker: c
    text: 'Tàbí: “a fi hàn ní kedere,” tàbí “a polówó rẹ̀ ní gbangba gẹ́gẹ́ bí ẹni tí a kàn mọ́ àgbélébùú.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: aláìlóye
  rationale: Ó fi ìbáwí Pọ́ọ̀lù hàn gẹ́gẹ́ bí àìní òye tàbí àìronú, láìfi ẹ̀sùn ìwà búburú tí ọ̀rọ̀ Gíríìkì kò ní kún un.
- source_word: Γαλάται
  choice: ará Gálátíà
  rationale: Ọ̀nà Yorùbá àdánidá fún pípe àwọn ènìyàn agbègbè Gálátíà ni èyí.
- source_word: ἐβάσκανεν
  choice: fi oògùn dẹ́ yín
  rationale: Ó pa àwòrán ọ̀rọ̀ tó lágbára mọ́—ìṣe bí fífi idán tàbí oògùn di ènìyàn—dípò yíyí i sí ‘tàn yín jẹ’ nìkan.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: lójú yín
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé láti sọ pé a fi ohun kan hàn níwájú ẹni ní kedere.
- source_word: Ἰησοῦς Χριστός
  choice: Jésù Mèsáyà
  rationale: A tú Χριστός sí ‘Mèsáyà’ kí ìtumọ̀ rẹ̀ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn lè máa hàn, dípò kí ó dà bí orúkọ ìdílé.
- source_word: προεγράφη
  choice: a gbé ... kalẹ̀ ní gbangba
  rationale: Ó mú ìtumọ̀ fífi ohun kan hàn ní gbangba tàbí gbé e kalẹ̀ ní kedere, láìdín ọ̀rọ̀ náà mọ́ ìkọ̀wé lásán.
- source_word: ἐσταυρωμένος
  choice: gẹ́gẹ́ bí ẹni tí a ti kàn mọ́ àgbélébùú
  rationale: 'Ó fi ipò tí participle náà ń ṣàpèjúwe hàn: a gbé Jésù kalẹ̀ bí ẹni tó wà ní ipò ẹni tí a ti kàn mọ́ àgbélébùú.'
theological_decisions:
- issue: Bí a ṣe máa tú Χριστός nínú Ἰησοῦς Χριστός
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: ‘Mèsáyà’ pa agbára oyè náà mọ́ ní Yorùbá, ó sì yẹra fún mímú Χριστός bí ẹni pé ó jẹ́ orúkọ ìdílé; àkọsílẹ̀ ìsàlẹ̀ jẹ́ kí ọ̀nà ìbílẹ̀ ‘Kristi’ tún hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ṣùgbọ́n ó pa ìbáwí líle àti ìbéèrè àsọyé Pọ́ọ̀lù mọ́. ‘Fi oògùn dẹ́’ jẹ́ àwòrán tó ṣeé lóye fún òǹkàwé òde òní, kò sì sọ pé ìṣẹ̀lẹ̀ idán kan ṣẹlẹ̀ ní ti gidi.
