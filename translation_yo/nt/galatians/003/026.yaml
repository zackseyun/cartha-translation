  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντες γὰρ υἱοὶ θεοῦ ἐστε διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/026.yaml
  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: yo
  text: Nítorí pé gbogbo yín jẹ́ ọmọ Ọlọ́run[a] nípasẹ̀ ìgbàgbọ́ nínú Mèsáyà Jésù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọmọkùnrin Ọlọ́run.” Gíríìkì náà ní, “àwọn ọmọkùnrin,” èyí tí ó pa ìtumọ̀ ipò ọmọ àti ẹ̀tọ́ ogún nínú ọ̀rọ̀ Pọ́ọ̀lù mọ́.
    reason: lexical_alternative
  - marker: b
    text: 'Ìtumọ̀ ìbílẹ̀: “Kristi Jésù.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: gbogbo yín
  rationale: Ọ̀rọ̀ náà, papọ̀ mọ́ ọ̀rọ̀-ìṣe ẹni kejì ọ̀pọ̀ ἐστε, tọ́ka sí gbogbo àwọn tí Pọ́ọ̀lù ń bá sọ̀rọ̀ láìyọ ẹnikẹ́ni sílẹ̀.
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó so gbólóhùn yìí mọ́ èyí tó ṣáájú gẹ́gẹ́ bí ìdí tàbí ìpìlẹ̀ rẹ̀; ‘Nítorí pé’ jẹ́ àsopọ̀ Yorùbá tó ṣe kedere.
- source_word: υἱοὶ θεοῦ
  choice: ọmọ Ọlọ́run
  rationale: ‘Ọmọ’ ni ọ̀rọ̀ Yorùbá àdánidá fún ipò ìbátan ọmọ sí Ọlọ́run, ó sì lè kan ọkùnrin àti obìnrin. Àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ Gíríìkì náà túmọ̀ ní pàtó sí ‘àwọn ọmọkùnrin’ ó sì ní ìtumọ̀ ipò ajogún.
- source_word: διὰ τῆς πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní genitive ń sọ ọ̀nà tàbí ohun èlò; ‘nípasẹ̀’ pa agbára yẹn mọ́, ‘ìgbàgbọ́’ sì jẹ́ ìtumọ̀ àdánidá fún πίστις níbí.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: ‘Nínú’ pa èdè Pọ́ọ̀lù nípa ìṣọ̀kan pẹ̀lú Mèsáyà mọ́, dípò kíkà á sí Jésù gẹ́gẹ́ bí ohun tí a gbàgbọ́ nìkan. Χριστός jẹ́ oyè, nítorí náà a túmọ̀ ọ́ sí ‘Mèsáyà’.
theological_decisions:
- issue: Èdè ọmọ tí ó ní akọ nínú Gíríìkì
  choice: ọmọ Ọlọ́run
  alternative: àwọn ọmọkùnrin Ọlọ́run
  rationale: υἱοί jẹ́ akọ ní Gíríìkì, ó sì ń gbé èrò ipò ọmọ àti ogún. Ṣùgbọ́n ‘ọmọkùnrin’ ní Yorùbá máa ń fi akọ ara hàn ní pàtó, ó sì lè mú kí a rò pé àwọn ọkùnrin nìkan ni Pọ́ọ̀lù ń pè ní ipò yìí. ‘Ọmọ’ jẹ́ àdánidá, ó kan gbogbo ẹgbẹ́ náà, àlàyé ìsàlẹ̀ sì pa ìrísí àti ìtumọ̀ Gíríìkì mọ́.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; ‘Mèsáyà’ ń túmọ̀ ìtumọ̀ oyè náà, nígbà tí ‘Kristi’ jẹ́ àkọsílẹ̀ ohùn ìbílẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún òǹkàwé gbogbogbò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; ‘Mèsáyà Jésù’ pa bí àwọn oyè àti orúkọ ṣe tẹ̀ lé ara wọn nínú orísun Gíríìkì mọ́.
