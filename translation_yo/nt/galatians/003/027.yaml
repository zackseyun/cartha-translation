  text: ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: yo
  text: Nítorí gbogbo ẹ̀yin tí a ti bámítísì sínú Mèsáyà ni ẹ ti wọ Mèsáyà[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi” ní ibi méjèèjì tí “Mèsáyà” ti fara hàn.
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ẹ ti wọ Mèsáyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: gbogbo ẹ̀yin tí
  rationale: Ó pa agbára ìbáṣepọ̀ ὅσοι mọ́, ó sì fi hàn pé Pọ́ọ̀lù ń bá àwọn ará Gálátíà sọ̀rọ̀ ní tààrà.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìsopọ̀ àlàyé ẹsẹ yìí mọ́ pẹ̀lú ọ̀rọ̀ tí ó ṣáájú.
- source_word: εἰς
  choice: sínú
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí ó pa èrò ìdàpọ̀ tàbí ìkóni sínú Mèsáyà mọ́ láìfi ẹ̀kọ́ ìsìn kan kún un.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Níbí, orúkọ oyè ẹni tí Ọlọ́run yàn ní òróró fara hàn kedere; àlàyé ìsàlẹ̀ ojú ewé sì fúnni ní àṣàyàn “Kristi.”
- source_word: ἐβαπτίσθητε
  choice: a ti bamitiisi
  rationale: Ó pa ohùn àìṣe Gíríìkì mọ́, ó sì yẹra fún ṣíṣe pàtó ọ̀nà ìbatisí tí ẹsẹ náà kò sọ.
- source_word: ἐνεδύσασθε
  choice: ẹ ti gbé ... wọ̀
  rationale: Ó sọ àwòrán ìmúra aṣọ nínú ọ̀rọ̀ Gíríìkì ní Yorùbá àdánidá, ó sì pa ìtumọ̀ pé wọn ti fi Mèsáyà bo ara wọn mọ́.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ ìbatisí náà yẹ kí ó pinnu ẹ̀kọ́ kan pàtó nípa ipa ìbatisí tàbí ọ̀nà tí a fi ń ṣe é.
  choice: a ti bamitiisi sínú Mèsáyà
  alternative: a ti rì sínú Mèsáyà; a ti bamitiisi ní ìbáṣepọ̀ pẹ̀lú Mèsáyà
  rationale: Gíríìkì sọ nípa ìbatisí “sínú” Mèsáyà, ṣùgbọ́n kò dá ìjíròrò ẹ̀kọ́ ìsìn tó wá lẹ́yìn náà lórí ipa sakramenti tàbí ọ̀nà ìbatisí. Ìtumọ̀ náà pa ìṣòro àti ìfọ̀rọ̀wérọ̀ yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé naví; “gbé ... wọ̀” pa àwòrán aṣọ mọ́ láìṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
