id: GAL.3.20
reference: Galatians 3:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ μεσίτης ἑνὸς οὐκ ἔστιν, ὁ δὲ θεὸς εἷς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: yo
  text: Alárinà kì í ṣe ti ọ̀kan[a], ṣùgbọ́n Ọlọ́run jẹ́ ọ̀kan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà sí i: “Alárinà kì í ṣe ti ọ̀kan.” Ó lè túmọ̀ sí pé alárinà kì í ṣiṣẹ́ fún ẹnì kan ṣoṣo tàbí fún ẹ̀gbẹ́ kan ṣoṣo.'
    reason: alternative_reading
  - marker: b
    text: Ó ṣeé ṣe kí “Ọlọ́run jẹ́ ọ̀kan” ràn ẹni létí ìjẹ́wọ́ Ísírẹ́lì pé Ọlọ́run kan ṣoṣo ni ó wà. Wo Ìdẹ́rọ́nómì 6:4.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: alárinà
  rationale: “Alárinà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tó dúró láàárín àwọn ẹ̀gbẹ́ láti mú àdéhùn tàbí ìbáṣepọ̀ ṣẹ; ó bá ìtumọ̀ ọ̀rọ̀ Gíríìkì mu láìfi ẹ̀kọ́ ìsìn kan kún un.
- source_word: ἑνὸς
  choice: ẹ̀gbẹ́ kan ṣoṣo
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí “ọ̀kan,” ṣùgbọ́n ó kúrú, ó sì ní ìtumọ̀ tí kò ṣe kedere pátápátá. “Ẹ̀gbẹ́ kan ṣoṣo” mú ìbáṣepọ̀ tó wà nínú iṣẹ́ alárinà hàn ní Yorùbá láìṣàlàyé gbogbo àríyànjiyàn Pọ́ọ̀lù.
- source_word: οὐκ ἔστιν
  choice: kì í ṣe ti
  rationale: Èyí pa ìrísí gbólóhùn Gíríìkì “kì í ṣe ti” mọ́, dípò yíyí rẹ̀ sí ìtumọ̀ tó gbooro bí “kì í ṣiṣẹ́ fún.”
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ tó wà láàárín gbólóhùn nípa alárinà àti ìjẹ́wọ́ pé Ọlọ́run jẹ́ ọ̀kan hàn. A kò fi ọ̀rọ̀ ìgbà bí “nísinsìnyí” sí ìbẹ̀rẹ̀ nítorí kò sí nínú orísun.
- source_word: θεὸς εἷς ἐστιν
  choice: Ọlọ́run jẹ́ ọ̀kan
  rationale: Ìtumọ̀ tààrà yìí pa ìtẹnumọ́ àti ìrọ̀rùn gbólóhùn Gíríìkì mọ́, ó sì jẹ́ kí ìṣàfihàn pé Ọlọ́run jẹ́ ọ̀kan dúró láìfikún.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn kúkúrú tí ó nira nípa alárinà
  choice: ẹ̀gbẹ́ kan ṣoṣo
  alternative: ọ̀kan; ẹnì kan ṣoṣo; alárinà kì í ṣiṣẹ́ fún ẹ̀gbẹ́ kan ṣoṣo
  rationale: Ẹsẹ̀ yìí ní ọ̀pọ̀ ìtumọ̀ tí a ti dábàá. Ìtumọ̀ náà ṣe àlàyé tó kéré jù lọ pé iṣẹ́ alárinà ní í ṣe pẹ̀lú àwọn ẹ̀gbẹ́, ṣùgbọ́n kò sọ pé Mósè, Kristi, Òfin, tàbí májẹ̀mú kan pàtó ni Pọ́ọ̀lù ń tọ́ka sí.
- issue: Ìjẹ́wọ́ pé Ọlọ́run jẹ́ ọ̀kan
  choice: Ọlọ́run jẹ́ ọ̀kan
  alternative: Ọlọ́run kan ṣoṣo ni ó wà; Ọlọ́run jẹ́ Ọlọ́run kan
  rationale: A pa ọ̀rọ̀ Pọ́ọ̀lù mọ́ ní ṣókí, láìyí i padà sí àlàyé ẹ̀kọ́ ìsìn tó gbooro; ó tún lè mú Ìdẹ́rọ́nómì 6:4 wá sí ọkàn.
translation_notes:
  register: Yorùbá àkànṣe tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. “Alárinà” jẹ́ ọ̀rọ̀ àdánidá ju gbólóhùn àlàyé gígùn lọ; àwọn àmì ohùn ni a fi sí ibi tó yẹ.
