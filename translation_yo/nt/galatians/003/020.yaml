  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí μεσίτης àti θεὸς εἷς ἐστιν. Ṣùgbọ́n fífi “ẹ̀gbẹ́ kan ṣoṣo” sínú ọ̀rọ̀ ara-ẹsẹ̀ ń ṣàlàyé ἑνὸς, tí ó jẹ́ “ọ̀kan” ní Gíríìkì, ju bó ṣe yẹ lọ nínú ẹsẹ̀ tó jẹ́ kúkúrú tí ó sì ní ìtumọ̀ tí a ń jiyàn rẹ̀. A yẹ kí a pa ìkùukùu náà mọ́ nínú ara-ẹsẹ̀, kí àlàyé wà nínú àlàyé ìsàlẹ̀.
  naturalness: “Alárinà” àti “Ọlọ́run jẹ́ ọ̀kan” jẹ́ Yorùbá ìwé mímọ́ tó dára, tó sì ṣeé lóye. “Kì í ṣe ti ọ̀kan” jẹ́ kúkúrú bí ti orísun, ó sì ní ìgbọ́gbọ̀n Yorùbá tó yẹ fún gbólóhùn gbogbogbò. A tún ṣe àtúnṣe gbolohun àlàyé [b] kí ó sọ ìtumọ̀ “echoes” ní Yorùbá tòótọ́.
