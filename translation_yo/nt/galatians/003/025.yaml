id: GAL.3.25
reference: Galatians 3:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: yo
  text: Ṣùgbọ́n ní báyìí tí ìgbàgbọ́ ti dé[a], a kò sí lábẹ́ alábòójútó[b] mọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní báyìí tí ìgbàgbọ́ náà ti dé.”
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì παιδαγωγός ń tọ́ka sí ẹni inú agbo ilé tí ń ṣọ́, ń darí, tí ó sì ń bójú tó ọmọ tí kò tíì dàgbà; kì í ṣe olùkọ́ kíláàsì ní pàtàkì.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: ní báyìí tí ... ti dé
  rationale: Ẹ̀ka ọ̀rọ̀ aorist participle inú genitive absolute yìí ń tọ́ka sí àkókò. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì fi hàn pé dídé náà ti ṣẹlẹ̀, ipa rẹ̀ sì ń bá a lọ ní ìsinsìnyí.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ hàn láàárín ipò tẹ́lẹ̀ lábẹ́ alábòójútó àti ipò tuntun tí ẹsẹ yìí ń sọ.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Èyí pa ìtumọ̀ pàtàkì πίστις mọ́, láìfipá yanjú bóyá ó ń tọ́ka sí ìgbàgbọ́ tàbí sí àsìkò ìgbàgbọ́ gẹ́gẹ́ bí ohun tí a ti mọ̀ nínú àyíká ọ̀rọ̀.
- source_word: οὐκέτι
  choice: kò ... mọ́
  rationale: Ìlò Yorùbá yìí fi hàn ní tààrà pé ipò kan tí ó wà tẹ́lẹ̀ ti dópin.
- source_word: ὑπὸ
  choice: lábẹ́
  rationale: Ó pa àwòrán Pọ́ọ̀lù mọ́ pé ẹni náà wà lábẹ́ àṣẹ àti àbójútó ẹlòmíràn.
- source_word: παιδαγωγόν
  choice: alábòójútó
  rationale: παιδαγωγός jẹ́ ẹni inú agbo ilé tí ń ṣọ́, ń darí, tí ó sì ń bójú tó ọmọ tí kò tíì dàgbà; kì í ṣe olùkọ́ kíláàsì ní pàtàkì. “Alábòójútó” ló ṣe kedere jù lọ ní Yorùbá òde òní.
- source_word: ἐσμεν
  choice: a ... sí
  rationale: Èyí ni ọ̀nà àdánidá láti fi ọ̀rọ̀-ìṣe εἰμί hàn nínú gbólóhùn òdì Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ “dídé ìgbàgbọ́” nínú àyíká ọ̀rọ̀
  choice: ìgbàgbọ́ ti dé
  alternative: ìgbàgbọ́ náà ti dé
  rationale: Àkọ́kọ́ jẹ́ Yorùbá àdánidá, ó sì pa àkókò ìgbàlà tuntun tí Pọ́ọ̀lù ń ṣàpèjúwe mọ́ láìfi “náà” kún un bí ẹni pé ó gbọ́dọ̀ túmọ̀ sí ètò ẹ̀sìn kan. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ kejì tí ó ṣeé ṣe mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá Àfẹnusọ tó ní àmì ohùn, ó ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. “Alábòójútó” yẹra fún ìtumọ̀ tí yóò sọ παιδαγωγός di olùkọ́ ilé-ẹ̀kọ́.
