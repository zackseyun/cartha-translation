id: GAL.3.14
reference: Galatians 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: yo
  text: kí ìbùkún Ábúráhámù lè dé ọ̀dọ̀ àwọn aláìní-Jù[a] nínú Mèsáyà Jésù[b], kí a lè gba ìlérí ti Ẹ̀mí nípasẹ̀ ìgbàgbọ́.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn orílẹ̀-èdè.”
    reason: lexical_alternative
  - marker: b
    text: 'Ìtumọ̀ àṣà: “nínú Kristi Jésù.”'
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “gba Ẹ̀mí tí a ṣèlérí nípasẹ̀ ìgbàgbọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ó fi ète hàn nínú gbólóhùn méjèèjì, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa ìṣètò ète méjì náà mọ́.
- source_word: εἰς τὰ ἔθνη
  choice: dé ọ̀dọ̀ àwọn Kèfèrí
  rationale: Nínú àríyànjiyàn Paulu níbí, ἔθνη tọ́ka sí àwọn tí kì í ṣe Júù; àlàyé ìsàlẹ̀ fi ìtumọ̀ gbooro ‘àwọn orílẹ̀-èdè’ pamọ́.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: ìbùkún Ábúráhámù
  rationale: Ó tọ́ka sí ìbùkún tí ó ní í ṣe pẹ̀lú Ábúráhámù, ó sì bójú mu ọ̀rọ̀ ìlérí nínú àyíká ẹsẹ náà.
- source_word: γένηται
  choice: lè dé ọ̀dọ̀
  rationale: Nínú àkópọ̀ yìí, ó túmọ̀ sí pé ìbùkún náà dé bá àwọn Kèfèrí; èyí jẹ́ Yorùbá àdánidá ju títúmọ̀ rẹ̀ ní líle gẹ́gẹ́ bí ‘di’ lọ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: A tú Χριστός gẹ́gẹ́ bí oyè ‘Mèsáyà,’ a sì pa èdè ìṣọ̀kan Paulu ‘nínú’ mọ́.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: ìlérí ti Ẹ̀mí
  rationale: Ìtumọ̀ yìí pa ìbáṣepọ̀ oníwà-genitive Gíríìkì mọ́ láì pinnu bóyá Ẹ̀mí ni ohun tí a ṣèlérí tàbí bóyá ìlérí náà ní ìbáṣepọ̀ mìíràn pẹ̀lú Ẹ̀mí.
- source_word: λάβωμεν
  choice: kí àwa lè gba
  rationale: Ó ṣàfihàn aorist subjunctive tí ἵνα ń darí, ó sì tẹnu mọ́ ‘àwa’ bí Gíríìkì ṣe ṣe nínú fọ́ọ̀mù ọ̀rọ̀-ìṣe.
- source_word: διὰ τῆς πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: Ó pa ọ̀nà tàbí ohun èlò tí διά ń tọ́ka sí mọ́, ‘ìgbàgbọ́’ sì jẹ́ ìtumọ̀ tó bójú mu fún πίστις níbí.
theological_decisions:
- issue: Bóyá a ó tú Χριστῷ gẹ́gẹ́ bí oyè tàbí bí orúkọ tí a ti gbà wọlé
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Nínú ọ̀rọ̀ nípa Ábúráhámù, ìlérí, àti ìbùkún, oyè náà ṣì ní agbára rẹ̀; ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn kedere.
- issue: Ìtumọ̀ τοῦ πνεύματος
  choice: ìlérí ti Ẹ̀mí
  alternative: Ẹ̀mí tí a ṣèlérí
  rationale: Àkọ́kọ́ pa àìṣedéédé tó wà nínú genitive Gíríìkì mọ́; àṣàyàn kejì, tí ó ṣeé ṣe gan-an nínú àyíká, wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa àtẹ̀lé ète méjì ἵνα mọ́ nípasẹ̀ ‘kí ... lè’ lẹ́ẹ̀mejì. ‘Àwọn Kèfèrí’ jẹ́ ọ̀rọ̀ Bíbélì tí ọ̀pọ̀ ènìyàn mọ̀ fún àwọn tí kì í ṣe Júù, ṣùgbọ́n a fi ‘àwọn orílẹ̀-èdè’ sí àlàyé ìsàlẹ̀ láti pa ìtumọ̀ míì mọ́.
