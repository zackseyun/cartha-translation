  naturalness: ‘Àwọn Kèfèrí’ jẹ́ ọ̀rọ̀ Bíbélì tí a mọ̀, ṣùgbọ́n ó lè dà bí ọ̀rọ̀ àbùkù tàbí ọ̀rọ̀ atijọ́ nínú Yorùbá ìgbàlódé. ‘Àwọn aláìní-Jù’ jẹ́ ọ̀nà kedere, aláìṣojúsàájú, tí ó sì bá ìyàtọ̀ Júù/àwọn orílẹ̀-èdè nínú àyíká Paulu mu. ‘Kí a lè gba’ tún jẹ́ ìṣètò àdánidá; ‘àwa’ kò ṣe dandan nítorí fọ́ọ̀mù λάβωμεν kò tẹnu mọ́ ẹni-kìíní ju bó ṣe yẹ lọ.
