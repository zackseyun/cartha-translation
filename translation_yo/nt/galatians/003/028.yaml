id: GAL.3.28
reference: Galatians 3:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: yo
  text: Kò sí Júù tàbí Gíríìkì, kò sí ẹrú tàbí ẹni òmìnira, kò sí akọ àti abo[a]; nítorí gbogbo yín jẹ́ ọ̀kan nínú Mèsáyà Jésù.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ó jẹ́ “akọ àti abo,” ó sì ṣeé ṣe kí ó ń tọ́ka sí Jẹ́nẹ́sísì 1:27. Ní Yorùbá àdánidá, a tún lè sọ pé “kò sí akọ tàbí abo.”
    reason: alternative_reading
  - marker: b
    text: Ní Gíríìkì, “nínú Kristi Jésù”; a lo “Mèsáyà Jésù” nítorí Χριστός jẹ́ oyè níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: kò sí
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ àìsí ohun kan, ó sì pa àtúnsọ ìtẹnumọ́ Páùlù mọ́.
- source_word: Ἰουδαῖος
  choice: Júù
  rationale: Nínú ìfiwéra rẹ̀ pẹ̀lú Ἕλλην, ọ̀rọ̀ náà ń tọ́ka sí ìdánimọ̀ ẹ̀yà àti ẹ̀sìn Júù.
- source_word: Ἕλλην
  choice: Gíríìkì
  rationale: Èdè Gíríìkì sọ ‘Gíríìkì’ ní pàtó, kì í ṣe ọ̀rọ̀ gbòòrò fún gbogbo Kèfèrí.
- source_word: δοῦλος
  choice: ẹrú
  rationale: Ìtumọ̀ ipò ẹni tí ó wà lábẹ́ ìní tàbí ìṣàkóso olúwa ni ó hàn gbangba nínú ìfiwéra pẹ̀lú ẹni òmìnira.
- source_word: ἐλεύθερος
  choice: ẹni òmìnira
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún ẹni tí kì í ṣe ẹrú, dípò lílo ‘òmìnira’ gẹ́gẹ́ bí èrò àìfojúrí.
- source_word: ἄρσεν καὶ θῆλυ
  choice: akọ àti abo
  rationale: Ó pa ìtumọ̀ nípa ìbálòpọ̀ ẹ̀dá àti àsopọ̀ καὶ (‘àti’) mọ́, ó sì jẹ́ kí ìróhìn tó ṣeé ṣe sí Jẹ́nẹ́sísì 1:27 dúró.
- source_word: πάντες ὑμεῖς
  choice: gbogbo yín
  rationale: Ó pa àkíyèsí sí gbogbo àwọn tí a ń bá sọ mọ́ ní Yorùbá àdánidá.
- source_word: εἷς ἐστε
  choice: jẹ́ ọ̀kan
  rationale: Ó pa gbólóhùn Páùlù mọ́ ní ṣókí láì túmọ̀ rẹ̀ sí ‘ẹni kan’ tàbí ṣàlàyé irú ìṣọ̀kan náà ju ohun tí ẹsẹ náà sọ lọ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: ‘Nínú’ jẹ́ ọ̀nà Yorùbá tí a mọ̀ fún ìbáṣepọ̀ ìṣọ̀kan yìí; ‘Mèsáyà’ sì mú iṣẹ́ Χριστός gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn hàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ἄρσεν καὶ θῆλυ
  choice: akọ àti abo
  alternative: akọ tàbí abo
  rationale: Àwọn ìfiwéra méjì àkọ́kọ́ lo οὐδὲ, ṣùgbọ́n èyí lo καὶ. Dídá ‘àti’ sílẹ̀ pa ìyàtọ̀ yẹn àti ìróhìn tó ṣeé ṣe sí Jẹ́nẹ́sísì 1:27 mọ́, bó tilẹ̀ jẹ́ pé ‘tàbí’ lè dùn bí Yorùbá tó rọrùn jù nínú gbólóhùn òdì.
- issue: Bí a ṣe máa ṣàlàyé εἷς ἐστε
  choice: gbogbo yín jẹ́ ọ̀kan
  alternative: gbogbo yín parapọ̀ di ẹni kan; gbogbo yín wà ní ìṣọ̀kan
  rationale: Ìtumọ̀ ṣókí náà jẹ́ kí ẹ̀kọ́ nípa ìṣọ̀kan nínú Mèsáyà dúró láì fi kún un pé gbogbo ìyàtọ̀ ẹ̀dá tàbí ti àwùjọ ti parẹ́.
- issue: Bí a ṣe máa gbé Χριστός kalẹ̀
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, Χριστός ní agbára oyè ẹni tí Ọlọ́run fòróró yàn; ‘Mèsáyà’ mú agbára oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ jẹ́wọ́ ọ̀nà ìtúmọ̀ ìbílẹ̀ ‘Kristi.’
translation_notes:
  register: Yorùbá àgbà lónìí tó ní iyì, tó ṣe kedere fún òǹkàwé gbogbo. A lo àtúnsọ ‘kò sí’ láti pa ìtẹnumọ́ orísun mọ́; ‘ẹni òmìnira’ yàgò fún àìyedè tí ‘òmìnira’ nìkan lè dá sílẹ̀. Àwọn àmì ohùn ni a fi sí ibi tí ó bá èdè Yorùbá boṣewa mu.
