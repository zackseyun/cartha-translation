id: GAL.3.21
reference: Galatians 3:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: yo
  text: Ǹjẹ́ òfin ha lòdì sí àwọn ìlérí Ọlọ́run? Kí ó má rí bẹ́ẹ̀ láéláé! Nítorí bí a bá ti fi òfin kan kalẹ̀ tí ó lè fún ènìyàn ní ìyè, ní tòótọ́, láti inú òfin ni òdodo ì bá ti wá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: òfin
  rationale: “Òfin” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé fún νόμος; àìlo lẹ́tà ńlá pa ìtumọ̀ rẹ̀ gẹ́gẹ́ bí ẹ̀ka òfin mọ́, nígbà tí òfin Mósè ṣì wà nínú àyíká ọ̀rọ̀ náà.
- source_word: κατὰ
  choice: lòdì sí
  rationale: Nínú ìbéèrè yìí, κατά pẹ̀lú ẹ̀yà genitive ń fi ìtakò hàn; “lòdì sí” jẹ́ èdè Yorùbá àdánidá tó sì ṣe kedere.
- source_word: ἐπαγγελιῶν
  choice: àwọn ìlérí
  rationale: Ó pa nọ́ńbà ọ̀pọ̀ inú Gíríìkì mọ́, ó sì tọ́ka sí àwọn ìlérí Ọlọ́run tí àyíká ọ̀rọ̀ ti mẹ́nu kàn.
- source_word: μὴ γένοιτο
  choice: Kí ó má rí bẹ́ẹ̀ láéláé!
  rationale: Ó pa agbára ọ̀rọ̀ Pọ́ọ̀lù tí ó fi ń kọ èrò kan pátápátá mọ́, ní èdè Yorùbá tó bójú mu.
- source_word: ἐδόθη
  choice: a bá ti fi … fúnni
  rationale: Ìṣe aláìlórúkọ aorist náà ni a mú wọ inú gbólóhùn àídájú Yorùbá ní ọ̀nà àdánidá.
- source_word: δυνάμενος
  choice: tí ó lè
  rationale: Ó fi agbára tàbí àǹfààní òfin láti ṣe ohun tí a sọ hàn ní ṣókí àti ní kedere.
- source_word: ζῳοποιῆσαι
  choice: sọni di alààyè
  rationale: Ó túmọ̀ ìṣe jíjí ènìyàn sí ìyè tàbí fífúnni ní ìyè láìfi ìtumọ̀ ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ὄντως
  choice: ní tòótọ́
  rationale: Ó pa ìtẹnumọ́ adverb náà mọ́ ní Yorùbá ọlọ́wọ̀.
- source_word: ἐκ νόμου
  choice: láti inú òfin
  rationale: Ó pa agbára ἐκ gẹ́gẹ́ bí orísun mọ́ ju bí a bá sọ pé “nípa òfin” lọ.
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” jẹ́ àpapọ̀ Yorùbá tó bójú mu fún δικαιοσύνη, tí ó lè gba ìtumọ̀ jíjẹ́ ẹni tó tọ́ àti ìdájọ́ òdodo; àṣàyàn “ìdájọ́ òdodo” wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú àríyànjiyàn Pọ́ọ̀lù
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: “Òdodo” bá àríyànjiyàn nípa ipò títọ́ níwájú Ọlọ́run mu, láìpa ìhà ìdájọ́ òdodo rẹ̀ rẹ́; àṣàyàn kejì ni a tọ́ka sí nínú àlàyé ìsàlẹ̀.
- issue: Bí νόμος ṣe ń tọ́ka sí òfin lápapọ̀ àti Òfin Mósè
  choice: òfin
  alternative: Òfin
  rationale: Gbólóhùn àídájú náà ń sọ̀rọ̀ nípa òfin gẹ́gẹ́ bí ẹ̀ka kan, bí ó tilẹ̀ jẹ́ pé Òfin Mósè wà nínú èrò; lẹ́tà kékeré kò fi agbára mú kí ọ̀kan ṣoṣo ni ìtumọ̀.
translation_notes:
  register: Èdè Yorùbá àkànṣe, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. “Ǹjẹ́ … ha” pa ìrísí ìbéèrè àsọyé mọ́, “Kí ó má rí bẹ́ẹ̀ láéláé!” sì fi ìkọ̀sílẹ̀ líle hàn.
