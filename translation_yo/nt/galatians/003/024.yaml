review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential ὥστε, the perfect-result force of γέγονεν, the custodial sense of παιδαγωγός, and the contextual temporal-goal sense of εἰς Χριστόν. However, “kí a lè dá wa láre” is active and reflexive (“so that we may justify/vindicate ourselves”), whereas δικαιωθῶμεν is passive (“so that we may be justified”).
  naturalness: The translation is clear, modern Standard Yoruba, with suitable tone marking and an appropriate formal register. The revised passive expression is slightly more explicit but avoids an unacceptable reflexive meaning.
  terminology: “Òfin,” “olùtọ́jú,” “Mèsáyà,” “ìgbàgbọ́,” and “dá láre” are appropriate choices. “Olùtọ́jú” is responsibly qualified by the lexical footnote so that it is not read chiefly as a classroom teacher.
  issues:
  - severity: high
    issue: The phrase “kí a lè dá wa láre” renders the passive δικαιωθῶμεν as a reflexive active construction.
    rationale: The object “wa” makes the clause mean that we justify ourselves. The Greek leaves the justifying agent unstated and presents the recipients as being justified. The Yoruba must not introduce self-justification.
  revised_text: Nítorí náà, òfin ti di olùtọ́jú[a] wa títí dé Mèsáyà[b], kí a lè jẹ́ ẹni tí a dá láre nípa ìgbàgbọ́.
