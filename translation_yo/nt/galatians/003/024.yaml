id: GAL.3.24
reference: Galatians 3:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε ὁ νόμος παιδαγωγὸς ἡμῶν γέγονεν εἰς Χριστόν, ἵνα ἐκ πίστεως δικαιωθῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: yo
  text: Nítorí náà, òfin ti di olùtọ́jú[a] wa títí dé Mèsáyà[b], kí a lè jẹ́ ẹni tí a dá láre nípa ìgbàgbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “alábòójútó”; ní ìtumọ̀ ìbílẹ̀, “olùkọ́.” Ọ̀rọ̀ Gíríìkì παιδαγωγός ń tọ́ka sí olùtọ́jú tàbí alábòójútó ilé kan fún ọmọ, kì í ṣe olùkọ́ kíláàsì ní pàtàkì.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “sí Mèsáyà”; a tún lè lóye gbólóhùn náà sí “láti darí wa dé ọ̀dọ̀ Mèsáyà.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Níhìn-ín, ὥστε ń fi àbájáde ìjíròrò tó ṣáájú hàn; “Nítorí náà” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìyọrísí yìí.
- source_word: ὁ νόμος
  choice: òfin
  rationale: Nínú àyíká Gálátíà, ọ̀rọ̀ náà ń tọ́ka sí Òfin Mósè gẹ́gẹ́ bí ohun tí àwọn òǹkàwé mọ̀.
- source_word: παιδαγωγός
  choice: olùtọ́jú
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ sí ẹni ilé kan tí ń ṣọ́ ọmọ, tó sì ń darí ìwà rẹ̀; kì í ṣe olùkọ́ kíláàsì ní pàtàkì.
- source_word: ἡμῶν
  choice: wa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà fi ìbáṣepọ̀ olùtọ́jú náà pẹ̀lú “àwa” hàn.
- source_word: γέγονεν
  choice: ti di
  rationale: Ìṣe pípé náà ń tọ́ka sí ohun tó ṣẹlẹ̀ tẹ́lẹ̀ tí ipò rẹ̀ sì ń bá a lọ; “ti di” mú agbára yẹn jáde ní Yorùbá.
- source_word: εἰς Χριστόν
  choice: títí dé Mèsáyà
  rationale: Nínú àyíká yìí, εἰς lè fi Mèsáyà hàn gẹ́gẹ́ bí ibi ìparí tàbí àfojúsùn iṣẹ́ ìtọ́jú òfin; ìtumọ̀ yìí jẹ́ kedere, a sì pa àwọn ìtumọ̀ mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Χριστός ní agbára oyè níhìn-ín; “Mèsáyà” fi oyè ẹni àmì òróró náà hàn dípò lílo “Kristi” bí ẹni pé orúkọ lásán ni.
- source_word: ἵνα
  choice: kí
  rationale: ἵνα ń bẹ̀rẹ̀ gbólóhùn tó sọ ète; “kí” ni ọ̀nà Yorùbá àdánidá láti mú ète náà jáde.
- source_word: ἐκ πίστεως
  choice: nípa ìgbàgbọ́
  rationale: Gbólóhùn náà ń sọ ọ̀nà tàbí ìpìlẹ̀ ìdáláre; “nípa ìgbàgbọ́” jẹ́ kedere láìfi àlàyé ẹ̀kọ́ ìsìn míì kún un.
- source_word: δικαιωθῶμεν
  choice: kí a lè dá wa láre
  rationale: Ìsọ̀rọ̀ aláìdárúkọ ẹni tó ṣe iṣẹ́ yìí pa ìṣe àfipá Gíríìkì mọ́, ó sì fi ìtumọ̀ ìdájọ́ “dá láre” hàn.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ εἰς Χριστόν nípa ipa òfin
  choice: títí dé Mèsáyà
  alternative: sí Mèsáyà; láti darí wa dé ọ̀dọ̀ Mèsáyà
  rationale: Àyíká Gálátíà 3 tẹnu mọ́ iṣẹ́ òfin ṣáájú dídé ìgbàgbọ́ ní ìbáṣepọ̀ pẹ̀lú Mèsáyà. “Títí dé Mèsáyà” fi àkókò àti ibi ìparí hàn, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ ìtọ́sọ́nà tàbí àfojúsùn mọ́.
- issue: Ẹni tó dá wa láre nínú δικαιωθῶμεν
  choice: A lo ọ̀nà àfipá Yorùbá láìdárúkọ ẹni tó ṣe iṣẹ́ náà.
  alternative: kí Ọlọ́run lè dá wa láre
  rationale: Gíríìkì jẹ́ àfipá, kò sì dárúkọ ẹni tó ṣe iṣẹ́ náà nínú ẹsẹ yìí. Kí a má bàa fi ohun tí kò hàn gbangba sínú ọ̀rọ̀ náà, a pa ìṣọ̀kan yẹn mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; “olùtọ́jú” yàgò fún ìtumọ̀ àṣìṣe pé παιδαγωγός jẹ́ olùkọ́ ilé-ẹ̀kọ́ ní pàtàkì.
