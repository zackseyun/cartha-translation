- from: Nítorí náà, òfin ti di olùtọ́jú[a] wa títí dé Mèsáyà[b], kí a lè dá wa láre nípa ìgbàgbọ́.
  to: Nítorí náà, òfin ti di olùtọ́jú[a] wa títí dé Mèsáyà[b], kí a lè jẹ́ ẹni tí a dá láre nípa ìgbàgbọ́.
  rationale: The revision changes only the final purpose clause to preserve the Greek passive voice and its unstated agent. It retains the forensic idiom “dá láre,” the faith phrase, the draft’s contextual rendering of εἰς Χριστόν, and both footnote anchors. Footnote a is also lightly smoothed from the unnatural “ní àṣà ìtumọ̀ kan” to “ní ìtumọ̀ ìbílẹ̀,” without changing its content.
