id: GAL.3.29
reference: Galatians 3:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: yo
  text: Bí ẹ̀yin bá sì jẹ́ ti Mèsáyà[a], nígbà náà ẹ̀yin jẹ́ irú-ọmọ Ábúráhámù[b], àwọn ajogún ní ìbámu pẹ̀lú ìlérí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àbí, “Kristi.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ọ̀rọ̀ náà jẹ́ “irú-ọmọ” ní ẹyọ kan, ó sì tún ọ̀rọ̀ tí Pọ́ọ̀lù lò ṣáájú nínú orí yìí sọ. Ó tún lè túmọ̀ sí “ọmọ” tàbí “àwọn àtọmọdọ́mọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: ti Mèsáyà
  rationale: Χριστός jẹ́ orúkọ oyè níhìn-ín, genitive náà sì fi jíjẹ́ tirẹ̀ hàn. ‘Jẹ́ ti Mèsáyà’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé wọ́n jẹ́ tirẹ̀, láìfi àlàyé míì kún un.
- source_word: σπέρμα
  choice: irú-ọmọ
  rationale: ‘Irú-ọmọ’ lè ṣiṣẹ́ gẹ́gẹ́ bí ọ̀rọ̀ àkójọpọ̀, ó sì pa ìsopọ̀ mọ́ àríyànjiyàn Pọ́ọ̀lù nípa ‘irú-ọmọ’ Ábúráhámù ní orí yìí. Ó tún yé òǹkàwé Yorùbá òde òní ju lílo ‘irúgbìn’ lọ fún ènìyàn.
- source_word: κληρονόμοι
  choice: àwọn ajogún
  rationale: ‘Àwọn ajogún’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá ọ̀rọ̀ ogún àti ìdílé mu.
- source_word: κατ’ ἐπαγγελίαν
  choice: ní ìbámu pẹ̀lú ìlérí
  rationale: Ìtumọ̀ yìí pa ìbáṣepọ̀ gbólóhùn náà mọ́ láìpinnu pé ìlérí náà jẹ́ ìpìlẹ̀, òṣùwọ̀n, tàbí ọ̀nà gbígba ogún nìkan.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: Bí ẹ̀yin bá sì ... nígbà náà
  rationale: Ó pa ìṣètò ọ̀rọ̀ àídájú àti àbájáde Pọ́ọ̀lù mọ́, ó sì sọ δέ di àsopọ̀ fẹ́lẹ́fẹ́lẹ́ ‘sì’ ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá kí a túmọ̀ σπέρμα pẹ̀lú ọ̀rọ̀ tó rọrùn fún ‘àwọn àtọmọdọ́mọ’ tàbí kí a pa àwòrán ‘irú-ọmọ’ mọ́.
  choice: irú-ọmọ
  alternative: àwọn àtọmọdọ́mọ
  rationale: ‘Irú-ọmọ’ pa ìsopọ̀ ọ̀rọ̀ àti ẹ̀kọ́ mọ́ pẹ̀lú àríyànjiyàn tó ṣáájú ní Gálátíà 3, níbi tí Pọ́ọ̀lù ti tẹnumọ́ ọ̀rọ̀ náà ní ẹyọ kan.
- issue: Bóyá Χριστοῦ túmọ̀ sí oyè ‘Mèsáyà’ tàbí fọ́ọ̀mù orúkọ ‘Kristi.’
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí àwọn onígbàgbọ́ jẹ́ tirẹ̀; ‘Mèsáyà’ mú ìtumọ̀ oyè náà hàn, nígbà tí àfikún ìsàlẹ̀ ojú ìwé pa àṣàyàn ‘Kristi’ mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ ti ẹ̀dá èdè; a sì pa ìṣòro ìtumọ̀ inú κατ’ ἐπαγγελίαν mọ́ láìṣàlàyé rẹ̀ ju orísun lọ.
