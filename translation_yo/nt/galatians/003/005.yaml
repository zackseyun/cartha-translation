id: GAL.3.5
reference: Galatians 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: yo
  text: 'Nítorí náà, ẹni tí ń pèsè Ẹ̀mí fún yín, tí ó sì ń ṣe àwọn iṣẹ́ ìyanu láàárín yín[a]—ṣé ó ń ṣe bẹ́ẹ̀ nípasẹ̀ àwọn iṣẹ́ òfin, tàbí nípasẹ̀ gbígbọ́ pẹ̀lú ìgbàgbọ́[b]?


    [a] Tàbí “nínú yín.”


    [b] Tàbí “nípasẹ̀ gbígbọ́ nípa ìgbàgbọ́,” tàbí “nípasẹ̀ ìhìn tí a gbọ́ pẹ̀lú ìgbàgbọ́.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nínú yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “nípasẹ̀ gbígbọ́ nípa ìgbàgbọ́,” tàbí “nípasẹ̀ ìhìn tí a gbọ́ pẹ̀lú ìgbàgbọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: ń pèsè
  rationale: Ó fi ìtumọ̀ ìpèsè tí ń bá a lọ hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá láì sọ ọ́ di àlàyé gígùn.
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí
  rationale: Ó tọ́ka sí Ẹ̀mí Ọlọ́run ní pàtó gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì náà, láì fi “Mímọ́” kún ohun tí kò sí ní kedere nínú ẹsẹ yìí.
- source_word: ἐνεργῶν δυνάμεις
  choice: ń ṣe àwọn iṣẹ́ ìyanu
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere fún àwọn iṣẹ́ agbára àtọ̀runwá; “àwọn agbára” nìkan kì í ṣe àdánidá ní àyíká yìí.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó bá àwọn iṣẹ́ ìyanu tí ó ń ṣẹlẹ̀ ní àwùjọ àwọn ará Gálátíà mu. “Nínú yín” tún ṣeé ṣe, a sì pa á mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: ἐξ ἔργων νόμου
  choice: nítorí àwọn iṣẹ́ òfin
  rationale: Ó mú ipa orísun tàbí ìdí tí ἐξ ní nínú ìbéèrè náà jáde ní Yorùbá àdánidá, ó sì pa gbólóhùn Páùlù “àwọn iṣẹ́ òfin” mọ́.
- source_word: νόμου
  choice: òfin
  rationale: Ní àríyànjiyàn Páùlù, ó ń tọ́ka sí Òfin Mósè; Yorùbá lè sọ “òfin” láì fi àmì ìtọ́kasí mìíràn kún un.
- source_word: ἀκοῆς πίστεως
  choice: gbígbọ́ pẹ̀lú ìgbàgbọ́
  rationale: Ó sọ ìyàtọ̀ sí “àwọn iṣẹ́ òfin” ní kedere, ó sì fi hàn pé ìgbàgbọ́ bá gbígbọ́ náà lọ. Nítorí pé ìsopọ̀ àwọn ọ̀rọ̀ Gíríìkì náà lè ní ju òye kan lọ, a pa àwọn òye mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ Yorùbá tó wọ́pọ̀ jù lọ ní àyíká yìí, ó sì bá ìyàtọ̀ tí Páùlù ń ṣe sí iṣẹ́ òfin mu.
theological_decisions:
- issue: Ìtumọ̀ ìsopọ̀ ἀκοῆς πίστεως kò dúró sí ọ̀nà kan ṣoṣo.
  choice: gbígbọ́ pẹ̀lú ìgbàgbọ́
  alternative: gbígbọ́ ìgbàgbọ́; ìhìn tí ẹ gbọ́ pẹ̀lú ìgbàgbọ́
  rationale: Àṣàyàn pàtàkì náà mú ìyàtọ̀ láàárín iṣẹ́ òfin àti gbígbọ́ tí ìgbàgbọ́ bá lọ jáde, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwọn ìtumọ̀ gírámà mìíràn mọ́ láì dá ọ̀ràn ẹ̀kọ́ ìgbàgbọ́ náà parí ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìrísí ìbéèrè àsọyé ti ẹsẹ náà mọ́.
