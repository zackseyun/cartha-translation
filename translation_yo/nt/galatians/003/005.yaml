    [b] Tàbí “nípasẹ̀ gbígbọ́ nípa ìgbàgbọ́,” tàbí “nípasẹ̀ ìhìn tí a gbọ́ pẹ̀lú ìgbàgbọ́.”'
  rationale: Àtúnṣe náà rọ́pò “nítorí” pẹ̀lú “nípasẹ̀” láti mú ipa ἐκ nínú ìbéèrè àsọyé náà hàn dáadáa. Ó tún ṣètò gbolohun náà gẹ́gẹ́ bí ìbéèrè Yorùbá tó rọrùn, ó sì tún àlàyé [b] ṣe kí àwọn ìtumọ̀ mìíràn le wúlò ní Yorùbá, láì pa ìdààmú gírámà Gíríìkì náà rẹ́.
