  to: 'Nítorí náà, ẹni tí ń pèsè Ẹ̀mí fún yín, tí ó sì ń ṣe àwọn iṣẹ́ ìyanu láàárín yín[a]—ṣé ó ń ṣe bẹ́ẹ̀ nípasẹ̀ àwọn iṣẹ́ òfin, tàbí nípasẹ̀ gbígbọ́ pẹ̀lú ìgbàgbọ́[b]?


