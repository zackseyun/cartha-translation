  terminology: “Ẹ̀mí,” “àwọn iṣẹ́ ìyanu,” “àwọn iṣẹ́ òfin,” àti “ìgbàgbọ́” yẹ, wọ́n sì pa ọ̀rọ̀-ìmọ̀ Páùlù mọ́. “Nípasẹ̀” ni a lò fún ìbáṣepọ̀ ἐκ nínú ìbéèrè yìí, láì fi ìtumọ̀ ẹ̀kọ́ kan kún un.
