  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: yo
  text: Kristi[a] rà wá padà kúrò nínú ègún òfin, nípa dídi ègún nítorí wa[b], nítorí a ti kọ ọ́ pé[c], “Ègún ni fún gbogbo ẹni tí ó rọ̀ mọ́ igi.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Mèsáyà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “fún wa”; ó sì ṣeé ṣe kí ó túmọ̀ sí “ní ipò wa.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “nítorí pé a kọ ọ́ pé.”
    reason: alternative_reading
  - marker: d
    text: Ọ̀rọ̀ Gíríìkì ξύλον túmọ̀ ní tààrà sí “igi” tàbí ohun tí a fi igi ṣe; “igi” pa ọ̀rọ̀ inú Ìwé Mímọ́ tí a fa yọ mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Kristi
  rationale: “Kristi” ni ọ̀rọ̀ àkọlé tí ó ti wọ́pọ̀, tí ó sì yé àwọn òǹkàwé Yorùbá; ó ń tọ́ka sí ẹni tí a fòróró yàn gẹ́gẹ́ bí Mèsáyà.
- source_word: ἐξηγόρασεν
  choice: rà wá padà kúrò lábẹ́
  rationale: Ó pa àwòrán ìràpadà mọ́, ó sì sọ ìdáǹdè kúrò nínú agbára ègún ní Yorùbá àdánidá.
- source_word: κατάρας τοῦ νόμου
  choice: ègún òfin
  rationale: Ó pa ìtumọ̀ ìdájọ́ àti májẹ̀mú ọ̀rọ̀ Gíríìkì mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: γενόμενος ... κατάρα
  choice: nípa dídi ẹni ègún
  rationale: “Nípa dídi” fi iṣẹ́ participle hàn gẹ́gẹ́ bí ọ̀nà tí ìràpadà fi ṣẹlẹ̀; “ẹni ègún” jẹ́ Yorùbá àdánidá tí ó pa agbára predicate noun náà mọ́.
- source_word: ὑπὲρ ἡμῶν
  choice: nítorí wa
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti ὑπέρ mọ́—fún àǹfààní wa tàbí ní ipò wa—láìyanju ìbéèrè ẹ̀kọ́ ìgbàgbọ́ náà nínú ọ̀rọ̀ pàtàkì.
- source_word: ὅτι γέγραπται
  choice: nítorí a ti kọ ọ́ pé
  rationale: Ó mú agbára ìdí tàbí àlàyé ὅτι jáde ní Yorùbá tí ó rọrùn.
- source_word: Ἐπικατάρατος
  choice: Ẹni ègún ni
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ènìyàn kan wà lábẹ́ ègún, tí ó sì pa ìtẹnumọ́ gbolohun náà mọ́.
- source_word: κρεμάμενος ἐπὶ ξύλου
  choice: tí a so kọ́ sórí igi
  rationale: Passive “a so kọ́” bá àyíká ìtọ́kasí sí Diutarónómì mu; “igi” pa ìsopọ̀ pẹ̀lú ọ̀rọ̀ Ìwé Mímọ́ náà mọ́, bí ó tilẹ̀ jẹ́ pé ξύλον tún lè túmọ̀ sí ohun tí a fi igi ṣe.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ὑπὲρ ἡμῶν nínú èdè ètùtù
  choice: nítorí wa
  alternative: fún wa; ní ipò wa
  rationale: “Nítorí wa” fi àǹfààní àti aṣojú hàn, ṣùgbọ́n kò fi dandan mú kí ọ̀rọ̀ náà túmọ̀ sí àyípadà ipò nìkan.
- issue: Kristi “di ègún”
  choice: nípa dídi ẹni ègún
  alternative: nípa jíjẹ́ ẹni tí a fi gégùn-ún
  rationale: Ìtumọ̀ pàtàkì pa ìyàlẹ́nu àti líle ọ̀rọ̀ Pọ́ọ̀lù mọ́, kò sì sọ ọ́ di àlàyé ẹ̀kọ́ kan tí ó dín kù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. “Kristi” ni a yan dípò àtúmọ̀ àkọlé tuntun nítorí ó ti fìdí múlẹ̀ nínú èdè Yorùbá. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. A yàgò fún fífi ẹ̀kọ́ ìjọ kan pàtó sínú ὑπέρ.
