id: GAL.3.10
reference: Galatians 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: yo
  text: Nítorí gbogbo àwọn tí wọ́n gbára lé iṣẹ́ òfin wà lábẹ́ ègún[a], nítorí a ti kọ ọ́ pé, “Ègún ni fún olúkúlùkù ẹni tí kò bá tẹ̀síwájú láti ṣe gbogbo ohun tí a kọ sínú ìwé òfin[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n jẹ́ ti iṣẹ́ òfin.”
    reason: alternative_reading
  - marker: b
    text: Ní tààràtà, “olúkúlùkù ẹni tí kò tẹ̀síwájú nínú gbogbo ohun tí a kọ sínú ìwé òfin, láti ṣe wọ́n.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: Nítorí gbogbo àwọn tí
  rationale: “Gbogbo àwọn tí” pa ìtẹnumọ́ ọ̀pọ̀ ènìyàn mọ́, “Nítorí” sì mú ipa àlàyé γάρ jáde.
- source_word: ἐξ ἔργων νόμου
  choice: tí wọ́n jẹ́ ti àwọn iṣẹ́ òfin
  rationale: Èyí tẹ̀ lé ìṣètò ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì pa àìdájú ìtumọ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́ láì fi ìtumọ̀ “gbẹ́kẹ̀ lé” sínú ẹsẹ̀ gẹ́gẹ́ bí ẹni pé ìyẹn nìkan ni ó ṣeé ṣe.
- source_word: ὑπὸ κατάραν
  choice: wà lábẹ́ ègún
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ègún ń ṣàkóso ipò wọn, láì sọ ọ́ di ègún kan pàtó ju bí Gíríìkì ṣe sọ lọ.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Ìtumọ̀ yìí pa ìṣe tí a ti parí tí ó sì ṣì dúró gẹ́gẹ́ bí ohun tí Ìwé Mímọ́ sọ mọ́.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: Ẹni ègún ni olúkúlùkù ẹni tí
  rationale: “Olúkúlùkù” mú agbára gbogbo ènìyàn inú πᾶς jáde; “ẹni ègún” sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tí ègún wà lórí.
- source_word: ἐμμένει
  choice: dúró ṣinṣin nínú
  rationale: Ó fi ìtẹ̀síwájú àti ìfaradà nínú ìgbọràn hàn, ó sì sún mọ́ àwòrán “dídúró nínú” tí ọ̀rọ̀ Gíríìkì ní.
- source_word: πᾶσιν τοῖς γεγραμμένοις
  choice: nínú gbogbo ohun tí a kọ
  rationale: Ó pa ìtẹnumọ́ “gbogbo” mọ́, ó sì sọ ohun tí ẹni náà gbọ́dọ̀ dúró nínú rẹ̀ ní Yorùbá tó ṣe kedere.
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: sínú ìwé òfin
  rationale: “Ìwé òfin” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá àyíká májẹ̀mú àti Ìwé Mímọ́ mu.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: láti ṣe wọ́n
  rationale: Ó pa ìtumọ̀ infinitive Gíríìkì àti ìgbọràn nípa ṣíṣe àwọn ohun tí a kọ mọ́.
theological_decisions:
- issue: Ìtumọ̀ ἐξ ἔργων νόμου
  choice: tí wọ́n jẹ́ ti àwọn iṣẹ́ òfin
  alternative: tí wọ́n gbẹ́kẹ̀ lé àwọn iṣẹ́ òfin
  rationale: Ọ̀rọ̀ náà ní ìjìnlẹ̀ ẹ̀kọ́ ìgbàgbọ́ nínú Pọ́ọ̀lù. Ìtumọ̀ tó sún mọ́ ìṣètò Gíríìkì pa ìforígbárí àti àìdájú tó wà nínú rẹ̀ mọ́, dípò kí a pinnu rẹ̀ sí ìgbẹ́kẹ̀lé nìkan nínú ẹsẹ̀.
- issue: Ìbáṣepọ̀ ἐμμένει àti τοῦ ποιῆσαι αὐτά
  choice: kò dúró ṣinṣin nínú gbogbo ohun ... láti ṣe wọ́n
  alternative: kò tẹ̀ síwájú láti ṣe gbogbo ohun ...
  rationale: 'A pa ìṣètò àti ìtẹnumọ́ orísun mọ́: dídúró nínú gbogbo ohun tí a kọ, pẹ̀lú ète tàbí àbájáde ṣíṣe wọn. A kò dín ìbéèrè náà kù sí ìgbọràn lẹ́ẹ̀kọ̀ọ̀kan.'
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “àwọn iṣẹ́ òfin” láti pa ọ̀pọ̀ ἔργων mọ́, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìjọ kan pàtó.
