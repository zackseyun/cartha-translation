id: GAL.3.2
reference: Galatians 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: yo
  text: 'Ohun kan ṣoṣo yìí ni mo fẹ́ mọ̀ láti ọ̀dọ̀ yín: Ṣé ẹ gba Ẹ̀mí nípasẹ̀ iṣẹ́ òfin, tàbí nípasẹ̀ gbígbọ́ pẹ̀lú ìgbàgbọ́?[b][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ gbígbọ́ ìgbàgbọ́”; gbólóhùn náà tún lè túmọ̀ sí gbígbọ́ ìhìn náà pẹ̀lú ìgbàgbọ́.
    reason: alternative_reading
  - marker: b
    text: “Ìṣòtítọ́” jẹ́ ìtumọ̀ mìíràn tí kò ṣeeṣe bẹ́ẹ̀ fún “ìgbàgbọ́” níbí, ṣùgbọ́n àwọn kan máa ń gbé e yẹ̀ wò nítorí pé àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà kúkúrú.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: Ohun kan ṣoṣo yìí
  rationale: Ó pa ìtẹnumọ́ tí Pọ́ọ̀lù fi sí iwájú mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: θέλω μαθεῖν
  choice: ni mo fẹ́ mọ̀
  rationale: Nínú ìbéèrè yìí, ‘fẹ́ mọ̀’ sọ èrò μαθεῖν ní Yorùbá àdánidá ju ìtumọ̀ gígúnná lọ.
- source_word: ἀφ’ ὑμῶν
  choice: láti ọ̀dọ̀ yín
  rationale: Ó fi ọ̀rọ̀-ìṣáájú àti arọ́pò-orúkọ ọ̀pọ̀ hàn ní kedere.
- source_word: ἐξ ἔργων νόμου
  choice: nípa àwọn iṣẹ́ òfin
  rationale: Ó pa ìyàtọ̀ ọ̀nà tàbí ìpìlẹ̀ gbígba mọ́; a kò fi àfihàn ‘òfin náà’ kún un nítorí kò sí atọ́ka nínú Gíríìkì.
- source_word: τὸ πνεῦμα
  choice: Ẹ̀mí
  rationale: Ọ̀rọ̀ yìí tọ́ka sí Ẹ̀mí Ọlọ́run nínú àyíká Gálátíà 3; lẹ́tà ńlá ń fi atọ́ka yẹn hàn láìfi ‘Mímọ́’ tí kò sí nínú Gíríìkì kún un.
- source_word: ἐλάβετε
  choice: ẹ̀yin fi gba
  rationale: Ó fi ìṣe àkókò tí ó ti kọjá hàn, ó sì bá ìbéèrè Yorùbá mu; ‘ẹ̀yin’ tún mú ẹni tí a ń béèrè lọ́wọ́ ṣe kedere.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: nípa gbígbọ́ pẹ̀lú ìgbàgbọ́
  rationale: Ó mú ìtumọ̀ tó ṣeé ṣe jù lọ jáde ní Yorùbá tó ṣe kedere, ṣùgbọ́n a pa ìkópa gírámà tí ó lè ní ju ìtumọ̀ kan lọ mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ nínú àyíká yìí; ‘ìṣòtítọ́’ kò ṣeé ṣe tó bẹ́ẹ̀, ṣùgbọ́n a mẹ́nu kàn án nínú àlàyé.
theological_decisions:
- issue: Ohun tí ‘Ẹ̀mí’ ń tọ́ka sí
  choice: Ẹ̀mí Ọlọ́run tí àwọn onígbàgbọ́ gba
  alternative: Ìrírí tàbí agbára ẹ̀mí lápapọ̀
  rationale: Àyíká Gálátíà 3 ń sọ nípa Ẹ̀mí tí Ọlọ́run fún àwọn ará Gálátíà; síbẹ̀ a kò fi ‘Mímọ́’ kún ẹsẹ̀ náà nítorí ọ̀rọ̀ yẹn kò hàn nínú Gíríìkì.
- issue: Ìtumọ̀ ἀκοῆς πίστεως
  choice: gbígbọ́ pẹ̀lú ìgbàgbọ́
  alternative: gbígbọ́ ìhìn ìgbàgbọ́; tàbí gbígbọ́ tí ó ti inú ìgbàgbọ́ wá
  rationale: Àkójọpọ̀ gírámà Gíríìkì kúkúrú, ó sì lè tọ́ka sí gbígbọ́ ìhìn náà pẹ̀lú ìgbàgbọ́ tàbí sí ohun tí a gbọ́; àlàyé pa àìdánilójú yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún òǹkàwé òde òní. A lo ‘ẹ̀yin’ nítorí arọ́pò-orúkọ Gíríìkì jẹ́ ọ̀pọ̀, a sì pa ìbéèrè àsọyé Pọ́ọ̀lù mọ́.
