revisions:
- from: 'Ohun kan ṣoṣo yìí ni mo fẹ́ mọ̀ láti ọ̀dọ̀ yín: Ṣé nípa àwọn iṣẹ́ òfin ni ẹ̀yin fi gba Ẹ̀mí, tàbí nípa gbígbọ́ pẹ̀lú ìgbàgbọ́?[a][b]'
  to: 'Ohun kan ṣoṣo yìí ni mo fẹ́ mọ̀ láti ọ̀dọ̀ yín: Ṣé ẹ gba Ẹ̀mí nípasẹ̀ iṣẹ́ òfin, tàbí nípasẹ̀ gbígbọ́ pẹ̀lú ìgbàgbọ́?[b][a]'
  rationale: A rọ́pò ‘nípa’ pẹ̀lú ‘nípasẹ̀’ láti fi ìtumọ̀ ọ̀nà/ìpìlẹ̀ ἐξ hàn. A tún ṣe àtúnṣe àlàyé [a] kí ó má bàa yan ìtumọ̀ kan fún ἀκοῆς πίστεως nígbà tí Gíríìkì ṣì ń gba ìtumọ̀ ju ọ̀kan lọ, a sì tún gbé àmì [b] sún mọ́ ‘ìgbàgbọ́.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:31:16Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń mú ìbéèrè àsọyé Pọ́ọ̀lù, ìyàtọ̀ láàárín iṣẹ́ òfin àti gbígbọ́ pẹ̀lú ìgbàgbọ́, àti ‘Ẹ̀mí’ gẹ́gẹ́ bí ọ̀rọ̀ tó ní atọ́ka hàn dáadáa. Síbẹ̀, ‘nípa’ lè túmọ̀ sí ‘nípa/kíkọ̀rọ̀ nípa’ ní Yorùbá, níbi tí Gíríìkì ti ń sọ ọ̀nà tàbí ìpìlẹ̀ gbígba; ‘nípasẹ̀’ péye sí i.
  naturalness: Ọ̀rọ̀ àkọ́kọ́ jẹ́ Yorùbá boṣewa tó ṣeé kà. Àtúnṣe kékeré sí ‘nípasẹ̀’ ń mú ìbáṣepọ̀ ohun èlò/ọ̀nà náà hàn kedere. Àlàyé [a] àtijọ́ (‘gbígbọ́ tí ó ti inú ìgbàgbọ́ wá’) kò jẹ́ ọ̀nà Yorùbá tó dára fún yíyọ àìdánilójú gírámà Gíríìkì náà jáde.
  terminology: ‘Ẹ̀mí,’ ‘iṣẹ́ òfin,’ àti ‘ìgbàgbọ́’ jẹ́ àwọn ìpinnu ọ̀rọ̀ tó yẹ. A kò fi ‘Mímọ́’ tàbí ìtumọ̀ ẹ̀kọ́ ìjọsìn mìíràn kún ‘Ẹ̀mí.’ Àmì [b] yẹ kí ó wà lẹ́gbẹ̀ẹ́ ‘ìgbàgbọ́,’ ibi tí ìtumọ̀ ọ̀rọ̀ náà wà, dípò kí ó wà ní òpin gbolóhùn pẹ̀lú [a].
  issues:
  - severity: medium
    issue: ‘nípa àwọn iṣẹ́ òfin’
    rationale: ‘Nípa’ sábà máa ń túmọ̀ sí ‘concerning/about’ ní Yorùbá. ‘Nípasẹ̀ iṣẹ́ òfin’ ń fi ọ̀nà tàbí ìpìlẹ̀ tí ἐκ ń samí sí hàn dáadáa.
  - severity: low
    issue: Ọ̀rọ̀ ìsàlẹ̀ [a]
    rationale: ‘Gbigbọ́ tí ó ti inú ìgbàgbọ́ wá’ ń ṣàlàyé gbolóhùn náà ní ọ̀nà kan dípò kí ó pa ìkójọpọ̀ ἀκοῆς πίστεως tí ó ṣókùnkùn díẹ̀ mọ́. ‘Gbigbọ́ ìgbàgbọ́’ jẹ́ ìtumọ̀ tó sún mọ́ ẹ̀dà ọ̀rọ̀ náà, nígbà tí apá kejì àlàyé náà ń fúnni ní ìtumọ̀ tó ṣeé ṣe.
  - severity: low
    issue: Ìpò àwọn àmì ìsàlẹ̀
    rationale: Àmì lexical [b] yẹ kí ó tẹ̀lé ‘ìgbàgbọ́’; àmì [a] lè dúró ní òpin gbolóhùn fún àṣàyàn ìtumọ̀ gbogbo àkójọpọ̀ náà.
