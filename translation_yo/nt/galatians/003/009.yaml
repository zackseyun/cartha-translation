id: GAL.3.9
reference: Galatians 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: yo
  text: Nítorí náà, a bùkún àwọn tí wọ́n jẹ́ ti ìgbàgbọ́ pẹ̀lú Ábúráhámù olóòótọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “pẹ̀lú Ábúráhámù ẹni tí ó gbàgbọ́” tàbí “pẹ̀lú Ábúráhámù onígbàgbọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ìjiyàn tí ó ṣáájú, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: οἱ ἐκ πίστεως
  choice: àwọn tí í ṣe ti ìgbàgbọ́
  rationale: Ó pa ìtumọ̀ pé ìgbàgbọ́ ni ó ń dá irú àwọn ènìyàn yìí mọ̀ mọ́, láì sọ ọ́ di ìṣe lásán.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, πίστις ń tọ́ka sí gbígbàgbọ́ tàbí ìgbẹ́kẹ̀lé, kì í ṣe ìwà olóòótọ́ ní pàtàkì.
- source_word: εὐλογοῦνται
  choice: ni a ń bù kún
  rationale: Ìtumọ̀ yìí pa ohùn àfarawà àti ìṣe tí ó wà ní àsìkò ìsinsìnyí mọ́, láì fi ẹni tí ń bù kún kún ọ̀rọ̀ Gíríìkì.
- source_word: σὺν
  choice: papọ̀ pẹ̀lú
  rationale: Ó sọ ní kedere pé àwọn onígbàgbọ́ ń pín ìbùkún kan náà pẹ̀lú Ábúráhámù.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: Ábúráhámù olóòótọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti túmọ̀ ajẹtífù πιστός, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ míì pé ẹni tí ó gbàgbọ́ mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ πιστός nípa Ábúráhámù nínú àyíká ọ̀rọ̀ tí ó dá lórí ìgbàgbọ́
  choice: Ábúráhámù olóòótọ́
  alternative: Ábúráhámù ẹni tí ó gbàgbọ́; Ábúráhámù onígbàgbọ́
  rationale: πιστός lè túmọ̀ sí ẹni olóòótọ́ tàbí ẹni tí ó gbàgbọ́. Ọ̀rọ̀ àkọ́kọ́ lo ìtumọ̀ Yorùbá tí ó rọrùn, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé kò jẹ́ kí ìtumọ̀ tó bá àríyànjiyàn mu sọnù.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti àdánidá, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn náà pa ìṣètò èrò Gíríìkì mọ́ láì jẹ́ kí ó le fún òǹkàwé òde òní.
