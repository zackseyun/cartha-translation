  to: Nítorí náà, a bùkún àwọn tí wọ́n jẹ́ ti ìgbàgbọ́ pẹ̀lú Ábúráhámù olóòótọ́.[a]
  rationale: Àtúnṣe náà ṣàtúnṣe ìkọ̀wé ọ̀rọ̀-ìṣe "bùkún," yọ ìmọ̀ ìṣe-tí-ń-lọ lọ́wọ́ tí kò pọndandan, ó sì mú ìṣètò gbólóhùn náà rọrùn ní Yorùbá. Ó pa gbogbo ìtumọ̀ Gíríìkì mọ́, pàápàá ìmúrasílẹ̀ ti πιστός, tí àlàyé ìsàlẹ̀ ojú ìwé sì ń dáàbò bo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:31:20Z'
