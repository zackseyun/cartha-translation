  source_fidelity: Ìtumọ̀ náà mú ìfẹ̀hàn ìparí ọ̀rọ̀ (ὥστε), ìdánimọ̀ àwọn tí ó jẹ́ ti ìgbàgbọ́, ohùn àfarawà ti εὐλογοῦνται, àti ìbáṣepọ̀ σὺν mọ́ dáadáa. Ṣùgbọ́n ìkọ̀wé ọ̀rọ̀-ìṣe náà yẹ kí ó jẹ́ "bùkún" gẹ́gẹ́ bí ọ̀rọ̀ kan, kì í ṣe "bù kún."
