id: GAL.3.18
reference: Galatians 3:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: yo
  text: Nítorí bí ogún náà bá ti inú òfin wá, kò tún ti inú ìlérí wá mọ́; ṣùgbọ́n Ọlọ́run ti fi ogún náà fún Ábúráhámù lọ́fẹ̀ẹ́ nípasẹ̀ ìlérí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ṣùgbọ́n Ọlọ́run ti fi ogún náà fún Ábúráhámù nípasẹ̀ ìlérí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κληρονομία
  choice: ogún
  rationale: “Ogún” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ajogún ń gbà, ó sì bá ìjiyàn Paulu nípa ohun tí a rí gbà gẹ́gẹ́ bí ajogún mu.
- source_word: ἐκ νόμου
  choice: ti inú òfin wá
  rationale: Ó pa èrò orísun tàbí ìpìlẹ̀ inú ἐκ mọ́, ó sì jẹ́ kí ìtakora pẹ̀lú “ti inú ìlérí wá” hàn kedere.
- source_word: ἐπαγγελίας
  choice: ìlérí
  rationale: Yorùbá kò nílò àmì àìlópìn bíi “a”; “ìlérí” dá èrò náà dúró láìfi ohun tí Gíríìkì kò sọ kún un.
- source_word: οὐκέτι
  choice: kò tún ... mọ́
  rationale: Ìṣètò yìí ni ọ̀nà Yorùbá àdánidá láti sọ “kò ... mọ́,” ó sì fi ìyọkúrò tí Paulu ń sọ hàn.
- source_word: δι’ ἐπαγγελίας
  choice: nípasẹ̀ ìlérí
  rationale: “Nípasẹ̀” pa ipa irinṣẹ́ tàbí ọ̀nà tí διά ní mọ́, ó sì jẹ́ kí ìyàtọ̀ sí òfin ṣe kedere.
- source_word: κεχάρισται
  choice: ti fi oore-ọ̀fẹ́ fún
  rationale: Ó mú ìtumọ̀ fífúnni lọ́fẹ̀ẹ́ tàbí pẹ̀lú oore inú χαρίζομαι jáde, nígbà tí “ti ... fún” ń ṣàfihàn ipò pípé ọ̀rọ̀-ìṣe náà.
- source_word: τῷ ... Ἀβραὰμ
  choice: fún Ábúráhámù
  rationale: “Fún” fi Ábúráhámù hàn gẹ́gẹ́ bí ẹni tí ó gba ohun tí Ọlọ́run fi fún un.
theological_decisions:
- issue: Bóyá kí ìtumọ̀ oore-ọ̀fẹ́ inú χαρίζομαι hàn gbangba
  choice: “ti fi oore-ọ̀fẹ́ fún”
  alternative: “ti fi fún” tàbí “ti fi lọ́rẹ”
  rationale: Yíyan yìí pa àwọ̀ ìtumọ̀ fífúnni lọ́fẹ̀ẹ́ mọ́, ó sì ṣe àtìlẹ́yìn fún ìtakora láàárín òfin àti ìlérí láìfi ẹ̀kọ́ ìjọ kan pàtó kún un.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. Ìṣètò “ti inú ... wá” pa ìfararora ìjiyàn Gíríìkì mọ́, “fi oore-ọ̀fẹ́ fún” sì mú àwọ̀ χαρίζομαι jáde ní èdè àdánidá.
