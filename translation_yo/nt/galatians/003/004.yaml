  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: yo
  text: Ṣé ẹ jìyà nǹkan púpọ̀ bẹ́ẹ̀ lásán?—bí ó bá jẹ́ pé lásán ni lóòótọ́[a].
  philosophy: optimal-equivalence
  footnotes:
