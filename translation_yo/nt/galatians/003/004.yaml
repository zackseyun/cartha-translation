    text: Tàbí, “Ṣé ẹ ti ní ìrírí nǹkan púpọ̀ bẹ́ẹ̀ lásán?”
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural expression for “so many things” with idiomatic Yoruba and removes the unnecessary perfect marker from the main rendering. It otherwise preserves the source’s rhetorical question, repeated “in vain,” and guarded emphatic conclusion.
