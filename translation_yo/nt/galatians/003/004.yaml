translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó ní iyì, pẹ̀lú àmì ohùn ní ibi tó yẹ. A lo “ẹ” gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ fún àwọn ará Gálátíà. Ìbéèrè àsọyé àti àtúnwí “lásán” pa ìtẹnumọ́ àti ìṣọ́ra inú Gíríìkì mọ́.
