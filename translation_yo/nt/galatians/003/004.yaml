revisions:
- from: Ṣé ẹ ti jìyà ohun púpọ̀ báyẹn lásán?—bí ó bá jẹ́ pé lásán ni lóòótọ́[a].
  to: Ṣé ẹ jìyà nǹkan púpọ̀ bẹ́ẹ̀ lásán?—bí ó bá jẹ́ pé lásán ni lóòótọ́[a].
  rationale: The revision replaces an unnatural expression for “so many things” with idiomatic Yoruba and removes the unnecessary perfect marker from the main rendering. It otherwise preserves the source’s rhetorical question, repeated “in vain,” and guarded emphatic conclusion.
  reviewer_model: gpt-5.6-terra
