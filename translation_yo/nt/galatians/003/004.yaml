lexical_decisions:
- source_word: τοσαῦτα
  choice: ohun púpọ̀ báyẹn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ aláìlẹ́mìí ọ̀pọ̀ yìí ń tọ́ka sí gbogbo ohun púpọ̀ tí àwọn ará Gálátíà ti la kọjá, ó sì pa ìtumọ̀ ọ̀pọ̀ mọ́.
- source_word: ἐπάθετε
  choice: ẹ ti jìyà
  rationale: πάσχω lè túmọ̀ sí jíjìyà tàbí ní fífẹ̀ sí i, níní ìrírí ohun kan. Nínú àyíká ọ̀rọ̀ nípa ìnira tó bá ìgbàgbọ́ wọn rìn, “jìyà” mú agbára ọ̀rọ̀ Pọ́ọ̀lù jáde dáadáa; àṣàyàn tó gbòòrò sí i wà nínú àlàyé ìsàlẹ̀.
- source_word: εἰκῇ
  choice: lásán
  rationale: “Lásán” sọ ìṣe tí kò ní èrè tàbí àǹfààní jáde ní Yorùbá àdánidá, ó sì tún farahàn ní ẹ̀ẹ̀kejì láti pa ìtẹnumọ́ orísun mọ́.
- source_word: εἴ γε
  choice: bí ó bá jẹ́ pé
  rationale: Gbólóhùn yìí pa ìṣọ́ra àti ìyemeji inú ìbéèrè àsọyé Pọ́ọ̀lù mọ́, láì sọ ohun tí ó fi sílẹ̀ ní àìdánilójú di ohun tó dájú.
- source_word: καὶ
  choice: lóòótọ́
  rationale: Níbí, καὶ ń fún gbólóhùn ìkẹyìn ní ìtẹnumọ́. “Lóòótọ́” jẹ́ ọ̀nà Yorùbá tó ṣe déédé láti fi ìtẹnumọ́ náà hàn.
