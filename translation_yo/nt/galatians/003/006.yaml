id: GAL.3.6
reference: Galatians 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: yo
  text: Gẹ́gẹ́ bí Ábúráhámù ti gba Ọlọ́run gbọ́, a sì kà á sí òdodo fún un,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Gẹ́gẹ́ bí
  rationale: Ó pa agbára ìfiwéra tí Pọ́ọ̀lù fi ń mú àpẹẹrẹ Ábúráhámù wọ inú àríyànjiyàn rẹ̀ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: Ἀβραὰμ
  choice: Ábúráhámù
  rationale: Orúkọ tí ó ti wọ́pọ̀ nínú àṣà ìtumọ̀ Bíbélì Yorùbá.
- source_word: ἐπίστευσεν τῷ θεῷ
  choice: gba Ọlọ́run gbọ́
  rationale: Èyí túmọ̀ dative object náà ní tààrà, pé Ábúráhámù gba ohun tí Ọlọ́run sọ gbọ́; kò fi ìtumọ̀ àfikún ‘ní ìgbàgbọ́ nínú Ọlọ́run’ sí i.
- source_word: ἐλογίσθη αὐτῷ
  choice: a sì kà á ... fún un
  rationale: Ìṣe aláìlórúkọ ‘a kà’ pa passive náà mọ́, ‘fún un’ sì fi ẹni tí a kà á fún hàn. Àrọ́pò ‘á’ ń tọ́ka sí ìgbàgbọ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, gẹ́gẹ́ bí àyọkà Jẹ́nẹ́sísì tí Pọ́ọ̀lù ń lò.
- source_word: εἰς δικαιοσύνην
  choice: sí òdodo
  rationale: ‘Òdodo’ ni ọ̀rọ̀ Yorùbá tó mọ́, tó ní ọlá, tí ó sì lè gbé ìtumọ̀ ipò títọ́ àti ìwà títọ́ láì fi ipa yan ìtumọ̀ ẹ̀kọ́ kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú àyọkà Pọ́ọ̀lù
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ bá ọ̀rọ̀ nípa ohun tí a kà fún Ábúráhámù mu dáadáa, ó sì yẹra fún dídín ọ̀rọ̀ náà kù sí ìdájọ́ láwùjọ nìkan. Àmọ́, nítorí δικαιοσύνη tún lè ní ìtumọ̀ justice, a pa ‘ìdájọ́ òdodo’ mọ́ sínú àlàyé ìsàlẹ̀.
- issue: Ohun tí ἐλογίσθη tọ́ka sí
  choice: á, ìyẹn ìgbàgbọ́ Ábúráhámù
  alternative: ó, ohun kan tí a kò sọ ní kedere
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe náà sílẹ̀ láìsí subject tí a sọ ní gbangba; àyíká àti àyọkà Jẹ́nẹ́sísì ń tọ́ka sí ìgbàgbọ́ rẹ̀. A lo ‘á’ gẹ́gẹ́ bí Yorùbá àdánidá, láì ṣàlàyé ẹ̀kọ́ ní àfikún.
translation_notes:
  register: Yorùbá boṣewa, tó ní àmì ohùn kíkún níbi tí ó bá jẹ́ àdánidá. Èdè náà jẹ́ kedere, ọlọ́lá, ó sì yẹ fún kíkà ní gbangba. A fi àmì kọ́mà sí òpin láti fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
