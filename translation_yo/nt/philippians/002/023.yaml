  yaml_path: translation/nt/philippians/002/023.yaml
  text: Therefore[a], I hope to send him as soon as I see how things go with me.
translation:
  language: yo
  text: Nítorí náà, mo retí láti rán an lẹ́sẹ̀kẹsẹ̀ lẹ́yìn tí mo bá rí bí ọ̀ràn mi ṣe máa rí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Nítorí náà, mo retí láti rán an ní kété tí mo bá mọ dájú nípa ọ̀ràn mi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: rán an
  rationale: Ọ̀rọ̀ arọ́pò olùṣe yìí tọ́ka sí Timotiu nínú ẹsẹ tó ṣáájú; “an” jẹ́ ọ̀nà àdánidá ní Yorùbá ju “ọkùnrin yìí” lọ.
- source_word: μὲν οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde ọ̀rọ̀ tó ṣáájú hàn, ó sì mú ìrònú náà tẹ̀ síwájú lọ́nà àdánidá.
- source_word: ἐλπίζω πέμψαι
  choice: mo ní ìrètí láti rán
  rationale: Ó pa ìtumọ̀ ìrètí tàbí ìfojúsọ́nà mọ́, láì sọ ọ́ di ète tí a ti pinnu pátápátá.
- source_word: ὡς ἂν ἀφίδω
  choice: ní kété tí mo bá ti rí
  rationale: Gbólóhùn náà tọ́ka sí àkókò ọjọ́ iwájú tí ó sinmi lórí bí Paulu yóò ṣe mọ ipò ọ̀ràn rẹ̀.
- source_word: τὰ περὶ ἐμέ
  choice: bí ọ̀ràn mi yóò ṣe rí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún àwọn nǹkan tó kan ipò àti àyànmọ́ Paulu.
- source_word: ἐξαυτῆς
  choice: ní kété
  rationale: Ó tẹnumọ́ pé Paulu yóò rán Timotiu lọ láìjáfara, lẹ́yìn tó bá ti mọ bí ọ̀ràn rẹ̀ ṣe rí.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá ìgbàlódé, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ọ̀ràn mi” fún τὰ περὶ ἐμέ, a sì pa ìtumọ̀ ìfojúsọ́nà àti kánjúkánjú inú gbólóhùn Gíríìkì mọ́.
