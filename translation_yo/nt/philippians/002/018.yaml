lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: Bákan náà
  rationale: Gbólóhùn yìí ń ṣiṣẹ́ bí ọ̀rọ̀-àpèjúwe, ó sì ń tọ́ka sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ nípa ayọ̀ tí wọ́n ń pín papọ̀. “Bákan náà” jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ náà mọ́.
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin náà
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ὑμεῖς ní ìtẹnumọ́ níbí, καὶ sì ní ìtumọ̀ “náà”; “ẹ̀yin náà” fi hàn pé àwọn ará Fílípì náà gbọ́dọ̀ kópa nínú ayọ̀ náà.
- source_word: χαίρετε
  choice: máa yọ̀
  rationale: Ọ̀rọ̀-ìṣe àṣẹ oníṣe-tẹ̀síwájú, ẹni kejì ọ̀pọ̀. “Máa yọ̀” mú agbára àṣẹ àti èrò ayọ̀ tí ó ń tún fara hàn nínú lẹ́tà náà jáde ní Yorùbá àdánidá.
- source_word: συγχαίρετέ μοι
  choice: bá mi yọ̀
  rationale: Ọ̀rọ̀-ìṣe àkópọ̀ συγχαίρω túmọ̀ sí yíyọ̀ papọ̀ pẹ̀lú ẹlòmíràn; μοι tọ́ka sí Pọ́ọ̀lù gẹ́gẹ́ bí ẹni tí wọn yóò bá yọ̀. “Bá mi yọ̀” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì taárá.
