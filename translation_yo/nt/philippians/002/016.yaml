id: PHP.2.16
reference: Philippians 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: yo
  text: Ẹ di ọ̀rọ̀ ìyè mú ṣinṣin[a], kí n lè ní ohun ìṣògo ní ọjọ́ Mèsáyà[b], pé èmi kò sá lásán, bẹ́ẹ̀ ni èmi kò ṣiṣẹ́ kára lásán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ẹ fi ọ̀rọ̀ ìyè hàn” tàbí “ẹ na ọ̀rọ̀ ìyè síta fún àwọn ẹlòmíràn.”
    reason: lexical_alternative
  - marker: b
    text: 'Ìtumọ̀ àṣà: “ọjọ́ Kristi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: ọ̀rọ̀ ìyè
  rationale: Ó pa ìṣọ̀kan gbólóhùn Gíríìkì mọ́, ó sì lè túmọ̀ sí ọ̀rọ̀ tí ń fúnni ní ìyè àti ọ̀rọ̀ nípa ìyè.
- source_word: ἐπέχοντες
  choice: ẹ di ... mú ṣinṣin
  rationale: Nínú ìṣàn ìkìlọ̀ sí ìgbọ́ràn àti ìdúróṣinṣin, ìtumọ̀ pé kí wọ́n di ọ̀rọ̀ náà mú ṣinṣin bá àyíká mu jù; àṣàyàn pé kí wọ́n gbé e kalẹ̀ fún ẹlòmíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: καύχημα
  choice: ohun ìṣògo
  rationale: Èyí jẹ́ Yorùbá àdánidá fún ohun tí ènìyàn lè fi ṣògo, láì sọ ìṣògo náà di ìgbéraga búburú.
- source_word: ἡμέραν Χριστοῦ
  choice: ọjọ́ Mèsáyà
  rationale: Χριστός ní agbára oyè níbí; “Mèsáyà” pa ìtumọ̀ ẹni àmì òróró àti ìreti ọjọ́ ìkẹyìn mọ́.
- source_word: οὐκ εἰς κενὸν
  choice: kò ... lásán
  rationale: “Lásán” sọ àìní èso tàbí àìní ète tí àṣà Gíríìkì yìí túmọ̀ sí ní Yorùbá tó ṣe kedere.
- source_word: ἔδραμον
  choice: èmi kò sá
  rationale: Ó pa àwòrán eré ìje tí Pọ́ọ̀lù lò fún ipa iṣẹ́ ìránṣẹ́ rẹ̀ mọ́.
- source_word: ἐκοπίασα
  choice: èmi kò ṣiṣẹ́ kára
  rationale: Ó mú ìsapá líle tí κοπιάω ní jáde ní èdè Yorùbá òde òní.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú gbólóhùn ọjọ́ ìkẹyìn
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú “ọjọ́ Mèsáyà,” ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ọba àti ẹni àmì òróró, kì í ṣe bí orúkọ lásán; àṣà ìtumọ̀ “Kristi” ni a fi sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àṣẹ “ẹ” nítorí ἐπέχοντες ń bá ìkìlọ̀ sí gbogbo ìjọ lọ; a tún “èmi” ṣe láti pa ìbáradọ́gba àwọn gbólóhùn méjèèjì mọ́.
