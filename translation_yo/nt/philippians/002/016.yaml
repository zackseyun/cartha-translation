    rationale: Nínú Yorùbá òde òní, “gbé ... kalẹ̀” sábà máa ń ní ìmọ̀ fífi ohun sílẹ̀ tàbí títẹ̀jáde. “Fi ọ̀rọ̀ ìyè hàn” jẹ́ ìbámu tó ṣe kedere fún ìtumọ̀ ìfihàn náà.
