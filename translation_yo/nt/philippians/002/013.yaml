id: PHP.2.13
reference: Philippians 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: yo
  text: Nítorí Ọlọ́run ni ẹni tí ń ṣiṣẹ́ nínú yín láti fẹ́ àti láti ṣiṣẹ́ fún ìfẹ́ inú rere rẹ̀[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ti fífẹ́ àti ní ti ṣíṣiṣẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí ìfẹ́ inú rere rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Nítorí
  rationale: Ó fi ìdí fún ìṣírí inú ẹsẹ tó ṣáájú; “Nítorí” jẹ́ àsopọ̀ àlàyé tó bójú mu ní Yorùbá.
- source_word: ὁ ἐνεργῶν
  choice: ẹni tí ń ṣiṣẹ́
  rationale: Àpilẹ̀kọ̀ pẹ̀lú participle náà ń tọ́ka sí ẹni kan, ìrísí ìsinsìnyí sì fi hàn pé iṣẹ́ náà ń bá a lọ.
- source_word: ἐν ὑμῖν
  choice: nínú yín
  rationale: Ó pa ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ kí a lè lóye rẹ̀ nípa ẹnì kọ̀ọ̀kan tàbí gbogbo ìjọ láìfi ipá yan ọ̀kan.
- source_word: τὸ θέλειν
  choice: kí ẹ fẹ́ láti ṣe
  rationale: Ó sọ ìfẹ́ inú àti ìpinnu láti ṣe ohun kan jáde ní Yorùbá àdánidá, láìdín un kù sí ìmọ̀lára lásán.
- source_word: τὸ ἐνεργεῖν
  choice: kí ẹ sì ṣiṣẹ́
  rationale: Ó pa ìbáṣepọ̀ ọ̀rọ̀ mọ́ pẹ̀lú ἐνεργῶν, ó sì ṣe àfihàn ìṣe gẹ́gẹ́ bí ohun tó bá ìfẹ́ inú lọ.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: fún ìdùnnú rere rẹ̀
  rationale: “Fún” mú ìtumọ̀ ète tàbí àǹfààní inú ὑπέρ jáde; “rẹ̀” tọ́ka sí Ọlọ́run, ẹni tí gbolohun náà dá lé.
theological_decisions:
- issue: Iṣẹ́ Ọlọ́run àti ìfẹ́ inú àti iṣẹ́ ènìyàn
  choice: 'A pa àwọn méjèèjì mọ́: Ọlọ́run ń mú kí àwọn onígbàgbọ́ fẹ́ láti ṣe, kí wọ́n sì ṣiṣẹ́.'
  alternative: Ọlọ́run ń fún wọn ní ìfẹ́ àti agbára láti ṣe.
  rationale: Ọ̀rọ̀ náà sọ pé Ọlọ́run ń ṣiṣẹ́ nínú wọn ní ti ìfẹ́ inú àti ìṣe; ìtumọ̀ yìí kò dín ipa Ọlọ́run tàbí ojúṣe ènìyàn kù, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ ẹ̀sìn kan pàtó ṣe àlàyé ìbáṣepọ̀ wọn.
- issue: Ìtumọ̀ ὑπὲρ τῆς εὐδοκίας
  choice: fún ìdùnnú rere rẹ̀
  alternative: gẹ́gẹ́ bí ìdùnnú rere rẹ̀
  rationale: ὑπέρ pẹ̀lú genitive lè fi ète tàbí àǹfààní hàn níbí; a fi ọ̀nà yìí sínú ẹsẹ̀, a sì tọ́ka sí ìtumọ̀ míì nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àgbàṣe tí ó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Ọ̀rọ̀-orúkọ arọ́pò “yín/ẹ” lè tọ́ka sí ọ̀pọ̀ ènìyàn ní ẹnì kọ̀ọ̀kan tàbí sí wọn gẹ́gẹ́ bí àwùjọ.
