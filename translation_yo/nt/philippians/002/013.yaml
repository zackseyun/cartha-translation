revisions:
- from: Nítorí Ọlọ́run ni ẹni tí ń ṣiṣẹ́ nínú yín, tí ó ń mú kí ẹ fẹ́ láti ṣe, kí ẹ sì ṣiṣẹ́, fún ìdùnnú rere rẹ̀[a][b].
  to: Nítorí Ọlọ́run ni ẹni tí ń ṣiṣẹ́ nínú yín láti fẹ́ àti láti ṣiṣẹ́ fún ìfẹ́ inú rere rẹ̀[a][b].
  rationale: A rọ́pò ọ̀rọ̀ fún εὐδοκία pẹ̀lú “ìfẹ́ inú rere,” a sì tún ìṣọ̀kan gbolohun náà ṣe kí “fẹ́” àti “ṣiṣẹ́” farahàn ní parallelism tí ó sún mọ́ τὸ θέλειν καὶ τὸ ἐνεργεῖν. “Fún” pa ìmọ̀ ète/àǹfààní ti ὑπέρ mọ́, nígbà tí àlàyé ìsàlẹ̀ ń pa aṣayan “gẹ́gẹ́ bí” mọ́.
