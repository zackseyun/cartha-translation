id: PHP.2.1
reference: Philippians 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: yo
  text: Nítorí náà, bí ìṣírí kan bá wà nínú Mèsáyà, bí ìtùnú kan bá wá láti inú ìfẹ́, bí ìbáṣepọ̀ pẹ̀lú Ẹ̀mí[a] kan bá wà, bí ìfẹ́ni àtọkànwá àti ìyọ́nú bá sì wà,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níní àjọpín nínú Ẹ̀mí”; èyí tí kò fi bẹ́ẹ̀ ṣeé ṣe, “ìbáṣepọ̀ nínú ẹ̀mí.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó ṣe àfihàn ìyọrísí ọ̀rọ̀ Pọ́ọ̀lù láti inú ohun tí ó sọ ṣáájú, ó sì bá èdè Yorùbá ọlọ́wọ̀ mu.
- source_word: παράκλησις
  choice: ìṣírí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí fífúnni ní okun àti ìgboyà, kì í ṣe àṣẹ tàbí ìtùnú ẹ̀dùn-ọkàn nìkan.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: A pa agbára ἐν mọ́ pẹ̀lú “nínú,” a sì tú Χριστός gẹ́gẹ́ bí oyè Mèsáyà ní ibámu pẹ̀lú ìtumọ̀ rẹ̀ nínú àyíká yìí.
- source_word: παραμύθιον
  choice: ìtùnú
  rationale: Ó ń sọ nípa ọ̀rọ̀ tàbí ìṣe tí ń tu ènìyàn nínú; yíyan “ìtùnú” tún jẹ́ kí ó yàtọ̀ sí παράκλησις, “ìṣírí.”
- source_word: ἀγάπης
  choice: láti inú ìfẹ́
  rationale: Ọ̀nà yìí sọ genitive náà ní Yorùbá àdánidá gẹ́gẹ́ bí ìfẹ́ tí ìtùnú náà ti ń jáde wá, láìfi ìtumọ̀ náà há.
- source_word: κοινωνία
  choice: ìdàpọ̀
  rationale: “Ìdàpọ̀” sọ ìbáṣepọ̀ àti àjọṣepọ̀ tímọ́tímọ́ tí ọ̀rọ̀ náà ní nínú àyíká yìí; àṣàyàn “àjọpín” wà nínú àlàyé ìsàlẹ̀.
- source_word: πνεύματος
  choice: Ẹ̀mí
  rationale: Ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni Pọ́ọ̀lù ń tọ́ka sí; síbẹ̀, irú ìbáṣepọ̀ genitive náà kò ṣe kedere pátápátá, nítorí náà a pa àwọn ìtumọ̀ mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: σπλάγχνα
  choice: ìfẹ́ni àtọkànwá
  rationale: Ní ìlò àfiwé, ọ̀rọ̀ náà túmọ̀ sí ìfẹ́ni jíjinlẹ̀ láti inú ọkàn, kì í ṣe ẹ̀yà inú ara ní tààrà.
- source_word: οἰκτιρμοί
  choice: ìyọ́nú
  rationale: “Ìyọ́nú” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àánú tí ènìyàn ń ní sí ẹni tí ó wà nínú ìpọ́njú.
theological_decisions:
- issue: Bóyá πνεύματος ń tọ́ka sí Ẹ̀mí Mímọ́ àti bí a ṣe yẹ kí a sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú κοινωνία
  choice: ìdàpọ̀ Ẹ̀mí
  alternative: níní àjọpín nínú Ẹ̀mí; tàbí, tí kò fi bẹ́ẹ̀ ṣeé ṣe, ìdàpọ̀ nínú ẹ̀mí
  rationale: Nínú àkójọ àwọn ohun rere Kristẹni yìí, ó ṣeé ṣe jù pé Ẹ̀mí Mímọ́ ni a ń tọ́ka sí. Ṣùgbọ́n Gíríìkì kò sọ irú ìbáṣepọ̀ genitive náà ní pàtó, nítorí náà a kò yanju àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A pa ìṣètò àwọn gbólóhùn “bí … bá wà” mọ́ nítorí ẹsẹ yìí jẹ́ ìbẹ̀rẹ̀ gbólóhùn tí ìparí rẹ̀ ń tẹ̀ síwájú ní ẹsẹ 2. A gbé àmì àlàyé [a] sí “Ẹ̀mí,” níbi tí àṣàyàn ìtumọ̀ náà ti jẹ mọ́.
