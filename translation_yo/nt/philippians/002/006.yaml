  source_fidelity: 'Ìtumọ̀ náà fi èrò Gíríìkì náà hàn dáadáa: ìpò Kristi ‘ní ìrísí Ọlọ́run,’ ìdọ́gba pẹ̀lú Ọlọ́run, àti ìtumọ̀ àyíká-ọrọ̀ ti ἁρπαγμός gẹ́gẹ́ bí ohun tí a kò lò fún èrè ara ẹni. Síbẹ̀, ‘ohun tí òun yóò lò’ lè dà bí ìṣe ọjọ́ iwájú, níbi tí Gíríìkì ti ń sọ ohun tí ó kà sí irú ohun kan. ‘Ohun tí ó lè lò’ dá ìfarahàn ọjọ́ iwájú náà dúró, ó sì pa ìtumọ̀ ‘exploit/use for advantage’ mọ́.'
