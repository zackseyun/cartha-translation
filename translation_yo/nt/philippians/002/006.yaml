translation:
  language: yo
  text: Ẹni tí, bí ó tilẹ̀ jẹ́ pé ó wà ní ìrísí Ọlọ́run[a], kò ka ìdọ́gba pẹ̀lú Ọlọ́run[c] sí ohun tí ó lè lò fún àǹfààní ara rẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó wà ní ìrísí Ọlọ́run.” Ọ̀rọ̀ ὑπάρχων lè jẹ́ ìyọ̀ǹda (“bí ó tilẹ̀ jẹ́ pé ó wà”) tàbí kó kan sọ ipò tó wà (“ó wà”).
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ohun tí a lè dì mú” tàbí “ohun tí a lè fi ipá gbà.”
    reason: alternative_reading
  - marker: c
    text: Ní tààrà, “jíjẹ́ dọ́gba pẹ̀lú Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν μορφῇ θεοῦ
  choice: ní ìrísí Ọlọ́run
  rationale: “Ìrísí” pa ọ̀rọ̀ μορφή mọ́ láì fi ìtumọ̀ tóóró bí “ìṣẹ̀dá” tàbí àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ó dé lẹ́yìn sínú ọ̀rọ̀ náà. Ní àyíká yìí, kò túmọ̀ sí ìrísí òde lásán.
- source_word: ὑπάρχων
  choice: bí ó tilẹ̀ jẹ́ pé ó wà
  rationale: Ìtumọ̀ ìyọ̀ǹda yìí mú ìtakora tó wà láàárín ipò Kristi àti ìrẹ̀lẹ̀ rẹ̀ ní ẹsẹ tó tẹ̀ lé hàn; a pa ìtumọ̀ onípò “ó wà” mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: ἁρπαγμὸν
  choice: ohun tí òun yóò lò fún àǹfààní ara rẹ̀
  rationale: Ní àyíká ọ̀rọ̀ náà, gbolohun yìí fi hàn pé Kristi kò lo ipò rẹ̀ fún èrè ara rẹ̀. Nítorí pé “ohun tí a ó dì mú” tàbí “ohun tí a ó já gbà” tún ṣeé gbà gẹ́gẹ́ bí ìtumọ̀, a fi wọ́n sínú àlàyé ìsàlẹ̀.
- source_word: ἡγήσατο
  choice: kò ka ... sí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe fífi èrò tàbí iye kan lé ohun kan lórí.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: jíjẹ́ ẹni tí ó dọ́gba pẹ̀lú Ọlọ́run
  rationale: Ìtumọ̀ yìí ṣàfihàn gbólóhùn aláìlẹ́ni ἴσα ní Yorùbá tó ṣe kedere, ó sì pa èrò ìdọ́gba pẹ̀lú Ọlọ́run mọ́.
theological_decisions:
- issue: Agbára ẹ̀kọ́ nípa Kristi nínú ἐν μορφῇ θεοῦ
  choice: ní ìrísí Ọlọ́run
  alternative: ní ìṣẹ̀dá Ọlọ́run; jíjẹ́ Ọlọ́run nípa ìṣẹ̀dá
  rationale: A pa ọ̀rọ̀ Pọ́ọ̀lù mọ́, láì sọ agbára gíga tí ó ní nípa ẹni tí Kristi jẹ́ di ohun tí kò lágbára, àti láì fi gbólóhùn ẹ̀kọ́ ìgbà tó tẹ̀ lé rọ́pò rẹ̀.
- issue: Ìtumọ̀ ἁρπαγμός ní ìbáṣepọ̀ pẹ̀lú ìdọ́gba Kristi pẹ̀lú Ọlọ́run
  choice: ohun tí òun yóò lò fún àǹfààní ara rẹ̀
  alternative: ohun tí a ó dì mú; ohun tí a ó já gbà
  rationale: Àyíká ẹsẹ 7 ń tẹnu mọ́ fífi ara ẹni fúnni dípò lílo ipò fún èrè ara ẹni. Síbẹ̀, nítorí pé ìtumọ̀ ọ̀rọ̀ náà jẹ́ ọ̀ràn tí a ń jiyàn lé lórí, a pa àwọn ìtumọ̀ míì mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tí ó sì ṣeé lóye ni a lò. “Ìrísí Ọlọ́run” tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì, nígbà tí “lò fún àǹfààní ara rẹ̀” ń sọ agbára àyíká ọ̀rọ̀ náà jáde. Gbólóhùn náà parí pẹ̀lú àmì kọ́má nítorí pé ó ń bá ẹsẹ 7 lọ.
