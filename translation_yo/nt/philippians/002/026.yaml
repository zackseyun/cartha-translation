source:
  edition: SBLGNT
  text: ἐπειδὴ ἐπιποθῶν ἦν πάντας ⸀ὑμᾶς, καὶ ἀδημονῶν διότι ἠκούσατε ὅτι ἠσθένησεν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/026.yaml
  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: yo
  text: nítorí pé ó ń háfẹ́ gbogbo yín, inú rẹ̀ sì bà jẹ́ gidigidi nítorí ẹ ti gbọ́ pé ara rẹ̀ kò yá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ó gbọ́ pé ẹ ti gbọ́ pé ara rẹ̀ kò yá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: nítorí pé
  rationale: Ó fi ìdí tí a fi ń rán Epafíródítù padà hàn, ó sì pa ìtumọ̀ ìdí tàbí okunfa mọ́ ní Yorùbá àdánidá.
- source_word: ἐπιποθῶν ἦν
  choice: ó ń ṣe àárò
  rationale: Àkópọ̀ ọ̀rọ̀ aláìpé pẹ̀lú participle fi ìfẹ́-ọkàn tó ń bá a lọ ní àkókò àtijọ́ hàn. “Ó ń ṣe àárò” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó ń yán hànhàn sí wọn.
- source_word: πάντας ὑμᾶς
  choice: gbogbo yín
  rationale: Ó pa tẹnumọ́ πάντας mọ́, ó sì ṣe kedere pé gbogbo àwọn onígbàgbọ́ ní Fílípì ni ọ̀rọ̀ náà kàn.
- source_word: ἀδημονῶν
  choice: inú rẹ̀ sì bà jẹ́ gidigidi
  rationale: Ó fi ìdààmú ọkàn tó lágbára hàn ju àníyàn kékeré lọ, ní èdè Yorùbá tó wọ́pọ̀, láì sọ ọ́ di ìrora ara.
- source_word: διότι
  choice: nítorí
  rationale: Ó jẹ́ àsopọ̀ tó ń ṣàlàyé okunfa ìdààmú rẹ̀.
- source_word: ἠκούσατε
  choice: ẹ ti gbọ́
  rationale: Ó tú aorist náà sí Yorùbá àdánidá gẹ́gẹ́ bí ohun tó ti dé etí wọn, ó sì pa ẹni kejì ọ̀pọ̀ mọ́.
- source_word: ὅτι ἠσθένησεν
  choice: pé ara rẹ̀ kò yá
  rationale: Ní àyíká yìí, ἀσθενέω ń tọ́ka sí àìsàn ara. “Ara rẹ̀ kò yá” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bójú mu.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún òǹkàwé lásán. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá. Ẹsẹ̀ náà bẹ̀rẹ̀ pẹ̀lú “nítorí pé” láti pa ìbáṣepọ̀ rẹ̀ mọ́ gẹ́gẹ́ bí ìtẹ̀síwájú gbólóhùn inú àyíká tó ṣáájú.
