  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìlànà ẹsẹ̀ náà dáadáa: ìfòfindè pátápátá, àwọn ìsúnniṣe méjì tí a kọ̀, àti ìpè sí ìrẹ̀lẹ̀ nínú bí a ṣe ń wo ẹlòmíràn. Síbẹ̀, “ìmọtara-ẹni-nìkan” ń sọ ìwà ìmọtara-ẹni ní gbogbogbò, nígbà tí ἐριθεία níhìn-ín ní ìtumọ̀ ìfẹ́kúfẹ̀ẹ́/ìfẹ́ ipò ti ara ẹni, tí ó lè mú ìjà tàbí ìpínyà wá. “ìfẹ́kúfẹ̀ẹ́ ti ara ẹni” mú ìsúnniṣe yẹn hàn kedere síi. “ka ... sí ẹni tí ó ga ju ara yín lọ” pa agbára ìfiwéra ὑπερέχοντας ἑαυτῶν mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un.'
  naturalness: Èdè gbolohun náà jẹ́ Yorùbá boṣewa, ó sì bá ìforúkọsílẹ̀ ìwàásù/ìtọ́ni Pọ́ọ̀lù mu. Àtúnṣe kékeré sí “ìfẹ́kúfẹ̀ẹ́ ti ara ẹni” jẹ́ ohun tí òǹkàwé òde òní yóò lóye dáadáa. Àlàyé a àkọ́kọ́ nínú àwòkọ́ṣe náà (“ìgbéraga tí kò ní nǹkan kan nílẹ̀”) kò rọrùn, kò sì jẹ́ àṣàyàn tí ó dára ní Yorùbá; “ògo asán” jẹ́ àṣàyàn tó mọ́, tó sì wúlò.
