source:
  edition: SBLGNT
  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: yo
  text: Ẹ má ṣe ohunkóhun nítorí ìfẹ́kúfẹ̀ẹ́ ti ara ẹni tàbí ìgbéraga asán[a]; ṣùgbọ́n pẹ̀lú ìrẹ̀lẹ̀, kí ẹ máa ka àwọn ẹlòmíràn sí ẹni tí ó ga ju ara yín lọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ògo asán.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kí ẹ máa ka àwọn ẹlòmíràn sí ẹni tí ó ṣe pàtàkì ju ara yín lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: Ẹ má ṣe ohunkóhun
  rationale: Ó sọ ìkìlọ̀ náà ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ‘ẹ má ṣe ohun kankan’ mọ́.
- source_word: κατ’ ἐριθείαν
  choice: nítorí ìmọtara-ẹni-nìkan
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìwà wíwá ire tàbí ipò fún ara ẹni, ní pàtàkì ní ọ̀nà tó lè dá ìyapa sílẹ̀; yíyan yìí mú èrò ìsúnniṣe náà jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: κατὰ κενοδοξίαν
  choice: tàbí ìgbéraga asán
  rationale: Ó fi hàn pé ògo tàbí ìgbéraga yẹn ṣófo, kò ní ìpìlẹ̀ gidi.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: pẹ̀lú ìrẹ̀lẹ̀
  rationale: Ó túmọ̀ dátífù náà gẹ́gẹ́ bí ọ̀nà tàbí ìwà tí a fi ń ṣe ohun tí ó tẹ̀ lé.
- source_word: ἀλλήλους
  choice: àwọn ẹlòmíràn
  rationale: Nínú àṣẹ tí a ń sọ fún ọ̀pọ̀ ènìyàn, gbólóhùn yìí fi ìbáṣepọ̀ ara-ẹni-sí-ara-ẹni hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἡγούμενοι
  choice: kí ẹ máa ka ... sí
  rationale: Ó pa ìtumọ̀ ṣíṣe ìdájọ́ tàbí fífi iye kan ẹni mọ́, ó sì bá ọ̀nà ìṣírí Pọ́ọ̀lù mu.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: ẹni tí ó ga ju ara yín lọ
  rationale: Ó pa agbára ìfiwéra ὑπερέχω mọ́ láì pinnu pé ìyàtọ̀ ìwàláàyè tàbí ẹ̀dá ni; àlàyé ẹsẹ̀ fi ìtumọ̀ ‘ó ṣe pàtàkì jù’ hàn.
theological_decisions:
- issue: Bí a ṣe máa lóye ὑπερέχοντας
  choice: ẹni tí ó ga ju ara yín lọ
  alternative: ẹni tí ó ṣe pàtàkì ju ara yín lọ
  rationale: Ìtumọ̀ àkọ́kọ́ pa àwòrán ìfiwéra Gíríìkì mọ́; àlàyé ẹsẹ̀ sì ṣàfihàn ìtumọ̀ tó ṣeé ṣe láì sọ pé ẹlòmíràn ga jù nípa ẹ̀dá tàbí iye rẹ̀ níwájú Ọlọ́run.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; ìforúkọsílẹ̀ rẹ̀ ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo fọ́ọ̀mù ọ̀pọ̀ ‘ẹ’ nítorí pé ìkìlọ̀ náà ń tọ́ka sí gbogbo ìjọ.
