  rationale: 'Àtúnṣe náà ní ìdí méjì: ó mú ἐριθεία hàn gẹ́gẹ́ bí ìfẹ́kúfẹ̀ẹ́ onímọtara-ẹni dípò ìmọtara-ẹni lásán, ó sì rọ́pò àlàyé a tí kò wọ́pọ̀ pẹ̀lú “ògo asán,” àṣàyàn tó dára, tó sì sún mọ́ ìtumọ̀ ọ̀rọ̀ Gíríìkì náà. A pa ìtumọ̀, ìforúkọsílẹ̀, àti àìdánilójú tí ὑπερέχοντας lè ní mọ́; àlàyé b ń ṣàfihàn ìtumọ̀ ‘ṣe pàtàkì ju’ gẹ́gẹ́ bí àṣàyàn.'
