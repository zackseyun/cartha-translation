  text: ἀλλὰ ἑαυτὸν ἐκένωσεν μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: yo
  text: ṣùgbọ́n ó sọ ara rẹ̀ di òfo[a], nípa gbígba ìrísí ẹrú, àti nípa dídi ẹni tí ó jọ àwọn ènìyàn[b]; a sì rí i ní ìfarahàn gẹ́gẹ́ bí ènìyàn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sọ ara rẹ̀ di ẹni tí kò jẹ́ nǹkan kan.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààrà: “nípa wíwá di ẹni nínú ìjọra àwọn ènìyàn.” Ọ̀rọ̀ “ìjọra” kò túmọ̀ sí pé kò jẹ́ ènìyàn ní tòótọ́.'
    reason: source_clarification
  - marker: c
    text: Ọ̀rọ̀ Gíríìkì fún “ènìyàn” níbí jẹ́ ọ̀rọ̀ àpapọ̀ fún ẹ̀dá ènìyàn, kì í ṣe ọkùnrin nìkan.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ líle hàn sí ọ̀rọ̀ tí ó ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ adversative ní Yorùbá.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: ó sọ ara rẹ̀ di òfo
  rationale: Èyí pa àkàwé ‘sọ di òfo’ mọ́, kò sì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kún un. Àwọn gbólóhùn participle tí ó tẹ̀ lé ń ṣàlàyé bí ìrẹ̀lẹ̀ yìí ṣe ṣẹlẹ̀.
- source_word: μορφὴν δούλου λαβών
  choice: ó gba ìrísí ẹrú
  rationale: ‘Ìrísí’ pa ìtumọ̀ μορφή mọ́, ‘ẹrú’ sì fi ipò ìdè tí δοῦλος túmọ̀ sí hàn ní kíkún ju ‘ìránṣẹ́’ lọ. Fífi participle náà ṣe gbólóhùn tí ó tẹ̀ lé ara rẹ̀ jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: ó sì di ẹni tí ó ní ìjọra àwọn ènìyàn
  rationale: ‘Ó di’ ń tẹ̀ lé γενόμενος ní tààrà, ‘ìjọra’ sì pa ὁμοίωμα mọ́ láìsọ ọ́ di ìfarahàn lásán. ‘Àwọn ènìyàn’ ń ṣàfihàn plural generic ἀνθρώπων.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: nígbà tí a sì rí i ní ìfarahàn bí ènìyàn
  rationale: ‘Ìfarahàn’ fi apá tí a lè rí ti σχῆμα hàn, ó sì yàtọ̀ díẹ̀ sí ‘ìrísí’ tí a lò fún μορφή. ‘Ènìyàn’ jẹ́ generic níbí, kì í ṣe ọkùnrin ní pàtó.
theological_decisions:
- issue: Ìtumọ̀ ἐκένωσεν nínú ọ̀rọ̀ nípa Kristi
  choice: Pa àkàwé náà mọ́ gẹ́gẹ́ bí ‘ó sọ ara rẹ̀ di òfo,’ kí àwọn ọ̀rọ̀ tí ó tẹ̀ lé ṣàlàyé bí ó ṣe ṣe bẹ́ẹ̀.
  alternative: ‘Ó sọ ara rẹ̀ di ẹni tí kò jẹ́ nǹkan kan,’ tàbí ṣíṣe àlàyé rẹ̀ bí fífi àwọn ànímọ́ Ọlọ́run sílẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ ohun tí ó ‘sọ di òfo’ ní tààrà; àwọn participle tí ó tẹ̀ lé tọ́ka sí gbígba ìrísí ẹrú àti dídi ẹni tí ó ní ìjọra ènìyàn. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìfi èrò kan lé e lórí.
- issue: Agbára ọ̀rọ̀ ὁμοίωμα nípa jíjẹ́ ènìyàn
  choice: Lo ‘ìjọra’ láìjẹ́ kí ó túmọ̀ sí pé ó dà bí ènìyàn lásán ṣùgbọ́n kì í ṣe ènìyàn ní tòótọ́.
  alternative: ‘Ìfarawé ènìyàn lásán,’ tàbí ọ̀rọ̀ tí ó sọ ìdánimọ̀ kíkún ní líle ju Gíríìkì lọ.
  rationale: ‘Ìjọra’ pa àṣàyàn ọ̀rọ̀ Pọ́ọ̀lù mọ́. Gbólóhùn tí ó tẹ̀ lé nípa bí a ṣe rí i bí ènìyàn ń fi kún un, kò sì yẹ kí ìtumọ̀ náà yanju ìṣòro ọ̀rọ̀ náà ju orísun lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, tí ó sì ṣeé yé ni a lò. A lo gbólóhùn tí ó tẹ̀ lé ara wọn dípò kí a fipá mú gbogbo participle Gíríìkì wọ inú àkópọ̀ gígùn. ‘Ìrísí’ fún μορφή àti ‘ìfarahàn’ fún σχῆμα ń pa ìyàtọ̀ ọ̀rọ̀ orísun mọ́ bí ó ti ṣeé ṣe ní Yorùbá.
