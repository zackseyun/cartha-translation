  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀ lé Gíríìkì dáadáa ní gbogbogbò: ἐκένωσεν ni a pa mọ́ gẹ́gẹ́ bí àkàwé, μορφή/σχῆμα ni a yà sí ọ̀tọ̀, ẹrú sì yẹ fún δούλου. Síbẹ̀, “ó di ẹni tí ó ní ìjọra àwọn ènìyàn” kì í ṣe ọ̀nà Yorùbá tó rọrùn láti sọ ἐν ὁμοιώματι ἀνθρώπων γενόμενος; ó dà bí ẹni pé ẹni náà ‘ní’ ìjọra kan. Àtúnṣe náà mú ìbáṣepọ̀ participle náà mọ́, ó sì dáa sí i ní Yorùbá.'
  naturalness: “Nípa gbígba … àti nípa dídi …” so àwọn participle Gíríìkì mọ́ mọ́ iṣẹ́ “ó sọ ara rẹ̀ di òfo” ní ọ̀nà Yorùbá tí ó ṣàn. “A sì rí i ní ìfarahàn gẹ́gẹ́ bí ènìyàn” jẹ́ ìfihàn ẹlẹ́gẹ́ ti passive εὑρεθείς, kò sì fi “nígbà tí” kún un láìnídìí.
  terminology: “Ìrísí” fún μορφή, “ẹrú” fún δοῦλος, “ìjọra”/“jọ” fún ὁμοίωμα, àti “ìfarahàn” fún σχῆμα jẹ́ àṣàyàn tó bára mu. “Ènìyàn” jẹ́ ọ̀rọ̀ àpapọ̀ tó yẹ fún ἄνθρωπος; “àwọn ènìyàn” ń pa plural ἀνθρώπων mọ́.
