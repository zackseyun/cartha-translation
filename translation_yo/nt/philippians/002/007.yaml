  to: ṣùgbọ́n ó sọ ara rẹ̀ di òfo[a], nípa gbígba ìrísí ẹrú, àti nípa dídi ẹni tí ó jọ àwọn ènìyàn[b]; a sì rí i ní ìfarahàn gẹ́gẹ́ bí ènìyàn[c].
