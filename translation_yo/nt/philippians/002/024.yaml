  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/024.yaml
  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: yo
  text: Mo ní ìgbẹ́kẹ̀lé nínú Olúwa pé èmi fúnra mi náà yóò dé láìpẹ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo gbẹ́kẹ̀ lé Olúwa pé èmi fúnra mi náà yóò dé láìpẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθα
  choice: mo ní ìgbẹ́kẹ̀lé
  rationale: Ọ̀rọ̀-ìṣe aláṣepé náà tọ́ka sí ipò ìgbẹ́kẹ̀lé tí ó ti fìdí múlẹ̀ tí ó sì ń bá a lọ; gbólóhùn yìí jẹ́ Yorùbá àdánidá tí ó pa agbára ìsinsìnyí náà mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Asopọ̀ pẹ̀lẹ́ ni ó ń tẹ̀síwájú láti inú ọ̀rọ̀ ẹsẹ tó ṣáájú; “Ṣùgbọ́n” fi ìyàtọ̀ kékeré hàn láàárín ìrètí nípa Tímótì àti ìrètí Pọ́ọ̀lù fúnra rẹ̀.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa àṣà gbólóhùn Pọ́ọ̀lù mọ́, ó sì lè tọ́ka sí ààyè tàbí ìpìlẹ̀ ìgbẹ́kẹ̀lé náà láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣàgbékalẹ̀ ohun tí Pọ́ọ̀lù ní ìgbẹ́kẹ̀lé nípa rẹ̀ lọ́nà Yorùbá àdánidá.
- source_word: καὶ αὐτὸς
  choice: èmi fúnra mi pẹ̀lú
  rationale: “Fúnra mi” pa ìtẹnumọ́ αὐτός mọ́, “pẹ̀lú” sì pa ìtumọ̀ àfikún καί mọ́ ní ìbáṣepọ̀ pẹ̀lú rírán Tímótì lọ.
- source_word: ταχέως
  choice: láìpẹ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí àsìkò tí ó sún mọ́, kì í ṣe sí bí ìrìn-àjò ṣe yára.
- source_word: ἐλεύσομαι
  choice: yóò dé
  rationale: “Dé” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni tó ń sọ̀rọ̀ yóò wá sí ọ̀dọ̀ àwọn olùgbọ́, ó sì pa ìfojúsùn ọ̀dọ̀ àwọn ará Fílípì mọ́.
- source_word: κυρίῳ
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος nínú lílò Pọ́ọ̀lù níbí.
theological_decisions:
- issue: Ìwà ìgbẹ́kẹ̀lé Pọ́ọ̀lù ní ìbáṣepọ̀ pẹ̀lú “Olúwa”
  choice: nínú Olúwa
  alternative: mo gbẹ́kẹ̀ lé Olúwa pé
  rationale: Yíyan “nínú Olúwa” pa àìmọ́jú-méjì Gíríìkì mọ́ pé ìgbẹ́kẹ̀lé Pọ́ọ̀lù wà nínú àjọṣe àti ìgbẹ́kẹ̀lé rẹ̀ nínú Olúwa, láìsọ ó di ìlérí ìṣípayá tàbí ìdánilójú tí kò ní ààlà.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé yé fún gbogbo ènìyàn; a lo “èmi fúnra mi pẹ̀lú” láti pa ìtẹnumọ́ àti àfikún Gíríìkì mọ́. Àmì ohùn ni a fi sí gbogbo ibi tí ó bá yẹ.
