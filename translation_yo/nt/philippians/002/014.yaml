  text: Do everything without grumbling or arguing[b][a],
translation:
  language: yo
  text: Ẹ máa ṣe ohun gbogbo láìsí ìráhùn tàbí àríyànjiyàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láìsí ìráhùn tàbí ìjiyàn.” Ọ̀rọ̀ tí a túmọ̀ sí “àríyànjiyàn” lè túmọ̀ sí “ìbéèrè” tàbí “ìrònú” ní àwọn àyíká kan, ṣùgbọ́n níbí ó ṣeé ṣe jù pé ó ń tọ́ka sí ìjiyàn alátakò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ yìí ní ìtumọ̀ tó kárí gbogbo ohun tí wọ́n ń ṣe; “ohun gbogbo” jẹ́ èdè Yorùbá àdánidá tó sì pa agbára àṣẹ náà mọ́.
- source_word: ποιεῖτε
  choice: Ẹ máa ṣe
  rationale: Àṣẹ àsìkò ìsinsìnyí ní Gíríìkì lè tọ́ka sí ìṣe tí ó ń bá a lọ; “Ẹ máa ṣe” mú ìtumọ̀ àṣẹ onítẹ̀síwájú yìí jáde ní Yorùbá.
- source_word: χωρὶς
  choice: láìsí
  rationale: “Láìsí” sọ ní kedere pé ìkùnsínú àti àríyànjiyàn kò gbọ́dọ̀ wà nínú bí wọ́n ṣe ń ṣe ohun gbogbo.
- source_word: γογγυσμῶν
  choice: ìkùnsínú
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹ̀dùn tàbí ìráhùn tí a ń sọ kẹ́lẹ́kẹ́lẹ́; “ìkùnsínú” jẹ́ ọ̀rọ̀ Yorùbá tó ṣeé lóye, ó sì lè pa ìrántí ìkùnsínú àwọn ọmọ Ísírẹ́lì ní aginjù mọ́.
- source_word: διαλογισμῶν
  choice: àríyànjiyàn
  rationale: Ní àyíká ìkìlọ̀ yìí, ọ̀rọ̀ náà ṣeé ṣe kó túmọ̀ sí àríyànjiyàn tàbí ìjiyàn alátakò, bó tilẹ̀ jẹ́ pé ó lè túmọ̀ sí ìbéèrè tàbí ìrònú ní àwọn àyíká mìíràn.
