id: PHP.2.19
reference: Philippians 2:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: yo
  text: Ṣùgbọ́n mo ní ìrètí nínú Olúwa Jesu láti rán Timotiu sí yín láìpẹ́, kí inú mi náà lè dùn nígbà tí mo bá gbọ́ ìròyìn nípa yín[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó sún mọ́ ọ̀rọ̀ gangan: “nígbà tí mo bá mọ ohun tó kan yín.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλπίζω
  choice: mo ní ìrètí
  rationale: Ó fi ìrètí tàbí ìfojúsọ́nà Pọ́ọ̀lù lọ́wọ́lọ́wọ́ hàn ní èdè Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà kékeré tàbí ìyàtọ̀ sí ọ̀rọ̀ tó ṣáájú hàn.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: nínú Olúwa Jesu
  rationale: A pa ìtumọ̀ ìgbẹ́kẹ̀lé àti ìbáṣepọ̀ inú Olúwa mọ́, a sì tú κύριος sí 'Olúwa' gẹ́gẹ́ bí oyè Kristi.
- source_word: Τιμόθεον
  choice: Timotiu
  rationale: Àkọsílẹ̀ orúkọ náà tẹ̀ lé ìlò Yorùbá tí ó wọ́pọ̀ nínú Bíbélì.
- source_word: ταχέως
  choice: láìpẹ́
  rationale: Nínú ọ̀rọ̀ yìí, ó tọ́ka sí àkókò tí ó sún mọ́lé ju bí a ṣe yára ṣe iṣẹ́ lọ.
- source_word: πέμψαι ὑμῖν
  choice: rán Timotiu sí yín
  rationale: Ó sọ ìṣe rírán ẹni kan sí ọ̀dọ̀ àwọn olùgbà ní Yorùbá tó ṣe kedere.
- source_word: ἵνα κἀγὼ εὐψυχῶ
  choice: kí inú èmi náà lè dùn
  rationale: Ó pa ìdí ọ̀rọ̀ náà àti ìtẹnumọ́ κἀγὼ mọ́; εὐψυχέω túmọ̀ sí pé kí ẹ̀mí ẹni balẹ̀ tàbí kí inú rẹ̀ dùn.
- source_word: γνοὺς τὰ περὶ ὑμῶν
  choice: nígbà tí mo bá gbọ́ nípa bí nǹkan ṣe rí fún yín
  rationale: Ìtumọ̀ àdánidá ni fún kíkẹ́kọ̀ọ́ tàbí gbígbọ́ ìròyìn nípa ipò wọn, láì fi kún ohun tí Gíríìkì kò sọ.
theological_decisions:
- issue: Ìtumọ̀ κύριος nínú ἐν κυρίῳ Ἰησοῦ
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: '''Olúwa'' ni oyè Kristi tó yẹ ní Májẹ̀mú Tuntun, ó sì pa ìjẹ́pàtàkì ẹ̀kọ́ ìgbàgbọ́ inú gbólóhùn náà mọ́.'
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo 'nínú Olúwa Jesu' láti pa àwòrán Pọ́ọ̀lù mọ́, a sì sọ apá ìkẹyìn ní ọ̀nà Yorùbá àdánidá.
