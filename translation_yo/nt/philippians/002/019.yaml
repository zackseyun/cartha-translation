revisions:
- from: Ṣùgbọ́n mo ní ìrètí nínú Olúwa Jesu pé èmi yóò rán Timotiu sí yín láìpẹ́, kí inú èmi náà lè dùn nígbà tí mo bá gbọ́ nípa bí nǹkan ṣe rí fún yín.
  to: Ṣùgbọ́n mo ní ìrètí nínú Olúwa Jesu láti rán Timotiu sí yín láìpẹ́, kí inú mi náà lè dùn nígbà tí mo bá gbọ́ ìròyìn nípa yín[a].
  rationale: The infinitive πέμψαι is restored with “láti rán,” avoiding an unnecessary future finite clause. The final expression is rendered idiomatically as receiving news about the recipients, while the footnote supplies a closer formal alternative and is anchored to the phrase it explains. No theological or interpretive expansion is introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Paul’s hope, the Christological title “Olúwa,” Timothy, the intended near-term sending, and the purpose clause. However, “pé èmi yóò rán” recasts the Greek infinitive πέμψαι (“to send”) as a finite future assertion (“that I will send”), rather than the object of Paul’s present hope. The final clause naturally concerns receiving news about the Philippians; “gbọ́ ìròyìn nípa yín” preserves this without over-specifying their condition.
  naturalness: The revision uses standard, contemporary Yoruba. “Mo ní ìrètí ... láti rán” is the natural construction for “I hope to send.” “Kí inú mi náà lè dùn” idiomatically conveys being cheered/encouraged, while retaining the emphasis that Paul too will benefit.
  terminology: “Olúwa Jesu” appropriately renders κυρίῳ Ἰησοῦ. “Timotiu” is an established Yoruba biblical form. The footnote is retained as a lexical alternative, but its anchor is placed with the final clause to which it pertains rather than after “láìpẹ́.”
  issues:
  - severity: medium
    issue: The construction “mo ní ìrètí ... pé èmi yóò rán” changes the infinitival complement into a finite future clause.
    rationale: Ἐλπίζω ... πέμψαι means “I hope ... to send,” not primarily “I hope that I will send.” “láti rán” directly preserves the Greek syntax and sense.
  - severity: low
    issue: The existing footnote marker is attached to “láìpẹ́” although the note concerns γνοὺς τὰ περὶ ὑμῶν.
    rationale: Moving the marker to the final clause makes the annotation’s referent clear and preserves a usable footnote anchor.
  revised_text: Ṣùgbọ́n mo ní ìrètí nínú Olúwa Jesu láti rán Timotiu sí yín láìpẹ́, kí inú mi náà lè dùn nígbà tí mo bá gbọ́ ìròyìn nípa yín[a].
  revised_footnotes:
  - marker: a
    text: 'Tàbí, ní ọ̀nà tó sún mọ́ ọ̀rọ̀ gangan: “nígbà tí mo bá mọ ohun tó kan yín.”'
    reason: lexical_alternative
  revision_rationale: The infinitive πέμψαι is restored with “láti rán,” avoiding an unnecessary future finite clause. The final expression is rendered idiomatically as receiving news about the recipients, while the footnote supplies a closer formal alternative and is anchored to the phrase it explains. No theological or interpretive expansion is introduced.
