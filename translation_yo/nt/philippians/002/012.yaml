  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìṣètò àti ìtumọ̀ Gíríìkì dáadáa: ìpè ìfẹ́, ìgbọ́ràn wọn tẹ́lẹ̀, ìyàtọ̀ wíwà/àìsí Pọ́ọ̀lù, ìtẹnumọ́ ‘púpọ̀ jù,’ àti àṣẹ láti ṣiṣẹ́ ìgbàlà wọn jáde pẹ̀lú ìbẹ̀rù àti ìwárìrì. Àtúnṣe kékeré ń mú gbólóhùn ìyàtọ̀ wíwà àti àìsí náà rọrùn sí i nínú Yorùbá.'
