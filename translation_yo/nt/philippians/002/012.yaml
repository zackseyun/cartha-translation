id: PHP.2.12
reference: Philippians 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin olùfẹ́ mi, gẹ́gẹ́ bí ẹ ti máa ń ṣègbọ́ràn nígbà gbogbo—kì í ṣe nígbà tí mo wà pẹ̀lú yín nìkan, ṣùgbọ́n nísinsìnyí, ní àìsí mi, púpọ̀ jù bẹ́ẹ̀ lọ—ẹ máa ṣiṣẹ́ láti mú ìgbàlà ara yín dé òpin[a] pẹ̀lú ìbẹ̀rù àti ìwárìrì.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ṣíṣiṣẹ́ ohun kan jáde títí dé ìmúṣẹ tàbí òpin.
    reason: alternative_reading
  - marker: b
    text: “Ìbẹ̀rù àti ìwárìrì” ń fi ọ̀wọ̀ jíjinlẹ̀, ìrẹ̀lẹ̀, àti ìṣọ́ra tó ṣe pàtàkì níwájú Ọlọ́run hàn, láì mú agbára ọ̀rọ̀ “ìbẹ̀rù” kúrò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Nítorí náà
  rationale: Ó so ìṣírí yìí mọ́ ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ nípa Kristi, ó sì fi àbájáde ọ̀rọ̀ náà hàn ní Yorùbá àdánidá.
- source_word: ἀγαπητοί μου
  choice: ẹ̀yin olùfẹ́ mi
  rationale: Ó pa ìfẹ́ àti ìtẹ́wọ́gbà tó wà nínú ọ̀rọ̀ ìpè Pọ́ọ̀lù mọ́, ó sì bá àwùjọ àwọn olùgbọ́ mu.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: gẹ́gẹ́ bí ẹ ti máa ń ṣègbọ́ràn nígbà gbogbo
  rationale: Ọ̀rọ̀ yìí ṣàkópọ̀ àṣà ìgbọ́ràn wọn tẹ́lẹ̀, nígbà tí “máa ń” fi hàn pé ó jẹ́ ìṣe tí wọ́n sábà ń ṣe.
- source_word: παρουσίᾳ / ἀπουσίᾳ
  choice: nígbà tí mo wà pẹ̀lú yín / ní báyìí tí mi ò sí lọ́dọ̀ yín
  rationale: Àwọn gbólóhùn wọ̀nyí mú ìyàtọ̀ tó wà láàárín wíwà àti àìsí Pọ́ọ̀lù ṣe kedere ní Yorùbá ti òde òní.
- source_word: πολλῷ μᾶλλον
  choice: pàápàá jù bẹ́ẹ̀ lọ
  rationale: Ó fi ìtẹnumọ́ ìfiwéra Gíríìkì hàn láì fi dandan pinnu bóyá ó so mọ́ ìgbọ́ràn tàbí iṣẹ́ tí àṣẹ náà ń béèrè.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: ìgbàlà ara yín
  rationale: “Ìgbàlà” pa ìwọ̀n ẹ̀kọ́ ìgbàlà inú σωτηρία mọ́; “ara yín” sì ṣàfihàn arọ́pò-orúkọ ìtẹnumọ́ tó jẹ́ ọ̀pọ̀ nínú Gíríìkì.
- source_word: κατεργάζεσθε
  choice: ẹ máa ṣiṣẹ́ láti mú ... dé òpin
  rationale: Ó mú èrò ṣíṣe ohun kan títí dé ìmúṣẹ tàbí òpin jáde, ṣùgbọ́n kò yí ọ̀rọ̀ náà sí “ṣiṣẹ́ fún” tàbí “ra” ìgbàlà.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: pẹ̀lú ìbẹ̀rù àti ìwárìrì
  rationale: Ó pa agbára àti ìwọ̀n ọ̀rọ̀ Gíríìkì méjèèjì mọ́, dípò fífi ọ̀wọ̀ tàbí ìbẹ̀rù tó rọrùn rọ́pò wọn.
theological_decisions:
- issue: Ìtumọ̀ “mú ìgbàlà ara yín dé òpin”
  choice: Àṣẹ ni láti ṣiṣẹ́ ìgbàlà tí a pè ní tiwọn jáde títí dé ìmúṣẹ nínú ìgbésí ayé.
  alternative: Kí wọ́n dá ìgbàlà sílẹ̀ tàbí jèrè rẹ̀ nípasẹ̀ agbára iṣẹ́ ènìyàn nìkan.
  rationale: κατεργάζεσθε lè túmọ̀ sí mímú ohun kan ṣẹ tàbí mímú un dé òpin. Àyíká ẹsẹ tó tẹ̀ lé sọ nípa Ọlọ́run tó ń ṣiṣẹ́ nínú wọn; ìtumọ̀ náà pa ojúṣe ènìyàn mọ́ láì sọ pé iṣẹ́ ló ń ra ìgbàlà.
- issue: Agbára “ìbẹ̀rù àti ìwárìrì”
  choice: Ìbẹ̀rù ọlọ́wọ̀, ìrẹ̀lẹ̀ àti ìṣọ́ra tó jinlẹ̀ níwájú Ọlọ́run.
  alternative: Ẹ̀rù tó ń múni rọ̀ nìkan, tàbí ọ̀wọ̀ fẹ́lẹ́fẹ́lẹ́ tí kò ní ìmọ̀lára ìbẹ̀rù kankan.
  rationale: Àkópọ̀ ọ̀rọ̀ náà ní ìwọ̀n àti agbára gidi. Pípa àwọn ọ̀rọ̀ méjèèjì mọ́ kò jẹ́ kí ìtumọ̀ náà rọ̀ ju bó ṣe yẹ lọ, bẹ́ẹ̀ ni kò fi ìpayà nìkan túmọ̀ rẹ̀.
translation_notes:
  register: Yorùbá ìṣàkóso tó bójú mu, tó ní àmì ohùn ní kíkún níbi tó bá yẹ. A lo “ẹ̀yin/ẹ/yín” fún àwùjọ àwọn onígbàgbọ́, a sì yà gbólóhùn àárín sọ́tọ̀ pẹ̀lú àmì gígùn kí gbolohun Pọ́ọ̀lù lè ṣe kedere fún òǹkàwé òde òní.
