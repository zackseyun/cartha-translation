  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα ἐν τῷ ὀνόματι Ἰησοῦ πᾶν γόνυ κάμψῃ ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/010.yaml
  text: so that at the name of Jesus every knee should bow[a], of those in heaven and on earth and under the earth[b],
translation:
  language: yo
  text: kí gbogbo eékún àwọn tí ń bẹ ní ọ̀run, lórí ilẹ̀, àti lábẹ́ ilẹ̀[b] kúnlẹ̀ nígbà tí a bá dárúkọ Jésù[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní orúkọ Jésù.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “ti àwọn ọ̀run, ti àwọn ilẹ̀, àti ti àwọn abẹ́ ilẹ̀”; àwọn ọ̀rọ̀ Gíríìkì náà jẹ́ ajẹtífù tí a lò bí orúkọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí
  rationale: Ó fi ète tàbí àbájáde ohun tí a sọ ṣáájú hàn, ó sì jẹ́ ọ̀nà àdánidá láti so gbólóhùn yìí mọ́ èyí tí ó ṣáájú rẹ̀.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: ní orúkọ Jésù
  rationale: 'Ó pa àwòrán àti àìdánilójú ἐν mọ́: ó lè tọ́ka sí ìforíbalẹ̀ nígbà tí a bá dárúkọ Jésù, tàbí ìforíbalẹ̀ nínú agbára àti iyì orúkọ rẹ̀.'
- source_word: πᾶν γόνυ
  choice: gbogbo eékún
  rationale: Ó pa àwòrán ara tó lágbára nípa ìforíbalẹ̀ gbogbo ẹ̀dá mọ́, dípò kí a sọ ọ́ di ‘gbogbo ènìyàn.’
- source_word: κάμψῃ
  choice: tẹ̀ ba
  rationale: Ọ̀rọ̀ yìí sọ fífi eékún tẹ̀ àti ìforíbalẹ̀ hàn ní Yorùbá tó ṣeé yé, láìsọ àwòrán náà di ohun míì.
- source_word: ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: àwọn tí ó wà ní ọ̀run, àti lórí ilẹ̀, àti lábẹ́ ilẹ̀
  rationale: Ó sọ ìpín mẹ́ta tó yí gbogbo àgbáyé ká ní èdè Yorùbá àdánidá, láìsọ pàtó pé àwọn angẹli, ènìyàn, òkú, tàbí àwọn ẹ̀mí búburú ni.
theological_decisions:
- issue: Ìwọ̀n ohun tí ọ̀rọ̀ mẹ́ta ἐπουρανίων, ἐπιγείων, àti καταχθονίων kó sínú
  choice: A pa ìtumọ̀ gbogbo àgbáyé mọ́ nípasẹ̀ ‘àwọn tí ó wà ní ọ̀run, àti lórí ilẹ̀, àti lábẹ́ ilẹ̀.’
  alternative: Kí a sọ wọ́n ní pàtó bí àwọn angẹli, àwọn ènìyàn, àti àwọn òkú tàbí àwọn ẹ̀mí búburú.
  rationale: Gíríìkì tẹnu mọ́ bí ìforíbalẹ̀ sí Jésù ṣe kan gbogbo ẹ̀dá, ṣùgbọ́n kò dárúkọ irú ẹni tó wà ní ẹ̀ka kọ̀ọ̀kan; nítorí náà a kò fi ẹ̀kọ́ ìtumọ̀ kan kún un.
- issue: Ìtumọ̀ ἐν nínú ἐν τῷ ὀνόματι Ἰησοῦ
  choice: ní orúkọ Jésù
  alternative: nígbà tí a bá dárúkọ Jésù
  rationale: ‘Ní orúkọ’ pa àìdánilójú Gíríìkì mọ́ dáadáa ju yíyan ìṣẹ̀lẹ̀ dídárúkọ Jésù nìkan lọ; àlàyé ìsàlẹ̀ fi ìtumọ̀ kejì hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘eékún’ àti ‘tẹ̀ ba’ láti pa àwòrán ìforíbalẹ̀ mọ́; a sì yẹra fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìsìn tó lè fi ìdánimọ̀ pàtó lé àwọn ẹ̀ka mẹ́tẹ̀ẹ̀ta lórí.
