id: PHP.2.15
reference: Philippians 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: yo
  text: kí ẹ lè di aláìlẹ́bi àti aláìbàjẹ́, àwọn ọmọ Ọlọ́run tí kò ní àbàwọ́n láàárín ìran tí ó wọ́, tí ó sì yí kúrò ní ọ̀nà; nínú wọn ni ẹ ń tàn bí àwọn ìmọ́lẹ̀ nínú ayé.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ farahàn bí àwọn ìmọ́lẹ̀ nínú ayé.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí ọ̀rọ̀ náà ń tọ́ka sí Diutarónómì 32:5, níbi tí ìran ìbàjẹ́ tí ó wọ́, tí ó sì yí kúrò ní ọ̀nà, wà ní ìdàkejì àwọn ọmọ Ọlọ́run tí kò ní àbàwọ́n.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα γένησθε
  choice: kí ẹ lè di
  rationale: Ó pa ète tàbí àbájáde mọ́, ó sì mú ìtumọ̀ ‘di’ inú γίνομαι hàn ní Yorùbá àdánidá.
- source_word: ἄμεμπτοι
  choice: aláìlẹ́bi
  rationale: Ó túmọ̀ sí ẹni tí kò sí ohun tí a lè fi dá lẹ́bi nínú ìwà rẹ̀.
- source_word: ἀκέραιοι
  choice: olóòótọ́ inú
  rationale: Ó sọ ìwà tí kò ní àdàlú tàbí ète búburú ní èdè tí òǹkàwé òde òní lè lóye; ‘aláìṣẹ̀’ lè dín ìtumọ̀ ìwà pípé inú rẹ̀ kù.
- source_word: τέκνα θεοῦ
  choice: ọmọ Ọlọ́run
  rationale: τέκνα jẹ́ ọ̀rọ̀ àpapọ̀ fún àwọn ọmọ, kì í ṣe àwọn ọmọkùnrin nìkan; Yorùbá ‘ọmọ’ náà lè jẹ́ àpapọ̀.
- source_word: ἄμωμα
  choice: tí kò ní àbàwọ́n
  rationale: Ó pa àwòrán àbàwọ́n mọ́, ó sì yà á sọ́tọ̀ kúrò lọ́dọ̀ ἄμεμπτοι tí a túmọ̀ sí ‘aláìlẹ́bi.’
- source_word: μέσον γενεᾶς σκολιᾶς καὶ διεστραμμένης
  choice: láàárín ìran oníwà wíwọ́ àti oníwà yíyípo
  rationale: Ó pa àwòrán ohun tí ó wọ́ àti ohun tí a yí po mọ́, ó sì fi hàn pé ìwà ìran náà ni a ń ṣàpèjúwe.
- source_word: ἐν οἷς
  choice: láàárín àwọn tí
  rationale: Ó tọ́ka sí àwọn ènìyàn inú ìran náà, kì í ṣe sí ibi tàbí ohun aláìlẹ́mìí.
- source_word: φαίνεσθε
  choice: ẹ ń tàn
  rationale: Ní ìbámu pẹ̀lú φωστῆρες, ìtumọ̀ títàn jẹ́ èyí tí ó bá àyíká ọ̀rọ̀ mu jù; ìtumọ̀ ‘ẹ farahàn’ ṣì ṣeé ṣe, a sì pa á mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: φωστῆρες
  choice: ìmọ́lẹ̀
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì lè ṣàpèjúwe àwọn ohun tí ń tan ìmọ́lẹ̀ láì fi dandan túmọ̀ sí ìràwọ̀ nìkan.
- source_word: ἐν κόσμῳ
  choice: nínú ayé
  rationale: Ní àyíká yìí κόσμος tọ́ka sí ayé tí àwọn ènìyàn ń gbé àti ètò rẹ̀.
theological_decisions:
- issue: Ìbáṣepọ̀ ‘tí kò ní àbàwọ́n’ pẹ̀lú ‘ọmọ Ọlọ́run’ àti ìṣeéṣe ìtọ́kasí sí Diutarónómì 32:5
  choice: A so ‘tí kò ní àbàwọ́n’ mọ́ ‘ọmọ Ọlọ́run’ ní tààrà, a sì jẹ́ kí ìfiwéra pẹ̀lú ìran búburú dúró láì ṣàlàyé rẹ̀ ju bó ṣe wà lọ nínú ẹsẹ̀.
  alternative: A lè mú ‘tí kò ní àbàwọ́n’ gẹ́gẹ́ bí àpèjúwe gbogbo gbólóhùn náà, tàbí kí a sọ ìtọ́kasí sí Diutarónómì 32:5 ní kedere sí i.
  rationale: Ìṣètò Gíríìkì so ἄμωμα mọ́ τέκνα θεοῦ, ó sì ṣeé ṣe kí ọ̀rọ̀ náà ń mú Diutarónómì 32:5 wá sí ìrántí; ṣùgbọ́n kò yẹ kí ìtumọ̀ pàtàkì yanju ìtọ́kasí náà ju ẹ̀rí ọ̀rọ̀ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; ìforúkọsílẹ̀ náà ní ọlá ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lò ‘olóòótọ́ inú’ fún ἀκέραιοι láti yà á sọ́tọ̀ kúrò lọ́dọ̀ ‘aláìlẹ́bi,’ a sì pa àwòrán ‘àbàwọ́n,’ ‘wíwọ́,’ àti ‘yíyípo’ mọ́.
