  source_fidelity: Ìtumọ̀ náà gba ète ‘kí ẹ lè di,’ ìtànná ‘ẹ ń tàn,’ àti ìbáṣepọ̀ ‘àwọn ọmọ Ọlọ́run tí kò ní àbàwọ́n’ mọ́. Ṣùgbọ́n ‘olóòótọ́ inú’ túmọ̀ sí ẹni onítọ̀hún/inú olóòótọ́, kì í ṣe ἀκέραιοι dáadáa; ó yẹ kí a lo ọ̀rọ̀ tó túmọ̀ sí aláìbàjẹ́, aláìlódì, tàbí ìwà tí kò ní àdàlú. Ọ̀rọ̀ ‘oníwà wíwọ́ àti oníwà yíyípo’ sì kì í jẹ́ ìṣọ̀kan Yorùbá adayeba fún σκολιᾶς καὶ διεστραμμένης.
  naturalness: ‘Ọmọ Ọlọ́run’ ní ẹyọ kan kò bá ‘ẹ’ àti γένησθε mu; ‘àwọn ọmọ Ọlọ́run’ ni ó yẹ. ‘Nínú wọn’ jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì ṣetọju ἐν οἷς. ‘Ìran tí ó wọ́, tí ó sì yí kúrò ní ọ̀nà’ ń sọ àwòrán Gíríìkì náà ní Yorùbá àdánidá láì dín agbára ìwà-búburú rẹ̀ kù.
