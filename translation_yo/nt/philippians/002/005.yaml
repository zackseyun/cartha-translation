  text: Have this mindset among yourselves[a], which was also in Messiah Jesus[b],
translation:
  language: yo
  text: Ẹ máa ní ìrònú yìí láàárín ara yín[a], èyí tí ó tún wà nínú Mèsáyà Jésù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa ní ìrònú yìí láàárín ara yín, èyí tí ẹ̀yin náà ní nínú Mèsáyà Jésù.”
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì ni “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí pé Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: yìí
  rationale: Ọ̀rọ̀ arọ́pò-atọ́ka náà ń tọ́ka sí èrò inú tí àpẹẹrẹ rẹ̀ yóò hàn nínú àwọn ẹsẹ tó tẹ̀ lé e; “yìí” pa ìṣókí Gíríìkì mọ́.
- source_word: φρονεῖτε
  choice: Ẹ máa ní èrò inú
  rationale: Nínú lílo Paulu, ọ̀rọ̀ náà sábà máa ń túmọ̀ sí ìrònú tàbí ìwà inú tí ènìyàn ń gbé lé, kì í ṣe ríronú lásán. “Ẹ máa ní èrò inú” tún fi agbára àṣẹ tó ń bá a lọ hàn.
- source_word: ἐν ὑμῖν
  choice: láàárín ara yín
  rationale: Ọ̀rọ̀ arọ́pò náà jẹ́ ọ̀pọ̀, àyíká Filipi 2:1–4 sì dá lórí ìgbésí ayé ìjọ lápapọ̀; nítorí náà, “láàárín ara yín” fi ìtumọ̀ àwùjọ hàn dáadáa.
- source_word: ὃ
  choice: èyí tí
  rationale: Ó so èrò inú tí a pàṣẹ fún àwọn onígbàgbọ́ pọ̀ mọ́ èyí tí ó wà nínú Jésù, láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè níbí, nítorí náà “Mèsáyà” mú ìtumọ̀ oyè náà jáde. A pa “nínú” mọ́ láti má ṣe pinnu gbogbo ìtumọ̀ ìbáṣepọ̀ náà fún òǹkàwé.
theological_decisions:
- issue: Bóyá gbólóhùn náà ń tọ́ka sí èrò inú tí Jésù fi ṣe àpẹẹrẹ, tàbí sí èrò inú tí àwọn onígbàgbọ́ ní nípasẹ̀ ìṣọ̀kan wọn pẹ̀lú rẹ̀.
  choice: 'Ìtumọ̀ àpẹẹrẹ: “èyí tí ó tún wà nínú Mèsáyà Jésù.”'
  alternative: 'Ìtumọ̀ ìkópa/ìṣọ̀kan: “èyí tí ẹ̀yin náà ní nínú Mèsáyà Jésù.”'
  rationale: Àyíká tó tẹ̀ lé e ń gbé ìrẹ̀lẹ̀ Mèsáyà kalẹ̀ gẹ́gẹ́ bí àpẹẹrẹ fún àwọn onígbàgbọ́, èyí sì ṣe àtìlẹ́yìn fún ìtumọ̀ àpẹẹrẹ. Síbẹ̀, Gíríìkì náà ṣókí, ó sì lè gba ìtumọ̀ ìṣọ̀kan pẹ̀lú Mèsáyà; nítorí náà, àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ kejì mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdánidá mu. Ìforúkọsílẹ̀ náà ní iyì, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìṣókí àti àìdánilójú Gíríìkì mọ́ nípasẹ̀ àlàyé ìsàlẹ̀ ojú ìwé.
