id: PHP.2.30
reference: Philippians 2:30
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: yo
  text: Nítorí iṣẹ́ Mèsáyà[a][c] ni ó ṣe sún mọ́ ikú; ó fi ẹ̀mí ara rẹ̀ wewu láti lè pèsè ohun tí ó ṣì kù[b] nínú iṣẹ́ ìrànlọ́wọ́ yín sí mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kírísítì.” Ọ̀rọ̀ Gíríìkì náà lè jẹ́ “iṣẹ́ Kírísítì/Mèsáyà.”
    reason: alternative_reading
  - marker: b
    text: “Ohun tí ó ṣì kù” ń tọ́ka sí iṣẹ́ tí àwọn ará Fílípì kò lè ṣe fún Pọ́ọ̀lù ní ti ara nítorí pé wọn kò sí lọ́dọ̀ rẹ̀; kò túmọ̀ sí pé wọn kò fẹ́ ràn án lọ́wọ́.
    reason: cultural_note
  - marker: c
    text: Àwọn ẹ̀dà àfọwọ́kọ kan kò ní “Mèsáyà”; nígbà náà, a lè kà á sí “nítorí iṣẹ́ náà.”
    reason: textual_variant
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: nítorí iṣẹ́ Mèsáyà
  rationale: “Nítorí” sọ ìdí tí ohun náà fi ṣẹlẹ̀, gẹ́gẹ́ bí διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ṣe túmọ̀ sí níhìn-ín. “Iṣẹ́” pa ἔργον mọ́, “Mèsáyà” sì mú agbára oyè Χριστός jáde.
- source_word: μέχρι θανάτου ἤγγισεν
  choice: ó sún mọ́ ikú
  rationale: Èyí tẹ̀ lé àwòrán ọ̀rọ̀ Gíríìkì, ó sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere láti sọ pé ó dé ibi tí ikú ti sún mọ́ ọn gan-an.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: ó fi ẹ̀mí ara rẹ̀ wewu
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí fífi ìyè ara ẹni sínú ewu, kì í ṣe ‘ọkàn’ gẹ́gẹ́ bí apá àìrí ènìyàn. “Fi ẹ̀mí ara rẹ̀ wewu” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ewu tí ẹni náà mọ̀ọ́mọ̀ dojú kọ.
- source_word: ἵνα ἀναπληρώσῃ
  choice: láti lè mú … ṣẹ
  rationale: “Láti lè” fi ète ἵνα hàn, “mú … ṣẹ” sì sọ bí ó ṣe pèsè tàbí parí ohun tí ó ṣì kù láìjẹ́ kí gbolohun náà dà bí ìdálẹ́bi.
- source_word: τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας
  choice: ohun tí ó ṣì kù nínú iṣẹ́ ìránṣẹ́ yín sí mi
  rationale: Èyí pa èrò ohun tí kò tíì pé mọ́, ó sì jẹ́ kí λειτουργία túmọ̀ sí iṣẹ́ ìrànlọ́wọ́ tàbí ìránṣẹ́ tó gbòòrò ju iṣẹ́ ìjọ lọ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστοῦ nínú gbólóhùn Pọ́ọ̀lù yìí
  choice: Mèsáyà
  alternative: Kírísítì
  rationale: Χριστός ní agbára oyè níhìn-ín. “Mèsáyà” tú ìtumọ̀ oyè náà jáde, nígbà tí àlàyé ìsàlẹ̀ fi “Kírísítì” sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ míì tí ó wọ́pọ̀.
- issue: Ìtumọ̀ ‘ohun tí ó ṣì kù’
  choice: Ohun tí àwọn ará Fílípì kò lè ṣe fún Pọ́ọ̀lù ní ti ara nítorí jíjìnnà wọn
  alternative: Àìgbọ́ràn tàbí àìfẹ́ láti ṣe iṣẹ́ ìránṣẹ́
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Epafrodítù dúró fún wọn ní ibi tí wọn kò lè wà; kò fi ẹ̀sùn àìfẹ́ tàbí àìgbọ́ràn kàn wọ́n.
translation_notes:
  register: Yorùbá àpéjọ tí ó lọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. Gbólóhùn “sún mọ́ ikú” pa àwòrán orísun mọ́, “fi ẹ̀mí ara rẹ̀ wewu” sì jẹ́ àdánidá. Àmì àárín-gbólóhùn ya ìdí ikú-sísún àti ìṣe fífi ẹ̀mí wewu sọ́tọ̀ láìfọ́ ìṣọ̀kan ẹsẹ náà.
