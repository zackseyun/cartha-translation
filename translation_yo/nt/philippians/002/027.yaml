  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé Gíríìkì ní gbogbogbò: àìsàn náà sún mọ́ ikú, Ọlọ́run sì ṣàánú Epafrodítù àti Pọ́ọ̀lù, kí ìbànújẹ̀ Pọ́ọ̀lù má bàa pọ̀ sí i. Síbẹ̀, a nílò àtúnṣe kékeré sí ìtọ́kasí ẹni tí Ọlọ́run ṣàánú àti sí ọ̀nà adayébá fún àwòrán ‘sorrow upon sorrow.’'
  naturalness: “Ṣàánú èmi” kò dáa bíi ìlò ojoojúmọ́; “ṣàánú mi” ni ó yẹ. Bákan náà, “ìbànújẹ̀ lórí ìbànújẹ̀” jẹ́ ìlò Yorùbá tó mọ́gbọ́n dání ju “lé orí ìbànújẹ̀” lọ nínú ìtumọ̀ àkójọpọ̀ ìbànújẹ̀.
