  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: yo
  text: Nítorí ní tòótọ́, ó ṣàìsàn dé etí ikú[a]; ṣùgbọ́n Ọlọ́run ṣàánú rẹ̀, kì í ṣe òun nìkan, ṣùgbọ́n ó ṣàánú mi náà, kí n má bàa ní ìbànújẹ̀ lórí ìbànújẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sún mọ́ ikú,” tàbí “àìsàn rẹ̀ fẹ́rẹ̀ẹ́ pa á.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “ìbànújẹ̀ lórí ìbànújẹ̀”; ọ̀nà àsọyé ni èyí láti fi hàn pé ìbànújẹ̀ kan tún ń pọ̀ sí òmíràn.
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: ó ṣàìsàn
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí àìsàn ara Epafrodítù, kì í ṣe àìlera lápapọ̀. “Ó ṣàìsàn” jẹ́ èdè Yorùbá adayébá tó sì ṣe kedere.
- source_word: παραπλήσιον θανάτῳ
  choice: dé etí ikú
  rationale: Gbólóhùn Yorùbá yìí fi hàn pé ó sún mọ́ ikú gidigidi láì sọ pé ó kú ní ti gidi; ó bá ìtumọ̀ ìsúnmọ́ ikú inú Gíríìkì mu.
- source_word: ἠλέησεν
  choice: ṣàánú
  rationale: “Ṣàánú” sọ ìṣe àánú àti ìyọ́nú Ọlọ́run ní kíkún, ó sì jẹ́ ọ̀rọ̀ tó wọ́pọ̀, tó ní ọlá nínú Yorùbá.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: kì í sì í ṣe òun nìkan, ó ṣàánú èmi pẹ̀lú
  rationale: A tún ọ̀rọ̀ ìṣe “ṣàánú” sọ kí ohun tí Ọlọ́run ṣe fún Pọ́ọ̀lù hàn kedere, nígbà tá a sì pa ìtakora “kì í ṣe…nìkan…pẹ̀lú” mọ́.
- source_word: ἵνα μὴ
  choice: kí èmi má bàa
  rationale: Ìṣètò yìí jẹ́ ọ̀nà Yorùbá adayébá láti sọ ète tàbí àbájáde búburú tí a yẹra fún.
- source_word: λύπην ἐπὶ λύπην
  choice: ìbànújẹ̀ lé orí ìbànújẹ̀
  rationale: Ó pa àtúnsọ àti ipa ìkójọpọ̀ inú Gíríìkì mọ́, ó sì túmọ̀ sí ìbànújẹ̀ tí a fi kún ìbànújẹ̀ mìíràn.
- source_word: σχῶ
  choice: ní
  rationale: “Ní ìbànújẹ̀” jẹ́ ọ̀nà tààrà àti adayébá láti sọ gbólóhùn náà ní Yorùbá láì fi ìtumọ̀ míì kún un.
