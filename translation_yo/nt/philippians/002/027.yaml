    rationale: ‘Lórí ìbànújẹ̀’ ni ìṣọ̀kan tó dára jù lọ fún ìtumọ̀ àwòrán ìkójọpọ̀ ‘upon sorrow’; ó tún dín ewu ìtumọ̀ ‘lé’ gẹ́gẹ́ bí ‘lépa’ kù.
