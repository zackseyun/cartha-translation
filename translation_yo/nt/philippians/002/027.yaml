translation_notes:
  register: Yorùbá àpapọ̀ tó níyì, tó ṣe kedere fún òǹkàwé òde òní ni a lò. A pa ìtẹnumọ́ àti àtúnsọ inú Gíríìkì mọ́, pẹ̀lú àmì ohùn níbi tí ó ti yẹ.
