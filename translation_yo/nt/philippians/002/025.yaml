id: PHP.2.25
reference: Philippians 2:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: yo
  text: Ṣùgbọ́n mo ka a sí ohun tí ó yẹ láti rán Epafiroditu sí yín—arákùnrin mi, alábàáṣiṣẹ́ mi, àti ẹlẹgbẹ́ jagunjagun mi; aṣojú yín[a] àti olùránlọwọ́ fún àìní mi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àpọ́sítélì yín”—ìyẹn ni, aṣojú tí ẹ rán.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ìránṣẹ́ fún àìní mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: ó pọndandan
  rationale: Ó fi hàn pé Pọ́ọ̀lù ka ohun náà sí ohun tí ó yẹ dandan, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἡγησάμην
  choice: mo rò pé
  rationale: Ó ṣàfihàn ìdájọ́ tàbí ìṣírò Pọ́ọ̀lù lórí ohun tí ó yẹ kí ó ṣe, kì í ṣe èrò aláìnípìlẹ̀.
- source_word: πέμψαι
  choice: láti rán ... sí yín
  rationale: Ó tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà; a kò fi ‘padà’ kún un, nítorí pé kò sí nínú gbólóhùn náà.
- source_word: ἀδελφὸν
  choice: arákùnrin mi
  rationale: Ó pa àwòrán ìbátan àwọn onígbàgbọ́ mọ́ láìfi àlàyé tí kò pọndandan kún un.
- source_word: συνεργὸν
  choice: alábàáṣiṣẹ́pọ̀ mi
  rationale: Ó túmọ̀ ẹni tí ń ṣiṣẹ́ pọ̀ pẹ̀lú Pọ́ọ̀lù, ní èdè Yorùbá tó ṣe kedere.
- source_word: συστρατιώτην
  choice: alábàájà mi
  rationale: Ó pa àkàwé ológun mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí a lè lóye gẹ́gẹ́ bí ẹni tí wọ́n jọ ń jagun.
- source_word: ἀπόστολον
  choice: ẹni tí ẹ̀yin rán
  rationale: Ní àyíká yìí, Epafiroditu ni aṣojú tí àwọn ará Fílípì rán; yíyan yìí pa èrò ‘ẹni tí a rán’ mọ́ láìdá a mọ́ ipò àpọ́sítélì pàtó.
- source_word: λειτουργὸν
  choice: ẹni tí ó ń ṣe ìránṣẹ́ fún mi
  rationale: Ó fi iyì iṣẹ́ tí Epafiroditu ṣe hàn láìjẹ́ kí a rò pé ó ń tọ́ka sí oyè ìjọ òde òní.
- source_word: τῆς χρείας μου
  choice: nínú àìní mi
  rationale: Ó ṣàlàyé ibi tí iṣẹ́ Epafiroditu dojú kọ—àìní Pọ́ọ̀lù—ní Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá ἀπόστολον yẹ kí ó jẹ́ oyè pàtó ‘àpọ́sítélì’ tàbí ìtumọ̀ gbogbogbò ‘ẹni tí a rán’.
  choice: ẹni tí ẹ̀yin rán
  alternative: àpọ́sítélì yín
  rationale: Àyíká ọ̀rọ̀ fi Epafiroditu hàn gẹ́gẹ́ bí aṣojú tí ìjọ Fílípì rán sí Pọ́ọ̀lù; ìtumọ̀ yìí kò fi ipò àpọ́sítélì pàtó lé ọ̀rọ̀ náà lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ‘alábàájà’ láti pa àkàwé ológun mọ́, a sì lo gbólóhùn ‘ẹni tí ẹ̀yin rán’ láti yàgò fún fífi oyè ìjọ pàtó sí ἀπόστολον.
