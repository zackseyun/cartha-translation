  to: Ṣùgbọ́n mo ka a sí ohun tí ó yẹ láti rán Epafiroditu sí yín—arákùnrin mi, alábàáṣiṣẹ́ mi, àti ẹlẹgbẹ́ jagunjagun mi; aṣojú yín[a] àti olùránlọwọ́ fún àìní mi[b].
  rationale: A ti rọ́pò ọ̀rọ̀ tí ó lè túmọ̀ sí alábàáṣiṣẹ́ òwò pẹ̀lú “ẹlẹgbẹ́ jagunjagun,” kí àkàwé ológun ti συστρατιώτην lè dúró. A tún tún ìbẹ̀rẹ̀ gbólóhùn ṣe kí ìdájọ́ Pọ́ọ̀lù àti ìpìlẹ̀ àìní hàn ní Yorùbá adayeba. “Aṣojú yín” ń pa ìtumọ̀ tí kò fi oyè àpọ́sítélì pàtó lé Epafiroditu lórí mọ́.
