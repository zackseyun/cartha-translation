translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò. A yan ‘èrò-ọkàn kan náà’ láti mú ἰσόψυχον yé òǹkàwé, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àwòrán ‘ọkàn dọ́gba’ mọ́. ‘Ṣàníyàn nípa’ níbí jẹ́ àníyàn rere ti olùṣọ́-àgùntàn.
