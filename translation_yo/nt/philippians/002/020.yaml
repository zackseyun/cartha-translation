lexical_decisions:
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ipa ọ̀rọ̀ yìí mọ́ gẹ́gẹ́ bí àlàyé fún ohun tí ó ṣáájú.
- source_word: οὐδένα ... ἔχω
  choice: èmi kò ní ẹnikẹ́ni
  rationale: Ó túmọ̀ ọ̀rọ̀ Gíríìkì náà ní tààrà, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἰσόψυχον
  choice: tí ó ní èrò-ọkàn kan náà pẹ̀lú mi bí tirẹ̀
  rationale: Ó ṣàfihàn pé ẹni náà ní ìwà inú àti ìfẹ́-ọkàn tí ó bá ti Paulu mu, nígbà tí ‘bí tirẹ̀’ so ọ̀rọ̀ náà mọ́ Timotiu nínú àyíká ẹsẹ̀ náà.
- source_word: ὅστις
  choice: tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbátan yìí bá ìṣètò gbolohun Yorùbá mu láìfi ìtumọ̀ mìíràn kún un.
- source_word: γνησίως
  choice: fi tọkàntọkàn
  rationale: Ó mú ìtumọ̀ òótọ́ inú àti àìṣẹ̀tàn jáde ní èdè Yorùbá tó wọ́pọ̀.
- source_word: τὰ περὶ ὑμῶν
  choice: ohun tí ó kàn yín
  rationale: Ó pa fífẹ̀ gbòòrò gbolohun Gíríìkì náà mọ́, tí ó lè tọ́ka sí ipò, àníyàn, àti ire àwọn ará Fílípì.
- source_word: μεριμνήσει
  choice: yóò ... ṣàníyàn nípa
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ìtọ́jú onífẹ̀ẹ́ àti àníyàn rere, kì í ṣe dandan ìbànújẹ́ tí kò tọ́.
