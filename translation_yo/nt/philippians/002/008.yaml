  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ Gíríìkì mọ́ dáadáa: ìrẹ̀lẹ̀ tí ó ṣe fúnra rẹ̀, ìgbọ́ràn títí dé ikú, àti ìtẹnumọ́ ikú lórí àgbélébùú. Ṣùgbọ́n a lè mú ìbáṣepọ̀ participle γενόμενος àti àpèjúwe ὑπήκοος hàn ní Yorùbá ní ọ̀nà kúkúrú, adayeba jù lọ.'
