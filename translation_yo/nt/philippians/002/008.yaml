  text: ἐταπείνωσεν ἑαυτὸν γενόμενος ὑπήκοος μέχρι θανάτου, θανάτου δὲ σταυροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/008.yaml
  text: he humbled himself[b][a], becoming obedient to the point of death—even death on a cross.
translation:
  language: yo
  text: Ó rẹ ara rẹ̀ sílẹ̀, ó sì di olùgbọ́ràn títí dé ikú[a]—àní ikú lórí àgbélébùú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “títí débi ikú”; ìtumọ̀ rẹ̀ ni pé ìgbọ́ràn rẹ̀ lọ dé ikú gan-an.
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ikú, àní ti àgbélébùú”; ìtumọ̀ rẹ̀ ni “àní ikú lórí àgbélébùú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: Ó rẹ ara rẹ̀ sílẹ̀
  rationale: Ọ̀rọ̀ yìí jẹ́ àfihàn ìrẹ̀lẹ̀ ara ẹni tí ó mọ̀ọ́mọ̀ ṣe; ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó fi ara rẹ̀ sí ipò rírẹlẹ̀.
- source_word: ἑαυτὸν
  choice: ara rẹ̀
  rationale: A pa arọ́pò-orúkọ afẹ̀hìntì mọ́ nítorí ó tẹnumọ́ pé ìrẹ̀lẹ̀ náà jẹ́ ohun tí òun fúnra rẹ̀ ṣe.
- source_word: γενόμενος
  choice: ó sì di ẹni tí
  rationale: Èyí so ìgbọ́ràn pọ̀ mọ́ bí ó ṣe rẹ ara rẹ̀ sílẹ̀, láì fi dandan pinnu bóyá àkókò tàbí ọ̀nà ni participle náà ń tọ́ka sí.
- source_word: ὑπήκοος
  choice: ó gbọ́ràn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì pa agbára ìtumọ̀ ‘onígbọràn’ mọ́.
- source_word: μέχρι θανάτου
  choice: títí dé ikú
  rationale: Ó pa ìtumọ̀ pé ìgbọ́ràn rẹ̀ dé òpin ikú gan-an mọ́, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: δὲ
  choice: àní
  rationale: 'Níhìn-ín, ó ń mú gbólóhùn ìkẹyìn lágbára: kì í ṣe ikú lásán, ṣùgbọ́n ikú lórí àgbélébùú.'
- source_word: σταυροῦ
  choice: lórí àgbélébùú
  rationale: Èyí tú ìṣọ̀kan genitive kúkúrú náà sí Yorùbá tí ó ṣe kedere, ó sì pa àwòrán gidi ti kíkàn mọ́ àgbélébùú mọ́.
theological_decisions:
- issue: Agbára gbólóhùn ìkẹyìn θανάτου δὲ σταυροῦ
  choice: 'Ìtẹnumọ́ tí ń gbé ọ̀rọ̀ sókè: “àní ikú lórí àgbélébùú.”'
  alternative: “ikú, èyíinì ni ikú àgbélébùú” tàbí “àní ikú ti àgbélébùú”
  rationale: Ọ̀rọ̀ náà dé góńgó rẹ̀ ní irú ikú ẹ̀gàn yìí; “àní” fi ìtẹnumọ́ hàn láì fi ẹ̀kọ́ ìsìn míì kún un.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A yan “rẹ ara rẹ̀ sílẹ̀” dípò ọ̀rọ̀ àtijọ́ tàbí èyí tí ó lè dà bí ìtìjú ẹni, a sì lo “àní” láti pa ìtẹnumọ́ orísun mọ́.
