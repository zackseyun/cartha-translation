  terminology: “rẹ ara rẹ̀ sílẹ̀,” “olùgbọ́ràn,” “ikú,” àti “àgbélébùú” dára fún ìforúkọsílẹ̀ ìwé mímọ́ òde òní. “Àní” pa ìgbésókè ìtẹnumọ́ δέ mọ́ láì ṣàfikún ìtumọ̀ ẹ̀kọ́ ìsìn.
