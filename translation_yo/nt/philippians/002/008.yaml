  to: Ó rẹ ara rẹ̀ sílẹ̀, ó sì di olùgbọ́ràn títí dé ikú[a]—àní ikú lórí àgbélébùú[b].
  rationale: 'Àtúnṣe kan ṣoṣo ni a ṣe: a rọ́pò “di ẹni tí ó gbọ́ràn” pẹ̀lú “di olùgbọ́ràn.” Èyí jẹ́ Yorùbá adayeba síi, ó sì pa ẹ̀sùn participle “nípa dídí ẹni ọlọ́gbọ́ràn” mọ́. Àwọn àmì ẹsẹ̀ àti ìtumọ̀ wọn dúró ní ibi tó bá ọ̀rọ̀ tí wọ́n tọ́ka sí mu.'
