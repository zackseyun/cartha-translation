  verdict: approve
  source_fidelity: 'Ìtumọ̀ náà ṣàfihàn gbogbo àwọn ẹ̀yà pàtàkì nínú Gíríìkì: οἱ πάντες = “gbogbo wọn,” γάρ = “Nítorí,” ζητοῦσιν = “ń wá,” àti ìfiwéra láàárín τὰ ἑαυτῶν àti τὰ Ἰησοῦ Χριστοῦ. “Ohun tó jẹ́ tiwọn fúnra wọn” pa ìmọ̀ràn gbòòrò ‘ohun/ìfẹ́ tirẹ̀’ mọ́, kò sì fi èrè tàbí owó kún un. “Ohun tó jẹ́ ti Jésù Mèsáyà” tún pa ellipsis Gíríìkì náà mọ́ ní ọ̀nà tí ó ṣe kedere nínú Yorùbá.'
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá ìgbàlódé tó dára, tó ní ìwọ̀ntúnwọ̀nsì nínú ìforúkọsílẹ̀, ó sì lo àmì ohùn dáadáa. Ìlò “kì í ṣe” nínú ìfiwéra yìí jẹ́ àdánidá, ó sì sọ pé ohun tí wọ́n ń lépa kì í ṣe ohun ti Jésù Mèsáyà.
  terminology: “Jésù Mèsáyà” yẹ fún Χριστοῦ gẹ́gẹ́ bí oyè, ó sì pa ìtumọ̀ rẹ̀ mọ́. Àlàyé ìsàlẹ̀ [a], “Tàbí, ‘Jésù Kristi,’” fúnni ní ọ̀nà ìbílẹ̀ tí ó wọ́pọ̀ láì yí ìtumọ̀ àkọ́kọ́ padà.
