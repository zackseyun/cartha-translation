  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: yo
  text: Nítorí gbogbo wọn ń wá ohun tó jẹ́ tiwọn fúnra wọn, kì í ṣe ohun tó jẹ́ ti Jésù Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘Jésù Kristi.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάντες
  choice: gbogbo wọn
  rationale: Ó ń tọ́ka sí gbogbo àwọn ènìyàn tí Pọ́ọ̀lù ní lọ́kàn; ‘gbogbo wọn’ pa ìtẹnumọ́ àpapọ̀ náà mọ́ ní Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: τὰ ἑαυτῶν
  choice: ohun tó jẹ́ tiwọn fúnra wọn
  rationale: Ọ̀rọ̀ náà jẹ́ àṣà-ìsọ̀rọ̀ tó túmọ̀ sí ohun gbogbo tó jẹ mọ́ ti ara ẹni. Ìtumọ̀ yìí pa ìbòòrò rẹ̀ àti ìtẹnumọ́ ‘ti ara wọn’ mọ́ láì fi ‘ire’ tàbí ‘èrè’ tí kò hàn gbangba sínú rẹ̀.
- source_word: ζητοῦσιν
  choice: ń wá
  rationale: ‘Ń wá’ jẹ́ ìtumọ̀ tààrà tó sì bá àwọn apá méjèèjì nínú ìfiwéra náà mu.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: ohun tó jẹ́ ti Jésù Mèsáyà
  rationale: A tún èrò ‘ohun tó jẹ́ ti’ sọ ní Yorùbá kí ìfiwéra náà lè ṣe kedere. ‘Mèsáyà’ fi ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni àmì-òróró hàn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́, nígbà tí ‘Kristi’ jẹ́ ọ̀nà ìbílẹ̀ míì tí àwọn òǹkàwé Yorùbá mọ̀; a fi ọ̀nà kejì sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó bá yẹ. Gbólóhùn náà pa ìfiwéra tó wà nínú Gíríìkì mọ́, kò sì dín ‘ohun tó jẹ́ tiwọn’ kù sí owó, èrè, tàbí àǹfààní nìkan.
