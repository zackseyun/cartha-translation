base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: yo
  text: Nítorí náà, Ọlọ́run tún gbé e ga jù lọ, ó sì fi orúkọ tí ó ga ju gbogbo orúkọ lọ fún un ní oore-ọ̀fẹ́.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó sì bù kún un ní orúkọ tí ó ga ju gbogbo orúkọ lọ.”
    reason: lexical_alternative
  - marker: b
    text: “Orúkọ” lè má tọ́ka sí orúkọ tí a ń pè nìkan, ṣùgbọ́n ó tún lè tọ́ka sí ipò, ọlá, tàbí oyè; ẹsẹ̀ yìí fúnra rẹ̀ kò tíì sọ orúkọ tí a tọ́ka sí.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Nítorí náà ... pẹ̀lú
  rationale: “Nítorí náà” pa ìtumọ̀ ìyọrísí διό mọ́, “pẹ̀lú” sì fi agbára àfikún καί hàn ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ὁ θεὸς
  choice: Ọlọ́run
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó bójú mu fún ìtọ́kasí Ọlọ́run gẹ́gẹ́ bí olùṣe tí Gíríìkì sọ ní kedere.
- source_word: ὑπερύψωσεν
  choice: gbé e ga jù lọ
  rationale: Ó pa agbára ìmúga gidigidi tí ó wà nínú ọ̀rọ̀-ìṣe àkópọ̀ Gíríìkì mọ́, ó sì jẹ́ Yorùbá tí ó ṣe kedere, tí ó sì lọ́nà.
- source_word: ἐχαρίσατο
  choice: fi oore-ọ̀fẹ́ fún un
  rationale: Ìtumọ̀ yìí mú ìbáṣepọ̀ ọ̀rọ̀ náà pẹ̀lú χάρις, ìyẹn oore-ọ̀fẹ́, hàn ju “fún un” lásán lọ.
- source_word: τὸ ὄνομα
  choice: orúkọ
  rationale: A pa ọ̀rọ̀ gangan náà mọ́ láì yí i padà sí ipò tàbí oyè, nítorí ẹsẹ̀ yìí fúnra rẹ̀ kò tíì sọ orúkọ náà ní pàtó.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: orúkọ tí ó ga ju gbogbo orúkọ lọ
  rationale: Ó pa ìfiwéra Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere, tí ó ní iyì.
theological_decisions:
- issue: Ìdánimọ̀ “orúkọ náà”
  choice: A fi sílẹ̀ gẹ́gẹ́ bí “orúkọ” láì sọ ohun tí orúkọ náà jẹ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Ó lè tọ́ka sí orúkọ “Jésù,” tàbí sí oyè Ọlọ́run “Olúwa” tí àwọn ẹsẹ̀ tó tẹ̀ lé mú wá sí iwájú.
  rationale: Ẹsẹ̀ 9 fúnra rẹ̀ kò dá orúkọ náà mọ̀ ní kedere; nítorí náà, ìtumọ̀ náà pa ààyè ìtumọ̀ inú ọ̀rọ̀ Gíríìkì mọ́, kò sì fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ kan kún un.
translation_notes:
  register: Yorùbá àgbéléwọ̀n tí ó ní iyì, tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. “Gbé e ga jù lọ” jẹ́ ọ̀nà Yorùbá tó rọrùn fún ìmúga tó lágbára; “fi oore-ọ̀fẹ́ fún un” sì pa ìfarahàn oore-ọ̀fẹ́ inú ἐχαρίσατο mọ́.
