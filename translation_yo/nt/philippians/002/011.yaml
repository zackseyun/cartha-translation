id: PHP.2.11
reference: Philippians 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: yo
  text: kí gbogbo ahọ́n sì jẹ́wọ́ pé Jésù Mèsáyà[a] ni Olúwa, fún ògo Ọlọ́run Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Jésù Kristi ni Olúwa.”'
    reason: Àṣàyàn ìtumọ̀ fún Χριστός; “Kristi” ni àkọsílẹ̀ ohùn oyè Gíríìkì tí ó ti wọ́pọ̀ nínú èdè ìjọ.
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: gbogbo ahọ́n
  rationale: Èyí tẹ̀ lé àwòrán ara inú Gíríìkì, ó sì ń sọ nípa ìjẹ́wọ́ gbogbo ènìyàn láì sọ àwòrán náà di pẹlẹbẹ.
- source_word: ἐξομολογήσηται
  choice: jẹ́wọ́
  rationale: “Jẹ́wọ́” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìké argentí gbangba tàbí ìfihàn ohun tí ẹni gbà pé ó jẹ́ òtítọ́; kò fi àlàyé àfikún sí ọ̀rọ̀ Gíríìkì.
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó ní iyì, tí ó sì pa agbára ìjẹ́wọ́ nípa ipò Jésù mọ́.
- source_word: Χριστός
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, nítorí náà “Mèsáyà” mú ìtumọ̀ oyè náà hàn ju kí a kàn lo àkọsílẹ̀ ohùn “Kristi” lọ.
- source_word: εἰς δόξαν
  choice: fún ògo
  rationale: Ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá fún ipa tàbí àbájáde tí ó ń yọrí sí ògo, láì mú ìtumọ̀ náà lọ sí ọ̀nà kan ṣoṣo ju ohun tí Gíríìkì sọ lọ.
- source_word: θεοῦ πατρός
  choice: Ọlọ́run Baba
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ní iyì láti sọ “God the Father.”
theological_decisions:
- issue: Ìtumọ̀ Χριστός nínú ìjẹ́wọ́ nípa Jésù
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: “Mèsáyà” túmọ̀ oyè náà, ó sì jẹ́ kí ìbéèrè Mèsáyà inú ìjẹ́wọ́ náà hàn; “Kristi” tí ìjọ mọ̀ dáadáa wà nínú àlàyé ìsàlẹ̀ láti má ṣe fi àṣà ìtúmọ̀ kan ṣoṣo pamọ́.
- issue: Ìbáṣepọ̀ gírámà ἐξομολογήσηται pẹ̀lú gbólóhùn tó bẹ̀rẹ̀ ní ẹsẹ 10
  choice: kí ... sì jẹ́wọ́
  alternative: gbogbo ahọ́n yóò sì jẹ́wọ́
  rationale: Fífi “kí” lò ń pa ìṣe abẹ́-gbólóhùn ète inú Gíríìkì mọ́, dípò yíyí rẹ̀ sí àsọtẹ́lẹ̀ ọjọ́ iwájú tó dá dúró.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà mọ̀ọ́mọ̀ bẹ̀rẹ̀ pẹ̀lú “kí” àti “sì” nítorí pé ó ń tẹ̀ síwájú láti inú ète tí ó bẹ̀rẹ̀ ní ẹsẹ 10; ó lè dà bí àjẹkù tí a bá ya ẹsẹ 11 sọ́tọ̀, ṣùgbọ́n ó pé nínú àyíká rẹ̀.
