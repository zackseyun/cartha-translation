revisions:
- from: 'Ẹ mú ayọ̀ mi pé[a]: kí ẹ máa ní èrò kan náà, kí ẹ ní ìfẹ́ kan náà, kí ẹ jẹ́ ọ̀kan ní ọkàn[b], kí ẹ sì máa ronú nípa ohun kan náà[c].'
  to: 'Ẹ mú ayọ̀ mi kún[a]: kí ẹ ní èrò kan náà, kí ẹ ní ìfẹ́ kan náà, kí ẹ jẹ́ ọkàn kan[b], kí ẹ sì ronú nípa ohun kan náà[c].'
  rationale: A tún ‘mú … pé’ ṣe sí ‘mú … kún’ fún Yorùbá tó rọrùn àti ìbámu pẹ̀lú πληρόω. A yọ ‘máa’ kúrò nítorí pé ó lè ṣàfikún ìtumọ̀ habitual tí Gíríìkì kò sọ. A sì tún σύμψυχοι ṣe sí ‘jẹ́ ọkàn kan’ kí ìṣọ̀kan inú/ọkàn hàn ní ọ̀nà Yorùbá boṣewa. Àwọn àmì ìsàlẹ̀ àti àwọn àṣàyàn wọn wà ní ipò tó tọ́, wọ́n sì pa ìfẹ̀hónúhàn orísun mọ́.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:20Z'
