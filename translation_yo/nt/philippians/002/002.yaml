  verdict: revise
  source_fidelity: Ìtumọ̀ náà gba ìpè Pọ́ọ̀lù sí ìṣọ̀kan, ìfẹ́ kan náà, àti àtúnlò ìmọ̀ràn/ìrònú. Ṣùgbọ́n ‘máa’ ń fi ìtumọ̀ ìṣe àṣà-tẹ̀síwájú kún àwọn ìṣe Gíríìkì tí kò hàn ní orísun, àti ‘ọ̀kan ní ọkàn’ kì í ṣe ọ̀nà Yorùbá tó rọrùn jù lọ láti sọ σύμψυχοι.
  naturalness: ‘Ẹ mú ayọ̀ mi kún’ jẹ́ ìsọ̀rọ̀ Yorùbá tó dára, tó sì sun mọ́ àwòrán ‘fún un kún’ nínú πληρώσατε. ‘Kí ẹ jẹ́ ọkàn kan’ jẹ́ ìsọ̀rọ̀ àdánidá fún ìṣọ̀kan ọkàn. Àtúnṣe náà yọ ‘máa’ kúrò láti jẹ́ kí ìpè náà taara.
  terminology: ‘Ayọ̀,’ ‘ìfẹ́,’ ‘ọkàn,’ ‘èrò,’ àti ‘ronú’ bá ìforúkọsílẹ̀ Yorùbá boṣewa mu. Lílo ‘èrò kan náà’ àti ‘ronú nípa ohun kan náà’ pa ìfarahàn méjì φρονέω mọ́ láìsọ ìtumọ̀ ẹ̀kọ́ kan pàtó.
