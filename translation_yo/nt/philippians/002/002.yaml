id: PHP.2.2
reference: Philippians 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: yo
  text: 'Ẹ mú ayọ̀ mi kún[a]: kí ẹ ní èrò kan náà, kí ẹ ní ìfẹ́ kan náà, kí ẹ jẹ́ ọkàn kan[b], kí ẹ sì ronú nípa ohun kan náà[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ mú ayọ̀ mi dé ẹ̀kúnrẹ́rẹ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “ẹ jẹ́ oní-ọkàn kan náà”; tàbí, “ẹ jẹ́ ọ̀kan ní ẹ̀mí.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí ẹ fi ọkàn sí ète kan náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: Ẹ mú ayọ̀ mi pé
  rationale: Ọ̀rọ̀ yìí pa á láṣẹ pé kí wọ́n mú ayọ̀ Pọ́ọ̀lù dé ẹ̀kúnrẹ́rẹ́; ‘mú … pé’ jẹ́ Yorùbá àdánidá tí ó sì pa àwòrán ìkúnwọ̀n inú Gíríìkì mọ́.
- source_word: ἵνα
  choice: ': kí'
  rationale: Níhìn-ín, ἵνα ṣàlàyé ohun tí yóò mú ayọ̀ náà pé, ó sì tún lè ní ìtumọ̀ ète tàbí àbájáde. Àmì olójú méjì àti ‘kí’ jẹ́ kí ìbáṣepọ̀ náà ṣe kedere láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: kí ẹ máa ní èrò kan náà
  rationale: φρονέω ní inú Fílípì ń tọ́ka sí ọ̀nà ìrònú tàbí ìwà-ọkàn, kì í ṣe ìmọ̀ lasan. ‘Ní èrò kan náà’ jẹ́ àdánidá, ó sì pa ìpè sí ìṣọ̀kan mọ́.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: kí ẹ ní ìfẹ́ kan náà
  rationale: Ìtumọ̀ yìí pa ọ̀rọ̀ ‘ìfẹ́’ àti àtúnṣe ‘kan náà’ mọ́ ní Yorùbá tí ó rọrùn láti lóye.
- source_word: σύμψυχοι
  choice: kí ẹ jẹ́ ọ̀kan ní ọkàn
  rationale: Ọ̀rọ̀ àkójọpọ̀ Gíríìkì náà sọ nípa jíjẹ́ alábàápín ọkàn tàbí ẹ̀mí inú. Ìtumọ̀ yìí pa àwòrán ‘ọkàn kan’ mọ́, ó sì lágbára ju ‘kí ẹ ṣọ̀kan’ lásán lọ.
- source_word: τὸ ἓν φρονοῦντες
  choice: kí ẹ sì máa ronú nípa ohun kan náà
  rationale: Ìtumọ̀ yìí pa àtúnlò φρονέω àti ìtẹnumọ́ ‘ohun kan náà’ mọ́, bí ó tilẹ̀ jẹ́ pé gbolohun náà tún lè tọ́ka sí fífi ọkàn sí ète kan náà.
theological_decisions:
- issue: Bí a ṣe lè tú àtúnlò φρονέω àti ìpè sí ìṣọ̀kan
  choice: Lo ‘ní èrò kan náà’ àti ‘máa ronú nípa ohun kan náà’ láti fi àtúnlò ọ̀rọ̀ náà hàn.
  alternative: ‘Ní ìwà-ọkàn kan náà … fi ọkàn sí ète kan náà.’
  rationale: Gíríìkì fi àtúnlò àti ìyípadà kékeré tẹ ìṣọ̀kan mọ́lẹ̀. Ìtumọ̀ yìí kò sọ ìṣọ̀kan di ìbámu pátápátá nínú gbogbo èrò, bẹ́ẹ̀ ni kò fi ẹ̀kọ́ nípa ètò ìjọ kún ọ̀rọ̀ náà.
- issue: Ìbáṣepọ̀ ἵνα pẹ̀lú àṣẹ ‘mú ayọ̀ mi pé’
  choice: 'Fi hàn gẹ́gẹ́ bí àlàyé ohun tí yóò mú ayọ̀ náà pé, nípa lílo ‘: kí’.'
  alternative: ‘Ẹ mú ayọ̀ mi pé, kí …’ gẹ́gẹ́ bí ète tàbí àbájáde ní kedere.
  rationale: ἵνα lè ní agbára ète tàbí kí ó ṣàlàyé àkóónú nínú àyíká yìí; àtẹ̀jáde náà yàgò fún pípa ìṣòro yìí tán ju bí orísun ṣe ṣe lọ.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn gbólóhùn ‘kí ẹ …’ tó tẹ̀ lé ara wọn fara wé ìtẹnumọ́ àti ìṣètò ọ̀rọ̀ Gíríìkì.
