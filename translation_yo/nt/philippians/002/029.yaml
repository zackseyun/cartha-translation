  text: προσδέχεσθε οὖν αὐτὸν ἐν κυρίῳ μετὰ πάσης χαρᾶς, καὶ τοὺς τοιούτους ἐντίμους ἔχετε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/029.yaml
  text: So welcome him in the Lord with all joy[a], and hold people like him in honor.
translation:
  language: yo
  text: Nítorí náà, ẹ tẹ́wọ́ gbà á nínú Olúwa pẹ̀lú gbogbo ayọ̀, kí ẹ sì máa bọ̀wọ̀ fún àwọn ènìyàn irú rẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “irú àwọn ọkùnrin bẹ́ẹ̀.” Gbólóhùn Gíríìkì níbí wà ní ìrísí akọ púpọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέχεσθε
  choice: ẹ ... tẹ́wọ́ gbà á
  rationale: Ọ̀rọ̀ yìí jẹ́ àṣẹ láti fi inú rere àti ọ̀yàyà gba ẹni náà, kì í ṣe láti kàn gbà á láàyè; “tẹ́wọ́ gbà” jẹ́ ọ̀nà Yorùbá àdánidá fún ìkíni káàbọ̀ pẹ̀lú ìtẹ́wọ́gbà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó pa agbára ìyọrísí ọ̀rọ̀ Gíríìkì mọ́, ó sì so àṣẹ yìí mọ́ ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa gbólóhùn Pọ́ọ̀lù tó ṣe kókó mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo rọ́pò rẹ̀.
- source_word: μετὰ πάσης χαρᾶς
  choice: pẹ̀lú gbogbo ayọ̀
  rationale: “Gbogbo ayọ̀” ṣàfihàn kíkún tí πάσης ní, ó sì jẹ́ Yorùbá tó ṣe kedere.
- source_word: τοὺς τοιούτους
  choice: àwọn ènìyàn irú rẹ̀
  rationale: Ó tọ́ka sí àwọn ẹni tí ìwà àti iṣẹ́ wọn rí bí ti Epafiroditu; ìtumọ̀ yìí jẹ́ àdánidá, nígbà tí àlàyé ìsàlẹ̀ fi akọ púpọ̀ inú Gíríìkì hàn.
- source_word: ἐντίμους ἔχετε
  choice: ẹ ... máa bọ̀wọ̀ fún
  rationale: Ó fi hàn pé kí wọn ka irú àwọn ẹni náà sí ẹni ọlá, kí wọn sì hùwà sí wọn gẹ́gẹ́ bí ẹni ọlá; ó jẹ́ ọ̀nà Yorùbá tó rọrùn.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn “nínú Olúwa”
  choice: Pa gbólóhùn kúkúrú náà mọ́ gẹ́gẹ́ bí “nínú Olúwa.”
  alternative: “gẹ́gẹ́ bí ẹni tí ó jẹ́ ti Olúwa” tàbí “ní ìṣọ̀kan pẹ̀lú Olúwa”
  rationale: Gbólóhùn Gíríìkì lè ru èrò ìbáṣepọ̀, ìṣọ̀kan, tàbí bí ìtẹ́wọ́gbà ṣe wáyé lábẹ́ Olúwa; ìtumọ̀ kúkúrú náà kò fi tipátipá yan ọ̀kan nínú wọn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì ń lo àṣẹ ẹni-kejì púpọ̀ “ẹ” gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
