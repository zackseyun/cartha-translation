id: PHP.2.28
reference: Philippians 2:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: yo
  text: Nítorí náà, mo fi ìtara tó pọ̀ sí i rán an, kí inú yín lè dùn nígbà tí ẹ bá tún rí i, kí ìbànújẹ́ tèmi sì lè dín kù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: pẹ̀lú ìtara tó pọ̀ sí i
  rationale: Ọ̀rọ̀ adáfihàn afiwéra náà fi hàn pé ìtara Pọ́ọ̀lù pọ̀ ju ti tẹ́lẹ̀ lọ; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá tó pa agbára afiwéra mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so ìṣe yìí mọ́ ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ, ó sì fi ìyọrísí tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn.
- source_word: ἔπεμψα
  choice: mo ... rán an
  rationale: Aorist náà ni a túmọ̀ sí ìṣe àtijọ́ lasán; èyí bá àyíká ọ̀rọ̀ mu láìfi ìtumọ̀ àfikún kún un.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ìṣètò yìí sọ ète ìránṣẹ́ náà ní Yorùbá àdánidá.
- source_word: ἰδόντες
  choice: nígbà tí ẹ bá ... rí i
  rationale: Participle aorist náà jẹ́ ipò àkókò nínú gbólóhùn ète; ‘nígbà tí’ fi ìbáṣepọ̀ náà hàn kedere.
- source_word: πάλιν
  choice: tún
  rationale: Ó tọ́ka sí rírí Épafíródítù lẹ́ẹ̀kan sí i.
- source_word: χαρῆτε
  choice: inú yín lè dùn
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó sì níyì, láti sọ pé kí wọ́n yọ̀; ‘lè’ pa ipa subjunctive nínú gbólóhùn ète mọ́.
- source_word: κἀγὼ
  choice: kí ... tèmi sì
  rationale: Crasis καὶ ἐγώ so abajade kejì pọ̀ mọ́ ti àkọ́kọ́; ‘sì’ fi ìṣọ̀kan náà hàn ní Yorùbá.
- source_word: ἀλυπότερος
  choice: ìbànújẹ́ tèmi ... dín kù
  rationale: Afiwéra náà túmọ̀ sí pé ìbànújẹ́ tàbí ìrora ọkàn Pọ́ọ̀lù yóò kéré sí i; ọ̀rọ̀ yìí kò fi ‘àníyàn’ tóóró lé e lórí.
- source_word: ὦ
  choice: lè ... dín kù
  rationale: Subjunctive εἰμί pẹ̀lú ἀλυπότερος ni a sọ lọ́nà àdánidá gẹ́gẹ́ bí dídín ìbànújẹ́ kù, tí ‘lè’ sì fi ète tàbí abajade tí a ń retí hàn.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tó níyì ni a lò. A yí àpẹẹrẹ ‘jẹ́ aláìbànújẹ́ díẹ̀ sí i’ padà sí ‘ìbànújẹ́ ... dín kù’ nítorí pé ó jẹ́ àdánidá sí etí Yorùbá, ó sì pa afiwéra Gíríìkì mọ́.
