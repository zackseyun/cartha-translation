  to: Ṣùgbọ́n bí a tilẹ̀ ń dà mí jáde gẹ́gẹ́ bí ẹbọ ohun mímu[a] sórí ẹbọ àti iṣẹ́ ìsìn[b] ìgbàgbọ́ yín[c], mo yọ̀, mo sì bá gbogbo yín yọ̀.
