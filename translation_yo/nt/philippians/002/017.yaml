id: PHP.2.17
reference: Philippians 2:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: yo
  text: Ṣùgbọ́n bí a tilẹ̀ ń dà mí jáde gẹ́gẹ́ bí ẹbọ ohun mímu[a] sórí ẹbọ àti iṣẹ́ ìsìn[b] ìgbàgbọ́ yín[c], mo yọ̀, mo sì bá gbogbo yín yọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ń dà mí jáde bí ẹbọ ohun mímu.”
    reason: lexical_alternative
  - marker: b
    text: “Iṣẹ́ ìsìn” tún lè jẹ́ “iṣẹ́ àlùfáà” tàbí “iṣẹ́ ìránṣẹ́”; ọ̀rọ̀ Gíríìkì náà pa èdè ìjọsìn mọ́ níbí.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ìṣòtítọ́ yín.”
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: a ń dà mí jáde gẹ́gẹ́ bí ọrẹ ohun mímu
  rationale: Ọ̀rọ̀ náà jẹ́ àwòrán ọrẹ ohun mímu tí a ń dà jáde nínú ìjọsìn ẹbọ. Gbólóhùn yìí mú àwòrán náà hàn kedere ní Yorùbá, ó sì pa ìṣe aláìlèsọ̀ mọ́.
- source_word: ἐπὶ
  choice: sórí
  rationale: Pẹ̀lú ọ̀rọ̀ dative tí ó tẹ̀ lé e, ó lè túmọ̀ sí pé a ń da ọrẹ Pọ́ọ̀lù sórí ẹbọ àwọn ará Fílípì tàbí pé a fi kún un; “sórí” pa àwòrán ìdásílẹ̀ ọrẹ mọ́.
- source_word: θυσίᾳ
  choice: ẹbọ
  rationale: “Ẹbọ” ni ọ̀rọ̀ Yorùbá tó bá èdè ìrúbọ mu, ó sì pa àyíká ìjọsìn inú ẹsẹ náà mọ́.
- source_word: λειτουργίᾳ
  choice: iṣẹ́ ìsìn
  rationale: Nínú àyíká ẹbọ yìí, “iṣẹ́ ìsìn” lè tọ́ka sí iṣẹ́ ìjọsìn láìfi dandan sọ pé àwọn ará Fílípì jẹ́ àlùfáà; ó tún jẹ́ èdè Yorùbá tó ṣeé lóye.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ àkọ́kọ́ tó bójú mu níbí, ó sì lè tọ́ka sí ìgbẹ́kẹ̀lé wọn nínú Ọlọ́run tí wọ́n ń fi hàn gẹ́gẹ́ bí ẹbọ àti iṣẹ́ ìsìn.
- source_word: χαίρω
  choice: mo yọ̀
  rationale: Ó pa àkòrí ayọ̀ inú lẹ́tà Fílípì mọ́ ní ọ̀nà àdánidá ní Yorùbá.
- source_word: συγχαίρω
  choice: mo sì bá gbogbo yín yọ̀
  rationale: Ó sọ ìtumọ̀ ayọ̀ tí Pọ́ọ̀lù àti gbogbo wọn ń pín papọ̀ ní kedere, dípò ìkíni oríire.
- source_word: πᾶσιν ὑμῖν
  choice: gbogbo yín
  rationale: Ó pa ìtẹnumọ́ Pọ́ọ̀lù mọ́ pé gbogbo àwọn ọmọ ìjọ náà ló wà nínú ayọ̀ apapọ̀ yìí.
theological_decisions:
- issue: Àwòrán ẹbọ fún ikú Pọ́ọ̀lù tí ó ṣeé ṣe
  choice: A ṣàpèjúwe Pọ́ọ̀lù bí ọrẹ ohun mímu tí a ń dà sórí ẹbọ àti iṣẹ́ ìsìn ìgbàgbọ́ àwọn ará Fílípì.
  alternative: A ń fi ìgbésí ayé Pọ́ọ̀lù rúbọ lẹ́gbẹ̀ẹ́ iṣẹ́ wọn lásán, láìtẹnumọ́ àwòrán ẹbọ.
  rationale: Àpapọ̀ σπένδομαι, θυσία àti λειτουργία fi agbára mú èdè ẹbọ àti ìjọsìn wá; nítorí náà, a kò sọ ọ́ di iṣẹ́ gbogbogbò lásán.
- issue: Ìtumọ̀ πίστεως
  choice: ìgbàgbọ́ yín
  alternative: ìṣòtítọ́ yín
  rationale: Ìgbàgbọ́ ni ìtumọ̀ tó ṣeé ṣe jù ní àyíká yìí, ṣùgbọ́n ìṣòtítọ́ ṣì jẹ́ ìtumọ̀ èdè Gíríìkì tó ṣeé gbà, nítorí náà a pa á mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàdojú, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “ọrẹ ohun mímu,” “ẹbọ,” àti “iṣẹ́ ìsìn” láti pa àwòrán ìjọsìn Gíríìkì mọ́, láìfi èrò ẹ̀sìn ẹgbẹ́ kan kún un.
