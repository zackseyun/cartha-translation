id: PHP.2.4
reference: Philippians 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ τὰ ἑαυτῶν ⸀ἕκαστοι ⸀σκοποῦντες, ἀλλὰ καὶ τὰ ἑτέρων ⸁ἕκαστοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: yo
  text: Kí olúkúlùkù yín má ṣe máa fiyè sí ire tirẹ̀ nìkan[a], ṣùgbọ́n kí ó tún máa fiyè sí ire àwọn ẹlòmíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Gíríìkì gan-an, “Kí olúkúlùkù yín má ṣe máa wo àwọn ohun tirẹ̀, ṣùgbọ́n kí ó tún máa wo àwọn ohun ti àwọn ẹlòmíràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: máa fiyè sí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí yíyí àfiyèsí tàbí ìtọ́jú sí ohun kan. “Máa fiyè sí” jẹ́ èdè Yorùbá àdánidá tó fi ìṣọ́ra àti àníyàn hàn, kì í sì í sọ ọ́ di ìmọ̀lára lásán.
- source_word: τὰ ἑαυτῶν
  choice: ire tirẹ̀
  rationale: Gbólóhùn Gíríìkì náà gbòòrò ju ohun ìní lọ; ó lè kan ọ̀ràn, àǹfààní, tàbí ohun tó dára fún ẹni. “Ire tirẹ̀” bá àyíká ọ̀rọ̀ mu, ó sì yẹra fún ìtumọ̀ pé ohun ìní nìkan ni.
- source_word: ἕκαστοι
  choice: olúkúlùkù yín
  rationale: Ó ń pín ìkìlọ̀ náà fún ẹnì kọ̀ọ̀kan lára àwọn tí Pọ́ọ̀lù ń bá sọ̀rọ̀. “Olúkúlùkù yín” mú agbára ìpínkiri yẹn jáde kedere.
- source_word: ἀλλὰ καὶ
  choice: ṣùgbọ́n kí ó tún
  rationale: Àkójọpọ̀ yìí ń fi ìyàtọ̀ àti àfikún hàn. Ìṣètò “kì í ṣe ... nìkan, ṣùgbọ́n ... tún” ni ọ̀nà Yorùbá àdánidá láti fi èrò náà hàn.
- source_word: τὰ ἑτέρων
  choice: ire àwọn ẹlòmíràn
  rationale: Bíi τὰ ἑαυτῶν, ó tọ́ka sí ohun tó jẹ mọ́ àwọn ẹlòmíràn ní gbogbogbòò, títí kan ire àti ọ̀ràn wọn. “Ire àwọn ẹlòmíràn” ṣe kedere láì fi í mọ́ ohun ìní nìkan.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “ire” láti mú ìtumọ̀ àyíká ọ̀rọ̀ jáde, nígbà tí àlàyé ìsàlẹ̀ ojú-ewé pa ìtumọ̀ gangan “àwọn ohun” mọ́. Àṣẹ “Kí ...” mú ipa ìyanjú inú àyíká ọ̀rọ̀ jáde, bí ó tilẹ̀ jẹ́ pé σκοποῦντες jẹ́ participle ní Gíríìkì.
