source:
  edition: SBLGNT
  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin mọ ìwà rẹ̀ tí a ti dán wò,[a] pé, gẹ́gẹ́ bí ọmọ pẹ̀lú baba rẹ̀, ó bá mi ṣiṣẹ́ fún ìhìn rere.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ìyẹn ni, ìwà tí ìdánwò ti fi hàn pé ó jẹ́ ojúlówó; a tún lè túmọ̀ rẹ̀ sí “ìwà rẹ̀ tí a ti fìdí rẹ̀ múlẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “bí ọmọ pẹ̀lú baba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tàbí ìyípadà kékeré nínú ọ̀rọ̀ hàn ní Yorùbá àdánidá.
- source_word: δοκιμὴν αὐτοῦ
  choice: ìwà rẹ̀ tí a ti dán wò tí ó sì jẹ́ òtítọ́
  rationale: Ó mú èrò ìwà tí ìdánwò ti fi hàn pé ó jẹ́ ojúlówó jáde, dípò kí ó túmọ̀ sí ẹ̀rí lásán.
- source_word: γινώσκετε
  choice: ẹ̀yin mọ
  rationale: Ó sọ ìmọ̀ tí àwọn ará Fílípì ti ní nípa Tímótì ní tààràtà; fífi 'ẹ̀yin' hàn tẹnumọ́ olùgbà ọ̀pọ̀.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣí àlàyé ohun tí wọ́n mọ̀ nípa Tímótì sílẹ̀.
- source_word: ὡς πατρὶ τέκνον
  choice: bí ọmọ pẹ̀lú baba rẹ̀
  rationale: Ó pa àfiwé ìdílé àti ọ̀rọ̀ gbogbogbò τέκνον mọ́, láì fi akọ kún un níbi tí Gíríìkì kò ti ṣe bẹ́ẹ̀.
- source_word: σὺν ἐμοὶ ἐδούλευσεν
  choice: ó ṣe bá mi ṣiṣẹ́ ìránṣẹ́
  rationale: Ìṣètò yìí sọ iṣẹ́ ìránṣẹ́ tímọ́tímọ́ tí ó ṣe pọ̀ mọ́ Pọ́ọ̀lù ní Yorùbá àdánidá, láì mú ọ̀rọ̀ náà di iṣẹ́ ẹrú ní dandan.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: fún ìhìn rere
  rationale: Ó fi ìdarí àti ète iṣẹ́ wọn hàn ní ṣókí, nígbà tí ó pa ìhìn rere mọ́ gẹ́gẹ́ bí ohun tí iṣẹ́ náà ń tẹ̀ sí.
theological_decisions:
- issue: Ìbáṣepọ̀ Tímótì pẹ̀lú Pọ́ọ̀lù nínú àfiwé baba àti ọmọ
  choice: bí ọmọ pẹ̀lú baba rẹ̀
  alternative: bí ọmọkùnrin ṣe ń sin baba rẹ̀
  rationale: Àṣàyàn náà pa àfiwé Gíríìkì mọ́, kò sọ pé Pọ́ọ̀lù ni baba Tímótì ní tààràtà, kò sì fi akọ tàbí èrò pé ọmọ ń sin baba rẹ̀ kún ọ̀rọ̀ orísun.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “iṣẹ́ ìránṣẹ́” láti mú agbára ἐδούλευσεν jáde láì fi ìtumọ̀ ẹrú tí àyíká ọ̀rọ̀ kò fi dandan múlẹ̀ kún un.
