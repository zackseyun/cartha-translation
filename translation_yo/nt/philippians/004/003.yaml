  terminology: “Ìhìn rere,” “alábàáṣiṣẹ́,” àti “ìwé ìyè” jẹ́ àwọn ọ̀rọ̀ Bíbélì Yorùbá tó bójú mu. “Alábàákẹ́gbẹ́ tòótọ́” jẹ́ ìtumọ̀ àdánidá fún ìpè àpèjúwe náà, nígbà tí “alábàápín àjàgà tòótọ́” ń pa àwòrán tààrà mọ́ nínú àlàyé ìsàlẹ̀.
  issues:
