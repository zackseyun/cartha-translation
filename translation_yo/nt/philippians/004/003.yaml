id: PHP.4.3
reference: Philippians 4:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: yo
  text: Bẹ́ẹ̀ ni, mo sì bẹ̀ ọ́, ìwọ alábàákẹ́gbẹ́ tòótọ́[a], ran àwọn obìnrin wọ̀nyí lọ́wọ́. Wọ́n ti bá mi tiraka papọ̀ nínú ìhìn rere[b], pẹ̀lú Kílẹ́mẹ́ǹtì àti àwọn alábàáṣiṣẹ́ mi yòókù, àwọn tí orúkọ wọn wà nínú ìwé ìyè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “alábàápín àjàgà tòótọ́”; àwọn kan sì gbà pé ó lè jẹ́ orúkọ ẹni, “Sísúgọsì.”
    reason: alternative_reading
  - marker: b
    text: Ó tún lè túmọ̀ sí “wọ́n bá mi jàkadì” tàbí “wọ́n ṣiṣẹ́ lẹ́gbẹ̀ẹ́ mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Bẹ́ẹ̀ ni
  rationale: Ó pa ìjẹ́rìí àti ìyípadà ọ̀rọ̀ Pọ́ọ̀lù mọ́ ní ọ̀nà tó ṣe déédé nínú Yorùbá.
- source_word: ἐρωτῶ
  choice: mo bẹ̀ ọ́
  rationale: Ó mú ìbéèrè ara ẹni tí Pọ́ọ̀lù ń ṣe jáde láì sọ ọ́ di àṣẹ líle.
- source_word: γνήσιε σύζυγε
  choice: alábàákẹ́gbẹ́ tòótọ́
  rationale: Ó ka σύζυγε sí orúkọ àpèjúwe fún ẹni tí ó jẹ́ alájọṣiṣẹ́ tímọ́tímọ́, ó sì jẹ́ èdè Yorùbá àdánidá ju ìtumọ̀ àwòrán àjàgà lọ.
- source_word: συλλαμβάνου αὐταῖς
  choice: ran àwọn obìnrin wọ̀nyí lọ́wọ́
  rationale: Ọ̀rọ̀ yìí fi ìrànlọ́wọ́ aláápọn hàn, αὐταῖς sì jẹ́ akọ́tọ̀ abo púpọ̀ tí ó tọ́ka sí àwọn obìnrin méjèèjì nínú àyíká ọ̀rọ̀.
- source_word: συνήθλησάν μοι
  choice: Wọ́n ti bá mi tiraka papọ̀
  rationale: ‘Tiraka papọ̀’ pa èrò ìsapá tàbí ìjàkadì tí ó wà nínú συναθλέω mọ́, láì mú àwòrán eré ìdárayá di ohun tí ó le fún òǹkàwé.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: nínú ìhìn rere
  rationale: Ó tẹ̀ lé ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì, ó sì fi ìtumọ̀ kúkúrú Pọ́ọ̀lù sílẹ̀ láì pinnu pé ‘fún ìhìn rere’ nìkan ni.
- source_word: συνεργῶν
  choice: alábàáṣiṣẹ́
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àwọn tí wọ́n ń ṣiṣẹ́ papọ̀ pẹ̀lú Pọ́ọ̀lù.
- source_word: βίβλῳ ζωῆς
  choice: ìwé ìyè
  rationale: Ó jẹ́ ìtumọ̀ tààrà àti gbólóhùn Bíbélì tí ó ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ γνήσιε σύζυγε
  choice: Ọ̀rọ̀ àpèjúwe fún alábàákẹ́gbẹ́ kan tí a kò dárúkọ
  alternative: Ó lè jẹ́ orúkọ ẹni, ‘Sísígọ́sì,’ tàbí ní tààrà ‘ẹgbẹ́ àjàgà tòótọ́.’
  rationale: Ìbámu γνήσιε pẹ̀lú ọ̀rọ̀ ìpè jẹ́ kí ìtumọ̀ àpèjúwe ṣeé ṣe gan-an; síbẹ̀, nítorí σύζυγος lè ní àwòrán àjàgà tàbí kí àwọn kan kà á sí orúkọ ẹni, a pa àwọn ọ̀nà yẹn mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ti òde òní, tí ó níyì ni a lò. A fi àmì ohùn sí ibi tí ó bá èdè àdánidá mu. A pín gbólóhùn gígùn Gíríìkì sí méjì fún ìmọ̀lára Yorùbá tó rọrùn, láì yí ìbáṣepọ̀ àwọn èrò inú rẹ̀ padà.
