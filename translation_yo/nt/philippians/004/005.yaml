  text: τὸ ἐπιεικὲς ὑμῶν γνωσθήτω πᾶσιν ἀνθρώποις. ὁ κύριος ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: yo
  text: Ẹ jẹ́ kí ìwà pẹ̀lẹ́ yín di mímọ̀ fún gbogbo ènìyàn.[a] Olúwa sún mọ́lé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìwà tútù,” “ìfaradà,” tàbí “ìwà tí ó bọ́gbọ́n mu.”
    reason: lexical_alternative
  - marker: b
    text: “Olúwa sún mọ́lé” lè túmọ̀ sí pé Olúwa wà nítòsí, pé ìpadàbọ̀ rẹ̀ sún mọ́lé, tàbí méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: ìwà tútù àti ìgbatẹnirò
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìwà pẹ̀lẹ́, ìfaradà, àti bí ènìyàn ṣe ń gba ti ẹlòmíràn rò; àkójọpọ̀ yìí mú ìtumọ̀ rẹ̀ jáde ní Yorùbá adayébá ju ọ̀rọ̀ tó kan ìwà tútù nìkan lọ.
- source_word: γνωσθήτω
  choice: Ẹ jẹ́ kí ... mọ
  rationale: 'Èyí sọ àṣẹ ẹni kẹta inú ọ̀rọ̀ Gíríìkì ní Yorùbá adayébá: kí ìwà wọn hàn gbangba débi tí gbogbo ènìyàn yóò fi mọ̀ ọ́.'
- source_word: πᾶσιν ἀνθρώποις
  choice: gbogbo ènìyàn
  rationale: Ó mú ìtumọ̀ tó kárí gbogbo ènìyàn jáde láì fi akọ tàbí abo sí i.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì pa ìwúwo oyè κύριος mọ́.
- source_word: ἐγγύς
  choice: sún mọ́lé
  rationale: Gbólóhùn yìí lè tọ́ka sí wíwà Olúwa nítòsí tàbí sí bí ìpadàbọ̀ rẹ̀ ṣe sún mọ́lé; Yorùbá yìí ṣì jẹ́ kí ìtumọ̀ méjèèjì ṣeé gbà.
theological_decisions:
- issue: Ìtumọ̀ ὁ κύριος ἐγγύς
  choice: Olúwa sún mọ́lé
  alternative: Olúwa wà nítòsí; tàbí, Olúwa ń bọ̀ láìpẹ́
  rationale: Ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ ibi—pé Olúwa wà nítòsí—tàbí ìtumọ̀ àkókò—pé ìpadàbọ̀ rẹ̀ sún mọ́lé—tàbí méjèèjì. Ọ̀rọ̀ inú ẹsẹ̀ náà kò pinnu ọ̀kan ṣoṣo.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní ọlá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo “ìwà tútù àti ìgbatẹnirò” láti fi àyè ìtumọ̀ ἐπιεικές hàn, a sì pa àìdánilójú tó wà nínú ἐγγύς mọ́.
