id: PHP.4.17
reference: Philippians 4:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: yo
  text: Kì í ṣe pé mo ń wá ẹ̀bùn náà, ṣùgbọ́n mo ń wá èso tí ń pọ̀ sí i sínú àkọọ́lẹ̀ yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “èso tí ó ń pọ̀ sí i sí ìgbọ́kànlé yín nínú àkọọ́lẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: mo ń wá
  rationale: Ó fi ìwá kiri tàbí ìfẹ́ líle hàn, ó sì pa àtúnwí àti ìyàtọ̀ inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τὸ δόμα
  choice: ẹ̀bùn náà
  rationale: “Ẹ̀bùn” jẹ́ ọ̀rọ̀ tààrà fún ohun tí àwọn ará Fílípì fi ránṣẹ́; “náà” ń tọ́ka sí ẹ̀bùn tí a ti mẹ́nu kàn láì fi ìtumọ̀ míì kún un.
- source_word: τὸν καρπὸν
  choice: èso
  rationale: Ó pa àkàwé èso mọ́, dípò yíyí i padà sí “èrè” tàbí “àbájáde,” kí ìfarakanra rẹ̀ pẹ̀lú èdè ìṣirò owó lè dúró.
- source_word: τὸν πλεονάζοντα
  choice: tí ń pọ̀ sí i
  rationale: Àpólà aláìparí náà ń tọ́ka sí ohun tí ó ń pọ̀ tàbí ń di púpọ̀; ìtumọ̀ yìí jẹ́ ti àdánidá ní Yorùbá.
- source_word: εἰς λόγον ὑμῶν
  choice: sínú àkọọ́lẹ̀ yín
  rationale: Ní àyíká ọ̀rọ̀ náà, λόγος ní àwọ̀ èdè ìṣirò tàbí àkọọ́lẹ̀; yíyan “àkọọ́lẹ̀” pa àkàwé ìṣòwò mọ́, láì sọ ohun tí èso náà jẹ́ ní kíkún.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: Kì í ṣe pé ... ṣùgbọ́n
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún àlàyé tí ń kọ ohun kan sílẹ̀, tí ó sì ń fi ohun kejì ṣe ìyàtọ̀ sí i.
theological_decisions:
- issue: Ìtumọ̀ èso tí ń pọ̀ sí àkọọ́lẹ̀ àwọn ará Fílípì
  choice: Pa “èso” àti “àkọọ́lẹ̀” mọ́ gẹ́gẹ́ bí àkàwé méjèèjì
  alternative: Túmọ̀ ọ́ ní kíkún sí “èrè ẹ̀mí tí Ọlọ́run yóò san fún yín”
  rationale: Gíríìkì kò ṣàlàyé ní pàtó bí èso náà ṣe rí tàbí ẹni tí yóò san án; ìtumọ̀ yìí kò fi ẹ̀kọ́ ìsìn kan tí kò sí nínú ẹsẹ náà kún un.
translation_notes:
  register: Yorùbá àgbà lítíréṣọ̀ tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
