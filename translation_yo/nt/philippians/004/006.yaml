id: PHP.4.6
reference: Philippians 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: yo
  text: Ẹ má ṣe ṣàníyàn nípa ohunkóhun[a], ṣùgbọ́n nínú ohun gbogbo, nípasẹ̀ àdúrà àti ẹ̀bẹ̀ pẹ̀lú ìdúpẹ́, ẹ jẹ́ kí Ọlọ́run mọ̀ àwọn ohun tí ẹ ń béèrè.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ má ṣe dààmú nípa ohunkóhun.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “níwájú Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: Ẹ má ṣe máa ṣàníyàn nípa ohunkóhun
  rationale: Ìtumọ̀ yìí fi ìfòfindè àti èrò àníyàn tí ó ń bá ọkàn lọ hàn ní Yorùbá àdánidá; ó sì yẹra fún gbólóhùn tí kò rọrùn bí ‘ẹ má ṣàníyàn ohunkóhun.’
- source_word: ἐν παντὶ
  choice: nínú ohun gbogbo
  rationale: Ó pa ìtẹnumọ́ gbòòrò náà mọ́, pé ní gbogbo ọ̀ràn tàbí ipò ni àṣẹ náà kan.
- source_word: τῇ προσευχῇ καὶ τῇ δεήσει
  choice: nípa àdúrà àti ẹ̀bẹ̀
  rationale: ‘Àdúrà’ jẹ́ ọ̀rọ̀ gbòòrò fún ìbánisọ̀rọ̀ pẹ̀lú Ọlọ́run, nígbà tí ‘ẹ̀bẹ̀’ ń tọ́ka sí ìrawọ́ ẹ̀bẹ̀ pàtó; ìyàtọ̀ inú Gíríìkì wà ní pípa mọ́.
- source_word: μετ’ εὐχαριστίας
  choice: pẹ̀lú ìdúpẹ́
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ orúkọ εὐχαριστία mọ́.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: àwọn ohun tí ẹ ń béèrè
  rationale: Ìtumọ̀ yìí jẹ́ ti ẹnu ojoojúmọ́, ó sì yẹra fún àtúnsọ ‘ẹ̀bẹ̀’ lẹ́sẹ̀kẹsẹ̀, nígbà tó ń pa ìtumọ̀ àwọn ìbéèrè pàtó mọ́.
- source_word: γνωριζέσθω
  choice: ẹ jẹ́ kí ... di mímọ̀
  rationale: Ó ṣe àfihàn àṣẹ aláìṣe-taara àti ìrísí àrọ́pò-ìṣe ti ọ̀rọ̀ Gíríìkì ní Yorùbá tó ṣeé lóye.
- source_word: πρὸς τὸν θεόν
  choice: fún Ọlọ́run
  rationale: ‘Fún Ọlọ́run’ bá gbólóhùn ‘di mímọ̀’ mu ní Yorùbá, ó sì fi ìdarí àwọn ìbéèrè sí Ọlọ́run hàn láìfi àlàyé ẹ̀kọ́ mìíràn kún un.
theological_decisions:
- issue: Bóyá πρὸς τὸν θεόν túmọ̀ sí ‘fún Ọlọ́run’ tàbí ‘níwájú Ọlọ́run’
  choice: fún Ọlọ́run
  alternative: níwájú Ọlọ́run
  rationale: ‘Fún Ọlọ́run’ ni ìbámu tààrà jù lọ pẹ̀lú ìdarí ọ̀rọ̀ sí Ọlọ́run; àmọ́ ‘níwájú Ọlọ́run’ tún ṣeé ṣe, nítorí náà a pa á mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó bójú mu fún kíkà ní gbangba àti fún òǹkàwé òde òní. A lo ‘ẹ’ gẹ́gẹ́ bí ọ̀pọ̀ ènìyàn, ní ìbámu pẹ̀lú ὑμῶν; a fi àmì ohùn sí ibi tí ó jẹ́ àdánidá.
