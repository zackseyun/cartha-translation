id: PHP.4.9
reference: Philippians 4:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: yo
  text: Àwọn ohun tí ẹ̀yin ti kọ́, tí ẹ sì ti gbà, tí ẹ sì ti gbọ́, tí ẹ sì ti rí nínú mi[a]—ẹ máa ṣe àwọn nǹkan wọ̀nyí[b]; Ọlọ́run àlàáfíà yóò sì wà pẹ̀lú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè sọ pé, “tí ẹ rí nínú àpẹẹrẹ mi” tàbí “tí ẹ rí nínú ìgbésí ayé mi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ ṣe àwọn nǹkan wọ̀nyí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: Àwọn ohun tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ tí ó ń ṣáájú àwọn ohun tí Pọ́ọ̀lù rọ wọn láti ṣe; “Àwọn ohun tí” fi ìtumọ̀ ọ̀pọ̀ hàn ní Yorùbá àdánidá.
- source_word: ἐμάθετε
  choice: ẹ̀yin ti kọ́
  rationale: Ó tọ́ka sí ohun tí àwọn ará Fílípì ti kọ́ láti ọ̀dọ̀ Pọ́ọ̀lù; “kọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún gbígba ẹ̀kọ́.
- source_word: παρελάβετε
  choice: ẹ sì ti gbà
  rationale: Ó lè túmọ̀ sí gbígba ìkọ́ni tàbí ohun tí a fi léni lọ́wọ́. “Gbà” pa ìtumọ̀ gbígbòòrò yẹn mọ́ láìfi “àṣà tí a jogún” kún un.
- source_word: ἠκούσατε
  choice: ẹ sì ti gbọ́
  rationale: Ó pa ìfararora àwọn ọ̀rọ̀-ìṣe inú gbólóhùn náà mọ́, ó sì túmọ̀ sí ohun tí wọn fi etí gbọ́.
- source_word: εἴδετε ἐν ἐμοί
  choice: ẹ sì ti rí nínú mi
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì fi ohun tí wọn rí nínú ìgbésí ayé Pọ́ọ̀lù sílẹ̀ láìtúmọ̀ rẹ̀ ju bí ó ti wà lọ.
- source_word: ταῦτα πράσσετε
  choice: ẹ máa ṣe àwọn nǹkan wọ̀nyí
  rationale: “Ẹ máa ṣe” fi ìṣe tí ó ń bá a lọ tàbí tí a ń ṣe déédéé hàn, dípò ìṣe ẹ̀ẹ̀kan ṣoṣo.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Ọlọ́run àlàáfíà
  rationale: Ó pa àkójọpọ̀ ọ̀rọ̀ tí Pọ́ọ̀lù sábà máa ń lò mọ́, láìṣàlàyé rẹ̀ sí “Ọlọ́run tí ń fúnni ní àlàáfíà.”
- source_word: ἔσται μεθ’ ὑμῶν
  choice: yóò sì wà pẹ̀lú yín
  rationale: Ó jẹ́ ìtumọ̀ tààrà fún ìlérí nípa wíwà Ọlọ́run pẹ̀lú wọn; “yín” tọ́ka sí ọ̀pọ̀ ènìyàn.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ṣíṣe ohun tí a kọ́ àti wíwà Ọlọ́run pẹ̀lú wọn
  choice: A fi ìṣírí náà àti ìlérí náà sí ẹ̀gbẹ́ ara wọn pẹ̀lú “sì,” gẹ́gẹ́ bí καί inú Gíríìkì.
  alternative: Kí a sọ ọ́ di gbólóhùn oníṣ شرط kedere pé bí wọn bá ṣe àwọn nǹkan wọ̀nyí nìkan ni Ọlọ́run yóò fi wà pẹ̀lú wọn.
  rationale: Gíríìkì kò lo ìṣ شرط kedere; nítorí náà, ìtumọ̀ náà pa agbára ìṣírí àti ìlérí mọ́ láìsọ ìbáṣepọ̀ náà di òfin ohun-okùnfà tí ọ̀rọ̀ náà kò sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí òǹkàwé òde òní lè lóye ni a lò. A lo “ẹ̀yin/ẹ/yín” láti fi ọ̀pọ̀ ènìyàn hàn, “ẹ máa ṣe” sì fi ìṣe àtúnṣe tí ń bá a lọ hàn. Àmì ohùn ni a fi sí ibi tí ó bá yẹ ní ti àdánidá.
