lexical_decisions:
- source_word: πλὴν
  choice: Síbẹ̀
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́ hàn sí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ, láìsọ ìyìn rere tó tẹ̀ lé e di àtakò líle.
- source_word: καλῶς ἐποιήσατε
  choice: ẹ ṣe dáadáa
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ìṣe wọn dára, ó sì bá aorist ἐποιήσατε mu.
- source_word: συγκοινωνήσαντές
  choice: nípa jíjẹ́ alábàápín pẹ̀lú mi
  rationale: Ó pa èrò ìkópa àti ìdàpọ̀ mọ́ Pọ́ọ̀lù mọ́ nínú ìṣòro rẹ̀ mọ́, kì í ṣe pé wọ́n kàn fi ohun kan ránṣẹ́ sí i.
- source_word: τῇ θλίψει
  choice: nínú ìpọ́njú mi
  rationale: “Ìpọ́njú” fi ìnira àti ìtẹ̀sí tí θλῖψις ní hàn láìgbé e ga ju bí ọ̀rọ̀ Gíríìkì ṣe sọ; “mi” ń mú ìbáṣepọ̀ μου sí ìpọ́njú náà ṣe kedere ní Yorùbá.
theological_decisions: []
