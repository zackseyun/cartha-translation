  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ Olúwa Jésù Mèsáyà wà pẹ̀lú ẹ̀mí yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní, “Kí oore-ọ̀fẹ́ Olúwa Jésù Mèsáyà wà pẹ̀lú gbogbo yín.”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ọ̀nà àdánidá tí ó sì ní ìwọ̀n láti sọ χάρις nínú àdúrà ìbùkún Paulu; ó pa ìtumọ̀ ojú rere àti ẹ̀bùn inú rere Ọlọ́run mọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: Ó bá κύριος gẹ́gẹ́ bí oyè fún Jesu mu, ó sì jẹ́ ọ̀rọ̀ tí àwọn olùkà Yorùbá mọ̀ dáadáa.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: ‘Jesu’ ni ìrísí orúkọ tí ó wọ́pọ̀ ní Yorùbá; ‘Mèsáyà’ mú agbára Χριστός gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fi àmì òróró yàn hàn, dípò kí a ka á sí apá orúkọ lásán.
- source_word: μετὰ
  choice: wà pẹ̀lú
  rationale: Nínú ìbùkún yìí, gbólóhùn náà sọ pé kí oore-ọ̀fẹ́ máa bá wọn wà; ‘wà pẹ̀lú’ jẹ́ Yorùbá àdánidá fún ìtumọ̀ ìbákẹ́gbẹ́.
- source_word: πνεύματος
  choice: ẹ̀mí
  rationale: Níbí, ó ṣeé ṣe jù pé ọ̀rọ̀ náà ń tọ́ka sí ẹ̀mí tàbí ìwà inú àwọn olùgbà lẹ́tà, kì í ṣe Ẹ̀mí Mímọ́ ní tààrà.
- source_word: ὑμῶν
  choice: yín
  rationale: ‘Yín’ fi ẹni kejì púpọ̀ hàn ní Yorùbá, ó sì bá àwọn ará Fílípì tí Paulu ń bá sọ̀rọ̀ mu.
theological_decisions:
- issue: Bóyá kí Χριστοῦ jẹ́ ‘Kristi’ tàbí ‘Mèsáyà’
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ṣì ní agbára oyè níbí. ‘Mèsáyà’ mú oyè ẹni tí Ọlọ́run yàn hàn kedere, bí ó tilẹ̀ jẹ́ pé ‘Kristi’ ni àṣà ìtumọ̀ Yorùbá tí ó wọ́pọ̀.
- issue: Ẹni tàbí ohun tí πνεύματος ń tọ́ka sí
  choice: ẹ̀mí àwọn onígbàgbọ́, ní ìtumọ̀ àpapọ̀
  alternative: Ẹ̀mí Mímọ́
  rationale: Asopọ̀ ‘ẹ̀mí yín’ àti ọ̀rọ̀ arọ́pò-orúkọ ẹni kejì púpọ̀ tọ́ka sí ìwà inú àwọn olùgbà lẹ́tà. A kò fi lẹ́tà ńlá tàbí àlàyé míì mú un di Ẹ̀mí Mímọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tí ó bá yẹ. Ìṣètò ‘Kí ... wà pẹ̀lú ...’ jẹ́ ọ̀nà àdánidá, ọ̀wọ̀, tí ó sì yẹ fún àdúrà ìbùkún. A lo ‘yín’ láti jẹ́ kí ọ̀pọ̀ ènìyàn tí ὑμῶν ń tọ́ka sí hàn kedere.
