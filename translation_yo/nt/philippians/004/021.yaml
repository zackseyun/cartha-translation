id: PHP.4.21
reference: Philippians 4:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: yo
  text: Ẹ kí ẹni mímọ́ kọ̀ọ̀kan nínú Mèsáyà Jesu. Àwọn arákùnrin tí wọ́n wà pẹ̀lú mi kí yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwọn arákùnrin” lè, ní àyíká yìí, tọ́ka sí ẹgbẹ́ àwọn onígbàgbọ́ tí ó wà pẹ̀lú Paulu, títí kan àwọn ọkùnrin àti obìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Ẹ kí
  rationale: Ọ̀rọ̀ àṣẹ yìí ń sọ pé kí wọ́n fi ìkíni ránṣẹ́; “Ẹ kí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá ọ̀rọ̀ ìparí lẹ́tà mu.
- source_word: πάντα ἅγιον
  choice: olúkúlùkù ẹni mímọ́
  rationale: πάντα pẹ̀lú ọ̀rọ̀-orúkọ ẹyọ kan ní agbára pínpín, ìyẹn ni ‘olúkúlùkù’; “ẹni mímọ́” fi ìdánimọ̀ àwọn onígbàgbọ́ gẹ́gẹ́ bí àwọn tí a yà sọ́tọ̀ hàn láìlo ọ̀rọ̀ ìjọ kan tó lè ṣòro fún òǹkàwé.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jesu
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni tí a fòróró yàn, ìyẹn Mèsáyà; “nínú” pa ìṣọ̀kan tàbí ìbáṣepọ̀ tí ἐν lè fihàn mọ́.
- source_word: ἀσπάζονται
  choice: kí
  rationale: Ní ìparí lẹ́tà, ọ̀rọ̀ náà ń túmọ̀ sí fífi ìkíni ránṣẹ́; Yorùbá lè sọ èyí ní ṣókí àti lọ́nà àdánidá pẹ̀lú “kí.”
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: Àwọn arákùnrin tí ó wà pẹ̀lú mi
  rationale: Ìtumọ̀ yìí pa fọ́ọ̀mù akọ púpọ̀ ἀδελφοί mọ́, ó sì sọ σὺν ἐμοὶ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbi yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn; “Mèsáyà” mú ìtumọ̀ oyè náà jáde kedere, nígbà tí “Kristi” jẹ́ àkọsílẹ̀ ìbílẹ̀ tí ó wọ́pọ̀.
- issue: Àyè tí ἐν Χριστῷ Ἰησοῦ tọ́ka sí
  choice: nínú Mèsáyà Jesu
  alternative: tí ó jẹ́ ti Mèsáyà Jesu
  rationale: A pa àwòrán àti àìṣedéédéé ἐν mọ́ dípò yíyan ìtumọ̀ rẹ̀ sí ìní tàbí ìbáṣepọ̀ nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà níyì, ó rọrùn fún òǹkàwé òde òní, ó sì pa ọ̀nà ìkíni lẹ́tà Gíríìkì mọ́.
