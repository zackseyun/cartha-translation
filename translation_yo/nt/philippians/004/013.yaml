  yaml_path: translation/nt/philippians/004/013.yaml
  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: yo
  text: Mo lè ṣe ohun gbogbo nípasẹ̀ ẹni tí ń fún mi lókun[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo lè ṣe gbogbo nǹkan”; nínú àyíká ọ̀rọ̀, ìtumọ̀ náà ni pé mo lè farada gbogbo onírúurú ipò.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì sọ pé “ẹni tí ń fún mi lókun,” kò sì darúkọ Kristi ní tààràtà nínú ẹsẹ yìí, bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ ń tọ́ka sí i.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘ohun gbogbo’ ní ìtẹ̀sí gbooro; àyíká ọ̀rọ̀ ń tọ́ka sí agbára láti fara da gbogbo onírúurú ipò, ṣùgbọ́n a pa ìtẹ̀sí gbooro Gíríìkì mọ́.
- source_word: ἰσχύω
  choice: Mo lè ṣe
  rationale: Ọ̀rọ̀-ìṣe náà ń sọ nípa níní agbára tàbí líle ṣe ohun kan. ‘Mo lè ṣe’ jẹ́ Yorùbá àdánidá tí kò sọ pé Pọ́ọ̀lù ní agbára láìní ààlà.
- source_word: ἐν
  choice: nípasẹ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ rẹ̀ ní tààràtà lè jẹ́ ‘nínú,’ níbí ó ń tọ́ka sí ọ̀nà tàbí ẹni tí agbára ti ọ̀dọ̀ rẹ̀ wá; ‘nípasẹ̀’ sọ èyí ní kedere.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: ẹni tí ń fún mi lókun
  rationale: Gbólóhùn alábápín náà túmọ̀ sí ẹni tí ń fún olùsọ̀rọ̀ ní agbára lọ́wọ́lọ́wọ́. A kò fi ‘Kristi’ kún un nítorí ẹsẹ yìí kò darúkọ rẹ̀ ní Gíríìkì.
theological_decisions:
- issue: Ẹni tí ‘ẹni tí ń fún mi lókun’ ń tọ́ka sí
  choice: A pa ọ̀rọ̀ náà mọ́ gẹ́gẹ́ bí ‘ẹni tí ń fún mi lókun,’ láìfi ‘Kristi’ sí inú ẹsẹ náà.
  alternative: nípasẹ̀ Kristi tí ń fún mi lókun
  rationale: Àyíká ọ̀rọ̀ fi hàn pé ó ṣeé ṣe kí Kristi Jésù ni ẹni náà, ṣùgbọ́n Gíríìkì ẹsẹ yìí fúnra rẹ̀ kò darúkọ rẹ̀; ìtumọ̀ náà pa ohun tí ẹsẹ náà sọ ní tààràtà mọ́.
translation_notes:
  register: Yorùbá ìṣàkóso tí ó ní àmì ohùn kíkún, tí ó bójú mu, tí ó sì rọrùn fún òǹkàwé òde òní. ‘Fún mi lókun’ jẹ́ ọ̀nà àdánidá láti sọ fífúnni ní agbára; a pa fífẹ̀ πάντα mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé dá àyíká gbogbo onírúurú ipò sí.
