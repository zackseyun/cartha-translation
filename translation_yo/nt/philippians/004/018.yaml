id: PHP.4.18
reference: Philippians 4:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: yo
  text: Ṣùgbọ́n mo ti gba ohun gbogbo[a], mo sì ní lọ́pọ̀ yanturu. Mo ti ní ohun gbogbo tí mo nílò ní ẹ̀kúnrẹ́rẹ́, níwọ̀n bí mo ti gba lọ́wọ́ Ẹpafíródítù àwọn ohun tí ó ti ọ̀dọ̀ yín wá—gẹ́gẹ́ bí òórùn dídùn, ẹbọ ìtẹ́wọ́gbà, tí ó wu Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo ní ohun gbogbo ní ẹ̀kúnrẹ́rẹ́”; ó tún lè túmọ̀ sí, “mo ti gba ẹ̀kúnrẹ́rẹ́ ìsanwó.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχω
  choice: mo ti gba
  rationale: Ó sọ ní ṣókí pé ohun tí wọ́n fi ránṣẹ́ ti dé ọwọ́ Pọ́ọ̀lù, láìfi dandan mú ìtumọ̀ ọ̀rọ̀ ajé náà wọ inú ẹsẹ̀ pàtàkì; àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ mìíràn mọ́.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìtẹnumọ́ gbooro ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá láti tọ́ka sí gbogbo ohun tí àwọn ará Fílípì ránṣẹ́.
- source_word: περισσεύω
  choice: mo sì ní lọ́pọ̀ yanturu
  rationale: Gbólóhùn yìí fi hàn pé ohun tí ó ní kọjá ìwọ̀n ohun tí ó tó fún un, ó sì bá èdè Yorùbá òde òní mu.
- source_word: πεπλήρωμαι
  choice: Mo ti ní ohun gbogbo tí mo nílò ní ẹ̀kúnrẹ́rẹ́
  rationale: Ó mú ipò ìkúnwọ́sí tí ìṣe pípé náà ń tọ́ka sí jáde, ní pàtàkì nínú àyíká ìrànlọ́wọ́ ohun ìní.
- source_word: δεξάμενος
  choice: lẹ́yìn tí mo gba
  rationale: Ó fi hàn pé gbígba ẹ̀bùn náà ni ó yọrí sí ipò ìkúnwọ́sí Pọ́ọ̀lù.
- source_word: παρὰ Ἐπαφροδίτου
  choice: lọ́wọ́ Ẹpafíródítù
  rationale: ‘Lọ́wọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún ẹni tí ó kó ohun náà dé ọwọ́ Pọ́ọ̀lù.
- source_word: τὰ παρ’ ὑμῶν
  choice: àwọn ohun tí ó ti ọ̀dọ̀ yín wá
  rationale: Ó fi àwọn ará Fílípì hàn gẹ́gẹ́ bí orísun ẹ̀bùn náà, láìdín àwọn ohun tí wọ́n ránṣẹ́ kù sí owó nìkan.
- source_word: ὀσμὴν εὐωδίας
  choice: òórùn dídùn
  rationale: Ó jẹ́ àwòrán ẹbọ tí ó mọ́gbọ́n dání ní Yorùbá, ó sì pa ìró èdè ìjọsìn inú Májẹ̀mú Láéláé mọ́.
- source_word: θυσίαν δεκτήν
  choice: ẹbọ ìtẹ́wọ́gbà
  rationale: Ó pa àwòrán pé ẹ̀bùn wọn jẹ́ ẹbọ tí Ọlọ́run tẹ́wọ́ gbà mọ́ ní ṣókí.
- source_word: εὐάρεστον τῷ θεῷ
  choice: tí ó wu Ọlọ́run
  rationale: Ó sọ ìtẹ́lọ́rùn Ọlọ́run ní kedere àti ní èdè Yorùbá àdánidá.
theological_decisions:
- issue: Àwòrán ẹbọ fún ìrànlọ́wọ́ ohun ìní àwọn ará Fílípì
  choice: 'Pa gbogbo àwòrán ìjọsìn náà mọ́: ‘òórùn dídùn, ẹbọ ìtẹ́wọ́gbà, tí ó wu Ọlọ́run.’'
  alternative: Ṣàlàyé rẹ̀ lásán gẹ́gẹ́ bí ọ̀rọ̀ ọpẹ́ tàbí ‘ọrẹ tí Ọlọ́run fi ayọ̀ gbà.’
  rationale: Pọ́ọ̀lù mọ̀ọ́mọ̀ lo èdè ẹbọ tẹ́ńpìlì fún ẹ̀bùn náà. Pípa òórùn, ẹbọ, àti ohun tí ó wu Ọlọ́run mọ́ ń dá agbára ẹ̀kọ́ ìgbàgbọ́ inú àwòrán náà sí, láìfi ẹ̀kọ́ ẹ̀sìn àfikún kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ẹbọ ìtẹ́wọ́gbà’ àti ‘òórùn dídùn’ pa ìró èdè ìjọsìn mọ́, nígbà tí ‘mo sì ní lọ́pọ̀ yanturu’ àti ‘ní ẹ̀kúnrẹ́rẹ́’ jẹ́ kó ṣeé lóye fún òǹkàwé lasán.
