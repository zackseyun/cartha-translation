  to: Ṣùgbọ́n mo ti gba ohun gbogbo[a], mo sì ní lọ́pọ̀ yanturu. Mo ti ní ohun gbogbo tí mo nílò ní ẹ̀kúnrẹ́rẹ́, níwọ̀n bí mo ti gba lọ́wọ́ Ẹpafíródítù àwọn ohun tí ó ti ọ̀dọ̀ yín wá—gẹ́gẹ́ bí òórùn dídùn, ẹbọ ìtẹ́wọ́gbà, tí ó wu Ọlọ́run.
