  source_fidelity: Ìtumọ̀ náà fi ìtàn atilẹ́yìn Pọ́ọ̀lù, ipa Ẹpafíródítù gẹ́gẹ́ bí ẹni tí ó gbé ẹ̀bùn wá, àti àwòrán ẹbọ náà hàn dáadáa. Síbẹ̀, “lẹ́yìn tí mo gba” ń fi ìtẹ̀lé ìgbà hàn ní kíkankíkan ju participle δεξάμενος lọ; “níwọ̀n bí mo ti gba” ń fi ìdí ipò ìkúnrẹ́rẹ́ náà hàn láìfi ìtẹ̀lé àkókò kún un.
