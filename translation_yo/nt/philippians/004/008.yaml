  naturalness: The register is clear and suitable for public reading. One expression, “ohunkóhun tí ó yẹ fún ìfẹ́,” is understandable but somewhat calqued and less idiomatic than “ohunkóhun tí ó yẹ kí a fẹ́.” The latter naturally conveys προσφιλῆ, what is worthy of or calls forth love.
  terminology: 'Key ethical terms are well rendered: òtítọ́, iyì, tọ́, mọ́, ìwà rere, and ìyìn. The footnote is revised slightly so that its statement about the Greek form is idiomatic and accurately plural.'
