id: PHP.4.8
reference: Philippians 4:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: yo
  text: Ní ìparí, ẹ̀yin ará[a], ohunkóhun tí ó jẹ́ òtítọ́, ohunkóhun tí ó ní iyì, ohunkóhun tí ó tọ́, ohunkóhun tí ó mọ́, ohunkóhun tí ó yẹ kí a fẹ́, ohunkóhun tí ó ní orúkọ rere—bí ìwà rere èyíkéyìí bá wà, bí ìyìn èyíkéyìí bá sì wà—ẹ máa ronú lórí àwọn nǹkan wọ̀nyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, ọ̀rọ̀ Gíríìkì náà jẹ́ “àwọn arákùnrin,” ṣùgbọ́n a lè lò ó láti pe gbogbo àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin.
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Ní ìparí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti fi àmì ìyípadà sí ọ̀rọ̀ ìparí hàn, bó tilẹ̀ jẹ́ pé èdè Gíríìkì tún lè túmọ̀ sí ‘ní ti ohun tó kù.’
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: ‘Ará’ pa àwòrán ìdílé mọ́, ó sì jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá fún gbogbo àwọn ọmọ ìjọ láìka akọ tàbí abo.
- source_word: ὅσα
  choice: ohunkóhun tí ó
  rationale: Àtúnwí yìí pa ìtòlẹ́sẹẹsẹ àti agbára àkójọ Gíríìkì mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: ἀληθῆ
  choice: jẹ́ òtítọ́
  rationale: Ó mú ìtumọ̀ ohun tí ó jẹ́ òótọ́ tàbí tí kò ní èké jáde ní ṣókí.
- source_word: σεμνά
  choice: ní iyì
  rationale: Ó sọ ohun tí ó ní ọlá, ìwọ̀ntúnwọ̀nsì, tí ó sì yẹ fún ọ̀wọ̀, láìfi ìtumọ̀ ẹ̀sìn kan kún un.
- source_word: δίκαια
  choice: tọ́
  rationale: Nínú àkójọ ìwà yìí, ‘tọ́’ bo ohun tí ó dúró ṣinṣin nípa ìdájọ́ àti ìwà rere.
- source_word: ἁγνά
  choice: mọ́
  rationale: ‘Mọ́’ lè tọ́ka sí ìwà mímọ́ àti ọkàn tí kò ní àbàwọ́n, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì.
- source_word: προσφιλῆ
  choice: yẹ fún ìfẹ́
  rationale: Ó mú ìtumọ̀ ohun tí ó fa ìfẹ́ tàbí inú dídùn jáde ju ọ̀rọ̀ tí yóò kan ẹwà ojú lọ.
- source_word: εὔφημα
  choice: ní orúkọ rere
  rationale: Ó pa èrò ohun tí a ń sọ̀rọ̀ rere nípa rẹ̀ tàbí tí a gbà sí ohun rere mọ́.
- source_word: εἴ τις ἀρετὴ
  choice: bí ìwà rere èyíkéyìí bá wà
  rationale: Ó pa ìṣètò oníṣ条件 ‘bí ... bá wà’ àti ìtumọ̀ ìtayọ̀ tàbí ìwà rere mọ́.
- source_word: εἴ τις ἔπαινος
  choice: bí ìyìn èyíkéyìí bá sì wà
  rationale: Ó pa ìfararora pẹ̀lú gbólóhùn tó ṣáájú àti ìtumọ̀ ‘ìyìn’ mọ́.
- source_word: ταῦτα λογίζεσθε
  choice: ẹ máa ronú lórí àwọn nǹkan wọ̀nyí
  rationale: 'Àṣẹ yìí fi ìṣe tí ń bá a lọ hàn: kí wọ́n máa fi ọkàn sí àwọn nǹkan náà, kí wọ́n sì máa gbé wọn yẹ̀ wò.'
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Àtúnwí ‘ohunkóhun’ pa ìlù àti ìtẹnumọ́ àkójọ orísun mọ́; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba.
