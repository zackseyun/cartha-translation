    rationale: “Yẹ fún ìfẹ́” can sound like a literal nominal construction. “Yẹ kí a fẹ́” is more natural Standard Yoruba while retaining the sense of what is lovable or worthy of affection.
  - severity: low
    issue: The footnote’s wording about the Greek term is awkward and uses a singular Yoruba gloss for a plural Greek address.
    rationale: Recasting it as “àwọn arákùnrin” gives a more idiomatic and precise explanation without changing the cultural-note function.
