revisions:
- from: Nítorí náà, ẹ̀yin ará mi[a] olùfẹ́, tí mo sì ń fẹ́ gidigidi láti rí, ẹ̀yin ayọ̀ àti adé mi[b], ẹ dúró ṣinṣin nínú Olúwa ní ọ̀nà yìí, ẹ̀yin olùfẹ́.
  to: Nítorí náà, ẹ̀yin ará mi[a] ọ̀wọ́n, àwọn tí ọkàn mi ń yán sí, ẹ̀yin ayọ̀ àti adé mi[b], ẹ dúró ṣinṣin nínú Olúwa ní ọ̀nà yìí, ẹ̀yin ọ̀wọ́n.
  rationale: The revision removes the unsupported specification “to see” from the rendering of ἐπιπόθητοι and replaces the potentially ambiguous olùfẹ́ with the natural affectionate vocative ọ̀wọ́n. It preserves the Greek repetition, the plural address, the inferential force, and the ambiguity of “nínú Olúwa.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the inferential transition, repeated affectionate address, plural imperative, and the relationally open rendering of ἐν κυρίῳ. However, “tí mo sì ń fẹ́ gidigidi láti rí” narrows ἐπιπόθητοι (“longed for / dearly missed”) to a desire specifically to see them, an element not expressed in the Greek.
  naturalness: The revised wording uses idiomatic, dignified Standard Yoruba. “Àwọn tí ọkàn mi ń yán sí” naturally conveys Paul’s deep longing without adding a particular occasion of seeing. “Ọ̀wọ́n” is a clear and natural vocative expression of affection and avoids the possible agentive sense of olùfẹ́ (“lover”).
  terminology: “Olúwa,” “dúró ṣinṣin,” “ayọ̀,” and “adé” are appropriate. The victor’s-wreath nuance of στέφανος remains appropriately supplied by the lexical footnote. The congregational scope note is retained, while accurately describing the Greek masculine plural form.
  issues:
  - severity: medium
    issue: The rendering of ἐπιπόθητοι adds “láti rí” (“to see”).
    rationale: The Greek adjective expresses that the Philippians are people for whom Paul longs; it does not specify that his longing is to see them. The addition unnecessarily restricts the source expression.
  - severity: low
    issue: “Olùfẹ́” can be heard as an agentive noun, “lover,” in contemporary Yoruba.
    rationale: Although it may be understood contextually as “beloved,” “ọ̀wọ́n” is a more natural unambiguous Yoruba term of affectionate address and preserves the repeated vocative emphasis.
  revised_text: Nítorí náà, ẹ̀yin ará mi[a] ọ̀wọ́n, àwọn tí ọkàn mi ń yán sí, ẹ̀yin ayọ̀ àti adé mi[b], ẹ dúró ṣinṣin nínú Olúwa ní ọ̀nà yìí, ẹ̀yin ọ̀wọ́n.
  revised_footnotes:
  - marker: a
    text: “Ará” túmọ̀ ìrísí akọ ọ̀rọ̀ Gíríìkì; ní àyíká ọ̀rọ̀ yìí, àwọn onígbàgbọ́ ẹlẹgbẹ́ inú ìjọ ni Pọ́ọ̀lù ń bá sọ̀rọ̀, kì í ṣe àwọn ọkùnrin nìkan.
    reason: cultural_note
  - marker: b
    text: Tàbí “adé ìṣẹ́gun”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí òdòdó tí a hun yí ká tí a máa ń fi fún ẹni tó borí.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported specification “to see” from the rendering of ἐπιπόθητοι and replaces the potentially ambiguous olùfẹ́ with the natural affectionate vocative ọ̀wọ́n. It preserves the Greek repetition, the plural address, the inferential force, and the ambiguity of “nínú Olúwa.”
