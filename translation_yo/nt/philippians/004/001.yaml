id: PHP.4.1
reference: Philippians 4:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin ará mi[a] ọ̀wọ́n, àwọn tí ọkàn mi ń yán sí, ẹ̀yin ayọ̀ àti adé mi[b], ẹ dúró ṣinṣin nínú Olúwa ní ọ̀nà yìí, ẹ̀yin ọ̀wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ará” túmọ̀ ìrísí akọ ọ̀rọ̀ Gíríìkì; ní àyíká ọ̀rọ̀ yìí, àwọn onígbàgbọ́ ẹlẹgbẹ́ inú ìjọ ni Pọ́ọ̀lù ń bá sọ̀rọ̀, kì í ṣe àwọn ọkùnrin nìkan.
    reason: cultural_note
  - marker: b
    text: Tàbí “adé ìṣẹ́gun”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí òdòdó tí a hun yí ká tí a máa ń fi fún ẹni tó borí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde tàbí ìparí ọ̀rọ̀ ìṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti so èrò náà pọ̀ ní Yorùbá.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará mi
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún àwọn onígbàgbọ́ ẹlẹgbẹ́, nígbà tí àmì ìsàlẹ̀ ṣàlàyé pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìrísí ṣùgbọ́n pé gbogbo ìjọ ni Pọ́ọ̀lù ń bá sọ̀rọ̀.
- source_word: ἀγαπητοὶ
  choice: olùfẹ́
  rationale: Ó pa ìfẹ́ jíjinlẹ̀ inú ọ̀rọ̀ náà mọ́; a tún un sọ ní ìparí gẹ́gẹ́ bí Gíríìkì ṣe ṣe fún ìtẹnumọ́.
- source_word: ἐπιπόθητοι
  choice: tí mo sì ń fẹ́ gidigidi láti rí
  rationale: Gbólóhùn yìí sọ ìfẹ́-ọkàn jíjinlẹ̀ Pọ́ọ̀lù láti rí wọn ní Yorùbá tó ṣe kedere, láìsọ ọ̀rọ̀ náà di pé ó kan rí wọn nìkan.
- source_word: χαρὰ
  choice: ayọ̀
  rationale: Ó jẹ́ ìtumọ̀ tààrà, tó sì pa ọ̀rọ̀ Pọ́ọ̀lù mọ́ pé àwọn ará Fílípì fúnra wọn ni ayọ̀ rẹ̀.
- source_word: στέφανός
  choice: adé
  rationale: “Adé” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá; àmì ìsàlẹ̀ ṣàlàyé pé irú adé tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí ni adé ìṣẹ́gun, kì í ṣe dandan adé ọba.
- source_word: στήκετε
  choice: ẹ dúró ṣinṣin
  rationale: Ó pa àṣẹ náà àti èrò ìfaradà láìyẹsẹ̀ mọ́ ní Yorùbá òde òní.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa ìtumọ̀ ibi àti ìbáṣepọ̀ tí gbólóhùn Pọ́ọ̀lù lè ní mọ́, láìfi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: οὕτως
  choice: ní ọ̀nà yìí
  rationale: Ó jẹ́ kí agbára ọ̀rọ̀ adverb náà hàn gbangba, ó sì tọ́ka sí bí wọn ṣe gbọdọ̀ dúró ṣinṣin ní ìbámu pẹ̀lú ìṣírí tó ṣáájú.
theological_decisions:
- issue: Àwọn tí ἀδελφοί ń tọ́ka sí
  choice: Ọ̀rọ̀ àkọ́kọ́ lo “ẹ̀yin ará mi,” àmì ìsàlẹ̀ sì ṣàlàyé pé gbogbo àwọn onígbàgbọ́ inú ìjọ ló wà nínú àkójọpọ̀ náà.
  alternative: “Ẹ̀yin arákùnrin àti arábìnrin mi” tàbí “ẹ̀yin onígbàgbọ́ ẹlẹgbẹ́ mi.”
  rationale: Èyí kò fi ìrísí akọ ọ̀rọ̀ Gíríìkì pamọ́, bẹ́ẹ̀ ni kò yọ àwọn obìnrin kúrò nínú gbogbo ìjọ tí Pọ́ọ̀lù ń bá sọ̀rọ̀.
- issue: Ìtumọ̀ ἐν κυρίῳ
  choice: nínú Olúwa
  alternative: ní ìṣọ̀kan pẹ̀lú Olúwa
  rationale: Ìtumọ̀ yìí pa àìdánilójú tó wà láàárín ipò àti ìbáṣepọ̀ mọ́, kò sì yan àlàyé ẹ̀kọ́ ìgbàgbọ́ kan ju àwọn mìíràn lọ.
translation_notes:
  register: Yorùbá boṣewa tó níyì, tó ṣe kedere fún òǹkàwé òde òní ni a lò. A pa àsọyé ìfẹ́ Pọ́ọ̀lù àti àtúnsọ “olùfẹ́” mọ́, a sì lo ọ̀pọ̀-orúkọ àti àṣẹ “ẹ” nítorí gbogbo ìjọ ni a ń bá sọ̀rọ̀.
