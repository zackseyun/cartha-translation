source:
  edition: SBLGNT
  text: ὅτι καὶ ἐν Θεσσαλονίκῃ καὶ ἅπαξ καὶ δὶς εἰς τὴν χρείαν μοι ἐπέμψατε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/016.yaml
  text: because even in Thessalonica you sent for my need both once and twice[a].
translation:
  language: yo
  text: nítorí pé ní Tẹsalóníkà pàápàá, ẹ rán ohun kan sí mi fún àìní mi lẹ́ẹ̀kan, àní lẹ́ẹ̀mejì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tí ó wọ́pọ̀ sí i, “ẹ rán ohun kan sí mi fún àìní mi ju ẹ̀ẹ̀kan lọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó mú gbólóhùn àlàyé tí ó sọ ìdí ọ̀rọ̀ Pọ́ọ̀lù wọlé, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘because’ ní Yorùbá.
- source_word: καὶ ἐν Θεσσαλονίκῃ
  choice: ní Tẹsalóníkà pàápàá
  rationale: ‘Pàápàá’ fi ìtẹnumọ́ καί hàn, nígbà tí ‘ní Tẹsalóníkà’ pa ìtumọ̀ ibi tí ἐν sọ mọ́.
- source_word: ἅπαξ καὶ δὶς
  choice: lẹ́ẹ̀kan, àní lẹ́ẹ̀mejì
  rationale: Èyí pa ìtẹnumọ́ àti ìtẹ̀lé ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá, láì sọ ọ́ di gbólóhùn aláìlẹ́gbẹ́ pé ‘ju ẹ̀ẹ̀kan lọ’ nínú ọ̀rọ̀ pàtàkì.
- source_word: εἰς τὴν χρείαν μοι
  choice: ohun tí mo nílò … sí mi
  rationale: Ọ̀rọ̀ yìí sọ ìrànlọ́wọ́ tí a darí sí àìní Pọ́ọ̀lù. ‘Ohun tí mo nílò’ jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì dá χρεία ẹyọ kan mọ́.
- source_word: ἐπέμψατε
  choice: ẹ fi … ránṣẹ́
  rationale: ‘Fi … ránṣẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún ohun tí a fi ránṣẹ́; ohun náà ni àyíká εἰς τὴν χρείαν μοι ń ṣàlàyé, láì fi irú ohun ìrànlọ́wọ́ kan pàtó kún un.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ’ fún ẹgbẹ́ àwọn ará Fílípì, a sì fi àmì ohùn sí ibi tí ó bá yẹ ní àdánidá.
