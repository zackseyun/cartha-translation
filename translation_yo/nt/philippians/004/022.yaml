source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς πάντες οἱ ἅγιοι, μάλιστα δὲ οἱ ἐκ τῆς Καίσαρος οἰκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: yo
  text: Gbogbo àwọn ẹni mímọ́ ń kí yín, pàápàá àwọn tí wọ́n jẹ́ ti agbo ilé Késárì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí wọ́n wá láti agbo ilé Késárì.” Gbólóhùn náà ń tọ́ka sí àwọn tí ó ní ìbáṣepọ̀ pẹ̀lú agbo ilé ọba, kì í ṣe dandan àwọn ọmọ ìdílé Késárì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: kí
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀ ìkíni tí a sábà máa ń lò nínú lẹ́tà; “kí yín” jẹ́ ọ̀nà àdánidá, kedere láti sọ ọ́ ní Yorùbá.
- source_word: πάντες οἱ ἅγιοι
  choice: Gbogbo àwọn ènìyàn mímọ́
  rationale: “Àwọn ènìyàn mímọ́” pa ìtumọ̀ ọ̀rọ̀ Pọ́ọ̀lù mọ́ gẹ́gẹ́ bí orúkọ fún àwọn onígbàgbọ́, láì sọ ọ́ di ẹgbẹ́ àwọn ènìyàn pàtàkì kan ṣoṣo.
- source_word: μάλιστα δὲ
  choice: pàápàá jù lọ
  rationale: Ó fi ìtẹnumọ́ hàn láàárín gbogbo ẹgbẹ́ tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì jẹ́ gbólóhùn Yorùbá àdánidá.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: àwọn tí ó wà láti inú agbo ilé Kesari
  rationale: Èyí pa àwòrán “láti inú agbo ilé” mọ́, ó sì lè tọ́ka sí àwọn tí ó ní ìbáṣepọ̀ pẹ̀lú ilé ọba láì fi dandan mú wọn jẹ́ ìbátan Kesari.
- source_word: Καίσαρος
  choice: Kesari
  rationale: A pa orúkọ oyè ìjọba inú Gíríìkì mọ́ dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí “ọba,” kí ìtọ́kasí ìtàn náà lè dúró.
theological_decisions:
- issue: Ìtumọ̀ “àwọn ènìyàn mímọ́” nínú lílo Pọ́ọ̀lù
  choice: A lò ó gẹ́gẹ́ bí orúkọ fún àwọn onígbàgbọ́/àwọn ẹni mímọ́.
  alternative: Àwọn ènìyàn Ọlọ́run; àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀ náà kò tọ́ka sí ẹgbẹ́ kékeré kan tí wọ́n ní ìwà mímọ́ tó ju ti àwọn mìíràn lọ níbí; ṣùgbọ́n títúmọ̀ rẹ̀ ní tààrà ń pa èdè àti ìfọkànsìn Pọ́ọ̀lù mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. “Agbo ilé Kesari” ń sọ ètò ilé ọba tó gbòòrò ju ìdílé ẹ̀jẹ̀ lọ.
