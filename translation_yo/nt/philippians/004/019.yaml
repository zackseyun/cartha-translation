  terminology: “Mèsáyà Jesu” jẹ́ ìtumọ̀ tó yẹ fún Χριστῷ Ἰησοῦ níbi tí Χριστός ti ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; àlàyé [a] sì tọ́jú àṣàyàn ìbílẹ̀ “Kristi Jesu.” “Ọ̀rọ̀” nínú àyíká yìí ń ṣiṣẹ́ fún ọrọ̀/ìní ọlọ́rọ̀, ó sì bá πλοῦτος mu. Àwọn àlàyé ìsàlẹ̀ náà bá àwọn ìdánilójú ìtumọ̀ Gíríìkì mu.
