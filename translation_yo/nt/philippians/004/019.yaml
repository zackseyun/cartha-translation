id: PHP.4.19
reference: Philippians 4:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: yo
  text: Ọlọ́run mi yóò sì pèsè gbogbo àìní yín ní ìbámu pẹ̀lú ọrọ̀ rẹ̀ nínú ògo, nínú Mèsáyà Jesu[a][b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “nínú Kristi Jesu.”'
    reason: lexical_alternative
  - marker: b
    text: “Ní ìbámu pẹ̀lú ọrọ̀ rẹ̀” ń sọ òṣùwọ̀n ìpèsè Ọlọ́run, kì í ṣe kìkì pé ohun tí ó pèsè ti inú ọrọ̀ rẹ̀ jáde.
    reason: alternative_reading
  - marker: c
    text: Ó tún ṣeé ṣe kí a tú “nínú ògo” sí “lọ́nà ológo.”
    reason: alternative_reading
  - marker: d
    text: 'Tàbí: “nínú ògo nínú Mèsáyà Jesu.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: Ọlọ́run mi yóò sì
  rationale: A fi δέ hàn pẹ̀lú “sì,” ọ̀nà ìsopọ̀ tó bá èdè Yorùbá mu láì sọ pé ìtakora líle wà; “mi” sì pa ìtumọ̀ ti ara ẹni mọ́.
- source_word: πληρώσει
  choice: yóò pèsè
  rationale: Nínú àyíká yìí, πληρόω túmọ̀ sí pípèsè ohun tí ó kù tàbí tí a nílò; “pèsè” jẹ́ èdè Yorùbá àdánidá ju ìtumọ̀ gígúnná bí “kún” lọ.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: gbogbo àìní yín
  rationale: “Àìní” sọ χρεία gẹ́gẹ́ bí ohun tí ó ṣe pàtàkì tàbí tí kò sí; “gbogbo” pa agbára πᾶσαν mọ́.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: ní ìbámu pẹ̀lú ọrọ̀ rẹ̀
  rationale: κατά pẹ̀lú accusative ń tọ́ka sí òṣùwọ̀n tàbí ìlànà ìpèsè, kì í ṣe pé ohun náà kàn ti inú ọrọ̀ rẹ̀ jáde; “ní ìbámu pẹ̀lú” pa ìyàtọ̀ yìí mọ́.
- source_word: ἐν δόξῃ
  choice: nínú ògo
  rationale: A pa ọ̀rọ̀ àsopọ̀ Gíríìkì mọ́ nítorí pé ìbáṣepọ̀ gangan rẹ̀ pẹ̀lú àwọn apá gbolohun mìíràn ṣì ní ààyè fún ìtumọ̀ ju ọ̀kan lọ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jesu
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni àmì òróró; “Mèsáyà” mú iṣẹ́ oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ pa “Kristi” tí ó wọ́pọ̀ mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jesu
  alternative: nínú Kristi Jesu
  rationale: Àyíká náà fàyè gba kí a fi ìtumọ̀ oyè náà hàn kedere gẹ́gẹ́ bí “Mèsáyà,” láì sọ ọ́ di ẹ̀kọ́ ìjọ kan pàtó; àṣàyàn ìbílẹ̀ wà nínú àlàyé.
- issue: Ìbáṣepọ̀ ἐν δόξῃ pẹ̀lú ἐν Χριστῷ Ἰησοῦ
  choice: nínú ògo, nínú Mèsáyà Jesu
  alternative: nínú ògo nínú Mèsáyà Jesu
  rationale: Àmì kọ́mà mú kíkà Yorùbá rọrùn, ṣùgbọ́n a kò ṣàlàyé ìbáṣepọ̀ àwọn gbólóhùn méjèèjì débi pípa àìdánilójú Gíríìkì rẹ́; àlàyé [d] pa ìtẹ̀sí tí kò ní kọ́mà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “àìní” dípò gbólóhùn tó gùn, “ní ìbámu pẹ̀lú” sì pa èrò òṣùwọ̀n κατά mọ́. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
