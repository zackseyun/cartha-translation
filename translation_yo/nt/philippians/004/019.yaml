  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: “yóò sì pèsè” ń mú ọjọ́-ọ̀la πληρώσει àti ìsopọ̀ δέ wá; “gbogbo àìní yín” ń ṣojú πᾶσαν χρείαν ὑμῶν; “ní ìbámu pẹ̀lú ọrọ̀ rẹ̀” ń pa ìtumọ̀ κατά gẹ́gẹ́ bí òṣùwọ̀n mọ́. A tún ti dá àìdánilójú tó wà nínú ìbáṣepọ̀ “nínú ògo” àti “nínú Mèsáyà Jesu” sílẹ̀, láì fi ìtumọ̀ ẹ̀kọ́ kan kún un.'
