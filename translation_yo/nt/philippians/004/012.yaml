review_pass:
  verdict: revise
  source_fidelity: Àwọn ìpín méjì tí ó ṣe pàtàkì nílò àtúnṣe. “rẹ̀ mí sílẹ̀” sábà máa ń túmọ̀ sí fi ẹni sílẹ̀ tàbí kọ̀ ẹni sílẹ̀, kì í ṣe wà ní ipò ìrẹ̀lẹ̀/gígbe ní ìrẹ̀lẹ̀ tí ταπεινοῦσθαι sọ. Bákan náà, “jẹ àjẹyó” ń fi ìjẹ àsè kún ọ̀rọ̀ náà; χορτάζεσθαι níhìn-ín ni ìyàtọ̀ sí ebi, ìyẹn jíjẹ yó. Àtúnṣe náà pa ìfararọ̀ àwọn ọ̀rọ̀-ìṣe náà mọ́, ó sì ṣetọju àkóónú ọ̀rọ̀ Gíríìkì náà.
  naturalness: Ọ̀rọ̀ tí a tún ṣe jẹ́ Yorùbá boṣewa tí ó rọrùn fún kíkà ní gbangba. Lílo “bí mo ṣe lè” mú kí ìtumọ̀ οἶδα pẹ̀lú ọ̀rọ̀-ìṣe aláìlẹ́ni jẹ́ àdánidá. “Wà ní ipò ìrẹ̀lẹ̀” yà kúrò nínú ìmọ̀ ìwà ìrẹ̀lẹ̀ nìkan, ó sì tọ́ka sí ipò ayé ẹni.
  terminology: “ọ̀pọ̀ yanturu,” “ebi pa mí,” àti “ṣe aláìní” bá ìyàtọ̀ ọrọ̀ ìbáṣepọ̀ tí ó wà nínú ẹsẹ náà mu. A ṣàtúnṣe àlàyé ìsàlẹ̀ kí “initiation” má bàa dà bí gbolohun tí kò pé ní Yorùbá, ṣùgbọ́n kí ìtumọ̀ ìpilẹ̀ṣẹ̀ náà ṣì hàn.
  issues:
  - severity: high
    issue: “bí a ṣe ń rẹ̀ mí sílẹ̀”
    rationale: Èdè Yorùbá yìí sábà ń túmọ̀ sí ‘fi mí sílẹ̀/kọ̀ mí sílẹ̀,’ ó sì lè yi ταπεινοῦσθαι padà sí ìkọ̀sílẹ̀, dípò jíjẹ ní ipò kékeré tàbí ìrẹ̀lẹ̀.
  - severity: medium
    issue: “bí a ṣe ń jẹ àjẹyó”
    rationale: “Àjẹyó” jẹ́ àsè tàbí ìṣẹ̀lẹ̀ ayẹyẹ; kò sí èrò àsè nínú χορτάζεσθαι. “yó” fi ìtumọ̀ jíjẹ títí ó fi tó hàn láìfi ohun míì kún un.
  - severity: low
    issue: Ọ̀rọ̀ àlàyé ìsàlẹ̀ lọwọlọwọ ‘a ti dá mi sí ohun ìkọ̀kọ̀’ kò rọrùn.
    rationale: A lè sọ ìṣe ìdásílẹ̀ sí ìmọ̀ ìkọ̀kọ̀ ní Yorùbá tó ṣe kedere ju bẹ́ẹ̀ lọ, láìpadanu àwòrán ọ̀rọ̀ Gíríìkì náà.
  revised_text: Mo mọ bí mo ṣe lè wà ní ipò ìrẹ̀lẹ̀, mo sì mọ bí mo ṣe lè ní ọ̀pọ̀ yanturu. Nínú gbogbo ipò àti nínú ohun gbogbo, mo ti kọ́ àṣírí náà:[a] bí mo ṣe lè yó àti bí ebi ṣe lè pa mí, bí mo ṣe lè ní ọ̀pọ̀ yanturu àti bí mo ṣe lè ṣe aláìní.
