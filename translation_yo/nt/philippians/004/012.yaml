id: PHP.4.12
reference: Philippians 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: yo
  text: Mo mọ bí mo ṣe lè wà ní ipò ìrẹ̀lẹ̀, mo sì mọ bí mo ṣe lè ní ọ̀pọ̀ yanturu. Nínú gbogbo ipò àti nínú ohun gbogbo, mo ti kọ́ àṣírí náà:[a] bí mo ṣe lè yó àti bí ebi ṣe lè pa mí, bí mo ṣe lè ní ọ̀pọ̀ yanturu àti bí mo ṣe lè ṣe aláìní.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà sí i, “a ti dá mi sí ìmọ̀ ìkọ̀kọ̀.” Pọ́ọ̀lù lo èdè ìdásílẹ̀ sí ìmọ̀ ìkọ̀kọ̀ gẹ́gẹ́ bí àkàwé fún kíkọ́ àṣírí kan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Mo mọ bí
  rationale: Pẹ̀lú àwọn ọ̀rọ̀-ìṣe aláìlẹ́ni tí ó tẹ̀ lé e, èyí fi ìmọ̀ ìrírí hàn ní Yorùbá, kì í ṣe ìmọ̀ lásán.
- source_word: ταπεινοῦσθαι
  choice: bí a ṣe ń rẹ̀ mí sílẹ̀
  rationale: Ó pa ìtumọ̀ pé ipò ẹni di kékeré tàbí pé a rẹ ẹni sílẹ̀ mọ́, láìdín in kù sí ìrẹ̀lẹ̀ inú nìkan.
- source_word: περισσεύειν
  choice: bí a ṣe ń ní lọ́pọ̀ yanturu
  rationale: Ó túmọ̀ sí níní ju ohun tí ó tó lọ, ó sì yẹ fún mejeeji ìlò ọ̀rọ̀ náà nínú ẹsẹ yìí.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: Nínú gbogbo ipò àti nínú ohun gbogbo
  rationale: Ó pa àwọn gbólóhùn méjèèjì àti ìtẹnumọ́ wọn mọ́ ní Yorùbá tó ṣe déédé.
- source_word: μεμύημαι
  choice: ni mo ti kọ́ àṣírí náà
  rationale: Ó sọ ìtumọ̀ àkàwé náà ní èdè òde òní; àlàyé ìpilẹ̀ṣẹ̀ ọ̀rọ̀ pé a ti dá ẹni sí ohun ìkọ̀kọ̀ wà nínú àlàyé ìsàlẹ̀.
- source_word: χορτάζεσθαι
  choice: bí a ṣe ń jẹ àjẹyó
  rationale: Ní ìtakora sí ebi, àjẹyó fi hàn pé ẹni jẹun títí ó fi yó dáadáa.
- source_word: πεινᾶν
  choice: bí ebi ṣe ń pa mí
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ pé ebi ń pa ẹni.
- source_word: ὑστερεῖσθαι
  choice: bí mo ṣe ń ṣe aláìní
  rationale: Ó ṣàfihàn àìní ní ìtumọ̀ gbòòrò, láìfi í mọ́ owó nìkan.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. Àtúnṣe ẹni nínú àwọn gbólóhùn Yorùbá jẹ́ kí àwọn ọ̀rọ̀-ìṣe inú Gíríìkì tó ní fọ́ọ̀mù àárín/aláìṣe hàn lọ́nà àdánidá.
