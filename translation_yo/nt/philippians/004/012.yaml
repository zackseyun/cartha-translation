  to: Mo mọ bí mo ṣe lè wà ní ipò ìrẹ̀lẹ̀, mo sì mọ bí mo ṣe lè ní ọ̀pọ̀ yanturu. Nínú gbogbo ipò àti nínú ohun gbogbo, mo ti kọ́ àṣírí náà:[a] bí mo ṣe lè yó àti bí ebi ṣe lè pa mí, bí mo ṣe lè ní ọ̀pọ̀ yanturu àti bí mo ṣe lè ṣe aláìní.
  rationale: A rọ́pò ọ̀rọ̀ tí ó lè túmọ̀ sí ìkọ̀sílẹ̀ ẹni pẹ̀lú “wà ní ipò ìrẹ̀lẹ̀,” kí ìtumọ̀ ipò ìsàlẹ̀ ti ταπεινοῦσθαι lè hàn. A tún rọ́pò “jẹ àjẹyó” pẹ̀lú “yó,” nítorí pé ọ̀rọ̀ Gíríìkì ń fi jíjẹ yó wé ebi, kì í ṣe àsè ayẹyẹ. Àmì àlàyé ìsàlẹ̀ [a] wà níbi μεμύημαι, gẹ́gẹ́ bí ó ti yẹ.
