id: PHP.4.15
reference: Philippians 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: yo
  text: Ẹ̀yin ará Fílípì, ẹ̀yin fúnra yín náà mọ̀ pé, ní ìbẹ̀rẹ̀ ìhìn rere, nígbà tí mo kúrò ní Makedóníà, kò sí ìjọ kankan tí ó bá mi ṣe alábàápín nínú ọ̀ràn fífúnni àti gbígbà[a], bí kò ṣe ẹ̀yin nìkan ṣoṣo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú àkọọ́lẹ̀ fífúnni àti gbígbà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδατε
  choice: mọ̀
  rationale: Ọ̀rọ̀ ìṣe ìmọ̀ ní àsìkò ìsinsìnyí ni ó bá agbára οἶδα mu ní àyíká ọ̀rọ̀ yìí.
- source_word: δὲ
  choice: náà
  rationale: A jẹ́ kí àsopọ̀ ọ̀rọ̀ náà rọrùn ní Yorùbá láì fi ìtakora líle kún un; ìtẹ̀síwájú ọ̀rọ̀ náà hàn nínú ìṣètò gbólóhùn.
- source_word: καὶ ὑμεῖς
  choice: ẹ̀yin fúnra yín náà
  rationale: Èyí pa agbára àfikún καί àti ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ ὑμεῖς mọ́.
- source_word: Φιλιππήσιοι
  choice: Ẹ̀yin ará Fílípì
  rationale: Ọ̀nà àdánidá ní Yorùbá láti bá àwọn olùgbé Fílípì sọ̀rọ̀ ní tààràtà.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: ní ìbẹ̀rẹ̀ ìhìn rere
  rationale: Ó tẹ̀lé gbólóhùn Gíríìkì, ó sì pa àìdánilójú mọ́ nípa bóyá ó ń tọ́ka sí ìbẹ̀rẹ̀ iṣẹ́ Pọ́ọ̀lù tàbí ìpele àkọ́kọ́ tí ìhìn rere dé ọ̀dọ̀ wọn.
- source_word: ἐξῆλθον ἀπὸ Μακεδονίας
  choice: mo kúrò ní Makedóníà
  rationale: Ó sọ ìṣẹ̀lẹ̀ ìjáde náà ní Yorùbá òde òní tí ó ṣe kedere, tí ó sì ní iyì.
- source_word: οὐδεμία ... ἐκκλησία
  choice: kò sí ìjọ kankan
  rationale: Ìtumọ̀ tààrà àti àdánidá fún kíkìlọ̀ pé kò sí ìjọ kan rárá.
- source_word: μοι ... ἐκοινώνησεν
  choice: tí ó bá mi ṣe alábàápín
  rationale: Ó fi ìkópa pẹ̀lú Pọ́ọ̀lù hàn, pàápàá nínú àyíká ìrànlọ́wọ́ ohun ìní, láì dín ọ̀rọ̀ náà kù sí òwò lásán.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: nínú ọ̀ràn fífúnni àti gbígbà
  rationale: “Ọ̀ràn” mú gbólóhùn náà yé òǹkàwé òde òní, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ tó lè jẹ mọ́ àkọọ́lẹ̀ ìṣirò mọ́.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: bí kò ṣe ẹ̀yin nìkan ṣoṣo
  rationale: Ó pa ìtẹnumọ́ pé àwọn ará Fílípì nìkan ni wọ́n ṣe bẹ́ẹ̀ mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá tí ó ṣe kedere, tí ó ní iyì, tí ó sì bójú mu fún kíkà ní gbangba ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì pa ìṣètò ìtumọ̀ àti àìdánilójú ọ̀rọ̀ Gíríìkì mọ́.
