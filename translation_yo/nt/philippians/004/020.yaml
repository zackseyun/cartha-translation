  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ καὶ πατρὶ ἡμῶν ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: yo
  text: Kí ògo jẹ́ ti Ọlọ́run àti Baba wa láé àti láéláé[a]. Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ní títúmọ̀ ní tààràtà, “sí àwọn sáà ti àwọn sáà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: A kò túmọ̀ rẹ̀ ní ọ̀rọ̀ ọ̀tọ̀
  rationale: Ó jẹ́ àsopọ̀ pẹ̀lẹ́ tí ó ń darí ọ̀rọ̀ sí ìparí orin ìyìn; fífi “ṣùgbọ́n” tàbí ọ̀rọ̀ tó túmọ̀ sí “ní báyìí” sí i lè mú ìtakora tàbí ìtumọ̀ àkókò tí kò sí nínú Gíríìkì wọlé.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: Ọlọ́run àti Baba wa
  rationale: Gbólóhùn náà ń tọ́ka sí ẹni kan ṣoṣo gẹ́gẹ́ bí Ọlọ́run àti Baba wa; èdè Yorùbá yìí jẹ́ àdánidá, ó sì jẹ́ kí “wa” bá àwọn orúkọ méjèèjì mu.
- source_word: ἡ δόξα
  choice: Kí ògo jẹ́ ti
  rationale: Gbólóhùn Gíríìkì kò ní ọ̀rọ̀-ìṣe; “Kí ògo jẹ́ ti” mú ipa orin ìyìn àti ìbùkún rẹ̀ jáde ní Yorùbá láìsọ ọ́ di gbólóhùn àlàyé lasan.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: láé àti láéláé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání fún àkókò tí kò ní òpin, ó sì pa ìwọ̀n gíga orin ìyìn náà mọ́; àlàyé ìtumọ̀ tààràtà wà ní àlàyé ìsàlẹ̀.
- source_word: ἀμήν
  choice: Àmín
  rationale: A pa ọ̀rọ̀ ìjẹ́wọ́ ìjọsìn tí a ti gba wọ èdè Yorùbá mọ́, pẹ̀lú àmì ohùn tó yẹ.
theological_decisions:
- issue: Fífi ọ̀rọ̀-ìṣe tí a fi sílẹ̀ nínú orin ìyìn kún un
  choice: Kí ògo jẹ́ ti
  alternative: Ògo jẹ́ ti
  rationale: Nítorí pé gbólóhùn Gíríìkì kò ní ọ̀rọ̀-ìṣe, méjèèjì ṣeé ṣe; ọ̀nà “Kí ... jẹ́ ti” bá iṣẹ́ orin ìyìn àti ìfẹ́-ọkàn mímọ́ inú ọ̀rọ̀ náà mu jù, láìsọ pé ọ̀rọ̀-ìṣe kan wà ní gbangba nínú orísun.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “láé àti láéláé” gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún àìnípẹ̀kun, a sì yẹra fún àsopọ̀ tó lè fi ìtakora tàbí “ní báyìí” tí kò sí nínú orísun kun ọ̀rọ̀ náà.
