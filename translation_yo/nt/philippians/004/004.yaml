  text: Χαίρετε ἐν κυρίῳ πάντοτε· πάλιν ἐρῶ, χαίρετε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/004.yaml
  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: yo
  text: Ẹ máa yọ̀ nínú Olúwa nígbà gbogbo[a]; èmi yóò tún sọ[b] pé, ẹ máa yọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ máa láyọ̀ nínú Olúwa nígbà gbogbo.”
    reason: lexical_alternative
  - marker: b
    text: Ní ọ̀rọ̀ gangan, “Lẹ́ẹ̀kan sí i, èmi yóò sọ, ‘Ẹ yọ̀.’”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: Ẹ máa yọ̀
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ fún ọ̀pọ̀ ènìyàn, ó sì ní ìtumọ̀ ayọ̀ tí a ń bá a lọ. ‘Ẹ máa yọ̀’ jẹ́ Yorùbá àdánidá, ó sì pa agbára àṣẹ àti ìtẹnumọ́ mọ́.
- source_word: ἐν
  choice: nínú
  rationale: ‘Nínú’ pa ìtumọ̀ ààyè ìbáṣepọ̀ tàbí ìṣọ̀kan mọ́ láì sọ ọ́ di ‘nítorí’ tàbí láì fi ìtumọ̀ irinṣẹ́ kún un.
- source_word: κυρίῳ
  choice: Olúwa
  rationale: ‘Olúwa’ ni ọ̀rọ̀ Yorùbá tí ó bójú mu fún κύριος ní àyíká yìí, níbi tí Pọ́ọ̀lù ti ń tọ́ka sí Kristi.
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Gbólóhùn yìí jẹ́ Yorùbá tó ṣe kedere, ó sì fi agbára ìtẹ̀síwájú adverb náà hàn.
- source_word: πάλιν
  choice: tún
  rationale: ‘Tún’ fi hàn pé Pọ́ọ̀lù ń ṣe àṣẹ náà ní àtúnṣe fún ìtẹnumọ́.
- source_word: ἐρῶ
  choice: èmi yóò sọ
  rationale: ‘Yóò sọ’ pa ìrísí ọ̀rọ̀ ọjọ́ iwájú Gíríìkì mọ́; lílo ‘èmi’ tún mú ìtẹnumọ́ ẹni tó ń sọ̀rọ̀ hàn ní Yorùbá.
- source_word: χαίρετε
  choice: ẹ máa yọ̀
  rationale: A tún ọ̀rọ̀ náà ṣe bákan náà láti pa àtúnṣe àti ìtẹnumọ́ Pọ́ọ̀lù mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘nínú Olúwa’
  choice: 'A pa á mọ́ gẹ́gẹ́ bí ààyè ìbáṣepọ̀ tàbí ìṣọ̀kan: kí àwọn onígbàgbọ́ máa yọ̀ nínú ìbáṣepọ̀ wọn pẹ̀lú Olúwa.'
  alternative: ‘Nítorí Olúwa’ tàbí ‘nípasẹ̀ agbára Olúwa.’
  rationale: ἐν κυρίῳ lè ní ìjìnlẹ̀ ìtumọ̀ ìbáṣepọ̀ àti ìṣọ̀kan nínú Pọ́ọ̀lù. ‘Nínú Olúwa’ pa ìfẹ̀sí yẹn àti àìdánilójú tó yẹ mọ́ láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó níyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. Fọ́ọ̀mù ‘ẹ’ fi hàn pé àṣẹ náà ń lọ sí ọ̀pọ̀ ènìyàn; ‘máa’ ń ṣàfihàn ìṣe tí ó ń bá a lọ.
