  terminology: ‘Olúwa’ jẹ́ ìtumọ̀ tó dáa fún κυρίῳ, ‘bíbìkítà’ ń pa ìtumọ̀ φρονέω mọ́ ní àyíká yìí, àti ‘àǹfààní’ ń ṣàfihàn καιρός gẹ́gẹ́ bí àkókò tàbí ọ̀nà tó yẹ. Àwọn àlàyé ìsàlẹ̀ méjèèjì bá àwọn ìdílé ọ̀rọ̀ Gíríìkì mu, a sì fi àmì [a] àti [b] sí ibi tó yẹ.
