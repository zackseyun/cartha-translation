id: PHP.4.10
reference: Philippians 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: yo
  text: Mo yọ̀ gidigidi nínú Olúwa pé ní báyìí, níkẹyìn, bíbìkítà yín fún mi ti sọjí[a]. Ní tòótọ́, ẹ ti ń bìkítà fún mi[b], ṣùgbọ́n ẹ kò ní àǹfààní.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bíbìkítà yín fún mi tún yè”; ní tààràtà, ọ̀rọ̀ Gíríìkì náà ní àwòrán ohun ọ̀gbìn tó tún yọ ewé tàbí tó tún tanná.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ ti ń ronú nípa mi.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ríronú nípa ẹnì kan, níní irú èrò kan sí i, tàbí bíbìkítà fún un.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: Mo yọ̀
  rationale: Ó fi ìṣe ayọ̀ Pọ́ọ̀lù hàn ní tààràtà, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa gbólóhùn Páùlù mọ́ gẹ́gẹ́ bí ibi tàbí ìpìlẹ̀ ayọ̀ rẹ̀, láì dín ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ kù.
- source_word: μεγάλως
  choice: gidigidi
  rationale: Ó gbé bí ayọ̀ náà ṣe pọ̀ tó jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: ἤδη ποτὲ
  choice: ní báyìí, níkẹyìn
  rationale: Àpapọ̀ ọ̀rọ̀ yìí tọ́ka sí ohun tó tún fara hàn lẹ́yìn àkókò kan; ìtumọ̀ yìí kò fi ẹ̀sùn kàn àwọn ará Fílípì.
- source_word: ἀνεθάλετε
  choice: ti sọjí
  rationale: Ó mú èrò ohun tó tún yè tàbí tún rú jáde, ó sì bá bíbìkítà mu ní Yorùbá; àlàyé ìsàlẹ̀ fi àwòrán ewéko inú Gíríìkì hàn.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: bíbìkítà yín fún mi
  rationale: Nínú àyíká yìí, φρονεῖν ju ríronú lásán lọ; ó ní ìtumọ̀ ìfẹ́ inú àti àbójútó tó lè hàn nínú ìṣe.
- source_word: ἐφ’ ᾧ
  choice: Ní tòótọ́
  rationale: Ó mú agbára àlàyé gbólóhùn náà jáde lọ́nà Yorùbá tó ń ṣàn dáadáa.
- source_word: ἐφρονεῖτε
  choice: ẹ ti ń bìkítà fún mi
  rationale: Fọ́ọ̀mù yìí fi hàn pé bíbìkítà wọn ti wà tẹ́lẹ̀, kì í ṣe pé ó ṣẹ̀ṣẹ̀ bẹ̀rẹ̀; ó tún bá ìtumọ̀ φρονεῖν àkọ́kọ́ mu.
- source_word: ἠκαιρεῖσθε
  choice: ẹ kò ní àǹfààní
  rationale: Ó tọ́ka sí àìsí àkókò tàbí ọ̀nà tó bójú mu, kì í ṣe àìní ìfẹ́ láti ṣèrànwọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ‘nínú Olúwa’ pẹ̀lú ayọ̀ Pọ́ọ̀lù
  choice: nínú Olúwa
  alternative: nítorí Olúwa
  rationale: Gíríìkì lè ní ìmọ̀lára ibi tàbí ìpìlẹ̀; ‘nínú Olúwa’ pa ìfẹ̀ rẹ̀ mọ́ láì yàn ‘nítorí’ nìkan.
- issue: Bóyá àwọn ará Fílípì dáwọ́ bíbìkítà dúró
  choice: ẹ ti ń bìkítà fún mi, ṣùgbọ́n ẹ kò ní àǹfààní
  alternative: ẹ tún bẹ̀rẹ̀ sí í bìkítà fún mi
  rationale: Ìpín kejì sọ kedere pé bíbìkítà wọn wà tẹ́lẹ̀; ohun tí kò sí ni àǹfààní, kì í ṣe ìfẹ́ inú.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, kì í ṣe gẹ́gẹ́ bí àmì ọ̀wọ̀ fún ẹnì kan. ‘Bíbìkítà’ yàgò fún ‘àníyàn,’ èyí tó sábà máa ń túmọ̀ sí ìdààmú tàbí ìbànújẹ ní Yorùbá.
