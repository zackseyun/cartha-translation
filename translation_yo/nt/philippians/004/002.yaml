id: PHP.4.2
reference: Philippians 4:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: yo
  text: Mo rọ Euodia, mo sì rọ Sintike, kí wọ́n ní èrò kan náà nínú Olúwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “kí wọ́n ní inú kan náà nínú Olúwa”; ó sì tún ṣeé ṣe kí ó túmọ̀ sí “kí wọ́n fohùn ṣọ̀kan nínú Olúwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: Euodia
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe ń pe orúkọ Gíríìkì, dípò títúmọ̀ ìtumọ̀ orúkọ náà.
- source_word: παρακαλῶ
  choice: Mo rọ
  rationale: “Mo rọ” fi ìtara àti ẹ̀bẹ̀ ara ẹni tí ọ̀rọ̀ náà ní hàn ní Yorùbá àdánidá. A tún ọ̀rọ̀ náà sọ fún obìnrin kọ̀ọ̀kan gẹ́gẹ́ bí Pọ́ọ̀lù ṣe ṣe nínú Gíríìkì.
- source_word: Συντύχην
  choice: Sintike
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìpè Gíríìkì, láìtúmọ̀ ìtumọ̀ orúkọ náà.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: kí wọ́n ní èrò kan náà
  rationale: Gbólóhùn yìí pa ìtumọ̀ ìṣọ̀kan inú èrò àti ìwà-ọkàn mọ́; ó gbòòrò ju “kí wọ́n fohùn ṣọ̀kan” lọ, èyí tí ó lè túmọ̀ sí ìfẹ̀hónúhàn lórí ọ̀ràn kan ṣoṣo.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ìtumọ̀ yìí pa àkànṣe ọ̀rọ̀ Gíríìkì mọ́, ó sì fi hàn pé ìṣọ̀kan tí a ń béèrè fún dúró lórí ìbáṣepọ̀ wọn pẹ̀lú Olúwa.
theological_decisions:
- issue: Bí a ṣe máa lóye τὸ αὐτὸ φρονεῖν ἐν κυρίῳ
  choice: kí wọ́n ní èrò kan náà nínú Olúwa
  alternative: kí wọ́n fohùn ṣọ̀kan nínú Olúwa
  rationale: A kò dín gbólóhùn náà kù sí fífohùn ṣọ̀kan lórí kókó kan; a pa ìtumọ̀ tó lè kan èrò, ìwà-ọkàn, àti ìṣọ̀kan wọn gẹ́gẹ́ bí ẹni tí ó wà nínú Olúwa mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní. A pa àtúnṣe “Mo rọ ... mo sì rọ ...” mọ́ láti fi ìtọ́kasí Pọ́ọ̀lù sí obìnrin kọ̀ọ̀kan hàn ní dọ́gba. Àmì ohùn ni a lò níbi tí ó bá yẹ; a kọ àwọn orúkọ àjèjì ní fọ́ọ̀mù tó ṣeé kà fún olùkà Yorùbá.
