id: PHP.4.7
reference: Philippians 4:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: yo
  text: Àti àlàáfíà Ọlọ́run, tí ó ju gbogbo òye lọ, yóò ṣọ́ ọkàn yín àti èrò yín nínú Mèsáyà Jésù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: “Àlàáfíà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì lè sọ ìfọ̀kànbalẹ̀ àti ìbáṣepọ̀ rere tí εἰρήνη ní nínú àyíká yìí.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ìṣọ̀kan olùnínkan náà ni a túmọ̀ ní tààrà gẹ́gẹ́ bí “àlàáfíà Ọlọ́run,” láì fi ìtumọ̀ “láti ọ̀dọ̀ Ọlọ́run” kún un.
- source_word: ὑπερέχουσα
  choice: tí ó ju … lọ
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan ga ju tàbí ré kọjá ohun mìíràn.
- source_word: πάντα νοῦν
  choice: gbogbo òye
  rationale: Nínú gbólóhùn yìí, νοῦς ń tọ́ka sí agbára ìlóye; “gbogbo òye” pa ààyè ìtumọ̀ Gíríìkì mọ́ láì dín un sí “ọpọlọ” nìkan.
- source_word: φρουρήσει
  choice: yóò máa ṣọ́
  rationale: “Ṣọ́” mú àwòrán ìṣọ́ àti ààbò tí ọ̀rọ̀ Gíríìkì ní jáde; “máa” sì fi iṣẹ́ ìṣọ́ tó ń bá a lọ hàn lọ́nà Yorùbá àdánidá.
- source_word: καρδίας
  choice: ọkàn
  rationale: “Ọkàn” pa ìtumọ̀ Bíbélì ti inú ẹni, ìfẹ́, àti ìpìlẹ̀ ìwà ẹni mọ́; ó tún lè dúró fún ọ̀pọ̀ ẹni lẹ́yìn arọ́pò-orúkọ “yín.”
- source_word: νοήματα
  choice: èrò
  rationale: νοήματα ń tọ́ka sí àwọn èrò tàbí ìrònú; “èrò” yà á sọ́tọ̀ kedere sí “ọkàn” tí ó ṣáájú.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa èrò ipò tàbí ìṣọ̀kan mọ́, “Mèsáyà” sì tú oyè Χριστός dípò kí a fi í sílẹ̀ gẹ́gẹ́ bí orúkọ tí a kò túmọ̀.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ nínú gbólóhùn Pọ́ọ̀lù ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  alternative: nínú Kristi Jésù
  rationale: Χριστός ní agbára oyè níbí, nítorí náà “Mèsáyà” mú ìtumọ̀ “ẹni àmì òróró” wá sí èdè afojúsùn, ó sì pa èrò ìṣọ̀kan àwọn onígbàgbọ́ pẹ̀lú Jésù mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní ọlá ṣùgbọ́n tó ṣeé lóye ni a lò. A yan “èrò” dípò “ọpọlọ” fún νοήματα, nítorí pé ohun tí ènìyàn ń rò ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe ẹ̀yà ara. Kò sí àlàyé ẹsẹ̀ tí a nílò; àlàyé [a] inú English POB kò bá gbólóhùn tàbí ìyàtọ̀ ọ̀rọ̀ inú Gíríìkì mu, nítorí náà a kò gbé e wọlé.
