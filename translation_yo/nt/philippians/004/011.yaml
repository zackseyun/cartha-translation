id: PHP.4.11
reference: Philippians 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: yo
  text: Kì í ṣe nítorí àìní ni mo ń sọ̀rọ̀, nítorí èmi ti kọ́ láti ní ìtẹ́lọ́rùn[a] nínú ipòkípò tí mo wà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ohun tí ó ní tó fún un.” Ajẹ́tífù Gíríìkì náà lè tọ́ka sí jíjẹ́ ẹni tí ohun tí ó ní tó fún un, ṣùgbọ́n níbí a túmọ̀ rẹ̀ gẹ́gẹ́ bí “ní ìtẹ́lọ́rùn” nítorí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: nítorí àìní
  rationale: Gbólóhùn Gíríìkì náà ń tọ́ka sí sísọ̀rọ̀ nítorí ohun tí ó kù tàbí àìní ara ẹni. ‘Nítorí àìní’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ náà mọ́.
- source_word: λέγω
  choice: mo ń sọ èyí
  rationale: Àmì ìṣe tí ń lọ lọ́wọ́ bá tense ìsinsìnyí Gíríìkì mu, ‘èyí’ sì mú ọ̀rọ̀ náà ṣe kedere ní Yorùbá láìfi ìtumọ̀ tuntun kún un.
- source_word: ἔμαθον
  choice: mo ti kọ́
  rationale: ‘Mo ti kọ́’ fi hàn pé Pọ́ọ̀lù kọ́ ẹ̀kọ́ náà tẹ́lẹ̀, tí àbájáde rẹ̀ sì ṣì wúlò ní báyìí.
- source_word: ἐν οἷς εἰμι
  choice: nínú ipò èyíkéyìí tí mo bá wà
  rationale: Ọ̀rọ̀ náà jẹ́ àpèjúwe gbogbo ipò tí ó lè bá a, kì í ṣe ibi kan ṣoṣo. Ìtumọ̀ yìí jẹ́ àdánidá, ó sì sún mọ́ ìtumọ̀ ojú-ọ̀rọ̀.
- source_word: αὐτάρκης
  choice: ní ìtẹ́lọ́rùn
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ‘ní ìtẹ́lọ́rùn’ sọ ipò ọkàn tí Pọ́ọ̀lù kọ́ láti ní jáde dáadáa, láìsọ pé ó dá lé ara rẹ̀ pátápátá.
theological_decisions:
- issue: Ìtumọ̀ ọgbọ́n-orí tí αὐτάρκης lè ní
  choice: ní ìtẹ́lọ́rùn
  alternative: tó ara ẹni lọ́rùn láìní ìrànlọ́wọ́ ẹlòmíràn
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí jíjẹ́ ẹni tí ohun tí ó ní tó fún, ṣùgbọ́n àyíká ọ̀rọ̀ náà ń tẹnu mọ́ ìtẹ́lọ́rùn tí a kọ́ nínú onírúurú ipò. Yíyan ‘ní ìtẹ́lọ́rùn’ kò gbé èrò pé ènìyàn kò nílò Ọlọ́run wọ inú ẹsẹ náà, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ míì mọ́.
translation_notes:
  register: Yorùbá àfẹnusọ ìgbàlódé, tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Kì í ṣe pé’ àti ‘nínú ipò èyíkéyìí tí mo bá wà’ jẹ́ àdánidá fún òǹkàwé gbogbo ènìyàn, nígbà tí ‘ìtẹ́lọ́rùn’ pa ìwòntúnwọ̀nsì ẹ̀kọ́ ìsìn àti ìtumọ̀ ojú-ọ̀rọ̀ mọ́.
