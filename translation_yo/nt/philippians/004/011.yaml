  source_fidelity: 'Ìtumọ̀ náà fi ìtumọ̀ pàtàkì àwọn gbolóhùn Gíríìkì náà hàn dáadáa: Pọ́ọ̀lù kò sọ̀rọ̀ nítorí àìní, ó ti kọ́ ìtẹ́lọ́rùn nínú gbogbo ipò. Síbẹ̀, ‘tí mo bá wà’ ní ìtumọ̀ àídájú/ojú-ìwájú díẹ̀, níbi tí ‘tí mo wà’ ti sún mọ́ ἐν οἷς εἰμι (‘nínú àwọn ipò tí mo wà’) ju.'
