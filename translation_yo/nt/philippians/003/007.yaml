  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ohun tí ó jẹ́ èrè fún mi, wọ̀nyẹn ni mo ti kà[b] sí òfò nítorí Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “nítorí Kristi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “mo ti yẹ̀wò wọn gẹ́gẹ́ bí òfò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ líle hàn láàárín àwọn ohun tí Pọ́ọ̀lù lè fi gbẹ́kẹ̀ lé tẹ́lẹ̀ àti bí ó ṣe ń wo wọn nísinsìnyí.
- source_word: ἅτινα
  choice: gbogbo ohun tí
  rationale: Ó tọ́ka sí gbogbo àkójọpọ̀ àwọn àǹfààní tí a ṣẹ̀ṣẹ̀ dárúkọ, kì í ṣe ohun kan ṣoṣo.
- source_word: κέρδη
  choice: èrè
  rationale: “Èrè” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sì pa àwòrán ìṣírò ohun ìní mọ́.
- source_word: ἥγημαι
  choice: mo ti kà ... sí
  rationale: Àpólà yìí sọ ìpinnu tí a ti ṣe, tí ipa rẹ̀ sì ṣì dúró; “mo ti kà ... sí” mú èrò yẹn jáde ní Yorùbá tó ṣe kedere.
- source_word: διὰ τὸν Χριστόν
  choice: nítorí Mèsáyà
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń fi ìdí tàbí ohun tó fa ìgbésẹ̀ hàn níbí; “Mèsáyà” tú Χριστός gẹ́gẹ́ bí oyè.
- source_word: ζημίαν
  choice: òfò
  rationale: “Òfò” dáhùn sí “èrè” nínú àwòrán ìṣírò, ó sì fi hàn pé àwọn ohun tí ó jẹ́ àǹfààní tẹ́lẹ̀ ti di ohun tí kò ní iye mọ́ lójú Pọ́ọ̀lù.
theological_decisions:
- issue: Ìtumọ̀ Χριστόν
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní àyíká ọ̀rọ̀ yìí, Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” mú ìtumọ̀ oyè náà jáde, nígbà tí “Kristi” jẹ́ àyànmọ́ ìkọ̀wé orúkọ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì pa àwòrán èrè àti òfò inú Gíríìkì mọ́.
