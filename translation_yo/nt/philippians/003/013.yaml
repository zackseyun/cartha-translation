  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ἀδελφοί ni a pe ní “Ẹ̀yin ará,” λογίζομαι jẹ́ “ka ara mi sí,” κατειληφέναι sì jẹ́ “ti di èyí mú,” ní fífi ohun tí “èyí” ń tọ́ka sí sílẹ̀ ní àìpàtó gẹ́gẹ́ bí orísun. Àwọn apá méjèèjì tó ń ṣàpèjúwe ìṣe títẹ̀síwájú náà tún wà ní ìbámu pẹ̀lú ἐπιλανθανόμενος àti ἐπεκτεινόμενος.'
