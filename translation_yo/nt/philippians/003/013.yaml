id: PHP.3.13
reference: Philippians 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: yo
  text: 'Ẹ̀yin ará[a], èmi kò ka ara mi sí ẹni tí ó ti di èyí mú. Ṣùgbọ́n ohun kan: mo ń gbàgbé àwọn ohun tí ó wà lẹ́yìn, tí mo sì ń na ọwọ́ sí àwọn ohun tí ó wà níwájú,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ẹ̀yin ará” túmọ̀ ọ̀rọ̀ ìpè Gíríìkì adelphoi, tí fọ́ọ̀mù rẹ̀ jẹ́ akọ; Pọ́ọ̀lù sábà máa ń lò ó fún gbogbo àwùjọ àwọn onígbàgbọ́, títí kan àwọn obìnrin.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: Ẹ̀yin ará
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá àti ọ̀wọ̀ fún pípe àwọn onígbàgbọ́ ní Yorùbá; ó lè tọ́ka sí gbogbo àwùjọ, lọ́kùnrin àti lóbìnrin, bí ó tilẹ̀ jẹ́ pé fọ́ọ̀mù Gíríìkì jẹ́ akọ.
- source_word: λογίζομαι
  choice: ka ara mi sí
  rationale: Ó mú ìtumọ̀ ìṣírò tàbí ìgbéyẹ̀wò ara ẹni jáde ní Yorùbá òde òní láìsọ ọ́ di ọ̀rọ̀ ìgbàanì.
- source_word: κατειληφέναι
  choice: ti di èyí mú
  rationale: Ó pa àwòrán mímú ohun kan mọ́ gẹ́gẹ́ bí ẹsẹ 12 ṣe ń lò ó; ‘èyí’ fi ohun tí a kò dárúkọ ní Gíríìkì hàn láìtúmọ̀ rẹ̀ sí ẹ̀kọ́ pàtó.
- source_word: ἓν δέ
  choice: Ṣùgbọ́n ohun kan
  rationale: Ó tẹ̀ lé gbolohun Gíríìkì tí a gé kúrú, láìfi ọ̀rọ̀-ìṣe tí kò sí nínú orísun kún un.
- source_word: τὰ μὲν ὀπίσω
  choice: àwọn ohun tí ó wà lẹ́yìn
  rationale: Ó pa ìtumọ̀ ọ̀pọ̀ àti àwòrán ohun tó wà lẹ́yìn mọ́ ní Yorùbá tó ṣe kedere.
- source_word: ἐπιλανθανόμενος
  choice: mo ń gbàgbé
  rationale: Èyí ni ìtumọ̀ tààrà tó bá ìṣípò síwájú mu, láìtúmọ̀ rẹ̀ sí fífi ohun sílẹ̀ tàbí kíkọ̀ ọ́ sí.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: àwọn ohun tí ó wà níwájú
  rationale: Ó ṣe ìwọ̀ntúnwọ̀nsì pẹ̀lú ‘àwọn ohun tí ó wà lẹ́yìn’ ó sì pa ìtakora àyè náà mọ́.
- source_word: ἐπεκτεινόμενος
  choice: mo ń nawọ́ sí
  rationale: Ó fi ìṣe nínà ara síwájú hàn ní ọ̀nà àdánidá, láìfi ìtẹnumọ́ ‘ìsapá líle’ tí kò ṣe dandan kún un.
theological_decisions:
- issue: Ohun tí κατειληφέναι ń tọ́ka sí
  choice: èyí
  alternative: ohun náà / ète náà
  rationale: Orísun kò sọ ohun tí a mú ní kedere; ‘èyí’ jẹ́ kí àìsọ pàtó náà dúró, ó sì yàgò fún dídín ìtumọ̀ rẹ̀ mọ́ ète ẹ̀kọ́ kan.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ìṣàmúlò ‘mo ń ...’ lẹ́ẹ̀mejì láti jẹ́ kí àwọn participle Gíríìkì méjèèjì ṣàn lọ́nà àdánidá, nígbà tí gígé ‘Ṣùgbọ́n ohun kan’ kúrú ń pa ellipsis orísun mọ́.
