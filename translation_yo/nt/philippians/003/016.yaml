  text: Only[a], let us keep in step with what we have attained.
translation:
  language: yo
  text: Kìkì, ẹ jẹ́ kí a máa rìn ní ìbámu pẹ̀lú ohun tí a ti dé tẹlẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ẹ jẹ́ kí a máa rìn nípa ìlànà kan náà” / “ẹ jẹ́ kí a máa tẹ̀lé òṣùwọ̀n kan náà.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πλήν
  choice: Síbẹ̀
  rationale: Níhìn-ín, ọ̀rọ̀ náà ń yí ọ̀rọ̀ padà sí ìṣírí tí ó ní ààlà; “Síbẹ̀” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi agbára ìyípadà náà hàn.
- source_word: εἰς ὃ
  choice: ohun tí
  rationale: Ó tọ́ka sí ipò tàbí ìwọ̀n tí a ti dé; a so ó mọ́ gbolohun “ohun tí a ti dé” ní Yorùbá àdánidá.
- source_word: ἐφθάσαμεν
  choice: a ti dé
  rationale: Ó sọ nípa ipò tí àwọn onígbàgbọ́ ti dé tẹ́lẹ̀, tí ó sì ṣì ṣe pàtàkì fún ìwà wọn nísinsìnyí.
- source_word: τῷ αὐτῷ
  choice: dọ́gba
  rationale: Fúnra rẹ̀, èdè Gíríìkì kò sọ orúkọ bí “òfin” tàbí “ìlànà”; “dọ́gba” jẹ́ kí ohun tí wọ́n fi ń díwọ̀n ìgbésẹ̀ wà ní àfojúsùn láìfi orúkọ kún un.
- source_word: στοιχεῖν
  choice: máa bá ... mú ìgbésẹ̀ wa dọ́gba
  rationale: Ó pa àwòrán rírìn ní ìlà tàbí mímú ìgbésẹ̀ bá ìwọ̀n kan mu mọ́, ó sì yé òǹkàwé Yorùbá òde òní.
theological_decisions:
- issue: Bóyá kí a fi orúkọ pàtó bí “òfin” tàbí “ìlànà” kún τῷ αὐτῷ
  choice: A kò fi orúkọ bẹ́ẹ̀ sínú ọ̀rọ̀ àkọ́kọ́; a túmọ̀ ọ́ gẹ́gẹ́ bí “ẹ jẹ́ kí a máa bá ohun tí a ti dé mú ìgbésẹ̀ wa dọ́gba.”
  alternative: “ẹ jẹ́ kí a máa rìn ní ìbámu pẹ̀lú ìlànà kan náà” tàbí “ẹ jẹ́ kí a dúró lórí òṣùwọ̀n kan náà.”
  rationale: Àkọsílẹ̀ Gíríìkì kúkúrú yìí fi ohun tí a ń tẹ̀ lé sílẹ̀ láìsọ orúkọ rẹ̀. Yíyan ọ̀nà yìí kò fi àlàyé àṣà ìtumọ̀ tàbí ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tí ó sì ṣe kedere fún òǹkàwé òde òní. “Mú ìgbésẹ̀ wa dọ́gba” pa àwòrán στοιχεῖν mọ́, nígbà tí ó yẹra fún fífi “òfin” tàbí “ìlànà” tí kò hàn gbangba nínú SBLGNT kún ọ̀rọ̀ àkọ́kọ́.
