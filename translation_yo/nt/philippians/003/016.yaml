  naturalness: “Mú ìgbésẹ̀ wa dọ́gba” kì í ṣe ọ̀nà Yorùbá tó rọrùn láti sọ pé kí ènìyàn rìn ní ìbámu pẹ̀lú ohun kan; ó lè túmọ̀ sí mímú àwọn ìgbésẹ̀ méjì dọ́gba tàbí fífi wọ́n wé ara wọn. “Máa rìn ní ìbámu pẹ̀lú” jẹ́ ìsọ̀rọ̀ Yorùbá boṣewa, ó sì pa àwòrán rírìn/ìtẹ̀lé ti στοιχεῖν mọ́.
