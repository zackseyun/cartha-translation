id: PHP.3.8
reference: Philippians 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: yo
  text: Jù bẹ́ẹ̀ lọ, mo ka ohun gbogbo sí òfò nítorí ìtayọ ìmọ̀ Kristi Jesu Olúwa mi; nítorí rẹ̀ ni mo ti fara ìpàdánù ohun gbogbo, mo sì kà wọ́n sí ìdọ̀tí[a], kí èmi lè jèrè Kristi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà lágbára; ó tún lè túmọ̀ sí ‘ẹ̀gbin,’ ‘ohun ìkọ̀sílẹ̀,’ tàbí ‘ìgbẹ́.’
    reason: lexical_alternative
  - marker: b
    text: ‘Kristi’ tún lè jẹ́ ‘Mèsáyà,’ ẹni tí a fi òróró yàn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: Jù bẹ́ẹ̀ lọ
  rationale: Gbólóhùn yìí ń mú ọ̀rọ̀ Pọ́ọ̀lù tẹ̀ síwájú pẹ̀lú ìtẹnumọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ‘what is more’ ní Yorùbá.
- source_word: ἡγοῦμαι
  choice: mo ka … sí
  rationale: ‘Ka … sí’ fi ìdájọ́ tàbí ìṣírò iye ohun kan hàn, ó sì bá àwòrán èrè àti òfò mu ní ibi méjèèjì.
- source_word: πάντα
  choice: ohun gbogbo
  rationale: Ó pa ìtúmọ̀ gbígbòòrò ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá tí ó ṣe kedere.
- source_word: ζημίαν
  choice: òfò
  rationale: ‘Òfò’ jẹ́ ọ̀rọ̀ àdánidá fún ohun tí a pàdánù, ó sì pa àwòrán ìṣírò èrè àti òfò mọ́.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: nítorí ìtayọ tí ó wà nínú mímọ
  rationale: Èyí pa ìtẹnumọ́ sí ohun tí ó ga ju gbogbo ohun mìíràn lọ mọ́, nígbà tí ‘mímọ’ ń sọ ìmọ̀ ẹni-ní-ẹni tí γνώσεως lè tọ́ka sí ní Yorùbá àdánidá.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Kristi Jesu
  rationale: ‘Kristi’ ni ọ̀rọ̀ Yorùbá tí ó ti fìdí múlẹ̀ fún Χριστός, ó sì lè dúró gẹ́gẹ́ bí oyè Mèsáyà ní àyíká yìí.
- source_word: τοῦ κυρίου μου
  choice: Olúwa mi
  rationale: Ó pa ìbáṣepọ̀ ẹni-ní-ẹni àti ìwọ̀n kristọ́lọ́jì κύριος mọ́.
- source_word: δι’ ὃν
  choice: nítorí rẹ̀
  rationale: Ó fi ẹni tí ó fa ìpàdánù náà àti ìfọkànsìn Pọ́ọ̀lù sí i hàn ní ṣókí àti ní ti ẹ̀dá Yorùbá.
- source_word: ἐζημιώθην
  choice: mo ti pàdánù
  rationale: Ó sọ ìṣẹ̀lẹ̀ ìpàdánù tí ó ti ṣẹlẹ̀, láì sọ pé ó jẹ́ ìyípadà èrò nìkan.
- source_word: σκύβαλα
  choice: ìdọ̀tí
  rationale: ‘Ìdọ̀tí’ jẹ́ ọ̀rọ̀ líle tó tó fún ohun ìkọ̀sílẹ̀ tàbí ohun ẹlẹ́gbin, tí ó sì yé òǹkàwé Yorùbá òde òní.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: kí èmi lè jèrè Kristi
  rationale: ‘Kí … lè’ fi ète ἵνα hàn, ‘jèrè’ sì ń bá àwòrán èrè àti òfò lọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός nínú ọ̀rọ̀ Pọ́ọ̀lù
  choice: Kristi
  alternative: Mèsáyà
  rationale: ‘Kristi’ jẹ́ fọ́ọ̀mù tí ó mọ́gbọ́n dání, tí ó sì wọ́pọ̀ nínú Yorùbá; àlàyé ìsàlẹ̀ fi hàn pé oyè náà túmọ̀ sí ‘Mèsáyà,’ kí ìtumọ̀ oyè náà má bàa sọnù.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àwòrán èrè–òfò àti agbára σκύβαλα mọ́.
