revisions:
- from: Jù bẹ́ẹ̀ lọ, mo ka ohun gbogbo sí òfò nítorí ìtayọ tí ó wà nínú mímọ Kristi Jesu Olúwa mi; nítorí rẹ̀ ni mo ti pàdánù ohun gbogbo, mo sì kà wọ́n sí ìdọ̀tí[a], kí èmi lè jèrè Kristi.[b]
  to: Jù bẹ́ẹ̀ lọ, mo ka ohun gbogbo sí òfò nítorí ìtayọ ìmọ̀ Kristi Jesu Olúwa mi; nítorí rẹ̀ ni mo ti fara ìpàdánù ohun gbogbo, mo sì kà wọ́n sí ìdọ̀tí[a], kí èmi lè jèrè Kristi.[b]
  rationale: 'Àtúnṣe náà ṣe mẹ́ta: ó mú ìṣètò «ìtayọ ìmọ̀» sún mọ́ Gíríìkì, ó sọ ἐζημιώθην ní ọ̀nà tí ó pa ìfẹ́hàn rẹ̀ mọ́, ó sì tún àlàyé Mèsáyà ṣe sí Yorùbá tó péye. Ìtumọ̀, ète, àti ìfojúrí líle ti σκύβαλα kò yí padà.'
  reviewer_model: gpt-5.6-terra
