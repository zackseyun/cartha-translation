review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà pa ìṣètò èrè–òfò, ète náà, àti agbára ọ̀rọ̀ σκύβαλα mọ́ dáadáa. Síbẹ̀, «mo ti pàdánù ohun gbogbo» jẹ́ ìṣe ẹni tó ń ṣiṣẹ́, nígbà tí ἐζημιώθην jẹ́ ọ̀rọ̀ ìfẹ́hàn tí ó sọ pé Pọ́ọ̀lù ti fara ìpàdánù. Àtúnṣe náà ń pa ìyàtọ̀ yìí mọ́. «Ìtayọ ìmọ̀» sì sún mọ́ τὸ ὑπερέχον τῆς γνώσεως ju «ìtayọ tí ó wà nínú mímọ» lọ.
  naturalness: Yorùbá náà jẹ́ ti ìforúkọsílẹ̀ ìbọ̀wọ̀, ó sì ní àmì ohùn tó péye ní gbogbogbòò. «Ìtayọ ìmọ̀ Kristi Jesu Olúwa mi» jẹ́ gbólóhùn kúkúrú, kedere, tí ó sì dára ju ìṣètò «ìtayọ tí ó wà nínú mímọ» lọ. «Mo ti fara ìpàdánù» jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ẹni kan ti jìyà nínú ìpàdánù.
  terminology: «Òfò» àti «jèrè» pa àwòrán ìṣirò Gíríìkì náà mọ́. «Ìdọ̀tí» ṣiṣẹ́ gẹ́gẹ́ bí ìtumọ̀ òde òní fún σκύβαλα, nígbà tí àlàyé ìsàlẹ̀ ń tọ́ka sí ìtumọ̀ líle síi. «Kristi» jẹ́ ọ̀rọ̀ tí ó ti fìdí múlẹ̀ nínú Yorùbá; àlàyé b gbọ́dọ̀ ṣàlàyé Mèsáyà ní ìtumọ̀ tí ó péye, kì í ṣe «ẹni àmì òróró.»
  issues:
  - severity: medium
    issue: «mo ti pàdánù ohun gbogbo»
    rationale: Èyí lè túmọ̀ sí pé Pọ́ọ̀lù fúnra rẹ̀ ni ó ṣẹ̀ṣẹ̀ pàdánù ohun náà. Ἐζημιώθην jẹ́ aorist passive, tí ó dára kí a fi «mo ti fara ìpàdánù» hàn, láì sọ ẹni tó fa a.
  - severity: low
    issue: «ìtayọ tí ó wà nínú mímọ»
    rationale: Ìṣètò yìí yí ìtayọ padà sí ohun tí ó wà ‘nínú’ ìmọ̀ ẹni-ní-ẹni. Gíríìkì náà sọ nípa ìtayọ/síse-gaju ti ìmọ̀ náà; «ìtayọ ìmọ̀» pa ìbáṣepọ̀ genitive mọ́ dáadáa.
  - severity: medium
    issue: 'Àlàyé ìsàlẹ̀ b: «ẹni àmì òróró»'
    rationale: Gbólóhùn náà kì í ṣe Yorùbá tó péye fún ẹni tí a fi òróró yàn. Ó yẹ kí a sọ «Ẹni tí a fi òróró yàn.»
