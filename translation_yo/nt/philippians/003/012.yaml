  source_fidelity: Àkọsílẹ̀ náà ń gbìyànjú láti pa ìtumọ̀ ìṣe-aláìṣe ti τετελείωμαι àti ìsopọ̀ καταλάβω/κατελήμφθην mọ́. Síbẹ̀, “nítorí èyí ni Kristi ... ṣe dì mí mú” yí ἐφ’ ᾧ padà sí gbólóhùn ìdí tí kò ṣe kedere, ó sì kùnà láti sọ ìbáṣepọ̀ ‘ohun tí Kristi fi di mí mú’ ní kedere. “rẹ̀” lẹ́yìn “lépa” tún sọ ohun kan ní tààrà níbi tí Gíríìkì ti fi í sílẹ̀ láìsọ. Ìtúnṣe náà pa àìlèsọ ohun náà mọ́ ní ìbẹ̀rẹ̀, ó sì fi ìtumọ̀ ète/ohun tí a fi mú-un hàn ní ìkẹyìn.
  naturalness: “Mo ti rí i gbà ná” kì í ṣe ọ̀nà Yorùbá ìgbàlódé tí ó rọrùn fún ‘I have already received/obtained it’; “mo ti gba á tẹ́lẹ̀” jẹ́ àdánidá síi. A tún rọ́pò “ná” pẹ̀lú “tẹ́lẹ̀,” èyí tí ó ń sọ ἤδη ní kedere. “Bóyá mo lè” ń sọ εἰ καί ní ìwọ̀ntúnwọ̀nsì, láì fi ìdánilójú tí ọ̀rọ̀ Gíríìkì kò ní sí i.
  terminology: “Kristi” yẹ fún Χριστοῦ nínú Yorùbá ìjọsìn àti Yorùbá ìgbàlódé. “A ti sọ mí di pípé” dá ìṣe-aláìṣe/resultative ti τετελείωμαι dúró, láì pinnu bóyá pípé náà túmọ̀ sí àìlẹ́ṣẹ̀ pátápátá. “Dì í mú / dì mí mú” ń pa ìsopọ̀ ọ̀rọ̀ Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé a ṣètò gbolohun ìkẹyìn kí ète náà lè ye ẹni tó ń ka a.
