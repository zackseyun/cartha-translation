  rationale: 'A ṣe ìtúnṣe fún ìbámu pẹ̀lú orísun àti fún Yorùbá tí ó rọrùn: “gba á tẹ́lẹ̀” rọ́pò ìsọ̀rọ̀ tí kò dára; “tẹ́lẹ̀” sọ ἤδη ní kedere ní ibi méjèèjì; a fi ohun ti διώκω sílẹ̀ bí Gíríìkì ṣe fi í sílẹ̀; “bóyá mo lè” pa ìṣọ́ra εἰ καί mọ́; a sì ṣètò apá ἐφ’ ᾧ kí ìtumọ̀ ‘ohun tí Kristi fi di mí mú’ hàn, pẹ̀lú ìsopọ̀ ‘dì mú’ tí ó wà nínú ọ̀rọ̀ Gíríìkì méjèèjì. Àwọn àmì ìsàlẹ̀ ni a tún ṣe kí wọ́n jẹ́ Yorùbá àdánidá, wọ́n sì dúró ní àwọn ibi tó yẹ.'
