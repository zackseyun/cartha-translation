id: PHP.3.12
reference: Philippians 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: yo
  text: Kì í ṣe pé mo ti gba á tẹ́lẹ̀[a], tàbí pé a ti sọ mí di pípé tẹ́lẹ̀[b]; ṣùgbọ́n mo ń lépa, bóyá mo lè dì í mú, láti di ohun tí Kristi[c] náà fi dì mí mú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo ti ní í tẹ́lẹ̀”; Gíríìkì kò sọ ohun tí a gba ní tààrà, ṣùgbọ́n àyíká ọ̀rọ̀ ló ń tọ́ka sí i.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “mo ti di ẹni pípé tẹ́lẹ̀” tàbí “a ti mú mi pé tán.”
    reason: lexical_alternative
  - marker: c
    text: 'Gíríìkì: Christos; ó tún lè túmọ̀ sí “Mèsáyà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: mo ti rí i gbà
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí gbígbà tàbí rírí ohun kan; a fi arọ́pò-orúkọ ‘i’ kún un láti tọ́ka sí ohun tí àyíká ọ̀rọ̀ ń sọ, nígbà tí Gíríìkì kò sọ ohun náà ní tààrà.
- source_word: τετελείωμαι
  choice: a ti sọ mí di pípé
  rationale: 'Èyí pa ìṣe-aláìṣe àti ipò tí ó ti yọrí sí mọ́: Pọ́ọ̀lù kò sọ pé òun ti dé ipò pípé tán.'
- source_word: διώκω
  choice: mo ń lépa rẹ̀
  rationale: ‘Lépa’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi ìsapá tí ń bá a lọ hàn.
- source_word: καταλάβω / κατελήμφθην
  choice: kí n lè dì í mú / ṣe dì mí mú
  rationale: 'Lílo gbólóhùn kan náà ní ìṣe àti ìṣe-aláìṣe pa eré-ọ̀rọ̀ Gíríìkì mọ́: Pọ́ọ̀lù ń wá láti di ohun náà mú, bí Kristi ti dì í mú.'
- source_word: ἐφ’ ᾧ
  choice: nítorí èyí ni
  rationale: Gbólóhùn Gíríìkì yìí lè tọ́ka sí ète tàbí ìdí; àṣàyàn yìí jẹ́ Yorùbá àdánidá, ó sì jẹ́ kí ète tí Kristi fi dì Pọ́ọ̀lù mú dúró láì ṣàlàyé rẹ̀ rékọjá.
- source_word: Χριστοῦ
  choice: Kristi
  rationale: ‘Kristi’ jẹ́ ìtumọ̀ tí ó wọ́pọ̀ jù lọ nínú Yorùbá fún Χριστός, bí ó tilẹ̀ jẹ́ pé orúkọ oyè náà tún túmọ̀ sí Mèsáyà.
theological_decisions:
- issue: Bóyá τετελείωμαι ń tọ́ka sí àìlẹ́ṣẹ̀ pátápátá tàbí sí píparí/de ibi àfojúsùn
  choice: a ti sọ mí di pípé
  alternative: mo ti di ẹni pípé / a ti mú mi pé tán
  rationale: Ìtumọ̀ náà pa ìṣe-aláìṣe àti ìjàfẹ́tọ̀ọ́ ipò tí ó ti pé mọ́, ṣùgbọ́n kò fi ètò ẹ̀kọ́ ìsìn kan lé e lórí tàbí pinnu ohun tí ‘pípé’ ní nínú gbogbo ìtumọ̀ rẹ̀.
- issue: Ìtumọ̀ ἐφ’ ᾧ gẹ́gẹ́ bí ète tàbí ìdí
  choice: nítorí èyí ni Kristi pẹ̀lú ṣe dì mí mú
  alternative: kí n lè di ohun tí Kristi dì mí mú fún mú
  rationale: Gíríìkì gba ìtumọ̀ ète tàbí ìdí láyè. Àṣàyàn yìí pa ìbáṣepọ̀ ọ̀rọ̀ náà mọ́ láì sọ ohun àfojúsùn náà ní kíkún ju orísun lọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Dì í mú / dì mí mú’ pa ìsopọ̀ ọ̀rọ̀ καταλαμβάνω méjèèjì mọ́. ‘Ná’ tẹnu mọ́ ἤδη, ‘pẹ̀lú’ sì dúró fún καί ní abala ìkẹyìn.
