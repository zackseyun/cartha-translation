id: PHP.3.20
reference: Philippians 3:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: yo
  text: Nítorí ipò ọmọ ìlú wa[a] wà ní ọ̀run[b]; láti ibẹ̀ ni àwa pẹ̀lú ti ń fi ìtara dúró de Olùgbàlà, Olúwa Jésù, ẹni tí í ṣe Mèsáyà[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìjọba-ìlú wa.”
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ní àwọn ọ̀run.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Olúwa Jésù Kristi.”
    reason: alternative_reading
  - marker: d
    text: Ní ọ̀nà míì, “Olúwa Jésù Mèsáyà.”
    reason: previous_rendering
lexical_decisions:
- source_word: πολίτευμα
  choice: ìjẹ́ ọmọ ìlú
  rationale: Ó pa ìtumọ̀ nípa ipò àti ìdánimọ̀ ọmọ ìlú mọ́, ó sì ṣe kedere ní Yorùbá òde òní ju lílo ọ̀rọ̀ kan tí yóò dà bí orúkọ ìjọba lọ.
- source_word: ἐν οὐρανοῖς
  choice: ní ọ̀run
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀pọ̀ ni fọ́ọ̀mù Gíríìkì, ‘ní ọ̀run’ ni ọ̀nà àdánidá tí Yorùbá fi ń sọ ibi ọ̀run.
- source_word: ὑπάρχει
  choice: wà
  rationale: ‘Wà’ sọ ìwàláàyè tàbí ipò rẹ̀ ní àsìkò yìí ní ọ̀nà Yorùbá tí ó ṣe déédéé.
- source_word: ἐξ οὗ
  choice: láti ibẹ̀
  rationale: Ó tọ́ka padà sí ọ̀run gẹ́gẹ́ bí ibi tí Olùgbàlà yóò ti wá.
- source_word: σωτῆρα
  choice: Olùgbàlà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì ru ìtumọ̀ ìgbàlà àti ìdáǹdè méjèèjì.
- source_word: ἀπεκδεχόμεθα
  choice: ń fi ìtara dúró de
  rationale: Ó mú ìdúró tí ń bá a lọ àti ìfojúsọ́nà onítara tí ọ̀rọ̀ Gíríìkì ní jáde.
- source_word: κύριον
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó yẹ fún oyè Kristi nínú àyíká yìí.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Ọ̀rọ̀ náà ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì-òróró, kì í ṣe bí orúkọ ìdílé lásán.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστόν nínú κύριον Ἰησοῦν Χριστόν
  choice: Mèsáyà nínú ọ̀rọ̀ pàtàkì
  alternative: Kristi
  rationale: Nínú ọ̀rọ̀ nípa Olùgbàlà tí a ń retí, oyè ẹni àmì-òróró ṣì hàn gbangba; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde, nígbà tí àlàyé ìsàlẹ̀ fún ‘Kristi’ pa ìtumọ̀ ìbílẹ̀ mọ́.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tí ó ní iyì, tí ó sì yé òǹkàwé òde òní. ‘Ìjẹ́ ọmọ ìlú’ pa àwòrán ìbáṣepọ̀ ọmọ ìlú mọ́ láì sọ ọ́ di ẹ̀kọ́ ìjọ kan; ‘ń fi ìtara dúró de’ sì jẹ́ àdánidá ju ìtúmọ̀ ọ̀rọ̀-sí-ọ̀rọ̀ lọ.
