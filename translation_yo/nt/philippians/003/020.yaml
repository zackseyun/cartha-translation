  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì ẹsẹ̀ náà wá: ìbámu ọmọ-ìlú àwọn onígbàgbọ́ wà ní ọ̀run, wọ́n sì ń retí Olùgbàlà láti ibẹ̀. Ṣùgbọ́n “ìjẹ́ ọmọ ìlú wa” kò rọrùn tó gẹ́gẹ́ bí ọ̀rọ̀-orúkọ ní Yorùbá, “Olùgbàlà kan” lè dín ipò-oyè σωτήρ kù sí ọ̀kan lára ọ̀pọ̀, àti ìṣọ̀kan “Jésù Mèsáyà” nílò àlàyé oyè tó dáa síi.'
  naturalness: “Ipò ọmọ ìlú wa” jẹ́ ọ̀nà Yorùbá òde òní tó ṣe kedere fún πολίτευμα nínú àyíká ìbámu ara-ilú. “Láti ibẹ̀ ni àwa pẹ̀lú ti ń fi ìtara dúró de” jẹ́ àdánidá, ó sì pa ìfojúsọ́nà tí ń tẹ̀síwájú mọ́. “Olúwa Jésù, ẹni tí í ṣe Mèsáyà” jẹ́ ìṣọ̀kan oyè tó rọrùn ju “Olúwa Jésù Mèsáyà” lọ.
  terminology: A pa “Olúwa” mọ́ fún κύριος, “Olùgbàlà” fún σωτήρ láìfi “kan” kún un, àti “Mèsáyà” fún Χριστός gẹ́gẹ́ bí oyè. A tún gbé àmì àlàyé “ìjọba-ìlú” sórí “ipò ọmọ ìlú,” ibi tí ó bá πολίτευμα mu, dípò sórí “ọ̀run.”
