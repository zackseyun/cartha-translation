  to: Nítorí ipò ọmọ ìlú wa[a] wà ní ọ̀run[b]; láti ibẹ̀ ni àwa pẹ̀lú ti ń fi ìtara dúró de Olùgbàlà, Olúwa Jésù, ẹni tí í ṣe Mèsáyà[c][d].
