  source_fidelity: Ìtumọ̀ náà mú èrò àjíǹde ‘láàárín àwọn òkú’ wá dáadáa. Síbẹ̀, ‘bí ó bá ṣeé ṣe’ ń yí εἴ πως sí ìbéèrè lórí bóyá ohun náà ṣeé ṣe, dípò ìrẹ̀lẹ̀ Pọ́ọ̀lù nípa ọ̀nà tí yóò gbà dé ibi-afẹ́ náà. Bákan náà, ‘dé ibi àjíǹde’ lè dá bíi pé àjíǹde jẹ́ ibi gidi kan.
  naturalness: ‘Bí mo bá lè dé sí àjíǹde’ jẹ́ Yorùbá boṣewa, ó sì jẹ́ àdánidá ju ‘bí ó bá ṣeé ṣe, kí n lè dé ibi àjíǹde’ lọ. Ó pa ìmọ̀lára ìfẹ́ láti dé ibi-afẹ́ náà mọ́ láìfi ‘ibi’ kún un.
  terminology: ‘Àjíǹde’ àti ‘àwọn òkú’ jẹ́ ọ̀rọ̀ tó yẹ, tó ṣe kedere, tí ó sì bá ìforúkọsílẹ̀ Bíbélì Yorùbá mu. Àlàyé ìsàlẹ̀ ojú ìwé yẹ kí ó fi ìyàtọ̀ ọ̀rọ̀ ἐξανάστασις hàn láìdá ọ̀rọ̀ àjèjì tí kò rọrùn.
