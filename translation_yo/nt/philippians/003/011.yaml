  text: if somehow I may attain to the resurrection from the dead[a].
translation:
  language: yo
  text: bí mo bá lè dé sí àjíǹde kúrò láàárín àwọn òkú[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, ní ìtumọ̀ tí ó sún mọ́ Gíríìkì: “àjíǹde jáde láti inú àwọn òkú.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: bí ó bá ṣeé ṣe
  rationale: Ó pa ìtumọ̀ onírẹ̀lẹ̀ àti ti àìdájú nípa ọ̀nà tí Pọ́ọ̀lù yóò gbà dé ibẹ̀ mọ́, láìfi dandan túmọ̀ sí pé ó ń ṣiyèméjì nípa ìlérí Ọlọ́run.
- source_word: καταντήσω
  choice: kí n lè dé ibi
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí dídé ibi-afẹ́ kan; gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ṣíṣe àṣeyọrí dé opin tí a ń lépa.
- source_word: εἰς
  choice: ibi
  rationale: A so preposition náà mọ́ ìṣe ‘dé ibi’ lọ́nà Yorùbá àdánidá, kí ìṣípò sí ibi-afẹ́ náà lè hàn kedere.
- source_word: ἐξανάστασιν
  choice: àjíǹde
  rationale: Ó túmọ̀ sí àjíǹde; yíyan ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa yàgò fún ọ̀rọ̀ àjèjì tàbí àkójọpọ̀ ọ̀rọ̀ tí kò ṣe kedere.
- source_word: τὴν ἐκ νεκρῶν
  choice: kúrò láàárín àwọn òkú
  rationale: Ó mú ἐκ (‘kúrò láàárín’) àti ọ̀pọ̀ νεκρῶν (‘àwọn òkú’) jáde ní kedere, ó sì pa àbùdá pàtó ti gbólóhùn Gíríìkì mọ́.
theological_decisions:
- issue: Bóyá ἐξανάστασις yẹ kí a túmọ̀ rẹ̀ lọ́nà tó yà á gidigidi sí ἀνάστασις, tí ó lè fi irú àjíǹde pàtàkì kan hàn.
  choice: Lo ‘àjíǹde kúrò láàárín àwọn òkú’ nínú ẹsẹ̀ pàtàkì.
  alternative: àjíǹde-jáde kúrò láàárín àwọn òkú
  rationale: Ọ̀rọ̀ Gíríìkì náà ṣàrà ọ̀tọ̀, ṣùgbọ́n kò fi dandan béèrè àkójọpọ̀ ọ̀rọ̀ tuntun ní Yorùbá. Ìtumọ̀ pàtàkì náà ṣe kedere, nígbà tí àlàyé ìsúnmọ́-ọ̀rọ̀ wà nínú àlàyé ìsàlẹ̀ ojú ìwé.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A yan ‘bí ó bá ṣeé ṣe’ láti pa ìfọ̀kànbalẹ̀ εἴ πως mọ́, a sì lo ‘kúrò láàárín àwọn òkú’ láti fi ìtẹnumọ́ ἐκ νεκρῶν hàn.
