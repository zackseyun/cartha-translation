    rationale: Ó lè túmọ̀ sí àwọn nǹkan ti ara, nígbà tí Paulu ń sọ nípa ‘ara’ gẹ́gẹ́ bí ìpìlẹ̀ ìgbẹ́kẹ̀lé ènìyàn—pẹ̀lú ìkọlà àti ipò ẹni.
