  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: yo
  text: Nítorí àwa ni ìkọlà náà[a], àwa tí ń jọ́sìn nípasẹ̀ Ẹ̀mí Ọlọ́run, tí a sì ń ṣògo nínú Mèsáyà Jésù[b], tí a kò sì gbẹ́kẹ̀ lé ara[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nínú ẹ̀dà àfọwọ́kọ mìíràn: “àwọn tí ń sin Ọlọ́run ní ẹ̀mí.”'
    reason: textual_variant
  - marker: b
    text: “Mèsáyà” ni ìtumọ̀ oyè Gíríìkì náà, Christos.
    reason: lexical_alternative
  - marker: c
    text: “Ara” níbí ń tọ́ka sí ara àti àwọn ìpìlẹ̀ ìgbẹ́kẹ̀lé ènìyàn, bí ìkọlà, ìran, tàbí ipò ẹ̀sìn.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: àwọn tí a kọ nílà
  rationale: Èyí pa ọ̀rọ̀ májẹ̀mú nípa ìkọlà mọ́, ṣùgbọ́n ó sọ ọ́ ní ọ̀nà tí ó ṣe àdánidá ní Yorùbá; àyíká ọ̀rọ̀ fi hàn pé Paulu ń pe àwọn onígbàgbọ́ ní àwọn ènìyàn ìkọlà tòótọ́.
- source_word: πνεύματι θεοῦ
  choice: nípasẹ̀ Ẹ̀mí Ọlọ́run
  rationale: Ó fi Ẹ̀mí Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí ó mú kí ìjọ́sìn náà ṣeé ṣe, ní ìbámu pẹ̀lú ẹ̀dà SBLGNT.
- source_word: λατρεύοντες
  choice: tí ń jọ́sìn
  rationale: Ọ̀rọ̀ náà túmọ̀ sí iṣẹ́ ìsìn mímọ́ tí a ń fi fún Ọlọ́run; ‘jọ́sìn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe àdánidá jù lọ níbí.
- source_word: καυχώμενοι
  choice: tí a sì ń ṣògo
  rationale: ‘Ṣògo’ pa ìtumọ̀ ìgbéraga tàbí ìyìn ara ẹni lórí ohun kan mọ́, ó sì bá ìyàtọ̀ tó wà láàárín Mèsáyà àti ohun ti ara mu.
- source_word: Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jesu
  rationale: ‘Mèsáyà’ túmọ̀ oyè Χριστός, nígbà tí ‘Jesu’ pa orúkọ ẹni náà mọ́.
- source_word: σαρκί
  choice: ohun ti ara
  rationale: Gbólóhùn yìí pa ìbáṣepọ̀ rẹ̀ pẹ̀lú ara mọ́, ó sì jẹ́ kí àyíká ṣàlàyé pé àwọn àǹfààní ènìyàn bí ìkọlà, ìran, àti ipò ni a ń tọ́ka sí.
- source_word: πεποιθότες
  choice: tí a kò sì gbẹ́kẹ̀ lé
  rationale: Ó sọ ìgbẹ́kẹ̀lé tí ó fìdí múlẹ̀ hàn ní Yorùbá àdánidá.
- source_word: γάρ
  choice: Nítorí pé
  rationale: Ó pa ìbáṣepọ̀ àlàyé tí ẹsẹ yìí ní pẹ̀lú ìkìlọ̀ tó ṣáájú mọ́.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ẹsẹ yìí
  choice: ohun ti ara, pàápàá àwọn ìdí ènìyàn àti ti ara fún ìgbẹ́kẹ̀lé
  alternative: ìwà ẹlẹ́ṣẹ̀ inú ènìyàn
  rationale: Àwọn ẹsẹ tó tẹ̀ lé mẹ́nuba ìkọlà, ìran, ìbámu pẹ̀lú òfin, àti ipò; nítorí náà, ọ̀rọ̀ náà tọ́ka ní pàtàkì sí àwọn ohun tí ènìyàn lè gbẹ́kẹ̀ lé nítorí ara tàbí ipò rẹ̀.
- issue: Agbára πνεύματι θεοῦ
  choice: Ẹ̀mí Ọlọ́run ni ọ̀nà tàbí agbára ìjọ́sìn
  alternative: ẹ̀mí ènìyàn tàbí jíjọ́sìn Ọlọ́run ní ti ẹ̀mí
  rationale: Ẹ̀dà SBLGNT ní θεοῦ, èyí tí ó tọ́ka sí Ẹ̀mí Ọlọ́run lọ́nà tó ṣeé ṣe jù lọ, bó tilẹ̀ jẹ́ pé ẹ̀dà mìíràn ló yàtọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tí ó bá ṣe àdánidá. A lo ‘àwọn tí a kọ nílà’ dípò àkójọpọ̀ orúkọ aláìmọ́gbọ́n ‘ìkọlà’ fún àwọn ènìyàn, kí gbolohun náà lè ṣe kedere sí òǹkàwé Yorùbá lasán.
