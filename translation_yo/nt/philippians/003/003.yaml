    rationale: Ìyàtọ̀ náà jẹ́ θεῷ λατρεύοντες (‘àwọn tí ń sin Ọlọ́run’) dípò πνεύματι θεοῦ (‘nípasẹ̀ Ẹ̀mí Ọlọ́run’); ó yẹ kí àkọsílẹ̀ náà sọ èyí ní kedere.
