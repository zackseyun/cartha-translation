  verdict: revise
  source_fidelity: Àwọn ìpín gbolohun náà ń tẹ̀lé Gíríìkì dáadáa, ṣùgbọ́n “àwọn tí a kọ nílà” yí περιτομή (‘ìkọlà’) padà sí àpèjúwe àwọn ènìyàn, ó sì ní ìṣòro ìkọ̀wé (‘ní ilà’). “Ohun ti ara” tún mú σάρξ dà bí àwọn nǹkan ti ara dípò ‘ara’ gẹ́gẹ́ bí ìpìlẹ̀ ìgbẹ́kẹ̀lé ènìyàn. Àtúnṣe náà pa ọ̀rọ̀ májẹ̀mú àti ìfaradà àkíyèsí Paulu mọ́.
  naturalness: “Àwa ni ìkọlà náà” jẹ́ ọ̀nà ìtumọ̀ tó sún mọ́ ọ̀rọ̀ Paulu, tí ó sì bójú mu nínú ìforíbalẹ̀ ẹ̀sìn Yorùbá. “A kò gbẹ́kẹ̀ lé ara” jẹ́ àdánidá, ó sì jẹ́ kí àlàyé àyíká ṣàlàyé ìtumọ̀ àpẹẹrẹ rẹ̀. A tún ṣe àtúnṣe sí àmì ohùn nínú Jésù.
  terminology: A pa ìkọlà, Ẹ̀mí Ọlọ́run, Mèsáyà, àti ara mọ́ gẹ́gẹ́ bí àwọn ọ̀rọ̀ pàtàkì. Àkọsílẹ̀ Mèsáyà ti jẹ́ kí ó ṣe kedere pé ó túmọ̀ Christos, kì í ṣe pé Christos fúnra rẹ̀ ni ‘oyè Gíríìkì’. Àkọsílẹ̀ ẹ̀dà àfọwọ́kọ náà ti yí padà láti ṣàfihàn iyàtọ̀ ọ̀rọ̀ gangan, kì í ṣe ìtumọ̀ àṣàyàn lásán.
  issues:
