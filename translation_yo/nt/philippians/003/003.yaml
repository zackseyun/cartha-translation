    rationale: Ọ̀rọ̀ Gíríìkì náà sọ pé “àwa ni ìkọlà,” nípa ìdánimọ̀ àwọn ènìyàn májẹ̀mú; kò kan sọ pé àwọn ènìyàn kan ni a kọ ní ilà. Ìtumọ̀ yìí tún ní àṣìṣe ìkọ̀wé nítorí ‘nílà’ dípò ‘ní ilà’.
  - severity: medium
