  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: yo
  text: ní ìkọlà ní ọjọ́ kẹjọ, ọmọ ìran Ísírẹ́lì, ti ẹ̀yà Bẹ́ńjámínì, Hébérù tí ó wá láti inú àwọn Hébérù[a]; ní ti òfin, Farisí ni mí;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Hébérù tí a bí láti inú àwọn Hébérù,” èyí tí ó tẹnumọ́ ìran ìbí àti ìdánimọ̀ Hébérù ti Pọ́ọ̀lù.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: a kọ mí ní ilà ní ọjọ́ kẹjọ
  rationale: Èyí sọ gbólóhùn Gíríìkì tí ó há pọ̀ di Yorùbá àdánidá, ó sì pa àmì májẹ̀mú Júù àti ọjọ́ pàtó náà mọ́.
- source_word: ἐκ γένους Ἰσραήλ
  choice: mo jẹ́ láti inú ìran Ísírẹ́lì
  rationale: “Ìran” fi hàn pé Pọ́ọ̀lù ń sọ̀rọ̀ nípa ìran ìbí àti ìdánimọ̀ rẹ̀ gẹ́gẹ́ bí ọmọ Ísírẹ́lì, kì í ṣe ibi tí ó ń gbé nìkan.
- source_word: φυλῆς Βενιαμίν
  choice: láti ẹ̀yà Bẹ́ńjámínì
  rationale: “Ẹ̀yà” ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún ìpín ìran Ísírẹ́lì tí φυλή ń tọ́ka sí níhìn-ín.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: Hébérù láti inú àwọn Hébérù
  rationale: Ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó pa ìtẹnumọ́ ìran àti ìdánimọ̀ Hébérù mọ́ láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: κατὰ νόμον
  choice: ní ti òfin
  rationale: Èyí jẹ́ ọ̀nà Yorùbá ṣókí àti àdánidá láti fi hàn pé òfin ni abala tàbí òṣùwọ̀n tí ọ̀rọ̀ tó tẹ̀ lé e dá lé.
- source_word: Φαρισαῖος
  choice: Farisí
  rationale: Èyí ni orúkọ Yorùbá tí a mọ̀ fún ọmọ ẹgbẹ́ ìsìn Júù náà, ó sì yẹ fún àyíká Bíbélì.
theological_decisions: []
translation_notes:
  register: A lo Yorùbá àpapọ̀ tí ó ní àmì ohùn ní kíkún, ní ọ̀nà ọ̀wọ̀, ṣókí, tí ó sì ṣeé lóye. A mú fọ́ọ̀mù ẹni àkọ́kọ́ jáde nítorí pé àwọn gbólóhùn Gíríìkì náà jẹ́ àkójọ àpèjúwe tí ó ń tẹ̀ síwájú láti inú ọ̀rọ̀ Pọ́ọ̀lù ní ẹsẹ tó ṣáájú; àmì olójú méjì àti àmì olójú kan ń pa ìrísí àkójọ náà mọ́.
