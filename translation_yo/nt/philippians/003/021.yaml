    rationale: “Pàápàá” ń túmọ̀ καί níbí gẹ́gẹ́ bí ìtẹnumọ́; fífi í ṣáájú “fi ohun gbogbo sábẹ́ ara rẹ̀” mú ìtẹnumọ́ náà hàn kedere.
  - severity: low
    issue: “sọ ... di èyí tí ó ní ìrí kan náà”
    rationale: Ó lè dà bí pé ohun mìíràn ni a ń tọ́ka sí pẹlu “èyí.” Ìṣètò tí a tún ṣe ń so ara wa mọ́ ara ògo rẹ̀ kedere.
