- from: ẹni tí yóò sọ ara wa tí ó wà ní ipò ìrẹ̀lẹ̀ di èyí tí ó ní ìrí kan náà pẹ̀lú ara ògo rẹ̀,[a][b] nípasẹ̀ agbára iṣẹ́ tí ó fi lè tẹ ohun gbogbo sábẹ́ ara rẹ̀ pàápàá.[c]
  to: Ẹni tí yóò yí ara wa tí ó wà ní ipò ìrẹ̀lẹ̀ padà kí ó sì jẹ́ kí ó ní ìrísí kan náà pẹ̀lú ara ògo rẹ̀,[a][b] ní ìbámu pẹ̀lú ìṣiṣẹ́ agbára tí ó fi lè pàápàá fi ohun gbogbo sábẹ́ ara rẹ̀.[c]
