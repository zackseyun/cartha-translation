id: PHP.3.21
reference: Philippians 3:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: yo
  text: Ẹni tí yóò yí ara wa tí ó wà ní ipò ìrẹ̀lẹ̀ padà kí ó sì jẹ́ kí ó ní ìrísí kan náà pẹ̀lú ara ògo rẹ̀,[a][b] ní ìbámu pẹ̀lú ìṣiṣẹ́ agbára tí ó fi lè pàápàá fi ohun gbogbo sábẹ́ ara rẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní tààrà: “ara ìrẹ̀lẹ̀ wa” tàbí “ara ìtìjú wa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààrà: “ara ògo rẹ̀.”'
    reason: lexical_alternative
  - marker: c
    text: 'A tún lè túmọ̀ rẹ̀ pé: “gẹ́gẹ́ bí ìṣiṣẹ́ agbára tí ó fi lè fi ohun gbogbo sábẹ́ ara rẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: yóò sọ ... di
  rationale: Èyí fi ìyípadà gidi nínú ìrísí tàbí ipò hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣe ọjọ́ iwájú.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: ara wa tí ó wà ní ipò ìrẹ̀lẹ̀
  rationale: Ó mú èrò ara tí ipò ìrẹ̀lẹ̀ tàbí ìtìjú ń ṣàpèjúwe jáde ní Yorùbá tí ó ṣe kedere, láì sọ pé ara fúnra rẹ̀ kò níyelórí.
- source_word: σύμμορφον
  choice: èyí tí ó ní ìrí kan náà pẹ̀lú
  rationale: Ó pa ìbámu tó lágbára nínú ọ̀rọ̀ Gíríìkì mọ́ ju gbólóhùn gbogbogbò bí ‘bí’ lọ, ní èdè Yorùbá àdánidá.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: ara ògo rẹ̀
  rationale: Ìtumọ̀ yìí tẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì, ó sì fi ara tí ògo ń ṣàpèjúwe hàn.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: nípasẹ̀ agbára iṣẹ́
  rationale: ‘Agbára iṣẹ́’ mú èrò agbára tí ń ṣiṣẹ́ lọ́nà mímúnáṣẹ jáde, nígbà tí ‘nípasẹ̀’ sọ ìbáṣepọ̀ rẹ̀ pẹ̀lú ìyípadà náà di mímọ́.
- source_word: τοῦ δύνασθαι αὐτὸν
  choice: tí ó fi lè
  rationale: Ó sọ agbára ìṣe Kristi ní Yorùbá ṣókí tí ó sì bá ìtumọ̀ infinitive náà mu.
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: tẹ ohun gbogbo sábẹ́ ara rẹ̀
  rationale: Ó pa ipa ọ̀rọ̀ ‘fi sábẹ́ àṣẹ’ àti ààlà gbogbo ohun mọ́, láì dín gbólóhùn náà kù.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ipò ìrẹ̀lẹ̀ ara nísinsìnyí àti ògo ọjọ́ iwájú
  choice: A sọ pé Kristi yóò yí ara àwọn onígbàgbọ́ tí ó wà ní ipò ìrẹ̀lẹ̀ padà sí ìrí kan náà pẹ̀lú ara ògo rẹ̀.
  alternative: A lè fi ọ̀rọ̀ ‘àjíǹde’ kun un tààrà.
  rationale: Ẹsẹ̀ náà sọ ní kedere nípa ìyípadà ara àti ìbámu rẹ̀ pẹ̀lú ara ògo Kristi, ṣùgbọ́n kò ṣàlàyé ọ̀nà àjíǹde níbí; nítorí náà a kò fi ẹ̀kọ́ àfikún sínú rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ara ògo rẹ̀’ láti pa àwòrán genitive Gíríìkì mọ́, a sì yẹra fún fífi èdè ẹ̀kọ́ ìsìn tí kò sí nínú ẹsẹ̀ náà kun un.
