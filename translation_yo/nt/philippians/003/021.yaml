review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ pàtàkì ẹsẹ̀ náà mọ́: ìyípadà ara ní ọjọ́ iwájú, ìbámu pẹ̀lú ara ògo Kristi, àti agbára rẹ̀ láti fi ohun gbogbo sábẹ́ ara rẹ̀. Síbẹ̀, “nípasẹ̀ agbára iṣẹ́” kò sọ κατὰ τὴν ἐνέργειαν dáadáa; ó yẹ kí a fi ìbámu pẹ̀lú ìṣiṣẹ́/agbára tí ń ṣiṣẹ́ hàn. “pàápàá” tún yẹ kí ó wà ní ibi tí ó ń tẹnumọ́ ìgbésẹ̀ fífi ohun gbogbo sábẹ́ rẹ̀.'
  naturalness: “Ẹni tí yóò yí ... padà kí ó sì jẹ́ kí ó ní ìrísí kan náà pẹ̀lú ...” jẹ́ Yorùbá boṣewa, ó sì hàn gbangba ju “sọ ... di èyí tí ó ní ìrí kan náà” lọ. “ìrísí” bá ọ̀rọ̀ σύμμορφον mu dáadáa ní àyíká yìí.
  terminology: A pa “ara ìrẹ̀lẹ̀ wa” mọ́ fún τὸ σῶμα τῆς ταπεινώσεως ἡμῶν, “ara ògo rẹ̀” fún τῷ σώματι τῆς δόξης αὐτοῦ, àti “fi ohun gbogbo sábẹ́ ara rẹ̀” fún ὑποτάξαι ἑαυτῷ τὰ πάντα. A kò fi ẹ̀kọ́ àfikún nípa àjíǹde tàbí ìjọba sínú ọ̀rọ̀ náà.
