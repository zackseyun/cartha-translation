id: PHP.3.10
reference: Philippians 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: yo
  text: láti mọ̀ ọ́n, àti agbára àjíǹde rẹ̀, àti ìpín nínú àwọn ìjìyà rẹ̀[a], nígbà tí a ń sọ mí di ẹni tí ó dà bíi rẹ̀ nínú ikú rẹ̀[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìbáṣepọ̀ nínú àwọn ìjìyà rẹ̀” tàbí “ìkópa nínú àwọn ìjìyà rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “nígbà tí a ń mú mi dà bíi rẹ̀ nínú ikú rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι αὐτόν
  choice: láti mọ̀ ọ́n
  rationale: Ó pa ìtumọ̀ ète inú infinitive mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó lè ní ìtumọ̀ mímọ ẹni nípasẹ̀ ìbáṣepọ̀ àti ìrírí.
- source_word: δύναμιν
  choice: agbára
  rationale: “Agbára” ni ìtumọ̀ tààrà, tí ó sì ṣe kedere fún ipa tí ó hàn nínú àjíǹde Kristi.
- source_word: ἀναστάσεως
  choice: àjíǹde
  rationale: “Àjíǹde” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún dídìde kúrò nínú òkú.
- source_word: κοινωνίαν
  choice: láti ní ìpín nínú
  rationale: Gbólóhùn yìí fi ìkópa gidi hàn, kì í ṣe ìbákẹ́dùn tàbí ìbáṣepọ̀ lásán; ó tún jẹ́ Yorùbá òde òní tí ó ṣe kedere.
- source_word: παθημάτων
  choice: àwọn ìjìyà
  rationale: Ó túmọ̀ πάθημα ní tààrà, ó sì bá ọ̀pọ̀ nǹkan orúkọ Gíríìkì mu.
- source_word: συμμορφιζόμενος
  choice: bí a ti ń sọ mí di ẹni tí ó jọ ọ́
  rationale: Ìlò “ń” pa ìṣe tí ń lọ lọ́wọ́ mọ́; ìṣètò aláìlórúkọ “a ti ń sọ mí di” tún fi ààyè sílẹ̀ fún ipa àìṣe tààrà participle náà láìsọ ẹni tó ń ṣe é.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: nínú ikú rẹ̀
  rationale: Dative náà tọ́ka sí àwòrán tàbí àpẹẹrẹ tí a ń mú ẹni bá; “nínú ikú rẹ̀” jẹ́ Yorùbá tó ṣe kedere lẹ́yìn “jọ ọ́,” láìdín ìtumọ̀ rẹ̀ kù.
theological_decisions:
- issue: Ìtumọ̀ κοινωνίαν παθημάτων αὐτοῦ
  choice: Ìkópa gidi nínú àwọn ìjìyà Kristi
  alternative: Ìdàpọ̀ tàbí ìbáṣepọ̀ pẹ̀lú àwọn ìjìyà rẹ̀ ní ọ̀nà tí kò fi dandan túmọ̀ sí ìkópa
  rationale: κοινωνία pẹ̀lú genitive yìí lè tọ́ka sí jíjẹ́ alájọpín; “ní ìpín nínú” pa agbára ìkópa náà mọ́ láìfi ẹ̀kọ́ ìjọ kan lé e lórí.
- issue: Agbára ohùn συμμορφιζόμενος
  choice: Ìlànà tí ń lọ lọ́wọ́, nínú èyí tí a ń sọ Pọ́ọ̀lù di ẹni tí ó jọ Kristi nínú ikú rẹ̀
  alternative: Pọ́ọ̀lù ń sọ ara rẹ̀ di ẹni tí ó jọ Kristi
  rationale: Present participle fi ìṣe tí ń lọ lọ́wọ́ hàn, passive form náà sì yẹ kí a má ṣe yí sí ìṣe ara ẹni nìkan.
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọ “ọ́n” lẹ́yìn “mọ̀” àti “ọ́” lẹ́yìn “jọ” tẹ̀lé ìlànà ìró Yorùbá. A lo “Kristi” nínú àlàyé nìkan; ẹsẹ náà pa àwọn arọ́pò-orúkọ Gíríìkì mọ́.
