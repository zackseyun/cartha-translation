id: PHP.3.4
reference: Philippians 3:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: yo
  text: Bí ó tilẹ̀ jẹ́ pé èmi fúnra mi ní ìgbẹ́kẹ̀lé, àní nínú ara. Bí ẹnikẹ́ni mìíràn bá rò pé òun ní ìgbẹ́kẹ̀lé nínú ara[a], èmi ní ìgbẹ́kẹ̀lé bẹ́ẹ̀ ju ẹni náà lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “ìgbẹ́kẹ̀lé nínú àwọn ìwé-ẹ̀rí ènìyàn tàbí ipò wọn ní ti òde.” Ní Gíríìkì: “nínú ara.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Bí ó tilẹ̀ jẹ́ pé
  rationale: Ó fi ìyọ̀ǹda tó lágbára hàn ní ìbẹ̀rẹ̀ gbólóhùn, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti túmọ̀ ‘although/though.’
- source_word: ἐγὼ ἔχων πεποίθησιν
  choice: èmi fúnra mi ní ìdí láti gbẹ́kẹ̀ lé
  rationale: A mú àfihàn ẹni náà ‘ἐγώ’ jáde pẹ̀lú ‘èmi fúnra mi’; ‘ní ìdí láti gbẹ́kẹ̀ lé’ sọ ìtumọ̀ πεποίθησις ní àyíká yìí ní kedere ju ọ̀rọ̀ àfojúsùn lasan lọ.
- source_word: ἐν σαρκί
  choice: ohun ti ara
  rationale: Ó pa àwòrán ‘ara’ mọ́, ṣùgbọ́n ó jẹ́ kí Yorùbá mọ̀ pé àwọn ohun tàbí ipò ti ara ènìyàn ni a ń tọ́ka sí, kì í ṣe ‘ẹ̀dá ẹlẹ́ṣẹ̀.’
- source_word: δοκεῖ
  choice: bá rò pé
  rationale: ‘Rò pé’ jẹ́ ọ̀nà àdánidá fún ìtumọ̀ pé ẹnì kan ka ara rẹ̀ sí ẹni tí ó ní irú ìgbẹ́kẹ̀lé bẹ́ẹ̀.
- source_word: ἄλλος
  choice: mìíràn
  rationale: Pẹ̀lú ẹnikẹ́ni, ó dá ìfiwéra ‘ẹnikẹ́ni mìíràn’ sílẹ̀ ní kedere.
- source_word: πεποιθέναι
  choice: ní ìdí láti gbẹ́kẹ̀ lé
  rationale: Ó ṣàfihàn ipò ìgbẹ́kẹ̀lé tí ó fìdí múlẹ̀, àti pé àyíká ẹsẹ tó tẹ̀ lé ń sọ àwọn ìwé-ẹ̀rí ènìyàn tí a lè fi ṣe ìdí ìgbẹ́kẹ̀lé.
- source_word: μᾶλλον
  choice: ní ju tirẹ̀ lọ
  rationale: 'Ó pa ìfiwéra Pọ́ọ̀lù mọ́ ní Yorùbá àdánidá: bí ẹlòmíràn bá ní ìdí bẹ́ẹ̀, tirẹ̀ pọ̀ ju ti ẹni náà lọ.'
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú Fílípì 3:4
  choice: ohun ti ara
  alternative: ẹ̀rí tàbí ipò ènìyàn ní ti òde; ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: Àwọn ẹsẹ 5–6 tọ́ka sí ìkọlà, ìran, ìbáṣepọ̀ pẹ̀lú òfin, àti ìtara. Nítorí náà, ọ̀rọ̀ náà ń tọ́ka sí àwọn ohun ti ènìyàn jẹ́ tàbí ṣe ní ti òde gẹ́gẹ́ bí ìdí ìgbẹ́kẹ̀lé, kì í ṣe ní pàtàkì sí ìwà ẹlẹ́ṣẹ̀. A pa ‘ara’ mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé ìtumọ̀ àyíká rẹ̀ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ tó bójú mu tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ohun ti ara’ láti pa àwòrán Gíríìkì mọ́ láì mú kó dà bí ẹni pé ‘ẹ̀dá ẹlẹ́ṣẹ̀’ ni ọ̀rọ̀ náà túmọ̀ sí níbí.
