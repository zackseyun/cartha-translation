  to: Bí ó tilẹ̀ jẹ́ pé èmi fúnra mi ní ìgbẹ́kẹ̀lé, àní nínú ara. Bí ẹnikẹ́ni mìíràn bá rò pé òun ní ìgbẹ́kẹ̀lé nínú ara[a], èmi ní ìgbẹ́kẹ̀lé bẹ́ẹ̀ ju ẹni náà lọ.
