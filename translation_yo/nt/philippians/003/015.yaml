id: PHP.3.15
reference: Philippians 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: yo
  text: Nítorí náà, gbogbo àwa tí a dàgbà dénú[a], ẹ jẹ́ kí a ronú báyìí[b]; bí ẹ bá sì ronú lọ́nà mìíràn nípa ohunkóhun, Ọlọ́run yóò tún fi èyí hàn yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí a pé.” Ọ̀rọ̀ Gíríìkì τέλειοι lè túmọ̀ sí “pé,” ṣùgbọ́n níhìn-ín ó ṣeé ṣe kó ń tọ́ka sí àwọn tí wọ́n dàgbà dénú nípa tẹ̀mí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kí a ní èrò yìí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ ìparí tàbí ìyọrísí ohun tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ sọ.
- source_word: ὅσοι
  choice: gbogbo àwa tí
  rationale: Ó pa ìtumọ̀ àpapọ̀ àti àkópọ̀ ẹni àkọ́kọ́ mọ́, ní ìbámu pẹ̀lú φρονῶμεν.
- source_word: τέλειοι
  choice: tí a dàgbà dénú
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó tọ́ka sí ìdàgbàsókè àti ìmúrasílẹ̀ nípa tẹ̀mí, láìpa ìtumọ̀ míì ti ‘pé’ rẹ́.
- source_word: τοῦτο φρονῶμεν
  choice: ẹ jẹ́ kí a ní èrò yìí
  rationale: Ó sọ ìṣírí tí ọ̀rọ̀-ìṣe subjunctive náà ní, ó sì fi hàn pé τοῦτο ń tọ́ka sí èrò tàbí ìwà-ọkàn tí a ṣàpèjúwe ṣáájú.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: bí ẹ bá sì ní èrò mìíràn nípa ohunkóhun
  rationale: Ó pa ipò àídájú, ààyè gbígbòòrò ti τι, àti ìyàtọ̀ nínú èrò mọ́.
- source_word: ἀποκαλύψει
  choice: yóò ... fi ... hàn
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣípayá tàbí mímú ohun kan di mímọ̀.
theological_decisions:
- issue: Ìtumọ̀ τέλειοι nínú ìṣírí Pọ́ọ̀lù
  choice: tí a dàgbà dénú
  alternative: tí a pé
  rationale: Àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù ṣì ń tẹ̀ síwájú, nítorí náà ‘dàgbà dénú’ yẹra fún fífi ìwà àìlẹ́ṣẹ̀ kún ọ̀rọ̀ náà; àkọsílẹ̀ ìsàlẹ̀ sì pa ìtumọ̀ ‘pé’ mọ́.
- issue: Ẹni tí φρονῶμεν àti φρονεῖτε ń tọ́ka sí
  choice: ‘ẹ jẹ́ kí a’ lẹ́yìn náà ‘ẹ bá’
  alternative: Lílo ẹni kan náà jálẹ̀
  rationale: Ìtumọ̀ náà pa ìyípadà Gíríìkì láti ẹni àkọ́kọ́ ọ̀pọ̀ sí ẹni kejì ọ̀pọ̀ mọ́, láìṣàlàyé ìdí ìyípadà náà ju ohun tí ẹsẹ̀ sọ lọ.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘dàgbà dénú’ dípò ọ̀rọ̀ ẹ̀kọ́ ìsìn tó le, a sì pa ìyípadà láti ‘àwa’ sí ‘ẹ̀yin’ nínú orísun Gíríìkì mọ́.
