id: PHP.3.1
reference: Philippians 3:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: yo
  text: Ní ìkẹyìn[a], ẹ̀yin arákùnrin mi[b], ẹ máa yọ̀ nínú Olúwa. Kí n kọ àwọn ohun kan náà sí yín kò jẹ́ ìnira fún mi[c], ó sì jẹ́ ààbò fún yín[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Ní ti ohun tó kù” tàbí “Láti ìsinsìnyí lọ.”
    reason: lexical_alternative
  - marker: b
    text: “Arákùnrin” níbí ń tọ́ka sí gbogbo ìjọ; ìyẹn ni pé, “arákùnrin àti arábìnrin.”
    reason: cultural_note
  - marker: c
    text: Tàbí “kì í jẹ́ ẹrù fún mi” tàbí “kì í sú mi.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí “ó jẹ́ ohun ìdáàbòbò fún yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Ní ìkẹyìn
  rationale: Ó jẹ́ àmì ìyípadà nínú ọ̀rọ̀. ‘Ní ìkẹyìn’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, bí ó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí ‘Ní ti ohun tó kù’ tàbí ‘Láti ìsinsìnyí lọ.’
- source_word: ἀδελφοί μου
  choice: ẹ̀yin arákùnrin mi
  rationale: Èyí pa àpẹẹrẹ akọ ọ̀pọ̀ nínú Gíríìkì mọ́; àmọ́ nínú àyíká yìí, ó ń bá gbogbo ìjọ sọ̀rọ̀.
- source_word: χαίρετε
  choice: ẹ máa yọ̀
  rationale: Ọ̀rọ̀ àṣẹ fún ọ̀pọ̀ ènìyàn ni; ‘ẹ máa yọ̀’ fi ìṣírí sí ayọ̀ tó ń bá a lọ hàn ní Yorùbá àdánidá.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: A pa gbólóhùn ìbáṣepọ̀ náà mọ́ láì pinnu bóyá ìṣọ̀kan pẹ̀lú Olúwa tàbí ìgbẹ́kẹ̀lé e ni Pọ́ọ̀lù tẹnumọ́.
- source_word: τὰ αὐτά
  choice: ohun kan náà
  rationale: Ìtumọ̀ yìí jẹ́ kó ṣí sílẹ̀ ohun tí Pọ́ọ̀lù ń tọ́ka sí, gẹ́gẹ́ bí Gíríìkì ṣe rí.
- source_word: γράφειν
  choice: Kí n kọ
  rationale: Ìṣètò yìí tú infinitive Gíríìkì sí Yorùbá àdánidá nínú gbólóhùn náà.
- source_word: οὐκ ὀκνηρόν
  choice: kì í ṣòro fún mi
  rationale: Ó sọ pé àtúnkọ ọ̀rọ̀ náà kì í ṣe ẹrù tàbí ohun tó ń dá Pọ́ọ̀lù dúró, láì dín ìtumọ̀ rẹ̀ kù sí àárẹ̀ ọkàn nìkan.
- source_word: ἀσφαλές
  choice: ó sì jẹ́ ààbò fún yín
  rationale: ‘Ààbò’ sọ ìtumọ̀ ìdáàbòbò tàbí ìdúróṣinṣin di mímọ́ ní Yorùbá, ó sì bá ipa ajẹtífù Gíríìkì mu.
theological_decisions:
- issue: Ọ̀rọ̀ ìkíni akọ sí gbogbo ìjọ
  choice: ẹ̀yin arákùnrin mi
  alternative: ẹ̀yin arákùnrin àti arábìnrin mi
  rationale: Gíríìkì jẹ́ akọ ọ̀pọ̀, nítorí náà a pa irú rẹ̀ mọ́ nínú ọ̀rọ̀ àkọ́kọ́; àlàyé ìsàlẹ̀ ojú ìwé sọ pé gbogbo ìjọ, títí kan àwọn obìnrin, ló wà nínú àdírẹ́sì náà.
- issue: Ìtumọ̀ àtúnkọ Pọ́ọ̀lù gẹ́gẹ́ bí ohun ìdáàbòbò
  choice: ó sì jẹ́ ààbò fún yín
  alternative: ó sì dá yín lójú ààbò
  rationale: A pa ìtumọ̀ tààrà ti ἀσφαλές mọ́, láì ṣàfikún irú ewu pàtó kan tàbí ọ̀nà tí ọ̀rọ̀ náà fi ń dáàbò bo wọn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún, ní èdè òde òní tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘ẹ’ fún àṣẹ ọ̀pọ̀ àti ‘yín’ fún àwọn olùgbọ́ ọ̀pọ̀; a pa àìdánilójú àwọn gbólóhùn Gíríìkì mọ́ nípasẹ̀ àlàyé ìsàlẹ̀ ojú ìwé.
