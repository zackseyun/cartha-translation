id: PHP.3.18
reference: Philippians 3:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: yo
  text: Nítorí ọ̀pọ̀ ènìyàn ń rìn gẹ́gẹ́ bí ọ̀tá àgbélébùú Mèsáyà[a]—àwọn tí mo máa ń sọ fún yín nípa wọn léraléra, tí mo sì ń sọ fún yín nípa wọn báyìí pẹ̀lú ẹkún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: Àṣàyàn ìtumọ̀ mìíràn fún Χριστοῦ, èyí tí a lè túmọ̀ sí oyè “Mèsáyà” tàbí fi sílẹ̀ ní ọ̀nà ìbílẹ̀ bí “Kristi.”
lexical_decisions:
- source_word: πολλοὶ
  choice: ọ̀pọ̀ ènìyàn
  rationale: Ọ̀rọ̀ náà dúró gẹ́gẹ́ bí orúkọ fún ọ̀pọ̀ ènìyàn; yíyan yìí ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa agbára àsopọ̀ tí ń fi ìdí ọ̀rọ̀ ìṣáájú múlẹ̀ mọ́.
- source_word: περιπατοῦσιν
  choice: ń rìn
  rationale: Ó pa àwòrán ìrìn tí Paulu lò fún ìwà àti ọ̀nà ìgbésí ayé mọ́, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ rẹ̀ níbí kọjá ìrìn ti ara.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: Mo ti sọ fún yín nípa wọn léraléra
  rationale: “Léraléra” fi ìṣe tí ó máa ń ṣẹlẹ̀ ní ìgbà àtijọ́ hàn, gẹ́gẹ́ bí πολλάκις àti imperfect ἔλεγον ṣe ń tọ́ka sí.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: nísinsin yìí sì, mo tún ń sọ ọ́ pẹ̀lú ẹkún
  rationale: Ó fi ìṣe sísọ tí ń lọ lọ́wọ́ àti ẹkún Paulu hàn ní èdè Yorùbá tí ó ṣe déédéé.
- source_word: ἐχθροὺς
  choice: ọ̀tá
  rationale: “Ọ̀tá” ni ọ̀rọ̀ Yorùbá tààrà fún àwọn tí wọ́n tako ohun kan, ó sì pa líle ọ̀rọ̀ Gíríìkì mọ́.
- source_word: σταυροῦ
  choice: àgbélébùú
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a ti fìdí rẹ̀ múlẹ̀ fún σταυρός, pẹ̀lú ìtọ́ka sí ikú Mèsáyà àti ìtumọ̀ rẹ̀.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Ní àkójọpọ̀ ọ̀rọ̀ yìí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” fi ìtumọ̀ oyè náà hàn dípò lílo rẹ̀ bí orúkọ lásán.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú gbólóhùn Paulu tí ìṣe ìtumọ̀ ìbílẹ̀ sábà máa ń pè ní “Kristi”
  choice: Mèsáyà
  alternative: Kristi
  rationale: Gbólóhùn náà kò fi dandan mú kí Χριστός jẹ́ bí orúkọ ẹni; yíyan “Mèsáyà” pa iṣẹ́ rẹ̀ gẹ́gẹ́ bí oyè ẹni àmì òróró Ọlọ́run mọ́. Àṣàyàn ìbílẹ̀ wà nínú àlàyé ìsàlẹ̀.
- issue: Ìbáṣepọ̀ àwọn “ọ̀pọ̀ ènìyàn” pẹ̀lú “ọ̀tá àgbélébùú”
  choice: ń rìn gẹ́gẹ́ bí ọ̀tá
  alternative: wọ́n jẹ́ ọ̀tá
  rationale: Accusative τοὺς ἐχθρούς ń ṣàlàyé àwọn ẹni tí relative clause tọ́ka sí. Ìtumọ̀ yìí sọ ìbáṣepọ̀ náà di mímọ́ láì dín àwòrán περιπατοῦσιν kù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán “rìn” mọ́, ṣùgbọ́n a tún gbé àwọn apá gbólóhùn kalẹ̀ ní ọ̀nà tí Yorùbá fi ń sọ̀rọ̀ lọ́nà àdánidá; “pẹ̀lú ẹkún” fi ìmọ̀lára Paulu hàn láì sọ ọ́ di àsọdùn.
