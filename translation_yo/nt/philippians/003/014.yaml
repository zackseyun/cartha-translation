id: PHP.3.14
reference: Philippians 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ σκοπὸν διώκω ⸀εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: yo
  text: Mo ń tẹ̀ síwájú sí ibi àfojúsùn fún èrè ìpè sókè ti Ọlọ́run[a] nínú Mèsáyà Jésù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìpè ọ̀run” tàbí “ìpè láti òkè.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní Gíríìkì: “nínú Kristi Jésù”; a lò “Mèsáyà Jésù” nítorí Χριστός jẹ́ oyè níhìn-ín.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: sí ibi àfojúsùn
  rationale: Ó fi ìtọ́sọ́nà sí ibi tí a ń lépa hàn ní àwòrán eré-ìje, dípò kí ó túmọ̀ sí fífi ara ẹni bá òṣùwọ̀n kan mu.
- source_word: διώκω
  choice: Mo ń tẹ̀ síwájú
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń sọ nípa ìsapá líle láti máa lọ síwájú bí ẹni tí ń sáré; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá tí ó pa ìtumọ̀ náà mọ́.
- source_word: εἰς τὸ βραβεῖον
  choice: fún èrè
  rationale: Ẹ̀ka ọ̀rọ̀ yìí tọ́ka sí ohun tí ìsapá náà ń lépa; “èrè” sì bá ẹ̀bùn tí a ń fún ẹni tó borí nínú eré mu dáadáa.
- source_word: ἄνω
  choice: sókè
  rationale: Ó pa ìtumọ̀ ibi tàbí ìtọ́sọ́nà “sókè” mọ́, ó sì jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú àwòrán eré-ìje àti ìpè láti ọ̀dọ̀ Ọlọ́run ṣì ṣí sílẹ̀.
- source_word: κλήσεως τοῦ θεοῦ
  choice: ìpè ... ti Ọlọ́run
  rationale: Ìṣètò yìí tẹ̀lé ìbáṣepọ̀ genitive Gíríìkì ní pẹkipẹki, láì fi dandan pinnu bóyá a ń tẹnumọ́ ẹni tó ni ìpè náà tàbí ibi tí ó ti wá.
- source_word: Χριστῷ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; “Mèsáyà” jẹ́ kí ìtumọ̀ oyè náà hàn dípò kí a lò ó bí orúkọ lásán.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa èdè Pọ́ọ̀lù nípa ìṣọ̀kan àti ipò ẹni nínú Mèsáyà mọ́, láì tú ìtumọ̀ náà sí ọ̀nà kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ ἄνω κλήσεως
  choice: ìpè sókè
  alternative: ìpè ọ̀run; ìpè láti òkè
  rationale: “Ìpè sókè” pa agbára ibi àti ìtọ́sọ́nà ἄνω mọ́, ó sì jẹ́ kí àwòrán eré-ìje àti ìtumọ̀ pé ìpè náà wá láti ọ̀dọ̀ Ọlọ́run dúró pọ̀ láì yanju ìfọ̀rọ̀wérọ̀ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní ni a lò. A fi àmì ohùn sí ibi tí ó bá àdánidá mu, a sì pa àwòrán eré-ìje àti àìdánilójú tó wà nínú “ìpè sókè” mọ́.
