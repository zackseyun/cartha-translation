id: PHP.3.19
reference: Philippians 3:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: yo
  text: Ìparí wọn ni ìparun, ikùn wọn ni ọlọ́run wọn[a], ògo wọn sì wà nínú ìtìjú wọn—ọkàn wọn wà lórí àwọn ohun ti ayé.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfẹ́kúfẹ̀ẹ́ wọn ni ọlọ́run wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “wọ́n ń ronú nípa àwọn ohun ti ayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: ìparí
  rationale: “Ìparí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé pẹ̀lú ìtumọ̀ ohun tí yóò ṣẹ̀yìn tàbí àbájáde ìkẹyìn, láì fi ìtumọ̀ àyànmọ́ kún un.
- source_word: ἀπώλεια
  choice: ìparun
  rationale: Ó pa ìtumọ̀ ìdájọ́ líle àti ìṣègbé run mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: κοιλία
  choice: ikùn
  rationale: Ó dá àwòrán ara tí Gíríìkì lò dúró; kò tú u sí “ìfẹ́kúfẹ̀ẹ́” nínú ọ̀rọ̀ pàtàkì.
- source_word: δόξα
  choice: ògo
  rationale: Ó jẹ́ ìtumọ̀ tààrà, ó sì pa ẹ̀gàn tó wà nínú gbígbé ohun ìtìjú ga mọ́.
- source_word: αἰσχύνη
  choice: ìtìjú
  rationale: Ó mú ìtumọ̀ àbùkù àti ohun tí kò bójú mu jáde ní ṣókí.
- source_word: τὰ ἐπίγεια
  choice: àwọn ohun ti ayé
  rationale: Ó jẹ́ ọ̀nà àdánidá láti sọ àwọn ohun ilẹ̀ ayé, ní ìyàtọ̀ sí ohun ti ọ̀run.
- source_word: φρονοῦντες
  choice: ọkàn wọn wà lórí
  rationale: Gbólóhùn yìí fi ìtẹ̀sí ọkàn tó ń bá a lọ hàn, kì í ṣe èrò kan ṣoṣo tí ó kọjá lọ.
- source_word: ὧν ... ὧν
  choice: wọn ... wọn
  rationale: Àrọ́pò orúkọ “wọn” tọ́ka sí àwọn ẹni tí ẹsẹ tó ṣáájú ń sọ̀rọ̀ nípa wọn, ó sì jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Agbára àkàwé inú gbólóhùn “ikùn wọn ni ọlọ́run wọn”
  choice: A pa “ikùn” mọ́ gẹ́gẹ́ bí àwòrán ara nínú ọ̀rọ̀ pàtàkì.
  alternative: “Ìfẹ́kúfẹ̀ẹ́ wọn ni ọlọ́run wọn.”
  rationale: κοιλία jẹ́ àwòrán tó lágbára fún ìfẹ́kúfẹ̀ẹ́ tàbí ìfọkànsìn sí ìgbádùn ara. Pípa àwòrán náà mọ́ kò fi dandan yan ìtumọ̀ àlàyé kan ṣoṣo.
- issue: Ìtumọ̀ ìtẹ̀sí ọkàn nínú φρονοῦντες
  choice: “ọkàn wọn wà lórí àwọn ohun ti ayé”
  alternative: “wọ́n ń ronú nípa àwọn ohun ti ayé”
  rationale: Àṣàyàn náà fi ìtẹ̀sí àti ìfọkànsìn ọkàn tó ń bá a lọ hàn, láì fi “nìkan” tàbí ẹ̀kọ́ mìíràn tí kò sí nínú Gíríìkì kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó níyì, tó ṣe kedere fún òǹkàwé òde òní. A lo àmi ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àwọn àmì àlàyé [a] àti [b] wà lẹ́gbẹ̀ẹ́ àwọn gbólóhùn tí àlàyé wọn kan.
