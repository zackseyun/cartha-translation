revisions:
- from: Ẹ máa di alájọfarawé mi, ẹ̀yin ará[a], kí ẹ sì máa kíyè sí àwọn tí ń rìn ní ọ̀nà yìí, gẹ́gẹ́ bí ẹ ti ní àwa gẹ́gẹ́ bí àpẹẹrẹ[b].
  to: Ẹ̀yin ará[a], ẹ dara pọ̀ nínú fífarawé mi, kí ẹ sì máa kíyè sí àwọn tí ń rìn báyìí, gẹ́gẹ́ bí àwa ṣe jẹ́ àpẹẹrẹ fún yín[b].
  rationale: A rọ́pò ìkọ́lé tí kò wọ́pọ̀ ‘alájọfarawé’ pẹ̀lú ‘ẹ dara pọ̀ nínú fífarawé mi’ láti mú ìfarawé lápapọ̀ tí Συμμιμηταί ń sọ hàn. A tún ṣàtúnṣe apá τύπον/ἡμᾶς sí gbolohun Yorùbá tó rọrùn, nígbà tí a pa ìtumọ̀ ‘àwa jẹ́ àpẹẹrẹ fún yín’ àti iye ọ̀pọ̀ arọ́pò-orúkọ náà mọ́. Àwọn àmì ìsàlẹ̀ ni a pa mọ́, a sì mú àmi ohùn àti ìkọ̀wé wọn dán.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ọ̀pọ̀ ìtumọ̀ Gíríìkì mọ́: ó pa ìpè àṣẹ náà, ìfarawé Pọ́ọ̀lù, kíyèsí àwọn míràn, àti arọ́pò-orúkọ ọ̀pọ̀ ‘àwa’ mọ́. Síbẹ̀, ‘Ẹ máa di alájọfarawé mi’ kì í ṣe ọ̀nà Yorùbá tó rọrùn tàbí tó hàn gbangba fún ‘be/join in being imitators of me,’ ‘ní ọ̀nà yìí’ sì lè tọ́ka sí ọ̀nà gidi dípò ìwà ìgbésí ayé. Gbólóhùn ìkẹyìn náà tún jẹ́ ìtẹ̀lé ìtòlẹ́sẹẹsẹ Gíríìkì tó mú kó ṣòro nínú Yorùbá.'
  naturalness: Ìforúkọsílẹ̀ àti ọ̀pọ̀ àwọn ọ̀rọ̀ jẹ́ Yorùbá ìgbàlódé tó níyì. Àmọ́ ‘alájọfarawé’ jẹ́ ọ̀rọ̀ tí kò wọ́pọ̀, ‘gẹ́gẹ́ bí ẹ ti ní àwa gẹ́gẹ́ bí àpẹẹrẹ’ sì dà bí ìtumọ̀-ọrọ̀ dé ọ̀rọ̀. Àtúnṣe náà lo ọ̀rọ̀ tó mọ́gbọn-dání, ó sì jẹ́ kí ìbáṣepọ̀ àwọn gbolohun hàn kedere.
  terminology: ‘Ẹ̀yin ará’ yẹ fún ἀδελφοί nínú àyíká ìjọ, ‘kíyè sí’ yẹ fún σκοπεῖτε, ‘àpẹẹrẹ’ sì yẹ fún τύπον. Àlàyé [a] ń sọ ní òtítọ́ pé fọ́ọ̀mù Gíríìkì jẹ́ akọ ọ̀pọ̀, bí ó tilẹ̀ jẹ́ pé ‘ará’ nínú Yorùbá kì í dá ìtọ́kasí náà mọ́ akọ nìkan.
  issues:
  - severity: medium
    issue: ‘Ẹ máa di alájọfarawé mi’ kò dáa lórí ìlò Yorùbá.
    rationale: ‘Alájọfarawé’ kò wọ́pọ̀, ó sì lè dà bí ẹni pé ‘ẹni tí ó ń fara wé papọ̀’ láì sọ kedere ẹni tí a ń fara wé. ‘Ẹ dara pọ̀ nínú fífarawé mi’ gbé agbára σύν- nínú Συμμιμηταί jáde ní ọ̀nà àdánidá.
  - severity: medium
    issue: ‘gẹ́gẹ́ bí ẹ ti ní àwa gẹ́gẹ́ bí àpẹẹrẹ’ jẹ́ ìkọ́lé tó rọ̀gẹ̀dẹ.
    rationale: Ó tẹ̀ lé Gíríìkì dé ọ̀rọ̀ dé ọ̀rọ̀, ṣùgbọ́n kò rọrùn ní Yorùbá. ‘gẹ́gẹ́ bí àwa ṣe jẹ́ àpẹẹrẹ fún yín’ ń sọ kathōs echete hēmas typon ní kedere, ó sì pa ‘àwa’ ọ̀pọ̀ mọ́.
  - severity: low
    issue: ‘àwọn tí ń rìn ní ọ̀nà yìí’ lè hàn bí rírìn lójú ọ̀nà gidi.
    rationale: Περιπατοῦντας níbí jẹ́ àkàwé fún ìwà ìgbésí ayé. ‘àwọn tí ń rìn báyìí’ pa àkàwé ‘rìn’ mọ́, ‘báyìí’ sì so ó mọ́ ọ̀nà ìgbé ayé tí a ti ṣàpèjúwe.
