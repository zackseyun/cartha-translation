id: PHP.3.17
reference: Philippians 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: yo
  text: Ẹ̀yin ará[a], ẹ dara pọ̀ nínú fífarawé mi, kí ẹ sì máa kíyè sí àwọn tí ń rìn báyìí, gẹ́gẹ́ bí àwa ṣe jẹ́ àpẹẹrẹ fún yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà wà ní fọ́ọ̀mù akọ ọ̀pọ̀, ṣùgbọ́n ó ṣeé ṣe kí ó ń tọ́ka sí gbogbo àwọn ọmọ ìjọ, lọ́kùnrin àti lóbìnrin.
    reason: cultural_note
  - marker: b
    text: Tàbí, “àwòṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμμιμηταί ... γίνεσθε
  choice: Ẹ máa di alájọfarawé mi
  rationale: Ọ̀rọ̀-orúkọ náà ní agbára ìfarawé lápapọ̀, ìyẹn pé kí àwọn onígbàgbọ́ dara pọ̀ mọ́ ara wọn nínú fífarawé Pọ́ọ̀lù. “Alájọfarawé” pa agbára “jọ” mọ́, “ẹ máa di” sì ṣàfihàn àṣẹ γίνεσθε lọ́nà Yorùbá tó bójú mu.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará[a]
  rationale: “Ará” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá fún àwọn ọmọ ìjọ tàbí àwọn onígbàgbọ́ ẹlẹgbẹ́, kò sì fi ìtumọ̀ akọ nìkan lé e lórí bí Gíríìkì ṣe ní fọ́ọ̀mù akọ ọ̀pọ̀.
- source_word: σκοπεῖτε
  choice: ẹ ... máa kíyè sí
  rationale: Ó túmọ̀ sí fífi àfiyèsí pẹkipẹki sí ẹnì kan ní ọ̀nà tó ń bá a lọ; “máa kíyè sí” jẹ́ èdè Yorùbá àdánidá fún un.
- source_word: οὕτω περιπατοῦντας
  choice: àwọn tí ń rìn ní ọ̀nà yìí
  rationale: “Rìn” pa àkàwé Pọ́ọ̀lù fún ìwàláàyè mọ́; “ní ọ̀nà yìí” dúró fún οὕτω láì pinnu ju ohun tí Gíríìkì sọ lọ.
- source_word: τύπον
  choice: àpẹẹrẹ[b]
  rationale: Níhìn-ín τύπος jẹ́ ẹni tàbí ìlànà tí a lè tẹ̀ lé. “Àpẹẹrẹ” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì lè gbé ìtumọ̀ “àwòṣe” náà.
- source_word: ἡμᾶς
  choice: àwa
  rationale: A pa arọ́pò-orúkọ ọ̀pọ̀ mọ́, kí a má bà á dín kù sí Pọ́ọ̀lù nìkan; ó lè ní àwọn alábàáṣiṣẹ́ rẹ̀ pẹ̀lú.
theological_decisions:
- issue: Àwọn tí ἀδελφοί ń tọ́ka sí
  choice: Lo “ẹ̀yin ará” nínú ọ̀rọ̀ pàtàkì, kí àlàyé ìsàlẹ̀ sọ pé fọ́ọ̀mù Gíríìkì jẹ́ akọ ọ̀pọ̀ ṣùgbọ́n ó ṣeé ṣe kí gbogbo ìjọ ni Pọ́ọ̀lù ń bá sọ̀rọ̀.
  alternative: “Ẹ̀yin arákùnrin” tàbí “ẹ̀yin arákùnrin àti arábìnrin.”
  rationale: “Ará” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀, tó níyì, tí ó sì bá ìpè sí àwọn ọmọ ìjọ mu. Àlàyé ìsàlẹ̀ pa ìsọfúnni nípa fọ́ọ̀mù akọ inú Gíríìkì mọ́, láì fi ọ̀rọ̀ tí ó lè dà bí ẹni pé àwọn ọkùnrin nìkan ni a ń pè sí.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A pa àkàwé “rìn” mọ́, a sì lo “alájọfarawé” láti gbé agbára ìfarawé lápapọ̀ inú Συμμιμηταί jáde. Ìtòlẹ́sẹẹsẹ gbolohun náà mọ̀ọ́mọ̀ tẹ̀ lé Gíríìkì níwọ̀n tó fi lè jẹ́ àdánidá ní Yorùbá.
