id: PHP.3.6
reference: Philippians 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: yo
  text: Ní ti ìtara, mo ṣe inúnibíni sí ìjọ; ní ti òdodo[a] lábẹ́ òfin[b], mo di ẹni tí kò ní ẹ̀sùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìdájọ́ òdodo.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “nínú òfin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: ní ti
  rationale: “Ní ti” fi ẹ̀ka ìdíwọ̀n tí Pọ́ọ̀lù ń tọ́ka sí hàn, ó sì pa àtúnsọ ọ̀rọ̀ Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ζῆλος
  choice: ìtara
  rationale: “Ìtara” sọ ìgbóná ọkàn àti ìfọkànsìn ẹ̀sìn tó lágbára, láìsọ pé ìtara náà dára tàbí pé ó tọ́.
- source_word: διώκων
  choice: mo ṣe inúnibíni sí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí lílépa àwọn onígbàgbọ́ pẹ̀lú ìkórìíra. Fífi “mo” kún un jẹ́ kí gbólóhùn àkójọ náà ṣe kedere ní Yorùbá, nígbà tí ẹni tí a ń sọ̀rọ̀ rẹ̀ ṣì jẹ́ Pọ́ọ̀lù gẹ́gẹ́ bí àyíká.
- source_word: ἐκκλησίαν
  choice: ìjọ
  rationale: “Ìjọ” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún àwùjọ àwọn onígbàgbọ́ nínú lílo Pọ́ọ̀lù.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: “Òdodo” lè sọ ipò títọ́ tàbí ìwà títọ́ gẹ́gẹ́ bí òfin ṣe ń wọ̀n án, ó sì yẹ fún ẹ̀ka ìgbéraga Pọ́ọ̀lù tẹ́lẹ̀.
- source_word: ἐν νόμῳ
  choice: lábẹ́ òfin
  rationale: “Lábẹ́ òfin” jẹ́ Yorùbá àdánidá fún ọ̀nà tí òfin jẹ́ àyè àti òṣùwọ̀n òdodo tí a ń sọ̀rọ̀ rẹ̀; àlàyé ìsàlẹ̀ fi ìtumọ̀ gangan “nínú òfin” pamọ́.
- source_word: γενόμενος
  choice: mo di
  rationale: “Mo di” pa èrò ìṣe tí ó ṣẹlẹ̀ mọ́, dípò yíyí ọ̀rọ̀ náà padà sí àpèjúwe lásán.
- source_word: ἄμεμπτος
  choice: ẹni tí kò lẹ́gàn
  rationale: Èyí túmọ̀ sí ẹni tí a kò rí ẹ̀sùn mú ní ìbámu pẹ̀lú òṣùwọ̀n tí a mẹ́nu kàn, láìfi hàn pé Pọ́ọ̀lù ń pe ara rẹ̀ ní aláìṣẹ̀ pátápátá níwájú Ọlọ́run.
theological_decisions:
- issue: Ìwọ̀n gbólóhùn Pọ́ọ̀lù pé òun kò lẹ́gàn
  choice: A kò rí ẹ̀gàn mú Pọ́ọ̀lù ní ti òdodo tí òfin ń wọ̀n.
  alternative: Pọ́ọ̀lù ń sọ pé òun kò ṣẹ̀ rí rárá.
  rationale: Ìṣọ̀kan gírámà so ἄμεμπτος mọ́ δικαιοσύνη τὴν ἐν νόμῳ. Nítorí náà, gbólóhùn náà wà lábẹ́ òṣùwọ̀n òfin tí Pọ́ọ̀lù ń ṣe àkójọ rẹ̀, kì í ṣe ìjẹ́wọ́ àìlẹ́ṣẹ̀ pátápátá níwájú Ọlọ́run.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbogbò. Àwọn àmì ìsàlẹ̀ [a] àti [b] ni a so mọ́ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé, nítorí àmì [a] nínú ìpele ìmọ̀ràn Gẹ̀ẹ́sì fara hàn lẹ́yìn “zeal” bí ó tilẹ̀ jẹ́ pé àlàyé rẹ̀ jẹ́ ti “righteousness.”
