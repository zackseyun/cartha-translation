source:
  edition: SBLGNT
  text: Βλέπετε τοὺς κύνας, βλέπετε τοὺς κακοὺς ἐργάτας, βλέπετε τὴν κατατομήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: yo
  text: Ẹ ṣọ́ra fún àwọn ajá; ẹ ṣọ́ra fún àwọn òṣìṣẹ́ búburú; ẹ ṣọ́ra fún ìgégé ara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní èdè Gíríìkì, Pọ́ọ̀lù lo ọ̀rọ̀ tó túmọ̀ sí “ìgégé ara” gẹ́gẹ́ bí ọ̀rọ̀ ẹ̀gàn tó lòdì sí ọ̀rọ̀ náà fún “ìkọlà” nínú ẹsẹ tó tẹ̀ lé e.
    reason: cross_reference
lexical_decisions:
- source_word: Βλέπετε
  choice: Ẹ ṣọ́ra fún
  rationale: Ọ̀rọ̀ àṣẹ yìí jẹ́ ìkìlọ̀ kánjúkánjú, a sì tún un ṣe lẹ́ẹ̀mẹ́ta gẹ́gẹ́ bí Gíríìkì ṣe rí, kí agbára àti ìlù ọ̀rọ̀ náà lè dúró.
- source_word: τοὺς κύνας
  choice: àwọn ajá
  rationale: A pa àkàwé líle tí Pọ́ọ̀lù lò mọ́ láìfi àlàyé tàbí àpèjúwe kún un.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: àwọn òṣìṣẹ́ búburú
  rationale: Èyí pa ìtumọ̀ ìwà búburú inú κακούς àti ìtumọ̀ gbòòrò ἐργάτας mọ́ ní Yorùbá tó ṣe kedere.
- source_word: τὴν κατατομήν
  choice: àwọn tí ń gé ara wọn láàyè
  rationale: κατατομή jẹ́ ọ̀rọ̀ ẹ̀gàn fún gígé ara, ó sì mọ̀ọ́mọ̀ yàtọ̀ sí περιτομή (‘ìkọlà’ tàbí ‘ìdádọ̀dọ́’). Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ orúkọ àìníyè, ohun tí a ń kìlọ̀ fún ní àyíká ọ̀rọ̀ náà ni àwọn ènìyàn; ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ẹ̀gàn náà mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ κατατομή ní ìbáṣepọ̀ pẹ̀lú περιτομή nínú ẹsẹ tó tẹ̀ lé e
  choice: Lo ọ̀rọ̀ ẹ̀gàn tó túmọ̀ sí àwọn tí ń gé ara wọn láàyè.
  alternative: ìgégé ara; àwọn onígégé; àwọn oníkọlà èké
  rationale: Pọ́ọ̀lù kò lo ọ̀rọ̀ Gíríìkì tó wọ́pọ̀ fún ìkọlà; ó lo ọ̀rọ̀ ìbánijẹ́ tó ń pè é ní gígé ara. A pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ àti ọgbọ́n-ọ̀rọ̀ náà mọ́, láìsọ ọ́ di ọ̀rọ̀ pẹ̀lẹ́ tàbí fi ‘èké’ kún un.
translation_notes:
  register: Yorùbá àṣàtúnṣe, tó ní àmì ohùn ní kíkún níbi tó bá yẹ. Ìforígbárí mẹ́ta náà ni a pa mọ́ pẹ̀lú ‘Ẹ ṣọ́ra fún’ lẹ́ẹ̀mẹ́ta. Èdè náà jẹ́ kedere, lọ́lá, ó sì bójú mu fún òǹkàwé òde òní.
