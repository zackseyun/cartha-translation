id: PHP.3.9
reference: Philippians 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: yo
  text: kí a sì rí mi nínú rẹ̀, láìní òdodo tèmi tí ó wá láti inú òfin, bí kò ṣe òdodo tí ó wá nípasẹ̀ ìgbàgbọ́ nínú Mèsáyà[a]—òdodo láti ọ̀dọ̀ Ọlọ́run, tí ó dá lórí ìgbàgbọ́.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ìṣòtítọ́ Mèsáyà.”
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ tí a tú sí “òdodo” ní ibi méjèèjì tún lè túmọ̀ sí “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ
  choice: kí a sì rí mi
  rationale: Ó pa ohùn àìṣe ti ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé kí a rí Pọ́ọ̀lù ní ipò yìí.
- source_word: ἐν αὐτῷ
  choice: nínú rẹ̀
  rationale: Ó pa àwòrán pàtàkì ti Pọ́ọ̀lù nípa wíwà ‘nínú’ Mèsáyà mọ́ láìfi ìtumọ̀ kan ṣoṣo dí ìbú rẹ̀.
- source_word: μὴ ἔχων
  choice: láìní
  rationale: Ó sọ ipò tí a ó ti rí Pọ́ọ̀lù ní kedere, ó sì bá lílo Yorùbá òde òní mu.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: ‘Òdodo’ jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ìwà tàbí ipò títọ́ níwájú Ọlọ́run, ó sì tún lè ní ìmọ̀ ìdájọ́ òdodo nínú rẹ̀.
- source_word: τὴν ἐκ νόμου
  choice: tí ó ti inú òfin wá
  rationale: Ó fi òfin hàn gẹ́gẹ́ bí orísun òdodo tí Pọ́ọ̀lù kọ̀ sílẹ̀, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe sọ.
- source_word: διὰ πίστεως Χριστοῦ
  choice: nípasẹ̀ ìgbàgbọ́ nínú Mèsáyà
  rationale: Ó mú ìtumọ̀ pé ìgbàgbọ́ tí a gbé lé Mèsáyà jáde nínú ọ̀rọ̀ àkọ́kọ́, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ míì tí ó ṣeé ṣe—ìṣòtítọ́ Mèsáyà—mọ́.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Níbí, Χριστός ṣì ní agbára gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fi àmì òróró yàn, kì í ṣe orúkọ lásán.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: òdodo láti ọ̀dọ̀ Ọlọ́run
  rationale: Ó pa ìtẹnumọ́ pé Ọlọ́run ni orísun òdodo náà mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣe kedere.
- source_word: ἐπὶ τῇ πίστει
  choice: tí ó dá lórí ìgbàgbọ́
  rationale: Ó fi ìgbàgbọ́ hàn gẹ́gẹ́ bí ìpìlẹ̀ tàbí ọ̀nà tí òdodo láti ọ̀dọ̀ Ọlọ́run yìí dúró lé.
theological_decisions:
- issue: Ìtumọ̀ πίστεως Χριστοῦ
  choice: ìgbàgbọ́ nínú Mèsáyà
  alternative: ìṣòtítọ́ Mèsáyà
  rationale: Ìsopọ̀ ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìgbàgbọ́ tí ènìyàn ní nínú Mèsáyà tàbí sí ìṣòtítọ́ Mèsáyà fúnra rẹ̀. Ọ̀rọ̀ àkọ́kọ́ lo ìtumọ̀ àkọ́kọ́, ṣùgbọ́n àlàyé [a] pa ìtumọ̀ kejì mọ́.
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ jẹ́ yíyan àkọ́kọ́ tó bá àyíká ọ̀rọ̀ Pọ́ọ̀lù mu; àlàyé [b] fi hàn pé ọ̀rọ̀ náà tún lè tẹnumọ́ ìdájọ́ òdodo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A fi [a] sí lẹ́yìn gbólóhùn tí àlàyé rẹ̀ ń tọ́ka sí, a sì fi [b] sí òpin láti bo ìṣẹ̀lẹ̀ méjèèjì ti ‘òdodo.’
