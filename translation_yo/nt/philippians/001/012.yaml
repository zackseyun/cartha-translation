id: PHP.1.12
reference: Philippians 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: yo
  text: Mo sì fẹ́ kí ẹ mọ̀, ẹ̀yin ará[a], pé ohun tí ó ṣẹlẹ̀ sí mi ti mú kí ìhìn rere[b] túbọ̀ tẹ̀ síwájú,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, ọ̀rọ̀ Gíríìkì sọ pé “ẹ̀yin arákùnrin”; ó lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́, ọkùnrin àti obìnrin.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ìhìnrere.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: Mo ... fẹ́ kí ẹ mọ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfẹ́ ẹni láti jẹ́ kí àwọn olùgbọ́ mọ ohun kan; ó pa èrò ti ọ̀rọ̀ Gíríìkì mọ́ láìdi líle.
- source_word: δὲ
  choice: sì
  rationale: “Sì” jẹ́ àsopọ̀ pẹ̀lẹ́ tó bá ìyípadà kókó mu, láìfi ìtakora líle kún ọ̀rọ̀ náà.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ àdánidá àti ọlọ́lá fún àwọn onígbàgbọ́ ẹlẹgbẹ́, ó sì lè tọ́ka sí gbogbo ìjọ láìka akọ tàbí abo.
- source_word: τὰ κατ’ ἐμὲ
  choice: ohun tí ó ṣẹlẹ̀ sí mi
  rationale: Gbólóhùn náà tọ́ka ní gbogbogbòò sí ipò àti ìṣẹ̀lẹ̀ Pọ́ọ̀lù; ìtumọ̀ yìí ṣe kedere ní Yorùbá.
- source_word: μᾶλλον
  choice: túbọ̀
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà fi hàn pé àbájáde náà jẹ́ ìlọsíwájú sí i, ní ìyàtọ̀ sí ohun búburú tí ènìyàn lè retí.
- source_word: εἰς προκοπὴν
  choice: mú kí ... tẹ̀ síwájú
  rationale: Ọ̀nà yìí sọ ìlọsíwájú tàbí ìtẹ̀síwájú ní Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ àbájáde tí εἰς fi hàn mọ́.
- source_word: τοῦ εὐαγγελίου
  choice: ìhìn rere
  rationale: Èyí ni ìtumọ̀ taara, tí ó ṣe kedere, fún εὐαγγέλιον; ó tọ́ka sí ìhìn rere nípa Kristi.
- source_word: ἐλήλυθεν
  choice: ti mú kí
  rationale: Àmì àsìkò “ti” fi hàn pé àwọn ìṣẹ̀lẹ̀ tó ti kọjá ti ní àbájáde tí ó ṣì dúró nísinsin yìí.
theological_decisions:
- issue: Bóyá ἀδελφοί ń tọ́ka sí àwọn ọkùnrin nìkan tàbí gbogbo ìjọ
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìrísí, ṣùgbọ́n nínú irú ìkíni yìí ó lè gba gbogbo àwùjọ onígbàgbọ́; “ẹ̀yin ará” pa ìtumọ̀ àwùjọ náà mọ́ láìpinnu ju ẹ̀rí lọ.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá, àti àdánidá ni a lò. “Mo sì fẹ́” gbé àsopọ̀ pẹ̀lẹ́ δὲ jáde; “ti mú kí ... túbọ̀ tẹ̀ síwájú” pa àbájáde tó ń bá a lọ àti ìlọsíwájú tí kò ṣeé retí mọ́.
