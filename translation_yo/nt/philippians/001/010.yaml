  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: yo
  text: kí ẹ lè mọ ohun tí ó tayọ[a], kí ẹ lè jẹ́ mímọ́ àti aláìlẹ́bi fún ọjọ́ Mèsáyà[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “kí ẹ lè yan ohun tí ó ṣe pàtàkì,” “kí ẹ lè yan ohun tí ó tayọ,” tàbí, ní títúmọ̀ rẹ̀ ní tààràtà jù, “kí ẹ lè yẹ àwọn ohun tí ó yàtọ̀ wò.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ìtumọ̀ ìbílẹ̀: “fún ọjọ́ Kristi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δοκιμάζειν
  choice: ṣe àyẹ̀wò, kí ẹ sì yan
  rationale: Ọ̀rọ̀ náà ní èrò ṣíṣe àyẹ̀wò ohun kan àti fífi ọwọ́ sí i lẹ́yìn àyẹ̀wò. Àkójọpọ̀ yìí sọ ìtumọ̀ méjèèjì ní Yorùbá àdánidá.
- source_word: τὰ διαφέροντα
  choice: àwọn ohun tí ó tayọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ní tààràtà ó lè túmọ̀ sí ‘àwọn ohun tí ó yàtọ̀,’ nínú àyíká yìí ó ṣeé ṣe kí ó tọ́ka sí àwọn ohun tí ó ga tàbí tí ó ṣe pàtàkì jù.
- source_word: εἰλικρινεῖς
  choice: mímọ́
  rationale: Àpèjúwe náà lè túmọ̀ sí ẹni tí ó mọ́ tàbí ẹni tí kò ní ẹ̀tàn. ‘Mímọ́’ bá ọ̀rọ̀ ìwà rere mu, ó sì dúró lẹ́gbẹ̀ẹ́ ‘aláìlẹ́bi’ lọ́nà àdánidá.
- source_word: ἀπρόσκοποι
  choice: aláìlẹ́bi
  rationale: Ọ̀rọ̀ náà lè sọ nípa ẹni tí kò kọsẹ̀ tàbí tí kò mú ẹlòmíràn kọsẹ̀. ‘Aláìlẹ́bi’ pa ìtumọ̀ ìwà tí kò yẹ fún ẹ̀gàn mọ́ láìfi tipátipá yan ọ̀kan lára àwọn ìtumọ̀ méjèèjì.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: fún ọjọ́ Mèsáyà
  rationale: εἰς níbí tọ́ka sí ibi-afẹ́ tàbí ọjọ́ tí wọ́n ń dojú kọ. ‘Fún’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ èrò yẹn; Mèsáyà sì pa iṣẹ́ Χριστός gẹ́gẹ́ bí oyè mọ́.
theological_decisions:
- issue: Bí a ṣe máa tú Χριστοῦ nínú gbólóhùn ọjọ́ ìkẹyìn εἰς ἡμέραν Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, nítorí náà ‘Mèsáyà’ fi ìtumọ̀ oyè náà hàn. ‘Kristi,’ èyí tí ó wọ́pọ̀ nínú ìtumọ̀ ìbílẹ̀, wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. A pa ìtòlẹ́sẹẹsẹ gbólóhùn ète méjì mọ́, a sì yẹra fún àwọn ọ̀rọ̀ ẹ̀kọ́ ìjọ kan pàtó.
