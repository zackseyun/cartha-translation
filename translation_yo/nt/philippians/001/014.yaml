id: PHP.1.14
reference: Philippians 1:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: yo
  text: Àti pé ọ̀pọ̀ jù lọ nínú àwọn ará[a] ti ní ìgbẹ́kẹ̀lé nínú Olúwa nítorí ẹ̀wọ̀n mi, wọ́n sì ní ìgboyà púpọ̀ sí i láti sọ ọ̀rọ̀ náà láìbẹ̀rù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, ọ̀rọ̀ náà túmọ̀ ní tààrà sí “àwọn arákùnrin”; ó ṣeé ṣe kí ó ń tọ́ka sí àwọn onígbàgbọ́ ọkùnrin àti obìnrin níbí.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονας
  choice: ọ̀pọ̀ jù lọ
  rationale: Pẹ̀lú atókùn àti ọ̀rọ̀ tí ó ń fi apá kan nínú àpapọ̀ hàn, gbólóhùn yìí túmọ̀ sí ‘ọ̀pọ̀ jù lọ’ tàbí ‘ẹgbẹ́ tí ó pọ̀ jù,’ kì í ṣe ‘ọ̀pọ̀ sí i’ lásán.
- source_word: ἀδελφῶν
  choice: àwọn ará[a]
  rationale: ‘Àwọn ará’ jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí àwọn tí wọ́n jẹ́ ara ìdílé ìgbàgbọ́ kan. Àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ìlànà gírámà, ṣùgbọ́n ó ṣeé ṣe kí ó ń tọ́ka sí gbogbo àwọn onígbàgbọ́.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: A pa gbólóhùn Pọ́ọ̀lù yìí mọ́ gẹ́gẹ́ bí ó ti rí, ó sì ń fi ibi tàbí ìpìlẹ̀ ìgbẹ́kẹ̀lé wọn hàn.
- source_word: πεποιθότας
  choice: ti ní ìgbẹ́kẹ̀lé
  rationale: Ìṣe aláṣepé náà ń tọ́ka sí ìgbẹ́kẹ̀lé tí ó ti wáyé tí ó sì ń bá a lọ; ‘ti ní ìgbẹ́kẹ̀lé’ ń sọ ìyípadà àti ipò tí ó tẹ̀ síwájú yìí ní Yorùbá àdánidá.
- source_word: τοῖς δεσμοῖς μου
  choice: nítorí ẹ̀wọ̀n mi
  rationale: ‘Ẹ̀wọ̀n’ pa àwòrán ohun tí a fi dè ènìyàn mọ́, ‘nítorí’ sì mú ìtumọ̀ ohun tó fa ìgbẹ́kẹ̀lé wọn jáde ní kedere.
- source_word: περισσοτέρως
  choice: púpọ̀ sí i
  rationale: Èyí ń pa ìtumọ̀ ìfiwéra adverb náà mọ́ ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: τολμᾶν
  choice: ní ìgboyà ... láti
  rationale: Ìtumọ̀ rẹ̀ ni láti ní ìgboyà tàbí láti láyà láti ṣe ohun kan; gbólóhùn yìí bá Yorùbá òde òní mu.
- source_word: ἀφόβως
  choice: láìbẹ̀rù
  rationale: Ó sọ àìsí ìbẹ̀rù ní tààrà, kì í ṣe ìgboyà ní gbogbogbòò nìkan.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: Ó ṣeé ṣe kí ó tọ́ka sí ìhìn rere tí wọ́n ń kéde, ṣùgbọ́n ‘ọ̀rọ̀ náà’ ni ó sún mọ́ ọ̀rọ̀ inú ẹsẹ̀ jù, kò sì fi ‘Ọlọ́run’ kún un níbi tí Gíríìkì kò ti ní i.
- source_word: λαλεῖν
  choice: láti sọ
  rationale: Ọ̀rọ̀ ìṣe náà túmọ̀ sí sísọ̀rọ̀ ní gbogbogbòò; ‘láti sọ’ kò fi agbára ìtumọ̀ ìkéde tí kò sí nínú Gíríìkì kún un.
theological_decisions:
- issue: Ìwọ̀n àwọn tí ἀδελφοί ń tọ́ka sí
  choice: A lo ‘àwọn ará’ nínú ẹsẹ̀, a sì fi àlàyé sílẹ̀ pé ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní ìlànà gírámà, bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe kí ó kan àwọn onígbàgbọ́ ọkùnrin àti obìnrin.
  alternative: àwọn arákùnrin; àwọn arákùnrin àti arábìnrin; àwọn onígbàgbọ́
  rationale: Yorùbá ‘àwọn ará’ lè tọ́ka sí àwọn ará ìgbàgbọ́ láìfi ìbálòpọ̀ wọn hàn. Àlàyé ìsàlẹ̀ ń jẹ́ kí ìrísí akọ ti Gíríìkì àti àyè ìtumọ̀ tó lè gba gbogbo àwọn onígbàgbọ́ dúró papọ̀ láìfi èrò ẹ̀kọ́ ìsìn kún un.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. ‘Àti pé’ pa ìsopọ̀ ẹsẹ̀ yìí mọ́ pẹ̀lú gbólóhùn tó ṣáájú; ‘ẹ̀wọ̀n mi’ sì pa àwòrán gidi ti δεσμοί mọ́ dípò fífi ‘ìfìmọ́lé’ rọ́pò rẹ̀.
