revisions:
- from: 'Nítorí a ti fi èyí ṣe oore-ọ̀fẹ́ fún yín nítorí Messia[a][d]: kì í ṣe láti gba á gbọ́[b] nìkan, ṣùgbọ́n láti jìyà nítorí rẹ̀[c] pẹ̀lú.'
  to: Nítorí Messia, a ti fi oore-ọ̀fẹ́ fún yín láti kì í ṣe gba a gbọ́ nìkan, ṣùgbọ́n láti jìyà nítorí rẹ̀ pẹ̀lú.
  rationale: The revision replaces the unnatural “fi èyí ṣe oore-ọ̀fẹ́” with “fi oore-ọ̀fẹ́ fún yín,” which directly conveys gracious granting. The infinitival construction now governs both “gba a gbọ́” and “jìyà,” preserving the Greek parallel and the theological tension that both are graciously granted. The placement of “Nítorí Messia” signals its scope over the whole privilege without claiming a stronger, disputed nuance such as substitution or representation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the causal force of ὅτι, the gift/grace sense of ἐχαρίσθη, Messiah as the referent of Χριστός, and the parallel of believing and suffering. However, “a ti fi èyí ṣe oore-ọ̀fẹ́ fún yín” does not naturally or accurately express “it has been graciously granted to you”; it sounds like making “this” into grace rather than graciously giving a privilege. The revised wording makes both infinitives depend clearly on the gracious grant.
  naturalness: The revision uses a more idiomatic Yoruba construction, “a ti fi oore-ọ̀fẹ́ fún yín láti …,” and removes the unnecessary demonstrative èyí. “Nítorí Messia” is retained before the coordinated infinitives so its scope covers both believing and suffering.
  terminology: “Messia” appropriately represents Χριστός as a title under the stated project policy. “Gba a gbọ́” is a natural rendering of πιστεύειν εἰς αὐτόν; the alternative “gbẹ́kẹ̀ lé e” is suitably retained in a note. “Jìyà nítorí rẹ̀” faithfully conveys suffering on his account without doctrinal expansion.
  issues:
  - severity: medium
    issue: The main clause renders ἐχαρίσθη awkwardly and imprecisely.
    rationale: “A ti fi èyí ṣe oore-ọ̀fẹ́ fún yín” means approximately “this has been made grace for you,” whereas the Greek says that the privilege of believing and suffering has been graciously given to the readers. It also introduces èyí without a natural antecedent.
  - severity: low
    issue: Footnote d preserves a less clear alternative word order.
    rationale: The proposed alternative places “nítorí Messia” after “fún yín,” where its scope can be read less readily. A revised alternative should retain its relation to both following infinitives.
  - severity: low
    issue: Footnote c’s “ní ipò rẹ̀” is not a suitable alternative for ὑπὲρ αὐτοῦ here.
    rationale: “In his place” may imply substitution, which is not the sense required in this context. “Fún tìrẹ̀” or “nítorí tirẹ̀” better reflects suffering for his sake.
  revised_text: Nítorí Messia, a ti fi oore-ọ̀fẹ́ fún yín láti kì í ṣe gba a gbọ́ nìkan, ṣùgbọ́n láti jìyà nítorí rẹ̀ pẹ̀lú.
  revised_footnotes:
