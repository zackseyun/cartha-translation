id: PHP.1.29
reference: Philippians 1:29
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: yo
  text: Nítorí Messia, a ti fi oore-ọ̀fẹ́ fún yín láti kì í ṣe gba a gbọ́ nìkan, ṣùgbọ́n láti jìyà nítorí rẹ̀ pẹ̀lú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń mú ìdí tàbí àlàyé ọ̀rọ̀ ẹsẹ̀ tó ṣáájú wọlé; “Nítorí” jẹ́ àsopọ̀ ọ̀rọ̀ tó bójú mu ní Yorùbá.
- source_word: ἐχαρίσθη
  choice: a ti fi èyí ṣe oore-ọ̀fẹ́ fún yín
  rationale: Ìtumọ̀ yìí pa èrò fífúnni lọ́fẹ̀ẹ́ tàbí nípa oore-ọ̀fẹ́ mọ́, ó sì tún pa ìṣe aláìdárúkọ ẹni tó ṣe é mọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: nítorí Messia
  rationale: ὑπέρ ń fi Messia hàn gẹ́gẹ́ bí ẹni tí gbogbo ohun tí a fi fún wọn—ìgbàgbọ́ àti ìjìyà—dá lé lórí tàbí ṣẹlẹ̀ nítorí rẹ̀. “Messia” pa Χριστός mọ́ gẹ́gẹ́ bí oyè.
- source_word: πιστεύειν εἰς αὐτόν
  choice: láti gba á gbọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ìgbàgbọ́ sínú ẹni kan; ó lè tún túmọ̀ sí gbígbẹ́kẹ̀ lé e.
- source_word: πάσχειν
  choice: láti jìyà
  rationale: Ó túmọ̀ ọ̀rọ̀ ìṣe náà ní tààràtà láìrẹ̀wẹ̀sì agbára rẹ̀.
- source_word: ὑπὲρ αὐτοῦ
  choice: nítorí rẹ̀
  rationale: Níhìn-ín ὑπέρ ń tọ́ka sí jíjìyà nítorí Messia tàbí fún tìrẹ̀; “nítorí rẹ̀” jẹ́ kedere, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Bóyá kí a rọ ọ̀rọ̀ náà pé ìgbàgbọ́ àti ìjìyà ni a fi oore-ọ̀fẹ́ fún wọn
  choice: A pa èdè oore-ọ̀fẹ́ mọ́ fún ìgbàgbọ́ àti ìjìyà méjèèjì
  alternative: Kí a sọ pé a kàn gba wọn láyè, tàbí kí a tún gbólóhùn náà ṣe kí ipa Ọlọ́run má ṣe hàn gbangba
  rationale: Ètò Gíríìkì fi àwọn ọ̀rọ̀ ìṣe méjèèjì—gbígbàgbọ́ àti jíjìyà—sábẹ́ ohun tí a fi oore-ọ̀fẹ́ fún wọn. A kò yẹ kí ìtumọ̀ tú ìforígbárí ẹ̀kọ́ ìgbàgbọ́ yìí ká tàbí kí ó dín in kù.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé yé ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. “A ti fi èyí ṣe oore-ọ̀fẹ́” ń jẹ́ kí gbólóhùn náà ṣàn dáadáa ní Yorùbá, ó ń tọ́ka sí àwọn ohun méjèèjì tó tẹ̀ lé e, ó sì pa àwọ̀ ìtumọ̀ χαρίζομαι mọ́.
