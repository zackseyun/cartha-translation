  text: οἱ μὲν ἐξ ⸂ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: yo
  text: Àwọn àkọ́kọ́ ń ṣe bẹ́ẹ̀ láti inú ìfẹ́[a], nítorí wọ́n mọ̀ pé a yàn mí láti gbèjà ìhìn rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ìfẹ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν
  choice: Àwọn àkọ́kọ́ ń ṣe bẹ́ẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ ìṣe náà ní tààrà, ó sì ń fi ẹgbẹ́ yìí wé οἱ δέ tí ó tẹ̀ lé e. Gbólóhùn yìí mú ìṣe tí àyíká ọ̀rọ̀ fi hàn wọlé ní Yorùbá àdánidá.
- source_word: ἐξ ἀγάπης
  choice: láti inú ìfẹ́
  rationale: Ó fi ìfẹ́ hàn gẹ́gẹ́ bí ohun tí ó sún wọn ṣe ìṣe náà.
- source_word: εἰδότες
  choice: nítorí wọ́n mọ̀
  rationale: Participle náà ń fi ìdí ìṣe wọn hàn; ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa ìbáṣepọ̀ náà mọ́.
- source_word: εἰς ἀπολογίαν
  choice: láti gbèjà
  rationale: ἀπολογία lè túmọ̀ sí ìgbèjà níwájú ẹjọ́ tàbí fífi ẹ̀rí àti ìdí múlẹ̀; ọ̀rọ̀-ìṣe ‘gbèjà’ sọ ète náà ní kedere.
- source_word: τοῦ εὐαγγελίου
  choice: ìhìn rere
  rationale: Èyí túmọ̀ εὐαγγέλιον ní kedere àti ní ọ̀rọ̀ Yorùbá tí òǹkàwé òde òní lè lóye.
- source_word: κεῖμαι
  choice: a yàn mí
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ipò tàbí iṣẹ́ tí a fi Pọ́ọ̀lù sí fún ìgbèjà ìhìn rere, kì í ṣe pé ó kan dùbúlẹ̀ ní ibi kan.
theological_decisions:
- issue: Ìtumọ̀ κεῖμαι nínú àyíká ìdè Pọ́ọ̀lù
  choice: a yàn mí
  alternative: a fi mí síbí
  rationale: ‘A yàn mí’ pa èrò iṣẹ́ tàbí ipò tí a gbé lé Pọ́ọ̀lù lọ́wọ́ mọ́, láìsọ ní pàtó ẹni tí ó yàn án, níwọ̀n bí ọ̀rọ̀ Gíríìkì kò ti dárúkọ ẹni náà.
translation_notes:
  register: Yorùbá ìgbàlódé, tí ó bójú mu, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A mú ìṣe tí Gíríìkì fi sílẹ̀ fún àyíká ọ̀rọ̀ wọlé gẹ́gẹ́ bí ‘ń ṣe bẹ́ẹ̀,’ a sì pa àìdárúkọ ẹni tó yan Pọ́ọ̀lù mọ́ nípasẹ̀ passive ‘a yàn mí.’
