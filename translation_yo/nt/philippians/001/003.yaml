lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Mo dúpẹ́ lọ́wọ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀rọ̀-ìṣe àsìkò ìsinsìnyí, ẹni kìíní ẹyọ; “Mo dúpẹ́ lọ́wọ́” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹni kan ń fi ọpẹ́ fún ẹlòmíràn.
- source_word: τῷ θεῷ μου
  choice: Ọlọ́run mi
  rationale: Dative náà tọ́ka sí ẹni tí Pọ́ọ̀lù ń dúpẹ́ lọ́wọ́ rẹ̀; “lọ́wọ́ Ọlọ́run mi” mú ìbáṣepọ̀ gírámà náà hàn ní Yorùbá, ó sì pa arọ́pò-orúkọ ohun-ìní náà mọ́.
- source_word: ἐπὶ
  choice: ní ... ìgbà tí
  rationale: Pẹ̀lú dative níbí, ἐπὶ lè tọ́ka sí àkókò tàbí àyíká tí ìdúpẹ́ náà ṣẹlẹ̀. “ní gbogbo ìgbà tí” jẹ́ àdánidá, kò sì fi ìdí-okùnfà kan lé ọ̀rọ̀ náà lórí.
- source_word: πάσῃ
  choice: gbogbo ìgbà tí
  rationale: Pẹ̀lú orúkọ ẹyọ μνείᾳ, πάσῃ ní ìtumọ̀ pínpín, “ní gbogbo ìgbà tí,” èyí tí ó jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún “every remembrance.”
- source_word: μνείᾳ
  choice: mo bá rántí
  rationale: Bí ó tilẹ̀ jẹ́ pé orúkọ ni μνείᾳ, fífi gbolohun ọ̀rọ̀-ìṣe “mo bá rántí” ṣe àfihàn ìrántí náà lọ́nà Yorùbá àdánidá, láìyí ìtumọ̀ rẹ̀ padà sí mímẹ́nu kàn.
- source_word: ὑμῶν
  choice: yín
  rationale: “Yín” pa nọ́ńbà ọ̀pọ̀ inú Gíríìkì mọ́ ní kedere, ó sì bá ìforúkọsílẹ̀ ọ̀wọ̀ àti ọ̀rọ̀ sí àwùjọ mu.
