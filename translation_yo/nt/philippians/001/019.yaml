id: PHP.1.19
reference: Philippians 1:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: yo
  text: Nítorí mo mọ̀ pé èyí yóò yọrí sí ìdáǹdè mi[a] nípasẹ̀ àdúrà yín àti ìpèsè Ẹ̀mí Jésù Mèsáyà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìgbàlà” tàbí “ìdáláre.”
    reason: alternative_reading
  - marker: b
    text: 'Ní Gíríìkì: “Ẹ̀mí Jésù Kristi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: mo mọ̀
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ìsinsìnyí, ó sì fi ìdánilójú Pọ́ọ̀lù hàn lọ́nà àdánidá.
- source_word: τοῦτό
  choice: èyí
  rationale: Aṣojú ọ̀rọ̀ ẹyọ kan náà ń tọ́ka sí gbogbo ipò Pọ́ọ̀lù tí a ṣẹ̀ṣẹ̀ sọ, láìfi ìtumọ̀ tí ó dín kù lé e.
- source_word: ἀποβήσεται
  choice: yóò yọrí sí
  rationale: Ó sọ abajade ohun kan; gbólóhùn Yorùbá yìí ṣe kedere, ó sì bá ìṣe ọjọ́ iwájú mu.
- source_word: σωτηρίαν
  choice: ìdáǹdè mi
  rationale: Nínú ọ̀rọ̀ ẹ̀wọ̀n Pọ́ọ̀lù, ìdáǹdè ni ìtumọ̀ tó ṣeé ṣe jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ gbòòrò bí ìgbàlà tàbí ìdáláre mọ́.
- source_word: δεήσεως
  choice: àdúrà yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún ẹ̀bẹ̀ tí a gbà sí Ọlọ́run.
- source_word: ἐπιχορηγίας
  choice: ìpèsè
  rationale: Ó dúró fún ohun ìrànlọ́wọ́ tí a pèsè tàbí tí a fi kún ẹni; ‘ìpèsè’ pa ìtumọ̀ náà mọ́ láìṣe àlàyé rẹ̀ ju bó ṣe yẹ lọ.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: Ẹ̀mí Jésù Mèsáyà
  rationale: Ó pa ìbátan oníjẹnítífù mọ́, ó sì tú Χριστός gẹ́gẹ́ bí oyè ‘Mèsáyà’ dípò kí ó sọ ọ́ di orúkọ lásán.
theological_decisions:
- issue: Ìtumọ̀ σωτηρίαν nínú ipò ẹ̀wọ̀n Pọ́ọ̀lù
  choice: ìdáǹdè
  alternative: ìgbàlà tàbí ìdáláre
  rationale: Àyíká ọ̀rọ̀ ń tọ́ka sí abajade ipò ẹ̀wọ̀n Pọ́ọ̀lù, nítorí náà ‘ìdáǹdè’ yẹ fún ẹsẹ yìí; síbẹ̀, ọ̀rọ̀ Gíríìkì náà ní agbára láti túmọ̀ sí ìgbàlà tàbí ìdáláre, a sì pa èyí mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìpele àárín tí ó níyì, tí ó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; a sì pa ìṣòro ìtumọ̀ σωτηρίαν àti ìbátan ‘ìpèsè Ẹ̀mí’ mọ́ láìyanjú wọn ní ìkọ̀kọ̀.
