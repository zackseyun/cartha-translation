  text: ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον ἀπὸ ⸀τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/005.yaml
  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: yo
  text: nítorí ìbáṣepọ̀ yín nínú ìhìnrere láti ọjọ́ kìn-ín-ní títí di ìsinsìnyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún ìhìnrere.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí pé ìkópa papọ̀ wọn wà nínú ìhìnrere, tàbí pé ó jẹ́ fún ìhìnrere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: nítorí ìdàpọ̀ yín
  rationale: ἐπί pẹ̀lú ọ̀rọ̀ orúkọ ní dative fi ìdí ọpẹ́ Pọ́ọ̀lù hàn; “nítorí” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìdí náà. “Ìdàpọ̀” níbí túmọ̀ sí kíkópa papọ̀, kì í ṣe ìbákẹ́gbẹ́ onífẹ̀ẹ́ lásán.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: nínú ìhìnrere
  rationale: Gbólóhùn náà lè tọ́ka sí ibi tàbí ọ̀nà tí wọ́n ti ń kópa papọ̀. “Nínú ìhìnrere” pa ìsopọ̀ tó sún mọ́ra láàárín κοινωνία àti εὐαγγέλιον mọ́, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ ète “fún ìhìnrere” tún ṣeé ṣe.
- source_word: εὐαγγέλιον
  choice: ìhìnrere
  rationale: “Ìhìnrere” ni ọ̀rọ̀ Yorùbá tí a ti ń lò fún ìròyìn rere ní ìtumọ̀ Páùlù, ó sì bá ìforúkọsílẹ̀ ọ̀rọ̀ mímọ́ mu.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: láti ọjọ́ kìn-ín-ní
  rationale: Ó fi ìbẹ̀rẹ̀ àkókò ìkópa wọn hàn ní ọ̀nà Yorùbá tó ṣe kedere.
- source_word: ἄχρι τοῦ νῦν
  choice: títí di ìsinsìnyí
  rationale: Ó fi hàn pé ìkópa náà ń bá a lọ dé àkókò tí Pọ́ọ̀lù ń kọ̀wé.
theological_decisions:
- issue: Bóyá εἰς τὸ εὐαγγέλιον ń sọ ibi ìkópa tàbí ète rẹ̀
  choice: nínú ìhìnrere
  alternative: fún ìhìnrere
  rationale: Gíríìkì gba ìtumọ̀ méjèèjì láàyè. A lo “nínú” nínú àyọkà, a sì pa ìtumọ̀ ète mọ́ nínú àlàyé ìsàlẹ̀, láìfi ipá yanju àìdánilójú náà.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó bójú mu, tó sì ní iyì ni a lò. Àmì ohùn kún àwọn ọ̀rọ̀ níbi tí ó ti yẹ. “Ìdàpọ̀” jẹ́ ọ̀rọ̀ tó rọrùn fún òǹkàwé lasán, ó sì lè ru èrò kíkópa àti ṣiṣẹ́ papọ̀.
