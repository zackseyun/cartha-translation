id: PHP.1.1
reference: Philippians 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: yo
  text: 'Pọ́ọ̀lù àti Tímótì, àwọn ẹrú[b] Mèsáyà Jésù[a], sí gbogbo àwọn ẹni mímọ́ nínú Mèsáyà Jésù tí wọ́n wà ní Fílípì, pẹ̀lú àwọn alábòójútó[c] àti àwọn díákónì:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Jésù.” Χριστός jẹ́ oyè tí ó túmọ̀ sí ẹni tí a fi òróró yàn, ìyẹn Mèsáyà.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn ìránṣẹ́,” tàbí “àwọn ìránṣẹ́ tí wọ́n wà ní ìdè.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn bíṣọ́ọ̀bù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: àwọn ẹrú
  rationale: “Ẹrú” fi ipò ìdè tí δοῦλος túmọ̀ sí hàn ní kedere ju “ìránṣẹ́” lọ; ọ̀rọ̀ náà wà ní ọ̀pọ̀ nítorí ó tọ́ka sí Pọ́ọ̀lù àti Tímótì.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός jẹ́ oyè ní ìpilẹ̀ṣẹ̀; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́, a sì pa ìtòlẹ́sẹẹsẹ ọ̀rọ̀ Gíríìkì “Mèsáyà Jésù” mọ́.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: sí gbogbo àwọn ẹni mímọ́
  rationale: Ó pa ìtumọ̀ gbogbo àti ìdánimọ̀ wọn gẹ́gẹ́ bí ẹni tí a yà sí mímọ́ mọ́, láìfi èrò míì kún un.
- source_word: ἐν
  choice: nínú
  rationale: “Nínú” pa ọ̀rọ̀ Pọ́ọ̀lù nípa wíwà nínú Mèsáyà mọ́; fún ibi ìlú, “ní” ni Yorùbá àdánidá fún ἐν Φιλίπποις.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: tí wọ́n wà ní Fílípì
  rationale: Gbólóhùn àsopọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtọ́kasí ibi tí àwọn olùgbà wà mọ́.
- source_word: σὺν
  choice: pẹ̀lú
  rationale: “Pẹ̀lú” fi ìbáṣepọ̀ àwọn alábòójútó àti díákónì pẹ̀lú gbogbo àwọn ẹni mímọ́ hàn ní ṣókí.
- source_word: ἐπισκόποις
  choice: àwọn alábòójútó
  rationale: Ó túmọ̀ iṣẹ́ ìbojútó tí ọ̀rọ̀ Gíríìkì ń tọ́ka sí, láìfi ìtumọ̀ ipò ṣọ́ọ̀ṣì ti ìgbà tó tẹ̀ lé e lé e lórí.
- source_word: διακόνοις
  choice: àwọn díákónì
  rationale: Nínú àkójọpọ̀ rẹ̀ pẹ̀lú ἐπισκόποις, ọ̀rọ̀ náà ṣeé ṣe kí ó jẹ́ ipò iṣẹ́ tí a mọ̀ nínú ìjọ; “díákónì” ni ọ̀rọ̀ Yorùbá tí a mọ̀ fún un.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστός nínú ìkíni Pọ́ọ̀lù
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: “Mèsáyà” pa agbára Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró mọ́, dípò kí a mú un bí orúkọ lásán; àlàyé ìsàlẹ̀ fi ìtumọ̀ ìbílẹ̀ mìíràn hàn.
- issue: Bí a ṣe máa túmọ̀ δοῦλοι ní Fílípì 1:1
  choice: àwọn ẹrú
  alternative: àwọn ìránṣẹ́; àwọn ìránṣẹ́ tí ó wà ní ìdè
  rationale: “Àwọn ẹrú” pa ipò ìní àti ìdè tó wà nínú δοῦλοι mọ́, bó tilẹ̀ jẹ́ pé “àwọn ìránṣẹ́” rọrùn sí etí nínú èdè ìjọ.
translation_notes:
  register: 'Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì yẹ fún kíkà ní gbangba. A lo àmì ohùn níbi tí ó bá jẹ́ àdánidá, a sì lo “àwọn” ní kedere fún àwọn nọ́ńbà ọ̀pọ̀. Àwọn orúkọ ni a kọ ní ìrísí Yorùbá tí a mọ̀: Pọ́ọ̀lù, Tímótì, Jésù àti Fílípì.'
