id: PHP.1.20
reference: Philippians 1:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: yo
  text: gẹ́gẹ́ bí ìfojúsọ́nà mi tí ó kún fún ìháragàgà àti ìrètí mi pé n kò ní tijú ní ọ̀nà kankan[a], ṣùgbọ́n pé pẹ̀lú gbogbo ìgboyà, gẹ́gẹ́ bí ìgbà gbogbo, bákan náà ní báyìí, a óò gbé Mèsáyà[b] ga nínú ara mi, yálà nípasẹ̀ ìyè tàbí nípasẹ̀ ikú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a kì yóò fi mí sí ìtìjú ní ọ̀nà kankan.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kristi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: gẹ́gẹ́ bí
  rationale: Ó fi hàn pé ohun tí Pọ́ọ̀lù ń sọ bá ìfojúsọ́nà àti ìrètí rẹ̀ mu; èyí jẹ́ ọ̀nà àdánidá láti sọ ìbámu yìí ní Yorùbá.
- source_word: ἀποκαραδοκίαν
  choice: ìfojúsọ́nà pẹ̀lú ìháragàgà
  rationale: Gbólóhùn yìí pa ìtumọ̀ ìfojúsọ́nà líle àti onítara mọ́, láìlo ọ̀rọ̀ tí kò wọ́pọ̀ tàbí tí kò ṣe kedere.
- source_word: ἐλπίδα
  choice: ìrètí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìrètí onígbẹ̀kẹ̀lé nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἐν οὐδενὶ
  choice: ní ohunkóhun
  rationale: Ó pa ìsọdì pátápátá mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: αἰσχυνθήσομαι
  choice: a kì yóò dójú tì mí
  rationale: Ìtumọ̀ yìí mú ìhà aláìṣe ti ọ̀rọ̀ Gíríìkì jáde, ìyẹn pé a kì yóò fi Pọ́ọ̀lù sínú ìtìjú ní gbangba; àṣàyàn ‘ojú kì yóò tì mí’ wà nínú àlàyé ìsàlẹ̀.
- source_word: παρρησίᾳ
  choice: ìgboyà kíkún
  rationale: Nínú àyíká ẹ̀rí ní gbangba, ọ̀rọ̀ náà túmọ̀ sí sísọ̀rọ̀ tàbí hùwà láìbẹ̀rù; ‘kíkún’ dúró fún πάσῃ.
- source_word: μεγαλυνθήσεται
  choice: a óò gbé … ga
  rationale: Ọ̀nà yìí jẹ́ ti Yorùbá tó wọ́pọ̀ fún fífi ẹnì kan hàn gẹ́gẹ́ bí ẹni ńlá tàbí ẹni ọlá, ó sì pa ohùn aláìṣe ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Níhìn-ín, akọ́lé ẹni àmì òróró ṣì ní ìtumọ̀ rẹ̀; ‘Mèsáyà’ pa agbára akọ́lé náà mọ́ dípò kí ó dà bí orúkọ lásán.
- source_word: ἐν τῷ σώματί μου
  choice: nínú ara mi
  rationale: Ìtumọ̀ tààrà yìí ṣe kedere, ó sì pa ìtẹnumọ́ Pọ́ọ̀lù lórí ara rẹ̀ gẹ́gẹ́ bí ibi tí a ó ti fi Mèsáyà hàn mọ́.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: yálà nípasẹ̀ ìyè tàbí nípasẹ̀ ikú
  rationale: Ó pa ìṣọ̀kan àwọn gbólóhùn méjèèjì àti ìtumọ̀ ọ̀nà tàbí ipò tí διά pẹ̀lú ẹ̀yà genitive ń fi hàn mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστός nínú lẹ́tà Pọ́ọ̀lù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός ní agbára akọ́lé ẹni àmì òróró níhìn-ín; ‘Mèsáyà’ jẹ́ kí ìtumọ̀ yẹn hàn, nígbà tí àlàyé ìsàlẹ̀ ń tọ́ka sí àṣàyàn ìbílẹ̀ ‘Kristi.’
- issue: Bóyá αἰσχυνθήσομαι túmọ̀ sí ìtìjú inú ẹni tàbí fífi ẹni sínú ìtìjú ní gbangba
  choice: a kì yóò dójú tì mí
  alternative: ojú kì yóò tì mí
  rationale: Fífi Pọ́ọ̀lù sínú ìtìjú ní gbangba bá àyíká ẹ̀rí àti ìdáláre mu dáadáa, ṣùgbọ́n fọ́ọ̀mù Gíríìkì lè tún tọ́ka sí ìrírí ìtìjú inú ẹni; a kò fi àṣàyàn kejì pamọ́.
translation_notes:
  register: Yorùbá àpapọ̀ tó níyì àti tó ṣe kedere fún òǹkàwé òde òní ni a lò. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá; a sì yẹra fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan pàtó.
