source:
  edition: SBLGNT
  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: yo
  text: Ṣùgbọ́n, kí n máa wà láàyè nínú ara jẹ́ ohun tí ó pọndandan jù fún yín[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí n máa dúró nínú ara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: pé kí n máa bá a lọ láàyè
  rationale: Ọ̀rọ̀-ìṣe aláìlẹ́ni náà ni a lò gẹ́gẹ́ bí ọ̀rọ̀-orúkọ. Àyíká ọ̀rọ̀ fi hàn pé Pọ́ọ̀lù ń sọ nípa bí òun yóò ṣe máa bá a lọ láàyè; fífi ‘láàyè’ kún un mú kí Yorùbá ṣe kedere láìyí ìtumọ̀ padà.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín lílọ láti wà pẹ̀lú Kristi àti bíbá a lọ láàyè nínú ara.
- source_word: ἐν τῇ σαρκὶ
  choice: nínú ara
  rationale: Nínú àyíká yìí, σάρξ ń tọ́ka sí ìwàláàyè ènìyàn nínú ara, kì í ṣe ìtumọ̀ ìwà ẹ̀ṣẹ̀. ‘Nínú ara’ jẹ́ Yorùbá àdánidá tí ó pa ìtumọ̀ gidi mọ́.
- source_word: ἀναγκαιότερον
  choice: ṣe pàtàkì jù
  rationale: Ó pa ìpele afiwéra Gíríìkì mọ́, ó sì jẹ́ ọ̀nà Yorùbá tí ó wọ́pọ̀ láti sọ ohun tí ó pọndandan tàbí tí a nílò jù.
- source_word: δι’ ὑμᾶς
  choice: nítorí yín
  rationale: Ó lè sọ ìdí tàbí àǹfààní àwọn ará Fílípì. Ní àyíká ìtọ́jú Pọ́ọ̀lù, ó túmọ̀ sí pé bíbá a lọ láàyè yóò jẹ́ fún ire wọn.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ẹsẹ yìí
  choice: ìwàláàyè ti ara ní ayé (‘nínú ara’)
  alternative: ìtumọ̀ ìwà búburú tàbí ‘ẹ̀dá ẹlẹ́ṣẹ̀’
  rationale: Àyíká ọ̀rọ̀ fi lílọ láti wà pẹ̀lú Kristi wé bíbá ìwàláàyè ti ara lọ fún ire àwọn ará Fílípì. Kò sí ìdí nínú ẹsẹ yìí láti fi ìtumọ̀ ìwà ẹ̀ṣẹ̀ sínú σάρξ.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘ṣe pàtàkì jù’ fún afiwéra ἀναγκαιότερον, a sì lo ‘nínú ara’ láti yẹra fún ìtumọ̀ àṣìṣe pé σάρξ túmọ̀ sí ẹ̀dá ẹlẹ́ṣẹ̀ níbí.
