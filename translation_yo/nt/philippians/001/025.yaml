source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: yo
  text: Mo sì dá mi lójú nípa èyí, mo mọ̀ pé màá wà, màá sì máa bá gbogbo yín wà, fún ìlọsíwájú àti ayọ̀ yín nínú ìgbàgbọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ayọ̀ ìgbàgbọ́ yín,” tàbí “ayọ̀ tí ó ń wá láti inú ìgbàgbọ́ yín.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεποιθὼς
  choice: ó ti dá mi lójú
  rationale: Ọ̀rọ̀ náà jẹ́ participle perfect, ó sì ń tọ́ka sí ìdánilójú tí ó ti fìdí múlẹ̀. Àṣàyàn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ náà mọ́.
- source_word: μενῶ
  choice: èmi yóò dúró
  rationale: Ó fi ọjọ́ iwájú àti ìtumọ̀ ‘dúró ṣáá’ hàn, láìfi ohun tí kò sí nínú Gíríìkì kún un.
- source_word: παραμενῶ
  choice: èmi yóò sì máa bá gbogbo yín dúró
  rationale: ‘Máa bá ... dúró’ mú ìtumọ̀ títẹ̀síwájú ní ẹgbẹ́ wọn jáde, ó sì yà á sọ́tọ̀ díẹ̀ sí μενῶ.
- source_word: πᾶσιν ὑμῖν
  choice: gbogbo yín
  rationale: Ó pa ìtẹnumọ́ πᾶσιν mọ́, ó sì bá ìṣe ‘máa bá ... dúró’ mu ní Yorùbá.
- source_word: προκοπὴν
  choice: tẹ̀ síwájú
  rationale: Fáàbù yìí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ìlọsíwájú tàbí ìdàgbàsókè.
- source_word: χαρὰν τῆς πίστεως
  choice: ayọ̀ nínú ìgbàgbọ́ yín
  rationale: Ó jẹ́ gbólóhùn Yorùbá àdánidá tí kò fi dandan pinnu bóyá genitive náà túmọ̀ sí ayọ̀ tí ìgbàgbọ́ ń mú wá tàbí ayọ̀ tí ó wà nínú ìgbàgbọ́.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí, ‘ìgbàgbọ́’ ni ó dára jù lọ fún πίστις, ní ti ìgbàgbọ́ àwọn ará Fílípì.
theological_decisions:
- issue: Ìtumọ̀ genitive nínú χαρὰν τῆς πίστεως
  choice: ayọ̀ nínú ìgbàgbọ́ yín
  alternative: ayọ̀ ìgbàgbọ́ yín; ayọ̀ tí ó ti inú ìgbàgbọ́ yín wá
  rationale: Ìṣètò Gíríìkì lè gba ìtumọ̀ tó ju ọ̀kan lọ. Ọ̀rọ̀ inú ẹsẹ̀ jẹ́ àdánidá ní Yorùbá, àkọsílẹ̀ ìsàlẹ̀ sì pa àwọn ìtumọ̀ mìíràn mọ́ láìyanju àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè ọ̀wọ̀, tó ṣe kedere fún òǹkàwé òde òní. Àtúnṣe gbolohun sí ‘kí ẹ lè...’ ń sọ ipa εἰς di Yorùbá àdánidá, láìyí ìtumọ̀ pada.
