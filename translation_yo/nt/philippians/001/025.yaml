revisions:
- from: Níwọ̀n bí ó sì ti dá mi lójú nípa èyí, mo mọ̀ pé èmi yóò dúró, èmi yóò sì máa bá gbogbo yín dúró, kí ẹ lè tẹ̀ síwájú, kí ẹ sì ní ayọ̀ nínú ìgbàgbọ́ yín.[a]
  to: Mo sì dá mi lójú nípa èyí, mo mọ̀ pé màá wà, màá sì máa bá gbogbo yín wà, fún ìlọsíwájú àti ayọ̀ yín nínú ìgbàgbọ́.[a]
  rationale: A yí ìbẹ̀rẹ̀ gbolohun náà padà kí ó lè ṣàfihàn participle perfect πεποιθὼς gẹ́gẹ́ bí ipò ìdánilójú, kì í ṣe ìdí. A tún lo “màá wà ... màá máa bá ... wà” láti pa ìyàtọ̀ kékeré láàárín μενῶ àti παραμενῶ mọ́, a sì sọ ìbáṣepọ̀ “fún ìlọsíwájú àti ayọ̀ yín” di mímọ́. Ìtumọ̀ genitive nínú χαρὰν τῆς πίστεως ṣì wà ní ìmọ̀lára tí kò fi ipa pinnu rẹ̀, pẹ̀lú àwọn àṣàyàn nínú àkọsílẹ̀.
  reviewer_model: gpt-5.6-terra
