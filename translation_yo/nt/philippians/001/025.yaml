  source_fidelity: 'Ìbẹ̀rẹ̀ ìtumọ̀ náà, “Níwọ̀n bí ó sì ti dá mi lójú nípa èyí,” ń ṣiṣẹ́ bí ìdí/ìdíwọ̀n (“since/as far as”), ṣùgbọ́n πεποιθὼς jẹ́ participle tí ó ń ṣàpèjúwe Pọ́ọ̀lù: “ní ìdánilójú èyí.” Àtúnṣe náà tún pa ìṣọ̀kan μενῶ/παραμενῶ mọ́: ó máa wà, ó sì máa bá wọn wà. Ète εἰς ni a fi hàn pẹ̀lú “fún ìlọsíwájú àti ayọ̀ yín nínú ìgbàgbọ́.”'
  naturalness: “Mo sì dá mi lójú nípa èyí, mo mọ̀ pé ...” jẹ́ Yorùbá boṣewa, kedere, ó sì dáa ju ìṣètò “Níwọ̀n bí ...” lọ. “Ìlọsíwájú” jẹ́ orúkọ tó bá προκοπή mu dáadáa, ó sì jẹ́ kí ìbáṣepọ̀ “fún ... yín” hàn ní kedere.
