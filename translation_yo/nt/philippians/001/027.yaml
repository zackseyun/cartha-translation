id: PHP.1.27
reference: Philippians 1:27
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: yo
  text: 'Ohun kan ṣoṣo ni: ẹ máa hùwà bí ó ti yẹ fún ìhìn rere Mèsáyà[a], kí ó lè jẹ́ pé, yálà mo wá rí yín tàbí nígbà tí mi ò sí lọ́dọ̀ yín, kí n gbọ́ nípa yín pé ẹ dúró ṣinṣin nínú ẹ̀mí kan[c], ẹ sì fi ọkàn kan[d] jùmọ̀ tiraka fún ìgbàgbọ́ tí ó jẹ́ ti ìhìn rere[e][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún ní ìtumọ̀ jíjẹ́ ará ìlú nínú rẹ̀; ní tààràtà, ‘ẹ máa gbé ìgbé ayé yín bí ará ìlú.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘ìhìn rere Kristi.’
    reason: lexical_alternative
  - marker: c
    text: Ó tún lè túmọ̀ sí ‘nínú Ẹ̀mí kan náà,’ ìyẹn Ẹ̀mí Mímọ́.
    reason: alternative_reading
  - marker: d
    text: Tàbí ‘pẹ̀lú èrò kan náà.’
    reason: lexical_alternative
  - marker: e
    text: Tàbí ‘ẹ jùmọ̀ tiraka fún ìgbàgbọ́ nínú ìhìn rere.’
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: Ohun kan ṣoṣo ni
  rationale: Ó mú ìtẹnumọ́ ọ̀rọ̀ tí a fi sí iwájú hàn ní Yorùbá àdánidá, láìfi àṣẹ mìíràn kún un.
- source_word: ἀξίως
  choice: bí ó ti yẹ fún
  rationale: Àṣàyàn yìí fi hàn pé ọ̀rọ̀ náà ń ṣàpèjúwe irú ìwà tí ó bá ìhìn rere mu.
- source_word: πολιτεύεσθε
  choice: ẹ máa hùwà
  rationale: Ó jẹ́ Yorùbá òde òní tí ó ṣe kedere fún ìlànà ìgbé ayé; àlàyé ìsàlẹ̀ tọ́ka sí ìtumọ̀ tó ní í ṣe pẹ̀lú jíjẹ́ ará ìlú.
- source_word: εὐαγγελίου
  choice: ìhìn rere
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe kedere, tó sì ti wọ́pọ̀ fún εὐαγγέλιον.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Níbí, Χριστός dúró gẹ́gẹ́ bí oyè ẹni náà, nítorí náà ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: kí n gbọ́ nípa yín
  rationale: Ó sọ àṣà ọ̀rọ̀ Gíríìkì náà ní Yorùbá àdánidá láìyí ohun tí Pọ́ọ̀lù fẹ́ gbọ́ padà.
- source_word: στήκετε
  choice: ẹ dúró ṣinṣin
  rationale: Ó pa àwòrán ìdúró àti ìfaradà tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: ἐν ἑνὶ πνεύματι
  choice: nínú ẹ̀mí kan
  rationale: Ó pa àìdánilójú mọ́ bóyá ẹ̀mí ìṣọ̀kan àwọn onígbàgbọ́ ni tàbí Ẹ̀mí Mímọ́.
- source_word: μιᾷ ψυχῇ
  choice: fi ọkàn kan
  rationale: ‘Ọkàn’ pa àwòrán ψυχή mọ́, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣọ̀kan inú.
- source_word: συναθλοῦντες
  choice: jùmọ̀ tiraka
  rationale: Ó fi ìsapá líle tí wọ́n ń ṣe papọ̀ hàn, bí ìtumọ̀ àwòrán ìdíje inú ọ̀rọ̀ Gíríìkì.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: fún ìgbàgbọ́ tí ó jẹ́ ti ìhìn rere
  rationale: Ó dúró sún mọ́ ìsopọ̀ genitive Gíríìkì, láìpinnu ní pàtó bóyá ó túmọ̀ sí ìgbàgbọ́ nínú ìhìn rere tàbí àkóónú ìgbàgbọ́ tí ìhìn rere gbé kalẹ̀.
theological_decisions:
- issue: Bóyá πνεύματι ń tọ́ka sí Ẹ̀mí Mímọ́ tàbí sí ẹ̀mí/ìpinnu kan náà láàárín àwọn onígbàgbọ́
  choice: nínú ẹ̀mí kan
  alternative: nínú Ẹ̀mí kan náà
  rationale: Ìbáramu rẹ̀ pẹ̀lú ‘fi ọkàn kan’ ń ṣètìlẹ́yìn fún ìṣọ̀kan àwọn onígbàgbọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìṣeéṣe pé Ẹ̀mí Mímọ́ ni mọ́.
- issue: Ìtumọ̀ genitive nínú τῇ πίστει τοῦ εὐαγγελίου
  choice: fún ìgbàgbọ́ tí ó jẹ́ ti ìhìn rere
  alternative: fún ìgbàgbọ́ nínú ìhìn rere
  rationale: Ọ̀rọ̀ inú àkọ́kọ́ pa ìsopọ̀ náà sílẹ̀ ní fífẹ̀, dípò kí ó fi dandan túmọ̀ rẹ̀ sí ohun tí wọ́n gbàgbọ́ nínú rẹ̀ nìkan.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá ṣe àdánidá. Ìtẹnumọ́ ìbẹ̀rẹ̀, ìṣọ̀kan, àti àwòrán ìtiraka papọ̀ ni a pa mọ́.
