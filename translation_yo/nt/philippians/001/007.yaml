id: PHP.1.7
reference: Philippians 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: yo
  text: Ó tọ́ fún mi láti ronú báyìí nípa gbogbo yín[a], nítorí mo ní yín nínú ọkàn mi. Ní tòótọ́, nínú ẹ̀wọ̀n mi àti nínú ìgbèjà àti ìmúdájú ìhìnrere, gbogbo yín jẹ́ alábàápín oore-ọ̀fẹ́ pẹ̀lú mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nítorí ẹ ní mi nínú ọkàn yín.” Gbólóhùn Gíríìkì náà lè túmọ̀ sí ọ̀nà méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: Ó tọ́
  rationale: Ó sọ ohun tí ó yẹ, tí ó sì ní ìdáláre nípa ìwà Pọ́ọ̀lù, ní èdè Yorùbá àdánidá.
- source_word: φρονεῖν
  choice: láti máa ronú báyìí
  rationale: Ó pa ìtumọ̀ èrò àti ìṣarasíhùwà tí ó dúró ṣinṣin mọ́, láì dín un kù sí ìmọ̀lára nìkan.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: nípa gbogbo yín
  rationale: Pẹ̀lú φρονεῖν, gbólóhùn náà tọ́ka sí èrò Pọ́ọ̀lù nípa wọn, kì í ṣe ṣíṣe ohun kan dípò wọn.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: nítorí mo ní yín nínú ọkàn mi
  rationale: Ìtumọ̀ yìí bá ìfẹ́ Pọ́ọ̀lù nínú àyíká ọ̀rọ̀ mu, ṣùgbọ́n ìṣòro gírámà Gíríìkì jẹ́ kí ìtumọ̀ òdìkejì tún ṣeé ṣe; a fi í sí àlàyé ìsàlẹ̀.
- source_word: δεσμοῖς
  choice: ẹ̀wọ̀n mi
  rationale: Nínú Yorùbá, ‘nínú ẹ̀wọ̀n’ sọ ipò ìdè Pọ́ọ̀lù ní kedere, ó sì tún pa àwòrán ìdè mọ́ ju ọ̀rọ̀ àfojúrí lọ.
- source_word: ἀπολογίᾳ
  choice: gbígba ìhìnrere rò
  rationale: Ó túmọ̀ sí dídáhùn láti gbèjà ìhìnrere, yálà níwájú ilé-ẹjọ́ tàbí ní gbangba.
- source_word: βεβαιώσει
  choice: fífi ìdúróṣinṣin rẹ̀ múlẹ̀
  rationale: Ó mú èrò fífi òtítọ́ àti ìdúró ìhìnrere fìdí múlẹ̀ jáde ní Yorùbá tí ó ṣe kedere.
- source_word: συγκοινωνούς μου τῆς χάριτος
  choice: ẹ jọ ń pín nínú oore-ọ̀fẹ́ pẹ̀lú mi
  rationale: Ó pa ìkópa àjọṣepọ̀ mọ́, ó sì yẹra fún ọ̀rọ̀ tí yóò dà bí ẹni pé wọ́n kàn jẹ́ alábàáṣiṣẹ́ lásán.
- source_word: χάριτος
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún χάρις, ó sì lè gba ìtumọ̀ ẹ̀bùn Ọlọ́run tí wọ́n jọ ń ní nínú iṣẹ́ àti ìjìyà.
theological_decisions:
- issue: Àìdánilójú gírámà nínú gbólóhùn nípa ọkàn
  choice: mo ní yín nínú ọkàn mi
  alternative: ẹ ní mi nínú ọkàn yín
  rationale: Àkọ́kọ́ bá ìṣàn ọ̀rọ̀ nípa ìfẹ́ Pọ́ọ̀lù mu dáadáa, ṣùgbọ́n nítorí με àti ὑμᾶς jẹ́ accusative méjèèjì lẹ́gbẹ̀ẹ́ infinitive ἔχειν, Gíríìkì lè gba ìtumọ̀ méjèèjì; nítorí náà a kò pa ìtumọ̀ kejì rẹ́.
- issue: Ohun tí ‘oore-ọ̀fẹ́’ ní nínú àyíká ọ̀rọ̀ yìí
  choice: A fi ọ̀rọ̀ náà sílẹ̀ ní fífẹ̀ gẹ́gẹ́ bí oore-ọ̀fẹ́ tí Pọ́ọ̀lù àti àwọn ará Fílípì jọ ń pín nínú rẹ̀
  alternative: Dídín un kù sí oore iṣẹ́ ìhìnrere tàbí oore ìjìyà nìkan
  rationale: Àyíká ọ̀rọ̀ darapọ̀ ẹ̀wọ̀n, ìgbèjà, àti fífi ìhìnrere múlẹ̀; orísun kò fi dandan yan apá kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ìhìnrere’ àti ‘oore-ọ̀fẹ́’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì Yorùbá tí ó wọ́pọ̀, láì fi àlàyé ẹ̀kọ́ ìjọ kan kún wọn.
