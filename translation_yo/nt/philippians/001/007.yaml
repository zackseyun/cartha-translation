  to: Ó tọ́ fún mi láti ronú báyìí nípa gbogbo yín[a], nítorí mo ní yín nínú ọkàn mi. Ní tòótọ́, nínú ẹ̀wọ̀n mi àti nínú ìgbèjà àti ìmúdájú ìhìnrere, gbogbo yín jẹ́ alábàápín oore-ọ̀fẹ́ pẹ̀lú mi.
  rationale: A rọ́pò ìsopọ̀ àṣàyàn “yálà ... tàbí” pẹ̀lú ìsopọ̀ àfikún “àti,” kí ó lè bá ἔν τε ... καὶ mu. A rọ́pò gbólóhùn tí kò rọrùn náà pẹ̀lú “ìgbèjà àti ìmúdájú ìhìnrere,” èyí tó ń ṣàfihàn ἀπολογία àti βεβαίωσις ní kedere. A pa ìtumọ̀ pàtàkì συγκοινωνούς μου τῆς χάριτος mọ́ ní “alábàápín oore-ọ̀fẹ́ pẹ̀lú mi,” a sì fi àlàyé ìsàlẹ̀ kan ṣoṣo sílẹ̀ fún àìdánilójú gírámà tí orísun ní.
