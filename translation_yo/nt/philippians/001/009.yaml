source:
  edition: SBLGNT
  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: yo
  text: 'Èyí sì ni mo ń gbàdúrà: pé kí ìfẹ́ yín túbọ̀ máa pọ̀ sí i nínú ìmọ̀ àti gbogbo ìfòyemọ̀[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìmọ̀ àti gbogbo ìfòyemọ̀”; ọ̀rọ̀ ìṣáájú Gíríìkì náà lè túmọ̀ sí ìbáṣepọ̀ tímọ́tímọ́. “Ìfòyemọ̀” tún lè túmọ̀ sí ìjìnlẹ̀ òye tàbí agbára láti mọ ohun tó yẹ ní ti ìwà.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: Èyí sì ni
  rationale: Ó pa àsopọ̀ καί àti agbára atọ́ka τοῦτο mọ́, ó sì jẹ́ ọ̀nà àdánidá láti yí padà láti inú ọpẹ́ Pọ́ọ̀lù sí ohun tí ó ń gbàdúrà fún.
- source_word: προσεύχομαι
  choice: mo ń gbàdúrà
  rationale: Àmì ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ hàn, gẹ́gẹ́ bí ọ̀rọ̀ ìṣe alásìkò ìsinsìnyí Gíríìkì, láì fi agbára tí kò sí nínú ọ̀rọ̀ náà kún un.
- source_word: ἵνα
  choice: pé kí
  rationale: Àpapọ̀ ‘pé kí’ ṣàfihàn àkóónú àdúrà náà àti ìfẹ́ ọkàn tó wà nínú ọ̀rọ̀ abẹ́ ἵνα lọ́nà àdánidá ní Yorùbá.
- source_word: ἀγάπη ὑμῶν
  choice: ìfẹ́ yín
  rationale: ‘Ìfẹ́’ ni ìtumọ̀ Yorùbá tó ṣe kedere fún ἀγάπη; ‘yín’ pa ẹni púpọ̀ nínú ὑμῶν mọ́.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον
  choice: máa pọ̀ sí i gidigidi
  rationale: Ó fi ìtẹ̀síwájú àti ìlọsíwájú tó lágbára hàn ní Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé Yorùbá kò nílò láti tún ‘sí i’ sọ lẹ́ẹ̀mejì gẹ́gẹ́ bí Gíríìkì.
- source_word: περισσεύῃ
  choice: máa pọ̀ sí i
  rationale: Ó mú èrò ìbísí lọ́pọ̀lọpọ̀ jáde, ó sì bá ọ̀nà tí Yorùbá fi ń sọ nípa ìfẹ́ mu ju àwòrán ‘ṣàn kọjá’ lọ.
- source_word: ἐν ἐπιγνώσει
  choice: nínú ìmọ̀
  rationale: Ó pa ìṣètò ọ̀rọ̀ ἐν mọ́, kò sì sọ ἐπίγνωσις di ọ̀rọ̀ ìmọ̀ ẹ̀kọ́ tó le tàbí ‘ìmọ̀ kíkún’ tí ó lè lágbára ju ohun tí àyíká béèrè lọ.
- source_word: πάσῃ αἰσθήσει
  choice: gbogbo òye
  rationale: Nínú àyíká yìí, αἴσθησις túmọ̀ sí òye ìwà rere àti agbára láti mọ ohun tó yẹ, kì í ṣe ìmọ̀lára ara lasan. ‘Gbogbo òye’ jẹ́ kedere, ó sì yẹ fún òǹkàwé Yorùbá òde òní.
theological_decisions:
- issue: Ìbáṣepọ̀ ἐν pẹ̀lú ìmọ̀ àti òye
  choice: nínú ìmọ̀ àti gbogbo òye
  alternative: pẹ̀lú ìmọ̀ àti gbogbo òye
  rationale: A pa àwòrán pé ìfẹ́ ń pọ̀ sí i nínú àyíká tàbí ẹ̀ka ìmọ̀ àti òye mọ́; àlàyé ìsàlẹ̀ fi ìtumọ̀ ìbáṣepọ̀ ‘pẹ̀lú’ sílẹ̀ gẹ́gẹ́ bí ohun tó tún ṣeé ṣe, láì yanju àìdánilójú Gíríìkì ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘òye’ gẹ́gẹ́ bí ọ̀rọ̀ àkọ́kọ́ tó rọrùn, a sì fi ‘ìfòyemọ̀’ àti ìtumọ̀ ìwà rere sínú àlàyé ìsàlẹ̀.
