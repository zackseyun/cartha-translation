  to: Ṣùgbọ́n àwọn yòókù ń kéde Mèsáyà nítorí ìfẹ́ láti gbé ara wọn ga, láìsí ìfẹ́ inú mímọ́, wọ́n rò pé àwọn yóò fa ìpọ́njú bá mi nígbà tí mo wà ní ẹ̀wọ̀n.[a]
