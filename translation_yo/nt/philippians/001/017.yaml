    issue: “kì í ṣe pẹ̀lú èrò mímọ́”
    rationale: Àpẹẹrẹ “kì í ṣe” lè fi ìṣe àṣà tàbí ìwà tó ń ṣẹlẹ̀ déédéé hàn. Gíríìkì οὐχ ἁγνῶς sọ ìdí tí ìkéde yìí kò fi mọ́; “láìsí ìfẹ́ inú mímọ́” sọ èyí ní kedere àti ní Yorùbá àdánidá.
  - severity: medium
    issue: “wọ́n yóò fi kún ìpọ́njú mi”
