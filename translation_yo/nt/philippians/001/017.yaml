  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà dáadáa: ìkéde Mèsáyà, ìfẹ́-ara-ẹni/ìfẹ́ láti gbé ara ẹni ga, àìmọ́tótó ìdí, àti èrò láti fa ìpọ́njú sí Pọ́ọ̀lù ní ipò ẹ̀wọ̀n rẹ̀. Ṣùgbọ́n “kì í ṣe” ní àyíká yìí lè dún bí ìwà tí ń ṣẹlẹ̀ déédéé ju ìsọdìpúpọ̀ “not sincerely” lọ. Ìtumọ̀ “fi kún ìpọ́njú mi” tún lè túmọ̀ sí pé ìpọ́njú ti wà tẹ́lẹ̀ tí wọ́n sì kan ń pọ̀ sí i, níbi tí ἐγείρειν ti fi ìmú ìpọ́njú ṣẹlẹ̀ hàn.'
  naturalness: Yorùbá náà ní ìforígbárí tó dára, ó sì ní àmì ohùn tó yẹ. “Láìsí ìfẹ́ inú mímọ́” jẹ́ ọ̀nà àdánidá sí i láti sọ ìdí tí kò mọ́, ju “kì í ṣe pẹ̀lú èrò mímọ́” lọ. “Nígbà tí mo wà ní ẹ̀wọ̀n” ṣàlàyé ipò Pọ́ọ̀lù ní ti ara, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé ń dá àwòrán gidi ‘ìdè’ dúró.
  terminology: “Mèsáyà” yẹ fún Χριστόν níbi tí ọ̀rọ̀ náà ti ń ṣiṣẹ́ bí oyè ẹni tí a ń kéde. “Ń kéde” bójú mu fún καταγγέλλουσιν. “Ìfẹ́ láti gbé ara wọn ga” ṣì jẹ́ ìtumọ̀ tó ṣeé gbà fún ἐριθεία, bí ó tilẹ̀ jẹ́ pé ó ń tẹnu mọ́ ìgbéga ara ẹni ju ìfẹ́ ẹgbẹ́/ìwà ìfọ̀kànbalẹ̀ ara ẹni lọ.
  issues:
