  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn yòókù ń kéde Mèsáyà nítorí ìfẹ́ láti gbé ara wọn ga, láìsí ìfẹ́ inú mímọ́, wọ́n rò pé àwọn yóò fa ìpọ́njú bá mi nígbà tí mo wà ní ẹ̀wọ̀n.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní ti gidi, “nínú àwọn ìdè mi”; ìyẹn ni pé, nígbà tí mo wà ní ẹ̀wọ̀n.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: ìfẹ́ láti gbé ara wọn ga
  rationale: Ó fi ìwà onímọtara-ẹni-nìkan àti ìlépa ipò tàbí èrè ara ẹni hàn, kì í ṣe ìmọtara-ẹni-nìkan lásán.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Níbí, ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí wọ́n ń kéde.
- source_word: καταγγέλλουσιν
  choice: ń kéde
  rationale: Ó pa ìtumọ̀ ìkéde ní gbangba mọ́ láì fi sí àyíká ìwàásù oníṣètò nìkan.
- source_word: οὐχ ἁγνῶς
  choice: kì í ṣe pẹ̀lú èrò mímọ́
  rationale: Nínú àyíká yìí, ἁγνῶς ń tọ́ka sí ìwà mímọ́ tàbí òótọ́ inú ìdí tí wọ́n fi ń ṣe é.
- source_word: οἰόμενοι
  choice: wọ́n rò pé
  rationale: Ó sọ ìrònú tàbí èrò wọn ní Yorùbá àdánidá.
- source_word: θλῖψιν ἐγείρειν
  choice: fi kún ìpọ́njú mi
  rationale: Gbólóhùn náà túmọ̀ sí mímú ìpọ́njú tàbí wàhálà dìde; ‘fi kún’ bá àyíká ìpọ́njú Pọ́ọ̀lù tó ti wà nínú ẹ̀wọ̀n mu, láì sọ ìtumọ̀ náà di wàhálà lásán.
- source_word: τοῖς δεσμοῖς μου
  choice: nínú ìdè mi
  rationale: Ó pa àwòrán gidi ‘ìdè’ mọ́, ó sì ń tọ́ka sí ipò ẹ̀wọ̀n Pọ́ọ̀lù.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nítorí pé ẹni tí wọ́n ń kéde ni ọ̀rọ̀ náà ń tọ́ka sí, lílo oyè ‘Mèsáyà’ jẹ́ kí ipa oyè náà hàn kedere.
- issue: Ìdí tí àwọn olùkéde náà fi ń kéde
  choice: ìfẹ́ láti gbé ara wọn ga ... kì í ṣe pẹ̀lú èrò mímọ́
  alternative: ìjàkadì ẹgbẹ́ ... láìsí òótọ́ inú
  rationale: Ẹsẹ náà dá ìdí onímọtara-ẹni-nìkan wọn lẹ́bi, ṣùgbọ́n kò sọ pé ohun tí wọ́n kéde nípa Mèsáyà jẹ́ èké; ìtumọ̀ náà pa ìyàtọ̀ yìí mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ìdè’ pa àwòrán Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé mú ìtumọ̀ ẹ̀wọ̀n rẹ̀ ṣe kedere.
