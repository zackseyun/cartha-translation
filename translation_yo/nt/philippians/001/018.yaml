id: PHP.1.18
reference: Philippians 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: yo
  text: Kí wá ni? Ohun kan ṣoṣo ni pé, ní gbogbo ọ̀nà, yálà ní àwáwí[a] tàbí ní òtítọ́, Mèsáyà[b] ni a ń kéde, mo sì ń yọ̀ nínú èyí. Bẹ́ẹ̀ ni, màá sì yọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ète àgàbàgebè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kristi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Kí wá ni?
  rationale: Ó pa ìbéèrè àsọyé Pọ́ọ̀lù mọ́ ní ṣókí, láì fi ìtumọ̀ tí ó pọ̀ ju ọ̀rọ̀ Gíríìkì lọ kún un.
- source_word: πλὴν ὅτι
  choice: Ohun kan ṣoṣo ni pé
  rationale: Ó fi hàn pé Pọ́ọ̀lù ń darí àfiyèsí sí kókó pàtàkì kan ṣoṣo láìka ohun tó ṣáájú sí.
- source_word: παντὶ τρόπῳ
  choice: ní gbogbo ọ̀nà
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘ní gbogbo ọ̀nà’ tàbí ‘ní gbogbo irú ọ̀nà,’ ó sì pa ìtumọ̀ alákaakiri náà mọ́.
- source_word: προφάσει
  choice: ní àwáwí
  rationale: ‘Àwáwí’ lè túmọ̀ sí ohun tí a fi bo ète tòótọ́ mọ́lẹ̀; ó pa ìtumọ̀ àgàbàgebè mọ́ láì ṣàlàyé ète ọkàn ju bí ọ̀rọ̀ náà ṣe sọ lọ.
- source_word: ἀληθείᾳ
  choice: ní òtítọ́
  rationale: Ó pa ìfarawé tààrà tó wà láàárín προφάσει àti ἀληθείᾳ mọ́.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: Níbí, Χριστός jẹ́ oyè ẹni tí a ń kéde; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde kedere ju lílo rẹ̀ bí orúkọ lọ.
- source_word: καταγγέλλεται
  choice: ni a ń kéde
  rationale: Ìṣètò ‘Mèsáyà ni a ń kéde’ fi ẹni tí a ń kéde sí iwájú, ó sì sọ ìṣe àkókò ìsinsìnyí àti ìtumọ̀ ìkéde ní gbangba di Yorùbá àdánidá.
- source_word: ἐν τούτῳ χαίρω
  choice: inú mi sì ń dùn nínú èyí
  rationale: Ó so ayọ̀ Pọ́ọ̀lù mọ́ òtítọ́ tí ó ṣẹ̀ṣẹ̀ sọ, gẹ́gẹ́ bí gbólóhùn Gíríìkì ṣe rí.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: Bẹ́ẹ̀ ni, inú mi yóò sì máa dùn
  rationale: Ó mú ìtẹnumọ́ àti ìrètí ọjọ́ iwájú inú ἀλλὰ καί àti ọ̀rọ̀-ìṣe ọjọ́ iwájú χαρήσομαι jáde ní Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nítorí pé ọ̀rọ̀ náà dúró gẹ́gẹ́ bí oyè ẹni tí a ń kéde ní àyíká yìí, ‘Mèsáyà’ pa ìtumọ̀ oyè Gíríìkì náà mọ́; àkọsílẹ̀ ìsàlẹ̀ ojú ìwé sì jẹ́ kí òǹkàwé rí àṣàyàn ‘Kristi’.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo ‘a ń kéde’ gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún gbólóhùn aláìlórúkọ olùṣe, dípò fífi ọ̀nà gírámà èdè Gẹ̀ẹ́sì tàbí Gíríìkì lé Yorùbá lórí.
