  yaml_path: translation/nt/philippians/001/030.yaml
  text: having the same struggle that you saw in me and now hear that I still have.
translation:
  language: yo
  text: ẹ̀yin ní ìjàkadì kan náà tí ẹ rí nínú mi, tí ẹ sì ń gbọ́ nípa mi nísinsìnyí.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: ìjàkadì
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìsapá tàbí ìjà líle; “ìjàkadì” jẹ́ èdè Yorùbá àdánidá tí ó pa àwòrán ìjà àti ìfaradà mọ́.
- source_word: ἔχοντες
  choice: ẹ̀yin ń ní
  rationale: Participle náà ń bá àṣẹ inú ẹsẹ 27 lọ, ó sì ṣàpèjúwe ipò àwọn onígbàgbọ́; ìtumọ̀ yìí pa ìtẹ̀síwájú iṣẹ́ náà mọ́.
- source_word: οἷον εἴδετε ἐν ἐμοὶ
  choice: tí ẹ rí pé mo ní
  rationale: “Nínú mi” ní Gíríìkì túmọ̀ sí ìjàkadì tí wọ́n rí nínú ìrírí Pọ́ọ̀lù; àtúmọ̀ yìí jẹ́ kedere ní Yorùbá láìfi èrò míì kún un.
- source_word: καὶ νῦν ἀκούετε ἐν ἐμοί
  choice: tí ẹ sì ń gbọ́ nísinsìnyí pé mo ṣì ní
  rationale: “Ṣì” mú kí ìtumọ̀ àyíká hàn pé ìjàkadì tí wọ́n ti rí tẹ́lẹ̀ ń bá a lọ nísinsìnyí, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ yìí wà nípasẹ̀ àkópọ̀ “nísinsìnyí” àti “nínú mi,” kì í ṣe gẹ́gẹ́ bí adverb ọ̀tọ̀ nínú Gíríìkì.
theological_decisions:
- issue: Irú ìjàkadì tí Pọ́ọ̀lù àti àwọn ará Fílípì ní
  choice: A kò sọ ní pàtó pé ó jẹ́ inúnibíni, ìjìyà, tàbí ogun ẹ̀mí.
  alternative: Ṣàlàyé ἀγών gẹ́gẹ́ bí “ìjà lòdì sí inúnibíni.”
  rationale: Gíríìkì fi irú ìjàkadì náà sílẹ̀ ní ààyè díẹ̀, bí ó tilẹ̀ jẹ́ pé àyíká tọ́ka sí ìjìyà nítorí ìgbàgbọ́; ìtumọ̀ kò gbọ́dọ̀ dín àìlójú tó wà nínú ọ̀rọ̀ náà kù.
translation_notes:
  register: Èdè Yorùbá àdánidá, ọlọ́lá, tí ó sì ṣeé lóye ni a lò. Ẹsẹ̀ yìí jẹ́ àfikún participial sí gbolohun tó bẹ̀rẹ̀ ní ẹsẹ 27, nítorí náà a kò fi àmì pé ó jẹ́ gbolohun tuntun tí ó dá dúró sí i.
