revisions:
- from: 'Ṣùgbọ́n àwọn méjèèjì ń há mi mọ́lẹ̀. Mo ní ìfẹ́ láti kúrò lọ[a], kí n sì wà pẹ̀lú Mèsáyà[b], nítorí èyí dára púpọ̀ jù.


