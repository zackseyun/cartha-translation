  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: yo
  text: 'Ṣùgbọ́n mo wà láàárín àwọn méjèèjì, wọ́n sì ń há mi mọ́lẹ̀. Mo ní ìfẹ́ láti kúrò lọ[a] àti láti wà pẹ̀lú Mèsáyà[b], nítorí èyí dára púpọ̀ sí i.


    [a] Tàbí “láti kú.” Ní ìtumọ̀ gangan, “láti kúrò lọ.”


    [b] Tàbí “Kristi.” “Kristi” túmọ̀ sí “Ẹni Àmì Òróró.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “láti kú.” Ní ìtumọ̀ gangan, “láti kúrò lọ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “Kristi.” “Kristi” túmọ̀ sí “Ẹni Àmì Òróró.”
    reason: alternative_reading
lexical_decisions:
- source_word: συνέχομαι
  choice: ń há mi mọ́lẹ̀
  rationale: Ó fi hàn pé àwọn àṣàyàn méjì náà ń tẹ Pọ́ọ̀lù mọ́ra, wọ́n sì ń mú un wà nínú ìṣòro láti yan ọ̀kan; ó sún mọ́ agbára ọ̀rọ̀ Gíríìkì ju fífi hàn pé ọkàn rẹ̀ kàn ń pín sí méjì lọ.
- source_word: ἐκ τῶν δύο
  choice: àwọn méjèèjì
  rationale: Pẹ̀lú ‘ń há mi mọ́lẹ̀,’ èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó wà láàárín àṣàyàn méjì.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: Mo ní ìfẹ́
  rationale: Ó pa ọ̀rọ̀-orúkọ ‘ìfẹ́’ mọ́, ó sì mú gbólóhùn náà ṣe kedere ní Yorùbá.
- source_word: ἀναλῦσαι
  choice: láti kúrò lọ
  rationale: Ó pa àwòrán ‘kíkọ̀ lọ’ tó wà nínú Gíríìkì mọ́, láì sọ ‘láti kú’ ní tààràtà nínú ẹsẹ náà; àlàyé ìsàlẹ̀ fi ìtumọ̀ àfiwé náà hàn.
- source_word: Χριστῷ
  choice: Mèsáyà
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Ẹni Àmì Òróró; ‘Mèsáyà’ mú oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ tún fúnni ní ‘Kristi.’
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: nítorí èyí dára púpọ̀ jù
  rationale: Ó mú ìfiwéra alágbára inú ọ̀rọ̀ Gíríìkì jáde ní Yorùbá tó rọrùn, tó sì ṣe àdánidá.
theological_decisions:
- issue: Ìdàpọ̀ pẹ̀lú Mèsáyà lẹ́yìn ikú
  choice: láti kúrò lọ, kí n sì wà pẹ̀lú Mèsáyà
  alternative: láti kú kí n sì lọ sí ọ̀run lẹ́sẹ̀kẹsẹ̀
  rationale: Ìtumọ̀ náà sọ ohun tí Gíríìkì sọ ní pàtó—kíkọ̀ lọ àti wíwà pẹ̀lú Mèsáyà—láì fi ‘ọ̀run’ tàbí àlàyé nípa àsìkò kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A pín gbólóhùn náà sí méjì kí ìtumọ̀ rẹ̀ lè ṣe kedere láì yí ìbáṣepọ̀ àwọn èrò inú Gíríìkì padà.
