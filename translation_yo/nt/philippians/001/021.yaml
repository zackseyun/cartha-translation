id: PHP.1.21
reference: Philippians 1:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: yo
  text: Nítorí, fún mi, láti wà láàyè ni Kristi[a], láti kú sì ni èrè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Mèsáyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: ní tèmi
  rationale: Ọ̀rọ̀ yìí mú ojú-ìwòye Pọ́ọ̀lù fúnra rẹ̀ jáde ní Yorùbá àdánidá, ó sì bá ìtumọ̀ dátífù náà mu.
- source_word: γὰρ
  choice: Nítorí pé
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé èrò tó ṣáájú.
- source_word: τὸ ζῆν
  choice: láti wà láàyè
  rationale: Ó tú infinitive oní-àtíkì náà sí Yorùbá tó ṣe kedere, ó sì pa ìwọ̀ntúnwọ̀nsì rẹ̀ mọ́ pẹ̀lú ‘láti kú.’
- source_word: Χριστὸς
  choice: Kristi
  rationale: ‘Kristi’ ni àtúmọ̀ tí ó ti wọ́pọ̀ jù lọ ní Yorùbá fún Χριστός, ó sì lè ṣiṣẹ́ gẹ́gẹ́ bí orúkọ tàbí oyè ní ọ̀rọ̀ Pọ́ọ̀lù; àṣàyàn oyè ‘Mèsáyà’ wà nínú àlàyé ìsàlẹ̀.
- source_word: τὸ ἀποθανεῖν
  choice: láti kú
  rationale: Ó pa ìṣọ̀kan àti ìfararọ̀ mọ́ pẹ̀lú ‘láti wà láàyè.’
- source_word: κέρδος
  choice: èrè
  rationale: ‘Èrè’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ohun tí a jèrè tàbí àǹfààní, ó sì pa ìṣòro ọ̀rọ̀ Gíríìkì náà mọ́ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
theological_decisions:
- issue: Bí Χριστός ṣe ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ tàbí oyè
  choice: Kristi
  alternative: Mèsáyà
  rationale: Àyíká ọ̀rọ̀ kò fipá mú kí a yan boya orúkọ tàbí oyè nìkan; nítorí náà, a lo ‘Kristi’ nínú ẹsẹ̀, a sì pa ‘Mèsáyà’ mọ́ gẹ́gẹ́ bí àṣàyàn nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ní tèmi’ láti tẹnu mọ́ ojú-ìwòye ẹni náà, a sì pa ìfararọ̀ ṣókí ti ‘láti wà láàyè / láti kú’ mọ́.
