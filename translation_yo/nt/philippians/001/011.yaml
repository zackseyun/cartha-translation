id: PHP.1.11
reference: Philippians 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: yo
  text: ẹ sì ti kún fún èso òdodo[a] tí ó wá nípasẹ̀ Jésù Mèsáyà[b], fún ògo àti ìyìn Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘èso ìdájọ́ òdodo.’
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, ‘Jésù Kristi’; ‘Mèsáyà’ ni a fi túmọ̀ Christos gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: ẹ sì ti kún fún
  rationale: Ọ̀rọ̀ aláìṣe yìí wà ní àkókò pípé, ó sì ń tọ́ka sí ipò tí ó ti yọrí sí; ‘ẹ sì ti kún fún’ jẹ́ Yorùbá àdánidá tí ó tún so ẹsẹ̀ náà mọ́ gbólóhùn tó ṣáájú.
- source_word: καρπὸν
  choice: èso
  rationale: ‘Èso’ pa àwòrán àkàwé ti ohun rere tí ìgbésí ayé ń mú jáde mọ́, ó sì jẹ́ ọ̀rọ̀ tí gbogbo ènìyàn lè lóye.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: ‘Òdodo’ lè tọ́ka sí ìwà títọ́ níwájú Ọlọ́run àti sí ṣíṣe ohun tó tọ́; kò fi tipátipá pinnu irú ìbáṣepọ̀ gírámà tó wà láàárín ‘èso’ àti ‘òdodo.’
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: tí ó wá nípasẹ̀ Jésù Mèsáyà
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ oníṣe kejì ń fi ọ̀nà tàbí aṣojú hàn; ‘nípasẹ̀’ pa èrò yẹn mọ́, ‘tí ó wá’ sì mú gbólóhùn náà ṣàn dáadáa ní Yorùbá.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: A túmọ̀ Χριστός gẹ́gẹ́ bí oyè ‘Mèsáyà,’ kì í ṣe bí orúkọ kejì lásán.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: fún ògo àti ìyìn Ọlọ́run
  rationale: ‘Fún’ fi ète tàbí àbájáde εἰς hàn ní Yorùbá àdánidá, ó sì pa ‘ògo àti ìyìn’ méjèèjì mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘èso òdodo’
  choice: A pa gbólóhùn náà mọ́ ní ṣókí gẹ́gẹ́ bí ‘èso òdodo,’ èyí tí ó lè jẹ́ èso tí òdodo ń dá sílẹ̀ tàbí èso tí ó ní ìwà òdodo.
  alternative: Láti túmọ̀ ọ́ ní pàtó sí ‘èso tí í ṣe òdodo’ tàbí ‘èso tí ó ń mú ènìyàn di olódodo.’
  rationale: Àpapọ̀ ọ̀rọ̀-orúkọ Gíríìkì náà ní ìtumọ̀ tó ju ọ̀kan lọ. Àyíká ẹsẹ̀ náà ń tọ́ka sí èso rere tí ó wá nípasẹ̀ Jésù Mèsáyà, ṣùgbọ́n ìtumọ̀ Yorùbá kò yẹ kí ó pinnu irú ìbáṣepọ̀ náà ju bí orísun ṣe ṣe lọ.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣeé lóye lójoojúmọ́. A lo àmì ohùn ní kíkún níbi tó bá yẹ. ‘Ẹ sì ti kún fún’ ń bá ìṣàn gbólóhùn àdúrà tó bẹ̀rẹ̀ ní àwọn ẹsẹ̀ ṣáájú mu; ‘èso òdodo’ sì pa àkàwé àti àìdánilójú gírámà orísun mọ́.
