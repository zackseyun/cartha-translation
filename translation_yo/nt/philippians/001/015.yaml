id: PHP.1.15
reference: Philippians 1:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: yo
  text: Àwọn kan ń kéde Mèsáyà[a] nítorí ìlara àti ìfigagbága, ṣùgbọ́n àwọn mìíràn ń kéde rẹ̀ nítorí inú rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Ọ̀rọ̀ Gíríìkì náà ni Χριστός (Christos).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: Àwọn kan … àwọn mìíràn
  rationale: Ó fi ẹgbẹ́ méjì tí ó yàtọ̀ síra hàn lọ́nà àdánidá ní Yorùbá, ó sì pa ìyàtọ̀ μὲν … δὲ mọ́.
- source_word: διὰ φθόνον
  choice: nítorí ìlara
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń sọ ìdí tàbí ohun tó ń sún wọn ṣe é; “ìlara” bá φθόνος mu.
- source_word: ἔριν
  choice: ìfigagbága
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ìdíje oníjà láàárín àwọn ènìyàn, kì í ṣe ìjà ara nìkan.
- source_word: δι’ εὐδοκίαν
  choice: nítorí inú rere
  rationale: Ó fi èrò rere hàn gẹ́gẹ́ bí ohun tó ń sún ẹgbẹ́ kejì ṣe é, ní ìdàkejì ìlara àti ìfigagbága.
- source_word: τὸν Χριστόν
  choice: Mèsáyà
  rationale: Àpilẹ̀kọ náà ṣe àfihàn Χριστός gẹ́gẹ́ bí oyè; “Mèsáyà” mú ìtumọ̀ oyè náà jáde ní kedere.
- source_word: κηρύσσουσιν
  choice: ń kéde
  rationale: “Kéde” pa ìtumọ̀ pípolongo ìhìn ní gbangba mọ́ láìfi ìtumọ̀ iṣẹ́ ìwàásù inú ètò ṣọ́ọ̀ṣì kún un.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστός níbi yìí
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ní Gíríìkì; a fi àṣàyàn ìtumọ̀ tí a sábà máa ń lò sí àlàyé ìsàlẹ̀ láìyanjú ìyàtọ̀ náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A tún “ń kéde” sọ ní abala kejì kí ìtumọ̀ má bà a ṣókùnkùn, bó tilẹ̀ jẹ́ pé Gíríìkì fi ọ̀rọ̀-ìṣe kan ṣoṣo ṣe àkóso ẹgbẹ́ méjèèjì.
