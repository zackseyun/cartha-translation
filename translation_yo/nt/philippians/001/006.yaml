id: PHP.1.6
reference: Philippians 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: yo
  text: 'Mo ní ìdánilójú nípa ohun yìí gan-an: ẹni tí ó bẹ̀rẹ̀ iṣẹ́ rere kan láàárín yín[a] yóò mú un dé ìparí títí di ọjọ́ Mèsáyà Jésù[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú yín.”
    reason: lexical_alternative
  - marker: b
    text: Lọ́nà ìbílẹ̀, “Krístì Jésù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Mo ní ìdánilójú
  rationale: Ó sọ ìgbẹ́kẹ̀lé Pọ́ọ̀lù ní ọ̀nà Yorùbá tí ó ṣe kedere, bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ participle tí ó so mọ́ gbólóhùn tó ṣáájú.
- source_word: αὐτὸ τοῦτο
  choice: nípa ohun yìí gan-an
  rationale: “Gan-an” pa ìtẹnumọ́ inú àpapọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ láì jẹ́ kí èdè Yorùbá le.
- source_word: ὁ ἐναρξάμενος
  choice: ẹni tí ó bẹ̀rẹ̀
  rationale: Ó pa ẹni tó ṣe iṣẹ́ náà mọ́ gẹ́gẹ́ bí ẹni kan láì fi orúkọ Ọlọ́run kún ohun tí Gíríìkì kò sọ ní tààrà.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà jẹ́ ọ̀pọ̀, ó sì ń bá gbogbo ìjọ Fílípì sọ̀rọ̀; “láàárín yín” fi ìtumọ̀ àwùjọ hàn, nígbà tí “nínú yín” ṣì ṣeé ṣe, a sì fi sí àlàyé ìsàlẹ̀.
- source_word: ἔργον ἀγαθὸν
  choice: iṣẹ́ rere kan
  rationale: Ìtumọ̀ tààrà tí ó sì jẹ́ èdè Yorùbá àdánidá ni; “kan” fi àìdánimọ̀ ọ̀rọ̀ náà hàn.
- source_word: ἐπιτελέσει
  choice: yóò mú un dé ìparí
  rationale: Ó sọ pé iṣẹ́ náà yóò dé òpin rẹ̀ ní kíkún, láì lo ọ̀rọ̀ tí ó lè túmọ̀ sí àìlẹ́ṣẹ̀ nípa ìwà.
- source_word: ἄχρι ἡμέρας
  choice: ní ọjọ́
  rationale: Nínú àkópọ̀ ọ̀rọ̀ yìí, ó fi ọjọ́ náà hàn gẹ́gẹ́ bí ibi tí iṣẹ́ náà yóò ti pé; a pa ìtumọ̀ tààrà “títí di ọjọ́” mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: “Mèsáyà” túmọ̀ Χριστός gẹ́gẹ́ bí oyè, dípò kí a fi àkọsílẹ̀ ìbílẹ̀ “Krístì” sílẹ̀ láì túmọ̀ rẹ̀.
theological_decisions:
- issue: Bóyá iṣẹ́ rere náà wà nínú ẹnì kọ̀ọ̀kan tàbí láàárín gbogbo ìjọ
  choice: láàárín yín
  alternative: nínú yín
  rationale: Ọ̀pọ̀ arọ́pò-orúkọ àti àyíká lẹ́tà sí ìjọ ṣe àtìlẹ́yìn fún ìtumọ̀ àwùjọ, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ ẹni kọ̀ọ̀kan mọ́ gẹ́gẹ́ bí ohun tó ṣeé ṣe.
- issue: Bóyá ἄχρι ἡμέρας túmọ̀ sí pé iṣẹ́ náà yóò pé ní ọjọ́ náà tàbí pé yóò máa lọ títí di ọjọ́ náà
  choice: ní ọjọ́ Mèsáyà Jésù
  alternative: títí di ọjọ́ Mèsáyà Jésù
  rationale: Ọ̀rọ̀ àkọ́kọ́ mú ibi ìparí iṣẹ́ náà ṣe kedere; àlàyé ìsàlẹ̀ pa ìtumọ̀ àsìkò tí ἄχρι lè ní mọ́, láì sọ ìbéèrè nípa ìlànà tàbí àsìkò ìpé iṣẹ́ náà di ẹ̀kọ́ ìgbàgbọ́ pàtó.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ; a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó lè fi ìtumọ̀ ẹgbẹ́ kan lé ẹsẹ náà lórí.
