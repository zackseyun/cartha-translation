  terminology: “Mèsáyà Jésù” jẹ́ ìtumọ̀ tó yẹ fún Χριστοῦ Ἰησοῦ nínú ìlànà iṣẹ́ yìí. “Láàárín yín” ń pa ìfẹ̀hàn àwùjọ tí ἐν ὑμῖν lè ní mọ́, pẹ̀lú àlàyé “nínú yín” gẹ́gẹ́ bí yíyàn mìíràn.
