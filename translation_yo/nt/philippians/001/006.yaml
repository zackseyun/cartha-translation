  source_fidelity: Ìtumọ̀ náà tọ́ka dáadáa sí πεποιθὼς, αὐτὸ τοῦτο, ἐν ὑμῖν, àti ἐπιτελέσει. Ṣùgbọ́n “ní ọjọ́” kò tú ἄχρι ἡμέρας, tí ó jẹ́ gbolohun àsìkò “títí di ọjọ́,” ní kíkún. Àlàyé ìsàlẹ̀ kò yẹ kí ó rọ́pò ìtumọ̀ pàtàkì tí ó wà nínú ọ̀rọ̀ Gíríìkì.
