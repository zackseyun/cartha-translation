  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó túmọ̀ sí “nígbà gbogbo” tàbí “ní gbogbo ìgbà,” ó sì bá àkójọpọ̀ ọ̀rọ̀ náà mu lọ́nà àdánidá.
- source_word: ἐν πάσῃ δεήσει μου
  choice: nínú gbogbo àdúrà mi
  rationale: δέησις jẹ́ ẹ̀bẹ̀ tàbí àdúrà ìbéèrè; “àdúrà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún gbogbo ènìyàn, nígbà tí “gbogbo” pa πάσῃ mọ́.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: fún gbogbo yín
  rationale: Ní àyíká àdúrà, ὑπέρ túmọ̀ sí gbígbàdúrà nítorí tàbí fún ẹnì kan; “fún gbogbo yín” jẹ́ àdánidá, ó sì pa ìtẹnumọ́ πάντων mọ́.
- source_word: μετὰ χαρᾶς
  choice: fi ayọ̀
  rationale: “Fi ayọ̀” sọ ọ̀nà tàbí ìmọ̀lára tí Pọ́ọ̀lù fi ń gbàdúrà, ó sì jẹ́ Yorùbá àdánidá.
- source_word: τὴν δέησιν ποιούμενος
  choice: mo máa ń ... gbàdúrà
  rationale: Ìtumọ̀ gangan ni “ní ṣíṣe ẹ̀bẹ̀ náà”; Yorùbá àdánidá lo ọ̀rọ̀-ìṣe “gbàdúrà.” Àkópọ̀ rẹ̀ pẹ̀lú πάντοτε ń fi ìṣe tí ó máa ń ṣẹlẹ̀ hàn.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A fi àmi ohùn sí àwọn ọ̀rọ̀ níbi tó yẹ. Ẹsẹ̀ yìí ń bá gbólóhùn tó bẹ̀rẹ̀ ní ẹsẹ̀ 3 lọ, nítorí náà a pa àmì kọ́ńmá sí òpin.
