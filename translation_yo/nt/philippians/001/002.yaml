id: PHP.1.2
reference: Philippians 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ àti àlàáfíà láti ọ̀dọ̀ Ọlọ́run, Baba wa, àti Olúwa Jésù Mèsáyà[a][b][c] wà fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Ọ̀gá.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Olúwa Jésù, ẹni tí í ṣe Mèsáyà.”
    reason: previous_rendering
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: “Oore-ọ̀fẹ́” jẹ́ ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún inú rere àti ojúrere tí a fi fúnni lọ́fẹ̀ẹ́; ó sì pa ìwọ̀n ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tí χάρις ní nínú lẹ́tà Paulu mọ́.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ọ̀nà yìí ni Yorùbá àdánidá fi ń sọ ohun rere tí a ń fẹ́ tàbí tí a ń ké sí àwọn ènìyàn púpọ̀.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: “Àlàáfíà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìbàlẹ̀ ọkàn, ìrẹ́pọ̀ àti ire gbogbo tí εἰρήνη lè tọ́ka sí nínú ìkíni yìí.
- source_word: ἀπό
  choice: láti ọ̀dọ̀
  rationale: Ó fi orísun oore-ọ̀fẹ́ àti àlàáfíà hàn ní Yorùbá kedere.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Ọlọ́run Baba wa
  rationale: 'A ka ìsopọ̀ náà gẹ́gẹ́ bí àfikún àpèjúwe: Ọlọ́run, ẹni tí í ṣe Baba wa. Ìtumọ̀ yìí jẹ́ kedere, ó sì bá ìlò Yorùbá mu.'
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” pa ipò gíga àti agbára κύριος mọ́, ó sì jẹ́ orúkọ oyè Kristẹni tí ó ti wọ́pọ̀ ní Yorùbá.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: “Mèsáyà” mú ìtumọ̀ Χριστός gẹ́gẹ́ bí orúkọ oyè Ẹni Àmìòróró hàn gbangba, dípò kí a fi àkọsílẹ̀-ohùn “Kristi” nìkan sílẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú ìkíni Paulu
  choice: Mèsáyà
  alternative: Kristi
  rationale: Bí ó tilẹ̀ jẹ́ pé Χριστός lè dà bí apá kan orúkọ Jesu nínú lẹ́tà Paulu, ìtumọ̀ orúkọ oyè náà ṣì ṣeé gbọ́ níbí. “Mèsáyà” pa ìtumọ̀ Ẹni Àmìòróró mọ́ láìfi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
- issue: Bí a ṣe túmọ̀ κυρίου
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” dára jù fún ipò àti ìwọ̀n ọ̀rọ̀ Kristẹni inú gbólóhùn yìí; “Ọ̀gá” ṣeé ṣe ní ti èdè ṣùgbọ́n ó lè dín agbára oyè náà kù.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀ àti èyí tí ó yẹ fún ìkíni lẹ́tà. Ìṣètò “Kí … wà fún yín” jẹ́ àdánidá ní Yorùbá, ó sì fi hàn pé gbólóhùn náà jẹ́ ìbùkún, kì í ṣe ìròyìn lásán. A lo àmì ohùn ní kíkún níbi tí ó yẹ.
