  - severity: low
    issue: Ibi àmì akọsílẹ̀ [b] kò fara mọ́ ‘iṣẹ́ eléso’ ní tààrà.
    rationale: Àkọsílẹ̀ náà ṣàlàyé καρπὸς ἔργου; nítorí náà, ó yẹ kí àmì rẹ̀ wà lẹ́yìn “eléso,” kì í ṣe lẹ́yìn “mi.”
  - severity: low
    issue: Àtòjọ ‘èyí tí èmi yóò yàn, èmi kò mọ̀’ le díẹ̀.
    rationale: Àtúnṣe náà jẹ́ ti ìmú-ọrọ̀ Yorùbá nìkan; kò yí ìtumọ̀ tàbí àìdánilójú αἱρήσομαι οὐ γνωρίζω padà.
