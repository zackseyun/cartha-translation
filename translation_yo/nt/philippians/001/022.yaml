  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń gbé èrò pàtàkì Gíríìkì náà kalẹ̀ dáadáa: ìwàláàyè tí ń tẹ̀síwájú nínú ara àti iṣẹ́ tí ń so èso fún Paulu, pẹ̀lú àìmọ̀ ohun tí yóò yàn. Síbẹ̀, “ẹran ara” kì í ṣe ọ̀nà Standard Yorùbá tó rọrùn tàbí tó wọ́pọ̀ jù lọ ní àyíká yìí; “nínú ara” ń sọ ìwàláàyè nínú ara di mímọ̀ dáadáa láì mú σάρξ dà bí ìfẹ́kúfẹ̀ẹ́ ẹlẹ́ṣẹ̀.'
  naturalness: “Èyí tí èmi yóò yàn, èmi kò mọ̀” lóye, ṣùgbọ́n ó ní ìṣàfihàn-ọrọ̀ tí ó le díẹ̀. “Èyí tí màá yàn ni mi ò mọ̀” jẹ́ Yorùbá ìgbàlódé tó dára, ó sì pa ìtẹnumọ́ àti àìdánilójú ìpínrọ̀ Gíríìkì mọ́. A tún gbe àmì akọsílẹ̀ iṣẹ́ eléso sí ibi tí ó ń tọ́ka sí gangan.
  terminology: “Ara” dára fún ἐν σαρκί níbí, nítorí àyíká náà jẹ́ ìwàláàyè nínú ara lórí ayé, kì í ṣe ‘ẹ̀dá ẹlẹ́ṣẹ̀.’ “Iṣẹ́ eléso” jẹ́ ìtumọ̀ tó dára fún καρπὸς ἔργου, bó tilẹ̀ jẹ́ pé gbolohun Gíríìkì náà ní ìṣọ̀kan kúkúrú.
