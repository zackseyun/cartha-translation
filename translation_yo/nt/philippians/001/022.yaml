id: PHP.1.22
reference: Philippians 1:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: yo
  text: Ṣùgbọ́n bí wíwà láàyè nínú ara[a] bá jẹ́ iṣẹ́ eléso[b] fún mi—síbẹ̀, èyí tí màá yàn ni mi ò mọ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ẹran ara.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “èso iṣẹ́ fún mi” tàbí “iṣẹ́ tí ń so èso fún mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: wíwà láàyè
  rationale: Ọ̀rọ̀-orúkọ tí a dá láti inú ọ̀rọ̀-ìṣe yìí mú ìtumọ̀ articular infinitive náà jáde, ó sì tọ́ka sí bíbá ìgbésí ayé ti ìsinsìnyí lọ.
- source_word: ἐν σαρκί
  choice: nínú ẹran ara
  rationale: Yíyan ‘ẹran ara’ pa àwòrán ọ̀rọ̀ Paulu mọ́, nígbà tí àyíká ẹsẹ̀ náà fi hàn pé ó ń sọ̀rọ̀ nípa ìwàláàyè ti ara lórí ilẹ̀ ayé, kì í ṣe ẹ̀dá ẹlẹ́ṣẹ̀.
- source_word: καρπὸς ἔργου
  choice: iṣẹ́ eléso
  rationale: Gbólóhùn Gíríìkì náà kúkúrú, ó sì lè túmọ̀ sí ‘èso iṣẹ́’ tàbí ‘iṣẹ́ tí ń so èso.’ ‘Iṣẹ́ eléso’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti mú àwọn èrò méjèèjì pọ̀.
- source_word: αἱρήσομαι
  choice: èmi yóò yàn
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí yíyan láàárín àwọn ohun méjì; ‘yàn’ ni ọ̀rọ̀ Yorùbá tó ṣe tààrà jù.
- source_word: οὐ γνωρίζω
  choice: èmi kò mọ̀
  rationale: Bí ó tilẹ̀ jẹ́ pé γνωρίζω tún lè túmọ̀ sí ‘sọ di mímọ̀,’ níbí ó ń fi àìdánilójú Paulu hàn; ‘èmi kò mọ̀’ bá àyíká náà mu.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ẹsẹ̀ yìí
  choice: ìwàláàyè ti ara lórí ilẹ̀ ayé (‘nínú ẹran ara’)
  alternative: ẹ̀dá ẹlẹ́ṣẹ̀ tàbí ìfẹ́kúfẹ̀ẹ́ ara
  rationale: Àyíká náà fi bíbá ìgbésí ayé yìí lọ wé lílọ láti wà pẹ̀lú Kristi; nítorí náà, σάρξ ń tọ́ka sí ìwàláàyè nínú ara, kì í ṣe ìwà ìbàjẹ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Àtòjọ ọ̀rọ̀ ní apá ìkẹyìn mọ́ ìtẹnumọ́ àti díẹ̀ lára ìṣòro ìsopọ̀ gbolohun Gíríìkì náà mọ́, láì fi ‘nígbà náà’ kún un tàbí pinnu ohun tí Paulu kò sọ ní kedere.
