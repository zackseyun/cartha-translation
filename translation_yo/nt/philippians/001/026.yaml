  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: yo
  text: kí ìṣògo yín[a] nínú Mèsáyà Jésù[b] lè túbọ̀ pọ̀ sí i nítorí mi[c], nípasẹ̀ wíwá mi sọ́dọ̀ yín lẹ́ẹ̀kan sí i[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ìṣògo” tún lè túmọ̀ sí “ìdí yín láti ṣògo.”
    reason: lexical_alternative
  - marker: b
    text: '“Mèsáyà Jésù” ni a tún lè pè ní “Kristi Jésù.” Ó tún ṣeé ṣe láti so “nínú Mèsáyà Jésù” mọ́ “lè túbọ̀ pọ̀ sí i”: “kí ìṣògo yín lè túbọ̀ pọ̀ sí i nínú Mèsáyà Jésù.”'
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: Ní ọ̀rọ̀-ní-ọ̀rọ̀, “nínú mi”; níbí ó lè túmọ̀ sí “nítorí mi” tàbí “ní tìtorí mi.”
    reason: lexical_alternative
  - marker: d
    text: “Wíwá mi” tún lè jẹ́ “wíwà mi pẹ̀lú yín”; ọ̀rọ̀ Gíríìkì lè tọ́ka sí dídé tàbí wíwà ẹni níbẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti fi ìdí tàbí àbájáde hàn, ó sì pa agbára ọ̀rọ̀ ìfẹ́sẹ̀múlẹ̀ inú èdè Gíríìkì mọ́.
- source_word: καύχημα
  choice: ìṣògo
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí ṣíṣe ìṣògo tàbí sí ohun tó fún ènìyàn ní ìdí láti ṣògo. “Ìṣògo” jẹ́ ọ̀rọ̀ ṣókí, àdánidá, ó sì fi ààyè sílẹ̀ fún ìtumọ̀ méjèèjì.
- source_word: περισσεύῃ
  choice: lè túbọ̀ pọ̀ sí i
  rationale: Èyí sọ ìlọsíwájú àti ọ̀pọ̀ yanturu tí ọ̀rọ̀ náà ní, ó sì bá ìrísí ìṣe lẹ́yìn ἵνα mu.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “Nínú” pa àjọṣe ἐν mọ́; “Mèsáyà” sì mú iṣẹ́ Χριστός gẹ́gẹ́ bí orúkọ oyè ẹni àmì òróró hàn dípò kí a ṣe bí ẹni pé orúkọ lasán ni.
- source_word: ἐν ἐμοὶ
  choice: nítorí mi
  rationale: Bó tilẹ̀ jẹ́ pé ìtumọ̀ ọ̀rọ̀-ní-ọ̀rọ̀ ni “nínú mi,” níbí ó ṣeé ṣe kó túmọ̀ sí pé Pọ́ọ̀lù ni ìdí tàbí àǹfààní ìṣògo náà. “Nítorí mi” jẹ́ Yorùbá tó ṣe kedere láìpa àṣàyàn gangan náà mọ́.
- source_word: διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς
  choice: nípasẹ̀ wíwá mi sọ́dọ̀ yín lẹ́ẹ̀kan sí i
  rationale: “Nípasẹ̀” mú ipa ohun èlò tàbí ọ̀nà ti διά hàn; “wíwá mi” sì bá ọ̀rọ̀ nípa ìpadà Pọ́ọ̀lù sọ́dọ̀ wọn mu ju “wíwà mi” lọ ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká yìí, Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè. “Mèsáyà” mú ìtumọ̀ oyè náà hàn, nígbà tí “Kristi” jẹ́ àfàyọ-orúkọ tí àwọn òǹkàwé Yorùbá mọ̀ dáadáa.
- issue: Ohun tí ìṣògo náà so mọ́
  choice: ìṣògo yín nínú Mèsáyà Jésù
  alternative: kí ìṣògo yín lè pọ̀ sí i nínú Mèsáyà Jésù
  rationale: Ìtòlẹ́sẹẹsẹ yìí so “nínú Mèsáyà Jésù” mọ́ “ìṣògo,” gẹ́gẹ́ bí àṣà ọ̀rọ̀ Pọ́ọ̀lù ṣe sábà rí, ṣùgbọ́n àlàyé mìíràn ṣì ṣeé ṣe nítorí ìtòlẹ́sẹẹsẹ Gíríìkì.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún òǹkàwé gbogbogbò. Gbólóhùn náà bẹ̀rẹ̀ pẹ̀lú “kí” nítorí ó ń tẹ̀ lé èrò ẹsẹ tó ṣáájú. Àmì ohùn ni a lò níbi tí ó bá jẹ́ àdánidá, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
