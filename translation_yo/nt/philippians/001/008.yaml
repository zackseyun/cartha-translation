revisions:
- from: Nítorí Ọlọ́run ni ẹlẹ́rìí mi pé mo ń ṣàfẹ́rí gbogbo yín gidigidi pẹ̀lú ìfẹ́ni jíjinlẹ̀ ti Mèsáyà Jesu.[a][b]
  to: Nítorí Ọlọ́run ni ẹlẹ́rìí mi, bí mo ṣe ń ṣàfẹ́rí gbogbo yín gidigidi nínú ìfẹ́ni jíjinlẹ̀ Mèsáyà Jesu.[a][b]
  rationale: Àtúnṣe náà mú ὡς hàn pẹ̀lú “bí mo ṣe,” ó sì tún ìṣètò gbolóhùn ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ ṣe sí Yorùbá tó dára. Ó pa ìfẹ́-ọkàn lílágbára ti ἐπιποθῶ, ìtẹnumọ́ “gbogbo yín,” àti ìtumọ̀ oyè “Mèsáyà” mọ́.
