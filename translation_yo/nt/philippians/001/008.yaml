    issue: “pé” ni a lò lẹ́yìn “Ọlọ́run ni ẹlẹ́rìí mi.”
    rationale: Ὡς nínú ẹsẹ̀ yìí ń sọ bí/ìwọ̀n ìfẹ́-ọkàn Paulu ṣe lágbára, kì í ṣe kíkàn pé ìṣẹ̀lẹ̀ náà wà. “Bí mo ṣe ń …” pa ìtẹnumọ́ yìí mọ́.
  - severity: low
    issue: “pẹ̀lú ìfẹ́ni jíjinlẹ̀ ti Mèsáyà Jesu”
    rationale: Ìṣètò náà kò rọrùn nínú Yorùbá, ó sì lè mú kí “ti” dà bí ìní tí a kò mọ ìbáṣepọ̀ rẹ̀. “Nínú ìfẹ́ni jíjinlẹ̀ Mèsáyà Jesu” jẹ́ àdánidá síi, ó sì fi ìbáṣepọ̀ náà sílẹ̀ ní ìwọ̀n tí orísun fi sílẹ̀.
