  terminology: “Ọlọ́run,” “ẹlẹ́rìí,” “ṣàfẹ́rí,” àti “Mèsáyà Jesu” bá ìlànà ìtumọ̀ oyè Χριστός mu. “Ìfẹ́ni jíjinlẹ̀” jẹ́ ìtumọ̀ tó yẹ fún σπλάγχνοις nínú àyíká yìí; àlàyé ìsàlẹ̀ ń fi “àánú” hàn gẹ́gẹ́ bí yíyàn ìtumọ̀ mìíràn.
  issues:
