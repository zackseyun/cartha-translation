  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ìtumọ̀ pàtàkì ẹsẹ̀ Gíríìkì náà mọ́: Ọlọ́run ni ẹlẹ́rìí Paulu, ó ń ṣàfẹ́rí gbogbo àwọn olùgbọ́ rẹ̀, ìfẹ́-ọkàn náà sì ní ìbáṣepọ̀ pẹ̀lú Mèsáyà Jesu. Síbẹ̀, “pé” kò fi agbára ὡς (‘bí/how’) hàn dáadáa, àti “pẹ̀lú … ti” kì í jẹ́ ìṣètò tó rọrùn jù fún ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ.'
