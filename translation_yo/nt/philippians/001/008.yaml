id: PHP.1.8
reference: Philippians 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: yo
  text: Nítorí Ọlọ́run ni ẹlẹ́rìí mi, bí mo ṣe ń ṣàfẹ́rí gbogbo yín gidigidi nínú ìfẹ́ni jíjinlẹ̀ Mèsáyà Jesu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Kristi Jesu.”'
    reason: alternative_reading
  - marker: b
    text: 'Tàbí: “nínú àánú Mèsáyà Jesu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: ẹlẹ́rìí
  rationale: “Ẹlẹ́rìí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ẹni tí a pè láti jẹ́rìí sí òtítọ́ ọ̀rọ̀ kan; ó sì pa ìtumọ̀ ìkéde pàtàkì náà mọ́ pé Ọlọ́run mọ òtítọ́ ọkàn Paulu.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ọ̀rọ̀ tó ṣáájú gẹ́gẹ́ bí àlàyé ìfẹ́ àti ìgbẹ́kẹ̀lé Paulu.
- source_word: ὡς
  choice: pé … gidigidi
  rationale: Nínú ìlò yìí, ὡς ń fi ohun tí Ọlọ́run jẹ́rìí sí àti bí ìfẹ́-ọkàn náà ṣe jinlẹ̀ hàn; ìṣètò Yorùbá yìí mú méjèèjì jáde lọ́nà àdánidá.
- source_word: ἐπιποθῶ
  choice: mo ń ṣàfẹ́rí … gidigidi
  rationale: “Ṣàfẹ́rí” ń sọ ìfẹ́-ọkàn lílágbára láti rí tàbí wà pẹ̀lú àwọn ẹni náà; “gidigidi” mú agbára ọ̀rọ̀ Gíríìkì náà hàn.
- source_word: πάντας ὑμᾶς
  choice: gbogbo yín
  rationale: Ó pa ìtẹnumọ́ πάντας mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn.
- source_word: σπλάγχνοις
  choice: ìfẹ́ni jíjinlẹ̀
  rationale: Ní ti gidi, ọ̀rọ̀ náà tọ́ka sí àwọn ẹ̀yà inú gẹ́gẹ́ bí ibùjókòó ìmọ̀lára; “ìfẹ́ni jíjinlẹ̀” sọ àkànṣe ìtumọ̀ rẹ̀ nínú àyíká yìí láì túmọ̀ ọ́ ní ọ̀nà líle.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jesu
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí ẹni àmìòróró, ìyẹn Mèsáyà; a túmọ̀ oyè náà, a sì pa orúkọ Jesu mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστοῦ nínú àkójọpọ̀ oyè àti orúkọ Paulu
  choice: Mèsáyà Jesu
  alternative: Kristi Jesu
  rationale: “Mèsáyà” mú ìtumọ̀ oyè Χριστός jáde dípò kí ó dà bí orúkọ lásán; a fi ìtumọ̀ ìbílẹ̀ “Kristi Jesu” sí àlàyé ìsàlẹ̀.
- issue: Ìbáṣepọ̀ ìfẹ́ni náà pẹ̀lú Mèsáyà Jesu
  choice: ìfẹ́ni jíjinlẹ̀ ti Mèsáyà Jesu
  alternative: àánú Mèsáyà Jesu
  rationale: Ẹ̀yà ọ̀rọ̀ ἐν σπλάγχνοις lè tọ́ka sí ìfẹ́ni jíjinlẹ̀ tàbí ìyọ́nú; “ti Mèsáyà Jesu” pa ìsopọ̀ genitive mọ́ láì pinnu bóyá ó jẹ́ ìfẹ́ni tí ó wá láti ọ̀dọ̀ rẹ̀ tàbí èyí tí ó jẹ́ tirẹ̀ ní kíkún.
translation_notes:
  register: Yorùbá àgbàṣe òde òní ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé gbogbogbò; “ṣàfẹ́rí” àti “ìfẹ́ni jíjinlẹ̀” yẹra fún ìtumọ̀ gígún ti àwòrán àwọn ẹ̀yà inú, wọ́n sì pa ìmọ̀lára lílágbára inú orísun mọ́.
