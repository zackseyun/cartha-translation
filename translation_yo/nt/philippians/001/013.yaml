  source_fidelity: Ìtumọ̀ náà gba ìbájọra àbájáde ti ὥστε, ìtumọ̀ ìdè Pọ́ọ̀lù, ìmọ̀ gbangba rẹ̀, àti ìfẹ̀rẹ̀ẹ́ ìtumọ̀ πραιτώριον. Síbẹ̀, ṣíṣe ἐν Χριστῷ sí “nítorí Mèsáyà” nínú ọ̀rọ̀ àkọ́kọ́ yan ìtumọ̀ ìdí kan ní kedere, níbi tí Gíríìkì ti lè fi ìbáṣepọ̀/sífèrè “nínú Mèsáyà” sílẹ̀. Àtúnṣe náà ń tẹ̀lé ọ̀rọ̀ Gíríìkì àti ọ̀nà ìtúmọ̀ Gẹ̀ẹ́sì tí a ṣàyẹ̀wò, nípa fífi ìtumọ̀ yìí sí ọ̀rọ̀ àkọ́kọ́ àti ìtumọ̀ ìdí sí àlàyé ìsàlẹ̀.
  naturalness: “Ìdè mi nínú Mèsáyà” jẹ́ ọ̀nà Yorùbá tó ṣeé lóye nínú ìforígbárí ìjọsìn/ìwé mímọ́, ó sì dá ipò gírámà ọ̀rọ̀ Gíríìkì dúró. “Ti di mímọ̀” jẹ́ àdánidá fún ohun tí ó ti wá di mímọ̀ sí àwọn ènìyàn. Ọ̀rọ̀ náà ṣì jẹ́ apá gbólóhùn tó parí pẹ̀lú kọ́má.
