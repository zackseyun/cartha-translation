id: PHP.1.13
reference: Philippians 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: yo
  text: tó fi jẹ́ pé ìdè mi nínú Mèsáyà ti di mímọ̀ láàárín gbogbo àwọn ẹ̀ṣọ́ olú-ọba[b] àti fún gbogbo àwọn yòókù[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdè mi nítorí Mèsáyà.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ní gbogbo pírétóríọ̀mù”; ọ̀rọ̀ náà lè tọ́ka sí àwọn ẹ̀ṣọ́ olú-ọba tàbí sí olú-ilé, ààfin, tàbí ibùgbé ìjọba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: tó fi jẹ́ pé
  rationale: Ó ṣe àfihàn àbájáde ohun tí Pọ́ọ̀lù sọ ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ náà ní Yorùbá.
- source_word: τοὺς δεσμούς μου
  choice: mo wà nínú ìdè
  rationale: δεσμοί túmọ̀ ní tààrà sí ìdè tàbí ẹ̀wọ̀n; gbólóhùn yìí mú àwòrán ìdè náà dúró, ó sì ṣe kedere pé Pọ́ọ̀lù ń sọ nípa ipò rẹ̀ gẹ́gẹ́ bí ẹlẹ́wọ̀n.
- source_word: φανεροὺς ... γενέσθαι
  choice: ó ti hàn gbangba
  rationale: Ó pa ìtumọ̀ pé ọ̀ràn náà ti wá di ohun tí àwọn ènìyàn mọ̀ tàbí tí ó ṣe kedere mọ́.
- source_word: ἐν Χριστῷ
  choice: nítorí Mèsáyà
  rationale: Ní àyíká ọ̀rọ̀ yìí, gbólóhùn náà lè tọ́ka sí pé ìdè Pọ́ọ̀lù jẹ́ nítorí ìbáṣepọ̀ àti ìfaramọ́ rẹ̀ sí Mèsáyà. Àlàyé ìtumọ̀ ‘nínú Mèsáyà’ wà ní àlàyé ìsàlẹ̀.
- source_word: Χριστῷ
  choice: Mèsáyà
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ẹni tí a fòróró yàn, kì í ṣe orúkọ lásán.
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: láàárín gbogbo àwọn ẹ̀ṣọ́ olú-ọba
  rationale: πραιτώριον lè tọ́ka sí ẹgbẹ́ àwọn ẹ̀ṣọ́ olú-ọba; ‘láàárín’ bá ìtọ́kasí sí àwùjọ ènìyàn mu ní Yorùbá.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: àti gbogbo àwọn yòókù
  rationale: Ó tẹ̀síwájú láti fi gbogbo àwọn mìíràn tí kò sí nínú ẹgbẹ́ ẹ̀ṣọ́ náà kún un.
theological_decisions:
- issue: Ìtumọ̀ ἐν Χριστῷ nípa ìdè Pọ́ọ̀lù
  choice: nítorí Mèsáyà
  alternative: nínú Mèsáyà
  rationale: Àyíká ọ̀rọ̀ náà ń tẹnumọ́ ohun tí àwọn ènìyàn mọ̀ nípa ìdí ìdè Pọ́ọ̀lù, ṣùgbọ́n Gíríìkì tún lè mú èrò ìrẹ́pọ̀ pẹ̀lú Mèsáyà wá; a pa ìtumọ̀ kejì mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tó ní iyì ṣùgbọ́n tó ṣeé lóye ni a lò. ‘Olú-ọba’ ń tọ́ka sí olú ọba aláṣẹ ilẹ̀ Róòmù, kì í ṣe ọba ìbílẹ̀ kan. Gbólóhùn náà jẹ́ apá kan tí ó ń bá ẹsẹ tó ṣáájú lọ, nítorí náà a bẹ̀rẹ̀ rẹ̀ pẹ̀lú ‘tó fi jẹ́ pé’ a sì parí rẹ̀ pẹ̀lú àmì kọ́má.
