- from: ẹ má sì ṣe jẹ́ kí àwọn tí ó dojú kọ yín dá ẹ̀rù bà yín lọ́nàkọnà.[a] Èyí jẹ́ àmì fún wọn pé ìparun ń bọ̀,[b] ṣùgbọ́n fún yín, pé ìgbàlà ń bọ̀—èyí sì wá láti ọ̀dọ̀ Ọlọ́run.[c]
  to: Ẹ má sì ṣe jẹ́ kí àwọn tí ń tako yín dẹ́rù bà yín ní ọ̀nà kankan.[a] Èyí jẹ́ àmì ìparun fún wọn,[b] ṣùgbọ́n àmì ìgbàlà fún yín—èyí sì wá láti ọ̀dọ̀ Ọlọ́run.[c]
