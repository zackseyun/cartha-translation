id: PHP.1.28
reference: Philippians 1:28
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: yo
  text: Ẹ má sì ṣe jẹ́ kí àwọn tí ń tako yín dẹ́rù bà yín ní ọ̀nà kankan.[a] Èyí jẹ́ àmì ìparun fún wọn,[b] ṣùgbọ́n àmì ìgbàlà fún yín—èyí sì wá láti ọ̀dọ̀ Ọlọ́run.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí wọ́n mú kí ẹ̀rù bà yín” tàbí “kí wọ́n dẹ́rù bà yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ̀rí” tàbí “ohun tí ń tọ́ka sí” ìparun.
    reason: lexical_alternative
  - marker: c
    text: Gbólóhùn náà, “èyí sì wá láti ọ̀dọ̀ Ọlọ́run,” lè tọ́ka pàtó sí ìgbàlà, tàbí ní ọ̀nà gbígbòòrò sí gbogbo àmì tí a ṣẹ̀ṣẹ̀ sọ.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: jẹ́ kí ... dá ẹ̀rù bà yín
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jíjìnnìjìnnì tàbí jíjẹ́ kí alatako dẹ́rù bà ẹni. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì mú agbára ọ̀rọ̀ náà jáde.
- source_word: ἐν μηδενί
  choice: lọ́nàkọnà
  rationale: Ó pa ìtumọ̀ pé ‘ní ohunkóhun rárá’ tàbí ‘ní ọ̀nà kankan’ mọ́ ní Yorùbá òde òní.
- source_word: τῶν ἀντικειμένων
  choice: àwọn tí ó dojú kọ yín
  rationale: Ó ṣàfihàn àwọn ènìyàn tí ń tako àwọn onígbàgbọ́, ó sì pa ìbáṣepọ̀ tí ọ̀rọ̀-orúkọ ìṣe Gíríìkì náà ní mọ́.
- source_word: ἔνδειξις
  choice: àmì
  rationale: Ó lè túmọ̀ sí àmì, ẹ̀rí, tàbí ohun tí ń tọ́ka sí òtítọ́ kan; ‘àmì’ ṣe kedere, ó sì yé gbogbo ènìyàn.
- source_word: ἀπωλείας
  choice: ìparun
  rationale: ‘Ìparun’ mú èrò ìṣubú àti ìdájọ́ jáde láìfi ìtumọ̀ tí ó kọjá ohun tí Gíríìkì sọ kún un.
- source_word: σωτηρίας
  choice: ìgbàlà
  rationale: Ó pa ìwọ̀n ẹ̀kọ́ nípa iṣẹ́ ìgbàlà Ọlọ́run mọ́ dáadáa ju ọ̀rọ̀ tí ó túbọ̀ gbòòrò bí ‘ìdáǹdè’ lọ.
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: èyí sì wá láti ọ̀dọ̀ Ọlọ́run
  rationale: Ó pa ọ̀rọ̀ atọ́ka ‘èyí’ mọ́, ó sì kò yanjú ohun tí ‘èyí’ ń tọ́ka sí níbi tí Gíríìkì fúnra rẹ̀ ti fi í sílẹ̀ ní àìdánilójú.
theological_decisions:
- issue: Ohun tí τοῦτο (‘èyí’) ń tọ́ka sí
  choice: A fi ‘èyí’ sílẹ̀ ní ọ̀nà gbígbòòrò nínú ẹsẹ náà.
  alternative: Ó lè tọ́ka pàtó sí ìgbàlà yín, tàbí sí gbogbo àmì tí ìgboyà wọn àti àtakò àwọn ọ̀tá ń fi hàn.
  rationale: Gíríìkì gba àwọn ìtumọ̀ méjèèjì láàyè; nítorí náà, ìtumọ̀ náà kò yẹ kí ó yanjú àìdánilójú tí orísun kò yanjú.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìtòlẹ́sẹẹsẹ ni a mú kí ó jẹ́ àdánidá ní Yorùbá, nígbà tí a pa ìyàtọ̀ láàárín ìparun àwọn alatako àti ìgbàlà àwọn olùgbàgbọ́ mọ́.
