id: 2PE.1.13
reference: 2 Peter 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: yo
  text: Ṣùgbọ́n mo kà á sí ohun tí ó tọ́, níwọ̀n ìgbà tí mo ṣì wà nínú àgọ́ yìí[a], láti máa ru yín sókè nípa rírán yín létí,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ibùgbé” tàbí “ara.” Èdè Gíríìkì ní “àgọ́,” àkàwé fún ìgbésí ayé Pétérù lọ́wọ́lọ́wọ́ nínú ara rẹ̀ tí ó lè kú.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: ohun tí ó tọ́
  rationale: Nínú àkójọpọ̀ ọ̀rọ̀ δίκαιον ἡγοῦμαι, gbólóhùn yìí túmọ̀ sí ohun tí ó yẹ tàbí tí ó bójú mu; “ohun tí ó tọ́” jẹ́ èdè Yorùbá àdánidá tó sì pa ìtumọ̀ ìwà rere àti ohun tó yẹ mọ́.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δὲ ń fi ìyàtọ̀ díẹ̀ tàbí ìtẹ̀síwájú ọ̀rọ̀ hàn láti inú ẹsẹ tó ṣáájú; “Ṣùgbọ́n” mú ìyípadà náà jáde ní kedere.
- source_word: ἡγοῦμαι
  choice: mo kà á sí
  rationale: Ọ̀rọ̀-ìṣe náà tọ́ka sí ìdájọ́ tí a ti ronú lé lórí, kì í ṣe èrò tó ṣẹ̀ṣẹ̀ kọjá lọ; “mo kà á sí” jẹ́ ọ̀nà Yorùbá tó bá a mu.
- source_word: ἐφ’ ὅσον
  choice: níwọ̀n ìgbà tí
  rationale: Pẹ̀lú εἰμί, gbólóhùn náà ní ìtumọ̀ àkókò, ìyẹn “ní gbogbo àkókò tí” tàbí “níwọ̀n ìgbà tí.”
- source_word: σκηνώματι
  choice: àgọ́
  rationale: σκηνώμα jẹ́ ibùgbé bí àgọ́, a sì lò ó níbí gẹ́gẹ́ bí àkàwé fún ara ẹni ikú. “Àgọ́” pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́, ó sì pèsè sílẹ̀ fún àwòrán yíyọ àgọ́ kúrò nínú ẹsẹ tó tẹ̀ lé e.
- source_word: διεγείρειν
  choice: láti máa ru yín sókè
  rationale: Ọ̀rọ̀ náà túmọ̀ sí jí tàbí ru ẹnì kan sókè. Ní àyíká ìṣírí ti ẹ̀mí yìí, “ru yín sókè” jẹ́ àdánidá, ó sì pa agbára àwòrán náà mọ́.
- source_word: ἐν ὑπομνήσει
  choice: nípa rírán yín létí
  rationale: 'Gbólóhùn náà ń sọ ọ̀nà tí Pétérù fi ń ru wọn sókè: nípa mímú kí wọ́n rántí ohun tí wọ́n ti mọ̀.'
theological_decisions:
- issue: Ìtumọ̀ àkàwé “àgọ́ yìí”
  choice: A pa àkàwé ara ẹni ikú mọ́ ní tààràtà gẹ́gẹ́ bí “àgọ́ yìí.”
  alternative: “ara yìí” tàbí “ibùgbé yìí”
  rationale: Ọ̀rọ̀ Gíríìkì lo àkàwé àgọ́ fún ìgbésí ayé nínú ara ẹni ikú. Pípa “àgọ́” mọ́ kò fi ìtumọ̀ ẹ̀kọ́ ìsìn kún ọ̀rọ̀ náà, ó sì pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú ẹsẹ tó tẹ̀ lé e.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà pa ìtẹ̀síwájú rẹ̀ sí ẹsẹ tó tẹ̀ lé e mọ́, nítorí náà ó parí pẹ̀lú àmì kọ́má. A gbé àmì àlàyé [a] lẹ́gbẹ̀ẹ́ “àgọ́ yìí,” ibi tí àlàyé ọ̀rọ̀ náà bá mu, dípò lẹ́gbẹ̀ẹ́ “ohun tí ó tọ́.”
