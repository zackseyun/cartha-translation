revisions:
- from: Nítorí náà, èmi yóò máa múra tán nígbà gbogbo láti máa rán yín létí nípa àwọn nǹkan wọ̀nyí, bí ó tilẹ̀ jẹ́ pé ẹ mọ̀ wọ́n, tí a sì ti fìdí yín múlẹ̀ nínú òtítọ́ tí ó wà lọ́wọ́ yín báyìí.[a]
  to: Nítorí náà, èmi yóò máa múra tán nígbà gbogbo láti máa rán yín létí nípa àwọn nǹkan wọ̀nyí, bí ó tilẹ̀ jẹ́ pé ẹ mọ̀ wọ́n, tí a sì ti fìdí yín múlẹ̀ nínú òtítọ́ ìsinsìnyí.[a]
  rationale: Àtúnṣe náà yí ìtumọ̀ ἐν τῇ παρούσῃ ἀληθείᾳ sí ‘nínú òtítọ́ ìsinsìnyí,’ èyí tó sún mọ́ ‘the present truth’ tí ó sì fi ìbéèrè ìtumọ̀ παρούσῃ sílẹ̀ láì fi ìtumọ̀ ẹ̀kọ́ ìsìn tàbí ìní kan pàtó kún un. Àlàyé ìsàlẹ̀ náà pa ìtumọ̀ Yorùbá àdánidá ‘òtítọ́ tí ó wà lọ́wọ́ yín báyìí’ mọ́ gẹ́gẹ́ bí àṣàyàn.
  reviewer_model: gpt-5.6-terra
