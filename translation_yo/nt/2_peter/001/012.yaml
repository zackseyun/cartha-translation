review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà fara mọ́ ìṣọ̀kan ìdí (Διὸ), ìmúratán/ìpinnu tí ń tẹ̀síwájú, ìránnilétí, àti agbára ìyọ̀ǹda nínú Gíríìkì. Síbẹ̀, ‘tí ó wà lọ́wọ́ yín báyìí’ yan ìtumọ̀ kan pàtó fún παρούσῃ (‘tí ẹ ní lọwọlọwọ’) dípò kí ó pa ọ̀rọ̀ náà mọ́ ní ìmọ̀lára rẹ̀ tí kò dájú pátápátá (‘present/at hand’).
  naturalness: Yorùbá náà dára, ó sì rọrùn láti lóye. ‘Rán yín létí’ àti ‘fìdí yín múlẹ̀’ jẹ́ àsàyàn àdánidá. Ṣíṣe apá òtítọ́ náà ní ‘òtítọ́ ìsinsìnyí’ yóò jẹ́ kúkúrú, yóò sì sún mọ́ ọ̀rọ̀ Gíríìkì.
  terminology: ‘Òtítọ́’ yẹ fún ἀλήθεια, ‘fìdí ... múlẹ̀’ sì yẹ fún ἐστηριγμένους. A kò yẹ kí ‘òtítọ́ tí ó wà lọ́wọ́ yín báyìí’ jẹ́ ìtumọ̀ àkọ́kọ́ nítorí ó lè fi ìní àwọn olùkà sínú ọ̀rọ̀ tí Gíríìkì kò sọ ní kedere.
  issues:
  - severity: low
    issue: Ìtumọ̀ παρούσῃ nínú gbolohun àkọ́kọ́ ti di pàtó ju.
    rationale: ‘Tí ó wà lọ́wọ́ yín báyìí’ lè túmọ̀ sí ‘the truth you currently possess,’ ṣùgbọ́n Gíríìkì tún lè túmọ̀ sí òtítọ́ tí ó wà níwájú wọn/tabi tí ó wà nísinsìnyí. Ìtumọ̀ àkọ́kọ́ tó sún mọ́ ọ̀rọ̀ náà yóò dáàbò bo àìdájú náà; ìtumọ̀ tí ó gbooro lè wà nínú àlàyé ìsàlẹ̀.
