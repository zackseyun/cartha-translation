id: 2PE.1.12
reference: 2 Peter 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: yo
  text: Nítorí náà, èmi yóò máa múra tán nígbà gbogbo láti máa rán yín létí nípa àwọn nǹkan wọ̀nyí, bí ó tilẹ̀ jẹ́ pé ẹ mọ̀ wọ́n, tí a sì ti fìdí yín múlẹ̀ nínú òtítọ́ ìsinsìnyí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú òtítọ́ tí ó wà lọ́wọ́ yín báyìí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ohun tí òǹkọ̀wé ń sọ jẹ́ àbájáde tàbí ìparí èrò tó ṣáájú.
- source_word: μελλήσω ἀεὶ
  choice: èmi yóò máa múra tán nígbà gbogbo
  rationale: Ọ̀rọ̀ náà níbí ń sọ nípa ìpinnu àti ìmúratán tí ń bá a lọ, kì í ṣe pé ìṣe náà fẹ́ bẹ̀rẹ̀ lójijì nìkan.
- source_word: ὑπομιμνῄσκειν
  choice: láti máa rán yín létí
  rationale: Ó túmọ̀ sí mímú kí ẹnì kan rántí ohun tó ti mọ̀; ‘máa’ bá ìṣe tí a ń ṣe léraléra mu.
- source_word: περὶ τούτων
  choice: nípa àwọn nǹkan wọ̀nyí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún sísọ ohun tí ìránnilétí náà dá lé.
- source_word: καίπερ εἰδότας
  choice: bí ó tilẹ̀ jẹ́ pé ẹ mọ̀ wọ́n
  rationale: Ó pa agbára gbólóhùn ìyọ̀ǹda náà mọ́, ó sì jẹ́ kedere pé ‘àwọn nǹkan wọ̀nyí’ ni wọ́n mọ̀.
- source_word: ἐστηριγμένους
  choice: tí a sì ti fìdí yín múlẹ̀
  rationale: 'Ó pa ìtumọ̀ perfect passive mọ́: ohun kan ti ṣẹlẹ̀ sí wọn tẹ́lẹ̀, ipò ìdúróṣinṣin rẹ̀ sì ń bá a lọ.'
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: nínú òtítọ́ tí ó wà lọ́wọ́ yín báyìí
  rationale: Ó sọ ìtumọ̀ παρούσῃ ní Yorùbá àdánidá gẹ́gẹ́ bí òtítọ́ tí àwọn olùkà ní tàbí tí ó wà pẹ̀lú wọn ní àkókò náà, láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbà kan pàtó.
theological_decisions:
- issue: Ìtumọ̀ ‘òtítọ́ tí ó wà ní báyìí’
  choice: òtítọ́ tí ó wà lọ́wọ́ yín báyìí
  alternative: òtítọ́ ìsinsìnyí
  rationale: Gíríìkì náà kò fi hàn pé ó jẹ́ orúkọ ẹ̀kọ́ ìsìn kan tàbí òtítọ́ fún sáà pàtó. Ìtumọ̀ yìí tọ́ka sí òtítọ́ tí wọ́n ní tàbí tí ó wà pẹ̀lú wọn, ó sì yẹra fún fífi èrò ẹ̀kọ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘rán yín létí’ àti ‘fìdí yín múlẹ̀’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá; àmì ohùn ni a fi sí àwọn ọ̀rọ̀ níbi tó yẹ.
