id: 2PE.1.18
reference: 2 Peter 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: yo
  text: Àwa fúnra wa sì gbọ́ ohùn yìí tí a mú wá láti ọ̀run nígbà tí a wà pẹ̀lú rẹ̀ lórí òkè mímọ́ náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a gbé wá láti ọ̀run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: ohùn yìí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, φωνή ń tọ́ka sí ọ̀rọ̀ Ọlọ́run tí a sọ ní ẹsẹ tó ṣáájú; “ohùn” ṣe kedere ju “ìró” lọ.
- source_word: ἡμεῖς
  choice: Àwa fúnra wa
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ tí a sọ ní pàtó nínú Gíríìkì fi ìtẹnumọ́ sí àwọn ẹlẹ́rìí náà; “Àwa fúnra wa” pa ìtẹnumọ́ yẹn mọ́.
- source_word: ἠκούσαμεν
  choice: gbọ́
  rationale: Ọ̀rọ̀ náà tọ́ka sí ìṣẹ̀lẹ̀ kan tí wọ́n fi etí gbọ́ ohùn náà, kì í ṣe sí títẹ́tí sí i fún àkókò gígùn.
- source_word: ἐξ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ibi tí ohùn náà ti wá.
- source_word: ἐνεχθεῖσαν
  choice: tí a mú wá
  rationale: Ìtumọ̀ yìí pa ìṣe aláìlórúkọ (passive) mọ́, ó sì fi hàn pé a gbé tàbí mú ohùn náà wá láti ọ̀run.
- source_word: σὺν αὐτῷ ὄντες
  choice: nígbà tí a wà pẹ̀lú rẹ̀
  rationale: Ìtumọ̀ àkókò yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ wọn pẹ̀lú Jésù mọ́ láìfi orúkọ tí kò sí nínú ẹsẹ náà kún un.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: lórí òkè mímọ́ náà
  rationale: “Lórí òkè” jẹ́ ọ̀nà Yorùbá àdánidá; “mímọ́” sì fi ìyàsọ́tọ̀ òkè náà fún Ọlọ́run hàn.
theological_decisions:
- issue: Ohun tí “òkè mímọ́ náà” ń tọ́ka sí
  choice: Àpèjúwe òkè ìyípadà ìrísí Jésù, láìdárúkọ òkè kan pàtó
  alternative: Dídárúkọ rẹ̀ gẹ́gẹ́ bí Òkè Tábórì tàbí Òkè Hẹ́mónì
  rationale: Ọ̀rọ̀ Gíríìkì sọ pé “òkè mímọ́ náà” nìkan, kò sì sọ orúkọ rẹ̀. Ìtumọ̀ náà kò gbọ́dọ̀ fi ìdánimọ̀ àṣà kan kún ohun tí orísun kò sọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Àwa fúnra wa” pa ìtẹnumọ́ ẹlẹ́rìí mọ́; ìtòlẹ́sẹẹsẹ gbólóhùn náà sì jẹ́ àdánidá fún òǹkà Yorùbá.
