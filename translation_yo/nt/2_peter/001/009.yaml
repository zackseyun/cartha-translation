id: 2PE.1.9
reference: 2 Peter 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: yo
  text: Nítorí ẹni tí kò ní àwọn nǹkan wọ̀nyí[a] jẹ́ afọ́jú; ó sì ń rí ohun tó sún mọ́ ọn nìkan[b], ó ti gbàgbé ìwẹ̀nùmọ́ rẹ̀ kúrò nínú àwọn ẹ̀ṣẹ̀ rẹ̀ ìgbàanì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ànímọ́ wọ̀nyí.” Gbólóhùn náà ń tọ́ka sí àwọn ìwà rere tí a dárúkọ ní àwọn ẹsẹ̀ ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ní ojú kúkúrú” tàbí “ó ń rí ohun tó wà nítòsí nìkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: Nítorí ẹni tí kò ní àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹnikẹ́ni tí àwọn ìwà rere tí a ṣẹ̀ṣẹ̀ dárúkọ kò sí lára rẹ̀. “Kò ní” jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ pé àwọn nǹkan náà kò sí lọ́dọ̀ ẹni náà, nígbà tí “àwọn nǹkan wọ̀nyí” kò túmọ̀ ταῦτα ju bó ṣe wà lọ.
- source_word: τυφλός
  choice: jẹ́ afọ́jú
  rationale: Èyí pa àpẹẹrẹ ìfọ́jú mọ́ ní tààrà, láì sọ bóyá ìfọ́jú ti ara ni tàbí ti ẹ̀mí.
- source_word: μυωπάζων
  choice: kì í ríran kọjá ohun tó sún mọ́ ọn
  rationale: Ọ̀rọ̀ náà ṣàpèjúwe ẹni tí ìríran rẹ̀ mọ sí ohun tó wà nítòsí. Gbólóhùn yìí jẹ́ Yorùbá àdánidá, ó sì pa ìforígbárí tó wà láàárín “afọ́jú” àti ẹni tó rí ohun tó sún mọ́ ọn mọ́.
- source_word: λήθην λαβὼν
  choice: ó sì ti gbàgbé
  rationale: Èdè Gíríìkì sọ ní ti gidi pé ó “gba ìgbàgbé,” ṣùgbọ́n “ó ti gbàgbé” ni ọ̀nà Yorùbá tó ṣe kedere, tó sì pa agbára perfective participle náà mọ́.
- source_word: καθαρισμοῦ
  choice: ìwẹ̀nùmọ́ rẹ̀
  rationale: “Ìwẹ̀nùmọ́” sọ ìmúkúrò ẹ̀gbin ẹ̀ṣẹ̀ ní ọ̀nà tó yé àwọn òǹkàwé lónìí. Fífikun “rẹ̀” jẹ́ kó ṣe kedere pé ìwẹ̀nùmọ́ ẹni náà ni, láì sọ ẹni tó ṣe é.
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: kúrò nínú àwọn ẹ̀ṣẹ̀ rẹ̀ ìgbàanì
  rationale: “Kúrò nínú” fi ìbáṣepọ̀ ìwẹ̀nùmọ́ sí ẹ̀ṣẹ̀ hàn ní Yorùbá àdánidá; “ìgbàanì” sì pa ìtọ́kasí πάλαι sí àwọn ẹ̀ṣẹ̀ tó ti kọjá mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín “afọ́jú” àti μυωπάζων
  choice: 'A pa àwọn àpẹẹrẹ méjèèjì mọ́: “jẹ́ afọ́jú; kì í ríran kọjá ohun tó sún mọ́ ọn.”'
  alternative: Láti tú u sí “afọ́jú nípa tẹ̀mí” tàbí láti jẹ́ kí μυωπάζων túmọ̀ sí pé ó ti di afọ́jú pátápátá.
  rationale: Orísun náà fi “afọ́jú” àti “ìríran kúkúrú” sí ẹ̀gbẹ́ ara wọn. Ìtumọ̀ kò yẹ kí ó yanjú ìforígbárí àpẹẹrẹ yìí nípa fífi ẹ̀kọ́ ìsìn kan kún un.
- issue: Ẹni tó ṣe ìwẹ̀nùmọ́
  choice: “ìwẹ̀nùmọ́ rẹ̀” láì dárúkọ olùṣe náà
  alternative: “bí Ọlọ́run ti wẹ̀ ẹ́ mọ́”
  rationale: Ẹsẹ̀ Gíríìkì kò dárúkọ olùṣe ìwẹ̀nùmọ́ náà. Bí ó tilẹ̀ jẹ́ pé àyíká ẹ̀kọ́ ìgbàgbọ́ lè tọ́ka sí Ọlọ́run, a kò fi ohun tí ẹsẹ̀ náà kò sọ kún ọ̀rọ̀ pàtàkì.
- issue: Àpẹẹrẹ akọ nínú αὐτοῦ
  choice: A lo “rẹ̀,” ọ̀rọ̀ arọ́pò-orúkọ tí kò fi akọ tàbí abo hàn.
  alternative: Láti fi “ọkùnrin náà” tàbí ọ̀rọ̀ akọ mìíràn sí i.
  rationale: Yorùbá kò pín ọ̀rọ̀ arọ́pò-orúkọ ẹni kẹta sí akọ àti abo. “Rẹ̀” pa ẹyọ ọ̀rọ̀ náà mọ́, ó sì jẹ́ kí ìtọ́kasí náà kan ẹnikẹ́ni gẹ́gẹ́ bí ti Gíríìkì.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó bá yẹ, ní èdè ọlọ́lá ṣùgbọ́n tó ṣeé lóye. Gbólóhùn náà pa àwòrán ìfọ́jú àti ìríran kúkúrú mọ́, ó sì yà wọ́n pẹ̀lú àmì àárín gbólóhùn kí ọ̀rọ̀ náà lè ṣàn dáadáa.
