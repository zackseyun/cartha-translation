reference: 2 Peter 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: yo
  text: 'Nítorí, nígbà tí ó gba ọlá àti ògo láti ọ̀dọ̀ Ọlọ́run Baba, a gbé ohùn irú bẹ́ẹ̀ wá sí i láti ọ̀dọ̀ Ògo Ọláńlá[a]: “Èyí ni Ọmọ mi, ẹni tí mo fẹ́ràn[b], ẹni tí inú mi dùn sí[c]”—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ọwọ́ Ògo Ọláńlá.” Ọ̀rọ̀ Gíríìkì ὑπό lè fi ẹni tí ó ṣe ohun kan hàn; “láti ọ̀dọ̀” sì mú orísun ohùn náà hàn ní Yorùbá àdánidá.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Èyí ni Ọmọ mi olùfẹ́.” Gíríìkì náà ní, ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀-sí-ọ̀rọ̀, “Èyí ni Ọmọ mi, Olùfẹ́ mi.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “ẹni tí mo ní inú dídùn sí” tàbí “ẹni tí mo yọ̀ sí.” Ní ọ̀nà tí ó sún mọ́ ọ̀rọ̀-sí-ọ̀rọ̀, Gíríìkì náà ní “ẹni tí mo yọ̀ sí.” Ọ̀rọ̀-ìṣe náà wà ní ìrísí aorist (àkókò ìṣáájú), bí ó tilẹ̀ jẹ́ pé gbólóhùn náà lè sọ ìtẹ́lọ́rùn tí ó dúró ṣinṣin.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν
  choice: nígbà tí ó gba
  rationale: Aorist participle náà ní ìtumọ̀ àkókò ní àyíká yìí; ọ̀rọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ gbólóhùn pàtàkì.
- source_word: παρὰ θεοῦ πατρὸς
  choice: láti ọ̀dọ̀ Ọlọ́run Baba
  rationale: παρά pẹ̀lú genitive ń tọ́ka sí orísun; ‘Ọlọ́run Baba’ pa àwọn orúkọ méjèèjì mọ́ láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: τιμὴν καὶ δόξαν
  choice: ọlá àti ògo
  rationale: A pa àwọn ọ̀rọ̀ orúkọ méjèèjì mọ́ lọ́tọ̀; wọ́n jẹ́ ọ̀rọ̀ Yorùbá tí ó mọ́gbọ́n dání, tí ó sì bójú mu fún ìforúkọsílẹ̀ mímọ́.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ
  choice: ohùn ... wá sí ọ̀dọ̀ rẹ̀
  rationale: Ìtumọ̀ yìí sọ genitive absolute di gbólóhùn Yorùbá àdánidá. Ó pa èrò pé ohùn náà dé ọ̀dọ̀ rẹ̀ mọ́, bí ó tilẹ̀ jẹ́ pé kò fara mọ́ passive Gíríìkì ní ọ̀rọ̀-sí-ọ̀rọ̀.
- source_word: τοιᾶσδε
  choice: irú ohùn yìí
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí àwọn ọ̀rọ̀ tí ó tẹ̀ lé e; ‘irú ... yìí’ jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún ìtọ́kasí bẹ́ẹ̀.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: láti ọ̀dọ̀ Ògo Ọláńlá
  rationale: ‘Láti ọ̀dọ̀’ mú orísun ohùn náà hàn ní Yorùbá àdánidá, nígbà tí akọlé ‘Ògo Ọláńlá’ pa ọ̀rọ̀ ọ̀wọ̀ tí Gíríìkì lò fún Ọlọ́run mọ́.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: Èyí ni Ọmọ mi, ẹni tí mo fẹ́ràn
  rationale: Ìtumọ̀ yìí pa apposition Gíríìkì mọ́ dípò kí ó sọ gbogbo rẹ̀ di ‘Ọmọ mi olùfẹ́’; ó tún sọ ἀγαπητός ní Yorùbá tí gbogbo ènìyàn lè lóye.
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: ẹni tí inú mi dùn sí
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtẹ́lọ́rùn tàbí inú dídùn sí ẹnì kan. Kò fi ipá yan láàárín ‘in whom’ àti ‘with whom’ ti a lè lò ní èdè mìíràn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ọ̀rọ̀ ọ̀wọ̀ τῆς μεγαλοπρεποῦς δόξης
  choice: Ògo Ọláńlá
  alternative: ògo títóbi lọ́lá; Ọlọ́run Ológo
  rationale: ‘Ògo Ọláńlá’ pa àpèjúwe reverential Gíríìkì mọ́ gẹ́gẹ́ bí akọlé tó ń tọ́ka sí Ọlọ́run, láìrọ́pò rẹ̀ pẹ̀lú orúkọ Ọlọ́run nínú ara ẹsẹ̀.
- issue: Ọ̀nà tí a gbà ṣètò ọ̀rọ̀ Baba nípa Ọmọ
  choice: Èyí ni Ọmọ mi, ẹni tí mo fẹ́ràn, ẹni tí inú mi dùn sí
  alternative: Èyí ni Ọmọ mi olùfẹ́, ẹni tí inú mi dùn sí
  rationale: Aṣàyàn náà pa ìṣètò appositional Gíríìkì àti ìtẹnumọ́ rẹ̀ mọ́, láìfi ìlànà ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ̀ náà kún un.
translation_notes:
  register: Yorùbá ìpele òde òní tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ọlọ́run Baba’ àti ‘Ògo Ọláńlá’ ń mú ìforúkọsílẹ̀ mímọ́ àti ọ̀wọ̀ hàn, nígbà tí ‘ẹni tí mo fẹ́ràn’ àti ‘ẹni tí inú mi dùn sí’ jẹ́ èdè tí òǹkàwé Yorùbá òde òní lè lóye nírọ̀rùn. Àmì ìparí — fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ̀ tó tẹ̀ lé e.
