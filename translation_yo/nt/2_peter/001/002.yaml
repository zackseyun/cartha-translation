id: 2PE.1.2
reference: 2 Peter 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ àti àlàáfíà pọ̀ sí i fún yín nínú ìmọ̀ Ọlọ́run àti ti Jésù, Olúwa wa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ìmọ̀ Ọlọ́run àti ti Jésù, Olúwa wa.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ipò tàbí ààyè (“nínú”), tàbí sí ọ̀nà tí ohun fi ṣẹlẹ̀ (“nípasẹ̀”).
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ìmọ̀ kíkún” dípò “ìmọ̀.” Ọ̀rọ̀ Gíríìkì ἐπίγνωσις lè ní ìtumọ̀ ìmọ̀ tí ó jinlẹ̀ tàbí tí ó pé sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà tí ó wọ́pọ̀, tí ó sì ní ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ jinlẹ̀ fún oore tí Ọlọ́run ń fi fún ènìyàn; ó tún bá ọ̀rọ̀ ìkíni inú lẹ́tà mu.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún peace, ó sì lè ní ìtumọ̀ ìbàlẹ̀ ọkàn àti ìgbé-ayé rere tí ọ̀rọ̀ Gíríìkì náà ń gbé.
- source_word: πληθυνθείη
  choice: kí ... di púpọ̀ fún yín
  rationale: Ìkọ́lé yìí fi hàn pé ìbùkún tàbí ìfẹ́ ni ọ̀rọ̀ náà, ó sì pa èrò passive optative mọ́ láìsọ ọ́ di àṣẹ.
- source_word: ἐν
  choice: nínú
  rationale: ‘Nínú’ jẹ́ ìtumọ̀ tààrà tí ó lè tọ́ka sí ààyè tàbí ipò tí ìbùkún náà ti ń pọ̀ sí i; a fi ìtumọ̀ ọ̀nà tàbí ohun èlò sí àlàyé ìsàlẹ̀.
- source_word: ἐπιγνώσει
  choice: ìmọ̀
  rationale: ‘Ìmọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tí ó rọrùn, tí ó sì bójú mu; àlàyé ìsàlẹ̀ pa àṣàyàn ‘ìmọ̀ kíkún’ mọ́.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Ìtumọ̀ tààrà fún θεός nínú ọ̀rọ̀ ìní tí ó tẹ̀ lé ἐπιγνώσει.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: Àkọsílẹ̀ orúkọ náà ní ọ̀nà Yorùbá tí ó wọ́pọ̀.
- source_word: κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ pa ipò ọlá àti ìwọ̀n Kristẹni ti κύριος mọ́, ó sì jẹ́ ìtumọ̀ Majẹ̀mú Tuntun tí ó wọ́pọ̀.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: Ọlọ́run àti ti Jésù Olúwa wa
  rationale: Àtúnṣe ‘ti’ níwájú Jésù mú kí ó ṣe kedere ní Yorùbá pé ìmọ̀ náà jẹ́ ti Ọlọ́run àti ti Jésù méjèèjì, láìfi preposition tuntun kún Gíríìkì.
theological_decisions:
- issue: Ìtumọ̀ ἐπίγνωσις nínú ọ̀rọ̀ ẹ̀mí
  choice: ìmọ̀
  alternative: ìmọ̀ kíkún; ìmọ̀ tòótọ́
  rationale: ‘Ìmọ̀’ kò fi ìtumọ̀ ẹ̀kọ́ kan tí ọ̀rọ̀ náà kò fi dandan sọ kún un; àlàyé ìsàlẹ̀ sì pa agbára ìtumọ̀ tí ó jinlẹ̀ sí i mọ́.
- issue: Agbára ἐν pẹ̀lú ἐπιγνώσει
  choice: nínú ìmọ̀ Ọlọ́run àti ti Jésù Olúwa wa
  alternative: nípasẹ̀ ìmọ̀ Ọlọ́run àti ti Jésù Olúwa wa
  rationale: Gíríìkì lè túmọ̀ sí ipò tàbí ààyè (‘nínú’) tàbí ọ̀nà tí ohun fi ṣẹlẹ̀ (‘nípasẹ̀’). Ọ̀rọ̀ àkọ́kọ́ pa àìdánilójú náà mọ́.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní tí ó níyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Ìkọ́lé ‘Kí ... di púpọ̀ fún yín’ jẹ́ àdúrà ìbùkún tí ó ṣe kedere sí òǹkàwé lásán, láìsọ ìṣe passive optative Gíríìkì di àṣẹ.
