language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: yo
  text: àti nínú ìmọ̀, ìkóra-ẹni-níjàánu; àti nínú ìkóra-ẹni-níjàánu, ìfaradà[a]; àti nínú ìfaradà, ìfọkànsìn Ọlọ́run[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ìfaradà (ὑπομονή) sí “ìforítì,” “dídúró ṣinṣin,” tàbí “sùúrù tí kì í jáwọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ìṣètò Gíríìkì níhìn-ín jẹ́ èyí tí a gé kúrú; ó ń tẹ̀ síwájú nínú àtòjọ ìwà rere láti ẹsẹ tó ṣáájú, níbi tí a ti ní láti fi ìwà kan kún èkejì.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: ìmọ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ìmọ̀ tàbí mímọ ohun kan; “ìmọ̀” ni ọ̀rọ̀ Yorùbá tó ṣe tààrà jù, ó sì bá àtòjọ ìwà rere náà mu.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: ìkóra-ẹni-níjàánu
  rationale: Ó ń tọ́ka sí agbára láti ṣàkóso ìfẹ́kúfẹ̀ẹ́ àti ìwà ẹni. “Ìkóra-ẹni-níjàánu” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere, tí kò sì dín ìtumọ̀ rẹ̀ kù sí ìwọ̀ntúnwọ̀nsì nìkan.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: ìfaradà
  rationale: Ὑπομονή jẹ́ dídúró ṣinṣin lábẹ́ ìṣòro láìjáwọ́. “Ìfaradà” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá, ó sì lè gba ìtumọ̀ ìforítì àti sùúrù pẹ̀lú.
- source_word: εὐσέβειαν
  choice: ìfọkànsìn Ọlọ́run
  rationale: Níhìn-ín εὐσέβεια ń sọ nípa ọ̀wọ̀ àti ìfọkànsìn sí Ọlọ́run tí ń hàn nínú ìgbésí ayé. Yíyan ọ̀rọ̀ yìí yẹra fún fífi “ìwà bí Ọlọ́run” hàn bí ẹni pé ẹ̀dá ń di Ọlọ́run.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: àti nínú ..., ...
  rationale: A pa ìṣètò ọ̀rọ̀ kúkúrú ti Gíríìkì mọ́, nítorí ó ń tẹ̀ síwájú láti inú àṣẹ ẹsẹ tó ṣáájú pé kí a fi ìwà rere kan kún òmíràn.
- source_word: δέ
  choice: àti
  rationale: Ní àtòjọ yìí δέ ń so ìwà rere kọ̀ọ̀kan mọ́ èkejì, kò sì ń fi ìtakora líle hàn.
theological_decisions:
- issue: Ìṣètò ọ̀rọ̀ tí a gé kúrú nínú àtòjọ àwọn ìwà rere
  choice: 'Pa àtòjọ kúkúrú náà mọ́: “àti nínú ..., ...”'
  alternative: “ẹ fi ... kún ...” ní gbogbo apá ẹsẹ náà
  rationale: Gíríìkì kò tún ọ̀rọ̀ ìṣe inú ẹsẹ tó ṣáájú sọ; ó gbára lé e. Pípa ìṣètò yìí mọ́ ń yẹra fún fífi àlàyé tí kò fara hàn gbangba sínú ẹsẹ náà.
- issue: Ìtumọ̀ εὐσέβεια
  choice: ìfọkànsìn Ọlọ́run
  alternative: ìwà-bí-Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì náà tẹnumọ́ ìbòwọ̀ àti ìfọkànsìn tí ìgbésí ayé ń fi hàn, kì í ṣe pé ènìyàn ń di Ọlọ́run tàbí ń ní gbogbo àbùdá Ọlọ́run.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A mọ̀ọ́mọ̀ pa ìṣètò àtòjọ Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ó kúkúrú, footnote sì ṣàlàyé ìgbẹ́kẹ̀lé rẹ̀ lórí ẹsẹ tó ṣáájú.
