id: 2PE.1.4
reference: 2 Peter 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: yo
  text: Nípasẹ̀ èyí, ó ti fún wa ní àwọn ìlérí iyebíye àti títóbi jùlọ, kí ẹ̀yin lè nípasẹ̀ wọn di alábápín nínú ìwà àtọ̀runwá[a], nígbà tí ẹ ti sá kúrò nínú ìbàjẹ́ tí ó wà nínú ayé nítorí ìfẹ́kúfẹ̀ẹ́ búburú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “olùkópa nínú ìwà àtọ̀runwá.” Gbólóhùn náà sọ nípa kíkópa nínú ohun tí ó ti ọ̀dọ̀ Ọlọ́run wá; kì í ṣe pé ènìyàn di Ọlọ́run ní ìpilẹ̀ ìjẹ́ ẹni.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí ìfẹ́kúfẹ̀ẹ́” tàbí “nípasẹ̀ ìfẹ́-ọkàn búburú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìfẹ́-ọkàn lápapọ̀, ṣùgbọ́n àyíká ọ̀rọ̀ níbí fi ìtumọ̀ odi hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Nípasẹ̀ àwọn nǹkan wọ̀nyí
  rationale: Ó pa ìtumọ̀ ohun èlò tàbí ọ̀nà mọ́, kò sì dá ohun tí ọ̀rọ̀ arọ́pò náà ń tọ́ka sí pàtó, gẹ́gẹ́ bí Gíríìkì ṣe fi í sílẹ̀.
- source_word: τίμια καὶ μέγιστα
  choice: ṣíṣeyebíye àti títóbi lọ́lá
  rationale: “Ṣíṣeyebíye” fi iye gíga hàn; “títóbi lọ́lá” sì mú agbára ọ̀rọ̀ superlative náà jáde ní Yorùbá àdánidá láì sọ pé àwọn ìlérí náà ni ó tóbi jù gbogbo ohun mìíràn lọ.
- source_word: ἡμῖν
  choice: fún wa
  rationale: Dative náà bá èrò fífúnni mu, “fún wa” sì jẹ́ ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: ἐπαγγέλματα
  choice: àwọn ìlérí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì wọ́pọ̀ fún àwọn ohun tí ẹni kan ti ṣèlérí.
- source_word: δεδώρηται
  choice: ó ti fi ... fún wa
  rationale: Ìṣètò perfect náà ní èrò ẹ̀bùn tí a ti fi fúnni tí àbájáde rẹ̀ sì ṣì dúró; “ó ti fi ... fún wa” jẹ́ àdánidá ní Yorùbá.
- source_word: ἵνα
  choice: kí
  rationale: “Kí” ń fi ète tàbí àbájáde hàn lọ́nà tó ṣe déédéé ní Yorùbá.
- source_word: διὰ τούτων
  choice: nípasẹ̀ wọn
  rationale: Ó tọ́ka sí àwọn ìlérí tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, ó sì pa èrò ọ̀nà tàbí ohun èlò mọ́.
- source_word: γένησθε
  choice: lè ... di
  rationale: “Di” pa ìtumọ̀ wíwá sí ipò tuntun mọ́, kì í ṣe wíwà lásán.
- source_word: θείας κοινωνοὶ φύσεως
  choice: alábápín nínú ìwà Ọlọ́run
  rationale: “Alábápín” mú κοινωνός jáde gẹ́gẹ́ bí ẹni tó ní ìpín; “ìwà Ọlọ́run” sọ θεία φύσις ní Yorùbá tó ṣe kedere láì ṣàfikún ẹ̀kọ́ ìsìn kan pàtó.
- source_word: ἀποφυγόντες
  choice: lẹ́yìn tí ẹ ti sá àsálà kúrò
  rationale: Ó fi iṣẹ́ tó ṣáájú tàbí tó bá èkejì lọ hàn, ó sì mú agbára “escape” jáde.
- source_word: φθορᾶς
  choice: ìbàjẹ́
  rationale: “Ìbàjẹ́” lè gba ìtumọ̀ ìwà búburú, ìparun, tàbí dídíbàjẹ́ tí àyíká ọ̀rọ̀ yìí ní.
- source_word: ἐν τῷ κόσμῳ
  choice: tí ó wà nínú ayé
  rationale: Ó fi gbangba hàn pé gbólóhùn náà ń ṣàlàyé “ìbàjẹ́,” gẹ́gẹ́ bí ìṣètò Gíríìkì.
- source_word: ἐν ἐπιθυμίᾳ
  choice: nítorí ìfẹ́kúfẹ̀ẹ́ ẹ̀ṣẹ̀
  rationale: Ní àyíká yìí ἐπιθυμία ní agbára ìwà búburú; “ìfẹ́kúfẹ̀ẹ́ ẹ̀ṣẹ̀” ṣe èyí kedere láì fi í mọ́ ìfẹ́ ìbálòpọ̀ nìkan.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως àti kíkópa nínú ohun ti Ọlọ́run jẹ́
  choice: alábápín nínú ìwà Ọlọ́run
  alternative: olùkópa nínú ìwà Ọlọ́run
  rationale: A pa agbára gbólóhùn Gíríìkì mọ́ láì dín kíkópa náà kù, láì sì sọ pé àwọn onígbàgbọ́ di Ọlọ́run ní ìpilẹ̀ ìjẹ́ wọn.
- issue: Agbára ìwà búburú nínú ἐπιθυμία
  choice: ìfẹ́kúfẹ̀ẹ́ ẹ̀ṣẹ̀
  alternative: ìfẹ́kúfẹ̀ẹ́; ìfẹ́-ọkàn
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìfẹ́-ọkàn lápapọ̀, ṣùgbọ́n ìsopọ̀ rẹ̀ mọ́ ìbàjẹ́ ayé mú ìtumọ̀ odi hàn níbí.
translation_notes:
  register: Yorùbá àgbàṣe tó bójú mu, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ọ̀rọ̀ tó ṣe kedere fún òǹkàwé òde òní, ṣùgbọ́n a pa ọlá àti ìwúwo ẹ̀kọ́ inú ẹsẹ náà mọ́. Àwọn àmì àlàyé [a] àti [b] wà nínú ọ̀rọ̀ ní ibi tí wọ́n bá mu.
