id: 2PE.1.7
reference: 2 Peter 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: yo
  text: àti nínú ìwà-bí-Ọlọ́run, ìfẹ́ni fún àwọn ará[a]; àti nínú ìfẹ́ni fún àwọn ará, ìfẹ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfẹ́ ará.” Ọ̀rọ̀ Gíríìkì náà, φιλαδελφία, ń tọ́ka sí ìfẹ́ni fún àwọn ará, ní pàtàkì àwọn onígbàgbọ́ ẹlẹgbẹ́ ẹni.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: ìfọkànsìn Ọlọ́run
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìfọkànsìn ọlọ́wọ̀ fún Ọlọ́run tí ó hàn nínú ìgbé ayé àti ìwà. Àṣàyàn yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtọ́kasí sí Ọlọ́run mọ́ láì fi èrò ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: φιλαδελφίαν
  choice: ìfẹ́ni sí àwọn ará
  rationale: Ó túmọ̀ sí ìfẹ́ onífẹ̀ẹ́ sí àwọn ará, ní pàtàkì sí àwọn onígbàgbọ́ ẹlẹgbẹ́ ẹni. “Ìfẹ́ni” yà á sọ́tọ̀ kúrò lọ́dọ̀ ἀγάπη tí ó tẹ̀ lé e, nígbà tí “àwọn ará” fi ìbáṣepọ̀ bí ti ìdílé hàn.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: Àṣàyàn tó rọrùn yìí pa ìtumọ̀ gbòòrò ἀγάπη mọ́, ó sì jẹ́ kí ọ̀rọ̀ náà dúró gẹ́gẹ́ bí òpin gíga jù lọ nínú àtòjọ àwọn ìwà rere.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: àti nínú ..., ...
  rationale: Èyí pa àtúnṣe ìṣètò Gíríìkì àti ìsopọ̀ rẹ̀ mọ́ pẹ̀lú àtòjọ ìwà rere tó bẹ̀rẹ̀ ṣáájú, láì fi ọ̀rọ̀ àlàyé tí kò sí nínú orísun kún un.
- source_word: δέ
  choice: àti
  rationale: Níbí, δέ ń so àwọn nǹkan inú àtòjọ pọ̀; kò fi ìtakora tó lágbára hàn.
theological_decisions:
- issue: Ìyàtọ̀ láàárín φιλαδελφία àti ἀγάπη nínú àtòjọ àwọn ìwà rere
  choice: Túmọ̀ φιλαδελφία sí “ìfẹ́ni sí àwọn ará,” kí a sì túmọ̀ ἀγάπη sí “ìfẹ́.”
  alternative: Túmọ̀ φιλαδελφία sí “ìfẹ́ àwọn ará,” kí a sì túmọ̀ ἀγάπη sí “ìfẹ́.”
  rationale: Gíríìkì lo ọ̀rọ̀ méjì tí ìtumọ̀ wọn sún mọ́ra ṣùgbọ́n tí wọn yàtọ̀. “Ìfẹ́ni” pa ìyàtọ̀ náà mọ́, ó sì jẹ́ kí ìtẹ̀síwájú láti inú ìfẹ́ sí àwọn onígbàgbọ́ ẹlẹgbẹ́ ẹni dé inú ìfẹ́ tó gbòòrò hàn kedere.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó níyì, pẹ̀lú àmì ohùn ní ibi tó yẹ. A pa ìṣètò àtúnṣe “àti nínú...” mọ́ nítorí ẹsẹ yìí ń bá àtòjọ ẹsẹ tó ṣáájú lọ; nítorí náà, ó mọ̀ọ́mọ̀ dúró bí abala gbolohun kan nígbà tí a bá ka a lọ́tọ̀.
