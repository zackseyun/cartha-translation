id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: yo
  text: Nítorí kì í ṣe nípa títẹ̀lé àwọn ìtàn àròsọ tí a fi ọgbọ́n àrékérekè dá ni a jẹ́ kí ẹ mọ agbára àti wíwá[a] Olúwa wa Jésù Mèsáyà[b]; ṣùgbọ́n a di ẹlẹ́rìí ojú ọlá ńlá rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wíwà” tàbí “dídé.” Ọ̀rọ̀ Gíríìkì παρουσία lè túmọ̀ sí wíwà, dídé, tàbí—ní ọ̀pọ̀ àyíká Májẹ̀mú Tuntun—wíwá Mèsáyà.
    reason: alternative_reading
  - marker: b
    text: 'Gíríìkì: “Kristi.” A túmọ̀ ọ́ sí “Mèsáyà” níhìn-ín nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: àwọn ìtàn àròsọ tí a fi ọgbọ́n dá sílẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé àwọn ìtàn náà jẹ́ ohun tí a mọ̀ọ́mọ̀ fi ọgbọ́n hù jáde. Ìtumọ̀ yìí pa ìtumọ̀ àbùkù àti ti fífi ọgbọ́n ṣe àgbékalẹ̀ mọ́, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐξακολουθήσαντες
  choice: nípa títẹ̀lé
  rationale: Ó sọ ọ̀nà tí wọn kò gbà jẹ́ kí ọ̀rọ̀ náà di mímọ̀, ó sì mú ìyàtọ̀ tó wà láàárín ìtàn àròsọ àti ẹ̀rí ojú hàn kedere.
- source_word: ἐγνωρίσαμεν
  choice: a fi sọ ... di mímọ̀ fún yín
  rationale: Ìtumọ̀ náà ni láti jẹ́ kí ẹlòmíràn mọ ohun kan; gbólóhùn yìí tún pa ὑμῖν, ‘fún yín,’ mọ́.
- source_word: δύναμιν
  choice: agbára
  rationale: ‘Agbára’ ni ìtumọ̀ tààrà, tó sì wọ́pọ̀ fún δύναμις ní àyíká yìí.
- source_word: παρουσίαν
  choice: wíwá
  rationale: ‘Wíwá’ lè tọ́ka sí dídé ẹni kan, ó sì bá ìlò ọ̀rọ̀ náà fún wíwá Mèsáyà mu. Nítorí παρουσία tún lè túmọ̀ sí wíwà níbẹ̀ tàbí dídé, a pa àwọn ìtumọ̀ wọ̀nyẹn mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: κυρίου
  choice: Olúwa
  rationale: ‘Olúwa’ ni ọ̀rọ̀ oyè Yorùbá tó bójú mu fún κύριος nígbà tí a lò ó fún Jésù.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín; ‘Mèsáyà’ mú ìtumọ̀ oyè ẹni tí a fòróró yàn jáde kedere dípò kí a sọ ọ́ di orúkọ lásán.
- source_word: ἐπόπται γενηθέντες
  choice: àwa fúnra wa fi ojú rí
  rationale: Gbólóhùn Yorùbá yìí sọ ẹ̀rí ẹni tó rí ohun náà fúnra rẹ̀ ní ọ̀nà àdánidá, ó sì pa agbára ẹ̀rí ἐπόπται mọ́.
- source_word: μεγαλειότητος
  choice: ọlá ńlá
  rationale: ‘Ọlá ńlá’ fi ìtóbi, ọlá àti ọlá-àṣẹ inú μεγαλειότης hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐκείνου
  choice: rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò ohun-ìní yìí tọ́ka padà sí Olúwa Jésù Mèsáyà lọ́nà àdánidá.
theological_decisions:
- issue: Ìtumọ̀ παρουσία ní ọ̀rọ̀ nípa Jésù
  choice: wíwá
  alternative: wíwà níbẹ̀ tàbí dídé
  rationale: Nínú ọ̀pọ̀ àyíká Májẹ̀mú Tuntun, παρουσία ń tọ́ka sí wíwá Jésù lọ́jọ́ iwájú; síbẹ̀, ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí wíwà níbẹ̀ tàbí dídé. A yan ‘wíwá’ sínú ẹsẹ̀, a sì fi àìdánilójú tó jẹ́ ojúlówó pamọ́ sínú àlàyé ìsàlẹ̀.
- issue: Bóyá Χριστός jẹ́ oyè tàbí apá kan orúkọ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àkójọpọ̀ ‘Olúwa wa Jésù Mèsáyà,’ Χριστός ṣì ní agbára oyè ẹni tí a fòróró yàn. ‘Mèsáyà’ mú ìtumọ̀ yẹn hàn kedere láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘a fi ... di mímọ̀’ àti ‘àwa fúnra wa fi ojú rí’ láti jẹ́ kí ìyàtọ̀ tó wà nínú Gíríìkì láàárín ìtàn tí a hù jáde àti ẹ̀rí ojú hàn kedere. Àmì ohùn kún gbogbo ibi tí ó yẹ.
