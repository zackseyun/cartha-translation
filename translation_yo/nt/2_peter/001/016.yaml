revisions:
- from: Nítorí kì í ṣe nípa títẹ̀lé àwọn ìtàn àròsọ tí a fi ọgbọ́n dá sílẹ̀ ni a fi sọ agbára àti wíwá[a] Olúwa wa Jésù Mèsáyà[b] di mímọ̀ fún yín; kàkà bẹ́ẹ̀, àwa fúnra wa fi ojú rí ọlá ńlá rẹ̀.
  to: Nítorí kì í ṣe nípa títẹ̀lé àwọn ìtàn àròsọ tí a fi ọgbọ́n àrékérekè dá ni a jẹ́ kí ẹ mọ agbára àti wíwá[a] Olúwa wa Jésù Mèsáyà[b]; ṣùgbọ́n a di ẹlẹ́rìí ojú ọlá ńlá rẹ̀.
  rationale: 'The revision retains the draft’s theological and lexical choices while making three limited corrections: it gives ἐγνωρίσαμεν an unambiguous modern Yoruba rendering, represents the becoming-eyewitnesses construction, and makes the artful/deceptive nuance of the myths explicit. The footnote for παρουσία is slightly tightened so that ‘presence’ is not unnecessarily narrowed to being physically ‘there.’'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:29:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the central contrast: the message about the Lord Jesus the Messiah''s power and coming was not derived from fabricated myths but from direct observation of his majesty. However, “sọ ... di mímọ̀” is not a safe modern Yoruba equivalent for ἐγνωρίσαμεν (‘made known’), and the final clause should retain the source''s sense of becoming eyewitnesses.'
  naturalness: The overall register is clear and suitably elevated. Replacing “a fi sọ ... di mímọ̀” with “a jẹ́ kí ẹ mọ” is more idiomatic and avoids the usual Yoruba associations of mímọ̀ with holiness or cleanliness. “Ọgbọ́n àrékérekè” explicitly conveys the disparaging, artfully fabricated force of σεσοφισμένοις.
  terminology: “Olúwa,” “Jésù Mèsáyà,” “agbára,” “wíwá,” and “ọlá ńlá” are suitable. “Ẹlẹ́rìí ojú” faithfully renders the evidentiary force of ἐπόπται. The note appropriately preserves ‘presence’ and ‘arrival’ as lexical possibilities for παρουσία.
  issues:
  - severity: medium
    issue: “a fi sọ ... di mímọ̀” for ἐγνωρίσαμεν
    rationale: In current Standard Yoruba, di mímọ̀ normally means becoming holy, clean, or pure. It is therefore liable to obscure ‘made known.’ “A jẹ́ kí ẹ mọ” directly and naturally expresses the Greek verb.
  - severity: low
    issue: The final clause does not explicitly represent γενηθέντες (‘having/becoming’).
    rationale: “Àwa fúnra wa fi ojú rí” conveys direct sight, but “a di ẹlẹ́rìí ojú” preserves both the eyewitness status and the participle’s becoming aspect.
  - severity: low
    issue: “fi ọgbọ́n dá sílẹ̀” can sound merely intelligent rather than cunningly fabricated.
    rationale: Adding “àrékérekè” better conveys the pejorative crafted quality of σεσοφισμένοις while remaining natural Yoruba.
  revised_text: Nítorí kì í ṣe nípa títẹ̀lé àwọn ìtàn àròsọ tí a fi ọgbọ́n àrékérekè dá ni a jẹ́ kí ẹ mọ agbára àti wíwá[a] Olúwa wa Jésù Mèsáyà[b]; ṣùgbọ́n a di ẹlẹ́rìí ojú ọlá ńlá rẹ̀.
  revised_footnotes:
  - marker: a
    text: Tàbí, “wíwà” tàbí “dídé.” Ọ̀rọ̀ Gíríìkì παρουσία lè túmọ̀ sí wíwà, dídé, tàbí—ní ọ̀pọ̀ àyíká Májẹ̀mú Tuntun—wíwá Mèsáyà.
    reason: alternative_reading
  - marker: b
    text: 'Gíríìkì: “Kristi.” A túmọ̀ ọ́ sí “Mèsáyà” níhìn-ín nítorí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.'
    reason: lexical_alternative
  revision_rationale: 'The revision retains the draft’s theological and lexical choices while making three limited corrections: it gives ἐγνωρίσαμεν an unambiguous modern Yoruba rendering, represents the becoming-eyewitnesses construction, and makes the artful/deceptive nuance of the myths explicit. The footnote for παρουσία is slightly tightened so that ‘presence’ is not unnecessarily narrowed to being physically ‘there.’'
