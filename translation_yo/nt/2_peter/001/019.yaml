id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: yo
  text: Àwa sì ní ọ̀rọ̀ àsọtẹ́lẹ̀ náà tí ó túbọ̀ dájú[a]; ẹ sì ń ṣe dáadáa ní fífi àfiyèsí sí i gẹ́gẹ́ bí ẹ ṣe ń fi àfiyèsí sí fìtílà kan tí ń tàn ní ibi òkùnkùn, títí di ìgbà tí ọjọ́ yóò fi mọ́, tí ìràwọ̀ òwúrọ̀[b] yóò sì yọ nínú ọkàn yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àwa sì ní ọ̀rọ̀ àsọtẹ́lẹ̀ náà tí ó dájú sí i.” A lè lóye Gíríìkì náà pé ẹ̀rí àwọn àpọ́sítélì fìdí ọ̀rọ̀ àsọtẹ́lẹ̀ múlẹ̀ sí i, tàbí pé ó ń tẹnumọ́ bí ọ̀rọ̀ àsọtẹ́lẹ̀ náà ṣe dájú tó.
    reason: alternative_reading
  - marker: b
    text: Ó ṣeé ṣe kí “ìràwọ̀ òwúrọ̀” rántí àwòrán kan nípa Mèsáyà; fi wé Ìfihàn 22:16.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: tí ó túbọ̀ dájú
  rationale: Ó pa ìtumọ̀ ìfiwéra mọ́, ìyẹn ‘ó dájú sí i,’ láìfi kún un pé ẹ̀rí àwọn aposteli ló ‘sọ ọ́ di’ èyí tí ó dájú.
- source_word: προφητικὸν λόγον
  choice: ọ̀rọ̀ àsọtẹ́lẹ̀ náà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere, tó sì pa èrò ‘ọ̀rọ̀’ àti ti àsọtẹ́lẹ̀ mọ́.
- source_word: ᾧ ... προσέχοντες
  choice: láti máa fiyè sí i
  rationale: Ó fi hàn pé kí wọ́n máa fi ìṣọ́ra àti àkíyèsí sí ọ̀rọ̀ náà, ní èdè Yorùbá òde òní tí ó ṣàn.
- source_word: λύχνῳ φαίνοντι
  choice: fìtílà kan tí ń tàn
  rationale: Ó pa àfiwé fìtílà àti ìṣe tí ń bá a lọ mọ́.
- source_word: αὐχμηρῷ τόπῳ
  choice: ibi òkùnkùn
  rationale: Ó bá àwòrán fìtílà mu, ó sì jẹ́ ìtumọ̀ kedere fún ibi tí ó ṣókùnkùn tàbí tí kò mọ́lẹ̀.
- source_word: ἡμέρα διαυγάσῃ
  choice: ọjọ́ yóò fi mọ́
  rationale: Ó sọ ìmọ́lẹ̀ òwúrọ̀ tó ń bẹ̀rẹ̀ ní ọ̀nà Yorùbá àdánidá, ó sì pa ‘ọjọ́’ inú àwòrán Gíríìkì mọ́.
- source_word: φωσφόρος
  choice: ìràwọ̀ òwúrọ̀
  rationale: Èyí ni orúkọ Yorùbá tó ṣe kedere fún ìràwọ̀ tí ń farahàn ní àfẹ̀mọ́júmọ́; kò fi ìdánimọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún àwòrán náà.
- source_word: ἀνατείλῃ
  choice: yóò ... yọ
  rationale: ‘Yọ’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún bí ìràwọ̀ tàbí oòrùn ṣe ń farahàn lókè.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: nínú ọkàn yín
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí ó pa ìtọ́ka sí ẹni inú mọ́ láìdín ‘ọkàn’ kù sí ìmọ̀lára nìkan.
theological_decisions:
- issue: Ìbáṣepọ̀ βεβαιότερον pẹ̀lú ẹ̀rí àwọn aposteli àti ọ̀rọ̀ àsọtẹ́lẹ̀
  choice: tí ó túbọ̀ dájú
  alternative: tí a ti mú dájú sí i; ọ̀rọ̀ àsọtẹ́lẹ̀ tí ó dájú jù
  rationale: Gíríìkì lè túmọ̀ sí pé ẹ̀rí àwọn aposteli fìdí ọ̀rọ̀ àsọtẹ́lẹ̀ múlẹ̀ sí i, tàbí pé ó ń tẹnumọ́ bí ọ̀rọ̀ náà ṣe dájú tó. Gbólóhùn Yorùbá yìí pa ìfiwéra àti àìdánilójú ìtumọ̀ náà mọ́ láìyanju rẹ̀ ní ìkọ̀kọ̀.
- issue: Ẹni tàbí ohun tí ‘ìràwọ̀ òwúrọ̀’ ń tọ́ka sí
  choice: A pa àwòrán ‘ìràwọ̀ òwúrọ̀’ mọ́ láìsọ ẹni tí ó jẹ́ ní pàtó nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: Kí a sọ ọ́ ní tààrà gẹ́gẹ́ bí Mèsáyà/Kristi tàbí gẹ́gẹ́ bí ìmọ́lẹ̀ ìkẹyìn.
  rationale: Àwọn ẹsẹ Bíbélì mìíràn lè mú kí òǹkàwé gbọ́ ìtumọ̀ nípa Mèsáyà, ṣùgbọ́n ẹsẹ yìí fúnra rẹ̀ kò sọ ìdánimọ̀ náà ní tààrà. Ìtumọ̀ náà fi àfojúsùn ẹ̀kọ́ ìgbàgbọ́ sílẹ̀ bí orísun ṣe ṣe.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún, ní ìforúkọsílẹ̀ ọ̀wọ̀ àti èdè òde òní tí ó yé òǹkàwé lasan. “Fiyè sí i,” “ibi òkùnkùn,” àti “ìràwọ̀ òwúrọ̀” jẹ́ adayeba, ṣùgbọ́n wọ́n ṣì pa àwòrán àti ìwọ̀ntúnwọ̀nsì orísun Gíríìkì mọ́.
