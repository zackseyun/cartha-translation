  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ìfiwéra nínú βεβαιότερον mọ́, ó tumọ̀ προσέχοντες gẹ́gẹ́ bí fífi àfiyèsí sí, ó sì dá àwọn àwòrán fìtílà, òkùnkùn, ìmọ́lẹ̀ ọjọ́, àti ìràwọ̀ òwúrọ̀ dúró. Àmọ́, ìṣọ̀kan ‘bí fìtílà’ lè dà bí pé ọ̀rọ̀ àsọtẹ́lẹ̀ náà fúnra rẹ̀ ni fìtílà, dípò ìtumọ̀ pé kí wọ́n fiyè sí i gẹ́gẹ́ bí wọ́n ṣe máa fiyè sí fìtílà. Àtúnṣe kékeré kan mú ìbáṣepọ̀ gbolohun Gíríìkì náà hàn sí i.'
