revisions:
- from: Nítorí kò sí àsọtẹ́lẹ̀ kankan tí a mú wá nígbà kan rí nípa ìfẹ́ ènìyàn,[a] ṣùgbọ́n àwọn ènìyàn sọ ọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run bí Ẹ̀mí Mímọ́ ti ń gbé wọn lọ.[b]
  to: Nítorí a kò mú àsọtẹ́lẹ̀ wá rí nípa ìfẹ́ ènìyàn, ṣùgbọ́n àwọn ènìyàn sọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run nígbà tí Ẹ̀mí Mímọ́ ń gbé wọn lọ.[a]
  rationale: A tún gbolohun àkọ́kọ́ ṣe fún Yorùbá tó dára síi, láìyí ìtumọ̀ passive ti ἠνέχθη tàbí ìtẹnumọ́ ποτέ padà. A yọ “ọ̀rọ̀” kúrò lẹ́yìn “sọ̀rọ̀,” nítorí pé “sọ̀rọ̀” ti pé ní Yorùbá, a sì lo “nígbà tí” láti so participulu φερόμενοι mọ́ iṣẹ́ “sọ̀rọ̀” ní ti àkókò. Ẹsẹ̀-ìsàlẹ̀ kan ṣoṣo ni a fi sílẹ̀, nítorí àṣàyàn “mú jáde” kò ṣe pàtàkì fún ìtumọ̀ àkọ́kọ́, nígbà tí àṣàyàn “darí” ṣàlàyé ọ̀rọ̀ àwòrán náà fún olùkà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:30:24Z'
