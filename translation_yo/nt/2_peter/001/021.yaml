  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: àsọtẹ́lẹ̀ kò ti ìfẹ́ ènìyàn wá; àwọn ènìyàn sì sọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run nípasẹ̀ ìṣiṣẹ́ Ẹ̀mí Mímọ́. Síbẹ̀, ìṣọ̀kan “kò sí àsọtẹ́lẹ̀ ... tí a mú wá” kò dára tó ní Yorùbá, ó sì jẹ́ kí ìlànà gbolohun náà rọ̀ díẹ̀. Àtúnṣe náà pa ohùn àìṣe ἠνέχθη àti ìfararora rẹ̀ pẹ̀lú φερόμενοι mọ́.'
