id: 2PE.1.21
reference: 2 Peter 1:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: yo
  text: Nítorí a kò mú àsọtẹ́lẹ̀ wá rí nípa ìfẹ́ ènìyàn, ṣùgbọ́n àwọn ènìyàn sọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run nígbà tí Ẹ̀mí Mímọ́ ń gbé wọn lọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí Ẹ̀mí Mímọ́ ń darí wọn.” Ní tààrà, Gíríìkì sọ pé Ẹ̀mí Mímọ́ “ń gbé wọn lọ,” èyí tó tẹnu mọ́ iṣẹ́ ìdarí rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: nípa ìfẹ́ ènìyàn
  rationale: 'Ó pa ohun èlò tàbí okùnfà mọ́: àsọtẹ́lẹ̀ kò pilẹ̀ṣẹ̀ láti inú ìfẹ́ ènìyàn. “Ènìyàn” lè dúró fún gbogbo ẹ̀dá ènìyàn láìfi akọ tàbí abo kan sílẹ̀.'
- source_word: ἠνέχθη
  choice: tí a mú wá
  rationale: Àpólà yìí pa ohùn àìṣe mọ́, ó sì ní ìbátan pẹ̀lú φερόμενοι ní apá kejì ẹsẹ náà. Ó tọ́ka sí bí àsọtẹ́lẹ̀ ṣe wáyé láìṣe àlàyé tó kọjá ohun tí Gíríìkì sọ.
- source_word: προφητεία
  choice: àsọtẹ́lẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ọ̀rọ̀ ìfihàn tàbí ìkéde àsọtẹ́lẹ̀.
- source_word: ποτέ
  choice: nígbà kan rí
  rationale: Pẹ̀lú οὐ, ó fúnni ní ìtumọ̀ líle pé “kò ... nígbà kan rí,” èyí tó bá Yorùbá àdánidá mu.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: bí Ẹ̀mí Mímọ́ ti ń gbé wọn lọ
  rationale: Ìtumọ̀ yìí fi Ẹ̀mí Mímọ́ hàn gẹ́gẹ́ bí olùṣe tó ń darí wọn, gẹ́gẹ́ bí ὑπό pẹ̀lú ọ̀rọ̀-orúkọ oníṣe ṣe fi hàn.
- source_word: φερόμενοι
  choice: tí ń gbé wọn lọ
  rationale: Ó pa àwòrán gidi ti φέρω mọ́, ó sì tẹnu mọ́ ìdarí àti agbára Ẹ̀mí ju ọ̀rọ̀ àìmọ́ bí “mú wọn” lọ.
- source_word: ἐλάλησαν
  choice: sọ ọ̀rọ̀
  rationale: Ìtumọ̀ tààrà àti àdánidá fún λαλέω ni pé wọ́n sọ̀rọ̀; “sọ ọ̀rọ̀” tún gba ohun tí wọ́n sọ láyè láìfi kún un.
- source_word: ἀπὸ θεοῦ
  choice: láti ọ̀dọ̀ Ọlọ́run
  rationale: 'Ó pa ìtumọ̀ orísun mọ́: ọ̀rọ̀ náà wá láti ọ̀dọ̀ Ọlọ́run, láìdà á pọ̀ mọ́ iṣẹ́ Ẹ̀mí gẹ́gẹ́ bí olùdarí.'
- source_word: ἄνθρωποι
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì túmọ̀ ἄνθρωποι gẹ́gẹ́ bí àwọn olùsọ ènìyàn láìsọ pé akọ nìkan ni.
theological_decisions:
- issue: Ìbáṣepọ̀ iṣẹ́ Ọlọ́run àti ti ènìyàn nínú àsọtẹ́lẹ̀
  choice: Àwọn ènìyàn ló sọ ọ̀rọ̀ náà ní tòótọ́, ṣùgbọ́n orísun rẹ̀ ni Ọlọ́run, Ẹ̀mí Mímọ́ sì ń gbé wọn lọ.
  alternative: Kí a túmọ̀ rẹ̀ bí ẹni pé Ẹ̀mí sọ ọ̀rọ̀ náà fún wọn lẹ́yọ-ọ̀kan láìsí ipa gidi ti àwọn olùsọ, tàbí bí ẹni pé ìfẹ́ ènìyàn ní apá kan nínú ìpilẹ̀ṣẹ̀ rẹ̀.
  rationale: 'Gíríìkì pa méjèèjì mọ́: “àwọn ènìyàn sọ ọ̀rọ̀,” síbẹ̀ ọ̀rọ̀ náà wá “láti ọ̀dọ̀ Ọlọ́run,” Ẹ̀mí Mímọ́ sì ń gbé wọn lọ. Ìtumọ̀ náà kò yí èyí sí ìkọsọ̀rọ̀ aláìlérò tàbí sí ìpilẹ̀ṣẹ̀ ènìyàn.'
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo “àwọn ènìyàn” fún ἄνθρωποι nítorí Yorùbá kò nílò akọ gẹ́gẹ́ bí Gíríìkì, bẹ́ẹ̀ ni ọ̀rọ̀ náà kò yọ obìnrin kúrò níbi tí ìtumọ̀ jẹ́ ti gbogbo ènìyàn. Àtúnṣe gbolohun náà jẹ́ àdánidá ní Yorùbá, ó sì pa ìfararora ἠνέχθη/φερόμενοι mọ́ nípasẹ̀ “mú wá/gbé ... lọ.”
