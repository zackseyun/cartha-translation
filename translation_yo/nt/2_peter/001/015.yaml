source:
  edition: SBLGNT
  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: yo
  text: Èmi yóò sì ṣe gbogbo ìsapá mi kí ẹ lè rántí àwọn nǹkan wọ̀nyí nígbàkigbà lẹ́yìn ìkúrò mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní kedere sí i, “lẹ́yìn ikú mi.” Ọ̀rọ̀ Gíríìkì sọ pé “lẹ́yìn ìkúrò mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: Èmi yóò sì sa gbogbo ipá mi
  rationale: Ọ̀rọ̀ yìí fi ìsapá àtọkànwá àti ìtara hàn. ‘Sa gbogbo ipá mi’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: δὲ
  choice: sì
  rationale: Níhìn-ín, δέ ń tẹ̀ síwájú lórí ohun tí a ṣẹ̀ṣẹ̀ sọ, kì í ṣe ìtakora líle; ‘sì’ bá ìṣàn ọ̀rọ̀ náà mu.
- source_word: καὶ
  choice: kí
  rationale: Nínú àkópọ̀ gbólóhùn aláìlẹ́ni yìí, καί ń ṣàfikún ète ìsapá Pétérù. ‘Kí’ fi ète náà hàn ní Yorùbá àdánidá.
- source_word: ἑκάστοτε
  choice: nígbà gbogbo
  rationale: ἑκάστοτε túmọ̀ sí ní gbogbo ìgbà tàbí ní gbogbo ìṣẹ̀lẹ̀ tí ó bá yẹ. ‘Nígbà gbogbo’ sọ pé wọn yóò lè rántí rẹ̀ nígbàkigbà tí ó bá yẹ.
- source_word: ἔχειν ὑμᾶς
  choice: kí ẹ̀yin lè
  rationale: Àkópọ̀ ἔχειν pẹ̀lú ọ̀rọ̀ aláìlẹ́ni lè fi agbára tàbí àǹfààní hàn. ‘Kí ẹ̀yin lè’ mú ìtumọ̀ yẹn jáde ní Yorùbá tí ó ṣe kedere.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: lẹ́yìn ìkúrò mi
  rationale: ἔξοδος túmọ̀ ní tààrà sí ìkúrò tàbí jíjáde, ṣùgbọ́n níhìn-ín ó ń tọ́ka sí ikú Pétérù lọ́nà ìṣàpẹẹrẹ. ‘Ìkúrò mi’ pa àwòrán ọ̀rọ̀ náà mọ́ láì túmọ̀ rẹ̀ ju bí ó ti yẹ lọ.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: máa rántí àwọn nǹkan wọ̀nyí
  rationale: Èyí jẹ́ àkójọpọ̀ ọ̀rọ̀ tí ó túmọ̀ sí mímú ohun padà wá sí ọkàn. ‘Máa rántí’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì fi ìrántí tí ń bá a lọ hàn.
- source_word: τούτων
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ náà ń tọ́ka padà sí àwọn òtítọ́ tí Pétérù ti ń tẹnumọ́; ‘àwọn nǹkan wọ̀nyí’ jẹ́ ìtumọ̀ tààrà tí ó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ἔξοδος nípa òpin ayé Pétérù tí ó ń bọ̀
  choice: ìkúrò mi
  alternative: ikú mi
  rationale: Ọ̀rọ̀ Gíríìkì lo àpèjúwe fún ikú Pétérù. Ọ̀rọ̀ inú ẹsẹ̀ pa àpèjúwe náà mọ́, nígbà tí àlàyé ìsàlẹ̀ sọ ìtumọ̀ rẹ̀ ní kedere; èyí kò fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A fi àmì ohùn sí ibi tí ó bá yẹ, a sì pa àwòrán ‘ìkúrò’ mọ́ pẹ̀lú àlàyé ìsàlẹ̀.
