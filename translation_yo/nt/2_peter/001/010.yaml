  to: Nítorí náà, ẹ̀yin arákùnrin[a], ẹ túbọ̀ máa sapá láti mú ìpè àti yíyan yín dájú; nítorí nígbà tí ẹ bá ń ṣe àwọn nǹkan wọ̀nyí, ẹ kì yóò kọsẹ̀ láéláé.
