    rationale: Èdè Gíríìkì kì í ‘túmọ̀ sí’ níbí; a lè sọ pé ‘Nínú ọ̀rọ̀ Gíríìkì, a lò “arákùnrin”.’ Èyí jẹ́ ìsọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, ó sì pa ìpinnu ìtúmọ̀ mọ́.
