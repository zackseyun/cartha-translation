id: 2PE.1.10
reference: 2 Peter 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin arákùnrin[a], ẹ túbọ̀ máa sapá láti mú ìpè àti yíyan yín dájú; nítorí nígbà tí ẹ bá ń ṣe àwọn nǹkan wọ̀nyí, ẹ kì yóò kọsẹ̀ láéláé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin arákùnrin àti arábìnrin.” Nínú ọ̀rọ̀ Gíríìkì, a lò “arákùnrin,” ṣùgbọ́n ó lè pe gbogbo àwùjọ àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé ìmọ̀ràn yìí jẹ́ àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ ṣáájú.
- source_word: μᾶλλον
  choice: ẹ túbọ̀
  rationale: Ó pa agbára afíwéra ọ̀rọ̀ Gíríìkì mọ́, ó sì ń mú àṣẹ náà lágbára ní Yorùbá àdánidá.
- source_word: ἀδελφοί
  choice: ẹ̀yin arákùnrin[a]
  rationale: Ó pa ìrísí ọ̀pọ̀ akọ inú Gíríìkì mọ́; àlàyé ìsàlẹ̀ fi hàn pé ó lè kan gbogbo àwùjọ àwọn onígbàgbọ́.
- source_word: σπουδάσατε
  choice: ẹ ... fi taratara
  rationale: Ó sọ ìtara àti ìsapá tọkàntọkàn tí àṣẹ Gíríìkì ń béèrè lọ́nà Yorùbá tó ṣe déédé.
- source_word: βεβαίαν ... ποιεῖσθαι
  choice: mú ... fìdí múlẹ̀
  rationale: Ó mú èrò fífi ohun kan dájú tàbí mú un dúró ṣinṣin jáde, láìsọ pé àwọn olùgbọ́ ló dá ìpè tàbí yíyan Ọlọ́run sílẹ̀ ní ìbẹ̀rẹ̀.
- source_word: κλῆσιν
  choice: ìpè
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìpè tàbí àṣẹ ìkéde Ọlọ́run.
- source_word: ἐκλογὴν
  choice: yíyan
  rationale: Ó tọ́ka sí iṣẹ́ yíyan láìfi èrò ẹ̀kọ́ ìjọ kan pàtó kún un.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka sẹ́yìn sí àwọn ìwà àti ìṣe tí a mẹ́nu kàn nínú àwọn ẹsẹ tó ṣáájú.
- source_word: ποιοῦντες
  choice: bí ẹ bá ń ṣe
  rationale: Ó sọ ipa oníhàlà tí participle náà ní nínú gbólóhùn yìí ní Yorùbá àdánidá.
- source_word: οὐ μὴ ... ποτε
  choice: ẹ kì yóò ... láéláé
  rationale: Ìkọ̀ líle yìí pa agbára ìsẹ́ Gíríìkì mọ́.
- source_word: πταίσητέ
  choice: kọsẹ̀
  rationale: Ó pa àwòrán ìkọsẹ̀ mọ́, kò sì sọ ọ́ di ẹ̀kọ́ pé ènìyàn kò lè dẹ́ṣẹ̀ rárá tàbí pé ó dájú pé kì yóò ṣubú kúrò nínú ìgbàgbọ́ níkẹyìn.
theological_decisions:
- issue: Ìtumọ̀ ‘mú ìpè àti yíyan yín fìdí múlẹ̀’
  choice: Ìkìlọ̀ láti fi ìtara àti ìwà rere mú òtítọ́ ìpè àti yíyan náà dúró ṣinṣin tàbí hàn gbangba.
  alternative: Pé ìsapá ènìyàn ló dá ìpè àti yíyan Ọlọ́run sílẹ̀ tàbí ló pinnu rẹ̀.
  rationale: Àkópọ̀ βεβαίαν àti ποιεῖσθαι ń sọ nípa mímú ohun kan dájú tàbí dúró ṣinṣin. Ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ inú ẹsẹ mọ́ láìyanju rẹ̀ gẹ́gẹ́ bí èrò ẹ̀ka ìjọ kan.
- issue: Agbára ‘ẹ kì yóò kọsẹ̀ láéláé’
  choice: Ìlérí pé ṣíṣe àwọn nǹkan wọ̀nyí yóò dá wọn sí lọ́wọ́ ìkọsẹ̀ nínú ìrìn ìgbàgbọ́.
  alternative: Ìdánilójú pé wọn kì yóò dẹ́ṣẹ̀ kankan mọ́ láé, tàbí ìtumọ̀ pàtó pé wọn kì yóò ṣubú kúrò nínú ìgbàgbọ́ níkẹyìn.
  rationale: πταίω ń lo àwòrán ìkọsẹ̀; fífi ‘kọsẹ̀’ sílẹ̀ pa ààyè ìtumọ̀ ọ̀rọ̀ náà mọ́, kò sì sọ ọ́ di ẹ̀kọ́ ìjọ kan tó ju ohun tí ẹsẹ náà sọ lọ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Fi taratara’ jẹ́ ọ̀nà àdánidá láti sọ ìsapá onítara, ‘mú ... fìdí múlẹ̀’ sì pa ìtumọ̀ ìfẹsẹ̀múlẹ̀ mọ́ láìṣàlàyé ẹ̀kọ́ ìgbàgbọ́ ju ẹsẹ náà lọ.
