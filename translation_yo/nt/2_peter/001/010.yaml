  source_fidelity: 'Ìtumọ̀ yìí ń tẹ̀lé ìṣọ̀kan ọ̀rọ̀ Gíríìkì dáadáa: διὸ jẹ́ ìpinnu láti ohun tó ṣáájú, μᾶλλον ń fi ìtara kún àṣẹ náà, ó sì pa ìkọ̀ líle οὐ μὴ ... ποτε mọ́ nínú ‘kì yóò ... láéláé.’ Síbẹ̀, ‘mú ... fìdí múlẹ̀’ lè dún bí ìgbésẹ̀ láti dá ìpè àti yíyan sílẹ̀ tàbí láti fi ìpìlẹ̀ wọn kalẹ̀. ‘Mú ... dájú’ sún mọ́ βεβαίαν ... ποιεῖσθαι síi: mímú wọn di ohun tí a fìdí rẹ̀ múlẹ̀/ohun tí ó dájú, láìṣètò ẹ̀kọ́ ìjọ kan.'
  naturalness: ‘Ẹ túbọ̀ máa sapá láti mú ... dájú’ jẹ́ èdè Yorùbá ìgbàlódé tí ó rọrùn, ó sì sọ ìtara σπουδάσατε ní kíkún ju ‘ẹ túbọ̀ fi taratara mú ... fìdí múlẹ̀,’ èyí tí ó lè wuwo díẹ̀, lọ. ‘Nígbà tí ẹ bá ń ṣe’ ń pa participle ποιοῦντες mọ́ gẹ́gẹ́ bí ìṣe tí ń bá ìlérí náà lọ; kò fi ìtumọ̀ tuntun kún un.
  terminology: ‘Ìpè’ fún κλῆσις, ‘yíyan’ fún ἐκλογή, àti ‘kọsẹ̀’ fún πταίω jẹ́ àwọn yíyan tó bójú mu. A fi ‘yíyan’ sílẹ̀ dípò ọ̀rọ̀ ìmọ̀-ẹ̀kọ́ tó lè dá olùkà sí èrò ẹ̀ka ìjọ kan. A tún ṣàtúnṣe àlàyé ìsàlẹ̀ kí ó má sọ pé ọ̀rọ̀ Gíríìkì ‘túmọ̀ ní tààrà,’ bí kò ṣe pé Gíríìkì ‘ní’ arákùnrin.
