id: 2PE.1.5
reference: 2 Peter 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: yo
  text: 'Nítorí ìdí yìí gan-an náà, ẹ fi gbogbo ìtara yín sí i: ẹ fi ìwà rere[b] kún[c] ìgbàgbọ́[a] yín[d], kí ẹ sì fi ìmọ̀ kún ìwà rere.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìgbẹ́kẹ̀lé” tàbí “òtítọ́ṣinṣin” fún ìgbàgbọ́ (πίστις).
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìwà títayọ” fún ìwà rere (ἀρετή).
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ ìṣe tí a túmọ̀ sí “fi … kún” tún lè túmọ̀ sí “pèsè” tàbí “fúnni ní,” pẹ̀lú èrò pípèsè lọ́pọ̀ yanturu.
    reason: lexical_alternative
  - marker: d
    text: 'Ní ọ̀nà tó tẹ̀ lé ìṣètò Gíríìkì ní pẹ̀kipẹ̀ki: “ẹ pèsè ìwà rere nínú ìgbàgbọ́ yín.”'
    reason: previous_rendering
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: Àní nítorí ìdí yìí gan-an
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà tẹ ìsopọ̀ pẹ̀lú ẹsẹ tó ṣáájú mọ́lẹ̀. ‘Nítorí ìdí yìí gan-an’ mú ìtumọ̀ ìdí náà jáde, ‘Àní’ sì ń fi agbára àfikún δὲ hàn lọ́nà Yorùbá àdánidá.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: ẹ fi gbogbo ìtara yín sí i
  rationale: Èyí tú participle náà sí ọ̀rọ̀ àṣẹ Yorùbá tó ṣe kedere, ó sì pa èrò ìsapá àtọkànwá àti ìtara kíkún mọ́.
- source_word: ἐπιχορηγήσατε
  choice: ẹ fi … kún
  rationale: Nínú àtòjọ àwọn ànímọ́ yìí, ‘fi … kún’ jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ pé kí wọ́n pèsè tàbí mú ànímọ́ kan wà ní ìbáṣepọ̀ pẹ̀lú òmíràn. Àlàyé ìsàlẹ̀ pa ìtumọ̀ pípèsè lọ́pọ̀ yanturu mọ́.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: kún ìgbàgbọ́ yín
  rationale: Bí ó tilẹ̀ jẹ́ pé ἐν túmọ̀ ní tààrà sí ‘nínú,’ lílo ‘fi … kún’ jẹ́ Yorùbá àdánidá, ó sì mú ìlọsíwájú àwọn ànímọ́ inú àtòjọ náà ṣe kedere láìsọ pé wọn kò ní ìbáṣepọ̀ tímọ́tímọ́.
- source_word: πίστει
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ ni ọ̀rọ̀ Yorùbá tó bá ìtumọ̀ pàtàkì πίστις mu níbí; ìtumọ̀ míì bí ‘ìgbẹ́kẹ̀lé’ tàbí ‘òtítọ́ṣinṣin’ wà nínú àlàyé ìsàlẹ̀.
- source_word: ἀρετήν
  choice: ìwà rere
  rationale: ἀρετή ń tọ́ka sí dídára tàbí jíjẹ́ ẹni tó dára ní ti ìwà. ‘Ìwà rere’ ṣe kedere sí òǹkàwé Yorùbá òde òní, ó sì ní agbára ìwà rere tó yẹ.
- source_word: γνῶσιν
  choice: ìmọ̀
  rationale: ‘Ìmọ̀’ bá ìtumọ̀ àárín gbùngbùn γνῶσις mu, láìfi ìtumọ̀ àlàyé bí ‘òye jíjinlẹ̀’ tàbí ‘ìfòyemọ̀’ kún un.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àtòjọ àwọn ànímọ́
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; òtítọ́ṣinṣin
  rationale: Àyíká ọ̀rọ̀ kò fi dandan mú ká yan ìtumọ̀ ‘òtítọ́ṣinṣin.’ ‘Ìgbàgbọ́’ ni ìtumọ̀ tó ṣe tààrà jù, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì náà mọ́.
- issue: Ìbáṣepọ̀ tí ἐν ń fi hàn láàárín àwọn ànímọ́
  choice: fi … kún
  alternative: pèsè … nínú
  rationale: Gíríìkì lè fi hàn pé ànímọ́ kan ni a ń pèsè ní ìbáṣepọ̀ pẹ̀lú òmíràn, kì í ṣe pé a kan ń to àwọn ohun tí kò ní ìbáṣepọ̀ pọ̀. Ọ̀rọ̀ àkọ́kọ́ jẹ́ Yorùbá àdánidá, àlàyé [d] sì pa ìṣètò Gíríìkì tó túmọ̀ ní tààrà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ohùn jẹ́ ti ọ̀rọ̀ ìyànjú tó níyì, ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ ‘ẹ/yín’ nítorí pé àwọn olùgbọ́ jẹ́ ọ̀pọ̀ ènìyàn. Àmì kọ́lónù mú ìbáṣepọ̀ láàárín ìtara àti àṣẹ tó tẹ̀ lé e ṣe kedere.
