id: 2PE.1.14
reference: 2 Peter 1:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: yo
  text: Mo mọ̀ pé fífi àgọ́ mi sílẹ̀ ti sún mọ́lé[a][c], gẹ́gẹ́ bí Olúwa wa Jésù Mèsáyà[b] ti fi hàn kedere fún mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yíyọ àgọ́ mi kúrò”; Pétérù ń fi fífi ibùgbé onígbà díẹ̀ sílẹ̀ ṣàpẹẹrẹ ikú rẹ̀ tó ń bọ̀.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì ní “Jésù Kristi”; a túmọ̀ Χριστός sí “Mèsáyà” níhìn-ín nítorí a kà á sí orúkọ oyè.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “yóò ṣẹlẹ̀ láìpẹ́.”
    reason: previous_rendering
lexical_decisions:
- source_word: εἰδὼς
  choice: níwọ̀n bí mo ti mọ̀
  rationale: Ó so gbólóhùn yìí mọ́ èyí tó ṣáájú, ó sì gbé ìtumọ̀ ọ̀rọ̀ aláìdá dúró ní Yorùbá àdánidá láìfi ìdí pàtó tí Gíríìkì kò sọ kún un.
- source_word: ταχινή
  choice: ti sún mọ́lé
  rationale: Ó fi hàn pé ìṣẹ̀lẹ̀ náà ti sún mọ́ Peteru; ó pa àìdánilójú díẹ̀ tó wà láàárín ‘ó sún mọ́lé’ àti ‘yóò ṣẹlẹ̀ láìpẹ́’ mọ́.
- source_word: ἀπόθεσις
  choice: fífi ... sílẹ̀
  rationale: Ó túmọ̀ sí yíyọ tàbí fífi ohun kan sílẹ̀. Àṣàyàn yìí pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́ dípò kíkàn túmọ̀ rẹ̀ sí ikú.
- source_word: σκηνώματός
  choice: àgọ́ mi
  rationale: Àgọ́ ni ibùgbé fún ìgbà díẹ̀, ó sì pa àkàwé ara Peteru gẹ́gẹ́ bí ibùgbé onígbà díẹ̀ mọ́ ní èdè tó ṣeé lóye.
- source_word: καθὼς καὶ
  choice: gẹ́gẹ́ bí
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti fi ìfiwéra tàbí ìjẹ́rìí tó bá ọ̀rọ̀ mu hàn.
- source_word: κύριος
  choice: Olúwa
  rationale: Orúkọ oyè tó bójú mu fún κύριος nínú ọ̀rọ̀ nípa Jésù ni ‘Olúwa.’
- source_word: Ἰησοῦς Χριστὸς
  choice: Jésù Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè tó túmọ̀ sí ẹni àmì òróró; ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́.
- source_word: ἐδήλωσέν
  choice: fi hàn kedere
  rationale: Ó sọ ìṣe mímú ohun kan di mímọ̀ tàbí kedere ní Yorùbá tó rọrùn, láìsọ ọ́ di ọ̀rọ̀ ìfihàn àrà ọ̀tọ̀.
- source_word: μοι
  choice: fún mi
  rationale: Ó jẹ́ olùgbà ìṣe náà, bí ìlò dative Gíríìkì ṣe fi hàn.
theological_decisions:
- issue: Àkàwé ikú Peteru tó ń bọ̀
  choice: fífi àgọ́ mi sílẹ̀
  alternative: ikú mi ti sún mọ́lé
  rationale: Ọ̀rọ̀ Gíríìkì lo àwòrán àgọ́ gẹ́gẹ́ bí ara tàbí ìgbésí ayé onígbà díẹ̀. Dídá àwòrán náà dúró ń pa agbára àti ìdọ́gba ẹ̀kọ́ ọ̀rọ̀ náà mọ́.
- issue: Ìtumọ̀ Χριστός nínú Ἰησοῦς Χριστός
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: Níhìn-ín, Χριστός lè jẹ́ oyè tó ní ìtumọ̀ ‘Mèsáyà,’ kì í ṣe orúkọ ìdílé lásán; ìtumọ̀ oyè náà ni a gbé jáde.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà pa ìsopọ̀ rẹ̀ mọ́ ẹsẹ tó ṣáájú, ó sì dá àkàwé àgọ́ dúró láìrọ́pò rẹ̀ pẹ̀lú ‘ara’ tàbí ‘ikú.’
