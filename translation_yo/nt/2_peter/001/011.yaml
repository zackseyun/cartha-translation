id: 2PE.1.11
reference: 2 Peter 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: yo
  text: Nítorí, ní ọ̀nà yìí ni a ó fi pèsè ìwọlé sínú ìjọba ayérayé ti Olúwa àti Olùgbàlà wa, Jésù, ẹni tí í ṣe Mèsáyà náà, fún yín ní ọ̀pọ̀ yanturu[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àbáwọlé.” Ọ̀rọ̀ Gíríìkì εἴσοδος lè túmọ̀ sí ìwọlé tàbí àbáwọlé.
    reason: lexical_alternative
  - marker: b
    text: Ìtumọ̀ ìbílẹ̀ ni “Jésù Kristi.” A túmọ̀ oyè Gíríìkì Χριστοῦ sí “Mèsáyà” níbí láti pa ìtumọ̀ rẹ̀ mọ́.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “Nítorí, ní ọ̀nà yìí ni a ó fi pèsè fún yín ní ọ̀pọ̀ yanturu láti wọ inú ìjọba ayérayé ti Olúwa àti Olùgbàlà wa, Jésù, ẹni tí í ṣe Mèsáyà náà.”
    reason: previous_rendering
lexical_decisions:
- source_word: οὕτως
  choice: ní ọ̀nà yìí
  rationale: Ó tọ́ka padà sí ọ̀nà ìgbésí ayé tí àwọn ẹsẹ tó ṣáájú ṣàpèjúwe, ó sì pa agbára ọ̀rọ̀ atọ́ka Gíríìkì mọ́.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ohun tí a ṣẹ̀ṣẹ̀ sọ.
- source_word: πλουσίως
  choice: lọ́nà ọ̀pọ̀ yanturu
  rationale: Ó sọ ìpèsè tó pọ̀ lọ́pọlọpọ̀, kì í ṣe ọ̀pọ̀ ìwọlé; gbólóhùn yìí sì bójú mu ní Yorùbá òde òní.
- source_word: ἐπιχορηγηθήσεται
  choice: ni a ó fi pèsè
  rationale: Ìlò ‘a’ aláìní ẹni pàtó jẹ́ ọ̀nà àdánidá ní Yorùbá láti pa olùṣe mọ́ láìdárúkọ, gẹ́gẹ́ bí fọ́ọ̀mù àgbàwí ọjọ́ iwájú inú Gíríìkì.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Ó fi hàn pé àwọn olùgbọ́ ni yóò jèrè ìpèsè náà.
- source_word: ἡ εἴσοδος
  choice: ìwọlé
  rationale: Ó lè túmọ̀ sí ìṣe wíwọlé tàbí àyè ìwọlé, ó sì bá ‘sínú ìjọba’ mu lọ́nà àdánidá.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: sínú ìjọba ayérayé
  rationale: Ìtumọ̀ tààrà tí ó pa ìtọ́sọ́nà ‘sínú’ àti ìtumọ̀ àìlópin αἰώνιος mọ́.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: ti Olúwa àti Olùgbàlà wa
  rationale: Àpilẹ̀kọ kan náà so oyè méjèèjì mọ́ ẹni kan; Yorùbá yìí pa ìsopọ̀ náà mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà náà
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí Mèsáyà, kì í ṣe orúkọ lásán; ‘náà’ mú oyè náà hàn lọ́nà àdánidá ní Yorùbá.
theological_decisions:
- issue: Ẹni tí ‘Olúwa àti Olùgbàlà wa’ ń tọ́ka sí
  choice: Oyè méjèèjì ń tọ́ka sí ẹni kan náà, Jésù Mèsáyà.
  alternative: A lè ka àwọn oyè náà lọ́nà tí kò fi dandan so méjèèjì mọ́ ẹni kan.
  rationale: Àpilẹ̀kọ Gíríìkì kan ṣoṣo ń darí àwọn orúkọ oyè ẹlẹ́ni kan méjì tí καί so pọ̀, lẹ́yìn náà ni Ἰησοῦ Χριστοῦ tẹ̀ lé; èyí fi agbára tọ́ka sí ẹni kan ṣoṣo.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A lo ‘a ó pèsè’ láti pa olùṣe tí a kò dárúkọ nínú fọ́ọ̀mù àgbàwí Gíríìkì mọ́, láìfi ẹ̀kọ́ ìsìn kan kún un.
