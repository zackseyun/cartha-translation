- from: Nítorí bí àwọn nǹkan wọ̀nyí bá wà nínú yín, tí wọ́n sì ń pọ̀ sí i[a], wọn kì yóò jẹ́ kí ẹ jẹ́ aláìṣiṣẹ́ tàbí aláìléso ní ti ìmọ̀ Olúwa wa Jésù Mèsáyà[c].[b]
  to: Nítorí bí àwọn nǹkan wọ̀nyí bá wà nínú yín, tí wọ́n sì ń pọ̀ sí i[a], wọ́n kì í jẹ́ kí ẹ jẹ́ aláìṣiṣẹ́ tàbí aláìléso ní ti ìmọ̀[b] Olúwa wa Jésù Mèsáyà[c].
