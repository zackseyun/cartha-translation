id: 2PE.1.8
reference: 2 Peter 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: yo
  text: Nítorí bí àwọn nǹkan wọ̀nyí bá wà nínú yín, tí wọ́n sì ń pọ̀ sí i[a], wọ́n kì í jẹ́ kí ẹ jẹ́ aláìṣiṣẹ́ tàbí aláìléso ní ti ìmọ̀[b] Olúwa wa Jésù Mèsáyà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń pọ̀ lọ́pọ̀lọpọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìmọ̀ kíkún nípa Olúwa wa Jésù Mèsáyà.”
    reason: lexical_alternative
  - marker: c
    text: Ní Gíríìkì, “Jésù Kristi”; níhìn-ín a tú orúkọ-oyè náà sí “Jésù Mèsáyà” láti pa ìtumọ̀ rẹ̀ mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó ń tọ́ka padà sí àwọn ìwà rere tí a tò lẹ́sẹẹsẹ ní ẹsẹ 5–7, láìfi ìtumọ̀ àlàyé bí ‘àwọn ànímọ́ wọ̀nyí’ kún un.
- source_word: ὑμῖν ὑπάρχοντα
  choice: bá wà nínú yín
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí fi hàn pé àwọn nǹkan náà wà pẹ̀lú àwọn òǹkàwé tàbí jẹ́ tiwọn. ‘Wà nínú yín’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún wíwà àwọn ìwà wọ̀nyí nínú ìgbésí ayé wọn.
- source_word: πλεονάζοντα
  choice: ń pọ̀ sí i
  rationale: Ó pa ìtumọ̀ ìlọsíwájú tàbí ìbísí mọ́, ó sì bá àyíká ọ̀rọ̀ nípa dídàgbà nínú ìwà rere mu.
- source_word: ἀργούς
  choice: aláìṣiṣẹ́
  rationale: Níhìn-ín ọ̀rọ̀ náà túmọ̀ sí àìní iṣẹ́ tàbí ipa tó wúlò; ‘aláìṣiṣẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, ó sì dúró ní ìbáṣepọ̀ pẹ̀lú ‘aláìléso.’
- source_word: ἀκάρπους
  choice: aláìléso
  rationale: Ó pa àwòrán èdè nípa eso mọ́, èyí tí ó túmọ̀ sí àìní àbájáde rere.
- source_word: καθίστησιν
  choice: wọn kì yóò jẹ́ kí ẹ jẹ́
  rationale: 'Èyí sọ àbájáde gbolohun òdì náà ní Yorùbá àdánidá: àwọn nǹkan wọ̀nyí ń dá wọn dúró láti jẹ́ aláìṣiṣẹ́ tàbí aláìléso.'
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: ní ti ìmọ̀
  rationale: ‘Ní ti’ fi ìbáṣepọ̀ tàbí ààyè tí iṣẹ́ àti èso náà kan hàn, láìfi ìtumọ̀ ọ̀nà tàbí ibi tí Gíríìkì kò fi dandan múlẹ̀ kún un.
- source_word: ἐπίγνωσιν
  choice: ìmọ̀
  rationale: ‘Ìmọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere jù lọ; àṣàyàn ‘ìmọ̀ kíkún’ wà nínú àlàyé ìsàlẹ̀ nítorí pé ἐπίγνωσις lè ní ìtumọ̀ yẹn.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó bójú mu fún κύριος gẹ́gẹ́ bí orúkọ oyè nípa Jésù.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: A tú Χριστός sí ‘Mèsáyà’ láti pa ìtumọ̀ orúkọ oyè náà mọ́ dípò kí a kàn ṣe àdàkọ ohùn rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: ‘Mèsáyà’ mú ìtumọ̀ orúkọ oyè ẹni tí a fòróró yàn jáde ní gbangba, nígbà tí ‘Kristi’ jẹ́ àdàkọ ohùn ọ̀rọ̀ Gíríìkì. Àlàyé ìsàlẹ̀ pa àṣàyàn tí ó wọ́pọ̀ mọ́.
- issue: Ìwọ̀n ìtumọ̀ ἐπίγνωσις
  choice: ìmọ̀
  alternative: ìmọ̀ kíkún
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ìmọ̀ tàbí ìmọ̀ tó péye sí i. Ọ̀rọ̀ àkọ́kọ́ kò fi ìtumọ̀ tó lágbára jù lọ lé e lórí, ṣùgbọ́n àlàyé ìsàlẹ̀ pa a mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A pa ìfiwéra ‘aláìléso’ mọ́, a sì fi àwọn àṣàyàn pàtàkì sí àlàyé ìsàlẹ̀.
