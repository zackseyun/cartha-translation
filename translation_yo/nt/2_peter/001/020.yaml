  terminology: ‘Àsọtẹ́lẹ̀,’ ‘Ìwé Mímọ́,’ àti ‘ìtumọ̀’ yẹ fún ìforúkọsílẹ̀ àti fún ìtúmọ̀ ἐπίλυσις tó ṣọ́ra. A kò fi ìtúmọ̀ ìjọ kan tàbí ìlànà kan lórí ẹsẹ̀ náà.
  issues:
