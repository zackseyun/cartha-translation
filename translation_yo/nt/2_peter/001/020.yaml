  text: τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: yo
  text: 'Ẹ gbọdọ̀ kọ́kọ́ mọ èyí: kò sí àsọtẹ́lẹ̀ kankan nínú Ìwé Mímọ́ tí ó wá láti inú ìtumọ̀ ara ẹni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Ẹ mọ èyí ní àkọ́kọ́
  rationale: Ó pa ìtẹnumọ́ pé ohun yìí ṣe pàtàkì ní àkọ́kọ́ mọ́, ó sì bá ọ̀rọ̀ ìtọ́ni tí ó ń lọ lọ́wọ́ mu.
- source_word: πᾶσα προφητεία γραφῆς
  choice: gbogbo àsọtẹ́lẹ̀ inú Ìwé Mímọ́
  rationale: ‘Ìwé Mímọ́’ jẹ́ ọ̀nà Yorùbá àdánidá fún γραφή ní àyíká yìí; ‘gbogbo’ tún pa ìrísí πᾶσα mọ́ dípò yíyí i sí ‘kò sí ... kankan.’
- source_word: ἰδίας ἐπιλύσεως
  choice: ìtumọ̀ ẹni fúnra rẹ̀
  rationale: Ó pa àìdánilójú ἰδίας mọ́ nípa ẹni tí ó ní ìtumọ̀ náà, ó sì tú ἐπίλυσις sí ‘ìtumọ̀’ láìfi ẹ̀kọ́ ẹ̀sìn kan lé e lórí.
- source_word: οὐ γίνεται
  choice: kì í wá láti inú
  rationale: Ní ìsopọ̀ pẹ̀lú ἐπιλύσεως, èyí sọ orísun tàbí bí àsọtẹ́lẹ̀ ṣe ń ṣẹlẹ̀, ní Yorùbá tó ṣeé lóye, láìdín ọ̀rọ̀ náà kù sí ìṣe olùkà nìkan.
theological_decisions:
- issue: Bóyá ẹsẹ̀ náà ń sọ̀rọ̀ nípa orísun àsọtẹ́lẹ̀ tàbí bí a ṣe ń túmọ̀ rẹ̀
  choice: Lo ‘kì í wá láti inú ìtumọ̀ ẹni fúnra rẹ̀,’ èyí tí ó pa ìsopọ̀ orísun àti ìtumọ̀ mọ́.
  alternative: ‘Kò sí ẹni tó lè tú àsọtẹ́lẹ̀ Ìwé Mímọ́ ní ọ̀nà tirẹ̀.’
  rationale: Gíríìkì οὐ γίνεται lè tọ́ka sí bí àsọtẹ́lẹ̀ ṣe ń wáyé, nígbà tí ἐπίλυσις túmọ̀ sí ìtúmọ̀ tàbí ìṣàlàyé. Ìtumọ̀ yìí kò fi dandan mú un jẹ́ àṣẹ lórí bí olùkà ṣe gbọdọ̀ túmọ̀ Ìwé Mímọ́.
- issue: Ìrísí πᾶσα pẹ̀lú ìkọ̀ οὐ
  choice: Pa ‘gbogbo ... kì í’ mọ́.
  alternative: ‘Kò sí àsọtẹ́lẹ̀ ... kankan.’
  rationale: Àṣàyàn náà tẹ̀lé ìrísí orísun àti ìpele ìmúdójúìwọ̀n Gẹ̀ẹ́sì tí a fún, bó tilẹ̀ jẹ́ pé Yorùbá kejì lè rọrùn síi.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo àmì ohùn ní kíkún; ‘Ẹ mọ’ jẹ́ ìtọ́ni ọ̀pọ̀ ènìyàn tó bá àyíká lẹ́tà mu.
