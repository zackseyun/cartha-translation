  source_fidelity: 'Àpẹẹrẹ Gíríìkì náà ní ìkọ̀ pẹ̀lú πᾶσα: ìtumọ̀ rẹ̀ ní àyíká yìí ni pé kò sí àsọtẹ́lẹ̀ Ìwé Mímọ́ kankan tí ó wá láti inú ἰδίας ἐπιλύσεως. Ọ̀rọ̀ náà tún fi ἐπίλυσις sílẹ̀ ní ìtumọ̀ tó lè jẹ́ ‘ìtumọ̀/ìṣàlàyé,’ láìpinnu ìbéèrè ìtumọ̀ rẹ̀ pátápátá.'
