  - severity: low
    issue: ‘Ìtumọ̀ ẹni fúnra rẹ̀’ kò rọrùn tó.
    rationale: ‘Ìtumọ̀ ara ẹni’ jẹ́ ọ̀nà Yorùbá boṣewa, kedere, tí ó sì pa àìdánilójú ẹni tí ‘ìtumọ̀ tirẹ̀’ jẹ́ mọ́.
