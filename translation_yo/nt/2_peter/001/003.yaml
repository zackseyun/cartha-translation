id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: yo
  text: Bí agbára àtọ̀runwá rẹ̀ ti fi gbogbo ohun tí ó ní í ṣe pẹ̀lú ìyè àti ìfọkànsìn sí Ọlọ́run fún wa nípasẹ̀ ìmọ̀ ẹni tí ó pè wá nípasẹ̀ ògo àti ìtayọ tirẹ̀,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “ẹni tí ó pè wá sí ògo àti ìtayọ tirẹ̀.” A lè lóye gbólóhùn dative Gíríìkì náà ní ọ̀nà mìíràn.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: Bí ... ti
  rationale: Ó pa ipa àsopọ̀ Gíríìkì mọ́, ó sì jẹ́ kí gbólóhùn náà ṣí sí ohun tí ó tẹ̀ lé e láìfi dandan sọ ọ́ di ìdí pátápátá.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: agbára àtọ̀runwá rẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ agbára tí ó jẹ́ ti Ọlọ́run tàbí tí ó ní ìwà àtọ̀runwá.
- source_word: δεδωρημένης
  choice: ti fi ... fún wa
  rationale: Ó fi ẹ̀bùn oore-ọ̀fẹ́ tí a ti fúnni, tí ipa rẹ̀ sì ń bá a lọ, hàn ní èdè Yorùbá àdánidá.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: gbogbo ohun tí ó jẹ́ ti ìyè àti ìfọkànsìn Ọlọ́run
  rationale: Ó pa ìwọ̀n ‘gbogbo ohun’ àti ìtumọ̀ ohun tí ó jẹ mọ́ ìyè àti ìgbé-ayé tí ó dojú kọ Ọlọ́run mọ́, láìfi ọ̀rọ̀ ‘tí a nílò’ kún un.
- source_word: ζωὴν
  choice: ìyè
  rationale: Ó pa ìtumọ̀ náà gbòòrò, kó lè kan ìyè nísinsìnyí àti ìyè ọjọ́ iwájú.
- source_word: εὐσέβειαν
  choice: ìfọkànsìn Ọlọ́run
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ìbòwọ̀ àti ìgbé-ayé tí a yà sí mímọ́ fún Ọlọ́run; yíyan yìí ṣe kedere sí òǹkàwé Yorùbá òde òní.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: nípasẹ̀ mímọ
  rationale: Ó sọ ọ̀nà tí ẹ̀bùn náà fi dé ọ̀dọ̀ wa, ó sì ṣe àjọṣe ìmọ̀ náà ní ti ara ẹni láìsọ pé ó jẹ́ ‘ìmọ̀ pípé’.
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: ẹni tí ó pè wá
  rationale: Ó pa ẹni tí ó ṣe iṣẹ́ ìpè náà mọ́ láìfi orúkọ tàbí ìdánimọ̀ tí Gíríìkì kò sọ níhìn-ín kún un.
- source_word: ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: nípasẹ̀ ògo àti ìtayọ tirẹ̀
  rationale: ‘Tirẹ̀’ pa ìtẹnumọ́ ohun-ìní ἰδίᾳ mọ́; ‘ògo’ àti ‘ìtayọ’ sì bá δόξα àti ἀρετή mu ní ọ̀nà tó níyì.
theological_decisions:
- issue: Ipa dative nínú ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: nípasẹ̀ ògo àti ìtayọ tirẹ̀
  alternative: sí ògo àti ìtayọ tirẹ̀
  rationale: Pẹ̀lú ọ̀rọ̀ SBLGNT tí a fún, ó ṣeé ṣe jù láti ka dative náà gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò ìpè náà. Síbẹ̀, kíkà á gẹ́gẹ́ bí ibi-afẹ́de ṣì ṣeé ṣe, nítorí náà a pa á mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ó níyì, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘Bí ... ti’ nítorí ẹsẹ yìí jẹ́ apá ìbẹ̀rẹ̀ gbólóhùn tí ó ń bá a lọ. A gbe àmì àlàyé [a] sí lẹ́yìn gbólóhùn tí àlàyé náà kan.
