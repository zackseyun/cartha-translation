id: 2PE.1.1
reference: 2 Peter 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: yo
  text: 'Síméónì Pétérù, ẹrú àti àpọ́sítélì Jésù Mèsáyà, sí àwọn tí wọ́n ti gba ìgbàgbọ́ tí ó ní iye kan náà bí tiwa[a][d], nínú òdodo Ọlọ́run wa àti Olùgbàlà wa, Jésù Mèsáyà[b][c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbàgbọ́ tí ipò rẹ̀ dọ́gba pẹ̀lú tiwa.” Ọ̀rọ̀ Gíríìkì náà lè tẹnumọ́ ìdọ́gba iye, ọlá tàbí àǹfààní.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ òdodo” tàbí “nítorí òdodo.” Ọ̀rọ̀ àsopọ̀ Gíríìkì náà lè fi ààyè tí ohun kan wà hàn tàbí ọ̀nà tí a fi ṣe é.
    reason: lexical_alternative
  - marker: c
    text: Bí Gíríìkì ṣe rí, ó ṣeé ṣe jù lọ pé “Ọlọ́run wa àti Olùgbàlà wa, Jésù Mèsáyà” ń tọ́ka sí ẹni kan ṣoṣo, ó sì ń pe Jésù ní Ọlọ́run àti Olùgbàlà. Àṣàyàn mìíràn tí kò lágbára tó ni, “Ọlọ́run wa àti Olùgbàlà Jésù Mèsáyà,” tí yóò tọ́ka sí ẹni méjì.
    reason: alternative_reading
  - marker: d
    text: Tàbí, “tí ó ṣe iyebíye dọ́gba pẹ̀lú tiwa.”
    reason: previous_rendering
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: Síméónì Pétérù
  rationale: “Síméónì” ṣàfihàn fọ́ọ̀mù Συμεών inú SBLGNT dípò Σίμων; “Pétérù” ni àkọsílẹ̀ orúkọ Πέτρος tí ó ti fìdí múlẹ̀ ní Yorùbá.
- source_word: δοῦλος
  choice: ẹrú
  rationale: “Ẹrú” pa ìtumọ̀ jíjẹ́ ẹni tí ó jẹ́ ti olúwa rẹ̀ pátápátá mọ́; ó lágbára ju “ìránṣẹ́” lọ nínú ìdánimọ̀ ara àpọ́sítélì yìí.
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Ọ̀rọ̀ yìí ni ọ̀nà Yorùbá tí ó ti fìdí múlẹ̀ fún ẹni tí a rán pẹ̀lú àṣẹ pàtó.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: Χριστός jẹ́ oyè “Mèsáyà,” kì í ṣe orúkọ lásán; Yorùbá kò nílò àpilẹ̀kọ bí “the” ní Gẹ̀ẹ́sì.
- source_word: τοῖς ... λαχοῦσιν
  choice: sí àwọn tí wọ́n ti gba
  rationale: “Ti gba” fi hàn pé wọ́n rí ìgbàgbọ́ náà gbà, kì í ṣe pé wọ́n fi agbára ara wọn ṣe é ní àṣeyọrí; kò sì fi àwòrán pípa ìbò lé e lórí.
- source_word: ἰσότιμον ... πίστιν
  choice: ìgbàgbọ́ tí ó níye lọ́gbà bí tiwa
  rationale: Gbólóhùn yìí sọ ìdọ́gba iye tàbí ọlá ìgbàgbọ́ wọn àti ti àwọn àpọ́sítélì ní Yorùbá àdánidá, láìpa àwọn ìtumọ̀ míì rẹ́.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Nínú àyíká yìí, πίστις tọ́ka sí ìgbàgbọ́ tí àwọn onígbàgbọ́ àti àwọn àpọ́sítélì ní papọ̀.
- source_word: ἐν δικαιοσύνῃ
  choice: nínú òdodo
  rationale: “Nínú” tẹ̀lé ἐν pẹ̀kipẹ̀ki, ó sì jẹ́ kí ó ṣí sí ìtumọ̀ ààyè tàbí ọ̀nà/ohun èlò gẹ́gẹ́ bí ti Gíríìkì.
- source_word: δικαιοσύνῃ
  choice: òdodo
  rationale: “Òdodo” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún δικαιοσύνη nínú àyíká ẹ̀kọ́ nípa Ọlọ́run yìí.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: Ọlọ́run wa àti Olùgbàlà wa, Jesu Mèsáyà
  rationale: Àtúnsọ “wa” àti àmì koma mú kí ó ṣe kedere ní Yorùbá pé Jesu Mèsáyà ni ẹni kan náà tí a ń pè ní Ọlọ́run wa àti Olùgbàlà wa, gẹ́gẹ́ bí ìṣètò Gíríìkì ṣe fi hàn jù lọ.
theological_decisions:
- issue: Bóyá “Ọlọ́run wa àti Olùgbàlà” ń tọ́ka sí Jesu nìkan tàbí sí Ọlọ́run Baba àti Jesu gẹ́gẹ́ bí ẹni méjì
  choice: 'Ẹni kan: Jesu Mèsáyà ni a pè ní Ọlọ́run wa àti Olùgbàlà wa.'
  alternative: 'Ẹni méjì: “Ọlọ́run wa” àti “Olùgbàlà Jesu Mèsáyà.”'
  rationale: Nínú Gíríìkì, àpilẹ̀kọ kan ṣoṣo ni ó ṣàkóso àwọn orúkọ ẹni méjèèjì, θεοῦ àti σωτῆρος, tí καί sì so wọ́n pọ̀; èyí fi agbára tọ́ka sí ẹni kan ṣoṣo. Nítorí pàtàkì ọ̀rọ̀ náà nípa ẹni tí Jesu jẹ́, a pa àṣàyàn ẹni méjì mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá bá èdè àdánidá mu. “Ẹrú” pa agbára δοῦλος mọ́, “àpọ́sítélì” sì jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Yorùbá mọ̀. Gbólóhùn náà tẹ̀lé ìṣètò lẹ́tà Gíríìkì, ṣùgbọ́n ó ṣàn ní Yorùbá.
