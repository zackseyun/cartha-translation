id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: yo
  text: Nítorí bí wọ́n bá ti sá kúrò nínú àwọn ohun ìbàjẹ́ ti ayé nípasẹ̀ ìmọ̀ Olúwa àti Olùgbàlà, Jésù Mèsáyà,[a] tí wọ́n sì tún dì mọ́ àwọn nǹkan wọ̀nyí, tí àwọn nǹkan wọ̀nyí sì borí wọn, ipò wọn ní ìkẹyìn ti burú ju ti ìṣáájú lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí “ìmọ̀ kíkún nípa Olúwa àti Olùgbàlà, Jésù Mèsáyà.” Ó lè tọ́ka sí ìmọ̀ tó jinlẹ̀ tàbí tó dá lórí ìbáṣepọ̀ tààrà, ṣùgbọ́n a lo “ìmọ̀” nínú ẹsẹ náà kí a má bàa sọ ohun tí ọ̀rọ̀ náà kò fi dandan múlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: bí wọ́n bá ti sá kúrò
  rationale: Ó fi hàn pé sísá kúrò ti ṣẹlẹ̀ ṣáájú dídì mọ́ wọn lẹ́ẹ̀kan sí i, ó sì bá ìṣètò àídájú εἰ ... δέ mu.
- source_word: τὰ μιάσματα τοῦ κόσμου
  choice: àwọn ohun ìbàjẹ́ ti ayé
  rationale: ‘Àwọn ohun ìbàjẹ́’ mú èrò ohun tí ń sọ ènìyàn di aláìmọ́ tàbí tí ń bà á jẹ́ ní ti ìwà hàn, láì dín ọ̀rọ̀ náà sí àbàwọ́n ti ara nìkan.
- source_word: ἐν ἐπιγνώσει
  choice: nípasẹ̀ ìmọ̀
  rationale: Ní àyíká yìí ἐν lè tọ́ka sí ọ̀nà tí wọ́n fi sá àsálà; ‘ìmọ̀’ kò fi tipátipá pinnu bí ìmọ̀ náà ṣe jin tó tàbí ipò ìgbàlà wọn.
- source_word: κυρίου καὶ σωτῆρος
  choice: Olúwa àti Olùgbàlà
  rationale: Àwọn méjèèjì jẹ́ oyè tí ó tọ́ka sí Jésù kan náà, gẹ́gẹ́ bí ìhun Gíríìkì ṣe fi hàn.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: ‘Mèsáyà’ pa agbára Χριστός gẹ́gẹ́ bí oyè mọ́ ní Yorùbá.
- source_word: πάλιν ἐμπλακέντες
  choice: tún fi ara wọn kó sínú
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà Yorùbá àdánidá fún dídì mọ́ tàbí dídàpọ̀ mọ́ ohun tí ó ti dẹ ènìyàn lẹ́ẹ̀kan sí i.
- source_word: ἡττῶνται
  choice: tí wọ́n sì ṣẹ́gun wọn
  rationale: Ìtumọ̀ gírámà ni pé àwọn nǹkan náà borí àwọn ènìyàn náà; fífi ‘wọn’ méjì sí ipò yìí pa ìtumọ̀ yẹn mọ́, bí ó tilẹ̀ jẹ́ pé àyíká ni ó ń sọ ẹni tí ọ̀kọ̀ọ̀kan ń tọ́ka sí.
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: ipò wọn ní ìkẹyìn ti burú ju ti ìṣáájú lọ
  rationale: Ó sọ àfiwé ipò ìkẹyìn àti ipò àkọ́kọ́ ní Yorùbá tó ṣe kedere, láì fi ìtumọ̀ ọjọ́ ìkẹyìn kún un.
theological_decisions:
- issue: Irú ìmọ̀ tí ἐπίγνωσις ń tọ́ka sí àti ìbáṣepọ̀ rẹ̀ pẹ̀lú ìpẹ̀yìndà
  choice: ìmọ̀
  alternative: ìmọ̀ ìgbàlà; ìmọ̀ òde lásán
  rationale: Ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò yanju bóyá àwọn ènìyàn náà ti tún bí nípa ẹ̀mí tàbí pé wọ́n mọ Kristi ní òde nìkan; ìtumọ̀ náà pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní ìsopọ̀ pẹ̀lú àwọn oyè ‘Olúwa àti Olùgbàlà,’ agbára oyè Χριστός ṣì hàn gbangba; ‘Mèsáyà’ pa agbára yẹn mọ́.
- issue: Ẹni tí ‘Olúwa àti Olùgbàlà’ ń tọ́ka sí
  choice: Àwọn oyè méjèèjì ń tọ́ka sí Jésù Mèsáyà
  alternative: Kí ‘Olúwa’ tọ́ka sí ẹni kan, ‘Olùgbàlà’ sì tọ́ka sí Jésù
  rationale: Ìhun κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ ní àpilẹ̀kọ kan tí a lò fún àwọn orúkọ oyè méjèèjì, ó sì tọ́ka sí ẹni kan náà.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àdánidá, tí àwọn òǹkàwé òde òní lè lóye. A lo ‘Mèsáyà’ gẹ́gẹ́ bí oyè; a sì yẹra fún ọ̀rọ̀ tí yóò pinnu ariyanjiyan nípa bóyá àwọn tí ẹsẹ náà ń sọ̀rọ̀ nípa wọn ti gba ìgbàlà ní tòótọ́.
