id: 2PE.2.12
reference: 2 Peter 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: yo
  text: Ṣùgbọ́n àwọn wọ̀nyí, bí àwọn ẹranko aláìní làákàyè[a]—ẹ̀dá tí ìwà àdánidá ń darí[b], tí a bí fún mímú àti ìparun—wọ́n ń sọ ọ̀rọ̀ ẹ̀gàn nípa àwọn ohun tí wọn kò mọ̀[c]; nínú ìparun wọn, wọ́n náà yóò parun[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹranko tí kò lè ronú.”
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, gbólóhùn Gíríìkì náà ní èrò “tí a bí nípa ìwà àdánidá”; ó ń ṣàpèjúwe ẹ̀dá tí ìwà àdánidá tàbí ìfẹ́ inú rẹ̀ ń darí.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “wọ́n ń sọ̀rọ̀-òdì nípa àwọn ohun tí wọn kò mọ̀.”
    reason: lexical_alternative
  - marker: d
    text: Gíríìkì tún àwọn ọ̀rọ̀ tí ó ní gbòǹgbò kan náà fún “ìparun” àti “parun” lò, ó sì tipa bẹ́ẹ̀ dá ìṣeré-ọ̀rọ̀ sílẹ̀ láàárín ìparun àti píparun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: àwọn ẹranko aláìní làákàyè
  rationale: Ọ̀rọ̀ yìí fi hàn pé àwọn ẹranko náà kò ní agbára láti ronú bí ènìyàn; ó ju pé wọn kò lè sọ̀rọ̀ lọ.
- source_word: γεγεννημένα φυσικὰ
  choice: ẹ̀dá tí ìwà àdánidá ń darí, tí a bí
  rationale: Èyí mú àwòrán bíbí inú γεγεννημένα àti ìtumọ̀ φυσικά gẹ́gẹ́ bí ìwà àdánidá tàbí ìfẹ́ inú ẹranko tí ń darí wọn pọ̀.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: fún mímú àti ìparun
  rationale: “Fún” fi ète tàbí àbájáde tí εἰς lè tọ́ka sí hàn; “mímú” àti “ìparun” sì bá àwòrán ẹranko tí a ń mú, tí a sì ń pa run mu.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: nípa àwọn ohun tí wọn kò mọ̀
  rationale: Ọ̀rọ̀ arọ́pò orúkọ náà jẹ́ ọ̀pọ̀, ó sì tọ́ka sí àwọn ọ̀ràn tàbí ohun tí wọn kò ní ìmọ̀ nípa rẹ̀, láìfi ohun tí ó jẹ́ pàtó kún un.
- source_word: βλασφημοῦντες
  choice: wọ́n ń sọ̀rọ̀-òdì
  rationale: “Sọ̀rọ̀-òdì” pa agbára ọ̀rọ̀ Gíríìkì mọ́, èyí tí ó lè túmọ̀ sí sísọ̀rọ̀ ẹ̀gàn, ìbàjẹ́-orúkọ tàbí ọ̀rọ̀ àbùkù sí ohun mímọ́, láìpinnu ohun tí ọ̀rọ̀ náà dojú kọ.
- source_word: ἐν τῇ φθορᾷ αὐτῶν … καὶ φθαρήσονται
  choice: nínú ìparun wọn, àwọn náà yóò parun
  rationale: Àtúmọ̀ yìí pa àtúnlò gbòǹgbò ọ̀rọ̀ φθορ-/φθαρ- mọ́ nípa lílo “ìparun/parun,” ó sì fi καί hàn pẹ̀lú “àwọn náà.”
theological_decisions:
- issue: Ìtumọ̀ βλασφημοῦντες nínú àyíká ọ̀rọ̀
  choice: sọ̀rọ̀-òdì
  alternative: sọ̀rọ̀ ẹ̀gàn; ba orúkọ jẹ́
  rationale: Yíyan “sọ̀rọ̀-òdì” kò dín líle ìdálẹ́bi inú ọ̀rọ̀ náà kù, kò sì fi kún un pé àwọn ẹ̀dá ọ̀run tàbí ohun mímọ́ kan pàtó ni wọ́n ń sọ̀rọ̀ sí.
- issue: Ìtumọ̀ φθορά àti φθαρήσονται
  choice: ìparun / parun
  alternative: ìbàjẹ́ / bàjẹ́; òfo / ṣòfo
  rationale: Àwòrán àwọn ẹranko tí a bí fún mímú àti ìparun mú kí ìtumọ̀ ìdájọ́ àti píparun yẹ sí i níbí, nígbà tí àtúnlò ọ̀rọ̀ náà ṣì wà ní gbangba.
- issue: Olùní ìparun nínú αὐτῶν
  choice: wọn
  alternative: ìparun tiwọn fúnra wọn; ìparun àwọn ẹranko náà
  rationale: Arọ́pò-orúkọ “wọn” pa ìṣiyèméjì gírámà Gíríìkì mọ́, láìfi tipátipá pinnu bóyá ó tọ́ka sí ìparun àwọn olùkọ́ èké tàbí ti àwọn ẹranko inú àfiwé.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde-òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àwọn gbolohun bí “aláìní làákàyè,” “ìwà àdánidá ń darí,” àti “sọ̀rọ̀-òdì” jẹ́ èyí tí òǹkàwé lásán lè lóye, nígbà tí wọ́n tún pa ìfiwéra líle, ìṣiyèméjì, àti ìṣeré-ọ̀rọ̀ inú Gíríìkì mọ́.
