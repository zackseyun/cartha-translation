id: 2PE.2.21
reference: 2 Peter 2:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: yo
  text: Nítorí pé, ó ì bá ti sàn fún wọn kí wọn má mọ ọ̀nà òdodo[a] ju kí, lẹ́yìn tí wọ́n ti mọ̀ ọ́, wọ́n yí padà kúrò nínú àṣẹ mímọ́ tí a ti fi lé wọn lọ́wọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ipa òdodo.” Nínú àyíká yìí, “òdodo” túmọ̀ sí ìwà títọ́ níwájú Ọlọ́run; ọ̀rọ̀ Gíríìkì náà tún lè ní ìtumọ̀ “ìdájọ́ òdodo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àṣẹ mímọ́ tí a fi fún wọn” tàbí “tí a gbé lé wọn lọ́wọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον γὰρ ἦν αὐτοῖς
  choice: Nítorí ì bá ti sàn fún wọn
  rationale: Èyí fi agbára ìfiwéra κρεῖττον àti ìtumọ̀ ohun tí ì bá ti dára jù nínú ọ̀rọ̀ yìí hàn ní Yorùbá àdánidá; “Nítorí” sì so ẹsẹ̀ náà mọ́ ìdí tí a sọ ṣáájú.
- source_word: μὴ ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: kí wọn má ti mọ / lẹ́yìn tí wọ́n ti mọ̀ ọ́
  rationale: A tún ọ̀rọ̀-ìṣe kan náà ṣe bí Gíríìkì ṣe ṣe, láì fi “mọ̀ ní kíkún” kún un, èyí tí ó lè mú ìtumọ̀ náà lágbára ju bí orísun ṣe béèrè lọ.
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: ọ̀nà òdodo
  rationale: “Ọ̀nà” mú àpèjúwe ipa ìgbésí ayé tàbí ìrìn hàn, “òdodo” sì bá ìtumọ̀ ìwà títọ́ níwájú Ọlọ́run mu ju “ìdájọ́ òdodo” lọ ní àyíká yìí.
- source_word: ὑποστρέψαι ἐκ
  choice: kí wọ́n yí padà kúrò nínú
  rationale: Ọ̀rọ̀ yìí pa ìrònú yíyí padà sí ẹ̀yìn àti yíyà kúrò nínú ohun tí wọ́n ti mọ̀ mọ́, láì ṣàlàyé ẹ̀kọ́ ìgbàlà sí i.
- source_word: παραδοθείσης αὐτοῖς
  choice: tí a fi lé wọn lọ́wọ́
  rationale: Àpólà yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a fi ohun náà fún wọn láti gbà, ó sì pa ìtumọ̀ àtẹ̀jáde Gíríìkì mọ́ láì fi èrò ìríjú tí ó lágbára jù kún un.
- source_word: ἁγίας ἐντολῆς
  choice: òfin mímọ́
  rationale: A pa ẹyọ ọ̀rọ̀ náà mọ́; “òfin” jẹ́ ọ̀rọ̀ Yorùbá tí ó yé gbogbo ènìyàn fún àṣẹ pàtó, “mímọ́” sì pa ìwúwo ẹ̀sìn àti ìwà rere rẹ̀ mọ́.
theological_decisions:
- issue: Bóyá kí ìtumọ̀ náà pinnu àríyànjiyàn nípa ìṣubú kúrò nínú ìgbàlà tàbí jíjẹ́wọ́ ìgbàgbọ́ lásán
  choice: Sọ pé wọ́n mọ ọ̀nà òdodo, lẹ́yìn náà wọ́n yí padà kúrò nínú òfin mímọ́, láì fi ìpinnu ẹ̀kọ́ ìsìn míì kún un.
  alternative: Láti túmọ̀ ọ́ ní ọ̀nà tí yóò fi sọ pàtó pé wọ́n pàdánù ìgbàlà, tàbí pé wọn kò ní ìmọ̀ gidi rí.
  rationale: Gíríìkì sọ ìmọ̀ àti ìyípadà kúrò níbẹ̀ ní kedere, ṣùgbọ́n kò yanju gbogbo àríyànjiyàn nípa ìfaradà tàbí ìṣubú; ìtumọ̀ náà gbọdọ̀ pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìsìn yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo “ì bá ti sàn” fún ìfiwéra ohun tí kò ṣẹlẹ̀, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
