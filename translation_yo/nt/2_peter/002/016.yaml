source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: yo
  text: 'Ṣùgbọ́n ó gba ìbáwí nítorí ìwà àìlófin tirẹ̀: ẹranko ẹrù tí kò lè sọ̀rọ̀[a], tí ó sọ̀rọ̀ pẹ̀lú ohùn ènìyàn[b], dá ìwà wèrè wòlíì náà dúró.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààrà, “ẹranko ẹrù”; kẹ́tẹ́kẹ́tẹ́ Báláámù ni a ń tọ́ka sí (Nọ́ńbà 22:28–30).
    reason: cross_reference
  - marker: b
    text: Tàbí, “ní ohùn ènìyàn.” Gbólóhùn Gíríìkì náà ṣeé ṣe kí ó túmọ̀ sí ohùn ẹ̀dá ènìyàn, ní ìyàtọ̀ sí ẹranko tí kò lè sọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: ìbáwí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìbáwí tàbí ìtọ́nisọ́nà líle; “ìbáwí” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ọ̀rọ̀ nípa Báláámù mu.
- source_word: ἰδίας παρανομίας
  choice: ìrékọjá tirẹ̀
  rationale: “Ìrékọjá” fi hàn pé ó kọjá ààlà ohun tó tọ́, “tirẹ̀” sì pa ìtẹnumọ́ ἰδίας mọ́ pé ẹ̀bi náà jẹ́ tirẹ̀ fúnra rẹ̀.
- source_word: ὑποζύγιον
  choice: ẹranko ẹrù
  rationale: Ó pa ìtumọ̀ gbòòrò ti ẹranko tí a fi ń ru ẹrù mọ́, láì fi “kẹ́tẹ́kẹ́tẹ́” sínú ẹsẹ̀ níbi tí Gíríìkì kò ti sọ irú ẹranko náà ní pàtó.
- source_word: ἄφωνον
  choice: tí kò lè sọ̀rọ̀
  rationale: Ìtumọ̀ àdánidá yìí sọ àìní agbára ọ̀rọ̀ ẹranko náà kedere, ó sì mú ìyàlẹ́nu pé ó sọ̀rọ̀ yọ.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: fi ohùn ènìyàn
  rationale: Gbólóhùn náà ń ṣàlàyé bí ẹranko ṣe sọ̀rọ̀; “ènìyàn” tọ́ka sí ẹ̀dá ènìyàn lápapọ̀, kì í ṣe ọkùnrin ní pàtó.
- source_word: φθεγξάμενον
  choice: sọ̀rọ̀
  rationale: Ó tọ́ka sí fífi ọ̀rọ̀ tí ó ní ìtumọ̀ jáde, kì í ṣe sí ariwo lásán.
- source_word: ἐκώλυσεν
  choice: dá ... dúró
  rationale: Àṣàyàn yìí jẹ́ Yorùbá àdánidá fún dídènà tàbí fífi ohun kan mọ́lẹ̀, ó sì bá ipa ọ̀rọ̀ kωλύω ní àyíká yìí mu.
- source_word: παραφρονίαν
  choice: ìwà wèrè
  rationale: Ó pa agbára ọ̀rọ̀ Gíríìkì mọ́ gẹ́gẹ́ bí ìṣe aláìlọ́gbọ́n tí ó le, dípò ọ̀rọ̀ fífẹ́ bí “ìwà òmùgọ̀.”
- source_word: τοῦ προφήτου
  choice: wòlíì náà
  rationale: Ó pa àkọlé ẹni náà mọ́ gẹ́gẹ́ bí Gíríìkì ti ṣe, láì sọ pé ìwà rẹ̀ dára.
theological_decisions:
- issue: Bóyá kí a sọ ὑποζύγιον ní pàtó pé “kẹ́tẹ́kẹ́tẹ́” nítorí ìtàn Báláámù
  choice: ẹranko ẹrù
  alternative: kẹ́tẹ́kẹ́tẹ́
  rationale: Nọ́ńbà 22 fi hàn pé kẹ́tẹ́kẹ́tẹ́ Báláámù ni, ṣùgbọ́n ọ̀rọ̀ Gíríìkì nínú ẹsẹ̀ yìí jẹ́ ọ̀rọ̀ gbòòrò. A pa ọ̀rọ̀ gbòòrò náà mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ẹni tí a ń tọ́ka sí nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ ἀνθρώπου nínú ἐν ἀνθρώπου φωνῇ
  choice: ènìyàn
  alternative: ọkùnrin
  rationale: Ìyàtọ̀ tí ọ̀rọ̀ náà ń ṣe ni láàárín ohùn ẹranko àti ohùn ènìyàn, kì í ṣe láàárín ọkùnrin àti obìnrin.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún òǹkàwé òde òní. A lo “ẹranko ẹrù” láti pa ọ̀rọ̀ Gíríìkì gbòòrò mọ́, àti “ìwà wèrè” láti pa agbára παραφρονίαν mọ́.
