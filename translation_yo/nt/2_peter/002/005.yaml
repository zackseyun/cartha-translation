id: 2PE.2.5
reference: 2 Peter 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: yo
  text: bí kò sì dá ayé ìgbàanì sí, ṣùgbọ́n ó pa Nóà, ẹni kẹjọ[a], olùkéde[b] òdodo[c], mọ́, nígbà tí ó mú ìkún omi wá sórí ayé àwọn tí kò bẹ̀rù Ọlọ́run,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́, “Nóà, ọ̀kan nínú àwọn mẹ́jọ” tàbí “Nóà ẹni kẹjọ.” Gbólóhùn Gíríìkì náà kúrú, ó sì lè túmọ̀ sí pé a pa Nóà mọ́ pẹ̀lú àwọn méje mìíràn.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè jẹ́, “oníwàásù”; ọ̀rọ̀ náà lè tọ́ka sí ẹni tó ń kéde ọ̀rọ̀ ní gbangba.
    reason: lexical_alternative
  - marker: c
    text: Ó tún ṣeé ṣe láti túmọ̀ ọ̀rọ̀ náà sí “ìdájọ́ òdodo,” ṣùgbọ́n “òdodo” ni ìtumọ̀ àkọ́kọ́ níhìn-ín.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: ayé ìgbàanì
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ayé ti ìgbà àtijọ́, ní pàtàkì ayé ṣáájú ìkún-omi; ‘ayé ìgbàanì’ jẹ́ èdè Yorùbá àdánidá tó sì pa ìtumọ̀ àkókò mọ́.
- source_word: οὐκ ἐφείσατο
  choice: kò dá ... sí
  rationale: Nínú ọ̀rọ̀ ìdájọ́, gbólóhùn yìí túmọ̀ sí pé Ọlọ́run kò yọ ayé náà kúrò nínú ìjìyà; ‘dá ... sí’ jẹ́ ọ̀nà Yorùbá tó bá ‘spare’ mu.
- source_word: ὄγδοον Νῶε
  choice: Nóà, ẹni kẹjọ
  rationale: Èyí pa ọ̀rọ̀ ordinal Gíríìkì mọ́, bó tilẹ̀ jẹ́ pé gbólóhùn náà kúrú, ó sì lè túmọ̀ sí Nóà gẹ́gẹ́ bí ọ̀kan lára àwọn mẹ́jọ tí a dá sí.
- source_word: δικαιοσύνης κήρυκα
  choice: olùkéde òdodo
  rationale: ‘Olùkéde’ fi ipa κῆρυξ gẹ́gẹ́ bí ẹni tó ń kéde ọ̀rọ̀ ní gbangba hàn; ‘òdodo’ ni ìtumọ̀ àkọ́kọ́ fún δικαιοσύνη níhìn-ín.
- source_word: ἐφύλαξεν
  choice: ó pa ... mọ́
  rationale: ‘Pa ... mọ́’ sọ ìdáàbòbò àti ìgbàlà Nóà láàárín ìdájọ́ jáde ní Yorùbá àdánidá.
- source_word: κατακλυσμὸν
  choice: ìkún-omi
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí omi ńlá tó bo ilẹ̀; ‘ìkún-omi’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìṣẹ̀lẹ̀ náà.
- source_word: κόσμῳ ἀσεβῶν
  choice: ayé àwọn tí kò bẹ̀rù Ọlọ́run
  rationale: Èyí fi hàn pé ayé náà kún fún àwọn ènìyàn aláìní ìbọ̀wọ̀ fún Ọlọ́run, ó sì jẹ́ èdè tí òǹkàwé Yorùbá òde òní lè lóye nírọ̀rùn.
- source_word: ἐπάξας
  choice: nígbà tí ó mú ... wá sórí
  rationale: Èyí sọ ìbáṣepọ̀ àkókò participle náà pẹ̀lú pípa Nóà mọ́ jáde láìfi ìtumọ̀ ìdí tàbí ọ̀nà kún un.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ pa ìtumọ̀ ìwà rere àti ìlànà rere Ọlọ́run mọ́, láìfi ọ̀rọ̀ náà mọ́ ìdájọ́ nìkan; àṣàyàn kejì ṣeé ṣe nípa ìtumọ̀ ọ̀rọ̀ náà.
- issue: Ìtumọ̀ ὄγδοον Νῶε
  choice: Nóà, ẹni kẹjọ
  alternative: Nóà, ọ̀kan lára àwọn mẹ́jọ
  rationale: Àṣàyàn àkọ́kọ́ pa ìrísí ordinal àti ìkúrú ọ̀rọ̀ Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ìwé jẹ́ kí ìtumọ̀ míì tó ṣeé ṣe hàn láìyanju àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tó sì ṣeé lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ. A pa ìṣọ̀kan gbólóhùn pẹ̀lú àwọn àpẹẹrẹ ìdájọ́ tó bẹ̀rẹ̀ ní ẹsẹ tó ṣáájú mọ́ nípa lílo “bí kò sì,” a sì fi àmì kọ́mà sí òpin nítorí pé gbólóhùn náà ń bá a lọ.
