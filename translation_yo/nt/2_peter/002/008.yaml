  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: yo
  text: 'Nítorí pé nípasẹ̀ ohun tí ó ń rí àti ohun tí ó ń gbọ́, ọkùnrin olódodo náà, ẹni tí ó ń gbé láàárín wọn,[c] ń fi àwọn iṣẹ́ àìlófin wọn dá ọkàn òdodo rẹ̀ lóró lójoojúmọ́[a][b]—


    [a] Tàbí, “láti ọjọ́ dé ọjọ́.”


    [b] Tàbí, “ó ń dá ara rẹ̀ lóró nínú ọkàn òdodo rẹ̀ nítorí àwọn iṣẹ́ àìlófin tí ó ń rí tí ó sì ń gbọ́.” Bí àwọn ọ̀rọ̀ náà ṣe tò ní èdè Gíríìkì fi “nípasẹ̀ ohun tí ó ń rí àti ohun tí ó ń gbọ́” síwájú, ó sì fi “àwọn iṣẹ́ àìlófin” sí ẹ̀yìn; nítorí náà, ìṣètò àwọn ọ̀rọ̀ wọ̀nyí lè yàtọ̀ ní ọ̀nà púpọ̀ ju ọ̀kan lọ.


    [c] Tàbí, “nítorí bí ọkùnrin olódodo náà ti ń gbé láàárín wọn, ó ń fi … dá … lóró lójoojúmọ́.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láti ọjọ́ dé ọjọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń dá ara rẹ̀ lóró nínú ọkàn òdodo rẹ̀ nítorí àwọn iṣẹ́ àìlófin tí ó ń rí tí ó sì ń gbọ́.” Bí àwọn ọ̀rọ̀ náà ṣe tò ní èdè Gíríìkì fi “nípasẹ̀ ohun tí ó ń rí àti ohun tí ó ń gbọ́” síwájú, ó sì fi “àwọn iṣẹ́ àìlófin” sí ẹ̀yìn; nítorí náà, ìṣètò àwọn ọ̀rọ̀ wọ̀nyí lè yàtọ̀ ní ọ̀nà púpọ̀ ju ọ̀kan lọ.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nítorí bí ọkùnrin olódodo náà ti ń gbé láàárín wọn, ó ń fi … dá … lóró lójoojúmọ́.”
    reason: previous_rendering
lexical_decisions:
- source_word: βλέμματι
  choice: nípa ohun tí ó ń rí
  rationale: Dative náà, tí a so pọ̀ mọ́ ἀκοῇ, ń tọ́ka sí ohun tí ojú Lọ́ọ̀tì ń rí gẹ́gẹ́ bí ohun tó ń fa ìrora inú rẹ̀; gbólóhùn yìí jẹ́ ti Yorùbá àdánidá ju ‘nípa ìríran’ lọ.
- source_word: ἀκοῇ
  choice: àti ohun tí ó ń gbọ́
  rationale: Ó bá βλέμματι lọ, ó sì ń tọ́ka sí ohun tí etí rẹ̀ ń gbọ́; àtúmọ̀ yìí pa ipa dative náà mọ́ ní èdè Yorùbá tó ṣe kedere.
- source_word: ὁ δίκαιος
  choice: ọkùnrin olódodo náà
  rationale: Adjective tí ó dúró bí noun ń tọ́ka padà sí Lọ́ọ̀tì; ‘náà’ mú ìtọ́kasí padà yẹn hàn, ‘ọkùnrin’ sì pa akọ ẹyọ rẹ̀ mọ́.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: ẹni tí ó ń gbé láàárín wọn
  rationale: Participle náà sọ pé ó ń gbé ní àárín wọn fún àkókò kan; relative clause yìí jẹ́ mímọ́gbọ́n-dání ní Yorùbá, ó sì pa iṣẹ́ àfikún participle náà mọ́.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: lójoojúmọ́
  rationale: Àṣà ọ̀rọ̀ náà túmọ̀ sí ìṣe tó ń ṣẹlẹ̀ ní gbogbo ọjọ́ láìdáwọ́; ‘lójoojúmọ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún un, a sì fi ‘láti ọjọ́ dé ọjọ́’ sí àlàyé ìsàlẹ̀.
- source_word: ψυχὴν δικαίαν
  choice: ọkàn òdodo rẹ̀
  rationale: ψυχή níbí ń tọ́ka sí inú ẹni tàbí ara ẹni inú, kì í ṣe dandan pé ó ń kọ́ ẹ̀kọ́ pàtó nípa bí ara àti ọkàn ṣe yà; ‘ọkàn’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó tún pa ìtumọ̀ inú ẹni mọ́.
- source_word: ἀνόμοις ἔργοις
  choice: àwọn iṣẹ́ àìlófin wọn
  rationale: Dative plural náà lè sọ ohun tó fa ìrora tàbí ọ̀nà tí ìrora fi dé; ‘iṣẹ́ àìlófin’ pa agbára ìtumọ̀ òfin àti ìwà búburú ἄνομος mọ́, ‘wọn’ sì wá láti inú àyíká ọ̀rọ̀.
- source_word: ἐβασάνιζεν
  choice: ń fi … dá … lóró
  rationale: Imperfect active fi ìṣe tó ń bá a lọ hàn. ‘Dá … lóró’ lágbára ju ‘bànújẹ́’ lọ, ó sì pa active voice mọ́ dípò yíyí i sí passive.
theological_decisions:
- issue: Ìtumọ̀ ψυχή nípa ohun tí ènìyàn jẹ́
  choice: A túmọ̀ rẹ̀ sí ‘ọkàn’ gẹ́gẹ́ bí inú tàbí ara ẹni inú Lọ́ọ̀tì, láìfi ẹ̀kọ́ ìpín ara àti ọkàn kún un.
  alternative: ‘ara rẹ̀’ tàbí ‘ìwà inú rẹ̀’
  rationale: Ẹsẹ̀ náà ń sọ nípa ìrora ìwà rere tó wà nínú Lọ́ọ̀tì, kì í ṣe àlàyé ẹ̀kọ́ nípa àwọn apá tí ènìyàn ní.
- issue: Ìbáṣepọ̀ ‘nípa ohun tí ó ń rí àti ohun tí ó ń gbọ́’ àti ‘àwọn iṣẹ́ àìlófin’ pẹ̀lú ọ̀rọ̀-ìṣe
  choice: A pa àwọn méjèèjì mọ́ gẹ́gẹ́ bí ohun tó ní í ṣe pẹ̀lú bí Lọ́ọ̀tì ṣe ń dá ọkàn rẹ̀ lóró.
  alternative: 'Kí a so ohun tí ó rí àti gbọ́ mọ́ àwọn iṣẹ́ àìlófin nìkan: ‘àwọn iṣẹ́ àìlófin tí ó rí tí ó sì gbọ́.’'
  rationale: Ìtò ọ̀rọ̀ Gíríìkì jẹ́ kí ìbáṣepọ̀ gangan ní ìrọ̀rùn díẹ̀; àkọ́kọ́ pa ìtò àti ìforígbárí inú gírámà náà mọ́, àlàyé [b] sì sọ ọ̀nà kejì.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní, pẹ̀lú àmì ohùn níbi tí ó yẹ. A lo ‘ọkùnrin olódodo náà’ láti tọ́ka padà sí Lọ́ọ̀tì, ‘ọkàn’ láìgbé ẹ̀kọ́ ẹ̀sìn àfikún wọlé, àti ‘dá … lóró’ láti pa agbára àti active voice βασανίζω mọ́. Àmì ìdáwọ́ gígùn ní òpin ń tẹ̀ lé bí ẹsẹ̀ Gíríìkì ṣe ń ṣàn sí ọ̀rọ̀ tó yí i ká.
