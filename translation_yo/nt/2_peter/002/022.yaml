  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: yo
  text: Ohun tí òwe tòótọ́ náà sọ ti ṣẹlẹ̀ sí wọn:[a] “Ajá padà sí èébì ara rẹ̀,”[b] àti pé, “Ẹlẹ́dẹ̀ abo tí a wẹ̀ padà sí yíyẹ nínú ẹrẹ̀.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ní ọ̀nà tó tẹ̀ lé Gíríìkì pẹ́kípẹ́kí: “Ọ̀rọ̀ òwe tòótọ́ náà ti ṣẹlẹ̀ sí wọn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ní ti gidi, Gíríìkì ní: “Ajá tí ó ti padà sí èébì ara rẹ̀ ... àti ẹlẹ́dẹ̀ abo tí a ti wẹ̀ sí yíyẹ nínú ẹrẹ̀.” Apá àkọ́kọ́ yìí fara jọ Òwe 26:11.'
    reason: cross_reference
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: ni ó ṣẹlẹ̀ sí wọn
  rationale: Ọ̀rọ̀-ìṣe náà wà ní àkókò perfect, ó sì ń tọ́ka sí ohun tí ó ti ṣẹlẹ̀ tí ipò rẹ̀ ṣì dúró; “ni ó ṣẹlẹ̀ sí wọn” jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ yìí mọ́.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: Ohun tí òwe tòótọ́ náà sọ
  rationale: Gbólóhùn Gíríìkì náà kúrú, ó sì fi apá kan sílẹ̀ láì sọ ní kedere. Ìtumọ̀ yìí mú un ṣe kedere pé ohun tí òwe náà sọ ló ṣẹlẹ̀ sí wọn, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: Ajá padà sí èébì ara rẹ̀
  rationale: “Ajá” ní agbára gbogbogbò nínú òwe; “ara rẹ̀” sì pa ìtumọ̀ ἴδιον mọ́. Fífi participle náà hàn gẹ́gẹ́ bí ọ̀rọ̀-ìṣe pípé jẹ́ Yorùbá àdánidá, ó sì bá ìtumọ̀ ìpadà mu.
- source_word: Ὗς λουσαμένη
  choice: Ẹlẹ́dẹ̀ abo tí a ti wẹ̀
  rationale: “Ẹlẹ́dẹ̀ abo” pa akọ-ǹ-ǹkan abo tó wà nínú Ὗς mọ́; “tí a ti wẹ̀” fi ipò rẹ̀ gẹ́gẹ́ bí èyí tí ó ti mọ́ hàn láì sọ ẹni tó wẹ̀ ẹ́.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: padà lọ máa yí ara rẹ̀ nínú ẹrẹ̀
  rationale: κυλισμός ni yíyí tàbí lílọ́ra sínú ohun kan, βόρβορος sì ni ẹrẹ̀ tàbí ẹrẹ̀ ẹlẹ́gbin. Gbólóhùn Yorùbá yìí pa àwòrán lílọ́ra sínú ẹrẹ̀ mọ́ ní ọ̀nà tó ṣe kedere.
theological_decisions:
- issue: Agbára òwe kúkúrú náà àti bí ó ṣe kan àwọn ẹni tí a ń sọ̀rọ̀ nípa wọn
  choice: A sọ pé ohun tí òwe tòótọ́ náà sọ ti ṣẹlẹ̀ sí wọn.
  alternative: A lè sọ ní ọ̀nà tó tẹ̀ lé ìṣètò Gíríìkì pé, “Ọ̀rọ̀ òwe tòótọ́ náà ti ṣẹlẹ̀ sí wọn.”
  rationale: Gíríìkì náà ní àfojúdi gírámà díẹ̀. Ìtumọ̀ tí a yàn fi hàn pé àkóónú òwe náà ló bá ipò wọn mu, ṣùgbọ́n kò tú àwòrán ìpadà sẹ́yìn náà sí ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
- issue: Bí a ṣe máa mú ọ̀rọ̀-ìṣe tí a kò tún sọ nínú apá kejì òwe náà hàn
  choice: A tún “padà lọ” sọ fún ẹlẹ́dẹ̀ abo náà.
  alternative: A lè pa àfojúdi náà mọ́ pé, “àti ẹlẹ́dẹ̀ abo tí a ti wẹ̀, sínú yíyí ara rẹ̀ nínú ẹrẹ̀.”
  rationale: Gíríìkì fi ọ̀rọ̀-ìṣe apá kejì sílẹ̀ fún olùkà láti lóye látinú apá àkọ́kọ́. Títún “padà lọ” sọ jẹ́ Yorùbá tó ṣe kedere, tí kò sì yí agbára òwe náà padà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Èébì” àti “ẹrẹ̀” jẹ́ ọ̀rọ̀ ojoojúmọ́ tó mú àwòrán líle òwe náà hàn kedere; a kò lo ọ̀rọ̀ àtijọ́ tàbí èdè ẹ̀kọ́ ìsìn tó lè fi ìtumọ̀ mìíràn kún ẹsẹ̀ náà.
