  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: yo
  text: ó sì gba Lọ́ọ̀tì olódodo là, ẹni tí ìwà[b] ìbàjẹ́ àìnítìjú[c] àwọn arúfin ń dá lóró[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ń pọ́n lójú” tàbí “ń kó ìbànújẹ́ bá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìṣe” tàbí “ìgbé ayé.”
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ náà tún lè túmọ̀ sí “ìwà àìnítìjú” tàbí “ìwà ìbàjẹ́”; ó tẹnu mọ́ ìwà búburú tó kọjá ààlà tí kò sì ní ìtìjú.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ó sì
  rationale: “Sì” so gbólóhùn yìí pọ̀ mọ́ ohun tó ṣáájú; fífi “ó” kún un jẹ́ kí olùṣe tí àyíká ọ̀rọ̀ ń tọ́ka sí hàn ní Yorùbá.
- source_word: δίκαιον
  choice: olódodo
  rationale: Ó pa ìdájọ́ rere tí ọ̀rọ̀ Gíríìkì ṣe nípa Lọ́ọ̀tì mọ́ láìrọ̀ ọ́.
- source_word: Λὼτ
  choice: Lọ́ọ̀tì
  rationale: Àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú bí a ṣe máa ń kọ ó ní Yorùbá.
- source_word: καταπονούμενον
  choice: ń dá lóró
  rationale: Ó fi ìjìyà tàbí ìpọ́njú tó ń bá a lọ hàn, ó sì pa agbára ìtumọ̀ ọ̀rọ̀ náà mọ́.
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: ìwà ... àwọn arúfin
  rationale: “Ìwà” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìṣe tàbí ìgbé ayé tí ó máa ń hàn léraléra; ìṣètò gbólóhùn náà tún fi ìwà yìí hàn gẹ́gẹ́ bí ohun tó ń dá Lọ́ọ̀tì lóró.
- source_word: τῶν ἀθέσμων
  choice: àwọn arúfin
  rationale: Ó pa èrò àwọn ẹni tí kò bọ̀wọ̀ fún òfin tàbí ohun tí ó tọ́ mọ́.
- source_word: ἐν ἀσελγείᾳ
  choice: ìbàjẹ́ àìnítìjú
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi ìwà búburú tí kò ní ìkóra-ẹni-níjàánu, tí kò sì mọ ojú hàn, láìfi ìtumọ̀ náà mọ́ ìbálòpọ̀ nìkan.
- source_word: ἐρρύσατο
  choice: gba ... là
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbígba ẹnì kan kúrò nínú ewu tàbí ìparun.
theological_decisions:
- issue: Bí a ṣe ṣàpèjúwe ipò ìwà Lọ́ọ̀tì ní ìbámu pẹ̀lú ìtàn Jẹ́nẹ́sísì
  choice: Lọ́ọ̀tì olódodo
  alternative: Lọ́ọ̀tì, ọkùnrin olódodo kan; tàbí yí àpèjúwe náà rọ̀ nítorí àwọn ìṣe Lọ́ọ̀tì nínú Jẹ́nẹ́sísì
  rationale: Ọ̀rọ̀ Gíríìkì pe Lọ́ọ̀tì ní olódodo ní tààràtà. Ìtumọ̀ náà gbọ́dọ̀ pa ìdájọ́ ẹsẹ yìí mọ́ láìṣe àlàyé tàbí ìbámu rẹ̀ pẹ̀lú ìtàn mìíràn.
translation_notes:
  register: Yorùbá ìgbàlódé tó ṣe déédéé, tó ní iyì, tí ó sì ṣeé yé fún gbogbo ènìyàn. Àmì ohùn wà níbi tí ó bá yẹ. A pa àmì ìdádúró gígùn mọ́ nítorí ẹsẹ náà ń bá gbólóhùn tó yí i ká lọ.
