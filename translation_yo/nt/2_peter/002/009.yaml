id: 2PE.2.9
reference: 2 Peter 2:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: yo
  text: Olúwa mọ bí ó ṣe lè gba àwọn olùfọkànsìn sí Ọlọ́run là kúrò nínú ìdánwò[a], àti bí ó ṣe lè pa àwọn aláìṣòdodo mọ́ lábẹ́ ìjìyà títí di ọjọ́ ìdájọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kúrò nínú ìtanijẹ sí ẹ̀ṣẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìdánwò tàbí ìtanijẹ sí ẹ̀ṣẹ̀; níbí, àyíká tẹ́ sí gbígbà ẹni là kúrò nínú ìpọ́njú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “láti pa àwọn aláìṣòdodo mọ́ fún ọjọ́ ìdájọ́, nígbà tí a ó jẹ wọ́n níyà.” A lè lóye ọ̀rọ̀ alábápín Gíríìkì náà bí ìjìyà tó ń bá a lọ, tàbí bí ìjìyà tó ní í ṣe pẹ̀lú ọjọ́ ìdájọ́ tó ń bọ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: mọ bí a ti ń
  rationale: Pẹ̀lú àwọn ọ̀rọ̀-ìṣe aláìlópin tí ó tẹ̀ lé e, ọ̀rọ̀ náà túmọ̀ sí ìmọ̀ ọ̀nà tàbí agbára láti ṣe ohun kan; ‘mọ bí a ti ń’ jẹ́ àdánidá ní Yorùbá.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó wọ́pọ̀, tó ní iyì, fún κύριος ní àyíká yìí.
- source_word: εὐσεβεῖς
  choice: àwọn olùfọkànsìn sí Ọlọ́run
  rationale: Àpèjúwe náà dúró gẹ́gẹ́ bí orúkọ fún àwọn ènìyàn tí ìgbésí ayé wọn fi ìfọkànsìn àti ọ̀wọ̀ sí Ọlọ́run hàn; yíyan yìí yé àwọn òǹkàwé òde òní ju gbólóhùn àjèjì lọ.
- source_word: ἐκ πειρασμοῦ
  choice: kúrò nínú ìdánwò
  rationale: πειρασμός lè jẹ́ ìdánwò, àdánwò tàbí ìtanijẹ sí ẹ̀ṣẹ̀. Àyíká Nóà àti Lọ́ọ̀tì tẹ́ sí ìpọ́njú/àdánwò, ṣùgbọ́n ‘ìdánwò’ ṣì pa ìwọ̀n ìtumọ̀ náà mọ́.
- source_word: ῥύεσθαι
  choice: gba ... là
  rationale: Ọ̀rọ̀ náà tọ́ka sí gbígbà ẹni kúrò nínú ewu; ‘gba ... là’ jẹ́ ọ̀nà Yorùbá àdánidá fún ìgbàlà bẹ́ẹ̀.
- source_word: ἀδίκους
  choice: àwọn aláìṣòdodo
  rationale: Ó pa agbára ìwà àti ti ìdájọ́ inú ἄδικος mọ́, láì dín un kù sí ìwà búburú kan ṣoṣo.
- source_word: κολαζομένους
  choice: lábẹ́ ìjìyà
  rationale: Ọ̀rọ̀ alábápín ìsinsìnyí lè ṣàpèjúwe ipò ìjìyà tó ń bá a lọ; yíyan yìí pa ìtumọ̀ yẹn mọ́ láì fi ètò ẹ̀kọ́ kan lé e lórí.
- source_word: εἰς ἡμέραν κρίσεως
  choice: títí di ọjọ́ ìdájọ́
  rationale: Pẹ̀lú τηρεῖν, gbólóhùn náà ń tọ́ka sí pípa wọn mọ́ dé ọjọ́ ìdájọ́ tó ń bọ̀; àlàyé ìsàlẹ̀ fi ìtumọ̀ míì tó ṣeé ṣe hàn.
- source_word: τηρεῖν
  choice: pa ... mọ́
  rationale: ‘Pa ... mọ́’ lè túmọ̀ sí dídáàbò bo, dídìmú tàbí fífi pamọ́ de àkókò kan; níbí, àyíká ìjìyà àti ìdájọ́ ló ń ṣàlàyé agbára rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πειρασμός nínú àyíká
  choice: ìdánwò gẹ́gẹ́ bí ìpọ́njú tàbí àdánwò
  alternative: ìtanijẹ sí ẹ̀ṣẹ̀
  rationale: Àyíká ṣáájú ẹsẹ yìí ń sọ nípa gbígba Nóà àti Lọ́ọ̀tì là kúrò nínú ìdájọ́ àti ipò líle. Síbẹ̀, àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ kejì hàn gbangba.
- issue: Agbára κολαζομένους
  choice: àwọn aláìṣòdodo wà lábẹ́ ìjìyà bí a ti ń pa wọn mọ́ dé ọjọ́ ìdájọ́
  alternative: a pa àwọn aláìṣòdodo mọ́ fún ọjọ́ ìdájọ́, nígbà tí a ó fi jẹ wọ́n níyà
  rationale: Ọ̀rọ̀ alábápín ìsinsìnyí lè tọ́ka sí ìjìyà tó ń lọ lọ́wọ́, ṣùgbọ́n ìbáṣepọ̀ gírámà rẹ̀ pẹ̀lú ọjọ́ ìdájọ́ ní ìtumọ̀ mìíràn tó ṣeé ṣe. A pa ìfọ̀kànbalẹ̀ yìí mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ tó péye, tó ní iyì, tí ó sì yé òǹkàwé òde òní ni a lò. A lo ‘olùfọkànsìn sí Ọlọ́run’ láti fi εὐσεβής hàn ní ọ̀nà tó ṣe kedere, a sì pa àìdánilójú gírámà àti ti ẹ̀kọ́ nípa κολαζομένους mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
