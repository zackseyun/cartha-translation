id: 2PE.2.19
reference: 2 Peter 2:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: yo
  text: Wọ́n ń ṣèlérí òmìnira fún wọn, nígbà tí àwọn fúnra wọn jẹ́ ẹrú ìdíbàjẹ́; nítorí ohun tí ó bá ṣẹ́gun ènìyàn, ohun náà ni ènìyàn náà sì ti di ẹrú fún.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: òmìnira
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà àdánidá tí Yorùbá òde òní fi ń sọ freedom/liberty, ó sì mú ìyàtọ̀ sí ipò ẹrú hàn kedere.
- source_word: ἐπαγγελλόμενοι
  choice: ń ṣèlérí
  rationale: Ó pa agbára participle Gíríìkì mọ́ gẹ́gẹ́ bí ìṣe tí ń lọ lọ́wọ́, ó sì so mọ́ ohun tí wọ́n ṣèlérí, ìyẹn òmìnira.
- source_word: δοῦλοι
  choice: ẹrú
  rationale: Nínú àyíká yìí, ipò ẹni tí ohun kan ń ṣàkóso ni a tẹnumọ́; ‘ẹrú’ pa ìtakora láàárín òmìnira tí wọ́n ṣèlérí àti ìdè tí wọ́n wà nínú rẹ̀ mọ́.
- source_word: ὑπάρχοντες
  choice: nígbà tí àwọn fúnra wọn jẹ́
  rationale: Ó fi ipò wọn gan-an hàn ní àkókò kan náà tí wọ́n ń ṣèlérí òmìnira, ó sì tẹnumọ́ ‘àwọn fúnra wọn.’
- source_word: φθορᾶς
  choice: ìdíbàjẹ́
  rationale: ‘Ìdíbàjẹ́’ lè ru ìtumọ̀ ìwà búburú àti ipò tí ń ba ẹni jẹ́, láì dín ọ̀rọ̀ náà kù sí ìparun ara nìkan.
- source_word: ᾧ γάρ τις ἥττηται
  choice: nítorí ohun tí ó bá ṣẹ́gun ènìyàn
  rationale: Ó jẹ́ ọ̀rọ̀ òwe àgbáyé nípa ohunkóhun tí ó bá borí tàbí ṣàkóso ènìyàn; ‘ó bá’ fi ìtumọ̀ gbogbogbò yẹn hàn lọ́nà Yorùbá àdánidá.
- source_word: τούτῳ καὶ δεδούλωται
  choice: ohun náà ni ó sì sọ ọ́ di ẹrú
  rationale: Ó sọ ìbáṣepọ̀ pẹ̀lú ohun tó ṣẹ́gun ẹni náà di mímọ́, ó sì pa ìsopọ̀ ọ̀rọ̀ mọ́ láàárín δοῦλοι àti δεδούλωται. Fọ́ọ̀mù yìí tú perfect passive sí ipò ẹrú tí ìṣẹ́gun náà ti mú wá.
- source_word: τις
  choice: ènìyàn ... ọ́
  rationale: ‘Ènìyàn’ jẹ́ ọ̀nà Yorùbá tí kò fi akọ tàbí abo kan pàtó múlẹ̀, ó sì bá ìtumọ̀ generic singular mu.
theological_decisions:
- issue: Bí a ṣe máa tú δοῦλοι/δεδούλωται nínú ìtakora láàárín òmìnira èké àti ìdè gidi
  choice: Lo ‘ẹrú’ àti ‘sọ ... di ẹrú.’
  alternative: Lo ‘ìránṣẹ́’ tàbí ‘wà ní ìdè.’
  rationale: Kókó ọ̀rọ̀ náà ni pé àwọn olùkọ́ náà ń ṣèlérí òmìnira bí ó tilẹ̀ jẹ́ pé ìdíbàjẹ́ ń ṣàkóso wọn. ‘Ẹrú’ pa agbára ìtakora àti ìṣàkóso tó wà nínú Gíríìkì mọ́ ju ‘ìránṣẹ́’ lọ.
- issue: Olùṣe nínú gbolohun ‘sọ ọ́ di ẹrú’
  choice: Jẹ́ kí ‘ohun náà’ jẹ́ olùṣe ní Yorùbá.
  alternative: ‘Ó ti di ẹrú fún ohun náà’ tàbí ‘ohun náà ni a fi sọ ọ́ di ẹrú.’
  rationale: Gíríìkì jẹ́ passive, ṣùgbọ́n dative náà lè tọ́ka sí ohun tí ó ti gba àṣẹ lórí ẹni. Yorùbá active causative yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ pé ohun tó ṣẹ́gun ẹni náà ló ń ṣàkóso rẹ̀ mọ́ láì dá olùṣe míì sílẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá yẹ. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ìwé mímọ́ ní gbangba. A kò fi àlàyé ẹ̀kọ́ ìjọ kan pàtó kún un.
