id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: yo
  text: Wọ́n kọ ọ̀nà títọ́ sílẹ̀, wọ́n sì ṣìnà nípa títẹ̀lé ọ̀nà Báláámù ọmọ Bósórì[a], ẹni tí ó fẹ́ràn èrè àìṣòdodo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bósórì ni fọ́ọ̀mù tí ọ̀rọ̀ Gíríìkì lò; nínú Májẹ̀mú Láéláé, a sábà máa ń pe Báláámù ní ọmọ Béórì.
    reason: alternative_reading
  - marker: b
    text: 'A tún lè túmọ̀ apá àárín gbólóhùn náà sí: “wọ́n sì ṣìnà, wọ́n sì tẹ̀lé ọ̀nà Báláámù.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: καταλιπόντες
  choice: wọ́n kọ ... sílẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n mọ̀ọ́mọ̀ fi ọ̀nà náà sílẹ̀; ìtumọ̀ yìí sì bá àkókò participle aorist mu láì mú èdè Yorùbá le.
- source_word: εὐθεῖαν ὁδὸν
  choice: ọ̀nà títọ́
  rationale: Ó pa àwòrán ọ̀nà gẹ́gẹ́ bí ìrìn ìwà rere mọ́, ó sì túmọ̀ ‘straight way’ ní ọ̀nà àdánidá ní Yorùbá.
- source_word: ἐπλανήθησαν
  choice: wọ́n ṣìnà
  rationale: Ó mú ìtumọ̀ jíjìnà sí ọ̀nà tó tọ́ jáde láì fi hàn pé ẹlòmíràn ló mú wọn ṣìnà.
- source_word: ἐξακολουθήσαντες
  choice: nípa títẹ̀lé
  rationale: Ó fi ìbáṣepọ̀ tó ṣeé ṣe láàárín participle náà àti ọ̀rọ̀-ìṣe pàtàkì hàn pé títẹ̀lé ọ̀nà Báláámù ni ọ̀nà tí wọ́n fi ṣìnà; àlàyé ìsàlẹ̀ pa ìtumọ̀ attendant/sequential mọ́.
- source_word: τῇ ὁδῷ
  choice: ọ̀nà
  rationale: Ó mú àwòrán ọ̀nà kan náà tẹ̀ síwájú, dípò àlàyé tí yóò tú àwòrán náà ká.
- source_word: τοῦ Βαλαὰμ τοῦ Βοσὸρ
  choice: Báláámù ọmọ Bósórì
  rationale: Genitive kejì ni a lóye gẹ́gẹ́ bí ìbátan ọmọ sí baba; ‘Bósórì’ tẹ̀lé fọ́ọ̀mù inú Gíríìkì, nígbà tí àlàyé ìsàlẹ̀ sọ fọ́ọ̀mù Májẹ̀mú Láéláé.
- source_word: μισθὸν ἀδικίας
  choice: èrè àìṣòdodo
  rationale: ‘Èrè’ sọ ohun tí ènìyàn ń rí gbà nítorí ohun búburú tó ṣe, ‘àìṣòdodo’ sì pa ìwọ̀n ìwà àti ẹ̀sìn ἀδικία mọ́.
- source_word: ἠγάπησεν
  choice: ó fẹ́ràn
  rationale: Ìtumọ̀ tààrà fún ἀγαπάω ni, ó sì fi ìfẹ́ Báláámù sí èrè búburú hàn.
theological_decisions:
- issue: Àwòrán ọ̀nà nínú εὐθεῖαν ὁδὸν àti τῇ ὁδῷ
  choice: Pa ‘ọ̀nà’ mọ́ ní ibi méjèèjì.
  alternative: ‘ìgbé ayé títọ́’ tàbí ‘ẹ̀kọ́ òtítọ́’
  rationale: Ọ̀rọ̀ Gíríìkì ń lo àwòrán ọ̀nà fún ìwà àti ìdarí ẹ̀mí; ṣíṣàlàyé rẹ̀ sí ẹ̀kọ́ kan pàtó yóò fi ohun tí kò sí nínú ọ̀rọ̀ kún un.
- issue: Ìdánimọ̀ Βοσόρ
  choice: Bósórì nínú ọ̀rọ̀ pàtàkì, pẹ̀lú Béórì nínú àlàyé ìsàlẹ̀.
  alternative: Béórì nínú ọ̀rọ̀ pàtàkì
  rationale: SBLGNT ní Βοσόρ, ṣùgbọ́n Májẹ̀mú Láéláé sábà máa ń pe Báláámù ní ọmọ Béórì; àlàyé ìsàlẹ̀ jẹ́ kí òǹkàwé rí méjèèjì láì ṣe àtúnṣe ọ̀rọ̀ Gíríìkì ní ìkọ̀kọ̀.
- issue: Ìbáṣepọ̀ ἐξακολουθήσαντες sí ἐπλανήθησαν
  choice: Túmọ̀ ọ́ gẹ́gẹ́ bí ọ̀nà tí wọ́n fi ṣìnà, kí a sì fi ìtumọ̀ attendant/sequential sí àlàyé ìsàlẹ̀.
  alternative: ‘wọ́n ṣìnà, wọ́n sì tẹ̀lé’
  rationale: Participle lè tọ́ka sí ọ̀nà/ìdí tàbí ìṣe tó bá ọ̀rọ̀-ìṣe pàtàkì lọ; ọ̀rọ̀ pàtàkì yan ìtumọ̀ ọ̀nà tó bá àyíká mu, ṣùgbọ́n àlàyé pa àìdánilójú gírámà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kedere ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. A pa àwòrán ‘ọ̀nà’ mọ́, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìjọ kan pàtó. ‘Àìṣòdodo’ ní ìwọ̀n Bíbélì tó yẹ, bí ó tilẹ̀ jẹ́ pé ‘ìwà búburú’ lè rọrùn ju.
