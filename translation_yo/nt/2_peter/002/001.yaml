id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn wòlíì èké dìde láàárín àwọn ènìyàn náà, gẹ́gẹ́ bí àwọn olùkọ́ni èké pẹ̀lú yóò ṣe wà láàárín yín. Wọn yóò mú àwọn ẹ̀kọ́ apanirun[a] wọlé ní ìkọ̀kọ̀, wọ́n yóò sì sẹ́ Ọ̀gá tí ó rà wọ́n[b], nípa bẹ́ẹ̀ wọ́n yóò mú ìparun kíákíá wá sórí ara wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ẹgbẹ́ olùyapa apanirun.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹgbẹ́ tàbí ẹ̀ya ìsìn kan; níhìn-ín, ó ṣeé ṣe kó tọ́ka sí àwọn ẹ̀kọ́ tàbí ìṣísẹ̀ tí ń yọrí sí ìparun.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Olúwa tí ó rà wọ́n padà.” Ní Gíríìkì, ó jẹ́ “Ọ̀gá tí ó rà wọ́n”; ìtumọ̀ yìí pa àwòrán rírà mọ́ láì dáhùn gbogbo àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa bí rírà náà ṣe dé jìnnà.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: wà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń sọ pé àwọn wòlíì èké fara hàn, wọ́n sì wà láàárín àwọn ènìyàn. “Wà” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti sọ ìṣẹ̀lẹ̀ yìí láì fi àlàyé tí kò sí nínú Gíríìkì kún un.
- source_word: ψευδοπροφῆται
  choice: àwọn wòlíì èké
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tó sì wọ́pọ̀ fún àwọn tí wọ́n ń sọ àsọtẹ́lẹ̀ èké.
- source_word: ἐν τῷ λαῷ
  choice: láàárín àwọn ènìyàn náà
  rationale: Ó pa ìtumọ̀ pé wọ́n wà nínú àwùjọ àwọn ènìyàn Ọlọ́run mọ́, láì fi “Ísírẹ́lì” kún ọ̀rọ̀ pàtàkì bí ó tilẹ̀ jẹ́ pé àyíká Májẹ̀mú Láéláé ń tọ́ka sí i.
- source_word: ψευδοδιδάσκαλοι
  choice: àwọn olùkọ́ni èké
  rationale: Ó bá ìfarawé tó wà láàárín “wòlíì èké” àti “olùkọ́ni èké” mu, ó sì ṣe kedere sí òǹkàwé Yorùbá.
- source_word: παρεισάξουσιν
  choice: yóò yọ́ ... wọlé
  rationale: Gbólóhùn Yorùbá yìí fi hàn pé wọ́n yóò mú ohun náà wọlé ní ìkọ̀kọ̀ tàbí ní ọ̀nà àrékérekè, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe túmọ̀ sí.
- source_word: αἱρέσεις ἀπωλείας
  choice: àwọn ẹ̀kọ́ apanirun
  rationale: “Àwọn ẹ̀kọ́” mú ipa ti èrò tàbí ìkọ́ni tó yapa kúrò ní òtítọ́ hàn nínú àyíká yìí; “apanirun” sì pa èrò pé wọ́n ń yọrí sí ìparun mọ́. Àlàyé ìsàlẹ̀ ojú ewé dáàbò bo ìtumọ̀ mìíràn, ìyẹn àwọn ẹgbẹ́ olùyapa.
- source_word: τὸν ... δεσπότην
  choice: Ọ̀gá
  rationale: “Ọ̀gá” fi ipò ẹni tó ní àṣẹ lórí ẹlòmíràn hàn, ó sì yà δεσπότης sọ́tọ̀ kúrò nínú κύριος, èyí tí a sábà máa ń túmọ̀ sí “Olúwa.”
- source_word: ἀγοράσαντα αὐτοὺς
  choice: tí ó rà wọ́n
  rationale: Ó pa àwòrán ọjà inú ọ̀rọ̀ Gíríìkì mọ́, láì yí i sí ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tó dín ìtumọ̀ rẹ̀ kù bí “rà padà.”
- source_word: ἀρνούμενοι
  choice: sẹ́
  rationale: “Sẹ́” fi ìkọ̀sílẹ̀ tàbí àìjẹ́wọ́ ẹni náà hàn ní kíkún, ó sì bá ìwọ̀n ọ̀rọ̀ Gíríìkì mu.
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: wọn yóò mú ìparun kíákíá bá ara wọn
  rationale: Ó pa agbára arọ́pò-orúkọ ara-ẹni àti àbájáde ìṣe wọn mọ́, ó sì jẹ́ Yorùbá àdánidá.
theological_decisions:
- issue: Ìtumọ̀ αἱρέσεις nínú àyíká yìí
  choice: àwọn ẹ̀kọ́ apanirun
  alternative: àwọn ẹgbẹ́ olùyapa apanirun
  rationale: Ìmú wọn wọlé ní ìkọ̀kọ̀ àti sísẹ́ Ọ̀gá fi hàn pé ìkọ́ni tó yapa kúrò ní òtítọ́ ni a tẹnumọ́. Síbẹ̀, àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ “ẹgbẹ́” mọ́.
- issue: Agbára ọ̀rọ̀ τὸν ἀγοράσαντα αὐτοὺς δεσπότην
  choice: Ọ̀gá tí ó rà wọ́n
  alternative: Olúwa tí ó rà wọ́n padà
  rationale: A pa ọ̀rọ̀ pé Ó “rà wọ́n” àti ìnira ẹ̀kọ́ ìgbàgbọ́ inú rẹ̀ mọ́ láì pinnu bí rírà náà ṣe dé jìnnà tàbí irú ìràpadà wo ni ó jẹ́.
- issue: Yíya δεσπότης sọ́tọ̀ kúrò nínú κύριος
  choice: Ọ̀gá
  alternative: Olúwa
  rationale: “Ọ̀gá” pa ìtumọ̀ ẹni tó ní àṣẹ àti ìní mọ́, kò sì da akọ́lé Gíríìkì méjèèjì pọ̀.
translation_notes:
  register: A lo Yorùbá àkókò yìí tó ní iyì, tó ṣe kedere sí àwọn òǹkàwé lásán. Àmì ohùn kún ibi tí ó yẹ. “Yọ́ ... wọlé” jẹ́ ọ̀rọ̀ àdánidá fún ìmú ohun kan wọlé ní ìkọ̀kọ̀; “Ọ̀gá” sì pa ìyàtọ̀ akọ́lé Gíríìkì mọ́.
