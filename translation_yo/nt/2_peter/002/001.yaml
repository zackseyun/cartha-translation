  to: Ṣùgbọ́n àwọn wòlíì èké dìde láàárín àwọn ènìyàn náà, gẹ́gẹ́ bí àwọn olùkọ́ni èké pẹ̀lú yóò ṣe wà láàárín yín. Wọn yóò mú àwọn ẹ̀kọ́ apanirun[a] wọlé ní ìkọ̀kọ̀, wọ́n yóò sì sẹ́ Ọ̀gá tí ó rà wọ́n[b], nípa bẹ́ẹ̀ wọ́n yóò mú ìparun kíákíá wá sórí ara wọn.
