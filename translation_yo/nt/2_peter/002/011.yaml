  - severity: medium
    issue: “pàápàá”
    rationale: Kò sí ọ̀rọ̀ tó bá ‘even’ mu nínú Gíríìkì; ó ń fi ìtẹnumọ́ kún ọ̀rọ̀ náà.
  - severity: medium
