revisions:
- from: Nígbà tí àwọn áńgẹ́lì pàápàá, bí ó tilẹ̀ jẹ́ pé wọ́n pọ̀ ju wọn lọ ní agbára àti ọlá, kò mú ìdájọ́ ẹ̀gàn wá sí wọn.[a]
  to: Nígbà tí àwọn áńgẹ́lì, bí ó tilẹ̀ jẹ́ pé wọ́n ga ju wọn lọ ní okun àti agbára, kì í mú ìdájọ́ abuku wá lòdì sí wọn.[a]
  rationale: A rọ́pò ìtumọ̀ ìye (“pọ̀ ju”) pẹ̀lú ìfiwéra ìtóbi/agbára (“ga ju”), a rọ́pò “ọlá” pẹ̀lú “okun àti agbára,” a yọ ìtẹnumọ́ tí kò sí nínú ìpilẹ̀ṣẹ̀ kúrò, a sì tún ọ̀rọ̀-ìṣe ṣe fún kókó-ọrọ̀ púpọ̀. Arọ́pò-orúkọ méjèèjì ni a pa mọ́ gẹ́gẹ́ bí “wọn” láti tọ́jú àìdájú ìtọ́kasí Gíríìkì.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:31:57Z'
review_pass:
  verdict: revise
  source_fidelity: Àtúnyẹ̀wò jẹ́ dandan. Ìtumọ̀ ìpilẹ̀ṣẹ̀ ní “pọ̀ ju wọn lọ” (ìye púpọ̀ ju) fún μείζονες, ó sì lo “ọlá” (honour/prestige) fún δύναμις, tí ó túmọ̀ sí agbára/ipá. “Pàápàá” tún ń fi ìtẹnumọ́ ‘even’ kún un láìsí nínú Gíríìkì. Àtúnṣe náà pa ìfiwéra, àìmọ̀ ẹni tí ‘wọn’ jẹ́, àti ìtumọ̀ ìdájọ́ abuku mọ́.
  naturalness: “Nígbà tí” lè ṣiṣẹ́ gẹ́gẹ́ bí asopọ̀ ìyàtọ̀ ní Yorùbá, ṣùgbọ́n a yọ “pàápàá” kúrò. “Ga ju wọn lọ ní okun àti agbára” jẹ́ ọ̀nà Yorùbá tó dáa láti sọ ìfiwéra nípa agbára, “wọ́n kì í mú ... wá lòdì sí wọn” sì bá ọ̀rọ̀ ìdájọ́ mu dáadáa.
  terminology: “Áńgẹ́lì” yẹ. “Okun àti agbára” ń ṣàfihàn ἰσχύϊ καὶ δυνάμει dájúdájú ju “agbára àti ọlá” lọ. “Ìdájọ́ abuku” ń sọ βλάσφημον κρίσιν ní ìforígbárí tó bójú mu, láìdí ìtumọ̀ rẹ̀ mọ́ ọ̀rọ̀ òdì sí Ọlọ́run nìkan.
