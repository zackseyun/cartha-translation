    rationale: Èyí túmọ̀ sí pé wọ́n pọ̀ ní iye ju wọn lọ, nígbà tí ọ̀rọ̀ Gíríìkì ń sọ pé àwọn áńgẹ́lì ga jù wọ́n lọ ní okun àti agbára.
  - severity: high
