id: 2PE.2.11
reference: 2 Peter 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: yo
  text: Nígbà tí àwọn áńgẹ́lì, bí ó tilẹ̀ jẹ́ pé wọ́n ga ju wọn lọ ní okun àti agbára, kì í mú ìdájọ́ abuku wá lòdì sí wọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wọn” lè tọ́ka sí “àwọn ológo” nínú ẹsẹ tó ṣáájú, ṣùgbọ́n Pétérù kò dá ẹni tí wọ́n jẹ́ mọ́ ní kedere níhìn-ín. “Ìdájọ́ abuku” tún lè túmọ̀ sí ìdájọ́ ẹ̀gàn tàbí ìdájọ́ ìbanilórúkọjẹ́.
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: ὅπου
  choice: Nígbà tí … pàápàá
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ὅπου ń fi ohun tí àwọn áńgẹ́lì ṣe wé ìwà àwọn olùkọ́ èké, ó sì ń fi ìyàtọ̀ wọn hàn; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ἄγγελοι
  choice: àwọn áńgẹ́lì
  rationale: Àwọn ẹ̀dá ọ̀run ni ọ̀rọ̀ náà túmọ̀ sí níhìn-ín, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: ní agbára àti ọlá
  rationale: Àwọn ọ̀rọ̀ méjèèjì ń tọ́ka sí okun àti agbára láti ṣe ohun kan; pípa wọn mọ́ lọ́tọ̀ ń pa ìtẹnumọ́ Gíríìkì mọ́.
- source_word: μείζονες ὄντες
  choice: bí ó tilẹ̀ jẹ́ pé wọ́n pọ̀ ju wọn lọ
  rationale: 'Ọ̀rọ̀ aláìlópìn náà ní agbára ìyọ̀ǹda ní àyíká yìí: bó tilẹ̀ jẹ́ pé àwọn áńgẹ́lì ga jù lọ nípa agbára, wọn kò ṣe ohun tí ẹsẹ tó ṣáájú ṣàpèjúwe.'
- source_word: οὐ φέρουσιν
  choice: kò mú … wá
  rationale: φέρω pẹ̀lú κρίσιν túmọ̀ sí mímú ẹ̀sùn tàbí ìdájọ́ kan wá síwájú; ìtumọ̀ yìí tún pa àwòrán ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́.
- source_word: κατ’ αὐτῶν
  choice: sí wọn
  rationale: Arọ́pò-orúkọ náà kò sọ àwọn tí ó ń tọ́ka sí ní kedere; “wọn” pa àìṣedéédé yẹn mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan kún un.
- source_word: βλάσφημον
  choice: ẹ̀gàn
  rationale: Nínú àyíká yìí, βλάσφημος ń ṣàpèjúwe ọ̀rọ̀ abuku, ẹ̀gàn, tàbí ìbanilórúkọjẹ́, kì í ṣe dandan ọ̀rọ̀ òdì sí Ọlọ́run nìkan.
- source_word: κρίσιν
  choice: ìdájọ́
  rationale: κρίσις jẹ́ ìpinnu tàbí ìdájọ́ ní ọ̀nà adájọ́; “ìdájọ́” jẹ́ ọ̀rọ̀ Yorùbá tó gbòòrò tí ajẹtífù náà sì ń ṣàlàyé.
theological_decisions:
- issue: Ẹni tàbí àwọn ẹni tí αὐτῶν (“wọn”) ń tọ́ka sí
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí “wọn” nínú ọ̀rọ̀ pàtàkì.
  alternative: Àwọn ẹ̀dá ọ̀run ọlọ̀tẹ̀; àwọn olórí ènìyàn; tàbí àwọn ẹ̀dá ológo ọ̀run lápapọ̀.
  rationale: Ẹsẹ yìí kò dá ẹni tí arọ́pò-orúkọ náà ń tọ́ka sí mọ́ ní kedere, bí ó tilẹ̀ ṣeé ṣe kí ó tọ́ka sí “àwọn ológo” inú ẹsẹ 10. A kò gbọ́dọ̀ yan ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan tí ọ̀rọ̀ náà kò fi dandan múlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo “áńgẹ́lì” gẹ́gẹ́ bí ọ̀rọ̀ Bíbélì tó wọ́pọ̀. A pa arọ́pò-orúkọ “wọn” mọ́ láti má ṣe yan ẹni tí ó ń tọ́ka sí láìní ẹ̀rí tó pé.
