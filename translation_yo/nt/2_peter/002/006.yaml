id: 2PE.2.6
reference: 2 Peter 2:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: yo
  text: àti bí ó bá sọ àwọn ìlú Sódómù àti Gòmórà di eérú, tí ó sì dá wọn lẹ́bi sí ìparun[a], tí ó fi wọ́n ṣe àpẹẹrẹ fún àwọn tí yóò máa gbé láìbọ̀wọ̀ fún Ọlọ́run[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó ti sọ wọ́n di eérú.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí ó fi wọ́n ṣe àpẹẹrẹ fún àwọn ènìyàn aláìbẹ̀rù Ọlọ́run tí yóò wà ní ọjọ́ iwájú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: sọ àwọn ìlú ... di eérú
  rationale: 'Ó sọ àbájáde ọ̀rọ̀ Gíríìkì τεφρόω ní tààràtà: a sọ àwọn ìlú náà di eérú, kì í ṣe pé a kàn jó wọn nìkan.'
- source_word: καταστροφῇ
  choice: ìparun
  rationale: 'Dátífù náà ń tọ́ka sí àbájáde ìdájọ́: ó dá wọn lẹ́bi sí ìparun. Èdè Yorùbá àdánidá lè fi ‘lẹ́bi ìparun’ sọ èyí.'
- source_word: κατέκρινεν
  choice: dá wọn lẹ́bi
  rationale: Ọ̀rọ̀ náà ní agbára ìdájọ́, ìyẹn ni pípolongo pé ẹni kan jẹ̀bi àti pé ìdájọ́ ń bẹ lórí rẹ̀.
- source_word: ὑπόδειγμα
  choice: àpẹẹrẹ
  rationale: ‘Àpẹẹrẹ’ pa ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́; nínú àyíká ìdájọ́ yìí, ó tún ń ṣiṣẹ́ gẹ́gẹ́ bí ìkìlọ̀.
- source_word: μελλόντων ἀσεβέσιν
  choice: fún àwọn tí yóò máa gbé láìbọ̀wọ̀ fún Ọlọ́run
  rationale: ‘Yóò’ pa ìtọ́ka sí ọjọ́ iwájú mọ́, ‘gbé láìbọ̀wọ̀ fún Ọlọ́run’ sì sọ agbára ìwà àti ẹ̀sìn inú ἀσεβής ní Yorùbá tí ó ṣe kedere.
- source_word: τεθεικώς
  choice: tí ó fi wọ́n ṣe
  rationale: Àṣàyàn yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó gbé wọn kalẹ̀ ní ipò àpẹẹrẹ, pẹ̀lú àbájáde tí ó dúró.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: àwọn ìlú Sódómù àti Gòmórà
  rationale: Ó pa ọ̀pọ̀ ‘àwọn ìlú’ àti orúkọ ibìkan méjèèjì mọ́ ní ọ̀nà Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Olùṣe tí a kò tún dárúkọ nínú gbólóhùn náà
  choice: ó
  alternative: Ọlọ́run; Olúwa
  rationale: Ọ̀rọ̀ Gíríìkì ń tẹ̀ síwájú pẹ̀lú olùṣe tí àyíká ṣáájú ti jẹ́ ká mọ̀. ‘Ó’ pa ìṣàn ọ̀rọ̀ àti àìsọ oyè kan tí kò sí nínú gbólóhùn yìí mọ́.
- issue: Agbára ọ̀rọ̀ ἀσεβέσιν
  choice: àwọn tí yóò máa gbé láìbọ̀wọ̀ fún Ọlọ́run
  alternative: àwọn aláìwà-bí-Ọlọ́run; àwọn ènìyàn aláìbẹ̀rù Ọlọ́run ní ọjọ́ iwájú
  rationale: Èyí mú ìtumọ̀ àìbọ̀wọ̀ tàbí àìfọkànsìn sí Ọlọ́run hàn láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kun un, ó sì pa ìtọ́ka μέλλω sí ọjọ́ iwájú mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn náà jẹ́ apá kan tí ó ń bá àtòjọ ‘bí ó bá ...’ nínú àyíká rẹ̀ lọ, nítorí náà a pa ìbẹ̀rẹ̀ ‘àti bí ó bá’ àti àmì kọ́mà ìparí mọ́.
