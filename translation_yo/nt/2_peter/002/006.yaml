  source_fidelity: 'Ìtumọ̀ àkọ́kọ́ ń pa àwọn èrò pàtàkì Gíríìkì mọ́: a sọ àwọn ìlú náà di eérú, a dá wọn lẹ́bi sí ìparun, a sì fi wọ́n ṣe àpẹẹrẹ fún àwọn aláìbọ̀wọ̀ fún Ọlọ́run ní ọjọ́ iwájú. Ṣùgbọ́n ‘dá wọn lẹ́bi ìparun’ lè dá bí ẹni pé ìparun ni ẹ̀sùn tí wọ́n jẹ́bi rẹ̀; ‘dá wọn lẹ́bi sí ìparun’ sọ ìdájọ́ tí καταστροφῇ ń ṣàpèjúwe kedere.'
