id: 2PE.2.13
reference: 2 Peter 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ⸀ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: yo
  text: wọ́n ń gba ẹ̀san fún ìwà àìṣòdodo[a], wọ́n ka ìgbádùn àṣejù ní ọ̀sán sí ohun amúnidùn. Àbàwọ́n àti àléébù ni wọ́n, wọ́n ń yọ̀ nínú ẹ̀tàn wọn[b] bí wọ́n ti ń jẹ àsè pẹ̀lú yín,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀san fún ìwà búburú.”
    reason: lexical_alternative
  - marker: b
    text: 'Àwọn àfọwọ́kọ kan ní “àsè ìfẹ́” dípò “ẹ̀tàn”: “wọ́n ń yọ̀ nínú àsè ìfẹ́ wọn bí wọ́n ti ń jẹ àsè pẹ̀lú yín.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι μισθὸν ἀδικίας
  choice: wọ́n ń gba èrè ìwà àìṣòdodo
  rationale: Ọ̀rọ̀ náà nínú àyíká yìí ń sọ nípa gbígba èsì tàbí ìjìyà ìwà búburú. “Èrè” lè túmọ̀ sí owó iṣẹ́ tàbí ohun tí ènìyàn rí gbà gẹ́gẹ́ bí èsì iṣẹ́ rẹ̀, ó sì pa ìsopọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἡδονὴν ἡγούμενοι
  choice: wọ́n ka ... sí adùn
  rationale: “Ka ... sí” jẹ́ ọ̀nà Yorùbá àdánidá fún rí ohun kan gẹ́gẹ́ bí ohun mìíràn; “adùn” níbí túmọ̀ sí ìgbádùn tàbí ohun amúnidùn.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: ìgbádùn àṣejù ní ọ̀sán
  rationale: “Ìgbádùn àṣejù” mú èrò fífi ara jin fún afẹ́ àti adùn ayé jáde, “ní ọ̀sán” sì pa ìtumọ̀ gbangba ti ἐν ἡμέρᾳ mọ́ láìfi àlàyé kún un.
- source_word: σπίλοι καὶ μῶμοι
  choice: Àbàwọ́n àti àléébù
  rationale: Àwọn ọ̀rọ̀ méjèèjì ń fi àìmọ́ àti ohun tí kò pé hàn ní ọ̀nà àkàwé; ìtumọ̀ yìí pa àwòrán méjì náà mọ́.
- source_word: ἐντρυφῶντες
  choice: wọ́n ń ṣe fàájì
  rationale: “Ṣe fàájì” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún jíjẹ adùn tàbí ṣíṣe ayẹyẹ pẹ̀lú ìgbádùn, ó sì bá kókó àṣejù nínú ẹsẹ náà mu.
- source_word: ἀπάταις αὐτῶν
  choice: nínú ẹ̀tàn wọn
  rationale: SBLGNT ka ἀπάταις, ìyẹn “ẹ̀tàn,” kì í ṣe ἀγάπαις, “àsè ìfẹ́.” Àṣàyàn yìí tẹ̀ lé ẹ̀rí orísun tí a pèsè.
- source_word: συνευωχούμενοι ὑμῖν
  choice: bí wọ́n ti ń jẹ àsè pẹ̀lú yín
  rationale: Ìtumọ̀ náà pa èrò jíjẹ àsè papọ̀ àti ìṣe tí ń lọ ní àkókò kan náà mọ́, láìsọ irú àsè náà di pàtó.
theological_decisions:
- issue: Ìyàtọ̀ àfọwọ́kọ ní ἀπάταις / ἀγάπαις
  choice: A lo ἀπάταις gẹ́gẹ́ bí “ẹ̀tàn wọn” nínú ẹsẹ.
  alternative: Àwọn àfọwọ́kọ kan ní ἀγάπαις, ìyẹn “àsè ìfẹ́ wọn.”
  rationale: Ẹ̀dà SBLGNT tí a pèsè ní ἀπάταις, èyí sì bá ọ̀rọ̀ nípa àwọn olùkọ́ èké mu. Síbẹ̀, a fi àṣàyàn ἀγάπαις sínú àlàyé ìsàlẹ̀ nítorí ó ní ìtumọ̀ pàtàkì.
- issue: Ìtumọ̀ μισθὸν ἀδικίας
  choice: èrè ìwà àìṣòdodo
  alternative: èsì ìwà búburú
  rationale: “Èrè” pa àwòrán μισθός mọ́, ṣùgbọ́n ọ̀rọ̀ náà lè tọ́ka sí ohun tí ìwà búburú mú wá gẹ́gẹ́ bí ìsanpadà, kì í ṣe èrè rere.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti ìgbàlódé ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A yan “ìgbádùn àṣejù,” “àbàwọ́n àti àléébù,” àti “ṣe fàájì” láti jẹ́ kí ọ̀rọ̀ náà yé òǹkàwé òde òní, nígbà tí a ń pa ohùn ìbáwí àti àwọn àwòrán orísun mọ́. Àwọn àmì àlàyé [a] àti [b] wà nínú ẹsẹ, wọ́n sì bá àwọn àlàyé ìsàlẹ̀ mu.
