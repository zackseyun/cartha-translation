  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń pa ọ̀pọ̀ èrò orísun náà mọ́: ọjọ́ iwájú ‘yóò,’ ìbáṣepọ̀ ‘nítorí wọn,’ àwòrán ‘ọ̀nà,’ àti ìkọ́lé passive ní ọ̀nà Yorùbá. Síbẹ̀, ‘ìwà àìnítìjú’ nìkan lè dín ἀσελγείαις kù sí àìníojú; ‘ìwà àìníjàánu’ mú ìtumọ̀ ìfẹ́kúfẹ̀ẹ́/ìwà tí kò ní ìdádúró pọ̀ sí i. Gbólóhùn ìkẹyìn náà tún lè rọrùn, kí passive aláìlẹ́ni má ṣe dà bí ẹni pé ‘a ó fi’ jẹ́ ohun èlò kan.'
  naturalness: ‘Nítorí àwọn ènìyàn wọ̀nyẹn ni a ó fi sọ̀rọ̀-òdì sí’ ní ìfàsẹyìn àti ìdílé ‘fi’ tí kò ṣe pàtàkì. ‘Nítorí wọn, a ó sọ̀rọ̀-òdì sí ...’ jẹ́ Yorùbá boṣewa, ó sì ṣàfihàn ìdí náà ní kedere. Àmì ohùn nínú àtúnṣe jẹ́ ti ìlò boṣewa.
  terminology: A ti pa ‘ọ̀nà òtítọ́’ mọ́ gẹ́gẹ́ bí ọ̀nà Yorùbá àdánidá fún ἡ ὁδὸς τῆς ἀληθείας, láìsọ pé ó túmọ̀ sí ẹ̀kọ́ kan pàtó. ‘Sọ̀rọ̀-òdì sí’ yẹ fún βλασφημηθήσεται ní àyíká yìí; ó ṣàfihàn ẹ̀gàn/ìsọ̀rọ̀ ìkọlù sí ọ̀nà náà láìfi ìtumọ̀ tóóró ‘bú Ọlọ́run’ kún un.
