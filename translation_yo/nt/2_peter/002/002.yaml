    rationale: Àtúnsọ ‘àwọn ènìyàn wọ̀nyẹn’ àti ‘fi’ kò nílò fún δι’ οὓς, ó sì jẹ́ kí gbolohun náà dín ìṣàn Yorùbá kù.
