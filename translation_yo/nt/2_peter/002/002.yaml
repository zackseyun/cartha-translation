  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: yo
  text: Ọ̀pọ̀ ènìyàn yóò sì tẹ̀lé àwọn ìwà àìníjàánu wọn[a], nítorí wọn, a ó sì sọ̀rọ̀-òdì sí ọ̀nà òtítọ́[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí ‘ìwà àìnítìjú,’ ‘ìwà ìbàjẹ́,’ tàbí ‘ìwà àgbèrè.’ Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìwà àìníjàánu àti àìnítìjú, ó sì sábà máa ń ní àbá ìbálòpọ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘ọ̀nà ti òtítọ́.’ Ó ṣeé ṣe kí gbólóhùn yìí tọ́ka sí ìgbàgbọ́ Kristẹni àti ọ̀nà ìgbésí ayé rẹ̀ gẹ́gẹ́ bí ọ̀nà tó bá òtítọ́ mu.
    reason: lexical_alternative
  - marker: c
    text: Tàbí ‘a ó gàn’ tàbí ‘a ó sọ̀rọ̀ burúkú sí.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Ọ̀pọ̀ ènìyàn
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ‘ọ̀pọ̀,’ ó sì pa ìtumọ̀ iye púpọ̀ mọ́.
- source_word: ἐξακολουθήσουσιν
  choice: yóò tẹ̀lé
  rationale: Ó pa agbára ọ̀rọ̀ ọjọ́ iwájú àti àwòrán títẹ̀lé ipa tàbí àpẹẹrẹ ẹlòmíràn mọ́ láìfi àlàyé kún un.
- source_word: αὐτῶν
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà tọ́ka sí àwọn olùkọ́ èké tí a mẹ́nu kàn nínú àyíká ẹsẹ̀ náà.
- source_word: ταῖς ἀσελγείαις
  choice: àwọn ìwà àìnítìjú
  rationale: Ìtumọ̀ náà gba ìwà tí kò ní ìjánu, tí kò sì ní ojú, pẹ̀lú àbá ìbálòpọ̀ tí ọ̀rọ̀ Gíríìkì lè ní. Lílo ‘àwọn’ tún fi ọ̀pọ̀ nǹkan tí ọ̀rọ̀ Gíríìkì náà jẹ́ hàn.
- source_word: δι’ οὓς
  choice: nítorí àwọn ènìyàn wọ̀nyẹn
  rationale: διά pẹ̀lú ọ̀rọ̀ ní accusative ń fi ohun tó fa nǹkan hàn níbí. Àtúnsọ orúkọ náà mú ẹni tí ‘wọn’ ń tọ́ka sí ṣe kedere ní Yorùbá.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: ọ̀nà òtítọ́
  rationale: Gbólóhùn yìí pa àwòrán ‘ọ̀nà’ mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ìgbàgbọ́ àti ìgbésí ayé tó bá òtítọ́ mu.
- source_word: βλασφημηθήσεται
  choice: a ó sọ̀rọ̀-òdì sí
  rationale: Ìkọ́lé aláìlẹ́ni Yorùbá yìí fi passive ọjọ́ iwájú hàn lọ́nà àdánidá, ó sì gba ìtumọ̀ sísọ̀rọ̀ búburú sí ohun mímọ́ tàbí ohun ọlọ́lá.
theological_decisions:
- issue: Ohun tí ‘ọ̀nà òtítọ́’ ń tọ́ka sí àti agbára gbólóhùn náà
  choice: A pa àwòrán ọ̀nà mọ́ gẹ́gẹ́ bí ìtọ́ka sí ìgbàgbọ́ Kristẹni àti ìgbésí ayé tó bá òtítọ́ mu.
  alternative: ‘ọ̀nà ti òtítọ́’ tàbí ‘ọ̀nà tòótọ́’
  rationale: ‘Ọ̀nà òtítọ́’ jẹ́ àdánidá ní Yorùbá, ó pa àwòrán orísun mọ́, kò sì dín gbólóhùn náà kù sí ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó.
- issue: Ìwọ̀n ìwà tí ἀσέλγεια kó sínú
  choice: ‘àwọn ìwà àìnítìjú’ láti gba ìwà àìníjàánu ní gbogbogbòò àti àbá ìbálòpọ̀ rẹ̀.
  alternative: ‘ìwà wọ̀bìà,’ ‘ìwà ìbàjẹ́,’ tàbí ‘ìwà àgbèrè’
  rationale: Ọ̀rọ̀ Gíríìkì lè ní í ṣe pẹ̀lú ìbálòpọ̀, ṣùgbọ́n kò yẹ kí a fi túmọ̀ rẹ̀ sí ìwà àgbèrè nìkan; yíyan yìí pa ìmọ̀ ìtumọ̀ tó gbòòrò mọ́.
- issue: Agbára βλασφημέω nígbà tí ohun tí a ń sọ̀rọ̀ sí jẹ́ ‘ọ̀nà òtítọ́’
  choice: ‘a ó sọ̀rọ̀-òdì sí’
  alternative: ‘a ó bú’ tàbí ‘a ó sọ̀rọ̀ burúkú sí’
  rationale: Yíyan náà pa ìtumọ̀ ẹ̀gàn àti ọ̀rọ̀ ìkọlù mọ́ láìfi dandan sọ pé ọ̀rọ̀ náà jẹ́ ìsọ̀rọ̀-òdì sí Ọlọ́run ní ìtumọ̀ tóóró.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún ni a lò. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì rọrùn fún òǹkàwé gbogbogbòò. A lo ìkọ́lé aláìlẹ́ni ‘a ó’ láti tú passive Gíríìkì ní Yorùbá àdánidá.
