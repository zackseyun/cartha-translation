revisions:
- from: Wọ́n ní ojú tí ó kún fún obìnrin panṣágà[a], tí kò sì lè dáwọ́ dídá ẹ̀ṣẹ̀ dúró[b]. Wọ́n ń fi ẹ̀tàn tan àwọn ọkàn tí kò fìdí múlẹ̀; wọ́n ní ọkàn tí a ti dá lẹ́kọ̀ọ́ nínú ojúkòkòrò. Ọmọ ègún ni wọ́n.
  to: Ojú wọn kún fún obìnrin panṣágà[a], wọn kò sì lè dáwọ́ ẹ̀ṣẹ̀ dúró[b]; wọ́n ń tàn àwọn ọkàn tí kò fìdí múlẹ̀ wọlé; wọ́n ní ọkàn tí a ti dá lẹ́kọ̀ọ́ nínú ojúkòkòrò; àwọn ọmọ ègún ni wọ́n.
  rationale: A yọ ìfikún ‘ẹ̀tàn’ kúrò nínú ìtumọ̀ δελεάζοντες, a ṣe ìtòlẹ́sẹẹsẹ gbolohun náà ní ọ̀nà Yorùbá tó máa ń sọ ẹni tí kò lè dáwọ́ ẹ̀ṣẹ̀ dúró ní kedere, a sì tún τέκνα ṣe sí ọ̀pọ̀. Àwọn àtúnṣe wọ̀nyí kò yí ìtumọ̀ ẹsẹ̀ padà; wọ́n mú ìfaramọ́ sí orísun àti ìmúrasílẹ̀ Yorùbá pọ̀ sí i.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:32:15Z'
