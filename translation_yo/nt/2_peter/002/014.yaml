id: 2PE.2.14
reference: 2 Peter 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: yo
  text: Ojú wọn kún fún obìnrin panṣágà[a], wọn kò sì lè dáwọ́ ẹ̀ṣẹ̀ dúró[b]; wọ́n ń tàn àwọn ọkàn tí kò fìdí múlẹ̀ wọlé; wọ́n ní ọkàn tí a ti dá lẹ́kọ̀ọ́ nínú ojúkòkòrò; àwọn ọmọ ègún ni wọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ìtumọ̀ àlàyé, “ojú tí ó kún fún panṣágà” tàbí “ojú tí ó kún fún ìfẹ́ panṣágà.” Ní tààràtà, Gíríìkì sọ pé “ojú tí ó kún fún obìnrin panṣágà,” èyí tí ó jẹ́ àwòrán ọ̀rọ̀ líle.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí kì í dáwọ́ ẹ̀ṣẹ̀ dúró,” tàbí “tí kò lè yó fún ẹ̀ṣẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: ojú tí ó kún fún obìnrin panṣágà
  rationale: Èyí pa àwòrán gíríìkì náà mọ́ ní tààràtà—‘ojú tí ó kún fún obìnrin panṣágà’—dípò yíyí i padà sí ‘panṣágà’ lásán. Àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ àlàyé míì hàn.
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: tí kò lè dáwọ́ dídá ẹ̀ṣẹ̀ dúró
  rationale: Gbólóhùn yìí tẹ̀lé ìtumọ̀ pé ojú wọn kò dáwọ́ ẹ̀ṣẹ̀ dúró, ó sì yàgò fún fífi èrò ‘àìyó fún ẹ̀ṣẹ̀’ kún ohun tí ọ̀rọ̀ náà sọ.
- source_word: δελεάζοντες
  choice: wọ́n ń fi ẹ̀tàn tan
  rationale: Ọ̀rọ̀ náà ní agbára fífi ìdẹ tàbí ẹ̀tàn fa ẹni wọlé; gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ apanirun náà mọ́.
- source_word: ψυχὰς ἀστηρίκτους
  choice: àwọn ọkàn tí kò fìdí múlẹ̀
  rationale: ‘Àwọn ọkàn’ pa ψυχάς mọ́, ‘tí kò fìdí múlẹ̀’ sì sọ àìní ìdúróṣinṣin tàbí ìfẹsẹ̀múlẹ̀ wọn.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: ọkàn tí a ti dá lẹ́kọ̀ọ́ nínú ojúkòkòrò
  rationale: ‘Dá lẹ́kọ̀ọ́’ mú àwòrán ìdánilẹ́kọ̀ọ́ inú γεγυμνασμένην jáde; ‘ojúkòkòrò’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún πλεονεξία.
- source_word: κατάρας τέκνα
  choice: Ọmọ ègún ni wọ́n
  rationale: Èyí pa àpèjúwe ‘ọmọ ègún’ mọ́, dípò fífi àlàyé bóyá ègún ti dé bá wọn tàbí pé ìwà ègún ló ń ṣàpèjúwe wọn sí i.
theological_decisions:
- issue: Bóyá kí a rọ àwòrán ìbálòpọ̀ inú μοιχαλίδος
  choice: Pa ‘obìnrin panṣágà’ mọ́ nínú ẹsẹ̀ pàtàkì
  alternative: ‘ojú tí ó kún fún panṣágà’ tàbí ‘ojú tí ó kún fún ìfẹ́ panṣágà’
  rationale: Gíríìkì lo ọ̀rọ̀ obìnrin ní ẹyọ kan ní tààràtà. Àwọn ìtumọ̀ àlàyé lè rọrùn sí òǹkàwé, ṣùgbọ́n wọn tú àwòrán líle náà ká; nítorí náà a fi wọn sínú àlàyé ìsàlẹ̀.
- issue: Bóyá ἀκαταπαύστους ἁμαρτίας túmọ̀ sí àìyó fún ẹ̀ṣẹ̀ tàbí àìdáwọ́ ẹ̀ṣẹ̀ dúró
  choice: ‘tí kò lè dáwọ́ dídá ẹ̀ṣẹ̀ dúró’
  alternative: ‘tí kò lè yó fún ẹ̀ṣẹ̀’
  rationale: Ìtumọ̀ àìdáwọ́ dúró sun mọ́ ìṣètò ọ̀rọ̀ Gíríìkì jù, ó sì pa ìfẹ̀hónúhàn pé wọ́n ń bá ẹ̀ṣẹ̀ lọ mọ́ láìfi ìtumọ̀ ìfẹ́kúfẹ̀ẹ́ sí i ní dandan.
- issue: Ìtumọ̀ κατάρας τέκνα
  choice: ‘Ọmọ ègún ni wọ́n’
  alternative: ‘wọ́n wà lábẹ́ ègún’ tàbí ‘ọmọ tí a ti gégùn ni wọ́n’
  rationale: Ọ̀rọ̀ yìí pa àìmọ̀ pàtó bóyá ègún ń ṣàpèjúwe irú ẹni tí wọ́n jẹ́ tàbí ìdájọ́ tí ó ń dúró de wọn mọ́.
translation_notes:
  register: A lo Yorùbá àgbàṣe tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí ibi tí ó yẹ. Ìtẹ̀síwájú ‘wọ́n ní … wọ́n ń … wọ́n ní …’ pa ìkójọpọ̀ ẹ̀sùn inú Gíríìkì mọ́, nígbà tí gbolohun ìkẹyìn ‘Ọmọ ègún ni wọ́n’ fún un ní ìparí líle.
