  source_fidelity: Ìtumọ̀ náà pa ìtòlẹ́sẹẹsẹ àti ọ̀pọ̀ ìtumọ̀ pàtàkì Gíríìkì mọ́ dáadáa, títí kan àwòrán tí ó ṣe kedere nínú μεστοὺς μοιχαλίδος, ìdúróṣinṣin-kù nínú ψυχὰς ἀστηρίκτους, àti ‘ọmọ ègún.’ Síbẹ̀, ‘wọ́n ń fi ẹ̀tàn tan’ ń fi ‘ẹ̀tàn’ kún δελεάζοντες; ọ̀rọ̀ náà túmọ̀ sí fífi ìdẹ/ìfẹ́ fa ẹni wọlé, kò sì béèrè ìfikún yẹn. ‘Ọmọ ègún’ yẹ kí ó wà ní ọ̀pọ̀ gẹ́gẹ́ bí τέκνα.
  naturalness: 'Àtúnṣe náà mú Yorùbá rọrùn sí i: a yà ìṣe ‘kò lè dáwọ́ ẹ̀ṣẹ̀ dúró’ sọ́tọ̀ kúrò nínú ‘ojú,’ nítorí pé bí ó tilẹ̀ jẹ́ pé Gíríìkì so ó mọ́ ‘ojú,’ ìtumọ̀ rẹ̀ ń tọ́ka sí àwọn ènìyàn. ‘Tàn ... wọlé’ jẹ́ ọ̀nà àdánidá láti sọ ìfẹ́fà ẹni wọlé láìfikún ‘ẹ̀tàn.’'
  terminology: ‘Obìnrin panṣágà,’ ‘ẹ̀ṣẹ̀,’ ‘ọkàn,’ ‘ojúkòkòrò,’ àti ‘ègún’ jẹ́ ọ̀rọ̀ tó yẹ, tó sì bójú mu nínú ìforígbárí ìwà búburú inú ẹsẹ̀ yìí. A pa àìmọ̀ pàtó ìdíòmù ‘àwọn ọmọ ègún’ mọ́.
  issues:
