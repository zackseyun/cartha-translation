  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: yo
  text: Àwọn wọ̀nyí jẹ́ orísun aláìní omi àti kùrukùru tí ìjì líle ń lé lọ[a]. A ti pa ìṣúdúdú òkùnkùn mọ́ fún wọn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ìkùukùu tí ìjì líle ń lé lọ.” Ọ̀rọ̀ Giriki náà túmọ̀ ní pàtó sí kùrukùru tàbí ìkùukùu tín-ín-rín, bí ó tilẹ̀ jẹ́ pé àwọn ìtumọ̀ kan túmọ̀ ọ́ sí ìkùukùu ní ọ̀nà tí ó gbòòrò.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “ìṣúdúdú òkùnkùn ni a ti pa mọ́ fún wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: àwọn orísun tí kò ní omi
  rationale: “Orísun” ń tọ́ka sí ibi tí omi ti ń sun jáde, kì í ṣe kànga tí a gbẹ́. Gbólóhùn náà pa àwòrán ohun tí ó yẹ kí ó pèsè omi mọ́, ṣùgbọ́n tí kò ní omi.
- source_word: ὁμίχλαι
  choice: kùrukùru
  rationale: “Kùrukùru” túmọ̀ sí ìkùukùu tín-ín-rín tàbí ìkùukùu tí ó dà bí ìrì lójú afẹ́fẹ́, ó sì sún mọ́ ìtumọ̀ ὁμίχλη ju “ìkùukùu” lásán lọ.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: tí ìjì líle ń lé lọ
  rationale: Èyí fi ipa ìjì ńlá àti ìṣe tí ó ń lé kùrukùru lọ hàn ní èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ passive participle mọ́.
- source_word: οἷς
  choice: wọn
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka padà sí àwọn olùkọ́ èké tí a fi àwọn àwòrán yìí wé, kì í ṣe sí àwọn orísun tàbí kùrukùru gẹ́gẹ́ bí ohun aláìlẹ́mìí.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: ìṣúdúdú òkùnkùn
  rationale: Àṣàyàn yìí pa àwọn ọ̀rọ̀ méjèèjì—ζόφος àti σκότος—mọ́, ó sì sọ ìdájọ́ tí ó bani lẹ́rù ní ọ̀nà tí ó bójú mu ní Yorùbá.
- source_word: τετήρηται
  choice: ni a ti pa mọ́ de
  rationale: Ìṣe yìí fi hàn pé a ti fi ohun náà pamọ́ fún wọn, ó sì ṣì wà ní ìpamọ́ de wọn; ó bá perfect passive ti Giriki mu láì dárúkọ ẹni tí ó ṣe ìṣe náà.
theological_decisions:
- issue: Ẹni tí ó pa ìṣúdúdú òkùnkùn mọ́ gẹ́gẹ́ bí ìdájọ́
  choice: A lo ọ̀nà aláìdárúkọ olùṣe pé “a ti pa mọ́ de wọn.”
  alternative: Kí a fi “Ọlọ́run” kún un gẹ́gẹ́ bí olùṣe.
  rationale: Giriki tọ́ka sí ìdájọ́ Ọlọ́run nípasẹ̀ passive, ṣùgbọ́n kò dárúkọ Ọlọ́run ní gbangba. Ìtumọ̀ náà kò fi ohun tí orísun kò sọ kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye. A lo “kùrukùru” dípò “ìkùukùu” nínú ẹsẹ̀ láti dúró mọ́ ìtumọ̀ Giriki ní pẹkipẹki; àṣàyàn tí ó gbòòrò sí i wà nínú àlàyé ìsàlẹ̀. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
