  terminology: “Ìfẹ́kúfẹ̀ẹ́ ti ara” pa àwòrán σάρξ mọ́ láì sọ ọ́ di ẹ̀kọ́ ìsìn kan. “Ìwà àìníjàánu” fún ἀσελγείαις dára ju “ìwà wọ̀bìà” lọ nítorí ó ní ìtumọ̀ ìwà àìní ìdádúró/ìtìjú, kì í sì fi ọ̀rọ̀ náà mọ́ ìbálòpọ̀ nìkan.
