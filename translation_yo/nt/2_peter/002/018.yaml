source:
  edition: SBLGNT
  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: yo
  text: Nítorí pé, bí wọ́n ti ń sọ àwọn ọ̀rọ̀ ìfọ́nnu ńláńlá tí kò ní nǹkan[a], wọ́n ń fi ìfẹ́kúfẹ̀ẹ́ ti ara[b] àti ìwà àìníjàánu[d] tàn àwọn tí wọ́n ń ṣòro láti bọ́ lọ́wọ́ àwọn tí ń gbé nínú ìṣìnà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọ̀rọ̀ ìfọ́nnu asán.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìfẹ́kúfẹ̀ẹ́ ti ẹran ara”; a lo “ara” níbí gẹ́gẹ́ bí àkàwé nípa ìwà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn tí wọ́n ṣẹ̀ṣẹ̀ ń bọ́ lọ́wọ́”; ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ pé àsálà wọn kò tíì fẹsẹ̀ múlẹ̀ tàbí pé wọ́n ṣẹ̀ṣẹ̀ bẹ̀rẹ̀ sí í bọ́.
    reason: alternative_reading
  - marker: d
    text: Tàbí, “wọ́n ń fi ìfẹ́kúfẹ̀ẹ́ ti ara tàn wọ́n, wọ́n sì ń fi ìwà àìníjàánu ṣe bẹ́ẹ̀.”
    reason: previous_rendering
lexical_decisions:
- source_word: ὑπέρογκα … ματαιότητος
  choice: àwọn ọ̀rọ̀ ńláńlá tí ó ṣófo
  rationale: Ó mú àwòrán ọ̀rọ̀ tí a ti fẹ́ sókè ju bó ṣe yẹ lọ, tí kò sì ní èròjà gidi, wá sínú Yorùbá àdánidá; fífi “ọ̀rọ̀” kún un bá iṣẹ́ φθεγγόμενοι mu.
- source_word: φθεγγόμενοι
  choice: bí wọ́n ti ń sọ
  rationale: Ó fi participle náà hàn gẹ́gẹ́ bí ọ̀nà tí wọ́n gbà ń tàn àwọn ènìyàn, ó sì jẹ́ Yorùbá òde òní tó ṣe kedere.
- source_word: δελεάζουσιν
  choice: wọ́n ń … tàn
  rationale: “Tàn” lè sọ ìfàmọ́ra ẹlẹ́tan tí ó wà nínú ọ̀rọ̀ Gíríìkì náà láì fi ẹ̀kọ́ mìíràn kún un.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: wọ́n ń fi ìfẹ́kúfẹ̀ẹ́ ti ara
  rationale: “Fi” mú ipa ἐν gẹ́gẹ́ bí ohun èlò tàbí ọ̀nà hàn; “ti ara” pa àkàwé σάρξ mọ́ láì túmọ̀ ọ́ sí “ìwà ẹ̀ṣẹ̀” ní tààrà.
- source_word: ἀσελγείαις
  choice: ìwà wọ̀bìà
  rationale: Ó tọ́ka sí ìwà ìfẹ́kúfẹ̀ẹ́ tí kò ní ìjánu tàbí ìtìjú, ní èdè tí òǹkàwé Yorùbá òde òní lè lóye.
- source_word: ὀλίγως ἀποφεύγοντας
  choice: àwọn tí wọ́n kàn ṣẹ̀ṣẹ̀ ń yọ́ lọ́wọ́
  rationale: Ó pa ìtumọ̀ pé àsálà wọn ṣẹ̀ṣẹ̀ bẹ̀rẹ̀, ó sì ṣì wà nínú ewu, mọ́; “ń yọ́” tún fi ìṣe tí ń lọ lọ́wọ́ hàn.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: àwọn tí ń gbé nínú ìṣìnà
  rationale: Ó fi ìṣìnà hàn gẹ́gẹ́ bí ọ̀nà ìgbésí ayé wọn, kì í ṣe àṣìṣe kan ṣoṣo.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ọ̀rọ̀ ìwà
  choice: ti ara
  alternative: ti ẹran ara; ti ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: “Ti ara” pa àkàwé Gíríìkì mọ́, ó sì yẹra fún fífi ẹ̀kọ́ ìsìn tí ó ti túmọ̀ ọ̀rọ̀ náà jù sí i sínú ẹsẹ̀ náà.
- issue: Àwọn tí a ń tàn àti bí àsálà wọn ṣe rí
  choice: àwọn tí wọ́n kàn ṣẹ̀ṣẹ̀ ń yọ́ lọ́wọ́ àwọn tí ń gbé nínú ìṣìnà
  alternative: àwọn tí wọ́n ti yọ́ ní tòótọ́; àwọn tí ń sá kúrò nínú ìṣìnà fúnra rẹ̀
  rationale: Èyí tẹ̀ lé ìsopọ̀ gírámà tó ṣeé ṣe jù, ó sì pa àìdánilójú àti ewu inú ὀλίγως mọ́ láì pinnu bóyá àsálà náà ti pé ní ti ẹ̀mí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá jẹ́ àdánidá, a sì pa ìṣọ̀kan gbolohun Gíríìkì àti ìdàrúdàpọ̀ tó wà nínú ὀλίγως mọ́.
