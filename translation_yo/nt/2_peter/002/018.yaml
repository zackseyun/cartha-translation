  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé èrò gíga ẹsẹ̀ náà dáadáa: ọ̀rọ̀ asán tí a fẹ́ sókè, ìtànjẹ nípasẹ̀ ìfẹ́kúfẹ̀ẹ́ ti ara àti ìwà tí kò ní ìjánu, àti àwọn ẹni tí ń bọ́ lọ́wọ́ àwọn tí ń gbé nínú ìṣìnà. Síbẹ̀, “kàn ṣẹ̀ṣẹ̀” yan ìtumọ̀ ‘just now’ ní kíkún dípò kí ó pa ìmọ̀ ‘barely/scarcely’ ti ὀλίγως mọ́. “Ìwà wọ̀bìà” kò ṣe kedere tó, ó sì lè hàn bí ọ̀rọ̀ àgbègbè fún àwọn òǹkàwé kan.'
