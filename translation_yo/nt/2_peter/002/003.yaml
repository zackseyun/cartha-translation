id: 2PE.2.3
reference: 2 Peter 2:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: yo
  text: Nínú ojúkòkòrò, wọn yóò fi ọ̀rọ̀ àròsọ lò yín fún èrè.[a] Ìdájọ́ wọn láti ìgbà pípẹ́ kò dúró láìṣiṣẹ́, ìparun wọn kò sì sùn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn yóò ṣe ọjà yín.” Ọ̀rọ̀ Gíríìkì náà lo àwòrán òwò fún ṣíṣe èrè nípa àwọn ènìyàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: Nítorí ojúkòkòrò
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ojúkòkòrò tàbí ìfẹ́ láti jèrè ohun sí i; nínú àyíká yìí ó ṣàlàyé ohun tó ń mú àwọn olùkọ́ èké ṣe bẹ́ẹ̀.
- source_word: πλαστοῖς λόγοις
  choice: fi ọ̀rọ̀ tí wọ́n hùmọ̀
  rationale: πλαστός túmọ̀ sí ohun tí a mọ̀ọ́mọ̀ dá tàbí hùmọ̀; gbólóhùn yìí fi hàn pé ọ̀rọ̀ wọn jẹ́ ète tí wọ́n ṣètò, kì í ṣe àṣìṣe lásán.
- source_word: ἐμπορεύσονται
  choice: jẹ yín lógún
  rationale: Èyí jẹ́ àwòrán ọjà tí ó túmọ̀ sí lílo àwọn ènìyàn fún èrè ara ẹni. ‘Jẹ yín lógún’ jẹ́ Yorùbá àdánidá tó sọ ìfi-ni-jẹ náà di mímọ̀, bó tilẹ̀ jẹ́ pé àwòrán ọjà kò hàn ní tààrà.
- source_word: κρίμα
  choice: ìdájọ́
  rationale: ‘Ìdájọ́’ pa ìtumọ̀ òfin àti ìpinnu ìdájọ́ mọ́ láì fi kún un pé ẹ̀bi tàbí irú ìyà kan pàtó ni.
- source_word: ἔκπαλαι
  choice: láti ìgbà pípẹ́
  rationale: Ó pa agbára àkókò mọ́ pé a ti pinnu ìdájọ́ náà tipẹ́tipẹ́.
- source_word: οὐκ ἀργεῖ
  choice: kò jókòó lásán
  rationale: Gbólóhùn yìí pa àwòrán ohun tí kò ṣe aláìṣiṣẹ́ mọ́, dípò yíyí i padà sí ‘kò pẹ́’ nìkan.
- source_word: ἀπώλεια
  choice: ìparun
  rationale: ‘Ìparun’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìbàjẹ́ tàbí ìrunlù tí ἀπώλεια ń tọ́ka sí, láì pinnu bí ìyà náà ṣe máa rí nípa ẹ̀kọ́ ìgbàgbọ́.
- source_word: οὐ νυστάζει
  choice: kò sùn
  rationale: Ó pa àkàwé ẹni tí oorun kò gbà mọ́, ó sì fi ìdánilójú dídé ìparun náà hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Irú ìyà tí a kéde
  choice: Túmọ̀ ọ́ gẹ́gẹ́ bí ìdájọ́ àti ìparun tó dájú, láì ṣàlàyé bí ìyà náà ṣe máa rí tàbí bí yóò ṣe pẹ́.
  alternative: Ka ‘ìparun’ sí ìparẹ́ pátápátá, tàbí sí ìbàjẹ́ lásán tí kì í ṣe ìdájọ́ ìkẹyìn.
  rationale: Ẹsẹ̀ náà kéde ìdájọ́ tó dájú fún àwọn olùkọ́ èké, ṣùgbọ́n kò ṣàlàyé ìlànà tàbí iye àkókò ìyà náà; ìtumọ̀ náà kò gbé ẹ̀kọ́ ìsìn kan wọ ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó níyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘jẹ yín lógún’ láti sọ ìlòkulò fún èrè ní ọ̀nà tí ó yé àwọn òǹkàwé lónìí.
