  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: yo
  text: ní pàtàkì àwọn tí ń tọ ẹran ara lẹ́yìn nínú ìfẹ́kúfẹ̀ẹ́ fún ìwà ẹlẹ́gbin[a], tí wọ́n sì ń kẹ́gàn ọlá-àṣẹ[b]. Wọ́n jẹ́ aláfojúdi, olóríkunkun; Wọ́n kò wárìrì bí wọ́n ti ń sọ̀rọ̀-òdì sí àwọn ológo[c][d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìfẹ́kúfẹ̀ẹ́ fún ìwà àìmọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ipò olúwa” tàbí “agbára ìṣàkóso.”
    reason: lexical_alternative
  - marker: c
    text: Ó ṣeé ṣe kí “àwọn ológo” tọ́ka sí àwọn ẹ̀dá ọ̀run ológo; ó sì lè túmọ̀ sí “àwọn áńgẹ́lì.”
    reason: alternative_reading
  - marker: d
    text: Tàbí, “wọn kò bẹ̀rù láti sọ̀rọ̀-òdì sí àwọn ológo.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: ní pàtàkì
  rationale: Ó fi ìtẹnumọ́ pàtàkì hàn láàárín àwọn tí ìdájọ́ tí ẹsẹ tó ṣáájú ń sọ̀rọ̀ nípa wọn.
- source_word: ὀπίσω σαρκὸς
  choice: ń tọ ẹran ara lẹ́yìn
  rationale: Ó pa àwòrán Gíríìkì náà mọ́, ó sì yẹra fún ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ‘ìwà ẹlẹ́ṣẹ̀’ nìkan.
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: nínú ìfẹ́kúfẹ̀ẹ́ fún ìwà ẹlẹ́gbin
  rationale: ‘Ìfẹ́kúfẹ̀ẹ́’ fi ìfẹ́ tí kò bófin mu hàn, ‘ìwà ẹlẹ́gbin’ sì mú agbára ìbàjẹ́ àti àìmọ́ ti μιασμός jáde ní èdè Yorùbá adayeba.
- source_word: πορευομένους
  choice: àwọn tí ń tọ … lẹ́yìn
  rationale: Pẹ̀lú ὀπίσω, gbólóhùn yìí túmọ̀ sí títẹ̀lé ohun kan gẹ́gẹ́ bí ọ̀nà ìgbésí ayé.
- source_word: κυριότητος
  choice: ọlá-àṣẹ
  rationale: Ó lè tọ́ka sí ipò olúwa tàbí agbára ìṣàkóso; ‘ọlá-àṣẹ’ jẹ́ kíkà tí ó ṣe kedere láì sọ ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ní pàtó.
- source_word: καταφρονοῦντας
  choice: ń kẹ́gàn
  rationale: Ó fi ẹ̀gàn líle àti àìbọ̀wọ̀ hàn.
- source_word: Τολμηταί
  choice: aláfojúdi
  rationale: Nínú àyíká búburú yìí, ọ̀rọ̀ náà kọjá ìgboyà rere, ó sì fi ìgbéraga tí kò bẹ̀rù hàn.
- source_word: αὐθάδεις
  choice: olóríkunkun
  rationale: Ó ṣàpèjúwe ẹni tí ó ń tẹ̀lé ìfẹ́ ara rẹ̀, tí kò sì fẹ́ gba ìtọ́nisọ́nà.
- source_word: δόξας
  choice: àwọn ológo
  rationale: Ó pa àìdánilójú ọ̀rọ̀ ọ̀pọ̀ náà mọ́, láì sọ ní pàtó pé àwọn áńgẹ́lì ni.
- source_word: οὐ τρέμουσιν
  choice: wọn kò wárìrì
  rationale: Ó pa àwòrán ìbẹ̀rù tó ń mú ara gbọ̀n mọ́.
- source_word: βλασφημοῦντες
  choice: bí wọ́n ti ń sọ̀rọ̀-òdì sí
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí ọ̀rọ̀ ẹ̀gàn tàbí ọ̀rọ̀ ìbàjẹ́ sí àwọn ẹni ológo; àpólà aláìpé náà fi hàn pé ó ń ṣẹlẹ̀ pẹ̀lú àìwárìrì wọn.
theological_decisions:
- issue: Ohun tí κυριότητος ń tọ́ka sí
  choice: ọlá-àṣẹ ní ìtumọ̀ gbòòrò
  alternative: ipò Olúwa ti Kristi, tàbí agbára ìṣàkóso àwọn ẹ̀dá ọ̀run
  rationale: Ẹsẹ yìí kò sọ ẹni tí ó ni ọlá-àṣẹ náà ní pàtó; nítorí náà, a pa àìdánilójú náà mọ́, a kò sì fi ẹ̀kọ́ ìjọ kan lé e lórí.
- issue: Àwọn tí δόξας ń tọ́ka sí
  choice: àwọn ẹni ológo tí a kò dárúkọ ní pàtó
  alternative: àwọn áńgẹ́lì tàbí àwọn ẹ̀dá ọ̀run ológo
  rationale: Ẹsẹ tó tẹ̀lé mẹ́nu kan àwọn áńgẹ́lì, ṣùgbọ́n δόξας fúnra rẹ̀ kò sọ ìdánimọ̀ wọn ní tààrà; ‘àwọn ológo’ pa ìyẹn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye. A lo ‘ẹran ara’ láti pa àwòrán σάρξ mọ́; ‘aláfojúdi, olóríkunkun’ sì pa ìlù gbolohun kúkúrú ti Gíríìkì mọ́. Gbogbo àmì ìsàlẹ̀-ìwé [a]–[d] wà nínú ọ̀rọ̀ pàtàkì.
