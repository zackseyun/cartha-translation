  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà mú ọ̀pọ̀ èrò orísun Gíríìkì náà dáadáa: Ọlọ́run kò dá àwọn áńgẹ́lì sí, ó sọ wọ́n sínú Tátárọ́sì, wọ́n sì wà ní ìdádúró de ìdájọ́. Ṣùgbọ́n "bí Ọlọ́run kò bá dá" lo ìrísí ìṣèjọba tí kò yẹ níbí; Gíríìkì náà jẹ́ ìṣàpẹẹrẹ ìpèníjà pẹ̀lú aorist itọ́kasí, nítorí náà "bí Ọlọ́run kò dá" dára. Pẹ̀lú ìyẹn, "fi wọ́n lé àwọn ẹ̀wọ̀n ... lọ́wọ́" sọ ẹ̀wọ̀n di ẹni tí a lè fi ẹnì kan lé lọ́wọ́, èyí tí kò dáa ní Yorùbá. "Fi wọ́n sí ẹ̀wọ̀n" pa èrò παραδίδωμι mọ́ ní ọ̀nà adayeba.'
  naturalness: Àtúnṣe náà ń lo Yorùbá boṣewa tí ó ṣàn dáadáa. "kí a máa pa wọ́n mọ́ títí di ìdájọ́" ṣàfihàn ìpamọ́/ìhámọ́ tí ó ń bá a lọ nínú τηρουμένους, ó sì yàgò fún "de ìdájọ́," èyí tí kò rọrùn bí "títí di ìdájọ́."
  terminology: '"Tátárọ́sì" jẹ́ ìpinnu tó tọ́ fún ταρταρώσας, ó sì yẹ kí a má ṣe rọ́pò rẹ̀ pẹ̀lú "ọ̀run àpáàdì." "ẹ̀wọ̀n òkùnkùn biribiri" ń pa σειραῖς ζόφου mọ́, bí ó tilẹ̀ jẹ́ pé ìwé àfọwọ́kọ kan ní ìyàtọ̀ "ihò."'
