id: 2PE.2.4
reference: 2 Peter 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: yo
  text: Nítorí bí Ọlọ́run kò dá àwọn áńgẹ́lì sí nígbà tí wọ́n ṣẹ̀[a], ṣùgbọ́n tí ó sọ wọ́n sínú Tátárọ́sì, tí ó sì fi wọ́n sí ẹ̀wọ̀n òkùnkùn biribiri, kí a máa pa wọ́n mọ́ títí di ìdájọ́[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “àwọn áńgẹ́lì tí wọ́n ṣẹ̀.”'
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan ní “ihò òkùnkùn biribiri” dípò “ẹ̀wọ̀n òkùnkùn biribiri.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: kò dá … sí
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ pé Ọlọ́run kò yọ wọ́n kúrò nínú ìjìyà tàbí dá wọn sí nítorí àánú.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: àwọn áńgẹ́lì … nígbà tí wọ́n ṣẹ̀
  rationale: Ó tú ìṣe aláìpé aorist náà jáde gẹ́gẹ́ bí ìṣẹ̀lẹ̀ tó ṣẹlẹ̀, ó sì bá ìtumọ̀ ìgbà mu láìsọ pé gbolohun náà ní ìtumọ̀ kan ṣoṣo.
- source_word: ταρταρώσας
  choice: sọ wọ́n sínú Tátárọ́sì
  rationale: Ó pa àkànṣe àwòrán inú ọ̀rọ̀ Gíríìkì ταρταρόω mọ́, dípò kí a fi ọ̀rọ̀ gbogbogbò bí ‘ọ̀run àpáàdì’ rọ́pò rẹ̀.
- source_word: σειραῖς ζόφου
  choice: àwọn ẹ̀wọ̀n òkùnkùn biribiri
  rationale: ‘Ẹ̀wọ̀n’ dúró fún σειραί, ‘òkùnkùn biribiri’ sì fi ìmọ̀lára òkùnkùn tó nípọn, tó ń bani lẹ́rù, tí ζόφος ní hàn.
- source_word: παρέδωκεν
  choice: fi wọ́n lé … lọ́wọ́
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún fífi ẹni lé àbójútó tàbí àhámọ́ lọ́wọ́ ní ọ̀rọ̀ ìdájọ́.
- source_word: εἰς κρίσιν
  choice: de ìdájọ́
  rationale: Ó tọ́ka sí ìdájọ́ tó ń bọ̀, kì í ṣe dandan sí ìdálẹ́bi nìkan.
- source_word: τηρουμένους
  choice: láti máa pa wọ́n mọ́
  rationale: ‘Máa pa … mọ́’ fi ipò àhámọ́ tó ń bá a lọ hàn, nígbà tí ‘láti’ so ó mọ́ ìdí tàbí àbájáde fífi wọ́n lé ẹ̀wọ̀n lọ́wọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ ταρταρώσας láìfi ẹ̀kọ́ ìgbà tó tẹ̀ lé e kún ọ̀rọ̀ Gíríìkì
  choice: sọ wọ́n sínú Tátárọ́sì
  alternative: sọ wọ́n sínú ọ̀run àpáàdì
  rationale: Ọ̀rọ̀-ìṣe Gíríìkì náà tọ́ka pàtó sí Tátárọ́sì. Dídá orúkọ náà dúró ń pa àwòrán àti àkànṣe orísun mọ́, kò sì sọ ọ́ di èrò ẹ̀kọ́ tó gbòòrò ju ohun tí ọ̀rọ̀ náà sọ lọ.
- issue: Ìbáṣepọ̀ ‘ẹ̀wọ̀n òkùnkùn’ pẹ̀lú Tátárọ́sì àti τηρουμένους
  choice: tí ó sì fi wọ́n lé àwọn ẹ̀wọ̀n òkùnkùn biribiri lọ́wọ́, láti máa pa wọ́n mọ́ de ìdájọ́
  alternative: tí ó sì sọ wọ́n sínú Tátárọ́sì nínú ẹ̀wọ̀n òkùnkùn biribiri, kí a lè pa wọ́n mọ́ de ìdájọ́
  rationale: Àṣàyàn náà pa gbogbo apá gbolohun Gíríìkì mọ́ láìpinnu bóyá ẹ̀wọ̀n náà jẹ́ ohun èlò, ibi, tàbí àpẹẹrẹ; ó sì fi hàn pé wọ́n wà ní àhámọ́ de ìdájọ́.
translation_notes:
  register: Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣeé lóye. A lo àmì ohùn ní kíkún níbi tó bá yẹ, a sì kọ ‘Tátárọ́sì’ gẹ́gẹ́ bí àkọsílẹ̀ ohùn Yorùbá fún orúkọ àkànṣe náà. Gbolohun náà parí pẹ̀lú àmì kọ́mà nítorí pé ẹsẹ yìí jẹ́ apá àkọ́kọ́ ti gbolohun ‘bí …’ tó ń bá a lọ.
