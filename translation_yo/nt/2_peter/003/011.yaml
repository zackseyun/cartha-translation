id: 2PE.3.11
reference: 2 Peter 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: yo
  text: Níwọ̀n bí gbogbo nǹkan wọ̀nyí tí ń tú ká lọ́nà yìí[a], irú ènìyàn wo ni ó yẹ kí ẹ jẹ́ nínú ìwà mímọ́ àti ìfọkànsìn sí Ọlọ́run,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a ń tú sílẹ̀ lọ́nà yìí.” Ọ̀rọ̀ Gíríìkì náà ń sọ nípa ohun tí a ń tú ká tàbí tú sílẹ̀; nínú àyíká yìí, ó ń tọ́ka sí ìtúká ètò ayé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: gbogbo nǹkan wọ̀nyí
  rationale: Gbólóhùn náà ń tọ́ka sí gbogbo ohun tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú; fífi “nǹkan” kún un jẹ́ Yorùbá àdánidá láì fi ìtumọ̀ míì lé e lórí.
- source_word: οὕτως
  choice: lọ́nà yìí
  rationale: Ó ṣàlàyé ọ̀nà tí ìtúká náà yóò gbà ṣẹlẹ̀, ó sì ṣe kedere ju “bẹ́ẹ̀” lọ nínú àyíká yìí.
- source_word: λυομένων
  choice: ti ń tú ká
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yíyan ohun tú, ṣíṣe é di èyí tí kò so pọ̀ mọ́, tàbí tú u ká. Àṣàyàn yìí pa àwòrán ìtúká mọ́, kò sì mú un le sí “parun” láìnídí.
- source_word: ποταποὺς
  choice: irú ènìyàn wo
  rationale: Ìbéèrè àsọyé náà ń béèrè nípa irú tàbí ànímọ́ àwọn ènìyàn tí ó yẹ kí àwọn olùgbọ́ jẹ́.
- source_word: δεῖ ὑπάρχειν ὑμᾶς
  choice: ni ó yẹ kí ẹ jẹ́
  rationale: Èyí fi dandan ìwà rere hàn ní Yorùbá àdánidá, láì sọ ọ́ di àṣẹ líle ju bí Gíríìkì ṣe sọ ọ́ lọ.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: nínú ìwà híhù mímọ́
  rationale: ἀναστροφή ń tọ́ka sí ìwà híhù tàbí ọ̀nà ìgbésí ayé. Yorùbá lè lo ọ̀rọ̀ àkójọpọ̀ ẹyọ kan níbi tí Gíríìkì ti lo ọ̀pọ̀.
- source_word: εὐσεβείαις
  choice: ìfọkànsìn Ọlọ́run
  rationale: Èyí sọ ìbọ̀wọ̀ àti ìfọkànsìn tí a ń fi hàn sí Ọlọ́run nínú ìgbésí ayé ní èdè Yorùbá tí ó ṣe kedere, tí kò sì gbẹ́kẹ̀ lé ọ̀rọ̀ ẹ̀sìn àkànṣe.
theological_decisions:
- issue: Àpèjúwe ohun tí yóò ṣẹlẹ̀ sí ètò ayé ní ìkẹyìn
  choice: ti ń tú ká
  alternative: tí a ń parun
  rationale: λύω fúnra rẹ̀ ní àwòrán yíyan ohun tú tàbí títú u ká. A kò mú un le sí ìparun pátápátá, bẹ́ẹ̀ ni a pa ìrísí àsìkò ìsinsìnyí inú participle Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé àyíká ń sọ nípa ohun ọjọ́ iwájú.
translation_notes:
  register: A lo Yorùbá ọ̀wọ̀, òde òní, tó sì rọrùn fún gbogbo ènìyàn láti lóye. “Ìwà híhù mímọ́” àti “ìfọkànsìn Ọlọ́run” jẹ́ àwọn gbólóhùn àkójọpọ̀ tó dúró fún ọ̀pọ̀ Gíríìkì. A fi àmì ìbéèrè sí òpin nítorí pé ποταποὺς dá ìbéèrè àsọyé sílẹ̀, bí ó tilẹ̀ jẹ́ pé ìrònú náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
