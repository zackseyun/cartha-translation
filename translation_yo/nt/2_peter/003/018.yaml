  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: àṣẹ ọ̀pọ̀ ènìyàn tí ń tẹ̀síwájú, ‘oore-ọ̀fẹ́ àti ìmọ̀,’ àti ìtọ́kasí àwọn oyè méjèèjì sí Jésù ẹni kan náà ni a ti pa mọ́. ‘Títí dé ọjọ́ ayérayé’ tún dá ἡμέραν αἰῶνος dúró láìdín kù sí ‘láéláé’ nìkan.'
