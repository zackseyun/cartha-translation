  terminology: ‘Oore-ọ̀fẹ́,’ ‘Olúwa,’ ‘Olùgbàlà,’ àti ‘Mèsáyà’ jẹ́ àwọn ọ̀rọ̀ tó yẹ fún ìforúkọsílẹ̀ Bíbélì ọlọ́lá. Àlàyé ìsàlẹ̀ (a) ń pa àṣàyàn ìbílẹ̀ ‘Jésù Kristi’ mọ́. Àlàyé (b) nilo kí a rọ́pò ‘Ní ṣókí gan-an,’ tí ó túmọ̀ sí ‘concisely,’ pẹ̀lú ọ̀rọ̀ tó tọ́ka sí ìtumọ̀ gígùn ọrọ̀-ìpilẹ̀.
