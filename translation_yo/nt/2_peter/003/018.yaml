id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ máa dàgbà nínú oore-ọ̀fẹ́ àti ìmọ̀ Olúwa àti Olùgbàlà wa, Jésù Mèsáyà[a]. Ògo ni ti òun, ní ìsinsìnyí àti títí dé ọjọ́ ayérayé[b]. Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí ìlò ìbílẹ̀, “Jésù Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí “ní ìsinsìnyí àti láéláé.” Ní ìtumọ̀ tí ó sún mọ́ ọ̀rọ̀ Gíríìkì gan-an, ó ní “ní ìsinsìnyí àti títí dé ọjọ́ ayérayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: ẹ máa dàgbà
  rationale: Ọ̀rọ̀ àṣẹ yìí wà ní àkókò ìsinsìnyí, ó sì ń bá ọ̀pọ̀ ènìyàn sọ̀rọ̀; ‘ẹ máa dàgbà’ fi ìtẹ̀síwájú tí kò dáwọ́ dúró hàn lọ́nà Yorùbá àdánidá.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ hàn sí ìkìlọ̀ àti ìṣílétí tó ṣáájú.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: nínú oore-ọ̀fẹ́ àti ìmọ̀
  rationale: ‘Nínú’ ń ṣàfihàn ἐν gẹ́gẹ́ bí àyè tàbí ipò tí ìdàgbàsókè ti ń ṣẹlẹ̀, ó sì kan àwọn ọ̀rọ̀ méjèèjì.
- source_word: χάριτι
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún χάρις ní ìtumọ̀ oore tí a fi fúnni láìtọ́ sí i.
- source_word: γνώσει
  choice: ìmọ̀
  rationale: Ó pa ìtumọ̀ ìmọ̀ mọ́ láìfi ìtumọ̀ àlàyé bí ‘òye jíjinlẹ̀’ kún un.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: Olúwa àti Olùgbàlà wa, Jesu Mèsáyà
  rationale: Àpilẹ̀kọ Gíríìkì kan ṣoṣo so ‘Olúwa’ àti ‘Olùgbàlà’ mọ́ ẹni kan náà, Jesu; ‘Mèsáyà’ túmọ̀ Χριστός gẹ́gẹ́ bí oyè.
- source_word: αὐτῷ ἡ δόξα
  choice: Òun ni kí ògo jẹ́ tirẹ̀
  rationale: Èyí jẹ́ ọ̀nà Yorùbá ọlọ́lá àti àdánidá láti sọ ìyìn doxology tí kò ní ọ̀rọ̀-ìṣe gbangba nínú Gíríìkì.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: ní ìsinsìnyí àti títí dé ọjọ́ ayérayé
  rationale: Ó pa ‘ní ìsinsìnyí’ àti ‘ọjọ́’ mọ́, ó sì tú εἰς ní ‘títí dé’; ‘ayérayé’ ṣàfihàn αἰῶνος láìsọ gbólóhùn àrà ọ̀tọ̀ náà di ‘láéláé’ nìkan.
- source_word: ἀμήν
  choice: Àmín
  rationale: Àkọsílẹ̀ Yorùbá tí ó ti fìdí múlẹ̀ fún ọ̀rọ̀ ìparí ìjẹ́rìí yìí.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  alternative: Jesu Kristi
  rationale: Χριστός jẹ́ oyè níbí; ‘Mèsáyà’ sọ ìtumọ̀ oyè náà jáde, nígbà tí àṣàyàn ìbílẹ̀ ‘Kristi’ wà nínú àlàyé ìsàlẹ̀.
- issue: Ẹni tí ‘Olúwa àti Olùgbàlà wa’ ń tọ́ka sí
  choice: Àwọn oyè méjèèjì tọ́ka sí ẹni kan náà, Jesu Mèsáyà
  alternative: Ṣíṣe gbólóhùn náà lọ́nà tí ìbá fi ẹni tí oyè kọ̀ọ̀kan ń tọ́ka sí sílẹ̀ ní àìṣe kedere
  rationale: Àpilẹ̀kọ kan ṣoṣo tó ń darí κύριος àti σωτήρ nínú Gíríìkì fi hàn pé ẹni kan náà ni àwọn oyè méjèèjì ń tọ́ka sí.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ’ nítorí àṣẹ náà jẹ́ ọ̀pọ̀; a sì fi àmì ohùn sí ibi tí ó bá ìlò Yorùbá àdánidá mu.
