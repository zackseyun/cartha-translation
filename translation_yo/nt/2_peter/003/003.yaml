  text: τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ⸀ἐσχάτων τῶν ἡμερῶν ⸂ἐν ἐμπαιγμονῇ⸃ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: yo
  text: 'Ẹ mọ̀ èyí lákọ̀ọ́kọ́: pé ní àwọn ọjọ́ ìkẹyìn, àwọn ẹlẹ́gàn yóò wá pẹ̀lú ẹ̀gàn[a], tí wọ́n ń rìn gẹ́gẹ́ bí àwọn ìfẹ́kúfẹ̀ẹ́ tiwọn[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ rẹ̀ sí “àwọn olùyọ̀ṣùtì yóò wá ní yíyọ̀ṣùtì.” Ọ̀rọ̀ Gíríìkì náà lo àwọn ọ̀rọ̀ tó ní gbòǹgbò kan náà láti tẹnu mọ́ ọn: “ẹlẹ́gàn” àti “ẹ̀gàn.”'
    reason: lexical_alternative
  - marker: b
    text: “Ìfẹ́kúfẹ̀ẹ́” tún lè jẹ́ “ìfẹ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ohun tí ènìyàn ń fẹ́ gidigidi ní ìtumọ̀ tó gbòòrò, kì í ṣe ìfẹ́ ìbálòpọ̀ nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Ẹ mọ èyí lákọ̀ọ́kọ́
  rationale: Èyí sọ ìtumọ̀ pé kí àwọn olùgbọ́ fi ọ̀rọ̀ yìí sí ipò pàtàkì, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti gbé ọ̀rọ̀ náà kalẹ̀. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ participle, nínú àyíká gbólóhùn náà ó ń bá ìkìlọ̀ tààrà sí àwọn olùgbọ́ lọ.
- source_word: ἐλεύσονται
  choice: yóò wá
  rationale: Ó pa ìtumọ̀ ọjọ́ iwájú ti ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: ní àwọn ọjọ́ ìkẹyìn
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere fún gbólóhùn àkókò ìkẹyìn náà, láìfi ètò ẹ̀kọ́ ìgbà ìkẹyìn kan pàtó kún un.
- source_word: ἐν ἐμπαιγμονῇ … ἐμπαῖκται
  choice: àwọn ẹlẹ́gàn … pẹ̀lú ẹ̀gàn
  rationale: A pa ìbátan gbòǹgbò ọ̀rọ̀ àti ìtẹnumọ́ inú Gíríìkì mọ́ nípa lílo “ẹlẹ́gàn” àti “ẹ̀gàn,” bó tilẹ̀ jẹ́ pé àtúnlò yìí mọ̀ọ́mọ̀ ní agbára.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: ní ìbámu pẹ̀lú àwọn ìfẹ́ ara wọn
  rationale: “Ìfẹ́” pa ìtumọ̀ tó gbòòrò ti ἐπιθυμία mọ́, nígbà tí “ara wọn” fi ìtẹnumọ́ ìní ti ἰδίας αὐτῶν hàn. Àyíká ọ̀rọ̀ náà mú kí ìfẹ́ wọ̀nyí jẹ́ ti ìwà búburú láìdín wọn kù sí ìfẹ́ ìbálòpọ̀ nìkan.
- source_word: πορευόμενοι
  choice: wọn yóò sì máa rìn
  rationale: “Rìn” pa àwòrán ọ̀nà ìgbésí ayé inú Gíríìkì mọ́; “máa” sì fi hàn pé ìṣe tàbí ìwà tí ń bá a lọ ni.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn ἐπ’ ἐσχάτων τῶν ἡμερῶν nípa ìgbà ìkẹyìn
  choice: ní àwọn ọjọ́ ìkẹyìn
  alternative: ní òpin àwọn ọjọ́
  rationale: A lo gbólóhùn àṣà tí ó pa ìkìlọ̀ nípa ìgbà ìkẹyìn mọ́, ṣùgbọ́n a kò sọ pé ó tọ́ka sí ètò ẹgbẹ́ ìjọ kan tàbí àlàyé ẹgbẹ̀rún ọdún kan pàtó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A pa àwòrán “rìn” àti àtúnlò “ẹlẹ́gàn/ẹ̀gàn” mọ́ nítorí wọ́n jẹ́ apá pàtàkì nínú ìṣètò ọ̀rọ̀ Gíríìkì.
