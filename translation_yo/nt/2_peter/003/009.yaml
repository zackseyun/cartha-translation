id: 2PE.3.9
reference: 2 Peter 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: yo
  text: Olúwa kò lọ́ra nípa ìlérí náà, gẹ́gẹ́ bí àwọn kan ti ń ka a sí ìlọ́ra; ṣùgbọ́n ó ń mú sùúrù fún yín[b][c], nítorí kò fẹ́ kí ẹnikẹ́ni ṣègbé, bí kò ṣe kí gbogbo ènìyàn wá sí ìrònúpìwàdà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí gbogbo ènìyàn dé inú ìrònúpìwàdà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ń mú sùúrù pẹ̀lú yín.”
    reason: lexical_alternative
  - marker: c
    text: A fi ìwọ̀n “ẹnikẹ́ni” àti “gbogbo ènìyàn” sílẹ̀ gẹ́gẹ́ bí Gíríìkì ṣe sọ ọ́. Àwọn olùtumọ̀ yàtọ̀ lórí bóyá Pétérù ń tọ́ka sí àwọn òǹkàwé rẹ̀ ní pàtó tàbí sí aráyé ní ọ̀nà tó gbòòrò.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Olúwa
  rationale: Orúkọ oyè Ọlọ́run/Kristi ni àyíká ọ̀rọ̀ yìí; “Olúwa” ni ìtumọ̀ Yorùbá tó dúró ṣinṣin.
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: kò fi ìlérí náà falẹ̀
  rationale: Ó sọ pé Olúwa kò ṣe ohun tí ó ṣèlérí pẹ́ ju àkókò lọ; ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá ju ìtumọ̀ líle bí “kò lọ́ra nípa ìlérí” lọ.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: bí àwọn kan ṣe ka fífalẹ̀ sí
  rationale: “Ka ... sí” fi ìtumọ̀ ἡγέομαι hàn, “fífalẹ̀” sì tún ìtumọ̀ gbòǹgbò βραδ- ṣe láti pa àtúnṣe ọ̀rọ̀ Gíríìkì mọ́.
- source_word: μακροθυμεῖ
  choice: ó ń mú sùúrù
  rationale: Ó túmọ̀ sí fífaradà pẹ̀lú ìkóra-ẹni-níjàánu; ọ̀rọ̀ yìí jẹ́ ti òde òní, ó sì yé àwọn òǹkàwé lọ́nà rọrùn.
- source_word: εἰς ὑμᾶς
  choice: fún yín
  rationale: Nínú Yorùbá, “mú sùúrù fún yín” fi ìfaradà tí a darí sí àwọn olùgbà lẹ́tà hàn lọ́nà àdánidá; àlàyé ìsàlẹ̀ fún “sí yín” gẹ́gẹ́ bí ìtumọ̀ tó sún mọ́ preposition náà.
- source_word: μὴ βουλόμενός
  choice: kò fẹ́
  rationale: Ó pa èrò ìfẹ́ tàbí ìfẹ́-inú βούλομαι mọ́ láìfi èdè ẹ̀kọ́ ìsìn tó lágbára ju ọ̀rọ̀ náà lọ kún un.
- source_word: τινας ἀπολέσθαι
  choice: kí ẹnikẹ́ni ṣègbé
  rationale: “Ṣègbé” jẹ́ ọ̀rọ̀ Yorùbá tó ní ìwọ̀n tó yẹ fún píparun tàbí sísọnù nínú àyíká yìí.
- source_word: πάντας
  choice: gbogbo ènìyàn
  rationale: Yorùbá sábà máa ń nílò orúkọ lẹ́yìn “gbogbo”; “ènìyàn” jẹ́ àfikún gírámà tó ṣe kedere, kì í sì í pinnu àríyànjiyàn nípa bí ìtọ́kasí náà ṣe gbòòrò tó.
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: dé inú ìrònúpìwàdà
  rationale: “Dé inú” pa àwòrán ìṣípò χωρέω mọ́, “ìrònúpìwàdà” sì jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún μετάνοια.
theological_decisions:
- issue: Ìwọ̀n ìtọ́kasí “yín,” “ẹnikẹ́ni,” àti “gbogbo ènìyàn”
  choice: 'A fi wọn sílẹ̀ bí Gíríìkì ṣe sọ wọn: “fún yín ... ẹnikẹ́ni ... gbogbo ènìyàn.”'
  alternative: Dín “ẹnikẹ́ni” àti “gbogbo ènìyàn” kù sí àwọn olùgbàgbọ́/àwọn àyànfẹ́ nìkan, tàbí sọ ní pàtó pé gbogbo aráyé ni.
  rationale: Gíríìkì kò fi àlàyé ẹ̀kọ́ ìsìn kan pàtó sí ìwọ̀n wọn; ìtumọ̀ náà kò gbọ́dọ̀ dín wọn kù tàbí mú wọn gbòòrò ju ohun tí a kọ lọ.
- issue: Agbára βουλόμενός nínú ọ̀rọ̀ nípa ìfẹ́ Ọlọ́run
  choice: “kò fẹ́”
  alternative: “kò pinnu” tàbí ọ̀rọ̀ imọ̀-ẹ̀kọ́ bí “kò pàṣẹ tẹ́lẹ̀.”
  rationale: “Kò fẹ́” fi ìfẹ́-inú hàn láìyànjú ìyàtọ̀ àwọn ẹ̀ka ìfẹ́ Ọlọ́run tí ẹsẹ náà kò ṣàlàyé.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. A pa àtúnṣe ọ̀rọ̀ “falẹ̀/fífalẹ̀” mọ́, a sì yẹra fún èdè ẹ̀kọ́ ìsìn ẹgbẹ́ kan.
