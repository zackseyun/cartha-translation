  source_fidelity: 'Ìtumọ̀ náà mú ọ̀pọ̀ èrò Gíríìkì náà dáadáa wá: Olúwa, ìlérí, sùúrù sí àwọn olùgbọ́, àìfẹ́ kí ẹnikẹ́ni ṣègbé, àti ìrònúpìwàdà. Ṣùgbọ́n “kò fi ìlérí náà falẹ̀” lè túmọ̀ sí pé kò kọ ìlérí náà sílẹ̀ tàbí kò juwọ́ sí i, kì í sì í fi ìlọ́ra/dídádúró βραδύνει hàn ní kedere. “Bí àwọn kan ṣe ka fífalẹ̀ sí” sì kùnà láti ní ohun tí wọ́n ń kà sí ìlọ́ra.'
