id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: yo
  text: 'Ṣùgbọ́n gẹ́gẹ́ bí ìlérí rẹ̀, à ń retí àwọn ọ̀run tuntun àti ayé tuntun, níbi tí òdodo[a] ń gbé.


    [a] Tàbí, “ìdájọ́ òdodo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdájọ́ òdodo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: àwọn ọ̀run tuntun àti ayé tuntun
  rationale: “Tuntun” kò pinnu bóyá ìṣẹ̀dá tuntun patapata ni tàbí ìṣẹ̀dá tí a sọ di tuntun; ó sì pa èdè àgbáyé ti Ìwé Mímọ́ mọ́ láì dín οὐρανούς àti γῆ sí ojú ọ̀run àti ilẹ̀ agbègbè kan.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ pẹ̀lẹ́pẹ̀lẹ́ hàn láàárín ìparun tí ẹsẹ tó ṣáájú sọ àti ohun tí àwọn onígbàgbọ́ ń retí.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: gẹ́gẹ́ bí ìlérí rẹ̀
  rationale: Ó fi hàn pé ohun tí a ń retí bá ìlérí Ọlọ́run mu, ó sì tẹ̀ lé ìtumọ̀ κατά pẹ̀lú ẹ̀sùn-orúkọ níhìn-ín.
- source_word: προσδοκῶμεν
  choice: à ń retí
  rationale: Àmì “ń” sọ ìṣe tí ó ń bá a lọ, ó sì mú ìfojúsọ́nà ọjọ́ iwájú tí ọ̀rọ̀ Gíríìkì ní jáde lọ́nà àdánidá ní Yorùbá.
- source_word: ἐν οἷς
  choice: níbi tí
  rationale: Ìtumọ̀ yìí tọ́ka sí àwọn ọ̀run tuntun àti ayé tuntun gẹ́gẹ́ bí ibùgbé kan ṣoṣo, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ibìkan tí ohun kan ń gbé.
- source_word: δικαιοσύνη
  choice: òdodo
  rationale: “Òdodo” ní ìtumọ̀ tó gbòòrò nípa ohun tí ó tọ́ níwájú Ọlọ́run àti ìwà rere; àṣàyàn “ìdájọ́ òdodo” wà nínú àlàyé ìsàlẹ̀ láti pa ìtumọ̀ justice mọ́.
- source_word: κατοικεῖ
  choice: ń gbé
  rationale: Ó sọ pé òdodo ní ibùgbé tí ó dúró ṣinṣin ní ìṣẹ̀dá tuntun, ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη nínú ọ̀rọ̀ nípa ìṣẹ̀dá tuntun
  choice: òdodo
  alternative: ìdájọ́ òdodo
  rationale: “Òdodo” pa ìtumọ̀ Bíbélì tó gbòòrò mọ́—ohun tí ó tọ́ níwájú Ọlọ́run àti ìwà tó yẹ—nígbà tí “ìdájọ́ òdodo” ń mú apá ìdájọ́ àti ìṣe tó bá ẹ̀tọ́ mu jáde. Àlàyé ìsàlẹ̀ pa àṣàyàn kejì mọ́ láì fi ipa mú ẹsẹ náà yan ìtumọ̀ tóóró kan.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò. “À ń retí” jẹ́ kókó-ọrọ̀ àkójọpọ̀ tí ó bá “a ń retí” mu; “níbi tí” sì yẹra fún ìsopọ̀ arọ́pò-orúkọ tí kò ní dùn mọ́ etí lẹ́yìn “àwọn ọ̀run ... àti ayé.”
