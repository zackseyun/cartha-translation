- from: Ṣùgbọ́n nípasẹ̀ ọ̀rọ̀ kan náà ni a ti fi àwọn ọ̀run àti ayé ìsinsìnyí pa mọ́, tí a sì ń pa wọ́n mọ́ de iná títí di ọjọ́ ìdájọ́ àti ìparun àwọn ènìyàn tí kò ka Ọlọ́run sí.[a]
  to: Ṣùgbọ́n ọ̀rọ̀ kan náà ni a ti fi àwọn ọ̀run àti ayé tó wà nísinsìnyí pamọ́, tí a sì ń tọ́jú wọn fún iná títí di ọjọ́ ìdájọ́ àti ìparun àwọn ènìyàn tí kò ní ìbẹ̀rù Ọlọ́run.
