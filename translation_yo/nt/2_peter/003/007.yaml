id: 2PE.3.7
reference: 2 Peter 3:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀rọ̀ kan náà ni a ti fi àwọn ọ̀run àti ayé tó wà nísinsìnyí pamọ́, tí a sì ń tọ́jú wọn fún iná títí di ọjọ́ ìdájọ́ àti ìparun àwọn ènìyàn tí kò ní ìbẹ̀rù Ọlọ́run.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: Ṣùgbọ́n ... àwọn ọ̀run àti ayé ìsinsìnyí
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ayé àtijọ́ tí àyíká ọ̀rọ̀ ṣáájú mẹ́nu kàn; “ìsinsìnyí” sì tọ́ka sí ètò ìṣẹ̀dá tó wà nísinsìnyí. A pa ọ̀pọ̀ “ọ̀run” mọ́ gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
- source_word: τῷ αὐτῷ λόγῳ
  choice: nípasẹ̀ ọ̀rọ̀ kan náà
  rationale: Dative náà jẹ́ ti ohun èlò; “ọ̀rọ̀ kan náà” tọ́ka padà sí ọ̀rọ̀ Ọlọ́run tó ní agbára nínú àyíká ọ̀rọ̀.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: ni a ti ... pa mọ́
  rationale: Ìṣe perfect periphrastic náà fi ìṣe tí a ti ṣe àti ipò tó ṣì ń bá a lọ hàn. Èdè yìí jẹ́ ti ara Yorùbá, ó sì yàtọ̀ díẹ̀ sí ìṣe tí ń bá a lọ nínú τηρούμενοι.
- source_word: πυρὶ τηρούμενοι
  choice: tí a sì ń pa wọ́n mọ́ de iná
  rationale: “Pa ... mọ́ de iná” sọ pé a ń dá wọn sí fún iná ọjọ́ iwájú láìfi “iná náà” kún ọ̀rọ̀ Gíríìkì tí kò ní article.
- source_word: εἰς ἡμέραν κρίσεως
  choice: títí di ọjọ́ ìdájọ́
  rationale: Ó mú ìtumọ̀ àkókò àti ibi tí ìpamọ́ náà ń lọ dé jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: καὶ ἀπωλείας
  choice: àti ìparun
  rationale: “Ìparun” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ἀπώλεια, láìsọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ pàtó.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: àwọn ènìyàn tí kò ka Ọlọ́run sí
  rationale: Àpèjúwe yìí mú ìtumọ̀ àìbọ̀wọ̀ tàbí àìfọkànsìn sí Ọlọ́run jáde ní èdè Yorùbá àdánidá. “Àwọn ènìyàn” lè gba gbogbo ẹ̀dá ènìyàn, bí ἄνθρωποι ṣe lè ṣe nínú àyíká yìí.
theological_decisions:
- issue: Irú òpin tí iná ọjọ́ iwájú yóò mú wá
  choice: Ẹsẹ̀ náà sọ pé a pa àwọn ọ̀run àti ayé ìsinsìnyí mọ́ de iná ọjọ́ ìdájọ́, ó sì so ìparun mọ́ àwọn ènìyàn tí kò ka Ọlọ́run sí.
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí pípa gbogbo àgbáyé rẹ́ tàbí sí ìwẹ̀nùmọ́ àti ìsọ̀tun ìṣẹ̀dá.
  rationale: Ọ̀rọ̀ Gíríìkì fìdí ìdájọ́ ọjọ́ iwájú múlẹ̀, ṣùgbọ́n nínú ẹsẹ̀ yìí, “ìparun” ní tààràtà ń ṣàlàyé ohun tí yóò ṣẹlẹ̀ sí àwọn ènìyàn aláìfọkànsìn, kì í ṣe dandan ohun kan náà sí ọ̀run àti ayé. Ìtumọ̀ náà kò yanju àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà fúnra rẹ̀ kò yanju.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, kò sì lo ọ̀rọ̀ ẹ̀sìn ẹ̀ka kan ní pàtó.
