  to: Nítorí náà, ẹ̀yin olùfẹ́, níwọ̀n bí ẹ ti mọ èyí tẹ́lẹ̀, ẹ máa ṣọ́ ara yín, kí wọ́n má bàa fa yín lọ pẹ̀lú ìṣìnà àwọn tí kò bọ̀wọ̀ fún òfin, kí ẹ má sì ṣubú kúrò[b] nínú ìdúróṣinṣin tiyín fúnra yín.[a]
  rationale: Àtúnṣe náà mú ἀθέσμων sunmọ́ ‘àwọn tí kò bọ̀wọ̀ fún òfin,’ ó sì tún gbolohun ìkìlọ̀ ṣe kí fífà àwọn olùkà lọ pẹ̀lú ìṣìnà lè ṣáájú ìṣubú kúrò nínú ìdúróṣinṣin wọn. A tún àkọsílẹ̀ [b] ṣe kí ó má bàa sọ ìtumọ̀ tí kò bá ἐκπίπτω mu, nígbà tí a pa àìyanjú ẹ̀kọ́ ìsìn tí ó wà nínú ẹsẹ̀ náà mọ́.
