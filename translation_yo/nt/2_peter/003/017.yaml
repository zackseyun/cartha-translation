  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà ń tẹ̀lé ìtumọ̀ gbogbogbò ọrọ̀ Gíríìkì dáadáa: ìkìlọ̀ ìmọ̀ ṣáájú, ìṣọ́ra, fífà lọ nípasẹ̀ ìṣìnà, àti ṣíṣubú kúrò nínú ìdúróṣinṣin. Síbẹ̀, ìtòlẹ́sẹẹsẹ gbolohun náà lè fi ìbáṣepọ̀ participle συναπαχθέντες àti ἐκπέσητε hàn ní kedere jù, àti yíyan ọ̀rọ̀ fún ἀθέσμων yẹ kí ó sunmọ́ ‘lawless’ dáadáa.'
  naturalness: “Ẹ máa ṣọ́ ara yín” jẹ́ Yorùbá tó dáa fún àṣẹ ìṣọ́ra tí ń bá a lọ. “Àwọn tí kò ka òfin sí” lóye, ṣùgbọ́n kò rọrùn tó, ó sì lè yí ìtumọ̀ sí ẹni tí kò ka òfin sílẹ̀ ju ẹni tí kò bọ̀wọ̀ fún òfin lọ. “Àwọn aláìlòfin” jẹ́ ọ̀rọ̀ kíkún, àmọ́ “àwọn tí kò bọ̀wọ̀ fún òfin” ṣe kedere fún òǹkàwé òde òní.
  terminology: '“Olùfẹ́,” “ìṣìnà,” àti “ìdúróṣinṣin” bá ìforúkọ-lẹ́tà ìjọ mu, wọ́n sì dá ìtumọ̀ ἀγαπητοί, πλάνη, àti στηριγμός dúró. Àkọsílẹ̀ [b] ní ìtumọ̀ yíyàtọ̀ tí kò pé: “yípadà kúrò” kì í ṣe àfidámọ́ tó dáa fún ἐκπέσητε; “ṣubú kúrò” àti “ṣubú kúrò nínú” ni ó yẹ.'
