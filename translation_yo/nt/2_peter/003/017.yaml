id: 2PE.3.17
reference: 2 Peter 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin olùfẹ́, níwọ̀n bí ẹ ti mọ èyí tẹ́lẹ̀, ẹ máa ṣọ́ ara yín, kí wọ́n má bàa fa yín lọ pẹ̀lú ìṣìnà àwọn tí kò bọ̀wọ̀ fún òfin, kí ẹ má sì ṣubú kúrò[b] nínú ìdúróṣinṣin tiyín fúnra yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdúró tiyín fúnra yín tí ó fẹsẹ̀ múlẹ̀.” Ọ̀rọ̀ Gíríìkì στηριγμός lè túmọ̀ sí ìfẹsẹ̀múlẹ̀, ìdúróṣinṣin, tàbí ipò tí ó dúró ṣinṣin.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ ọ̀rọ̀ náà sí “ṣubú kúrò nínú.” Ọ̀rọ̀ Gíríìkì náà fi àwòrán ṣíṣubú kúrò hàn, ṣùgbọ́n kò sọ irú ìṣubú náà di ẹ̀kọ́ ìsìn kan pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: Nítorí náà, ẹ̀yin
  rationale: “Nítorí náà” fi ìyọrísí ọ̀rọ̀ tó ṣáájú hàn, “ẹ̀yin” sì pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: ἀγαπητοί
  choice: olùfẹ́
  rationale: Ó jẹ́ ọ̀rọ̀ ìpè onífẹ̀ẹ́ tó bá ìforúkọ-lẹ́tà ọlọ́lá mu láìfi ìbátan mìíràn tí kò sí nínú Gíríìkì kún un.
- source_word: προγινώσκοντες
  choice: níwọ̀n bí ẹ ti mọ èyí tẹ́lẹ̀
  rationale: Ó fi ìmọ̀ ṣáájú tàbí ìkìlọ̀ ṣáájú hàn; “èyí” tọ́ka sí ọ̀rọ̀ tó wà ní àyíká ẹsẹ̀ náà.
- source_word: φυλάσσεσθε
  choice: ẹ máa ṣọ́ ara yín
  rationale: Ó pa àṣẹ tí ń béèrè ìṣọ́ra tí ń bá a lọ àti agbára ìṣe aláròpadà mọ́.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: ìṣìnà àwọn tí kò ka òfin sí
  rationale: “Ìṣìnà” lè gbé èrò àṣìṣe àti yíyapa kúrò ní ọ̀nà tó tọ́; “àwọn tí kò ka òfin sí” fi àìbìkítà sí ìlànà rere hàn ju pé wọ́n kàn jẹ́ ẹni búburú lọ.
- source_word: συναπαχθέντες
  choice: má bàa fà yín lọ
  rationale: Èyí sọ bí a ṣe lè fa ènìyàn lọ sínú ìṣìnà; ó pa agbára aláìṣe ti Gíríìkì mọ́ ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: ἐκπέσητε
  choice: ṣubú kúrò
  rationale: Ó pa àwòrán “ṣubú kúrò nínú” mọ́, láìsọ ìkìlọ̀ náà di ẹ̀kọ́ pàtó nípa ìpẹ̀yìndà kúrò nínú ìgbàlà.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: nínú ìdúróṣinṣin tiyín fúnra yín
  rationale: “Ìdúróṣinṣin” fi ìfẹsẹ̀múlẹ̀ àti àìṣiyèméjì hàn; “tiyín fúnra yín” pa ìtẹnumọ́ ἰδίου mọ́.
theological_decisions:
- issue: Bóyá ἐκπέσητε ń sọ ní pàtó pé ènìyàn pàdánù ìgbàlà tàbí ó kàn ṣubú kúrò ní ipò tó fẹsẹ̀ múlẹ̀
  choice: ṣubú kúrò nínú ìdúróṣinṣin tiyín fúnra yín
  alternative: yípadà kúrò nínú ìdúróṣinṣin tiyín
  rationale: Gíríìkì fi ìkìlọ̀ líle hàn, ṣùgbọ́n kò dá ìtumọ̀ ẹ̀kọ́ ìsìn kan ṣoṣo múlẹ̀ nípa ìpẹ̀yìndà tàbí pípàdánù ìgbàlà; nítorí náà, a pa àìyanjú tó wà nínú rẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa oníyì, tó ṣe déédé fún òǹkàwé òde òní. A lo “ẹ máa ṣọ́ ara yín” fún ìṣọ́ra tí ń bá a lọ, a sì yàgò fún ọ̀rọ̀ ẹ̀kọ́ ìsìn tí yóò pinnu ohun tí Gíríìkì fi sílẹ̀ ní àìyanjú.
