id: 2PE.3.14
reference: 2 Peter 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin olùfẹ́, níwọ̀n bí ẹ ti ń retí àwọn nǹkan wọ̀nyí, ẹ sa gbogbo ipá yín kí ó lè rí yín[a] láìní àbàwọ́n àti láìlẹ́bi nínú àlàáfíà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a rí yín níwájú rẹ̀ láìní àbàwọ́n àti láìlẹ́bi.” Dátífù Gíríìkì lè tọ́ka sí ẹni tó ń rí wọn (“kí ó lè rí yín”) tàbí sí wíwà níwájú rẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò hàn láti inú ohun tí a ṣẹ̀ṣẹ̀ sọ nípa ọjọ́ Olúwa àti ọ̀run tuntun àti ayé tuntun.
- source_word: ἀγαπητοί
  choice: ẹ̀yin olùfẹ́
  rationale: Ọ̀rọ̀ ìpè onífẹ̀ẹ́ sí ọ̀pọ̀ ènìyàn ni; ó pa ìfẹ́ àti ìwà lẹ́tà náà mọ́ ní Yorùbá àdánidá.
- source_word: ταῦτα προσδοκῶντες
  choice: níwọ̀n bí ẹ ti ń retí àwọn nǹkan wọ̀nyí
  rationale: Ó mú ìfojúsọ́nà tí ń bá a lọ àti ìbáṣepọ̀ rẹ̀ pẹ̀lú àṣẹ tó tẹ̀ lé e jáde, láìsọ ohun tí ‘àwọn nǹkan wọ̀nyí’ jẹ́ ní pàtó ju Gíríìkì lọ.
- source_word: σπουδάσατε
  choice: ẹ sa gbogbo ipá yín
  rationale: Ó sọ ìtara àti ìsapá gidi tí àṣẹ Gíríìkì ń béèrè ní èdè Yorùbá òde òní.
- source_word: ἄσπιλοι
  choice: láìní àbàwọ́n
  rationale: Ó pa àwòrán àbàwọ́n mọ́, ó sì bá ìtumọ̀ ìwà mímọ́ mu.
- source_word: ἀμώμητοι
  choice: láìlẹ́bi
  rationale: Ó fi ìwà tí kò sí ẹ̀sùn kankan sí hàn, ó sì yà díẹ̀ sí ‘láìní àbàwọ́n’ bó tilẹ̀ jẹ́ pé àwọn méjèèjì jọ ní ìtumọ̀.
- source_word: αὐτῷ εὑρεθῆναι
  choice: kí ó lè bá yín
  rationale: Ìsọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá fún ‘kí a bá yín nípasẹ̀ rẹ̀’ ó sì fi ẹni tí ń ṣe àyẹ̀wò náà sílẹ̀ gẹ́gẹ́ bí arọ́pò-orúkọ, bí Gíríìkì ṣe ṣe. Àlàyé ìsàlẹ̀ pa ìtumọ̀ míì ‘níwájú rẹ̀’ mọ́.
- source_word: ἐν εἰρήνῃ
  choice: nínú àlàáfíà
  rationale: Ó pa gbólóhùn Gíríìkì mọ́ láìfi kún un pé àlàáfíà pẹ̀lú Ọlọ́run, inú ọkàn, tàbí láàárín ìjọ ni.
theological_decisions:
- issue: Ìtumọ̀ àti ẹni tí αὐτῷ ń tọ́ka sí ní àyíká ìpadàbọ̀ ọjọ́ ìkẹyìn
  choice: A túmọ̀ ọ́ sí ‘kí ó lè bá yín,’ a kò sì sọ ní pàtó pé ‘Olúwa’ tàbí ‘Ọlọ́run.’
  alternative: ‘kí a bá yín níwájú rẹ̀’ tàbí ‘ní ojú rẹ̀’
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ẹni ọ̀run tó ní í ṣe pẹ̀lú ọjọ́ tó ń bọ̀, ṣùgbọ́n ẹsẹ náà lo arọ́pò-orúkọ nìkan. Dátífù Gíríìkì náà lè tọ́ka sí ẹni tó ṣe iṣẹ́ náà tàbí sí ẹni tí a wà níwájú rẹ̀; nítorí náà, a kò yanju àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò. ‘Ẹ̀yin olùfẹ́’ pa ìfẹ́ inú lẹ́tà náà mọ́; ‘ẹ sa gbogbo ipá yín’ sì ṣe àṣẹ náà kedere fún òǹkàwé lásán. Àmì ohùn ni a fi sí ibi tí ó jẹ́ àdánidá.
