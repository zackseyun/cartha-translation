  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìjíròrò, ìpè ìfẹ́, ìfojúsọ́nà, ìsapá, àti ipò ‘láìní àbàwọ́n àti láìlẹ́bi nínú àlàáfíà’ ti Gíríìkì hàn dáadáa. Síbẹ̀, ‘kí ó lè bá yín’ kì í ṣe ọ̀nà tó péye láti sọ εὑρεθῆναι (‘kí ó lè rí yín’/‘kí a lè rí yín’); ‘bá yín’ sábà máa ń túmọ̀ sí pàdé tàbí dé bá yín.
  naturalness: ‘Ẹ sa gbogbo ipá yín’ àti ‘nínú àlàáfíà’ jẹ́ èdè Yorùbá boṣewa tó dáa. Yíyí ‘bá yín’ padà sí ‘rí yín’ mú kí ìtumọ̀ náà jẹ́ àdánidá, ó sì mú àwòrán ‘kí a rí ẹni kan ní ipò kan’ hàn kedere.
  terminology: ‘Ẹ̀yin olùfẹ́,’ ‘láìní àbàwọ́n,’ àti ‘láìlẹ́bi’ yẹ, wọ́n sì pa ìforígbárí ìtumọ̀ àwọn ọ̀rọ̀ méjì náà mọ́. Arọ́pò-orúkọ ‘ó’ nínú ‘kí ó lè rí yín’ ń pa ẹni tí αὐτῷ tọ́ka sí mọ́ láìsọ ẹni náà ní pàtó ju ìpilẹ̀ṣẹ̀ lọ.
  issues:
