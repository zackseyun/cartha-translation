id: 2PE.3.4
reference: 2 Peter 3:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: yo
  text: wọ́n sì ń wí pé, “Níbo ni ìlérí wíwá[a] rẹ̀ wà? Nítorí láti ìgbà tí àwọn baba ti sùn[b], gbogbo nǹkan ń dúró bákan náà láti ìbẹ̀rẹ̀ ìṣẹ̀dá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “wíwá” (παρουσία) sí “dídé” tàbí “wíwà níhìn-ín.” Nínú àyíká ọ̀rọ̀ yìí, ó ń tọ́ka sí ìpadàbọ̀ Kristi tí a ń retí ní ọjọ́ iwájú.
    reason: lexical_alternative
  - marker: b
    text: “Sùn” jẹ́ ọ̀nà tí èdè Gíríìkì fi ń sọ nípa ikú pẹ̀lẹ́pẹ̀lẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wọ́n sì ń wí pé
  rationale: Ó pa ìṣàn ọ̀rọ̀ alábápín oníṣẹ́ ìsinsìnyí mọ́, ó sì so ohun tí àwọn ẹlẹ́gàn ń sọ mọ́ àpèjúwe wọn nínú ẹsẹ tó ṣáájú.
- source_word: ἐπαγγελία
  choice: ìlérí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá ìdánilójú tí a ṣe nípa ìpadàbọ̀ Olúwa mu.
- source_word: παρουσίας
  choice: wíwá
  rationale: Nínú àyíká ọ̀rọ̀ nípa ohun ọjọ́ iwájú yìí, ó ń tọ́ka sí wíwá tàbí dídé Kristi; “wíwá” jẹ́ ọ̀rọ̀ àdánidá ní Yorùbá láì sọ ìtumọ̀ náà di ohun tó dúró ṣinṣin jù.
- source_word: ἀφ’ ἧς
  choice: láti ìgbà tí
  rationale: Ó fi hàn pé àkókò ti ń kọjá láti ibi ìṣẹ̀lẹ̀ kan ní àtijọ́, ó sì jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀.
- source_word: οἱ πατέρες
  choice: àwọn baba
  rationale: Ó pa àwòrán ọ̀rọ̀ Gíríìkì mọ́ láì fi arọ́pò-orúkọ oníhun tí kò sí nínú orísun kún un; ó tún jẹ́ kí ẹni tí ọ̀rọ̀ náà tọ́ka sí má bàa ṣe pàtó ju ti orísun lọ.
- source_word: ἐκοιμήθησαν
  choice: ti sùn
  rationale: Ó pa àkàwé pẹ̀lẹ́ fún ikú tí ó wà nínú Gíríìkì mọ́; àlàyé ìsàlẹ̀ ojú ìwé mú ìtumọ̀ rẹ̀ ṣe kedere.
- source_word: πάντα
  choice: gbogbo nǹkan
  rationale: Ó sọ gbígbòòrò ẹ̀sùn àwọn ẹlẹ́gàn náà jáde ní Yorùbá tó ṣe kedere.
- source_word: οὕτως διαμένει
  choice: ṣì ń bá a lọ bákan náà gẹ́gẹ́ bí ó ti rí
  rationale: Ó ṣàfihàn ìtẹ̀síwájú àti dídúró ní ipò kan náà, gẹ́gẹ́ bí àríyànjiyàn àwọn ẹlẹ́gàn ṣe ń béèrè.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: láti ìbẹ̀rẹ̀ ìṣẹ̀dá
  rationale: Ìtumọ̀ yìí sún mọ́ ìṣètò orísun, ó sì jẹ́ Yorùbá àdánidá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ παρουσία nínú àyíká ọ̀rọ̀ nípa ọjọ́ iwájú
  choice: wíwá rẹ̀
  alternative: wíwà rẹ̀ níhìn-ín; dídé rẹ̀
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ìmúṣẹ ìlérí ìpadàbọ̀ Kristi tí àwọn ẹlẹ́gàn ń ṣẹ̀sín. “Wíwá” mú ìtumọ̀ dídé ọjọ́ iwájú jáde dáadáa, ṣùgbọ́n àlàyé náà jẹ́wọ́ ìbùwọ̀n ìtumọ̀ ọ̀rọ̀ Gíríìkì.
- issue: Àkàwé ikú nínú ἐκοιμήθησαν
  choice: ti sùn
  alternative: ti kú
  rationale: Orísun lo àkàwé oorun fún ikú, nítorí náà a pa àwòrán náà mọ́ dípò kí a fi ọ̀rọ̀ tààrà “kú” rọ́pò rẹ̀; èyí kò fi ẹ̀kọ́ ìsìn míì kún ọ̀rọ̀ náà.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ, ní ìforúkọsílẹ̀ ọlọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn ìbéèrè náà pa ìrísí ọ̀rọ̀ Gíríìkì “Níbo ni ... wà?” mọ́, bí ó tilẹ̀ jẹ́ pé èrò rẹ̀ ni láti fi ìmúṣẹ ìlérí náà ṣe ẹlẹ́yà. A pa àkàwé oorun fún ikú àti àìṣe pàtó ẹni tí “àwọn baba” ń tọ́ka sí mọ́.
