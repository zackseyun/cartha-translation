id: 2PE.3.15
reference: 2 Peter 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: yo
  text: Kí ẹ sì ka sùúrù Olúwa wa sí ìgbàlà[a], gẹ́gẹ́ bí arákùnrin wa olùfẹ́ náà, Pọ́ọ̀lù, ti kọ̀wé sí yín ní ìbámu pẹ̀lú ọgbọ́n tí a fún un[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ “sùúrù” sí “ìpamọ́ra.” Èrò náà ni pé ìdádúró Olúwa wà fún ìgbàlà, kì í ṣe nítorí pé kò bìkítà.
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe pé “ọgbọ́n tí a fún un” túmọ̀ sí ọgbọ́n tí Ọlọ́run fún un, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì kò sọ ẹni tó fún un ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: sùúrù
  rationale: “Sùúrù” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìpamọ́ra Olúwa mu ní àyíká ọ̀rọ̀ yìí; ó fi hàn pé Olúwa kò yára mú ìdájọ́ ṣẹ.
- source_word: σωτηρίαν
  choice: ìgbàlà
  rationale: “Ìgbàlà” pa ìwúwo ẹ̀kọ́ ìgbàlà inú ọ̀rọ̀ Gíríìkì mọ́, kò sì dín un kù sí ìdáǹdè lásán.
- source_word: ἡγεῖσθε
  choice: ka ... sí
  rationale: 'Ìṣọ̀rọ̀ Yorùbá “ka ... sí” sọ ìtumọ̀ àṣẹ náà jáde lọ́nà àdánidá: kí àwọn òǹkàwé wo ohun kan gẹ́gẹ́ bí ohun mìíràn.'
- source_word: κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó yẹ fún orúkọ oyè κύριος níhìn-ín, ó sì tọ́ka sí Jésù nínú àyíká ọ̀rọ̀ náà.
- source_word: ἀγαπητὸς ... ἀδελφὸς
  choice: arákùnrin wa olùfẹ́
  rationale: Ó pa ìfẹ́ inú ἀγαπητός àti ìbátan ará inú ἀδελφός mọ́ láìsọ ọ́ di ọ̀rọ̀ ẹ̀ya ìjọ kan.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: ní ìbámu pẹ̀lú ọgbọ́n tí a fún un
  rationale: “Ní ìbámu pẹ̀lú” mú ipa κατά jáde, nígbà tí “tí a fún un” pa ọ̀nà àìṣe pàtó tí Gíríìkì lò mọ́ láìfi ẹni tó fún un kún ọ̀rọ̀.
- source_word: ἔγραψεν ὑμῖν
  choice: ti kọ̀wé sí yín
  rationale: Ó tú aorist náà sí ìṣe tó ti ṣẹlẹ̀, ó sì jẹ́ ọ̀nà Yorùbá àdánidá fún kíkọ lẹ́tà sí ẹnì kan.
- source_word: καθὼς καὶ
  choice: gẹ́gẹ́ bí ... náà
  rationale: Ìṣọ̀rọ̀ yìí pa ìfiwéra àti ìtumọ̀ àfikún inú καθὼς καὶ mọ́.
theological_decisions:
- issue: Ẹni tó fún Pọ́ọ̀lù ní ọgbọ́n
  choice: A pa ọ̀nà àìṣe pàtó náà mọ́ pé “ọgbọ́n tí a fún un,” láìsọ “Ọlọ́run” ní pàtó.
  alternative: “ọgbọ́n tí Ọlọ́run fún un”
  rationale: Ó ṣeé ṣe gan-an pé Ọlọ́run ni olùfúnni, ṣùgbọ́n Gíríìkì kò dárúkọ ẹni tó fún un; fífi ọ̀nà àìṣe pàtó náà sílẹ̀ pa ohun tí orísun sọ àti ohun tí ó kan túmọ̀ sí mọ́ lọ́tọ̀.
- issue: Ìtumọ̀ ìdádúró Olúwa
  choice: “sùúrù ... sí ìgbàlà”
  alternative: “ìpamọ́ra ... gẹ́gẹ́ bí àǹfààní fún ìgbàlà”
  rationale: Ọ̀rọ̀ náà fi sùúrù Olúwa àti ìgbàlà so pọ̀ tààrà; a kò fẹ̀ ọ́ sí i nípa fífi “àǹfààní” tàbí “ọ̀nà” kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní ọlá, pẹ̀lú àmì ohùn níbi tó yẹ. “Ka ... sí” jẹ́ ọ̀nà àdánidá fún àṣẹ náà, “ní ìbámu pẹ̀lú” sì pa ìtumọ̀ ìṣe gẹ́gẹ́ bí ọgbọ́n tí a fún Pọ́ọ̀lù mọ́. Àmì ìdádúró ní òpin fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
