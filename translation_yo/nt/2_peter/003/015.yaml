  to: Kí ẹ sì ka sùúrù Olúwa wa sí ìgbàlà[a], gẹ́gẹ́ bí arákùnrin wa olùfẹ́ náà, Pọ́ọ̀lù, ti kọ̀wé sí yín ní ìbámu pẹ̀lú ọgbọ́n tí a fún un[b],
