id: 2PE.3.5
reference: 2 Peter 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: yo
  text: 'Nítorí wọ́n mọ̀ọ́mọ̀ kọ̀ láti fiyè sí èyí[a]: pé àwọn ọ̀run ti wà láti ìgbà pípẹ́, ilẹ̀ ayé[b] sì jẹ́ èyí tí a dá sílẹ̀ láti inú omi àti nípasẹ̀ omi, nípa ọ̀rọ̀ Ọlọ́run[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “èyí yọ kúrò ní àfiyèsí wọn nítorí wọ́n fẹ́ bẹ́ẹ̀,” tàbí, “wọ́n mọ̀ọ́mọ̀ kọ̀ láti fiyè sí i.” Gbólóhùn Gíríìkì náà so àìfiyèsí pọ̀ mọ́ ìfẹ́ inú wọn.
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì kò lo árítíkù níwájú ‘ilẹ̀’; èyí lè tẹnu mọ́ ilẹ̀ ayé gẹ́gẹ́ bí apá kan nínú ìṣẹ̀dá. Yorùbá kò fi árítíkù hàn ní ọ̀nà kan náà.
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ pé, “nípa àṣẹ Ọlọ́run.” Ní tààràtà, Gíríìkì náà ní, “nípa ọ̀rọ̀ Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: Nítorí wọ́n mọ̀ọ́mọ̀ kọ̀ láti fiyè sí èyí
  rationale: Gbólóhùn yìí fi hàn pé àìfiyèsí wọn kì í ṣe ti àìmọ̀ lásán; ohun tí wọ́n fúnra wọn fẹ́ láti ṣe ni. ‘Mọ̀ọ́mọ̀ kọ̀ láti fiyè sí’ mú ìtumọ̀ ti ìmọ̀ àti ìfẹ́ inú méjèèjì jáde ní Yorùbá àdánidá.
- source_word: ὅτι
  choice: pé
  rationale: Ó ń ṣàlàyé ohun tí wọ́n kọ̀ láti fiyè sí; ‘pé’ ni ọ̀nà Yorùbá tó ṣe déédéé jù lọ láti mú àkóónú náà wọlé.
- source_word: οὐρανοὶ
  choice: àwọn ọ̀run
  rationale: A pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́, ó sì bá ọ̀nà tí Yorùbá fi ń sọ̀rọ̀ nípa àgbáyé mu.
- source_word: ἔκπαλαι
  choice: láti ìgbà pípẹ́
  rationale: Èyí jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ohun tó ti wà láti ayé àtijọ́.
- source_word: γῆ
  choice: ilẹ̀ ayé
  rationale: Yorùbá kò ní ètò árítíkù bí ti Gíríìkì, nítorí náà ‘ilẹ̀ ayé’ ni ọ̀rọ̀ àdánidá fún agbègbè ayé tí a dá, láìfi ìtumọ̀ tí kò sí nínú orísun kún un.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: láti inú omi àti nípasẹ̀ omi
  rationale: A pa ìyàtọ̀ láàárín ἐκ (‘láti inú’) àti διά (‘nípasẹ̀’) mọ́, pẹ̀lú ìṣọ̀kan àkọsílẹ̀ náà.
- source_word: συνεστῶσα
  choice: dúró
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí dídá ohun kan mú kí ó dúró tàbí bí ó ṣe wà ní ìdúró. ‘Dúró’ pa ìwọ̀nyí mọ́ láìdín un kù sí ‘a dá’ nìkan.
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: nípa ọ̀rọ̀ Ọlọ́run
  rationale: ‘Nípa’ mú dátífù irinṣẹ́ náà jáde, ‘ọ̀rọ̀ Ọlọ́run’ sì pa ìṣètò gbolohun Gíríìkì mọ́ láìsọ pé λόγος jẹ́ àṣẹ lásán tàbí orúkọ oyè fún Ọmọ.
theological_decisions:
- issue: Bóyá λόγῳ yẹ kí a túmọ̀ rẹ̀ ní ọ̀nà tó ń tọ́ka sí Logos gẹ́gẹ́ bí Ẹni kan
  choice: nípa ọ̀rọ̀ Ọlọ́run
  alternative: nípa àṣẹ Ọlọ́run
  rationale: Nínú àyíká yìí, λόγος tọ́ka sí ọ̀rọ̀ Ọlọ́run tó ní agbára nínú iṣẹ́ ìṣẹ̀dá, ṣùgbọ́n ẹsẹ̀ náà kò pe Ọmọ ní Logos ní tààràtà. Ìtumọ̀ yìí pa àfojúsùn ọ̀rọ̀ orísun àti àìdánilójú ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- issue: Bóyá συνεστῶσα yẹ kí a yanjú sí ‘a dá’ tàbí ‘ó dúró/ó wà ní ìdúró’
  choice: dúró
  alternative: a dá sílẹ̀
  rationale: Fọ́ọ̀mù pípé náà lè ṣàpèjúwe bí ilẹ̀ ayé ṣe wá sí ìdúró àti bí ó ṣe wà ní ìdúró. ‘Dúró’ kò fi dandan yan ìṣẹ̀lẹ̀ ìdásílẹ̀ nìkan, ó sì pa ìfọ̀rọ̀wérọ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá àgbàndéédé òde òní pẹ̀lú àmì ohùn ní kíkún, ní ọ̀nà ọ̀wọ̀ àti kíkà-rọrùn. Àwọn ọ̀rọ̀ bí ‘àwọn ọ̀run,’ ‘ilẹ̀ ayé,’ àti ‘ọ̀rọ̀ Ọlọ́run’ bá ìforúkọsílẹ̀ Bíbélì mu, ṣùgbọ́n wọn kò jẹ́ ti àtijọ́ tàbí ti ẹ̀ka ìjọ kan pàtó.
