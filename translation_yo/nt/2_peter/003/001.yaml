id: 2PE.3.1
reference: 2 Peter 3:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: yo
  text: Ẹ̀yin olùfẹ́, báyìí ni mo ń kọ lẹ́tà kejì yìí sí yín; nínú àwọn lẹ́tà méjèèjì náà ni mo ń ru ìrònú yín tí ó mọ́ sókè nípasẹ̀ ìránnilétí,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìrònú yín tí ó jẹ́ tòótọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Ẹ̀yin olùfẹ́
  rationale: Ọ̀rọ̀ ìpè ní ọ̀pọ̀ ni; ó fi ìfẹ́ tímọ́tímọ́ hàn, ó sì bá ọ̀nà ọ̀wọ̀ àti ọlá tí lẹ́tà yìí gbà sọ̀rọ̀ mu.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: èyí ni lẹ́tà kejì tí mo ń kọ sí yín báyìí
  rationale: A tún ìtòlẹ́sẹẹsẹ Gíríìkì ṣe ní ọ̀nà àdánidá fún Yorùbá, ṣùgbọ́n a pa ìtumọ̀ pé lẹ́tà tí ó wà lọ́wọ́ ni èkejì mọ́; “báyìí” fi ἤδη hàn.
- source_word: γράφω
  choice: mo ń kọ
  rationale: Àmì “ń” fi iṣẹ́ tí olùkọ̀wé ń ṣe lọ́wọ́ hàn ní ọ̀nà àdánidá.
- source_word: ἐν αἷς
  choice: Nínú àwọn lẹ́tà méjèèjì
  rationale: Ọ̀rọ̀ arọ́pò orúkọ Gíríìkì jẹ́ ti ọ̀pọ̀, akọ abo rẹ̀ sì bá ἐπιστολή mu; ó tọ́ka sí lẹ́tà méjì náà.
- source_word: διεγείρω
  choice: ru ... sókè
  rationale: Ó pa àwòrán jíjí tàbí mímú kí ohun tí ó wà lójú oorun ṣiṣẹ́ mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere nínú àyíká yìí.
- source_word: ἐν ὑπομνήσει
  choice: fi ìránnilétí
  rationale: Ó fi ọ̀nà tàbí ohun èlò tí a fi ń ru èrò inú wọn sókè hàn ní Yorùbá tó rọrùn.
- source_word: εἰλικρινῆ διάνοιαν
  choice: èrò inú yín tí ó jẹ́ òótọ́
  rationale: διάνοια ni agbára ìrònú tàbí èrò inú; εἰλικρινής sì lè túmọ̀ sí ohun tí kò ní àbùkù, tí ó mọ́, tàbí tí ó jẹ́ òótọ́. Yíyan “tí ó jẹ́ òótọ́” pa ìtumọ̀ òtítọ́-ọkàn mọ́ láì fi ẹ̀kọ́ míì kún un.
- source_word: ὑμῶν
  choice: yín
  rationale: A túmọ̀ ìní Gíríìkì náà pẹ̀lú arọ́pò orúkọ ìní ọ̀pọ̀ ti Yorùbá.
theological_decisions:
- issue: Ohun tí ἐν αἷς, ọ̀rọ̀ arọ́pò orúkọ ọ̀pọ̀, ń tọ́ka sí
  choice: Ó tọ́ka sí lẹ́tà méjèèjì tí olùkọ̀wé kọ sí àwọn olùgbà.
  alternative: Kí a ka a bí ẹni pé ó tọ́ka sí lẹ́tà tí ó wà lọ́wọ́ nìkan nípasẹ̀ lílo ọ̀pọ̀ lọ́nà àìgbàgbọ́.
  rationale: Ìbámu gírámà tó ṣe tààrà jù ni pé ọ̀rọ̀ ọ̀pọ̀ náà tọ́ka sí lẹ́tà méjì tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn; ìtumọ̀ náà kò fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ míì kún ọrọ̀.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tí ó ní ọlá ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà tẹ̀ lé ìtumọ̀ Gíríìkì, ṣùgbọ́n a ṣètò rẹ̀ ní ọ̀nà tí ó jẹ́ àdánidá fún Yorùbá. A sọ “lẹ́tà méjèèjì” ní kedere nítorí ọ̀pọ̀ ἐν αἷς; kò nílò àlàyé ìsàlẹ̀ ojú ìwé míì. Àmì [a] wà lẹ́yìn gbolohun tí àṣàyàn ọ̀rọ̀ rẹ̀ kan.
