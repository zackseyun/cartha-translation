id: 2PE.3.2
reference: 2 Peter 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: yo
  text: láti rántí àwọn ọ̀rọ̀ tí àwọn wòlíì mímọ́ ti sọ ṣáájú[b], àti àṣẹ láti ọ̀dọ̀ Olúwa àti Olùgbàlà, nípasẹ̀ àwọn aposteli yín[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àti àṣẹ àwọn aposteli yín láti ọ̀dọ̀ Olúwa àti Olùgbàlà.” A lè túmọ̀ ìbáṣepọ̀ àwọn ọ̀rọ̀ Gíríìkì wọ̀nyí ní ọ̀nà tó ju ọ̀kan lọ ní Yorùbá.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn ọ̀rọ̀ tí a ti sọ tẹ́lẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: láti rántí
  rationale: Ó túmọ̀ ète tí òǹkọ̀wé sọ nínú ẹsẹ tó ṣáájú; ‘rántí’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì ní ìtumọ̀ gbòòrò.
- source_word: προειρημένων ῥημάτων
  choice: àwọn ọ̀rọ̀ tí ... ti sọ ṣáájú
  rationale: Èyí pa ìtumọ̀ pé a ti sọ àwọn ọ̀rọ̀ náà tẹ́lẹ̀ mọ́, láì fi dandan túmọ̀ wọn sí àsọtẹ́lẹ̀.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: tí àwọn wòlíì mímọ́ ... sọ
  rationale: Ìṣètò yìí jẹ́ Yorùbá àdánidá fún olùṣe nínú gbólóhùn, ó sì pa àpèjúwe ‘mímọ́’ mọ́.
- source_word: ἐντολῆς
  choice: àṣẹ
  rationale: ‘Àṣẹ’ ṣàfihàn ohun tí ẹni tó ní ọlá-àṣẹ pàṣẹ, ó sì pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: nípasẹ̀ àwọn aposteli yín
  rationale: Ó fi hàn pé àwọn aposteli tó ní ìbáṣepọ̀ pẹ̀lú àwọn olùkà ni wọ́n mú àṣẹ náà dé ọ̀dọ̀ wọn; akọsilẹ̀ ẹsẹ ṣàfihàn àìdánilójú gírámà náà.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: tí ó ti ọ̀dọ̀ Olúwa àti Olùgbàlà wá
  rationale: Èyí so àṣẹ náà mọ́ Olúwa àti Olùgbàlà gẹ́gẹ́ bí orísun rẹ̀, láì fi ‘wa’ kún ohun tí kò sí nínú Gíríìkì.
theological_decisions:
- issue: Ìbáṣepọ̀ ὑμῶν pẹ̀lú τῶν ἀποστόλων
  choice: ‘yín’ ṣàpèjúwe ‘àwọn aposteli,’ ní ìtumọ̀ àwọn aposteli tí wọ́n ní ìbáṣepọ̀ pẹ̀lú àwọn olùkà
  alternative: àṣẹ tí a fi fún yín nípasẹ̀ àwọn aposteli
  rationale: Ìtòlẹ́sẹẹsẹ ọ̀rọ̀ Gíríìkì so ὑμῶν mọ́ ἀποστόλων lọ́nà tó ṣeé ṣe jù; ‘nípasẹ̀’ tún jẹ́ kí ìrànṣẹ́ wọn ṣe kedere ní Yorùbá.
- issue: Ohun tí τοῦ κυρίου καὶ σωτῆρος ń ṣàpèjúwe
  choice: Àṣẹ náà ti ọ̀dọ̀ Olúwa àti Olùgbàlà wá, àwọn aposteli sì ni wọ́n mú un dé
  alternative: Àwọn aposteli náà jẹ́ ti Olúwa àti Olùgbàlà
  rationale: 'Ìtumọ̀ yìí bá ìṣọ̀kan gbólóhùn mu: ọ̀rọ̀ àwọn wòlíì àti àṣẹ Olúwa tí àwọn aposteli mú wá. Síbẹ̀, akọsilẹ̀ [a] pa àìdánilójú ìsopọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́.'
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti èdè òde òní ni a lò. A yan ‘wòlíì,’ ‘aposteli,’ ‘Olúwa,’ àti ‘Olùgbàlà’ gẹ́gẹ́ bí àwọn ọ̀rọ̀ Bíbélì tí àwọn olùkà Yorùbá mọ̀ dáadáa; gbogbo àmì ohùn ni a fi síbi tó bá yẹ.
