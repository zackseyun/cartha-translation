id: 2PE.3.16
reference: 2 Peter 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: yo
  text: gẹ́gẹ́ bí ó ti ń ṣe nínú gbogbo lẹ́tà rẹ̀, níbi tí ó ti ń sọ̀rọ̀ nípa àwọn nǹkan wọ̀nyí. Àwọn nǹkan kan wà nínú wọn tí ó ṣòro láti lóye, tí àwọn aláìní ìmọ̀[a] àti àwọn tí kò dúró ṣinṣin ń darú wọn[b], gẹ́gẹ́ bí wọ́n ti ń ṣe sí àwọn Ìwé Mímọ́ yòókù[c], sí ìparun ara wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘àwọn tí a kò kọ́.’
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí ‘ń yí wọn po.’
    reason: lexical_alternative
  - marker: c
    text: Tàbí ‘àwọn Ìwé Mímọ́ mìíràn.’ Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí ‘yòókù’ tàbí ‘mìíràn,’ ṣùgbọ́n ‘yòókù’ bá ìfiwéra inú gbólóhùn náà mu jù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: lẹ́tà
  rationale: Ọ̀rọ̀ Yorùbá òde òní tí ó wọ́pọ̀ fún ìwé tí a kọ ránṣẹ́; ó ṣe kedere ju lílo ọ̀rọ̀ àṣà kan fún ‘epistle’ lọ.
- source_word: λαλῶν
  choice: ń sọ̀rọ̀
  rationale: Ó pa ìtumọ̀ gangan ti ‘sọ̀rọ̀’ mọ́, bí ó tilẹ̀ jẹ́ pé inú lẹ́tà ni Pọ́ọ̀lù ti ń bá wọn sọ̀rọ̀.
- source_word: περὶ τούτων
  choice: nípa àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka sí àwọn kókó tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn ní àyíká ẹsẹ náà.
- source_word: δυσνόητά τινα
  choice: Àwọn nǹkan kan ... tí ó ṣòro láti lóye
  rationale: Ó pa àìsọ pàtó ti τινα àti ìṣòro òye ti δυσνόητα mọ́ ní Yorùbá àdánidá.
- source_word: ἀμαθεῖς
  choice: àwọn aláìní ìmọ̀
  rationale: Ó fi àìní ẹ̀kọ́ tàbí òye hàn láìdá a mọ́ àìmọ̀ọ́kọ-mọ̀ọ́kà nìkan.
- source_word: ἀστήρικτοι
  choice: àwọn tí kò dúró ṣinṣin
  rationale: Ó ṣàfihàn àwọn tí kò fìdí múlẹ̀ tàbí tí kò dúró gbọningbọnin.
- source_word: στρεβλοῦσιν
  choice: ń yí ìtumọ̀ wọn po
  rationale: Ọ̀rọ̀ náà túmọ̀ sí yí ohun kan po tàbí bà á jẹ́; fífi ‘ìtumọ̀’ kún un mú ohun tí wọ́n ṣe sí ọ̀rọ̀ yé kedere ní Yorùbá.
- source_word: τὰς λοιπὰς γραφὰς
  choice: àwọn Ìwé Mímọ́ yòókù
  rationale: γραφή ní ọ̀pọ̀ nínú àyíká Majẹmu Tuntun ń tọ́ka sí Ìwé Mímọ́, λοιπάς sì lè túmọ̀ sí ‘yòókù’ tàbí ‘àwọn mìíràn.’
- source_word: ἀπώλειαν
  choice: ìparun
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún àbájáde búburú gidigidi náà láìfi ìtumọ̀ ẹ̀kọ́ ìsìn àfikún sí i.
theological_decisions:
- issue: Bóyá τὰς λοιπὰς γραφὰς ka àwọn lẹ́tà Pọ́ọ̀lù mọ́ Ìwé Mímọ́
  choice: àwọn Ìwé Mímọ́ yòókù
  alternative: àwọn Ìwé Mímọ́ mìíràn
  rationale: ‘Yòókù’ pa ìtọ́kasí àdánidá mọ́ pé a ń fi àwọn lẹ́tà náà wé àwọn ìkọ̀wé mímọ́ mìíràn, láìṣàfikún ìpinnu ẹ̀kọ́ ìsìn tí ó kọjá ọ̀rọ̀ Gíríìkì.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye ni a lò. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ. A yan ‘lẹ́tà’ dípò ọ̀rọ̀ ìjọsìn àtijọ́, a sì pa ìfiwéra àti àìdájú inú λοιπάς mọ́ ní àkọsílẹ̀ ìsàlẹ̀.
