id: 2PE.3.12
reference: 2 Peter 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: yo
  text: bí ẹ ṣe ń retí, tí ẹ sì ń mú kí dídé ọjọ́ Ọlọ́run yára sí i[a], nítorí ọjọ́ náà, a ó fi iná sun àwọn ọ̀run, wọ́n yóò sì tú ká; àwọn ohun ìpìlẹ̀ ayé, tí ń jó[b], yóò sì yọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ẹ sì ń fi ìtara retí dídé ọjọ́ Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “mú kí ó yára dé” tàbí “fi ìtara retí.”
    reason: alternative_reading
  - marker: b
    text: “Àwọn ohun ìpìlẹ̀ ayé” lè jẹ́ àwọn èròjà ìpìlẹ̀ tí ayé fi dá, tàbí ó ṣeé ṣe kí ó tọ́ka sí àwọn ìràwọ̀ àti ohun ojú ọ̀run.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: bí ẹ ti ń retí
  rationale: Ó fi ìfojúsọ́nà tí ń bá a lọ hàn, ó sì bá ọ̀rọ̀ ìgbàlódé Yorùbá mu.
- source_word: σπεύδοντας
  choice: tí ẹ sì ń mú kí ... yára dé
  rationale: Ó pa ìtumọ̀ tààrà pé kí wọ́n mú dídé náà yára mọ́; a fi ìtumọ̀ mìíràn tí ó ṣeé ṣe sí àlàyé ìsàlẹ̀.
- source_word: παρουσίαν
  choice: dídé
  rationale: Nínú ọ̀rọ̀ nípa ọjọ́ ìkẹyìn, ‘dídé’ jẹ́ èdè Yorùbá tó ṣe kedere fún wíwá tàbí dédé ẹni.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: ọjọ́ Ọlọ́run
  rationale: Ó pa gbólóhùn Gíríìkì tí kò wọ́pọ̀ mọ́, láì sọ ọ́ di ‘ọjọ́ Olúwa.’
- source_word: δι’ ἣν
  choice: Nítorí ọjọ́ náà
  rationale: διά pẹ̀lú ọ̀rọ̀-orúkọ ní accusative ń tọ́ka sí ohun tó fa ìṣẹ̀lẹ̀ náà níbí.
- source_word: οὐρανοὶ
  choice: àwọn ọ̀run
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà inú Gíríìkì mọ́, ó sì yẹ fún àwòrán gbogbo ayé.
- source_word: πυρούμενοι
  choice: a ó fi iná sun
  rationale: Ó mú ìṣe tí ohun mìíràn ń ṣe sí àwọn ọ̀run hàn, gẹ́gẹ́ bí participle passive náà.
- source_word: λυθήσονται
  choice: wọn yóò sì tú ká
  rationale: Ó túmọ̀ sí pé a ó tú wọn sí wẹ́wẹ́ tàbí pé wọn yóò fọ́ túútúú, kì í ṣe dandan pé wọn yóò di asán pátápátá.
- source_word: στοιχεῖα
  choice: àwọn ohun ìpìlẹ̀ ayé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó yé ni láti pa ìtumọ̀ gbogbogbò ti àwọn èròjà ìpìlẹ̀ mọ́, láì fi ìtumọ̀ kan ṣoṣo lé e lórí.
- source_word: καυσούμενα
  choice: yóò jó
  rationale: Ó sọ ooru àti jíjóná tí participle náà ń ṣàpèjúwe ní ṣókí àti ní èdè àdánidá.
- source_word: τήκεται
  choice: wọn yóò sì yọ́
  rationale: ‘Yọ́’ ni ọ̀rọ̀ Yorùbá àdánidá fún ohun tí ooru mú kí ó tú tàbí yo; ọjọ́ iwájú bá àwọn ọ̀rọ̀-ìṣe tó yí i ká mu.
theological_decisions:
- issue: Ìtumọ̀ σπεύδοντας τὴν παρουσίαν
  choice: ń mú kí dídé ... yára dé
  alternative: ń fi ìtara retí dídé
  rationale: Gíríìkì lè túmọ̀ sí mímú kí dídé náà yára tàbí fífi ìtara retí rẹ̀. A pa ìtumọ̀ tí ó gba ‘dídé’ gẹ́gẹ́ bí ohun tí ọ̀rọ̀-ìṣe náà ń ṣe sí mọ́ nínú ẹsẹ̀, a sì tọ́ka sí èkejì ní àlàyé ìsàlẹ̀.
- issue: Ohun tí στοιχεῖα ń tọ́ka sí
  choice: àwọn ohun ìpìlẹ̀ ayé
  alternative: àwọn ìràwọ̀ àti ohun ojú ọ̀run
  rationale: Ọ̀rọ̀ náà ní àríyànjiyàn nínú àyíká ọjọ́ ìkẹyìn; ìtumọ̀ gbogbogbò yìí kò fi ètò ìmọ̀ nípa àgbáyé kan pàtó lé ẹsẹ̀ náà lórí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ẹni-kejì ọ̀pọ̀ ‘ẹ’ nítorí àwọn olùgbọ́ ọ̀pọ̀ tí participle Gíríìkì ń bá sọ̀rọ̀.
