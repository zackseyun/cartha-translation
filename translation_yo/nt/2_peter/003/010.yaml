id: 2PE.3.10
reference: 2 Peter 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: yo
  text: Ṣùgbọ́n ọjọ́ Olúwa yóò dé gẹ́gẹ́ bí olè. Nínú ọjọ́ náà, àwọn ọ̀run yóò kọjá lọ pẹ̀lú ariwo líle; àwọn èròjà[a] yóò túká nígbà tí iná ń jó wọ́n; ilẹ̀ ayé àti àwọn iṣẹ́ tí ó wà nínú rẹ̀ ni a ó sì rí.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ohun ojú ọ̀run.” Ọ̀rọ̀ Gíríìkì στοιχεῖα lè tọ́ka ní pàtó sí àwọn apá ìpilẹ̀ àgbáyé nínú àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
  - marker: b
    text: Àwọn kan lóye “a ó rí” sí “a ó tú síta” tàbí “a ó ṣí payá.”
    reason: alternative_reading
  - marker: c
    text: Ọ̀pọ̀ àfọwọ́kọ ní “yóò jóná run” dípò “a ó rí.”
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: yóò dé
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí ‘dé’ tàbí ‘wá’; ‘yóò dé’ bá ọjọ́ tí a ń retí mu, ó sì jẹ́ Yorùbá àdánidá.
- source_word: ἡμέρα κυρίου
  choice: ọjọ́ Olúwa
  rationale: Èyí pa ọ̀rọ̀ àsọtẹ́lẹ̀ nípa ọjọ́ ìdájọ́ mọ́; kì í ṣe ọjọ́ ìjọsìn ọ̀sọ̀ọ̀sẹ̀.
- source_word: κλέπτης
  choice: olè
  rationale: Àfiwé náà tẹnu mọ́ dídé láìròtẹ́lẹ̀; ‘olè’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere jù.
- source_word: ἐν ᾗ
  choice: Ní ọjọ́ náà
  rationale: Ìtumọ̀ yìí so àwọn ìṣẹ̀lẹ̀ tó tẹ̀ lé e mọ́ ọjọ́ Olúwa ní Yorùbá tó ṣàn dáadáa.
- source_word: οἱ οὐρανοὶ
  choice: àwọn ọ̀run
  rationale: Ó pa ọ̀pọ̀ nọ́ńbà Gíríìkì àti ìwọ̀n gbogbo àgbáyé inú ọ̀rọ̀ náà mọ́.
- source_word: ῥοιζηδόν
  choice: pẹ̀lú ariwo líle
  rationale: Ó fi ìró ńlá, tí ń ró tàbí tí ń sú, hàn láìfi irú ìró kan pàtó lé ọ̀rọ̀ Gíríìkì lórí.
- source_word: παρελεύσονται
  choice: yóò kọjá lọ
  rationale: Ó pa àwòrán ‘kọjá lọ’ mọ́, ó sì bá lílo ọ̀rọ̀ yìí nínú àwọn ẹsẹ Bíbélì nípa òpin ayé mu.
- source_word: στοιχεῖα
  choice: àwọn èròjà
  rationale: ‘Àwọn èròjà’ jẹ́ ọ̀rọ̀ gbòòrò tó lè tọ́ka sí àwọn apá ìpilẹ̀ àgbáyé láìfipá pinnu pé àwọn ìràwọ̀ tàbí ohun ojú ọ̀run ni.
- source_word: καυσούμενα
  choice: yóò jó
  rationale: Ó sọ ìṣe iná náà ní Yorùbá àdánidá, láìdárúkọ ẹni tàbí ohun tó mú wọn jó.
- source_word: λυθήσεται
  choice: yóò sì túká
  rationale: Ní àyíká yìí, λύω túmọ̀ sí títú ohun sí wẹ́wẹ́ tàbí pínyà rẹ̀, kì í ṣe kìkì píparun.
- source_word: γῆ
  choice: ilẹ̀ ayé
  rationale: Àyíká tó ń sọ̀rọ̀ nípa àwọn ọ̀run àti àwọn èròjà fi hàn pé gbogbo ilẹ̀ ayé ni, kì í ṣe agbègbè ilẹ̀ kan.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: àwọn iṣẹ́ inú rẹ̀
  rationale: Ó pa ìtumọ̀ ‘àwọn iṣẹ́/ohun tí a ṣe nínú rẹ̀’ mọ́, láìdín un kù sí ìṣe ènìyàn nìkan.
- source_word: εὑρεθήσεται
  choice: ni a ó sì rí
  rationale: Èyí ni ìtumọ̀ tààrà jù lọ fún ẹ̀kọ́ ọ̀rọ̀ tí SBLGNT gbà, ó sì mọ̀ọ́mọ̀ pa líle àti àìdánilójú gbólóhùn náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn ìkẹyìn καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται
  choice: ilẹ̀ ayé àti àwọn iṣẹ́ inú rẹ̀ ni a ó sì rí
  alternative: a ó tú ilẹ̀ ayé àti àwọn iṣẹ́ inú rẹ̀ síta; tàbí ilẹ̀ ayé àti àwọn iṣẹ́ inú rẹ̀ yóò jóná run
  rationale: Ẹ̀dà Gíríìkì tí a pèsè ní εὑρεθήσεται, ‘a ó rí.’ Nítorí pé ìtumọ̀ àti ẹ̀rí àfọwọ́kọ yàtọ̀ síra níbí, àkọ́lé pàtàkì pa ọ̀rọ̀ tó nira mọ́, àwọn àṣàyàn mìíràn sì wà ní àlàyé ìsàlẹ̀.
- issue: Ohun tí στοιχεῖα ń tọ́ka sí
  choice: àwọn èròjà
  alternative: àwọn ohun ojú ọ̀run; àwọn apá ìpilẹ̀ àgbáyé
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àwọn apá ìpilẹ̀ àgbáyé tàbí sí àwọn ohun ojú ọ̀run. Ìtumọ̀ pàtàkì kò yan ọ̀kan níbi tí ẹsẹ náà kò ti yan án kedere.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá bá èdè àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo àwọn gbolohun Yorùbá tó wọ́pọ̀, ṣùgbọ́n a pa àwòrán àgbáyé, líle ọ̀rọ̀ ìkẹyìn, àti àìdánilójú ọ̀rọ̀ στοιχεῖα mọ́.
