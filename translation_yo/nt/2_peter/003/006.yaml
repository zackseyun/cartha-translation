  text: through which the world of that time[a], having been flooded with water[b], perished.
translation:
  language: yo
  text: Nípasẹ̀ àwọn nǹkan wọ̀nyẹn[a] ni ayé ìgbà náà ṣègbé, nígbà tí omi kún bò ó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ wọn.” Ọ̀rọ̀ arọ́pò náà jẹ́ ọ̀pọ̀ nọ́ńbà, ó sì ń tọ́ka sí àwọn ọ̀nà tàbí ohun èlò tí a mẹ́nu kàn nínú ẹsẹ tó ṣáájú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó parun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Nípasẹ̀ àwọn nǹkan wọ̀nyẹn
  rationale: “Nípasẹ̀” fi ọ̀nà tàbí ohun èlò hàn gẹ́gẹ́ bí διά pẹ̀lú ẹ̀yà ọ̀rọ̀ oníjẹ́nítífù. “Àwọn nǹkan wọ̀nyẹn” pa ọ̀pọ̀ nọ́ńbà ọ̀rọ̀ arọ́pò ὧν mọ́, kò sì fi tipátipá pinnu ohun tí ó ń tọ́ka sí nínú ẹsẹ tó ṣáájú.
- source_word: ὁ τότε κόσμος
  choice: ayé ìgbà náà
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ayé bí ó ti rí ní àkókò náà, ó sì pa ìyàtọ̀ tó wà láàárín ayé ìgbà náà àti ayé ìsinsìnyí nínú àyíká ọ̀rọ̀ mọ́.
- source_word: ὕδατι
  choice: omi
  rationale: Omi ni ohun èlò tí ìkún omi náà fi ṣẹlẹ̀; ìṣètò gbolohun Yorùbá “omi kún bo” sọ èyí ní ọ̀nà àdánidá.
- source_word: κατακλυσθεὶς
  choice: omi kún bo
  rationale: Ó mú ìtumọ̀ jíjẹ́ tí ìkún omi bò mọ́, ní èdè Yorùbá tó wọ́pọ̀, láìfi ọ̀rọ̀ orúkọ kan kún ohun tí Gíríìkì sọ gẹ́gẹ́ bí ọ̀rọ̀ ìṣe.
- source_word: ἀπώλετο
  choice: ṣègbé
  rationale: “Ṣègbé” fi ìparun tó le koko hàn, ṣùgbọ́n kò fi dandan sọ pé ohun náà di asán pátápátá; ó bá agbára ọ̀rọ̀ aláìléríko Gíríìkì mu.
theological_decisions:
- issue: Irú ìdájọ́ ìkún omi náà
  choice: ṣègbé
  alternative: a pa á run
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí “ṣègbé” tàbí “a pa run.” “Ṣègbé” pa bí ìdájọ́ náà ti le koko mọ́, láìsọ ju ohun tí ẹsẹ náà fúnra rẹ̀ fìdí rẹ̀ múlẹ̀ lọ.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. Ìṣètò “omi kún bo” jẹ́ àdánidá ju àfọwọ́ṣe gírámà Gíríìkì lọ, nígbà tí ó ṣì pa ìtumọ̀ ìkún omi àti ìparun ayé ìgbà náà mọ́.
