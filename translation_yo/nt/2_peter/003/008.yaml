id: 2PE.3.8
reference: 2 Peter 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: yo
  text: 'Ṣùgbọ́n ẹ má ṣe jẹ́ kí ohun kan yìí yọ̀ yín lọ́wọ́[a], ẹ̀yin olùfẹ́: lọ́dọ̀ Olúwa, ọjọ́ kan dàbí ẹgbẹ̀rún ọdún[c][b], ẹgbẹ̀rún ọdún sì dàbí ọjọ́ kan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má ṣe jẹ́ aláìmọ̀ nípa ohun kan yìí.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà lo “dàbí” láti fi ohun méjì wéra; kò sọ pé ọjọ́ kan dọ́gba pẹ̀lú ẹgbẹ̀rún ọdún ní ti gidi.
    reason: cultural_note
  - marker: c
    text: Wo Sáàmù 90:4.
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν δὲ τοῦτο
  choice: Ṣùgbọ́n ... ohun kan yìí
  rationale: Ó pa ìtẹnumọ́ ohun kan pàtó mọ́, ó sì fi δέ hàn gẹ́gẹ́ bí ìyípadà ọ̀rọ̀ pẹ̀lú “Ṣùgbọ́n.”
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: ẹ má ṣe jẹ́ kí ... bójú yín
  rationale: “Bójú ẹni” jẹ́ ọ̀nà Yorùbá àdánidá fún ohun tí ẹni kò kíyè sí; ó tún pa agbára àṣẹ náà mọ́.
- source_word: ἀγαπητοί
  choice: ẹ̀yin olùfẹ́
  rationale: Ó jẹ́ ọ̀rọ̀ ìkíni onífẹ̀ẹ́, ọlọ́lá, tí ó sì yẹ fún àwọn onígbàgbọ́.
- source_word: παρὰ κυρίῳ
  choice: lọ́dọ̀ Olúwa
  rationale: “Lọ́dọ̀” lè sọ ìbáṣepọ̀ tàbí ojú ìwòye Olúwa láì fi ìtumọ̀ tóóró kan lé ọ̀rọ̀ náà lórí.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: ọjọ́ kan dàbí ẹgbẹ̀rún ọdún
  rationale: “Dàbí” ṣe àfihàn ìfiwéra ὡς ní kedere, kì í ṣe ìdọ́gba gangan.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: ẹgbẹ̀rún ọdún sì dàbí ọjọ́ kan
  rationale: Ó pa ìwọ̀ntúnwọ̀nsì àti ìpadàbọ̀ ìfiwéra méjèèjì mọ́ ní Yorùbá àdánidá.
- source_word: χίλια ἔτη
  choice: ẹgbẹ̀rún ọdún
  rationale: Èyí ni ìtumọ̀ nọ́ńbà náà ní tààrà, láì sọ ọ́ di àmì tàbí ètò àsọtẹ́lẹ̀.
theological_decisions:
- issue: Irú ìfiwéra àkókò náà
  choice: Ṣe e gẹ́gẹ́ bí àfiwé nípa bí àkókò ṣe rí lọ́dọ̀ Olúwa, kì í ṣe ìdọ́gba gangan tàbí òfin ìṣirò àsọtẹ́lẹ̀.
  alternative: Kí a ka ọjọ́ kan sí ẹgbẹ̀rún ọdún gangan, tàbí kí a lò ó gẹ́gẹ́ bí kọ́kọ́rọ́ ìṣirò àkókò ìkẹyìn.
  rationale: ὡς tí a tún lò lẹ́ẹ̀mejì túmọ̀ sí “bí/dàbí,” ó sì ń fi ohun méjì wéra dípò kíkede pé wọ́n dọ́gba.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún; ìforúkọsílẹ̀ jẹ́ ọlọ́lá, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. Àmì [a] wà lẹ́yìn gbogbo gbólóhùn nítorí ó ń tọ́ka sí àtúnṣe ọ̀nà tí a lè gbà sọ àṣẹ àkọ́kọ́; [c][b] tẹ̀lé “ẹgbẹ̀rún ọdún” gẹ́gẹ́ bí ipele ìtọ́kasí Gẹ̀ẹ́sì tí a pèsè.
