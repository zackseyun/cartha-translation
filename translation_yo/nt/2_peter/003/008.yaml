  source_fidelity: 'Ìtumọ̀ ìfiwéra àkókò náà jẹ́ olóòtọ́ sí Gíríìkì: “ọjọ́ kan dàbí ẹgbẹ̀rún ọdún” àti ìpadàbọ̀ rẹ̀ pa ὡς mọ́ gẹ́gẹ́ bí àfiwé, kì í ṣe ìdọ́gba. “Lọ́dọ̀ Olúwa” sì yẹ fún παρὰ κυρίῳ. Ṣùgbọ́n “bójú yín” kò jẹ́ ọ̀nà Yorùbá tó dájú tàbí tó hàn gbangba fún λανθανέτω ὑμᾶς (‘kí ó yọ ẹnì kan lọ́wọ́/kí ó sá kúrò ní ìrántí ẹni’).'
