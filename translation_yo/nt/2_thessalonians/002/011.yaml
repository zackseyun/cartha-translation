  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: yo
  text: Nítorí èyí náà, Ọlọ́run ń rán ìṣiṣẹ́ ìṣìnà[a] sí wọn, kí wọ́n lè gba irọ́ náà gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ipa tí ń ṣì ènìyàn lọ́nà,” “ìṣiṣẹ́ ẹ̀tàn,” tàbí, gẹ́gẹ́ bí a ti máa ń túmọ̀ rẹ̀ láti ìgbà pípẹ́, “ìṣìnà tó lágbára.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: nítorí èyí
  rationale: Ó fi ìdí ohun tí a sọ yìí múlẹ̀ nínú ohun tí ó ṣáájú, ó sì pa agbára ìtumọ̀ ‘nítorí’ mọ́ ju lílo ọ̀rọ̀ ìparí lásán lọ.
- source_word: πέμπει
  choice: ń rán ... sí wọn
  rationale: Ìṣe àsìkò ìsinsìnyí yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìṣe tí Ọlọ́run ń ṣe hàn, láìsọ ọ́ di pé ó kàn gbà á láyè.
- source_word: ἐνέργειαν πλάνης
  choice: iṣẹ́ ìṣìnà
  rationale: 'Ó pa àkópọ̀ ọ̀rọ̀ méjèèjì mọ́: iṣẹ́ tàbí ìṣiṣẹ́ tí ó ń ṣiṣẹ́ nípa ìṣìnà. Ó tún yàgò fún fífi agbára àfikún tí kò ṣe kedere nínú ọ̀rọ̀ Gíríìkì kún un.'
- source_word: εἰς τὸ πιστεῦσαι
  choice: kí wọ́n lè ... gbọ́
  rationale: Ó fi ìtumọ̀ ète tàbí àbájáde tí àkópọ̀ Gíríìkì lè ní sílẹ̀, láìfi dandan yan ọ̀kan ṣoṣo nínú wọn.
- source_word: τῷ ψεύδει
  choice: gba irọ́ náà gbọ́
  rationale: Ọ̀rọ̀ atọ́ka náà tọ́ka sí irọ́ kan pàtó nínú àyíká ọ̀rọ̀; gbólóhùn ‘gba ... gbọ́’ sì jẹ́ èdè Yorùbá àdánidá fún πιστεύω pẹ̀lú ohun tí a gbà gbọ́.
theological_decisions:
- issue: Ìṣe Ọlọ́run nínú ìdájọ́ tí ń mú kí ènìyàn le sí i
  choice: Ọlọ́run ń rán iṣẹ́ ìṣìnà sí wọn
  alternative: Ọlọ́run ń jẹ́ kí iṣẹ́ ìṣìnà dé bá wọn
  rationale: Ọlọ́run ni olùṣe gírámà fún πέμπει (‘rán’) nínú Gíríìkì. Nítorí náà, a kò sọ ìṣe náà di fífàyègbà lásán; a pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ láàárín ìdájọ́ Ọlọ́run àti kíkọ òtítọ́ sílẹ̀ gẹ́gẹ́ bí ẹsẹ náà ti gbé e kalẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. ‘Iṣẹ́ ìṣìnà’ pa ìtòlẹ́sẹẹsẹ ἐνέργεια + πλάνη mọ́, bí ó tilẹ̀ jẹ́ pé àlàyé ìsàlẹ̀ ojú ìwé fúnni ní àwọn ọ̀nà Yorùbá tí ó túbọ̀ ṣàlàyé rẹ̀.
