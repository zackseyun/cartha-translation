id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: yo
  text: Kí Olúwa wa Jésù Mèsáyà fúnra rẹ̀, àti Ọlọ́run Baba wa, ẹni tí ó fẹ́ràn wa, tí ó sì fi oore-ọ̀fẹ́ fún wa ní ìṣírí[a] ayérayé àti ìrètí rere,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìtùnú” tàbí “ìfọkànbalẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: fúnra rẹ̀
  rationale: Ó fi ìtẹnumọ́ sí Olúwa Jésù Mèsáyà gẹ́gẹ́ bí ẹni tí yóò ṣe ohun tí àdúrà náà ń béèrè; èdè yìí sì jẹ́ ti Yorùbá àdánidá.
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀ nínú ìtumọ̀
  rationale: Níhìn-ín, δέ jẹ́ àmì ìyípadà pẹ̀lẹ́ nínú àsọyé. Fífi “ṣùgbọ́n” kún un lè mú ìtakora tí kò lágbára nínú Gíríìkì wọ inú ẹsẹ náà.
- source_word: κύριος
  choice: Olúwa
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì yẹ fún akọ́lé Kristi yìí.
- source_word: Ἰησοῦς Χριστὸς
  choice: Jésù Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí akọ́lé ẹni tí a yàn, nítorí náà “Mèsáyà” pa ìtumọ̀ akọ́lé náà mọ́.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: Ọlọ́run Baba wa
  rationale: Ó pa θεός àti πατήρ méjèèjì mọ́ ní ọ̀nà tí ó ṣe déédé ní Yorùbá.
- source_word: ὁ ἀγαπήσας
  choice: ẹni tí ó fẹ́ràn wa
  rationale: A tú participle aorist náà sí gbólóhùn aláṣepọ̀ tí ó ṣe déédé ní Yorùbá, láìfi àlàyé àkókò míì kún un.
- source_word: δοὺς
  choice: tí ó sì ... fún wa ní
  rationale: Ó so ìṣe kejì pọ̀ mọ́ ti àkọ́kọ́ ní ọ̀nà Yorùbá àdánidá, ó sì pa ìṣe fífúnni náà mọ́.
- source_word: παράκλησιν
  choice: ìṣírí
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìṣírí, ìtùnú, tàbí ìfọkànbalẹ̀. “Ìṣírí” bá ọ̀rọ̀ fífi àwọn onígbàgbọ́ múlẹ̀ nínú ẹsẹ tó tẹ̀ lé e mu; àṣàyàn “ìtùnú” wà nínú àlàyé ìsàlẹ̀.
- source_word: αἰωνίαν
  choice: ayérayé
  rationale: Ó sọ pé ìṣírí náà dúró láélá, ó sì jẹ́ ìtumọ̀ Yorùbá tó ṣe déédé fún αἰώνιος.
- source_word: ἐλπίδα ἀγαθὴν
  choice: ìrètí rere
  rationale: Ó pa ànímọ́ rere tí ἀγαθή fún ἐλπίς mọ́ láìṣe àfikún ìtumọ̀.
- source_word: ἐν χάριτι
  choice: fi oore-ọ̀fẹ́
  rationale: Ìlò “fi” fi hàn pé oore-ọ̀fẹ́ ni ọ̀nà tàbí ìpìlẹ̀ tí Ọlọ́run gbà fún wọn ní ìṣírí àti ìrètí.
theological_decisions:
- issue: Àwọn participle ẹyọ kan lẹ́yìn àwọn olùṣe méjì, Olúwa Jésù Mèsáyà àti Ọlọ́run Baba wa
  choice: A pa gbólóhùn aláṣepọ̀ náà mọ́ lẹ́ẹ̀kan ṣoṣo gẹ́gẹ́ bí Gíríìkì, láìsọ ní kedere pé ó tọ́ka sí Baba nìkan tàbí sí àwọn méjèèjì.
  alternative: A lè mú un tọ́ka sí Ọlọ́run Baba wa nìkan, tàbí kí a tún ọ̀rọ̀ náà ṣe láti sọ pé àwọn méjèèjì ni wọ́n fẹ́ràn wa tí wọ́n sì fún wa.
  rationale: Gíríìkì darapọ̀ àwọn olùṣe méjì, ṣùgbọ́n ó lo àwọn modifier ẹyọ kan. Ìtumọ̀ náà kò gbọ́dọ̀ pa àìdánilójú ìṣètò yìí rẹ́ tàbí fi ìpinnu ẹ̀kọ́ ìgbàgbọ́ tí ọ̀rọ̀ náà kò sọ ní tààrà sínú rẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye. A fi àmì ohùn sí ibi tí ó yẹ. A bẹ̀rẹ̀ pẹ̀lú “Kí” nítorí ẹsẹ yìí jẹ́ ìbẹ̀rẹ̀ àdúrà-ìfẹ́-ọkàn tí ọ̀rọ̀-ìṣe rẹ̀ ń tẹ̀ síwájú nínú ẹsẹ 17; àmì kọ́mà ní òpin fi ìtẹ̀síwájú yẹn hàn.
