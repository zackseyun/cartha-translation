  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ó pa ìfẹ̀kànsí αὐτός mọ́ nínú “fúnra rẹ̀,” ó sì mú ìbéèrè-àdúrà tí ó ń tẹ̀ síwájú sí ẹsẹ 17 hàn pẹ̀lú “Kí” àti kọ́mà ìkẹyìn. “Ìṣírí ayérayé” àti “ìrètí rere” jẹ́ ìtumọ̀ tó péye fún παράκλησις αἰωνία àti ἐλπίς ἀγαθή, àti “fi oore-ọ̀fẹ́” lè gbé agbára ọ̀nà/ìpìlẹ̀ ti ἐν χάριτι dáadáa.'
  naturalness: Yorùbá náà jẹ́ èdè ìgbàlódé tó rọrùn, tó bọ̀wọ̀, tí àmì ohùn rẹ̀ péye. Ìṣètò “Kí …, àti …, ẹni tí …” wúlò fún ìbẹ̀rẹ̀ àdúrà yìí, ó sì jẹ́ kí ìbáṣepọ̀ participle ẹyọ kan pẹ̀lú àwọn orúkọ méjì má ṣe di ìtumọ̀ tí a ti pinnu ju ti Gíríìkì lọ.
  terminology: “Olúwa,” “Jésù Mèsáyà,” “Ọlọ́run Baba wa,” àti “oore-ọ̀fẹ́” jẹ́ àwọn ọ̀rọ̀ tó bójú mu nínú Yorùbá Bíbélì òde-òní. Àlàyé ìsàlẹ̀ ní ibi tí ó tọ́, lẹ́yìn “ìṣírí,” ó sì ń fi àwọn ìtumọ̀ lèksíkà mìíràn fún παράκλησις hàn láìyí ọ̀rọ̀ ẹsẹ náà padà.
