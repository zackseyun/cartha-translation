id: 2TH.2.7
reference: 2 Thessalonians 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: yo
  text: Nítorí ohun ìjìnlẹ̀ ti àìlófin ti ń ṣiṣẹ́ báyìí; kìkì ẹni tí ó ń dí i lọ́wọ́ nísinsin yìí ni yóò máa dí i lọ́wọ́ títí yóò fi kúrò ní ọ̀nà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “títí a ó fi yọ ọ́ kúrò,” tàbí “títí a ó fi mú un kúrò lójú ọ̀nà.” Ọ̀rọ̀ Gíríìkì kò sọ bí ìkúrò náà ṣe ṣẹlẹ̀ ní kedere, bẹ́ẹ̀ ni kò sọ ẹni tí ẹni tí ń dí i lọ́wọ́ náà jẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: ohun ìjìnlẹ̀
  rationale: Ó pa ìtumọ̀ ohun tí ó farasin tàbí tí kò tíì hàn gbangba mọ́, bí Pọ́ọ̀lù ṣe sábà ń lo ọ̀rọ̀ náà, láì sọ ọ́ di àdììtú lásán.
- source_word: ἐνεργεῖται
  choice: ti ń ṣiṣẹ́ báyìí
  rationale: Ó fi hàn pé agbára tàbí iṣẹ́ náà ti ń lọ lọ́wọ́ ní àkókò yìí, ní èdè Yorùbá tó ṣe déédéé.
- source_word: ἀνομίας
  choice: ìwà àìlófin
  rationale: Èyí tẹ̀ lé ìtumọ̀ tààrà ti ἀνομία, ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ ìṣọ̀tẹ̀ sí ìlànà Ọlọ́run.
- source_word: μόνον
  choice: ṣùgbọ́n
  rationale: Ní àyíká gbólóhùn yìí, ó mú ààlà tàbí ìyàtọ̀ tó tẹ̀ lé wá ní ọ̀nà adayeba; ìtumọ̀ ìdíwọ́ náà tún hàn nínú ìṣètò gbogbo gbólóhùn.
- source_word: ὁ κατέχων
  choice: ẹni tí ó ń dá a dúró
  rationale: Ó pa àpèjúwe ẹni náà mọ́ láì dá ẹni tí ó jẹ́ mọ̀, ó sì mú ìtumọ̀ dídènà tàbí dídá ohun kan dúró jáde.
- source_word: ἄρτι
  choice: nísinsin yìí
  rationale: Ó tọ́ka sí iṣẹ́ dídènà tí ẹni náà ń ṣe ní àkókò ìsinsin.
- source_word: ἕως ἐκ μέσου γένηται
  choice: títí yóò fi kúrò ní àárín
  rationale: Ó pa àwòrán jíjẹ́ tàbí bíbọ̀ kúrò ní àárín mọ́, láì sọ pé ẹlòmíràn ló yọ ẹni náà kúrò.
theological_decisions:
- issue: Ta ni ὁ κατέχων, ‘ẹni tí ó ń dá a dúró’
  choice: A pè é ní ‘ẹni tí ó ń dá a dúró’ láì sọ ẹni tí ó jẹ́.
  alternative: Ìjọba Róòmù, ìjọba ènìyàn, Ẹ̀mí Mímọ́, áńgẹ́lì kan, Pọ́ọ̀lù tàbí ìwàásù àwọn aposteli.
  rationale: Ẹsẹ yìí kò dá ẹni náà mọ̀; nítorí náà, ìtumọ̀ náà gbọ́dọ̀ pa àìmọ̀ yìí mọ́, kó má sì yan èrò ẹ̀kọ́ òpin ayé kan.
- issue: Olùṣe nínú ἕως ἐκ μέσου γένηται
  choice: ‘títí yóò fi kúrò ní àárín’
  alternative: ‘títí a ó fi yọ ọ́ kúrò’ tàbí ‘títí a ó fi mú un kúrò lójú ọ̀nà.’
  rationale: Gíríìkì kò sọ ní kedere pé ẹnì kan ló yọ ọ́ kúrò; ìtumọ̀ yìí kò fi olùṣe kan kún ọ̀rọ̀ náà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó lọ́lá, tó sì ṣeé yé fún ọ̀pọ̀ ènìyàn. ‘Ohun ìjìnlẹ̀’ yẹra fún ìtumọ̀ àdììtú lásán; ‘kúrò ní àárín’ sì pa àìṣekedere Gíríìkì mọ́ nípa ẹni tó lè fa ìkúrò náà.
