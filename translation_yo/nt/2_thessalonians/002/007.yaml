revisions:
- from: Nítorí ohun ìjìnlẹ̀ ìwà àìlófin ti ń ṣiṣẹ́ báyìí; ṣùgbọ́n ẹni tí ó ń dá a dúró nísinsin yìí[a] yóò máa ṣe bẹ́ẹ̀ títí yóò fi kúrò ní àárín[b].
  to: Nítorí ohun ìjìnlẹ̀ ti àìlófin ti ń ṣiṣẹ́ báyìí; kìkì ẹni tí ó ń dí i lọ́wọ́ nísinsin yìí ni yóò máa dí i lọ́wọ́ títí yóò fi kúrò ní ọ̀nà[a].
  rationale: Àtúnṣe náà fi μόνον hàn nípasẹ̀ ‘kìkì,’ ó yan ‘àìlófin’ fún ἀνομία, ó sì lo ‘kúrò ní ọ̀nà’ fún ἐκ μέσου γένηται. Ìtumọ̀ náà ń pa àìṣekedere ọrọ̀ Gíríìkì mọ́ nípa ẹni tí ń dí i lọ́wọ́ àti nípa bó ṣe kúrò ní ọ̀nà. Àmì ìsàlẹ̀ kan ṣoṣo ni a fi sí ibi tí ó kan yíyẹ̀ ìtumọ̀ gbolohun ìkẹyìn; àlàyé nípa ìdánimọ̀ olùdènà ni a ṣàfikún sínú rẹ̀ láti yọ àmì ìsàlẹ̀ àkọ́kọ́ tí kò ní ìtọ́kasí kankan kúrò.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:22:15Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìṣiṣẹ́ ìsinsin yìí ti ‘ohun ìjìnlẹ̀’ àti àìdánimọ̀ ẹni tí ń dá ìwà àìlófin dúró hàn dáadáa. Síbẹ̀, ‘ṣùgbọ́n’ nìkan kò tú μόνον (‘kìkì/ní ọwọ́ ẹni náà nìkan’) jáde dáadáa. ‘Kúrò ní àárín’ sì jẹ́ gbolohun tí kò dùn pupọ̀ ní Yorùbá nínú àyíká yìí; ‘kúrò ní ọ̀nà’ ń pa ìtumọ̀ àfiwé náà mọ́ dáadáa láì sọ olùṣe ìkúrò di mímọ̀.
  naturalness: ‘Ohun ìjìnlẹ̀ ti àìlófin’ àti ‘ń dí i lọ́wọ́’ jẹ́ Yorùbá ìgbàlódé tó dájú, tó sì rọrùn láti ka. Ìṣètò ‘kìkì ẹni ... ni yóò máa ...’ ń mú gbolohun Gíríìkì tí ó gé kúrú wá sí Yorùbá ní kedere, láì fi ìdánimọ̀ tuntun kún un.
  terminology: A rọ́pò ‘ìwà àìlófin’ pẹ̀lú ‘àìlófin’ láti sún mọ́ ἀνομία (‘lawlessness’) dípò kí a fi mọ́ ìhùwàsí nìkan. ‘Ohun ìjìnlẹ̀’ bójú mu μυστήριον nínú ìlò Pọ́ọ̀lù. ‘Ẹni tí ń dí i lọ́wọ́’ ń pa ìtumọ̀ κατέχων mọ́, ó sì yẹra fún ṣíṣọ ẹni náà ní ẹni kan pàtó.
  issues:
  - severity: medium
    issue: μόνον kò hàn nínú ìtumọ̀
    rationale: ‘Ṣùgbọ́n’ lè fi ìyàtọ̀ hàn, ṣùgbọ́n kò fi ìdíwọ́ ‘only’ ti μόνον hàn. A gbọdọ̀ lo ‘kìkì’ tàbí ìṣètò tó bá a dọ́gba.
  - severity: low
    issue: ‘kúrò ní àárín’ kò jẹ́ ìlò Yorùbá tó rọrùn nínú àyíká yìí
    rationale: Bí ó tilẹ̀ jẹ́ pé ó sún mọ́ ‘out of the midst,’ ó lè dà bí ibi gidi. ‘Kúrò ní ọ̀nà’ jẹ́ àfiwé Yorùbá tó dájú fún ἐκ μέσου, ó sì kò fi olùṣe ìkúrò kún un.
  - severity: low
    issue: ‘ìwà àìlófin’ lè dín ìtumọ̀ ἀνομία kù sí ìhùwàsí
    rationale: Àìlófin nínú ẹsẹ yìí jẹ́ agbára/ipò ìṣọ̀tẹ̀ sí òfin, kì í ṣe ìwà ẹni kọọkan nìkan.
