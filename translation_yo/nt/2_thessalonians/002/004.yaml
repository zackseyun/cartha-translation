id: 2TH.2.4
reference: 2 Thessalonians 2:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: yo
  text: ẹni tí ó ń tako, tí ó sì ń gbé ara rẹ̀ ga ju gbogbo ohun tí a ń pè ní ọlọ́run tàbí ohun ìjọsìn lọ, débi pé ó jókòó nínú tẹ́ńpìlì Ọlọ́run[b], tí ó sì ń fi ara rẹ̀ hàn pé Ọlọ́run ni òun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ó ń fi ara rẹ̀ hàn pé ọlọ́run kan ni òun.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ibi mímọ́ Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντικείμενος
  choice: ẹni tí ó ń tako
  rationale: Ọ̀rọ̀ olùṣe onítẹ̀síwájú tí a lò gẹ́gẹ́ bí orúkọ ni; ó pa ìtumọ̀ ìtakò tí ń bá a lọ mọ́ láìsọ ọ́ di oyè pàtó.
- source_word: ὑπεραιρόμενος
  choice: tí ó sì ń gbé ara rẹ̀ ga ju ... lọ
  rationale: Ó fi ìgbéga-ẹni-hàn àti ìjẹ́-gíga-ju-hàn ní Yorùbá àdánidá.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: ju gbogbo ohun tí a ń pè ní ọlọ́run ... lọ
  rationale: “Ju ... lọ” bá ọ̀rọ̀ ìgbéga mu, “ohun tí a ń pè ní ọlọ́run” sì kò fìdí òtítọ́ ipò ọlọ́run náà múlẹ̀.
- source_word: σέβασμα
  choice: ohun ìjọsìn
  rationale: Ó túmọ̀ sí ohun èyíkéyìí tí a ń bọ̀ tàbí tí a ń fi ọ̀wọ̀ ẹ̀sìn fún, kì í ṣe òrìṣà nìkan.
- source_word: ὥστε
  choice: débi pé
  rationale: Ó fi àbájáde ohun tí a sọ ṣáájú hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: nínú tẹ́ńpìlì Ọlọ́run
  rationale: Bó tilẹ̀ jẹ́ pé εἰς sábà ń tọ́ka sí ìwọlé, pẹ̀lú καθίσαι ó yọrí sí jíjókòó nínú ibi náà; “tẹ́ńpìlì” jẹ́ kedere, a sì pa “ibi mímọ́” mọ́ gẹ́gẹ́ bí àṣàyàn.
- source_word: καθίσαι
  choice: ó jókòó
  rationale: Ó sọ ìṣe jíjókòó náà ní kedere; àyíká ọ̀rọ̀ ló ń fún un ní ìrísí jíjókòó lórí ìtẹ́, láìfi ìtumọ̀ àfikún sínú ọ̀rọ̀ náà.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: ó ń fi ara rẹ̀ hàn
  rationale: Ó pa ìtumọ̀ fífi ara ẹni hàn tàbí mímú ara ẹni farahàn mọ́, láìsọ pé ó ṣe ìkéde ọ̀rọ̀ ní pàtó.
- source_word: ὅτι ἔστιν θεός
  choice: pé Ọlọ́run ni òun
  rationale: Ó mú ẹ̀sùn gíga jù lọ nínú àyíká ọ̀rọ̀ náà jáde, ṣùgbọ́n kò jẹ́rìí pé ẹni náà jẹ́ Ọlọ́run ní tòótọ́; àṣàyàn “ọlọ́run kan” wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bí θεός ní ìparí ṣe yẹ kí a túmọ̀ sí “Ọlọ́run” tàbí “ọlọ́run kan”
  choice: Ọlọ́run
  alternative: ọlọ́run kan
  rationale: Jíjókòó rẹ̀ nínú tẹ́ńpìlì Ọlọ́run àti fífi ara rẹ̀ hàn ní ọ̀nà yìí mú kí ẹ̀sùn pé ó ń pe ara rẹ̀ ní Ọlọ́run lágbára jù; síbẹ̀, nítorí θεός kò ní àpilẹ̀kọ, a pa àṣàyàn kejì mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Bí ναός ṣe yẹ kí a túmọ̀ sí “tẹ́ńpìlì” tàbí “ibi mímọ́”
  choice: tẹ́ńpìlì Ọlọ́run
  alternative: ibi mímọ́ Ọlọ́run
  rationale: “Tẹ́ńpìlì” jẹ́ ọ̀rọ̀ tó yé àwọn òǹkàwé lónìí, kò sì pinnu bóyá ibi gidi tàbí àpẹẹrẹ ni Pọ́ọ̀lù ń tọ́ka sí; “ibi mímọ́” lè tẹnumọ́ apá inú ilé náà sí i.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó ti bá ìlò àdánidá mu. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo “tẹ́ńpìlì” gẹ́gẹ́ bí ọ̀rọ̀ tí ó wọ́pọ̀, a sì yẹra fún fífi ìtumọ̀ ẹ̀kọ́ ìsìn kan pàtó lé àwòrán náà lórí.
