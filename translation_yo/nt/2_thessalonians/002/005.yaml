  yaml_path: translation/nt/2_thessalonians/002/005.yaml
  text: Do you not remember that while I was still with you, I was telling you these things?
translation:
  language: yo
  text: Ṣé ẹ kò rántí pé nígbà tí mo ṣì wà pẹ̀lú yín, mo máa ń sọ àwọn nǹkan wọ̀nyí fún yín?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: rántí
  rationale: Ọ̀rọ̀ náà béèrè bóyá àwọn olùgbọ́ ṣì fi ẹ̀kọ́ tí wọ́n ti gbọ́ sí ìrántí; “rántí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó bá ìbéèrè ọ̀rọ̀-ìwúrí yìí mu.
- source_word: ἔτι
  choice: ṣì
  rationale: “Ṣì” fi hàn pé ìwàpọ̀ Pọ́ọ̀lù pẹ̀lú wọn ń bá a lọ ní àkókò tí ó ń sọ̀rọ̀ náà.
- source_word: ὢν πρὸς ὑμᾶς
  choice: nígbà tí mo ṣì wà pẹ̀lú yín
  rationale: Gbólóhùn yìí tú participle náà sí ọ̀nà àkókò tí ó ṣe kedere, ó sì tú πρὸς ὑμᾶς gẹ́gẹ́ bí wíwà ní ojúkojú pẹ̀lú wọn.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó pa iye púpọ̀ demonstrative náà mọ́, ó sì tọ́ka sí àwọn ọ̀ràn tí Pọ́ọ̀lù ṣẹ̀ṣẹ̀ ń jíròrò.
- source_word: ἔλεγον
  choice: mo máa ń sọ
  rationale: Àkójọpọ̀ “máa ń” fi ìṣe àtúnṣe tàbí ìṣe tí ń lọ lọ́wọ́ ní àkókò àtijọ́ hàn, ní ìbámu pẹ̀lú imperfect Greek.
- source_word: οὐ ... ὅτι
  choice: Ṣé ẹ kò rántí pé ...?
  rationale: “Pé” ṣàgbékalẹ̀ ohun tí wọ́n yẹ kí wọ́n rántí; ìbéèrè òdì náà sì dúró gẹ́gẹ́ bí ìbéèrè ọ̀rọ̀-ìwúrí.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ọ̀rọ̀ náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “ẹ/yín” fún plural, àti “máa ń sọ” láti pa ìtumọ̀ imperfect mọ́.
