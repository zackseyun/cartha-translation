  source_fidelity: Ìtumọ̀ náà fi ìbéèrè òdì οὐ μνημονεύετε hàn dáadáa nínú “Ṣé ẹ kò rántí pé…?” Ó tú ἔτι ὢν πρὸς ὑμᾶς sí “nígbà tí mo ṣì wà pẹ̀lú yín,” ó pa plural ταῦτα mọ́ nínú “àwọn nǹkan wọ̀nyí,” ó sì ń ṣàfihàn imperfect ἔλεγον nípa “mo máa ń sọ.” Kò ṣàfikún tàbí yọ ìtumọ̀ pàtàkì kankan kúrò.
  naturalness: Yorùbá náà jẹ́ ti ìlò òde òní, ó sì yẹ fún ìwé mímọ́ ní register tó ní ìwọ̀ntúnwọ̀nsì. “Ṣé ẹ kò rántí pé” àti “nígbà tí mo ṣì wà pẹ̀lú yín” jẹ́ gbolohun àdánidá. Àmì ohùn àti àmì ìkọ̀wé wa ní ọ̀nà tó bójú mu.
  terminology: “Rántí,” “ṣì,” “wà pẹ̀lú yín,” àti “àwọn nǹkan wọ̀nyí” jẹ́ àwọn yíyan tó mọ́, tó sì bá èdè Gíríìkì mu. Kò sí ọ̀rọ̀ ẹ̀kọ́ ìjọsìn àrà ọ̀tọ̀ tí ó nílò ìṣàtúnṣe tàbí àlàyé ẹsẹ̀ ìsàlẹ̀.
