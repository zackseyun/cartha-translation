id: 2TH.2.12
reference: 2 Thessalonians 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα κριθῶσιν ⸀πάντες οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες ⸀τῇ ἀδικίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: yo
  text: kí a lè ṣe ìdájọ́ lórí gbogbo àwọn tí kò gba òtítọ́ gbọ́, ṣùgbọ́n tí inú wọn dùn sí àìṣòdodo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí a lè dá gbogbo wọn lẹ́bi.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè túmọ̀ sí ìdájọ́ tí kò dára nínú ọ̀rọ̀ àyíká yìí, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ rẹ̀ ní tààràtà jù ni “ṣe ìdájọ́ lórí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: kí a lè
  rationale: Ó so gbólóhùn yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ète tàbí àbájáde, láìfi tipátipá yan ọ̀kan nínú méjèèjì.
- source_word: κριθῶσιν
  choice: ṣe ìdájọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtàkì sí jíjẹ́ ẹni tí a dá lẹ́jọ́. Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ àyíká tọ́ka sí ìdájọ́ tí kò dára, a kò fi ‘dálẹ́bi’ sínú ọ̀rọ̀ pàtàkì kí ìtumọ̀ Gíríìkì má bàa le ju bó ṣe rí lọ.
- source_word: πάντες
  choice: gbogbo àwọn
  rationale: Ó mú ìtumọ̀ gbogbo àwọn ènìyàn tí àwọn àpólà tó tẹ̀ lé ń ṣàpèjúwe jáde ní èdè Yorùbá àdánidá.
- source_word: οἱ μὴ πιστεύσαντες
  choice: tí kò gba ... gbọ́
  rationale: Ìṣètò ‘gba ... gbọ́’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún gbígbà ohun kan gbọ́, ó sì bá ohun tí a gbà gbọ́, ìyẹn òtítọ́, mu.
- source_word: τῇ ἀληθείᾳ
  choice: òtítọ́
  rationale: Ó tọ́ka sí òtítọ́ pàtó tí ọ̀rọ̀ àyíká ń sọ, kì í ṣe òtítọ́ gẹ́gẹ́ bí èrò àìlópin nìkan.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó pa ìyàtọ̀ líle mọ́ láàárín àìgbàgbọ́ nínú òtítọ́ àti inú dídùn sí àìṣòdodo.
- source_word: εὐδοκήσαντες
  choice: tí inú wọn dùn sí
  rationale: Ó mú inú dídùn àti ìfẹ́ inú sí ohun kan jáde, kì í ṣe fífi ọpọlọ fọwọ́ sí i lásán.
- source_word: τῇ ἀδικίᾳ
  choice: àìṣòdodo
  rationale: Ó pa ìwọ̀n ọ̀rọ̀ ìwà àti ẹ̀kọ́ ìgbàgbọ́ ti ἀδικία mọ́, ó sì lè gba ìtumọ̀ ìwà búburú àti ohun tí kò tọ́.
theological_decisions:
- issue: Bóyá κριθῶσιν yẹ kí a túmọ̀ sí jíjẹ́ ẹni tí a dá lẹ́jọ́ tàbí ẹni tí a dá lẹ́bi
  choice: ṣe ìdájọ́
  alternative: dálẹ́bi
  rationale: Ọ̀rọ̀ àyíká fi hàn pé ìdájọ́ náà kò dára, ṣùgbọ́n κρίνω fúnra rẹ̀ ní ìtumọ̀ gbòòrò ti dídájọ́. Ọ̀rọ̀ pàtàkì pa ìyàtọ̀ yìí mọ́, àlàyé ìsàlẹ̀ sì sọ àṣàyàn tó lágbára jù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. A lo ‘ṣe ìdájọ́’ dípò ‘dá lẹ́jọ́’ láti yẹra fún ìtumọ̀ Yorùbá tí ó sábà máa ń sún mọ́ fífi ẹ̀sùn tàbí ìdálẹ́bi, kí àìdánilójú inú ọ̀rọ̀ Gíríìkì lè dúró.
