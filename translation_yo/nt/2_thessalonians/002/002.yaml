id: 2TH.2.2
reference: 2 Thessalonians 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: yo
  text: kí ẹ má ṣe tètè jẹ́ kí ìrònú yín rú, kí ẹ má sì fòyà, yálà nípasẹ̀ ẹ̀mí kan[a], tàbí nípasẹ̀ ọ̀rọ̀ kan, tàbí nípasẹ̀ lẹ́tà kan—gẹ́gẹ́ bí ẹni pé ìhìn náà ti ọ̀dọ̀ wa wá—tí ó ń sọ pé ọjọ́ Olúwa ti dé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àsọjáde ti ẹ̀mí” tàbí “ìṣípayá àsọtẹ́lẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ti wà níhìn-ín báyìí.” Ọ̀rọ̀-ìṣe pípé ní èdè Gíríìkì lè fi hàn pé wọ́n ń sọ pé ọjọ́ Olúwa ti dé, ó sì ti wà ní àkókò náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: yára
  rationale: Ó ń ṣe àpèjúwe bí ìmì àti ìdàrúdàpọ̀ náà ṣe lè ṣẹlẹ̀; ‘yára’ dá ìkìlọ̀ náà dúró nípa bí wọ́n ṣe lè tètè dàrú.
- source_word: σαλευθῆναι
  choice: kí a má ṣe yára mì yín
  rationale: Èyí pa àwòrán ìmì nínú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ èdè Yorùbá tí ó ṣeé lóye.
- source_word: ἀπὸ τοῦ νοὸς
  choice: kúrò nínú ìrònú yín
  rationale: Ó pa ìtumọ̀ ọkàn tàbí òye tí ó ti fìdí múlẹ̀ mọ́ láì fi ìtumọ̀ kan ṣoṣo mú un.
- source_word: θροεῖσθαι
  choice: kí ẹ̀rù má sì bà yín
  rationale: Gbólóhùn yìí fi ìdàrúdàpọ̀ àti ìpayà tí ọ̀rọ̀ náà ń tọ́ka sí hàn ní Yorùbá àdánidá.
- source_word: πνεύματος
  choice: ẹ̀mí kan
  rationale: Ìtumọ̀ yìí sún mọ́ ọ̀rọ̀ Gíríìkì, ó sì pa àìdánilójú mọ́ bóyá ó ń tọ́ka sí ẹ̀mí kan tàbí ọ̀rọ̀ ìṣípayá tí a pè ní ti ẹ̀mí.
- source_word: λόγου
  choice: ọ̀rọ̀ kan
  rationale: Nínú àkójọpọ̀ yìí, ó lè túmọ̀ sí ọ̀rọ̀ ẹnu tàbí ìhìn tí a gbé dé; ‘ọ̀rọ̀ kan’ pa ìwọ̀nyí mọ́ láì ṣàlàyé jù.
- source_word: ἐπιστολῆς
  choice: lẹ́tà kan
  rationale: Èyí ni ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere fún ìwé ìbánisọ̀rọ̀.
- source_word: ὡς δι’ ἡμῶν
  choice: bí ẹni pé ó ti ọ̀dọ̀ wa wá
  rationale: Ó fi ẹ̀sùn pé wọ́n ń fi lẹ́tà náà kàn Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ hàn ní kedere.
- source_word: ἐνέστηκεν
  choice: ti dé
  rationale: Àkókò pípé ọ̀rọ̀-ìṣe náà lè fi hàn pé ọjọ́ náà ti dé, tí ó sì ti wà báyìí; àṣàyàn kejì wà nínú àlàyé ìsàlẹ̀.
- source_word: ἡμέρα τοῦ κυρίου
  choice: ọjọ́ Olúwa
  rationale: Èyí ni gbólóhùn àsọtẹ́lẹ̀ nípa ọjọ́ ìdájọ́ tàbí ìfarahàn Olúwa, kì í ṣe ọjọ́ ìjọsìn ọ̀sẹ̀ kan.
theological_decisions:
- issue: Ìtumọ̀ ἐνέστηκεν nínú ọ̀rọ̀ nípa ọjọ́ Olúwa
  choice: ti dé
  alternative: wà níhìn-ín báyìí / ti dé tẹ́lẹ̀
  rationale: Ọ̀rọ̀-ìṣe pípé náà so dídé pọ̀ mọ́ ipò tí ó ń bá a lọ. ‘Ti dé’ jẹ́ èdè Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ pé ọjọ́ náà ti wà ní àkókò yẹn mọ́.
- issue: Ìtumọ̀ πνεύματος láàárín àwọn ọ̀nà mẹ́ta tí ìhìn náà lè gbà dé
  choice: ẹ̀mí kan
  alternative: àsọjáde ti ẹ̀mí / ìṣípayá àsọtẹ́lẹ̀ / Ẹ̀mí Mímọ́
  rationale: Nítorí orúkọ náà kò ní àtókasi pàtó nínú Gíríìkì, àyíká ọ̀rọ̀ sì ń tọ́ka sí ohun tí a lè pè ní ìṣípayá, a pa ìtumọ̀ gígùn rẹ̀ mọ́ nínú ọ̀rọ̀ àkọ́kọ́, a sì fi àwọn àṣàyàn ṣàlàyé ní ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ. A pa àwòrán ‘mì’ mọ́, ṣùgbọ́n a lo ‘kí ẹ̀rù má sì bà yín’ fún ọ̀rọ̀ ìpayà kí gbólóhùn náà lè ṣàn lọ́nà àdánidá.
