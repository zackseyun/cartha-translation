  source_fidelity: 'Ìtumọ̀ náà ń mú ọ̀pọ̀ èrò Gíríìkì náà dáadáa: ìkìlọ̀ sí ìpayà, ọ̀nà mẹ́ta tí ìhìn èké lè gbà dé, àti ẹ̀sùn pé ọjọ́ Olúwa ti dé. Ṣùgbọ́n “kí a má ṣe ... mì yín” yí àìmọ̀ ẹni tí ó ń ṣe iṣẹ́ nínú σαλευθῆναι padà sí ìṣe tí “a” ń ṣe; a tún lè mú ìbáṣepọ̀ ὡς δι’ ἡμῶν hàn kedere pé ó kan gbogbo àwọn orísun mẹ́ta, kì í ṣe lẹ́tà nìkan.'
