  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: yo
  text: Nígbà náà ni a ó sì fi ẹni aláìlófin náà hàn, ẹni tí Olúwa Jésù yóò pa pẹ̀lú èémí ẹnu rẹ̀[a], tí Olúwa Jésù yóò sì sọ ọ́ di asán nípasẹ̀ ìfarahàn dídé rẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ẹ̀mí ẹnu rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “èémí” tàbí “ẹ̀mí”; “èémí” ló bá gbólóhùn yìí mu jù.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nípasẹ̀ ìfarahàn ìwàníhìn-ín rẹ̀.” Nínú àyíká yìí, “dídé” ni ìtumọ̀ παρουσία tó wọ́pọ̀ jù, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà tún lè túmọ̀ sí “ìwàníhìn-ín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: a ó fi … hàn
  rationale: Ó pa ohùn àìṣe ti ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé a ó mú ẹni náà farahàn láìsọ ẹni tó mú un farahàn.
- source_word: ὁ ἄνομος
  choice: ẹni aláìlófin náà
  rationale: Ó tẹ̀ lé ajẹtífù tí a lò gẹ́gẹ́ bí orúkọ ní Gíríìkì, láìfi ọ̀rọ̀ bí ‘ọkùnrin’ kún un.
- source_word: κύριος Ἰησοῦς
  choice: Olúwa Jésù
  rationale: Èyí ni orúkọ oyè àti orúkọ ẹni tí ó bá ìlò Májẹ̀mú Tuntun àti Yorùbá ìgbàlódé mu.
- source_word: ἀνελεῖ
  choice: yóò pa
  rationale: Ọ̀rọ̀ náà ní agbára pípa ẹni; ‘pa’ ṣe kedere, ó sì jẹ́ Yorùbá àdánidá ju gbólóhùn àtijọ́ tàbí aláìlágbára lọ.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: pẹ̀lú èémí ẹnu rẹ̀
  rationale: ‘Èémí’ bá àkójọpọ̀ ọ̀rọ̀ náà àti àwòrán ìdájọ́ nínú Aísáyà 11:4 mu dáadáa; ‘ẹ̀mí’ ṣì ṣeé ṣe nípa ìtumọ̀ ọ̀rọ̀ πνεῦμα, a sì pa á mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: καταργήσει
  choice: yóò sọ ọ́ di asán
  rationale: Ó fi ìmú agbára àti iṣẹ́ ẹni náà kúrò pátápátá hàn, láìfi dandan túmọ̀ rẹ̀ sí ìparun ohun gbogbo tí ó jẹ́.
- source_word: τῇ ἐπιφανείᾳ
  choice: nípasẹ̀ ìfarahàn
  rationale: ‘Ìfarahàn’ sọ ìfarahàn síta tàbí fífi ara hàn ní kedere, láìfi ìmọ́lẹ̀ tàbí ògo tí kò fara hàn gbangba nínú ọ̀rọ̀ náà kún un.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: dídé rẹ̀
  rationale: Nínú ọ̀rọ̀ nípa ìkẹyìn, παρουσία sábà ń tọ́ka sí dídé Kristi; ‘wíwàníhìn-ín rẹ̀’ jẹ́ àlàyé míì tí ìtumọ̀ ọ̀rọ̀ náà lè gbà.
theological_decisions:
- issue: Ìdánimọ̀ àti àpèjúwe alatako ìkẹyìn
  choice: ẹni aláìlófin náà
  alternative: ọkùnrin aláìlófin náà
  rationale: Ẹsẹ̀ yìí fúnra rẹ̀ lo ajẹtífù ὁ ἄνομος gẹ́gẹ́ bí orúkọ, kì í ṣe gbólóhùn gígùn tí ó wà ní àyíká rẹ̀; ìtumọ̀ yìí kò fi akọ tàbí ọ̀rọ̀ míì tí kò sí nínú ẹsẹ̀ náà kún un.
- issue: Ọ̀nà tí Olúwa Jésù gbà ṣẹ́gun
  choice: pẹ̀lú èémí ẹnu rẹ̀
  alternative: pẹ̀lú ẹ̀mí ẹnu rẹ̀
  rationale: ‘Èémí’ ni ìtumọ̀ tó bá àkójọpọ̀ ọ̀rọ̀ yìí mu jù, ṣùgbọ́n ‘ẹ̀mí’ tún wà láàárín ìtumọ̀ πνεῦμα; nítorí náà a pa ìyàtọ̀ náà mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ παρουσία nínú ọ̀rọ̀ nípa ìkẹyìn
  choice: dídé rẹ̀
  alternative: wíwàníhìn-ín rẹ̀
  rationale: ‘Dídé’ ni ìtumọ̀ àyíká tó wọ́pọ̀ jù fún παρουσία níbí, ṣùgbọ́n ‘wíwàníhìn-ín’ jẹ́ apá gidi kan nínú àgbègbè ìtumọ̀ ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. A lo ìṣọ̀kan tó jẹ́ àdánidá ní Yorùbá láìdín agbára àwòrán ìdájọ́ Gíríìkì kù.
