id: 2TH.2.1
reference: 2 Thessalonians 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: yo
  text: A ń bẹ̀ yín, ẹ̀yin ará[b], ní ti wíwá Olúwa wa Jésù Mèsáyà[a] àti ìkójọpọ̀ wa sọ́dọ̀ rẹ̀,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Jésù Kristi.” A túmọ̀ oyè Gíríìkì Χριστός sí “Mèsáyà” níhìn-ín láti pa ìtumọ̀ rẹ̀ mọ́.
    reason: alternative_reading
  - marker: b
    text: “Ará” ni ọ̀nà tí Pọ́ọ̀lù fi ń pe àwọn tí ó ń kọ̀wé sí; nínú àyíká yìí, ó ṣeé ṣe kí ó ń bá gbogbo àwùjọ àwọn onígbàgbọ́ sọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: àwa ń bẹ̀ yín
  rationale: Níhìn-ín, ọ̀rọ̀ náà jẹ́ ẹ̀bẹ̀ oníwà pẹ̀lẹ́ tí Pọ́ọ̀lù fi ń bẹ àwọn olùgbọ́ rẹ̀, kì í ṣe àṣẹ líle. “Àwa ń bẹ̀ yín” jẹ́ Yorùbá àdánidá tí ó pa agbára ọ̀rọ̀ náà mọ́.
- source_word: δὲ
  choice: a kò túmọ̀ ọ́ ní ọ̀rọ̀ ọ̀tọ̀
  rationale: δὲ ń samisi ìyípadà sí kókó tuntun tí ó ní ìbáṣepọ̀ pẹ̀lú ohun tó ṣáájú. Ìṣètò gbólóhùn Yorùbá ti mú ìyípadà yìí hàn láìfi ọ̀rọ̀ ìgbà bí “nísinsin yìí” kún un.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀nà ìpè Yorùbá tó bójú mu fún àwọn ọmọ ìjọ; ó lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́ láìsọ ìtumọ̀ ẹbí inú ọ̀rọ̀ náà nù.
- source_word: ὑπὲρ
  choice: ní ti
  rationale: Ní àyíká yìí, ὑπέρ ń mú kókó tí ẹ̀bẹ̀ náà dá lé wá, kì í ṣe anfàní ẹni kan. “Ní ti” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: παρουσίας
  choice: wíwá
  rationale: Bí ó tilẹ̀ jẹ́ pé παρουσία lè túmọ̀ sí wíwà níbẹ̀, ní àyíká ọjọ́ iwájú nípa Jésù ó ń tọ́ka sí dídé rẹ̀. “Wíwá” pa ìtumọ̀ náà mọ́ láìfikún ètò ẹ̀kọ́ ọjọ́ ìkẹyìn kan.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” pa ìtumọ̀ àṣẹ àti oyè ẹ̀kọ́ ìgbàgbọ́ ti κύριος mọ́, ó sì jẹ́ ọ̀rọ̀ Bíbélì Yorùbá tí gbogbo ènìyàn mọ̀.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níhìn-ín, nítorí náà a túmọ̀ rẹ̀ sí “Mèsáyà” dípò kí a kàn ṣe àfọwọ́kọ rẹ̀ bí orúkọ.
- source_word: ἐπισυναγωγῆς
  choice: ìkójọpọ̀ wa
  rationale: Ọ̀rọ̀ náà túmọ̀ sí kíkó àwọn ènìyàn jọ. “Ìkójọpọ̀ wa” pa ìtumọ̀ yìí mọ́ láìsọ ọ́ di ilé-iṣẹ́ tàbí àjọ pàtó kan.
- source_word: ἐπ’ αὐτόν
  choice: sọ́dọ̀ rẹ̀
  rationale: Pẹ̀lú ἐπισυναγωγή, gbólóhùn yìí fi ìtọ́sọ́nà sí ọ̀dọ̀ Kristi hàn. “Sọ́dọ̀ rẹ̀” jẹ́ Yorùbá àdánidá fún ìkójọpọ̀ tí ó dojú kọ ẹni náà.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú oyè nípa Jésù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn yìí Χριστός ní agbára oyè “Ẹni Àmì Òróró.” “Mèsáyà” mú ìtumọ̀ oyè náà hàn, nígbà tí àlàyé ìsàlẹ̀ fi “Kristi” pamọ́ gẹ́gẹ́ bí àṣàyàn ìbílẹ̀.
- issue: Àwọn tí ἀδελφοί ń tọ́ka sí
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin àti arábìnrin
  rationale: “Ará” bá ọ̀nà ìkíni Pọ́ọ̀lù mu, ó sì lè gba gbogbo ìjọ sínú rẹ̀. Àlàyé ìsàlẹ̀ sọ gbangba pé gbogbo àwùjọ àwọn onígbàgbọ́ ló ṣeé ṣe kó ń bá sọ̀rọ̀.
- issue: Ìbáṣepọ̀ láàárín wíwá Olúwa àti ìkójọpọ̀ wa
  choice: a so àwọn méjèèjì pọ̀ pẹ̀lú “àti” láìtúmọ̀ ìbáṣepọ̀ wọn síwájú sí i
  alternative: ìkójọpọ̀ wa nígbà wíwá rẹ̀
  rationale: Gíríìkì fi καί so àwọn méjèèjì pọ̀, ṣùgbọ́n kò sọ pàtó bóyá ọ̀kan ṣàlàyé èkejì tàbí bí àkókò wọn ṣe rí. Ìtumọ̀ náà pa àìdánilójú tòótọ́ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A ṣètò gbólóhùn náà ní ọ̀nà Yorùbá àdánidá, a sì pa àmì kọ́má ìparí mọ́ nítorí ẹsẹ yìí ń tẹ̀ síwájú sínú gbólóhùn tó tẹ̀ lé e.
