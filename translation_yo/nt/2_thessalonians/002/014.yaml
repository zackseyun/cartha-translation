id: 2TH.2.14
reference: 2 Thessalonians 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: yo
  text: Ó pè yín sí èyí nípasẹ̀ ìhìnrere wa, kí ẹ lè gba ògo[b] Olúwa wa Jésù Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí a ti sábà máa ń pè é, “Jésù Kristi.”
    reason: alternative_reading
  - marker: b
    text: “Kí ẹ lè gba ògo Olúwa wa Jésù Mèsáyà” tún lè jẹ́ “kí ẹ lè ní ògo Olúwa wa Jésù Mèsáyà” tàbí “kí ẹ lè pín nínú ògo Olúwa wa Jésù Mèsáyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Sí èyí
  rationale: Ó tọ́ka padà sí iṣẹ́ ìgbàlà àti ìsọdimímọ́ inú ẹsẹ tó ṣáájú, láì fi ohun tí ọ̀rọ̀ arọ́pò náà ń tọ́ka sí múlẹ̀ ju bí Gíríìkì ṣe mú un lọ.
- source_word: ἐκάλεσεν
  choice: ó pè yín
  rationale: “Pè” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún καλέω; kò fi ẹ̀kọ́ ìsìn kan kún un pé ìpè náà kò ṣeé kọ̀ tàbí pé ìkésíni lásán ni.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: nípasẹ̀ ìhìn rere wa
  rationale: “Nípasẹ̀” fi διά pẹ̀lú ọ̀rọ̀-orúkọ oníjẹnítífù hàn gẹ́gẹ́ bí ọ̀nà tí Ọlọ́run fi pè wọ́n. “Ìhìn rere wa” túmọ̀ sí ìhìn rere tí àwọn aposteli kéde, kì í ṣe ìhìn rere mìíràn tó jẹ́ tiwọn.
- source_word: εἰς περιποίησιν
  choice: kí ẹ lè gba
  rationale: Gbólóhùn yìí fi ète hàn, “gba” sì lè sọ nípa rírí tàbí níní ohun kan, láì fi dandan yàn láàárín gbígba, níní, àti pínpín nínú ògo.
- source_word: δόξης
  choice: ògo
  rationale: “Ògo” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún δόξα nínú àyíká ìgbà ìkẹyìn yìí, ó sì dá ìtumọ̀ rẹ̀ mọ́ láì sọ ọ́ di ẹwà tàbí ìtànṣán lásán.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Olúwa wa
  rationale: Ó pa κύριος mọ́ gẹ́gẹ́ bí oyè “Olúwa” àti pé ìbáṣepọ̀ “wa” wà nínú ọ̀rọ̀ Gíríìkì.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: “Mèsáyà” mú ìtumọ̀ oyè Χριστός jáde ní kedere; àṣàyàn àtọwọ́dọ́wọ́ “Jésù Kristi” wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Irú ìpè Ọlọ́run nínú ẹ̀kọ́ Páùlù nípa ìgbàlà
  choice: ó pè yín
  alternative: ó pè yín lọ́nà tí kò ṣeé kọ̀; ó ké sí yín
  rationale: Ẹsẹ náà sọ pé Ọlọ́run pè wọ́n nípasẹ̀ ìhìn rere, ṣùgbọ́n kò ṣàlàyé níbí bóyá a gbọ́dọ̀ pe ìpè náà ní alágbára tí kò ṣeé kọ̀ tàbí ìkésíni lásán; ìtumọ̀ náà pa ìfojúsùn yìí mọ́.
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká yìí Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè. “Mèsáyà” fi ìtumọ̀ oyè náà hàn, nígbà tí àṣàyàn ìbílẹ̀ “Kristi” wà nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ περιποίησις pẹ̀lú δόξης
  choice: kí ẹ lè gba ògo
  alternative: kí ẹ lè ní ògo; kí ẹ lè pín nínú ògo
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí gbígba tàbí níní ògo, ó sì lè ní ìtumọ̀ pípín nínú rẹ̀ nínú àyíká yìí. Ọ̀rọ̀ inú àkọ́kọ́ yan èdè Yorùbá tó rọrùn láì pa àwọn àṣàyàn mìíràn rẹ́.
translation_notes:
  register: Yorùbá àfẹnusọ tó péye, tó níyì, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá bá ìlò àdáni mu; a sì pa ìṣòro ìtumọ̀ tó wà nínú “ìpè” àti περιποίησις mọ́ láì fi ẹ̀kọ́ ìjọ kan lé e lórí.
