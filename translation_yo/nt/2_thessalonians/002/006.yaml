id: 2TH.2.6
reference: 2 Thessalonians 2:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ νῦν τὸ κατέχον οἴδατε, εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ⸀ἑαυτοῦ καιρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: yo
  text: Nísinsìnyí, ẹ sì mọ ohun tí ń dá a dúró[a], kí a lè ṣí i payá ní àkókò tirẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘ohun tí ń fà á sẹ́yìn.’ Ọ̀rọ̀ Gíríìkì náà kò sọ ohun tàbí agbára tó ń dá a dúró níhìn-ín.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘ní àkókò tí a yàn fún un.’ Ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí àkókò tó yẹ tàbí tí a yàn.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: ohun tí ń dá a dúró
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ alábápín ọ̀rọ̀ oníbáramu tí a fi arọ́pò-orúkọ akọ-kì í ṣe tàbí abo-kì í ṣe ṣe. ‘Ohun tí ń dá a dúró’ jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ dídènà tàbí dídá ẹni kan dúró mọ́ láì sọ ẹni tàbí agbára tó ń ṣe é.
- source_word: οἴδατε
  choice: ẹ mọ
  rationale: Èyí sọ ìmọ̀ tí àwọn olùgbọ́ ti ní tẹ́lẹ̀, ó sì jẹ́ ọ̀nà tó rọrùn, tó ṣe déédéé ní Yorùbá.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó túmọ̀ sí àkókò ìsinsìnyí, ó sì bá ìṣàn ọ̀rọ̀ náà mu ní Yorùbá.
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: kí a lè ṣí i payá
  rationale: Ìkọ̀lé yìí ń tọ́ka sí ète tàbí àbájáde. ‘Ṣí i payá’ pa àwòrán ìṣípayá inú ọ̀rọ̀ Gíríìkì mọ́, bí ‘a’ aláìdárúkọ ṣe ń fi ìṣe àìsọ ẹni tó ṣe é hàn ní Yorùbá.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: ní àkókò tirẹ̀
  rationale: Èyí tẹ̀lé ọ̀rọ̀ Gíríìkì pẹ̀lú ìṣọ́ra, ó sì fi sílẹ̀ bóyá àkókò náà túmọ̀ sí àkókò tó yẹ tàbí tí a yàn.
theological_decisions:
- issue: Ta ni tàbí kí ni ohun tó ń dá a dúró?
  choice: A túmọ̀ ọ́ ní àìdásí bí ‘ohun tí ń dá a dúró,’ láì dá ohun tàbí ẹni náà mọ̀.
  alternative: Ìjọba Róòmù, Ẹ̀mí Mímọ́, agbára áńgẹ́lì kan, tàbí àṣẹ/ìpèsè Ọlọ́run.
  rationale: Ẹsẹ yìí fúnra rẹ̀ kò sọ ẹni tàbí ohun tó ń dá a dúró. Ọ̀rọ̀ Gíríìkì τὸ κατέχον kò gbọ́dọ̀ di ẹni tàbí ẹ̀kọ́ pàtó nínú ìtumọ̀.
- issue: Ìtumọ̀ καιρός nínú ọ̀rọ̀ nípa ìkẹyìn
  choice: ní àkókò tirẹ̀
  alternative: ní àkókò tí a yàn fún un; ní àkókò tó yẹ
  rationale: καιρός lè túmọ̀ sí àkókò tó yẹ tàbí tí a yàn, ṣùgbọ́n ‘àkókò tirẹ̀’ pa àìdánilójú tó wà nínú ọ̀rọ̀ orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, kò sì dá ẹni tàbí agbára tó ń dá a dúró mọ̀.
