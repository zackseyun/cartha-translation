id: 2TH.2.3
reference: 2 Thessalonians 2:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: yo
  text: Kí ẹnikẹ́ni má ṣe tàn yín jẹ́ ní ọ̀nà kankan, nítorí ọjọ́ náà kì yóò dé bí kò ṣe pé ìṣọ̀tẹ̀ náà[a] kọ́kọ́ ṣẹlẹ̀, tí a sì fi ọkùnrin ìwà àìlófin náà hàn[b], ọmọ ìparun náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ìkọ̀sílẹ̀ ìgbàgbọ́” tàbí “ìyapa kúrò nínú ìgbàgbọ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìṣọ̀tẹ̀ pàtàkì, tí a sì sábà máa ń lóye rẹ̀ gẹ́gẹ́ bí ìkọ̀sílẹ̀ ẹ̀sìn.
    reason: alternative_reading
  - marker: b
    text: Àwọn àfọwọ́kọ kan ní “ọkùnrin ẹ̀ṣẹ̀” dípò “ọkùnrin ìwà àìlófin.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: tàn yín jẹ́
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí láti tan ẹni jẹ tàbí ṣì í lọ́nà; ‘tàn ... jẹ́’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó bá ìkìlọ̀ náà mu.
- source_word: κατὰ μηδένα τρόπον
  choice: lọ́nàkọnà
  rationale: Ó tẹnumọ́ pé wọn kò gbọdọ̀ gba irú ẹ̀tàn èyíkéyìí gbọ́.
- source_word: ὅτι
  choice: nítorí
  rationale: Níhìn-ín, ó ń mú ìdí fún ìkìlọ̀ tí ó ṣáájú wọlé.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: kì yóò dé àyàfi tí ... bá ... dé
  rationale: Èyí fi hàn pé àwọn ìṣẹ̀lẹ̀ tí a dárúkọ gbọ́dọ̀ kọ́kọ́ ṣẹlẹ̀; ‘ọjọ́ náà’ ni a mú wá láti ẹsẹ tó ṣáájú kí gbolohun Yorùbá lè ṣe kedere.
- source_word: ἀποστασία
  choice: ìṣọ̀tẹ̀
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti ìdìtẹ̀ tàbí yíyapa kúrò nínú ìgbọ́ràn mọ́, láìfi tipátipá sọ ọ́ di ìkọ̀sílẹ̀ ẹ̀sìn nìkan.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó fi bí àwọn ìṣẹ̀lẹ̀ ṣe tẹ̀ lé ara wọn hàn ní kedere.
- source_word: ἀποκαλυφθῇ
  choice: a ... fi ... hàn
  rationale: Ìsọ̀rí aláìṣe yìí túmọ̀ sí pé a ó sọ ẹni náà di mímọ̀ tàbí mú un farahàn.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: ọkùnrin ìwà àìlófin
  rationale: Ó tẹ̀ lé ἀνομίας, ‘ìwà àìlófin,’ ó sì pa ọkùnrin kan pàtó tí ọ̀rọ̀ Gíríìkì tọ́ka sí mọ́.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: ọmọ ìparun
  rationale: Ó pa àkànṣe ọ̀rọ̀ Sẹ́mítì tó wà nínú Gíríìkì mọ́; ó lè ṣàpèjúwe ẹni tí ìparun jẹ́ ìwà tàbí ìpín rẹ̀.
theological_decisions:
- issue: Fífi ẹni tí ‘kì yóò dé’ ń tọ́ka sí kún ọ̀rọ̀
  choice: A fi ‘ọjọ́ náà’ hàn gbangba nínú ọ̀rọ̀ Yorùbá.
  alternative: Kí gbolohun náà wà láìdárúkọ ‘ọjọ́ náà.’
  rationale: Ọ̀rọ̀ Gíríìkì fi í sílẹ̀ nítorí ó ṣe kedere láti ẹsẹ 2 pé ọjọ́ Olúwa ni; fífi í kún un mú Yorùbá ṣe kedere láìfi ìtumọ̀ tuntun kún un.
- issue: Ìtumọ̀ ἀποστασία
  choice: ìṣọ̀tẹ̀
  alternative: ìkọ̀sílẹ̀ ìgbàgbọ́; yíyapa kúrò
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ìṣọ̀tẹ̀ tàbí ìkọ̀sílẹ̀ ìgbàgbọ́. Ìtumọ̀ gbígbòòrò wà nínú àyọkà, a sì pa ìtumọ̀ ẹ̀sìn tó ṣeé ṣe mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Àyípadà àfọwọ́kọ ní τῆς ἀνομίας
  choice: ìwà àìlófin, gẹ́gẹ́ bí SBLGNT
  alternative: ẹ̀ṣẹ̀
  rationale: Orísun tí a pèsè ka ἀνομίας; àlàyé ìsàlẹ̀ sì ṣe àkọsílẹ̀ àyípadà ‘ẹ̀ṣẹ̀’ láti jẹ́ kí ẹ̀rí náà ṣeé yẹ̀ wò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó yé òǹkàwé òde òní. A lo ‘yín’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, a sì fi ìlà gígùn ya àpèjúwe ìkẹyìn sọ́tọ̀.
