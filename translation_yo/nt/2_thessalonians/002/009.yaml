  yaml_path: translation/nt/2_thessalonians/002/009.yaml
  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: yo
  text: Wíwá ẹni náà yóò jẹ́ gẹ́gẹ́ bí ìṣiṣẹ́ Sátánì[a], pẹ̀lú gbogbo agbára àti àwọn àmì àti iṣẹ́ ìyanu tí ó jẹ́ ti irọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “dídé rẹ̀ yóò jẹ́ gẹ́gẹ́ bí ìṣiṣẹ́ Sátánì.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “pẹ̀lú gbogbo agbára àti àwọn àmì àti iṣẹ́ ìyanu ti irọ́”; ó tún ṣeé túmọ̀ sí “àwọn iṣẹ́ ìyanu èké.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: Ẹni náà ni ... rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ oníjẹ́nítífù náà tọ́ka sí ẹni aláìlófin nínú ẹsẹ tó ṣáájú; ìṣètò yìí so ẹsẹ náà mọ́ ẹni yẹn lọ́nà àdánidá ní Yorùbá.
- source_word: παρουσία
  choice: wíwá
  rationale: Nínú àyíká ọ̀rọ̀ nípa ìgbà ìkẹyìn, ó túmọ̀ sí dídé tàbí fífarahàn ẹni kan, kì í ṣe wíwà lásán.
- source_word: κατ’ ἐνέργειαν
  choice: yóò bá iṣẹ́ agbára ... mu
  rationale: 'Ó fi ọ̀nà tàbí ìbámu hàn: wíwá ẹni náà bá ìṣiṣẹ́ agbára Sátánì mu, láì sọ ọ́ di èdè ìmọ̀ ẹ̀rọ tí kò wọ́pọ̀.'
- source_word: τοῦ Σατανᾶ
  choice: Sátánì
  rationale: Èyí ni orúkọ tí a mọ̀ sí i ní Yorùbá; ìrísí jẹ́nítífù náà fi hàn pé iṣẹ́ agbára náà jẹ́ ti Sátánì tàbí pé ó ti ọ̀dọ̀ rẹ̀ wá.
- source_word: ἐν πάσῃ δυνάμει
  choice: pẹ̀lú gbogbo agbára
  rationale: ἐν níbí fi ohun tó bá wíwá náà rìn tàbí ọ̀nà tí ó gbà ṣiṣẹ́ hàn; πάσῃ ní ìtumọ̀ tó kún ré kọjá gbogbo irú agbára.
- source_word: σημείοις
  choice: àwọn àmì
  rationale: Àmì jẹ́ ìtumọ̀ Yorùbá tó bójú mu fún iṣẹlẹ̀ tí ń fi ohun kan hàn tàbí tí a lè lò láti fi ẹ̀rí múlẹ̀.
- source_word: τέρασιν
  choice: iṣẹ́ ìyanu
  rationale: Ó sọ̀rọ̀ nípa àwọn ìṣẹ̀lẹ̀ àrà ọ̀tọ̀ tó ń mú ìyàlẹ́nu bá ènìyàn; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: ψεύδους
  choice: tí irọ́ ń bá rìn
  rationale: Jẹ́nítífù náà so irọ́ mọ́ àpapọ̀ agbára, àmì àti iṣẹ́ ìyanu láì pinnu pé irọ́ ẹ̀tàn lásán ni gbogbo ìṣẹ̀lẹ̀ náà tàbí pé agbára gidi ni.
theological_decisions:
- issue: Irú agbára àti iṣẹ́ ìyanu tí Sátánì ń mú ṣiṣẹ́
  choice: A sọ pé irọ́ ń bá agbára, àmì àti iṣẹ́ ìyanu náà rìn, láì ṣàlàyé bóyá gbogbo wọn jẹ́ ẹ̀tàn lásán tàbí ìṣẹ̀lẹ̀ agbára tó ju ti ẹ̀dá lọ.
  alternative: A lè túmọ̀ rẹ̀ sí “àwọn iṣẹ́ ìyanu èké,” èyí tó lè mú kó dà bí ẹni pé gbogbo wọn kàn jẹ́ ọgbọ́n ẹ̀tàn tí kò ní agbára kankan.
  rationale: Gíríìkì sọ pé wíwá ẹni náà bá ìṣiṣẹ́ Sátánì mu, pẹ̀lú agbára, àmì àti iṣẹ́ ìyanu ψεύδους. Kò yanju irú ìwàláàyè àwọn ìṣẹ̀lẹ̀ náà ní kíkún, nítorí náà a pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti kíkà-rọrùn ni a lò. A yan “wíwá” fún παρουσία, “iṣẹ́ agbára” fún ἐνέργεια, a sì lo “tí irọ́ ń bá rìn” láti pa àìdánilójú ψεύδους mọ́ láì fi ẹ̀kọ́ ẹ̀sìn kan kún un.
