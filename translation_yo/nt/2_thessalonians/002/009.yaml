revisions:
- from: Ẹni náà ni wíwá rẹ̀ yóò bá iṣẹ́ agbára Sátánì mu[a], pẹ̀lú gbogbo agbára àti àwọn àmì àti iṣẹ́ ìyanu tí irọ́ ń bá rìn[b].
  to: Wíwá ẹni náà yóò jẹ́ gẹ́gẹ́ bí ìṣiṣẹ́ Sátánì[a], pẹ̀lú gbogbo agbára àti àwọn àmì àti iṣẹ́ ìyanu tí ó jẹ́ ti irọ́[b].
  rationale: A tún ìṣètò gbolóhùn náà ṣe kí οὗ àti παρουσία hàn ní Yorùbá adayeba. “Gẹ́gẹ́ bí ìṣiṣẹ́ Sátánì” jẹ́ ìtumọ̀ tó sún mọ́ kaτ’ ἐνέργειαν. A rọ́pò “tí irọ́ ń bá rìn” pẹ̀lú “tí ó jẹ́ ti irọ́” láti sọ ìbáṣepọ̀ ψεύδους pẹ̀lú àmì àti iṣẹ́ ìyanu di kedere, nígbà tí a ṣì pa ìṣòro ìtumọ̀ náà mọ́ láì pinnu bóyá àwọn ohun ìyanu náà jẹ́ irọ́ pátápátá tàbí àwọn ohun tí a fi irọ́ ṣe.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:22:35Z'
