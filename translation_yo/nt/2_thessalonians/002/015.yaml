id: 2TH.2.15
reference: 2 Thessalonians 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: yo
  text: Nítorí náà, ẹ̀yin arákùnrin[a], ẹ dúró ṣinṣin, kí ẹ sì di àwọn àṣà tí a kọ́ yín mú, yálà nípasẹ̀ ọ̀rọ̀ ẹnu tàbí nípasẹ̀ lẹ́tà wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀yin arákùnrin àti arábìnrin.” Ọ̀rọ̀ Giriki náà ní “ẹ̀yin arákùnrin” ní tààrà, ṣùgbọ́n ó ṣeé ṣe kí ó ń bá gbogbo ìjọ sọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Nítorí náà
  rationale: Àpapọ̀ àwọn ọ̀rọ̀ ìparí èrò méjèèjì yìí ń fi ohun tí ó tẹ̀ lé e hàn gẹ́gẹ́ bí àbájáde ọ̀rọ̀ tí ó ṣáájú; “Nítorí náà” jẹ́ ọ̀nà Yorùbá àdánidá tí ó mú agbára ìyọrísí náà wá.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu fún ìpè sí àwọn onígbàgbọ́ ẹlẹgbẹ́, ó sì lè tọ́ka sí gbogbo ìjọ láìpa ìtumọ̀ ìbátan inú Kristi run.
- source_word: στήκετε
  choice: ẹ dúró ṣinṣin
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pe wọn sí ìfaradà tí ń bá a lọ; “dúró ṣinṣin” jẹ́ àdánidá, ó sì pa àwòrán ìdúró àti ìdúróṣinṣin mọ́.
- source_word: κρατεῖτε
  choice: kí ẹ sì di ... mú ṣinṣin
  rationale: Ó túmọ̀ sí dídì ohun kan mú gidigidi tàbí títẹ̀lé e láìyẹsẹ̀; ọ̀rọ̀ yìí pa agbára àṣẹ náà mọ́.
- source_word: παραδόσεις
  choice: àwọn àṣà
  rationale: παράδοσις ń tọ́ka sí ohun tí a fi lé ẹlòmíràn lọ́wọ́ tàbí tí a fà kalẹ̀. “Àṣà” ni ìbádọ́gba Yorùbá tó sun mọ́ “tradition”; àyíká gbólóhùn náà fi hàn pé àwọn ẹ̀kọ́ aposteli tí a fi ẹnu tàbí lẹ́tà kọ́ wọn ni.
- source_word: ἐδιδάχθητε
  choice: tí a kọ́ yín
  rationale: Ìṣe aláìlórúkọ olùṣe náà fi àwọn ará Tẹsalóníkà hàn gẹ́gẹ́ bí olùgbà ẹ̀kọ́; “tí a kọ́ yín” sọ èyí ní Yorùbá kedere.
- source_word: διὰ λόγου
  choice: nípasẹ̀ ọ̀rọ̀ ẹnu
  rationale: Ní ìyàtọ̀ sí lẹ́tà, λόγος níbí tọ́ka sí ìkọ́ni tí a sọ; fífi “ẹnu” kún un mú ìyàtọ̀ ọ̀rọ̀ sísọ àti ìwé kíkọ́ ṣe kedere ní Yorùbá.
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: nípasẹ̀ lẹ́tà wa
  rationale: Ó pa ọ̀nà ìkọ́ni tí a kọ sílẹ̀ àti ìní ἡμῶν mọ́ lọ́nà Yorùbá tí ó rọrùn.
theological_decisions:
- issue: Ìtumọ̀ παράδοσις nínú ẹsẹ tí a máa ń lò nínú àríyànjiyàn nípa àṣà aposteli
  choice: àwọn àṣà
  alternative: àwọn ẹ̀kọ́; àwọn ìtọ́ni
  rationale: “Àwọn àṣà” pa ìtumọ̀ ohun tí a fà kalẹ̀ mọ́, ó sì jẹ́ kí ẹsẹ náà fúnra rẹ̀ sọ pé a kọ́ wọn nípasẹ̀ ọ̀rọ̀ ẹnu àti lẹ́tà. Kò fi ẹ̀kọ́ ìsìn ẹgbẹ́ kan lé e lórí nípa bí àṣẹ àṣà ṣe gbòòrò tó lẹ́yìn àkókò àwọn aposteli.
- issue: Bí a ṣe máa túmọ̀ ἀδελφοί sí ìjọ tí ó ṣeé ṣe kí ọkùnrin àti obìnrin wà nínú rẹ̀
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin; ẹ̀yin arákùnrin àti arábìnrin
  rationale: “Ẹ̀yin ará” jẹ́ ìpè àdánidá ní Yorùbá sí gbogbo àwọn ọmọ ìjọ, nígbà tí àlàyé ìsàlẹ̀ fi ìrísí akọ nínú Giriki hàn, kí a má bà a yí ìdánimọ̀ ìjọ náà padà.
translation_notes:
  register: 'Yorùbá ìgbàlódé, ọ̀wọ̀ àti kíkà-rọrùn ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àwọn àṣẹ méjèèjì ní agbára, ṣùgbọ́n wọn ń ṣàn lọ́nà àdánidá: “ẹ dúró ṣinṣin, kí ẹ sì di ... mú ṣinṣin.”'
