base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/017.yaml
  text: encourage your hearts and strengthen them in every good work and word[a][b].
translation:
  language: yo
  text: kí ó gba ọkàn yín níyànjú[a], kí ó sì mú un dúró ṣinṣin[b] nínú gbogbo iṣẹ́ rere àti ọ̀rọ̀ rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “kí ó tù ọkàn yín nínú”; παρακαλέσαι tún lè ní ìtumọ̀ “tù nínú” tàbí “rọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “kí ó mú un lágbára” tàbí “kí ó fìdí rẹ̀ múlẹ̀” nínú gbogbo iṣẹ́ rere àti ọ̀rọ̀ rere.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: gba … níyànjú
  rationale: Ọ̀rọ̀ yìí lè túmọ̀ sí fífúnni ní ìṣírí, ìtùnú, tàbí ìgbaninímọ̀ràn. “Gba … níyànjú” jẹ́ ọ̀nà Yorùbá àdánidá tí ó gbòòrò tó láti bá àdúrà inú àyíká ọ̀rọ̀ yìí mu, láìfi ìtumọ̀ rẹ̀ mọ́ ìtùnú ẹ̀dùn-ọkàn tàbí ìkìlọ̀ ìwà rere nìkan.
- source_word: καρδίας
  choice: ọkàn
  rationale: “Ọkàn” pa àwòrán ìmọ̀-ẹ̀dá ènìyàn ti Bíbélì mọ́, ó sì lè tọ́ka sí inú ènìyàn lápapọ̀, kì í ṣe ìmọ̀lára tàbí èrò inú nìkan.
- source_word: στηρίξαι
  choice: mú … dúró ṣinṣin
  rationale: Gbólóhùn yìí sọ ìṣe mímú ohun kan fìdí múlẹ̀ tàbí mímú un lágbára. “Mú … dúró ṣinṣin” jẹ́ Yorùbá àdánidá tí ó pa èrò ìdúróṣinṣin mọ́.
- source_word: ἐν παντὶ
  choice: nínú gbogbo
  rationale: Ó fi ààyè tàbí ipò tí ìmúdúróṣinṣin náà ti ń hàn hàn.
- source_word: ἔργῳ
  choice: iṣẹ́
  rationale: “Iṣẹ́” lè túmọ̀ sí ohun tí a ṣe tàbí ìṣe, ó sì bá “ọ̀rọ̀” ṣe àfikún ní ọ̀nà tó ṣe kedere.
- source_word: λόγῳ
  choice: ọ̀rọ̀
  rationale: Nínú ìfarawe pẹ̀lú “iṣẹ́,” ó ṣeé ṣe jù pé ó tọ́ka sí ohun tí ènìyàn ń sọ; “ọ̀rọ̀” pa ìtumọ̀ gbòòrò náà mọ́.
- source_word: ἀγαθῷ
  choice: rere
  rationale: “Rere” ni ìtumọ̀ tààrà tí ó sì bá iṣẹ́ àti ọ̀rọ̀ méjèèjì mu.
- source_word: ὑμῶν
  choice: yín
  rationale: 'Arọ́pò-orúkọ onípò púpọ̀ tí ó sinmi lé “ọkàn”: “ọkàn yín.”'
- source_word: καὶ
  choice: kí ó sì / àti
  rationale: A lo “kí ó sì” láti so àwọn ìṣe àdúrà méjèèjì pọ̀, a sì lo “àti” láàárín “iṣẹ́” àti “ọ̀rọ̀.”
theological_decisions:
- issue: Bóyá kí a túmọ̀ καρδία ní ọ̀nà ìmọ̀-ọkàn ènìyàn òde òní
  choice: ọkàn
  alternative: inú yín / èrò inú yín
  rationale: “Ọkàn” pa àkàwé Bíbélì mọ́, kò sì dín ènìyàn inú kù sí èrò tàbí ìmọ̀lára nìkan.
- issue: Bóyá στηρίξαι yẹ kí ó jẹ́ “fìdí múlẹ̀” dípò ọ̀rọ̀ tó túbọ̀ jẹ́ ti Yorùbá àdánidá
  choice: mú … dúró ṣinṣin
  alternative: fìdí … múlẹ̀ / mú … lágbára
  rationale: Yíyan yìí pa ìtumọ̀ jíjẹ́ ẹni tí a mú fìdí múlẹ̀ mọ́, ó sì ṣe kedere fún òǹkàwé Yorùbá òde òní.
translation_notes:
  register: Yorùbá ìpele àárín tí ó níyì, tó ṣe kedere, tí ó sì jẹ́ àdánidá ni a lò. “Ọkàn yín” jẹ́ ọ̀rọ̀ àpapọ̀ ní Yorùbá, nítorí náà “un” ń tọ́ka sí ọkàn náà. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
