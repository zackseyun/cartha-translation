id: 2TH.2.13
reference: 2 Thessalonians 2:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: yo
  text: Ṣùgbọ́n ó yẹ kí àwa máa dúpẹ́ lọ́wọ́ Ọlọ́run nígbà gbogbo nítorí yín, ẹ̀yin arákùnrin[b] tí Olúwa fẹ́ràn, nítorí Ọlọ́run yàn yín gẹ́gẹ́ bí àkọ́so[a] fún ìgbàlà, nípasẹ̀ ìsọdimímọ́ Ẹ̀mí Mímọ́ àti ìgbàgbọ́ nínú òtítọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní, “Ọlọ́run yàn yín láti ìbẹ̀rẹ̀ fún ìgbàlà.” Ọ̀rọ̀ inú ẹsẹ yìí tẹ̀lé “gẹ́gẹ́ bí àkọ́so” (ἀπαρχήν); ẹ̀dà mìíràn ní “láti ìbẹ̀rẹ̀” (ἀπ’ ἀρχῆς).
    reason: textual_variant
  - marker: b
    text: “Arákùnrin” ni a fi tú ọ̀pọ̀ akọ ἀδελφοί; ọ̀rọ̀ ìkíni yìí lè ní gbogbo àwùjọ àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin, nínú.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Ṣùgbọ́n ... àwa
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ohun tí ó ṣáájú hàn, “àwa” sì pa ìtẹnumọ́ ọ̀rọ̀-arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: ὀφείλομεν
  choice: ó yẹ kí àwa
  rationale: Ó sọ ojúṣe tí ó tọ́ àti tí ó yẹ, láìsọ ọ́ di àṣẹ líle.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: máa dúpẹ́ lọ́wọ́ Ọlọ́run nígbà gbogbo nítorí yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún fífi ọpẹ́ fún Ọlọ́run nítorí àwọn ènìyàn kan.
- source_word: ἀδελφοὶ
  choice: ẹ̀yin arákùnrin
  rationale: Ó tẹ̀lé ọ̀pọ̀ akọ nínú Gíríìkì; àlàyé ìsàlẹ̀ sọ pé ó lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: tí Olúwa fẹ́ràn
  rationale: Gbólóhùn aláìṣe Gíríìkì di ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ pé Olúwa ni ẹni tó nífẹ̀ẹ́ wọn mọ́.
- source_word: εἵλατο
  choice: yàn
  rationale: “Yàn” ni ìtumọ̀ tààrà àti àdánidá fún yíyan láàárín àwọn mìíràn, láìfi ẹ̀kọ́ ẹ̀sìn àfikún sí i.
- source_word: ἀπαρχὴν
  choice: gẹ́gẹ́ bí àkọ́so
  rationale: “Àkọ́so” túmọ̀ sí èso àkọ́kọ́ tí a kó, ó sì pa àwòrán ọ̀rọ̀ Gíríìkì mọ́.
- source_word: εἰς σωτηρίαν
  choice: fún ìgbàlà
  rationale: Ó fi ète tàbí àbájáde yíyan náà hàn ní Yorùbá tó rọrùn.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: nípasẹ̀ ìsọdimímọ́ Ẹ̀mí
  rationale: “Nípasẹ̀” fi ipa ọ̀nà tàbí ohun èlò hàn; “Ẹ̀mí” tọ́ka sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí àyíká ọ̀rọ̀ ìgbàlà yìí ṣe ń tọ́ka sí.
- source_word: καὶ πίστει ἀληθείας
  choice: àti ìgbàgbọ́ nínú òtítọ́
  rationale: Ó gba ἀληθείας gẹ́gẹ́ bí ohun tí ìgbàgbọ́ náà dojú kọ, ìyẹn ni, gbígbàgbọ́ nínú òtítọ́.
theological_decisions:
- issue: Ìtumọ̀ πνεύματος nínú ἐν ἁγιασμῷ πνεύματος
  choice: Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn
  rationale: Nínú àyíká ọ̀rọ̀ Pọ́ọ̀lù nípa ìgbàlà, ìsọdimímọ́ jẹ́ iṣẹ́ tí a lè fi mọ́ Ẹ̀mí Mímọ́ jù; lílo lẹ́tà ńlá fi ìdájọ́ ìtumọ̀ yìí hàn láìfi ọ̀rọ̀ tuntun kún un.
- issue: Ohun tí εἵλατο ὑμᾶς ὁ θεὸς túmọ̀ sí
  choice: Ọlọ́run yàn yín
  alternative: Ọlọ́run fi yín sípò / Ọlọ́run mú yín fún ara rẹ̀
  rationale: “Yàn” pa ìtumọ̀ ọ̀rọ̀ náà mọ́, ṣùgbọ́n kò fi èrò ẹ̀sìn ẹgbẹ́ kan nípa àyànmọ́ tàbí ìdìbò kún ohun tí ẹsẹ náà sọ.
- issue: Ìyàtọ̀ ọ̀rọ̀ àfọwọ́kọ ní ἀπαρχὴν àti ἀπ’ ἀρχῆς
  choice: gẹ́gẹ́ bí àkọ́so
  alternative: láti ìbẹ̀rẹ̀
  rationale: Ọ̀rọ̀ SBLGNT tí a fi fún iṣẹ́ yìí ní ἀπαρχὴν; a pa ẹ̀dà mìíràn mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ti ìjọsìn, ó sì ṣeé lóye fún òǹkàwé òde òní. A lo “àkọ́so” láti pa àwòrán èso àkọ́kọ́ mọ́, a sì gbe àmì àlàyé kọọkan sí ọ̀rọ̀ tí ó ń ṣàlàyé.
