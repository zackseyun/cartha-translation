  source_fidelity: Ìtumọ̀ náà mú ọ̀pọ̀ nínú ìtumọ̀ Gíríìkì náà dáradára, ṣùgbọ́n “láàárín àwọn tí ń ṣègbé” kéré sí ìtọ́kasí dative náà ju “fún àwọn tí ń ṣègbé” lọ. Pẹ̀lú bẹ́ẹ̀, “ìfẹ́ òtítọ́” lè túmọ̀ sí ìfẹ́ tí ó jẹ́ òtítọ́ ní Yorùbá, dípò ìfẹ́ sí òtítọ́ tí àyíká Gíríìkì ń sọ.
