  terminology: “Ẹ̀tàn,” “àìṣòdodo,” “òtítọ́,” “ń ṣègbé,” àti “gbà wọ́n là” yẹ fún ọ̀rọ̀ ἀπάτη, ἀδικία, ἀλήθεια, ἀπολλυμένοις, àti σωθῆναι. A tún gbé àwọn àmì àlàyé ìsàlẹ̀ sí ibi tí ọ̀kọ̀ọ̀kan ti wúlò.
