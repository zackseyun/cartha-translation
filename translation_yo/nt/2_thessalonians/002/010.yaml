id: 2TH.2.10
reference: 2 Thessalonians 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἐν πάσῃ ἀπάτῃ ⸀ἀδικίας τοῖς ἀπολλυμένοις, ἀνθ’ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: yo
  text: àti pẹ̀lú gbogbo ẹ̀tàn àìṣòdodo[a] fún àwọn tí ń ṣègbé,[b] nítorí wọn kò gba ìfẹ́ sí òtítọ́,[c] kí a lè gbà wọ́n là.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “gbogbo ẹ̀tàn àìṣòdodo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “láàárín àwọn tí ń ṣègbé” tàbí “sí àwọn tí ń ṣègbé.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “wọn kò tẹ́wọ́ gba ìfẹ́ sí òtítọ́.”
    reason: lexical_alternative
  - marker: d
    text: Tàbí “fún gbígbà wọ́n là.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ
  choice: ẹ̀tàn
  rationale: “Ẹ̀tàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìṣe tí a fi ń ṣini lọ́nà, ó sì bá ipa ἀπάτη mu ní àyíká yìí.
- source_word: ἀδικίας
  choice: àìṣòdodo
  rationale: “Àìṣòdodo” pa agbára ìwà rere àti ẹ̀kọ́ ìgbàgbọ́ inú ἀδικία mọ́, ó sì jẹ́ kí ìbáṣepọ̀ genitive náà hàn gẹ́gẹ́ bí irú ẹ̀tàn tí àìṣòdodo ń dá mọ́.
- source_word: τοῖς ἀπολλυμένοις
  choice: láàárín àwọn tí ń ṣègbé
  rationale: Dative náà lè tọ́ka sí àyíká tàbí àwọn tí ẹ̀tàn náà ń ṣiṣẹ́ sí. “Láàárín” jẹ́ Yorùbá tí ó ṣàn, tí kò sì fi ipa mú ìtumọ̀ sí ọ̀nà kan ṣoṣo; “ń ṣègbé” pa ìṣe tí ń lọ lọ́wọ́ inú present participle mọ́.
- source_word: ἀνθ’ ὧν
  choice: nítorí
  rationale: Ní àyíká yìí, gbólóhùn náà ń sọ ìdí; “nítorí” mú ìtumọ̀ causal náà jáde ní Yorùbá àdánidá.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ìbámu Yorùbá tó ṣe déédé fún ἀγάπη, ó sì pa èrò fífẹ́ gba òtítọ́ mọ́, kì í ṣe mímọ̀ ọ́ lásán.
- source_word: τῆς ἀληθείας
  choice: òtítọ́
  rationale: “Ìfẹ́ òtítọ́” pa ìṣètò genitive Gíríìkì mọ́ ní ọ̀nà tí Yorùbá lè gbà, láì sọ ọ́ di “ìfẹ́ sí òtítọ́” nínú àkọ́kọ́.
- source_word: ἐδέξαντο
  choice: kò gba
  rationale: “Gba” lè túmọ̀ sí gbà, tẹ́wọ́ gbà, tàbí kíni wọlé; ó bá ohun àfojúsùn aláìfarahàn “ìfẹ́ òtítọ́” mu, ó sì fi ìkọ̀sílẹ̀ wọn hàn.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: kí a lè gbà wọ́n là
  rationale: Ìkọ̀lé “kí ... lè” ń fi ète tàbí àbájáde tí εἰς + articular infinitive lè ní hàn; passive σωθῆναι ni a sọ ní Yorùbá àdánidá pẹ̀lú “gbà wọ́n là.”
theological_decisions:
- issue: Bóyá οἱ ἀπολλύμενοι yẹ kí ó túmọ̀ sí àwọn tí a ti dá sí ègbé tàbí àwọn tí wọ́n wà nínú ìlànà píparun.
  choice: àwọn tí ń ṣègbé
  alternative: àwọn tí a ti dá sí ègbé; àwọn tí a ń pa run
  rationale: Present participle náà fi ipò tàbí ìṣe tí ń lọ lọ́wọ́ hàn. Ìtumọ̀ yìí kò fi ètò ẹ̀kọ́ ìgbàlà kan lé ẹsẹ náà lórí.
- issue: Bóyá ἀγάπη τῆς ἀληθείας túmọ̀ sí ìfẹ́ sí òtítọ́ tàbí ìfẹ́ tí òtítọ́ ní sí wọn.
  choice: ìfẹ́ òtítọ́
  alternative: ìfẹ́ sí òtítọ́; ìfẹ́ tí òtítọ́ ní
  rationale: Ọ̀rọ̀ Yorùbá yìí pa àkójọpọ̀ genitive mọ́. Àyíká ń tọ́ka gidigidi sí ìfẹ́ sí òtítọ́, ṣùgbọ́n a kò tú ìtumọ̀ náà sílẹ̀ pátápátá nínú ọ̀rọ̀ pàtàkì.
- issue: Bóyá εἰς τὸ σωθῆναι αὐτούς ń sọ ète tàbí àbájáde.
  choice: kí a lè gbà wọ́n là
  alternative: tí ì bá fi jẹ́ pé a gbà wọ́n là; fún gbígbà wọ́n là
  rationale: “Kí ... lè” jẹ́ kí ìtọ́kasí sí ète/àbájáde dúró láì yan ọ̀kan gẹ́gẹ́ bí ohun tí kò ṣeé yí padà.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. A yàgò fún ọ̀rọ̀ ẹ̀sìn àkànṣe tí ó lè fi ẹ̀kọ́ ẹgbẹ́ kan kún ẹsẹ náà. “Ń ṣègbé” àti “kí a lè gbà wọ́n là” jẹ́ àdánidá fún olùkà Yorùbá, nígbà tí àwọn àlàyé ìsàlẹ̀ ń pa àwọn ọ̀nà míì tí Gíríìkì lè gbà mọ́.
