  to: àti pẹ̀lú gbogbo ẹ̀tàn àìṣòdodo[a] fún àwọn tí ń ṣègbé,[b] nítorí wọn kò gba ìfẹ́ sí òtítọ́,[c] kí a lè gbà wọ́n là.[d]
