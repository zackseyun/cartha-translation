id: 2TH.1.5
reference: 2 Thessalonians 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: yo
  text: Èyí ni ẹ̀rí ìdájọ́ òdodo Ọlọ́run[a], kí a lè kà yín sí àwọn ẹni tí ó yẹ fún ìjọba Ọlọ́run[b], ìjọba náà tí ẹ̀yin pẹ̀lú ń jìyà nítorí rẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àmì” tàbí “ohun ìfihàn” ìdájọ́ òdodo Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún kí a kà yín sí àwọn ẹni tí ó yẹ” tàbí “èyí sì mú kí a kà yín sí àwọn ẹni tí ó yẹ.” Ìṣètò ọ̀rọ̀ Gíríìkì lè sọ ète tàbí àbájáde.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “fún ìfẹ́ ìjọba náà” tàbí “nítorí ìjọba náà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: ẹ̀rí
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun tí ó fi òtítọ́ kan hàn tàbí tí ó jẹ́ àmì rẹ̀. “Ẹ̀rí” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò fi dandan sọ pé ẹ̀rí náà ti parí gbogbo àríyànjiyàn. A fi “Èyí ni” kún un nítorí gbólóhùn Gíríìkì náà sinmi lé ẹsẹ tó ṣáájú.
- source_word: δικαίας κρίσεως
  choice: ìdájọ́ òdodo
  rationale: Èyí pa ìtumọ̀ pé ìdájọ́ Ọlọ́run tọ́ ní ti ìwà rere mọ́, ó sì jẹ́ èdè Bíbélì tí àwọn òǹkàwé Yorùbá lè lóye.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: kí a lè kà yín sí ẹni tí ó yẹ
  rationale: Ìtumọ̀ ìṣe aláìlórúkọ náà ni pé kí a kà wọ́n sí ẹni tí ó yẹ, kì í ṣe pé kí ìjìyà sọ wọ́n di ẹni yíyẹ nínú ara wọn. “Kí” lè tọ́ka sí ète tàbí àbájáde; àlàyé ìsàlẹ̀ ojú ìwé pa àìdánilójú yẹn mọ́.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ìjọba Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tí ó ṣe kedere, tí ó sì pa ọ̀nà ìsọ̀rọ̀ Bíbélì tí a mọ̀ mọ́.
- source_word: ὑπὲρ ἧς
  choice: nítorí rẹ̀
  rationale: Nínú àyíká yìí, ὑπέρ so ìjìyà wọn mọ́ ìjọba náà. “Nítorí rẹ̀” jẹ́ èdè Yorùbá àdánidá; àlàyé ìsàlẹ̀ ojú ìwé tún fi ìtumọ̀ “nítorí ti” tàbí “ní ipò” hàn.
- source_word: καὶ πάσχετε
  choice: ẹ̀yin pẹ̀lú ń jìyà
  rationale: “Ń jìyà” fi hàn pé ìjìyà náà ń bá a lọ, “pẹ̀lú” sì pa agbára καί mọ́.
theological_decisions:
- issue: Ìbáṣepọ̀ ìjìyà wọn pẹ̀lú yíyẹ fún ìjọba Ọlọ́run
  choice: Ìjìyà wọn jẹ́ ẹ̀rí ní ìbámu pẹ̀lú ìdájọ́ òdodo Ọlọ́run, ète tàbí àbájáde rẹ̀ sì ni pé a kà wọ́n sí ẹni tí ó yẹ fún ìjọba.
  alternative: Ìjìyà wọn fúnra rẹ̀ ni ó ń ra tàbí jẹ́ kí wọ́n ní ẹ̀tọ́ láti wọ ìjọba Ọlọ́run.
  rationale: Fáàbù aláìṣe καταξιωθῆναι túmọ̀ sí “kí a kà sí ẹni tí ó yẹ,” kì í ṣe “kí a sọ di ẹni yíyẹ.” Ìtumọ̀ yìí kò sọ ìjìyà di owó ẹ̀san fún wọlé sí ìjọba, ṣùgbọ́n ó pa ìsopọ̀ tí ọ̀rọ̀ náà ṣe láàárín ìjìyà, ìdájọ́ Ọlọ́run, àti yíyẹ wọn mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọ̀wọ̀, àti àdánidá pẹ̀lú àmì ohùn níbi tí ó yẹ. Gbólóhùn náà pa ìrìn ọ̀rọ̀ Gíríìkì mọ́ láì sọ àìdánilójú ète/àbájáde di ohun kan ṣoṣo. “A” nínú “kí a lè kà yín” jẹ́ aṣojú aláìsọ̀rọ̀ pàtó, ó sì yàgò fún fífi ẹni tí ọ̀rọ̀ Gíríìkì kò dárúkọ sí i.
