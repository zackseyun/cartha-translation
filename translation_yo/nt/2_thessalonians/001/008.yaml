id: 2TH.1.8
reference: 2 Thessalonians 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ⸂φλογὶ πυρός⸃, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: yo
  text: nínú iná tí ń jó[a], tí yóò sì mú ìgbẹ̀san ṣẹ[b] sórí àwọn tí kò mọ Ọlọ́run àti àwọn tí kò ṣègbọ́ràn sí ìhìn rere Olúwa wa Jesu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìtàná iná.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí yóò sì mú ìsanpadà ìdájọ́ ṣẹ sórí wọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: ní inú iná tí ń jó
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi àwòrán iná ọlọ́wọ́ tí ọ̀rọ̀ Gíríìkì náà ní hàn, láìlo gbólóhùn tí kò wọ́pọ̀.
- source_word: διδόντος
  choice: tí yóò sì mú ... ṣẹ
  rationale: Pẹ̀lú ἐκδίκησιν, διδόντος túmọ̀ sí mímú ìgbẹ̀san tàbí ìsanpadà ìdájọ́ ṣẹ, kì í ṣe ‘fífúnni’ lásán. Ọ̀rọ̀ ìṣe ọjọ́ iwájú bá ìṣípayá Olúwa nínú àyíká ẹsẹ tó ṣáájú mu.
- source_word: ἐκδίκησιν
  choice: ìgbẹ̀san
  rationale: ‘Ìgbẹ̀san’ pa agbára ọ̀rọ̀ orísun mọ́, ó sì jẹ́ kí àyíká ìdájọ́ Ọlọ́run ṣàlàyé irú ìgbẹ̀san náà dípò kí a rọ ọ́ sí ‘ìjìyà’ nìkan.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: àwọn tí kò mọ Ọlọ́run
  rationale: Ìtumọ̀ yìí jẹ́ ti gidi, ó sì fi ipò tí ó ń bá a lọ tí participle οἶδα ní hàn ní Yorùbá àdánidá.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: àwọn tí kò ṣègbọ́ràn
  rationale: ‘Kò ṣègbọ́ràn’ sọ ìtumọ̀ ὑπακούω ní tààrà, láìfi èrò pé wọ́n mọ̀ọ́mọ̀ kọ̀ ọ́ kun ohun tí fọ́ọ̀mù Gíríìkì kò sọ ní kedere.
- source_word: τῷ εὐαγγελίῳ
  choice: sí ìhìn rere
  rationale: ‘Ìhìn rere’ jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó wọ́pọ̀, tí ó sì pa ìtumọ̀ εὐαγγέλιον mọ́.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: Olúwa wa Jesu
  rationale: Èyí pa oyè κύριος, arọ́pò-orúkọ ‘wa,’ àti orúkọ Jesu mọ́ ní ìtòlẹ́sẹẹsẹ Yorùbá àdánidá.
theological_decisions:
- issue: Irú ἐκδίκησις nínú ìdájọ́ Ọlọ́run
  choice: ìgbẹ̀san
  alternative: ìsanpadà ìdájọ́; ìjìyà
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìsanpadà tí Olúwa tí a ṣí payá ń mú ṣẹ. ‘Ìgbẹ̀san’ pa líle ọ̀rọ̀ náà àti ìforígbárí ẹ̀kọ́ ìsìn rẹ̀ mọ́; àyíká náà fi hàn pé ìdájọ́ òdodo Ọlọ́run ni, kì í ṣe ìbínú ẹlẹ́ṣẹ̀ ti ènìyàn.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣeé lóye fún gbogbo ènìyàn ni a lò. Gbólóhùn náà ń tẹ̀ síwájú láti ẹsẹ 7, nítorí náà a pa àmì kọ́má ìparí àti ìbáṣepọ̀ participle mọ́. Àmì ohùn ni a fi sí ibi tí ó bá àṣà Yorùbá mu; ‘Jesu’ ni a kọ ní fọ́ọ̀mù tí ó wọ́pọ̀ nínú Yorùbá.
