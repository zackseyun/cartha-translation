id: 2TH.1.2
reference: 2 Thessalonians 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ àti àlàáfíà wà fún yín láti ọ̀dọ̀ Ọlọ́run Baba àti Olúwa Jésù Mèsáyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi.” Oyè Gíríìkì Χριστός ni a lè túmọ̀ sí “Kristi” tàbí “Mèsáyà”; níhìn-ín, “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún oore tí a fi fúnni láìjẹ́ pé ẹni náà tọ́ sí i; ó sì pa ìtumọ̀ ìkíni àti ìbùkún Pọ́ọ̀lù mọ́.
- source_word: ὑμῖν
  choice: fún yín
  rationale: Fún yín ni ọ̀nà àdánidá ní Yorùbá láti fi dative inú ìbùkún yìí hàn; yín tún pa ọ̀pọ̀ ènìyàn tí Gíríìkì ń tọ́ka sí mọ́.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Àlàáfíà jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìbàlẹ̀-ọkàn, ìwà-pẹ̀lẹ́ láàárín ènìyàn, àti ire pípé tí ọ̀rọ̀ náà lè gbé.
- source_word: ἀπὸ
  choice: láti ọ̀dọ̀
  rationale: Gbólóhùn yìí fi orísun oore-ọ̀fẹ́ àti àlàáfíà hàn lọ́nà Yorùbá tó ṣe déédé.
- source_word: θεοῦ πατρὸς
  choice: Ọlọ́run Baba wa
  rationale: Bó tilẹ̀ jẹ́ pé ἡμῶν (‘wa’) kò sí nínú ẹsẹ yìí, Baba wa jẹ́ ọ̀nà àdánidá tí Yorùbá fi ń sọ ìbáṣepọ̀ yìí, ó sì bá àṣà ìkíni Pọ́ọ̀lù mu.
- source_word: κυρίου
  choice: Olúwa
  rationale: Olúwa pa ipò oyè àti àṣẹ κύριος mọ́, ó sì jẹ́ ìtumọ̀ tí ó ti fìdí múlẹ̀ ní èdè Yorùbá.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Mèsáyà fi ìtumọ̀ Χριστός gẹ́gẹ́ bí ẹni àmì òróró yàn hàn kedere ju kí a kàn ṣe àdàkọ ohùn ọ̀rọ̀ náà lọ; ìsọ̀rí orúkọ méjèèjì sì jẹ́ àdánidá ní Yorùbá.
theological_decisions:
- issue: Fífi ‘wa’ kún ‘Baba’ nígbà tí ἡμῶν kò sí nínú ẹ̀dà Gíríìkì tí a tẹ̀ jáde
  choice: Ọlọ́run Baba wa
  alternative: Ọlọ́run Baba; Ọlọ́run, Baba náà
  rationale: Èdè Yorùbá nílò kí ìbáṣepọ̀ ‘Baba’ yìí ṣe kedere. ‘Baba wa’ bá ìlànà ìkíni Pọ́ọ̀lù àti ìtumọ̀ ìbáṣepọ̀ tó ṣeé retí mu, láìfi ẹ̀kọ́ tuntun kún ọ̀rọ̀ náà.
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ oyè ẹni àmì òróró yàn. ‘Mèsáyà’ pa ìtumọ̀ oyè náà mọ́; àkọsílẹ̀ ìsàlẹ̀ sì fún olùkà ní àṣàyàn ‘Kristi’ tí ó wọ́pọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ìrísí ìbùkún ‘Kí … wà fún yín’ kí gbolóhùn tí kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì lè ṣàn lọ́nà àdánidá ní Yorùbá, láìyí ohun tí a ń fẹ́ fún àwọn olùgbà lẹ́tà padà.
