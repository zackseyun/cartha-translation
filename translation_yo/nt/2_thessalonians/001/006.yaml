source:
  edition: SBLGNT
  text: εἴπερ δίκαιον παρὰ θεῷ ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/006.yaml
  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: yo
  text: níwọ̀n bí ó ti jẹ́ ohun tí ó tọ́ lọ́dọ̀ Ọlọ́run láti san ìpọ́njú fún àwọn tí ń pọ́n yín lójú[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ó bá jẹ́ nítòótọ́ pé ó jẹ́ òdodo lọ́dọ̀ Ọlọ́run láti san ìpọ́njú fún àwọn tí ń pọ́n yín lójú.”
    reason: Àṣàyàn ọ̀rọ̀ mìíràn fún εἴπερ àti δίκαιον; ó ṣàfihàn ìrísí ‘bí ó bá jẹ́ nítòótọ́’ àti ‘òdodo’.
lexical_decisions:
- source_word: εἴπερ
  choice: níwọ̀n bí
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà ń gbé ohun tí Pọ́ọ̀lù kà sí òtítọ́ kalẹ̀ gẹ́gẹ́ bí ìpìlẹ̀ ìròyìn, kì í ṣe bí iyèméjì lásán. “Níwọ̀n bí” sọ ìbáṣepọ̀ ọgbọ́n yẹn ní Yorùbá àdánidá, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń pa ìtumọ̀ àídájú “bí ó bá jẹ́ nítòótọ́” mọ́.
- source_word: δίκαιον
  choice: ohun tí ó tọ́
  rationale: Àṣàyàn yìí fi hàn pé ìsanpadà Ọlọ́run bá ìdájọ́ rere àti ìwà òdodo mu, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere fún òǹkàwé òde òní.
- source_word: παρὰ θεῷ
  choice: lọ́dọ̀ Ọlọ́run
  rationale: “Lọ́dọ̀ Ọlọ́run” tọ́ka sí ohun tí ó tọ́ ní ìbámu pẹ̀lú Ọlọ́run àti ní ojú ìdájọ́ rẹ̀, láìfi èrò ẹ̀kọ́ mìíràn kún un.
- source_word: ἀνταποδοῦναι
  choice: láti ... san
  rationale: Ọ̀rọ̀ “san” mú ìtumọ̀ fífi ohun tí ó yẹ padà gẹ́gẹ́ bí èsì tàbí ẹ̀san, ó sì bá ọ̀rọ̀ ìdájọ́ inú ẹsẹ náà mu.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: àwọn tí ń pọ́n yín lójú
  rationale: “Pọ́n ... lójú” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn ènìyàn ń mú ìyà, ìnira, tàbí inúnibíni bá wọn; ó tún ní ìbátan ọ̀rọ̀ pẹ̀lú “ìpọ́njú.”
- source_word: θλῖψιν
  choice: ìpọ́njú
  rationale: “Ìpọ́njú” sọ ìnira tó le koko tí a fi ṣe ìsanpadà, ó sì pa ìsopọ̀ ọ̀rọ̀ mọ́ pẹ̀lú “ń pọ́n yín lójú.”
theological_decisions:
- issue: Irú ìsanpadà Ọlọ́run
  choice: Ọlọ́run fi ìpọ́njú san àwọn tó ń pọ́n àwọn onígbàgbọ́ lójú, ṣùgbọ́n gbólóhùn yìí kò sọ gbogbo ìgbà tàbí ọ̀nà tí ìdájọ́ náà yóò gbà ṣẹlẹ̀.
  alternative: Kí a mú un dájú pé ìpọ́njú náà jẹ́ ti ìdájọ́ ọjọ́ ìkẹyìn nìkan, tàbí pé ó tún ní àwọn ìdájọ́ inú ìtàn ìsinsìnyí.
  rationale: Gíríìkì fi òdodo ìsanpadà Ọlọ́run múlẹ̀, ṣùgbọ́n gbólóhùn yìí fúnra rẹ̀ kò pinnu gbogbo àkókò tàbí ọ̀nà ìmúṣẹ rẹ̀. Ìtumọ̀ náà kò fi ètò ẹ̀kọ́ kan pàtó kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. Gbólóhùn náà mọ̀ọ́mọ̀ dúró gẹ́gẹ́ bí abala gbólóhùn tó ń bá ẹsẹ tó yí i ká lọ, bí ó ti rí nínú orísun Gíríìkì.
