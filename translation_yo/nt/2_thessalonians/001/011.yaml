id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: yo
  text: Nítorí èyí ni àwa pẹ̀lú fi máa ń gbàdúrà nígbà gbogbo fún yín, pé kí Ọlọ́run wa kà yín sí ẹni tí ó yẹ fún ìpè náà[a], kí ó sì fi agbára mú gbogbo ìpinnu rere[b] àti iṣẹ́ ìgbàgbọ́[c] ṣẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “sọ yín di ẹni tí ó yẹ fún ìpè náà.” Ọ̀rọ̀-ìṣe Gíríìkì lè túmọ̀ sí “kà sí ẹni tí ó yẹ” tàbí “sọ di ẹni tí ó yẹ.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “gbogbo ète ìwà rere” tàbí “gbogbo ìpinnu láti ṣe rere.”
    reason: lexical_alternative
  - marker: c
    text: “Iṣẹ́ ìgbàgbọ́” tún lè túmọ̀ sí “iṣẹ́ tí ìgbàgbọ́ mú jáde”; “ìgbàgbọ́” sì tún lè túmọ̀ sí “ìṣòtítọ́” ní àyíká ọ̀rọ̀ yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Nítorí èyí
  rationale: Ó tọ́ka padà sí ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì sọ ète àdúrà náà ní Yorùbá àdánidá.
- source_word: καὶ
  choice: pẹ̀lú
  rationale: Ó pa ìtumọ̀ àfikún mọ́ láì fi ìtẹnumọ́ tí kò sí nínú Gíríìkì kún un.
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: àwa ... máa ń gbàdúrà nígbà gbogbo fún yín
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí wọ́n ń ṣe déédéé hàn; ‘fún yín’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ẹni tí àdúrà kan.
- source_word: ἵνα
  choice: pé kí
  rationale: Ó ṣàgbékalẹ̀ ohun tí wọ́n ń béèrè nínú àdúrà náà ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: ἀξιώσῃ
  choice: kà yín yẹ
  rationale: Ó pa ìtumọ̀ pé Ọlọ́run gbà wọ́n sí ẹni tí ó yẹ mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé sì tọ́ka sí ìtumọ̀ mìíràn pé ó lè sọ wọ́n di ẹni tí ó yẹ.
- source_word: τῆς κλήσεως
  choice: fún ìpè náà
  rationale: Gíríìkì kò fi arọ́pò-orúkọ oníhun kún ‘ìpè’; ‘náà’ tọ́ka sí ìpè tí a ti mọ̀ láì dá ẹni tí ó ni í sílẹ̀.
- source_word: ὁ θεὸς ἡμῶν
  choice: Ọlọ́run wa
  rationale: Ó pa arọ́pò-orúkọ oníhun tí ó hàn gbangba nínú Gíríìkì mọ́.
- source_word: πληρώσῃ
  choice: mú ... ṣẹ
  rationale: Ó túmọ̀ sí mímú ète tàbí iṣẹ́ dé ìmúṣẹ ní Yorùbá àdánidá.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: gbogbo ìpinnu rere
  rationale: Ó mú èrò ìfẹ́-inú tàbí ète tí ìwà rere ń ṣàpèjúwe jáde, láì sọ ọ́ di ìmọ̀lára lásán.
- source_word: ἔργον πίστεως
  choice: iṣẹ́ ìgbàgbọ́
  rationale: Ìtumọ̀ yìí pa ìsopọ̀ genitive Gíríìkì mọ́, kí ó lè túmọ̀ sí iṣẹ́ tí ìgbàgbọ́ mú wá tàbí iṣẹ́ tí ìgbàgbọ́ ń ṣàpèjúwe.
- source_word: ἐν δυνάμει
  choice: fi agbára
  rationale: Ó jẹ́ kedere pé ìmúṣẹ náà ń ṣẹlẹ̀ pẹ̀lú agbára, láì ṣàlàyé ju ohun tí Gíríìkì sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ ἀξιώσῃ ní ìbáṣepọ̀ pẹ̀lú ìpè Ọlọ́run
  choice: kà yín yẹ fún ìpè náà
  alternative: sọ yín di ẹni tí ó yẹ fún ìpè náà
  rationale: Ọ̀rọ̀ Gíríìkì lè túmọ̀ sí kíkà ẹni sí ẹni tí ó yẹ tàbí sísọ ẹni di ẹni tí ó yẹ. Ọ̀rọ̀ pàtàkì yan ìtumọ̀ àkọ́kọ́, ṣùgbọ́n àlàyé pa èkejì mọ́ kí a má bàa yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ tí orísun náà kò yanjú.
- issue: Ìtumọ̀ πίστις nínú ἔργον πίστεως
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́; iṣẹ́ tí ìgbàgbọ́ mú jáde
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ tí ó wọ́pọ̀, ṣùgbọ́n ìsopọ̀ ọ̀rọ̀ Gíríìkì lè tọ́ka sí iṣẹ́ tí ìgbàgbọ́ bí tàbí iṣẹ́ tí ìṣòtítọ́ ń ṣàpèjúwe; àlàyé pa àwọn àǹfààní wọ̀nyí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A lo “máa ń gbàdúrà” fún ìṣe tí ó ń ṣẹlẹ̀ déédéé, àti “mú ... ṣẹ” fún ọ̀rọ̀ Yorùbá àdánidá.
