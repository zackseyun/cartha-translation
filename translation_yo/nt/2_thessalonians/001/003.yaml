  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa: ojúṣe ìdúpẹ́, ìṣe tí ń tẹ̀ síwájú, ìdí ìdúpẹ́ náà, ìdàgbàsókè ìgbàgbọ́, àti ìpọ̀sí ìfẹ́ wà níbẹ̀. Síbẹ̀, “sí ara yín” lè túmọ̀ sí ìfẹ́ ẹni kọ̀ọ̀kan sí ara ẹgbẹ́ náà lapapọ̀, tàbí ìfẹ́ sí ara ẹni ní ìmọ̀ kan; “sí ara wọn” ló ṣàfihàn εἰς ἀλλήλους, ‘sí ara wọn/ọ̀kan sí òmíràn,’ ní kedere jù.'
