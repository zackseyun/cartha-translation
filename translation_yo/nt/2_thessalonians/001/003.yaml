id: 2TH.1.3
reference: 2 Thessalonians 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: yo
  text: Ó yẹ kí a máa dúpẹ́ lọ́wọ́ Ọlọ́run nígbà gbogbo nítorí yín, ẹ̀yin arákùnrin[a], bí ó ti tọ́, nítorí ìgbàgbọ́ yín ń dàgbà lọ́pọ̀lọpọ̀, ìfẹ́ tí olúkúlùkù yín sì ní sí ara wọn ń pọ̀ sí i[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ẹ̀yin arákùnrin àti arábìnrin.” Ọ̀rọ̀ Gíríìkì sọ “arákùnrin,” ó sì lè jẹ́ ọ̀rọ̀ aṣojú fún gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì tẹnu mọ́ “olúkúlùkù nínú gbogbo yín.”
    reason: previous_rendering
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: Ó yẹ kí a máa dúpẹ́
  rationale: Ìsọ̀rọ̀ yìí fi ojúṣe ìwà rere hàn láì sọ ọ́ di dandan pátápátá; ‘máa dúpẹ́’ tún bá infinitive àti πάντοτε mu ní Yorùbá àdánidá.
- source_word: τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: lọ́wọ́ Ọlọ́run nígbà gbogbo nítorí yín
  rationale: ‘Dúpẹ́ lọ́wọ́ Ọlọ́run’ jẹ́ ọ̀nà Yorùbá àdánidá; ‘nítorí yín’ mú ìtumọ̀ ìdúpẹ́ nípa àwọn olùgbọ́ jáde.
- source_word: ἀδελφοί
  choice: ẹ̀yin arákùnrin
  rationale: Ó pa fọ́ọ̀mù akọ ọ̀pọ̀ ti Gíríìkì mọ́; àlàyé ìtumọ̀ aṣojú rẹ̀ fún gbogbo ìjọ wà ní àkọsílẹ̀ ìsàlẹ̀.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: bí ó ti tọ́
  rationale: Ó sọ ìbámu àti ohun tí ó yẹ ní Yorùbá ode òní, láì mú èrò pé ẹni kan ‘yẹ’ fún ẹ̀san wọlé.
- source_word: ὑπεραυξάνει ἡ πίστις ὑμῶν
  choice: ìgbàgbọ́ yín ń dàgbà lọ́pọ̀lọpọ̀
  rationale: ‘Ìgbàgbọ́’ ni ìtumọ̀ àkọ́kọ́ fún πίστις ní àyíká yìí, ‘lọ́pọ̀lọpọ̀’ sì pa agbára ìmúpọ̀ inú ὑπεραυξάνει mọ́.
- source_word: πλεονάζει ἡ ἀγάπη
  choice: ìfẹ́ ... ń pọ̀ sí i
  rationale: Ó jẹ́ Yorùbá tí ó rọrùn, ó sì pa ìṣe tí ń tẹ̀ síwájú ti ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí mọ́.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: ìfẹ́ tí olúkúlùkù yín ... ní sí ara yín
  rationale: ‘Olúkúlùkù yín’ mú ìtẹnumọ́ alápín ti gbolohun Gíríìkì jáde ní Yorùbá àdánidá; ‘sí ara yín’ fi ìfẹ́ ọ̀kan sí òmíràn hàn.
theological_decisions:
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́; ìgbẹ́kẹ̀lé
  rationale: Àyíká ọ̀rọ̀ náà tọ́ka sí ìgbàgbọ́ àwọn ará Tẹsalóníkà tí ń dàgbà. Bí ó tilẹ̀ jẹ́ pé πίστις lè ní ojú ìtumọ̀ ìṣòtítọ́ tàbí ìgbẹ́kẹ̀lé, kò yẹ kí a fi ojú ìtumọ̀ kan tí àyíká kò béèrè sí i.
- issue: Àwọn tí ἀδελφοί ń tọ́ka sí
  choice: ẹ̀yin arákùnrin
  alternative: ẹ̀yin arákùnrin àti arábìnrin; ẹ̀yin ọmọ ìyá
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ọ̀pọ̀, ṣùgbọ́n ó lè jẹ́ ọ̀rọ̀ aṣojú fún gbogbo àwùjọ onígbàgbọ́. A pa fọ́ọ̀mù orísun mọ́ nínú ẹsẹ̀, a sì ṣàlàyé ìwọ̀n ìtọ́kasí rẹ̀ ní àkọsílẹ̀.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé ode òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìṣètò gbolohun pa ìdúpẹ́, ìdí rẹ̀, àti ìtẹnumọ́ pé ìfẹ́ náà wà nínú olúkúlùkù wọn mọ́.
