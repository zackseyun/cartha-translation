source:
  edition: SBLGNT
  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: yo
  text: 'Àwọn wọ̀nyí yóò gba ìjìyà: ìparun ayérayé[a], ní jíjìnnà kúrò ní iwájú Olúwa àti nínú ògo agbára rẹ̀,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí bóyá, “ìparun ayérayé tí ó wá láti iwájú Olúwa àti láti inú ògo agbára rẹ̀.” Ọ̀rọ̀ ìṣáájú Gíríìkì náà lè túmọ̀ sí ìyapa (“ní jíjìnnà kúrò ní”) tàbí orísun (“tí ó wá láti”).
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: Àwọn wọ̀nyí
  rationale: Ó tọ́ka padà sí àwọn tí a mẹ́nu kàn ní ẹsẹ̀ tó ṣáájú, ó sì mú ìtumọ̀ àtẹ̀yìnwá náà jáde lọ́nà àdánidá ní Yorùbá.
- source_word: δίκην τίσουσιν
  choice: yóò jẹ ìjìyà
  rationale: Gbólóhùn Gíríìkì náà túmọ̀ sí gbígba tàbí jíjẹ ìjìyà gẹ́gẹ́ bí ìdájọ́. Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì dá ìtumọ̀ òfin àti ìdájọ́ náà dúró.
- source_word: ὄλεθρον
  choice: ìparun
  rationale: “Ìparun” fi bí ọ̀rọ̀ náà ṣe le tó hàn láìfi èrò ẹ̀kọ́ ìgbàgbọ́ kan pàtó kún irú ìdájọ́ ìkẹyìn náà.
- source_word: αἰώνιον
  choice: ayérayé
  rationale: Nínú àyíká ọ̀rọ̀ ìdájọ́ ìkẹyìn yìí, “ayérayé” ni ọ̀rọ̀ Yorùbá tó bá ìwà pípẹ́ àti ìkẹyìn ìparun náà mu jù.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: ní jíjìnnà sí iwájú Olúwa
  rationale: A ka ἀπό sí ìyapa tàbí jíjìnnà sí ohun kan. “Iwájú Olúwa” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ láti sọ wíwà ní ojú tàbí níbi tí ẹnì kan wà.
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: àti sí ògo agbára rẹ̀
  rationale: “Ògo” fún δόξα àti “agbára” fún ἰσχύς jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere; àtúnlò “sí” ń bá gbólóhùn “ní jíjìnnà sí” lọ.
theological_decisions:
- issue: Ìtumọ̀ ἀπό nípa ìdájọ́ ìkẹyìn
  choice: 'Ìyapa tàbí ìmúkúrò: “ní jíjìnnà sí iwájú Olúwa”'
  alternative: 'Orísun: ìparun tí ó ti iwájú Olúwa àti láti inú ògo agbára rẹ̀ wá'
  rationale: ἀπό lè túmọ̀ sí ìyapa, ó sì tún lè tọ́ka sí orísun. Àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn fún ìyapa, ṣùgbọ́n a fi ìtumọ̀ orísun sínú àlàyé ìsàlẹ̀ nítorí pé gírámà Gíríìkì gbà á láàyè, ó sì ní pàtàkì nínú ìtumọ̀ ẹsẹ̀ náà.
- issue: Ohun tí “ìparun ayérayé” túmọ̀ sí ní pàtó
  choice: A pa gbólóhùn náà mọ́ láìsọ ọ̀nà pàtó tí ìjìyà náà yóò gbà rí
  alternative: Kí a túmọ̀ rẹ̀ ní pàtó sí píparẹ́ pátápátá tàbí sí ìjìyà tí a ń mọ̀ láìdáwọ́ dúró
  rationale: Gbólóhùn Gíríìkì sọ bí ìdájọ́ náà ṣe le àti bí ó ṣe jẹ́ ayérayé, ṣùgbọ́n kò dá gbogbo àríyànjiyàn nípa irú ìjìyà ìkẹyìn náà yanjú. Nítorí náà, a kò fi ẹ̀kọ́ ẹ̀sìn ẹ̀gbẹ́ kankan kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ológo ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “jẹ ìjìyà” gẹ́gẹ́ bí àkànlò èdè Yorùbá àdánidá, a sì pa ìṣòro ìtumọ̀ ἀπό mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
