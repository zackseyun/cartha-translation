    text: Tàbí, “nínú àwọn ènìyàn mímọ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé a ó fi ògo fún un láàárín àwọn ènìyàn mímọ́ rẹ̀, tàbí pé ògo rẹ̀ yóò farahàn nínú wọn.
