review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the future coming, the holy people, those who believed, and the causal connection. However, “láti jẹ́ ẹni ìyanu” means “to be an amazing person,” not specifically “to be marveled at,” and “láti gba ògo” can sound like receiving glory rather than the passive sense of being glorified.
  naturalness: The proposed revision uses idiomatic, dignified modern Yoruba. The impersonal expressions “kí a lè fi ògo fún un” and “kí a lè yà sí i” naturally express the Greek passive infinitives without making an unwarranted claim about the agent.
  terminology: “Àwọn ènìyàn mímọ́ rẹ̀” is understandable and nonsectarian. “Fi ògo fún un” accurately preserves glorification, while “yà sí i” conveys astonished admiration rather than merely calling him wonderful.
  issues:
  - severity: medium
    issue: “láti jẹ́ ẹni ìyanu” does not adequately render θαυμασθῆναι.
    rationale: The expression describes Christ as an amazing person, whereas the Greek passive means that he will be the object of amazement or admiration. “Kí a lè yà sí i” directly expresses this response.
  - severity: low
    issue: “láti gba ògo” can obscure the passive force of ἐνδοξασθῆναι.
    rationale: Although it can be understood appropriately in context, it may suggest receiving glory. “Kí a lè fi ògo fún un” makes the sense of being glorified explicit.
  revised_text: ní ọjọ́ náà, nígbà tí ó bá dé, kí a lè fi ògo fún un láàárín àwọn ènìyàn mímọ́ rẹ̀[a], àti kí a lè yà sí i láàárín gbogbo àwọn tí ó ti gbàgbọ́, nítorí a gba ẹ̀rí wa fún yín gbọ́.
  revised_footnotes:
