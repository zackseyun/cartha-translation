id: 2TH.1.10
reference: 2 Thessalonians 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: yo
  text: ní ọjọ́ náà, nígbà tí ó bá dé, kí a lè fi ògo fún un láàárín àwọn ènìyàn mímọ́ rẹ̀[a], àti kí a lè yà sí i láàárín gbogbo àwọn tí ó ti gbàgbọ́, nítorí a gba ẹ̀rí wa fún yín gbọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú àwọn ènìyàn mímọ́ rẹ̀.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí pé a ó fi ògo fún un láàárín àwọn ènìyàn mímọ́ rẹ̀, tàbí pé ògo rẹ̀ yóò farahàn nínú wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: nígbà tí ó bá dé
  rationale: Àkójọpọ̀ ὅταν pẹ̀lú aorist subjunctive tọ́ka sí ìṣẹ̀lẹ̀ ọjọ́ iwájú kan tí a dá lójú; ‘nígbà tí ó bá dé’ jẹ́ Yorùbá àdánidá tí ó pa ìtọ́kasí ọjọ́ iwájú mọ́.
- source_word: ἐνδοξασθῆναι
  choice: láti gba ògo
  rationale: Gbólóhùn yìí pa ìtumọ̀ passive ti fífi ògo fún un mọ́, ó sì bá ọ̀rọ̀ nípa ògo Ọlọ́run mu ju ‘láti gba ọlá’ lọ.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: láàárín àwọn ènìyàn mímọ́ rẹ̀
  rationale: ‘Láàárín’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ἐν ní ìtumọ̀ ẹgbẹ́ àwọn ènìyàn; ‘àwọn ènìyàn mímọ́ rẹ̀’ ṣàlàyé ἅγιοι láìfi èrò ẹ̀sìn ẹgbẹ́ kan kún un.
- source_word: θαυμασθῆναι
  choice: láti jẹ́ ẹni ìyanu
  rationale: Ó fi ìyàlẹ́nu àti ọ̀wọ̀ tí àwọn olùgbàgbọ́ yóò ní sí i hàn, ó sì pa fọ́ọ̀mù passive mọ́ lọ́nà Yorùbá tó ṣeé lóye.
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: láàárín gbogbo àwọn tí ó ti gbàgbọ́
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe participle πιστεύσασιν mọ́ dípò yíyí i padà sí orúkọ lasán, ó sì bá ‘láàárín’ tó ṣáájú mu.
- source_word: ὅτι
  choice: nítorí
  rationale: Ní àyíká yìí ὅτι ń fúnni ní ìdí tí àwọn ará Tẹsalóníkà fi wà lára àwọn tó gbàgbọ́.
- source_word: ἐπιστεύθη
  choice: ẹ̀yin gba ... gbọ́
  rationale: Bí ó tilẹ̀ jẹ́ pé Gíríìkì lò passive (‘ẹ̀rí ... ni a gbà gbọ́’), active pẹ̀lú ‘ẹ̀yin’ jẹ́ Yorùbá tó ṣe déédé, ó sì mú ẹni tí ἐφ’ ὑμᾶς ń tọ́ka sí hàn kedere láìyí ìtumọ̀ padà.
- source_word: τὸ μαρτύριον ἡμῶν
  choice: ẹ̀rí wa
  rationale: ‘Ẹ̀rí wa’ jẹ́ ọ̀rọ̀ Yorùbá kúkúrú, àdánidá fún ẹ̀rí tàbí ìkéde àwọn aposteli.
- source_word: ἐφ’ ὑμᾶς
  choice: ẹ̀yin
  rationale: Nínú ìtúmọ̀ active Yorùbá, pronoun yìí fi hàn pé àwọn ará Tẹsalóníkà ni wọ́n gba ẹ̀rí tí a mú tọ̀ wọ́n wá gbọ́.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ní ọjọ́ náà
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún gbólóhùn àsìkò náà, ó sì pa ìjẹ́pàtàkì ọjọ́ ìkẹyìn mọ́.
theological_decisions:
- issue: Ìtọ́kasí àti ipa ‘àwọn ènìyàn mímọ́ rẹ̀’ nígbà ìpadàbọ̀ Kristi
  choice: A túmọ̀ rẹ̀ sí ‘láàárín àwọn ènìyàn mímọ́ rẹ̀,’ tí ó ń tọ́ka sí àwọn ènìyàn Kristi.
  alternative: ‘Nínú àwọn ènìyàn mímọ́ rẹ̀,’ èyí tí ó tẹnu mọ́ pé ògo rẹ̀ yóò farahàn nínú wọn.
  rationale: Àyíká tó so àwọn ènìyàn mímọ́ pọ̀ mọ́ ‘gbogbo àwọn tí ó ti gbàgbọ́’ ń ṣètìlẹ́yìn fún àwọn olùgbàgbọ́ gẹ́gẹ́ bí ẹni tí ọ̀rọ̀ náà ń tọ́ka sí. Síbẹ̀, ἐν lè túmọ̀ sí ‘nínú’ tàbí ‘láàárín,’ nítorí náà a pa àṣàyàn kejì mọ́ sínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ πιστεύσασιν àti ἐπιστεύθη nípa ẹ̀rí àwọn aposteli
  choice: 'A lo èdè ìgbàgbọ́ lasán: ‘àwọn tí ó ti gbàgbọ́’ àti ‘ẹ̀yin gba ẹ̀rí wa gbọ́.’'
  alternative: ‘Àwọn tí wọ́n gbàgbọ́’ àti ‘ẹ̀rí wa ni a gbà gbọ́ láàárín yín.’
  rationale: Kò sí ìdí láti fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ ẹgbẹ́ kan kún un. Active Yorùbá mú gbólóhùn náà rọrùn, ṣùgbọ́n ó pa ìbáṣepọ̀ tó wà láàárín ìkéde àti ìgbàgbọ́ mọ́.
- issue: Ibi tí ‘ní ọjọ́ náà’ yẹ kí ó wà nínú gbólóhùn
  choice: A gbé e sí ìbẹ̀rẹ̀ fún Yorùbá àdánidá.
  alternative: A lè fi sí òpin gẹ́gẹ́ bí ìtòlẹ́sẹẹsẹ Gíríìkì, kí ó sì ka gbogbo gbólóhùn náà mọ́ra.
  rationale: Ìgbé e sí ìbẹ̀rẹ̀ mú kí àsìkò tó ń ṣàkóso gbogbo ìṣẹ̀lẹ̀ náà yé kedere; àlàyé ìsàlẹ̀ pa ìtòlẹ́sẹẹsẹ mìíràn mọ́.
translation_notes:
  register: Yorùbá ìpele àárín tí ó ní iyì, tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá èdè, a sì yẹra fún ọ̀rọ̀ ẹ̀sìn ẹgbẹ́ kan. ‘Ẹni ìyanu’ ń sọ ìyàlẹ́nu ọlọ́wọ̀ tí θαυμασθῆναι ní lọ́nà tó rọrùn ju ìtumọ̀ líle tàbí àtijọ́ lọ.
