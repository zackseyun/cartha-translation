  to: ní ọjọ́ náà, nígbà tí ó bá dé, kí a lè fi ògo fún un láàárín àwọn ènìyàn mímọ́ rẹ̀[a], àti kí a lè yà sí i láàárín gbogbo àwọn tí ó ti gbàgbọ́, nítorí a gba ẹ̀rí wa fún yín gbọ́.
  rationale: The revision replaces two expressions that weaken or alter the Greek passive meanings. It retains the temporal framing at the beginning, preserves the ambiguity of ἐν through footnote a, and keeps the prior word-order alternative in footnote b. The active Yoruba clause “a gba ẹ̀rí wa fún yín gbọ́” remains a natural way to communicate that the apostolic testimony delivered to the Thessalonians was believed.
