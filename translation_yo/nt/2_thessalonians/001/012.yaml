- from: kí orúkọ Olúwa wa Jesu lè gba ògo nínú yín[a], kí ẹ̀yin náà sì gba ògo nínú rẹ̀, gẹ́gẹ́ bí oore-ọ̀fẹ́ Ọlọ́run wa àti Olúwa Jesu Mèsáyà[b].[c]
  to: kí a lè gbé orúkọ Olúwa wa Jésù ga nínú yín[a], kí a sì gbé ẹ̀yin náà ga nínú rẹ̀, gẹ́gẹ́ bí oore-ọ̀fẹ́ Ọlọ́run wa àti Olúwa Jésù Mèsáyà.[b][c]
