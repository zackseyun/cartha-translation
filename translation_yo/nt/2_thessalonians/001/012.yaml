  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé èrò gbolohun Gíríìkì dáadáa: ète àdúrà, ‘orúkọ,’ ìbáralọ̀ ‘nínú yín/nínú rẹ̀,’ àti ìpìlẹ̀ ‘gẹ́gẹ́ bí oore-ọ̀fẹ́’ wà níbẹ̀. Síbẹ̀, ‘gba ògo’ lè dá bí ẹni pé orúkọ àti àwọn onígbàgbọ́ ń gba ohun kan, dípò ìṣe àfaradà ἐνδοξασθῇ (‘kí a yin/gbé ... ga’).'
