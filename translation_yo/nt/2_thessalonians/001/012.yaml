id: 2TH.1.12
reference: 2 Thessalonians 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: yo
  text: kí a lè gbé orúkọ Olúwa wa Jésù ga nínú yín[a], kí a sì gbé ẹ̀yin náà ga nínú rẹ̀, gẹ́gẹ́ bí oore-ọ̀fẹ́ Ọlọ́run wa àti Olúwa Jésù Mèsáyà.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘láàárín yín.’ Ọ̀rọ̀ Gíríìkì náà lè ní èyíkéyìí nínú ìtumọ̀ méjèèjì nínú àyíká yìí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè lo ‘Kristi’ dípò ‘Mèsáyà.’ Oyè Gíríìkì náà ni Χριστός.
    reason: alternative_reading
  - marker: c
    text: A lè lóye gbolohun ìkẹyìn gẹ́gẹ́ bí èyí tí ó so ‘Ọlọ́run’ àti ‘Olúwa Jésù Mèsáyà’ pọ̀ tímọ́tímọ́ nínú gbólóhùn kan, tàbí gẹ́gẹ́ bí èyí tí ó ń tọ́ka lọ́tọ̀ sí ‘Ọlọ́run wa’ àti ‘Olúwa Jésù Mèsáyà.’ Ìtumọ̀ yìí pa ọ̀nà tí Gíríìkì gbà sọ ọ́ mọ́ láì fi tipátipá pinnu ọ̀ràn náà.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: kí
  rationale: Ó ṣàfihàn ète tàbí àbájáde àdúrà tí ó ṣáájú; ‘kí’ ni ọ̀nà Yorùbá àdánidá láti gbé èrò yìí jáde.
- source_word: ἐνδοξασθῇ
  choice: lè gba ògo
  rationale: Ọ̀rọ̀ yìí wà ní ìṣe-àfaradà, ó sì ń tọ́ka sí àbájáde tí a ń fẹ́; ‘gba ògo’ pa èrò pé a yin tàbí a ṣe ẹni náà ní ológo mọ́.
- source_word: τὸ ὄνομα
  choice: orúkọ
  rationale: A pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́ dípò ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ìdánimọ̀ tàbí òkìkí ẹni.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: Olúwa wa Jesu
  rationale: Ó pa oyè κύριος, ìní ‘wa,’ àti orúkọ Jesu mọ́ ní ìṣètò ọ̀rọ̀ Yorùbá tí ó rọrùn.
- source_word: ἐν ὑμῖν
  choice: nínú yín
  rationale: Ó tẹ̀ lé ìtumọ̀ pàtàkì ti ἐν, ó sì lè tọ́ka sí ohun tí ó ṣẹlẹ̀ nínú àwọn onígbàgbọ́; ẹsẹ̀ ìsàlẹ̀ fi ìtumọ̀ àpapọ̀ ‘láàárín yín’ hàn.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: kí ẹ̀yin náà sì gba ògo nínú rẹ̀
  rationale: A tún ọ̀rọ̀-ìṣe ‘gba ògo’ ṣe ní Yorùbá kí ìbáralọ̀ tó wà nínú Gíríìkì ṣe kedere. ‘Nínú rẹ̀’ tọ́ka lọ́nà àdánidá sí Olúwa Jesu.
- source_word: κατὰ τὴν χάριν
  choice: gẹ́gẹ́ bí oore-ọ̀fẹ́
  rationale: ‘Gẹ́gẹ́ bí’ pa ìtumọ̀ òṣùwọ̀n tàbí ìbámu ti κατά mọ́, láì sọ ọ́ di ọ̀nà-ìṣe nìkan.
- source_word: χάριν
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún χάρις nínú lẹ́tà Paulu, ó sì ní ìtumọ̀ ojúrere tí a kò tọ́ sí.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: Ọlọ́run wa àti Olúwa Jesu Mèsáyà
  rationale: A pa ìṣọ̀kan gbolohun Gíríìkì mọ́ láì fi ‘ti’ kejì kún un, èyí tí ì bá fi tipátipá ya àwọn ẹni tí a ń tọ́ka sí sọ́tọ̀. Χριστός jẹ́ oyè níhìn-ín, nítorí náà a túmọ̀ rẹ̀ sí ‘Mèsáyà.’
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àyíká yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde.
- issue: Ẹni tí αὐτῷ ń tọ́ka sí
  choice: rẹ̀ (Olúwa Jesu)
  alternative: rẹ̀ (orúkọ náà)
  rationale: Ìbámu méjì—Olúwa gba ògo nínú àwọn onígbàgbọ́, àwọn náà sì gba ògo nínú rẹ̀—mú kí Jesu jẹ́ ẹni tí ó ṣeé ṣe jù lọ; síbẹ̀, Yorùbá ‘rẹ̀’ kò fi akọ tàbí abo hàn, nítorí náà kò pa gbogbo àṣàyàn gírámà dé pátápátá.
- issue: Agbára gbolohun genitive ìkẹyìn
  choice: Ọlọ́run wa àti Olúwa Jesu Mèsáyà
  alternative: Ọlọ́run wa àti ti Olúwa Jesu Mèsáyà
  rationale: Ìtúmọ̀ àkọ́kọ́ pa ọ̀rọ̀ Gíríìkì mọ́ ní ṣókí, kò sì fi ọ̀rọ̀ míì kún un láti pinnu bóyá gbolohun náà ń so àwọn oyè pọ̀ mọ́ ẹni kan tàbí ń tọ́ka sí ẹni méjì lọ́tọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ṣùgbọ́n ó jẹ́ ti èdè òde òní tí òǹkàwé lasán lè lóye. A lo ‘gba ògo’ dípò ọ̀rọ̀ tí ó le tàbí àtijọ́, a sì pa ìbáralọ̀ inú gbolohun náà mọ́.
