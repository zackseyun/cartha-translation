id: 2TH.1.7
reference: 2 Thessalonians 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: yo
  text: àti láti fún ẹ̀yin tí a ń pọ́n lójú ní ìtura pẹ̀lú wa, nígbà ìṣípayá Olúwa Jésù, ẹni tí ó ti ọ̀run wá, pẹ̀lú àwọn áńgẹ́lì agbára rẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà Yorùbá tó rọrùn sí i, “pẹ̀lú àwọn áńgẹ́lì alágbára rẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς θλιβομένοις
  choice: ẹ̀yin tí a ń pọ́n lójú
  rationale: Ọ̀rọ̀ yìí fi hàn pé wọ́n ń fi ìpọ́njú tàbí ìnilára bá wọn lọ́wọ́lọ́wọ́; gbólóhùn Yorùbá náà pa ìtumọ̀ àkókò tí ó ń lọ àti ohùn àìṣe mọ́.
- source_word: ἄνεσιν
  choice: ìtura
  rationale: “Ìtura” túmọ̀ sí ìdẹ̀rùn kúrò lábẹ́ ìpọ́njú, ó sì bá ìtakora pẹ̀lú ìnilára inú àyíká ọ̀rọ̀ mu ju ìsinmi lásán lọ.
- source_word: μεθ’ ἡμῶν
  choice: pẹ̀lú wa
  rationale: Èyí pa ìbáṣepọ̀ tí μετά pẹ̀lú ọ̀rọ̀-orúkọ oníjẹ́nítífù ń fi hàn mọ́, ó sì fi Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀ sínú ìtura kan náà.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: nígbà ìṣípayá
  rationale: “Nígbà” mú agbára àkókò ti ἐν yé kedere, nígbà tí “ìṣípayá” pa ìrísí ọ̀rọ̀-orúkọ àti èrò ìṣípayá ohun tí ó farapamọ́ mọ́.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Olúwa Jésù
  rationale: “Olúwa” jẹ́ ìtumọ̀ tó fìdí múlẹ̀ fún κύριος gẹ́gẹ́ bí oyè, “Jésù” sì jẹ́ àkọsílẹ̀ Yorùbá tí a mọ̀ dáadáa.
- source_word: ἀπ’ οὐρανοῦ
  choice: láti ọ̀run
  rationale: Ó sọ orísun tàbí ibi tí ìṣípayá náà ti wá, gẹ́gẹ́ bí ἀπό ṣe ń tọ́ka sí.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: pẹ̀lú àwọn áńgẹ́lì agbára rẹ̀
  rationale: Ìtumọ̀ yìí dúró sún mọ́ ìkọ̀sílẹ̀ jẹ́nítífù Gíríìkì, ó sì yàgò fún pípa ìtumọ̀ rẹ̀ mọ́ sí pé àwọn áńgẹ́lì náà alágbára nìkan; ìtumọ̀ Yorùbá tó rọrùn sí i wà nínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn jẹ́nítífù ἀγγέλων δυνάμεως αὐτοῦ
  choice: pẹ̀lú àwọn áńgẹ́lì agbára rẹ̀
  alternative: pẹ̀lú àwọn áńgẹ́lì alágbára rẹ̀
  rationale: Gíríìkì náà lè túmọ̀ sí àwọn áńgẹ́lì tí ó ní í ṣe pẹ̀lú agbára rẹ̀ tàbí, ní ọ̀nà àpèjúwe, àwọn áńgẹ́lì rẹ̀ tí ó lágbára. Ọ̀rọ̀ inú ẹsẹ pa ìṣòro ìtumọ̀ náà mọ́; àlàyé ìsàlẹ̀ sì fúnni ní ọ̀nà Yorùbá tó ṣe déédéé sí i.
- issue: Agbára àkókò ti ἐν τῇ ἀποκαλύψει
  choice: nígbà ìṣípayá
  alternative: nígbà tí Olúwa Jésù yóò farahàn
  rationale: Ìtumọ̀ tí a yàn so ìtura náà mọ́ àkókò ìṣípayá Jésù, ó sì pa ọ̀rọ̀-orúkọ ἀποκάλυψις mọ́ dípò yíyí i padà sí ọ̀rọ̀-ìṣe pátápátá.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Láti fún” mú ìbáṣepọ̀ ẹsẹ yìí pẹ̀lú ọ̀rọ̀-ìṣe inú ẹsẹ tó ṣáájú hàn ní Yorùbá, láì yí ìtumọ̀ rẹ̀ padà. Àmì àlàyé [a] wà lẹ́gbẹ̀ẹ́ gbólóhùn àwọn áńgẹ́lì tí àlàyé náà ń ṣàlàyé.
