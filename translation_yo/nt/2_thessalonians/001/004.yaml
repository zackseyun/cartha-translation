id: 2TH.1.4
reference: 2 Thessalonians 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: yo
  text: Tó fi jẹ́ pé àwa fúnra wa ń fi yín ṣògo láàárín àwọn ìjọ Ọlọ́run nítorí ìfaradà àti ìgbàgbọ́[a] yín nínú gbogbo inúnibíni àti ìpọ́njú tí ẹ̀ ń fara dà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdúróṣinṣin”; πίστις lè túmọ̀ sí ìgbàgbọ́ tàbí ìdúróṣinṣin, pàápàá ní àyíká ìjìyà.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi àbájáde ohun tí a sọ ṣáájú hàn; èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti so àbájáde náà pọ̀ mọ́ ọ̀rọ̀ tó ṣáájú.
- source_word: αὐτοὺς ἡμᾶς
  choice: àwa fúnra wa
  rationale: Ó pa ìtẹnumọ́ tó wà lórí Paulu àti àwọn alábàáṣiṣẹ́ rẹ̀ mọ́.
- source_word: ἐν ὑμῖν ἐγκαυχᾶσθαι
  choice: ń fi yín ṣògo
  rationale: Ní ọ̀rọ̀ yìí, ἐν ὑμῖν tọ́ka sí àwọn tí wọ́n jẹ́ ìdí tàbí ohun ìṣògo; gbolohun Yorùbá yìí ṣe àfihàn ìtumọ̀ náà láì dín agbára ọ̀rọ̀ Gíríìkì kù.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: láàárín àwọn ìjọ Ọlọ́run
  rationale: Ó tọ́ka sí àwùjọ àwọn ìjọ púpọ̀ tí Ọlọ́run ni, níbi tí wọ́n ti ń sọ ìṣògo náà.
- source_word: ὑπὲρ
  choice: nítorí
  rationale: Níhìn-ín ó ṣàlàyé ìdí tí wọ́n fi ń fi àwọn ará Tẹsalóníkà ṣògo.
- source_word: ὑπομονῆς
  choice: ìfaradà
  rationale: Ó túmọ̀ sí dídúró ṣinṣin àti fífarada lábẹ́ ìnira; ‘ìfaradà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká inúnibíni mu.
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Èyí ni ìtumọ̀ àkọ́kọ́ tó wọ́pọ̀ fún πίστις; ṣùgbọ́n ó tún lè ní ìtumọ̀ ìṣòtítọ́ tí ó dúró ṣinṣin, nítorí náà a pa àṣàyàn náà mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: διωγμοῖς
  choice: inúnibíni
  rationale: Ó sọ ní pàtó nípa ìkóguntini tàbí ìhùwàsí ọ̀tá sí ènìyàn nítorí ohun tí ó gbàgbọ́.
- source_word: θλίψεσιν
  choice: ìpọ́njú
  rationale: Ó ṣàfihàn ìnira, ìtẹ̀sí tàbí wàhálà tó ń tẹ ènìyàn mọ́lẹ̀, ó sì yàtọ̀ díẹ̀ sí inúnibíni.
- source_word: αἷς ἀνέχεσθε
  choice: tí ẹ̀ ń fara dà
  rationale: Àkókò ìṣe tó ń lọ nínú Gíríìkì fi hàn pé ìrírí náà ṣì ń bá a lọ; ‘ń fara dà’ pa èyí mọ́ ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ πίστις ní àyíká ìjìyà, níbi tí ‘ìgbàgbọ́’ àti ‘ìṣòtítọ́’ ti ṣeé ṣe
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́; ìgbẹ́kẹ̀lé
  rationale: ‘Ìgbàgbọ́’ pa ìtumọ̀ àkọ́kọ́ àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ tó gbooro mọ́; síbẹ̀, àyíká ìfaradà lábẹ́ inúnibíni jẹ́ kí ìtumọ̀ ìṣòtítọ́ tó dúró ṣinṣin ṣeé ṣe, nítorí náà a fi sí àlàyé ìsàlẹ̀ láì yanju àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá àpéjọ tó bójú mu, tó ní àmì ohùn ní kíkún, tó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ń fi yín ṣògo’ pa agbára ìṣògo inú ọ̀rọ̀ Gíríìkì mọ́, nígbà tí ‘inúnibíni’ àti ‘ìpọ́njú’ pa ìyàtọ̀ láàárín ìkóguntini àti ìnira tó gbooro mọ́.
