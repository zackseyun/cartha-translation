id: 2TH.1.1
reference: 2 Thessalonians 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: yo
  text: 'Pọ́ọ̀lù, Sílífánù àti Tímótì, sí ìjọ àwọn ará Tẹsalóníkà, tí ó wà nínú Ọlọ́run Baba wa àti Olúwa Jésù Mèsáyà[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi.” Akọ́lé Gíríìkì Χριστός lè túmọ̀ sí “Mèsáyà” tàbí, gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀, “Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Pọ́ọ̀lù
  rationale: Àkọ̀wé orúkọ Παῦλος ní ìlànà Yorùbá tí ó wọ́pọ̀, pẹ̀lú àmì ohùn.
- source_word: Σιλουανὸς
  choice: Sílífánù
  rationale: A tẹ̀lé orúkọ gígùn Σιλουανός gan-an dípò lílo Sílà láti inú Ìṣe Àwọn Aposteli.
- source_word: Τιμόθεος
  choice: Tímótì
  rationale: Ìrísí Yorùbá tí ó wọ́pọ̀ fún orúkọ Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: ìjọ
  rationale: “Ìjọ” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún àwùjọ àwọn onígbàgbọ́ tí ó péjọ.
- source_word: Θεσσαλονικέων
  choice: àwọn ará Tẹsalóníkà
  rationale: Ó tọ́ka sí àwọn ènìyàn Tẹsalóníkà, kì í ṣe ibi náà nìkan; “àwọn ará Tẹsalóníkà” pa ìtumọ̀ jentílíkì mọ́.
- source_word: ἐν
  choice: tí ó wà nínú
  rationale: “Nínú” pa gbólóhùn ẹ̀kọ́ ìgbàgbọ́ Pọ́ọ̀lù mọ́ láì pinnu bóyá ó túmọ̀ sí ìṣọ̀kan, ààyè ẹ̀mí, tàbí jíjẹ́ ti ẹnì kan; “tí ó wà” mú un jẹ́ Yorùbá àdánidá.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: Ọlọ́run Baba wa
  rationale: Ó pa ọ̀rọ̀ arọ́pò oníhun ἡμῶν (“wa”) mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó bójú mu láti sọ ‘God our Father.’
- source_word: κυρίῳ
  choice: Olúwa
  rationale: “Olúwa” ni akọ́lé Yorùbá tí ó yẹ fún κύριος nígbà tí a lò ó fún Jésù.
- source_word: Ἰησοῦ Χριστῷ
  choice: Jésù Mèsáyà
  rationale: “Jésù” ni orúkọ, “Mèsáyà” sì fi ipò akọ́lé Χριστός hàn dípò yíyí i padà sí orúkọ lasán.
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ nínú Ἰησοῦ Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ akọ́lé ẹni àmì òróró; “Mèsáyà” mú ipò akọ́lé yẹn hàn, nígbà tí àlàyé ìsàlẹ̀ fi “Kristi” sílẹ̀ gẹ́gẹ́ bí ìtumọ̀ ìbílẹ̀.
- issue: Ìbáṣepọ̀ tí ἐν sọ nínú ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: tí ó wà nínú Ọlọ́run Baba wa àti Olúwa Jésù Mèsáyà
  alternative: tí ó jẹ́ ti Ọlọ́run Baba wa àti Olúwa Jésù Mèsáyà
  rationale: A pa “nínú” mọ́ kí a má bàa yanju ní ìkọ̀kọ̀ bóyá ἐν ń sọ nípa jíjẹ́ ti wọn, ìdásílẹ̀ nínú wọn, tàbí ìṣọ̀kan pẹ̀lú wọn.
translation_notes:
  register: Yorùbá àpéjọ tí ó lọ́lá, tó ṣe kedere fún òǹkàwé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá bá èdè mu. A lo àmì àkójọpọ̀ Yorùbá tó rọrùn, a sì fi àmì àlàyé [a] sí lẹ́yìn ọ̀rọ̀ tí ó kan.
