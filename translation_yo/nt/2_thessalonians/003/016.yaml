id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: yo
  text: Kí Olúwa àlàáfíà fúnra rẹ̀ fún yín ní àlàáfíà nígbà gbogbo[a] ní gbogbo ọ̀nà[b]. Kí Olúwa wà pẹ̀lú gbogbo yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ní gbogbo ìgbà” fún “nígbà gbogbo.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ní gbogbo irú ọ̀nà” fún “ní gbogbo ọ̀nà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: fúnra rẹ̀
  rationale: Ó ṣe àfihàn ìtẹnumọ́ pé Olúwa fúnra rẹ̀ ni ẹni tí yóò fi àlàáfíà fún wọn.
- source_word: δὲ
  choice: kò ní ọ̀rọ̀ ọ̀tọ̀ nínú ìtumọ̀
  rationale: Níhìn-ín, δέ jẹ́ àmì ìyípadà pẹ̀lẹ́ sí àdúrà ìbùkún; ìbẹ̀rẹ̀ pẹ̀lú “Kí” ń mú iṣẹ́ rẹ̀ ṣẹ lọ́nà àdánidá ní Yorùbá láìfi ọ̀rọ̀ àkókò tí kò sí nínú Gíríìkì kún un.
- source_word: ὁ κύριος τῆς εἰρήνης
  choice: Olúwa àlàáfíà
  rationale: Ó pa ọ̀rọ̀ oyè náà mọ́ láìtú u sí àsọyé bí “ẹni tí ń fúnni ní àlàáfíà.”
- source_word: δῴη
  choice: Kí ... fún
  rationale: Ìlò optative yìí jẹ́ àdúrà tàbí ìfẹ́ inú ìbùkún, kì í ṣe gbólóhùn ìròyìn lasan.
- source_word: τὴν εἰρήνην
  choice: àlàáfíà
  rationale: “Àlàáfíà” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún εἰρήνη nínú àdúrà ìbùkún yìí.
- source_word: διὰ παντὸς
  choice: nígbà gbogbo
  rationale: Ó fi ìtẹ̀síwájú jálẹ̀ gbogbo àkókò hàn ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐν παντὶ τρόπῳ
  choice: ní gbogbo ọ̀nà
  rationale: Ó pa ìtúmọ̀ ọ̀nà tàbí bí ohun ṣe ń ṣẹlẹ̀ mọ́, láìdín fífẹ̀ gbólóhùn Gíríìkì náà kù.
- source_word: μετὰ πάντων ὑμῶν
  choice: pẹ̀lú gbogbo yín
  rationale: Ó pa ìtẹnumọ́ πάντων mọ́, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí nínú ìbùkún náà
  choice: Pa “Olúwa” mọ́ láìfi orúkọ míì kún un.
  alternative: Túmọ̀ rẹ̀ ní kedere sí “Olúwa Jésù” tàbí sí “Ọlọ́run.”
  rationale: Gíríìkì sọ ὁ κύριος nìkan. Àyíká lè jẹ́ kí òǹkàwé lóye rẹ̀ gẹ́gẹ́ bí ìtọ́ka sí Olúwa Jésù, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ sọ ohun tó ju ọ̀rọ̀ ẹsẹ̀ náà lọ.
- issue: Agbára gbólóhùn ìkẹyìn
  choice: “Kí Olúwa wà pẹ̀lú gbogbo yín.”
  alternative: “Olúwa wà pẹ̀lú gbogbo yín.”
  rationale: Bí ó tilẹ̀ jẹ́ pé kò sí ọ̀rọ̀-ìṣe tí a kọ ní Gíríìkì, àyíká fi hàn pé àdúrà ìbùkún ni, kì í ṣe ìkéde ohun tó ń ṣẹlẹ̀ nìkan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àkànṣe tó ní àmì ohùn ní kíkún, ó sì jẹ́ ti ọ̀wọ̀, ti àdánidá, àti èyí tí òǹkàwé òde òní lè lóye. A lo “Kí” láti fi irú àdúrà ìbùkún hàn, a sì pa ìtẹnumọ́ “fúnra rẹ̀” àti “gbogbo yín” mọ́.
