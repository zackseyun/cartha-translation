  text: ὑμεῖς δέ, ἀδελφοί, μὴ ⸀ἐγκακήσητε καλοποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: yo
  text: Ṣùgbọ́n ní ti ẹ̀yin ará[a], ẹ má ṣe rẹ̀wẹ̀sì ní ṣíṣe rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀yin arákùnrin àti arábìnrin”; ọ̀rọ̀ náà nínú èdè Gíríìkì túmọ̀ ní tààrà sí “àwọn arákùnrin,” ṣùgbọ́n ó lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́, akọ àti abo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Ṣùgbọ́n ní ti ẹ̀yin
  rationale: δὲ fi ìyàtọ̀ sí ọ̀rọ̀ tó ṣáájú nípa àwọn aláìṣiṣẹ́ hàn, ὑμεῖς tí a sì gbé síwájú ní ìtẹnumọ́. ‘Ṣùgbọ́n ní ti ẹ̀yin’ mú ìyàtọ̀ àti ìtẹnumọ́ náà jáde ní Yorùbá àdánidá.
- source_word: ἀδελφοί
  choice: ẹ̀yin ará
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtó sí àwọn arákùnrin, ṣùgbọ́n nínú irú ìkíni Pọ́ọ̀lù yìí ó lè tọ́ka sí gbogbo àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin. ‘Ẹ̀yin ará’ jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu fún gbogbo ìjọ, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ Gíríìkì hàn.
- source_word: μὴ ἐγκακήσητε
  choice: ẹ má ṣe rẹ̀wẹ̀sì
  rationale: Ìsọ̀rọ̀ náà jẹ́ ìkìlọ̀ pé kí wọn má ṣe rẹ̀ tàbí sọ ìgboyà nù nínú iṣẹ́ tí wọ́n ń bá a lọ. ‘Ẹ má ṣe rẹ̀wẹ̀sì’ jẹ́ àdánidá, ó sì pa èrò ìfaradà mọ́.
- source_word: καλοποιοῦντες
  choice: ní ṣíṣe rere
  rationale: Ọ̀rọ̀ arọ́pò-ìṣe yìí tọ́ka sí iṣẹ́ rere tí ń bá a lọ, èyí tí wọn kò gbọ́dọ̀ rẹ̀ nínú rẹ̀. ‘Ní ṣíṣe rere’ sọ ìtumọ̀ yìí ní kedere àti ní Yorùbá òde òní.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφοί nínú ọ̀rọ̀ tí a ń bá gbogbo ìjọ sọ
  choice: ẹ̀yin ará
  alternative: ẹ̀yin arákùnrin; ẹ̀yin arákùnrin àti arábìnrin
  rationale: Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ìrísí, ó sábà máa ń gba gbogbo àwùjọ onígbàgbọ́ mọ́ra. ‘Ẹ̀yin ará’ jẹ́ ọ̀rọ̀ Yorùbá tó dáa fún àwùjọ náà láìfi akọ tàbí abo kankan sílẹ̀, àlàyé ìsàlẹ̀ sì pa ìrísí ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé òde òní. Àtúnṣe ‘ní ti ẹ̀yin’ pa ìtẹnumọ́ ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì àti ìyàtọ̀ δέ mọ́.
