id: 2TH.3.9
reference: 2 Thessalonians 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: yo
  text: Kì í ṣe nítorí pé àwa kò ní ẹ̀tọ́[a], bí kò ṣe kí a lè fi ara wa ṣe àpẹẹrẹ[b] fún yín, kí ẹ lè fara wé wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àṣẹ” tàbí “agbára.” Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí ẹ̀tọ́ tí ẹnì kan ní láti béèrè tàbí gba ohun kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwòṣe” tàbí “ìlànà àwòkọ́ṣe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: ẹ̀tọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ọ̀rọ̀ náà tọ́ka sí ẹ̀tọ́ tí ó bófin mu láti gba ìrànlọ́wọ́ ohun ìní, kì í ṣe agbára lásán. “Ẹ̀tọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì bá àyíká ọ̀rọ̀ mu.
- source_word: ἑαυτοὺς
  choice: ara wa
  rationale: Ó pa ìtumọ̀ arọ́pò-orúkọ aṣetúnṣe mọ́, ó sì tọ́ka sí Paulu àti àwọn alábàáṣiṣẹ́ rẹ̀.
- source_word: τύπον
  choice: àpẹẹrẹ
  rationale: Níhìn-ín, τύπος túmọ̀ sí ìlànà ìwà tí àwọn ẹlòmíràn lè fara wé. “Àpẹẹrẹ” jẹ́ ọ̀rọ̀ àdánidá tí gbogbo ènìyàn lè lóye.
- source_word: δῶμεν
  choice: fi ara wa ṣe
  rationale: Gbólóhùn “fi ara wa ṣe àpẹẹrẹ” sọ àwòrán inú èdè Gíríìkì ní Yorùbá àdánidá ju títúmọ̀ δῶμεν ní ọ̀rọ̀-ọ̀rọ̀ gẹ́gẹ́ bí “fún” lọ.
- source_word: εἰς τὸ μιμεῖσθαι
  choice: kí ẹ lè fara wé
  rationale: Ó fi ète hàn ní kedere, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfarawé.
- source_word: μιμεῖσθαι ἡμᾶς
  choice: fara wé wa
  rationale: Ó túmọ̀ ọ̀rọ̀ náà tààrà pé kí àwọn olùgbọ́ fara wé Paulu àti àwọn alábàáṣiṣẹ́ rẹ̀.
- source_word: οὐχ ὅτι οὐκ
  choice: Kì í ṣe nítorí pé àwa kò ní
  rationale: Ó pa ìṣàlàyé ìdí àti ìtakora inú ọ̀rọ̀ Gíríìkì mọ́, nígbà tí “àwa” tẹnu mọ́ ẹgbẹ́ Paulu.
- source_word: ἀλλ’ ἵνα
  choice: bí kò ṣe kí a lè
  rationale: Ó fi ìtakora pẹ̀lú ète rere tó tẹ̀ lé e hàn ní Yorùbá tó lọ́gbọ́n.
theological_decisions:
- issue: Irú ẹ̀tọ́ tí ἐξουσίαν ń tọ́ka sí
  choice: Paulu sọ pé òun àti àwọn alábàáṣiṣẹ́ rẹ̀ ní ẹ̀tọ́ tí ó bófin mu láti gba ìrànlọ́wọ́, bí ó tilẹ̀ jẹ́ pé wọn kò lo ẹ̀tọ́ náà níhìn-ín.
  alternative: Ó lè tọ́ka ní gbogbogbòò sí àṣẹ tàbí agbára aposteli.
  rationale: Àyíká ọ̀rọ̀ náà dá lórí bí wọn ṣe ń ṣiṣẹ́ kí wọn má bàa di ẹrù fún ẹnikẹ́ni. Nítorí náà, “ẹ̀tọ́” mú kókó ìbéèrè ìrànlọ́wọ́ jáde láì sọ ọ̀rọ̀ náà di ẹ̀kọ́ gbogbogbòò nípa àṣẹ aposteli.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún níbi tó yẹ. “Fi ara wa ṣe àpẹẹrẹ” àti “fara wé wa” jẹ́ ọ̀rọ̀ àdánidá tí ó pa ète àti àwòrán inú Gíríìkì mọ́.
