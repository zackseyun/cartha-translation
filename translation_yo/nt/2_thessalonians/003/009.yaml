  source_fidelity: 'The translation accurately preserves the Greek contrast: Paul and his companions possess a legitimate right (ἐξουσίαν), but their purpose in not exercising it was to set themselves before the Thessalonians as an example to imitate. The reflexive force of ἑαυτούς, the exemplary sense of τύπον, and both purpose expressions (ἀλλ᾽ ἵνα; εἰς τὸ μιμεῖσθαι) are retained.'
  naturalness: “Kì í ṣe nítorí pé àwa kò ní ẹ̀tọ́, bí kò ṣe kí a lè fi ara wa ṣe àpẹẹrẹ fún yín, kí ẹ lè fara wé wa” is clear, idiomatic modern Standard Yoruba with appropriate respectful scriptural register. The repeated purpose construction is natural and clarifies the relationship between being an example and imitation.
  terminology: “Ẹ̀tọ́” is the appropriate contextual rendering of ἐξουσίαν, without overextending the term into a claim of unrestricted power or apostolic office. “Àpẹẹrẹ” and “fara wé” effectively convey τύπος and μιμεῖσθαι. Both lexical-alternative footnotes are properly anchored and useful.
