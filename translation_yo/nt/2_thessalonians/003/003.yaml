  to: Ṣùgbọ́n Olúwa jẹ́ olóòótọ́; yóò mú yín dúró ṣinṣin, yóò sì ṣọ́ yín kúrò lọ́wọ́ ẹni ibi.[a]
  rationale: A minimal grammatical correction removes the superfluous un and uses the natural predicate construction “Olúwa jẹ́ olóòótọ́.” The translation continues to distinguish the personal main-text reading from the abstract alternative, as the Greek permits.
