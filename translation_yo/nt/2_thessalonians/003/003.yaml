id: 2TH.3.3
reference: 2 Thessalonians 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: yo
  text: Ṣùgbọ́n Olúwa jẹ́ olóòótọ́; yóò mú yín dúró ṣinṣin, yóò sì ṣọ́ yín kúrò lọ́wọ́ ẹni ibi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “kúrò nínú ibi.” Ọ̀rọ̀ Gíríìkì τοῦ πονηροῦ lè jẹ́ akọ (“ẹni ibi”) tàbí àárín (“ibi”).'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: olóòótọ́
  rationale: Ó ṣàpèjúwe Olúwa gẹ́gẹ́ bí ẹni tí a lè gbẹ́kẹ̀ lé, ó sì pa ìṣòtítọ́ rẹ̀ mọ́; ó tún bá ìyàtọ̀ sí àìní ìgbàgbọ́ àwọn ènìyàn nínú ọ̀rọ̀ tó ṣáájú mu.
- source_word: δέ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín àìní ìgbàgbọ́ àwọn ènìyàn àti ìṣòtítọ́ Olúwa.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Ó pa oyè orísun mọ́ láì sọ ẹni tí ó ń tọ́ka sí ní pàtó ju bí Gíríìkì ṣe sọ lọ.
- source_word: στηρίξει
  choice: yóò mú un yín dúró ṣinṣin
  rationale: Ìtumọ̀ náà mú èrò fífi ẹnì kan múlẹ̀ tàbí fún un lókun jáde ní Yorùbá àdánidá.
- source_word: φυλάξει
  choice: yóò sì ṣọ́ yín
  rationale: Ó pa ìtumọ̀ ṣíṣọ́ àti dídáàbò bo ẹni mọ́.
- source_word: ἀπὸ
  choice: kúrò lọ́wọ́
  rationale: Gbólóhùn Yorùbá yìí sọ ìdáàbò bo kúrò ní agbára tàbí ewu ohun tí ó tẹ̀ lé e.
- source_word: τοῦ πονηροῦ
  choice: ẹni ibi
  rationale: Ìtumọ̀ akọ tí ó ń tọ́ka sí ẹni búburú ni a lò nínú ọ̀rọ̀ pàtàkì, ṣùgbọ́n àìdánilójú gírámà pé ó tún lè túmọ̀ sí ibi ni a pa mọ́ sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ohun tí τοῦ πονηροῦ ń tọ́ka sí
  choice: ẹni ibi
  alternative: ibi
  rationale: Ẹ̀yà Gíríìkì náà lè jẹ́ akọ, ‘ẹni ibi,’ tàbí àárín, ‘ibi.’ Ọ̀rọ̀ pàtàkì yan ìtumọ̀ ẹni, ṣùgbọ́n àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì àti àìdánilójú gidi náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àtúnṣe ‘mú un yín dúró ṣinṣin’ jẹ́ àdánidá, ó sì pa àwòrán fífi àwọn olùgbọ́ múlẹ̀ mọ́.
