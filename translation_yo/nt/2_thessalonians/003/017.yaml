  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: yo
  text: Èmi Pọ́ọ̀lù ni mo fi ọwọ́ ara mi kọ ìkíni yìí; ó jẹ́ àmì nínú gbogbo lẹ́tà. Báyìí ni mo ṣe ń kọ̀wé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμὸς
  choice: ìkíni
  rationale: “Ìkíni” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìkíni tí a kọ sínú lẹ́tà, ó sì bá àyíká lẹ́tà mu ju ọ̀rọ̀ àṣà ìjọ kan lọ.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: mo fi ọwọ́ ara mi, èmi Pọ́ọ̀lù, kọ
  rationale: Èyí mú ìtumọ̀ pé Pọ́ọ̀lù fúnra rẹ̀ ló kọ apá yìí jáde, ó sì pa ìdánimọ̀ “Pọ́ọ̀lù” mọ́ ní ọ̀nà tí ó ṣe kedere ní Yorùbá.
- source_word: σημεῖον
  choice: àmì
  rationale: “Àmì” lè túmọ̀ sí ohun ìdánimọ̀ tàbí ẹ̀rí ìfìdí-múlẹ̀, gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe ń ṣiṣẹ́ níbí.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: inú gbogbo lẹ́tà
  rationale: “Lẹ́tà” jẹ́ ọ̀rọ̀ òde òní tí gbogbo ènìyàn lóye; “gbogbo” tẹ̀ lé πάσῃ láì dín ìwọ̀n ọ̀rọ̀ náà kù.
- source_word: οὕτως γράφω
  choice: Báyìí ni mo ṣe ń kọ̀wé
  rationale: Ìtumọ̀ yìí pa ìtọ́ka sí ọ̀nà tàbí ìrísí ìkọ̀wé Pọ́ọ̀lù mọ́, nígbà tí àlàyé ìsàlẹ̀ fi ìtumọ̀ gígúnrọ́ mìíràn hàn.
theological_decisions:
- issue: Ipá gbólóhùn nípa ohun tí Pọ́ọ̀lù fi ọwọ́ ara rẹ̀ kọ
  choice: A gbé e kalẹ̀ gẹ́gẹ́ bí àmì ìdánimọ̀ nínú àwọn lẹ́tà rẹ̀.
  alternative: 'Gbólóhùn ìkẹyìn lè tọ́ka ní pàtó sí ìkíni yìí nìkan: “Bẹ́ẹ̀ ni mo kọ.”'
  rationale: Ọ̀rọ̀ “àmì inú gbogbo lẹ́tà” ṣe àtìlẹ́yìn fún ìtumọ̀ ìfìdí-lẹ́tà-múlẹ̀, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn tí ó túmọ̀ οὕτως γράφω ní ọ̀nà gígúnrọ́ mọ́.
translation_notes:
  register: Yorùbá àgbàṣe, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo “lẹ́tà” dípò ọ̀rọ̀ ẹ̀sìn tó le koko, a sì fi àmì ohùn sí ibi tí ó yẹ.
