id: 2TH.3.10
reference: 2 Thessalonians 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: yo
  text: Nítorí, nígbà tí a wà pẹ̀lú yín pàápàá, a máa ń pa èyí láṣẹ fún yín pé, “Bí ẹnikẹ́ni kò bá fẹ́ ṣiṣẹ́[b], kí ó má jẹun[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ó má ṣe jẹun.”
    reason: lexical_alternative
  - marker: b
    text: Gíríìkì sọ pé “kò fẹ́ ṣiṣẹ́”; ó ń tọ́ka sí àìfẹ́ ṣiṣẹ́, kì í ṣe àìlè ṣiṣẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Nítorí nígbà tí àwa pàápàá
  rationale: “Nítorí” fi ipa ìṣàlàyé γάρ hàn, “pàápàá” sì mú ìtẹnumọ́ καί jáde lọ́nà Yorùbá tí ó ṣe déédé.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: nígbà tí àwa ... wà pẹ̀lú yín
  rationale: Ó túmọ̀ sí wíwà ní àárín wọn tàbí ní ilé-iṣẹ́ wọn; “wà pẹ̀lú yín” jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ atọ́ka náà ń tọ́ka sí ohun tí ó tẹ̀ lé; kò pọndandan láti fi “àṣẹ” kún un gẹ́gẹ́ bí orúkọ nítorí ọ̀rọ̀-ìṣe náà ti sọ ìtumọ̀ yẹn.
- source_word: παρηγγέλλομεν
  choice: a máa ń pa ... láṣẹ
  rationale: Ìrísí imperfect náà lè fi ìṣe tí wọ́n ń ṣe léraléra tàbí ní àṣà hàn; “a máa ń” pa agbára yẹn mọ́.
- source_word: ὅτι
  choice: pé
  rationale: Ó ṣàgbékalẹ̀ àkóónú àṣẹ náà lọ́nà Yorùbá tí ó rọrùn.
- source_word: εἴ τις
  choice: Bí ẹnikẹ́ni
  rationale: Ó pa ìpèníjà aláìdánimọ̀ àti àyè gbogbogbò mọ́.
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: kò bá fẹ́ ṣiṣẹ́
  rationale: θέλει kan ìfẹ́ tàbí ìmúratán, kì í ṣe àìlágbára; “kò bá fẹ́” yà àìfẹ́ ṣiṣẹ́ sọ́tọ̀ kúrò nínú àìlè ṣiṣẹ́.
- source_word: μηδὲ ἐσθιέτω
  choice: kí ó má ṣe jẹun pẹ̀lú
  rationale: “kí ó má ṣe” fi agbára àṣẹ ẹni-kẹta hàn; “pẹ̀lú” mú ìsopọ̀ μηδέ (“bẹ́ẹ̀ ni ... má”) hàn ní àyíká ọ̀rọ̀ náà.
theological_decisions:
- issue: Bóyá gbólóhùn náà ń sọ nípa àìlè ṣiṣẹ́ tàbí àìfẹ́ ṣiṣẹ́
  choice: “kò bá fẹ́ ṣiṣẹ́,” èyí tí ó ń tọ́ka sí àìfẹ́ tàbí àìmúratán
  alternative: “kò bá lè ṣiṣẹ́”
  rationale: θέλει jẹ́ ọ̀rọ̀ nípa ìfẹ́-inú, kì í ṣe agbára. Yíyí i sí àìlè ṣiṣẹ́ yóò fi ìlànà líle kan sínú ẹsẹ tí Gíríìkì kò sọ.
- issue: Ẹni-kẹta ẹyọ nínú àbájáde àṣẹ náà
  choice: “kí ó má ṣe jẹun”
  alternative: Lílo ọ̀pọ̀ ènìyàn tàbí gbólóhùn tí kò ní arọ́pò-orúkọ
  rationale: τις àti ἐσθιέτω jẹ́ ẹyọ, “ó” sì jẹ́ arọ́pò-orúkọ ẹni-kẹta ẹyọ tí kò fi akọ tàbí abo hàn ní Yorùbá; ó pa ìtumọ̀ aṣojú gbogbogbò mọ́ láìfi akọ kún un.
translation_notes:
  register: Yorùbá ìṣedéédé òde òní, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. “Pa ... láṣẹ” jẹ́ ọ̀rọ̀ ọ̀wọ̀, tí ó ṣe kedere fún òǹkàwé lásán; “a máa ń” pa ìṣe tí ó ń ṣẹlẹ̀ léraléra mọ́. Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn gbólóhùn tí wọ́n ń ṣàlàyé.
