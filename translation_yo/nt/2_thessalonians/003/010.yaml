revisions:
- from: Nítorí nígbà tí àwa pàápàá wà pẹ̀lú yín, a máa ń pa èyí láṣẹ fún yín pé, “Bí ẹnikẹ́ni kò bá fẹ́ ṣiṣẹ́, kí ó má ṣe jẹun pẹ̀lú.”[a][b]
  to: Nítorí, nígbà tí a wà pẹ̀lú yín pàápàá, a máa ń pa èyí láṣẹ fún yín pé, “Bí ẹnikẹ́ni kò bá fẹ́ ṣiṣẹ́[b], kí ó má jẹun[a].”
