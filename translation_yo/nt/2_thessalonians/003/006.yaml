id: 2TH.3.6
reference: 2 Thessalonians 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: yo
  text: Ẹ̀yin ará[a], àwa sì pàṣẹ fún yín ní orúkọ Olúwa wa Jésù Mèsáyà[c] pé kí ẹ ya ara yín sọ́tọ̀ kúrò lọ́dọ̀[b] gbogbo arákùnrin tí ń gbé ìgbé ayé àìlétò[e], tí kò sì tẹ̀ lé ẹ̀kọ́ tí a fi lé wọn lọ́wọ́.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ará” jẹ́ ọ̀rọ̀ akọ ní ọ̀pọ̀; Pọ́ọ̀lù ń bá gbogbo ìjọ sọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “kí ẹ fà sẹ́yìn kúrò lọ́dọ̀.” Ọ̀rọ̀ Gíríìkì túmọ̀ sí kí ènìyàn má ṣe bá irú ẹni bẹ́ẹ̀ kẹ́gbẹ́ tímọ́tímọ́.
    reason: lexical_alternative
  - marker: c
    text: A tún lè pe “Mèsáyà” ní “Kristi.”
    reason: alternative_reading
  - marker: d
    text: Àwọn àfọwọ́kọ kan ní “ẹ̀kọ́ tí a fi lé yín lọ́wọ́,” àwọn mìíràn sì ní “ẹ̀kọ́ tí a fi lé e lọ́wọ́.” Ọ̀rọ̀ tí a tẹ̀ síbí ní “ẹ̀kọ́ tí a fi lé wọn lọ́wọ́.”
    reason: textual_variant
  - marker: e
    text: Ní tààrà, “tí ń rìn ní ọ̀nà àìlétò”; “rírìn” níbí ń tọ́ka sí bí ẹni ṣe ń gbé ìgbé ayé rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: àwa sì pàṣẹ fún yín
  rationale: “Pàṣẹ” fi agbára àṣẹ aposteli hàn, ó sì lágbára ju ìṣírí lásán lọ. “Sì” ni a fi túmọ̀ δέ gẹ́gẹ́ bí àsopọ̀ ọ̀rọ̀, láìfi ọ̀rọ̀ àkókò bí “ní báyìí” kún un.
- source_word: ἀδελφοί
  choice: Ẹ̀yin ará
  rationale: “Àwọn ará” ni ọ̀rọ̀ ìbátan ìjọ tí ó bójú mu ní Yorùbá, tí ó sì lè tọ́ka sí gbogbo ìjọ. Àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: ní orúkọ Olúwa wa Jésù Mèsáyà
  rationale: Ó pa àwòrán àti ọ̀wọ̀ gbolohun Gíríìkì “ní orúkọ” mọ́. “Mèsáyà” fi iṣẹ́ Χριστός gẹ́gẹ́ bí oyè hàn ní àyíká yìí.
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: kí ẹ ya ara yín sọ́tọ̀ kúrò lọ́dọ̀
  rationale: Gbolohun yìí sọ pé kí wọ́n fà sẹ́yìn kúrò nínú ìbákẹ́gbẹ́ tímọ́tímọ́. A kò sọ ọ́ di ọ̀rọ̀ amọ̀ṣẹ́dá nípa yíyọ ẹni kúrò nínú ìjọ.
- source_word: παντὸς ἀδελφοῦ
  choice: gbogbo arákùnrin
  rationale: Ó pa ẹyọ ọ̀rọ̀ akọ tí ó wà ní Gíríìkì mọ́, ó sì tọ́ka sí ẹni tí ó jẹ́ ara ìjọ.
- source_word: ἀτάκτως περιπατοῦντος
  choice: tí ń gbé ìgbé ayé àìlétò
  rationale: Ìtumọ̀ àpèjúwe “rírìn” ni pé bí ẹni ṣe ń gbé ayé. “Àìlétò” pa ìtumọ̀ gbòòrò ti ìwà tí kò bá ìlànà mu mọ́, láìdín un kù sí ọ̀lẹ nìkan.
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: tí kò sì tẹ̀ lé àṣà
  rationale: “Àṣà” fi ohun tí a fi lé àwọn ẹlòmíràn lọ́wọ́ hàn, nígbà tí “tẹ̀ lé” mú ìtumọ̀ κατὰ jáde lọ́nà Yorùbá tí ó ṣe é lóye.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: tí wọ́n gbà lọ́wọ́ wa
  rationale: SBLGNT tẹ̀lé ọ̀nà kíkà ẹni kẹta ọ̀pọ̀ παρελάβοσαν; nítorí náà “wọ́n gbà” pa ìbámu pẹ̀lú ẹ̀rí àkọ́kọ́ mọ́, bí ó tilẹ̀ jẹ́ pé ó yà díẹ̀ lẹ́yìn “gbogbo arákùnrin.”
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú oyè nípa Jésù
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fòróró yàn. “Mèsáyà” fi oyè náà hàn gbangba, nígbà tí àlàyé ìsàlẹ̀ pa “Kristi” mọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- issue: Ìwọ̀n ìyapa tí στέλλεσθαι ὑμᾶς ἀπὸ béèrè
  choice: kí ẹ ya ara yín sọ́tọ̀ kúrò lọ́dọ̀
  alternative: kí ẹ fà sẹ́yìn kúrò lọ́dọ̀; kí ẹ yẹra fún
  rationale: Ọ̀rọ̀ náà pàṣẹ ìfàsẹ́yìn kúrò nínú ìbákẹ́gbẹ́, ṣùgbọ́n kò yẹ kí a fi ìtumọ̀ ìdájọ́ ìjọ tàbí ìyọkúrò pátápátá tí kò hàn gbangba sínú rẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, àti èyí tí ó rọrùn fún gbogbo ènìyàn ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbolohun náà pa ìwọ̀n àṣẹ aposteli mọ́, ṣùgbọ́n kò fi èdè amọ̀ṣẹ́dá ẹ̀sìn kan sínú ọ̀rọ̀ ìyapa. Àṣà ọ̀rọ̀ Yorùbá “gbé ìgbé ayé” ni a yan dípò “rìn” nínú àkọ́kọ́ kí ìtumọ̀ ìwà ẹni lè ṣe kedere; àlàyé ìsàlẹ̀ sì pa àwòrán Gíríìkì mọ́.
