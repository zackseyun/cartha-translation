  source_fidelity: Ìtumọ̀ náà gba èrò pàtàkì ẹsẹ̀ náà, ṣùgbọ́n ‘Ṣùgbọ́n’ fún δέ lè fi ìyàtọ̀ tó lágbára ju ti Gíríìkì hàn. Pẹ̀lú, ‘máa ṣe’ ń ṣàfikún abala ìtẹ̀síwájú/ìṣe àtúnlò sí ποιήσετε, níbi tí ọjọ́ iwájú rọrùn (‘ẹ ó sì ṣe’) ti tó. ‘Àwọn ohun tí a pàṣẹ fún yín’ tún lè dà bí àṣẹ tí a ti paṣé tẹ́lẹ̀, dípò ohun tí a ń pàṣẹ ní ìsinsìnyí.
