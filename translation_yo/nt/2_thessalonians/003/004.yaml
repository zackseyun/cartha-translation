source:
  edition: SBLGNT
  text: πεποίθαμεν δὲ ἐν κυρίῳ ἐφ’ ὑμᾶς, ὅτι ἃ ⸀παραγγέλλομεν καὶ ποιεῖτε καὶ ποιήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: yo
  text: Àwa sì ní ìgbẹ́kẹ̀lé nínú Olúwa nípa yín pé ẹ ń ṣe, ẹ ó sì ṣe ohun tí a ń pàṣẹ fún yín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: a ní ìgbẹ́kẹ̀lé
  rationale: Ó sọ ìdánilójú tàbí ìgbẹ́kẹ̀lé tí ó dúró ṣinṣin, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: ἐν κυρίῳ
  choice: nínú Olúwa
  rationale: Ó pa ìtumọ̀ orísun mọ́ pé Olúwa ni ìpìlẹ̀ àti àyíká ìgbẹ́kẹ̀lé náà.
- source_word: ἐφ’ ὑμᾶς
  choice: nípa yín
  rationale: Ó túmọ̀ ìtọ́kasí ìgbẹ́kẹ̀lé sí àwọn olùgbọ́ láì mú un dà bí ẹni pé ìgbẹ́kẹ̀lé náà wà nínú wọn fúnra wọn.
- source_word: παραγγέλλομεν
  choice: àwọn ohun tí a pàṣẹ fún yín
  rationale: Ó fi agbára ìtọ́ni aposteli hàn, ó sì jẹ́ gbolohun tí ó ṣe kedere ní Yorùbá.
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: ẹ ń ṣe, ẹ ó sì máa ṣe
  rationale: Ó pa ìyàtọ̀ àsìkò ìsinsìnyí àti ọjọ́ iwájú mọ́; ‘máa ṣe’ tún fi ìtẹ̀síwájú ìgbọràn hàn lọ́nà àdánidá.
theological_decisions:
- issue: Ibi tí ìgbẹ́kẹ̀lé náà gbé kalẹ̀
  choice: nínú Olúwa nípa yín
  alternative: ní ìgbẹ́kẹ̀lé nínú yín nínú Olúwa
  rationale: Ìṣètò yìí tẹ̀lé ἐν κυρίῳ, ó sì yà ìpìlẹ̀ ìgbẹ́kẹ̀lé (Olúwa) sọ́tọ̀ kúrò ní ẹni tí ìgbẹ́kẹ̀lé náà kan (àwọn ará Tẹsalóníkà).
- issue: Ìtẹ̀síwájú ìgbọràn
  choice: ẹ ń ṣe, ẹ ó sì máa ṣe
  alternative: ẹ ń ṣe, ẹ ó sì ṣe
  rationale: A lo ‘máa’ láti mú ìṣe tí ń bá a lọ hàn, ṣùgbọ́n a kò fi ìdí ìgbọràn pípé tàbí ẹ̀kọ́ ẹ̀sìn míràn kún ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, ‘Olúwa’ sì ni àkọlé Kíríọ̀sì.
