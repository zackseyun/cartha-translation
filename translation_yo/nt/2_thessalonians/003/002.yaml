id: 2TH.3.2
reference: 2 Thessalonians 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: yo
  text: àti kí a lè bọ́ lọ́wọ́ àwọn ènìyàn oníwà tí kò tọ́ àti búburú[a], nítorí kì í ṣe gbogbo ènìyàn ni ó ní ìgbàgbọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ènìyàn tí kò bójú mu àti búburú,” tàbí “àwọn ènìyàn aláìmọ̀ràn àti búburú.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ohun tí kò tọ́, ohun asán, tàbí ohun tí kò bójú mu; níbí ó tọ́ka sí àwọn alátakò tí ìwà wọn yapa kúrò ní ọ̀nà tó tọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nítorí kì í ṣe gbogbo ènìyàn ni ó jẹ́ olóòtítọ́.” Gíríìkì náà sọ ní tààrà pé, “nítorí ìgbàgbọ́ kì í ṣe ti gbogbo ènìyàn.”
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: kí a lè bọ́ lọ́wọ́
  rationale: 'Ọ̀rọ̀ yìí jẹ́ aorist passive subjunctive lẹ́yìn ἵνα, ó sì ń sọ ète: kí a lè rí ìdáǹdè kúrò lọ́wọ́ àwọn alátakò. “Bọ́ lọ́wọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a gba ẹnì kan là kúrò nínú ewu láìsọ ọ̀nà tí ìgbàlà náà gbà dé.'
- source_word: ἀτόπων
  choice: oníwà àyídáyidà
  rationale: Ἄτοπος lè túmọ̀ sí ohun tí kò bójú mu, tí kò ní ìdí, tàbí tí ó yapa kúrò ní ọ̀nà tó tọ́. Nínú àyíká yìí, “oníwà àyídáyidà” fi ìwà tí ó ti yí kúrò ní rere hàn, kò sì sọ ọ̀rọ̀ náà di ohun kan náà pẹ̀lú πονηρός.
- source_word: πονηρῶν
  choice: búburú
  rationale: Ọ̀rọ̀ ìwà rere àti búburú ni πονηρός; “búburú” jẹ́ ọ̀rọ̀ Yorùbá tí ó ṣe kedere, tí ó sì wọ́pọ̀ fún ibi tàbí ìwà ibi.
- source_word: ἀνθρώπων
  choice: àwọn ènìyàn
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà jẹ́ akọ ní gírámà, ἄνθρωπος lè tọ́ka sí ènìyàn láìfi ìbálòpọ̀ hàn. Ẹsẹ yìí fúnra rẹ̀ kò fi dájú pé ọkùnrin nìkan ni àwọn alátakò náà, nítorí náà “àwọn ènìyàn” kò fi ohun tí orísun kò sọ kún un.
- source_word: πίστις
  choice: ìgbàgbọ́
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ tó ṣeé ṣe jù lọ nínú àyíká iṣẹ́ ìránṣẹ́ àti ìtakò yìí. Síbẹ̀, πίστις tún lè ní ìtumọ̀ jíjẹ́ olóòtítọ́; a pa àṣàyàn náà mọ́ sínú àlàyé ìsàlẹ̀.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: nítorí kì í ṣe gbogbo ènìyàn ni ó ní ìgbàgbọ́
  rationale: Gíríìkì sọ ní ṣókí pé, “nítorí ìgbàgbọ́ kì í ṣe ti gbogbo ènìyàn.” Yorùbá fi “ní” kún un láti mú gbólóhùn náà ṣe kedere àti àdánidá, láìsọ ẹ̀kọ́ tó ju ohun tí ẹsẹ náà sọ lọ.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú gbólóhùn tí ó lè ní ju ìtumọ̀ kan lọ
  choice: ìgbàgbọ́
  alternative: jíjẹ́ olóòtítọ́
  rationale: Àyíká náà ń sọ̀rọ̀ nípa àwọn ènìyàn tí wọ́n tako iṣẹ́ ìránṣẹ́, nítorí náà àìní ìgbàgbọ́ ni ó ṣeé ṣe jù. Ṣùgbọ́n bí πίστις ṣe lè túmọ̀ sí ìṣòtítọ́ jẹ́ àṣàyàn gidi, nítorí náà a kò pa á mọ́; a fi sí àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún, ní ìforúkọsílẹ̀ tó ní iyì ṣùgbọ́n tó ṣeé yé fún òǹkàwé òde òní. “Bọ́ lọ́wọ́” jẹ́ àdánidá ju gbólóhùn tí a túmọ̀ ní ọ̀rọ̀-kọ̀ọ̀kan lọ; “oníwà àyídáyidà àti búburú” sì pa ìyàtọ̀ tó wà láàárín ἀτόπων àti πονηρῶν mọ́.
