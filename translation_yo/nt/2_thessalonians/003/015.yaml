id: 2TH.3.15
reference: 2 Thessalonians 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ μὴ ὡς ἐχθρὸν ἡγεῖσθε, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: yo
  text: Ẹ má sì kà á sí ọ̀tá,[a] ṣùgbọ́n ẹ máa kìlọ̀ fún un gẹ́gẹ́ bí arákùnrin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má sì wo ó gẹ́gẹ́ bí ọ̀tá.”
    reason: lexical_alternative
  - marker: b
    text: “Arákùnrin” níhìn-ín ń tọ́ka sí ẹlẹgbẹ́ onígbàgbọ́; ọ̀rọ̀ náà lè dúró fún ọmọ ẹgbẹ́ àwùjọ Kristẹni.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: kà á sí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí kí a gbà tàbí wo ẹnì kan gẹ́gẹ́ bí irú ẹni kan; “kà á sí” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa ìtumọ̀ ìdájọ́ yìí mọ́.
- source_word: ἐχθρὸν
  choice: ọ̀tá
  rationale: “Ọ̀tá” ni ìtumọ̀ tààrà, ó sì bá ipò ẹni tí a kò gbọdọ̀ kà sí alátakò mu.
- source_word: νουθετεῖτε
  choice: ẹ máa kìlọ̀ fún un
  rationale: νουθετέω ní ìtumọ̀ ìkìlọ̀ tàbí ìtọ́nisọ́nà tí ète rẹ̀ jẹ́ àtúnṣe. “Kìlọ̀ fún” ṣe ìtumọ̀ agbára àtúnṣe náà ní Yorùbá òde òní láì sọ ọ́ di ìhalẹ̀.
- source_word: ἀδελφόν
  choice: arákùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ẹyọ kan, ó sì ń tọ́ka sí ọmọ ẹgbẹ́ ìgbàgbọ́ kan; a pa ìṣedédé akọ rẹ̀ mọ́ nínú ọ̀rọ̀ pàtàkì, a sì ṣàlàyé lílò aṣojú rẹ̀ nínú àlàyé ìsàlẹ̀.
- source_word: ὡς
  choice: gẹ́gẹ́ bí / sí
  rationale: Nínú gbólóhùn méjèèjì, ὡς fi ipò tàbí ọ̀nà tí a fi ń wo ẹni náà hàn. “Kà á sí” jẹ́ àdánidá ní apá àkọ́kọ́, “gẹ́gẹ́ bí” sì ṣe kedere ní apá kejì.
- source_word: καὶ μὴ ... ἀλλὰ
  choice: Ẹ má sì ṣe ... ṣùgbọ́n ...
  rationale: Èyí pa àsopọ̀ mọ́ ohun tí ó ṣáájú, ó sì fi ìyàtọ̀ líle láàárín ìwà ọ̀tá àti ìkìlọ̀ ará hàn.
theological_decisions:
- issue: Ìṣesí sí onígbàgbọ́ tí kò ṣègbọ́ràn nígbà ìbáwí
  choice: A kò gbọdọ̀ kà ẹni náà sí ọ̀tá; a gbọdọ̀ kìlọ̀ fún un bí ẹni tí ó ṣì jẹ́ arákùnrin nínú àwùjọ ìgbàgbọ́.
  alternative: A lè ka ẹsẹ náà sí ìmọ̀ràn gbogbogbò nípa ìjà láàárín ènìyàn, láì fi sí àyíká ìbáwí ìjọ.
  rationale: Nínú àyíká 2 Tẹsalóníkà 3:14–15, ẹni tí kò tẹ̀ lé ọ̀rọ̀ náà ni a ń sọ̀rọ̀ nípa rẹ̀. “Arákùnrin” fi hàn pé ìkìlọ̀ náà jẹ́ ti ìbáwí àti àtúnṣe, kì í ṣe ìkórìíra ẹni náà bí ọ̀tá.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọ arọ́pò “ẹ” bá àṣẹ ọ̀pọ̀ ènìyàn nínú Gíríìkì mu. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò.
