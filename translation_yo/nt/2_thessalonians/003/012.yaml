id: 2TH.3.12
reference: 2 Thessalonians 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: yo
  text: Ní ti àwọn irú ẹni bẹ́ẹ̀, a ń pàṣẹ fún wọn, a sì ń rọ̀ wọ́n nínú Olúwa Jésù Mèsáyà[a] pé kí wọ́n máa ṣiṣẹ́ ní ìdákẹ́jẹ[b], kí wọ́n sì máa jẹ oúnjẹ tiwọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Kristi.” Ọ̀rọ̀ Gíríìkì náà, Χριστός, jẹ́ oyè tó túmọ̀ sí ẹni tí a fòróró yàn.
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé kí wọ́n ṣiṣẹ́ ní ọ̀nà tó fara balẹ̀, tí kò sì dá àwọn ẹlòmíràn rú; kì í ṣe pé wọn kò gbọdọ̀ sọ̀rọ̀ rárá.
    reason: lexical_clarification
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: Ní ti àwọn irú ẹni bẹ́ẹ̀
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí àwọn aláìṣiṣẹ́ tó ń dá ọ̀ràn rú tí a mẹ́nu kàn ṣáájú. “Ní ti” mú δέ jáde gẹ́gẹ́ bí ìyípadà ọ̀rọ̀ pẹ̀lẹ́, kì í ṣe àtakò líle.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: a ń pàṣẹ fún wọn, a sì ń rọ̀ wọ́n
  rationale: Ó pa agbára àṣẹ àti ẹ̀bẹ̀ onífẹ̀ẹ́ tó wà nínú àwọn ọ̀rọ̀ Gíríìkì méjèèjì mọ́ láì da wọn pọ̀ sí ìtumọ̀ kan ṣoṣo.
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: nínú Olúwa Jésù Mèsáyà
  rationale: “Nínú” pa ἐν mọ́ gẹ́gẹ́ bí ààyè ìṣọ̀kan àti ọlá-àṣẹ, dípò yíyí i sí ohun èlò lásán. “Mèsáyà” fi Χριστός hàn gẹ́gẹ́ bí oyè.
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: kí wọ́n máa ṣiṣẹ́ ní ìdákẹ́jẹ
  rationale: Ó sọ ìṣe tó ń lọ déédéé àti ìgbé-ayé tó fara balẹ̀, tí kò dá àwọn ẹlòmíràn rú; èyí ni ìyàtọ̀ sí ìwà aláìṣiṣẹ́ tó ń dá ọ̀ràn rú nínú àyíká ọ̀rọ̀ náà.
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: kí wọ́n sì máa jẹ oúnjẹ tí wọ́n fúnra wọn ṣiṣẹ́ fún
  rationale: ἄρτος túmọ̀ sí “àkàrà” ní ti gidi, ṣùgbọ́n níbí ó dúró fún oúnjẹ ìgbésí-ayé. Ìtumọ̀ yìí jẹ́ ti Yorùbá àdánidá, ó sì pa ìsopọ̀ tó wà láàárín ṣíṣiṣẹ́ àti jíjẹ ohun tí iṣẹ́ ẹni mú wá mọ́.
theological_decisions:
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn yìí Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run fòróró yàn, kì í ṣe bí apá orúkọ tí kò ní ìtumọ̀ mọ́.
- issue: Agbára ìtọ́ni àwọn aposteli
  choice: Pa “pàṣẹ” àti “rọ̀” méjèèjì mọ́
  alternative: Ló ọ̀rọ̀ kan ṣoṣo bí “kìlọ̀” tàbí “kọ́”
  rationale: Orísun náà mọ̀ọ́mọ̀ so àṣẹ tó lágbára pọ̀ mọ́ ìrọ̀ pẹ̀lú ìtara; pípa méjèèjì mọ́ kò dín ọ̀kan kù fún èkejì.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní ọlá ni a lò. Gbólóhùn náà jẹ́ kedere fún òǹkàwé gbogbo, ó sì pa ìwọ̀ntúnwọ̀nsì láàárín ìṣọ̀kan pẹ̀lú ìlànà Gíríìkì àti ìṣàn ọ̀rọ̀ Yorùbá àdánidá mọ́.
