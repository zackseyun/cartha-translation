  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: yo
  text: A kò sì jẹ búrẹ́dì lọ́wọ́ ẹnikẹ́ni láìsan owó[a]; ṣùgbọ́n a ṣiṣẹ́ pẹ̀lú làálàá àti ìnira ní òru àti ní ọ̀sán, kí a má bàa di ẹrù fún ẹnikẹ́ni nínú yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A kò sì jẹ búrẹ́dì ẹnikẹ́ni lásán.” Ọ̀rọ̀ Gíríìkì náà pa “búrẹ́dì” mọ́ ní tààràtà, bí ó tilẹ̀ jẹ́ pé ó lè tọ́ka sí oúnjẹ tàbí àtìlẹ́yìn ohun ìní lápapọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: láìsan owó
  rationale: Ó túmọ̀ sí gbígba ohun kan gẹ́gẹ́ bí ẹ̀bùn tàbí láìná owó. Ọ̀rọ̀ yìí mú ìtumọ̀ nípa àtìlẹ́yìn ohun ìní hàn ní Yorùbá òde òní.
- source_word: ἄρτον
  choice: búrẹ́dì
  rationale: Ìtumọ̀ rẹ̀ ní tààràtà ni ‘búrẹ́dì,’ bí ó tilẹ̀ jẹ́ pé ó tún lè dúró fún oúnjẹ tàbí ohun ìgbé-ayé lápapọ̀. A pa àwòrán gidi inú Gíríìkì mọ́.
- source_word: παρά τινος
  choice: lọ́wọ́ ẹnikẹ́ni
  rationale: παρά pẹ̀lú genitive ń tọ́ka sí orísun; ‘lọ́wọ́ ẹnikẹ́ni’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: fi làálàá àti ìnira
  rationale: Àwọn ọ̀rọ̀ méjèèjì tẹnumọ́ iṣẹ́ líle àti ìṣòro tó bá a rìn; àkójọpọ̀ méjèèjì ni a pa mọ́.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: tọ̀sán-tòru
  rationale: Àṣàyàn Yorùbá yìí sọ iṣẹ́ tí ó ń bá a lọ ní ọ̀sán àti ní òru lọ́nà àdánidá.
- source_word: ἐργαζόμενοι
  choice: ṣiṣẹ́
  rationale: Participle náà ṣàlàyé bí Pọ́ọ̀lù àti àwọn ẹlẹgbẹ́ rẹ̀ ṣe ń gbé ara wọn; ‘ṣiṣẹ́’ bá àyíká iṣẹ́ fún ìtọ́jú ara ẹni mu.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: kí a má bàa di ẹrù fún
  rationale: Ìṣètò náà ń sọ ète. Níhìn-ín, ἐπιβαρέω ń tọ́ka sí fífi ẹrù owó tàbí ohun ìní lé ẹlòmíràn.
- source_word: τινα ὑμῶν
  choice: ẹnikẹ́ni nínú yín
  rationale: 'Ó pa ìtumọ̀ pínpín náà mọ́: kò sí ẹnì kọ̀ọ̀kan láàárín wọn tí àwọn aposteli fẹ́ di ẹrù fún.'
- source_word: οὐδὲ ... ἀλλ’
  choice: A kò sì ...; dípò bẹ́ẹ̀
  rationale: Èyí pa ìyàtọ̀ tó lágbára mọ́ láàárín àìgba oúnjẹ lọ́fẹ̀ẹ́ àti ṣíṣe iṣẹ́ líle.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘búrẹ́dì’ láti pa ọ̀rọ̀ àwòrán inú Gíríìkì mọ́, a sì ṣàlàyé ìtumọ̀ rẹ̀ tó gbòòrò nínú àlàyé ìsàlẹ̀.
