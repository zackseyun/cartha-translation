id: 2TH.3.5
reference: 2 Thessalonians 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: yo
  text: Kí Olúwa darí ọkàn yín sí ìfẹ́ Ọlọ́run[a] àti sí ìfaradà Mèsáyà[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ “sí ìfẹ́ sí Ọlọ́run.” Gíríìkì náà lè tún túmọ̀ sí “sí ìfẹ́ tí Ọlọ́run ní.”
    reason: alternative_reading
  - marker: b
    text: Ó tún lè jẹ́ “sí ìfaradà tí Mèsáyà ní,” tàbí “sí ìfaradà fún Mèsáyà.”
    reason: alternative_reading
  - marker: c
    text: Gíríìkì ní “Kristi”; a túmọ̀ rẹ̀ sí “Mèsáyà” níbí nítorí ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Olúwa
  rationale: Ó pa oyè àtọ̀runwá/ti Kristi inú ọ̀rọ̀ Gíríìkì mọ́ láì fi ẹni tí a ń tọ́ka sí hàn ju bí orísun ṣe sọ lọ.
- source_word: κατευθύναι
  choice: kí ó tọ́
  rationale: Ọ̀nà àdúrà-ìfẹ́ inú optative náà ni a fi “Kí ... kí ó” hàn; “tọ́” sì mú èrò ìdarí sí ipa ọ̀nà kan jáde ní Yorùbá àdánidá.
- source_word: καρδίας
  choice: ọkàn
  rationale: “Ọkàn” ni ọ̀rọ̀ Bíbélì Yorùbá tó wọ́pọ̀ fún àárín ìrònú, ìfẹ́ inú àti ìpinnu ènìyàn; ó tún pa àwòrán orísun mọ́.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe kedere, tó wọ́pọ̀, tí ó sì bá ἀγάπη mu.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: 'Àkójọpọ̀ “ìfẹ́ Ọlọ́run” pa àìdánilójú genitive mọ́ ní Yorùbá: ó lè jẹ́ ìfẹ́ tí Ọlọ́run ní, ìfẹ́ sí Ọlọ́run, tàbí ìfẹ́ tí Ọlọ́run ń dá mọ́.'
- source_word: ὑπομονὴν
  choice: ìfaradà
  rationale: “Ìfaradà” sọ ìdúró ṣinṣin lábẹ́ ìpọ́njú ní èdè Yorùbá tó ṣeé lóye, láì fi ìtumọ̀ míì kún un.
- source_word: τοῦ Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” tú ìtumọ̀ oyè náà jáde dípò lílo “Kristi” bí ẹni pé orúkọ lasán ni. Àkójọpọ̀ “ìfaradà Mèsáyà” tún pa genitive náà mọ́ ní fífẹ̀.
theological_decisions:
- issue: Àìdánilójú genitive nínú τὴν ἀγάπην τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  alternative: ìfẹ́ sí Ọlọ́run; ìfẹ́ tí Ọlọ́run ní
  rationale: Gíríìkì lè tọ́ka sí ìfẹ́ Ọlọ́run fún àwọn onígbàgbọ́, ìfẹ́ wọn sí Ọlọ́run, tàbí pápá ìfẹ́ àtọ̀runwá. Gbólóhùn àkọ́kọ́ kò yan ọ̀kan lára wọn.
- issue: Àìdánilójú genitive nínú τὴν ὑπομονὴν τοῦ Χριστοῦ
  choice: ìfaradà Mèsáyà
  alternative: ìfaradà tí Mèsáyà ní; ìfaradà nítorí Mèsáyà; ìfaradà bí ti Mèsáyà
  rationale: Genitive náà lè jẹ́ subjective, objective, tàbí qualitative; a pa ìṣòro ìtumọ̀ náà mọ́ nínú àkọ́kọ́, a sì fi àwọn ọ̀nà mìíràn sínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níbí, ọ̀rọ̀ náà jẹ́ oyè tó túmọ̀ sí ẹni àmì òróró; “Mèsáyà” mú iṣẹ́ oyè yẹn hàn gbangba.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ti òde òní, ó sì ṣeé lóye fún òǹkàwé lasán. A yàgò fún “Nísinsìnyí” tàbí àmì àsopọ̀ míì nítorí orísun kò ní ọ̀rọ̀ àkókò bẹ́ẹ̀.
