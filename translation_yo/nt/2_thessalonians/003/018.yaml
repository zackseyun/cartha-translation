  text: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/018.yaml
  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: yo
  text: Kí oore-ọ̀fẹ́ Olúwa wa Jésù Mèsáyà[a] wà pẹ̀lú gbogbo yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” “Kristi” ni ìtumọ̀ ìbílẹ̀ fún Χριστός; “Mèsáyà” mú iṣẹ́ rẹ̀ gẹ́gẹ́ bí orúkọ oyè hàn kedere sí i.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ọ̀nà àdánidá àti èyí tí a mọ̀ dáadáa fún ìṣe rere àti ojú rere tí a kò fi iṣẹ́ rà; ó bá ìbùkún ìparí lẹ́tà Paulu mu.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” fi ọlá àti àṣẹ tí orúkọ oyè κύριος ní hàn, ó sì jẹ́ èdè ìjọsìn Yorùbá tí ó wọ́pọ̀.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: “Jésù” jẹ́ ìkọ̀wé orúkọ náà ní Yorùbá, “Mèsáyà” sì mú iṣẹ́ Χριστός gẹ́gẹ́ bí orúkọ oyè ẹni tí Ọlọ́run fi àmì òróró yàn hàn kedere.
- source_word: μετὰ πάντων ὑμῶν
  choice: wà pẹ̀lú gbogbo yín
  rationale: “Pẹ̀lú” túmọ̀ μετά pẹ̀lú ẹ̀yà ọ̀rọ̀ genitive ní tààrà, “gbogbo yín” sì pa ìtẹnumọ́ pé ìbùkún náà kan gbogbo àwùjọ mọ́. A fi “wà” kún un kí gbólóhùn ìbùkún náà lè dára ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ nínú ìbùkún ìparí
  choice: Mèsáyà
  alternative: Kristi
  rationale: Χριστός jẹ́ orúkọ oyè ní ìpilẹ̀ rẹ̀, “Mèsáyà” sì jẹ́ kí ìtumọ̀ oyè náà hàn sí òǹkàwé òde òní. “Kristi” jẹ́ àṣà ìtumọ̀ Yorùbá tí ó ti fìdí múlẹ̀, nítorí náà a pa á mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbà lítíréṣọ̀ tó ṣe kedere, tó níyì, tí ó sì yẹ fún ìbùkún ìparí lẹ́tà. A lo “Kí … wà” láti sọ ìfẹ́ tàbí ìbùkún tí kò ní ọ̀rọ̀-ìṣe nínú Gíríìkì ní ọ̀nà àdánidá ní Yorùbá.
