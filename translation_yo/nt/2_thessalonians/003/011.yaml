  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: yo
  text: Nítorí a gbọ́ pé àwọn kan láàárín yín ń gbé ìgbésí ayé aláìlétò[a]; wọn kò ṣe iṣẹ́ kankan rárá, ṣùgbọ́n wọ́n ń dá sí ọ̀rọ̀ àwọn ẹlòmíràn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ń gbé ìgbésí ayé ọ̀lẹ” tàbí “ń gbé ìgbésí ayé aláìní ìbáwí.” Ọ̀rọ̀ Gíríìkì náà lè ṣàpèjúwe ìwà tí kò bá ètò mu tàbí ìwà ọ̀lẹ ní ìbámu pẹ̀lú ohun tí àwùjọ ń retí.
    reason: lexical_alternative
  - marker: b
    text: 'Ọ̀rọ̀ Gíríìkì náà ní eré-ọ̀rọ̀ kan: wọn kò “ṣiṣẹ́,” ṣùgbọ́n wọn ń “ṣiṣẹ́ káàkiri,” ìyẹn, wọ́n ń dá sí ọ̀rọ̀ tí kì í ṣe tiwọn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: a gbọ́
  rationale: Ọ̀rọ̀ ìṣe ìsinsìnyí náà ń tọ́ka sí ìròyìn tí ó ń dé etí wọn; “a gbọ́” jẹ́ ọ̀nà àdánidá ní Yorùbá láìfi àkókò míì kún un.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó so ẹsẹ̀ yìí mọ́ ìṣírí tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: τινας
  choice: àwọn kan
  rationale: Ó ń tọ́ka sí apá kan tí a kò dárúkọ pàtó nínú ìjọ.
- source_word: περιπατοῦντας
  choice: ń gbé ìgbésí ayé
  rationale: Níhìn-ín, περιπατέω jẹ́ àkàwé fún ìwà àti ọ̀nà ìgbésí ayé; ìtumọ̀ yìí jẹ́ kedere, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó fi hàn pé àwọn ènìyàn náà wà nínú àwùjọ àwọn onígbàgbọ́.
- source_word: ἀτάκτως
  choice: aláìlétò
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti ìwà tí kò bá ètò tàbí ìbáwí àwùjọ mu mọ́, láìdín un kù sí ọ̀lẹ nìkan.
- source_word: μηδὲν ἐργαζομένους
  choice: wọn kò ṣe iṣẹ́ kankan rárá
  rationale: “Kankan rárá” mú ìtẹnumọ́ μηδέν jáde pé wọn kò ṣe iṣẹ́ tó yẹ rárá.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìtakora tó lágbára hàn láàárín iṣẹ́ tó yẹ àti ìṣe tí kò yẹ.
- source_word: περιεργαζομένους
  choice: wọ́n ń dá sí ọ̀rọ̀ àwọn ẹlòmíràn
  rationale: Ó sọ ìtumọ̀ dídá sí ohun tí kì í ṣe ti ẹni ní Yorùbá òde òní. Àlàyé ìsàlẹ̀ ṣàfihàn eré-ọ̀rọ̀ Gíríìkì pẹ̀lú ἐργάζομαι.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A tú àkàwé “rìn” sí “gbé ìgbésí ayé” fún ìtumọ̀ àdánidá; a sì lo àmì ohùn ní kíkún níbi tó yẹ.
