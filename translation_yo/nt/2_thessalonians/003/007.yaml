  text: αὐτοὶ γὰρ οἴδατε πῶς δεῖ μιμεῖσθαι ἡμᾶς, ὅτι οὐκ ἠτακτήσαμεν ἐν ὑμῖν
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: yo
  text: Nítorí ẹ̀yin fúnra yín mọ bí ó ti yẹ kí ẹ fara wé wa, nítorí pé a kò hùwà láìtẹ̀lé ìlànà láàárín yín.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní pàtó sí i nínú àyíká ọ̀rọ̀ yìí, “a kò ṣe ọ̀lẹ láàárín yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: ẹ̀yin fúnra yín
  rationale: 'Ó pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́: àwọn ará Tẹsalóníkà fúnra wọn mọ ohun tí Pọ́ọ̀lù ń sọ.'
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó fi hàn pé gbólóhùn yìí ń ṣàlàyé ìdí fún ìṣílétí tó ṣáájú.
- source_word: οἴδατε
  choice: mọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà ní ìrísí perfect ní Gíríìkì, ìtumọ̀ rẹ̀ níbí jẹ́ ti ìsinsìnyí.
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: bí ó ti yẹ kí ẹ fara wé wa
  rationale: Ọ̀rọ̀ yìí sọ ọ̀nà àti ojúṣe láti fara wé Pọ́ọ̀lù àti àwọn alábàáṣiṣẹ́ rẹ̀; ó sì pa ‘wa’ mọ́ gẹ́gẹ́ bí ẹni tí wọ́n ń fara wé, dípò ṣíṣe àfikún ‘àpẹẹrẹ wa.’
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó mú ìbáṣepọ̀ ìdí tó wà láàárín ìmọ̀ wọn àti ìwà àwọn aposteli yé kedere.
- source_word: οὐκ ἠτακτήσαμεν
  choice: a kò hùwà lọ́nà àìní ìlànà
  rationale: Àṣàyàn yìí pa ìtumọ̀ gbòòrò ti ἀτακτέω mọ́—ìwà tí kò bá ìlànà mu—láì dín in kù sí àìṣiṣẹ́ nìkan.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Ó jẹ́ ọ̀nà àdánidá láti sọ pé ìwà náà wáyé ní àárín ìjọ Tẹsalóníkà.
theological_decisions:
- issue: Ìtumọ̀ ἀτακτέω nínú àyíká ọ̀rọ̀ náà
  choice: Ìwà àìní ìlànà ní ìtumọ̀ gbòòrò
  alternative: Ní pàtó, jíjẹ́ aláìṣiṣẹ́ tàbí ṣíṣe ọ̀lẹ
  rationale: Orí kẹta yìí so ìṣòro náà pọ̀ mọ́ kíkọ̀ láti ṣiṣẹ́, ṣùgbọ́n ἀτακτέω ní ìtumọ̀ tó gbòòrò ju àìṣiṣẹ́ lọ. Nítorí náà, ọ̀rọ̀ inú ẹsẹ pa ìtumọ̀ gbòòrò mọ́, àlàyé ìsàlẹ̀ sì tọ́ka sí ìtumọ̀ tó ṣeé ṣe ní pàtó nínú àyíká yìí.
translation_notes:
  register: Èdè Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún gbogbo ènìyàn. A lo ‘fara wé’ gẹ́gẹ́ bí ọ̀rọ̀ àdánidá fún fífi ìwà ẹlòmíràn ṣe àwòkọ́ṣe, a sì lo ‘ìwà lọ́nà àìní ìlànà’ láti pa ààyè ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́.
