id: 2TH.3.14
reference: 2 Thessalonians 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: yo
  text: Bí ẹnikẹ́ni kò bá sì ṣègbọ́ràn sí ọ̀rọ̀ wa nípasẹ̀ lẹ́tà yìí,[a] ẹ fi ẹni náà sọ́kàn;[b] ẹ má ṣe ní ìbákẹ́gbẹ́ pẹ̀lú rẹ̀,[c] kí ojú lè tì í.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nípasẹ̀ lẹ́tà náà” tàbí “nínú lẹ́tà yìí.” Gbólóhùn Gíríìkì náà lè tọ́ka sí ọ̀nà tí ìtọ́ni náà gbà dé.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹ sàmì sí ẹni náà” tàbí “ẹ máa kíyè sí i.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí “ẹ má ṣe bá a kẹ́gbẹ́.”
    reason: lexical_alternative
  - marker: d
    text: 'Àtúnṣe ni ète ìbáwí náà: fi wé ẹsẹ̀ 15, níbi tí wọ́n ti ní kí wọ́n ṣì máa kìlọ̀ fún un “bí arákùnrin.”'
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: ṣègbọ́ràn sí
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí gbígbọ́ àti títẹ̀lé àṣẹ tàbí ìtọ́ni; “ṣègbọ́ràn sí” bá àyíká ìkìlọ̀ àti ìtọ́ni yìí mu.
- source_word: τῷ λόγῳ ἡμῶν
  choice: ọ̀rọ̀ wa
  rationale: Ó tọ́ka sí ìhìn tàbí ìtọ́ni àwọn aposteli, ṣùgbọ́n “ọ̀rọ̀ wa” pa àwòrán Gíríìkì mọ́ ní Yorùbá tó ṣe déédé.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: nípasẹ̀ lẹ́tà yìí
  rationale: διά pẹ̀lú genitive ń tọ́ka sí ọ̀nà tàbí ohun èlò tí a fi mú ìtọ́ni dé; “yìí” jẹ́ ohun tí àyíká lẹ́tà tí wọ́n ń kà ń béèrè.
- source_word: σημειοῦσθε
  choice: ẹ fi ẹni náà sọ́kàn
  rationale: Àṣẹ náà ni pé kí ìjọ dá ẹni náà mọ̀, kí wọ́n sì kíyè sí i. Gbólóhùn yìí yàgò fún èrò pé kí wọ́n fi àmì ara kan sí i.
- source_word: τοῦτον
  choice: ẹni náà
  rationale: Ó tọ́ka pàtó sí ẹni tí kò ṣègbọ́ràn; “ẹni náà” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: ẹ má ṣe bá a kẹ́gbẹ́
  rationale: συναναμίγνυμι túmọ̀ sí dídarapọ̀ tàbí kíkẹ́gbẹ́ pẹ̀lú ẹnìkan. “Bá a kẹ́gbẹ́” fi ìyapa láwùjọ hàn láìsọ ọ́ di ọ̀rọ̀ òfin ìjọ kan pàtó.
- source_word: ἐντραπῇ
  choice: kí ojú lè tì í
  rationale: Passive subjunctive náà sọ ète pé kí ẹni náà ní ìmọ̀lára ìtìjú. Òwe Yorùbá yìí jẹ́ àdánidá, ó sì pa ète àtúnṣe mọ́ láìfi ìtìjú ìkà kun un.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ àìdánimọ̀ náà ní ìtumọ̀ gbogbogbò; “ẹnikẹ́ni” pa ìwọ̀n àídájú gbólóhùn náà mọ́.
- source_word: αὐτῷ
  choice: a / í
  rationale: Àwọn arọ́pò-orúkọ Yorùbá kò fi akọ tàbí abo hàn níbí, wọ́n sì tọ́ka sí ẹni náà lọ́nà tí ó ṣe déédé.
theological_decisions:
- issue: Irú ìbáwí tí μὴ συναναμίγνυσθαι αὐτῷ ń pàṣẹ
  choice: Ìyapa nínú ìbákẹ́gbẹ́ láti tọ́ ẹni onígbàgbọ́ aláìgbọ́ràn sọ́nà, kì í ṣe ìdájọ́ ìkẹyìn lórí rẹ̀.
  alternative: Ìyọkúrò nínú ìjọ ní ìtumọ̀ òfin tó le jù, tàbí yíyẹra fún un lásán láìní ìtumọ̀ kankan fún àwùjọ ìgbàgbọ́.
  rationale: Ẹsẹ̀ 15 sọ pé kí wọ́n má ṣe kà á sí ọ̀tá, bí kò ṣe kí wọ́n kìlọ̀ fún un bí arákùnrin. Nítorí náà, “ẹ má ṣe bá a kẹ́gbẹ́” pa agbára ìbáwí náà mọ́ láìgbé ètò òfin ìjọ ti àkókò mìíràn wọ inú ẹsẹ̀ náà.
- issue: Agbára ἐντραπῇ
  choice: Ìtìjú tí a retí jẹ́ ohun èlò ìtọ́nisọ́nà àti àtúnṣe.
  alternative: Ìtìjú ní gbangba gẹ́gẹ́ bí òpin fúnra rẹ̀.
  rationale: Gbólóhùn ète náà àti ẹsẹ̀ tó tẹ̀ lé e fi hàn pé àtúnṣe ni àfojúsùn. Ìtumọ̀ náà kò sọ ìrònúpìwàdà ní tààràtà, nítorí ọ̀rọ̀ Gíríìkì fúnra rẹ̀ sọ ìtìjú, ṣùgbọ́n àyíká fi ìdí ète ìtọ́nisọ́nà múlẹ̀.
translation_notes:
  register: A lo Yorùbá àkànṣe tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. Àwọn àmì ohùn wà ní kíkún níbi tí wọ́n ti yẹ. “Ẹ fi ẹni náà sọ́kàn” àti “ẹ má ṣe bá a kẹ́gbẹ́” jẹ́ ọ̀rọ̀ àdánidá tí kò dín líle àṣẹ náà kù, tí kò sì sọ ọ́ di èdè òfin ẹ̀sìn.
