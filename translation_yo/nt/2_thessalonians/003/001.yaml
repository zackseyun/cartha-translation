id: 2TH.3.1
reference: 2 Thessalonians 3:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: yo
  text: Ní ìkẹyìn, ẹ̀yin arákùnrin[a], ẹ máa gbàdúrà fún wa, kí ọ̀rọ̀ Olúwa lè tàn ká kánkán, kí a sì fi ògo fún un, gẹ́gẹ́ bí ó ti ṣẹlẹ̀ láàárín yín náà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì náà sọ ní ti gidi pé “arákùnrin,” ṣùgbọ́n ó lè jẹ́ ọ̀nà aṣojú láti bá gbogbo ìjọ—àwọn arákùnrin àti àwọn arábìnrin—sọ̀rọ̀.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, “kí ó sáré, kí a sì fi ògo fún un.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: Ní ìkẹyìn
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti fi bẹ̀rẹ̀ apá ìparí lẹ́tà; kò fi dandan sọ àkókò nìkan.
- source_word: προσεύχεσθε
  choice: ẹ máa gbàdúrà
  rationale: Àṣẹ ọ̀pọ̀ ènìyàn yìí ní ìtumọ̀ ìṣe tí ó ń bá a lọ; ‘ẹ máa gbàdúrà’ mú ìtumọ̀ náà jáde ní Yorùbá àdánidá.
- source_word: ἀδελφοί
  choice: ẹ̀yin arákùnrin
  rationale: Ó pa ìrísí akọ ọ̀pọ̀ inú Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe kí ọ̀rọ̀ náà dúró fún gbogbo ìjọ; àlàyé wà ní àlàyé ìsàlẹ̀.
- source_word: περὶ ἡμῶν
  choice: fún wa
  rationale: Pẹ̀lú ọ̀rọ̀ gbígbàdúrà, èyí ni ọ̀nà Yorùbá tí ó ṣe kedere, tí ó sì jẹ́ àdánidá.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: ọ̀rọ̀ Olúwa
  rationale: Ó pa àwòrán Bíbélì ti ‘ọ̀rọ̀’ mọ́, ó sì lè tọ́ka sí ìhìn tí a ń kéde láti ọ̀dọ̀ Olúwa tàbí nípa rẹ̀.
- source_word: τρέχῃ
  choice: lè máa yára tàn ká
  rationale: Gíríìkì túmọ̀ sí ‘sáré’ ní ti gidi, ṣùgbọ́n níbí ó jẹ́ àkàwé fún bí ìhìn Olúwa ṣe ń tẹ̀ síwájú ní kíákíá. Ìtumọ̀ yìí ṣe kedere ní Yorùbá, a sì tọ́ka sí àwòrán gidi nínú àlàyé ìsàlẹ̀.
- source_word: δοξάζηται
  choice: kí ó sì gba ògo
  rationale: Ọ̀rọ̀ yìí pa èrò δοξάζω mọ́ ju ‘bọ̀wọ̀ fún’ lọ, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé a fi ògo fún ọ̀rọ̀ náà tàbí pé a gbà á pẹ̀lú ọlá.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: gẹ́gẹ́ bí ó ti rí láàárín yín
  rationale: Gbólóhùn Gíríìkì fi ohun tí ó ti ṣẹlẹ̀ ní ọ̀dọ̀ àwọn ará Tẹsalóníkà wé ohun tí Pọ́ọ̀lù ń bẹ̀bẹ̀ fún; fífi ‘ó ti rí’ kún un jẹ́ ohun tí Yorùbá nílò fún ìtumọ̀ tí ó pé.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφοί nígbà tí a ń bá gbogbo ìjọ sọ̀rọ̀
  choice: ẹ̀yin arákùnrin
  alternative: ẹ̀yin ará; ẹ̀yin arákùnrin àti arábìnrin
  rationale: A pa akọ ọ̀pọ̀ inú ọ̀rọ̀ Gíríìkì mọ́ nínú ẹsẹ̀, láìfi ‘àti arábìnrin’ kún ohun tí kò hàn gbangba nínú ọ̀rọ̀ orísun. Àlàyé ìsàlẹ̀ sọ pé ó lè dúró fún gbogbo ìjọ.
- issue: Àkàwé τρέχῃ fún ìtẹ̀síwájú ìhìn Olúwa
  choice: lè máa yára tàn ká
  alternative: lè máa sáré
  rationale: Ìbámu tó péye fẹ́ kí Yorùbá sọ ìtumọ̀ àkàwé náà ní kedere, láìjẹ́ kí òǹkàwé rò pé ọ̀rọ̀ náà ń sáré ní ti ara. Àlàyé ìsàlẹ̀ pa àwòrán Gíríìkì mọ́.
- issue: Ìtumọ̀ δοξάζηται nípa ọ̀rọ̀ Olúwa
  choice: kí ó sì gba ògo
  alternative: kí a sì bọ̀wọ̀ fún un
  rationale: ‘Gba ògo’ pa ìsopọ̀ pẹ̀lú ògo mọ́, kò sì dín ìtumọ̀ rẹ̀ kù sí ìbọ̀wọ̀ nìkan; bákan náà, kò sọ ẹni tí ó ń fi ògo fún un ní pàtó, gẹ́gẹ́ bí ọ̀rọ̀ ìṣe àìsọ ẹni Gíríìkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ tó níyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. ‘Ẹ máa gbàdúrà’ àti ‘yára tàn ká’ jẹ́ ọ̀nà àdánidá, nígbà tí ‘ọ̀rọ̀ Olúwa’ àti ‘gba ògo’ pa ìró Bíbélì àti ìwúwo ẹ̀kọ́ ìgbàgbọ́ mọ́.
