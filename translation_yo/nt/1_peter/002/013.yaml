  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: yo
  text: Ẹ fi ara yín sábẹ́ gbogbo ètò ìṣàkóso tí ènìyàn gbé kalẹ̀[a] nítorí Olúwa; yálà ọba, gẹ́gẹ́ bí ẹni tí ó ga jù lọ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ó tún lè jẹ́ ‘gbogbo ohun tí ènìyàn dá’ tàbí ‘gbogbo ìlànà ènìyàn.’ Àwọn ọba àti gomina tí a mẹ́nu kàn lẹ́yìn èyí fi hàn pé àwọn ètò ìjọba tàbí àwọn aláṣẹ inú àwùjọ ni gbólóhùn náà ń tọ́ka sí níbí.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè jẹ́ ‘gẹ́gẹ́ bí ẹni tí ó ní ipò àṣẹ gíga.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: Ẹ fi ara yín sábẹ́
  rationale: Ọ̀rọ̀ yìí jẹ́ àṣẹ sí ọ̀pọ̀ ènìyàn, ó sì fi hàn pé kí wọ́n mọ̀ọ́mọ̀ tẹrí ba fún àṣẹ. Gbólóhùn Yorùbá yìí ṣe kedere, ó sì pa ìtumọ̀ àṣẹ náà mọ́.
- source_word: πάσῃ ἀνθρωπίνῃ κτίσει
  choice: gbogbo ètò ìṣàkóso tí ènìyàn gbé kalẹ̀
  rationale: πάσῃ níbí túmọ̀ sí ‘kọ̀ọ̀kan’ tàbí ‘gbogbo’; ἀνθρωπίνῃ κτίσει sì ń tọ́ka sí àwọn ètò ìjọba tàbí àṣẹ inú àwùjọ, gẹ́gẹ́ bí àpẹẹrẹ ọba àti àwọn gomina nínú ọ̀rọ̀ tó tẹ̀ lé e ṣe fi hàn. ‘Ètò ìṣàkóso’ jẹ́ èdè Yorùbá adayeba tí kò túmọ̀ rẹ̀ sí gbogbo ẹ̀dá ènìyàn kọ̀ọ̀kan.
- source_word: διὰ τὸν κύριον
  choice: nítorí Olúwa
  rationale: διά pẹ̀lú accusative sọ ìdí tàbí ohun tó ń múni ṣe ohun kan. ‘Nítorí Olúwa’ sọ pé ìbámu yìí dá lórí ìbáṣepọ̀ àwọn onígbàgbọ́ pẹ̀lú Olúwa.
- source_word: κύριον
  choice: Olúwa
  rationale: A pa oyè náà mọ́ láì fi ‘Jésù’ tàbí ‘Ọlọ́run’ kún un, nítorí Giriki kò sọ ẹni náà ní pàtó sí i.
- source_word: εἴτε βασιλεῖ
  choice: yálà ọba
  rationale: εἴτε bẹ̀rẹ̀ ìtòlẹ́sẹẹsẹ ‘yálà… tàbí…’ tí yóò tẹ̀ síwájú ní ẹsẹ tó tẹ̀ lé e; βασιλεῖ túmọ̀ sí ọba, láì fi dandan sọ pé olú ọba Róòmù nìkan ni.
- source_word: ὡς ὑπερέχοντι
  choice: gẹ́gẹ́ bí ẹni tí ó wà ní ipò àṣẹ gíga
  rationale: Ọ̀rọ̀ náà fi ipò tàbí àṣẹ tó ga ju ti àwọn míì lọ hàn. Ìtumọ̀ yìí yàgò fún lílo ọ̀rọ̀ tó lè mú kí àṣẹ ọba dà bí àṣẹ tí kò ní ààlà.
theological_decisions:
- issue: Irú àṣẹ tí ἀνθρωπίνῃ κτίσει ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ sí ‘gbogbo ètò ìṣàkóso tí ènìyàn gbé kalẹ̀.’
  alternative: ‘gbogbo ẹ̀dá ènìyàn’ tàbí ‘gbogbo ìlànà ènìyàn’
  rationale: Àwọn ọba àti gomina tí ọ̀rọ̀ tó tẹ̀ lé e mẹ́nu kàn fi hàn pé ètò ìjọba àti àṣẹ inú àwùjọ ni a ń sọ̀rọ̀ nípa rẹ̀. Ìtumọ̀ yìí kò sọ pé kí onígbàgbọ́ fi ara rẹ̀ sábẹ́ gbogbo ènìyàn kọ̀ọ̀kan, bẹ́ẹ̀ ni kò fi èrò ẹ̀kọ́ ìsìn kan kún bí àṣẹ náà ṣe bẹ̀rẹ̀.
- issue: Ẹni tí κύριον ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘Olúwa.’
  alternative: ‘Jésù’ tàbí ‘Ọlọ́run’
  rationale: Ọ̀rọ̀ Giriki náà lo oyè ‘Olúwa’ nìkan. Fífi oyè náà sílẹ̀ bẹ́ẹ̀ pa àìsọ pàtó inú orísun mọ́, kò sì fi ìtumọ̀ tí ẹsẹ náà kò sọ ní gbangba kún un.
- issue: Ìwọ̀n àṣẹ ọba nínú ὡς ὑπερέχοντι
  choice: ‘ẹni tí ó wà ní ipò àṣẹ gíga’
  alternative: ‘ẹni tó ga jù lọ’
  rationale: Ìtumọ̀ yìí jẹ́wọ́ ipò gíga ọba nínú ètò ìjọba láì sọ pé àṣẹ rẹ̀ ga jù gbogbo àṣẹ lọ ní ọ̀nà tí kò ní ààlà.
translation_notes:
  register: A lo Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. ‘Ẹ fi ara yín sábẹ́’ jẹ́ ọ̀nà adayeba láti sọ ìtẹríba tí a fi àṣẹ béèrè; ‘ètò ìṣàkóso tí ènìyàn gbé kalẹ̀’ sì mú ọ̀rọ̀ ìjọba inú àyíká ẹsẹ náà yé láì pa àṣàyàn ìtumọ̀ tààràtà mọ́, èyí tí àlàyé ìsàlẹ̀ ojú ewé ṣàkọsílẹ̀.
