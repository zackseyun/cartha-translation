  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: yo
  text: Ẹ̀yin ìránṣẹ́ inú ilé[a], ẹ máa tẹríba fún àwọn ọ̀gá yín pẹ̀lú gbogbo ìbòwò[b], kì í ṣe fún àwọn ẹni rere àti oníwà pẹ̀lẹ́ nìkan, ṣùgbọ́n fún àwọn tí ìwà wọn kò tọ́ pẹ̀lú.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹrú inú ilé.” Ọ̀rọ̀ Gíríìkì οἰκέται ń tọ́ka pàtó sí àwọn ìránṣẹ́ tàbí ẹrú tí ó wà nínú agbo ilé.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gangan, “nínú gbogbo ìbẹ̀rù”; níbí, ìtumọ̀ náà ṣeé ṣe kí ó jẹ́ ìbòwò ìtẹríba.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn tó le koko” tàbí “àwọn aláìṣòdodo.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní ti gangan sí “àwọn tó wọ́” tàbí “àwọn tó yíwọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: ìránṣẹ́ inú ilé
  rationale: Ọ̀rọ̀ náà ń tọ́ka pàtó sí àwọn tí wọ́n ń ṣiṣẹ́ tí wọ́n sì wà lábẹ́ àṣẹ nínú agbo ilé. Ìtumọ̀ yìí pa ipò inú ilé mọ́, nígbà tí àlàyé ìsàlẹ̀ fi hàn pé ipò ẹrú lè wà nínú rẹ̀.
- source_word: ὑποτασσόμενοι
  choice: ẹ máa tẹríba
  rationale: Bí ó tilẹ̀ jẹ́ pé participle ni Gíríìkì, ó ń ṣiṣẹ́ gẹ́gẹ́ bí àṣẹ nínú ọ̀rọ̀ ìyànjú yìí. ‘Ẹ máa tẹríba’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi ara sí abẹ́ àṣẹ.
- source_word: ἐν παντὶ φόβῳ
  choice: pẹ̀lú ọ̀wọ̀ tó pé
  rationale: φόβος lè túmọ̀ sí ẹ̀rù, ìbẹ̀rù ọlọ́wọ̀, tàbí ọ̀wọ̀ jíjinlẹ̀. Nínú àyíká yìí, ‘ọ̀wọ̀ tó pé’ sọ ìtẹríba ọlọ́wọ̀ jáde láì fi dandan túmọ̀ sí ìpayà; àlàyé ìsàlẹ̀ pa ìtumọ̀ gangan mọ́.
- source_word: δεσπόταις
  choice: àwọn ọ̀gá yín
  rationale: δεσπότης ni ẹni tó ní àṣẹ lórí ìránṣẹ́ tàbí ẹrú inú ilé. ‘Ọ̀gá’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere ní ibí yìí, láì dá a rú pọ̀ mọ́ orúkọ oyè fún Ọlọ́run.
- source_word: ἀγαθοῖς
  choice: àwọn ẹni rere
  rationale: Ó pa ìdájọ́ ìwà rere gbogbogbò ti ἀγαθός mọ́.
- source_word: ἐπιεικέσιν
  choice: oníwà pẹ̀lẹ́
  rationale: Ó mú ìtumọ̀ ìwà tútù, ìfaradà àti ṣíṣe pẹ̀lú ẹlòmíràn lọ́nà tó bójú mu jáde.
- source_word: σκολιοῖς
  choice: àwọn oníwà àyídá
  rationale: σκολιός túmọ̀ ní ti gangan sí ohun tí ó wọ́ tàbí yídá, ó sì lè ṣàpèjúwe ẹni tí ìwà rẹ̀ kò tọ́, tí kò ṣe déédéé, tàbí tí ó le koko. ‘Oníwà àyídá’ pa àwòrán ìtumọ̀ náà mọ́ láì dín un kù sí líle nìkan.
theological_decisions:
- issue: Bí a ṣe máa sọ ipò àwọn οἰκέται láì rọ ipò ìsìn wọn tàbí sọ ọ́ ju ohun tí ọ̀rọ̀ náà fúnra rẹ̀ sọ lọ
  choice: Lo ‘ìránṣẹ́ inú ilé’ nínú ẹsẹ̀, kí àlàyé sì sọ pé ‘ẹrú inú ilé’ tún ṣeé ṣe.
  alternative: ‘Àwọn ẹrú inú ilé’ tàbí ‘àwọn ìránṣẹ́’
  rationale: Ọ̀rọ̀ Gíríìkì náà dojú kọ ẹgbẹ́ àwọn tó gbé tàbí ṣiṣẹ́ lábẹ́ àṣẹ nínú agbo ilé, tí ipò wọn sì lè jẹ́ ti ẹrú. Ìtumọ̀ àkọ́kọ́ pa àyíká ilé mọ́, àlàyé sì dènà fífi òtítọ́ ipò ìgbàanì náà pamọ́.
- issue: Bóyá φόβος yẹ kí ó jẹ́ ‘ẹ̀rù’ tàbí ọ̀rọ̀ tó bá àyíká mu
  choice: ‘ọ̀wọ̀ tó pé’
  alternative: ‘gbogbo ẹ̀rù’ tàbí ‘ọ̀wọ̀ jíjinlẹ̀’
  rationale: Àyíká náà ń béèrè ìtẹríba ọlọ́wọ̀; kò fi dandan sọ ìpayà sí ọ̀gá. Síbẹ̀, àlàyé fi ìtumọ̀ gangan àti ààyè àìdánilójú rẹ̀ hàn.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. ‘Ẹ máa tẹríba’ mú agbára àṣẹ ti participle Gíríìkì jáde. Àwọn àmì ohùn ni a kọ ní kíkún níbi tí ó ti bá èdè àdánidá mu; gbogbo àmì àlàyé [a]–[c] wà nínú ọ̀rọ̀ àkọ́kọ́.
