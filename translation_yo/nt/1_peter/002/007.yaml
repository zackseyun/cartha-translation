id: 1PE.2.7
reference: 1 Peter 2:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: yo
  text: 'Nítorí náà, ọlá náà jẹ́ ti ẹ̀yin tí ẹ gbàgbọ́[a]; ṣùgbọ́n fún àwọn tí kò gbàgbọ́[b],


    “Òkúta tí àwọn tí ń kọ́ ilé kọ̀ sílẹ̀,

    òun náà ni ó di orí igun ilé.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun iyebíye náà jẹ́ ti ẹ̀yin tí ẹ gbàgbọ́,” ìyẹn ni pé òkúta náà jẹ́ iyebíye fún àwọn onígbàgbọ́.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àwọn tí kò ṣègbọ́ràn”; ọ̀rọ̀ ìṣe náà lè ní ìtumọ̀ kíkọ̀ láti gbàgbọ́, tí ó sì yọrí sí àìgbọ́ràn.
    reason: lexical_alternative
  - marker: c
    text: 'Ní ìtumọ̀ tí ó wọ́pọ̀: “òkúta igun ilé” tàbí “òkúta pàtàkì jù lọ ní igun ilé.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: ọlá
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí ọlá, iye tàbí jíjẹ́ ohun iyebíye. “Ọlá” pa ìṣọ̀kan gbólóhùn Gíríìkì mọ́, ó sì bá ìyàtọ̀ láàárín àwọn tí ó gbàgbọ́ àti àwọn tí kò gbàgbọ́ mu láì fi tipátipá sọ pé ó ń tọ́ka sí iyebíye òkúta nìkan.
- source_word: τοῖς πιστεύουσιν
  choice: ẹ̀yin tí ẹ gbàgbọ́
  rationale: Èyí pa ọ̀rọ̀ tí a ń bá àwọn olùgbọ́ sọ tààrà mọ́, ó sì tú participle náà sí Yorùbá àdánidá.
- source_word: ἀπιστοῦσιν
  choice: àwọn tí kò gbàgbọ́
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà dúró ní ìtakora tààrà sí “àwọn tí ó gbàgbọ́.” Ìtumọ̀ tí ó lè ní nípa àìgbọ́ràn wà nínú àlàyé ìsàlẹ̀.
- source_word: λίθος
  choice: òkúta
  rationale: “Òkúta” ni ọ̀rọ̀ Yorùbá tí ó bá àwòrán iṣẹ́ kíkọ́ ilé mu ní kedere.
- source_word: ἀπεδοκίμασαν
  choice: kọ̀ sílẹ̀
  rationale: Ó ń sọ nípa kíkọ ohun kan lẹ́yìn tí a ti yẹ̀ ẹ́ wò; “kọ̀ sílẹ̀” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn akọ́lé kò tẹ́wọ́ gbà á.
- source_word: οἱ οἰκοδομοῦντες
  choice: àwọn tí ń kọ́ ilé
  rationale: Gbólóhùn yìí ṣe kedere ju orúkọ iṣẹ́ tí kò wọ́pọ̀ lọ, ó sì pa àwòrán àwọn akọ́lé mọ́.
- source_word: κεφαλὴν γωνίας
  choice: orí igun ilé
  rationale: Èyí tẹ̀ lé àwòrán gangan, “orí igun,” dípò kí ó fi ìtumọ̀ ìkọ́lé kan ṣoṣo lé e lórí. A fi “ilé” kún un nítorí àyíká iṣẹ́ kíkọ́ ilé, kí ọ̀rọ̀ náà sì yé òǹkàwé Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ἡ τιμή ní ìbáṣepọ̀ pẹ̀lú àwọn onígbàgbọ́ àti Kristi gẹ́gẹ́ bí òkúta
  choice: Ọlá náà jẹ́ ti àwọn tí ó gbàgbọ́.
  alternative: Ohun iyebíye náà jẹ́ ti àwọn tí ó gbàgbọ́, ìyẹn ni pé òkúta náà ṣeyebíye sí wọn.
  rationale: ὑμῖν ... ἡ τιμή ń tọ́ka ní tààrà sí ọlá tí ó jẹ́ ti àwọn onígbàgbọ́, ó sì bá ọ̀rọ̀ àyíká nípa àìtijú mu. Síbẹ̀, nítorí ẹsẹ tó ṣáájú pè òkúta náà ní iyebíye, a pa ìtumọ̀ mìíràn náà mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ κεφαλὴ γωνίας
  choice: A pa àwòrán gangan náà mọ́ gẹ́gẹ́ bí “orí igun ilé.”
  alternative: òkúta igun ilé; òkúta pàtàkì jù lọ ní igun ilé
  rationale: Gbólóhùn Gíríìkì túmọ̀ ní ti gidi sí “orí igun.” Pípa èyí mọ́ kò fi ìtumọ̀ faaji kan ṣoṣo lé àwòrán tó ṣe pàtàkì nípa Kristi lórí; ìtumọ̀ tí ó wọ́pọ̀ sí i wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Àwọn tí ń kọ́ ilé” rọrùn fún òǹkàwé ju ọ̀rọ̀ iṣẹ́ àkànṣe lọ. Ìlà ewì méjì pa ìrísí ọ̀rọ̀ àyọlò Sáàmù mọ́, nígbà tí “orí igun ilé” pa àwòrán orísun Gíríìkì mọ́.
