id: 1PE.2.14
reference: 1 Peter 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: yo
  text: tàbí sí àwọn gómìnà, gẹ́gẹ́ bí àwọn tí a rán nípasẹ̀ rẹ̀[a] láti fi ìyà jẹ àwọn olùṣe ibi, àti láti yin àwọn olùṣe rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nípasẹ̀ rẹ̀” tún lè túmọ̀ sí “láti ọ̀dọ̀ rẹ̀”; “rẹ̀” ṣeé ṣe kí ó tọ́ka sí ọba tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú. Àwọn kan lóye “nípasẹ̀ rẹ̀” ní ìtumọ̀ tó gbòòrò sí i, pé ó tọ́ka sí bí Ọlọ́run ṣe ṣètò àṣẹ ìjọba.
    reason: alternative_reading
lexical_decisions:
- source_word: εἴτε
  choice: tàbí sí
  rationale: Ó ń tẹ̀ síwájú nínú ìtòlẹ́sẹẹsẹ ‘yálà … tàbí’ láti ẹsẹ tó ṣáájú; ‘tàbí sí’ bá ìtẹ̀sí gírámà àti àyíká ọ̀rọ̀ mu.
- source_word: ἡγεμόσιν
  choice: àwọn gómìnà
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí àwọn òṣìṣẹ́ ìjọba tó ń ṣàkóso lábẹ́ aláṣẹ gíga. ‘Àwọn gómìnà’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere láì fi ipò pàtó kan nínú ètò Róòmù kún un.
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi bí a ṣe ń wo tàbí ṣe àpèjúwe àwọn gómìnà hàn, ó sì so wọn pọ̀ mọ́ aláṣẹ tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
- source_word: δι’ αὐτοῦ
  choice: nípasẹ̀ rẹ̀
  rationale: ‘Nípasẹ̀ rẹ̀’ pa ìtumọ̀ irinṣẹ́ tàbí aṣojú inú διά pẹ̀lú ọ̀rọ̀ arọ́pò-orúkọ mọ́, láì pa àìdánilójú nípa ẹni tí ‘rẹ̀’ ń tọ́ka sí rẹ́.
- source_word: πεμπομένοις
  choice: àwọn tí a rán
  rationale: Ìtumọ̀ yìí ṣe àfihàn participle náà gẹ́gẹ́ bí àwọn alákòóso tí a fiṣẹ́ rán, láì fi èrò ‘fún ní àṣẹ àkànṣe’ tí kò pọndandan kún un.
- source_word: εἰς ἐκδίκησιν
  choice: láti jẹ … ní ìyà
  rationale: Nínú àyíká iṣẹ́ ìjọba, gbólóhùn yìí sọ ìdí ìránṣẹ́ wọn di mímú ìyà bá àwọn tó ń ṣe ibi; ó yẹra fún ìtumọ̀ ẹ̀san ara ẹni.
- source_word: κακοποιῶν
  choice: àwọn aṣebi
  rationale: Ó ń tọ́ka sí àwọn ẹni tí ìṣe búburú ń ṣe àpèjúwe wọn; ‘àwọn aṣebi’ jẹ́ kúkúrú, ó sì bá ìtumọ̀ ìwà àti òfin mu.
- source_word: ἔπαινον
  choice: láti yin
  rationale: Ìṣe ‘láti yin’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìfọwọ́sí tàbí ìyìn tí aláṣẹ ń fún ẹni tó ṣe rere.
- source_word: ἀγαθοποιῶν
  choice: àwọn tí ń ṣe rere
  rationale: Ó pa èrò ìṣe tó wà nínú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ Yorùbá tó ṣe kedere ju ọ̀rọ̀ àkójọpọ̀ bí ‘olóore’ lọ nínú àyíká yìí.
theological_decisions:
- issue: Ẹni tí αὐτοῦ nínú δι’ αὐτοῦ ń tọ́ka sí
  choice: A fi ‘nípasẹ̀ rẹ̀’ sílẹ̀ nínú ọ̀rọ̀, pẹ̀lú ìtumọ̀ tó ṣeé ṣe jù pé ó ń tọ́ka sí ọba tàbí olú ọba tí ẹsẹ 13 mẹ́nu kàn.
  alternative: Àwọn kan lóye rẹ̀ pé Ọlọ́run ni ó ń tọ́ka sí, ní ti bí Ọlọ́run ṣe ṣètò àṣẹ ìjọba.
  rationale: Ẹni tó sún mọ́ ọ̀rọ̀ arọ́pò-orúkọ jù ni ọba inú ẹsẹ tó ṣáájú, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò tún orúkọ ẹni náà sọ. Nítorí náà, a pa ọ̀rọ̀ arọ́pò-orúkọ mọ́, a sì ṣàlàyé àṣàyàn mìíràn nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá jẹ́ àdánidá. ‘Gómìnà’ jẹ́ ọ̀rọ̀ ìjọba tí gbogbo ènìyàn lóye; ìtòlẹ́sẹẹsẹ ‘jẹ … ní ìyà … àti … yin’ mú iṣẹ́ méjèèjì hàn ní kedere, bí ó tilẹ̀ jẹ́ pé a yí àwọn orúkọ Gíríìkì padà sí àwọn ọ̀rọ̀ ìṣe Yorùbá fún ìṣàn ọ̀rọ̀ tó dára.
