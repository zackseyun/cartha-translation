  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: yo
  text: Nítorí èyí jẹ́ oore-ọ̀fẹ́:[a] bí ẹnì kan bá, nítorí pé ó mọ Ọlọ́run lọ́kàn,[b] fara da àwọn ìrora nígbà tí ó ń jìyà láìṣòdodo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Oore-ọ̀fẹ́” níhìn-ín tún lè túmọ̀ sí ohun rere tí ó yẹ fún ìtẹ́wọ́gbà tàbí ojúrere.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “nítorí ìmú-ọkàn ẹni sí Ọlọ́run,” tàbí “nítorí ẹ̀rí-ọkàn níwájú Ọlọ́run.”
    reason: lexical_alternative
  - marker: c
    text: 'A tún lè ṣètò gbólóhùn náà báyìí: “bí ẹnì kan bá fara da àwọn ìrora nígbà tí ó ń jìyà láìṣòdodo nítorí pé ó mọ Ọlọ́run lọ́kàn.”'
    reason: previous_rendering
lexical_decisions:
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí pa ìsopọ̀ ọ̀rọ̀ Gíríìkì náà mọ́ pẹ̀lú lílò rẹ̀ ní 1 Pétérù àti gbogbo Májẹ̀mú Tuntun. Nínú àyíká yìí, ó tún lè túmọ̀ sí ohun tí ó yẹ fún ìtẹ́wọ́gbà tàbí ojúrere; àlàyé ẹsẹ̀ fi ìtumọ̀ yẹn hàn láìfi kún ọ̀rọ̀ pàtó inú ẹsẹ̀.
- source_word: διὰ συνείδησιν θεοῦ
  choice: nítorí ìmọ̀lára rẹ̀ nípa Ọlọ́run
  rationale: Ọ̀rọ̀ συνείδησις lè tọ́ka sí ẹ̀rí-ọkàn tàbí ìmọ̀ tí ènìyàn ní nínú ara rẹ̀. Ìtumọ̀ yìí jẹ́ Yorùbá tí ó ṣeé lóye, ó sì pa ìdarí ọkàn ẹni sí Ọlọ́run mọ́ láìdín ọ̀rọ̀ náà kù sí ẹ̀rí-ọkàn nìkan.
- source_word: ὑποφέρει
  choice: fara da
  rationale: ‘Fara da’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ fífi sùúrù dúró lábẹ́ ìnira.
- source_word: λύπας
  choice: àwọn ìbànújẹ́
  rationale: Ọ̀rọ̀ yìí gba ìrora inú àti ìpọ́njú tí ẹni ń ní, bí ọ̀rọ̀ Gíríìkì náà ṣe gbòòrò sí.
- source_word: πάσχων ἀδίκως
  choice: nígbà tí ó ń jìyà láìtọ́
  rationale: Èyí fi hàn pé ìjìyà náà ń ṣẹlẹ̀ ní àkókò fífaradà, àti pé kò tọ́ sí ẹni náà.
- source_word: τις
  choice: ẹnì kan
  rationale: Ó bá àìsọ ẹni pàtó nínú Gíríìkì mu, kò sì fi akọ tàbí abo kún un.
- source_word: τοῦτο γὰρ
  choice: Nítorí èyí
  rationale: ‘Nítorí’ fi iṣẹ́ γάρ gẹ́gẹ́ bí àsopọ̀ àlàyé hàn, ‘èyí’ sì tọ́ka sí gbólóhùn ipò tí ó tẹ̀ lé e.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú àyíká yìí
  choice: A túmọ̀ rẹ̀ sí ‘oore-ọ̀fẹ́’ dípò fífi ìtumọ̀ àlàyé bí ‘ohun ìyìn’ tàbí ‘ohun tí Ọlọ́run tẹ́wọ́ gbà’ sínú ọ̀rọ̀ pàtàkì.
  alternative: ohun tí ó yẹ fún ìtẹ́wọ́gbà; ohun tí ń rí ojúrere
  rationale: Gíríìkì kò sọ ‘lọ́dọ̀ Ọlọ́run’ ní kedere nínú gbólóhùn yìí. ‘Oore-ọ̀fẹ́’ pa ìró ẹ̀kọ́ ìgbàgbọ́ àti àìdánilójú gidi ti ọ̀rọ̀ náà mọ́.
- issue: Ìtumọ̀ συνείδησις θεοῦ
  choice: A gbà á gẹ́gẹ́ bí ìmọ̀ tàbí ìmọ̀lára tí ó darí sí Ọlọ́run.
  alternative: ẹ̀rí-ọkàn sí Ọlọ́run; rírántí Ọlọ́run lọ́kàn
  rationale: Gbólóhùn Gíríìkì náà kéré, ó sì lè tọ́ka sí ẹ̀rí-ọkàn tàbí sí mímọ Ọlọ́run lọ́kàn. Ọ̀rọ̀ pàtàkì àti àlàyé ẹsẹ̀ jọ pa àwọn ọ̀nà méjèèjì mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti èdè òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìtò ọ̀rọ̀ pàtàkì so ‘nítorí ìmọ̀lára rẹ̀ nípa Ọlọ́run’ mọ́ fífaradà, bí ìtò Gíríìkì ṣe ń tọ́ka, nígbà tí àlàyé [c] pa ìtò ọ̀rọ̀ mìíràn mọ́.
