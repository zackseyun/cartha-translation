id: 1PE.2.23
reference: 1 Peter 2:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: yo
  text: Ẹni tí, nígbà tí wọ́n ń gàn án, kò gàn padà; nígbà tí ó ń jìyà, kò halẹ̀, ṣùgbọ́n ó ń fi ara rẹ̀ lé ẹni tí ń ṣe ìdájọ́ lọ́nà òdodo lọ́wọ́.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: Ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka sí Kristi nínú ẹsẹ tó ṣáájú, ó sì jẹ́ kí gbólóhùn náà tẹ̀ síwájú lọ́nà àdánidá ní Yorùbá.
- source_word: λοιδορούμενος
  choice: nígbà tí wọ́n ń gàn án
  rationale: Ó túmọ̀ sí pé àwọn ènìyàn ń fi ọ̀rọ̀ burúkú tàbí èébú kọlu u; ‘ń gàn án’ jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere.
- source_word: οὐκ ἀντελοιδόρει
  choice: kò fi èébú gba èébú padà
  rationale: Ìtumọ̀ yìí mú ìhùwàsí fífi ọ̀rọ̀ burúkú san ọ̀rọ̀ burúkú padà hàn, ó sì bá àkókò aláìpé tó ń ṣàpèjúwe ìwà rẹ̀ mu.
- source_word: πάσχων
  choice: nígbà tí ó ń jìyà
  rationale: Ìtumọ̀ àkókò yìí tẹ̀ lé ìṣọ̀kan àwọn gbólóhùn méjèèjì, ó sì pa ìtumọ̀ ìfaradà ìyà mọ́.
- source_word: οὐκ ἠπείλει
  choice: kò halẹ̀ mọ́ wọn
  rationale: ‘Halẹ̀ mọ́’ túmọ̀ sí sísọ pé ẹni yóò ṣe ibi sí ẹlòmíràn; ‘wọn’ jẹ́ ohun tí ọ̀rọ̀-ìṣe Yorùbá nílò ní àyíká yìí, ó sì tọ́ka sí àwọn tó ń ṣe é ní ibi.
- source_word: παρεδίδου
  choice: ó ń fi ara rẹ̀ lé ... lọ́wọ́
  rationale: Ìsọ̀rọ̀ yìí mú ìgbàgbọ́ àti fífi ọ̀ràn ara ẹni sí ìkáwọ́ ẹlòmíràn hàn, nígbà tí ‘ń’ pa ìṣesí tí ó ń bá a lọ nínú ọ̀rọ̀-ìṣe aláìpé náà mọ́.
- source_word: τῷ κρίνοντι δικαίως
  choice: ẹni tí ń ṣe ìdájọ́ lọ́nà òdodo
  rationale: Ó pa àpèjúwe ẹni náà gẹ́gẹ́ bí adájọ́ tí ń ṣe ìdájọ́ pẹ̀lú òdodo mọ́ láìfi orúkọ tàbí oyè tí Gíríìkì kò sọ kún un.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín àìgbẹ̀san Kristi àti fífi ara rẹ̀ lé adájọ́ olódodo lọ́wọ́.
theological_decisions:
- issue: Ẹni tí gbolohun ‘ẹni tí ń ṣe ìdájọ́ lọ́nà òdodo’ ń tọ́ka sí
  choice: A pa ìtọ́kasí náà mọ́ gẹ́gẹ́ bí àpèjúwe Ọlọ́run láìsọ ‘Baba’ ní tààrà.
  alternative: Kí a sọ ní kedere pé ‘Ọlọ́run Baba.’
  rationale: Àyíká ọ̀rọ̀ fi Ọlọ́run hàn gẹ́gẹ́ bí ẹni tí Kristi fi ara rẹ̀ lé lọ́wọ́, ṣùgbọ́n Gíríìkì kò lo orúkọ tàbí oyè pàtó níbí; nítorí náà, a kò tú ìṣòro ẹ̀kọ́ ìgbàgbọ́ náà kọjá ohun tí ẹsẹ náà sọ.
- issue: Ohun tí a kò sọ ní tààrà lẹ́yìn παρεδίδου
  choice: A tú u sí ‘fi ara rẹ̀ lé ... lọ́wọ́.’
  alternative: Kí a fi ohun tí ó ń fà lé e lọ́wọ́ sílẹ̀ láìsọ, tàbí kí a sọ pé ó fi ‘ọ̀ràn rẹ̀’ lé e lọ́wọ́.
  rationale: Gíríìkì kò ní ohun tí ọ̀rọ̀-ìṣe náà gba ní tààrà. ‘Ara rẹ̀’ bá àyíká ìjìyà Kristi mu, ṣùgbọ́n a yàgò fún ṣíṣe àlàyé rẹ̀ sí ‘ọ̀ràn rẹ̀’ nìkan.
translation_notes:
  register: Yorùbá àfọwọ́ṣe, ọ̀wọ̀, àti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Ìṣọ̀kan ‘nígbà tí ... nígbà tí ... ṣùgbọ́n’ pa ìbáramu àti ìyàtọ̀ inú Gíríìkì mọ́. A kò fi àlàyé ìjọ tàbí ẹ̀kọ́ ẹ̀sìn kan pàtó kún ọ̀rọ̀ náà.
