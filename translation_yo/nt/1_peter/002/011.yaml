id: 1PE.2.11
reference: 1 Peter 2:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: yo
  text: Ẹ̀yin olùfẹ́, mo rọ̀ yín, gẹ́gẹ́ bí àjèjì àti arìnrìn-àjò[a], pé kí ẹ máa yẹra fún àwọn ìfẹ́kúfẹ̀ẹ́ ti ara[b], tí wọ́n ń jagun sí ọkàn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn àlejò àti olùgbé fún ìgbà díẹ̀.” Àwọn ọ̀rọ̀ méjèèjì tẹnumọ́ pé àwọn onígbàgbọ́ kò jẹ́ ti ayé tàbí àwùjọ ìsinsìnyí ní kíkún.
    reason: lexical_alternative
  - marker: b
    text: “Àwọn ìfẹ́kúfẹ̀ẹ́ ti ara” tún lè jẹ́ “àwọn ìfẹ́kúfẹ̀ẹ́ ẹlẹ́ṣẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: “Ọkàn” tún lè túmọ̀ sí “ìwàláàyè” tàbí “ara ẹni” níhìn-ín.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ẹ̀yin olùfẹ́
  rationale: Ọ̀rọ̀ ìpè ní ọ̀pọ̀ ẹni tí ó fi ìfẹ́ hàn ni; ó pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú èrò ἀγαπάω/ἀγάπη, ó sì jẹ́ ọ̀rọ̀ Yorùbá adayébá.
- source_word: παρακαλῶ
  choice: mo rọ̀ yín
  rationale: Níhìn-ín, ọ̀rọ̀ náà jẹ́ ìṣírí tàbí ẹ̀bẹ̀ tó lágbára, kì í ṣe ìbéèrè lásán; “mo rọ̀ yín” mú agbára yẹn jáde ní èdè Yorùbá òde òní.
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó ṣàpèjúwe ipò tí Peteru fi ń bá àwọn olùgbọ́ sọ̀rọ̀, láì fi ìtumọ̀ ìdí tí kò hàn gbangba sínú rẹ̀.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: àjèjì àti arìnrìn-àjò
  rationale: Àwọn ọ̀rọ̀ méjèèjì tẹnumọ́ pé wọn kì í ṣe ọmọ ìbílẹ̀, ibùgbé wọn sì jẹ́ ti ìgbà díẹ̀. Àpapọ̀ yìí jẹ́ adayébá ní Yorùbá, ó sì pa àwòrán ìrìn-àjò àti àìjẹ́ ti ayé yìí ní kíkún mọ́.
- source_word: ἀπέχεσθαι
  choice: kí ẹ máa yẹra fún
  rationale: 'Àpólà yìí fi ìṣe tí ó ń bá a lọ hàn: kí ènìyàn máa fa ara rẹ̀ sẹ́yìn, kí ó sì má ṣe kópa nínú ohun náà.'
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: àwọn ìfẹ́kúfẹ̀ẹ́ ti ara
  rationale: “Ti ara” pa àwòrán σάρξ mọ́, nígbà tí “ìfẹ́kúfẹ̀ẹ́” sọ irú ìfẹ́ tí ó ń fà ènìyàn sí ibi ní ọ̀nà adayébá, láì dín un kù sí ìfẹ́ ìbálòpọ̀ nìkan.
- source_word: αἵτινες στρατεύονται
  choice: tí ń bá ... jagun
  rationale: Ó pa àwòrán ológun àti ìkọlù tí ń bá a lọ mọ́ nínú gbólóhùn Yorùbá tó ṣe kedere.
- source_word: κατὰ τῆς ψυχῆς
  choice: bá ọkàn jagun
  rationale: “Ọkàn” lè tọ́ka sí ìwàláàyè inú tàbí gbogbo ẹni, gẹ́gẹ́ bí ψυχή ṣe lè túmọ̀ sí níhìn-ín; a kò fi “yín” kún un nítorí kò sí ní tààrà nínú Giriki.
theological_decisions:
- issue: Ìtumọ̀ σαρκικῶν nínú ọ̀rọ̀ ìwà rere àti ìwà búburú
  choice: ti ara
  alternative: ẹlẹ́ṣẹ̀ / ti ẹ̀dá ẹlẹ́ṣẹ̀
  rationale: “Ti ara” pa àkàwé orísun mọ́, kò sì fi ẹ̀kọ́ pàtó kan rọ́pò àìdánilójú àti ìfọ̀rọ̀wérọ̀ tó wà nínú ọ̀rọ̀ náà.
- issue: Ìtumọ̀ ψυχή
  choice: ọkàn
  alternative: ìwàláàyè / ara ẹni
  rationale: “Ọkàn” jẹ́ ọ̀rọ̀ Yorùbá adayébá fún inú ènìyàn tàbí ẹni náà, ṣùgbọ́n ẹsẹ̀ náà kò fi dandan gbé ìpín ara àti ọkàn kalẹ̀ gẹ́gẹ́ bí ẹ̀kọ́ ìmọ̀-ènìyàn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti adayébá ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Ẹ̀yin olùfẹ́” jẹ́ ìpè onífẹ̀ẹ́; “mo rọ̀ yín” jẹ́ kedere fún òǹkàwé òde òní. Gbólóhùn náà pa àwòrán àjèjì, ìfẹ́ ti ara, àti ogun mọ́ láì ṣàlàyé wọn kọjá ohun tí orísun sọ.
