id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: yo
  text: Nítorí ìyìn wo ni ó jẹ́ fún yín bí ẹ bá ń dẹ́ṣẹ̀, tí wọ́n sì ń lù yín, tí ẹ sì fara dà á? Ṣùgbọ́n bí ẹ bá ń ṣe rere, tí ẹ sì ń jìyà, tí ẹ sì fara dà á, èyí jẹ́ oore-ọ̀fẹ́ lọ́dọ̀ Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí rí ojú rere Ọlọ́run,” tàbí, “èyí yẹ fún ìyìn lọ́dọ̀ Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κλέος
  choice: ìyìn tí ẹ yẹ fún
  rationale: Nínú ìbéèrè àsọ̀rọ̀yí, ọ̀rọ̀ náà ń tọ́ka sí ìyìn tàbí ìfọwọ́sí tí ènìyàn lè tọ́ sí, kì í ṣe òkìkí tàbí ògo ní ìtumọ̀ gbòòrò.
- source_word: ἁμαρτάνοντες
  choice: ẹ bá ń dẹ́ṣẹ̀
  rationale: Èyí pa agbára ìtumọ̀ ìwà àti ẹ̀kọ́ nípa ẹ̀ṣẹ̀ mọ́, ó sì fi ìṣe tí ó ń lọ hàn.
- source_word: κολαφιζόμενοι
  choice: wọ́n sì ń lù yín
  rationale: Ọ̀rọ̀ Gíríìkì náà ń sọ nípa lílu ènìyàn ní ti ara; ìtumọ̀ yìí ṣe kedere, ó sì jẹ́ èdè Yorùbá ti òde òní.
- source_word: ὑπομενεῖτε
  choice: ẹ sì fara dà á
  rationale: ‘Fara dà’ sọ ìdúró ṣinṣin lábẹ́ ìpọ́njú lọ́nà àdánidá, a sì tún un lò nínú gbólóhùn méjèèjì bí orísun ṣe ṣe.
- source_word: ἀγαθοποιοῦντες
  choice: ẹ bá ń ṣe rere
  rationale: Èyí jẹ́ ìtumọ̀ tààrà, tí ó sì wọ́pọ̀ fún ṣíṣe ohun tí ó dára tàbí fífi ire ṣe ẹlòmíràn.
- source_word: πάσχοντες
  choice: ẹ sì ń jìyà
  rationale: ‘Jìyà’ pa ìtumọ̀ gbòòrò ti ìpọ́njú mọ́ láì dín un kù sí irú ìlòkulò kan ṣoṣo.
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: ‘Oore-ọ̀fẹ́’ pa ìfihàn ọ̀rọ̀ pàtàkì náà àti ìró ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́; àlàyé ìsàlẹ̀ ojú ìwé sì fi ìtumọ̀ ìfọwọ́sí Ọlọ́run hàn.
- source_word: παρὰ θεῷ
  choice: níwájú Ọlọ́run
  rationale: Παρά pẹ̀lú dative ń tọ́ka sí bí Ọlọ́run ṣe ń wo ọ̀ràn náà tàbí ìdájọ́ rẹ̀; ‘níwájú Ọlọ́run’ pa ìbáṣepọ̀ yìí mọ́.
theological_decisions:
- issue: Ìtumọ̀ χάρις nínú gbólóhùn ìparí
  choice: èyí jẹ́ oore-ọ̀fẹ́ níwájú Ọlọ́run
  alternative: èyí rí ojú rere Ọlọ́run / èyí yẹ fún ìyìn níwájú Ọlọ́run
  rationale: Ọ̀rọ̀ náà lè ní ìró ‘oore-ọ̀fẹ́’ tàbí túmọ̀ sí ohun tí Ọlọ́run fọwọ́ sí. Ọ̀rọ̀ inú ẹsẹ̀ pa ‘oore-ọ̀fẹ́’ mọ́, àlàyé sì ṣàfihàn àwọn ìtumọ̀ míì láì fi tipátipá pinnu àìṣedéédé rẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ti òde òní, tí ó ní iyì ni a lò. A lo ‘ẹ’ àti ‘yín’ fún ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí àwọn ọ̀rọ̀-ìṣe Gíríìkì ṣe jẹ́ plural. Àwọn àmì ohùn ni a fi sí ibi tí ó yẹ.
