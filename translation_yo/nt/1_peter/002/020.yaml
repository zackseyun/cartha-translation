revisions:
- from: Nítorí ìyìn wo ni ẹ yẹ fún bí ẹ bá ń dẹ́ṣẹ̀, tí wọ́n sì ń lù yín, tí ẹ sì fara dà á? Ṣùgbọ́n bí ẹ bá ń ṣe rere, tí ẹ sì ń jìyà, tí ẹ sì fara dà á, èyí jẹ́ oore-ọ̀fẹ́ níwájú Ọlọ́run.[a]
  to: Nítorí ìyìn wo ni ó jẹ́ fún yín bí ẹ bá ń dẹ́ṣẹ̀, tí wọ́n sì ń lù yín, tí ẹ sì fara dà á? Ṣùgbọ́n bí ẹ bá ń ṣe rere, tí ẹ sì ń jìyà, tí ẹ sì fara dà á, èyí jẹ́ oore-ọ̀fẹ́ lọ́dọ̀ Ọlọ́run.[a]
  rationale: 'A ṣe àtúnṣe méjì péré: a tún ìbéèrè àsọ̀rọ̀yí ṣètò kí ó dùn mọ́ etí Yorùbá, a sì fi “lọ́dọ̀ Ọlọ́run” rọ́pò “níwájú Ọlọ́run” láti fi ìtumọ̀ ìbáṣepọ̀/ìfọwọ́sí ti παρὰ θεῷ hàn dáadáa. Gbogbo ìdààmú ìtumọ̀ χάρις ni a pa mọ́ ní ọ̀rọ̀ àkọ́kọ́ àti nínú àlàyé ìsàlẹ̀ ojú ìwé.'
