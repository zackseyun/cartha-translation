id: 1PE.2.9
reference: 1 Peter 2:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: yo
  text: Ṣùgbọ́n ẹ̀yin jẹ́ àwọn ènìyàn àyànfẹ́[a], ẹgbẹ́ àlùfáà ọba, orílẹ̀-èdè mímọ́, àwọn ènìyàn tí ó jẹ́ ìní Ọlọ́run, kí ẹ lè kéde àwọn ìwà rere[b] ẹni tí ó pè yín jáde láti inú òkùnkùn sínú ìmọ́lẹ̀ àgbàyanu rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìran àyànfẹ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìran, ẹ̀yà, tàbí àwùjọ ènìyàn; a lo “àwọn ènìyàn” níbí kí ó má baà dà bí ẹni pé ẹ̀yà tàbí ìran ẹ̀jẹ̀ ni a ń tẹnumọ́.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ohun ìyìn” tàbí “àwọn iṣẹ́ agbára.” Ọ̀rọ̀ Gíríìkì lè tọ́ka sí àwọn ànímọ́ rere tí ó yẹ fún ìyìn àti sí àwọn iṣẹ́ tí ń fi wọn hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: Ṣùgbọ́n ẹ̀yin
  rationale: “Ṣùgbọ́n” fi ìyàtọ̀ sí ohun tí ó ṣáájú hàn, “ẹ̀yin” sì pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́.
- source_word: γένος ἐκλεκτόν
  choice: àwọn ènìyàn àyànfẹ́
  rationale: Èyí pa ìtumọ̀ àwùjọ tí Ọlọ́run yàn mọ́, láì mú kí òǹkàwé ronú ní pàtàkì nípa ẹ̀yà tàbí ìran ẹ̀jẹ̀. Àṣàyàn tí ó sún mọ́ ọ̀rọ̀ náà jù, “ìran àyànfẹ́,” wà ní àlàyé ìsàlẹ̀.
- source_word: βασίλειον ἱεράτευμα
  choice: ẹgbẹ́ àlùfáà ọba
  rationale: Gbólóhùn kúkúrú yìí pa àpapọ̀ èrò ti ọba àti ti iṣẹ́ àlùfáà mọ́, ó sì bá ìṣọ̀kan orúkọ-àpèjúwe Gíríìkì mu láì tú u sí “ìjọba àwọn àlùfáà.”
- source_word: ἔθνος ἅγιον
  choice: orílẹ̀-èdè mímọ́
  rationale: Ìtumọ̀ tààrà yìí pa èrò orílẹ̀-èdè tí a yà sọ́tọ̀ fún Ọlọ́run mọ́.
- source_word: λαὸς εἰς περιποίησιν
  choice: àwọn ènìyàn tí Ọlọ́run ní fún ara rẹ̀
  rationale: Ọ̀rọ̀ περιποίησις tọ́ka sí jíjẹ́ ìní àkànṣe. Dídárúkọ Ọlọ́run mú ẹni tí àwọn ènìyàn náà jẹ́ tirẹ̀ ṣe kedere ní Yorùbá, gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: ὅπως
  choice: kí ẹ lè
  rationale: Ó fi ète tàbí ìdí tí Ọlọ́run fi yan wọn hàn ní Yorùbá àdánidá.
- source_word: τὰς ἀρετὰς
  choice: àwọn ìtayọlọ́lá
  rationale: Àṣàyàn yìí gbìmọ̀ láti pa fífẹ̀ ìtumọ̀ ọ̀rọ̀ Gíríìkì mọ́—ohun rere àti ohun ológo tí ó yẹ fún ìyìn—láì dín in kù sí ìwà rere nìkan tàbí iṣẹ́ agbára nìkan.
- source_word: ἐξαγγείλητε
  choice: kí ẹ lè kéde
  rationale: “Kéde” fi hàn pé wọ́n ń sọ ọ́ jáde ní gbangba, ó sì bá agbára ọ̀rọ̀ Gíríìkì mu.
- source_word: τοῦ ... καλέσαντος
  choice: ẹni tí ó pè yín
  rationale: Èyí pa ọ̀nà tí Gíríìkì gbà dá Ọlọ́run mọ̀ nípasẹ̀ iṣẹ́ ìpè rẹ̀ mọ́, láì tún orúkọ Ọlọ́run ṣe láìnídìí.
- source_word: ἐκ σκότους ... εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: jáde láti inú òkùnkùn sínú ìmọ́lẹ̀ àgbàyanu rẹ̀
  rationale: Ó pa àwòrán ìṣípò kúrò ní agbègbè òkùnkùn wọ inú ìmọ́lẹ̀ mọ́; “àgbàyanu” sì mú ìtumọ̀ θαυμαστόν jáde ní èdè ọlọ́lá tí ó ṣeé lóye.
theological_decisions:
- issue: Àwọn orúkọ ìdánimọ̀ àwùjọ tí a mú láti inú èdè májẹ̀mú nípa Ísírẹ́lì
  choice: A pa “àwọn ènìyàn àyànfẹ́,” “ẹgbẹ́ àlùfáà ọba,” àti “orílẹ̀-èdè mímọ́” mọ́ gẹ́gẹ́ bí àkọlé àwùjọ tààrà.
  alternative: Ṣí wọn tú sí àpèjúwe àkàwé tàbí sọ wọ́n di èrò lásán.
  rationale: Ẹsẹ̀ náà fúnra rẹ̀ lo àwọn àkọlé májẹ̀mú wọ̀nyí fún àwọn tí Pétérù ń kọ̀wé sí. Ìtumọ̀ náà kò yẹ kí ó rẹ agbára wọn sílẹ̀, bẹ́ẹ̀ ni kò yẹ kí ó fi ètò ẹ̀kọ́ ìsìn kan tí ẹsẹ̀ náà kò sọ kún un.
- issue: Ẹni tí λαὸς εἰς περιποίησιν jẹ́ ìní rẹ̀
  choice: 'A sọ Ọlọ́run ní gbangba: “àwọn ènìyàn tí Ọlọ́run ní fún ara rẹ̀.”'
  alternative: “Àwọn ènìyàn fún ìní” tàbí “àwọn ènìyàn tí ó ní fún ara rẹ̀.”
  rationale: Gíríìkì kò tún αὐτοῦ sọ nínú gbólóhùn yìí, ṣùgbọ́n àyíká ọ̀rọ̀ fi ẹni tó ní wọn hàn. Yorùbá nílò ìṣàlàyé díẹ̀ yìí kí ìtọ́kasí má bà a ṣókùnkùn; kò fi ẹ̀kọ́ mìíràn kún ọ̀rọ̀ náà.
- issue: Ìwọ̀n ìtumọ̀ τὰς ἀρετὰς
  choice: A lo “àwọn ìtayọlọ́lá” nínú ẹsẹ̀, a sì fi “àwọn ohun ìyìn” àti “àwọn iṣẹ́ agbára” sí àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ohun tí ó tún ṣeé túmọ̀ sí.
  alternative: Yan ìyìn nìkan tàbí iṣẹ́ agbára nìkan gẹ́gẹ́ bí ìtumọ̀ pàtó.
  rationale: Ọ̀rọ̀ náà lè tọ́ka sí àwọn ànímọ́ Ọlọ́run tí ó yẹ fún ìyìn àti sí ìṣe rẹ̀ tí ń fi wọn hàn. Ìtumọ̀ gbọ́dọ̀ pa fífẹ̀ yìí mọ́ dípò kí ó yanjú rẹ̀ ní ìkọ̀kọ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye ní gbangba. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Àwọn gbólóhùn àwùjọ ni a pa mọ́ láti fara wé ìṣètò àti ìlù ẹsẹ̀ Gíríìkì, ṣùgbọ́n a yẹra fún ọ̀rọ̀ tí ó lè fà ìtumọ̀ ẹ̀yà òde òní wọ inú γένος.
