review_pass:
  verdict: revise
  source_fidelity: The draft preserves the Greek contrast, the four covenantal corporate descriptions, the purpose clause, the public force of ἐξαγγείλητε, and the movement from darkness into God's marvelous light. Explicitly naming God as the possessor is contextually warranted. The rendering of τὰς ἀρετὰς, however, needs revision because “ìtayọlọ́lá” is not natural, established Standard Yoruba usage and obscures the source term.
  naturalness: Most of the verse is clear and dignified Standard Yoruba. “Àwọn ìtayọlọ́lá” is awkward and likely opaque to ordinary readers. “Àwọn ìwà rere” is idiomatic and is the established Yoruba biblical expression for praiseworthy qualities; the footnote can retain the possible reference to mighty deeds.
  terminology: “Àwọn ènìyàn àyànfẹ́,” “ẹgbẹ́ àlùfáà ọba,” and “orílẹ̀-èdè mímọ́” appropriately preserve the corporate titles. “Àwọn ènìyàn tí ó jẹ́ ìní Ọlọ́run” is more natural and precise than “àwọn ènìyàn tí Ọlọ́run ní fún ara rẹ̀,” while retaining the possession sense of λαὸς εἰς περιποίησιν.
  issues:
  - severity: medium
    issue: “Àwọn ìtayọlọ́lá” is unnatural and semantically opaque.
    rationale: This coined or highly unusual expression does not communicate τὰς ἀρετὰς naturally in modern Standard Yoruba. “Àwọn ìwà rere” clearly expresses praiseworthy excellencies; the accompanying note preserves the broader contextual possibility of praiseworthy deeds.
  - severity: low
    issue: “Àwọn ènìyàn tí Ọlọ́run ní fún ara rẹ̀” is less idiomatic than an explicit possession construction.
    rationale: Although understandable, “ní fún ara rẹ̀” is cumbersome. “Tí ó jẹ́ ìní Ọlọ́run” naturally conveys that the people belong to God without adding meaning.
  revised_text: Ṣùgbọ́n ẹ̀yin jẹ́ àwọn ènìyàn àyànfẹ́[a], ẹgbẹ́ àlùfáà ọba, orílẹ̀-èdè mímọ́, àwọn ènìyàn tí ó jẹ́ ìní Ọlọ́run, kí ẹ lè kéde àwọn ìwà rere[b] ẹni tí ó pè yín jáde láti inú òkùnkùn sínú ìmọ́lẹ̀ àgbàyanu rẹ̀.
