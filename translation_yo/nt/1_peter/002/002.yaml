id: 1PE.2.2
reference: 1 Peter 2:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: yo
  text: Bí àwọn ọmọ ọwọ́ tí a ṣẹ̀ṣẹ̀ bí, ẹ máa fi taratara fẹ́ wàrà mímọ́ ti ẹ̀mí[a], kí ẹ lè dàgbà nípasẹ̀ rẹ̀ sí ìgbàlà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “ti ẹ̀mí” tún lè túmọ̀ sí “ti ọgbọ́n” tàbí “tí ó bá èrò inú mu.” “Mímọ́” níbí túmọ̀ sí wàrà tí a kò fi ohun mìíràn dàpọ̀. Níhìn-ín, ó ṣeé ṣe kó ń tọ́ka sí oúnjẹ inú tàbí ti ẹ̀mí dípò wàrà gidi.
    reason: lexical_alternative
  - marker: b
    text: Àwọn ìwé àfọwọ́kọ kan kò ní “sí ìgbàlà.”
    reason: textual_variant
lexical_decisions:
- source_word: ὡς
  choice: Bí
  rationale: Ó mú àfiwé wọlé, kì í ṣe pé àwọn olùgbọ́ náà jẹ́ ọmọ ọwọ́ ní ti gidi.
- source_word: ἀρτιγέννητα βρέφη
  choice: àwọn ọmọ ọwọ́ tí a ṣẹ̀ṣẹ̀ bí
  rationale: Ó pa ìtumọ̀ pé ìbí wọn ṣẹ̀ṣẹ̀ ṣẹlẹ̀ mọ́, ó sì jẹ́ èdè Yorùbá tó ṣe kedere.
- source_word: τὸ λογικὸν
  choice: ti ẹ̀mí
  rationale: Nínú àkàwé wàrà yìí, ó tọ́ka sí oúnjẹ inú tàbí ti ẹ̀mí, kì í ṣe wàrà gidi. Àlàyé ìsàlẹ̀ pa ìtumọ̀ tó sún mọ́ ‘ti ọgbọ́n’ mọ́ nítorí ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ tó gbòòrò.
- source_word: ἄδολον
  choice: aláìlábùlà
  rationale: Ó túmọ̀ sí ohun tí a kò fi ohun mìíràn dàpọ̀ mọ́, tí kò sì ní ẹ̀tàn; ‘aláìlábùlà’ bá àwòrán wàrà mu dáadáa.
- source_word: γάλα
  choice: wàrà
  rationale: Ó pa àkàwé oúnjẹ tó ń mú ẹni dàgbà mọ́.
- source_word: ἐπιποθήσατε
  choice: ẹ máa fi taratara fẹ́
  rationale: Ó jẹ́ àṣẹ láti ní ìfẹ́ tó lágbára sí ohun náà, láìlo ọ̀rọ̀ àsọdùn tí kò bá èdè Yorùbá mu.
- source_word: ἵνα
  choice: kí
  rationale: Ó fi ète tàbí àbájáde tí a ń retí hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ἐν αὐτῷ
  choice: nípasẹ̀ rẹ̀
  rationale: Arọ́pò-orúkọ náà ń tọ́ka padà sí wàrà, ó sì fi wàrà náà hàn gẹ́gẹ́ bí ohun èlò ìdàgbàsókè.
- source_word: αὐξηθῆτε
  choice: ẹ lè ... dàgbà
  rationale: Ó sọ ìdàgbàsókè tí wàrà náà ń mú wá; Yorùbá kò nílò kí a fi ìṣe àfaradà Gíríìkì náà hàn ní ọ̀nà líle.
- source_word: εἰς σωτηρίαν
  choice: sí ìgbàlà
  rationale: Ó pa ìtọ́sọ́nà sí ibi-afẹ́, ìyẹn ìgbàlà, mọ́ láìfi èrò ẹ̀kọ́ ìsìn kan pàtó kún un.
theological_decisions:
- issue: Ìtumọ̀ λογικός nínú àkàwé ‘wàrà’
  choice: ti ẹ̀mí
  alternative: ti ọgbọ́n; tí ó bá èrò inú mu
  rationale: ‘Ti ẹ̀mí’ mú kí ó ṣe kedere pé wàrà àkàwé ni, ṣùgbọ́n àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ ọ̀rọ̀ Gíríìkì tó ní í ṣe pẹ̀lú ọgbọ́n tàbí inú ènìyàn má bàjẹ́.
- issue: Agbára ọ̀rọ̀ εἰς σωτηρίαν
  choice: dàgbà sí ìgbàlà
  alternative: dàgbà nínú ìgbàlà; dàgbà fún ìgbàlà
  rationale: Èyí pa ìrìn sí ibi-afẹ́ tí εἰς ń fi hàn mọ́, láìdáhùn ní ọ̀nà ẹ̀kọ́ ìsìn bóyá a ń sọ nípa ìgbàlà ìsinsìnyí tàbí ìmúṣẹ rẹ̀ ní ọjọ́ iwájú.
- issue: Ìyàtọ̀ inú àwọn ẹ̀dà ní εἰς σωτηρίαν
  choice: Fi ‘sí ìgbàlà’ sínú ọ̀rọ̀ àkọ́kọ́
  alternative: Má fi gbolohun náà sí i
  rationale: Ẹ̀dà SBLGNT tí a lò ní gbolohun náà, àwọn ẹ̀rí ìwé àfọwọ́kọ pàtàkì sì ń ti i lẹ́yìn, bí ó tilẹ̀ jẹ́ pé àwọn ẹ̀dà kan kò ní in.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, ó ṣe kedere, ó sì yẹ fún kíkà ní gbangba. ‘Ọmọ ọwọ́’ àti ‘fi taratara fẹ́’ jẹ́ ọ̀rọ̀ òde òní tí ọ̀pọ̀ ènìyàn lóye, láìsọ ẹsẹ náà di èdè ojoojúmọ́ jù.
