review_pass:
  verdict: revise
  source_fidelity: 'Àwọn èrò pàtàkì nínú ẹsẹ̀ náà wà nínú ìtumọ̀ náà: ẹ̀rí Ìwé Mímọ́, òkúta igun tí a yàn tí ó níyì, ìgbàgbọ́ nínú rẹ̀, àti ìdènà ìtìjú pẹ̀lú ìtẹnumọ́. Ṣùgbọ́n ipò “lélẹ̀” nínú àwòkọ́ṣe náà lè jẹ́ kí ó dà bí ẹni pé “tí ó níyì” ni a ‘lélẹ̀,’ dípò òkúta náà. Bákan náà, “ojú kì yóò tì í” kò dáa gẹ́gẹ́ bí ìsọ̀rọ̀ Yorùbá fún καταισχυνθῇ; olùgbọ́/ẹni tí ó gbàgbọ́ ni kò ní tijú.'
  naturalness: “Ẹni tí ó bá gbà á gbọ́ kì yóò tijú láéláé” jẹ́ ìsọ̀rọ̀ Yorùbá ìgbàlódé tí ó mọ́, ó sì fi ìtumọ̀ ìtìjú àti ìtẹnumọ́ οὐ μὴ hàn ní kedere. Gbigbé “lélẹ̀” sẹ́yìn àwọn àpèjúwe òkúta náà tún mú kí gbolohun náà ṣàn dáadáa.
  terminology: “Òkúta igun ilé,” “a yàn,” àti “níyì” jẹ́ àwọn ọ̀rọ̀ tó yẹ fún λίθον ἀκρογωνιαῖον, ἐκλεκτόν, àti ἔντιμον. “Gbà á gbọ́” ń jẹ́ kí ìtọ́kasí αὐτῷ má ṣe di ohun tàbí ẹni ní tipátipá; àlàyé ẹsẹ̀-isàlẹ̀ yẹ kí ó sọ àìdájú yẹn ní kedere láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un.
  issues:
  - severity: medium
    issue: “lélẹ̀” wà lẹ́yìn “tí ó sì níyì.”
    rationale: Ìpò rẹ̀ lè so “lélẹ̀” mọ́ àpèjúwe tó kẹ́yìn, nígbà tí τίθημι ń ṣàpèjúwe ìfí òkúta náà lélẹ̀. Gbigbé e sí òpin ìṣàpèjúwe òkúta ń mú ìbáṣepọ̀ gírámà hàn.
  - severity: medium
    issue: “ojú kì yóò tì í láé” kò jẹ́ ìtúmọ̀ Yorùbá tó péye fún ‘will not be put to shame.’
    rationale: Kì í ṣe ojú ẹni ni Yorùbá sábà máa ń ‘tì’ ní ìtumọ̀ yìí; “kì yóò tijú láéláé” sọ ìtìjú olùgbọ́ náà ní tààrà, ó sì pa ìtẹnumọ́ odi Gíríìkì mọ́.
  - severity: low
    issue: Ẹsẹ̀-isàlẹ̀ c kò ṣàlàyé ìṣeeṣe ìtọ́kasí sí òkúta náà ní ọ̀nà tó pé, ó sì sọ ìlò Kristi gẹ́gẹ́ bí ìpinnu.
    rationale: Àrọ́pò-orúkọ Gíríìkì náà lè tẹ̀lé àwòrán ‘òkúta’; ní àyíká Pétérù a tún lè lóye rẹ̀ nípa ti Kristi. Àlàyé náà yẹ kí ó fi àwọn ìṣeeṣe méjèèjì sílẹ̀.
