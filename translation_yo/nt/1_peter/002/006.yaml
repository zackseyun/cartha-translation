id: 1PE.2.6
reference: 1 Peter 2:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: yo
  text: 'Nítorí ó wà nínú Ìwé Mímọ́ pé:[a]


    “Wò ó, mo fi òkúta igun ilé kan tí a yàn, tí ó sì níyì,[b] lélẹ̀ ní Síónì;

    ẹni tí ó bá gbà á gbọ́[c] kì yóò tijú láéláé.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Ìwé Mímọ́ sọ pé.” Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní ti gidi sí ohun bíi, “ó wà nínú Ìwé Mímọ́.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí ó sì ṣeyebíye.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí iyì tàbí iye gíga.
    reason: lexical_alternative
  - marker: c
    text: Nínú àyọlò náà, arọ́pò-orúkọ náà lè tọ́ka sí òkúta náà. Ní àyíká 1 Pétérù 2:4–8, a tún lè lóye àwòrán òkúta náà nípa ti Kristi.
    reason: alternative_reading
  - marker: d
    text: 'Ọ̀rọ̀ Gíríìkì náà fi ìdánilójú líle hàn: “kì yóò tijú rárá” tàbí “kì yóò tijú láéláé.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Nítorí
  rationale: Ó ń mú ẹ̀rí Ìwé Mímọ́ wá láti ṣàlàyé àti láti fi ohun tí ó ṣáájú múlẹ̀.
- source_word: περιέχει ἐν γραφῇ
  choice: ó wà nínú Ìwé Mímọ́ pé
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tí ó ṣeé lóye fún ọ̀rọ̀ Gíríìkì tí ó túmọ̀ ní ti gidi pé ohun náà wà nínú Ìwé Mímọ́; kò sọ ọ́ di gbólóhùn lasan pé ‘Ìwé Mímọ́ sọ pé.’
- source_word: Ἰδοὺ
  choice: Wò ó
  rationale: Ó pa agbára ọ̀rọ̀ àsọtẹ́lẹ̀ tí ń pe olùgbọ́ láti fiyè sí ohun tí ń bọ̀ mọ́, ní èdè Yorùbá àdánidá.
- source_word: τίθημι
  choice: mo fi … lélẹ̀
  rationale: Èyí bá àwòrán iṣẹ́ ìkọ́lé mu, níbi tí a ti ń fi òkúta pàtàkì lélẹ̀.
- source_word: λίθον ἀκρογωνιαῖον
  choice: òkúta igun ilé
  rationale: Ó sọ iṣẹ́ òkúta náà nínú ilé ní kedere, ó sì jẹ́ ọ̀rọ̀ Yorùbá tí ó rọrùn láti lóye.
- source_word: ἐκλεκτὸν
  choice: tí a yàn
  rationale: Ó pa ìtumọ̀ yíyan òkúta náà mọ́ láìfi èrò ẹ̀kọ́ ìsìn mìíràn kún un.
- source_word: ἔντιμον
  choice: tí ó sì níyì
  rationale: Ó tẹnu mọ́ iyì àti ọlá, bí ọ̀rọ̀ Gíríìkì ṣe lè túmọ̀ sí, ó sì bá àkòrí iyì nínú àyíká ẹsẹ̀ náà mu.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: ẹni tí ó bá gbà á gbọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún gbígbà ẹnìkan gbọ́; arọ́pò-orúkọ ‘á’ tún jẹ́ kí àwòrán òkúta àti lílo rẹ̀ fún Kristi wà ní ìṣọ̀kan.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: ojú kì yóò tì í láé
  rationale: Àsọjáde Yorùbá yìí fi ìtìjú hàn ní kedere, ‘láé’ sì ń gbé àìsẹ̀lẹ̀ tí Gíríìkì tẹnu mọ́ jáde.
theological_decisions:
- issue: Ohun tàbí ẹni tí αὐτῷ ń tọ́ka sí
  choice: “gbà á gbọ́,” tí ó lè tọ́ka sí ẹni tí òkúta dúró fún
  alternative: “gbà á gbọ́” gẹ́gẹ́ bí títọ́ka sí òkúta nìkan, tàbí fífi “gbọ́kàn lé e” rọ́pò rẹ̀
  rationale: Àwòrán tí a fa yọ sọ̀rọ̀ nípa òkúta, ṣùgbọ́n àyíká 1 Pétérù 2:4–8 ń lo òkúta náà fún Kristi. Arọ́pò-orúkọ Yorùbá kò fi tipátipá yan ọ̀kan lára àwọn méjèèjì, nígbà tí ‘gbà á gbọ́’ ń jẹ́ kí ìtọ́kasí sí ẹni hàn dáadáa.
- issue: Ìbáṣepọ̀ ἀκρογωνιαῖον, ἐκλεκτὸν, àti ἔντιμον
  choice: “òkúta igun ilé kan tí a yàn, tí ó sì níyì”
  alternative: “òkúta igun ilé kan, àyànfẹ́ àti olówó iyebíye”
  rationale: Àṣàyàn náà pa gbogbo àwọn àpèjúwe mẹ́tẹ̀ẹ̀ta mọ́, ó sì ṣàn bí Yorùbá àdánidá. ‘Níyì’ pa ìtumọ̀ ọlá mọ́ láìpa ìtumọ̀ iye rẹ́ kúrò pátápátá.
translation_notes:
  register: A lo Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì ṣeé lóye fún gbogbo ènìyàn. “Wò ó” pa ohùn àsọtẹ́lẹ̀ mọ́; “òkúta igun ilé” mú àwòrán iṣẹ́ ìkọ́lé ṣe kedere; “ojú kì yóò tì í láé” jẹ́ àṣà Yorùbá àdánidá fún ìtìjú pẹ̀lú ìtẹnumọ́ líle.
