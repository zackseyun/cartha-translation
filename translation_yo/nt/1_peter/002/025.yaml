id: 1PE.2.25
reference: 1 Peter 2:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: yo
  text: Nítorí tẹ́lẹ̀, ẹ dàbí àgùntàn tí ń ṣìnà[a], ṣùgbọ́n nísinsìnyí ẹ ti padà[b] sọ́dọ̀ Olùṣọ́-àgùntàn àti Alábòójútó[c] ọkàn yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “tí ń rìn káàkiri” tàbí “tí a ń mú ṣìnà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ẹ ti yípadà”; ọ̀rọ̀ Gíríìkì náà tún lè túmọ̀ sí, “a ti mú yín padà.”
    reason: alternative_reading
  - marker: c
    text: Tàbí “Olùdábòbò”; ní ìtumọ̀ ìbílẹ̀, “Bíṣọ́ọ̀bù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: Nítorí tẹ́lẹ̀, ẹ̀yin dàbí
  rationale: “Nítorí” so ẹsẹ̀ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí ìdí rẹ̀. “Tẹ́lẹ̀” mú ipò wọn ní àtijọ́ hàn ní Yorùbá àdánidá, ní ìyàtọ̀ sí “nísinsìnyí.”
- source_word: ὡς πρόβατα
  choice: bí àgùntàn
  rationale: “Bí” fi àfiwé hàn, “àgùntàn” sì lè dúró fún ẹyọ kan tàbí ọ̀pọ̀ nínú Yorùbá láìfi àmì ọ̀pọ̀ kún un.
- source_word: πλανώμενοι
  choice: tí ń ṣìnà
  rationale: Ó pa àwòrán àgùntàn tí ó ń ṣìnà mọ́, láìpinnu bóyá wọ́n ṣìnà fúnra wọn tàbí ẹlòmíràn mú wọn ṣìnà.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: ṣùgbọ́n nísinsìnyí ẹ ti padà
  rationale: Ó sọ ìyípadà tí ó ti ṣẹlẹ̀ tí ó sì ní ipa títí di ìsinsìnyí. Àkọ́lé ìsàlẹ̀ ṣàfihàn pé a tún lè lóye ọ̀rọ̀ Gíríìkì náà pẹ̀lú ìtumọ̀ ààyè gbígba.
- source_word: ἐπὶ τὸν ποιμένα
  choice: sọ́dọ̀ Olùṣọ́-àgùntàn
  rationale: “Sọ́dọ̀” jẹ́ ọ̀nà àdánidá láti sọ ìpadà tọ ẹni kan wá; “Olùṣọ́-àgùntàn” pa àwòrán ποιμήν mọ́ gẹ́gẹ́ bí orúkọ oyè fún Kristi.
- source_word: καὶ ἐπίσκοπον
  choice: àti Alábòójútó
  rationale: “Alábòójútó” túmọ̀ sí ẹni tí ń ṣọ́, tí ń bojú tó, ó sì yẹra fún fífi ètò ipò ìjọ ti àkókò tó tẹ̀ lé e sínú ẹsẹ̀ náà.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: ọkàn yín
  rationale: “Ọkàn” jẹ́ ọ̀rọ̀ Yorùbá tí ó bójú mu ní àyíká ìtọ́jú inú àti ti ẹ̀mí, láìdá ψυχή pọ̀ mọ́ πνεῦμα (“ẹ̀mí”).
theological_decisions:
- issue: Lílo ἐπίσκοπος gẹ́gẹ́ bí orúkọ oyè fún Kristi
  choice: Alábòójútó
  alternative: Olùdábòbò; Bíṣọ́ọ̀bù
  rationale: Àṣàyàn yìí pa iṣẹ́ ẹni tí ń ṣọ́ tí ó sì ń bojú tó mọ́, ṣùgbọ́n kò gbé ètò ìṣàkóso ìjọ kankan wọ inú ọ̀rọ̀ náà.
- issue: Ìró ohùn ἐπεστράφητε
  choice: ẹ ti padà
  alternative: a ti mú yín padà
  rationale: Fọ́ọ̀mù Gíríìkì náà lè ní ìró ààyè gbígba, ṣùgbọ́n ó tún sábà máa ń ṣiṣẹ́ bí ọ̀rọ̀ aláìlábùkù tó túmọ̀ sí “padà.” Àkọ́lé ìsàlẹ̀ pa méjèèjì sílẹ̀ láìyanju ìforígbárí láàárín iṣẹ́ Ọlọ́run àti ìdáhùn ènìyàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé gbogbogbò. A lo “tẹ́lẹ̀” àti “nísinsìnyí” láti mú ìyàtọ̀ àkókò inú gbolohun Gíríìkì hàn ní Yorùbá àdánidá.
