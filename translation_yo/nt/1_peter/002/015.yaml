id: 1PE.2.15
reference: 1 Peter 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: yo
  text: 'Nítorí èyí ni ìfẹ́ Ọlọ́run: pé nípa ṣíṣe rere, kí ẹ mú àìmọ̀kan àwọn ènìyàn aláìgbọ́n dákẹ́[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kí ẹ di àìmọ̀kan àwọn ènìyàn aláìgbọ́n lẹ́nu.” Ọ̀rọ̀ náà túmọ̀ ní tààràtà sí “dí ẹnu,” bí a ṣe ń fi ìdènà sí ẹnu ẹranko; níbí, àkàwé ni fún dídá ọ̀rọ̀ àtakò dúró.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó ń fi ìdí fún ìṣílétí tó ṣáájú hàn; ‘Nítorí’ jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ ìdí náà ní Yorùbá.
- source_word: οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ
  choice: èyí ni ìfẹ́ Ọlọ́run
  rationale: Gbólóhùn yìí tọ́ka sí ọ̀nà ṣíṣe rere tí a mẹ́nu kàn; ‘èyí ni ìfẹ́ Ọlọ́run’ ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: ἀγαθοποιοῦντας
  choice: nípa ṣíṣe rere
  rationale: Ọ̀rọ̀ àìpẹ̀yà yìí ń fi ọ̀nà tàbí ohun èlò tí a fi máa mú wọn dákẹ́ hàn.
- source_word: φιμοῦν
  choice: mú ... dákẹ́
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gidi rẹ̀ ni fífi ìdènà sí ẹnu ẹranko, níbí ó jẹ́ àkàwé fún dídá ọ̀rọ̀ àtakò dúró.
- source_word: ἀγνωσίαν
  choice: àìmọ̀kan
  rationale: Ó túmọ̀ sí àìní ìmọ̀ tàbí àìlóye, pàápàá irú èyí tó bá ìwà òmùgọ̀ mu.
- source_word: ἀφρόνων ἀνθρώπων
  choice: àwọn ènìyàn aláìgbọ́n
  rationale: ‘Àwọn ènìyàn’ pa ìtọ́kasí gbogbogbò mọ́ láì fi sí ọkùnrin nìkan; ‘aláìgbọ́n’ fi ìtumọ̀ òmùgọ̀ tàbí aláìní làákàyè hàn ní ọ̀nà ọ̀wọ̀.
theological_decisions:
- issue: Ìtọ́kasí akọ tàbí abo nínú ἀνθρώπων
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí àwọn ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn nítorí àyíká ọ̀rọ̀ náà.
