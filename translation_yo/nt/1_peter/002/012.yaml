id: 1PE.2.12
reference: 1 Peter 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: yo
  text: Ẹ máa jẹ́ kí ìwà yín dára láàárín àwọn tí kì í ṣe Júù, kí, nínú ọ̀ràn tí wọ́n fi ń sọ̀rọ̀ burúkú sí yín gẹ́gẹ́ bí àwọn olùṣe búburú, nípa kíyè sí ìṣe rere yín, wọ́n lè yin Ọlọ́run lógo ní ọjọ́ ìbẹ̀wò.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọjọ́ ìbẹ̀wò” lè tọ́ka sí ọjọ́ tí Ọlọ́run bá wá láti ṣàyẹ̀wò, láti gbà ènìyàn là, tàbí láti dájọ́; ọ̀rọ̀ Gíríìkì kò pinnu ìtumọ̀ kan ṣoṣo níbí.
    reason: Láti pa àìdánilójú gidi inú ἐπισκοπή mọ́, kí a má sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan lé e lórí.
lexical_decisions:
- source_word: ἀναστροφή
  choice: hùwà
  rationale: Ó túmọ̀ sí ìgbésí ayé tàbí ìwà ẹni lápapọ̀; ọ̀rọ̀-ìṣe ‘hùwà’ jẹ́ èdè Yorùbá àdánidá nínú àṣẹ yìí.
- source_word: τὰ ἔθνη
  choice: àwọn aláìkọlà
  rationale: Nínú àyíká lẹ́tà yìí, ó ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù, àwọn tí wọ́n wà lẹ́yìn òde àwùjọ májẹ̀mú; yíyan yìí dá ìyàtọ̀ náà mọ́ láìlo ọ̀rọ̀ àtijọ́ tí kò ṣe kedere.
- source_word: καλήν / καλῶν
  choice: tó dára / rere
  rationale: Àwọn ọ̀rọ̀ méjèèjì dá lórí καλός, wọ́n sì ní ìtumọ̀ ohun tó dára, tó lẹ́wà ní ti ìwà, tó sì yẹ fún ìyìn.
- source_word: καταλαλοῦσιν
  choice: ń sọ̀rọ̀ burúkú sí
  rationale: Ó mú ìtumọ̀ sísọ ẹni lẹ́yìn tàbí fífi ọ̀rọ̀ búburú kan án jáde ní èdè Yorùbá tó ṣe kedere.
- source_word: ἐποπτεύοντες
  choice: nígbà tí wọ́n bá rí
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwo tàbí kíyèsí ohun pẹ̀lú ojú ara ẹni; ‘rí’ bá èdè Yorùbá mu, ó sì dá ẹ̀rí ojú náà mọ́.
- source_word: δοξάσωσι
  choice: yin ... lógo
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún fífi ògo fún Ọlọ́run, kì í ṣe yíyí Ọlọ́run padà sí ẹni ológo.
- source_word: ἐπισκοπή
  choice: ìbẹ̀wò
  rationale: Ó pa ìtumọ̀ ìbẹ̀wò tàbí wíwá láti ṣàyẹ̀wò mọ́, láì pinnu bóyá ìbẹ̀wò náà jẹ́ fún ìgbàlà tàbí ìdájọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘ọjọ́ ìbẹ̀wò’
  choice: ní ọjọ́ ìbẹ̀wò rẹ̀
  alternative: ní ọjọ́ tí Ọlọ́run bá bẹ̀ wọ́n wò / ní ọjọ́ ìdájọ́
  rationale: Gíríìkì ἐν ἡμέρᾳ ἐπισκοπῆς kò sọ ní pàtó bóyá ìbẹ̀wò náà mú àánú, ìgbàlà, tàbí ìdájọ́ wá. A pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Ìbáṣepọ̀ gbolohun ‘ἐν ᾧ’
  choice: nínú ohun tí wọ́n ti ń sọ̀rọ̀ burúkú sí yín
  alternative: bí ó tilẹ̀ jẹ́ pé wọ́n ń sọ̀rọ̀ burúkú sí yín
  rationale: A tẹ̀ lé ìṣètò Gíríìkì tó túmọ̀ ní tààrà sí ‘nínú ohun tí,’ kí a má bàa sọ ọ́ di ìyàtọ̀ lasan tí ọ̀rọ̀ orísun kò fi hàn ní kedere.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì, tó sì rọrùn fún òǹkàwé òde òní. A lo àṣẹ ‘Ẹ máa hùwà’ láti mú ìlànà tó ń bá a lọ hàn. Àmì ohùn wà níbi tó yẹ.
