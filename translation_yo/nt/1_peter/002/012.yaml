  source_fidelity: Àwọn àtúnṣe jẹ́ dandan fún ìbámu pẹ̀lú Gíríìkì. τὰ ἔθνη túmọ̀ sí àwọn orílẹ̀-èdè/Àwọn tí kì í ṣe Júù nínú àyíká yìí, kì í ṣe ‘àwọn aláìkọlà.’ Bákan náà, κακοποιῶν ni ‘àwọn olùṣe búburú,’ kì í ṣe ‘ẹlẹ́ṣẹ̀.’ A pa ìtumọ̀ ‘nínú ọ̀ràn tí’ fún ἐν ᾧ mọ́, a sì pa àìdánilójú ἐπισκοπή mọ́ láì fi aṣojú-òun ‘rẹ̀’ tí kò sí nínú ọ̀rọ̀ Gíríìkì kún un.
  naturalness: Ọ̀rọ̀ tí a tún ṣe náà jẹ́ Yorùbá boṣewa, ó sì dáa fún ìwé mímọ́ òde òní. ‘Ẹ máa jẹ́ kí ìwà yín dára’ jẹ́ ọ̀nà àdánidá láti sọ àṣẹ náà; ‘nípa kíyè sí’ ń sọ ìwòye pẹ̀lú àfiyèsí tí ἐποπτεύοντες fi hàn.
  terminology: A lo ‘àwọn tí kì í ṣe Júù’ fún ἔθνη nítorí ó ṣe kedere fún òǹkàwé, ó sì yẹ sí àyíká lẹ́tà náà. A lo ‘àwọn olùṣe búburú’ fún κακοποιῶν, ‘ìṣe rere’ fún καλῶν ἔργων, àti ‘yin Ọlọ́run lógo’ fún δοξάσωσι τὸν θεόν. ‘Ọjọ́ ìbẹ̀wò’ pa ìtumọ̀ ἐπισκοπή tí ó ṣí sílẹ̀ mọ́.
