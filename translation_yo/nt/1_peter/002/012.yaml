revisions:
- from: Ẹ máa hùwà lọ́nà tó dára láàárín àwọn aláìkọlà, kí ó lè jẹ́ pé, nínú ohun tí wọ́n ti ń sọ̀rọ̀ burúkú sí yín bí ẹni pé ẹlẹ́ṣẹ̀ ni yín, nígbà tí wọ́n bá rí iṣẹ́ rere yín, wọn yóò yin Ọlọ́run lógo ní ọjọ́ ìbẹ̀wò rẹ̀.[a]
  to: Ẹ máa jẹ́ kí ìwà yín dára láàárín àwọn tí kì í ṣe Júù, kí, nínú ọ̀ràn tí wọ́n fi ń sọ̀rọ̀ burúkú sí yín gẹ́gẹ́ bí àwọn olùṣe búburú, nípa kíyè sí ìṣe rere yín, wọ́n lè yin Ọlọ́run lógo ní ọjọ́ ìbẹ̀wò.[a]
  rationale: 'A ṣe àtúnṣe àwọn ọ̀rọ̀ méjì tí wọ́n yí ìtumọ̀ orísun padà: ‘àwọn aláìkọlà’ di ‘àwọn tí kì í ṣe Júù,’ àti ‘ẹlẹ́ṣẹ̀’ di ‘àwọn olùṣe búburú.’ A tún mú ἐποπτεύοντες hàn síi nípa ‘nípa kíyè sí,’ a sì yọ ‘rẹ̀’ kúrò nínú ‘ọjọ́ ìbẹ̀wò’ kí ìtumọ̀ má ṣàfikún ohun tí Gíríìkì kò sọ. Àmì ìsẹ̀lẹ̀ [a] àti àlàyé rẹ̀ ṣì bá ara wọn mu.'
