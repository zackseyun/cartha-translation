id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: yo
  text: Òun fúnra rẹ̀ ni ó gbé àwọn ẹ̀ṣẹ̀ wa nínú ara rẹ̀ lórí igi[a], kí àwa, lẹ́yìn tí a ti kú sí àwọn ẹ̀ṣẹ̀, lè wà láàyè fún òdodo. Nípasẹ̀ ọgbẹ́ rẹ̀[b] ni a mú yín láradá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “lórí àgbélébùú.” Gíríìkì ní “lórí igi,” ó sì ṣeé ṣe kí ó ń rántí Diutarónómì 21:23.
    reason: alternative_reading
  - marker: b
    text: Tàbí “àmì tí ìnà fi sílẹ̀” tàbí “ọgbẹ́ ìgbẹ́.” Orúkọ ẹyọ tí Gíríìkì lò ń rántí Aísáyà 53:5.
    reason: lexical_alternative
  - marker: c
    text: A sọ ìwòsàn náà ní ọ̀nà gbígbòòrò níbí. Nínú àyíká rẹ̀, ó ní í ṣe pẹ̀lú àwọn ẹ̀ṣẹ̀ àti òdodo, ṣùgbọ́n ọ̀rọ̀ náà kò dín ìtumọ̀ rẹ̀ kù sí ìwòsàn ara nìkan tàbí ìwòsàn ẹ̀mí nìkan.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: gbé
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí gbígbé ohun sókè, fífi rú ẹbọ, tàbí gbígbé ẹrù. “Gbé àwọn ẹ̀ṣẹ̀ wa” jẹ́ èdè Yorùbá tó ṣe kedere, ó sì pa ìtumọ̀ gbígbé ẹ̀ṣẹ̀ àti ìrántí Aísáyà mọ́ láìfi ìtumọ̀ ẹbọ kan ṣoṣo lé e lórí.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: nínú ara rẹ̀
  rationale: Èyí fi hàn gbangba pé ìjìyà náà ṣẹlẹ̀ nínú ara rẹ̀ gan-an, láìsí àlàyé àfikún tí kò sí nínú Gíríìkì.
- source_word: ἐπὶ τὸ ξύλον
  choice: lórí igi
  rationale: ξύλον túmọ̀ sí igi tàbí ohun tí a fi igi ṣe. “Lórí igi” pa ọ̀rọ̀ orísun àti ìṣeéṣe ìtọ́ka sí Diutarónómì 21:23 mọ́; “àgbélébùú” jẹ́ ìtumọ̀ tó túbọ̀ ṣàlàyé ohun tí igi náà jẹ́.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: níwọ̀n bí a ti kú sí àwọn ẹ̀ṣẹ̀
  rationale: ἀπογίνομαι ń tọ́ka sí yíyapa pátápátá kúrò lọ́dọ̀ ohun kan. “Kú sí àwọn ẹ̀ṣẹ̀” jẹ́ ọ̀nà adayeba láti fi agbára ọ̀rọ̀ náà hàn, ó sì pa ọ̀pọ̀ “àwọn ẹ̀ṣẹ̀” inú Gíríìkì mọ́.
- source_word: τῇ δικαιοσύνῃ
  choice: fún òdodo
  rationale: Nínú ọ̀rọ̀ yìí, “fún òdodo” fi ìgbésí ayé tí a darí sí ṣíṣe ohun tó tọ́ hàn. Ó bá ìtumọ̀ ìwà rere ti δικαιοσύνη mu ju “ìdájọ́ òdodo” lọ ní àyíká ẹsẹ yìí.
- source_word: μώλωπι
  choice: ọgbẹ́
  rationale: μώλωψ jẹ́ ọgbẹ́ tàbí àmì ìlù tí lílù fi sílẹ̀. “Ọgbẹ́” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere, ó sì pa ẹyọ ọ̀rọ̀ náà àti ìrántí Aísáyà 53:5 mọ́.
- source_word: ἰάθητε
  choice: a mú yín láradá
  rationale: Èyí ṣe aṣojú àkókò àtijọ́ àti ohùn àfaragba ọ̀rọ̀ Gíríìkì. “Mú ... láradá” lè gba ìtumọ̀ ìwòsàn gbooro láìdín in kù sí àìsàn ara nìkan.
- source_word: αὐτὸς
  choice: Òun fúnra rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́. “Òun fúnra rẹ̀” mú ìtẹnumọ́ yẹn jáde ní Yorùbá adayeba.
theological_decisions:
- issue: Ìwọ̀n ìwòsàn nínú gbólóhùn ìkẹyìn
  choice: Pa ọ̀rọ̀ gbooro náà mọ́ pé “a mú yín láradá.”
  alternative: Ìwòsàn ara nìkan; tàbí ìwòsàn ẹ̀mí kúrò nínú ẹ̀ṣẹ̀ nìkan.
  rationale: Àyíká ẹsẹ náà dá lórí ẹ̀ṣẹ̀, òdodo àti ìjìyà Kristi, ṣùgbọ́n ọ̀rọ̀ náà kò fi ìwòsàn mọ́ apá kan ṣoṣo. Ìtumọ̀ náà kò yanju ohun tí orísun fi sílẹ̀ ní gbígbòòrò.
- issue: Bí a ṣe túmọ̀ ξύλον
  choice: Lo “igi” nínú ọ̀rọ̀ pàtàkì.
  alternative: Àgbélébùú.
  rationale: Ẹsẹ náà ń tọ́ka sí kíkàn Jesu mọ́ àgbélébùú, ṣùgbọ́n ξύλον, kì í ṣe σταυρός, ni Gíríìkì lò. “Igi” pa ọ̀rọ̀ orísun àti ìtọ́ka Ìwé Mímọ́ tó ṣeé ṣe mọ́.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn níbi tí ó bá yẹ, pẹ̀lú èdè ọlọ́lá tó ṣe kedere fún òǹkàwé òde òní. Gbólóhùn “níwọ̀n bí a ti kú sí àwọn ẹ̀ṣẹ̀” pa àjọṣe ìdí inú ẹsẹ náà mọ́, “máa wà láàyè fún òdodo” sì fi ìgbésí ayé tó ń bá a lọ hàn.
