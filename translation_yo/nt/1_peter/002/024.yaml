  source_fidelity: Ìtumọ̀ náà pa ìtẹnumọ́ αὐτός, ‘igi’ fún ξύλον, ọ̀pọ̀ ‘àwọn ẹ̀ṣẹ̀,’ àti ìtọ́kasí ìwòsàn gbooro mọ́ dáadáa. Síbẹ̀, ‘níwọ̀n bí a ti kú’ túmọ̀ sí ‘níwọ̀n bí/síwájú pé a ti kú’ ju apá-ìṣe ἀπογενόμενοι (‘nígbà tí/lẹ́yìn tí a ti ya kúrò, nípa kíkú sí’) lọ. ‘Máa wà láàyè’ sì lè fi ìṣe àtúnlò tàbí ìlọsíwájú kún un ju aorist subjunctive ζήσωμεν lọ.
  naturalness: ‘Kí a lè wà láàyè fún òdodo’ jẹ́ Yorùbá boṣewa tó rọrùn àti tó bá ìtumọ̀ orísun mu. ‘Lẹ́yìn tí a ti kú sí àwọn ẹ̀ṣẹ̀’ ṣe ìbáṣepọ̀ apá-ìṣe náà ní kedere láìtúmọ̀ rẹ̀ sí ìdí. Ọ̀rọ̀ ‘a mú yín láradá’ dáa, ṣùgbọ́n ìṣètò ‘Nípasẹ̀ ọgbẹ́ rẹ̀ ni a mú yín láradá’ pa ohùn àfaragba náà mọ́ ní ọ̀nà adayeba.
