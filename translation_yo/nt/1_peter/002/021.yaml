  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: yo
  text: Nítorí èyí ni a pè yín sí, nítorí Mèsáyà pẹ̀lú jìyà fún yín, ó sì fi àpẹẹrẹ[a] sílẹ̀ fún yín, kí ẹ̀yin lè tẹ̀lé ìpasẹ̀ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwòṣe.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwòkọ́ṣe ìkọ̀wé tí a gbé kalẹ̀ níwájú akẹ́kọ̀ọ́ kí akẹ́kọ̀ọ́ lè tọ́ ọ lẹ́yìn.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: sí èyí
  rationale: Ó tọ́ka sẹ́yìn sí ìpè láti fara da ìjìyà àìṣòdodo; ọ̀rọ̀ náà tún pa ìtumọ̀ ohun tí a pè wọ́n sí mọ́.
- source_word: ἐκλήθητε
  choice: a pè yín
  rationale: Ìṣe aláìsọ ẹni tó ṣe é nínú èdè Gíríìkì ni a pa mọ́; ó sì gba ìtumọ̀ ìpè Ọlọ́run láyè láìfi ẹ̀kọ́ ìsìn kan lé e lórí.
- source_word: Χριστὸς
  choice: Mèsáyà
  rationale: A túmọ̀ àkọ́lé náà gẹ́gẹ́ bí ẹni tí a fòróró yàn, dípò kí a ṣe é bí orúkọ lásán.
- source_word: ἔπαθεν ὑπὲρ ὑμῶν
  choice: jìyà fún yín
  rationale: Ó sọ pé ìjìyà Mèsáyà jẹ́ fún àǹfààní wọn, ó sì pa àyè ìtumọ̀ aṣojú tàbí àrọ́pò mọ́ láìdín un sí ẹ̀kọ́ kan ṣoṣo.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: ó sì fi ... sílẹ̀ fún yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ó fi ohun kan sílẹ̀ gẹ́gẹ́ bí ogún tàbí ìtọ́sọ́nà fún wọn.
- source_word: ὑπογραμμὸν
  choice: àpẹẹrẹ
  rationale: ‘Àpẹẹrẹ’ ṣe kedere fún òǹkàwé òde òní; àlàyé ìtumọ̀ àwòṣe tí akẹ́kọ̀ọ́ ń tọ́ lé ni a fi sínú àlàyé ìsàlẹ̀.
- source_word: ἵνα ἐπακολουθήσητε
  choice: kí ẹ̀yin lè tẹ̀lé
  rationale: Ó pa ìtumọ̀ ète inú ἵνα àti ìṣe tí a pinnu fún wọn mọ́ ní Yorùbá àdánidá.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: ipasẹ̀ rẹ̀
  rationale: Ó pa àwòrán títẹ̀lé ibi tí ẹsẹ̀ ẹni ti tẹ̀ mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó yé kedere.
theological_decisions:
- issue: Ìtumọ̀ ὑπὲρ ὑμῶν nípa ìjìyà Mèsáyà
  choice: fún yín
  alternative: nítorí tiyín; ní ipò yín
  rationale: ‘Fún yín’ pa ìtumọ̀ àǹfààní àti aṣojú mọ́, ó sì lè gba ìtumọ̀ àrọ́pò láyè láìfi ìtumọ̀ tóóró tí ẹsẹ yìí kò sọ ní tààrà lé e lórí.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Mèsáyà’ jẹ́ àkọ́lé; ‘ipasẹ̀ rẹ̀’ sì pa àwòrán inú orísun mọ́.
