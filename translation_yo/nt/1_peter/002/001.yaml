source:
  edition: SBLGNT
  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: yo
  text: Nítorí náà, ẹ ti fi gbogbo ìwà búburú sílẹ̀[a], àti gbogbo ẹ̀tàn, gbogbo àgàbàgebè, gbogbo ìlara, àti gbogbo ọ̀rọ̀ ìbanilórúkọjẹ́[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, ‘ẹ ti bọ́ ... sílẹ̀,’ bí ẹni tó bọ aṣọ. A tún lè túmọ̀ ọ́ sí ‘lẹ́yìn tí ẹ ti fi ... sílẹ̀.’
    reason: lexical_alternative
  - marker: b
    text: Tàbí ‘gbogbo ọ̀rọ̀ tí a ń sọ lòdì sí àwọn ẹlòmíràn.’ Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ gbòòrò, ó bo ọ̀rọ̀ tó lè ba orúkọ ẹlòmíràn jẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: ẹ ti fi ... sílẹ̀
  rationale: Aorist participle náà ń sọ ohun tí a ṣe gẹ́gẹ́ bí ìmúrasílẹ̀ fún àṣẹ inú ẹsẹ kejì. Ìtumọ̀ yìí jẹ́ àdánidá ní Yorùbá, ó sì pa agbára ìṣe ìmúrasílẹ̀ náà mọ́ láì sọ ọ́ di àṣẹ tuntun.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi àbájáde tàbí ìdí tí ó jáde láti inú 1:22–25 hàn kedere.
- source_word: πᾶσαν κακίαν
  choice: gbogbo èrò búburú
  rationale: Nínú àkójọ ìwà búburú yìí, κακία ń tọ́ka sí ìfẹ́ búburú sí ẹlòmíràn. ‘Èrò búburú’ mú ìtumọ̀ ìkórìíra tàbí ète búburú jáde, láì mú un gbòòrò dé gbogbo ìwà àìṣòdodo.
- source_word: πάντα δόλον
  choice: gbogbo ẹ̀tàn
  rationale: ‘Ẹ̀tàn’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣàfihàn ìtanilọ́jẹ àti ọgbọ́n àrékérekè.
- source_word: ὑποκρίσεις
  choice: gbogbo àgàbàgebè
  rationale: Orúkọ àìkà ‘àgàbàgebè’ jẹ́ àdánidá ju fífi ọ̀pọ̀ hàn ní fọ́ọ̀mù ọ̀rọ̀ lọ ní Yorùbá; ‘gbogbo’ bo onírúurú ìṣe àgàbàgebè tí ọ̀pọ̀ Gíríìkì lè tọ́ka sí.
- source_word: φθόνους
  choice: gbogbo ìlara
  rationale: ‘Ìlara’ ni ọ̀rọ̀ Yorùbá tó ṣe kedere fún φθόνος. Gẹ́gẹ́ bí orúkọ àìkà, ‘gbogbo’ ń pa ìmọ̀ ọ̀pọ̀ àti onírúurú ìfarahàn rẹ̀ mọ́.
- source_word: πάσας καταλαλιάς
  choice: gbogbo ọ̀rọ̀ burúkú sí ẹlòmíràn
  rationale: Ọ̀rọ̀ yìí bo sísọ̀rọ̀ lòdì sí ẹlòmíràn tàbí sísọ ohun tó ba orúkọ rẹ̀ jẹ́. Ìtumọ̀ náà pa ìwọ̀n rẹ̀ mọ́ ju ọ̀rọ̀ tó lè túmọ̀ sí ẹ̀sùn èké nìkan lọ.
theological_decisions:
- issue: Ọ̀nà tí a gbà sọ àkójọ ìwà búburú àti ìwọ̀n ìtumọ̀ rẹ̀
  choice: Túmọ̀ ìwà kọ̀ọ̀kan ní kedere láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
  alternative: Túmọ̀ κακία ní gbòòrò sí ‘gbogbo ìwà búburú,’ tàbí καταλαλιάς sí ‘ẹ̀gàn’ tàbí ‘ìbanilórúkọjẹ́.’
  rationale: Ẹsẹ náà jẹ́ ìgbaniníyànjú nípa ìwà. Yíyan àwọn ọ̀rọ̀ tó ṣe kedere ń pa agbára àkójọ Gíríìkì mọ́, láì dín tàbí fẹ̀ ìtumọ̀ rẹ̀ sí i nítorí ẹ̀kọ́ ẹ̀sìn kan.
translation_notes:
  register: Yorùbá boṣewa, ìforúkọsílẹ̀ ọlọ́wọ̀ àti èdè òde òní. A lo ‘ẹ’ gẹ́gẹ́ bí ọ̀pọ̀ ẹni kejì, ní ìbámu pẹ̀lú nominative plural Gíríìkì. A pa gbolohun náà mọ́ gẹ́gẹ́ bí apá tó ń darí sí àṣẹ inú ẹsẹ 2, nítorí náà ó parí pẹ̀lú àmì kọ́mà.
