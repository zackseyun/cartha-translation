source:
  edition: SBLGNT
  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: yo
  text: ẹni tí kò ṣe ẹ̀ṣẹ̀[b], tí a kò sì rí ẹ̀tàn ní ẹnu rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àrékérekè”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹ̀tàn, ìtanjẹ, tàbí ìwà ọ̀dàlẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀nà ìsọ̀rọ̀ yìí ń ṣe ìrántí Aísáyà 53:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbátan yìí ń tọ́ka sí Kristi nínú ẹsẹ tó ṣáájú; “ẹni tí” pa ìsopọ̀ náà mọ́ lọ́nà àdánidá ní Yorùbá.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: kò dá ẹ̀ṣẹ̀ kankan
  rationale: “Dá ẹ̀ṣẹ̀” jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún ṣíṣe ẹ̀ṣẹ̀; “kankan” mú agbára ìkọ̀sẹ̀ Gíríìkì hàn pé kò dá ẹ̀ṣẹ̀ rárá láìfi ìtumọ̀ míì kún un.
- source_word: οὐδὲ
  choice: tí a kò sì
  rationale: Èyí so gbólóhùn ìkọ̀sẹ̀ kejì mọ́ ti àkọ́kọ́ lọ́nà tó ṣe déédéé ní Yorùbá, ó sì pa ìbáṣepọ̀ ìkọ̀sẹ̀ méjèèjì mọ́.
- source_word: εὑρέθη
  choice: a kò rí
  rationale: Ìtumọ̀ aláìlórúkọ olùṣe yìí ṣetọju ohùn àìṣe ti Gíríìkì ní Yorùbá láìsọ ẹni tó ṣe àwárí náà.
- source_word: δόλος
  choice: ẹ̀tàn
  rationale: “Ẹ̀tàn” jẹ́ ọ̀rọ̀ Yorùbá òde òní tó ṣe kedere fún ìsọ̀rọ̀ èké, ìtànjẹ, tàbí àrékérekè.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: ní ẹnu rẹ̀
  rationale: Ìtumọ̀ yìí sún mọ́ Gíríìkì, ó pa àwòrán ẹnu mọ́, ó sì ṣetọju ìróhìn tó jọ Aísáyà 53:9.
theological_decisions:
- issue: Ìtọ́ka inú-ọ̀rọ̀ sí Aísáyà 53:9 nípa àìlẹ́ṣẹ̀ Kristi àti àìsí ẹ̀tàn nínú ọ̀rọ̀ rẹ̀
  choice: Lo “kò dá ẹ̀ṣẹ̀ kankan” àti “a kò rí ẹ̀tàn kankan ní ẹnu rẹ̀”
  alternative: “Kò ṣẹ̀ rí, kò sì sọ ọ̀rọ̀ ẹ̀tàn rí”
  rationale: Àṣàyàn náà pa ọ̀nà ìsọ Gíríìkì àti ìróhìn Aísáyà mọ́, láìsọ gbólóhùn náà di àlàyé tó túmọ̀ “ẹnu” sí ọ̀rọ̀ sísọ nìkan.
translation_notes:
  register: Yorùbá boṣewa òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Èdè náà jẹ́ àdánidá, ọ̀wọ̀, ó sì sún mọ́ ìṣètò Gíríìkì; “ní ẹnu rẹ̀” ni a pa mọ́ dípò àlàyé bí “ní ètè rẹ̀” tàbí “nínú ọ̀rọ̀ rẹ̀.”
