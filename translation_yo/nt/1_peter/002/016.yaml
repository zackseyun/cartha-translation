id: 1PE.2.16
reference: 1 Peter 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: yo
  text: Ẹ máa gbé gẹ́gẹ́ bí àwọn ẹni òmìnira, kì í ṣe gẹ́gẹ́ bí àwọn tí ń lo òmìnira gẹ́gẹ́ bí ìbòrí fún ìwà búburú, ṣùgbọ́n gẹ́gẹ́ bí ẹrú Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìránṣẹ́ Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: àwọn ẹni òmìnira
  rationale: Ó tọ́ka sí gbogbo àwọn olùgbọ́ gẹ́gẹ́ bí ènìyàn tí ó ní òmìnira. Ọ̀rọ̀ yìí jẹ́ ti Yorùbá òde òní, kò sì fi ìtumọ̀ náà mọ́ akọ nìkan.
- source_word: ἐπικάλυμμα
  choice: ìbòjú
  rationale: “Ìbòjú” pa àwòrán ohun tí a fi bo tàbí fi ohun kan pamọ́ mọ́, ó sì bá ìkìlọ̀ pé kí wọn má fi òmìnira bo ìwà búburú mu.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: lo òmìnira yín gẹ́gẹ́ bí
  rationale: Bí ó tilẹ̀ jẹ́ pé ìtumọ̀ tààrà ni “ní òmìnira gẹ́gẹ́ bí,” “lo ... gẹ́gẹ́ bí” ni ọ̀nà àdánidá ní Yorùbá láti sọ ipa ohun èlò tí gbólóhùn Gíríìkì náà ní.
- source_word: κακίας
  choice: ìwà búburú
  rationale: Nínú àyíká yìí, κακία túmọ̀ sí ìwà tí kò dára ní gbogbogbòò, kì í ṣe ìkanra tàbí ète búburú nìkan.
- source_word: δοῦλοι
  choice: ẹrú
  rationale: “Ẹrú” pa agbára ọ̀rọ̀ Gíríìkì náà àti ìyàtọ̀ alágbára láàárín òmìnira àti jíjẹ́ ẹni tí ó jẹ́ ti Ọlọ́run pátápátá mọ́. Ọ̀rọ̀-orúkọ Yorùbá kò nílò àmì ọ̀pọ̀ lẹ́yìn “bí” nínú ìlò yìí.
- source_word: θεοῦ δοῦλοι
  choice: ẹrú Ọlọ́run
  rationale: Ìtumọ̀ náà ni àwọn tí ó jẹ́ ti Ọlọ́run, tí wọ́n sì wà lábẹ́ àṣẹ rẹ̀. Ọ̀nà yìí ṣe kedere, ó sì pa ìforígbárí pẹ̀lú “àwọn ẹni òmìnira” mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ δοῦλοι nígbà tí ó ń ṣàpèjúwe ìdánimọ̀ àwọn onígbàgbọ́
  choice: ẹrú Ọlọ́run
  alternative: ìránṣẹ́ Ọlọ́run
  rationale: Ẹsẹ̀ náà mọ̀ọ́mọ̀ fi òmìnira Kristẹni sí ẹ̀gbẹ́ jíjẹ́ ti Ọlọ́run pátápátá. “Ẹrú” pa ìforígbárí ẹ̀kọ́ ìgbàgbọ́ yìí mọ́; “ìránṣẹ́” lè mú agbára rẹ̀ rọ̀.
translation_notes:
  register: A lo Yorùbá ìpele ọ̀wọ̀, tí ó ṣe kedere fún òǹkàwé òde òní. “Ẹ máa gbé” mú kí ìbáṣepọ̀ gbólóhùn náà pẹ̀lú àṣẹ inú àyíká rẹ̀ ṣe kedere, láìyí kókó ìtumọ̀ padà. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
