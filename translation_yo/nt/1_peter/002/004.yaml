  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: yo
  text: Bí ẹ ti ń sún mọ́ ọn[a], òun tí í ṣe òkúta alààyè, tí àwọn ènìyàn kọ̀ sílẹ̀, ṣùgbọ́n tí Ọlọ́run yàn, tí ó sì ṣeyebíye[b] ní ojú Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí ẹ ti ń bọ̀ sí ọ̀dọ̀ rẹ̀.”
    reason: lexical_alternative
  - marker: b
    text: “Ṣeyebíye” tún lè túmọ̀ sí “ní iyì” tàbí “ẹni tí a bọ̀wọ̀ fún.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸς ὃν
  choice: Ẹ ń tọ̀ ọ́ wá
  rationale: Ọ̀rọ̀ náà tọ́ka sí lílọ sí ọ̀dọ̀ ẹni náà. Ìtumọ̀ yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa arọ́pò-orúkọ mọ́ láì fi orúkọ Jésù kún ohun tí Gíríìkì sọ.
- source_word: προσερχόμενοι
  choice: ń tọ̀ ... wá
  rationale: Àpólà alákọ̀ọ́bẹ̀rẹ̀ ìsinsìnyí náà fi ìṣe tí ń bá a lọ hàn; “ẹ ń tọ̀ ọ́ wá” bá ìṣàn ọ̀rọ̀ mu, ó sì lè túmọ̀ sí bí wọ́n ti ń sún mọ́ ọn.
- source_word: λίθον ζῶντα
  choice: òkúta alààyè
  rationale: “Òkúta” pa àwòrán ohun èlò ìkọ́lé mọ́, “alààyè” sì pa àfiwé àràmàǹdà inú ọ̀rọ̀ orísun mọ́.
- source_word: ὑπὸ ἀνθρώπων
  choice: tí àwọn ènìyàn
  rationale: ἄνθρωποι níbí ń ṣe ìyàtọ̀ láàárín ìdájọ́ ènìyàn àti ti Ọlọ́run. “Àwọn ènìyàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó kárí gbogbo ènìyàn láì dín ìtumọ̀ orísun kù.
- source_word: ἀποδεδοκιμασμένον
  choice: kọ̀ sílẹ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí pé a ti yẹ ohun náà wò, a sì kọ̀ ọ́. “Kọ̀ sílẹ̀” sọ àbájáde yẹn ní kedere àti ní èdè Yorùbá òde òní.
- source_word: παρὰ δὲ θεῷ
  choice: ní ojú Ọlọ́run
  rationale: παρά pẹ̀lú dátífù níbí ń sọ bí ohun náà ṣe rí ní ìdájọ́ tàbí níwájú Ọlọ́run; “ní ojú Ọlọ́run” jẹ́ àdánidá, ó sì mú ìyàtọ̀ pẹ̀lú ìdájọ́ ènìyàn hàn.
- source_word: ἐκλεκτὸν
  choice: tí Ọlọ́run yàn
  rationale: “Yàn” jẹ́ ìtumọ̀ kedere tí kò lo èdè ẹ̀kọ́ ìsìn tó le. Ṣíṣe Ọlọ́run ní olùṣe bá ọ̀rọ̀ “ní ojú Ọlọ́run” mu.
- source_word: ἔντιμον
  choice: ṣeyebíye
  rationale: ἔντιμος lè sọ ohun tí ó ní iyì tàbí iye gíga. “Ṣeyebíye” bá àwòrán òkúta mu, ó sì jẹ́ èdè Yorùbá tí ó lóye.
theological_decisions:
- issue: Ẹni tí arọ́pò-orúkọ àti “òkúta alààyè” ń tọ́ka sí
  choice: A pa arọ́pò-orúkọ “ọ́/òun” mọ́; àyíká ọ̀rọ̀ fi hàn pé Olúwa Jésù Mèsáyà ni.
  alternative: Fífi “Jésù” tàbí “Kristi” sínú ẹsẹ̀ náà ní tààrà.
  rationale: Àyíká 1 Pétérù 2:3-8 dá ẹni tí a ń tọ́ka sí mọ̀, ṣùgbọ́n Gíríìkì ẹsẹ̀ yìí lo arọ́pò-orúkọ. Ìtumọ̀ náà kò gbọ́dọ̀ túmọ̀ àlàyé àyíká sí àfikún nínú ọ̀rọ̀.
- issue: Ìbáṣepọ̀ ἐκλεκτὸν àti ἔντιμον pẹ̀lú Ọlọ́run
  choice: “tí Ọlọ́run yàn, tí ó sì ṣeyebíye ní ojú rẹ̀”
  alternative: “èyí tí a yàn, tí ó sì ní iyì lọ́dọ̀ Ọlọ́run”
  rationale: Yíyan náà jẹ́ ti Ọlọ́run gẹ́gẹ́ bí àyíká gírámà ṣe fi hàn, ἔντιμος sì lè tẹnu mọ́ iye tàbí iyì. “Ṣeyebíye” pa àwòrán òkúta mọ́, àlàyé ìsàlẹ̀ sì tọ́ka sí ìtumọ̀ “ní iyì.”
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti òde òní ni a lò. Arọ́pò-orúkọ ọ̀pọ̀ ènìyàn ọlọ́wọ̀ “ẹ” bá àwọn olùkà tí a ń bá sọ mu. A lo “òkúta” dípò “àpáta” láti pa àwòrán òkúta ìkọ́lé inú àyíká mọ́. Gbogbo àmì ohùn ni a fi síbi tí ó bá yẹ.
