  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: yo
  text: 'àti,


    “Òkúta ìkọsẹ̀

    àti àpáta ìṣubú.”


    Wọ́n ń kọsẹ̀ nítorí wọ́n ń ṣàìgbọ́ràn sí ọ̀rọ̀ náà; èyí sì ni a yàn wọ́n sí.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: Òkúta ìkọsẹ̀
  rationale: Ó pa àwòrán gidi ti òkúta tí ènìyàn fi ń kọsẹ̀ mọ́, ó sì bá ọ̀rọ̀ Yorùbá àdánidá mu.
- source_word: πέτρα σκανδάλου
  choice: àpáta ìdènà
  rationale: Ó yà πέτρα gẹ́gẹ́ bí ‘àpáta’ sọ́tọ̀ sí λίθος, ó sì fi ìtumọ̀ ohun tí ń mú ènìyàn ṣubú tàbí dí i lọ́nà hàn láìfi ìtumọ̀ ẹ̀sìn àfikún sí i.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: nítorí pé wọn kò ṣègbọ́ràn sí ọ̀rọ̀ náà
  rationale: Dátífù τῷ λόγῳ ni a so mọ́ ἀπειθοῦντες, tí ó túmọ̀ sí àìgbọ́ràn sí ọ̀rọ̀ náà; ‘nítorí pé’ mú ìbáṣepọ̀ rẹ̀ pẹ̀lú ‘wọ́n kọsẹ̀’ hàn ní Yorùbá àdánidá.
- source_word: εἰς ὃ καὶ ἐτέθησαν
  choice: sí èyí sì ni a ti yàn wọ́n sí
  rationale: ‘Sí èyí’ pa àìdánilójú ohun tí ὃ ń tọ́ka sí mọ́; ‘a ti yàn wọ́n sí’ fi ìṣe àìṣe-taara ti ἐτέθησαν hàn láìsọ ẹni tó ṣe é ní gbangba.
theological_decisions:
- issue: Ohun tí ‘εἰς ὃ’ (‘sí èyí’) ń tọ́ka sí
  choice: A fi sílẹ̀ gẹ́gẹ́ bí ‘sí èyí’ láìṣàlàyé rẹ̀ síwájú.
  alternative: ‘Fún àìgbọ́ràn yìí ni a ti yàn wọ́n’ tàbí ‘Fún ìkọsẹ̀ yìí ni a ti yàn wọ́n.’
  rationale: Gíríìkì lè tọ́ka sí ìkọsẹ̀, àìgbọ́ràn, tàbí gbogbo ìṣẹ̀lẹ̀ tí a ṣẹ̀ṣẹ̀ sọ; fífi ọ̀rọ̀ náà ṣí sílẹ̀ ń pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́.
- issue: Ìtumọ̀ ἐτέθησαν
  choice: ‘a ti yàn wọ́n sí’
  alternative: ‘a ti fi wọ́n sí’ tàbí ‘èyí ni a ti pinnu fún wọn.’
  rationale: ‘Yàn ... sí’ mú ìtumọ̀ fífi tàbí yíyan sí ipò/àbájáde kan hàn, ṣùgbọ́n kò sọ ní pàtó pé Ọlọ́run ló pinnu àìgbọ́ràn wọn tàbí pé kò sí ojúṣe ènìyàn.
translation_notes:
  register: Yorùbá àpéjọ tí ó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘kò ṣègbọ́ràn’ dípò ọ̀rọ̀ àtijọ́ tó le, a sì pa ìṣọ̀kan ewì inú àyọlò náà mọ́.
