id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: yo
  text: Ẹ fi ọlá fún gbogbo ènìyàn; ẹ fẹ́ràn àwùjọ àwọn ará[a]; ẹ bẹ̀rù Ọlọ́run; ẹ fi ọlá fún ọba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àwùjọ àwọn ará” túmọ̀ sí ìjọ àwọn onígbàgbọ́ ẹlẹgbẹ́.
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì náà ni “ọba”; ṣùgbọ́n nínú àyíká Róòmù ti Pétérù, ó ṣeé ṣe kí ó tọ́ka sí ọba ilẹ̀ Róòmù.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: gbogbo ènìyàn
  rationale: Ọ̀rọ̀ yìí dúró fún gbogbo ènìyàn láìsí ẹni tí a yọ sílẹ̀; ìtumọ̀ yìí sì ṣe kedere, ó sì jẹ́ èdè Yorùbá àdánidá.
- source_word: τιμήσατε / τιμᾶτε
  choice: ẹ bọlá fún
  rationale: A lo gbólóhùn kan náà ní ibi méjèèjì láti pa àtúnwí ọ̀rọ̀ Gíríìkì mọ́. ‘Bọlá fún’ lágbára ju ‘bọ̀wọ̀ fún’ lọ, ó sì bá ìtumọ̀ ọlá mu.
- source_word: ἀδελφότητα
  choice: ẹgbẹ́ àwọn ará
  rationale: Ó tọ́ka sí àwùjọ àwọn ará nínú ìgbàgbọ́, ó sì pa àwòrán ìbátan ẹbí inú ọ̀rọ̀ Gíríìkì mọ́ láìfi àlàyé tó pọ̀ sínú ẹsẹ náà.
- source_word: ἀγαπᾶτε
  choice: ẹ nífẹ̀ẹ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún àṣẹ láti ní ìfẹ́ sí ẹlòmíràn; àṣẹ ìsinsin yìí tún lè fi ìṣe tí ń bá a lọ hàn.
- source_word: θεὸν
  choice: Ọlọ́run
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé fún θεός ní àyíká yìí.
- source_word: φοβεῖσθε
  choice: ẹ bẹ̀rù
  rationale: ‘Bẹ̀rù’ pa agbára àti ìwọ̀n ọ̀rọ̀ Gíríìkì mọ́; a kò rọ ọ́ di ‘bọ̀wọ̀ fún,’ nítorí ẹsẹ náà fi ohun tí ó yẹ fún Ọlọ́run yàtọ̀ sí ọlá tí ó yẹ fún ọba.
- source_word: βασιλέα
  choice: ọba
  rationale: Ìtumọ̀ tààrà ọ̀rọ̀ Gíríìkì ni ‘ọba.’ Nínú àyíká ìjọba Róòmù, ó ṣeé ṣe kí ó tọ́ka sí olú ọba ilẹ̀ Róòmù; a fi èyí sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìyàtọ̀ láàárín ohun tí ó yẹ fún Ọlọ́run àti ohun tí ó yẹ fún alákòóso
  choice: A tú φοβεῖσθε sí ‘ẹ bẹ̀rù’ fún Ọlọ́run, a sì tú τιμάω sí ‘ẹ bọlá fún’ fún ọba.
  alternative: ‘Ẹ bẹ̀rù tìrètìrè fún Ọlọ́run’ tàbí ‘ẹ bọ̀wọ̀ fún Ọlọ́run,’ àti ‘ẹ bọ̀wọ̀ fún ọba.’
  rationale: 'Yíyan ọ̀rọ̀ yìí pa ìpele tí ẹsẹ náà gbé kalẹ̀ mọ́: ọlá fún gbogbo ènìyàn, ìfẹ́ fún àwùjọ àwọn onígbàgbọ́, ìbẹ̀rù fún Ọlọ́run, àti ọlá fún ọba. Kò fi ìbẹ̀rù tí ó yẹ fún Ọlọ́run dọ́gba pẹ̀lú ọlá fún alákòóso.'
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún gbogbo ènìyàn láti lóye. Àtúnwí ‘ẹ bọlá fún’ pa ìṣọ̀kan ìbẹ̀rẹ̀ àti òpin ẹsẹ Gíríìkì mọ́. Gbogbo àmì ohùn ni a fi síbi tó yẹ.
