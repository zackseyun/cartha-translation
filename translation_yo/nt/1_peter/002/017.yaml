revisions:
- from: Ẹ bọlá fún gbogbo ènìyàn; ẹ nífẹ̀ẹ́ ẹgbẹ́ àwọn ará[a]; ẹ bẹ̀rù Ọlọ́run; ẹ bọlá fún ọba[b].
  to: Ẹ fi ọlá fún gbogbo ènìyàn; ẹ fẹ́ràn àwùjọ àwọn ará[a]; ẹ bẹ̀rù Ọlọ́run; ẹ fi ọlá fún ọba[b].
  rationale: Àtúnṣe náà rọ́pò ọ̀nà tí kò wọ́pọ̀ ‘ẹ bọlá fún’ pẹ̀lú ‘ẹ fi ọlá fún,’ tí ó jẹ́ Yorùbá àdánidá, ó sì pa àtúnwí τιμήσατε/τιμᾶτε mọ́. Ó tún mú ἀδελφότης hàn gẹ́gẹ́ bí àwùjọ àwọn onígbàgbọ́, láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kan kún un. Àwọn àmì àlàyé ìsàlẹ̀ wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ tí wọ́n ń ṣàlàyé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:21:30Z'
review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà mú ìtòlẹ́sẹẹsẹ àwọn àṣẹ mẹ́rin, ìyàtọ̀ láàárín ‘bẹ̀rù Ọlọ́run’ àti fífi ọlá fún ọba, àti àtúnwí τιμάω mọ́. Síbẹ̀, ‘Ẹ bọlá fún’ kì í ṣe ọ̀nà Yorùbá tí ó ṣe déédéé jù lọ fún ‘honor’; ‘Ẹ fi ọlá fún’ hàn gbangba, ó sì jẹ́ ìlò àdánidá.
  naturalness: ‘Ẹ fi ọlá fún’ dára ju ‘Ẹ bọlá fún.’ ‘Ẹ fẹ́ràn àwùjọ àwọn ará’ jẹ́ ìtúmọ̀ kedere, ìgbàlódé, tí ó sì dára ju ‘Ẹ nífẹ̀ẹ́ ẹgbẹ́ àwọn ará’ lọ nínú gbolohun àṣẹ yìí.
  terminology: ‘Ọlọ́run,’ ‘bẹ̀rù,’ ‘ọba,’ àti ‘àwùjọ àwọn ará’ bá ìlò Bíbélì Yorùbá mu. Àlàyé nípa βασιλέα gbọ́dọ̀ sọ pé ọ̀rọ̀ náà fúnra rẹ̀ ni ‘ọba,’ nígbà tí ‘ọba ilẹ̀ Róòmù’ jẹ́ ìtọ́kasí ìtàn tó ṣeé ṣe, kì í ṣe ìtumọ̀ pàtó nínú ẹsẹ̀.
  issues:
  - severity: medium
    issue: ‘Ẹ bọlá fún’ nínú ìtumọ̀ àkọ́kọ́ àti ìkẹyìn
    rationale: Ìgbékalẹ̀ náà kò ṣe déédéé nínú Yorùbá ìgbàlódé fún fífi ọlá fún ẹni. ‘Ẹ fi ọlá fún’ ni ọ̀nà tí ó mọ́, tí ó sì pa ìtumọ̀ τιμάω àti àtúnwí rẹ̀ mọ́.
  - severity: low
    issue: ‘Ẹgbẹ́ àwọn ará’ àti ‘Ẹ nífẹ̀ẹ́’
    rationale: Ó ṣeé lóye, ṣùgbọ́n ‘àwùjọ àwọn ará’ ń ṣàfihàn ἀδελφότης dáadáa gẹ́gẹ́ bí ẹgbẹ́ àwọn onígbàgbọ́, ‘Ẹ fẹ́ràn’ sì jẹ́ ọ̀nà àṣẹ tí ó rọrùn, tí ó sì wọ́pọ̀.
  - severity: low
    issue: ‘Tàbí olú ọba’ nínú àlàyé ìsàlẹ̀
    rationale: ‘Olú ọba’ lè má tú ‘emperor’ ní kedere fún òǹkàwé. Ó dára láti ṣàlàyé ìtọ́kasí sí ọba ilẹ̀ Róòmù nípasẹ̀ àlàyé ìtàn, nígbà tí a fi ‘ọba’ sí ìtumọ̀ àkọ́kọ́.
