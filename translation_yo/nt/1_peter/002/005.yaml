id: 1PE.2.5
reference: 1 Peter 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: yo
  text: Ẹ̀yin fúnra yín náà, bí àwọn òkúta alààyè[a], ni a ń kọ́ yín di ilé tẹ̀mí, sí ẹgbẹ́ àlùfáà mímọ́[b][d], kí ẹ lè rú àwọn ẹbọ tẹ̀mí tí Ọlọ́run tẹ́wọ́ gbà nípasẹ̀ Jésù Mèsáyà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí àwọn òkúta alààyè.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “fún ẹgbẹ́ àlùfáà mímọ́” tàbí “láti jẹ́ ẹgbẹ́ àlùfáà mímọ́.” Ọ̀rọ̀ àsopọ̀ Gíríìkì náà lè fi ète tàbí àbájáde hàn.
    reason: alternative_reading
  - marker: c
    text: Ní Gíríìkì, “Jésù Kristi”; a tú Χριστός sí “Mèsáyà” níbí nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
  - marker: d
    text: Tàbí, “gẹ́gẹ́ bí ilé tẹ̀mí, sí ẹgbẹ́ àlùfáà mímọ́.”
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτοὶ καὶ
  choice: ẹ̀yin fúnra yín náà
  rationale: “Fúnra yín” fi ìtẹnumọ́ αὐτοὶ hàn, “náà” sì pa agbára àfikún καί mọ́, ó sì so àwọn oníkàwé pọ̀ mọ́ àpèjúwe òkúta alààyè tí ó ṣáájú.
- source_word: ὡς λίθοι ζῶντες
  choice: bí àwọn òkúta alààyè
  rationale: Ó pa àfiwé náà àti àwòrán àwọn òkúta tí ó wà láàyè mọ́ ní Yorùbá àdánidá.
- source_word: οἰκοδομεῖσθε
  choice: ni a ń kọ́ pọ̀ di
  rationale: Ìkọ̀lé àwọn òkúta ni gbolohun yìí ń ṣàpèjúwe; “a ń” jẹ́ ọ̀nà Yorùbá láti fi ẹni tó ń ṣe iṣẹ́ náà sílẹ̀ láìdárúkọ rẹ̀, “ń” sì fi iṣẹ́ tí ń lọ lọ́wọ́ hàn.
- source_word: οἶκος πνευματικὸς
  choice: ilé tẹ̀mí
  rationale: Ó túmọ̀ àwòrán ilé àti πνευματικός ní ṣókí láìṣàlàyé irú ilé náà ju ohun tí ọ̀rọ̀ Gíríìkì sọ lọ.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: sí ẹgbẹ́ àlùfáà mímọ́
  rationale: “Sí” pa ìtọ́sọ́nà tàbí àbájáde εἰς mọ́; “ẹgbẹ́ àlùfáà” fi hàn pé ἱεράτευμα jẹ́ ara àwọn àlùfáà, kì í ṣe àwọn àlùfáà kọ̀ọ̀kan lásán.
- source_word: ἀνενέγκαι
  choice: kí ẹ lè rú
  rationale: “Rú ẹbọ” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún fífi ẹbọ rú; ìtumọ̀ ète infinitive náà sì fara hàn nínú “kí ẹ lè.”
- source_word: πνευματικὰς θυσίας
  choice: àwọn ẹbọ tẹ̀mí
  rationale: Ó pa èdè ẹbọ àti àpèjúwe πνευματικός mọ́ láìsọ pàtó ohun tí àwọn ẹbọ náà jẹ́.
- source_word: εὐπροσδέκτους θεῷ
  choice: tí Ọlọ́run tẹ́wọ́ gbà
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Ọlọ́run gba ẹbọ náà gẹ́gẹ́ bí ohun tí ó yẹ.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ Jésù Mèsáyà
  rationale: “Nípasẹ̀” fi ìlaja tàbí ọ̀nà tí διά pẹ̀lú genitive ń tọ́ka sí hàn; “Mèsáyà” mú iṣẹ́ Χριστός gẹ́gẹ́ bí oyè hàn.
theological_decisions:
- issue: Ohùn àti aṣojú nínú οἰκοδομεῖσθε
  choice: 'A lo ìkọ̀lẹ̀ aláìdárúkọ aṣojú: “a ń kọ́ pọ̀ di.”'
  alternative: “Ẹ ń kọ́ ara yín pọ̀” tàbí dídárúkọ Ọlọ́run gẹ́gẹ́ bí ẹni tó ń kọ́ wọn.
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ passive, ó sì yẹ kí a má sọ ẹni tó ń ṣe iṣẹ́ náà nígbà tí ẹsẹ náà kò dárúkọ rẹ̀; ìtumọ̀ reflexive yóò yí ìdarí iṣẹ́ náà padà.
- issue: Ìbáṣepọ̀ εἰς ἱεράτευμα ἅγιον pẹ̀lú ìkọ̀lé ilé tẹ̀mí
  choice: “sí ẹgbẹ́ àlùfáà mímọ́,” tí ó pa ìtọ́sọ́nà/àbájáde mọ́.
  alternative: “fún ẹgbẹ́ àlùfáà mímọ́” tàbí “láti jẹ́ ẹgbẹ́ àlùfáà mímọ́.”
  rationale: εἰς lè tọ́ka sí ète tàbí àbájáde. A yan “sí” láti má ṣe pinnu ju bí Gíríìkì ṣe pinnu lọ, a sì ṣàkọsílẹ̀ àwọn àṣàyàn mìíràn.
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú “Jésù Χριστός,” ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” mú ìtumọ̀ oyè náà jáde láìyí ẹ̀kọ́ nípa ẹni tí Jésù jẹ́ padà.
- issue: Ìtumọ̀ πνευματικός
  choice: tẹ̀mí
  alternative: “ti Ẹ̀mí”
  rationale: “Tẹ̀mí” pa ìtumọ̀ gbooro “spiritual” mọ́; “ti Ẹ̀mí” lè pinnu ní pàtó pé Ẹ̀mí Mímọ́ ni ọ̀rọ̀ náà ń tọ́ka sí, ohun tí ẹsẹ yìí kò sọ ní tààrà.
translation_notes:
  register: Yorùbá boṣewa onígbàlódé ni a lò, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye. “A ń kọ́” yàgò fún dídárúkọ aṣojú tí Gíríìkì kò dárúkọ; “ẹgbẹ́ àlùfáà” sì mú ìtumọ̀ àpapọ̀ ἱεράτευμα ṣe kedere láìsọ pé olúkúlùkù jẹ́ àlùfáà ní ìyasọ́tọ̀.
