  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: yo
  text: ẹ̀yin tí ẹ kò jẹ́ ènìyàn kan tẹ́lẹ̀ rí[a], ṣùgbọ́n tí ẹ jẹ́ ènìyàn Ọlọ́run ní báyìí; ẹ̀yin tí ẹ kò rí àánú gbà tẹ́lẹ̀, ṣùgbọ́n tí ẹ ti rí àánú gbà ní báyìí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pétérù ń tọ́ka sí Hósíà 1:9–10; 2:23, ó sì ń lo èdè ìmúpadàbọ̀sípò Ísírẹ́lì fún ìdánimọ̀ àwọn òǹkàwé rẹ̀ ní báyìí gẹ́gẹ́ bí ènìyàn Ọlọ́run.
    reason: cross_reference
  - marker: b
    text: 'Tàbí: “ẹ̀yin tí a kò ṣàánú tẹ́lẹ̀, ṣùgbọ́n tí a ti ṣàánú ní báyìí.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: ẹ̀yin tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí àwọn olùgbọ́ tí a ti ń bá sọ̀rọ̀ ní ẹsẹ tó ṣáájú; ‘ẹ̀yin tí’ mú ìsopọ̀ náà hàn ní Yorùbá àdánidá.
- source_word: ποτε
  choice: tẹ́lẹ̀ rí
  rationale: Ó fi ipò wọn àtijọ́ wé ipò wọn nísinsìnyí; ‘tẹ́lẹ̀ rí’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ èyí.
- source_word: λαὸς
  choice: ènìyàn kan / ènìyàn Ọlọ́run
  rationale: λαός ń tọ́ka sí àwùjọ ènìyàn gẹ́gẹ́ bí odindi. ‘Ènìyàn kan’ pa ìtumọ̀ àpapọ̀ ti gbólóhùn àkọ́kọ́ mọ́, ‘ènìyàn Ọlọ́run’ sì jẹ́ ọ̀nà Yorùbá tó yẹ fún λαὸς θεοῦ.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Àkójọpọ̀ ‘ènìyàn Ọlọ́run’ fi ìní àti ìbáṣepọ̀ májẹ̀mú tí genitive náà ní hàn lọ́nà àdánidá.
- source_word: οὐκ ἠλεημένοι
  choice: ẹ kò rí àánú gbà tẹ́lẹ̀
  rationale: Perfect passive participle náà ṣàpèjúwe ipò wọn gẹ́gẹ́ bí àwọn tí kò tíì jẹ́ olùgbà àánú; ‘rí àánú gbà’ sọ èyí ní Yorùbá tó ṣe kedere.
- source_word: ἐλεηθέντες
  choice: ẹ ti rí àánú gbà nísinsìnyí
  rationale: Ìtumọ̀ yìí pa ìṣe àánú Ọlọ́run àti àbájáde rẹ̀ nínú ipò wọn lọ́wọ́lọ́wọ́ mọ́, ó sì bá gbólóhùn tó ṣáájú mu.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: δέ ń fi ìyípadà tó yàtọ̀ sí ipò àtijọ́ hàn ní ìdajì méjèèjì; ‘ṣùgbọ́n’ fi ìtakora náà hàn kedere.
- source_word: νῦν
  choice: nísinsìnyí
  rationale: Ó tọ́ka sí ipò àwọn onígbàgbọ́ lọ́wọ́lọ́wọ́ ní ìyàtọ̀ sí ti tẹ́lẹ̀.
theological_decisions:
- issue: Ìtọ́kasí sí Hósíà àti èdè ìdánimọ̀ májẹ̀mú
  choice: A pa ìyípadà àpapọ̀ náà mọ́ gẹ́gẹ́ bí ‘kò jẹ́ ènìyàn kan ... jẹ́ ènìyàn Ọlọ́run.’
  alternative: Kí a túmọ̀ apá méjèèjì ní ìtumọ̀ àlàyé sí ‘kì í ṣe ènìyàn Ọlọ́run ... ènìyàn Ọlọ́run.’
  rationale: Gíríìkì sọ ‘kì í ṣe ènìyàn kan’ ní àkọ́kọ́, kì í ṣe ‘kì í ṣe ènìyàn Ọlọ́run’ ní tààrà. Ìtumọ̀ yìí pa ìyàtọ̀ ọ̀rọ̀ náà àti ìró Hósíà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: A lo Yorùbá boṣewa tó ní àmì ohùn ní kíkún, ní èdè ọlọ́wọ̀ àti èyí tí òǹkàwé òde òní lè lóye. Àtúnṣe ‘ẹ̀yin tí ...’ ń pa ìṣọ̀kan pẹ̀lú ẹsẹ tó ṣáájú mọ́, àwọn gbólóhùn tó ṣe méjì sì pa ìwọ̀ntúnwọ̀nsì ewì orísun náà mọ́.
