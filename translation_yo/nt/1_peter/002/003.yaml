  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: yo
  text: bí ẹ bá ti tọ́ wò pé Olúwa ṣe rere[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “níwọ̀n bí ẹ ti tọ́ wò.” Gíríìkì lo gbólóhùn oníṣàkíyèsí, ṣùgbọ́n ó lè ń gbà pé ohun tí a sọ náà jẹ́ òtítọ́.
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ “ṣe rere” sí “jẹ́ onínúure” tàbí “jẹ́ olóore-ọ̀fẹ́.” Ọ̀rọ̀ yìí ń dún bí Sáàmù 34:8.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: bí ó bá jẹ́ pé
  rationale: Èyí pa ìrísí gbólóhùn oníṣ条件 Greek mọ́, ó sì lè túmọ̀ sí ipò tí ẹni tó ń sọ̀rọ̀ retí pé ó jẹ́ òtítọ́, láì yí i padà sí ìdánilójú pátápátá.
- source_word: ἐγεύσασθε
  choice: ẹ ti tọ́ ọ́ wò
  rationale: A pa àwòrán ‘tọ́ ... wò’ mọ́ nítorí ó bá ọ̀rọ̀ oúnjẹ ní 2:2–3 mu, ó sì tún pa ìtọ́kasí sí Sáàmù 34:8 mọ́. ‘Ti’ fi ìṣe tó ti ṣẹlẹ̀, tí ìtumọ̀ rẹ̀ ṣì kan ìsinsìnyí, hàn lọ́nà àdánidá ní Yorùbá.
- source_word: ὅτι
  choice: pé
  rationale: ‘Pé’ ṣàgbékalẹ̀ ohun tí àwọn olùgbọ́ ti tọ́ wò tàbí ti ní ìrírí rẹ̀, ó sì tẹ̀ lé ìṣọ̀kan ọ̀rọ̀ Greek ní ti ara.
- source_word: χρηστὸς
  choice: rere
  rationale: ‘Rere’ ní ìtumọ̀ tó gbòòrò tí ó lè ní inú rere àti oore-ọ̀fẹ́ nínú, láì dín χρηστός kù sí ọ̀kan ṣoṣo nínú àwọn ìtumọ̀ wọ̀nyẹn. Ó tún bá ìró Sáàmù 34:8 mu.
- source_word: κύριος
  choice: Olúwa
  rationale: ‘Olúwa’ ni ìtumọ̀ àkọ́kọ́ tó yẹ fún κύριος, ó sì pa ìwọ̀n ọlá orúkọ oyè náà àti ìbáṣepọ̀ rẹ̀ pẹ̀lú Sáàmù 34:8 mọ́, láì fi ‘Kristi’ kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Agbára gbólóhùn oníṣ条件 εἰ
  choice: A pa á mọ́ gẹ́gẹ́ bí ‘bí ó bá jẹ́ pé,’ èyí tí ó jẹ́ ọ̀rọ̀ oníṣ条件 tí ó lè retí pé ipò náà jẹ́ òtítọ́.
  alternative: ‘níwọ̀n bí ẹ ti tọ́ ọ́ wò’ tàbí ‘nítorí ẹ ti tọ́ ọ́ wò’
  rationale: Ó ṣeé ṣe kí Peteru máa ka ìrírí àwọn òǹkàwé sí ohun gidi, ṣùgbọ́n Greek ṣì lo εἰ. Ìtumọ̀ àkọ́kọ́ pa ìṣọ̀kan àti ìfúnpá ọ̀rọ̀ ìṣírí náà mọ́ láì sọ ohun tí Greek kò sọ ní tààrà.
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí
  choice: A fi ‘Olúwa’ sílẹ̀ láì fi ‘Kristi’ ṣe àlàyé rẹ̀ nínú ọ̀rọ̀ àkọ́kọ́.
  alternative: ‘Olúwa (Kristi)’
  rationale: Àyíká 1 Peteru 2 so ọ̀rọ̀ náà mọ́ Jesu gidigidi, ṣùgbọ́n ó tún ń dún bí Sáàmù 34:8. ‘Olúwa’ pa àwọn ìbáṣepọ̀ méjèèjì mọ́, kò sì yanju ìfarapamọ́ inú ọ̀rọ̀ náà láìnídí.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì rọrùn fún gbogbo ènìyàn. Ìṣètò ‘ẹ ti tọ́ ọ́ wò pé rere ni Olúwa’ jẹ́ àdánidá ní Yorùbá, ó pa àwòrán ìtọ́wò mọ́, ó sì yàgò fún fífi ẹ̀kọ́ ẹ̀sìn kan pàtó kún ọ̀rọ̀ náà.
