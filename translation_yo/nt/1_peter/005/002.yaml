id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: yo
  text: Ẹ tọ́jú agbo Ọlọ́run tí ó wà láàárín yín bí olùṣọ́-àgùntàn, nípa ṣíṣe àbójútó rẹ̀, kì í ṣe ní tipátipá ṣùgbọ́n tinútinú, ní ìbámu pẹ̀lú Ọlọ́run[a]; bẹ́ẹ̀ ni kì í ṣe nítorí èrè ìtìjú, ṣùgbọ́n pẹ̀lú ìtara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí Ọlọ́run ṣe fẹ́” tàbí “ní ìbámu pẹ̀lú ìfẹ́ Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: ποιμάνατε
  choice: Ẹ máa ṣe olùṣọ́ àgùntàn fún
  rationale: Ọ̀rọ̀ àṣẹ yìí ń pe àwọn alàgbà láti tọ́jú àwọn ènìyàn bí olùṣọ́ àgùntàn ṣe ń tọ́jú agbo; ó pa àwòrán ìṣọ́-àgùntàn mọ́ láì sọ ọ́ di orúkọ ipò ṣọ́ọ̀ṣì.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: agbo Ọlọ́run tí ó wà láàárín yín
  rationale: “Agbo” pa àwòrán ποίμνιον mọ́, “Ọlọ́run” sì ni olówó agbo náà; “tí ó wà láàárín yín” kò fi hàn pé àwọn alàgbà ni wọ́n ni ín.
- source_word: ἐπισκοποῦντες
  choice: kí ẹ máa ṣe àbójútó rẹ̀
  rationale: Ó ṣàlàyé bí wọ́n ṣe yẹ kí wọ́n ṣe iṣẹ́ olùṣọ́, ó sì fi ìtọ́jú àti ìṣọ́ra hàn láì lò ó gẹ́gẹ́ bí orúkọ ipò ẹ̀sìn.
- source_word: μὴ ἀναγκαστῶς
  choice: kì í ṣe nítorí àfipámúṣe
  rationale: Ó túmọ̀ sí pé iṣẹ́ náà kò gbọdọ̀ jẹ́ ohun tí ìfipá tàbí dandan mú wọn ṣe.
- source_word: ἀλλὰ ἑκουσίως
  choice: bí kò ṣe tinútinú
  rationale: “Tinútinú” jẹ́ ọ̀nà Yorùbá àdánidá fún iṣẹ́ tí ẹni ń ṣe látinú ìfẹ́ ara rẹ̀.
- source_word: κατὰ θεόν
  choice: gẹ́gẹ́ bí Ọlọ́run ṣe fẹ́
  rationale: Gbólóhùn Gíríìkì náà kúrú, ó sì lè tọ́ka sí ìfẹ́ Ọlọ́run, ìlànà rẹ̀, tàbí ohun tí ó bá a mu; ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, a sì pa àìdánilójú rẹ̀ mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: kì í sì í ṣe nítorí èrè tí ó bani lẹ́rù
  rationale: Ó fi ìwà ìtìjú àti ìbàjẹ́ tó wà nínú wíwá èrè lọ́nà búburú hàn, kì í ṣe pé èrè gbogbo ni a ń dá lẹ́bi.
- source_word: ἀλλὰ προθύμως
  choice: bí kò ṣe pẹ̀lú ìtara
  rationale: “Pẹ̀lú ìtara” fi ìmúratán àti ìfẹ́kúfẹ̀ẹ́ iṣẹ́ hàn, ó sì yàtọ̀ sí “tinútinú” tó wà ṣáájú.
theological_decisions:
- issue: Bóyá ἐπισκοποῦντες yẹ kí ó jẹ́ orúkọ ipò pàtó nínú ṣọ́ọ̀ṣì
  choice: 'A túmọ̀ rẹ̀ gẹ́gẹ́ bí iṣẹ́: “kí ẹ máa ṣe àbójútó rẹ̀.”'
  alternative: “kí ẹ máa ṣiṣẹ́ bí àwọn alabojuto” tàbí “kí ẹ máa ṣe iṣẹ́ bíṣọ́ọ̀bù”
  rationale: Nínú àyíká ọ̀rọ̀, participle náà ń ṣàlàyé iṣẹ́ àwọn alàgbà, kò sì pọn dandan pé ó ń dá orúkọ ipò ṣọ́ọ̀ṣì tí ó ti fẹsẹ̀ múlẹ̀ lẹ́yìn náà kalẹ̀. Èyí yẹra fún fífi ètò ìjọ ẹ̀ya kan sínú ẹsẹ náà.
- issue: Bí a ṣe yẹ kí a túmọ̀ κατὰ θεόν ní kedere tó
  choice: “gẹ́gẹ́ bí Ọlọ́run ṣe fẹ́,” pẹ̀lú àlàyé ìsàlẹ̀ tó fi àwọn ìtumọ̀ tó ṣeé ṣe hàn.
  alternative: “gẹ́gẹ́ bí Ọlọ́run” tàbí “ní ìbámu pẹ̀lú ìlànà Ọlọ́run”
  rationale: Gbólóhùn náà ní ìtumọ̀ tó há pọ̀; àlàyé ìsàlẹ̀ ń pa àṣàyàn tó lè túmọ̀ sí ìfẹ́, ìlànà, tàbí ohun tó bá Ọlọ́run mu mọ́ láì fi ọ̀kan ṣoṣo lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Àwòrán olùṣọ́ àgùntàn àti agbo ni a pa mọ́; a yẹra fún ọ̀rọ̀ ipò ẹ̀sìn tó lè fa ẹ̀kọ́ ìjọ kan wọ inú ẹsẹ náà.
