  source_fidelity: Àtúnṣe kékeré ni a nílò. Ìtumọ̀ náà pa àṣẹ láti ṣe iṣẹ́ olùṣọ́-àgùntàn, agbo náà gẹ́gẹ́ bí ohun ti Ọlọ́run ní, iṣẹ́ àbójútó, àti àwọn ìyàtọ̀ méjì náà mọ́. Ṣùgbọ́n “èrè tí ó bani lẹ́rù” túmọ̀ sí èrè tí ń dẹ́rùba ẹni, kì í sì í gbé ìtumọ̀ αἰσχροκερδῶς (“èrè ìtìjú/sọ́dà”) yẹ̀ wá. “Ní ìbámu pẹ̀lú Ọlọ́run” jẹ́ ọ̀nà tó dára jù fún fífi κατὰ θεόν sílẹ̀ ní ṣókí láì dá ìtumọ̀ rẹ̀ lórí ìfẹ́ Ọlọ́run nìkan.
