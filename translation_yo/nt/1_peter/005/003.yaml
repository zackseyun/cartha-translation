source:
  edition: SBLGNT
  text: μηδ’ ὡς κατακυριεύοντες τῶν κλήρων ἀλλὰ τύποι γινόμενοι τοῦ ποιμνίου·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/003.yaml
  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: yo
  text: Ẹ má sì máa fi agbára jọba lórí àwọn tí a fi sí àbójútó yín[a], ṣùgbọ́n ẹ máa di àpẹẹrẹ fún agbo náà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ má sì máa fi agbára jọba lórí àwọn ìpín tí a pín fún yín.” Ní ti gidi, èdè Gíríìkì náà sọ pé “àwọn ìpín” tàbí “àwọn ohun tí a pín”; ó ṣeé ṣe kó tọ́ka sí àwọn apá nínú agbo Ọlọ́run tí a fi sí àbójútó olúkúlùkù alàgbà.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: ẹ má sì ṣe bí ẹni tí
  rationale: Ó tẹ̀ síwájú nínú ìkìlọ̀ ẹsẹ tó ṣáájú, ó sì ṣàlàyé irú ọ̀nà tí àwọn alàgbà kò gbọdọ̀ gbà ṣe iṣẹ́ wọn.
- source_word: κατακυριεύοντες
  choice: ń jẹ olórí aláṣẹ lórí
  rationale: Gbólóhùn yìí tọ́ka sí lílo ipò àṣẹ lọ́nà ìfipá-gúnni-lórí, kì í ṣe sí gbogbo ìdarí tàbí àṣẹ tó bófin mu.
- source_word: τῶν κλήρων
  choice: àwọn tí a fi sí àbójútó yín
  rationale: Ní ti gidi, ọ̀rọ̀ náà túmọ̀ sí ‘àwọn ìpín tí a pín fúnni’; nínú àyíká iṣẹ́ olùṣọ́-agutan yìí, ó tọ́ka sí àwọn ènìyàn Ọlọ́run tí a yàn sí abẹ́ àbójútó àwọn alàgbà.
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìwà tí a kọ̀ sílẹ̀ wé ìwà rere tí a béèrè, ní ìyàtọ̀ tó lágbára.
- source_word: τύποι
  choice: àpẹẹrẹ
  rationale: Ó túmọ̀ sí àwòṣe tàbí àpẹẹrẹ tí àwọn ẹlòmíràn lè tẹ̀ lé.
- source_word: γινόμενοι
  choice: ẹ máa di
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe náà mọ́, pé kí ìwà wọn wá di àpẹẹrẹ ní ti gidi, dípò sísọ pé kí wọ́n kàn ‘jẹ́’ àpẹẹrẹ.
- source_word: τοῦ ποιμνίου
  choice: agbo náà
  rationale: Ó pa àwòrán iṣẹ́ olùṣọ́-agutan mọ́, níbi tí agbo ti dúró fún àwùjọ àwọn onígbàgbọ́.
theological_decisions:
- issue: Ìtumọ̀ κλήρων nípa iṣẹ́ aṣáájú ìjọ
  choice: Ó tọ́ka sí àwọn onígbàgbọ́ tí a fi sí abẹ́ àbójútó àwọn alàgbà, kì í ṣe ohun-ìní wọn.
  alternative: Kí a túmọ̀ ọ́ ní tààrà sí ‘àwọn ìpín’ tàbí sí agbègbè àṣẹ àwọn alàgbà.
  rationale: Àyíká ọ̀rọ̀ náà ń sọ nípa ṣíṣe olùṣọ́ agbo Ọlọ́run. Ìtumọ̀ yìí fi hàn pé ojúṣe àbójútó ni, kì í ṣe pé àwọn alàgbà ni àwọn ènìyàn náà.
- issue: Agbára κατακυριεύοντες
  choice: Ó kọ lílo àṣẹ lọ́nà ìfipá-gúnni-lórí, kì í kọ gbogbo àṣẹ aṣáájú.
  alternative: Pé ó kọ gbogbo ipa ìṣàkóso àwọn alàgbà.
  rationale: Ọ̀rọ̀ Gíríìkì náà dá lórí lílo ipò olúwa lọ́nà ìnilára. Ẹsẹ náà fi ìdarí búburú wé ìdarí nípasẹ̀ àpẹẹrẹ, kì í ṣe pé ó fòpin sí ìdarí.
translation_notes:
  register: Èdè Yorùbá àpapọ̀, tó bójú mu, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ’ gẹ́gẹ́ bí ọ̀rọ̀ àṣẹ sí ọ̀pọ̀ ènìyàn, a sì pa àwòrán ‘agbo’ mọ́.
