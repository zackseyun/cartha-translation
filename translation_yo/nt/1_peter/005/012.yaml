id: 1PE.5.12
reference: 1 Peter 5:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: yo
  text: Nípasẹ̀ Sílífánù, arákùnrin olóòótọ́ náà, gẹ́gẹ́ bí mo ti mọ̀ ọ́, ni mo kọ̀wé ní ṣókí[a] sí yín, láti gba yín níyànjú àti láti jẹ́rìí pé èyí ni oore-ọ̀fẹ́ Ọlọ́run tòótọ́. Ẹ dúró ṣinṣin nínú rẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Mo kọ ọ̀rọ̀ díẹ̀ sí yín.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn àfọwọ́kọ kan ní, “nínú èyí tí ẹ dúró,” dípò “Ẹ dúró ṣinṣin nínú rẹ̀.”
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: nípasẹ̀ Sílífánù
  rationale: διά pẹ̀lú ẹ̀yà genitive ń tọ́ka sí aṣojú tàbí ọ̀nà tí a gbà ṣe ohun kan; yíyan yìí kò pinnu bóyá Sílífánù jẹ́ akọ̀wé tàbí ẹni tó gbé lẹ́tà náà.
- source_word: Σιλουανοῦ
  choice: Sílífánù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà gẹ́gẹ́ bí ìró fọ́ọ̀mù Gíríìkì, dípò lílo fọ́ọ̀mù kúkúrú ‘Sílà.’
- source_word: τοῦ πιστοῦ ἀδελφοῦ
  choice: arákùnrin olóòótọ́
  rationale: πιστός lè túmọ̀ sí ẹni olóòótọ́ tàbí ẹni tí a lè gbẹ́kẹ̀ lé; ‘olóòótọ́’ jẹ́ ọ̀rọ̀ àdánidá nínú ọ̀rọ̀ ìyìn yìí, arákùnrin sì tọ́ka sí ọkùnrin kan pàtó.
- source_word: ὡς λογίζομαι
  choice: bí mo ti kà á sí
  rationale: Ó fi ìdájọ́ tàbí èrò Pétérù fúnra rẹ̀ nípa Sílífánù hàn, láìsọ ọ́ di ìdánilójú tí kò ní ààlà.
- source_word: δι’ ὀλίγων
  choice: kúkúrú
  rationale: Gbólóhùn náà túmọ̀ sí pé ó kọ ohun díẹ̀ tàbí pé ó kọ ọ́ ní ṣókí; ọ̀rọ̀ yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ἔγραψα
  choice: Mo ti kọ̀wé
  rationale: Aorist epistolary náà lè jẹ́ kí olùkọ̀wé sọ lẹ́tà tí àwọn olùgbà yóò ti rí bí ohun tí ó ti kọ; perfect Yorùbá yìí bá ìlò náà mu.
- source_word: παρακαλῶν
  choice: mo ń gba yín níyànjú
  rationale: Ó pa agbára ìrọ̀, ìṣírí àti ìkìlọ̀ ìwà rere mọ́ ní èdè Yorùbá tí ó ṣe kedere.
- source_word: ἐπιμαρτυρῶν
  choice: mo sì ń jẹ́rìí
  rationale: Ó pa agbára ìjẹ́rìí àti ìmúdájú ọlọ́wọ̀ sí ohun tí a sọ mọ́.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: pé èyí ni oore-ọ̀fẹ́ Ọlọ́run tòótọ́
  rationale: Ó pa ‘èníyìí/èyí’ sílẹ̀ láìfi dandan mọ́ ohun kan ṣoṣo, ó sì ṣàfihàn ἀληθῆ gẹ́gẹ́ bí ‘tòótọ́.’
- source_word: εἰς ἣν στῆτε
  choice: Ẹ dúró ṣinṣin nínú rẹ̀
  rationale: στῆτε nínú SBLGNT jẹ́ àṣẹ; ‘dúró ṣinṣin’ fi ìfaradà àti ìdúróṣinṣin hàn, ‘nínú rẹ̀’ sì tọ́ka padà sí oore-ọ̀fẹ́.
theological_decisions:
- issue: Ohun tí ‘èyí’ ń tọ́ka sí nínú ‘èyí ni oore-ọ̀fẹ́ Ọlọ́run tòótọ́’
  choice: A fi ‘èyí’ sílẹ̀ kí ó lè tọ́ka sí ohun tí Pétérù ti kọ àti ìjẹ́rìí rẹ̀ nípa oore-ọ̀fẹ́ Ọlọ́run.
  alternative: Ó lè tọ́ka ní pàtó sí ìrírí oore-ọ̀fẹ́ àwọn olùgbà, tàbí sí ìhìn rere tí Sílífánù mú.
  rationale: Àyíká ọ̀rọ̀ nípa kíkọ̀wé, gbígba níyànjú àti jíjẹ́rìí ṣe àtìlẹ́yìn fún ìtumọ̀ tó gbòòrò; a kò dín àìṣe kedere inú ọ̀rọ̀ náà kù.
- issue: Agbára στῆτε ní òpin ẹsẹ
  choice: 'Àṣẹ: ‘Ẹ dúró ṣinṣin nínú rẹ̀.’'
  alternative: 'Àwọn àfọwọ́kọ kan ní indicative: ‘nínú èyí tí ẹ dúró.’'
  rationale: Ọ̀rọ̀ SBLGNT tí a pèsè ní στῆτε gẹ́gẹ́ bí àṣẹ; a tẹ̀ lé e nínú ọ̀rọ̀ pàtàkì, a sì tọ́ka sí ẹ̀dà mìíràn nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn níbi tí ó bá jẹ́ àdánidá. A fi gbólóhùn àfikún ‘bí mo ti kà á sí’ sí àárín àmì kọ́mà, a sì pa gbogbo àmì àlàyé ìsàlẹ̀ mọ́ nínú ọ̀rọ̀ pàtàkì.
