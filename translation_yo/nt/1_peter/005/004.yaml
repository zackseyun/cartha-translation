source:
  edition: SBLGNT
  text: καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: yo
  text: Nígbà tí a bá fi Olórí àwọn olùṣọ́-àgùntàn hàn[a], ẹ̀yin yóò gba adé ògo tí kì í ṣígbẹ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí Olórí àwọn olùṣọ́-àgùntàn bá farahàn.”
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀ Giriki fún “adé” lè tọ́ka sí ohun tí a hun sí orí, tí a máa ń fi fún ẹni tó ṣẹ́gun gẹ́gẹ́ bí èrè ọlá; kì í ṣe adé ọba nìkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: nígbà tí ... bá farahàn
  rationale: Aorist passive participle nínú genitive absolute ní ìtumọ̀ àkókò. “Bá farahàn” jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ìfarahàn ẹni tí a kò rí tẹ́lẹ̀, ó sì lè gbé ìtumọ̀ pé a fi í hàn; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ passive mọ́ ní kedere.
- source_word: ἀρχιποίμενος
  choice: Olórí Àwọn Olùṣọ́-àgùntàn
  rationale: Ọ̀rọ̀ àkópọ̀ náà túmọ̀ sí olùṣọ́-àgùntàn tó ga jù tàbí tó jẹ́ olórí àwọn yòókù. Gbólóhùn yìí ṣe kedere ní Yorùbá, ó sì pa agbára orúkọ oyè náà mọ́.
- source_word: κομιεῖσθε
  choice: ẹ̀yin yóò gba
  rationale: Future middle indicative náà tọ́ka sí gbígba ohun tí a fi ṣe èrè tàbí ọlá. “Yóò gba” jẹ́ ọ̀nà Yorùbá tó rọrùn, tó sì bójú mu ní àyíká yìí.
- source_word: ἀμαράντινον
  choice: tí kì í rẹ̀
  rationale: Adjective náà túmọ̀ sí ohun tí kì í pàdánù dídára tàbí tútù rẹ̀. “Tí kì í rẹ̀” jẹ́ àwòrán Yorùbá tó ṣe kedere, kò sì fi ìtumọ̀ tó lágbára ju ti Giriki lọ kún un.
- source_word: τῆς δόξης
  choice: ògo
  rationale: A pa genitive náà mọ́ nínú “adé ògo,” dípò yíyí i sí “adé ológo,” kí ìṣọ̀kan àwòrán àti àìdánilójú kékeré tó wà nínú ọ̀rọ̀ Giriki lè dúró.
- source_word: στέφανον
  choice: adé
  rationale: “Adé” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù fún στέφανος, ṣùgbọ́n ọ̀rọ̀ Giriki lè jẹ́ òdòdó tàbí ohun tí a hun sí orí gẹ́gẹ́ bí àmì ìṣẹ́gun àti ọlá, kì í ṣe adé ọba nìkan; a ṣàlàyé èyí ní àlàyé ìsàlẹ̀ ojú ìwé.
theological_decisions:
- issue: Ta ni “Olórí Àwọn Olùṣọ́-àgùntàn” ń tọ́ka sí?
  choice: Orúkọ oyè fún Jésù Kristi
  alternative: Kí a fi “Kristi” tàbí “Jésù” kún ọ̀rọ̀ náà ní pàtó
  rationale: Àyíká ìṣọ́-àgùntàn àti ìfarahàn ọjọ́ iwájú tọ́ka sí Jésù, ṣùgbọ́n a kò fi orúkọ tí kò sí nínú ẹsẹ náà kún un. Lílò lẹ́tà ńlá fi hàn pé orúkọ oyè ni.
- issue: Èdè ìfarahàn ní ọjọ́ iwájú
  choice: bá farahàn
  alternative: nígbà tí a bá fi ... hàn
  rationale: “Bá farahàn” jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìfarahàn mọ́ láì ṣàlàyé bí ìṣẹ̀lẹ̀ náà yóò ṣe rí. Àlàyé [a] sọ passive nuance náà di mímọ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ọlọ́lá, ó sì yẹ fún kíkà ní gbangba. A lo “ẹ̀yin” láti fi plural second person hàn, àti “Àwọn” nínú orúkọ oyè láti mú ìbáṣepọ̀ arch-shepherd sí àwọn olùṣọ́ yòókù ṣe kedere.
