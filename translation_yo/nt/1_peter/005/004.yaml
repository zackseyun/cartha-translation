  naturalness: ‘Nígbà tí a bá fi ... hàn’ jẹ́ Yorùbá boṣewa, àdánidá fún ìfarahàn passive. ‘Adé ògo tí kì í ṣígbẹ’ jẹ́ kedere fún ohun tí kò ṣègbé tàbí tí kò rọgbẹ. Ìlò lẹ́tà ńlá lórí gbogbo ọ̀rọ̀ inú oyè náà kò pọndandan; lẹ́tà ńlá ìbẹ̀rẹ̀ oyè nìkan tó.
