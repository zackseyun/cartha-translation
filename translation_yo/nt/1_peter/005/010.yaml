id: 1PE.5.10
reference: 1 Peter 5:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: yo
  text: Ṣùgbọ́n Ọlọ́run gbogbo oore-ọ̀fẹ́, ẹni tí ó pè yín sínú ògo ayérayé rẹ̀ nínú Mèsáyà,[a] lẹ́yìn tí ẹ bá ti jìyà fún ìgbà díẹ̀, òun fúnra rẹ̀ yóò mú yín padà sí ipò tí ó yẹ,[b] yóò mú yín dúró ṣinṣin, yóò fún yín ní agbára, yóò sì fi yín lélẹ̀ lórí ìpìlẹ̀ tí ó fẹsẹ̀ múlẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tí a lè túmọ̀ sí “Mèsáyà” tàbí pè ní “Kristi” gẹ́gẹ́ bí ìlò ìbílẹ̀.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “yóò mú yín pé” tàbí “yóò mú yín di pípé.” Ọ̀rọ̀ ìṣe náà tún ní èrò mímú ohun kan padà sí ipò tí ó yẹ.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “yóò fi ìpìlẹ̀ fún yín” tàbí “yóò fi yín lélẹ̀ lórí ìpìlẹ̀ tí ó dúró ṣinṣin.” Ọ̀rọ̀ Gíríìkì náà lo àwòrán ìpìlẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: gbogbo oore-ọ̀fẹ́
  rationale: Ó pa ìtumọ̀ tó kún fún gbogbo oore-ọ̀fẹ́ Ọlọ́run mọ́, ó sì jẹ́ gbólóhùn Yorùbá tí ó mọ́gbọ́n dání.
- source_word: καλέσας
  choice: ẹni tí ó pè
  rationale: Aorist participle náà jẹ́ ìṣe tí ó ti ṣẹlẹ̀; gbólóhùn alátẹ̀lé yìí dára, ó sì ṣe kedere ní Yorùbá.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: sínú ògo ayérayé rẹ̀
  rationale: “Sínú” pa agbára ìtọ́sọ́nà εἰς àti èrò ìkópa nínú ògo náà mọ́, láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός jẹ́ oyè níbí; “Mèsáyà” mú ìtumọ̀ oyè náà jáde, nígbà tí “nínú” pa ìsopọ̀ ἐν mọ́.
- source_word: ὀλίγον παθόντας
  choice: lẹ́yìn tí ẹ bá ti jìyà fún ìgbà díẹ̀
  rationale: Ó ka ὀλίγον gẹ́gẹ́ bí àkókò, ó sì sọ ìbáṣepọ̀ àkókò pẹ̀lú àwọn ọ̀rọ̀ ìṣe ọjọ́ iwájú ní ọ̀nà àdánidá.
- source_word: αὐτὸς
  choice: òun fúnra rẹ̀
  rationale: Ó pa ìtẹnumọ́ mọ́ pé Ọlọ́run fúnra rẹ̀ ni yóò ṣe àwọn ìṣe wọ̀nyí.
- source_word: καταρτίσει
  choice: mú yín padà sí ipò tí ó yẹ
  rationale: Ó mú èrò ṣíṣe ohun tí ó bàjẹ́ padà sí ipò yíyẹ jáde; àlàyé ẹsẹ̀ tún tọ́ka sí ìtumọ̀ “mú pé.”
- source_word: στηρίξει
  choice: mú yín dúró ṣinṣin
  rationale: Ó sọ ìdúróṣinṣin tí ọ̀rọ̀ náà túmọ̀ sí ní Yorùbá tí ó ṣe kedere.
- source_word: σθενώσει
  choice: fún yín lókun
  rationale: Èyí ni ìtumọ̀ tààrà àti àdánidá fún fífún ènìyàn ní agbára.
- source_word: θεμελιώσει
  choice: fi yín lélẹ̀ lórí ìpìlẹ̀ tí ó fẹsẹ̀ múlẹ̀
  rationale: Ó pa àwòrán ìpìlẹ̀ inú ọ̀rọ̀ Gíríìkì mọ́, ó sì yàtọ̀ sí “mú dúró ṣinṣin.”
theological_decisions:
- issue: Ìtumọ̀ Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” sọ ìtumọ̀ oyè náà jáde, nígbà tí àlàyé ẹsẹ̀ fi ọ̀nà ìbílẹ̀ “Kristi” hàn.
- issue: Ìbáṣepọ̀ ìjìyà àti ìṣe Ọlọ́run
  choice: lẹ́yìn tí ẹ bá ti jìyà fún ìgbà díẹ̀
  alternative: nígbà tí ẹ bá ti jìyà fún ìgbà díẹ̀
  rationale: Èyí pa ìtẹ̀lé àkókò tí participle àti àwọn ọ̀rọ̀ ìṣe ọjọ́ iwájú ń tọ́ka sí mọ́, láìsọ ètò ẹ̀kọ́ kan pàtó nípa ìjìyà.
translation_notes:
  register: Yorùbá àpéjọ tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní ni a lò. A lo “ẹ/yín” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμᾶς, a sì fi àmì ohùn sí ibi tí ó bá àdánidá Yorùbá mu. Àwọn ọ̀rọ̀ ìṣe mẹ́rin ní ìparí ni a yà sọ́tọ̀ kí ìtẹnumọ́ àti ìlọsíwájú ọ̀rọ̀ orísun má bàjẹ́.
