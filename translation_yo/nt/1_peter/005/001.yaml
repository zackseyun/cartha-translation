id: 1PE.5.1
reference: 1 Peter 5:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: yo
  text: 'Nítorí náà, mo ń gba àwọn alàgbà láàárín yín níyànjú, èmi, alàgbà ẹlẹgbẹ́ wọn àti ẹlẹ́rìí sí àwọn ìjìyà Mèsáyà[a], ẹni tí ó sì jẹ́ alábàápín nínú ògo tí a óò ṣí payá[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìjìyà Kristi.” A lè tú oyè Gíríìkì Χριστός sí “Mèsáyà” tàbí, gẹ́gẹ́ bí àṣà ìtumọ̀, “Kristi.”
    reason: alternative_reading
  - marker: b
    text: Tàbí, “ẹni tí ó ní ìpín nínú ògo tí a óò ṣí payá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: àwọn alàgbà
  rationale: Ní àyíká ìjọ yìí, ọ̀rọ̀ náà ń tọ́ka sí àwọn aṣáájú ìjọ, kì í ṣe àwọn ọkùnrin àgbà lásán. “Àwọn alàgbà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láìfi ètò ẹ̀sìn kan pàtó kún un.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìparí èrò tàbí ohun tí ó tẹ̀ lé ọ̀rọ̀ tó ṣáájú hàn, ó sì pa ìsopọ̀ ọgbọ́n inú gbólóhùn náà mọ́.
- source_word: ἐν ὑμῖν
  choice: tí ó wà láàárín yín
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé àwọn alàgbà náà wà ní àárín àwọn olùgbọ́ lẹ́tà náà.
- source_word: παρακαλῶ
  choice: mo ń gba ... níyànjú
  rationale: Ó mú ìrọ̀ pẹ̀lú ìtẹnumọ́ àti ìtọ́ni olùṣọ́-àgùntàn jáde, kì í sì í dun bí àṣẹ líle.
- source_word: συμπρεσβύτερος
  choice: alàgbà bíi tiwọn
  rationale: Ó fi hàn pé ẹni tó ń sọ̀rọ̀ pín ipò àti ojúṣe alàgbà kan náà pẹ̀lú wọn; gbólóhùn yìí jẹ́ Yorùbá tó rọrùn ju ọ̀rọ̀ àdàkọ bí “alábàá-alàgbà” lọ.
- source_word: μάρτυς
  choice: ẹlẹ́rìí
  rationale: Ìtumọ̀ pàtàkì níbí ni ẹni tó jẹ́rìí sí ìjìyà Mèsáyà, kì í ṣe dandan ẹni tí a pa nítorí ìgbàgbọ́.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: àwọn ìjìyà Mèsáyà
  rationale: Ó tú ìbáṣepọ̀ genitive náà sí Yorùbá àdánidá, ó sì fi ìjìyà tí Mèsáyà jẹ hàn láìṣe àlàyé tó ju orísun lọ.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè Ẹni Àmì-Òróró níbí; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
- source_word: κοινωνός
  choice: alábàápín
  rationale: Ó tú èrò ẹni tí ó ní ìpín nínú ohun kan jáde ní kúkúrú, Yorùbá àdánidá, láìmú ìtumọ̀ òwò tàbí àjọṣe míì wọlé.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: nínú ògo tí a óò ṣí payá láìpẹ́
  rationale: “A óò ṣí payá” pa ìṣe aláìsọ ẹni tó ṣe é mọ́, “láìpẹ́” sì gbìyànjú láti mú ìretí ọjọ́ iwájú tó sún mọ́ inú μέλλω jáde láìdá àríyànjiyàn nípa àsìkò ìkẹyìn parí.
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ gẹ́gẹ́ bí oyè Kristoloji
  choice: Mèsáyà
  alternative: Kristi
  rationale: “Mèsáyà” jẹ́ kí ìtumọ̀ Ẹni Àmì-Òróró inú oyè Gíríìkì náà hàn; “Kristi” jẹ́ ìtumọ̀ ìbílẹ̀ tó bófin mu, a sì pa á mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Agbára μελλούσης ἀποκαλύπτεσθαι
  choice: tí a óò ṣí payá láìpẹ́
  alternative: tí a óò ṣí payá
  rationale: Èyí pa ìṣe ọjọ́ iwájú àti ìmọ̀lára pé ìṣípayá náà ń sún mọ́ mọ́, ṣùgbọ́n kò pinnu ẹ̀kọ́ kan pàtó nípa bí àsìkò náà ṣe gùn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. “Mo ń gba ... níyànjú” àti “alàgbà bíi tiwọn” jẹ́ ọ̀rọ̀ tí òǹkàwé lásán lè lóye, tí wọn kò sì gbé èdè ẹ̀ka ìjọ kan wọ inú ẹsẹ náà.
