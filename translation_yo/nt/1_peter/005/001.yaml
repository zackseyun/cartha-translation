  to: 'Nítorí náà, mo ń gba àwọn alàgbà láàárín yín níyànjú, èmi, alàgbà ẹlẹgbẹ́ wọn àti ẹlẹ́rìí sí àwọn ìjìyà Mèsáyà[a], ẹni tí ó sì jẹ́ alábàápín nínú ògo tí a óò ṣí payá[b]:'
  rationale: Àtúnṣe náà mú ìtumọ̀ alábàá-alàgbà, ìjẹ́rìí sí ìjìyà, àti ìpín nínú ògo hàn ní Yorùbá ìgbàlódé tó níyì. Ó tún yẹra fún fífi “láìpẹ́” sọ ìmọ̀lára μέλλω di ìdánilójú àsìkò. A ti tún àwọn àlàyé ìsàlẹ̀ ṣe kí àmì kọ̀ọ̀kan lè bá ibi tí ó tọ́ka sí mu, kí b sì lè mú àṣàyàn ìtumọ̀ κοινωνός/gbólóhùn ògo wá.
