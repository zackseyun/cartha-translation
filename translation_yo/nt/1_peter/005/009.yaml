reference: 1 Peter 5:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: yo
  text: Ẹ kọjú ìjà sí i, kí ẹ sì dúró ṣinṣin nínú ìgbàgbọ́, níwọ̀n bí ẹ ti mọ̀ pé àwọn ará yín nínú ìgbàgbọ́ ní ayé ń faradà àwọn ìjìyà irú kan náà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìjìyà irú kan náà ni ń ṣẹ sí ìmúṣẹ láàárín àwọn ará yín nínú ìgbàgbọ́ ní ayé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: sí i
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí tọ́ka padà sí Èṣù ní ẹsẹ 8; ‘kọjú ìjà sí i’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti fi ohun tí a ń tako hàn.
- source_word: ἀντίστητε
  choice: Ẹ kọjú ìjà
  rationale: Àṣẹ aorist náà ń pè fún ìtakò tó pinnu ṣinṣin; gbólóhùn yìí jẹ́ àdánidá, ó sì lágbára ní Yorùbá.
- source_word: στερεοὶ τῇ πίστει
  choice: kí ẹ dúró ṣinṣin nínú ìgbàgbọ́
  rationale: ‘Dúró ṣinṣin’ mú ìtumọ̀ στερεοὶ jáde, ‘nínú ìgbàgbọ́’ sì pa àìdánilójú mọ́ láàárín ìgbẹ́kẹ̀lé ẹni àti ìdúróṣinṣin nínú ìgbàgbọ́ Kristẹni.
- source_word: εἰδότες
  choice: ní mímọ̀ pé
  rationale: Ó pa ìrísí participle Gíríìkì mọ́, ó sì jẹ́ gbólóhùn Yorùbá tó rọrùn.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: irú ìjìyà kan náà
  rationale: Ìlò genitive yìí tọ́ka sí ìjìyà onírúurú kan náà, kì í ṣe dandan pé àwọn ìṣẹ̀lẹ̀ náà bá ara wọn mu pátápátá.
- source_word: ἀδελφότητι
  choice: gbogbo àwọn ará yín nínú ìgbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ orúkọ àpapọ̀ fún gbogbo àwùjọ àwọn onígbàgbọ́; ‘àwọn ará’ jẹ́ ìlò Yorùbá àdánidá tí ó kó ọkùnrin àti obìnrin sínú.
- source_word: ἐν τῷ κόσμῳ
  choice: káàkiri ayé
  rationale: Ó sọ ibi tí àwùjọ àwọn onígbàgbọ́ wà ní Yorùbá àdánidá, láìfi ìtumọ̀ mìíràn kún un.
- source_word: ἐπιτελεῖσθαι
  choice: ń fara dà
  rationale: Ní àjọṣe pẹ̀lú παθημάτων àti ἀδελφότητι, ìtumọ̀ àdánidá ni pé àwọn ará ń ní ìrírí tàbí ń fara da ìjìyà náà; ìtumọ̀ ‘ń parí’ ni a fi sí àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Ìtumọ̀ τῇ πίστει
  choice: nínú ìgbàgbọ́
  alternative: nípasẹ̀ ìgbàgbọ́; nínú ẹ̀kọ́ ìgbàgbọ́
  rationale: Àpilẹ̀kọ Gíríìkì àti àyíká lè tọ́ka sí ìgbàgbọ́ Kristẹni tí wọ́n dúró ṣinṣin nínú rẹ̀, ṣùgbọ́n ó tún lè ní ìtumọ̀ ìgbẹ́kẹ̀lé. Yorùbá yìí kò fi tipátipá yàn ọ̀kan ṣoṣo.
- issue: Ìtumọ̀ ἀδελφότητι
  choice: gbogbo àwọn ará yín nínú ìgbàgbọ́
  alternative: ẹgbẹ́ àwọn arákùnrin; ìdílé àwọn onígbàgbọ́
  rationale: A yàgò fún ọ̀rọ̀ tó lè dà bí ẹni pé àwọn ọkùnrin nìkan ni, nígbà tí orúkọ àpapọ̀ Gíríìkì náà túmọ̀ sí gbogbo àwùjọ àwọn olùgbàgbọ́.
- issue: Ìtumọ̀ ἐπιτελεῖσθαι
  choice: ń fara dà
  alternative: ń dé òpin rẹ̀; ń ṣẹ sí ìmúṣẹ
  rationale: Fáàjì passive infinitive náà ṣòro, ó sì lè ní ìmọ̀lára ìparí tàbí ìmúṣẹ. Ọ̀rọ̀ inú ẹsẹ̀ yìí ṣe àtìlẹ́yìn fún ìrírí ìjìyà; àlàyé ìsàlẹ̀ pa ìtumọ̀ mìíràn mọ́.
translation_notes:
  register: Yorùbá àjùmọ̀lò tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. ‘Àwọn ará yín nínú ìgbàgbọ́’ jẹ́ ọ̀nà àdánidá láti sọ àwùjọ gbogbo àwọn onígbàgbọ́, kì í ṣe ọkùnrin nìkan. Àmì ìsàlẹ̀ [a] wà lẹ́yìn gbólóhùn tó kan ἐπιτελεῖσθαι.
