  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: yo
  text: Nítorí náà, ẹ rẹ ara yín sílẹ̀[a] lábẹ́ ọwọ́ alágbára Ọlọ́run, kí ó lè gbé yín ga ní àkókò tí ó yẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Ẹ jẹ́ kí a rẹ yín sílẹ̀ … kí ó lè gbé yín ga ní àkókò tí ó yẹ.” Àṣẹ Gíríìkì náà wà ní ohùn àìṣe, bí ó tilẹ̀ jẹ́ pé níhìn-ín a sábà lóye rẹ̀ bí àṣẹ tí ó ń tọ́ka sí ara ẹni: “Ẹ rẹ ara yín sílẹ̀.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: ẹ rẹ ara yín sílẹ̀
  rationale: Ọ̀rọ̀ ìṣe náà jẹ́ àṣẹ aláìṣe ní ìrísí Gíríìkì, ṣùgbọ́n nínú ọ̀rọ̀ ìgbaninímọ̀ràn yìí ó lè ní agbára ìtumọ̀ afàyà-ká-ẹni. “Ẹ rẹ ara yín sílẹ̀” jẹ́ Yorùbá àdánidá tí ó pa agbára àṣẹ náà mọ́, nígbà tí gbólóhùn tó tẹ̀ lé e fi hàn pé ìrẹ̀lẹ̀ yìí jẹ́ fífi ara ẹni sábẹ́ agbára Ọlọ́run.
- source_word: οὖν
  choice: Nítorí náà
  rationale: 'Ó so àṣẹ yìí mọ́ ohun tí ó ṣáájú nípasẹ̀ ìyọrísí: Ọlọ́run kọ ojú ìjà sí àwọn agbéraga, ṣùgbọ́n ó fi oore-ọ̀fẹ́ fún àwọn onírẹ̀lẹ̀.'
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα
  choice: lábẹ́ ọwọ́ agbára
  rationale: Ọ̀rọ̀ yìí pa àwòrán Bíbélì mọ́ nípa ọwọ́ Ọlọ́run gẹ́gẹ́ bí àmì agbára àti ìṣàkóso rẹ̀. “Ọwọ́ agbára” jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání láti sọ ọwọ́ alágbára.
- source_word: τοῦ θεοῦ
  choice: Ọlọ́run
  rationale: Ó fi ẹni tí ọwọ́ náà jẹ́ tirẹ̀ hàn ní tààràtà.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó ṣàfihàn ète tàbí àbájáde, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti so ìrẹ̀lẹ̀ wọn pọ̀ mọ́ ìgbéga tí Ọlọ́run yóò ṣe.
- source_word: ὑμᾶς ὑψώσῃ
  choice: ó lè gbé yín ga
  rationale: Ọlọ́run ni ẹni tí a lóye gẹ́gẹ́ bí olùṣe. “Gbé yín ga” pa ìtumọ̀ ọ̀wọ̀, ìdáláre, tàbí ìgbéga tí Ọlọ́run ń fún ẹni onírẹ̀lẹ̀ mọ́, láì sọ ọ́ di gbígbé ara sókè lásán.
- source_word: ἐν καιρῷ
  choice: ní àkókò tí ó yẹ
  rationale: καιρός ń tọ́ka sí àkókò tó bá mu tàbí tó yẹ, kì í ṣe àkókò lásán. Ìtumọ̀ yìí ṣe kedere ní Yorùbá, kò sì fi dandan kún un pé àkókò náà ti jẹ́ yíyan tẹ́lẹ̀.
theological_decisions:
- issue: Ohùn ọ̀rọ̀ ìṣe àti ẹni tó ń ṣe nínú Ταπεινώθητε
  choice: A tú àṣẹ náà sí “ẹ rẹ ara yín sílẹ̀,” ṣùgbọ́n a fi àlàyé sílẹ̀ pé ìrísí Gíríìkì jẹ́ aláìṣe.
  alternative: “Ẹ jẹ́ kí a rẹ yín sílẹ̀.”
  rationale: Èyí pa ojúṣe ènìyàn mọ́ láti tẹríba fún Ọlọ́run, nígbà tí “lábẹ́ ọwọ́ agbára Ọlọ́run” ń dènà ìtumọ̀ pé ó jẹ́ ìrẹ ara ẹni sílẹ̀ tí kò ní í ṣe pẹ̀lú Ọlọ́run. Àlàyé ìsàlẹ̀ ojú-ewé pa àìdánilójú gidi nípa ohùn ọ̀rọ̀ ìṣe náà mọ́.
- issue: Ìtumọ̀ ìgbéga
  choice: “gbé yín ga” ni a lò láì ṣàlàyé irú ìgbéga náà sí i.
  alternative: “fi ọlá fún yín” tàbí “dá yín láre.”
  rationale: ὑψόω lè ní ìmọ̀ ọlá, ìdáláre, tàbí ìgbéga; yíyan ọ̀kan ṣoṣo nínú wọn yóò dín ààyè ìtumọ̀ orísun kù.
translation_notes:
  register: Yorùbá boṣewa, tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ọ̀pọ̀ ènìyàn “ẹ/yín” láti bá ὑμᾶς mu, a sì pa àwòrán “ọwọ́” àti “gbé ga” mọ́ nítorí wọ́n jẹ́ àwòrán pàtàkì nínú orísun.
