id: 1PE.5.14
reference: 1 Peter 5:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: yo
  text: Ẹ kí ara yín pẹ̀lú ìfẹnukonu ìfẹ́. Àlàáfíà fún gbogbo yín tí ẹ wà nínú Mèsáyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, nínú ìtumọ̀ Bíbélì àṣà: “tí ẹ wà nínú Kristi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε ἀλλήλους
  choice: Ẹ … kí ara yín
  rationale: Ọ̀rọ̀ ìṣe àṣẹ náà ń pe gbogbo wọn sí kíkí ara wọn; “kí ara yín” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé láti fi ìṣe alápàdé yìí hàn.
- source_word: ἐν φιλήματι ἀγάπης
  choice: fi ìfẹnukonu ìfẹ́
  rationale: “Fi” fi ọ̀nà tí wọn yóò gbà kí ara wọn hàn; “ìfẹnukonu ìfẹ́” sì pa àjọṣe φίλημα àti ἀγάπη mọ́ láì sọ ọ́ di ohun mìíràn.
- source_word: εἰρήνη
  choice: Àlàáfíà
  rationale: Ó pa kúkúrú àti agbára ọ̀rọ̀ ìbùkún inú ìparí lẹ́tà Gíríìkì mọ́.
- source_word: ὑμῖν πᾶσιν
  choice: fún gbogbo yín
  rationale: Ó fi hàn pé ìbùkún náà kan gbogbo àwọn tí a ń bá sọ, láì yọ ẹnikẹ́ni sílẹ̀.
- source_word: τοῖς ἐν Χριστῷ
  choice: tí ẹ wà nínú Mèsáyà
  rationale: Gbólóhùn náà ń tọ́ka sí àwọn tó wà “nínú” ẹni àmì òróró náà. “Mèsáyà” túmọ̀ Χριστός gẹ́gẹ́ bí oyè, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ àṣà “Kristi” mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστῷ nínú ἐν Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú gbólóhùn yìí, Χριστός ṣi ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni àmì òróró. “Mèsáyà” mú ìtumọ̀ oyè náà jáde, ṣùgbọ́n “Kristi,” tó ti wọ́pọ̀ nínú àṣà ìtumọ̀ Bíbélì Yorùbá, wà nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo èdè Yorùbá ìsinsìnyí tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ẹ fi … kí ara yín” jẹ́ gbólóhùn àṣẹ tó ṣe déédéé, “Àlàáfíà” sì pa ìrísí ìbùkún kúkúrú ti orísun mọ́. A gbé àmì àlàyé [a] sí “Mèsáyà,” nítorí ibẹ̀ ni àṣàyàn “Kristi” ti jẹ mọ́.
