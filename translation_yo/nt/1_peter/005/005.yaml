id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: yo
  text: Bẹ́ẹ̀ náà, ẹ̀yin ọ̀dọ́kùnrin, ẹ tẹrí ba fún àwọn alàgbà. Gbogbo yín sì, ẹ fi ìrẹ̀lẹ̀ wọ̀ ara yín ní ìbáṣepọ̀ pẹ̀lú ara yín,[a] nítorí pé “Ọlọ́run ń takò àwọn agbéraga, ṣùgbọ́n ó ń fún àwọn onírẹ̀lẹ̀ ní oore-ọ̀fẹ́.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ẹ dì ìrẹ̀lẹ̀ mọ́ ara yín.” Ọ̀rọ̀ Gíríìkì náà ń mú àwòrán fífi aṣọ wọ̀ tàbí dídi aṣọ kan mọ́ ara ẹni wá.
    reason: lexical_alternative
  - marker: b
    text: Àyọlò tàbí ìtọ́kasí sí Òwe 3:34 nínú Septuagint, ìtumọ̀ Májẹ̀mú Láéláé sí èdè Gíríìkì.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: Bẹ́ẹ̀ náà
  rationale: Ó so ìṣírí yìí pọ̀ mọ́ àwọn ìtọ́ni tó ṣáájú, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá.
- source_word: νεώτεροι
  choice: ẹ̀yin ọ̀dọ́kùnrin
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀, nítorí náà ìtumọ̀ yìí pa ìyàtọ̀ akọ àti ìbátan wọn pẹ̀lú àwọn alàgbà mọ́.
- source_word: ὑποτάγητε
  choice: ẹ tẹrí ba fún
  rationale: Ó fi ìtẹríba ẹni fúnra rẹ̀ hàn ní Yorùbá tó ṣe kedere, láì sọ ọ́ di ìgbọràn lásán.
- source_word: πρεσβυτέροις
  choice: àwọn alàgbà
  rationale: Àyíká 5:1–4 ń tọ́ka sí àwọn alàgbà ìjọ, bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí àwọn àgbàlagbà ní ibòmíràn.
- source_word: πάντες δὲ ἀλλήλοις
  choice: Gbogbo yín sì ... sí ara yín
  rationale: Ó mú ìṣírí náà gbòòrò sí gbogbo àwùjọ, ó sì pa ìṣe ẹnì kọ̀ọ̀kan sí ẹnì kejì mọ́.
- source_word: ταπεινοφροσύνην
  choice: ìrẹ̀lẹ̀
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ṣe kedere fún ìwà àti èrò onírẹ̀lẹ̀.
- source_word: ἐγκομβώσασθε
  choice: ẹ fi ... wọ ara yín
  rationale: Ó pa àwòrán aṣọ tí a wọ tàbí tí a dì mọ́ ara mọ́, ní èdè Yorùbá tó ṣeé lóye.
- source_word: ἀντιτάσσεται
  choice: kọ ojú ìjà sí
  rationale: 'Ó pa agbára ọ̀rọ̀ Gíríìkì mọ́: Ọlọ́run ń gbé ara rẹ̀ dìde lòdì sí agbéraga, kì í ṣe pé kò fara mọ́ wọn lásán.'
- source_word: δίδωσιν χάριν
  choice: ó ń fi oore-ọ̀fẹ́ fún
  rationale: Ó sọ ìṣe tí gbólóhùn òwe náà gbé kalẹ̀ ní ọ̀nà àdánidá, tí ó sì pa χάρις mọ́ gẹ́gẹ́ bí oore-ọ̀fẹ́.
theological_decisions:
- issue: Ìtọ́kasí πρεσβυτέροις
  choice: àwọn alàgbà ìjọ
  alternative: àwọn ọkùnrin àgbàlagbà lápapọ̀
  rationale: Àwọn ẹsẹ̀ 1–4 lẹ́sẹ̀kẹsẹ̀ ṣáájú ń bá àwọn alàgbà ìjọ sọ̀rọ̀, nítorí náà ìtumọ̀ yẹn ló ṣeé ṣe jù; síbẹ̀, a kò fi “ìjọ” kún ọ̀rọ̀ inú ẹsẹ̀.
- issue: Akọ nínú νεώτεροι
  choice: ẹ̀yin ọ̀dọ́kùnrin
  alternative: ẹ̀yin tí ẹ jẹ́ ọ̀dọ́ / àwọn ọ̀dọ́
  rationale: Fọ́ọ̀mù Gíríìkì jẹ́ akọ ní ọ̀pọ̀. Ìtumọ̀ náà pa èyí mọ́, nígbà tí “gbogbo yín” tó tẹ̀ lé e mú àṣẹ ìrẹ̀lẹ̀ dé ọ̀dọ̀ gbogbo ènìyàn.
- issue: Àwòrán ἐγκομβώσασθε
  choice: fi ìrẹ̀lẹ̀ wọ ara yín
  alternative: dì ìrẹ̀lẹ̀ mọ́ ara yín
  rationale: Mejèèjì lè gbé àwòrán aṣọ tàbí aṣọ iṣẹ́ jáde. “Wọ ara yín” dára sí Yorùbá, a sì ṣàlàyé ìtumọ̀ “dì mọ́ra” nínú àlàyé ìsàlẹ̀.
- issue: Ìbáṣepọ̀ mọ́ Òwe 3:34
  choice: fi àmì ọ̀rọ̀ àyọlò hàn
  alternative: fi sílẹ̀ láìsí àmì ọ̀rọ̀ àyọlò
  rationale: Gbólóhùn náà jẹ́ àyọlò tàbí ìtọ́kasí tó sún mọ́ Òwe 3:34 LXX; àmì ọ̀rọ̀ àyọlò jẹ́ kí ìpìlẹ̀ Ìwé Mímọ́ fún ìṣírí náà hàn.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. A lo “ẹ” fún àṣẹ ọ̀pọ̀ ènìyàn, “tẹrí ba” fún ìtẹríba, àti “kọ ojú ìjà sí” láti pa agbára ἀντιτάσσεται mọ́.
