  source_fidelity: 'Ìtumọ̀ náà dá àwọn ìpìlẹ̀ Gíríìkì pàtàkì mọ́: νεώτεροι gẹ́gẹ́ bí “ẹ̀yin ọ̀dọ́kùnrin,” πρεσβυτέροις gẹ́gẹ́ bí “àwọn alàgbà,” àti ìfẹ̀hónúhàn pé àṣẹ kejì kan gbogbo àwùjọ. Síbẹ̀, gbolóhùn fún ἐγκομβώσασθε ... ἀλλήλοις nílò àtúnṣe kí ìbátan “sí ara yín” má bà a jẹ́, kí ó sì jẹ́ Yorùbá mímọ́. “Ń takò” sì jẹ́ ìtumọ̀ tààrà àti àdánidá jù “kọ ojú ìjà sí” lọ fún ἀντιτάσσεται.'
