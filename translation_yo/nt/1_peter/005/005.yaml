revisions:
- from: Bẹ́ẹ̀ náà, ẹ̀yin ọ̀dọ́kùnrin, ẹ tẹrí ba fún àwọn alàgbà. Gbogbo yín sì, ẹ fi ìrẹ̀lẹ̀ wọ ara yín sí ara yín,[a] nítorí pé, “Ọlọ́run kọ ojú ìjà sí àwọn agbéraga, ṣùgbọ́n ó ń fi oore-ọ̀fẹ́ fún àwọn onírẹ̀lẹ̀.”[b]
  to: Bẹ́ẹ̀ náà, ẹ̀yin ọ̀dọ́kùnrin, ẹ tẹrí ba fún àwọn alàgbà. Gbogbo yín sì, ẹ fi ìrẹ̀lẹ̀ wọ̀ ara yín ní ìbáṣepọ̀ pẹ̀lú ara yín,[a] nítorí pé “Ọlọ́run ń takò àwọn agbéraga, ṣùgbọ́n ó ń fún àwọn onírẹ̀lẹ̀ ní oore-ọ̀fẹ́.”[b]
  rationale: A tún gbolóhùn àárín ẹsẹ̀ ṣe kí àṣẹ láti “fi ìrẹ̀lẹ̀ wọ̀ ara ẹni” jẹ́ Yorùbá tó pé, kí “ní ìbáṣepọ̀ pẹ̀lú ara yín” sì gbé ipa ἀλλήλοις kalẹ̀. A tún yí ìtumọ̀ ἀντιτάσσεται sí “ń takò,” a sì ṣe àtúnṣe kékeré sí ìṣọ̀kan ọ̀rọ̀ “ń fún ... ní oore-ọ̀fẹ́.” Àwọn àmì ìsàlẹ̀ ni a pa mọ́ pẹ̀lú àmì wọn, a sì tún wọn ṣe díẹ̀ fún ìmọ́tótó Yorùbá.
