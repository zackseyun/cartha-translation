id: 1PE.5.8
reference: 1 Peter 5:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: yo
  text: Ẹ máa ronú kedere[a]; ẹ máa wà lójúfò. Alátakò yín, Èṣù, ń rìn káàkiri[b] bíi kìnnìún tí ń ké ramúramù; ó ń wá ẹni láti jẹ ẹ́ run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Ẹ máa ní ìkóra-ẹni,” tàbí, ní ọ̀nà ìtumọ̀ àtijọ́, “Ẹ máa wà ní àìmutí.” Ní ti gidi, ọ̀rọ̀ Gíríìkì νήψατε ní í ṣe pẹ̀lú àìmutí, ṣùgbọ́n níbí ó ń tọ́ka sí ríronú kedere àti ìkóra-ẹni-níjàánu nígbà ìkọlù ẹ̀mí, kì í ṣe yíyẹra fún ọtí.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí, “ń yọ́ lọ káàkiri.” Ní ti gidi, ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí “ń rìn káàkiri” tàbí “ń lọ káàkiri”; àwòrán kìnnìún náà fúnra rẹ̀ sì ń fi ewu hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε (νήφω)
  choice: Ẹ máa ronú kedere
  rationale: Ní ti gidi, ọ̀rọ̀ náà lè túmọ̀ sí jíjẹ́ aláìmutípara, ṣùgbọ́n ní gbogbo lílò rẹ̀ nínú Májẹ̀mú Tuntun ó ń tọ́ka lọ́nà àpẹẹrẹ sí ọpọlọ tí ó mọ́, ìkóra-ẹni-níjàánu, àti ìmúrasílẹ̀. Níbí, ‘ronú kedere’ fi ìtumọ̀ náà hàn láìdà á pọ̀ mọ́ ‘ẹ máa ṣọ́ra’ tó tẹ̀ lé e.
- source_word: γρηγορήσατε
  choice: ẹ máa ṣọ́ra
  rationale: Ó sọ pé kí àwọn olùgbọ́ máa wà lójúfò, kí wọ́n sì má ṣe jẹ́ kí ewu bá wọn láìmọ̀.
- source_word: ἀντίδικος
  choice: Alátakò
  rationale: Ọ̀rọ̀ náà lè ní ìtumọ̀ alatako ní ilé-ẹjọ́, ṣùgbọ́n níbí ó túmọ̀ sí ẹni tó dúró lòdì sí wọn lápapọ̀; ‘alátakò’ pa ìtẹnumọ́ méjèèjì mọ́ láìfi ohun míì kún un.
- source_word: διάβολος
  choice: èṣù
  rationale: Níbí, ọ̀rọ̀ náà jẹ́ orúkọ ìdánimọ̀ fún ẹni búburú náà, kì í ṣe ‘abanijẹ́’ kan lásán.
- source_word: ὡς λέων ὠρυόμενος
  choice: bíi kìnnìún tí ń ké ramúramù
  rationale: Ó pa àfiwé àti àwòrán kìnnìún tó ń ké pẹ̀lú ewu rẹ̀ mọ́ ní Yorùbá àdánidá.
- source_word: περιπατεῖ
  choice: ń rìn káàkiri
  rationale: Èyí tẹ̀ lé ìtumọ̀ ìpìlẹ̀ ọ̀rọ̀ Gíríìkì náà, ‘ń rìn’ tàbí ‘ń lọ káàkiri,’ nígbà tí àwòrán kìnnìún fúnra rẹ̀ ń fi ewu hàn.
- source_word: ζητῶν τινα καταπιεῖν
  choice: ó ń wá ẹni tí yóò jẹ run
  rationale: Èyí sọ ìwá kiri ẹni kan àti ète ìparun tó wà nínú àwòrán ẹranko apanirun náà ní Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Bóyá διάβολος yẹ kí ó jẹ́ orúkọ àpèjúwe gbogbogbò (‘abanijẹ́’) tàbí ìdánimọ̀ ẹni búburú náà
  choice: èṣù
  alternative: abanijẹ́
  rationale: Àyíká ọ̀rọ̀ náà ń tọ́ka sí alátakò búburú kan pàtó, kì í ṣe ẹnikẹ́ni tó ń sọ̀rọ̀ ẹ̀gàn lásán.
- issue: Bí a ṣe yẹ kí a fi agbára àwòrán kìnnìún sínú περιπατεῖ tó
  choice: ń rìn káàkiri
  alternative: ń yọ́ lọ káàkiri bí ẹranko ọdẹ
  rationale: Ìtumọ̀ tó wọ́pọ̀ jù fún ọ̀rọ̀ Gíríìkì náà ni ‘rìn káàkiri.’ Àfiwé kìnnìún tó ń ké ti fi ewu àti ìwá ọdẹ hàn, nítorí náà kò yẹ kí a fi ìtumọ̀ tí ó lágbára sí i sínú ọ̀rọ̀-ìṣe náà láìsí àlàyé.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Àṣẹ ọ̀pọ̀ ènìyàn ‘Ẹ máa…’ pa ìtẹnumọ́ àwọn ọ̀rọ̀-àṣẹ Gíríìkì méjèèjì mọ́, ‘ronú kedere’ àti ‘ṣọ́ra’ sì wà ní ọ̀tọ̀ kí ìtumọ̀ wọn má bàa dàpọ̀.
