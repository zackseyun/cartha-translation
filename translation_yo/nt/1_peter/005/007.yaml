  text: casting all your anxiety on him[c][b][a], because he cares for you.
translation:
  language: yo
  text: Ẹ fi gbogbo àníyàn yín[a] lé e[b] lórí, nítorí ó[c] bìkítà fún yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Àníyàn” tún lè túmọ̀ sí “ìtọ́jú ọkàn” tàbí “ìfẹ̀kùfẹ̀”; níhìn-ín, ó ń tọ́ka sí ìtọ́jú ọkàn tí ó kún fún ìdààmú.
    reason: lexical_alternative
  - marker: b
    text: 'Ní ti gígúnlẹ̀ ọrọ̀ Gíríìkì: “nígbà tí ẹ ti fi [àníyàn yín] lé e lórí” tàbí “nípa fífi [àníyàn yín] lé e lórí.”'
    reason: lexical_alternative
  - marker: c
    text: Àwọn ọ̀rọ̀ arọ́pò-orúkọ “e” àti “ó” ń tọ́ka sí Ọlọ́run, gẹ́gẹ́ bí àyíká ẹsẹ 6 ṣe fi hàn.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: gbogbo àníyàn yín
  rationale: “Gbogbo” preserves the comprehensive force of πᾶσαν, while “àníyàn” naturally denotes anxious care or worry in this pastoral context; “yín” correctly reflects the plural ὑμῶν.
- source_word: ἐπιρίψαντες ἐπ’ αὐτόν
  choice: Ẹ máa kó … lé e lórí
  rationale: The idiom “kó … lé e lórí” preserves the image of transferring a burden onto someone. The imperative-like Yoruba construction reflects the participle’s dependence on the exhortation in verse 6 without forcing an awkward wooden participle.
- source_word: ὅτι
  choice: nítorí
  rationale: Clearly introduces the reason for entrusting one’s anxieties to him.
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: ó bìkítà fún yín
  rationale: “Bìkítà fún” is natural current Yoruba for active personal concern and avoids suggesting merely thinking about someone.
theological_decisions:
- issue: Referent of αὐτόν/αὐτῷ
  choice: The pronouns remain “e/ó,” referring contextually to God
  alternative: Explicitly say “Ọlọ́run”
  rationale: Verse 6 makes God the natural referent, but retaining pronouns preserves the Greek wording and avoids adding an explicit noun within this verse.
- issue: Syntactic relation of ἐπιρίψαντες to verse 6
  choice: Render it as a continuing exhortation, “Ẹ máa kó…”
  alternative: A more formally participial rendering such as “nípa kíkó…”
  rationale: The Greek participle is linked to the preceding command to humble yourselves. Natural Yoruba needs a finite exhortational expression here; the footnote preserves the literal participial form.
translation_notes:
  register: Standard Yoruba with natural tone marks and a dignified, accessible pastoral register. The plural second-person is represented by “ẹ/yín.” Footnote order follows the point at which the relevant wording occurs in the Yoruba text.
