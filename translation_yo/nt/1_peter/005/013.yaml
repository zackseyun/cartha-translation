  source_fidelity: 'Ìtumọ̀ náà pa àwọn ohun pàtàkì Gíríìkì mọ́: ẹni tí a kò dárúkọ tí ó wà ní Bábílónì, ìyàn rẹ̀ pẹ̀lú àwọn olùgbọ́, ìkíni, Máàkù, àti “ọmọ mi.” Síbẹ̀, lílo “kí yín” láìsí àmì àsìkò lè dà bí ohun tí a ń pàṣẹ tàbí ìṣẹ̀lẹ̀ tí ó ti kọjá; “ń kí yín” fi ìṣe ìkíni nínú lẹ́tà hàn kedere.'
  naturalness: “Bẹ́ẹ̀ náà ni Máàkù, ọmọ mi, kí yín” kò rọrùn gan-an nínú Yorùbá òde òní. “Máàkù, ọmọ mi, náà sì ń kí yín” jẹ́ ìṣọ̀kan gbolohun tó dáa síi, ó sì pa ìbáṣepọ̀ gbolohun Gíríìkì mọ́.
  terminology: “Bábílónì,” “Máàkù,” àti “ọmọ mi” yẹ. “Tí a yàn papọ̀ pẹ̀lú yín” jẹ́ ìtumọ̀ tó bojúmu fún συνεκλεκτή, láì fi “ìjọ” sínú ọ̀rọ̀ pàtàkì. Nítorí Yorùbá kò ní ìyàtọ̀ akọ/abo nínú “ẹni,” àlàyé ìsàlẹ̀ gbọ́dọ̀ tọ́ka sí abo ẹyọ Gíríìkì náà.
