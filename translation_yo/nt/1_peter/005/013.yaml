id: 1PE.5.13
reference: 1 Peter 5:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: yo
  text: Ẹni tí ó wà ní Bábílónì[a], tí a yàn papọ̀ pẹ̀lú yín, ń kí yín; Máàkù, ọmọ mi[b], náà sì ń kí yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú apá àkọ́kọ́ náà síi pé, “Ìjọ tí ó wà ní Bábílónì, tí a yàn papọ̀ pẹ̀lú yín.” Gíríìkì lo ọ̀rọ̀ abo ẹyọ kan, ṣùgbọ́n kò sọ orúkọ ẹni tàbí ohun tí ó ń ṣàpèjúwe. “Bábílónì” sì lè jẹ́ orúkọ àmì fún Róòmù nínú lílo Kristẹni ìgbà àkọ́kọ́; síbẹ̀, ọ̀rọ̀ náà fúnra rẹ̀ sọ “Bábílónì.”
    reason: alternative_reading
  - marker: b
    text: Ó ṣeé ṣe kí “ọmọ mi” túmọ̀ sí ọmọ nípa ẹ̀mí, kì í ṣe ọmọ tí ó bí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: kí yín
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí kíni tàbí rán ìkíni; “kí yín” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì bá ìwé lẹ́tà mu.
- source_word: ἡ ... συνεκλεκτὴ
  choice: Ẹni ... tí a yàn papọ̀ pẹ̀lú yín
  rationale: Gíríìkì lo àpèjúwe abo ẹyọ kan láì sọ orúkọ tí ó ń ṣe àpèjúwe rẹ̀. Yorùbá kò fi akọ tàbí abo hàn nínú “ẹni,” nítorí náà, gbolohun yìí pa ẹni tí a ń tọ́ka sí mọ́ ní àìsọ pàtó, bí orísun náà ti ṣe.
- source_word: ἐν Βαβυλῶνι
  choice: ní Bábílónì
  rationale: A pa orúkọ ibi tí Gíríìkì sọ mọ́, láì fi “Róòmù” rọ́pò rẹ̀ nínú ọ̀rọ̀ pàtàkì.
- source_word: συνεκλεκτὴ
  choice: tí a yàn papọ̀ pẹ̀lú yín
  rationale: Èyí sọ ìtumọ̀ yíyan ẹni náà papọ̀ pẹ̀lú àwọn olùgbọ́ ní Yorùbá adayeba.
- source_word: Μᾶρκος
  choice: Máàkù
  rationale: Èyí ni ìkọ̀wé orúkọ náà tí ó wọ́pọ̀ nínú Yorùbá.
- source_word: ὁ υἱός μου
  choice: ọmọ mi
  rationale: “Ọmọ mi” jẹ́ ìtumọ̀ adayeba ti ọ̀rọ̀ ìbátan náà ní Yorùbá, ó sì lè jẹ́ ọmọ nípa ẹ̀mí tàbí nípa ara láì pinnu èwo nínú ọ̀rọ̀ pàtàkì.
theological_decisions:
- issue: Ta ni ἡ ... συνεκλεκτὴ ń tọ́ka sí?
  choice: A lo “Ẹni ... tí a yàn papọ̀ pẹ̀lú yín,” láì sọ ẹni náà ní pàtó.
  alternative: “Ìjọ tí ó wà ní Bábílónì, tí a yàn papọ̀ pẹ̀lú yín.”
  rationale: Orísun Gíríìkì ní àpèjúwe abo ẹyọ ṣùgbọ́n kò ní orúkọ tí a sọ jáde. Ọ̀pọ̀ ló ka a sí ìjọ, ṣùgbọ́n fífi “ìjọ” sínú ọ̀rọ̀ pàtàkì yóò tú àìpẹ̀kun orísun náà.
- issue: Ìtumọ̀ Bábílónì
  choice: A pa “Bábílónì” mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Róòmù
  rationale: Gíríìkì sọ Bábílónì ní tààrà; bí ó ṣe lè jẹ́ àmì fún Róòmù jẹ́ ọ̀rọ̀ ìtumọ̀, kì í ṣe ohun tí ó yẹ kí a fi rọ́pò orúkọ inú ọ̀rọ̀.
- issue: Ìbátan Máàkù gẹ́gẹ́ bí “ọmọ mi”
  choice: A pa “ọmọ mi” mọ́.
  alternative: ọmọ mi nípa ẹ̀mí
  rationale: Ó ṣeé ṣe kí ìbátan náà jẹ́ ti ẹ̀mí, ṣùgbọ́n Gíríìkì kò sọ “nípa ẹ̀mí” ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá bá èdè adayeba mu. Ìforúkọsílẹ̀ náà ní ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àìsọ pàtó Gíríìkì mọ́. A fi àmì [a] lẹ́yìn Máàkù láti ṣàlàyé “ọmọ mi,” a sì fi [b] sí òpin fún ìdánimọ̀ ẹni abo tí a yàn àti Bábílónì.
