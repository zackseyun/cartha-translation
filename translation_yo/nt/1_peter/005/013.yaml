    rationale: Ní Yorùbá, “kí yín” lè jẹ́ ìtúmọ̀ tó ṣòro láti yà kúrò ní ìlànà ìfẹ́/àṣẹ tàbí ìṣẹ̀lẹ̀ tí ó ti ṣẹlẹ̀. “Ń kí yín” ń fi ἀσπάζεται, ìkíni nínú lẹ́tà ní àsìkò ìsinsìnyí, hàn dáadáa.
  - severity: low
