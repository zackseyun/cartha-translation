    rationale: Ìsàlẹ̀ nípa ẹni abo tí a kò sọ orúkọ rẹ̀ àti Bábílónì yẹ kí ó so mọ́ “Bábílónì”; ìsàlẹ̀ nípa “ọmọ mi” yẹ kí ó so mọ́ “ọmọ mi.”
