    text: Tàbí, ní títẹ̀lé ọ̀rọ̀ náà gan-an, “Tirẹ̀ ni agbára ìṣàkóso títí dé àwọn ayé àwọn ayé.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural repetition with idiomatic Yorùbá while retaining the source’s unending temporal sense. The footnote is revised to present the source’s ‘ages of ages’ construction more transparently without altering the main text’s meaning.
