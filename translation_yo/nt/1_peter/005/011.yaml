  text: ⸀αὐτῷ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/011.yaml
  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: yo
  text: Tirẹ̀ ni agbára ìṣàkóso láéláé. Àmín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτῷ
  choice: Tirẹ̀ ni
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà wà ní ọ̀nà dátífù, ó sì ń tọ́ka sí Ọlọ́run nínú àyíká ẹsẹ tó ṣáájú. ‘Tirẹ̀ ni’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé agbára ìṣàkóso jẹ́ tirẹ̀, láìfi ìtumọ̀ míì kún un.
- source_word: κράτος
  choice: agbára ìṣàkóso
  rationale: Nínú orin ìyìn, κράτος túmọ̀ sí agbára aláṣẹ tàbí agbára láti ṣàkóso, kì í ṣe okun lásán. ‘Agbára ìṣàkóso’ mú àwọn apá méjèèjì yìí jáde ní Yorùbá òde òní.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: láéláé àti láéláé
  rationale: Gbólóhùn ìyìn yìí ń fi ìgbà tí kò ní òpin hàn pẹ̀lú ìtẹnumọ́. ‘Láéláé àti láéláé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì pa ìtẹnumọ́ náà mọ́.
- source_word: ἀμήν
  choice: Àmín
  rationale: ‘Àmín’ ni ìkọ̀wé àti ọ̀rọ̀ ìjọsìn tí ó ti wọ́pọ̀ ní Yorùbá, ó sì pa ipa ìjẹ́rìí ìparí ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ọ̀rọ̀-ìṣe tí a kò kọ sínú orin ìyìn náà
  choice: Tirẹ̀ ni agbára ìṣàkóso
  alternative: Kí agbára ìṣàkóso jẹ́ tirẹ̀
  rationale: Gíríìkì kò ní ọ̀rọ̀-ìṣe níbí. ‘Tirẹ̀ ni’ jẹ́ gbolohun Yorùbá tó pé, tó sì lè sọ ìní tàbí ìyìn láìpinnu ju ohun tí orísun sọ lọ. Àṣàyàn ‘Kí ... jẹ́ tirẹ̀’ lè mú un dà bí àdúrà tàbí ìfẹ́-ọkàn ní pàtó.
translation_notes:
  register: Yorùbá àfọwọ́kọ, ọlọ́lá, àti èyí tí òǹkàwé òde òní lè lóye ni a lò. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó bá yẹ, a sì pa ìrísí orin ìyìn kúkúrú ti orísun mọ́.
