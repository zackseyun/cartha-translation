id: 1PE.1.12
reference: 1 Peter 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: yo
  text: A sì ṣí i payá fún wọn pé wọ́n ń ṣe iṣẹ́ ìránṣẹ́ ní ti àwọn nǹkan wọ̀nyí[a], kì í ṣe fún ara wọn bí kò ṣe fún yín. Àwọn nǹkan náà ni a ti kéde fún yín nísinsìnyí nípasẹ̀ àwọn tí wọ́n kéde ìhìn rere fún yín[b], nípasẹ̀ Ẹ̀mí Mímọ́ tí a rán láti ọ̀run—àwọn nǹkan tí àwọn áńgẹ́lì ń hára gàgà láti tẹjú wo inú wọn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ́n ń ṣe iṣẹ́ ìránṣẹ́, kì í ṣe fún ara wọn bí kò ṣe fún yín.” Ìṣẹ̀dá gírámà Gíríìkì náà fi àwọn tó jèrè iṣẹ́ àwọn wòlíì hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn tí wọ́n mú ìhìn rere tọ̀ yín wá.” Ọ̀rọ̀-ìṣe Gíríìkì náà túmọ̀ sí pípolongo ìròyìn rere.
    reason: lexical_alternative
  - marker: c
    text: “Tẹjú wo inú” tún lè jẹ́ “yọjú wo inú” tàbí “tẹ̀ sílẹ̀ láti wo inú”; ó ń fi àkíyèsí onítara àti ìfẹ́ jíjinlẹ̀ hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς ἀπεκαλύφθη
  choice: A sì ṣí i payá fún wọn
  rationale: “Fún wọn” tọ́ka padà sí àwọn wòlíì, “ṣí i payá” sì pa èrò ìṣípayá mọ́ láì sọ ẹni tó ṣe é ní pàtó.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν
  choice: kì í ṣe fún ara wọn, bí kò ṣe fún yín, ni wọ́n ń ṣe iṣẹ́ ìránṣẹ́
  rationale: Ó pa ìyàtọ̀ tó lágbára láàárín àwọn tó jèrè iṣẹ́ náà mọ́; “ń ṣe” tún fi ìṣe tó ń bá a lọ ní àkókò ìgbàanì hàn.
- source_word: αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: àwọn nǹkan wọ̀nyí ... Àwọn nǹkan náà ni a ti kéde fún yín nísinsìnyí
  rationale: Ìtúnṣe “àwọn nǹkan” mú ohun tí arọ́pò-orúkọ náà ń tọ́ka sí ṣe kedere, “a ti kéde” sì so ìkéde tó ti ṣẹlẹ̀ mọ́ ìgbà ìsinsìnyí.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: nípasẹ̀ àwọn tí wọ́n mú ìhìn rere tọ̀ yín wá
  rationale: Ó tú èrò ọ̀rọ̀-ìṣe εὐαγγελίζω sí Yorùbá àdánidá, ó sì yẹra fún lílo ọ̀rọ̀ ẹ̀sìn amọ̀jà tí kò ṣe dandan.
- source_word: πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: nípasẹ̀ Ẹ̀mí Mímọ́ tí a rán láti ọ̀run
  rationale: “Nípasẹ̀” fi Ẹ̀mí Mímọ́ hàn gẹ́gẹ́ bí ọ̀nà tàbí aṣojú ìkéde; gbólóhùn tó tẹ̀ lé e sì pa ìránṣẹ́ rẹ̀ láti ọ̀run mọ́.
- source_word: ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: àwọn áńgẹ́lì ń hára gàgà láti tẹjú wo inú wọn
  rationale: “Ń hára gàgà” fi ìfẹ́ tí ó ń bá a lọ hàn, “tẹjú wo inú” sì pa àwòrán àkíyèsí jinlẹ̀ tí παρακύπτω ní mọ́.
theological_decisions:
- issue: Ta ni πνεύματι ἁγίῳ ń tọ́ka sí?
  choice: Ẹ̀mí Mímọ́ gẹ́gẹ́ bí aṣojú Ọlọ́run nínú ìkéde ìhìn rere
  alternative: ẹ̀mí mímọ́ gẹ́gẹ́ bí agbára tàbí ìwà ẹ̀mí lápapọ̀
  rationale: Àyíká ọ̀rọ̀ ìgbàlà àti gbólóhùn “tí a rán láti ọ̀run” ṣe àtìlẹ́yìn fún ẹni jíjẹ́ Ẹ̀mí Mímọ́, láìfi àlàyé ẹ̀kọ́ ìsìn míì kún ẹsẹ náà.
- issue: Ìbáṣepọ̀ iṣẹ́ àwọn wòlíì pẹ̀lú àwọn olùgbọ́ ìhìn rere
  choice: Àwọn wòlíì ń ṣe iṣẹ́ tó ṣe àwọn onígbàgbọ́ ìgbà tó tẹ̀ lé wọn láǹfààní
  alternative: Iṣẹ́ àwọn wòlíì jẹ́ fún àwọn ènìyàn ìgbà tiwọn nìkan
  rationale: Ìyàtọ̀ “kì í ṣe fún ara wọn, bí kò ṣe fún yín” àti ìsopọ̀ rẹ̀ mọ́ ohun tí a kéde nísinsìnyí ló ṣètìlẹ́yìn fún yíyan yìí.
translation_notes:
  register: Yorùbá boṣewa, olóhùn kíkún níbi tó bá jẹ́ àdánidá, pẹ̀lú ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo “iṣẹ́ ìránṣẹ́” dípò ọ̀rọ̀ ṣọ́ọ̀ṣì amọ̀jà, a sì lo “mú ìhìn rere tọ̀ yín wá” fún ìtumọ̀ ọ̀rọ̀-ìṣe Gíríìkì ní èdè àdánidá.
