id: 1PE.1.5
reference: 1 Peter 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: yo
  text: ẹ̀yin tí Ọlọ́run ń fi agbára rẹ̀ ṣọ́ nípasẹ̀ ìgbàgbọ́[a] fún ìgbàlà tí a múra tán láti fi hàn ní àkókò ìkẹyìn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbẹ́kẹ̀lé”; ìtumọ̀ tí kò ṣeé ṣe tó níbí ni, “ìdúróṣinṣin.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní ìgbà tó gbẹ̀yìn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουρουμένους
  choice: ń ṣọ́
  rationale: Ọ̀rọ̀ yìí fi ìṣe tí ń bá a lọ hàn, ó sì pa ìtumọ̀ ṣíṣọ́ tàbí dídáàbò bo ẹni mọ́, gẹ́gẹ́ bí φρουρέω ṣe lè ní ìtumọ̀ olùṣọ́-ogun.
- source_word: ἐν δυνάμει θεοῦ
  choice: Ọlọ́run ń fi agbára rẹ̀
  rationale: Ní àjọṣe rẹ̀ pẹ̀lú ọ̀rọ̀-ìṣe aláìṣe, ἐν ń tọ́ka sí ohun èlò tàbí ọ̀nà tí Ọlọ́run fi ń ṣọ́ wọn. Ìṣípò yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa Ọlọ́run àti agbára rẹ̀ mọ́ láì dá wọn pọ̀.
- source_word: διὰ πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: Nípasẹ̀ ṣe àfihàn ọ̀nà àárín tí διά ń tọ́ka sí; ìgbàgbọ́ ni ìtumọ̀ tó ṣeé ṣe jù lọ fún πίστις ní àyíká ọ̀rọ̀ yìí.
- source_word: εἰς σωτηρίαν
  choice: fún ìgbàlà
  rationale: Fún fi ìfojúsùn tàbí àbájáde tí εἰς ń tọ́ka sí hàn, ó sì jẹ́ èdè Yorùbá tó ṣe déédé.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: tí ó ti ṣetán láti ṣí payá
  rationale: Ṣetán bá ἑτοίμην mu, ṣí payá sì fi ìtumọ̀ ohun tí a óò mú kúrò ní ìkọ̀kọ̀ hàn láì sọ ẹni tí yóò ṣí i payá ní tààrà.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: ní àkókò ìkẹyìn
  rationale: Àkókò lè tọ́ka sí àkókò pàtó tàbí àkókò tí a yàn, ìkẹyìn sì pa ìfojúsọ́nà ọjọ́ iwájú tí ἐσχάτῳ ní mọ́ láì fi ètò ẹ̀kọ́ nípa òpin ayé kún un.
- source_word: τοὺς
  choice: ẹ̀yin tí
  rationale: Ọ̀rọ̀ náà ń padà tọ́ka sí àwọn tí a ń bá sọ̀rọ̀ láti ẹsẹ tó ṣáájú; ẹ̀yin tí so apá yìí mọ́ wọn ní èdè Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìṣọ́ Ọlọ́run àti ìdáhùn ènìyàn nínú διὰ πίστεως
  choice: Ọlọ́run ni ẹni tó ń ṣọ́ wọn pẹ̀lú agbára rẹ̀, ìgbàgbọ́ sì ni ọ̀nà àárín tí ọ̀rọ̀ náà sọ.
  alternative: Kí a ka ìgbàgbọ́ sí àfikún àpèjúwe tí kò ní í ṣe pẹ̀lú bí Ọlọ́run ṣe ń ṣọ́ wọn, tàbí kí a ka πίστις ní pàtàkì sí ìṣòtítọ́.
  rationale: Ìtumọ̀ náà pa agbára Ọlọ́run àti ìgbàgbọ́ mọ́ gẹ́gẹ́ bí gírámà Gíríìkì ṣe gbé wọn kalẹ̀, láì pinnu àríyànjiyàn ẹ̀kọ́ ìsìn nípa ìfaradà tàbí ìṣubú kúrò nínú ìgbàgbọ́.
- issue: Àkókò ìgbàlà tí a ń retí
  choice: Ìgbàlà náà ní ìfarahàn ọjọ́ iwájú ní àkókò ìkẹyìn.
  alternative: Kí ìgbàlà níbí túmọ̀ sí ìyípadà ọkàn ìsinsìnyí nìkan, tàbí kí a sọ pé kò ní apá kankan ní ìsinsìnyí.
  rationale: Gbólóhùn tí ó ti ṣetán láti ṣí payá ní àkókò ìkẹyìn tọ́ka sí ìfarahàn ọjọ́ iwájú, ṣùgbọ́n kò fipá sọ ohun tí ẹsẹ yìí kò sọ nípa àwọn apá ìgbàlà mìíràn.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A lo ẹ̀yin tí láti fi hàn pé ẹsẹ yìí ń tẹ̀ síwájú láti inú gbólóhùn ẹsẹ tó ṣáájú. Ọlọ́run ń fi agbára rẹ̀ ṣọ́ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun èlò ìṣọ́ náà, nígbà tí nípasẹ̀ ìgbàgbọ́ pa ipa ìgbàgbọ́ mọ́.
