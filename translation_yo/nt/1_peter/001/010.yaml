id: 1PE.1.10
reference: 1 Peter 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: yo
  text: Nípa ìgbàlà yìí, àwọn wòlíì tí wọ́n sọ àsọtẹ́lẹ̀ nípa oore-ọ̀fẹ́ fún yín[a] fi taratara wá a, wọ́n sì ṣe ìwádìí rẹ̀ fínnífínní[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oore-ọ̀fẹ́ tí yóò wá sí yín.” Àyíká ọ̀rọ̀ sábà máa ń mú kí a lóye rẹ̀ gẹ́gẹ́ bí ohun tí yóò ṣẹlẹ̀ ní ọjọ́ iwájú, bí ó tilẹ̀ jẹ́ pé ẹsẹ yìí fúnra rẹ̀ kò sọ bẹ́ẹ̀ ní tààràtà.
    reason: alternative_reading
  - marker: b
    text: A tún lè tò ó pé, “Nípa ìgbàlà yìí, àwọn wòlíì fi taratara wá a, wọ́n sì ṣe ìwádìí rẹ̀ fínnífínní—àwọn tí wọ́n sọ àsọtẹ́lẹ̀ nípa oore-ọ̀fẹ́ fún yín.” Ìyípadà ìtò ọ̀rọ̀ yìí kò yí ìtumọ̀ padà.
    reason: previous_rendering
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: Nípa ìgbàlà yìí
  rationale: Nípa sọ pé ohun tí ó tẹ̀ lé ni kókó ọ̀rọ̀; yìí sì tọ́ka padà sí ìgbàlà tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn, láìlo ọ̀rọ̀ Yorùbá tí kò bá ìlò ojoojúmọ́ mu.
- source_word: σωτηρίας
  choice: ìgbàlà
  rationale: Ìgbàlà jẹ́ ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún σωτηρία, ó sì pa ìtumọ̀ ìdáǹdè àti ìgbàlà Ọlọ́run mọ́ nínú àyíká ọ̀rọ̀ yìí.
- source_word: ἐξεζήτησαν
  choice: fi taratara wá a
  rationale: Ọ̀rọ̀-ìṣe náà tọ́ka sí wíwá ohun kan pẹ̀lú ìtara. Fífi ‘a’ kún un mú ohun tí wọ́n ń wá—ìgbàlà—hàn gbangba ní Yorùbá.
- source_word: ἐξηραύνησαν
  choice: ṣe ìwádìí rẹ̀ fínnífínní
  rationale: Èyí yàtọ̀ sí wíwá lásán, ó sì fi ìwádìí jinlẹ̀ hàn; bẹ́ẹ̀ ni a pa ìtẹnumọ́ inú àwọn ọ̀rọ̀-ìṣe méjèèjì mọ́.
- source_word: προφῆται
  choice: àwọn wòlíì
  rationale: Àwọn wòlíì ni ìtumọ̀ adayébá fún ẹgbẹ́ àwọn aṣojú Ọlọ́run tí apá gbólóhùn tó tẹ̀ lé dá mọ̀.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: tí wọ́n sọ àsọtẹ́lẹ̀ nípa oore-ọ̀fẹ́ fún yín
  rationale: A pa ìṣe àpèjúwe tí participle náà ń ṣe mọ́, nígbà tí ‘nípa’ ń fi ohun tí àsọtẹ́lẹ̀ náà dá lé hàn, ‘fún yín’ sì pa ìtumọ̀ ìtọ́sọ́nà àti àǹfààní εἰς ὑμᾶς mọ́.
- source_word: χάριτος
  choice: oore-ọ̀fẹ́
  rationale: Oore-ọ̀fẹ́ jẹ́ ìtumọ̀ Yorùbá tí ó ṣe déédéé fún χάρις nínú àyíká ìgbàlà, ó sì tọ́ka sí ojúrere tí Ọlọ́run fi ń ṣe ènìyàn.
- source_word: εἰς ὑμᾶς
  choice: fún yín
  rationale: Èyí sọ àǹfààní oore-ọ̀fẹ́ náà fún àwọn olùkàwé ní Yorùbá adayébá, láìfi èrò ọjọ́ iwájú tí kò hàn gbangba nínú ẹsẹ yìí kún un.
theological_decisions:
- issue: Bóyá kí a sọ ọjọ́ iwájú di mímọ̀ nínú ‘oore-ọ̀fẹ́ fún yín’
  choice: A fi ‘oore-ọ̀fẹ́ fún yín’ sí ọ̀rọ̀ pàtàkì láìfikún ‘tí yóò dé.’
  alternative: oore-ọ̀fẹ́ tí yóò dé bá yín
  rationale: Àyíká ọ̀rọ̀ àti iṣẹ́ àwọn wòlíì lè mú kí a lóye rẹ̀ gẹ́gẹ́ bí ohun ọjọ́ iwájú, ṣùgbọ́n ẹsẹ yìí kò ní ọ̀rọ̀-ìṣe tàbí participle ọjọ́ iwájú ní kedere. Nítorí náà, a pa àìdájú yẹn mọ́, a sì fi àlàyé mìíràn sínú àkọsílẹ̀ ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní; a lo ‘fi taratara wá a’ àti ‘ṣe ìwádìí rẹ̀ fínnífínní’ láti pa ìyàtọ̀ àti ìtẹnumọ́ àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì mọ́.
