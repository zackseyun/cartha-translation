  text: διότι γέγραπται ⸀ὅτι Ἅγιοι ⸀ἔσεσθε, ὅτι ἐγὼ ⸀ἅγιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/016.yaml
  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: yo
  text: Nítorí a ti kọ ọ́ pé, “Ẹ ó jẹ́ mímọ́”[a], nítorí èmi jẹ́ mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, gẹ́gẹ́ bí àṣẹ tààrà sí i, “Ẹ jẹ́ mímọ́.” Nínú ọ̀rọ̀ Gíríìkì, àyọlò Ìwé Mímọ́ náà lo ọ̀rọ̀ ọjọ́ iwájú pé, “Ẹ ó jẹ́ mímọ́.”
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: nítorí
  rationale: Ó fi ìdí Ìwé Mímọ́ tí àṣẹ tó ṣáájú dúró lé lórí hàn, ó sì pa agbára ìdí mọ́ ní Yorùbá àdánidá.
- source_word: γέγραπται
  choice: a ti kọ ọ́
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó wọ́pọ̀ fún gbólóhùn tí ń tọ́ka sí ohun tí Ìwé Mímọ́ kọ, ó sì fi hàn pé ohun tí a kọ ṣì dúró.
- source_word: ὅτι (quotation marker)
  choice: pé
  rationale: ‘Pé’ ń ṣe iṣẹ́ àmì ìṣáájú ọ̀rọ̀ àyọlò ní Yorùbá lọ́nà àdánidá.
- source_word: Ἅγιοι
  choice: mímọ́
  rationale: ‘Mímọ́’ ni ọ̀rọ̀ Yorùbá tó bójú mu fún ìtumọ̀ ìwà àti májẹ̀mú níbí; kò dín ìtumọ̀ náà kù sí yíya sọ́tọ̀ nìkan.
- source_word: ἔσεσθε
  choice: Ẹ ó jẹ́
  rationale: Ó pa ìrísí ọ̀rọ̀ ọjọ́ iwájú inú Gíríìkì mọ́, nígbà tí ó tún lè gbé agbára àṣẹ inú ọ̀rọ̀ Ìwé Mímọ́ náà.
- source_word: ὅτι (causal)
  choice: nítorí
  rationale: 'Ó sọ ìdí tí àwọn olùgbọ́ fi gbọdọ̀ jẹ́ mímọ́ di mímọ́: Ọlọ́run fúnra rẹ̀ jẹ́ mímọ́.'
- source_word: ἐγὼ
  choice: èmi
  rationale: Fọ́ọ̀mù alágbára ‘èmi’ pa ìtẹnumọ́ arọ́pò-orúkọ Gíríìkì mọ́ nínú ọ̀rọ̀ Ọlọ́run nípa ara rẹ̀.
- source_word: ἅγιος
  choice: mímọ́
  rationale: Lílo ọ̀rọ̀ kan náà ní ìbámu pẹ̀lú àpèjúwe àwọn olùgbọ́ fi ìbáṣepọ̀ láàárín ìwà mímọ́ Ọlọ́run àti ti àwọn ènìyàn rẹ̀ hàn.
theological_decisions:
- issue: Agbára ọ̀rọ̀ ọjọ́ iwájú ἔσεσθε nínú àyọlò nípa ìwà mímọ́
  choice: Ẹ ó jẹ́ mímọ́
  alternative: Ẹ jẹ́ mímọ́; Ẹ yóò jẹ́ mímọ́
  rationale: Ìtumọ̀ yìí pa fọ́ọ̀mù ọjọ́ iwájú Gíríìkì àti ìró àṣẹ inú ọ̀rọ̀ òfin Ìwé Mímọ́ mọ́ papọ̀, láì sọ ọ́ di àsọtẹ́lẹ̀ lásán tàbí yí i padà sí àṣẹ tààrà nìkan.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. ‘Ẹ’ ni a lò nítorí ẹni kejì ọ̀pọ̀ nínú Gíríìkì. A gbé àmì àlàyé [a] sí òpin àyọlò, lẹ́yìn gbólóhùn tó kan ἔσεσθε.
