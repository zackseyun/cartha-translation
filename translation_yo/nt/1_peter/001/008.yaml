id: 1PE.1.8
reference: 1 Peter 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: yo
  text: Bó tilẹ̀ jẹ́ pé ẹ kò tíì rí i, ẹ nífẹ̀ẹ́ rẹ̀. Bó tilẹ̀ jẹ́ pé ẹ kò rí i nísinsìnyí, síbẹ̀ ẹ ń gbà á gbọ́, ẹ sì ń yọ̀ pẹ̀lú ayọ̀ tí a kò lè fi ọ̀rọ̀ sọ, tí ó sì kún fún ògo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ayọ̀ ológo,” tàbí, “ayọ̀ tí a ti ṣe lógo.”
    reason: Ọ̀rọ̀ Giriki δεδοξασμένῃ jẹ́ participle passive perfect; nínú àyíká yìí ó lè túmọ̀ sí ayọ̀ tí ó kún fún ògo, ayọ̀ ológo, tàbí ayọ̀ tí a ti ṣe lógo.
lexical_decisions:
- source_word: ὃν
  choice: i / rẹ̀
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ń tọ́ka sí Jésù Kristi nínú ọ̀rọ̀ tó ṣáájú; lílo ‘i’ àti ‘rẹ̀’ jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí ẹni náà.
- source_word: οὐκ ἰδόντες
  choice: ẹ kò tilẹ̀ tíì rí i
  rationale: Èyí fi hàn pé wọn kò rí i ní àkókò tó ti kọjá títí dé ìsinsìnyí, ó sì bá ọ̀rọ̀ Yorùbá mu láì sọ ìtumọ̀ náà di líle.
- source_word: ἀγαπᾶτε
  choice: ẹ nífẹ̀ẹ́ rẹ̀
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere, tó sì bá ìṣe tó ń bá a lọ mu.
- source_word: εἰς ὃν … πιστεύοντες
  choice: ẹ gbà á gbọ́
  rationale: Nínú àyíká yìí, gbígba ẹnì kan gbọ́ túmọ̀ sí fífi ìgbàgbọ́ sí i; ó jẹ́ ọ̀nà Yorùbá tó ṣe déédéé fún ohun tí Giriki sọ.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: ẹ kò tilẹ̀ rí i nísinsìnyí
  rationale: ‘Nísinsìnyí’ pa ìtọ́kasí sí àkókò ìsinsìnyí mọ́, ní ìyàtọ̀ sí rírí tó ṣeé ṣe lọ́jọ́ iwájú.
- source_word: δὲ
  choice: síbẹ̀ … sì
  rationale: Àwọn ọ̀rọ̀ yìí mú ìyàtọ̀ tó wà láàárín àìrí i àti gbígbà á gbọ́/yíyọ̀ jáde ní Yorùbá àdánidá.
- source_word: ἀγαλλιᾶσθε
  choice: ẹ ń yọ̀
  rationale: Fáàlì ìsinsìnyí náà ń sọ ayọ̀ ńlá tó ń bá a lọ; àpèjúwe ayọ̀ tó tẹ̀ lé e mú agbára ọ̀rọ̀ náà hàn.
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: pẹ̀lú ayọ̀ tí a kò lè fi ọ̀rọ̀ sọ
  rationale: Èyí sọ pé ayọ̀ náà kọjá ohun tí èèyàn lè fi ọ̀rọ̀ ṣàlàyé, ní èdè Yorùbá tó ṣe kedere.
- source_word: δεδοξασμένῃ
  choice: tí ó sì kún fún ògo
  rationale: Perfect passive participle náà lè tọ́ka sí ayọ̀ tí ògo ti bo tàbí tí ó ní ògo. ‘Kún fún ògo’ jẹ́ Yorùbá tó ṣeé lóye, nígbà tí àkọsílẹ̀ ìsàlẹ̀ pa àwọn ìtumọ̀ mìíràn tó ṣeé ṣe mọ́.
theological_decisions:
- issue: Ìtumọ̀ πιστεύοντες pẹ̀lú εἰς ὃν
  choice: ẹ gbà á gbọ́
  alternative: ẹ fi ìgbàgbọ́ sínú rẹ̀ / ẹ gbẹ́kẹ̀ lé e
  rationale: ‘Ẹ gbà á gbọ́’ jẹ́ ọ̀nà Yorùbá àdánidá tó ń fi ẹni tí ìgbàgbọ́ náà dojú kọ hàn, láì fi ẹ̀kọ́ ìsìn kan tí Giriki kò sọ kún un.
- issue: Ìtumọ̀ δεδοξασμένῃ χαρᾷ
  choice: ayọ̀ … tí ó sì kún fún ògo
  alternative: ayọ̀ ológo / ayọ̀ tí a ti ṣe lógo
  rationale: Ọ̀rọ̀ Giriki jẹ́ perfect passive participle, ṣùgbọ́n ìtumọ̀ rẹ̀ nínú àyíká yìí lè jẹ́ pé ayọ̀ náà kún fún ògo, jẹ́ ológo, tàbí pé a ti ṣe é lógo. Ọ̀rọ̀ inú ẹsẹ̀ jẹ́ kedere ní Yorùbá, àkọsílẹ̀ sì pa àìdánilójú yìí mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. A lo ‘ẹ’ gẹ́gẹ́ bí arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, torí lẹ́tà náà ń bá gbogbo àwọn onígbàgbọ́ tí a ń bá sọ̀rọ̀. Ìforúkọsílẹ̀ jẹ́ ọlọ́lá, kedere, ó sì yẹ fún kíkà ní gbangba.
