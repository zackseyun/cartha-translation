id: 1PE.1.2
reference: 1 Peter 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: yo
  text: 'gẹ́gẹ́ bí ìmọ̀-tẹ́lẹ̀[b] Ọlọ́run Baba, nínú ìsọdimímọ́ Ẹ̀mí, fún ìgbọ́ràn àti fífi ẹ̀jẹ̀ Jésù Mèsáyà[a] wọ́n[c]: Kí oore-ọ̀fẹ́ àti àlàáfíà pọ̀ sí i fún yín.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Jésù Kristi.” Oyè Gíríìkì Χριστός lè máa ṣiṣẹ́ bí apá orúkọ ní àwọn àyíká kan; níhìn-ín a lo “Mèsáyà” láti pa agbára rẹ̀ gẹ́gẹ́ bí oyè mọ́.
    reason: alternative_reading
  - marker: b
    text: “Ìmọ̀-tẹ́lẹ̀” ni a fi túmọ̀ πρόγνωσις. Èrò àwọn atúmọ̀ yàtọ̀ sí ara wọn lórí bóyá ìmọ̀ Ọlọ́run ṣáájú, yíyan rẹ̀ ṣáájú, tàbí àwọn méjèèjì ni ọ̀rọ̀ náà tẹnumọ́.
    reason: lexical_alternative
  - marker: c
    text: Ó ṣeé ṣe kí gbólóhùn “fífi ẹ̀jẹ̀ wọ́n” máa ránni létí májẹ̀mú àti ìwẹ̀nùmọ́ nínú Májẹ̀mú Láéláé, pàápàá Ẹ́kísódù 24:8.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: gẹ́gẹ́ bí ìmọ̀-tẹ́lẹ̀
  rationale: “Gẹ́gẹ́ bí” fi ipa κατά hàn gẹ́gẹ́ bí ìbámu pẹ̀lú ìlànà tàbí ohun tí a dá lé; “ìmọ̀-tẹ́lẹ̀” pa ìtumọ̀ πρόγνωσις mọ́ láìfi ẹ̀kọ́ ìsìn kan lé e lórí.
- source_word: θεοῦ πατρός
  choice: Ọlọ́run Baba
  rationale: Ọ̀rọ̀ yìí dá ẹni tí ìmọ̀-tẹ́lẹ̀ náà jẹ́ tirẹ̀ mọ̀, ó sì pa ìfarahàn apposition inú Gíríìkì mọ́ ní Yorùbá àdánidá.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: nínú ìsọdimímọ́ Ẹ̀mí
  rationale: “Ìsọdimímọ́” mú èrò yíyan sí mímọ́ inú ἁγιασμός jáde; “Ẹ̀mí” tọ́ka sí Ẹ̀mí Mímọ́ nítorí ìṣètò onímẹ́ta ẹsẹ náà, nígbà tí “nínú” kò pinnu bóyá genitive náà túmọ̀ sí olùṣe tàbí ohun-ìní.
- source_word: εἰς ὑπακοὴν
  choice: fún ìgbọ́ràn
  rationale: “Fún” fi ète tàbí àbájáde tí εἰς lè tọ́ka sí hàn, “ìgbọ́ràn” sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ὑπακοή.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: àti fífi ẹ̀jẹ̀ … wọ́n
  rationale: Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá fún fífi omi tàbí ẹ̀jẹ̀ wọ́n ohun kan, ó sì pa àwòrán májẹ̀mú àti ìwẹ̀nùmọ́ tí ῥαντισμός ní mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: “Mèsáyà” pa ipa Χριστός gẹ́gẹ́ bí oyè ẹni tí a fòróró yàn mọ́ dípò kí a sọ ọ́ di apá orúkọ lásán.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: Kí oore-ọ̀fẹ́ àti àlàáfíà pọ̀ sí i fún yín
  rationale: Àgbékalẹ̀ “Kí …” fi optative ìbùkún hàn; “pọ̀ sí i” sọ ìtumọ̀ πληθυνθείη ní Yorùbá tó rọrùn, “fún yín” sì pa ὑμῖν mọ́.
theological_decisions:
- issue: Ìtumọ̀ πρόγνωσις ní ìbáṣepọ̀ pẹ̀lú yíyan Ọlọ́run
  choice: ìmọ̀-tẹ́lẹ̀
  alternative: ìpinnu-tẹ́lẹ̀ tàbí ìfẹ́ yíyan-tẹ́lẹ̀
  rationale: Ọ̀rọ̀ Gíríìkì lè jẹ́ kókó àríyànjiyàn nípa ìmọ̀ àti yíyan Ọlọ́run; ìtumọ̀ náà kò gbọdọ̀ yanju àríyànjiyàn yẹn ní ìkọ̀kọ̀.
- issue: Ẹni tí πνεύματος ń tọ́ka sí
  choice: Ẹ̀mí, ní lẹ́tà ńlá, gẹ́gẹ́ bí Ẹ̀mí Mímọ́
  alternative: ẹ̀mí ènìyàn tàbí agbára aláìlẹ́ni
  rationale: Ìṣètò “Ọlọ́run Baba … Ẹ̀mí … Jesu Mèsáyà” fi hàn pé Ẹ̀mí Mímọ́ ni a ń sọ̀rọ̀ nípa rẹ̀.
- issue: Ipa Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός ṣì ní agbára oyè ẹni tí a fòróró yàn; “Mèsáyà” mú agbára oyè náà hàn ní kedere.
- issue: Ipa genitive nínú ἁγιασμῷ πνεύματος
  choice: ìsọdimímọ́ Ẹ̀mí
  alternative: ìsọdimímọ́ tí Ẹ̀mí ń ṣe
  rationale: Àgbékalẹ̀ kúkúrú náà pa ìṣòro bóyá Ẹ̀mí ni olùṣe tàbí bóyá ọ̀rọ̀ náà ń tọ́ka sí ìsọdimímọ́ tó jẹ mọ́ Ẹ̀mí, láìṣàlàyé ohun tí Gíríìkì kò sọ ní gbangba.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bójú mu. Àṣàyàn ọ̀rọ̀ jẹ́ ti ìforúkọsílẹ̀ ọ̀wọ̀, tó yẹ fún ìwé mímọ́ ṣùgbọ́n tó ṣì ṣe kedere fún òǹkàwé òde òní. A pa ìṣètò gbólóhùn Gíríìkì mọ́ níwọ̀n tó ṣeé ṣe láìsọ Yorùbá di líle.
