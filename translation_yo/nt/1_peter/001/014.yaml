  source_fidelity: 'Àwọn ìpín pàtàkì ti ẹsẹ̀ Gíríìkì náà wà nínú ìtumọ̀ yìí: ìpè náà jẹ́ sí ẹgbẹ́ ènìyàn, ìfẹ́-ọkàn náà jẹ́ ti ìgbà àtẹ́lẹ̀, a sì so wọ́n mọ́ ipò àìmọ̀ wọn. Ṣùgbọ́n “mú ara yín bá ... mu” kò jẹ́ ọ̀nà Yorùbá tí ó mọ́, tí ó sì ń ṣòro láti lóye gẹ́gẹ́ bí ìtumọ̀ συσχηματιζόμενοι. Àtúnṣe náà ń pa ìtumọ̀ ‘ṣe ara ẹni ní ìbámu/tẹ̀lé àpẹẹrẹ’ mọ́ ní èdè àdánidá.'
  naturalness: “Ẹ má ṣe fara wé àwọn ìfẹ́-ọkàn ...” jẹ́ gbólóhùn Yorùbá tó hàn gbangba fún ìkìlọ̀ pé kí wọ́n má ṣe dá ìwà wọn lórí àwọn ìfẹ́-ọkàn àtijọ́. “Àwọn ọmọ ìgbọ́ràn” sì dára ju “ọmọ ìgbọ́ràn” lọ nínú àyíká yìí nítorí τέκνα jẹ́ ọ̀pọ̀.
  terminology: A pa àkópọ̀ ìwà rere “children of obedience” mọ́ pẹ̀lú “àwọn ọmọ ìgbọ́ràn,” dípò kí a sọ ọ́ di “àwọn ọmọ onígbọ́ràn” nínú ọ̀rọ̀ àkọ́kọ́. Àlàyé ìsàlẹ̀ ń fi aṣàyàn àdánidá náà hàn. “Àìmọ̀ yín” jẹ́ ìtumọ̀ tó yẹ fún ἐν τῇ ἀγνοίᾳ ὑμῶν, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn míì kún un.
