source:
  edition: SBLGNT
  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: yo
  text: Gẹ́gẹ́ bí àwọn ọmọ ìgbọ́ràn[a], ẹ má ṣe fara wé àwọn ìfẹ́-ọkàn tí ẹ ní tẹ́lẹ̀ nígbà tí ẹ wà nínú àìmọ̀ yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ọmọ onígbọ́ràn.” Ní tààrà, èdè Gíríìkì sọ pé “àwọn ọmọ ìgbọ́ràn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Gẹ́gẹ́ bí
  rationale: Ó fi ipò tàbí ìwà tí ìṣírí náà dá lé hàn; ‘gẹ́gẹ́ bí’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: τέκνα ὑπακοῆς
  choice: ọmọ ìgbọ́ràn
  rationale: Èyí pa ìṣètò ọ̀rọ̀ Gíríìkì mọ́, ó sì fi hàn pé ìgbọ́ràn ni ìdánimọ̀ àti ìwà tí ó yẹ kí ó ṣàpèjúwe wọn. Nínú Yorùbá, ‘ọmọ’ lè tọ́ka sí ọ̀pọ̀ ènìyàn lẹ́yìn ‘ẹ’ láìfi àmì ọ̀pọ̀ kun un.
- source_word: μὴ συσχηματιζόμενοι
  choice: ẹ má ṣe máa mú ara yín ... mu
  rationale: Ìtumọ̀ yìí fi ìkìlọ̀ tí ń tẹ̀ síwájú àti ojúṣe ẹni hàn, ó sì jẹ́ gbólóhùn Yorùbá tí ó ṣeé lóye.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: àwọn ìfẹ́-ọkàn
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí àwọn ìfẹ́ líle tí kò tọ́ ní àyíká yìí; ‘ìfẹ́-ọkàn’ gbooro ju ọ̀rọ̀ tó dá lórí ìfẹ́ ìbálòpọ̀ nìkan lọ.
- source_word: πρότερον
  choice: tí ẹ ní tẹ́lẹ̀
  rationale: Ó tọ́ka sí àwọn ìfẹ́-ọkàn wọn ní ìgbésí ayé wọn àtijọ́, a sì sọ ìbáṣepọ̀ yẹn ní kedere ní Yorùbá.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: nígbà tí ẹ wà nínú àìmọ̀
  rationale: Ó pa èrò ipò àìmọ̀ wọn tẹ́lẹ̀ mọ́ láìṣe àfikún ohun tí ẹsẹ̀ náà kò sọ.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ gbólóhùn ìwà rere τέκνα ὑπακοῆς
  choice: ọmọ ìgbọ́ràn
  alternative: àwọn ọmọ onígbọ́ràn
  rationale: ‘Ọmọ ìgbọ́ràn’ pa agbára ìdánimọ̀ inú àkópọ̀ ọ̀rọ̀ ìpilẹ̀ṣẹ̀ mọ́, dípò kí ó sọ ọ́ di àpèjúwe lasan; àlàyé ìsàlẹ̀ sì fúnni ní ọ̀nà Yorùbá tó rọrùn sí i.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ’ fún ọ̀pọ̀ ènìyàn, kì í ṣe ọ̀rọ̀ ọ̀wọ̀ fún ẹnì kan; a sì pa àwòrán ‘ọmọ ìgbọ́ràn’ mọ́ pẹ̀lú àlàyé ìsàlẹ̀.
