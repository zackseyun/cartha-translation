reference: 1 Peter 1:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: yo
  text: Bí ẹ bá sì ń pe ẹni tí ń ṣe ìdájọ́ láìṣe ojúsàájú gẹ́gẹ́ bí iṣẹ́ ẹni kọ̀ọ̀kan ní Baba[a], ẹ fi ìbẹ̀rù[c] hùwà ní àkókò tí ẹ ń gbé gẹ́gẹ́ bí àlejò[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹ bá ń ké pe ẹni náà gẹ́gẹ́ bí Baba.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní àkókò ìgbèkùn yín.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbésí ayé ẹni tí ó jẹ́ àlejò tàbí olùgbé fún ìgbà díẹ̀.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “pẹ̀lú ìbẹ̀rù ọ̀wọ̀” tàbí “ní ìbẹ̀rù tí ó kún fún ọ̀wọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: ń pe ... ní Baba
  rationale: Ọ̀rọ̀ náà lè túmọ̀ sí pípe tàbí ké pe ẹnì kan; ìṣètò yìí fi hàn pé àwọn onígbàgbọ́ ń pe Ọlọ́run ní Baba, ó sì jẹ́ Yorùbá àdánidá.
- source_word: πατέρα
  choice: Baba
  rationale: Ó dúró gẹ́gẹ́ bí orúkọ ipò tí wọ́n fi ń pe Ọlọ́run; lílo lẹ́tà ńlá fi ìtọ́kasí sí Ọlọ́run hàn.
- source_word: ἀπροσωπολήμπτως
  choice: láìṣe ojúsàájú
  rationale: Ó túmọ̀ sí ṣíṣe ìdájọ́ láìfi ipò, ojú, tàbí ẹni tí ẹnì kan jẹ́ ṣe ojúsàájú.
- source_word: κρίνοντα
  choice: ẹni tí ń ṣe ìdájọ́
  rationale: Ó mú participle tí ń ṣàpèjúwe Ọlọ́run jáde ní Yorùbá àdánidá, ó sì pa ìṣe tí ń lọ lọ́wọ́ mọ́.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: gẹ́gẹ́ bí iṣẹ́ olúkúlùkù
  rationale: Ó pa κατά gẹ́gẹ́ bí ìlànà ìdájọ́ mọ́, kò sì fi ètò ẹ̀kọ́ ìgbàgbọ́ kan kún ọ̀rọ̀ náà.
- source_word: ἐν φόβῳ
  choice: fi ìbẹ̀rù
  rationale: Ìtumọ̀ yìí pa agbára φόβος àti ìṣòro ìtumọ̀ rẹ̀ mọ́; àlàyé ìsàlẹ̀ fi ọ̀wọ̀ jíjinlẹ̀ àti ẹ̀rù ọ̀wọ̀ hàn gẹ́gẹ́ bí àṣàyàn.
- source_word: παροικίας
  choice: ìgbé àlejò
  rationale: Ó sọ ìgbé ẹni tí kì í ṣe ọmọ ìbílẹ̀ tàbí ẹni tó ń gbé níbì kan fún ìgbà díẹ̀, láìfi dandan túmọ̀ rẹ̀ sí ìgbèkùn.
- source_word: ἀναστράφητε
  choice: ẹ máa ... hùwà
  rationale: Ó mú ìpè pàṣẹ sí bí wọn ṣe gbé ìgbésí ayé wọn jáde ní ọ̀nà Yorùbá tó mọ́gbọ́n dání.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: ní gbogbo àkókò ìgbé àlejò yín
  rationale: Accusative náà ń tọ́ka sí gígùn àkókò; “ní gbogbo àkókò” mú ìtumọ̀ duration náà hàn kedere.
theological_decisions:
- issue: Ìtumọ̀ φόβος ní ìbáṣepọ̀ pẹ̀lú Ọlọ́run gẹ́gẹ́ bí Baba àti Onídàájọ́
  choice: Fi “ìbẹ̀rù” sí ọ̀rọ̀ pàtàkì
  alternative: ọ̀wọ̀ jíjinlẹ̀; ẹ̀rù ọ̀wọ̀
  rationale: Èyí pa ìwọ̀ntúnwọ̀nsì tó wà láàárín jíjẹ́ Baba àti ṣíṣe ìdájọ́ láìṣe ojúsàájú mọ́, dípò kí ó rọ φόβος di ọ̀wọ̀ nìkan.
- issue: Ìdájọ́ gẹ́gẹ́ bí iṣẹ́ olúkúlùkù
  choice: Túmọ̀ gbólóhùn náà tààrà láìfi ètò ẹ̀kọ́ ìgbàgbọ́ kan kún un
  alternative: Ṣàlàyé rẹ̀ pàtó gẹ́gẹ́ bí ìdájọ́ ìkẹyìn lórí iṣẹ́ àwọn onígbàgbọ́ tàbí gẹ́gẹ́ bí ìlànà gbogbogbò
  rationale: Gíríìkì sọ pé Ọlọ́run ń ṣe ìdájọ́ gẹ́gẹ́ bí iṣẹ́ olúkúlùkù, ṣùgbọ́n kò ṣàlàyé nínú ẹsẹ yìí bí èyí ṣe bá èrè, ìgbàlà, tàbí ìdánilójú mu.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì àlàyé [a], [b], àti [c] wà nínú ọ̀rọ̀ pàtàkì.
