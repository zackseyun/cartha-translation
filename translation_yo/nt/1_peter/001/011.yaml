id: 1PE.1.11
reference: 1 Peter 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: yo
  text: wọ́n ń wádìí ẹni wo tàbí irú àkókò wo ni Ẹ̀mí Mèsáyà tí ó wà nínú wọn ń tọ́ka sí, gẹ́gẹ́ bí ó ti ń jẹ́rìí ṣáájú nípa àwọn ìjìyà tí ó kan Mèsáyà[a] àti àwọn ògo tí yóò wá lẹ́yìn àwọn nǹkan wọ̀nyí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìjìyà Mèsáyà.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: wọ́n ń wádìí
  rationale: Ó ń bá ìṣe àwọn wòlíì nínú ẹsẹ̀ tó ṣáájú lọ, ó sì fi ìwádìí taratara hàn ní Yorùbá àdánidá.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: ẹni wo tàbí irú àkókò wo
  rationale: 'Èyí pa ìbéèrè méjèèjì mọ́: ẹni tí a ń tọ́ka sí àti irú àkókò tí yóò jẹ́.'
- source_word: ἐδήλου
  choice: ń tọ́ka sí
  rationale: Fọ́ọ̀mù aláìparí náà fi ìṣe tó ń lọ hàn; ‘ń tọ́ka sí’ jẹ́ Yorùbá òde òní tó ṣe kedere láì sọ pé gbogbo nǹkan ti di mímọ́ pátápátá.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: Ẹ̀mí Mèsáyà tí ó wà nínú wọn
  rationale: Ó pa ìbáṣepọ̀ Ẹ̀mí náà mọ́ pẹ̀lú Mèsáyà, ó sì sọ ní tààrà pé Ẹ̀mí náà wà nínú àwọn wòlíì.
- source_word: προμαρτυρόμενον
  choice: nígbà tí ó ń jẹ́rìí ṣáájú
  rationale: Ó pa èrò jíjẹ́rìí àti agbára àfikún προ- tó túmọ̀ sí ṣáájú mọ́.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: àwọn ìjìyà tí ó kan Mèsáyà
  rationale: ‘Tí ó kan’ jẹ́ kí gbolohun náà dúró gẹ́gẹ́ bí ìjìyà tó ní í ṣe pẹ̀lú Mèsáyà, láì fipá mú εἰς di ìní tàbí kádàrá pàtó; àlàyé ìsàlẹ̀ pa ìtumọ̀ ìní tó wọ́pọ̀ mọ́.
- source_word: Χριστόν
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí orúkọ oyè níbí, nítorí náà a túmọ̀ rẹ̀ sí ‘Mèsáyà’ dípò kí a kan kọ ọ́ ní ìró Gíríìkì.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: àwọn ògo tí yóò wá lẹ́yìn àwọn nǹkan wọ̀nyí
  rationale: Ó pa ọ̀pọ̀ ‘ògo’ àti ìtẹ̀lé wọn lẹ́yìn àwọn ìjìyà mọ́, ní èdè Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ‘Ẹ̀mí Mèsáyà’ ní ìbáṣepọ̀ pẹ̀lú àwọn wòlíì
  choice: Ẹ̀mí Mèsáyà tí ó wà nínú wọn
  alternative: Ẹ̀mí àsọtẹ́lẹ̀ tó ń sọ̀rọ̀ nípa Mèsáyà
  rationale: Ọ̀rọ̀ Gíríìkì sọ ní tààrà pé Ẹ̀mí tó ní ìbáṣepọ̀ pẹ̀lú Mèsáyà wà nínú wọn; a kò dín ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ kù nípa àtúnsọ.
- issue: Agbára εἰς nínú τὰ εἰς Χριστὸν παθήματα
  choice: àwọn ìjìyà tí ó kan Mèsáyà
  alternative: àwọn ìjìyà Mèsáyà
  rationale: Ìkọ̀ náà lè tọ́ka sí ìjìyà tó ní í ṣe pẹ̀lú Mèsáyà, nígbà tí ìtumọ̀ ìní náà tún lágbára nínú àyíká ọ̀rọ̀. Ọ̀rọ̀ inú ẹsẹ̀ àti àlàyé ìsàlẹ̀ jọ pa àìdánilójú gidi náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tó ní ọlá ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbolohun náà bẹ̀rẹ̀ pẹ̀lú ‘wọ́n’ nítorí pé ó ń bá ìṣe àwọn wòlíì láti inú ẹsẹ̀ tó ṣáájú lọ. ‘Àwọn ògo’ pa ọ̀pọ̀ nọ́ńbà Gíríìkì mọ́ bí ó tilẹ̀ jẹ́ pé ó jẹ́ ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tó ga díẹ̀.
