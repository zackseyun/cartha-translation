  naturalness: “Ẹ di àmùrè mọ́ ìbàdí èrò inú yín” lè yéni, ṣùgbọ́n “Ẹ di ìbàdí èrò inú yín ní àmùrè” fara mọ́ àwòrán náà dáadáa síi. “Kí ẹ sì máa ronú lọ́nà tí ó ṣe kedere” ń tọ́ka sí ìṣe ìrònú ju ìpo ìmúrasílẹ̀ ọkàn/ìmọ̀lára tí νήφοντες ń sọ lọ; “kí èrò inú yín sì máa mọ́ kedere” rọrùn, ó sì bójú mu. Àwọn àlàyé ìsàlẹ̀ ni a tún ṣe kí wọ́n lè jẹ́ Yorùbá boṣewa tí ó ṣe kedere.
