id: 1PE.1.13
reference: 1 Peter 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: yo
  text: Nítorí náà, ẹ di ìbàdí èrò inú yín ní àmùrè[a], kí èrò inú yín sì máa mọ́ kedere[d]; ẹ gbé gbogbo ìrètí yín lé[b] oore-ọ̀fẹ́ tí a ń mú wá fún yín nígbà ìṣípayá Jésù Mèsáyà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní tààràtà, “ẹ di ìbàdí èrò inú yín ní àmùrè”; ìtumọ̀ rẹ̀ ni pé kí ẹ mú èrò inú yín ṣetán fún ìṣe.
    reason: lexical_alternative
  - marker: b
    text: Ó tún ṣeé túmọ̀ sí, “kí èrò inú yín máa mọ́ kedere pátápátá, kí ẹ sì gbé ìrètí yín lé oore-ọ̀fẹ́.” Ọ̀rọ̀ Gíríìkì fún “pátápátá” lè ṣàpèjúwe jíjẹ́ ẹni tí èrò inú rẹ̀ mọ́ kedere, tàbí gbígbé ìrètí lé oore-ọ̀fẹ́.
    reason: alternative_reading
  - marker: c
    text: Gíríìkì ní “Jésù Kristi.” A túmọ̀ Χριστός sí “Mèsáyà” níhìn-ín nítorí pé ó ń ṣiṣẹ́ gẹ́gẹ́ bí oyè.
    reason: lexical_alternative
  - marker: d
    text: Ó tún ṣeé gbé e kalẹ̀ pé, “lẹ́yìn tí ẹ ti di ìbàdí èrò inú yín ní àmùrè, tí èrò inú yín sì ń mọ́ kedere.”
    reason: previous_rendering
lexical_decisions:
- source_word: Διὸ
  choice: Nítorí náà
  rationale: Ó fi hàn pé àṣẹ tí ó tẹ̀ lé e jẹ́ àbájáde ohun tí a ṣẹ̀ṣẹ̀ sọ; gbólóhùn yìí bójú mu, ó sì wọ́pọ̀ ní Yorùbá.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: ẹ di àmùrè mọ́ ìbàdí èrò inú yín
  rationale: A pa àwòrán Gíríìkì ti dídi aṣọ ní àmùrè fún ìmúrasílẹ̀ mọ́, ṣùgbọ́n a lo ‘èrò inú’ kí ìtumọ̀ nípa ọpọlọ àti ìrònú lè ṣe kedere ní Yorùbá.
- source_word: νήφοντες
  choice: kí ẹ sì máa ronú lọ́nà tí ó ṣe kedere
  rationale: Ní àyíká yìí ọ̀rọ̀ náà ń tọ́ka sí jíjẹ́ ẹni tí èrò inú rẹ̀ mọ́ kedere, tí ó sì múra sílẹ̀; kì í ṣe àṣẹ nípa yíyàgò fún ọtí ní pàtó.
- source_word: τελείως
  choice: gbogbo
  rationale: A so èrò ìpéye rẹ̀ mọ́ gbígbé gbogbo ìrètí lé oore-ọ̀fẹ́. Nítorí pé gírámà Gíríìkì tún lè so ó mọ́ jíjẹ́ olórí-kedere pátápátá, àlàyé ìsàlẹ̀ ṣe àfihàn àìdánilójú náà.
- source_word: ἐλπίσατε ἐπὶ
  choice: ẹ gbé gbogbo ìrètí yín lé
  rationale: ‘Gbé ìrètí lé’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìgbẹ́kẹ̀lé tí a mọ̀ọ́mọ̀ darí sí ohun kan; àṣẹ náà ní agbára ìpinnu.
- source_word: τὴν φερομένην ὑμῖν χάριν
  choice: oore-ọ̀fẹ́ tí a ń mú wá fún yín
  rationale: Ó pa ìṣe tí ń lọ lọwọlọwọ nínú participle Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé àyíká ń tọ́ka sí ìmúṣẹ ọjọ́ iwájú.
- source_word: ἐν ἀποκαλύψει
  choice: nígbà ìṣípayá
  rationale: Ó mú ìbáṣepọ̀ àkókò tó ṣe pàtàkì níhìn-ín jáde, ó sì pa orúkọ-ìṣe ‘ìṣípayá’ mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn níhìn-ín, kì í ṣe bí orúkọ ìdílé; ‘Mèsáyà’ jẹ́ ìtumọ̀ oyè náà.
theological_decisions:
- issue: Bóyá kí a pa àwòrán ‘ìbàdí èrò inú’ mọ́ tàbí kí a túmọ̀ rẹ̀ sí ìmúrasílẹ̀ lásán
  choice: Pa àwòrán náà mọ́ nínú ọ̀rọ̀ pàtàkì, kí àlàyé sì ṣàlàyé rẹ̀.
  alternative: Ẹ mú èrò inú yínra sílẹ̀ fún iṣẹ́.
  rationale: Àwòrán ara ẹni náà lágbára nínú Gíríìkì, ó sì lè yé òǹkàwé Yorùbá pẹ̀lú àlàyé kékeré; píparọ́ rẹ̀ pátápátá yóò sọ ìtumọ̀ di àlàyé ju bí orísun ṣe rí lọ.
- issue: Ohun tí τελείως ń ṣàpèjúwe
  choice: So ìpéye náà mọ́ gbígbé gbogbo ìrètí lé oore-ọ̀fẹ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: Kí ẹ máa ronú lọ́nà tí ó ṣe kedere pátápátá.
  rationale: 'Ipò ọ̀rọ̀ náà gba méjèèjì láyè: ó lè ṣàpèjúwe jíjẹ́ olórí-kedere tàbí gbígbé ìrètí lé oore-ọ̀fẹ́ pátápátá. A kò fi ọ̀kan pa èkejì rẹ́; àlàyé [b] pa ọ̀nà kejì mọ́.'
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní ọ̀rọ̀ nípa ìṣípayá ọjọ́ iwájú yìí, oyè ẹni àmì òróró náà ṣì ń dún gbangba; ‘Mèsáyà’ mú iṣẹ́ oyè náà hàn láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè àdánidá mu. Ìforúkọsílẹ̀ jẹ́ ọlọ́lá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. A pa àwòrán orísun mọ́, a sì lo àlàyé ìsàlẹ̀ fún ìtumọ̀ àdánidá àti àìdánilójú gírámà.
