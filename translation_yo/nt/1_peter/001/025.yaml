id: 1PE.1.25
reference: 1 Peter 1:25
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: yo
  text: Ṣùgbọ́n ọ̀rọ̀ Olúwa dúró títí láé.” Èyí sì ni ọ̀rọ̀ tí a kéde fún yín gẹ́gẹ́ bí ìhìn rere[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọ̀rọ̀ tí a wàásù fún yín gẹ́gẹ́ bí ìhìn rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥῆμα
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀” lè túmọ̀ sí ohun tí a sọ tàbí iṣẹ́ tí a jíṣẹ́, ó sì pa ìsopọ̀ pẹ̀lú àyọlò Aísáyà 40:8 mọ́ nínú àwọn gbólóhùn méjèèjì.
- source_word: κυρίου
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tó ṣe déédé fún κύριος, ẹ̀yà oníhun “ọ̀rọ̀ Olúwa” sì bá τοῦ κυρίου mu.
- source_word: μένει
  choice: dúró
  rationale: Nínú àyíká yìí, “dúró” fi ìwà pípẹ́ àti àìyípadà hàn ní èdè Yorùbá tó rọrùn láti lóye.
- source_word: εἰς τὸν αἰῶνα
  choice: títí láé
  rationale: Èyí ni ọ̀nà àdánidá ní Yorùbá láti sọ ìwà tí kò ní òpin.
- source_word: τοῦτο δέ ἐστιν
  choice: Èyí sì ni
  rationale: “Sì” fi ìyípadà pẹ̀lẹ́ tí δέ ń ṣe hàn, ó sì so àyọlò náà mọ́ ìlò tí Pétérù ṣe é.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: ọ̀rọ̀ tí a kéde gẹ́gẹ́ bí ìhìn rere
  rationale: Ìtumọ̀ yìí pa agbára ọ̀rọ̀-ìṣe εὐαγγελίζω mọ́, ó sì sọ ní kedere pé a kéde ọ̀rọ̀ náà gẹ́gẹ́ bí ìhìn rere.
- source_word: εἰς ὑμᾶς
  choice: fún yín
  rationale: Pẹ̀lú εὐαγγελίζω, gbólóhùn yìí tọ́ka sí àwọn olùgbọ́ tí ìkéde náà dé ọ̀dọ̀ wọn; “fún yín” jẹ́ èdè Yorùbá àdánidá.
theological_decisions:
- issue: Ohun tí “ọ̀rọ̀ Olúwa” ń tọ́ka sí láàárín Aísáyà 40:8 àti ìlò ìhìn rere tí Pétérù ṣe
  choice: A pa “ọ̀rọ̀ Olúwa” mọ́ nínú àyọlò náà, a sì dá a mọ̀ nínú gbólóhùn kejì gẹ́gẹ́ bí ọ̀rọ̀ tí a kéde fún àwọn olùkà gẹ́gẹ́ bí ìhìn rere.
  alternative: Kí a túmọ̀ ọ́ ní ṣíṣàlàyé sí i gẹ́gẹ́ bí “iṣẹ́ tí ó ti ọ̀dọ̀ Olúwa wá.”
  rationale: Èyí pa ọ̀rọ̀ inú Ìwé Mímọ́ àti ìsopọ̀ rẹ̀ pẹ̀lú ìkéde ìhìn rere mọ́ láìfi àlàyé ẹ̀kọ́ ìsìn kan kún un.
- issue: Bí a ṣe túmọ̀ εὐαγγελισθέν
  choice: Lo gbólóhùn tó ní “ìhìn rere” nínú, kí agbára ọ̀rọ̀-ìṣe náà lè hàn.
  alternative: “ọ̀rọ̀ tí a wàásù fún yín.”
  rationale: “Kéde gẹ́gẹ́ bí ìhìn rere” jẹ́ kó ṣe kedere pé kì í ṣe ìkéde lásán, ṣùgbọ́n ìkéde ìhìn rere, láìgbé ìtumọ̀ ẹ̀kọ́ ìsìn míì wọ inú ọ̀rọ̀ náà.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. “Dúró títí láé” jẹ́ ọ̀nà tó ṣe kedere fún àwọn òǹkàwé lónìí, “kéde gẹ́gẹ́ bí ìhìn rere” sì yẹra fún ọ̀rọ̀ ṣọ́ọ̀ṣì tó lè ṣókùnkùn sí àwọn kan.
