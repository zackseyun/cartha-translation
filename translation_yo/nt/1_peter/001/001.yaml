id: 1PE.1.1
reference: 1 Peter 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: yo
  text: 'Pétérù, àpọ́sítélì Jésù Mèsáyà[a], sí àwọn àlejò tí a yàn, tí wọ́n fọ́n ká[b] ní Pọ́ńtù, Gálátíà, Kápádókíà, Éṣíà àti Bítínì:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì náà, Χριστός, túmọ̀ sí ẹni tí a fi àmì òróró yàn, ìyẹn Mèsáyà.
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú un sí “àwọn àlejò nínú ìfọ́nká” tàbí “àwọn àlejò olùgbé.” Ọ̀rọ̀ náà lè ṣàpèjúwe àwọn tó ń gbé ní ilẹ̀ tí kì í ṣe tiwọn. “Ìfọ́nká” lè ránni létí àwọn Júù tí wọ́n fọ́n ká sí orílẹ̀-èdè mìíràn, ó sì tún lè tọ́ka sí àwọn ènìyàn Ọlọ́run tí wọ́n ń gbé bí àlejò jìnnà sí ilé wọn tòótọ́.
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: Πέτρος
  choice: Pétérù
  rationale: A lo ìrísí orúkọ yìí tí ó ti wọ́pọ̀ nínú èdè Yorùbá, dípò títú ìtumọ̀ orúkọ Gíríìkì náà jáde.
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ipò àti iṣẹ́ aṣojú tí a rán, ó sì jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Bíbélì Yorùbá mọ̀.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: A tú Χριστός gẹ́gẹ́ bí oyè ‘Mèsáyà’ láti pa ìtumọ̀ ẹni tí a fi àmì òróró yàn mọ́, dípò lílo ‘Kristi’ bí ẹni pé ó kàn jẹ́ apá kan orúkọ.
- source_word: ἐκλεκτοῖς
  choice: àyànfẹ́
  rationale: Ó sọ pé a ti yàn àwọn tí a ń kọ̀wé sí, láìfi ètò ẹ̀kọ́ ìsìn kan pàtó kún ọ̀rọ̀ náà.
- source_word: παρεπιδήμοις
  choice: àlejò
  rationale: ‘Àlejò’ fi hàn pé wọ́n ń gbé ní ibi tí kì í ṣe ìlú ìbílẹ̀ wọn; ó ṣeé lóye, ó sì yẹ fún ọ̀rọ̀ ìkíni lẹ́tà.
- source_word: διασπορᾶς
  choice: ìfọ́nká
  rationale: Ìtumọ̀ yìí pa àwòrán àwọn ènìyàn tí wọ́n fọ́n ká mọ́, ó sì jẹ́ kí ìtọ́kasí sí ìfọ́nká àwọn Júù àti ìtumọ̀ ẹ̀mí tí ó lè wà nínú ọ̀rọ̀ náà dúró ní gbangba.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: ní Pọ́ńtù, Gálátíà, Kápádókíà, Éṣíà àti Bítínì
  rationale: A kọ àwọn orúkọ agbègbè náà ní ìrísí Yorùbá, a sì fi ‘ní’ kún un láti mú ìbáṣepọ̀ ibi tí àwọn ọ̀rọ̀ Gíríìkì fi hàn ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ ἐκλεκτοῖς
  choice: àyànfẹ́
  alternative: àwọn tí a yàn
  rationale: ‘Àyànfẹ́’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, ṣùgbọ́n kò pinnu ọ̀nà tàbí ìdí tí Ọlọ́run fi yàn wọ́n, èyí tí ẹsẹ̀ yìí kò tíì ṣàlàyé.
- issue: Ìbáṣepọ̀ παρεπιδήμοις διασπορᾶς
  choice: àwọn àlejò àyànfẹ́ ti ìfọ́nká
  alternative: àwọn ìgbèkùn àyànfẹ́ tí wọ́n fọ́n ká
  rationale: A pa ìsọ̀rọ̀ náà mọ́ kí ó lè tọ́ka sí ipò wọn gẹ́gẹ́ bí àlejò ní àwọn agbègbè náà, sí àwọn Júù inú ìfọ́nká, tàbí sí àwọn ènìyàn Ọlọ́run tí ayé kì í ṣe ilé wọn ní kíkún; a kò fi tipátipá yan ọ̀kan ṣoṣo.
- issue: Ìtumọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nínú àkọlé ‘Jésù Mèsáyà,’ oyè ẹni tí a fi àmì òróró yàn ṣì ṣe pàtàkì; ìtumọ̀ yìí kò jẹ́ kí Χριστός dà bí orúkọ lasan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. A lo àmì méjì ‘àlejò àyànfẹ́’ láti mú ἐκλεκτοῖς παρεπιδήμοις jáde ní ṣókí, a sì pa ‘ti ìfọ́nká’ mọ́ dípò yíyí gbogbo rẹ̀ sí gbólóhùn àlàyé. Àmì àdáwẹ́ méjì ní òpin bá ìbẹ̀rẹ̀ lẹ́tà mu, nítorí gbólóhùn náà ń bá a lọ sínú ẹsẹ̀ 2.
