  source_fidelity: 'Ìtumọ̀ náà gbé àwọn apá pàtàkì ti Gíríìkì kalẹ̀ dáadáa: ẹni tí ó kọ lẹ́tà náà, ipò àpọ́sítélì rẹ̀, Jésù gẹ́gẹ́ bí Mèsáyà, yíyan àwọn olùgbọ́, ipò àlejò wọn, ìfọ́nká, àti àkójọ àwọn agbègbè náà. Síbẹ̀, ‘àwọn àlejò àyànfẹ́ ti ìfọ́nká’ lè túmọ̀ sí àwọn àlejò tí ó fẹ́ràn jù, tàbí kó dà bí pé ‘ìfọ́nká’ ni ohun tí a yàn. Àtúnṣe náà jẹ́ kí ‘àwọn tí a yàn’ àti ‘àlejò’ hàn kedere, ó sì pa ìbáṣepọ̀ pẹ̀lú διασπορᾶς mọ́.'
