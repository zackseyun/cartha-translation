source:
  edition: SBLGNT
  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: yo
  text: A ti mọ̀ ọ́ tẹ́lẹ̀ ṣáájú ìpilẹ̀ ayé[a], ṣùgbọ́n a fi í hàn ní òpin àwọn àkókò nítorí yín[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “A ti yàn án tẹ́lẹ̀.” Gíríìkì sọ pé “a ti mọ̀ ọ́ tẹ́lẹ̀”; èyí lè tọ́ka sí ète Ọlọ́run, ṣùgbọ́n Gíríìkì kò fi dandan mú wa láti fi ìtumọ̀ tó jinlẹ̀ sí i yẹn sínú ọ̀rọ̀ pàtàkì.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ní àwọn àkókò ìkẹyìn wọ̀nyí.”
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: A ti mọ̀ ọ́ tẹ́lẹ̀
  rationale: Èyí pa ìtumọ̀ ‘mọ̀ tẹ́lẹ̀’ mọ́ láì sọ ọ́ di ‘yàn tẹ́lẹ̀,’ èyí tí yóò túmọ̀ ọ̀rọ̀ náà jinlẹ̀ ju ohun tí Gíríìkì sọ ní tààràtà lọ. Ìlò ‘a’ tún pa àfihàn ẹni tó ṣe iṣẹ́ náà mọ́ gẹ́gẹ́ bí ọ̀rọ̀ Gíríìkì ṣe wà ní ohùn àìṣe.
- source_word: πρὸ καταβολῆς κόσμου
  choice: ṣáájú ìpilẹ̀ ayé
  rationale: ‘Ìpilẹ̀ ayé’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì níyì fún ọ̀rọ̀ ìpilẹ̀ṣẹ̀ ayé; ‘ṣáájú’ pa ìtumọ̀ ohun tó ti wà kí ayé tó bẹ̀rẹ̀ mọ́.
- source_word: φανερωθέντος
  choice: a fi í hàn
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá fún jíjẹ́ kí ẹnì kan farahàn tàbí di mímọ̀ ní gbangba, ó sì pa ohùn àìṣe inú Gíríìkì mọ́.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: ní òpin àwọn àkókò
  rationale: Èyí tẹ̀ lé ìtumọ̀ Gíríìkì pé ‘ní ìkẹyìn àwọn àkókò’ láì fi ọ̀rọ̀ atọ́ka ‘wọ̀nyí’ kún un.
- source_word: δι’ ὑμᾶς
  choice: nítorí yín
  rationale: Ní àyíká ọ̀rọ̀ yìí, gbólóhùn Yorùbá náà fi hàn pé fífi Kristi hàn jẹ́ fún ire àwọn òǹkàwé, kì í ṣe pé àwọn ni ó fa á ní ọ̀nà búburú.
theological_decisions:
- issue: Ìtumọ̀ προεγνωσμένου nípa Kristi ṣáájú ìpilẹ̀ ayé
  choice: Pa ‘a ti mọ̀ ọ́ tẹ́lẹ̀’ mọ́ nínú ọ̀rọ̀ pàtàkì.
  alternative: ‘A ti yàn án tẹ́lẹ̀’ tàbí ‘a ti pín rẹ̀ sílẹ̀ tẹ́lẹ̀.’
  rationale: Ọ̀rọ̀ Gíríìkì lè ní ìbáṣepọ̀ pẹ̀lú ète Ọlọ́run, ṣùgbọ́n kò fipá mú wa láti sọ ‘yàn’ tàbí ‘pín sílẹ̀.’ Ìtumọ̀ yìí pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- issue: Agbára àkókò inú ἐπ’ ἐσχάτου τῶν χρόνων
  choice: ‘ní òpin àwọn àkókò’
  alternative: ‘ní àwọn àkókò ìkẹyìn wọ̀nyí’
  rationale: Èyí pa ìrísí àkókò ìkẹyìn mọ́, ṣùgbọ́n kò fi ‘wọ̀nyí’ kún Gíríìkì, nítorí ọ̀rọ̀ atọ́ka bẹ́ẹ̀ kò sí níbẹ̀ ní tààràtà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún. Ìforúkọsílẹ̀ náà jẹ́ ti òde òní, ó níyì, ó sì yẹ fún kíkà ní gbangba. A lo ‘a’ gẹ́gẹ́ bí ìtumọ̀ ohùn àìṣe láti má ṣe fi orúkọ ẹni tó ṣe iṣẹ́ náà kún ọ̀rọ̀ Gíríìkì ní tààràtà; àyíká ẹsẹ náà ló ń tọ́ka sí Ọlọ́run àti Kristi.
