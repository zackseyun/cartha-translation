id: 1PE.1.6
reference: 1 Peter 1:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: yo
  text: Nínú èyí ni ẹ̀yin ń yọ̀ gidigidi, bí ó tilẹ̀ jẹ́ pé nísinsin yìí, fún ìgbà díẹ̀, bí ó bá jẹ́ dandan, ẹ ti ní ìbànújẹ́ nínú oríṣiríṣi ìdánwò[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àdánwò”; ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìdẹwò” ní àwọn àyíká mìíràn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nínú èyí
  rationale: Ó tọ́ka sí àkójọpọ̀ ìrètí ìgbàlà àti ogún tí a sọ ṣáájú, ó sì pa ìtumọ̀ ibi tàbí ìpìlẹ̀ ayọ̀ mọ́ láì fi ìtumọ̀ okunfa kún un.
- source_word: ἀγαλλιᾶσθε
  choice: ẹ̀yin ń yọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ayọ̀ ńlá tàbí yíyọ̀ gidigidi; ‘ń yọ̀’ jẹ́ Yorùbá àdánidá tó ṣe kedere, tí àyíká ọ̀rọ̀ sì ń fi agbára ayọ̀ náà hàn.
- source_word: ὀλίγον ἄρτι
  choice: nísinsin yìí, fún ìgbà díẹ̀
  rationale: 'Ó pa àwọn èrò méjèèjì mọ́: àkókò ìsinsin yìí àti kúkúrú àkókò náà.'
- source_word: εἰ δέον
  choice: bí ó bá pọndandan
  rationale: Ó pa ìtumọ̀ àídájú εἰ àti ti ohun tó pọndandan mọ́, láì ṣàlàyé ẹni tó pinnu dandan náà.
- source_word: λυπηθέντες
  choice: ti mú ìbànújẹ́ bá yín
  rationale: Ìtumọ̀ yìí sọ ní Yorùbá àdánidá pé àwọn olùgbọ́ ti ní ìrírí ìbànújẹ́, ó sì pa ipa gbígba ìṣe inú participle passive náà mọ́.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: oríṣiríṣi ìdánwò
  rationale: Àyíká ẹsẹ 6–7 tọ́ka sí ìpọ́njú tó ń dán ìgbàgbọ́ wò. ‘Ìdánwò’ lè gba ìtumọ̀ àdánwò tàbí ìṣòro, láì dín un kù sí ìtànjẹ sí ẹ̀ṣẹ̀.
theological_decisions:
- issue: Ìtumọ̀ πειρασμοῖς nínú àyíká ìjìyà
  choice: ìdánwò
  alternative: ìdẹwò; àyẹ̀wò
  rationale: Àyíká náà ń sọ̀rọ̀ nípa ìbànújẹ́ àti bí a ṣe ń dán ìgbàgbọ́ wò. ‘Ìdánwò’ mú ìṣòro àti àyẹ̀wò pọ̀, ó sì yẹra fún fífi ọ̀rọ̀ náà mọ́ ìdẹwò sí ẹ̀ṣẹ̀ nìkan.
- issue: Ìbáṣepọ̀ ayọ̀ àti ìbànújẹ́
  choice: Pa ìtakora náà mọ́ pẹ̀lú ‘bí ó tilẹ̀ jẹ́ pé’
  alternative: Ṣàlàyé ayọ̀ náà gẹ́gẹ́ bí ohun tó ń ṣẹlẹ̀ lẹ́yìn ìdánwò
  rationale: Gíríìkì fi ayọ̀ àti ìbànújẹ́ ìsinsin yìí sí ẹ̀gbẹ́ ara wọn. Ìtumọ̀ náà kò yẹ kí ó yanjú ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí nípa yíyí àkókò wọn padà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. A yan ‘bí ó bá pọndandan’ láti pa àídájú ọ̀rọ̀ orísun mọ́, a sì lo ‘oríṣiríṣi ìdánwò’ fún ìṣòro tó ń dán ìgbàgbọ́ wò.
