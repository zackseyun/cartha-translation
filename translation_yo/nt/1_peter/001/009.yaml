  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: yo
  text: bí ẹ ti ń gba àbájáde ìgbàgbọ́ yín[a], ìgbàlà ọkàn yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “òpin,” “ohun tí ìgbàgbọ́ yín ń lépa,” tàbí “èsì ìgbàgbọ́ yín.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìgbàlà ìyè yín” tàbí “ìgbàlà yín gẹ́gẹ́ bí ènìyàn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ọkàn,” “ìyè,” tàbí “ènìyàn,” gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe rí.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: bí ẹ ti ń gba
  rationale: Ó mú ìtumọ̀ participle tí ń tọ́ka sí ohun tí ń lọ lọ́wọ́ jáde, ó sì so ẹsẹ̀ yìí mọ́ ọ̀rọ̀ tó ṣáájú lọ́nà àdánidá.
- source_word: τέλος
  choice: àbájáde
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ohun tí ìgbàgbọ́ yọrí sí tí àwọn onígbàgbọ́ sì ń gbà; ‘àbájáde’ kò dín in kù sí òpin àkókò nìkan.
- source_word: πίστεως ὑμῶν
  choice: ìgbàgbọ́ yín
  rationale: Èyí tọ́ka ní ti ẹ̀dá sí ìgbàgbọ́ àwọn tí a ń kọ̀wé sí, ó sì pa àpọ̀-orúkọ ẹni kejì ọ̀pọ̀ mọ́.
- source_word: σωτηρίαν
  choice: ìgbàlà
  rationale: ‘Ìgbàlà’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédé fún σωτηρία, ó sì bá àyíká lẹ́tà yìí mu.
- source_word: ψυχῶν
  choice: ọkàn
  rationale: ‘Ọkàn’ jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀ fún ψυχή níhìn-ín, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé ó tún lè túmọ̀ sí ẹ̀mí ayé tàbí gbogbo ènìyàn.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú gbólóhùn ‘ìgbàgbọ́ yín’
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé; ìṣòtítọ́
  rationale: Àyíká náà ń tọ́ka jù lọ sí ìgbàgbọ́ àwọn olùkà, láìfi ìtumọ̀ míì tí ọ̀rọ̀ náà lè ní sílẹ̀ patapata.
- issue: Ìtumọ̀ ψυχῶν nínú ‘ìgbàlà ọkàn yín’
  choice: ọkàn
  alternative: ẹ̀mí ayé; gbogbo ènìyàn
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ṣùgbọ́n kò sọ pé ara kò ní ipa nínú ìgbàlà, bẹ́ẹ̀ ni kò fi èrò ìpín ara àti ọkàn kan pàtó kún ẹsẹ̀ náà.
translation_notes:
  register: Yorùbá àfẹnusọ òde òní tó níyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. ‘Ẹ/yín’ pa ẹni kejì ọ̀pọ̀ inú Gíríìkì mọ́. Ìtò [a] àti [b] tẹ̀ lé ọ̀rọ̀ tí àlàyé kọ̀ọ̀kan ń ṣàlàyé.
