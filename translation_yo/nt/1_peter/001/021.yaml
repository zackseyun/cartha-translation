id: 1PE.1.21
reference: 1 Peter 1:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοὺς δι’ αὐτοῦ ⸀πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: yo
  text: Ẹ̀yin tí ẹ gbà Ọlọ́run gbọ́ nípasẹ̀ rẹ̀—Ọlọ́run ẹni tí ó jí i dìde kúrò nínú àwọn òkú, tí ó sì fún un ní ògo—nípa bẹ́ẹ̀ ni ìgbàgbọ́ àti ìrètí yín fi wà nínú Ọlọ́run.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí àbájáde èyí, ìgbàgbọ́ àti ìrètí yín wà nínú Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: tipasẹ̀ rẹ̀
  rationale: Ó fi Kristi hàn gẹ́gẹ́ bí ẹni tí a tipasẹ̀ rẹ̀ dé inú ìgbàgbọ́ nínú Ọlọ́run, ní ìbámu pẹ̀lú διά pẹ̀lú ọ̀rọ̀-orúkọ inú genitive.
- source_word: πιστοὺς εἰς θεόν
  choice: gbàgbọ́ nínú Ọlọ́run
  rationale: Nínú àkópọ̀ yìí, πιστούς túmọ̀ sí àwọn tí ó gba Ọlọ́run gbọ́ ju pé ó túmọ̀ sí àwọn olóòtítọ́ lọ; ọ̀rọ̀-ìṣe “gbàgbọ́” jẹ́ èdè Yorùbá àdánidá.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: ẹni tí ó jí i dìde kúrò nínú àwọn òkú
  rationale: Ó pa àwòrán jíjí dìde mọ́, “àwọn òkú” sì ṣàfihàn ọ̀pọ̀ nínú νεκρῶν.
- source_word: δόξαν αὐτῷ δόντα
  choice: tí ó sì fi ògo fún un
  rationale: Ó túmọ̀ ìṣe Ọlọ́run tí ó fún Kristi ní ògo ní tààràtà, láìfi àlàyé ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: ὥστε
  choice: kí ... lè
  rationale: Ìkọ́lé yìí jẹ́ ọ̀nà Yorùbá àdánidá láti so àbájáde tàbí ète pọ̀; kò sì fi tipátipá yan ọ̀kan nínú méjèèjì.
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: ìgbàgbọ́ àti ìrètí yín
  rationale: Àwọn ọ̀rọ̀ wọ̀nyí jẹ́ ìtumọ̀ Yorùbá tí ó ṣe déédéé fún πίστις àti ἐλπίς ní àyíká yìí.
- source_word: εἶναι εἰς θεόν
  choice: wà nínú Ọlọ́run
  rationale: Ó sọ Ọlọ́run di ibi tí ìgbàgbọ́ àti ìrètí wọn darí sí, ó sì pa àtúnwí εἰς θεόν mọ́.
theological_decisions:
- issue: Ìtumọ̀ πιστούς
  choice: àwọn tí ó gba Ọlọ́run gbọ́
  alternative: àwọn olóòtítọ́
  rationale: εἰς θεόν tí ó tẹ̀ lé e ń tọ́ka sí gbígbàgbọ́ tàbí ìgbẹ́kẹ̀lé nínú Ọlọ́run, bí ó tilẹ̀ jẹ́ pé πιστός lè túmọ̀ sí “olóòtítọ́” ní ibòmíràn.
- issue: Ipa Kristi nínú dídarí àwọn ènìyàn sí Ọlọ́run
  choice: “tipasẹ̀ rẹ̀” ń fi Kristi hàn gẹ́gẹ́ bí alárinà ọ̀nà ìgbàgbọ́ nínú Ọlọ́run
  alternative: “nítorí rẹ̀” gẹ́gẹ́ bí okùnfà lásán
  rationale: διά pẹ̀lú genitive sábà ń sọ ọ̀nà tàbí alárinà; ìtumọ̀ yìí tẹ̀ lé gírámà láìfikún àlàyé ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ̀ náà kò sọ.
- issue: Agbára ọ̀rọ̀ ὥστε
  choice: “kí ... lè” pa ète àti àbájáde tí ó ṣeé ṣe mọ́
  alternative: “ní àbájáde èyí, ...” tí yóò tẹnu mọ́ àbájáde nìkan
  rationale: ὥστε lè fi àbájáde hàn, ṣùgbọ́n ìkọ́lé Yorùbá yìí kò yanjú àìdánilójú náà ní ọ̀nà tí ó le jù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo “tipasẹ̀” láti fi ìtumọ̀ alárinà hàn, a sì lo “kí ... lè” láti pa ìfarakanra ète àti àbájáde inú ὥστε mọ́. Àmì ohùn ni a fi sí àwọn ọ̀rọ̀ níbi tí ó bá jẹ́ àdánidá.
