revisions:
- from: ẹ̀yin tí ó tipasẹ̀ rẹ̀ gbàgbọ́ nínú Ọlọ́run[a], ẹni tí ó jí i dìde kúrò nínú àwọn òkú, tí ó sì fi ògo fún un, kí ìgbàgbọ́ àti ìrètí yín lè wà nínú Ọlọ́run.[b]
  to: Ẹ̀yin tí ẹ gbà Ọlọ́run gbọ́ nípasẹ̀ rẹ̀—Ọlọ́run ẹni tí ó jí i dìde kúrò nínú àwọn òkú, tí ó sì fún un ní ògo—nípa bẹ́ẹ̀ ni ìgbàgbọ́ àti ìrètí yín fi wà nínú Ọlọ́run.[a]
  rationale: A ṣètò gbolohun náà sí i ní Yorùbá kí Ọlọ́run, ẹni tí ó jí Kristi dìde tí ó sì fún un ní ògo, lè hàn ní kedere. A rọ́pò ìkọ́lé tí ó dà bí ète (“kí ... lè”) pẹ̀lú ìkọ́lé àbájáde (“nípa bẹ́ẹ̀ ni”), èyí tí ó bá ὥστε mu dáadáa. A yọ àlàyé yíyan ìtumọ̀ πιστούς kúrò nínú àkọsílẹ̀ nítorí pé a ti sọ ìtumọ̀ “ẹ̀yin tí ẹ gbà Ọlọ́run gbọ́” ní kedere nínú ọ̀rọ̀ pàtàkì, kò sì sí àìdánilójú pàtàkì tó nílò àmì-ẹsẹ̀ ní Yorùbá.
