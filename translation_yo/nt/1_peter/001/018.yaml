  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: yo
  text: Níwọ̀n bí ẹ ti mọ̀ pé kì í ṣe pẹ̀lú àwọn ohun tí ń bàjẹ́, bíi fàdákà tàbí wúrà, ni a rà yín padà[a] kúrò nínú ọ̀nà ìgbésí ayé asán tí ẹ jogún láti ọ̀dọ̀ àwọn baba yín[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a fi iye ìràpadà dá yín sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ dídá ẹni sílẹ̀ nípasẹ̀ sísan iye kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “tí a fi lé yín lọ́wọ́ láti ọ̀dọ̀ àwọn baba yín.” Ní tààrà, “èyí tí a fi lé ẹni lọ́wọ́ láti ọ̀dọ̀ àwọn baba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: Níwọ̀n bí ẹ ti mọ̀ pé
  rationale: Ọ̀rọ̀ náà jẹ́ participle tó so gbólóhùn yìí mọ́ ìṣírí tó yí i ká. Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìmọ̀ tí a ti ní hàn gẹ́gẹ́ bí ìpìlẹ̀ ọ̀rọ̀, láì sọ ọ́ di gbólóhùn òmìnira.
- source_word: ἐλυτρώθητε
  choice: a rà yín padà
  rationale: Ó mú èrò ìdásílẹ̀ nípasẹ̀ iye ìràpadà jáde ní Yorùbá àdánidá, ó sì bá ìtọ́kasí sí fàdákà àti wúrà mu.
- source_word: φθαρτοῖς
  choice: àwọn ohun tí ń bàjẹ́
  rationale: Adjective náà dúró bí orúkọ níbí. Gbólóhùn yìí sọ ní kedere pé àwọn nǹkan wọ̀nyí lè bàjẹ́ tàbí kọjá lọ.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: bí fàdákà tàbí wúrà
  rationale: “Bí” fi hàn pé fàdákà àti wúrà jẹ́ àpẹẹrẹ àwọn ohun tí ń bàjẹ́, gẹ́gẹ́ bí ìbáṣepọ̀ ọ̀rọ̀ Gíríìkì ṣe fi hàn.
- source_word: ἐκ
  choice: kúrò nínú
  rationale: Ó ṣe àfihàn ìyapa àti ìdásílẹ̀ kúrò nínú ìgbé ayé àtijọ́.
- source_word: ματαίας
  choice: asán
  rationale: “Asán” ní Yorùbá mú ìtumọ̀ àìní èso, òfo, àti àìníyelórí inú μάταιος jáde ní ṣókí.
- source_word: ἀναστροφῆς
  choice: ìgbé ayé
  rationale: Nínú ọ̀rọ̀ Pétérù, ọ̀rọ̀ náà ń tọ́ka sí ìwà àti gbogbo ọ̀nà tí ènìyàn ń gbà gbé; “ìgbé ayé” jẹ́ ọ̀rọ̀ Yorùbá tó rọrùn, tó sì gbòòrò tó.
- source_word: πατροπαραδότου
  choice: tí ẹ jogún láti ọ̀dọ̀ àwọn baba ńlá yín
  rationale: Ó mú èrò ohun tí àwọn ìran ṣáájú fi léni lọ́wọ́ jáde, ó sì pa ìtọ́kasí Gíríìkì sí àwọn baba mọ́.
theological_decisions:
- issue: Ọ̀rọ̀ nípa àṣà tàbí ìgbé ayé tí a jogún
  choice: láti ọ̀dọ̀ àwọn baba ńlá yín
  alternative: láti ọ̀dọ̀ àwọn baba yín
  rationale: “Àwọn baba ńlá” jẹ́ ọ̀nà Yorùbá àdánidá láti tọ́ka sí àwọn baba ìran ṣáájú, kì í ṣe bàbá ẹni nìkan; ó sì pa àwòrán paternal inú ọ̀rọ̀ Gíríìkì mọ́.
- issue: Ọ̀rọ̀ ìràpadà
  choice: a rà yín padà
  alternative: a dá yín sílẹ̀ nípa sísan iye ìràpadà
  rationale: Àṣàyàn náà pa àwòrán ransom/redemption mọ́ láì fi èrò ẹ̀kọ́ ìgbàgbọ́ kan tí ẹsẹ yìí kò ṣàlàyé kún un. Ìyàtọ̀ sí fàdákà àti wúrà mú èrò iye ìràpadà hàn.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ. “Ẹ/yín” ń fi plural ẹni kejì inú Gíríìkì hàn. Àmì kọ́mà ní òpin fi hàn pé gbólóhùn náà ń bá a lọ sí ẹsẹ tó tẹ̀ lé e.
