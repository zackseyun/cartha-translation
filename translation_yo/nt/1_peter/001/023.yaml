id: 1PE.1.23
reference: 1 Peter 1:23
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ ⸀μένοντος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: yo
  text: A ti tún bí yín, kì í ṣe láti inú irúgbìn tí ń ṣègbé, bí kò ṣe láti inú irúgbìn tí kì í ṣègbé, nípasẹ̀ ọ̀rọ̀ Ọlọ́run tí ó wà láàyè, tí ó sì ń dúró.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nípasẹ̀ ọ̀rọ̀ Ọlọ́run, ẹni tí ó wà láàyè, tí ó sì ń dúró.” Nínú èdè Gíríìkì, àwọn ọ̀rọ̀ tí a túmọ̀ sí “tí ó wà láàyè” àti “tí ó ń dúró” lè ṣàpèjúwe “ọ̀rọ̀” tàbí “Ọlọ́run,” bí ó tilẹ̀ jẹ́ pé àyíká ọ̀rọ̀ náà ṣe àtìlẹ́yìn fún kí wọ́n ṣàpèjúwe “ọ̀rọ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: A ti tún bí yín
  rationale: Ọ̀rọ̀ yìí jẹ́ perfect passive participle. Gbólóhùn Yorùbá yìí sọ ìṣe tí ẹlòmíràn ṣe sí wọn, ó sì fi hàn pé àbájáde rẹ̀ ṣì dúró; lílo gbólóhùn kíkún tún mú un ṣe kedere àti àdánidá ní Yorùbá.
- source_word: σπορᾶς
  choice: irúgbìn
  rationale: “Irúgbìn” bá àwòrán ìbí àti ìyàtọ̀ láàárín ohun tí ń ṣègbé àti ohun tí kì í ṣègbé mu ní Yorùbá.
- source_word: φθαρτῆς
  choice: tí ń ṣègbé
  rationale: Ó jẹ́ ọ̀nà Yorùbá tó ṣe kedere láti sọ ohun tí ó lè bàjẹ́ tàbí parí, ó sì dá ìtakora pẹ̀lú ἀφθάρτου dúró.
- source_word: ἀφθάρτου
  choice: tí kì í ṣègbé
  rationale: A tún gbé gbólóhùn ìtakora kan náà lò kí ìyàtọ̀ tó wà nínú Gíríìkì lè hàn gbangba.
- source_word: διὰ
  choice: nípasẹ̀
  rationale: Pẹ̀lú genitive, διά ń tọ́ka sí ọ̀nà tàbí ohun èlò tí ìṣe fi ṣẹlẹ̀; “nípasẹ̀” jẹ́ àdánidá ní àyíká yìí.
- source_word: λόγου
  choice: ọ̀rọ̀
  rationale: “Ọ̀rọ̀” ni ìtumọ̀ tààrà tí ó sì bá àyíká ẹsẹ tó tẹ̀ lé e mu; “ìhìn” ṣeé ṣe, ṣùgbọ́n ó túmọ̀ sí i lọ́nà tóóró sí i.
- source_word: ζῶντος
  choice: tí ó wà láàyè
  rationale: Ó ṣe àfihàn participle náà gẹ́gẹ́ bí àpèjúwe ọ̀rọ̀, láì fi ìtumọ̀ “tí ń fúnni ní ìyè” kún un.
- source_word: θεοῦ
  choice: Ọlọ́run
  rationale: Nínú “ọ̀rọ̀ Ọlọ́run,” ìbáṣepọ̀ genitive náà hàn ní ọ̀nà àdánidá ní Yorùbá láì yí i sí “ọ̀rọ̀ láti ọ̀dọ̀ Ọlọ́run.”
- source_word: μένοντος
  choice: tí ó sì dúró títí láé
  rationale: “Dúró” pa èrò ìwà-títẹ̀síwájú mọ́; “títí láé” mú ìtumọ̀ ìfaradà pípẹ́ náà ṣe kedere ní Yorùbá àti ní àyíká ẹsẹ 25.
theological_decisions:
- issue: Bóyá ζῶντος àti μένοντος ń ṣàpèjúwe λόγου (“ọ̀rọ̀”) tàbí θεοῦ (“Ọlọ́run”)
  choice: 'A mú wọn gẹ́gẹ́ bí àpèjúwe “ọ̀rọ̀”: “ọ̀rọ̀ Ọlọ́run tí ó wà láàyè, tí ó sì dúró títí láé.”'
  alternative: “ọ̀rọ̀ Ọlọ́run alààyè, ẹni tí ó sì dúró títí láé.”
  rationale: Àwọn participle méjèèjì bá λόγου mu ní ìrísí girama, ẹsẹ 25 sì tẹnu mọ́ ọ̀rọ̀ tí ó dúró. Síbẹ̀, nítorí pé θεοῦ náà wà ní genitive masculine singular, ó ṣeé ṣe ní girama láti so àwọn àpèjúwe náà mọ́ Ọlọ́run; àlàyé ìsàlẹ̀ pa àṣàyàn yẹn mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Ó jẹ́ ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, kò sì lo ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó. “A ti tún bí yín” jẹ́ àdánidá ju pípa participle Gíríìkì mọ́ gẹ́gẹ́ bí àjákù gbólóhùn lọ, ṣùgbọ́n ó pa ohùn àìṣe-ẹni (passive) àti àbájáde tó ń bá a lọ mọ́.
