id: 1PE.1.22
reference: 1 Peter 1:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: yo
  text: Níwọ̀n bí ẹ ti sọ ẹ̀mí yín di mímọ́ nípa ìgbọràn sí òtítọ́, fún ìfẹ́ ará tí kò ní àgàbàgebè[a], ẹ fẹ́ràn ara yín gidigidi láti inú ọkàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfẹ́ fún àwọn onígbàgbọ́ ẹlẹgbẹ́ yín.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìfẹ́ bí ti àwọn ọmọ ẹbí láàárín àwọn onígbàgbọ́, ó sì kan àwọn arákùnrin àti arábìnrin.
    reason: lexical_alternative
  - marker: b
    text: Àwọn àfọwọ́kọ kan ní, “láti inú ọkàn mímọ́.”
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: níwọ̀n bí ẹ ti sọ … di mímọ́
  rationale: Ó fi ìṣe tí a ti ṣe, tí ipa rẹ̀ sì ń bá a lọ hàn, ó sì so ó mọ́ àṣẹ pàtàkì tó tẹ̀ lé e láì sọ pé ìdí nìkan ni.
- source_word: ψυχὰς ὑμῶν
  choice: ọkàn yín
  rationale: Nínú àyíká yìí, ψυχή ń tọ́ka sí ẹni inú tàbí ìgbésí ayé ẹni; “ọkàn yín” jẹ́ ọ̀nà Yorùbá tó mọ́gbọ́n dání láti pa ìtumọ̀ yìí mọ́ láì dín un kù sí ara nìkan.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: nípa ṣíṣègbọ́ràn sí òtítọ́
  rationale: “Nípa” fi ipa ọ̀nà tàbí irinṣẹ́ tí ἐν lè ní hàn, “sí òtítọ́” sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé a ṣègbọ́ràn sí ohun kan.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: láti lè ní ìfẹ́ ará tí kò ní àgàbàgebè
  rationale: “Láti lè” mú ète tàbí àbájáde εἰς jáde; “ìfẹ́ ará” pa àwòrán ìfẹ́ inú ẹbí ti φιλαδελφία mọ́, “tí kò ní àgàbàgebè” sì túmọ̀ ἀνυπόκριτον ní kedere.
- source_word: ἐκ καρδίας
  choice: fi gbogbo ọkàn
  rationale: Gbólóhùn Yorùbá yìí túmọ̀ sí fífẹ́ láti inú ọkàn tọkàntọkàn. A kò fi “mímọ́” kún un, nítorí kò sí nínú ọ̀rọ̀ SBLGNT tí a yàn.
- source_word: ἀλλήλους ἀγαπήσατε ἐκτενῶς
  choice: ẹ … fẹ́ràn ara yín gidigidi
  rationale: Àṣẹ “ẹ fẹ́ràn” bá aorist imperative mu ní Yorùbá àdánidá; “ara yín” fi ìṣe àsọ̀padà hàn, “gidigidi” sì sọ okun àti ìtara ἐκτενῶς di mímọ̀.
theological_decisions:
- issue: Ìyàtọ̀ láàárín φιλαδελφία àti ἀγαπάω nínú ẹsẹ kan náà
  choice: Lo “ìfẹ́ ará” fún φιλαδελφία, kí a sì lo “fẹ́ràn” fún ἀγαπάω.
  alternative: Lo ọ̀rọ̀ “ìfẹ́/fẹ́ràn” lásán fún àwọn méjèèjì.
  rationale: Èyí pa àwọ̀ ọ̀rọ̀ Gíríìkì mọ́ láì fi ìyàtọ̀ ẹ̀kọ́ ìsìn tí ó le ju ohun tí ẹsẹ náà sọ lọ kún un.
- issue: Bóyá “ará” nínú φιλαδελφία kan àwọn ọkùnrin nìkan
  choice: Pa “ìfẹ́ ará” mọ́ nínú ẹsẹ, kí àlàyé ìsàlẹ̀ ojú ìwé sọ pé ó kan gbogbo àwọn onígbàgbọ́, lọ́kùnrin àti lóbìnrin.
  alternative: “Ìfẹ́ fún àwọn onígbàgbọ́ ẹlẹgbẹ́ yín.”
  rationale: “Ará” jẹ́ ọ̀rọ̀ Yorùbá tó lè gba akọ àti abo, ó sì tún pa àwòrán ẹbí inú ọ̀rọ̀ Gíríìkì mọ́.
- issue: Àyípadà àfọwọ́kọ lẹ́yìn ἐκ καρδίας
  choice: Túmọ̀ ọ̀rọ̀ SBLGNT gẹ́gẹ́ bí “fi gbogbo ọkàn,” láì fi “mímọ́” kún un.
  alternative: “Láti inú ọkàn mímọ́.”
  rationale: SBLGNT tí a pèsè kò ní καθαρᾶς; àyípadà náà yẹ fún àlàyé ìsàlẹ̀ ojú ìwé, kì í ṣe fún ẹsẹ pàtàkì.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tó bójú mu, tó níyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti jẹ́ àdánidá. “Ìfẹ́ ará” pa àwòrán ẹbí Gíríìkì mọ́, “fi gbogbo ọkàn” sì jẹ́ ọ̀nà Yorùbá tó ṣàn láti sọ ìfẹ́ tọkàntọkàn.
