id: 1PE.1.24
reference: 1 Peter 1:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: yo
  text: Nítorí pé gbogbo ẹran-ara dàbí koríko, gbogbo ògo rẹ̀ sì dàbí òdòdó koríko; koríko gbẹ, òdòdó náà sì ṣubú.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διότι
  choice: nítorí pé
  rationale: Ó fi ìdí ọ̀rọ̀ tó ṣáájú múlẹ̀, ó sì pa agbára ìtumọ̀ ìdí tí ọ̀rọ̀ Gíríìkì náà ní mọ́.
- source_word: πᾶσα σὰρξ
  choice: gbogbo ẹran ara
  rationale: Ìtumọ̀ yìí pa àwòrán ‘ẹran ara’ inú Gíríìkì àti ìtọ́kasí sí Aísáyà 40:6 mọ́; níbí, ó ń tọ́ka sí gbogbo ènìyàn gẹ́gẹ́ bí ẹni kíkú, kì í ṣe sí ìwà ẹ̀ṣẹ̀.
- source_word: ὡς χόρτος
  choice: dàbí koríko
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ àfiwé náà, ó sì fi àìpéye ìwàláàyè ènìyàn hàn.
- source_word: πᾶσα δόξα αὐτῆς
  choice: gbogbo ògo rẹ̀
  rationale: ‘Ògo’ lè túmọ̀ sí ọlá tàbí ẹwà tó hàn gbangba; ‘rẹ̀’ ń tọ́ka padà sí ‘gbogbo ẹran ara’ gẹ́gẹ́ bí àkójọpọ̀ kan.
- source_word: ὡς ἄνθος χόρτου
  choice: dàbí òdòdó koríko
  rationale: Ó pa àwòrán gẹ́gẹ́ bí Gíríìkì ṣe gbé e kalẹ̀ mọ́ láì yí χόρτος sí ‘pápá.’
- source_word: ἐξηράνθη
  choice: gbẹ
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ àdánidá fún koríko tó pàdánù omi rẹ̀, tó sì rọ.
- source_word: ἐξέπεσεν
  choice: jábọ́
  rationale: Ó sọ ní kedere pé òdòdó náà ya kúrò níbi tó wà, ó sì ṣubú.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú àyọlò tó ń sọ nípa kíkú àti àìpéye ènìyàn
  choice: gbogbo ẹran ara
  alternative: gbogbo aráyé / gbogbo ènìyàn
  rationale: Ọ̀rọ̀ náà kò ń sọ nípa ìwà ẹ̀ṣẹ̀ níbí, bí kò ṣe pé gbogbo ènìyàn jẹ́ ẹni kíkú, ìwàláàyè wọn sì kúrú. Dídá ‘ẹran ara’ sílẹ̀ tún pa ìbáṣepọ̀ rẹ̀ pẹ̀lú Aísáyà 40:6 mọ́.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò, pẹ̀lú èdè tó bójú mu, tó sì ṣeé lóye. A pa ìṣàn ewì inú àyọlò náà mọ́ nípa lílo àfiwé méjèèjì àti àmì àárín gbólóhùn; a sì gbe àmì àlàyé [b] sí ‘ògo rẹ̀,’ ibi tí àṣàyàn ọ̀rọ̀ náà ti jẹ mọ́.
