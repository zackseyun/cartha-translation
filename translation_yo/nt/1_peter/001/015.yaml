  text: but as the Holy One who called you is holy[a], you yourselves also be holy in all your conduct[b],
translation:
  language: yo
  text: Ṣùgbọ́n gẹ́gẹ́ bí Ẹni tí ó pè yín ṣe jẹ́ mímọ́, ẹ̀yin fúnra yín náà, ẹ jẹ́ mímọ́[a] nínú gbogbo ìwà yín[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ di mímọ́.” Ọ̀rọ̀ àṣẹ Gíríìkì náà lè tẹnu mọ́ wíwọ ipò mímọ́ náà tàbí fífi ìwà mímọ́ hàn, bí ó tilẹ̀ jẹ́ pé “ẹ jẹ́ mímọ́” jẹ́ ọ̀nà àṣẹ Yorùbá tó wọ́pọ̀ síi níbí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú gbogbo ọ̀nà ìgbésí ayé yín.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí gbogbo ìhùwàsí àti ọ̀nà tí ènìyàn ń gbà gbé ayé rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn sí àwọn ìfẹ́kúfẹ̀ẹ́ àtijọ́ tí ẹsẹ tó ṣáájú mẹ́nu kàn; “Ṣùgbọ́n” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìtakora yìí.
- source_word: κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον
  choice: gẹ́gẹ́ bí Ẹni tí ó pè yín ṣe jẹ́ mímọ́
  rationale: “Gẹ́gẹ́ bí ... ṣe” fi ìbámu tàbí àfiwé tí κατὰ ń béèrè hàn. “Ẹni tí ó pè yín” túmọ̀ àpólà participle náà lọ́nà àdánidá, “jẹ́ mímọ́” sì pa ìwà mímọ́ Ẹni tó pè wọ́n mọ́ láìfi akọ́lé kan tí kò ṣe dandan kún un.
- source_word: καὶ αὐτοὶ
  choice: ẹ̀yin fúnra yín pẹ̀lú
  rationale: “Fúnra yín” pa ìtẹnumọ́ αὐτοὶ mọ́, “pẹ̀lú” sì ṣojú καί.
- source_word: ἅγιοι ... γενήθητε
  choice: ẹ jẹ́ mímọ́
  rationale: Ó jẹ́ ọ̀rọ̀ àṣẹ Yorùbá tó ṣe déédéé, ó sì pa àtúnsọ “mímọ́” mọ́. Ó lè tọ́ka sí jíjẹ́ mímọ́ tàbí dídé ipò náà láìfi ẹ̀kọ́ ìsìn kan pàtó lé e lórí.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: nínú gbogbo ìwà yín
  rationale: ἀναστροφή túmọ̀ sí gbogbo ọ̀nà ìgbésí ayé tàbí ìhùwàsí ẹni. “Gbogbo ìwà yín” jẹ́ kedere, kúkúrú, ó sì wọ́pọ̀ ní Yorùbá òde òní.
theological_decisions:
- issue: Ìbáṣepọ̀ láàárín ìwà mímọ́ Ọlọ́run àti ìpè àwọn onígbàgbọ́ sí ìwà mímọ́
  choice: gẹ́gẹ́ bí Ẹni tí ó pè yín ṣe jẹ́ mímọ́ ... ẹ jẹ́ mímọ́
  alternative: gẹ́gẹ́ bí Ẹni Mímọ́ tí ó pè yín ... ẹ jẹ́ mímọ́
  rationale: Yíyan gbolohun “ṣe jẹ́ mímọ́” mú àfiwé náà pé ní Yorùbá, ó sì pa àtúnsọ ἅγιον/ἅγιοι mọ́ láìyí adjective àkọ́kọ́ padà sí akọ́lé dandan.
- issue: Agbára ọ̀rọ̀ àṣẹ γενήθητε
  choice: ẹ jẹ́ mímọ́
  alternative: ẹ di mímọ́
  rationale: “Ẹ jẹ́ mímọ́” jẹ́ ìṣírí àdánidá, kò sì gbé àlàyé ẹ̀kọ́ ìsìn kan wọlé nípa bí ìsọdimímọ́ ṣe ń lọ. “Ẹ di mímọ́” ṣì ṣeé ṣe bí a bá tẹnu mọ́ wíwọ ipò náà.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ni a lò. Èdè náà ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní; “Ẹni tí ó pè yín” àti “gbogbo ìwà yín” yẹra fún èdè àtijọ́ tàbí ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó le.
