id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: yo
  text: Ìbùkún ni fún Ọlọ́run àti Baba Olúwa wa Jésù Mèsáyà[a], ẹni tí ó, ní ìbámu pẹ̀lú àánú rẹ̀ tí ó pọ̀, tún bí wa[b] sí ìrètí alààyè nípasẹ̀ àjíǹde Jésù Mèsáyà láti inú àwọn òkú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός jẹ́ oyè tí ó túmọ̀ sí ẹni tí a fi òróró yàn, ìyẹn Mèsáyà.
    reason: alternative_reading
  - marker: b
    text: Tàbí “ó fún wa ní ìbí tuntun.” Ọ̀rọ̀-ìṣe Gíríìkì náà pa àwòrán ìbí tuntun mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Olùbùkún ni
  rationale: Ó pa ìrísí ọ̀rọ̀ ìyìn inú Gíríìkì mọ́, ó sì jẹ́ ọ̀rọ̀ ọlá tí ó bójú mu nínú Yorùbá.
- source_word: θεὸς καὶ πατὴρ
  choice: Ọlọ́run àti Baba
  rationale: Ó pa àwọn orúkọ méjèèjì àti ìbáṣepọ̀ tí gbólóhùn Gíríìkì fi hàn mọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: A lò ó gẹ́gẹ́ bí oyè ìjọba, kì í ṣe ọ̀rọ̀ ìkíni lásán.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Mèsáyà mú ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè ẹni àmì òróró Ọlọ́run jáde, dípò kí ó dà bí orúkọ ìdílé.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: ní ìbámu pẹ̀lú àánú rẹ̀ tí ó pọ̀
  rationale: Ní ìbámu pẹ̀lú ṣètọ́jú ìtumọ̀ ìwọ̀n tàbí ìlànà inú κατά, láì sọ ọ́ di ìdí nìkan; àánú rẹ̀ tí ó pọ̀ jẹ́ Yorùbá àdánidá fún πολὺ ἔλεος.
- source_word: ἀναγεννήσας
  choice: ó tún bí wa
  rationale: Ó pa àwòrán ìbí tuntun àti pé Ọlọ́run ni olùṣe mọ́ ní ṣókí àti ní Yorùbá àdánidá.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: sí ìrètí alààyè
  rationale: Sí fi ibi àfojúsùn tàbí àbájáde hàn, ìrètí alààyè sì pa àwòrán ζῶσαν mọ́.
- source_word: δι’ ἀναστάσεως
  choice: nípasẹ̀ àjíǹde
  rationale: Nípasẹ̀ fi ọ̀nà tàbí ohun èlò tí διά pẹ̀lú ọ̀rọ̀ ìní ń tọ́ka sí hàn.
- source_word: ἐκ νεκρῶν
  choice: kúrò nínú àwọn òkú
  rationale: Ó ṣe àfihàn ìtọ́sọ́nà ἐκ àti ọ̀pọ̀ nọ́ńbà νεκρῶν ní Yorùbá tí ó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè nípa ẹni tí Ọlọ́run yàn
  choice: Mèsáyà
  alternative: Kristi
  rationale: Mèsáyà jẹ́ kí iṣẹ́ Χριστός gẹ́gẹ́ bí oyè dúró gbangba, láì sọ ọ́ di apá orúkọ lásán.
- issue: Pé Ọlọ́run ni olùṣe nínú ἀναγεννήσας
  choice: ó tún bí wa
  alternative: ó fún wa ní ìbí tuntun
  rationale: Gbólóhùn yìí jẹ́ kí Ọlọ́run dúró gẹ́gẹ́ bí olùṣe, ó sì pa àwòrán bíbí mọ́ láì fi ètò ẹ̀kọ́ ẹ̀sìn mìíràn kún un.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. Ìṣètò gbólóhùn náà pa ìrísí ọ̀rọ̀ ìyìn àti ìbáṣepọ̀ àwọn apá Gíríìkì mọ́, ṣùgbọ́n ó ṣì ṣe kedere fún òǹkàwé Yorùbá òde òní.
