  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: yo
  text: sí ogún tí kò lè bàjẹ́, tí kò ní èérí, tí kò sì lè rẹ̀, tí a ti pa mọ́ ní ọ̀run fún yín,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς κληρονομίαν
  choice: sí ogún
  rationale: “Sí” preserves the directional force of εἰς in this continuation, while “ogún” is the natural Yoruba term for an inheritance.
- source_word: ἄφθαρτον
  choice: tí kò lè bàjẹ́
  rationale: Expresses that the inheritance is imperishable or beyond decay in clear modern Yoruba.
- source_word: ἀμίαντον
  choice: tí kò ní èérí
  rationale: Conveys being undefiled, unstained, or uncontaminated without adding a specifically ritual interpretation.
- source_word: ἀμάραντον
  choice: tí kò sì lè rẹ̀
  rationale: Retains the image of something that cannot wither or fade, and the conjunction reflects the repeated καί.
- source_word: τετηρημένην
  choice: tí a ti pa mọ́
  rationale: The perfect passive participle is represented by “a ti,” indicating an inheritance already kept and remaining reserved.
- source_word: ἐν οὐρανοῖς
  choice: ní ọ̀run
  rationale: Although the Greek form is plural, standard Yoruba naturally uses the singular collective “ọ̀run” for the heavenly realm.
- source_word: εἰς ὑμᾶς
  choice: fún yín
  rationale: In this context εἰς marks the intended beneficiaries; “fún yín” is natural and preserves the plural second-person reference.
theological_decisions:
- issue: The location and present preservation of the inheritance
  choice: tí a ti pa mọ́ ní ọ̀run fún yín
  alternative: tí Ọlọ́run ti pa mọ́ ní ọ̀run fún yín
  rationale: The Greek uses a divine passive without explicitly naming God as the agent. The translation preserves that wording rather than supplying the agent.
translation_notes:
  register: Standard, dignified, and accessible Yoruba with full tone marks. The wording remains a dependent continuation of verse 3, as indicated by the initial “sí” and final comma.
