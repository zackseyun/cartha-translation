id: 1PE.1.7
reference: 1 Peter 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: yo
  text: kí ìdánilójú pé ìgbàgbọ́ yín jẹ́ ojúlówó—èyí tí ó ṣeyebíye ju wúrà tí ń ṣègbé lọ, bí ó tilẹ̀ jẹ́ pé a ń dán wúrà náà wò nípasẹ̀ iná—lè yọrí sí ìyìn, ògo àti ọlá nígbà ìfihàn Jésù Mèsáyà[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìdánwò ìgbàgbọ́ yín”; ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ ìlànà ìdánwò náà tàbí ẹ̀rí pé ìgbàgbọ́ náà jẹ́ ojúlówó.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Jésù Kristi.” Níhìn-ín, “Mèsáyà” ni ìtumọ̀ oyè Gíríìkì náà, Χριστός.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “kí a rí i pé ó yọrí sí ìyìn, ògo àti ọlá.”
    reason: previous_rendering
lexical_decisions:
- source_word: δοκίμιον
  choice: ìdánilójú òtítọ́
  rationale: 'Ó fi ìtumọ̀ àbájáde hàn: ohun tí ìdánwò ti fi hàn pé ó jẹ́ ojúlówó, kì í ṣe ìṣe ìdánwò nìkan.'
- source_word: πίστεως
  choice: ìgbàgbọ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó tọ́ka sí ìgbàgbọ́ àwọn onígbàgbọ́ tí a ń dán wò.
- source_word: πολυτιμότερον
  choice: ṣeyebíye ju
  rationale: Ó pa ìfiwéra iye mọ́, ó sì bá ọ̀rọ̀ nípa wúrà mu lọ́nà àdánidá ní Yorùbá.
- source_word: χρυσίου
  choice: wúrà
  rationale: Ìtumọ̀ tààrà tí ó sì bá àfiwé náà mu.
- source_word: ἀπολλυμένου
  choice: tí ń ṣègbé
  rationale: Ó pa agbára ọ̀rọ̀-ìṣe náà mọ́, ó sì fi àìpéye wúrà hàn.
- source_word: διὰ πυρὸς
  choice: nípasẹ̀ iná
  rationale: Ó ṣàfihàn pé iná ni ohun èlò tí a fi ń dán wúrà wò.
- source_word: δοκιμαζομένου
  choice: a ń dán ... wò
  rationale: Ó tọ́ka sí fífi wúrà yẹ̀ wò láìfi ìtumọ̀ ìyọ́mọ́ irin kún un ju ohun tí Gíríìkì sọ lọ.
- source_word: εὑρεθῇ εἰς
  choice: lè yọrí sí
  rationale: Ó sọ àbájáde tí a ó rí nígbà ìṣípayá di mímọ̀ ní Yorùbá àdánidá; àlàyé ìtumọ̀ tó sún mọ́ ìṣe aláìṣe wà nínú àlàyé ìsàlẹ̀.
- source_word: ἔπαινον
  choice: ìyìn
  rationale: Ìtumọ̀ Yorùbá tó wọ́pọ̀ fún ìfọwọ́sí tàbí ìyìn.
- source_word: δόξαν
  choice: ògo
  rationale: Ìtumọ̀ boṣewa, ó sì jẹ́ apá kan nínú ọ̀wọ́ mẹ́ta náà.
- source_word: τιμήν
  choice: ọlá
  rationale: Ó fi ìtumọ̀ ìyẹ̀sí àti ọlá gbangba hàn lẹ́gbẹ̀ẹ́ ìyìn àti ògo.
- source_word: ἐν ἀποκαλύψει
  choice: nígbà ìṣípayá
  rationale: 'Ìtumọ̀ àkókò ni ó ṣeé ṣe jù lọ níbí: nígbà tí Jésù yóò farahàn ní kíkún.'
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Χριστός jẹ́ oyè tó túmọ̀ sí Mèsáyà; a mú ìtumọ̀ oyè náà wá sí Yorùbá dípò lílo àkọlé tí a yá láti èdè míì.
theological_decisions:
- issue: Ìtumọ̀ τὸ δοκίμιον ὑμῶν τῆς πίστεως
  choice: “ìdánilójú òtítọ́ ìgbàgbọ́ yín” ń tọ́ka sí ìgbàgbọ́ tí ìdánwò fi hàn pé ó jẹ́ ojúlówó
  alternative: “ìdánwò ìgbàgbọ́ yín,” èyí tí yóò tẹnu mọ́ ìlànà ìdánwò náà
  rationale: δοκίμιον lè ní ìtumọ̀ méjèèjì, ṣùgbọ́n àfiwé rẹ̀ pẹ̀lú wúrà tí a dán wò ń ṣètìlẹ́yìn fún ìtumọ̀ àbájáde; àlàyé ìsàlẹ̀ pa ìtumọ̀ kejì mọ́.
- issue: Ẹni tí “ìyìn, ògo àti ọlá” jẹ́ tirẹ̀
  choice: A kò sọ ẹni tí yóò gba tàbí fún ìyìn, ògo àti ọlá náà ní pàtó
  alternative: Ọlá tí a fi fún àwọn onígbàgbọ́; ìyìn tí a darí sí Ọlọ́run tàbí Mèsáyà; tàbí ìdáláre ìkẹyìn tí ó so méjèèjì pọ̀
  rationale: Gíríìkì kò sọ olùgbà tàbí orísun àwọn mẹ́tẹ̀ẹ̀ta ní kedere, nítorí náà a pa àìdánilójú náà mọ́ láìfi ẹ̀kọ́ ẹ̀sìn kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa àfiwé, àìdánilójú, àti ọ̀wọ́ mẹ́ta “ìyìn, ògo àti ọlá” mọ́.
