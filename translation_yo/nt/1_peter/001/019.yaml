  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: yo
  text: ṣùgbọ́n pẹ̀lú ẹ̀jẹ̀ iyebíye ti Mèsáyà[a], bí ti ọ̀dọ́-àgùntàn tí kò ní àbùkù, tí kò sì ní àbàwọ́n.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Kristi.” Ọ̀rọ̀ Gíríìkì Χριστοῦ jẹ́ oyè tó túmọ̀ sí “Mèsáyà”; “Kristi” jẹ́ ọ̀nà ìtumọ̀ ìbílẹ̀.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ líle hàn sí ọ̀nà ìràpadà tí ẹsẹ tó ṣáájú kọ̀, ó sì jẹ́ ọ̀rọ̀ ìsopọ̀ Yorùbá tó ṣe déédé.
- source_word: τιμίῳ
  choice: iyebíye
  rationale: Ó ní ìtumọ̀ ohun tó níye lórí àti ohun tó yẹ fún ọlá, láì sọ ọ́ di ọ̀rọ̀ iye owó lásán.
- source_word: αἵματι
  choice: ẹ̀jẹ̀
  rationale: A pa àwòrán gidi ti ẹ̀jẹ̀ mọ́; ó tọ́ka sí ikú ẹbọ ní àyíká ọ̀rọ̀ náà, ṣùgbọ́n a kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rọ́pò ọ̀rọ̀ gangan.
- source_word: ὡς
  choice: bí ẹ̀jẹ̀
  rationale: Ó mú àfiwé náà ṣe kedere ní Yorùbá pé ẹ̀jẹ̀ ni a ń fi wé ẹ̀jẹ̀ ọ̀dọ́-àgùntàn; àfikún ẹ̀jẹ̀ kejì jẹ́ ìmúṣẹ ìtumọ̀ tó wà nínú Gíríìkì.
- source_word: ἀμνοῦ
  choice: ọ̀dọ́-àgùntàn
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún lamb, ó sì pa àwòrán ẹran ẹbọ mọ́.
- source_word: ἀμώμου
  choice: tí kò ní àbùkù
  rationale: Ó bá èdè ẹbọ mu, ó sì tọ́ka sí àìní àléébù dípò kí a yí i sí ìwà rere lásán.
- source_word: καὶ
  choice: tí kò sì
  rationale: Ìlò “sì” darapọ̀ àwọn àpèjúwe méjèèjì lọ́nà àdánidá nínú èdè Yorùbá.
- source_word: ἀσπίλου
  choice: ní àbàwọ́n
  rationale: Pẹ̀lú ìkọ̀ “kò,” ó túmọ̀ sí “láìní àbàwọ́n,” ó sì pa ìyàtọ̀ kékeré láàárín àwọn àpèjúwe méjì náà mọ́.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Níbí, Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” mú ìtumọ̀ oyè náà hàn gbangba, ó sì yẹ pẹ̀lú àyíká ọ̀rọ̀ ẹbọ.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà jẹ́ oyè ní àyíká yìí, nítorí náà “Mèsáyà” pa ìtumọ̀ rẹ̀ mọ́ kedere. “Kristi” jẹ́ ìtumọ̀ ìbílẹ̀ tí ó ṣeé ṣe, a sì fi sí àlàyé ìsàlẹ̀.
- issue: Ìbáṣepọ̀ àfiwé ọ̀dọ́-àgùntàn
  choice: bí ẹ̀jẹ̀ ọ̀dọ́-àgùntàn
  alternative: bí ti ọ̀dọ́-àgùntàn
  rationale: Gíríìkì lè jẹ́ kúkúrú níbi àfiwé yìí; pípa “ẹ̀jẹ̀” sọ ní Yorùbá mú kí ó ṣe kedere pé ẹ̀jẹ̀ ni a ń fi wé, láì mú àwòrán ẹbọ kúrò.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àgbàṣe tó níyì ṣùgbọ́n tó ṣeé lóye. A lo àmì ohùn ní kíkún, a sì lo “ọ̀dọ́-àgùntàn” fún lamb. Ẹsẹ yìí jẹ́ ìtẹ̀síwájú gbolohun ẹsẹ tó ṣáájú, nítorí náà a pa ìbẹ̀rẹ̀ “ṣùgbọ́n pẹ̀lú” mọ́.
