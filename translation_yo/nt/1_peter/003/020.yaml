id: 1PE.3.20
reference: 1 Peter 3:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: yo
  text: àwọn tí wọ́n ṣàìgbọ́ràn nígbà kan rí, nígbà tí sùúrù Ọlọ́run ń dúró ní ọjọ́ Nóà, bí a ti ń kọ́ ọkọ̀ áàkì. Nínú ọkọ̀ áàkì náà ni àwọn ènìyàn díẹ̀—ìyẹn ni, ènìyàn mẹ́jọ[a]—wọ̀, a sì mú wọn la omi kọjá láìléwu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ọkàn mẹ́jọ.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “a gbà wọ́n là nípasẹ̀ omi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: àwọn tí wọ́n ṣàìgbọ́ràn
  rationale: Ó fi ìkọ̀ láti gbọ́ràn hàn, kò sì dín ìtumọ̀ náà kù sí àìní ìgbàgbọ́ nìkan.
- source_word: ποτε
  choice: nígbà kan rí
  rationale: Ọ̀nà Yorùbá àdánidá ni láti tọ́ka sí àkókò kan ní ìgbà àtijọ́.
- source_word: ἀπεξεδέχετο
  choice: ń dúró
  rationale: Àmì ‘ń’ fi ìṣe tí ó ń bá a lọ hàn; ‘sùúrù’ tó wà lẹ́gbẹ̀ẹ́ rẹ̀ ti mú èrò ìfaradà wọ inú gbólóhùn náà.
- source_word: μακροθυμία
  choice: sùúrù
  rationale: Ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìfaradà Ọlọ́run àti dídá ìdájọ́ dúró.
- source_word: κατασκευαζομένης
  choice: bí a ti ń kọ́
  rationale: Nínú ọ̀rọ̀ ọkọ̀ Nóà, ‘kọ́’ jẹ́ ọ̀nà àdánidá láti sọ pé a ń pèsè tàbí ṣe ọkọ̀ náà.
- source_word: κιβωτοῦ
  choice: ọkọ̀ áàkì
  rationale: Ó jẹ́ ọ̀rọ̀ tí àwọn òǹkàwé Yorùbá mọ̀ fún ọkọ̀ Nóà, ó sì yà á sọ́tọ̀ kúrò nínú àpótí lásán.
- source_word: εἰς ἣν
  choice: Inú rẹ̀ ... wọ̀
  rationale: Ó pa ìtumọ̀ ìlọsí-inú mọ́, dípò kí ó sọ ibi tí wọ́n wà nìkan.
- source_word: ὀλίγοι
  choice: àwọn ènìyàn díẹ̀
  rationale: Ó fi ìwọ̀nba kékeré àwọn tó wà nínú ọkọ̀ náà hàn ní Yorùbá àdánidá.
- source_word: ψυχαί
  choice: ènìyàn
  rationale: Níhìn-ín ψυχή ń ka àwọn ènìyàn, kì í ṣe pé ó ń kọ́ni ní ẹ̀kọ́ pàtó nípa ọkàn.
- source_word: διεσώθησαν
  choice: a mú wọn ... kọjá láìléwu
  rationale: Ó mú ìtumọ̀ dídáàbò bo wọn láàárín ewu àti mímú wọn dé òpin láìléwu jáde.
- source_word: δι’ ὕδατος
  choice: la omi kọjá
  rationale: Ó fi ìrìn kọjá láàárín omi ìkún-omi hàn, láìfi tipátipá pinnu pé omi náà nìkan ni ohun èlò ìgbàlà.
theological_decisions:
- issue: Ìtumọ̀ διεσώθησαν tí ó lè ru èrò ẹ̀kọ́ ìgbàlà
  choice: a mú wọn la omi kọjá láìléwu
  alternative: a gbà wọ́n là nípasẹ̀ omi
  rationale: Ìtumọ̀ àkọ́kọ́ tẹnu mọ́ bí Ọlọ́run ṣe dá wọn sí ní àárín ewu ìkún-omi, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ìtumọ̀ ‘gbà là’ àti agbára ‘nípasẹ̀ omi’ sílẹ̀ fún ìsopọ̀ rẹ̀ pẹ̀lú ẹsẹ tó tẹ̀ lé.
- issue: Bí a ṣe túmọ̀ ψυχαί
  choice: ènìyàn mẹ́jọ
  alternative: ọkàn mẹ́jọ
  rationale: Àyíká ọ̀rọ̀ ń ka àwọn ènìyàn inú áàkì, kò sì ń ṣe àlàyé ẹ̀dá ènìyàn sí ara àti ọkàn; a pa ìtumọ̀ gangan mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn níbi tó bá yẹ, a sì yan ‘ọkọ̀ áàkì’ gẹ́gẹ́ bí ọ̀rọ̀ tí ó mọ́ ní àyíká Nóà. Ìtò gbólóhùn náà jẹ́ àdánidá ní Yorùbá, bó tilẹ̀ jẹ́ pé ó pa ìlọsí-inú inú εἰς ἣν àti ìṣe tó ń bá a lọ inú ἀπεξεδέχετο mọ́.
