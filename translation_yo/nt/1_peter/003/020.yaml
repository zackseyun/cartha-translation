  source_fidelity: 'Ìtumọ̀ náà fara mọ́ Gíríìkì dáadáa ní gbogbogbòò: ó pa àìgbọ́ràn ìgbàanì, sùúrù Ọlọ́run tí ń dúró, kíkọ́ áàkì, ìwọlé sínú rẹ̀, iye mẹ́jọ, àti ìdáàbòbo nípasẹ̀ omi mọ́. Síbẹ̀, “ní àwọn ọjọ́ Nóà” kì í ṣe ìlò Yorùbá tó rọrùn; “ní ọjọ́ Nóà” dára jù. “Inú rẹ̀” tún lè ní atọ́kasí tí kò yege lẹ́yìn gbolóhùn àkọ́kọ́, nítorí náà ó dára láti tún “ọkọ̀ áàkì náà” mẹ́nu kedere.'
