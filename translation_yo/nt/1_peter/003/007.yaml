source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: yo
  text: '**1 Pétérù 3:7**


    Bákan náà, ẹ̀yin ọkọ, ẹ máa bá àwọn aya yín gbé ní ìbámu pẹ̀lú ìmọ̀[a]. Ẹ máa fi ọlá fún obìnrin náà gẹ́gẹ́ bí ohun èlò tí ó jẹ́ aláìlera jù[b], àti gẹ́gẹ́ bí ẹni tí ó tún jẹ́ alábájọjogún oore-ọ̀fẹ́ ìyè pẹ̀lú yín[c], kí àwọn àdúrà yín má bàa ní ìdíwọ́.


    [a] Tàbí, “ẹ máa bá wọn gbé pẹ̀lú òye.”


    [b] “Ohun èlò tí ó jẹ́ aláìlera jù” jẹ́ àkàwé tí ó ṣeé ṣe kí ó tọ́ka sí àìlera ara tàbí ipò àìláàbò obìnrin nínú àwùjọ, kì í ṣe pé iye rẹ̀ kéré. Gbólóhùn tí ó tẹ̀ lé e fi hàn pé aya náà tún jẹ́ alábájọjogún oore-ọ̀fẹ́ ìyè.


    [c] Tàbí, “àwọn tí wọ́n jọ ń jogún oore-ọ̀fẹ́ ìyè pẹ̀lú yín.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ máa bá wọn gbé pẹ̀lú òye.”
    reason: lexical_alternative
  - marker: b
    text: “Ohun èlò tí ó jẹ́ aláìlera jù” jẹ́ àkàwé tí ó ṣeé ṣe kí ó tọ́ka sí àìlera ara tàbí ipò àìláàbò obìnrin nínú àwùjọ, kì í ṣe pé iye rẹ̀ kéré. Gbólóhùn tí ó tẹ̀ lé e fi hàn pé aya náà tún jẹ́ alábájọjogún oore-ọ̀fẹ́ ìyè.
    reason: cultural_note
  - marker: c
    text: Tàbí, “àwọn tí wọ́n jọ ń jogún oore-ọ̀fẹ́ ìyè pẹ̀lú yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: ẹ̀yin ọkọ
  rationale: Àyíká ọ̀rọ̀ nípa ìgbéyàwó, lẹ́yìn ìtọ́ni sí àwọn aya ní 3:1, fi hàn pé ‘àwọn ọkọ’ ni ọ̀rọ̀ náà ń tọ́ka sí, kì í ṣe gbogbo ọkùnrin.
- source_word: ὁμοίως
  choice: Bẹ́ẹ̀ gẹ́gẹ́
  rationale: Ó pa ìsopọ̀ mọ́ àwọn ìtọ́ni tó ṣáájú, ó sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ‘bákan náà.’
- source_word: συνοικοῦντες
  choice: ẹ máa bá àwọn aya yín gbé
  rationale: Ó túmọ̀ sí gbígbé papọ̀ nínú àjọṣe ìgbéyàwó; a sọ ẹni tí a bá ń gbé ní kedere láti inú àyíká ọ̀rọ̀.
- source_word: κατὰ γνῶσιν
  choice: ní ìbámu pẹ̀lú ìmọ̀
  rationale: 'Ìtumọ̀ yìí pa fífẹ̀ gbólóhùn Gíríìkì mọ́: ìgbé ayé tí ìmọ̀ àti òye ń darí. Ìtumọ̀ Yorùbá tó rọrùn sí i wà nínú àlàyé ìsàlẹ̀.'
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: obìnrin náà gẹ́gẹ́ bí ohun èlò tí ó jẹ́ aláìlera jù
  rationale: A pa àkàwé ‘ohun èlò’ àti ìfiwéra ‘aláìlera jù’ mọ́ láì sọ pé ó ní iye, ìwà rere, tàbí ipò ẹ̀mí tí ó rẹlẹ̀.
- source_word: ἀπονέμοντες τιμήν
  choice: Ẹ máa fi ọlá fún
  rationale: Èyí jẹ́ Yorùbá àdánidá fún fífi ọlá tí ó yẹ fún ẹnì kan.
- source_word: συγκληρονόμοις
  choice: ẹni tí ó tún jẹ́ alábájọjogún ... pẹ̀lú yín
  rationale: Ó sọ ní kedere pé aya náà ní ìpín kan náà nínú ogún, ó sì pa agbára καί (‘tún/pẹ̀lú’) mọ́.
- source_word: χάριτος ζωῆς
  choice: oore-ọ̀fẹ́ ìyè
  rationale: Ó pa ìbáṣepọ̀ àwọn ọ̀rọ̀ Gíríìkì mọ́ láì pinnu bóyá ó túmọ̀ sí oore-ọ̀fẹ́ tí í ṣe ìyè tàbí oore-ọ̀fẹ́ tí ń fúnni ní ìyè.
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: kí àdúrà yín má bàa ní ìdíwọ́
  rationale: Ó fi ète tàbí àbájáde hàn ní Yorùbá àdánidá, ó sì pa ìtumọ̀ ìdíwọ́ tí gbólóhùn Gíríìkì ní mọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘ohun èlò tí ó jẹ́ aláìlera jù’
  choice: A pa àkàwé àti ìfiwéra aláìlera mọ́, ṣùgbọ́n a kò fi ìrẹ̀lẹ̀ iye tàbí ipò ẹ̀mí kún un.
  alternative: Ó lè tọ́ka pàtó sí àìlera ara tàbí sí ipò àìláàbò nínú àwùjọ.
  rationale: Ọ̀rọ̀ náà fúnra rẹ̀ kò sọ irú àìlera náà ní pàtó. Àyíká ọ̀rọ̀ pàṣẹ pé kí ọkọ fi ọlá fún aya, ó sì pe aya ní alábájọjogún oore-ọ̀fẹ́ ìyè; nítorí náà, kò yẹ kí ìtumọ̀ fi àìdọ́gba iye tàbí ipò ẹ̀mí sínú rẹ̀.
- issue: Ìbájọjogún oore-ọ̀fẹ́ ìyè
  choice: Aya jẹ́ alábájọjogún oore-ọ̀fẹ́ ìyè pẹ̀lú ọkọ.
  alternative: A lè lóye ogún náà ní pàtó gẹ́gẹ́ bí ìyè ayérayé, tàbí ní fífẹ̀ sí i gẹ́gẹ́ bí ẹ̀bùn ìyè tí Ọlọ́run fi oore-ọ̀fẹ́ fúnni.
  rationale: Gíríìkì fìdí ìbájọjogún múlẹ̀, ṣùgbọ́n ‘oore-ọ̀fẹ́ ìyè’ lè ní ìtumọ̀ tó ju ọ̀kan lọ. A pa fífẹ̀ náà mọ́ láì dín in kù sí ẹ̀kọ́ kan ṣoṣo.
- issue: Agbára ὡς καὶ níwájú συγκληρονόμοις
  choice: àti gẹ́gẹ́ bí ẹni tí ó tún jẹ́ alábájọjogún
  alternative: ‘nítorí pé wọ́n tún jẹ́ alábájọjogún’
  rationale: A yàgò fún fífi ìtumọ̀ okùnfà ‘nítorí pé’ kún ọ̀rọ̀ náà, nígbà tí Gíríìkì lo ìfiwéra ὡς.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ni a lò. Ìforúkọsílẹ̀ jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà ní gbangba. A lo ‘ẹ̀yin ọkọ’ àti arọ́pò-orúkọ ọ̀pọ̀ ‘ẹ/yín’ láti pa àdírẹ́sì ọ̀pọ̀ Gíríìkì mọ́. A ṣètò gbólóhùn gígùn náà sí gbólóhùn méjì fún ìmúlò Yorùbá àdánidá láì yí ìbáṣepọ̀ àwọn èrò inú ẹsẹ̀ náà padà.
