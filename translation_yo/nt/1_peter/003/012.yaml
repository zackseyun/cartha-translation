id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: yo
  text: Nítorí ojú Olúwa ń wo àwọn olódodo, etí rẹ̀ sì ń fetí sí ẹ̀bẹ̀ wọn; ṣùgbọ́n ojú Olúwa dojú kọ àwọn tó ń ṣe ibi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó fi ìdí ọ̀rọ̀ ìṣáájú múlẹ̀ ní ọ̀nà adayébá, ó sì pa agbára ìtumọ̀ ìdí ti ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: ojú Olúwa ń wo àwọn olódodo
  rationale: Èyí pa àwòrán ojú Olúwa mọ́, nígbà tí ‘ń wo’ fi ìtọ́jú àti àkíyèsí tí ἐπί ń tọ́ka sí hàn ní Yorùbá adayébá.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: etí rẹ̀ sì ń fetí sí ẹ̀bẹ̀ wọn
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ellipsis, ní ti gidi ‘etí rẹ̀ sí ẹ̀bẹ̀ wọn.’ ‘Ń fetí sí’ mú ìtumọ̀ àkíyèsí yẹn jáde láìsọ àwòrán etí nù; ‘ẹ̀bẹ̀’ sì pa ìtumọ̀ ìrawọ́-ẹ̀bẹ̀ δέησις mọ́.
- source_word: πρόσωπον δὲ κυρίου
  choice: ṣùgbọ́n ojú Olúwa
  rationale: ‘Ojú’ jẹ́ ọ̀nà Yorùbá tó yẹ fún πρόσωπον nínú àwòrán yìí, ‘ṣùgbọ́n’ sì fi ìyàtọ̀ adversative ti δέ hàn.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: dojú kọ àwọn tó ń ṣe ibi
  rationale: ‘Dojú kọ’ jẹ́ àsọyé Yorùbá adayébá fún ìtọ́sọ́nà ojú pẹ̀lú ìtakò; ó tún pa àwòrán πρόσωπον àti agbára ọ̀rọ̀-ìṣe ‘àwọn tó ń ṣe ibi’ mọ́.
theological_decisions:
- issue: Àwòrán ara ènìyàn fún ojú àti etí Ọlọ́run
  choice: Pa àwòrán ojú àti etí mọ́ ní tààrà
  alternative: Túmọ̀ rẹ̀ ní àlàyé bí ‘Olúwa ń ṣọ́ àwọn olódodo, ó sì ń gbọ́ àdúrà wọn’
  rationale: Àwọn àwòrán wọ̀nyí jẹ́ apá pàtàkì ti àyọlò Sáàmù, wọ́n sì ń fi ojúrere, àkíyèsí, àti ìtakò Ọlọ́run hàn láìfi ẹ̀kọ́ pé Ọlọ́run ní ara ènìyàn kún ọ̀rọ̀ náà.
- issue: Bí a ṣe máa túmọ̀ δέησις
  choice: ẹ̀bẹ̀
  alternative: àdúrà
  rationale: ‘Ẹ̀bẹ̀’ mú ìtumọ̀ ìrawọ́-ẹ̀bẹ̀ tàbí ìbéèrè pàtàkì tí δέησις ní hàn, láìdín rẹ̀ kù sí ọ̀rọ̀ gbogbogbò fún àdúrà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Ìforúkọsílẹ̀ náà jẹ́ adayébá, ọlọ́lá, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Ń fetí sí’ àti ‘dojú kọ’ jẹ́ àwọn àsọyé Yorùbá tó ṣàn dáadáa, nígbà tí wọ́n pa ìfarahàn àwòrán inú orísun mọ́.
