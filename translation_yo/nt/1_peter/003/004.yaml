source:
  edition: SBLGNT
  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: yo
  text: ṣùgbọ́n kí ó jẹ́ ẹni ìkọ̀kọ̀ ti ọkàn[a], nínú ẹwà àìdíbàjẹ́[b] ti ẹ̀mí pẹ̀lẹ́ àti ìdákẹ́jẹ́[c], èyí tí ó ní iye púpọ̀ níwájú Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ènìyàn ìkọ̀kọ̀ ti ọkàn.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ènìyàn” lápapọ̀; níbí ó ń tọ́ka sí ẹni inú.
    reason: lexical_alternative
  - marker: b
    text: 'Ní tààrà: “nínú ohun àìdíbàjẹ́ ti ẹ̀mí pẹ̀lẹ́ àti ìdákẹ́jẹ́.” A fi “ẹwà” kún un nítorí ìyàtọ̀ pẹ̀lú ọ̀ṣọ́ òde nínú ẹsẹ tó ṣáájú.'
    reason: lexical_alternative
  - marker: c
    text: “Ìdákẹ́jẹ́” níbí ń tọ́ka sí ìwà ìfarabalẹ̀ àti àlàáfíà, kì í ṣe dandan sí ṣíṣàìsọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: ẹni ìkọ̀kọ̀ inú ọkàn
  rationale: Ó tọ́ka sí irú ẹni tí ènìyàn jẹ́ ní inú, kì í ṣe sí akọ ní pàtó. “Ẹni ìkọ̀kọ̀” pa ìtumọ̀ κρυπτός mọ́, “inú ọkàn” sì mú gbólóhùn náà ṣe kedere ní Yorùbá.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: pẹ̀lú ẹwà àìdíbàjẹ́
  rationale: Ọ̀rọ̀ Gíríìkì náà jẹ́ àkótán tí kò sọ orúkọ tí ajẹtífù náà ń ṣàpèjúwe. “Ẹwà” ni a fi kún un nítorí ìyàtọ̀ tí ẹsẹ tó ṣáájú ṣe láàárín ọ̀ṣọ́ òde àti ti inú; àkọsílẹ̀ ìsàlẹ̀ ṣí àkótán orísun náà payá.
- source_word: πραέως
  choice: oníwà tútù
  rationale: Ó sọ ìwà pẹ̀lẹ́ tí kò ní ìkanra tàbí ìjà; ó jẹ́ ọ̀nà àdánidá láti sọ “gentle” ní Yorùbá òde òní.
- source_word: ἡσυχίου
  choice: ìrẹ̀lẹ̀
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí ìfarabalẹ̀ àti ìwà àlàáfíà, kì í ṣe dandan pé kí ẹni má sọ̀rọ̀. “Ìrẹ̀lẹ̀” jẹ́ ọ̀nà Yorùbá tó rọrùn láti fi ìwà tí kò ru rú hàn, pẹ̀lú àlàyé nínú àkọsílẹ̀.
- source_word: πνεύματος
  choice: ẹ̀mí
  rationale: “Ẹ̀mí” pa èdè àwòrán nípa inú ènìyàn mọ́ ju kí a túmọ̀ ọ́ sí “ìwà” nìkan lọ.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: níwájú Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ tààrà tí ó sì fi hàn pé Ọlọ́run ni ó ń díwọ̀n iye rẹ̀.
- source_word: πολυτελές
  choice: ṣeyebíye púpọ̀
  rationale: Ó fi iye gíga tí ọ̀rọ̀ Gíríìkì náà ní hàn, ó sì bá ìyàtọ̀ pẹ̀lú ọ̀ṣọ́ olówó iyebíye mu.
theological_decisions:
- issue: Ọ̀rọ̀ nípa ẹni inú nínú àyíká tí a ti ń bá àwọn obìnrin sọ̀rọ̀
  choice: “ẹni ìkọ̀kọ̀ inú ọkàn”
  alternative: “ọkùnrin ìkọ̀kọ̀ inú ọkàn”
  rationale: ἄνθρωπος túmọ̀ sí ènìyàn lápapọ̀ níbí, kì í ṣe akọ. Yíyan “ẹni” kò fi ìtumọ̀ akọ tí kò sí nínú ọ̀rọ̀ orísun kún un.
- issue: Fífi orúkọ tí a kò kọ ní gbangba kún ἀφθάρτῳ
  choice: “ẹwà àìdíbàjẹ́”
  alternative: “ohun àìdíbàjẹ́” tàbí “ìwà àìdíbàjẹ́”
  rationale: Àyíká ẹsẹ 3–4 ń fi ọ̀ṣọ́ òde wé ohun tó wà ní inú. “Ẹwà” mú èrò náà ṣe kedere ní Yorùbá, ṣùgbọ́n àkọsílẹ̀ jẹ́wọ́ pé a fi ọ̀rọ̀ náà kún àkótán Gíríìkì.
- issue: Ìtumọ̀ ἡσύχιος
  choice: “ìrẹ̀lẹ̀,” pẹ̀lú àlàyé pé ó jẹ́ ìfarabalẹ̀ àti ìwà àlàáfíà
  alternative: “ìdákẹ́jẹ́,” èyí tí a lè lòye sí àìsọ̀rọ̀
  rationale: A kò fẹ́ sọ ọ̀rọ̀ náà di àṣẹ pé kí obìnrin dákẹ́ patapata. Ohun tí ọ̀rọ̀ náà ń yìn ni ìwà tí ó fara balẹ̀, tí ó ní àlàáfíà.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìwé mímọ́ tó lọ́lá ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ìsìn ẹgbẹ́ kan pàtó.
