id: 1PE.3.16
reference: 1 Peter 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: yo
  text: ṣùgbọ́n pẹ̀lú ìwà tútù àti ìbẹ̀rù[a], kí ẹ sì máa ní ẹ̀rí-ọkàn rere, kí, nínú ọ̀ràn tí wọ́n ń sọ̀rọ̀ burúkú sí yín[b], àwọn tí ń sọ̀rọ̀ ẹ̀gàn sí ìwà rere yín nínú Mèsáyà[c] lè dójú tì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “pẹ̀lú ìwà tútù àti ọ̀wọ̀ jíjinlẹ̀,” tàbí “pẹ̀lú ìwà tútù àti ìbọ̀wọ̀.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “nínú ọ̀ràn tí wọ́n ti ń sọ̀rọ̀ lòdì sí yín.”
    reason: lexical_alternative
  - marker: c
    text: Gíríìkì ní, “nínú Mèsáyà”; ní ìbílẹ̀, “nínú Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: πραΰτητος
  choice: ìwà tútù
  rationale: Ó fi ìrẹ̀lẹ̀ àti ìhùwàsí tí kò le koko hàn ní Yorùbá àdánidá.
- source_word: φόβου
  choice: ìbẹ̀rù
  rationale: A pa ọ̀rọ̀ náà mọ́ ní ìtumọ̀ gbòòrò rẹ̀, láì pinnu bóyá ìbẹ̀rù Ọlọ́run, ọ̀wọ̀ jíjinlẹ̀, tàbí ìbọ̀wọ̀ ni a ní lọ́kàn.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: kí ẹ sì máa ní ẹ̀rí-ọkàn rere
  rationale: ‘Máa ní’ fi ipò tí ó ń bá a lọ hàn, ‘ẹ̀rí-ọkàn rere’ sì jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere fún συνείδησις ἀγαθή.
- source_word: ἐν ᾧ
  choice: nípa ohun tí
  rationale: Ó pa ìtọ́kasí Gíríìkì náà mọ́ ní ṣíṣí, láì sọ ohun tí ó tọ́ka sí ní pàtó ju orísun lọ.
- source_word: καταλαλεῖσθε
  choice: wọ́n fi ń sọ̀rọ̀ burúkú sí yín
  rationale: Ó mú èrò ọ̀rọ̀ ọ̀tá tàbí ọ̀rọ̀ ìbanilórúkọjẹ́ jáde ní èdè Yorùbá tí ó rọrùn láti lóye.
- source_word: καταισχυνθῶσιν
  choice: lè dójú tì
  rationale: Ó fi àbájáde tàbí ète ἵνα pẹ̀lú ọ̀rọ̀-ìṣe abẹ́lẹ̀ hàn lọ́nà àdánidá.
- source_word: ἐπηρεάζοντες
  choice: àwọn tí ń tàbùkù sí
  rationale: ‘Tàbùkù sí’ sọ ìkójú àti ìkẹ́gàn tí ọ̀rọ̀ náà ní nínú àyíká yìí.
- source_word: ἀναστροφήν
  choice: ìwà
  rationale: Nínú àyíká ìwà rere, ‘ìwà’ jẹ́ ọ̀rọ̀ Yorùbá kúkúrú tí ó bo ìhùwàsí àti ọ̀nà ìgbésí ayé.
- source_word: ἐν Χριστῷ
  choice: nínú Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; ‘Mèsáyà’ ṣàfihàn ìtumọ̀ oyè náà dípò kí ó kàn ṣe àkọsílẹ̀ ohùn.
- source_word: ἀγαθὴν
  choice: rere
  rationale: Ó pa ìtumọ̀ ìwà rere àti àtúnlò ἀγαθός nínú ẹsẹ náà mọ́.
theological_decisions:
- issue: Ìtumọ̀ φόβου nínú ‘pẹ̀lú ìwà tútù àti ìbẹ̀rù’
  choice: ìbẹ̀rù
  alternative: ọ̀wọ̀ jíjinlẹ̀; ìbọ̀wọ̀; ìbẹ̀rù Ọlọ́run
  rationale: Orísun kò sọ ẹni tí ìbẹ̀rù náà dojú kọ ní pàtó; yíyan ọ̀rọ̀ gbòòrò pa àìdánilójú àti ẹdọfu ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
- issue: Bí a ṣe túmọ̀ Χριστῷ
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní inú gbólóhùn ἐν Χριστῷ, ìtumọ̀ oyè náà ṣì wà láàyè; a fi ọ̀nà ìbílẹ̀ ‘Kristi’ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ̀rí-ọkàn’ fún conscience, ‘ìwà tútù’ fún gentleness, àti ‘dójú tì’ fún shame. Ìṣètò gbólóhùn náà jẹ́ ti Yorùbá àdánidá, ṣùgbọ́n ó pa ìbáṣepọ̀ ète/àbájáde àti àìdánilójú ἐν ᾧ mọ́.
