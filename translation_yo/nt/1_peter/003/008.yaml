  to: Ní ìparí, kí gbogbo yín jùmọ̀ ní èrò kan náà, kí ẹ bá ara yín kẹ́dùn, kí ẹ nífẹ̀ẹ́ ara yín bí ará[a], kí ẹ jẹ́ oníyọ́nú, kí ẹ sì ní èrò ìrẹ̀lẹ̀[b].
