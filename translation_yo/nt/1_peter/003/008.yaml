id: 1PE.3.8
reference: 1 Peter 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ⸀ταπεινόφρονες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: yo
  text: Ní ìparí, kí gbogbo yín jùmọ̀ ní èrò kan náà, kí ẹ bá ara yín kẹ́dùn, kí ẹ nífẹ̀ẹ́ ara yín bí ará[a], kí ẹ jẹ́ oníyọ́nú, kí ẹ sì ní èrò ìrẹ̀lẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘kí ẹ kún fún ìfẹ́ ará.’ Ọ̀rọ̀ Gíríìkì náà lo èdè ìbátan àwọn ọmọ ìdílé, ó sì ń tọ́ka sí gbogbo àwọn onígbàgbọ́.
    reason: lexical_alternative
  - marker: b
    text: Àwọn àfọwọ́kọ kan ka ‘oníwà tútù’ tàbí ‘ọ̀rẹ́ ènìyàn’ (φιλόφρονες) dípò ‘ní èrò ìrẹ̀lẹ̀.’
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: Ní ìparí
  rationale: Ó jẹ́ àmì ọ̀rọ̀ tí ó ń mú àwọn ìṣílétí náà lọ sí àkótán; ‘Ní ìparí’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ èyí.
- source_word: πάντες
  choice: gbogbo yín
  rationale: Ó ń bá gbogbo àwọn olùgbọ́ sọ̀rọ̀ ní tààràtà, ó sì pa ìtumọ̀ àkójọpọ̀ náà mọ́.
- source_word: ὁμόφρονες
  choice: ní èrò kan náà
  rationale: Ó pa apá ọkàn tàbí èrò inú ọ̀rọ̀ Gíríìkì mọ́, nígbà tí ó tún ń fi ìṣọ̀kan hàn.
- source_word: συμπαθεῖς
  choice: máa bá ara yín kẹ́dùn
  rationale: Gbólóhùn yìí ń sọ ní Yorùbá àdánidá pé kí wọ́n máa pín nínú ìmọ̀lára àti ìrora ara wọn.
- source_word: φιλάδελφοι
  choice: nífẹ̀ẹ́ ara yín bí ará
  rationale: Ó pa àwòrán ìfẹ́ láàárín àwọn ọmọ ìdílé mọ́. Ọ̀rọ̀ ‘ará’ lè kó gbogbo àwọn onígbàgbọ́, ọkùnrin àti obìnrin, sínú ìtumọ̀ náà láìsọ àwòrán ìdílé nù.
- source_word: εὔσπλαγχνοι
  choice: oníyọ́nú
  rationale: ‘Oníyọ́nú’ ń fi àánú jíjinlẹ̀ àti ọkàn tí ó rọ̀ sí ẹlòmíràn hàn ní Yorùbá tó ṣe kedere.
- source_word: ταπεινόφρονες
  choice: ní èrò ìrẹ̀lẹ̀
  rationale: Ó pa ìtumọ̀ ìrẹ̀lẹ̀ inú tàbí ìrẹ̀lẹ̀ nínú ìrònú mọ́, dípò kí ó sọ ọ́ di ìwà òde nìkan.
theological_decisions:
- issue: Èdè ìbátan ará inú φιλάδελφοι
  choice: nífẹ̀ẹ́ ara yín bí ará
  alternative: kí ẹ kún fún ìfẹ́ ará
  rationale: Àṣàyàn náà pa àwòrán ìdílé inú Gíríìkì mọ́, ṣùgbọ́n ‘ará’ ní Yorùbá lè tọ́ka sí ọkùnrin àti obìnrin nínú àwùjọ àwọn onígbàgbọ́.
- issue: Ọ̀rọ̀ àfọwọ́kọ tó gbẹ̀yìn
  choice: ταπεινόφρονες = ní èrò ìrẹ̀lẹ̀
  alternative: φιλόφρονες = oníwà tútù tàbí ọ̀rẹ́ ènìyàn
  rationale: SBLGNT ní ταπεινόφρονες, èyí tí ó túmọ̀ sí ìrẹ̀lẹ̀ nínú èrò. Àwọn àfọwọ́kọ kan ní ọ̀rọ̀ mìíràn, nítorí náà a tọ́ka sí i ní àlàyé ìsàlẹ̀ dípò yíyí ọ̀rọ̀ àkọ́kọ́ padà.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. Àtòjọ àwọn àṣẹ náà jẹ́ ti ẹnu sọ̀rọ̀ àdánidá, pẹ̀lú àmì ohùn ní ibi tí ó yẹ. ‘Ará’ pa àwòrán ìdílé mọ́, ó sì jẹ́ ọ̀rọ̀ àkópọ̀ tí kò yọ obìnrin sílẹ̀.
