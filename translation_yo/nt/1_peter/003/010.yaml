id: 1PE.3.10
reference: 1 Peter 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: yo
  text: Nítorí ẹni tí ó fẹ́ láti ní ìfẹ́ sí ìyè, tí ó sì fẹ́ rí ọjọ́ rere, gbọ́dọ̀ dá ahọ́n rẹ̀ dúró kúrò nínú ibi, kí ó má sì ṣe sọ ẹ̀tàn nípasẹ̀ ètè rẹ̀[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àrékérekè.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ẹ̀tàn, ìwà ọ̀dàlẹ̀, tàbí àrékérekè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: ẹni tí ó fẹ́
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí ẹnikẹ́ni lápapọ̀, ṣùgbọ́n ó pa ẹyọ ọ̀rọ̀ Gíríìkì mọ́ láì fi akọ tàbí abo kún un.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó ń mú ẹ̀rí Ìwé Mímọ́ tàbí àlàyé fún ìṣírí tó ṣáájú wọlé.
- source_word: ζωὴν ἀγαπᾶν
  choice: nífẹ̀ẹ́ ìyè
  rationale: Ó tẹ̀ lé ìtumọ̀ gidi náà, láì fi ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní tí kò sí nínú Gíríìkì kún un.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: rí ọjọ́ rere
  rationale: A pa àwòrán ọ̀rọ̀-ìṣe ‘rí’ mọ́; ‘ọjọ́ rere’ gbòòrò ju ọjọ́ ọrọ̀-ajé rere lọ.
- source_word: παυσάτω
  choice: gbọ́dọ̀ pa ... mọ́ kúrò
  rationale: Ó sọ agbára àṣẹ náà jáde ní Yorùbá àdánidá, ó sì bá àwọn gbólóhùn tó tẹ̀ lé e mu.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: pa ahọ́n rẹ̀ mọ́ kúrò nínú ibi
  rationale: Ó pa àwòrán ‘ahọ́n’ àti ìtumọ̀ ibi tó gbòòrò mọ́; lílo ‘rẹ̀’ jẹ́ àdánidá fún ẹ̀yà ara ní Yorùbá.
- source_word: χείλη
  choice: ètè rẹ̀
  rationale: A pa àwòrán ètè mọ́, pẹ̀lú ọ̀rọ̀ arọ́pò-orúkọ ohun-ìní tó ṣe àdánidá ní Yorùbá.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: kúrò nínú sísọ ẹ̀tàn
  rationale: Ó fi ìdènà tàbí ìyẹra tí gbólóhùn Gíríìkì ń sọ hàn, ní èdè Yorùbá tó ṣe kedere.
theological_decisions:
- issue: Ẹyọ aṣojú gbogbo ènìyàn àti akọ tàbí abo
  choice: Lo ‘ẹni tí ó fẹ́’ àti ‘rẹ̀’ fún ẹni kan láì dá a mọ́ akọ tàbí abo.
  alternative: Lílo ọ̀rọ̀ tó tọ́ka sí ọkùnrin ní pàtó, bí ‘ọkùnrin tí ó fẹ́’.
  rationale: Gíríìkì náà jẹ́ ẹyọ aṣojú ẹnikẹ́ni; Yorùbá lè pa ẹyọ náà àti ìtumọ̀ àpapọ̀ mọ́ láì sọ akọ tàbí abo.
- issue: Ìwọ̀n ìtumọ̀ δόλος
  choice: ẹ̀tàn
  alternative: àrékérekè
  rationale: ‘Ẹ̀tàn’ ṣe kedere fún òǹkàwé òde òní, ṣùgbọ́n àlàyé ìsàlẹ̀ fi hàn pé ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ àrékérekè tàbí ìwà ọ̀dàlẹ̀ pẹ̀lú.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní àmì ohùn níbi tó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, kedere, ó sì yẹ fún kíkà Ìwé Mímọ́ ní gbangba.
