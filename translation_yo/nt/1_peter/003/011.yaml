  to: Ṣùgbọ́n kí ó yà kúrò nínú ibi, kí ó sì ṣe rere; kí ó wá àlàáfíà, kí ó sì lépa rẹ̀.
  rationale: A tún “yí padà kúrò” ṣe sí “yà kúrò” fún ìtumọ̀ tó ṣe déédéé ti yíyà/ìfàsẹ́yìn kúrò nínú ibi; a yọ “máa” kúrò kí a má bàa fi abala ìṣe tí kò hàn nínú aorist Gíríìkì kún un. A yọ àlàyé ẹsẹ̀ náà nítorí ìpè akọ ẹyọ rẹ̀ kò bá gírámà Gíríìkì mu. Àmì [a] náà ni a yọ pẹ̀lú àlàyé rẹ̀.
