source:
  edition: SBLGNT
  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: yo
  text: Ṣùgbọ́n kí ó yà kúrò nínú ibi, kí ó sì ṣe rere; kí ó wá àlàáfíà, kí ó sì lépa rẹ̀.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: kí ó yí padà kúrò
  rationale: Ọ̀rọ̀ náà jẹ́ àṣẹ ẹni kẹta ẹyọ kan, ó sì ní ìtumọ̀ yíyà kúrò ní ọ̀nà kan. ‘Yí padà kúrò’ pa agbára ìtọ́sọ́nà ọ̀rọ̀ Gíríìkì mọ́ ju ‘yẹra fún’ lọ.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ ń tẹ ọ̀rọ̀ ṣáájú lọ pẹ̀lú ìyàtọ̀ kékeré; ‘Ṣùgbọ́n’ bá ìṣàn ìkìlọ̀ náà mu.
- source_word: ἀπὸ κακοῦ
  choice: kúrò nínú ibi
  rationale: κακόν níhìn-ín tọ́ka sí ibi ní ti ìwà, ní ìtakora sí rere, kì í ṣe ìpalára tàbí àjálù.
- source_word: ποιησάτω ἀγαθόν
  choice: kí ó sì ṣe rere
  rationale: Èyí jẹ́ gbólóhùn Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ ṣíṣe ohun rere mọ́.
- source_word: ζητησάτω
  choice: kí ó wá
  rationale: ζητέω túmọ̀ sí wíwá ohun kan. Lílo ‘wá’ mú kí ìlọsíwájú láti wá àlàáfíà sí lílépa rẹ̀ dúró gedegbe.
- source_word: εἰρήνην
  choice: àlàáfíà
  rationale: ‘Àlàáfíà’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún εἰρήνη, ó sì lè gba ìtumọ̀ fífẹ̀ ti ìbágbépọ̀ láìsí ìjà.
- source_word: διωξάτω αὐτήν
  choice: kí ó sì máa lépa rẹ̀
  rationale: διώκω níhìn-ín ní agbára lílépa ohun kan gidigidi. ‘Máa lépa rẹ̀’ fi ìfaradà nínú ìwá àlàáfíà hàn, ‘rẹ̀’ sì tọ́ka padà sí àlàáfíà.
- source_word: 3rd person singular imperatives across the verse
  choice: kí ó ...
  rationale: Ìṣètò ‘kí ó’ pa àṣẹ ẹni kẹta ẹyọ kan mọ́ ní Yorùbá, bí ó tilẹ̀ jẹ́ pé ẹni náà dúró fún ẹnikẹ́ni lápapọ̀.
theological_decisions:
- issue: Agbára aṣojú ti fọ́ọ̀mù akọ ẹyọ kan nínú àṣẹ
  choice: Lo ‘kí ó’ nínú ọ̀rọ̀ pàtàkì, kí àlàyé ẹsẹ̀ sọ pé ó kan ẹnikẹ́ni lápapọ̀.
  alternative: ‘kí ènìyàn’ tàbí àṣẹ ẹni kejì
  rationale: Gíríìkì lo ẹni kẹta akọ ẹyọ kan gẹ́gẹ́ bí aṣojú. Yorùbá ‘ó’ kò fi akọ tàbí abo hàn, ó sì pa ẹyọ kan àti agbára aṣojú náà mọ́ láìfi ìtumọ̀ tuntun kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé lásán. ‘Àlàáfíà’ ni a yàn dípò gbólóhùn tó túmọ̀ sí ìlàjà nìkan, kí ìtumọ̀ fífẹ̀ εἰρήνη má bàa dín kù.
