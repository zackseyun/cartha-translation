review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà gba ìṣètò àwọn àṣẹ ẹni-kẹta ẹyọ kan àti ìtakora ibi/rere/àlàáfíà mọ́. Síbẹ̀, “máa lépa” ń fi ìṣe àṣà tàbí tí ń tẹ̀síwájú kún àṣẹ aorist διωξάτω, níbi tí “lépa” ti pé. Àlàyé ẹsẹ̀ náà sì sọ ní àṣìṣe pé fọ́ọ̀mù Gíríìkì jẹ́ akọ ẹyọ kan; àwọn àṣẹ ẹni-kẹta ẹyọ Gíríìkì nínú ẹsẹ̀ yìí kò ní ìyàtọ̀ akọ/abo nínú fọ́ọ̀mù wọn.
  naturalness: “Kí ó yà kúrò nínú ibi” jẹ́ ọ̀nà Yorùbá boṣewa, ìwàásù, àti ti ẹ̀dá láti sọ ìyapa kúrò nínú ibi. Ó dín ìtumọ̀ àfikún ‘padà’ kù, ó sì bá ìtọ́sọ́nà ἐκκλινάτω mu.
  terminology: “Ibi,” “rere,” àti “àlàáfíà” yẹ, wọ́n sì ṣètọ́jú ìtumọ̀ ìwà rere àti ìfẹ́ àlàáfíà nínú ọ̀rọ̀ Gíríìkì. A kò nílò àlàyé ẹsẹ̀ nípa akọ aṣojú, nítorí Yorùbá ‘ó’ kò ní akọ/abo, bẹ́ẹ̀ sì ni fọ́ọ̀mù Gíríìkì fúnra rẹ̀ kò fi akọ hàn.
