  text: Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ⸀ζηλωταὶ γένησθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/013.yaml
  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: yo
  text: Ta sì ni yóò ṣe yín nípalára, bí ẹ bá di onítara fún ohun rere?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí ẹ bá di ẹni tí ó ń hára gàgà fún ohun rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: sì
  rationale: Àsopọ̀ “sì” bá ìṣàn ọ̀rọ̀ tó ṣáájú mu, ó sì jẹ́ ọ̀nà àdánidá láti tẹ̀ síwájú nínú Yorùbá.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: Ta ni yóò ṣe yín ní ibi
  rationale: Ó pa ìbéèrè àsọyé àti ìtumọ̀ ọjọ́ iwájú mọ́, nígbà tí ó sì jẹ́ gbólóhùn Yorùbá tó ṣe kedere.
- source_word: ἐὰν
  choice: bí ... bá
  rationale: Ìṣètò “bí ... bá” ni ọ̀nà Yorùbá àdánidá fún gbólóhùn onípo.
- source_word: τοῦ ἀγαθοῦ
  choice: fún ohun rere
  rationale: “Ohun rere” sọ ànímọ́ àìdánimọ̀ náà di ohun tí a lè lóye ní kedere láìfi ìtumọ̀ míì kún un.
- source_word: ζηλωταὶ
  choice: ẹni tí ó ní ìtara fún
  rationale: Ìtumọ̀ yìí pa agbára ζηλωτής mọ́ gẹ́gẹ́ bí ẹni tó ní ìtara gidigidi sí ohun kan; “onítara” tún ṣeé lò, ṣùgbọ́n àpólà yìí rọrùn fún òǹkàwé gbogbo.
- source_word: γένησθε
  choice: ẹ bá di
  rationale: “Di” pa ìtumọ̀ ìbẹ̀rẹ̀ tàbí ìyípadà ipò inú γίνομαι mọ́ ju kí a túmọ̀ rẹ̀ sí “jẹ́” lásán.
theological_decisions:
- issue: Agbára ìbéèrè àsọyé náà ní ìbámu pẹ̀lú ìjìyà nítorí òdodo
  choice: A pa á mọ́ gẹ́gẹ́ bí ìbéèrè àsọyé tó ń fúnni ní ìdánilójú lápapọ̀, láìsọ ọ́ di ìlérí pé àwọn onígbàgbọ́ kò lè jìyà rárá.
  alternative: Kí a túmọ̀ ọ́ bí ìlérí pípé pé kò sí ẹni tó lè ṣe àwọn onígbàgbọ́ ní ibi ní ọ̀nà kankan.
  rationale: Àwọn ẹsẹ tó tẹ̀ lé e jẹ́wọ́ pé ó ṣeé ṣe kí ènìyàn jìyà nítorí ṣíṣe rere; nítorí náà, ìtumọ̀ náà pa ìdánilójú àti ìforígbárí inú àyíká ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá àgbàlágba tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tó bá yẹ.
