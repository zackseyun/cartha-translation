id: 1PE.3.15
reference: 1 Peter 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: yo
  text: Ṣùgbọ́n ẹ ka Mèsáyà náà sí ẹni mímọ́ gẹ́gẹ́ bí Olúwa nínú ọkàn yín,[a] kí ẹ sì máa múra tán nígbà gbogbo láti fi ìdáhùn ìgbèjà dá gbogbo ẹni tí ó bá béèrè lọ́wọ́ yín nípa ìdí fún ìrètí tí ó wà nínú yín lóhùn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ní ọ̀nà tó sún mọ́ ọ̀rọ̀ Gíríìkì, “ẹ ya Mèsáyà náà sí mímọ́ gẹ́gẹ́ bí Olúwa nínú ọkàn yín.”
    reason: lexical_alternative
  - marker: b
    text: A tún lè tú “Mèsáyà” sí “Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριον ... τὸν Χριστὸν
  choice: Mèsáyà náà ... gẹ́gẹ́ bí Olúwa
  rationale: Ó pa κύριος mọ́ gẹ́gẹ́ bí oyè “Olúwa,” ó sì tú Χριστός gẹ́gẹ́ bí oyè “Mèsáyà,” kì í ṣe bí orúkọ lasan. Ìṣètò yìí tún jẹ́ kí ìbáṣepọ̀ àwọn ọ̀rọ̀ náà hàn kedere ní Yorùbá.
- source_word: ἁγιάσατε
  choice: ẹ ya ... sí mímọ́
  rationale: Ìtumọ̀ yìí pa àṣẹ “sọ di mímọ́/yà sí mímọ́” mọ́, láìsọ pé àwọn onígbàgbọ́ ló ń mú kí Mèsáyà ṣẹ̀ṣẹ̀ di ẹni mímọ́.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: nínú ọkàn yín
  rationale: Ó pa ìtumọ̀ ibi inú àti ọkàn gẹ́gẹ́ bí inú-ẹni mọ́ ní ọ̀nà Yorùbá tó ṣe déédé.
- source_word: ἕτοιμοι ἀεὶ
  choice: kí ẹ sì máa múra tán nígbà gbogbo
  rationale: Ó fi ìmúrasílẹ̀ tí ń bá a lọ àti ἀεί, “nígbà gbogbo,” hàn ní èdè àdánidá.
- source_word: πρὸς ἀπολογίαν
  choice: láti sọ ọ̀rọ̀ ìgbèjà
  rationale: “Ọ̀rọ̀ ìgbèjà” gba ìtumọ̀ ìdáhùn, àlàyé, tàbí ìgbèjà tí ἀπολογία ní, pẹ̀lú àwọ̀ òfin rẹ̀.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς
  choice: fún gbogbo ẹni tí ó bá béèrè lọ́wọ́ yín
  rationale: Ó pa ìtumọ̀ alápín “gbogbo ẹni” àti ìṣe béèrè mọ́ ní Yorùbá tó rọrùn.
- source_word: λόγον
  choice: ìdí
  rationale: Nínú àyíká yìí λόγος túmọ̀ sí ìdí tàbí àlàyé tí a lè fi dá ẹni tó béèrè lóhùn.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: nípa ìdí fún ìrètí tí ó wà nínú yín
  rationale: Ó pa περὶ (“nípa”) àti ìrètí tí ó “wà nínú” àwọn olùgbọ́ mọ́, láìdín ìtumọ̀ rẹ̀ kù sí ìmọ̀lára nìkan.
theological_decisions:
- issue: Bí a ṣe tú Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Níhìn-ín Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, ó sì bá κύριος pàdé nínú ọ̀rọ̀ ìjẹ́wọ́; “Mèsáyà” mú oyè náà jáde kedere.
- issue: Ìtumọ̀ ἁγιάσατε nígbà tí Mèsáyà jẹ́ ohun tí ìṣe náà kàn
  choice: ẹ ya Mèsáyà náà sí mímọ́ gẹ́gẹ́ bí Olúwa
  alternative: ẹ ka Mèsáyà náà sí ẹni mímọ́, sí Olúwa
  rationale: A pa àwòrán àti agbára àṣẹ Gíríìkì mọ́, ṣùgbọ́n “gẹ́gẹ́ bí Olúwa” mú kí ó ṣe kedere pé ọ̀rọ̀ náà jẹ́ nípa jíjẹ́wọ́ àti bíbọ̀wọ̀ fún un ní ọkàn, kì í ṣe pé ènìyàn ń dá ìwà mímọ́ sílẹ̀ nínú rẹ̀.
- issue: Ìwọ̀n ìtumọ̀ ἀπολογία
  choice: ọ̀rọ̀ ìgbèjà
  alternative: ìdáhùn
  rationale: “Ọ̀rọ̀ ìgbèjà” pa agbára ìgbèjà tàbí àlàyé tí ọ̀rọ̀ Gíríìkì ní mọ́; “ìdáhùn” nìkan lè jẹ́ gbòòrò jù.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ni a lò. A lo “ẹ” fún ọ̀pọ̀ ènìyàn gẹ́gẹ́ bí ὑμῶν/ὑμᾶς, a sì fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tó yẹ.
