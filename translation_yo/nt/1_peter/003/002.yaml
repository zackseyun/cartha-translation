  text: ἐποπτεύσαντες τὴν ἐν φόβῳ ἁγνὴν ἀναστροφὴν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/002.yaml
  text: when they observe your pure conduct in fear.
translation:
  language: yo
  text: nígbà tí wọ́n bá rí ìwà mímọ́ yín nínú ìbẹ̀rù.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: nígbà tí wọ́n bá ti rí
  rationale: Aorist participle here is naturally rendered as a temporal circumstance tied to the preceding clause; “rí” conveys their direct observation.
- source_word: ἁγνὴν
  choice: mímọ́
  rationale: Expresses moral purity or chastity in natural Yoruba without narrowing the sense unnecessarily.
- source_word: ἀναστροφὴν
  choice: ìwà ... tí ẹ ń hù
  rationale: Refers to one’s manner of life or conduct, not merely isolated actions; this is idiomatic and accessible in Yoruba.
- source_word: ἐν φόβῳ
  choice: nínú ìbẹ̀rù Ọlọ́run
  rationale: The immediate Petrine context most naturally points to reverence toward God. Supplying “Ọlọ́run” makes the referent natural and prevents the Yoruba from suggesting fear of the husbands, while retaining the phrase’s reverential force.
theological_decisions:
- issue: Referent of φόβος (“fear”)
  choice: ìbẹ̀rù Ọlọ́run
  alternative: ìbẹ̀rù
  rationale: Although the Greek leaves the object unstated, 1 Peter commonly uses fear language for reverence before God (cf. 1:17; 2:17–18), and the wives’ conduct is oriented toward God rather than intimidation by husbands. The explicit referent is therefore used for clarity, while acknowledging the source’s grammatical implicitness.
translation_notes:
  register: Standard, dignified, contemporary Yorùbá with full tone marks. The wording reads as a dependent temporal clause because the Greek verse continues the syntax of 3:1.
source_grounding:
  english_pob_role: consult_only
