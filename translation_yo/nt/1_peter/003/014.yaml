id: 1PE.3.14
reference: 1 Peter 3:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: yo
  text: Ṣùgbọ́n bí ẹ̀yin tilẹ̀ bá jìyà nítorí òdodo, alábùkún ni ẹ̀yin. Ẹ má bẹ̀rù ìbẹ̀rù wọn[a], ẹ má sì dààmú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ẹ má bẹ̀rù wọn,” tàbí, “Ẹ má bẹ̀rù ohun tí wọ́n bẹ̀rù.” Gbólóhùn Gíríìkì náà tẹ̀ lé ọ̀rọ̀ Aísáyà 8:12 pẹ́kípẹ́kí, ó sì lè ní èyíkéyìí nínú àwọn ìtumọ̀ wọ̀nyí.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ
  choice: Ṣùgbọ́n bí ẹ̀yin tilẹ̀ bá
  rationale: Ó fi ìyàtọ̀ sí ọ̀rọ̀ tó ṣáájú hàn, ó sì pa agbára ọ̀rọ̀ àdéhùn tí ó jẹ́ ohun tó lè ṣẹlẹ̀ mọ́.
- source_word: πάσχοιτε
  choice: bá jìyà
  rationale: Àkópọ̀ ‘bí ... bá’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ohun tí ó lè ṣẹlẹ̀ láì sọ ọ́ di ohun tí ó dájú.
- source_word: διὰ δικαιοσύνην
  choice: nítorí òdodo
  rationale: ‘Nítorí’ fi ìdí tàbí okùnfà hàn; ‘òdodo’ sì pa ìtumọ̀ ìwà títọ́ níwájú Ọlọ́run àti ènìyàn mọ́ láì dín un kù sí ìdájọ́ òdodo láwùjọ nìkan.
- source_word: μακάριοι
  choice: alábùkún-fún ni yín
  rationale: Ó pa ìró èdè Ìwé Mímọ́ àti èrò ojúrere Ọlọ́run mọ́, dípò kí ó túmọ̀ sí ayọ̀ inú tàbí oríire lásán.
- source_word: τὸν ... φόβον αὐτῶν
  choice: ìbẹ̀rù wọn
  rationale: 'Ó tẹ̀ lé àṣàyàn ọ̀rọ̀ Aísáyà 8:12 LXX, ó sì mọ̀ọ́mọ̀ pa àìdánilójú mọ́: ó lè tọ́ka sí ìbẹ̀rù tí wọ́n ń mú báni, tàbí ohun tí àwọn fúnra wọn ń bẹ̀rù.'
- source_word: μὴ φοβηθῆτε
  choice: Ẹ má ... bẹ̀rù
  rationale: Ó jẹ́ ìfòfin sí ìbẹ̀rù, ó sì pa ìtúnṣe ọ̀rọ̀ φόβος/φοβέομαι mọ́ nínú ‘bẹ̀rù ìbẹ̀rù.’
- source_word: μηδὲ ταραχθῆτε
  choice: kí ẹ má sì dààmú
  rationale: Ó sọ ìdàrúdàpọ̀ tàbí ìdààmú inú tí ταράσσω ń tọ́ka sí ní Yorùbá òde òní tó ṣe kedere.
theological_decisions:
- issue: Ìtumọ̀ δικαιοσύνη
  choice: òdodo
  alternative: ìdájọ́ òdodo; ṣíṣe ohun tí ó tọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ‘òdodo’ gba ìwà títọ́ àti ìbáṣepọ̀ tó tọ́ níwájú Ọlọ́run wọlé, láì fi ìtumọ̀ ọ̀rọ̀ náà mọ́ ìdájọ́ láwùjọ nìkan.
- issue: Àìdánilójú inú τὸν φόβον αὐτῶν
  choice: ìbẹ̀rù wọn
  alternative: ẹ má bẹ̀rù wọn; ohun tí wọ́n bẹ̀rù
  rationale: Ọ̀rọ̀ Gíríìkì àti ìtọ́kasí sí Aísáyà 8:12 lè gba àwọn ìtumọ̀ wọ̀nyí. A kò yan ọ̀kan lára wọn gẹ́gẹ́ bí ìtumọ̀ kan ṣoṣo nínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ẹ̀yin’ lẹ́ẹ̀kan láti mú àkọlé ọ̀pọ̀ ènìyàn hàn, a sì lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá.
