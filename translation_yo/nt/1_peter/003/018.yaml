id: 1PE.3.18
reference: 1 Peter 3:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: yo
  text: Nítorí Messíà pẹ̀lú jìyà lẹ́ẹ̀kan nítorí àwọn ẹ̀ṣẹ̀[a], olódodo fún àwọn aláìṣòdodo, kí ó lè mú yín wá sọ́dọ̀ Ọlọ́run; a pa á nípa ti ara, ṣùgbọ́n a sọ ọ́ di alààyè nípa ti ẹ̀mí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn ìwé àfọwọ́kọ kan ní ‘kú’ dípò ‘jìyà.’
    reason: textual_variant
  - marker: b
    text: Ó tún lè jẹ́, ‘a sọ ọ́ di alààyè nípasẹ̀ Ẹ̀mí.’ Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ipò tàbí apá ẹ̀mí, tàbí sí Ẹ̀mí Mímọ́ gẹ́gẹ́ bí olùṣe.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Messíà
  rationale: A túmọ̀ ọ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn, kì í ṣe bí orúkọ lásán, kí ìtumọ̀ mèsáyà rẹ̀ lè hàn.
- source_word: ἅπαξ
  choice: lẹ́ẹ̀kan ṣoṣo
  rationale: Èyí sọ pé ó ṣẹlẹ̀ lẹ́ẹ̀kan; a kò fi ọ̀rọ̀ míì kún un láti túmọ̀ rẹ̀ sí ‘lẹ́ẹ̀kan títí láé.’
- source_word: περὶ ἁμαρτιῶν
  choice: nítorí àwọn ẹ̀ṣẹ̀
  rationale: Nínú ọ̀rọ̀ ẹbọ àti ìràpadà, gbólóhùn náà túmọ̀ sí pé ìjìyà rẹ̀ ní í ṣe pẹ̀lú àwọn ẹ̀ṣẹ̀, èyí tí ‘nítorí’ sọ ní Yorùbá àdánidá.
- source_word: ἔπαθεν
  choice: jìyà
  rationale: Èyí tẹ̀ lé kíkà SBLGNT ‘ó jìyà’; kíkà ‘ó kú’ wà nínú àlàyé ìsàlẹ̀.
- source_word: δίκαιος
  choice: olódodo
  rationale: Ọ̀rọ̀ náà dúró gẹ́gẹ́ bí orúkọ fún ẹni olódodo, ó sì tako ‘àwọn aláìṣòdodo.’
- source_word: ὑπὲρ ἀδίκων
  choice: nítorí àwọn aláìṣòdodo
  rationale: ‘Nítorí’ fi hàn pé ó jìyà fún àǹfààní wọn láìfi èrò ẹ̀kọ́ ìràpadà kan pàtó kún ọ̀rọ̀ náà.
- source_word: προσαγάγῃ
  choice: mú yín tọ Ọlọ́run wá
  rationale: Èyí mú èrò mímú ènìyàn wọ iwájú Ọlọ́run tàbí fífún un ní àǹfààní láti sún mọ́ Ọlọ́run jáde ní Yorùbá tí ó ṣeé lóye.
- source_word: θανατωθεὶς
  choice: a pa á
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe-mọ́-olùṣe ti Gíríìkì mọ́, ó sì jẹ́ ti Yorùbá àdánidá.
- source_word: σαρκὶ
  choice: nípa ti ara
  rationale: Nínú ìtakora pẹ̀lú πνεύματι, èyí tọ́ka sí apá tàbí ipò ìwàláàyè ara tí ó lè kú; a kò túmọ̀ rẹ̀ sí ‘ìwà ẹlẹ́ṣẹ̀.’
- source_word: ζῳοποιηθεὶς
  choice: a sọ ọ́ di alààyè
  rationale: Èyí sọ ìṣe àìṣe-mọ́-olùṣe náà ní kedere, láìlo ọ̀rọ̀ ìmọ̀-ẹ̀kọ́ tí ó le.
- source_word: πνεύματι
  choice: nípa ti ẹ̀mí
  rationale: Ọ̀rọ̀ Yorùbá yìí lè tọ́ka sí apá/ipò ẹ̀mí, nígbà tí àlàyé ìsàlẹ̀ pa àǹfààní pé Ẹ̀mí Mímọ́ ni olùṣe mọ́.
theological_decisions:
- issue: Ìtumọ̀ ìtakora σαρκὶ ... πνεύματι
  choice: ‘nípa ti ara ... nípa ti ẹ̀mí’ ni a lò nínú ọ̀rọ̀ pàtàkì, láti pa ìfarajọ àwọn dative méjèèjì àti àìdánilójú ọ̀rọ̀ náà mọ́.
  alternative: ‘nípa Ẹ̀mí’ tàbí ‘nípasẹ̀ Ẹ̀mí Mímọ́,’ èyí tí yóò sọ Ẹ̀mí Mímọ́ di olùṣe ní tààrà.
  rationale: Gíríìkì lè tọ́ka sí ipò tàbí apá ẹ̀mí, tàbí sí iṣẹ́ Ẹ̀mí Mímọ́. A kò yanju àríyànjiyàn náà nínú ọ̀rọ̀ pàtàkì; a fi ọ̀nà kejì sínú àlàyé.
- issue: Agbára ìṣojú tàbí ìrọ́pò nínú δίκαιος ὑπὲρ ἀδίκων
  choice: ‘olódodo nítorí àwọn aláìṣòdodo’ ni a pa mọ́ láìṣàlàyé rẹ̀ sí ẹ̀kọ́ ìràpadà kan ní kíkún.
  alternative: ‘ẹni aláìlẹ́bi dípò àwọn ẹlẹ́bi.’
  rationale: Ẹsẹ náà fi hàn pé Messíà jìyà fún àǹfààní àwọn aláìṣòdodo, ṣùgbọ́n ìtumọ̀ kò gbọ́dọ̀ fi ètò ẹ̀kọ́ kan tí ó ju ọ̀rọ̀ Gíríìkì lọ kún un.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti èyí tí ó ṣeé lóye fún òǹkàwé òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà pa ìwọ̀ntúnwọ̀nsì àti ìtakora inú Gíríìkì mọ́, láìfi èdè ẹ̀ya ìjọ kan kún un.
