revisions:
- from: Nítorí Messíà pẹ̀lú jìyà lẹ́ẹ̀kan ṣoṣo nítorí àwọn ẹ̀ṣẹ̀[a], olódodo nítorí àwọn aláìṣòdodo, kí ó lè mú yín tọ Ọlọ́run wá; a pa á nípa ti ara, ṣùgbọ́n a sọ ọ́ di alààyè nípa ti ẹ̀mí.[b]
  to: Nítorí Messíà pẹ̀lú jìyà lẹ́ẹ̀kan nítorí àwọn ẹ̀ṣẹ̀[a], olódodo fún àwọn aláìṣòdodo, kí ó lè mú yín wá sọ́dọ̀ Ọlọ́run; a pa á nípa ti ara, ṣùgbọ́n a sọ ọ́ di alààyè nípa ti ẹ̀mí.[b]
  rationale: 'Àtúnṣe mẹ́ta náà mú ìtumọ̀ Yorùbá rọrùn àti péye síi: a yọ ìtẹnumọ́ tí kò ṣe pàtàkì kúrò nínú ἅπαξ, a ṣàtúnṣe ὑπέρ kí ìtumọ̀ ‘fún/ní àǹfààní’ rẹ̀ má bàa dà bí ìdí lasán, a sì tún προσαγάγῃ ṣe sí ọ̀nà Yorùbá tí ó tọ́. A kò yí ìtumọ̀ ẹsẹ̀ padà, a sì pa àìdánilójú σαρκὶ ... πνεύματι mọ́ pẹ̀lú àlàyé ìsàlẹ̀ rẹ̀.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:24:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀ lé SBLGNT dáadáa: ‘jìyà’ ń ṣojú ἔπαθεν, a sì pa àkàwé ìfarajọ ‘a pa á ... a sọ ọ́ di alààyè’ mọ́. Síbẹ̀, ‘lẹ́ẹ̀kan ṣoṣo’ lè fi ìdánilójú àfikún kún ἅπαξ, ‘nítorí àwọn aláìṣòdodo’ lè dà bí ìdí tí ó fa ìjìyà dípò ìtumọ̀ ὑπέρ, àti ‘mú yín tọ Ọlọ́run wá’ kì í ṣe ọ̀nà Yorùbá tó pé fún προσαγάγῃ.'
  naturalness: Àtúnṣe náà lo ‘mú yín wá sọ́dọ̀ Ọlọ́run,’ èyí tó jẹ́ Yorùbá òde òní tí ó ṣe kedere, ó sì fi èrò mímú ènìyàn wá sínú ìwájú Ọlọ́run hàn. ‘Nípa ti ara ... nípa ti ẹ̀mí’ ń ṣiṣẹ́ gẹ́gẹ́ bí ìtọ́kasí sí apá tàbí ipò méjèèjì, láìpa àìdánilójú dative Gíríìkì rẹ́.
  terminology: A pa ‘Messíà,’ ‘ẹ̀ṣẹ̀,’ ‘olódodo,’ ‘aláìṣòdodo,’ ‘ara,’ àti ‘ẹ̀mí’ mọ́. ‘Fún àwọn aláìṣòdodo’ dara ju ‘nítorí àwọn aláìṣòdodo’ lọ fún ὑπέρ nínú àyíká yìí, láìtúmọ̀ rẹ̀ sí ètò ẹ̀kọ́ kan pàtó. Àlàyé a dáàbò bo ẹ̀rí ọwọ́ ìwé ‘kú’; àlàyé b dáàbò bo ìṣèṣe ‘nípasẹ̀ Ẹ̀mí’ gẹ́gẹ́ bí ìtumọ̀ mìíràn.
  issues:
  - severity: medium
    issue: ‘mú yín tọ Ọlọ́run wá’
    rationale: Àpẹẹrẹ ọ̀rọ̀ náà kò dáa ní Yorùbá boṣewa. ‘Mú yín wá sọ́dọ̀ Ọlọ́run’ jẹ́ ìlò àdánidá tí ó fi προσαγάγῃ hàn pẹ̀lú ìtumọ̀ ‘mú wá sínú ìwájú ẹni kan.’
  - severity: low
    issue: ‘lẹ́ẹ̀kan ṣoṣo’ fún ἅπαξ
    rationale: ‘Ṣoṣo’ lè mú ìtẹnumọ́ ‘kan ṣoṣo’ tí ó lágbára ju adverb ἅπαξ lọ. ‘Lẹ́ẹ̀kan’ ń pa ìtumọ̀ ọ̀rọ̀ orísun mọ́ pẹkipẹki.
  - severity: medium
    issue: ‘nítorí àwọn aláìṣòdodo’ fún ὑπὲρ ἀδίκων
    rationale: ‘Nítorí’ lè ka sí ‘because of’ ní Yorùbá. ‘Fún àwọn aláìṣòdodo’ fi ìtumọ̀ ìrànlọ́wọ́/ìṣojú ti ὑπέρ hàn dáadáa láìsọ àpẹẹrẹ ẹ̀kọ́ ìràpadà kan di dandan.
