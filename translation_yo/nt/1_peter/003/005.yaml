id: 1PE.3.5
reference: 1 Peter 3:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: yo
  text: Nítorí pé ní ìgbà àtijọ́, àwọn obìnrin mímọ́ tí wọ́n ní ìrètí nínú Ọlọ́run[a] náà máa ń ṣe ara wọn lọ́ṣọ̀ọ́ báyìí, ní fífi ara wọn sábẹ́ àwọn ọkọ tiwọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí wọ́n gbé ìrètí wọn lé Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: báyìí ni ... ṣe
  rationale: Ó tọ́ka sí ọ̀nà tí a ṣàlàyé ṣáájú; ìṣètò yìí jẹ́ èdè Yorùbá àdánidá, ó sì pa agbára ọ̀rọ̀ atọ́ka náà mọ́.
- source_word: γάρ
  choice: Nítorí
  rationale: Ó fi hàn pé ẹsẹ yìí ń fún ọ̀rọ̀ ìṣílétí tó ṣáájú ní ìdí tàbí àlàyé.
- source_word: ποτε
  choice: ìgbà àtijọ́
  rationale: Ó tọ́ka sí àwọn obìnrin ti ìran àtijọ́ tí a gbé kalẹ̀ gẹ́gẹ́ bí àpẹẹrẹ.
- source_word: ἅγιαι γυναῖκες
  choice: àwọn obìnrin mímọ́
  rationale: Ó pa àpèjúwe ‘mímọ́’ mọ́ láì sọ ọ́ di ‘olóòótọ́’ tàbí ọ̀rọ̀ mìíràn tó lè dín ìtumọ̀ rẹ̀ kù.
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: tí wọ́n ní ìrètí nínú Ọlọ́run
  rationale: Ó ṣàpèjúwe àwọn obìnrin náà gẹ́gẹ́ bí ẹni tí ìrètí wọn wà nínú Ọlọ́run, láì sọ ìrètí di ìgbẹ́kẹ̀lé nìkan.
- source_word: ἐκόσμουν ἑαυτάς
  choice: ṣe máa ń ṣe ara wọn lọ́ṣọ̀ọ́
  rationale: Ó pa ìsopọ̀ mọ́ ọ̀rọ̀ ẹwà àti ọ̀ṣọ́ inú àyíká ẹsẹ náà, ó sì fi ìṣe tí wọ́n ń ṣe tẹ̀síwájú ní ìgbà àtijọ́ hàn.
- source_word: ὑποτασσόμεναι
  choice: nípa fífi ara wọn sábẹ́
  rationale: Ó pa ìbáṣepọ̀ participle mọ́, ní fífi hàn pé èyí ni ọ̀nà tí wọ́n fi ṣe ara wọn lọ́ṣọ̀ọ́.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: ọkọ ara wọn
  rationale: Nínú àyíká ìgbéyàwó, ἀνήρ túmọ̀ sí ‘ọkọ’; ‘ara wọn’ sì pa ìdíwọ̀n ọ̀rọ̀ Gíríìkì mọ́ pé ọkọ tirẹ̀ ni, kì í ṣe gbogbo ọkùnrin.
theological_decisions:
- issue: Ìtúmọ̀ fífi ara ẹni sábẹ́ nínú ìgbéyàwó
  choice: nípa fífi ara wọn sábẹ́ ọkọ ara wọn
  alternative: nípa jíjẹ́ onígbọràn sí ọkọ wọn
  rationale: Àṣàyàn náà pa àwòrán àti ìtumọ̀ ὑποτάσσω mọ́, ó sì fi ọ̀rọ̀ náà mọ́ ààlà ìbáṣepọ̀ obìnrin kọ̀ọ̀kan pẹ̀lú ọkọ tirẹ̀. A kò gbòòrò rẹ̀ sí àṣẹ gbogbo ọkùnrin lórí gbogbo obìnrin, bẹ́ẹ̀ ni a kò fi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀ àti àdánidá ni a lò. ‘Ṣe máa ń’ mú ìṣe àtúnṣe ní ìgbà àtijọ́ jáde, ‘ọkọ ara wọn’ sì jẹ́ kó ṣe kedere pé ọ̀rọ̀ náà ní í ṣe pẹ̀lú ìgbéyàwó wọn.
