review_pass:
  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì Gíríìkì náà mọ́: ìtọ́kasí sí ọ̀nà tí a ṣàlàyé ṣáájú, àwọn obìnrin mímọ́ ìgbàanì tí ìrètí wọn wà nínú Ọlọ́run, ìṣọ̀ọ́ra-ẹni, àti fífi ara wọn sábẹ́ ọkọ tiwọn. Síbẹ̀, ìṣètò ‘Nítorí báyìí ni ... ìgbà àtijọ́’ kò rọrùn, ó sì lè ṣókùnfà ìdààmú nípa ibi tí ποτε (‘ní ìgbà àtijọ́’) wà. Àtúnṣe náà fi ‘ní ìgbà àtijọ́’ sí ipò tó hàn gbangba, ó sì pa ‘καὶ’ (‘náà’) mọ́.'
  naturalness: ‘Nítorí pé ní ìgbà àtijọ́ ... náà máa ń ... báyìí’ jẹ́ Yorùbá boṣewa tó dára ju ìṣètò cleft ‘Nítorí báyìí ni ... ṣe máa ń ...’ lọ ní àyíká yìí. ‘Àwọn ọkọ tiwọn’ jẹ́ ọ̀nà àdánidá láti fi hàn ‘àwọn ọkọ ara wọn/tiwọn,’ ní mímú iye púpọ̀ ti Gíríìkì náà mọ́.
  terminology: ‘Àwọn obìnrin mímọ́,’ ‘ìrètí nínú Ọlọ́run,’ ‘ṣe ara wọn lọ́ṣọ̀ọ́,’ àti ‘fífi ara wọn sábẹ́’ jẹ́ àwọn ọ̀rọ̀ tó yẹ fún ìforúkọsílẹ̀ yìí. ‘Fífi ara wọn sábẹ́’ kò gbòòrò ọ̀rọ̀ ìbáṣepọ̀ ìgbéyàwó náà ju ohun tí τοῖς ἰδίοις ἀνδράσιν sọ lọ.
  issues:
  - severity: medium
    issue: Ìṣètò ọ̀rọ̀ àkókò àti ọ̀rọ̀ atọ́ka kò rọrùn.
    rationale: Nínú ‘Nítorí báyìí ni àwọn obìnrin mímọ́ ìgbà àtijọ́ ... ṣe máa ń ...,’ ‘ní ìgbà àtijọ́’ wà nínú ẹgbẹ́ orúkọ ní ọ̀nà tó lè dà bí pé ó ń ṣàpèjúwe ‘obìnrin’ nìkan, nígbà tí ποτε ń tọ́ka sí ìṣe náà gẹ́gẹ́ bí ohun tó ṣẹlẹ̀ nígbà àtijọ́. Fífi í sí ‘ní ìgbà àtijọ́’ ní ìbẹ̀rẹ̀ gbolohun mú un hàn gedegbe.
  - severity: low
    issue: καὶ kò hàn ní kedere.
    rationale: ‘Náà’ ń fi ‘also’ hàn láì fi ìtumọ̀ tuntun kún un.
  - severity: low
    issue: ‘ọkọ ara wọn’ kò fi iye púpọ̀ Gíríìkì náà hàn kedere.
    rationale: Bí ó tilẹ̀ jẹ́ pé ó lè jẹ́ pípa-ẹni-kọ̀ọ̀kan ní Yorùbá, ‘àwọn ọkọ tiwọn’ ń fara mọ́ τοῖς ... ἀνδράσιν dáadáa, ó sì pa ‘ìsọ̀tọ̀ ọkọ tirẹ̀’ mọ́.
