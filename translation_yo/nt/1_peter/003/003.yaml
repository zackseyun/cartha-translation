id: 1PE.3.3
reference: 1 Peter 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: yo
  text: Kí ohun ọ̀ṣọ́ yín má ṣe jẹ́ ọ̀ṣọ́ ti òde—ìhun irun[a], fífi ohun ọ̀ṣọ́ wúrà sí ara, tàbí wíwọ aṣọ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí, “Kí ọ̀ṣọ́ yín má ṣe jẹ́ ti òde nìkan: irun tí a hun, ohun ọ̀ṣọ́ wúrà, tàbí aṣọ.” Ohun tí Pétérù ń tẹnumọ́ nínú ẹsẹ tó tẹ̀lé ni iye ẹni ìkọ̀kọ̀ inú ọkàn ju ìṣehàn òde lọ; kì í ṣe dandan ìfòfindè pátápátá lórí ṣíṣe irun, wíwọ aṣọ, tàbí ohun ọ̀ṣọ́.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὧν
  choice: yín
  rationale: Ọ̀rọ̀ arọ́pò orúkọ oníjẹ́ńítífù yìí ń tọ́ka sí àwọn obìnrin/aya tí ẹsẹ tó ṣáájú ń bá sọ̀rọ̀; “yín” mú ìtumọ̀ ohun-ìní náà jáde lọ́nà Yorùbá àdánidá.
- source_word: ἔστω οὐχ
  choice: Ẹ má ṣe jẹ́ kí ... jẹ́
  rationale: Èyí pa agbára àṣẹ ẹni-kẹta mọ́ ní ọ̀nà tí ó ṣe kedere, tí ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: ohun ọ̀ṣọ́ ... ti òde
  rationale: κόσμος túmọ̀ sí ọ̀ṣọ́ tàbí ìṣètò níbí, kì í ṣe “ayé”; ἔξωθεν sì fi hàn pé ọ̀ṣọ́ ti ara òde ni.
- source_word: ἐμπλοκῆς τριχῶν
  choice: ìhun irun
  rationale: Ó ń sọ̀rọ̀ nípa ṣíṣe irun nípa hihun rẹ̀; ọ̀rọ̀ yìí pa ìṣe inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: περιθέσεως χρυσίων
  choice: wíwọ ohun ọ̀ṣọ́ wúrà
  rationale: περίθεσις jẹ́ fífi nǹkan sí ara tàbí yí ara ká, χρυσίων sì tọ́ka sí àwọn ohun wúrà tí a fi ń ṣe ọ̀ṣọ́.
- source_word: ἢ
  choice: tàbí
  rationale: Ó jẹ́ àsopọ̀ àṣàyàn tó ń tẹ̀ síwájú nínú àkójọ náà.
- source_word: ἐνδύσεως ἱματίων
  choice: wíwọ aṣọ
  rationale: Ìtumọ̀ àdánidá yìí ṣètìlẹ́yìn fún àfiwé àwọn ọ̀nà ọ̀ṣọ́ òde mẹ́tẹ̀ẹ̀ta.
theological_decisions:
- issue: Bóyá Pétérù fi òfin de gbogbo ṣíṣe irun, lílo ohun ọ̀ṣọ́, àti wíwọ aṣọ, tàbí ó ń fi ìwà inú sí ipò àkọ́kọ́ ju ìṣehàn òde lọ
  choice: A lo “ti òde nìkan” láti fi hàn pé ọ̀ṣọ́ òde kò gbọ́dọ̀ jẹ́ ohun pàtàkì tàbí gbogbo ọ̀ṣọ́ wọn.
  alternative: Kí a ka ọ̀rọ̀ náà sí ìfòfindè pátápátá lórí hihun irun, ohun ọ̀ṣọ́ wúrà, àti wíwọ aṣọ.
  rationale: Ẹsẹ 4 fi ọ̀ṣọ́ òde wé “ẹni ìkọ̀kọ̀ inú ọkàn.” Pẹ̀lú rẹ̀, dídè wíwọ aṣọ pátápátá kò lè jẹ́ ète àkójọ náà. Síbẹ̀, àkọ́lé àṣẹ tí a sẹ́ ní Gíríìkì ṣì wà nínú ìtumọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì yẹ fún kíkà ní gbangba. “Ohun ọ̀ṣọ́” jẹ́ kedere ju lílo “ọ̀ṣọ́” nìkan lọ, “ìhun irun” sì jẹ́ kúkúrú àti àdánidá.
