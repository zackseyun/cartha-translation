id: 1PE.3.9
reference: 1 Peter 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: yo
  text: Ẹ má ṣe fi ibi san ibi, tàbí fi ẹ̀gàn san ẹ̀gàn[a]; ṣùgbọ́n ní òdìkejì[b], ẹ máa súre fún wọn, nítorí pé fún èyí ni a pè yín[c], kí ẹ lè jogún ìbùkún.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “fi ìṣàbùkù san ìṣàbùkù.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ọ̀rọ̀ líle tí a fi ń gàn tàbí ṣàbùkù sí ẹnì kan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ṣùgbọ́n kàkà bẹ́ẹ̀.” Gbólóhùn Gíríìkì náà ń fi ìyípadà tó lágbára sí ìhùwàsí òdìkejì hàn.
    reason: lexical_alternative
  - marker: c
    text: Ìyẹn ni pé, a pè yín láti fi ìbùkún dáhùn sí ìwà búburú dípò kí ẹ gbẹ̀san. Ó tún ṣeé ṣe kí “èyí” gba gbogbo ìgbésí ayé ìfaradà àti àìgbẹ̀san inú àyíká ọ̀rọ̀ náà.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: fi … san
  rationale: Ọ̀rọ̀ yìí ń tọ́ka sí fífi ohun tí ẹnì kan ṣe síni padà fún un. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì pa èrò ìgbẹ̀san mọ́.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: fi ibi san ibi
  rationale: “Ibi” pa ìwọ̀n ìwà búburú inú κακόν mọ́, “fi … san …” sì fi ìṣe ìgbẹ̀san hàn kedere.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: fi ẹ̀gàn san ẹ̀gàn
  rationale: “Ẹ̀gàn” jẹ́ ọ̀rọ̀ Yorùbá òde òní fún ọ̀rọ̀ ìbánijẹ́ tàbí ìkẹ́gàn, ó sì bá ìṣọ̀kan gbolohun tó ṣáájú mu.
- source_word: τοὐναντίον δὲ
  choice: ṣùgbọ́n ní òdìkejì
  rationale: Ó pa ìyípadà tó lágbára sí ìhùwàsí òdìkejì mọ́, bí ọ̀rọ̀ Gíríìkì ṣe ń tẹnumọ́.
- source_word: εὐλογοῦντες
  choice: ẹ máa súre fún wọn
  rationale: “Súre fún” lè túmọ̀ sí sísọ rere àti bíbéèrè ojúrere Ọlọ́run fún ẹlòmíràn. A fi “fún wọn” kún un fún Yorùbá tó mọ́gbọ́n dání; àwọn tó ń ṣe ibi tàbí ń gàn ni àyíká ọ̀rọ̀ ń tọ́ka sí.
- source_word: ὅτι
  choice: nítorí pé
  rationale: Ó fi ìdí tàbí ìpìlẹ̀ ìṣírí náà hàn ní Yorùbá òde òní tó ṣe kedere.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: fún èyí ni a pè yín
  rationale: Ó pa ìtọ́kasí “èyí” mọ́ láì fi pàṣẹ dá ohun tí ó tọ́ka sí sí ohun kan ṣoṣo. Ìṣe àìsọ ẹni tó ṣe é ní Gíríìkì tún wà nínú “a pè yín.”
- source_word: ἵνα
  choice: kí ẹ lè
  rationale: Ó sọ ète tàbí àbájáde tí a fẹ́ hàn lọ́nà Yorùbá àdánidá.
- source_word: εὐλογίαν
  choice: ìbùkún
  rationale: “Ìbùkún” gba ìtumọ̀ ojúrere tí a rí gbà, ó sì tún ṣe àfihàn ìbáṣepọ̀ rẹ̀ pẹ̀lú “súre” nínú gbolohun náà.
- source_word: κληρονομήσητε
  choice: jogún
  rationale: “Jogún” pa àwòrán gbígba ohun gẹ́gẹ́ bí ajogún mọ́, dípò kí a sọ ọ́ di “gbà” lásán.
theological_decisions:
- issue: Ohun tí “fún èyí ni a pè yín” ń tọ́ka sí
  choice: A fi “èyí” sílẹ̀ kí ó lè tọ́ka ní pàtàkì sí sísúre dípò ìgbẹ̀san, nígbà tó tún lè gba gbogbo ìlànà ìfaradà àti àìgbẹ̀san inú àyíká ọ̀rọ̀ náà.
  alternative: Kí a sọ ní pàtó pé Ọlọ́run pè àwọn onígbàgbọ́ láti súre fún àwọn tó ń ṣe wọ́n ní ibi.
  rationale: Àyíká tó sún mọ́ ọn jù ń so ìpè náà mọ́ sísúre dípò fífi ibi tàbí ẹ̀gàn san padà; síbẹ̀, ọ̀rọ̀ Gíríìkì kò fi ìtọ́kasí náà mọ́ ohun kan ṣoṣo, nítorí náà a kò yanju àìdánilójú náà ní ìkọ̀kọ̀.
- issue: Ẹni tó pè wọ́n nínú ἐκλήθητε
  choice: A lo “a pè yín,” tí kò sọ ẹni tó pè wọ́n ní pàtó nínú àyọkà.
  alternative: “Ọlọ́run pè yín.”
  rationale: Nínú ẹ̀kọ́ ìgbàgbọ́ àti àyíká lẹ́tà náà, Ọlọ́run ni ẹni tí a lóye pé ó pè wọ́n; ṣùgbọ́n Gíríìkì lo ọ̀rọ̀ ìṣe aláìsọ olùṣe, nítorí náà àyọkà pàtàkì kò fi orúkọ Ọlọ́run kún un.
translation_notes:
  register: A lo Yorùbá tí ó lọ́lá, tó ṣe kedere, tí ó sì bá ìlò òde òní mu. Àwọn àmì ohùn wà ní ibi tí ó yẹ. “Ẹ má ṣe …; ṣùgbọ́n … ẹ máa …” mú ìlànà ìkìlọ̀ àti àṣẹ rere inú Gíríìkì jáde lọ́nà tí akẹ́kọ̀ọ́ Yorùbá lè lóye ní rọrùn.
