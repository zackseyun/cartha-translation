  terminology: “Ibi,” “ẹ̀gàn,” “súre,” “ìpè,” “ìbùkún,” àti “jogún” jẹ́ àwọn ọ̀rọ̀ tó yẹ, tó sì pa ìtumọ̀ pàtàkì Gíríìkì mọ́. Ṣùgbọ́n àṣàyàn nínú àlàyé a kò gbọ́dọ̀ sọ “ọ̀rọ̀ èébú,” nítorí èyí lè túmọ̀ sí ọ̀rọ̀ ìfibú, kì í ṣe ìsọ̀rọ̀ ìkẹ́gàn ní pàtó.
