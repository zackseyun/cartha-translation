id: 1PE.3.22
reference: 1 Peter 3:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: yo
  text: ẹni tí ó wà ní ọwọ́ ọ̀tún Ọlọ́run, tí ó ti lọ sí ọ̀run[a], tí a sì ti fi àwọn áńgẹ́lì àti àwọn aláṣẹ àti àwọn agbára sábẹ́ rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọ inú ọ̀run.” Ọ̀rọ̀ Gíríìkì náà sọ ní kedere pé ó lọ wọ inú ọ̀run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς
  choice: ẹni tí
  rationale: Ọ̀rọ̀ arọ́pò orúkọ ìbátan yìí ń tọ́ka sí Jesu Kristi nínú ẹsẹ tó ṣáájú; “ẹni tí” so gbólóhùn náà mọ́ ọ́n láìfi ìtẹnumọ́ kún un.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: ní ọwọ́ ọ̀tún Ọlọ́run
  rationale: Ó pa àwòrán Bíbélì nípa ipò ọlá àti àṣẹ mọ́, ó sì jẹ́ gbólóhùn tí ó ṣe kedere ní Yorùbá.
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: tí ó ti lọ sí ọ̀run
  rationale: “tí ó ti lọ” fi hàn pé ìlọ náà ti ṣẹlẹ̀, “sí ọ̀run” sì jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣípò lọ sí ọ̀run, bó tilẹ̀ jẹ́ pé εἰς lè túmọ̀ ní pàtó sí ìwọlé sínú rẹ̀.
- source_word: ὑποταγέντων αὐτῷ
  choice: tí a sì ti fi … sábẹ́ rẹ̀
  rationale: Ìtumọ̀ yìí pa ohùn àìṣe àti ìtẹríba mọ́ ní Yorùbá àdánidá, láìsọ ẹni tó ṣe ìtẹríba náà ní pàtó.
- source_word: ἀγγέλων
  choice: àwọn áńgẹ́lì
  rationale: Nínú àyíká ìgbéga Kristi àti àwọn agbára ọ̀run, ọ̀rọ̀ náà ń tọ́ka sí àwọn ẹ̀dá ọ̀run, kì í ṣe àwọn ońṣẹ́ ènìyàn.
- source_word: ἐξουσιῶν
  choice: àwọn aláṣẹ
  rationale: Ó mú ìtumọ̀ ipò tàbí àṣẹ jáde, ó sì yàtọ̀ sí “àwọn agbára” tó tẹ̀ lé e.
- source_word: δυνάμεων
  choice: àwọn agbára
  rationale: Ó jẹ́ ìtumọ̀ ṣókí àti àdánidá fún àwọn agbára ọ̀run tàbí àgbáyé, láìsọ irú ìwà wọn ní pàtó.
theological_decisions:
- issue: Ìgbéga Kristi ní ọwọ́ ọ̀tún Ọlọ́run
  choice: Pa gbólóhùn àwòrán náà mọ́ gẹ́gẹ́ bí “ní ọwọ́ ọ̀tún Ọlọ́run.”
  alternative: ní ipò ọlá tí ó ga jù lọ lẹ́gbẹ̀ẹ́ Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì pa àwòrán ipò àti ìbáṣepọ̀ yìí mọ́; ṣíṣe àlàyé rẹ̀ gẹ́gẹ́ bí ọlá nìkan yóò túmọ̀ rẹ̀ ju bí a ṣe kọ ọ́ lọ.
- issue: Irú àwọn “áńgẹ́lì, aláṣẹ àti agbára”
  choice: Fi àkójọ gbooro náà sílẹ̀ láìpín wọn sí rere tàbí búburú.
  alternative: àwọn ẹ̀dá áńgẹ́lì rere nìkan; tàbí àwọn agbára ẹ̀mí ọ̀tá nìkan
  rationale: Ẹsẹ náà kò sọ irú ìwà wọn ní pàtó; ìtumọ̀ gbooro yìí pa àìdánilójú inú orísun mọ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó níyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá ṣe àdánidá. A pa ìtẹ̀lé gbólóhùn ìbátan àti àwòrán “ọwọ́ ọ̀tún Ọlọ́run” mọ́, ṣùgbọ́n a lo “lọ sí ọ̀run” nínú àkọ́kọ́ fún ìṣàn ọ̀rọ̀ Yorùbá; àṣàyàn tó túmọ̀ εἰς ní pàtó sí i wà nínú àlàyé ìsàlẹ̀.
