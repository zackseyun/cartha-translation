translation:
  language: yo
  text: Nínú èyí ni ó tún lọ kéde fún àwọn ẹ̀mí tí wọ́n wà ní ọgbà ẹ̀wọ̀[c][b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí ‘nínú ẹni náà’; tàbí ‘nípasẹ̀ èyí.’ A lè lóye ọ̀rọ̀ Gíríìkì náà ní ọ̀nà tó ju ẹyọ kan lọ nípa ìbáṣepọ̀ rẹ̀ pẹ̀lú gbólóhùn tó ṣáájú.
    reason: alternative_reading
  - marker: b
    text: Tàbí ‘wàásù.’ Ọ̀rọ̀-ìṣe náà túmọ̀ sí ṣíṣe ìkéde, ṣùgbọ́n ẹsẹ yìí kò sọ ohun tí a kéde ní pàtó.
    reason: lexical_alternative
  - marker: c
    text: Àríyànjiyàn wà nípa ẹni tí ‘àwọn ẹ̀mí tí wọ́n wà ní ọgbà ẹ̀wọ̀’ jẹ́; ó ṣeé ṣe kí wọ́n jẹ́ àwọn ènìyàn tí wọ́n ti kú tàbí àwọn áńgẹ́lì tó ṣubú.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: nínú èyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ Gíríìkì náà jẹ́ akọ ẹlẹ́ẹ̀kan ní ipò dátífù, ó sì ṣeé ṣe kí ó tọ́ka sí ‘ẹ̀mí’ nínú ẹsẹ tó ṣáájú. ‘Nínú èyí’ pa ìrísí gírámà àti àìdánilójú ìbáṣepọ̀ náà mọ́ láìfi agbára mú ìtumọ̀ kan ṣoṣo.
- source_word: καὶ
  choice: sì
  rationale: ‘Sì’ fi hàn pé ìṣe mìíràn ni a ń fi kún ohun tí a sọ ṣáájú, ó sì bá ìṣàn èdè Yorùbá mu.
- source_word: τοῖς ... πνεύμασιν
  choice: fún àwọn ẹ̀mí
  rationale: ‘Àwọn ẹ̀mí’ ni ìtumọ̀ tààrà jù lọ; yíyí i sí ‘ọkàn àwọn òkú’ tàbí ‘àwọn ẹ̀dá ẹ̀mí’ yóò ti pinnu ẹni tí ọ̀rọ̀ náà ń tọ́ka sí ju bí Gíríìkì ṣe sọ lọ.
- source_word: ἐν φυλακῇ
  choice: tí ó wà ní ọgbà ẹ̀wọ̀
  rationale: ‘Ọgbà ẹ̀wọ̀’ jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ibi ìhámọ́ tàbí ẹ̀wọ̀n, láìṣàlàyé àwòrán náà ré kọjá ọ̀rọ̀ ìpilẹ̀ṣẹ̀.
- source_word: πορευθεὶς
  choice: ó lọ
  rationale: A tú participle aorist náà sí ọ̀rọ̀-ìṣe pípé láti mú kí Yorùbá ṣe kedere àti ládàáni, nígbà tí a pa èrò ìlọ mọ́.
- source_word: ἐκήρυξεν
  choice: kéde
  rationale: ‘Kéde’ túmọ̀ sí fífi ìhìn kan jáde ní gbangba, ṣùgbọ́n kò pinnu pé ìhìn náà jẹ́ ìhìn rere, ìdájọ́, tàbí ìṣẹ́gun.
theological_decisions:
- issue: Ohun tí ἐν ᾧ ń tọ́ka sí
  choice: A tú u láìpinnu sí ‘nínú èyí,’ ó ṣeé ṣe kí ó tọ́ka sí ‘ẹ̀mí’ nínú gbólóhùn tó ṣáájú.
  alternative: ‘nínú ẹni náà,’ tó ń tọ́ka sí Kristi fúnra rẹ̀; tàbí ‘nípasẹ̀ èyí,’ gẹ́gẹ́ bí irinṣẹ́.
  rationale: Ìṣètò gbólóhùn àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ rẹ̀ jẹ́ ohun tí a ń jiyàn lé lórí. Ìtumọ̀ yìí kò fi ipá yanjú bí ìkéde náà ṣe ṣẹlẹ̀.
- issue: Ta ni ‘àwọn ẹ̀mí tí ó wà ní ọgbà ẹ̀wọ̀’
  choice: A fi ìdánimọ̀ wọn sílẹ̀ láìpinnu nínú ọ̀rọ̀ pàtàkì.
  alternative: Àwọn ènìyàn tí wọ́n ti kú ní ìran Nóà; àwọn áńgẹ́lì tó ṣubú; tàbí ẹgbẹ́ àwọn ẹ̀mí tí a fi sínú ìhámọ́.
  rationale: Gbólóhùn Gíríìkì náà kò sọ ẹni tí wọ́n jẹ́ ní kíkún, nítorí náà kò yẹ kí ìtumọ̀ pààlà ìtọ́kasí náà.
- issue: Irú ìhìn tí Kristi kéde nínú ἐκήρυξεν
  choice: A lò ‘kéde,’ láìsọ ohun tí ìhìn náà jẹ́.
  alternative: Wàásù ìhìn rere; kéde ìdájọ́; tàbí kéde ìṣẹ́gun.
  rationale: Ọ̀rọ̀-ìṣe náà ń tọ́ka sí ìkéde ní gbangba, ṣùgbọ́n kò sọ pàtó bóyá ìhìn náà jẹ́ ti ìgbàlà, ìdájọ́, tàbí ìṣẹ́gun.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tó ṣeé lóye ní rọrùn. A lo ‘kéde’ dípò ‘wàásù’ láti yẹra fún pípin irú ìhìn náà ní pàtó. Àwọn àmì àlàyé [c][b][a] wà nínú ọ̀rọ̀ gẹ́gẹ́ bí wọ́n ṣe hàn nínú ìpele ìmọ̀ràn Gẹ̀ẹ́sì.
