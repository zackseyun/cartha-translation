id: 1PE.3.6
reference: 1 Peter 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: yo
  text: gẹ́gẹ́ bí Sárà ti ṣègbọràn sí Ábúráhámù, tí ó ń pè é ní olúwa; ẹ̀yin sì ti di àwọn ọmọ rẹ̀ bí ẹ bá ń ṣe rere, tí ẹ kò sì bẹ̀rù ìpayà kankan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rù kankan” tàbí “ohun kankan tí ń bani lẹ́rù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó fi Sara hàn gẹ́gẹ́ bí àpẹẹrẹ tó bá ọ̀rọ̀ ìṣáájú mu, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìfiwéra ní Yorùbá.
- source_word: ὑπήκουσεν
  choice: ṣègbọràn sí
  rationale: Ó túmọ̀ ὑπακούω ní tààrà gẹ́gẹ́ bí ‘gbọ́ràn sí,’ láìrẹ̀wẹ̀sì ìtumọ̀ ọ̀rọ̀ Gíríìkì sí ‘tẹríba fún.’
- source_word: κύριον
  choice: olúwa
  rationale: Níbí, ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ọ̀wọ̀ tí Sara fi pe Abrahamu, kì í ṣe orúkọ oyè Ọlọ́run; nítorí náà a kọ ọ́ pẹ̀lú lẹ́tà kékeré.
- source_word: καλοῦσα
  choice: tí ó ń pè é ní
  rationale: Ó pa ìtumọ̀ participle náà mọ́ gẹ́gẹ́ bí ọ̀nà tí Sara gbà fi ọ̀wọ̀ hàn nínú ọ̀rọ̀ rẹ̀.
- source_word: ἧς ἐγενήθητε τέκνα
  choice: Ẹ̀yin sì ti di ọmọ rẹ̀
  rationale: ‘Ti di’ fi hàn pé wọ́n wọ ipò tuntun kan tí ó ṣì jẹ́ tiwọn nísinsìnyí; ‘ọmọ rẹ̀’ sì pa àwòrán ìbátan ìdílé mọ́ ní Yorùbá àdánidá.
- source_word: ἀγαθοποιοῦσαι
  choice: bí ẹ bá ń ṣe rere
  rationale: ‘Bí ẹ bá’ sọ agbára àídájú tí participle náà ní nínú àyíká yìí di mímọ̀, ‘ń’ sì fi ìwà tí ń bá a lọ hàn.
- source_word: μὴ φοβούμεναι μηδεμίαν πτόησιν
  choice: tí ẹ kò sì bẹ̀rù ẹ̀rù kankan
  rationale: Ó tẹ̀lé ìtumọ̀ tààrà ti ‘má bẹ̀rù’ àti ọ̀rọ̀ πτόησις, tó lè túmọ̀ sí ẹ̀rù, ìpayà, tàbí ohun tí ń dẹ́rù bani; àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ míì hàn.
theological_decisions:
- issue: Ìgbọràn Sara gẹ́gẹ́ bí àpẹẹrẹ fún àwọn aya onígbàgbọ́
  choice: A pa ‘ṣègbọràn sí’ mọ́ gẹ́gẹ́ bí ìtumọ̀ tààrà ὑπήκουσεν, láìfi ẹ̀kọ́ ìgbéyàwó tó gbòòrò ju ohun tí ẹsẹ̀ náà sọ kún un.
  alternative: ‘tẹríba fún’ tàbí ọ̀rọ̀ míì tó rọrùn ju ‘gbọ́ràn’ lọ
  rationale: Kí ìtumọ̀ má ṣe rẹ ọ̀rọ̀ Gíríìkì sílẹ̀ nítorí àṣà òde òní, bẹ́ẹ̀ ni kí ó má ṣe sọ ẹsẹ̀ náà di ìkéde ẹ̀kọ́ ìgbéyàwó tó kọjá àyíká rẹ̀.
- issue: Ipa àwọn participle ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι
  choice: 'A sọ wọ́n ní ọ̀nà àídájú: ‘bí ẹ bá ń ṣe rere, tí ẹ kò sì bẹ̀rù...’'
  alternative: 'Ọ̀nà àpèjúwe: ‘nígbà tí ẹ ń ṣe rere, tí ẹ kò sì bẹ̀rù...’'
  rationale: Ọ̀nà àídájú bá ìṣírí inú àyíká mu, ṣùgbọ́n kò sọ pé ọmọ Sara nípa ti ara ni wọ́n; ó fi hàn bí àwọn olùgbọ́ ṣe ń fi ìbátan àpẹẹrẹ yìí hàn.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lasán. ‘Olúwa’ wà ní lẹ́tà kékeré láti yà á sọ́tọ̀ kúrò nínú orúkọ oyè Ọlọ́run.
