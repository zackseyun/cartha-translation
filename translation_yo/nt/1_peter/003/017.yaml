id: 1PE.3.17
reference: 1 Peter 3:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: yo
  text: Nítorí ó sàn kí ẹ jìyà nígbà tí ẹ ń ṣe rere[a], bí ìfẹ́ Ọlọ́run bá fẹ́ kí ó rí bẹ́ẹ̀[b], ju kí ẹ jìyà nígbà tí ẹ ń ṣe búburú lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí, “nítorí ṣíṣe rere ... ju nítorí ṣíṣe búburú lọ.” Àwọn ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìdí tí ẹni fi ń jìyà (“nítorí”), tàbí kí wọ́n ṣàpèjúwe ipò tó wà nígbà ìjìyà (“nígbà tí”).
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, èdè Gíríìkì sọ pé, “bí ìfẹ́ Ọlọ́run bá fẹ́.” Èyí jẹ́ ọ̀rọ̀ ìtẹnumọ́; a mú ìtumọ̀ rẹ̀ jáde ní Yorùbá pé, “bí ìfẹ́ Ọlọ́run bá fẹ́ kí ó rí bẹ́ẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: ó sàn
  rationale: Ọ̀rọ̀ àfiwé náà túmọ̀ sí pé ohun kan dára tàbí yẹ ju òmíràn lọ; “ó sàn” jẹ́ ọ̀nà Yorùbá àdánidá fún ìtumọ̀ yìí.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ìṣírí tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: ἀγαθοποιοῦντας
  choice: nígbà tí ẹ ń ṣe rere
  rationale: Participle náà ń ṣàpèjúwe ipò àwọn tí wọ́n ń jìyà, kò sì fi dandan mú ìtumọ̀ pé ṣíṣe rere ni ó fa ìjìyà náà. “Nígbà tí” pa àìdánilójú yẹn mọ́.
- source_word: εἰ θέλοι
  choice: bí ... bá fẹ́
  rationale: Optative lẹ́yìn εἰ fi ipò tí ó ṣeé ṣe hàn. Àkọsílẹ̀ Yorùbá “bí ... bá” sọ ìpèníjà náà ní ọ̀nà àdánidá láì sọ ọ́ di ohun tí ó dájú.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ìfẹ́ Ọlọ́run
  rationale: Èyí jẹ́ ìtumọ̀ Yorùbá tó ṣe kedere fún “the will of God,” ó sì pa ìwúwo ọ̀rọ̀ náà mọ́.
- source_word: πάσχειν
  choice: kí ẹ jìyà
  rationale: Infinitive náà sin κρεῖττον; lẹ́yìn “ó sàn,” ètò “kí ẹ jìyà” jẹ́ Yorùbá àdánidá.
- source_word: ἢ
  choice: ju ... lọ
  rationale: Èyí ni ètò àfiwé Yorùbá tó bá κρεῖττον ... ἢ mu.
- source_word: κακοποιοῦντας
  choice: nígbà tí ẹ ń ṣe búburú
  rationale: Ó bá ἀγαθοποιοῦντας ṣe àtakò, ìtumọ̀ rẹ̀ sì fara mọ́ ọ ní ìṣọ̀kan láì fi ìdí-okùnfà kún un.
theological_decisions:
- issue: Ìbáṣepọ̀ ìjìyà pẹ̀lú ìfẹ́ Ọlọ́run
  choice: Ẹsẹ náà sọ pé ìjìyà ẹni tó ń ṣe rere lè wáyé bí ìfẹ́ Ọlọ́run bá fẹ́ kí ó rí bẹ́ẹ̀, ṣùgbọ́n kò túmọ̀ sí ẹ̀kọ́ kíkún nípa bí Ọlọ́run ṣe ń fa ìjìyà tàbí ṣe ń yọ̀ǹda rẹ̀.
  alternative: Kí a túmọ̀ ọ́ pé Ọlọ́run pinnu gbogbo ìjìyà ní tààràtà, tàbí pé ó kàn yọ̀ǹda rẹ̀ láì ní ipa kankan.
  rationale: εἰ θέλοι τὸ θέλημα τοῦ θεοῦ tọ́ka sí ìfẹ́ Ọlọ́run ní ọ̀nà onípò, ṣùgbọ́n kò yanjú àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ nípa ìpinnu àti ìyọ̀ǹda. Àyíká Yorùbá pa ìdọ́gba yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ẹ” jẹ́ arọ́pò-orúkọ ọ̀pọ̀ ènìyàn, gẹ́gẹ́ bí àwọn participle accusative plural inú Gíríìkì.
