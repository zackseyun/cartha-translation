id: 1PE.3.21
reference: 1 Peter 3:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: yo
  text: Ìbatisí, tí ó bá èyí mu, ń gba yín náà là nísinsìnyí—kì í ṣe yíyọ ẹ̀gbin kúrò lára, bí kò ṣe ẹ̀bẹ̀ sí Ọlọ́run fún ẹ̀rí-ọkàn rere[a]—nípasẹ̀ àjíǹde Jésù Mèsáyà,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìlérí ẹ̀rí-ọkàn rere sí Ọlọ́run.” Ọ̀rọ̀ Gíríìkì ἐπερώτημα, tí a túmọ̀ sí “ẹ̀bẹ̀,” tún lè túmọ̀ sí “ìlérí” tàbí “ìdáhùn.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: Èyí sì ni ó bá omi náà mu
  rationale: Ó tọ́ka padà sí omi ìkún-omi tí ẹsẹ tó ṣáájú mẹ́nu kàn, ó sì fi ìbámu àpẹẹrẹ méjèèjì hàn láìlo ọ̀rọ̀ ẹ̀kọ́ ìsìn tí kò rọrùn.
- source_word: σῴζει
  choice: ń gba ... là
  rationale: A pa gbólóhùn tààrà pé ìbatisí ń gbani là mọ́, láìrẹ̀ ẹ́ sílẹ̀ tàbí fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- source_word: βάπτισμα
  choice: ìbatisí
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún baptism; àyíká náà yà á sọ́tọ̀ kúrò nínú wíwẹ ara lásán.
- source_word: σαρκὸς
  choice: lára
  rationale: Ní àyíká yìí, ara ti ẹ̀gbin lè wà lára rẹ̀ ni ọ̀rọ̀ náà túmọ̀ sí; ‘lára’ jẹ́ Yorùbá àdánidá ju títúmọ̀ rẹ̀ ní ọ̀rọ̀-ọ̀rọ̀ sí ‘ẹran ara’ lọ.
- source_word: ἀπόθεσις ῥύπου
  choice: mímú ẹ̀gbin kúrò
  rationale: Ó ṣàpèjúwe ìwẹ̀nùmọ́ ti ara ní èdè Yorùbá tó ṣe kedere, tó sì bójú mu.
- source_word: συνειδήσεως ἀγαθῆς
  choice: fún ẹ̀rí-ọkàn rere
  rationale: Genitive Gíríìkì náà kúrú, ó sì lè ní ìtumọ̀ ju ọ̀kan lọ; yíyan ‘fún’ bá òye pé ohun tí a ń bẹ Ọlọ́run fún ni ẹ̀rí-ọkàn rere mu.
- source_word: ἐπερώτημα
  choice: ẹ̀bẹ̀
  rationale: ‘Ẹ̀bẹ̀’ bá ìdarí εἰς θεόν mu, ó sì pa ìtumọ̀ ìbéèrè tàbí ìpè sí Ọlọ́run mọ́. A fi ìtumọ̀ ‘ìlérí’ sínú àlàyé ìsàlẹ̀.
- source_word: εἰς θεόν
  choice: sí Ọlọ́run
  rationale: Ó fi hàn pé Ọlọ́run ni ẹ̀bẹ̀ náà ń tọ̀ sí.
- source_word: δι’ ἀναστάσεως
  choice: nípasẹ̀ àjíǹde
  rationale: Ó pa ìtumọ̀ ọ̀nà tàbí ohun èlò tí διά pẹ̀lú genitive ní mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu Mèsáyà
  rationale: Χριστός ní agbára oyè níbí; ‘Mèsáyà’ pa oyè náà mọ́ ní Yorùbá àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ ìbatisí pẹ̀lú ìgbàlà
  choice: A pa ọ̀rọ̀ tààrà pé ‘ìbatisí ń gba ẹ̀yin náà là’ mọ́, a sì jẹ́ kí àlàyé Pétérù fúnra rẹ̀ ṣàlàyé rẹ̀.
  alternative: Kí a sọ pé ìbatisí kàn ń ṣàpẹẹrẹ ìgbàlà, tàbí kí a fi ẹ̀kọ́ sacrament ẹgbẹ́ ìsìn kan kún ọ̀rọ̀ náà.
  rationale: Gíríìkì sọ ipa ìgbàlà ìbatisí ní tààrà, ṣùgbọ́n ó tún sọ pé kì í ṣe ìwẹ̀ ara lásán, ó sì so ó mọ́ ẹ̀rí-ọkàn níwájú Ọlọ́run àti àjíǹde Jesu.
- issue: Ìtumọ̀ ἐπερώτημα
  choice: A lo ‘ẹ̀bẹ̀’ nínú ọ̀rọ̀ pàtàkì, a sì pa ‘ìlérí’ mọ́ gẹ́gẹ́ bí ìtumọ̀ mìíràn nínú àlàyé ìsàlẹ̀.
  alternative: ìlérí tàbí ìdáhùn
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ tí ìtumọ̀ rẹ̀ ń fa àríyànjiyàn. ‘Ẹ̀bẹ̀’ bá εἰς θεόν mu dáadáa, ṣùgbọ́n ‘ìlérí’ ní ẹ̀rí tó yẹ kí a má ṣe fi pamọ́.
translation_notes:
  register: A lo Yorùbá àkójọpọ̀ tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. ‘Ẹ̀rí-ọkàn’ ni ọ̀rọ̀ tó ṣe kedere fún conscience; ‘ìbatisí’ sì jẹ́ ọ̀rọ̀ Yorùbá ìjọsìn tó wọ́pọ̀.
