  to: Nínú èyí[a], ó yà wọ́n lẹ́nu pé ẹ̀yin kò bá wọn sáré lọ sínú àkúnya ìwà wọ̀bìà kan náà[b], nígbà tí wọ́n ń sọ̀rọ̀ burúkú sí yín[c].
