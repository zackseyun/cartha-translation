source:
  edition: SBLGNT
  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: yo
  text: Nínú èyí[a], ó yà wọ́n lẹ́nu pé ẹ̀yin kò bá wọn sáré lọ sínú àkúnya ìwà wọ̀bìà kan náà[b], nígbà tí wọ́n ń sọ̀rọ̀ burúkú sí yín[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nítorí èyí”; tàbí, “wọ́n kà á sí ohun àjèjì.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààràtà, “wọ sínú ìṣàn jáde tàbí àkúnya kan náà ti ìwà wọ̀bìà.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “wọ́n ń ké èébú sí yín”; tàbí, “wọ́n ń sọ̀rọ̀-òdì sí yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Nínú èyí
  rationale: Ó pa ìsopọ̀ mọ́ ohun tí a ṣẹ̀ṣẹ̀ sọ ní ẹsẹ tó ṣáájú, láì fi ìtumọ̀ okùnfà tí kò ṣe kedere sínú rẹ̀.
- source_word: ξενίζονται
  choice: ó yà wọ́n lẹ́nu
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé ohun kan ya ènìyàn lẹ́nu tàbí pé ó dà bí ohun àjèjì sí wọn.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: ẹ̀yin kò bá wọn súré
  rationale: Ó pa àwòrán inú ọ̀rọ̀ συντρέχω, ‘súré pọ̀,’ mọ́, ó sì tún fi hàn pé àwọn onígbàgbọ́ kò darapọ̀ mọ́ wọn nínú ìwà náà.
- source_word: εἰς τὴν αὐτὴν
  choice: wọ inú … kan náà
  rationale: ‘Wọ inú’ fi ìṣípò sí inú ohun kan hàn, ‘kan náà’ sì tọ́ka sí irú ìgbé ayé tí wọ́n ti ń ṣe tẹ́lẹ̀.
- source_word: τῆς ἀσωτίας
  choice: ti ìwà wọ̀bìà
  rationale: ‘Ìwà wọ̀bìà’ sọ ìgbé ayé oníjàánu-kúrò àti ìwà búburú tó kọjá ààlà, láì dín ọ̀rọ̀ náà kù sí ẹ̀ṣẹ̀ ìbálòpọ̀ nìkan.
- source_word: ἀνάχυσιν
  choice: ìkún omi
  rationale: Ó mú àwòrán ìṣàn jáde tàbí àkúnya tó wà nínú ọ̀rọ̀ Gíríìkì jáde ní Yorùbá tó ṣeé lóye.
- source_word: βλασφημοῦντες
  choice: wọ́n sì ń sọ̀rọ̀-òdì sí yín
  rationale: Ní àyíká ọ̀rọ̀ yìí, ó túmọ̀ sí sísọ̀rọ̀ burúkú tàbí èébú sí àwọn ènìyàn; ‘sọ̀rọ̀-òdì sí yín’ pa àfojúsùn náà mọ́ láì mú un dà bí ọ̀rọ̀-òdì sí Ọlọ́run nìkan.
theological_decisions:
- issue: Àfojúsùn ọ̀rọ̀ βλασφημοῦντες
  choice: Ọ̀rọ̀-òdì tí a darí sí àwọn onígbàgbọ́
  alternative: Sísọ̀rọ̀-òdì sí Ọlọ́run tàbí sísọ ohun búburú lápapọ̀
  rationale: Àyíká ọ̀rọ̀ ń sọ bí àwọn aláìgbàgbọ́ ṣe ń fèsì sí ìyípadà ìgbé ayé àwọn onígbàgbọ́. Nítorí náà, a mú ìtumọ̀ ìkọlù ẹnu sí wọn jáde, ṣùgbọ́n a kò sọ pé ọ̀rọ̀ Gíríìkì kò lè ní ìtumọ̀ tó gbòòrò ní ibòmíràn.
translation_notes:
  register: Yorùbá boṣewa tó ní àmì ohùn ní kíkún ni a lò. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A pa àwòrán ‘súré’ àti ‘ìkún omi’ inú Gíríìkì mọ́, nígbà tí a yàgò fún ọ̀rọ̀ tó lè dín ἀσωτία kù sí ìṣekúṣe ìbálòpọ̀ nìkan.
