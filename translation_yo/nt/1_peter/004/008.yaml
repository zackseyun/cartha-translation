  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: yo
  text: Ju gbogbo nǹkan lọ, ẹ máa ní ìfẹ́ jíjinlẹ̀ sí ara yín[a][c], nítorí ìfẹ́ ń bo ọ̀pọ̀lọpọ̀ ẹ̀ṣẹ̀ mọ́lẹ̀.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìfẹ́ àtọkànwá.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ yìí fara jọ Òwe 10:12; a tún lè lóye “bo ... mọ́lẹ̀” gẹ́gẹ́ bí “gbójú fo” tàbí “fi pamọ́,” ní ọ̀nà tí ìfẹ́ kì í mú àwọn àṣìṣe dàgbà.
    reason: cross_reference
  - marker: c
    text: Ní tààràtà, “níní ìfẹ́ jíjinlẹ̀ sí ara yín.”
    reason: previous_rendering
lexical_decisions:
- source_word: πρὸ πάντων
  choice: Ju gbogbo nǹkan lọ
  rationale: Ó fi ohun tó ṣe pàtàkì jù hàn, kì í ṣe pé ó ń sọ nípa àkókò nìkan; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá fún ‘above all’.
- source_word: εἰς ἑαυτοὺς
  choice: sí ara yín
  rationale: Nínú àwùjọ àwọn onígbàgbọ́, ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí ìfẹ́ tí wọ́n ní sí ara wọn.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédéé, tó sì bá ọ̀rọ̀ inú ẹsẹ náà mu.
- source_word: ἐκτενῆ
  choice: jíjinlẹ̀
  rationale: Ọ̀rọ̀ náà ní èrò ohun tí a nà jáde, èyí tó ń tọ́ka sí ìfẹ́ tó lágbára, tó fi gbogbo ọkàn ṣe, tí kò sì yára rẹ̀; ‘jíjinlẹ̀’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tó sọ agbára ìfẹ́ náà.
- source_word: ἔχοντες
  choice: ẹ máa ní
  rationale: Ẹni-ìṣe aláìparí náà ń tẹ̀ síwájú nínú àwọn ìṣílétí ẹsẹ tó ṣáájú; lílo ọ̀rọ̀ àṣẹ ‘ẹ máa ní’ mú ìtumọ̀ rẹ̀ jáde ní Yorùbá tó ṣe kedere.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí fún ìṣílétí tó ṣáájú.
- source_word: καλύπτει
  choice: a máa bo ... mọ́lẹ̀
  rationale: Ó pa àwòrán ‘bo’ inú Gíríìkì mọ́, kò sì fi tipátipá pinnu bóyá ó túmọ̀ sí fífi ẹ̀ṣẹ̀ jì, gbígbójú fo ẹ̀ṣẹ̀, tàbí ṣíṣàìru ẹ̀ṣẹ̀ sókè.
- source_word: πλῆθος
  choice: ọ̀pọ̀lọpọ̀
  rationale: Ó fi iye púpọ̀ àti ìwọ̀n ọ̀rọ̀ Gíríìkì hàn ní èdè Yorùbá tó mọ́.
- source_word: ἁμαρτιῶν
  choice: ẹ̀ṣẹ̀
  rationale: Ìtumọ̀ tààrà ni, kò sì sí ohun kan nínú àyíká ọ̀rọ̀ tó béèrè pé kí a dín ìtumọ̀ rẹ̀ kù.
theological_decisions:
- issue: Ìtumọ̀ ‘ìfẹ́ a máa bo ọ̀pọ̀lọpọ̀ ẹ̀ṣẹ̀ mọ́lẹ̀’
  choice: Pa àwòrán ‘bo ... mọ́lẹ̀’ mọ́ láì sọ pàtó àwọn ẹ̀ṣẹ̀ ta ni wọ́n jẹ́ tàbí irú ìbora wo ni a ń sọ.
  alternative: ‘Ìfẹ́ a máa gbójú fo ọ̀pọ̀lọpọ̀ àṣìṣe’ tàbí ‘ìfẹ́ ń mú ìdáríjì wá fún ọ̀pọ̀lọpọ̀ ẹ̀ṣẹ̀.’
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ọ̀rọ̀ òwe tó fara jọ Òwe 10:12, kò sì fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan ṣoṣo múlẹ̀. Àwòrán ‘bo’ ń pa àìdánilójú àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé lásán. ‘Ẹ máa ní’ mú agbára ìṣílétí ẹni-ìṣe Gíríìkì jáde, nígbà tí ‘bo ... mọ́lẹ̀’ pa àwòrán àti àìdánilójú ojúlówó ọ̀rọ̀ náà mọ́.
