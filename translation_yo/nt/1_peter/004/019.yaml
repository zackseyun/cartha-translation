id: 1PE.4.19
reference: 1 Peter 4:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: yo
  text: Nítorí náà, kí àwọn tí ń jìyà gẹ́gẹ́ bí ìfẹ́ Ọlọ́run náà fi ọkàn wọn[a] lé Ẹlẹ́dàá olóòótọ́ lọ́wọ́, bí wọ́n ti ń ṣe rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìwàláàyè wọn” tàbí “ara wọn”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọkàn, ìwàláàyè, tàbí ẹni náà fúnra rẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde ohun tí a sọ ṣáájú, ó sì jẹ́ ọ̀nà àdánidá láti sọ ìtumọ̀ náà ní Yorùbá.
- source_word: οἱ πάσχοντες
  choice: àwọn tí ń jìyà
  rationale: Ó ṣàfihàn àwọn ẹni tí ìjìyà ń ṣẹlẹ̀ sí lọ́wọ́ tàbí tí ìjìyà jẹ́ apá kan ìrírí wọn.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: gẹ́gẹ́ bí ìfẹ́ Ọlọ́run
  rationale: Ó pa èrò ìbámu pẹ̀lú ìfẹ́ Ọlọ́run mọ́ láì pinnu bóyá Ọlọ́run yọ̀ǹda ìjìyà náà, ó pàṣẹ rẹ̀, tàbí ó fẹ́ ẹ ní ọ̀nà mìíràn.
- source_word: πιστῷ κτίστῃ
  choice: Ẹlẹ́dàá olóòótọ́
  rationale: ‘Ẹlẹ́dàá’ túmọ̀ κτίστης ní kedere, ‘olóòótọ́’ sì mú ìgbẹ́kẹ̀lé àti ìdúróṣinṣin inú πιστός jáde. Àkọlé náà ń tọ́ka sí Ọlọ́run, nítorí náà a kọ ọ́ pẹ̀lú lẹ́tà ńlá.
- source_word: παρατιθέσθωσαν
  choice: fi ... lé ... lọ́wọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ Yorùbá yìí jẹ́ ọ̀nà àdánidá láti sọ fífi ohun tàbí ara ẹni sí àbójútó ẹni tí a gbẹ́kẹ̀ lé.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: ọkàn wọn
  rationale: ‘Ọkàn’ jẹ́ ọ̀rọ̀ Yorùbá tí ó lè tọ́ka sí ẹ̀mí inú ẹni, ìwàláàyè rẹ̀, tàbí ẹni náà lápapọ̀; àlàyé ìsàlẹ̀ ojú ìwé pa fífẹ̀ ìtumọ̀ ψυχή mọ́.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: bí wọ́n ti ń ṣe rere
  rationale: Ó sọ pé fífi ara wọn lé Ọlọ́run lọ́wọ́ ń bá ṣíṣe rere lọ papọ̀, ó sì dun bí Yorùbá àdánidá.
theological_decisions:
- issue: Ìbáṣepọ̀ ìjìyà pẹ̀lú ìfẹ́ Ọlọ́run
  choice: gẹ́gẹ́ bí ìfẹ́ Ọlọ́run
  alternative: nípasẹ̀ ìfẹ́ Ọlọ́run
  rationale: Gíríìkì sọ pé ìjìyà náà wà ní ìbámu pẹ̀lú ìfẹ́ Ọlọ́run, ṣùgbọ́n kò ṣàlàyé bí ìbáṣepọ̀ náà ṣe rí. Ìtumọ̀ yìí kò fipá yan ẹ̀kọ́ kan pàtó.
- issue: Ìtumọ̀ ψυχή nínú àyíká ọ̀rọ̀ yìí
  choice: ọkàn wọn
  alternative: ìwàláàyè wọn; ara wọn
  rationale: ‘Ọkàn’ pa àwọ̀ ẹ̀mí ọ̀rọ̀ náà mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ ojú ìwé jẹ́wọ́ pé ψυχή tún lè túmọ̀ sí ìwàláàyè tàbí ẹni fúnra rẹ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó bójú mu, tí ó sì ní iyì ni a lò. A yan ‘fi ... lé ... lọ́wọ́’ dípò gbólóhùn líle tàbí àtúmọ̀-ọ̀rọ̀-lẹ́yọ̀ọ̀kan, nítorí ó ṣe kedere fún òǹkàwé Yorùbá. Gbogbo àmì ohùn ni a fi síbi tí ó yẹ.
