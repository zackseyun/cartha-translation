source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: yo
  text: kí ó lè má tún lo ìyókù àkókò rẹ̀ nínú ara[a] láti tẹ̀ lé ìfẹ́kúfẹ̀ẹ́ ènìyàn, bí kò ṣe láti ṣe ìfẹ́ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìgbésí ayé ara rẹ̀.” Gbólóhùn Gíríìkì náà, “nínú ara,” ń tọ́ka níbí sí ìgbésí ayé ènìyàn nínú ara lórí ayé; kò ní dandan túmọ̀ sí “ìwà ẹ̀ṣẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: kí ó lè
  rationale: Ìsopọ̀ yìí fi ète tàbí àbájáde ohun tí a sọ ní ẹsẹ tó ṣáájú hàn; ‘kí ó lè’ jẹ́ ọ̀nà àdánidá láti sọ èyí ní Yorùbá.
- source_word: μηκέτι
  choice: má ṣe ... mọ́
  rationale: Ọ̀nà Yorùbá àdánidá ni èyí láti fi hàn pé ìwà tàbí ọ̀nà ìgbésí ayé tẹ́lẹ̀ ti dópin.
- source_word: ἀνθρώπων
  choice: ènìyàn
  rationale: Ó ń tọ́ka sí aráyé lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: ἐπιθυμίαις
  choice: àwọn ìfẹ́kúfẹ̀ẹ́
  rationale: Ọ̀rọ̀ yìí gbòòrò ju ìfẹ́ ìbálòpọ̀ lọ, ó sì lè tọ́ka sí àwọn ìfẹ́ búburú onírúurú gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe fi hàn.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Ó pa ìyàtọ̀ tó lágbára mọ́ láàárín àwọn ìfẹ́kúfẹ̀ẹ́ ènìyàn àti ìfẹ́ Ọlọ́run.
- source_word: θελήματι θεοῦ
  choice: fún ìfẹ́ Ọlọ́run
  rationale: ‘Fún’ pa ìṣọ̀kan gírámà mọ́ pẹ̀lú ‘fún àwọn ìfẹ́kúfẹ̀ẹ́ ènìyàn,’ ó sì fi ohun tí yóò máa darí ìgbésí ayé náà hàn.
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: ìyókù àkókò rẹ̀
  rationale: Ó sọ àkókò ìgbésí ayé ẹni náà tó kù ní ṣókí àti ní Yorùbá àdánidá.
- source_word: ἐν σαρκὶ
  choice: nínú ara
  rationale: Nínú àyíká yìí, σάρξ ń tọ́ka sí ìgbésí ayé ènìyàn nínú ara lórí ayé, kì í ṣe dandan sí ‘ìwà ẹ̀ṣẹ̀.’
- source_word: βιῶσαι
  choice: gbé
  rationale: Pẹ̀lú ‘àkókò rẹ̀,’ ọ̀rọ̀ yìí fi hàn bí ẹni náà yóò ṣe gbé ìyókù ìgbésí ayé rẹ̀.
theological_decisions:
- issue: Ìtumọ̀ σάρξ nínú ἐν σαρκὶ
  choice: ìgbésí ayé ẹni nínú ara lórí ayé (‘nínú ara’)
  alternative: ìwà ẹ̀ṣẹ̀
  rationale: Àyíká ọ̀rọ̀ ń sọ nípa ìyókù ìgbésí ayé ẹni ní ipò ara ikú; kò pe σάρξ ní agbára ẹ̀ṣẹ̀ inú níbí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ìfẹ́kúfẹ̀ẹ́’ fún àwọn ìfẹ́ búburú ní ìtumọ̀ gbòòrò, a sì lo ‘nínú ara’ láti yà ìgbésí ayé ara lórí ayé sọ́tọ̀ kúrò nínú ìtumọ̀ ẹ̀kọ́ ìsìn ti ‘ìwà ẹ̀ṣẹ̀.’
