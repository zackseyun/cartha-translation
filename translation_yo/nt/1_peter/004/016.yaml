source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: yo
  text: Ṣùgbọ́n bí ó bá jìyà gẹ́gẹ́ bí Kristẹni, kí ó má ṣe tijú; kàkà bẹ́ẹ̀, kí ó yin Ọlọ́run lógo nínú orúkọ yìí.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “nínú ọ̀ràn yìí” tàbí “nítorí orúkọ yìí.” Ní tààrà, Gíríìkì sọ pé “nínú orúkọ yìí,” ó sì ṣeé ṣe kó ń tọ́ka sí orúkọ náà, “Kristẹni.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ ὡς Χριστιανός
  choice: Ṣùgbọ́n bí ó bá jìyà gẹ́gẹ́ bí Kristẹni
  rationale: “Ṣùgbọ́n bí” ṣètọ́jú ìtumọ̀ àídájú àti ìyípadà kékeré tí εἰ δὲ ní. Ọ̀rọ̀-ìṣe “jìyà” ni a mú wá láti inú ọ̀rọ̀ tó ṣáájú, níbi tí ìṣe náà ti fara sin nínú Gíríìkì; èyí mú kí Yorùbá ṣe kedere láì yí ìtumọ̀ padà. “Kristẹni” ni orúkọ tí a ti mọ̀ fún Χριστιανός.
- source_word: μὴ αἰσχυνέσθω
  choice: kí ojú má ṣe tì í
  rationale: Èyí jẹ́ ọ̀nà Yorùbá àdánidá fún ìtìjú, ó sì pa agbára àṣẹ ẹni-kẹta mọ́.
- source_word: δοξαζέτω δὲ τὸν θεόν
  choice: kàkà bẹ́ẹ̀, kí ó yin Ọlọ́run lógo
  rationale: “Kàkà bẹ́ẹ̀” fi ìyàtọ̀ sí ìtìjú hàn. “Yin Ọlọ́run lógo” jẹ́ gbólóhùn Yorùbá tó yé ni àyíká ìjọsìn, ó sì ṣètọ́jú ìtumọ̀ δοξάζω.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: nínú orúkọ yìí
  rationale: Ìtumọ̀ yìí tẹ̀ lé ọ̀rọ̀ Gíríìkì ní tààrà, ó sì so gbólóhùn náà mọ́ orúkọ “Kristẹni,” láì pa àwọn ìtumọ̀ mìíràn tí àkópọ̀ ἐν lè ní run.
theological_decisions:
- issue: Ohun tí “orúkọ yìí” (ἐν τῷ ὀνόματι τούτῳ) ń tọ́ka sí
  choice: A fi “nínú orúkọ yìí” sínú ẹsẹ̀, ó ṣeé ṣe kó tọ́ka sí orúkọ “Kristẹni.”
  alternative: “Nínú ọ̀ràn yìí” tàbí “nítorí orúkọ yìí.”
  rationale: Χριστιανός ni ohun tó sún mọ́ ọ jù gẹ́gẹ́ bí ohun tí “orúkọ yìí” ń tọ́ka sí. Síbẹ̀, àlàyé ìsàlẹ̀ ojú ewé pa àìdájú gidi ti ἐν mọ́, dípò fífi ìtumọ̀ kan ṣoṣo lé e lórí.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tó bá yẹ. Èdè náà jẹ́ ti òde òní, ọ̀wọ̀, ó sì ṣeé lóye fún òǹkàwé gbogbogbò. A ṣe àfikún “jìyà” láti inú àyíká ẹsẹ̀ tó ṣáájú nítorí Yorùbá nílò ọ̀rọ̀-ìṣe kedere níbí.
