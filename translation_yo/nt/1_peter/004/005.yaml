source:
  edition: SBLGNT
  text: οἳ ἀποδώσουσιν λόγον τῷ ἑτοίμως ⸂ἔχοντι κρῖναι⸃ ζῶντας καὶ νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: yo
  text: Wọ́n yóò jíhìn fún ẹni tí ó múra tán láti dá àwọn alààyè àti àwọn òkú lẹ́jọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó wà ní ìmúrasílẹ̀ láti ṣe ìdájọ́.” Ní tààràtà, gbólóhùn Gíríìkì náà ṣàpèjúwe ẹni tí ó “ní ìmúrasílẹ̀ láti ṣe ìdájọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: Wọ́n
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ìbátan náà ń tọ́ka sí àwọn ènìyàn tí ẹsẹ tó ṣáájú mẹ́nu kàn. “Wọ́n” jẹ́ ọ̀nà àdánidá láti bẹ̀rẹ̀ gbólóhùn náà ní Yorùbá.
- source_word: ἀποδώσουσιν λόγον
  choice: yóò jíhìn
  rationale: Àkójọpọ̀ ọ̀rọ̀ Gíríìkì náà túmọ̀ sí pé ẹnì kan yóò sọ ohun tí ó ṣe, tàbí yóò dáhùn nípa rẹ̀. “Jíhìn” ṣe kedere, ó sì pa ìtumọ̀ ọ̀ràn ìdájọ́ mọ́.
- source_word: τῷ
  choice: fún ẹni
  rationale: Àpilẹ̀kọ náà pẹ̀lú ọ̀rọ̀ aláìlópìn ń ṣiṣẹ́ bí orúkọ. “Fún ẹni” kò fi ẹni tí olùdájọ́ náà jẹ́ kún ọ̀rọ̀ Gíríìkì.
- source_word: ἑτοίμως
  choice: ní imurasilẹ
  rationale: Ọ̀rọ̀ náà ń fi ìmúrasílẹ̀ tàbí jíjẹ́ ẹni tí ó ti múra tán hàn. Gbólóhùn “wà ní imurasilẹ” jẹ́ Yorùbá àdánidá tí ó bá ìtumọ̀ náà mu.
- source_word: ἔχοντι κρῖναι
  choice: tí ó wà ní imurasilẹ láti dá ... lẹ́jọ́
  rationale: Ìtumọ̀ rẹ̀ ní tààràtà sún mọ́ “ẹni tí ó ní imurasilẹ láti ṣe ìdájọ́.” Ìtumọ̀ yìí jẹ́ kedere, ó sì pa agbára ìmúrasílẹ̀ tó wà nínú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ζῶντας καὶ νεκρούς
  choice: àwọn alààyè àti àwọn òkú
  rationale: Èyí jẹ́ ọ̀nà ṣókí, tí ó wọ́pọ̀, tí ó sì péye fún gbogbo àwọn tí ó wà láàyè àti àwọn tí ó ti kú.
theological_decisions:
- issue: Ta ni “ẹni tí ó wà ní imurasilẹ láti dá àwọn alààyè àti àwọn òkú lẹ́jọ́” jẹ́?
  choice: A fi í sílẹ̀ gẹ́gẹ́ bí “ẹni” láì pe orúkọ Ọlọ́run tàbí Kristi ní pàtó.
  alternative: Ọlọ́run; Mèsáyà/Kristi
  rationale: Ọ̀rọ̀ Gíríìkì kò sọ orúkọ olùdájọ́ náà ní ẹsẹ yìí. Bó tilẹ̀ jẹ́ pé àwọn ẹsẹ mìíràn nínú Májẹ̀mú Tuntun sọ nípa Ọlọ́run àti Kristi gẹ́gẹ́ bí olùdájọ́, a kò yan ọ̀kan nínú wọn sí i ju ohun tí ẹsẹ yìí sọ lọ.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó ṣe kedere fún òǹkàwé lásán. A fi àmì ohùn sí ibi tí ó yẹ, a sì lo “jíhìn” fún àwòrán ọ̀ràn ìdájọ́ láì sọ ìtumọ̀ ẹ̀kọ́ ìsìn kan sínú ẹsẹ náà.
