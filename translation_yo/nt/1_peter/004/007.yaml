  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: yo
  text: Ṣùgbọ́n òpin ohun gbogbo ti sún mọ́[a]. Nítorí náà, ẹ ní ìrònú tó bójú mu, kí ẹ sì máa ṣọ́ra[b] fún àdúrà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “òpin ohun gbogbo sún mọ́.” Ìṣe pípé Gíríìkì náà lè fi ìsúnmọ́ tí ó ti ṣẹlẹ̀ àti ipò jíjẹ́ nítòsí báyìí hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹ ní ìrònú tó bójú mu, kí ẹ sì wà lójúfò.” Àwọn àṣẹ méjèèjì tẹnu mọ́ ìdájọ́ tó kedere àti ìmúrasílẹ̀ nípa tẹ̀mí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: ohun gbogbo
  rationale: Ọ̀rọ̀ yìí jẹ́ àfihàn àdánidá ní Yorùbá fún gbogbo ohun tí ó wà, ó sì bá τέλος mu nínú gbólóhùn nípa òpin.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tàbí ìtakora díẹ̀ hàn láti inú ọ̀rọ̀ tó ṣáájú, ó sì pa ìkìlọ̀ náà mọ́.
- source_word: τὸ τέλος
  choice: òpin
  rationale: Nínú àyíká ọ̀rọ̀ nípa àwọn ohun ìkẹyìn, ‘òpin’ ni ìtumọ̀ tààrà tí kò fi ètò ẹ̀kọ́ ìgbà ìkẹyìn kan kún un.
- source_word: ἤγγικεν
  choice: ti sún mọ́lé
  rationale: Ìṣe pípé Gíríìkì náà tọ́ka sí ohun tí ó ti súnmọ́ tí ó sì wà nítòsí báyìí; ‘ti sún mọ́lé’ pa ìṣe àti ipò yẹn mọ́.
- source_word: σωφρονήσατε
  choice: ẹ ní ìrònú tí ó yè kooro
  rationale: Ó sọ nípa ìdájọ́ ọkàn tó bójú mu, ìṣàkóso ara, àti ríronú kedere; gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá tí ó tẹnu mọ́ ìwà ọpọlọ náà.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi ìyọrísí ọgbọ́n hàn láàárín bí òpin ṣe súnmọ́ àti ìkìlọ̀ tó tẹ̀ lé e.
- source_word: νήψατε
  choice: kí ẹ sì wà lójúfò
  rationale: Níhìn-ín ọ̀rọ̀ náà jẹ́ àpèjúwe fún jíjẹ́ aláìṣàìfiyèsí, ní ìmúrasílẹ̀, àti ní ọpọlọ kedere, kì í ṣe àṣẹ pàtó nípa ọtí.
- source_word: εἰς προσευχάς
  choice: fún àdúrà
  rationale: εἰς fi ète hàn. Bí ó tilẹ̀ jẹ́ pé προσευχάς jẹ́ ọ̀pọ̀ nínú Gíríìkì, ‘àdúrà’ gẹ́gẹ́ bí orúkọ àìlónkà jẹ́ àdánidá jù ní Yorùbá, ó sì lè bo àwọn ìgbà àdúrà léraléra.
theological_decisions:
- issue: Agbára ọ̀rọ̀ nípa ìgbà ìkẹyìn nínú ‘òpin ohun gbogbo’
  choice: A pa á mọ́ gẹ́gẹ́ bí ìkéde tààrà pé òpin ohun gbogbo ti súnmọ́, láìsọ ètò àkókò rẹ̀ ní pàtó.
  alternative: Kí a túmọ̀ τέλος sí ‘èròngbà’ tàbí kí a mú ọ̀rọ̀ náà dà bí ohun tí ó ti ṣẹ tán pátápátá.
  rationale: Àyíká ọ̀rọ̀ náà so ìsúnmọ́ òpin pọ̀ mọ́ ìwà ìmúrasílẹ̀ àti àdúrà; ìtumọ̀ yìí pa ìkánjú àti àìdánilójú nípa àkókò pàtó mọ́ láìfi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Ìbáṣepọ̀ σωφρονήσατε àti νήψατε
  choice: A yà wọ́n sí ‘ẹ ní ìrònú tí ó yè kooro’ àti ‘ẹ wà lójúfò,’ kí ọkọọkan lè fi apá tirẹ̀ hàn.
  alternative: Kí a lo ọ̀rọ̀ méjì tí ó fẹ́rẹ̀ẹ́ túmọ̀ sí ohun kan, bí ‘ẹ ronú kedere, kí ẹ sì ní ọpọlọ kedere.’
  rationale: Àkọ́kọ́ tẹnu mọ́ ìdájọ́ ọkàn àti ìṣàkóso ara; èkejì tẹnu mọ́ ìṣọ́ra àti ìmúrasílẹ̀. Ìyàtọ̀ yìí kò sọ pé ọ̀rọ̀ náà jẹ́ òfin nípa fífi ọtí sílẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ’ fún àṣẹ ọ̀pọ̀ ènìyàn. Àmì ohùn wà níbi tí ó bá jẹ́ àdánidá, a sì yẹra fún ọ̀rọ̀ ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan.
