id: 1PE.4.17
reference: 1 Peter 4:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: yo
  text: Nítorí àkókò ti tó fún ìdájọ́ láti bẹ̀rẹ̀ láti inú ìdílé Ọlọ́run[a]; bí ó bá sì kọ́kọ́ bẹ̀rẹ̀ láti inú wa, kí ni yóò jẹ́ àbájáde[b] fún àwọn tí kò ṣègbọ́ràn[c] sí ìhìn rere Ọlọ́run?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ilé Ọlọ́run.” Ọ̀rọ̀ Gíríìkì οἶκος lè túmọ̀ sí “ilé” tàbí “ìdílé”; níhìn-ín ó ṣeé ṣe kó ń tọ́ka sí àwọn ènìyàn Ọlọ́run gẹ́gẹ́ bí ìdílé rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “òpin.” Ọ̀rọ̀ Gíríìkì τέλος lè túmọ̀ sí “òpin,” “àbájáde,” tàbí “èsì.”
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ “àwọn tí kò ṣègbọ́ràn” sí “àwọn tí wọ́n kọ̀ láti gbà gbọ́,” nítorí ọ̀rọ̀ Gíríìkì náà lè sọ àìgbọ́ràn àti àìgbàgbọ́ nígbà tí ènìyàn bá ń dáhùn sí ìhìn rere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ ohun tó ṣáájú gẹ́gẹ́ bí ìdí; “Nítorí” jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìbáṣepọ̀ yìí hàn.
- source_word: ὁ καιρός
  choice: àkókò ti tó
  rationale: καιρός ń tọ́ka sí àkókò tó yẹ tàbí tí a yàn, kì í ṣe ìṣírò àkókò lásán. Gbólóhùn “àkókò ti tó” sọ ìtumọ̀ náà ní Yorùbá àdánidá.
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: fún ìdájọ́ láti bẹ̀rẹ̀
  rationale: Ó pa ìtumọ̀ pé àkókò ti dé fún ìdájọ́ láti bẹ̀rẹ̀ mọ́, láì sọ ìdájọ́ náà di ìdálẹ́bi nìkan.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: láti inú agbo ilé Ọlọ́run
  rationale: “Agbo ilé” ń tọ́ka sí àwọn ènìyàn ilé Ọlọ́run, bí “láti inú wa” ṣe mú un dájú; “láti inú” tún pa ipa ἀπό mọ́.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: bí ó bá sì kọ́kọ́ bẹ̀rẹ̀ láti inú wa
  rationale: A tún ọ̀rọ̀-ìṣe “bẹ̀rẹ̀” tí ó wà nínú gbólóhùn àkọ́kọ́ sọ fún kíkún àti ìmọ̀ye Yorùbá; “sì” fi ìsopọ̀ δέ hàn.
- source_word: τέλος
  choice: àbájáde
  rationale: “Àbájáde” lè túmọ̀ sí ohun tí yóò ṣẹlẹ̀ ní ìparí, láì dín τέλος kù sí òpin àkókò lásán.
- source_word: ἀπειθούντων
  choice: àwọn tí kò ṣègbọ́ràn
  rationale: Ó pa agbára ìṣe participle náà mọ́, ó sì lè bo ìkọ̀ láti gba ìhìn rere gbọ́ gẹ́gẹ́ bí àìgbọ́ràn.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: sí ìhìn rere Ọlọ́run
  rationale: Dative náà jẹ́ ohun tí wọn kò ṣègbọ́ràn sí; “ìhìn rere Ọlọ́run” lè túmọ̀ sí ìhìn rere tó wá láti ọ̀dọ̀ Ọlọ́run tàbí tó jẹ́ tirẹ̀.
theological_decisions:
- issue: Ìrú ìdájọ́ (κρίμα) tó bẹ̀rẹ̀ láàárín àwọn ènìyàn Ọlọ́run
  choice: ìdájọ́
  alternative: ìdálẹ́bi; ìbáwí
  rationale: “Ìdájọ́” kò pinnu pé ìdálẹ́bi ikẹhin ni fún àwọn onígbàgbọ́, bẹ́ẹ̀ ni kò sọ ọ́ di ìbáwí lásán; ó pa ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ náà mọ́.
- issue: Ẹni tí “οἶκος τοῦ θεοῦ” ń tọ́ka sí
  choice: agbo ilé Ọlọ́run, ìyẹn àwọn ènìyàn rẹ̀
  alternative: ilé tàbí tẹ́ńpìlì Ọlọ́run
  rationale: Gbólóhùn tó tẹ̀ lé, “láti inú wa,” fi hàn pé àwùjọ àwọn ènìyàn Ọlọ́run ni a ń sọ̀rọ̀ nípa rẹ̀, kì í ṣe ilé kan.
- issue: Ìbáṣepọ̀ ἀπείθεια pẹ̀lú ìgbàgbọ́
  choice: kò ṣègbọ́ràn
  alternative: kọ̀ láti gbà gbọ́
  rationale: Ọ̀rọ̀ Gíríìkì lè ní ìtumọ̀ àìgbọ́ràn àti àìgbàgbọ́ ní ìdáhùn sí ìhìn rere; a fi ọ̀kan sínú ọrọ̀, a sì tọ́ka sí èkejì nínú àlàyé ẹsẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti bá èdè mu. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, ó sì pa ìtẹnumọ́ àti àìdánilójú tó wà nínú orísun Gíríìkì mọ́.
