id: 1PE.4.12
reference: 1 Peter 4:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: yo
  text: Ẹ̀yin olùfẹ́, ẹ má ṣe jẹ́ kí iná ìdánwò[a] tí ń ṣẹlẹ̀ láàárín yín láti dán yín wò yà yín lẹ́nu, bí ẹni pé ohun àjèjì kan ń ṣẹlẹ̀ sí yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìpọ́njú bí iná tí ń ṣẹlẹ̀ láàárín yín ... fún ìdánwò.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka ní tààrà sí jíjóná tàbí iná; ọ̀rọ̀ tí a tú sí “ìdánwò” sì tún lè túmọ̀ sí àdánwò, ìpọ́njú, tàbí—ní àwọn àyíká ọ̀rọ̀ mìíràn—ìdẹwò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ẹ̀yin olùfẹ́
  rationale: Ọ̀rọ̀ ìpè ní ọ̀pọ̀ ènìyàn ni, ó sì fi ìfẹ́ olùṣọ́-àgùntàn hàn. “Ẹ̀yin olùfẹ́” pa ìsopọ̀ rẹ̀ mọ́ pẹ̀lú èrò ἀγάπη láìfi “mi” tí kò sí nínú Gíríìkì kún un.
- source_word: ξενίζεσθε
  choice: ẹ má ṣe jẹ́ kí ... yà yín lẹ́nu
  rationale: Ìtumọ̀ ọ̀rọ̀ náà ni láti yà lẹ́nu tàbí láti ka ohun kan sí àjèjì. Ìtumọ̀ yìí jẹ́ Yorùbá àdánidá, ó sì tún jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú ξένου ní ìparí ẹsẹ náà hàn.
- source_word: πυρώσει
  choice: iná ìdánwò
  rationale: πύρωσις ń gbé àwòrán jíjóná tàbí iná jáde, ṣùgbọ́n ní àyíká ọ̀rọ̀ yìí ó ń tọ́ka sí ìpọ́njú líle tí ń dán àwọn onígbàgbọ́ wò. “Iná ìdánwò” pa àwòrán iná náà mọ́, ó sì ṣe kedere ní Yorùbá.
- source_word: ἐν ὑμῖν
  choice: láàárín yín
  rationale: Àwọn ọ̀rọ̀ náà lè túmọ̀ sí “nínú yín” tàbí “láàárín yín.” Nítorí pé gbogbo àwùjọ ni a ń bá sọ̀rọ̀, “láàárín yín” mú ìtumọ̀ àpapọ̀ náà jáde láìkọ ìrírí ẹnì kọ̀ọ̀kan sílẹ̀.
- source_word: πρὸς πειρασμόν
  choice: láti dán yín wò
  rationale: Ní àyíká ìjìyà yìí, πειρασμός ń tọ́ka sí ìdánwò tàbí fífi ìwà ẹni sí àdánwò, kì í ṣe fífi ènìyàn lọ́kàn sí ẹ̀ṣẹ̀. Ìtumọ̀ ọ̀rọ̀-ìṣe yìí ṣe ète gbólóhùn náà kedere.
- source_word: γινομένῃ
  choice: tí ń ṣẹlẹ̀
  rationale: Ó jẹ́ ọ̀rọ̀ aláìparí tó ń ṣàpèjúwe πυρώσει, ó sì tọ́ka sí ohun tó ń lọ lọ́wọ́. “Tí ń ṣẹlẹ̀” mú ìṣe tó ń bá a lọ náà jáde lọ́nà àdánidá.
- source_word: ὡς ξένου
  choice: bí ẹni pé ohun àjèjì kan
  rationale: ξένος lè túmọ̀ sí ohun àjèjì, ohun tí kò wọ́pọ̀, tàbí ohun láti òde. “Ohun àjèjì” pa ìṣeré-ọ̀rọ̀ tó wà pẹ̀lú ξενίζεσθε mọ́.
- source_word: συμβαίνοντος
  choice: ń ṣẹlẹ̀ sí yín
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ohun tó ń ṣẹlẹ̀ sí ẹnì kan. Ìtumọ̀ yìí jẹ́ kedere, ó sì bá àkójọpọ̀ ὡς mu.
theological_decisions:
- issue: Ìwà πειρασμός nínú àyíká ọ̀rọ̀
  choice: ìdánwò/fífi ènìyàn sí àdánwò
  alternative: ìdẹwò sí ẹ̀ṣẹ̀
  rationale: Àyíká ọ̀rọ̀ nípa ìjìyà àti inúnibíni fi hàn pé ọ̀rọ̀ náà ń tọ́ka sí ìpọ́njú tó ń dán ènìyàn wò, kì í ṣe ìfẹ́kúfẹ̀ẹ́ inú tó ń fà á sínú ẹ̀ṣẹ̀.
translation_notes:
  register: A lo Yorùbá boṣewa, ti òde òní, tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà pa àwòrán iná àti àtúnṣe èrò “àjèjì/yà lẹ́nu” inú Gíríìkì mọ́, ṣùgbọ́n ó ṣètò wọn lọ́nà tó rọrùn fún òǹkàwé Yorùbá.
