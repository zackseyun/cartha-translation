id: 1PE.4.18
reference: 1 Peter 4:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: yo
  text: Àti bí a bá fi ìṣòro gba olódodo là[a], níbo ni aláìbẹ̀rù Ọlọ́run àti ẹlẹ́ṣẹ̀ yóò fara hàn[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “bí a bá ń gba olódodo là pẹ̀lú ìṣòro,” tàbí “bí olódodo bá fẹ́rẹ̀ẹ́ má rí ìgbàlà.” Ohun tí ọ̀rọ̀ náà tẹnumọ́ ni ìṣòro líle tí olódodo ń la kọjá nígbà tí a ń gbà á là; kò pọn dandan pé ó ń sọ pé ìgbàlà fúnra rẹ̀ kò dájú.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “níbo ni a ó ti rí aláìbẹ̀rù Ọlọ́run àti ẹlẹ́ṣẹ̀?”
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: olódodo
  rationale: Ọ̀rọ̀ náà jẹ́ ajẹtífù tí a lò bí orúkọ, ó sì dúró fún ẹnì kan ní ọ̀nà àpẹẹrẹ. “Olódodo” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì pa ìṣọ̀kan ẹyọ kan mọ́.
- source_word: μόλις
  choice: bí ó bá ṣòro
  rationale: μόλις lè tọ́ka sí ohun tí ó ṣẹlẹ̀ pẹ̀lú ìṣòro tàbí tí ó fẹ́rẹ̀ẹ́ má ṣẹlẹ̀. Ìtumọ̀ yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì bá ọ̀rọ̀ nípa ìpọ́njú àti ìdájọ́ tó yí ẹsẹ náà ká mu láì sọ pé ìgbàlà fúnra rẹ̀ kò dájú.
- source_word: σῴζεται
  choice: kí a tó gba ... là
  rationale: Fáàbù náà wà ní ìrísí aláìṣe, ṣùgbọ́n Yorùbá sábà máa ń fi “gba ẹnì kan là” sọ ọ́ lọ́nà àdánidá. Àpẹẹrẹ “a” tí kò tọ́ka sí ẹnì kan pàtó kò fi olùgbàlà mìíràn kún ọ̀rọ̀ náà.
- source_word: ἀσεβής
  choice: ẹni tí kò bọ̀wọ̀ fún Ọlọ́run
  rationale: Èyí mú ìtumọ̀ àìní ìbẹ̀rù àti ọ̀wọ̀ sí Ọlọ́run jáde ní Yorùbá òde òní, ó sì yàtọ̀ kedere sí “ẹlẹ́ṣẹ̀.”
- source_word: ἁμαρτωλός
  choice: ẹlẹ́ṣẹ̀
  rationale: “Ẹlẹ́ṣẹ̀” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ìtumọ̀ ẹni tí ń dẹ́ṣẹ̀ mu.
- source_word: ποῦ
  choice: níbo
  rationale: Èyí ni ìtumọ̀ tààrà àti àdánidá fún ọ̀rọ̀ ìbéèrè nípa ibi.
- source_word: φανεῖται
  choice: yóò fara hàn
  rationale: “Fara hàn” pa ìtumọ̀ tààrà ti ‘farahàn’ mọ́, ó sì dá agbára ìbéèrè àsọyé náà sí.
theological_decisions:
- issue: Ìtumọ̀ μόλις σῴζεται
  choice: A sọ pé ó ṣòro kí a tó gba olódodo là, ní ìbámu pẹ̀lú àyíká ọ̀rọ̀ nípa ìpọ́njú àti ìdájọ́.
  alternative: A lè sọ pé olódodo kìkì ń rí ìgbàlà díẹ̀díẹ̀ tàbí pé kò dájú bóyá yóò rí i.
  rationale: Ìtumọ̀ náà pa líle àti ìṣòro tí ọ̀rọ̀ Gíríìkì ní mọ́, ṣùgbọ́n kò fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kan kún un pé ìgbàlà ìkẹyìn kò dájú.
- issue: Ẹyọ akọ tí ó dúró fún gbogbo irú ẹni bẹ́ẹ̀
  choice: A lo “olódodo” gẹ́gẹ́ bí ẹyọ kan tó dúró fún gbogbo ẹni tó bá jẹ́ olódodo.
  alternative: A lè sọ “àwọn olódodo” tàbí “ẹni olódodo.”
  rationale: Èyí pa ìrísí ẹyọ kan àti ọ̀nà òwe inú Gíríìkì mọ́, ó sì jẹ́ Yorùbá àdánidá.
- issue: Ìyàtọ̀ láàárín ἀσεβής àti ἁμαρτωλός
  choice: A túmọ̀ wọn lọ́tọ̀ sí “ẹni tí kò bọ̀wọ̀ fún Ọlọ́run” àti “ẹlẹ́ṣẹ̀.”
  alternative: A lè kó àwọn méjèèjì jọ sí ọ̀rọ̀ kan bí “ẹlẹ́ṣẹ̀.”
  rationale: Gíríìkì fi àpèjúwe méjì tó so pọ̀ hàn; pípa wọn mọ́ lọ́tọ̀ dá ìtẹnumọ́ àti ìtumọ̀ ọ̀kọ̀ọ̀kan sí.
translation_notes:
  register: A lo Yorùbá tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn àmì ohùn wà níbi tí wọ́n ti yẹ. Ọ̀rọ̀ náà pa ìrísí ìbéèrè àsọyé àti ìfọ̀rọ̀wérọ̀ bí òwe inú Gíríìkì mọ́, láì mú èdè di líle tàbí ti ẹ̀ka ìjọ kan.
