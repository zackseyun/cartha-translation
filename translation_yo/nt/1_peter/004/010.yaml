id: 1PE.4.10
reference: 1 Peter 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: yo
  text: Bí olúkúlùkù ti gba ẹ̀bùn kan, kí ó máa lò ó láti sin ara yín[a] gẹ́gẹ́ bí alábòójútó rere ti onírúurú oore-ọ̀fẹ́ Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “láàárín ara yín” tàbí “sí ara yín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: olúkúlùkù
  rationale: Ó pa ìtumọ̀ pínpín mọ́, níbi tí ọ̀rọ̀ náà ti ń tọ́ka sí ẹnì kọ̀ọ̀kan nínú àwùjọ.
- source_word: καθὼς ἔλαβεν
  choice: bí ... ti gba
  rationale: Ìtumọ̀ yìí sọ òtítọ́ pé ẹnì kọ̀ọ̀kan ti gba ẹ̀bùn, ó sì bá ìlànà ìgbani-nímọ̀ràn inú ẹsẹ náà mu ní Yorùbá àdánidá.
- source_word: χάρισμα
  choice: ẹ̀bùn kan
  rationale: “Ẹ̀bùn” pa fífẹ̀ ìtumọ̀ χάρισμα mọ́ láì fi kún un pé ó jẹ́ “ẹ̀bùn Ẹ̀mí”; “kan” bá ẹyọ ọ̀rọ̀ Gíríìkì mu, kò sì túmọ̀ sí pé ẹ̀bùn náà jẹ́ irú kan ṣoṣo.
- source_word: εἰς ἑαυτοὺς
  choice: fún ara yín
  rationale: Ó fi àwùjọ àwọn onígbàgbọ́ hàn gẹ́gẹ́ bí àwọn tí iṣẹ́ ìránṣẹ́ náà ń ṣe fún, ó sì pa àwọ̀ ìtumọ̀ reflexive plural mọ́. Àwọn ọ̀nà míì wà nínú àlàyé ìsàlẹ̀.
- source_word: αὐτὸ διακονοῦντες
  choice: ẹ máa fi í ṣe iṣẹ́ ìránṣẹ́
  rationale: Participle náà ní agbára ìgbani-nímọ̀ràn nínú àyíká yìí. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì mú kí “í” tọ́ka padà sí ẹ̀bùn náà.
- source_word: καλοὶ οἰκονόμοι
  choice: olùṣọ́jú rere
  rationale: “Olùṣọ́jú” ṣàfihàn ẹni tí a fi ohun ẹlòmíràn lé lọ́wọ́ láti bójú tó, pẹ̀lú ojúṣe ìjíhìn; “rere” pa καλοί mọ́ láì túmọ̀ rẹ̀ ní pàtó sí “olóòótọ́.”
- source_word: ποικίλης χάριτος θεοῦ
  choice: onírúurú oore-ọ̀fẹ́ Ọlọ́run
  rationale: “Onírúurú” ṣàfihàn ọ̀pọ̀lọpọ̀ ìrísí oore-ọ̀fẹ́, àti ìṣètò gbólóhùn náà jẹ́ ti Yorùbá àdánidá tí ó pa ìbáṣepọ̀ pẹ̀lú Ọlọ́run mọ́.
theological_decisions:
- issue: Bóyá a ó tú χάρισμα sí “ẹ̀bùn Ẹ̀mí” ní ìtumọ̀ tóóró
  choice: ẹ̀bùn
  alternative: ẹ̀bùn Ẹ̀mí; ẹ̀bùn oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ Gíríìkì náà fúnra rẹ̀ kò fi dandan mú ìtumọ̀ imọ̀-ẹ̀kọ́ tóóró “ẹ̀bùn Ẹ̀mí” wá. “Ẹ̀bùn” pa fífẹ̀ ọ̀rọ̀ náà mọ́, nígbà tí àyíká ṣe àfihàn pé ó jẹ́ ohun tí oore-ọ̀fẹ́ Ọlọ́run pèsè.
- issue: Bí a ṣe máa fi agbára àwùjọ εἰς ἑαυτούς hàn
  choice: fún ara yín
  alternative: láàárín ara yín; sí ara yín
  rationale: “Fún ara yín” fi àwọn ọmọ àwùjọ hàn gẹ́gẹ́ bí ẹni tí iṣẹ́ náà ń ṣe fún, ṣùgbọ́n a kò fi pamọ́ pé preposition náà lè gba ìtumọ̀ bí “láàárín” tàbí “sí”; a tọ́ka sí èyí nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá yẹ. “Iṣẹ́ ìránṣẹ́” yẹra fún ìtumọ̀ ipò ṣọ́ọ̀ṣì kan pàtó, “olùṣọ́jú” sì pa èrò pé a fi ohun kan lé ẹni lọ́wọ́ àti ojúṣe ìjíhìn mọ́.
