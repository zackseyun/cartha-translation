  source_fidelity: 'Ìtumọ̀ náà pa àwọn èrò pàtàkì Gíríìkì náà mọ́: ẹnì kọ̀ọ̀kan gba χάρισμα, a sì gbọdọ̀ lò ó nínú ìránṣẹ́ sí àwùjọ, gẹ́gẹ́ bí àwọn olùṣàkóso ohun tí Ọlọ́run fi lé wọn lọ́wọ́. Síbẹ̀, ìbámu ‘Bí olúkúlùkù ... ẹ máa’ yí padà láti ẹyọ sí ọ̀pọ̀ láìní dídán, ‘fi í ṣe iṣẹ́ ìránṣẹ́’ sì kéré síi ní àdánidá ju ọ̀nà ìṣe-taara lọ.'
  naturalness: ‘Kí olúkúlùkù máa lò ó láti sin ara yín’ jẹ́ Yorùbá òde òní tí ó rọrùn, ó sì jẹ́ kí ìbáṣepọ̀ ẹ̀bùn náà pẹ̀lú ìránṣẹ́ hàn gbangba. ‘Alábòójútó’ dára ju ‘olùṣọ́jú’ lọ níhìn-ín, nítorí olùṣọ́jú lè túmọ̀ sí supervisor ẹni, nígbà tí οἰκονόμος jẹ́ ẹni tí a fi ohun elòmíràn lé lọ́wọ́ láti ṣàkóso.
