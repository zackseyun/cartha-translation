id: 1PE.4.3
reference: 1 Peter 4:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: yo
  text: Nítorí àkókò tí ó ti kọjá ti tó fún yín láti ti ṣe ohun tí àwọn tí kì í ṣe Júù ń fẹ́—ẹ̀yin tí ẹ ti gbé ayé nínú àwọn ìwà àìnítìjú[a], ìfẹ́kúfẹ̀ẹ́, ìmutípara[b], àríyá oníwà pálapàla, àsè ọtí, àti àwọn ìbọ̀rìṣà tí kò bófin mu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ìwà wọ̀bìà”; ἀσελγείαις tẹnumọ́ ìwà àmujù tí kò ní ìtìjú.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn àsìkò ìmutípara”; ọ̀rọ̀ Gíríìkì οἰνοφλυγίαις wà ní ọ̀pọ̀, ó sì lè tọ́ka sí ìmutípara léraléra.
    reason: lexical_alternative
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ìbọ̀rìṣà tí a kà léèwọ̀”; ἀθεμίτοις túmọ̀ sí ohun tí kò bófin mu tàbí tí a kò gbà láàyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: Nítorí àkókò tí ó ti kọjá ti tó
  rationale: Ó pa ìtumọ̀ ἀρκετός (‘tó’) àti γάρ (‘nítorí’) mọ́, ó sì sọ ọ́ ní Yorùbá àdánidá.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: ohun tí àwọn tí kì í ṣe Júù ń fẹ́
  rationale: Ní àyíká ọ̀rọ̀ yìí, ἐθνῶν ń tọ́ka sí àwọn tí kì í ṣe Júù; gbólóhùn yìí yàgò fún ìtumọ̀ òṣèlú ‘àwọn orílẹ̀-èdè’ àti àìyedè tí ‘ìfẹ́’ lè dá sílẹ̀.
- source_word: κατειργάσθαι
  choice: láti ti ṣe
  rationale: ‘Ti’ ń ṣàfihàn pé iṣẹ́ náà ti ṣẹlẹ̀ tẹ́lẹ̀, gẹ́gẹ́ bí perfect infinitive náà ṣe tọ́ka sí.
- source_word: πεπορευμένους
  choice: nígbà tí ẹ̀yin ń gbé ìgbé ayé
  rationale: Ó tú àkàwé ‘rìn’ sí Yorùbá àdánidá fún ìhùwàsí àti ọ̀nà ìgbé ayé, láìyí ipa ìwà rere rẹ̀ padà.
- source_word: ἐν ἀσελγείαις
  choice: nínú àwọn ìwà àìnítìjú
  rationale: Ó mú ìwà àìníjàánu tí kò ní ìtìjú jáde, ó sì fi ọ̀pọ̀ ìṣe tí plural Gíríìkì lè tọ́ka sí hàn.
- source_word: ἐπιθυμίαις
  choice: ìfẹ́kúfẹ̀ẹ́
  rationale: Nínú àkójọ ẹ̀ṣẹ̀ yìí, ọ̀rọ̀ náà túmọ̀ sí àwọn ìfẹ́ búburú tàbí ìfẹ́kúfẹ̀ẹ́, kì í ṣe gbogbo ìfẹ́ lásán.
- source_word: οἰνοφλυγίαις
  choice: ìmutípara
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún àmujù ọtí àti ipò ọ̀mùtí.
- source_word: κώμοις
  choice: àríyá oníwà pálapàla
  rationale: Ó sọ irú àríyá aláriwo tí ó ní àmujù àti ìwà búburú, kì í ṣe àríyá gbogbo.
- source_word: πότοις
  choice: àsè ọtí
  rationale: Ó tọ́ka sí ìpéjọpọ̀ tàbí àsè tí mímu ọtí jẹ́ kókó.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: àwọn ìbọ̀rìṣà tí kò bófin mu
  rationale: Ó pa agbára ìwà-òfin ἀθέμιτος mọ́ (‘tí a kò gbà láàyè’), ó sì fi plural àwọn ìṣe ìbọ̀rìṣà hàn.
theological_decisions:
- issue: Ìtumọ̀ ἐθνῶν
  choice: àwọn tí kì í ṣe Júù
  alternative: àwọn Kèfèrí; àwọn orílẹ̀-èdè
  rationale: Ọ̀rọ̀ náà ń ṣe ìyàtọ̀ láàárín àwọn Júù àti àwọn tí kì í ṣe Júù ní àyíká yìí. Ìtumọ̀ tí a yàn ṣe kedere láìfi àbùkù kún un tàbí sọ ọ́ di ọ̀rọ̀ nípa àwọn orílẹ̀-èdè.
- issue: Agbára ìdálẹ́bi inú ἀθεμίτοις εἰδωλολατρίαις
  choice: àwọn ìbọ̀rìṣà tí kò bófin mu
  alternative: àwọn ìbọ̀rìṣà ìríra; àwọn ìbọ̀rìṣà tí a kà léèwọ̀
  rationale: Ìtumọ̀ yìí fi hàn pé àwọn ìṣe náà lòdì sí ohun tí ó tọ́ tàbí tí a gbà láàyè, láìfi ìmọ̀lára ìríra tí kò ṣe pàtó nínú Gíríìkì kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà ní iyì ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní. A lo ‘ẹ̀yin’ láti fi hàn pé ẹni púpọ̀ ni participle náà ń bá sọ̀rọ̀. A kò fipá samisi ọ̀pọ̀ lórí gbogbo orúkọ àìlóǹkà Yorùbá, ṣùgbọ́n a lo ‘àwọn’ níbi tí ó ti ń ṣèrànwọ́ láti pa ìtumọ̀ àwọn plural Gíríìkì mọ́.
