id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: yo
  text: Nítorí ìdí èyí ni a tún kéde ìhìn rere fún àwọn òkú[a], kí, bí a tilẹ̀ ṣe dá wọn lẹ́jọ́ gẹ́gẹ́ bí àwọn ènìyàn nípa ti ara[b], wọn lè wà láàyè gẹ́gẹ́ bí Ọlọ́run nípa ti ẹ̀mí[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Àwọn òkú’ lè tọ́ka sí àwọn tó ti kú nígbà ìkéde náà, tàbí sí àwọn tí wọ́n gbọ́ ìhìn rere nígbà ayé wọn tí wọ́n sì ti kú nígbà tí Pétérù ń kọ̀wé. Àwọn kan tún lóye rẹ̀ sí àwọn òkú nípa tẹ̀mí. Gíríìkì kò sọ èyí ní pàtó.
    reason: interpretive_ambiguity
  - marker: b
    text: Tàbí, ‘gẹ́gẹ́ bí ìlànà ènìyàn nípa ti ara.’ Gíríìkì ní ‘gẹ́gẹ́ bí àwọn ènìyàn,’ ní ìtakora pẹ̀lú ‘gẹ́gẹ́ bí Ọlọ́run.’
    reason: lexical_alternative
  - marker: c
    text: Tàbí, ‘nínú ẹ̀mí.’ Gbólóhùn náà lè tọ́ka sí ipò ìwàláàyè ẹ̀mí ní ìtakora pẹ̀lú ti ara; àwọn mìíràn sì lóye rẹ̀ gẹ́gẹ́ bí ìyè nípasẹ̀ Ẹ̀mí Mímọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: Nítorí èyí ni
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá láti fi ìdí ohun tí a ṣẹ̀ṣẹ̀ sọ múlẹ̀, ó sì pa agbára ìtumọ̀ ‘nítorí ìdí yìí’ mọ́.
- source_word: νεκροῖς
  choice: fún àwọn òkú
  rationale: Àpèjúwe ọ̀pọ̀ tí a lò gẹ́gẹ́ bí orúkọ ni; ‘àwọn òkú’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere láì pinnu ẹni tí àwọn òkú náà jẹ́.
- source_word: εὐηγγελίσθη
  choice: a ṣe kéde ìhìn rere
  rationale: Ó pa ohùn àìṣe-taara ti Gíríìkì àti èrò ìkéde ìhìn rere mọ́, láì fi ẹni tó kéde rẹ̀ hàn.
- source_word: ἵνα
  choice: kí ... wọn lè
  rationale: Ó fi ète tàbí àbájáde tí gbólóhùn abẹ́lé Gíríìkì ń tọ́ka sí hàn ní Yorùbá àdánidá.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: bí a tilẹ̀ ṣe dá wọn lẹ́jọ́ ... wọn lè wà láàyè
  rationale: Ìṣètò ‘bí ... tilẹ̀ ...’ àti ‘wọn lè’ mú ìtakora μὲν...δὲ jáde ní Yorùbá, ó sì pa ìtumọ̀ àìṣe-taara ti ‘dá lẹ́jọ́’ mọ́ bí ó ti lè ṣe tó ní èdè náà.
- source_word: κατὰ ἀνθρώπους
  choice: gẹ́gẹ́ bí àwọn ènìyàn
  rationale: Ó tẹ̀ lé ọ̀nà tí Gíríìkì gbà fi ènìyàn ṣe ìtakora pẹ̀lú Ọlọ́run, láì fi kún un pé ó dájú pé ìlànà ènìyàn tàbí ìdájọ́ ènìyàn nìkan ni.
- source_word: σαρκὶ
  choice: nípa ti ara
  rationale: Ní àyíká yìí, σάρξ ń tọ́ka sí ipò ìwàláàyè ènìyàn nínú ara, kì í ṣe dandan ‘ìwà ẹ̀ṣẹ̀.’ ‘Nípa ti ara’ jẹ́ èdè Yorùbá tó mọ́gbọ́n dání fún ìtakora rẹ̀ pẹ̀lú ẹ̀mí.
- source_word: κατὰ θεὸν
  choice: gẹ́gẹ́ bí Ọlọ́run
  rationale: Ó pa ìfarajọ tó mọ̀ọ́mọ̀ wà láàárín κατὰ ἀνθρώπους àti κατὰ θεὸν mọ́, láì sọ bóyá ìlànà, ojú ìwòye tàbí ìfẹ́ Ọlọ́run ni pàtó.
- source_word: πνεύματι
  choice: nípa ti ẹ̀mí
  rationale: Ó bá ‘nípa ti ara’ dọ́gba, ó sì jẹ́ kí ọ̀rọ̀ náà ṣí sí ìtumọ̀ ipò ìwàláàyè ẹ̀mí; kò fi tipátipá sọ pé Ẹ̀mí Mímọ́ ni.
theological_decisions:
- issue: Ta ni ‘àwọn òkú’ ń tọ́ka sí?
  choice: A túmọ̀ ọ́ ní ṣókí sí ‘àwọn òkú,’ láì sọ bóyá wọ́n ti kú nígbà tí a kéde ìhìn rere fún wọn.
  alternative: Àwọn tí wọ́n wà láàyè nígbà tí wọ́n gbọ́ ìhìn rere ṣùgbọ́n tí wọ́n ti kú báyìí; àwọn òkú nípa tẹ̀mí; tàbí àwọn òkú tí a so mọ́ ìkéde Kristi nínú 3:19.
  rationale: Ọ̀rọ̀ Gíríìkì kò dá ìdánimọ̀ wọn lójú nínú ẹsẹ yìí; ìtumọ̀ náà kò gbọ́dọ̀ yanjú àríyànjiyàn ẹ̀kọ́ ìgbàgbọ́ tí ẹsẹ náà kò yanjú.
- issue: Ìtumọ̀ ìtakora ‘dá lẹ́jọ́ ... nípa ti ara’ àti ‘wà láàyè ... nípa ti ẹ̀mí’
  choice: A pa ìtakora náà mọ́ láì ṣàlàyé irú ìdájọ́ tàbí ìwàláàyè náà ju ohun tí ọ̀rọ̀ sọ lọ.
  alternative: Ìdájọ́ láti ọ̀dọ̀ ènìyàn; ikú ara tó dé bá gbogbo ènìyàn; ìdájọ́ Ọlọ́run nínú ipò ti ara; tàbí ìyè nípasẹ̀ Ẹ̀mí Mímọ́.
  rationale: Gbólóhùn Gíríìkì lè gba àwọn ìtumọ̀ tó sún mọ́ra wọ̀nyí. Àyípadà gbọ́dọ̀ pa ìfara-ẹni-gbẹ́kẹ̀lé ẹ̀kọ́ ìgbàgbọ́ mọ́, kó má ṣe fi èrò kan lé e lórí.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀ tó lọ́lá, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo ‘kéde ìhìn rere’ dípò ọ̀rọ̀ ṣọ́ọ̀ṣì tó lè dín ìtumọ̀ εὐαγγελίζω kù. A tún lo ‘nípa ti ara / nípa ti ẹ̀mí’ láti mú ìfarajọ Gíríìkì hàn ní ọ̀nà Yorùbá àdánidá.
