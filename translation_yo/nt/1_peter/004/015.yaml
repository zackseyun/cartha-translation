id: 1PE.4.15
reference: 1 Peter 4:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: yo
  text: Nítorí, kí ẹnikẹ́ni nínú yín má ṣe jìyà bí apànìyàn, tàbí olè, tàbí ẹni tó ń ṣe ibi, tàbí ẹni tó ń dá sí ọ̀ràn àwọn ẹlòmíràn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí kì í fi ọ̀ràn àwọn ẹlòmíràn sílẹ̀”; ní ti gidi, ọ̀rọ̀ náà lè túmọ̀ sí “ẹni tó ń bojú tó ọ̀ràn ẹlòmíràn,” ìyẹn, ẹni tó ń dá sí ohun tí kì í ṣe tirẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ
  choice: Nítorí náà, ... má ṣe
  rationale: γάρ ń so ẹsẹ̀ yìí mọ́ àyíká ọ̀rọ̀ rẹ̀ gẹ́gẹ́ bí àlàyé, nígbà tí μὴ pẹ̀lú πασχέτω jẹ́ ìfòfin-de; ‘Nítorí náà’ àti ‘má ṣe’ mú ipa méjèèjì jáde ní Yorùbá àdánidá.
- source_word: τις ὑμῶν
  choice: ẹnikẹ́ni nínú yín
  rationale: Èyí pa ìtumọ̀ ẹnì kọ̀ọ̀kan nínú ẹgbẹ́ mọ́; ìfòfin-de ‘má ṣe’ ló mú kí ó túmọ̀ sí pé kò gbọ́dọ̀ sí ẹnikẹ́ni nínú wọn.
- source_word: πασχέτω
  choice: kí ... má ṣe jìyà
  rationale: πάσχω túmọ̀ sí jíjìyà ní gbogbogbòò; a kò fi ‘ìjìyà ẹ̀ṣẹ̀’ kún un, nítorí Gíríìkì kò sọ bẹ́ẹ̀ ní tààrà.
- source_word: ὡς
  choice: bí
  rationale: ‘Bí’ fi ipò tàbí ìdí tí ẹnì kan fi ń jìyà hàn ní kedere.
- source_word: φονεύς
  choice: apànìyàn
  rationale: Ọ̀rọ̀ Yorùbá yìí tọ́ka sí ẹni tó pa ènìyàn lọ́nà ìwà ọ̀daràn, kì í ṣe ẹni tó kan ṣekúpa ní gbogbogbòò.
- source_word: κλέπτης
  choice: olè
  rationale: ‘Olè’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ẹni tó ń jalè.
- source_word: κακοποιός
  choice: aṣebi
  rationale: ‘Aṣebi’ jẹ́ ọ̀rọ̀ gbòòrò fún ẹni tó ń ṣe ibi, ó sì pa ìró ìwà-bíburú inú Gíríìkì mọ́ láì sọ ọ́ di ọ̀rọ̀ òfin nìkan.
- source_word: ἀλλοτριεπίσκοπος
  choice: ẹni tó ń dá sí ọ̀ràn àwọn ẹlòmíràn
  rationale: Ọ̀rọ̀ àràọ̀tọ̀ yìí ní èrò ‘ẹni tó ń bojú tó ohun ti ẹlòmíràn’; ní àyíká àkójọ ìwà búburú, ó ṣeé lóye jù lọ gẹ́gẹ́ bí dídá sí ọ̀ràn tí kì í ṣe ti ẹni náà.
theological_decisions:
- issue: Ìtumọ̀ ἀλλοτριεπίσκοπος
  choice: ẹni tó ń dá sí ọ̀ràn àwọn ẹlòmíràn
  alternative: aláṣebojútó ọ̀ràn ẹlòmíràn; ẹni aláìgbọ́wọ́ sí ọ̀ràn ara rẹ̀
  rationale: Ọ̀rọ̀ náà ṣọ̀wọ́n, ìtumọ̀ rẹ̀ kò sì dájú pátápátá. Àṣàyàn yìí bá àkójọ àwọn ìwà tí ó yẹ kí a má jìyà nítorí wọn mu, láì fi ipò olórí ìjọ sínú apá -ἐπίσκοπος.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó níyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá èdè. Gbolohun náà pa ìfòfin-de, ìsopọ̀ pẹ̀lú àyíká, àti àìdájú díẹ̀ tó wà nínú ἀλλοτριεπίσκοπος mọ́.
