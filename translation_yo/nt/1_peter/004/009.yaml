lexical_decisions:
- source_word: φιλόξενοι
  choice: Ẹ máa ṣe àlejò
  rationale: Ọ̀rọ̀ náà jẹ́ ajẹtífù ní Gíríìkì, ṣùgbọ́n ó ní agbára àṣẹ nínú àyíká yìí. ‘Ẹ máa ṣe àlejò’ sọ ìṣírí náà ní Yorùbá àdánidá, ó sì tọ́ka sí gbígba àti títọ́jú àlejò.
- source_word: εἰς ἀλλήλους
  choice: sí ara yín
  rationale: Ó pa ìtumọ̀ ìṣe láàárín àwọn ọmọ ìjọ mọ́, pé kí olúkúlùkù ṣe bẹ́ẹ̀ sí ẹnì kejì.
- source_word: ἄνευ
  choice: láìsí
  rationale: Ó fi hàn pé ìkùnsínú kò gbọdọ̀ bá ìṣe àlejò náà lọ.
- source_word: γογγυσμοῦ
  choice: ìkùnsínú
  rationale: ‘Ìkùnsínú’ mú èrò ẹ̀dùn tàbí àròyé tí a ń sọ lábẹ́nu jáde, ó sì bá àyíká ìbágbépọ̀ mu. ‘Àròyé’ jẹ́ ọ̀nà mìíràn tí ó gbooro sí i.
