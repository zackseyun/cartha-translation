id: 1PE.4.14
reference: 1 Peter 4:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: yo
  text: Bí wọ́n bá ń gàn yín nítorí orúkọ Mèsáyà[a], alábùkún-fún ni yín, nítorí Ẹ̀mí ti ògo àti ti Ọlọ́run[b] ń sinmi lé yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gíríìkì ní “Kristi”; “Mèsáyà” ni a lò níbí nítorí Χριστός jẹ́ oyè.
    reason: lexical_alternative
  - marker: b
    text: Ó tún lè jẹ́, “Ẹ̀mí Ọlọ́run ológo”; tàbí, “Ẹ̀mí ògo, ìyẹn ni Ẹ̀mí Ọlọ́run.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: wọ́n bá ń gàn yín
  rationale: Ọ̀rọ̀ yìí fi hàn pé àwọn ẹlòmíràn ń sọ̀rọ̀ ẹ̀gàn sí wọn, tí wọ́n sì ń dójú tì wọ́n. “Ń gàn yín” jẹ́ Yorùbá òde òní tí ó ṣe kedere, ó sì pa ìtumọ̀ ìtìjú láwùjọ mọ́.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: nítorí orúkọ Mèsáyà
  rationale: Nínú àyíká yìí, gbólóhùn náà tọ́ka sí ẹ̀gàn tí ó dé bá wọn nítorí ìbáṣepọ̀ wọn pẹ̀lú ẹni tí orúkọ náà dúró fún. “Nítorí orúkọ” jẹ́ adayeba ní Yorùbá, ó sì pa ìtọ́kasí sí orúkọ mọ́.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí, kì í ṣe gẹ́gẹ́ bí orúkọ lásán; “Mèsáyà” mú agbára oyè náà jáde.
- source_word: μακάριοι
  choice: alábùkún-fún ni yín
  rationale: Èyí pa ìtumọ̀ ìbùkún láti ọ̀dọ̀ Ọlọ́run mọ́, dípò kí ó sọ̀rọ̀ nípa ìmọ̀lára ayọ̀ lásán.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Ẹ̀mí ògo àti ti Ọlọ́run
  rationale: Ìtumọ̀ yìí pa àwọn àpèjúwe méjèèjì—“ti ògo” àti “ti Ọlọ́run”—mọ́, láì pinnu bóyá wọ́n dọ́gba tàbí èkejì ń ṣàlàyé èkíní.
- source_word: δόξης
  choice: ògo
  rationale: “Ògo” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù lọ fún ìtumọ̀ yìí, pàápàá nípa ọlá àti wíwà Ọlọ́run.
- source_word: ἀναπαύεται
  choice: ń sinmi lé yín
  rationale: Ó túmọ̀ sí pé Ẹ̀mí náà ń sinmi tàbí ń bà lé wọn; gbólóhùn yìí tún pa ìró èdè àwọn àsọtẹ́lẹ̀ nípa Ẹ̀mí tí ń sinmi lé ènìyàn mọ́.
theological_decisions:
- issue: Bí a ṣe máa lóye τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Ẹ̀mí ògo àti ti Ọlọ́run
  alternative: Ẹ̀mí Ọlọ́run ológo; tàbí, Ẹ̀mí ògo, èyíinì ni Ẹ̀mí Ọlọ́run
  rationale: Èdè Gíríìkì lè fi àwọn ọ̀rọ̀ méjèèjì ṣàpèjúwe Ẹ̀mí náà ní ìpele kan náà, tàbí kí “ti Ọlọ́run” jẹ́ àlàyé sí “ti ògo.” Ọ̀rọ̀ inú ẹsẹ náà kò yan ọ̀kan ní pàtó, nítorí náà ìtumọ̀ pàtàkì kò yanjú àìdánilójú náà ní ìkọ̀kọ̀.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá bá èdè mu. Ìforúkọsílẹ̀ náà ní ọlá, ó ṣe kedere fún òǹkàwé lásán, kò sì lo ọ̀rọ̀ ìjọ kan pàtó.
