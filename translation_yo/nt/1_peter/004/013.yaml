id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: yo
  text: Ṣùgbọ́n níwọ̀n bí ẹ ṣe ń kópa nínú àwọn ìjìyà Mèsáyà[a], ẹ máa yọ̀, kí ẹ lè tún yọ̀ ní ayọ̀ ńlá nígbà ìṣípayá[b] ògo rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi.” Χριστός jẹ́ oyè tí ó túmọ̀ sí ẹni tí a fi òróró yàn.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “nígbà tí a bá ṣí ògo rẹ̀ payá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὸ
  choice: níwọ̀n bí
  rationale: Ó fi ìtumọ̀ ìwọ̀n tàbí bí ohun náà ṣe pọ̀ hàn, kì í ṣe kìkì ‘nígbà tí’ tàbí ‘bí’.
- source_word: κοινωνεῖτε
  choice: ẹ ti ń ṣe alábápín nínú
  rationale: Ó pa èrò ìkópa nínú ìjìyà mọ́, dípò àánú tàbí ìbákẹ́dùn lásán.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: nínú àwọn ìjìyà Mèsáyà
  rationale: Ìtumọ̀ náà pa ìbáṣepọ̀ genitive àti ọ̀pọ̀ ‘ìjìyà’ mọ́ láì ṣàlàyé irú ìkópa náà ju ohun tí Gíríìkì sọ lọ.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè ẹni àmì-òróró níbí; ‘Mèsáyà’ pa ìtumọ̀ oyè àti àyíká Júù rẹ̀ mọ́.
- source_word: χαίρετε
  choice: ẹ máa yọ̀
  rationale: Àṣẹ ìsinsìnyí náà ń pe fún ayọ̀ tí ó ń bá a lọ; ọ̀rọ̀ yìí sì jẹ́ ti Yorùbá òde òní tí ó ṣe kedere.
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ó fi ète tàbí àbájáde gbolohun náà hàn ní Yorùbá àdánidá.
- source_word: ἀποκαλύψει
  choice: ìṣípayá
  rationale: Ó pa àpẹẹrẹ orúkọ Gíríìkì àti èrò ìfihàn ohun tí ó ti farapamọ́ mọ́.
- source_word: δόξης αὐτοῦ
  choice: ògo rẹ̀
  rationale: Ó túmọ̀ ìní náà ní ṣókí, láì fi ẹni tí ‘rẹ̀’ ń tọ́ka sí hàn ju bí orísun ṣe ṣe lọ.
- source_word: χαρῆτε
  choice: ẹ sì lè yọ̀
  rationale: Ó tún gbé ìsopọ̀ ọ̀rọ̀ pẹ̀lú χαίρετε jáde, ó sì fi καὶ hàn nípasẹ̀ ‘sì’.
- source_word: ἀγαλλιώμενοι
  choice: pẹ̀lú ayọ̀ ńlá
  rationale: Ó fi ayọ̀ tí ó ga, tí ó sì kún fún ìdùnnú hàn lọ́nà àdánidá ju participle líle kan lọ ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ọ̀rọ̀ náà ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí. ‘Mèsáyà’ mú ìtumọ̀ ẹni àmì-òróró jáde, ṣùgbọ́n àṣàyàn ‘Kristi’ wà nínú àlàyé ìsàlẹ̀.
- issue: Irú ìkópa nínú ‘àwọn ìjìyà Mèsáyà’
  choice: ṣe alábápín nínú àwọn ìjìyà Mèsáyà
  alternative: jìyà nítorí Mèsáyà
  rationale: A pa ọ̀rọ̀ ìkópa Gíríìkì mọ́, láì pinnu nínú ẹsẹ̀ náà bóyá ó túmọ̀ sí ìṣọ̀kan pẹ̀lú rẹ̀, ìjìyà nítorí rẹ̀, tàbí ìbáṣepọ̀ mìíràn pẹ̀lú ìjìyà rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. ‘Ẹ’ fi ọ̀pọ̀ ẹni tí a ń bá sọ̀rọ̀ hàn. ‘Ẹ máa yọ̀’ mú ipa àṣẹ ìsinsìnyí tí ó ń bá a lọ jáde, ‘ayọ̀ ńlá’ sì mú agbára ἀγαλλιώμενοι hàn lọ́nà tí òǹkàwé Yorùbá lè lóye ní rọrùn.
