  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: yo
  text: Nítorí náà, níwọ̀n ìgbà tí Mèsáyà[a] ti jìyà ní ti ara[b], ẹ̀yin náà, ẹ fi èrò inú kan náà hámọ́ra, nítorí ẹni tí ó ti jìyà ní ti ara ti jáwọ́ nínú ẹ̀ṣẹ̀[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí “Kristi” fún “Mèsáyà” (Gíríìkì: Christos). A pa ìtumọ̀ rẹ̀ gẹ́gẹ́ bí oyè mọ́ níbí.'
    reason: lexical_alternative
  - marker: b
    text: “Ní ti ara” ni a lò láti túmọ̀ Gíríìkì sarx níbí; ó ń tọ́ka sí ìwàláàyè ènìyàn nínú ara, kì í sì í ṣe dandan pé ó túmọ̀ sí “ìwà ẹlẹ́ṣẹ̀.”
    reason: lexical_alternative
  - marker: c
    text: A ń jiyàn nípa gbólóhùn náà, “ẹni tí ó ti jìyà ní ti ara ti jáwọ́ nínú ẹ̀ṣẹ̀.” Ó lè tọ́ka pàtó sí Mèsáyà, sí àwọn onígbàgbọ́ tí wọ́n ń ṣàjọpín nínú àpẹẹrẹ rẹ̀, tàbí sí ìlànà gbogbogbò kan nípa yíyapa pátápátá kúrò nínú ẹ̀ṣẹ̀.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: A mú ìtumọ̀ oyè Χριστός jáde gẹ́gẹ́ bí “Mèsáyà,” dípò kí a fi ọ̀rọ̀ ìbílẹ̀ “Kristi” nìkan sí i. Ìṣètò genitive pẹ̀lú participle ni a túmọ̀ sí “níwọ̀n ìgbà tí Mèsáyà ti jìyà.”
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó fi hàn pé ọ̀rọ̀ yìí jẹ́ àbájáde tàbí ìpinnu tí ó jáde láti inú ọ̀rọ̀ tó ṣáájú.
- source_word: παθόντος
  choice: ti jìyà
  rationale: Aorist participle náà ni a sọ ní Yorùbá àdánidá gẹ́gẹ́ bí gbólóhùn tí “níwọ̀n ìgbà tí” ṣáájú, láìsọ agbára àkókò àti ìdí rẹ̀ nù.
- source_word: σαρκὶ
  choice: nípa ti ara
  rationale: Ó tọ́ka sí ìwàláàyè àti ìjìyà ènìyàn nínú ara. Yíyan ọ̀rọ̀ yìí kò fi “ìwà ẹlẹ́ṣẹ̀” kún ohun tí σάρξ túmọ̀ sí níbí.
- source_word: ἔννοιαν
  choice: èrò inú
  rationale: Ó mú èrò, ìpinnu, tàbí ìṣarasíhùwà inú jáde ní Yorùbá tí ó ṣe kedere, ó sì bá àṣẹ tó tẹ̀ lé e mu.
- source_word: ὁπλίσασθε
  choice: ẹ fi … di ara yín ní ìhámọ́ra
  rationale: 'Ó pa àwòrán ológun àti agbára middle imperative mọ́: àwọn olùgbọ́ ni kí wọ́n fi èrò náà múra ara wọn bí ẹni tó wọ ìhámọ́ra.'
- source_word: ὅτι
  choice: nítorí
  rationale: Ó ṣàlàyé ìdí fún àṣẹ náà ní ọ̀nà tí ó ṣe kedere ní Yorùbá òde òní.
- source_word: ὁ παθὼν
  choice: ẹni tí ó ti jìyà
  rationale: Ó pa ìsọ gbogbogbò ti substantival participle mọ́ láìdá ẹni tí gbólóhùn náà ń tọ́ka sí mú.
- source_word: πέπαυται
  choice: ti jáwọ́
  rationale: 'Ó fi ipò tí ó ti ṣẹlẹ̀ tí ó sì ń bá a lọ hàn: ẹni náà ti dé ibi ìdádúró ní ìbáṣepọ̀ rẹ̀ pẹ̀lú ẹ̀ṣẹ̀.'
- source_word: ἁμαρτίας
  choice: nínú ẹ̀ṣẹ̀
  rationale: Pẹ̀lú “jáwọ́,” ọ̀rọ̀ yìí sọ ìyapa kúrò lọ́dọ̀ ẹ̀ṣẹ̀ ní Yorùbá àdánidá. A pa singular náà mọ́ gẹ́gẹ́ bí ẹ̀ṣẹ̀ ní ti agbára, ààyè ìgbé ayé, tàbí ìṣe.
theological_decisions:
- issue: Ẹni tí gbólóhùn “ẹni tí ó ti jìyà nípa ti ara ti jáwọ́ nínú ẹ̀ṣẹ̀” ń tọ́ka sí àti bí a ṣe gbọdọ̀ lóye rẹ̀
  choice: A pa gbólóhùn náà mọ́ ní ọ̀nà gbígbòòrò rẹ̀, láìsọ pé Mèsáyà nìkan, àwọn onígbàgbọ́, tàbí òfin gbogbogbò kan ṣoṣo ni ó ń tọ́ka sí.
  alternative: A lè lóye rẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ nípa Mèsáyà pàtó, nípa àwọn onígbàgbọ́ tí wọ́n tẹ̀ lé àpẹẹrẹ ìjìyà rẹ̀, tàbí gẹ́gẹ́ bí òwe gbogbogbò nípa bí ìjìyà ṣe ń sàmì sí yíyapa pátápátá kúrò nínú ẹ̀ṣẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì náà kúkúrú, ìtumọ̀ rẹ̀ sì jẹ́ ohun tí a ń jíròrò. Ìtumọ̀ Yorùbá kò fi àlàyé tí kò sí nínú ọ̀rọ̀ kún un, ó sì pa ìfàsẹ́yìn ẹ̀kọ́ ìgbàgbọ́ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé lásán. A pa àwòrán ìhámọ́ra àti àtúnlò “nípa ti ara” mọ́ láti ṣètìlẹ́yìn fún ìṣọ̀kan ọ̀rọ̀ náà.
