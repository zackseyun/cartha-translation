id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: yo
  text: Bí ẹnikẹ́ni bá ń sọ̀rọ̀, kí ó sọ̀rọ̀ gẹ́gẹ́ bí ẹni tí ń sọ ọ̀rọ̀ Ọlọ́run[a]; bí ẹnikẹ́ni bá ń ṣe iṣẹ́ ìránṣẹ́, kí ó ṣe é láti inú agbára tí Ọlọ́run ń pèsè[e], kí a lè yin Ọlọ́run lógo nínú ohun gbogbo nípasẹ̀ Jésù Mèsáyà[b], ẹni tí ògo àti agbára ìṣàkóso jẹ́ tirẹ̀ láéláé àti láéláé[d][c]. Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gẹ́gẹ́ bí ẹni tí ń sọ àwọn àsọjáde Ọlọ́run.” Ọ̀rọ̀ Gíríìkì λόγια ń tọ́ka sí àwọn ọ̀rọ̀ ìkéde tàbí àsọjáde àtọ̀runwá.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “nípasẹ̀ Jésù Kristi”; a túmọ̀ Χριστός sí “Mèsáyà” nítorí pé oyè ni ó jẹ́ níbí.
    reason: lexical_alternative
  - marker: c
    text: “Ẹni tí” ṣeé ṣe jù lọ láti tọ́ka sí Jésù Mèsáyà, ẹni tí ó sún mọ́ ọrọ̀ náà jù lọ; síbẹ̀, àwọn kan lóye orin ìyìn náà pé ó tọ́ka sí Ọlọ́run Baba nítorí gbólóhùn tó ṣáájú.
    reason: alternative_reading
  - marker: d
    text: Ní tààrà, “sí àwọn ìgbà ayé àwọn ìgbà ayé.”
    reason: lexical_alternative
  - marker: e
    text: 'Gíríìkì fi ìṣe tó jẹ́ ìfọ̀rọ̀wọ́sí sílẹ̀ nínú apá yìí: “gẹ́gẹ́ bí láti inú agbára tí Ọlọ́run ń pèsè.”'
    reason: previous_rendering
lexical_decisions:
- source_word: λαλεῖ
  choice: ń sọ̀rọ̀
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ìṣe sísọ ní gbogbogbò, láì dín ìtumọ̀ rẹ̀ kù sí ìwàásù nìkan.
- source_word: λόγια θεοῦ
  choice: ọ̀rọ̀ tí Ọlọ́run ti sọ
  rationale: λόγια túmọ̀ sí àwọn ọ̀rọ̀ tàbí ìkéde láti ọ̀dọ̀ Ọlọ́run; gbolohun yìí jẹ́ kíkà rọrùn, ó sì dáàbò bo ìtumọ̀ ọ̀rọ̀ àtọ̀runwá láì sọ pé gbogbo olùsọ̀rọ̀ ní ìmísí tààrà.
- source_word: διακονεῖ
  choice: ń ṣe iṣẹ́ ìránṣẹ́
  rationale: Ó bo iṣẹ́ ṣíṣe fún àwọn ẹlòmíràn tàbí iṣẹ́ ìjọ, láì fi í mọ́ ipò aláṣẹ kan ṣoṣo.
- source_word: ἐξ ἰσχύος
  choice: láti inú agbára
  rationale: ἐξ tọ́ka sí orísun; agbára náà wá láti ọ̀dọ̀ Ọlọ́run, kì í ṣe ohun tó kàn ń bá iṣẹ́ náà lọ.
- source_word: ἧς χορηγεῖ ὁ θεός
  choice: tí Ọlọ́run ń pèsè
  rationale: χορηγεῖ sọ nípa pípèsè ohun tí a nílò; àkókò ìṣe Yorùbá náà fi ìpèsè tí ń bá a lọ hàn.
- source_word: ἵνα ἐν πᾶσιν δοξάζηται ὁ θεός
  choice: kí a lè yin Ọlọ́run lógo nínú ohun gbogbo
  rationale: Ó pa ète ἵνα àti àfojúsùn pé Ọlọ́run ni kí a yìn lógo mọ́, ní èdè Yorùbá tí ó ṣe kedere.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: nípasẹ̀ Jesu Mèsáyà
  rationale: διὰ jẹ́ “nípasẹ̀,” Χριστός sì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè; “Mèsáyà” pa ìtumọ̀ oyè náà mọ́.
- source_word: κράτος
  choice: ìjọba
  rationale: Nínú orin ìyìn, κράτος tọ́ka sí agbára ọba àti àṣẹ ìṣàkóso; “ìjọba” jẹ́ ọ̀rọ̀ Yorùbá tó bójú mu nínú àyíká yìí.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: láéláé àti láéláé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá fún àkókò tí kò ní òpin, ó sì pa ìtẹnumọ́ ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ohun tí ᾧ (“ẹni tí”) ń tọ́ka sí nínú orin ìyìn ìparí
  choice: A so “ẹni tí” mọ́ Jesu Mèsáyà, ẹni tó sún mọ́ ọ jù lọ nínú gírámà.
  alternative: Àwọn kan ka orin ìyìn náà sí Ọlọ́run Baba nítorí òun ni kókó gbólóhùn tó ṣáájú.
  rationale: Ìsopọ̀ gírámà tó sún mọ́ jù lọ ṣe àtìlẹ́yìn fún Jesu Mèsáyà, ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn mìíràn mọ́ láì fi agbára yanju àìdánilójú náà.
- issue: Agbára ὡς nínú àwọn gbólóhùn méjèèjì
  choice: A mú ìránnilétí tí ó wà nínú rẹ̀ jáde pẹ̀lú “kí ó sọ ọ́” àti “kí ó ṣe é.”
  alternative: 'Ìtumọ̀ tó tẹ̀ lé ìrísí Gíríìkì gan-an lè jẹ́: “bí ẹnikẹ́ni bá ń sọ̀rọ̀, bí ọ̀rọ̀ Ọlọ́run; bí ẹnikẹ́ni bá ń ṣe iṣẹ́ ìránṣẹ́, bí ẹni pé láti inú agbára...”'
  rationale: Gíríìkì fi ọ̀rọ̀ ìṣe kan sílẹ̀ láì sọ ọ́ jáde, ṣùgbọ́n Yorùbá àdánidá nílò kí ìránnilétí náà hàn gbangba.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó ti yẹ. Ìforúkọsílẹ̀ jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; a lo “iṣẹ́ ìránṣẹ́” ní ìtumọ̀ gbòòrò, a sì lo “Mèsáyà” gẹ́gẹ́ bí oyè.
