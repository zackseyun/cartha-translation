  source_fidelity: Ìtumọ̀ náà ń fi ìtakora πάντοτε/μηδέποτε, ìṣe tí ń bá a lọ nínú μανθάνοντα, àti àìlè dé sí ἐπίγνωσις ἀληθείας hàn dáadáa. Ṣùgbọ́n ‘dé inú ìmọ̀’ dà bí wíwọ inú ohun kan ní Yorùbá, kì í sì jẹ́ ọ̀nà àdánidá jù lọ láti sọ ‘come to/arrive at knowledge.’ ‘Dé sí ìmọ̀’ pa ìṣàpẹẹrẹ ìdíwọ̀n/ìrìn náà mọ́ láìyí ìtumọ̀ padà.
