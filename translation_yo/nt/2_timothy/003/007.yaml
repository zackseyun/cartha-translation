  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: yo
  text: tí wọ́n ń kẹ́kọ̀ọ́ nígbà gbogbo, tí wọ́n kò sì lè dé sí ìmọ̀ òtítọ́ láéláé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí ‘ìmọ̀ kíkún nípa òtítọ́.’ Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìmọ̀ tó jinlẹ̀ sí i tàbí tó péye sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: nígbà gbogbo
  rationale: Ó fi hàn pé ìṣe náà ń ṣẹlẹ̀ léraléra tàbí láìdáwọ́; ó sì bá ìyàtọ̀ rẹ̀ pẹ̀lú μηδέποτε mu.
- source_word: μανθάνοντα
  choice: tí wọ́n ń kẹ́kọ̀ọ́
  rationale: Ọ̀rọ̀ alábápín àsìkò ìsinsìnyí yìí ń tọ́ka sí kíkẹ́kọ̀ọ́ tí ń bá a lọ, láìfi dandan sọ pé ẹ̀kọ́ náà jẹ́ ti ilé-ẹ̀kọ́ tàbí irú ọ̀nà kan pàtó.
- source_word: μηδέποτε
  choice: láéláé
  rationale: Ó jẹ́ ìkọ̀sílẹ̀ tó lágbára nípa àkókò, ó sì mú ìtakora tó wà láàárín ‘nígbà gbogbo’ àti ‘kò ... láéláé’ ṣe kedere.
- source_word: εἰς ἐπίγνωσιν
  choice: dé inú ìmọ̀
  rationale: εἰς pẹ̀lú ἐλθεῖν ní àwòrán ìrìn dé ibi kan; ‘dé inú ìmọ̀’ pa àwòrán yẹn mọ́, nígbà tí ‘ìmọ̀’ kò fi ìtumọ̀ ‘ìmọ̀ kíkún’ múlẹ̀ ju bí ọ̀rọ̀ Gíríìkì ṣe béèrè lọ.
- source_word: ἀληθείας
  choice: òtítọ́
  rationale: Ó jẹ́ ẹ̀yà olùní tó sin ἐπίγνωσιν; ní Yorùbá, ‘ìmọ̀ òtítọ́’ jẹ́ ọ̀nà àdánidá láti sọ knowledge of the truth.
- source_word: ἐλθεῖν
  choice: dé
  rationale: Ọ̀rọ̀ náà túmọ̀ sí wíwá tàbí dídé; ‘dé’ bá ìsọ̀rọ̀ εἰς mu, ó sì pa àwòrán ìrìn dé ibi kan mọ́.
- source_word: δυνάμενα
  choice: lè
  rationale: Ó sọ agbára tàbí àǹfààní láti ṣe ohun kan; ‘lè’ jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì ṣókí.
theological_decisions:
- issue: Ìtumọ̀ tó ṣeé ṣe fún ἐπίγνωσις nínú lílo Páùlù
  choice: ìmọ̀
  alternative: ìmọ̀ kíkún
  rationale: Kókó ẹsẹ̀ náà ni pé bí wọ́n tilẹ̀ ń kẹ́kọ̀ọ́ nígbà gbogbo, wọn kò dé sí ìmọ̀ òtítọ́ gidi. ‘Ìmọ̀’ kò fi ìtumọ̀ ọ̀rọ̀ náà há sí ‘ìmọ̀ kíkún,’ ṣùgbọ́n àlàyé ìsàlẹ̀ pa àṣàyàn yẹn mọ́.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àmì ohùn ni a lò ní kíkún níbi tó yẹ. Ìbẹ̀rẹ̀ pẹ̀lú ‘tí’ pa ìbáṣepọ̀ gírámà mọ́ pẹ̀lú àwọn obìnrin tí ẹsẹ̀ ṣáájú ń sọ̀rọ̀ nípa wọn.
