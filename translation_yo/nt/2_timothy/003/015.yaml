id: 2TI.3.15
reference: 2 Timothy 3:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: yo
  text: àti pé láti ìgbà ìkókó ni ìwọ ti mọ àwọn ìwé tí a yà sí mímọ́[a], tí ó lè sọ ọ́ di ọlọ́gbọ́n fún ìgbàlà nípasẹ̀ ìgbàgbọ́ nínú Mèsáyà Jésù.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ìwé Mímọ́.” Ní pàtó, Gíríìkì sọ pé “àwọn ìwé tí a yà sí mímọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ó tún ṣeé túmọ̀ sí “nípasẹ̀ ìdúróṣinṣin Mèsáyà Jésù,” ṣùgbọ́n “nípasẹ̀ ìgbàgbọ́ nínú Mèsáyà Jésù” ni ìtumọ̀ tí ó bá àyíká yìí mu jù.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: láti ìgbà ìkókó
  rationale: βρέφος ń tọ́ka sí ọmọ kékeré gan-an, àní ọmọ ọwọ́; “láti ìgbà ìkókó” pa ìtumọ̀ yẹn mọ́ ní Yorùbá àdánidá.
- source_word: ἱερὰ γράμματα
  choice: àwọn ìwé tí a yà sí mímọ́
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtó sí àwọn ohun tí a kọ tí ó jẹ́ mímọ́ tàbí tí a yà sí mímọ́. Ìtumọ̀ yìí sun mọ́ Gíríìkì, kò sì fi ọ̀rọ̀ amọ̀dájú “Ìwé Mímọ́” sínú àkọ́kọ́ láìṣàlàyé.
- source_word: οἶδας
  choice: ni ìwọ ti mọ
  rationale: Bí ó tilẹ̀ jẹ́ pé οἶδα ní ìtumọ̀ ìsinsìnyí, àkópọ̀ rẹ̀ pẹ̀lú ἀπὸ βρέφους ń fi ìmọ̀ tí ó bẹ̀rẹ̀ láti ìkókó tí ó sì ń bá a lọ hàn; “ti mọ” sọ èyí ní Yorùbá àdánidá.
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: tí ó lè sọ ọ́ di ọlọ́gbọ́n
  rationale: Ó pa agbára àwọn ìwé náà láti fún ẹni ní ọgbọ́n mọ́, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún σοφίσαι.
- source_word: εἰς σωτηρίαν
  choice: fún ìgbàlà
  rationale: εἰς ń tọ́ka sí ète tàbí àbájáde níhìn-ín; “fún ìgbàlà” jẹ́ kúkúrú, ó sì bá Yorùbá mu.
- source_word: διὰ πίστεως
  choice: nípasẹ̀ ìgbàgbọ́
  rationale: πίστις ní ìtumọ̀ “ìgbàgbọ́” ní àyíká yìí, διὰ sì ń fi ọ̀nà tàbí ohun èlò hàn.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè, nítorí náà “Mèsáyà” pa ìtumọ̀ oyè náà mọ́; “nínú” sì pa ìbáṣepọ̀ tí ἐν fi hàn mọ́.
theological_decisions:
- issue: Bóyá kí a túmọ̀ Χριστῷ gẹ́gẹ́ bí oyè tàbí kí a lò ó bí apá orúkọ
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Χριστός ní ìtumọ̀ oyè ẹni àmì òróró níhìn-ín; “Mèsáyà” jẹ́ kí ìtumọ̀ oyè náà hàn dípò yíyí i padà sí orúkọ lásán.
- issue: Ìtumọ̀ πίστεως nínú διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ
  choice: nípasẹ̀ ìgbàgbọ́ nínú Mèsáyà Jésù
  alternative: nípasẹ̀ ìṣòtítọ́ Mèsáyà Jésù
  rationale: Ìṣètò ọ̀rọ̀ yìí ṣeé lóye jù lọ gẹ́gẹ́ bí ìgbàgbọ́ ẹni tí a gbé lé Mèsáyà Jésù. Síbẹ̀, a pa àṣàyàn “ìṣòtítọ́ Mèsáyà Jésù” mọ́ nínú àlàyé ìsàlẹ̀ nítorí ìtumọ̀ písteōs lè gbòòrò sí ìṣòtítọ́ ní àwọn àyíká kan.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn ní kíkún. “Láti ìgbà ìkókó,” “sọ ọ́ di ọlọ́gbọ́n,” àti “fún ìgbàlà” jẹ́ ọ̀rọ̀ tí òǹkàwé Yorùbá lásán lè lóye, nígbà tí “àwọn ìwé tí a yà sí mímọ́” pa àwọ̀ ìtumọ̀ Gíríìkì mọ́.
