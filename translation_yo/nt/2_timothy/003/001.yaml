base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: yo
  text: Ṣùgbọ́n mọ̀ èyí pé ní àwọn ọjọ́ ìkẹyìn, àwọn àkókò ìṣòro yóò dé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn àkókò eléwu” tàbí “àwọn àkókò tó nira.” Ọ̀rọ̀ àpèjúwe Gíríìkì náà lè tọ́ka sí àwọn àkókò tó nira, tó léwu, tàbí tó mú ìbànújẹ́ wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: èyí
  rationale: Ọ̀rọ̀ arọ́pò atọ́ka yìí ń tọ́ka sí ohun tí gbólóhùn tí ὅτι bẹ̀rẹ̀ yóò ṣàlàyé; “èyí” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: δέ fi ìyípadà tàbí ìtakora pẹ̀lẹ́ hàn láti inú ọ̀rọ̀ tó ṣáájú; “Ṣùgbọ́n” pa ìyípadà náà mọ́ láì mú un le jù.
- source_word: γίνωσκε
  choice: mọ
  rationale: Ó jẹ́ àṣẹ ìsinsìnyí sí ẹni kan ṣoṣo. “Mọ” ṣe kedere, ó sì pa ìrọ̀rọ̀ àṣẹ orísun mọ́; ìtumọ̀ bí “fi sọ́kàn” yóò túmọ̀ rẹ̀ síwájú sí i.
- source_word: ὅτι
  choice: pé
  rationale: ὅτι mú àkóónú ohun tí Tímótì gbọ́dọ̀ mọ̀ wọlé. Ní Yorùbá, “pé” ni asopọ̀ tó ṣe déédéé jù lọ nínú àgbékalẹ̀ yìí.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: ní àwọn ọjọ́ ìkẹyìn
  rationale: Àgbékalẹ̀ yìí pa ọ̀rọ̀ ìgbà ìkẹyìn inú orísun mọ́, láì fi ẹ̀kọ́ pàtó kan pinnu bí àkókò náà ṣe gùn tàbí ibi tí ó bẹ̀rẹ̀.
- source_word: ἐνστήσονται
  choice: yóò dé
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú náà túmọ̀ sí pé àwọn àkókò náà yóò dé tàbí yóò wà níbẹ̀. “Yóò dé” jẹ́ èdè Yorùbá àdánidá nínú àyíká yìí.
- source_word: καιροὶ
  choice: àwọn àkókò
  rationale: καιρός ń tọ́ka sí àwọn sáà tàbí àkókò kan, kì í ṣe ìṣírò àkókò lásán. “Àwọn àkókò” bá ọ̀pọ̀ orúkọ Gíríìkì náà mu.
- source_word: χαλεποί
  choice: líle
  rationale: χαλεπός lè túmọ̀ sí ohun tó nira, tó léwu, tàbí tó mú ìbànújẹ́ wá. “Líle” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe déédéé, tó sì gbòòrò tó láti gbé ọ̀pọ̀ ìtumọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ “àwọn ọjọ́ ìkẹyìn”
  choice: Pa àgbékalẹ̀ “àwọn ọjọ́ ìkẹyìn” mọ́ láì dín un kù sí àkókò tó kù díẹ̀ kí Kristi tó padà.
  alternative: Kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí sáà ìkẹyìn gan-an ṣáájú òpin, tàbí gẹ́gẹ́ bí àkókò ìkẹyìn tó ti bẹ̀rẹ̀ nínú ìmúṣẹ iṣẹ́ Kristi.
  rationale: Àgbékalẹ̀ náà ní ìwọ̀n ẹ̀kọ́ nípa òpin ayé, ṣùgbọ́n ẹsẹ yìí kò dá bí a ṣe gbọdọ̀ pinnu ààlà àkókò náà. Ìtumọ̀ náà pa ìṣòro àti àìdájú tó wà nínú orísun mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àมาตรฐาน tó bójú mu, tó ní iyì, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tó bá ṣe àdánidá. Gbólóhùn náà tẹ̀ lé ìṣètò orísun ní pẹkipẹki, ṣùgbọ́n ó lo “pé” fún ὅτι nítorí èyí ni àgbékalẹ̀ Yorùbá tó rọrùn jù.
