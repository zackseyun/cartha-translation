- from: Ṣùgbọ́n mọ èyí pé ní àwọn ọjọ́ ìkẹyìn, àwọn àkókò líle yóò dé[a].
  to: Ṣùgbọ́n mọ̀ èyí pé ní àwọn ọjọ́ ìkẹyìn, àwọn àkókò ìṣòro yóò dé[a].
  rationale: The revision corrects the tone mark on mọ̀ and replaces the less idiomatic “àwọn àkókò líle” with “àwọn àkókò ìṣòro.” This retains the warning’s general sense without narrowing χαλεποί to danger alone, while the footnote presents the principal lexical alternatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the demonstrative, imperative, content clause, eschatological phrase, future verb, and plural noun. However, “líle” is not the most natural Yoruba adjective in this collocation and can suggest physical hardness rather than the broad sense of troublesome, grievous, or dangerous periods conveyed by χαλεποί. “Mọ” also needs the low tone in mọ̀ (“know”).
  naturalness: “Àwọn àkókò líle” is understandable but stylistically stiff and less idiomatic than “àwọn àkókò ìṣòro.” The revised wording is natural Standard Yoruba while retaining the source’s broad warning.
  terminology: “Àwọn ọjọ́ ìkẹyìn” appropriately preserves the established eschatological expression without specifying its scope. “Àwọn àkókò ìṣòro” is an idiomatic, suitably broad rendering of καιροὶ χαλεποί. The footnote retains “èléwu” and “tó nira” as valid alternatives.
  issues:
  - severity: medium
    issue: The imperative is written “mọ” rather than “mọ̀.”
    rationale: Mọ̀, with a low tone, is the Standard Yoruba form meaning “know”; the unmarked form is not the intended verb.
  - severity: medium
    issue: “Àwọn àkókò líle” is an unnatural collocation for difficult or perilous times.
    rationale: Although líle can convey hardness or severity, it is less idiomatic here and may evoke physical hardness. “Àwọn àkókò ìṣòro” naturally conveys times marked by trouble and preserves the contextual breadth of χαλεποί.
  revised_text: Ṣùgbọ́n mọ̀ èyí pé ní àwọn ọjọ́ ìkẹyìn, àwọn àkókò ìṣòro yóò dé[a].
