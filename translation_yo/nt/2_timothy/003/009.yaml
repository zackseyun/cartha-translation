id: 2TI.3.9
reference: 2 Timothy 3:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: yo
  text: 'Ṣùgbọ́n wọn kì yóò tẹ̀ síwájú sí i,[a] nítorí òmùgọ̀ wọn yóò di mímọ̀ sí gbogbo ènìyàn, gẹ́gẹ́ bí òmùgọ̀ àwọn ọkùnrin wọ̀nyẹn náà ti di mímọ̀.


    [a] Tàbí, “wọn kì yóò ní ìlọsíwájú sí i.”


    [b] Àwọn ọkùnrin wọ̀nyẹn ni Jání àti Jámíbírì, tí ẹsẹ tó ṣáájú mẹ́nu kàn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “wọn kì yóò ní ìlọsíwájú sí i.”
    reason: lexical_alternative
  - marker: b
    text: Àwọn ọkùnrin wọ̀nyẹn ni Jání àti Jámíbírì, tí ẹsẹ tó ṣáájú mẹ́nu kàn.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: wọn kì yóò tẹ̀ síwájú
  rationale: “Tẹ̀ síwájú” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹnì kan ń lọ síwájú tàbí ń ní ìlọsíwájú; ó tún pa àkàwé ìlọsíwájú inú ọ̀rọ̀ Gíríìkì mọ́ láìfi hàn pé ìlọsíwájú rere ni.
- source_word: ἐπὶ πλεῖον
  choice: jù bẹ́ẹ̀ lọ
  rationale: Gbólóhùn yìí bá ìtumọ̀ “síwájú sí i” mu, ó sì ṣiṣẹ́ lọ́nà àdánidá pẹ̀lú ọ̀rọ̀ ìkọ̀ “kì yóò”.
- source_word: ἄνοια
  choice: ìwà òmùgọ̀
  rationale: Yíyan yìí sọ àìní òye àti ìwà aṣiwèrè tí ọ̀rọ̀ náà ń tọ́ka sí ní kedere, ó sì yẹ fún ọ̀rọ̀ ìbáwí inú àyíká ẹsẹ náà.
- source_word: ἔκδηλος
  choice: hàn gbangba
  rationale: “Hàn gbangba” jẹ́ gbólóhùn Yorùbá tó wọ́pọ̀, tó sì túmọ̀ sí pé ohun kan di mímọ̀ tàbí kedere sí àwọn ènìyàn.
- source_word: πᾶσιν
  choice: sí gbogbo ènìyàn
  rationale: Ó fi ìwọ̀n gbogbo ènìyàn tí ọ̀rọ̀ Gíríìkì ní hàn ní Yorùbá tó ṣe kedere.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: gẹ́gẹ́ bí ìwà òmùgọ̀ àwọn ọkùnrin yẹn náà ti hàn gbangba
  rationale: A tún “ìwà òmùgọ̀” sọ nítorí pé gbólóhùn Gíríìkì fi ọ̀rọ̀ náà sílẹ̀ fún olùkà láti lóye; àtúnsọ náà mú Yorùbá ṣe kedere láìyí ìtumọ̀ padà. “Àwọn ọkùnrin yẹn” pa ìtọ́kasí sí àwọn tí a ṣẹ̀ṣẹ̀ dárúkọ mọ́.
theological_decisions:
- issue: Ẹni tí ἐκείνων (“àwọn ọkùnrin yẹn”) ń tọ́ka sí
  choice: Ó tọ́ka sí Jání àti Jámíbírì tí a dárúkọ ní 2 Tímótì 3:8.
  alternative: Ó lè jẹ́ ìtọ́kasí gbogbogbò sí àwọn olùkọ́ èké tàbí alatako ti ìgbà àtijọ́.
  rationale: Àyíká tó sún mọ́ ọn jù ni 3:8, níbi tí a ti dárúkọ Jání àti Jámíbírì. Ọ̀rọ̀ “àwọn ọkùnrin yẹn” pa ìsopọ̀ yẹn mọ́, nígbà tí àlàyé ìsàlẹ̀ ojú ewé ń sọ ẹni tí ó ṣeé ṣe jù pé ó ń tọ́ka sí.
translation_notes:
  register: A lo Yorùbá à标准 tó ní àmì ohùn ní kíkún, pẹ̀lú èdè òde òní tó bójú mu, tó sì ní iyì. Gbólóhùn “tẹ̀ síwájú jù bẹ́ẹ̀ lọ” àti “hàn gbangba” jẹ́ àdánidá fún òǹkàwé Yorùbá lónìí; a tún ọ̀rọ̀ “ìwà òmùgọ̀” sọ ní ìparí kí gbólóhùn afíwé náà má bàa ṣòro láti lóye.
