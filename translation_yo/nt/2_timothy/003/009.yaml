  source_fidelity: 'Ìtumọ̀ náà mú èrò pàtàkì Gíríìkì náà dáadáa: ìlọsíwájú àwọn ènìyàn wọ̀nyẹn yóò dúró, òmùgọ̀ wọn yóò hàn sí gbogbo ènìyàn, a sì ń fi wọ́n wé Jání àti Jámíbírì. Síbẹ̀, “ìwà òmùgọ̀” lè tọ́ka sí ìhùwàsí òmùgọ̀ ju ἄνοια, ìyẹn àìní òye/òmùgọ̀, lọ; a lè sọ ọ́ ní tààrà síi. “Tẹ̀ síwájú jù bẹ́ẹ̀ lọ” tún lè dùn bí ìfíwéra, níbi tí “sí i” ti ń ṣàfihàn ἐπὶ πλεῖον ní kedere.'
  naturalness: 'Àtúnṣe náà ń lo Yorùbá òde òní tó dáa: “kì yóò tẹ̀ síwájú sí i,” “òmùgọ̀ wọn,” àti “yóò di mímọ̀ sí gbogbo ènìyàn.” Àfíwéra ìkẹyìn náà tún dáa nípa sísọ pé òmùgọ̀ àwọn ọkùnrin wọ̀nyẹn “ti di mímọ̀,” èyí tó bá ἐγένετο (di/bẹ̀rẹ̀ sí í hàn) mu.'
