source:
  edition: SBLGNT
  text: ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος, πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: yo
  text: kí ènìyàn Ọlọ́run[b] lè péye, tí a ti pèsè gbogbo ohun tí ó nílò fún un[a] fún gbogbo iṣẹ́ rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí a ti múra rẹ̀ sílẹ̀ pátápátá.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí a ti pèsè tàbí ti múra sílẹ̀ dáadáa.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “ènìyàn Ọlọ́run” jẹ́ àpólà akọ ẹyọ kan, ó sì lè jẹ́ oyè Bíbélì tí ó ń tọ́ka ní pàtàkì sí ìránṣẹ́ Ọlọ́run. Ní àyíká mìíràn, a tún lè lo àpólà náà ní ìtumọ̀ tó gbòòrò jù bẹ́ẹ̀ lọ.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: kí ... lè
  rationale: Ó fi ète tàbí àbájáde ohun tí ẹsẹ 16 sọ hàn ní ọ̀nà tó bá èdè Yorùbá mu.
- source_word: ἄρτιος
  choice: péye
  rationale: “Péye” túmọ̀ sí ẹni tó kúnjú ìwọ̀n, tó sì yẹ fún iṣẹ́; kò sọ pé ẹni náà jẹ́ aláìlẹ́ṣẹ̀ pátápátá.
- source_word: ᾖ
  choice: lè
  rationale: Ó bá ọ̀rọ̀ ìfẹ́ tàbí ète tí ἵνα àti ọ̀rọ̀-ìṣe subjunctive ń sọ mu.
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: ènìyàn Ọlọ́run
  rationale: Èyí pa àpólà Bíbélì náà mọ́ lọ́nà àdánidá ní Yorùbá. “Ènìyàn” lè tọ́ka sí ọkùnrin nínú àyíká yìí láìfi ìtumọ̀ akọ tí Gíríìkì ní sílẹ̀ pátápátá fún Yorùbá tí kò sábà fi akọ tàbí abo hàn nínú orúkọ.
- source_word: πρὸς
  choice: fún
  rationale: Ó sọ ohun tí a múra ẹni náà sílẹ̀ láti ṣe.
- source_word: πᾶν ἔργον ἀγαθόν
  choice: gbogbo iṣẹ́ rere
  rationale: Ó pa agbára distributive πᾶν àti ìwà rere ἀγαθόν mọ́ ní gbólóhùn Yorùbá tó wọ́pọ̀.
- source_word: ἐξηρτισμένος
  choice: kí a sì ti múra rẹ̀ sílẹ̀ pátápátá
  rationale: Ó fi perfect passive participle hàn gẹ́gẹ́ bí ìmúrasílẹ̀ tí a ti parí, tí àbájáde rẹ̀ sì ń bá a lọ; “pátápátá” mú agbára ọ̀rọ̀-ìṣe náà jáde.
theological_decisions:
- issue: Ìtumọ̀ akọ nínú ὁ τοῦ θεοῦ ἄνθρωπος
  choice: ènìyàn Ọlọ́run, pẹ̀lú àlàyé ní àlàyé ìsàlẹ̀-ìwé
  alternative: ọkùnrin Ọlọ́run
  rationale: Gíríìkì jẹ́ akọ ẹyọ kan, ó sì ṣeé ṣe kó jẹ́ orúkọ oyè Bíbélì fún ìránṣẹ́ Ọlọ́run ní pàtàkì. Síbẹ̀, “ọkùnrin Ọlọ́run” lè dín ἄνθρωπος kù sí akọ nìkan ju bí ọ̀rọ̀ náà ṣe lè ní ìlò gbòòrò lọ; “ènìyàn Ọlọ́run” jẹ́ àdánidá, àlàyé ìsàlẹ̀-ìwé sì pa ìṣòro náà mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó ní iyì, tó sì rọrùn fún ọ̀pọ̀ ènìyàn láti lóye. A lo “péye” dípò ọ̀rọ̀ tó lè túmọ̀ sí àìní ẹ̀ṣẹ̀, a sì lo “múra ... sílẹ̀ pátápátá” láti pa ìtumọ̀ ìmúrasílẹ̀ tí a ti parí mọ́.
