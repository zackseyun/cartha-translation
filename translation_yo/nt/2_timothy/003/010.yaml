id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: yo
  text: Ṣùgbọ́n ìwọ ti tẹ̀lé ẹ̀kọ́ mi pẹkipẹki, àti ìwà mi, ète mi, ìgbàgbọ́ mi[a], sùúrù mi, ìfẹ́ mi àti ìfaradà mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìṣòtítọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbàgbọ́ tàbí ìṣòtítọ́ nínú àyíká yìí.
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Ṣùgbọ́n ìwọ
  rationale: δέ fi ìyàtọ̀ hàn sí àwọn ènìyàn búburú tí a ṣàpèjúwe ṣáájú, Σὺ sì tẹnumọ́ ẹni tí a ń bá sọ̀rọ̀.
- source_word: παρηκολούθησάς
  choice: ti tẹ̀lé ... pẹkipẹki
  rationale: Ó mú èrò títẹ̀lé tàbí kíkọ́ àkíyèsí sí ohun kan dáadáa jáde, ó sì bá bí Tímótì ṣe mọ ẹ̀kọ́ àti ìgbésí ayé Pọ́ọ̀lù mu.
- source_word: μου
  choice: mi
  rationale: A lo ọ̀rọ̀ arọ́pò-orúkọ ọlọ́nà-oníhun pẹ̀lú gbogbo àwọn ohun inú àtòjọ náà, gẹ́gẹ́ bí ìbáṣepọ̀ rẹ̀ nínú Gíríìkì.
- source_word: διδασκαλίᾳ
  choice: ẹ̀kọ́
  rationale: ‘Ẹ̀kọ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, kedere fún ohun tí Pọ́ọ̀lù ń kọ́ni.
- source_word: ἀγωγῇ
  choice: ìwà
  rationale: Nínú àyíká yìí ἀγωγή túmọ̀ sí ìhùwàsí tàbí ọ̀nà ìgbésí ayé; ‘ìwà’ jẹ́ ṣókí, ó sì yé òǹkàwé òde òní.
- source_word: προθέσει
  choice: ète
  rationale: Ó tọ́ka sí ohun tí ẹni pinnu láti ṣe tàbí ète tí ó dúró lórí.
- source_word: πίστει
  choice: ìgbàgbọ́
  rationale: ‘Ìgbàgbọ́’ pa ìtumọ̀ ìgbẹ́kẹ̀lé mọ́; ṣùgbọ́n nítorí ‘ìṣòtítọ́’ tún ṣeé ṣe nínú àtòjọ ìwà rere yìí, a fi í sínú àlàyé ìsàlẹ̀.
- source_word: μακροθυμίᾳ
  choice: sùúrù
  rationale: Ó ń tọ́ka sí sùúrù pẹ̀lú àwọn ènìyàn, pàápàá nígbà ìbínú tàbí ìtakò.
- source_word: ἀγάπῃ
  choice: ìfẹ́
  rationale: ‘Ìfẹ́’ ni ìtumọ̀ Yorùbá tí ó ṣe kedere, tí ó sì bá ἀγάπη mu.
- source_word: ὑπομονῇ
  choice: ìfaradà
  rationale: Ó tẹnumọ́ dídúró ṣinṣin lábẹ́ ìṣòro, ó sì yàtọ̀ sí sùúrù tí μακροθυμία ń tọ́ka sí.
theological_decisions:
- issue: Ìtumọ̀ πίστις nínú àtòjọ ìwà rere ti Pọ́ọ̀lù
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́
  rationale: 'Àyíká lè tọ́ka sí ìgbẹ́kẹ̀lé tàbí sí jíjẹ́ olóòtítọ́. A kò yanju àìdánilójú náà ní ìkọ̀kọ̀: ‘ìgbàgbọ́’ wà nínú ọ̀rọ̀ pàtàkì, ‘ìṣòtítọ́’ sì wà nínú àlàyé ìsàlẹ̀.'
translation_notes:
  register: Yorùbá àpéjọ tí ó ní àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún gbogbo ènìyàn láti lóye. Àtúnsọ ‘mi’ mú ìbáṣepọ̀ ohun-oníhun nínú Gíríìkì ṣe kedere ní Yorùbá.
