id: 2TI.3.11
reference: 2 Timothy 3:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: yo
  text: àwọn inúnibíni, àwọn ìjìyà, irú ohun tí ó ṣẹlẹ̀ sí mi ní Áńtíókù, ní Íkóníónì, ní Lísírà—irú àwọn inúnibíni tí mo fara dà![a] Olúwa[b] sì yọ mí kúrò nínú gbogbo wọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tún lè túmọ̀ rẹ̀ sí: “àwọn inúnibíni tí mo fara dà.”'
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe gan-an pé “Olúwa” ń tọ́ka sí Olúwa Jésù, ṣùgbọ́n “Olúwa” nìkan ni ọ̀rọ̀ Gíríìkì sọ.
    reason: alternative_reading
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: àwọn inúnibíni
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí lílépa àti fífi ìpọ́njú bá ènìyàn nítorí ìdúróṣinṣin tàbí iṣẹ́ rẹ̀. “Àwọn inúnibíni” jẹ́ ọ̀rọ̀ Yorùbá tó mọ́gbọ́n dání, tó sì pa ìtumọ̀ ọ̀pọ̀ nǹkan inú Gíríìkì mọ́.
- source_word: παθήμασιν
  choice: àwọn ìjìyà
  rationale: “Àwọn ìjìyà” gbòòrò tó láti sọ onírúurú ohun tí ẹni kan ń jìyà, láìdín ìtumọ̀ náà kù sí ìpọ́njú láti ọ̀dọ̀ àwọn ènìyàn nìkan.
- source_word: οἷά μοι ἐγένετο
  choice: irú èyí tí ó ṣẹlẹ̀ sí mi
  rationale: Ìtumọ̀ yìí fi hàn pé àwọn ìṣẹ̀lẹ̀ tó wá lẹ́yìn rẹ̀ jẹ́ àpẹẹrẹ àwọn inúnibíni àti ìjìyà tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: ní Áńtíókù, ní Íkóníónì, ní Lísírà
  rationale: A kọ orúkọ àwọn ibi náà gẹ́gẹ́ bí ìró wọn, a sì tún “ní” ṣe bí Gíríìkì ṣe tún ἐν ṣe, kí ìlù ọ̀rọ̀ náà lè dúró.
- source_word: οἵους διωγμοὺς
  choice: wo irú àwọn inúnibíni
  rationale: “Wo irú” mú agbára ìyàlẹ́nu àti ìwúwo ọ̀rọ̀ οἵους jáde, láìṣe àfikún irú inúnibíni kan tí orísun kò sọ.
- source_word: ὑπήνεγκα
  choice: tí mo fara dà
  rationale: “Fara dà” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ gbígbé ara ró lábẹ́ ìpọ́njú.
- source_word: ἐκ πάντων
  choice: kúrò nínú gbogbo wọn
  rationale: Ìtumọ̀ yìí pa àwòrán jíjìnà kúrò nínú gbogbo ewu wọ̀nyẹn mọ́, ó sì tọ́ka padà sí àwọn inúnibíni àti ìjìyà tí a mẹ́nu kàn.
- source_word: ἐρρύσατο
  choice: gbà mí sílẹ̀
  rationale: “Gbà mí sílẹ̀” sọ ìgbàlà kúrò nínú ewu ní ọ̀nà tó ṣe kedere, láìfi ìtumọ̀ ẹ̀kọ́ ìgbàlà tí ó ju àyíká ẹsẹ yìí lọ kún un.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ àkọ́lé κύριος; a kò fi orúkọ “Jésù” kún un nítorí orísun sọ àkọ́lé náà nìkan.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí
  choice: A túmọ̀ ọ́ sí “Olúwa” nìkan.
  alternative: “Olúwa Jésù”
  rationale: Bí ó tilẹ̀ jẹ́ pé ó ṣeé ṣe gan-an pé Pọ́ọ̀lù ń tọ́ka sí Jésù, Gíríìkì ní ὁ κύριος nìkan. Ìtumọ̀ náà pa àìsọ pàtó yìí mọ́, kò sì fi orúkọ tí kò sí nínú orísun kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó ní iyì, pẹ̀lú àmì ohùn níbi tó bá yẹ. Ẹsẹ náà bẹ̀rẹ̀ gẹ́gẹ́ bí àtẹ̀síwájú àkójọ inú ẹsẹ tó ṣáájú, nítorí náà a kò fi ọ̀rọ̀ ìṣe tuntun tí kò sí nínú orísun sí ìbẹ̀rẹ̀ rẹ̀.
