id: 2TI.3.16
reference: 2 Timothy 3:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: yo
  text: Gbogbo Ìwé Mímọ́ jẹ́ ohun tí Ọlọ́run mí sí i, ó sì ṣàǹfààní fún kíkọ́ni[a], fún fífi àṣìṣe hàn, fún ìtúnṣe[b], àti fún ìdánilẹ́kọ̀ọ́ nínú òdodo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ sí, “Ìwé Mímọ́ kọ̀ọ̀kan.” Ọ̀rọ̀ Gíríìkì πᾶσα γραφή lè tọ́ka sí Ìwé Mímọ́ gẹ́gẹ́ bí odindi tàbí sí ọ̀kọ̀ọ̀kan àwọn àkọsílẹ̀ mímọ́.
    reason: alternative_reading
  - marker: b
    text: A tún lè túmọ̀ sí, “Gbogbo Ìwé Mímọ́ tí Ọlọ́run mí sí i tún ṣàǹfààní fún kíkọ́ni, fún fífi àṣìṣe hàn, fún ìtúnṣe, àti fún ìdánilẹ́kọ̀ọ́ nínú òdodo.”
    reason: alternative_reading
  - marker: c
    text: Ní àwọn àyíká ọ̀rọ̀ Páùlù kan, “òdodo” tún lè ní ìtumọ̀ “ìdájọ́ òdodo”; níhìn-ín, ìtumọ̀ rẹ̀ ni dídá ènìyàn sí ìgbé ayé tó tọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: Gbogbo Ìwé Mímọ́
  rationale: Nínú àyíká ọ̀rọ̀ yìí, γραφή ń tọ́ka sí Ìwé Mímọ́. “Gbogbo Ìwé Mímọ́” jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ ìtumọ̀ àkójọpọ̀ náà; àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ olúkúlùkù (“Ìwé Mímọ́ kọ̀ọ̀kan”) mọ́.
- source_word: θεόπνευστος
  choice: Ọlọ́run mí sí
  rationale: Ó fi àwòrán ọ̀rọ̀ Gíríìkì tí ó túmọ̀ sí “Ọlọ́run-mí” hàn ní ọ̀nà Yorùbá tó ṣe kedere, láìfi àbá ẹ̀kọ́ ìmísí kan pàtó kún un.
- source_word: ὠφέλιμος
  choice: ṣàǹfààní
  rationale: Ó túmọ̀ sí jíjẹ́ ohun tó wúlò tàbí tó ṣe ni láǹfààní, ó sì bá èdè Yorùbá òde òní mu.
- source_word: πρὸς διδασκαλίαν
  choice: fún kíkọ́ni
  rationale: Ó lè kó ìṣe àti àkóónú ìkọ́ni sínú, láìdín ọ̀rọ̀ náà kù sí ẹ̀kọ́ ìgbàgbọ́ àjọ kan.
- source_word: ἐλεγμόν
  choice: fún fífi àṣìṣe hàn
  rationale: Ọ̀rọ̀ Gíríìkì náà ní ìtumọ̀ ṣíṣe àṣìṣe tàbí ẹ̀bi ní kedere; gbólóhùn yìí yà á sọ́tọ̀ kúrò nínú ìbáwí ẹnu lásán.
- source_word: ἐπανόρθωσιν
  choice: fún títúnni ṣe
  rationale: Ó sọ èrò mímú ẹni tàbí ohun tí ó ṣìnà padà sí ipò tó tọ́, kì í ṣe fífi ẹ̀bi hàn nìkan.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: fún títọ́ni dàgbà nínú òdodo
  rationale: παιδεία ní ìtumọ̀ ìtọ́ni, ìdánilẹ́kọ̀ọ́ àti ìbáwí tó ń dá ìwà ènìyàn; “títọ́ni dàgbà” sọ ìdásílẹ̀ ìwà yìí ní Yorùbá àdánidá.
- source_word: δικαιοσύνῃ
  choice: òdodo
  rationale: Nínú àyíká yìí, ó ń tọ́ka sí ìgbé ayé tó tọ́ níwájú Ọlọ́run; “òdodo” ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ jù lọ, bí ó tilẹ̀ jẹ́ pé “ìdájọ́ òdodo” lè bá a mu ní àwọn àyíká Páùlù mìíràn.
theological_decisions:
- issue: Ìbáṣepọ̀ gírámà θεόπνευστος àti ὠφέλιμος pẹ̀lú πᾶσα γραφή
  choice: 'A ka àpèjúwe méjèèjì gẹ́gẹ́ bí ohun tí a sọ nípa gbogbo Ìwé Mímọ́: “Ọlọ́run mí sí, ó sì ṣàǹfààní.”'
  alternative: “Gbogbo Ìwé Mímọ́ tí Ọlọ́run mí sí tún ṣàǹfààní...”
  rationale: Kíka àwọn àpèjúwe méjèèjì ní ìpele kan bá ìṣàn ọ̀rọ̀ náà mu dáadáa, ṣùgbọ́n gírámà Gíríìkì gba ìtumọ̀ kejì láàyè; nítorí náà a pa á mọ́ nínú àlàyé [b].
- issue: Ìtumọ̀ πᾶσα γραφή gẹ́gẹ́ bí àkójọpọ̀ tàbí olúkúlùkù
  choice: “Gbogbo Ìwé Mímọ́” gẹ́gẹ́ bí àkójọpọ̀ àwọn ìwé mímọ́.
  alternative: “Ìwé Mímọ́ kọ̀ọ̀kan.”
  rationale: Àyíká ẹsẹ 15–17 ń tọ́ka sí àwọn ìwé mímọ́ gẹ́gẹ́ bí àkójọpọ̀, ṣùgbọ́n àìsí article nínú Gíríìkì mú kí ìtumọ̀ olúkúlùkù ṣeé ṣe; àlàyé [a] pa àìdánilójú yìí mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọ̀wọ̀, tó sì ṣeé lóye fún òǹkàwé òde òní. A lo “Ìwé Mímọ́” fún γραφή, “Ọlọ́run mí sí” láti pa àwòrán θεόπνευστος mọ́, àti àwọn gbólóhùn iṣẹ́ tó ṣe kedere fún àtòjọ àwọn àǹfààní Ìwé Mímọ́.
