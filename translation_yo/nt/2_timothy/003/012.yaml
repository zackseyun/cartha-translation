    issue: Àmì àsopọ̀ ìbẹ̀rẹ̀
    rationale: ‘Àní’ lè túmọ̀ sí ‘ẹ̀ẹ̀nì’ tàbí kó ìtẹnumọ́ tó pọ̀ ju èyí tí καὶ ... δέ béèrè lọ. ‘Ní tòótọ́’ ń mú ìmúdájú náà jáde láìfi ìtumọ̀ míì kún un.
  - severity: medium
    issue: Aṣojú ẹni nínú ìṣe aláìṣe
    rationale: ‘Ni a ó ṣe inúnibíni sí’ lè jẹ́ gbolohun tí kò pé ní Yorùbá nítorí ohun tí a ń ṣe inúnibíni sí kò hàn ní ìparí. Fífi ‘wọn’ kún un jẹ́ kí ìtumọ̀ àti ìṣètò gbolohun pé, láìyí ìtumọ̀ orísun padà.
