source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: yo
  text: Ní tòótọ́, gbogbo àwọn tí wọ́n fẹ́ láti máa gbé ìgbésí ayé ìfọkànsìn sí Ọlọ́run nínú Mèsáyà Jésù, a ó ṣe inúnibíni sí wọn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ... δὲ
  choice: Àní
  rationale: Àpapọ̀ àwọn ọ̀rọ̀ àsopọ̀ yìí níbí fi ìmúdájú kún ohun tí ó ṣáájú; “Àní” sọ agbára ìmúdájú náà ní Yorùbá àdánidá láìfi ìtakò tí kò sí sínú rẹ̀.
- source_word: πάντες οἱ θέλοντες
  choice: gbogbo àwọn tí ó fẹ́
  rationale: Ó pa ìtumọ̀ gbogbo ènìyàn tí ìfẹ́ ọkàn wọn jẹ́ láti ṣe ohun tí ó tẹ̀ lé mọ́.
- source_word: ζῆν εὐσεβῶς
  choice: máa gbé ìgbé ayé ìfọkànsìn sí Ọlọ́run
  rationale: εὐσεβῶς jẹ́ ọ̀nà ìgbé ayé tí ó ní ìbọ̀wọ̀ àti ìfọkànsìn sí Ọlọ́run; gbólóhùn yìí ṣe kedere, ó sì jẹ́ Yorùbá òde òní.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: “nínú” pa èrò ipò ìbáṣepọ̀ àti ìṣọ̀kan mọ́; Χριστός ní agbára oyè níbí, nítorí náà a túmọ̀ rẹ̀ sí “Mèsáyà.”
- source_word: διωχθήσονται
  choice: ni a ó ṣe inúnibíni sí
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá fún ọ̀rọ̀ ọjọ́ iwájú aláìṣe, ó sì pa ìtumọ̀ ìṣe ọ̀tá sí wọn mọ́.
theological_decisions:
- issue: Bí a ṣe máa sọ Χριστῷ gẹ́gẹ́ bí oyè tàbí apá kan orúkọ
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Nínú gbólóhùn yìí, Χριστός ṣì ní ìtumọ̀ oyè ẹni tí a fòróró yàn; “Mèsáyà” mú oyè náà hàn láìfi ẹ̀kọ́ ìsìn ẹgbẹ́ kan kún un.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ àdánidá. Ìforúkọsílẹ̀ náà jẹ́ ọlọ́lá ṣùgbọ́n ó ṣeé lóye fún òǹkàwé òde òní; a lo “ìfọkànsìn sí Ọlọ́run” dípò ọ̀rọ̀ àtijọ́ tàbí èyí tí ó lè dà bí ẹ̀kọ́ ẹgbẹ́ kan.
