  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σὺ δὲ μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης, εἰδὼς παρὰ ⸀τίνων ἔμαθες,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/014.yaml
  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: yo
  text: Ṣùgbọ́n ní ti ìwọ, máa dúró ṣinṣin nínú àwọn ohun tí o ti kọ́, tí a sì ti fi dá ọ lójú nípa wọn[b], ní mímọ̀ àwọn ènìyàn tí o ti kọ́ ọ lọ́dọ̀ wọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn àfọwọ́kọ kan ka a sí ẹyọ, ‘ẹni tí’; ọ̀pọ̀ ènìyàn sì máa ń lóye rẹ̀ pé Paulu ni. Ìwé-ẹ̀rí tí a tẹ̀lé níbí ka a sí ọ̀pọ̀, èyí tí ó lè tọ́ka sí àwọn olùkọ́ Timotiu ní gbogbogbòò.
    reason: textual_variant
  - marker: b
    text: Tàbí, ‘tí o sì ní ìdánilójú nípa wọn.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ṣùgbọ́n ní ti ìwọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà hàn gbangba, ó sì ń fi Timotiu ṣe ìyàtọ̀ sí àwọn ènìyàn búburú tí a ṣẹ̀ṣẹ̀ sọ̀rọ̀ nípa wọn.
- source_word: μένε ἐν οἷς
  choice: máa dúró nínú ohun tí
  rationale: Àṣẹ ìsinsìnyí μένε ń béèrè ìfaradà tí ń bá a lọ, ἐν sì pa àwòrán dídúró nínú ohun tí a kọ́ mọ́.
- source_word: ἔμαθες
  choice: o ti kọ́
  rationale: Ó tọ́ka sí ẹ̀kọ́ tí Timotiu ti gba tẹ́lẹ̀; ọ̀nà yìí jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐπιστώθης
  choice: o sì ní ìdánilójú nípa rẹ̀
  rationale: Ìṣe aláìṣe náà ń tọ́ka sí ìdánilójú Timotiu nípa ohun tí ó kọ́, láìyí i sí ọ̀rọ̀ pé a fi iṣẹ́ kan lé e lọ́wọ́.
- source_word: εἰδὼς
  choice: níwọ̀n bí o ti mọ̀
  rationale: Ó sọ ipò ìmọ̀ tí ó bá àṣẹ náà rìn, ó sì jẹ́ kí ìbáṣepọ̀ rẹ̀ pẹ̀lú gbólóhùn àkọ́kọ́ dúró ní fífẹ̀ díẹ̀.
- source_word: παρὰ τίνων
  choice: àwọn ẹni tí ... lọ́dọ̀ wọn
  rationale: παρά pẹ̀lú atọ́ka ẹlẹ́ni ń fi orísun hàn; ‘àwọn ẹni’ tún pa nọ́ńbà ọ̀pọ̀ ti ẹ̀rí SBLGNT mọ́ láìdárúkọ àwọn olùkọ́ náà.
- source_word: ἔμαθες
  choice: o ti kọ́ ọ
  rationale: ‘Ọ’ dúró fún ohun tí a kọ́, ó sì mú àtúnṣe ọ̀rọ̀-ìṣe náà ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ẹni tàbí àwọn ẹni tí παρὰ τίνων ń tọ́ka sí
  choice: A túmọ̀ ọ́ ní ọ̀pọ̀ gẹ́gẹ́ bí ‘àwọn ẹni’ láìdárúkọ wọn.
  alternative: Àwọn àfọwọ́kọ kan ní ọ̀rọ̀ náà ní ẹyọ, èyí tí a sábà máa ń lóye pé ó ń tọ́ka sí Paulu.
  rationale: SBLGNT tẹ̀lé ẹ̀rí ọ̀pọ̀, ṣùgbọ́n ẹsẹ náà kò dárúkọ àwọn olùkọ́ náà. Ìtumọ̀ yìí kò fi ìdájọ́ ẹ̀kọ́ ìgbàgbọ́ tí ó kọjá ohun tí ẹsẹ sọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti èyí tí ó ṣeé yé ni a lò. Àmì ohùn wà níbi tí ó bá yẹ; ‘ní ti ìwọ’ pa ìtẹnumọ́ àti ìyàtọ̀ inú σὺ δὲ mọ́, ‘àwọn ẹni’ sì jẹ́ kí nọ́ńbà ọ̀pọ̀ inú ẹ̀rí Gíríìkì hàn.
