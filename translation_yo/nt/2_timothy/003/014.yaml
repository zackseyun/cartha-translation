review_pass:
  verdict: revise
  source_fidelity: Ìtumọ̀ náà ń pa ìyàtọ̀ inú σὺ δὲ, àṣẹ tí ń bá a lọ nínú μένε, àti nọ́ńbà ọ̀pọ̀ nínú παρὰ τίνων mọ́. Ṣùgbọ́n ‘níwọ̀n bí’ sọ εἰδὼς di ìdí pàtó, níbi tí apá-ìṣe Gíríìkì náà kò ti sọ ìbáṣepọ̀ náà di mímújú. Bákan náà, ‘ní ìdánilójú’ jẹ́ ìpínlẹ̀, nígbà tí ἐπιστώθης jẹ́ aláìṣe, ó yẹ kí ìtumọ̀ fi hàn pé a dá ẹni náà lójú.
  naturalness: ‘Àwọn ènìyàn tí ... lọ́dọ̀ wọn’ jẹ́ ọ̀nà Yorùbá boṣewa tí ó rọrùn ju ‘àwọn ẹni tí ... lọ́dọ̀ wọn’ lọ. Ṣíṣe εἰδὼς ní ‘ní mímọ̀’ tún dá ìbáṣepọ̀ apá-ìṣe náà sílẹ̀ láìfi ìdí kan dandan mọ́ ọn.
  terminology: ‘Dúró ṣinṣin nínú’ yẹ fún ìpè sí ìfaradà nínú ẹ̀kọ́. ‘Fi dá ọ lójú nípa wọn’ fi ìtumọ̀ ìdánilójú/ìfàsílẹ̀ ἐπιστώθης hàn, láìsọ pé a fi iṣẹ́ tàbí ìgbẹ́kẹ̀lé kan lé Timotiu lọ́wọ́.
  issues:
  - severity: medium
    issue: ‘Níwọ̀n bí o ti mọ̀’ ń sọ εἰδὼς di ọ̀rọ̀ ìdí.
    rationale: Apá-ìṣe εἰδὼς lè ní ìtúmọ̀ ìdí nínú àyíká ọ̀rọ̀, ṣùgbọ́n kò sọ ọ́ ní kedere. ‘Ní mímọ̀’ dá ìtumọ̀ apá-ìṣe náà sílẹ̀, ó sì pa àìdájú tó wà nínú Gíríìkì mọ́.
  - severity: medium
