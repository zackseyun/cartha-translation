    rationale: Gíríìkì náà sọ pé a mú Timotiu dájú nípa àwọn ohun tí ó kọ́. ‘Tí a sì ti fi dá ọ lójú nípa wọn’ mú ìtumọ̀ yẹn hàn ní Yorùbá àdánidá.
  - severity: low
    issue: ‘Àwọn ẹni’ kò rọrùn bí ‘àwọn ènìyàn’ nínú àyíká yìí.
