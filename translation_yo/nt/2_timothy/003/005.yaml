source:
  edition: SBLGNT
  text: ἔχοντες μόρφωσιν εὐσεβείας τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: yo
  text: wọ́n ní ìrísí ìfọkànsìn sí Ọlọ́run[a], ṣùgbọ́n wọ́n ti sẹ́ agbára rẹ̀; yẹra fún irú àwọn ènìyàn bẹ́ẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àfihàn ìfọkànsìn sí Ọlọ́run.” Ọ̀rọ̀ Gíríìkì náà lè tẹnu mọ́ ìrísí òde tàbí fọ́ọ̀mù ohun kan; a yan “ìrísí” láti pa ìtakora rẹ̀ pẹ̀lú “agbára” mọ́.
    reason: lexical_alternative
  - marker: b
    text: A tún lè túmọ̀ rẹ̀ sí “yí ara rẹ̀ kúrò lọ́dọ̀ irú àwọn ènìyàn bẹ́ẹ̀” tàbí “má ṣe bá wọn kẹ́gbẹ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìtumọ̀ yíyí ara ẹni kúrò lọ́dọ̀ wọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: wọ́n ní
  rationale: Ó jẹ́ ọ̀rọ̀-àpèjúwe tí ń tọ́ka sí àwọn ènìyàn tí a ṣàpèjúwe ṣáájú; “wọ́n ní” jẹ́ ọ̀nà Yorùbá tó ṣe kedere, tó sì bá ìtumọ̀ rẹ̀ mu.
- source_word: μόρφωσιν
  choice: ìrísí
  rationale: “Ìrísí” lè tọ́ka sí fọ́ọ̀mù tàbí àfihàn òde, ó sì pa ìyàtọ̀ tó wà láàárín ohun tí ó hàn àti agbára inú mọ́ láìfi ìtumọ̀ tóóró kún un.
- source_word: εὐσεβείας
  choice: ìfọkànsìn sí Ọlọ́run
  rationale: Nínú àwọn lẹ́tà olùṣọ́-àgùntàn, ọ̀rọ̀ náà sábà ń tọ́ka sí ìgbésí ayé ọ̀wọ̀ àti ìfọkànsìn tí a darí sí Ọlọ́run; gbólóhùn yìí ṣe kedere ní Yorùbá òde òní.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: ṣùgbọ́n … agbára rẹ̀
  rationale: Èyí pa ìtakora náà àti arọ́pò-orúkọ tó ń tọ́ka padà sí ìfọkànsìn sí Ọlọ́run mọ́; “agbára” kò fi dandan sọ bóyá iṣẹ́ ìyanu, ìyípadà ìwà, tàbí ohun mìíràn nìkan ni.
- source_word: ἠρνημένοι
  choice: wọ́n ti sẹ́
  rationale: Àmì perfect participle fi hàn pé ìsẹ́ náà ti ṣẹlẹ̀, ipò tí ó yọrí sí sì ṣì dúró; “wọ́n ti sẹ́” mú ìhà yìí jáde lọ́nà àdánidá ní Yorùbá.
- source_word: καὶ τούτους ἀποτρέπου
  choice: yẹra fún irú àwọn ènìyàn bẹ́ẹ̀
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ àṣẹ pé kí ẹni yí ara rẹ̀ kúrò lọ́dọ̀ wọn tàbí kí ó yẹra fún wọn; ìtumọ̀ yìí ṣe kedere, ó sì fi ẹni tí τούτους ń tọ́ka sí hàn.
theological_decisions:
- issue: Ìtakora láàárín ẹ̀sìn tí ó hàn lójú àti òtítọ́ inú rẹ̀
  choice: ìrísí ìfọkànsìn sí Ọlọ́run … agbára rẹ̀
  alternative: àfihàn ìfọkànsìn sí Ọlọ́run … agbára rẹ̀
  rationale: Ìtumọ̀ yìí pa ìtakora Pọ́ọ̀lù mọ́ láàárín àwòrán òde àti agbára tó ń ṣiṣẹ́ nínú ìfọkànsìn tòótọ́. Kò dín “agbára” kù sí iṣẹ́ ìyanu, ìyípadà ìwà, tàbí iṣẹ́ Ẹ̀mí Mímọ́ nìkan, nítorí Gíríìkì fi ọ̀rọ̀ náà sílẹ̀ ní gbòòrò.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún gbogbo ènìyàn. “Ìfọkànsìn sí Ọlọ́run” ni a lò dípò ọ̀rọ̀ tó lè dábàá pé ènìyàn dà bí Ọlọ́run ní ìwà tàbí ìṣà.
