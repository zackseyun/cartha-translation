id: 2TI.3.8
reference: 2 Timothy 3:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: yo
  text: Gẹ́gẹ́ bí Janesi àti Jambresi ti tako Mósè[a], bẹ́ẹ̀ náà ni àwọn ọkùnrin wọ̀nyí ń tako òtítọ́—àwọn ọkùnrin tí èrò inú wọn ti bàjẹ́, tí wọn kò sì yege ní ti ìgbàgbọ́[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kọjú ìjà sí Mósè” ... “kọjú ìjà sí òtítọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ó ṣeé ṣe kí “ìgbàgbọ́” níbí túmọ̀ sí ìgbàgbọ́ Kristẹni tàbí ìhìn tí àwọn aposteli kéde, kì í ṣe ìgbẹ́kẹ̀lé ti ara ẹni nìkan.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: Gẹ́gẹ́ bí
  rationale: Ó fi ìfiwéra hàn lọ́nà àdánidá ní Yorùbá. A kò fi ọ̀rọ̀ àsopọ̀ ọ̀tọ̀ kún un, nítorí δὲ jẹ́ àmì ìlọsíwájú pẹ̀lẹ́ níbí, tí ìtumọ̀ rẹ̀ sì lè wà nínú ìṣàn gbólóhùn náà.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: Janesi àti Jambresi
  rationale: A kọ àwọn orúkọ náà ní ìbámu pẹ̀lú bí èdè Yorùbá ṣe máa ń mú àwọn orúkọ Gíríìkì bá ìró àti ìkọ̀wé rẹ̀ mu.
- source_word: ἀντέστησαν Μωϋσεῖ
  choice: ti tako Mose
  rationale: ‘Tako’ sọ ìdíwọ́ tàbí ìdojúkọ Mose ní kedere, ó sì bá ọ̀rọ̀ ìṣe tó tẹ̀ lé e mu.
- source_word: οὕτως καὶ οὗτοι
  choice: bẹ́ẹ̀ náà ni àwọn ọkùnrin wọ̀nyí
  rationale: Ó pa ìbáṣepọ̀ ìfiwéra mọ́, ó sì sọ akọ tí οὗτοι ń tọ́ka sí ní àyíká ọ̀rọ̀ náà di mímọ̀.
- source_word: ἀνθίστανται τῇ ἀληθείᾳ
  choice: ń tako òtítọ́
  rationale: Àmì ‘ń’ fi ìṣe tí ń lọ lọ́wọ́ hàn. ‘Òtítọ́’ pa ìtúmọ̀ Gíríìkì náà mọ́ láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tóóró sí i.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: àwọn ọkùnrin tí èrò inú wọn ti bàjẹ́
  rationale: ‘Àwọn ọkùnrin’ bá akọ àwọn olùkọ́ èké tí àyíká ọ̀rọ̀ ń tọ́ka sí mu. ‘Ti bàjẹ́’ fi ipò tó jẹ́ àbájáde ìbàjẹ́ hàn, ‘èrò inú’ sì mú ìtumọ̀ νοῦς yé ẹni tí ń ka Yorùbá.
- source_word: ἀδόκιμοι περὶ τὴν πίστιν
  choice: tí wọn kò sì yege ní ti ìgbàgbọ́
  rationale: ‘Kò yege’ fi ìtumọ̀ ẹni tí kò kọjá àyẹ̀wò tàbí tí a kò fọwọ́ sí hàn, ‘ní ti’ sì ṣe iṣẹ́ περί. ‘Ìgbàgbọ́’ dúró ní fífẹ̀ gẹ́gẹ́ bí orísun ṣe rí.
theological_decisions:
- issue: Ohun tí ‘ọ̀títọ́’ àti ‘ìgbàgbọ́’ ń tọ́ka sí
  choice: A fi wọn sílẹ̀ ní fífẹ̀ gẹ́gẹ́ bí ‘ọ̀títọ́’ àti ‘ìgbàgbọ́’; ó ṣeé ṣe kí wọ́n tọ́ka sí ìhìn rere àwọn aposteli àti ẹ̀kọ́ Kristẹni.
  alternative: Kí ‘ọ̀títọ́’ túmọ̀ sí ìwà òtítọ́ lápapọ̀, tàbí kí ‘ìgbàgbọ́’ túmọ̀ sí ìgbẹ́kẹ̀lé ẹni kọ̀ọ̀kan nìkan.
  rationale: Àyíká ọ̀rọ̀ ń sọ̀rọ̀ nípa àwọn olùkọ́ èké tí ń tako ẹ̀kọ́ aposteli, ṣùgbọ́n a kò gbọdọ̀ dín fífẹ̀ ọ̀rọ̀ Gíríìkì náà kù nínú ẹsẹ̀ pàtàkì.
- issue: Bí a ṣe túmọ̀ ἄνθρωποι ní ti akọ
  choice: àwọn ọkùnrin
  alternative: àwọn ènìyàn
  rationale: Ní àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹgbẹ́ àwọn olùkọ́ èké ọkùnrin, nítorí náà a pa akọ orísun náà mọ́.
translation_notes:
  register: Yorùbá àgbàṣe tó ní àmì ohùn ní kíkún, ní èdè àdánidá, ọ̀wọ̀, àti èyí tí òǹkàwé òde òní lè lóye. A lo ‘tako’ lẹ́ẹ̀mejì láti pa ìfarajọ àwọn ọ̀rọ̀ ìṣe Gíríìkì mọ́; a kò sì fi ẹ̀kọ́ ìjọ kan pàtó sínú ìtumọ̀.
