id: 2TI.3.3
reference: 2 Timothy 3:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἄστοργοι, ἄσπονδοι, διάβολοι, ἀκρατεῖς, ἀνήμεροι, ἀφιλάγαθοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/003.yaml
  text: without natural affection[a], irreconcilable, slanderous, without self-control, savage, without love for what is good[c][b],
translation:
  language: yo
  text: tí wọn kò ní ìfẹ́ àdánidá sí àwọn ẹbí wọn, tí kò ṣeé bá làjà[a], tí ń pa ẹlòmíràn lábùkù[b], tí wọn kò lè kó ara wọn níjàánu, tí wọ́n jẹ́ òǹrorò, tí wọn kò nífẹ̀ẹ́ ohun rere[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí kò ṣeé bá parí aáwọ̀,” tàbí “tí wọn ń rú àdéhùn àlàáfíà.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì διάβολοι níbí túmọ̀ sí àwọn olùbanilórúkọ tàbí àwọn tí ń fẹ̀sùn kan ẹlòmíràn; kò tọ́ka sí Èṣù.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “tí wọn kórìíra ohun rere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: tí wọn kò ní ìfẹ́ àbínibí sí àwọn ẹbí wọn
  rationale: Ọ̀rọ̀ náà tọ́ka sí àìní ìfẹ́ àbínibí tí ó yẹ kí ó wà láàárín àwọn ará ilé tàbí ìbátan; fífi “sí àwọn ẹbí wọn” kún un mú ìtumọ̀ yẹn ṣe kedere ní Yorùbá.
- source_word: ἄσπονδοι
  choice: tí wọn kò fẹ́ ṣe àlàáfíà
  rationale: Ó ṣàpèjúwe àwọn tí kò ṣeé bá parí aáwọ̀ tàbí tí kò fẹ́ wọ inú àdéhùn àlàáfíà; yíyan ọ̀rọ̀ yìí kò fi dandan sọ pé wọ́n ti rú àdéhùn kan tẹ́lẹ̀.
- source_word: διάβολοι
  choice: tí wọn ń sọ̀rọ̀ èké sí ẹlòmíràn
  rationale: Ní àkójọ ìwà búburú yìí, ọ̀rọ̀ náà jẹ́ àpèjúwe àwọn af̀ìbàjẹ́ni, kì í ṣe orúkọ Èṣù. Gbólóhùn Yorùbá yìí sọ ìṣe fífi ọ̀rọ̀ èké ba ẹlòmíràn jẹ́ ní kedere.
- source_word: ἀκρατεῖς
  choice: tí wọn kò lè kó ara wọn níjàánu
  rationale: Èyí fi àìní agbára láti ṣàkóso ìfẹ́-ọkàn àti ìhùwàsí ara ẹni hàn ní èdè Yorùbá tó wọ́pọ̀.
- source_word: ἀνήμεροι
  choice: tí wọ́n jẹ́ òǹrorò
  rationale: “Òǹrorò” mú ìtumọ̀ ìwà líle, ìwà ẹranko, àti àìní ìrẹ̀lẹ̀ inú ọ̀rọ̀ Gíríìkì náà jáde lọ́nà adayeba.
- source_word: ἀφιλάγαθοι
  choice: tí wọn kò nífẹ̀ẹ́ ohun rere
  rationale: Ìtumọ̀ tààrà ni pé wọn kò ní ìfẹ́ sí ohun tí ó dára; èyí pa agbára àìní (privative force) mọ́ láì sọ ọ́ di ìkórìíra ní dandan.
theological_decisions:
- issue: Ìtumọ̀ διάβολοι nínú àkójọ ìwà búburú
  choice: àwọn tí ń sọ̀rọ̀ èké sí ẹlòmíràn
  alternative: àwọn èṣù; àwọn tí ìwà wọn dà bí ti Èṣù
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀pọ̀ àpèjúwe ìwà ní àyíká yìí, bí àwọn ọ̀rọ̀ tó yí i ká ṣe rí; nítorí náà, kò tọ́ka sí àwọn ẹ̀mí èṣù tàbí sí Èṣù gẹ́gẹ́ bí ẹni kan.
translation_notes:
  register: A lo Yorùbá boṣewa tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. Àwọn gbólóhùn ìbátan “tí wọn…” pa ìrísí àkójọ náà mọ́, wọ́n sì jẹ́ kí àwọn àpèjúwe Gíríìkì tí ó ṣókí dún bí Yorùbá adayeba. A lo àmì ohùn ní kíkún níbi tí ó ti yẹ.
