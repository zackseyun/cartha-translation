id: 2TI.3.6
reference: 2 Timothy 3:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: yo
  text: Nítorí lára àwọn wọ̀nyí ni àwọn tí ń wọ inú àwọn ilé ní ìkọ̀kọ̀, tí wọ́n sì ń sọ àwọn obìnrin aláìlera[b] di ẹlẹ́wọ̀n[a], àwọn tí ẹ̀ṣẹ̀ ti kó jọ lé lórí[c], tí onírúurú ìfẹ́kúfẹ̀ẹ́ sì ń fà lọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “ń kó ní ìgbèkùn”; ọ̀rọ̀ náà ní àwòrán gbígba ènìyàn ní ìgbèkùn ogun.
    reason: lexical_alternative
  - marker: b
    text: Ní Gíríìkì, “àwọn obìnrin kéékèèké”; ọ̀rọ̀ ìdínkù yìí ní ohùn ẹ̀gàn ní àyíká yìí, ó sì ń tọ́ka sí àwọn obìnrin tí ó rọrùn láti tàn.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “tí ẹ̀ṣẹ̀ kó jọ lé lórí.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: lára àwọn wọ̀nyí
  rationale: Ó fi hàn pé àwọn ènìyàn yìí wà nínú ẹgbẹ́ tí ẹsẹ tó ṣáájú ti ṣàpèjúwe; ọ̀rọ̀ yìí sì bójú mu ní Yorùbá.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: ń yọ́ wọ inú àwọn agbo ilé
  rationale: “Yọ́ wọ” pa ìtumọ̀ wíwọlé ní ìkọ̀kọ̀ tàbí pẹ̀lú ẹ̀tàn mọ́; “agbo ilé” sì tọ́ka sí ilé gẹ́gẹ́ bí àyíká àwọn ènìyàn, kì í ṣe ilé gẹ́gẹ́ bí ilé tí a kọ́ nìkan.
- source_word: αἰχμαλωτίζοντες
  choice: ń sọ ... di ẹlẹ́wọ̀n
  rationale: Ó pa àwòrán gbígba ènìyàn ní ìgbèkùn mọ́, ó sì ṣàfihàn bí àwọn olùkọ́ èké ṣe ń gba agbára lórí wọn.
- source_word: γυναικάρια
  choice: àwọn obìnrin aláìlera
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ ìpè tí ń rẹni sílẹ̀, ó sì ń tọ́ka sí àwọn obìnrin kan tí ó rọrùn láti tàn nínú àyíká yìí, kì í ṣe sí gbogbo obìnrin. Àlàyé ìsàlẹ̀ ojú ìwé pa ìtumọ̀ gangan rẹ̀ mọ́.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: Ẹ̀ṣẹ̀ ti kún lé ... lórí
  rationale: Ó fi ipò tí ẹ̀ṣẹ̀ tí ó ti kójọ ti mú wá hàn, ó sì pa àwòrán ẹrù tí a kó jọ lé ènìyàn lórí mọ́.
- source_word: ἀγόμενα
  choice: ń fà wọ́n lọ
  rationale: Ó fi ipa tí ń darí wọn lọ ní ṣíṣe hàn láì sọ pé a fipá lé wọn kọjá ohun tí ọ̀rọ̀ Gíríìkì sọ.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: onírúurú ìfẹ́kúfẹ̀ẹ́
  rationale: “Ìfẹ́kúfẹ̀ẹ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ìfẹ́ tàbí ìfẹ́-ọkàn líle tí ó ní ìtumọ̀ búburú nínú àyíká ìwà rere yìí; “onírúurú” ṣe aṣojú ποικίλαις.
theological_decisions:
- issue: Ìpè ẹ̀gàn γυναικάρια
  choice: àwọn obìnrin aláìlera
  alternative: àwọn obìnrin kéékèèké
  rationale: Ìtumọ̀ yìí pa ìbáwí àti àìlera àwọn tí àwọn olùkọ́ èké ń tàn mọ́, láì sọ ohun tí ẹsẹ náà kò sọ pé gbogbo obìnrin jẹ́ aláìlera. Àlàyé [b] jẹ́ kí olùkà rí ìtumọ̀ gangan àti ohùn ẹ̀gàn ọ̀rọ̀ náà.
- issue: Ìtumọ̀ κοινωνικὸς ti οἰκίας
  choice: àwọn agbo ilé
  alternative: àwọn ilé
  rationale: “Agbo ilé” mú àyíká ìbáṣepọ̀ àti àwọn ará ilé jáde, ṣùgbọ́n “àwọn ilé” lè tọ́ka sí àwọn ilé tí a kọ́ nìkan.
translation_notes:
  register: Yorùbá ọ̀wọ̀, àkókò-ìsinsìnyí, tí ó ṣe kedere fún gbogbo ènìyàn ni a lò. A lo àmi ohùn ní kíkún níbi tí ó bá yẹ. Ìtòlẹ́sẹẹsẹ gbólóhùn méjì ń jẹ́ kí àwọn àpólà aláṣe Gíríìkì ṣe kedere ní Yorùbá, láì yí ìbáṣepọ̀ wọn padà.
