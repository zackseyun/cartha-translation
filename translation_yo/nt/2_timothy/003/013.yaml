id: 2TI.3.13
reference: 2 Timothy 3:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: yo
  text: Ṣùgbọ́n àwọn ènìyàn búburú àti àwọn afàwọ̀rajà[a] yóò máa lọ síwájú sí ipò tí ó túbọ̀ burú[b], nígbà tí wọ́n ń tan àwọn ẹlòmíràn jẹ, tí a sì ń tan àwọn náà jẹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “àwọn ẹlẹ́tàn” tàbí “àwọn alárèékérekè.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn afàwọ̀rajà tí ń lu jìbìtì; ní àwọn àyíká kan, ó tún lè ní ìtumọ̀ iṣẹ́ idán tàbí iṣẹ́ aláṣekúdórógbó.
    reason: lexical_alternative
  - marker: b
    text: Ní ìtumọ̀ gangan, “wọn yóò tẹ̀ síwájú sínú ohun tí ó burú jù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: búburú
  rationale: Ó ṣàpèjúwe ìwà ìbàjẹ́ àwọn ènìyàn náà, kì í ṣe pé wọn kò dára lásán.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ hàn láàárín àwọn ènìyàn wọ̀nyí àti Tímótì tí a mẹ́nu kàn ṣáájú.
- source_word: ἄνθρωποι
  choice: àwọn ènìyàn
  rationale: Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: γόητες
  choice: àwọn afàwọ̀rajà
  rationale: Ó mú ìtumọ̀ àwọn ẹlẹ́tàn tí ń díbọ́n hàn láì fi dandan sọ pé wọ́n ń ṣe iṣẹ́ òkùnkùn.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: yóò máa burú sí i
  rationale: Ó sọ ìlọsíwájú sí ipò tí ó túbọ̀ burú ní Yorùbá àdánidá, bí ó tilẹ̀ jẹ́ pé ìtumọ̀ gangan ni ‘lọ sí ohun tí ó burú jù.’
- source_word: πλανῶντες
  choice: wọn yóò máa tan àwọn ẹlòmíràn jẹ
  rationale: Ó pa ìṣe tí ń bá a lọ mọ́, ó sì sọ ẹni tí ìtànjẹ náà kan di mímọ̀ ní Yorùbá.
- source_word: πλανώμενοι
  choice: a ó sì máa tan àwọn náà jẹ
  rationale: 'Ó pa fọ́ọ̀mù aláìṣe ti Gíríìkì mọ́: àwọn tí ń tan ẹlòmíràn jẹ náà fúnra wọn ń gba ìtànjẹ.'
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἄνθρωποι tí ó jẹ́ akọ ní gírámà
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Níhìn-ín akọ ọ̀pọ̀ jẹ́ ti gbogbo ènìyàn lápapọ̀, kò sì sí ẹ̀rí pé àwọn ọkùnrin nìkan ni a ń tọ́ka sí.
- issue: Ìtumọ̀ γόητες
  choice: àwọn afàwọ̀rajà
  alternative: àwọn oṣó tàbí àwọn ẹlẹ́tàn
  rationale: Ọ̀rọ̀ náà lè ní òórùn iṣẹ́ idán tàbí iṣẹ́ alárèékérekè ní àwọn àyíká kan, ṣùgbọ́n níhìn-ín ìtànjẹ àti dídíbọ́n ni ó ṣe pàtàkì; a kò gbọ́dọ̀ fi ẹ̀sùn iṣẹ́ òkùnkùn tí àyíká kò fi dandan mú wọlé.
- issue: Ìbáṣepọ̀ πλανῶντες àti πλανώμενοι
  choice: wọn ń tan ẹlòmíràn jẹ, a sì ń tan àwọn náà jẹ
  alternative: wọn ń ṣìnà, wọn sì ń mú ẹlòmíràn ṣìnà
  rationale: A pa ìforígbárí ọ̀rọ̀ inú Gíríìkì mọ́ pé àwọn ẹlẹ́tàn náà tún wà lábẹ́ ìtànjẹ, láì pinnu ẹni tàbí ohun tí ń tan wọn jẹ.
translation_notes:
  register: Yorùbá ìgbàlódé tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. ‘Afàwọ̀rajà’ jẹ́ ọ̀rọ̀ tí ó ṣeé lóye fún ẹni tí ń díbọ́n láti tan ni jẹ; àlàyé ìsàlẹ̀ ojú ìwé pa àwọn ìtumọ̀ míì mọ́. Gbólóhùn náà pa ìṣe tí ń bá a lọ àti fọ́ọ̀mù aláìṣe ìkẹyìn mọ́.
