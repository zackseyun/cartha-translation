id: 2TI.3.2
reference: 2 Timothy 3:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: yo
  text: Nítorí àwọn ènìyàn yóò jẹ́ olùfẹ́ ara ẹni, olùfẹ́ owó, afáráhàn, agbéraga, asọ̀rọ̀-òdì,[a] aláìgbọ́ràn sí òbí, aláìmoore, aláìní ìwà mímọ́,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “asọ̀rọ̀-òdì sí Ọlọ́run” tàbí “abanijẹ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọ̀rọ̀ tí ń tàbùkù sí ènìyàn tàbí sí Ọlọ́run.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: yóò jẹ́
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú ni; ‘yóò jẹ́’ sọ ìtumọ̀ rẹ̀ ní Yorùbá àdánidá.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó so ẹsẹ yìí mọ́ àlàyé tó ṣáájú gẹ́gẹ́ bí ìdí tàbí àlàyé.
- source_word: οἱ ἄνθρωποι
  choice: àwọn ènìyàn
  rationale: Ó tọ́ka sí ènìyàn lápapọ̀, kì í ṣe àwọn ọkùnrin nìkan.
- source_word: φίλαυτοι
  choice: olùfẹ́ ara wọn
  rationale: Ó túmọ̀ sí ìfẹ́ ara ẹni onímọtara-ẹni-nìkan; ọ̀rọ̀ yìí tún pa ìbáradọ́gba àtòjọ náà mọ́.
- source_word: φιλάργυροι
  choice: olùfẹ́ owó
  rationale: Ó pa àwòrán gíríìkì ti ‘fẹ́ owó’ mọ́ dípò fífi gbogbo rẹ̀ rọ́pò pẹ̀lú ‘ojúkòkòrò.’
- source_word: ἀλαζόνες
  choice: afáráhàn
  rationale: ‘Afáráhàn’ jẹ́ ẹni tí ń gbéraga, tí ń fi ara rẹ̀ hàn tàbí yangàn; ó bá ìwà ìṣògo asán tí ọ̀rọ̀ náà ń tọ́ka sí mu.
- source_word: ὑπερήφανοι
  choice: agbéraga
  rationale: Ó fi ìgbéraga àti fífi ara ga ju ẹlòmíràn lọ hàn ní kedere.
- source_word: βλάσφημοι
  choice: asọ̀rọ̀-òdì
  rationale: Ọ̀rọ̀ náà lè jẹ́ ọ̀rọ̀ ẹ̀gàn, ìbanilórúkọjẹ́, tàbí ọ̀rọ̀ tí ń tàbùkù sí Ọlọ́run; àṣàyàn yìí jẹ́ kí ìtúmọ̀ rẹ̀ má ṣe dín sí Ọlọ́run nìkan.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: aláìgbọ́ràn sí òbí
  rationale: Ìtumọ̀ Yorùbá tó ṣe kedere fún àwọn tí kò tẹ̀lé tàbí ṣègbọràn sí òbí.
- source_word: ἀχάριστοι
  choice: aláìmoore
  rationale: Ó túmọ̀ sí ẹni tí kò mọrírì oore tàbí tí kò dúpẹ́.
- source_word: ἀνόσιοι
  choice: aláìmọ́
  rationale: Ní àyíká ẹ̀sìn àti ìwà rere, ó tọ́ka sí àwọn tí kò ní ìwà mímọ́ tàbí ọ̀wọ̀ fún ohun mímọ́.
theological_decisions:
- issue: Ìtọ́kasí gbogbo ènìyàn nínú οἱ ἄνθρωποι
  choice: àwọn ènìyàn
  alternative: àwọn ọkùnrin
  rationale: Ọ̀rọ̀ akọ ní gírámà náà jẹ́ àpapọ̀ fún ènìyàn, kò sì fi ìtumọ̀ rẹ̀ mọ́ akọ nìkan.
- issue: Ìtumọ̀ βλάσφημοι nínú àtòjọ ìwà búburú
  choice: asọ̀rọ̀-òdì
  alternative: asọ̀rọ̀-òdì sí Ọlọ́run; abanijẹ́
  rationale: Gíríìkì lè tọ́ka sí ọ̀rọ̀ tí ń tàbùkù sí ènìyàn tàbí sí Ọlọ́run. Ọ̀rọ̀ àkọ́kọ́ àti àlàyé ìsàlẹ̀ pa ìwọ̀n ìtumọ̀ méjèèjì mọ́ láìyanjú àìdánilójú náà láṣírí.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní ni a lò. Àtòjọ náà jẹ́ ṣókí, ó sì tẹ̀ lé ìró àwọn àpèjúwe Gíríìkì. A lò ‘òbí’ gẹ́gẹ́ bí ọ̀rọ̀ àpapọ̀, ‘aláìmọ́’ sì pa agbára ẹ̀sìn àti ìwà rere ti ἀνόσιοι mọ́.
