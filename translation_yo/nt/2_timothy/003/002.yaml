revisions:
- from: Nítorí àwọn ènìyàn yóò jẹ́ olùfẹ́ ara wọn, olùfẹ́ owó, afáráhàn, agbéraga, asọ̀rọ̀-òdì,[a] aláìgbọ́ràn sí òbí, aláìmoore, aláìmọ́,
  to: Nítorí àwọn ènìyàn yóò jẹ́ olùfẹ́ ara ẹni, olùfẹ́ owó, afáráhàn, agbéraga, asọ̀rọ̀-òdì,[a] aláìgbọ́ràn sí òbí, aláìmoore, aláìní ìwà mímọ́,
  rationale: The revision corrects the mistranslation of ἀνόσιοι with “aláìní ìwà mímọ́,” which conveys unholiness/impiety without importing the unrelated idea of ignorance. It also replaces the potentially reciprocal “ara wọn” with “ara ẹni” for the reflexive self-love of φίλαυτοι. The remaining wording and the lexical-alternative footnote are retained because they faithfully preserve the Greek list and the semantic breadth of βλάσφημοι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:55Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the future explanatory clause and the vice-list structure well. However, “aláìmọ́” ordinarily means “ignorant/unlearned,” not ἀνόσιοι (“unholy,” “impious,” lacking reverence for what is sacred), so it materially changes the final item. “Olùfẹ́ ara wọn” can suggest mutual love among the people rather than self-love; “ara ẹni” preserves the Greek reflexive sense.
  naturalness: The list is generally clear and appropriately concise in Standard Yoruba. “Olùfẹ́ ara ẹni” is less ambiguous than “olùfẹ́ ara wọn.” “Aláìní ìwà mímọ́” is a natural, explicit rendering of the final moral-religious descriptor.
  terminology: “Àwọn ènìyàn,” “olùfẹ́ owó,” “afáráhàn,” “agbéraga,” “aláìgbọ́ràn sí òbí,” and “aláìmoore” adequately convey their respective Greek terms. The wording for βλάσφημοι is retained with a footnote because its referent may be human or divine; the final term is corrected to avoid equating impiety with ignorance.
  issues:
  - severity: high
    issue: “Aláìmọ́” for ἀνόσιοι
    rationale: In ordinary Yoruba, aláìmọ́ denotes an ignorant or uneducated person. The Greek denotes impious/unholy persons—those lacking holiness or reverence for sacred things. The present rendering therefore misses the source sense.
  - severity: medium
    issue: “Olùfẹ́ ara wọn” for φίλαυτοι
    rationale: Ara wọn may naturally be read as “one another/themselves” in reference to the group, introducing ambiguity. Ara ẹni directly expresses self-love and retains the vice-list’s intended sense.
  revised_text: Nítorí àwọn ènìyàn yóò jẹ́ olùfẹ́ ara ẹni, olùfẹ́ owó, afáráhàn, agbéraga, asọ̀rọ̀-òdì,[a] aláìgbọ́ràn sí òbí, aláìmoore, aláìní ìwà mímọ́,
  revised_footnotes:
  - marker: a
    text: Tàbí “asọ̀rọ̀-òdì sí Ọlọ́run” tàbí “abanijẹ́.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ọ̀rọ̀ tí ń tàbùkù sí ènìyàn tàbí sí Ọlọ́run.
    reason: lexical_alternative
  revision_rationale: The revision corrects the mistranslation of ἀνόσιοι with “aláìní ìwà mímọ́,” which conveys unholiness/impiety without importing the unrelated idea of ignorance. It also replaces the potentially reciprocal “ara wọn” with “ara ẹni” for the reflexive self-love of φίλαυτοι. The remaining wording and the lexical-alternative footnote are retained because they faithfully preserve the Greek list and the semantic breadth of βλάσφημοι.
