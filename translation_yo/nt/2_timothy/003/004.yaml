translation:
  language: yo
  text: àwọn ọ̀dàlẹ̀[a], àwọn akánjúṣe[b], àwọn agbéraga[c], àwọn olùfẹ́ ìgbádùn ju àwọn olùfẹ́ Ọlọ́run lọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn afinihàn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn aláìronú” tàbí “àwọn alágídí.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “àwọn tí a ti fẹ́ sókè.” Ní tààrà, “àwọn tí a ti mú kí wọ́n wú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προδόται
  choice: àwọn ọ̀dàlẹ̀
  rationale: Ọ̀rọ̀ yìí túmọ̀ sí àwọn tó ń fi ẹlòmíràn hàn tàbí tó ń hùwà àìṣòótọ́ sí ẹni tí wọ́n yẹ kí wọ́n dúró tì; “àwọn ọ̀dàlẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì ní ìwọ̀n ẹ̀sùn inú àkójọ ìwà búburú yìí.
- source_word: προπετεῖς
  choice: àwọn aláìbìkítà
  rationale: Ó ṣàpèjúwe àwọn tó ń ṣe nǹkan lójijì láìronú nípa ewu tàbí àbájáde rẹ̀. “Àwọn aláìbìkítà” jẹ́ èdè òde òní tó ṣeé lóye, bí ó tilẹ̀ jẹ́ pé “àwọn akánjúṣe” tún lè mú apá ìkánjú inú ọ̀rọ̀ náà jáde.
- source_word: τετυφωμένοι
  choice: àwọn tí ìgbéraga ti wú
  rationale: Ìṣe aláìpé pípé tí ó wà ní ohùn àfarawà yìí ní ìtumọ̀ àkàwé bí ẹni pé wọ́n ti wú, ó sì ń tọ́ka sí ìgbéraga. Ìtumọ̀ yìí pa àwòrán Gíríìkì náà mọ́ ní Yorùbá adayébá.
- source_word: φιλήδονοι
  choice: àwọn olùfẹ́ adùn ayé
  rationale: Ọ̀rọ̀ àkópọ̀ náà túmọ̀ sí àwọn tó fẹ́ ìgbádùn. “Adùn ayé” sọ ìgbádùn ti ara tàbí ti ìgbésí ayé ní kedere, ó sì bá “olùfẹ́ Ọlọ́run” ṣe ìfiwéra.
- source_word: μᾶλλον ἢ
  choice: ju ... lọ
  rationale: Ìkọ̀lé afíwé Yorùbá “ju ... lọ” pa ìtumọ̀ pé wọ́n fẹ́ ohun kan jù òmíràn lọ mọ́, láìfi dandan yanjú rẹ̀ sí ìyàsọ́tọ̀ pátápátá.
- source_word: φιλόθεοι
  choice: olùfẹ́ Ọlọ́run
  rationale: Ó túmọ̀ sí ẹni tó fẹ́ Ọlọ́run. Ìtumọ̀ yìí pa ìbáradọ́gba ọ̀rọ̀ mọ́ pẹ̀lú “olùfẹ́ adùn ayé.”
theological_decisions:
- issue: Bí a ṣe lè pa ìbáradọ́gba àwọn ọ̀rọ̀ àkópọ̀ ìfẹ́ méjèèjì àti àkàwé ìgbéraga mọ́ láìfi ẹ̀kọ́ ìsìn míì kún un
  choice: “àwọn olùfẹ́ adùn ayé ju olùfẹ́ Ọlọ́run lọ” àti “àwọn tí ìgbéraga ti wú”
  alternative: “àwọn tó fẹ́ ìgbádùn dípò Ọlọ́run” àti “àwọn agbéraga”
  rationale: Àṣàyàn náà pa ìfiwéra μᾶλλον ἢ àti ìṣọ̀kan φιλήδονοι/φιλόθεοι mọ́, ó sì tún pa àwòrán τετυφωμένοι mọ́. Kò sọ pé wọn kò ní ìfẹ́ Ọlọ́run rárá ju bí Gíríìkì ti sọ lọ, bẹ́ẹ̀ ni kò fi ìtumọ̀ ẹ̀kọ́ ìsìn tuntun kún àkójọ ìwà náà.
translation_notes:
  register: Èdè Yorùbá àpéjọ tó ní iyì, tó ṣeé lóye fún òǹkàwé òde òní. A tún “àwọn” ṣe láti jẹ́ kí àkójọ àwọn orúkọ àti àpèjúwe ènìyàn ṣàn dáadáa ní Yorùbá. Àmì ohùn ni a lò níbi tó yẹ.
