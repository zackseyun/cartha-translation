source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: yo
  text: Lúùkù nìkan ló wà pẹ̀lú mi. Kó Máàkù bá ọ wá, nítorí ó wúlò fún mi fún iṣẹ́ ìsìn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “fún iṣẹ́ ìránṣẹ́.” Ọ̀rọ̀ Gíríìkì διακονία lè túmọ̀ sí iṣẹ́ ìsìn ní gbogbogbòò.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: Lúùkù
  rationale: Orúkọ náà ni a ṣe àfọwọkọ rẹ̀ sí ìrísí Yorùbá tí ó wọ́pọ̀ nínú Bíbélì.
- source_word: μόνος
  choice: nìkan
  rationale: Ó fi hàn pé Lúùkù nikan ni alábàákẹ́gbẹ́ tí ó wà lọ́dọ̀ Pọ́ọ̀lù nígbà náà.
- source_word: μετ’ ἐμοῦ
  choice: wà pẹ̀lú mi
  rationale: Ó túmọ̀ sí jíjẹ́ alábàákẹ́gbẹ́ tàbí wíwà lọ́dọ̀ ẹni; èyí jẹ́ ọ̀nà àdánidá ní Yorùbá.
- source_word: Μᾶρκον
  choice: Máàkù
  rationale: Orúkọ náà ni a ṣe àfọwọkọ rẹ̀ sí ìrísí Yorùbá tí ó wọ́pọ̀ nínú Bíbélì.
- source_word: ἀναλαβὼν
  choice: Mú Máàkù dání
  rationale: Ó pa ìtumọ̀ gbígbé Máàkù lọ́wọ́ tàbí kíkó o mọ́ra kí ó lè bá Tímótì rìn, ó sì ṣáájú àṣẹ pàtàkì náà.
- source_word: ἄγε
  choice: mú un wá
  rationale: Nínú àyíká ìrìn-àjò yìí, ọ̀rọ̀ náà jẹ́ àṣẹ láti mú Máàkù wá sí ọ̀dọ̀ Pọ́ọ̀lù.
- source_word: μετὰ σεαυτοῦ
  choice: pẹ̀lú rẹ
  rationale: Ó sọ pé Máàkù yóò bá Tímótì wá; gbólóhùn náà rọrùn, ó sì bá Yorùbá mu.
- source_word: εὔχρηστος
  choice: ó wúlò
  rationale: Ó ṣàfihàn ẹni tí ó lè ṣe ìrànlọ́wọ́ tàbí tí iṣẹ́ rẹ̀ ní èrè, láìsọ ènìyàn di ohun èlò lásán.
- source_word: γάρ μοι
  choice: nítorí ó wúlò fún mi
  rationale: Ó pa agbára ìdí tí γάρ ní mọ́, ó sì fi μοι hàn gẹ́gẹ́ bí ìtọ́kasí sí Pọ́ọ̀lù.
- source_word: εἰς διακονίαν
  choice: nínú iṣẹ́ ìránṣẹ́
  rationale: Ìtumọ̀ yìí lè bo iṣẹ́ ìránṣẹ́ ní gbogbogbòò àti iṣẹ́ ìránṣẹ́ ìjọ, láìfi ipò iṣẹ́ pàtó kún ọ̀rọ̀ náà.
theological_decisions:
- issue: Ìtumọ̀ διακονία nínú ọ̀rọ̀ Pọ́ọ̀lù nípa bí Máàkù ṣe wúlò
  choice: iṣẹ́ ìránṣẹ́
  alternative: iṣẹ́ òjíṣẹ́
  rationale: διακονία lè jẹ́ iṣẹ́ sísìn ní ìtumọ̀ gbígbòòrò tàbí iṣẹ́ ìjọ. “Iṣẹ́ ìránṣẹ́” pa ìwọ̀n ìtumọ̀ náà mọ́, kò sì sọ ọ́ di ipò òjíṣẹ́ pàtó.
translation_notes:
  register: Yorùbá àgbéléwọ̀n, ọ̀wọ̀, àti èdè òde òní ni a lò. A pa ìtẹ̀síwájú ἀναλαβὼν sí ἄγε mọ́ pẹ̀lú “Mú ... dání, kí o sì mú un wá,” a sì lo “iṣẹ́ ìránṣẹ́” láti yẹra fún dídín διακονία kù sí ipò ẹ̀sìn pàtó.
