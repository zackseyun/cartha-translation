    issue: 'The main clause uses an active construction: “èmi ti ń dà ... sílẹ̀.”'
    rationale: 'This reverses the participant role of σπένδομαι: Paul is depicted as being poured out, not as pouring out an offering.'
  - severity: medium
    issue: “Ọrẹ ohun mímu” is insufficiently explicit for the sacrificial libation image.
    rationale: “Ẹbọ ohun mímu” more clearly communicates the cultic/sacrificial sense conveyed by σπένδομαι while retaining the metaphor.
  - severity: low
    issue: Footnote a repeats the active-agent problem.
    rationale: Its alternative should likewise say that Paul is being poured out.
