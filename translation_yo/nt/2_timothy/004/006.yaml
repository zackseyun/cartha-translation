- from: Nítorí èmi ti ń dà jáde bí ọrẹ ohun mímu sílẹ̀ báyìí[a], àkókò ìlọkúrò mi sì ti dé[b].
  to: Nítorí a ti ń tú mi sílẹ̀ gẹ́gẹ́ bí ẹbọ ohun mímu[a], àkókò ìlọkúrò mi sì ti dé[b].
  rationale: The correction restores the source text’s passive/middle sense for σπένδομαι and makes its libation imagery explicit in standard, contemporary Yoruba. It leaves the temporal and departure metaphors intact, including the ambiguity of ἀνάλυσις reflected in the footnote.
