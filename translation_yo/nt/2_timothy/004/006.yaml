id: 2TI.4.6
reference: 2 Timothy 4:6
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: yo
  text: Nítorí a ti ń tú mi sílẹ̀ gẹ́gẹ́ bí ẹbọ ohun mímu[a], àkókò ìlọkúrò mi sì ti dé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “a ti ń tú mi sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà ń mú àwòrán ẹbọ ohun mímu tí a ń dà sílẹ̀ gẹ́gẹ́ bí ìrúbọ wá sí ọkàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìtúsílẹ̀” tàbí “ìtúká.” “Ìlọkúrò” jẹ́ ọ̀nà àdánidá láti tọ́ka sí ikú níhìn-ín.
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: ń dà jáde bí ọrẹ ohun mímu sílẹ̀
  rationale: Ọ̀rọ̀ náà ń fi àwòrán ọrẹ ohun mímu tí a ń dà sílẹ̀ hàn. Gbólóhùn yìí pa àwòrán ìrúbọ mọ́ láì sọ ọ́ di àlàyé pé ikú Pọ́ọ̀lù nìkan ni.
- source_word: ἤδη
  choice: báyìí
  rationale: Ó fi hàn pé ìṣe náà ti ń lọ lọ́wọ́lọ́wọ́, nígbà tí ikú Pọ́ọ̀lù sún mọ́lé.
- source_word: καιρός
  choice: àkókò
  rationale: Níhìn-ín, ó tọ́ka sí àsìkò pàtàkì tí ó ti dé, kì í ṣe àkókò lápapọ̀.
- source_word: ἀναλύσεώς
  choice: ìlọkúrò
  rationale: Ó jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ nípa kíkúrò nínú ayé, ó sì pa ìtumọ̀ 'departure' mọ́; àkọsílẹ̀ ìsàlẹ̀ ṣàfihàn ìtumọ̀ míì ti ìtúsílẹ̀ tàbí ìtúká.
- source_word: ἐφέστηκεν
  choice: ti dé
  rationale: Perfect náà fi hàn pé àsìkò náà ti dé, ipò yẹn sì wà nísinsìnyí.
- source_word: γὰρ
  choice: Nítorí
  rationale: Ó pa ìbáṣepọ̀ àlàyé pẹ̀lú ọ̀rọ̀ tó ṣáájú mọ́.
theological_decisions:
- issue: Àpèjúwe ikú Pọ́ọ̀lù nípasẹ̀ àwòrán ìrúbọ
  choice: A pa àwòrán ọrẹ ohun mímu àti ọ̀rọ̀ ìlọkúrò mọ́.
  alternative: Kí a túmọ̀ rẹ̀ ní tààrà pé, ‘Mo ti fẹ́ kú báyìí.’
  rationale: Àpapọ̀ σπένδομαι àti ἀνάλυσις tọ́ka gidigidi sí ikú tó sún mọ́lé, ṣùgbọ́n títúmọ̀ àwòrán náà fúnra rẹ̀ ń pa ìfọ̀rọ̀wérọ̀ àti agbára ọ̀rọ̀ Gíríìkì mọ́ láì sọ ìtumọ̀ onítúmọ̀ di ara ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo ‘ọrẹ ohun mímu’ fún èdè ìrúbọ, a sì yàgò fún pípa àwòrán náà rẹ́ sí ‘mo fẹ́ kú.’ Àwọn àmì ohùn ni a lò ní kíkún níbi tí ó bá bá ìlò àdánidá mu.
