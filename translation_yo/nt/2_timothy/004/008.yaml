id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: yo
  text: Láti ìsinsìnyí lọ, adé òdodo[a] ni a ti yà sọ́tọ̀ fún mi, tí Olúwa, Onídàájọ́ òdodo, yóò fún mi ní ọjọ́ náà—kì í sì í ṣe fún èmi nìkan, ṣùgbọ́n fún gbogbo àwọn tí wọ́n ti nífẹ̀ẹ́ ìfarahàn rẹ̀ pẹ̀lú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “adé ìdájọ́ tó tọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “òdodo” tàbí, ní àwọn àyíká kan, “ìdájọ́ tó tọ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: Láti ìsinsìnyí lọ
  rationale: Ó fi ohun tí ó ṣẹ́ kù síwájú Pọ́ọ̀lù hàn lẹ́yìn tí ó ti parí eré-ìje rẹ̀; ó mú ìtumọ̀ àkókò náà jáde ní Yorùbá àdánidá.
- source_word: ἀπόκειταί
  choice: a ti fi ... pamọ́ fún mi
  rationale: Ó tọ́ka sí ohun tí a ti yà sọ́tọ̀ tàbí tí a pa mọ́ de ẹnì kan, ó sì pa ìtumọ̀ ipò tí ó wà nísinsìnyí mọ́.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: adé òdodo
  rationale: Ó pa ìsopọ̀ orúkọ inú Gíríìkì mọ́ láì pinnu bóyá òdodo ni adé náà jẹ́, bóyá nítorí òdodo ni a fi ń fúnni, tàbí bóyá ó ní í ṣe pẹ̀lú ìdáláre.
- source_word: δικαιοσύνης
  choice: òdodo
  rationale: “Òdodo” ni ọ̀rọ̀ Yorùbá tó bójú mu jù fún δικαιοσύνη ní àyíká yìí, bí ó tilẹ̀ jẹ́ pé ó tún lè ní ìtumọ̀ ìdájọ́ tí ó tọ́.
- source_word: ἀποδώσει
  choice: yóò fi fún mi
  rationale: Ó sọ fífi ohun tí ó tọ́ sí ẹni náà fún un; gbólóhùn yìí bá àwòrán adé ẹni tó ṣẹ́gun mu láì mú ìtumọ̀ ìjìyà wọlé.
- source_word: ὁ δίκαιος κριτής
  choice: Onídàájọ́ òdodo
  rationale: Ó jẹ́ àpèjúwe appositional tí ó sọ bí Olúwa ṣe jẹ́ nínú ìdájọ́ rẹ̀.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: gbogbo àwọn tí wọ́n ti nífẹ̀ẹ́
  rationale: Àkókò perfect participle náà ń fi ìfẹ́ tí ó ti wà tí ó sì ń bá a lọ hàn; “tí wọ́n ti nífẹ̀ẹ́” pa apá yìí mọ́.
- source_word: ἐπιφάνειαν
  choice: ìfarahàn
  rationale: Ó jẹ́ ìtumọ̀ tààrà tí ó pa èrò fífi ara hàn ní kedere mọ́ láì sọ ọ́ di “wíwá” lásán.
theological_decisions:
- issue: Ìtumọ̀ “adé òdodo”
  choice: A pa gbólóhùn genitive náà mọ́ láì yanjú irú ìbáṣepọ̀ tó wà láàárín adé àti òdodo.
  alternative: Adé tí a fi ń san ẹ̀san fún òdodo; adé tí ó jẹ́ òdodo; adé ìdáláre tàbí ìdájọ́ òdodo.
  rationale: Gíríìkì gba àwọn ìtumọ̀ wọ̀nyí láàyè, nítorí náà kò yẹ kí ìtumọ̀ Yorùbá yan ọ̀kan níbi tí ẹsẹ náà kò ti yan án ní kedere.
- issue: Ẹni tí “Olúwa” ń tọ́ka sí
  choice: A fi “Olúwa” sílẹ̀ gẹ́gẹ́ bí orúkọ oyè inú Gíríìkì; àyíká “ìfarahàn rẹ̀” ń tọ́ka sí Jesu Kristi.
  alternative: Ọlọ́run ní ìtumọ̀ gbogbogbò.
  rationale: Lílo “ìfarahàn” nínú àwọn lẹ́tà olùṣọ́-àgùntàn ń tọ́ka gidigidi sí Kristi, ṣùgbọ́n a kò fi àlàyé náà rọ́pò ọ̀rọ̀ “Olúwa” nínú ẹsẹ.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn ní kíkún. “A ti fi ... pamọ́” jẹ́ ọ̀nà àdánidá láti sọ ipò ohun tí a ti yà sọ́tọ̀ de ẹnì kan; “ìfarahàn” sì pa èdè ẹ̀kọ́ ìgbà ìkẹyìn mọ́ láì di ọ̀rọ̀ àjèjì.
