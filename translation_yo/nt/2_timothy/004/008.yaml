  to: Láti ìsinsìnyí lọ, adé òdodo[a] ni a ti yà sọ́tọ̀ fún mi, tí Olúwa, Onídàájọ́ òdodo, yóò fún mi ní ọjọ́ náà—kì í sì í ṣe fún èmi nìkan, ṣùgbọ́n fún gbogbo àwọn tí wọ́n ti nífẹ̀ẹ́ ìfarahàn rẹ̀ pẹ̀lú.
