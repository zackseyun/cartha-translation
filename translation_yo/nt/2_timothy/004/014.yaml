source:
  edition: SBLGNT
  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: yo
  text: Alẹkisáńdà oníṣẹ́ irin[a] ṣe ọ̀pọ̀lọpọ̀ ohun búburú sí mi[b]; Olúwa yóò san ẹ̀san fún un gẹ́gẹ́ bí àwọn iṣẹ́ rẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Alẹkisáńdà alágbẹ̀dẹ bàbà.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ó ṣe mí ní ibi púpọ̀.”
    reason: lexical_alternative
  - marker: c
    text: Àwọn àfọwọ́kọ kan kà á pé, “Kí Olúwa san ẹ̀san fún un gẹ́gẹ́ bí àwọn iṣẹ́ rẹ̀.”
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: oníṣẹ́ irin
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹni tí ń fi irin onírúurú ṣe iṣẹ́, ní pàtàkì bàbà tàbí idẹ. “Oníṣẹ́ irin” jẹ́ èdè Yorùbá òde òní tí ó ṣe kedere láì fi dandan sọ irú irin pàtó tí Gíríìkì kò mú dájú.
- source_word: πολλά μοι κακὰ
  choice: ṣe ọ̀pọ̀lọpọ̀ ohun búburú sí mi
  rationale: Èyí pa ìtumọ̀ κακά gẹ́gẹ́ bí “àwọn ohun búburú” mọ́, ó sì sọ ìbáṣepọ̀ dative μοι ní ọ̀nà Yorùbá àdánidá. Àṣàyàn “ṣe mí ní ibi púpọ̀” wà nínú àlàyé ìsàlẹ̀ gẹ́gẹ́ bí ọ̀nà tí ó túmọ̀ sí ìpalára ní tààrà.
- source_word: ἐνεδείξατο
  choice: ṣe … sí mi
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífi tàbí ṣíṣe àwọn ohun búburú sí ẹnì kan. “Ṣe … sí mi” jẹ́ àdánidá ní Yorùbá, ó sì yẹra fún gbólóhùn líle tí ìtumọ̀ rẹ̀ yóò jẹ́ “fi hàn.”
- source_word: ἀποδώσει
  choice: yóò san án padà fún un
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ future indicative, ó sì ń sọ ìsanpadà tàbí ẹ̀san iṣẹ́. “Yóò san án padà fún un” mú ìtumọ̀ ìdájọ́ àti ìsanwó padà jáde ní Yorùbá àdánidá.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tí ó fìdí múlẹ̀ fún κύριος; bí ó tilẹ̀ jẹ́ pé Yorùbá kò nílò article ọ̀tọ̀ níbí, orúkọ náà dá ẹni tí a ń tọ́ka sí mọ̀.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: gẹ́gẹ́ bí àwọn iṣẹ́ rẹ̀
  rationale: Èyí tẹ̀lé ọ̀rọ̀ Gíríìkì ní pẹkipẹki, ó sì pa èrò ìsanpadà tí ó bá iṣẹ́ ẹni mu mọ́. Ọ̀pọ̀ “àwọn iṣẹ́” tún bá plural ἔργα mu.
theological_decisions:
- issue: Bóyá ἀποδώσει jẹ́ àsọjáde ọjọ́ iwájú tàbí àdúrà pé kí Olúwa san án padà
  choice: Olúwa yóò san án padà fún un
  alternative: Kí Olúwa san án padà fún un
  rationale: Nínú SBLGNT, ἀποδώσει jẹ́ future indicative, kì í ṣe optative tàbí imperative. Nítorí náà, ọ̀rọ̀ inú ẹsẹ̀ jẹ́ ìkéde nípa ìsanpadà Ọlọ́run; àyípadà àfọwọ́kọ tí ó jẹ́ ìfẹ́ tàbí àdúrà ni a pa mọ́ sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpéjọ tí ó ní àmì ohùn ní kíkún, ó ní iyì ṣùgbọ́n ó rọrùn fún òǹkàwé òde òní. A lo “oníṣẹ́ irin” dípò ọ̀rọ̀ tí yóò dín χαλκεὺς kù sí bàbà nìkan, a sì yàn gbólóhùn àdánidá “ṣe … sí mi” dípò títẹ̀lé idiom Gíríìkì ní ọ̀rọ̀-lẹ́-ọ̀rọ̀.
