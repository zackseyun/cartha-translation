id: 2TI.4.21
reference: 2 Timothy 4:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: yo
  text: Ṣe gbogbo ìsapá láti wá kí ìgbà òtútù tó dé. Ébúlusì kí ọ; bẹ́ẹ̀ sì ni Púdẹ́nsì, Línúsì, Kíláúdíà àti gbogbo àwọn arákùnrin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn arákùnrin àti arábìnrin,” tàbí “gbogbo àwọn onígbàgbọ́.” Ọ̀rọ̀ Gíríìkì sọ pé “àwọn arákùnrin,” ṣùgbọ́n ní àyíká yìí ó lè tọ́ka sí gbogbo àwùjọ àwọn onígbàgbọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Ṣe gbogbo ipá rẹ
  rationale: Ọ̀rọ̀ àṣẹ yìí ń tọ́ka sí ìtara àti ìkánjú. Gbólóhùn yìí jẹ́ èdè Yorùbá àdánidá tí ó fi méjèèjì hàn láìsọ ọ̀rọ̀ Gíríìkì di gbólóhùn líle.
- source_word: πρὸ χειμῶνος
  choice: kí ìgbà òtútù tó dé
  rationale: πρό pẹ̀lú ọ̀rọ̀ inú genitive túmọ̀ sí ṣáájú àkókò kan. Èyí sọ ‘ṣáájú ìgbà òtútù’ ní ọ̀nà tí ó ṣe kedere, tí ó sì bá èdè Yorùbá mu.
- source_word: ἐλθεῖν
  choice: láti wá
  rationale: Infinitive náà ń parí ìtumọ̀ Σπούδασον, ó sì ń sọ nípa Tímótì wíwá sọ́dọ̀ Pọ́ọ̀lù. ‘Wá’ pa ìtọ́kasí ibi tí olùsọ wà mọ́.
- source_word: Ἀσπάζεταί σε
  choice: kí ọ
  rationale: Nínú lẹ́tà, ἀσπάζομαι jẹ́ kíkí ẹni. ‘Kí ọ’ jẹ́ ọ̀nà ṣókí, àdánidá, tí ó sì bá àṣà lẹ́tà mu ní Yorùbá.
- source_word: Εὔβουλος
  choice: Ébúlusì
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìbámu pẹ̀lú ìró Gíríìkì àti ìlànà ìkọ̀wé Yorùbá.
- source_word: Πούδης
  choice: Púdẹ́nsì
  rationale: A ṣe àkọsílẹ̀ orúkọ ẹni náà gẹ́gẹ́ bí orúkọ àjèjì ní èdè Yorùbá.
- source_word: Λίνος
  choice: Línúsì
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ọ̀nà tí ó bá ìró orísun àti ìkọ̀wé Yorùbá mu.
- source_word: Κλαυδία
  choice: Kíláúdíà
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ọ̀nà tí ó lè ṣe é kà ní èdè Yorùbá, láìtúmọ̀ orúkọ náà.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: gbogbo àwọn arákùnrin
  rationale: ἀδελφοί jẹ́ ọ̀rọ̀ akọ ní ọ̀pọ̀, ‘àwọn arákùnrin’ sì pa irú èdè orísun náà mọ́. Ní àyíká ìjọ, ó tún lè tọ́ka sí gbogbo àwọn onígbàgbọ́, nítorí náà a fi àṣàyàn tí ó gba obìnrin pẹ̀lú sínú àlàyé ìsàlẹ̀.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἀδελφοί nígbà tí ó ṣeé ṣe kí ẹgbẹ́ náà ní ọkùnrin àti obìnrin
  choice: gbogbo àwọn arákùnrin
  alternative: gbogbo àwọn arákùnrin àti arábìnrin; gbogbo àwọn onígbàgbọ́
  rationale: Ọ̀rọ̀ Gíríìkì jẹ́ akọ ní ọ̀pọ̀, nítorí náà ọ̀rọ̀ inú ẹsẹ̀ pa ìrísí yẹn mọ́. Síbẹ̀, lílo rẹ̀ láàárín àwọn Kristẹni lè gba gbogbo àwùjọ onígbàgbọ́, a sì pa ìtumọ̀ yẹn mọ́ nínú àlàyé ìsàlẹ̀ dípò kí a yanju àìdánilójú náà láìsọ.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọlọ́lá, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo àmì ohùn níbi tí ó yẹ, a sì yan gbólóhùn àdánidá dípò títẹ̀lé ìṣètò ọ̀rọ̀ Gíríìkì ní kíkankíkan.
