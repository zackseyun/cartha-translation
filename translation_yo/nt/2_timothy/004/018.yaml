  to: Olúwa yóò gbà mí kúrò lọ́wọ́ gbogbo iṣẹ́ búburú, yóò sì mú mi dé ìjọba rẹ̀ ti ọ̀run láìléwu.[a] Kí ògo jẹ́ ti òun láéláé àti láéláé.[b] Àmín.
  rationale: A ṣàtúnṣe gbolohun ìyìn náà sí Yorùbá tí ó rọrùn, tí ó sì dúró ṣinṣin pẹ̀lú ᾧ ἡ δόξα. A ṣàtúnṣe àlàyé àkọsílẹ̀ ìsàlẹ̀ [b] nìkan; a pa ìtumọ̀ gangan ti ìsọ̀rí àkókò Gíríìkì mọ́. Gbogbo ìyókù fi ìtumọ̀ orísun àti ìdí audit Gẹ̀ẹ́sì hàn dáadáa.
