id: 2TI.4.18
reference: 2 Timothy 4:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: yo
  text: Olúwa yóò gbà mí kúrò lọ́wọ́ gbogbo iṣẹ́ búburú, yóò sì mú mi dé ìjọba rẹ̀ ti ọ̀run láìléwu.[a] Kí ògo jẹ́ ti òun láéláé àti láéláé.[b] Àmín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “yóò sì gbà mí là sínú ìjọba rẹ̀ ti ọ̀run.”
    reason: lexical_alternative
  - marker: b
    text: 'Ní ìtumọ̀ gangan: “sí àwọn ayé àwọn ayé.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: yóò gbà mí kúrò lọ́wọ́
  rationale: Ọ̀rọ̀ yìí fi ìgbàlà kúrò nínú ewu hàn; ‘gbà ... kúrò lọ́wọ́’ jẹ́ ọ̀nà Yorùbá àdánidá tí ó mú ìtumọ̀ ìdáǹdè náà jáde.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: kúrò lọ́wọ́ gbogbo iṣẹ́ búburú
  rationale: ‘Iṣẹ́ búburú’ lè túmọ̀ sí gbogbo ìṣe tàbí iṣẹ́ tí ó burú, ó sì pa irú àìdájú tí ọ̀rọ̀ Gíríìkì ní mọ́.
- source_word: σώσει εἰς
  choice: yóò sì mú mi dé ... láìléwu
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà tọ́ka sí pípa ẹni mọ́ àti mímú un wọ ibi àfojúsùn; gbolohun yìí jẹ́ Yorùbá àdánidá, ó sì pa ìtumọ̀ ìgbàlà àti dídé sí ìjọba náà mọ́.
- source_word: εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: dé ìjọba rẹ̀ ti ọ̀run
  rationale: ‘Dé’ fi ìlọsíwájú sí ibi àfojúsùn tí εἰς ní hàn; ‘ìjọba rẹ̀ ti ọ̀run’ sọ ἐπουράνιον ní kedere.
- source_word: ᾧ ἡ δόξα
  choice: Òun ni kí ògo jẹ́ tirẹ̀
  rationale: Èyí jẹ́ ọ̀rọ̀ ìyìn ọlọ́wọ̀ tí ó bá Yorùbá mu, tí ó sì fi fífi ògo fún Olúwa hàn.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: láéláé àti láéláé
  rationale: Èyí ni ọ̀nà Yorùbá àdánidá láti sọ ìtumọ̀ àkókò tí kò ní òpin, nígbà tí àkọsílẹ̀ ìsàlẹ̀ ṣàfihàn ìtumọ̀ gangan.
- source_word: ἀμήν
  choice: Àmín
  rationale: A lo àkọsílẹ̀ Yorùbá tí ó wọ́pọ̀ fún ọ̀rọ̀ ìfẹsẹ̀múlẹ̀ ìjọsìn yìí.
theological_decisions:
- issue: Ìbáṣepọ̀ tó wà láàárín ìdáǹdè lọ́wọ́ ibi àti ìgbàlà ìkẹyìn
  choice: A túmọ̀ ῥύσεταί gẹ́gẹ́ bí ìdáǹdè kúrò lọ́wọ́ gbogbo iṣẹ́ búburú, àti σώσει εἰς gẹ́gẹ́ bí mímú Pọ́ọ̀lù dé ìjọba ọ̀run láìléwu.
  alternative: Kí a túmọ̀ rẹ̀ gẹ́gẹ́ bí ìlérí pé Olúwa yóò dá Pọ́ọ̀lù sí kúrò lọ́wọ́ ikú ara.
  rationale: Ọ̀rọ̀ náà kò fi dandan sọ pé Pọ́ọ̀lù yóò bọ́ lọ́wọ́ ikú ara; ó fi ìgbẹ́kẹ̀lé hàn pé Olúwa yóò dá a sí kúrò nínú ibi, yóò sì mú un dé ìjọba rẹ̀. Ìtumọ̀ náà pa ìfọkànsìn yìí àti àìdájú nípa ọ̀nà tí ìdáǹdè náà yóò gbà ṣẹlẹ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì ṣeé lóye fún òǹkàwé òde òní. A yan ‘mú mi dé ... láìléwu’ láti yẹra fún gbolohun tí kò rọrùn bí ‘gbà mí là sínú,’ ṣùgbọ́n a fi èyí sí àkọsílẹ̀ ìsàlẹ̀ gẹ́gẹ́ bí àṣàyàn tó sún mọ́ ìṣètò Gíríìkì.
