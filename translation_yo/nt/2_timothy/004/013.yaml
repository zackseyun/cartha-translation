  to: Nígbà tí o bá ń bọ̀, mú aṣọ òde[a] tí mo fi sílẹ̀ lọ́dọ̀ Kápù ní Tíróásì wá, àti àwọn ìwé[b], pàápàá jù lọ àwọn ìwé tí a kọ sí awọ ẹranko.
