  terminology: A lo “aṣọ òde” fún φαιλόνην láì gba ìtumọ̀ àpò ìwé gẹ́gẹ́ bí ìtumọ̀ àkọ́kọ́. “Àwọn ìwé” pa ìtumọ̀ gbòòrò ti βιβλία mọ́, nígbà tí “àwọn ìwé tí a kọ sí awọ ẹranko” ṣàfihàn parchment. Àwọn àlàyé ìsàlẹ̀ ti tún so mọ́ àwọn àmì wọn lọ́nà tó tọ́.
