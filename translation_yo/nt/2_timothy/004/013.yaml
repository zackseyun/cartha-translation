  source_fidelity: Ìtumọ̀ náà mú àṣẹ Pọ́ọ̀lù, ibi (Tíróásì), ẹni tí a fi nǹkan sí lọ́dọ̀ rẹ̀ (Kápù), àti ìyàtọ̀ láàárín àwọn ìwé àti àwọn parchment hàn dáadáa. Ṣùgbọ́n “aṣọ ìgúnwà” kì í ṣe ọ̀nà tó ṣe kedere jù láti sọ φαιλόνην ní Yorùbá boṣewa; “aṣọ òde” ṣe kedere pé aṣọ ìbora/ìrìnàjò ni. “Àwọn ìwé tí a kọ sí awọ ẹranko” ṣàlàyé μεμβράνας pẹ̀lú ìdánilójú tó pọ̀ síi ju “àwọn ìwé awọ ẹranko” lọ.
