source:
  edition: SBLGNT
  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: yo
  text: Nígbà tí o bá ń bọ̀, mú aṣọ òde[a] tí mo fi sílẹ̀ lọ́dọ̀ Kápù ní Tíróásì wá, àti àwọn ìwé[b], pàápàá jù lọ àwọn ìwé tí a kọ sí awọ ẹranko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Àwọn kan lóye “aṣọ òde” gẹ́gẹ́ bí àpò tàbí ohun ìdìpọ̀ fún àwọn ìwé, ṣùgbọ́n ìtumọ̀ tí ọ̀rọ̀ Gíríìkì náà sábà máa ń ní ni aṣọ òde.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn àkájọ ìwé”; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí àwọn ìwé tí a ká tàbí àwọn ohun ìkọ̀wé mìíràn tí ó jọ bẹ́ẹ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: aṣọ ìgúnwà
  rationale: Ọ̀rọ̀ náà sábà ń tọ́ka sí aṣọ òde tí a máa ń wọ bora; èyí jẹ́ yíyan àdánidá ju àpò tàbí ìdìpọ̀ ìwé lọ.
- source_word: ἀπέλιπον
  choice: tí mo fi sílẹ̀
  rationale: Ó túmọ̀ sí ohun tí ẹni náà fi sílẹ̀ tàbí fi ṣẹ́yìn; gbólóhùn Yorùbá yìí ṣe kedere nínú àyíká ọ̀rọ̀ náà.
- source_word: παρὰ Κάρπῳ
  choice: lọ́dọ̀ Kápù
  rationale: παρά pẹ̀lú dative níbí fi hàn pé ohun náà wà ní ibi ẹni náà tàbí ní àbójútó rẹ̀; “lọ́dọ̀ Kápù” lè gba ìtumọ̀ méjèèjì.
- source_word: ἐρχόμενος
  choice: Nígbà tí o bá ń bọ̀
  rationale: Participle náà ní agbára àkókò ní ìbáṣepọ̀ pẹ̀lú àṣẹ φέρε, èyí sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: φέρε
  choice: mú ... wá
  rationale: Àṣẹ náà ni pé kí Timotiu gbé àwọn nǹkan náà tọ Pọ́ọ̀lù wá; “mú ... wá” bá ojú ìwòye yẹn mu ní Yorùbá.
- source_word: τὰ βιβλία
  choice: àwọn ìwé
  rationale: βιβλία lè jẹ́ ìwé tàbí àkájọ ìwé; “àwọn ìwé” jẹ́ gbígbòòrò, ó sì jẹ́ èdè Yorùbá tí ó wọ́pọ̀.
- source_word: μάλιστα
  choice: pàápàá jù lọ
  rationale: Ó fi ìtẹnumọ́ pàtàkì sí ohun tí ó tẹ̀ lé e.
- source_word: μεμβράνας
  choice: àwọn ìwé awọ ẹranko
  rationale: μεμβράνα tọ́ka sí ohun ìkọ̀wé tí a ṣe láti inú awọ ẹranko; gbolohun yìí túmọ̀ ohun náà kedere fún òǹkàwé Yorùbá ode òní.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, títọ́, tí ó ní iyì ṣùgbọ́n tí ó ṣeé lóye. A lo “aṣọ ìgúnwà” fún aṣọ òde, “àwọn ìwé” láti pa àìdánilójú irú ohun ìkọ̀wé mọ́, àti “àwọn ìwé awọ ẹranko” láti ṣàlàyé parchment ní ọ̀nà àdánidá.
