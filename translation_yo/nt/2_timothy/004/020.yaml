source:
  edition: SBLGNT
  text: Ἔραστος ἔμεινεν ἐν Κορίνθῳ, Τρόφιμον δὲ ⸀ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: yo
  text: Ẹ́rástù dúró ní Kọ́ríńtì, ṣùgbọ́n mo fi Tírófímù sílẹ̀ ní Mílétù nígbà tí ó ń ṣàìsàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔραστος
  choice: Ẹ́rástù
  rationale: Orúkọ ẹni ni; a ṣe àkọsílẹ̀ rẹ̀ ní ọ̀nà tó bá ìró Gíríìkì mu, tó sì rọrùn fún olùkà Yorùbá.
- source_word: ἔμεινεν
  choice: dúró sí
  rationale: Nínú ìròyìn ìrìn-àjò yìí, ọ̀rọ̀ náà túmọ̀ sí pé ó dúró tàbí pé ó wà síbẹ̀; ‘dúró sí’ jẹ́ èdè Yorùbá àdánidá.
- source_word: ἐν Κορίνθῳ
  choice: sí Kọ́ríńtì
  rationale: Ìlò ἐν jẹ́ ti ibi; pẹ̀lú ‘dúró,’ Yorùbá sábà máa ń lo ‘sí’ lọ́nà àdánidá.
- source_word: Τρόφιμον
  choice: Tírófímù
  rationale: Orúkọ ẹni ni; àkọsílẹ̀ yìí tẹ̀ lé ìró Gíríìkì ní ọ̀nà tó ṣeé kà ní Yorùbá.
- source_word: δὲ
  choice: ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ kékeré hàn láàárín ìròyìn nípa Ẹ́rástù àti ti Tírófímù.
- source_word: ἀπέλιπον
  choice: mo fi ... sílẹ̀
  rationale: Ọ̀rọ̀ náà jẹ́ ẹni-kìíní ẹyọ nínú àkókò àtijọ́, ó sì túmọ̀ sí fífi ẹnì kan sílẹ̀; ìtumọ̀ yìí kò fi ìdí tí Pọ́ọ̀lù fi ṣe bẹ́ẹ̀ kún un.
- source_word: ἐν Μιλήτῳ
  choice: ní Mílétù
  rationale: Ìlò ibi ni; ‘ní’ ni ọ̀nà Yorùbá àdánidá fún ìlú tí ẹni kan wà.
- source_word: ἀσθενοῦντα
  choice: nígbà tí ó ń ṣàìsàn
  rationale: Participle yìí ṣàpèjúwe ipò Tírófímù nígbà tí a fi í sílẹ̀. Gbólóhùn yìí mú ìbáṣepọ̀ àkókò náà hàn láì sọ pé àìsàn náà gan-an ni ìdí fífi í sílẹ̀.
theological_decisions: []
