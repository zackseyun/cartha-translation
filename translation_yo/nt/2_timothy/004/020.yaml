  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; ọ̀rọ̀ náà jẹ́ kúkúrú, ọlọ́lá, ó sì bá ìròyìn ìrìn-àjò mu.
