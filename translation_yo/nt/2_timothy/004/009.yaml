translation:
  language: yo
  text: Ṣe ìsapá láti tètè wá sọ́dọ̀ mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “Fi ìtara wá sọ́dọ̀ mi láìpẹ́,” tàbí, “Ṣe gbogbo ohun tí o lè ṣe láti tètè wá sọ́dọ̀ mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Sa gbogbo ipá rẹ
  rationale: Ọ̀rọ̀ àṣẹ yìí ń sọ nípa ìtara, ìforítì, àti fífi gbogbo okun ṣe ohun kan; ó yàtọ̀ sí ọ̀rọ̀ ταχέως, tó ń fi ìkánjú hàn.
- source_word: ἐλθεῖν
  choice: láti ... wá
  rationale: Ọ̀rọ̀ náà jẹ́ ọ̀rọ̀ ìṣe aláìlẹ́ni tó ń ṣe, tí Σπούδασον ń darí; pẹ̀lú πρός με, ‘wá’ ni ọ̀rọ̀ Yorùbá tó bá ojú ìwòye ẹni tí a ń tọ̀ wá mu.
- source_word: πρός με
  choice: sọ́dọ̀ mi
  rationale: Pẹ̀lú ọ̀rọ̀ arọ́pò-orúkọ olùgbà, gbólóhùn náà ń tọ́ka sí lílọ sí ọ̀dọ̀ ẹni; ‘sọ́dọ̀ mi’ jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: ταχέως
  choice: tètè
  rationale: ‘Tètè’ lè túmọ̀ sí kíákíá tàbí láìpẹ́, ó sì pa ìkánjú inú ọ̀rọ̀ Gíríìkì mọ́ láìdà á pọ̀ mọ́ ìtara tí Σπούδασον ti sọ.
theological_decisions: []
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A ya ìtara inú Σπούδασον sọ́tọ̀ kúrò nínú ìkánjú inú ταχέως; àmì àlàyé [a] wà nínú ọ̀rọ̀ gẹ́gẹ́ bí a ti béèrè.
