  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὸν ⸂καλὸν ἀγῶνα⸃ ἠγώνισμαι, τὸν δρόμον τετέλεκα, τὴν πίστιν τετήρηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: yo
  text: Mo ti ja ìjà rere náà, mo ti parí eré-ìje náà, mo ti pa ìgbàgbọ́ náà mọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “mo ti dúró ṣinṣin nínú ìgbàgbọ́,” tàbí, “mo ti jẹ́ olóòtítọ́.” Ọ̀rọ̀ Gíríìkì náà, τὴν πίστιν, lè tọ́ka sí “ìgbàgbọ́ náà,” ìyẹn ìgbàgbọ́ Kristẹni, tàbí ó lè ní ìtumọ̀ dídúró ṣinṣin nínú ìgbàgbọ́ tàbí jíjẹ́ olóòtítọ́.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: ìjà rere náà
  rationale: ἀγών lè túmọ̀ sí ìjà, ìsapá líle, tàbí ìdíje. Nínú àwòrán ìdíje àti ìjà yìí, “ìjà rere” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa agbára καλός gẹ́gẹ́ bí ohun rere tàbí ọlọ́lá mọ́.
- source_word: ἠγώνισμαι
  choice: Mo ti ja
  rationale: Ìṣe perfect yìí fi ìṣe tí a ti ṣe parí, tí àbájáde rẹ̀ ṣì dúró, hàn. “Mo ti ja” bá ìtumọ̀ náà mu, ó sì mú ìlà mẹ́ta inú ẹsẹ náà dọ́gba.
- source_word: δρόμον
  choice: eré-ìje náà
  rationale: δρόμος tọ́ka sí ipa tí asáré ń gbà tàbí sí eré-ìje fúnra rẹ̀. “Eré-ìje” jẹ́ ọ̀rọ̀ àdánidá, ó sì mú àwòrán eré asáré náà ṣe kedere fún òǹkàwé òde òní.
- source_word: τετέλεκα
  choice: mo ti parí
  rationale: Perfect ti τελέω túmọ̀ sí mímú ohun kan dé òpin rẹ̀. “Mo ti parí” jẹ́ kúkúrú, ó sì pa ìtumọ̀ ìparí pẹ̀lú àbájáde tó dúró mọ́.
- source_word: πίστιν
  choice: ìgbàgbọ́ náà
  rationale: Àpilẹ̀kọ τὴν ṣe àtìlẹ́yìn fún “ìgbàgbọ́ náà,” èyí tó lè tọ́ka sí ìgbàgbọ́ Kristẹni tí a gbé lé Pọ́ọ̀lù lọ́wọ́. Síbẹ̀, ọ̀rọ̀ náà tún lè ní ìtumọ̀ dídúró ṣinṣin tàbí jíjẹ́ olóòtítọ́, nítorí náà a pa àìdánilójú yẹn mọ́ nínú àlàyé ìsàlẹ̀.
- source_word: τετήρηκα
  choice: mo ti pa ... mọ́
  rationale: τηρέω lè túmọ̀ sí pípa ohun kan mọ́, ṣíṣọ́ ọ, tàbí dídáàbò bò ó. Àpólà Yorùbá “pa ... mọ́” jẹ́ ti ẹ̀dá, ó sì gba ìtumọ̀ ṣíṣọ́ àti dídúró ṣinṣin láàyè.
theological_decisions:
- issue: Ìtumọ̀ τὴν πίστιν
  choice: ìgbàgbọ́ náà
  alternative: mo ti dúró ṣinṣin nínú ìgbàgbọ́; mo ti jẹ́ olóòtítọ́
  rationale: Àpilẹ̀kọ Gíríìkì àti àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn fún ìtumọ̀ “ìgbàgbọ́ náà,” ó ṣeé ṣe kó jẹ́ ìgbàgbọ́ Kristẹni tí Pọ́ọ̀lù ti pa mọ́. Ṣùgbọ́n πίστις tún lè ní ìtumọ̀ ìṣòtítọ́; a kò yanjú ìforígbárí yìí ní ìkọ̀kọ̀, a sì fi àwọn ìtumọ̀ mìíràn sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àfẹnusọ tí ó bójú mu, tó níyì, tí ó sì yé òǹkàwé òde òní ni a lò. Àwọn àpólà mẹ́tẹ̀ẹ̀ta ni a ṣe ní ìṣọ̀kan pẹ̀lú “Mo ti ...,” a sì lò “ìjà rere” àti “eré-ìje” láti pa àwọn àwòrán Gíríìkì mọ́.
