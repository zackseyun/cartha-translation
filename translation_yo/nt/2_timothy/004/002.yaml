id: 2TI.4.2
reference: 2 Timothy 4:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: yo
  text: Wàásù ọ̀rọ̀ náà; máa múra sílẹ̀ ní àkókò tó yẹ àti ní àkókò tí kò yẹ[a]; fi àṣìṣe hàn, bá wọn wí, rọ̀ wọ́n[b], pẹ̀lú gbogbo sùúrù àti ẹ̀kọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí àkókò bá rọrùn àti nígbà tí kò bá rọrùn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gba wọ́n níyànjú” tàbí “fún wọn ní ìgboyà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: Wàásù
  rationale: Ọ̀rọ̀ àṣẹ yìí ń tọ́ka sí pípolongo ní gbangba; “wàásù” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún àyíká iṣẹ́ ìránṣẹ́ yìí.
- source_word: τὸν λόγον
  choice: ọ̀rọ̀ náà
  rationale: Ó tọ́ka sí ìhìn tàbí ọ̀rọ̀ àpọ́sítélì tí a gbọ́dọ̀ polongo. A kò fi “ìhìn rere” tàbí “Ìwé Mímọ́” rọ́pò rẹ̀, kí ìtumọ̀ rẹ̀ má bàa dín kù ju ti orísun lọ.
- source_word: ἐπίστηθι
  choice: múra tán
  rationale: Nínú àyíká yìí, ó ní agbára pé kí Tímótì wà ní ìmúrasílẹ̀, kí ó sì ṣe ohun tí a pàṣẹ láìṣiyèméjì.
- source_word: εὐκαίρως ἀκαίρως
  choice: nígbà tí àǹfààní bá wà àti nígbà tí kò bá sí
  rationale: Ìtumọ̀ yìí mú ìyàtọ̀ tó wà láàárín àkókò tó rọrùn tàbí tó yẹ àti èyí tí kò rí bẹ́ẹ̀ jáde ní Yorùbá àdánidá.
- source_word: ἔλεγξον
  choice: fi ẹ̀ṣẹ̀ hàn
  rationale: Ọ̀rọ̀ náà ní ìtumọ̀ ṣíṣí àṣìṣe tàbí ẹ̀ṣẹ̀ payá fún ìtọ́nisọ́nà àti àtúnṣe.
- source_word: ἐπιτίμησον
  choice: báni wí
  rationale: Ó jẹ́ àṣẹ àtúnṣe tó lágbára, tí “báni wí” sì sọ ní ṣókí àti ní Yorùbá àdánidá.
- source_word: παρακάλεσον
  choice: kíni níyànjú
  rationale: Ó lè túmọ̀ sí fífi ìyànjú fúnni, rírò ẹnì kan, tàbí fífúnni ní ìgboyà. “Kíni níyànjú” bá àyíká àṣẹ iṣẹ́ ìránṣẹ́ mu, kò sì pa ìtumọ̀ ìgbani-níyànjú rẹ̀ rẹ́.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: pẹ̀lú gbogbo sùúrù
  rationale: μακροθυμία ń tọ́ka sí ìfaradà pẹ̀lú àwọn ènìyàn; “gbogbo sùúrù” tún fi agbára πάσῃ hàn.
- source_word: καὶ διδαχῇ
  choice: àti ẹ̀kọ́
  rationale: Ó pa ìṣe kíkọ́ni mọ́ gẹ́gẹ́ bí ọ̀nà àti ohun tí yóò bá ìbáwí àti ìyànjú lọ.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ “ọ̀rọ̀ náà”
  choice: A túmọ̀ rẹ̀ sí “ọ̀rọ̀ náà” láìṣàlàyé rẹ̀ sí “ìhìn rere” tàbí “Ìwé Mímọ́.”
  alternative: “ìhìn náà,” “ìhìn rere,” tàbí “Ìwé Mímọ́”
  rationale: Àyíká náà kan ìpolongo àpọ́sítélì tó fìdí múlẹ̀ nínú Ìwé Mímọ́, ṣùgbọ́n λόγος kò sọ ní pàtó pé ọ̀kan nínú àwọn ìtumọ̀ tó dín kù wọ̀nyí ni. Ìtumọ̀ yìí pa ìmọ̀ àti ìfọ̀rọ̀wérọ̀ inú ọ̀rọ̀ orísun mọ́.
- issue: Agbára παρακάλεσον
  choice: “kíni níyànjú,” tí ó lè ní ríròni gidigidi àti fífúnni ní ìgboyà nínú.
  alternative: “rọ̀ni” tàbí “fúnni ní ìgboyà”
  rationale: Nínú àkójọpọ̀ àwọn àṣẹ ìtọ́nisọ́nà yìí, ọ̀rọ̀ náà lè jẹ́ ìrọ̀ tó lágbára, ṣùgbọ́n ìtumọ̀ fífúnni ní ìgboyà kò yẹ kí a yọ kúrò patapata.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ. A lo àwọn ọ̀rọ̀ àṣẹ tó ṣe kedere, tó ní iyì, tí òǹkàwé òde òní sì lè lóye. Àwọn àmì àlàyé [a] àti [b] wà lẹ́yìn gbólóhùn tí wọ́n ń ṣàlàyé.
