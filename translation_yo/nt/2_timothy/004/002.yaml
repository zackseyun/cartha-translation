  source_fidelity: Ìtumọ̀ náà gba ìlànà gbogbo gbolohun Gíríìkì náà, ṣùgbọ́n “fi ẹ̀ṣẹ̀ hàn” dín ἐλέγχω kù sí ẹ̀ṣẹ̀ ní pàtó, níbi tí ọ̀rọ̀ náà ti lè kan ṣíṣí àṣìṣe tàbí ìbáwí ní gbooro. “Kíni níyànjú” kò pé ní gírámà Yorùbá, ó sì kùnà láti sọ παρακάλεσον ní kedere.
  naturalness: “Múra tán” jẹ́ èdè Yorùbá tó ṣeé gbọ́, ṣùgbọ́n “máa múra sílẹ̀” ń dun dára gẹ́gẹ́ bí àṣẹ ìmúrasílẹ̀ tó ń bá a lọ. “Báni wí” àti “kíni níyànjú” nílò àfikún ohun tí ìṣe náà ń tọ́ka sí; “bá wọn wí” àti “rọ̀ wọ́n” jẹ́ kedere, ó sì jẹ́ èdè òde òní.
