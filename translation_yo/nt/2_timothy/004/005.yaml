id: 2TI.4.5
reference: 2 Timothy 4:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: yo
  text: Ṣùgbọ́n ìwọ, máa ṣọ́ra nínú ohun gbogbo,[a] fara da ìnira,[b] ṣe iṣẹ́ ẹni tí ń kéde ìhìn rere, sì mú iṣẹ́ ìránṣẹ́ rẹ ṣẹ ní kíkún.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “máa ní èrò tí ó balẹ̀,” “máa wà ní ìfẹ̀sítọ́,” tàbí “máa ṣàkóso ara rẹ.” Ní ìtumọ̀ gangan, ọ̀rọ̀ Gíríìkì náà túmọ̀ sí “jẹ́ aláìmúti,” ṣùgbọ́n nínú Májẹ̀mú Tuntun a máa ń lò ó lọ́nà àpẹẹrẹ fún èrò tí ó mọ́ kedere, ìkóra-ẹni-níjàánu, àti ìdúróṣinṣin lábẹ́ ìnira.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “jìyà nínú ìnira.”
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “mú iṣẹ́ ìránṣẹ́ rẹ pé.” Ọ̀rọ̀-ìṣe Gíríìkì náà ní ìtumọ̀ ṣíṣe ohun kan ní kíkún títí dé òpin.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ṣùgbọ́n ìwọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà ní ìtẹnumọ́, δέ sì fi Tímótì ṣe ìyàtọ̀ sí àwọn tí a ṣàpèjúwe ṣáájú.
- source_word: νῆφε
  choice: máa ní èrò tí ó mọ́ kedere
  rationale: Ní Majẹ̀mú Tuntun, ọ̀rọ̀ náà ń tọ́ka lọ́nà àpẹẹrẹ sí wíwà ní ìṣọ́ra, ìdúróṣinṣin, àti agbára láti ṣàkóso ara ẹni lábẹ́ ìnira, kì í ṣe sí àìmutí ọtí ní pàtó.
- source_word: ἐν πᾶσιν
  choice: nínú ohun gbogbo
  rationale: Ó pa ìtumọ̀ gígbooro ti gbólóhùn Gíríìkì mọ́ láìfi dandan pinnu bóyá ó túmọ̀ sí gbogbo ipò tàbí gbogbo ìgbà.
- source_word: κακοπάθησον
  choice: fara da ìnira
  rationale: 'Ó sọ méjèèjì: pípọ́njú àti dídúró ṣinṣin nígbà tí a bá dojú kọ ọ́.'
- source_word: ἔργον ποίησον εὐαγγελιστοῦ
  choice: ṣe iṣẹ́ ẹni tí ń kéde ìhìn rere
  rationale: Èyí tú iṣẹ́ εὐαγγελιστής jáde ní èdè Yorùbá tó ṣe kedere, láìgbẹ́kẹ̀ lé ọ̀rọ̀ àyálò ìjọ kan.
- source_word: τὴν διακονίαν σου
  choice: iṣẹ́ ìránṣẹ́ rẹ
  rationale: διακονία túmọ̀ sí iṣẹ́ ìránṣẹ́ tàbí iṣẹ́ òjíṣẹ́; ọ̀rọ̀ yìí pa ìtumọ̀ iṣẹ́ tí a fi lé Tímótì lọ́wọ́ mọ́ láìdi i mọ́ ipò ẹ̀sìn kan.
- source_word: πληροφόρησον
  choice: mú ... ṣẹ ní kíkún
  rationale: Ó fi hàn pé kí Tímótì ṣe iṣẹ́ náà dé òpin, kí ó sì mú un pé.
theological_decisions:
- issue: Ìtumọ̀ διακονία gẹ́gẹ́ bí iṣẹ́ tí a fi lé Tímótì lọ́wọ́
  choice: iṣẹ́ ìránṣẹ́ rẹ
  alternative: iṣẹ́ òjíṣẹ́ rẹ
  rationale: “Iṣẹ́ ìránṣẹ́” pa ààyè ìtumọ̀ Gíríìkì mọ́, ó sì bá iṣẹ́ ìkéde ìhìn rere nínú àyíká ẹsẹ náà mu, láìfi oyè tàbí ètò ìjọ kan kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó sì ṣe kedere fún òǹkàwé òde òní ni a lò. “Ẹni tí ń kéde ìhìn rere” yàgò fún ọ̀rọ̀ àyálò tó lè ní ìtumọ̀ ẹ̀sìn pàtó, “iṣẹ́ ìránṣẹ́” sì pa ìrẹ̀lẹ̀ àti iṣẹ́ tí a fi lé ẹni lọ́wọ́ mọ́.
