  source_fidelity: 'Ìtumọ̀ náà pa àwọn ìlànà mẹ́rin náà mọ́: ìkìlọ̀ fún Tímótì, wíwà ní ìṣọ́ra nínú gbogbo ipò, fífaradà ìnira, ṣíṣe iṣẹ́ ikéde ìhìn rere, àti mímú iṣẹ́ ìránṣẹ́ rẹ dé ìmúṣẹ́ pátápátá. Síbẹ̀, “máa ní èrò tí ó mọ́ kedere” jẹ́ ìtúmọ̀ tó fẹ́rẹ̀ẹ́ jẹ́ ọ̀rọ̀-fún-ọ̀rọ̀, kò sì mú agbára ìpè fún ìṣọ́ra àti ìfarabalẹ̀ ti νῆφε hàn dáadáa nínú Yorùbá.'
  naturalness: A tún ọ̀rọ̀ náà ṣe sí “máa ṣọ́ra nínú ohun gbogbo,” èyí tí ó jẹ́ Yorùbá boṣewa tó rọrùn, tó sì bá ìtumọ̀ àpẹẹrẹ ti νῆφε nínú àyíká yìí mu. A tún ṣàtúnṣe ọ̀rọ̀ ìsàlẹ̀ (a) kí ìtumọ̀ gangan rẹ má bà a jẹ́.
