id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: yo
  text: Nítorí Démásì ti kọ̀ mí sílẹ̀[a], níwọ̀n bí ó ti nífẹ̀ẹ́ àkókò ayé ìsinsìnyí, ó sì lọ sí Tẹsalóníkà; Kírésẹ́nsì lọ sí Gálátíà, Títù sì lọ sí Dálmátíà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ti pa mí tì” tàbí “ti fi mí sílẹ̀.” Ọ̀rọ̀ Gíríìkì náà sọ nípa fífi ẹnì kan sílẹ̀ lọ́nà tó ní ìtumọ̀ odi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκατέλιπεν
  choice: ti kọ̀ mí sílẹ̀
  rationale: Ọ̀rọ̀ yìí fi hàn pé Démásì fi Pọ́ọ̀lù sílẹ̀ lọ́nà tí kò yẹ, kì í ṣe pé ó kàn lọ sí ibòmíràn; gbólóhùn náà jẹ́ èdè Yorùbá àdánidá, ó sì pa ìtumọ̀ odi ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀγαπήσας
  choice: ó nífẹ̀ẹ́
  rationale: Àpólà aláìlópìn Gíríìkì so ìfẹ́ Démásì pọ̀ mọ́ fífi Pọ́ọ̀lù sílẹ̀. Ṣíṣe e gẹ́gẹ́ bí gbólóhùn tí ó tẹ̀ lé ara rẹ̀ jẹ́ kíkà Yorùbá tí ó rọrùn, láìfi dandan sọ pé ìfẹ́ náà ni okùnfà ní tààràtà.
- source_word: τὸν νῦν αἰῶνα
  choice: ayé ìsinsìnyí
  rationale: Nínú Yorùbá, “ayé ìsinsìnyí” lè tọ́ka sí àkókò tàbí ètò ayé tó wà nísinsìnyí, ó sì bá ìtumọ̀ àkókò àti ìwà rere ti αἰών mu ju títọ́ka sí gbogbo ohun àgbáyé lọ.
- source_word: ἐπορεύθη
  choice: lọ
  rationale: “Lọ” jẹ́ ọ̀rọ̀ ìrìn àdánidá tó bá àkójọ ibi tí àwọn ènìyàn náà lọ mu, láìfi irú ìrìn náà kún un.
- source_word: Θεσσαλονίκην
  choice: Tẹsalóníkà
  rationale: Àkọsílẹ̀ orúkọ ibìkan náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: Κρήσκης
  choice: Kíréńsì
  rationale: Àkọsílẹ̀ orúkọ ẹni náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: Γαλατίαν
  choice: Gálátíà
  rationale: Àkọsílẹ̀ orúkọ agbègbè náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: Τίτος
  choice: Títù
  rationale: Àkọsílẹ̀ orúkọ ẹni náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: Δαλματίαν
  choice: Dálmátíà
  rationale: Àkọsílẹ̀ orúkọ agbègbè náà ní ìbámu pẹ̀lú ìró àti ìkọ̀wé Yorùbá.
- source_word: γάρ
  choice: Nítorí
  rationale: “Nítorí” pa ìsopọ̀ àlàyé mọ́ láàárín ẹsẹ yìí àti ohun tí a sọ ṣáájú rẹ̀.
theological_decisions:
- issue: Bóyá fífi Démásì fi Pọ́ọ̀lù sílẹ̀ yẹ kí ó túmọ̀ sí pé ó kọ ìgbàgbọ́ sílẹ̀ pátápátá
  choice: “ti kọ̀ mí sílẹ̀” ni a lò, láìsọ ní tààràtà pé Démásì kọ ìgbàgbọ́ sílẹ̀.
  alternative: Lílo gbólóhùn tó túmọ̀ ìṣe Démásì sí ìpẹ̀yìndà kúrò nínú ìgbàgbọ́ pátápátá.
  rationale: Ẹsẹ náà dá fífi Pọ́ọ̀lù sílẹ̀ àti ìfẹ́ fún ayé ìsinsìnyí lẹ́bi, ṣùgbọ́n kò sọ ní tààràtà pé Démásì di apẹ̀yìndà títí láé; ìtumọ̀ náà pa agbára odi àti àìdánilójú ẹ̀kọ́ ìgbàgbọ́ inú ọ̀rọ̀ mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọ̀wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá yẹ. Gbólóhùn náà jẹ́ kedere fún òǹkàwé lásán, ó sì pa ìṣọ̀kan àkójọ àwọn ibi tí wọ́n lọ mọ́.
