id: 2TI.4.22
reference: 2 Timothy 4:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: yo
  text: Kí Olúwa wà pẹ̀lú ẹ̀mí rẹ[a]. Kí oore-ọ̀fẹ́ wà pẹ̀lú gbogbo yín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gíríìkì yí padà láti ẹyọ kan sí ọ̀pọ̀: “pẹ̀lú ẹ̀mí rẹ” (ẹyọ kan) … “pẹ̀lú gbogbo yín” (ọ̀pọ̀).'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Olúwa
  rationale: Orúkọ oyè tó bá ìlò Májẹ̀mú Tuntun mu ni “Olúwa”; ó pa ẹni tí ọ̀rọ̀ náà ń tọ́ka sí mọ́ láìfi “Jésù” kún ibi tí Gíríìkì kò ti sọ ọ́.
- source_word: μετὰ / μεθ’
  choice: wà pẹ̀lú
  rationale: Gíríìkì kò ní ọ̀rọ̀-ìṣe ní gbangba, ṣùgbọ́n ìbùkún Yorùbá nílò “wà”; “pẹ̀lú” sì túmọ̀ μετά pẹ̀lú genitive lọ́nà àdánidá.
- source_word: πνεύματός
  choice: ẹ̀mí
  rationale: “Ẹ̀mí rẹ” ń tọ́ka sí ẹ̀mí Tímótì gẹ́gẹ́ bí ènìyàn; a kò fi lẹ́tà ńlá tàbí ọ̀rọ̀ míì mú un jẹ́ Ẹ̀mí Mímọ́.
- source_word: σου
  choice: rẹ
  rationale: A pa arọ́pò-orúkọ ẹyọ kan mọ́, nítorí gbólóhùn àkọ́kọ́ ń bá Tímótì sọ̀rọ̀ ní pàtó.
- source_word: χάρις
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì ní ìwúwo ẹ̀kọ́ ìgbàgbọ́ fún χάρις nínú ìbùkún ìparí Pọ́ọ̀lù.
- source_word: ὑμῶν
  choice: gbogbo yín
  rationale: “Yín” pa nọ́ńbà ọ̀pọ̀ mọ́; “gbogbo” mú kí ìyàtọ̀ rẹ̀ sí “rẹ” tó jẹ́ ẹyọ kan hàn kedere fún òǹkàwé Yorùbá.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí
  choice: Ó ṣeé ṣe jù pé Olúwa Jésù ni nínú ìbùkún ìparí Pọ́ọ̀lù.
  alternative: Ó lè jẹ́ ìtọ́ka gbogbogbò sí Ọlọ́run.
  rationale: Ìlò Pọ́ọ̀lù sábà máa ń fi “Olúwa” tọ́ka sí Jésù ní irú ọ̀rọ̀ ìparí yìí; síbẹ̀, ìtumọ̀ náà kò fi “Jésù” kún Gíríìkì, ó sì tipa bẹ́ẹ̀ pa bí ọ̀rọ̀ orísun ṣe wà mọ́.
- issue: Ìyípadà láti ẹyọ kan sí ọ̀pọ̀
  choice: Gbólóhùn àkọ́kọ́ ń bá Tímótì nìkan sọ̀rọ̀; èkejì ń na ìbùkún oore-ọ̀fẹ́ sí ẹgbẹ́ ènìyàn kan.
  alternative: Kí a ka àwọn gbólóhùn méjèèjì sí ọ̀rọ̀ tí a sọ fún Tímótì nìkan.
  rationale: Gíríìkì yí padà ní kedere láti σου, ẹyọ kan, sí ὑμῶν, ọ̀pọ̀; “rẹ” àti “gbogbo yín” pa ìyàtọ̀ yìí mọ́.
translation_notes:
  register: Yorùbá àfẹnusọ, ọ̀wọ̀, àti ti òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún. Àkọ́ṣe náà pa ìrísí ìbùkún méjèèjì àti ìyípadà nọ́ńbà arọ́pò-orúkọ Gíríìkì mọ́.
