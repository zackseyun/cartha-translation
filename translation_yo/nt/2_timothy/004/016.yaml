id: 2TI.4.16
reference: 2 Timothy 4:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: yo
  text: Nígbà ìgbèjà mi àkọ́kọ́[a], kò sí ẹnikẹ́ni tí ó wá dúró tì mí[b]; ṣùgbọ́n gbogbo wọn kọ̀ mí sílẹ̀. Kí a má ka èyí sí wọn lọ́rùn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Nígbà ìgbọ́jọ́ mi àkọ́kọ́,” tàbí “Nígbà tí mo kọ́kọ́ dáhùn láti gbèjà ara mi níwájú ilé ẹjọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, Gíríìkì sọ pé, “kò sí ẹnikẹ́ni tó wá síbẹ̀ pẹ̀lú mi”; níhìn-ín, èrò náà ni pé kò sí ẹni tó fara hàn láti ṣe Pọ́ọ̀lù ní àtìlẹ́yìn.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “Kí a má ṣe fi èyí kàn wọ́n lẹ́ṣẹ̀.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: ìgbèjà
  rationale: Nínú àyíká ẹjọ́ yìí, ọ̀rọ̀ náà túmọ̀ sí ìdáhùn tàbí ìgbèjà ẹni níwájú àwọn aláṣẹ. “Ìgbèjà” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa ìtumọ̀ ti ẹjọ́ mọ́.
- source_word: πρώτῃ
  choice: àkọ́kọ́
  rationale: Ó tọ́ka sí ìgbà tàbí ìpele ìgbèjà àkọ́kọ́; ìtumọ̀ tààrà ni “àkọ́kọ́.”
- source_word: οὐδείς
  choice: kò sí ẹnikẹ́ni
  rationale: Èyí fi ìkọ̀ pátápátá hàn ní Yorùbá àdánidá.
- source_word: παρεγένετο
  choice: wá dúró tì mí
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní tààrà sí wíwá síbẹ̀ pẹ̀lú Pọ́ọ̀lù, ṣùgbọ́n nínú àyíká yìí ó tún ní èrò ìtìlẹ́yìn. “Wá dúró tì mí” pa ìwàníhìn-ín àti ìtìlẹ́yìn náà pọ̀ mọ́ra.
- source_word: ἐγκατέλιπον
  choice: kọ̀ mí sílẹ̀
  rationale: Ó túmọ̀ sí pé wọ́n fi Pọ́ọ̀lù sílẹ̀ nígbà ewu. “Kọ̀ mí sílẹ̀” jẹ́ èdè Yorùbá tó lágbára ṣùgbọ́n tó wọ́pọ̀ fún fífi ẹni sílẹ̀ láìràn án lọ́wọ́.
- source_word: λογισθείη
  choice: Kí a má ṣe kà á sí wọn lọ́rùn
  rationale: Fọ́ọ̀mù optative náà sọ ìfẹ́ tàbí àdúrà pé kí a má ka ìṣe náà sí ẹ̀bi wọn. Gbólóhùn Yorùbá yìí pa àwòrán ìṣírò àti ìdájọ́ inú ọ̀rọ̀ náà mọ́.
theological_decisions:
- issue: Ìró àti agbára gbólóhùn Pọ́ọ̀lù tó gbẹ̀yìn nípa àwọn tó kọ̀ ọ́ sílẹ̀
  choice: 'Ìfẹ́ tàbí àdúrà pé kí a má ka ìṣe náà sí wọn lọ́rùn: “Kí a má ṣe kà á sí wọn lọ́rùn.”'
  alternative: 'Àṣẹ tàbí ìyọ̀ǹda tó rọrùn díẹ̀: “Ẹ má ṣe kà á sí wọn lọ́rùn.”'
  rationale: Optative passive λογισθείη pẹ̀lú μή sábà ń sọ ìfẹ́ tàbí àdúrà, kì í ṣe gbólóhùn òtítọ́ lásán. Ìtumọ̀ yìí pa ìró ìdáríjì mọ́ láìfi ẹ̀kọ́ ìgbàgbọ́ tí Gíríìkì kò sọ kún un.
translation_notes:
  register: A lo Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. “Ìgbèjà” pa àyíká ẹjọ́ mọ́; “wá dúró tì mí” jẹ́ àdánidá, ó sì sọ ìwàníhìn-ín àti ìtìlẹ́yìn; “kà á sí wọn lọ́rùn” pa àwòrán ìṣírò/ìdájọ́ àti ìfẹ́ àdúrà inú Gíríìkì mọ́.
