  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: yo
  text: Ìwọ náà, máa ṣọ́ra fún un, nítorí ó takò àwọn ọ̀rọ̀ wa gidigidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìhìn wa” tàbí “ẹ̀kọ́ wa.” Ọ̀rọ̀ Gíríìkì ní “àwọn ọ̀rọ̀ wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάσσου
  choice: máa ṣọ́ra fún un
  rationale: Ọ̀rọ̀ àṣẹ ní ìrísí present middle ń pe Tímótì sí ìṣọ́ra tí yóò máa bá a lọ. ‘Máa ṣọ́ra fún un’ jẹ́ Yorùbá àdánidá tó sì pa agbára ìkìlọ̀ náà mọ́.
- source_word: λίαν
  choice: gidigidi
  rationale: Ó ń fi agbára kún ọ̀rọ̀-ìṣe tó tẹ̀ lé e; ‘gidigidi’ bá ‘tako’ mu ní Yorùbá, ó sì fi bí àtakò náà ṣe lágbára hàn.
- source_word: ἀντέστη
  choice: ó tako
  rationale: Aorist ἀνθίστημι túmọ̀ sí láti dojú kọ tàbí tako. ‘Ó tako’ ṣe kedere, ó sì jẹ́ ọ̀nà àdánidá láti sọ èrò náà ní Yorùbá.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: àwọn ọ̀rọ̀ wa
  rationale: Èyí tẹ̀ lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí láì fi dandan pinnu pé ó ń tọ́ka sí ìwàásù, ẹ̀kọ́, tàbí ẹ̀rí ní ilé ẹjọ́.
- source_word: ὃν
  choice: fún un
  rationale: Ọ̀rọ̀ arọ́pò náà ń tọ́ka padà sí Alẹkisáńdà ní ẹsẹ tó ṣáájú; ‘fún un’ ni Yorùbá àdánidá lẹ́yìn ‘ṣọ́ra.’
- source_word: καὶ σὺ
  choice: Ìwọ náà
  rationale: Ó tẹnu mọ́ Tímótì gẹ́gẹ́ bí ẹni tó tún gbọ́dọ̀ ṣọ́ra, ní ìbámu pẹ̀lú ohun tó ṣẹlẹ̀ sí Pọ́ọ̀lù.
theological_decisions:
- issue: Ìtumọ̀ ibi tí ‘àwọn ọ̀rọ̀ wa’ dé
  choice: A pa gbólóhùn náà mọ́ gẹ́gẹ́ bí ‘àwọn ọ̀rọ̀ wa,’ tó lè tọ́ka sí ọ̀rọ̀ tí Pọ́ọ̀lù àti àwọn alábáṣiṣẹ́ rẹ̀ sọ.
  alternative: ‘ìhìn wa,’ ‘ẹ̀kọ́ wa,’ tàbí ẹ̀rí wọn ní ilé ẹjọ́
  rationale: Gbólóhùn Gíríìkì kò sọ pàtó bóyá àtakò náà wáyé ní ilé ẹjọ́, nínú iṣẹ́ ìwàásù, tàbí sí ẹ̀kọ́ Kristẹni lápapọ̀. Ìtumọ̀ náà kò dín àlàyé náà sí ọ̀kan nínú àwọn ọ̀nà wọ̀nyí.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ti òde òní, ó bójú mu, ó sì ní iyì. ‘Máa ṣọ́ra’ fi ìṣọ́ra tó ń bá a lọ hàn, ‘gidigidi’ sì jẹ́ ọ̀nà àdánidá láti fi agbára λίαν hàn.
