  yaml_path: translation/nt/2_timothy/004/012.yaml
  text: But I sent Tychicus to Ephesus[a].
translation:
  language: yo
  text: Ṣùgbọ́n mo rán Tíkíkù lọ sí Éfésù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Mo sì rán Tíkíkù lọ sí Éfésù,” tàbí, “Ní ti Tíkíkù, mo rán an lọ sí Éfésù.” Ọ̀rọ̀ àsopọ̀ Gíríìkì náà, δέ, lè fi ìtẹ̀síwájú ọ̀rọ̀ lásán tàbí ìtakora kékeré hàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: Tíkíkù
  rationale: Orúkọ ẹni ni; a ṣe àkọsílẹ̀ ìró rẹ̀ ní ọ̀nà tó bá ìlànà ìkọ orúkọ Gíríìkì sí Yorùbá mu.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ọ̀rọ̀ àsopọ̀ yìí lè fi ìyípadà ọ̀rọ̀ tàbí ìtakora kékeré hàn. “Ṣùgbọ́n” bá àyíká ọ̀rọ̀ mu, ṣùgbọ́n a fi àwọn ìtumọ̀ míì sínú àlàyé ìsàlẹ̀.
- source_word: ἀπέστειλα
  choice: mo rán
  rationale: Ọ̀rọ̀-ìṣe aorist, active, indicative, ẹni àkọ́kọ́ ẹyọ; “mo rán” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe tí olùsọ ṣe ní àkókò tó kọjá, láìfi ìtumọ̀ aspect míì kún un.
- source_word: εἰς
  choice: lọ sí
  rationale: Níwájú orúkọ ìlú, εἰς ń tọ́ka sí ibi tí ẹni ń lọ; “lọ sí” jẹ́ gbólóhùn Yorùbá àdánidá lẹ́yìn “rán.”
- source_word: Ἔφεσον
  choice: Éfésù
  rationale: Orúkọ ìlú ni; a ṣe àkọsílẹ̀ ìró rẹ̀ ní ọ̀nà Yorùbá tó ṣeé kà, pẹ̀lú àmì ohùn.
theological_decisions: []
translation_notes:
  register: Yorùbá àpapọ̀, pẹ̀lú àmì ohùn níbi tó bá yẹ; èdè náà jẹ́ àdánidá, kedere, ó sì ní iyì. A pa àìdánilójú inú δέ mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
