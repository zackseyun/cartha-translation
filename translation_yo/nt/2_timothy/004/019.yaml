  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: yo
  text: Kí Prísíkà[a], Ákílà àti àwọn ará ilé Ónẹsífórù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ọ̀rọ̀ Gíríìkì ní “Prísíkà”; ní àwọn ibì kan míì, a tún ń pè é ní “Prísílà” (fún àpẹẹrẹ, Ìṣe 18:2, 18, 26).
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: Kí
  rationale: Ọ̀rọ̀-ìṣe àṣẹ náà ní ìtumọ̀ pé kí ẹni tí a ń kọ̀wé sí bá wọn kí; “Kí” jẹ́ ọ̀nà àdánidá àti ṣókí láti sọ àṣẹ yìí ní Yorùbá láìfi ìfẹ́ni mìíràn kún un.
- source_word: Πρίσκαν
  choice: Prísíkà
  rationale: A tẹ̀lé orúkọ tí ọ̀rọ̀ Gíríìkì fi sílẹ̀ níhìn-ín, dípò fífi fọ́ọ̀mù orúkọ mìíràn, Prísílà, rọ́pò rẹ̀.
- source_word: Ἀκύλαν
  choice: Ákílà
  rationale: Ìkọ orúkọ Ἀκύλας sí Yorùbá ní ọ̀nà tí ó bá ìpè Yorùbá mu.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: àwọn ará ilé Ónẹsífórù
  rationale: Ní àyíká ìkíni, οἶκος ń tọ́ka sí àwọn ènìyàn inú agbo ilé, kì í ṣe ilé gẹ́gẹ́ bí ilé tí a kọ́ nìkan. “Àwọn ará ilé” jẹ́ èdè Yorùbá àdánidá tí kò fi mọ́ àwọn ìbátan ẹ̀jẹ̀ nìkan.
theological_decisions: []
translation_notes:
  register: Èdè náà jẹ́ Yorùbá òde òní tí ó ní iyì, tí ó sì ṣe kedere fún òǹkàwé gbogbo. A lo àmì ohùn lórí àwọn orúkọ bí ó ti yẹ fún ìpè Yorùbá. Àmì àlàyé [a] wà lẹ́yìn gbogbo gbólóhùn nítorí pé àlàyé náà kan orúkọ Prísíkà nínú ẹsẹ náà.
