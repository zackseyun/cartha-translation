  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: yo
  text: 'Mo fi tọkàntọkàn pàṣẹ fún ọ níwájú Ọlọ́run àti Mèsáyà Jésù, ẹni tí yóò dá àwọn alààyè àti àwọn òkú lẹ́jọ́[a], àti nípa ìfarahàn rẹ̀ àti ìjọba rẹ̀[b], pé:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí ó fẹ́rẹ̀ẹ́ dá àwọn alààyè àti àwọn òkú lẹ́jọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ó tún ṣeé ṣe kí a túmọ̀ rẹ̀ pé, “àti ìfarahàn rẹ̀ àti ìjọba rẹ̀,” kí a sì fi bí àwọn ọ̀rọ̀ náà ṣe so mọ́ àṣẹ náà sílẹ̀ ní àìsọ ní kedere, gẹ́gẹ́ bí ó ti rí nínú Gíríìkì.
    reason: alternative_reading
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: Mo pàṣẹ fún ọ tọkàntọkàn
  rationale: Nínú ọ̀rọ̀ fífi iṣẹ́ lé ẹni lọ́wọ́ yìí, gbólóhùn náà ń sọ àṣẹ pàtàkì tí a fi tọkàntọkàn fún ẹni, kì í ṣe jíjẹ́rìí lásán. A mú ‘ọ’ jáde nítorí ẹni tí Pọ́ọ̀lù ń bá sọ hàn gbangba nínú àyíká ọ̀rọ̀.
- source_word: ἐνώπιον
  choice: níwájú
  rationale: Ó jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ṣíṣe ohun kan ní ojú tàbí níwájú ẹnì kan.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός ṣì ní agbára gẹ́gẹ́ bí oyè Mèsáyà nínú àlàyé pàtàkì yìí, dípò kí a mú un bí apá orúkọ lásán.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: ẹni tí ó fẹ́rẹ̀ẹ́ dá … lẹ́jọ́
  rationale: ‘Ó fẹ́rẹ̀ẹ́’ pa ìmọ̀lára ohun tí ń bọ̀ tàbí tí ó sún mọ́lé nínú μέλλω mọ́, láì sọ àsìkò pàtó tí ẹsẹ̀ náà kò sọ.
- source_word: ζῶντας καὶ νεκρούς
  choice: àwọn alààyè àti àwọn òkú
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe kedere, tó sì pa bí ìdájọ́ náà ṣe kan gbogbo ènìyàn mọ́.
- source_word: ἐπιφάνειαν
  choice: ìfarahàn
  rationale: Ọ̀rọ̀ náà sọ nípa bí ẹni náà yóò ṣe fara hàn gbangba, láì fi ìtumọ̀ míì tí kò sí nínú Gíríìkì kún un.
- source_word: βασιλείαν
  choice: ìjọba
  rationale: ‘Ìjọba’ jẹ́ ìtumọ̀ Yorùbá tó wọ́pọ̀, tó sì bójú mu níbi tí a ti so ó pọ̀ mọ́ ìfarahàn Mèsáyà.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: àti nípa ìfarahàn rẹ̀ àti ìjọba rẹ̀
  rationale: Èyí ló mú kí àwọn ọ̀rọ̀ ẹ̀sùn-orúkọ Gíríìkì ṣiṣẹ́ gẹ́gẹ́ bí ohun tí a fi ń mú àṣẹ pàtàkì náà le, bí ó tilẹ̀ jẹ́ pé ìsopọ̀ gírámà Gíríìkì lè jẹ́ kí ìtumọ̀ náà wà ní ìfarapamọ́ díẹ̀.
theological_decisions:
- issue: Ìtumọ̀ Χριστός gẹ́gẹ́ bí oyè nípa ẹni tí Ọlọ́run yàn
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Nínú àyíká ìdájọ́ àti ìjọba yìí, oyè Mèsáyà ṣì hàn kedere; yíyàn yìí pa ìtumọ̀ Hébérù ti ẹni àmì òróró mọ́ láì fi ẹ̀kọ́ ẹ̀sìn ẹgbẹ́ kan kún un.
- issue: Agbára μέλλω nínú ọ̀rọ̀ ìdájọ́ ọjọ́ iwájú
  choice: ẹni tí ó fẹ́rẹ̀ẹ́ dá … lẹ́jọ́
  alternative: ẹni tí yóò dá … lẹ́jọ́
  rationale: A pa ìfọ̀kànsìn Gíríìkì sí ohun tí ó ń bọ̀ tàbí tí ó sún mọ́lé mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fi ọ̀nà ọjọ́ iwájú lasán sílẹ̀ láì pinnu àsìkò náà.
- issue: Iṣẹ́ καί pẹ̀lú ‘ìfarahàn’ àti ‘ìjọba’
  choice: àti nípa ìfarahàn rẹ̀ àti ìjọba rẹ̀
  alternative: àti ìfarahàn rẹ̀ àti ìjọba rẹ̀
  rationale: Ìtumọ̀ àkọ́kọ́ jẹ́ kí gbolohun náà jẹ́ àdánidá gẹ́gẹ́ bí àṣẹ mímúle, ṣùgbọ́n a pa ìsopọ̀ Gíríìkì tí kò ṣàlàyé bí wọ́n ṣe jọ ṣiṣẹ́ mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Yorùbá ìwé mímọ́ tó níyì ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní ni a lò. Àmì ohùn kún àwọn ọ̀rọ̀ níbi tí ó ti bá ìlò Yorùbá boṣewa mu; gbolohun náà sì parí pẹ̀lú àmì olójú méjì nítorí àṣẹ tó tẹ̀ lé e nínú ẹsẹ̀ kejì.
