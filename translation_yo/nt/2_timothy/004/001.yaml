  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé ìtòlẹ́sẹẹsẹ àti àwọn èrò pàtàkì Gíríìkì dáadáa: ìpàṣẹ líle níwájú Ọlọ́run àti Mèsáyà Jésù, ìdájọ́ àwọn alààyè àti òkú, pẹ̀lú ìfarahàn àti ìjọba rẹ̀. Ṣùgbọ́n «fẹ́rẹ̀ẹ́» sábà máa ń túmọ̀ sí ‘fẹ́ẹ̀ máa ṣẹlẹ̀/ó kù díẹ̀’ ní Yorùbá, ó sì lè sọ ìsúnmọ́ àsìkò tí μέλλω kò fi dandan sọ nínú ọ̀rọ̀ yìí. Ọ̀nà ọjọ́ iwájú «yóò dá ... lẹ́jọ́» dáa síi fún μέλλω nínú àyíká yìí, a sì lè pa aṣayan ‘fẹ́rẹ̀ẹ́’ mọ́ nínú àlàyé ìsàlẹ̀.'
  naturalness: «Mo fi tọkàntọkàn pàṣẹ fún ọ» jẹ́ ọ̀nà Yorùbá tí ó rọrùn, tí ó sì ní ìwọ̀n ọlá tó yẹ fún ìpàṣẹ pàtàkì. Àwọn àmì ohùn, ọ̀rọ̀ «níwájú», «ìfarahàn», àti «ìjọba» dáa. «Nípa» lè ṣiṣẹ́ nínú ìlò ìbúra/ìmúlẹ̀ yìí, bí ó tilẹ̀ jẹ́ pé ìsopọ̀ náà ní ìfarapamọ́ gẹ́gẹ́ bí ti Gíríìkì.
  terminology: «Mèsáyà Jésù» pa agbára oyè Χριστός mọ́, ó sì bá ìlànà ìtumọ̀ tí a pèsè mu. «Ìfarahàn» fún ἐπιφάνεια àti «ìjọba» fún βασιλείαn jẹ́ yíyàn tó bójú mu. «Àwọn alààyè àti àwọn òkú» jẹ́ ìtumọ̀ kedere fún ζῶντας καὶ νεκρούς.
