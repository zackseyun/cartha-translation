language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: yo
  text: Wọ́n yóò sì yí etí wọn kúrò lọ́dọ̀ òtítọ́[a], wọ́n yóò sì yípadà sí àwọn ìtàn àròsọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ní Gíríìkì, “ìgbọ́”; a tún lè túmọ̀ ọ́ sí “ìgbọ́ wọn.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “àwọn ìtàn asán.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: òtítọ́
  rationale: Ọ̀rọ̀ náà ní àpilẹ̀kọ pàtó nínú Gíríìkì, ó sì tọ́ka sí òtítọ́ tí a ti mọ̀ nínú àyíká ẹsẹ̀ yìí; Yorùbá lè sọ èyí ní ti ẹ̀dá bí “òtítọ́” láìfi àlàyé míì kún un.
- source_word: ἀκοὴν
  choice: etí wọn
  rationale: Ìtumọ̀ gangan ni “gbọ́gbọ́” tàbí agbára láti gbọ́, ṣùgbọ́n gbólóhùn Yorùbá “yí etí wọn kúrò” jẹ́ àdánidá, ó sì pa àwòrán ìkọ̀ láti fetí sí mọ́.
- source_word: ἀποστρέψουσιν
  choice: yóò yí ... kúrò
  rationale: Èyí pa ìṣe amúṣiṣẹ́ àti àwòrán yíyí kúrò mọ́, dípò fífi ìtumọ̀ tóóró bí “kọ̀” sí i.
- source_word: μύθους
  choice: àwọn ìtàn àròsọ
  rationale: Ó sọ àwọn ìtàn tí a hù tàbí tí kò dúró lórí òtítọ́; “ìtàn àròsọ” jẹ́ èdè Yorùbá òde òní tó ṣe kedere ju gbígbé ọ̀rọ̀ àjèjì wọlé lọ.
- source_word: ἐκτραπήσονται
  choice: yóò yà sí ọ̀dọ̀
  rationale: Fọ́ọ̀mù náà lè jẹ́ aláìlódodo tàbí àárín; ìtumọ̀ yìí jẹ́ ti ẹ̀dá, ó sì kò pinnu bóyá ẹlòmíràn ló mú wọn yà tàbí àwọn fúnra wọn ni.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: kúrò nínú ... sì ... sí ọ̀dọ̀
  rationale: Ìtọ́sọ́nà tó yàtọ̀—kúrò lọ́dọ̀ ohun kan, sí ọ̀dọ̀ òmíràn—wà ní mímú, pẹ̀lú ìsopọ̀ “sì” tó bá Yorùbá mu.
theological_decisions:
- issue: Ìtumọ̀ “òtítọ́” nínú àyíká ẹsẹ̀ náà
  choice: òtítọ́
  alternative: ẹ̀kọ́ tí ó yè kooro; òtítọ́ ìhìn rere
  rationale: Bí àyíká ṣe ní í ṣe pẹ̀lú ẹ̀kọ́ àwọn aposteli, ọ̀rọ̀ Gíríìkì ṣì jẹ́ ọ̀rọ̀ gbòòrò fún “òtítọ́.” A kò dín un kù sí ìtumọ̀ ẹ̀kọ́ ìjọ kan.
- issue: Aṣojú ẹni tó fa yíyà sí àwọn ìtàn àròsọ
  choice: wọn yóò yà sí ọ̀dọ̀
  alternative: a ó yí wọn padà sí àwọn ìtàn àròsọ
  rationale: Fọ́ọ̀mù Gíríìkì lè ní ìtumọ̀ àárín tàbí aláìlódodo. Yorùbá yìí pa àìdánilójú náà mọ́, kò sì fi aṣojú kan tí ẹsẹ̀ kò dárúkọ kún un.
translation_notes:
  register: Èdè Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó rọrùn fún òǹkàwé òde òní. A lo ọ̀rọ̀ àdánidá “yí etí wọn kúrò” fún ἀκοή, nígbà tí àkọ́lé ìsàlẹ̀ ṣàfihàn ìtumọ̀ gangan. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
