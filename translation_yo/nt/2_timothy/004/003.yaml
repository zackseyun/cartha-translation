  source_fidelity: 'Ìtumọ̀ náà mú ìtumọ̀ pàtàkì ẹsẹ̀ náà dáadáa: ìgbà tí ń bọ̀, àìfaradà ẹ̀kọ́, yíyan/kíkójọ olùkọ́ gẹ́gẹ́ bí ìfẹ́ tiwọn, àti àwòrán etí yínyun. Síbẹ̀, “nítorí” ń sọ κνηθόμενοι τὴν ἀκοήν di ìdí tí a ti fi hàn ní tààrà, nígbà tí participle Gíríìkì náà kò pinnu ìbáṣepọ̀ ìdí bẹ́ẹ̀. “Ẹ̀kọ́ tí ó yè kooro” kò pa àwòrán ‘healthy/sound’ ti ὑγιαινούσης mọ́ kedere.'
