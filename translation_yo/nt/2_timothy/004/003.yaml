id: 2TI.4.3
reference: 2 Timothy 4:3
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: yo
  text: Nítorí ìgbà kan ń bọ̀ tí wọn kò ní fara da ẹ̀kọ́ tí ó ní ìlera[a]; dípò bẹ́ẹ̀, wọn yóò kó àwọn olùkọ́ jọ fún ara wọn ní ìbámu pẹ̀lú ìfẹ́-ọkàn tiwọn, etí wọn sì ń yun wọ́n[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀kọ́ tí ó tọ́.” Ní ti gígùn, “ẹ̀kọ́ tí ó ní ìlera”; ìlera níbí jẹ́ àwòrán fún ẹ̀kọ́ tí ó péye tí ó sì tọ́.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gígùn, “etí wọn ń yun wọ́n.” Àwòrán yìí ń tọ́ka sí ìfẹ́ líle láti gbọ́ ohun tí ó bá ìfẹ́ ẹni mu. A lè tú participle Gíríìkì náà sí “pẹ̀lú etí tí ń yun wọ́n” pẹ̀lú.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: ìgbà kan
  rationale: Ó tọ́ka sí àkókò kan tí ń bọ̀; ‘ìgbà kan’ jẹ́ ọ̀nà Yorùbá àdánidá tí kò fi dandan sọ pé ọjọ́ kan pàtó ni.
- source_word: ὑγιαινούσης διδασκαλίας
  choice: ẹ̀kọ́ tí ó yè kooro
  rationale: Ọ̀rọ̀ Gíríìkì náà túmọ̀ ní pàtàkì sí ẹ̀kọ́ tí ó ní ìlera, tí kò sì ní àbùkù. ‘Tí ó yè kooro’ sọ ìtumọ̀ àfiwé náà ní Yorùbá àdánidá láì sọ ọ́ di ọ̀rọ̀ ẹ̀kọ́ ìsìn tí ó le.
- source_word: ἀνέξονται
  choice: wọn kò ní fara da
  rationale: ‘Fara da’ mú ìtumọ̀ fífaradà tàbí gbígbà ohun kan láàyè jáde ní kedere.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: ní ìbámu pẹ̀lú ìfẹ́-ọkàn tiwọn
  rationale: Èyí pa ìtumọ̀ pé àwọn ìfẹ́ tiwọn ni yóò darí yíyan olùkọ́ mọ́, láì dín ἐπιθυμίαι kù sí ìfẹ́kúfẹ̀ẹ́ ti ara nìkan.
- source_word: ἑαυτοῖς
  choice: fún ara wọn
  rationale: 'Ó pa agbára arọ́pò-orúkọ afẹ̀yìntì mọ́: àwọn fúnra wọn ni wọ́n ń ṣe é fún.'
- source_word: ἐπισωρεύσουσιν
  choice: wọn yóò kó ... jọ
  rationale: ‘Kó jọ’ jẹ́ Yorùbá àdánidá fún ṣíṣe àkójọpọ̀ ohun púpọ̀; àyíká náà fi ìpọ̀jù àwọn olùkọ́ hàn.
- source_word: διδασκάλους
  choice: àwọn olùkọ́
  rationale: Èyí ni ìtumọ̀ gígùn, tí ó sì wọ́pọ̀ jù lọ.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: nítorí etí wọn ń yun wọ́n
  rationale: Ó pa àwòrán etí yínyun mọ́, ó sì sọ ìfẹ́ líle wọn láti máa gbọ́ ohun tí ó tẹ́ wọn lọ́rùn ní Yorùbá tí ó ṣeé lóye.
- source_word: ἀκοήν
  choice: etí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí gbígbọ́, ‘etí’ ni ó pa àwòrán ara Gíríìkì mọ́ dáadáa ní Yorùbá.
theological_decisions:
- issue: Bí a ṣe túmọ̀ διδασκαλία nínú lẹ́tà sí olùṣọ́ ìjọ
  choice: ẹ̀kọ́
  alternative: ẹ̀kọ́ ìgbàgbọ́
  rationale: ‘Ẹ̀kọ́’ tó ìtumọ̀ ọ̀rọ̀ Gíríìkì, ó sì yẹra fún fífi ìtumọ̀ ìjọ tàbí ẹ̀ka ìsìn kan kún un.
- issue: Ìbáṣepọ̀ κνηθόμενοι τὴν ἀκοήν pẹ̀lú gbólóhùn àkọ́kọ́
  choice: nítorí etí wọn ń yun wọ́n
  alternative: etí wọn sì ń yun wọ́n
  rationale: Ìtumọ̀ ìdí bá àṣà Yorùbá mu, ó sì ṣàlàyé ìsúnniṣe inú àwòrán náà; àmọ́ nítorí pé participle Gíríìkì kò fi ìbáṣepọ̀ náà hàn ní kedere pátápátá, àlàyé ìsàlẹ̀ sọ àṣàyàn yìí di mímọ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún; èdè náà jẹ́ ọ̀wọ̀, àdánidá, ó sì yẹ fún kíkà ní gbangba. A pa àwòrán ‘etí yínyun’ mọ́, ṣùgbọ́n a ṣàlàyé rẹ̀ nínú àlàyé ìsàlẹ̀.
