- from: Ṣùgbọ́n Olúwa dúró tì mí, ó sì fún mi lókun, kí a lè tipasẹ̀ mi mú ìkéde náà ṣẹ ní kíkún, kí gbogbo àwọn orílẹ̀-èdè[a] sì lè gbọ́; a sì gbà mí là kúrò ní ẹnu kìnnìún[b].
  to: Ṣùgbọ́n Olúwa dúró tì mí, ó sì fún mi lókun, kí a lè mú ìkéde náà ṣẹ ní kíkún nípasẹ̀ mi, kí gbogbo àwọn orílẹ̀-èdè[a] sì lè gbọ́; a sì gbà mí là kúrò ní ẹnu kìnnìún[b].
