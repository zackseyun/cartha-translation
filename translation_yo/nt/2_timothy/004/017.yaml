id: 2TI.4.17
reference: 2 Timothy 4:17
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: yo
  text: Ṣùgbọ́n Olúwa dúró tì mí, ó sì fún mi lókun, kí a lè mú ìkéde náà ṣẹ ní kíkún nípasẹ̀ mi, kí gbogbo àwọn orílẹ̀-èdè[a] sì lè gbọ́; a sì gbà mí là kúrò ní ẹnu kìnnìún[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “gbogbo àwọn tí kì í ṣe Júù.” Ọ̀rọ̀ Gíríìkì ἔθνη lè túmọ̀ sí “àwọn orílẹ̀-èdè” tàbí “àwọn tí kì í ṣe Júù”; níbí, ó ṣeé ṣe kí ó ń tọ́ka sí àwọn ènìyàn tí kì í ṣe Júù tí wọ́n ń gbọ́ ìhìn rere.
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà, “kúrò ní ẹnu kìnnìún,” lè jẹ́ ọ̀rọ̀ aláwòrán fún ìgbàlà kúrò nínú ewu ikú, dípò kí ó jẹ́ ìtọ́ka sí kìnnìún gidi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: Ṣùgbọ́n Olúwa
  rationale: “Olúwa” ni ìtumọ̀ Yorùbá tí ó bójú mu fún κύριος, “Ṣùgbọ́n” sì fi ìyàtọ̀ sí ohun tí ẹsẹ tó ṣáájú sọ hàn.
- source_word: μοι παρέστη
  choice: dúró tì mí
  rationale: Gbólóhùn yìí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ẹnì kan wà lẹ́gbẹ̀ẹ́ ẹni láti ṣe ìrànlọ́wọ́, kì í ṣe wíwà ní ibi kan lásán.
- source_word: ἐνεδυνάμωσέν με
  choice: fún mi lókun
  rationale: Ó sọ ìṣe fífúnni ní agbára ní èdè Yorùbá òde òní tí ó ṣe kedere, tí ó sì ní ìwọ̀ntúnwọ̀nsì.
- source_word: ἵνα δι’ ἐμοῦ
  choice: kí a lè tipasẹ̀ mi
  rationale: “Kí ... lè” pa ète ἵνα mọ́, “tipasẹ̀ mi” sì fi ipa ọ̀nà tàbí aṣojú tí διά pẹ̀lú ẹ̀yà-ọrọ̀ genitive ní hàn.
- source_word: τὸ κήρυγμα
  choice: ìkéde náà
  rationale: “Ìkéde” lè tọ́ka sí ohun tí a ń kéde àti iṣẹ́ kíkéde rẹ̀, nítorí náà ó pa ìbú ìtumọ̀ κήρυγμα mọ́.
- source_word: πληροφορηθῇ
  choice: mú ... ṣẹ ní kíkún
  rationale: Èyí mú èrò pípa ohun náà dé òpin tàbí ṣíṣe é ní ẹ̀kúnrẹ́rẹ́ jáde láì dín ọ̀rọ̀ náà kù sí kíkéde lásán.
- source_word: ἀκούσωσιν
  choice: lè gbọ́
  rationale: Ó túmọ̀ ìgbọ́ràn-ọrọ̀ aorist subjunctive lẹ́yìn ἵνα ní ọ̀nà Yorùbá tí ó ṣe kedere.
- source_word: πάντα τὰ ἔθνη
  choice: gbogbo àwọn orílẹ̀-èdè
  rationale: ἔθνη lè túmọ̀ sí “àwọn orílẹ̀-èdè” tàbí “àwọn tí kì í ṣe Júù.” Àṣàyàn yìí pa ìbú ẹ̀yà-orílẹ̀-èdè rẹ̀ mọ́, àlàyé ìsàlẹ̀ ojú ìwé sì tọ́ka sí ìtumọ̀ kejì.
- source_word: ἐρρύσθην
  choice: a gbà mí là
  rationale: Ìtumọ̀ yìí jẹ́ ọ̀nà Yorùbá àdánidá àti alágbára fún gbígbà ẹnì kan kúrò nínú ewu.
- source_word: ἐκ στόματος λέοντος
  choice: kúrò ní ẹnu kìnnìún
  rationale: A pa àwòrán inú ọ̀rọ̀ Gíríìkì mọ́ láì pinnu bóyá kìnnìún gidi ni tàbí àpẹẹrẹ ewu ikú.
theological_decisions:
- issue: Ẹni tí “Olúwa” (κύριος) ń tọ́ka sí
  choice: A túmọ̀ rẹ̀ sí “Olúwa” láì fi orúkọ ẹni kan kún un.
  alternative: Ó lè tọ́ka sí Jésù ní pàtó tàbí sí Ọlọ́run ní ìtumọ̀ gbogbogbò.
  rationale: Àyíká lè mú kí ọ̀pọ̀ ènìyàn lóye rẹ̀ gẹ́gẹ́ bí Jésù Olúwa, ṣùgbọ́n ọ̀rọ̀ Gíríìkì fúnra rẹ̀ kò sọ orúkọ náà níbí; ìtumọ̀ náà kò gbọ́dọ̀ yanju ohun tí ẹsẹ náà fi sílẹ̀ ní ṣíṣí.
- issue: Ìtumọ̀ “kúrò ní ẹnu kìnnìún”
  choice: A pa àwòrán ẹnu kìnnìún mọ́ gẹ́gẹ́ bí ó ṣe wà.
  alternative: Ó lè jẹ́ àpẹẹrẹ ewu ikú, Nérò, Sátánì, tàbí ìjìyà nípasẹ̀ ẹranko gidi.
  rationale: Ẹsẹ náà kò dá ọ̀kan nínú àwọn ìtumọ̀ wọ̀nyí mú; pípa àwòrán náà mọ́ yàgò fún fífi ẹ̀kọ́ ìtumọ̀ kan lé ọ̀rọ̀ náà lórí.
translation_notes:
  register: Èdè Yorùbá boṣewa, òde òní, tí ó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tí ó yẹ. “Dúró tì mí,” “fún mi lókun,” àti “gbà mí là” jẹ́ àwọn gbólóhùn àdánidá tí òǹkàwé lasán lè lóye. A fi àmì ìsàlẹ̀ ojú ìwé [a] sí “àwọn orílẹ̀-èdè” àti [b] sí “ẹnu kìnnìún,” níbi tí ọ̀kọ̀ọ̀kan ti bá àlàyé rẹ̀ mu.
