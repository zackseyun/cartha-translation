id: 2TI.1.15
reference: 2 Timothy 1:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: yo
  text: O mọ èyí pé gbogbo àwọn tí ó wà ní Éṣíà[a] ti yí ẹ̀yìn sí mi[b]; lára wọn ni Fígélù àti Hẹmọ́génè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éṣíà” níbí ń tọ́ka sí ẹkùn ìjọba Róòmù kan ní apá ìwọ̀-oòrùn Éṣíà Kékeré, kì í ṣe gbogbo ilẹ̀-ayé Éṣíà ti òde òní.
    reason: cultural_note
  - marker: b
    text: Tàbí, “ti kọ̀ mí sílẹ̀” tàbí “ti fi mí sílẹ̀.” Ní ti gidi, ọ̀rọ̀ Gíríìkì sọ pé wọ́n “yí ẹ̀yìn sí mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας
  choice: O mọ
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ìmọ̀ tí Tímótì ní tẹ́lẹ̀; “O mọ” jẹ́ ọ̀nà Yorùbá tó ṣe déédéé, tó sì ṣe tààrà láti sọ ọ́.
- source_word: τοῦτο ὅτι
  choice: èyí pé
  rationale: “Èyí pé” so ohun tí Tímótì mọ̀ pọ̀ mọ́ gbólóhùn tó tẹ̀ lé e lọ́nà àdánidá ní Yorùbá, láìsọ ìtumọ̀ náà di pàtó ju ti Gíríìkì lọ.
- source_word: ἀπεστράφησάν με
  choice: ti yí ẹ̀yìn sí mi
  rationale: Èyí pa àwòrán ọ̀rọ̀ Gíríìkì mọ́, ó sì lè túmọ̀ sí pé wọ́n kọ Pọ́ọ̀lù sílẹ̀ tàbí wọ́n jáwọ́ nínú fífi tì í lẹ́yìn.
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: gbogbo àwọn tí ó wà ní Éṣíà
  rationale: Ó pa agbára “gbogbo” mọ́, ṣùgbọ́n kò fi àlàyé kún un pé gbogbo olúkúlùkù tó ń gbé ní agbègbè náà ni.
- source_word: Ἀσίᾳ
  choice: Éṣíà
  rationale: A lò orúkọ ibi tí ó wọ́pọ̀ ní Yorùbá, nígbà tí àlàyé ìtàn nípa agbègbè Róòmù náà wà nínú àlàyé ìsàlẹ̀.
- source_word: ὧν ἐστιν
  choice: lára wọn ni
  rationale: Gbólóhùn yìí jẹ́ Yorùbá àdánidá tó fi hàn pé àwọn ẹni méjèèjì tí a dárúkọ jẹ́ apá kan nínú ẹgbẹ́ ńlá náà.
- source_word: Φύγελος
  choice: Fígélù
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìrísí tó ṣeé pè ní Yorùbá, ní títẹ̀lé ìró orúkọ Gíríìkì.
- source_word: Ἑρμογένης
  choice: Hẹmọ́génè
  rationale: A ṣe àkọsílẹ̀ orúkọ náà ní ìrísí tó ṣeé pè ní Yorùbá, ní títẹ̀lé ìró orúkọ Gíríìkì.
theological_decisions:
- issue: Ìwọ̀n àwọn tí ọ̀rọ̀ “gbogbo àwọn tí ó wà ní Éṣíà” kàn
  choice: A pa “gbogbo” mọ́ gẹ́gẹ́ bí ọ̀rọ̀ tó kan ẹgbẹ́ àwọn tí ọ̀rọ̀ inú lẹ́tà náà ń tọ́ka sí ní Éṣíà.
  alternative: Kí a túmọ̀ ọ́ bí ẹni pé gbogbo Kristẹni tàbí gbogbo olúkúlùkù ní Éṣíà pátápátá ni; tàbí kí a pè é ní àsọdùn lásán.
  rationale: πάντες ní agbára tó gbòòrò, ṣùgbọ́n àyíká ọ̀rọ̀ lè fi ààlà sí ẹgbẹ́ tí ó ń tọ́ka sí. Ìtumọ̀ náà kò dín ẹ̀dùn Pọ́ọ̀lù kù, bẹ́ẹ̀ ni kò fi àlàyé tí kò sí nínú ọ̀rọ̀ ìpilẹ̀ kún un.
translation_notes:
  register: A lo Yorùbá ìgbàlódé tó níyì, tó sì ṣeé lóye fún gbogbo ènìyàn. “Yí ẹ̀yìn sí” pa àwòrán ọ̀rọ̀ ìpilẹ̀ mọ́, nígbà tí àlàyé ìsàlẹ̀ fi àwọn ìtumọ̀ míì tó lágbára hàn. A fi àmì ohùn sí ibi tí ó bá ìlò Yorùbá àdánidá mu.
