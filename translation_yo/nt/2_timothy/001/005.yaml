id: 2TI.1.5
reference: 2 Timothy 1:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: yo
  text: Nígbà tí a mú mi rántí ìgbàgbọ́ tí kò ní àgàbàgebè tí ó wà nínú rẹ, èyí tí ó kọ́kọ́ gbé nínú Lóì, ìyá ńlá rẹ, àti nínú Ùníké, ìyá rẹ, ó dá mi lójú pé ó tún wà nínú rẹ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: Nígbà tí mo rántí
  rationale: Ó sọ ìtumọ̀ pé a mú kí Pọ́ọ̀lù rántí ohun kan, ní ọ̀nà Yorùbá tí ó ṣe déédéé; gbolohun Giriki kò sọ ẹni tàbí ohun tí ó mú un rántí.
- source_word: ἀνυποκρίτου πίστεως
  choice: ìgbàgbọ́ àìṣọ̀mtọ́mtọ́
  rationale: ἀνυπόκριτος túmọ̀ sí ohun tí kò ní àgàbàgebè tàbí èké; ‘àìṣọ̀mtọ́mtọ́’ jẹ́ ọ̀rọ̀ adayeba fún ìgbàgbọ́ tòótọ́ tí kì í ṣe ti ojú lásán.
- source_word: ἐν σοὶ
  choice: tí ó wà nínú rẹ
  rationale: Ó pa àwòrán Giriki ‘nínú rẹ’ mọ́, ó sì jẹ́ Yorùbá tí ó ṣe kedere.
- source_word: ἐνῴκησεν
  choice: gbé inú
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ‘gbé inú’ tàbí ‘ṣe ibùgbé inú’; yíyan yìí pa àwòrán ìgbé inú ẹni mọ́ dípò lílo ‘wà’ nìkan.
- source_word: πέπεισμαι
  choice: ó dá mi lójú
  rationale: Perfect passive yìí ń fi ìdánilójú tí ó dúró ṣinṣin hàn; ọ̀rọ̀ Yorùbá yìí mú ìtumọ̀ náà jáde lọ́nà adayeba.
theological_decisions:
- issue: Bí ‘ìgbàgbọ́’ ṣe ‘gbé inú’ àwọn obìnrin mẹ́tẹ̀ẹ̀ta
  choice: Pa ẹni-ṣe-bí-ẹni (personification) náà mọ́ pẹ̀lú ‘gbé inú’.
  alternative: Túmọ̀ ọ́ sí ‘tí wọ́n ní’ tàbí ‘tí ó wà lọ́dọ̀ wọn’.
  rationale: Ẹ̀dà Giriki sọ pé ìgbàgbọ́ náà ‘gbé inú’ wọn; pípa àwòrán yìí mọ́ kò fi ẹ̀kọ́ ìjọ kan kún ọ̀rọ̀ náà.
- issue: Ìdánilójú Pọ́ọ̀lù nípa ìgbàgbọ́ Tímótì
  choice: ‘ó sì dá mi lójú pé ó tún wà nínú rẹ’
  alternative: ‘mo mọ̀ pé ó tún wà nínú rẹ’
  rationale: πέπεισμαι fi ìdánilójú hàn, ṣùgbọ́n kì í ṣe ọ̀rọ̀ ìmọ̀ gẹ́gẹ́ bí οἶδα; yíyan náà pa ìyàtọ̀ yìí mọ́.
translation_notes:
  register: Yorùbá àjùmọ̀lò, ọlọ́lá, tí ó sì rọrùn fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún, a sì ṣe àkọsílẹ̀ orúkọ bí Lóì àti Ùníké ní ìbámu pẹ̀lú ìpè Yorùbá.
