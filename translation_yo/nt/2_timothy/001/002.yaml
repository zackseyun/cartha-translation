id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: yo
  text: 'Sí Tímótì, ọmọ olùfẹ́: Oore-ọ̀fẹ́, àánú àti àlàáfíà láti ọ̀dọ̀ Ọlọ́run Baba àti Mèsáyà Jésù[a] Olúwa wa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Jésù.” A tú oyè Gíríìkì Χριστός sí “Mèsáyà” níbí láti pa ìtumọ̀ rẹ̀ mọ́ dípò lílo ìkọ̀wé àṣà “Kristi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τιμοθέῳ
  choice: Sí Tímótì
  rationale: A lo ìrísí orúkọ náà tí ó bá èdè Yorùbá mu, pẹ̀lú ‘Sí’ láti fi ẹni tí lẹ́tà náà ń tọ̀ sí hàn.
- source_word: ἀγαπητῷ τέκνῳ
  choice: ọmọ olùfẹ́
  rationale: Èyí pa àpèjúwe ìbátan ọmọ àti ìfẹ́ jíjinlẹ̀ mọ́, láìfi ‘mi’ kún ọ̀rọ̀ Gíríìkì.
- source_word: χάρις
  choice: Oore-ọ̀fẹ́
  rationale: Ọ̀rọ̀ Yorùbá yìí jẹ́ ìtumọ̀ tí ó wọ́pọ̀ fún oore tí Ọlọ́run ń fi fúnni lọ́fẹ̀ẹ́.
- source_word: ἔλεος
  choice: àánú
  rationale: Ó jẹ́ ìbámu tààrà fún ìyọ́nú àti àánú, ó sì dúró lọ́tọ̀ sí oore-ọ̀fẹ́.
- source_word: εἰρήνη
  choice: àlàáfíà
  rationale: Ó sọ ìsinmi, ìbáṣepọ̀ rere àti ìwàpẹ̀lẹ́ tí ọ̀rọ̀ Gíríìkì lè ní nínú ìkíni yìí.
- source_word: θεοῦ πατρὸς
  choice: Ọlọ́run Baba
  rationale: Èyí tẹ̀lé Gíríìkì, tí kò ní ọ̀rọ̀ ‘wa’ lẹ́yìn Baba.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: A tú Χριστός gẹ́gẹ́ bí oyè ‘Mèsáyà,’ a sì kọ Jésù gẹ́gẹ́ bí orúkọ.
- source_word: κυρίου ἡμῶν
  choice: Olúwa wa
  rationale: Ó pa ìtumọ̀ àṣẹ àti oyè Kristọ́lọ́jì náà mọ́, ó sì tú ἡμῶν sí ‘wa.’
theological_decisions:
- issue: Ìtumọ̀ Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Χριστός jẹ́ oyè tí ó túmọ̀ sí ẹni àmì òróró; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde, nígbà tí àlàyé ìsàlẹ̀ ojú ìwé pa ìrísí àṣà ‘Kristi’ mọ́.
- issue: Ìbáṣepọ̀ ‘ọmọ’ nínú τέκνῳ
  choice: ọmọ olùfẹ́
  alternative: ọmọkùnrin olùfẹ́
  rationale: τέκνον jẹ́ ọ̀rọ̀ gbogbogbò fún ọmọ, kì í ṣe ọ̀rọ̀ tó fi akọ nìkan hàn; nítorí náà a kò mú ìtumọ̀ náà dín kù sí ‘ọmọkùnrin.’
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àtẹ̀jáde òde òní, ọlọ́wọ̀ àti yéye. A lo àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá èdè, a sì pa ìṣètò ìkíni Gíríìkì àti àwọn ọ̀rọ̀ mẹ́ta ‘oore-ọ̀fẹ́, àánú àti àlàáfíà’ mọ́.
