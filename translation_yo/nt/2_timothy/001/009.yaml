id: 2TI.1.9
reference: 2 Timothy 1:9
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: yo
  text: ẹni tí ó gbà wa là, tí ó sì pè wa pẹ̀lú ìpè mímọ́[a], kì í ṣe ní ìbámu pẹ̀lú àwọn iṣẹ́ wa, bí kò ṣe ní ìbámu pẹ̀lú ète tirẹ̀ àti oore-ọ̀fẹ́ rẹ̀, oore-ọ̀fẹ́ tí a fi fún wa nínú Mèsáyà Jésù ṣáájú àwọn àkókò ayérayé[b][c][d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí ‘pè wa sí ìpè mímọ́’ tàbí ‘pè wa nípasẹ̀ ìpè mímọ́.’ Dátífù Gíríìkì náà lè ní ju ìtumọ̀ kan lọ.
    reason: lexical_alternative
  - marker: b
    text: A tún lè sọ pé ‘nínú Kristi Jésù.’ ‘Mèsáyà Jésù’ ni a lò níbí nítorí a lóye Χριστός gẹ́gẹ́ bí oyè.
    reason: alternative_reading
  - marker: c
    text: A tún lè túmọ̀ rẹ̀ sí ‘ṣáájú àwọn ìgbà ayérayé,’ ‘ṣáájú kí àwọn sáà tó bẹ̀rẹ̀,’ tàbí, ní ọ̀nà tó túbọ̀ jẹ́ ti ojoojúmọ́, ‘ṣáájú ìbẹ̀rẹ̀ àkókò.’
    reason: lexical_alternative
  - marker: d
    text: Ìtumọ̀ mìíràn ni ‘ṣáájú àwọn àkókò tí ó jẹ́ ayérayé.’
    reason: previous_rendering
lexical_decisions:
- source_word: σώσαντος
  choice: gbà wá là
  rationale: Ọ̀rọ̀ yìí jẹ́ ọ̀nà Yorùbá tí ó ṣe déédéé fún ‘ó gba wa là,’ ó sì pa ìtumọ̀ ìgbàlà ti ọ̀rọ̀ Gíríìkì σῴζω mọ́.
- source_word: καλέσαντος
  choice: pè wá
  rationale: ‘Pè’ jẹ́ ọ̀rọ̀ Yorùbá tó mọ́, tó sì lè ru ìtumọ̀ ìpè Ọlọ́run bí ó ti rí nínú ọ̀rọ̀ Pọ́ọ̀lù.
- source_word: κλήσει ἁγίᾳ
  choice: ní ìpè mímọ́
  rationale: Gbólóhùn yìí tẹ̀lé ìbátan ọ̀rọ̀-ìṣe àti ọ̀rọ̀-orúkọ inú Gíríìkì, láì fi tipátipá pinnu bóyá dátífù náà ń tọ́ka sí ọ̀nà, ohun tí a pè sí, tàbí irú ìpè náà.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: kì í ṣe ní ìbámu pẹ̀lú àwọn iṣẹ́ wa
  rationale: ‘Ní ìbámu pẹ̀lú’ fi ìtumọ̀ κατά gẹ́gẹ́ bí ìlànà tàbí ìpìlẹ̀ hàn, ó sì pa ‘àwọn iṣẹ́’ mọ́ gẹ́gẹ́ bí ọ̀rọ̀ pàtàkì nínú ẹ̀kọ́ Pọ́ọ̀lù.
- source_word: ἰδίαν πρόθεσιν
  choice: ète tirẹ̀
  rationale: ‘Ète’ jẹ́ ọ̀rọ̀ Yorùbá adayébá fún ìpinnu tàbí èrò tí Ọlọ́run ní; ‘tirẹ̀’ sì fi ἰδίαν hàn.
- source_word: χάριν
  choice: oore-ọ̀fẹ́ rẹ̀
  rationale: ‘Oore-ọ̀fẹ́’ ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún χάρις nínú ọ̀rọ̀ ìgbàlà, ‘rẹ̀’ sì mú ẹni tí oore-ọ̀fẹ́ náà ti wá ṣe kedere.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: oore-ọ̀fẹ́ tí ó fi fún wa
  rationale: Àtúnsọ ‘oore-ọ̀fẹ́’ mú kí ó ṣe kedere ní Yorùbá pé apá gbólóhùn yìí ń tọ́ka sí χάριν, bí ìbámu abo inú Gíríìkì ti fi hàn.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nínú Mèsáyà Jésù
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; ‘Mèsáyà’ tú ìtumọ̀ oyè náà jáde, nígbà tí ‘Jésù’ pa orúkọ ẹni náà mọ́.
- source_word: πρὸ χρόνων αἰωνίων
  choice: ṣáájú àwọn àkókò ayérayé
  rationale: Ìtumọ̀ yìí pa àwòrán àìlẹ́gbẹ́ Gíríìkì—‘ṣáájú àwọn àkókò/ìgbà ayérayé’—mọ́ dípò kí ó yí i padà sí ‘ṣáájú ìbẹ̀rẹ̀ àkókò’ nìkan.
theological_decisions:
- issue: Bóyá Χριστῷ jẹ́ oyè tàbí apá orúkọ tí a ti mú mọ́ra
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Nítorí Χριστός ṣì ní agbára oyè ‘Ẹni Àmìòróró’ nínú gbólóhùn yìí, ‘Mèsáyà’ ni a lò láti jẹ́ kí ìtumọ̀ oyè náà hàn.
- issue: Agbára dátífù nínú κλήσει ἁγίᾳ
  choice: ní ìpè mímọ́
  alternative: sí ìpè mímọ́; nípasẹ̀ ìpè mímọ́
  rationale: Gíríìkì lè tọ́ka sí ohun tí a pè sí, ọ̀nà tí a fi pè, tàbí irú ìpè náà. Ọ̀rọ̀ àkọ́kọ́ àti àlàyé ìsàlẹ̀ ojú ìwé pa àìdánilójú yìí mọ́.
- issue: Ìtọ́kasí τὴν δοθεῖσαν
  choice: oore-ọ̀fẹ́ tí ó fi fún wa
  alternative: èyí tí a fi fún wa
  rationale: Ìbámu gírámà Gíríìkì fi hàn pé participle abo náà ń tọ́ka sí χάριν, nítorí náà àtúnsọ ‘oore-ọ̀fẹ́’ kò yanjú ariyanjiyan ẹ̀kọ́ kan, ó kàn mú ìbátan gírámà náà ṣe kedere ní Yorùbá.
translation_notes:
  register: Yorùbá boṣewa oníyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. Gbólóhùn náà jẹ́ apá kan tí ó ń bá ẹsẹ ṣáájú lọ, nítorí náà ó bẹ̀rẹ̀ pẹ̀lú ‘ẹni tí’ ó sì parí pẹ̀lú àmì kọ́mà. Àtúnsọ ‘oore-ọ̀fẹ́’ ń dènà àìṣe kedere tí arọ́pò-orúkọ Yorùbá lè fa, láì ṣàfikún ẹ̀kọ́ tuntun.
