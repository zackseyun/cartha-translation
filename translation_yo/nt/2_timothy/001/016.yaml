id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: yo
  text: Kí Olúwa ṣàánú àwọn ará ilé Onesiforusi, nítorí ó ti tù mí lára ní ọ̀pọ̀ ìgbà, kò sì tijú ẹ̀wọ̀n mi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ìgbèkùn mi”; ní tààràtà, “ẹ̀wọ̀n mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: Kí ... fi ... fún
  rationale: Ọ̀rọ̀-ìṣe optative aorist yìí ń sọ ìfẹ́ tàbí àdúrà; ìṣètò ‘Kí ... fi ... fún’ jẹ́ ọ̀nà àdúrà tó bá èdè Yorùbá mu.
- source_word: ἔλεος
  choice: àánú
  rationale: ‘Àánú’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún ojúrere Ọlọ́run sí ẹni tó nílò rẹ̀.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: Èyí pa oyè àtọ̀runwá náà mọ́ láì pinnu ẹni tí ó ń tọ́ka sí ju bí Gíríìkì ṣe sọ lọ.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: agbo ilé Onesiforusi
  rationale: ‘Agbo ilé’ ń tọ́ka sí ìdílé àti gbogbo àwọn tó wà lábẹ́ ilé ẹni náà, kì í ṣe ilé gẹ́gẹ́ bí ilé gbígbé nìkan.
- source_word: ὅτι
  choice: nítorí
  rationale: Ó fi ìdí fún ìbùkún tàbí àdúrà tó ṣáájú hàn ní kedere.
- source_word: πολλάκις
  choice: ní ọ̀pọ̀ ìgbà
  rationale: Ó sọ ìṣe tó ṣẹlẹ̀ léraléra ní Yorùbá àdánidá.
- source_word: ἀνέψυξεν
  choice: tù mí lára
  rationale: Gbólóhùn yìí ń fi ìtura, ìrànlọ́wọ́, àti ìmú-ọkàn-lé hàn lọ́nà tí ó bá Yorùbá mu.
- source_word: τὴν ἅλυσίν μου
  choice: ẹ̀wọ̀n mi
  rationale: ‘Ẹ̀wọ̀n’ pa àwòrán ohun tí a fi dè ènìyàn mọ́, ó sì lè dúró fún ìgbèkùn bíi ti Gíríìkì.
- source_word: οὐκ ἐπαισχύνθη
  choice: kò sì tijú
  rationale: Èyí ń pa agbára ìtìjú níwájú àwùjọ àti ìtumọ̀ ìwà rere inú ọ̀rọ̀ Gíríìkì mọ́.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ ń tọ́ka sí nínú ìbùkún Pọ́ọ̀lù
  choice: Olúwa
  alternative: Ọlọ́run Baba tàbí Jésù Olúwa
  rationale: Gíríìkì sọ ὁ κύριος nìkan; ìtumọ̀ náà kò sọ ẹni pàtó sí i, kí ó má bàa yanjú ohun tí ẹsẹ̀ náà fi sílẹ̀ láìsọ pàtó.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀, tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘agbo ilé’ fún ìtumọ̀ ẹgbẹ́ ìdílé, ‘tù mí lára’ fún ìtura tí Onesiforusi mú wá, a sì pa àwòrán ẹ̀wọ̀n mọ́ pẹ̀lú àlàyé ìsàlẹ̀.
