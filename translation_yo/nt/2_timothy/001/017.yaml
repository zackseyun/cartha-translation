  yaml_path: translation/nt/2_timothy/001/017.yaml
  text: but when he was in Rome[a], he searched for me diligently and found me—
translation:
  language: yo
  text: ṣùgbọ́n nígbà tí ó wà ní Róòmù[a], ó fi ìtara wá mi, ó sì rí mi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nígbà tí ó dé Róòmù”; ní ìtumọ̀ tí ó tẹ̀lé ìṣètò Gíríìkì pẹ̀lú, “ní wíwà ní Róòmù.” Ọ̀rọ̀ Gíríìkì γενόμενος lè ní ìtumọ̀ dídé sí ibì kan tàbí wíwà níbẹ̀ nínú àyíká yìí.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: ṣùgbọ́n
  rationale: Ọ̀rọ̀ àsopọ̀ alátakò yìí fi ìwà Onesifórù yàtọ̀ sí ti àwọn tí àyíká ọ̀rọ̀ ṣáájú sọ pé wọ́n kọ Pọ́ọ̀lù sílẹ̀.
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: nígbà tí ó wà ní Róòmù
  rationale: Gbólóhùn yìí mú ìtumọ̀ pé ó dé tàbí ó wà ní Róòmù jáde lọ́nà Yorùbá tí ó ṣe déédéé, láìfi dandan pinnu pé ìṣe dídé ni Gíríìkì ń tẹnumọ́.
- source_word: σπουδαίως
  choice: fi gbogbo ara
  rationale: Ó fi ìtara, ìfọkànsìn, àti ìsapá gidigidi hàn nínú wíwá ẹnì kan; àpólà Yorùbá yìí jẹ́ ti ẹ̀dá, ó sì bá ìṣe wíwá mu.
- source_word: ἐζήτησέν με
  choice: ó ... wá mi
  rationale: ζητέω níbí túmọ̀ sí lílọ wá ẹnì kan pẹ̀lú ìsapá; ‘wá mi’ jẹ́ ọ̀nà Yorùbá tó ṣe déédéé.
- source_word: καὶ εὗρεν
  choice: ó sì rí mi
  rationale: Ó sọ àbájáde wíwá náà ní ṣókí, ó sì tún mú ohun tí a rí—‘mi’—hàn kedere ní Yorùbá.
