  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: yo
  text: Mo dúpẹ́ lọ́wọ́ Ọlọ́run, ẹni tí mo ń sìn[a] láti ọ̀dọ̀ àwọn baba ńlá mi[b] pẹ̀lú ẹ̀rí-ọkàn mímọ́, bí mo ti ń rántí rẹ láìdáwọ́dúró nínú àwọn ẹ̀bẹ̀ mi[c], ní òru àti ní ọ̀sán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹni tí mo ń jọ́sìn.” Ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí iṣẹ́ ìsìn tàbí ìjọsìn tí a fi fún Ọlọ́run.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “gẹ́gẹ́ bí àṣà àwọn baba ńlá mi,” tàbí, “gẹ́gẹ́ bí àwọn baba ńlá mi ti ṣe.” Ní ọ̀rọ̀ gẹ́lẹ́, “láti ọ̀dọ̀ àwọn baba ńlá mi.” Gbólóhùn náà lè fi ìtẹ̀síwájú nínú ogún ìgbàgbọ́ àti iṣẹ́ ìsìn àwọn baba ńlá hàn.
    reason: lexical_alternative
  - marker: c
    text: Ní ọ̀rọ̀ gẹ́lẹ́, “bí mo ti ní ìrántí nípa rẹ láìdáwọ́dúró nínú àwọn ẹ̀bẹ̀ mi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: Mo dúpẹ́ lọ́wọ́ Ọlọ́run
  rationale: Ọ̀rọ̀ Gíríìkì yìí jẹ́ àṣà-ọrọ fún fífi ọpẹ́ fún ẹnìkan; èyí ni ọ̀nà Yorùbá tó ṣe déédéé, tó sì pa ìtumọ̀ ọpẹ́ sí Ọlọ́run mọ́.
- source_word: ᾧ λατρεύω
  choice: ẹni tí mo ń sìn
  rationale: λατρεύω lè túmọ̀ sí iṣẹ́ ìsìn tàbí ìjọsìn tí a ń ṣe fún Ọlọ́run. “Ń sìn” pa ìtumọ̀ méjèèjì mọ́ láì fi ọ̀rọ̀ náà mọ́ ìjọsìn ayẹyẹ nìkan.
- source_word: ἀπὸ προγόνων
  choice: gẹ́gẹ́ bí àwọn baba ńlá mi ti ṣe
  rationale: Gbólóhùn náà tọ́ka sí ìtẹ̀síwájú nínú ìgbàgbọ́ àti iṣẹ́ ìsìn àwọn baba ńlá; ìtumọ̀ yìí jẹ́ adayeba ní Yorùbá ju “láti ọ̀dọ̀ àwọn baba ńlá” lọ.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: pẹ̀lú ẹ̀rí-ọkàn tí ó mọ́
  rationale: Èyí fi ọ̀nà tí Paulu fi ń sin Ọlọ́run hàn. “Ẹ̀rí-ọkàn tí ó mọ́” jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún συνείδησις tí kò ní ẹ̀sùn ìwà.
- source_word: ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: bí mo ti ń rántí rẹ nígbà gbogbo
  rationale: “Bí” pa ìbáṣepọ̀ ὡς mọ́ láì sọ ọ́ di ìdí pàtó; “ń rántí rẹ nígbà gbogbo” sọ àkópọ̀ ọ̀rọ̀ Gíríìkì náà ní Yorùbá adayeba.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: nínú àdúrà mi
  rationale: δέησις ní pàtàkì lè jẹ́ ẹ̀bẹ̀ nínú àdúrà, ṣùgbọ́n “àdúrà” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì bá ọ̀rọ̀ yìí mu.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ní òru àti ní ọ̀sán
  rationale: Èyí jẹ́ ọ̀nà Yorùbá adayeba láti sọ ìrántí àti àdúrà tó ń ṣẹlẹ̀ déédéé ní gbogbo àkókò.
theological_decisions:
- issue: Ìbáṣepọ̀ iṣẹ́ ìsìn Paulu pẹ̀lú ogún àwọn baba ńlá rẹ̀ nínú ἀπὸ προγόνων
  choice: Paulu ń fi iṣẹ́ ìsìn rẹ̀ sí Ọlọ́run hàn gẹ́gẹ́ bí ohun tó ń bá ti àwọn baba ńlá rẹ̀ lọ.
  alternative: Ó lè túmọ̀ sí pé ó ti ń sin Ọlọ́run láti ìgbà àwọn baba ńlá rẹ̀ wá, tàbí pé ó ń ṣe bẹ́ẹ̀ nínú àṣà tí ó gbà lọ́wọ́ wọn.
  rationale: “Gẹ́gẹ́ bí àwọn baba ńlá mi ti ṣe” fi ìtẹ̀síwájú hàn láì fi ẹ̀kọ́ ẹ̀sìn míì kún ọ̀rọ̀ náà.
- issue: Ìtumọ̀ λατρεύω
  choice: sìn
  alternative: jọ́sìn
  rationale: “Sìn” gbòòrò tó láti gba iṣẹ́ mímọ́ àti ìjọsìn sí Ọlọ́run, ó sì yẹra fún dídín ọ̀rọ̀ náà kù sí ìṣe ìjọsìn ayẹyẹ nìkan.
translation_notes:
  register: Yorùbá ìpele àárín tó ní iyì, tó ṣe kedere fún òǹkàwé òde òní; a lo àmì ohùn ní kíkún níbi tí ó bá yẹ. Gbólóhùn náà pa ìṣàn ọ̀rọ̀ Gíríìkì mọ́, ṣùgbọ́n a ṣètò rẹ̀ ní ọ̀nà adayeba fún Yorùbá.
