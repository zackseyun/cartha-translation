id: 2TI.1.11
reference: 2 Timothy 1:11
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος καὶ ⸀διδάσκαλος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/011.yaml
  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: yo
  text: Nítorí ìhìn rere yìí ni a fi yàn mí ṣe akéde[a], àpọ́sítélì àti olùkọ́ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “oníwàásù.” Ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ẹni tí a yàn láti polongo ọ̀rọ̀ ní gbangba.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Nítorí ìhìn rere yìí
  rationale: Ọ̀rọ̀ yìí tọ́ka sẹ́yìn sí ìhìn rere tí a mẹ́nu kàn ní àyíká ẹsẹ̀ náà. Ṣíṣe àfihàn ohun tí arọ́pò-orúkọ náà ń tọ́ka sí mú kí Yorùbá ṣe kedere láì yí ìtumọ̀ rẹ̀ padà.
- source_word: ἐτέθην
  choice: a fi yàn mí ṣe
  rationale: Nínú àkójọ ipa iṣẹ́ yìí, ọ̀rọ̀ náà túmọ̀ sí yíyan tàbí fífi ẹnì kan sí iṣẹ́ kan, kì í ṣe gbígbé e sí ibi kan. Ìṣe aláìlẹ́ni tó ṣe é tún pa ẹni tó yàn Pọ́ọ̀lù mọ́ láì sọ ọ́ ní tààrà.
- source_word: ἐγὼ
  choice: mí
  rationale: Fọ́ọ̀mù arọ́pò-orúkọ Yorùbá yìí dára ní gbolohun náà; ìtẹnumọ́ Gíríìkì wà nínú ìṣètò ‘ni ... mí’ láì fi ọ̀rọ̀ àfikún tí yóò le jù sí i.
- source_word: κῆρυξ
  choice: akéde
  rationale: ‘Akéde’ fi ipa ẹni tí a rán láti kéde ọ̀rọ̀ ní gbangba hàn, ó sì yẹra fún dídín ọ̀rọ̀ náà kù sí iṣẹ́ ìwàásù inú ìjọ nìkan.
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Níbi tí Pọ́ọ̀lù ti ń sọ nípa ara rẹ̀, ọ̀rọ̀ náà jẹ́ orúkọ ipa àpọ́sítélì tí a mọ̀ dáadáa; èyí ni ìtumọ̀ Yorùbá tó ti fìdí múlẹ̀.
- source_word: διδάσκαλος
  choice: olùkọ́ni
  rationale: ‘Olùkọ́ni’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá fún ẹni tó ń kọ́ àwọn ẹlòmíràn, ó sì bá àkójọ àwọn ipa iṣẹ́ náà mu.
theological_decisions:
- issue: Bóyá kí κῆρυξ jẹ́ ‘akéde’ tàbí ‘oníwàásù’
  choice: akéde
  alternative: oníwàásù
  rationale: ‘Akéde’ dáàbò bo ìtumọ̀ ẹni tí a fún ní àṣẹ láti polongo ọ̀rọ̀ ní gbangba, láì sọ ọ́ di ipò iṣẹ́ ìjọ kan pàtó.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì rọrùn fún òǹkàwé gbogbo. Àkójọ ‘akéde, àpọ́sítélì àti olùkọ́ni’ pa ìṣọ̀kan àwọn ipa mẹ́tẹ̀ẹ̀ta mọ́.
