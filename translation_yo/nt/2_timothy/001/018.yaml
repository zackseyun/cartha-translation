revisions:
- from: Kí Olúwa jẹ́ kí ó rí àánú gbà lọ́dọ̀ Olúwa[a] ní ọjọ́ náà[b]—àti bí iṣẹ́ ìránṣẹ́ tí ó ṣe ní Éfésù ti pọ̀ tó, ìwọ fúnra rẹ mọ̀ dáadáa jù.[c]
  to: Kí Olúwa fún un ní láti rí àánú lọ́dọ̀ Olúwa[a] ní ọjọ́ náà[b]—ìwọ sì mọ̀ dáadáa jù bí iṣẹ́ ìránṣẹ́ tí ó ṣe ní Éfésù ti pọ̀ tó.[c]
  rationale: Àtúnṣe náà mú ìfẹ́/àdúrà optative δῴη hàn ní Yorùbá láìyí ìtumọ̀ ẹsẹ̀ náà, ó pa ‘rí àánú’ mọ́ fún εὑρεῖν ἔλεος, ó sì fi παρά κυρίου sí ‘lọ́dọ̀ Olúwa.’ Àwọn àmì ẹsẹ̀ àti gbogbo àwọn àlàyé ìsàlẹ̀ ni a pa mọ́; kò sí ìtumọ̀ ẹ̀kọ́ ìjọ tí a fi kún ẹsẹ̀ náà.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:41Z'
review_pass:
  verdict: revise
  source_fidelity: Ìbẹ̀rẹ̀ ẹsẹ̀ náà nílò àtúnṣe kékeré. ‘Kí Olúwa jẹ́ kí ó rí’ lè túmọ̀ sí pé Olúwa kan ń gba a láyè láti rí àánú; δῴη, síbẹ̀, jẹ́ ìfẹ́/àdúrà pé Olúwa fún un ní ohun tí yóò jẹ́ kí ó rí àánú. Yíyọ ‘gbà’ kúrò nínú ‘rí àánú gbà’ sì pa ìdíòmù εὑρεῖν ἔλεος mọ́ dáadáa ju.
  naturalness: Ọ̀rọ̀ náà jẹ́ Yorùbá boṣewa tó ní àmì ohùn tó péye ní àpapọ̀. ‘Rí àánú lọ́dọ̀ Olúwa’ jẹ́ ìṣọ̀kan ọ̀rọ̀ tó rọrùn àti tó bá ẹsẹ̀ náà mu. A tún ṣètò apá ìkẹyìn díẹ̀ kí ìbáṣepọ̀ ‘àti’ àti ‘ìwọ’ hàn gbangba.
  terminology: ‘Olúwa,’ ‘àánú,’ ‘ọjọ́ náà,’ ‘iṣẹ́ ìránṣẹ́,’ àti ‘Éfésù’ bá ọ̀rọ̀ Gíríìkì àti ìforúkọsílẹ̀ Yorùbá ode òní mu. A pa ìtẹ̀numọ́ àti àìṣiṣẹ́pinnu nípa àwọn ìtọ́kasí méjì sí ‘Olúwa’ mọ́.
  issues:
  - severity: medium
    issue: ‘Kí Olúwa jẹ́ kí ó rí àánú gbà’ lè fi δῴη hàn gẹ́gẹ́ bí ìfẹ̀sí láti gba láyè, kì í ṣe ẹ̀bẹ̀ pé kí Olúwa fún un ní àǹfààní láti rí àánú.
    rationale: Aorist optative δῴη nínú àkóónú yìí jẹ́ ìfẹ́/àdúrà ìbùkún. ‘Kí Olúwa fún un ní láti rí àánú’ ń sọ agbára ìbẹ̀rẹ̀ yìí ní kedere, nígbà tí ‘rí àánú’ ń pa εὑρεῖν ἔλεος mọ́.
  - severity: low
    issue: ‘Àánú gbà’ kún ìṣe ‘gbà’ sí ‘rí àánú.’
    rationale: Bí ó tilẹ̀ jẹ́ pé ó ṣàlàyé ohun tí a ń rí, Gíríìkì lo ‘rí,’ Yorùbá náà sì lè sọ ‘rí àánú lọ́dọ̀ Olúwa’ ní ti ara láìfi ìṣe mìíràn kún un.
