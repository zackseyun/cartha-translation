id: 2TI.1.18
reference: 2 Timothy 1:18
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: yo
  text: Kí Olúwa fún un ní láti rí àánú lọ́dọ̀ Olúwa[a] ní ọjọ́ náà[b]—ìwọ sì mọ̀ dáadáa jù bí iṣẹ́ ìránṣẹ́ tí ó ṣe ní Éfésù ti pọ̀ tó.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè tú u sí ‘níwájú Olúwa’ tàbí ‘pẹ̀lú Olúwa.’ Nínú gbolohun yìí, ‘lọ́dọ̀ Olúwa’ lè fi hàn pé Olúwa ni orísun àánú náà, tàbí kí ó tẹnu mọ́ rírí àánú níwájú rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: ‘Ọjọ́ náà’ jẹ́ ọ̀nà tí Májẹ̀mú Tuntun sábà máa ń gbà tọ́ka sí ọjọ́ ìdájọ́ tàbí ìdáláre Ọlọ́run tí ń bọ̀.
    reason: cross_reference
  - marker: c
    text: A tún lè tú u sí ‘gbogbo iṣẹ́ ìránṣẹ́ tí ó ṣe.’ Ọ̀rọ̀ Gíríìkì náà ṣàkópọ̀ bí iṣẹ́ rẹ̀ ní Éfésù ti pọ̀ tó.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ
  choice: Kí Olúwa jẹ́ kí ó
  rationale: Ọ̀rọ̀-ìṣe optative náà jẹ́ àdúrà tàbí ìfẹ́-ọkàn. Ìṣètò ‘Kí ... jẹ́ kí ...’ jẹ́ ọ̀nà Yorùbá àdánidá láti sọ irú àdúrà bẹ́ẹ̀, láìsọ ọ́ di àṣẹ tàbí ìdánilójú.
- source_word: εὑρεῖν ἔλεος
  choice: rí àánú gbà
  rationale: Èyí pa àwòrán Gíríìkì ‘rí àánú’ mọ́; fífi ‘gbà’ kún un mú kí gbolohun náà ṣe kedere, ó sì jẹ́ àdánidá ní Yorùbá.
- source_word: παρὰ κυρίου
  choice: lọ́dọ̀ Olúwa
  rationale: ‘Lọ́dọ̀’ lè tọ́ka sí orísun ohun tí a rí gbà, ó sì tún lè ní ìtumọ̀ wíwà níwájú tàbí ní ọ̀dọ̀ ẹni; nítorí náà, ó pa ìwọ̀n àìdánilójú inú παρά mọ́.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ní ọjọ́ náà
  rationale: Èyí ni ìtumọ̀ àkókò tó bá Yorùbá mu, ó sì pa ọ̀nà ìtọ́ka Páùlù sí ọjọ́ ọjọ́ iwájú náà mọ́ láìṣàlàyé rẹ̀ ju ohun tí Gíríìkì sọ lọ.
- source_word: ὅσα ... διηκόνησεν
  choice: bí iṣẹ́ ìránṣẹ́ tí ó ṣe ... ti pọ̀ tó
  rationale: Ìtumọ̀ yìí sọ ìwọ̀n tàbí ọ̀pọ̀ iṣẹ́ rẹ̀ ní ọ̀nà Yorùbá tó ṣe kedere, ó sì yẹra fún lílo ‘iṣẹ́ òjíṣẹ́,’ èyí tó lè mú ipò ìjọ kan wọ inú ọ̀rọ̀ náà.
- source_word: βέλτιον σὺ γινώσκεις
  choice: ìwọ fúnra rẹ mọ̀ dáadáa jù
  rationale: ‘Dáadáa jù’ pa agbára afiwéra βέλτιον mọ́, nígbà tí ‘ìwọ fúnra rẹ’ fi ìtẹnumọ́ σὺ hàn láìfi ẹni tí a fi wé e kún ọ̀rọ̀.
- source_word: ἐν Ἐφέσῳ
  choice: ní Éfésù
  rationale: Ìtumọ̀ ibi tó ṣe tààrà, pẹ̀lú orúkọ ìlú náà ní ìrísí Yorùbá.
theological_decisions:
- issue: Ẹni tí ‘Olúwa’ kọ̀ọ̀kan ń tọ́ka sí nínú ὁ κύριος ... παρὰ κυρίου
  choice: A tú àwọn méjèèjì sí ‘Olúwa’ láìsọ pé ẹni kan yàtọ̀ sí èkejì.
  alternative: Olúwa àkọ́kọ́ lè jẹ́ Kristi, èkejì sì lè jẹ́ Baba; tàbí àwọn méjèèjì lè tọ́ka sí Kristi.
  rationale: Gíríìkì tún κύριος sọ lẹ́ẹ̀mejì láìṣe ìyàtọ̀ kedere. Ìtumọ̀ náà pa àìdánilójú ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
- issue: Ìtumọ̀ ọjọ́ ìkẹyìn inú ‘ọjọ́ náà’
  choice: A pa á mọ́ gẹ́gẹ́ bí ‘ọjọ́ náà.’
  alternative: Ọjọ́ ìdájọ́ tàbí ọjọ́ Olúwa.
  rationale: Ó ṣeé ṣe kí gbolohun náà tọ́ka sí ọjọ́ ìdájọ́ tàbí ìdáláre lọ́jọ́ iwájú, ṣùgbọ́n ọ̀rọ̀ Gíríìkì kò sọ ìtumọ̀ náà ní kíkún.
translation_notes:
  register: Yorùbá boṣewa ni a lò, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀wọ̀, ó ṣe kedere fún òǹkàwé òde òní, kò sì lo ọ̀rọ̀ ẹ̀sìn tó lè fi ipò ìjọ kan kún διακονέω.
