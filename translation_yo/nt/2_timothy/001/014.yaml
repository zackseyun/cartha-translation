source:
  edition: SBLGNT
  text: τὴν καλὴν παραθήκην φύλαξον διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: yo
  text: Fi Ẹ̀mí Mímọ́[b] tí ń gbé nínú wa ṣọ́ ohun rere tí a fi lé ọ lọ́wọ́[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ohun rere ọlọ́lá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Nípasẹ̀ Ẹ̀mí Mímọ́ tí ń gbé nínú wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: ohun rere tí a fi sí ìkáwọ́ rẹ
  rationale: Ọ̀rọ̀ yìí sọ nípa ohun iyebíye tí a fi lé ẹnì kan lọ́wọ́ láti tọ́jú. Gbólóhùn Yorùbá yìí jẹ́ àdánidá, ó sì pa ìtumọ̀ ohun tí a gbé lé Tímótì lọ́wọ́ mọ́ láì sọ pàtó pé ìhìnrere tàbí iṣẹ́ ìránṣẹ́ ni.
- source_word: φύλαξον
  choice: ṣọ́
  rationale: Ọ̀rọ̀ àṣẹ yìí béèrè fún ìṣọ́ra àti ààbò tó lágbára; “ṣọ́” dá ìtumọ̀ ìṣọ́ ohun tí a fi lé ẹni lọ́wọ́ mú dáadáa.
- source_word: διὰ πνεύματος ἁγίου
  choice: Fi Ẹ̀mí Mímọ́
  rationale: διά pẹ̀lú gẹnitífù lè fi ọ̀nà tàbí aṣojú hàn. “Fi Ẹ̀mí Mímọ́” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ pé Ẹ̀mí Mímọ́ ni agbára tàbí ọ̀nà tí a fi ń ṣọ́ ohun náà.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: tí ń gbé inú wa
  rationale: Ó pa ìṣe tí ń bá a lọ àti wíwà Ẹ̀mí nínú àwọn ẹni náà mọ́, láì lo ọ̀rọ̀ ẹ̀kọ́ ìgbàgbọ́ tí kò wọ́pọ̀.
theological_decisions:
- issue: Ohun tí “ohun rere tí a fi sí ìkáwọ́ rẹ” ń tọ́ka sí
  choice: A fi gbólóhùn náà sílẹ̀ ní gbogbogbò láì sọ pé ìhìnrere tàbí iṣẹ́ ìránṣẹ́ ni.
  alternative: Ìhìnrere tí a fi lé Tímótì lọ́wọ́; tàbí iṣẹ́ ìránṣẹ́ rẹ̀.
  rationale: Àyíká ọ̀rọ̀ tọ́ka sí ohun ìgbẹ́kẹ̀lé aposteli, ṣùgbọ́n èdè Gíríìkì kò sọ ohun náà ní pàtó. Ìtumọ̀ náà pa àìsọ pàtó yìí mọ́.
- issue: Ìwọ̀n ẹni tí “wa” kà sí
  choice: A pa “wa” mọ́ láì dín un kù sí Pọ́ọ̀lù àti Tímótì nìkan tàbí fa á sí gbogbo onígbàgbọ́ ní pàtó.
  alternative: Gbogbo àwọn onígbàgbọ́; tàbí Pọ́ọ̀lù àti Tímótì ní pàtó.
  rationale: ἡμῖν lè tọ́ka sí àwọn tí ọ̀rọ̀ náà kàn lẹ́sẹ̀kẹsẹ̀, ó sì tún lè ní ìtumọ̀ tó gbòòrò sí àwùjọ àwọn onígbàgbọ́. A kò fi ipa yan ọ̀kan.
- issue: Ìtumọ̀ διά gẹ́gẹ́ bí ọ̀nà tàbí aṣojú
  choice: “Fi Ẹ̀mí Mímọ́”
  alternative: “Nípasẹ̀ Ẹ̀mí Mímọ́”
  rationale: Àwọn méjèèjì lè sọ ọ̀nà tàbí agbára tí iṣẹ́ náà fi ṣẹlẹ̀. Àkọ́kọ́ jẹ́ àdánidá jù ní Yorùbá, a sì fi èkejì sínú àlàyé ìsàlẹ̀.
translation_notes:
  register: Èdè Yorùbá boṣewa, ọlọ́wọ̀ àti àdánidá ni a lò. “Ohun rere tí a fi sí ìkáwọ́ rẹ” ṣàlàyé àwòrán παραθήκη ní ọ̀nà tí òǹkàwé òde òní lè lóye, láì pa àìsọ pàtó inú ọ̀rọ̀ Gíríìkì rẹ́.
