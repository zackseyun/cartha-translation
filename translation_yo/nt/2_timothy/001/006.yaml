language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: yo
  text: Nítorí ìdí yìí, mo rán ọ létí pé kí o tún mú ẹ̀bùn Ọlọ́run tí ó wà nínú rẹ jó fòfò[a] nípasẹ̀ gbígbé ọwọ́ mi lé ọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, ‘kí o fẹ́ ẹ̀bùn náà bí iná kí ó máa jó.’ Ọ̀rọ̀-ìṣe Gíríìkì náà ń mú àwòrán fífẹ́ iná tí ń kú kí ó tún jó gidigidi wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Nítorí ìdí yìí
  rationale: Ó jẹ́ ọ̀rọ̀ àsopọ̀ tó ń tọ́ka sí ìdí ohun tí a ṣẹ̀ṣẹ̀ sọ, ó sì bá èdè Yorùbá àdánidá mu.
- source_word: ἀναμιμνῄσκω
  choice: mo rán ọ létí
  rationale: Ó sọ ìṣe rírán ẹni létí ní kedere, ó sì jẹ́ ọ̀nà tí ó wọ́pọ̀ ní Yorùbá òde òní.
- source_word: σε ἀναζωπυρεῖν
  choice: kí o tún mú ... jó fòfò
  rationale: Ọ̀rọ̀ Gíríìkì náà ní àwòrán mímú iná tí ń kú sọjí, kí ó sì tún jó gidigidi; ‘tún mú ... jó fòfò’ pa àwòrán iná àti ìtumọ̀ àtúnsọjí náà mọ́.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: ẹ̀bùn Ọlọ́run
  rationale: ‘Ẹ̀bùn’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere fún ohun tí Ọlọ́run fi oore-ọ̀fẹ́ fúnni, láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ tí kò sí nínú ẹsẹ náà kún un.
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: tí ó wà nínú rẹ
  rationale: Ó pa ìtumọ̀ pé ẹ̀bùn náà wà lára Tímótì mọ́ ní Yorùbá àdánidá.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: nípasẹ̀ gbígbé ọwọ́ mi lé ọ
  rationale: Ó fi διά pẹ̀lú ọ̀rọ̀-orúkọ ẹlẹ́ni-hùn hàn gẹ́gẹ́ bí ọ̀nà tàbí ohun èlò, ó sì sọ ìṣe gbígbé ọwọ́ lé ẹni ní kedere.
theological_decisions:
- issue: Bí ẹ̀bùn náà ṣe ní ìbáṣepọ̀ pẹ̀lú ìṣe Pọ́ọ̀lù
  choice: nípasẹ̀ gbígbé ọwọ́ mi lé ọ
  alternative: nígbà tí mo gbé ọwọ́ mi lé ọ
  rationale: ‘Nípasẹ̀’ pa ipa ọ̀nà tàbí ohun èlò tí διά pẹ̀lú genitive ní mọ́, láì sọ ọ́ di ẹ̀kọ́ sakírámẹ́ǹtì tó ti fẹ̀ sí i; yíyí i sí ‘nígbà tí’ lè dín ìtumọ̀ náà kù sí àkókò nìkan.
translation_notes:
  register: Yorùbá ìbílẹ̀ tó bójú mu, tó ní iyì, tí ó sì ṣeé lóye fún òǹkàwé òde òní. A lo àwòrán ‘jó fòfò’ láti pa àwòrán iná inú ọ̀rọ̀ Gíríìkì mọ́; àmì ohùn ni a lò níbi tí ó bá yẹ.
