id: 2TI.1.10
reference: 2 Timothy 1:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: yo
  text: ṣùgbọ́n tí a ti ṣí payá nísinsin yìí nípasẹ̀ ìfarahàn Olùgbàlà wa, Jésù Mèsáyà[a], ẹni tí ó sọ ikú di asán, tí ó sì mú ìyè àti àìdíbàjẹ́[b] wá sí ìmọ́lẹ̀ nípasẹ̀ ìhìn rere,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Jésù Kristi.” Ọ̀rọ̀ Gíríìkì Χριστός lè ṣiṣẹ́ gẹ́gẹ́ bí oyè (“Mèsáyà”) tàbí gẹ́gẹ́ bí ìdánimọ̀ tí ó dà bí ara orúkọ (“Kristi”).
    reason: alternative_reading
  - marker: b
    text: Tàbí, “àìkú.” Ọ̀rọ̀ Gíríìkì náà tẹnu mọ́ ipò àìlèbàjẹ́ tàbí òmìnira kúrò nínú ìdíbàjẹ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: tí a ti ṣí payá
  rationale: Ó pa ohùn àìṣe ti Gíríìkì mọ́, ó sì tọ́ka padà sí oore-ọ̀fẹ́ Ọlọ́run nínú ẹsẹ tó ṣáájú; ‘ṣí payá’ jẹ́ ọ̀nà Yorùbá àdánidá fún ohun tí a fi hàn ní gbangba.
- source_word: ἐπιφανείας
  choice: ìfarahàn
  rationale: Ó sọ ìfarahàn tí a lè rí tàbí dídé ní gbangba, ó sì yẹ fún ọ̀rọ̀ nípa dídé Jésù láìlo àkọsílẹ̀ ọ̀rọ̀ Gíríìkì.
- source_word: σωτῆρος
  choice: Olùgbàlà
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí a mọ̀ dáadáa fún ẹni tí ń gbani là, ó sì pa agbára oyè náà mọ́.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  rationale: Níbí, Χριστός ṣì ní agbára oyè ẹni àmì-òróró; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde, nígbà tí àkọ́lé ìsàlẹ̀ fi ‘Kristi’ hàn gẹ́gẹ́ bí yíyan mìíràn.
- source_word: καταργήσαντος
  choice: sọ ... di asán
  rationale: Gbólóhùn yìí fi ìṣẹ́gun tó lágbára hàn, ṣùgbọ́n kò fi dandan mú un túmọ̀ sí pé ikú ti ṣíwọ́ pátápátá ní àkókò yìí; ó bá ìtumọ̀ mímú ohun kan di aláìṣiṣẹ́ tàbí aláìlágbára mu.
- source_word: θάνατον
  choice: ikú
  rationale: Ìtumọ̀ tààrà, tó ṣe kedere, tí kò sì fi àlàyé míì kún ọ̀rọ̀ orísun.
- source_word: φωτίσαντος
  choice: mú ... wá sí ìmọ́lẹ̀
  rationale: Àpólà Yorùbá yìí sọ ṣíṣí ohun kan payá tàbí mímú un di mímọ̀, ó sì bá àwòrán ìmọ́lẹ̀ inú Gíríìkì mu.
- source_word: ζωὴν
  choice: ìyè
  rationale: Ọ̀rọ̀ Yorùbá tó bójú mu fún ‘ìyè,’ tó sì lè ru ìwúwo ìgbàlà àti ìrètí ọjọ́ iwájú láìfẹ̀ sí i.
- source_word: ἀφθαρσίαν
  choice: àìdíbàjẹ́
  rationale: Ó tẹnu mọ́ ipò tí kò lè bàjẹ́ tàbí díbàjẹ́; èyí sún mọ́ Gíríìkì ju ‘àìkú’ lọ, bó tilẹ̀ jẹ́ pé a fi ‘àìkú’ sínú àkọ́lé ìsàlẹ̀.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: nípasẹ̀ ìhìn rere
  rationale: ‘Nípasẹ̀’ pa ipa ọ̀nà tàbí ohun èlò ti διά mọ́, ‘ìhìn rere’ sì jẹ́ Yorùbá kedere, àdánidá fún εὐαγγέλιον.
- source_word: μὲν ... δὲ
  choice: '..., tí ó sì ...'
  rationale: Ìtẹ̀síwájú ‘tí ó ... tí ó sì ...’ so àwọn iṣẹ́ méjèèjì pọ̀ ní Yorùbá àdánidá, nígbà tó ń pa ìyàtọ̀ alákúnya láàárín bíborí ikú àti fífi ìyè hàn mọ́.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ Χριστοῦ nínú Ἰησοῦ Χριστοῦ
  choice: Jésù Mèsáyà
  alternative: Jésù Kristi
  rationale: Lẹ́yìn oyè ‘Olùgbàlà wa,’ agbára Χριστός gẹ́gẹ́ bí oyè ṣì hàn gbangba. A kò sọ pé ìtumọ̀ orúkọ-bí-oyè ‘Kristi’ kò ṣeé ṣe; a tọ́ka sí i nínú àkọ́lé ìsàlẹ̀.
- issue: Agbára καταργήσαντος lórí ikú
  choice: sọ ikú di asán
  alternative: fagilé ikú; mú agbára ikú kúrò
  rationale: Èyí kéde ìṣẹ́gun Mèsáyà lórí ikú ní ọ̀nà líle, ṣùgbọ́n kò yanjú bí ikú ṣe ṣì ń ṣẹlẹ̀ nísinsin yìí tàbí ìgbà tí yóò dópin pátápátá.
- issue: Ìtumọ̀ ἀφθαρσίαν
  choice: àìdíbàjẹ́
  alternative: àìkú
  rationale: ‘Àìdíbàjẹ́’ pa ìtẹnumọ́ orísun mọ́ lórí ohun tí kò lè bàjẹ́, nígbà tí ‘àìkú’ lè tẹnu mọ́ àìní òpin ìwàláàyè. A pa yíyan tó wọ́pọ̀ náà mọ́ nínú àkọ́lé ìsàlẹ̀.
translation_notes:
  register: Yorùbá àpapọ̀ òde òní ni a lò, pẹ̀lú àmì ohùn ní kíkún bí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, ṣókí, ó sì tẹ̀ lé ìṣàn gbólóhùn tó bẹ̀rẹ̀ nínú ẹsẹ tó ṣáájú; torí náà, a pa àmì kọ́mà òpin mọ́.
