id: 2TI.1.4
reference: 2 Timothy 1:4
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐπιποθῶν σε ἰδεῖν, μεμνημένος σου τῶν δακρύων, ἵνα χαρᾶς πληρωθῶ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/004.yaml
  text: longing to see you[a], remembering your tears, so that I may be filled with joy,
translation:
  language: yo
  text: mo ń yán hànhàn láti rí ọ, bí mo ti ń rántí omijé rẹ, kí ayọ̀ lè kún inú mi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιποθῶν
  choice: mo ń yán hànhàn
  rationale: Ọ̀rọ̀ yìí fi ìfẹ́-ọkàn líle hàn láti rí Tímótì; ‘yán hànhàn’ jẹ́ ọ̀nà Yorùbá àdánidá tó pa agbára ìmọ̀lára náà mọ́.
- source_word: σε ἰδεῖν
  choice: láti rí ọ
  rationale: Èyí tú ìṣe aláìlẹ́ni náà ní tààràtà, ó sì jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere.
- source_word: μεμνημένος
  choice: bí mo ti ń rántí
  rationale: Fọ́ọ̀mù perfect participle náà ń tọ́ka sí ìrántí tó dúró nínú ọkàn; gbólóhùn yìí bá ìṣàn Yorùbá mu, ó sì fi ìrántí tó ń bá a lọ hàn.
- source_word: σου τῶν δακρύων
  choice: omijé rẹ
  rationale: Ìtumọ̀ tààrà ni pé omijé Tímótì; ‘omijé rẹ’ kò fi àlàyé tí kò sí nínú orísun kún un.
- source_word: ἵνα
  choice: kí
  rationale: ‘Kí’ jẹ́ àmì ète tàbí àbájáde tó bá Yorùbá mu, ó sì pa ìbáṣepọ̀ àwọn gbólóhùn mọ́.
- source_word: χαρᾶς
  choice: ayọ̀
  rationale: Nínú àkójọpọ̀ pẹ̀lú πληρωθῶ, ‘ayọ̀’ ni ohun tó kún inú ẹni.
- source_word: πληρωθῶ
  choice: lè kún inú mi
  rationale: Aorist passive subjunctive lẹ́yìn ἵνα ni; ‘kí ayọ̀ lè kún inú mi’ jẹ́ Yorùbá àdánidá tó pa ìtumọ̀ pé kí ayọ̀ mú un kún mọ́.
theological_decisions: []
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ àdánidá, ọlọ́lá, ó sì bá ìṣàn gbólóhùn tó bẹ̀rẹ̀ ní ẹsẹ ṣáájú mu. A kò fi àlàyé ẹ̀kọ́ ìsìn kún ọ̀rọ̀ orísun.
