id: 2TI.1.7
reference: 2 Timothy 1:7
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: yo
  text: Nítorí Ọlọ́run kò fún wa ní ẹ̀mí àìnígboyà[a], bí kò ṣe ẹ̀mí agbára, ìfẹ́, àti ìkóra-ẹni-níjàánu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “ìbẹ̀rù” tàbí “ìtìjú”; ọ̀rọ̀ Gíríìkì náà ń tọ́ka sí ìbẹ̀rù ìfàsẹ́yìn tàbí àìnígboyà, kì í ṣe ìbẹ̀rù lásán.
    reason: lexical_alternative
  - marker: b
    text: Tàbí “ìrònú tó péye” tàbí “ìbáwí ara ẹni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Nítorí ... kò
  rationale: “Nítorí” mú iṣẹ́ àlàyé γάρ wá síwájú, “kò” sì tako gbólóhùn náà ní kedere.
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: Ọlọ́run kò fún wa ní
  rationale: Ètò yìí jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìṣe àkókò tí ó kọjá tí a sẹ́; “fún wa ní” fi dative ἡμῖν hàn dáadáa.
- source_word: πνεῦμα
  choice: ẹ̀mí
  rationale: “Ẹ̀mí” pa ààyè ìtumọ̀ mọ́ fún ìwà inú tàbí agbára tí Ọlọ́run ń fúnni, láìfi dandan sọ pé àkọlé tààrà fún Ẹ̀mí Mímọ́ ni.
- source_word: δειλίας
  choice: ìbẹ̀rù-ọ̀lẹ̀
  rationale: Àpapọ̀ ọ̀rọ̀ yìí fi ìbẹ̀rù tí ń yọrí sí ojo tàbí àìnígboyà hàn, kì í ṣe ìbẹ̀rù lásán.
- source_word: ἀλλὰ
  choice: bí kò ṣe
  rationale: Ó fi ìyàtọ̀ líle láàárín ohun tí Ọlọ́run kò fúnni àti ohun tí ó fúnni hàn ní Yorùbá àdánidá.
- source_word: δυνάμεως
  choice: agbára
  rationale: “Agbára” ni ìtumọ̀ tààrà, ó sì bá àkójọpọ̀ àwọn ànímọ́ inú ẹsẹ̀ náà mu.
- source_word: ἀγάπης
  choice: ìfẹ́
  rationale: “Ìfẹ́” ni ọ̀rọ̀ Yorùbá àdánidá fún ἀγάπη nínú àyíká yìí.
- source_word: σωφρονισμοῦ
  choice: ìkóra-ẹni-níjàánu
  rationale: Ó sọ ìṣàkóso ara ẹni ní èdè òde òní tí ó yé ni, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ ìrònú tó péye àti ìbáwí ara ẹni mọ́.
theological_decisions:
- issue: Ohun tí πνεῦμα ń tọ́ka sí
  choice: “ẹ̀mí” gẹ́gẹ́ bí irú ìwà inú tàbí agbára tí Ọlọ́run ń fúnni, láìsọ ọ́ di àkọlé pàtó
  alternative: “Ẹ̀mí” gẹ́gẹ́ bí Ẹ̀mí Mímọ́
  rationale: Àìsí article pẹ̀lú πνεῦμα àti àwọn genitive tó ṣàpèjúwe rẹ̀—ìbẹ̀rù-ọ̀lẹ̀ ní ìhà kan, agbára, ìfẹ́ àti ìkóra-ẹni-níjàánu ní ìhà kejì—fẹ́ kí a má ṣe pinnu ju ohun tí gírámà sọ lọ. Bí ó tilẹ̀ jẹ́ pé Ẹ̀mí Mímọ́ lè wà nínú ojú ìwòye, ìtumọ̀ náà kò fi èyí ṣe dandan.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àfẹnusọ òde òní tó ní iyì, pẹ̀lú àmì ohùn níbi tó yẹ. “Ìbẹ̀rù-ọ̀lẹ̀” ni a lò láti yẹra fún fífi δειλία ṣe “ìbẹ̀rù” lásán; “ìkóra-ẹni-níjàánu” sì jẹ́ kedere fún òǹkàwé gbogbo, nígbà tí àlàyé ìsàlẹ̀ ń tọ́ka sí ìtẹ̀sí ọpọlọ tó wà nínú σωφρονισμός.
