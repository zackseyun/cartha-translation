id: 2TI.1.13
reference: 2 Timothy 1:13
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: yo
  text: Máa di àwòṣe àwọn ọ̀rọ̀ tí ó ní ìlera tí o gbọ́ láti ọ̀dọ̀ mi mú, nínú ìgbàgbọ́[a] àti ìfẹ́ tí ó wà nínú Mèsáyà Jésù[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “nínú ìṣòtítọ́ àti ìfẹ́.” Ọ̀rọ̀ Gíríìkì fún “ìgbàgbọ́” tún lè ní ìtumọ̀ “ìṣòtítọ́” tàbí “ìgbẹ́kẹ̀lé.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “àwọn ọ̀rọ̀ tí ó ní ìlera tí o gbọ́ láti ọ̀dọ̀ mi nípa ìgbàgbọ́ àti ìfẹ́ nínú Mèsáyà Jésù.” Ìṣètò ọ̀rọ̀ Gíríìkì lè ṣàpèjúwe yálà bí Tímótì ṣe ń di àwòṣe náà mú tàbí ohun tí àwọn ọ̀rọ̀ náà sọ nípa rẹ̀.
    reason: alternative_reading
  - marker: c
    text: 'Ìtumọ̀ ìbílẹ̀: “Kristi Jésù.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: àwòṣe
  rationale: “Àwòṣe” ń sọ èrò ohun tí a fi ṣe àpẹẹrẹ tàbí ìlànà tí a lè tẹ̀ lé, ó sì bá ìtumọ̀ ὑποτύπωσις mu láì sọ ọ́ di òfin tàbí ìlànà kíkún ju ohun tí Gíríìkì sọ lọ.
- source_word: ἔχε
  choice: Máa di … mú
  rationale: Ọ̀rọ̀ àṣẹ yìí ní agbára pé kí Tímótì máa pa àwòṣe náà mọ́, kí ó sì rọ̀ mọ́ ọn; “máa di … mú” jẹ́ ọ̀nà Yorùbá àdánidá láti fi èyí hàn.
- source_word: ὑγιαινόντων λόγων
  choice: àwọn ọ̀rọ̀ tí ó péye
  rationale: ὑγιαίνω túmọ̀ sí jíjẹ́ aláìláàárẹ̀ tàbí pípéye ní ìtumọ̀ àpèjúwe, ní pàtàkì nípa ẹ̀kọ́. “Àwọn ọ̀rọ̀ tí ó péye” pa “ọ̀rọ̀” (λόγοι) mọ́, kò sì túmọ̀ rẹ̀ ní tààrà sí “ẹ̀kọ́.”
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: tí o gbọ́ láti ọ̀dọ̀ mi
  rationale: παρά pẹ̀lú ẹ̀yà genitive ń tọ́ka sí orísun níbí; “láti ọ̀dọ̀ mi” jẹ́ ọ̀nà Yorùbá tí ó ṣe kedere àti ti ẹ̀dá.
- source_word: ἐν πίστει
  choice: nínú ìgbàgbọ́
  rationale: “Ìgbàgbọ́” pa ìtumọ̀ àkọ́kọ́ πίστις mọ́. Ó ṣeé ṣe kí ọ̀rọ̀ náà tún túmọ̀ sí “ìṣòtítọ́” tàbí “ìgbẹ́kẹ̀lé,” nítorí náà a fi ìtumọ̀ mìíràn sí àlàyé ìsàlẹ̀.
- source_word: καὶ ἀγάπῃ
  choice: àti ìfẹ́
  rationale: “Ìfẹ́” ni ìtumọ̀ Yorùbá tí ó ṣe déédéé fún ἀγάπη.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: tí ó wà nínú Mèsáyà Jésù
  rationale: Gbólóhùn náà ṣàpèjúwe ìgbàgbọ́ àti ìfẹ́ papọ̀. Yorùbá lè lo ọ̀rọ̀ arọ́pò-orúkọ “tí ó” fún àkójọpọ̀ èrò méjèèjì ní ọ̀nà àdánidá.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí; “Mèsáyà” mú ìtumọ̀ ẹni àmì òróró náà jáde ju kí a lò ó gẹ́gẹ́ bí orúkọ lásán.
theological_decisions:
- issue: Ìbáṣepọ̀ ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ pẹ̀lú apá tó ṣáájú
  choice: 'A mú un gẹ́gẹ́ bí ọ̀nà tàbí àyíká tí Tímótì yóò fi di àwòṣe náà mú: nínú ìgbàgbọ́ àti ìfẹ́ tí ó wà nínú Mèsáyà Jésù.'
  alternative: Ó lè ṣàpèjúwe ohun tí àwọn ọ̀rọ̀ pípéye náà dá lé, ìyẹn àwọn ọ̀rọ̀ nípa ìgbàgbọ́ àti ìfẹ́ nínú Mèsáyà Jésù.
  rationale: Ìṣàn ìkìlọ̀ àti àṣẹ inú ẹsẹ náà ṣe àtìlẹ́yìn fún kí gbólóhùn náà ṣàpèjúwe bí Tímótì ṣe yẹ kí ó di àwòṣe náà mú, ṣùgbọ́n èdè Gíríìkì kò mú ìtumọ̀ kejì kúrò; a pa àìdánilójú náà mọ́ nínú àlàyé ìsàlẹ̀.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Nítorí pé ọ̀rọ̀ náà ní agbára oyè níbí, “Mèsáyà” fi ìtumọ̀ rẹ̀ hàn gbangba. A pa ìtumọ̀ ìbílẹ̀ “Kristi” mọ́ nínú àlàyé ìsàlẹ̀.
translation_notes:
  register: A lo Yorùbá àpapọ̀ tí ó ní àmì ohùn ní kíkún, pẹ̀lú ọ̀nà ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye. “Máa di … mú” jẹ́ àṣẹ tí ó ń tọ́ka sí ìṣe títẹ̀síwájú, “àwòṣe” sì yẹra fún mímú ὑποτύπωσις di òfin líle. Àwọn àmì àlàyé [a], [b], àti [c] wà nínú ọ̀rọ̀ pàtàkì.
