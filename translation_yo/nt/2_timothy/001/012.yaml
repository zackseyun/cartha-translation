revisions:
- from: Nítorí ìdí yìí ni èmi náà ṣe ń jìyà àwọn nǹkan wọ̀nyí, ṣùgbọ́n ojú kò tì mí, nítorí mo mọ ẹni tí mo ti gbà gbọ́,[a] ó sì dá mi lójú pé ó lágbára láti ṣọ́ ohun àfipamọ́ mi[b] títí di ọjọ́ náà.[c]
  to: Nítorí ìdí yìí ni mo fi ń jìyà àwọn nǹkan wọ̀nyí náà, ṣùgbọ́n ojú kò tì mí, nítorí mo mọ ẹni tí mo ti gbẹ́kẹ̀ lé,[a] ó sì dá mi lójú pé ó lágbára láti ṣọ́ ohun àfipamọ́ mi[b] títí di ọjọ́ náà.[c]
  rationale: Àtúnṣe náà ń mú ọ̀rọ̀ náà rọrùn sí i nínú Yorùbá, ó sì yọ ìtẹnumọ́ tí kò sí nínú ọ̀rọ̀ Gíríìkì kúrò. “Gbọ́kẹ̀ lé” ń ba πιστεύω pẹ̀lú ẹni mu dáadáa, nígbà tí “ohun àfipamọ́ mi” àti àlàyé rẹ̀ ṣì pa àìdánilójú παραθήκη μου mọ́. A kò dárúkọ ẹni tí “ó” ń tọ́ka sí, nítorí Gíríìkì kò dárúkọ rẹ̀ nínú gbólóhùn náà.
