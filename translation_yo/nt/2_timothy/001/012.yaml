id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: yo
  text: Nítorí ìdí yìí ni mo fi ń jìyà àwọn nǹkan wọ̀nyí náà, ṣùgbọ́n ojú kò tì mí, nítorí mo mọ ẹni tí mo ti gbẹ́kẹ̀ lé,[a] ó sì dá mi lójú pé ó lágbára láti ṣọ́ ohun àfipamọ́ mi[b] títí di ọjọ́ náà.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ ọ́ sí “ẹni tí mo ti ní ìgbàgbọ́ nínú rẹ̀,” tàbí “ẹni tí mo ti gbà gbọ́.”
    reason: lexical_alternative
  - marker: b
    text: “Ohun àfipamọ́ mi” túmọ̀ ọ̀rọ̀ kan fún ohun tí a fi lé ẹlòmíràn lọ́wọ́ fún àbójútó kí a lè pa á mọ́ láìléwu. Ó lè tọ́ka sí ohun tí Pọ́ọ̀lù fi lé Ọlọ́run lọ́wọ́, tàbí ohun tí a fi lé Pọ́ọ̀lù lọ́wọ́.
    reason: alternative_reading
  - marker: c
    text: Ìyẹn ni ọjọ́ ìdájọ́ ìkẹyìn àti ìdáláre Ọlọ́run ní ọjọ́ iwájú.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Nítorí ìdí yìí
  rationale: Ó pa ìsopọ̀ ohun tó fa ọ̀rọ̀ mọ́, ó sì jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá òde òní.
- source_word: ταῦτα πάσχω
  choice: èmi náà ṣe ń jìyà àwọn nǹkan wọ̀nyí
  rationale: “Ń jìyà” fi ìṣe tí ó ń bá a lọ hàn, “àwọn nǹkan wọ̀nyí” sì pa ọ̀rọ̀ arọ́pò-atọ́ka Gíríìkì mọ́ láì sọ irú ìjìyà náà pàtó.
- source_word: οὐκ ἐπαισχύνομαι
  choice: ojú kò tì mí
  rationale: Èyí ni ọ̀nà Yorùbá tó ṣe déédéé àti tó ṣe kedere fún jíjẹ́ ẹni tí ìtìjú kò bá.
- source_word: οἶδα
  choice: mo mọ
  rationale: 'Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ Gíríìkì náà ní ìrísí perfect, agbára rẹ̀ níbí jẹ́ ti ipò ìsinsìnyí: “mo mọ.”'
- source_word: ᾧ πεπίστευκα
  choice: ẹni tí mo ti gbà gbọ́
  rationale: Ó pa ẹni gẹ́gẹ́ bí ohun tí ìgbàgbọ́ dojú kọ mọ́, “ti” sì ṣàfihàn ìgbàgbọ́ tí ó ti fìdí múlẹ̀. Àlàyé ìsàlẹ̀ ojú ewé fi “gbẹ́kẹ̀ lé” hàn gẹ́gẹ́ bí ìtumọ̀ mìíràn.
- source_word: πέπεισμαι
  choice: ó dá mi lójú
  rationale: Ọ̀rọ̀ Yorùbá yìí fi ìdánilójú tí ó ti fìdí múlẹ̀ hàn lọ́nà àdánidá.
- source_word: δυνατός ἐστιν
  choice: ó lágbára
  rationale: Ó sọ agbára tàbí okun láti ṣe ohun náà jáde láì fi àlàyé ẹ̀kọ́ ìgbàgbọ́ kún un.
- source_word: τὴν παραθήκην μου
  choice: ohun àfipamọ́ mi
  rationale: “Àfipamọ́” tọ́ka sí ohun tí a fi sí ìtọ́jú fún ààbò; ìsopọ̀ “mi” kò pinnu bóyá Pọ́ọ̀lù ni ó fi í lé ẹlòmíràn lọ́wọ́ tàbí a fi í lé Pọ́ọ̀lù lọ́wọ́.
- source_word: φυλάξαι
  choice: láti ṣọ́
  rationale: “Ṣọ́” bá àwòrán ohun tí a fi sí ìtọ́jú mu, ó sì ní ìtumọ̀ pípa ohun mọ́ láìléwu.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: títí di ọjọ́ náà
  rationale: Ó fi ìtọ́ka sí ọjọ́ ọjọ́ iwájú hàn ní Yorùbá tó ṣe déédéé, láì fi orúkọ ọjọ́ náà kún ọ̀rọ̀ Gíríìkì.
theological_decisions:
- issue: Ẹni tí ᾧ (“ẹni tí”) ń tọ́ka sí àti ẹni tí ó jẹ́ olùṣe nínú “ó lágbára”
  choice: A kò dárúkọ ẹni náà ní pàtó; “ẹni” àti “ó” nìkan ni a lò.
  alternative: Kí a sọ ní gbangba pé Ọlọ́run tàbí Kristi Jésù ni.
  rationale: Gíríìkì kò dárúkọ ẹni náà nínú gbólóhùn yìí. Àyíká ọ̀rọ̀ tọ́ka sí Ọlọ́run/Kristi, ṣùgbọ́n ìtumọ̀ náà pa ìwọ̀n pàtó tí ẹsẹ náà fúnra rẹ̀ lò mọ́.
- issue: Ìtumọ̀ παραθήκη μου (“ohun àfipamọ́ mi”)
  choice: A pa àwòrán ohun àfipamọ́ àti àìdánilójú ipa ọ̀rọ̀ “mi” mọ́.
  alternative: Ohun tí Pọ́ọ̀lù fi lé Ọlọ́run lọ́wọ́, tàbí ìhìn rere iṣẹ́ ìránṣẹ́ tí a fi lé Pọ́ọ̀lù lọ́wọ́.
  rationale: Gbólóhùn Gíríìkì lè tọ́ka sí ohun tí Pọ́ọ̀lù fi sí ìkáwọ́ Ọlọ́run tàbí ohun tí a fi sí ìkáwọ́ Pọ́ọ̀lù. A kò yan ọ̀kan nínú wọn nínú àyọkà pàtàkì.
translation_notes:
  register: Yorùbá boṣewa ni a lò pẹ̀lú àmì ohùn níbi tí ó ti yẹ. Ìforúkọsílẹ̀ náà jẹ́ ti ọ̀rọ̀ ọlọ́lá, kedere, àti àdánidá fún òǹkàwé òde òní. “Ojú kò tì mí” jẹ́ ọ̀nà Yorùbá àdánidá, nígbà tí “ohun àfipamọ́ mi” mọ̀ọ́mọ̀ pa àìdánilójú inú Gíríìkì mọ́.
