  source_fidelity: 'Ìtumọ̀ náà tẹ̀lé Gíríìkì náà dáadáa: Pọ́ọ̀lù ni a fi hàn gẹ́gẹ́ bí àpọ́sítélì Mèsáyà Jésù, nípa ìfẹ́ Ọlọ́run, ní ìbámu pẹ̀lú ìlérí ìyè tí ó wà nínú Mèsáyà Jésù. Ìbátan ‘nínú’ fún ἐν àti ìtumọ̀ κατά gẹ́gẹ́ bí ìbámu ni a pa mọ́.'
