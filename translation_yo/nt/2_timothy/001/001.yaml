id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: yo
  text: Pọ́ọ̀lù, àpọ́sítélì Mèsáyà Jésù[a] nípa ìfẹ́ Ọlọ́run, ní ìbámu pẹ̀lú ìlérí ìyè tí ó wà nínú Mèsáyà Jésù,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Kristi Jésù,” ní ibi méjèèjì tí “Mèsáyà Jésù” ti fara hàn.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Pọ́ọ̀lù
  rationale: Ìkọ̀wé orúkọ náà ní ọ̀nà tí Yorùbá máa ń lò, pẹ̀lú àmì ohùn tó yẹ.
- source_word: ἀπόστολος
  choice: àpọ́sítélì
  rationale: Ọ̀rọ̀ ìjọsìn tí ó ti fìdí múlẹ̀ ni, ó sì pa ìtumọ̀ ipò pàtàkì Pọ́ọ̀lù mọ́ ju ‘ońṣẹ́’ lásán lọ.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Mèsáyà Jésù
  rationale: Χριστός ní agbára oyè níbí; ‘Mèsáyà’ túmọ̀ oyè náà dípò kí a kàn ṣe àfàyọ orúkọ rẹ̀.
- source_word: διὰ θελήματος θεοῦ
  choice: nípa ìfẹ́ Ọlọ́run
  rationale: Ó fi hàn pé ìfẹ́ Ọlọ́run ni ìpìlẹ̀ àti àṣẹ fún jíjẹ́ àpọ́sítélì Pọ́ọ̀lù.
- source_word: κατ’ ἐπαγγελίαν
  choice: ní ìbámu pẹ̀lú ìlérí
  rationale: Ó pa ìtumọ̀ ìbámu tàbí ìrẹ́pọ̀ κατά pẹ̀lú ohun tí Ọlọ́run ṣèlérí mọ́.
- source_word: ζωῆς
  choice: ìyè
  rationale: ‘Ìyè’ ni ọ̀rọ̀ Yorùbá tó ṣe déédéé fún ζωή nínú àyíká ọ̀rọ̀ yìí.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: tí ó wà nínú Mèsáyà Jésù
  rationale: Gbólóhùn náà ṣàlàyé ìyè tí ìlérí náà dá lé, ó sì pa agbára ìbáṣepọ̀ ἐν mọ́.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Ní ibi yìí, Χριστός ṣì ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ẹni tí Ọlọ́run yàn; ‘Mèsáyà’ mú ìtumọ̀ oyè náà jáde, nígbà tí ‘Kristi’ jẹ́ àfàyọ ọ̀rọ̀ náà tí ó wọ́pọ̀.
translation_notes:
  register: A lo Yorùbá àṣà, tó bójú mu, tó sì ṣe kedere fún òǹkàwé òde òní. A fi àmì ohùn sí àwọn ọ̀rọ̀ níbi tí ó yẹ, a sì pa ìtòlẹ́sẹẹsẹ gẹ́gẹ́ bí ìbẹ̀rẹ̀ lẹ́tà mọ́ pẹ̀lú àmì kọ́má ní òpin.
