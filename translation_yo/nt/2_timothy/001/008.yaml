    text: Tàbí, “ẹ̀rí Olúwa wa.” Genitive Gíríìkì lè túmọ̀ sí ẹ̀rí tí Olúwa fún, ṣùgbọ́n ó ṣeé ṣe jù pé níbí ó túmọ̀ sí ẹ̀rí nípa Olúwa.
    reason: alternative_reading
