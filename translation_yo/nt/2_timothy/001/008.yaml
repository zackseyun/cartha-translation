id: 2TI.1.8
reference: 2 Timothy 1:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: yo
  text: Nítorí náà, má ṣe tijú ẹ̀rí nípa Olúwa wa[a]; bẹ́ẹ̀ ni má ṣe tijú mi, ẹlẹ́wọ̀n rẹ̀. Ṣùgbọ́n jìyà pọ̀ nítorí ìhìn rere[b], ní ìbámu pẹ̀lú agbára Ọlọ́run[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹ̀rí Olúwa wa.” Genitive Gíríìkì lè túmọ̀ sí ẹ̀rí tí Olúwa fún, ṣùgbọ́n ó ṣeé ṣe jù pé níbí ó túmọ̀ sí ẹ̀rí nípa Olúwa.
    reason: alternative_reading
  - marker: b
    text: Tàbí, “pín nínú ìjìyà fún ìhìn rere.” Ọ̀rọ̀ ìṣe Gíríìkì náà ní èrò jíjẹ́ alábàápín pẹ̀lú àwọn ẹlòmíràn nínú ìjìyà.
    reason: lexical_alternative
  - marker: c
    text: Tàbí, “nípasẹ̀ agbára Ọlọ́run.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: Nítorí náà, má ṣe
  rationale: “Nítorí náà” fi ìtumọ̀ ìyọrísí οὖν hàn, “má ṣe” sì jẹ́ ọ̀nà Yorùbá àdánidá fún ìkìlọ̀ òdì.
- source_word: ἐπαισχυνθῇς
  choice: tijú
  rationale: “Tijú” túmọ̀ sí níní ìtìjú tàbí yíyẹ̀ra nítorí ìtìjú, ó sì bá agbára ọ̀rọ̀ Gíríìkì mu.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: ẹ̀rí nípa Olúwa wa
  rationale: “Ẹ̀rí” pa ìrísí orúkọ μαρτύριον mọ́; “nípa” mú kíkà genitive gẹ́gẹ́ bí ohun tí ẹ̀rí náà dá lé lórí hàn, láìfi kíkà kejì pamọ́ sínú àlàyé ìsàlẹ̀.
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: tàbí èmi, ẹlẹ́wọ̀n rẹ̀
  rationale: Èyí so ẹni kejì tí Timotiu kò gbọ́dọ̀ tijú mọ́ ti àkọ́kọ́, ó sì pa ìbáṣepọ̀ αὐτοῦ mọ́ pẹ̀lú “rẹ̀.”
- source_word: συγκακοπάθησον
  choice: bá wa jìyà
  rationale: Ìṣe àṣẹ yìí ní èrò ṣíṣe alábàápín nínú ìyà; “bá wa jìyà” jẹ́ Yorùbá àdánidá, nígbà tí “wa” ṣàfihàn ẹgbẹ́ tí a lóye nínú àyíká ọ̀rọ̀ láìdá ẹni kan pàtó.
- source_word: τῷ εὐαγγελίῳ
  choice: nítorí ìhìn rere
  rationale: Dative náà rọ̀ mọ́ ìṣe Gíríìkì; “nítorí ìhìn rere” sọ ìtumọ̀ ìjìyà tó ní í ṣe pẹ̀lú ìhìn rere ní Yorùbá àdánidá. Àlàyé ìsàlẹ̀ pa àṣàyàn “bá ìhìn rere jìyà” mọ́.
- source_word: κατὰ δύναμιν θεοῦ
  choice: ní ìbámu pẹ̀lú agbára Ọlọ́run
  rationale: Èyí pa ìtumọ̀ κατά gẹ́gẹ́ bí ìwọ̀n tàbí ìbámu mọ́, láìdín un kù sí irinṣẹ́ nìkan.
theological_decisions:
- issue: Ìbáṣepọ̀ “ẹ̀rí” pẹ̀lú “Olúwa wa”
  choice: ẹ̀rí nípa Olúwa wa
  alternative: ẹ̀rí Olúwa wa
  rationale: Àyíká ọ̀rọ̀ ṣe àtìlẹ́yìn fún ẹ̀rí tí ó dá lórí Olúwa, ṣùgbọ́n genitive Gíríìkì tún lè túmọ̀ sí ẹ̀rí tí Olúwa fún; àlàyé [a] pa àìdánilójú náà mọ́.
- issue: Ìtumọ̀ “ẹlẹ́wọ̀n rẹ̀”
  choice: 'pa ọ̀rọ̀ ìní mọ́: “ẹlẹ́wọ̀n rẹ̀”'
  alternative: ẹlẹ́wọ̀n nítorí rẹ̀
  rationale: αὐτοῦ lè tọ́ka sí jíjẹ́ ti Olúwa tàbí ìbáṣepọ̀ pẹ̀lú rẹ̀. Ìtumọ̀ tí a yàn kò fi kún un pé “nítorí rẹ̀” nìkan.
- issue: Ìbáṣepọ̀ ìjìyà pẹ̀lú ìhìn rere
  choice: bá wa jìyà nítorí ìhìn rere
  alternative: bá ìhìn rere jìyà
  rationale: Èyí mú èrò συν- ti jíjẹ́ alábàápín nínú ìjìyà àti ìdí tí ìjìyà fi dé papọ̀ ní Yorùbá tó ṣe kedere; àlàyé [b] jẹ́ kí ìkọ̀wé tó sún mọ́ Gíríìkì wà ní gbangba.
- issue: Agbára Ọlọ́run gẹ́gẹ́ bí ìbámu tàbí ohun èlò
  choice: ní ìbámu pẹ̀lú agbára Ọlọ́run
  alternative: nípasẹ̀ agbára Ọlọ́run
  rationale: κατά pẹ̀lú accusative lè fi ìwọ̀n, ìlànà, tàbí ìpèsè agbára hàn. Ìtumọ̀ pàtàkì pa ìfẹ̀ rẹ̀ sí “ìbámu” mọ́; àlàyé [c] fúnni ní kíkà irinṣẹ́.
translation_notes:
  register: Yorùbá ìpele ọ̀wọ̀, tó bá àsọyé Ìwé Mímọ́ mu ṣùgbọ́n tó ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó yẹ. “Ìhìn rere” jẹ́ ọ̀rọ̀ àdánidá fún εὐαγγέλιον; “ẹlẹ́wọ̀n” sì pa àwòrán ìdè mọ́.
