id: 2TI.2.5
reference: 2 Timothy 2:5
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: yo
  text: Bí ẹnì kan bá sì ń díje bí eléré ìdárayá, a kì í fún un ní adé bí kò bá díje ní ìbámu pẹ̀lú àwọn òfin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “lọ́nà tó bófin mu.” Nínú àyíká yìí, ó ṣeé ṣe kí ọ̀rọ̀ Gíríìkì náà túmọ̀ sí díje ní ìbámu pẹ̀lú àwọn òfin ìdíje.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: ń díje bí eléré ìdárayá / bá díje
  rationale: Ọ̀rọ̀ Gíríìkì náà tọ́ka sí díje eré ìdárayá, kì í ṣe sí ìsapá lásán. Àtúnsọ ọ̀rọ̀ náà pa àwòrán ìdíje mọ́.
- source_word: τις
  choice: ẹnì kan
  rationale: Ó jẹ́ arọ́pò-orúkọ àìdáni kan pàtó, tí ó sì kan ẹnikẹ́ni lápapọ̀.
- source_word: στεφανοῦται
  choice: a kì í dé adé fún un
  rationale: Ìṣe aláìṣe-taara náà sọ nípa fífi adé ìṣẹ́gun dé ẹni tó ṣẹ́gun; yíyan yìí pa àwòrán adé mọ́ láìfi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ míì kún un.
- source_word: νομίμως
  choice: ní ìbámu pẹ̀lú àwọn òfin
  rationale: Nínú àyíká ìdíje eré, ó túmọ̀ sí díje lọ́nà tí àwọn òfin ìdíje gbà.
- source_word: καὶ
  choice: sì
  rationale: Ó so àpẹẹrẹ yìí pọ̀ mọ́ àwọn àpẹẹrẹ tó yí i ká, ó sì fi hàn pé àpẹẹrẹ mìíràn ni.
- source_word: δὲ
  choice: sì
  rationale: Ó ṣe àmì ìyípadà kékeré sí àpẹẹrẹ tó tẹ̀ lé; ‘sì’ jẹ́ ọ̀nà àdánidá láti fi ìsopọ̀ náà hàn ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ àwòrán adé
  choice: Pa àwòrán eléré tí a dé adé fún mọ́, láìsọ irú ẹ̀bùn tẹ̀mí tí adé náà dúró fún.
  alternative: Ṣàlàyé adé náà ní pàtó gẹ́gẹ́ bí ẹ̀bùn ọjọ́ ìkẹyìn tàbí ìtẹ́wọ́gbà nínú iṣẹ́ ìránṣẹ́.
  rationale: Ẹsẹ̀ náà lo àfiwé ìdíje láti tẹnumọ́ pé a gbọ́dọ̀ tẹ̀ lé ìlànà tó yẹ. Ọ̀rọ̀ Gíríìkì kò sọ ní pàtó ohun tí adé náà dúró fún.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tó yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣe kedere fún òǹkàwé nav.
