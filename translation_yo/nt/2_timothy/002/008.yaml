id: 2TI.2.8
reference: 2 Timothy 2:8
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: yo
  text: Máa rántí Jésù Mèsáyà[a], ẹni tí a ti jí dìde láti inú àwọn òkú, tí ó sì jẹ́ àtọmọdọ́mọ Dáfídì[b], gẹ́gẹ́ bí ìhìnrere mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tàbí: “Jésù Kristi.” Ọ̀rọ̀ oyè Gíríìkì Χριστός lè jẹ́ “Kristi” tàbí “Mèsáyà”; a lo “Mèsáyà” níbí láti fi ìtumọ̀ oyè náà hàn, pàápàá nítorí àjọṣe rẹ̀ pẹ̀lú jíjẹ́ àtọmọdọ́mọ Dáfídì.'
    reason: alternative_reading
  - marker: b
    text: 'Ní tààrà: “láti inú irú-ọmọ Dáfídì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: Máa rántí
  rationale: Ọ̀rọ̀ àṣẹ ìsinsìnyí ń tọ́ka sí ìṣírí tí ó ń bá a lọ; “Máa rántí” jẹ́ Yorùbá àdánidá tí ó pa agbára àṣẹ àti ìtẹ̀síwájú mọ́.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésù Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè ní àyíká yìí, pàápàá pẹ̀lú ìtọ́kasí sí ìran Dáfídì; “Mèsáyà” fi ìtumọ̀ oyè náà hàn ní kedere.
- source_word: ἐγηγερμένον
  choice: ẹni tí a ti jí dìde
  rationale: Perfect passive participle náà fi hàn pé a jí Jésù dìde, ó sì wà láàyè; “a ti jí dìde” pa ohùn àgbàṣe àti abajade tó dúró mọ́.
- source_word: ἐκ νεκρῶν
  choice: kúrò nínú òkú
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún jíjí dìde láti inú àwọn òkú, láìfi àlàyé tí kò sí nínú orísun kún un.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: àtọmọdọ́mọ Dáfídì
  rationale: Ní àyíká ìran, σπέρμα túmọ̀ sí irú-ọmọ tàbí àtọmọdọ́mọ; yíyan yìí jẹ́ ti òde òní, ó sì dá ìbátan ìran Dáfídì mọ́.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: gẹ́gẹ́ bí ìhìnrere mi
  rationale: “Gẹ́gẹ́ bí” ṣe àfihàn κατά ní ìtumọ̀ “ní ìbámu pẹ̀lú,” nígbà tí “ìhìnrere mi” pa ọ̀rọ̀ ìní Παῦλου mọ́ láìsọ pé ìhìnrere ọ̀tọ̀ ni.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστός
  choice: Mèsáyà
  alternative: Kristi
  rationale: Àyíká jíjí dìde àti ìran Dáfídì mú iṣẹ́ Χριστός gẹ́gẹ́ bí oyè Mèsáyà ṣe kedere; àkọ́lé àlàyé tọ́ka sí “Kristi” gẹ́gẹ́ bí ìtumọ̀ mìíràn tí ó wọ́pọ̀.
- issue: Agbára perfect passive participle ἐγηγερμένον
  choice: ẹni tí a ti jí dìde
  alternative: ẹni tí ó jí dìde
  rationale: Passive náà yẹ kí ó hàn pé a ṣe ìṣe jíjí dìde sí Jésù; yíyan mìíràn lè mú un dà bí ìṣe tí ó ṣe fúnra rẹ̀, èyí tí kò pa fọ́ọ̀mù Gíríìkì mọ́ déédé.
- issue: Ìtumọ̀ “ìhìnrere mi”
  choice: ìhìnrere mi
  alternative: ìhìnrere tí mo ń kéde
  rationale: A pa possessive μου mọ́ ní tààrà, láìfi ẹ̀kọ́ pé ìhìnrere Páùlù yàtọ̀ sí ìhìnrere àwọn aposteli mìíràn sínú ọ̀rọ̀ náà.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọ̀wọ̀ àti ti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. “Máa rántí” mú ìtẹ̀síwájú àṣẹ Gíríìkì jáde; àwọn gbólóhùn aláfarawé ṣe ẹsẹ náà ní kedere fún òǹkàwé Yorùbá láìtú ìṣòro ẹ̀kọ́ ìgbàgbọ́ rẹ̀ sí ọ̀nà kan ṣoṣo.
