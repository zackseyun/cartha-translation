  naturalness: Yorùbá náà jẹ́ boṣewa, ó sì rọrùn láti ka ní ìforúkọsílẹ̀ tó bójú mu fún Ìwé Mímọ́. “Ń fara dà,” “bá a jọba,” àti “sẹ́ ẹ” jẹ́ ìṣètò gbolohun tó dára. Àmì ohùn àti àmì ìdánilójú ní a lò ní ọ̀nà tó pé.
  terminology: “Jọba” yẹ fún àwòrán βασιλεύω, ó sì dára ju ọ̀rọ̀ tí yóò dín ìtumọ̀ ọba kù. Àtúnsọ “sẹ́ … sẹ́” pa ìfaramọ́ ọ̀rọ̀ ἀρνέομαι àti agbára ìkìlọ̀ rẹ̀ mọ́. Àlàyé “kọ̀ ọ́ sílẹ̀” jẹ́ àṣàyàn tó yẹ fún ìtumọ̀ ‘disown’ láìfi ìtumọ̀ ẹ̀kọ́ ìjọ kún un.
