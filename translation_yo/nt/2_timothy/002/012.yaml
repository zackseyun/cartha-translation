id: 2TI.2.12
reference: 2 Timothy 2:12
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: yo
  text: Bí a bá ń fara dà, a ó sì bá a jọba; bí a bá sẹ́ ẹ[a], òun náà yóò sẹ́ wa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “kọ̀ ọ́ sílẹ̀” / “òun náà yóò kọ̀ wá sílẹ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομένομεν
  choice: ń fara dà
  rationale: Ọ̀rọ̀ yìí sọ nípa fífaradà ìpọ́njú tàbí ìdánwò láìyẹ̀ kúrò. “Ń fara dà” jẹ́ ọ̀nà àdánidá ní Yorùbá, ó sì pa ìtumọ̀ ọ̀rọ̀ ìṣe àsìkò ìsinsìnyí nínú gbólóhùn oníṣ条件 mọ́.
- source_word: συμβασιλεύσομεν
  choice: a ó sì bá a jọba
  rationale: Ọ̀rọ̀ ìṣe àkópọ̀ náà túmọ̀ sí jíjọ jọba pẹ̀lú ẹlòmíràn. “Bá a jọba” jẹ́ Yorùbá àdánidá, ó sì pa àwòrán ipò ọba mọ́.
- source_word: ἀρνησόμεθα
  choice: bá a sẹ́ ẹ
  rationale: “Sẹ́ ẹ” lè túmọ̀ sí kíkọ́ pé a mọ̀ ọ́n tàbí kíkọ̀ ọ́ sílẹ̀. A fi arọ́pò-orúkọ ẹni tí a sẹ́ kún un gẹ́gẹ́ bí àyíká ọ̀rọ̀ ṣe ń béèrè.
- source_word: κἀκεῖνος
  choice: òun náà
  rationale: “Òun náà” fi ìbámu ìdáhùn ẹni kejì hàn, ó sì tẹnumọ́ pé ohun tí Kristi yóò ṣe bá ohun tí a ṣe mu.
- source_word: ἀρνήσεται ἡμᾶς
  choice: yóò sẹ́ wa
  rationale: Lílo “sẹ́” lẹ́ẹ̀kejì pa àtúnsọ tí ó mọ̀ọ́mọ̀ wà nínú Gíríìkì mọ́, ó sì mú agbára ìkìlọ̀ náà dúró.
theological_decisions:
- issue: Irú ìkìlọ̀ tí ó wà nínú gbólóhùn oníṣ条件 kejì
  choice: 'A túmọ̀ ọ́ tààrà gẹ́gẹ́ bí ìkìlọ̀ gidi: “bí a bá sẹ́ ẹ, òun náà yóò sẹ́ wa.”'
  alternative: Kí a ṣàlàyé rẹ̀ gẹ́gẹ́ bí pípàdánù èrè nìkan, tàbí gẹ́gẹ́ bí ohun àròsọ tí kò ní agbára gidi.
  rationale: Gíríìkì gbé àwọn gbólóhùn oníṣ条件 méjèèjì kalẹ̀ ní ìwọ̀ntúnwọ̀nsì, ó sì fara jọ ìkìlọ̀ Jesu nípa ẹni tí ó bá sẹ́ ẹ. Ìtumọ̀ náà kò gbọ́dọ̀ yanjú àríyànjiyàn nípa ìṣubú kúrò nínú ìgbàgbọ́, ìforítì, tàbí èrè ju ohun tí ẹsẹ̀ náà sọ lọ.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. Àtúnsọ “sẹ́ … sẹ́” pa ìfarawé àti agbára ìkìlọ̀ Gíríìkì mọ́. A gbé àmì àlàyé [a] sí ọ̀dọ̀ ọ̀rọ̀ tí àlàyé rẹ̀ kan, dípò lẹ́yìn “fara dà,” nítorí àlàyé náà jẹ́ nípa ἀρνέομαι.
