id: 2TI.2.22
reference: 2 Timothy 2:22
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: yo
  text: Ṣùgbọ́n sá fún àwọn ìfẹ́kúfẹ̀ẹ́ ìgbà èwe[a]; lépa òdodo[b], ìgbàgbọ́[c], ìfẹ́ àti àlàáfíà, pẹ̀lú àwọn tí ń ké pè Olúwa láti inú ọkàn mímọ́.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìfẹ́kúfẹ̀ẹ́ ti àwọn ọ̀dọ́.” Gbólóhùn Gíríìkì náà lè tọ́ka sí onírúurú ìfẹ́ tí ó sábà máa ń bá ìgbà èwe lọ, kì í ṣe ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀ nìkan.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ìdájọ́ òdodo.” Ọ̀rọ̀ Gíríìkì náà lè ní ìtumọ̀ ìwà títọ́ àti ohun tí ó tọ́ nínú ìbáṣepọ̀ tàbí nípa òfin.
    reason: alternative_reading
  - marker: c
    text: Tàbí, “ìṣòtítọ́.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí ìgbàgbọ́, ìgbẹ́kẹ̀lé tàbí ìṣòtítọ́, gẹ́gẹ́ bí ọ̀rọ̀ àyíká.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: àwọn ìfẹ́kúfẹ̀ẹ́ ìgbà èwe
  rationale: Ó túmọ̀ sí àwọn ìfẹ́ tàbí ìfẹ́kúfẹ̀ẹ́ tí ó sábà máa ń bá ìgbà èwe lọ; ọ̀rọ̀ náà kò fi ìtumọ̀ rẹ̀ mọ́ ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀ nìkan.
- source_word: φεῦγε
  choice: sá fún
  rationale: Ó pa agbára àṣẹ náà àti àwòrán sísá kúrò nínú ewu mọ́, ó sì lè tọ́ka sí ìṣe tí a ń bá a lọ.
- source_word: δίωκε
  choice: máa lépa
  rationale: Ó fi ìsapá onítẹ̀sí hàn, ó sì dá ìyàtọ̀ alágbára sí ‘sá fún’.
- source_word: δικαιοσύνην
  choice: òdodo
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tó wọ́pọ̀ fún ìwà títọ́ níwájú Ọlọ́run àti ènìyàn; àlàyé ìsàlẹ̀ ojú ewé pa ìtumọ̀ ìdájọ́ òdodo mọ́.
- source_word: πίστιν
  choice: ìgbàgbọ́
  rationale: Èyí ni ìtumọ̀ àkọ́kọ́ tó bójú mu nínú àtòjọ àwọn ìwà rere yìí; ìṣòtítọ́ ṣì ṣeé ṣe gẹ́gẹ́ bí ìtumọ̀ míì.
- source_word: ἀγάπην
  choice: ìfẹ́
  rationale: Ìtumọ̀ tààrà, àdánidá, tí ó sì pa ìbáṣepọ̀ rẹ̀ mọ́ àwọn ibi míì tí ἀγάπη ti farahàn.
- source_word: εἰρήνην
  choice: àlàáfíà
  rationale: Ọ̀rọ̀ Yorùbá àdánidá fún àlàáfíà nínú àtòjọ àwọn ìwà rere.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: pẹ̀lú àwọn tí ń ké pe Olúwa
  rationale: ‘Pẹ̀lú’ fi ìbákẹ́gbẹ́ hàn, ‘ń ké pe Olúwa’ sì jẹ́ ọ̀nà àdánidá láti sọ ìpè ẹ̀sìn sí Olúwa.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: láti inú ọkàn mímọ́
  rationale: Ó pa èrò orísun inú tí ἐκ ń fi hàn mọ́, ó sì ń sọ nípa ọkàn olóòtítọ́ tí a ti sọ di mímọ́.
theological_decisions:
- issue: Ìwọ̀n ìtumọ̀ ‘νεωτερικὰς ἐπιθυμίας’
  choice: Àwọn ìfẹ́kúfẹ̀ẹ́ tó sábà máa ń bá ìgbà èwe lọ ní ìtumọ̀ gbígbòòrò
  alternative: Ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀ ní pàtàkì
  rationale: Gbólóhùn Gíríìkì náà gbòòrò ju ìfẹ́kúfẹ̀ẹ́ ìbálòpọ̀ nìkan lọ; ọ̀rọ̀ àyíká náà tún dá lórí ìwà àti ìṣe lápapọ̀.
- issue: Ìtumọ̀ δικαιοσύνη nínú àtòjọ ìwà rere
  choice: òdodo nínú ọ̀rọ̀ àkọ́kọ́
  alternative: ìdájọ́ òdodo
  rationale: ‘Òdodo’ jẹ́ ìtumọ̀ tó gbòòrò, tó sì bá àṣà ìtumọ̀ Pọ́ọ̀lù mu; àlàyé ìsàlẹ̀ ojú ewé pa apá ìbáṣepọ̀ àti ti òfin mọ́.
- issue: Ìtumọ̀ πίστις nínú àyíká yìí
  choice: ìgbàgbọ́
  alternative: ìṣòtítọ́
  rationale: Ìgbàgbọ́ jẹ́ ìtumọ̀ àkọ́kọ́ tó ṣeé gbà nínú àtòjọ yìí, ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà tún lè tọ́ka sí ìṣòtítọ́; a pa àṣàyàn náà mọ́ nínú àlàyé.
translation_notes:
  register: Yorùbá àfẹnusọ boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ọ̀wọ̀, kedere, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Máa lépa’ ń pa àṣẹ ìṣe onítẹ̀sí mọ́, ‘sá fún’ sì pa agbára àwòrán Gíríìkì mọ́.
