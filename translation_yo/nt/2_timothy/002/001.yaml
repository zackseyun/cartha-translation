id: 2TI.2.1
reference: 2 Timothy 2:1
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: yo
  text: Nítorí náà, ìwọ, ọmọ mi, máa gba agbára[a] nínú oore-ọ̀fẹ́ tí ó wà nínú Mèsáyà Jésù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “máa lágbára.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè jẹ́ títúmọ̀ ní ṣókí bẹ́ẹ̀, ṣùgbọ́n “máa gba agbára” túbọ̀ fi èrò pé agbára náà jẹ́ ohun tí a ń rí gbà hàn.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “Kristi Jésù.” A túmọ̀ oyè Gíríìkì Χριστός sí “Mèsáyà” níbí láti pa ìtumọ̀ oyè náà mọ́; “Kristi” ni ọ̀nà ìbílẹ̀ tí ọ̀pọ̀ ìtumọ̀ Bíbélì Yorùbá ń lò.
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ
  choice: ìwọ
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ náà fara hàn ní Gíríìkì fún ìtẹnumọ́; “ìwọ” pa ìtẹnumọ́ àti ìyàtọ̀ yẹn mọ́.
- source_word: οὖν
  choice: Nítorí náà
  rationale: Ó so àṣẹ yìí mọ́ ohun tí ó ṣáájú gẹ́gẹ́ bí àbájáde tàbí ìtẹ̀síwájú ọ̀rọ̀.
- source_word: τέκνον μου
  choice: ọmọ mi
  rationale: τέκνον túmọ̀ sí ọmọ láìfi akọ tàbí abo sí i, ó sì fi ìfẹ́ àti ìbáṣepọ̀ tímọ́tímọ́ Pọ́ọ̀lù sí Timotiu hàn.
- source_word: ἐνδυναμοῦ
  choice: máa gba agbára
  rationale: Àṣẹ alámìí ìṣesí-tẹ̀síwájú yìí fi hàn pé kí Timotiu máa rí agbára gbà, kì í ṣe pé kí ó gbára lé okun ara rẹ̀ nìkan. Ó tún jẹ́ èdè Yorùbá àdánidá ju ìtumọ̀ afipáṣe lọ.
- source_word: ἐν τῇ χάριτι
  choice: nínú oore-ọ̀fẹ́
  rationale: '“Nínú” pa ààyè ìtumọ̀ ἐν mọ́: oore-ọ̀fẹ́ ni agbègbè tí agbára náà wà, ó sì lè jẹ́ ọ̀nà tí agbára fi dé.'
- source_word: χάριτι
  choice: oore-ọ̀fẹ́
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀, tí ó sì bá χάρις mu ní àyíká ọ̀rọ̀ Pọ́ọ̀lù.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: tí ó wà nínú Mèsáyà Jésù
  rationale: Ó tẹ̀ lé ìṣètò àsọyé Gíríìkì, ó sì sọ oore-ọ̀fẹ́ náà di èyí tí ó wà nínú tàbí tí ó so mọ́ Mèsáyà Jésù.
- source_word: Χριστῷ
  choice: Mèsáyà
  rationale: Χριστός jẹ́ oyè “Ẹni Àmì-òróró”; “Mèsáyà” pa agbára oyè náà mọ́ dípò kí a ṣe é bí orúkọ lásán.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: Èyí ni ìkọ̀wé orúkọ Ἰησοῦς tí ó ti fìdí múlẹ̀ ní Yorùbá.
theological_decisions:
- issue: Ohùn àti orísun agbára nínú ἐνδυναμοῦ
  choice: máa gba agbára
  alternative: máa lágbára
  rationale: Àṣàyàn yìí fi ìtumọ̀ gbígba agbára sílẹ̀, ó sì yẹra fún dídá ọ̀rọ̀ náà sí ìgbẹ́kẹ̀lé agbára ẹni fúnra rẹ̀; síbẹ̀, àlàyé ìsàlẹ̀ ojú ewé jẹ́wọ́ ìtumọ̀ kúkúrú tí ó tún ṣeé ṣe.
- issue: Ìtumọ̀ Χριστός
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: “Mèsáyà” fi ìtumọ̀ oyè Gíríìkì hàn gbangba, nígbà tí àlàyé ìsàlẹ̀ ojú ewé pa ìlò ìbílẹ̀ “Kristi” mọ́ gẹ́gẹ́ bí àṣàyàn mìíràn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, ọlọ́lá ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. “Máa” fi ìṣesí-tẹ̀síwájú àṣẹ Gíríìkì hàn; àwọn àmì ohùn ni a lò ní kíkún níbi tí ó bá yẹ.
