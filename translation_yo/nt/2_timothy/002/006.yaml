  text: τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: yo
  text: Àgbẹ̀ tí ń ṣiṣẹ́ kára gbọ́dọ̀ kọ́kọ́ gba ìpín nínú àwọn ohun tí oko mú jáde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Àgbẹ̀ tí ń ṣe làálàá gbọ́dọ̀ kọ́kọ́ ní ìpín nínú àwọn ohun tí oko mú jáde.” Ìtumọ̀ yìí tẹ̀lé ọ̀rọ̀ Gíríìkì pẹ́kípẹ́kí sí i nípa lílo “ní ìpín”; ọ̀rọ̀ pàtàkì lo èdè Yorùbá ìgbàlódé tó ṣe kedere sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶντα (κοπιάω)
  choice: tí ń ṣiṣẹ́ kára
  rationale: Ó fi iṣẹ́ àṣekára tí ń bá a lọ hàn, ó sì jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó yé òǹkàwé òde òní.
- source_word: γεωργὸν (γεωργός)
  choice: Àgbẹ̀
  rationale: Àgbẹ̀ ni ọ̀rọ̀ Yorùbá tí ó ṣe kedere jù lọ fún ẹni tí ń ṣiṣẹ́ ilẹ̀.
- source_word: δεῖ
  choice: gbọ́dọ̀
  rationale: Ó pa agbára ìjẹ́dandan tàbí ojúṣe inú ọ̀rọ̀ Gíríìkì mọ́.
- source_word: πρῶτον
  choice: kọ́kọ́
  rationale: Ó fi ipò àkọ́kọ́ tàbí ààyè ṣáájú hàn, ó sì so mọ́ gbígba ìpín gẹ́gẹ́ bí ìṣètò ọ̀rọ̀ Gíríìkì ṣe tọ́ka sí.
- source_word: τῶν καρπῶν (καρπός)
  choice: nínú èso oko náà
  rationale: Nínú àkòrí iṣẹ́ àgbẹ̀, ‘èso oko’ ní ìtumọ̀ gbòòrò ju èso igi nìkan lọ, ó sì dúró fún ohun tí oko mú jáde.
- source_word: μεταλαμβάνειν (μεταλαμβάνω)
  choice: gba ìpín
  rationale: Ó sọ ìtumọ̀ jíjẹ alábápín tàbí gbígba apá kan nínú ohun kan ní Yorùbá kedere, láì dín un kù sí jíjẹ oúnjẹ nìkan.
theological_decisions:
- issue: Ìtumọ̀ gbólóhùn òwe náà
  choice: Ẹni tí ó ń ṣe iṣẹ́ àṣekára ní láti kọ́kọ́ ní ìpín nínú èso iṣẹ́ náà.
  alternative: Àgbẹ̀ ní láti kọ́kọ́ ṣiṣẹ́ kí ó tó jẹ nínú èso oko.
  rationale: Ìṣètò àti gírámà Gíríìkì dára pọ̀ mọ́ pípa πρῶτον mọ́ gbígba ìpín, kì í ṣe mọ́ àkókò tí àgbẹ̀ bẹ̀rẹ̀ sí í ṣiṣẹ́. Nítorí náà, ọ̀rọ̀ náà tẹnu mọ́ ààyè ṣáájú nínú èso iṣẹ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé, ọ̀wọ̀, tí ó sì rọrùn fún gbogbo ènìyàn. A lo “ṣiṣẹ́ kára” dípò ọ̀rọ̀ tí ó le tàbí ti àtijọ́, a sì lo “gba ìpín” láti mú èrò jíjẹ alábápín hàn kedere. Gbogbo àmì ohùn ni a fi sí ibi tí ó yẹ.
