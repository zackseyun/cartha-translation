  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: yo
  text: Ṣùgbọ́n má ṣe dá ara rẹ sí àwọn àríyànjiyàn òmùgọ̀ àti aláìní ìtọ́ni[a], níwọ̀n bí o ti mọ̀ pé wọ́n ń bí ìjà sílẹ̀[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ó tún lè jẹ́ ‘àwọn ìbéèrè’ tàbí ‘àwọn ìjíròrò’; ọ̀rọ̀ Gíríìkì náà lè tọ́ka sí ìwádìí, ṣùgbọ́n níhìn-ín ó ṣeé ṣe kó túmọ̀ sí awuyewuye oníjà ju ìwádìí òtítọ́ lọ.
    reason: lexical_alternative
  - marker: b
    text: Ní ti gidi, ‘wọ́n ń bímọ’ tàbí ‘wọ́n ń bí ... sílẹ̀’; àkàwé ni fún bí wọ́n ṣe ń fa ìjà tàbí mú un wá.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: òmùgọ̀
  rationale: Ó ń fi hàn pé àwọn àríyànjiyàn náà kò ní làákàyè tàbí èrò tó bógbọ́n mu; ‘òmùgọ̀’ jẹ́ ọ̀rọ̀ Yorùbá tó ṣe kedere, tó sì pa agbára ọ̀rọ̀ Gíríìkì mọ́.
- source_word: ἀπαιδεύτους
  choice: aláìní-ìtọ́ni
  rationale: Ọ̀rọ̀ náà tọ́ka sí ohun tí kò ní ẹ̀kọ́, ìdánilẹ́kọ̀ọ́, tàbí ìtọ́ni lẹ́yìn rẹ̀, kì í ṣe àìní òye lásán. ‘Aláìní-ìtọ́ni’ pa ìtumọ̀ yìí mọ́ láì sọ pé àwọn ènìyàn kan kò ní làákàyè.
- source_word: ζητήσεις
  choice: àríyànjiyàn
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀ náà lè túmọ̀ sí ìbéèrè tàbí ìwádìí, àyíká ẹsẹ̀ yìí fi hàn pé ó jẹ́ ìjíròrò oníjà. ‘Àríyànjiyàn’ sọ ìtumọ̀ àyíká náà ní èdè Yorùbá àdánidá.
- source_word: παραιτοῦ
  choice: kọ̀ láti dá sí
  rationale: Àṣẹ náà ni pé kí Timotiu kọ̀ tàbí yẹra fún kíkópa nínú wọn. Gbólóhùn yìí jẹ́ ti ẹ̀dá Yorùbá, ó sì pa agbára àṣẹ náà mọ́.
- source_word: εἰδὼς
  choice: níwọ̀n bí o ti mọ̀ pé
  rationale: Ọ̀rọ̀ aláìlẹ́gbẹ́ yìí sọ ìdí fún àṣẹ náà. Ìtumọ̀ yìí mú ìbáṣepọ̀ ìdí náà ṣe kedere ní Yorùbá.
- source_word: γεννῶσι
  choice: ń bí ... sílẹ̀
  rationale: Èyí pa àwòrán ìbí tàbí bíbímọ inú ọ̀rọ̀ Gíríìkì mọ́, ó sì jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé ohun kan ń fa òmíràn.
- source_word: μάχας
  choice: ìjà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà tọ́ka sí ìforígbárí àti awuyewuye tí àríyànjiyàn ń dá sílẹ̀; ‘ìjà’ lè gba ìtumọ̀ ẹnu àti ti ìbáṣepọ̀ yìí.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó ń samisi ìyàtọ̀ pẹ̀lẹ́ sí ìṣírí tó ṣáájú; ‘Ṣùgbọ́n’ mú ìyàtọ̀ náà hàn kedere.
theological_decisions: []
translation_notes:
  register: Èdè Yorùbá boṣewa, ọ̀wọ̀, àti òde òní ni a lò. ‘Kọ̀ láti dá sí’ yàgò fún líle tí ‘kọ̀ ọ́ sílẹ̀’ lè ní, ó sì mú èrò yíyẹra fún kíkópa hàn. Àwọn àmì ohùn ni a fi sí ibi tí ó bá yẹ.
