language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: yo
  text: nítorí èyí[a] ni mo ṣe ń jìyà, títí dé inú ẹ̀wọ̀n bí ọ̀daràn[b]. Ṣùgbọ́n ọ̀rọ̀ Ọlọ́run kò ní ìdè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘nínú èyí’ tàbí ‘nítorí ìdí èyí’; ó ṣeé ṣe kí gbolohun náà ń tọ́ka sí ìhìnrere tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú.
    reason: alternative_reading
  - marker: b
    text: Tàbí, ‘bí ẹni tó ń ṣe ibi.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: nítorí èyí
  rationale: Àpólà ìbátan yìí ṣeé lóye gẹ́gẹ́ bí ohun tó ń tọ́ka sí ìhìnrere tí a mẹ́nu kàn ní ẹsẹ tó ṣáájú, ó sì lè fi ìdí tàbí àyíká ìjìyà hàn. ‘Nítorí èyí’ jẹ́ Yorùbá àdánidá tó mú ìtumọ̀ ìdí jáde, nígbà tí àlàyé ìsàlẹ̀ fi àìdánilójú náà pamọ́.
- source_word: κακοπαθῶ
  choice: mo ṣe ń jìyà
  rationale: Ó fi ìjìyà tàbí ìnira tí ó ń bá a lọ hàn, ó sì jẹ́ ọ̀nà Yorùbá tó ṣe kedere àti tó wọ́pọ̀.
- source_word: μέχρι δεσμῶν
  choice: títí dé inú ẹ̀wọ̀n
  rationale: μέχρι fi ààlà ìjìyà hàn; δεσμά túmọ̀ ní ti gidi sí ìdè tàbí ẹ̀wọ̀n, ṣùgbọ́n ó tún ń tọ́ka sí fífi ẹni sẹ́wọ̀n. Gbólóhùn yìí jẹ́ àdánidá ní Yorùbá, ó sì pa àwòrán ìdè mọ́.
- source_word: ὡς κακοῦργος
  choice: bí ọ̀daràn
  rationale: κακοῦργος lè jẹ́ ẹni tó ń ṣe ibi tàbí ẹni tí a dá lẹ́bi òfin. Nínú ọ̀rọ̀ ẹ̀wọ̀n yìí, ‘ọ̀daràn’ mú agbára ìtumọ̀ ìdájọ́ jáde ní kedere.
- source_word: ἀλλὰ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ tó lágbára hàn láàárín ìdè Pọ́ọ̀lù àti òmìnira ọ̀rọ̀ Ọlọ́run.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ọ̀rọ̀ Ọlọ́run
  rationale: Ó pa ìtumọ̀ λόγος mọ́ ní fífẹ̀, láì dín un kù sí Ìwé Mímọ́ nìkan tàbí ìhìnrere nìkan.
- source_word: οὐ δέδεται
  choice: kò sí ní ìdè
  rationale: Perfect passive náà ń sọ ipò jíjẹ́ dídè; ‘kò sí ní ìdè’ jẹ́ Yorùbá àdánidá tó pa àkàwé ìdè mọ́, ó sì dáhùn sí ‘ẹ̀wọ̀n’ tó wà ní apá àkọ́kọ́.
theological_decisions:
- issue: Ìtumọ̀ ‘ọ̀rọ̀ Ọlọ́run’
  choice: A túmọ̀ ọ́ sí ‘ọ̀rọ̀ Ọlọ́run’ láì sọ pé Ìwé Mímọ́ nìkan, ìhìnrere nìkan, tàbí gbogbo iṣẹ́ ìkéde Ọlọ́run ni.
  alternative: ‘ìhìnrere Ọlọ́run’ tàbí ‘Ìwé Mímọ́’
  rationale: Àyíká ọ̀rọ̀ náà ń tọ́ka pàápàá sí ìhìnrere tí a ń kéde, ṣùgbọ́n gbólóhùn Gíríìkì náà gbòòrò ju bẹ́ẹ̀ lọ; ìtumọ̀ náà pa fífẹ̀ àti ìfọ̀rọ̀wérọ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́.
translation_notes:
  register: Yorùbá ìlòde-òní tó ní ọlá ni a lò, pẹ̀lú àmì ohùn ní kíkún. Gbólóhùn náà jẹ́ kúkúrú, ó pa ìyàtọ̀ àròsọ mọ́ láàárín Pọ́ọ̀lù tó wà ní ẹ̀wọ̀n àti ọ̀rọ̀ Ọlọ́run tí kò sí ní ìdè.
