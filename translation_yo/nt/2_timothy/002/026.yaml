id: 2TI.2.26
reference: 2 Timothy 2:26
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: yo
  text: kí wọ́n sì lè padà wá sí òye, kí wọ́n bọ́ kúrò nínú ìdẹ̀kùn Èṣù, níwọ̀n bí ó ti mú wọn láàyè[b] láti ṣe ìfẹ́ rẹ̀.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “níwọ̀n bí ó ti mú wọn láàyè láti ṣe ìfẹ́ ẹni náà.” Àwọn kan gbà pé “ẹni náà” kò tọ́ka sí Èṣù, bí kò ṣe Ọlọ́run.
    reason: alternative_reading
  - marker: b
    text: Ọ̀rọ̀-ìṣe tí a túmọ̀ sí “mú wọn láàyè” tún lè túmọ̀ ní gbogbogbò sí “mú wọn ní ìgbèkùn,” ṣùgbọ́n ọ̀rọ̀ Gíríìkì náà tọ́ka ní pàtó sí mímú ẹnì kan nígbà tí ó ṣì wà láàyè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: padà wá sí òye
  rationale: Ọ̀rọ̀ náà túmọ̀ ní pàtó sí jí kúrò nínú ìmutípara tàbí tún ní ìrònú tí ó mọ́; ní àyíká yìí, ‘padà wá sí òye’ jẹ́ Yorùbá àdánidá fún pípadà ní ìmọ̀lára àti ìdájọ́ tó tọ́.
- source_word: παγίδος
  choice: ìdẹ̀kùn
  rationale: ‘Ìdẹ̀kùn’ ṣàfihàn ohun tí a fi ń mú ẹranko tàbí dẹ ẹnì kan, ó sì bá àwòrán ìdẹkùn ẹ̀mí mu.
- source_word: διαβόλου
  choice: Èṣù
  rationale: Níbi yìí, διάβολος jẹ́ orúkọ oyè fún ọ̀tá Ọlọ́run; ‘Èṣù’ ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ jù fún un.
- source_word: ἐζωγρημένοι
  choice: ẹni tí ó mú wọn ní ààyè
  rationale: ζωγρέω ní ìtumọ̀ pàtó ti mímú ẹnì kan nígbà tí ó ṣì wà láàyè. Ìtumọ̀ yìí pa agbára ọ̀rọ̀ Gíríìkì mọ́, bí ó tilẹ̀ jẹ́ pé a tún lè túmọ̀ rẹ̀ ní gbogbogbò sí ‘mú ní ìgbèkùn.’
- source_word: ὑπ’ αὐτοῦ
  choice: ẹni tí ó mú wọn
  rationale: Ọ̀rọ̀ arọ́pò ‘ó’ tọ́ka lọ́nà àdánidá sí Èṣù, ẹni tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: láti mú ìfẹ́ rẹ̀ ṣẹ
  rationale: Èyí sọ ète ìgbèkùn náà ní Yorùbá àdánidá. ‘Rẹ̀’ lè tọ́ka sí Èṣù gẹ́gẹ́ bí ẹni tó sún mọ́ ọn jù, ṣùgbọ́n Gíríìkì tún gba òye míì láàyè, èyí tí àlàyé ìsàlẹ̀ tọ́ka sí.
theological_decisions:
- issue: Ẹni tí ἐκείνου (‘rẹ̀’/‘ẹni náà’) ń tọ́ka sí
  choice: Èṣù, nítorí náà ‘láti mú ìfẹ́ rẹ̀ ṣẹ’ túmọ̀ sí ìfẹ́ Èṣù.
  alternative: Àwọn kan ka ọ̀rọ̀ náà sí ìfẹ́ Ọlọ́run, ní òye pé a mú wọn kúrò ní ìdẹ̀kùn Èṣù kí wọ́n lè ṣe ìfẹ́ Ọlọ́run.
  rationale: Èṣù ni ẹni tí ó sún mọ́ ọ̀rọ̀ arọ́pò náà jù, ó sì bá ìṣàn gbólóhùn mu. Síbẹ̀, ìtọ́kasí ἐκείνου ti jẹ́ ọ̀ràn àríyànjiyàn tipẹ́, nítorí náà a pa òye kejì mọ́ sínú àlàyé dípò fífi parẹ́.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀rọ̀ òde òní tí ó ní iyì, àti àmì ohùn ní kíkún. ‘Padà wá sí òye’ jẹ́ àsọyé àdánidá; ‘ìdẹ̀kùn Èṣù’ sì pa àwòrán Gíríìkì mọ́. Àwọn àmì àlàyé [a][b] wà lẹ́yìn gbólóhùn tí wọ́n ń ṣàlàyé.
