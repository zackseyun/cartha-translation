id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: yo
  text: Máa rán wọn létí àwọn nǹkan wọ̀nyí, kí o sì fi Olúwa ṣe ẹlẹ́rìí tẹnu mọ́ ọn fún wọn pé kí wọn má ṣe máa bá ara wọn jiyàn lórí ọ̀rọ̀. Èyí kò wúlò fún ohunkóhun[a], ó sì ń yọrí sí ìparun àwọn tí ń gbọ́. [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “èyí kò ní èrè kankan.”
    reason: lexical_alternative
  - marker: b
    text: Gbólóhùn náà “fi Olúwa ṣe ẹlẹ́rìí” lè túmọ̀ sí pé Olúwa ni ẹlẹ́rìí ohun tí a ń sọ, láìsọ ní pàtó bóyá “Olúwa” níhìn-ín ń tọ́ka sí Olúwa Jesu ní pàtàkì tàbí sí Ọlọ́run ní gbogbogbòò.
    reason: alternative_reading
lexical_decisions:
- source_word: Ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ ọ̀pọ̀ yìí ń tọ́ka padà sí àwọn ẹ̀kọ́ tí ó ṣáájú; ìtumọ̀ yìí pa agbára ìtọ́kasí náà mọ́.
- source_word: ὑπομίμνῃσκε
  choice: Máa rán wọn létí
  rationale: Àṣẹ àsìkò ìsinsìnyí ní èdè Gíríìkì fi iṣẹ́ tí a ń ṣe léraléra tàbí tí a ń bá a lọ hàn; “máa rán … létí” jẹ́ ọ̀nà àdánidá láti sọ ọ́ ní Yorùbá.
- source_word: διαμαρτυρόμενος
  choice: kí o sì kìlọ̀ fún wọn gidigidi
  rationale: Ó ní ìtumọ̀ fífi ọ̀rọ̀ pàtàkì àti ìkìlọ̀ líle lé ẹnì kan lọ́rùn; “gidigidi” mú ìjẹ́pàtàkì náà jáde láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: níwájú Olúwa
  rationale: Èyí jẹ́ gbólóhùn àdánidá fún ṣíṣe ohun kan ní ojú Ẹlẹ́rìí ọ̀run, ó sì pa akọ́lé κύριος mọ́ láìdín ẹni tí ó ń tọ́ka sí kù.
- source_word: μὴ λογομαχεῖν
  choice: kí wọn má ṣe máa bá ara wọn jiyàn lórí àwọn ọ̀rọ̀
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ìjà tàbí awuyewuye nípa ọ̀rọ̀; àfikún “bá ara wọn” mú ìṣe alábápín náà ṣe kedere ní Yorùbá.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: Èyí kò wúlò fún ohunkóhun
  rationale: Ó fi hàn pé irú awuyewuye bẹ́ẹ̀ kò ní àǹfààní rárá; gbólóhùn yìí ṣe kedere, ó sì bá Yorùbá òde òní mu.
- source_word: ἐπὶ καταστροφῇ
  choice: ó sì ń yọrí sí ìparun
  rationale: Àkójọpọ̀ ọ̀rọ̀ yìí tọ́ka sí àbájáde búburú; “ń yọrí sí” mú ìbáṣepọ̀ àbájáde náà hàn láìrẹ̀wẹ̀sì líle καταστροφή.
- source_word: τῶν ἀκουόντων
  choice: àwọn tí ń gbọ́
  rationale: Ọ̀rọ̀ aláṣẹ̀ṣe ìsinsìnyí tí a lò bí orúkọ ni; ìtumọ̀ yìí jẹ́ àdánidá, ó sì pa ìṣe gbígbọ́ tí ń lọ lọ́wọ́ mọ́.
theological_decisions:
- issue: Ẹni tí κύριος ń tọ́ka sí
  choice: Olúwa
  alternative: Ọlọ́run; Olúwa Jesu
  rationale: Èdè Gíríìkì sọ “Olúwa” nìkan, kò sì dá ẹni pàtó sílẹ̀ ní kedere. Ìtumọ̀ náà pa àìdánilójú tòótọ́ yìí mọ́, kò sì fi ìtumọ̀ ẹ̀kọ́ ìsìn kan lé e lórí.
translation_notes:
  register: A lo Yorùbá boṣewa, ọ̀wọ̀, àti èdè òde òní tí ó ṣeé yé fún gbogbo ènìyàn. A gbé àmì [b] sí “Olúwa” àti [a] sí gbólóhùn “kò wúlò fún ohunkóhun,” nítorí ibẹ̀ ni àlàyé ẹsẹ̀ kọ̀ọ̀kan bá mu, bí ó tilẹ̀ jẹ́ pé àwọn àmì inú ẹ̀dà ìgbìmọ̀ Gẹ̀ẹ́sì wà ní ibi tí kò bá àlàyé wọn mu.
