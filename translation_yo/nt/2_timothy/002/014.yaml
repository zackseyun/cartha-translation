revisions:
- from: Máa rán wọn létí àwọn nǹkan wọ̀nyí, kí o sì kìlọ̀ fún wọn gidigidi níwájú Olúwa[b] pé kí wọn má ṣe máa bá ara wọn jiyàn lórí àwọn ọ̀rọ̀. Èyí kò wúlò fún ohunkóhun[a], ó sì ń yọrí sí ìparun àwọn tí ń gbọ́.
  to: Máa rán wọn létí àwọn nǹkan wọ̀nyí, kí o sì fi Olúwa ṣe ẹlẹ́rìí tẹnu mọ́ ọn fún wọn pé kí wọn má ṣe máa bá ara wọn jiyàn lórí ọ̀rọ̀. Èyí kò wúlò fún ohunkóhun[a], ó sì ń yọrí sí ìparun àwọn tí ń gbọ́. [b]
  rationale: 'A rọ́pò «kìlọ̀ fún wọn gidigidi níwájú Olúwa» pẹ̀lú «fi Olúwa ṣe ẹlẹ́rìí tẹnu mọ́ ọn fún wọn» láti ṣàfihàn διαμαρτυρόμενος àti ἐνώπιον τοῦ κυρίου pẹkipẹki, láìfi ìtumọ̀ ẹ̀kọ́ ìsìn kún un. A tún ṣàtúnṣe àlàyé [b] kí ó ba ọ̀rọ̀ tí àmì náà tọ́ka sí mu. A gbe [b] sí òpin ẹsẹ̀ gẹ́gẹ́ bí àmì tí ń ṣàlàyé gbólóhùn inú ẹsẹ̀; bí ìlànà ìtẹ̀jáde bá fẹ́ kí àmì náà wà lẹ́gbẹ̀ẹ́ ọ̀rọ̀ náà gan-an, a lè kọ ọ́ báyìí: «fi Olúwa[b] ṣe ẹlẹ́rìí».'
  reviewer_model: gpt-5.6-terra
