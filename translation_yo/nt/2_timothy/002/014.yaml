  source_fidelity: 'Ìtumọ̀ náà fara mọ́ ìtumọ̀ gbogbogbò ẹsẹ̀ náà dáadáa: àṣẹ tí ń bá a lọ, ìjà lórí ọ̀rọ̀ tí kò ní àǹfààní, àti àbájáde ìparun fún àwọn olùgbọ́, gbogbo rẹ̀ wà nínú rẹ̀. Síbẹ̀, «kìlọ̀ fún wọn gidigidi» yí διαμαρτυρόμενος sí ìkìlọ̀ ní pàtàkì, níbi tí ọ̀rọ̀ Gíríìkì náà ti ní agbára ìfi-ẹ̀rí/ìtẹnumọ́ pẹ̀lú ìlànà gbígbóná janjan. Àtúnṣe náà mú ìfi Olúwa ṣe ẹlẹ́rìí àti ìlànà líle náà hàn dáadáa.'
