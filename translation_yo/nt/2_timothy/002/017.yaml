    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: ọ̀rọ̀
  rationale: Nínú àyíká ọ̀rọ̀ yìí, ó tọ́ka sí ohun tí àwọn olùkọ́ èké náà ń sọ tàbí ẹ̀kọ́ wọn. “Ọ̀rọ̀” jẹ́ èdè Yorùbá àdánidá tí ó tún lè pa ìtúmọ̀ “word/message/discourse” mọ́.
- source_word: αὐτῶν
  choice: wọn
  rationale: 'Arọ́pò-orúkọ ohun-ìní tí ó bá λόγος mu: “ọ̀rọ̀ wọn.”'
- source_word: ὡς γάγγραινα
  choice: bí egbò jíjẹrà
  rationale: γάγγραινα jẹ́ àrùn jíjẹrà tí ń ba ẹran ara jẹ́. “Egbò jíjẹrà” mú àwòrán ìṣègùn àti ipa apanirun rẹ̀ hàn ní èdè tí òǹkàwé òde òní lè lóye, láì yí i sí “àrùn jẹjẹrẹ.”
- source_word: νομὴν ἕξει
  choice: yóò máa tàn ká
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà ní ti gidi ní èrò “ní ipa ọ̀nà/pápá,” ṣùgbọ́n pẹ̀lú àwòrán gangrene ó túmọ̀ sí ohun tí ń gbilẹ̀ tí ó sì ń ba nǹkan jẹ́. “Yóò máa tàn ká” sọ ìtumọ̀ náà ní Yorùbá àdánidá.
- source_word: ὧν ἐστιν
  choice: wà lára wọn
  rationale: Ó yan àwọn àpẹẹrẹ méjì láti inú ẹgbẹ́ àwọn tí a ṣẹ̀ṣẹ̀ mẹ́nu kàn.
- source_word: Ὑμέναιος
  choice: Híménáyọ̀
  rationale: Ìkọ̀wé orúkọ Gíríìkì náà ní ọ̀nà tí ó ṣeé pe ní Yorùbá, pẹ̀lú àmì ohùn.
- source_word: Φίλητος
  choice: Fílétọ̀
  rationale: Ìkọ̀wé orúkọ Gíríìkì náà ní ọ̀nà tí ó ṣeé pe ní Yorùbá, pẹ̀lú àmì ohùn.
theological_decisions:
- issue: Agbára àkàwé àrùn jíjẹrà
  choice: Ọ̀rọ̀ tàbí ẹ̀kọ́ búburú náà ń tàn ká lọ́nà apanirun nínú àwùjọ.
  alternative: Lílo gbólóhùn gidi-gidi bí “yóò ní ipa ọ̀nà rẹ̀,” láì ṣàlàyé ìtànkálẹ̀ inú àkàwé náà.
  rationale: “Yóò máa tàn ká bí egbò jíjẹrà” pa àwòrán ìṣègùn àti ìkìlọ̀ Páùlù mọ́, láì fi ẹ̀kọ́ ìsìn mìíràn kún un.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá boṣewa, àdánidá, tí ó ní iyì, pẹ̀lú àmì ohùn níbi tí ó ti yẹ. A gbé àmì àlàyé [a] àti [b] sí ọ̀dọ̀ àwọn ọ̀rọ̀ tí wọ́n ń ṣàlàyé, dípò títẹ̀lé ibi tí wọ́n wà nínú àkópamọ́ Gẹ̀ẹ́sì tí kò bá àkóónú àlàyé náà mu.
