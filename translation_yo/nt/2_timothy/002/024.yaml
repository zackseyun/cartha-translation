  source_fidelity: 'Ìtumọ̀ náà gba ìtumọ̀ pàtàkì gbogbo nínú Gíríìkì: ìránṣẹ́ Olúwa kò gbọdọ̀ jẹ́ oníjà; ó gbọdọ̀ jẹ́ pẹ̀lẹ́ sí gbogbo ènìyàn, tó lè kọ́ni, tí ó sì lè fara da ìwà búburú. Ṣùgbọ́n “onírẹ̀lẹ̀” máa ń tọ́ka sí ìrẹ̀lẹ̀ tàbí ìtẹríba ju ἤπιος (‘pẹ̀lẹ́, tútù’) lọ, “kí ó lè kọ́ni” sì lè dun bí ìdí/àfojúsùn dípò agbára tàbí ìmúrasílẹ̀ láti kọ́ni.'
