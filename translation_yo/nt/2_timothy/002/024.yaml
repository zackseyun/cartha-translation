id: 2TI.2.24
reference: 2 Timothy 2:24
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: yo
  text: Ṣùgbọ́n ìránṣẹ́ Olúwa[a] kò gbọdọ̀ máa jiyàn; kàkà bẹ́ẹ̀, ó gbọdọ̀ jẹ́ ẹni pẹ̀lẹ́ sí gbogbo ènìyàn, tó lè kọ́ni, tí ó sì jẹ́ onísùúrù nígbà tí wọ́n bá ṣe ohun búburú sí i.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ẹrú Olúwa.” Ọ̀rọ̀ Gíríìkì náà lè túmọ̀ sí “ìránṣẹ́” tàbí “ẹrú,” gẹ́gẹ́ bí àyíká ọ̀rọ̀.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον (δοῦλος)
  choice: ìránṣẹ́
  rationale: Nínú àyíká ìtọ́ni yìí, ọ̀rọ̀ náà ń tọ́ka sí ẹni tó ń sin Olúwa àti ìwà tí ó yẹ kó hù. “Ìránṣẹ́” jẹ́ èdè Yorùbá àdánidá; “ẹrú” jẹ́ ìtumọ̀ mìíràn tó ṣeé ṣe, ṣùgbọ́n àwòrán ipò ẹrú kì í ṣe ohun tí ẹsẹ yìí tẹnumọ́.
- source_word: κυρίου
  choice: Olúwa
  rationale: Èyí ni ìtumọ̀ Yorùbá tó ṣe déédé fún κύριος ní àyíká yìí, ó sì pa ìbáṣepọ̀ inú gbólóhùn “ìránṣẹ́ Olúwa” mọ́.
- source_word: οὐ δεῖ
  choice: kò yẹ kí …; ó gbọ́dọ̀
  rationale: δεῖ fi ohun tí ó pọndandan tàbí ojúṣe hàn. Ìkọ̀ “kò yẹ kí” àti ìlànà rere “ó gbọ́dọ̀” sọ agbára àṣẹ náà ní Yorùbá àdánidá.
- source_word: μάχεσθαι
  choice: máa jiyàn
  rationale: Nínú àyíká iṣẹ́ olùkọ́, ọ̀rọ̀ náà ń tọ́ka pàápàá sí ìjà ọ̀rọ̀ àti ìwà oníjà, kì í ṣe ìjà ara nìkan.
- source_word: ἤπιον
  choice: onírẹ̀lẹ̀
  rationale: Ó sọ ìwà tútù, pẹ̀lẹ́pẹ̀lẹ́ tí ó yàtọ̀ sí jíjiyàn. “Onírẹ̀lẹ̀” jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì yẹ fún ìforúkọsílẹ̀ ọlọ́lá.
- source_word: πρὸς πάντας
  choice: sí gbogbo ènìyàn
  rationale: Ó pa ìtànkálẹ̀ ìwà rere náà sí gbogbo ènìyàn mọ́ ní ọ̀nà Yorùbá àdánidá.
- source_word: διδακτικόν
  choice: kí ó lè kọ́ni
  rationale: Ọ̀rọ̀ náà túmọ̀ sí ẹni tó lágbára tàbí tó tóótun láti kọ́ ẹlòmíràn, kì í ṣe ẹni tó ṣeé kọ́ nìkan.
- source_word: ἀνεξίκακον
  choice: kí ó sì máa fi sùúrù gba ìwà búburú tí a bá hù sí i
  rationale: Ọ̀rọ̀ tó ṣọ̀wọ́n yìí ń sọ fífarada ìpalára tàbí ìwà búburú láìgbẹ̀san. Ìtumọ̀ gbolohun yìí mú ìtumọ̀ náà ṣe kedere fún òǹkàwé Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ δοῦλος nínú àyíká ìtọ́ni iṣẹ́ ìránṣẹ́
  choice: ìránṣẹ́
  alternative: ẹrú
  rationale: Àfojúsùn ẹsẹ náà ni ìwà ẹni tó ń sin Olúwa, kì í ṣe ṣíṣe àlàyé ipò ẹrú gẹ́gẹ́ bí àkọlé ẹ̀kọ́ ìgbàgbọ́. Síbẹ̀, àlàyé ìsàlẹ̀ pa ìtumọ̀ “ẹrú” mọ́ gẹ́gẹ́ bí àṣàyàn ọ̀rọ̀ tó bófin mu.
- issue: Ìtumọ̀ κύριος
  choice: Olúwa
  alternative: Ọ̀gá
  rationale: “Olúwa” ni ìtumọ̀ tó ṣe déédé nínú ọ̀rọ̀ nípa Kristi, kò sì sí ohun kankan nínú àyíká yìí tó béèrè pé ká lo “Ọ̀gá.”
translation_notes:
  register: A lo Yorùbá àfẹnusọ tó bójú mu, tó níyì, tó sì ṣeé lóye fún òǹkàwé òde òní. Gbólóhùn náà pa ìyàtọ̀ láàárín ìwà oníjà àti ìwà tútù mọ́; ó tún tú ἀνεξίκακον sí gbolohun kedere nítorí pé kò sí ọ̀rọ̀ Yorùbá kan ṣoṣo tó gbajúmọ̀ tí yóò gbé gbogbo ìtumọ̀ rẹ̀.
