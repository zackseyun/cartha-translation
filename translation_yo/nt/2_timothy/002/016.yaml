revisions:
- from: Ṣùgbọ́n yẹra fún ọ̀rọ̀ asán aláìbọ̀wọ̀ fún Ọlọ́run[a], nítorí àwọn tí ń sọ ọ́ yóò túbọ̀ tẹ̀ síwájú nínú àìbọ̀wọ̀ fún Ọlọ́run.
  to: Ṣùgbọ́n yẹra fún ọ̀rọ̀ asán aláìbọ̀wọ̀ fún Ọlọ́run[a], nítorí wọn yóò túbọ̀ tẹ̀ síwájú nínú àìbọ̀wọ̀ fún Ọlọ́run.
  rationale: Àtúnṣe náà yọ ìdánimọ̀ “àwọn tí ń sọ ọ́” kúrò nínú ọ̀rọ̀ àkọ́kọ́, ó sì lo “wọ́n” láti pa àìdánilójú olùṣe tí ó wà nínú Gíríìkì mọ́. A pa ìtumọ̀ ‘profane empty talk,’ ìkìlọ̀ láti yẹra fún un, àti ìlọsíwájú sí àìbọ̀wọ̀ fún Ọlọ́run mọ́. A tún ṣe àtúnṣe kékeré sí àwọn àṣàyàn inú àkọsílẹ̀ ìsàlẹ̀ kí wọ́n lè jẹ́ Yorùbá àdánidá.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:50Z'
