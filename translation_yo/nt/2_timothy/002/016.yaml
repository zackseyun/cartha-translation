  verdict: revise
  source_fidelity: 'Ìtumọ̀ náà pa ìtumọ̀ pàtàkì àwọn ọ̀rọ̀ Gíríìkì mọ́: βεβήλους κενοφωνίας jẹ́ ọ̀rọ̀ asán tó ní ìhùwàsí àìmọ́/àìbọ̀wọ̀ sí Ọlọ́run; περιΐστασο jẹ́ àṣẹ láti yẹra fún un; ìlọsíwájú sí àìbọ̀wọ̀ fún Ọlọ́run sì mú ἐπὶ πλεῖον προκόψουσιν ἀσεβείας jáde dáadáa. Ṣùgbọ́n fífi “àwọn tí ń sọ ọ́” sínú ọ̀rọ̀ àkọ́kọ́ yan olùtọ́ka fún προκόψουσιν níbi tí Gíríìkì kò ti sọ ẹni náà ní kedere. Àkọsílẹ̀ ìsàlẹ̀ kò yẹ kí ó tún àìdánilójú tí àkọsílẹ̀ ọ̀rọ̀ fúnra rẹ̀ ti yọ kúrò.'
