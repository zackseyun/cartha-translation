id: 2TI.2.16
reference: 2 Timothy 2:16
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: yo
  text: Ṣùgbọ́n yẹra fún ọ̀rọ̀ asán aláìbọ̀wọ̀ fún Ọlọ́run[a], nítorí wọn yóò túbọ̀ tẹ̀ síwájú nínú àìbọ̀wọ̀ fún Ọlọ́run.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “ìsọ̀rọ̀ asán tí kò ní ọ̀wọ̀ fún Ọlọ́run,” “ìsọ̀rọ̀ asán,” tàbí “ọ̀rọ̀ òfo.” Nínú èdè Gíríìkì, ẹni tàbí ohun tí “wọ́n yóò túbọ̀ tẹ̀ síwájú” tọ́ka sí kò hàn gbangba; ó lè tọ́ka sí àwọn olùsọ̀rọ̀ tàbí sí àwọn ọ̀rọ̀ náà.
    reason: lexical_alternative_and_grammatical_ambiguity
lexical_decisions:
- source_word: βεβήλους
  choice: aláìbọ̀wọ̀ fún Ọlọ́run
  rationale: Ó mú ìtumọ̀ ohun tí kò jẹ́ mímọ́, tí kò sì ní ọ̀wọ̀ fún Ọlọ́run jáde ní Yorùbá òde òní, láìsọ ọ́ di ‘ti ayé’ lásán.
- source_word: κενοφωνίας
  choice: ọ̀rọ̀ asán
  rationale: Ó jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ọ̀rọ̀ tí kò ní èròjà tàbí ìníyelórí.
- source_word: περιΐστασο
  choice: yẹra fún
  rationale: Àṣẹ náà ń pe Tímótì láti máa sá fún irú ọ̀rọ̀ bẹ́ẹ̀, tàbí láti má ṣe dá sí i.
- source_word: ἐπὶ πλεῖον
  choice: túbọ̀
  rationale: Ó fi ìlọsíwájú sí ìwọ̀n tí ó pọ̀ ju ti tẹ́lẹ̀ hàn ní Yorùbá tí ó rọrùn.
- source_word: προκόψουσιν
  choice: yóò ... tẹ̀ síwájú
  rationale: Ó pa àwòrán ìlọsíwájú mọ́, bí ó tilẹ̀ jẹ́ pé ìlọsíwájú búburú ni níbí.
- source_word: ἀσεβείας
  choice: àìbọ̀wọ̀ fún Ọlọ́run
  rationale: Ó ṣàfihàn ìwà àìníọ̀wọ̀ àti àìfọkànsìn sí Ọlọ́run, kì í ṣe ìwà búburú gbogbogbòò nìkan.
- source_word: δὲ
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyípadà tó tako ìmọ̀ràn ẹsẹ tó ṣáájú hàn kedere.
theological_decisions:
- issue: Bóyá ọ̀rọ̀ tí a kìlọ̀ nípa rẹ̀ jẹ́ ọ̀rọ̀ tí kò wúlò lásán tàbí ọ̀rọ̀ tó tún ṣàìbọ̀wọ̀ fún Ọlọ́run
  choice: ọ̀rọ̀ asán aláìbọ̀wọ̀ fún Ọlọ́run
  alternative: ìsọ̀rọ̀ asán; ọ̀rọ̀ aláìnílọ́wọ́
  rationale: βεβήλους àti κενοφωνίας papọ̀ ń tọ́ka sí ọ̀rọ̀ tí kò ní èròjà, tí ó sì ní àbùkù ẹ̀sìn àti ìwà; a pa àwọn apá méjèèjì mọ́.
- issue: Ẹni tí ọ̀rọ̀-orúkọ ọ̀pọ̀ προκόψουσιν ń tọ́ka sí
  choice: àwọn tí ń sọ ọ́
  alternative: àwọn ọ̀rọ̀ náà
  rationale: Gíríìkì kò sọ ẹni tàbí ohun tí ó jẹ́ olùṣe kedere. Àlàyé yìí jẹ́ Yorùbá àdánidá, ṣùgbọ́n àkọsílẹ̀ ìsàlẹ̀ pa àìdánilójú inú orísun mọ́.
translation_notes:
  register: Yorùbá boṣewa, tó ní iyì ṣùgbọ́n tó ṣeé lóye fún òǹkàwé òde òní. A lo ‘aláìbọ̀wọ̀ fún Ọlọ́run’ láti pa agbára ẹ̀sìn βέβηλος/ἀσέβεια mọ́; a sì fi ‘túbọ̀ tẹ̀ síwájú’ mú ìlọsíwájú búburú inú προκόπτω hàn.
