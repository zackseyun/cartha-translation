base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/007.yaml
  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: yo
  text: Ronú lórí ohun tí mo ń sọ[a], nítorí Olúwa[b] yóò fún ọ ní òye nínú ohun gbogbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Ronú nípa ohun tí mo sọ”; ọ̀rọ̀-ìṣe náà tún lè ní ìtumọ̀ “lóye.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ Gíríìkì kò sọ ẹni tí “Olúwa” jẹ́ ní pàtó; àwọn atúmọ̀ kan gbà pé ó ń tọ́ka sí Olúwa Jésù ní pàtó, àwọn mìíràn sì gbà pé ó ń tọ́ka sí Ọlọ́run, láì sọ ẹni náà ní pàtó.
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: Ronú lórí
  rationale: Ọ̀rọ̀ ìṣe àṣẹ yìí ń pe Tímótì sí ríronú jinlẹ̀ lórí ohun tí Pọ́ọ̀lù sọ. “Ronú lórí” jẹ́ èdè Yorùbá àdánidá, ó sì fi àṣẹ náà hàn láì sọ ọ́ di pé ó ti ní òye náà tán.
- source_word: ὃ
  choice: ohun tí
  rationale: Ọ̀rọ̀ arọ́pò-orúkọ yìí ń tọ́ka sí àkóónú ọ̀rọ̀ Pọ́ọ̀lù; “ohun tí” ni ìtumọ̀ Yorùbá tó ṣe déédé jù.
- source_word: λέγω
  choice: mo ń sọ
  rationale: Àmì ìṣe ìsinsìnyí nínú Gíríìkì bá “mo ń sọ” mu, ó sì tọ́ka sí ìtọ́ni tó wà lọ́wọ́ ní àyíká ọ̀rọ̀ náà.
- source_word: γάρ
  choice: nítorí
  rationale: Ó so ìlérí tó tẹ̀ lé e mọ́ àṣẹ àkọ́kọ́ gẹ́gẹ́ bí ìdí tàbí ìpìlẹ̀ rẹ̀.
- source_word: δώσει
  choice: yóò fún
  rationale: Ìṣe ọjọ́ iwájú yìí sọ ìlérí kan ní tààrà; “yóò fún” jẹ́ ọ̀nà Yorùbá tó ṣe kedere.
- source_word: σοι
  choice: ọ
  rationale: Arọ́pò-orúkọ náà ni ẹni tí Olúwa yóò fún ní òye; “fún ọ” ni ìṣètò Yorùbá àdánidá.
- source_word: ὁ κύριος
  choice: Olúwa
  rationale: “Olúwa” pa àkọlé Gíríìkì mọ́ láì fi kún un pé Jésù tàbí Ọlọ́run ni pàtó.
- source_word: σύνεσιν
  choice: òye
  rationale: “Òye” ní èdè Yorùbá bo agbára láti lóye tàbí rí ìtumọ̀ ohun kan, ó sì bá àyíká ríronú lórí ẹ̀kọ́ mu.
- source_word: ἐν πᾶσιν
  choice: nínú ohun gbogbo
  rationale: Ìtumọ̀ yìí pa ìwọ̀n gbígbòòrò gbólóhùn Gíríìkì mọ́ láì dín in kù sí ẹ̀kọ́ ìgbàgbọ́ nìkan.
theological_decisions:
- issue: Ẹni tí “Olúwa” (ὁ κύριος) ń tọ́ka sí
  choice: Olúwa
  alternative: Olúwa Jésù; Ọlọ́run
  rationale: Gíríìkì kò sọ ẹni náà ní pàtó ju “Olúwa” lọ. Bó tilẹ̀ jẹ́ pé ọ̀rọ̀ yìí sábà máa ń tọ́ka sí Jésù nínú àwọn lẹ́tà Pọ́ọ̀lù, ìtumọ̀ náà kò gbọdọ̀ yanjú ohun tí ẹsẹ náà fi sílẹ̀ ní ṣíṣí.
translation_notes:
  register: A lo èdè Yorùbá boṣewa tó níyì, tó sì ṣe kedere fún òǹkàwé òde òní. “Ronú lórí” jẹ́ ọ̀rọ̀ àdánidá fún àṣẹ láti fi ọkàn sí ohun kan, “òye” sì jẹ́ ọ̀rọ̀ gbígbòòrò tí kò fi ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ kan pàtó kún orísun.
