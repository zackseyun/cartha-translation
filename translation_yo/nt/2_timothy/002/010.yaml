id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: yo
  text: Nítorí èyí ni mo ṣe ń fara da ohun gbogbo nítorí àwọn àyànfẹ́[a], kí àwọn náà lè gba ìgbàlà tí ó wà nínú Mèsáyà Jésù, pẹ̀lú ògo ayérayé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “àwọn tí a yàn.” Ọ̀rọ̀ Gíríìkì náà ni ἐκλεκτούς.
    reason: lexical_alternative
  - marker: b
    text: Ìtumọ̀ ìbílẹ̀ ni “Kristi Jésù.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Nítorí èyí ni
  rationale: Ó pa agbára ìdí tí gbólóhùn Gíríìkì ní mọ́, ó sì tọ́ka sí ohun tí a sọ ṣáájú.
- source_word: πάντα ὑπομένω
  choice: mo ṣe ń fara da ohun gbogbo
  rationale: “Fara da” jẹ́ ọ̀nà Yorùbá àdánidá láti sọ ìfaradà tí ó dúró ṣinṣin lábẹ́ ìnira; “ohun gbogbo” sì pa ìtumọ̀ gbogbo-gbòò πάντα mọ́.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: nítorí àwọn àyànfẹ́
  rationale: διά pẹ̀lú accusative níbí fi hàn pé Pọ́ọ̀lù ń fara da ìyà fún àǹfààní wọn. “Àwọn àyànfẹ́” pa èdè yíyan tí ἐκλεκτούς ní mọ́ láìfi èrò ẹ̀kọ́ ìjọ kan kún un.
- source_word: ἵνα καὶ αὐτοὶ
  choice: kí àwọn náà lè
  rationale: “Kí ... lè” ṣàfihàn ète ἵνα, “àwọn náà” sì pa agbára àfikún καὶ αὐτοὶ mọ́.
- source_word: σωτηρίας τύχωσιν
  choice: lè rí ìgbàlà ... gbà
  rationale: Ọ̀rọ̀ Yorùbá “rí ... gbà” jẹ́ àdánidá fún gbígba tàbí níní ohun kan, ó sì bá ìtumọ̀ τυγχάνω pẹ̀lú genitive mu.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: tí ó wà nínú Mèsáyà Jesu
  rationale: Ó jẹ́ kí gbolohun prepositional náà ṣàlàyé “ìgbàlà,” ó sì pa èdè Pọ́ọ̀lù ti “nínú” ẹni kan mọ́. “Mèsáyà” mú ìtumọ̀ oyè Χριστός jáde.
- source_word: μετὰ δόξης αἰωνίου
  choice: pẹ̀lú ògo ayérayé
  rationale: “Pẹ̀lú” bá μετά pẹ̀lú genitive mu gẹ́gẹ́ bí ìbáṣepọ̀ tàbí ohun tí ó bá ìgbàlà lọ; “ayérayé” sì ṣàfihàn αἰωνίου.
theological_decisions:
- issue: Bí a ṣe túmọ̀ ἐκλεκτούς
  choice: àwọn àyànfẹ́
  alternative: àwọn tí a yàn
  rationale: Àṣàyàn àkọ́kọ́ pa fọ́ọ̀mù ọ̀rọ̀ ìdìbò/yíyan tí ó ní ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ mọ́, ṣùgbọ́n àlàyé ìsàlẹ̀ fúnni ní ọ̀nà Yorùbá míì tí kò pinnu ẹni tó yàn tàbí ọ̀nà yíyan náà.
- issue: Bí a ṣe túmọ̀ Χριστῷ gẹ́gẹ́ bí oyè tàbí orúkọ
  choice: Mèsáyà Jesu
  alternative: Kristi Jesu
  rationale: Χριστός ṣì ní ìtumọ̀ oyè ẹni àmìòróró níbí; “Mèsáyà” mú ìtumọ̀ náà hàn, nígbà tí àlàyé ìsàlẹ̀ pa ìtumọ̀ ìbílẹ̀ mọ́.
- issue: Ìbáṣepọ̀ μετὰ δόξης αἰωνίου pẹ̀lú ìgbàlà
  choice: pẹ̀lú ògo ayérayé
  alternative: ìgbàlà ... tí ògo ayérayé bá tẹ̀ lé
  rationale: A kò fi ìtumọ̀ tí ó pọ̀ ju Gíríìkì lọ sínú ọ̀rọ̀ náà. Fífì àmì dá gbólóhùn náà dúró jẹ́ kí ó hàn pé ògo ayérayé bá gbígba ìgbàlà lọ, láìpinnu ju bó ṣe yẹ lọ bóyá ó ṣàlàyé “ìgbàlà” tàbí gbogbo ìṣe gbígbà rẹ̀.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti jẹ́ àdánidá. Ìforúkọsílẹ̀ náà ní iyì ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní; “fara da,” “rí ... gbà,” àti “pẹ̀lú” jẹ́ ọ̀rọ̀ àdánidá, nígbà tí “àwọn àyànfẹ́” àti “Mèsáyà” pa ìwọ̀n ẹ̀kọ́ ìgbàgbọ́ orísun mọ́.
