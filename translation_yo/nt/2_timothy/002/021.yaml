id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: yo
  text: Nítorí náà, bí ẹnikẹ́ni bá wẹ ara rẹ̀ mọ́ kúrò nínú àwọn wọ̀nyí, yóò jẹ́ ohun èlò fún ọlá[a], tí a ti sọ di mímọ́[b], tí ó wúlò fún Ọ̀gá, tí a sì ti múra sílẹ̀ fún gbogbo iṣẹ́ rere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí “fún lílò ọlọ́lá.”
    reason: lexical_alternative
  - marker: b
    text: Tàbí “tí a ti sọ di ẹni mímọ́” tàbí “tí a ti yà sọ́tọ̀.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Nítorí náà, bí ... bá
  rationale: “Nítorí náà” pa ìtumọ̀ ìyọrísí οὖν mọ́, “bí ... bá” sì fi ipò àídájú ἐὰν hàn ní Yorùbá àdánidá.
- source_word: τις
  choice: ẹnikẹ́ni
  rationale: Ọ̀rọ̀ náà ń tọ́ka sí ẹnikẹ́ni lápapọ̀, láìfi akọ tàbí abo kan pàtó sí i.
- source_word: ἐκκαθάρῃ ἑαυτὸν
  choice: wẹ ara rẹ̀ mọ́
  rationale: Ó sọ ìwẹ̀nùmọ́ ẹni fúnra rẹ̀ ní ọ̀nà tí ó ṣe kedere, ó sì pa ìtumọ̀ arọ́pò-orúkọ afẹ́hìntì mọ́.
- source_word: ἀπὸ τούτων
  choice: kúrò nínú àwọn wọ̀nyí
  rationale: Yíyan “àwọn wọ̀nyí” pa ìtọ́kasí ọ̀rọ̀ Gíríìkì mọ́ láìfi tipátipá pinnu bóyá àwọn ènìyàn tàbí àwọn ohun tí a mẹ́nu kàn ṣáájú ni.
- source_word: σκεῦος
  choice: ohun èlò
  rationale: “Ohun èlò” bá àkàwé àwọn ohun inú ilé mu, ó sì lè túmọ̀ sí ohun tí olówó ilé ń lò fún ète kan.
- source_word: εἰς τιμήν
  choice: fún ọlá
  rationale: Èyí pa ìtumọ̀ gidi àti ìyàtọ̀ sí ohun èlò àìlọ́lá nínú ẹsẹ tó ṣáájú mọ́; a fi ìtumọ̀ àlàyé sí àlàyé ìsàlẹ̀.
- source_word: ἡγιασμένον
  choice: tí a ti sọ di mímọ́
  rationale: Ó fi ipò tí ó jẹ́ àbájáde iṣẹ́ ìsọdimímọ́ hàn, gẹ́gẹ́ bí àkókò pípé aláìṣe Gíríìkì ṣe tọ́ka sí.
- source_word: εὔχρηστον
  choice: tí ó wúlò
  rationale: Èyí jẹ́ ọ̀nà Yorùbá tó ṣe kedere fún ohun tí ó yẹ fún lílò tàbí iṣẹ́.
- source_word: τῷ δεσπότῃ
  choice: fún Ọ̀gá
  rationale: “Ọ̀gá” pa àṣẹ ẹni tó ni ilé mọ́ nínú àkàwé náà; lẹ́tà ńlá fi hàn pé Ọlọ́run ni ìtọ́kasí tó ṣeé ṣe jù láìyí ọ̀rọ̀ náà sí oyè ẹ̀kọ́ ìgbàgbọ́ mìíràn.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: tí a sì ti múra sílẹ̀ fún gbogbo iṣẹ́ rere
  rationale: Ó pa ìtumọ̀ ìmúrasílẹ̀ àti fífẹ̀ “gbogbo iṣẹ́ rere” mọ́ ní Yorùbá tó ṣe déédé.
theological_decisions:
- issue: Ìtọ́kasí ἀπὸ τούτων
  choice: àwọn wọ̀nyí
  alternative: àwọn nǹkan wọ̀nyí
  rationale: Ọ̀rọ̀ Gíríìkì lè tọ́ka sí ohun tàbí àwọn ẹni/nǹkan inú àyíká ọ̀rọ̀. “Àwọn wọ̀nyí” pa àìdájú yẹn mọ́ dípò fífi “nǹkan” pinnu rẹ̀.
- issue: Ìtumọ̀ ἡγιασμένον
  choice: tí a ti sọ di mímọ́
  alternative: tí a ti yà sọ́tọ̀
  rationale: Ìtumọ̀ àkọ́kọ́ pa èdè ìsọdimímọ́ mọ́, nígbà tí àlàyé ìsàlẹ̀ jẹ́ kí ìtumọ̀ yíyàsọ́tọ̀ fún ète pàtó hàn.
- issue: Ìtumọ̀ δεσπότης nínú àkàwé ilé
  choice: Ọ̀gá
  alternative: olówó ilé; Olúwa
  rationale: “Ọ̀gá” fi ìbáṣepọ̀ àṣẹ nínú àkàwé hàn láìsọ pé oyè Kristi pàtó ni ọ̀rọ̀ náà níbí, bí ó tilẹ̀ jẹ́ pé Ọlọ́run ni ìtọ́kasí rẹ̀ nínú àyíká ọ̀rọ̀.
translation_notes:
  register: Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn. A lo “ohun èlò” láti pa àkàwé ohun inú ilé mọ́, a sì lo “àwọn wọ̀nyí” láti má ṣe fòpin sí àìdájú ìtọ́kasí inú Gíríìkì. Gbogbo àmì ohùn ni a fi síbi tí ó bá yẹ.
