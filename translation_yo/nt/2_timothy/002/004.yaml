  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: yo
  text: Kò sí ẹni tí ń ṣe iṣẹ́ ológun tí ń dí ara rẹ̀ mọ́ àwọn ọ̀ràn ìgbésí ayé lójoojúmọ́,[a] kí ó lè wu ẹni tí ó gba a sí iṣẹ́ ológun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn ìgbòkègbodò ará ìlú.” Ọ̀rọ̀ Gíríìkì náà fi iṣẹ́ ológun wé àwọn ọ̀ràn ìgbésí ayé lójoojúmọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: Kò sí ẹni
  rationale: Ó pa agbára ọ̀rọ̀ arọ́pò-orúkọ òdì tí ó túmọ̀ sí ‘kò sí ẹnikẹ́ni’ mọ́, ó sì jẹ́ Yorùbá àdánidá láì fi akọ tàbí abo kún un.
- source_word: στρατευόμενος
  choice: tí ń ṣiṣẹ́ bí ọmọ ogun
  rationale: Ó fi hàn pé ẹni náà ń ṣe iṣẹ́ ológun lọ́wọ́, gẹ́gẹ́ bí àkókò ìṣe tí participle Gíríìkì náà fi hàn.
- source_word: ἐμπλέκεται
  choice: tí ó máa ń fi ara rẹ̀ wọ ... débi pé wọn á dè é mọ́lẹ̀
  rationale: Ọ̀rọ̀ náà ní àwòrán jíjẹ́ kí ohun kan dì mọ́ni tàbí dí ẹni lọ́wọ́; ìtumọ̀ yìí pa àwòrán náà mọ́ ní Yorùbá tó ṣe kedere.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: àwọn iṣẹ́ ìgbésí ayé ojoojúmọ́
  rationale: πραγματείαις lè tọ́ka sí àwọn iṣẹ́, ọ̀ràn, tàbí ìdáwọ́lé, βίος sì ń tọ́ka sí ìgbésí ayé ayé ojoojúmọ́; gbolohun yìí pa ìyàtọ̀ rẹ̀ sí iṣẹ́ ológun mọ́ láì dín un kù sí òwò nìkan.
- source_word: ἵνα
  choice: kí ó lè
  rationale: Ó fi ète tàbí ìdí ìṣe náà hàn ní Yorùbá àdánidá.
- source_word: τῷ στρατολογήσαντι
  choice: ẹni tí ó kó o wọṣẹ́ ọmọ ogun
  rationale: Ó tú participle aorist náà sí ẹni tí ó gba tàbí kó ọmọ ogun wọṣẹ́, láì fi ipò ológun pàtó kan kún ọ̀rọ̀ Gíríìkì.
- source_word: ἀρέσῃ
  choice: ó lè wu
  rationale: 'Ó pa ìtumọ̀ ète náà mọ́: kí ìṣe ọmọ ogun náà lè mú inú ẹni tó kó o wọṣẹ́ dùn.'
theological_decisions:
- issue: Ìwọ̀n àkàwé ológun
  choice: Pa àwòrán ọmọ ogun tí kò jẹ́ kí àwọn iṣẹ́ ìgbésí ayé ojoojúmọ́ dè é mọ́lẹ̀ mọ́.
  alternative: Ṣàlàyé rẹ̀ tààrà gẹ́gẹ́ bí ìkìlọ̀ fún òjíṣẹ́ Ọlọ́run pé kó má ṣe ní àwọn ohun mìíràn ní àkọ́kọ́.
  rationale: Ẹsẹ náà fúnra rẹ̀ lo àkàwé ológun; ìtumọ̀ kò gbọ́dọ̀ yára rọ́pò àwòrán náà pẹ̀lú ìlò rẹ̀ nínú iṣẹ́ ìránṣẹ́.
translation_notes:
  register: Yorùbá ìgbàlódé tó ní iyì ni a lò, pẹ̀lú àmì ohùn níbi tó yẹ. ‘Kó o wọṣẹ́ ọmọ ogun’ jẹ́ ọ̀nà tó ṣe kedere fún ìkójọ wọ iṣẹ́ ológun, láì dá ipò bíi ọ̀gá ológun sílẹ̀.
