  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: yo
  text: Kópa nínú ìjìyà gẹ́gẹ́ bí ọmọ-ogun rere ti Mèsáyà Jésù[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ pé, “Bá mi fara da ìnira gẹ́gẹ́ bí ọmọ-ogun rere ti Mèsáyà Jésù.”
    reason: lexical_alternative
  - marker: b
    text: Ọ̀rọ̀ náà ní èdè Gíríìkì ni Χριστοῦ Ἰησοῦ, tí a lè túmọ̀ sí “Kristi Jésù”; a lo “Mèsáyà Jésù” níbí nítorí Χριστός jẹ́ oyè.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: Kópa nínú ìjìyà
  rationale: Ọ̀rọ̀-ìṣe àṣẹ náà ní ìtumọ̀ pé kí Tímótì bá àwọn ẹlòmíràn ní ìpín nínú ìjìyà. ‘Kópa nínú ìjìyà’ pa ìtumọ̀ àjọpín mọ́ láìfi ‘pẹ̀lú mi’ kún un, nítorí kò sí ọ̀rọ̀ arọ́pò-orúkọ bẹ́ẹ̀ ní gbólóhùn Gíríìkì yìí.
- source_word: ὡς
  choice: gẹ́gẹ́ bí
  rationale: Ó ṣe àfihàn ìfiwéra tàbí ọ̀nà tí ó yẹ kí Tímótì gbà kópa nínú ìjìyà.
- source_word: καλὸς
  choice: rere
  rationale: Nínú àkójọpọ̀ yìí, ó ń tọ́ka sí ọmọ-ogun tí ó yẹ, tí ó sì dára ní ojú iṣẹ́ rẹ̀; ‘rere’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí kò mú ìtumọ̀ kọjá ohun tí Gíríìkì sọ.
- source_word: στρατιώτης
  choice: ọmọ-ogun
  rationale: Èyí ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ọmọ-ogun, ó sì bá àpèjúwe ológun inú ẹsẹ náà mu.
- source_word: Χριστοῦ
  choice: Mèsáyà
  rationale: Χριστός ń ṣiṣẹ́ gẹ́gẹ́ bí oyè níbí. ‘Mèsáyà’ túmọ̀ oyè náà dípò lílo ‘Kristi’ bí ẹni pé ó jẹ́ apá kan orúkọ.
- source_word: Ἰησοῦ
  choice: Jésù
  rationale: Ìkọ̀wé orúkọ Ἰησοῦς ní Yorùbá tí ó ti fìdí múlẹ̀ ni ‘Jésù’.
theological_decisions:
- issue: Bí a ṣe túmọ̀ Χριστοῦ Ἰησοῦ
  choice: Mèsáyà Jésù
  alternative: Kristi Jésù
  rationale: Gbólóhùn náà ní oyè Χριστός àti orúkọ ẹni Ἰησοῦς. ‘Mèsáyà Jésù’ mú ìtumọ̀ oyè náà hàn, nígbà tí àṣàyàn ‘Kristi Jésù’ jẹ́ èyí tí ó ti wọ́pọ̀ nínú èdè ìjọ.
- issue: Ẹni tí Tímótì bá jìyà
  choice: A kò sọ ‘pẹ̀lú mi’ ní pàtó nínú ọ̀rọ̀ pàtàkì
  alternative: Bá mi fara da ìnira
  rationale: Àfikún συν- nínú συγκακοπάθησον fi ìkópa papọ̀ hàn, ṣùgbọ́n kò sọ ẹni tí a bá ṣe é ní pàtó. Nítorí náà, ọ̀rọ̀ pàtàkì pa àìṣedéédé yìí mọ́; àlàyé ẹsẹ̀ fi àṣàyàn tí ó bá àyíká ọ̀rọ̀ mu hàn.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá àpapọ̀, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé òde òní. ‘Kópa nínú ìjìyà’ jẹ́ àdánidá ju ìtumọ̀ ọ̀rọ̀-fún-ọ̀rọ̀ lọ, ṣùgbọ́n ó pa agbára àṣẹ àti ìtumọ̀ àjọpín inú Gíríìkì mọ́. A lo àmì ohùn ní kíkún níbi tí ó bá yẹ.
