id: 2TI.2.20
reference: 2 Timothy 2:20
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: yo
  text: Nínú ilé ńlá kan, kì í ṣe àwọn ohun èlò wúrà àti fàdákà nìkan ló wà, àwọn ohun èlò igi àti amọ̀ tí a sun[a] sì tún wà; àwọn kan wà fún ọlá, àwọn mìíràn sì wà fún àìlọ́lá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Amọ̀ tí a sun’ túmọ̀ sí ohun èlò tí a fi amọ̀ ṣe, tí a sì sun un bí ìkòkò.
    reason: cultural_note
  - marker: b
    text: A tún lè túmọ̀ ọ́ sí, ‘a ń lo àwọn kan fún ohun ọlọ́lá, a sì ń lo àwọn mìíràn fún ohun àìlọ́lá.’ Gíríìkì sọ ní tààràtà pé, ‘fún ọlá ... fún àìlọ́lá.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: ilé ńlá kan
  rationale: Ó sọ nípa ilé tí ó tóbi; ‘ilé ńlá kan’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá, ó sì pa àwòrán inú ẹsẹ náà mọ́.
- source_word: σκεύη
  choice: àwọn ohun èlò
  rationale: Ọ̀rọ̀ Gíríìkì náà gbòòrò, ó lè tọ́ka sí ohun èlò tàbí ohun ìkóhun sí; ‘àwọn ohun èlò’ kò fi ìtumọ̀ náà sínú irú ohun kan ṣoṣo.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: ohun èlò wúrà àti fàdákà
  rationale: Àwọn ajẹtífù náà ń sọ ohun tí a fi ṣe àwọn ohun èlò; ìtumọ̀ yìí ṣe kedere, ó sì bá ọ̀nà tí Yorùbá gbà ń sọ irú àkójọ bẹ́ẹ̀ mu.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: ohun èlò igi àti amọ̀ tí a sun
  rationale: ξύλινα túmọ̀ sí ohun tí a fi igi ṣe, ὀστράκινα sì jẹ́ ohun tí a fi amọ̀ tí a sun ṣe. Ọ̀rọ̀ yìí ṣe kedere ju lílo ọ̀rọ̀ àjèjì fún earthenware lọ.
- source_word: ἃ μὲν ... ἃ δὲ ...
  choice: àwọn kan ... àwọn mìíràn sì ...
  rationale: Ìṣọ̀kan ọ̀rọ̀ yìí ya ẹgbẹ́ méjì sọ́tọ̀ ní ìfiwéra, èyí tí ìkọ́lé Yorùbá náà mú jáde ní kedere.
- source_word: εἰς τιμήν
  choice: fún ọlá
  rationale: Ó pa orúkọ àfojúrí τιμή (‘ọlá’) mọ́, dípò kíkún un lẹ́sẹ̀kẹsẹ̀ sí ‘fún ìlò ọlọ́lá.’
- source_word: εἰς ἀτιμίαν
  choice: fún àìlọ́lá
  rationale: Ó pa ìtakora pẹ̀lú ‘ọlá’ mọ́, kò sì sọ àwòrán náà di ‘ìlò lásán’ tàbí ‘ìlò ojoojúmọ́.’
- source_word: δὲ (initial)
  choice: sì
  rationale: ‘Sì’ ń jẹ́ kí gbólóhùn náà tẹ̀ síwájú láti inú ọ̀rọ̀ tó ṣáájú, láì sọ ọ́ di ìtakora líle tí ‘ṣùgbọ́n’ lè mú wá.
theological_decisions:
- issue: Bóyá kí τιμή/ἀτιμία túmọ̀ sí iṣẹ́ àwọn ohun èlò (‘ìlò ọlọ́lá/ìlò àìlọ́lá’) tàbí kí a pa ọ̀rọ̀ àfojúrí ‘ọlá/àìlọ́lá’ mọ́
  choice: fún ọlá ... fún àìlọ́lá
  alternative: fún ìlò ọlọ́lá ... fún ìlò àìlọ́lá
  rationale: Gíríìkì lo àwọn orúkọ àfojúrí τιμή àti ἀτιμία. Dídá wọn sí ‘ọlá’ àti ‘àìlọ́lá’ pa àìdánilójú àwòrán náà àti ìfọkànsìn ẹ̀kọ́ rẹ̀ fún ẹsẹ tó tẹ̀ lé e mọ́, dípò ṣíṣe àlàyé iṣẹ́ wọn sínú ọ̀rọ̀ pàtàkì.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti èdè ọlọ́wọ̀, òde òní tí gbogbo ènìyàn lè lóye. Ìtumọ̀ náà pa àwòrán ilé àti àwọn ohun èlò mọ́, kò sì fi ẹ̀kọ́ ìjọ kan pàtó kún un.
