  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ⸀ἀρνήσασθαι ἑαυτὸν οὐ δύναται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: yo
  text: Bí àwa bá jẹ́ aláìṣòótọ́[a], òun ṣì jẹ́ olóòótọ́[b], nítorí kò lè sẹ́ ara rẹ̀.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “Bí àwa kò bá gbàgbọ́,” tàbí “Bí àwa kò bá dúró ṣinṣin nínú ìgbàgbọ́.” Ọ̀rọ̀-ìṣe Gíríìkì náà lè ní àwọn ìtumọ̀ wọ̀nyí.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, “ẹni tí a lè gbẹ́kẹ̀ lé.” A lo “olóòótọ́” láti pa ìtakora rẹ̀ pẹ̀lú “aláìṣòótọ́” mọ́.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: kò bá ní ìgbàgbọ́
  rationale: Gbólóhùn yìí lè túmọ̀ sí pé a kò gbàgbọ́ tàbí pé a kò dúró ṣinṣin nínú òtítọ́; ‘kò ní ìgbàgbọ́’ jẹ́ ọ̀nà àdánidá ní Yorùbá tí ó fi àyè sílẹ̀ fún ìtumọ̀ méjèèjì, nígbà tí àlàyé ìsàlẹ̀ sọ àìdánilójú ọ̀rọ̀ Gíríìkì náà.
- source_word: πιστὸς
  choice: olóòótọ́
  rationale: ‘Olóòótọ́’ sọ ìdúróṣinṣin àti jíjẹ́ ẹni tí a lè gbẹ́kẹ̀ lé, ó sì pa ìtakora pẹ̀lú àìní ìgbàgbọ́ mọ́ bí ó ti ṣeé ṣe ní Yorùbá.
- source_word: μένει
  choice: ṣì jẹ́
  rationale: Ní ìsopọ̀ pẹ̀lú ‘olóòótọ́,’ èyí jẹ́ Yorùbá àdánidá fún pé ó ń bá a lọ láti jẹ́ bẹ́ẹ̀, tàbí pé ó dúró bẹ́ẹ̀.
- source_word: ἀρνήσασθαι
  choice: sẹ́
  rationale: ‘Sẹ́’ jẹ́ ìtumọ̀ tààrà tí ó wọ́pọ̀ fún kí ẹnì kan kọ̀ tàbí má ṣe jẹ́wọ́ ẹni kan; nínú àyíká yìí, ó pa agbára ìbáṣepọ̀ àti ìwà rere ọ̀rọ̀ náà mọ́.
- source_word: ἑαυτὸν
  choice: ara rẹ̀
  rationale: Èyí ni ọ̀nà Yorùbá tí ó ṣe kedere fún arọ́pò-orúkọ afarahẹ, ó sì fi hàn pé ìdúróṣinṣin rẹ̀ dá lórí ẹni tí òun fúnra rẹ̀ jẹ́.
- source_word: οὐ δύναται
  choice: kò lè
  rationale: ‘Kò lè’ jẹ́ ọ̀nà ṣókí, àdánidá, tí ó sì sọ àìlè ṣe, kì í ṣe àìfẹ́ láti ṣe nìkan.
theological_decisions:
- issue: Ìtumọ̀ ìdúróṣinṣin Ọlọ́run níwájú àìní ìgbàgbọ́ ènìyàn
  choice: Ẹsẹ náà sọ pé ó ń bá a lọ ní jíjẹ́ olóòótọ́ nítorí kò lè sẹ́ ara rẹ̀, láì sọ bóyá ìṣòtítọ́ yìí dojú kọ ìgbàlà, pípa ìlérí mọ́, tàbí ìdájọ́ ní pàtàkì.
  alternative: A lè ka a sí ìṣòtítọ́ rẹ̀ láti gba àwọn ènìyàn rẹ̀ là láìka àìlera wọn sí, tàbí ìṣòtítọ́ sí ọ̀rọ̀ rẹ̀, títí kan ìkìlọ̀ nípa ìdájọ́ àwọn tí ó kọ ìgbàgbọ́ sílẹ̀.
  rationale: Ọ̀rọ̀ Gíríìkì fìdí ìdúróṣinṣin rẹ̀ múlẹ̀, ṣùgbọ́n kò yanjú àbájáde ìmọ̀-ẹ̀kọ́ tàbí ti olùṣọ́-àgùntàn; ìtumọ̀ náà pa ìfọ̀rọ̀wérọ̀ yìí mọ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó ti yẹ; èdè náà jẹ́ kedere, ọlọ́lá, àti àdánidá fún òǹkàwé òde òní. A lo ‘òun’ láti tẹnumọ́ ìtakora tó wà nínú ἐκεῖνος.
