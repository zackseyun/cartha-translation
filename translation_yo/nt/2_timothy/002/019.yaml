id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: yo
  text: 'Ṣùgbọ́n ìpìlẹ̀ Ọlọ́run tí ó fẹsẹ̀ múlẹ̀ dúró ṣinṣin, tí ó ní èdìdì yìí: “Olúwa mọ àwọn tí í ṣe tirẹ̀,” àti pé, “Kí gbogbo ẹni tí ó ń pe orúkọ Olúwa[a] yà kúrò nínú àìṣòdodo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “tí ó ń ké pè Olúwa,” tàbí “tí ó ń jẹ́wọ́ ìfaramọ́ sí Olúwa.” Gíríìkì ní ní tààrà, “tí ó ń dárúkọ orúkọ Olúwa,” èyí sì jẹ́ ìdíọ́mù tí ó lè tọ́ka sí kíké pè é tàbí jíjẹ́wọ́ ìfaramọ́ sí i.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: Ṣùgbọ́n
  rationale: Ó fi ìyàtọ̀ alágbára hàn sí ọ̀rọ̀ ẹ̀kọ́ èké tí ó ṣáájú, ní ọ̀nà tí ó bá Yorùbá àdánidá mu.
- source_word: στερεὸς θεμέλιος τοῦ θεοῦ
  choice: ìpìlẹ̀ Ọlọ́run tí ó fẹsẹ̀ múlẹ̀
  rationale: Ó pa àwòrán ìpìlẹ̀ àti ìtumọ̀ ìdúróṣinṣin mọ́; ìbátan genitive náà kò fi tipátipá pinnu bóyá ó túmọ̀ sí ohun tí Ọlọ́run ni, ohun tí ó ti ọ̀dọ̀ rẹ̀ wá, tàbí ohun tí ó jẹ́ ti ìwà rẹ̀.
- source_word: ἕστηκεν
  choice: dúró ṣinṣin
  rationale: Perfect náà ń tọ́ka sí ipò tí ó ti fìdí múlẹ̀ tí ó sì ń bá a lọ; gbólóhùn yìí jẹ́ Yorùbá àdánidá fún ìtumọ̀ náà.
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: ó sì ní èdìdì yìí lára
  rationale: Ó pa àwòrán èdìdì ìdánimọ̀ tàbí ìfìdí-múlẹ̀ mọ́, ó sì ṣàlàyé ní ti ẹ̀dá pé èdìdì náà wà lára ìpìlẹ̀.
- source_word: Ἔγνω κύριος
  choice: Olúwa mọ
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Gíríìkì jẹ́ aorist, àyọlò yìí ní agbára òtítọ́ tí ó dúró; present Yorùbá sọ ìmọ̀ Olúwa tí kò yí padà ní kedere.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: àwọn tí í ṣe tirẹ̀
  rationale: Ó sọ ìní àti ìdánimọ̀ wọn gẹ́gẹ́ bí àwọn tirẹ̀ ní ọ̀nà Yorùbá tí ó mọ́gbọ́n dání.
- source_word: Ἀποστήτω ἀπὸ ἀδικίας
  choice: Kí ... yà kúrò nínú àìṣòdodo
  rationale: Ìlànà aorist náà ń béèrè ìyapa tí ó pinnu; “yà kúrò” mú agbára ìlànà náà jáde, “àìṣòdodo” sì pa ìwọ̀n ìtumọ̀ ìwà búburú àti ohun tí kò tọ́ mọ́.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: gbogbo ẹni tí ó ń pe orúkọ Olúwa
  rationale: Ó pa àtúnṣe ọ̀rọ̀ “orúkọ” inú Gíríìkì mọ́ ní Yorùbá tí ó ṣì ṣeé lóye; ó lè túmọ̀ sí pípè Olúwa tàbí jíjẹ́wọ́ ìfaramọ́ sí i.
theological_decisions:
- issue: Ẹni tí “Olúwa” ń tọ́ka sí nínú àwọn gbólóhùn èdìdì méjèèjì
  choice: A tú κύριος ní “Olúwa” ní ibi méjèèjì láì sọ ní pàtó bóyá Baba ni tàbí Kristi.
  alternative: Kí a túmọ̀ méjèèjì sí Ọlọ́run Baba, sí Kristi, tàbí kí a yà ẹni tí ọ̀kọ̀ọ̀kan ń tọ́ka sí sọ́tọ̀.
  rationale: Gíríìkì kò ṣàlàyé ẹni tí κύριος ń tọ́ka sí ní pàtó. Ó ń lo èdè Ìwé Mímọ́ nínú àyíká Kristẹni, nítorí náà ó yẹ kí ìtumọ̀ pa ìjìnlẹ̀ àti àìdánilójú tó wà nínú ọ̀rọ̀ náà mọ́.
translation_notes:
  register: Yorùbá boṣewa, ọlọ́wọ̀ àti òde òní ni a lò, pẹ̀lú àmì ohùn níbi tí ó bá jẹ́ àdánidá. “Èdìdì” pa àwòrán orísun mọ́; gbólóhùn “ní ... lára” jẹ́ kí àwòrán náà ṣe kedere fún òǹkàwé Yorùbá. A kò fi àlàyé ẹ̀kọ́ ìsìn kan sínú ọ̀rọ̀ náà.
