  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: yo
  text: Àti àwọn ohun tí o gbọ́ lọ́dọ̀ mi níwájú ọ̀pọ̀ ẹlẹ́rìí[a], fi àwọn nǹkan wọ̀nyí lé àwọn ọkùnrin tí a lè gbẹ́kẹ̀lé lọ́wọ́[b], àwọn tí yóò ní agbára láti tún kọ́ àwọn ẹlòmíràn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “ní ojú ọ̀pọ̀ ẹlẹ́rìí.” Ó ṣeé ṣe jù pé gbolohun Gíríìkì náà ń tẹnu mọ́ pé Pọ́ọ̀lù kọ́ni ní gbangba níbi tí ọ̀pọ̀ ẹlẹ́rìí wà; bó tilẹ̀ jẹ́ pé ó tún lè túmọ̀ sí “nípasẹ̀ ọ̀pọ̀ ẹlẹ́rìí.”
    reason: lexical_alternative
  - marker: b
    text: 'Ọ̀rọ̀ Gíríìkì náà jẹ́ akọ púpọ̀: “àwọn ọkùnrin adúróṣinṣin” tàbí “àwọn ọkùnrin tí a lè gbẹ́kẹ̀lé.” Fọ́ọ̀mù akọ náà lè dúró fún ènìyàn lápapọ̀; nítorí náà, a tún lè túmọ̀ rẹ̀ sí “àwọn ènìyàn tí a lè gbẹ́kẹ̀lé.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ ἤκουσας παρ’ ἐμοῦ
  choice: ohun tí o gbọ́ lọ́dọ̀ mi
  rationale: Ó sọ ní ti ẹ̀kọ́ tí Tímótì gbọ́ láti ọ̀dọ̀ Pọ́ọ̀lù; ọ̀rọ̀ yìí jẹ́ ti àdánidá ní Yorùbá, ó sì pa ìtumọ̀ orísun mọ́.
- source_word: διὰ πολλῶν μαρτύρων
  choice: níwájú ọ̀pọ̀ ẹlẹ́rìí
  rationale: Nínú àyíká yìí, ó ṣeé ṣe jù pé gbolohun náà túmọ̀ sí pé ọ̀pọ̀ ẹlẹ́rìí wà níbẹ̀ nígbà tí Pọ́ọ̀lù ń kọ́ni; àlàyé ìtumọ̀ mìíràn wà nínú àlàyé ìsàlẹ̀.
- source_word: ταῦτα
  choice: àwọn nǹkan wọ̀nyí
  rationale: Ó tọ́ka padà sí gbogbo ohun tí Tímótì gbọ́, ó sì pa agbára ọ̀rọ̀ atọ́ka Gíríìkì mọ́.
- source_word: παράθου
  choice: fi ... lé ... lọ́wọ́
  rationale: Àṣẹ náà ni pé kí Tímótì gbé ẹ̀kọ́ náà lé àwọn ẹlòmíràn lọ́wọ́ gẹ́gẹ́ bí ohun iyebíye tí wọn yóò máa tọ́jú, tí wọn yóò sì máa tan ká.
- source_word: πιστοῖς ἀνθρώποις
  choice: àwọn ọkùnrin olóòtítọ́
  rationale: “Olóòtítọ́” lè sọ ìgbẹ́kẹ̀lé àti ìdúróṣinṣin; “àwọn ọkùnrin” pa fọ́ọ̀mù akọ púpọ̀ ti Gíríìkì mọ́, nígbà tí àlàyé ìsàlẹ̀ jẹ́wọ́ pé ó lè dúró fún ènìyàn lápapọ̀.
- source_word: ἱκανοὶ ἔσονται
  choice: yóò sì tóótun
  rationale: Ó fi ìgbà ọjọ́ iwájú àti agbára tàbí ìmúrasílẹ̀ tó pé fún iṣẹ́ kíkọ́ni hàn.
- source_word: ἑτέρους διδάξαι
  choice: láti kọ́ àwọn ẹlòmíràn
  rationale: Ìtumọ̀ tààrà àti ti àdánidá ni fún fífi ẹ̀kọ́ náà kọ́ àwọn mìíràn.
theological_decisions:
- issue: Bí a ṣe túmọ̀ πιστοῖς ἀνθρώποις nípa akọ tàbí gbogbo ènìyàn
  choice: àwọn ọkùnrin olóòtítọ́
  alternative: àwọn ènìyàn olóòtítọ́
  rationale: Gíríìkì lo fọ́ọ̀mù akọ púpọ̀, ṣùgbọ́n ἄνθρωπος tún lè jẹ́ aṣojú gbogbo ènìyàn. Ọ̀rọ̀ inú ẹsẹ̀ pa fọ́ọ̀mù orísun mọ́, àlàyé ìsàlẹ̀ sì pa ìtumọ̀ tí ó gbòòrò sí i mọ́ láìfi èrò ẹ̀kọ́ ìjọ kan kún un.
translation_notes:
  register: Yorùbá àfẹnusọ tó bójú mu, tó ní iyì, tí ó sì ṣe kedere fún òǹkàwé òde òní. A lo àmì ohùn ní kíkún níbi tí ó jẹ́ ti àdánidá; “fi ... lé ... lọ́wọ́” jẹ́ àṣàyàn Yorùbá tó ṣàfihàn ìgbẹ́kẹ̀lé ohun sí àbójútó ẹlòmíràn.
