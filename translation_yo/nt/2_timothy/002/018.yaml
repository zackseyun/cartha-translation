  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: yo
  text: Àwọn tí wọ́n ti ṣìnà kúrò nínú òtítọ́[a], nípa sísọ pé àjíǹde ti ṣẹlẹ̀ náà[b], tí wọ́n sì ń da ìgbàgbọ́ àwọn kan rú[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, “àwọn tí wọ́n ti pàdánù ọ̀nà ní ti òtítọ́” tàbí “àwọn tí wọ́n ti yà kúrò nínú òtítọ́.”
    reason: lexical_alternative
  - marker: b
    text: Ìyẹn ni pé, wọ́n ń sọ pé àjíǹde tí a ń retí ti kọjá lọ.
    reason: cross_reference
  - marker: c
    text: Tàbí, “tí wọ́n sì ń ba ìgbàgbọ́ àwọn kan jẹ́” tàbí “tí wọ́n sì ń mú ìgbàgbọ́ àwọn kan ṣubú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: àwọn tí
  rationale: Ó ṣe àgbékalẹ̀ gbólóhùn àsopọ̀ tí ó ń tọ́ka sí àwọn olùkọ́ èké tí a mẹ́nu kàn ṣáájú.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: tí wọ́n ti ṣìnà kúrò nínú òtítọ́
  rationale: Àkójọpọ̀ ọ̀rọ̀ náà túmọ̀ sí pé wọ́n ti pàdánù ọ̀nà ní ti òtítọ́; yíyí rẹ̀ sí èdè Yorùbá yìí jẹ́ àdánidá, ó sì pa àwòrán ìṣìnà mọ́.
- source_word: λέγοντες
  choice: tí wọ́n ń sọ pé
  rationale: Ó pa ìṣe tí ó ń lọ lọ́wọ́ mọ́, ó sì fi ohun tí ẹ̀kọ́ àṣìṣe wọn sọ hàn láì pinnu ju ohun tí Gíríìkì sọ lọ.
- source_word: ἀνάστασιν ἤδη γεγονέναι
  choice: àjíǹde ti ṣẹlẹ̀ ná
  rationale: “Àjíǹde” ni ọ̀rọ̀ Yorùbá tí ó wọ́pọ̀ fún ἀνάστασις; “ti ṣẹlẹ̀ ná” fi àkókò ἤδη àti ìtumọ̀ perfect infinitive γεγονέναι hàn.
- source_word: ἀνατρέπουσιν
  choice: ń da … rú
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà ń tọ́ka sí bí ẹ̀kọ́ wọn ṣe ń mì tàbí ń ba ìgbàgbọ́ àwọn kan jẹ́; “da … rú” jẹ́ èdè Yorùbá àdánidá tí kò fi dandan sọ pé ìgbàgbọ́ wọn ti parun pátápátá.
- source_word: τήν τινων πίστιν
  choice: ìgbàgbọ́ àwọn kan
  rationale: “Ìgbàgbọ́” ni ìtumọ̀ tí ó bójú mu fún πίστις níbí, “àwọn kan” sì pa àìsọ iye tàbí ẹni pàtó nínú τινων mọ́.
theological_decisions:
- issue: Ìtumọ̀ ọ̀rọ̀ pé àjíǹde ti ṣẹlẹ̀ ná
  choice: A ṣe àkọsílẹ̀ ẹ̀sùn wọn gẹ́gẹ́ bí ó ṣe wà, láì ṣàlàyé irú ètò ẹ̀kọ́ èké tí wọ́n gbà.
  alternative: Kí a sọ ní tààrà pé wọ́n ń kọ àjíǹde ara ọjọ́ iwájú tàbí pé wọ́n gbà pé àjíǹde jẹ́ ti ẹ̀mí nìkan.
  rationale: Ẹsẹ yìí sọ ohun tí wọ́n ń kọ́ni, ṣùgbọ́n kò ṣàlàyé gbogbo èrò ẹ̀kọ́ wọn; ìtumọ̀ náà gbọ́dọ̀ pa àìdánilójú yẹn mọ́.
- issue: Ìtumọ̀ πίστις
  choice: ìgbàgbọ́
  alternative: ìgbẹ́kẹ̀lé
  rationale: “Ìgbàgbọ́” ni ọ̀rọ̀ tó ṣe déédéé jù lọ nínú àyíká ẹ̀kọ́ Kristẹni yìí, láì dí ìtumọ̀ náà mọ́ sí ìgbẹ́kẹ̀lé nìkan.
translation_notes:
  register: Èdè Yorùbá boṣewa, pẹ̀lú àmì ohùn níbi tí ó bá yẹ; ìforúkọsílẹ̀ náà jẹ́ ọ̀wọ̀, àdánidá, ó sì lè yé òǹkàwé òde òní. A pa ìṣọ̀kan gbólóhùn àsopọ̀ Gíríìkì mọ́ nípa lílo “àwọn tí … tí … tí … sì.”
