source:
  edition: SBLGNT
  text: ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε ⸀δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/025.yaml
  text: correcting those who oppose him with gentleness[a], in case God may grant them repentance leading to the knowledge of the truth[b],
translation:
  language: yo
  text: ní ìwà tútù, kí ó máa tọ́ àwọn tí ń tako ọ́[a] sọ́nà, bóyá Ọlọ́run lè fún wọn ní ìrònúpìwàdà tí ń darí wọn sí ìmọ̀ òtítọ́[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tàbí, ‘àwọn tí ń tako’; ọ̀rọ̀ Gíríìkì kò sọ ẹni tí wọ́n ń tako ní gbangba, ṣùgbọ́n àyíká ọ̀rọ̀ tọ́ka sí ìránṣẹ́ Olúwa àti ẹ̀kọ́ rẹ̀.
    reason: lexical_alternative
  - marker: b
    text: Tàbí, ‘ní ìrètí pé Ọlọ́run lè fún wọn ní ìrònúpìwàdà.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: ní fífi pẹ̀lẹ́pẹ̀lẹ́
  rationale: Gbólóhùn náà ń ṣàlàyé bí ìtọ́ni àtúnṣe ṣe yẹ kí ó rí. ‘Pẹ̀lẹ́pẹ̀lẹ́’ jẹ́ ọ̀rọ̀ Yorùbá àdánidá tí ó fi ìwà tútù hàn láìsọ ọ́ di àìlera.
- source_word: παιδεύοντα
  choice: tọ́ ... sọ́nà
  rationale: Nínú àyíká yìí, ọ̀rọ̀ náà túmọ̀ sí fífi ìtọ́ni àtúnṣe kọ́ ènìyàn, kì í ṣe fífi ìyà jẹ é; ‘tọ́ ... sọ́nà’ dá ìtumọ̀ ìkọ́ni àti àtúnṣe náà pa mọ́.
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: àwọn tí ń tako ọ́
  rationale: Participle náà ń tọ́ka sí àwọn tí wọ́n gbé ara wọn dìde ní àtakò. Ọ̀rọ̀ arọ́pò-orúkọ ‘ọ́’ kò sí ní gbangba nínú Gíríìkì, ṣùgbọ́n àyíká ẹsẹ tó ṣáájú tọ́ka sí ìránṣẹ́ Olúwa.
- source_word: μήποτε
  choice: bóyá
  rationale: ‘Bóyá’ pa àìdánilójú àti ìṣọ́ra tí μήποτε pẹ̀lú subjunctive ní mọ́, láìsọ pé abajade náà dájú.
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: Ọlọ́run yóò fún wọn ní
  rationale: Ní ìbámu pẹ̀lú ‘bóyá,’ ọ̀rọ̀ yìí sọ pé Ọlọ́run ni ẹni tí ó lè fi ìrònúpìwàdà fún wọn, nígbà tí àìdánilójú gírámà náà ṣì wà.
- source_word: μετάνοιαν
  choice: ìrònúpìwàdà
  rationale: ‘Ìrònúpìwàdà’ jẹ́ ọ̀rọ̀ Yorùbá tó wọ́pọ̀, tó sì gbé ìyípadà inú àti yíyípadà kúrò ní ọ̀nà àtijọ́ jáde ju ‘ìyípadà èrò’ lásán lọ.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: tí yóò mú wọn dé ibi ìmọ̀ òtítọ́
  rationale: εἰς lè fi ibi-afẹ́ tàbí abajade hàn. Ìtumọ̀ yìí fi ìlọsíwájú dé ojúlówó ìmọ̀ òtítọ́ hàn ní Yorùbá àdánidá.
theological_decisions:
- issue: Iṣẹ́ Ọlọ́run àti ìdáhùn ènìyàn nínú ìrònúpìwàdà
  choice: A sọ pé bóyá Ọlọ́run yóò fún wọn ní ìrònúpìwàdà.
  alternative: Láti sọ ọ́ lọ́nà tí yóò fi jẹ́ pé ìrònúpìwàdà dá lórí ìpinnu Ọlọ́run nìkan, tàbí láti dín ipa Ọlọ́run kù.
  rationale: Gíríìkì sọ Ọlọ́run di olùfúnni ní ìrònúpìwàdà, ṣùgbọ́n ẹsẹ náà kò ṣàlàyé gbogbo ìbáṣepọ̀ tó wà láàárín àṣẹ Ọlọ́run àti ojúṣe ènìyàn. A pa ìfọ̀kànbalẹ̀ ẹ̀kọ́ ìgbàgbọ́ yìí mọ́ láìyanju rẹ̀.
translation_notes:
  register: Yorùbá boṣewa pẹ̀lú àmì ohùn níbi tí ó bá yẹ; èdè náà jẹ́ ti òde òní, ó ní iyì, ó sì ṣeé lóye fún òǹkàwé gbogbo. A lo ‘ìrònúpìwàdà’ gẹ́gẹ́ bí ọ̀rọ̀ ìgbàgbọ́ tó ti fìdí múlẹ̀, láìfi ẹ̀kọ́ ẹ̀ya ìjọ kan kún un.
