id: 2TI.2.15
reference: 2 Timothy 2:15
language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: SBLGNT
  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: yo
  text: Sapá láti fi ara rẹ hàn níwájú Ọlọ́run gẹ́gẹ́ bí ẹni tí a fọwọ́ sí, òṣìṣẹ́ tí kò ní ìdí láti tijú, tí ń mú ọ̀rọ̀ òtítọ́ lò lọ́nà títọ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí, “tí ń kọ́ ọ̀rọ̀ òtítọ́ lọ́nà tí ó tọ́”; ní ìtumọ̀ gangan, “tí ń gé ọ̀rọ̀ òtítọ́ ní tààrà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: Máa sapá
  rationale: Ó fi àṣẹ láti ṣe ìsapá tọkàntọkàn hàn ní Yorùbá àdánidá, láì sọ ọ́ di ọ̀rọ̀ aláìlágbára bí ‘ṣe gbogbo ohun tí o lè ṣe.’
- source_word: σεαυτὸν ... παραστῆσαι τῷ θεῷ
  choice: láti fi ara rẹ hàn níwájú Ọlọ́run
  rationale: ‘Fi ara rẹ hàn’ pa ìtumọ̀ fífi ara ẹni kalẹ̀ mọ́, ‘níwájú Ọlọ́run’ sì mú ipò ìdánwò tàbí iṣẹ́ níwájú Ọlọ́run yéni láì dín ìtumọ̀ náà kù.
- source_word: δόκιμον
  choice: gẹ́gẹ́ bí ẹni tí ó ye ìtẹ́wọ́gbà
  rationale: Ó mú ìtumọ̀ ẹni tí a ti dán wò tí ó sì yẹ fún ìtẹ́wọ́gbà jáde; ó tún bá àyíká ìṣírò níwájú Ọlọ́run mu.
- source_word: ἐργάτην
  choice: òṣìṣẹ́
  rationale: Ọ̀rọ̀ Yorùbá òde òní tí ó ṣe kedere, tí ó sì pa àpèjúwe ẹni tí ń ṣiṣẹ́ mọ́.
- source_word: ἀνεπαίσχυντον
  choice: tí kò ní ìdí láti tijú
  rationale: Ó tọ́ka sí pé kò sí ohun tó yẹ kí ó fà á tíjú, kì í ṣe ìmọ̀lára àìtìjú lásán.
- source_word: ὀρθοτομοῦντα
  choice: tí ń mú ... lò lọ́nà títọ́
  rationale: Ó pa ìtumọ̀ gbígbòòrò ti bíbá ọ̀rọ̀ náà lò tàbí mímú un lọ́nà tí ó tọ́ mọ́, láì fi dandan túmọ̀ rẹ̀ sí kíkọ́ni nìkan. Àwòrán gígé ní tààrà wà nínú àlàyé ìsàlẹ̀.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: ọ̀rọ̀ òtítọ́
  rationale: Ó pa ìsopọ̀ ọ̀rọ̀ Gíríìkì àti ìró ẹ̀kọ́ ìgbàgbọ́ rẹ̀ mọ́, ó sì ṣe kedere ní Yorùbá.
theological_decisions:
- issue: Ìtumọ̀ ὀρθοτομοῦντα nínú iṣẹ́ ìránṣẹ́ Tímótì
  choice: mú ọ̀rọ̀ òtítọ́ lò lọ́nà títọ́
  alternative: kọ́ ọ̀rọ̀ òtítọ́ lọ́nà tí ó tọ́; ní ìtumọ̀ gangan, gé ọ̀rọ̀ òtítọ́ ní tààrà
  rationale: Ìtumọ̀ àkọ́kọ́ jẹ́ gbígbòòrò, ó sì lè ní kíkọ́ni, wíwàásù, àti lílo iṣẹ́ ìránṣẹ́ mìíràn nínú. Àlàyé ìsàlẹ̀ pa àwòrán gangan àti ìtumọ̀ tó dín sí kíkọ́ni mọ́, kí a má bàa yanjú ohun tí ọ̀rọ̀ náà fi sílẹ̀ ní àìdánilójú.
translation_notes:
  register: Yorùbá boṣewa, ọ̀rọ̀ ọlọ́lá ṣùgbọ́n tí ó ṣe kedere fún òǹkàwé òde òní. A lo ‘Máa sapá’ fún àṣẹ tó ní ìtara, ‘òṣìṣẹ́’ fún àpèjúwe iṣẹ́, a sì pa àìdánilójú ὀρθοτομοῦντα mọ́ nípasẹ̀ àlàyé ìsàlẹ̀.
