  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: yo
  text: Ọ̀rọ̀ yìí ṣeé gbẹ́kẹ̀ lé:[a] Nítorí, bí a bá ti kú pẹ̀lú rẹ̀,[b] a ó sì wà láàyè pẹ̀lú rẹ̀.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tún lè túmọ̀ rẹ̀ sí “Olóòtítọ́ ni ọ̀rọ̀ náà” tàbí “Ọ̀rọ̀ náà ṣeé fọkàn tán.”
    reason: lexical_alternative
  - marker: b
    text: Ní tààrà, “bí a bá ti kú papọ̀ pẹ̀lú”; ọ̀rọ̀-ìṣe Gíríìkì náà fi hàn pé a ń sọ nípa kíkú pẹ̀lú Kristi.
    reason: lexical_alternative
  - marker: c
    text: Ọ̀rọ̀ ọjọ́ iwájú náà, “a ó wà láàyè pẹ̀lú rẹ̀,” lè tọ́ka sí ìyè àjíǹde pẹ̀lú Kristi, ìkópa nínú ìyè rẹ̀ ní ìsinsìnyí, tàbí àwọn méjèèjì.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: ṣeé gbẹ́kẹ̀ lé
  rationale: Ó fi hàn pé ọ̀rọ̀ náà ṣeé fọkàn tán, ó sì yẹ fún ìtẹ́wọ́gbà. Èyí jẹ́ ọ̀nà àdánidá ní Yorùbá láti sọ pé gbólóhùn kan ṣeé gbára lé, láìsọ ọ́ di ànímọ́ ẹni.
- source_word: ὁ λόγος
  choice: Ọ̀rọ̀ yìí
  rationale: Nínú àwọn Lẹ́tà sí àwọn Olùṣọ́ Àgùntàn, gbólóhùn πιστὸς ὁ λόγος máa ń tọ́ka sí ọ̀rọ̀ kúkúrú kan tí ó yẹ kí ènìyàn rántí. “Ọ̀rọ̀ yìí” jẹ́ èdè Yorùbá àdánidá, ó sì tọ́ka sí ohun tí ó tẹ̀ lé e.
- source_word: εἰ γὰρ
  choice: Nítorí bí
  rationale: “Bí” ń mú ipò àdéhùn εἰ jáde, “nítorí” sì pa ipa àlàyé γάρ mọ́, ní ìbámu pẹ̀lú bí ọ̀rọ̀ Gíríìkì ṣe ń ṣàn.
- source_word: συναπεθάνομεν
  choice: a bá ti bá a kú
  rationale: Ọ̀rọ̀-ìṣe náà jẹ́ aorist, àmì συν- sì túmọ̀ sí kíkópa nínú ikú pẹ̀lú ẹlòmíràn. “Bá a kú” fi ikú pẹ̀lú Kristi hàn ní ṣókí; “ti” sì ń tọ́ka sí ohun tí ó ti ṣẹlẹ̀ láìfi ẹ̀kọ́ mìíràn kún un.
- source_word: καὶ
  choice: sì
  rationale: “Sì” so apá kejì mọ́ ti àkọ́kọ́, ó sì mú ìbáramu tó wà láàárín kíkú pẹ̀lú rẹ̀ àti wíwà láàyè pẹ̀lú rẹ̀ hàn lọ́nà àdánidá ní Yorùbá.
- source_word: συζήσομεν
  choice: a ó sì bá a wà láàyè
  rationale: Ọ̀rọ̀-ìṣe ọjọ́ iwájú yìí ní àmì συν-, tó ń sọ nípa ìyè tí a pín pẹ̀lú Kristi. “Bá a wà láàyè” ṣe kedere, ó sì yẹra fún dídín ìtumọ̀ náà kù sí ìyè ìsinsìnyí tàbí àjíǹde ọjọ́ iwájú nìkan.
theological_decisions:
- issue: Ẹni tí àwọn ọ̀rọ̀-ìṣe oní àmì συν- ń tọ́ka sí
  choice: Fi “bá a” sí àwọn ọ̀rọ̀-ìṣe méjèèjì, kí “a” sì tọ́ka sí Kristi.
  alternative: 'Fi ẹni náà sílẹ̀ láìdárúkọ: “bí a bá ti kú, a ó sì wà láàyè.”'
  rationale: Bí ó tilẹ̀ jẹ́ pé ẹnì kejì kò fara hàn gẹ́gẹ́ bí ọ̀rọ̀ ọ̀tọ̀ nínú ẹsẹ yìí, àmì συν- nínú àwọn ọ̀rọ̀-ìṣe méjèèjì ń fi ìkópa pẹ̀lú ẹlòmíràn hàn. Àyíká ọ̀rọ̀ tó dá lórí Kristi mú kí Kristi jẹ́ ẹni tí a ń tọ́ka sí. “Bá a” mú ìtumọ̀ náà yé ẹni tó ń ka Yorùbá láìfi ẹ̀kọ́ tuntun kún un.
- issue: Àkókò àti ìtumọ̀ ẹ̀kọ́ ìgbàgbọ́ ti wíwà láàyè pẹ̀lú Kristi
  choice: Túmọ̀ ọ́ ní gbòòrò sí “a ó sì bá a wà láàyè,” láìpinnu bóyá àjíǹde ọjọ́ iwájú, ìkópa nínú ìyè rẹ̀ ní ìsinsìnyí, tàbí àwọn méjèèjì ni a tẹnumọ́.
  alternative: Dín in kù sí àjíǹde ọjọ́ iwájú nìkan, tàbí sí ìyè ẹ̀mí ní ìsinsìnyí nìkan.
  rationale: Ọ̀rọ̀ ọjọ́ iwájú συζήσομεν lè tọ́ka sí ìyè pẹ̀lú Kristi ní ọjọ́ iwájú, ìtumọ̀ rẹ̀ kò sì fipá mú kí a yọ ìkópa nínú ìyè rẹ̀ ní ìsinsìnyí kúrò. Ìtumọ̀ yìí pa fífẹ̀ àti ìfọ̀rọ̀wérọ̀ tó wà nínú ọ̀rọ̀ Gíríìkì mọ́.
translation_notes:
  register: Èdè náà jẹ́ Yorùbá ìgbàlódé tó bójú mu, tó ní iyì, tí ó sì rọrùn fún gbogbo ènìyàn láti lóye. A lo “ṣeé gbẹ́kẹ̀ lé” dípò gbólóhùn líle tàbí àtijọ́, a sì lo ìṣọ̀kan “bá a kú / bá a wà láàyè” láti pa ìbáramu àwọn ọ̀rọ̀-ìṣe Gíríìkì méjèèjì mọ́. Àwọn àmì ohùn kún ibi tí ó yẹ.
