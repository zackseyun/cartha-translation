  source_fidelity: 'Ìtumọ̀ ẹsẹ̀ náà tẹ̀lé ìtòlẹ́sẹẹsẹ àti ìtẹnumọ́ Hébérù dáadáa: ìtúnwí הֲבֵל הֲבָלִים, ìfọ̀rọ̀wérọ̀ Kóhẹ́lẹ́tì, àti ìpinnu gbogbo-nǹkan ni a pa mọ́. “Èémí lásán” jẹ́ ìmúgbòòrò tí ó bójú mu fún ìdájọ́ hẹ́fẹ́lì nínú àsọtẹ́lẹ̀. Àmì-ẹsẹ̀ [a] àti [b] wà níbi tí ó tọ́.'
  naturalness: Ọ̀rọ̀ ẹsẹ̀ náà jẹ́ Yorùbá boṣewa, ó sì ní ìró lítírésọ̀ tó yẹ. “Èémí àwọn èémí” jẹ́ ìfararora mọ́ ìkọ̀ Hébérù tí ó lè dáa nínú ìtumọ̀ tó ń pa àwòrán orísun mọ́. Ṣùgbọ́n nínú àlàyé-ẹsẹ̀ [a], “òru afẹ́fẹ́” túmọ̀ sí ‘night of wind,’ kì í sì í ṣe ‘vapor’; “àfiwé-gíga” náà kì í ṣe ọ̀rọ̀ tó pé fún ìṣètò akọ́pọ̀-orúkọ Hébérù tó ń fi ohun ga jù lọ.
  terminology: “Èémí,” “ohun gbogbo,” àti “lásán” ní ìṣọ̀kan pẹ̀lú ìpinnu ìtumọ̀ Gẹ̀ẹ́sì, láìfi ‘àìní ìtumọ̀’ tàbí ẹ̀kọ́ ìsìn kan kún un. Kí a má bàa sọ ohun tí kò tọ́ nípa hẹ́fẹ́lì, a yẹ kí a rọ́pò “òru afẹ́fẹ́” pẹ̀lú “ìkùukùu,” kí a sì ṣàlàyé ìlànà ìmú-gíga náà ní ọ̀nà tó pé síi.
