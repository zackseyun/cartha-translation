    rationale: “Òru” jẹ́ ‘night’ ní Yorùbá; nítorí náà, gbólóhùn náà kò túmọ̀ ‘vapor’ rárá, ó sì lè darí òǹkàwé sí ìtumọ̀ tí kò ní í ṣe pẹ̀lú hẹ́fẹ́lì.
