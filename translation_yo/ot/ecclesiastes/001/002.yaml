language:
  code: yo
  name: Yoruba
  native_name: Yorùbá
  variant: Standard Yoruba with full tone marks where natural
source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: yo
  text: “Èémí àwọn èémí[a],” ni Kóhẹ́lẹ́tì[b] wí; “èémí àwọn èémí; èémí lásán ni ohun gbogbo.”
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: Hébérù הֶבֶל (hẹ́fẹ́lì) túmọ̀ ní tààrà sí “èémí” tàbí “ìkùukùu.” Kóhẹ́lẹ́tì lo ọ̀rọ̀ yìí léraléra nínú ìwé náà fún ohun tí kì í pẹ́, tí kò ṣeé dì mú, tí ohun tí a sì retí nípa rẹ̀ lè yàtọ̀ sí ohun tí ó ṣẹlẹ̀. Kò sí ọ̀rọ̀ Yorùbá kan ṣoṣo tí ó kó gbogbo ìtumọ̀ wọ̀nyí. “Èémí àwọn èémí” jẹ́ ìṣètò Hébérù tó ń fi ohun kan ga jù lọ, irú bí “orin àwọn orin.”
    reason: Ṣe àtúnṣe ìtumọ̀ aṣìṣe “òru afẹ́fẹ́,” kí a sì ṣàlàyé ìṣètò ìmú-gíga Hébérù ní ọ̀nà tó pé.
lexical_decisions:
- source_word: הֶבֶל / הֲבֵל
  choice: èémí
  rationale: Ọ̀rọ̀ Hébérù náà túmọ̀ ní ìpilẹ̀ sí èémí tàbí òru afẹ́fẹ́ tí ó ń pòórá. “Èémí” pa àwòrán gidi náà mọ́, ó sì lè ru àwọn ìtumọ̀ tí ó so pọ̀—ohun tí kì í pẹ́, ohun tí kò ṣeé dì mú, àti àìbáramu láàárín ohun tí a retí àti ohun tí ó ṣẹlẹ̀—láìsọ ọ́ di ‘àìní ìtumọ̀’ tàbí ‘asán’ nìkan.
- source_word: הֲבֵל הֲבָלִים
  choice: èémí àwọn èémí
  rationale: Èyí pa ìṣètò àfiwé-gíga Hébérù, ‘X ti àwọn X,’ mọ́, bí ó ti rí nínú ‘orin àwọn orin.’ Ó jẹ́ kí àwòrán èémí dúró dípò fífi ọ̀rọ̀ àfojúrí kan rọ́pò rẹ̀.
- source_word: אָמַר
  choice: ni ... wí
  rationale: Bí ó tilẹ̀ jẹ́ pé ọ̀rọ̀-ìṣe Hébérù náà ní ìrísí àkókò tí ó ti kọjá, ó ń ṣiṣẹ́ gẹ́gẹ́ bí ọ̀nà ìgbékalẹ̀ ọ̀rọ̀ lítírésọ̀; “ni ... wí” jẹ́ ọ̀nà Yorùbá tí ó bójú mu fún ìkéde aláyègbé yìí.
- source_word: קֹהֶלֶת
  choice: Kóhẹ́lẹ́tì
  rationale: A kọ orúkọ oyè Hébérù náà sílẹ̀ ní ohùn Yorùbá, kí a má bàa fi ìtumọ̀ kan ṣoṣo bí ‘Olùkọ́’ tàbí ‘Oníwàásù’ lé e lórí.
- source_word: הַכֹּל
  choice: ohun gbogbo
  rationale: “Ohun gbogbo” jẹ́ ọ̀nà Yorùbá àdánidá tí ó pa agbára gbólóhùn Hébérù tó ń kó gbogbo nǹkan jọ mọ́.
- source_word: הָבֶל
  choice: èémí lásán
  rationale: Ní ipò àsọtẹ́lẹ̀ yìí, “lásán” mú ìrẹ̀wẹ̀sì àti ìdájọ́ inú Hébérù hàn, kí gbólóhùn náà má bàa dà bí ẹni pé ó kàn ń sọ pé èémí ni ohun èlò tí gbogbo nǹkan fi dá.
theological_decisions:
- issue: Bí a ṣe máa túmọ̀ הֶבֶל, àwòrán pàtàkì inú ìwé náà
  choice: 'Lílo àwòrán gidi “èémí”: “èémí àwọn èémí” nínú àfiwé-gíga, àti “èémí lásán” nínú àsọtẹ́lẹ̀.'
  alternative: asán pátápátá; àìní ìtumọ̀; ìkùnà; ohun tí ń kọjá lọ; ohun tí kò ṣeé lóye
  rationale: Ọ̀kọ̀ọ̀kan àwọn ọ̀rọ̀ àfojúrí yẹn máa ń yan apá kan nínú ìtumọ̀ Hébérù, ó sì máa ń fi àwọn yòókù sílẹ̀. “Èémí” pa ìgbà-kúkúrú, àìṣeé-dì-mú, àti ìyàlẹ́nu àìbáramu rẹ̀ pọ̀, láìfi èrò pé gbogbo ìwàláàyè kò ní ìtumọ̀ sínú ẹsẹ náà.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún àti ìforúkọsílẹ̀ ọlọ́wọ̀, lítírésọ̀, ṣùgbọ́n tí ó ṣeé lóye fún òǹkàwé òde òní. Ìṣètò “èémí àwọn èémí” jẹ́ àfarawe ìkọ̀ Hébérù tí a mọ̀ọ́mọ̀ pa mọ́; “èémí lásán ni ohun gbogbo” sì jẹ́ Yorùbá àdánidá tí ó mú agbára ìdájọ́ gbólóhùn náà jáde.
