  naturalness: '“Ní ìbẹ̀rẹ̀, nígbà tí Ọlọ́run dá àwọn ọ̀run àti ayé—” jẹ́ Yorùbá boṣewa tí ó ṣeé lóye, bí ó tilẹ̀ jẹ́ pé ó ń fara mọ́ ìṣètò àkànṣe ti ìtumọ̀ Gẹ̀ẹ́sì. Àlàyé ìsàlẹ̀ nílò àtúnṣe kékeré: “Ní ìtumọ̀ ìbílẹ̀” kò rọrùn bí “Lọ́nà ìbílẹ̀,” ìṣètò “bí ... ṣe wà ... mú kí” sì kò péye.'
