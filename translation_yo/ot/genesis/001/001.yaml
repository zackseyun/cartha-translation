  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: yo
  text: Ní ìbẹ̀rẹ̀, nígbà tí Ọlọ́run dá àwọn ọ̀run àti ayé[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Lọ́nà ìbílẹ̀, a máa ń túmọ̀ èyí gẹ́gẹ́ bí gbólóhùn tí ó pé fúnra rẹ̀ pé: “Ní ìbẹ̀rẹ̀, Ọlọ́run dá àwọn ọ̀run àti ayé.” Ṣùgbọ́n àìsí árítíkù nínú בְּרֵאשִׁית, àti bí ọ̀rọ̀-ìṣe בָּרָא ṣe tẹ̀ lé e, mú kí ó ṣeé ṣe láti ka Hébérù náà gẹ́gẹ́ bí gbólóhùn àkókò tí ó gbára lé ohun tí yóò tẹ̀ lé, gẹ́gẹ́ bí ó ti rí nínú Jẹ́nẹ́sísì 2:4b. Gbólóhùn pàtàkì náà wà ní ẹsẹ 3: “Ọlọ́run sì wí pé, ‘Kí ìmọ́lẹ̀ kí ó wà.’”'
    reason: A tún èdè náà ṣe kí ó jẹ́ Yorùbá adayeba àti kí ìṣètò gírámà rẹ̀ kedere, nígbà tí a ṣì ń pa àwọn ìka-ìtumọ̀ méjèèjì mọ́.
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Ní ìbẹ̀rẹ̀, nígbà tí … dá
  rationale: Ọ̀rọ̀ náà kò ní árítíkù nínú Hébérù, ó sì tẹ̀ lé e pẹ̀lú ọ̀rọ̀-ìṣe tí ó ní ẹni àti àkókò; nítorí náà, gbólóhùn àkókò tí ó gbára lé ohun tí yóò tẹ̀ lé ni ó ṣeé ṣe jù. Ìtumọ̀ yìí tún pa agbára ìtumọ̀ רֵאשִׁית mọ́.
- source_word: בָּרָא
  choice: dá
  rationale: “Dá” ni ọ̀rọ̀ Yorùbá tí ó ṣe déédé jù fún ìṣe ìṣẹ̀dá Ọlọ́run níbí, láìfi ọ̀nà tàbí ohun èlò ìṣẹ̀dá kún ọrọ orísun.
- source_word: אֱלֹהִים
  choice: Ọlọ́run
  rationale: Bí ó tilẹ̀ jẹ́ pé ìrísí ọ̀rọ̀ Hébérù náà jẹ́ ọ̀pọ̀, ọ̀rọ̀-ìṣe ẹyọ tí ó bá a lọ fi hàn pé Ọlọ́run kan ṣoṣo ni a ń tọ́ka sí.
- source_word: אֵת
  choice: '[a kò túmọ̀ ọ́ ní ọ̀tọ̀; àmì ohun tí ìṣe kan sí]'
  rationale: אֵת jẹ́ àmì gírámà Hébérù fún ohun pàtó tí ọ̀rọ̀-ìṣe kan sí; ìṣètò ọ̀rọ̀ Yorùbá ló ń fi iṣẹ́ rẹ̀ hàn.
- source_word: הַשָּׁמַיִם
  choice: àwọn ọ̀run
  rationale: Ẹ̀yà ọ̀pọ̀ “àwọn ọ̀run” ń pa ìrísí ọ̀pọ̀ ti Hébérù mọ́; pẹ̀lú “ayé,” ó ń tọ́ka sí gbogbo ohun tí a dá.
- source_word: הָאָרֶץ
  choice: ayé
  rationale: Bí אָרֶץ tilẹ̀ lè túmọ̀ sí ilẹ̀, nínú àkójọpọ̀ àgbáyé “àwọn ọ̀run àti ayé,” “ayé” ni ìtumọ̀ tó bá àyíká mu jù.
theological_decisions:
- issue: Ìṣètò gírámà gbólóhùn ìbẹ̀rẹ̀
  choice: 'Gbólóhùn àkókò tí ó gbára lé èyí tí yóò tẹ̀ lé: “Ní ìbẹ̀rẹ̀, nígbà tí Ọlọ́run dá àwọn ọ̀run àti ayé—”'
  alternative: 'Gbólóhùn tí ó pé fúnra rẹ̀: “Ní ìbẹ̀rẹ̀, Ọlọ́run dá àwọn ọ̀run àti ayé.”'
  rationale: Àìsí árítíkù nínú בְּרֵאשִׁית, bí ọ̀rọ̀-ìṣe בָּרָא ṣe tẹ̀ lé e lẹ́sẹ̀kẹsẹ̀, àti àwọn àpẹẹrẹ tó jọ ọ́ ní Jẹ́nẹ́sísì 2:4b àti Hósíà 1:2, ń ṣètìlẹ́yìn fún gbólóhùn àkókò tí ó dúró de gbólóhùn pàtàkì ní ẹsẹ 3. Síbẹ̀, a pa ìtumọ̀ ìbílẹ̀ mọ́ nínú àlàyé ìsàlẹ̀ nítorí pé ó jẹ́ ìtumọ̀ gidi tí a ti ń lò tipẹ́.
translation_notes:
  register: Yorùbá boṣewa, pẹ̀lú àmì ohùn ní kíkún níbi tí ó bá jẹ́ ti ẹ̀dá; èdè náà ní ọlá ṣùgbọ́n ó ṣe kedere fún òǹkàwé òde òní. Àmì gígùn “—” fi hàn pé èrò náà ń bá a lọ sí àwọn ẹsẹ tó tẹ̀ lé.
