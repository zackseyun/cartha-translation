base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/022.yaml
  text: And all of them recovered all their own property from the registration, so that those who had anything gave it back to them with the greatest fear, since the great God had fully accomplished mighty deeds for their deliverance.
translation:
  language: ru
  text: И все они получили обратно всё своё имущество согласно описи[a], так что те, у кого было что-либо из этого имущества, возвращали им его в сильнейшем страхе, потому что великий Бог полностью совершил великие деяния ради их избавления[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из реестра», «по официальной записи». Греческое ἀπογραφή может означать административную регистрацию лиц или имущества, а также составленную опись.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ради их спасения». Греческое σωτηρία может означать как избавление в конкретной опасности, так и спасение в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκομίσαντο
  choice: получили обратно
  rationale: Средний залог здесь передаёт возвращение владельцам принадлежавшего им имущества; «получили обратно» ясно выражает реституцию и не добавляет идеи самостоятельного изъятия.
- source_word: ἐξ ἀπογραφῆς
  choice: по описи
  rationale: ἀπογραφή обозначает официальную запись, регистрацию или опись. В имущественном контексте «по описи» естественно передаёт административное основание возврата, не уточняя его сверх греческого текста.
- source_word: τοὺς ἔχοντάς τι
  choice: всякий, у кого находилось что-либо из него
  rationale: Фраза относится к любому человеку, владевшему какой-либо частью имущества. Добавление «из него» лишь проясняет подразумеваемую связь с ранее названным имуществом.
- source_word: μετὰ φόβου μεγίστου
  choice: в величайшем страхе
  rationale: Сохраняется усилительная форма греческого выражения и его значение сильного страха, а не смягчённого благоговения.
- source_word: ἀποδοῦναι αὐτοῖς
  choice: возвратил им это
  rationale: Глагол выражает возвращение владельцам того, что им принадлежало; «возвратил» точно и естественно передаёт акт возмещения.
- source_word: τὰ μεγαλεῖα
  choice: великие деяния
  rationale: Существительное обозначает великие, могущественные свершения Бога. Формулировка сохраняет возвышенный тон и намеренный созвучный повтор с «великий Бог».
- source_word: ποιήσαντος τελέως
  choice: в полной мере совершил
  rationale: Передаёт как действие ποιέω, так и усилительное значение τελέως — полноту и завершённость Божьего деяния.
- source_word: ἐπὶ σωτηρίᾳ αὐτῶν
  choice: ради их избавления
  rationale: В повествовательном контексте σωτηρία прежде всего означает конкретное спасение от угрозы; «избавление» сохраняет при этом религиозный вес выражения.
theological_decisions:
- issue: Передача σωτηρία в контексте исторического спасения народа
  choice: избавление
  alternative: спасение
  rationale: Здесь речь непосредственно идёт о Божьем избавлении людей от смертельной опасности и восстановлении их положения. «Избавление» отчётливее выражает этот конкретный смысл, тогда как более широкое «спасение» остаётся допустимой альтернативой и указано в сноске.
- issue: Причинное отношение генитивной абсолютной конструкции ποιήσαντος
  choice: потому что
  alternative: когда / после того как
  rationale: В контексте страх владельцев имущества представлен как следствие совершённых Богом великих деяний. Причинный перевод естественен, хотя сама греческая обстоятельственная конструкция допускает более общее временное прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет единство длинного греческого предложения, но остаётся понятным; административный термин передан естественным «по описи», а риторическое сочетание «великий Бог — великие деяния» намеренно сохранено.
