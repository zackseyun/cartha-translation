  verdict: revise
  source_fidelity: Основная последовательность действий и ключевые элементы стиха переданы верно. Однако «их благополучно переправляли» сужает ἀνασωζόμενοι до перевозки/переправы и вводит невыраженного деятеля; греческое причастие говорит о безопасном сохранении (возможно, благополучном возвращении) в пути. Также «это» несколько размывает множественное ἃς, хотя без более широкого контекста не следует навязывать конкретный антецедент.
  naturalness: Текст в целом современный и литературный. Замена пассивно-каузативного «переправляли» на деепричастную конструкцию делает фразу естественнее и не приписывает перевозку по рекам.
  terminology: «Памятная стела», «место молитвы», «по повелению царя», «невредимыми, свободными» уместны и точны. «Увековечив их на стеле» лучше сохраняет множественное число исходного относительного местоимения и публично-памятный характер ἀνιερώσαντες, не исключая оттенка посвящения, отмеченного в сноске.
  issues:
