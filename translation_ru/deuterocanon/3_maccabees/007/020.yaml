    rationale: Формулировка означает, что их перевозили или переправляли, тогда как греческое средне-пассивное причастие прежде всего выражает безопасное сохранение/спасение в ходе пути. Оно не требует подразумеваемого перевозчика и не ограничивается переправой через водные преграды.
  - severity: low
    issue: Единственное «это» для ἃς
    rationale: Греческое местоимение стоит во множественном числе женского рода. Безопаснее сохранить множественность нейтральным «их», не уточняя, что именно является антецедентом вне данного стиха.
