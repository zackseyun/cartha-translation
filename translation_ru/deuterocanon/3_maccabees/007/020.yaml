revisions:
- from: Записав это также на памятной стеле[a] и устроив место молитвы там, где был пир, они отправились в путь невредимыми, свободными и исполненными великой радости; по повелению царя их благополучно переправляли по суше, морю и рекам[b].
  to: Увековечив их на памятной стеле[a] и устроив место молитвы там, где был пир, они отправились в путь невредимыми, свободными и исполненными великой радости, благополучно возвращаясь по суше, морю и рекам по повелению царя[b].
  rationale: Исправлена формулировка о пути, чтобы передать безопасное сохранение/благополучное возвращение без невыраженного деятеля и без значения исключительно «переправы». Множественное «их» отражает форму ἃς, не делая контекстуально неоправданного уточнения антецедента. Сноски сохранены с приведением местоимения в соответствие основному тексту.
