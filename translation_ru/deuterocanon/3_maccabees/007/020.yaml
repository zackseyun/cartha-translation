base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/020.yaml
  text: After also inscribing these things on a pillar[a], and establishing a place of prayer at the site of the banquet, they departed unharmed, free, and overflowing with joy, being brought safely back by land and sea and rivers, by the king’s command[b],
translation:
  language: ru
  text: Увековечив их на памятной стеле[a] и устроив место молитвы там, где был пир, они отправились в путь невредимыми, свободными и исполненными великой радости, благополучно возвращаясь по суше, морю и рекам по повелению царя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвятив их на стеле». Греческое слово может означать публичное установление или посвящение памятной надписи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оставаясь невредимыми в пути по суше, морю и рекам». Греческое причастие подчёркивает безопасное сохранение во время путешествия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιερώσαντες
  choice: записав
  rationale: В сочетании с ἐν στήλῃ слово указывает на публичное увековечение сказанного на каменном памятнике; «записав» естественно передаёт действие, не исключая оттенка посвящения.
- source_word: στήλῃ
  choice: на памятной стеле
  rationale: Στήλη — установленная каменная плита или памятник с надписью. «Памятная стела» точнее, чем обычный «столб», и понятно современному читателю.
- source_word: κατὰ τὸν τῆς συμποσίας τόπον
  choice: там, где был пир
  rationale: Передаёт местное значение конструкции естественным современным русским языком.
- source_word: προσευχῆς ... καθιδρύσαντες
  choice: устроив место молитвы
  rationale: Глагол выражает устойчивое учреждение или обустройство, а не просто временное использование места.
- source_word: ἀνέλυσαν
  choice: отправились в путь
  rationale: Передаёт значение ухода или выступления в путь, не добавляя прямо не выраженного значения возвращения.
- source_word: ἀσινεῖς
  choice: невредимыми
  rationale: Точно выражает отсутствие вреда или повреждения.
- source_word: ἐλεύθεροι
  choice: свободными
  rationale: Сохраняет прямое значение освобождения и свободы.
- source_word: ὑπέρχαρεις
  choice: исполненными великой радости
  rationale: Передаёт усилительное значение сложного прилагательного в достойном литературном регистре.
- source_word: ἀνασωζόμενοι
  choice: их благополучно переправляли
  rationale: Средне-пассивное причастие подчёркивает безопасное проведение и сохранение в пути; формулировка не вводит не названного в этой части субъекта.
- source_word: διὰ τε γῆς καὶ θαλάσσης καὶ ποταμῶν
  choice: по суше, морю и рекам
  rationale: Сохраняет трёхчастное перечисление путей и множественное число ποταμῶν.
- source_word: τῇ τοῦ βασιλέως ἐπιταγῇ
  choice: по повелению царя
  rationale: Естественно и точно передаёт авторитетный приказ царя.
theological_decisions:
- issue: Характер действия у места пира
  choice: Постоянно устроенное место молитвы как памятное свидетельство избавления
  alternative: Временное обозначение места для молитвы
  rationale: Сочетание стелы с καθιδρύσαντες указывает на долговременное памятное устройство, но перевод не добавляет конфессионального статуса святилища.
- issue: Кем обеспечено безопасное путешествие
  choice: Сохранён пассивный смысл без прямого называния Бога действующим лицом; практическое обеспечение связано с царским повелением
  alternative: 'Явно назвать Бога спасителем или передать нейтрально: «оставаясь в безопасности»'
  rationale: Контекст книги связывает избавление с Богом, однако сама эта часть стиха не называет действующего субъекта и непосредственно упоминает царское повеление; двусмысленность сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис упрощён по сравнению с греческим периодом, но последовательность действий и богословская неопределённость сохранены. Все маркеры сносок присутствуют в основном тексте.
