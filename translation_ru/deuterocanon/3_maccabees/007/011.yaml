lexical_decisions:
- source_word: προφερόμενοι
  choice: заявляя
  rationale: Причастие вводит содержание публично выраженной позиции; «заявляя» естественно передаёт официальный и открытый характер высказывания.
- source_word: τοὺς γαστρὸς ἕνεκεν
  choice: к тем, кто ради чрева
  rationale: Сохранён конкретный и нравственно окрашенный образ «чрева», то есть уступки телесному аппетиту, без сужения смысла до одного лишь «пропитания».
- source_word: τὰ θεῖα παραβεβηκότας προστάγματα
  choice: преступил божественные повеления
  rationale: παραβαίνω обозначает нарушение или преступление установленного предписания, а θεῖα προστάγματα — повеления, имеющие божественное происхождение и авторитет.
- source_word: μηδέποτε εὐνοήσειν
  choice: никогда не проявят благосклонности
  rationale: εὐνοέω выражает благожелательное расположение или поддержку. Этот перевод сохраняет значение и позволяет не превращать его без достаточного основания в «повиноваться».
- source_word: μηδὲ τοῖς τοῦ βασιλέως προστάγμασιν
  choice: ни к царским указам
  rationale: Придворно-правовой контекст поддерживает перевод προστάγματα как «указы». Необычное сочетание с «проявлять благосклонность» сохранено, поскольку греческая фраза сжата и допускает разное понимание.
theological_decisions:
- issue: Референт и синтаксическая роль μηδὲ τοῖς τοῦ βασιλέως προστάγμασιν
  choice: 'Фраза передана как второй зависимый член при «проявят благосклонность»: ни к отступникам, ни к царским указам.'
  alternative: 'Возможно понимание: ни к отступникам, ни к тем, кто держался царских указов; либо: не станут поддерживать ни отступников, ни царские указы.'
  rationale: Дошедшая греческая формулировка синтаксически сжата и несколько неровна. Основной текст следует наиболее прямой структуре, не добавляя отсутствующего в греческом обозначения людей, а сноска честно сохраняет альтернативное прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой. Оборот «ради чрева» намеренно сохраняет яркий образ оригинала; синтаксическая неровность последней пары не сглажена за счёт добавления отсутствующего референта.
