  text: On that day they killed more than three hundred men[a], and they also made it a joyful celebration[b], having laid hands on the profane.
translation:
  language: ru
  text: В тот день они убили более трёхсот мужчин и с радостью отметили его как праздник, завладев осквернёнными.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительный оборот греческого текста труден. «Завладев осквернёнными» может также означать: «схватив профанных (непосвящённых)» или «одолев нечестивых».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεῖλον
  choice: убили
  rationale: Аорист ἀναιρέω в данном повествовательном контексте означает «убить»; современное и ясное русское соответствие без архаизации.
- source_word: ὑπὲρ τοὺς τριακοσίους ἄνδρας
  choice: более трёхсот мужчин
  rationale: Ὑπέρ с винительным указывает на превышение числа, а ἄνδρας прямо обозначает мужчин.
- source_word: ἤγαγον εὐφροσύνην μετὰ χαρᾶς
  choice: с радостью отметили его как праздник
  rationale: Буквально сочетание говорит о том, что они «устроили/провели веселье с радостью»; выбранная формулировка естественно передаёт празднование этого дня, не повторяя по-русски однокоренные слова.
- source_word: βεβήλους
  choice: нечестивых
  rationale: Субстантивированное βεβήλους характеризует людей как чуждых святыне, непочтительных к священному; «нечестивых» передаёт религиозно-нравственную оценку естественнее, чем буквальное «профанных».
- source_word: χειρωσάμενοι
  choice: одолев
  rationale: Причастие χειρόω может означать «захватить, подчинить, одолеть». «Одолев» сохраняет смысл овладения противниками и не вводит неестественную для русского двусмысленность выражения «наложив руки».
theological_decisions:
- issue: Религиозная характеристика βεβήλους
  choice: нечестивых
  alternative: осквернённых / непочтительных к святыне
  rationale: Слово выражает оценку повествователя, но не требует ввода более узкой конфессиональной категории.
- issue: Связь трудного заключительного оборота с празднованием
  choice: с радостью отметили его как праздник, одолев нечестивых
  alternative: устроили радостное празднество, захватив нечестивых
  rationale: Греческий текст синтаксически неровен. Перевод сохраняет обстоятельственное причастие и не уточняет сверх текста, было ли одоление причиной празднования или лишь предшествовавшим ему действием.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксическая трудность греческого заключительного оборота сохранена через краткое обстоятельственное причастие и пояснена в сноске.
