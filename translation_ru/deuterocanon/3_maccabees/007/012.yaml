base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/012.yaml
  text: And when he accepted that they were speaking the truth and encouraged them[a], he gave them full permission, so that they might destroy those who had transgressed the law of God throughout every place under his kingdom, with boldness[b], without any royal authority or oversight.
translation:
  language: ru
  text: Он же, признав, что они говорят правду, и ободрив их, дал им полное разрешение, чтобы они могли истребить преступивших закон Божий во всяком месте в пределах его царства, действуя смело[a], без какого бы то ни было царского полномочия и надзора.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открыто» или «с уверенностью»; греческое παρρησία может обозначать смелость, открытость и свободу высказывания или действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «без какой бы то ни было царской власти или проверки». Греческие ἐξουσία и ἐπίσκεψις могут означать соответственно полномочие (или санкционирование) и надзор (или инспекцию); фраза не уточняет, каким образом это соотносится с ранее данным разрешением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τἀληθὲς αὐτοὺς λέγειν
  choice: что они говорят правду
  rationale: Субстантивированное τἀληθές при λέγειν означает, что сказанное ими было признано истинным; естественное русское соответствие — «говорят правду».
- source_word: παραδεξάμενος
  choice: признав
  rationale: Причастие обозначает принятие их слов как достоверных; «признав» точно и естественно передаёт этот смысл.
- source_word: παραινέσας
  choice: ободрив их
  rationale: Глагол может означать увещевание, побуждение или ободрение. В контексте последующего разрешения «ободрив» передаёт поддержку действия, не усиливая её до приказа.
- source_word: ἄδειαν πάντων
  choice: полную свободу
  rationale: ἄδεια означает свободу действий или разрешение, а πάντων подчёркивает полноту предоставленного права.
- source_word: τοὺς παραβεβηκότας τοῦ θεοῦ τὸν νόμον
  choice: преступивших закон Божий
  rationale: Совершенное причастие παραβεβηκότας обозначает людей, уже нарушивших закон; традиционно-высокое, но понятное выражение «закон Божий» соответствует конструкции греческого текста.
- source_word: ἐξολεθρεύσωσιν
  choice: истребить
  rationale: Сильный глагол означает полное уничтожение. «Истребить» сохраняет суровость исходного текста и не заменяет действие более мягким «наказать».
- source_word: κατὰ πάντα τὸν ὑπὸ τῆς βασιλείας αὐτοῦ τόπον
  choice: во всех местах, подвластных его царству
  rationale: Передана распределительная широта действия по всей территории царства; формулировка естественна для современного литературного русского языка.
- source_word: μετὰ παρρησίας
  choice: действуя смело
  rationale: παρρησία выражает смелую, открытую и свободную манеру действия. Основной текст сохраняет компонент смелости, а иные оттенки отмечены в сноске.
- source_word: ἄνευ πάσης βασιλικῆς ἐξουσίας καὶ ἐπισκέψεως
  choice: без участия царской власти и без надзора с её стороны
  rationale: Фраза указывает на отсутствие непосредственного царского властного участия и контроля. Русская формулировка читается естественно, а буквальная неоднозначность ἐξουσία и ἐπίσκεψις сохранена в сноске.
theological_decisions:
- issue: Нравственно-богословская оценка насилия над нарушителями закона
  choice: Прямо сохранить сообщение о разрешении истребить преступивших закон Божий, не смягчая глагол и не добавляя оправдания.
  alternative: Передать действие словами «наказать» или «удалить».
  rationale: ἐξολεθρεύσωσιν прямо обозначает уничтожение. Перевод не должен ни смягчать насилие исходного текста, ни привносить отсутствующую в стихе богословскую оценку.
- issue: Соотношение данного царём разрешения с отсутствием царской власти и надзора
  choice: 'Сохранить напряжение: царь предоставляет свободу действий, но сам не участвует через власть и надзор.'
  alternative: Добавить «без дальнейшего царского разрешения», чтобы логически согласовать обе части.
  rationale: Слово «дальнейшего» отсутствует в греческом. Перевод не должен устранять возможную неоднозначность посредством скрытого добавления.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис упрощён относительно длинного греческого периода, но последовательность действий сохранена. «Истребить» намеренно передаёт силу исходного глагола; неоднозначные административно-правовые выражения не догматизированы.
