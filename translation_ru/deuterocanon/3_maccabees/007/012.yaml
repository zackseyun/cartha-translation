revisions:
- from: Он же, признав, что они говорят правду, и ободрив их, дал им полную свободу, чтобы они могли истребить преступивших закон Божий во всех местах, подвластных его царству, действуя смело[a], без участия царской власти и без надзора с её стороны.[b]
