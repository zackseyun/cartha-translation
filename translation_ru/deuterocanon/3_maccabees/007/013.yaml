base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/013.yaml
  text: Then the priests of these people and the whole multitude[a], having praised him as was fitting, cried out[b], “Hallelujah!” and departed with joy.
translation:
  language: ru
  text: 'Тогда священники этих людей и всё множество, прославив его[a], как подобало, возгласили: «Аллилуйя!»[b] — и с радостью разошлись.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «его», вероятнее всего, относится к Богу; в греческом тексте имя прямо не повторяется.
    reason: alternative_reading
  - marker: b
    text: Также пишется «Аллилуия»; греческий текст сохраняет древнееврейский богослужебный возглас.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατευφημήσαντες
  choice: прославив
  rationale: Причастие обозначает выраженную вслух хвалу или торжественное одобрение. «Прославив» естественно в контексте богопочитания и не сужает значение до конкретного обряда.
- source_word: αὐτόν
  choice: его
  rationale: В греческом стоит местоимение мужского рода в винительном падеже. Вероятнее всего, речь о Боге, однако имя существительное в самом стихе не повторено, поэтому местоименная форма сохранена.
- source_word: ὡς πρέπει ἦν
  choice: как подобало
  rationale: Оборот передаёт значение должного и уместного действия; выбранная формулировка сохраняет достоинство слога и значение прошедшего времени.
- source_word: οἱ τούτων ἱερεῖς
  choice: священники этих людей
  rationale: τούτων — указательное местоимение в родительном падеже множественного числа, буквально «этих». Перевод сохраняет указательное значение, не заменяя его простым «их».
- source_word: πᾶν τὸ πλῆθος
  choice: всё множество
  rationale: Сохраняются как значение совокупности в πᾶν, так и собирательный смысл πλῆθος.
- source_word: ἐπιφωνήσαντες
  choice: возгласили
  rationale: Глагол описывает громкое публичное восклицание. Личная форма делает длинную греческую причастную конструкцию естественной по-русски.
- source_word: ἀλληλουιά
  choice: Аллилуйя
  rationale: Сохранена освоенная в современном русском языке транслитерация древнееврейского богослужебного возгласа.
- source_word: μετὰ χαρᾶς
  choice: с радостью
  rationale: Прямо передаёт предложное сочетание и сохраняет существительное «радость».
- source_word: ἀνέλυσαν
  choice: разошлись
  rationale: В контексте завершения общего собрания глагол означает уход или расхождение собравшихся; «разошлись» естественно относится и к священникам, и ко всему множеству.
theological_decisions:
- issue: К кому относится αὐτόν
  choice: В основном тексте сохранено местоимение «его».
  alternative: «Бога»
  rationale: Контекст, вероятнее всего, указывает на Бога, но греческий текст употребляет местоимение, не называя референта прямо. Перевод сохраняет эту формальную неоднозначность, а пояснение даётся в сноске.
- issue: Передача ἀλληλουιά
  choice: «Аллилуйя»
  alternative: «Аллилуия»; «Хвалите Ях»
  rationale: Транслитерация сохраняет характер богослужебного возгласа и привычна современному русскому читателю; перевод значения внёс бы в основной текст отсутствующее в греческой форме разъяснение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Греческая цепочка причастий частично перестроена ради естественного русского синтаксиса; исходная последовательность действий сохранена.
