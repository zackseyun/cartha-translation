lexical_decisions:
- source_word: αὐτοὶ τε
  choice: И сами они
  rationale: 'Передаёт соединительную силу τε и эмфатическое αὐτοί: они лично участвовали в этих действиях.'
- source_word: τὸν ἐμπεσόντα
  choice: встретив ... кого-либо
  rationale: В дорожном контексте ἐμπίπτω обозначает случайную встречу; русская конструкция естественно передаёт причастный оборот и обобщённое единственное число.
- source_word: τῶν μεμιαμμένων
  choice: из осквернившихся
  rationale: Перфектное причастие от μιαίνω описывает людей, считавшихся подвергшимися осквернению; партитивный генитив передан предлогом «из».
- source_word: ὁμοεθνῆ
  choice: соплеменников
  rationale: Обозначает человека из того же народа; «соплеменник» точнее сохраняет этническую связь, чем современное политически окрашенное «соотечественник».
- source_word: κατὰ τὴν ὁδὸν
  choice: по дороге
  rationale: Естественное русское обозначение места и обстоятельства случайной встречи во время пути.
- source_word: ἀπέκτεννον
  choice: убивали
  rationale: Имперфект передан несовершенным видом, что сохраняет повторяемость действия.
- source_word: μετὰ παραδειγματισμῶν
  choice: делая его назидательным примером
  rationale: Передаёт идею показательной расправы ради публичного предостережения, не сводя выражение исключительно к позору; неоднозначность отмечена в сноске.
- source_word: ἀνήρουν
  choice: предавали смерти
  rationale: Сохраняет смертельный смысл ἀναιρέω и риторическое удвоение после ἀπέκτεννον без буквального повторения одного глагола.
