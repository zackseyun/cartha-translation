  source_fidelity: В основе переданы повторяемость действий, дорожное обстоятельство и намеренно усиленное, двукратное описание убийства. Однако «осквернившихся» ошибочно звучит как люди, осквернившие себя; греческое μεμιαμμένων — перфектное страдательное причастие, то есть «осквернённых» / «считавшихся осквернёнными». Конструкция «встретив» также несколько неопределённо меняет отношение ἐμπεσόντα к действующим лицам; «попадавшегося им» точнее сохраняет случайность встречи. «Делая ... назидательным примером» допустимо, но чрезмерно сводит μετὰ παραδειγματισμῶν к цели; формула «с показательной расправой» сохраняет как публично-предостерегающий, так и унизительный оттенок.
