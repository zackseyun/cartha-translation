    reason: lexical_alternative
lexical_decisions:
- source_word: πότον
  choice: пир
  rationale: В данном контексте слово обозначает не просто питьё, а торжественную общую трапезу после избавления.
- source_word: σωτήριον
  choice: в честь своего избавления
  rationale: Прилагательное связывает пир с пережитым спасением или избавлением. Такая передача естественна по-русски и не уточняет без основания, является ли слово благодарственным, целевым или описательным.
- source_word: χορηγήσαντος
  choice: снабдил
  rationale: Причастие выражает предоставление необходимого за свой счёт; оттенок щедрости передан наречием при εὐψύχως.
- source_word: εὐψύχως
  choice: великодушно
  rationale: Наречие указывает на охотное, благожелательное расположение при оказании помощи; «великодушно» естественно передаёт это применительно к царю.
- source_word: τὰ πρὸς τὴν ἄφιξιν πάντα
  choice: всем необходимым для пути
  rationale: Буквально речь идёт обо всём, что требовалось для достижения места назначения; последующая фраза уточняет, что этим местом был собственный дом каждого.
- source_word: ἑκάστῳ
  choice: каждого
  rationale: 'Сохранено распределительное значение: царь обеспечил каждого человека отдельно.'
- source_word: ἕως ἐπὶ τὴν ἰδίαν οἰκίαν
  choice: до самого его дома
  rationale: Передана протяжённость царского обеспечения вплоть до собственного дома каждого; единственное число сохранено благодаря распределительному «каждого».
theological_decisions:
- issue: Характер связи σωτήριον с пиром
  choice: пир в честь своего избавления
  alternative: спасительный пир; пир избавления
  rationale: Греческое прилагательное прямо связывает празднество со спасением, но не определяет точнее характер этой связи. Основной вариант звучит естественно по-русски, а буквальные альтернативы приведены в сноске.
translation_notes:
  register: Современный литературный русский язык; повествование выдержано в торжественном, но понятном регистре. Причинная конструкция с родительным абсолютным передана отдельной придаточной частью.
