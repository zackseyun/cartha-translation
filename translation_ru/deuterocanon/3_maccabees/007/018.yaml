  text: There they held a saving banquet[a], since the king had generously supplied each of them with everything for the journey, all the way to his own house.
translation:
  language: ru
  text: Там они устроили пир в честь своего избавления[a], потому что царь великодушно снабдил каждого всем необходимым для пути до самого дома каждого из них.
