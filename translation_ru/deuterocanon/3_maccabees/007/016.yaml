base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/016.yaml
  text: But those who had held fast to God even to death[a], having obtained complete deliverance, departed from the city, strewn with all kinds of very fragrant flowers, with rejoicing and shouting, giving thanks with praises and full songs of hymns to God, the holy Savior of Israel[b], the God of their fathers.
translation:
  language: ru
  text: А те, кто оставался верен Богу до самой смерти, обретя полное избавление[a], вышли из города, осыпанные всевозможными необычайно благоуханными цветами. Они шли с радостью и громкими возгласами, воздавая Богу благодарность хвалами и полнозвучными гимнами — Богу своих отцов, святому Спасителю Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обретя полное спасение». Греческое σωτηρία здесь может означать как конкретное избавление от опасности, так и спасение в более широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «святому Избавителю Израиля». Греческое σωτήρ может обозначать как Спасителя, так и избавителя от непосредственной опасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέχρι θανάτου τὸν θεὸν ἐσχηκότες
  choice: оставался верен Богу до самой смерти
  rationale: Буквальное значение ἔχω здесь передаёт стойкую приверженность Богу, а не обладание Им. «До самой смерти» сохраняет предельную силу выражения, не утверждая, что эти люди действительно умерли.
- source_word: παντελῆ σωτηρίαν ἀπόλαυσιν ἐσχηκότες
  choice: обретя полное избавление
  rationale: В повествовательном контексте σωτηρία прежде всего означает спасение от грозившей гибели; «избавление» естественно передаёт этот смысл, а определение «полное» отражает παντελής.
- source_word: ἀνέζευξαν ἐκ τῆς πόλεως
  choice: вышли из города
  rationale: ἀναζεύγνυμι обозначает выступление в путь или уход; здесь речь идёт о торжественном выходе из города.
- source_word: παντοίοις εὐωδεστάτοις ἄνθεσι κατεστρωμένοι
  choice: осыпанные всевозможными необычайно благоуханными цветами
  rationale: Оборот изображает участников шествия покрытыми или украшенными цветами. «Необычайно благоуханными» передаёт превосходную степень εὐωδεστάτοις без неестественного русского буквализма.
- source_word: μετʼ εὐφροσύνης καὶ βοῆς
  choice: с радостью и громкими возгласами
  rationale: εὐφροσύνη означает праздничную радость, а βοή — громкий крик или возглас.
- source_word: ἐν αἴνοις καὶ παμμελέτοις ὕμνοις
  choice: хвалами и многозвучными гимнами
  rationale: Редкое παμμελέτοις подчёркивает полноту и богатство музыкального звучания; «многозвучными» сохраняет возвышенный музыкальный образ, не уточняя способ исполнения сверх текста.
- source_word: τῷ θεῷ τῶν πατέρων αὐτῶν
  choice: Бога своих отцов
  rationale: Сохранено традиционное библейское обозначение Бога предков и греческий порядок, при котором последующие слова являются приложением.
- source_word: ἁγίῳ σωτῆρι τοῦ Ἰσραήλ
  choice: святого Спасителя Израиля
  rationale: σωτήρ одновременно указывает на совершённое избавление и служит торжественным именованием Бога; «Спаситель» сохраняет оба оттенка.
theological_decisions:
- issue: Передача σωτηρία и σωτήρ в рассказе о конкретном избавлении
  choice: σωτηρία передано как «избавление», а титульное σωτήρ — как «Спаситель»
  alternative: 'Передать оба слова одним корнем: «спасение / Спаситель» либо «избавление / Избавитель»'
  rationale: Так различаются непосредственное историческое избавление и торжественное именование Бога, при этом смысловая связь между ними не отрицается.
- issue: Связь заключительных наименований Бога
  choice: «Бога своих отцов — святого Спасителя Израиля»
  alternative: 'Переставить приложения: «Бога, святого Спасителя Израиля, Бога своих отцов»'
  rationale: Выбранный порядок непосредственно отражает греческое τῷ θεῷ τῶν πατέρων αὐτῶν ἁγίῳ σωτῆρι τοῦ Ἰσραήλ и ясно показывает, что оба наименования относятся к одному Богу.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным звучанием. Длинное греческое предложение разделено на два ради ясности; причастная структура и порядок заключительных божественных наименований сохранены по смыслу. Все сноски отмечены в основном тексте.
