base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/010.yaml
  text: But when they received this letter[a], they did not immediately hasten about the departure; instead, they urged the king that those from the Jewish race who had willfully transgressed the law of the holy God might, through them[c][b], receive the punishment that was due.
translation:
  language: ru
  text: Получив это письмо, они не поспешили сразу с отъездом[a], но обратились к царю с просьбой, чтобы те из народа иудеев, кто по собственной воле преступил против святого Бога и нарушил Божий закон, понесли от их рук[b] заслуженное наказание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с возвращением». Греческое слово может обозначать отбытие из нынешнего места или возвращение в прежнее.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «через них»; то есть при их посредстве или от их рук.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαβόντες δὲ τὴν ἐπιστολὴν ταύτην
  choice: Получив это письмо
  rationale: Аористное причастие обозначает действие, предшествующее основному; деепричастная конструкция естественна по-русски и сохраняет связь повествования, переданную δέ.
- source_word: οὐκ ἐσπούδασαν εὐθέως περὶ τὴν ἄφοδον
  choice: они не стали сразу спешить с отъездом
  rationale: ἐσπούδασαν передаёт поспешность или рвение, εὐθέως — немедленность. ἄφοδος может означать как отбытие, так и возвращение; в основном тексте выбрано естественное для непосредственного действия «отъездом», а иной ракурс отмечен в сноске.
- source_word: προσηξίωσαν
  choice: обратились к царю с просьбой
  rationale: Глагол обозначает настойчивое или почтительное прошение. Русская конструкция яснее буквального «сочли достойным просить» и не преувеличивает силу требования.
- source_word: τοὺς ἐκ τοῦ γένους τῶν Ἰουδαίων
  choice: те из народа иудеев
  rationale: γένος здесь обозначает происхождение и принадлежность к народу. Такой перевод сохраняет этнический смысл без неестественного для современного русского выражения «из рода иудеев».
- source_word: αὐθαιρέτως
  choice: по собственной воле
  rationale: Наречие подчёркивает добровольный, сознательно избранный характер проступка; перевод не добавляет оттенка случайности или принуждения.
- source_word: τὸν ἅγιον θεὸν … παραβεβηκότας τοῦ θεοῦ τὸν νόμον
  choice: согрешил против святого Бога и нарушил Божий закон
  rationale: Греческий текст отдельно называет святого Бога и Божий закон, тогда как консультационный английский слой ошибочно сводит их к единому выражению «закон святого Бога». По-русски разные дополнения естественно переданы подходящими глагольными сочетаниями при сохранении одного сложного обвинения.
- source_word: τυχεῖν διʼ αὐτῶν τῆς ὀφειλομένης κολάσεως
  choice: понесли от их рук заслуженное наказание
  rationale: τυχεῖν с родительным означает получить или испытать нечто, ὀφειλομένης — должное, заслуженное. διʼ αὐτῶν инструментально указывает, что наказание должно совершиться через просителей; «от их рук» естественно передаёт этот смысл, а более буквальная возможность приведена в сноске.
theological_decisions:
- issue: Отдельное упоминание святого Бога и Божьего закона
  choice: «согрешил против святого Бога и нарушил Божий закон»
  alternative: «нарушил закон святого Бога»
  rationale: 'В исходном греческом присутствуют два отдельных винительных выражения: τὸν ἅγιον θεὸν и τοῦ θεοῦ τὸν νόμον. Перевод сохраняет обвинение и против Бога, и против Его закона, не следуя сокращению в английском консультационном тексте.'
- issue: Кем осуществляется наказание
  choice: «от их рук» с указанием неоднозначности в сноске
  alternative: «через них»
  rationale: διʼ αὐτῶν допускает инструментальное понимание как действия просителей, но само по себе может означать и более общее посредничество. Основной перевод отражает наиболее естественный контекстуальный смысл, не скрывая более буквальной возможности.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Синтаксис упрощён лишь настолько, чтобы длинная греческая фраза оставалась понятной обычному читателю. Сохранены сознательный характер отступничества, святость Бога, юридический оттенок заслуженного наказания и неоднозначность слов ἄφοδος и διʼ αὐτῶν.
