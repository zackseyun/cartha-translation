base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/005.yaml
  text: These men[a], after bringing them down in chains with abuse, as servants—or rather, as conspirators—attempted to destroy them without any hearing or examination[c][b], having clothed themselves in a savagery more brutal than the law of the Scythians.
translation:
  language: ru
  text: Они, приведя их в оковах и с издевательствами, как рабов — вернее, как заговорщиков, — без всякого допроса и расследования попытались убить их, проникнувшись жестокостью, более свирепой, чем закон скифов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чем закон скифов». Греческое слово νόμος может означать как закон, так и обычай; скифы в античной риторике нередко служили образом крайней жестокости.'
    reason: cultural_note
lexical_decisions:
- source_word: δεσμίους καταγαγόντες αὐτούς
  choice: приведя их связанными
  rationale: Сохраняет конкретное значение δεσμίους — находящихся в узах — и передаёт κατάγω как перемещение под стражей, не вводя неизвестного из контекста направления.
- source_word: μετὰ σκυλμῶν
  choice: и подвергнув издевательствам
  rationale: В данном контексте σκυλμός обозначает унизительное, жестокое обращение; «издевательства» естественно передаёт отношение к пленникам, не сводя выражение к разграблению.
- source_word: ὡς ἀνδράποδα
  choice: словно рабов
  rationale: ἀνδράποδον обозначает человека, обращённого в рабство и низведённого до положения живой добычи; «рабов» сохраняет дегуманизирующую силу слова.
- source_word: μᾶλλον δὲ ὡς ἐπιβούλους
  choice: вернее, словно заговорщиков
  rationale: μᾶλλον δέ вводит риторическое уточнение с усилением, а ἐπίβουλος здесь указывает на людей, подозреваемых во враждебном умысле.
- source_word: ἄνευ πάσης ἀνακρίσεως καὶ ἐξετάσεως
  choice: без всякого допроса и расследования
  rationale: Парные слова имеют судебно-следственный оттенок и подчёркивают полное отсутствие проверки обвинений и надлежащего разбирательства.
- source_word: ἐπεχείρησαν ἀνελεῖν
  choice: попытались убить их
  rationale: В данном контексте ἀναιρέω означает лишить жизни; прямое «убить» точнее и яснее эвфемистического «уничтожить».
- source_word: νόμου Σκυθῶν ἀγριοτέραν
  choice: более дикой, чем обычаи скифов
  rationale: νόμος может означать не только писаный закон, но и установившийся обычай; в сравнении со скифами именно «обычаи» звучит естественно и сохраняет культурную аллюзию.
- source_word: ἐνπεπηρμένοι ὠμότητα
  choice: проникшись жестокостью
  rationale: Трудное образное выражение описывает состояние людей, охваченных или наделённых жестокостью. «Проникшись» сохраняет образ внутреннего усвоения, не приписывая спорной форме чрезмерно точной метафоры.
theological_decisions:
- issue: Дегуманизирующее обозначение ἀνδράποδα
  choice: рабов
  alternative: пленников; живую добычу
  rationale: Контекст говорит не просто о пленении, а об обращении с людьми как с порабощённой добычей. Более мягкое «пленников» ослабило бы обвинительную силу текста.
- issue: Смысл νόμος в выражении νόμου Σκυθῶν
  choice: обычаи скифов
  alternative: закон скифов
  rationale: Греческое νόμος допускает оба значения. Здесь сравнительная риторика, вероятнее всего, отсылает к приписываемым скифам жестоким обычаям, а не к конкретному законодательному акту; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной обвинительной риторики. Длинный греческий период передан одним предложением; тире выделяют авторское усиление «вернее». Термины следствия выбраны понятными современному читателю, без чрезмерной юридической специализации.
