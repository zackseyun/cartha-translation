lexical_decisions:
- source_word: προφερόμενοι
  choice: утверждая
  rationale: Причастие вводит выдвигаемое ими утверждение; «утверждая» естественно передаёт этот смысл, не усиливая оттенок до «обвиняя».
- source_word: μηδέποτε
  choice: никогда
  rationale: Передаёт абсолютное отрицание прямо и естественно.
- source_word: εὐσταθήσειν τὰ πράγματα ἡμῶν
  choice: наши дела никогда не будут в безопасности
  rationale: Глагол выражает устойчивость и прочность положения; в общественно-политическом контексте сочетание «дела будут в безопасности» передаёт благополучное и устойчивое состояние, хотя по-русски несколько ближе к контексту также было бы «наше положение не станет устойчивым».
- source_word: διʼ ἣν ἔχουσιν οὗτοι πρὸς τὰ ἔθνη δυσμένειαν
  choice: из-за враждебности, которую эти люди питают к другим народам
  rationale: δυσμένεια означает враждебность или неприязнь; «питают» естественно сочетается с «враждебностью». Добавление «другим» ясно выражает противопоставление упомянутой группы окружающим народам, подразумеваемое контекстом.
- source_word: τὰ ἔθνη
  choice: другим народам
  rationale: ἔθνη допускает значения «народы» и, в иудейской речи, «язычники». Основной текст сохраняет широкое этническое значение, а альтернативный смысл отмечен в сноске.
- source_word: μέχρι ἂν συντελεσθῇ τοῦτο
  choice: пока это не будет доведено до конца
  rationale: συντελεσθῇ обозначает завершение или полное осуществление; формулировка сохраняет неопределённость указательного τοῦτο.
theological_decisions:
- issue: Значение τὰ ἔθνη
  choice: другим народам
  alternative: язычникам
  rationale: В данном политическом обвинении греческое выражение может относиться к окружающим народам вообще, хотя в иудейском употреблении возможно и значение «язычники». Неоднозначность сохранена сноской, без привнесения позднейшего богословского противопоставления.
