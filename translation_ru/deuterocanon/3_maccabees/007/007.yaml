base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/007.yaml
  text: Considering that he has always fought alongside us like a father for his sons[a], and reckoning the firm goodwill they have toward us and our forefathers as that of a friend[b], we have rightly released them in every way from any charge whatever.
translation:
  language: ru
  text: Принимая во внимание, что он всегда сражался на нашей стороне, как отец за сыновей, и учитывая неизменную благосклонность друга, которую они питают к нам и нашим предкам[a], мы по справедливости полностью освободили их от любых возможных обвинений или оснований для них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение буквально включает слово «друга»; его синтаксическая связь с «благосклонностью» и «они» сжата и не вполне однозначна. Возможен смысл: «неизменную дружескую благосклонность, которую они питают…».'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Заключительная греческая формула подчёркнуто всеохватна: освобождение относится к любому возможному обвинению, основанию или поводу для него.'
    reason: clarification
lexical_decisions:
- source_word: ὡς πατέρα ὑπὲρ υἱῶν
  choice: как отец за сыновей
  rationale: ὡς с винительным вводит сравнение, а ὑπέρ передаёт действие в защиту или на благо сыновей. Притяжательное местоимение в греческом не выражено, поэтому по-русски сохранена формулировка без добавления «своих».
- source_word: διὰ παντὸς συμμαχοῦντα
  choice: всегда сражался на нашей стороне
  rationale: διὰ παντός обозначает постоянство, а συμμαχέω — совместную борьбу или союзническую помощь. Выбранный вариант сохраняет военный оттенок и подразумеваемую помощь говорящим.
- source_word: τήν τε τοῦ φίλου ... βεβαίαν ... εὔνοιαν
  choice: неизменную дружескую благосклонность
  rationale: βεβαίαν передаёт устойчивость и надёжность, εὔνοιαν — благожелательное расположение, а τοῦ φίλου характеризует его как дружеское. Такая формулировка естественна по-русски и не вводит лишнего конкретного лица.
- source_word: ἣν ἔχουσιν ... πρὸς ἡμᾶς καὶ τοὺς προγόνους ἡμῶν
  choice: которую они питают к нам и нашим предкам
  rationale: Оборот ἔχειν εὔνοιαν πρὸς означает питать благосклонность к кому-либо; προγόνους — предки.
- source_word: ἀναλογιζόμενοι
  choice: принимая во внимание; учитывая
  rationale: Причастие обозначает обдуманное принятие обстоятельств в расчёт. Повторное русское деепричастие помогает ясно связать обе причины последующего решения.
- source_word: δικαίως ἀπολελύκαμεν
  choice: мы по справедливости полностью освободили
  rationale: δικαίως указывает на справедливость решения; перфект ἀπολελύκαμεν выражает совершившееся освобождение с сохраняющимся результатом. «Полностью» передаёт всеохватность следующей усиленной конструкции.
- source_word: πάσης καθʼ ὁντινοῦν αἰτίας τρόπον
  choice: от всякого обвинения
  rationale: Нагромождённая усилительная формула охватывает любое возможное основание для обвинения. Естественный русский юридический эквивалент — полное освобождение от всякого обвинения; усиление дополнительно выражено словом «полностью».
theological_decisions:
- issue: Референт единственного числа в συμμαχοῦντα
  choice: Он
  alternative: он
  rationale: Причастие мужского рода единственного числа относится к ранее названному лицу; прописная буква уместна, если в ближайшем контексте это Бог, однако сам данный стих имени не повторяет. Формулировка не добавляет имени и сохраняет анафорическую связь.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского постановления. Синтаксис упрощён ровно настолько, чтобы длинная греческая периодическая конструкция оставалась понятной; смена числа («Он» — «они») сохранена. Юридическая сила заключения передана естественной русской формулой.
