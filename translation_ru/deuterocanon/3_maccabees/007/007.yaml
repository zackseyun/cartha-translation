revisions:
- from: Принимая во внимание, что Он всегда сражался на нашей стороне, как отец за сыновей[a], и учитывая неизменную дружескую благосклонность, которую они питают к нам и нашим предкам, мы по справедливости полностью освободили их от всякого обвинения[b].
  to: Принимая во внимание, что он всегда сражался на нашей стороне, как отец за сыновей, и учитывая неизменную благосклонность друга, которую они питают к нам и нашим предкам[a], мы по справедливости полностью освободили их от любых возможных обвинений или оснований для них[b].
