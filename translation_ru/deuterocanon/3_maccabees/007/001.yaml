  text: 'King Ptolemy Philopator to the generals in Egypt and to all who are appointed over affairs: greetings and good health[a][b].'
translation:
  language: ru
  text: 'Царь Птолемей Филопатор — военачальникам в Египте[a] и всем, назначенным ведать делами: приветствие и пожелание здоровья.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «военачальникам по всему Египту»; греческое выражение может указывать на их распределение по Египту.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «радоваться и быть здоровыми»; это обычная греческая формула приветствия и пожелания благополучия в начале письма.'
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεὺς
  choice: Царь
  rationale: Существительное без артикля выступает как царский титул в заголовке письма; «царь» естественно для русской библейской и исторической речи.
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: Птолемей Филопатор
  rationale: Имя и эпитет переданы традиционной русской транслитерацией, без перевода значения эпитета.
- source_word: τοῖς κατʼ Αἴγυπτον στρατηγοῖς
  choice: военачальникам по всему Египту
  rationale: 'στρατηγοῖς сохраняет военно-административный титул, а κατʼ Αἴγυπτον передано дистрибутивно: речь идёт о должностных лицах, находящихся в разных местах Египта.'
- source_word: πᾶσιν τοῖς τεταγμένοις ἐπὶ πραγμάτων
  choice: всем поставленным во главе государственных дел
  rationale: τεταγμένοις обозначает назначенных или поставленных лиц; ἐπὶ πραγμάτων указывает на ответственность за административные дела. Добавление «государственных» естественно выявляет официальный контекст, не сводя выражение к узкой должности.
- source_word: χαίρειν καὶ ἐρρῶσθαι
  choice: приветствие и пожелание здравствовать
  rationale: 'Оба инфинитива образуют официальную эпистолярную формулу: приветствие и пожелание благополучия или здоровья. Русская формулировка сохраняет оба элемента и звучит естественно в царском послании.'
