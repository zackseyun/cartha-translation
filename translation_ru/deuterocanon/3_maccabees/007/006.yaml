  yaml_path: translation/deuterocanon/3_maccabees/007/006.yaml
  text: But we[a], after threatening them more harshly on account of these things, in keeping with the clemency we have toward all people, scarcely granted them their lives, and, recognizing that the heavenly God had surely defended the Jews[b],
translation:
  language: ru
  text: Мы же за это пригрозили им ещё суровее и, по свойственной нам снисходительности ко всем людям, едва оставили их в живых[a]; признав же, что небесный Бог[b] несомненно защитил иудеев,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к греческому: «едва даровали им жизнь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бог небес». Слово «несомненно» можно также понимать в смысле действенности защиты: «надёжно защитил».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἐπὶ τούτοις
  choice: за это
  rationale: Оборот указывает на основание угроз — на упомянутые ранее обстоятельства, а не задаёт сравнение.
- source_word: σκληρότερον διαπειλησάμενοι
  choice: пригрозили им ещё суровее
  rationale: Сравнительная форма передаёт усиление суровости, а глагол обозначает решительно высказанную угрозу; деепричастная конструкция преобразована в личную ради естественного русского синтаксиса.
- source_word: ἐπιείκειαν
  choice: снисхождению
  rationale: В царском административном контексте слово означает мягкость и воздержание от крайней меры; «снисхождение» сохраняет этот оттенок без конфессиональной окраски.
- source_word: μόγις τὸ ζῆν αὐτοῖς χαρισάμενοι
  choice: едва даровали им жизнь
  rationale: Формулировка близка греческой конструкции и передаёт предельность либо неохотность уступки; более идиоматическое «пощадили их» дано в примечании.
- source_word: ἐπουράνιον θεόν
  choice: небесный Бог
  rationale: Сохранена греческая адъективная конструкция и возвышенный регистр; возможное идиоматическое соответствие отмечено в примечании.
- source_word: ἐγνωκότες
  choice: признав
  rationale: Перфектное причастие выражает достигнутое и устойчивое признание на основании произошедшего.
- source_word: ἀσφαλῶς ὑπερησπικότα
  choice: надёжно защитил
  rationale: Наречие естественно отнесено к действенности защиты, а перфект передаёт уже совершившееся заступничество с очевидным результатом.
theological_decisions:
- issue: Передача ἐπουράνιον θεόν
  choice: небесный Бог
  alternative: Бог небес
  rationale: Основной вариант сохраняет форму греческого прилагательного и не превращает выражение в более привычный библейский титул; допустимая идиоматическая альтернатива вынесена в примечание.
- issue: Степень идиоматизации τὸ ζῆν αὐτοῖς χαρισάμενοι
  choice: едва даровали им жизнь
  alternative: лишь с трудом пощадили их
  rationale: Основной текст сохраняет образ дарования жизни и неоднозначность μόγις между трудностью и неохотностью, не сводя выражение полностью к русской идиоме.
- issue: Связь наречия ἀσφαλῶς
  choice: надёжно защитил
  alternative: несомненно защитил
  rationale: Порядок слов позволяет понимать наречие как характеристику действенности защиты, хотя возможен и оттенок уверенности говорящего; эта синтаксико-смысловая неоднозначность отмечена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством царского официального заявления. Длинная периодическая конструкция и завершающая запятая сохранены, поскольку стих синтаксически продолжается далее.
