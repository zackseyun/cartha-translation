  yaml_path: translation/deuterocanon/3_maccabees/007/019.yaml
  text: And after they had been brought down in peace[a], with the fitting thanksgivings[b], there also they resolved to keep these days as joyful ones for the whole time of their sojourning.
translation:
  language: ru
  text: После того как их благополучно доставили и они вознесли подобающие благодарения[a], они и там постановили праздновать эти дни как дни радости на всё время своего пребывания на чужбине[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с подобающими хвалами (исповеданиями)». Греческое слово может означать исповедание, хвалу или благодарение; праздничный контекст указывает здесь прежде всего на благодарение.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово обозначает проживание вне родины — в положении пришельцев или временных жителей; оно не обязательно подразумевает формальное изгнание.
    reason: cultural_note
lexical_decisions:
- source_word: καταχθέντες δὲ μετʼ εἰρήνης
  choice: И, благополучно возвратившись
  rationale: Κατάγω в данном контексте обозначает возвращение или доставление назад, а μετʼ εἰρήνης — безопасное, мирное завершение пути. «Благополучно возвратившись» естественно передаёт сочетание, не навязывая буквальный образ движения вниз.
- source_word: ἐν ταῖς πρεπούσαις ἐξομολογήσεσιν
  choice: с подобающими благодарениями
  rationale: В праздничном контексте ἐξομολόγησις вероятнее означает благодарение или хвалу, а не исповедание грехов. Неоднозначность отмечена в сноске.
- source_word: ὡσαύτως κἀκεῖ ἔστησαν
  choice: и там постановили
  rationale: Ἵστημι с инфинитивом здесь выражает твёрдое решение или установление обычая; «постановили» сохраняет официальный оттенок.
- source_word: ἄγειν τὰς ἡμέρας ... εὐφροσύνους
  choice: праздновать эти дни как радостные
  rationale: Ἄγειν применительно к праздничным дням означает отмечать или праздновать их; εὐφροσύνους характеризует сами дни как радостные.
- source_word: ἐπὶ τὸν τῆς παροικίας αὐτῶν χρόνον
  choice: во всё время своего пребывания на чужбине
  rationale: Παροικία обозначает проживание не на родине, положение пришельцев или временных жителей. «Пребывание на чужбине» передаёт этот оттенок, не усиливая его до формального изгнания.
