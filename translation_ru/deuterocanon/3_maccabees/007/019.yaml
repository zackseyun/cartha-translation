revisions:
- from: И, благополучно возвратившись, они с подобающими благодарениями[a] и там постановили праздновать эти дни как радостные во всё время своего пребывания на чужбине[b].
  to: После того как их благополучно доставили и они вознесли подобающие благодарения[a], они и там постановили праздновать эти дни как дни радости на всё время своего пребывания на чужбине[b].
  rationale: Правка устраняет синтаксическую двусмысленность и улучшает естественность русского текста. Пассивное «их благополучно доставили» ближе к καταχθέντες, чем «возвратившись», а «как дни радости» и «на всё время» точнее и плавнее передают заключительную часть греческой фразы. Сноски сохранены с прежними якорями и содержанием.
