  - severity: medium
    issue: Неясная синтаксическая связь «с подобающими благодарениями».
    rationale: В оригинале этот оборот характеризует обстоятельства прибытия/доставления, а русское расположение после «они» может отнести его к «постановили».
  - severity: low
    issue: Неестественное сочетание «во всё время».
    rationale: Для обозначения длительности по-русски нормативнее и естественнее «на всё время».
  - severity: low
    issue: Фраза «праздновать эти дни как радостные» стилистически шероховата.
    rationale: «Как дни радости» естественно выражает, что эти дни должны отмечаться радостно.
