  source_fidelity: 'Смысловой каркас передан верно: условное предупреждение, злоумышление или причинение скорби, а также противопоставление человека и Всевышнего Бога сохранены. Однако придаточное «который воздаст за эти дела» вносит в греческую конструкцию относительное определение, которого в оригинале нет: ἐπʼ ἐκδίκησιν относится к тому, что Бог будет иметь виновных против себя для возмездия. Кроме того, «неизбежно» не вполне передаёт усиленную формулу κατὰ πᾶν ἀφεύκτως («во всём/совершенно неотвратимо, без возможности избежать»).'
