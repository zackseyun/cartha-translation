base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/009.yaml
  text: For know that if we devise any evil against these people, or grieve them in any way at all, we will have against us for vengeance in these matters, utterly without escape and forever, not a man but God Most High, the one who rules over all power. Farewell.
translation:
  language: ru
  text: 'Ибо знайте: если мы замыслим против этих людей какое-либо зло или хоть чем-нибудь причиним им скорбь, то будем иметь против себя для возмездия за эти дела не человека, а Всевышнего Бога, Владыку всякой силы, — совершенно неотвратимо и навсегда. Будьте здоровы.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακοτεχνήσωμεν πονηρόν
  choice: замыслим… какое-либо зло
  rationale: Передаёт намеренное злоумышление, выраженное глаголом κακοτεχνέω, и сохраняет усиление прилагательным πονηρόν.
- source_word: ἐπιλυπήσωμεν
  choice: причиним им скорбь
  rationale: Сохраняет смысл огорчения или причинения страдания, не сужая его до физического вреда.
- source_word: τὸ σύνολον
  choice: хоть чем-нибудь
  rationale: 'В данном наречном употреблении выражение усиливает всеохватность запрета: «вообще, каким бы то ни было образом».'
- source_word: ἀντικείμενον ἡμῖν
  choice: своим противником… обретём
  rationale: Передаёт Бога именно как того, кто встанет против виновных, сохраняя структуру противопоставления «не человека, а… Бога».
- source_word: τὸν πάσης δεσπόζοντα δυνάμεως θεὸν ὕψιστον
  choice: Всевышнего Бога, Владыку всякой силы
  rationale: Сохраняет титул «Всевышний Бог» и причастную характеристику Бога как господствующего над всякой силой.
- source_word: ἐρρῶσθε
  choice: Будьте здоровы
  rationale: Естественная русская передача формулы завершения официального письма или указа.
theological_decisions:
- issue: Бог как противник и исполнитель возмездия
  choice: «своим противником, который воздаст за эти дела, … обретём … Всевышнего Бога»
  alternative: «будем иметь против себя для отмщения… Всевышнего Бога»
  rationale: Выбранная формулировка ясно сохраняет утверждение текста о Божьем личном противодействии и воздаянии, не добавляя объяснения механизма суда.
- issue: πάσης… δυνάμεως
  choice: «всякой силы»
  alternative: «всего воинства» или «всей власти»
  rationale: Слово δύναμις допускает оттенки силы, могущества или воинства; более широкое «всякой силы» сохраняет исходную смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского послания. Синтаксис несколько упорядочен ради ясности, но противопоставление «не человека, а Всевышнего Бога» и категоричность «неизбежно и навеки» сохранены.
