lexical_decisions:
- source_word: Εὐλογητός
  choice: Благословен
  rationale: Традиционное и естественное для славословия соответствие греческому отглагольному прилагательному со значением «достоин благословения, прославляем».
- source_word: ὁ ῥύστης
  choice: Избавитель
  rationale: Передаёт обозначение того, кто спасает или избавляет от опасности; определённый артикль отражён контекстуально, без неестественного отдельного указательного слова.
- source_word: Ἰσραήλ
  choice: Израиля
  rationale: 'Родительный падеж сохраняет зависимость от «Избавитель»: тот, кто избавляет Израиль.'
- source_word: εἰς τοὺς ἀεὶ χρόνους
  choice: во веки
  rationale: Краткая, возвышенная и понятная формула вечной длительности, соответствующая буквальному смыслу «на всегдашние времена».
- source_word: ἀμήν
  choice: Аминь
  rationale: Устоявшаяся русская передача литургического подтверждения.
theological_decisions:
- issue: Не назван субъект славословия
  choice: Сохранено обозначение «Избавитель Израиля» без добавления слова «Бог» или имени Господа
  alternative: «Благословен Бог, Избавитель Израиля»
  rationale: В греческом тексте субъект выражен титулом ὁ ῥύστης; уточнение личности было бы истолковательным добавлением.
- issue: Временной охват εἰς τοὺς ἀεὶ χρόνους
  choice: «во веки»
  alternative: «на все времена»
  rationale: Выбранная формула сохраняет смысл неограниченной длительности и характер заключительного славословия, не вводя дополнительных богословских уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис краток и следует форме греческого славословия; архаическая формула «во веки» сохранена как общеупотребительная в библейском контексте.
