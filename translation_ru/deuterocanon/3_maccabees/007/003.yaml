base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/003.yaml
  text: Some of our friends[a], being more constantly at our side out of malice, persuaded us that the Jews under our rule, after being gathered together in groups[b], should be punished with unusual penalties as rebels.
translation:
  language: ru
  text: Некоторые из наших друзей[a], которые из злого умысла особенно часто были при нас, убедили нас собрать иудеев, находившихся под нашей властью, в группы[b] и наказать их необычайными карами[c] как мятежников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В царском контексте «друзья» могли означать также приближённых или придворных советников.
    reason: historical_context
  - marker: b
    text: 'Или: «в организованные объединения»; греческое слово может обозначать группу, объединение или организованное сообщество, и его точный смысл здесь не вполне ясен.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «невиданными наказаниями»; греческое выражение описывает кары как непривычные, поразительные или чрезвычайные.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν φίλων τινές
  choice: некоторые из наших друзей
  rationale: Обычное значение φίλοι — «друзья»; в царском окружении это слово могло также обозначать приближённых или придворных советников, что отмечено в сноске без чрезмерного уточнения в основном тексте.
- source_word: κατὰ κακοήθειαν
  choice: из злого умысла
  rationale: Оборот выражает злонамеренность, недоброжелательность или порочность побуждений; «из злого умысла» естественно передаёт мотив.
- source_word: πυκνότερον ἡμῖν παρακείμενοι
  choice: всё настойчивее находившиеся при нас
  rationale: παράκειμαι указывает на близость или постоянное пребывание рядом, а сравнительное πυκνότερον — на учащённость либо усиление такого присутствия. Русская формулировка передаёт постоянный доступ и нажим, не сводя выражение только к пространственной близости.
- source_word: συνέπεισαν ἡμᾶς
  choice: убедили нас
  rationale: Глагол означает «совместно убедить, склонить, уговорить»; нейтральное «убедили» ясно и соответствует контексту.
- source_word: τοὺς ὑπὸ τὴν βασιλείαν Ἰουδαίους
  choice: подвластных нашему царству иудеев
  rationale: Оборот обозначает иудеев, находившихся под властью говорящего царя. Эта формулировка сохраняет политико-административный смысл βασιλεία.
- source_word: συναθροίσαντας τὰ συστήματα
  choice: собрать … в отдельные группы
  rationale: Синтаксис греческого выражения с активным причастием συναθροίσαντας труден, однако оно естественно понимается как действие царской власти по сосредоточению иудеев; σύστημα обозначает объединение, организованную группу или совокупность. Неопределённость отмечена в сноске.
- source_word: κολάζεσθαι
  choice: покарать их
  rationale: По смыслу предложения речь идёт о наказании иудеев по внушению приближённых. «Покарать» соответствует торжественному повествовательному регистру и силе государственного наказания.
- source_word: ξενιζούσαις ... τιμωρίαις
  choice: необычайными карами
  rationale: ξενίζω здесь характеризует кары как необычные, чуждые обычной практике или поразительные. «Необычайными» сохраняет эту широту лучше, чем более узкое «чужеземными».
- source_word: ἀποστάντων
  choice: как мятежников
  rationale: Причастие от ἀφίστημι в политическом контексте означает отпадение, измену или мятеж. Передача «как мятежников» сохраняет обвинительный взгляд царских советников и не вносит специально религиозного значения «вероотступники».
theological_decisions:
- issue: Характер отпадения в ἀποστάντων
  choice: политический мятеж или измена
  alternative: религиозное отступничество
  rationale: Контекст царского указа, подвластных народов и государственных кар указывает прежде всего на предполагаемую политическую нелояльность. Специально религиозный смысл здесь не обязателен.
- issue: Кто собирает иудеев согласно συναθροίσαντας
  choice: царская власть должна собрать их перед наказанием
  alternative: иудеи сами собрались или были собраны, после чего их следует наказать
  rationale: Активная форма συναθροίσαντας грамматически благоприятствует пониманию, при котором подразумеваемое «мы» совершает собирание. Однако синтаксис фразы неровен, поэтому характер группирования не конкретизирован сверх необходимого.
- issue: Значение τὰ συστήματα
  choice: отдельные группы или организованные объединения
  alternative: единая масса, общины либо целые сообщества
  rationale: σύστημα допускает значения организованного объединения, совокупности и группы. Основной текст использует широкое «группы», а сноска сохраняет варианты.
translation_notes:
  register: Современный литературный русский язык с достоинством царского указа. Синтаксис упрощён ради ясности, но сохранены злонамеренность советников, политическая окраска обвинения и неопределённость терминов φίλοι, σύστημα и ξενίζουσαι τιμωρίαι.
