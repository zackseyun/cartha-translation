  rationale: Сложное прилагательное буквально означает «несущая розы» или «богатая розами» и здесь служит прозванием Птолемаиды.
- source_word: ἐν ᾗ
  choice: там
  rationale: Местное значение отнесено к Птолемаиде; «там» устраняет тяжеловесное нанизывание придаточных без утраты смысла.
- source_word: προσέμεινεν αὐτοὺς
  choice: прождал их
  rationale: При глаголе с прямым дополнением выражено ожидание людей, а не просто пребывание на месте.
- source_word: ὁ στόλος
  choice: флот
  rationale: В контексте речь идёт о совокупности кораблей; «флот» — точный и обычный русский эквивалент.
- source_word: κατὰ κοινὴν αὐτῶν βουλήν
  choice: по их общему решению
  rationale: Передаёт совместно принятое решение или согласованный план, не уточняя сверх текста, к кому именно относится местоимение.
- source_word: ἡμέρας ἑπτά
  choice: семь дней
  rationale: Винительный длительности естественно передаётся в русском без предлога.
