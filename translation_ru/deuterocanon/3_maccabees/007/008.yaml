review_pass:
  verdict: revise
  source_fidelity: 'Начальное «И» точно передаёт καί, а «мы повелели» адекватно передаёт перфект προστετάχαμεν как уже изданное распоряжение. Однако «каждому, чтобы все вернулись» искусственно разделяет ἑκάστῳ πάντας и создаёт в русском ложное противопоставление адресата и возвращающихся. Здесь сочетание подчёркивает всеобщность и распределённость возвращения: все должны вернуться, каждый — к своему. «Всем без исключения вернуться каждому к себе» передаёт это без синтаксической неясности. Запрет вреда и упрёков передан по существу верно.'
  naturalness: Предложение в черновике перегружено повтором союзов «чтобы» и сочетанием «попрекал их тем, что произошло», которое хотя и понятно, но менее естественно в данном контексте. Перестройка на инфинитив после «повелели» и «упрекал их за случившееся» сохраняет официальный характер указа и звучит современно-литературно.
  terminology: «Вопреки разуму» буквально и уместно передаёт παρὰ λόγον; его не следует догматически уточнять. В примечании вариант «вопреки ожиданиям» чрезмерно удалён от βασового значения λόγος и должен быть исключён. «Упрекать» — нейтральный современный эквивалент ὀνειδίζω; он сохраняет возможный оттенок поношения, не сужая его до одного конкретного вида оскорбления.
