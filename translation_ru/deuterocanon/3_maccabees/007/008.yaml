    reason: lexical_alternative
lexical_decisions:
- source_word: προστετάχαμεν
  choice: мы повелели
  rationale: Перфект обозначает уже отданное и сохраняющее силу официальное распоряжение; «повелели» передаёт его властный характер в достойном литературном регистре.
- source_word: ἑκάστῳ πάντας
  choice: каждому, чтобы все
  rationale: Дательный ἑκάστῳ обозначает адресата распоряжения, а винительный πάντας — субъект инфинитива ἐπιστρέφειν. Такая передача сохраняет различие между «каждому» и «все», не сливая их в выражение «всем до единого».
- source_word: εἰς τὰ ἴδια ἐπιστρέφειν
  choice: все вернулись к себе
  rationale: Оборот τὰ ἴδια может означать своё место, дом или владения. «Вернулись к себе» естественно по-русски и сохраняет широту выражения.
- source_word: ἐν παντὶ τρόπῳ μηθενὸς αὐτοὺς τὸ σύνολον καταβλάπτοντος
  choice: чтобы никто никоим образом не причинял им никакого вреда
  rationale: Генитив абсолютный продолжает содержание распоряжения, а сочетание ἐν παντὶ τρόπῳ и усилительного τὸ σύνολον выражает полный запрет какого-либо вреда.
- source_word: μήτε ὀνειδίζοντος
  choice: и не попрекал их
  rationale: ὀνειδίζω здесь означает укорять, поносить или попрекать; «попрекал» естественно сочетается с указанием на пережитые события.
- source_word: περὶ τῶν γεγενημένων παρὰ λόγον
  choice: тем, что произошло вопреки разуму
  rationale: Перфектное причастие указывает на уже случившееся, а παρὰ λόγον буквально характеризует случившееся как противоречащее разуму; оценочная неоднозначность сохранена в примечании.
