lexical_decisions:
- source_word: ἕκαστος εἰς τὴν ἔμπροσθεν
  choice: каждый — на прежнее место
  rationale: 'Греческое выражение эллиптично: существительное после субстантивированного ἔμπροσθεν подразумевается. Формулировка сохраняет фрагментарность исходной конструкции и наиболее вероятный пространственный смысл, не добавляя отсутствующего в данном отрывке глагола движения.'
- source_word: ἐν τοῖς ἐχθροῖς ἐξουσίαν ἐσχηκότες
  choice: они обрели власть среди своих врагов
  rationale: Перфектное причастие передаёт достигнутое и сохраняющееся положение. «Среди своих врагов» сохраняет реляционно-социальную силу ἐν с дательным и не усиливает её до однозначного господства «над» врагами.
- source_word: μετὰ δόξης καὶ φόβου
  choice: со славой и страхом
  rationale: 'Оба существительных переданы прямо, чтобы сохранить неуточнённость: страх мог быть внушаемым врагам либо сопутствовать новому положению и отношению к иудеям.'
- source_word: τὸ σύνολον
  choice: вообще
  rationale: Средний род единственного числа естественно читается здесь наречно — «в целом, вообще». Это также позволяет согласовать причастие мужского рода множественного числа διασεισθέντες с людьми, а не с имуществом.
- source_word: ὑπὸ μηδενὸς διασεισθέντες τῶν ὑπαρχόντων
  choice: никто не подвергал их притеснениям в отношении их имущества
  rationale: Пассивное причастие διασεισθέντες относится к людям и может обозначать запугивание, вымогательство или иное притеснение. Генитив τῶν ὑπαρχόντων соотносит притеснение с принадлежавшим им имуществом; русская формулировка сохраняет эту связь, не превращая имущество в грамматический субъект.
