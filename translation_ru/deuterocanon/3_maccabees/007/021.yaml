  source_fidelity: Начальная эллиптическая конструкция в целом передана верно; «на прежнее место» остаётся оправданным осторожным выбором. ἐν τοῖς ἐχθροῖς не следует без необходимости усиливать до «над врагами», поэтому «среди своих врагов» допустимо. В последней части διασεισθέντες — мужское множественное причастие, относящееся к людям, а не к имуществу; смысл включает беспокойство, притеснение или запугивание в связи с имуществом. Исходное «никто не подвергал их притеснениям в отношении их имущества» передаёт это лишь приблизительно и слишком канцелярски.
