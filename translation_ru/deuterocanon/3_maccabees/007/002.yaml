lexical_decisions:
- source_word: ἐρρώμεθα
  choice: благополучны
  rationale: Глагол в данном контексте означает, что говорящие здравствуют и находятся в благополучии; это шире, чем указание только на физическое здоровье.
- source_word: καὶ αὐτοὶ καὶ τὰ τέκνα ἡμῶν
  choice: и мы сами, и наши дети
  rationale: Сохранена эмфатическая конструкция с αὐτοὶ, а τέκνα передано широким словом «дети», без сужения до сыновей.
- source_word: κατευθύνοντος
  choice: направляет
  rationale: Передаёт основное значение «направлять, устраивать должным образом» и не устраняет возможного оттенка содействия успешному исполнению.
- source_word: τοῦ μεγάλου θεοῦ
  choice: великий Бог
  rationale: Прямо сохраняет почтительный эпитет и естественно звучит по-русски.
- source_word: τὰ προστάγματα
  choice: наши повеления
  rationale: προστάγματα обозначает предписания или повеления. Притяжательное «наши» естественно выражает связь с ἡμῖν и контекстом говорящих, не превращая их в явно названные Божьи заповеди.
- source_word: ἡμῖν
  choice: наши
  rationale: Дательный местоимения передан как отношение повелений к говорящим; буквальное «для нас» в этой конструкции по-русски было бы неясным и тяжеловесным.
- source_word: καθὼς προαιρούμεθα
  choice: согласно нашим намерениям
  rationale: προαιρέομαι выражает обдуманное намерение, решение или выбор. Такая формулировка естественна по-русски и сохраняет человеческое воление рядом с Божьим направлением.
theological_decisions:
- issue: Соотношение Божьего действия и человеческого намерения
  choice: великий Бог направляет наши повеления согласно нашим намерениям
  alternative: великий Бог направляет наши повеления так, как мы выбираем
  rationale: Перевод сохраняет рядом Божье направляющее действие и намерение говорящих, не объясняя их соотношение в детерминистском или автономистском ключе.
