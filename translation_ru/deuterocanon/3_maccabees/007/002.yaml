  terminology: προστάγματα передано как «повеления»; притяжательное «Свои» оправдано субъектом «великий Бог». Формула «как мы того желаем» передаёт καθὼς προαιρούμεθα без догматического истолкования связи Божьего действия с человеческим выбором. Альтернатива в сноске отражает область значений «выбирать/решать/предпочитать».
