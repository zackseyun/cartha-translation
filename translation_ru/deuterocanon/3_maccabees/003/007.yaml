base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/007.yaml
  text: But they kept spreading talk about the disagreement over acts of homage and foods[a], saying that these people would not become of one way with either the king or his forces, but were hostile and strongly opposed to the affairs of state[b]; and they attached to them no ordinary fear.
translation:
  language: ru
  text: Но они не переставали распространять толки о расхождении в вопросах поклонения и пищи[a], утверждая, что эти люди не живут заодно ни с царём, ни с его войсками, что они враждебны и серьёзно противодействуют делам государства; так они возбудили против них немалый страх[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонов и пищи». Греческое слово может обозначать как религиозное поклонение, так и поклоны либо иные знаки почтения перед властью.'
    reason: lexical_alternative
  - marker: b
    text: 'Образно: «возложили на них немалый страх»; то есть внушили окружающим серьёзный страх или подозрение по отношению к ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάστασιν
  choice: расхождении
  rationale: Передаёт разделение или несогласие, не усиливая обвинение до открытого мятежа.
- source_word: προσκυνήσεων
  choice: поклонения
  rationale: Сохраняет возможную отсылку как к религиозному поклонению, так и к придворным поклонам или знакам почтения.
- source_word: τροφῶν
  choice: пищи
  rationale: Прямо передаёт греческое существительное, не добавляя отсутствующего в тексте уточнения о пищевых законах.
- source_word: ἐθρύλουν
  choice: не переставали распространять толки
  rationale: Передаёт длительность несовершенного вида и неодобрительный оттенок повторяемых слухов или пересудов.
- source_word: ὁμοτρόπως ... γίνεσθαι
  choice: жить заодно
  rationale: Естественно выражает нежелание перенимать общий уклад или сообразовываться с ним, не сводя смысл только к согласию во мнениях.
- source_word: ταῖς δυνάμεσιν
  choice: его войсками
  rationale: В данном царском и политическом контексте множественное число вероятнее всего обозначает вооружённые силы царя.
- source_word: δυσμενεῖς
  choice: враждебны
  rationale: Передаёт активную недоброжелательность, приписываемую обвиняемым.
- source_word: μέγα τι τοῖς πράγμασιν ἐναντιουμένους
  choice: решительно противятся государственным делам
  rationale: Передаёт усиление μέγα τι и политический смысл τοῖς πράγμασιν как дел государства или существующего порядка.
- source_word: οὐ τῷ τυχόντι ... φόβῳ
  choice: немалый страх
  rationale: Естественно передаёт греческую идиому со значением значительного, далеко не ничтожного страха.
- source_word: περιήψαντο
  choice: возбудили против них
  rationale: Контекстуально передаёт причинение или навлечение страха в отношении обвиняемых, хотя буквальный образ состоит в том, что страх на них как бы возлагают.
theological_decisions:
- issue: Имеет ли προσκυνήσεων исключительно религиозный смысл
  choice: поклонения
  alternative: обряды поклонения; поклоны; знаки почтения
  rationale: «Поклонение» в русском языке допускает религиозное значение, но в данном политическом контексте может также охватывать поклоны и знаки почтения перед властью; неоднозначность не устраняется.
- issue: Насколько явно политизировать τοῖς πράγμασιν
  choice: государственным делам
  alternative: общественным делам; существующему порядку
  rationale: Контекст представляет обвинение как угрозу царю и его державе; формулировка про государственные дела ясно передаёт политическую направленность, не отождествляя её непременно с восстанием.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формулировки сохраняют обвинительный характер передаваемых слухов и неоднозначность между религиозным и придворно-политическим почтением.
