base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/015.yaml
  text: We considered that the nations inhabiting Coele-Syria and Phoenicia should be nurtured not by the force of the spear[a], but with gentleness and great kindness[b], having gladly done them good.
translation:
  language: ru
  text: Мы сочли нужным не силой копья[a], а кротостью и великим человеколюбием растить[b] народы, населяющие Келесирию и Финикию, с готовностью делая им добро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не насилием копья» — образ военного принуждения.'
    reason: cultural_note
  - marker: b
    text: Греческий глагол, переведённый как «растить», обычно относится к вскармливанию или воспитанию ребёнка; здесь это патерналистский образ обращения правителя с подвластными народами.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγησάμεθα
  choice: мы решили
  rationale: Аорист ἡγέομαι передаёт обдуманное политическое решение; «решили» естественно и сохраняет волевой оттенок.
- source_word: μὴ βίᾳ δόρατος
  choice: не силой копья
  rationale: Сохраняется конкретный военный образ греческого текста, а не заменяется обобщённым выражением «силой оружия».
- source_word: ἐπιεικείᾳ
  choice: кротостью
  rationale: В контексте царской политики слово обозначает мягкость, снисходительность и умеренность; «кротостью» ясно противопоставлено насилию.
- source_word: πολλῇ φιλανθρωπίᾳ
  choice: великим человеколюбием
  rationale: «Человеколюбие» сохраняет и доброжелательность, и буквальный гуманистический оттенок φιλανθρωπία, оставаясь понятным в возвышенном литературном регистре.
- source_word: τιθηνήσασθαι
  choice: растить
  rationale: Глагол вызывает образ вскармливания или воспитания ребёнка. «Растить» сохраняет патерналистскую метафору и звучит естественнее, чем «вскармливать» применительно к народам.
- source_word: τὰ κατοικοῦντα ... ἔθνη
  choice: народы, населяющие
  rationale: «Народы» уместно передаёт ἔθνη, а причастный оборот сохраняет связь с κατοικοῦντα.
- source_word: Κοίλην Συρίαν
  choice: Келесирию
  rationale: Передано принятое русское историко-географическое название области, а не буквальное «Полую Сирию».
- source_word: εὖ ποιήσαντες ἀσμένως
  choice: охотно делая им добро
  rationale: Сохраняются и благодеяние εὖ ποιέω, и готовность/радость ἀσμένως; настоящее деепричастие естественно выражает сопутствующий образ действий без чрезмерного уточнения временной связи.
theological_decisions:
- issue: Патерналистская метафора в τιθηνήσασθαι
  choice: 'Сохранить образ выращивания подвластных народов: «растить народы».'
  alternative: «управлять народами» или «обращаться с народами»
  rationale: Нейтральный административный перевод скрыл бы риторику исходного текста, изображающую царскую власть как родительскую или кормилицкую заботу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном царского указа. Синтаксис сделан естественным для русского; конкретный образ копья и необычная метафора выращивания народов сохранены. Маркеры сносок помещены непосредственно после поясняемых выражений.
