lexical_decisions:
- source_word: τούναντίον
  choice: противоположного
  rationale: Субстантивированное наречное выражение в сочетании с ἐκδεχόμενοι означает то, что противоположно ожидаемому благому исходу; русский вариант сохраняет объект ожидания и не уточняет его сверх греческого текста.
- source_word: ἐκδεχόμενοι
  choice: ожидал
  rationale: Причастие обозначает ожидание или предвосхищение; «ожидал» естественно передаёт здесь внутреннюю установку действующих лиц.
- source_word: συμφύτῳ
  choice: врождённой
  rationale: Буквально слово указывает на нечто «сросшееся» с человеком, то есть прирождённое или врождённое; выбран современный и понятный эквивалент.
- source_word: κακοηθείᾳ
  choice: злобе
  rationale: Существительное обозначает дурной, злонамеренный склад характера; «злоба» передаёт нравственную испорченность и враждебную направленность, не усиливая её до полной развращённости.
- source_word: τὸ καλόν
  choice: добро
  rationale: Субстантивированное прилагательное обозначает нравственно прекрасное и доброе; «добро» кратко и естественно сохраняет эту этическую категорию.
- source_word: ἀπωσάμενοι
  choice: отверг
  rationale: Среднее причастие выражает активное отталкивание или отвержение. «Отверг» сохраняет волевой характер действия, хотя менее буквально, чем «оттолкнул».
- source_word: διηνεκῶς
  choice: непрестанно
  rationale: Наречие подчёркивает постоянный, устойчивый характер действия; «непрестанно» соответствует достоинству повествовательного регистра.
- source_word: φαῦλον
  choice: низменному
  rationale: Слово может означать дурное, негодное или нравственно низкое. «Низменное» сохраняет оценочную широту и противопоставление τὸ καλόν.
- source_word: ἐκνεύοντες
  choice: уклоняясь
  rationale: Причастие рисует постоянное отклонение или поворот в сторону дурного; «уклоняясь к» передаёт образ нравственного отклонения.
