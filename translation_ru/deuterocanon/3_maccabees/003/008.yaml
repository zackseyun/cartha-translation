base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/008.yaml
  text: But the Greeks in the city[a], having suffered no wrong, seeing the unexpected turmoil concerning the men and the disorderly gatherings that were taking place, were not strong enough to help; for their disposition urged an appeal[b], and some also were in an agitated state and supposed that these things would change.
translation:
  language: ru
  text: Но жившие в городе греки, сами не потерпевшие никакой несправедливости, видели неожиданные волнения в связи с теми людьми и беспорядочные скопления народа, однако были не в силах помочь; ведь их расположение побуждало их обратиться с просьбой[a]. Некоторые же и сами были охвачены волнением[b] и полагали, что положение изменится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза синтаксически сжата. Возможно также: «ведь их расположение побуждало их к мольбе (или увещанию)».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Некоторые же были вовлечены в общее смятение». Редкое слово συνδρόμως может указывать как на внутреннее волнение, так и на то, что людей захватило движение толпы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κατὰ τὴν πόλιν Ἕλληνες
  choice: Но жившие в городе греки
  rationale: Оборот κατὰ τὴν πόλιν обозначает пребывание в городе; δέ передано как мягкое противопоставление «но».
- source_word: οὐδὲν ἠδικημένοι
  choice: сами не потерпевшие никакой несправедливости
  rationale: Сохранён пассивный смысл причастия ἀδικέω и подчёркнуто, что сами греки не были объектом несправедливого обращения.
- source_word: ταραχὴν ἀπροσδόκητον περὶ τοὺς ἄνδρας
  choice: неожиданные волнения из-за этих людей
  rationale: ταραχή в гражданском контексте естественно передаётся как «волнения»; περί сохраняет широкую причинно-относительную связь, не уточняя её сверх текста.
- source_word: συνδρομὰς ἀπροκόπους γινομένας
  choice: беспорядочные скопления народа
  rationale: συνδρομή означает сбегание или скопление людей, а редкое ἀπρόκοπος указывает на неупорядоченность или безрезультатность; «беспорядочные скопления» сохраняет общественный характер сцены.
- source_word: βοηθεῖν μὲν οὐκ ἔσθενον
  choice: были не в силах помочь
  rationale: Формулировка сохраняет оттенок отсутствия силы или возможности, выраженный ἔσθενον, а не нежелания.
- source_word: παράκλησιν γὰρ ἡ διάθεσις παρεκάλουν
  choice: ведь их сочувствие побуждало их обратиться с призывом
  rationale: Синтаксис греческой фразы сжат и, вероятно, текстуально труден. «Сочувствие» естественно передаёт расположение διάθεσις в контексте, а «обратиться с призывом» оставляет παράκλησις между обращением, увещанием и мольбой.
- source_word: οἱ δὲ καὶ συνδρόμως εἶχον
  choice: Некоторые же и сами были охвачены волнением
  rationale: Редкое συνδρόμως допускает понимание внутреннего смятения либо вовлечённости в общее движение толпы; основной текст выбирает естественную, но не чрезмерно конкретную формулировку.
- source_word: μεταπεσεῖσθαι ταῦτα ὑπελάμβανον
  choice: полагали, что положение изменится
  rationale: μεταπίπτω обозначает перемену или иной поворот; «положение» идиоматично обобщает множественное ταῦτα без указания направления ожидаемой перемены.
