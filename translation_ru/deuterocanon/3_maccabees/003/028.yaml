base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/028.yaml
  text: And whoever wishes to inform against them will[a], for this, receive the property of the one who falls under the penalty, and two thousand drachmas from the royal treasury[b], and will be crowned with freedom.
translation:
  language: ru
  text: А всякий, кто пожелает донести на них, получит за это имущество того, кто подпадёт под ответственность[a], две тысячи драхм из царской казны и будет увенчан свободой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, кто будет привлечён к ответу»; греческое выражение может обозначать официальное разбирательство или юридическую ответственность, здесь — в контексте карательного указа.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «будет увенчан свободой», вероятно, означает, что доносчику в награду даруют свободу.
    reason: cultural_note
lexical_decisions:
- source_word: μηνύειν
  choice: донести на них
  rationale: В контексте карательного царского указа глагол означает сообщить властям обвинительные сведения; «донести на» естественно передаёт направленность действия против нарушителя.
- source_word: τὸν βουλόμενον
  choice: всякий, кто пожелает
  rationale: Субстантивированное причастие имеет обобщённое значение и выражает открытое приглашение любому желающему.
- source_word: ἐφʼ ᾧ
  choice: за это
  rationale: Оборот связывает донос с обещанным вознаграждением; краткая причинно-возмездная формулировка естественна по-русски.
- source_word: οὐσίαν
  choice: имущество
  rationale: Здесь слово обозначает материальную собственность лица, подлежащую передаче доносчику.
- source_word: τοῦ ἐμπίπτοντος ὑπὸ τὴν εὔθυναν
  choice: того, кто подпадёт под ответственность
  rationale: Формулировка сохраняет юридическую широту εὔθυνα — официальное разбирательство, привлечение к ответу или наказание — и не сводит её безоговорочно к уже вынесенному приговору.
- source_word: ἐκ τοῦ βασιλικοῦ
  choice: из царской казны
  rationale: Субстантивированное прилагательное указывает на царские средства; добавление «казны» ясно передаёт подразумеваемое существительное.
- source_word: δραχμὰς δισχιλίας
  choice: две тысячи драхм
  rationale: Историческая денежная единица сохранена без пересчёта в современные деньги.
- source_word: τῆς ἐλευθερίας στεφανωθήσεται
  choice: будет увенчан свободой
  rationale: Буквальная образность глагола στεφανόω сохранена; в указе выражение, вероятно, означает дарование свободы как награды.
theological_decisions:
- issue: Смысл выражения «будет увенчан свободой» в царском указе
  choice: Сохранить метафору венчания и юридически значимое слово «свобода».
  alternative: «Получит свободу в награду» или «будет освобождён».
  rationale: Более прямой пересказ был бы понятнее, но устранил бы торжественный образ оригинала и преждевременно сузил возможный смысл до освобождения раба.
translation_notes:
  register: Современный литературный русский язык с достоинством официального указа. Синтаксис упрощён ради ясности, но сохранены юридическая неоднозначность εὔθυνα и образ «увенчания свободой».
