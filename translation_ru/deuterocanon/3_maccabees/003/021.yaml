base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/021.yaml
  text: And in these matters[a], after making known to all their own countrymen our lack of resentment, and because of the alliance and the countless affairs entrusted to them from the beginning with sincerity, we decided to transform their status and deem them worthy of Alexandrian citizenship[b], and to appoint them as sharers in the things of the sanctuary.
translation:
  language: ru
  text: При этом мы объявили всем их соплеменникам, что не держим на них зла[a]. Учитывая союз с ними и бесчисленные дела, которые мы с самого начала добросовестно им доверяли, мы решили изменить их положение, удостоить их александрийского гражданства и сделать причастными к тому, что относится к святилищу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что не таим обиды»; греческое слово означает, что человек не помнит причинённого ему зла и не держит его против другого.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сделать их причастными к относящемуся к святилищу». Речь может идти в широком смысле о правах или обязанностях, связанных с храмом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμνησικακίαν
  choice: не держим на них зла
  rationale: Передаёт значение отказа помнить причинённое зло или таить обиду; естественно звучит в современной русской речи.
- source_word: ὁμοφύλους αὐτῶν
  choice: их соплеменникам
  rationale: Сохраняет указание на принадлежность к тому же народу без современного биологизирующего оттенка слова «раса».
- source_word: συμμαχίαν
  choice: союз
  rationale: В царском политическом контексте обозначает союзнические отношения, возможно формальные.
- source_word: τὰ πεπιστευμένα ... μύρια πράγματα
  choice: бесчисленные дела, которые ... им доверяли
  rationale: Передаёт как множество дел, так и выраженное перфектным причастием доверительное поручение.
- source_word: μετὰ ἁπλότητος
  choice: добросовестно
  rationale: В данном контексте выражает прямоту и добрую веру при поручении дел, а не простоту как недостаток сложности.
- source_word: ἐξαλλοιῶσαι
  choice: изменить их положение
  rationale: Контекст последующих инфинитивов указывает на изменение общественно-правового статуса; формулировка остаётся нейтральной относительно точного объёма перемены.
- source_word: πολιτίας ... Ἀλεξανδρέων
  choice: александрийского гражданства
  rationale: Кратко и естественно передаёт гражданско-правовой смысл πολιτεία.
- source_word: καταξιῶσαι
  choice: удостоить
  rationale: Сохраняет смысл признания достойными, а не только административного дарования.
- source_word: μετόχους ... καταστῆσαι
  choice: сделать причастными
  rationale: Передаёт установление нового положения и участие в чём-либо, не сужая его до конкретной должности.
- source_word: τῶν εἰς ἱερὸν
  choice: тому, что относится к святилищу
  rationale: Сохраняет сжатость и смысловую широту греческой фразы, не определяющей точный характер храмовых прав или обязанностей.
theological_decisions:
- issue: Объём гражданских и связанных со святилищем прав
  choice: Сохранить общее указание на александрийское гражданство и участие в относящемся к святилищу.
  alternative: Истолковать это как полную этническую ассимиляцию либо как узкое право на храмовое служение.
  rationale: Греческий текст не уточняет ни полного юридического объёма гражданства, ни характера участия в делах святилища; перевод не должен устранять эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством царского указа. Длинная греческая конструкция умеренно расчленена для ясности; первое лицо множественного числа и административно-политический тон сохранены.
