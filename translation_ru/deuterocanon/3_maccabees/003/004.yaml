base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/004.yaml
  text: But because they worshiped God and lived according to his law, they kept themselves separate in matters of food; for this reason some regarded them as hateful.
translation:
  language: ru
  text: Но, почитая Бога и живя по своему закону[a], они держались обособленно в том, что касалось пищи, и потому некоторым казались ненавистными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по закону этих [людей]».'
    reason: Фиксирует значение греческого τούτων и сохраняет отличие исходного текста от толкования «по Его закону».
lexical_decisions:
- source_word: σεβόμενοι
  choice: почитая
  rationale: Передаёт благоговейное отношение и религиозное почитание Бога без сужения смысла до одного лишь культового действия.
- source_word: τῷ τούτων νόμῳ πολιτευόμενοι
  choice: живя по своему закону
  rationale: Глагол πολιτεύομαι здесь означает вести жизнь, сообразуясь с установленным порядком; τούτων буквально указывает на закон этих людей, то есть их собственный закон.
- source_word: χωρισμὸν ἐποίουν ἐπὶ τῷ κατὰ τὰς τροφάς
  choice: держались обособленно в том, что касалось пищи
  rationale: Естественно передаёт буквальную идею отделения в вопросах пищи, вероятно связанных с пищевыми предписаниями, не добавляя отсутствующего в тексте уточнения.
- source_word: ἀπεχθεῖς ἐφαίνοντο
  choice: казались ненавистными
  rationale: 'Сохраняет как сильную отрицательную оценку прилагательного ἀπεχθής, так и перспективность глагола φαίνομαι: речь о том, какими они представлялись некоторым.'
theological_decisions:
- issue: Чей закон обозначен выражением τῷ τούτων νόμῳ
  choice: по своему закону
  alternative: по Божьему закону / по Его закону
  rationale: В греческом стоит родительный падеж множественного числа указательного местоимения τούτων — буквально «по закону этих [людей]». Отнесение закона непосредственно к Богу грамматически возможно лишь как истолкование, но не выражено данным местоимением.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сделан плавным, при этом сохранены причинная связь, обособление в вопросах пищи и внешняя отрицательная оценка.
