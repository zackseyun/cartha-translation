  source_fidelity: 'Текст точно передаёт греческий оригинал: σεβόμενοι τὸν θεόν — «почитая Бога»; πολιτευόμενοι — «живя по ... закону»; τούτων сохранено как «своему» и пояснено в сноске; χωρισμὸν ... ἐπὶ τῷ κατὰ τὰς τροφάς адекватно передано как обособление в вопросах пищи. «Казались ненавистными» сохраняет перспективный оттенок ἐφαίνοντο и оценочный смысл ἀπεχθεῖς.'
