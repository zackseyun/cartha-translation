base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/011.yaml
  text: 'So then[a], puffed up by his present prosperity, and not perceiving the power of the greatest God, but supposing that he would continue forever in the same purpose, he wrote this letter against them:'
translation:
  language: ru
  text: 'Итак, возгордившись своим нынешним благополучием и не сознавая могущества величайшего Бога[a], но полагая, что и впредь будет неизменно придерживаться того же замысла, он написал против них следующее письмо:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всевышнего Бога». Буквально по-гречески: «величайшего Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐημερίᾳ
  choice: благополучием
  rationale: Передаёт состояние успеха и благоприятного хода дел в данном политическом и обстоятельственном контексте, не сводя смысл к материальному достатку.
- source_word: γεγαυρωμένος
  choice: возгордившись
  rationale: Естественно передаёт вызванную успехом надменность; русское выражение сохраняет значение раздувшейся гордости без неуместной буквальности.
- source_word: οὐ καθορῶν
  choice: не сознавая
  rationale: Глагол обозначает неспособность ясно увидеть и постичь; «не сознавая» здесь естественно выражает отсутствие подлинного понимания.
- source_word: κράτος
  choice: могущество
  rationale: Передаёт действенную силу и власть Бога и сохраняет возвышенный, но понятный регистр.
- source_word: τοῦ μεγίστου θεοῦ
  choice: величайшего Бога
  rationale: Прямо сохраняет греческую превосходную степень μέγιστος и не подменяет её привычным, но иным титулом «Всевышний Бог».
- source_word: ὑπολαμβάνων
  choice: полагая
  rationale: Обозначает ошибочное субъективное предположение и естественно звучит в русском повествовании.
- source_word: διηνεκῶς
  choice: всегда
  rationale: В контексте выражает предполагаемую неизменную продолжительность его намерения, а не метафизическую вечность.
- source_word: ἐν τῇ αὐτῇ διαμένειν βουλῇ
  choice: будет держаться того же замысла
  rationale: Передаёт устойчивое пребывание при одном и том же решении или намерении; формулировка ясна и естественна по-русски.
- source_word: ἔγραφεν
  choice: написал
  rationale: Имперфект вводит содержание письма; русский совершенный вид естественно оформляет завершённое действие в повествовании.
- source_word: κατʼ αὐτῶν
  choice: против них
  rationale: Враждебный контекст требует противительного значения κατά с родительным, а не нейтрального «о них».
- source_word: ἐπιστολὴν τήνδε
  choice: такое письмо
  rationale: Указывает вперёд на непосредственно следующий текст письма; «такое» идиоматично вводит цитируемое содержание.
theological_decisions:
- issue: Передача τοῦ μεγίστου θεοῦ
  choice: величайшего Бога
  alternative: Всевышнего Бога
  rationale: Греческий текст буквально употребляет превосходную степень «величайший». Выбранный вариант сохраняет исходную формулировку и не гармонизирует её с другим традиционным библейским титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксис сохраняет причинно-логическую цепь греческой фразы, но избегает тяжеловесности; двоеточие вводит следующее далее письмо.
