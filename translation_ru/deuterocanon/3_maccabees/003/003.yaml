lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Иудеи же
  rationale: Частица δέ обозначает контраст с предшествующим контекстом; постпозитивное «же» естественно передаёт его без чрезмерного усиления.
- source_word: εὔνοιαν
  choice: расположение
  rationale: В данном контексте εὔνοια означает благожелательное отношение к правителям; «расположение» звучит естественно и не приписывает тексту более сильной политической приверженности.
- source_word: πίστιν
  choice: верность
  rationale: При указании на отношение к царям πίστις имеет общественно-политический смысл надёжности и лояльности, а не религиозной веры.
- source_word: ἀδιάστροφον
  choice: неизменно
  rationale: Наречная передача естественна по-русски и выражает постоянство сохраняемых расположения и верности, не утяжеляя сочетание двух однородных существительных.
- source_word: ἦσαν φυλάσσοντες
  choice: сохраняли
  rationale: Перифрастическая конструкция обозначает продолжительное действие; с отвлечёнными дополнениями φυλάσσω естественно передаётся как «сохранять».
- source_word: πρὸς τοὺς βασιλεῖς
  choice: царям
  rationale: Русский дательный падеж идиоматично выражает направленность верности и расположения к лицам; множественное число βασιλεῖς сохранено.
theological_decisions:
- issue: Значение πίστις вне религиозного контекста
  choice: верность
  alternative: вера; преданность
  rationale: Отношение «к царям» требует значения верности или лояльности. «Верность» сохраняет смысл постоянной надёжности и не вводит здесь понятие религиозной веры.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная повествовательная формулировка. Точка с запятой сохранена как знак незавершённости синтаксического периода исходного стиха.
