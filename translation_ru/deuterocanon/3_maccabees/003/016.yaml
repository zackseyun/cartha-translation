base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/016.yaml
  text: And after assigning very great revenues to the temples in the cities[a], we also went on and, going up to Jerusalem, to honor the temple of those never-winnowed and never-ceasing in their folly.
translation:
  language: ru
  text: И, назначив храмам в городах весьма большие доходы, мы также продолжили путь и поднялись в Иерусалим, чтобы почтить храм непровеянных, никогда не оставляющих безумия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «непровеянных», редко и трудно для истолкования. Возможно, это враждебный образ людей, которых считают неочищенными или грубыми, словно зерно, не прошедшее веяния; возможно и менее уничижительное понимание.
    reason: Лексическая неоднозначность редкого слова ἀλητρίων.
lexical_decisions:
- source_word: ἀπονείμαντες
  choice: назначив
  rationale: Аористное причастие обозначает действие, предшествующее основному; в сочетании с доходами глагол имеет административный смысл распределения или закрепления средств.
- source_word: τοῖς κατὰ πόλεσιν ἱεροῖς
  choice: храмам в разных городах
  rationale: Оборот κατὰ πόλεσιν указывает на храмы по городам; «в разных городах» естественно передаёт распределительное значение.
- source_word: προσόδους πλείστας
  choice: весьма большие доходы
  rationale: πρόσοδοι — именно доходы или поступления, а превосходная форма πλείστας подчёркивает их значительный объём.
- source_word: προηχθημεν
  choice: мы пошли дальше
  rationale: Форма употреблена в значении дальнейшего продвижения; перевод сохраняет последовательность действий без предположения о внешнем принуждении.
- source_word: ἀναβάντες
  choice: поднявшись
  rationale: Сохранён обычный библейский образ восхождения в Иерусалим.
- source_word: τιμῆσαι
  choice: почтили
  rationale: Инфинитив цели естественно включён в русское предложение как завершённое действие, выражающее оказание чести храму.
- source_word: τὸ ἱερὸν
  choice: храм
  rationale: В контексте Иерусалима слово обозначает храм или храмовый комплекс; «храм» наиболее ясно и естественно.
- source_word: ἀλητρίων
  choice: непровеянных
  rationale: Редкое и трудное слово передано через сельскохозяйственный образ зерна, не прошедшего веяния; так сохраняется необычная враждебная метафора без сведения её к общему нравственному эпитету.
- source_word: μηδέποτε ληγόντων τῆς ἀνοίας
  choice: никогда не оставляющих своего безумия
  rationale: Оборот буквально выражает непрекращение безумия или неразумия; русский вариант сохраняет полемическую силу и связь с той же группой людей.
theological_decisions:
- issue: К кому относится родительный оборот τῶν ἀλητρίων καὶ μηδέποτε ληγόντων τῆς ἀνοίας и какова его оценочная сила
  choice: 'Оборот описывает приверженцев Иерусалимского храма: «храм непровеянных, никогда не оставляющих своего безумия»'
  alternative: «храм чистых и никогда не оставляющих благочестия» либо «храм непоколебимых и неослабевающих в рвении»
  rationale: По синтаксису родительный оборот зависит от ἱερόν и обозначает людей, с которыми связан храм. Враждебный голос контекста поддерживает уничижительное прочтение, однако редкость ἀλητρίων не позволяет скрывать возможность иных толкований; поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством официальной царской речи. Синтаксис сделан естественным для широкого читателя, при этом сохранены образ восхождения в Иерусалим, финансовая точность слова «доходы» и резкая, необычная метафора оригинала.
