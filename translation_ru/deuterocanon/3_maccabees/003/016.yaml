  to: И, назначив храмам в городах весьма большие доходы, мы также продолжили путь и поднялись в Иерусалим, чтобы почтить храм непровеянных, никогда не оставляющих безумия.[a]
  rationale: Правка восстанавливает целевую функцию τιμῆσαι через «чтобы почтить», передаёт κατὰ πόλεσιν без ненужного оттенка «разных» и делает русскую фразу плавнее, не сглаживая оскорбительную и лексически трудную метафору оригинала. Сноска сохранена, поскольку она надлежащим образом предупреждает читателя о спорности ἀλητρίων.
