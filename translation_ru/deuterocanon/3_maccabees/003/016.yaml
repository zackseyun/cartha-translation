  source_fidelity: В целом переданы административное назначение доходов, путь в Иерусалим и враждебная, намеренно странная метафора ἀλητρίων. Однако «почтили» превращает греческий инфинитив цели τιμῆσαι в просто констатацию совершённого действия, а «в разных городах» несколько сужает распределительное κατὰ πόλεσιν.
  naturalness: «Мы пошли дальше и, поднявшись в Иерусалим, почтили» синтаксически тяжеловесно; цель движения естественнее выразить придаточным с «чтобы». «Храмам в городах» точнее и нейтральнее, чем «в разных городах».
  terminology: «Храм», «доходы», «непровеянных» и «безумие» уместны. «Непровеянных» сохраняет редкий сельскохозяйственный образ без преждевременного толкования. Сноска необходима и адекватно отмечает неясность.
