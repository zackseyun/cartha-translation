lexical_decisions:
- source_word: σκεπάσῃ
  choice: укроет
  rationale: В контексте указа глагол означает скрыть от властей или дать убежище; «укроет» естественно передаёт оба оттенка.
- source_word: τινα τῶν Ἰουδαίων
  choice: кого-либо из иудеев
  rationale: Сохраняет неопределённую партитивную конструкцию греческого текста.
- source_word: ἀπὸ γεραιοῦ μέχρι νηπίου καὶ μέχρι ὑπομαστιγίων
  choice: от старца до младенца, даже грудного ребёнка
  rationale: Передаёт весь возрастной диапазон и отдельно подчёркивает редкое обозначение ребёнка, ещё находящегося у груди.
- source_word: ἐχθίσταις βασάνοις
  choice: в жесточайших мучениях
  rationale: В данном контексте превосходная степень выражает крайнюю тяжесть и ужас мучений; буквальное «ненавистнейших» по-русски звучало бы неестественно.
- source_word: ὑποτυμπανισθήσεται
  choice: будет забит до смерти
  rationale: Передаёт основное значение жестокой казни посредством избиения, не навязывая спорную реконструкцию конкретного орудия или способа.
- source_word: πανοικίᾳ
  choice: вместе со всем своим домом
  rationale: «Дом» в библейском русском обозначает всё домашнее сообщество и сохраняет более широкий смысл, чем только кровная семья.
