  source_fidelity: 'Основной смысл передан точно: укрывательство любого иудея, независимо от возраста, влечёт смертную казнь укрывателя вместе со всем его домом. «Грудного ребёнка» адекватно передаёт редкое ὑπομαστίγιον. Однако «в жесточайших мучениях» передаёт тяжесть, но не оттенок ἐχθίσταις («отвратительнейших, ненавистных»); более точное и естественное решение возможно через «самой жестокой казнью».'
