  terminology: '«Иудеи», «укроет» и «дом» уместны. «Дом» сохранён в библейско-юридическом смысле домашнего сообщества. Примечание следует уточнить: вариант «на колесе» является лишь традиционной/технической интерпретацией и не должен подаваться как равнозначно установленный способ казни.'
