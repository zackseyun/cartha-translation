lexical_decisions:
- source_word: τύπος
  choice: текст
  rationale: В контексте вводной формулы перед цитированием письма слово обозначает его содержание или изложение; «текст письма» естественно и точно по-русски.
- source_word: ἐγέγραπτο
  choice: был составлен
  rationale: Плюсквамперфектная форма указывает на уже подготовленный письменный документ; русское «был составлен» передаёт результат письменного оформления без тяжеловесного «был написан».
- source_word: οὕτως
  choice: так
  rationale: Естественная русская формула, вводящая непосредственно следующий текст письма.
