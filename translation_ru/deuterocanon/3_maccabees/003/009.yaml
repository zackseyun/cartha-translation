lexical_decisions:
- source_word: μὴ γὰρ ... παροραθήσεσθαι
  choice: ведь ... не останется без внимания
  rationale: 'γάρ вводит обоснование, а будущий страдательный инфинитив παροραθήσεσθαι выражает ожидаемый исход: сообщество не будет оставлено без внимания. Такая передача естественна по-русски и не превращает высказывание в прямое предписание.'
- source_word: οὕτω τηλικοῦτο
  choice: столь значительное
  rationale: Сочетание подчёркивает масштаб или значимость; «столь значительное» сохраняет эту широту, не сводя смысл исключительно к численности.
- source_word: σύστημα
  choice: сообщество
  rationale: Здесь слово обозначает объединённую группу людей, цельное общественное образование; «сообщество» точнее и естественнее, чем абстрактное «система».
- source_word: μηδὲν ἠγνοηκός
  choice: ни в чём не провинившееся
  rationale: В контексте преследуемой общины оборот уместно понимать как указание на отсутствие проступка или вины. При этом буквальная возможность значения «ничего не знавшее / ни о чём не пребывавшее в неведении» сохранена в сноске.
