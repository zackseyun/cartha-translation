  verdict: revise
  source_fidelity: 'Существенная проблема — «ни в чём не провинившееся»: ἠγνοηκός (сов. действ. причастие от ἀγνοέω) означает «не бывшее в неведении / не не знавшее ничего», а не «невиновное». В данном стихе нет лексического основания вводить тему моральной или юридической вины. μὴ ... παροραθήσεσθαι выражает, в контексте распоряжения, недопустимость оставления без внимания; передача простым будущим «не останется» ослабляет эту модальность. «Сообщество» допустимо для σύστημα, а «столь значительное» удачно передаёт οὕτω τηλικοῦτο.'
  naturalness: Предлагаемый текст сохраняет современный литературный строй. Оборот «не пребывающее в неведении ни о чём» был бы чрезмерно тяжёлым; «ничего не упустившее» естественнее, хотя несколько интерпретирует ἀγνοέω через практический смысл «не упустить из виду». Буквальный вариант следует отразить в сноске.
  terminology: '«Сообщество» — приемлемое нейтральное решение для σύστημα, не навязывающее ни административного, ни конфессионального толкования. Не следует характеризовать это сообщество как «провинившееся» или «невиновное»: такой смысл не содержится в греческом.'
  issues:
