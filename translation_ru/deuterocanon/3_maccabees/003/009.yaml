    rationale: ἀγνοέω относится к незнанию, неведению или нераспознанности; форма ἠγνοηκός не означает «совершить проступок» или «быть виновным». Сноска не устраняет ошибку основного текста, поскольку в нём выбран не поддерживаемый исходником смысл.
  - severity: medium
    issue: «Не останется без внимания» заменяет модальное значение будущего инфинитива простым прогнозом.
    rationale: 'В контексте распорядительной формулировки μὴ ... παροραθήσεσθαι естественно передать как запрет/недопустимость: «нельзя оставлять без внимания».'
  - severity: low
    issue: Объяснение сноски связывает ἀγνοέω со «проступком ... по неведению».
    rationale: Хотя незнание может быть обстоятельством проступка в иных контекстах, данный греческий оборот не выражает ни проступка, ни отсутствия вины; это пояснение создаёт неоправданную интерпретацию.
