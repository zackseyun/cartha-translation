  yaml_path: translation/deuterocanon/3_maccabees/003/029.yaml
  text: But every place where a Jew is discovered while being concealed shall become inaccessible and burned with fire[a], and it shall appear altogether useless to every mortal creature for all time.
translation:
  language: ru
  text: А всякое место, где обнаружат укрывающегося иудея[a], да станет недоступным и охваченным огнём и навеки окажется совершенно непригодным для всякого смертного существа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иудея, которого там укрывают». Греческое выражение τὸ σύνολον σκεπαζόμενος трудно для истолкования; по смыслу речь идёт о месте, где скрывается или где укрывают иудея.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς δὲ τόπος
  choice: А всякое место
  rationale: Передаёт всеохватный, распределительный характер предписания; союз δέ естественно выражен как «а».
- source_word: οὗ ἐὰν φωραθῇ
  choice: где обнаружат
  rationale: φωράω означает обнаружить или уличить в чём-либо скрытом; неопределённо-личная конструкция естественна для современного русского языка и сохраняет условно-обобщающий смысл ἐάν.
- source_word: τὸ σύνολον σκεπαζόμενος Ἰουδαῖος
  choice: укрывающегося иудея
  rationale: Текстуально трудная конструкция, по смыслу указывающая на иудея, которого скрывают либо который находится в укрытии. Основной текст передаёт этот смысл кратко, а неоднозначность отмечена в сноске.
- source_word: ἄβατος
  choice: неприступным
  rationale: Слово обозначает место, куда нельзя ступить или войти; «неприступным» сохраняет и запретительный, и описательный оттенок.
- source_word: πυριφλεγής
  choice: выжженным огнём
  rationale: Прилагательное описывает место, охваченное или опустошённое огнём. «Выжженным огнём» естественно сочетается с последующим указанием на полную непригодность места.
- source_word: πάσῃ θνητῇ φύσει
  choice: для любого смертного существа
  rationale: Сохраняет широкое значение буквально «для всякой смертной природы», не сужая его только до людей.
- source_word: καθʼ ἅπαν ἄχρηστος
  choice: совершенно непригодным
  rationale: Передаёт усиленное значение полной невозможности пользоваться этим местом.
- source_word: φανήσεται
  choice: окажется
  rationale: Будущая форма φαίνω допускает значения «явится», «станет очевидно» или «окажется»; последнее естественно по-русски и не требует искусственного пассива.
- source_word: εἰς τὸν ἀεὶ χρόνον
  choice: навеки
  rationale: Кратко и точно передаёт постоянную, неограниченную продолжительность предписанного состояния.
theological_decisions:
- issue: Значение этнонима Ἰουδαῖος
  choice: иудей
  alternative: житель Иудеи
  rationale: В контексте гонения речь идёт об этнорелигиозной принадлежности, а не только о географическом происхождении. «Иудей» соответствует историческому контексту и принятому русскому библейскому словоупотреблению.
- issue: Объём выражения πάσῃ θνητῇ φύσει
  choice: любое смертное существо
  alternative: любой человек
  rationale: Греческое выражение шире обозначения человечества; перевод не ограничивает его людьми и сохраняет исходную универсальность.
translation_notes:
  register: Современный литературный русский язык с достоинством официального указа. Формула «да станет» сохраняет повелительно-законодательную силу греческого γινέσθω; остальная фраза построена естественно и без архаической перегрузки.
