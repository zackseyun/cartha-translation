base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/023.yaml
  text: Not only have they rejected the honorable civic order[a], but they also detest, both in speech and in silence, the few among them who are genuinely well-disposed toward us, and at every opportunity, driven by the most impious pretext[c][b], they rush to bring our affairs to ruin.
translation:
  language: ru
  text: Они не только отвернулись от почётного гражданского порядка[a], но и питают отвращение — и на словах, и молча[b] — к тем немногим среди них, кто искренне расположен к нам; при всяком удобном случае, прикрываясь самым нечестивым предлогом[c], они спешат погубить наши дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при ином понимании ἄτιμητον: «лишённого чести гражданского порядка». Слово πολιτεία может также означать государственный строй, гражданский статус или общественный порядок.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «словом и молчанием»; этот оборот указывает на враждебность, проявляемую и открыто, и безмолвно.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «с самым нечестивым видом» или «под видом самого нечестивого [обвинения]».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεστρέψαντο
  choice: отвернулись от
  rationale: Средняя форма передаёт сознательное отвержение, а буквальный образ естественно звучит по-русски.
- source_word: τὴν ἄτιμητον πολιτίαν
  choice: почётного гражданского устройства
  rationale: πολιτεία здесь обозначает общественно-гражданский порядок или устройство. ἄτιμητον понято в контекстуально положительном смысле — как ценное, почётное; форма допускает спорность, отмеченную в сноске.
- source_word: βδελύσσονται
  choice: выражают отвращение
  rationale: Передаёт сильное неприятие и позволяет естественно связать глагол с оборотом λόγῳ τε καὶ σιγῇ.
- source_word: λόγῳ τε καὶ σιγῇ
  choice: явно и молча
  rationale: Сохраняет противопоставление выраженной словами и безмолвной, подразумеваемой враждебности; более буквальный вариант дан в сноске.
- source_word: πρὸς ἡμᾶς γνησίως διακειμένους
  choice: кто искренне расположен к нам
  rationale: Не усиливает благожелательное отношение до формальной политической верности.
- source_word: παρʼ ἕκαστα
  choice: при каждом случае
  rationale: Передаёт повторяемость попыток при всякой возникающей возможности.
- source_word: μετὰ τῆς δυσσεβεστάτης ἐμφάσεως
  choice: с самым нечестивым намерением
  rationale: ἔμφασις может обозначать проявление, видимость, намёк или предлог; в данном обвинительном контексте сочетание допускает понимание как нечестивой направленности или предлога.
- source_word: διὰ τάχους ... καταστρέψαι τὰ πράγματα
  choice: они спешат погубить наши дела
  rationale: Сохраняет идею поспешного стремления привести положение или дела говорящих к краху.
theological_decisions:
- issue: Значение ἄτιμητον при πολιτίαν
  choice: почётное гражданское устройство
  alternative: лишённое чести / презренное гражданское устройство
  rationale: Обвинительная логика фразы лучше согласуется с тем, что отвергнут ценимый политический порядок. Однако морфологически отрицательное прочтение возможно, поэтому неоднозначность отмечена.
- issue: Значение ἐμφάσεως
  choice: намерение
  alternative: видимость / предлог
  rationale: Контекст допускает указание как на внутреннюю направленность, так и на внешнее прикрытие действий; основной текст выбирает естественное русское выражение, не делая его богословским утверждением.
translation_notes:
  register: Современный литературный русский язык с достоинством официально-обвинительной речи. Длинный греческий период сохранён, но синтаксис сделан прозрачным; неоднозначные ἄτιμητον и ἔμφασις не представлены как бесспорные.
