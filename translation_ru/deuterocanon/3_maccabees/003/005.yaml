translation:
  language: ru
  text: Украшая свой образ жизни добрым поведением праведников, они уже пользовались доброй репутацией у всех людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ... εὐπραξίᾳ
  choice: добрым поведением
  rationale: Творительный падеж передаёт инструментальное значение греческого дательного; в данном контексте εὐπραξία обозначает нравственно доброе поведение, а не благополучие.
- source_word: τῶν δικαίων
  choice: праведников
  rationale: Субстантивированное прилагательное во множественном числе сохранено существительным с выраженной нравственно-религиозной окраской.
- source_word: κοσμοῦντες
  choice: украшая
  rationale: 'Сохранена метафора κοσμέω: достойное поведение служит украшением образа жизни.'
- source_word: τὴν συναναστροφήν
  choice: свой образ жизни
  rationale: В контексте συναναστροφή означает образ или уклад жизни; «свой» естественно указывает на субъект причастного оборота.
- source_word: ἅπασιν ἀνθρώποις
  choice: всех людей
  rationale: Русская конструкция «снискать уважение кого-либо» естественно передаёт круг лиц, в чьих глазах они пользовались доброй репутацией.
- source_word: εὐδόκιμοι
  choice: снискали уважение
  rationale: Передаёт значение одобрения и доброй репутации в глазах окружающих.
- source_word: καθειστήκεισαν
  choice: снискали
  rationale: Результативное значение плюсквамперфекта передано глаголом, обозначающим приобретённое и уже сложившееся уважение.
