  text: But although they accepted our presence in word[a], in deed they were false, when we eagerly desired to enter into their temple and honor it with the most splendid and finest offerings[b],
translation:
  language: ru
  text: Но на словах они согласились принять нас[a], а на деле поступили неискренне, когда мы горячо желали войти в их храм и почтить его самыми великолепными и прекрасными дарами[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на словах приветствовали наше прибытие, но на деле повели себя неискренне».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое слово может обозначать посвящённые дары, в том числе дары, помещаемые в храме; также можно перевести: «посвятительными дарами».'
    reason: cultural_note
lexical_decisions:
- source_word: λόγῳ μὲν ... τῷ δὲ πράγματι
  choice: лишь на словах ... а на деле
  rationale: Передаёт подчёркнутое греческое противопоставление между заявленным отношением и действительным поведением; «лишь» естественно выражает подразумеваемую ограниченность словесного принятия.
- source_word: ἀποδεξάμενοι
  choice: приняли
  rationale: Сохраняет значение принятия царского присутствия, не усиливая его до сердечного приветствия.
- source_word: παρουσίαν
  choice: присутствие
  rationale: Прямо передаёт личное присутствие правителя; вариант «прибытие» возможен, но менее точно соответствует существительному в данном противопоставлении.
- source_word: νόθως
  choice: поступили неискренне
  rationale: Передаёт несоответствие их поступка словам. Буквальные варианты со значениями «поддельно» или «ложно» по-русски здесь неестественны.
- source_word: προθυμηθέντων ἡμῶν
  choice: когда мы изъявили горячее желание
  rationale: Передаёт и готовность, и сильное стремление говорящего, сохраняя обстоятельственную функцию родительного самостоятельного.
- source_word: εἰσελθεῖν εἰς τὸν ναὸν αὐτῶν
  choice: войти в их храм
  rationale: Естественно и точно передаёт направленное движение внутрь; русское «войти в» полностью выражает силу εἰς.
- source_word: τοῖς ἐκπρεπέσιν καὶ καλλίστοις ἀναθήμασιν
  choice: великолепнейшими и прекраснейшими дарами
  rationale: Сохраняет усиленную характеристику посвящаемых храму даров и избегает тяжеловесного оборота «вотивные приношения» в основном тексте.
- source_word: τιμῆσαι
  choice: почтить его
  rationale: Кратко и естественно передаёт намерение оказать храму почесть посредством посвящённых даров.
theological_decisions:
- issue: Характер заявленного намерения царя относительно иудейского храма
  choice: Передать как утверждение говорящего о желании почтить храм дарами, без одобрения или осуждения этого намерения переводчиком.
  alternative: «воздать почести в их храме посредством посвятительных даров»
  rationale: Это заявление персонажа внутри речи. Перевод сохраняет историко-богословское напряжение и не превращает его ни в авторское одобрение, ни в скрытое обвинение.
translation_notes:
  register: Современный литературный русский язык с достоинством царской официальной речи. Синтаксис сохраняет незавершённость греческого предложения, продолжающегося в следующем стихе; итоговая запятая поэтому намеренна.
