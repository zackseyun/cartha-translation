lexical_decisions:
- source_word: Βασιλεὺς
  choice: Царь
  rationale: Царский титул в заголовке послания; в русском библейском и историческом контексте «царь» естественнее, чем «король».
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: Птолемей Филопатор
  rationale: Имя и эпитет переданы принятой русской транслитерацией, без перевода значения эпитета.
- source_word: τοῖς ... στρατηγοῖς
  choice: военачальникам
  rationale: στρατηγοί обозначает военных начальников; «военачальники» сохраняет широту термина и соответствует историческому регистру.
- source_word: καὶ στρατιώταις
  choice: и воинам
  rationale: Прямое обозначение военнослужащих; «воины» звучит достойно и естественно в историческом повествовании.
- source_word: τοῖς κατʼ Αἴγυπτον
  choice: по всему Египту
  rationale: Передаёт распределительное значение κατά и широкую географическую область адресатов.
- source_word: καὶ κατὰ τόπον
  choice: и во всех местностях
  rationale: Сохраняет распределительный и несколько неопределённый характер идиомы κατὰ τόπον, не сводя её однозначно к административным округам.
- source_word: χαίρειν
  choice: приветствие
  rationale: Стандартная эпистолярная формула, которую по-русски естественно передать существительным в составе официального приветствия.
- source_word: καὶ ἐρρῶσθαι
  choice: и пожелание здравия
  rationale: Формульное пожелание здоровья и благополучия; передано в синтаксическом соответствии с «приветствие».
