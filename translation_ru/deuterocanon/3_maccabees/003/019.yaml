  source_fidelity: 'В целом смысл передан верно: это обвинительная характеристика в тексте царского документа, а не утверждение переводчика. Однако «Тем самым» добавляет выводное значение, которого в деепричастной конструкции нет; ὡς μονώτατοι точнее передать как «единственные среди народов», без добавления «всех».'
  naturalness: «Высокомерно держатся с царями» звучит несколько разговорно и синтаксически неловко для официально-обвинительного регистра. «Ведут себя высокомерно по отношению к царям» естественнее. Конструкция «не желают проявлять никакой искренности» приемлема, но «ничего искреннего не желают выказывать» ближе сохраняет предметную неопределённость οὐδὲν γνήσιον.
  terminology: «Враждебность», «цари» и «благодетели» удачны. «Искреннее» сохраняет широкий смысл γνήσιον («подлинное, искреннее») без догматизации или чрезмерной конкретизации.
