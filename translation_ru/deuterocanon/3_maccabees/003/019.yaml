  yaml_path: translation/deuterocanon/3_maccabees/003/019.yaml
  text: And by making their hostility toward us plain, they, alone among the nations, act arrogantly toward kings and toward their own benefactors, and are willing to offer nothing sincere.
translation:
  language: ru
  text: 'Они явно показывают свою враждебность к нам: единственные среди народов, они ведут себя высокомерно по отношению к царям и к собственным благодетелям и не желают выказывать ничего искреннего.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυσμένειαν
  choice: враждебность
  rationale: Передаёт открыто неприязненное отношение, выраженное существительным в греческом тексте.
- source_word: ἔκδηλον καθιστάντες
  choice: явно показывают
  rationale: 'Естественно передаёт каузативный смысл: делают свою враждебность явной.'
- source_word: ὡς μονώτατοι τῶν ἐθνῶν
  choice: единственные среди всех народов
  rationale: Сохраняет усилительный смысл превосходной формы μονώτατοι и обвинительный тон царского указа.
- source_word: ὑψαυχνοῦντες
  choice: высокомерно держатся
  rationale: Глагол буквально рисует надменную, горделивую осанку; выбранное выражение естественно по-русски и сохраняет оценочную окраску.
- source_word: οὐδὲν γνήσιον ... φέρειν
  choice: не желают проявлять никакой искренности
  rationale: γνήσιον здесь обозначает подлинное, искреннее отношение или расположение; «проявлять» передаёт идиоматическую силу φέρειν без искусственной буквальности.
theological_decisions:
- issue: Статус обвинения в адрес народа
  choice: Сохранить речь как обвинительное утверждение авторов царского указа, не смягчая и не подтверждая её от лица повествователя.
  alternative: Переформулировать обвинение как объективную характеристику народа или снабдить его поясняющей оценкой.
  rationale: Стих является частью враждебного официального документа; перевод должен сохранять его риторическую резкость, не превращая слова персонажей в богословское суждение переводчика.
translation_notes:
  register: Современный литературный русский язык с официально-обвинительным оттенком, соответствующим царскому указу. Двоеточие ясно связывает проявление враждебности с последующим обвинением; двусмысленность предмета γνήσιον передана отвлечённым выражением «никакой искренности».
