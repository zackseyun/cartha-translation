  source_fidelity: В проекте выражение «пройдя с победой через все испытания» добавляет отсутствующие в греческом тексте «все испытания» и устраняет пассивный оттенок διακομισθέντες. Безопаснее не конкретизировать, через что именно были проведены. «Отнесясь ко всем народам» передаёт общий смысл, однако ἀπαντήσαντες прежде всего означает «встретив»; это значение следует сохранить, насколько позволяет русский синтаксис.
  naturalness: «Снисходя к их безрассудству» грамматически возможно, но в этой цепочке деепричастий несколько тяжеловесно и несколько ослабляет завершённость действия. «Проявив снисхождение к их неразумию» — естественный современный литературный вариант. Развёрнутое «встретив ... и проявив к ним человеколюбие» ясно и не требует неестественного сочетания «встретив человеколюбиво».
