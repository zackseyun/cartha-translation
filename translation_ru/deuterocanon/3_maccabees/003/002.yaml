base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/002.yaml
  text: While these matters were being arranged[a], a hostile rumor was spread against the nation among people of like mind for mistreatment, a pretext being given for their purpose[c][b], as though they were being hindered from their customary laws.
translation:
  language: ru
  text: Пока всё это приводилось в порядок, среди людей, единодушных в стремлении причинить зло, распространялась враждебная молва против этого народа; так создавался повод для осуществления их намерения,[a] будто самому народу препятствовали соблюдать его установления.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Повод» можно также понять как «предлог» или «возможность»; греческое слово допускает все эти оттенки.
    reason: lexical_alternative
  - marker: b
    text: Под «установлениями» могут подразумеваться также традиционные обычаи, законы или предписания. Греческий оборот указывает, что препятствия, по утверждению молвы, чинились самому народу.
    reason: ambiguity
lexical_decisions:
- source_word: οἰκονομουμένων
  choice: приводилось в порядок
  rationale: Передаёт значение управления и упорядочения дел, не уточняя не названного в греческом тексте деятеля.
- source_word: φήμη δυσμενὴς ἐξέκειτο
  choice: распространялась враждебная молва
  rationale: Сочетание обозначает неблагоприятную, злонамеренную молву, пущенную в обращение; русский оборот естественно передаёт социальное распространение слуха.
- source_word: κατὰ τοῦ γένους
  choice: против этого народа
  rationale: В контексте γένος обозначает еврейский народ как общность; «народ» избегает современных биологических ассоциаций слова «раса».
- source_word: ἀνθρώποις συμφρονοῦσιν εἰς κακοποίησιν
  choice: среди единомышленников, готовых причинить ему зло
  rationale: Передаёт согласованную враждебную настроенность людей и направленность εἰς κακοποίησιν на причинение вреда без сужения его до физического насилия.
- source_word: ἀφόρμης ... διδομένης εἰς διάθεσιν
  choice: так создавался повод осуществить их намерение
  rationale: Сжатая греческая конструкция допускает оттенки повода, возможности или предлога; данная формулировка естественна по-русски и сохраняет связь повода с враждебным замыслом.
- source_word: τῶν νομίμων
  choice: установленные обычаи
  rationale: Субстантивированное νόμιμα охватывает признанные обычаи, установления и нормы; контекст не требует ограничивать смысл формальными законами.
- source_word: κωλύωνται
  choice: мешал им соблюдать
  rationale: Греческая форма передаёт предполагаемое препятствование. По смыслу субъектом является оклеветанный народ, а подразумеваемым дополнением — соблюдение νόμιμα.
theological_decisions:
- issue: Значение γένος в контексте враждебной агитации
  choice: этот народ
  alternative: этот род / эта народность
  rationale: Речь идёт о еврейском народе как коллективе. «Народ» точно и нейтрально передаёт смысл, не внося расовой терминологии.
- issue: Неоднозначность ἀφορμή в описании враждебного замысла
  choice: повод
  alternative: предлог / возможность
  rationale: '«Повод» сохраняет широту греческого слова: это может быть как удобный случай, так и основание, используемое для оправдания действий. Возможный более обвинительный оттенок отмечен в сноске.'
- issue: Референты местоимений в ὡς ἂν ἀπὸ τῶν νομίμων αὐτοὺς κωλύωνται
  choice: будто этот народ мешал им соблюдать установленные обычаи
  alternative: будто им препятствовали жить по своим установлениям
  rationale: Синтаксис сжат и допускает менее явную передачу участников. Основной текст делает наиболее вероятные референты понятными, а сноска сохраняет грамматическую неоднозначность.
