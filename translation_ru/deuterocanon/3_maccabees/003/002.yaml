  source_fidelity: 'В исходном греческом αὐτούς в заключительном обороте естественно относится к оклеветанному γένος: создаётся видимость, будто самому народу препятствуют следовать его νόμιμα. Черновик, напротив, делает народ субъектом («этот народ мешал им»), что меняет направление действия. Датив ἀνθρώποις συμφρονοῦσιν лучше передавать как адресатов/среду распространения молвы — людей, объединённых злонамеренным настроем; «готовых причинить ему зло» допустимо по смыслу, но несколько сильнее и уже греческого.'
