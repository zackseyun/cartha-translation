base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/024.yaml
  text: Therefore[a], being well convinced by proofs that these people are in every way ill-disposed toward us, and taking thought lest, if some sudden disturbance should later arise, we should have these ungodly people at our back as traitors and barbarian enemies,
translation:
  language: ru
  text: Поэтому мы, будучи твёрдо убеждены на основании доказательств, что эти люди во всём питают к нам вражду, заранее принимаем меры, чтобы, если впоследствии внезапно возникнет смута, эти нечестивцы не оказались у нас в тылу как предатели и варварские[a] враги,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дикие». Греческое слово здесь служит уничижительной характеристикой в риторике говорящего и не обязательно является точным этническим обозначением.'
    reason: Лексическая альтернатива и пояснение риторической окраски βαρβάρους.
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего контекста.
- source_word: τεκμηρίοις καλῶς πεπεισμένοι
  choice: имея веские доказательства и будучи твёрдо убеждены
  rationale: Сохраняет как доказательную основу убеждения, так и его твёрдость; русская формулировка естественнее буквального «хорошо убеждены доказательствами».
- source_word: τούτους κατὰ πάντα δυσνοεῖν ἡμῖν
  choice: что эти люди во всём питают к нам вражду
  rationale: Передаёт всеохватность обвинения и устойчиво враждебное отношение без неестественной кальки.
- source_word: προνοούμενοι
  choice: заранее принимаем меры
  rationale: В данном административно-политическом контексте причастие обозначает предусмотрительность и предупредительные действия, а не только размышление.
- source_word: μή ποτε ἐφνιδίου μετέπειτα ταραχῆς ἐνστάσης
  choice: чтобы, если впоследствии внезапно возникнут волнения
  rationale: Сохраняет опасение относительно возможных будущих беспорядков; множественное «волнения» естественно по-русски и не сужает смысл до мятежа.
- source_word: κατὰ νώτου
  choice: у нас в тылу
  rationale: Естественная русская военно-политическая идиома, сохраняющая образ угрозы сзади.
- source_word: δυσσεβεῖς
  choice: нечестивцы
  rationale: Сохраняет резкую религиозно-нравственную характеристику, вложенную в уста говорящего.
- source_word: προδότας
  choice: предатели
  rationale: Прямо передаёт политико-военное обвинение в измене.
- source_word: βαρβάρους πολεμίους
  choice: варварские враги
  rationale: Сохраняет уничижительную риторику источника и связь прилагательного с «врагами», не превращая выражение однозначно в этническую классификацию.
theological_decisions:
- issue: Передача полемических характеристик в царском обвинении
  choice: Сохранены резкие слова «нечестивцы», «предатели» и «варварские враги» как речь обвинителя.
  alternative: Смягчить их до «неблагонадёжные», «нелояльные» или «враждебные».
  rationale: Текст сообщает враждебную риторику говорящего; её смягчение устранило бы существенную идеологическую напряжённость, тогда как перевод сам по себе не одобряет обвинение.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского указа. Длинная синтаксическая конструкция и конечная запятая сохранены, поскольку стих является частью продолжающегося предложения.
