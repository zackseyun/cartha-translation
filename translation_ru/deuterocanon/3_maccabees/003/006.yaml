lexical_decisions:
- source_word: τὴν ... εὐπραξίαν
  choice: добрые дела
  rationale: εὐπραξία может обозначать благие поступки, достойное поведение или благополучие. В сочетании с θρυλουμένην здесь естественнее понимать её как широко известные добрые дела народа; такое выражение сохраняет связь с действием и не сужает смысл до одной лишь нравственной репутации или успешности.
- source_word: περὶ τὸ γένος
  choice: этого народа
  rationale: γένος обозначает здесь еврейский народ как этническую общность. Перестройка оборота как «добрые дела этого народа» естественна по-русски и передаёт связь εὐπραξία с народом.
- source_word: ἐν πᾶσιν
  choice: повсюду
  rationale: При θρυλουμένην оборот указывает на широкую известность среди людей; «повсюду» кратко и естественно передаёт этот смысл.
- source_word: θρυλουμένην
  choice: о которых говорили
  rationale: Причастие означает то, о чём постоянно или широко говорят. Выбран нейтральный оборот без усиления до «прославляли».
- source_word: οἱ ἀλλόφυλοι
  choice: иноплеменники
  rationale: ἀλλόφυλοι — люди иного племени или народа. «Иноплеменники» сохраняет этническое противопоставление и не привносит новозаветных ассоциаций слова «язычники».
- source_word: οὐδαμῶς
  choice: вовсе не
  rationale: Передаёт усиленное отрицание ясно и естественно для современного русского языка.
- source_word: διηριθμήσαντο
  choice: приняли в расчёт
  rationale: Глагол буквально связан со счётом и перечислением, но в контексте означает учесть, придать чему-либо значение. «Приняли в расчёт» сохраняет образ счёта и передаёт оценочный смысл.
