  yaml_path: translation/deuterocanon/3_maccabees/003/010.yaml
  text: And already some neighbors and friends and business associates[a], secretly drawing certain people aside, were giving assurances that they would join in protecting them and would offer every earnest effort toward their support.
translation:
  language: ru
  text: И уже некоторые соседи, друзья и деловые партнёры, тайно отзывая некоторых в сторону, давали заверения, что сообща встанут на их защиту[a] и приложат все силы, чтобы оказать им помощь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол связан со словом «щит» и передаёт мысль о совместной защите.
    reason: Сноска сохраняет образ щита в редком греческом глаголе συνασπίζειν, не выдавая этимологический образ за буквальное описание действия.
lexical_decisions:
- source_word: γείτονές
  choice: соседи
  rationale: Обычное и естественное обозначение живущих поблизости; оно уместно в перечислении социальных связей.
- source_word: φίλοι
  choice: друзья
  rationale: В данном ряду наиболее вероятен обычный смысл личных друзей, а не формальных союзников.
- source_word: συνπραγματευόμενοι
  choice: деловые партнёры
  rationale: Причастие обозначает людей, совместно ведущих дела или участвующих в сделках; выбранный вариант понятен современному читателю и не предполагает юридически оформленного партнёрства.
- source_word: μυστικῶς
  choice: тайно
  rationale: Передаёт скрытый характер действий в обстановке, где открытая поддержка могла быть опасной.
- source_word: τινας ἐπισπώμενοι
  choice: отзывая некоторых в сторону
  rationale: Сохраняет значение привлечения или отвода к себе и не усиливает его до однозначного «склоняя на свою сторону».
- source_word: πίστεις ἐδίδουν
  choice: давали заверения
  rationale: Устойчиво передаёт смысл обещаний или ручательств; форма несовершенного вида отражает греческий имперфект.
- source_word: συνασπίζειν
  choice: сообща встанут на их защиту
  rationale: Передаёт как совместность действия, так и образ защитного сплочения, заложенный в глаголе, образованном от слова «щит».
- source_word: πᾶν ἐκτενὲς
  choice: приложат все силы
  rationale: Естественное русское выражение полной и усердной отдачи, без неясной буквальности.
- source_word: προσιοίσεσθαι
  choice: приложат
  rationale: В сочетании с «все силы» естественно выражает обещание предоставить или внести всё возможное.
- source_word: πρὸς ἀντίλημψιν
  choice: чтобы оказать им помощь
  rationale: Ясно передаёт направленность усилий на помощь и поддержку.
