base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/026.yaml
  text: For if these men are punished all together[a], we will leave for the time that remains with complete confidence that our affairs will be established in stability and in the best condition.
translation:
  language: ru
  text: Ведь если все они будут наказаны разом, то на всё оставшееся время мы можем быть вполне уверены, что наши дела будут приведены в устойчивое и наилучшее состояние.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально греческое λείψαμεν означает «оставим», но конструкция с последующим будущим страдательным инфинитивом весьма сжата. Возможна более буквальная, но неестественная передача: «оставим наши дела на оставшееся время быть приведёнными…». По смыслу речь идёт об уверенности, что после наказания этих людей дела царства впредь будут устроены устойчиво и наилучшим образом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτων
  choice: они
  rationale: Указательное местоимение относится к ранее названной группе людей; русское «они» естественно передаёт эту контекстную отсылку без добавления отсутствующего в греческом существительного.
- source_word: ὁμοῦ
  choice: все вместе
  rationale: Передаёт коллективный характер наказания и оттенок совокупности.
- source_word: κολαθέντων
  choice: будут наказаны
  rationale: Абсолютный генитив передан условным придаточным; «наказаны» сохраняет жёсткий смысл κολάζω в контексте царской репрессивной политики.
- source_word: λείψαμεν
  choice: мы оставим
  rationale: Сохраняется первое лицо множественного числа и буквальный смысл необычной, сжатой греческой конструкции с последующим инфинитивом.
- source_word: εἰς τὸν ἐπίλοιπον χρόνον
  choice: на будущее
  rationale: Естественное современное русское выражение для всего остающегося времени.
- source_word: τελείως ἡμῖν
  choice: будучи вполне уверены
  rationale: В контексте наречие выражает полноту уверенности говорящих в ожидаемом результате; дательный ἡμῖν соотнесён с субъектом первого лица.
- source_word: τὰ πράγματα
  choice: наши дела
  rationale: Широкое обозначение государственных дел и положения царства; притяжательное местоимение ясно передаёт царскую перспективу контекста.
- source_word: ἐν εὐσταθείᾳ
  choice: в устойчивое ... состояние
  rationale: Передаёт значение прочности и стабильности, избегая неестественного русского «в устойчивости».
- source_word: τῇ βελτίστῃ διαθέσει
  choice: в ... наилучшее состояние
  rationale: διάθεσις здесь обозначает устройство или состояние дел, а не внутреннее расположение.
- source_word: κατασταθήσεσθαι
  choice: будут приведены
  rationale: Будущий страдательный инфинитив передан русской пассивной формой со значением установления или приведения в определённое состояние.
