  rationale: Исправлен ложный русский смысл «отложить дела на будущее». Основной текст теперь естественно выражает вывод царского распоряжения, который поддержан контекстом и английской аудиторской записью. Сноска сохраняет синтаксическую трудность λείψαμεν и не скрывает, что более буквальная конструкция в русском неуклюжа.
