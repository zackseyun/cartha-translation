  to: Когда нечестивец узнал об этом[a], он пришёл в такую ярость, что гневался не только на живших в Александрии, но ещё суровее ополчился против живших в сельской местности[b]. Он приказал немедленно собрать всех в одном месте и предать их самой лютой смерти[c].
