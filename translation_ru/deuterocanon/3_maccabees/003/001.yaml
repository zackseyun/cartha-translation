  source_fidelity: 'Основной смысл передан точно: μεταλαβών уместно передано как «узнал об этом», δυσσεβής — как «нечестивец», а ὥστε и сравнительная степень βαρυτέρως сохранены. Однако в греческом тексте распоряжение охватывает как сбор всех в одном месте, так и лишение их жизни; придаточное цели «чтобы предать» несколько ослабляет это как содержание приказа. «Окрестных областях» также чрезмерно конкретизирует χώρα как именно прилегающие территории.'
  naturalness: Текст в целом литературный и ясный. Координация двух инфинитивных действий после «приказал» делает заключительную фразу точнее и естественнее, не меняя мрачного высокого регистра.
