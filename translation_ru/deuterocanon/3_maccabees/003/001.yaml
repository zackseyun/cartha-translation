  register: Современный литературный русский язык с умеренно высоким повествовательным регистром. Синтаксис разделён на два предложения ради ясности; сохранены нарастание гнева, сравнительная степень враждебности и срочность приказа. Все маркеры сносок размещены непосредственно при соответствующих выражениях.
