base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/001.yaml
  text: And when the impious man had taken this in[a], he became so enraged that he was angry not only with those in Alexandria, but also opposed those in the countryside more harshly; and after ordering that they quickly gather all together in one place[c][b], he intended to remove them from life by the cruelest fate.
translation:
  language: ru
  text: Когда нечестивец узнал об этом[a], он пришёл в такую ярость, что гневался не только на живших в Александрии, но ещё суровее ополчился против живших в сельской местности[b]. Он приказал немедленно собрать всех в одном месте и предать их самой лютой смерти[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «получив это известие». Греческое μεταλαβών может обозначать получение сведений, а также восприятие чего-либо в более общем смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «живших в χώρα». В противопоставлении Александрии речь, вероятнее всего, идёт о внегородской территории или сельской местности.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «перевести [их] от жизни», то есть умертвить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλαβὼν
  choice: узнал об этом
  rationale: В данном контексте причастие естественно обозначает получение известия; русский оборот сохраняет причинную связь и не уточняет способ получения сведений.
- source_word: δυσσεβὴς
  choice: нечестивец
  rationale: Передаёт религиозно-нравственную оценку δυσσεβής и звучит кратко и достойно.
- source_word: ἐξεχόλησεν
  choice: пришёл в такую ярость
  rationale: Передаёт сильнейший гнев и естественно вводит следственное ὥστε.
- source_word: τοῖς κατὰ Ἀλεξάνδρειαν
  choice: на живших в Александрии
  rationale: Идиоматически обозначает находившихся в Александрии людей, не добавляя прямо отсутствующее в этой фразе наименование народа.
- source_word: τοῖς ἐν τῇ χώρᾳ
  choice: против живших в окрестных областях
  rationale: В противопоставлении Александрии χώρα указывает на внегородские районы или сельскую местность, а не на страну как отвлечённое целое.
- source_word: βαρυτέρως ἐναντιοῦσθαι
  choice: ещё суровее ополчился против
  rationale: Сохраняет сравнительную степень и выражает усиленную враждебность без обязательного утверждения уже совершённого насилия.
- source_word: προστάξας σπεύδοντας συναγαγεῖν πάντας ἐπὶ τὸ αὐτό
  choice: приказал немедленно собрать всех в одном месте
  rationale: Передаёт сжатую и неоднозначную конструкцию как срочное распоряжение о всеобщем сборе, не вводя в текст не названных прямо исполнителей.
- source_word: χειρίστῳ μόρῳ
  choice: самой лютой смерти
  rationale: В сочетании с выведением из жизни μόρος обозначает ужасную погибель; по-русски «лютая смерть» естественно передаёт превосходную степень.
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: предать их ... смерти
  rationale: Ясно выражает эвфемистическое значение буквального «перевести от жизни», сохраняя торжественный регистр.
