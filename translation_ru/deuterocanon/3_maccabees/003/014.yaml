  text: concerning our campaign into Asia[a], which you yourselves also know, which by the unfailing alliance of the gods was brought, as was fitting, to its conclusion[b],
translation:
  language: ru
  text: Что же касается предпринятого нами похода в Азию, о котором и вы сами знаете, то при неизменной поддержке богов он, как и следовало ожидать, был доведён до завершения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был доведён до конца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρατείας
  choice: похода
  rationale: Слово обозначает военную экспедицию или кампанию; «поход» естественно и кратко передаёт военный смысл.
- source_word: εἰς τὴν Ἀσίαν
  choice: в Азию
  rationale: Предлог εἰς выражает направленное движение в область; русский оборот «поход в Азию» сохраняет эту направленность.
- source_word: γενομένης ἡμῖν
  choice: предпринятого нами
  rationale: Так явно передаётся участие говорящего, выраженное сочетанием генитивной конструкции с дательным ἡμῖν; формулировка естественна для официальной речи.
- source_word: ἧς ἴστε καὶ αὐτοί
  choice: о котором и вы сами знаете
  rationale: «Сами» сохраняет эмфазу αὐτοί, а «и» — значение καί.
- source_word: ἀρρωστῷ
  choice: неизменной
  rationale: Прилагательное буквально указывает на отсутствие слабости или немощи; в сочетании с поддержкой оно означает стойкость и надёжность, не обязательно непобедимость.
- source_word: συμμαχίᾳ
  choice: поддержке
  rationale: Хотя слово может означать военный союз, применительно к богам здесь естественнее «поддержка», при этом сохраняется смысл содействия в войне.
- source_word: τῶν θεῶν
  choice: богов
  rationale: Сохранено явное множественное число греческого текста и языческая перспектива царской речи.
- source_word: κατὰ λόγον
  choice: как и следовало ожидать
  rationale: Оборот указывает на исход, соответствующий разумному ожиданию или должному порядку; эта формулировка естественно передаёт оценочный оттенок.
- source_word: ἐπὶ τέλος ἀχθείσης
  choice: был доведён до завершения
  rationale: Сохранены пассивная конструкция и значение доведения дела до конца.
theological_decisions:
- issue: Упоминание языческих божеств в царской речи
  choice: богов
  alternative: Бога; божественной помощью
  rationale: В греческом стоит явное множественное число τῶν θεῶν. Перевод сохраняет историко-религиозный голос говорящего и не приводит его речь к монотеистической формулировке.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского сообщения. Синтаксис слегка развёрнут, но понятен обычному читателю; языческая терминология источника сохранена без богословской нормализации.
