base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/025.yaml
  text: We have ordered that[a], as soon as this letter arrives, those enrolled, together with their wives and children, be sent to us at once in iron bonds, shut in on every side, with abuse and plundering[c][b], for an incurable and disgraceful pit fit for enemies.
translation:
  language: ru
  text: Мы повелели, чтобы сразу по прибытии этого письма внесённых в списки[a] вместе с жёнами и детьми немедленно отправили к нам в железных оковах, наглухо запертыми со всех сторон, с унижениями и обиранием[b] — в неисцелимую и позорную яму[c], подобающую врагам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зарегистрированных», «перечисленных поимённо»; греческое причастие обозначает людей, официально внесённых в реестр.'
    reason: lexical_alternative
  - marker: b
    text: Греческое выражение соединяет унизительное, оскорбительное обращение (ὕβρις) с обиранием или насильственным лишением имущества и одежды (σκυλμοί).
    reason: lexical_alternative
  - marker: c
    text: «Яма» может означать буквальное место заключения или гибели либо служить ярким образом позорной погибели.
    reason: lexical_alternative
lexical_decisions:
- source_word: προστετάχαμεν
  choice: Мы повелели
  rationale: Перфект передаёт уже отданное и сохраняющее силу властное распоряжение; «повелели» соответствует высокому регистру царского указа.
- source_word: ἅμα τῷ προσπεσεῖν τὴν ἐπιστολὴν τήνδε
  choice: сразу по прибытии этого письма
  rationale: Конструкция ἅμα τῷ с инфинитивом выражает непосредственное следование во времени, а προσπίπτω применительно к письму означает его прибытие или доставку.
- source_word: αἰθωρεὶ
  choice: немедленно
  rationale: Наречие подчёркивает безотлагательность исполнения приказа.
- source_word: τοὺς ἐννεμομένους
  choice: внесённых в списки
  rationale: Причастие обозначает людей, официально внесённых в реестр; формулировка сохраняет бюрократический оттенок и не предполагает добровольной записи.
- source_word: σὺν ταῖς γυναιξὶ καὶ τέκνοις
  choice: вместе с жёнами и детьми
  rationale: В данном контексте γυναιξί естественно обозначает жён перечисленных мужчин.
- source_word: μετὰ ὕβρεως καὶ σκυλμῶν
  choice: подвергая унижениям и разграблению
  rationale: ὕβρις передаёт оскорбительное, унизительное насилие, а σκυλμοί — обирание, лишение имущества или одежды; перевод сохраняет оба аспекта.
- source_word: ἀποστεῖλαι πρὸς ἡμᾶς
  choice: отправили к нам
  rationale: Инфинитив зависит от глагола приказания; русская конструкция с «чтобы» естественно передаёт содержание указа.
- source_word: ἐν δεσμοῖς σιδηροῖς
  choice: в железных оковах
  rationale: δεσμοί обозначает средства связывания или заключения; «оковы» точно и естественно передают железные путы.
- source_word: πάντοθεν κατακεκλεισμένους
  choice: со всех сторон под стражей
  rationale: Перфектное причастие описывает состояние полной изоляции и невозможности бегства; буквальное «запертых со всех сторон» по-русски менее естественно при перевозке людей.
- source_word: εἰς ἀνήκεστον καὶ δυσκλεῆ πρέποντα δυσμενέσιν βόθρον
  choice: в неисцелимую и позорную яму, подобающую врагам
  rationale: Сохранены буквальный образ βόθρος и медицинская семантика ἀνήκεστος («неисцелимый»); εἰς передано как направление движения, не исключая образного смысла места погибели.
