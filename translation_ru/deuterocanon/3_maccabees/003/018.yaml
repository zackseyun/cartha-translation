base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/018.yaml
  text: Carried away by ancient conceit[a], they barred us from entry, falling short of our strength, by which we have goodwill toward all people.
translation:
  language: ru
  text: Увлечённые давней гордыней[a], они не допустили нас внутрь, хотя и уступали нам в силе, силой которой мы проявляем человеколюбие ко всем людям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «движимые давней надменностью»; греческий оборот может указывать на укоренившуюся гордыню или самомнение.'
    reason: Лексически сжатый оборот допускает несколько близких оттенков значения.
lexical_decisions:
- source_word: τύφοις φερόμενοι παλαιοτέροις
  choice: увлечённые давней гордыней
  rationale: Оборот передаёт пассивное увлечение укоренившейся надменностью. «Давней» естественно выражает идиоматическое значение сравнительной формы παλαιοτέροις, а «гордыней» — нравственный оттенок τύφοις.
- source_word: εἶρξαν ἡμᾶς τῆς εἰσόδου
  choice: они не допустили нас внутрь
  rationale: Конструкция с родительным падежом означает воспрепятствовать входу; выбран естественный современный русский оборот.
- source_word: λειπόμενοι τῆς ἡμετέρας ἀλκῆς
  choice: хотя и уступали нам в силе
  rationale: λειπόμενοι обозначает недостаточность или отставание по сравнению с силой говорящего. Уступительное «хотя и» ясно передаёт смысловую напряжённость фразы, не устраняя её риторического характера.
- source_word: διʼ ἣν
  choice: благодаря которой
  rationale: Относительное местоимение отнесено к ἀλκῆς и сохраняет выраженную в греческом связь силы с последующим человеколюбием.
- source_word: φιλανθρωπίαν
  choice: человеколюбие
  rationale: Слово обозначает благожелательное, гуманное отношение к людям; «человеколюбие» сохраняет смысл и возвышенный официальный регистр.
- source_word: πρὸς ἅπαντας ἀνθρώπους
  choice: ко всем людям
  rationale: ἀνθρώπους здесь имеет обобщённое значение и не указывает исключительно на мужчин.
theological_decisions:
- issue: Обобщённое значение ἀνθρώπους
  choice: всем людям
  alternative: всем человекам / всем мужчинам
  rationale: В данном контексте существительное относится ко всем людям без различия пола; современная формулировка точно передаёт объём значения.
- issue: Связь διʼ ἣν с ἀλκῆς
  choice: благодаря силе мы проявляем человеколюбие
  alternative: из-за их поступка мы проявляем человеколюбие
  rationale: Женский род относительного местоимения ἣν грамматически указывает на ἀλκῆς. Необычная риторическая связь силы и человеколюбия сохранена, а не истолкована за автора.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным официальным тоном, соответствующим царской речи. Синтаксическая и смысловая напряжённость заключительной части сохранена.
