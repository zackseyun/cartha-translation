base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/001.yaml
  text: And everywhere this decree arrived[a], a public celebration was organized among the nations with shouting and joy[b], as though the hatred long before dancing in their minds against them were now being openly displayed with boldness.
translation:
  language: ru
  text: И повсюду, куда приходил этот указ, среди язычников устраивали общественное пиршество с криками и ликованием, словно ненависть к ним, давно уже бурлившая в их помыслах, теперь открыто и смело проявлялась.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переданное как «бурлившая», трудно для истолкования и буквально вызывает образ ненависти, которая уже прежде «подпрыгивала» или «скакала» в их помыслах.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντῃ δὲ ὅπου προσέπιπτεν
  choice: И повсюду, куда приходил
  rationale: Передаёт широкий охват и повторяющееся прибытие указа; имперфект естественно выражен несовершенным видом.
- source_word: πρόσταγμα
  choice: указ
  rationale: Официальное властное распоряжение; «указ» естественен для современного русского повествования.
- source_word: δημοτελὴς ... εὐωχία
  choice: общественное пиршество
  rationale: εὐωχία означает праздничное угощение или пир, а δημοτελής указывает на общественный характер и, возможно, оплату из общественных средств.
- source_word: τοῖς ἔθνεσιν
  choice: среди язычников
  rationale: В данном иудейском повествовательном контексте речь идёт о нееврейском населении, а не просто о политических нациях.
- source_word: μετὰ ἀλαλαγμῶν καὶ χαρᾶς
  choice: с криками и ликованием
  rationale: Сохраняет громкость ἀλαλαγμοί и праздничную эмоциональность χαρά, не уточняя чрезмерно характер криков.
- source_word: προκατεσκιρωμένης ... κατὰ διάνοιαν
  choice: уже прежде таившаяся в их помыслах
  rationale: Трудная и образная форма обозначает ненависть, ранее внутренне живую или возбуждённую; гладкий русский текст передаёт скрытое прежде внутреннее состояние, а образная трудность отмечена в сноске.
- source_word: μετὰ παρρησίας νῦν ἐκφαινομένης
  choice: теперь открыто и дерзко вырывалась наружу
  rationale: Передаёт переход от внутренней вражды к её явному и смелому публичному проявлению.
theological_decisions:
- issue: Значение τοῖς ἔθνεσιν в иудейском контексте
  choice: среди язычников
  alternative: среди народов
  rationale: Контекст противопоставляет евреев нееврейскому населению; «язычники» сохраняет это социально-религиозное значение без введения конфессиональной доктрины.
- issue: Степень буквальности προκατεσκιρωμένης
  choice: таившаяся в их помыслах с пояснением в сноске
  alternative: скакавшая / плясавшая в их помыслах
  rationale: Буквальная метафора в русском звучит комически и может исказить тон; основной текст сохраняет противопоставление скрытой и открытой ненависти, а сноска сообщает образность и неуверенность формы.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Пиршество» сохраняет конкретность праздничной трапезы; синтаксис подчёркивает переход от давно скрытой ненависти к её открытому проявлению.
