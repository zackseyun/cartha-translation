review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: сохранены недавно состоявшееся вступление в брак, смена радости плачем, пыль на умащённых волосах, непокрытые головы, коллективный плач и сравнение с пострадавшими от чужеземного насилия. Однако «ради совместной жизни в брачный покой» синтаксически связывает цель с местом не вполне естественно и несколько затемняет греческую конструкцию πρὸς βίου κοινωνίαν γαμικὸν ... παστόν.'
  naturalness: Текст литературный и соответствует трагическому регистру, но «в один голос затянули погребальный плач» излишне сужает θρῆνος до похоронного обряда и разговорно окрашенное «затянули» ослабляет высокий стиль. Перестройка фразы также позволяет яснее сохранить одновременность образов.
  terminology: «Брачный покой», «умащённые благовониями», «с непокрытыми головами» и «свадебные песни» уместны. Для αἰκίαις следует предпочесть более широкое «жестокости» либо «надругательства», не конкретизируя характер насилия. Примечания должны соответствовать выбранному основному прочтению.
  issues:
  - severity: medium
    issue: Не вполне удачная передача цели и порядка греческой конструкции с πρὸς βίου κοινωνίαν и γαμικὸν παστόν.
    rationale: «Вошедшие ради совместной жизни в брачный покой» звучит по-русски так, будто «ради совместной жизни» относится к самому помещению. «Вступившие в брачный покой, чтобы начать супружескую жизнь» естественно и ясно передаёт цель.
  - severity: low
    issue: «Погребальный плач» чрезмерно конкретизирует θρῆνος.
    rationale: θρῆνος — скорбный плач или причитание; контекст не требует обозначать его именно как погребальный.
  - severity: low
    issue: «Затянули» стилистически менее уместно и несколько добавляет оттенок протяжного пения.
    rationale: Глагол ἐξῆρχον в контексте допускает «завели/подняли плач»; «завели общий плач» сохраняет действие без лишней конкретизации.
