  yaml_path: translation/deuterocanon/3_maccabees/004/006.yaml
  text: And the young women who had just entered the bridal chamber for the sharing of life in marriage[a], taking up lamentation instead of joy, and with their perfume-drenched hair smeared with dust, were being led away unveiled, and with one accord raised a dirge instead of wedding songs[c][b], as though torn apart by abuse from foreigners.
translation:
  language: ru
  text: А юные женщины, только что вступившие в брачный покой, чтобы начать супружескую жизнь[a], вместо радости предались плачу. С умащёнными благовониями волосами, вымазанными пылью, их вели с непокрытыми головами[b]; и все они единодушно завели плач вместо свадебных песен — словно истерзанные надругательствами чужеземцев[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на брачное ложе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «непокрытыми»; в данном контексте это подчёркивает публичное унижение.'
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «словно истерзанные чужеземными надругательствами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτι
  choice: лишь недавно
  rationale: Передаёт непосредственную недавность вступления в брак и естественно сочетается с русским причастным оборотом.
- source_word: πρὸς βίου κοινωνίαν
  choice: ради совместной жизни
  rationale: Сохраняет идею участия в общей жизни, не добавляя отсутствующего в греческом тексте прямого упоминания супруга.
- source_word: γαμικὸν ... παστὸν
  choice: брачный покой
  rationale: Пастос обозначает брачный покой или брачное ложе; выбранный вариант сохраняет широту образа и подходит к возвышенному повествованию.
- source_word: νεάνιδες
  choice: юные женщины
  rationale: Прямо передаёт возраст и пол; брачный статус уже ясен из контекста.
- source_word: ἀντὶ τέρψεως μεταλαβοῦσαι γόους
  choice: вместо радости предались плачу
  rationale: Естественно передаёт резкую замену свадебной радости скорбью.
- source_word: μυροβρεχῆ ... κόμην
  choice: умащённые благовониями волосы
  rationale: Передаёт волосы, обильно смоченные ароматическим маслом, без неоправданного уточнения конкретного вещества.
- source_word: κόνει ... πεφυρμέναι
  choice: были вымазаны пылью
  rationale: Сохраняет образ осквернения нарядно приготовленных волос пылью.
- source_word: ἀκαλύπτως
  choice: с непокрытой головой
  rationale: Ясно передаёт буквальный смысл и культурно значимый характер публичного унижения.
- source_word: ἀγόμεναι
  choice: их вели
  rationale: Передаёт пассивное и принудительное перемещение, не усиливая степень насилия сверх текста.
- source_word: θρῆνον ... ἐξῆρχον
  choice: затянули погребальный плач
  rationale: Глагол может означать начинать или запевать; «затянули» естественно передаёт начало общего скорбного пения.
- source_word: ὑμεναίων
  choice: свадебных песен
  rationale: Современный и понятный эквивалент брачных гимнов или песен.
- source_word: ὁμοθυμαδόν
  choice: все они в один голос
  rationale: Передаёт единодушное совместное действие женщин.
- source_word: ὡς ἐσπαραγμέναι αἰκίαις ἀλλοεθνεῖσιν
  choice: словно растерзанные надругательствами чужеземцев
  rationale: Сохраняет сравнительную частицу, сильный образ терзания и связь истязаний с людьми иного народа; грамматическая связь последнего прилагательного допускает более буквальное «чужеземными надругательствами».
