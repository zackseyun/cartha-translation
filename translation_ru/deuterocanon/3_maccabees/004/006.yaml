revisions:
- from: А юные женщины, лишь недавно вошедшие ради совместной жизни в брачный покой[a], вместо радости предались плачу. Их умащённые благовониями волосы были вымазаны пылью; их вели с непокрытой головой[b], и все они в один голос затянули погребальный плач вместо свадебных песен — словно растерзанные надругательствами чужеземцев[c].
  to: А юные женщины, только что вступившие в брачный покой, чтобы начать супружескую жизнь[a], вместо радости предались плачу. С умащёнными благовониями волосами, вымазанными пылью, их вели с непокрытыми головами[b]; и все они единодушно завели плач вместо свадебных песен — словно истерзанные надругательствами чужеземцев[c].
  rationale: 'Перевод уточнён там, где русская конструкция была не вполне естественной, а «погребальный» неоправданно сужал значение θρῆνος. Сравнение в конце сохранено образным и неоднозначным: греческое ἀλλοεθνεῖσιν может характеризовать как самих чужеземцев, так и совершаемые ими надругательства; альтернативное прочтение вынесено в примечание.'
