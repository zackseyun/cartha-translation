  yaml_path: translation/deuterocanon/3_maccabees/004/005.yaml
  text: For an old man was being led along[a], full of gray hair, bent over by the weakness in his feet that comes with age, driven by the violent force of being thrown down[c][b], making use of a swift march without any regard for all dignity.
translation:
  language: ru
  text: Ведь вели старца, убелённого сединами, согбенного старческой слабостью в ногах, жестоко подгоняя так, что он едва не падал[a], и вынуждая идти быстрым шагом без всякого соблюдения достоинства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение сжато и допускает разные толкования: оно может обозначать насильственный напор, опрокидывание либо такое принуждение, при котором старец спотыкался или был близок к падению.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «без всякого стыда» или «без всякого соблюдения приличий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγετο
  choice: вели
  rationale: Имперфект пассива передаёт продолжающееся действие; «вели» естественно звучит по-русски и не уточняет действующее лицо.
- source_word: γέρων
  choice: старца
  rationale: В контексте обозначает пожилого мужчину, а не носителя должности; «старец» сохраняет достоинство и возрастной оттенок без архаической тяжеловесности.
- source_word: πλήρης πολιᾶς
  choice: убелённого сединами
  rationale: Передаёт яркий образ человека, чья голова покрыта седыми волосами, в естественном литературном русском выражении.
- source_word: πεπυκασμένος … ἐπικύφων
  choice: согбенного
  rationale: Контекст изображает сгорбленную, сжатую старостью фигуру; единое русское определение избегает неестественного повтора близких телесных образов.
- source_word: τὴν ἐκ τοῦ γήρως νωθρίτητα ποδῶν
  choice: от старческой слабости в ногах
  rationale: νωθρίτης может означать вялость, медлительность или немощь; «слабость» ясно передаёт телесную дряхлость в данном контексте.
- source_word: ἀνατροπῆς ὁρμῇ βιαίας
  choice: жестоким напором его валили с ног
  rationale: Сжатое и трудное греческое выражение связывает насильственный напор с падением или опрокидыванием; перевод сохраняет физическое принуждение, а примечание отмечает неоднозначность.
- source_word: ἁπάσης αἰδοῦς ἄνευ
  choice: без всякого уважения к его достоинству
  rationale: αἰδώς включает стыд, почтение и чувство приличия; здесь выражение подчёркивает полное пренебрежение достоинством пожилого человека.
- source_word: πρὸς ὀξεῖαν καταχρώμενος πορείαν
  choice: заставляли идти быстро
  rationale: Передаёт навязанный немощному старцу быстрый темп движения и естественно связывает оборот с общей картиной насилия.
