  - severity: medium
    issue: Добавлено отсутствующее в оригинале «зрелище, вызывавшее».
    rationale: Греческое λαμβάνοντας ... τὸν κοινὸν ἔλεον обозначает восприятие общего человеческого сострадания; добавление «зрелище» конкретизирует текст без основания и меняет объект восприятия.
  - severity: medium
    issue: «Горькая жестокость бессердечной души» стилистически неудачна.
    rationale: Оборот калькирует греческие абстрактные существительные и звучит по-русски неестественно. «С жестокой горечью безжалостной души» ближе к образу и литературнее.
