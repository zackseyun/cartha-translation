  yaml_path: translation/deuterocanon/3_maccabees/004/004.yaml
  text: For with the bitter cruelty of a merciless spirit they were being sent out together by the generals in each city[a], so that, beyond the outrageous punishments, even some of their enemies, seeing the common pity before their eyes and considering the uncertain ruin of their life[b], were weeping over their wretched deportation.
translation:
  language: ru
  text: Ибо городские начальники с жестокой горечью безжалостной души сообща высылали их; так что, помимо этих необычайных наказаний, даже некоторые из врагов, видя перед собой общее человеческое сострадание и размышляя о неясном конце их жизни, плакали об их злосчастном изгнании.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πικρίας ἀνοίκτου ψυχῆς
  choice: с горькой жестокостью бессердечной души
  rationale: Передаёт как πικρία — ожесточённую горечь и суровость, так и ἄνοικτος — отсутствие жалости; ψυχή здесь обозначает внутренний нравственный настрой.
- source_word: οἱ κατὰ πόλιν στρατηγοί
  choice: начальники каждого города
  rationale: στρατηγός может обозначать военного или гражданского правителя. Нейтральное «начальники» сохраняет должностной смысл, не сужая его до современного воинского звания.
- source_word: ὁμοθυμαδόν
  choice: всех вместе
  rationale: В контексте наречие относится к совокупному удалению людей; формулировка естественно передаёт коллективность действия, не приписывая жертвам единодушия.
- source_word: ἐξαπεστέλλοντο
  choice: высылали
  rationale: Глагол буквально означает «отсылать прочь», а контекст указывает на принудительное удаление. «Высылали» сохраняет этот смысл без преждевременного уточнения формы депортации.
- source_word: ἐπὶ ταῖς ἐξάλλοις τιμωρίαις
  choice: наказания были столь чудовищны
  rationale: ἐξάλλοις означает необычайные, крайние, выходящие за всякую меру; перестройка с «столь… что» ясно передаёт результативную конструкцию ὥστε.
- source_word: τὸν κοινὸν ἔλεον
  choice: зрелище, вызывавшее общечеловеческое сострадание
  rationale: Буквальное «общее сострадание» по-русски не вполне ясно. Контекст допускает понимание κοινός как свойственного людям вообще; добавление «зрелище» раскрывает объект глагола «видя» без устранения образа непосредственного наблюдения.
- source_word: τὴν ἄδηλον τοῦ βίου καταστροφήν
  choice: неведомом исходе их жизни
  rationale: ἄδηλος — неясный, неведомый; καταστροφή может означать конец, исход или гибель. «Исход» сохраняет зловещую неопределённость и не решает, идёт ли речь именно о смерти.
- source_word: τὴν δυσάθλιον ἐξαποστολήν
  choice: их злосчастном изгнании
  rationale: Существительное обозначает отсылку прочь и соотносится с более ранним глаголом; «изгнание» естественно выражает насильственный характер происходящего, а «злосчастное» передаёт усилительное δυσάθλιον.
