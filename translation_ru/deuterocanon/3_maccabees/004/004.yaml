review_pass:
  verdict: revise
  source_fidelity: 'Вторая фраза чересчур далеко отходит от синтаксиса и семантики греческого текста: ἐπὶ ταῖς ἐξάλλοις τιμωρίαις имеет добавочное значение «помимо/вдобавок к необычайным наказаниям», а не причинно-следственное «наказания были столь... что». Вставка «зрелище, вызывавшее» отсутствует в оригинале и подменяет прямой объект «общее сострадание».'
  naturalness: «С горькой жестокостью бессердечной души» тяжеловесно и неестественно для современного литературного русского. «Начальники каждого города» допустимо, но «городские начальники» точнее передаёт κατὰ πόλιν и не создаёт смысла по одному начальнику на город. Исправленный текст сохраняет высокий повествовательный регистр без искусственных оборотов.
  terminology: «Высылали» и «изгнание» удачно передают принудительное удаление, не навязывая конкретной административной категории. «Общее человеческое сострадание» сохраняет τὸν κοινὸν ἔλεον без добавления отсутствующего «зрелища». «Неясный конец их жизни» передаёт ἄδηλον и καταστροφή, сохраняя мрачную неопределённость.
