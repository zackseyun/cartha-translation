revisions:
- from: Ибо с горькой жестокостью бессердечной души их всех вместе высылали начальники каждого города[a]. И наказания были столь чудовищны, что даже некоторые из врагов, видя перед собой зрелище, вызывавшее общечеловеческое сострадание[b], и размышляя о неведомом исходе их жизни[c], плакали об их злосчастном изгнании.
  to: Ибо городские начальники с жестокой горечью безжалостной души сообща высылали их; так что, помимо этих необычайных наказаний, даже некоторые из врагов, видя перед собой общее человеческое сострадание и размышляя о неясном конце их жизни, плакали об их злосчастном изгнании.
  rationale: Сохранена принудительность высылки и неопределённость будущего изгнанников. Восстановлены добавочное значение «помимо этих необычайных наказаний» и прямое упоминание общего человеческого сострадания; устранена не предусмотренная оригиналом образная вставка. Сноски сохранены, но в исправленном полном тексте для каждого маркера восстановлена привязка.
  reviewer_model: gpt-5.6-terra
