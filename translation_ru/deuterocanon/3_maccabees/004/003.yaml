lexical_decisions:
- source_word: νομός
  choice: область
  rationale: В эллинистическом употреблении слово обозначает административную территорию; «область» естественно передаёт этот смысл и сохраняет переход от более крупной территории к городу и улицам.
- source_word: πόλις
  choice: город
  rationale: Обычное значение греческого слова и естественное русское обозначение городского сообщества или населённого пункта.
- source_word: τὸ σύνολον
  choice: да и вообще
  rationale: Сочетание употреблено усилительно и расширяет охват риторического вопроса; перевод передаёт это естественным современным русским оборотом.
- source_word: οἰκτιστὸς τόπος
  choice: обитаемое место
  rationale: Прилагательное в данном свидетеле необычно, однако контекст указывает на всякое место проживания людей; формулировка сохраняет предполагаемый смысл, не скрывая текстовой трудности, отмеченной в сноске.
- source_word: ἀγυιαί
  choice: улицы
  rationale: В контексте населённых мест речь идёт о публичных городских улицах; это наиболее естественный русский эквивалент.
- source_word: κοπετοῦ
  choice: плачем
  rationale: Слово обозначает траурный плач и может включать ритуальное биение себя в грудь; в основном тексте выбран понятный широкий эквивалент, а более узкий оттенок вынесен в сноску.
- source_word: γόων
  choice: стенаниями
  rationale: Слово подчёркивает слышимое выражение скорби; «стенания» хорошо сочетаются с «плачем» и сохраняют возвышенную тональность.
- source_word: ἐπʼ αὐτοῖς
  choice: о них
  rationale: Предлог указывает на тех, кто стал предметом скорби; «плач и стенания о них» естественно звучит по-русски и не уточняет сверх текста, были ли они причиной или непосредственным объектом оплакивания.
- source_word: οὐκ ἐνεπιπλῶντο
  choice: не наполнялись
  rationale: Имперфект передаёт продолжавшееся наполнение; форма множественного числа соответствует греческому сказуемому и согласуется со всей перечисленной совокупностью мест, особенно с «улицами».
