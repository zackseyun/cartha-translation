  yaml_path: translation/deuterocanon/3_maccabees/004/012.yaml
  text: And when this happened[a], having heard that his fellow countrymen from the city were secretly going out and more frequently slipping away because of the misery of their brothers[c][b],
translation:
  language: ru
  text: Когда это произошло, он услышал, что его соплеменники тайно покидают город и всё чаще ускользают из-за бедственного положения своих братьев[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст в этом месте труден, особенно слово ἰχθεῖ, переданное рукописной традицией. Перевод «из-за бедственного положения своих братьев» следует вероятному контекстуальному смыслу всего оборота; буквальное значение сохранившейся формы здесь неясно.
    reason: textual_variant
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: Когда это произошло
  rationale: Естественно передаёт временной оборот с ὡς и аористом; δέ здесь служит связкой и не требует подчёркнутого противопоставления.
- source_word: ἀκούσας
  choice: он услышал
  rationale: Личный глагол естественнее в современном русском; субъект восстанавливается из контекста, как и в английском консультационном слое.
- source_word: τοὺς ἐκ τῆς πόλεως ὁμοεθνεῖς
  choice: его соплеменники из города
  rationale: «Соплеменники» точно и кратко передаёт общность народа или этнического происхождения; притяжательное местоимение добавлено по контексту.
- source_word: κρυβῇ ἐκπορευομένους
  choice: тайно уходят
  rationale: Передаёт наречное κρυβῇ и движение прочь, выраженное ἐκπορευομένους, без ненужного уточнения направления.
- source_word: πυκνότερον ὑποδιδράσκειν
  choice: всё чаще скрываются
  rationale: πυκνότερον в контексте обозначает возрастающую частоту, а ὑποδιδράσκειν — тайное уклонение или бегство; «скрываются» сохраняет оттенок незаметного ухода.
- source_word: τὴν ἰχθεῖ τῶν ἀδελφῶν ταλαιπωρίαν
  choice: не в силах видеть бедственное положение своих братьев
  rationale: Передача следует вероятному контекстуальному смыслу трудного, по-видимому испорченного чтения ἰχθεῖ, не создавая ложной буквальной ясности.
- source_word: τῶν ἀδελφῶν
  choice: своих братьев
  rationale: Сохраняет образ родственной и народной солидарности, не заменяя его истолкованием «иудеев».
