revisions:
- from: К тому же сверху был устроен плотный дощатый настил, чтобы, со всех сторон лишённые света, они на всём морском пути подвергались обращению, подобающему заговорщикам.[a]
  to: К тому же сверху был устроен плотный дощатый настил, чтобы они, со всех сторон погружённые во тьму, на протяжении всего плавания перевозились как заговорщики.[a]
  rationale: Исправление заменяет неясное «подвергались обращению» на естественную формулировку, прямо выражающую принудительную перевозку. Сохранены цель настила, всесторонняя темнота, весь период плавания и пейоративная характеристика как чужая оценка, а не утверждение о вине людей.
