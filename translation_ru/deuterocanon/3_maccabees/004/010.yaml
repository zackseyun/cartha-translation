  text: and with the dense planking above arranged so that[a], their eyes being darkened on every side, they might receive a transport fit for plotters throughout the whole voyage.
translation:
  language: ru
  text: К тому же сверху был устроен плотный дощатый настил, чтобы они, со всех сторон погружённые во тьму, на протяжении всего плавания перевозились как заговорщики.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на протяжении всего морского перехода их перевозили как злоумышленников». Греческое слово ἐπίβολος имеет неодобрительный оттенок и может означать «заговорщик», «злоумышленник» или, шире, «опасный человек».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθύπερθε
  choice: сверху
  rationale: Наречие указывает на положение над узниками; «сверху» естественно и не уточняет устройство судна сверх сказанного в греческом тексте.
- source_word: πυκνῷ σανιδώματι
  choice: плотный дощатый настил
  rationale: σανίδωμα обозначает сооружение или покрытие из досок, а πυκνός — их плотное, не пропускающее свет расположение.
- source_word: διακειμένῳ
  choice: был устроен
  rationale: Причастие описывает целенаправленно созданное состояние настила, что подтверждается последующим придаточным цели с ὅπως.
- source_word: ὅπως πάντοθεν ἐσκοτισμένοι τοὺς ὀφθαλμούς
  choice: чтобы, со всех сторон лишённые света
  rationale: Передаёт цель устройства настила и зрительную изоляцию узников со всех сторон; буквальное упоминание глаз по-русски здесь звучало бы тяжеловесно.
- source_word: ἀγωγήν
  choice: обращению
  rationale: В сочетании ἀγωγὴν ... λαμβάνωσιν слово допускает смысл образа обращения или режима перевозки; «обращение» создаёт естественную русскую конструкцию, сохраняя акцент на унизительном способе транспортировки.
- source_word: ἐπιβόλων
  choice: подобающему заговорщикам
  rationale: Слово имеет неодобрительный смысл и обозначает злоумышленников или заговорщиков; такая формулировка показывает, что с узниками обращались как с опасными людьми, не утверждая, что они действительно были заговорщиками.
- source_word: ἐν παντὶ τῷ κατάπλῳ
  choice: на всём морском пути
  rationale: κατάπλους обозначает плавание или морской переход, а πᾶς подчёркивает его полную продолжительность.
