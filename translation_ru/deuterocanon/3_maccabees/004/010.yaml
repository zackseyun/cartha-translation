review_pass:
  verdict: revise
  source_fidelity: Черновик верно передаёт верхний дощатый настил, его цель — лишить людей света со всех сторон, — и продолжительность морского пути. Однако «подвергались обращению, подобающему заговорщикам» неестественно по-русски и несколько размывает ἀγωγήν, которое здесь относится к перевозке/препровождению. Формулировка «перевозились как заговорщики» ясно передаёт унизительный режим транспортировки, не утверждая, что они действительно были заговорщиками.
  naturalness: «Подвергались обращению» в данном контексте канцелярски и семантически неясно. «Погружённые во тьму» и «перевозились как заговорщики» современны, литературны и сохраняют смысл.
  terminology: «Дощатый настил» подходит для σανίδωμα; «плотный» сохраняет πυκνός. «Заговорщики» — допустимая передача пейоративного ἐπίβολοι; сноска отмечает более широкие варианты. Богословски нагруженных терминов нет.
