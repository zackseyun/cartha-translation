lexical_decisions:
- source_word: μετὰ δὲ τὸ προειρημένον τοῦ χρόνου διάστημα
  choice: По прошествии упомянутого промежутка времени
  rationale: Передаёт временное значение μετά и прямую отсылку προειρημένον к ранее названному сроку; переходное δέ естественно выражено самим началом новой фразы без избыточного противительного союза.
- source_word: προσηγγέλλον οἱ γραμματεῖς τῷ βασιλεῖ
  choice: писцы доложили царю
  rationale: γραμματεῖς обозначает служащих, ведущих записи; традиционное «писцы» сохраняет исторический колорит, а «доложили» естественно передаёт официальное сообщение царю. Греческий имперфект не требует искусственного русского длительного оборота.
- source_word: μηκέτι ἰσχύειν
  choice: уже невозможно продолжать
  rationale: μηκέτι указывает, что прежняя возможность исчерпана; «уже невозможно» передаёт практическую невозможность, а «продолжать» естественно следует из контекста и незавершённой переписи.
- source_word: τὴν τῶν Ἰουδαίων ἀπογραφὴν ποιεῖσθαι
  choice: продолжать их перепись
  rationale: ἀπογραφή может означать перепись, регистрацию или внесение в списки. В контексте массового учёта людей «перепись» наиболее естественна по-русски; местоимение «их» недвусмысленно отсылает к иудеям.
- source_word: διὰ τὴν ἀμέτρητον αὐτῶν πληθύν
  choice: из-за неисчислимого множества иудеев
  rationale: Передаёт причинное διά и усиленное значение ἀμέτρητον πληθύν — множества, не поддающегося счёту.
