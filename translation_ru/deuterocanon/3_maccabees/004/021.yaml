  text: Но это было неодолимое действие промысла Того, кто с небес помогает иудеям.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно: «Но это было неодолимое действие промысла Того, кто помогает иудеям с небес».'
