lexical_decisions:
- source_word: ἐνέργεια
  choice: действие
  rationale: Слово обозначает деятельное проявление или действие силы; «действие» естественно по-русски и не добавляет отсутствующего в тексте прямого указания на чудо.
- source_word: προνοίας
  choice: промысла
  rationale: В данном контексте речь идёт о попечении свыше. «Промысл» передаёт богословский оттенок предусмотрительной и действенной заботы, не называя Бога прямо.
- source_word: τοῦ βοηθοῦντος
  choice: Того, кто помогает
  rationale: Субстантивированное причастие передано описательно, без прямого добавления слова «Бог». Прописная буква естественно указывает на подразумеваемого божественного деятеля, не устраняя косвенность греческого выражения.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеям
  rationale: Здесь имеется в виду иудейский народ как этнорелигиозная общность, а не только жители Иудеи.
- source_word: ἐξ οὐρανοῦ
  choice: исходящего с небес
  rationale: В основном тексте оборот отнесён к «промыслу», что соответствует смыслу небесного происхождения помощи; возможное присоединение к «помогает» отмечено в сноске.
- source_word: ἀνίκητον
  choice: неодолимое
  rationale: «Неодолимое» передаёт невозможность превозмочь это действие и звучит естественнее по-русски, чем буквальное «непобедимое действие».
theological_decisions:
- issue: Кого обозначает выражение «Тот, кто помогает иудеям»
  choice: Подразумеваемый Бог не назван прямо, как и в греческом тексте.
  alternative: «Бог, помогающий иудеям»
  rationale: Греческий текст использует субстантивированное причастие и сохраняет косвенное именование; перевод не должен делать референта более явным, чем оригинал.
- issue: К чему относится ἐξ οὐρανοῦ («с небес»)
  choice: 'К промыслу: «исходящего с небес промысла».'
  alternative: 'К помогающему: «Того, кто помогает иудеям с небес».'
  rationale: Порядок слов допускает обе смысловые связи. Основной перевод следует пониманию небесного происхождения промысла, а альтернативное присоединение сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис сделан ясным, а косвенное именование Бога и неоднозначность связи оборота «с небес» сохранены.
