  text: Enraged[a], he ordered that these men too be treated in exactly the same way as those others, carefully, falling short in no way of their punishment.
translation:
  language: ru
  text: Придя в ярость, он приказал и с этими поступить так же, как с теми[a], тщательно следя за тем, чтобы ни в чём не отступить от наказания, которому подвергли тех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тщательно применить к этим тот же способ, что и к тем». Греческое выражение со словом τρόπων необычно по форме, но по смыслу приказ требует применить к этой группе такое же наказание, как к предыдущей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διοργισθείς
  choice: Придя в ярость
  rationale: Передаёт интенсивность аористного причастия от διοργίζω и естественно вводит последующее распоряжение.
- source_word: προσέταξεν
  choice: он приказал
  rationale: Прямо и естественно передаёт властное распоряжение в повествовательном контексте.
- source_word: καὶ τούτοις ὁμοῦ
  choice: и с этими
  rationale: Сохраняет добавочное значение καί и указание на нынешнюю группу; существительное в греческом не выражено, поэтому в русском также не добавляется.
- source_word: τὸν αὐτὸν τρόπων
  choice: точно так же
  rationale: Греческое выражение необычно по форме, но по контексту обозначает тот же способ обращения; наречная передача естественна по-русски.
- source_word: ἐπιμελῶς
  choice: тщательно
  rationale: Сохраняет значение старательного, неукоснительного исполнения приказа.
- source_word: ὡς ἐκείνοις ποιῆσαι
  choice: поступить ... как с теми
  rationale: Передаёт сопоставление обращения с двумя группами без добавления невыраженных подробностей.
- source_word: μὴ λειπομένους κατὰ μηδένα τρόπον
  choice: ни в чём не отступая
  rationale: Естественно воспроизводит усиленное отрицание и идею полного соответствия прежней мере наказания.
- source_word: τῆς ἐκείνων τιμωρίας
  choice: от меры их наказания
  rationale: Местоимение «их» относится к ранее упомянутым людям; слово «мера» поясняет сравнительный смысл, не меняя характера τιμωρία как наказания.
