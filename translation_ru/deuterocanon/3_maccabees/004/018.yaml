    text: 'Или: «большинство всё ещё оставалось в стране».'
    reason: lexical_alternative
  - marker: b
    text: Греческое выражение «другие — также в том месте» эллиптично; оно может означать, что другие собирались в определённой местности или в общественном месте.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: хотя
  rationale: Передаёт уступительное значение частицы естественным для современного русского языка союзом.
- source_word: ὄντων ἔτι κατὰ τὴν χώραν τῶν πλειόνων
  choice: большинство всё ещё оставалось по всей стране
  rationale: Генитивная абсолютная конструкция относится к большинству; κατὰ τὴν χώραν допускает распределительное понимание «по всей стране», при этом возможен и более общий смысл «в стране».
- source_word: τῶν μὲν κατὰ τὰς οἰκίας ἔτι συνεστηκότων
  choice: одни всё ещё собирались по домам
  rationale: Конструкция μὲν…δὲ разделяет большинство на две группы; συνεστηκότων обозначает совместное пребывание или собрание, а κατὰ τὰς οἰκίας имеет распределительный смысл.
- source_word: τῶν δὲ καὶ κατὰ τὸν τόπον
  choice: а другие также в том месте
  rationale: 'Сохраняется эллиптичность греческого выражения: сказуемое подразумевается, а τόπος не конкретизируется сверх текста.'
- source_word: ὡς ἀδυνάτου καθεστῶτος
  choice: поскольку … это стало невозможным
  rationale: ὡς передаёт причинный оттенок, а καθεστῶτος указывает на наступившее положение дел; местоимение «это» естественно восполняет подразумеваемый предмет невозможности, не уточняя его.
- source_word: πᾶσιν τοῖς ἐπ᾽ Αἴγυπτον στρατηγοῖς
  choice: для всех военачальников, поставленных над Египтом
  rationale: Дательный падеж передан оборотом «для всех», στρατηγοί — как военачальники, а ἐπ᾽ Αἴγυπτον — как назначение или власть над Египтом.
