translation:
  language: ru
  text: хотя большинство всё ещё оставалось по всей стране[a] — одни всё ещё собирались по домам, а другие — также в том месте[b], — поскольку сложившееся положение оказалось неразрешимым для всех военачальников, поставленных над Египтом.
  philosophy: optimal-equivalence
  footnotes:
