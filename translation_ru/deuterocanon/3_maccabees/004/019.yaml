revisions:
- from: Но против них настроились ещё суровее[a], решив, что их подкупили, чтобы устроить побег; и он, как оказалось, твёрдо уверился в этом.
  to: Но против них настроились ещё суровее[a], считая, что их подкупили ради замысла побега; и стало ясно, что он уверился в этом.
  rationale: Исправлено распределение смысла σαφῶς, чтобы «ясность» относилась к развитию дела, как в греческом. «Решив» заменено на «считая», что точнее сохраняет модально-обвинительный характер ὡς δεδωροκημένοις и не добавляет волевого решения. Сноска согласована с основной передачей трудной заключительной конструкции.
