lexical_decisions:
- source_word: ἐπείσθησαν … αὐτοῖς σκληρότερον
  choice: против них настроились ещё суровее
  rationale: Передаёт пассивную форму, неблагоприятную направленность дательного αὐτοῖς и сравнительное наречие σκληρότερον. Греческий оборот сжат и необычен, поэтому неоднозначность отмечена в сноске.
- source_word: ὡς δεδωροκημένοις
  choice: решив, что их подкупили
  rationale: ὡς вводит основание для подозрения, а перфектное пассивное причастие обозначает обвинение в подкупе; «решив» естественно связывает это основание с предшествующей реакцией.
- source_word: εἰς μηχανὴν τῆς ἐκφυγῆς
  choice: чтобы устроить побег
  rationale: μηχανή означает замысел, средство или уловку, а ἐκφυγή — побег; выбранная формулировка кратко и естественно передаёт цель предполагаемого подкупа.
- source_word: συνεβῆ σαφῶς αὐτὸν περὶ τούτου πιστωθῆναι
  choice: и он, как оказалось, твёрдо уверился в этом
  rationale: συνεβῆ передано оборотом «как оказалось», σαφῶς — усилением «твёрдо», а пассивный инфинитив πιστωθῆναι — естественным русским «уверился» без уточнения подразумеваемого лица.
