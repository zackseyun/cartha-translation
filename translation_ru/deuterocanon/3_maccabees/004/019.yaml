  source_fidelity: '«Против них настроились ещё суровее» удачно передаёт неблагоприятную направленность αὐτοῖς и сравнительную силу σκληρότερον, сохраняя сжатость трудного греческого оборота. Однако «твёрдо уверился» переносит σαφῶς на степень уверенности, тогда как оно естественнее относится к συνεβῆ: «стало ясно / оказалось ясно». «Решив» чрезмерно конкретизирует ὡς как принятое решение; «считая» точнее передаёт основание обвинения.'
  naturalness: Предлагаемая редакция остаётся современной литературной и естественно звучит в повествовательном контексте. «Считая, что их подкупили ради замысла побега» сохраняет обвинительный, предположительный характер формулировки.
  terminology: «Подкупили», «замысел побега» и «уверился» точны по смыслу и стилистически нейтральны. «Замысел побега» не назначает прямо, кто именно должен был совершить побег или кого подкупили, сохраняя синтаксическую неопределённость оригинала.
