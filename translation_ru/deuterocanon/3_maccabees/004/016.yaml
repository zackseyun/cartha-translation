revisions:
- from: Царь же, постоянно преисполненный великой радости, устраивал пиршества перед всеми идолами[b] и, с умом, далёким от истины, и осквернёнными устами, восхвалял глухих, неспособных ни говорить с ними, ни помогать им, а против Бога[a] говорил то, чего говорить не подобает.
  to: Царь же, постоянно преисполненный великой радости, устраивал пиршества перед всеми идолами[b] и, с умом, далёким от истины, и нечестивыми устами, восхвалял глухих идолов, неспособных ни говорить с ними, ни помогать им, а против Бога[a] говорил то, чего говорить не подобает.
