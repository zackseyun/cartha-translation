    issue: «осквернёнными устами»
    rationale: βεβήλῳ означает «профанный, нечестивый, не священный», а не «осквернённый» в пассивном смысле. «Нечестивыми устами» точнее передаёт характеристику речи и её носителя.
  - severity: low
    issue: Субстантивированное «глухих» без обозначения референта
    rationale: Греческий нейтральный субстантивированный эпитет допустим без существительного, но русское «восхвалял глухих» обычно воспринимается как обозначение людей. «Глухих идолов» естественно и лишь эксплицирует уже названный референт.
