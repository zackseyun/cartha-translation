base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/016.yaml
  text: And the king[a], greatly and continually filled with joy, was arranging banquets before all the idols, with a mind far removed from the truth and with a profane mouth, praising deaf things that were unable to speak or help them[b], but speaking improper things against God.
translation:
  language: ru
  text: Царь же, постоянно преисполненный великой радости, устраивал пиршества перед всеми идолами[b] и, с умом, далёким от истины, и нечестивыми устами, восхвалял глухих идолов, неспособных ни говорить с ними, ни помогать им, а против Бога[a] говорил то, чего говорить не подобает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Бога» в греческом издании заключены в квадратные скобки, что указывает на текстологическую неуверенность; по смыслу речь царя направлена против Бога.
    reason: textual_variant
  - marker: b
    text: 'Или: «устраивал пиршества в честь всех идолов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεγάλως δὲ καὶ διηνεκῶς ... χαρᾷ πεπληρωμένος
  choice: постоянно преисполненный великой радости
  rationale: Передаёт как высокую степень радости, так и её продолжительность; «преисполненный» сохраняет возвышенный повествовательный тон.
- source_word: συμπόσια
  choice: пиршества
  rationale: Слово обозначает праздничные совместные трапезы, нередко с возлияниями; «пиршества» естественно для царского и культового контекста.
- source_word: ἐπὶ πάντων τῶν εἰδώλων
  choice: перед всеми идолами
  rationale: Сохраняет пространственно-культовый оттенок ἐπί с родительным и не вводит более определённое толкование «в честь» непосредственно в текст.
- source_word: πεπληρωμένῃ πόρρω τῆς ἀληθείας φρενί
  choice: с умом, далёким от истины
  rationale: Естественно передаёт внутреннее состояние царя и образ удалённости от истины, не воспроизводя неясную для русского буквальную конструкцию с πεπληρωμένῃ.
- source_word: βεβήλῳ στόματι
  choice: осквернёнными устами
  rationale: Передаёт религиозную нечистоту и нечестивость βέβηλος; множественное «устами» соответствует современному возвышенному русскому употреблению.
- source_word: κωφὰ
  choice: глухих
  rationale: Сохраняет буквальный образ и риторическое презрение греческого субстантивированного прилагательного, не добавляя в основной текст существительного «идолов» или «истуканов».
- source_word: μὴ δυνάμενα αὐτοῖς λαλεῖν ἢ ἀρήγειν
  choice: неспособных ни говорить с ними, ни помогать им
  rationale: Ясно выражает бессилие восхваляемых идолов; местоимение «им» сохраняет подразумеваемую отсылку к их почитателям.
- source_word: εἰς δὲ [τὸν θεὸν]
  choice: а против Бога
  rationale: В контексте противопоставления восхвалению идолов εἰς при глаголе речи имеет враждебную направленность; скобки издания отражены примечанием о варианте текста.
- source_word: τὶ μὴ καθήκοντα
  choice: то, чего говорить не подобает
  rationale: Естественно передаёт смысл непристойной и неуместной речи, сохраняя нравственно-религиозную оценку без уточнения её содержания.
theological_decisions:
- issue: Направленность неподобающей речи царя по отношению к Богу
  choice: а против Бога говорил то, чего говорить не подобает
  alternative: а о Боге говорил неподобающие вещи
  rationale: Враждебное «против» лучше сохраняет контраст между хвалой бессильным идолам и речью, направленной против Бога, однако содержание богохульной речи не конкретизируется.
- issue: Описание бессилия идолов
  choice: глухих, неспособных ни говорить с ними, ни помогать им
  alternative: глухих идолов, неспособных говорить им или помогать
  rationale: Субстантивированное «глухих» сохраняет резкую греческую риторику и не добавляет повторного наименования; местоименная неоднозначность референта αὐτοῖς не устраняется поясняющей вставкой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Длинная греческая цепь причастий преобразована в конечный глагол и однородные сказуемые ради ясности; образы радости, удалённости от истины, осквернённых уст и глухоты идолов сохранены.
