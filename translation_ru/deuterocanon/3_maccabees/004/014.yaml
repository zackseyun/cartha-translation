  register: Современный литературный русский язык с достоинством повествовательного регистра. «Трудовая повинность» передаёт принудительный характер службы без архаизации; длинная греческая конструкция разбита тире и противопоставлением «не... но», при этом её смысловая напряжённость сохранена.
