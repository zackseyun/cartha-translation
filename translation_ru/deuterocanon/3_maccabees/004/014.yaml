  text: and that the whole nation should be registered by name[a], not for the previously indicated brief service according to their work, but, by being tortured with the ordered cruelties[b], to be utterly destroyed in the course of a single day.
translation:
  language: ru
  text: и чтобы весь народ был внесён в списки поимённо[a] — не для ранее объявленной кратковременной трудовой службы, соответствующей их занятиям[b], а чтобы, подвергнув предписанным мучениям, полностью истребить его в течение одного дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «имя за именем»; речь идёт об индивидуальной регистрации каждого человека.'
    reason: lexical_alternative
  - marker: b
    text: Греческая фраза о ранее объявленной трудовой службе синтаксически трудна. Вероятно, имеется в виду кратковременная служба, соответствующая занятиям людей; в контексте она противопоставлена действительному замыслу их уничтожения.
    reason: textual_or_syntactic_note
lexical_decisions:
- source_word: ἀπογραφῆναι
  choice: был внесён в списки
  rationale: Глагол обозначает официальную перепись или регистрацию; выражение естественно для административного контекста.
- source_word: πᾶν τὸ φῦλον
  choice: весь народ
  rationale: В контексте имеется в виду весь еврейский народ как единая общность, а не отдельное колено.
- source_word: ἐξ ὀνόματος
  choice: поимённо
  rationale: Передаёт индивидуальный характер регистрации и распределительное значение выражения.
- source_word: οὐκ εἰς τὴν ἔμπροσθεν βραχεῖ προδεδηλωμένην τῶν ἔργων κατὰ τρόπον λατρείαν
  choice: не для прежде объявленной кратковременной трудовой повинности, якобы соответствующей роду их работ
  rationale: Трудное греческое выражение, вероятно, противопоставляет ранее объявленную краткую трудовую службу действительному намерению истребления. «Якобы» ясно отмечает её роль как предлога, не скрывая синтаксической трудности.
- source_word: στρεβλούμεντας
  choice: подвергнув их ... истязаниям
  rationale: Глагол означает мучить, в том числе пытать на дыбе; общее «истязания» не вводит не названное прямо орудие.
- source_word: παρηγγελμέναις αἰκίαις
  choice: предписанным истязаниям
  rationale: Сохраняет как официальный, приказной характер насилия, так и его жестокость.
- source_word: τὸ τέλος ἀφανίσαι
  choice: полностью истребить
  rationale: ἀφανίσαι означает уничтожить или заставить исчезнуть, а τὸ τέλος подчёркивает доведение уничтожения до конца.
- source_word: μιᾶς ὑπὸ καιρὸν ἡμέρας
  choice: за один день
  rationale: Естественно передаёт предельно сжатый срок уничтожения; более буквальная временная конструкция по-русски была бы тяжеловесной.
