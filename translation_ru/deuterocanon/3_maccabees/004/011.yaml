    issue: Пассивный залог στελλομένοις не отражён.
    rationale: '«Кто отправлялся» представляет людей действующими по собственной инициативе, тогда как греческое στελλομένοις — пассивное причастие: «тех, кого отправляли/посылали».'
  - severity: low
    issue: Сноска b прикреплена к описанию путешествующих, а поясняет заключительную фразу о войсках и ограждённом пространстве.
    rationale: Якорь следует перенести к «ограждённого пространства», чтобы связь сноски с трудным греческим выражением τὸ σύνολον καταξιῶσαι περιβόλῳ была прозрачной.
  - severity: low
    issue: «Соприкасаться с его войсками» сужает κοινωνεῖν до физического контакта.
    rationale: Глагол означает иметь общение, связь или участие; «общаться с его войсками» сохраняет более широкий смысл.
