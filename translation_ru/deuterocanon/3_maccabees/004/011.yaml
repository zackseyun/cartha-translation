revisions:
- from: 'Когда их доставили к месту, называемому Схедия, и плавание завершилось, как было постановлено царём, он велел разместить их в ипподроме перед городом[a]. Это было открытое место, особенно удобное для того, чтобы выставить их на всеобщее посрамление: оно находилось на виду у всех, кто спускался в город, и у тех, кто отправлялся оттуда в страну, покидая город[b]. Так они не могли ни соприкасаться с его войсками, ни вообще удостоиться ограждённого места.'
  to: Когда их доставили к месту, называемому Схедия, и плавание завершилось, как было постановлено царём, он велел разместить их в ипподроме перед городом — на открытом месте, особенно удобном для того, чтобы выставить их на всеобщее посрамление. Оно находилось на виду у всех, кто спускался в город, и у тех, кого отправляли оттуда в страну. Так они не могли ни общаться с его войсками, ни вообще быть признанными достойными ограждённого пространства[b].
  rationale: Исправлен залог при στελλομένοις, устранена стилистическая избыточность, расширенный смысл κοινωνεῖν передан без неоправданного ограничения физическим контактом, а якорь сноски b перенесён к поясняемой заключительной фразе. Сноска a сохранена по набору сносок, но в исправленном тексте должен иметься её якорь после слова «ипподроме».
