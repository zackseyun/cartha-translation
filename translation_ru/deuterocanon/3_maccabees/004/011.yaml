review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: сохранены прибытие в Схедию, исполнение царского постановления, размещение перед городом, публичная обозримость и двойная цель изоляции. Однако пассивное στελλομένοις («тех, кого отправляли/посылали») в черновике заменено активным «кто отправлялся», а сноска b поставлена не у заключительной трудной фразы, которую она поясняет.'
  naturalness: Русский текст в целом литературный и ясный. «Отправлялся оттуда в страну, покидая город» звучит избыточно; замена на «кого отправляли оттуда в страну» одновременно естественнее и ближе к греческому залогу. «Ограждённое пространство» точнее и естественнее, чем «ограждённое место».
  terminology: «Схедия» и «ипподром» переданы удачно. «Выставить их на всеобщее посрамление» допустимо для παραδειγματισμός в данном контексте, хотя выражение сохраняет оттенок публичного показательного унижения. «Общаться с его войсками» лучше передаёт κοινωνεῖν, чем более физически окрашенное «соприкасаться».
  issues:
