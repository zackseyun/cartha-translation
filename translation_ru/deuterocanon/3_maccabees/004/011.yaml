base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/011.yaml
  text: When they had been brought down to the place called Schedia[a], and the voyage had been completed, as had been decreed by the king, he ordered them to encamp in the hippodrome before the city, an open area excellently suited for making an example of them, lying in full view of all who were traveling down into the city and of those being sent out from there into the country on a journey[b], so that they might neither associate with his forces nor, in general, be deemed worthy of an enclosure.
translation:
  language: ru
  text: Когда их доставили к месту, называемому Схедия, и плавание завершилось, как было постановлено царём, он велел разместить их в ипподроме перед городом — на открытом месте, особенно удобном для того, чтобы выставить их на всеобщее посрамление. Оно находилось на виду у всех, кто спускался в город, и у тех, кого отправляли оттуда в страну. Так они не могли ни общаться с его войсками, ни вообще быть признанными достойными ограждённого пространства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Конец стиха, вероятно, означает, что их намеренно держали вдали от царских войск и не сочли достойными даже ограждённого или защищённого места.
    reason: textual_clarity
lexical_decisions:
- source_word: Πότιον δὲ
  choice: Когда
  rationale: Неясная форма в начале стиха, вероятно, служит связкой; вместе с последующими генитивами абсолютными естественно передаётся временным союзом без попытки уточнить сомнительный оттенок.
- source_word: τὴν λεγομένην Σχεδίαν
  choice: к месту, называемому Схедия
  rationale: Сохранены и топоним посредством транслитерации, и пояснительное λεγομένην; слово «место» добавлено для ясности русского синтаксиса.
- source_word: τὸ παράπλου περαθέντος
  choice: плавание завершилось
  rationale: Передаёт путь по воде и его завершение, не уточняя без необходимости, было ли это морское или речное плавание.
- source_word: δεδογματισμένον
  choice: было постановлено
  rationale: Формальная лексика отражает уже принятое официальное решение царя.
- source_word: ἱπποδρόμῳ
  choice: ипподроме
  rationale: Исторически точный и понятный современному читателю термин для места конных состязаний.
- source_word: παρεμβαλεῖν
  choice: разместить
  rationale: В данном контексте речь идёт о принудительном расположении большой группы; «разбить лагерь» могло бы ошибочно подразумевать их собственную инициативу.
- source_word: ἁπλατῷ καθεστῶτι περιμέτρῳ
  choice: Это было открытое место
  rationale: Греческая фраза трудна и, вероятно, описывает незащищённое, открытое расположение ипподрома. Перевод передаёт практический смысл, не создавая ложной архитектурной точности.
- source_word: πρὸς παραδειγματισμὸν
  choice: выставить их на всеобщее посрамление
  rationale: Сочетает публичность, унижение и устрашающий характер показательного обращения с ними.
- source_word: καταπορευομένοις εἰς τὴν πόλιν
  choice: кто спускался в город
  rationale: Сохранено направительное значение приставки κατα-, естественно выраженное русским «спускался».
- source_word: στελλομένοις πρὸς ἐκδημίαν
  choice: отправлялся оттуда в страну, покидая город
  rationale: Передаёт отправление из города и удаление от места жительства; формулировка не переопределяет пассивную форму как обязательную официальную командировку.
- source_word: τὸ σύνολον καταξιῶσαι περιβόλῳ
  choice: ни вообще удостоиться ограждённого места
  rationale: Сохранены усилительное «вообще», оттенок признания достойными и неопределённость περιβόλῳ между оградой, огороженным участком и защищённым помещением.
