  yaml_path: translation/deuterocanon/3_maccabees/004/015.yaml
  text: So the registration of these people was carried out with bitter urgency and zealous exertion[a], from the rising of the sun to its setting[c][b], reaching no completion for forty days.
translation:
  language: ru
  text: Итак, регистрация этих людей проводилась с горькой поспешностью и честолюбивым усердием — от восхода солнца до заката[a] — и за сорок дней так и не была завершена[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от восходов солнца до закатов»; это оборот, означающий работу на протяжении всего дня.'
    reason: cultural_note
  - marker: b
    text: Греческий оборот означает, что процесс не достиг завершения даже по истечении сорока дней.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογραφὴ
  choice: перепись
  rationale: Обозначает официальное внесение людей в административный список; «перепись» естественно передаёт этот смысл в данном контексте, не обязательно подразумевая обычную общенародную перепись.
- source_word: πικρᾶς σπουδῆς
  choice: с жестокой поспешностью
  rationale: σπουδή сочетает значения спешки и напряжённого рвения, а πικρός придаёт действию суровый, тягостный характер. Такое сочетание естественно звучит по-русски в контексте принудительной процедуры.
- source_word: φιλοτίμου προσθεσίας
  choice: ревностным усердием
  rationale: Редкое сочетание указывает на старательно прилагаемые, энергичные усилия; перевод сохраняет интенсивность, не навязывая сомнительной оценки личных мотивов исполнителей.
- source_word: ἀπὸ ἀνατολῶν ἡλίου μέχρι δυσμῶν
  choice: от восхода солнца до заката
  rationale: Это временной оборот, означающий работу на протяжении всего светового дня; русский перевод сохраняет образ и звучит естественно.
- source_word: ἀνήνυτον λαμβάνουσα τὸ τέλος
  choice: так и не была завершена
  rationale: Греческий оборот сообщает, что процесс не достиг завершения; русская формулировка ясно и идиоматично передаёт результат.
- source_word: ἐπὶ ἡμέρας τεσσεράκοντα
  choice: и за сорок дней
  rationale: В связи с незавершённостью оборот естественно означает, что даже по истечении сорока дней работа не была окончена.
