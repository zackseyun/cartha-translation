    rationale: «Жестокий» в русском обычно описывает намеренную беспощадность; πικρός может означать горький, мучительный, тягостный. В контексте угнетения жестокость возможна, но не выражена данным словом как обязательный смысл.
  - severity: medium
    issue: «Ревностным усердием» не передаёт φιλοτίμου.
    rationale: Сочетание сглаживает компонент честолюбия/стремления отличиться и семантически тавтологично. Более точное «честолюбивое усердие» сохраняет этот оттенок без догматической или психологической детализации.
