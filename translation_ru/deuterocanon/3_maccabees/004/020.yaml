lexical_decisions:
- source_word: λεγόντων
  choice: утверждали
  rationale: Причастие родительного падежа продолжает повествовательное сообщение; «утверждали» естественно передаёт официально заявленное и подтверждённое обстоятельство.
- source_word: μετὰ ἀποδείξεως
  choice: предъявив доказательства
  rationale: ἀπόδειξις означает доказательство или подтверждение; деепричастный оборот естественно выражает сопутствующее обоснование заявления.
- source_word: τὴν χαρτηρίαν
  choice: папирус
  rationale: Речь идёт о папирусном материале для письма; исторически точное «папирус» предпочтительнее современного «бумага».
- source_word: τοὺς γραφικοὺς καλάμους
  choice: тростниковые перья
  rationale: Буквально — «писчие тростники»; «тростниковые перья» понятно современному читателю и точно обозначает орудия письма.
- source_word: ἐν οἷς ἐχρῶντο
  choice: которыми они пользовались
  rationale: Имперфект выражает продолжавшееся в прошлом пользование; относительная конструкция сохраняет связь с писчими принадлежностями.
- source_word: ἐκλελοιπέναι
  choice: у них уже закончились
  rationale: Перфектный инфинитив ἐκλείπω здесь указывает на уже наступившее исчерпание запасов; русская конструкция звучит естественно и сохраняет результативность.
