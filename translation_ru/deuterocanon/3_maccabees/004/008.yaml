base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/008.yaml
  text: And their relatives[a], with nooses wrapped around their necks instead of garlands, though in the full bloom of youth, spent the remaining days of their weddings in mourning instead of feasting and youthful ease, already seeing Hades lying at their feet.
translation:
  language: ru
  text: А их родные, с петлями, обвитыми вокруг шей вместо венков, в самом расцвете юности проводили оставшиеся дни свадебных празднеств не в пирах и юношеской беззаботности, а в плаче, уже видя у своих ног лежащий Аид[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смерть», «могилу» либо «мир мёртвых». В греческом тексте стоит ᾅδης («Аид»), сохраняющий образ подземного мира или царства мёртвых и не обозначающий сам по себе окончательное наказание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγενεῖς
  choice: родные
  rationale: Слово обозначает людей, связанных родством; «родные» естественно для современного русского языка и не ограничивает круг родственников мужчинами.
- source_word: βρόχους
  choice: петлями
  rationale: βρόχος обозначает петлю, в том числе затягивающуюся; перевод сохраняет мрачный образ и его контраст со свадебными венками.
- source_word: ὡς ἀντὶ στεφέων
  choice: вместо венков
  rationale: Оборот выражает резкую замену праздничного свадебного украшения орудием гибели; по-русски это естественно передаётся прямо, без утяжеляющего «словно».
- source_word: τοὺς αὐχένας περιπεπλεγμένοι
  choice: обвив шеи
  rationale: Причастная конструкция описывает петли, обвитые вокруг шей; активная деепричастная форма делает длинное русское предложение яснее, не меняя образа.
- source_word: μετὰ ἀκμαίας νεανικῆς ἡλικίας
  choice: в самом расцвете юности
  rationale: Передаёт молодость в её полной силе и подчёркивает трагический контраст с близостью смерти.
- source_word: εὐωχίας
  choice: пирах
  rationale: В свадебном контексте слово означает праздничное угощение и веселье; «пиры» кратко и выразительно сохраняет этот смысл.
- source_word: νεωτερικῆς ῥᾳθυμίας
  choice: юношеской беззаботности
  rationale: ῥᾳθυμία здесь указывает на беспечный покой и непринуждённость молодости; перевод не привносит значения нравственной распущенности.
- source_word: τὰς ἐπιλοίπους τῶν γάμων ἡμέρας
  choice: оставшиеся дни свадебных празднеств
  rationale: Множественное γάμων в контексте указывает на свадебные торжества, а не на супружество как состояние.
- source_word: ἐν θρήνοις διῆγον
  choice: проводили ... в плаче
  rationale: Русский оборот естественно передаёт значение «проводить время в оплакивании» и сохраняет конкретность множественного θρῆνοι.
- source_word: παρὰ πόδας ἤδη τὸν ἅδην ὁρῶντες κείμενον
  choice: уже видя у своих ног лежащий Аид
  rationale: Перевод сохраняет и прямое наименование Аида, и олицетворённый пространственный образ надвигающегося мира смерти.
theological_decisions:
- issue: Передача ἅδην
  choice: Аид
  alternative: смерть; могила; мир мёртвых
  rationale: В греческом тексте прямо употреблено Ἅιδης. «Аид» сохраняет образ подземного мира или царства мёртвых и не подменяет его более узким представлением об окончательном наказании.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной повествовательной интонацией. Сохранены свадебная образность, резкие противопоставления и необычный образ Аида, лежащего у ног.
