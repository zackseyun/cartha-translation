- source_word: θηρίων τρόπον
  choice: словно зверей
  rationale: Естественное русское сравнение, сохраняющее унизительное уподобление пленников животным.
- source_word: ἀγόμενοι
  choice: понуждая
  rationale: Контекст насильственного обращения и сравнение со зверями требуют значения сильнее нейтрального «ведя»; деепричастная конструкция естественно связывает действие с железными оковами.
- source_word: σιδηροδέσμοις ἀνάγκαις
  choice: понуждая железными оковами
  rationale: Сжатое греческое выражение объединяет физические железные путы и принуждение; перевод сохраняет оба компонента без искусственной буквальности.
- source_word: τοῖς ζυγοῖς τῶν πλοίων
  choice: к корабельным ярмам
  rationale: «Ярма» сохраняет буквальный образ ζυγός и связь с предшествующим уподоблением зверям; примечание поясняет возможное обозначение корабельных брусьев.
- source_word: προσηλωμένοι
  choice: прикреплены
  rationale: Глагол допускает сильное значение «пригвождены», но более широкое «прикреплены» не вводит не доказанный контекстом способ крепления.
- source_word: τοὺς τραχήλους
  choice: шеями
  rationale: Русский творительный естественно передаёт, какой частью тела пленники были прикреплены.
- source_word: ἀρρήκτοις
  choice: несокрушимыми
  rationale: Передаёт буквальную идею того, что невозможно разорвать или сломать, в dignified повествовательном регистре.
- source_word: κατησφαλισμένοι
  choice: надёжно скованы
  rationale: Передаёт усиленное значение прочного закрепления; в сочетании с кандалами естественный русский глагол — «скованы».
- source_word: πέδαις
  choice: кандалами
  rationale: πέδαι обозначает именно ножные оковы; «кандалы» — точный и понятный современному читателю русский эквивалент.
