lexical_decisions:
- source_word: δέσμιοι
  choice: как узников
  rationale: Передаёт значение связанных или находящихся под стражей людей и сохраняет обстоятельственно-предикативную функцию слова в начале греческой фразы.
- source_word: δημοσίᾳ
  choice: на глазах у всех
  rationale: В данном контексте наречие означает публичность происходящего; этот естественный русский оборот подчёркивает, что насилие совершалось открыто.
- source_word: μέχρι τῆς εἰς τὸ πλοῖον ἐμβολῆς
  choice: пока не погрузили на корабль
  rationale: Естественно передаёт помещение людей внутрь судна; более буквальный оттенок внесения или заталкивания отмечен в сноске.
- source_word: εἵλκοντο
  choice: тащили
  rationale: Форма имперфекта в пассиве изображает продолжавшееся насильственное перемещение; по-русски неопределённо-личная конструкция звучит естественно и сохраняет неназванность исполнителей.
- source_word: μετὰ βίας
  choice: силой
  rationale: Кратко и точно выражает принуждение и насильственный характер действия без усиления сверх исходного текста.
