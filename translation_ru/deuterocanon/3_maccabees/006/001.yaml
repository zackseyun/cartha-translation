  text: 'A certain Eleazar, a distinguished man among the Jews of the country, already advanced in age and adorned with every virtue in life, quieted the elders around him to call upon the holy God, and prayed as follows:'
translation:
  language: ru
  text: 'Некий Елеазар, выдающийся человек среди иудеев этой страны, уже достигший преклонного возраста и отличавшийся в своей жизни всеми добродетелями, успокоив окружавших его старейшин, воззвал к святому Богу и помолился так:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίσημος
  choice: выдающийся
  rationale: Передаёт значение заметного, почётного, известного человека без добавления официального звания.
- source_word: τῶν ἀπὸ τῆς χώρας Ἰουδαίων
  choice: среди иудеев этой страны
  rationale: Сохраняет принадлежность Елеазара к группе местных иудеев; указательное «этой» естественно отсылает к стране, известной из контекста.
- source_word: ἐν πρεσβείῳ τὴν ἡλικίαν ἤδη λελογχώς
  choice: уже достигший преклонного возраста
  rationale: Естественно передаёт греческое описание человека, которому выпала доля глубокой старости.
- source_word: πάσῃ τῇ κατὰ τὸν βίον ἀρετῇ κεκοσμημένος
  choice: отличавшийся в своей жизни всеми добродетелями
  rationale: Сохраняет похвальную характеристику, избегая неестественной для современного русского буквальной метафоры «украшенный добродетелью».
- source_word: καταστείλας
  choice: успокоил
  rationale: Передаёт значение сдержать волнение, утихомирить или привести к спокойствию.
- source_word: ἐπικαλεῖσθαι τὸν ἅγιον θεόν
  choice: чтобы они воззвали к святому Богу
  rationale: Инфинитив отнесён к ближайшему дополнению «старейшин», в согласии с синтаксически вероятным чтением и консультационным английским текстом.
- source_word: προσηύξατο τάδε
  choice: помолился так
  rationale: Краткая и естественная формула введения следующей молитвы.
theological_decisions:
- issue: Кто должен воззвать к святому Богу
  choice: 'Старейшины: «чтобы они воззвали»'
  alternative: Елеазар сам «воззвал к святому Богу и помолился»
  rationale: В греческом инфинитив ἐπικαλεῖσθαι следует за τοὺς περὶ αὐτὸν ... πρεσβυτέρους, поэтому старейшины естественно понимаются как его подразумеваемое подлежащее. Последующее личное προσηύξατο затем отдельно сообщает о молитве Елеазара.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Причастные характеристики сохранены, но громоздкость греческого периода смягчена ясной синтаксической структурой.
