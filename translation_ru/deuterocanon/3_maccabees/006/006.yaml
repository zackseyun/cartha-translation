base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/006.yaml
  text: You rescued the three companions in Babylonia[a], who had willingly given up their lives to the fire so as not to worship empty things; after cooling the blazing furnace, you delivered them all unharmed[b], and sent a flame upon all their adversaries.
translation:
  language: ru
  text: 'Ты спас трёх товарищей в Вавилонии, добровольно отдавших свои жизни огню, чтобы не поклониться пустым вещам[a]: охладив раскалённую печь, Ты сохранил их всех невредимыми[b] и наслал пламя на всех их противников.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пустым вещам»; имеются в виду ложные предметы поклонения. Возможный перевод: «идолам».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «спас их всех до волоса», то есть не допустил утраты даже одного волоса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑταίρους
  choice: товарищей
  rationale: Слово обозначает спутников или товарищей. Такой перевод сохраняет отсылку к трём юношам, не добавляя их имён и не конкретизируя их возраст сверх греческого текста.
- source_word: πυρὶ τὴν ψυχὴν αὐθαιρέτως δεδωκότας
  choice: добровольно отдавших свои жизни огню
  rationale: αὐθαιρέτως указывает на добровольность, а ψυχή в данном контексте означает жизнь, отданную на смертельную опасность; «жизни» здесь естественнее и точнее по смыслу, чем «души».
- source_word: τοῖς κενοῖς
  choice: пустому
  rationale: Субстантивированное прилагательное буквально характеризует объекты ложного поклонения как «пустые». Формулировка «поклониться пустому» сохраняет полемическую образность, не подменяя её более истолковывающим словом «идолы».
- source_word: διάπυρον ... κάμινον
  choice: раскалённую печь
  rationale: διάπυρος подчёркивает сильнейший жар; «раскалённая печь» — естественное и точное русское выражение.
- source_word: δροσίσας
  choice: охладив
  rationale: Причастие означает сделать прохладным, принести прохладу или росистое облегчение. «Охладив» ясно передаёт совершённое Богом действие.
- source_word: ἐρρύσω μέχρι τριχὸς ἁπάντων
  choice: сохранил их всех невредимыми
  rationale: Оборот буквально означает спасение «до волоса», то есть полную сохранность каждого. Идиоматический смысл дан в тексте, а буквальный образ — в сноске.
- source_word: φλόγα πᾶσιν ἐπιπέμψας τοῖς ὑπεναντίοις
  choice: и наслал пламя на всех их противников
  rationale: φλόξ передано конкретным словом «пламя», а ὑπεναντίοι — как враждебные противники; «наслал» естественно выражает направленное действие ἐπιπέμψας.
- source_word: κατὰ τὴν Βαβυλωνίαν
  choice: в Вавилонии
  rationale: Оборот указывает место события; «в Вавилонии» — прямой и естественный географический перевод.
theological_decisions:
- issue: Отсылка к рассказу о трёх юношах в печи
  choice: Сохранить косвенную отсылку через выражение «три товарища», не добавляя имён и пояснений в основной текст.
  alternative: Назвать Ананию, Азарию и Мисаила или перевести как «три юноши».
  rationale: Греческий текст предполагает знакомство читателя с рассказом, но сам называет героев «тремя товарищами»; перевод не гармонизирует формулировку с другими версиями предания.
- issue: Смысл τοῖς κενοῖς
  choice: Передать как «пустому» с буквальным пояснением в сноске.
  alternative: Перевести истолковательно как «идолам» или «тщетным идолам».
  rationale: 'Так сохраняется богословская полемика исходного выражения: ложные объекты поклонения названы пустыми, тогда как слово «идолы» прямо в тексте не употреблено.'
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным звучанием. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Синтаксис сохраняет последовательность божественных действий, оставаясь понятным при чтении вслух.
