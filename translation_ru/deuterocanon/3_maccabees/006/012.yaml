base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/012.yaml
  text: But you[a], who possess all might and dominion, unceasing One, eternal One, look now; have mercy on us[c][b], who through the insolent violence of lawless men are being irrationally removed from life in the manner of plotters.
translation:
  language: ru
  text: Но Ты, обладающий всей силой и властью, Неутомимый, Вечный, воззри ныне; помилуй нас, кого из-за надменного насилия беззаконников бессмысленно лишают жизни[b] на манер заговорщиков[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «удаляют из жизни»; в данном контексте — предают смерти.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на манер заговорщиков». Выражение может характеризовать способ действия, не уточняя, считали ли преследуемых заговорщиками.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλκήν
  choice: силой
  rationale: Передаёт крепость и могущество; в паре с «властью» сохраняет отличие от δυναστείαν.
- source_word: δυναστείαν
  choice: властью
  rationale: Обозначает господствующую, правящую власть, а не только физическую силу.
- source_word: ἀπάναυε
  choice: Неутомимый
  rationale: Вокативный божественный эпитет; естественно передаёт того, кто не прекращает действия и не утомляется.
- source_word: αἰώνιε
  choice: Вечный
  rationale: Сохраняет второй самостоятельный вокативный эпитет и торжественный строй молитвы.
- source_word: ἐπίδε
  choice: воззри ныне
  rationale: Передаёт настоятельный призыв посмотреть и обратить внимание; «воззри» уместно в возвышенной молитвенной речи.
- source_word: καθʼ ὕβριν
  choice: из-за надменного насилия
  rationale: ὕβρις включает высокомерие, надругательство и насильственное обращение; сочетание сохраняет нравственную и физическую стороны.
- source_word: ἀνόμων
  choice: беззаконников
  rationale: Субстантивированное обозначение людей, попирающих закон; родительный падеж указывает на виновников насилия.
- source_word: ἀλόγιστον
  choice: бессмысленно
  rationale: Передаёт неразумный, лишённый основания характер происходящего и звучит естественно по-русски.
- source_word: ἐκ τοῦ ζῆν μεθισταμένους
  choice: лишают жизни
  rationale: Естественно выражает буквальный образ удаления из состояния жизни; в контексте речь идёт о предстоящем умерщвлении.
- source_word: ἐν ἐπιβούλων τρόπῳ
  choice: обращаясь с нами как с заговорщиками
  rationale: Передаёт способ обращения и вероятный оттенок вменённого статуса, не утверждая, что молящиеся действительно были заговорщиками.
theological_decisions:
- issue: Два божественных вокатива ἀπάναυε и αἰώνιε
  choice: «Неутомимый, Вечный» как два самостоятельных обращения
  alternative: 'Связать ἀπάναυε с повелением: «непрестанно воззри, Вечный»'
  rationale: Формы греческого текста естественнее понимать как последовательные вокативные эпитеты; это сохраняет структуру молитвенного обращения без добавления слова «Бог».
- issue: Смысл ἐκ τοῦ ζῆν μεθισταμένους
  choice: «лишают жизни», то есть предают смерти
  alternative: «удаляют из среды живых» или «перемещают из жизни»
  rationale: Контекст указывает на угрозу казни; русский оборот естественно передаёт смысл, а сноска отмечает буквальный образ исходного текста.
- issue: Смысл ἐν ἐπιβούλων τρόπῳ
  choice: «обращаясь с нами как с заговорщиками»
  alternative: «образом заговорщиков» или «по-заговорщицки»
  rationale: Фраза неоднозначна, но в контексте вероятно описывает способ или предлог обращения с жертвами. Формулировка не приписывает им реального заговора.
translation_notes:
  register: 'Современный литературный русский с достоинством молитвенной речи. «Воззри» сохраняет возвышенный регистр, не делая весь стих архаичным. Прописные буквы в эпитетах подчёркивают прямое обращение к Богу. Порядок сносок в тексте последовательный: [a], [b], [c].'
