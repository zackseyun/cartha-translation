base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/015.yaml
  text: Let it be shown to all the nations that you are with us[a], Lord, and that you have not turned your face away from us; but just as you said, ‘Not even when they were in the land of their enemies did I disregard them,’ so accomplish it[b], Lord.
translation:
  language: ru
  text: 'Да будет явлено всем народам, что Ты с нами, Господи, и что Ты не отвернул от нас Своего лица. Но как Ты сказал: «Даже когда они находились в земле своих врагов, Я не пренебрёг ими»[a], — так и исполни это[b], Господи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эти слова перекликаются с обещанием Бога не пренебречь Своим народом даже в земле его врагов; греческий глагол можно также перевести: «не оставил без внимания» или «не проигнорировал».'
    reason: cross_reference
  - marker: b
    text: 'Или: «доведи это до конца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δειχθήτω
  choice: Да будет явлено
  rationale: Аористный пассивный императив передан как молитвенное побуждение в страдательной форме; «явлено» естественно выражает открытое обнаружение Божьего присутствия перед народами.
- source_word: πᾶσιν ἔθνεσιν
  choice: всем народам
  rationale: Передаёт широкий смысл ἔθνη без более узкого противопоставления «иудеев» и «язычников».
- source_word: μεθʼ ἡμῶν εἶ
  choice: Ты с нами
  rationale: Кратко и естественно сохраняет язык Божьего присутствия и заветную окраску выражения.
- source_word: οὐκ ἀπέστρεψας τὸ πρόσωπόν σου ἀφʼ ἡμῶν
  choice: Ты не отвернул от нас Своего лица
  rationale: Сохранён явный образ лица как выражение Божьего благоволения или отвержения, но русская конструкция остаётся современной и естественной.
- source_word: ὑπεριδον
  choice: Я не пренебрёг ими
  rationale: Передаёт смысл «не оставить без внимания, не пренебречь», не усиливая его до однозначного «не отверг».
- source_word: καθὼς εἶπας
  choice: как Ты сказал
  rationale: Сохраняет введение прямой цитаты и сопоставление Божьего прежнего слова с нынешней просьбой.
- source_word: ἐπίτελεσον
  choice: исполни это
  rationale: Императив означает доведение сказанного до осуществления; местоимение «это» естественно восполняет подразумеваемый объект в русском языке.
theological_decisions:
- issue: Передача κύριε
  choice: Господи
  alternative: Владыка
  rationale: В молитвенном обращении κύριος выступает как Божественный титул; русская звательная форма «Господи» сохраняет этот смысл и библейский регистр.
- issue: Форма цитаты о пребывании в земле врагов
  choice: Прямая речь от первого лица Бога
  alternative: Косвенная речь или пересказ
  rationale: После εἶπας греческий текст приводит слова от первого лица; прямая цитата сохраняет обращение молящегося к ранее данному Божьему слову, не уточняя его сверх текста.
- issue: Смысл ὑπεριδον в заветном высказывании
  choice: не пренебрёг ими
  alternative: не отверг их
  rationale: Выбранный вариант сохраняет лексическую неоднозначность между невниманием, пренебрежением и оставлением; «не отверг» могло бы преждевременно отождествить глагол с более узким богословским понятием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Сохранены библейский образ Божьего лица, прямая речь внутри молитвы и повтор обращения «Господи». Прописные формы местоимений, относящихся к Богу, поддерживают традиционный русский религиозный регистр, не добавляя толкования.
