base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/032.yaml
  text: And when they had ended their utterly mournful song of lamentation[a], they took up the song of their fathers, praising God, the savior of Israel and worker of wonders; and having cast off every cry of grief and wailing[b], they formed dances as a sign of peaceful rejoicing.
translation:
  language: ru
  text: Закончив исполненную скорби песнь плача, они запели песнь отцов[a], восхваляя Бога — Спасителя Израиля и Творца чудес. Отбросив всякие вопли скорби и стенания, они устраивали танцы[b] в знак мирной радости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родовую песнь», «песнь предков». Греческое слово означает принадлежащее отцам или унаследованной от них традиции.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «составляли (устраивали) хоры». Греческое слово может обозначать как танцевальные группы, так и хоры; контекст праздничной радости благоприятствует значению танца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλήξαντες
  choice: закончив
  rationale: Аористное причастие обозначает действие, предшествующее ἀνέλαβον; деепричастие естественно передаёт эту последовательность.
- source_word: θρήνων πανόδυρτον μέλος
  choice: исполненную скорби песнь плача
  rationale: «Песнь» сохраняет музыкальный образ μέλος, «плача» передаёт θρήνων, а «исполненную скорби» — усилительное πανόδυρτον без неестественной русской кальки.
- source_word: ἀνέλαβον
  choice: запели
  rationale: В сочетании с ᾠδή глагол означает, что они подхватили или начали песнь; «запели» звучит естественно и сохраняет начало нового действия.
- source_word: ᾠδὴν πάτριον
  choice: песнь отцов
  rationale: πάτριος указывает на принадлежность предкам и унаследованной традиции; буквальный образ сохранён, а возможное значение пояснено в сноске.
- source_word: σωτῆρα
  choice: Спасителя
  rationale: Прямое и традиционно понятное соответствие σωτήρ в славословном контексте.
- source_word: τερατοποιὸν
  choice: Творящего чудеса
  rationale: Передаёт Бога как совершающего чудеса и по-русски звучит естественнее, чем тяжеловесное существительное «чудотворец» в данной конструкции.
- source_word: οἰμωγὴν ... καὶ κωκυτὸν
  choice: скорбные вопли и стенания
  rationale: Сохраняются два обозначения слышимых проявлений горя и их эмоциональная сила.
- source_word: ἀπωσάμενοι
  choice: отбросив
  rationale: Передаёт решительное устранение и оставление прежнего плача.
- source_word: χοροὺς συνίσταντο
  choice: стали водить хороводы
  rationale: В праздничном контексте χορός вероятнее обозначает организованный танец; русское выражение естественно передаёт совместное упорядоченное движение, при сохранении альтернативы в сноске.
- source_word: εὐφροσύνης εἰρηνικῆς σημεῖον
  choice: в знак мирной радости
  rationale: Кратко и полно передаёт σημεῖον, εὐφροσύνη и определение εἰρηνικός.
theological_decisions:
- issue: К кому относятся титулы «Спаситель Израиля» и «Творящий чудеса»
  choice: Оба титула отнесены непосредственно к Богу.
  alternative: Развернуть их в отдельное вероучительное утверждение о способе Божьего спасения.
  rationale: Греческая аппозиция прямо называет Бога Спасителем Израиля и Совершающим чудеса; дополнительных богословских уточнений текст не даёт.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным повествовательно-славословным звучанием. Синтаксис разделён на два предложения ради ясности; контраст плача и мирной радости сохранён.
