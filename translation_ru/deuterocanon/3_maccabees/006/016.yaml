    reason: lexical_alternative
lexical_decisions:
- source_word: λήγοντος ἄρτι
  choice: едва ... заканчивал
  rationale: Генитив абсолютный с ἄρτι указывает, что следующее событие происходит в тот самый момент, когда молитва подходит к концу; формулировка сохраняет одновременность и непосредственность.
- source_word: προσευχῆς
  choice: молитву
  rationale: Обычный и контекстуально точный русский эквивалент προσευχή.
- source_word: παρῆγεν
  choice: двинулся
  rationale: Передаёт движение царя с сопровождающими его зверями и войском; в сочетании с «вдоль ипподрома» естественно выражает процесс продвижения.
- source_word: κατὰ τὸν ἱππόδρομον
  choice: вдоль ипподрома
  rationale: Κατά с винительным здесь имеет пространственное значение движения по линии или вдоль ипподрома; русский оборот сохраняет локальную неопределённость, не утверждая явно ни движение внутри, ни снаружи.
- source_word: θηρίοις
  choice: зверями
  rationale: Слово обозначает опасных животных, предназначенных для расправы; «звери» сохраняет зловещий оттенок без лишнего уточнения.
- source_word: παντὶ τῷ τῆς δυνάμεως φρύαγματι
  choice: всем грозным гулом своего войска
  rationale: Φρύαγμα сочетает представления о шумном, яростном и надменном буйстве, а δύναμις здесь означает военную силу. «Грозный гул» естественно передаёт шум и угрозу, не сводя образ только к хвастовству или рёву.
