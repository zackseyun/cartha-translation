  text: But just as Eleazar was finishing his prayer[a], the king came along by the hippodrome with the beasts and all the tumult of his forces.
translation:
  language: ru
  text: Когда Елеазар только заканчивал молитву, царь со зверями и всем грозным гулом своего войска проследовал вдоль ипподрома.[a]
