  text: Likewise, the king also, holding a great banquet because of these things, was continually offering exalted thanksgiving to heaven for their astonishing deliverance that had taken place.
translation:
  language: ru
  text: Также и царь, устроив по случаю этих событий пышный пир[a], непрестанно возносил небесам великую благодарность за удивительное избавление, совершившееся для них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тяжёлый пир»; здесь это выражение означает большой, богатый или пышный пир.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «удивительное спасение, совершившееся для них». В данном повествовании речь идёт о конкретном избавлении от опасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: Так же
  rationale: Передаёт сопоставление с предшествующим действием и естественно вводит параллельное действие царя.
- source_word: περὶ τούτων
  choice: по случаю этих событий
  rationale: В контексте пира оборот обозначает повод, связанный с только что описанными событиями, а не просто тему разговора.
- source_word: συμπόσιον βαρὺ
  choice: пышный пир
  rationale: Буквально βαρύς означает «тяжёлый», но здесь идиоматически указывает на размах и изобилие пира; «пышный пир» звучит естественно и достойно.
- source_word: ἀδιαλείπτως
  choice: непрестанно
  rationale: Сохраняет усиленное значение непрерывного или многократно повторяемого действия и соответствует возвышенному регистру стиха.
- source_word: εἰς οὐρανόν
  choice: небесам
  rationale: Сохраняет названный в греческом тексте адресат «небо», не заменяя его пояснительным «Богу»; русский дательный естественно выражает направленность благодарения.
- source_word: ἀνθωμολογεῖτο
  choice: возносил ... благодарность
  rationale: В контексте чудесного избавления глагол выражает благодарное признание; имперфект передан формой длительного действия.
- source_word: μεγαλομερῶς
  choice: великую
  rationale: Наречие усиливает масштаб и торжественность благодарения; словосочетание «великую благодарность» естественно для современного литературного русского.
- source_word: παραδόξῳ
  choice: удивительное
  rationale: Передаёт нечто необычайное, вызывающее изумление и превосходящее ожидания.
- source_word: γενηθείσῃ αὐτῶν σωτηρίᾳ
  choice: за совершившееся их ... избавление
  rationale: σωτηρία в данном повествовании означает конкретное спасение от угрозы, а причастие γενηθείσῃ указывает на уже состоявшееся событие.
theological_decisions:
- issue: Значение σωτηρία в повествовании о конкретном спасении от опасности
  choice: избавление
  alternative: спасение
  rationale: «Избавление» яснее указывает на непосредственное историческое спасение героев, не устраняя более широкого богословского оттенка слова.
- issue: Передача εἰς οὐρανόν
  choice: небесам
  alternative: Богу / к небу
  rationale: Греческий текст прямо называет небо, вероятно метонимически подразумевая Бога; перевод сохраняет эту сдержанность и не делает подразумеваемое явным.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной, повествовательно-библейской интонацией. Синтаксис сохраняет последовательность греческой фразы, но избегает буквальных и неестественных русских оборотов.
