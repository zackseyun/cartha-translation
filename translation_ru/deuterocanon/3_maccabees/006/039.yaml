  text: In these things also[a], after gloriously revealing his mercy[c][b], the Sovereign of all rescued them all together without stumbling.
translation:
  language: ru
  text: И в этих обстоятельствах Владыка всего, славно явив Свою милость, избавил их разом, не дав им преткнуться.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавил их разом невредимыми». Буквально: «непреткнувшимися», «не павшими».'
