  rationale: Уточнено значение относительной конструкции ἐν αἷς καὶ и устранено менее точное пространственное «среди». Перестроен порядок слов, чтобы «не дав им преткнуться» яснее относилось к действию избавления. Сноски сохранены у соответствующих слов и поясняют контекстуальную альтернативу «невредимыми» и возможный смысл «единодушно».
