base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/005.yaml
  text: You shattered Sennacherib[a], the mighty king of the Assyrians, who had become arrogant because of his innumerable forces, who had already brought the whole land under his hand by the spear, and who had exalted himself against your holy city, speaking grievous things with boasting and insolence—you, Master[c][b], making your power plain to many nations.
translation:
  language: ru
  text: Ты, Владыка[c], сокрушил Сеннахирима, грозного[a] царя ассирийцев, возгордившегося своими неисчислимыми войсками, уже взявшего копьём всю землю под свою власть[b] и вознёсшегося против Твоего святого города, говорившего тяжкие слова с хвастовством и дерзостью, — и явил многим народам Своё могущество.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сурового», «страшного» либо «угнетавшего других» царя ассирийцев; греческое слово может обозначать нечто тяжкое, грозное или гнетущее.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «уже взявшего копьём всю землю под свою руку».'
    reason: lexical_alternative
  - marker: c
    text: Здесь употреблено обращение «Владыка» (греч. despotēs), а не более обычное «Господь» (kyrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναριθμήτοις δυνάμεσιν
  choice: неисчислимыми войсками
  rationale: В военном контексте δυνάμεις обозначает вооружённые силы, а ἀναρίθμητος — то, что невозможно сосчитать. Формулировка сохраняет возвышенный стиль молитвы.
- source_word: γαυρωθέντα
  choice: возгордившегося
  rationale: Причастие выражает надменность, возникшую вследствие уверенности в огромном войске.
- source_word: βαρὺν
  choice: грозного
  rationale: По отношению к враждебному царю слово передаёт представление о тяжком, страшном или суровом правителе. «Грозного» естественно по-русски и не сводит значение только к политическому угнетению.
- source_word: δόρατι τὴν πᾶσαν ὑποχείριον ἤδη λαβόντα γῆν
  choice: уже взявшего копьём всю землю под свою власть
  rationale: Сохранён конкретный военный образ копья; идиома ὑποχείριον передана естественным русским выражением «под свою власть», а буквальный образ отмечен в сноске.
- source_word: μετεωρισθέντα ἐπὶ τὴν ἁγίαν σου πόλιν
  choice: вознёсшегося против Твоего святого города
  rationale: Переданы одновременно горделивое самовозвышение и враждебная направленность против святого города.
- source_word: βαρέα λαλοῦντα
  choice: говорившего тяжкие слова
  rationale: Формулировка сохраняет буквальную весомость и неопределённость содержания речей, не превращая их без прямого основания только в угрозы или хулу.
- source_word: κόμπῳ καὶ θράσει
  choice: с хвастовством и дерзостью
  rationale: Пара слов описывает самонадеянную, вызывающую речь Сеннахирима; русская формулировка ясна и стилистически уместна.
- source_word: ἔθραυσας
  choice: сокрушил
  rationale: Сильный глагол обозначает решительное ниспровержение и естественно звучит в возвышенной русской молитвенной речи.
- source_word: ἔκδηλον δεικνὺς τὸ σὸν κράτος
  choice: явив многим народам Своё могущество
  rationale: Причастная конструкция сохранена. «Явив» передаёт публичное и очевидное обнаружение силы, а «могущество» — проявленную мощь κράτος.
theological_decisions:
- issue: Божественное обращение δέσποτα
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: «Владыка» сохраняет отличие δέσποτα от более обычного κύριος, подходит возвышенной молитвенной речи и остаётся понятным современному читателю.
- issue: Историческая отсылка к нападению Сеннахирима на святой город
  choice: Передать только прямо выраженные в стихе сведения
  alternative: Уточнить, что речь идёт об Иерусалиме и добавить обстоятельства его избавления
  rationale: Греческий текст предполагает известный читателю рассказ, но не называет город и не пересказывает событие; добавление деталей устранило бы сдержанность оригинала.
- issue: Связь заключительного причастия с основным глаголом
  choice: «явив многим народам Своё могущество»
  alternative: «и тем явил многим народам Своё могущество»
  rationale: Причастная форма ближе воспроизводит греческое δεικνύς и оставляет открытым оттенок сопутствующего действия, результата или цели.
translation_notes:
  register: Современный литературный русский язык с dignified молитвенным звучанием. Синтаксическая протяжённость оригинала и повтор emphatic σὺ перед «Владыка» сохранены без архаических форм; местоимения в обращении к Богу написаны с прописной буквы согласно принятой русской издательской традиции.
