lexical_decisions:
- source_word: βυθοτρεφοῦς … κήτους
  choice: вскормленного морской пучиной чудовища
  rationale: Сложное βυθοτρεφής сочетает образы глубины и питания; κῆτος обозначает крупное морское существо или чудовище, но не обязательно кита. Формулировка сохраняет образность греческого текста.
- source_word: ἐν γαστρὶ
  choice: во чреве
  rationale: γαστήρ здесь означает живот, утробу, чрево. «Во чреве» естественно для возвышенной молитвенной речи и не уточняет анатомию сверх греческого текста.
- source_word: τηκόμενον
  choice: изнемогавшего
  rationale: Причастие от τήκω передаёт истощение, угасание или мучительное томление. «Изнемогавшего» звучит естественно и сохраняет состояние продолжающегося страдания.
- source_word: ἀφθόνῳ
  choice: по безмерной щедрости
  rationale: Форма дательного падежа от ἄφθονος имеет смысл неоскудности, изобилия или щедрости; существительное в тексте не выражено. Русская формулировка передаёт обстоятельственный смысл, а грамматическая сжатость и неоднозначность отмечены в сноске.
- source_word: ἀσήμαντον
  choice: невредимым
  rationale: Буквально слово означает «не отмеченный знаком, без отметины» и в данном контексте указывает на отсутствие повреждения.
- source_word: πᾶσιν οἰκείοις
  choice: всем его близким
  rationale: οἰκεῖοι может обозначать своих людей, домашних, родных или близких. «Близким» сохраняет широту выражения, не ограничивая его только кровной семьёй.
- source_word: ἀναδείξας
  choice: Ты … явил
  rationale: ἀναδείκνυμι означает показать, явить, обнаружить. «Явил» передаёт и избавление Ионы, и то, что он был показан близким невредимым.
- source_word: πάτερ
  choice: Отче
  rationale: Звательная форма обращения к Богу передана традиционным, но понятным русским молитвенным обращением.
theological_decisions:
- issue: Обозначение существа из повествования об Ионе
  choice: чудовище
  alternative: огромная рыба; морское чудовище; кит
  rationale: κῆτος шире слова «кит» и не требует гармонизации с привычными переводами книги Ионы. Соседнее βυθοτρεφής уже ясно указывает на морскую стихию.
- issue: Связь ἀφθόνῳ с остальной фразой
  choice: по безмерной щедрости
  alternative: щедро; в изобилии; открыто перед всеми
  rationale: Греческое прилагательное стоит в дательном падеже без явно выраженного существительного, поэтому синтаксическая связь сжата и допускает разные способы передачи. Выбранный вариант сохраняет основной лексический смысл неоскудности и не превращает его без достаточного основания в «открыто».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. «Чрево» и «Отче» поддерживают достоинство обращения, оставаясь понятными современному читателю; архаическая перегруженность избегается.
