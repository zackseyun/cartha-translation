base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/009.yaml
  text: And now[a], hater of insolence, abundant in mercy, judge of all, quickly appear to the holy ones of Israel’s race, who are being mistreated by the abominable[c][b], lawless nations.
translation:
  language: ru
  text: И ныне, ненавидящий бесчинство, многомилостивый, Судья всего, скорее явись[a] святым из рода Израиля, подвергающимся надругательствам[b] со стороны отвратительных беззаконных народов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покажись» — то есть зримо обнаружь Своё присутствие и вмешайся.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое слово может означать дерзкое оскорбление, унижение или насильственное обращение; возможно также: «терпящим жестокие унижения».'
    reason: lexical_alternative
  - marker: c
    text: 'Здесь «народы» означает народы, не принадлежащие к Израилю; по контексту возможно: «язычники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισόβρι
  choice: ненавидящий бесчинство
  rationale: Редкое звательное сложное слово обозначает того, кто ненавидит ὕβρις — дерзкое, надменное и насильственное бесчинство. «Бесчинство» сохраняет как нравственный, так и оскорбительно-насильственный оттенок, не сводя слово лишь к гордости.
- source_word: πολυέλεε
  choice: многомилостивый
  rationale: Сложное прилагательное выражает изобилие милости. «Многомилостивый» кратко, понятно и уместно для возвышенного молитвенного обращения.
- source_word: τῶν ὅλων δίκαστα
  choice: Судья всего
  rationale: Передаёт универсальный охват греческого τῶν ὅλων без добавления отсутствующего в тексте уточнения «сущего» или «вселенной».
- source_word: τάχος
  choice: скорее
  rationale: Наречное употребление выражает настоятельную просьбу о незамедлительном вмешательстве; в сочетании «скорее явись» звучит естественно по-русски.
- source_word: ἐπιφάνηθι
  choice: явись
  rationale: Аористный императив в молитвенном контексте просит Бога зримо обнаружить Своё присутствие в спасительном действии. «Явись» сохраняет прямоту и не конкретизирует способ вмешательства.
- source_word: τοῖς ἁγίοις
  choice: святым
  rationale: Субстантивированное прилагательное обозначает посвящённых Богу людей. Перевод сохраняет лексическое значение, не добавляя местоимения «Твоим», которого нет в греческом.
- source_word: Ἰσραὴλ γένους
  choice: из рода Израиля
  rationale: γένος указывает на происхождение, род и народную общность. Русское выражение сохраняет этногенеалогический оттенок и при этом звучит естественнее буквального «рода Израилева».
- source_word: ὑβριζομένοις
  choice: подвергающимся надругательствам
  rationale: Глагол означает дерзкое, унизительное обращение, оскорбление или насилие. «Надругательства» передают более сильный смысл, чем общее «дурное обращение», сохраняя некоторую широту.
- source_word: ὑπὸ ἐβδελυγμένων ἀνόμων ἐθνῶν
  choice: со стороны отвратительных беззаконных народов
  rationale: ἐβδελυγμένων выражает отвращение и омерзительность, ἀνόμων — беззаконность, а ἐθνῶν здесь обозначает не израильские народы. «Народы» сохраняет прямое значение и не заменяет его контекстуально возможным «язычники».
theological_decisions:
- issue: Кого обозначает τοῖς ἁγίοις
  choice: святым
  alternative: святому народу / Твоим святым
  rationale: В контексте речь идёт о посвящённых Богу людях из рода Израиля. Формулировка не переносит выражение на позднейшую категорию канонизированных святых и не добавляет отсутствующего в оригинале «Твоим».
- issue: Этническая сила γένος
  choice: из рода Израиля
  alternative: из народа Израиля
  rationale: «Род» сохраняет указание на происхождение и родственную общность, не сводя обозначение только к религиозной принадлежности.
- issue: Значение ἔθνη в контексте
  choice: народы
  alternative: язычники
  rationale: Контекст противопоставляет эти народы Израилю, поэтому «язычники» возможно, однако нейтральное «народы» точнее сохраняет лексическую форму и не усиливает конфессиональную интерпретацию.
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным строем. Обращения переданы без архаических звательных форм; «многомилостивый» сохранено как понятное и традиционно уместное богословское слово. Синтаксис следует последовательности греческого текста, но причастный оборот оформлен естественно для русского языка.
