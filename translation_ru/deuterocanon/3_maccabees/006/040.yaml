lexical_decisions:
- source_word: Εὐωχοῦντο
  choice: пировали
  rationale: Глагол обозначает участие в пиршестве или праздничной трапезе; «пировали» сохраняет конкретный и торжественный оттенок.
- source_word: πάνθʼ ὑπὸ τοῦ βασιλέως χορηγούμενοι
  choice: получая всё необходимое от царя
  rationale: Форма πάνθʼ естественнее всего понимается как элизированное πάντα, то есть «всё», а причастие χορηγούμενοι указывает на обеспечение средствами или припасами. Добавление «необходимое» делает русскую фразу естественной, не уточняя сверх текста, что именно предоставлялось.
- source_word: μέχρι τῆς τεσσαρεσκαιδεκάτης
  choice: до четырнадцатого дня
  rationale: Порядковое числительное женского рода подразумевает слово «день» по контексту; в русском его необходимо выразить явно.
- source_word: ἐν ᾗ
  choice: в этот день
  rationale: Относительное выражение отсылает к четырнадцатому дню; такой перевод ясно и естественно передаёт временную связь.
- source_word: τὴν ἐντυχίαν ἐποιήσαντο
  choice: подали прошение
  rationale: ἐντυχία может обозначать официальное обращение, просьбу или ходатайство к вышестоящему лицу. «Подали прошение» сохраняет формальный характер действия.
- source_word: περὶ τῆς ἀπολύσεως αὐτῶν
  choice: о своём освобождении
  rationale: ἀπόλυσις здесь означает освобождение или отпуск; возвратное местоимение естественно показывает, что речь идёт об освобождении самих просителей.
