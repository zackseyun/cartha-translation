lexical_decisions:
- source_word: λύσατε, ἐκλύσατε
  choice: Освободите, снимите
  rationale: Два повелительных глагола передают настойчивость и усиление греческого повторения; «снимите» естественно сочетается с последующим «оковы», не устраняя смысл освобождения.
- source_word: ἄδικα δεσμά
  choice: несправедливые оковы
  rationale: ἄδικα характеризует удерживающие узы как неправомерные, а «оковы» сохраняют как буквальный, так и переносный оттенок δεσμά.
- source_word: εἰς τὰ ἴδια
  choice: к себе
  rationale: Выражение может обозначать возвращение к своему дому, своим близким или в свои места; «к себе» естественно сохраняет эту широту.
- source_word: μετʼ εἰρήνης
  choice: с миром
  rationale: Устойчивое русское выражение, точно передающее мирное и благополучное отпущение.
- source_word: ἐξαποστείλατε
  choice: отпустите их
  rationale: В контексте освобождения задержанных глагол означает отослать или отпустить; местоимение делает подразумеваемое дополнение ясным по-русски.
- source_word: τὰ προστεταγμένα
  choice: отданные распоряжения
  rationale: Субстантивированное причастие среднего рода множественного числа указывает на ранее предписанное или приказанное, не называя автора приказа.
- source_word: παραιτησάμενοι
  choice: отменив
  rationale: Аористное причастие обозначает отказ от прежде отданных распоряжений и прекращение их действия; «отменив» естественно передаёт это в данном административном контексте.
