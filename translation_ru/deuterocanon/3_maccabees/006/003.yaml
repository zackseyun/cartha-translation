base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/003.yaml
  text: Look upon the offspring of Abraham[a], the children of Jacob who has been sanctified, your sanctified allotted people, perishing unjustly as strangers in a foreign land.
translation:
  language: ru
  text: Воззри на потомство Авраама, на детей освящённого Иакова[a], на Твой народ — Твой освящённый удел, несправедливо гибнущий на чужой земле в положении чужеземцев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на освящённых детей Иакова». Греческий оборот сжат и допускает отнесение слова «освящённого» не к Иакову, а к его детям.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπιδε
  choice: Воззри
  rationale: Молитвенный императив выражает просьбу к Богу обратить внимание и вмешаться; «воззри» сохраняет возвышенный библейский тон и остаётся понятным современному читателю.
- source_word: σπέρμα
  choice: потомство
  rationale: Передаёт собирательное значение слова без буквального и менее естественного «семя».
- source_word: ἡγιασμένου
  choice: освящённого
  rationale: Сохраняет значение перфектного страдательного причастия и в основном тексте согласуется с ближайшим родительным «Иакова».
- source_word: τέκνα Ἰακώβ
  choice: детей … Иакова
  rationale: «Дети» точно передаёт гендерно-общее τέκνα и естественно обозначает потомков Иакова.
- source_word: μερίδος ἡγιασμένης σου λαὸν
  choice: Твой народ — Твой освящённый удел
  rationale: 'Передаёт приложение: народ является принадлежащим Богу освящённым уделом; такая конструкция яснее и точнее, чем искусственное «удельный народ».'
- source_word: ἐν ξένῃ γῇ
  choice: на чужой земле
  rationale: Естественное современное выражение, сохраняющее значение пребывания вне своей земли.
- source_word: ξένως
  choice: где они живут как чужеземцы
  rationale: Развёрнутая передача наречия показывает положение народа как чужаков и избегает неясного буквального «чуждо».
- source_word: ἀδίκως
  choice: несправедливо
  rationale: Сохраняет нравственную оценку происходящего как неправедного.
- source_word: ἀπολλύμενον
  choice: гибнущий
  rationale: Передаёт продолжающийся процесс, выраженный причастием настоящего времени.
theological_decisions:
- issue: К кому относится ἡγιασμένου в сжатом обороте ἐφ’ ἡγιασμένου τέκνα Ἰακώβ
  choice: 'В основном тексте отнесено к Иакову: «детей освящённого Иакова».'
  alternative: «освящённых детей Иакова».
  rationale: Родительный падеж ἡγιασμένου формально согласуется с Ἰακώβ, понимаемым как несклоняемое имя в родительном значении, однако сжатый греческий синтаксис допускает смысловое отнесение к детям; реальная неоднозначность сохранена в примечании.
- issue: Связь μερίδος ἡγιασμένης σου с λαόν
  choice: 'Приложение: «Твой народ — Твой освящённый удел».'
  alternative: «Твой освящённый народ, избранный Тебе в удел».
  rationale: Приложение непосредственно сохраняет образ народа как Божьего удела и не добавляет в основной текст глагольную идею избрания, отсутствующую в греческом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Сохранены параллельные обращения и образ Божьего удела; неоднозначность причастия вынесена в сноску.
