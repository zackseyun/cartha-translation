base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/028.yaml
  text: Release the sons of the almighty[a], heavenly, living God[b], who from the time of our ancestors until now has brought unimpeded stability with glory to our affairs.
translation:
  language: ru
  text: Освободите сынов[a] всемогущего, небесного, живого Бога, который со времён наших предков и доныне дарует нашим делам устойчивость без препятствий и со славой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей». В греческом тексте буквально: «сынов».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «беспрепятственную устойчивость со славой». Греческое выражение говорит об устойчивом состоянии дел, не встречающем препятствий, и о славе, сопутствующей ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσατε
  choice: Освободите
  rationale: Повелительное наклонение множественного числа требует немедленно отпустить удерживаемых на свободу; «освободите» передаёт это прямо и естественно.
- source_word: τοὺς υἱοὺς
  choice: сынов
  rationale: Греческое υἱούς — форма мужского рода со значением «сыновья»; перевод сохраняет выраженную в источнике родовую характеристику.
- source_word: τοῦ παντοκράτορος ἐπουρανίου θεοῦ ζῶντος
  choice: всемогущего, небесного, живого Бога
  rationale: Сохранена цепочка из трёх отдельных определений Бога без добавления союза и без сведения их к одному составному титулу.
- source_word: ἀφʼ ἡμετέρων μέχρι τοῦ νῦν προγόνων
  choice: со времён наших предков и доныне
  rationale: Сжатый греческий оборот выражает непрерывность от времени предков до настоящего; русский перевод делает временное отношение ясным, не меняя смысла.
- source_word: ἀπαραπόδιστον εὐστάθειαν
  choice: ничем не нарушаемую устойчивость
  rationale: ἀπαραπόδιστος указывает на отсутствие препятствий или помех, а εὐστάθεια — на устойчивость, прочность или благополучное состояние. Формулировка сохраняет основной образ устойчивого положения без сужения смысла до материального процветания.
- source_word: μετὰ δόξης
  choice: славную
  rationale: Греческое предложное сочетание естественно передано в русском определением, связывающим славу с даруемой устойчивостью.
- source_word: προφέρει
  choice: дарует
  rationale: В данном контексте глагол обозначает продолжающееся благотворное действие Бога; настоящее время «дарует» согласуется с «доныне» и сохраняет его длительность.
- source_word: τοῖς ἡμετέροις πράγμασιν
  choice: нашим делам
  rationale: πράγματα может обозначать дела, обстоятельства или государственное положение. Широкое «нашим делам» не вводит отсутствующего в тексте уточнения «царству» или «государству».
theological_decisions:
- issue: Цепочка божественных определений παντοκράτορος ἐπουρανίου θεοῦ ζῶντος
  choice: всемогущего, небесного, живого Бога
  alternative: Всемогущего Бога небес, Бога живого
  rationale: Выбранный вариант сохраняет все определения и их нагромождение в греческом тексте, не превращая «небесный» в отдельное указание на местопребывание и не добавляя повтор слова «Бог».
- issue: Родовое значение υἱούς
  choice: сынов
  alternative: детей
  rationale: Источник прямо употребляет существительное мужского рода «сыновья»; нейтрализация до «детей» возможна как смысловое сглаживание, но не требуется контекстом.
- issue: Характер Божьего благодеяния в ἀπαραπόδιστον εὐστάθειαν μετὰ δόξης
  choice: славную, ничем не нарушаемую устойчивость
  alternative: беспрепятственное благополучие со славой
  rationale: Перевод не отождествляет εὐστάθεια исключительно с процветанием и сохраняет сочетание устойчивости, отсутствия препятствий и славы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным регистром царского распоряжения. Синтаксис сохраняет длинную причинно-описательную конструкцию оригинала; неестественное буквальное «устойчивость со славой» передано как «славная… устойчивость».
