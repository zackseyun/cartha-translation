lexical_decisions:
- source_word: ἀπέστρεψαν
  choice: повернули на
  rationale: Активная форма с подлежащим «звери» указывает на изменение направления движения; сочетание «повернули на» естественно передаёт движение против новой цели, а враждебный смысл раскрывается последующими глаголами.
- source_word: τὰ θηρία
  choice: звери
  rationale: «Звери» сохраняет выразительность θηρία и уместно в контексте опасных животных, тогда как «животные» звучало бы слишком нейтрально.
- source_word: ἐπὶ
  choice: на
  rationale: При глаголе движения ἐπί передаёт направленность на цель; дальнейшее описание нападения придаёт сочетанию враждебный смысл без необходимости добавлять слово «против».
- source_word: τὰς συνεπομένας ἔνοπλους δυνάμεις
  choice: шедшие за ними вооружённые отряды
  rationale: Причастие συνεπομένας допускает значения следования и сопровождения. «Шедшие за ними» естественно передаёт пространственное следование, не уточняя сверх греческого текста, к кому именно относится местоимение.
- source_word: κατεπάτουν
  choice: топтали их
  rationale: Несовершенный вид «топтали» отражает имперфект и изображает продолжавшееся действие; сам русский глагол достаточно ясно выражает попрание ногами.
- source_word: ὠλέθρευον
  choice: истребляли
  rationale: «Истребляли» передаёт тяжёлый, вероятно смертельный характер ὀλεθρεύω и своим несовершенным видом сохраняет длительность греческого имперфекта.
