lexical_decisions:
- source_word: ἱκετεύει
  choice: умоляют
  rationale: Глагол выражает настойчивую, смиренную мольбу; «умоляют» естественно передаёт силу обращения и соответствует множественному составному подлежащему в русском языке.
- source_word: τὸ πᾶν πλῆθος
  choice: всё множество
  rationale: Сохраняет и собирательный образ множества, и подчёркнутую полноту, выраженную πᾶν.
- source_word: τῶν νηπίων
  choice: маленьких детей
  rationale: νήπια обозначает совсем юных детей, но не обязательно только младенцев; этот вариант сохраняет возрастную широту и эмоциональную выразительность.
- source_word: οἱ τούτων γονεῖς
  choice: их родители
  rationale: Местоимение τούτων отсылает к детям; краткая русская формулировка ясно передаёт эту связь.
- source_word: μετὰ δακρύων
  choice: со слезами
  rationale: Близко передаёт обстоятельственный оборот и сохраняет зримый образ плача при мольбе.
theological_decisions:
- issue: Написание местоимения, обращённого к Богу
  choice: Тебя
  alternative: тебя
  rationale: Контекст представляет прямую молитвенную мольбу; прописная буква соответствует принятому русскому благоговейному оформлению, не изменяя смысла исходного текста.
translation_notes:
  register: Современный литературный русский язык с dignified молитвенным тоном. Греческое единственное число ἱκετεύει при собирательном πλῆθος в русском передано множественным числом из-за составного подлежащего «множество… и родители».
