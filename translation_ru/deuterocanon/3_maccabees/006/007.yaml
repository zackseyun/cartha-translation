  yaml_path: translation/deuterocanon/3_maccabees/006/007.yaml
  text: You brought Daniel up into the light unharmed[b][a], when he had been thrown to the lions on the ground as food for the beasts through the slanders of envy.
translation:
  language: ru
  text: Ты вывел на свет невредимым Даниила, брошенного львам, на землю[a], в пищу зверям из-за клеветнических обвинений, вызванных завистью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на землю» или «на земле». Греческий оборот здесь труден; он сохранён без замены словами «в львиный ров».'
    reason: textual_variant
  - marker: b
    text: 'Возможный перевод: «из-за наветов зависти» или «из-за обвинений, порождённых завистью». Греческое выражение соединяет понятия клеветы или обвинения и зависти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβολαῖς φθόνου
  choice: из-за клеветы, порождённой завистью
  rationale: Дательный διαβολαῖς передаёт причину или средство враждебного обвинения, а родительный φθόνου — его источник или характер. Формулировка сохраняет оба понятия и естественно звучит по-русски.
- source_word: λέουσι
  choice: львам
  rationale: Дательный множественного числа обозначает тех, кому был отдан Даниил.
- source_word: κατὰ γῆς
  choice: наземь
  rationale: Передаёт пространственное значение трудного оборота, не устраняя его и не заменяя заимствованной из рассказа деталью о рве.
- source_word: ῥιφέντα
  choice: брошенного
  rationale: Причастие аориста от ῥίπτω обозначает насильственное бросание; русское страдательное причастие сохраняет синтаксическую связь с Даниилом.
- source_word: θηρσὶ βορὰν
  choice: в пищу зверям
  rationale: βορά означает пищу или добычу, а θηρσί — зверей; выбранная формулировка ясна и сохраняет угрозу гибели.
- source_word: εἰς φῶς ἀνήγαγες
  choice: вывел на свет
  rationale: Сочетание буквально выражает выведение вверх или наружу к свету и одновременно указывает на избавление; «вывел на свет» сохраняет образ без лишнего пояснения.
- source_word: ἀσινῆ
  choice: невредимым
  rationale: Точно передаёт значение «не потерпевший вреда, целый» и согласуется с Даниилом.
theological_decisions:
- issue: Аллюзия на избавление Даниила от львов
  choice: 'Сохранить прямое обращение к Богу и назвать только присутствующие в греческом тексте детали: Даниила, львов, зверей, свет и невредимость.'
  alternative: Добавить «львиный ров» по известному рассказу о Данииле.
  rationale: Греческий текст не называет рва; добавление этой детали сгладило бы трудное чтение и подчинило данный стих другому повествованию.
- issue: Трудный оборот κατὰ γῆς
  choice: Передать как «наземь» и снабдить примечанием.
  alternative: Опустить оборот или заменить его словами «в ров».
  rationale: Фраза присутствует в исходном тексте и должна быть сохранена без молчаливого исправления или гармонизации.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Порядок слов слегка перестроен ради ясности; образ «света» и трудность κατὰ γῆς сохранены.
