  yaml_path: translation/deuterocanon/3_maccabees/006/031.yaml
  text: Then those who had formerly been disgraced and were near Hades—or rather[a], had already stepped onto it—in place of a bitter and hard-to-drink fate, prepared a saving drinking-bout, divided up as dining-couches, full of joy[c][b], the place prepared for them for downfall and a grave.
translation:
  language: ru
  text: Тогда те, кто прежде были покрыты позором и находились близ Аида[a] — вернее, уже ступили на него[b], — вместо горькой и трудной для питья участи устроили спасительный пир[c] и, исполненные радости, разделили приготовленное им для погибели и могилы место на пиршественные места для возлежания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рядом со смертью», «у самой могилы»; буквально по-гречески: «близ Аида».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «уже ступили на него». Яркий образ означает, что они были уже почти мертвы.'
    reason: cultural_note
  - marker: c
    text: Греческое слово может обозначать попойку или праздничное пиршество с питьём; упоминание мест для возлежания указывает здесь на пир.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπονείδιστοι
  choice: покрыт позором
  rationale: Передаёт состояние публичного поношения и позора, а не просто внутренний стыд.
- source_word: πλησίον τοῦ ᾅδου
  choice: у самого Аида
  rationale: Сохраняет явно названный в греческом тексте Аид и естественно выражает крайнюю близость к смерти.
- source_word: ἐπʼ αὐτῷ βεβηκότες
  choice: уже ступил на него
  rationale: Сохраняет яркий образ совершённого шага на сам Аид; единственное число согласовано с собирательной конструкцией «те, кто».
- source_word: μόρου
  choice: участи
  rationale: Передаёт назначенную злую долю или роковой исход, не вводя излишне отвлечённого представления о судьбе.
- source_word: πικροῦ καὶ δυσαπότικου
  choice: горькой и трудной для питья
  rationale: Сохраняет намеренную метафору питья, подготавливающую контраст с последующим пиром.
- source_word: κῶθωνα σωτήριον
  choice: спасительный пир
  rationale: В контексте мест для возлежания κῶθων обозначает праздничное пиршество с питьём; «спасительный» сохраняет определение σωτήριον без догматического расширения.
- source_word: συστησάμενοι
  choice: устроили
  rationale: Естественно передаёт значение организации ими праздничного собрания для себя.
- source_word: εἰς πτῶσιν αὐτοῖς καὶ τάφον
  choice: им для погибели и могилы
  rationale: Сохраняет двойной мрачный образ падения-погибели и могилы, не сводя его лишь к погребению.
- source_word: κλισίας κατεμέρισαν
  choice: разделили на места для возлежания
  rationale: Передаёт превращение места казни в распределённые места, где участники пира возлежали по древнему обычаю.
- source_word: πλήρεις χαρμονῆς
  choice: исполненные радости
  rationale: Достойное и понятное выражение полноты радости, резко контрастирующей с ожидавшей их гибелью.
theological_decisions:
- issue: Передача ᾅδης
  choice: Аид
  alternative: смерть; могила; царство мёртвых
  rationale: Греческий источник прямо называет ᾅδης. Сохранение «Аида» удерживает исходный образ области мёртвых и не сужает его до конкретного богословского толкования.
- issue: Значение σωτήριον при κῶθωνα
  choice: спасительный пир
  alternative: пир в честь избавления; пир спасения
  rationale: Форма допускает характеристику пира как связанного со спасением или избавлением. Буквальное прилагательное сохраняет эту смысловую напряжённость, не уточняя сверх текста, был ли пир средством спасения или празднованием уже совершившегося избавления.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Необычные исходные образы — питьё горькой участи, шаг на Аид и превращение места гибели в места для возлежания — сохранены; древний пиршественный обычай пояснён сноской.
