  terminology: «Гнев» для ὀργή и «сострадание» для контекстуально понятого οἶκτον уместны. Слово «сострадание» не навязывает богословского прочтения и передаёт эмоциональный поворот, отмеченный также английской аудиторской традицией («pity/grief»).
