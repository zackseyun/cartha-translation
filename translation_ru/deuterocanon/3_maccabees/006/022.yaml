  source_fidelity: 'Начальная часть передана точно: μετεστράφη ... εἰς οἶκτον καὶ δάκρυα — «гнев царя сменился состраданием и слезами». Однако «что он прежде замыслил» необоснованно делает царя субъектом μεμηχανευμένων. В греческом αὐτῷ естественнее относится к ἔμπροσθεν («перед ним», то есть в его присутствии), а причастие имеет форму, позволяющую говорить о том, что было замышлено/устроено, без указания деятеля.'
