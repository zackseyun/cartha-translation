  text: And the king’s anger was turned into grief and tears over those things that had previously been devised before him[a].
translation:
  language: ru
  text: И гнев царя сменился состраданием и слезами из-за того, что прежде было замышлено перед ним[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение сжато: буквально «о том, что было прежде замышлено перед ним». Слова «перед ним» могут означать «в его присутствии»; греческий текст не называет царя тем, кто это замыслил.'
    reason: Сохраняет синтаксическую неопределённость заключительной конструкции и предотвращает ошибочное приписывание замысла царю.
lexical_decisions:
- source_word: μετεστράφη
  choice: сменился
  rationale: Передаёт резкую перемену состояния, выраженную пассивной формой μεταστρέφω, и естественно сочетается в русском с подлежащим «гнев».
- source_word: ἡ ὀργή
  choice: гнев
  rationale: Обычное и стилистически уместное соответствие ὀργή в повествовательном контексте.
- source_word: εἰς οἶκτον καὶ δάκρυα
  choice: состраданием и слезами
  rationale: οἶκτος прежде всего обозначает жалость, сочувствие или сострадание; «сострадание» сохраняет эмоциональный поворот от гнева и звучит достойно и естественно.
- source_word: ὑπὲρ
  choice: из-за
  rationale: В данном контексте ὑπέρ указывает на причину эмоциональной перемены царя.
- source_word: τῶν ἔμπροσθεν αὐτῷ μεμηχανευμένων
  choice: того, что он прежде замыслил
  rationale: ἔμπροσθεν понято во временном смысле «прежде», а дательное αὐτῷ — как обозначение деятеля при перфектном страдательном причастии. Такая передача естественна по-русски, но грамматическая сжатость греческого допускает и иное членение, отмеченное в сноске.
