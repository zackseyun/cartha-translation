base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/026.yaml
  text: Who has so lawlessly surrounded with cruelties those who from the beginning have surpassed all nations in goodwill toward us in every respect, and who have repeatedly shown themselves to face the worst dangers among men?
translation:
  language: ru
  text: Кто так беззаконно окружил жестокими издевательствами тех, кто с самого начала во всём превосходил все народы своей доброжелательностью к нам[a] и не раз проявлял себя в тягчайших опасностях, выпадающих людям[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во всём отличался от всех народов»; греческий глагол может означать как «отличаться», так и, в сравнительном контексте, «превосходить».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение трудно для однозначного понимания; возможный смысл: «тягчайших опасностей в человеческой жизни» или «опасностей, какие выпадают людям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Кто
  rationale: Вопросительное местоимение вводит риторический вопрос; краткое «Кто» естественно сохраняет его силу.
- source_word: τοὺς ἐξ ἀρχῆς
  choice: тех, кто с самого начала
  rationale: Субстантивированное сочетание обозначает людей, чьё поведение было неизменным с самого начала.
- source_word: εὐνοίᾳ πρὸς ἡμᾶς
  choice: своей доброжелательностью к нам
  rationale: εὔνοια означает расположение, благожелательность или доброжелательность; творительный падеж естественно передаёт греческий дательный отношения или аспекта.
- source_word: κατὰ πάντα διαφέροντας πάντων ἐθνῶν
  choice: во всём превосходил все народы
  rationale: В данном сравнительном построении διαφέρω вероятнее означает «превосходить», хотя возможно и более нейтральное «отличаться»; κατὰ πάντα передано как «во всём».
- source_word: πλεονάκις
  choice: не раз
  rationale: Передаёт повторность действия естественным современным русским оборотом.
- source_word: τοὺς χειρίστους ... ἀνθρώπων ... κινδύνους
  choice: самых страшных опасностей, выпадающих людям
  rationale: χειρίστους — превосходная степень со значением крайней тяжести; связь родительного ἀνθρώπων с «опасностями» трудна, поэтому выбран смысл опасностей, встречающихся в человеческой жизни, с сохранением альтернативы в примечании.
- source_word: ἐπιδειγμένους
  choice: проявлял себя перед лицом
  rationale: Средний залог допускает значение «показывать, проявлять себя»; добавление «перед лицом» делает по-русски понятной связь с опасностями, не уточняя, каким именно образом они были пережиты.
- source_word: οὕτως ἀθέσμως
  choice: так беззаконно
  rationale: Сохраняет наречную конструкцию и нравственно-правовую силу ἀθέσμως — действия вопреки закону и должному порядку.
- source_word: περιέβαλεν αἰκίαις
  choice: окружил жестокими издевательствами
  rationale: Сохраняется яркий образ περιβάλλω «окружать, облекать», тогда как αἰκίαι обозначает жестокое обращение, надругательства или истязания.
