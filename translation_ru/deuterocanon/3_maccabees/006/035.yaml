lexical_decisions:
- source_word: οἵ τε Ἰουδαῖοι
  choice: А иудеи
  rationale: В контексте речь идёт об иудеях Египта как об этнорелигиозной общине; союз передан как продолжение повествования.
- source_word: καθὼς προειρήκαμεν
  choice: как мы уже говорили
  rationale: Естественно передаёт авторскую отсылку к сказанному ранее.
- source_word: συστησάμενοι τὸν προειρημένον χορὸν
  choice: составив упомянутый прежде хор
  rationale: συνίστημι указывает на создание или организацию группы, а χορός допускает значения хора и совместно поющей либо танцующей группы; основной текст сохраняет ближайшее соответствие.
- source_word: μετʼ εὐωχίας
  choice: в пиршестве
  rationale: εὐωχία обозначает праздничное угощение и веселье, часто связанное с пиром.
- source_word: ἐν ἐξομολογήσεσιν ἱλαραῖς
  choice: радостных благодарениях
  rationale: В грекоязычной иудейской богослужебной речи ἐξομολόγησις здесь вероятнее означает благодарение или хвалу, а не исповедание грехов.
- source_word: καὶ ψαλμοῖς
  choice: и псалмах
  rationale: Прямое и традиционное соответствие ψαλμοῖς в богослужебном контексте.
- source_word: διῆγον
  choice: проводили время
  rationale: Передаёт длительный характер действия, выраженный имперфектом.
