base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/010.yaml
  text: But if our way of life in the place of our exile has been caught up in ungodliness[a], then, after rescuing us from the hand of our enemies, destroy us by whatever death you choose[b], Master.
translation:
  language: ru
  text: Если же наша жизнь на чужбине[a] оказалась вовлечена в нечестие, то, избавив нас от руки врагов, погуби нас той смертью, какую Ты изберёшь, Владыка[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в нашем поселении (колонии)»; греческое слово может обозначать основанное вдали от родины поселение, но здесь, вероятно, имеется в виду жизнь общины на чужбине.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Повелитель»; греческое обращение δέσποτα подчёркивает полную власть и отличается от обычного слова κύριος («Господь»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβείας
  choice: нечестию
  rationale: «Нечестие» передаёт религиозно-нравственный смысл ἀσέβεια — непочтительность к Богу и жизнь вопреки благочестию — не сводя его к общей «злобе» или «порочности».
- source_word: κατὰ τὴν ἀποικίαν
  choice: на чужбине
  rationale: ἀποικία буквально может обозначать поселение или колонию, однако в контексте молитвы иудейской общины речь идёт о жизни вдали от родной земли. «На чужбине» естественно передаёт этот смысл, а буквальная возможность отмечена в сноске.
- source_word: ὁ βίος ἡμῶν
  choice: наша жизнь
  rationale: βίος здесь охватывает образ и уклад жизни. В сочетании «наша жизнь… оказалась причастна» этическое значение ясно и без утяжеляющего пояснения «образ жизни».
- source_word: ἐνέσχηκται
  choice: оказалась причастна
  rationale: Перфект выражает сложившееся состояние вовлечённости или причастности. Такой перевод сохраняет условность признания, не утверждая вину как установленный факт.
- source_word: ῥυσάμενος
  choice: избавив
  rationale: 'Аористное причастие обозначает действие, предшествующее главному повелению: сначала избавление от врагов, затем просимая смерть.'
- source_word: ἀπὸ ἐχθρῶν χειρός
  choice: от руки врагов
  rationale: Сохранён понятный библейский образ руки как власти и силы врагов.
- source_word: ᾧ προαιρῇ
  choice: какую Ты изберёшь
  rationale: Оборот указывает на свободный выбор Богом способа смерти и естественно соединяется по-русски с μόρῳ.
- source_word: δέσποτα
  choice: Владыка
  rationale: «Владыка» передаёт обращение к обладающему полной властью и отличает δέσποτα от обычного κύριος. В молитвенном контексте слово звучит современно и достойно.
- source_word: ἀπόλεσον ἡμᾶς μόρῳ
  choice: погуби нас той смертью
  rationale: Сохранена резкая сила повелительного ἀπόλεσον и прямое указание μόρος на смерть; речь о просьбе умереть по Божьему решению, а не от рук врагов.
theological_decisions:
- issue: Условное признание возможного нечестия общины
  choice: «Если же… оказалась причастна к нечестию»
  alternative: «Если же… была отмечена нечестием»
  rationale: Выбранный вариант сохраняет условный характер фразы и состояние вовлечённости, выраженное перфектом, не усиливая текст до безусловного исповедания установленной вины.
- issue: Обращение δέσποτα
  choice: «Владыка»
  alternative: «Господь» или «Повелитель»
  rationale: Исходный текст употребляет δέσποτα, а не κύριος. «Владыка» сохраняет оттенок верховной власти, не подменяя слово более привычным титулом «Господь».
- issue: Просьба о смерти после избавления
  choice: «избавив нас… погуби нас той смертью»
  alternative: «спаси нас… а затем умертви избранным Тобою способом»
  rationale: 'Сохранены напряжённая последовательность просьбы и её парадоксальная богословская сила: молящиеся предпочитают смерть по Божьей воле гибели от врагов. Текст не смягчён и не истолкован сверх сказанного.'
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Сохранены библейский образ «руки врагов», резкое «погуби» и синтаксическая последовательность избавления и смерти. Прописная буква в «Ты» поддерживает русский молитвенный регистр, не добавляя нового титула.
