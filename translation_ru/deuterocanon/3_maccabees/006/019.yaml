translation:
  language: ru
  text: И они выступили против них[a], наполнили войско противников смятением и малодушием[b] и сковали их несдвигаемыми оковами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «противостали»; греческий глагол означает «встать против» или «оказать сопротивление».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «наполнили силу противников смятением и малодушием». В данном контексте под «силой» подразумевается войско.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέστησαν
  choice: выступили против них
  rationale: Глагол означает «встать против, противостать, оказать сопротивление». Выражение «выступили против них» естественно передаёт активное противостояние; местоимение «них» восполняет подразумеваемый объект из контекста.
- source_word: δύναμιν τῶν ὑπεναντίων
  choice: войско противников
  rationale: В данном военном контексте δύναμις обозначает не отвлечённую «силу», а воинское соединение или войско; ὑπεναντίων — тех, кто противостоит.
- source_word: ταραχῆς καὶ δειλίας
  choice: смятением и малодушием
  rationale: «Смятение» передаёт внутренний и внешний разлад, выраженный ταραχή, а «малодушие» сохраняет значение робости и утраты мужества в δειλία, не усиливая его до «паники».
- source_word: ἀκινήτοις ... πέδαις
  choice: нерушимыми оковами
  rationale: πέδαι — оковы или путы, первоначально прежде всего ножные; ἀκίνητος буквально означает «неподвижный, несдвигаемый» и здесь подчёркивает невозможность освободиться. «Нерушимые оковы» естественно и образно выражает эту силу.
