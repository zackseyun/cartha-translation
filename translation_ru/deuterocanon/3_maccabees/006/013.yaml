  source_fidelity: Перевод точно передаёт повелительное пожелание πτηξάτω, собирательное ἔθνη («народы»), временное σήμερον, обращение ἔντιμε и заключительный оборот о спасении γένος Иакова. «Трепещут перед» несколько менее явно выражает оттенок робкого отступления, чем «съёживаются/робеют», но в молитвенном русском контексте является допустимой передачей страха перед непреодолимой силой. «Обладающий могуществом спасти» естественно передаёт δυνάμεις ἔχων ἐπὶ σωτηρίαν без неоправданного усиления причинной связи.
