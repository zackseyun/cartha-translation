  yaml_path: translation/deuterocanon/3_maccabees/006/013.yaml
  text: But let the nations cower today before your invincible power[a], O honored one, having power for the salvation of the race of Jacob.
translation:
  language: ru
  text: Но пусть сегодня народы трепещут перед Твоей непобедимой силой, о Досточтимый, обладающий могуществом спасти род Иакова[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ Иакова»; греческое γένος может означать род, потомство или народ, происходящий от общего предка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτηξάτω
  choice: пусть… трепещут
  rationale: Форма передаёт испуганное отступление и робость; «трепещут» естественно звучит в возвышенной молитве и ясно выражает страх перед Божьей силой.
- source_word: ἔθνη
  choice: народы
  rationale: В контексте речь идёт об окружающих народах в совокупности; перевод не вводит более узкого богословского значения «язычники».
- source_word: σὴν δύναμιν ἀνίκητον
  choice: Твоей непобедимой силой
  rationale: Сохраняет значение δύναμις как силы или могущества и ἀνίκητος как того, что невозможно одолеть.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямой и естественный перевод временного наречия.
- source_word: ἔντιμε
  choice: о Досточтимый
  rationale: Сохраняет необычное обращение к Богу прилагательным со значением почёта и уважения, не заменяя его отсутствующим в греческом тексте титулом.
- source_word: δυνάμεις ἔχων
  choice: обладающий могуществом
  rationale: Причастный оборот передан без добавления однозначно причинной связи; множественная форма δυνάμεις здесь допускает собирательное понимание могущества или сил.
- source_word: ἐπὶ σωτηρίαν
  choice: спасти
  rationale: Передаёт направленность могущества на спасение и даёт естественную современную русскую конструкцию.
- source_word: Ἰακὼβ γένους
  choice: род Иакова
  rationale: γένος обозначает род, потомство или народ, происходящий от общего предка; «род Иакова» сохраняет родовое значение и возвышенный регистр.
theological_decisions:
- issue: Передача обращения ἔντιμε к Богу
  choice: о Досточтимый
  alternative: о Почитаемый; о Славный
  rationale: Греческий текст содержит не обычный божественный титул, а субстантивированное прилагательное со значением достоинства и почёта. Необычность обращения сохранена.
- issue: Связь оборота δυνάμεις ἔχων с просьбой
  choice: обладающий могуществом
  alternative: ибо Ты обладаешь могуществом
  rationale: Причастная конструкция может подразумевать основание просьбы, но не выражает причинность явно; русский причастный оборот сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский с возвышенным молитвенным звучанием. Прописные буквы в местоимениях, обращённых к Богу, соответствуют принятой русской религиозной издательской традиции; необычное обращение исходного текста не нормализовано.
