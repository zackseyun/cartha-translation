base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/011.yaml
  text: Let not the empty-headed bless the empty things over the destruction of those beloved by you[a], saying[c][b], “Not even their God rescued them.”
translation:
  language: ru
  text: 'Пусть люди с суетными помыслами[b] не благословляют суетные вещи[a] при гибели возлюбленных Тобой, говоря: «Даже их Бог не избавил[c] их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тщетные вещи»; возможно, имеются в виду идолы. Греческое выражение не называет идолов прямо.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мыслящие тщетное». В греческом здесь намеренная словесная перекличка с «суетными вещами».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не спас их» или «не вызволил их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... εὐλογησάτωσαν
  choice: Пусть ... не благословляют
  rationale: Третье лицо повелительного наклонения с μή передано как запрет в форме молитвенного обращения, без превращения его в прямой приказ противникам.
- source_word: τοῖς ματαίοις
  choice: суетное
  rationale: Субстантивированное прилагательное оставлено общим обозначением тщетного или пустого, без преждевременного уточнения «идолы»; общий корень со словом «суетными» передаёт греческую словесную перекличку.
- source_word: οἱ ματαιόφρονες
  choice: люди с суетными помыслами
  rationale: Естественное для современного литературного русского обозначение людей, чьи мысли тщетны или суетны; оно сохраняет смысл и перекличку с ματαίοις, не прибегая к разговорному «пустоголовые».
- source_word: ἐπὶ τῇ τῶν ἠγαπημένων σου ἀπωλείᾳ
  choice: при гибели возлюбленных Тобой
  rationale: ἐπί с дательным обозначает обстоятельство или повод; «при гибели» сохраняет эту широту. Причастие передано пассивной конструкцией, подчёркивающей Божью любовь к этим людям.
- source_word: λέγοντες
  choice: говоря
  rationale: Сохраняет прямую связь последующих слов с действующим лицом и не добавляет отдельного запрета, которого в греческом тексте нет.
- source_word: Οὐδὲ ὁ θεὸς αὐτῶν ἐρύσατο αὐτούς
  choice: Даже их Бог не избавил их
  rationale: Οὐδέ передано естественным русским сочетанием «даже ... не», а ῥύομαι — традиционно понятным и точным «избавил».
theological_decisions:
- issue: Следует ли понимать τοῖς ματαίοις непосредственно как идолов
  choice: Сохранено более широкое «суетное»
  alternative: «идолов» или «суетных богов»
  rationale: В иудейской полемике слово может обозначать идолов, однако сам стих не называет их прямо. Более широкая передача сохраняет намеренную неоднозначность и не сужает богословский смысл.
translation_notes:
  register: Современный литературный русский с молитвенно-торжественным строем. Обращение к Богу отмечено прописной буквой в местоимении «Тобой». Необычное сочетание «благословляют суетное» сохранено как отражение греческой полемической формулировки; словесная перекличка ματαίοις/ματαιόφρονες передана повтором корня «сует-».
