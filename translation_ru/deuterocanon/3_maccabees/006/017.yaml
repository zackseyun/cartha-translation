  yaml_path: translation/deuterocanon/3_maccabees/006/017.yaml
  text: And when the Jews saw it[a], they cried out loudly to heaven, so that even the neighboring courtyards, echoing with them[b], produced uncontrollable terror throughout the whole camp.
translation:
  language: ru
  text: Увидев это[a], иудеи громко воззвали к небу, так что даже расположенные рядом дворы, отозвавшись эхом на их крик[b], навели неудержимую панику на весь лагерь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидев»; что именно они увидели, определяется из предшествующего контекста.'
    reason: implicit_object
  - marker: b
    text: 'Или: «зазвучав вместе с ними». Греческое слово может обозначать совместное звучание или гулкое эхо в соседних ограждённых пространствах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρήσαντες
  choice: увидев это
  rationale: Аористное причастие задаёт обстоятельство перед основным действием. Дополнение в греческом не выражено, поэтому «это» естественно отсылает к предшествующему событию, не уточняя его сверх контекста.
- source_word: μέγα … ἀνέκραξαν
  choice: громко воззвали
  rationale: Наречное μέγα передаёт силу крика, а ἀνακράζω — громкий возглас. «Воззвали» сохраняет направленность обращения к небу и соответствует достоинству повествования.
- source_word: εἰς οὐρανόν
  choice: к небу
  rationale: Сохранено буквальное направление крика; Бог не назван прямо, хотя контекст допускает понимание крика как обращения к Нему.
- source_word: τοὺς παρακειμένους αὐλῶνας
  choice: расположенные рядом дворы
  rationale: παράκειμαι указывает на соседнее расположение, а αὐλών может обозначать двор либо ограждённое пространство. «Дворы» кратко и наглядно передаёт основной образ.
- source_word: συνηχήσαντας
  choice: отозвавшись эхом на их крик
  rationale: Причастие от συνηχέω описывает совместное звучание или резонанс; русская формулировка ясно показывает, что соседние пространства усилили крик эхом.
- source_word: ἀκατάσχετον πτοήν
  choice: неудержимую панику
  rationale: πτοή означает сильный испуг, ужас или панику, а ἀκατάσχετος — то, что невозможно сдержать. «Неудержимая паника» естественно передаёт оба компонента.
- source_word: παντὶ τῷ στρατοπέδῳ
  choice: на весь лагерь
  rationale: Дательный при ποιῆσαι передан русской конструкцией «навести … на»; στρατόπεδον здесь означает военный лагерь целиком.
theological_decisions:
- issue: Религиозный смысл выражения εἰς οὐρανόν
  choice: к небу
  alternative: к Богу
  rationale: Контекст подразумевает обращение к Богу, однако греческий текст прямо называет небо. Перевод сохраняет эту формулировку и не делает подразумеваемое явным.
- issue: Причинная роль соседних дворов
  choice: дворы, отозвавшись эхом, навели панику
  alternative: крик и эхо вызвали панику
  rationale: В греческой конструкции грамматическим субъектом инфинитива ποιῆσαι выступают αὐλῶνας, а συνηχήσαντας описывает их резонанс. Перевод сохраняет эту образную персонификацию, не заменяя её объяснением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Воззвали» передаёт торжественную направленность крика без добавления прямого упоминания Бога; синтаксис остаётся ясным для обычного читателя.
