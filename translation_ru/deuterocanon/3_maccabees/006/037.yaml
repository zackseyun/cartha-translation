lexical_decisions:
- source_word: ἐνέτυχον
  choice: обратились
  rationale: Глагол может обозначать встречу, обращение или ходатайство перед кем-либо. В сочетании с причастием αἰτούμενοι слово «обратились» естественно передаёт личное обращение к царю, не придавая ему излишне формального или юридического характера.
- source_word: τῷ βασιλεῖ
  choice: к царю
  rationale: Дательный падеж обозначает лицо, к которому обращаются; «к царю» — естественная русская конструкция при глаголе «обратились».
- source_word: τὴν ἀπόλυσιν αὐτῶν
  choice: отпустить их
  rationale: Существительное ἀπόλυσις означает освобождение или позволение уйти. Русская глагольная конструкция ясно и естественно передаёт просьбу разрешить им удалиться, не подразумевая более широкого юридического освобождения.
- source_word: εἰς τὰ ἴδια
  choice: по домам
  rationale: Греческое выражение буквально относится к «своему» и в данном контексте, вероятнее всего, означает возвращение каждого к себе домой. «По домам» естественно передаёт множественность группы и направление возвращения.
- source_word: αἰτούμενοι
  choice: с просьбой
  rationale: Причастие поясняет характер обращения к царю. Оборот «с просьбой» точно передаёт просительное значение и образует естественную русскую фразу.
