  yaml_path: translation/deuterocanon/3_maccabees/006/030.yaml
  text: Then the king[a], after summoning to the city the one in charge of the revenues, ordered that wine and the other provisions suitable for feasting be supplied to the Jews for seven days, deciding that in the very place where they had expected to meet destruction, in that place they should celebrate their deliverance with all rejoicing.
translation:
  language: ru
  text: Затем царь, призвав в город управляющего доходами, приказал в течение семи дней снабжать иудеев вином и прочими припасами для пира. Он решил, что именно там, где они ожидали встретить свою погибель, им надлежит со всей радостью праздновать своё избавление[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздновать своё спасение». Греческое выражение может обозначать избавление или спасение; здесь речь идёт о радости по поводу спасения от гибели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐπὶ τῶν προσόδων
  choice: управляющий доходами
  rationale: Оборот обозначает должностное лицо, ведавшее поступлениями или доходами; перевод сохраняет административный смысл, не вводя более узкого названия должности.
- source_word: οἴνους
  choice: вино
  rationale: Хотя в греческом стоит множественное число, в русском контексте снабжения естественно употребить собирательное единственное число.
- source_word: τὰ λοιπὰ πρὸς εὐωχίαν ἐπιτήδεια
  choice: прочие припасы для пира
  rationale: ἐπιτήδεια указывает на необходимые припасы, а πρὸς εὐωχίαν — на их назначение для праздничной трапезы.
- source_word: τὸν ὄλεθρον ἀναλαμβάνειν
  choice: встретить свою погибель
  rationale: Передаёт ожидавшуюся гибель естественным русским оборотом без буквального и неясного «принять погибель».
- source_word: σωτήρια ἀγαγεῖν
  choice: праздновать своё избавление
  rationale: В данном повествовательном контексте речь идёт о праздновании спасения от угрожавшей гибели; формулировка сохраняет событийный и праздничный смысл выражения.
- source_word: ἐν εὐφροσύνῃ πάσῃ
  choice: со всею радостью
  rationale: Передаёт усилительный смысл πάσῃ и торжественно-радостный характер празднования в понятном литературном русском.
theological_decisions:
- issue: Передача σωτήρια в повествовании о спасении от гибели
  choice: избавление
  alternative: спасение
  rationale: «Избавление» непосредственно указывает на описанное избавление от смерти и не сужает выражение до специального богословского значения; вместе с тем возможное значение «спасение» отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Длинное греческое предложение разделено на два для ясности; смысловая связь царского решения с приказом сохранена.
