lexical_decisions:
- source_word: ἐξέλεξεν
  choice: произнёс
  rationale: В данном повествовательном контексте глагол означает, что он высказал приведённые перед этим слова; «произнёс» естественно передаёт завершённое речевое действие.
- source_word: ἐν ἀμερεῖ χρόνῳ
  choice: в одно мгновение
  rationale: Греческое выражение обозначает предельно краткий промежуток времени и подчёркивает внезапность освобождения.
- source_word: λυθέντες
  choice: освобождённые
  rationale: Страдательное причастие указывает, что герои были избавлены от удерживавшей их опасности или стеснения.
- source_word: τὸν ἅγιον σωτῆρα θεὸν αὐτῶν
  choice: своего святого Бога-Спасителя
  rationale: Так сохраняется компактная последовательность определений и титулов, относящихся к одному Богу, без ослабления значения σωτήρ.
- source_word: ηὐλόγουν
  choice: благословляли
  rationale: Сохраняет обычное библейское значение глагола и более точно, чем общее «прославляли», передаёт форму благодарного обращения к Богу.
- source_word: ἄρτι τὸν θάνατον ἐκπεφυγότες
  choice: только что избежав смерти
  rationale: «Только что» передаёт непосредственность избавления, а совершенное причастие — состоявшийся побег от смерти с сохраняющимся результатом.
theological_decisions:
- issue: Передача σωτῆρα как титула Бога
  choice: Бога-Спасителя
  alternative: Бога-Избавителя
  rationale: «Спаситель» сохраняет прямой смысл и богословскую весомость σωτήρ, тогда как «Избавитель» сильнее ограничивал бы значение данным эпизодом.
- issue: Синтаксическая связь ἅγιον σωτῆρα θεὸν
  choice: святого Бога-Спасителя
  alternative: святого Бога и Спасителя
  rationale: Греческий допускает восприятие слов как тесной последовательности обозначений одного Бога; основной текст сохраняет эту компактность, а сносочка отмечает возможное раздельное оформление титулов.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сохраняет последовательность греческой фразы, но избегает неестественной буквальности; причастные обороты оставлены ради связи освобождения, благословения Бога и только что пережитого избавления.
