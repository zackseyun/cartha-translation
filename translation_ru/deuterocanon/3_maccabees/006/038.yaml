translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного и административного регистра. Перестройка второго предложения выносит «на три дня» перед диапазоном дат и устраняет неестественное русское «до седьмого, в три дня». Все египетские названия месяцев транслитерированы.
