base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/038.yaml
  text: Copies were made for them from the twenty-fifth of Pachon until the fourth of Epiphi[a], over forty days; and they appointed their destruction from the fifth of Epiphi until the seventh[b], in three days.
translation:
  language: ru
  text: 'Для них изготавливали копии[b] с двадцать пятого числа месяца Пахон до четвёртого числа месяца Эпифи[a], в течение сорока дней. Их уничтожение назначили на три дня: с пятого числа месяца Эпифи по седьмое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пахон и Эпифи — названия египетских месяцев, использованные здесь для официальной датировки событий.
    reason: cultural_note
  - marker: b
    text: Греческий глагол, переданный словами «изготавливали копии», может означать изготовление письменных копий или оформление официальных документов; что именно переписывали или оформляли, в этом стихе прямо не сказано.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντιγράφονται
  choice: Документы для них составляли
  rationale: Пассивная форма ἀντιγράφω указывает на изготовление письменных копий или официальных документов; поскольку прямое дополнение в греческом не названо, «документы» передаёт административный контекст, не уточняя их вид.
- source_word: αὐτοῖς
  choice: для них
  rationale: Дательный падеж сохранён без повторного называния иудеев, к которым относится местоимение.
- source_word: ἀπὸ πέμπτης τοῦ Παχὼν καὶ εἰκάδος
  choice: с двадцать пятого числа месяца Пахон
  rationale: πέμπτης ... καὶ εἰκάδος обозначает двадцать пятый день; добавление «месяца» делает египетскую дату ясной современному русскому читателю.
- source_word: ἕως τῆς τετάρτης τοῦ Ἐπιφὶ
  choice: до четвёртого числа месяца Эпифи
  rationale: Естественная русская передача конечной календарной даты с сохранением египетского названия месяца.
- source_word: ἐπʼ ἡμέρας τεσσαράκοντα
  choice: сорок дней
  rationale: Оборот прямо обозначает продолжительность периода; отдельная фраза после тире естественна по-русски.
- source_word: συνίστανται
  choice: назначили
  rationale: В административном контексте глагол означает установить или определить план и сроки; «назначили» сохраняет официальный оттенок.
- source_word: τὴν ἀπώλειαν
  choice: их уничтожение
  rationale: Здесь ἀπώλεια означает намеченную гибель или истребление людей, а не простую утрату.
- source_word: ἀπὸ πέμπτης τοῦ Ἐπιφὶ ἕως ἑβδόμης
  choice: с пятого числа месяца Эпифи до седьмого
  rationale: Краткая и ясная передача диапазона дат; название месяца во второй конечной дате не повторяется.
- source_word: ἡμέραις τρισίν
  choice: на три дня
  rationale: Дательный падеж обозначает предусмотренный промежуток времени; при глаголе «назначили» форма «на три дня» звучит естественно.
