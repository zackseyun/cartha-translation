  yaml_path: translation/deuterocanon/3_maccabees/006/034.yaml
  text: And those who had previously been reckoning them for destruction and to be devoured by birds[a], and had registered them with joy, groaned deeply, clothing themselves with shame[b], and their fire-breathing boldness was vigorously quenched.
translation:
  language: ru
  text: А те, кто прежде считал их обречёнными на погибель и на съедение птицам[a] и с радостью внесли их в списки, тяжко застонали, облекшись в стыд, а их огнедышащая дерзость[b] была решительно погашена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое причастие, переданное словами «считал их обречёнными», в тексте Свита сложно как с точки зрения формы, так и синтаксиса. Однако общий смысл оборота ясен: прежде эти люди считали, что иудеям суждено погибнуть и быть оставленными на съедение птицам.'
    reason: textual_variant
  - marker: b
    text: 'Или: «пламенная дерзость». Греческое выражение образно и в данном контексте имеет резко отрицательный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε πρὶν
  choice: А те, кто прежде
  rationale: Передаёт временное противопоставление πρίν предшествующему враждебному отношению и последовавшей перемене.
- source_word: εἰς ὄλεθρον καὶ οἰωνόβρωτους αὐτοὺς ἐξεσθιέμενοι
  choice: считал их обречёнными на погибель и на растерзание птицами
  rationale: Синтаксис и форма ἐξεσθιέμενοι в данном свидетельстве трудны; перевод естественно выражает ясный общий смысл оборота, не предлагая чрезмерно уверенной реконструкции. Редкое οἰωνόβρωτους означает оставленных на съедение птицам.
- source_word: μετὰ χαρᾶς ἀπογραφάμενοι
  choice: с радостью внёс их в списки
  rationale: ἀπογράφω обозначает внесение в официальный список или регистрацию; контекст требует указания на перечисление иудеев, предпринятое с радостью.
- source_word: κατεστέναξαν
  choice: тяжко застонали
  rationale: Приставочная форма усиливает значение стона; наречие «тяжко» сохраняет эту интенсивность.
- source_word: αἰσχύνην ἐφʼ ἑαυτοῖς περιβαλόμενοι
  choice: облекшись в стыд
  rationale: Сохраняет образ стыда как одежды, которую они на себя надели.
- source_word: πυρόπνουν τόλμαν
  choice: огнедышащая дерзость
  rationale: Буквально сохраняет яркий образ πυρόπνουν и передаёт отрицательный оттенок τόλμα, заданный контекстом.
- source_word: ἀκμαίως ἐσβεσμένοι
  choice: была с силой погашена
  rationale: «Погашена» продолжает огненный образ, а «с силой» передаёт наречное ἀκμαίως без ошибочного значения полной или окончательной степени.
