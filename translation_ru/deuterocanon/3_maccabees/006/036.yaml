base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/036.yaml
  text: And having established a common ordinance concerning these things for all their community throughout their generations[a], they decreed that the previously mentioned days should be observed as days of rejoicing, not for the sake of drinking and gluttony, but because of the deliverance that had come to them through God.
translation:
  language: ru
  text: Установив по этому поводу общее постановление для всей своей общины на все поколения, они постановили отмечать упомянутые выше дни как дни радости — не ради пьянства и чревоугодия, а ради избавления, совершившегося для них через богов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «через богов» (διὰ θεῶν). В иудейском контексте, вероятно, имеется в виду избавление, совершённое единым Богом; множественное число может отражать дошедшую до нас форму текста или особенность выражения.'
    reason: textual_variant
lexical_decisions:
- source_word: κοινὸν ὁρισάμενοι … θεσμόν
  choice: установив … общее постановление
  rationale: Передаёт совместный и формально-нормативный характер θεσμός, сохраняя конструкцию с предшествующим причастием.
- source_word: ἐπὶ πᾶσαν τὴν παροικίαν αὐτῶν
  choice: для всей своей общины
  rationale: В данном контексте παροικία обозначает общину евреев, живущих вне родной земли; буквальное «поселение чужеземцев» в русском тексте было бы неестественно и чрезмерно конкретно.
- source_word: εἰς γενεάς
  choice: на все поколения
  rationale: Выражает действие установления, рассчитанное на последовательные будущие поколения.
- source_word: τὰς προειρημένας ἡμέρας ἄγειν … εὐφροσύνους
  choice: отмечать упомянутые выше дни как дни радости
  rationale: В сочетании с обозначением дней ἄγειν означает соблюдать или праздновать их; «отмечать» естественно передаёт смысл, а εὐφροσύνους — их радостный характер.
- source_word: πότου
  choice: пьянства
  rationale: В противопоставлении избавлению речь идёт не просто об употреблении напитков, а о предосудительном застольном излишестве; «пьянство» передаёт отрицательную окраску.
- source_word: λιχνείας
  choice: чревоугодия
  rationale: Термин обозначает жадность к еде и излишество; «чревоугодие» точно и понятно сохраняет нравственную оценку.
- source_word: σωτηρίας
  choice: избавления
  rationale: В повествовательном контексте имеется в виду конкретное спасение от смертельной опасности, поэтому «избавление» точнее общего богословского «спасение».
- source_word: τῆς διὰ θεῶν γενομένης αὐτοῖς
  choice: дарованного им через богов
  rationale: Основной текст прямо сохраняет грамматически множественное θεῶν и тем самым не устраняет трудность исходного чтения; «дарованного» естественно выражает полученное ими избавление.
theological_decisions:
- issue: Множественное число θεῶν в выражении διὰ θεῶν
  choice: через богов
  alternative: через Бога
  rationale: Издание Swete прямо читает θεῶν, родительный падеж множественного числа. Хотя иудейский контекст делает вероятным подразумеваемое действие единого Бога и допускает подозрение на особенность передачи текста, замена множественного числа единственным молча устранила бы подлинное текстовое и богословское напряжение. Поэтому форма источника сохранена в основном тексте, а контекстуальная трудность объяснена в примечании.
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествовательного и установительного контекста. Синтаксис упрощён без потери логической структуры. Текстовая трудность θεῶν не исправлена молча: буквальное множественное число оставлено в основном тексте и пояснено сдержанным примечанием.'
