  yaml_path: translation/deuterocanon/3_maccabees/006/018.yaml
  text: Then the greatly glorious, almighty, and true God, revealing his holy face, opened the gates of heaven, from which two glorious angels of fearful appearance came down, visible to everyone except the Jews,
translation:
  language: ru
  text: Тогда исполненный великой славы, всемогущий и истинный Бог, явив Свой святой лик[a], открыл небесные врата, из которых сошли два прославленных ангела, грозных видом; их видели все, кроме иудеев,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «явив Своё святое присутствие»; букв. «Своё святое лицо».'
    reason: Лексема πρόσωπον буквально означает «лицо», но также может обозначать присутствие; «лик» в основном тексте сохраняет конкретный возвышенный образ.
lexical_decisions:
- source_word: μεγαλοδόξος
  choice: исполненный великой славы
  rationale: Передаёт усиленное значение сложного прилагательного и звучит естественно в возвышенной современной русской прозе.
- source_word: παντοκράτωρ
  choice: всемогущий
  rationale: Устоявшийся и точный русский эквивалент применительно к Богу.
- source_word: ἀληθινὸς θεός
  choice: истинный Бог
  rationale: Сохраняет богословски значимое и идиоматичное значение ἀληθινός.
- source_word: ἐπιφάνας
  choice: явив
  rationale: Причастие означает явление или обнаружение; при прямом дополнении «лик» краткая форма «явив» естественно сохраняет образ.
- source_word: τὸ ἅγιον αὐτοῦ πρόσωπον
  choice: Свой святой лик
  rationale: «Лик» сохраняет конкретный образ лица и соответствует возвышенному контексту, не сводя выражение только к отвлечённому присутствию.
- source_word: ἠνέῳξε τὰς οὐρανίους πύλας
  choice: открыл небесные врата
  rationale: Близко передаёт прилагательное οὐρανίους и сохраняет торжественный стиль.
- source_word: δεδοξασμένοι
  choice: прославленных
  rationale: Форма причастия буквально указывает на тех, кто наделён славой или прославлен; «прославленных» точнее сохраняет эту грамматическую окраску.
- source_word: φοβεροειδεῖς
  choice: грозных видом
  rationale: Передаёт внешность, внушающую страх, естественно и сдержанно, без излишнего усиления.
- source_word: φανεροὶ πᾶσιν πλὴν τοῖς Ἰουδαίοις
  choice: их видели все, кроме иудеев
  rationale: Ясно выражает воспринимаемость ангелов всеми, за исключением иудеев, и естественно звучит по-русски.
theological_decisions:
- issue: Антропоморфный образ в τὸ ἅγιον αὐτοῦ πρόσωπον
  choice: Свой святой лик
  alternative: Своё святое присутствие; Своё святое лицо
  rationale: Основной текст сохраняет конкретный образ греческого πρόσωπον, не устраняя антропоморфную напряжённость; возможное значение присутствия отмечено в сноске.
- issue: Исключение иудеев из числа видевших ангелов
  choice: их видели все, кроме иудеев
  alternative: они были явлены всем, кроме иудеев
  rationale: Прямое утверждение источника сохранено без объяснения причины и без богословского смягчения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сохраняет непрерывность исходного предложения; конечная запятая отражает продолжение мысли в следующем стихе.
