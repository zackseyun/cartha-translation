    reason: lexical_alternative
lexical_decisions:
- source_word: συναινέσας δὲ αὐτοῖς
  choice: Царь согласился с ними
  rationale: Аористное причастие συναινέσας выражает согласие или одобрение предложения, упомянутого ранее; русский деепричастный оборот здесь был бы тяжеловесен, поэтому действие передано личной формой.
- source_word: ἔγραψεν αὐτοῖς
  choice: написал им
  rationale: Дательный αὐτοῖς естественно передаётся русским «им»; далее прямо названо написанное послание.
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: следующее послание
  rationale: Буквально ὑπογεγραμμένην означает «написанное ниже»; перед цитируемым документом современное русское «следующее» точно передаёт эту функцию.
- source_word: πρὸς τοὺς κατὰ πόλιν στρατηγούς
  choice: обращённое к начальникам в каждом городе
  rationale: κατὰ πόλιν имеет распределительное значение «в каждом городе». στρατηγοί обозначает военно-административных должностных лиц; нейтральное «начальники» сохраняет широту термина и не сводит должность только к современному воинскому званию генерала.
- source_word: μεγαλοψύχως
  choice: великодушно
  rationale: Наречие передаёт благородство, широту души или щедрость; «великодушно» сохраняет возвышенную оценочную окраску.
- source_word: τὴν ἐκτενῆ ἔχουσαν
  choice: излагающее всё подробно
  rationale: Сжатый греческий оборот характеризует послание как содержащее пространное, полное изложение. Русская формулировка передаёт полноту и подробность, не делая текст искусственно буквальным.
