lexical_decisions:
- source_word: ἀκούσας
  choice: услышав
  rationale: Аористное причастие естественно передано русским деепричастием, обозначающим предшествующее обстоятельство.
- source_word: κραυγῆς
  choice: крик
  rationale: Передаёт громкий общий вопль без неуместно узкого уточнения его характера.
- source_word: συνιδὼν
  choice: увидев
  rationale: В контексте глагол обозначает зрительное восприятие с осознанием увиденного; простое «увидев» звучит естественно.
- source_word: πρηνεῖς
  choice: лежат ничком
  rationale: Ясно и наглядно передаёт положение лицом вниз, не прибегая к менее общеупотребительному «простёрты ниц».
- source_word: ἅπαντας
  choice: все
  rationale: Сохраняет всеохватность греческой формы и естественно отсылает к ранее названной группе.
- source_word: εἰς τὴν ἀπώλειαν
  choice: обречённые на гибель
  rationale: Передаёт направленность ситуации к погибели в естественной русской форме, не уточняя способ или непосредственную причину гибели.
- source_word: δακρύσας
  choice: он заплакал
  rationale: Прямо и достойно передаёт пролитие слёз как отдельное действие.
- source_word: μετʼ ὀργῆς
  choice: в гневе
  rationale: Сохраняет сопутствующий гнев, не сводя слёзы однозначно к следствию гнева.
- source_word: τοῖς φίλοις
  choice: своим друзьям
  rationale: Сохраняет основное значение φίλοι; возможный придворный статус пояснён в сноске.
- source_word: διηπείλει
  choice: стал угрожать
  rationale: Начинательная конструкция естественно отражает развёртывающееся действие несовершенного вида.
- source_word: λέγων
  choice: говоря
  rationale: Сохраняет причастное введение прямой речи, продолжающейся в следующем стихе.
