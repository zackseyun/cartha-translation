lexical_decisions:
- source_word: βασιλεῦ
  choice: О Царь
  rationale: Звательная форма открывает молитвенное обращение; частица «о» естественно передаёт его торжественный характер.
- source_word: μεγαλοκράτωρ
  choice: великий силой
  rationale: Сложное слово соединяет представления о величии и могуществе. Формулировка сохраняет оба оттенка и не сливает этот титул с последующим παντοκράτωρ.
- source_word: ὕψιστε
  choice: Всевышний
  rationale: Устоявшийся русский библейский титул, точно передающий превосходную степень и форму прямого обращения.
- source_word: παντοκράτωρ
  choice: Вседержитель
  rationale: Традиционный и понятный в библейском регистре русский эквивалент титула, выражающий всеобъемлющую власть Бога.
- source_word: δέε
  choice: Боже
  rationale: По контексту и представленным исходным данным это звательная форма обращения к Богу; «Боже» сохраняет прямое обращение и согласуется с рядом титулов.
- source_word: διακυβερνῶν
  choice: управляющий
  rationale: Глагол буквально связан с направлением или ведением, подобным управлению судном; здесь «управляющий» естественно передаёт космическое правление.
- source_word: τὴν πᾶσαν κτίσιν
  choice: всем творением
  rationale: Обозначает весь сотворённый мир как единое целое; русская формулировка естественна и сохраняет всеохватность.
- source_word: ἐν οἰκτιρμοῖς
  choice: милосердно
  rationale: Наречие естественно передаёт образ действия в русском предложении; примечание сохраняет заметную в греческом форму множественного числа.
theological_decisions:
- issue: Последовательность божественных титулов
  choice: 'Все титулы переданы раздельно: «О Царь, великий силой, Всевышний, Боже Вседержитель»'
  alternative: Сжать ряд обращений или объединить близкие по смыслу титулы
  rationale: Греческий текст намеренно нагнетает почётные обращения; их раздельная передача сохраняет молитвенную риторику и не устраняет различие между могуществом и всеобъемлющей властью.
- issue: Передача παντοκράτωρ
  choice: Вседержитель
  alternative: Всемогущий; Властитель всего
  rationale: «Вседержитель» сохраняет значение всеобщего владычества и является устоявшимся русским библейским титулом, не сводя слово только к отвлечённой способности совершить всё.
- issue: Божье управление творением и милосердие
  choice: 'Милосердие представлено как образ Божьего управления: «милосердно управляющий»'
  alternative: Понимать оборот лишь как упоминание отдельных проявлений милости
  rationale: Связь причастия с ἐν οἰκτιρμοῖς описывает Божье управление творением как совершаемое в милости; примечание сохраняет возможность услышать также множественность проявлений милосердия.
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным звучанием. Синтаксис сохраняет торжественное накопление обращений, но остаётся понятным современному читателю; архаичная форма «Боже» оправдана живым употреблением в прямом молитвенном обращении.
