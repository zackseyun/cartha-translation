  text: And even the king’s body became seized with shuddering[b][a], and his heavy-hearted boldness was overcome by forgetfulness.
translation:
  language: ru
  text: И даже тело царя охватила дрожь, а его мрачной дерзостью овладело забвение.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его мрачную дерзость охватило замешательство». Греческое λήθη буквально означает «забвение», но здесь может указывать на внезапную растерянность или помрачение, разрушившее решимость царя.'
    reason: lexical_alternative
  - marker: b
    text: Греческое θράσος можно также перевести как «наглость» или «самонадеянность»; слово подчёркивает надменный характер решимости царя.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόφρικον
  choice: охватила дрожь
  rationale: Передаёт телесную дрожь и внезапный охвативший царя трепет; сочетание с σῶμα подчёркивает физическую реакцию.
- source_word: σῶμα
  choice: тело
  rationale: Сохраняет прямое указание греческого текста на тело царя, а не только на его внутреннее состояние.
- source_word: λήθη
  choice: забвение
  rationale: Сохраняет основное значение существительного — «забвение»; возможный контекстуальный оттенок внезапного помрачения или растерянности вынесен в примечание.
- source_word: θράσος
  choice: дерзость
  rationale: В данном контексте слово обозначает не нейтральную смелость, а надменную, безрассудную решимость царя.
- source_word: βαρύθυμον
  choice: мрачной
  rationale: Передаёт тяжёлый, угрюмый и суровый склад духа, выраженный сложным прилагательным, без неестественной русской кальки «тяжелосердечная».
- source_word: ἔλαβεν
  choice: овладело
  rationale: Сохраняет активную конструкцию, в которой λήθη выступает подлежащим и овладевает дерзостью царя, оставаясь естественной по-русски.
