base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/025.yaml
  text: Who was it that removed each one from the secure strongholds of our homeland and household[a], where they had held us in faith[b], and gathered them here without reason?
translation:
  language: ru
  text: Кто, выведя из дома тех, кто верно удерживал крепости нашей страны[a], без всякой причины собрал здесь каждого из них?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая конструкция трудна. Слова «верно удерживал» передают ἐν πίστει; возможны также «удерживал, пользуясь доверием» или «надёжно удерживал». Местоимение ἡμῶν («нас/наши») может относиться либо к тем, кого «удерживали», либо по смыслу к крепостям; избранный перевод принимает последнее понимание.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Кто
  rationale: Вопросительное местоимение вводит риторический вопрос; прямое «Кто» естественно и точно по-русски.
- source_word: τοὺς κρατήσαντας ἡμῶν ἐν πίστει τὰ τῆς χώρας ὀχυρώματα
  choice: тех, кто верно удерживал для нас крепости страны
  rationale: 'Причастие κρατήσαντας согласуется с τοὺς и имеет прямым дополнением τὰ…ὀχυρώματα: речь, вероятнее всего, о людях, удерживавших крепости. ἡμῶν передано как «для нас», а ἐν πίστει — наречным «верно»; при этом трудность конструкции отмечена в сноске.'
- source_word: τὰ τῆς χώρας ὀχυρώματα
  choice: крепости страны
  rationale: ὀχυρώματα обозначает укреплённые места или крепости, а χώρα — страну или землю. Краткое сочетание сохраняет конкретный военно-административный образ.
- source_word: τῆς οἰκίας ἀποστήσας
  choice: удалив из дому
  rationale: Родительный τῆς οἰκίας естественно понимать как обозначение исходной точки при ἀποστήσας — удалении из дома, а не как определение к «крепостям». Оборот «из дому» имеет собирательное значение и не добавляет отсутствующего в греческом притяжательного местоимения.
- source_word: ἕκαστον
  choice: каждого из них
  rationale: Дистрибутивное единственное число подчёркивает каждого человека по отдельности; «из них» ясно связывает его с ранее названной группой.
- source_word: ἀλόγως
  choice: без всякой причины
  rationale: Наречие выражает отсутствие разумного основания или оправдания. Такой перевод естественен в русском риторическом вопросе.
- source_word: ἤθροισεν ἐνθάδε
  choice: собрал здесь
  rationale: ἀθροίζω означает «собирать, сосредоточивать», а ἐνθάδε — «здесь, сюда»; выбран простой и естественный русский оборот.
theological_decisions:
- issue: Значение ἐν πίστει в недогматическом контексте
  choice: верно
  alternative: в верности; пользуясь доверием; надёжно
  rationale: Здесь πίστις характеризует исполнение поручения или доверенное служение, а не формулирует учение о вере. Наречное «верно» передаёт наиболее вероятный смысл, тогда как варианты сохраняются в сноске.
- issue: Синтаксическое присоединение τῆς οἰκίας
  choice: 'связать с ἀποστήσας: «удалив из дому»'
  alternative: 'связать с ὀχυρώματα: «крепости страны и дома»'
  rationale: 'Родительный при глаголе удаления даёт связный смысл и соответствует греческому порядку слов: людей вывели из дому и собрали здесь. Альтернативное присоединение возможно лишь при более тяжёлом понимании конструкции и создаёт неясное сочетание «крепостей дома».'
- issue: Роль ἡμῶν в трудной греческой конструкции
  choice: для нас
  alternative: наши; над нами
  rationale: В контексте верной службы государю выражение лучше всего понимать как указание на тех, кто удерживал крепости в интересах говорящего. Перевод «над нами» грамматически возможен для κρατέω с родительным, но контекстуально создаёт противоположный смысл.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной риторикой. Синтаксис сохранён как единый вопрос, однако порядок слов выстроен естественно для русского языка. Перевод исходит прежде всего из греческой конструкции и не повторяет менее убедительное присоединение «дома» к «крепостям» в английском консультационном слое.
