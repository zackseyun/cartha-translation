base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/004.yaml
  text: Father[a], you who destroyed Pharaoh—the former ruler of this Egypt—when he was exalted with lawless arrogance and boastful speech, increasing in reckless acts, together with his proud army, drowning them in the sea, and who shone forth the light of mercy upon the people of Israel[c][b],
translation:
  language: ru
  text: Отец[a], Ты погубил фараона — прежнего властителя этого Египта, умножавшего дерзкие деяния и вознёсшегося в беззаконной дерзости и хвастливых речах, — вместе с его надменным войском, поглотив их морем[b], и воссиял светом милости над народом Израиля[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Трудное греческое выражение можно также понять как «всё более дерзкий в своих поступках» или «умножавший проявления наглости».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «погубил [их], сделав добычей моря»; образ относится к фараону и его войску.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «воссияв светом милости над народом Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Отец
  rationale: Прямое обращение в молитве; современная и торжественная форма без добавления отсутствующего в греческом междометия.
- source_word: τὸν πρὶν Αἰγύπτου ταύτης δυνάστην
  choice: прежнего властителя этого Египта
  rationale: «Прежний» передаёт временное значение πρίν, «властитель» сохраняет вес δυνάστης, а указательное «этого» отражает ταύτης.
- source_word: πληθύνοντα θράμασιν
  choice: умножая дерзкие поступки
  rationale: Сохраняет трудную конструкцию и связь θράμασιν с вызывающей, дерзкой деятельностью фараона, не сводя её просто к внутреннему качеству.
- source_word: ἐπαρθέντα ἀνόμῳ θράσει
  choice: вознёсся в беззаконной дерзости
  rationale: «Вознёсся» сохраняет образ самовозвышения, тогда как сочетание с «беззаконной дерзостью» раскрывает его отрицательный смысл.
- source_word: γλώσσῃ μεγαληγόμονι
  choice: в хвастливых речах
  rationale: Естественно передаёт образ надменной, высокомерно-хвастливой речи, не калькируя буквально слово «язык».
- source_word: σὺν τῇ ὑπερηφάνῳ στρατιᾷ
  choice: вместе с его надменным войском
  rationale: «Войско» точно передаёт στρατιά, а «надменное» — осуждающий оттенок ὑπερήφανος; притяжательное местоимение ясно из контекста.
- source_word: ποντοβρόχους ἀπώλεσας
  choice: погубил… так что их поглотило море
  rationale: Передаёт редкий сложный образ поглощения морем и ясно относит множественное число как к фараону, так и к его войску.
- source_word: φέγγος ἐπιφάνας ἐλέους
  choice: озарил… светом милости
  rationale: Сохраняет световой образ φέγγος и ἐπιφαίνω, выражая его естественным современным русским языком.
- source_word: Ἰσραὴλ γένει
  choice: народ Израиля
  rationale: В данном контексте γένος означает общность или народ; этот вариант понятен и не привносит современных расовых оттенков.
theological_decisions:
- issue: В одном молитвенном периоде Божий суд над фараоном противопоставлен милости к Израилю.
  choice: Сохранить оба образа — поглощение морем и озарение светом милости — в одном протяжённом предложении.
  alternative: Разделить стих на самостоятельные предложения или заменить образ света словами «явил милость».
  rationale: Единая синтаксическая линия сохраняет риторический контраст между судом над надменным угнетателем и милостью к Израилю, не ослабляя ни одной стороны.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. Прописное «Ты» уместно в прямом обращении к Богу. Протяжённый период и завершающая запятая сохранены, поскольку стих является частью продолжающейся молитвенной конструкции.
