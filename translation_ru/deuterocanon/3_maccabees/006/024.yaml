    rationale: В оригинале ἐμὲ αὐτὸν подчёркивает объект действия — самого говорящего. В русском естественнее поставить «меня, вашего благодетеля» непосредственно после «лишить», сохранив «даже» как усиление.
  revised_text: Вы преступили пределы царской власти и жестокостью превзошли тиранов. Теперь вы даже покушаетесь лишить меня, вашего благодетеля, власти и жизни, тайно замышляя то, что не служит благу царства.
