base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/024.yaml
  text: You have exceeded kings and surpassed tyrants in cruelty; and you are now even attempting to remove me myself[a], your benefactor, from power and from life, secretly plotting what is not advantageous to the kingdom.
translation:
  language: ru
  text: Вы преступили пределы царской власти и жестокостью превзошли тиранов. Теперь вы даже покушаетесь лишить меня, вашего благодетеля, власти и жизни, тайно замышляя то, что не служит благу царства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παραβεβασιλεύετε
  choice: Вы преступили пределы царской власти
  rationale: Редкий глагол с приставкой παρα- выражает выход за надлежащие пределы царского правления; перевод сохраняет обвинительный смысл и естественно звучит по-русски.
- source_word: τυράννους ὑπερβεβήκατε ὠμότητι
  choice: жестокостью превзошли тиранов
  rationale: Сравнительная конструкция передаёт превосходство в жестокости; «тираны» прямо соответствует греческому существительному.
- source_word: ἐμὲ αὐτὸν
  choice: даже меня
  rationale: Передаёт усилительное значение αὐτόν без неестественного русского «меня самого» в данной позиции.
- source_word: τὸν ὑμῶν εὐεργέτην
  choice: вашего благодетеля
  rationale: «Благодетель» точно передаёт эллинистическое εὐεργέτης и сохраняет личный и политический оттенки.
- source_word: τῆς ἀρχῆς
  choice: власти
  rationale: В контексте политического заговора ἀρχή означает правление или властное положение.
- source_word: τοῦ πνεύματος
  choice: самой жизни
  rationale: В сочетании с лишением власти и тайным заговором πνεῦμα естественно обозначает дыхание как жизнь; «самой» помогает передать усиление и по-русски ясно выражает покушение на жизнь.
- source_word: μεθιστᾶν
  choice: лишить
  rationale: Глагол означает устранить или сместить; русское «лишить власти и жизни» естественно охватывает оба дополнения.
- source_word: λάθρα μηχανώμενοι
  choice: тайно замышляя
  rationale: Сохраняет значение скрытого, намеренного заговора.
- source_word: τὰ μὴ συμφέροντα τῇ βασιλείᾳ
  choice: то, что не служит благу царства
  rationale: Передаёт отрицательную формулировку оригинала и смысл действий, не отвечающих интересам царства, без усиления до прямого «вредит».
theological_decisions:
- issue: Значение πνεῦμα в обвинении
  choice: жизнь
  alternative: дух; дыхание
  rationale: Политический контекст и сочетание с лишением власти указывают на намерение убить. Сноска сохраняет лексическую широту πνεῦμα и не превращает контекстуальный выбор в антропологическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством царской обвинительной речи. Синтаксис разделён на два предложения ради ясности; образность и напряжение оригинала сохранены без архаизации.
