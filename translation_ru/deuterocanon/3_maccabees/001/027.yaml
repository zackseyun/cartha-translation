base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/027.yaml
  text: Therefore[a], when those around him saw these things[b], they turned to join our people in calling on the one who has all power to help in the present circumstances and not overlook the lawless and arrogant deed.
translation:
  language: ru
  text: Итак, те, кто был рядом с ним, увидев всё это, присоединились к нашим и стали взывать к Тому, Кто обладает всей силой, чтобы Он пришёл на помощь в этих обстоятельствах[a] и не оставил без внимания это беззаконное и надменное деяние.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы Он пришёл на помощь тем, кто находился там».'
    reason: Греческое τοῖς παροῦσιν может относиться как к наличным обстоятельствам, так и к присутствующим людям.
lexical_decisions:
- source_word: ταῦτα
  choice: всё это
  rationale: Передаёт множественное указательное местоимение как отсылку ко всей совокупности только что увиденных событий; по-русски звучит естественнее буквального «эти вещи».
- source_word: οἱ περὶ αὐτὸν ὄντες
  choice: те, кто был рядом с ним
  rationale: Сохраняет прозрачность греческого оборота и не уточняет без достаточных оснований, были ли это приближённые, спутники или служители.
- source_word: θεωροῦντες
  choice: увидев
  rationale: Естественно передаёт зрительное восприятие и обстоятельственное отношение причастия к последующему действию.
- source_word: ἐτράπησαν εἰς τὸ ... ἐπικελεῦσθαι
  choice: присоединились ... и стали взывать
  rationale: Передаёт переход к совместному молитвенному обращению; русское «стали взывать» естественно выражает начало действия.
- source_word: σὺν τοῖς ἡμετέροις
  choice: присоединились к нашим
  rationale: Сохраняет подразумеваемый в греческом тексте референт «наших», не конкретизируя его как «народ» или «людей».
- source_word: τὸν πὰν κράτος ἔχοντα
  choice: к Тому, Кто обладает всей силой
  rationale: Передаёт описательное именование Бога через Его могущество, не заменяя его более поздним закреплённым титулом «Всемогущий».
- source_word: τοῖς παροῦσιν
  choice: в этих обстоятельствах
  rationale: Контекстуально понимается как происходящее в настоящий момент; неоднозначность с возможным значением «тем, кто присутствовал» отмечена в сноске.
- source_word: ἐπαμῦναι
  choice: прийти на помощь
  rationale: Передаёт значение помощи и защиты ярче, чем общее «помочь», оставаясь естественным по-русски.
- source_word: μὴ περιιδεῖν
  choice: не оставить без внимания
  rationale: Передаёт просьбу не смотреть безучастно и не допустить совершения поступка; выражение естественно для современного литературного русского.
- source_word: τὴν ἄνομον καὶ ὑπερήφανον πρᾶξιν
  choice: это беззаконное и надменное деяние
  rationale: Сохраняет обе нравственные характеристики поступка и возвышенный, но понятный регистр.
theological_decisions:
- issue: Передача описания Бога τὸν πὰν κράτος ἔχοντα
  choice: Тот, Кто обладает всей силой
  alternative: Всемогущий
  rationale: Греческий текст содержит описательный оборот, а не стандартный божественный титул; перевод сохраняет эту форму и не усиливает терминологическую определённость.
- issue: Референт σὺν τοῖς ἡμετέροις
  choice: к нашим
  alternative: к нашему народу
  rationale: В тексте существительное не названо. Хотя контекст, вероятно, указывает на представителей иудейской общины, перевод сохраняет подразумеваемый референт и не устраняет исходную недосказанность.
- issue: Референт τοῖς παροῦσιν
  choice: в этих обстоятельствах
  alternative: тем, кто находился там
  rationale: Средний род во множественном числе естественно допускает значение «нынешние обстоятельства, происходящее»; возможное личное понимание сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного и молитвенного контекста. Синтаксис сделан плавным, но исходные неоднозначности в обозначении «наших» и адресата помощи не устранены догматически; одна из них отражена сноской.
