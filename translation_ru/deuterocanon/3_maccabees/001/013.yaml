    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπυνθάνετο
  choice: допытывался
  rationale: Имперфект передаёт продолжавшийся или настойчивый расспрос; «допытывался» сохраняет оттенок выяснения причины и уместный повествовательный тон.
- source_word: διὰ τίνα αἰτίαν
  choice: по какой причине
  rationale: Прямо передаёт вопрос о причине, не сводя выражение к более краткому «почему».
- source_word: αὐτὸν εἰσερχόμενον
  choice: ему войти
  rationale: Причастная конструкция при κωλύω естественно передаётся по-русски инфинитивным оборотом после «помешал».
- source_word: πᾶν τέμενος
  choice: любое священное место
  rationale: В данном отрицательном контексте πᾶν естественно имеет распределительное значение «любое»; τέμενος обозначает освящённое место или священную ограду шире, чем только храмовое здание.
- source_word: οὐθεὶς ἐκώλυσεν
  choice: никто ... не помешал
  rationale: Передаёт фактическое отсутствие попытки воспрепятствовать входу; русское «помешал войти» естественно соответствует κωλύω.
- source_word: τῶν παρόντων
  choice: из присутствовавших
  rationale: 'Сохраняет партитивный генитив: никто из находившихся там не воспрепятствовал ему.'
