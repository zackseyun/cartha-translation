lexical_decisions:
- source_word: ἵνα μὴ
  choice: чтобы ... не
  rationale: Передаёт отрицательное целевое значение естественной современной русской конструкцией.
- source_word: καυχήσωνται
  choice: не хвалились
  rationale: Сохраняет значение самодовольного хвастовства и уместно для возвышенного контекста.
- source_word: οἱ παράνομοι
  choice: беззаконники
  rationale: Передаёт прямую связь παράνομος с нарушением закона, не расширяя значение до общего «нечестивцы».
- source_word: ἐν θυμῷ αὐτῶν
  choice: в ярости своей
  rationale: θυμός обозначает сильный, разгорячённый гнев; «ярость» сохраняет интенсивность выражения.
- source_word: μηδὲ
  choice: и не
  rationale: Естественно связывает в русском языке две однородные отрицательные целевые конструкции.
- source_word: ἀγαλλιάσωνται
  choice: не торжествовали
  rationale: Передаёт бурную, победную радость; в данном враждебном контексте звучит естественнее, чем буквальное «ликовали».
- source_word: ἐν ὑπερηφανίᾳ γλώσσης αὐτῶν
  choice: надменно говоря
  rationale: Естественно передаёт греческий образ «в надмении их языка» как характеристику горделивой, дерзкой речи.
- source_word: λέγοντες
  choice: 'говоря:'
  rationale: Сохраняет причастный переход к следующей прямой речи; двоеточие указывает на её продолжение.
