lexical_decisions:
- source_word: ἀποτραπέντες
  choice: повернув назад
  rationale: Аористное причастие передаёт поворот или возвращение в обратном направлении, не уточняя внешнего деятеля; деепричастная конструкция сохраняет связь с основным глаголом.
- source_word: παρῆσαν
  choice: они вернулись
  rationale: В сочетании с ἐπὶ и после ἀποτραπέντες глагол указывает на прибытие или возвращение к прежнему положению, а не просто на присутствие.
- source_word: στάσιν
  choice: положению
  rationale: Слово может обозначать как телесную позу, так и более общее состояние. «Положение» естественно сохраняет обе возможности.
- source_word: δεήσεως
  choice: молящихся
  rationale: δέησις обозначает настойчивую молитву-просьбу. В русском сочетание «положение молящихся» звучит естественнее буквального «положение моления», сохраняя молитвенный смысл.
- source_word: ἐπὶ τὴν αὐτὴν ... στάσιν
  choice: к тому же положению
  rationale: Оборот выражает возвращение к ранее принятому положению или состоянию; «тому же» точно передаёт αὐτήν.
