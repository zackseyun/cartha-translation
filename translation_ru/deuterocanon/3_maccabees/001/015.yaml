  text: For your dwelling place is the heaven of heaven[b][a], unreachable by men.
translation:
  language: ru
  text: Ибо Твоё обиталище — небо небес[a], недоступное людям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
