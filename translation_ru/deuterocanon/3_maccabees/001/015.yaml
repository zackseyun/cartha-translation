lexical_decisions:
- source_word: κατοικητήριόν
  choice: обиталище
  rationale: Существительное обозначает место пребывания или жилище; «обиталище» сохраняет конкретный смысл и соответствует возвышенному регистру молитвы.
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: небо небес
  rationale: Греческая форма буквально имеет единственное число во второй части («небо неба»), но передаёт семитский оборот превосходной степени; русское библейское выражение «небо небес» естественно, понятно и сохраняет образ исходного текста.
- source_word: ἀνέφικτος
  choice: недоступное
  rationale: Прилагательное означает то, чего невозможно достичь; форма среднего рода согласована с «обиталище» и передаёт недостижимость Божьего небесного жилища для людей.
- source_word: ἀνθρώποις
  choice: людям
  rationale: Дательный падеж обозначает, для кого обиталище недоступно. «Людям» точно передаёт общее указание на человечество без неоправданного ограничения мужчинами.
theological_decisions:
- issue: Передача семитского оборота οὐρανὸς τοῦ οὐρανοῦ
  choice: небо небес
  alternative: 'высочайшее небо; буквально: небо неба'
  rationale: Выражение указывает на высшую небесную сферу как Божье обиталище. «Небо небес» сохраняет традиционный библейский образ, не сводя его без необходимости к пояснительному парафразу.
- issue: Объём значения ἀνθρώποις
  choice: людям
  alternative: человеку; человеческим существам
  rationale: Греческое слово здесь относится ко всему человечеству, а не только к лицам мужского пола; «людям» передаёт этот смысл естественно и точно.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Сохранён причинный союз «ибо» и библейский образ «небо небес»; синтаксис остаётся ясным для современного читателя.
