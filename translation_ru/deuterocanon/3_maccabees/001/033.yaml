  terminology: «Народ» адекватно передаёт ἔθνος в данном контексте. «Обычное общение» удачно передаёт κοινὴ συναναστροφή. Сноска b должна пояснять социальное исключение, не превращая εὐχρηστία в обязательную материальную помощь.
