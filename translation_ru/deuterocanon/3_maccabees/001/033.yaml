base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/033.yaml
  text: They had been instructed to obtain support[a], and they loathed those who withdrew from them, judging them as enemies of the nation[b], and depriving them of common association and serviceability.
translation:
  language: ru
  text: Их наставляли искать поддержки[a]; тех же, кто отделялся от них, они гнушались, считали врагами народа и лишали обычного общения и возможности быть полезными[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помощи», «содействия».'
    reason: lexical_alternative
  - marker: b
    text: То есть отстраняли их от обычных общественных связей и от полезного участия в общей жизни.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνπαιδεῖς τε καθηστήκεισαν
  choice: их учили
  rationale: Сочетание обозначает устойчивое состояние, сложившееся вследствие наставления или воспитания. Краткая русская формулировка естественно передаёт этот смысл, не утяжеляя фразу буквальным «были поставлены обученными».
- source_word: ἀντιλήψεως τεύξεσθαι
  choice: добиваться поддержки
  rationale: ἀντίληψις означает помощь или поддержку, а τεύγχανω с родительным — получать или достигать. «Добиваться поддержки» сохраняет целевую направленность инфинитива, не уточняя вид помощи.
- source_word: ἀποχωροῦντας ἐξ αὐτῶν
  choice: тех, кто отходил от них
  rationale: Глагол выражает удаление или отделение от группы; «отходил» сохраняет как пространственный, так и социальный оттенок.
- source_word: ἐβδελύσσοντο
  choice: ненавидели
  rationale: Глагол передаёт сильное отвращение. «Ненавидели» звучит естественно и достаточно сильно в современном русском; более буквальное «гнушались» возможно, но стилистически архаичнее.
- source_word: πολεμίους τοῦ ἔθνους
  choice: врагами своего народа
  rationale: ἔθνος здесь обозначает еврейский народ как общность. «Народ» в современном русском менее склонно вызывать государственно-националистические ассоциации, чем «нация».
- source_word: κοινῆς συναναστροφῆς
  choice: обычного общения
  rationale: Фраза указывает на повседневные общественные связи и совместную жизнь; «обычное общение» передаёт это ясно и без церковно-конфессионального оттенка слова «общение» в значении fellowship.
- source_word: εὐχρηστίας
  choice: взаимной пользы
  rationale: Слово означает полезность, практическую пользу или пригодность. В социальном контексте «взаимная польза» естественно обозначает полезное участие в жизни общины, сохраняя некоторую широту исходного слова.
- source_word: ἐστέροῦν
  choice: лишали
  rationale: Прямо передаёт значение лишения чего-либо и естественно управляет двумя однородными дополнениями.
theological_decisions:
- issue: Коллективная идентичность в слове ἔθνος
  choice: своего народа
  alternative: народа; нации
  rationale: Контекст говорит о верности еврейской общности. Местоимение «своего» естественно выражает подразумеваемую принадлежность обвиняемых к тому же народу, не вводя отдельного богословского толкования.
- issue: Характер исключения в κοινῆς συναναστροφῆς καὶ εὐχρηστίας
  choice: лишали обычного общения и взаимной пользы
  alternative: лишали общего общения и полезности; исключали из обычных общественных связей и полезного участия
  rationale: 'Перевод сохраняет два элемента греческой фразы: социальные отношения и практическую пользу. Сноска отмечает контекстуальный смысл, не сводя неоднозначную εὐχρηστία только к материальной помощи или служению.'
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Синтаксис слегка упрощён по сравнению с греческим периодом, однако последовательность обвинений сохранена. Формулировка избегает архаизмов и конфессионально окрашенной лексики.
