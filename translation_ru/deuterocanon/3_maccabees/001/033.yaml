  - severity: medium
    issue: «Ненавидели» для ἐβδελύσσοντο
    rationale: Глагол обозначает гнушение, омерзение или отвращение; ненависть является иной эмоцией и утрачивает этот оттенок.
  - severity: medium
    issue: «Взаимной пользы» для εὐχρηστίας
    rationale: В исходном слове есть полезность, пригодность или полезное участие, но нет семантического компонента взаимности.
