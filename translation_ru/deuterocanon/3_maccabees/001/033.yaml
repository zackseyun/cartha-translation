  to: Их наставляли искать поддержки[a]; тех же, кто отделялся от них, они гнушались, считали врагами народа и лишали обычного общения и возможности быть полезными[b].
  rationale: Редакция устраняет добавленный оттенок усилия в «добиваться», передаёт отвращение, выраженное ἐβδελύσσοντο, и не добавляет взаимность к εὐχρηστία. «Наставляли искать» идиоматично передаёт смысл предшествующего обучения в сочетании с целью обрести помощь; время греческого плюсквамперфекта в русском естественно не воспроизводится формально. Сохранены оба якоря и содержание сносок.
