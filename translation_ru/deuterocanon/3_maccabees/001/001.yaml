base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/001.yaml
  text: Philopator[a], having learned from those who had returned of the seizure by Antiochus of the regions under his rule, gave orders to all his infantry and cavalry forces, took along his sister Arsinoe, and set out as far as the region of Raphia, where those with Antiochus had encamped.
translation:
  language: ru
  text: Филопатор, узнав от вернувшихся, что Антиох захватывает области, находившиеся под его властью, отдал распоряжения всем своим пехотным и конным силам, взял с собой сестру Арсиною и выступил в район Рафии, где люди Антиоха[a] уже разбили лагерь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «те, кто вокруг Антиоха» — греческий оборот, обозначающий людей из его окружения или его войска; он может включать и самого Антиоха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ο ΔΕ
  choice: Филопатор
  rationale: δέ обозначает продолжение повествования, а не явное временное «теперь»; в современном русском отдельный союз здесь не требуется.
- source_word: παρὰ τῶν ἀνακομισθέντων
  choice: от возвратившихся
  rationale: Причастие указывает на вернувшихся людей, не называя их прямо гонцами или вестниками.
- source_word: τὴν γινομένην ... ἀφαίρεσιν ὑπὸ Ἀντιόχου
  choice: что Антиох захватывает
  rationale: Естественная русская глагольная конструкция передаёт совершающееся отторжение территорий и сохраняет указание на Антиоха как действующее лицо.
- source_word: τῶν ἐπ᾽ αὐτοῦ κρατουμένων τόπων
  choice: подвластные ему области
  rationale: Передаёт политический смысл территорий, находившихся под властью Филопатора, без излишне буквального «удерживаемых им мест».
- source_word: ταῖς πάσαις δυνάμεσιν πεζικαῖς καὶ ἱππικαῖς
  choice: всем пешим и конным войскам
  rationale: Точные и понятные русские обозначения пехотных и кавалерийских сил.
- source_word: τὴν ἀδελφὴν Ἀρσινόην συνπαραλαβών
  choice: взял с собой свою сестру Арсиною
  rationale: Естественно передаёт совместное взятие в путь; «свою» ясно указывает родство с Филопатором.
- source_word: ἐξώρμησεν μέχρι τῶν κατὰ Ῥαφίαν τόπων
  choice: выступил к окрестностям Рафии
  rationale: Сохраняет военный оттенок движения и географическое значение местности вокруг Рафии.
- source_word: οἱ περὶ Ἀντίοχον
  choice: сторонники Антиоха
  rationale: Греческая идиома обозначает группу людей при Антиохе — его окружение или войска; возможное включение самого Антиоха пояснено в сноске.
- source_word: παρεμβεβλήκεισαν
  choice: расположились станом
  rationale: Военный контекст требует значения «разбили лагерь»; выбран dignified и понятный повествовательный оборот.
