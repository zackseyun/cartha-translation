  text: И кто-то необдуманно сказал, что именно это превратно представляют как нечто необычайное[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что именно это неверно превращают в диковину»; или: «что именно это сенсационно преувеличивают». Греческий глагол может означать представлять что-либо как чудесное, необычайное или невероятное; в некоторых контекстах он может также иметь оттенок превращения в знамение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπρονοήτως
  choice: необдуманно
  rationale: Наречие указывает на отсутствие предусмотрительности или размышления; «необдуманно» естественно передаёт поспешность высказывания, не усиливая нравственной оценки.
- source_word: ἔφη
  choice: сказал
  rationale: Простой и точный эквивалент глагола речи; контекст не требует более сильного «заявил» или торжественного «провозгласил».
- source_word: κακῶς
  choice: зловещее
  rationale: 'Негативное значение наречия передано вместе с τερατεύεσθαι: речь идёт о представлении чего-либо как дурного, необычайного знамения. Такое сочетание по-русски естественнее буквального «плохо».'
- source_word: αὐτὸ τοῦτο
  choice: именно это
  rationale: Передаёт эмфатическое выделение предмета речи без тяжеловесного буквального оборота «это самое».
- source_word: τερατεύεσθαι
  choice: представляют как … знамение
  rationale: Глагол связан с τέρας — необычайным явлением, чудом или предзнаменованием — и допускает смысл превращения события в нечто знаменательное или чудовищное. Перевод сохраняет пассивную направленность и образ знамения; неоднозначность отмечена в сноске.
