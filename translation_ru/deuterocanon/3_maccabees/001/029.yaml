  naturalness: «Звучат ... люди» в современном литературном русском несколько неестественно. «Отзывались гулом» сохраняет образ всеобщего резонанса и лучше сочетается с людьми, стенами и землёй.
  terminology: «Осквернение» точно передаёт βεβήλωσις; «место» правильно не конкретизируется до «храма». «Вся земля» приемлема для τὸ πᾶν ἔδαφος в данном гиперболическом образе.
