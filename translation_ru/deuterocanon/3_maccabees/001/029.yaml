  yaml_path: translation/deuterocanon/3_maccabees/001/029.yaml
  text: For it seemed that not only the people[a], but even the walls and the whole ground, were resounding[c][b], since then all things were being changed to death instead of the profanation of the place.
translation:
  language: ru
  text: Ибо казалось, что гулом отзывались не только люди, но даже стены и вся земля[a], ведь тогда всё обращалось к смерти вместо осквернения этого места[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звучали», «отдавались эхом». Греческий глагол обозначает звучание, гул или отзвук.'
    reason: lexical_alternative
  - marker: b
    text: Греческое «всего» может относиться ко всем людям; грамматически оно допускает и более широкое значение — «всего», «всех и всего».
    reason: ambiguity
  - marker: c
    text: По контексту речь идёт о священном месте, вероятно о храмовой территории, однако в греческом тексте здесь стоит общее слово «место». Необычный оборот буквально сохраняет образ обращения к смерти вместо осквернения этого места.
    reason: cross_reference
lexical_decisions:
- source_word: δοκεῖν γὰρ ἦν
  choice: Ибо казалось
  rationale: Безличный греческий оборот естественно передан по-русски; союз сохраняет пояснительную связь с предыдущим повествованием.
- source_word: τοὺς ἀνθρώπους
  choice: люди
  rationale: Обозначает людей как собирательную группу, без неоправданного ограничения по полу.
- source_word: τὰ τείχη καὶ τὸ πᾶν ἔδαφος
  choice: стены и вся земля
  rationale: Сохраняется гиперболический образ, в котором окружающее пространство словно участвует в общем звучании; «земля» здесь естественнее буквального, но стилистически неловкого «грунт».
- source_word: ἠχεῖν
  choice: звучат
  rationale: Передаёт слышимое, гулкое звучание и позволяет отнести один глагол как к людям, так и к стенам и земле, сохраняя необычный образ оригинала.
- source_word: ἅτε δὴ
  choice: ведь
  rationale: Естественно выражает пояснительно-причинный оттенок сочетания частиц.
- source_word: τῶν πάντων
  choice: все
  rationale: Сохраняет широкий смысл греческой формы и в контексте естественно допускает отнесение ко всем присутствующим, не вводя существительного, которого нет в оригинале.
- source_word: τότε θάνατον ἀλλασσομένων ἀντὶ τῆς τοῦ τόπου βεβηλώσεως
  choice: тогда все меняли осквернение этого места на смерть
  rationale: 'Сохраняет необычную метафору обмена: смерть принимается вместо осквернения священного места. Несовершенный вид передаёт одновременность настоящего причастия с описываемым звучанием.'
theological_decisions:
- issue: К чему относится τοῦ τόπου
  choice: этого места
  alternative: храма / святого места
  rationale: В греческом тексте употреблено общее слово «место». Контекст указывает на священную территорию, однако конкретизация словом «храм» была бы уже истолкованием.
- issue: Смысл образа θάνατον ἀλλασσομένων ἀντὶ...
  choice: меняли осквернение этого места на смерть
  alternative: предпочитали смерть осквернению этого места
  rationale: Основной текст сохраняет метафору обмена и напряжённость необычного греческого выражения; более гладкий вариант точнее разъясняет подразумеваемый выбор, но ослабляет образность.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Необычная персонификация стен и земли и метафора обмена сохранены, но синтаксис сделан понятным для обычного читателя.
