  text: And varied was the plea of those who had gathered for this[b][a], concerning those who were being impiously handed over by him.
translation:
  language: ru
  text: Многообразной была мольба[a] собравшихся для этого — о тех, кого он нечестиво отдавал во власть других[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прошение», «моление».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нечестиво предавал» или «нечестиво передавал». Греческий глагол указывает на отдачу людей во власть других; конкретный адресат такой передачи не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποικίλη
  choice: самыми разными
  rationale: Передаёт предикативное значение «разнообразная, многообразная» естественным современным русским оборотом.
- source_word: δέησις
  choice: мольбы
  rationale: Слово обозначает настойчивое, нуждой вызванное прошение; множественное число по-русски естественно сочетается с указанием на разнообразие обращений, хотя в греческом стоит собирательное единственное число.
- source_word: τῶν εἰς τοῦτο συλλεγέντων
  choice: собравшихся ради этого
  rationale: Сохраняет краткое указание на цель и не называет невыраженного в греческом деятеля, который мог собрать людей.
- source_word: ἐπὶ τοῖς ... κατεγχειρουμένοις
  choice: из-за того, что ... замышлял
  rationale: Оборот с ἐπί и дательным указывает на повод для мольбы. Средне-пассивное причастие в среднем роде допускает понимание как «то, что предпринималось/замышлялось», что лучше согласуется с греческой формой и контекстом, чем отнесение к людям, которых якобы «передавали».
- source_word: ἀνοσίως
  choice: нечестиво
  rationale: Сохраняет нравственно-религиозный оттенок нарушения священного, особенно существенный в контексте посягательства на храм.
- source_word: ὑπʼ ἐκείνου
  choice: он
  rationale: Естественная русская анафора; деятель сохранён без добавочного уточнения личности.
theological_decisions:
- issue: Направленность мольбы
  choice: Не уточнять, кому непосредственно обращены мольбы
  alternative: «молитвы к Богу»
  rationale: δέησις может обозначать молитвенное прошение, однако само предложение не называет адресата; перевод не вводит отсутствующего уточнения.
- issue: Объект κατεγχειρουμένοις
  choice: 'Понять артикль и причастие как средний род: «то, что он замышлял»'
  alternative: 'Мужской род: «те, кого он нечестиво передавал»'
  rationale: Форма допускает оба рода, но значение «предпринимать/покушаться» и ближайший контекст нечестивого замысла лучше поддерживают средний род. Альтернатива отмечена в сноске как грамматически возможное понимание.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим повествованию. Синтаксис остаётся близким к греческому, но перестроен ради естественности; тире обозначает пояснение причины мольб.
