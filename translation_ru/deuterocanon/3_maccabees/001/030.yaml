base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/030.yaml
  text: 'But so that he might not become hateful to everyone by being hostile[a], he issued a written order: “But if any of them choose to conduct themselves among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: ru
  text: 'Но, чтобы своей враждебностью не навлечь на себя всеобщую ненависть, он издал письменное распоряжение: «Если же кто-нибудь из них пожелает жить среди посвящённых в обряды[a], тех он уравнивает в гражданских правах с александрийцами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди посвящённых в мистерии». В греческом тексте употреблена культовая лексика обрядового посвящения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Но, чтобы… не
  rationale: Передаёт целевое значение ἵνα и связующую, слегка противопоставительную функцию δέ естественной русской конструкцией.
- source_word: τοῖς πᾶσιν
  choice: всеобщую
  rationale: Дательный отношения при глагольной паре передан идиоматически; универсальный охват сохранён.
- source_word: ἐχθόμενος ... ἐχθαίνηται
  choice: своей враждебностью не навлечь на себя… ненависть
  rationale: Сохраняет смысловую и корневую связь между проявлением враждебности и вызванной ею ненавистью, не вынуждая неестественную русскую кальку.
- source_word: ὑπέγραψεν
  choice: издал письменное распоряжение
  rationale: В контексте официального акта глагол обозначает письменно установленное распоряжение, а не просто действие письма.
- source_word: Ἐὰν δέ τινες ἐξ αὐτῶν προαιρῶνται
  choice: Если же кто-нибудь из них пожелает
  rationale: προαιρῶνται выражает осознанный выбор или предпочтение; «пожелает» естественно звучит в формулировке распоряжения.
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  choice: среди посвящённых в обряды
  rationale: Сохраняет культовую лексику посвящения и допускает связь с мистериальными обрядами, не делая более узкое толкование обязательным.
- source_word: ἀναστρέφεσθαι
  choice: жить
  rationale: Здесь глагол охватывает образ жизни и пребывание в соответствующей среде; краткое русское «жить» естественно сохраняет эту широту.
- source_word: τούτους ἰσοπολίτας Ἀλεξανδρεῦσι ποιεῖ
  choice: тех он уравнивает в гражданских правах с александрийцами
  rationale: Передаёт юридический смысл ἰσοπολίτας как равенства гражданского статуса и сохраняет настоящее время формулы распоряжения.
theological_decisions:
- issue: Характер культового посвящения
  choice: «посвящённых в обряды» в основном тексте
  alternative: «посвящённых в мистерии»
  rationale: τελεταί и μεμυημένοις могут быть техническими словами мистериальных культов, однако более широкое «обряды» сохраняет культовый смысл без чрезмерного уточнения.
- issue: Соотношение враждебности и ненависти
  choice: Его враждебность вызывает всеобщую ненависть к нему
  alternative: Он сам становится ненавистным всем
  rationale: Греческие формы допускают оттенки как проявляемой враждебности, так и возникающей в ответ ненависти; русская формулировка сохраняет причинную связь и направленность реакции.
translation_notes:
  register: Современный литературный русский язык с достоинством официально-исторического повествования. Формула распоряжения ясна обычному читателю; юридический смысл гражданского равноправия и неоднозначность культовой терминологии сохранены.
