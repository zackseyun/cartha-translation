base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/012.yaml
  text: And even when the law had been read out[a], he still did not stop insisting that he ought to enter, saying, “Even if they have been deprived of this honor, I ought not to be.”
translation:
  language: ru
  text: 'И даже когда закон был зачитан, он всё равно не переставал настаивать, что должен войти, говоря: «Даже если они лишены этой чести, я не должен быть лишён этой чести»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а что до меня — не следует [быть так]». Конец греческой фразы эллиптичен.'
    reason: Русский текст по контексту восполняет подразумеваемое «быть лишённым этой чести»; сноска сохраняет синтаксическую неполноту греческого выражения.
lexical_decisions:
- source_word: τοῦ ... νόμου
  choice: закон
  rationale: В данном контексте νόμος обозначает только что приведённое иудейское законоположение, а не просто обычай.
- source_word: παραναγνωσθέντος
  choice: после того, как ему зачитали
  rationale: Причастие передаёт чтение текста перед кем-либо; добавление «ему» естественно выражает контекст, не меняя смысла.
- source_word: οὐδ᾽ ὣς ἀπέλειπεν
  choice: он всё равно продолжал
  rationale: Сочетание выражает продолжающееся действие вопреки услышанному; такая формулировка естественна по-русски.
- source_word: προφερόμενος
  choice: настаивать
  rationale: В контексте речь о настойчивом выдвижении требования или притязания.
- source_word: ἑαυτὸν δεῖν εἰσελθεῖν
  choice: что должен войти
  rationale: δεῖ выражает необходимость, которую он приписывает самому себе; русское «должен» сохраняет силу притязания.
- source_word: ἐστέρηνται
  choice: лишены
  rationale: Перфект пассива описывает их наличное состояние как лишённых данной чести.
- source_word: ταύτης τῆς τιμῆς
  choice: этой чести
  rationale: Прямой и контекстуально уместный эквивалент, передающий почётный статус допуска.
- source_word: ἐμὲ δὲ οὐ δεῖ
  choice: я не должен быть лишён её
  rationale: Греческая фраза эллиптична; по контексту восполняется сказуемое из ἐστέρηνται. Такое восполнение делает русский текст понятным, а буквальная структура отмечена в сноске.
