source:
  edition: lxx-swete-1909
  text: διακομισθεὶς δὲ εἰς Ἰεροσόλυμα, καὶ θύσας τῷ πιστῷ θεῷ καὶ χάριτας ἀποδιδοὺς καὶ τῶν ἑξῆς τι τῷ τόπῳ ποιήσας, καὶ δὴ παραγενόμενος εἰς τὸν τόπον καὶ τῇ σπουδαιότητι καὶ εὐσεβείᾳ καταπληγείς,
  language: Greek
  pages: []
  confidence: high
base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/009.yaml
  text: Then[a], after being conveyed to Jerusalem, and after sacrificing to the faithful God and offering thanks, and after doing something further for the place, indeed, when he came to the place and was struck with awe by its dignity and piety[c][b],
translation:
  language: ru
  text: Доставленный же в Иерусалим, он принёс жертву верному Богу[a], воздал благодарение и сделал для этого места ещё нечто[c]; прибыв на это место[b] и будучи поражён его достоинством и благочестием,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Богу, достойному доверия». Греческое прилагательное может означать верность или надёжность; «верному» — наиболее прямой перевод.'
    reason: lexical_alternative
  - marker: b
    text: То есть священное место в Иерусалиме, вероятно храмовая территория. В греческом тексте сказано просто «место».
    reason: cultural_note
  - marker: c
    text: 'Выражение «сделал для этого места ещё нечто» в греческом тексте неопределённо: какое именно действие имеется в виду, не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακομισθεὶς
  choice: когда его доставили
  rationale: Пассивная форма передаёт перемещение в Иерусалим, а не просто прибытие; конструкция с личной формой естественнее для современного русского языка.
- source_word: θύσας
  choice: принёс жертву
  rationale: Передаёт культовое значение глагола и естественно звучит по-русски.
- source_word: τῷ πιστῷ θεῷ
  choice: верному Богу
  rationale: Сохраняет прямое значение πιστός — «верный, заслуживающий доверия» — без истолкования как «истинный».
- source_word: χάριτας ἀποδιδοὺς
  choice: воздал благодарность
  rationale: Отражает значение возвращения или воздаяния благодарности и сохраняет возвышенный, но понятный регистр.
- source_word: τῶν ἑξῆς τι
  choice: ещё нечто
  rationale: Сохраняет намеренную неопределённость τι и значение дополнительного действия, не уточняя его содержания.
- source_word: τῷ τόπῳ ποιήσας
  choice: сделал ... для этого места
  rationale: Сохраняет широкое значение ποιέω и дательный отношения, не конкретизируя неизвестное действие.
- source_word: τὸν τόπον
  choice: это место
  rationale: Греческий текст говорит именно о «месте», хотя контекст указывает на иерусалимскую святыню.
- source_word: τῇ σπουδαιότητι
  choice: достоинством
  rationale: Передаёт торжественную значимость и внушительность священного места без сведения смысла только к внешнему великолепию.
- source_word: εὐσεβείᾳ
  choice: благочестием
  rationale: Прямо передаёт религиозное значение εὐσέβεια, сохраняя несколько необычное соотнесение качества с местом.
- source_word: καταπληγείς
  choice: поразившись
  rationale: Передаёт сильное впечатление и потрясение; благоговейный оттенок возникает из контекста, а не добавляется в сам глагол.
theological_decisions:
- issue: Значение πιστός применительно к Богу
  choice: верному Богу
  alternative: Богу, достойному доверия; истинному Богу
  rationale: «Верному» непосредственно отражает греческое прилагательное и не подменяет его богословски более определённым словом «истинному».
- issue: Что обозначает «место»
  choice: место
  alternative: храм; святилище; храмовая территория
  rationale: Контекст, вероятно, указывает на храм или его территорию, однако τόπος остаётся намеренно общим обозначением, что сохранено в основном тексте.
- issue: Синтаксическая незавершённость стиха
  choice: сохранено продолжение фразы посредством конструкции «Когда же… то… и поразившись…» и конечной запятой
  alternative: превратить причастные обороты в самостоятельное законченное предложение
  rationale: Греческий стих представляет собой часть продолжающегося периода. Завершение мысли внутри стиха искусственно изменило бы его синтаксическую связь со следующим текстом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранены повтор слова «место», неопределённость дополнительного действия и синтаксическая незавершённость стиха, переходящего в следующий контекст.
