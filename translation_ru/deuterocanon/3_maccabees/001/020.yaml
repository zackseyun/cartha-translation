base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/020.yaml
  text: And the mothers and nurses besides these[a], leaving behind the newborn children, some in their houses and others in the streets[b], kept gathering without turning back to the all-supreme sanctuary.
translation:
  language: ru
  text: Помимо них, матери и кормилицы, оставив новорождённых детей — одни дома, другие на улицах, — не оглядываясь, стекались в святилище, превознесённое превыше всего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к высочайшему храму»; греческое выражение подчёркивает исключительное величие святилища.'
    reason: Лексическая альтернатива для усиленного πανυπέρτατον и допускающего значения «храм» или «святилище» слова ἱερόν.
lexical_decisions:
- source_word: νεογνά τῶν τέκνων
  choice: новорождённых детей
  rationale: Передаёт младенческий возраст и сохраняет эмоциональную силу сцены, не сужая значение до строго медицинского смысла.
- source_word: τιθηνοί
  choice: кормилицы
  rationale: Греческое слово обозначает женщин, ухаживающих за младенцами, нередко именно кормящих грудью; «кормилицы» естественно и конкретно передаёт этот смысл.
- source_word: πρὸς τούτοις
  choice: бывшие с ними
  rationale: Оборот связывает матерей и кормилиц с ранее названными людьми; такая передача естественнее буквального «при этих» и не уточняет связь сверх текста.
- source_word: παραλείπουσαι
  choice: оставив
  rationale: Нейтрально передаёт оставление детей позади в спешке, не внося дополнительной нравственной оценки, присущей слову «бросив».
- source_word: ἄλλως καὶ ἄλλως ... αἱ μὲν ... αἱ δὲ
  choice: одни ... другие ...
  rationale: Распределительная конструкция далее поясняется местами, где были оставлены дети; русская пара «одни — другие» ясно воспроизводит её.
- source_word: ἀγυιάς
  choice: улицах
  rationale: Обозначает городские улицы или дороги; «улицах» — ясный современный эквивалент.
- source_word: ἀνεπιστρέπτως
  choice: не оглядываясь
  rationale: Сохраняет образ движения без поворота назад и естественно выражает решительную устремлённость к святилищу.
- source_word: πανυπέρτατον
  choice: превознесённому превыше всего
  rationale: Передаёт усиленную превосходную степень сложного греческого прилагательного и избегает превращения его в неявный божественный титул.
- source_word: ἱερόν
  choice: святилищу
  rationale: Может обозначать храм или священную храмовую территорию; «святилище» сохраняет эту широту.
- source_word: ἠθροίζοντο
  choice: стекались
  rationale: Имперфект описывает продолжающееся коллективное движение и собирание; «стекались» естественно совмещает оба оттенка.
theological_decisions:
- issue: Передача πανυπέρτατον ἱερόν
  choice: превознесённому превыше всего святилищу
  alternative: высочайшему храму
  rationale: Выбранная формулировка сохраняет необычную усиленную риторику πανυπέρτατον, не превращая определение святилища в титул Бога и не сужая ἱερόν до конкретного здания.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным повествовательным звучанием. Тире разграничивают распределительные группы и облегчают чтение длинного греческого периода.
