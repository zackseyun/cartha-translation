  text: But since you were pleased to set your glory among your people Israel, you sanctified this place.
translation:
  language: ru
  text: Но поскольку Тебе было угодно, чтобы слава Твоя была среди народа Твоего, Израиля, Ты освятил это место.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ᾽
  choice: Но
  rationale: Передаёт противопоставление предшествующему контексту прямо и естественно.
- source_word: ἐπεὶ
  choice: поскольку
  rationale: В данном месте союз имеет причинное значение и вводит основание последующего утверждения.
- source_word: εὐδόκησας
  choice: Ты благоволил
  rationale: Передаёт благосклонную волю и одобрение, сохраняя возвышенный молитвенный регистр.
- source_word: τὴν δόξαν σου ἐν τῷ λαῷ σου Ἰσραήλ
  choice: чтобы Твоя слава пребывала среди Твоего народа Израиля
  rationale: Греческая конструкция с εὐδοκέω эллиптична. Русское придаточное естественно выражает подразумеваемое волеизъявление; «пребывала» осторожно передаёт нахождение славы ἐν народе, не сводя δόξα к репутации.
- source_word: ἡγίασας
  choice: Ты освятил
  rationale: Точно сохраняет язык святости и сакрального отделения, выраженный глаголом ἁγιάζω.
- source_word: τὸν τόπον τοῦτον
  choice: это место
  rationale: Следует общему значению τόπος и не подменяет его более узким словом «святилище».
theological_decisions:
- issue: Передача присутствия Божьей славы среди Израиля
  choice: чтобы Твоя слава пребывала среди Твоего народа Израиля
  alternative: поместить Свою славу среди Твоего народа Израиля
  rationale: В греческом тексте нет явного глагола «поместить». Формулировка с «пребывала» сохраняет эллиптичность исходной мысли и идею присутствия славы, не утверждая конкретного способа её водворения.
- issue: Передача культового языка святости применительно к месту
  choice: Ты освятил это место
  alternative: Ты посвятил это место
  rationale: «Освятил» непосредственно передаёт ἁγιάζω и сохраняет богословскую категорию святости; «посвятил» могло бы чрезмерно сузить смысл до обряда посвящения.
translation_notes:
  register: Современный литературный русский язык с dignified молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис сделан естественным для русского языка, при этом причинная связь и сакральная лексика греческого текста сохранены.
