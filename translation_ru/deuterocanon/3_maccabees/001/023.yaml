  yaml_path: translation/deuterocanon/3_maccabees/001/023.yaml
  text: But when they cried out to make a rush for the weapons, and to die courageously under the ancestral law, they caused considerable turmoil in the place, and only with difficulty by the old men and the elders
translation:
  language: ru
  text: Но они воскликнули, что бросятся к оружию[b] и мужественно умрут за Закон предков[c]. Тем самым они вызвали там немалое волнение, и лишь с трудом — старцами и старейшинами…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный греческий текст обрывается после слов «старцами и старейшинами». Поэтому незавершённость предложения сохранена, а отсутствующее продолжение не восполняется.
    reason: textual_variant
  - marker: b
    text: 'Или: «бросятся к оружию», то есть устремятся, чтобы завладеть им.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «умрут из-за Закона предков» или «умрут, оставаясь верными Закону предков». Греческий оборот допускает разные оттенки связи смерти с унаследованным Законом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: громко призвали
  rationale: Причастие обозначает громкий возглас, побуждающий к последующим действиям; такой перевод естественно передаёт и голосовое действие, и призыв.
- source_word: τὴν ὁρμὴν ... ποιήσασθαι
  choice: устремиться
  rationale: Выражение описывает стремительный порыв или бросок; глагол сохраняет динамику, не уточняя сверх текста, было ли это нападением.
- source_word: ἐπὶ τὰ ὅπλα
  choice: к оружию
  rationale: При обозначении порыва ἐπί указывает на движение к цели, вероятно с намерением завладеть оружием.
- source_word: θαρραλέως
  choice: мужественно
  rationale: Передаёт стойкую храбрость перед лицом смерти и соответствует возвышенному повествовательному регистру.
- source_word: ὑπὸ τοῦ πατρῴου νόμου
  choice: за отеческий Закон
  rationale: В данном сжатом обороте ὑπό наиболее естественно выражает смерть из верности унаследованному Закону; вариант не снимает неоднозначность, которая отмечена в сноске.
- source_word: τελευτᾷν
  choice: умереть
  rationale: Прямой и нейтральный эквивалент инфинитива со значением окончания жизни.
- source_word: ἱκανὴν ... τραχύτητα
  choice: немалое смятение
  rationale: Буквальное «шероховатость/суровость» здесь обозначает серьёзное волнение или столкновение; «смятение» естественно в контексте происходящего.
- source_word: μόλις
  choice: лишь с трудом
  rationale: Сохраняет значение действия, совершённого с большим трудом, не восполняя отсутствующее продолжение.
- source_word: γεραιῶν
  choice: стариками
  rationale: Обозначает людей преклонного возраста и сохраняет отличие от следующего πρεσβυτέρων.
- source_word: πρεσβυτέρων
  choice: старейшинами
  rationale: Передаёт вероятный статус признанных старших или руководителей общины и отличает их от просто пожилых людей.
theological_decisions:
- issue: Передача πατρῷος νόμος
  choice: отеческий Закон
  alternative: Закон предков; унаследованный Закон
  rationale: Формулировка обозначает полученный от предков иудейский Закон и связанную с ним верность, не вводя позднейшей конфессиональной терминологии.
- issue: Значение ὑπὸ τοῦ πατρῴου νόμου
  choice: умереть за отеческий Закон
  alternative: умереть, оставаясь под властью отеческого Закона; умереть из-за отеческого Закона
  rationale: Контекст поддерживает смысл готовности умереть из верности Закону, однако предлог допускает более буквальное понимание «под властью»; неоднозначность сохранена в сноске.
- issue: Незавершённость предоставленного греческого текста
  choice: не восполнять отсутствующее сказуемое и обозначить обрыв многоточием
  alternative: восстановить продолжение по иной редакции или переводу
  rationale: Источник заканчивается на зависимом обороте и синтаксически требует продолжения. Вставка отсутствующих слов была бы недоказанным дополнением.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. «Отеческий Закон» сохраняет связь с предками и особый статус Закона; прописная буква помогает избежать общего значения любого обычая или законодательства. «Старики» и «старейшины» намеренно разведены лексически. Незавершённость исходного фрагмента обозначена тире и многоточием.
