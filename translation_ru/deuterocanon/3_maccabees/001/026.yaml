  text: But after becoming emboldened and having by now sent everyone away, he was already making his approach, thinking to bring the matter spoken of before to completion.
translation:
  language: ru
  text: Но, осмелев и уже отослав всех, он уже приближался, полагая довести до конца то, о чём говорилось прежде.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρασυνθεὶς
  choice: осмелев
  rationale: Краткое деепричастие передаёт предшествующее основному действию обретение смелости и допускает контекстуальный оттенок дерзости, не усиливая его до прямой «наглости».
- source_word: πάντας παραπέμψας
  choice: отослав всех
  rationale: Оборот естественно передаёт удаление всех присутствовавших; глагол «отослать» сохраняет идею распоряжения уйти и не уточняет без основания, были ли это слуги или сопровождающие.
- source_word: πρόσβασιν ... ἐποιεῖτο
  choice: стал приближаться
  rationale: Греческое сочетание буквально описывает совершение подхода или продвижения. Русский глагольный оборот естественно выражает начавшееся и разворачивавшееся приближение.
- source_word: τέλος ἐπιθήσειν
  choice: довести до конца
  rationale: Идиома означает завершить или осуществить начатое, а не прекратить его; русский оборот сохраняет эту направленность.
- source_word: τῷ προειρημένῳ
  choice: то, о чём говорилось прежде
  rationale: Субстантивированное причастие отсылает к ранее сказанному без названия конкретного «дела» или «замысла», поэтому перевод сохраняет неопределённость оригинала.
