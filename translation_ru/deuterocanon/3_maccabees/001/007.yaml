  text: Сделав это и раздав дары святилищам, он ободрил тех, кто находился под его властью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας δὲ τοῦτο
  choice: Сделав это
  rationale: Аористное причастие передаёт действие, предшествующее главному; краткая русская конструкция естественно сохраняет последовательность.
- source_word: τοῖς τεμένεσι
  choice: святилищам
  rationale: τέμενος обозначает освящённое место или священный участок; «святилища» не сужает значение до храмового здания.
- source_word: δωρεὰς ἀπονείμας
  choice: раздав дары
  rationale: Сочетание выражает распределение или пожалование даров; выбранная формулировка ясна и не придаёт дарам более узкого культового смысла.
- source_word: εὐθαρσεῖς
  choice: ободрил
  rationale: В сочетании с κατέστησεν прилагательное описывает приведённость людей в состояние бодрости и уверенности; русский глагол естественно передаёт этот результат.
- source_word: τοὺς ὑποτεταγμένους
  choice: тех, кто находился под его властью
  rationale: Перфектное пассивное причастие обозначает людей, поставленных в подчинение; описательный оборот сохраняет смысл власти, не вводя более узкого политического термина «подданные».
- source_word: κατέστησεν
  choice: ободрил
  rationale: Здесь глагол означает приведение людей в обозначенное прилагательным состояние; по-русски значение всей конструкции естественно выражается одним переходным глаголом.
