lexical_decisions:
- source_word: κατακρατήσας
  choice: овладев положением после
  rationale: Причастие аориста κατακρατέω передаёт достижение превосходства или контроля. В сочетании с родительным τῆς ἐπιβουλῆς русское «овладев положением после заговора» естественно выражает то, что замысел был взят под контроль, не уточняя способ.
- source_word: ἐπιβουλῆς
  choice: заговора
  rationale: ἐπιβουλή обозначает враждебный замысел, козни или заговор. «Заговор» кратко и естественно в данном политическом контексте, хотя слово не обязательно подразумевает широкую организацию сообщников.
- source_word: ἔκρινεν
  choice: решил
  rationale: При инфинитиве κρίνω здесь означает принятие решения, а не судебное суждение.
- source_word: τὰς πλησίον πόλεις
  choice: соседние города
  rationale: πλησίον указывает на пространственную близость; «соседние города» — ясное и литературное соответствие.
- source_word: ἐπελθὼν
  choice: отправиться в
  rationale: Причастие означает движение к названным городам и сопутствует действию παρακαλέσαι. Русский инфинитив естественно включается в зависимую от «решил» конструкцию.
- source_word: παρακαλέσαι
  choice: обратиться к их жителям с призывом
  rationale: παρακαλέω допускает значения «призывать», «убеждать», «ободрять», «обращаться с просьбой». Формулировка сохраняет намеренно широкий характер призыва; жители подразумеваются метонимическим обозначением городов.
