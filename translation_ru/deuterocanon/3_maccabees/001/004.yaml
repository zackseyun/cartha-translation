base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/004.yaml
  text: And when the battle had become fierce and affairs were turning more strongly in Antiochus’s favor[a], Arsinoe went repeatedly among the troops and earnestly urged them, with pity and tears, her hair let down, to help themselves and their children and wives courageously, promising to give two minas of gold to each man if they won.
translation:
  language: ru
  text: Когда же битва стала ожесточённой и положение всё больше складывалось в пользу Антиоха, Арсиноя, проходя среди войск, настойчиво призывала воинов с состраданием и слезами, распустив волосы, мужественно защищать себя, своих детей и жён. Она обещала в случае победы дать каждому по две мины золота[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Мина — древняя единица веса и денежного счёта; здесь каждому воину обещаны две мины золота в случае победы.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης δὲ καρτερᾶς μάχης
  choice: Когда же битва стала ожесточённой
  rationale: Генитив абсолютный передан обстоятельственным придаточным; καρτερά указывает на тяжёлый, напряжённый характер сражения, что естественно выражается словом «ожесточённой».
- source_word: τῶν πραγμάτων μᾶλλον ἐρρωμένων τῷ Ἀντιόχῳ
  choice: положение всё больше складывалось в пользу Антиоха
  rationale: πράγματα здесь означает ход дел или положение, а ἐρρωμένων с дательным Антиоха — усиливающееся преимущество на его стороне; «всё больше» сохраняет сравнительное μᾶλλον.
- source_word: ἱκανῶς ... ἐπιπορευσαμένη τὰς δυνάμεις παρεκάλει
  choice: проходя среди войск, настойчиво призывала
  rationale: ἐπιπορεύομαι обозначает движение среди или вдоль войск и само по себе не требует значения многократности. ἱκανῶς естественно передано как усиление призыва — «настойчиво».
- source_word: μετὰ οἴκτου καὶ δακρύων
  choice: со скорбью и слезами
  rationale: οἶκτος охватывает оттенки жалости, сострадания и скорбного обращения. «Со скорбью» сохраняет эмоциональный характер сцены, не уточняя чрезмерно, испытывала ли жалость сама Арсиноя или стремилась вызвать её у воинов.
- source_word: τοὺς πλοκάμους λελυμένη
  choice: распустив волосы
  rationale: Буквально речь идёт о распущенных прядях; русское выражение естественно передаёт жест скорби и мольбы.
- source_word: βοηθεῖν ἑαυτοῖς τε καὶ τοῖς τέκνοις καὶ ταῖς γυναιξὶν θαρραλέως
  choice: мужественно защищать себя, своих детей и жён
  rationale: βοηθεῖν буквально означает «помогать, приходить на помощь», но в боевом призыве русское «защищать» яснее выражает требуемое действие. θαρραλέως передано словом «мужественно».
- source_word: ἐπαγγελλομένη δώσειν νικήσασιν ἑκάστῳ δύο μνᾶς χρυσίου
  choice: Она обещала в случае победы дать каждому по две мины золота
  rationale: 'Дательный аористного причастия νικήσασιν имеет условно-временной смысл: награда полагается победившим. ἑκάστῳ передано распределительным «каждому по», а древняя мера μνᾶ сохранена без приблизительного пересчёта.'
