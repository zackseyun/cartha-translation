  yaml_path: translation/deuterocanon/3_maccabees/001/011.yaml
  text: But when some said that this ought not to be done[a], because not even the Gentiles enter, nor all the priests, but only the high priest who is over all—and he only once a year—he would not be persuaded at all.
translation:
  language: ru
  text: Но когда некоторые сказали, что так поступать не следует[a], потому что туда не входят ни язычники, ни все священники, а только первосвященник, стоящий во главе всех, — и то лишь раз в год, — он нисколько не поддался убеждению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «так поступать не подобает». Греческое выражение подчёркивает неуместность или несоответствие должному.'
    reason: Лексическая альтернатива для μὴ καθήκειν γίνεσθαι τοῦτο.
lexical_decisions:
- source_word: μὴ καθήκειν γίνεσθαι τοῦτο
  choice: так поступать не следует
  rationale: Передаёт значение уместности и должного в καθήκειν, а в данном контексте естественно относит τοῦτο к намеренному действию.
- source_word: τοῖς ἔθνεσιν
  choice: язычники
  rationale: В контексте доступа в храм речь идёт о неиудеях, а не о народах как политических общностях.
- source_word: εἰσιέναι
  choice: входят
  rationale: Прямо передаёт вхождение в подразумеваемое священное место без добавления модального оттенка.
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: все священники
  rationale: Сохраняет собирательное противопоставление между священниками вообще и единственным первосвященником.
- source_word: μόνῳ τῷ προηγουμένῳ πάντων ἀρχιερεῖ
  choice: только первосвященник, поставленный над всеми
  rationale: «Первосвященник» является обычным соответствием ἀρχιερεύς; «поставленный над всеми» сохраняет значение положения и главенства в προηγουμένῳ πάντων.
- source_word: κατ᾽ ἐνιαυτὸν ἅπαξ
  choice: лишь раз в год
  rationale: Естественно и точно передаёт ежегодную однократность доступа.
- source_word: οὐδαμῶς ἐπείθετο
  choice: он нисколько не поддался убеждению
  rationale: Сохраняет значение «быть убеждаемым» и усилительное отрицание οὐδαμῶς, не превращая выражение просто в «отказался слушать».
theological_decisions:
- issue: Ограничение доступа в священное место
  choice: 'Сохранена последовательность аргумента: туда не входят язычники и не все священники; входит только первосвященник, и лишь раз в год.'
  alternative: Передать это обобщённо как запрет или незаконность действия без перечисления уровней доступа.
  rationale: Греческий текст обосновывает возражение именно установленным порядком культового доступа; перевод сохраняет эту структуру без позднейших богословских пояснений.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Подразумеваемое место входа передано словом «туда», чтобы фраза естественно звучала по-русски; формулировка не добавляет модального «разрешено».
