lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  choice: Но большинство из них
  rationale: Передаёт значение большинства; δέ выражает противопоставление ранее упомянутой группе.
- source_word: γενναίᾳ ψυχῇ ἐνίσχυσαν
  choice: укрепившись благородным духом
  rationale: Сохраняет образ внутреннего укрепления и благородной, мужественной решимости, не превращая ψυχή в технический термин «душа».
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: не отступили от благочестия
  rationale: διίστημι с родительным означает удаление или отступление, а εὐσέβεια здесь обозначает благоговейную верность Богу.
- source_word: τὰ τε χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: отдавая даже своё имущество ради сохранения жизни
  rationale: χρήματα — имущество или средства; τε подчёркивает «даже»; περὶ τοῦ ζῇν указывает на сохранение жизни, а причастие выражает средство или сопутствующее действие.
- source_word: ἀδέως
  choice: бесстрашно
  rationale: Передаёт действие без страха и чуть точнее сохраняет прямое значение наречия, чем более общее «смело».
- source_word: ἐτιμῶντο
  choice: старались
  rationale: Форма в данном контексте трудна; перевод передаёт вероятный практический смысл целенаправленного стремления, не утверждая сомнительную точную реконструкцию.
- source_word: ἑαυτοὺς ῥύσασθαι
  choice: избавить себя
  rationale: Передаёт возвратное значение и смысл освобождения или спасения от навязанной процедуры.
- source_word: ἐκ τῶν ἀπογραφῶν
  choice: от внесения в списки
  rationale: ἀπογραφαί обозначает официальную регистрацию или внесение в учётные списки; русский оборот естественен и не создаёт ошибочного впечатления о современной переписи населения.
theological_decisions:
- issue: Значение εὐσέβεια в иудейском контексте преследования
  choice: благочестие
  alternative: преданность Богу; богопочитание
  rationale: «Благочестие» охватывает почтение к Богу и верность религиозному образу жизни, не внося поздней конфессиональной терминологии.
- issue: Передача трудной конструкции с ἐτιμῶντο
  choice: бесстрашно старались избавить себя
  alternative: бесстрашно считали нужным избавить себя; поставили себе целью избавиться
  rationale: Передаётся вероятный смысл деятельного стремления к освобождению, но трудность дошедшего греческого текста открыто отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Синтаксис сделан естественным, но сохранены противопоставление, частица «даже», множественный образ официальных списков и смысловая неопределённость трудной заключительной конструкции.
