  source_fidelity: 'Основные смысловые компоненты переданы верно: большинство сохраняет верность благочестию, жертвует имуществом ради жизни и пытается избежать официального внесения в списки. Однако «укрепившись благородным духом» по-русски неестественно и не вполне ясно передаёт γενναίᾳ ψυχῇ ἐνίσχυσαν; «избавить себя» в данном управлении также звучит ненормативно/тяжеловесно.'
