  terminology: «Благочестие» — удачная, нейтральная передача εὐσέβεια. «Внесение в списки» удачно передаёт ἀπογραφαί как административную процедуру и не навязывает значение современной переписи. Трудность ἐτιμῶντο должна оставаться отмеченной в сноске; «старались» допустимо как вероятностная идиоматическая передача, а не как точное лексическое соответствие.
