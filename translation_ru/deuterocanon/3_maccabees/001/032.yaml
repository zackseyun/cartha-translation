  yaml_path: translation/deuterocanon/3_maccabees/001/032.yaml
  text: But most of them[a] took courage with a noble spirit, did not depart from piety[c][b], exchanging even their possessions for life, and boldly sought to rescue themselves from the registrations.
translation:
  language: ru
  text: Но большинство из них, проявив благородство духа, не отступили от благочестия и, обменивая даже своё имущество на возможность сохранить жизнь, бесстрашно старались избавиться от внесения в списки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Греческая фраза в конце стиха, особенно форма ἐτιμῶντο, трудна для истолкования. Перевод передаёт вероятный смысл: они бесстрашно добивались освобождения от официального внесения в списки; речь не обязательно идёт о переписи населения в современном смысле.'
