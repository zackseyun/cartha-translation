  - marker: b
    text: Редкое греческое слово может также означать то, что проклято или обречено на уничтожение, а в более широком смысле — отвратительные вещи.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεπατήσαμεν
  choice: мы попрали
  rationale: «Попрали» сохраняет конкретный и сильный образ хождения ногами и одновременно естественно передаёт подразумеваемое осквернение святыни.
- source_word: τὸν οἶκον τοῦ ἁγιασμοῦ
  choice: дом святости
  rationale: Буквальная структура «дом святости» сохраняет почтительное обозначение храма и риторический контраст; более привычное «святилище» дано как поясняющий вариант в сноске.
- source_word: ὡς καταπατοῦνται
  choice: как попираются
  rationale: 'Настоящее время и страдательный залог сохранены: сравнение описывает то, как обычно поступают с подобными домами.'
- source_word: τῶν προσολοθρευμάτων
  choice: мерзостей
  rationale: Редкое слово, вероятно, обозначает нечто отвратительное, проклятое либо обречённое на уничтожение. «Мерзостей» передаёт резко отрицательную культовую окраску, а неопределённость отмечена в сноске.
theological_decisions:
- issue: Насколько явно отождествлять священное здание с храмом
  choice: дом святости
  alternative: святилище; святой дом; храм
  rationale: Греческий текст не употребляет обычное слово «храм», а называет здание «домом святости». Сохранение образа не устраняет заложенную в нём связь со святилищем.
- issue: Смысл редкого слова προσολοθρευμάτων
  choice: мерзостей
  alternative: того, что обречено на уничтожение; проклятых вещей; отвратительных вещей
  rationale: Контекст противопоставляет святой дом домам, связанным с нечистым или проклятым. Основной вариант передаёт эмоциональную и культовую силу слова, не закрепляя в тексте его возможный технический смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной буквальностью. «Попрали» и «дом святости» имеют возвышенную библейскую окраску, но остаются понятными; синтаксический параллелизм оригинала сохранён.
