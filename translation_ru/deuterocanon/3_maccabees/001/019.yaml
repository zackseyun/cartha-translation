  text: We trampled the house of holiness[b][a], as the houses of abominations are trampled.
translation:
  language: ru
  text: Мы попрали дом святости[a], как попираются дома мерзостей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилище», «святой дом». Буквально: «дом освящения».'
