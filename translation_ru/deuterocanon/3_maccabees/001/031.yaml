  yaml_path: translation/deuterocanon/3_maccabees/001/031.yaml
  text: But some, lightly despising the supports of the city's piety, readily gave themselves over, as though they would share in some great renown from the association with the king that was to come.
translation:
  language: ru
  text: Некоторые же, легкомысленно презрев опоры городского благочестия[a], охотно сдавались, словно им предстояло приобщиться к некой великой славе благодаря будущему общению с царём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «основания городского благочестия». В греческом тексте употреблена метафора поддерживающих конструкций.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благодаря предстоящей близости к царю». Греческое слово может обозначать общение, совместное пребывание или социальную связь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  choice: некоторые
  rationale: Передаёт неопределённое указание на часть жителей и сохраняет противопоставление остальным.
- source_word: ἐπιπολαίως
  choice: легкомысленно
  rationale: Выражает поверхностное и неосмотрительное отношение; в данном контексте естественно сочетается с деепричастием «презрев».
- source_word: στυγοῦντες
  choice: презрев
  rationale: Передаёт сильное неодобрительное отвержение, не сводя значение исключительно к эмоциональной ненависти.
- source_word: τὰς τῆς πόλεως εὐσεβείας ἐπιβάθρας
  choice: опоры благочестия города
  rationale: Сохраняет метафору поддерживающих конструкций и не конкретизирует, какие именно городские установления имеются в виду.
- source_word: εὐσεβείας
  choice: благочестия
  rationale: Обозначает почтительное религиозное благоговение в эллинистическом иудейском контексте, не привнося поздней конфессиональной терминологии.
- source_word: εὐχερῶς
  choice: охотно
  rationale: В сочетании с добровольной передачей себя подчёркивает готовность и отсутствие сопротивления.
- source_word: ἑαυτοὺς ἐδίδοσαν
  choice: отдали себя
  rationale: Сохраняет возвратный смысл и добровольность действия, не добавляя прямо не названного адресата.
- source_word: ὡς
  choice: словно
  rationale: Передаёт субъективное ожидание этих людей, а не утверждение рассказчика о действительном результате.
- source_word: μεγάλης τινὸς ... εὐκλείας
  choice: к великой славе
  rationale: «Слава» естественно передаёт добрую известность и высокий общественный почёт; неопределённость τινός в русском контексте достаточно выражена качественной конструкцией без тяжеловесного «некой».
- source_word: κοινωνήσοντες
  choice: им предстояло приобщиться
  rationale: Передаёт будущую перспективу участия в ожидаемой славе.
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: благодаря будущему общению с царём
  rationale: Сохраняет причинно-источниковое значение ἀπό, будущность ἐσομένης и достаточно широкое социальное значение συναναστροφῆς.
theological_decisions:
- issue: Передача εὐσέβεια в иудейском гражданско-религиозном контексте
  choice: благочестие
  alternative: набожность; почитание Бога; религия
  rationale: «Благочестие» сохраняет религиозную серьёзность и общественную укоренённость понятия, не сужая его до личной набожности и не расширяя до религии как системы.
- issue: Характер ожидаемой εὐκλεία
  choice: слава
  alternative: добрая молва; известность; почёт
  rationale: Контекст говорит об общественном престиже от близости к царю, а не о божественной славе; само слово «слава» в русском допускает этот социальный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис умеренно формальный; сохранены метафора «опор», субъективность ожидания через «словно» и неопределённость характера будущего общения с царём.
