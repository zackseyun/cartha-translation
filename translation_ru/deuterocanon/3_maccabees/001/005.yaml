lexical_decisions:
- source_word: συνέβη
  choice: случилось
  rationale: Сохраняет безличную повествовательную формулу греческого текста и естественно звучит по-русски.
- source_word: ἀντιπάλους
  choice: противники
  rationale: Передаёт участников противоборствующей стороны, не сужая значение до собирательного «враг».
- source_word: ἐν χειρονομίαις
  choice: в рукопашных схватках
  rationale: В данном военном контексте выражение обозначает бой на близком расстоянии; буквальное упоминание движений рук по-русски было бы непонятно.
- source_word: διαφθαρῆναι
  choice: были уничтожены
  rationale: Сохраняет страдательную конструкцию и широкий смысл гибельного исхода в бою, не подменяя глагол более узким «были убиты».
- source_word: πολλοὺς
  choice: многие
  rationale: Прямая и естественная передача количественного определения.
- source_word: δοριαλώτους
  choice: в плен
  rationale: Греческое слово буквально описывает захваченных копьём и служит военным обозначением пленников; в основном тексте это естественно передано выражением «взяты в плен», а образ копья пояснён в сноске.
- source_word: συλλημφθῆναι
  choice: были взяты
  rationale: Передаёт страдательный инфинитив со значением захвата и образует естественное русское сочетание «были взяты в плен».
