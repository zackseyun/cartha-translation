base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/002.yaml
  text: But a certain Theodotus[a], having planned to carry out the plot, took the best of the Ptolemaic weapons that had been assigned to him and was conveyed by night to Ptolemy’s tent, to kill him himself and in this way bring the war to an end.
translation:
  language: ru
  text: Некий Феодот, задумав осуществить заговор, взял лучшее из назначенного ему птолемеевского оружия и ночью был доставлен к шатру Птолемея, чтобы самому убить его[a] и тем самым положить конец войне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы убить его самому»; греческое μόνος подчёркивает, что Феодот намеревался сам совершить убийство.'
    reason: Уточнено грамматическое значение μόνος, которое относится к Феодоту, а не к Птолемею.
lexical_decisions:
- source_word: ἐκπληρῶσαι τὴν ἐπιβουλήν
  choice: осуществить заговор
  rationale: Сочетание обозначает приведение в исполнение враждебного замысла; «осуществить заговор» естественно передаёт намеренное покушение, не добавляя деталей.
- source_word: διανοηθείς
  choice: задумав
  rationale: Причастие передаёт обдуманное намерение; «задумав» сохраняет и мысленное решение, и повествовательную сжатость.
- source_word: τῶν προυποτεταγμένων αὐτῷ ὅπλων Πτολεμαικῶν τὰ κράτιστα
  choice: лучшее из назначенного ему птолемеевского оружия
  rationale: Переданы превосходная степень τὰ κράτιστα, предварительное назначение оружия Феодоту и определение Πτολεμαικῶν без излишней конкретизации его происхождения.
- source_word: διεκομίσθη
  choice: был доставлен
  rationale: 'Страдательная форма сохранена: текст скорее говорит о транспортировке или препровождении Феодота, а не просто о его самостоятельном прибытии.'
- source_word: νύκτωρ
  choice: ночью
  rationale: Естественный современный русский эквивалент наречия времени.
- source_word: σκηνήν
  choice: шатру
  rationale: В военном контексте «шатёр» точно и стилистически уместно обозначает палатку правителя или военачальника.
- source_word: ὡς μόνος κτεῖναι αὐτόν
  choice: чтобы самому убить его
  rationale: ὡς с инфинитивом передаёт цель или намерение; μόνος наиболее естественно относится к Феодоту и подчёркивает, что убийство должен совершить он сам. Альтернативное синтаксическое понимание отмечено в сноске.
- source_word: ἐν τούτῳ διαλῦσαι τὸν πόλεμον
  choice: и тем самым положить конец войне
  rationale: 'Идиоматично передаёт предполагаемое средство и результат: убийством Птолемея завершить войну.'
