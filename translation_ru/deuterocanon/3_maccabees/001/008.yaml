- from: Когда же иудеи послали к нему представителей совета старейшин[a] и старейшин, чтобы приветствовать его, принести дары гостеприимства[b] и выразить радость по поводу случившегося, он ещё сильнее возжелал как можно скорее прийти к ним.
  to: Когда же иудеи направили к нему от совета старейшин[a] и от старейшин посланцев, чтобы приветствовать его, принести дары гостеприимства[b] и порадоваться случившемуся, он ещё больше захотел как можно скорее прийти к ним.
