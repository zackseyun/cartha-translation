  yaml_path: translation/deuterocanon/3_maccabees/001/008.yaml
  text: But when the Jews had sent to him[a], from the council of elders and the elders, men to greet him, bring gifts of hospitality, and rejoice over what had happened[b], it happened that he became all the more eager to come to them as quickly as possible.
translation:
  language: ru
  text: Когда же иудеи направили к нему от совета старейшин[a] и от старейшин посланцев, чтобы приветствовать его, принести дары гостеприимства[b] и порадоваться случившемуся, он ещё больше захотел как можно скорее прийти к ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сената». Греческое слово γερουσία обозначает официальный совет старейшин.'
    reason: lexical_alternative
  - marker: b
    text: «Дары гостеприимства» — подарки, преподносимые при приёме или в знак почтения гостю.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεμψαμένων
  choice: послали
  rationale: Генитив абсолютный обозначает предшествующее действие иудеев; «послали» естественно передаёт отправку представителей.
- source_word: γερουσίας
  choice: совета старейшин
  rationale: Термин обозначает институциональный орган старейшин; этот вариант понятен современному читателю и не придаёт ему излишне римского оттенка слова «сенат».
- source_word: πρεσβυτέρων
  choice: старейшин
  rationale: Сохранено отличие отдельных старейшин от названного перед этим совета как учреждения.
- source_word: τοὺς ἀσπασομένους αὐτὸν
  choice: чтобы приветствовать его
  rationale: Инфинитивная конструкция естественно выражает цель отправки представителей и передаёт основное значение причастия.
- source_word: ξένια
  choice: дары гостеприимства
  rationale: Передаёт не просто подарки, а дары, связанные с приёмом и почитанием гостя.
- source_word: κομιοῦντας
  choice: принести
  rationale: В контексте представители доставляют царю дары; «принести» звучит естественно.
- source_word: ἐπὶ τοῖς συμβεβηκόσιν
  choice: по поводу случившегося
  rationale: Сохраняет общий характер указания на недавние события, не уточняя их сверх греческого текста.
- source_word: χαρησομένους
  choice: выразить радость
  rationale: В контексте официального посольства выражение передаёт намерение посланников разделить и засвидетельствовать радость по поводу событий.
- source_word: συνέβη μᾶλλον αὐτὸν προθυμηθῆναι
  choice: он ещё сильнее возжелал
  rationale: Передаёт наступивший результат и усиленную готовность или желание; громоздкое буквальное «случилось, что» в русском опущено ради естественности без утраты смысла.
- source_word: ὡς τάχιστα
  choice: как можно скорее
  rationale: Точно и естественно передаёт идиому предельной срочности.
- source_word: πρὸς αὐτοὺς παραγενέσθαι
  choice: прийти к ним
  rationale: Прямо передаёт прибытие к иудеям, не добавляя отсутствующих в тексте деталей.
