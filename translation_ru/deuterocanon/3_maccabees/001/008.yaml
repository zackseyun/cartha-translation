    rationale: Греческое ἀπὸ τῆς γερουσίας καὶ τῶν πρεσβυτέρων указывает, что посланцы направлены от совета и от старейшин. Повторение предлога «от» делает это ясным по-русски.
  - severity: low
    issue: «Выразить радость» ограничивает значение χαρησομένους.
    rationale: Причастие означает, что посланцы должны были радоваться по поводу произошедшего; текст не уточняет, что речь именно о формальном выражении радости.
  - severity: low
