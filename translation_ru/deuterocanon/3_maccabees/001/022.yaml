lexical_decisions:
- source_word: σύν τε τούτοις
  choice: Вместе с ними и
  rationale: Передаёт присоединительное значение оборота и естественно связывает эту группу с ранее названными.
- source_word: οἱ περὶ τῶν πολιτῶν θρασυνθέντες
  choice: те, кто набрался смелости в том, что касалось сограждан
  rationale: 'Передаёт значение θρασυνθέντες — «стали смелее, осмелели» — и сохраняет неоднозначность περὶ τῶν πολιτῶν: речь может идти как о сфере их решимости, так и о выступлении в защиту сограждан.'
- source_word: οὐκ ἠνείχοντο
  choice: уже не могли терпеть
  rationale: Естественно передаёт длительную невозможность или отказ мириться с происходящим, выраженные имперфектом.
- source_word: τέλεον αὐτοῦ ἐπικειμένου
  choice: когда он упорно настаивал на своём
  rationale: Передаёт продолжительный сильный нажим ἐπικειμένου и усиление τέλεον; «на своём» естественно восполняет не названный прямо предмет настояния без его конкретизации.
- source_word: τὸ τῆς προθέσεως ἐκπληροῦν διανοουμένου
  choice: намеревался осуществить задуманное
  rationale: Сохраняет сочетание обдуманного намерения и стремления исполнить принятый замысел, избегая тяжеловесного буквального оборота.
