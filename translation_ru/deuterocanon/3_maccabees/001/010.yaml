  text: And when he had marveled also at the good order of the sanctuary[a], he considered making plans to enter the temple.
translation:
  language: ru
  text: Подивившись также стройному порядку в храмовом комплексе[a], он стал обдумывать, как ему войти в сам храм.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь употреблены два разных слова: ἱερόν — весь священный храмовый комплекс, а ναός — собственно здание храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμάσας
  choice: подивившись
  rationale: Аористное причастие обозначает действие, предшествующее основной мысли героя; «подивившись» передаёт восхищённое удивление без оттенка потрясения.
- source_word: εὐταξίαν
  choice: порядку
  rationale: Слово обозначает хорошую, должную упорядоченность. В данном контексте краткое «порядку» естественно по-русски и сохраняет положительную оценку.
- source_word: ἱεροῦ
  choice: храмовом комплексе
  rationale: Ἱερόν здесь обозначает всё священное храмовое пространство, в отличие от ναός далее, то есть собственно здания храма.
- source_word: ἐνεθυμήθη
  choice: задумался
  rationale: Глагол выражает внутреннее размышление и не требует понимать мысль как уже принятое твёрдое решение.
- source_word: βουλεύσασθαι
  choice: не войти ли ему
  rationale: Русская вопросительная конструкция при «задумался» естественно передаёт обдумывание и колебание, выраженные инфинитивом βουλεύσασθαι, не превращая их в окончательное решение.
- source_word: ναὸν
  choice: сам храм
  rationale: Ναός обозначает собственно храмовое здание, в отличие от более широкого ἱερόν; «сам» ясно и естественно подчёркивает это пространственное различие.
- source_word: εἰσελθεῖν
  choice: войти
  rationale: Прямой и естественный эквивалент греческого инфинитива движения.
theological_decisions:
- issue: Различение ἱερόν и ναός в одном стихе
  choice: ἱερόν передано как «храмовый комплекс», а ναός — как «сам храм»
  alternative: Передать оба слова как «храм» либо использовать «святилище» для ἱερόν
  rationale: Два греческих слова обозначают разные по охвату священные пространства. Выбранные соответствия показывают движение от всего храмового комплекса к собственно храмовому зданию; слово «святилище» по-русски могло бы ошибочно восприниматься как более внутренняя часть.
- issue: Степень решимости героя
  choice: «задумался, не войти ли»
  alternative: «решил войти» или «задумал войти»
  rationale: Сочетание ἐνεθυμήθη и βουλεύσασθαι указывает на внутреннее обдумывание. Перевод не представляет намерение уже принятым решением и сохраняет повествовательное напряжение.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Причастный оборот сохраняет последовательность действий, а конструкция «не войти ли» естественно передаёт ещё не завершённое обдумывание.
