base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/003.yaml
  text: Dositheus[a], the one called son of Drimylus, a Jew by birth, but later having changed his customs and become estranged from the ancestral beliefs, lodged some obscure man in the tent in his place[c][b]; and it happened that this man received that one's punishment.
translation:
  language: ru
  text: Досифей[a], называемый сыном Дримила, иудей по происхождению, но впоследствии переменивший свои обычаи и отчуждившийся от верований предков[b], уложил в шатре вместо себя какого-то безвестного человека[c]; этому человеку и довелось понести наказание, предназначенное тому.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Досифей, именуемый Дримиловым». Вероятно, греческая конструкция служит патронимическим обозначением.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «переменивший установления (или обычаи) и отчуждённый от отеческих убеждений».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «какого-то незнатного человека» или «какого-то неизвестного человека».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δωσίθεος ὁ Δριμύλου λεγόμενος
  choice: Досифей, называемый сыном Дримила
  rationale: Родительный Δριμύλου при λεγόμενος естественнее всего понимать как патронимическое обозначение. Слово «сыном» подразумевается и отмечено сноской как не выраженное прямо.
- source_word: τὸ γένος Ἰουδαῖος
  choice: иудей по происхождению
  rationale: Оборот обозначает происхождение и принадлежность по рождению, а не верность религиозной практике.
- source_word: μεταβαλὼν τὰ νόμιμα
  choice: изменивший отеческим установлениям
  rationale: τὰ νόμιμα охватывает унаследованные религиозно-правовые обычаи и установления; русское выражение передаёт отказ от их соблюдения без сведения смысла лишь к законам или бытовым обычаям.
- source_word: τῶν πατρίων δογμάτων ἀπηλλοτριωμένος
  choice: отступивший от верований предков
  rationale: Передаёт отчуждение от унаследованных религиозных убеждений естественным современным русским языком, сохраняя отрицательную оценку повествователя.
- source_word: ἄσημόν τινα
  choice: какого-то безвестного человека
  rationale: ἄσημος означает человека незнатного, ничем не примечательного или неизвестного; «безвестного» сохраняет эту смысловую широту.
- source_word: κατέκλινεν ἐν τῇ σκηνῇ
  choice: уложил вместо него в шатре
  rationale: κατακλίνω буквально означает «уложить, заставить лечь». Добавление «вместо него» ясно выражает подразумеваемую контекстом подмену.
- source_word: ὃν συνέβη κομίσασθαι τὴν ἐκείνου κόλασιν
  choice: которому и довелось понести предназначенное тому наказание
  rationale: συνέβη передаёт случившийся исход, κομίσασθαι — получение или претерпевание наказания, а ἐκείνου указывает, что оно относилось к другому человеку.
theological_decisions:
- issue: Характеристика отхода Досифея от иудейского наследия
  choice: «изменивший отеческим установлениям и отступивший от верований предков»
  alternative: «изменивший законы и отчуждённый от отеческих догматов»
  rationale: Выбранный вариант сохраняет нравственно-религиозную оценку текста, но не переносит в него более позднюю конфессиональную терминологию и звучит естественно для современного читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. «Шатёр» соответствует σκηνή и сохраняет исторический колорит. Синтаксис удерживает единое длинное предложение оригинала, но причастные обороты и порядок слов сделаны естественными для русского текста.
