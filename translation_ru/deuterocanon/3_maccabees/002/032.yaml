  - severity: medium
    issue: «Спастись от внесения в списки» неточно определяет ἀπογραφαί как процесс внесения.
    rationale: Греческое множественное число обозначает регистрации/учётные списки. Следует говорить об избавлении от регистрационных списков, не утверждая, что речь именно о самом акте внесения.
