base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/032.yaml
  text: But most of them[a], took courage with a noble spirit, did not abandon their piety by exchanging their possessions for life[b], but boldly counted themselves worthy to escape the registration lists.
translation:
  language: ru
  text: Большинство же укрепилось, исполнившись благородного мужества, и не отступило от благочестия; отдавая своё имущество ради сохранения жизни,[a] они без страха считали себя достойными избавления от регистрационных списков.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен иной смысл связи оборота: «не отступили от благочестия, променяв своё имущество на жизнь». Греческое причастие может уточнять способ действия, однако его синтаксическая связь с соседними словами не вполне однозначна.'
    reason: syntactic_ambiguity
  - marker: b
    text: Речь об официальных регистрационных списках, упомянутых в окружающем контексте; по-видимому, по ним иудеев выявляли для применения царских притеснительных мер.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  choice: Большинство же
  rationale: Передаёт идиоматическое значение πλεῖστοι как большей части упомянутой группы и сохраняет противопоставление.
- source_word: γενναίᾳ ψυχῇ ἐνίσχυσαν
  choice: укрепилось благородным духом
  rationale: Сохраняет образ внутреннего укрепления и различает значение существительного ψυχή и нравственную характеристику γενναίᾳ, не сводя оборот просто к «осмелилось».
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: не отступило от благочестия
  rationale: Конструкция с родительным означает удаление или отступление; «благочестие» здесь обозначает верность Богу в условиях принуждения.
- source_word: τὰ τε χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: отдавая своё имущество ради сохранения жизни
  rationale: χρήματα охватывает имущество, а не только деньги; причастие выражает обмен или отдачу имущества ради продолжения жизни. Утвердительная форма причастия сохранена, в отличие от возможного понимания оборота как средства предполагаемого отступничества.
- source_word: ἀδέως
  choice: без страха
  rationale: Непосредственно передаёт значение бесстрашия и не добавляет оттенка дерзости.
- source_word: ἐτιμῶντο ἑαυτοὺς
  choice: считали достойным для себя
  rationale: Средний залог сохраняет самooценочный оттенок τιμάω — почитать, ценить, считать достойным — без добавления идеи способности.
- source_word: ῥύσασθαι ἐκ τῶν ἀπογραφῶν
  choice: спастись от внесения в списки
  rationale: ῥύσασθαι означает спасти или избавить, а ἀπογραφαί в контексте — официальная регистрация, выраженная по-русски естественным оборотом.
theological_decisions:
- issue: Значение εὐσέβεια в контексте гонения
  choice: благочестие
  alternative: верность Богу; почитание Бога
  rationale: «Благочестие» сохраняет религиозный смысл стойкой преданности Богу, не превращая его ни в общую нравственность, ни в конфессионально окрашенный термин.
- issue: Связь отдачи имущества с сохранением благочестия
  choice: 'Причастный оборот передан утвердительно: они отдавали имущество ради жизни, не отступая от благочестия'
  alternative: Они не отступили от благочестия, променяв имущество на жизнь
  rationale: Греческое ἀντικαταλλασσόμενοι грамматически является утвердительным причастием; синтаксическая связь допускает разные оттенки, поэтому основной текст следует форме источника, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Синтаксис сделан ясным для обычного читателя; сохранены ключевые образы «благородного духа», «благочестия» и спасения от официальной регистрации.
