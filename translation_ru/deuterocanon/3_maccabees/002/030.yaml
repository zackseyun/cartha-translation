  yaml_path: translation/deuterocanon/3_maccabees/002/030.yaml
  text: 'But so that he might not appear hateful to everyone[a], he added in writing: “But if some of them choose to live among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: ru
  text: 'Но, чтобы не казаться всем ненавистным, он приписал: «Если же некоторые из них предпочтут жить среди посвящённых в обряды[a], то он уравнивает их в гражданских правах с александрийцами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди посвящённых в мистерии». В греческом тексте употреблена культовая терминология посвящения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεχθόμενος
  choice: ненавистным
  rationale: 'Передаёт значение причастия в сочетании с φαίνηται: речь о том, каким он может казаться другим, — вызывающим ненависть или неприязнь.'
- source_word: ὑπέγραψεν
  choice: он приписал
  rationale: В контексте письменного постановления обозначает добавление письменной оговорки; «приписал» кратко и естественно передаёт документальный характер действия.
- source_word: προαιρῶνται
  choice: предпочтут
  rationale: Глагол выражает сознательный выбор и может означать как «выберут», так и «предпочтут»; здесь «предпочтут» естественно вводит избранный образ жизни.
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  choice: среди посвящённых в обряды
  rationale: Сохраняет культовый язык посвящения, не уточняя сверх текста, шла ли речь о строго определённом мистериальном культе.
- source_word: ἀναστρέφεσθαι
  choice: жить
  rationale: В данном сочетании глагол указывает на образ жизни и пребывание среди определённой группы; «жить среди» звучит по-русски естественно и не сводит смысл лишь к общению.
- source_word: ἰσοπολίτας Ἀλεξανδρεῦσι
  choice: уравнивает их в гражданских правах с александрийцами
  rationale: Передаёт юридико-политический смысл равного гражданского статуса яснее и естественнее, чем буквальное «делает равными гражданами».
- source_word: ποιεῖ
  choice: уравнивает
  rationale: Настоящее время сохранено внутри цитируемого положения; глагол выражает юридический результат предоставления равного статуса.
theological_decisions:
- issue: Культовая терминология в эллинистическо-иудейском повествовании
  choice: посвящённых в обряды
  alternative: посвящённых в мистерии
  rationale: Слова τελεταί и μεμυημένοι явно относятся к культовому посвящению. Основной вариант сохраняет этот смысл, а более техническое «мистерии» оставлено в сноске, чтобы не сужать референцию без необходимости.
translation_notes:
  register: Современный литературный русский язык с достоинством официально-повествовательного контекста. Юридическое выражение передано идиоматически, а культовая неоднозначность сохранена в сноске.
