base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/013.yaml
  text: But in our downfall this bold and profane man is attempting to insult the holy place on earth appointed by the name of your glory[a].
translation:
  language: ru
  text: Но в нашем падении этот дерзкий и нечестивый человек стремится надругаться над святым местом на земле, отмеченным именем Твоей славы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «явленным именем Твоей славы»; возможно также: «назначенным именем Твоей славы».'
    reason: Греческое ἀναδεδειγμένον может означать «явленное», «обозначенное/отмеченное» или «назначенное»; сжатая связь с выражением «именем Твоей славы» не позволяет уверенно выбрать один оттенок.
lexical_decisions:
- source_word: καταπτώσει
  choice: когда мы повержены
  rationale: Существительное обозначает падение или состояние сокрушённости. Оборот передаёт бедственное и униженное положение народа, не утверждая его окончательной гибели.
- source_word: θρασὺς
  choice: дерзкий
  rationale: Слово выражает вызывающую, бесстыдную смелость; «дерзкий» естественно передаёт отрицательную оценку.
- source_word: βέβηλος
  choice: нечестивый
  rationale: В данном противопоставлении святому месту слово характеризует непочтительность к святыне. «Нечестивый» понятно современному читателю и сохраняет религиозный смысл.
- source_word: ἐπιτηδεύει
  choice: намеревается
  rationale: Глагол указывает на целенаправленное стремление совершить действие, а не только на случайную попытку.
- source_word: καθυβρίσαι
  choice: надругаться над
  rationale: Усиленный глагол обозначает оскорбительное и высокомерное обращение; применительно к святыне «надругаться над» точнее и естественнее простого «оскорбить».
- source_word: ἀναδεδειγμένον
  choice: отмеченным
  rationale: Причастие может означать публично явленное, обозначенное или назначенное. «Отмеченным» сохраняет идею выделения места, не сводя её лишь к административному назначению.
- source_word: τῷ ὀνόματι τῆς δόξης σου
  choice: именем Твоей славы
  rationale: Сохранена сжатая и богословски насыщенная структура греческого выражения, без упрощения до «Твоим славным именем».
- source_word: ἅγιον τόπον
  choice: святым местом
  rationale: Прямой перевод не сужает значение до внутреннего святилища, хотя в контексте речь идёт о храме.
theological_decisions:
- issue: К какому священному месту относится выражение
  choice: «святое место на земле» — храм в Иерусалиме в широком смысле
  alternative: внутреннее храмовое святилище
  rationale: Греческий текст употребляет общее ἅγιον τόπον, а не более узкий технический термин, поэтому перевод не конкретизирует отдельную часть храма.
- issue: Связь святого места с Божьим именем и славой
  choice: сохранить выражение «именем Твоей славы»
  alternative: «Твоим славным именем»
  rationale: Более буквальная конструкция сохраняет различение имени и славы и не разрешает однозначно сжатую синтаксическую связь исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным звучанием. Местоимение «Твоей» написано с прописной буквы как обращение к Богу. Формулировка сохраняет неоднозначность причастия ἀναδεδειγμένον; маркер [a] присутствует в основном тексте.
