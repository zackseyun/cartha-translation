  - severity: low
    issue: Недостаточно ясно отражена ограниченность «отмеченным именем»
    rationale: Формулировка возможна, но ἀναδεδειγμένον может означать также «явленное» или «назначенное». Сноска должна подавать эти варианты как варианты перевода спорного причастия, не создавая впечатления, что это разные объекты.
