review_pass:
  verdict: revise
  source_fidelity: 'Начальное ἐν δὲ τῇ ἡμετέρᾳ καταπτώσει обозначает положение «в нашем падении/бедствии», а не временное «когда мы повержены». Остальные основные соответствия в целом верны: «дерзкий и нечестивый», «стремится надругаться», «святое место на земле». Причастие ἀναδεδειγμένον и связь с τῷ ὀνόματι τῆς δόξης σου допускают оттенки «явленное», «обозначенное/отмеченное», «назначенное»; основной текст не должен чрезмерно конкретизировать этот спорный оборот.'
  naturalness: «Но когда мы повержены» звучит как описание момента события и менее естественно передаёт греческий предложный оборот. «В нашем падении» литературно, кратко и сохраняет образ исходника. «Отмеченным именем» приемлемо, но для современного читателя полезно в сноске пояснить, что речь не обязательно о буквальной надписи.
  terminology: «Нечестивый», «надругаться над», «святое место» уместны для торжественного молитвенного регистра и не сужают ἅγιον τόπον до конкретной части храма. Написание «Твоей» сохраняется как избранная регистровая норма обращения к Богу. Маркер сноски поставлен непосредственно после определяемого оборота.
