lexical_decisions:
- source_word: Ἐνταῦθα
  choice: И тогда
  rationale: Наречие указывает на момент и место только что описанного события. В русском повествовании «и тогда» естественно передаёт этот переход, не сводя его к отвлечённой последовательности.
- source_word: ἐπόπτης
  choice: надзирающий за всем
  rationale: Существительное обозначает того, кто наблюдает и осуществляет надзор. Причастный оборот сохраняет смысл Божьего всеведения и попечения без административного оттенка слова «надзиратель».
- source_word: προπάτωρ
  choice: Праотец
  rationale: Сохранён необычный родовой титул Бога, буквально означающий предка или праотца. Он не заменён более привычным, но отсутствующим в греческом тексте выражением «Бог отцов».
- source_word: ἅγιος ἐν ἁγίοις
  choice: святой ... среди святых
  rationale: Основной текст понимает ἐν с личным множественным как «среди». Неоднозначная возможность культового смысла — «во святых местах/святынях» — сохранена в сноске.
- source_word: εἰσακούσας
  choice: услышав
  rationale: Аористное причастие передано деепричастием, сохраняющим предшествование ответа на молитву последующему наказанию. В молитвенном контексте «услышав» также подразумевает благосклонное принятие просьбы.
- source_word: εὐθέσμου λιτανείας
  choice: подобающую закону мольбу
  rationale: εὔθεσμος выражает соответствие закону, установленному порядку или должной норме; развёрнутый вариант по-русски яснее, чем потенциально юридическое «законную». λιτανεία здесь означает усердную молитвенную просьбу.
- source_word: ἐμάστιξεν
  choice: поразил бичом
  rationale: Передана буквальная и яркая образность глагола «бичевать», который в данном контексте описывает суровую Божью кару.
- source_word: ὕβρει καὶ θράσει
  choice: в своей наглости и дерзости
  rationale: ὕβρις обозначает оскорбительную надменность и своеволие, а θράσος — предосудительную смелость или дерзость. Русская пара сохраняет отрицательный смысл обоих слов.
- source_word: μεγάλως ἐπηρμένον
  choice: безмерно вознёсся
  rationale: Метафора возвышения передаёт состояние горделивого самопревозношения; «безмерно» выражает усилительное μεγάλως естественным русским языком.
theological_decisions:
- issue: Необычный титул Бога προπάτωρ
  choice: «Бог ... святой Праотец»
  alternative: «Бог наших отцов» или «родоначальник»
  rationale: Греческий текст прямо называет Бога προπάτωρ и не содержит местоимения «наш» или формулы «Бог отцов». Поэтому необычный титул сохранён без конфессионального сглаживания.
- issue: Толкование ἅγιος ἐν ἁγίοις
  choice: «святой ... среди святых»
  alternative: «святой во святых местах/святынях»
  rationale: Синтаксис допускает личное понимание как характеристики Бога, однако форма ἐν ἁγίοις может иметь также культово-пространственный или предметный смысл. Альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-исторического повествования. Сохранены необычный божественный титул, причастная логика предложения и образ бича; неоднозначность культовой фразы вынесена в сноску. Конечная запятая сохранена, поскольку стих в исходном тексте синтаксически продолжается.
