  register: 'Современный литературный русский с торжественной, но ясной библейской интонацией. Конечная запятая сохранена, поскольку греческое предложение синтаксически продолжается в следующем стихе. Исправлен существенный разбор английского консультационного текста: εὔθυναν понято как существительное «кара», а не как самостоятельный глагол.'
