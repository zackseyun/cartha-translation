  text: Therefore his friends and bodyguards[a], seeing the acute distress that had come upon him, hurried to set matters straight[b], fearing that even his life might fail.
translation:
  language: ru
  text: Поэтому друзья и телохранители, увидев суровую кару, постигшую его, и опасаясь, как бы не угасла и сама его жизнь,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Союз выражает следствие из предшествующего события; «поэтому» естественно передаёт эту логическую связь.
- source_word: οἵ τε φίλοι καὶ σωματοφύλακες
  choice: друзья и телохранители
  rationale: «Друзья» сохраняет основное значение φίλοι, не сужая его до придворного титула; σωματοφύλακες точно передано словом «телохранители».
- source_word: ὀξεῖαν ... εὔθυναν
  choice: суровую кару
  rationale: εὔθυναν здесь является существительным в винительном падеже со значением взыскания или кары, согласованным с ὀξεῖαν, а не глаголом «исправили». Выражение обозначает тяжёлое постигшее царя наказание.
- source_word: τὴν καταλαβοῦσαν αὐτόν
  choice: постигшую его
  rationale: Причастие описывает кару как настигшую или охватившую царя; «постигшую его» естественно сочетается в русском с существительным «кара».
- source_word: φοβούμενοι μὴ καὶ τὸ ζῆν ἐκλείπῃ
  choice: опасаясь, как бы не угасла и сама его жизнь
  rationale: Оборот выражает опасение смерти. Глагол «угасла» сохраняет образ прекращающейся жизни, а «и сама» передаёт усилительное καί.
