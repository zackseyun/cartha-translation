    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηκέσθη
  choice: был охвачен
  rationale: Буквальный образ укуса или грызущего воздействия в данном нравственном контексте передаёт внутреннюю порабощённость пороку; «был охвачен» звучит естественно по-русски и сохраняет силу пассивной формы.
- source_word: ἀναισχύστοις ἀσελγείαις
  choice: бесстыдным распутством
  rationale: Сочетание обозначает лишённое стыда, необузданное и нравственно возмутительное поведение. Собирательное русское «распутство» естественнее буквального множественного числа.
- source_word: ἐπὶ τοσοῦτον θράσους προῆλθεν
  choice: дошёл до такой дерзости
  rationale: Сохраняет образ движения к крайней степени наглости и соответствует современному литературному русскому.
- source_word: δυσφημίας
  choice: клеветнические речи
  rationale: Слово допускает более широкий смысл злоречия или порочащих высказываний; выбранный вариант передаёт общественно-враждебный характер речи, не уточняя религиозный объект.
- source_word: ἐν τοῖς τόποις
  choice: в разных местах
  rationale: Греческое выражение неопределённо и может относиться к местностям или округам; перевод сохраняет эту неопределённость и звучит естественно.
- source_word: συνίστασθαι
  choice: стали распространяться
  rationale: В сочетании с δυσφημίας глагол указывает на возникновение и развёртывание порочащих речей; русский вариант передаёт начавшийся процесс без тяжеловесной буквальности.
- source_word: ἐντείνοντας εἰς τὴν τοῦ βασιλέως πρόθεσιν
  choice: всеми силами содействуя намерению царя
  rationale: Причастие выражает напряжённое, деятельное устремление к царскому замыслу. «Содействуя» естественно передаёт практическое соучастие, а «всеми силами» сохраняет оттенок напряжения.
- source_word: θελήσει
  choice: воле
  rationale: Стандартно и точно передаёт желание или волю названного лица в возвышенном повествовательном регистре.
theological_decisions:
- issue: Нравственная характеристика поведения правителя
  choice: 'Сохранена сильная оценочная лексика: «бесстыдное распутство».'
  alternative: Смягчённое «безнравственное поведение».
  rationale: Греческие слова выражают резкое нравственное осуждение, но не требуют привнесения позднейшей конфессиональной терминологии.
- issue: Антецедент ἐκείνου в заключительной части
  choice: 'Местоимение понято как относящееся к царю: «его воле».'
  alternative: Отнесение к иному, подразумеваемому лицу.
  rationale: Ближайший явно названный и наиболее естественный по контексту антецедент — царь; при этом неоднозначность греческого местоимения отмечена в сноске.
