revisions:
- from: Он не только был охвачен бесстыдным распутством, но дошёл до такой дерзости, что в разных местах стали распространяться клеветнические речи[a], а многие из его друзей, всеми силами содействуя намерению царя[b], и сами следовали его воле.
  to: Он не только был охвачен бесстыдным распутством, но дошёл до такой дерзости, что в тех местах стали распространяться порочащие речи[a], а многие из его друзей, направляя все усилия к намерению царя, и сами следовали его воле.
  rationale: 'Исправлена чрезмерная конкретизация порочащих речей как именно клеветы и устранено более сильное, чем в оригинале, значение практического содействия царскому замыслу. Сноска о местностях сохранена по английскому аудиторскому следу и должна быть привязана к словам «в тех местах»: «...в тех местах[b] стали распространяться порочащие речи[a]...».'
