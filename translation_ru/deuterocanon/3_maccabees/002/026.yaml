    issue: Смысловое смещение в «содействуя намерению царя»
    rationale: ἐντείνω εἰς выражает направленное напряжённое устремление к цели/намерению. «Содействовать» утверждает фактическую помощь в осуществлении замысла, что сильнее и конкретнее исходного выражения.
  - severity: medium
    issue: «Клеветнические» чрезмерно конкретизирует δυσφημίαι
    rationale: Существительное охватывает порочащую, злоречивую или оскорбительную речь и не обязательно предполагает ложность, присущую русскому «клеветнический».
  - severity: medium
    issue: Якорь сноски b поставлен не при соответствующем греческом выражении
    rationale: Сноска b в аудиторском следе поясняет ἐν τοῖς τόποις; в черновике она прикреплена к «намерению царя» и содержит примечание к заключительному местоимению. Следует поставить b после «местах» и дать примечание о локативном выражении.
  - severity: low
    issue: Сноска о местоимении «его» избыточна
    rationale: В русском переводе «его воле» после явного «царя» читается естественно; формальную неоднозначность греческого местоимения не нужно искусственно усиливать, поскольку контекст ясно поддерживает царя.
