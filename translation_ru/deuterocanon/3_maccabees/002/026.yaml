  yaml_path: translation/deuterocanon/3_maccabees/002/026.yaml
  text: He was not only inflamed with shameless debaucheries[a], but also advanced to such a degree of audacity that slanders were being stirred up in the places, and many of his friends, straining toward the king’s purpose[b], were themselves following his will.
translation:
  language: ru
  text: Он не только был охвачен бесстыдным распутством, но дошёл до такой дерзости, что в тех местах стали распространяться порочащие речи[a], а многие из его друзей, направляя все усилия к намерению царя, и сами следовали его воле.
  philosophy: optimal-equivalence
