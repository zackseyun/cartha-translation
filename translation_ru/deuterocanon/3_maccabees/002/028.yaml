base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/028.yaml
  text: Let no one who does not sacrifice enter their sanctuaries[a], but let all the Jews be subjected to registration and servant status[c][b], and let those who object be taken by force and put to death.
translation:
  language: ru
  text: Никому из тех, кто не приносит жертв, не входить в их святилища[a]; всех же иудеев подвергнуть переписи[b] и обратить в рабское состояние, а тех, кто станет противиться, силой уводить и лишать жизни[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к их святыням»; греческое выражение может обозначать священные места, а также священные предметы или обряды.'
    reason: lexical_alternative
  - marker: b
    text: «Перепись» могла подразумевать государственную регистрацию для контроля или налогообложения.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «удалять от жизни», то есть предавать смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδένα τῶν μὴ θυόντων
  choice: Никому из тех, кто не приносит жертв
  rationale: Запретительная инфинитивная конструкция указа передана естественной для русского распорядительного текста формой «никому… не входить»; причастие обозначает людей, не участвующих в жертвоприношениях.
- source_word: ἐπὶ τὰ ἱερὰ αὐτῶν εἰσιέναι
  choice: не входить в их святилища
  rationale: С глаголом εἰσιέναι выражение τὰ ἱερά вероятнее всего обозначает священные места или храмовые пределы. Возможная более широкая семантика отмечена в сноске.
- source_word: λαογραφίαν
  choice: переписи
  rationale: Слово означает государственный учёт населения, возможно связанный с налогообложением или контролем; «перепись» сохраняет эту широту без неоправданного уточнения.
- source_word: οἰκετικὴν διάθεσιν
  choice: обратить в рабское состояние
  rationale: Выражение указывает на навязываемый статус домашней прислуги или рабов. Формулировка ясно передаёт социально-правовое унижение, не сужая его до конкретной формы домашнего рабства.
- source_word: ἀντιλέγοντας
  choice: тех, кто станет противиться
  rationale: Причастие может означать возражение или сопротивление. В контексте насильственного указа «противиться» естественно охватывает оба оттенка.
- source_word: βίᾳ φερομένους
  choice: силой уводить
  rationale: Переданы принуждение и насильственное перемещение, выраженные βίᾳ и пассивным причастием φερομένους.
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: лишать жизни
  rationale: Буквально идиома означает «устранить от жизни» и недвусмысленно относится к умерщвлению; русский оборот сохраняет достоинство и некоторую эвфемистичность оригинала.
theological_decisions:
- issue: Характер статуса в οἰκετικὴν διάθεσιν
  choice: рабское состояние
  alternative: положение домашних рабов; рабский статус
  rationale: Текст говорит не просто о службе, а о принудительном, унизительном и рабоподобном социальном положении. Выбранный вариант передаёт эту тяжесть, не утверждая более узкую институциональную категорию, чем позволяет греческий.
- issue: Степень прямоты при передаче τοῦ ζῇν μεταστῆσαι
  choice: лишать жизни
  alternative: предавать смерти; умерщвлять
  rationale: Выражение является эвфемистической идиомой смерти. «Лишать жизни» ясно передаёт смысл, одновременно сохраняя стилистическую непрямоту оригинала.
