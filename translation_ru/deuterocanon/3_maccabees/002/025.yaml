  terminology: «Собутыльники» удачно передаёт συνπόται. «Приближённые» допустимо в придворном контексте для ἑταῖροι, хотя исходное слово шире. «Нечестие» приемлемо для κακία. Для παντὸς δικαίου предпочтительно не придавать выражению специально религиозный оттенок «праведности», а сохранить значение всего справедливого/правого.
