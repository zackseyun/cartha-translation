  text: But after he had been conveyed to Egypt[a], and was increasing his wickedness through the previously mentioned drinking companions and associates, who had been estranged from all justice[c][b],
translation:
  language: ru
  text: Когда же его перевезли в Египет[a], он продолжал умножать своё нечестие посредством упомянутых ранее собутыльников[b] и приближённых, чуждых всему справедливому[c],
