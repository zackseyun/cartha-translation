    reason: lexical_alternative
lexical_decisions:
- source_word: Διακομισθεὶς
  choice: Когда же его перевезли
  rationale: Аористное страдательное причастие указывает на перемещение в Египет, не уточняя способ; придаточное времени естественно передаёт греческую конструкцию.
- source_word: ἐπαύξων
  choice: он продолжал умножать
  rationale: Причастие настоящего времени выражает продолжающееся усиление; «продолжал умножать» сохраняет длительность и естественно звучит по-русски.
- source_word: κακίας
  choice: своё нечестие
  rationale: κακία здесь обозначает широкую нравственную порочность; «нечестие» соответствует возвышенному повествовательному регистру и не сужает значение до злобы.
- source_word: προαποδεδειγμένων
  choice: упомянутых ранее
  rationale: Форма отсылает к уже обозначенным в повествовании лицам; перевод ясно сохраняет эту анафорическую связь.
- source_word: συνποτῶν
  choice: собутыльников
  rationale: Слово буквально обозначает совместно пьющих; «собутыльники» кратко и естественно передаёт отрицательно окрашенное застольное окружение.
- source_word: ἑταίρων
  choice: приближённых
  rationale: В придворном контексте речь идёт о людях из окружения, а не обязательно о друзьях; «приближённые» сохраняет социально-политический оттенок.
- source_word: τοῦ παντὸς δικαίου κεχωρισμένων
  choice: чуждых всякой праведности
  rationale: Перфектное причастие передаёт устойчивое состояние отчуждения, а субстантивированное δίκαιον охватывает всё праведное и справедливое; формулировка сохраняет нравственную широту выражения.
