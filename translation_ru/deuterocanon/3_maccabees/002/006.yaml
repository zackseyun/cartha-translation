  yaml_path: translation/deuterocanon/3_maccabees/002/006.yaml
  text: And when he pursued him with chariots and a multitude of people[a], you overwhelmed him in the depths of the sea; but those who had put their trust in you, who rule over all creation[b], you brought safely through.
translation:
  language: ru
  text: Преследовавшего его с колесницами и множеством людей[a] Ты потопил в морской пучине; а доверившихся же Тебе, властвующему над всем творением[b], Ты переправил невредимыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Здесь подразумевается исход из Египта: египетский преследователь погиб в море, а Божий народ благополучно перешёл его.'
    reason: cross_reference
  - marker: b
    text: 'Или: «Владыке всего творения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδιώξαντα αὐτόν
  choice: того, кто преследовал его
  rationale: Причастный оборот обозначает враждебное преследование. Местоимение «его» сохраняет не названный прямо в этом стихе объект преследования и не вводит имён, отсутствующих в греческом тексте.
- source_word: σὺν ἅρμασιν καὶ ὄχλων πλήθει
  choice: с колесницами и множеством людей
  rationale: ἅρματα — военные колесницы, а ὄχλων πλῆθος подчёркивает многочисленность сопровождавшей преследователя массы. «Множество людей» естественно звучит по-русски без неуклюжего буквального «множества толп».
- source_word: ἐπέκλυσας βάθει θαλάσσης
  choice: Ты поглотил в морской пучине
  rationale: ἐπικλύζω передаёт затопление или захлёстывание водой, а βάθος θαλάσσης — морскую глубину. «Поглотил в морской пучине» сохраняет образ гибели под водами и возвышенный молитвенный регистр.
- source_word: ἐμπιστεύσαντας ἐπὶ σοὶ
  choice: доверившихся Тебе
  rationale: Оборот означает возложить доверие на кого-либо. «Доверившихся Тебе» кратко и естественно передаёт личное упование.
- source_word: τῷ τῆς ἁπάσης κτίσεως δυναστεύοντι
  choice: властвующему над всем творением
  rationale: Причастие согласовано с σοὶ и описывает Бога как осуществляющего власть над всей совокупностью творения. Причастная конструкция сохраняет синтаксис и богословскую весомость оригинала.
- source_word: σώους διεκόμισας
  choice: Ты невредимыми переправил
  rationale: σώους подчёркивает сохранность и невредимость, а διακομίζω — перемещение через преграду или опасность. «Невредимыми переправил» передаёт обе смысловые стороны и соответствует переходу через море.
theological_decisions:
- issue: Кого именно преследовали и кто был преследователем
  choice: 'Сохранить местоименную форму: «того, кто преследовал его»'
  alternative: Назвать в основном тексте фараона и Израиль
  rationale: Контекст явно отсылает к исходу из Египта, однако данный греческий стих не называет участников по именам. Их эксплицитное добавление устранило бы формальную неоднозначность источника.
- issue: Всеобъемлющая власть Бога
  choice: «Тебе, властвующему над всем творением»
  alternative: «Тебе, Владыке всего творения»
  rationale: Причастный вариант непосредственно отражает δυναστεύοντι и представляет владычество как действие, не ослабляя утверждения о Божьей власти над всем сотворённым.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Заглавные местоимения «Ты», «Тебе» употреблены как уважительное обращение к Богу. Параллелизм суда и спасения сохранён; имена участников исхода не внесены в основной текст.
