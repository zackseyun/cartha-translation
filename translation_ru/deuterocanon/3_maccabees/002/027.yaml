lexical_decisions:
- source_word: προέθετο δημοσίᾳ
  choice: решил публично
  rationale: Средняя форма προέθετο выражает намерение или принятое решение, а δημοσίᾳ — его публичный характер; перевод не представляет это как формально изданный указ.
- source_word: διαδοῦναι ψόγον
  choice: подвергнуть … поношению
  rationale: Сочетание передаёт намерение широко распространить порицание и тем самым публично опозорить народ; русская конструкция естественно выражает направленное против него бесчестье.
- source_word: τοῦ ἔθνους
  choice: этот народ
  rationale: В контексте речь идёт об иудейском народе как едином сообществе; «народ» в современном русском естественнее, чем «нация», и не вносит современных политических оттенков.
- source_word: ἐπὶ τοῦ κατὰ τὴν αὐλὴν πύργου
  choice: на башне у двора
  rationale: Сохраняется пространственное отношение κατὰ τὴν αὐλήν без необоснованного уточнения, что это именно дворец или дворцовый двор.
- source_word: στήλην ἀναστήσας
  choice: установив … стелу
  rationale: στήλη обозначает вертикально установленный каменный памятник для надписи; «стела» точно передаёт предмет, а причастная конструкция сохраняет предшествующее действие.
- source_word: ἐκόλαψεν γραφήν
  choice: высек на ней надпись
  rationale: ἐκόλαψεν указывает на вырезание или высекание текста, а γραφή в данном эпиграфическом контексте — надпись; «на ней» естественно и недвусмысленно связывает действие со стелой.
