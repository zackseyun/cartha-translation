- source_word: ἡγίασας
  choice: Ты освятил
  rationale: Точный и привычный русский эквивалент ἁγιάζω, обозначающий посвящение места Богу и наделение его священным статусом.
- source_word: τὸν τόπον τοῦτον
  choice: это место
  rationale: Прямой и естественный эквивалент указательной конструкции.
