base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/008.yaml
  text: You[a], O King, having created the boundless and immeasurable earth, chose this city and made this place holy for your name, though you have no need of anything[b], O God of all, and glorified it with majestic manifestation, having established it for the glory of your great and honored name.
translation:
  language: ru
  text: Ты, Царь, сотворив беспредельную и неизмеримую землю, избрал этот город и освятил это место для Своего имени — Тебе, ни в чём не нуждающемуся[a], — и прославил его величественным явлением[b], устроив его во славу Своего великого и почитаемого имени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза синтаксически трудна. Буквально: «Тебе, не нуждающемуся ни в чём»; слова «ни в чём» могут передавать греческое «из всего».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «величественным появлением» либо «в величественном облике»; греческое выражение может подразумевать видимое божественное явление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῦ
  choice: Царь
  rationale: Сохраняет прямое звательное обращение к Богу и возвышенный молитвенный тон; в современном русском звательная функция передаётся формой именительного падежа.
- source_word: κτίσας
  choice: сотворив
  rationale: Передаёт предшествующее действие аористного причастия и естественно звучит в библейском контексте творения.
- source_word: ἀπέρατον καὶ ἀμέτρητον γῆν
  choice: беспредельную и неизмеримую землю
  rationale: Сохраняет оба усиливающих определения и космический смысл γῆ как земли, а не отдельной страны.
- source_word: ἐξελέξω
  choice: избрал
  rationale: Точно и естественно передаёт Божий выбор города, сохраняя библейскую лексику без дополнительной догматизации.
- source_word: ἡγίασας
  choice: освятил
  rationale: Обычный современный русский библейский эквивалент со значением посвящения места Богу и придания ему святости.
- source_word: εἰς σὸν ὄνομά
  choice: для Своего имени
  rationale: Передаёт посвящение места Божьему имени; возвратное «Своего» ясно соотносит имя с субъектом действия.
- source_word: τῷ τῶν ἁπάντων ἀπροσδεεῖ
  choice: Ты, ни в чём не нуждающийся, Владыка всего
  rationale: Сохраняет обращённую к Богу аппозицию и утверждение Его независимости от всякой нужды. «Владыка» вводится как естественное восполнение эллиптического τῶν ἁπάντων, но неоднозначность отмечена в сноске.
- source_word: παρεδόξασας
  choice: прославил его
  rationale: Сохраняет связь с лексикой славы в конце стиха; местоимение отнесено к ближайшему «месту».
- source_word: ἐν ἐπιφανείᾳ μεγαλοπρεπεῖ
  choice: величественным явлением
  rationale: Передаёт как инструментальный оттенок ἐν, так и возможный смысл видимого божественного явления, не уточняя его характер сверх текста.
- source_word: σύστασιν ποιησάμενος αὐτοῦ
  choice: утвердив его
  rationale: Естественно передаёт сжатую греческую конструкцию, допускающую смысл учреждения, основания или прочного установления места.
- source_word: πρὸς δόξαν τοῦ μεγάλου καὶ ἐντίμου ὀνόματός σου
  choice: во славу Своего великого и почитаемого имени
  rationale: Передаёт целевое значение πρὸς, сохраняет повтор имени и различает δόξα («слава») и ἔντιμος («почитаемый, высоко ценимый»).
theological_decisions:
- issue: Синтаксис τῷ τῶν ἁπάντων ἀπροσδεεῖ
  choice: 'Аппозиционное обращение: «Ты, ни в чём не нуждающийся, Владыка всего»'
  alternative: «Тебе, ни в чём из всего не нуждающемуся» или «Тебе, не нуждающемуся ни в чём от всех»
  rationale: Греческая фраза синтаксически трудна. Контекст молитвы поддерживает описание Бога как не имеющего нужды и властвующего над всем, однако перевод не выдаёт это членение за бесспорное и отмечает трудность в сноске.
- issue: Значение ἐπιφάνεια
  choice: «явление» с возможным оттенком видимой богоявленности
  alternative: «величественный облик» или «великолепное появление»
  rationale: Слово может обозначать явление или видимое появление. Основной текст сохраняет более широкое «явление», а сноска сообщает о возможной эпифанической окраске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Синтаксис остаётся возвышенным, но понятным; прописные местоимения в обращении к Богу использованы последовательно. Подлинные неоднозначности трудной аппозиции и слова ἐπιφάνεια вынесены в сноски.
