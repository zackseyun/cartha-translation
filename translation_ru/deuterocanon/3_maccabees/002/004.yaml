  text: You burned up the Sodomites[a], who practiced arrogance and had become notorious for their evils, with fire and sulfur[b], setting them forth as an example for those who would come afterward.
translation:
  language: ru
  text: Ты огнём и серой испепелил содомлян, предававшихся надменности и ставших печально известными своими злодеяниями[a], сделав их примером для тех, кто будет после.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий оборот с ἀδήλους труден. Обычно ἀδήλους означает «неявных», «незримых» или «неизвестных», тогда как по контексту его нередко понимают как указание на людей, ставших заметными или печально известными своими злодеяниями. Основной текст передаёт это вероятное контекстуальное понимание.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ὑπερηφανίαν ἐργαζομένους
  choice: которые поступали надменно
  rationale: Оборот буквально говорит о тех, кто «творил надменность». Выбранная формулировка естественна по-русски и сохраняет значение устойчивого высокомерного поведения.
- source_word: Σοδομίτας
  choice: содомлян
  rationale: Этникон обозначает жителей Содома. Русское «содомляне» прямо передаёт историко-географический смысл и не вносит позднейших специальных ассоциаций.
- source_word: ἀδήλους ταῖς κακίαις γενομένους
  choice: стали известны своими злодеяниями[a]
  rationale: 'Переданный греческий оборот с ἀδήλους сжат и труден: обычное значение слова — «неявные, незримые, неизвестные», но контекст, вероятно, требует смысла явной или получившей известность порочности. Основной текст передаёт вероятный контекстуальный смысл, а примечание сохраняет текстовую трудность.'
- source_word: πυρὶ καὶ θείῳ
  choice: огнём и серой
  rationale: θείον прямо означает серу. Это ясная современная русская формулировка, сохраняющая отсылку к гибели Содома.
- source_word: κατέφλεξας
  choice: испепелил
  rationale: Глагол обозначает полное уничтожение огнём. «Испепелил» кратко и выразительно передаёт усилительный характер формы.
- source_word: παράδειγμα
  choice: примером
  rationale: Существительное означает пример или образец; в контексте суда предостерегающий характер понятен без добавления слова «предостережение».
- source_word: τοῖς ἐπιγινομένοις
  choice: для тех, кто придёт после них
  rationale: Причастие указывает на людей последующих времён. Формулировка сохраняет широту выражения и не сужает его до строго определённых поколений.
theological_decisions:
- issue: Описание греха и суда над Содомом без внесения позднейших толкований
  choice: Стих представлен как рассказ о Божьем суде над жителями Содома за надменное поведение и злодеяния вообще.
  alternative: Уточнить характер злодеяний на основании других библейских текстов или позднейших ассоциаций.
  rationale: В данном стихе прямо названы надменность и злодеяния, но их вид не уточняется; перевод не должен добавлять отсутствующее в тексте толкование.
- issue: Передача формулы πυρὶ καὶ θείῳ
  choice: огнём и серой
  alternative: огнём и горящей серой
  rationale: Прямой перевод сохраняет образ Божьего суда и не добавляет определения «горящей», которого в данном греческом выражении нет.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Инверсия «Ты испепелил… содомлян» сохраняет обращение к Богу, но синтаксис остаётся понятным. «Содомляне» употреблено исключительно как название жителей Содома.
