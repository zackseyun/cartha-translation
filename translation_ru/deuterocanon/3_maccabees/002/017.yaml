lexical_decisions:
- source_word: κατεπατήσαμεν / καταπατοῦνται
  choice: попрали / попирают
  rationale: Сохраняет конкретный образ попрания ногами, повтор одного греческого глагола и переход от аориста в первой части к настоящему времени во второй.
- source_word: τὸν οἶκον
  choice: дом
  rationale: Буквально передаёт οἶκος и сохраняет лексическую связь с последующим множественным «дома»; в контексте речь идёт о храме.
- source_word: τοῦ ἁγιασμοῦ
  choice: святости
  rationale: Естественно по-русски передаёт абстрактное существительное ἁγιασμός в сакральном контексте, не сводя его значение только к обряду освящения.
- source_word: ὡς
  choice: как
  rationale: Прямо и естественно вводит сравнение.
- source_word: τῶν προσολυμίων
  choice: жителей Иерусалима
  rationale: Редкое обозначение иерусалимлян передано ясным современным выражением, относящимся к людям, а не к городу как таковому.
theological_decisions:
- issue: Следует ли истолковать οἶκος как «храм»
  choice: дом святости
  alternative: храм; святилище
  rationale: Сохраняется буквальное «дом» и намеренный повтор οἶκος — οἶκοι, тогда как сноска поясняет храмовый референт без подмены исходного образа.
- issue: Как передать ἁγιασμός в храмовом контексте
  choice: святость
  alternative: освящение; посвящение Богу
  rationale: «Святость» звучит естественно и сохраняет абстрактное значение греческого существительного; возможные культовые оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного признания. Сохранены параллелизм, повтор «дом — дома» и резкое самообвинение «мы попрали».
