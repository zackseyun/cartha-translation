- source_word: καὶ
  choice: и
  rationale: Сохранён обычный соединительный союз, передающий связь с предшествующим контекстом и фрагментарный характер краткой греческой фразы.
- source_word: δὴ
  choice: поистине
  rationale: Частица придаёт утверждению подчёркнутую уверенность; «поистине» естественно передаёт усиление, не разворачивая краткую фразу.
- source_word: πιστός
  choice: верный
  rationale: В сочетании с ἀληθινός слово выражает надёжность и верность; «верный» сохраняет как нравственный, так и relational оттенок исходного слова.
- source_word: ἀληθινός
  choice: истинный
  rationale: Прямой русский эквивалент, сохраняющий возможные оттенки правдивости и подлинности без сужения смысла.
