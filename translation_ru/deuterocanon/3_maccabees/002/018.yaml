lexical_decisions:
- source_word: ἀπάλειψον
  choice: изгладь
  rationale: Императив передаёт образ стирания или удаления; «изгладь грехи» естественно для возвышенной современной молитвенной речи и сохраняет предметную метафору.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: наши грехи
  rationale: Обычное религиозно-нравственное значение ἁμαρτία; контекст представляет собой исповедальную молитву.
- source_word: διασκέδασον
  choice: рассей
  rationale: Сохраняет буквальный образ рассеивания и выражает просьбу устранить названные далее заблуждения.
- source_word: τὰς ἀμβλακίας ἡμῶν
  choice: наши заблуждения
  rationale: Редкое существительное может обозначать ошибки, безрассудства или промахи. «Заблуждения» сохраняет отличие от «грехов», не сводя значение лишь к интеллектуальной ошибке благодаря покаянному контексту.
- source_word: ἐπίφανον
  choice: яви
  rationale: Императив ἐπιφαίνω здесь призывает Бога сделать милость явной. «Яви» естественно и достойно звучит по-русски, тогда как буквальное «дай воссиять» могло бы чрезмерно конкретизировать образ.
- source_word: τὸ ἔλεός σου
  choice: Свою милость
  rationale: «Милость» — прямое и контекстуально уместное соответствие ἔλεος в просьбе о прощении и помощи.
- source_word: κατὰ τὴν ὥραν ταύτην
  choice: в этот час
  rationale: Сохраняет прямое временное выражение и подчёркивает неотложность молитвы.
theological_decisions:
- issue: Соотношение «грехов» и ἀμβλακίαι в исповедальной молитве
  choice: Передать второе слово отдельно как «заблуждения», а не повторять «грехи».
  alternative: «проступки», «ошибки», «безрассудства» или повторное обобщение словом «грехи»
  rationale: Греческий текст намеренно употребляет два разных существительных. Различение сохраняет риторическое накопление, не превращая его в жёсткую богословскую классификацию.
- issue: Образность ἐπίφανον применительно к Божьей милости
  choice: «яви Свою милость»
  alternative: «пусть воссияет Твоя милость»
  rationale: Глагол допускает значения явления и сияния. Русское «яви» сохраняет эпифанический оттенок, не навязывая тексту исключительно световую метафору.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Формы «изгладь» и «яви» понятны современному читателю и не создают избыточно архаического звучания. Заглавные буквы в местоимении «Свою» следуют принятому русскому благоговейному оформлению обращения к Богу.
