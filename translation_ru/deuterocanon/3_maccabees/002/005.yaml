base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/005.yaml
  text: You made known your power against the bold Pharaoh, when he had enslaved your holy people Israel, testing him with varied and many punishments; by these you made known your great might.
translation:
  language: ru
  text: 'Ты явил Свою силу над дерзким фараоном[a], поработившим Твой святой народ Израиль: Ты подверг его испытанию множеством различных наказаний[b] и через них явил Своё великое могущество.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надменным фараоном». Греческое прилагательное может обозначать вызывающую, наглую или самонадеянную смелость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «испытав различными и многочисленными наказаниями». Такая формулировка может указывать на то, что Бог подвергал фараона испытанию последовательными судами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θρασὺν
  choice: дерзким
  rationale: Передаёт отрицательный оттенок вызывающей, наглой смелости без усиления до однозначного «надменного».
- source_word: καταδουλωσάμενον
  choice: поработившим
  rationale: Причастие обозначает совершённое фараоном обращение Израиля в рабство; «поработившим» сохраняет явную лексику рабства.
- source_word: λαόν σου τὸν ἅγιον Ἰσραήλ
  choice: Твой святой народ Израиль
  rationale: Сохраняет слова «народ» и «святой», а имя «Израиль» передаёт как приложение.
- source_word: ποικίλαις καὶ πολλαῖς
  choice: множеством различных
  rationale: 'Оба определения сохранены в естественной русской конструкции: многочисленность выражена существительным «множество», разнообразие — прилагательным «различных».'
- source_word: δοκιμάσας
  choice: подверг его испытанию
  rationale: Сохраняет значение испытания или проверки, не сводя причастие просто к наказанию; подразумеваемый объект — фараон — выражен явно ради ясности.
- source_word: τιμωρίαις
  choice: наказаний
  rationale: Прямо и естественно обозначает карательные действия Бога в контексте египетских казней.
- source_word: ἐγνώρισας
  choice: явил
  rationale: Передаёт каузативный смысл «сделал известным, показал»; повтор глагола в обеих частях сохранён.
- source_word: δύναμιν
  choice: силу
  rationale: Естественный русский эквивалент для действенной силы Бога, явленной в суде.
- source_word: κράτος
  choice: могущество
  rationale: Отличает κράτος от ранее употреблённого δύναμις и сохраняет риторическое нарастание.
- source_word: ἐφʼ αἷς
  choice: через них
  rationale: Относит выражение к наказаниям как к средствам, через которые было явлено Божье могущество.
theological_decisions:
- issue: Значение и субъект двух форм ἐγνώρισας
  choice: 'Оба раза субъектом является Бог: Он явил Свою силу над фараоном и через наказания явил Своё великое могущество.'
  alternative: Понять первое употребление менее каузативно, как «познал» или свободно перестроить вторую часть.
  rationale: Молитвенный контекст повествует о публичном проявлении Божьей силы при исходе; одинаковый перевод обоих употреблений сохраняет повтор греческого текста.
- issue: Отрицательный оттенок θρασὺν
  choice: дерзким
  alternative: надменным; наглым; самонадеянным
  rationale: «Дерзкий» сохраняет смысл вызывающей смелости и допускает присущий греческому слову диапазон, не навязывая более узкой нравственной характеристики.
- issue: Смысл δοκιμάσας при карательных действиях
  choice: подверг его испытанию
  alternative: испытал его; покарал его; подверг его казням
  rationale: Перевод сохраняет напряжение между буквальным значением испытания и контекстом наказаний, не отождествляя эти понятия.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавные буквы в местоимениях, относящихся к Богу, использованы как нормативная стилистическая традиция русского библейского текста. Двоеточие делает связь между явлением силы и последующими наказаниями прозрачной, не устраняя смысловой повтор оригинала.
