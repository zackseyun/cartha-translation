base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/001.yaml
  text: Lord[a], Lord, king of the heavens and master of all creation, holy among the holy ones, sole ruler, Almighty[b], pay attention to us who are being oppressed by an unholy and profane man, swollen with arrogance and strength.
translation:
  language: ru
  text: Господи, Господи, Царь небес и Владыка всего творения, Святой среди святых[a], единый Властитель, Вседержитель, внемли нам, угнетаемым нечестивым и скверным человеком[b], который кичится своей дерзостью и силой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Святой в святых». Краткое греческое выражение допускает оба понимания.'
    reason: lexical_alternative
  - marker: b
    text: Слова «человеком» в греческом тексте нет; оно добавлено для ясности. Определения и причастие стоят в единственном числе и указывают на одного притеснителя.
    reason: supplied_word
lexical_decisions:
- source_word: Κύριε, Κύριε
  choice: Господи, Господи
  rationale: Вокатив божественного титула передан традиционным русским обращением; повтор сохранён ради молитвенной настойчивости.
- source_word: βασιλεῦ τῶν οὐρανῶν
  choice: Царь небес
  rationale: Русское множественное «небес» сохраняет явное греческое τῶν οὐρανῶν и звучит естественно в возвышенной молитве.
- source_word: δέσποτα πάσης τῆς κτίσεως
  choice: Владыка всего творения
  rationale: «Владыка» передаёт полноту власти δέσποτα и не сливает этот титул с κύριος; κτίσις здесь обозначает всё сотворённое.
- source_word: ἅγιε ἐν ἁγίοις
  choice: Святой среди святых
  rationale: ἐν допускает значение нахождения среди некоторой группы; формулировка сохраняет краткость и литургический характер выражения, не уточняя, кто именно назван святыми.
- source_word: μόναρχε
  choice: единый Властитель
  rationale: Титул подчёркивает исключительное единовластие Бога; «Властитель» сохраняет возвышенный регистр, а «единый» выражает элемент μόνο- без современного политического оттенка слова «монарх».
- source_word: παντοκράτωρ
  choice: Вседержитель
  rationale: Устоявшийся русский библейский титул точно передаёт верховную власть над всем и сохраняет богословский вес исходного слова.
- source_word: πρόσχες ἡμῖν
  choice: Внемли нам
  rationale: Краткий повелительный оборот естественен для русской молитвенной речи и передаёт просьбу обратить внимание на молящихся.
- source_word: καταπονουμένοις
  choice: угнетаемым
  rationale: Причастие обозначает людей, изнуряемых тяжким давлением; в данном контексте «угнетаемым» ясно выражает враждебное притеснение.
- source_word: ἀνοσίου καὶ βεβήλου
  choice: нечестивым и чуждым святости
  rationale: Первое определение выражает религиозно-нравственное нечестие, второе — противоположность священному. Описательный перевод не сводит оба слова к одному значению.
- source_word: θράσει καὶ σθένει πεφρυασμένου
  choice: который кичится своей дерзостью и силой
  rationale: «Кичится» передаёт образ горделивой раздутости в πεφρυασμένου; «дерзость» сохраняет отрицательную окраску θράσος, а «сила» прямо передаёт σθένος.
theological_decisions:
- issue: Различение божественных титулов в нагромождённом обращении
  choice: Господи… Царь… Владыка… Святой… единый Властитель… Вседержитель
  alternative: Свести κύριος, δεσπότης и μονάρχης к повторению одного русского титула
  rationale: Последовательность разных титулов составляет риторическую и богословскую силу молитвы; их различение сохраняет оттенки исходного текста.
- issue: Референт выражения ἅγιοι
  choice: Оставить обобщённое «святые»
  alternative: Уточнить как ангелов, святых людей или святыни
  rationale: Греческий текст не называет референта прямо, поэтому перевод не должен устранять подлинную неоднозначность.
- issue: Не выраженный существительным притеснитель
  choice: Добавить «человеком» с пояснительной сноской
  alternative: 'Передать субстантивированными прилагательными: «нечестивым и чуждым святости»'
  rationale: Формы единственного числа указывают на одного враждебного деятеля, но слово «человек» в греческом отсутствует; его добавление делает русскую фразу ясной, а сноска сохраняет прозрачность решения.
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным звучанием. Традиционные титулы «Господи», «Владыка» и «Вседержитель» сохранены как понятные и уместные; синтаксис слегка расправлен относительным оборотом, чтобы длинная цепочка определений оставалась ясной.
