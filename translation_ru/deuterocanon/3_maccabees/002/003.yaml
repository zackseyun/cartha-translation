  text: You destroyed those in former times who practiced unrighteousness—among whom were giants[b][a], trusting in their strength and boldness—by bringing immeasurable water upon them.
translation:
  language: ru
  text: Ты погубил тех, кто прежде творил неправду, — среди них были исполины, полагавшиеся на свою силу и дерзость[a], — обрушив на них безмерную воду[b].
