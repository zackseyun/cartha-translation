lexical_decisions:
- source_word: τοὺς ἔμπροσθεν
  choice: живших прежде
  rationale: Оборот имеет временное значение и указывает на людей прежних времён; эта передача естественна по-русски.
- source_word: ἀδικίαν ποιήσαντας
  choice: беззаконников
  rationale: Греческое причастное сочетание буквально обозначает тех, кто творил неправду. Субстантивированное «беззаконников» кратко и ясно передаёт нравственную оценку контекста.
- source_word: γίγαντες
  choice: исполины
  rationale: Сохраняется прямое значение слова и связь с допотопным повествованием без замены на более общее «сильные люди».
- source_word: ῥώμῃ
  choice: силу
  rationale: Нейтральная и точная передача физической или общей мощи, на которую они полагались.
- source_word: θράσει
  choice: дерзость
  rationale: В данном контексте слово имеет отрицательный оттенок самонадеянной, вызывающей смелости; «дерзость» передаёт его лучше, чем нейтральная «смелость».
- source_word: πεποιθότες
  choice: полагавшиеся на
  rationale: Передаёт устойчивую уверенность и опору на собственную силу и дерзость.
- source_word: διέφθειρας
  choice: Ты погубил
  rationale: Аорист обозначает решительное уничтожение; «погубил» уместно в возвышенной молитвенной речи и остаётся понятным современному читателю.
- source_word: ἐπαγαγὼν αὐτοῖς ἀμέτρητον ὕδωρ
  choice: наведя на них безмерные воды
  rationale: Причастный оборот обозначает средство гибели. Множественное «воды» естественно по-русски в повествовании о потопе, тогда как примечание сохраняет буквальную грамматическую форму греческого текста.
theological_decisions:
- issue: Отождествление осуждённых с допотопным поколением и исполинами
  choice: Сохранить прямое наименование «исполины» и образ безмерных вод
  alternative: Передать γίγαντες как «сильные люди», а ἀμέτρητον ὕδωρ прямо как «потоп»
  rationale: Текст явно отсылает к суду во время потопа, однако сам употребляет слова «исполины» и «безмерная вода». Перевод сохраняет его собственную образность, не гармонизируя её с формулировками Бытия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным тоном. Синтаксис остаётся ясным, а формулировка сохраняет образность и напряжение греческого текста.
