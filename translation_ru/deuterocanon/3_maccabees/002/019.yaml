lexical_decisions:
- source_word: προκαταλαβέτωσαν
  choice: предварят нас
  rationale: Глагол передаёт мысль о том, чтобы милости Божьи пришли прежде, своевременно встретив нужду молящихся. «Предварят» сохраняет эту направленность и допускаемую греческим неоднозначность.
- source_word: οἱ οἰκτιρμοί σου
  choice: милости Твои
  rationale: Множественное число сохранено; «милости» естественно звучит в русской молитвенной речи и обозначает проявления Божьего сострадания.
- source_word: αἰνέσεις
  choice: хвалу
  rationale: Русское собирательное единственное число естественно в обороте «вложи хвалу в уста» и передаёт смысл греческого множественного числа без неуклюжести.
- source_word: καταπεπτωκότων
  choice: павших
  rationale: Причастие перфекта описывает людей, которые пали и остаются в униженном, подавленном состоянии; краткое «павших» сохраняет образ без уточнения причины падения.
- source_word: συντετριμμένων τὰς ψυχάς
  choice: сокрушённых душой
  rationale: Передаёт греческую конструкцию со значением людей, сокрушённых в отношении души, сохраняя ψυχή как «душа» и не подменяя её «духом».
- source_word: ποιήσας ἡμῖν εἰρήνην
  choice: и даруй нам мир
  rationale: Аористное причастие при обращении к Богу естественно передано как сопутствующее повелительное прошение. «Даруй мир» ясно выражает результат действия и избегает неестественного русского «сделав нам мир».
theological_decisions:
- issue: Значение ψυχή
  choice: душой
  alternative: внутренне; духом
  rationale: «Душой» прямо сохраняет греческое ψυχή и эмоциональную силу выражения, не вводя технической антропологии и не подменяя его словом «дух».
- issue: Связь ποιήσας с основным прошением
  choice: 'отдельное сопутствующее прошение: «и даруй нам мир»'
  alternative: «даровав нам мир» или «когда даруешь нам мир»
  rationale: Греческое аористное причастие допускает оттенки сопутствующего или предшествующего действия. В молитвенном контексте русское сочинённое прошение наиболее естественно, однако не утверждает жёстко временную последовательность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавные буквы в местоимениях при обращении к Богу поддерживают традиционный русский религиозный регистр. Синтаксис сделан ясным и естественным без устранения образности оригинала.
