  source_fidelity: 'Основной смысл передан верно: οἰκτιρμοί — «милости», αἰνέσεις — «хвала», καταπεπτωκότων — «павшие», ψυχαί — «душа», εἰρήνη — «мир». «И даруй нам мир» является допустимой русской передачей аористного причастия ποιήσας в цепи молитвенных прошений. Однако «предварят нас» в современном литературном русском воспринимается как книжное и не вполне прозрачное, а объяснение альтернативы в сноске а неудачно формулирует образ оригинала. Сноска b с выражением «в отношении душ» не является естественным или ясным русским буквальным пояснением.'
