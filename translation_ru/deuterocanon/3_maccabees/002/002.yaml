base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/002.yaml
  text: For you are the one who created all things and rules over all; you are a righteous sovereign[a], and you judge those who do anything in insolence and arrogance.
translation:
  language: ru
  text: Ибо Ты — Тот, Кто сотворил всё и владычествует над всем. Ты — праведный Владыка[a] и судишь тех, кто с дерзостью и высокомерием совершает что бы то ни было.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливый Правитель». Греческое δίκαιος может означать как «праведный», так и «справедливый», а δυνάστης — «владыка» или «правитель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ γὰρ εἶ
  choice: Ибо Ты —
  rationale: «Ибо» передаёт пояснительную связь γάρ с ходом молитвы; явное σὺ сохраняется местоимением «Ты» и конструкцией с тире.
- source_word: ὁ κτίσας τὰ πάντα
  choice: Тот, Кто сотворил всё
  rationale: Субстантивированное причастие передано личной конструкцией, сохраняющей и обращение, и совершённое творческое действие; τὰ πάντα естественно передаётся как «всё».
- source_word: τῶν ὅλων ἐπικρατῶν
  choice: владычествует над всем
  rationale: ἐπικρατέω обозначает обладание властью и господство; «владычествует» соответствует возвышенному молитвенному регистру и выражает деятельное правление.
- source_word: δυνάστης
  choice: Владыка
  rationale: Слово обозначает обладающего властью правителя. «Владыка» естественно звучит в обращённой к Богу молитве и не столь архаично, как «властитель».
- source_word: δίκαιος
  choice: праведный
  rationale: «Праведный» сохраняет широкую нравственную характеристику Бога, не сводя значение лишь к судебной беспристрастности; вариант «справедливый» также возможен.
- source_word: τοὺς ὕβρει καὶ ἀγερωχίᾳ τι πράσσοντας
  choice: тех, кто поступает дерзко и высокомерно
  rationale: Русская наречная конструкция естественно передаёт образ действия. Неопределённое τι не выражено отдельным словом, поскольку «делает что-либо дерзко» звучало бы тяжеловесно, но общий характер поведения сохраняется.
- source_word: κρίνεις
  choice: судишь
  rationale: «Судишь» сохраняет основное судебное значение κρίνω, не усиливая его до однозначного «осуждаешь».
theological_decisions:
- issue: Передача δίκαιος при описании Божьего владычества и суда
  choice: праведный
  alternative: справедливый
  rationale: Оба варианта допустимы. «Праведный» сохраняет более широкий нравственный смысл, тогда как «справедливый» яснее подчёркивает судебный аспект; следующий глагол «судишь» уже выражает этот аспект.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Заглавные буквы в «Ты», «Тот», «Кто» и «Владыка» поддерживают традиционный русский регистр обращения к Богу; синтаксис остаётся ясным и не перегруженным.
