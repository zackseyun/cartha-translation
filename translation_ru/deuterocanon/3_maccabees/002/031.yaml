    text: 'Или: «опоры благочестия города»; греческое слово буквально обозначает основания, опоры или ступени и здесь употреблено метафорически.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  choice: некоторые
  rationale: Неопределённое обозначение части людей; естественно и точно по-русски.
- source_word: ἐπιπολαίως
  choice: легкомысленно
  rationale: Передаёт поверхностное, неосмотрительное отношение, не усиливая его до безрассудства.
- source_word: στυγοῦντες
  choice: презрев
  rationale: Сохраняет сильную отрицательную оценку и в данном контексте естественнее буквального «возненавидев».
- source_word: ἐπιβάθρας
  choice: устои
  rationale: Сохраняет метафору опор или оснований и хорошо сочетается с общественным благочестием города.
- source_word: τὰς τῆς πόλεως εὐσεβείας
  choice: благочестия города
  rationale: Передаёт религиозную преданность и установившиеся благочестивые порядки города, не сводя значение к религии как институту.
- source_word: εὐχερῶς
  choice: охотно
  rationale: В контексте добровольного действия выражает готовность и отсутствие колебаний.
- source_word: ἑαυτοὺς ἐδίδοσαν
  choice: отдавали себя
  rationale: Сохраняет возвратную конструкцию и оттенок добровольного предоставления себя.
- source_word: κοινωνήσοντες
  choice: им предстояло обрести
  rationale: В сочетании с εὐκλείας передаёт ожидаемую причастность к славе естественной русской конструкцией.
- source_word: εὐκλείας
  choice: славу
  rationale: Обозначает доброе имя, почёт и общественную известность; «слава» здесь употреблена в светском, а не техническом богословском смысле.
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: благодаря будущему общению с царём
  rationale: Передаёт ожидаемые отношения или пребывание в обществе царя, не предполагая близкой дружбы.
theological_decisions:
- issue: Передача εὐσεβείας в гражданско-религиозном контексте
  choice: благочестия города
  alternative: религиозных обычаев города
  rationale: «Благочестие» сохраняет нравственно-религиозный смысл греческого слова и допускает как внутреннюю преданность, так и её общественные проявления.
