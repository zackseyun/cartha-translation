base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/009.yaml
  text: And because I love the house of Israel[a], I have promised that if a turning away comes upon us and distress overtakes us, and we come to our place and pray[b], I will hear our prayer.
translation:
  language: ru
  text: И, любя дом Израиля, Ты обещал, что, если среди нас произойдёт отступление[a] и нас постигнет бедствие, а мы придём в наше место и обратимся с мольбой, Ты услышишь нашу молитву.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отпадение»; греческое слово может обозначать отход, отвращение или отступничество.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте стоят формы второго лица: «Ты обещал… Ты услышишь». Такая формулировка сохраняет обращение молящегося к Богу; встречающееся понимание этих слов как речи от первого лица не соответствует данным здесь греческим формам.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαπῶν
  choice: любя
  rationale: Причастие передано прямо, без добавления причинного значения, которого грамматическая форма сама по себе не требует.
- source_word: οἶκον τοῦ Ἰσραήλ
  choice: дом Израиля
  rationale: Сохранено традиционное библейское обозначение всего народа как единого дома.
- source_word: ἐπηγγείλω
  choice: Ты обещал
  rationale: Греческая форма — второе лицо единственного числа аориста; говорящий обращается к Богу.
- source_word: ἀποστροφή
  choice: отступление
  rationale: Слово обозначает отвращение, отход или отступничество; «отступление» сохраняет смысловую широту и не превращает выражение в узкий технический термин.
- source_word: καταλάβῃ ἡμᾶς στενοχωρία
  choice: нас постигнет бедствие
  rationale: Передаёт образ бедствия, настигающего людей, естественным современным русским языком.
- source_word: τὸν τόπον ἡμῶν
  choice: наше место
  rationale: Греческий текст буквально говорит о «нашем месте»; возможная отсылка к храму не конкретизирована словом «святилище».
- source_word: δεηθῶμεν
  choice: обратимся с мольбой
  rationale: Глагол выражает именно просительную молитву; формулировка сохраняет этот оттенок.
- source_word: εἰσακούσῃ τῆς δεήσεως ἡμῶν
  choice: Ты услышишь нашу молитву
  rationale: Форма εἰσακούσῃ — второе лицо единственного числа и означает благосклонно услышать просьбу.
theological_decisions:
- issue: Лицо глаголов обещания и ответа на молитву
  choice: «Ты обещал… Ты услышишь» как обращение к Богу во втором лице
  alternative: «Я обещал… Я услышу» как прямая божественная речь
  rationale: Формы ἐπηγγείλω и εἰσακούσῃ в представленном греческом тексте являются формами второго лица единственного числа. Поэтому сохранено молитвенное обращение к Богу, несмотря на расхождение с английским консультационным слоем.
- issue: Характер ἀποστροφή
  choice: Нейтрально-широкое «отступление»
  alternative: Более терминологическое «вероотступничество» или образное «отвращение»
  rationale: Контекст допускает религиозное отпадение, но не требует сужать многозначное греческое слово до строго технического богословского термина.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавное «Ты» употреблено как традиционная русская форма почтительного обращения к Богу. Буквальное «наше место» сохранено ради исходной неопределённости, хотя по контексту возможно указание на храм.
