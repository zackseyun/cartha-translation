  yaml_path: translation/deuterocanon/3_maccabees/002/016.yaml
  text: Do not punish us for their uncleanness[a], nor call us to account for profanation, lest the lawless boast in their wrath and exult in the pride of their tongue, saying[b],
translation:
  language: ru
  text: 'Не карай нас за их нечистоту[a] и не призывай нас к ответу за осквернение[b], чтобы беззаконники не хвалились в своём гневе и не ликовали в надмении своего языка, говоря:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не взыскивай с нас за их нечистоту». Греческий глагол может означать свершение правосудия или возмездие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за поругание святыни». Греческое слово обозначает обращение со святым как с обыденным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδίκησῃς
  choice: не карай
  rationale: Глагол может обозначать свершение правосудия, возмездие или наказание. В обращённой к Богу просьбе «не карай нас» естественно передаёт направленное на молящихся воздаяние, не приписывая Богу личной мстительности.
- source_word: ἀκαθαρσίᾳ
  choice: нечистоту
  rationale: Слово охватывает ритуальную и нравственную нечистоту; «нечистота» сохраняет религиозно-культовый оттенок.
- source_word: εὐθύνῃς
  choice: не призывай нас к ответу
  rationale: Передаёт судебный смысл требования отчёта или ответственности точнее, чем общее «не суди».
- source_word: βεβηλώσει
  choice: осквернение
  rationale: Обозначает профанацию священного, обращение со святым как с обыденным; выбор отличает это понятие от предшествующей «нечистоты».
- source_word: παράνομοι
  choice: беззаконники
  rationale: Сохраняет нравственно-правовой смысл людей, поступающих вопреки закону.
- source_word: καυχήσωνται
  choice: не хвалились
  rationale: Передаёт хвастовство или превозношение и сохраняет отличие от следующего глагола бурной радости.
- source_word: ἀγαλλιάσωνται
  choice: не ликовали
  rationale: Выражает сильную, торжествующую радость и подходит возвышенному строю молитвы.
- source_word: θυμῷ αὐτῶν
  choice: в своём гневе
  rationale: θυμός здесь естественно обозначает гнев или ярость; «гнев» сохраняет силу выражения без излишнего усиления.
- source_word: ὑπερηφανίᾳ γλώσσης αὐτῶν
  choice: в надмении своего языка
  rationale: Сохраняет образ языка из греческого текста и передаёт высокомерие речи, не сводя выражение к пересказу «в своих надменных речах».
theological_decisions:
- issue: Относится ли τούτων к враждебным людям, чьи нечистота и осквернение не должны быть вменены молящимся
  choice: Передано личным местоимением «их», относящимся к противникам, далее названным беззаконниками.
  alternative: Понять τούτων отвлечённо как «этого» или «этих вещей».
  rationale: Противопоставление «нас» и «беззаконников» поддерживает личный референт. Перевод сохраняет просьбу не возлагать на молящихся последствия чужой нечистоты, не уточняя сверх текста механизм этой ответственности.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксический параллелизм и образы греческого текста сохранены; архаизмы и конфессионально маркированные формулы не использованы.
