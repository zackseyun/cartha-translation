lexical_decisions:
- source_word: εὐέλπιδές τε καθιστήκεισαν
  choice: по-прежнему надеялись
  rationale: Передаёт устойчивое состояние ободрённой надежды; καθιστήκεισαν — плюсквамперфект со значением сложившегося и сохранявшегося состояния.
- source_word: ἀντιλήμψεως τεύξασθαι
  choice: получить помощь
  rationale: ἀντίλημψις означает помощь или поддержку, а τεύξασθαι — достичь, получить; нейтральная формулировка сохраняет неопределённость относительно источника помощи.
- source_word: τοὺς ἀποχωροῦντας ἐξ αὐτῶν
  choice: тех, кто отходил от них
  rationale: Буквально отражает продолжающееся отделение от общины, не уточняя его причины или формы.
- source_word: ἐβδελύσσοντο
  choice: гнушались
  rationale: Сохраняет сильную эмоционально-нравственную окраску греческого глагола без ослабления до простого неодобрения.
- source_word: ὡς πολεμίους τοῦ ἔθνους ἔκρινον
  choice: считали врагами народа
  rationale: Естественно передаёт судебно-оценочное ἔκρινον и коллективное значение ἔθνος в данном контексте.
- source_word: τῆς κοινῆς συναναστροφῆς καὶ εὐχρηστίας ἐστέρουν
  choice: лишали общения со всеми и взаимной поддержки
  rationale: συναναστροφή обозначает совместное общение или участие в общественной жизни; εὐχρηστία здесь, вероятно, практическую полезность, услужение или поддержку. «Взаимной поддержки» естественно передаёт социально-практический смысл, не сводя его только к товариществу.
