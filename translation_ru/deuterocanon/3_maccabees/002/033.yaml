review_pass:
  verdict: revise
  source_fidelity: 'Начальная часть передана в целом точно: εὐέλπιδες ... καθιστήκεισαν уместно выражено как сохранявшаяся надежда, а «надеялись на помощь» передаёт ἀντιλήμψεως τεύξασθαι без добавления источника помощи. «Те, кто уходил от них» точно отражает продолжающееся отделение (τοὺς ἀποχωροῦντας ἐξ αὐτῶν). Однако «общения со всеми» необоснованно конкретизирует κοινῆς («общего, совместного»), а «взаимной» добавляет к εὐχρηστίας отсутствующее в греческом указание на взаимность.'
  naturalness: Предлагаемая редакция сохраняет современный литературный строй фразы и ясные соотнесённые дополнения («их ... их»). «Питали отвращение к» естественно и передаёт силу ἐβδελύσσοντο.
  terminology: «Враги народа» соответствует τοῦ ἔθνους в данном контексте и не требует замены. Для συναναστροφή уместно «общение», а для εὐχρηστία, в соответствии с английской контрольной версией и возможным социально-практическим смыслом слова, — «поддержка». «Общего общения» намеренно сохраняет значение κοινῆς, не превращая его в «со всеми».
  issues:
  - severity: medium
    issue: «Общения со всеми»
    rationale: Греческое κοινῆς означает «общего/совместного», а не «со всеми». Такая формулировка сужает и конкретизирует смысл оригинала.
  - severity: medium
    issue: «Взаимной поддержки»
    rationale: Определение «взаимной» отсутствует в εὐχρηστίας и вводит дополнительный оттенок реципрокности.
  revised_text: Они по-прежнему надеялись на помощь, питали отвращение к тем, кто уходил от них, считали их врагами народа и лишали их общего общения и поддержки.
