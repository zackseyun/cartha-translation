lexical_decisions:
- source_word: ταχέως
  choice: быстро
  rationale: Передаёт наречие образа действия прямо и естественно, сохраняя значение стремительности.
- source_word: αὐτὸν
  choice: его
  rationale: Прямое соответствие объектному местоимению мужского рода в единственном числе.
- source_word: ἐξείλκυαν
  choice: вытащили
  rationale: Глагол обозначает вытягивание наружу; «вытащили» естественно передаёт направленность и физическое усилие, не усиливая текст до непременно жестокого волочения.
- source_word: καταπεπληγμένοι
  choice: охваченные
  rationale: Перфектное причастие описывает устойчивое состояние сильной поражённости; в сочетании со страхом по-русски естественно «охваченные страхом».
- source_word: ὑπερβάλλοντι φόβῳ
  choice: безмерным страхом
  rationale: ὑπερβάλλοντι усиливает φόβῳ как страх, превосходящий обычную меру; «безмерным» кратко и литературно сохраняет эту интенсивность.
