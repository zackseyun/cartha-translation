  yaml_path: translation/deuterocanon/3_maccabees/002/024.yaml
  text: But after some time[a], when he had recovered himself, he in no way came to regret it when he was rebuked; rather, having issued a bitter threat[b], he departed.
translation:
  language: ru
  text: Но некоторое время спустя, придя в себя[a], он, когда его упрекнули, нисколько не раскаялся[b], а, высказав суровую угрозу, удалился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально выражение можно понять как «собрав себя»; по смыслу, вероятно, имеется в виду, что он оправился и вновь обрёл самообладание.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «нисколько не изменил своего решения». Греческое выражение может означать как отсутствие раскаяния, так и отказ пересмотреть намерение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν χρόνῳ δὲ ὕστερον
  choice: Но спустя некоторое время
  rationale: Передаёт более поздний момент повествования и лёгкий противительный оттенок δέ.
- source_word: ἀναλεξάμενος αὐτόν
  choice: придя в себя
  rationale: В данном контексте оборот, вероятнее всего, означает, что царь оправился после предшествовавшего потрясения; по-русски это естественно передаётся выражением «прийти в себя».
- source_word: οὐδαμῶς εἰς μετάμελον ἦλθεν
  choice: нисколько не раскаялся
  rationale: Сохраняет буквальный образ прихода к сожаленью или раскаянию и не исключает оттенка отказа пересмотреть своё решение.
- source_word: ἐπιτιμηθείς
  choice: даже получив порицание
  rationale: Передаёт аористное страдательное причастие и подчёркивает, что обращённое к нему порицание не вызвало раскаяния.
- source_word: μετὰ ἀπειλῆς δὲ πικρᾶς θέμενος
  choice: а, высказав суровую угрозу
  rationale: Сочетание θέμενος с ἀπειλή идиоматически означает произнести или высказать угрозу; «суровую» естественно передаёт πικρᾶς в значении жестокости и резкости.
- source_word: ἀνέλυσεν
  choice: удалился
  rationale: В повествовательном контексте глагол означает уйти или удалиться; выбран dignified, но современный русский эквивалент.
theological_decisions:
- issue: Значение выражения εἰς μετάμελον ἦλθεν
  choice: нисколько не раскаялся
  alternative: нисколько не изменил своего решения
  rationale: Греческое выражение допускает как нравственное сожаление, так и пересмотр намерения; основной текст сохраняет более прямой оттенок раскаяния, а примечание отмечает альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис сохраняет последовательность греческих причастных конструкций, но адаптирован для ясного русского чтения; архаизмы и конфессионально окрашенная терминология не используются.
