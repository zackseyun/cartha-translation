  yaml_path: translation/deuterocanon/3_maccabees/002/011.yaml
  text: For even when our fathers were often afflicted[b][a], you helped them in their humiliation and rescued them from great evils.
translation:
  language: ru
  text: Ибо, когда отцы наши[a] не раз страдали, Ты помог им в их унижении и избавил их от великих бед[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предки наши». В греческом тексте буквально: «отцы наши».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «великих бедствий» или «великих несчастий». Греческое слово может означать также «зло», но здесь, вероятно, речь идёт о тяжёлых пагубных обстоятельствах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ δὲ
  choice: Ибо, когда
  rationale: Сочетание вводит основание в молитвенном рассуждении; по-русски связь естественно передаётся причинным «ибо», а зависимый оборот с причастием — придаточным времени.
- source_word: πλεονάκις
  choice: не раз
  rationale: Передаёт неоднократность происходившего и звучит естественно в современном литературном русском языке.
- source_word: θλιβέντων
  choice: терпели притеснения
  rationale: θλίβω обозначает давление, угнетение или бедственное положение. Перевод сохраняет общий характер страдания, не сводя его к одному конкретному виду гонений.
- source_word: τῶν πατέρων ἡμῶν
  choice: отцы наши
  rationale: Буквально сохраняет мужское множественное πατέρων и возвышенный молитвенный регистр; значение «предки» указано в примечании.
- source_word: ἐβοήθησας αὐτοῖς
  choice: Ты помог им
  rationale: Прямо и ясно передаёт значение βοηθέω — помогать, приходить на помощь.
- source_word: ἐν τῇ ταπεινώσει
  choice: в их унижении
  rationale: Сохраняет значение состояния униженности или низведения, не смешивая ταπείνωσις с уже выраженным θλιβέντων притеснением.
- source_word: ἐρρύσω
  choice: избавил
  rationale: ῥύομαι означает избавить или спасти от опасности; «избавил» естественно сочетается с конструкцией «от бед» и не вносит дополнительных сотериологических оттенков.
- source_word: ἐκ μεγάλων κακῶν
  choice: от великих бед
  rationale: В данном контексте κακά обозначает тяжёлые бедствия и пагубные обстоятельства. «Беды» естественнее по-русски, тогда как более буквальное «зло» могло бы ошибочно восприниматься только как нравственное зло.
theological_decisions:
- issue: Обозначение предков словом πατέρων
  choice: отцы наши
  alternative: предки наши
  rationale: Основной текст сохраняет явно мужскую форму греческого источника, а более общее контекстуальное значение отмечено в сноске.
- issue: Значение κακῶν в молитве об историческом избавлении
  choice: великие беды
  alternative: великие бедствия; великие несчастья; великие беды и зло
  rationale: Слово может обозначать как зло, так и пагубные обстоятельства. Контекст говорит прежде всего о тяжёлых бедствиях, но перевод не должен приписывать ему исключительно нравственный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Обращение к Богу передано местоимением «Ты» с прописной буквы. Синтаксис сделан естественным для русского языка без устранения смысловой широты слов ταπείνωσις и κακά.
