  text: and that those who registered should also be branded on the body with the ivy-leaf emblem of Dionysus by fire[c][b][a], and should also be enrolled in his reduced status of authority.
translation:
  language: ru
  text: а тех, кто записывался[a], клеймить огнём, нанося на теле отличительный знак Диониса — лист плюща[b], — и вносить их в разряд лиц с ограниченным правовым положением[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кого вносили в списки»; греческая форма допускает оба оттенка.'
    reason: lexical_alternative
  - marker: b
    text: Лист плюща был отличительным знаком, связанным с культом Диониса; здесь речь идёт о выжигаемом на теле клейме.
    reason: cultural_note
  - marker: c
    text: 'Греческое выражение сжато и не вполне ясно; возможно также: «в разряд лиц с ограниченным гражданским статусом» или «с урезанными законными правами».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπογραφομένους
  choice: тех, кто записывался
  rationale: Причастие среднего/страдательного залога может обозначать как самостоятельную регистрацию, так и внесение в списки. Основной вариант естественно передаёт административный смысл, а неоднозначность отмечена в сноске.
- source_word: χαράσσεσθαι καὶ διὰ πυρὸς εἰς τὸ σῶμα
  choice: выжигать огнём на теле
  rationale: Сочетание глагола со словами «огнём» указывает на принудительное клеймение; «выжигать» по-русски ясно передаёт способ нанесения телесного знака.
- source_word: παρασήμῳ Διονύσου κισσοφύλλῳ
  choice: знак Диониса — лист плюща
  rationale: παράσημον означает отличительный знак или эмблему, а κισσόφυλλον конкретизирует его как лист плюща. Тире естественно выражает пояснительное отношение между знаком и его изображением.
- source_word: προκαταχωρίσαι
  choice: заранее вносить
  rationale: Глагол обозначает предварительное официальное внесение в список или категорию; выбранный вариант сохраняет значение приставки προ- и административный оттенок.
- source_word: προσυνεσταλμένην αὐθεντίαν
  choice: ограниченное правовое положение
  rationale: 'Сочетание сжато и не вполне ясно: συνεσταλμένην указывает на сужение или ограничение, а αὐθεντία здесь, вероятно, относится к статусу, правам или полномочиям. Перевод передаёт вероятный юридико-общественный смысл, не сводя его к одной конкретной гражданской категории.'
theological_decisions:
- issue: Культовое клеймо, связанное с Дионисом
  choice: Сохранить прямое упоминание Диониса и листа плюща как его знака.
  alternative: Передать обобщённо как языческое клеймо.
  rationale: Греческий текст прямо называет Диониса и конкретный отличительный знак; обобщение устранило бы важную историко-религиозную деталь.
- issue: Неясное административно-правовое выражение προσυνεσταλμένην αὐθεντίαν
  choice: Передать как «ограниченное правовое положение» и отметить неопределённость в сноске.
  alternative: «ограниченный гражданский статус» или «урезанные законные права».
  rationale: Контекст указывает на понижение общественно-правового положения, однако греческая формулировка не позволяет уверенно уточнить, идёт ли речь именно о гражданстве, правах или полномочиях.
translation_notes:
  register: Современный литературный русский язык с официально-административным оттенком, соответствующим формулировке царского указа. Синтаксис сохраняет зависимость от предшествующего контекста стиха; культовая и юридическая терминология передана понятно, но без конфессиональных уточнений.
