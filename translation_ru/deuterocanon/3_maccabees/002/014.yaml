lexical_decisions:
- source_word: κατοικητήριόν
  choice: обитель
  rationale: Существительное обозначает место пребывания или жилище. «Обитель» естественно для возвышенной молитвенной речи и сохраняет конкретный смысл места пребывания.
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: небо небес
  rationale: Библейское выражение передаёт семитскую превосходную степень и указывает на высочайшее небо. Русская форма «небо небес» сохраняет образ и межтекстовые связи, оставаясь понятной современному читателю.
- source_word: ἀνέφικτος
  choice: недоступное
  rationale: Прилагательное означает то, чего нельзя достичь или к чему нельзя получить доступ. «Недоступное» точно передаёт смысл и согласуется с существительным «небо».
- source_word: ἀνθρώποις
  choice: людям
  rationale: Дательный падеж обозначает человечество вообще, а не только мужчин; «людям» точно и естественно передаёт этот общий смысл.
theological_decisions:
- issue: Передача семитского превосходного оборота οὐρανὸς τοῦ οὐρανοῦ
  choice: небо небес
  alternative: высочайшее небо
  rationale: Буквально-идиоматическая форма сохраняет библейскую образность и богословское указание на запредельную обитель Бога, не сводя выражение к пояснительному пересказу.
- issue: Общий смысл ἀνθρώποις
  choice: людям
  alternative: человеку
  rationale: Греческое множественное число относится ко всем людям; перевод не вводит мужской исключительности и не меняет объём значения.
- issue: Связь μὲν с последующим противопоставлением
  choice: не выражать отдельным оборотом в данном стихе
  alternative: с одной стороны
  rationale: Частица μὲν готовит продолжение мысли, однако изолированное «с одной стороны» в русском стихе звучало бы неполно и тяжеловесно. Связующий смысл поддержан начальным «ведь», без устранения возможного противопоставления в дальнейшем контексте.
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным оттенком. Местоимение «Твоя» написано с прописной буквы как обращение к Богу. Порядок слов близок к греческому, но естественен по-русски.
