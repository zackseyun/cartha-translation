  source_fidelity: 'Основной смысл передан верно: сохранены эпитет Бога, благосклонное услышание моления, образ бичевания и нравственно отрицательная характеристика наказанного. Однако «поразил бичом» ослабляет прямое значение ἐμάστιξεν («бичевал, подверг бичеванию»), а «превозносился великой наглостью и дерзостью» синтаксически и семантически неудачно передаёт μεγάλως ἐπηρμένον ὕβρει καὶ θράσει.'
