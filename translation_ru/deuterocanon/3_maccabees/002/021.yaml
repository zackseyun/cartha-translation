  terminology: «Праотец» — допустимое торжественное соответствие προπάτωρ; сноска уместно предупреждает об unusual титуле. «Святой ... среди святых» сохраняет вероятное личное прочтение ἐν ἁγίοις, а альтернативное местное прочтение надлежащим образом вынесено в сноску. «Законное моление» приемлемо для ἐνθέσμου λιτανείας.
