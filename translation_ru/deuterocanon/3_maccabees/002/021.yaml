  text: There the God who watches over all[a], the holy forefather among the holy ones, having heard the lawful supplication, scourged him who had been greatly puffed up with insolence and boldness[b],
translation:
  language: ru
  text: Там Бог, надзирающий за всем, святой Праотец[a] среди святых[b], услышав законное моление, бичевал того, кто был чрезвычайно надменен, исполнен наглости и дерзости.
  philosophy: optimal-equivalence
  footnotes:
