  - severity: medium
    issue: «Оставлены в немощи» для παρείμεθα ἐν ἀδυναμίαις
    rationale: Фраза может подразумевать, что Бог или иной субъект оставил народ. В греческом выражено их состояние слабости; «пребываем в бессилии» не добавляет предполагаемого деятеля.
