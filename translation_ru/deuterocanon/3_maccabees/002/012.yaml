lexical_decisions:
- source_word: ἰδοὺ δὲ νῦν
  choice: Но вот теперь
  rationale: Сохраняет указательное и переходное значение выражения, естественно звуча по-русски.
- source_word: ἅγιε Βασιλεῦ
  choice: святой Царь
  rationale: Прямое обращение к Богу с сохранением звательного смысла и возвышенного регистра.
- source_word: καταπονούμεθα
  choice: нас угнетают
  rationale: 'Передаёт пассивное значение настоящего времени: терпеть притеснение, изнурение или тяготы.'
- source_word: ὑπετάγημεν
  choice: мы покорены
  rationale: Отражает совершившееся подчинение чужой власти без уточнения не названного деятеля.
- source_word: παρείμεθα ἐν ἀδυναμίαις
  choice: оставлены в немощи
  rationale: Сохраняет пассивную форму и состояние бессилия; множественное ἀδυναμίαις естественно передано собирательным русским существительным.
theological_decisions:
- issue: Связь бедствий с грехами народа
  choice: из-за наших многих и великих грехов
  alternative: за наши многие и великие грехи
  rationale: Греческое διά с винительным выражает причинную связь; формулировка не добавляет к тексту более узкого толкования о непосредственном воздаянии.
- issue: Адресат молитвы
  choice: святой Царь
  alternative: Святой Царь
  rationale: Сохранён божественный титул в прямом обращении; строчная буква у прилагательного соответствует обычной русской орфографии внутри обращения и не снижает его богословского смысла.
translation_notes:
  register: Современный литературный русский язык с молитвенно-возвышенным, но понятным регистром. Синтаксический параллелизм трёх бедствий сохранён; подлинная пассивность форм не разрешена добавлением действующего лица.
