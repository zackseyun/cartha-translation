  source_fidelity: Греческая последовательность трёх страдательных состояний в целом передана верно. Однако παρείμεθα ἐν ἀδυναμίαις описывает наличное состояние изнеможения/бессилия; «оставлены в немощи» может звучать как добавление идеи оставленности. Более прямое «мы пребываем в бессилии» сохраняет состояние без такого оттенка.
  naturalness: «Подчинены нашим врагам» естественно и точнее передаёт ὑπετάγημεν, чем «покорены нашим врагам». Колон после обращения делает причинно-следующую связь и молитвенный синтаксис яснее.
  terminology: «Святой Царь» адекватно передаёт ἅγιε Βασιλεῦ и сохраняет возвышенное обращение. «Великих грехов» соответствует πολλὰς καὶ μεγάλας без интерпретативного усиления.
