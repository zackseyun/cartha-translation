  yaml_path: translation/deuterocanon/3_maccabees/005/011.yaml
  text: But the age-old ordinance of time[a], beautifully alternating in night and day by the One who grants sleep to all, to whomever he himself wills, sent a portion of sleep upon the king[b];
translation:
  language: ru
  text: Но издревле сотворённое устроение времени[a], прекрасное в чередовании ночи и дня и даруемое Тем, Кто дарует всем, кому Сам пожелает, послало царю долю сна[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «издревле сотворённое творение времени». Греческое выражение краткое и поэтическое; оно говорит об издавна существующем сотворённом порядке времени, проявляющемся в ночи и дне.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «послало часть сна к царю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἀπʼ αἰῶνος κτίσμα χρόνου
  choice: издревле существующее установление времени
  rationale: κτίσμα буквально обозначает созданное или творение, но в сочетании с χρόνου и упоминанием ночи и дня здесь поэтически указывает на издавна установленный порядок времени. «Установление» передаёт контекстуальный смысл, не превращая выражение в отвлечённый «ход времени»; буквальная возможность отмечена в сноске.
- source_word: καλὸν
  choice: прекрасно
  rationale: Сохраняет эстетическую и поэтическую силу καλός; наречная форма естественно связывается с последующим причастным оборотом.
- source_word: ἐν νυκτὶ καὶ ἡμέρᾳ ἐπιβαλλόμενον
  choice: являющее себя в смене ночи и дня
  rationale: ἐπιβάλλω передаёт образ наступления или проявления; формулировка сохраняет этот образ и одновременно ясно выражает повторяющийся ритм ночи и дня.
- source_word: ὑπὸ τοῦ χαριζομένου πᾶσιν
  choice: по воле Того, Кто дарует сон всем
  rationale: Причастие указывает на Бога как щедрого Дарителя; «сон» восполняет подразумеваемый из контекста объект. «По воле» естественно передаёт божественную обусловленность, выраженную ὑπό, в сложной поэтической конструкции.
- source_word: οἷς ἂν αὐτὸς θελήσῃ
  choice: кому Сам пожелает
  rationale: Сохраняет неопределённость конструкции с ἄν, свободу решения и эмфатическое αὐτός.
- source_word: ὕπνον μέρος
  choice: долю сна
  rationale: Буквально сохраняет конкретный образ «части, доли сна», не сводя его просто к «сну».
- source_word: ἀπέστειλεν εἰς τὸν βασιλέα
  choice: ниспослало царю
  rationale: «Ниспослало» уместно для поэтического описания дара свыше; дательный падеж естественно передаёт направление εἰς τὸν βασιλέα.
theological_decisions:
- issue: Неявное указание на Бога в τοῦ χαριζομένου πᾶσιν
  choice: Того, Кто дарует сон всем
  alternative: того, кто милостиво дарует всем
  rationale: Контекст позволяет распознать Бога, поэтому местоимение написано с прописной буквы; при этом не добавляется отсутствующий в греческом тексте божественный титул. Подразумеваемый объект «сон» восполнен ради ясности.
- issue: Значение ἀπʼ αἰῶνος
  choice: издревле существующее
  alternative: вечное; существующее от века
  rationale: Передаёт древность и давнюю установленность порядка, не усиливая выражение до метафизического утверждения о безначальной вечности.
- issue: Поэтическая персонификация порядка времени
  choice: установление времени ... ниспослало
  alternative: Бог через установленный ход времени ниспослал
  rationale: Сохранён грамматический субъект греческого текста и его поэтическое напряжение; Бог не подставлен в качестве прямого субъекта глагола ἀπέστειλεν.
translation_notes:
  register: Современный литературный русский с достоинством и умеренно поэтическим строем. Необычная персонификация установленного порядка времени сохранена, но синтаксис сделан понятным для широкого читателя.
