  source_fidelity: В черновике верно сохранены поэтический субъект («установление времени») и «доля сна», однако «по воле Того» не передаёт ὑπό («Тем, Кто…») и синтаксически переносит обусловленность на явление смены ночи и дня. Кроме того, греческий причастный оборот не называет «сон» прямым объектом χαριζομένου; восполнять его в самом стихе не следует.
  naturalness: «Прекрасно являющее себя» звучит искусственно и не вполне ясно. Исправленный вариант сохраняет намеренно возвышенную, несколько необычную поэтическую персонификацию, но строится яснее для современного литературного русского.
  terminology: «Сотворённое устроение времени» точнее сохраняет образ κτίσμα, не сводя его к юридическому «установлению». Прописное «Тем, Кто» допустимо как контекстуальное указание на Бога, без добавления титула. Неявный объект «дарует» сохранён нераскрытым, как в греческом.
