revisions:
- from: Но издревле существующее установление времени[a], прекрасно являющее себя в смене ночи и дня по воле Того, Кто дарует сон всем, кому Сам пожелает, ниспослало царю долю сна[b].
  to: Но издревле сотворённое устроение времени[a], прекрасное в чередовании ночи и дня и даруемое Тем, Кто дарует всем, кому Сам пожелает, послало царю долю сна[b].
