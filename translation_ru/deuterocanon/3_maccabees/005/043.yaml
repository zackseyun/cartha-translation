  terminology: «Иудея», «святилище», «огнём и копьём» и «жертвы» сохранены. «Недоступное для нас» адекватно передаёт ἄβατον ἡμῖν; буквальный образ вступания и вариант с запретом на вход должны остаться в сноске как лексические возможности.
