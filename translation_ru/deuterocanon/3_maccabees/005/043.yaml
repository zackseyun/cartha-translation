  source_fidelity: 'Начальное «А выступив походом» неоправданно превращает греческое причастие в простое временное обстоятельство. В данном контексте, согласно синтаксической функции в передаваемой речи, требуется условно-перспективная передача: «если он пойдёт войной». Вторая формула быстроты (ἐν τάχει) должна быть выражена именно при сожжении. «Предав огню» точно передаёт πυρὶ πρήσαντα; «приносит там жертвы» естественно передаёт συντελούντων ἐκεῖ θυσίαν.'
