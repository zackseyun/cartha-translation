  text: Then the king[a], having arranged the whole banquet according to the same rules, urged them to turn to rejoicing.
translation:
  language: ru
  text: Царь же, устроив весь пир по тем же правилам[a], призывал всех предаться веселью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по тем же законам». Греческое νόμοι может означать законы, правила или установленные порядки; контекст пира указывает скорее на практические правила его проведения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τοὺς αὐτοὺς νόμους
  choice: по тем же правилам
  rationale: Κατά с винительным выражает соответствие чему-либо; νόμοι здесь, в контексте устройства пира, естественно понимать как установленные правила или порядки. Частица δέ передана перестановкой «же» после подлежащего.
- source_word: συστησάμενος
  choice: устроив
  rationale: 'Причастие обозначает предшествующее действие царя: он организовал и привёл пир в должный порядок. «Устроив» кратко и естественно передаёт этот смысл.'
- source_word: πᾶν τὸ συμπόσιον
  choice: весь пир
  rationale: συμπόσιον обозначает пир или праздничное застолье; «пир» сохраняет исторический колорит и остаётся понятным современному читателю. πᾶν передано словом «весь».
- source_word: εἰς εὐφροσύνην τραπῆναι
  choice: предаться веселью
  rationale: Оборот буквально описывает переход к радости или веселью. Русское выражение «предаться веселью» естественно передаёт направленность εἰς и идиоматический смысл пассивной формы τραπῆναι.
- source_word: παρεκάλει
  choice: призывал всех
  rationale: παρακαλέω здесь означает побуждать или настойчиво приглашать. «Призывал» сохраняет силу глагола; «всех» эксплицирует подразумеваемых участников пира без изменения смысла.
