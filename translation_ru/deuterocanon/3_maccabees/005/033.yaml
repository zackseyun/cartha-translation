lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Кратко передаёт значение следствия или образа действия и естественно связывает стих с предшествующим повествованием.
- source_word: ὁ Ἕρμων
  choice: Ермон
  rationale: Традиционная русская передача греческого личного имени Ἕρμων.
- source_word: ἀπροσδόκητον
  choice: неожиданную
  rationale: Передаёт то, чего не ожидали или не предвидели.
- source_word: ἐπικίνδυνον
  choice: опасную
  rationale: Сохраняет прямое значение опасности, не ослабляя его до общего значения суровости.
- source_word: ὑπήνεγκεν
  choice: пришлось вынести
  rationale: Передаёт переживание и перенесение направленной на Ермона угрозы; безличная конструкция естественна по-русски и не приписывает ему большего самообладания, чем выражено в контексте.
- source_word: ἀπειλήν
  choice: угрозу
  rationale: Прямой и стилистически нейтральный русский эквивалент.
- source_word: τῇ ὁράσει καὶ τῷ προσώπῳ
  choice: и видом, и лицом
  rationale: Сохраняет два близких, но не полностью тождественных обозначения внешнего облика и лица.
- source_word: συνεστάλη
  choice: весь сник
  rationale: Передаёт заметную внешнюю подавленность, испуг или внутреннее сжатие, не сводя многозначный глагол исключительно к физическому движению либо душевному состоянию.
