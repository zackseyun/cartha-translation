lexical_decisions:
- source_word: μεσούσης δὲ ἤδη ἑκάτης ὥρας σχεδόν
  choice: Когда уже приближалась середина шестого часа
  rationale: Сохранён древний способ обозначения времени; μεσούσης и σχεδόν передают приближение к середине часа, а ἤδη — значение «уже».
- source_word: ὁ πρὸς ταῖς κλήσεσιν τεταγμένος
  choice: человек, назначенный ведать вызовами
  rationale: τεταγμένος указывает на назначение к определённой обязанности, а κλήσεις в данном административном контексте означает вызовы; перевод не уточняет должность сверх сказанного в греческом тексте.
- source_word: ἀθρόους τοὺς κλητούς
  choice: вызванные собрались плотной толпой
  rationale: ἀθρόους изображает людей собранными вместе в единую массу; «плотной толпой» естественно и зримо передаёт эту деталь.
- source_word: ἔνευσε
  choice: подал ему знак
  rationale: Глагол обозначает знак, поданный кивком или жестом, но сам вид жеста не уточнён, поэтому двусмысленность сохранена.
- source_word: προσελθὼν τὸν βασιλέα
  choice: подошёл к царю
  rationale: Причастие передано последовательным личным действием, естественным для русского повествования.
