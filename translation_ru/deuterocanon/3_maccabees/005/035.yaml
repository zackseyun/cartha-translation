base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/035.yaml
  text: And the Jews[a], when they heard what came from the king, were praising the manifest God, the Lord, the King of kings, since they had obtained this help from him.
translation:
  language: ru
  text: Иудеи же, услышав то, что исходило от царя, восхваляли явившего Себя Бога, Господа, Царя царствующих[a], поскольку обрели от Него эту помощь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «Царя царей». Буквально по-гречески: «Царя царствующих».'
    reason: Сноска сохраняет одновременно идиоматический русский титул и формальную особенность греческого причастия βασιλευόντων.
lexical_decisions:
- source_word: οἱ τε Ἰουδαῖοι
  choice: Иудеи же
  rationale: Частица τε связывает этот эпизод с предшествующим повествованием; русское «же» естественно передаёт продолжение и смену участников.
- source_word: τὰ παρὰ τοῦ βασιλέως
  choice: то, что исходило от царя
  rationale: Оборот обозначает слова, сообщение или распоряжение, пришедшее от царя; перевод сохраняет широту выражения и не уточняет его как формальный указ.
- source_word: ἀκούσαντες
  choice: услышав
  rationale: Аористное причастие передаёт действие, предшествующее восхвалению, и естественно звучит по-русски.
- source_word: τὸν ἐπιφανῆ θεὸν
  choice: явившего Себя Бога
  rationale: ἐπιφανής указывает на Бога, чьё присутствие или действие стало явным в оказанной помощи; такой перевод передаёт контекстуальный смысл без сведения слова лишь к славе или величию.
- source_word: θεὸν Κύριον
  choice: Бога, Господа
  rationale: Оба наименования сохранены как приложения; κύριος в отношении Бога передано традиционным и точным словом «Господь».
- source_word: Βασιλέα τῶν βασιλευόντων
  choice: Царя царствующих
  rationale: Буквально в греческом стоит причастие «царствующих», а не существительное «царей». Возвышенный русский оборот сохраняет эту особенность и остаётся понятным.
- source_word: ᾔνουν
  choice: восхваляли
  rationale: Имперфект выражает продолжавшееся действие; несовершенный вид «восхваляли» передаёт его естественно.
- source_word: τῆσδε τῆς βοηθείας αὐτοῦ τετευχότες
  choice: поскольку обрели от Него эту помощь
  rationale: Перфектное причастие τετευχότες обозначает уже полученную помощь с сохраняющимся результатом; причинное «поскольку» ясно передаёт связь с восхвалением.
theological_decisions:
- issue: Передача κύριος в ряду божественных титулов
  choice: Господь
  alternative: Владыка
  rationale: Здесь κύριος является обращённым к Богу титулом; «Господь» точно и естественно передаёт его в русской библейской речи.
- issue: Передача Βασιλέα τῶν βασιλευόντων
  choice: Царь царствующих
  alternative: Царь царей
  rationale: Основной текст сохраняет причастную форму греческого выражения и не подменяет её привычной формулой с существительным; более идиоматический вариант дан в сноске.
- issue: Смысл ἐπιφανῆ применительно к Богу
  choice: явивший Себя
  alternative: славный
  rationale: В контексте только что оказанной помощи слово указывает на явленность Божьего действия. Перевод не утверждает непременно телесного явления, но сохраняет связь титула с очевидным вмешательством.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Титулы Бога и относящиеся к Нему местоимения написаны с прописной буквы. Синтаксис сделан плавным, но последовательность титулов и аспектуальные оттенки греческих форм сохранены.
