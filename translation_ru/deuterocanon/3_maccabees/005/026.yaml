  text: But the sun’s rays had not yet spread out[a], and while the king was receiving his friends, Hermon came forward and summoned them to the departure[b], pointing out that the king’s eagerness was in readiness.
translation:
  language: ru
  text: Но солнечные лучи ещё не начинали рассеиваться, и, в то время как царь принимал своих друзей[a], Гермон подошёл и призвал к выходу[b], давая понять, что царь уже был готов действовать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих придворных». При эллинистических царских дворах «друзья» могло быть официальным обозначением приближённых царя.'
    reason: lexical_alternative
  - marker: b
    text: Буквально греческое выражение означает «призвал к выходу»; вероятно, Гермон призвал присутствующих отправиться в путь.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω δὲ ἡλίου βολαὶ κατεσπείροντο
  choice: Солнечные лучи ещё не рассеялись по земле
  rationale: Сохраняет образ ещё не распространившегося солнечного света; «рассеялись по земле» естественно передаёт метафору κατεσπείροντο — буквально «были рассеяны/посеяны».
- source_word: τοῦ βασιλέως τοὺς φίλους ἐκδεχόμενον
  choice: когда царь принимал своих друзей
  rationale: ἐκδέχομαι допускает значения «ожидать» и «принимать»; при прямом дополнении τοὺς φίλους в придворной сцене «принимал» наиболее естественно, не устраняя придворного оттенка слова φίλοι.
- source_word: ὁ Ἕρμων παραστὰς
  choice: Гермон, подойдя
  rationale: Кратко и естественно передаёт аористное причастие παραστάς как появление Гермона рядом или его выход вперёд.
- source_word: ἐπικαλεῖ πρὸς τὴν ἔξοδον
  choice: позвал их выступать в путь
  rationale: Передаёт подразумеваемый объект призыва и направленность πρὸς τὴν ἔξοδον — выйти, отправиться; неопределённость конструкции отмечена в сноске.
- source_word: ὑποδεικνὺς τὸ πρόθυμον τοῦ βασιλέως ἐν ἑτοίμῳ κεῖσθαι
  choice: давая понять, что царь уже готов и полон решимости
  rationale: τὸ πρόθυμον выражает готовность, рвение или решимость, а ἐν ἑτοίμῳ κεῖσθαι — состояние полной готовности. Русская формулировка передаёт оба близких, но не тождественных оттенка без неестественного отвлечённого оборота.
