  - severity: medium
    issue: Введён невыраженный объект в «позвал их выступать в путь».
    rationale: При ἐπικαλεῖ πρὸς τὴν ἔξοδον объект в данной формуле не назван; «к выходу» ближе к греческому и не предрешает, кого именно призывают.
