  text: But this was the working of God[a], who rules over all, having implanted in the minds of those who had previously plotted against them a forgetfulness of their purpose.
translation:
  language: ru
  text: Но это было действием Бога, владычествующего над всем и вложившего в умы тех, кто прежде строил козни против него, забвение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вложившего забвение в умы тех, кто прежде строил козни против него». В греческом тексте «против него» стоит в единственном числе; референт определяется контекстом.'
    reason: Сноска поясняет синтаксис и сохраняет неоднозначность референта греческого αὐτῷ, не вводя в основной текст не названного в стихе царя.
lexical_decisions:
- source_word: ἐνέργεια
  choice: действием
  rationale: Слово обозначает деятельное проявление или действие силы; «действием» естественно звучит по-русски и сохраняет прямую причинность.
- source_word: τοῦ πάντα δεσποτεύοντος θεοῦ
  choice: Бога, владычествующего над всем
  rationale: δεσποτεύω передаёт господство и верховную власть; «владычествующего над всем» сохраняет возвышенный регистр и идею всеобщего Божьего владычества.
- source_word: λήθην κατὰ διάνοιαν ἐντεθεικότος
  choice: Он вложил в разум царя забвение
  rationale: Оборот буквально изображает Бога вкладывающим забвение внутрь разума; перевод сохраняет эту образность и прямое Божье воздействие.
- source_word: τῶν πρὶν αὐτῷ μεμηχανημένων
  choice: того, что тот прежде замыслил
  rationale: 'Форма μεμηχανημένων — родительный падеж среднего рода множественного числа — естественно относится к ранее задуманным делам или замыслам, а αὐτῷ может обозначать деятеля при пассивной форме: «задуманного им». Контекст указывает на царя.'
theological_decisions:
- issue: Прямое Божье воздействие на память царя
  choice: Бог вложил забвение в разум царя
  alternative: Бог лишь допустил, чтобы царь забыл
  rationale: Сочетание ἐνέργεια τοῦ… θεοῦ и ἐντεθεικότος прямо приписывает Богу действие; перевод не смягчает эту причинность.
- issue: Смысл τῶν πρὶν αὐτῷ μεμηχανημένων
  choice: ранее задуманное самим царём
  alternative: люди, прежде замышлявшие против него или против иудеев
  rationale: Средний род множественного числа μεμηχανημένων лучше согласуется с подразумеваемыми делами или замыслами, а не с людьми; дательный αὐτῷ допускает значение деятеля при перфектном пассивном причастии. При этом неоднозначность формы отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Двоеточие естественно раскрывает, в чём состояло Божье действие; контекстуальное «царя» устраняет неясность русского местоимения, не изменяя смысла.
