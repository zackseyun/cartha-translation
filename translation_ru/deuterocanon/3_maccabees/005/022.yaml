  source_fidelity: 'Греческое οὐχ οὕτως ... ὡς, εἰς ὕπνον и μηχανᾶσθαι переданы в целом точно: ночь противопоставлена сну и намеренному измышлению насмешек. «Издевательства над» хорошо выражает враждебную направленность ἐμπαιγμούς при дательном τοῖς ταλαιπώροις. Однако «казался им жалким» вводит невыраженное в тексте «им» и переводит множественное определение как относительное придаточное с единственным числом; лучше сохранить неопределённую, перспективную характеристику без добавления наблюдателя.'
