  text: And they did not spend the time of the night so much in sleep as in devising every kind of mockery for those who seemed miserable[a].
translation:
  language: ru
  text: И ночное время они тратили не столько на сон, сколько на то, чтобы придумывать всевозможные издевательства над теми, кого считали жалкими[a].
