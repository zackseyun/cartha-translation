  terminology: «Издевательства» уместно для ἐμπαιγμούς в данном контексте; «всевозможные» адекватно передаёт παντοίως. «Жалкими» сохраняет намеренно неразрешённый оттенок ταλαίπωροι — вызывающие жалость / презрительно называемые жалкими. Богословских терминов нет.
