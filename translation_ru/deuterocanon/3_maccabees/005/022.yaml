    text: 'Или: «над жалкими несчастными»; речь идёт о жертвах, которых воспринимали как жалкие объекты глумления.'
    reason: Лексический вариант сохраняет возможный оттенок ταλαίπωροι и оценочную перспективу δοκοῦσιν, не называя прямо тех, кому жертвы так представлялись.
lexical_decisions:
- source_word: κατεχρίζαντο
  choice: проводили
  rationale: В сочетании с «ночное время» глагол описывает, на что они употребляли часы ночи. «Проводили» естественно по-русски и не добавляет оттенка напрасной траты времени.
- source_word: οὐχ οὕτως ... ὡς
  choice: не столько ... сколько
  rationale: Русская сопоставительная конструкция точно передаёт противопоставление двух занятий.
- source_word: εἰς ὕπνον
  choice: во сне
  rationale: Передаёт сферу, которой посвящалось ночное время, и естественно сочетается с конструкцией «не столько… сколько».
- source_word: παντοίως
  choice: всевозможные
  rationale: Передаёт всеохватность и разнообразие замышляемых издевательств.
- source_word: μηχανᾶσθαι
  choice: придумывая
  rationale: Выражает намеренное изобретение и подготовку издевательств без излишнего усиления до значения заговора.
- source_word: τοῖς ταλαιπώροις δοκοῦσιν
  choice: над теми, кто казался им жалким
  rationale: Дательный при враждебном ἐμπαιγμούς естественно передан русским оборотом «издевательства над». «Казался… жалким» сохраняет перспективный оттенок δοκοῦσιν и неоднозначность между вызывающей жалость и презираемой жалкостью.
- source_word: ἐμπαιγμούς
  choice: издевательства
  rationale: Слово охватывает насмешки, унижение и иные проявления глумления; в данном угрожающем контексте оно естественнее коллективного «насмешки».
