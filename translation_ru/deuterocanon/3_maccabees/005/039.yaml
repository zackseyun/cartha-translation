lexical_decisions:
- source_word: συνανακείμενοι
  choice: возлежавшие с ним за трапезой
  rationale: Причастие указывает на совместное участие в трапезе в принятой в древности позе полулёжа; формулировка сохраняет культурный образ и поясняет контекст.
- source_word: συγγενεῖς
  choice: родственники
  rationale: Современное и точное обозначение лиц, связанных родством, без архаического оттенка.
- source_word: ἄσταθη
  choice: неустойчивости
  rationale: Передаёт отсутствие постоянства и устойчивости в умственном настрое, не уточняя сверх текста причину или характер перемен.
- source_word: διάνοιαν
  choice: мыслей
  rationale: В сочетании с ἄσταθη обозначает изменчивый умственный настрой; русское выражение «неустойчивость мыслей» звучит естественно и сохраняет связь с мышлением.
- source_word: θαυμάζοντες
  choice: изумляясь
  rationale: Передаёт удивление и поражённость без положительной окраски, которую в современном русском может иметь «восхищаясь».
- source_word: προεφέροντο
  choice: продолжали говорить
  rationale: Имперфект выражает длящееся или повторяющееся действие; глагол вводит последующую речь.
- source_word: τάδε
  choice: следующее
  rationale: Естественная русская формула, указывающая вперёд на слова, которые последуют далее.
