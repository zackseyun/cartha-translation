base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/005.yaml
  text: And in addition[a], the attendants, going out at evening, bound the hands of those who were suffering, and contrived the rest of the nighttime security concerning them[b], thinking that they would together bring the race to the end of destruction.
translation:
  language: ru
  text: Кроме того, служители, выходя под вечер, связывали руки страдальцев и принимали прочие меры, чтобы ночью держать их под надёжной охраной, полагая, что весь этот народ[a] разом погибнет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этот род» или «это племя». Греческое τὸ φύλον здесь обозначает еврейский народ как целое.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «получит конец гибели (уничтожения)». Этот необычный оборот выражает окончательный гибельный исход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργοὶ
  choice: служители
  rationale: В данном повествовательном контексте это исполнители поручений властей, а не богослужебные служители; русское «служители» сохраняет функциональный смысл без излишней конкретизации.
- source_word: κατὰ τὴν ἑσπέραν
  choice: под вечер
  rationale: Естественно передаёт временное указание и возможный оттенок наступления вечера.
- source_word: τὰς τῶν ταλαιπωρουμένων ... χεῖρας
  choice: руки несчастным
  rationale: ταλαιπωρουμένων обозначает людей, доведённых до бедственного, мучительного положения; «несчастным» звучит естественно и ёмко.
- source_word: ἐδέσμευον
  choice: связали
  rationale: Прямо передаёт физическое связывание рук.
- source_word: τὴν ... λοιπὴν ... ἀσφάλειαν ἔννυχον
  choice: остальные меры, чтобы надёжно стеречь их ночью
  rationale: Сжатое греческое выражение описывает дополнительные ночные меры охраны; развёрнутая русская формулировка делает смысл ясным.
- source_word: ἐμηχανῶντο
  choice: приняли меры
  rationale: Средний залог указывает на продуманное устройство или организацию; в сочетании с ἀσφάλειαν по-русски естественно «приняли меры».
- source_word: δοξαντες
  choice: полагая
  rationale: Передаёт их расчёт или убеждение, не утверждая, что ожидаемое действительно совершится.
- source_word: ὁμοῦ
  choice: все вместе
  rationale: Сохраняет значение совместности; синтаксически отнесено к действующим служителям, хотя греческая фраза допускает некоторую неоднозначность.
- source_word: λήμψεσθαι ... πέρας
  choice: доведут ... до
  rationale: Буквальное «получат конец» по-русски неестественно; конструкция выражает достижение ими намеченного конечного результата.
- source_word: τὸ φύλον
  choice: этот народ
  rationale: В контексте обозначает еврейский народ как целое; «народ» в современном русском яснее и нейтральнее, чем биологизирующее «раса» или слишком узкое «племя».
- source_word: πέρας τῆς ὀλεθρίας
  choice: окончательная гибель
  rationale: Передаёт завершённость, предельный итог уничтожения, сохраняя образ гибели без неестественного буквального оборота «конец гибели».
theological_decisions:
- issue: Коллективное обозначение τὸ φύλον
  choice: этот народ
  alternative: этот род / это племя
  rationale: Речь идёт о еврейском народе как единой преследуемой общности. «Народ» точно передаёт корпоративный и этнический смысл, не привнося современных расовых категорий.
- issue: Направленность финальной конструкции λήμψεσθαι τὸ φύλον πέρας τῆς ὀλεθρίας
  choice: доведут этот народ до окончательной гибели
  alternative: этот народ достигнет предела гибели / добьются окончательной гибели этого народа
  rationale: Греческая конструкция синтаксически сжата и необычна. Выбранный вариант передаёт враждебный замысел исполнителей, не превращая его в утверждение рассказчика о свершившемся результате.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Сжатые греческие обороты раскрыты ровно настолько, насколько необходимо для ясности; сохранены коллективный характер угрозы и оттенок расчёта преследователей.
