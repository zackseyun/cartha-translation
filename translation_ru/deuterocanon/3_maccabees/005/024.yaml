lexical_decisions:
- source_word: τὰ ... κατὰ τὴν πόλιν πλήθη
  choice: толпы со всего города
  rationale: Передаёт множество групп людей по всему городу естественным современным русским языком; сочетание κατὰ τὴν πόλιν указывает на широкое распределение в пределах города.
- source_word: συνῄθροιστο
  choice: собирались
  rationale: Форма выражает продолжающийся процесс собирания; несовершенный вид сохраняет эту аспектуальную окраску.
- source_word: πρὸς τὴν οἰκτρότατην θεωρίαν
  choice: на это жалкое зрелище
  rationale: «Зрелище» сохраняет значение того, на что смотрят, а «жалкое» передаёт превосходную степень в идиоматичном русском обороте; указательное «это» связывает событие с контекстом.
- source_word: προσδοκῶντα τὴν πρωίαν
  choice: ожидая утра
  rationale: Причастный оборот естественно передаёт сопутствующее ожидание; «утро» не сужает значение до точного момента рассвета.
- source_word: μετὰ σπουδῆς
  choice: с нетерпением
  rationale: Передаёт напряжённую устремлённость и рвение толпы, не придавая фразе положительной эмоциональной оценки.
