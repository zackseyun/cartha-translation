  text: But the Jews[a], seeming to the nations to be deprived of every protection because of the necessity that surrounded them on every side with chains,
translation:
  language: ru
  text: Иудеи же, казавшиеся другим народам лишёнными всякой защиты[a] из-за принуждения, со всех сторон окружавшего их оковами,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставшимися без всякого укрытия».'
    reason: Слово σκέπη может означать как защиту, так и укрытие или покров.
lexical_decisions:
- source_word: σκέπης
  choice: защиты
  rationale: Слово может обозначать укрытие, покров или защиту; в контексте полной уязвимости иудеев естественнее всего переносное значение «защита».
- source_word: ἔρημοι
  choice: лишёнными
  rationale: В сочетании с родительным падежом выражает отсутствие или утрату чего-либо; «лишёнными всякой защиты» точно и естественно передаёт оборот.
- source_word: δοκοῦντες εἶναι
  choice: казавшиеся
  rationale: Причастный оборот описывает впечатление сторонних наблюдателей, а не утверждает, что иудеи действительно остались без защиты.
- source_word: τοῖς ἔθνεσιν
  choice: другим народам
  rationale: Дательный падеж обозначает точку зрения окружающих народов; слово «другим» делает противопоставление иудеям ясным без обязательной богословской окраски слова «язычники».
- source_word: ἀνάγκην
  choice: неволи
  rationale: В данном контексте ἀνάγκη означает тяжёлое принуждение и стеснённость; образ цепей указывает на физическую несвободу, поэтому «неволя» звучит точнее и естественнее буквальной «необходимости».
- source_word: πάντοθεν περιέχουσαν αὐτοὺς μετὰ δεσμῶν
  choice: со всех сторон сковавшей их цепями
  rationale: Формулировка сохраняет образы всестороннего окружения и уз, при этом естественно связывает их с «неволей».
- source_word: δεσμῶν
  choice: цепями
  rationale: В контексте содержания под стражей δεσμοί обозначает физические узы или цепи; выбранный вариант ясен современному читателю.
