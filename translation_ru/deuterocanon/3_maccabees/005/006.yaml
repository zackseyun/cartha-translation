  terminology: «Защита» — удачный контекстуальный эквивалент σκέπη; сноска уместно отмечает значение «укрытие». «Оковы» естественно передаёт δεσμοί в образе принудительного удержания. «Другим народам» допустимо как контекстуальное обозначение ἔθνη и не навязывает богословского смысла.
