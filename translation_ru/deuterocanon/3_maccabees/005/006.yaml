  rationale: Исправление устраняет неоправданное сужение ἀνάγκη до «неволи» и точнее передаёт περιέχουσαν как всестороннее окружение. Сохраняются исходные регистр, смысловая неоднозначность, сноска и открытый синтаксис, продолжающийся в следующем стихе.
