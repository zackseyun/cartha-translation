lexical_decisions:
- source_word: ὃ δὲ καὶ γενομένου
  choice: Когда же это произошло
  rationale: Оборот обозначает предшествующее событие, не уточняя его содержания. Русская формулировка сохраняет эту неопределённость и естественную последовательность повествования.
- source_word: παρῄνει
  choice: призвал
  rationale: Глагол выражает настойчивое побуждение или увещание; «призвал» уместно в повествовательном и придворном контексте.
- source_word: εἰς εὐωχίαν δόντας ἑαυτούς
  choice: предаться пиршеству
  rationale: Передаёт добровольное погружение в праздничную трапезу, не добавляя отсутствующей в греческом тексте идеи распущенности.
- source_word: τὸ παρὸν τῆς συμποσίας
  choice: нынешнее застолье
  rationale: Сочетание указывает на происходящий в данный момент пир или застолье. «Застолье» естественно передаёт συμποσία, включая совместную еду и питьё.
- source_word: ἐπὶ πολὺ γεραιρομένους
  choice: долго чествуя
  rationale: ἐπὶ πολύ допускает временной оттенок «долго», а γεραιρομένους здесь передано как участие в почётном праздновании. Причастие во множественном числе соотнесено с участниками пира, а не превращено в определение к застолью.
- source_word: εἰς εὐφροσύνην καταθέσθαι μέρος
  choice: уделить часть его веселью
  rationale: Сжатое идиоматическое выражение буквально говорит о выделении или назначении части для радости. Местоимение «его» естественно связывает эту часть с текущим застольем, не устраняя образ части или доли.
