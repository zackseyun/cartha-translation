    text: 'Греческое выражение εἰς εὐφροσύνην καταθέσθαι μέρος сжато и допускает более буквальный перевод: «назначить (или отложить) долю для радости». Поэтому возможен и перевод: «отвести нынешнее застолье для радости». Причастие «долго чествовавших» относится к участникам застолья.'
