  source_fidelity: 'В черновике верно переданы временной оборот «когда же это произошло», побудительный смысл παρῄνει и праздничный характер εὐωχία/συμποσία. Однако «призвал их предаться ... и ... уделить» превращает δόντας ἑαυτούς в второй инфинитив при «призвал», тогда как это причастный оборот, относящийся к «ним». Кроме того, «уделить часть его веселью» меняет направленность сжатого εἰς εὐφροσύνην καταθέσθαι μέρος: речь идет о посвящении настоящего праздничного случая радости, причем μέρος сохраняет образ доли/удела в идиоматическом обороте.'
