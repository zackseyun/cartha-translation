  text: 'But he, filled with heavy anger at what had been said, because all his purpose concerning these things had been frustrated by the providence of God, spoke with threats, pressing the matter hard:'
translation:
  language: ru
  text: 'Но он, исполнившись тяжкого гнева из-за сказанного, поскольку по Божьему провидению весь его замысел относительно этого был расстроен, с угрозой в голосе, настойчиво сказал:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλησθεὶς βαρεῖ χόλῳ
  choice: исполнившись тяжкого гнева
  rationale: Сохраняет образ наполненности и необычную тяжесть гнева; «тяжкого» точнее передаёт βαρεῖ, не подменяя его словом «яростного».
- source_word: προνοίᾳ θεοῦ
  choice: Божье провидение
  rationale: Прямо передаёт идею действующего божественного попечения и соответствует литературному русскому употреблению.
- source_word: διεσκεδάσθαι πᾶν αὐτοῦ νόημα
  choice: расстроило все его замыслы
  rationale: διασκεδάζω здесь означает разрушить, сорвать или рассеять задуманное; множественное «замыслы» естественно передаёт совокупность намерений, выраженную πᾶν ... νόημα.
- source_word: ἐντείνων μετὰ ἀπειλῆς εἶπεν
  choice: с угрозой настойчиво сказал
  rationale: «Настойчиво» передаёт усиливающее, нажимающее значение ἐντείνων, а «с угрозой» сохраняет μετὰ ἀπειλῆς без добавления объекта угроз.
theological_decisions:
- issue: Роль Божьего провидения
  choice: Божье провидение расстроило все его замыслы
  alternative: его замыслы расстроились по Божьему провидению
  rationale: Активная русская конструкция ясно сохраняет названную греческим текстом причинность и не ослабляет Божье участие, хотя греческий инфинитив стоит в пассиве.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Сохранены тяжеловесность гнева, явная причинная связь с Божьим провидением и напряжённо-угрожающий характер речи; двоеточие указывает на последующую прямую речь.
