  text: He ordered that[a], by the coming day, all the elephants—five hundred in number—be given drink with generous draughts of frankincense and much unmixed wine, and that, once made savage by the abundant supply of drink, they be brought in for the destruction of the Jews.
translation:
  language: ru
  text: Он приказал, чтобы к наступающему дню всем слонам — числом пятьсот — дали выпить обильные дозы ладана и большое количество неразбавленного вина, а затем, приведённых в ярость обильной подачей питья, привели для гибели иудеев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «навстречу погибели иудеев»; выражение обозначает предназначенную им смерть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: Он приказал
  rationale: Аорист κελεύω обозначает властное распоряжение; «приказал» естественно и точно передаёт его силу.
- source_word: ὑπὸ τὴν ἐρχομένην ἡμέραν
  choice: к наступающему дню
  rationale: Передаёт временной предел и сохраняет направленность греческого выражения к приближающемуся дню.
- source_word: δαψιλέσι δράκεσι λιβανωτοῦ
  choice: щедрыми порциями ладана
  rationale: δαψιλέσι указывает на обилие, а δράκεσι — на даваемые порции; λιβανωτός конкретно обозначает ладан.
- source_word: οἴνῳ πλείονι ἀκράτῳ
  choice: большим количеством неразбавленного вина
  rationale: πλείονι выражает значительное количество, а ἀκράτῳ — вино без обычного разбавления водой.
- source_word: ὄντας τὸν ἀριθμὸν πεντακοσίους
  choice: числом пятьсот
  rationale: Кратко сохраняет пояснительную и несколько формальную конструкцию оригинала.
- source_word: ἀγριωθέντας
  choice: приведёт их в ярость
  rationale: Пассивное причастие описывает вызванное питьём свирепое, неукротимое состояние слонов.
- source_word: τῇ τοῦ πόματος ἀφθόνῳ χορηγίᾳ
  choice: обильное питьё
  rationale: Естественная русская передача обильного снабжения питьём без утраты причинной связи.
- source_word: εἰσαγαγεῖν
  choice: вывели
  rationale: Глагол означает ввести или привести внутрь; в контексте слонов естественно «вывели» на место расправы.
- source_word: πρὸς συνάντησιν τοῦ μόρου τῶν Ἰουδαίων
  choice: на погибель иудеев
  rationale: Идиоматично выражает предназначенную иудеям гибель, сохраняя значение μόρος и целевую направленность πρὸς.
theological_decisions:
- issue: Передача τοῦ μόρου в контексте задуманной массовой расправы
  choice: на погибель иудеев
  alternative: навстречу погибели иудеев
  rationale: μόρος может означать рок, смерть или погибель. Контекст ясно указывает на смертельный исход для иудеев, однако образная конструкция «встречи» в русском была бы неясной и могла бы ошибочно отнести погибель к слонам; сжатое «на погибель» сохраняет цель и тяжесть выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис сохраняет длинную структуру приказа, но причинная последовательность выражена естественно. Термин «иудеи» выбран как уместное историко-библейское обозначение.
