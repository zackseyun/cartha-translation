  source_fidelity: 'Перевод точно передаёт два инфинитива цели/просьбы: μεταστρέψαι — «обратить вспять», ῥύσασθαι — «избавить». «Нечестивый замысел, направленный против них» адекватно воспроизводит τὴν κατʼ αὐτῶν ... βουλὴν ἀνοσίαν. «Величественным явлением» сохраняет образный и намеренно неуточнённый характер μεγαλομεροῦς ἐπιφανείας, а «от смерти, стоявшей наготове у самых их ног» верно передаёт близость и готовность μόρος без утраты образности.'
