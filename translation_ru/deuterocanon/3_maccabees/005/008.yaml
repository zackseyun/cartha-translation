  text: to turn back the unholy plan against them[a], and to rescue them with a magnificent manifestation from the death ready at their feet.
translation:
  language: ru
  text: обратить вспять направленный против них нечестивый замысел и величественным явлением[a] избавить их от смерти, стоявшей наготове у самых их ног.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «славным явлением»; возможно также: «величественным вмешательством». Греческое ἐπιφάνεια может обозначать поразительное явление, нередко связанное с божественной помощью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστρέψαι
  choice: обратить вспять
  rationale: Передаёт изменение и устранение действия враждебного замысла, сохраняя образ поворота, выраженный греческим глаголом.
- source_word: βουλὴν ἀνοσίαν
  choice: нечестивый замысел
  rationale: «Замысел» естественно обозначает намерение противников, а «нечестивый» сохраняет не только нравственную, но и религиозную оценку ἀνοσίαν.
- source_word: ῥύσασθαι
  choice: избавить
  rationale: Глагол обозначает спасение из непосредственной опасности; «избавить» уместно в возвышенном повествовательном контексте и понятно современному читателю.
- source_word: μεγαλομεροῦς ἐπιφανείας
  choice: величественным явлением
  rationale: «Явление» сохраняет смысл заметного, поразительного обнаружения божественной помощи, не уточняя его способ; «величественным» передаёт идею необычайного величия.
- source_word: παρὰ πόδας ἐν ἑτοίμῳ μόρου
  choice: от смерти, стоявшей наготове у самых их ног
  rationale: «Смерть» ясно передаёт μόρος в данном контексте, а образ «у самых их ног» сохраняет пространственную метафору близкой и неминуемой гибели; «стоявшей наготове» отражает ἐν ἑτοίμῳ.
theological_decisions:
- issue: Характер ἐπιφάνεια в контексте
  choice: величественное явление
  alternative: величественное вмешательство; славное явление
  rationale: Контекст связывает избавление с поразительным действием Бога. «Явление» сохраняет лексику обнаружения или появления, не определяя точный способ вмешательства и не превращая слово в позднейший технический богословский термин.
translation_notes:
