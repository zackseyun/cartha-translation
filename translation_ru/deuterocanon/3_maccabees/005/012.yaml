revisions:
- from: 'И по действию Владыки он был объят сладчайшим и глубоким сном[a]: его беззаконное намерение потерпело полный крах, а непреклонный замысел совершенно не осуществился.


    [a] Слово «сном» восполняется по смыслу. Греческий текст буквально говорит, что он был «объят сладчайшим и глубоким» по действию Владыки; необычный оборот описывает ниспосланное Богом состояние, которое удержало его от задуманного.'
  to: 'И силой воздействия Владыки он погрузился в сладчайший и глубокий сон[a], потерпев тяжёлую неудачу в своём беззаконном намерении и глубоко разочаровавшись в своём непреклонном замысле.


    [a] Слово «сон» в греческом тексте не названо, но, по-видимому, подразумевается контекстом. Буквально сказано, что силой воздействия Владыки он был охвачен «сладчайшим и глубоким»; необычный эллиптический оборот описывает состояние, удержавшее его от задуманного.'
  rationale: Исправление сохраняет вероятное контекстуальное понимание образа как сна, но отмечает, что это восполнение, а не слово оригинала. Оно заменяет неестественное «по действию» на ясную конструкцию с действенной силой Владыки и возвращает обоим причастным определениям их исходный субъект — самого царя. Усиленные «полный» и «совершенно» заменены на соразмерные греческим наречиям формулировки.
