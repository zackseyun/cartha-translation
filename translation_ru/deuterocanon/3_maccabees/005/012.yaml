  text: And by the action of the Sovereign he was overcome with a most pleasant and deep stupor[b][a], having been greatly frustrated in his lawless purpose and utterly disappointed in his unchangeable resolve.
translation:
  language: ru
  text: 'И силой воздействия Владыки он погрузился в сладчайший и глубокий сон[a], потерпев тяжёлую неудачу в своём беззаконном намерении и глубоко разочаровавшись в своём непреклонном замысле.


    [a] Слово «сон» в греческом тексте не названо, но, по-видимому, подразумевается контекстом. Буквально сказано, что силой воздействия Владыки он был охвачен «сладчайшим и глубоким»; необычный эллиптический оборот описывает состояние, удержавшее его от задуманного.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «сон» в греческом тексте не названо, но, по-видимому, подразумевается контекстом. Буквально сказано, что силой воздействия Владыки он был охвачен «сладчайшим и глубоким»; необычный эллиптический оборот описывает состояние, удержавшее его от задуманного.
    reason: В греческом выражении ἡδίστῳ καὶ βαθεῖ отсутствует определяемое существительное; «сон» является вероятным контекстуальным восполнением, которое не должно скрывать эллиптичность исходного образа.
lexical_decisions:
- source_word: ἥδιστῳ καὶ βαθεῖ
  choice: сладчайшим и глубоким сном
  rationale: Прилагательные стоят в дательном падеже мужского/среднего рода и не согласуются с ἐνεργείᾳ; в данном контексте подразумевается сон. «Сладчайшим и глубоким» сохраняет необычную образность и превосходную степень.
- source_word: κατεσχέθη
  choice: был объят
  rationale: Пассивная форма κατέχω передаёт охватывающее и удерживающее действие; «был объят» естественно сочетается со сном и сохраняет силу исходного глагола.
- source_word: ἐνεργείᾳ
  choice: по действию
  rationale: Передаёт действенное вмешательство, не превращая существительное в отвлечённый богословский термин.
- source_word: δεσπότου
  choice: Владыки
  rationale: «Владыка» сохраняет смысл абсолютной власти и отличает δεσπότης от обычного соответствия κύριος — «Господь».
- source_word: ἀθέσμου προθέσεως πολὺ διεσφαλμένος
  choice: его беззаконное намерение потерпело полный крах
  rationale: Контекстуально передаёт значительное крушение преступного намерения; русская перестройка устраняет тяжеловесное нанизывание причастий.
- source_word: τοῦ ἀμεταθέτου λογισμοῦ μεγάλως διεψευσμένος
  choice: непреклонный замысел совершенно не осуществился
  rationale: Передаёт несбывшееся ожидание и полный провал твёрдо принятого решения, не приписывая λογισμός абстрактного значения «разум».
theological_decisions:
- issue: Передача δεσπότου как титула Бога
  choice: Владыки
  alternative: Господина; Господа
  rationale: «Владыка» естественно звучит как божественный титул, подчёркивает верховную власть и сохраняет отличие δεσπότης от κύριος.
- issue: Характер божественного вмешательства
  choice: по действию Владыки он был объят ... сном
  alternative: его удержала сладчайшая и глубокая сила Владыки
  rationale: Контекст и грамматическая форма прилагательных указывают на подразумеваемый сон, но примечание сохраняет необычность и неполноту греческого оборота, не скрывая неоднозначности.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис второй половины перестроен в две параллельные личные конструкции ради ясности, при сохранении нарастания: крах намерения и полное неосуществление непреклонного замысла.'
