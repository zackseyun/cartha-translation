lexical_decisions:
- source_word: εἰπόντος δὲ τοῦ βασιλέως
  choice: Когда царь закончил говорить
  rationale: Греческий генитив абсолютный передаёт предшествующее обстоятельство; такая формулировка естественнее по-русски, чем буквальное «когда царь сказал».
- source_word: ἀσμένως ... μετὰ χαρᾶς
  choice: с радостью
  rationale: Оба выражения обозначают охотное, радостное согласие; единая русская формулировка избегает неестественного повтора «охотно, с радостью», сохраняя смысл.
- source_word: ὁμοῦ συναινέσαντες
  choice: единодушно согласились
  rationale: ὁμοῦ подчёркивает совместность и единство присутствующих, а συναινέω — их согласие с предложенным.
- source_word: εἰς τὸν ἴδιον οἶκον ἕκαστος ἀνέλυσε
  choice: каждый разошёлся к себе домой
  rationale: ἀναλύω здесь означает уйти, отправиться обратно; «разошёлся» естественно передаёт индивидуальное возвращение всех присутствовавших.
