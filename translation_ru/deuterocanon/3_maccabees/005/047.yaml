base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/047.yaml
  text: But he[a], filled with heavy wrath and impious in mind, rushed out with all his force along with the beasts[b], wanting with unfeeling heart and with the pupils of his eyes to look upon the painful and miserable destruction of those who had been marked out.
translation:
  language: ru
  text: Он же, наполнив свой нечестивый разум тяжким гневом, со всей силой устремился вместе со зверями, желая с сердцем, не тронутым жалостью, собственными глазами увидеть мучительную и бедственную гибель тех, кто был отмечен.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с неуязвлённым (нераненым) сердцем» — то есть с сердцем, которого не коснулась жалость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «зрачками глаз»; выражение подчёркивает, что он хотел увидеть это лично и непосредственно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργῇ βαρείᾳ γεμίσας
  choice: исполнив свой нечестивый разум тяжким гневом
  rationale: Сохраняет образ «тяжкого» гнева; причастие γεμίσας синтаксически связано с φρένα, поэтому гнев представлен наполняющим разум/помыслы.
- source_word: δυσσεβῆ φρένα
  choice: свой нечестивый разум
  rationale: φρένες обозначает внутренний разум, помыслы или расположение; «нечестивый» сохраняет религиозно-нравственную силу δυσσεβής.
- source_word: παντὶ τῷ βάρει
  choice: со всей силой
  rationale: В контексте стремительного движения выражение передаёт всю мощь или напор, а не просто буквальный вес.
- source_word: σὺν τοῖς θηρίοις
  choice: вместе со зверями
  rationale: «Звери» естественно передаёт θηρία и сохраняет угрозу, исходящую от животных, предназначенных для казни.
- source_word: ἐξώρμησε
  choice: устремился
  rationale: Передаёт внезапное и сильное движение, не добавляя отсутствующего в греческом тексте направления.
- source_word: ἀτρώτῳ καρδίᾳ
  choice: с сердцем, не тронутым жалостью
  rationale: Буквально ἀτρώτος означает «нераненый, неуязвлённый»; в данном контексте образ указывает на сердце, которого не коснулось сострадание. Образ и неоднозначность отмечены в сноске.
- source_word: κόραις ὀφθαλμῶν
  choice: собственными глазами
  rationale: Буквальное «зрачками глаз» в современном русском неестественно; выражение подчёркивает непосредственное личное созерцание.
- source_word: τὴν ἐπίπονον καὶ ταλαίπωρον ... καταστροφήν
  choice: мучительную и бедственную гибель
  rationale: 'Сохраняет два усилительных определения: страдание, причиняемое гибелью, и её жалкий, бедственный характер.'
- source_word: τῶν προσεσημαμμένων
  choice: тех, кто был отмечен
  rationale: Перфектное причастие указывает на ранее совершённое обозначение или помечание этих людей; цель отметки не добавляется прямо в перевод.
theological_decisions:
- issue: Религиозно-нравственный смысл δυσσεβής
  choice: нечестивый
  alternative: злой; безбожный
  rationale: «Нечестивый» сохраняет связь с непочтением к Богу, не сводя слово к общей нравственной порочности и не усиливая его до прямого отрицания Божьего существования.
- issue: Смысл ἀτρώτῳ καρδίᾳ
  choice: с сердцем, не тронутым жалостью
  alternative: с неуязвлённым сердцем; с бесчувственным сердцем
  rationale: Контекст поддерживает отсутствие сострадания, но сноска сохраняет буквальный образ сердца, которое осталось «нераненым» или «неуязвлённым».
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. Синтаксис слегка упрощён ради ясности, при этом сохранены тяжёлый гнев, нечестие, стремительность движения и двойная характеристика гибели.
