base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/040.yaml
  text: O king[a], how long will you keep testing us, now commanding for the third time that they be destroyed, and then again, in the matter at hand, reversing by a change of mind the decisions you have made?
translation:
  language: ru
  text: Царь, до каких пор ты будешь испытывать нас, уже в третий раз приказывая уничтожить их, а затем вновь, по ходу дела, из-за перемены решения отменяя собственные постановления[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принятые тобой решения». Греческое выражение может обозначать как решения вообще, так и официальные царские постановления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπειράζεις
  choice: будешь испытывать
  rationale: Настоящее время в сочетании с «до каких пор» выражает продолжающееся, повторяющееся испытание; по-русски это естественно передаётся будущим несовершенного вида.
- source_word: προστάσσων
  choice: приказывая
  rationale: Причастие поясняет, каким образом царь испытывает говорящих, и сохраняет официальный характер распоряжения.
- source_word: ἤδη τρίτον
  choice: уже в третий раз
  rationale: Передаёт и достигнутый к настоящему моменту этап (ἤδη), и повторность (τρίτον).
- source_word: αὐτοὺς ἀφανίσαι
  choice: уничтожить их
  rationale: В данном контексте ἀφανίζω означает полностью погубить или истребить людей; «уничтожить» точно и не перегружено стилистически.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: когда доходит до дела
  rationale: Идиоматически передаёт переход от приказа к его практическому осуществлению, сохраняя связь с текущим делом.
- source_word: ἐκ μεταβολῆς
  choice: меняя решение
  rationale: Передаёт перемену намерения, из-за которой прежнее распоряжение отменяется.
- source_word: ἀναλύων
  choice: отменяя
  rationale: В контексте речь идёт об упразднении или отзыве ранее принятого царского постановления.
- source_word: τὰ σοὶ δεδογμένα
  choice: собственные постановления
  rationale: Данное выражение может обозначать официально принятые царём решения; «постановления» сохраняет публично-властный оттенок, а возвратное определение ясно связывает их с царём.
