  terminology: «Иудеи», «верность», «дикие звери» уместны. «Верность» передаёт πίστις без навязывания исключительно религиозного значения; «преданность» и «вера» сохранены как варианты. Оценку ἀνεγκλήτων лучше в основном тексте отнести к иудеям по грамматической связи, не исключая в сноске смысловой связи с верностью.
