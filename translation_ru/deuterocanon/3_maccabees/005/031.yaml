base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/031.yaml
  text: All the parents who were present[a], and the children with them, have prepared this lavish feast for the wild beasts, instead of the Jews[b], who have been shown to me and to my forefathers to possess complete and steadfast faithfulness beyond reproach.
translation:
  language: ru
  text: Все бывшие там родители и их потомки[a] приготовили для диких зверей этот обильный пир — вместо иудеев, которые, как я твёрдо убеждён, доказали мне и моим предкам свою полную и непоколебимую верность, не заслуживающую никаких нареканий[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение необычно; возможно также: «и их дети» или более буквально: «и потомки детей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «иудеев, безупречных в своей полной и непоколебимой верности». Слово, переведённое как «верность», может также означать «веру» или «преданность»; здесь, вероятно, имеется в виду доказанная лояльность царю и его предкам.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅσοι γονεῖς παρῆσαν
  choice: Все бывшие там родители
  rationale: Передаёт охват всей названной группы и естественно выражает присутствие на месте событий.
- source_word: ἢ παίδων γόνοι
  choice: и их потомки
  rationale: Греческое выражение необычно и допускает понимание детей или более широкого круга потомков; «потомки» сохраняет родовую семантику γόνοι без неестественной буквальности.
- source_word: θηρσὶν ἀγρίοις
  choice: для диких зверей
  rationale: Дательный обозначает тех, кому предназначен пир; «дикие звери» соответствует мрачному и возвышенному тону.
- source_word: ἐσκεύασαν δαψιλῆ θοῖναν
  choice: приготовили ... этот обильный пир
  rationale: Передаёт приготовление щедрой, изобильной трапезы и сохраняет жестокую иронию контекста.
- source_word: ἀντὶ τῶν ... Ἰουδαίων
  choice: вместо иудеев
  rationale: 'ἀντί обозначает замещение: присутствующие стали пищей зверям вместо предназначенных для этого иудеев.'
- source_word: ἀνεγκλήτων
  choice: не заслуживающую никаких нареканий
  rationale: Сохраняет судебно-оценочный оттенок отсутствия оснований для обвинения и грамматически связывается с верностью.
- source_word: ἀποδεδειγμένων ... πίστιν ἔχων
  choice: как я твёрдо убеждён, доказали ... свою ... верность
  rationale: Конструкция текста синтаксически трудна; перевод естественно передаёт доказанный характер верности и уверенность говорящего, не превращая πίστις в специально религиозный термин.
- source_word: ὁλοσχερῆ βεβαίαν πίστιν
  choice: полную и непоколебимую верность
  rationale: ὁλοσχερής указывает на полноту, βέβαιος — на устойчивость и надёжность, а πίστις в политико-историческом контексте означает верность или лояльность.
theological_decisions:
- issue: Значение πίστις в политико-историческом контексте
  choice: верность
  alternative: вера; преданность
  rationale: Речь идёт о доказанном отношении иудеев к царю и его предкам, поэтому «верность» лучше сохраняет смысл надёжности и лояльности, не внося без необходимости позднейшего доктринального оттенка слова «вера».
- issue: Связь ἀνεγκλήτων в трудной греческой конструкции
  choice: 'характеристика верности: «не заслуживающую никаких нареканий»'
  alternative: 'характеристика иудеев: «безупречных»'
  rationale: Форма родительного множественного числа может тяготеть к «иудеям», тогда как смысловой строй допускает оценку их доказанной верности. Основной текст выбирает естественную русскую конструкцию, а альтернативная связь отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранены жестокая ирония образа пира для зверей, трудность выражения παίδων γόνοι и смысловая неоднозначность πίστις; синтаксис умеренно перестроен ради ясности.
