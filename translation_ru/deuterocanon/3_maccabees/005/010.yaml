  yaml_path: translation/deuterocanon/3_maccabees/005/010.yaml
  text: But Hermon[a], after giving the savage elephants drink, with them filled from the abundant supply of wine and saturated with frankincense[b], came early in the morning to the court to report these things to the king.
translation:
  language: ru
  text: Гермон же, напоив свирепых[a] слонов, обильно наполненных вином и пропитанных ладаном[b], рано утром явился ко двору, чтобы доложить царю обо всём этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безжалостных». Греческое слово подчёркивает беспощадную свирепость.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово означает именно ладан, а не благовония вообще.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀνηλεῖς
  choice: свирепых
  rationale: В применении к опасным животным это естественно передаёт беспощадную, жестокую свирепость, выраженную греческим прилагательным.
- source_word: ποτίσας
  choice: напоив
  rationale: 'Причастие обозначает предшествующее действие Гермона: он дал слонам пить.'
- source_word: πεπληρωμένους τῆς τοῦ οἴνου πολλῆς χορηγίας
  choice: обильно поданным вином
  rationale: Передаёт как большое количество вина, так и оттенок его обильного предоставления; конструкция ясно относится к слонам.
- source_word: τοῦ λιβάνου μεμεστωμένους
  choice: насытив их ладаном
  rationale: λίβανος означает именно ладан, а форма μεμεστωμένους указывает на доведение до состояния наполненности или насыщенности.
- source_word: ὄρθριος
  choice: рано утром
  rationale: Естественное современное выражение, не уточняющее время точнее, чем греческий текст.
- source_word: αὐλήν
  choice: ко двору
  rationale: В царском контексте слово обозначает двор или дворцовый круг, а не обязательно только внутренний двор как архитектурное пространство.
- source_word: προσαγγεῖλαι
  choice: чтобы доложить
  rationale: Инфинитив цели описывает официальный доклад царю и соответствует административному контексту.
