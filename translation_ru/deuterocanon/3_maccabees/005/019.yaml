lexical_decisions:
- source_word: ὑποδείξαντος
  choice: тот сообщил
  rationale: Причастие означает, что некто дал знать или указал на случившееся; «сообщил» естественно передаёт это в контексте доклада, не превращая его в официальное провозглашение.
- source_word: νυκτός
  choice: ночью
  rationale: Родительный времени обозначает действие в течение ночи; краткое русское «ночью» точно и естественно.
- source_word: τὸ προσταγέν
  choice: приказанное
  rationale: Субстантивированное причастие буквально обозначает то, что было приказано. «Приказанное» сохраняет предметную неопределённость греческого выражения и не подменяет его самим «приказом».
- source_word: ἐπὶ τέλος
  choice: до конца
  rationale: Выражение указывает на полное доведение действия до завершения, без дополнительной оценки его успешности.
- source_word: ἠγοχέναι
  choice: было доведено
  rationale: Форма в данном свидетельстве текстуально и морфологически трудна; в сочетании с ἐπὶ τέλος контекст указывает на исполнение приказанного до завершения. Пассивная конструкция естественна по-русски и не уточняет не названного исполнителя.
- source_word: προσμαρτυρησάντων
  choice: подтвердили это
  rationale: Глагол выражает присоединение свидетельства или подтверждение сказанного; «подтвердили это» сохраняет направленность свидетельства и звучит естественно.
- source_word: φίλων
  choice: друзья
  rationale: Сохранено обычное значение слова. Более служебное «приближённые» возможно в придворном контексте, но не требуется самой фразой.
