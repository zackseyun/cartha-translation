  text: But when the one who had pointed out that during the night the order had been carried through to completion[a], and their friends had borne witness to it,
translation:
  language: ru
  text: Когда же тот сообщил, что ночью приказанное было исполнено до конца[a], и их друзья подтвердили это,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая глагольная форма, переданная словами «было исполнено», в тексте Света трудна как с текстологической, так и с морфологической точки зрения; однако вся фраза ясно означает, что, согласно сообщению, приказанное было исполнено ночью до конца.
