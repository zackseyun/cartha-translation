  text: When the king considered this[a], and turned to drinking, he ordered those who had come to the banquet to recline around him.
translation:
  language: ru
  text: Обдумав это, царь обратился к питью и велел пришедшим на пир возлечь вокруг него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительная фраза в греческом тексте синтаксически трудна. Речь идёт о том, что гости должны были занять места полулёжа по отношению к царю; возможны также переводы «возлечь возле него» или «занять места выше его за столом».
    reason: textual_variant
lexical_decisions:
- source_word: λογισάμενος
  choice: обдумав это
  rationale: Аористное причастие от λογίζομαι обозначает, что царь принял во внимание предшествующее обстоятельство; местоимение «это» естественно связывает фразу с контекстом.
- source_word: τραπεὶς εἰς τὸν πότον
  choice: предался питью
  rationale: Оборот буквально выражает поворот к питью; «предался питью» естественно передаёт переход к застольному употреблению вина, не сужая πότος до названия конкретного напитка.
- source_word: παραγεγονότας
  choice: пришедшим
  rationale: 'Сохраняется глагольная сила перфектного причастия: речь идёт о людях, которые пришли и теперь присутствуют.'
- source_word: ἐπὶ τὴν συμποσίαν
  choice: на пир
  rationale: συμποσία обозначает совместное застолье, в том числе пир с питьём; «пир» здесь кратко, понятно и соответствует исторической обстановке.
- source_word: ὑπὲρ ἀνακλίνα αὐτοῦ
  choice: возлечь вокруг него
  rationale: Греческая фраза синтаксически трудна, но относится к размещению пирующих полулёжа относительно царя. «Возлечь» передаёт античный застольный обычай, а «вокруг него» сохраняет вероятный пространственный смысл без чрезмерной конкретизации.
