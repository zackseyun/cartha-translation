  yaml_path: translation/deuterocanon/3_maccabees/005/018.yaml
  text: But as the conversation kept dragging on[a], the king summoned Hermon and, with a bitter threat, asked for what reason the Jews had been spared, having survived beyond the appointed day.
translation:
  language: ru
  text: Но поскольку разговор всё затягивался, царь призвал Гермона и с горькой угрозой спросил, по какой причине иудеи уцелели, прожив ещё один день[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «были исцелены (или сохранены), прожив оставшийся день». Греческая фраза сжата и допускает разные толкования; по контексту речь, вероятно, идёт о том, что иудеи остались живы после дня, назначенного для их уничтожения.'
    reason: Лексические значения ἰάθησαν и περιοῦσαν ἡμέραν, а также синтаксическая связь оборота неоднозначны.
lexical_decisions:
- source_word: ἐπὶ πλεῖον … προσκοπτούσης τῆς ὁμιλίας
  choice: поскольку разговор всё затягивался
  rationale: Оборот указывает на дальнейшее затягивание или задержку разговора; русское выражение передаёт длительность и неприятную помеху, не сводя смысл к нейтральному продолжению.
- source_word: προσκαλεσάμενος
  choice: призвал
  rationale: Средний залог указывает, что царь велел Гермону явиться к нему; «призвал» естественно передаёт властный характер действия.
- source_word: μετὰ πικρίας ἀπειλῆς
  choice: с горькой угрозой
  rationale: Сохраняются единственное число ἀπειλῆς и буквальный образ πικρίας; выражение передаёт враждебный тон вопроса.
- source_word: τίνος ἕνεκεν αἰτίας
  choice: по какой причине
  rationale: Формулировка отражает подчёркнутый греческий вопрос о причине и остаётся естественной в современном русском языке.
- source_word: ἰάθησαν
  choice: остались невредимы
  rationale: Основное значение глагола — «были исцелены», но болезни в контексте нет. Здесь речь о сохранении от казни; «остались невредимы» сохраняет связь с избавлением, не добавляя явного действующего лица, как могло бы сделать «были пощажены».
- source_word: τὴν περιοῦσαν ἡμέραν περιβεβιωκότες
  choice: пережив назначенный им день
  rationale: Сжатый и трудный оборот говорит о том, что иудеи остались живы после критического дня, предназначенного для их уничтожения. В основном тексте дан контекстуально ясный вариант, а буквальная неопределённость отмечена в сноске.
