  yaml_path: translation/deuterocanon/3_maccabees/005/041.yaml
  text: For this reason the city is in turmoil because of the expectation[a], and as it grows with crowds[c][b], it is already in danger of being plundered many times.
translation:
  language: ru
  text: Поэтому город охвачен смятением из-за ожидания[a] и, всё больше наполняясь толпами[b], уже не раз оказывается под угрозой разграбления[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за предвкушения»; греческое слово обозначает состояние ожидания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сборищами», «собравшимися группами»; греческое слово может обозначать толпы или массовые собрания.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «часто оказывается под угрозой разграбления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν χάριν
  choice: Поэтому
  rationale: Естественно передаёт причинно-следственную связь с предшествующими обстоятельствами; буквально — «по причине чего».
- source_word: ἡ πόλις
  choice: город
  rationale: Сохраняет греческий образ города как целого, подразумевающий также его жителей.
- source_word: διὰ τὴν προσδοκίαν
  choice: из-за напряжённого ожидания
  rationale: προσδοκία означает ожидание или предчувствие ожидаемого события; добавление «напряжённого» естественно выражает тревожный контекст, не уточняя предмет ожидания.
- source_word: ὀχλεῖ
  choice: охвачен смятением
  rationale: Передаёт состояние волнения и общественной неурядицы, выраженное ὀχλέω, на естественном современном русском языке.
- source_word: πληθύνουσα
  choice: всё больше наполняясь
  rationale: Передаёт продолжающееся увеличение, грамматически сохраняя «город» субъектом причастного оборота.
- source_word: συστροφαῖς
  choice: скоплениями людей
  rationale: Слово может обозначать собравшиеся группы, толпы или сборища; нейтральное «скопления людей» сохраняет широту значения и допускает напряжённый оттенок контекста.
- source_word: ἤδη
  choice: уже
  rationale: Передаёт наступивший и развивающийся характер опасности.
- source_word: κινδυνεύει
  choice: оказывался под угрозой
  rationale: Естественно выражает состояние опасности; форма в сочетании с «не раз» передаёт повторявшуюся к настоящему моменту угрозу.
- source_word: πολλακὶς
  choice: не раз
  rationale: Идиоматично передаёт значение «много раз, неоднократно, часто», не преувеличивая точное число случаев.
- source_word: διαρπασθῆναι
  choice: разграбления
  rationale: Точно передаёт пассивный инфинитив со значением разграбления или расхищения города.
theological_decisions: []
