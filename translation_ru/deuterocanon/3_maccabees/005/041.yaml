  register: Современный литературный русский язык, сдержанный и повествовательный. Сохранён образ города как единого целого; тяжеловесная буквальная конструкция «увеличиваясь скоплениями» заменена естественным причастным оборотом без устранения неоднозначности существительного συστροφαῖς.
