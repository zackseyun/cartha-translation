lexical_decisions:
- source_word: ἀνεβόησαν φωνῇ μεγάλῃ σφόδρα
  choice: возопили во весь голос
  rationale: Передаёт усиленный громкий вопль естественным, возвышенным русским выражением без неуклюжего буквального сочетания «очень громким голосом».
- source_word: τὸν τῆς ἁπάσης δυνάστην
  choice: Владыку всего
  rationale: «Владыка» передаёт верховную власть δυνάστης и соответствует молитвенному, возвышенному регистру; «всего» сохраняет всеобъемлющий смысл ἁπάσης.
- source_word: ἱκετεύοντες
  choice: умоляя
  rationale: Передаёт настойчивую, отчаянную мольбу и естественно связывает причастный оборот с основным глаголом.
- source_word: οἰκτείραι
  choice: смилостивиться над ними
  rationale: Точно выражает просьбу о сострадательной милости и сохраняет αὐτούς как объект просьбы.
- source_word: μετὰ ἐπιφανείας
  choice: явственно прийти им на помощь
  rationale: Передаёт явный, зримый характер испрашиваемого вмешательства; добавление идеи помощи обусловлено контекстом, но отмечено сноской как интерпретирующее раскрытие эллиптической греческой фразы.
- source_word: ἤδη πρὸς πύλας ᾅδου καθεστῶτας
  choice: ведь они уже стояли у врат Аида
  rationale: Сохраняет пространственный образ крайней близости к смерти, значение ἤδη и статическое состояние, выраженное καθεστῶτας.
theological_decisions:
- issue: Передача ᾅδου в иудейско-греческом контексте
  choice: Аида
  alternative: царства мёртвых; смерти; преисподней
  rationale: Транслитерированное имя сохраняет конкретный греческий образ и не подменяет его более толковательным либо конфессионально нагруженным термином.
- issue: Смысл μετὰ ἐπιφανείας в просьбе о Божьей милости
  choice: явственно прийти им на помощь
  alternative: смилостивиться над ними с явлением
  rationale: Контекст предполагает открыто проявившееся спасительное вмешательство, однако буквальная конструкция допускает понимание «с явлением/явным проявлением»; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным регистром. «Возопили», «Владыка» и «врата» поддерживают достоинство повествования, оставаясь понятными современному читателю.
