  text: So the one who had been given these orders turned to feasting[a], gathering those of his friends and of the army who were most hostile toward the Jews.
translation:
  language: ru
  text: Тот, кому были отданы эти распоряжения, обратился к пиршеству[a], собрав тех из своих друзей и воинов, кто был наиболее враждебно настроен к иудеям.
  philosophy: optimal-equivalence
