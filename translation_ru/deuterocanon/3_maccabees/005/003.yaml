lexical_decisions:
- source_word: ὁ ... προσταχθεὶς
  choice: Получивший этот приказ
  rationale: Субстантивированное причастие указывает на человека, которому только что было отдано распоряжение; русский вариант сохраняет пассивный смысл и естественно связывает стих с контекстом.
- source_word: ἐτρέπετο
  choice: предался
  rationale: Возвратная форма передаёт направленность к занятию; в сочетании с пиршеством «предался» звучит естественно и отражает переход к этому действию.
- source_word: τὴν εὐωχίαν
  choice: пиршеству
  rationale: Слово обозначает праздничную трапезу с едой и питьём; «пиршество» сохраняет торжественно-повествовательный регистр.
- source_word: συναγαγὼν
  choice: собрав
  rationale: Деепричастие кратко и точно передаёт сопутствующее действие аористного причастия.
- source_word: τοὺς μάλιστα τῶν φίλων καὶ τῆς στρατιᾶς
  choice: тех из своих друзей и воинов, кто был особенно
  rationale: Конструкция обозначает отобранную из двух групп часть людей, характеризуемую последующим оборотом; «воины» естественно передаёт представителей войска.
- source_word: ἀπεχθῶς ἔχοντας πρὸς τοὺς Ἰουδαίους
  choice: враждебно настроен к иудеям
  rationale: Идиома выражает устойчивую неприязнь или враждебное расположение, не обязательно конкретное действие; выбранная формулировка сохраняет эту смысловую меру.
