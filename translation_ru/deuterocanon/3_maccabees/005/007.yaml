  text: They all called upon the almighty Lord[a], the sovereign over every dominion, their merciful God and Father, with tears and with an unceasing cry, begging him,
translation:
  language: ru
  text: Все они со слезами и неумолкающим воплем воззвали к Господу Вседержителю и Владыке, властвующему над всякой властью[a], к их милосердному Богу и Отцу, умоляя Его,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над всяким властителем». В греческом тексте употреблены однокоренные слова со значением владычества и власти, подчёркивающие Божье верховенство над всякой властью и всеми властителями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παντοκράτορα
  choice: Вседержителю
  rationale: Традиционный и точный русский эквивалент библейского титула παντοκράτωρ; передаёт всеохватную власть Бога.
- source_word: κύριον
  choice: Господу
  rationale: Естественная передача κύριος как божественного титула в русском библейском регистре.
- source_word: πάσης δυνάστην δυναστεύοντα
  choice: Владыке, властвующему над всякой властью
  rationale: Передача сохраняет риторическое сочетание однокоренных понятий господства и власти, не сводя выражение к одному отвлечённому титулу.
- source_word: ἐλεήμονα θεὸν αὐτῶν καὶ πατέρα
  choice: к их милосердному Богу и Отцу
  rationale: Сохраняются оба прямо названных отношения — Бог и Отец; притяжательное местоимение естественно относится к обоим существительным.
- source_word: δυσκαταπαύστῳ βοῇ
  choice: неумолкающим воплем
  rationale: Передаёт продолжительный, с трудом прекращаемый отчаянный крик; «вопль» соответствует напряжённости сцены.
- source_word: μετὰ δακρύων
  choice: со слезами
  rationale: Прямая и естественная передача эмоционального состояния молящихся.
- source_word: πάντες
  choice: Все они
  rationale: Начальная позиция подчёркивает совместное действие всей группы.
- source_word: ἐπεκαλέσαντο
  choice: воззвали к
  rationale: Выражает молитвенное обращение и сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: δεόμενοι
  choice: умоляя Его
  rationale: Причастие передаёт настойчивую просьбу; оборот также сохраняет незавершённость стиха перед продолжением.
theological_decisions:
- issue: Передача последовательности божественных титулов без устранения их накопительного эффекта
  choice: Господу Вседержителю и Владыке, властвующему над всякой властью, к их милосердному Богу и Отцу
  alternative: Господу Вседержителю, верховному над всяким властителем, их милосердному Богу и Отцу
  rationale: Основной текст сохраняет ряд титулов и однокоренную игру слов о власти. Слово «Отец» оставлено без нейтрализации, поскольку оно прямо присутствует в греческом тексте.
- issue: Неоднозначность объекта всеобъемлющего владычества
  choice: над всякой властью
  alternative: над всяким властителем
  rationale: Формулировка основного текста естественна по-русски и выражает верховенство Бога над любой властью; личное понимание — над каждым правителем или властителем — сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейской торжественностью. «Вопль» и «воззвали» уместны для отчаянной общей молитвы; синтаксис сохраняет накопление божественных титулов и незавершённость фразы.
