base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/027.yaml
  text: But when he had accepted it and was struck with astonishment at the lawless outcome[a], being in every way overcome by ignorance[b], he kept asking whether what had been decreed had indeed been carried out for him with urgency.
translation:
  language: ru
  text: Но он, приняв это и поразившись беззаконному исходу[a], оказался совершенно во власти неведения и всё спрашивал, действительно ли уже было спешно исполнено для него то, что было предписано[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беззаконному результату». Греческое ἔξοδος буквально может означать также «выход» или «уход», но здесь, вероятнее всего, речь идёт об исходе событий.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «то, что было записано», «изданное распоряжение». Греческое выражение может особо указывать на письменное предписание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποδεξαμένου
  choice: приняв это
  rationale: Аористное причастие среднего залога от ἀποδέχομαι передаёт принятие или получение ранее сообщённого. «Приняв это» сохраняет возможную двусмысленность между получением и одобрительным принятием, не уточняя подразумеваемый объект.
- source_word: καταπλαγέντος
  choice: поразившись
  rationale: Форма выражает сильное потрясение или изумление; «поразившись» естественно передаёт это состояние в русском повествовании.
- source_word: ἀνόμῳ ἐξόδῳ
  choice: беззаконному исходу
  rationale: ἄνομος означает «беззаконный, противозаконный», а ἔξοδος может обозначать выход, завершение или исход. В данном контексте «исход» сохраняет образ греческого слова и остаётся понятным как результат событий.
- source_word: κατὰ πάντα ἀγνωσίᾳ κεκρατημένος
  choice: оказался совершенно во власти неведения
  rationale: Перфектное страдательное причастие κρατέω с дательным выражает состояние под властью неведения; оборот сохраняет силу оригинала и не сводит её просто к отсутствию сведений.
- source_word: ἐπυνθάνετο
  choice: всё спрашивал
  rationale: Имперфект передаёт продолжавшийся или повторявшийся расспрос.
- source_word: τὸ διαγραμμένον
  choice: то, что было предписано
  rationale: Причастие от διαγράφω может означать записанное, установленное письменно или предписанное. «Предписано» естественно для придворно-административного контекста, а письменный оттенок отмечен в сноске.
- source_word: ἔτι
  choice: уже
  rationale: В вопросе о выполнении распоряжения русское «уже» естественно передаёт временной оттенок ἔτι, не превращая его без необходимости в чисто усилительное наречие.
- source_word: μετὰ σπουδῆς
  choice: спешно
  rationale: Оборот обозначает поспешность, усердие или срочность; здесь наречие «спешно» кратко и естественно характеризует исполнение приказа.
- source_word: τετέλεσται
  choice: было исполнено
  rationale: Перфект страдательного залога означает доведение предписанного до исполнения; «исполнено» соответствует контексту распоряжения и избегает нежелательной двусмысленности слова «казнено».
