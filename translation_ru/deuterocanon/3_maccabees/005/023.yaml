lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Но как раз тогда
  rationale: Передаёт непосредственность ἄρτι и лёгкий повествовательный поворот, выраженный δέ.
- source_word: ἀλεκτρυὼν ἐκέκραγεν ὄρθρος
  choice: на рассвете, пропел петух
  rationale: ὄρθρος обозначает рассвет и естественно воспринимается как временное уточнение; аорист ἐκέκραγεν передан завершённым событием без внесения в русский текст спорного плюсквамперфекта.
- source_word: τὰ θηρία
  choice: зверей
  rationale: В контексте казни речь идёт об опасных животных; «звери» сохраняет угрожающий оттенок и не уточняет вид.
- source_word: καθωπλικὼς
  choice: снарядив
  rationale: Причастие от καθοπλίζω означает вооружить или полностью оснастить; «снарядив» естественно применимо к подготовленным для нападения зверям и не утверждает буквально наличие оружия.
- source_word: διεκίνει
  choice: погонял их
  rationale: Имперфект передаёт продолжавшееся действие, а διακινέω здесь означает приводить в движение, подгонять или гонять зверей.
- source_word: ἐν τῷ μεγάλῳ περιστυλίῳ
  choice: по большому перистилю
  rationale: περιστύλιον — архитектурное пространство с колоннадой; предлог «по» согласуется с движением зверей, тогда как буквальное «в» также возможно.
- source_word: ὁ Ἕρμων
  choice: Гермон
  rationale: Устоявшаяся русская передача греческого имени Ἕρμων.
