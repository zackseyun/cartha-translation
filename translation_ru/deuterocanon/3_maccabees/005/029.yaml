translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Кавычки вокруг «друзья» отмечают возможное придворное наименование; обращение «царь» сохраняет прямоту греческого текста. Пунктуация отделяет показ зверей и войск от последующей прямой речи.
