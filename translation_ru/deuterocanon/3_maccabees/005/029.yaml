  text: 'Hermon was showing them the beasts and all the forces: “They are prepared[a], O king[c][b], according to that intention of yours.”'
translation:
  language: ru
  text: 'Гермон и все «друзья»[a] показывали[b] зверей и войска: «Всё готово, царь, в соответствии с тем твоим замыслом[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «друзья»; при эллинистическом царском дворе так могли называть царских приближённых или придворных.'
    reason: cultural_note
  - marker: b
    text: 'Или: «представляли», «указывали на»; греческий имперфект указывает на продолжавшееся действие.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тому твоему намерению» или «тому твоему плану».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδείκνυεν
  choice: показывали
  rationale: Глагол означает «показывать, представлять, указывать»; имперфект передаёт продолжающееся действие. Хотя сказуемое в греческом стоит в единственном числе перед составным подлежащим, по смыслу подлежащими выступают Гермон и все «друзья».
- source_word: ὁ Ἕρμων
  choice: Гермон
  rationale: Транслитерация имени Ἕρμων в соответствии с принятой русской библейской формой.
- source_word: πάντες οἱ φίλοι
  choice: все «друзья»
  rationale: Сохранено буквальное обозначение, которое в эллинистическом придворном контексте могло служить названием царских приближённых.
- source_word: τὰ θηρία
  choice: зверей
  rationale: Слово обозначает животных, здесь — опасных зверей, приготовленных для расправы; «звери» сохраняет зловещий оттенок контекста.
- source_word: τὰς δυνάμεις
  choice: войска
  rationale: Множественное число δύναμις в данном контексте естественно обозначает военные силы; «войска» звучит ясно и конкретно, не уточняя их состав.
- source_word: Ἡτοίμασται
  choice: Всё готово
  rationale: Греческая форма — перфект страдательного залога, третье лицо единственного числа. Безлично-обобщённое русское выражение сохраняет итоговое состояние готовности и согласуется с греческим единственным числом лучше, чем «они готовы».
- source_word: βασιλεῦ
  choice: царь
  rationale: Прямое обращение в звательном падеже естественно передаётся русским обращением «царь», без добавления более интерпретирующего титула «ваше величество».
- source_word: κατὰ τὴν σὴν ἐκείνην πρόθεσιν
  choice: согласно тому твоему замыслу
  rationale: πρόθεσις допускает значения «намерение», «цель», «замысел»; «замысел» естественно передаёт заранее принятое решение, а «тому твоему» сохраняет указательно-ретроспективную силу ἐκείνην.
