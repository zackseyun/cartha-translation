base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/049.yaml
  text: Considering that moment to be for them the final turn of life[a], the end of their most miserable expectation, they turned to pity and lamentation and kept kissing one another, embracing their relatives, falling upon their necks—parents upon children and mothers upon young daughters; and others, holding infant babies to their breasts[c][b], were drawing out their last milk.
translation:
  language: ru
  text: 'Сочтя этот миг последним переломом в своей жизни[a], концом мучительнейшего ожидания[b], они предались жалости и плачу, не переставая целовать друг друга, обнимая родных и бросаясь друг другу на шею[c]: родители — детям, матери — юным дочерям[d]. Другие же женщины держали у груди новорождённых младенцев, в последний раз сосавших молоко.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «последним поворотом (или склонением) жизни»; ῥοπή может обозначать решающий миг, когда положение окончательно меняется.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «концом мучительнейшего предчувствия» либо «напряжённого ожидания»; προσδοκία допускает эти оттенки.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «падая на шеи» — обычный греческий образ объятия в горе или любви.'
    reason: cultural_note
  - marker: d
    text: 'Или: «молодым женщинам»; в данном перечислении семейных связей речь, вероятнее всего, идёт о дочерях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστάτην βίου ῥοπὴν
  choice: последним переломным мгновением своей жизни
  rationale: ῥοπή обозначает поворот, склонение чаши весов или решающий миг. Перевод сохраняет образ критического перелома, но звучит понятнее по-русски, чем буквальное «последний поворот жизни».
- source_word: δόξαντες
  choice: сочтя
  rationale: Причастие передаёт восприятие обречённых людей, а не объективное утверждение о наступившей смерти.
- source_word: τὸ τέλος τῆς ἀθλιωτάτης προσδοκίας
  choice: концом мучительнейшего ожидания
  rationale: προσδοκία может означать ожидание, предчувствие или напряжённое выжидание; в контексте ожидаемой казни естественно русское «ожидание».
- source_word: εἰς οἶκτον καὶ γόους τραπέντες
  choice: они предались скорби и плачу
  rationale: Буквальное «обратились к жалости и причитаниям» по-русски неестественно. В данном контексте οἶκτος выражает горестное сострадание, а γόοι — плач и стенания.
- source_word: κατεφίλουν
  choice: не переставая целовать
  rationale: Имперфект и усилительное κατα- передают продолжительное, многократное и горячее прощальное целование.
- source_word: περιπλεκόμενοι τοῖς συγγενέσιν
  choice: обнимая родных
  rationale: Передаёт тесные объятия с родственниками естественным современным русским выражением.
- source_word: ἐπὶ τοὺς τραχήλους ἐπιπίπτοντες
  choice: бросаясь друг другу на шею
  rationale: Сохранён яркий греческий образ эмоционального объятия; добавлен взаимный смысл, подразумеваемый сценой.
- source_word: νεάνισιν
  choice: юным дочерям
  rationale: Слово само по себе означает молодых женщин или девушек, но параллелизм «родители — детям, матери — ...» указывает на дочерей; неоднозначность отмечена в сноске.
- source_word: νεογνὰ ... βρέφη
  choice: новорождённых младенцев
  rationale: Сочетание двух близких слов подчёркивает крайнюю юность и беспомощность детей.
- source_word: τελευταῖον ἕλκοντα γάλα
  choice: в последний раз сосавших молоко
  rationale: 'Причастие ἕλκοντα грамматически относится к младенцам: именно они тянут, то есть сосут, молоко. Русская формулировка ясно сохраняет этот смысл и ожидаемую окончательность кормления.'
