lexical_decisions:
- source_word: περιχαρεῖς
  choice: чрезвычайно обрадовавшись
  rationale: Передаёт усиленное значение прилагательного — сильную радость — естественной русской конструкцией, связанной с последующим причастием.
- source_word: ἀναλύσαντες
  choice: разойдясь
  rationale: В данном контексте глагол, вероятнее всего, описывает расхождение собравшихся по местам, где им предстояло разместить силы; значение «обретя уверенность» не является прямым значением этого слова.
- source_word: οἱ φίλοι καὶ συγγενεῖς
  choice: друзья и родственники
  rationale: Прямо и без архаизации сохраняет две названные в греческом тексте группы.
- source_word: μετὰ πίστεως
  choice: с уверенностью
  rationale: В повествовательном контексте πίστις может обозначать уверенность или доверие; неоднозначность и буквальное «с верой» сохранены в сноске.
- source_word: διέτασσον
  choice: стали размещать
  rationale: Имперфект передаёт разворачивавшееся организованное размещение сил; конструкция «стали размещать» естественно выражает начало действия после предшествующих обстоятельств.
- source_word: τὰς δυνάμεις
  choice: силы
  rationale: Сохраняет широту военного или охранного значения δύναμις, не сужая его без необходимости до конкретного вида подразделений.
- source_word: ἐπὶ τοὺς εὐκαιροτάτους τόπους
  choice: в наиболее подходящих местах
  rationale: Передаёт превосходную степень и идею особенно удобных, благоприятных для поставленной цели мест без добавления отсутствующего в тексте технического термина «стратегические».
- source_word: πρὸς τὴν τήρησιν
  choice: для его охраны
  rationale: Ясно выражает цель размещения; местоимение «его» естественно указывает на город и не меняет содержания.
theological_decisions:
- issue: Значение πίστις в выражении μετὰ πίστεως
  choice: с уверенностью
  alternative: с верой; верно, преданно
  rationale: В этом повествовательном и охранном контексте выражение естественно относится к уверенности действующих лиц, однако греческое πίστις допускает буквальное «вера» и характеристику верности действий. Сноска сохраняет эту смысловую открытость, не навязывая богословского толкования.
