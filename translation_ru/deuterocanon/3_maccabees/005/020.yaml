  to: Отличаясь жестокостью, превосходившей жестокость Фаларида[a], он сказал, что они должны считать сегодняшний сон милостью[b]. Сохранив их в живых до наступающего дня, приготовь слонов таким же образом для истребления беззаконных иудеев[c].
