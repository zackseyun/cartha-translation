    issue: Временная форма «когда их сохранят в живых»
    rationale: συντηρηθέντας — аористное страдательное причастие, зависящее от императива. Будущее придаточное в русском меняет синтаксическую связь и несколько затрудняет фразу.
  - severity: low
    issue: Добавление «как прежде»
    rationale: κατὰ τὸ ὅμοιον означает «таким же образом / так же», но само по себе не содержит слова «прежде».
  - severity: low
    issue: Выбор «нечестивых»
    rationale: Этот вариант возможен, но «беззаконных» точнее сохраняет основной смысл ἀθέμιτος — противный закону, установлению или обычаю — без усиления религиозного оттенка.
