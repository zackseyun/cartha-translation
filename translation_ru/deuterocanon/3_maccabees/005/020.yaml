base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/020.yaml
  text: Having a savagery worse than Phalaris[a], he said that they should be thankful to sleep today; but, once they had been kept alive until the coming day[c][b], prepare the elephants in the same way for the destruction of the lawless Jews.
translation:
  language: ru
  text: Отличаясь жестокостью, превосходившей жестокость Фаларида[a], он сказал, что они должны считать сегодняшний сон милостью[b]. Сохранив их в живых до наступающего дня, приготовь слонов таким же образом для истребления беззаконных иудеев[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фаларид — сицилийский правитель VI века до н. э., вошедший в греческое предание как образец крайней жестокости.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «быть благодарными за сегодняшний сон»; смысл в том, что позволение поспать в этот день они должны считать оказанной им милостью.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «нечестивых иудеев». Это враждебное наименование звучит в речи гонителя.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὠμότητα χείρονα Φαλάριδος ἐσχηκὼς
  choice: отличаясь жестокостью, превосходившей жестокость Фаларида
  rationale: Оборот передаёт устойчивое состояние, выраженное перфектным причастием ἐσχηκώς, и сравнительную меру крайней жестокости; повтор слова «жестокость» естественнее и яснее по-русски, чем буквальное «имея жестокость хуже Фаларида».
- source_word: τὸ τῆς σήμερον ὕπνῳ χάριν ἔχειν αὐτούς
  choice: они должны быть благодарны за то, что сегодня им позволено поспать
  rationale: Идиома χάριν ἔχειν означает испытывать благодарность или считать полученное милостью. Добавление «им позволено» раскрывает подразумеваемый дар отсрочки, не превращая ὕπνος в отсутствующее в тексте «затишье».
- source_word: συντηρηθέντας
  choice: когда их сохранят в живых
  rationale: В контексте отложенного умерщвления συντηρέω означает сохранение жизни до назначенного дня; придаточная конструкция естественно передаёт аористное пассивное причастие.
- source_word: εἰς τὴν ὑποτέλλουσαν ἡμέραν
  choice: до наступающего дня
  rationale: ὑποτέλλουσαν обозначает приближающийся, наступающий день; формулировка сохраняет образ движения времени и не сводит его непременно к слову «завтра».
- source_word: κατὰ τὸ ὅμοιον
  choice: так же, как прежде
  rationale: Выражение отсылает к уже описанному способу приготовления. «Как прежде» делает эту анафорическую связь ясной без введения новых обстоятельств.
- source_word: ἐπὶ τὸν ... ἀφανισμόν
  choice: для истребления
  rationale: ἀφανισμός обозначает полное уничтожение; «истребление» передаёт целенаправленный насильственный характер замысла точнее нейтрального «уничтожения».
- source_word: ἀθεμίτων Ἰουδαίων
  choice: нечестивых иудеев
  rationale: ἀθέμιτος означает противное установленному праву, обычаю или священному порядку. В устах гонителя это враждебный эпитет; «нечестивых» сохраняет религиозно-нравственный оттенок оскорбления.
theological_decisions:
- issue: Враждебный эпитет ἀθεμίτων в отношении иудеев
  choice: нечестивых иудеев
  alternative: беззаконных иудеев
  rationale: Эпитет следует сохранить как часть речи гонителя, не смягчая и не представляя его оценку голосом повествователя. «Нечестивых» передаёт возможный сакральный оттенок ἀθέμιτος, тогда как «беззаконных» сильнее акцентирует нарушение закона.
- issue: Смысл разрешённого сна
  choice: должны быть благодарны за то, что сегодня им позволено поспать
  alternative: должны считать сегодняшний сон милостью
  rationale: 'Обе формулировки сохраняют жестокую иронию приказа: отсрочка казни представлена как милость. Основной вариант звучит естественнее для современного читателя и не разрешает богословски напряжённую риторику говорящего.'
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис слегка возвышенный, но ясный; приказ передан единственным числом «приготовь» в соответствии с ἑτοίμασον. Оскорбительный эпитет сохранён как цитируемая речь персонажа, а не как оценка перевода.
