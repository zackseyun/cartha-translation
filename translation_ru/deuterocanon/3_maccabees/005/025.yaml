base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/025.yaml
  text: But the Jews[a], as the indivisible time drew them together in soul, stretched out their hands to heaven and, with mournful songs, offered a tearful plea, begging the greatest God to help them again without delay.
translation:
  language: ru
  text: Но иудеи в течение этого непрерывного времени, единые душой[a], простирали руки к небу и в скорбных песнопениях возносили многослёзную мольбу, прося величайшего Бога вновь без промедления помочь им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будучи едины душой в это нераздельное время». Греческое выражение необычно и сжато: в нём соединены мысли о непрерывности времени и внутреннем единстве людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμερῆ
  choice: в течение всего этого нераздельного времени
  rationale: Прилагательное буквально означает «неразделённый, неделимый» и характеризует χρόνον как непрерывный отрезок времени. «Нераздельного» сохраняет необычный образ греческого текста, а «в течение всего» делает связь естественной по-русски.
- source_word: ψυχοκοινούμενοι
  choice: объединяясь душой
  rationale: Редкое сложное причастие выражает внутреннее единение на уровне души. Формулировка сохраняет образ души и не сводит его к более конфессионально окрашенному «единению в духе».
- source_word: πολυδάκρυν ἱκετίαν
  choice: многослёзную мольбу
  rationale: Сочетание обозначает настойчивую просьбу, сопровождаемую обильными слезами. «Многослёзную» несколько возвышенно, но точно передаёт составной эпитет и соответствует достоинству повествования.
- source_word: ἐν μέλεσιν γοεροῖς
  choice: в скорбных песнопениях
  rationale: μέλη — песни или напевы, а γοερός указывает на плачевный, скорбный характер. «Песнопения» естественно передаёт молитвенное пение, не уточняя его форму сверх источника.
- source_word: τείνοντες τὰς χεῖρας εἰς τὸν οὐρανόν
  choice: простирали руки к небу
  rationale: Сохранён традиционный жест молитвы и направление движения; «простирали» уместно в современном литературном библейском регистре.
- source_word: τοῦ μεγίστου θεοῦ
  choice: величайшего Бога
  rationale: Это прямое соответствие превосходной степени μέγιστος. Вариант «Всевышнего Бога» был бы привычнее, но вводил бы иной греческий титул.
- source_word: πάλιν
  choice: вновь
  rationale: Передаёт просьбу о повторном Божьем вмешательстве и подразумевает прежнюю помощь.
- source_word: συντόμως
  choice: без промедления
  rationale: В контексте просьбы наречие означает скорое, незамедлительное действие. Формулировка ясно передаёт срочность.
theological_decisions:
- issue: Передача τοῦ μεγίστου θεοῦ
  choice: величайшего Бога
  alternative: Всевышнего Бога; верховного Бога
  rationale: Греческий текст содержит превосходную степень «величайший», а не обычное обозначение «Всевышний». Прямая передача сохраняет лексику источника и не подменяет её традиционным титулом.
- issue: Передача ψυχοκοινούμενοι
  choice: объединяясь душой
  alternative: будучи едины духом; словно одна душа
  rationale: Редкое слово описывает внутреннее общинное единство, но не позволяет однозначно отождествить ψυχή с «духом» или превратить выражение в устойчивую формулу. Выбранный вариант сохраняет образ и неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Необычность греческого выражения ἀμερῆ ... ψυχοκοινούμενοι сохранена, но синтаксис сделан понятным. Причастия объединены в одно протяжённое предложение вслед за источником; эмоциональная напряжённость передана словами «скорбных», «многослёзную» и «без промедления».
