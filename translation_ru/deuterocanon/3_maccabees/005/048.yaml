lexical_decisions:
- source_word: ὡς δὲ
  choice: Когда же
  rationale: Передаёт временное значение оборота и переход к следующему событию повествования.
- source_word: τῶν ἐλεφάντων ἐξιόντων ἐπὶ πύλην
  choice: как слоны выходят к воротам
  rationale: «Выходят» сохраняет конкретное движение, а «к воротам» передаёт направление ἐπί с винительным падежом, не утверждая ни прибытия, ни нападения на ворота.
- source_word: τῆς ἑπομένης ἐνόπλου δυνάμεως
  choice: шедшего следом вооружённого войска
  rationale: 'Сохраняет буквальную последовательность: вооружённая сила движется вслед за слонами; «войско» естественно в данном военном контексте.'
- source_word: τῆς τε τοῦ πλήθους πορείας
  choice: от движения толпы
  rationale: πορεία обозначает продвижение или движение, а πλήθος — множество людей; формулировка ясна и не усиливает военную окраску слова.
- source_word: κονιορτόν
  choice: пыль
  rationale: Прямое соответствие греческому существительному без добавления образа «облака пыли».
- source_word: βαρυχῆ θόρυβον
  choice: тяжёлый гул
  rationale: «Тяжёлый» сохраняет значение весомого, низкого или мощно резонирующего звука, а «гул» естественно передаёт θόρυβος в этой сцене.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: В контексте обозначает еврейский народ как этнорелигиозную общность; традиционное «иудеи» соответствует стилю русской библейской прозы.
