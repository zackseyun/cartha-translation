  to: Около рассвета, когда у ипподрома уже собрались несметные толпы горожан, он вошёл в дворцовый двор[a] и настойчиво побуждал царя заняться стоявшим перед ним делом.
  rationale: Перевод исправляет чрезмерно узкое понимание αὐλή и добавленные оттенки в «перейти к намеченному делу». Пространственно трудная конструкция о городе и ипподроме передана естественной русской фразой о несметных толпах горожан у ипподрома, сохраняя сценический смысл греческого текста и английского аудиторского следа.
