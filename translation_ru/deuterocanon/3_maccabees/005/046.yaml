lexical_decisions:
- source_word: περὶ τὴν ἕω
  choice: Около рассвета
  rationale: Передаёт приблизительное указание времени, выраженное предлогом περὶ, естественным современным русским оборотом.
- source_word: πλήθεσιν ἀναριθμήτοις
  choice: несметными толпами
  rationale: Сохраняет значение множества людей и усилительную, гиперболическую силу определения ἀναριθμήτοις.
- source_word: κατὰ τοῦ ἱπποδρόμου καταμεστωμένης
  choice: город у ипподрома уже был переполнен
  rationale: Глагол передан сильным «переполнен», а пространственное κατὰ τοῦ ἱπποδρόμου — естественным «у ипподрома», без утверждения, будто весь город целиком был заполнен людьми.
- source_word: εἰς τὴν αὐλήν
  choice: во дворец[a]
  rationale: В царском контексте αὐλή может обозначать дворец или дворцовое пространство; основной вариант читается естественно, а смысловая широта отмечена в сноске.
- source_word: ἐπὶ τὸ προκείμενον
  choice: перейти к намеченному делу
  rationale: Передаёт идиоматический смысл дела, уже стоящего на повестке, и естественно сочетается с глаголом побуждения.
- source_word: ὤτρυνε
  choice: стал побуждать
  rationale: Сохраняет значение настойчивого побуждения к действию, не усиливая его до однозначного «подстрекать».
