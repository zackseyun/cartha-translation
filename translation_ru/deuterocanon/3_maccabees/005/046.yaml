    issue: «во дворец» для εἰς τὴν αὐλήν
    rationale: Основной вариант называет здание, хотя αὐλή прежде всего обозначает двор, дворцовое/придворное пространство; сноска не вполне исправляет чрезмерную конкретизацию основного текста.
  - severity: medium
    issue: «перейти к намеченному делу» для ἐπὶ τὸ προκείμενον и ὤτρυνε
    rationale: Формулировка добавляет идею перехода и заранее запланированного дела. В греческом говорится о побуждении царя в связи с делом, стоявшим перед ним.
  - severity: low
