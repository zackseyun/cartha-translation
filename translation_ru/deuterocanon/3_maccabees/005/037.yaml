  text: Then, summoning Hermon with a threat, he said, “How many times must I command you about these very matters, you most wretched man?”
translation:
  language: ru
  text: 'Призвав Гермона, он с угрозой сказал: «Сколько раз мне ещё приказывать тебе насчёт этих самых дел, несчастнейший?»'
