lexical_decisions:
- source_word: τὸν δὲ Ἕρμωνα
  choice: Гермона
  rationale: Имя Ἕρμων передано принятой русской транслитерацией «Гермон»; частица δέ обозначает переход к следующему действию и не требует отдельного перевода после связного контекста.
- source_word: προσκαλεσάμενος
  choice: призвав
  rationale: Аористное среднее причастие означает, что говорящий позвал Гермона к себе; краткое «призвав» естественно передаёт предшествующее действие.
- source_word: μετὰ ἀπειλῆς
  choice: с угрозой
  rationale: Сохраняет конкретную предложную конструкцию и угрожающий характер речи без избыточного уточнения.
- source_word: Ποσάκις δὲ δεῖ σοι ... προστάττειν
  choice: Сколько раз мне ещё приказывать тебе
  rationale: Вопрос выражает раздражённую жалобу на необходимость повторять приказ. «Ещё» естественно передаёт подразумеваемую повторность; субъект «мне» восстанавливается из контекста.
- source_word: περὶ τούτων αὐτῶν
  choice: об этом самом
  rationale: Передаёт усилительное αὐτῶν и отсылку к уже известному делу; русское единственное собирательное «об этом» здесь звучит естественнее буквального «об этих самых вещах».
- source_word: ἀθλιώτατε
  choice: несчастнейший
  rationale: Сохраняет превосходную степень и оскорбительную силу звательного обращения, оставаясь в dignified literary register.
