lexical_decisions:
- source_word: ἐλεφαντάρχης
  choice: распорядитель слонов
  rationale: Передаёт должностную и функциональную роль человека, ведавшего слонами, без редкого и не вполне прозрачного калькированного термина.
- source_word: τὰ θηρία
  choice: зверей
  rationale: Сохраняет возвышенно-зловещую окраску θηρία; из контекста ясно, что речь о слонах.
- source_word: σχεδόν
  choice: почти
  rationale: Прямое и естественное соответствие наречию.
- source_word: εἰς κατάστεμα μανιῶδες
  choice: до бешенства
  rationale: Естественно по-русски выражает доведение до состояния неистовства, не ослабляя силы μανιῶδες.
- source_word: ἀγιοχὼς
  choice: доведя
  rationale: Форма в данном свидетеле трудна; контекст требует причастия, обозначающего подготовительное воздействие распорядителя на животных.
- source_word: εὐωδεστάτοις πόμασιν
  choice: чрезвычайно ароматными напитками
  rationale: Передаёт превосходную степень εὐωδεστάτοις и конкретное значение πόμασιν — того, что пьют.
- source_word: οἴνῳ λελιβανωμένῳ
  choice: вином, смешанным с ладаном
  rationale: Конкретно и понятно передаёт вино, обработанное ладаном; возможность значения «ароматизированным» сохранена в сноске.
- source_word: φοβερῶς κεκοσμημένα
  choice: устрашающе украсив их
  rationale: Сохраняет одновременно значение украшения/снаряжения и вызываемый им грозный, пугающий вид.
- source_word: κατασκευαῖς
  choice: сбруей
  rationale: В контексте слонов обозначает надетое на них оснащение или убранство; «сбруя» звучит естественнее общего «снаряжение», при этом альтернатива отмечена в сноске.
