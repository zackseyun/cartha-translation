lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Обычное повествовательное наречие, обозначающее следующий момент или действие.
- source_word: προσκαλεσάμενος
  choice: он призвал
  rationale: Аористное причастие обозначает действие, предшествующее описанию состояния; личная форма естественнее в современном русском повествовании.
- source_word: Ἕρμωνα
  choice: Гермона
  rationale: Традиционная русская передача греческого личного имени с падежным окончанием по синтаксису.
- source_word: τὸν πρὸς τῇ τῶν ἐλεφάντων ἐπιμελείᾳ
  choice: ведавшего слонами
  rationale: Кратко и естественно передаёт административную ответственность Гермона за содержание и надзор за слонами.
- source_word: βαρείᾳ
  choice: тяжкого
  rationale: Сохраняет метафору тяжести и выражает мучительную силу эмоционального состояния.
- source_word: μεμεστωμένος
  choice: будучи исполнен
  rationale: Передаёт перфектное причастие как устойчивое состояние полной охваченности чувством.
- source_word: ὀργῇ
  choice: гнева
  rationale: Основное значение слова; позволяет сохранить риторическую пару с χόλος.
- source_word: καὶ χόλῳ
  choice: и ярости
  rationale: Передаёт более острый оттенок неистового гнева и различает два близких греческих существительных.
- source_word: κατὰ πᾶν
  choice: совершенно
  rationale: Естественный русский усилитель со значением полной меры.
- source_word: ἀμετά-
  choice: непреклонной
  rationale: Видимая часть оборванного слова и контекст указывают на неуступчивость или неизменность гнева; «непреклонной» идиоматично сочетается с «яростью».
