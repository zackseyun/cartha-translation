  text: Yet[a], if it were not for your affection because of the gathering together and the necessity[b], you would have been deprived of life instead of these things.
translation:
  language: ru
  text: И всё же, если бы не привязанность, возникшая при совместном пребывании[a], и не необходимость[b], ты лишился бы жизни вместо всего этого[c].
