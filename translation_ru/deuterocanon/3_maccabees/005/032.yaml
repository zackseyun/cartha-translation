    text: 'Буквально: «вместо этих [вещей]». Греческое τούτων не уточняет, относятся ли эти слова к обстоятельствам, действиям, предметам или лицам.'
    reason: source_ambiguity
lexical_decisions:
- source_word: καίπερ εἰ μή
  choice: И всё же, если бы не
  rationale: 'Сочетание уступительного καίπερ с условным εἰ μή естественно передаётся как переход к нереальному условию: «И всё же, если бы не…».'
- source_word: διὰ τὴν τῆς συστροφῆς στοργήν
  choice: привязанность, возникшая благодаря нашему общению
  rationale: στοργή обозначает тёплую привязанность, а συστροφή здесь допускает значение общения, совместного пребывания или близкой связи. Контекст личного обращения лучше поддерживает «общение», чем физическое «скопление людей».
- source_word: καὶ τῆς χρείας
  choice: и не твоя полезность для меня
  rationale: χρεία может обозначать не только нужду, но и пользу, полезность или потребность в чьих-либо услугах. Греческая конструкция сжата; дополнение «для меня» проясняет подразумеваемое отношение говорящего к адресату, не меняя смысла.
- source_word: τὸ ζῆν ἐστερήθης
  choice: ты лишился бы жизни
  rationale: Артиклевый инфинитив τὸ ζῆν при пассивном ἐστερήθης образует естественно передаваемое по-русски выражение «лишиться жизни».
- source_word: ἀντὶ τούτων
  choice: вместо них
  rationale: ἀντί выражает замещение. Форма τούτων сама по себе может относиться как к лицам, так и к предметам; в данном контексте наиболее естественно личное «них».
