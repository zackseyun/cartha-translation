  yaml_path: translation/deuterocanon/3_maccabees/005/013.yaml
  text: And the Jews[a], having escaped the appointed hour, again were imploring their holy God to show to the proud nations, in magnificent generosity[c][b], the might of his hand.
translation:
  language: ru
  text: Иудеи же, избежав ранее назначенного часа, снова умоляли Святого, то есть своего Бога[a], готового к примирению[b], великодушно[d] явить гордым народам[c] могущество Своей руки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более гладко: «своего святого Бога». В греческом тексте буквально: «Святого, то есть своего Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «милостивого». Греческое слово обозначает того, кто готов к примирению; более буквально: «легко примиряющегося» или «легко умилостивляемого».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «гордым язычникам». Греческое слово может обозначать как народы вообще, так и язычников.'
    reason: lexical_alternative
  - marker: d
    text: 'Греческое наречие передаёт оттенки великодушия, благородства и величия; возможные варианты: «благородно», «величественно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαφυγόντες
  choice: избежав
  rationale: Причастие обозначает успешное избавление от уже назначенной опасной поры; «избежав» естественно передаёт как завершённость, так и угрозу.
- source_word: τὴν προσημανθεῖσαν ὥραν
  choice: назначенного часа
  rationale: προσημανθεῖσαν указывает на час, заранее отмеченный или определённый; «назначенного часа» сохраняет временной образ и звучит естественно по-русски.
- source_word: τὸν ἅγιον ἤγουν θεὸν αὐτῶν
  choice: Святого, то есть своего Бога
  rationale: Субстантивированное τὸν ἅγιον передано как титул «Святой», а пояснительная частица ἤγουν — явно выраженным «то есть»; тем самым сохраняется необычная структура греческого текста.
- source_word: ἤξιουν
  choice: снова умоляли
  rationale: Имперфект допускает длительное или повторявшееся прошение, а «умоляли» передаёт его настойчивый характер; повторность дополнительно выражена καὶ πάλιν.
- source_word: τὸν εὐκατάλλακτον
  choice: всегда готового к примирению
  rationale: Слово характеризует Бога как расположенного примириться или благосклонно принять обращающихся. Такая формулировка сохраняет смысл греческого прилагательного, не сводя его к отвлечённому «милостивого» и не создавая впечатления переменчивости.
- source_word: μεγαλοφθενῶς
  choice: величественно
  rationale: Редкое наречие выражает величие и благородную широту проявления; «величественно» сохраняет его самостоятельную наречную функцию и не смешивает его с εὐκατάλλακτον.
- source_word: ἑαυτοῦ χειρὸς κράτος
  choice: могущество Своей руки
  rationale: Сохранён конкретный библейский образ руки как проявления Божьей силы; «могущество» хорошо передаёт κράτος.
- source_word: ἔθνεσιν ὑπερηφάνοις
  choice: гордым народам
  rationale: Дательный падеж естественно понимается как адресат явления силы. ἔθνη передано нейтральным «народы», а ὑπερήφανοι — «гордые».
theological_decisions:
- issue: Характеристика Бога словом εὐκατάλλακτον
  choice: всегда готового к примирению
  alternative: милостивого; легко умилостивляемого
  rationale: Выбранная формулировка сохраняет заложенную в греческом тексте готовность Бога к примирению, но не вносит языческого оттенка Бога, которого можно легко задобрить. Слово «всегда» идиоматически выражает устойчивую расположенность, а не новую догматическую характеристику.
- issue: Соотношение выражений «Святой» и «свой Бог»
  choice: Святого, то есть своего Бога
  alternative: своего святого Бога
  rationale: Явная передача ἤγουν сохраняет пояснительное отношение между двумя наименованиями и не сглаживает необычную формулировку оригинала.
- issue: Направленность явления Божьей силы народам
  choice: явить гордым народам
  alternative: явить против гордых язычников
  rationale: Дательный ἔθνεσιν естественно обозначает тех, кому будет явлена сила. Перевод не усиливает фразу до прямого «против», поскольку предлог или иной однозначный показатель в греческом отсутствует.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя, однако пояснительная частица ἤγουν и отдельные смысловые роли εὐκατάλλακτον и μεγαλοφθενῶς сохранены, а не объединены. Прописное «Своей» следует принятому благоговейному оформлению местоимения, относящегося к Богу.
