  text: Снаряди слонов уже сейчас к завтрашнему дню — для уничтожения[a] иудеев.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для полного истребления иудеев». Греческое слово может обозначать полное уничтожение, вплоть до исчезновения.'
