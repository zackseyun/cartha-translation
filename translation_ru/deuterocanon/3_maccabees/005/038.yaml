lexical_decisions:
- source_word: καθόπλισον
  choice: снаряди
  rationale: Повелительное наклонение обозначает полное оснащение слонов для предстоящего действия; «снаряди» естественно для военного контекста и не добавляет отсутствующего в греческом тексте слова «оружие».
- source_word: ἔτι καὶ νῦν
  choice: уже сейчас
  rationale: Сочетание подчёркивает, что подготовку следует провести немедленно, уже в настоящий момент; эта формулировка сохраняет усиление и звучит естественно по-русски.
- source_word: εἰς τὴν αὔριον
  choice: чтобы завтра
  rationale: Оборот указывает на завтрашний день как срок намеченного действия. В русском целевая конструкция естественно связывает подготовку сейчас с истреблением завтра.
- source_word: ἐπὶ τὸν ... ἀφανισμόν
  choice: чтобы ... истребить
  rationale: ἀφανισμός означает уничтожение или устранение вплоть до полного исчезновения; глагольная конструкция ясно передаёт цель и сохраняет силу выражения.
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: В данном эллинистическом диаспорном контексте слово обозначает иудейский народ как этнорелигиозную общность, а не только жителей Иудеи.
theological_decisions:
- issue: Передача Ἰουδαῖοι в эллинистическом диаспорном контексте
  choice: иудеев
  alternative: жителей Иудеи
  rationale: Речь идёт об этнорелигиозной общности под властью Птолемеев, а не об одном лишь географическом происхождении.
- issue: Степень полноты уничтожения в ἀφανισμός
  choice: истребить
  alternative: уничтожить / стереть с лица земли
  rationale: «Истребить» передаёт направленность на уничтожение всего народа, не усиливая образность сверх значения греческого существительного; допустимая более буквальная номинальная передача отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий повелительный приказ передан энергично и достойно. Порядок обстоятельств слегка перестроен ради естественного русского синтаксиса, при сохранении противопоставления «сейчас — завтра».
