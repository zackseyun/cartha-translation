lexical_decisions:
- source_word: ὁ καθ᾽ εἷς τῶν φίλων
  choice: каждый из друзей
  rationale: Распределительное выражение обозначает каждого человека по отдельности; буквальное «каждый из друзей» естественно передаёт эту мысль и не уточняет придворный статус φίλοι сверх сказанного в греческом тексте.
- source_word: σκυθρωπῶς
  choice: мрачно
  rationale: Наречие передаёт угрюмый, понурый или суровый вид; «мрачно» кратко и естественно сохраняет внешнее проявление настроения.
- source_word: ὑπεκρέων
  choice: удаляясь
  rationale: Редкая и текстуально не вполне ясная форма в данном контексте, вероятно, указывает на удаление или отход; деепричастие сохраняет её зависимость от основного действия, выраженного ἀπέλυαν.
- source_word: τοὺς συνθροισμένους
  choice: собравшихся
  rationale: Субстантивированное причастие обозначает людей, которые собрались или были собраны; русское «собравшихся» передаёт это без лишнего уточнения.
- source_word: ἀπέλυαν
  choice: отпускал
  rationale: В данном контексте ἀπολύω означает распускать или отпускать людей. Единственное число согласовано с распределительным подлежащим «каждый», несмотря на множественное число греческого глагола.
- source_word: ἕκαστον ἐπὶ τὴν ἰδίαν ἀσχολίαν
  choice: каждого к его собственному делу
  rationale: ἕκαστον подчёркивает индивидуальное возвращение, а ἀσχολία может обозначать занятие, дело или работу. «К его собственному делу» сохраняет широкий смысл и распределительную конструкцию.
