lexical_decisions:
- source_word: λιτανία
  choice: мольба
  rationale: Передаёт просительный и настойчивый характер обращения естественнее, чем более широкое «молитва».
- source_word: ἐκτενῶς
  choice: горячая… непрестанно
  rationale: Греческое наречие допускает оттенки как напряжённости, так и протяжённости; основной текст передаёт оба, не сводя слово лишь к одному из них.
- source_word: ἀνέβαινεν
  choice: возносилась
  rationale: Имперфект выражает продолжавшееся действие; русская форма «возносилась» сохраняет этот аспект и уместный для молитвы образ движения вверх.
- source_word: εἰς τὸν οὐρανόν
  choice: к небу
  rationale: В контексте молитвы речь идёт о небесах как сфере Божьего присутствия; «к небу» естественно сочетается с «возносилась».
- source_word: τούτων
  choice: их
  rationale: Родительный указательного местоимения отсылает к ранее названным людям и естественно передаётся притяжательным местоимением.
- source_word: μὲν οὖν
  choice: Итак
  rationale: Передаёт переходно-следственную функцию сочетания частиц без излишней тяжеловесности.
