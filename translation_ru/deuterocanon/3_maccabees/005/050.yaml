  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: усиленный переход («Но вместе с тем»), прежние проявления помощи, источник «с неба», восприятие этой помощи, единодушное падение ниц и отделение младенцев от груди. «Пали ниц» естественно и достаточно сильно передаёт πρηνεῖς ... ῥίψαντες ἑαυτούς. Добавление «им» обоснованно контекстом αὐτῶν и не меняет смысла.'
