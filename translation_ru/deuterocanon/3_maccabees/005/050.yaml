  yaml_path: translation/deuterocanon/3_maccabees/005/050.yaml
  text: Yet nevertheless[a], when they also saw the help from heaven that had come to them before, they all together threw themselves down face-first, and separated the infants from the breasts[b],
translation:
  language: ru
  text: Но вместе с тем, увидев и прежние случаи помощи им с неба[a], они все единодушно пали ниц и отняли младенцев от груди[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежние избавления, дарованные им с неба». Греческое слово может обозначать помощь, поддержку или спасительное заступничество.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отделили младенцев от грудей», то есть прервали их кормление грудью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴν δὲ ἀλλὰ καὶ
  choice: Но вместе с тем ... и
  rationale: Сочетание союзов выражает усиленный повествовательный переход. Русское «но вместе с тем» сохраняет поворот мысли без неестественного нагромождения частиц, а «и» передаёт καί.
- source_word: τὰς ἔμπροσθεν αὐτῶν γεγενημένας ἀντιλήψεις
  choice: прежние случаи помощи им
  rationale: ἀντιλήψεις означает помощь, поддержку или отдельные проявления содействия; множественное число передано словом «случаи», а ἔμπροσθεν и γεγενημένας — определением «прежние».
- source_word: ἐξ οὐρανοῦ
  choice: с неба
  rationale: Сохранён буквальный и богословски значимый оборот без добавления прямо не названного божественного субъекта.
- source_word: συνιδόντες
  choice: увидев
  rationale: В контексте глагол восприятия может включать осознание; «увидев» естественно передаёт форму деепричастия и не снимает этой смысловой широты.
- source_word: πρηνεῖς ... ῥίψαντες ἑαυτούς
  choice: пали ниц
  rationale: Устойчивое современное литературное выражение ясно передаёт стремительное падение лицом вниз, не воспроизводя избыточно греческую рефлексивную конструкцию.
- source_word: ὁμοθυμαδόν
  choice: все единодушно
  rationale: Передаёт как совместность действия, так и единство побуждения; в данном молитвенно-драматическом контексте естественнее простого «все вместе».
- source_word: τὰ νήπια
  choice: младенцев
  rationale: Упоминание кормления грудью показывает, что речь идёт о совсем маленьких детях.
- source_word: χωρίσαντες τῶν μαστῶν
  choice: отняли младенцев от груди
  rationale: Естественный русский оборот передаёт буквальное отделение грудных младенцев от кормления; не добавлено отсутствующее в греческом «материнской».
theological_decisions:
- issue: Следует ли прямо назвать Бога источником небесной помощи
  choice: с неба
  alternative: от Бога / от Господа с небес
  rationale: Греческий текст подразумевает божественную помощь, но прямо говорит лишь «с неба»; перевод сохраняет эту почтительную косвенность.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной повествовательной интонацией. «Пали ниц» уместно для сцены общего моления и сохраняет физическую выразительность оригинала. Запятая в конце оставлена, поскольку стих синтаксически продолжается далее.
