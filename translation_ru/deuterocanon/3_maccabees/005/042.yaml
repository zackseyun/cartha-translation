base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/042.yaml
  text: Therefore the king[a], a Phalaris in every way, filled with irrationality and counting as nothing the changes of soul occurring within him for oversight of the Jews, firmly setting an utterly unfulfillable oath, that he would without delay send these men to Hades, cruelly mangled in the knees and feet by beasts[c][b],
translation:
  language: ru
  text: 'Поэтому царь — во всём Фаларис[a], исполненный безрассудства и ни во что не ставивший перемены, происходившие в его душе в связи с надзором за иудеями[b], — твёрдо дал совершенно неосуществимую клятву: без промедления отправить их в Аид[c], истерзанных зверями в колени и ступни.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фаларис — прославившийся крайней жестокостью древний тиран; царь здесь прямо уподоблен ему.
    reason: cultural_note
  - marker: b
    text: Греческое слово может также означать «попечение», «посещение» или «вмешательство»; оборот связывает внутренние перемены царя с его отношением к иудеям, не уточняя характер этой связи.
    reason: lexical_ambiguity
  - marker: c
    text: Аид — мир мёртвых; здесь не обязательно подразумевается место посмертного наказания.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего повествования и сохраняет логическую связь.
- source_word: ὁ κατὰ πάντα Φάλαρις βασιλεὺς
  choice: царь — во всём Фаларис
  rationale: Сохраняет выразительное уподобление царя Фаларису, а не сводит его к общему определению «жестокий».
- source_word: ἐνπληθυνθεὶς ἀλογιστίας
  choice: исполненный безрассудства
  rationale: Передаёт состояние полноты неразумия естественным для литературного русского языка оборотом.
- source_word: τὰς ... μεταβολὰς τῆς ψυχῆς
  choice: перемены души
  rationale: Сохраняет буквальный образ внутренних перемен, не сужая ψυχή до одного лишь рассудка или настроения.
- source_word: πρὸς ἐπισκοπὴν τῶν Ἰουδαίων
  choice: направленные к попечению об иудеях
  rationale: ἐπισκοπή допускает значения надзора, попечения и благоприятного посещения; в контексте внутренних перемен царя «попечение» выражает благоприятную направленность, а неоднозначность отмечена в сноске.
- source_word: παρ' οὐδὲν ἡγούμενος
  choice: ни во что не ставивший
  rationale: Естественный русский фразеологизм, точно передающий признание чего-либо незначительным или не заслуживающим внимания.
- source_word: ἀτελέστατον ... ὅρκον
  choice: совершенно неисполнимую клятву
  rationale: Передаёт предельную степень ἀτελής как невозможность доведения клятвы до исполнения и сохраняет повествовательную иронию.
- source_word: βεβαίως ὅρκον ὁρισάμενος
  choice: твёрдо дал ... клятву
  rationale: Сочетает решительность βεβαίως с естественным русским оборотом «дать клятву».
- source_word: ἀνυπερθέτως
  choice: без промедления
  rationale: Точно передаёт отсутствие отсрочки и звучит естественно в повествовании.
- source_word: πέμψειν εἰς ἅιδην
  choice: отправить ... в Аид
  rationale: Сохраняет греческий образ мира мёртвых и не подменяет его позднейшим понятием ада как места наказания.
- source_word: ἐν γόνασιν καὶ ποσὶν θηρίων ἠκισμένους
  choice: после того как звери изувечат им колени и ступни
  rationale: Передаёт результативное значение причастия ἠκισμένους, зверей как действующих лиц и названные части тела без неестественной русской конструкции.
theological_decisions:
- issue: Передача ἅιδης
  choice: Аид
  alternative: мир мёртвых
  rationale: Транслитерация сохраняет понятийный мир греческого текста и не вносит представление о «геенне» или месте окончательного наказания.
- issue: Значение ἐπισκοπή применительно к иудеям
  choice: попечение
  alternative: надзор
  rationale: Контекст говорит о внутренних переменах царя, благоприятных для иудеев, однако само слово шире; сноска сохраняет его возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Именная аллюзия на Фалариса сохранена; синтаксис упорядочен тире и двоеточием, чтобы длинный греческий период оставался понятным. Термины с культурной или смысловой неоднозначностью пояснены сносками.
