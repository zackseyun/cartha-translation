  to: 'Поэтому царь — во всём Фаларис[a], исполненный безрассудства и ни во что не ставивший перемены, происходившие в его душе в связи с надзором за иудеями[b], — твёрдо дал совершенно неосуществимую клятву: без промедления отправить их в Аид[c], истерзанных зверями в колени и ступни.'
