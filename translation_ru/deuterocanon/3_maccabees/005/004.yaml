  text: А Гермон, начальник слонов, исполнил приказ в точности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполнил приказ надлежащим образом»; возможны также оттенки точного и неуклонного исполнения.'
