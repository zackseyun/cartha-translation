lexical_decisions:
- source_word: ἐλεφαντάρχης
  choice: начальник слонов
  rationale: Сложное существительное обозначает должностное лицо, ведавшее боевыми слонами или командовавшее ими. «Начальник слонов» ясно и достаточно точно передаёт эту особую должность.
- source_word: τὸ προσταγὲν
  choice: приказ
  rationale: Субстантивированное причастие буквально означает «приказанное»; в данном административно-военном контексте естественный русский эквивалент — «приказ».
- source_word: ἀραρότως
  choice: в точности
  rationale: Наречие может передавать оттенки точного, надлежащего или неуклонного исполнения. «В точности» естественно сочетается с исполнением приказа и сохраняет идею строгого соответствия предписанию.
- source_word: συνετέλει
  choice: исполнил
  rationale: Глагол означает довести действие до завершения, выполнить или осуществить. В сочетании с приказом нормативным русским соответствием служит «исполнил».
- source_word: Ἕρμων
  choice: Ермон
  rationale: Имя передано по традиционной русской библейской модели транслитерации греческого Ἕρμων.
