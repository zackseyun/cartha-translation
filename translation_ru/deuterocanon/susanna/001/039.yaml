  yaml_path: translation/deuterocanon/susanna/001/039.yaml
  text: And when we came near, we saw her; but the young man fled, being covered.
translation:
  language: ru
  text: И, подойдя, мы узнали её; юноша же убежал, закутавшись.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будучи укрыт (или закрыт)». В греческом тексте не сказано, что именно было покрыто.'
    reason: Сохраняет неоднозначность συγκεκαλυμμένος и не вводит в основной текст невыраженное «лицо».
lexical_decisions:
- source_word: ἐπέγνωμεν
  choice: мы узнали
  rationale: Глагол означает распознавание или установление личности; «узнали её» естественно передаёт показание старейшин, что они опознали Сусанну.
- source_word: νεανίσκος
  choice: юноша
  rationale: Обычное современное соответствие для обозначения молодого мужчины.
- source_word: συγκεκαλυμμένος
  choice: закрыв лицо
  rationale: Причастие буквально указывает, что он был укрыт или закрыт; по контексту речь, вероятнее всего, о скрытом лице, однако объект прямо не назван, поэтому неоднозначность отмечена сноской.
theological_decisions:
- issue: Значение ἐπέγνωμεν
  choice: «узнали её»
  alternative: «увидели её»
  rationale: Форма ἐπιγινώσκω сильнее поддерживает значение «узнать, опознать», чем простое зрительное восприятие; это не добавляет богословского толкования.
- issue: Неуказанный объект συγκεκαλυμμένος
  choice: В тексте естественно передать «закрыв лицо», сохранив буквальную широту в сноске
  alternative: «будучи укрыт» / «весь закутанный»
  rationale: Греческий текст не уточняет, что именно было закрыто. Русская основная формулировка отражает наиболее вероятный смысл сцены, а сноска сохраняет подлинную неопределённость.
translation_notes:
  register: Современный литературный русский; речь свидетелей передана кратко и достойно. Порядок «юноша же» сохраняет контраст греческой конструкции ὁ δὲ νεανίσκος.
