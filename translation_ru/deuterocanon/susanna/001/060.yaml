lexical_decisions:
- source_word: ἀνεβόησεν
  choice: воскликнуло
  rationale: Глагол обозначает громкий возглас; сочетание с «громким голосом» передаёт силу выражения без разговорного оттенка.
- source_word: πᾶσα ἡ συναγωγή
  choice: всё собрание
  rationale: В данном повествовательном контексте речь идёт о собравшейся общине, а не о синагоге как учреждении.
- source_word: φωνῇ μεγάλῃ
  choice: громким голосом
  rationale: Сохранён конкретный греческий оборот, естественный и понятный в современном русском языке.
- source_word: εὐλόγησαν
  choice: благословило
  rationale: «Благословило» сохраняет прямое значение εὐλογέω и привычный библейский оборот о благословении Бога; согласование в единственном числе обусловлено русским подлежащим «собрание».
- source_word: τῷ θεῷ
  choice: Бога
  rationale: Дательный падеж при εὐλόγησαν по-русски естественно передаётся прямым дополнением в винительном падеже.
- source_word: τῷ σώζοντι
  choice: спасающего
  rationale: Причастие передаёт Бога как Того, кому постоянно свойственно спасать.
- source_word: τοὺς ἐλπίζοντας ἐπ’ αὐτόν
  choice: тех, кто надеется на Него
  rationale: «Надеется» непосредственно передаёт значение ἐλπίζω, сохраняя направленность надежды на Бога; единственное число в придаточном естественно выражает обобщённую группу лиц.
theological_decisions:
- issue: Передача εὐλόγησαν τῷ θεῷ
  choice: благословило Бога
  alternative: прославило Бога
  rationale: 'Хотя по смыслу возможно «прославило», буквальное «благословило» сохраняет исходный библейский образ: люди благословляют Бога, то есть возвещают о Нём добро и воздают Ему хвалу.'
- issue: 'Передача ἐλπίζοντας: надежда или доверие'
  choice: тех, кто надеется на Него
  alternative: тех, кто уповает на Него / доверяет Ему
  rationale: В греческом употреблено слово из лексической группы надежды. Основной текст сохраняет этот оттенок, а смысловое соприкосновение с доверием отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены обороты «громким голосом» и «благословило Бога»; архаизм «синагога» для συναγωγή в этом контексте не использован.
