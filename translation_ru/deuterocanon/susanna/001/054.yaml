base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/054.yaml
  text: 'Now then[a], if you saw this woman, tell us: under what tree did you see them talking with each other? And he said, “Under a mastic tree.”'
translation:
  language: ru
  text: 'Итак, если ты действительно видел эту женщину, скажи: под каким деревом ты видел их беседующими друг с другом? Он ответил: «Под мастиковым деревом».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. σχῖνος — мастиковое дерево, также называемое лентиском.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Итак
  rationale: Передаёт выводный переход οὖν; отдельное «теперь» по-русски здесь звучало бы тяжеловесно и не добавляло бы существенного временного смысла.
- source_word: ταύτην
  choice: эту женщину
  rationale: Делает явной подразумеваемую Сусанну, сохраняя указательное значение ταύτην.
- source_word: εἴπερ εἶδες
  choice: если ты действительно видел
  rationale: «Действительно» сохраняет усилительную и испытующую силу εἴπερ, не превращая условие в утверждение.
- source_word: εἰπὸν
  choice: скажи
  rationale: Прямой русский эквивалент повелительного аориста; не вводит отсутствующего в греческом дополнения «нам» или «мне».
- source_word: Ὑπὸ τί δένδρον
  choice: под каким деревом
  rationale: Естественно и точно передаёт вопрос о месте.
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: беседующими друг с другом
  rationale: Передаёт разговорное взаимодействие ὁμιλέω и взаимность ἀλλήλοις; форма согласована с конструкцией «видел их».
- source_word: σχῖνον
  choice: мастиковым деревом
  rationale: σχῖνος обозначает мастиковое дерево, или лентиск; конкретное название важно для последующей игры слов.
