base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/048.yaml
  text: But he stood in their midst and said[a], “Are you such fools, sons of Israel? Without examining the matter or even learning the facts clearly[b], have you condemned a daughter of Israel?”
translation:
  language: ru
  text: 'Но он, встав посреди них, сказал: «Неужели вы такие глупцы[a], сыны Израиля? Не разобрав дела и не выяснив ясных обстоятельств[b], вы осудили дочь Израиля?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели вы настолько неразумны, сыны Израиля?» Греческое Οὕτως μωροί допускает передачу как существительным «глупцы», так и прилагательным «неразумны».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не проведя расследования и не выяснив того, что очевидно». Греческое выражение имеет судебный оттенок и подчёркивает, что дело не было должным образом исследовано и его ясные обстоятельства не были установлены до вынесения приговора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: встав
  rationale: Аористное причастие от ἵστημι обозначает действие, предшествующее речи; деепричастие естественно передаёт эту последовательность и сохраняет конкретность жеста.
- source_word: ἐν μέσῳ αὐτῶν
  choice: посреди них
  rationale: Близко передаёт греческое выражение и сохраняет публичный, обличительный характер сцены.
- source_word: Οὕτως μωροί
  choice: Неужели вы такие глупцы
  rationale: Форма риторического вопроса естественна по-русски, а существительное «глупцы» сохраняет резкость упрёка μωροί, не ослабляя его до простого недостатка рассудительности.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохраняет прямое обращение в мужском роде и риторическое противопоставление последующему выражению «дочь Израиля»; форма «сыны» соответствует приподнятому, но понятному библейскому регистру.
- source_word: ἀνακρίναντες
  choice: проведя расследование
  rationale: Глагол имеет судебно-следственный оттенок и указывает на надлежащее исследование дела, которого обвинители не провели.
- source_word: τὸ σαφὲς ἐπιγνόντες
  choice: установив достоверные факты
  rationale: Передаёт сочетание ясности или несомненности (σαφές) с основательным узнаванием (ἐπιγινώσκω) в судебном контексте, не утверждая сверх текста конкретную процедуру.
- source_word: κατεκρίνατε
  choice: вы осудили
  rationale: Простое прошедшее время точно передаёт завершённый судебный акт и естественно звучит в русском риторическом вопросе.
- source_word: θυγατέρα Ἰσραήλ
  choice: дочь Израиля
  rationale: Сохраняет заветное обозначение Сусанны как представительницы народа и намеренную параллель с обращением «сыны Израиля».
theological_decisions:
- issue: Гендерные обозначения народа завета
  choice: сыны Израиля / дочь Израиля
  alternative: израильтяне / израильтянка
  rationale: Греческий текст намеренно сопоставляет мужское множественное и женское единственное обозначения. Их сохранение поддерживает риторическую силу обличения и не нейтрализует выраженную в тексте гендерную форму.
- issue: Содержание τὸ σαφές
  choice: достоверные факты
  alternative: то, что ясно; истину
  rationale: Контекст имеет судебный характер. «Достоверные факты» передаёт необходимость установить ясные обстоятельства дела, тогда как «истина» могла бы неоправданно расширить смысл выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Формы «сыны Израиля» и «дочь Израиля» сохранены ради параллелизма исходного текста; юридическая окраска выражений передана без узкопрофессиональной терминологии.
