base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/010.yaml
  text: And both of them were inflamed with desire for her[a], and neither one disclosed to the other the wicked passion that held them concerning her[b], nor did the woman know this matter.
translation:
  language: ru
  text: Оба они пылали страстью к ней[a], но ни один не открывал другому порочного влечения к ней, овладевшего ими[b], и женщина ничего об этом не знала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «были пронзены из-за неё»; здесь это образ сильной страсти или глубокого влечения к ней.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «злого желания, овладевшего ими и связанного с нею».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμφότεροι
  choice: оба они
  rationale: Передаёт явное указание на двух старейшин и естественно звучит по-русски.
- source_word: κατανενυγμένοι
  choice: пылали страстью
  rationale: Буквальный образ указывает на состояние пронзённости или глубокой уязвлённости; в данном контексте речь идёт о сильном эротическом влечении, что естественно передаётся выражением «пылали страстью».
- source_word: περὶ αὐτῆς
  choice: к ней
  rationale: При обозначении эмоционального и эротического влечения русский оборот «страсть к ней» передаёт смысл естественнее буквального «о ней».
- source_word: ἕτερος τῷ ἑτέρῳ οὐ προσεποιεῖτο
  choice: ни один не открывал другому
  rationale: С учётом отрицания и взаимного отношения выражение означает, что каждый скрывал своё состояние от другого; «не открывал» сохраняет мотив тайны.
- source_word: τὸ κακὸν
  choice: порочное влечение
  rationale: Субстантивированное «зло» здесь обозначает нравственно дурное желание старейшин. Выбранный вариант проясняет референт, сохраняя отрицательную нравственную оценку.
- source_word: τὸ ἔχον αὐτοὺς
  choice: овладевшего ими
  rationale: Причастная конструкция изображает зло как силу, держащую их в своей власти; «овладевшего ими» сохраняет эту выразительность.
- source_word: ἡ γυνή
  choice: сама женщина
  rationale: Сохраняет исходное обозначение Сусанны как «женщины», а частица «сама» естественно подчёркивает противопоставление её неведения их скрытой страсти.
- source_word: ἔγνω τὸ πρᾶγμα τοῦτο
  choice: ничего об этом не знала
  rationale: Естественный русский эквивалент отрицательной конструкции; не уточняет скрытое дело как уже сложившийся заговор, чего греческий текст прямо не утверждает.
theological_decisions:
- issue: Нравственная характеристика скрытого желания старейшин
  choice: «порочное влечение»
  alternative: «зло»; «злое желание»
  rationale: κακόν прямо даёт отрицательную нравственную оценку. Контекстуальное существительное «влечение» делает предмет оценки ясным, не привнося конфессионального толкования.
- issue: Образность κατανενυγμένοι в эротическом контексте
  choice: «пылали страстью»
  alternative: «были пронзены»; «были глубоко увлечены»
  rationale: Буквальная «пронзённость» в современном русском была бы неясна без пояснения. Контекст указывает на сильную страсть, а сноска сохраняет исходный образ и неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и повествовательно сдержанный. Сохранены нравственная оценка желания и образ его власти над старейшинами; буквальная образность и более формальная передача отмечены в сносках.
