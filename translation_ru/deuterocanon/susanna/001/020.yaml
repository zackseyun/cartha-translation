  yaml_path: translation/deuterocanon/susanna/001/020.yaml
  text: And they did as she said[a], and they shut the doors of the garden and went out by the side doors to bring what had been ordered for them, and they did not see the elders, because they were hidden.
translation:
  language: ru
  text: 'И они сделали, как она сказала: закрыли двери сада[a] и вышли через боковые двери, чтобы принести то, что им было велено. Старейшин они не увидели, потому что те находились в укрытии.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово παράδεισος здесь означает ограждённый сад или парк, а не «рай» в позднейшем богословском смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν καθὼς εἶπεν
  choice: сделали, как она сказала
  rationale: Прямая и естественная передача исполнения указания Сусанны; аорист εἶπεν не требует выраженного русским плюсквамперфекта.
- source_word: ἀπέκλεισαν τὰς θύρας
  choice: закрыли двери
  rationale: ἀποκλείω обозначает закрытие или перекрытие доступа; «заперли» добавляло бы не указанное в греческом употребление замка.
- source_word: τοῦ παραδείσου
  choice: сада
  rationale: В данном повествовательном контексте παράδεισος означает ограждённый сад или парк, а не рай в позднейшем богословском смысле.
- source_word: κατὰ τὰς πλαγίας θύρας
  choice: через боковые двери
  rationale: κατά с винительным здесь указывает путь выхода; «через» естественно передаёт движение посредством боковых выходов, а повтор «двери» сохраняет лексическую связь с предыдущей фразой.
- source_word: ἐνέγκαι τὰ προστεταγμένα αὐταῖς
  choice: чтобы принести то, что им было велено
  rationale: Инфинитив выражает цель, а перфектное пассивное причастие — ранее данное распоряжение; формулировка не добавляет отсутствующий в оригинале предмет поручения.
- source_word: τοὺς πρεσβυτέρους
  choice: старейшин
  rationale: πρεσβύτεροι здесь обозначает признанных старших руководителей и судей, а не просто пожилых мужчин.
- source_word: ὅτι ἦσαν κεκρυμμένοι
  choice: потому что те спрятались
  rationale: Греческая конструкция описывает их уже наступившее скрытое состояние. По-русски «те спрятались» ясно обозначает субъект и естественно передаёт результат предшествующего действия.
