  terminology: «Схватив», «расспрашивали», «не сказала нам» и «свидетельствуем» адекватно передают соответственно ἐπιλαβόμενοι, ἐπηρώτωμεν, οὐκ ἀπήγγειλεν ἡμῖν и μαρτυροῦμεν. Терминологических или богословских проблем нет.
