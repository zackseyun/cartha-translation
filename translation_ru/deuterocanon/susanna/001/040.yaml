  text: After seizing her[a], we questioned her, ‘Who was the man?’ But she did not tell us who he was. These things we testify.
translation:
  language: ru
  text: 'Схватив её, мы расспрашивали её: «Кто этот человек?» Но она не сказала нам, кто он. Об этом мы свидетельствуем.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: схватив её
  rationale: Аористное причастие от ἐπιλαμβάνομαι обозначает физическое задержание; «схватив» естественно передаёт силу действия.
- source_word: ἐπηρώτωμεν
  choice: мы стали спрашивать
  rationale: Имперфект передаёт продолжавшееся расспрашивание. Формулировка сохраняет это значение и не усиливает его до «допрашивать».
- source_word: Τίς ὁ ἄνθρωπος;
  choice: Кто этот мужчина?
  rationale: Вопрос касается личности предполагаемого участника; указательное «этот» естественно передаёт определённость греческого артикля в данном контексте.
- source_word: οὐκ ἀπήγγειλεν ἡμῖν
  choice: она не сказала нам
  rationale: В контексте обвинения ἀπαγγέλλω означает сообщить или назвать; простой русский оборот точно передаёт смысл без лишнего истолкования.
- source_word: τίς ἦν
  choice: кто он
  rationale: Оборот указывает на личность, а не на качества человека; настоящее время в русском придаточном естественно после «не сказала».
- source_word: ταῦτα μαρτυροῦμεν
  choice: Об этом мы и свидетельствуем
  rationale: «Свидетельствуем» сохраняет судебную лексику μαρτυρέω, а «об этом» естественно передаёт ταῦτα применительно ко всему рассказанному.
theological_decisions:
- issue: Судебный характер обвинения старейшин
  choice: Сохранить в заключительной фразе глагол «свидетельствуем»
  alternative: «Таково наше показание»
  rationale: Прямая передача μαρτυροῦμεν удерживает юридический характер сцены, не превращая речь свидетелей в простое повествование.
translation_notes:
  register: Современный литературный русский язык с сохранением сдержанного судебного тона. Синтаксис сделан естественным для прямой речи; неоднозначность текста не требует пояснительной сноски.
