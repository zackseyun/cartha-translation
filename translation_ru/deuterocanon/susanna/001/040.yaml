  source_fidelity: 'В целом смысл передан верно: физическое задержание, вопрос об идентичности мужчины, отказ Сусанны сообщить его имя и заключительное свидетельское заявление сохранены. Однако «стали спрашивать» вводит начинательное значение, которого имперфект ἐπηρώτωμεν сам по себе не выражает; более точно передать продолжающееся расспрашивание. Указательное «этот» в вопросе возможно контекстуально, но греческий артикль не требует его и лучше передаётся без дополнительной указательности.'
