lexical_decisions:
- source_word: ΚΑΙ
  choice: не передано отдельным словом
  rationale: Начальное καί служит простым повествовательным продолжением; в самостоятельном русском предложении союз «и» был бы неестественен без предшествующего контекста.
- source_word: ἦν ἀνὴρ οἰκῶν
  choice: жил один человек
  rationale: Оборот представляет нового участника повествования и сообщает о месте его жительства. Такая формулировка естественна в современном русском и передаёт значение ἀνήρ без ненужного акцента на поле.
- source_word: ἐν Βαβυλῶνι
  choice: в Вавилоне
  rationale: Прямое и общепринятое обозначение места.
- source_word: ὄνομα αὐτῷ
  choice: по имени
  rationale: Естественная русская передача греческой формулы называния; смысл «имя ему» сохранён без буквальной тяжеловесности.
- source_word: Ἰωακείμ
  choice: Иоаким
  rationale: Устоявшаяся русская передача греческого имени Ἰωακείμ, достаточно близкая к его форме в источнике.
theological_decisions:
- issue: Передача личного имени Ἰωακείμ
  choice: Иоаким
  alternative: Иоаким / Йоаким с иной графической передачей начального элемента
  rationale: Выбрана общеупотребительная русская библейская форма, непосредственно соответствующая греческому имени и не вносящая конфессионального толкования.
translation_notes:
  register: Современный литературный русский; краткое повествовательное вступление. Инверсия и архаическая формула «имя ему» заменены естественным оборотом «один человек по имени», без добавления сведений, отсутствующих в греческом тексте.
