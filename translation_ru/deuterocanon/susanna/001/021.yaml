lexical_decisions:
- source_word: ἐγένετο
  choice: не передано отдельным словом
  rationale: В сочетании καὶ ἐγένετο ὡς это повествовательная переходная формула; в современном русском её смысл естественно передаётся конструкцией «И когда…», без тяжеловесного «и случилось».
- source_word: ὡς
  choice: когда
  rationale: Союз вводит временное обстоятельство, предшествующее основному действию.
- source_word: ἐξήλθοσαν
  choice: вышли
  rationale: Аорист обозначает завершившееся действие в придаточном времени; русская последовательность действий ясна без формы давнопрошедшего времени.
- source_word: τὰ κοράσια
  choice: служанки
  rationale: Слово может обозначать девушек или молодых женщин вообще, но бытовой контекст указывает на прислуживающих Сусанне девушек.
- source_word: ἀνέστησαν
  choice: встали
  rationale: Передаёт буквальное движение и переход старейшин к действию без добавочной экспрессии.
- source_word: οἱ δύο πρεσβῦται
  choice: два старейшины
  rationale: В повествовании речь идёт не просто о пожилых мужчинах, а о людях, наделённых общественным статусом.
- source_word: ἐπέδραμον αὐτῇ
  choice: бросились к ней
  rationale: Глагол выражает внезапное стремительное и угрожающее движение в её сторону, но сам по себе ещё не требует перевода «напали».
