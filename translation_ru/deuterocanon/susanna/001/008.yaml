lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз, связывающий оборот с предшествующим повествованием.
- source_word: ἐπιθυμήσαντες
  choice: возжелав
  rationale: Аористное причастие от ἐπιθυμέω обозначает сильное желание, здесь по контексту — недозволенное половое влечение. «Возжелав» сохраняет краткость и нравственно окрашенный смысл, не делая его более явным, чем греческий глагол сам по себе.
- source_word: αὐτῆς
  choice: её
  rationale: Местоимение женского рода в родительном падеже относится к Сусанне; русское управление «возжелать кого» естественно передаёт греческую конструкцию с родительным падежом.
