- source_word: ἐγένετο μέγας
  choice: стал велик
  rationale: Передаёт изменение положения и общественного уважения, сохраняя греческий образ без сужения смысла до власти или известности.
- source_word: ἐνώπιον τοῦ λαοῦ
  choice: в глазах народа
  rationale: Естественный современный русский оборот, выражающий оценку Даниила народом и сохраняющий образ публичного восприятия.
- source_word: ἀπὸ τῆς ἡμέρας ἐκείνης καὶ ἐπέκεινα
  choice: с того дня
  rationale: В русском языке сочетание «с того дня» уже подразумевает продолжение от указанного момента; греческое καὶ ἐπέκεινα делает эту длительность явной, но отдельное «и впредь» здесь звучало бы менее естественно.
- source_word: Δανιὴλ
  choice: Даниил
  rationale: Традиционная русская форма библейского имени.
