  text: And as we were going around the enclosed garden, we saw this woman lying with a man, and standing there we watched them talking with one another,
translation:
  language: ru
  text: И, обходя огороженный сад, мы увидели эту женщину, отдыхавшую с мужчиной; остановившись, мы наблюдали, как они беседовали друг с другом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυκλοῦντες τὸ στάδιον
  choice: обходя сад
  rationale: κυκλόω означает «обходить кругом»; в данном повествовательном контексте στάδιον обозначает ограждённое садовое пространство. Краткое «сад» естественно по-русски, хотя оттенок обхода по периметру сохранён глаголом.
- source_word: ἀναπαυομένην μετὰ ἀνδρός
  choice: лежавшую с мужчиной
  rationale: ἀναπαύομαι допускает значения «отдыхать», «возлежать», «лежать». Здесь обвинители намеренно описывают двусмысленную сцену; «лежавшую с мужчиной» сохраняет обвинительный намёк, не добавляя прямо не названного полового акта.
- source_word: ἐθεωροῦμεν
  choice: мы наблюдали
  rationale: Глагол передаёт продолжительное внимательное смотрение, поэтому «наблюдали» точнее простого «смотрели».
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: как они беседуют друг с другом
  rationale: ὁμιλέω здесь означает общение или разговор; «беседуют» сохраняет нейтральность греческого выражения.
theological_decisions:
- issue: Характер предполагаемой близости Сусанны с мужчиной
  choice: лежавшую с мужчиной
  alternative: отдыхавшую с мужчиной / возлежавшую с мужчиной
  rationale: Текст передаёт показания ложных свидетелей, но сам не формулирует здесь прямого утверждения о половом акте. Выбор сохраняет смысловую напряжённость и не усиливает обвинение сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис слегка упрощён относительно длинной греческой цепочки, но последовательность действий сохранена.
