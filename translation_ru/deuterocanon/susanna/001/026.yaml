  yaml_path: translation/deuterocanon/susanna/001/026.yaml
  text: But when those from the house heard the outcry in the garden[a], they rushed in through the side door to see what had happened to her.
translation:
  language: ru
  text: Когда люди из дома услышали крик в саду, они вбежали через боковую дверь[a], чтобы увидеть, что с ней случилось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через боковые ворота»; греческое выражение πλαγία θύρα обозначает боковой вход, но его точное устройство не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγή
  choice: крик
  rationale: Слово обозначает громкий крик; «крик» естественно передаёт тревогу в данном повествовательном контексте.
- source_word: παράδεισος
  choice: сад
  rationale: Здесь речь идёт о примыкающем к дому саде, а не о рае; «сад» точно и естественно соответствует контексту.
- source_word: οἱ ἐκ τῆς οἰκίας
  choice: люди из дома
  rationale: Формулировка сохраняет неопределённость греческого выражения, не уточняя, были ли это домашние, родственники или слуги.
- source_word: εἰσεπήδησαν
  choice: вбежали
  rationale: Глагол выражает быстрое, внезапное движение внутрь; «вбежали» передаёт срочность без стилистической перегрузки.
- source_word: πλαγία θύρα
  choice: боковая дверь
  rationale: Буквально это боковой вход; θύρα может означать дверь или ворота, поэтому возможный архитектурный вариант отмечен в сноске.
- source_word: τὸ συμβεβηκὸς αὐτῇ
  choice: что с ней случилось
  rationale: Естественная русская передача совершившегося события с сохранением его отнесённости к Сусанне.
