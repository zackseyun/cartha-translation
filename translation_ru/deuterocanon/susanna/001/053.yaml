  text: formerly[a], while you were rendering unjust judgments and condemning the innocent, but releasing the guilty, though the Lord says[b], ‘You shall not put to death the innocent and righteous.’
translation:
  language: ru
  text: 'прежде[a] ты выносил несправедливые приговоры, осуждая невиновных и отпуская виновных, хотя Господь говорит[b]: «Невиновного и правого не предавай смерти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прежде, судя несправедливые суды». В греческом употреблены однокоренные слова для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительные слова перекликаются с Исх. 23:7 в греческой традиции: невиновного и правого не предавай смерти.'
    reason: cross_reference
lexical_decisions:
- source_word: πρότερον
  choice: прежде
  rationale: Передаёт временное указание на прежнее поведение старейшины и естественно связывается с последующим описанием его судейской практики.
- source_word: κρίνων κρίσεις ἀδίκους
  choice: ты выносил несправедливые приговоры
  rationale: В судебном контексте это естественная современная формулировка; значение однокоренного сочетания κρίνων/κρίσεις сохраняется, а его буквальная форма отмечена в сноске.
- source_word: τοὺς μὲν ἀθῴους κατακρίνων
  choice: осуждая невиновных
  rationale: ἀθῷος означает свободного от вины, а κατακρίνω — осуждать; русский вариант ясно передаёт судебный контекст.
- source_word: ἀπολύων δὲ τοὺς αἰτίους
  choice: и отпуская виновных
  rationale: ἀπολύω допускает значения освобождения и оправдания; «отпуская» не сужает смысл до формального оправдательного приговора. αἴτιος здесь означает виновного.
- source_word: λέγοντος τοῦ κυρίου
  choice: хотя Господь говорит
  rationale: Генитив абсолютный вводит заповедь, вопреки которой поступал старейшина; «хотя» естественно выражает контекстуальное противопоставление.
- source_word: Ἀθῷον καὶ δίκαιον
  choice: невиновного и правого
  rationale: 'Сохраняются два отдельных определения: отсутствие вины и правота в судебном деле.'
- source_word: οὐκ ἀποκτενεῖς
  choice: не предавай смерти
  rationale: В юридическом контексте передаёт запрет судебного умерщвления точнее, чем общее «не убивай».
theological_decisions:
- issue: Передача κύριος в цитате из Писания
  choice: Господь
  alternative: Господь (с капительным написанием «ГОСПОДЬ»)
  rationale: Перевод выполняется непосредственно с греческого κύριος; обычное «Господь» прозрачно передаёт источник без внесения в основной текст реконструированной еврейской формы имени.
- issue: Смысл λέγοντος τοῦ κυρίου
  choice: хотя Господь говорит
  alternative: как говорит Господь
  rationale: Контекст требует противопоставления прежних поступков старейшины Божьей заповеди. «Хотя» делает эту связь явной, не меняя содержания цитаты.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской судебной речи. Синтаксис сглажен для ясности, а необычное однокоренное выражение оригинала сохранено в сноске. Местоимение «ты» добавлено как требуемый русской конструкцией подразумеваемый субъект обращения.
