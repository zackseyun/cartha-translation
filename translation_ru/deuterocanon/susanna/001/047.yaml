  text: Then all the people turned to him and said[a], “What is this word that you have spoken?”
translation:
  language: ru
  text: 'Тогда весь народ обратился к нему и спросил: «Что это за слово, которое ты произнёс?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что это за высказывание, которое ты произнёс?» Греческое λόγος может означать «слово», «высказывание» или «дело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: повернулся
  rationale: Глагол с πρὸς αὐτόν обозначает, что собравшиеся обратились к Даниилу; «повернулся к нему» естественно передаёт направление внимания, не подразумевая возвращения.
- source_word: πᾶς ὁ λαός
  choice: весь народ
  rationale: Сохраняет собирательное значение λαός и усиление πᾶς, оставаясь естественным для современного русского языка.
- source_word: εἶπαν
  choice: спросил
  rationale: Хотя греческая форма буквально означает «сказали», последующая прямая речь является вопросом; при собирательном подлежащем «народ» нормативно единственное число.
- source_word: Τίς ὁ λόγος οὗτος ὃν σὺ λελάληκας;
  choice: Что означают эти твои слова?
  rationale: Идиоматически передаёт вопрос о смысле только что сказанного. Множественное «слова» естественно по-русски представляет λόγος как высказывание, а «твои» сохраняет выраженное местоимением σὺ смысловое выделение собеседника.
