  text: And all those with her were weeping[a], and all who knew her were weeping.
translation:
  language: ru
  text: И плакали все, кто был с ней[a], и все, кто её знал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все, кто находился при ней»; греческое выражение может широко обозначать тех, кто был рядом с ней или принадлежал к её окружению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: плакали
  rationale: Имперфект обозначает продолжавшийся плач; в русском языке несовершенный вид естественно передаёт длительность без вспомогательной конструкции.
- source_word: οἱ παρ᾽ αὐτῆς πάντες
  choice: все, кто был с ней
  rationale: Оборот обозначает людей, находившихся при Сусанне или принадлежавших к её окружению; перевод сохраняет широту выражения и не сужает его до слуг.
- source_word: ὅσοι αὐτὴν ᾔδεισαν πάντες
  choice: все, кто её знал
  rationale: Прямой и естественный перевод, охватывающий всех знакомых с ней людей.
- source_word: πάντες ... πάντες
  choice: все ... все
  rationale: Повтор сохраняет греческое смысловое усиление и подчёркивает всеобщность скорби.
