base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/004.yaml
  text: And Joakim was exceedingly rich[a], and he had a garden adjoining his house[c][b]; and the Jews would come to him because he was more esteemed than all of them.
translation:
  language: ru
  text: Иоаким был чрезвычайно богат. При его доме был сад[a], и к нему сходились иудеи[b], потому что он пользовался у них бо́льшим почётом, чем кто-либо другой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «парк», «плодовый сад»; греческое слово может обозначать благоустроенный ограждённый сад или обширное садовое владение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жители Иудеи», если слово понимать географически, а не как обозначение иудейской общины.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλούσιος σφόδρα
  choice: чрезвычайно богат
  rationale: Передаёт πλούσιος «богатый» и сильное усиление σφόδρα, сохраняя возвышенный, но естественный современный русский стиль.
- source_word: παράδεισος
  choice: сад
  rationale: В данном бытовом контексте обозначает принадлежащий состоятельному человеку ограждённый сад или благоустроенное владение, а не богословский «рай».
- source_word: γειτνιῶν τῷ οἴκῳ αὐτοῦ
  choice: при его доме
  rationale: Естественно и кратко выражает непосредственную близость сада к дому; смысл соприкосновения или соседства сохранён.
- source_word: πρὸς αὐτὸν προσήγοντο
  choice: к нему сходились
  rationale: Передаёт повторяющееся приближение или собрание людей у Иоакима. Возвратная форма «сходились» естественнее буквального пассивного «были приводимы», при этом не уточняет цель посещений.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: В повествовательном контексте обозначает иудейскую общину; традиционное русское библейское «иудеи» уместно и не требует искусственного географического уточнения.
- source_word: ἐνδοξότερον πάντων
  choice: пользовался у них бо́льшим почётом, чем кто-либо другой
  rationale: Сравнительная форма указывает на общественный почёт и авторитет Иоакима среди общины, а не на его нравственное или духовное превосходство. Формулировка естественно передаёт эллиптическое πάντων.
- source_word: Ἰωακείμ
  choice: Иоаким
  rationale: Устоявшаяся русская библейская передача греческого имени Ἰωακείμ.
theological_decisions:
- issue: Характер превосходства в ἐνδοξότερον πάντων
  choice: общественный почёт и авторитет
  alternative: слава, нравственное или духовное превосходство
  rationale: Этот оборот объясняет, почему иудеи сходились к Иоакиму; контекст говорит о его высоком положении в общине, но не утверждает его праведность или святость.
- issue: Значение παράδεισος
  choice: земной сад при доме
  alternative: рай
  rationale: Контекст имущества богатого человека и дальнейшее действие в саду требуют обычного предметного значения, без привнесения эсхатологического или богословского смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским достоинством. Два греческих καί переданы естественным членением на предложения. «При его доме» избегает тяжеловесного «примыкавший к его дому», а «пользовался у них бо́льшим почётом» ясно выражает общественную репутацию. Все маркеры сносок присутствуют в основном тексте.
