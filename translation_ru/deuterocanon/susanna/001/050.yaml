  terminology: '«Старейшины» удачно передаёт οἱ πρεσβύτεροι в общинно-судебном контексте. Основной вариант «достоинство старейшины» сохраняет связь с термином «старейшины» и не делает Даниила буквально пожилым. Сноска корректно фиксирует существенную лексическую неопределённость: старшинство, почётный ранг, признанный авторитет.'
