  text: And all the people returned with haste. And the elders said to him[a], “Come, sit in our midst and tell us, for God has given you eldership.”
translation:
  language: ru
  text: 'И весь народ поспешно вернулся. Старейшины сказали ему: «Подойди, сядь среди нас и расскажи нам, потому что Бог даровал тебе достоинство старейшины[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даровал тебе старейшинство», «даровал тебе первенство» либо «даровал тебе положение старейшины». Греческое выражение обозначает старшинство или почётный ранг; здесь имеется в виду признанный авторитет, а не буквальный возраст.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: вернулся
  rationale: В контексте глагол обозначает, что народ повернул обратно; «вернулся» естественно передаёт направленность действия.
- source_word: μετὰ σπουδῆς
  choice: поспешно
  rationale: Здесь выражение характеризует быстрое возвращение; «поспешно» сохраняет значение срочности, не приписывая народу дополнительного мотива.
- source_word: οἱ πρεσβύτεροι
  choice: старейшины
  rationale: В судебно-общинном контексте речь идёт о признанных руководителях, а не просто о пожилых мужчинах.
- source_word: Δεῦρο
  choice: подойди
  rationale: Слово служит призывом приблизиться; «подойди» естественно сочетается с последующим приглашением сесть среди собрания.
- source_word: ἐν μέσῳ ἡμῶν
  choice: среди нас
  rationale: Передаёт как пространственное положение в собрании, так и принятие Даниила в круг совещающихся.
- source_word: ἀνάγγειλον ἡμῖν
  choice: расскажи нам
  rationale: Глагол означает сообщить или объявить; в прямой речи «расскажи нам» звучит современно и ясно.
- source_word: τὸ πρεσβεῖον
  choice: достоинство старейшины
  rationale: Существительное обозначает старшинство, почётный ранг или положение старейшины. Такой перевод сохраняет связь с πρεσβύτεροι и не создаёт впечатления, будто юному Даниилу был дарован преклонный возраст.
theological_decisions:
- issue: Смысл того, что Бог дал Даниилу τὸ πρεσβεῖον
  choice: Бог даровал Даниилу достоинство и признанный авторитет старейшины, несмотря на его юность.
  alternative: «Бог даровал тебе старейшинство» или «Бог даровал тебе первенство».
  rationale: Контекст представляет Даниила юным, но наделённым от Бога мудростью и правом говорить в собрании. Перевод сохраняет парадокс юности и старшего достоинства, не сводя выражение ни к возрасту, ни к строго определённой должности.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис прямой и понятный; лексически неоднозначное τὸ πρεσβεῖον раскрыто в сноске без устранения смыслового напряжения.
