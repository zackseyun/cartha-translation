base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/058.yaml
  text: 'Now then[a], tell me: under what tree did you catch them talking with one another? And he said, “Under a holm oak.”'
translation:
  language: ru
  text: 'Теперь же скажи мне: под каким деревом ты застал их беседующими друг с другом? Он ответил: «Под каменным дубом».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под дубом». Греческое πρῖνος обозначает определённый вид дуба — каменный, или вечнозелёный, дуб.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: теперь же
  rationale: Передаёт непосредственный переход к следующему вопросу и лёгкий оттенок логического следствия; звучит естественно и достойно в современном русском.
- source_word: λέγε μοι
  choice: скажи мне
  rationale: Естественная русская передача повеления дать прямой ответ.
- source_word: Ὑπὸ τί δένδρον
  choice: под каким деревом
  rationale: Прямо и ясно сохраняет вопрос о конкретном дереве.
- source_word: κατέλαβες
  choice: ты застал
  rationale: В судебном контексте означает обнаружить людей за предполагаемым действием; «застал» точнее и естественнее, чем физическое «схватил».
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: беседующими друг с другом
  rationale: Сохраняет значение взаимного общения; «беседующими» уместно для литературного повествования, не усиливая смысл до интимной связи.
- source_word: πρῖνον
  choice: каменным дубом
  rationale: πρῖνος обозначает вечнозелёный, или каменный, дуб (Quercus ilex); конкретный вид дерева значим для последующего допроса, поэтому точное название сохранено.
