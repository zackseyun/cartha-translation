  text: And the whole assembly believed them[a], since they were elders and judges of the people.
translation:
  language: ru
  text: И всё собрание поверило им, поскольку они были старейшинами и судьями народа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστευσεν
  choice: поверило
  rationale: Глагол с дательным αὐτοῖς здесь означает, что собрание приняло слова старейшин за правду; «поверило им» естественно и точно передаёт этот смысл.
- source_word: ἡ συναγωγὴ πᾶσα
  choice: всё собрание
  rationale: В данном повествовании συναγωγή обозначает собравшуюся общину, а не здание или позднейший институт; «всё собрание» ясно передаёт и коллективный, и всеохватный смысл выражения.
- source_word: ὡς
  choice: поскольку
  rationale: Союз вводит основание, по которому собрание сочло свидетельство мужчин заслуживающим доверия; «поскольку» сохраняет причинный оттенок без излишнего истолкования.
- source_word: πρεσβυτέρων
  choice: старейшинами
  rationale: Речь идёт о признанных руководителях общины, а не просто о пожилых мужчинах; «старейшины» передаёт их общественное положение.
- source_word: κριτῶν
  choice: судьями
  rationale: Слово обозначает лиц, наделённых судебной властью; русский эквивалент «судьи» прям и понятен.
- source_word: τοῦ λαοῦ
  choice: народа
  rationale: λαός обозначает народ, внутри которого эти люди исполняли судебные обязанности; родительный оборот естественно передаётся как «судьи народа».
theological_decisions:
- issue: Передача συναγωγή в дохристианском иудейском повествовании
  choice: собрание
  alternative: община; синагога
  rationale: «Собрание» обозначает собравшееся сообщество и не создаёт анахронического впечатления, будто речь непременно идёт о синагоге как учреждении или здании.
translation_notes:
  register: 'Современный литературный русский язык; изложение краткое, ясное и достоинственное. Синтаксис близок к греческому, но естественен по-русски. Стих не требует сноски: возможный оттенок «община» не меняет смысла настолько, чтобы перегружать короткую фразу примечанием.'
