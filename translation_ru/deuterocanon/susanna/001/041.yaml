  source_fidelity: 'Текст точно передаёт греческий оригинал: «всё собрание» соответствует ἡ συναγωγὴ πᾶσα, «поверило им» — ἐπίστευσεν αὐτοῖς, а «поскольку они были старейшинами и судьями народа» адекватно выражает причинное ὡς с характеристикой πρεσβυτέρων и κριτῶν τοῦ λαοῦ. Причинность передана как основание доверия собрания и не добавляет иных смыслов.'
