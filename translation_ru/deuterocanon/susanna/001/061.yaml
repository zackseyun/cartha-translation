base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/061.yaml
  text: And they rose up against the two elders, because Daniel had convicted them from their own mouth of being false witnesses, and they did to them as they had maliciously planned to do.
translation:
  language: ru
  text: И выступили они против двух старейшин, потому что Даниил их же собственными словами изобличил как лжесвидетелей[a]. И поступили с ними так, как сами они злоумышляли поступить[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на основании их собственных показаний доказал, что они лжесвидетели».'
    reason: Лексическая альтернатива, яснее выражающая судебный смысл оборота.
  - marker: b
    text: 'Заключительная фраза выражает судебное воздаяние: старейшины понесли наказание, которому они злоумышляли подвергнуть Сусанну.'
    reason: Поясняет подразумеваемую контекстом направленность эллиптической заключительной фразы, не добавляя объект в основной текст.
lexical_decisions:
- source_word: ἀνέστησαν ἐπὶ
  choice: выступили против
  rationale: Сочетание обозначает враждебное или судебное действие против кого-либо, а не просто вставание.
- source_word: πρεσβύτας
  choice: старейшин
  rationale: В повествовании это не просто пожилые мужчины, а обладавшие общественным и судебным авторитетом старейшины.
- source_word: συνέστησεν
  choice: изобличил
  rationale: Глагол здесь означает, что Даниил установил их виновность через противоречия в их собственных показаниях; «изобличил» естественно передаёт судебный контекст.
- source_word: ἐκ τοῦ στόματος αὐτῶν
  choice: их же собственными словами
  rationale: 'Передаёт смысл идиомы: виновность старейшин была обнаружена на основании сказанного ими самими.'
- source_word: ψευδομάρτυρας ὄντας
  choice: как лжесвидетелей
  rationale: Сохраняет специальное судебное значение слова, а не сводит его к общему понятию лжи.
- source_word: ἐπονηρεύσαντο
  choice: по злому умыслу намеревались поступить
  rationale: Средняя форма и контекст указывают на злонамеренный замысел старейшин, а не только на их дурной поступок или характер.
theological_decisions:
- issue: Судебное воздаяние по принципу взаимности
  choice: Заключительная фраза показывает, что старейшины подверглись тому, что сами замышляли для другого человека.
  alternative: 'Более буквально: «сделали им по тому образу, как они поступили злонамеренно».'
  rationale: Перевод сохраняет подразумеваемый принцип наказания лжесвидетелей, но не добавляет прямой ссылки на Второзаконие и не превращает её в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным строем. Судебная терминология сохранена, а буквальная идиома «из их уст» передана естественным русским оборотом. В последней фразе нейтральное «с другим» сохраняет отсутствие прямо названного объекта в греческом тексте; связь с Сусанной разъясняется в примечании.
