  source_fidelity: 'Текст точно передаёт греческое ἡ δὲ κλαίουσα ἀνέβλεψεν εἰς τὸν οὐρανόν: сопутствующее действие «плача», направленность взгляда «к небу» и повествовательное прошедшее время сохранены. «Потому что сердце её уповало на Господа» адекватно передаёт причинное ὅτι и устойчивое состояние доверия, выраженное перфектным πεποιθυῖα с ἐπὶ Κυρίῳ.'
