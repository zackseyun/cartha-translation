translation:
  language: ru
  text: Она же, плача, подняла взгляд к небу, потому что сердце её уповало на Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαίουσα
  choice: плача
  rationale: 'Причастие настоящего времени передаёт продолжающееся действие, сопутствующее основному: Сусанна плачет и поднимает взгляд.'
- source_word: ἀνέβλεψεν
  choice: подняла взгляд
  rationale: В сочетании с εἰς τὸν οὐρανόν глагол означает направить взгляд вверх; выбран естественный современный русский оборот.
- source_word: οὐρανόν
  choice: небу
  rationale: В молитвенном контексте «небо» сохраняет как пространственный образ, так и религиозный смысл.
- source_word: καρδία
  choice: сердце
  rationale: Передаёт внутреннего человека — средоточие доверия и воли — без ненужного истолкования.
- source_word: πεποιθυῖα
  choice: уповало
  rationale: Перфектное причастие выражает устойчивое состояние доверия, возникшее ранее и сохраняющееся в описываемый момент; «уповало» естественно сочетается с «на Господа».
- source_word: ἐπὶ Κυρίῳ
  choice: на Господа
  rationale: При глаголе «уповать» предлог «на» идиоматично и точно передаёт направленность доверия на Господа.
theological_decisions:
- issue: Передача Κυρίῳ в греческом повествовании о доверии Богу
  choice: Господа
  alternative: Господа / ГОСПОДА как обозначение божественного имени
  rationale: Непосредственный греческий источник содержит κύριος и не даёт основания типографически вводить восстановленное еврейское божественное имя; обычное «Господь» сохраняет смысл и не привносит текстологически невыраженное уточнение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия «сердце её» сохраняет слегка возвышенный регистр, оставаясь понятной; «уповало» точно выражает устойчивое религиозное доверие.
