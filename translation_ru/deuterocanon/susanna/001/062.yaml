translation:
  language: ru
  text: с ближним[a] поступить по закону Моисея; их предали смерти. В тот день была сохранена невинная кровь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эти слова синтаксически продолжают предыдущий стих; буквально: «ближнему поступить по закону Моисея». По смыслу: «поступить с ближним по закону Моисея».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ πλησίον
  choice: ближнему
  rationale: Дательный падеж передан прямо; выражение синтаксически продолжает предыдущий стих и обозначает человека, против которого старейшины замыслили зло.
- source_word: ποιῆσαι
  choice: поступить
  rationale: В сочетании с юридической формулой «по закону» глагол «поступить» звучит естественнее буквального «сделать», сохраняя общий смысл действия.
- source_word: κατὰ τὸν νόμον Μωϋσῆ
  choice: по закону Моисея
  rationale: Естественная современная русская юридическая формула, близко соответствующая греческому выражению.
- source_word: ἀπέκτειναν αὐτούς
  choice: их предали смерти
  rationale: Передаёт судебный характер казни, не вводя более узкого современного юридического термина.
- source_word: ἐσώθη αἷμα ἀναίτιον
  choice: была сохранена невинная кровь
  rationale: Сохраняет библейский образ невинной крови и передаёт предотвращение неправедного кровопролития, не превращая кровь в самостоятельное действующее лицо.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: в тот день
  rationale: Обычное и естественное русское соответствие временной формуле.
theological_decisions:
- issue: Судебный оттенок ἀπέκτειναν
  choice: их предали смерти
  alternative: их убили; их казнили
  rationale: Выбранный вариант передаёт исполнение судебного приговора по закону Моисея, но не приписывает греческому глаголу излишне технического значения.
- issue: Образное выражение ἐσώθη αἷμα ἀναίτιον
  choice: была сохранена невинная кровь
  alternative: невинная кровь была спасена; удалось избежать пролития невинной крови
  rationale: Формулировка сохраняет библейскую образность и богословскую весомость выражения, одновременно оставаясь понятной современному читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальная синтаксическая незавершённость сохранена, поскольку исходный фрагмент стиха зависит от предыдущего контекста; это пояснено сноской.
