base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/024.yaml
  text: And Susanna groaned and said[a], “I am hemmed in on every side. For if I do this, it is death for me; but if I do not do it[b], I will not escape your hands.”
translation:
  language: ru
  text: 'И Сусанна тяжело вздохнула и сказала: «Мне тесно со всех сторон[a]: если я сделаю это, мне — смерть; а если не сделаю, то не вырвусь из ваших рук[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я в безвыходном положении».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не избегну ваших рук»; то есть не избавлюсь от вашей власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεστέναξεν
  choice: тяжело вздохнула
  rationale: Глагол обозначает глубокий вздох или стон от тяжёлого переживания. «Тяжело вздохнула» естественно звучит по-русски и сохраняет эмоциональную напряжённость.
- source_word: Στενά μοι πάντοθεν
  choice: Мне тесно со всех сторон
  rationale: Сохраняет образ стеснённости и безвыходного положения, не сводя его лишь к отвлечённому пояснению.
- source_word: ἐὰν γὰρ τοῦτο πράξω
  choice: если я сделаю это
  rationale: Прямо передаёт указательное местоимение и не уточняет действие сверх сказанного в греческом тексте.
- source_word: θάνατός μοί ἐστιν
  choice: меня ждёт смерть
  rationale: Передаёт краткую и резкую именную конструкцию естественным современным русским языком, сохраняя смерть как прямое последствие.
- source_word: ἐὰν μὴ πράξω
  choice: если не сделаю
  rationale: Повтор глагола поддерживает противопоставление двух вариантов и не добавляет оттенка добровольного отказа, которого нет в форме греческого глагола.
- source_word: οὐκ ἐκφεύξομαι
  choice: не вырвусь
  rationale: Будущая форма и образ физической угрозы переданы глаголом, естественно сочетающимся с выражением «из ваших рук».
- source_word: τὰς χεῖρας ὑμῶν
  choice: из ваших рук
  rationale: Сохранён конкретный греческий образ рук как власти и захвата; русский оборот понятен и без замены метафоры абстрактным словом «власть».
theological_decisions:
- issue: Передача безвыходной дилеммы Сусанны без смягчения принуждения
  choice: 'Сохранено резкое противопоставление: исполнение требования ведёт к смерти, а неисполнение оставляет Сусанну во власти угрожающих ей людей.'
  alternative: Парафразировать последствия как бесчестье, осуждение или судебную опасность.
  rationale: Греческий текст формулирует прямую дилемму и не конкретизирует механизм смерти. Перевод не вводит такого уточнения и не ослабляет насильственный контекст.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Сохранены параллельная условная конструкция, телесная метафора рук и напряжённая краткость реплики; архаизмы и конфессионально окрашенные формулировки не использованы.
