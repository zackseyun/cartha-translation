    issue: Ослаблена номинальная резкость выражения θάνατός μοί ἐστιν.
    rationale: «Меня ждёт смерть» естественно по-русски, но выражает ожидаемое будущее событие, тогда как греческая формула предельно кратко обозначает смерть как итог/участь. «Мне — смерть» лучше сохраняет синтаксическую и риторическую силу оригинала.
  - severity: low
    issue: Сноска b представляет буквальность неточно.
    rationale: '«Не убегу от ваших рук» не является буквальным переводом οὐκ ἐκφεύξομαι τὰς χεῖρας ὑμῶν. Буквально: «не избегну/не ускользну от ваших рук»; глагол не означает собственно «бежать».'
