base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/043.yaml
  text: You know that they testified falsely against me; and behold[a], I am dying, having done none of the things that these men wickedly contrived against me.
translation:
  language: ru
  text: Ты знаешь, что они дали против меня ложные показания. И вот, я умираю, не сделав ничего из того, что эти люди злонамеренно замыслили против меня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сделав ничего из того, что эти люди злонамеренно выдумали обо мне». Греческий глагол может подчёркивать злой умысел, коварный замысел или злонамеренное действие, направленное против Сусанны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασαι
  choice: Ты знаешь
  rationale: Глагол обозначает достоверное знание или осведомлённость; в прямом обращении к Богу естественно передаётся как «Ты знаешь».
- source_word: ψευδῆ μου κατεμαρτύρησαν
  choice: они дали против меня ложные показания
  rationale: 'Сочетание имеет судебный оттенок: речь не просто о лжи, а о ложном свидетельстве против Сусанны.'
- source_word: ἰδοὺ
  choice: И вот
  rationale: «Вот» сохраняет указательную и эмоциональную силу частицы, оставаясь естественным для современного литературного русского языка.
- source_word: ἀποθνῄσκω
  choice: я умираю
  rationale: Настоящее время передаёт непосредственность и неизбежность предстоящей смерти.
- source_word: μὴ ποιήσασα μηδὲν ὧν
  choice: не сделав ничего из того, что
  rationale: Деепричастная конструкция близко отражает греческое причастие и прямо выражает непричастность Сусанны к вменяемым ей поступкам.
- source_word: ἐπονηρεύσαντο κατ᾽ ἐμοῦ
  choice: со злым умыслом замыслили против меня
  rationale: Передача сохраняет как нравственную окраску глагола, так и направленность злого замысла против Сусанны, не сводя значение исключительно к выдуманному обвинению.
theological_decisions:
- issue: Значение μὴ ποιήσασα μηδὲν ὧν οὗτοι ἐπονηρεύσαντο κατ᾽ ἐμοῦ
  choice: не сделав ничего из того, что эти люди со злым умыслом замыслили против меня
  alternative: не сделав ничего из того, что эти люди злонамеренно выдумали обо мне
  rationale: Основной текст сохраняет напряжение греческой формулировки между невиновностью Сусанны и злым замыслом обвинителей. Альтернативный вариант яснее связывает глагол с фабрикацией обвинения, но несколько сужает его смысл.
- issue: Передача οὗτοι
  choice: эти люди
  alternative: они
  rationale: Указательное местоимение отсылает к присутствующим обвинителям; «эти люди» естественно и без добавочной интерпретации сохраняет указательность.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-молитвенной сцены. Формулировка близка к греческому синтаксису, но избегает архаизмов; подлинная смысловая широта ἐπονηρεύσαντο сохранена в основном тексте и пояснена в сноске.
