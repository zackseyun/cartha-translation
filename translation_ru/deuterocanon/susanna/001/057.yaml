base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/057.yaml
  text: This is how you acted toward the daughters of Israel[a], and they, out of fear, associated with you; but a daughter of Judah did not endure your lawlessness.
translation:
  language: ru
  text: Так вы поступали с дочерьми Израиля, и они, боясь вас, общались с вами[a]; но дочь Иуды не потерпела вашего беззакония.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были с вами в общении», «имели с вами дело». Греческий глагол означает общаться или находиться в чьём-либо обществе. В обстановке принуждения он может подразумевать нечто большее, чем обычное общение, однако прямо половой связи не называет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἐποιεῖτε
  choice: Так вы поступали
  rationale: Имперфект указывает на повторявшиеся или привычные действия; форма «поступали» естественно передаёт длительный характер обвинения.
- source_word: θυγατράσιν Ἰσραήλ
  choice: с дочерьми Израиля
  rationale: Сохранён библейский семейно-заветный образ и его риторический контраст с единственным числом «дочь Иуды».
- source_word: φοβούμεναι
  choice: из страха
  rationale: Причастие выражает причину последующего действия. Перевод не добавляет прямо не названный объект страха, хотя из контекста он понятен.
- source_word: ὡμίλουν ὑμῖν
  choice: сходились с вами
  rationale: Глагол ὁμιλέω означает общаться, иметь дело или поддерживать близкие отношения. В данном контексте русское «сходились» допускает подразумеваемую интимную связь, но не делает выражение более откровенным, чем греческий текст.
- source_word: ἀλλ᾽ οὐ θυγάτηρ Ἰούδα
  choice: но дочь Иуды
  rationale: Сохранено единственное число без добавления усилительного «ни одна»; Сусанна представлена как дочь Иуды в противопоставлении дочерям Израиля.
- source_word: ὑπέμεινεν
  choice: не потерпела
  rationale: ὑπομένω здесь означает вынести, терпеть или подчиниться давлению. «Не потерпела» естественно передаёт её отказ мириться с совершаемым злом.
- source_word: τὴν ἀνομίαν ὑμῶν
  choice: вашего беззакония
  rationale: «Беззаконие» сохраняет одновременно правовой, нравственный и библейско-богословский вес слова ἀνομία.
theological_decisions:
- issue: Представительное единственное число в выражении θυγάτηρ Ἰούδα
  choice: дочь Иуды
  alternative: ни одна дочь Иуды; дочери Иуды
  rationale: Единственное число греческого текста сохранено без расширения смысла; оно поддерживает контраст с «дочерьми Израиля» и позволяет видеть в Сусанне представительницу Иуды.
- issue: Нравственно-правовой смысл ἀνομία
  choice: беззаконие
  alternative: злодеяние; несправедливость; нечестие
  rationale: «Беззаконие» не сужает значение ни до сексуального проступка, ни до судебной несправедливости, сохраняя напряжение между нравственным и правовым смыслом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской судебной речи. Синтаксис краток и обвинителен; сохранены библейские выражения «дочери Израиля», «дочь Иуды» и «беззаконие». Неоднозначность ὡμίλουν передана глаголом «сходились» и разъяснена в сноске без чрезмерной конкретизации.
