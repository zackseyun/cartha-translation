  source_fidelity: 'Основной смысл передан точно: привычное поведение в прошлом, «дочери Израиля», мотив страха, противопоставленная «дочь Иуды» и «ваше беззаконие» сохранены. Однако «сходились с вами» в современном русском обычно значительно сильнее склоняется к значению сексуальной связи, тогда как ὡμίλουν само по себе означает общение/сношения/пребывание в обществе и в данном выражении не называет половой акт прямо.'
