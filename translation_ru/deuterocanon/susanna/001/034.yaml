  text: Then the elders and judges stood up and laid their hands on her head.
translation:
  language: ru
  text: Тогда старейшины и судьи встали и возложили руки на её голову.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: встали
  rationale: Аористное причастие вводит следующее действие в повествовательной последовательности; личная форма естественна для современного русского языка.
- source_word: οἱ πρεσβύτεροι
  choice: старейшины
  rationale: В данном контексте речь идёт о признанных руководителях общины, а не просто о пожилых мужчинах.
- source_word: κριταὶ
  choice: судьи
  rationale: Прямо передаёт судебную роль названных лиц.
- source_word: ἐπέθηκαν τὰς χεῖρας αὐτῶν
  choice: возложили руки
  rationale: Устойчивое и точное обозначение конкретного жеста; само по себе не требует сакраментального истолкования.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτῆς
  choice: на её голову
  rationale: Естественная современная передача пространственного значения греческого оборота.
theological_decisions:
- issue: Следует ли придавать возложению рук ритуальный или сакраментальный смысл
  choice: 'Сохранён буквальный судебный жест: «возложили руки на её голову»'
  alternative: «положили руки ей на голову»
  rationale: Греческий текст описывает физическое действие в ходе судебного разбирательства и не уточняет его богословского значения.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная фраза. Союз δέ передан как «тогда», поскольку здесь он отмечает переход к следующему действию.
