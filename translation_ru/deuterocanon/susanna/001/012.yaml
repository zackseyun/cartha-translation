  yaml_path: translation/deuterocanon/susanna/001/012.yaml
  text: And behold[a], she was walking about as usual, and one of the elders had come, and behold, the other arrived, and he questioned the other, saying[b], “Why did you go out so early without taking me along?”
translation:
  language: ru
  text: 'И вот[a], она, как обычно, прогуливалась. Один из старейшин уже пришёл, и вот пришёл другой. И он стал расспрашивать другого, говоря[b]: «Почему ты вышел так рано, не взяв меня с собой?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и вот»; так же во втором случае в этом стихе. Это выражение обращает внимание на происходящее.'
    reason: lexical_alternative
  - marker: b
    text: Греческое повествование здесь сохраняет резкий переход от «одного» старейшины к «другому», а затем снова говорит «другого», не уточняя имён.
    reason: textual_variant
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет оба повторения яркого повествовательного указателя и при этом естественно звучит в современном русском.
- source_word: κατὰ τὸ εἰωθὸς
  choice: как обычно
  rationale: Кратко и естественно передаёт значение привычного, регулярно совершаемого действия.
- source_word: περιεπάτει
  choice: прогуливалась
  rationale: Передаёт длительное действие имперфекта и движение по месту, а не однонаправленный уход.
- source_word: πρεσβυτέρων
  choice: старейшин
  rationale: В контексте речь идёт не только о пожилых мужчинах, но и о признанных руководителях общины.
- source_word: ἐλληλύθει
  choice: уже пришёл
  rationale: Наречие «уже» помогает передать предшествование, выраженное греческим плюсквамперфектом.
- source_word: παρεγένετο
  choice: пришёл
  rationale: Естественно обозначает появление второго старейшины на месте событий.
- source_word: ἀνέκρινε
  choice: стал расспрашивать
  rationale: Сохраняет оттенок настойчивого выяснения, не превращая разговор в формальный судебный допрос.
- source_word: ὄρθρου
  choice: так рано
  rationale: В вопросе естественно передаёт раннее утреннее время; контекст глагола «вышел» делает отдельное уточнение «утром» необязательным.
- source_word: παραλαβὼν με
  choice: не взяв меня с собой
  rationale: Точно и идиоматично передаёт значение взять кого-либо с собой в качестве спутника.
