  text: And he cried out with a loud voice[a], “I am innocent of this woman’s blood.”
translation:
  language: ru
  text: 'И он громко воскликнул: «Я невиновен в крови этой женщины».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть он заявляет, что не несёт ответственности за её смерть. В греческом тексте это выражено библейским языком виновности в крови.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: воскликнул
  rationale: Передаёт громкий, настойчивый возглас; сочетание с φωνῇ μεγάλῃ естественно выражается наречием «громко».
- source_word: φωνῇ μεγάλῃ
  choice: громко
  rationale: Естественный современный русский эквивалент буквального «громким голосом», сохраняющий интенсивность выражения.
- source_word: Ἀθῷος
  choice: невиновен
  rationale: Передаёт отсутствие вины и ответственности в юридико-нравственном смысле.
- source_word: ἀπὸ τοῦ αἵματος ταύτης
  choice: в крови этой женщины
  rationale: Сохраняет библейскую метафору крови как ответственности за смерть и явное указание женского рода в ταύτης.
theological_decisions:
- issue: Идиома виновности в крови
  choice: Я невиновен в крови этой женщины
  alternative: На мне нет вины за смерть этой женщины
  rationale: Основной вариант сохраняет образ крови и юридико-нравственный смысл греческого выражения, не сводя его к ритуальной чистоте; сноска поясняет подразумеваемую ответственность за смерть.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный синтаксис. Библейский образ крови сохранён, а его смысл пояснён в сноске.
