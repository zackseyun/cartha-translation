    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο
  choice: приходили
  rationale: Имперфект передаёт продолжавшееся или обычное в прошлом действие; русское несовершенное «приходили» естественно сохраняет этот оттенок.
- source_word: κρίσεις
  choice: дела на суд
  rationale: В данном судебном контексте слово обозначает дела, поступавшие для рассмотрения, хотя буквально может означать и «судебные решения» или «суды».
- source_word: ἐξ ἄλλων πόλεων
  choice: из других городов
  rationale: Прямо передаёт источник движения и обычное значение πόλις.
- source_word: πρὸς αὐτούς
  choice: к ним
  rationale: Сохраняет выраженное πρός с винительным направление к названным ранее старейшинам; судебную цель поясняет оборот «на суд».
