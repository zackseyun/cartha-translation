base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/052.yaml
  text: But when they had been separated[a], one from the other, he called one of them and said to him, “You who have grown old in evil days[b], now the sins that you were doing before have come upon you.”
translation:
  language: ru
  text: 'Когда же их отделили друг от друга, он позвал одного из них и сказал ему: «Ты, состарившийся во дни зла![a] Теперь настигли тебя твои грехи, которые ты совершал прежде[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое обращение сжато: буквально оно говорит о том, кто «состарился» в «злых днях». Оно может подразумевать как долгую жизнь во зле, так и злой характер дней; основной текст сохраняет эту неоднозначность.'
    reason: lexical_alternative
  - marker: b
    text: Доступное извлечение греческого текста обрывается на слове τὸ, которое, вероятно, продолжается в следующем стихе как часть выражения τὸ πρότερον — «прежде» или «раньше».
    reason: textual_variant
lexical_decisions:
- source_word: διεχωρίσθησαν
  choice: их отделили
  rationale: Аорист пассивного залога указывает, что старейшин отделили друг от друга. Русская неопределённо-личная конструкция естественно передаёт пассивный смысл, не вводя действующее лицо.
- source_word: εἷς ἀπὸ τοῦ ἑνός
  choice: друг от друга
  rationale: Идиоматично передаёт взаимное разделение двух старейшин для раздельного допроса.
- source_word: ἐκάλεσεν τὸν ἕνα αὐτῶν
  choice: он позвал одного из них
  rationale: Сохраняет обычное значение καλέω; более официальное «вызвал» возможно, но не обязательно выражено самим глаголом.
- source_word: Πεπαιλαιωμένε ἡμερῶν κακῶν
  choice: Состарившийся в злых днях
  rationale: Сохраняет причастную форму обращения, слово «дни» и намеренно сжатую, обличительную формулировку греческого текста, не уточняя, названы ли злыми времена или жизнь самого старейшины.
- source_word: νῦν ἥκασιν αἱ ἁμαρτίαι σου
  choice: Теперь настигли тебя твои грехи
  rationale: ἥκασιν буквально означает «пришли, достигли». В русском «настигли тебя» естественно передаёт образ грехов, достигших виновного в час суда, не меняя их роли как подлежащего.
- source_word: ἃς ἐποίεις
  choice: которые ты совершал
  rationale: Имперфект передаёт продолжавшиеся или повторявшиеся в прошлом поступки; применительно к грехам по-русски естественно «совершал».
- source_word: τὸ
  choice: прежде
  rationale: Извлечение обрывается на артикле τὸ, который, по всей видимости, начинает переходящее через границу стиха выражение τὸ πρότερον — «прежде, раньше». В основном тексте передан вероятный полный смысл, а неполнота источника отмечена в сноске.
theological_decisions:
- issue: Нравственный смысл обращения Даниила к старейшине
  choice: 'Обращение звучит как обличение давней порочности: «Состарившийся в злых днях!»'
  alternative: Нейтральное указание на возраст или на жизнь в тяжёлые времена
  rationale: Судебный контекст и прилагательное κακῶν требуют сохранить обвинительную силу, но конструкция остаётся сжатой и не уточняет однозначно, относится ли зло прежде всего к дням, поступкам или характеру человека.
- issue: Образ возвращающихся к виновному грехов
  choice: «настигли тебя твои грехи»
  alternative: Буквальное «пришли твои грехи»
  rationale: Выбранная формулировка сохраняет персонифицированный образ и судебное напряжение, не добавляя отдельного утверждения о форме наказания.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-пророческой речи. Синтаксис сделан естественным для широкого читателя, тогда как необычная сжатость обличительного обращения сохранена и пояснена сноской.
