translation:
  language: ru
  text: весьма[a] и боялась Господа; её родители были праведны и наставили свою дочь согласно закону Моисея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слово «весьма» завершает начатую в предыдущем стихе характеристику Сусанны: она была «весьма красива».'
    reason: Начало стиха синтаксически зависит от предыдущего стиха; примечание предотвращает ошибочное присоединение наречия к словам «боялась Господа».
lexical_decisions:
- source_word: σφόδρα
  choice: весьма
  rationale: Наречие усиливает характеристику Сусанны, начатую в предыдущем стихе. «Весьма» сохраняет зависимость фрагмента и соответствует достоинству библейского повествования, не подставляя отсутствующее здесь прилагательное.
- source_word: φοβουμένη
  choice: боялась
  rationale: Причастие φοβέομαι с дополнением «Господа» обозначает благоговейный страх перед Богом. «Боялась» сохраняет прямое лексическое значение и естественно звучит по-русски.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В данном контексте κύριος относится к Богу Израиля; традиционное русское «Господа» передаёт это ясно и благоговейно.
- source_word: οἱ γονεῖς αὐτῆς
  choice: её родители
  rationale: Точное и естественное обозначение обоих родителей Сусанны.
- source_word: δίκαιοι
  choice: праведны
  rationale: «Праведны» сохраняет нравственно-религиозный смысл δίκαιοι и библейскую окраску слова.
- source_word: ἐδίδαξαν
  choice: учили
  rationale: Имперфект допускает представление о продолжительном или обычном воспитательном действии; «учили» естественно передаёт этот оттенок.
- source_word: τὴν θυγατέρα αὐτῶν
  choice: свою дочь
  rationale: Возвратное притяжательное местоимение естественно для русского языка при подлежащем «родители» и точно передаёт семейное отношение.
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: по закону Моисея
  rationale: Оборот с κατά выражает соответствие норме; «по закону Моисея» кратко, естественно и точно передаёт смысл.
theological_decisions:
- issue: Передача κύριος применительно к Богу
  choice: Господа
  alternative: Владыки
  rationale: «Господь» — прямое и общепринятое библейское соответствие κύριος; оно не требует реконструировать за греческим текстом еврейское Божье имя.
- issue: Характеристика родителей словом δίκαιοι
  choice: праведны
  alternative: справедливы
  rationale: «Праведны» сохраняет широкий нравственный и религиозный смысл, тогда как «справедливы» могло бы неоправданно сузить его до честности или беспристрастности.
- issue: Видо-временной оттенок ἐδίδαξαν
  choice: учили
  alternative: научили
  rationale: Греческий имперфект естественно допускает длительное воспитание; несовершенный вид не превращает его в одно завершённое действие.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Сохранена синтаксическая незавершённость начала стиха, обусловленная принятой нумерацией; зависимость разъяснена в сноске. Точка с запятой отражает тесную связь частей греческого предложения без тяжеловесного многократного «и».
