  text: So they sent for her, and she came with her parents and her children and all her relatives.
translation:
  language: ru
  text: Тогда за ней послали, и она пришла вместе со своими родителями, детьми и всеми родственниками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Тогда
  rationale: δέ здесь продолжает повествование, не выражая явного противопоставления; «тогда» естественно связывает действие с предыдущим контекстом.
- source_word: ἀπέστειλαν
  choice: за ней послали
  rationale: В данном контексте глагол означает, что Сусанну велели позвать или привести; русское выражение «за ней послали» точно и естественно передаёт этот смысл.
- source_word: ἦλθεν
  choice: она пришла
  rationale: Простой повествовательный аорист передан обычным русским глаголом совершенного вида.
- source_word: γονεῖς
  choice: родителями
  rationale: Греческое существительное во множественном числе означает родителей без дополнительной конкретизации.
- source_word: τέκνα
  choice: детьми
  rationale: «Дети» — прямой и нейтральный современный эквивалент в перечне членов семьи.
- source_word: πάντες οἱ συγγενεῖς
  choice: всеми родственниками
  rationale: Передаёт как полноту, выраженную πάντες, так и широкий семейный смысл συγγενεῖς, без архаизма и без ограничения по полу.
