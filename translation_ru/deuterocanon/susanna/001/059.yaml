base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/059.yaml
  text: Then Daniel said to him[a], “You also have lied rightly against your own head; for the angel of God stands by, holding the sword to split you in two, so that he may destroy you.”
translation:
  language: ru
  text: 'Тогда Даниил сказал ему: «И ты верно солгал себе на голову: ангел Божий стоит с мечом, чтобы рассечь тебя надвое и истребить вас[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Здесь «вас» стоит во множественном числе: угроза истребления относится к обоим старейшинам, а не только к тому, к кому Даниил обращается сейчас.'
    reason: Смена числа в греческом тексте существенна для объёма угрозы и может быть неочевидна читателю.
lexical_decisions:
- source_word: Ὀρθῶς ἔψευσαι
  choice: верно солгал
  rationale: 'Сохраняет резкую иронию греческого выражения: ложь старейшины «верна» в том смысле, что навлекает приговор на него самого.'
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  choice: себе на голову
  rationale: Передаёт конкретный образ последствий, обращающихся на самого виновного, и звучит естественно по-русски.
- source_word: μένει
  choice: уже стоит
  rationale: Передаёт пребывание ангела в готовности к действию; «уже» естественно выражает близость суда, подразумеваемую контекстом.
- source_word: ὁ ἄγγελος τοῦ θεοῦ
  choice: ангел Божий
  rationale: Достоинственная и естественная русская передача родительного оборота.
- source_word: τὴν ῥομφαίαν ἔχων
  choice: с мечом
  rationale: Кратко и естественно передаёт, что ангел держит или имеет при себе большой меч, не перегружая фразу.
- source_word: πρίσαι σε μέσον
  choice: рассечь тебя надвое
  rationale: Передаёт насильственное разделение пополам; «рассечь» соответствует судебно-грозному регистру, хотя πρίζω буквально может означать «распилить».
- source_word: ἐξολεθρεύσῃ ὑμᾶς
  choice: истребить вас
  rationale: «Истребить» сохраняет силу глагола полного уничтожения, а «вас» явно передаёт множественное число греческого местоимения.
theological_decisions:
- issue: Переход от единственного числа σε к множественному ὑμᾶς
  choice: 'сохранить смену числа в основном тексте: «тебя… вас»'
  alternative: «рассечь тебя надвое и истребить тебя» или «истребить вас обоих»
  rationale: Греческий текст сначала обращается к одному старейшине, а затем распространяет угрозу истребления на обоих. Смена числа сохранена без добавления отсутствующего в тексте слова «обоих»; сноска поясняет её значение.
translation_notes:
  register: Современный литературный русский с торжественным судебным оттенком. Сохранены ирония выражения «верно солгал», конкретный образ кары и намеренная смена единственного числа на множественное.
