  text: And they did not know that we were standing there. Then we rushed together[a], saying, 'Let us find out who these men are.'
translation:
  language: ru
  text: 'Они не знали, что мы стояли там. Тогда мы бросились друг к другу, говоря: «Давайте выясним, кто они».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ᾔδεισαν
  choice: не знали
  rationale: Прямое и естественное выражение прошедшего значения οἶδα в повествовании.
- source_word: εἰστήκειμεν
  choice: мы стоим там
  rationale: Греческий плюсквамперфект обозначает уже занятое положение; в придаточном при глаголе прошедшего времени русский обычно сохраняет настоящее время и тем самым передаёт одновременность.
- source_word: συνεπιτάμεθα ἀλλήλοις
  choice: мы вместе бросились к ним
  rationale: Редкий глагол передаёт внезапное совместное движение, а дательный ἀλλήλοις здесь естественно понимается как взаимная координация двух говорящих. Русское «к ним» проясняет направленность движения по ближайшему контексту, не создавая неверного впечатления, будто старейшины бросились друг на друга.
- source_word: Μάθωμεν
  choice: Узнаем
  rationale: Аористный сослагательный имеет побудительное значение; краткое «Узнаем» естественно передаёт предложение выяснить личность неизвестных.
- source_word: τίνες εἰσὶν οὗτοι
  choice: кто они такие
  rationale: Русская конструкция естественно передаёт вопрос о личности людей, сохраняя подразумеваемый мужской референт без избыточного добавления существительного.
