base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/016.yaml
  text: And after turning back[a], they came to the same place, and when they questioned one another about the reason, they confessed their desire[b]; then together they arranged a time when they would be able to find her alone.
translation:
  language: ru
  text: Повернув назад, они пришли в одно и то же место[a]. Расспросив друг друга о причине, они признались в своём желании[b]. Тогда они вместе условились о времени, когда смогут застать её одну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сошлись вместе»; греческое выражение может подчёркивать собрание вместе, а не возвращение в одно и то же место.'
    reason: lexical_alternative
  - marker: b
    text: 'В данном контексте речь идёт о незаконном половом влечении; возможный более явный перевод: «в своей похоти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακάμψαντες
  choice: повернули назад
  rationale: Передаёт физическое возвращение или поворот назад и сохраняет последовательность действий.
- source_word: ἐπὶ τὸ αὐτό
  choice: на то же место
  rationale: В данном повествовательном контексте выражение естественно указывает на совпадение места, хотя возможно понимание «сошлись вместе».
- source_word: ἀνετάζοντες ἀλλήλους τὴν αἰτίαν
  choice: расспросив друг друга о причине возвращения
  rationale: Глагол обозначает выяснение посредством вопросов; добавление «возвращения» ясно выражает подразумеваемый предмет причины, не меняя смысла.
- source_word: ὡμολόγησαν τὴν ἐπιθυμίαν αὐτῶν
  choice: признались в своём желании
  rationale: Сохраняет нравственно окрашенное открытое признание и более широкое значение ἐπιθυμία, тогда как контекст показывает незаконное половое влечение.
- source_word: κοινῇ συνετάξαντο καιρόν
  choice: вместе условились о времени
  rationale: Передаёт совместный, намеренный сговор и назначение подходящего момента естественным русским выражением.
- source_word: ὅτε αὐτὴν δυνήσονται εὑρεῖν μόνην
  choice: когда смогут застать её одну
  rationale: «Застать» естественно выражает нахождение человека в определённом состоянии или обстоятельствах; будущее возможности передано формой «смогут».
