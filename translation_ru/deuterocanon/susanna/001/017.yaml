base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/017.yaml
  text: And it happened[a], while they were watching for an opportune day, that she once entered, as yesterday and the third day before, with only two young maids, and desired to bathe in the garden, because it was hot.
translation:
  language: ru
  text: И вот, пока они выжидали подходящего дня, она однажды вошла, как накануне и за два дня до того,[a] лишь с двумя молодыми служанками и пожелала искупаться в саду, потому что стояла жара.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более обобщённо: «как и в предыдущие дни». Греческое выражение буквально сопоставляет этот приход с приходами накануне и за два дня до того.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: И вот
  rationale: Естественная русская повествовательная связка, передающая греческую формулу наступления события без архаичного «и случилось».
- source_word: παρατηρεῖν
  choice: высматривали
  rationale: Передаёт пристальное, целенаправленное наблюдение и допускаемый контекстом враждебный умысел, не добавляя прямо значения «подстерегали».
- source_word: ἡμέραν εὔθετον
  choice: подходящий день
  rationale: Обозначает день, удобный для их замысла; выражение естественно для современного русского языка.
- source_word: εἰσῆλθέν ποτε
  choice: она однажды вошла
  rationale: ποτε выделяет один конкретный случай; «однажды» естественно сочетается с аористом входа.
- source_word: καθὼς ἐχθὲς καὶ τρίτης ἡμέρας
  choice: как накануне и за два дня до того
  rationale: Сохраняет необычное прямое сопоставление с двумя предыдущими посещениями, не сводя его без оговорки к обобщённому «как в прежние дни».
- source_word: μετὰ δύο μόνων κορασίων
  choice: лишь с двумя молодыми служанками
  rationale: κοράσιον может обозначать девушку или молодую служанку; домашняя обстановка и роль спутниц поддерживают второе значение, а «молодыми» сохраняет возрастной оттенок.
- source_word: ἐπεθύμησε λούσασθαι
  choice: пожелала искупаться
  rationale: В данном контексте глагол выражает желание или намерение; «искупаться» естественно передаёт возвратное λούσασθαι.
- source_word: ἐν τῷ παραδείσῳ
  choice: в саду
  rationale: Здесь παράδεισος означает огороженный сад при доме, а не богословский Рай.
- source_word: ὅτι καῦμα ἦν
  choice: потому что стояла жара
  rationale: Идиоматично передаёт существительное καῦμα и причинную связь.
