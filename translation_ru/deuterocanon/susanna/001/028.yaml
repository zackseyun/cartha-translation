base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/028.yaml
  text: But the lawless men turned back[a], threatening among themselves and lying in wait so that they might put her to death. And when they came to the assembly of the city, they did not stay away[b], and all the sons of Israel who were there gathered together.
translation:
  language: ru
  text: Но беззаконные мужи повернули назад, высказывая между собой угрозы и устраивая засаду, чтобы предать её смерти. Придя на городское собрание, они не отсутствовали[a], и все находившиеся там сыны Израиля[b] собрались вместе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза «они не отсутствовали» передаёт трудное греческое выражение; вероятно, имеется в виду, что эти люди присутствовали на городском собрании, а не отсутствовали.
    reason: textual_difficulty
  - marker: b
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράνομοι
  choice: беззаконные
  rationale: 'Сохраняет правовой и нравственный смысл: эти люди поступают вопреки закону, а не просто ведут себя нечестиво.'
- source_word: ἀπέστρεψαν
  choice: повернули назад
  rationale: Передаёт простое значение движения, не уточняя без достаточных оснований, ушли ли они прочь или вернулись в прежнее место.
- source_word: ἀπειλοῦντες ἐν ἑαυτοῖς
  choice: втайне высказывая угрозы
  rationale: Греческое выражение необычно; перевод передаёт скрытый характер угроз, не создавая ложного впечатления, будто мужчины угрожали друг другу.
- source_word: ἐνεδρεύοντες
  choice: устраивая засаду
  rationale: Сохраняет конкретный образ тайного враждебного умысла, выраженный глаголом.
- source_word: ἵνα θανατώσωσιν αὐτήν
  choice: чтобы предать её смерти
  rationale: Передаёт целевое значение ἵνα и соответствует судебному контексту, не ослабляя намерения убить Сусанну.
- source_word: συναγωγή
  choice: собрание
  rationale: Здесь речь идёт о городском общественном или судебном собрании, а не обязательно о здании синагоги.
- source_word: οὐ παρῴκουν
  choice: не остались в стороне
  rationale: Трудная фраза по контексту, вероятно, подчёркивает их присутствие и участие в городском собрании; неоднозначность отмечена в сноске.
- source_word: συνήδρευσαν
  choice: собрались вместе
  rationale: Передаёт совместное собрание людей, возможно для заседания, без чрезмерного уточнения его официального характера.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохраняет явно мужскую родственную формулу греческого текста в естественной для библейского регистра русской форме.
theological_decisions:
- issue: Родовое обозначение народа Израиля
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Греческий текст буквально использует мужскую родственную формулу; перевод сохраняет её, не нейтрализуя и не расширяя значение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Мужи» и «сыны Израиля» сохраняют формальный характер исходных обозначений; синтаксис при этом сделан понятным современному читателю.
