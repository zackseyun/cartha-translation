  naturalness: Текст выдержан в современном литературном русском с уместным библейским оттенком. «Не отсутствовали» несколько формальнее, но в данном месте точнее и не навязывает смысл участия; сноска поясняет трудность оригинала.
  terminology: «Беззаконные», «предать смерти», «городское собрание» и «сыны Израиля» соответствуют регистру и смыслу. Примечание к «сынам Израиля» корректно сохраняет буквальную формулу и даёт естественную альтернативу.
