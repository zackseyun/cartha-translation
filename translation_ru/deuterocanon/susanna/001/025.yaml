  yaml_path: translation/deuterocanon/susanna/001/025.yaml
  text: It is preferable for me to fall into your hands without doing it rather than to sin before the Lord[a].
translation:
  language: ru
  text: Мне лучше, не сделав этого, попасть в ваши руки, чем согрешить пред Господом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не сделав»; греческий текст не называет поступок прямо, отсылая к требованию старейшин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετόν μοί ἐστιν
  choice: для меня лучше
  rationale: Передаёт личную оценку и сравнительное предпочтение естественным современным русским выражением.
- source_word: μὴ πράξασαν
  choice: не сделав этого
  rationale: Сохраняет форму предшествующего действия и не конкретизирует поступок, который в греческом подразумевается из контекста.
- source_word: ἐμπεσεῖν εἰς τὰς χεῖρας ὑμῶν
  choice: попасть в ваши руки
  rationale: Сохраняет греческую метафору перехода под чужую власть и остаётся ясным по-русски.
- source_word: ἢ ἁμαρτεῖν
  choice: чем согрешить
  rationale: В конструкции предпочтения ἢ передаётся сравнительным «чем», а ἁμαρτεῖν — прямым богословски точным «согрешить».
- source_word: ἐνώπιον Κυρίου
  choice: пред Господом
  rationale: Кратко и торжественно передаёт ответственность в присутствии и перед взором Господа.
theological_decisions:
- issue: Следует ли прямо назвать требуемый старейшинами поступок
  choice: 'Оставить поступок неуточнённым: «не сделав этого»'
  alternative: «не уступив вам» или «не совершив этого греха»
  rationale: Греческий текст не называет объект πράξασαν, а отсылает к контексту; конкретизация внесла бы дополнительное истолкование.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. «Пред Господом» выбрано вместо более разговорного «перед Господом»; синтаксис сохраняет напряжённое сопоставление двух исходов.
