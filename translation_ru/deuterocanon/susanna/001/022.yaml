  yaml_path: translation/deuterocanon/susanna/001/022.yaml
  text: And they said[a], “Look, the doors of the garden are shut, and no one sees us, and we are filled with desire for you. Therefore consent to us, and be with us.”
translation:
  language: ru
  text: 'И они сказали: «Вот, ворота сада[a] заперты, и никто нас не видит, а мы желаем тебя. Поэтому уступи нам и будь с нами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое παράδεισος здесь означает ограждённый сад или парк, а не Рай в более позднем богословском смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: вот
  rationale: Сохраняет указательно-побудительную силу греческого слова и естественно звучит в современной русской прямой речи.
- source_word: αἱ θύραι τοῦ παραδείσου
  choice: ворота сада
  rationale: В данном повествовательном контексте παράδεισος обозначает ограждённый сад, а θύραι — его запирающиеся ворота; такой перевод естественнее русского «двери сада».
- source_word: κέκλεινται
  choice: заперты
  rationale: Передаёт наличное состояние, выраженное греческим перфектом, и соответствует обстановке закрытого сада.
- source_word: θεωρεῖ
  choice: видит
  rationale: Прямой и естественный эквивалент со значением зрительного наблюдения.
- source_word: ἐν ἐπιθυμίᾳ σού ἐσμεν
  choice: мы охвачены желанием к тебе
  rationale: Передаёт сильное, в контексте сексуальное желание, не добавляя образа горения, которого нет в греческом тексте.
- source_word: διὸ
  choice: поэтому
  rationale: Ясно передаёт вывод, которым говорящие связывают уединённость и своё желание с последующим требованием.
- source_word: συγκατάθου ἡμῖν
  choice: уступи нам
  rationale: Передаёт требование согласиться или подчиниться их домогательству; русское выражение сохраняет принудительный оттенок контекста и не превращает речь в нейтральное согласование мнений.
- source_word: γενοῦ μεθ᾿ ἡμῶν
  choice: будь с нами
  rationale: Близко следует греческой формулировке, оставляя сексуальный смысл определяться контекстом.
theological_decisions:
- issue: Значение παράδεισος вне эсхатологического контекста
  choice: сад
  alternative: рай
  rationale: В рассказе о Сусанне слово обозначает ограждённый сад или парк. Перевод «рай» внёс бы отсутствующую здесь эсхатологическую ассоциацию.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Реплика передана прямо и естественно; её угрожающий и сексуально-принудительный характер сохранён без эвфемистического смягчения и без добавления отсутствующих в греческом тексте подробностей.
