translation:
  language: ru
  text: И когда её вели на смерть, Бог пробудил святой дух в более молодом юноше по имени Даниил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαγομένης αὐτῆς ἀπολέσθαι
  choice: её вели на смерть
  rationale: Передаёт пассивную конструкцию и цель ἀπολέσθαι естественно и без добавления способа казни.
- source_word: ἐξήγειρεν
  choice: пробудил
  rationale: Сохраняет образ внутреннего побуждения или пробуждения, выраженный глаголом ἐξεγείρω.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: святой дух
  rationale: Буквально сохраняет греческое выражение и его возможную неоднозначность; строчная буква не навязывает позднейшую тринитарную идентификацию.
- source_word: παιδαρίου νεωτέρου
  choice: в одном юноше помоложе
  rationale: Уменьшительное παιδάριον обозначает мальчика или юношу, а сравнительное νεωτέρου — более молодого; «помоложе» сохраняет сравнительный оттенок без указания явного объекта сравнения.
- source_word: ᾧ ὄνομα Δανιήλ
  choice: которого звали Даниил
  rationale: Естественный современный русский эквивалент греческой именной формулы.
theological_decisions:
- issue: Отождествление «святого духа» со Святым Духом как личностью
  choice: святой дух
  alternative: Святой Дух
  rationale: Греческий текст допускает понимание как святого духа, находящегося в Данииле, так и действия Святого Духа. Перевод не должен без необходимости устранять эту неоднозначность.
- issue: Связь духа с Даниилом
  choice: пробудил святой дух в одном юноше
  alternative: возбудил святой дух юноши
  rationale: Греческий родительный оборот может описывать дух юноши, но избранная формулировка сохраняет возможность как внутреннего духа Даниила, так и божественного присутствия в нём.
translation_notes:
  register: Современный литературный русский, сдержанный повествовательный регистр. Формулировка ясна обычному читателю и сохраняет сравнительный смысл νεωτέρου и богословскую неоднозначность πνεῦμα τὸ ἅγιον.
