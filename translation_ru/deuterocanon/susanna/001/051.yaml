lexical_decisions:
- source_word: Διαχωρίσατε
  choice: Отведите
  rationale: Повелительное наклонение множественного числа требует физически разлучить двух старейшин; «отведите» естественно передаёт действие в данной судебной сцене.
- source_word: ἀπ᾽ ἀλλήλων
  choice: друг от друга
  rationale: Обычное современное русское выражение взаимного удаления.
- source_word: μακράν
  choice: далеко
  rationale: Наречие подчёркивает, что обвинителей следует разместить на значительном расстоянии друг от друга.
- source_word: ἀνακρινῶ
  choice: допрошу
  rationale: В судебном контексте глагол обозначает разбирательство посредством опроса; «допрошу» ясно и кратко передаёт этот смысл, не исключая более общего значения исследования.
- source_word: Δανιήλ
  choice: Даниил
  rationale: Традиционная и общепринятая русская форма библейского имени.
