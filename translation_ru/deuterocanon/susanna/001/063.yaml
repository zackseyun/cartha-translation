  yaml_path: translation/deuterocanon/susanna/001/063.yaml
  text: And Hilkiah and his wife praised their daughter[a], along with Joakim her husband and all their relatives, because no shameful deed was found in her.
translation:
  language: ru
  text: Хелкия же и его жена вместе с Иоакимом, мужем их дочери, и всеми родственниками воздали хвалу по поводу своей дочери[a], потому что в ней не нашлось никакого постыдного дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хвалили относительно (по поводу) своей дочери». Адресат хвалы в греческом тексте прямо не назван.'
    reason: Сохраняет невыраженный объект глагола ᾔνεσαν и широкий смысл περί с родительным, не добавляя в основной текст адресата хвалы.
lexical_decisions:
- source_word: Χελκίας
  choice: Хелкия
  rationale: Традиционная русская библейская передача греческой формы имени.
- source_word: ᾔνεσαν περὶ τῆς θυγατρὸς αὐτῶν
  choice: воздали хвалу за свою дочь
  rationale: Передаёт значение глагола «хвалить, воздавать хвалу» и περί с родительным («о, за, по поводу»), не называя отсутствующий в греческом тексте объект хвалы.
- source_word: μετὰ Ἰωακεὶμ τοῦ ἀνδρὸς αὐτῆς
  choice: вместе с Иоакимом, мужем их дочери
  rationale: Сохраняет значение совместности у μετά и устраняет возможную в русском двусмысленность местоимения «её».
- source_word: τῶν συγγενῶν πάντων
  choice: всеми родственниками
  rationale: Современная и достаточно широкая передача обозначения родных и сородичей; притяжательное отношение в греческом прямо не выражено.
- source_word: οὐχ εὑρέθη ἐν αὐτῇ
  choice: за ней не нашли
  rationale: Естественная русская судебно-нравственная формулировка, сохраняющая смысл обнаружения в её поведении или деле.
- source_word: αἰσχρὸν πρᾶγμα
  choice: никакого постыдного поступка
  rationale: «Поступок» естественно передаёт совершённое дело, а «постыдный» сохраняет нравственную и общественную окраску αἰσχρός.
theological_decisions:
- issue: Неуказанный объект хвалы в ᾔνεσαν
  choice: 'Объект не назван: «воздали хвалу за свою дочь»'
  alternative: «воздали хвалу Богу за свою дочь» или «хвалили свою дочь»
  rationale: В контексте объектом хвалы, вероятно, является Бог, однако греческий текст его не называет; конструкция с περί также не представляет дочь однозначно как прямой объект глагола. Перевод сохраняет эту смысловую открытость, а примечание поясняет её.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Частица «же» сохраняет повествовательную связь; синтаксис упрощён для ясности без устранения исходной неоднозначности.
