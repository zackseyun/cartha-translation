base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/023.yaml
  text: But if not[a], we will testify against you that a young man was with you[b], and for this reason you sent the servant girls away from you.
translation:
  language: ru
  text: А если нет[a], мы дадим против тебя показания, что с тобой был юноша и потому ты отослала от себя служанок[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть: если ты не согласишься. В греческом тексте условие выражено кратко и не договаривается.'
    reason: ellipsis_clarification
  - marker: b
    text: Греческое слово буквально может означать «девушек»; здесь имеются в виду молодые прислужницы Сусанны.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μή
  choice: А если нет
  rationale: Сохраняет резкую, эллиптическую угрозу греческого текста; подразумеваемое «если не согласишься» не вносится прямо в основной текст.
- source_word: καταμαρτυρήσομέν σου
  choice: мы дадим против тебя показания
  rationale: Передаёт враждебный и судебный оттенок глагола естественным современным русским выражением, не сводя его к более общему «обвиним».
- source_word: ὅτι ἦν μετὰ σοῦ νεανίσκος
  choice: что с тобой был юноша
  rationale: Точно и естественно передаёт содержание задуманного ложного свидетельства; «юноша» соответствует νεανίσκος без лишней конкретизации.
- source_word: διὰ τοῦτο
  choice: и потому
  rationale: Сохраняет явную причинную связь между мнимым присутствием юноши и удалением прислужниц.
- source_word: ἐξαπέστειλας ... ἀπὸ σοῦ
  choice: ты отослала от себя
  rationale: Передаёт как действие удаления, так и выраженное в греческом тексте отделение от Сусанны.
- source_word: τὰ κοράσια
  choice: служанок
  rationale: Само слово может означать девушек, однако в данном контексте речь идёт о молодых прислужницах Сусанны; краткое «служанок» естественно по-русски, а лексическая широта отмечена в сноске.
theological_decisions:
- issue: Характер угрозы старейшин
  choice: Передать как угрозу дать судебно значимые показания против Сусанны
  alternative: 'Передать обобщённо: «мы обвиним тебя»'
  rationale: Греческий глагол имеет выраженный оттенок свидетельства против кого-либо. Судебная формулировка сохраняет нравственное и повествовательное напряжение, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с ясным судебным оттенком. Синтаксис оставлен кратким и угрожающим; эллипсис исходного условия сохранён, а не раскрыт в основном тексте.
