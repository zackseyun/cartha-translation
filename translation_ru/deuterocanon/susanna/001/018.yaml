  text: And no one was there except the two elders[a], hidden and watching her.
translation:
  language: ru
  text: И никого там не было, кроме двух старейшин, которые, спрятавшись, наблюдали за ней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «следили за ней». Греческий глагол может подразумевать пристальное, недоброжелательное или тайное наблюдение; в основном тексте сохранено более нейтральное «наблюдали за ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν οὐδεὶς
  choice: никого там не было
  rationale: Греческое двойное отрицание идиоматически выражает полное отсутствие других людей; этот русский оборот естественен и точен.
- source_word: πλὴν
  choice: кроме
  rationale: Предлог вводит единственное исключение и прямо передаётся современным русским «кроме».
- source_word: οἱ δύο πρεσβύτεροι
  choice: два старейшины
  rationale: В контексте πρεσβύτεροι обозначает признанных старейшин и судей общины, а не просто пожилых мужчин.
- source_word: κεκρυμμένοι
  choice: спрятавшись
  rationale: Перфектное причастие указывает, что они уже укрылись и оставались незамеченными; деепричастие естественно передаёт это состояние в русском предложении.
- source_word: παρατηροῦντες αὐτήν
  choice: наблюдали за ней
  rationale: Глагол означает пристальное наблюдение и в данном контексте допускает оттенок тайной слежки, не требуя его однозначно закреплять в основном тексте.
