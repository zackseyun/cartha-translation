base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/005.yaml
  text: 'And in that year two elders from the people were appointed as judges[a], concerning whom the Master had spoken: “Lawlessness came out from Babylon, from elders who were judges[b], who seemed to govern the people.”'
translation:
  language: ru
  text: 'И в тот год двое старейшин из народа были назначены судьями. О них Владыка[a] сказал: «Беззаконие вышло из Вавилона — от старейшин, которые были судьями и, как считалось[b], управляли народом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь», «Повелитель». Греч. δεσπότης подчёркивает верховную власть и отличается от обычного слова κύριος («Господь»).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которые, казалось, управляли народом». Конец греческого предложения синтаксически сжат; речь может идти либо о мнении окружающих, либо лишь о видимости надлежащего управления.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεδείχθησαν
  choice: были назначены
  rationale: В сочетании с именной частью κριταί глагол обозначает официальное назначение на должность, а не простое обнаружение или представление.
- source_word: πρεσβύτεροι
  choice: старейшины
  rationale: Контекст общественного и судебного служения указывает на руководителей общины, а не просто на пожилых мужчин.
- source_word: κριταὶ
  choice: судьи
  rationale: Прямо передаёт обозначенную в тексте судебную функцию.
- source_word: δεσπότης
  choice: Владыка
  rationale: Передаёт верховную власть и сохраняет отличие δεσπότης от обычного κύριος; в современном литературном русском естественно относится к Богу.
- source_word: ἀνομία
  choice: беззаконие
  rationale: Сохраняет связь с нарушением закона и справедливости, особенно уместную в контексте продажных судей.
- source_word: ἐξῆλθεν
  choice: вышло
  rationale: Сохраняет образ беззакония, исходящего из Вавилона, и звучит естественно по-русски.
- source_word: οἱ ἐδόκουν κυβερνᾷν τὸν λαόν
  choice: которые, как считалось, управляли народом
  rationale: Передаёт возможное безличное значение ἐδόκουν и сохраняет ироническое расхождение между общественным мнением об этих правителях и их подлинным нравственным обликом.
theological_decisions:
- issue: Передача δεσπότης в высказывании о Боге
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: «Владыка» ясно допускает божественного референта и при этом не смешивает δεσπότης с более обычным κύριος. «Повелитель» менее естественно звучит как самостоятельный божественный титул, а «Господь» устраняет лексическое различие.
- issue: Значение ἐδόκουν применительно к правлению старейшин
  choice: как считалось, управляли народом
  alternative: казалось, управляли народом
  rationale: Греческая форма допускает и значение внешней видимости, и значение общественного мнения. Основной текст выбирает естественное русское выражение, а примечание сохраняет альтернативу и заложенную в ней иронию.
translation_notes:
  register: Современный литературный русский, с достоинством библейского повествования без архаизации. «Старейшины-судьи» компактно сохраняет оба существительных в цитатной части; тире передаёт пояснительное развитие мысли. Все примечания обозначены в основном тексте.
