base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/042.yaml
  text: And Susanna cried out with a loud voice and said, “O eternal God, knower of the hidden things, who knows all things before they come to be,”
translation:
  language: ru
  text: 'И Сусанна воззвала громким голосом и сказала: «Боже вечный, ведающий сокрытое[a], знающий всё прежде, чем всё это возникнет[b],»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведающий тайны».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «до возникновения всего этого» или «прежде, чем всё это произойдёт». Греческое выражение может широко обозначать знание вещей и событий до того, как они возникают или совершаются.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεβόησεν
  choice: воззвала
  rationale: Глагол передаёт сильный, исполненный чувства возглас; «воззвала» естественно звучит в контексте молитвы и сохраняет возвышенный регистр.
- source_word: φωνῇ μεγάλῃ
  choice: громким голосом
  rationale: Конкретно и естественно передаёт греческий оборот, не ослабляя силы возгласа.
- source_word: Ὁ θεὸς ὁ αἰώνιος
  choice: Боже вечный
  rationale: Именительная форма в греческом здесь выполняет функцию обращения; русский звательный оборот точно передаёт молитвенное воззвание.
- source_word: ὁ τῶν κρυπτῶν γνώστης
  choice: ведающий сокрытое
  rationale: «Сокрытое» сохраняет широкое значение κρυπτά — всё скрытое, а не только намеренно хранимые тайны; «ведающий» естественно оформляет определение Бога.
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: знающий всё
  rationale: Причастный оборот естественен по-русски и сохраняет всеохватность τὰ πάντα.
- source_word: πρὶν γενέσεως αὐτῶν
  choice: прежде, чем оно возникает
  rationale: Передаёт знание до возникновения всего упомянутого и оставляет γενέσεως достаточно широким для появления, осуществления или наступления событий.
theological_decisions:
- issue: Божественное предведение в выражении πρὶν γενέσεως αὐτῶν
  choice: прежде, чем оно возникает
  alternative: до его возникновения; прежде, чем всё это происходит
  rationale: Формулировка утверждает предшествующее знание Бога, но не вводит более разработанного учения о способе или причинности этого знания.
