lexical_decisions:
- source_word: ἐξελθόντες
  choice: выйдя
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно передаёт эту последовательность без лишнего пояснения.
- source_word: διεχωρίσθησαν
  choice: разошлись
  rationale: 'Форма употреблена непереходно и взаимно: они расстались и пошли порознь. «Разошлись» естественно звучит в современном русском повествовании.'
- source_word: ἀπ᾿ ἀλλήλων
  choice: выражено глаголом «разошлись»
  rationale: В русском языке взаимное удаление уже ясно выражено возвратным глаголом; буквальное «друг от друга» возможно, но здесь стилистически избыточно.
