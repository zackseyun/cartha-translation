base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/007.yaml
  text: These men saw a woman beautiful in appearance[a], a wife of one of their brothers from the sons of Israel, whose name was Susanna, daughter of Hilkiah, wife of Joakim, walking in her husband's garden in the evening.
translation:
  language: ru
  text: Эти люди увидели красивую с виду женщину — жену их брата, одного из сынов Израиля[a], по имени Сусанна, дочь Хелкии, жену Иоакима, — гулявшую вечером в саду своего мужа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «жену их брата из сынов Израиля». Оборот синтаксически труден; вероятно, он подчёркивает, что она была женой их собрата-израильтянина.'
    reason: Неоднозначный и синтаксически трудный оборот в исходном тексте.
lexical_decisions:
- source_word: οὗτοι ἰδόντες
  choice: Эти люди увидели
  rationale: Указательное местоимение относится к ранее названным мужчинам; слово «люди» проясняет отсылку, а причастие передано личной формой прошедшего времени в соответствии с русским повествовательным строем.
- source_word: γυναῖκα ἀστεῖαν τῷ εἴδει
  choice: красивую с виду женщину
  rationale: ἀστεῖος здесь обозначает внешнюю привлекательность, а τῷ εἴδει прямо ограничивает характеристику внешностью. Оборот «красивая с виду» близок греческому и естественен по-русски.
- source_word: γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ
  choice: жену одного из своих братьев, из сынов Израиля
  rationale: Передача сохраняет язык братства и принадлежность к Израилю, но не утверждает однозначно, что речь идёт о родном брате обоих старейшин. Необычность греческого оборота отмечена в сноске.
- source_word: ὄνομα Σουσάνναν
  choice: по имени Сусанна
  rationale: Естественная русская передача формулы именования без изменения её смысла.
- source_word: θυγατέρα Χελκίου
  choice: дочь Хелкии
  rationale: Прямая передача родственного обозначения и греческой формы имени.
- source_word: γυναῖκα Ἰωακείμ
  choice: жену Иоакима
  rationale: Прямая передача родительного отношения; имя транслитерировано в принятой русской библейской форме.
- source_word: περιπατοῦσαν
  choice: которая гуляла
  rationale: Причастие передано придаточным предложением для ясного современного русского синтаксиса; «гуляла» естественно описывает хождение по саду.
- source_word: ἐν τῷ παραδείσῳ τοῦ ἀνδρὸς αὐτῆς
  choice: в саду своего мужа
  rationale: παράδεισος в данном бытовом контексте означает сад или огороженный парк, а не богословский рай.
- source_word: τὸ δειλινόν
  choice: вечером
  rationale: Краткая и естественная передача обозначения вечернего времени.
theological_decisions:
- issue: Толкование трудного оборота γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ
  choice: жену одного из своих братьев, из сынов Израиля
  alternative: жену их брата из сынов Израиля; жену их соплеменника-израильтянина
  rationale: Греческий текст синтаксически неровен и допускает как более буквальное понимание слова «брат», так и более широкое — «собрат, соплеменник». Основной текст сохраняет братскую лексику и связь с сынами Израиля, а сноска открыто указывает на буквальную форму и трудность выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Длинное перечисление сохранено, но расчленено тире; причастная конструкция преобразована в придаточную для ясности. Необычное обозначение родства не сглажено без пояснения.
