base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/029.yaml
  text: And it happened on the next day[a], when the people had gathered to her husband Joakim, that the two elders came, full of their lawless intent against Susanna to put her to death, and they said before the people, “Send for Susanna daughter of Hilkiah, who is the wife of Joakim.”
translation:
  language: ru
  text: 'На следующий день, когда народ собрался у Иоакима, её мужа, пришли те два старейшины, исполненные беззаконного умысла против Сусанны, с намерением предать её смерти.[a] Они сказали перед народом: «Пошлите за Сусанной, дочерью Хелкии, женой Иоакима».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполненные беззаконного замысла против Сусанны, чтобы умертвить её». Греческий текст подчёркивает внутренний умысел, противный закону и направленный против неё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐπαύριον
  choice: на следующий день
  rationale: Естественное современное обозначение следующего дня без архаического оттенка.
- source_word: συνῆλθεν ὁ λαὸς πρὸς τὸν ἄνδρα αὐτῆς Ἰωακείμ
  choice: народ собрался у Иоакима, её мужа
  rationale: «Собрался» передаёт совместное собрание народа, а «у Иоакима» естественно выражает πρός в значении направления и места собрания; приложение сохраняет указание на супружескую связь.
- source_word: οἱ δύο πρεσβῦται
  choice: те два старейшины
  rationale: «Старейшины» отражает общественно-судебное положение этих людей, а определённость артикля естественно передана словом «те» с учётом предшествующего повествования.
- source_word: πλήρεις τῆς ἀνόμου ἐννοίας
  choice: исполненные беззаконного умысла
  rationale: ἐννοία обозначает внутренний замысел или намерение, а ἄνομος подчёркивает его противозаконность; возвышенное, но понятное «исполненные» соответствует повествовательному регистру.
- source_word: κατὰ Σουσάννης τοῦ θανατῶσαι αὐτήν
  choice: против Сусанны — предать её смерти
  rationale: Сохранена направленность умысла против Сусанны и цель, выраженная артиклевым инфинитивом; тире ясно связывает умысел с намерением добиться её смерти, не сливая две греческие конструкции.
- source_word: Ἀποστείλατε ἐπὶ Σουσάνναν
  choice: Пошлите за Сусанной
  rationale: Естественная русская формула распоряжения послать людей, чтобы привести вызванного человека.
- source_word: θυγατέρα Χελκίου
  choice: дочерью Хелкии
  rationale: Сохраняется патронимическое определение; «Хелкия» соответствует русской библейской традиции передачи имени Χελκίας.
- source_word: ἥ ἐστιν γυνὴ Ἰωακείμ
  choice: женой Иоакима
  rationale: Краткое приложение естественно передаёт формальное уточнение личности; γυνή в контексте однозначно означает жену.
theological_decisions:
- issue: Значение πρεσβῦται в судебно-общественном контексте
  choice: старейшины
  alternative: старики
  rationale: Персонажи выступают как признанные общественные и судебные авторитеты перед собранием народа; «старейшины» сохраняет эту роль, тогда как «старики» обозначало бы преимущественно возраст.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис несколько упрощён по сравнению с длинным греческим периодом, но смысловые связи сохранены. Имена переданы в привычной русской библейской форме: Сусанна, Иоаким, Хелкия.'
