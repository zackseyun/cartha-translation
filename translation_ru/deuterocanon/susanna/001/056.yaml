  yaml_path: translation/deuterocanon/susanna/001/056.yaml
  text: And after removing him[a], he ordered the other one to be brought forward. And he said to him, “Offspring of Canaan and not Judah, beauty has deceived you[b], and desire has corrupted your heart.”
translation:
  language: ru
  text: 'Отведя его в сторону, он велел привести другого и сказал ему: «Потомок Ханаана, а не Иуды[a]! Красота обманула тебя, и вожделение извратило твоё сердце».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Семя Ханаана, а не Иуды». Это резкое обличение использует язык происхождения, противопоставляя Ханаан Иуде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας
  choice: отведя его в сторону
  rationale: Причастие указывает, что первого старейшину удалили или отделили перед допросом второго; выражение естественно передаёт судебную обстановку, не уточняя место.
- source_word: ἐκέλευσεν προσαγαγεῖν τὸν ἕτερον
  choice: велел привести другого
  rationale: Точно и естественно передаёт распоряжение представить второго из двух старейшин.
- source_word: Σπέρμα Χανάαν καὶ οὐκ Ἰούδα
  choice: Потомок Ханаана, а не Иуды
  rationale: Сохраняет резкое родословное противопоставление; буквальное «семя» по-русски здесь звучало бы менее естественно.
- source_word: τὸ κάλλος ἐξηπάτησέν σε
  choice: красота обманула тебя
  rationale: Сохраняет олицетворённую формулировку и интенсивность обвинения без лишнего истолкования.
- source_word: ἐπιθυμία
  choice: вожделение
  rationale: В данном контексте речь идёт о порочном половом желании; «вожделение» ясно выражает этот смысл и сохраняет возвышенный регистр.
- source_word: διέστρεψεν τὴν καρδίαν σου
  choice: извратило твоё сердце
  rationale: Передаёт нравственное и внутреннее искажение, выраженное глаголом διαστρέφω, в естественной русской библейской речи.
theological_decisions:
- issue: Смысл обличения «Σπέρμα Χανάαν καὶ οὐκ Ἰούδα»
  choice: Сохранено буквальное родословное противопоставление Ханаана и Иуды.
  alternative: «Ты поступаешь как хананей, а не как иудей».
  rationale: Греческий текст говорит не просто о сходстве поведения, а использует резкое обозначение происхождения; парафраз ослабил бы риторическую и заветную напряжённость.
- issue: Нравственный оттенок ἐπιθυμία
  choice: «вожделение»
  alternative: «желание»
  rationale: Хотя слово может иметь более широкий смысл, непосредственный контекст однозначно указывает на порочную половую страсть; выбранное слово делает это ясно, не добавляя конфессионального толкования.
