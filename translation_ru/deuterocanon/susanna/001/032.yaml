revisions:
- from: И беззаконники приказали снять с неё покрывало[a], чтобы насытить своё желание её красоты[b].
  to: И беззаконные люди приказали снять с неё покров[a], чтобы утолить своё желание, вызванное её красотой[b].
  rationale: Исправлена неестественная и двусмысленная русская связь «желание её красоты». Формулировка «своё желание, вызванное её красотой» ясно относит желание к беззаконным людям и сохраняет связь с красотой Сусанны, не усиливая ἐπιθυμία до более узкого «похоти». «Беззаконные люди» прямо отражает οἱ παράνομοι. Примечания уточнены для различения того, что прямо сказано в греческом, и вероятного контекстуального понимания.
  reviewer_model: gpt-5.6-terra
