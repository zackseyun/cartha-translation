review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: незаконные/беззаконные люди отдают приказ снять с Сусанны покров, руководствуясь порочным желанием, связанным с её красотой. Однако «насытить своё желание её красоты» по-русски грамматически и семантически неудачно: создаёт впечатление, будто желание принадлежит её красоте, а не этим людям. «Покрывало» допустимо как контекстуальное уточнение, но греческое ἀποκαλύψαι буквально говорит лишь об открытии/снятии покрова с неё.'
  naturalness: «Беззаконники приказали снять с неё покрывало» естественно для современного литературного русского, хотя «беззаконные люди» несколько яснее передаёт οἱ παράνομοι как характеристику конкретных лиц. Исправленная цель приказа звучит естественно, без искусственного управления существительного «желание».
  terminology: «Беззаконные люди» сохраняет правовой и нравственный смысл παράνομοι. «Желание» не сужает ἐπιθυμία до одного технического значения; контекст и примечание дают понять его порочный характер. Примечание к снятию покрова не должно утверждать, что именно покрывало названо в греческом тексте.
  issues:
  - severity: medium
    issue: Неудачное выражение «насытить своё желание её красоты».
    rationale: Оно не передаёт естественно греческое образное «быть наполненными желанием» в связи с её красотой и в русском может быть понято как «желание, принадлежащее её красоте». Нужна ясная конструкция, в которой желание принадлежит действующим лицам и связано с красотой Сусанны.
  - severity: low
    issue: Примечание a называет «покрывало» вероятным предметом действия слишком прямо.
    rationale: Слово ἀποκαλύψαι не называет конкретный предмет одежды; контекст допускает снятие покрова, но это остаётся контекстуальным уточнением. Примечание следует сформулировать так, чтобы отличать буквальное значение от вероятного понимания сцены.
