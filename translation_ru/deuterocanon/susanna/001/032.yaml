  yaml_path: translation/deuterocanon/susanna/001/032.yaml
  text: And the lawless men ordered her to be uncovered[a], so that they might satisfy their desire for her beauty.
translation:
  language: ru
  text: И беззаконные люди приказали снять с неё покров[a], чтобы утолить своё желание, вызванное её красотой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыть её» или «снять с неё покров». Греческий текст не уточняет, какой именно покров имеется в виду, и не говорит о полном обнажении.'
    reason: Уточняет буквальное значение ἀποκαλύψαι, не внося в основной текст утверждения о степени обнажения.
  - marker: b
    text: 'Или: «чтобы наполниться желанием из-за её красоты». Греческий текст буквально говорит о том, чтобы «наполниться» желанием; выражение передаёт их порочное влечение, связанное с её красотой.'
    reason: Передаёт образ ἐμπλησθῶσιν и сохраняет широту ἐπιθυμία, поясняя контекстуальный смысл.
lexical_decisions:
- source_word: προσέταξαν
  choice: приказали
  rationale: Аорист προστάσσω обозначает властное распоряжение; «приказали» естественно и точно передаёт силу глагола.
- source_word: οἱ παράνομοι
  choice: беззаконники
  rationale: παράνομος характеризует этих людей как поступающих вопреки закону. «Беззаконники» сохраняет одновременно правовой и нравственный оттенок.
- source_word: ἀποκαλύψαι αὐτήν
  choice: снять с неё покрывало
  rationale: ἀποκαλύπτω означает «открывать, снимать покров». В данном контексте речь идёт о снятии покрывала перед собранием; перевод не подразумевает полного обнажения.
- source_word: ἵνα ἐμπλησθῶσιν
  choice: чтобы насытить
  rationale: ἐμπίμπλημι буквально означает «наполнять(ся)», а с родительным падежом также «насыщаться чем-либо». Русское «насытить» сохраняет образ полноты и передаёт стремление удовлетворить желание.
- source_word: τοῦ κάλλους
  choice: красоты
  rationale: κάλλος означает красоту, особенно телесную привлекательность; нейтральное «красота» не усиливает исходный текст.
- source_word: ἐπιθυμίας αὐτῆς
  choice: своё желание её красоты
  rationale: ἐπιθυμία может обозначать желание, влечение или страсть. Контекст ясно показывает порочность этого желания, однако «желание» сохраняет лексическую широту греческого слова; притяжательное «своё» естественно указывает на действующих лиц.
theological_decisions:
- issue: Нравственно-правовая характеристика οἱ παράνομοι
  choice: беззаконники
  alternative: нечестивцы; преступники
  rationale: «Беззаконники» передаёт и нравственное осуждение, и связь с нарушением закона, не сужая значение до конкретного преступления.
- issue: Сила значения ἐπιθυμία
  choice: желание
  alternative: страсть; похоть
  rationale: В контексте желание носит явно развратный характер, но само слово имеет более широкий диапазон значений. Перевод не подменяет контекстуальный вывод более узким словарным значением.
- issue: Степень обнажения в ἀποκαλύψαι αὐτήν
  choice: снять с неё покрывало
  alternative: открыть её; обнажить её
  rationale: Греческий глагол говорит о снятии покрова, но сам по себе не уточняет степень обнажения. Формулировка с покрывалом соответствует сцене и не вносит утверждения о полном обнажении.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Беззаконники» сохраняет возвышенно-правовой оттенок, а синтаксис остаётся понятным обычному читателю. Основной текст намеренно не употребляет более узкое «похоть» и не подразумевает полного обнажения.
