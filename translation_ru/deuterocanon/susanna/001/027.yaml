    text: 'Или: «свои заявления» или «свои высказывания»; по контексту это обвинительные слова против Сусанны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ
  choice: Но когда
  rationale: ἡνίκα вводит придаточное времени, а δέ обозначает повествовательный переход с лёгким противопоставлением.
- source_word: οἱ πρεσβῦται
  choice: старейшины
  rationale: В данном повествовании речь идёт не просто о пожилых мужчинах, а о старейшинах, обладавших общественным и судебным авторитетом.
- source_word: τοὺς λόγους αὐτῶν
  choice: свои слова
  rationale: Нейтрально передаёт широкое значение λόγοι и не уточняет сверх греческого текста, были ли это показания или обвинение.
- source_word: κατῃσχύνθησαν ... σφόδρα
  choice: были глубоко потрясены
  rationale: В контексте русское «потрясены» естественно выражает болезненную реакцию стыда и смущения, а «глубоко» передаёт усиление σφόδρα.
- source_word: οἱ δοῦλοι
  choice: слуги
  rationale: В контексте домашнего хозяйства речь идёт о зависимых домашних людях; «слуги» естественно по-русски и не навязывает более конкретный правовой статус.
- source_word: ὅτι πώποτε οὐκ ἐρρέθη
  choice: потому что ... никогда не говорили
  rationale: Передаёт причинную связь и значение «никогда прежде / ни разу» без тяжеловесной пассивной конструкции.
- source_word: λόγος τοιοῦτος
  choice: ничего подобного
  rationale: Идиоматически передаёт «подобное слово/высказывание» в отрицательной конструкции; конкретный характер речи поясняется в сноске.
- source_word: περὶ Σουσάννης
  choice: о Сусанне
  rationale: Сохраняет нейтральное основное значение περί с родительным, не усиливая его до «против Сусанны».
