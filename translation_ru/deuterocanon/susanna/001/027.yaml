    issue: «были глубоко потрясены» передаёт κατῃσχύνθησαν
    rationale: '«Потрясены» говорит о сильном эмоциональном потрясении, но не выражает стыда или посрамления, заключённых в κατῃσχύνθησαν. Следует восстановить этот смысл: «сильно устыдились».'
  - severity: low
    issue: Формулировка сноски «выступили со своим заявлением» менее близка к буквальному «сказали свои слова»
