  verdict: revise
  source_fidelity: Глагол κατῃσχύνθησαν означает «были посрамлены / устыдились», а не просто «были потрясены». В черновике утрачена прямо выраженная реакция стыда. Остальные основные соответствия — «Но когда», «старейшины», «слуги», «о Сусанне» и «никогда не говорили ничего подобного» — верно передают греческий текст и не снимают его смысловой широты.
  naturalness: «Слуги сильно устыдились» — современное литературное и естественное выражение, которое сохраняет библейскую сдержанность. «Произнесли свои слова» допустимо, хотя несколько формально; оно оставлено как близкое к τοὺς λόγους αὐτῶν.
  terminology: «Старейшины» уместно передаёт πρεσβῦται в их общественно-судебной роли. «Слуги» — приемлемая контекстная передача δοῦλοι. Для λόγοι сохранено нейтральное «слова»; сноска отмечает допустимые контекстные оттенки без утверждения, что греческое слово обязательно означает формальное обвинение.
