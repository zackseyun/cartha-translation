  yaml_path: translation/deuterocanon/susanna/001/027.yaml
  text: But when the elders spoke their words[a], the servants were greatly ashamed, because never had such a thing been said about Susanna.
translation:
  language: ru
  text: Но когда старейшины произнесли свои слова[a], слуги сильно устыдились, потому что о Сусанне никогда не говорили ничего подобного.
  philosophy: optimal-equivalence
  footnotes:
