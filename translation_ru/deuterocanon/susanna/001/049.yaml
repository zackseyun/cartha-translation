  yaml_path: translation/deuterocanon/susanna/001/049.yaml
  text: Return to the court, for these men have borne false witness against her.
translation:
  language: ru
  text: Вернитесь в суд, потому что эти люди дали против неё ложные показания.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστρέψατε
  choice: Вернитесь
  rationale: Аористное повелительное наклонение во множественном числе призывает собравшихся возвратиться к прерванному судебному разбирательству. «Вернитесь» ясно и естественно передаёт движение назад.
- source_word: κριτήριον
  choice: суд
  rationale: В данном контексте слово обозначает место или заседание, где производится суд. «Суд» — краткий и понятный современный эквивалент.
- source_word: ψευδῆ
  choice: ложные
  rationale: Слово характеризует свидетельство как не соответствующее истине; в сочетании с русским юридическим выражением естественно передаётся определением «ложные».
- source_word: κατεμαρτύρησαν
  choice: дали показания
  rationale: Глагол обозначает свидетельство против кого-либо. Вместе с ψευδῆ сочетание «дали ложные показания» точно передаёт юридический смысл без архаизации.
- source_word: αὐτῆς
  choice: против неё
  rationale: Родительный падеж при καταμαρτυρέω указывает на лицо, против которого свидетельствовали; русский оборот «против неё» сохраняет эту направленность.
- source_word: οὗτοι
  choice: эти люди
  rationale: Субстантивированное указательное местоимение мужского рода указывает на названных обвинителей. «Эти люди» звучит по-русски естественно и не добавляет отсутствующего в тексте звания.
theological_decisions:
- issue: Судебная формула ложного свидетельства
  choice: дали против неё ложные показания
  alternative: лжесвидетельствовали против неё
  rationale: Выбранная формулировка сохраняет юридический характер обвинения и понятна современному читателю. Вариант «лжесвидетельствовали» сильнее отсылает к традиционной библейской лексике, но менее естественен в современной речи.
translation_notes:
  register: Современный литературный русский язык; тон прямой и достойный, без архаизмов. Причинный союз γάρ передан нейтральным «потому что».
