    reason: lexical_alternative
lexical_decisions:
- source_word: κορασίοις
  choice: служанкам
  rationale: Уменьшительная форма κοράσιον может обозначать девушек или молодых женщин; в данном повествовательном контексте это домашние прислужницы Сусанны. «Служанкам» естественно передаёт их роль, не добавляя явно не указанного возраста.
- source_word: Ἐνέγκατε δή μοι
  choice: Принесите мне
  rationale: Аористный императив от φέρω с частицей δή выражает прямое побуждение; «принесите мне» звучит естественно и соответствует смыслу.
- source_word: ἔλαιον
  choice: масла
  rationale: Греческое слово означает просто «масло». Уточнение «оливковое» вероятно по контексту, но отсутствует в исходном тексте.
- source_word: σμήγματα
  choice: средства для умащения
  rationale: σμήγματα обозначает вещества для натирания или умащения тела, в частности при купании. Выбранная формулировка сохраняет широкий смысл и не сводит их непременно к благовониям, мазям или косметике.
- source_word: θύρας τοῦ παραδείσου
  choice: двери сада
  rationale: παράδεισος здесь — огороженный сад, а θύραι буквально обозначает двери или входные створки. «Двери сада» близко следует греческому тексту и согласуется с частным огороженным пространством.
- source_word: κλείσατε
  choice: закройте
  rationale: Глагол означает закрыть; перевод «заприте» необоснованно добавил бы указание на замок.
- source_word: ὅπως λούσωμαι
  choice: чтобы я искупалась
  rationale: Средний залог λούω указывает на купание самой говорящей. «Чтобы я искупалась» — естественная современная русская формулировка.
