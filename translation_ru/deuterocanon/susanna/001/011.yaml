base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/011.yaml
  text: And when dawn came[a], they would come, stealing away from one another in haste, to see which of them would appear to her first and speak with her.
translation:
  language: ru
  text: Когда наступал рассвет, они приходили, скрываясь друг от друга[a] и спеша узнать, кто из них первым покажется ей и заговорит с ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «крали друг друга». Вероятно, это идиоматическое выражение означает, что они приходили тайком, каждый отдельно, стараясь опередить другого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγίνετο ὄρθρος
  choice: Когда наступал рассвет
  rationale: ὄρθρος означает рассвет, раннее утро; форма имперфекта передаёт повторяющуюся обстановку, поэтому «наступал», а не однократное «наступил».
- source_word: ἐρχόμενοι
  choice: они приходили
  rationale: Причастие включено в русское сказуемое; вместе с имперфектом оно описывает их обычное, повторявшееся действие.
- source_word: ἔκλεπτον ἀλλήλους
  choice: скрываясь друг от друга
  rationale: 'Буквальное значение κλέπτω — «красть», однако здесь взаимная конструкция идиоматически указывает на тайные действия: каждый старался прийти незаметно для другого. Сноска сохраняет сведения о необычной греческой формулировке.'
- source_word: σπεύδοντες
  choice: и спешили
  rationale: σπεύδω выражает поспешность, а в данном контексте также стремление опередить другого.
- source_word: τίς φανήσεται αὐτῇ πρότερος
  choice: кто из них первым покажется ей
  rationale: Сохранена косвенно-вопросительная форма греческого текста и непереходное значение φανήσεται — «покажется, явится».
- source_word: λαλήσει πρὸς αὐτήν
  choice: заговорит с ней
  rationale: λαλέω с πρός обозначает обращённую к человеку речь; «заговорит с ней» естественно передаёт как начало разговора, так и его направленность.
