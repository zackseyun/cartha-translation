lexical_decisions:
- source_word: οἱ δὲ δύο πρεσβύτεροι
  choice: А двое старейшин
  rationale: Слово πρεσβύτεροι обозначает здесь старейшин, обладавших признанным общественным и судебным авторитетом, а не просто пожилых мужчин. Частица δέ передана союзом «а», естественно вводящим их ответ и отмечающим поворот повествования.
- source_word: εἶπαν
  choice: сказали
  rationale: Нейтральный и естественный глагол введения прямой речи, без добавочного оттенка торжественности или официальности.
- source_word: Ἡμεῖς
  choice: мы
  rationale: Явное греческое местоимение несёт лёгкое смысловое ударение; в русской прямой речи оно естественно сохраняется как «мы».
- source_word: περιεπατοῦμεν
  choice: гуляли
  rationale: Имперфект обозначает продолжавшееся в прошлом действие. Русское «гуляли» естественно передаёт хождение по саду, не обязательно подразумевая бесцельность; более буквальное «ходили» здесь звучало бы менее определённо.
- source_word: ἐν τῷ παραδείσῳ
  choice: по саду
  rationale: В данном контексте παράδεισος — ограждённый сад или парк при состоятельном доме. Русское «сад» ясно передаёт местное значение, не вызывая неуместной ассоциации с раем; предлог «по» естественно сочетается с глаголом «гуляли».
- source_word: τοῦ ἀνδρὸς αὐτῆς
  choice: её мужа
  rationale: В этой конструкции ἀνήρ означает мужа; родительный падеж выражает принадлежность сада.
