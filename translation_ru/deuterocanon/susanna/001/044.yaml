lexical_decisions:
- source_word: εἰσήκουσεν
  choice: услышал
  rationale: Глагол может обозначать не только физическое слышание, но и благосклонное внимание к мольбе. «Услышал» естественно передаёт греческий текст и сохраняет подразумеваемый оттенок отклика, не превращая его в прямо высказанное «ответил».
- source_word: Κύριος
  choice: Господь
  rationale: Обычное и уместное русское соответствие греческому божественному титулу Κύριος; написание не создаёт впечатления, будто в данном греческом свидетельстве непосредственно воспроизводится еврейское имя Бога.
- source_word: φωνῆς αὐτῆς
  choice: её голос
  rationale: Буквально и естественно передаёт выражение «её голос». Варианты «её вопль» или «её мольбу» сильнее обозначили бы молитвенный контекст, чем это делает сама формулировка стиха.
theological_decisions:
- issue: Следует ли прямо сказать, что Бог ответил на молитву Сусанны
  choice: «Господь услышал её голос»
  alternative: «Господь ответил на её мольбу»
  rationale: Греческий глагол в этом контексте может подразумевать благосклонное слышание, однако стих прямо говорит о том, что Господь услышал её голос, ещё не уточняя способ ответа. Перевод сохраняет эту сдержанность.
- issue: Передача Κύριος в греческом тексте Второканонической книги
  choice: «Господь»
  alternative: Типографически выделенное обозначение, прямо указывающее на еврейское имя Бога
  rationale: Источник называет Бога греческим титулом Κύριος. «Господь» точно передаёт его, не внося отсутствующего в данном свидетельстве указания на конкретную еврейскую форму имени.
translation_notes:
  register: Краткая, естественная и торжественно-сдержанная фраза современного литературного русского языка. Сохранены простая повествовательная структура оригинала и начальный союз «И».
