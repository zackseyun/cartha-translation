base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/055.yaml
  text: Then Daniel said[a], “You have lied rightly against your own head; for already an angel of God, having received a sentence from God[b], will split you in two.”
translation:
  language: ru
  text: 'Тогда Даниил сказал: «Верно[a] солгал ты на свою же голову: ведь ангел Божий уже получил приговор от Бога[b] и рассечёт тебя надвое».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Правильно солгал ты на свою же голову». Слова, вероятно, ироничны: ложное свидетельство навлекло суд на самого свидетеля.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «решение» либо «повеление от Бога». Греческое слово может означать высказанное постановление или судебный приговор; контекст указывает на судебный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀρθῶς
  choice: верно
  rationale: 'Сохраняет нарочитую иронию: ложь старейшины «верна» в том смысле, что обращает обвинение на его собственную голову.'
- source_word: ἔψευσαι
  choice: солгал ты
  rationale: Прямо и естественно передаёт аорист ψεύδομαι как завершённое ложное свидетельство.
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  choice: на свою же голову
  rationale: Естественный русский идиоматический оборот, сохраняющий конкретный образ последствий, обращающихся против самого говорящего.
- source_word: ἤδη
  choice: уже
  rationale: Передаёт, что исполнение суда уже приведено в движение.
- source_word: ἄγγελος τοῦ θεοῦ
  choice: ангел Божий
  rationale: Естественное библейское выражение; отсутствие артикля не требует в русском языке отдельного показателя неопределённости.
- source_word: λαβὼν φάσιν παρὰ τοῦ θεοῦ
  choice: уже получил приговор от Бога
  rationale: Причастный оборот естественно включён в русское предложение; φάσις в судебном контексте передано как «приговор», при сохранении альтернатив в сноске.
- source_word: σχίσει σε μέσον
  choice: рассечёт тебя надвое
  rationale: Передаёт буквальную суровость σχίζω и уточнение μέσον в dignified, но понятной современной форме.
theological_decisions:
- issue: Характер действия ангела
  choice: Ангел Божий представлен конкретным исполнителем полученного от Бога приговора.
  alternative: Понимать слова лишь как обобщённое возвещение Божьего суда без буквального ангельского исполнения.
  rationale: Греческий текст прямо называет ἄγγελος τοῦ θεοῦ и приписывает ему получение φάσις от Бога, поэтому конкретная агентность должна быть сохранена.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «солгал ты» подчёркивает обвинительный приговор; «рассечёт надвое» сохраняет резкость исходного образа. Все сноски обозначены в основном тексте.
