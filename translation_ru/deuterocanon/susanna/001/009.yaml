  yaml_path: translation/deuterocanon/susanna/001/009.yaml
  text: They twisted their minds and turned away their eyes so as not to look to heaven or remember righteous judgments[a][b].
translation:
  language: ru
  text: Они извратили свой разум[a] и отвели взгляд, чтобы не смотреть на небо и не помнить праведных судов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исказили свой разум». Глагол может обозначать как искажение, так и нравственное извращение.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «справедливых судов». Греческое слово может означать судебные решения, приговоры или правовые установления. Вероятно, подразумеваются суды или установления Бога, хотя в греческом тексте это прямо не сказано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέστρεψαν
  choice: извратили
  rationale: Глагол обозначает искажение и уклонение от должного состояния, в данном контексте — нравственное извращение внутреннего восприятия.
- source_word: τὸν νοῦν αὐτῶν
  choice: свой разум
  rationale: νοῦς здесь обозначает способность мыслить и нравственно воспринимать; возвратное «свой» естественно по-русски соотносит разум с подлежащим.
- source_word: ἐξέκλιναν τοὺς ὀφθαλμοὺς αὐτῶν
  choice: отвели глаза
  rationale: Передаёт конкретный образ намеренного отведения взгляда и звучит естественно в современном русском языке.
- source_word: τοῦ μὴ βλέπειν εἰς τὸν οὐρανόν
  choice: чтобы не смотреть на небо
  rationale: Передаёт целевое значение конструкции с артиклевым инфинитивом и μή, не добавляя прямо не названного упоминания Бога.
- source_word: μηδὲ μνημονεύειν
  choice: и не вспоминать
  rationale: Сохраняет координацию двух намеренных отказов и основное значение глагола — помнить, вспоминать.
- source_word: κριμάτων δικαίων
  choice: о праведных судах
  rationale: «Суды» сохраняет судебно-нравственный диапазон κρίματα, а «праведных» передаёт δικαίων в узнаваемой библейской, но не архаичной форме.
theological_decisions:
- issue: Подразумеваемая связь неба и праведных судов с Богом
  choice: Сохранены выражения «на небо» и «о праведных судах» без добавления притяжательного «Божьих».
  alternative: «Чтобы не смотреть к Богу и не вспоминать о Его праведных судах» или «о Божьих праведных судах».
  rationale: Контекст подразумевает Бога, однако в греческом тексте Он здесь прямо не назван и притяжательное определение отсутствует; перевод не должен устранять эту неявность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис остаётся ясным и прямым; образ отведённых глаз и богословская неявность исходного текста сохранены.
