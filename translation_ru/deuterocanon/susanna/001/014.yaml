lexical_decisions:
- source_word: ἕτερος τῷ ἑτέρῳ
  choice: один другому
  rationale: Передаёт взаимное обращение двух мужчин естественной русской формулой; глагол речи в греческом фрагменте подразумевается и не добавляется без необходимости.
- source_word: Πορευθῶμεν δὴ εἰς οἶκον
  choice: Пойдём же домой
  rationale: Сослагательная форма первого лица множественного числа выражает совместное побуждение; δὴ передано частицей «же», а εἰς οἶκον — естественным русским «домой».
- source_word: ἀρίστου ὥρα
  choice: время обеда
  rationale: ἄριστον обозначает дневную трапезу; современное «обед» здесь естественнее и точнее по регистру, чем «полуденная трапеза» или разговорное «ланч».
- source_word: ἐστίν
  choice: настало
  rationale: В сочетании с указанием времени русское «настало время» идиоматично передаёт смысл «сейчас время».
