lexical_decisions:
- source_word: ἐξωμολογήσαντο
  choice: признался
  rationale: В данном контексте взаимного раскрытия скрываемого чувства глагол естественно передаётся как «признался».
- source_word: πρὸς ἀλλήλους
  choice: другому
  rationale: В сочетании с ἑκάτερος взаимное значение естественно выражено по-русски конструкцией «каждый … другому».
- source_word: ἑκάτερος
  choice: каждый
  rationale: Указывает на каждого из двух участников по отдельности.
- source_word: τὴν ὀδύνην αὐτοῦ
  choice: в своих мучениях
  rationale: ὀδύνη обозначает сильную внутреннюю боль или терзание; множественное «мучениях» звучит естественно по-русски, а «своих» сохраняет соотнесённость переживания с каждым из двоих.
