lexical_decisions:
- source_word: ἦν δὲ
  choice: была
  rationale: δέ — слабый повествовательный связующий союз; в отдельном русском стихе его лучше не передавать явно, чтобы не создавать чрезмерного противопоставления или временного оттенка.
- source_word: ἡ γυνή
  choice: женщина
  rationale: γυνή может означать «женщина» или «жена»; здесь описывается сама Сусанна, а не подчёркиваются её отношения с мужем.
- source_word: τρυφερά
  choice: нежна
  rationale: Прилагательное передаёт мягкость, утончённость и изнеженную красоту; «нежна» естественно звучит по-русски и не приписывает Сусанне нравственной слабости.
- source_word: σφόδρα
  choice: необычайно
  rationale: Сильная степень признака передана выразительным, но современным русским наречием.
