lexical_decisions:
- source_word: ἐκ τῶν
  choice: Из
  rationale: Оборот вводит представителей отдельной группы в составе более широкого перечня; русское «из» естественно передаёт эту функцию.
- source_word: ἱεροψαλτῶν
  choice: храмовых певцов
  rationale: Сложное слово обозначает певцов, связанных со священным, храмовым служением; этот вариант ясен современному читателю и сохраняет культовый контекст.
- source_word: Ἐλιάσεβος
  choice: Елиасив
  rationale: Имя передано по греческой форме с учётом привычной русской библейской передачи; соответствующая еврейская форма отмечена в сноске.
- source_word: Βάκχουρος
  choice: Вакхур
  rationale: Транслитерация греческого имени без предположительного сведения к не засвидетельствованному здесь еврейскому соответствию.
