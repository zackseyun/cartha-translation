  terminology: «Храмовый двор» удачно передаёт αὐλή τοῦ ἱεροῦ, а «помещение» — παστοφόριον. Сноска корректно отмечает расхождение с приблизительным еврейским параллельным местом, не подменяя греческие имена в основном тексте.
