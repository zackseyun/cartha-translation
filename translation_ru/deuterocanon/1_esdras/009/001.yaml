  source_fidelity: 'Греч. Καὶ ἀναστὰς ... ἐπορεύθη εἰς точно передаёт последовательность «встав ... пошёл в». Имена в основном тексте верно следуют первичному греческому тексту: Ἰωνᾶ τοῦ Νασείβου — «Ионы, сына Насива». Однако «вышел со двора ... и пошёл в» несколько усиливает значение ἀπό («из, от») до отдельного действия выхода; нейтральнее передать исходный пункт движения как «из храмового двора».'
