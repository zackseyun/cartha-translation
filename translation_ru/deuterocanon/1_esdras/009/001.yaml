  yaml_path: translation/deuterocanon/1_esdras/009/001.yaml
  text: Then Ezra rose up from the court of the temple and went into the chamber of Jona son of Naseib[b][a],
translation:
  language: ru
  text: Встав, Ездра пошёл из храмового двора в помещение Ионы, сына Насива.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Ионы, сына Насива». В еврейском параллельном месте, Езд. 10:6, назван Иоханан, сын Елиашива.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀναστὰς
  choice: встав
  rationale: Аористное причастие вводит следующее действие; деепричастие естественно передаёт последовательность событий по-русски.
- source_word: ἀπὸ τῆς αὐλῆς τοῦ ἱεροῦ
  choice: вышел со двора храма
  rationale: αὐλή означает двор храмового комплекса, а ἱερόν — храм в широком смысле. Глагол «вышел» естественно выражает движение от двора, подразумеваемое сочетанием ἐπορεύθη ἀπό.
- source_word: ἐπορεύθη
  choice: пошёл
  rationale: Прямой и естественный повествовательный эквивалент глагола движения.
- source_word: παστοφόριον
  choice: комната
  rationale: Слово обозначает отдельное помещение при храмовом или ином здании; «комната» понятно современному читателю и не навязывает более узкого назначения вроде кладовой.
- source_word: Ἰωνᾶ τοῦ Νασείβου
  choice: Ионы, сына Насива
  rationale: Основной текст следует засвидетельствованным греческим именам, не подменяя их именами из еврейского параллельного места; расхождение отмечено в сноске.
