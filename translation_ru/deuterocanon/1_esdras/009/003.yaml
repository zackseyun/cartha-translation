base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/003.yaml
  text: And a proclamation was made throughout all Judea and Jerusalem to all those from the captivity[a], to assemble in Jerusalem.
translation:
  language: ru
  text: И по всей Иудее и в Иерусалиме было объявлено всем бывшим в плену[a], чтобы они собрались в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всем тем, кто из плена». Возможные передачи: «всем изгнанникам» или «всем вернувшимся изгнанникам»; последнее уточнение подразумевается контекстом, но прямо не выражено в греческом тексте.'
    reason: Греческое выражение обозначает адресатов как людей «из плена», не называя непосредственно их возвращение.
lexical_decisions:
- source_word: ἐγένετο κήρυγμα
  choice: объявили
  rationale: Греческое сочетание буквально означает, что было сделано публичное объявление. Неопределённо-личная конструкция естественна по-русски и не приписывает действие не названному в тексте лицу; «издали указ» чрезмерно усилило бы официальный оттенок κήρυγμα.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: по всей Иудее и в Иерусалиме
  rationale: Передаёт распространение объявления по всей области и в городе. Разные предлоги нужны для естественного русского выражения, хотя в греческом стоит один ἐν.
- source_word: πᾶσι τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: всем возвратившимся из плена
  rationale: 'Буквально: «всем тем, кто из плена». В контексте это люди, уже находящиеся в Иудее и Иерусалиме, поэтому «возвратившимся» естественно раскрывает подразумеваемое движение, а примечание сохраняет формальную неоднозначность.'
- source_word: συναχθῆναι
  choice: чтобы они собрались
  rationale: Пассивный аористный инфинитив передаёт содержание объявления. Русская возвратная форма естественно выражает созыв на общее собрание, не навязывая внешнего деятеля.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: При русском глаголе «собраться» место итогового собрания естественно обозначается предложным падежом; направительное значение εἰς остаётся понятным из призыва прибыть туда.
