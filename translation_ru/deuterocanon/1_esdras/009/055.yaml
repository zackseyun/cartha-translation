base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/055.yaml
  text: For they were also instructed in the words that they had been taught[b][a], and they were assembled.
translation:
  language: ru
  text: Ибо они также прониклись словами, которым их учили[a][b], и были собраны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол, переданный словами «прониклись», здесь редок и не вполне ясен. Его можно также понимать как «были наполнены» или «были вдохновлены».
    reason: lexical_alternative
  - marker: b
    text: В еврейском параллельном месте, Неемия 8:13, сказано более прямо, что главы семейств, священники и левиты собрались к книжнику Ездре, чтобы вникнуть в слова закона. В 1 Ездры эта сцена передана в сжатой греческой форме.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: Союз вводит пояснение или основание; «ибо» кратко и естественно передаёт эту связь в данном повествовательном контексте.
- source_word: καὶ
  choice: также
  rationale: Передаёт присоединительное значение частицы по отношению к предшествующему повествованию.
- source_word: ἐνεφυσιώθησαν
  choice: прониклись
  rationale: Редкий и не вполне ясный глагол, вероятно, выражает образ внутреннего наполнения или воодушевления. «Прониклись» сохраняет этот образ и избегает более богословски нагруженного «были вдохновлены»; значение наставления не подменяет сам греческий глагол, а поясняется параллельным еврейским текстом в сноске.
- source_word: ἐν τοῖς ῥήμασιν
  choice: словами
  rationale: Творительная конструкция по-русски естественно сочетается с «прониклись» и передаёт ἐν как сферу или средство воздействия; ῥήματα здесь означает произнесённые или преподанные слова.
- source_word: οἷς ἐδιδάχθησαν
  choice: которым были научены
  rationale: Сохранены относительное придаточное и страдательная форма; выражение относится к содержанию полученного наставления.
- source_word: ἐπισυνήχθησαν
  choice: были собраны вместе
  rationale: Сохранены страдательный залог греческой формы и усилительное значение приставки ἐπι-; оборот остаётся понятным по-русски.
theological_decisions:
- issue: Возможный оттенок вдохновения в ἐνεφυσιώθησαν
  choice: прониклись
  alternative: были вдохновлены
  rationale: «Были вдохновлены» может ненамеренно вызвать представление о техническом богословском понятии богодухновенности. «Прониклись» сохраняет внутреннее воздействие слов, не закрепляя такую интерпретацию.
- issue: Соотношение греческого текста с еврейским параллельным местом
  choice: Греческая формулировка оставлена основой перевода, а еврейское свидетельство вынесено в сноску
  alternative: 'Перевести по смыслу еврейского параллельного текста: «собрались, чтобы вникнуть в слова закона»'
  rationale: Параллель полезна для понимания сцены, но заметно прямее и подробнее греческой формы; замена ею греческого текста устранила бы его подлинную сжатость и лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Ибо» поддерживает достоинство повествования, а необычность сочетания «прониклись словами» намеренно отражает необычность исходного греческого глагола. Страдательная форма заключительного глагола сохранена.
