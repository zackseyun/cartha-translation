base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/008.yaml
  text: And now give confession and glory to the Lord God of our fathers[b][a],
translation:
  language: ru
  text: И теперь принесите исповедание[a] и славу Господу, Богу наших отцов.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признание». Греческое ὁμολογία может означать как исповедание, так и признание; здесь предпочтено «исповедание» ввиду покаянного контекста.'
    reason: lexical_alternative
  - marker: b
    text: Греческий текст этого стиха короче более полного древнееврейского параллельного места в книге Ездры; перевод следует греческой формулировке.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ νῦν
  choice: И теперь
  rationale: Сохраняет соединительный союз и временной переход, не усиливая его до вывода вроде «итак».
- source_word: δότε
  choice: принесите
  rationale: Буквально глагол означает «дайте», однако по-русски с существительными «исповедание» и «слава» естественнее религиозно-культовое «принесите»; значение повеления во множественном числе сохранено.
- source_word: ὁμολογίαν
  choice: исповедание
  rationale: Слово допускает значения признания и исповедания. Покаянный контекст поддерживает «исповедание», а сноска сохраняет более широкую лексическую возможность.
- source_word: δόξαν
  choice: славу
  rationale: «Слава» сохраняет обычную библейскую формулу прославления Бога и точнее передаёт δόξα, чем более общее «честь».
- source_word: τῷ κυρίῳ
  choice: Господу
  rationale: В данном иудейском библейском контексте κύριος обозначает Бога Израиля; традиционное и точное соответствие — «Господь».
- source_word: θεῷ τῶν πατέρων ἡμῶν
  choice: Богу наших отцов
  rationale: Сохранена традиционная заветная формула и явно мужская форма исходного текста; «предков» возможно, но менее точно воспроизводит устойчивый библейский оборот.
theological_decisions:
- issue: Значение ὁμολογίαν в покаянном контексте
  choice: исповедание
  alternative: признание
  rationale: Контекст призыва признать неверность завету придаёт слову покаянный оттенок. При этом возможное более широкое значение не устраняется, а отмечается в сноске.
- issue: Передача πατέρων
  choice: отцов
  alternative: предков
  rationale: Исходный текст употребляет явно мужское обозначение в устойчивой формуле «Бог наших отцов»; нейтрализация не требуется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формула «Господу, Богу наших отцов» сохранена как узнаваемый заветный оборот; синтаксис остаётся ясным для современного читателя.
