base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/049.yaml
  text: 'And Attarates said to Ezra the chief priest and reader[a], and to the Levites who were teaching the multitude[b], to all of them:'
translation:
  language: ru
  text: 'И сказал Аттарат[a] Ездре — первосвященнику и чтецу[b] — и левитам, наставлявшим народ, — всем им:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Аттарат, вероятно, соответствует лицу, названному в еврейском параллельном тексте «Неемией, тиршафой»; тиршафа — титул правителя.
    reason: alternative_reading
  - marker: b
    text: Греч. «чтец»; в еврейском параллельном тексте Ездра назван «священником, книжником».
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἶπεν
  choice: И сказал
  rationale: Сохраняет обычную для греческого повествования связь с предшествующим текстом, не уточняя сверх источника временную последовательность.
- source_word: Ἀτταρατὴ
  choice: Аттарат
  rationale: В основном тексте сохранена передача греческой формы имени или титула; отождествление с Неемией из еврейского параллельного текста вынесено в сноску.
- source_word: Ἔσρᾳ
  choice: Ездре
  rationale: Устоявшаяся русская форма библейского имени, поставленная в дательном падеже согласно греческому тексту.
- source_word: τῷ ἀρχιερεῖ
  choice: первосвященнику
  rationale: Естественный и точный русский эквивалент ἀρχιερεύς; отличие от еврейского параллельного текста, где стоит просто «священник», не переносится в основной текст.
- source_word: ἀναγνώστῃ
  choice: чтецу
  rationale: Передаёт прямое значение греческого слова — того, кто читает текст, вероятно вслух; еврейское «книжник» отмечено отдельно.
- source_word: τοῖς Λευείταις τοῖς διδάσκουσι τὸ πλῆθος
  choice: левитам, наставлявшим народ
  rationale: Причастие передано как характеристика продолжавшегося действия; «народ» естественно обозначает собравшееся множество в данном контексте.
- source_word: ἐπὶ πάντας
  choice: всем им
  rationale: Фраза в сохранившемся греческом тексте синтаксически шероховата. Такое прочтение сохраняет обобщение адресатов и согласуется с параллельным еврейским «всему народу», не подменяя им греческий текст.
theological_decisions:
- issue: Отождествление Ἀτταρατὴ с лицом, названным в масоретском параллельном тексте
  choice: Сохранить в основном тексте греческую форму «Аттарат», а возможное отождествление с Неемией-правителем указать в сноске.
  alternative: Заменить в основном тексте на «Неемия, правитель» или передать как титул «Тиршафа».
  rationale: Для 1 Ездры первичным свидетелем служит греческий текст. Еврейская параллель важна, но не должна молча заменять отличающееся греческое чтение.
- issue: Обозначение роли Ездры
  choice: Передать греческое ἀναγνώστης как «чтец».
  alternative: Следуя еврейскому параллельному тексту, перевести «книжник».
  rationale: Так сохраняется реальное различие между греческой и еврейской формами текста без искусственного согласования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Двоеточие сохраняет незавершённость вводной формулы перед последующей прямой речью; тире помогает естественно присоединить греческое обобщение ἐπὶ πάντας.
