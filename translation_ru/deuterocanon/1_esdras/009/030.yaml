base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/030.yaml
  text: 'And from the sons of Mani: Olamus[a], Mamuchus, Jedaeus, Jasubus, Asael[b], and Jeremoth.'
translation:
  language: ru
  text: 'И из сыновей Мани[a]: Олам, Мамух, Иедай, Иасув, Асаил[b] и Иеремоф.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — Мани; в параллельном списке книги Ездры это имя обычно сопоставляют с Вани.
    reason: alternative_reading
  - marker: b
    text: Некоторые имена в этом перечне, вероятно, соответствуют еврейским формам, известным по параллельному списку, однако здесь они переданы по греческому тексту 1 Ездры как основному источнику.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохранена соединительная функция союза, продолжающего перечень.
- source_word: ἐκ τῶν υἱῶν
  choice: из сыновей
  rationale: Естественная русская формула, обозначающая принадлежность названных людей к роду или семейству.
- source_word: Μανί
  choice: Мани
  rationale: Имя передано непосредственно по греческому тексту, без согласования с предполагаемой еврейской параллелью.
- source_word: Ὤλαμος
  choice: Олам
  rationale: Греческая форма имени передана по-русски с опущением греческого окончания именительного падежа.
- source_word: Μάμουχος
  choice: Мамух
  rationale: Транслитерация греческой формы с опущением окончания -ος; не заменена возможным еврейским соответствием.
- source_word: Ἰεδαῖος
  choice: Иедей
  rationale: Русская передача греческой формы имени, сохраняющая её отличие от возможных соответствий в параллельном списке.
- source_word: Ἰάσουβος
  choice: Иасув
  rationale: Имя передано по греческой форме; конечное -ος опущено, а β передано как «в» согласно традиционной русской передаче библейских греческих имён.
- source_word: Ἀσάηλος
  choice: Асаил
  rationale: Использована естественная для русской библейской ономастики передача греческого имени с опущением окончания -ος.
- source_word: Ἰερεμώθ
  choice: Иеремоф
  rationale: Прямая русская передача греческой формы, включая традиционное соответствие θ — «ф».
