base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/043.yaml
  text: And Mattathias[a], Sammou, Ananias, Azarias, Ourias, Ezekias, and Baalsamos stood at his right hand,
translation:
  language: ru
  text: И справа от него встали Маттафия[a], Саммуй, Анания, Азария, Урия, Езекия и Ваалсам,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте имена здесь отличаются от имён в приблизительном еврейском параллельном месте — Неемии 8:4, где список стоящих справа от Ездры не совпадает с этим списком. Поскольку 1 Ездры переводится с греческого текста, здесь сохранены греческие формы имён.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησεν
  choice: встали
  rationale: Хотя форма глагола внешне допускает переходное значение «поставил», перечисление лиц в именительном падеже и указание места естественно передаются как «встали». Множественное число согласовано со всем рядом имён.
- source_word: αὐτῷ
  choice: от него
  rationale: 'Дательный местоимения в сочетании с ἐκ δεξιῶν указывает на лицо, относительно которого определяется положение: «справа от него».'
- source_word: ἐκ δεξιῶν
  choice: справа
  rationale: Современное и точное пространственное выражение; оно сохраняет смысл нахождения по правую сторону, не добавляя переносного значения.
- source_word: Ματταθίας, Σαμμοῦ, Ἀνανίας, Ἀζαρίας, Οὐρείας, Ἐζεκίας, Βαάλσαμος
  choice: Маттафия, Саммуй, Анания, Азария, Урия, Езекия и Ваалсам
  rationale: Имена переданы по греческому тексту 1 Ездры в формах, естественных для русской библейской традиции, без замены именами из приблизительного еврейского параллельного места.
