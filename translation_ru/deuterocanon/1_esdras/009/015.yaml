  yaml_path: translation/deuterocanon/1_esdras/009/015.yaml
  text: And those from the captivity did all these things[a].
translation:
  language: ru
  text: И те, кто был в плену, сделали всё это[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «те, кто из плена». Речь идёт о возвратившейся из плена общине; выражение «сделали всё это» передаёт также смысл: «поступили согласно всему этому».'
    reason: Сноска поясняет буквальную форму греческого выражения οἱ ἐκ τῆς αἰχμαλωσίας и значение оборота κατὰ πάντα ταῦτα, не внося это уточнение в основной текст.
lexical_decisions:
- source_word: ἐποίησαν
  choice: сделали
  rationale: Глагол ποιέω в сочетании с последующим оборотом обозначает совершение упомянутых ранее действий; «сделали» естественно передаёт это значение.
- source_word: κατὰ πάντα ταῦτα
  choice: всё это
  rationale: Оборот отсылает ко всем только что описанным действиям. Русское «сделали всё это» передаёт и полноту πάντα, и указательное значение ταῦτα, не воспроизводя неестественно греческую конструкцию с κατά.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: вышедшие из плена
  rationale: Греческое выражение буквально обозначает людей «из плена». Формулировка «вышедшие из плена» сохраняет образ исхода из плена и остаётся понятной современному читателю, не заменяя его более толковательным обозначением общины возвратившихся изгнанников.
