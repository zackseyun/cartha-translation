base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/023.yaml
  text: 'And from the Levites: Jozabad[a], Seneis, Konos (that is, Kalitais), and Pathaios[c][b], and Judas and Jonas.'
translation:
  language: ru
  text: А из левитов — Иозавад, Сенеис, Конос (он же Калитаис)[a], Пафайос[b], Иуда и Иона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «этот — Калитаис». Вероятно, Калитаис — другое имя Коноса.'
    reason: alternative_reading
  - marker: b
    text: 'Написание некоторых редких имён, в том числе имени Пафайос, не вполне уверенно: исходная транскрипция отмечена как имеющая небольшое расхождение. Здесь передана форма данного греческого текста.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν Λευειτῶν
  choice: из левитов
  rationale: Сохраняет разделительное значение ἐκ и естественно вводит следующую группу в перечне.
- source_word: Ἰωζάβαδος
  choice: Иозавад
  rationale: Передаёт греческую форму имени в привычном для русской библейской традиции виде, без конечного греческого окончания -ος.
- source_word: Σενεεὶς
  choice: Сенеис
  rationale: Близкая транслитерация редкого греческого имени; необычная форма сохранена, поскольку надёжного общеупотребительного русского соответствия нет.
- source_word: Κῶνος
  choice: Конос
  rationale: Прямая и понятная передача греческой формы имени.
- source_word: οὗτος Καλιταίς
  choice: он же Калитаис
  rationale: Естественно по-русски передаёт пояснительное отождествление, вероятно указывающее на другое имя того же человека, не превращая это предположение в безусловное утверждение.
- source_word: Παθαῖος
  choice: Пафайос
  rationale: Транслитерация греческого имени с передачей θ через «ф» и αι через «ай»; греческое свидетельство предпочтено предположительному семитскому соответствию.
- source_word: Ἰούδας
  choice: Иуда
  rationale: Устоявшаяся русская передача греческого личного имени Ἰούδας.
- source_word: Ἰωνάς
  choice: Иона
  rationale: Устоявшаяся русская библейская форма имени, соответствующая греческому Ἰωνάς.
theological_decisions:
- issue: Характер связи между Коносом и Калитаисом
  choice: «Конос (он же Калитаис)» с примечанием
  alternative: «Конос, этот Калитаис» или перечисление их как двух лиц
  rationale: οὗτος, по-видимому, пояснительно отождествляет два имени, однако краткость греческой конструкции оставляет некоторую неоднозначность; она отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким синтаксисом перечня. Имена переданы преимущественно с греческого; для широко известных библейских имён Иуда и Иона использованы устоявшиеся русские формы. Повторяющийся союз καί сглажен в естественное русское перечисление без изменения состава списка.
