base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/020.yaml
  text: and they pledged themselves to send away their wives[a], and for atonement[b], rams for their ignorance.
translation:
  language: ru
  text: И они обязались отослать своих жён[a] и принести баранов для искупления за своё неведение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возложили руки, чтобы отослать своих жён»; это выражение означает, что они взяли на себя такое обязательство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «за своё неведение»; в контексте жертвы это может подразумевать проступок или грех, совершённый по неведению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας
  choice: обязались
  rationale: Буквально оборот говорит о возложении рук, но с последующим инфинитивом выражает принятие обязательства; буквальный образ в русском был бы неясен или ошибочно понят как физическое действие над жёнами.
- source_word: ἐκβαλεῖν
  choice: отослать
  rationale: В брачном контексте глагол означает удалить или отпустить жену; «отослать» передаёт разрыв совместной жизни без излишне резкого «изгнать».
- source_word: τὰς γυναῖκας αὐτῶν
  choice: своих жён
  rationale: Здесь γυναῖκες обозначает супруг, что подтверждается контекстом и еврейской параллелью.
- source_word: εἰς ἐξιλασμόν
  choice: для искупления
  rationale: Передаёт цель жертвоприношения и естественно звучит в современном русском библейском регистре.
- source_word: κριούς
  choice: баранов
  rationale: Сохраняет конкретный вид и число жертвенных животных.
- source_word: ὑπὲρ τῆς ἀγνοίας αὐτῶν
  choice: за свой грех, совершённый по неведению
  rationale: ἀγνοία буквально означает неведение, но в жертвенном контексте обозначает проступок, совершённый без осознания; развёрнутая формулировка делает этот культовый смысл понятным, не превращая его в умышленный грех.
theological_decisions:
- issue: Жертвенный смысл ἀγνοία
  choice: грех, совершённый по неведению
  alternative: неведение; заблуждение; неумышленный грех
  rationale: Контекст искупительной жертвы указывает не просто на недостаток знания, а на вину за проступок по неведению. Формулировка сохраняет как нравственно-культовый смысл, так и указание на отсутствие осознанного намерения.
- issue: Идиоматический смысл ἐπέβαλον τὰς χεῖρας
  choice: обязались
  alternative: возложили руки; взялись
  rationale: Оборот означает принятое обязательство осуществить последующее действие. Буквальный перевод мог бы создать ложное впечатление, будто руки возлагали на жён.
- issue: Эллипсис перед κριούς
  choice: явно добавить «принести»
  alternative: 'сохранить эллипсис: «и для искупления — баранов»'
  rationale: В греческом глагол жертвоприношения подразумевается. В русском его восстановление необходимо для ясной и естественной фразы и не добавляет нового богословского содержания.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Греческий эллипсис раскрыт глаголом «принести» ради ясности. «Обязались» естественно передаёт идиому, а примечания сохраняют доступ к буквальной форме и лексической неоднозначности.
