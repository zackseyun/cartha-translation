base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/005.yaml
  text: And those from the tribe of Judah and Benjamin were gathered in Jerusalem within three days; it was the ninth month[a], on the twentieth day of the month.
translation:
  language: ru
  text: За три дня в Иерусалиме собрались те, кто принадлежал к колену Иуды и Вениамина[a]. Это было в девятом месяце, в двадцатый день месяца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте слово «колено» стоит в единственном числе при именах Иуды и Вениамина; смысл выражения — люди, принадлежавшие к Иуде и Вениамину. В параллельном месте Езд 10:9 сказано: «все мужчины Иуды и Вениамина собрались в Иерусалиме за три дня».'
    reason: Текстовая особенность и ссылка на параллельное место поясняют необычную грамматику греческого источника, не исправляя её молча.
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: собрались
  rationale: Греческая пассивная форма буквально допускает «были собраны», однако в русском языке возвратное «собрались» естественно передаёт совместное прибытие людей, не уточняя внешнего деятеля.
- source_word: οἱ ἐκ τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: те, кто был из колена Иуды и Вениамина
  rationale: Сохранено необычное единственное число φυλῆς при двух именах; нейтральное «те, кто» не добавляет отсутствующего в греческом прямого указания на мужчин.
- source_word: ἐν τρισὶν ἡμέραις
  choice: в течение трёх дней
  rationale: Передаёт временной предел или период, не превращая выражение в однозначное «на третий день».
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: Предлог εἰς выражает направление движения; русский оборот «собрались в Иерусалим» сохраняет эту направленность.
- source_word: οὗτος ὁ μὴν ἔνατος
  choice: Это был девятый месяц
  rationale: Естественная временная формула, близкая к структуре греческого текста.
- source_word: τῇ εἰκάδι τοῦ μηνός
  choice: двадцатый день месяца
  rationale: εἰκάς обозначает двадцатый день; конструкция согласована с предыдущей именной временной формулой.
