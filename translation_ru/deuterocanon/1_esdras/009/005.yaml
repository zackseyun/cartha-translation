  verdict: revise
  source_fidelity: 'Греческий текст передан в целом точно: сохранены пассивно-собирательный смысл ἐπισυνήχθησαν, необычное единственное число «колено» при именах Иуды и Вениамина, трёхдневный срок и датировка девятым месяцем, двадцатым днём. Однако «собрались в Иерусалим» не является нормативным современным русским употреблением; направление εἰς в русском естественно выражается самим контекстом прибытия, тогда как место собрания следует обозначить формой «в Иерусалиме».'
