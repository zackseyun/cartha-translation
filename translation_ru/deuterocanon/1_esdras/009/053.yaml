base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/053.yaml
  text: And the Levites kept instructing all the people[a], saying, “This day is holy; do not grieve.”
translation:
  language: ru
  text: 'И левиты наставляли весь народ, говоря: «Этот день свят; не печальтесь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не скорбите»; возможно: «не плачьте».'
    reason: Лексема λυπέω допускает оттенки печали, скорби и плача; основной текст сохраняет более широкое эмоциональное значение.
lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: левиты
  rationale: Традиционное и общепонятное русское обозначение данной культовой группы.
- source_word: ἐκέλευον
  choice: наставляли
  rationale: Имперфект передаёт продолжающееся или повторявшееся действие. В данном контексте наставления народу этот вариант естественно передаёт настойчивое указание, не усиливая его до резкого приказа.
- source_word: τῷ δήμῳ πάντα
  choice: весь народ
  rationale: δήμος означает народ или собравшееся общество; πάντα здесь естественно понимать как указание на полноту охвата.
- source_word: λέγοντες
  choice: говоря
  rationale: Прямой и естественный способ ввести последующую прямую речь.
- source_word: Ἡ ἡμέρα αὕτη ἁγία
  choice: Этот день свят
  rationale: Сохраняет указательное значение αὕτη и обычное библейское значение ἁγία, при этом звучит естественно по-русски.
- source_word: μὴ λυπεῖσθε
  choice: не печальтесь
  rationale: Передаёт эмоциональное значение глагола λυπέω в форме запрета; выражение современно, понятно и не сужает смысл исключительно до ритуального плача.
