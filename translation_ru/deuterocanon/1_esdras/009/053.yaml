  source_fidelity: 'Текст точно передаёт греческий оригинал: οἱ Λευεῖται — «левиты», имперфект ἐκέλευον адекватно отражён глаголом «наставляли» в контексте публичного обращения, τῷ δήμῳ πάντα — «весь народ», а прямое увещание сохранено без смысловых добавлений. «Этот день свят» точно передаёт Ἡ ἡμέρα αὕτη ἁγία.'
