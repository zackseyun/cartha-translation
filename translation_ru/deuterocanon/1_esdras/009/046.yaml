  source_fidelity: 'Текст точно передаёт греческий оригинал: временной оборот ἐν τῷ λῦσαι передан как «Когда раскрыли», τὸν νόμον — «Закон», а подчёркнутая ὀρθοί поза сохранена в «встали во весь рост». Передача цепочки титулов «Всевышнего Бога, Бога Воинств, Вседержителя» следует греческому тексту и, в отличие от английской аудиторской формулировки, не добавляет отсутствующее κύριος («Господь»).'
