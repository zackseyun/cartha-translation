base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/046.yaml
  text: And when the law was read[a], they all stood upright; and Azarias blessed the Most High God, the Lord of hosts, the Almighty[c][b],
translation:
  language: ru
  text: Когда раскрыли Закон[a], все встали во весь рост; и Азария благословил Всевышнего Бога, Бога Воинств[b], Вседержителя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда развернули Закон». Греческий глагол буквально означает «развязать, освободить» и здесь относится к раскрытию свитка для публичного чтения.'
    reason: lexical_alternative
  - marker: b
    text: Греческое Саваоф — традиционный божественный титул, здесь переведённый по смыслу как «Воинств».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ λῦσαι
  choice: когда раскрыли
  rationale: Оборот с артиклем и инфинитивом выражает время. λύω буквально означает «развязывать, освобождать», но применительно к свитку Закона естественно передаётся как «раскрыть, развернуть». Это сохраняет предметный образ греческого текста и лучше соответствует сцене публичного чтения, чем контекстуально возможное, но менее буквальное «когда читали».
- source_word: τὸν νόμον
  choice: Закон
  rationale: Здесь имеется в виду Тора, публично раскрытая перед народом. Написание с прописной буквы естественно для обозначения конкретного священного Закона; добавление слова «книга» отсутствует в греческом.
- source_word: πάντες ὀρθοὶ ἔστησαν
  choice: все встали во весь рост
  rationale: ὀρθοί уточняет не только положение стоя, но и выпрямленную позу. Русское выражение «встали во весь рост» ясно и естественно передаёт этот оттенок.
- source_word: εὐλόγησεν
  choice: благословил
  rationale: Глагол может означать как благословение, так и хвалу. Формулировка «благословил Бога» допустима в библейском русском языке и сохраняет смысловую напряжённость оригинала, не заменяя её более однозначным «восхвалил».
- source_word: Ἀζαρίας
  choice: Азария
  rationale: Общеупотребительная русская библейская форма имени естественно передаёт греческое Ἀζαρίας; соответствующая еврейская форма עֲזַרְיָה по-русски передаётся так же.
- source_word: τῷ ὑψίστῳ θεῷ
  choice: Всевышнего Бога
  rationale: Естественная современная русская передача устойчивого божественного титула с сохранением порядка определений, близкого к греческому.
- source_word: σαβαὼθ
  choice: Бога Воинств
  rationale: Семантический перевод передаёт значение традиционно транслитерируемого титула «Саваоф». Слово «Бога» служит в русском связующим элементом в цепочке приложений, не вводя отсутствующий в греческом титул «Господь».
- source_word: Παντοκράτορι
  choice: Вседержителя
  rationale: «Вседержитель» — точный, понятный и укоренённый в русском библейском употреблении эквивалент παντοκράτωρ.
theological_decisions:
- issue: Передача последовательности τῷ ὑψίστῳ θεῷ σαβαὼθ Παντοκράτορι
  choice: Всевышнего Бога, Бога Воинств, Вседержителя
  alternative: Всевышнего Бога Саваофа, Вседержителя
  rationale: Греческий текст соединяет несколько божественных наименований без слова κύριος. Выбранная формулировка сохраняет их накопление, переводит σαβαώθ по смыслу и не добавляет титул «Господь», которого в исходном тексте нет.
- issue: Значение εὐλόγησεν при дополнении «Бог»
  choice: благословил
  alternative: восхвалил
  rationale: Оригинал допускает понимание благословения Бога как прославляющей речи. Более формальное «благословил» сохраняет эту традиционную библейскую формулу и не устраняет её смысловое напряжение.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Формы «Закон», «Всевышний» и «Вседержитель» узнаваемы, но не архаичны. Выражение «встали во весь рост» передаёт подчёркнутую греческим прилагательным выпрямленную позу. Все примечания имеют соответствующие маркеры в основном тексте.
