base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/021.yaml
  text: 'And from the sons of Emer: Ananias, Zabdaios, Manes, Thamaios, Jerel, and Azarias.'
translation:
  language: ru
  text: 'И из сыновей Эмера: Анания, Забдай, Манес, Фамай, Иерел и Азария.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἐμὴρ
  choice: из сыновей Эмера
  rationale: Сохраняет греческую конструкцию и вводный характер фрагмента перечня; имя передано в форме родительного падежа по нормам русского языка.
- source_word: Ἀνανίας
  choice: Анания
  rationale: Традиционная русская библейская передача греческого имени.
- source_word: Ζαβδαῖος
  choice: Забдай
  rationale: Естественная русская передача греческой формы имени с сохранением основы Забд-.
- source_word: Μάνης
  choice: Манес
  rationale: Транслитерация греческого имени без попытки отождествить его с иным именем из параллельной традиции.
- source_word: Θαμαῖος
  choice: Фамай
  rationale: Передаёт греческое начальное θ традиционным библейским «ф» и окончание имени в естественной русской форме.
- source_word: Ἰερεὴλ
  choice: Иерел
  rationale: Близко передаёт засвидетельствованную греческую форму и не исправляет её по предположительной семитской реконструкции.
- source_word: Ἀζαρίας
  choice: Азария
  rationale: Традиционная русская библейская форма имени.
