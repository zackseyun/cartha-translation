base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/026.yaml
  text: 'From Israel[a], from the sons of Phoros: Jerma and Jezias and Melcheias and Mielos and Eleazar and Asebeias and Bannaias.'
translation:
  language: ru
  text: 'Из израильтян[a], из сыновей Фороса: Иерма, Иезия, Мелхия, Миил, Елеазар, Асевия и Ванния.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые имена в этом стихе, вероятно, соответствуют еврейским формам имён из параллельного списка в книге Ездры, гл. 10; например, Форос — Парош, а Ванния — Ванея. Поскольку 1 Ездры здесь переводится с греческого текста, в основном тексте сохранены греческие формы имён.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ Ἰσραήλ
  choice: из израильтян
  rationale: Повторяющийся предлог ἐκ указывает на выделение названных людей из более широкой группы. По-русски «из израильтян» естественнее буквального «из Израиля» и сохраняет смысл списочной формулы.
- source_word: ἐκ τῶν υἱῶν Φορός
  choice: из сыновей Фороса
  rationale: υἱοί в родословных списках может означать потомков или род, однако буквальное «сыновья» сохраняет форму греческого текста и понятно в данном контексте.
- source_word: Φορός
  choice: Форос
  rationale: Имя передано по основному греческому свидетелю; еврейская форма «Парош» относится к параллельной традиции и отмечена в сноске.
- source_word: Ἰερμὰ
  choice: Иерма
  rationale: Консервативная передача греческой формы личного имени без замены предполагаемым еврейским соответствием.
- source_word: Ἰεζείας
  choice: Иезия
  rationale: Русская передача греческого имени с естественным для библейских имен окончанием -ия.
- source_word: Μελχείας
  choice: Мелхия
  rationale: Передача греческой формы имени в соответствии с русской библейской традицией транслитерации.
- source_word: Μίηλος
  choice: Миил
  rationale: Форма близко передает греческое Μίηλος и не подменяет редкое имя реконструированной семитской формой.
- source_word: Ἐλεάζαρος
  choice: Елеазар
  rationale: Устоявшаяся русская форма имени, точно соответствующая греческой и библейской традиции.
- source_word: Ἀσεβείας
  choice: Асевия
  rationale: Имя передано по греческой форме; возможное семитское соответствие не вносится в основной текст.
- source_word: Βανναίας
  choice: Ванния
  rationale: Сохранены удвоенный ν греческого свидетеля и обычное русское оформление окончания имени; еврейское соответствие «Ванея» отмечено только как параллель.
