base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/036.yaml
  text: All these had lived with foreign women[a], and they sent them away with the children.
translation:
  language: ru
  text: Все они жили с женщинами из других народов[a] и отослали их вместе с детьми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явным указанием на брак, как в еврейском параллельном тексте: «женились на женщинах из других народов» или «взяли себе в жёны иноплеменниц».'
    reason: Сохраняется более широкая формулировка греческого текста, а брачный смысл, яснее выраженный в еврейском параллельном свидетельстве, приводится как допустимое уточнение.
lexical_decisions:
- source_word: πάντες οὗτοι
  choice: Все они
  rationale: Естественно передаёт греческое указательное выражение, не добавляя отсутствующего в оригинале слова «мужчины».
- source_word: συνῴκησαν
  choice: жили с
  rationale: Глагол буквально обозначает совместную жизнь; брачный характер отношений следует из контекста, но не делается в основном тексте более явным, чем в греческом.
- source_word: γυναῖξιν ἀλλογενέσιν
  choice: с женщинами из других народов
  rationale: Передаёт значение принадлежности к иному народу ясным современным русским языком; слово «жёны» оставлено для сноски, поскольку в греческом стоит общее γυναῖξιν.
- source_word: ἀπέλυσαν αὐτὰς
  choice: отослали их
  rationale: Сохраняет основное значение «отпустить, отослать», не вводя более узкий юридический термин «развелись».
- source_word: σὺν τέκνοις
  choice: вместе с детьми
  rationale: Точно передаёт конструкцию без добавления невыраженного притяжательного местоимения.
theological_decisions:
- issue: Следует ли прямо назвать этих женщин жёнами и тем самым однозначно определить отношения как брак
  choice: В основном тексте сохранено более широкое греческое выражение «жили с женщинами из других народов»
  alternative: «женились на женщинах из других народов» или «взяли себе в жёны иноплеменниц»
  rationale: Первичным свидетельством здесь служит греческий текст, где συνῴκησαν буквально указывает на совместную жизнь. Еврейский параллельный текст яснее выражает брачные отношения, поэтому этот оттенок отмечен в сноске, а не внесён в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка «женщины из других народов» понятнее широкому читателю, чем книжное «иноплеменницы», и точно передаёт этническое значение ἀλλογενής.
