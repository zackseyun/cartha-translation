base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/016.yaml
  text: And Ezra the priest selected for himself men who were heads of their fathers’ houses, all of them designated by name, and they convened on the first day of the tenth month to examine the matter.
translation:
  language: ru
  text: И священник Ездра выбрал себе мужчин — глав их родов, всех поимённо, — и они собрались в первый день десятого месяца[a], чтобы рассмотреть дело.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в новомесячие десятого месяца», то есть в первый день месяца.'
    reason: Более буквальная передача календарного термина νουμηνία.
lexical_decisions:
- source_word: ἐπελέξατο αὐτῷ
  choice: выбрал себе
  rationale: Средний залог и дательное αὐτῷ передают личное участие Ездры и выбор людей для порученной ему задачи; «выбрал себе» сохраняет этот оттенок без излишней тяжеловесности.
- source_word: ἄνδρας ἡγουμένους τῶν πατριῶν αὐτῶν
  choice: мужчин, стоявших во главе своих родов
  rationale: Слово ἄνδρας прямо обозначает мужчин, а ἡγουμένους — лиц, возглавлявших родовые подразделения. «Роды» естественно передаёт πατριαί в данном генеалогическом и административном контексте.
- source_word: πάντας κατ’ ὄνομα
  choice: всех поимённо
  rationale: Краткая и естественная русская формулировка, сохраняющая смысл официального отбора конкретно названных лиц.
- source_word: συνεκλείσθησαν
  choice: они собрались
  rationale: Буквально глагол может обозначать совместное заключение в одном месте, но в данном процедурном контексте речь идёт о совместном заседании; «собрались» ясно передаёт этот смысл, не навязывая идеи заточения.
- source_word: τῇ νουμηνίᾳ τοῦ μηνὸς τοῦ δεκάτου
  choice: в первый день десятого месяца
  rationale: νουμηνία обозначает день новолуния, то есть начало нового месяца. В основном тексте употреблена понятная современному читателю календарная формулировка, а буквальный образ сохранён в сноске.
- source_word: ἐτάσαι τὸ πρᾶγμα
  choice: чтобы расследовать это дело
  rationale: Инфинитив указывает цель собрания, а ἐτάσαι предполагает обстоятельное исследование. «Расследовать это дело» естественно звучит в юридико-административном контексте и сохраняет общий характер πρᾶγμα.
theological_decisions:
- issue: Мужской и родовой характер административных представителей
  choice: мужчин, стоявших во главе своих родов
  alternative: глав семей
  rationale: Перевод сохраняет явно мужское ἄνδρας и родовую структуру πατριαί, не нейтрализуя пол участников и не сужая род до отдельной семьи.
- issue: Календарное значение νουμηνία
  choice: в первый день десятого месяца
  alternative: в новомесячие десятого месяца
  rationale: Контекст не подчёркивает культовое значение новолуния, поэтому в тексте дан календарный смысл термина; буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксис упрощён до двух предложений для ясности; административный и родовой характер сцены сохранён без архаизмов вроде «отеческих домов».
