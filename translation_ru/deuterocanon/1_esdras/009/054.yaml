base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/054.yaml
  text: And they all went away to eat and drink and rejoice[a], and to send portions to those who had nothing, and to rejoice greatly;
translation:
  language: ru
  text: Все разошлись, чтобы есть, пить и радоваться, посылать угощения тем, у кого ничего не было[a], и весьма радоваться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем, у кого не было приготовленных долей». В еврейском параллельном тексте прямо говорится о посылке долей пищи тем, у кого их не было.'
    reason: Греческое выражение буквально означает «тем, кто не имеет», не называя подразумеваемый предмет; еврейская параллель уточняет праздничный контекст.
lexical_decisions:
- source_word: ᾤχοντο
  choice: пошёл
  rationale: Глагол οἴχομαι обозначает уход; в сочетании с πάντες естественное русское выражение «весь народ пошёл» передаёт, что люди разошлись с собрания для празднования.
- source_word: φαγεῖν καὶ πιεῖν
  choice: есть, пить
  rationale: Прямая и естественная передача пары инфинитивов, обозначающих цель ухода.
- source_word: εὐφραίνεσθαι
  choice: радоваться
  rationale: Передаёт как внутреннюю радость, так и праздничное веселье, не сужая значение до одного лишь застолья.
- source_word: δοῦναι ἀποστολὰς
  choice: посылать угощение
  rationale: Буквально сочетание говорит о передаче или отправлении посылаемого; еврейская параллель с מָנוֹת уточняет, что речь идёт о долях праздничной еды. «Угощение» звучит естественно по-русски и сохраняет контекст праздничной взаимопомощи.
- source_word: τοῖς μὴ ἔχουσιν
  choice: тем, у кого ничего не было
  rationale: Греческий текст буквально оставляет предмет нехватки неуказанным. Формулировка сохраняет эту широту, а примечание сообщает более конкретный смысл еврейской параллели.
- source_word: εὐφρανθῆναι μεγάλως
  choice: предаваться великой радости
  rationale: Так сохраняются и усиление μεγάλως, и риторическое повторение корня радости, при этом фраза остаётся естественной и отличимой от первого «радоваться».
theological_decisions:
- issue: Уточнение подразумеваемого дополнения при τοῖς μὴ ἔχουσιν
  choice: тем, у кого ничего не было
  alternative: тем, у кого не было приготовлено угощения
  rationale: Греческий первичный текст не называет отсутствующий предмет, поэтому основной перевод не должен чрезмерно его конкретизировать. Еврейская параллель указывает на отсутствие праздничных долей пищи; это уточнение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Сохранено двукратное упоминание радости в греческом тексте; синтаксис слегка сглажен для естественного русского ритма.
