base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/014.yaml
  text: Jonathan son of Azael and Hezekiah son of Thocanus accepted this[c][b][a], and Mosollamus and Levi and Sabbataeus joined in deciding with them.
translation:
  language: ru
  text: Ионафан, сын Азаила, и Езеия, сын Фокана, приняли это[c], а Мосоллам, Левий и Савватей участвовали вместе с ними в вынесении решения[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческие формы имён здесь отличаются от форм в приблизительной еврейской параллели в Езд. 10; например, Мосолламу соответствует Мешуллам, а Савватею — Шавветай.
    reason: alternative_reading
  - marker: b
    text: Редкий греческий глагол, переведённый словами «участвовали вместе с ними в вынесении решения», может также означать, что эти люди выступили вместе с ними как заседатели или поддержали их решение.
    reason: lexical_alternative
  - marker: c
    text: Греческий текст 1 Ездры в этом месте заметно расходится с формулировкой масоретской параллели, поэтому имена и выражения основного текста переведены прежде всего по греческому свидетелю.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεδέξαντο κατὰ ταῦτα
  choice: приняли это
  rationale: Средняя форма ἐπιδέχομαι в данном административном контексте передаёт принятие на себя предложения или установленного порядка; κατὰ ταῦτα указывает на соответствие ранее изложенному решению. Краткое русское «приняли это» естественно передаёт сочетание целиком.
- source_word: συνεβράβευσαν αὐτοῖς
  choice: участвовали вместе с ними в вынесении решения
  rationale: Редкий глагол συνεβράβευσαν, вероятно, обозначает совместное участие в оценке, разбирательстве или решении. Формулировка сохраняет судебно-совещательный оттенок, не превращая его в название точно установленной должности.
- source_word: Ἰωνάθας Ἀζαήλου
  choice: Ионафан, сын Азаила
  rationale: Греческий родительный падеж имени отца передан явным патронимическим оборотом; формы имён транслитерированы с греческого с учётом привычного русского библейского облика.
- source_word: Ἐξειας Θοκάνου
  choice: Езекия, сын Фокана
  rationale: Ἐξειας соответствует известному семитскому имени Езекия. Θοκάνου передано по греческой форме как «Фокана», поскольку надёжное общеупотребительное соответствие здесь не установлено.
- source_word: Μοσόλλαμος
  choice: Мосоллам
  rationale: Основным свидетелем служит греческий текст, поэтому в основном тексте сохранена его форма имени; приблизительная еврейская параллель отмечена в сноске.
- source_word: Λευεὶς
  choice: Левий
  rationale: Форма стоит в единственном числе и в перечне выступает как личное имя, а не как обозначение левитов.
- source_word: Σαββαταῖος
  choice: Савватей
  rationale: Имя передано по греческой форме в русской библейской транслитерации; соответствующая форма приблизительной еврейской параллели приведена в сноске.
