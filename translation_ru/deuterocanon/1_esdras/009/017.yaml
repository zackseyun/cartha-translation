base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/017.yaml
  text: And the matter concerning the men who had taken foreign women was brought to an end by the new moon of the first month[a][b].
translation:
  language: ru
  text: И дело о мужчинах, взявших в жёны женщин из чужих народов, было завершено к новолунию первого месяца[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст в этом месте труден: причастие буквально можно понять как «мужчинах, которые были собраны». Еврейский параллельный текст поддерживает принятый здесь по контексту смысл: «мужчинах, взявших в жёны женщин из чужих народов».'
    reason: alternative_reading
  - marker: b
    text: «Новолуние первого месяца» — первый день первого месяца по лунному календарю.
    reason: cultural_note
lexical_decisions:
- source_word: ἦχθη ἐπὶ πέρας
  choice: было завершено
  rationale: Передаёт пассивную конструкцию и значение доведения дела до конца, оставаясь естественным в современном русском языке.
- source_word: τὰ κατὰ τοὺς ἄνδρας
  choice: дело о мужчинах
  rationale: Субстантивированное выражение с κατά означает относящиеся к ним обстоятельства или дело; единственное число естественно для общего разбирательства.
- source_word: τοὺς ἐπισυναχθέντας
  choice: взявших себе
  rationale: Переданная греческая форма буквально допускает смысл «собранных», однако в данном контексте он затруднителен; еврейский параллельный текст говорит о мужчинах, взявших чужеземных жён. Контекстуальный смысл вынесен в основной текст, а проблема греческого чтения отмечена в сноске.
- source_word: γυναῖκας ἀλλογενεῖς
  choice: иноплеменных женщин
  rationale: ἀλλογενής обозначает принадлежность к иному народу. «Иноплеменных» точнее, чем современное гражданско-политическое «иностранных», и уместно в историческом повествовании.
- source_word: ἕως τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: к новолунию первого месяца
  rationale: νουμηνία буквально означает новолуние и обозначает начало лунного месяца; с глаголом завершения «к» естественно выражает предельный срок.
