translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Выражение «иноплеменные женщины» сохраняет этнический смысл исходного слова и не вводит современного понятия гражданства; «взявших себе» не уточняет сверх источника юридическую форму союза.
