    issue: Неточность в формулировке сноски о буквальном значении греческого причастия.
    rationale: τοὺς ἐπισυναχθέντας относится к «мужчинам» и буквально означает «которые были собраны/собраны вместе», а не «о мужчинах, которые были собраны». Сноска должна также ясно показать, что это трудное греческое чтение, тогда как основной текст следует контекстуальному смыслу параллели.
