base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/041.yaml
  text: And he was reading in the broad space before the temple gate from dawn until midday in the presence of the men and the women[b][a]; and all of them gave their attention to the law.
translation:
  language: ru
  text: И он читал на просторном месте перед воротами храма[a] от рассвета до полудня, в присутствии мужчин и женщин; и они обратили всё своё внимание на закон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на площади перед воротами храма». Греческое слово обозначает широкое, просторное место, но не уточняет, была ли это именно площадь или двор.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отдали весь ум закону», то есть слушали его со всем вниманием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεγίνωσκεν
  choice: читал
  rationale: Имперфект обозначает продолжавшееся действие на протяжении указанного времени. Публичная обстановка подразумевает чтение вслух, однако само слово не требует добавлять «вслух».
- source_word: ἐν τῷ ... εὐρυχώρῳ
  choice: на просторном месте
  rationale: Субстантивированное εὐρύχωρον обозначает широкое, просторное место. Формулировка сохраняет пространственную неопределённость греческого текста и не превращает это место без достаточных оснований в площадь или двор.
- source_word: πρὸ τοῦ ἱεροῦ πυλῶνος
  choice: перед воротами храма
  rationale: πρό с родительным падежом указывает на положение перед чем-либо; ἱερός связывает ворота с храмом или священной территорией. По-русски «ворота храма» естественнее и яснее буквального «священные ворота».
- source_word: ἀπὸ ὄρθρου ἕως μεσημβρινοῦ
  choice: от рассвета до полудня
  rationale: ὄρθρος означает рассвет или раннее утро, а μεσημβρινός — полдень. Перевод кратко и точно передаёт временной промежуток.
- source_word: ἐνώπιον τῶν ἀνδρῶν καὶ γυναικῶν
  choice: в присутствии мужчин и женщин
  rationale: ἐνώπιον означает «перед, в присутствии». Перевод прямо сохраняет упоминание обеих групп.
- source_word: ἐπέδωκαν πάντα τὸν νοῦν
  choice: обратили всё своё внимание
  rationale: Греческое выражение буквально говорит, что слушатели «направили весь ум» к закону. Русская идиома передаёт полную сосредоточенность, сохраняя силу πάντα как определения к νοῦν.
- source_word: εἰς τὸν νόμον
  choice: на закон
  rationale: Предлог εἰς после глагола направленности естественно передаётся как «на». Строчная буква не превращает обычное греческое существительное в добавленный переводчиком официальный заголовок.
theological_decisions:
- issue: Следует ли писать слово «закон» с прописной буквы как название Торы
  choice: закон
  alternative: Закон
  rationale: Контекст указывает на священный закон, который читали народу, но греческое τὸν νόμον само по себе не оформлено как название книги. Строчная буква сохраняет лексическую прозрачность и не снимает контекстуальной связи с законом Моисея.
- issue: Передача состава слушателей
  choice: мужчин и женщин
  alternative: народа; всех собравшихся
  rationale: Греческий текст явно называет мужчин и женщин. Обобщение скрыло бы эту значимую деталь источника.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным библейским регистром. Синтаксис сохраняет последовательность греческого повествования, но избегает неестественных калек; лексическая и пространственная неоднозначность отмечена в сносках.
