base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/052.yaml
  text: For the day is holy to the Lord[a], and do not be grieved; for the Lord will glorify you.
translation:
  language: ru
  text: 'Ибо этот день свят для Господа, и не скорбите: Господь прославит вас.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская параллель в Неемии 8:10 здесь отличается: приблизительно, «радость Господня — ваша сила». В греческом тексте 1 Ездры сказано: «Господь прославит вас».'
    reason: Альтернативное чтение в параллельной текстовой традиции.
lexical_decisions:
- source_word: ἁγία
  choice: свят
  rationale: Передаёт освящённость и посвящённость дня; это обычный и уместный библейский эквивалент, соответствующий также еврейскому קָדֹשׁ в параллельном тексте.
- source_word: ἡ ἡμέρα
  choice: этот день
  rationale: Указательное «этот» естественно для русского контекста и обозначает именно отмечаемый день, не изменяя смысла греческой именной группы с артиклем.
- source_word: τῷ κυρίῳ
  choice: для Господа
  rationale: 'Дательный падеж выражает отношение или посвящение: день свят и посвящён Господу. Формулировка сохраняет явное упоминание Господа в греческом тексте.'
- source_word: μὴ λυπεῖσθε
  choice: не скорбите
  rationale: Глагол обозначает печаль, скорбь или душевное огорчение; «не скорбите» сохраняет эмоциональную весомость выражения и звучит достойно и понятно.
- source_word: δοξάσει
  choice: прославит
  rationale: Прямо передаёт значение греческого глагола из семантического поля славы и чести, не подменяя его отличающимся чтением еврейской параллели.
- source_word: ὑμᾶς
  choice: вас
  rationale: Передаёт местоимение второго лица множественного числа.
theological_decisions:
- issue: Передача κύριος в греческом тексте 1 Ездры
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — стандартный русский библейский эквивалент; контекст не требует значения «владыка» или «господин».
- issue: Следует ли согласовать заключительную фразу с еврейской параллелью в Неемии 8:10
  choice: 'Сохранить греческое чтение: «Господь прославит вас»'
  alternative: «Радость пред Господом — подкрепление для вас» или сходная передача еврейского текста
  rationale: Для 1 Ездры первичным источником служит греческий текст, где прямо сказано δοξάσει ὑμᾶς. Отличие еврейской параллели следует отметить, но не вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис близок к греческому, но двоеточие естественно обозначает пояснительную связь перед заключительной фразой. Формулировка не гармонизирует греческий текст с еврейской параллелью.
