base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/027.yaml
  text: 'From the sons of Elah: Mattan and Zechariah[a], Jezrikilus and Obadiah and Jeremoth and Aedeias.'
translation:
  language: ru
  text: 'Из сыновей Илы: Маттан, Захария[a], Иезрикилос, Оавдий, Иеремот и Аэдеия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые имена в этом стихе переданы близко к их греческому написанию, поскольку в 1 Ездры написание и порядок имён нередко отличаются от еврейской параллели; для части имён возможны более привычные формы, основанные на еврейском тексте.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Из сыновей
  rationale: Сохраняет значение ἐκ и естественно вводит часть рода в продолжающемся перечне.
- source_word: Ἠλά
  choice: Илы
  rationale: Передача греческой формы имени Ἠλά с русским склонением; текст не гармонизирован с отличающимися параллелями.
- source_word: Ματαν
  choice: Маттан
  rationale: Близкая передача греческого имени с сохранением удвоенного согласного.
- source_word: Ζαχαρίας
  choice: Захария
  rationale: Устоявшаяся русская библейская форма имени, точно соответствующая узнаваемому греческому имени.
- source_word: Ἰεζρίκιλος
  choice: Иезрикилос
  rationale: Редкое имя передано близко к засвидетельствованной греческой форме без предположительной сверки с иным именем еврейской традиции.
- source_word: Ὠαβδίος
  choice: Оавдий
  rationale: Форма сохраняет начальное Ω греческого свидетельства и одновременно остаётся естественной для русского читателя; привычное «Авдий» возможно, но сильнее сглаживает отличие текста.
- source_word: Ἱερεμὼθ
  choice: Иеремот
  rationale: Близкая русская транслитерация греческой формы; окончание не заменено более знакомым именем из иной текстовой традиции.
- source_word: Ἀηδείας
  choice: Аэдей
  rationale: Передаёт редкую греческую форму в удобочитаемом русском виде, не навязывая неуверенное отождествление с еврейским именем.
