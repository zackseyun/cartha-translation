base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/037.yaml
  text: And the priests and the Levites and those from Israel lived in Jerusalem and in the country at the new moon of the seventh month[b][a], and the sons of Israel were in their settlements.
translation:
  language: ru
  text: И священники, и левиты, и те из Израиля поселились в Иерусалиме и в области в новолуние седьмого месяца[a], а сыны Израиля — в своих поселениях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст говорит о «новолунии седьмого месяца»; еврейская параллель в Неемии 8:1 в этом месте существенно отличается. Перевод следует греческому тексту 1 Ездры.
    reason: alternative_reading
lexical_decisions:
- source_word: κατῴκησαν
  choice: поселились
  rationale: Аорист κατοικέω здесь обозначает проживание или обоснование в определённом месте; «поселились» естественно передаёт завершённое действие и согласуется с упоминанием поселений в конце стиха.
- source_word: οἱ ἐκ τοῦ Ἰσραήλ
  choice: те, кто был из Израиля
  rationale: Формулировка сохраняет отличие этой группы от последующего выражения «сыны Израиля» и не сводит обе греческие конструкции к одному русскому обозначению.
- source_word: ἐν Ἰερουσαλὴμ καὶ ἐν τῇ χώρᾳ
  choice: в Иерусалиме и в области
  rationale: χώρα противопоставляет Иерусалим окружающей территории; «область» звучит естественнее современного географического значения слова «страна» и не сужает смысл до деревень.
- source_word: τῇ νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: к новолунию седьмого месяца
  rationale: νουμηνία прямо означает новолуние, отмечавшее начало месяца. Предлог «к» передаёт временную привязку греческого дательного без искусственной точности.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохранено буквальное родовое обозначение народа и отличие от ранее употреблённого οἱ ἐκ τοῦ Ἰσραήλ.
- source_word: κατοικίαις
  choice: поселениях
  rationale: Во множественном числе κατοικία здесь естественно понимать как места проживания или населённые пункты; «поселения» передаёт коллективно-географический смысл.
theological_decisions:
- issue: Соотношение греческого текста 1 Ездры с приблизительной масоретской параллелью Неемии 8:1
  choice: Следовать греческой последовательности и сохранить упоминание новолуния седьмого месяца.
  alternative: Согласовать стих с масоретским текстом, где народ собирается как один человек на площади перед Водяными воротами.
  rationale: Для 1 Ездры первичным источником служит греческий текст. Масоретская параллель здесь существенно отличается и потому не должна заменять или гармонизировать греческое чтение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повтор союзов в начале сохранён как черта греческого повествования; во второй части использовано эллиптическое сказуемое, естественное для русского языка.
