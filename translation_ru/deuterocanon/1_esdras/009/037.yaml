  rationale: Исправлена временная конструкция, чтобы передать греческое указание на новолуние как на время, а не как на предельный срок. Незначительно упрощено обозначение группы «те из Израиля»; различие между ним и выражением «сыны Израиля» сохранено. Сноска и её якорь сохранены и соответствуют расхождению с приблизительной еврейской параллелью.
