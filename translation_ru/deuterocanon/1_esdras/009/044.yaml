base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/044.yaml
  text: 'And from the left: Phaladaios[a], Meisael, Melcheias, Lothasoubos, Nabareias[b], Zechariah.'
translation:
  language: ru
  text: 'И слева[a]: Фаладайос, Мисаил, Мелхия, Лотасув, Навария[b] и Захария.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с левой стороны». Греческое выражение указывает на положение в собрании или группе.'
    reason: lexical_alternative
  - marker: b
    text: Некоторые имена в этом перечне передают формы греческого текста 1 Ездры и могут соответствовать более привычным еврейским именам в параллельной традиции; в основном тексте сохранены греческие формы.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ εὐωνύμων
  choice: слева
  rationale: Оборот буквально указывает на левую сторону и в контексте перечня обозначает положение людей в собравшейся группе. Краткое «слева» естественно по-русски и сохраняет пространственный смысл.
- source_word: Φαλαδαῖος
  choice: Фаладайос
  rationale: Имя передано непосредственно по греческой форме без предположительного отождествления с иной семитской формой.
- source_word: Μεισαήλ
  choice: Мисаил
  rationale: Использована естественная для русского библейского языка передача греческого имени; она не требует замены имени на реконструируемую форму из параллельной традиции.
- source_word: Μελχείας
  choice: Мелхия
  rationale: Имя передано по греческому написанию в форме, естественной для русского библейского именослова.
- source_word: Λωθάσουβος
  choice: Лотасув
  rationale: Сохранена трудная греческая форма имени; она не гармонизирована с возможным, но неуверенным соответствием в еврейской традиции.
- source_word: Ναβαρείας
  choice: Навария
  rationale: Передана засвидетельствованная греческая форма. Возможное отождествление с более известным еврейским именем недостаточно надёжно для основного текста.
- source_word: Ζαχαρίας
  choice: Захария
  rationale: Употреблена общепринятая русская библейская форма этого имени.
