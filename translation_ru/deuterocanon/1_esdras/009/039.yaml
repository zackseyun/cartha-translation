base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/039.yaml
  text: And he told Ezra the priest and reader to bring the law of Moses that had been given by the God of Israel[a][b].
translation:
  language: ru
  text: И он сказал священнику Ездре, чтецу[a], принести Закон Моисея, переданный Богом Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «публичному чтецу». Иногда переводят «книжнику», однако греческое слово непосредственно обозначает того, кто читает вслух.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вручённый Богом Израиля»; греческое слово может подчёркивать как дарование, так и передачу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν … κομίσαι
  choice: велел … принести
  rationale: Обычное «сказал» вместе с инфинитивом требуемого действия естественно передаётся по-русски конструкцией «велел … принести»; она выражает поручение, не усиливая его до формального приказа.
- source_word: Ἔσρᾳ τῷ ἱερεῖ
  choice: священнику Ездре
  rationale: Дательный падеж и наименование служения переданы естественным русским порядком слов; имя дано в принятой русской библейской форме.
- source_word: ἀναγνώστῃ
  choice: чтецу
  rationale: Слово обозначает читающего вслух; «чтец» точнее сохраняет указанную в греческом роль Ездры, чем «книжник».
- source_word: κομίσαι
  choice: принести
  rationale: В контексте речь идёт о том, чтобы доставить и представить Закон собранию; «принести» ясно и естественно.
- source_word: τὸν νόμον Μωυσέως
  choice: Закон Моисея
  rationale: Прямая и прозрачная передача греческой родительной конструкции. Прописная буква указывает на конкретный священный Закон, не добавляя толкования.
- source_word: τὸν παραδοθέντα
  choice: переданный
  rationale: Причастие παραδίδωμι подчёркивает передачу или вручение. «Переданный» сохраняет этот оттенок точнее, чем более общее «данный».
- source_word: ὑπὸ τοῦ θεοῦ Ἰσραήλ
  choice: Богом Израиля
  rationale: ὑπό при страдательном причастии обозначает действующее лицо; творительный падеж естественно передаёт это по-русски.
theological_decisions:
- issue: Связь Закона с Моисеем и Богом
  choice: Закон Моисея, переданный Богом Израиля
  alternative: Закон, данный Богом Израиля через Моисея
  rationale: Греческий текст связывает Закон с Моисеем, а Бога называет тем, кто его передал. Перевод сохраняет обе связи, не добавляя отсутствующего в тексте выражения «через Моисея».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис краткий и ясный; специфическая роль ἀναγνώστης сохранена без гармонизации с параллельным еврейским текстом.
