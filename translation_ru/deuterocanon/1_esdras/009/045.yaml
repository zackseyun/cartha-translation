base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/045.yaml
  text: And Ezra took up the book before the multitude[a], for he was seated prominently before them all[c][b],
translation:
  language: ru
  text: И Ездра взял книгу перед собравшимся народом[a], ибо сидел на почётном месте перед всеми[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед множеством людей» или «перед собранием».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте сказано «книгу»; с исторической точки зрения это мог быть свиток.
    reason: cultural_note
  - marker: c
    text: 'Или: «сидел на видном месте»; греческое наречие указывает на заметное и почётное положение перед всеми.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναλαβών
  choice: взял
  rationale: Причастие означает, что Ездра взял предмет в руки; «взял» естественно передаёт действие, не добавляя идеи ритуального вознесения.
- source_word: τὸ βιβλίον
  choice: книгу
  rationale: Прямой эквивалент греческого βιβλίον; исторически речь могла идти о свитке, но греческое слово само по себе этого здесь не уточняет.
- source_word: τοῦ πλήθους
  choice: собравшимся народом
  rationale: πλῆθος обозначает множество собравшихся людей. Такой перевод звучит современно и ясно, сохраняя образ публичного собрания.
- source_word: ἐνώπιον
  choice: перед / у всех на виду
  rationale: Два вхождения переданы естественными русскими соответствиями, сохраняющими публичность и видимость происходящего без механического повтора.
- source_word: προεκάθητο
  choice: сидел
  rationale: Форма обозначает продолжавшееся положение Ездры сидя; контекстуальную выделенность его места передаёт сочетание с наречием.
- source_word: ἐπιδόξως
  choice: на почётном месте
  rationale: Наречие указывает на заметное, почётное положение перед собранием; эта формулировка естественнее буквального «почётно сидел».
- source_word: πάντων
  choice: у всех на виду
  rationale: Передаёт, что Ездра находился перед всеми присутствующими, в публично заметном положении.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Неестественное для русского буквальное «множество» конкретизировано как «собравшийся народ», а публичная почётность положения выражена идиоматически: «на почётном месте у всех на виду».'
