base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/033.yaml
  text: 'And from the sons of Asom: Maltannaios[a], Mattathias, Sabannaious, Eleiphalat, Manasseh[b], and Shimei.'
translation:
  language: ru
  text: 'И из сыновей Асома[a]: Малтанней, Маттафия, Саванней, Елифалат, Манассия[b] и Семей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — «Асом»; в параллельной еврейской традиции этому имени, вероятно, соответствует «Хашум».
    reason: alternative_reading
  - marker: b
    text: Некоторые имена в этом перечне имеют греческие формы, не вполне совпадающие с параллельной еврейской традицией; основной текст следует греческому тексту 1 Ездры.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: И из сыновей
  rationale: Передаёт введение очередной родовой группы в перечне; формулировка естественна для современного литературного русского языка и сохраняет значение предлога ἐκ.
- source_word: Ἀσόμ
  choice: Асома
  rationale: Основной текст следует греческому чтению Ἀσόμ, не заменяя его предположительным еврейским соответствием Хашум; родительный падеж обусловлен конструкцией «из сыновей».
- source_word: Μαλτανναῖος
  choice: Малтанней
  rationale: Русская передача греческой формы собственного имени; имя не унифицируется с возможным соответствием в еврейской традиции.
- source_word: Ματταθίας
  choice: Маттафия
  rationale: Узнаваемая русская библейская форма греческого имени Ματταθίας.
- source_word: Σαβανναιούς
  choice: Саванней
  rationale: Передаёт греческую форму имени в русской форме, не подменяя её предположительным еврейским эквивалентом.
- source_word: Ἐλειφαλὰτ
  choice: Елифалат
  rationale: Близкая к греческому написанию и естественная для русского языка передача собственного имени.
- source_word: Μανασση
  choice: Манассия
  rationale: Традиционная и узнаваемая русская библейская форма имени, соответствующая греческому Μανασση.
- source_word: Σεμεεί
  choice: Семей
  rationale: Традиционная русская библейская форма имени; она согласуется с греческим Σεμεεί и вероятным семитским соответствием.
