  text: And among the priests there were found some who had taken foreign women[a].
translation:
  language: ru
  text: И среди священников нашлись те, кто взял себе иноплеменных женщин[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «собранные вместе, имеющие иноплеменных женщин». Дошедшая до нас формулировка несколько затруднительна; еврейский параллельный текст поддерживает смысл: «те, кто взял себе иноплеменных женщин».'
    reason: Текстологическое расхождение и пояснение брачного смысла выражения.
lexical_decisions:
- source_word: εὑρέθησαν
  choice: нашлись
  rationale: Передаёт пассивную форму и смысл выявления людей при разбирательстве, оставаясь естественным для современного русского языка.
- source_word: τῶν ἱερέων
  choice: среди священников
  rationale: 'Родительный падеж имеет партитивный смысл: выявленные люди принадлежали к числу священников.'
- source_word: οἱ ... ἔχοντες
  choice: те, кто взял себе
  rationale: Артикль с причастием выделяет определённую группу. Буквально ἔχοντες означает «имеющие», но в данном контексте и с учётом еврейского параллельного текста речь идёт о взятии женщин в жёны; выражение «взял себе» сохраняет брачный оттенок, не делая его излишне явным.
- source_word: ἐπισυναχθέντες
  choice: не выражено отдельно в основном тексте
  rationale: Буквально означает «собравшиеся» или «собранные», однако в дошедшей греческой формулировке причастие синтаксически затруднительно. Его буквальная передача сделала бы русский текст неясным; особенность отмечена в сноске.
- source_word: ἀλλογενεῖς γυναῖκας
  choice: иноплеменных женщин
  rationale: Передаёт женщин, принадлежащих к другому народу, и соответствует контексту, не используя архаичное или двусмысленное «чужеземных жён».
theological_decisions:
- issue: Использование еврейского параллельного текста для уточнения брачного смысла греческого ἔχοντες
  choice: «взял себе иноплеменных женщин»
  alternative: «имел иноплеменных женщин»
  rationale: Греческий текст остаётся основным, однако еврейская параллель подтверждает, что речь идёт о брачном союзе. Выбранная формулировка передаёт этот контекст без добавления конфессионального толкования.
- issue: Передача затруднительного ἐπισυναχθέντες
  choice: Не вводить его отдельно в основной текст и пояснить в сноске
  alternative: «те из собравшихся, кто имел иноплеменных женщин»
  rationale: Альтернативная буквальная конструкция способна ошибочно связать причастие не с тем референтом и затемняет смысл. Сноска сохраняет сведения о реально засвидетельствованной форме и текстологическом напряжении.
translation_notes:
  register: Современный литературный русский язык; изложение сдержанное и ясное. «Иноплеменных» сохраняет различие по принадлежности к народу, а не просто по месту рождения. Сноска открыто отмечает неровность греческого текста.
