base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/031.yaml
  text: 'And from the sons of Addin: Lathos and Moosseias[a], Lakkounos and Naidos, and Beskaspasmos and Sesthel and Balnous and Manasseh.'
translation:
  language: ru
  text: 'И из сыновей Аддина: Латос и Мооссеия[a], Лаккунос и Наидос, и Вескаспасмос, и Сестел, и Валнус, и Манассия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст здесь содержит перечень личных имён; чтение нескольких из них не вполне надёжно и отличается от приблизительной еврейской параллели. Поэтому имена переданы близко к их греческим формам без согласования с масоретской традицией.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Ἀδδείν
  choice: И из сыновей Аддина
  rationale: Предлог ἐκ с родительным падежом указывает на представителей семейной группы; сохранена формула перечня, близкая к греческому тексту.
- source_word: υἱῶν
  choice: сыновей
  rationale: В родословных и списках слово может обозначать потомков или членов рода, однако буквальное «сыновей» сохраняет форму и допустимую широту греческого выражения.
- source_word: Ἀδδείν
  choice: Аддина
  rationale: Имя передано по греческой форме и поставлено в родительный падеж согласно русскому синтаксису.
- source_word: Λάθος
  choice: Латос
  rationale: Транслитерация греческого личного имени; θ передано как «т» в соответствии с укоренившейся русской библейской практикой.
- source_word: Μοοσσείας
  choice: Мооссеия
  rationale: Форма близко передаёт засвидетельствованное греческое написание с двойным ο и удвоенным σ, не гармонизируя имя с приблизительной еврейской параллелью.
- source_word: Λακκοῦνος
  choice: Лаккунос
  rationale: Транслитерация сохраняет удвоенное κ и передаёт ου через «у».
- source_word: Νάιδος
  choice: Наидос
  rationale: Прямая и читаемая передача греческой формы имени.
- source_word: Βεσκασπασμὸς
  choice: Вескаспасмос
  rationale: Трудное имя передано максимально близко к греческим буквам; начальная β в русской библейской традиции передаётся через «в».
- source_word: Σεσθὴλ
  choice: Сестел
  rationale: Имя транслитерировано по греческой форме; θ передано через «т» согласно русской библейской традиции.
- source_word: Βαλνοῦς
  choice: Валнус
  rationale: Прямая русская транслитерация греческой формы с передачей β через «в» и ου через «у».
- source_word: Μανασσῆς
  choice: Манассия
  rationale: Использована традиционная и узнаваемая русская библейская форма имени.
