base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/010.yaml
  text: And the whole assembly cried out and said with a loud voice[a], “So, as you have said[b], we will do.”
translation:
  language: ru
  text: 'И всё собрание громко воскликнуло[a]: «Как ты сказал, так и сделаем»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё множество воскликнуло громким голосом»; возможно также: «вся толпа».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст буквально: «Так, как ты сказал, сделаем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφώνησαν
  choice: воскликнуло
  rationale: Глагол обозначает громкое публичное возглашение; «воскликнуло» естественно передаёт единодушный ответ собравшихся и сохраняет возвышенный регистр.
- source_word: πᾶν τὸ πλῆθος
  choice: всё собрание
  rationale: Буквально — «всё множество». В данном публичном контексте «собрание» естественно обозначает собравшийся народ как единое целое, не превращая его просто в неорганизованную толпу.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: громко
  rationale: Естественный современный русский эквивалент буквального оборота «великим/громким голосом»; смысл полностью сохраняется без грецизма.
- source_word: Οὕτως ὡς εἴρηκας
  choice: Как ты сказал, так
  rationale: Русская соотносительная конструкция естественно передаёт οὕτως ὡς и сохраняет прямое согласие с высказанным предложением.
- source_word: ποιήσομεν
  choice: сделаем
  rationale: Прямая передача будущего времени и выраженного решения исполнить сказанное.
theological_decisions:
- issue: Характер общего ответа народа в публичном контексте
  choice: всё собрание
  alternative: всё множество / вся толпа
  rationale: «Собрание» передаёт формальный коллективный характер ответа, но не добавляет специального конфессионального смысла; лексическая широта πλῆθος отмечена в сноске.
- issue: Сила перфекта εἴρηκας
  choice: как ты сказал
  alternative: как ты говоришь / как ты изрёк
  rationale: Русское прошедшее время здесь естественно относится к только что произнесённым и сохраняющим силу словам; искусственно подчёркивать результативность перфекта не требуется.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для русского: греческое «Так, как ты сказал» передано соотносительной конструкцией «Как ты сказал, так и сделаем».'
