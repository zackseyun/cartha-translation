base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/004.yaml
  text: And whoever does not appear within two or three days[a], according to the judgment of the presiding elders, their livestock will be devoted[b], and he himself will be excluded from the assembly of the captivity.
translation:
  language: ru
  text: 'Каждый, кто не явится в течение двух или трёх дней согласно решению председательствующих старейшин, будет лишён своего скота: он будет посвящён[a]; сам же он будет исключён из общины изгнанников[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу: «скот будет конфискован». Греческий глагол буквально означает «будет посвящён»; в данном правовом контексте это, вероятно, подразумевает изъятие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из сообщества изгнанников». Буквально: «из множества (или общины) плена»; по историческому контексту возможен смысл «из общины возвратившихся из плена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαντήσωσιν
  choice: не явится
  rationale: В контексте общего созыва глагол означает явиться в ответ на требование, а не просто встретиться с кем-либо.
- source_word: ἐν δυσὶν ἢ τρισὶν ἡμέραις
  choice: в течение двух или трёх дней
  rationale: Передаёт установленный срок, сохраняя необычную вариативную формулу греческого текста.
- source_word: κατὰ τὸ κρῖμα
  choice: согласно решению
  rationale: κρῖμα здесь обозначает обязательное постановление; «решение» естественно звучит в современном русском юридическом контексте.
- source_word: τῶν προκαθημένων πρεσβυτέρων
  choice: председательствующих старейшин
  rationale: Причастие προκαθημένων указывает на руководящую, председательствующую роль старейшин.
- source_word: ἀνιερωθήσονται
  choice: будет предан заклятию
  rationale: Сохраняет религиозно-правовой оттенок посвящения или изъятия, не сводя смысл безоговорочно к простой конфискации.
- source_word: τὰ κτήνη αὐτῶν
  choice: скот
  rationale: κτήνη непосредственно обозначает домашних животных или скот; более широкое «имущество» отражает параллельную традицию, но не точную лексику данного греческого текста.
- source_word: ἀλλοτριωθήσεται
  choice: будет исключён
  rationale: В отношении общины пассивная форма выражает отчуждение и утрату членства; «исключён» ясно передаёт правовой и общественный результат.
- source_word: ἀπὸ τοῦ πλήθους τῆς αἰχμαλωσίας
  choice: из общины пленения
  rationale: «Община» естественно передаёт коллективное значение πλῆθος, а «пленение» сохраняет формулировку αἰχμαλωσία и не добавляет прямо не выраженного указания на возвращение.
theological_decisions:
- issue: Характер наказания, налагаемого на скот неявившегося
  choice: «предан заклятию» — религиозно-правовая санкция с вероятным конфискационным результатом
  alternative: «будет конфискован» или «будет изъят» без сакрального оттенка
  rationale: Греческое ἀνιερωθήσονται сохраняет идею посвящения или предания, тогда как судебный контекст указывает на практическое изъятие. Основной текст удерживает оба измерения, а сноска разъясняет юридический смысл.
- issue: Обозначение сообщества изгнанников
  choice: «община пленения»
  alternative: «община пленников», «сообщество изгнанников» или «община возвратившихся из плена»
  rationale: Выбранная формулировка близка к греческому тексту и не уточняет, идёт ли речь о находящихся в плену, бывших пленниках или возвратившихся изгнанниках; исторически более понятный вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным юридико-библейским звучанием. Единственное число «у всякого… сам он» передаёт распределительную конструкцию греческого текста, несмотря на множественное αὐτῶν при слове «скот». Маркеры сносок поставлены непосредственно после выражений, которые они поясняют.
