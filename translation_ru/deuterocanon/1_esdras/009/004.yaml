revisions:
- from: А у всякого, кто не явится в течение двух или трёх дней, согласно решению председательствующих старейшин, скот будет предан заклятию[a], а сам он будет исключён из общины пленения[b].
  to: 'Каждый, кто не явится в течение двух или трёх дней согласно решению председательствующих старейшин, будет лишён своего скота: он будет посвящён[a]; сам же он будет исключён из общины изгнанников[b].'
  rationale: 'Исправлено ложное русское соответствие «заклятию» и заменена неестественная калька «община пленения». Однако предложенная редакция текста содержит нежелательное добавление «будет лишён своего скота» перед «он будет посвящён»: это фактически меняет синтаксис и субъект греческого высказывания. Безопасная полная редакция должна прямо сказать, что посвящается скот, сохранив разъяснение о конфискации только в сноске: «Каждый, кто не явится в течение двух или трёх дней согласно решению председательствующих старейшин, будет посвящён[a] вместе со своим скотом...» — но и это синтаксически неверно. Требуется точная формулировка: «...скот его будет посвящён[a], а сам он будет исключён из общины изгнанников[b]».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:16:18Z'
