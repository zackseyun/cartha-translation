  text: 'From the gatekeepers: Shallumus and Tobanes[a].'
translation:
  language: ru
  text: 'Из привратников: Саллумос и Тованес[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч.: «Из привратников: Саллумос и Тованес». Параллельная еврейская традиция в этом месте не вполне соответствует греческому тексту и не сохраняет эти имена в той же форме.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν θυρωρῶν
  choice: Из привратников
  rationale: В контексте перечня оборот указывает на группу, к которой принадлежат названные люди. «Из привратников» естественно передаёт это значение и сохраняет обозначение храмового служения.
- source_word: Σάλλουμος
  choice: Саллумос
  rationale: Имя транслитерировано непосредственно с греческой формы с сохранением окончания -ос; это не подменяет основной греческий текст предположительной еврейской формой.
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз между двумя именами.
- source_word: Τοβάνης
  choice: Тованес
  rationale: Прямая транслитерация греческой формы сохраняет свидетельство исходного текста и избегает необоснованного отождествления с более знакомым семитским именем.
