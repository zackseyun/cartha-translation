base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/028.yaml
  text: 'And from the sons of Zamoth: Eliadas[a], Eleiasimus, Othonias, Jarimoth, Sabados[b], and Zeralias.'
translation:
  language: ru
  text: 'И из сыновей Замофа: Элиадас[a], Элеиасимос, Офония, Иаримоф, Савадос[b] и Зералия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые имена в этом стихе представлены в греческой форме и отличаются от имён в параллельной еврейской традиции. Здесь список передан по греческому тексту 1 Ездры без согласования с книгами Ездры и Неемии.
    reason: alternative_reading
  - marker: b
    text: В данных источника отмечено небольшое расхождение, поэтому написание некоторых имён не вполне бесспорно; здесь они переданы консервативно по приведённому греческому тексту.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: из сыновей
  rationale: В перечне эта формула обозначает людей, происходящих из названного рода; буквальное и естественное русское соответствие — «из сыновей».
- source_word: Ζαμόθ
  choice: Замоф
  rationale: Имя передано непосредственно с греческой формы; θ закономерно передаётся через «ф», без согласования с параллельной еврейской традицией.
- source_word: Ἐλιάδας
  choice: Элиадас
  rationale: Сохранена эллинизированная форма имени и её конечное -с.
- source_word: Ἐλειάσειμος
  choice: Элеиасим
  rationale: Консервативная передача видимой греческой последовательности звуков с естественным для русского имени окончанием.
- source_word: Ὀθονίας
  choice: Офония
  rationale: Прямая передача греческого имени с θ как «ф»; форма не заменяется предполагаемым еврейским соответствием.
- source_word: Ἰαριμὼθ
  choice: Иаримоф
  rationale: Начальное Ἰ передано как «И», а θ как «ф»; сохранена именно греческая форма.
- source_word: Σάβαδος
  choice: Савадос
  rationale: Имя транслитерировано по греческому свидетелю, включая начальное Σ и эллинизированное окончание, без гармонизации с возможным «Завад».
- source_word: Ζεραλίας
  choice: Зералия
  rationale: Прямая передача греческой формы; возможное соответствие в еврейской традиции не подставляется вместо текста 1 Ездры.
