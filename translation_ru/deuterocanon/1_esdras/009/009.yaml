  text: and do his will[a], and separate yourselves from the nations of the land and from the foreigners.
translation:
  language: ru
  text: и исполните Его волю[a], и отделитесь от народов земли и от иноплеменников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейской параллели, Езд. 10, речь идёт конкретнее об иноплеменных женщинах (жёнах); здесь в 1 Ездры греческий текст употребляет более широкое выражение «иноплеменники».
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: исполните
  rationale: Аористный императив выражает прямое повеление; в сочетании с «волю» современное русское «исполните» естественнее буквального «сделайте».
- source_word: τὸ θέλημα αὐτοῦ
  choice: Его волю
  rationale: Устойчивое и прозрачное соответствие, сохраняющее отнесение воли к Богу по контексту; прописная буква следует русской библейской издательской норме.
- source_word: χωρίσθητε
  choice: отделитесь
  rationale: Форма среднего/страдательного залога в данном повелительном контексте естественно передаётся возвратным глаголом и сохраняет призыв к намеренному обособлению.
- source_word: ἀπὸ τῶν ἐθνῶν τῆς γῆς
  choice: от народов этой земли
  rationale: ἔθνη передано нейтральным «народы», без более поздней конфессиональной окраски слова «язычники»; γῆ обозначает местную землю, а указательное «этой» естественно выражает определённость сочетания.
- source_word: ἀπὸ τῶν ἀλλογενῶν
  choice: от иноплеменников
  rationale: ἀλλογενεῖς обозначает людей иного происхождения. «Иноплеменники» сохраняет отличие от более общего «народы» и не сужает греческое выражение до чужеземных женщин.
theological_decisions:
- issue: Соотношение широкого греческого выражения с параллелью в Ездре 10, где речь конкретно идёт об иноплеменных женщинах/жёнах
  choice: 'Сохранить в основном тексте широкую формулировку греческого свидетеля: «от народов этой земли и от иноплеменников».'
  alternative: «От народов этой земли и от иноплеменных женщин» или «от чужеземных жён».
  rationale: Для 1 Ездры первичным является греческий текст. Здесь он не называет ни женщин, ни жён, поэтому такое уточнение нельзя безоговорочно вносить в основной текст; более узкий смысл еврейской параллели отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Исполните Его волю» звучит естественно и повелительно; «иноплеменники» слегка возвышенно, но понятно и точно передаёт различие между ἀλλογενεῖς и более общим ἔθνη. Союзы сохранены в соответствии с греческой последовательностью.
