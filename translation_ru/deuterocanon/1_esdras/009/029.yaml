base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/029.yaml
  text: 'And from the sons of Bebai: Joannes and Ananias and Zabdos and Emathis[a].'
translation:
  language: ru
  text: 'И из сыновей Бевая: Иоанн, Анания, Завд и Емафис[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В приблизительном масоретском параллельном тексте некоторым из этих имён могут соответствовать иные еврейские формы; здесь имена переданы по греческому тексту: Иоанн, Анания, Завд и Емафис.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Βηβαί
  choice: И из сыновей Бевая
  rationale: Предлог ἐκ указывает на принадлежность к перечисляемой группе, а υἱῶν в родословных и списках может обозначать сыновей или потомков. Формулировка «из сыновей Бевая» сохраняет структуру греческого текста и естественна для библейского перечня.
- source_word: Ἰωάννης
  choice: Иоанн
  rationale: Использована закрепившаяся в русской библейской традиции форма греческого имени Ἰωάννης, без замены на предполагаемую еврейскую форму.
- source_word: Ἁνανίας
  choice: Анания
  rationale: Греческое имя передано его привычной русской библейской формой; форма «Ханания» сильнее отражала бы еврейский параллельный текст, тогда как основным источником здесь служит греческий.
- source_word: Ζάβδος
  choice: Завд
  rationale: Имя передано непосредственно с греческого с учетом русской библейской практики передачи β как «в»; оно не заменено именем из приблизительной масоретской параллели.
- source_word: Ἐμαθίς
  choice: Емафис
  rationale: Редкое имя консервативно транслитерировано по ясному греческому чтению; θ передано традиционным для библейских имен «ф».
