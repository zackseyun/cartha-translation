base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/019.yaml
  text: 'From the sons of Jeshua son of Jozadak and his brothers: Maelas[a], Eleazar, Joribus, and Joadanus.'
translation:
  language: ru
  text: 'Из сыновей Иисуса, сына Иоседека, и его братьев: Маэлас, Елеазар, Иорив и Иоадан.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте здесь приведены имена Маэлас, Иорив и Иоадан. В приблизительном еврейском параллельном месте (Езд. 10:18, 20–21) соответствующие имена отличаются, что отражает свободное соотношение между списками в 1 Ездры и масоретском тексте.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Из сыновей
  rationale: Сохраняет значение ἐκ и естественно вводит часть более обширного перечня.
- source_word: Ἰησοῦ
  choice: Иисуса
  rationale: Традиционная русская библейская передача имени Ἰησοῦ в данном послепленном контексте; речь идёт о первосвященнике Иисусе, сыне Иоседека.
- source_word: τοῦ Ἰωσεδὲκ
  choice: сына Иоседека
  rationale: Родительный падеж выражает отчество; форма «Иоседек» близка греческому свидетельству и узнаваема в русской библейской традиции.
- source_word: τῶν ἀδελφῶν αὐτοῦ
  choice: и его братьев
  rationale: Единственное число αὐτοῦ естественнее всего соотносится с Иисусом; буквальный смысл сохранён.
- source_word: Μαεήλας
  choice: Маэла
  rationale: Русская транслитерация греческой формы имени без согласования с отличающимся еврейским параллельным списком.
- source_word: Ἐλεάζαρος
  choice: Елеазар
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: Ἰώριβος
  choice: Иорив
  rationale: Передаёт имя греческого текста в естественной русской библейской форме, не подменяя его именем из приблизительной еврейской параллели.
- source_word: Ἰωάδανος
  choice: Иоадан
  rationale: Прямая русская передача греческой формы имени; расхождение с масоретским параллельным перечнем не сглаживается.
