base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/040.yaml
  text: And Ezra the chief priest brought the law before all the multitude[a], from man to woman, and all the priests, to hear the law, on the new moon of the seventh month.
translation:
  language: ru
  text: И Ездра, первосвященник, принёс Закон ко всему собранию — от мужчин до женщин — и ко всем священникам, чтобы они услышали Закон, в новомесячие седьмого месяца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейской параллели — Неемии 8:2–3 — состав слушателей описан иначе: мужчины, женщины и все способные понимать, а не «все священники».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκόμισεν
  choice: принёс
  rationale: Прямо передаёт значение «принести, доставить» и не добавляет отсутствующей в греческом тексте идеи торжественного представления.
- source_word: ὁ ἀρχιερεύς
  choice: первосвященник
  rationale: Это естественный и устойчивый русский эквивалент греческого титула ἀρχιερεύς в иудейском контексте.
- source_word: τὸν νόμον
  choice: Закон
  rationale: Греческий текст говорит просто о Законе, не добавляя слова «книга»; прописная буква указывает на Тору в данном контексте.
- source_word: παντὶ τῷ πλήθει
  choice: ко всему собранию
  rationale: Передаёт собравшееся множество людей естественнее для современного русского, чем буквальное «ко всему множеству».
- source_word: ἀπὸ ἀνθρώπου ἕως γυναικός
  choice: от мужчин до женщин
  rationale: Сохраняет охватывающую оба пола формулу греческого текста, избегая неестественного русского «от мужчины до женщины».
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: и ко всем священникам
  rationale: Следует основному греческому свидетелю, где прямо названы все священники, несмотря на отличие еврейской параллели.
- source_word: ἀκοῦσαι τὸν νόμον
  choice: чтобы они услышали Закон
  rationale: Ясно выражает цель действия; местоимение делает русскую синтаксическую связь естественной, не добавляя слова «чтение».
- source_word: νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: в новомесячие седьмого месяца
  rationale: «Новомесячие» точно обозначает день новолуния и сохраняет религиозно-календарный смысл без добавления слова «праздник».
theological_decisions:
- issue: Гендерное описание собравшихся
  choice: от мужчин до женщин
  alternative: от мужчины до женщины; и мужчин, и женщин
  rationale: Выбранная формулировка сохраняет выраженную в греческом тексте гендерную полноту аудитории и при этом звучит естественно по-русски.
- issue: Расхождение греческого текста и масоретской параллели в составе аудитории
  choice: и ко всем священникам
  alternative: и ко всем способным понимать
  rationale: Основным текстом для 1 Ездры служит греческое свидетельство, поэтому перевод следует чтению «священникам»; значимое отличие еврейской параллели вынесено в примечание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Первосвященник», «Закон» и «новомесячие» сохраняют историко-религиозную точность; синтаксис сделан ясным для современного читателя.
