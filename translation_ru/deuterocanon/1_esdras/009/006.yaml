base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/006.yaml
  text: And the whole assembly sat together in the open court of the temple[b][a], trembling because of the present storm.
translation:
  language: ru
  text: И всё собрание село вместе на просторном месте храмовой территории[a], дрожа от стоявшей тогда непогоды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на открытом месте храма» или «на просторной площади храмового комплекса». Греческое слово может обозначать широкое, открытое пространство на территории храма.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дрожа от наступившей зимы» или «от стоявшего тогда ненастья». Греческое слово может означать зиму, бурю или суровую погоду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκάθισαν
  choice: село вместе
  rationale: Передаёт конкретный образ совместно усевшегося собрания, не сводя глагол к более общему «собралось».
- source_word: πᾶν τὸ πλῆθος
  choice: всё собрание
  rationale: Обозначает всю собравшуюся массу людей; «собрание» естественно звучит в официально-общинном контексте.
- source_word: ἐν τῇ εὐρυχώρῳ
  choice: на открытом месте
  rationale: Субстантивированное обозначение широкого, просторного места; формулировка сохраняет некоторую неопределённость архитектурного смысла.
- source_word: τοῦ ἱεροῦ
  choice: при храме
  rationale: ἱερόν может обозначать храмовый комплекс, а не только внутреннее святилище; сочетание «при храме» указывает на пространство храмовой территории, не уточняя его как двор без достаточного основания.
- source_word: τρέμοντες
  choice: дрожа
  rationale: Сохраняет телесный образ греческого причастия; в контексте вероятны холод и ненастье, хотя оттенок страха полностью не исключён.
- source_word: τὸν ἐνεστῶτα χειμῶνα
  choice: от разыгравшейся непогоды
  rationale: χειμών допускает значения «зима», «буря», «ненастье»; ἐνεστῶτα описывает погоду, которая наступила и была налицо. «Разыгравшаяся непогода» естественно передаёт текущие суровые погодные условия.
