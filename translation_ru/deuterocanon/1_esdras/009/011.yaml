base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/011.yaml
  text: But the people are many[a], and it is the rainy season, and we are not able to stand outside[b]; and this is not a task of one day.
translation:
  language: ru
  text: Но народу много, и сейчас зимняя пора; мы не сможем стоять под открытым небом[a], да и дело это не на один день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Следом в греческом тексте стоят трудные для понимания слова «и мы не нашли» (καὶ οὐχ εὕρομεν). Возможно, текст в этом месте повреждён или неполон.
    reason: textual_variant
lexical_decisions:
- source_word: τὸ πλῆθος πολὺ
  choice: народу много
  rationale: Передаёт многочисленность собравшихся естественным современным русским языком, сохраняя собирательный смысл πλῆθος.
- source_word: ὥρα χειμερινή
  choice: сейчас зимняя пора
  rationale: Буквально речь идёт о зимнем времени или зимней погоде. Такой перевод сохраняет образ греческого текста и в контексте объясняет, почему нельзя долго оставаться снаружи.
- source_word: οὐκ ἰσχύσομεν στῆναι αἴθριοι
  choice: мы не сможем стоять под открытым небом
  rationale: ἰσχύω обозначает способность или физическую возможность, а αἴθριοι — пребывание на открытом воздухе, без укрытия.
- source_word: τὸ ἔργον ἡμῖν οὐκ ἔστιν ἡμέρας μιᾶς
  choice: дело это не на один день
  rationale: Естественная русская формулировка, точно передающая мысль о том, что работа не может быть завершена за один день.
- source_word: καὶ οὐχ εὕρομεν
  choice: не включено в основной текст; отмечено в сноске
  rationale: В дошедшем греческом тексте слова буквально означают «и мы не нашли», но синтаксически и по смыслу они не согласуются с контекстом. Неясное место не следует молча истолковывать или встраивать в связный текст ценой домысла.
theological_decisions:
- issue: Неясная греческая фраза καὶ οὐχ εὕρομεν
  choice: Не вводить предположительное толкование в основной текст, а открыто отметить проблему в сноске.
  alternative: 'Перевести буквально: «и мы не нашли»; либо реконструировать фразу по параллельному месту в Ездре 10:13.'
  rationale: Буквальный вариант здесь остаётся бессвязным, а реконструкция выдала бы предположение за установленный текст. Основной перевод передаёт надёжно читаемые греческие части стиха и сохраняет текстологическую неопределённость в примечании.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно возвышенный. Оборот «дело это не на один день» выбран как естественный русский эквивалент без излишней канцелярской или архаической окраски.
