base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/051.yaml
  text: Go your way[a], then[b], eat rich foods and send portions to those who have nothing.
translation:
  language: ru
  text: Идите же, ешьте отборные блюда[a] и пошлите порции тем, у кого ничего нет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жирные кушанья». Имеются в виду богатые, отборные яства для праздничной трапезы.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском параллельном тексте Неемии 8:10 сказано более конкретно: «тем, для кого ничего не приготовлено».'
    reason: alternative_reading
lexical_decisions:
- source_word: βαδίσαντες
  choice: идите
  rationale: Причастие буквально означает «пойдя», но вместе с последующими повелениями идиоматически выражает призыв отправиться и действовать; русское «идите» естественно передаёт это значение.
- source_word: οὖν
  choice: итак
  rationale: Союз обозначает вывод или переход к следующему наставлению; «итак» сохраняет логическую связь без излишней тяжеловесности.
- source_word: φάγετε
  choice: ешьте
  rationale: Прямое соответствие повелительной форме множественного числа.
- source_word: λιπάσματα
  choice: сытные блюда
  rationale: Слово обозначает жирную, обильную пищу, подходящую для праздничной трапезы. «Сытные блюда» понятно современному читателю и не создаёт неестественного образа «жирных вещей».
- source_word: ἀποστείλατε
  choice: пошлите
  rationale: Прямо передаёт повеление отправить что-либо другим.
- source_word: ἀποστολάς
  choice: доли
  rationale: В данном контексте речь идёт о выделенных долях праздничной еды. «Доли» сохраняет идею части, предназначенной другому, тогда как более общее «подарки» было бы менее точно.
- source_word: τοῖς μὴ ἔχουσιν
  choice: тем, у кого ничего нет
  rationale: Следует краткой греческой формулировке «не имеющим», не добавляя в основной текст уточнение «приготовлено», имеющееся в еврейском параллельном тексте.
theological_decisions:
- issue: Использование еврейского параллельного текста для уточнения социального смысла наставления
  choice: Повеление понято как призыв делиться долями праздничной пищи с теми, у кого ничего нет.
  alternative: 'Можно понимать фразу более неопределённо: посылать некие доли или предметы тем, кто чего-либо не имеет.'
  rationale: Греческий текст говорит о «долях» и «не имеющих», а параллель в Неемии 8:10 уточняет, что речь идёт о людях, для которых ничего не приготовлено. Основной перевод сохраняет краткость греческого текста, а уточнение выносится в примечание.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксис повелений сохранён; буквальное «жирное» заменено естественным выражением «сытные блюда», а более конкретное чтение еврейского параллельного текста отмечено в сноске.
