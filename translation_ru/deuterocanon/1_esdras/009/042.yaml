  yaml_path: translation/deuterocanon/1_esdras/009/042.yaml
  text: And Ezra the priest and reader of the law stood on the wooden platform that had been constructed;[a]
translation:
  language: ru
  text: И встал священник Ездра, чтец Закона, на сооружённом деревянном помосте.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском параллельном тексте Неемии 8:4 Ездра назван «книжником», а о деревянном сооружении сказано, что его сделали «для этого дела» или «для этого случая». В греческом тексте 1 Ездры он назван «священником, чтецом Закона», и сказано лишь, что помост был сооружён.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστη
  choice: встал
  rationale: Прямо передаёт повествовательный аорист ἵστημι и соответствует еврейской параллели ויעמד.
- source_word: Ἔσρας
  choice: Ездра
  rationale: Традиционная русская форма библейского имени.
- source_word: ὁ ἱερεύς
  choice: священник
  rationale: Греческий текст прямо называет Ездру священником; это чтение сохранено без гармонизации с масоретским «книжник».
- source_word: ἀναγνώστης τοῦ νόμου
  choice: чтец Закона
  rationale: ἀναγνώστης означает читающего, в том числе публичного чтеца. Формулировка сохраняет особенность греческого текста и не подменяет её еврейским «книжник».
- source_word: ἐπὶ τοῦ ξυλίνου βήματος
  choice: на деревянном помосте
  rationale: βῆμα здесь обозначает возвышение или площадку; «помост» естественно звучит в контексте публичного чтения.
- source_word: τοῦ κατασκευασθέντος
  choice: на сооружённом
  rationale: Причастие указывает, что деревянный помост был заранее изготовлен или сооружён; компактная русская конструкция сохраняет этот смысл.
