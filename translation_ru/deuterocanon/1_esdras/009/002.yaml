base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/002.yaml
  text: And lodging there[a], he tasted no bread and drank no water[b], mourning over the great lawless deeds of the multitude.
translation:
  language: ru
  text: И, оставшись там на ночь[a], он не вкусил хлеба и не пил воды, скорбя о великих беззакониях народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «расположившись там на ночлег»; греческое причастие означает, что он провёл ночь в этом месте.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском параллельном повествовании Ездры 10 речь идёт о браках с иноплеменными женщинами; греческий текст здесь обобщённо говорит о «беззакониях».
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλισθεὶς
  choice: оставшись там на ночь
  rationale: Причастие от αὐλίζομαι означает провести ночь или остановиться на ночлег; выбранная формулировка естественна по-русски и не уточняет без основания, был ли это дом или стан.
- source_word: ἄρτον οὐκ ἐγεύσατο
  choice: не вкусил хлеба
  rationale: Сохраняет конкретное «хлеб» и буквальное значение γεύομαι «вкушать, пробовать»; в контексте выражение обозначает пост.
- source_word: οὐδὲ ὕδωρ ἔπιεν
  choice: и не пил воды
  rationale: Прямо передаёт вторую часть формулы полного воздержания от пищи и питья.
- source_word: πενθῶν
  choice: скорбя
  rationale: Передаёт глубокую скорбь и покаянный оттенок πενθέω; в современном русском здесь звучит естественнее, чем более узкое «оплакивая».
- source_word: ἀνομιῶν τῶν μεγάλων
  choice: великих беззакониях
  rationale: «Беззакония» сохраняет связь ἀνομία с нарушением закона, а «великих» формально передаёт усилительное τῶν μεγάλων, не подменяя его толкованием «тяжких».
- source_word: τοῦ πλήθους
  choice: народа
  rationale: πλῆθος обозначает множество, совокупность людей; в данном общинном контексте «народ» естественно передаёт коллективный смысл, тогда как «толпа» создавала бы неверную ситуативную окраску.
theological_decisions:
- issue: Нравственно-богословская сила ἀνομία
  choice: беззакония
  alternative: преступления; неправедные дела
  rationale: Выбор сохраняет смысл поступков, противных Божьему закону, не сводя их к общему понятию зла и не привнося более поздних конфессиональных категорий.
- issue: Степень конкретизации проступка
  choice: обобщённая формулировка греческого текста
  alternative: уточнить как браки с иноплеменными женщинами по параллели Ездры 10
  rationale: Основным источником служит греческий текст, который говорит обобщённо о беззакониях; конкретизация вынесена в примечание, чтобы не заменять перевод параллельным свидетельством.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис следует греческой последовательности, но остаётся естественным; архаизмы сведены к понятному и уместному «вкусил».
