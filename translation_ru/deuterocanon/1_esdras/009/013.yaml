  text: the elders and the judges of each place[b][a], until the anger of the Lord over this matter is turned away from us.
translation:
  language: ru
  text: старейшин и судей каждой местности[a], пока гнев Господа за это дело не будет отведён от нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте это продолжение синтаксически незавершённой фразы предыдущего стиха.
    reason: cultural_note
