    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου τόπου
  choice: каждой местности
  rationale: Родительный оборот относится к «старейшинам и судьям» и сохраняет распределительное значение, не сужая τόπος до города или селения.
- source_word: πρεσβυτέρους
  choice: старейшин
  rationale: В административно-судебном контексте речь идёт о признанных руководителях общины, а не просто о пожилых мужчинах.
- source_word: κριτάς
  choice: судей
  rationale: Прямой и естественный эквивалент в данном правовом контексте; «начальники» или «должностные лица» были бы менее точны.
- source_word: ἕως τοῦ λῦσαι
  choice: пока ... не будет отведён
  rationale: Оборот обозначает предел или ожидаемый результат. Буквальное «развязать гнев» по-русски неестественно; «отвести гнев» передаёт его прекращение и удаление от общины, не уточняя невыраженного деятеля.
- source_word: ὀργὴν Κυρίου
  choice: гнев Господа
  rationale: «Гнев» — современный, ясный и достаточно сильный эквивалент ὀργή; κύριος передано традиционным и благоговейным «Господь».
- source_word: ἀφʼ ἡμῶν
  choice: от нас
  rationale: Сохраняет выраженное в греческом значение удаления от общины.
- source_word: τοῦ πράγματος τούτου
  choice: за это дело
  rationale: Сжатый родительный оборот естественно понимается как указание на причину гнева. Формулировка сохраняет связь с обсуждаемым проступком, не конкретизируя её сверх текста.
theological_decisions:
- issue: Передача κύριος применительно к Богу Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — обычное и контекстуально уместное обозначение Бога; оснований заменять его более узким по оттенку словом нет.
- issue: Сила значения ὀργή
  choice: гнев
  alternative: ярость
  rationale: «Гнев» сохраняет серьёзность Божьего суда, тогда как «ярость» усилила бы эмоциональную окраску греческого слова без необходимости.
- issue: Связь τοῦ πράγματος τούτου с Божьим гневом
  choice: гнев Господа за это дело
  alternative: гнев Господа по поводу этого дела
  rationale: Причинное понимание наиболее естественно в контексте, однако сжатость греческого родительного оборота допускает более общее указание на предмет гнева; это отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Поскольку греческий текст представляет собой фрагмент, зависимый от предыдущего стиха, синтаксическая незавершённость сохранена и пояснена в сноске. Пассивная конструкция не вводит отсутствующего в источнике деятеля.
