base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/032.yaml
  text: 'And from the sons of Annan: Eliodas[a], Asaiah, Melchiah, Sabbaias, and Simon Chosamaus.'
translation:
  language: ru
  text: 'И из сыновей Аннана[a]: Элиодас, Асаия, Мелхия, Саббаия и Симон Хосамаос.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые имена в этом перечне имеют соответствия в еврейской традиции книг Ездры и Неемии (например, Аннан — Ханан; Саббаия — Шаббетай). В основном тексте сохранены греческие формы 1 Ездры, а еврейские параллели используются лишь для сверки.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный соединительный союз, продолжающий перечисление.
- source_word: ἐκ τῶν υἱῶν
  choice: из сыновей
  rationale: В контексте родового списка оборот указывает на принадлежность названных людей к семейной группе и естественно передаётся по-русски как «из сыновей».
- source_word: Ἀννὰν
  choice: Аннана
  rationale: Имя передано по греческой форме основного источника; падежное окончание обусловлено русским синтаксисом. Еврейское соответствие «Ханан» не вносится в основной текст.
- source_word: Ἐλιωδὰς
  choice: Элиодас
  rationale: Прямая и прозрачная передача греческой формы имени.
- source_word: Ἀσαίας
  choice: Асаия
  rationale: Форма сохраняет греческое звучание и вместе с тем соответствует привычной русской передаче семитских имён на -ия.
- source_word: Μελχείας
  choice: Мелхия
  rationale: Передача опирается на греческую форму, не подменяя её более реконструированной еврейской формой.
- source_word: Σαββαίας
  choice: Саббаия
  rationale: Транслитерация греческого имени сохраняет удвоенное ββ и не заменяет его еврейским параллельным именем.
- source_word: Σίμων
  choice: Симон
  rationale: Устоявшаяся русская передача греческого имени.
- source_word: Χοσάμαος
  choice: Хосамаос
  rationale: Близкая транслитерация трудного имени из греческого текста; начальное Χ передано как «Х», а сочетание гласных сохранено без необоснованного сближения с иной традицией.
