  yaml_path: translation/deuterocanon/1_esdras/009/012.yaml
  text: not in two days, for we have sinned greatly in these matters. But let the leaders of the multitude stand, and let all those from our settlements who have foreign wives come at an appointed time,
translation:
  language: ru
  text: и не за два дня[a], потому что мы тяжко согрешили в этом. Пусть же предводители народа останутся, и пусть все из наших поселений[b], у кого жёны из других народов, придут в назначенное время[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не два»; из контекста подразумеваются два дня, за которые невозможно было завершить это дело.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «городов». Греческое слово обозначает населённые места или местные общины.'
    reason: lexical_alternative
  - marker: c
    text: 'Греческое выражение сжато: буквально «получив время», то есть получив отведённый или назначенный срок для явки.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ δύο
  choice: и не за два дня
  rationale: 'Оборот эллиптичен и продолжает мысль предыдущего стиха: дело невозможно завершить за два дня. Союз «и» передаёт присоединительную силу οὐδέ.'
- source_word: ἐπὶ πλεῖον ἡμάρτομεν
  choice: мы тяжко согрешили
  rationale: ἐπὶ πλεῖον обозначает значительную степень проступка; «тяжко» естественно сочетается с «согрешили» и сохраняет нравственно-религиозную силу выражения.
- source_word: ἐν τούτοις
  choice: в этом
  rationale: Указательное местоимение отсылает к обсуждаемому делу о браках с иноплеменными; краткое «в этом» не добавляет отсутствующей в греческом конкретизации.
- source_word: οἱ προηγούμενοι τοῦ πλήθους
  choice: предводители народа
  rationale: Причастие обозначает тех, кто идёт впереди и руководит; πλήθος здесь — собравшийся народ или община. «Предводители народа» понятно и сохраняет руководящую функцию.
- source_word: στήτωσαν
  choice: пусть ... останутся
  rationale: Буквально глагол значит «пусть стоят», но в данном контексте речь, вероятно, о том, чтобы руководители оставались и действовали от имени собрания. Перевод не превращает их прямо в назначенных судей.
- source_word: οἱ ἐκ τῶν κατοικιῶν ἡμῶν
  choice: все из наших поселений
  rationale: κατοικίαι обозначает населённые места или местные общины, а не отдельные жилища.
- source_word: γυναῖκας ἀλλογενεῖς
  choice: жёны из других народов
  rationale: ἀλλογενής указывает на принадлежность к иному народу или роду. Такой перевод точнее современного «иностранные жёны», которое может подразумевать гражданство.
- source_word: παραγενηθήτωσαν
  choice: пусть ... придут
  rationale: Передаёт основное значение прибытия или явки; административный оттенок понятен из контекста.
- source_word: λαβόντες χρόνου
  choice: в назначенное время
  rationale: Греческое выражение сжато, буквально — «получив время». В контексте оно указывает на отведённый каждому срок явки.
theological_decisions:
- issue: Нравственная характеристика проступка
  choice: мы тяжко согрешили в этом
  alternative: мы совершили в этом большой проступок
  rationale: Глагол ἁμαρτάνω прямо выражает понятие греха. Перевод сохраняет нравственно-религиозную оценку текста, не сводя её к административному нарушению.
- issue: Характер жён, названных ἀλλογενεῖς
  choice: жёны из других народов
  alternative: чужеземные жёны
  rationale: Формулировка передаёт этническую или народную принадлежность, но не добавляет более поздних конфессиональных либо расовых категорий.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет незавершённость стиха и конечную запятую, поскольку предложение продолжается в следующем стихе. Лексика избегает архаизмов вроде «иноплеменные», но сохраняет религиозно-нравственную силу слова «согрешили».
