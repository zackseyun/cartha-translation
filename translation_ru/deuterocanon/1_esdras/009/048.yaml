base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/048.yaml
  text: Jeshua and Anniuth and Sherebiah[a], Jadinus, Jarsubus, Abteus, Autaias, Maiannas and Kelitas, Azariah, Katezabdus, Annas, Phalias—the Levites—
translation:
  language: ru
  text: Иешуа, Анниут и Шеревия[a], Иадин, Иарсув, Автей, Автай, Майаннас и Калита, Азария, Катетзавд, Анна, Фалия — левиты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Передача ряда имён в этом стихе текстологически неясна. Некоторые из них могут соответствовать списку левитов в Неемии 8:7, где встречаются, среди прочих, Шавтай, Годия и Маасея. В основном тексте преимущественно сохранены формы, основанные на греческом свидетельстве; семитская форма принята лишь там, где соответствие особенно убедительно.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Иешуа
  rationale: В контексте Ездры—Неемии это историческое личное имя, соответствующее еврейскому יֵשׁוּעַ; форма «Иешуа» позволяет не смешивать его с новозаветным употреблением имени «Иисус».
- source_word: Σαραβίας
  choice: Шеревия
  rationale: Греческая форма соотносится с известным по Ездре—Неемии левитом שֵׁרֵבְיָה; поэтому выбрана узнаваемая семитская форма имени.
- source_word: Ἀννιοὺθ; Ἰάδεινος; Ἰαρσούβοος; Ἀβταῖος; Αὐταίας; Μαιάννας; Καλείτας
  choice: Анниут; Иадин; Иарсув; Автей; Автай; Майанна; Калита
  rationale: Из-за неуверенности в отождествлении этих имён с именами масоретского списка использованы близкие к греческому свидетелю русские формы без предположительной гармонизации.
- source_word: Ἀζαρίας
  choice: Азария
  rationale: Обычная русская библейская передача соответствующего семитского имени.
- source_word: Κατέθζαβδος
  choice: Катетзавд
  rationale: Хотя форма, вероятно, искажена при передаче и может соответствовать Иозаваду, основной текст консервативно следует данному греческому чтению.
- source_word: Ἄννας; Φαλίας
  choice: Анна; Фалия
  rationale: Переданы непосредственно по греческому тексту; возможные соответствия Ханану и Фелаии не внесены в основной текст.
- source_word: οἱ Λευεῖται
  choice: левиты
  rationale: Естественная русская передача названия группы; определённость выражена его приложением к предшествующему перечню.
