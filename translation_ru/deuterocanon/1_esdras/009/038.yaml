  yaml_path: translation/deuterocanon/1_esdras/009/038.yaml
  text: And all the multitude gathered together with one accord in the open square of the eastern gate of the temple,[a]
translation:
  language: ru
  text: И всё множество единодушно собралось на просторной площади у восточных ворот храма.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на просторном месте у храмовых ворот, обращённых на восток».'
    reason: Греческое выражение допускает более буквальную передачу εὐρύχωρον как «просторное место», а πρὸς ἀνατολάς — как указание на обращённость ворот к востоку.
lexical_decisions:
- source_word: συνήχθη
  choice: собралось
  rationale: Аорист пассивной формы συνάγω здесь естественно передаётся возвратным глаголом «собралось», обозначающим сход множества в одно место.
- source_word: πᾶν τὸ πλῆθος
  choice: всё множество
  rationale: Сохраняет собирательное единственное число и значение многочисленной группы; формулировка имеет достойный библейский регистр, оставаясь понятной современному читателю.
- source_word: ὁμοθυμαδόν
  choice: единодушно
  rationale: Передаёт не только совместность действия, но и согласие, общий порыв участников.
- source_word: ἐπὶ τὸ εὐρύχωρον
  choice: на просторной площади
  rationale: εὐρύχωρον обозначает широкое открытое пространство; «просторная площадь» естественно передаёт конкретное общественное место, а ἐπί с винительным при глаголе движения отражено конструкцией «собралось на».
- source_word: τοῦ πρὸς ἀνατολὰς ἱεροῦ πυλῶνος
  choice: у восточных ворот храма
  rationale: Передаёт храмовую принадлежность ворот и их расположение или направленность к востоку. Русское «ворота» обычно употребляется во множественном числе, хотя греческое πυλών грамматически стоит в единственном.
