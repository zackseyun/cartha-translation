base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/047.yaml
  text: And all the assembly cried out, “Amen, amen,” and lifting up their hands, they fell to the ground and worshiped God.
translation:
  language: ru
  text: 'И всё собрание воскликнуло: «Аминь, аминь!» Затем они подняли руки, пали на землю и поклонились Богу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: воскликнуло
  rationale: Глагол обозначает громкое, отчётливое произнесение; в данном контексте это единый торжественный отклик всего собрания.
- source_word: πᾶν τὸ πλῆθος
  choice: всё собрание
  rationale: Слово πλῆθος указывает на множество людей, а «собрание» естественно передаёт здесь общину, собравшуюся для богослужения.
- source_word: Ἀμήν, ἀμήν
  choice: Аминь, аминь
  rationale: Сохранена традиционная форма литургического подтверждения; перевод «истинно» не соответствовал бы функции ответа собрания.
- source_word: ἄραντες ἄνω τὰς χεῖρας
  choice: подняли руки
  rationale: Естественная русская передача жеста; направление вверх уже выражено глаголом «подняли», поэтому отдельное «вверх» избыточно.
- source_word: προσπεσόντες ἐπὶ τὴν γῆν
  choice: пали на землю
  rationale: Фраза ясно передаёт телесное действие и сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: προσεκύνησαν
  choice: поклонились
  rationale: В сочетании с дательным τῷ θεῷ и предшествующим падением ниц слово обозначает религиозное поклонение; русский глагол сохраняет и богослужебный смысл, и связь с телесным жестом.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж обозначает адресата поклонения; имя нарицательное пишется с прописной буквы как прямое обозначение единого Бога.
theological_decisions:
- issue: Передача сочетания падения на землю и προσκυνέω
  choice: «пали на землю и поклонились Богу»
  alternative: «пали ниц на землю и воздали поклонение Богу»
  rationale: Перевод сохраняет два последовательных элемента греческого текста — телесное падение и направленный к Богу акт поклонения, не сводя второй лишь к позе и не добавляя отсутствующего в источнике «воздали».
- issue: Соотношение греческого текста и приведённой приблизительной масоретской параллели
  choice: Следовать греческой сцене общего литургического отклика
  alternative: Включить формулировки о чтении и понимании закона из масоретского текста
  rationale: Предоставленный еврейский параллельный текст содержательно не соответствует данному стиху; поэтому он не влияет на перевод, первичным свидетельством остаётся полный и уверенно засвидетельствованный греческий текст.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан плавным: греческие причастия переданы последовательными личными формами, а «затем» явно обозначает переход от возгласа к жестам поклонения без изменения событийной логики.'
