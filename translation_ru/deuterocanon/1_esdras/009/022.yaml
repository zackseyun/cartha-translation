base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/022.yaml
  text: 'And from the sons of Phaisour: Elionais[a], Asseias, Ismaēlos, Nathanaēlos, Okaēlēdos[c][b], and Salthas.'
translation:
  language: ru
  text: 'И из сыновей Файсура[a]: Элионаис, Ассеяс, Исмаил, Нафанаил, Окаиледос[b][c] и Салфас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — Файсур; в приблизительной еврейской параллели этому имени соответствует Пашхур.
    reason: alternative_reading
  - marker: b
    text: Имя Окаиледос следует греческому свидетельству этого места; приблизительная еврейская параллельная традиция, возможно, указывает на другое исходное имя, которое иногда отождествляют с Иозавадом.
    reason: textual_variant
  - marker: c
    text: Некоторые имена в этом стихе имеют греческие формы, не вполне совпадающие с именами в приблизительной еврейской параллели. В основном тексте сохранены греческие формы, поскольку перевод 1 Ездры выполнен по Септуагинте.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: из сынов
  rationale: Формула обозначает людей, выделенных из данного рода; краткое «из сынов» сохраняет структуру греческого перечня и естественно звучит по-русски.
- source_word: Φαισούρ
  choice: Файсур
  rationale: Имя передано по греческому тексту с сохранением дифтонга αι; форма приблизительного еврейского соответствия не внесена в основной текст.
- source_word: Ἐλιωναίς
  choice: Элионаис
  rationale: Прямая и понятная русская транслитерация греческой формы имени без согласования с предположительным еврейским эквивалентом.
- source_word: Ἀσσείας
  choice: Ассеяс
  rationale: Передаёт удвоенную сигму и окончание греческой формы в удобочитаемом русском написании.
- source_word: Ἰσμαήλος
  choice: Исмаил
  rationale: Использована укоренившаяся русская передача этого имени, точно соответствующая узнаваемой греческой форме.
- source_word: Ναθανάηλος
  choice: Нафанаил
  rationale: Применена традиционная и общепонятная русская передача греческих θ и η в данном библейском имени.
- source_word: Ὠκαιληδός
  choice: Окаилед
  rationale: Трудное имя передано непосредственно по греческому свидетельству Свита, без подмены именем из приблизительной параллельной традиции.
- source_word: Σάλθας
  choice: Салфас
  rationale: Греческая форма сохранена в русской передаче с обычным соответствием θ — «ф».
