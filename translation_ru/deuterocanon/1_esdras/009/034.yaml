base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/034.yaml
  text: 'And from the sons of Baanei: Jeremias[a], Momdios, Maeros, Jouna, Mamdai, and Pedias, and Anos, Carabasion, and Enaseibos, and Mamntanaimos, Eliaseis, Bannous, Edialeis, Someis, Selemias, Nathanias; and from the sons of Exora: Seseis, Ezreil, Azaelos, Samatos, Zambrei[b], Phosepos.'
translation:
  language: ru
  text: 'И из сыновей Баанея: Иеремия[a], Момдейос, Маэрос, Иуна, Мамдай и Педия, и Анос, Карабасион и Энасейбос, и Мамнтанаимос, Элиасейс, Баннус, Эдиалейс, Сомейс, Селемия, Натания; и из сыновей Эксоры: Сесей, Эзреил, Азаэлос, Саматос, Замбрей[b], Фосепос.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые имена в этом стихе переданы близко к их греческому написанию, а не приведены к более знакомым еврейским формам из параллельной традиции, поскольку основным источником для перевода служит греческий текст 1 Ездры.
    reason: lexical_alternative
  - marker: b
    text: Параллельный масоретский текст в контексте Ездры 10 лишь приблизительно соответствует этому месту и не сохраняет ту же полную последовательность имен в тех же формах; поэтому здесь перевод следует греческому перечню.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: И из сыновей
  rationale: Сохраняет вводную формулу и родословную структуру греческого перечня, оставаясь естественным по-русски.
- source_word: Βαανεί
  choice: Баанея
  rationale: Имя передано непосредственно с греческого; падежная форма обусловлена русским оборотом «из сыновей».
- source_word: Ἰερεμίας
  choice: Иеремия
  rationale: Греческая форма имени передана в принятой русской библейской форме без подмены другим именем из параллельной традиции.
- source_word: Μομδείοσ
  choice: Момдей
  rationale: Читаемая русская транслитерация трудной греческой формы Μομδεῖος/Μομδείοσ с сохранением ее основных звуковых элементов.
- source_word: Μάηρος
  choice: Маэр
  rationale: Близкая передача греческой формы без необоснованного отождествления с более известным еврейским именем.
- source_word: Ἰουνά
  choice: Иуна
  rationale: Сохраняет греческое начертание имени и отличает его от возможной гармонизации с именем Иона.
- source_word: Μαμδαὶ
  choice: Мамдай
  rationale: Прямая кириллическая транслитерация греческого имени.
- source_word: Πεδίας
  choice: Педия
  rationale: Передает именно греческую форму, не гармонизируя ее с предполагаемой еврейской формой Федаия.
- source_word: Ἄνως
  choice: Анос
  rationale: Прямая передача греческого имени в естественной русской графике.
- source_word: Καραβασιὼν
  choice: Карабасион
  rationale: Близкая кириллическая транслитерация редкого греческого имени.
- source_word: Ἐνάσειβος
  choice: Энасейбос
  rationale: Неясное имя сохранено максимально близко к первичному греческому свидетелю.
- source_word: Μαμντάναιμος
  choice: Мамнтанаимос
  rationale: Необычная последовательность согласных сохранена, поскольку сглаживание имени не имеет надежного текстового основания.
- source_word: Ἐξορά
  choice: Эксора
  rationale: Передает греческую форму имени; в тексте употреблен требуемый русским синтаксисом родительный падеж «Эксоры».
- source_word: Ζαμβρεί
  choice: Замврей
  rationale: Прямая передача греческой формы с русским соответствием β как «в».
- source_word: Φόσηπος
  choice: Фосеп
  rationale: Сохраняет засвидетельствованную греческую форму и не заменяет ее более привычным именем Иосиф.
