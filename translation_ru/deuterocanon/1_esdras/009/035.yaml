base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/035.yaml
  text: 'From the sons of Ooma: Zeitias[a], Zabadias, Edos, Ouel[b], and Banaias.'
translation:
  language: ru
  text: 'Из рода Оомы[a]: Зеития, Завадайя, Эдос, Уэл и Ванайя[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая конструкция указывает на тех, кто принадлежит Ооме; в данном перечне подразумевается его дом или род, а не обязательно только непосредственные сыновья.
    reason: cultural_note
  - marker: b
    text: Греческий текст перечисляет эти имена по отдельности. Приблизительное соответствие в Езд 10 в этом месте завершает раздел итоговым сообщением и не сохраняет того же перечня.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ
  choice: из
  rationale: Предлог вводит очередную родовую группу внутри перечня; русское «из» естественно передаёт эту функцию.
- source_word: τῶν Ὀομά
  choice: рода Оомы
  rationale: Артикль с именем после ἐκ употреблён эллиптически и обозначает людей, принадлежащих дому или роду Оомы. Формулировка «из рода Оомы» раскрывает подразумеваемую связь, не утверждая, что все перечисленные непременно были его непосредственными сыновьями.
- source_word: Ζειτιάς
  choice: Зеития
  rationale: Имя передано по греческой форме; сочетание ει сохранено как «еи», а окончание приспособлено к естественной русской форме библейского имени.
- source_word: Ζαβαδαίας
  choice: Завадая
  rationale: Транслитерация следует греческому имени, включая обычную для библейской русской традиции передачу β через «в», без подмены реконструированной еврейской формой.
- source_word: Ἠδός
  choice: Эдос
  rationale: Читаемая русская передача греческой формы имени без необязательных диакритических знаков.
- source_word: Οὐὴλ
  choice: Уил
  rationale: Начальное Οὐ- передано как «У», а имя дано в компактной русской форме, сохраняющей греческое свидетельство.
- source_word: Βαναίας
  choice: Ванайя
  rationale: Передача основана на греческой форме Βαναίας и не нормализована по предполагаемому еврейскому соответствию.
