base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/007.yaml
  text: And Ezra rose and said to them[a], “You have acted lawlessly and have married foreign women, adding sin to Israel.”
translation:
  language: ru
  text: 'И Ездра встал и сказал им: «Вы поступили беззаконно и стали жить с иноплеменными женщинами[a], умножив грех Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женились на иноплеменных женщинах»; «взяли в жёны иноплеменных женщин». Греческий глагол буквально означает «жить вместе», но в этом контексте относится к брачным союзам с женщинами из других народов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: встал
  rationale: Причастие аориста от ἀνίστημι передаёт действие, вводящее речь Ездры; «встал» кратко и естественно сохраняет движение повествования.
- source_word: ἠνομήσατε
  choice: поступили беззаконно
  rationale: Глагол ἀνομέω указывает на поступок вопреки закону; эта формулировка сохраняет правовой оттенок, не сводя его к более общему «согрешили».
- source_word: συνῳκίσατε
  choice: стали жить с
  rationale: Глагол обозначает совместную жизнь и в данном контексте подразумевает брачные союзы. Основной текст сохраняет формальную широту греческого выражения, а примечание разъясняет контекстуально вероятный брачный смысл.
- source_word: γυναιξὶν ἀλλογενέσιν
  choice: с иноплеменными женщинами
  rationale: ἀλλογενής означает принадлежность к другому народу. «Иноплеменные» точно передаёт этническую, а не просто географическую чуждость и уместно в достойном современном библейском регистре.
- source_word: προσθεῖναι ἁμαρτίαν τῷ Ἰσραήλ
  choice: прибавив Израилю греха
  rationale: Формулировка сохраняет образ прибавления и дательный τῷ Ἰσραήλ, передавая корпоративное последствие поступка для Израиля.
theological_decisions:
- issue: Следует ли прямо обозначить брачный смысл συνῳκίσατε
  choice: «стали жить с» с пояснением в сноске
  alternative: «женились на иноплеменных женщинах»; «взяли в жёны иноплеменных женщин»
  rationale: Контекст книги и параллельная еврейская традиция говорят о браках, однако греческий глагол непосредственно выражает совместную жизнь. Перевод не устраняет эту лексическую широту, но сообщает читателю контекстуальный смысл.
- issue: Корпоративный характер греха
  choice: «прибавив Израилю греха»
  alternative: «умножив грех Израиля»; «навлекли вину на Израиль»
  rationale: Греческий текст представляет поступок как добавление греха Израилю в целом. Выбранная формулировка сохраняет корпоративное измерение без уточнения того, идёт ли речь преимущественно о грехе или о вине.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Иноплеменные» выбрано вместо бытового «иностранные», поскольку речь идёт о женщинах из других народов; синтаксис остаётся ясным для современного читателя.
