base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/050.yaml
  text: This day is holy to the Lord[a], and all were weeping when they heard the law.
translation:
  language: ru
  text: Этот день свят для Господа[a], и все плакали, слушая закон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейской параллели, Неем. 8:10, сказано «для нашего Господа», после чего следует призыв есть, пить, делиться пищей и не печалиться. Здесь греческий текст 1 Ездры короче.
    reason: cross_reference
lexical_decisions:
- source_word: Ἡ ἡμέρα αὕτη
  choice: Этот день
  rationale: Прямо передаёт указательное значение греческого выражения и естественно звучит по-русски.
- source_word: ἁγία
  choice: свят
  rationale: Обычный религиозный эквивалент, сохраняющий смысл посвящённости Богу.
- source_word: τῷ κυρίῳ
  choice: для Господа
  rationale: Дательный падеж выражает отношение посвящённости; вариант «для Господа» естественен в современном русском. Отсутствующее в греческом «нашего» не добавляется.
- source_word: πάντες
  choice: все
  rationale: Сохраняет краткость и собирательность оригинала, не добавляя слова «народ».
- source_word: ἔκλαιον
  choice: плакали
  rationale: Русский глагол несовершенного вида передаёт продолженное значение греческого имперфекта.
- source_word: ἐν τῷ ἀκοῦσαι
  choice: слушая
  rationale: 'Деепричастная конструкция естественно передаёт временное значение: плач происходил при слушании закона. Греческий аорист инфинитива допускает также «услышав» или «когда услышали».'
- source_word: τὸν νόμον
  choice: закон
  rationale: Прямой эквивалент νόμος в контексте публичного чтения Торы; строчная буква не навязывает дополнительного типографского толкования.
theological_decisions:
- issue: Следует ли включать отсутствующие в греческом тексте подробности масоретской параллели, в частности «нашего Господа» и последующее увещание не печалиться
  choice: Сохранить краткое чтение греческого текста без добавлений
  alternative: Расширить стих по Неемии 8:10, добавив «нашего» и последующее увещание
  rationale: Основным источником служит греческий текст 1 Ездры. Еврейская параллель подтверждает общий контекст, но её более пространное чтение нельзя молча вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и торжественное, без архаизмов. Синтаксис сохраняет две части греческого предложения и его лаконичность.
