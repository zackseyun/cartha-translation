  source_fidelity: 'Текст точно передаёт греческий оригинал: «Этот день» соответствует Ἡ ἡμέρα αὕτη, «свят для Господа» адекватно выражает ἁγία τῷ κυρίῳ, а «все плакали, слушая закон» сохраняет πάντες, имперфект ἔκλαιον и временную конструкцию ἐν τῷ ἀκοῦσαι τὸν νόμον. Добавления из масоретской параллели отсутствуют.'
