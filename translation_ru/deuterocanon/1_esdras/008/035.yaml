base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/035.yaml
  text: 'From the sons of Joab: Abadias son of Iezelus[a], and with him two hundred twelve men.'
translation:
  language: ru
  text: 'Из сыновей Иоава: Авадия, сын Иезила[a], и с ним двести двенадцать мужчин.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском параллельном тексте Ездры 8:12 это место читается иначе: там назван потомок Елама и указаны семьдесят мужчин. Здесь перевод следует греческому тексту 1 Ездры и не согласует его с еврейской параллелью.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἰωάβ
  choice: Из сыновей Иоава
  rationale: Сохраняет буквальную форму греческого текста и характер перечня; «сыновья» в родословном контексте может обозначать потомков или представителей рода.
- source_word: Ἀβαδίας
  choice: Авадия
  rationale: Имя передано по греческой форме, без согласования с отличающимся еврейским параллельным текстом.
- source_word: Ἰεζήλου
  choice: Иезила
  rationale: Родительный падеж греческого имени передан естественной русской формой «Иезила»; сохранено чтение основного греческого свидетеля.
- source_word: καὶ μετʼ αὐτοῦ
  choice: и с ним
  rationale: Прямой и естественный перевод оборота в контексте списка возвратившихся.
- source_word: ἄνδρες
  choice: мужчин
  rationale: Греческое ἄνδρες обычно означает взрослых мужчин; перевод не подменяется более биологическим «самцов» из отличающейся еврейской параллели.
- source_word: διακόσιοι δέκα δύο
  choice: двести двенадцать
  rationale: Точно передаёт числовое значение греческого текста.
