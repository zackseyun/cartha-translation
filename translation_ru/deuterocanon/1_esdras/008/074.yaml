revisions:
- from: И за наши грехи и грехи наших отцов мы вместе с нашими братьями, нашими царями и нашими священниками были преданы царям земли[a] — мечу, плену и разграблению[b], покрывшему нас позором, — вплоть до нынешнего дня.
  to: Из-за наших грехов и грехов наших отцов мы — вместе с нашими братьями, нашими царями и нашими священниками — были отданы во власть царей земли[a], на меч, в плен и на разграбление, с позором, до нынешнего дня.
  rationale: 'Правка сохраняет все смысловые элементы оригинала, но исправляет сферу действия «с позором»: позор сопровождает всю описанную участь, а не только разграбление. Также «отданы во власть» точнее передаёт пассив παραδίδωμι. Сноска b сохраняется как допустимое лексическое пояснение к «разграблению», хотя в самом тексте маркер не требуется: она относится к этому слову и может быть поставлена после него, если вёрстка проекта требует обязательной привязки.'
