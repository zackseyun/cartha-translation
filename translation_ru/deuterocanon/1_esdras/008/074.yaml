  source_fidelity: 'Основной смысл передан верно: причинная связь грехов нынешнего поколения и отцов, включённость всех общественных групп, передача во власть царей, перечень бедствий и их продолжение до дня говорящего сохранены. Однако «покрывшему нас позором» грамматически относит позор только к «разграблению», тогда как греческое μετὰ αἰσχύνης является обстоятельством, сопровождающим всю участь народа.'
