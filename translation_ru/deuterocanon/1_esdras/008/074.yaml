base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/074.yaml
  text: And because of our sins and the sins of our fathers[a], we were handed over, together with our brothers, our kings, and our priests, to the kings of the earth, to the sword and captivity and plundering with shame[b], to this present day.
translation:
  language: ru
  text: Из-за наших грехов и грехов наших отцов мы — вместе с нашими братьями, нашими царями и нашими священниками — были отданы во власть царей земли[a], на меч, в плен и на разграбление, с позором, до нынешнего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царей страны». Греческое γῆ может означать как землю вообще, так и определённую страну или территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: за наши грехи и грехи наших отцов
  rationale: διά с винительным падежом выражает причину. Русское «за» естественно передаёт мысль о последствиях греха, сохраняя прямое упоминание вины нынешнего поколения и предков.
- source_word: παρεδόθημεν
  choice: мы были преданы
  rationale: Страдательная форма παραδίδωμι означает передачу во власть других. «Были преданы» сохраняет серьёзность и судебно-исторический оттенок выражения.
- source_word: σὺν τοῖς ἀδελφοῖς ἡμῶν, σὺν τοῖς βασιλεῦσιν ἡμῶν καὶ σὺν τοῖς ἱερεῦσιν ἡμῶν
  choice: вместе с нашими братьями, нашими царями и нашими священниками
  rationale: Однократное «вместе с» естественно объединяет три группы и не устраняет буквальное значение ἀδελφοί — «братья».
- source_word: τοῖς βασιλεῦσιν τῆς γῆς
  choice: царям земли
  rationale: γῆ допускает значения «земля» в широком смысле и «страна, земля» как территория. Основной текст сохраняет краткую библейскую формулу, а примечание отмечает альтернативу.
- source_word: εἰς ῥομφαίαν καὶ αἰχμαλωσίαν καὶ προνομὴν
  choice: мечу, плену и разграблению
  rationale: Три однородных существительных сохраняют перечень бедствий. «Меч» передаёт гибель от войны, «плен» — состояние захваченных, «разграбление» — предание добыче и грабежу.
- source_word: μετὰ αἰσχύνης
  choice: покрывшему нас позором
  rationale: Буквальное «с позором» по-русски не вполне ясно примыкает к перечню. Причастный оборот естественно передаёт сопутствующее разграблению унижение; местоимение «нас» следует из формы «мы были преданы».
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: вплоть до нынешнего дня
  rationale: Формула подчёркивает, что последствия прежнего суда продолжаются до настоящего момента говорящего.
theological_decisions:
- issue: Совместная вина нынешнего поколения и предков
  choice: Сохранено прямое выражение «наши грехи и грехи наших отцов».
  alternative: Смягчить до «грехи нашего народа в прежние времена».
  rationale: Греческий текст явно называет как грехи говорящих, так и грехи их отцов причиной постигшего общину бедствия. Перевод сохраняет эту напряжённую идею поколенческой и общинной ответственности, не объясняя её в рамках отдельной богословской системы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис остаётся близким к греческому перечню, но тире и причастный оборот делают длинное предложение ясным для современного читателя.
