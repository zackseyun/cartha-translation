lexical_decisions:
- source_word: ἄνδρα ἐπιστήμονα
  choice: человека разумного
  rationale: Сохраняет мужской род и значение человека, обладающего разумением и знанием; соответствует также еврейскому параллельному выражению אִישׁ שֶׂכֶל.
- source_word: τῶν υἱῶν Μοολὶ
  choice: из сыновей Мооли
  rationale: Передаёт формальную родословную формулу греческого текста; имя транслитерировано по основному греческому источнику.
- source_word: τοῦ Λευὶ τοῦ Ἰσραήλ
  choice: сына Левия, сына Израиля
  rationale: Явно выражает родословную цепочку, подразумеваемую последовательностью греческих генитивов и подтверждаемую еврейской параллелью.
- source_word: Ἀσεβηβίαν
  choice: Асевевию
  rationale: Имя передано по греческой форме и поставлено в винительном падеже в соответствии с синтаксисом фрагмента.
- source_word: τοὺς υἱοὺς καὶ τοὺς ἀδελφοὺς
  choice: его сыновей и братьев
  rationale: Притяжательное местоимение естественно проясняет, что речь идёт о сыновьях и братьях Асевевии, не изменяя смысла греческой конструкции.
- source_word: δέκα
  choice: десять человек
  rationale: Основной греческий текст содержит число «десять»; слово «человек» добавлено для естественного русского обозначения общего числа названных мужчин.
