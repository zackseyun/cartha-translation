  - severity: low
    issue: Управление «наставляя ... в постановлениях» менее естественно.
    rationale: 'При передаче подразумеваемого обучения нормативнее и яснее: «наставляя весь Израиль постановлениям и судебным решениям». Добавление глагола остаётся интерпретационным и потому должно быть отмечено сноской.'
