  rationale: 'Перевод уточнён минимально: «чтобы» сохраняет целевой или результативный характер греческой инфинитивной конструкции, не навязывая однозначную причинную связь; управление при «наставляя» приведено к естественной современной норме. Сноски сохранены, поскольку они честно обозначают как расхождение имени с еврейским параллельным контекстом, так и синтаксическую неопределённость греческого окончания.'
