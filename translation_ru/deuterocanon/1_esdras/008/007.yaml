base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/007.yaml
  text: For Apsaras had great learning[a], so as to leave out nothing from the law of the Lord and from the commandments[b], teaching all Israel the statutes and the judgments.
translation:
  language: ru
  text: Ибо Апсарас[a] обладал обширными познаниями, чтобы ничего не упускать из закона Господа и из заповедей, наставляя весь Израиль постановлениям и судебным решениям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — «Апсарас». В соответствующем еврейском контексте речь идёт о Ездре, однако основной греческий источник сохраняет здесь имя в такой форме.
    reason: alternative_reading
  - marker: b
    text: 'Конец греческой фразы синтаксически сжат; буквально последовательность слов близка к: «…ничего не упускать из закона Господа и из заповедей, весь Израиль, постановления и судебные решения». Слово «наставляя» добавлено для передачи вероятного смысла.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀψάρας
  choice: Апсарас
  rationale: Имя передано транслитерацией по основному греческому свидетелю, без гармонизации с Ездрой в еврейском параллельном контексте.
- source_word: πολλὴν ἐπιστήμην περιεῖχεν
  choice: обладал обширными познаниями
  rationale: Оборот означает обладание значительными знаниями или учёностью; выбран естественный современный русский эквивалент в достойном регистре.
- source_word: εἰς τὸ μηδὲν παραλείπειν
  choice: и потому ничего не упускал
  rationale: Конструкция может выражать цель или следствие; здесь естественно передано вероятное следствие его познаний, а παραλείπειν — как «упускать».
- source_word: τῶν ἐκ τοῦ νόμου Κυρίου καὶ ἐκ τῶν ἐντολῶν
  choice: из закона Господа и из заповедей
  rationale: Сохранены источник предписаний и повтор предлога ἐκ; κύριος передан традиционным «Господь».
- source_word: πάντα τὸν Ἰσραήλ
  choice: весь Израиль
  rationale: Сохранено собирательное обозначение народа и винительный падеж как объект подразумеваемого наставления.
- source_word: δικαιώματα καὶ κρίματα
  choice: постановления и судебные решения
  rationale: 'Оба юридических термина разграничены: δικαιώματα обозначает установленные нормы, а κρίματα — решения или судебные установления.'
theological_decisions:
- issue: Сжатый и синтаксически неровный конец греческого предложения
  choice: Фраза понята как сообщение о том, что Апсарас наставлял весь Израиль в постановлениях и судебных решениях.
  alternative: 'Сохранить буквальную последовательность без добавления глагола: «…из заповедей весь Израиль, постановления и судебные решения».'
  rationale: В греческом тексте отсутствует явный глагол при πάντα τὸν Ἰσραήλ, δικαιώματα καὶ κρίματα. Добавление «наставляя» делает вероятный смысл понятным, не превращая его в бесспорное чтение; неоднозначность отмечена в сноске.
- issue: Соотношение имени Ἀψάρας с Ездрой в параллельной традиции
  choice: Сохранено имя «Апсарас» по греческому источнику.
  alternative: Передать имя как «Ездра» на основании еврейского параллельного контекста.
  rationale: Основным текстовым основанием служит греческое свидетельство; гармонизация с иным свидетелем скрыла бы реальное расхождение традиций.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Юридическая лексика сохранена, но архаизмы и конфессионально окрашенные уточнения не вводятся.
