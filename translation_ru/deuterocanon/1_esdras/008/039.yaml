base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/039.yaml
  text: 'From the sons of Adoniakim[a], the last ones, and these are their names: Eliphala son of Geuel, and Shemaiah[b],'
translation:
  language: ru
  text: 'Из сынов Адониакима — последние[a]; вот их имена: Елифала, сын Геуила, и Самай[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «последние». Возможно, имеется в виду последняя группа или позднейшие представители этого рода; точный оттенок выражения неясен.'
    reason: lexical_alternative
  - marker: b
    text: В соответствующем перечне масоретского текста Ездры здесь названы другой род и другое число людей. Поскольку 1 Ездры местами переставляет или иначе передаёт материал параллельных перечней, перевод следует греческому тексту как основному источнику.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: из сынов
  rationale: Предлог ἐκ обозначает происхождение или принадлежность к группе; «из сынов» естественно передаёт формулу перечня.
- source_word: Ἀδωνιακαὶμ
  choice: Адониаким
  rationale: Имя транслитерировано по первичному греческому свидетельству, без замены формой из иной текстовой традиции.
- source_word: οἱ ἔσχατοι
  choice: последние
  rationale: Сохранено буквальное значение «последние»; оно может обозначать последнюю группу либо позднейших представителей рода, и текст не позволяет уверенно уточнить.
- source_word: καὶ ταῦτα τὰ ὀνόματα αὐτῶν
  choice: вот их имена
  rationale: Естественная современная русская формула введения списка, точно передающая смысл греческого оборота.
- source_word: Ἐλειφάλα
  choice: Елифала
  rationale: Прямая и удобочитаемая русская транслитерация греческой формы имени.
- source_word: τοῦ Γεουὴλ
  choice: сын Геуила
  rationale: Генитив личного имени в родословном перечне выражает сыновство; отношение сделано явным по-русски.
- source_word: Σαμαίας
  choice: Самай
  rationale: Русская транслитерация греческой формы имени; первичным оставлено греческое свидетельство, а не отличающийся масоретский параллельный перечень.
theological_decisions:
- issue: Расхождение с масоретским параллельным перечнем
  choice: Следовать греческому тексту 1 Ездры
  alternative: Заменить род, имена и число данными масоретского параллельного места
  rationale: Для данного стиха первичным источником служит греческий текст; параллель в MT приблизителен и представляет иной состав перечня.
translation_notes:
  register: Современный литературный русский язык с лаконичной, достойной формой родословного перечня. Тире помогает естественно оформить синтаксически сжатое греческое выражение; конечная запятая сохранена, поскольку стих продолжается следующим элементом списка.
