translation:
  language: ru
  text: и с ними — семьдесят мужчин.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — «семьдесят мужчин». В приблизительном параллельном месте Ездры 8:12 еврейский текст вместо этого говорит о ста десяти мужчинах; таким образом, 1 Ездры здесь расходится с еврейским параллельным текстом.
    reason: textual_variant
lexical_decisions:
- source_word: μετʼ αὐτῶν
  choice: с ними
  rationale: Предлог μετά с родительным падежом выражает совместность; «с ними» естественно и точно передаёт греческую конструкцию.
- source_word: ἄνδρες
  choice: мужчин
  rationale: ἄνδρες здесь обозначает лиц мужского пола, а не людей вообще; родительный падеж по-русски обусловлен числительным «семьдесят».
- source_word: ἑβδομήκοντα
  choice: семьдесят
  rationale: Прямое соответствие греческому числительному; расхождение с еврейским параллельным текстом отмечено в сноске.
