base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/002.yaml
  text: son of Saddoulouk[a], son of Acheitob, son of Amartheios, son of Ozeias, son of Bokka, son of Abeisai, son of Phinees, son of Eleazar[c][b], son of Aaron the chief priest.
translation:
  language: ru
  text: сына Саддулука[a], сына Ахитоба[b], сына Амарфея, сына Озии, сына Бокки, сына Ависая, сына Финееса, сына Елеазара, сына Аарона, первого священника[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст приводит здесь более пространную родословную, чем краткая еврейская параллель: «сын Саллума, сын Садока, сын Ахитува».'
    reason: alternative_reading
  - marker: b
    text: 'Некоторые имена здесь передают греческие формы имён, известных также в формах, восходящих к еврейскому тексту: Ахитоб — Ахитув, Озия — Уззи, Бокки — Букки, Ависай — Авишуа, Финеес — Пинхас.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «главного священника» или «первого первосвященника»; однако буквально по-гречески — «первого священника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: сына
  rationale: Повторяющийся родительный падеж в родословной эллиптически выражает происхождение; параллельный еврейский текст прямо употребляет בֶּן־ («сын»).
- source_word: Σαδδουλούκου
  choice: Саддулука
  rationale: Имя передано по греческой форме и не заменено именем Саллум из более краткой еврейской параллели.
- source_word: Ἀχειτὼβ
  choice: Ахитова
  rationale: Русская передача греческой формы имени с естественным склонением в родословной.
- source_word: Ἀμαρθείου
  choice: Амарфея
  rationale: Сохранён дополнительный предок, присутствующий в греческом тексте; имя передано транслитерационно.
- source_word: Ὀζείου
  choice: Озии
  rationale: Передана греческая форма имени без гармонизации с древнееврейской формой Уззи.
- source_word: Βοκκὰ
  choice: Бокки
  rationale: Сохранена греческая форма имени; несклоняемая греческая форма в русском родословном ряду естественно читается как родительный падеж.
- source_word: Ἀβεισαὶ
  choice: Ависая
  rationale: Греческая форма передана по-русски; более привычное соответствие Авишуа отмечено в сноске.
- source_word: Φεινεὲς
  choice: Финееса
  rationale: Использована закрепившаяся русская форма имени, близкая греческому Φεινεές.
- source_word: Ἐλεαζὰρ
  choice: Елеазара
  rationale: Использована общепринятая русская библейская форма греческого имени.
- source_word: Ἀαρὼν
  choice: Аарона
  rationale: Использована общепринятая русская библейская форма.
- source_word: τοῦ πρώτου ἱερέως
  choice: первого священника
  rationale: πρῶτος передано буквально как «первый», а ἱερεύς — как «священник»; титул «первосвященник» не внесён, поскольку в греческом нет ἀρχιερεύς.
theological_decisions:
- issue: Сохранять ли пространную греческую родословную или согласовать её с краткой еврейской параллелью
  choice: Сохранить полную последовательность греческого текста
  alternative: Согласовать текст с последовательностью «Саллум — Садок — Ахитов»
  rationale: Для 1 Ездры первичным источником служит греческий текст; явное расхождение с еврейской параллелью нельзя устранять молча.
- issue: Передача выражения τοῦ πρώτου ἱερέως применительно к Аарону
  choice: первого священника
  alternative: первосвященника / первого первосвященника / главного священника
  rationale: Выбор сохраняет лексическое различие между ἱερεύς («священник») и ἀρχιερεύς («первосвященник») и не снимает возможную смысловую неоднозначность слова πρῶτος.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами хорошо известных библейских имён. Синтаксическая повторяемость «сына» сохранена как характерная для родословной; фрагмент начинается со строчной буквы, поскольку стих продолжает предложение предыдущего контекста.
