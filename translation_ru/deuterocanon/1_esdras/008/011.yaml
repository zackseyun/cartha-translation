    reason: cultural_note
lexical_decisions:
- source_word: ὅσοι οὖν
  choice: Итак, пусть все, кто
  rationale: ὅσοι обозначает всю группу лиц, отвечающих условию, а οὖν связывает распоряжение с предшествующим контекстом как вывод или продолжение. «Итак» естественно для современного официально-повествовательного регистра.
- source_word: ἐνθυμοῦνται
  choice: намерен
  rationale: Глагол может означать «иметь в мыслях», «замышлять», «намереваться». В контексте разрешения отправиться «намерен» передаёт обдуманное намерение, не сводя его к одной лишь готовности.
- source_word: συνεξορμάσθωσαν
  choice: пусть … отправляются вместе
  rationale: Повелительная форма выражена русской конструкцией с «пусть», а приставка συν- передана словом «вместе». «Отправляются» ясно обозначает начало совместного пути.
- source_word: καθάπερ δέδοκται
  choice: как было решено
  rationale: В административном контексте безличная совершенная форма δέδοκται означает принятое решение. Этот вариант естественнее буквального и более архаичного «как было угодно».
- source_word: ἐμοί τε καὶ τοῖς ἑπτὰ φίλοις συμβουλευταῖς
  choice: мною и семью друзьями-советниками
  rationale: Дательный названных лиц по-русски передан творительным при пассивной конструкции. Сложение «друзьями-советниками» сохраняет и φίλοι, и συμβουλευταῖς, не превращая одно из обозначений без достаточных оснований лишь в пояснительное придаточное.
