base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/006.yaml
  text: In the seventh year of the reign of Artaxerxes[a], in the fifth month—they arrived at Jerusalem; for they had set out from Babylon on the new moon of the first month[c][b], and they came to Jerusalem according to the prosperity of the journey given to them by the Lord upon him.
translation:
  language: ru
  text: 'В седьмой год царствования Артаксеркса, в пятом месяце, — этот год был для царя вторым[a], — они вышли из Вавилона в новолуние первого месяца и прибыли в Иерусалим: Господь даровал им благополучие в пути, ибо был над ним[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст буквально говорит: «этот год был для царя вторым». Эта трудная фраза не согласуется с только что названным седьмым годом царствования и отсутствует в еврейской параллели (Езд. 7:6–9); возможно, текст здесь повреждён или часть фразы оказалась не на своём месте.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «над ним». Вероятно, речь идёт о Божьем благоволении к Ездре. В еврейской параллели сказано: «рука Господа, Бога его, была над ним»; там повествование сосредоточено на Ездре в единственном числе, тогда как греческий текст здесь говорит: «им» и «прибыли», но затем — «над ним».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτους ἑβδόμου βασιλεύοντος Ἀρταξέρξου ἐν τῷ πέμπτῳ μηνί
  choice: В седьмой год царствования Артаксеркса, в пятом месяце
  rationale: Временная конструкция передана естественной русской формулой датировки с сохранением обоих указаний времени.
- source_word: οὗτος ἐνιαυτὸς ὁ δεύτερος βασιλεῖ
  choice: этот год был для царя вторым[a]
  rationale: Трудная фраза сохранена в основном тексте максимально близко к греческому, а её текстологическая проблема разъяснена в сноске; неоднозначность не устранена догадкой.
- source_word: ἐξελθόντος γὰρ ἐκ Βαβυλῶνος
  choice: они вышли из Вавилона
  rationale: Причастная конструкция обозначает действие, предшествующее прибытию. Число по смыслу согласовано с последующим греческим глаголом во множественном числе.
- source_word: τῇ νουμηνίᾳ τοῦ πρώτου μηνός
  choice: в новолуние первого месяца
  rationale: νουμηνία прямо обозначает новолуние, а не только отвлечённо первый день месяца.
- source_word: παρεγένοντο εἰς Ἰερουσαλήμ
  choice: прибыли в Иерусалим
  rationale: Глагол стоит во множественном числе и выражает достижение места назначения.
- source_word: κατὰ τὴν δοθεῖσαν αὐτοῖς εὐοδίαν παρὰ τοῦ κυρίου
  choice: Господь даровал им благополучие в пути
  rationale: εὐοδία здесь связано с удачным, благополучным путешествием. Греческая именная конструкция развёрнута в естественное русское предложение с сохранением Господа как источника дара.
- source_word: ἐπʼ αὐτῷ
  choice: ибо был над ним[b]
  rationale: Сохранены предлог «над» и неожиданное единственное число местоимения. Вероятный смысл — благоволение или рука Господа над Ездрой, однако он не подменяет буквальную форму в основном тексте.
theological_decisions:
- issue: Передача κύριος при наличии еврейской параллели с именем יהוה
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основным источником служит греческий текст с κύριος; поэтому употреблено обычное русское «Господь», без обратной подстановки формы еврейского текста.
- issue: Смысл ἐπʼ αὐτῷ и Божье содействие в пути
  choice: ибо был над ним
  alternative: поскольку рука Господа, его Бога, была над ним
  rationale: Основной текст сохраняет краткую и трудную греческую формулировку. Более ясная формула о руке Господа засвидетельствована в еврейской параллели, но не внесена в греческий текст как будто она присутствовала в нём.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Тире выделяют явно трудную вставную фразу, не скрывая её проблемности. Сохранены «новолуние», множественное число участников пути и неожиданное единственное число в конце.
