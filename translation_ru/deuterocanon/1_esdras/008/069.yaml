base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/069.yaml
  text: And all who were ever stirred by the word of the Lord[a], the God of Israel, gathered to me while I was mourning over the lawlessness, and I sat grieved until the evening sacrifice.
translation:
  language: ru
  text: И собрались ко мне все, кого побуждало слово Господа Израиля[a], когда я скорбел о беззаконии; и я сидел в глубокой печали до вечерней жертвы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «слово Господа Израиля». Это выражение также может пониматься как «слово Господа, Бога Израиля».'
    reason: Сноска отмечает вероятное развёрнутое понимание сжатого греческого титула, не добавляя слово «Бог» в основной текст.
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: собрались
  rationale: Передаёт совместное прибытие людей к рассказчику естественным современным русским глаголом.
- source_word: ὅσοι ποτὲ ἐπεκινοῦντο
  choice: все, кого только побуждало
  rationale: Сохраняет широкий охват ὅσοι ποτε и внутреннее воздействие, выраженное ἐπεκινοῦντο, не уточняя его как страх или трепет.
- source_word: τῷ ῥήματι Κυρίου τοῦ Ἰσραήλ
  choice: слово Господа, Бога Израиля
  rationale: Греческий текст буквально сжат и допускает «слово Господа Израиля»; уточнение «Бога» передаёт вероятный библейский титул, а буквальная форма отмечена в сноске.
- source_word: πενθοῦντος ἐμοῦ ἐπὶ τῇ ἀνομίᾳ
  choice: пока я скорбел о беззаконии
  rationale: Генитив абсолютный передан временной конструкцией, а ἀνομία — прозрачным словом «беззаконие», указывающим на нарушение Божьего закона.
- source_word: ἐκαθήμην περίλυπος
  choice: я сидел глубоко опечаленный
  rationale: Сохраняются и положение сидящего, и усиленная степень скорби в περίλυπος.
- source_word: ἕως τῆς δειλινῆς θυσίας
  choice: до вечерней жертвы
  rationale: Кратко и точно обозначает установленное вечернее жертвоприношение.
theological_decisions:
- issue: Передача κύριος применительно к Богу Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» соответствует устойчивому библейскому употреблению κύριος и не вводит в текст не представленное прямо греческими буквами божественное имя.
- issue: Понимание сочетания Κυρίου τοῦ Ἰσραήλ
  choice: Господа, Бога Израиля
  alternative: Господа Израиля
  rationale: Греческая формулировка буквально означает «Господа Израиля», однако синтаксически сжата; распространённый библейский титул поддерживает понимание «Господа, Бога Израиля». Подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис остаётся ясным для широкого читателя; традиционные слова «Господь», «беззаконие» и «вечерняя жертва» употреблены там, где они точны и понятны.
