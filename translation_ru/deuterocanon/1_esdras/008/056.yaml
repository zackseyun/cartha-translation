base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/056.yaml
  text: And with them[a], from among their brothers, ten men. And I weighed out to them the silver and the gold and the holy vessels of the house of our Lord[b], which the king and his counselors and the nobles and all Israel had given as a gift.
translation:
  language: ru
  text: И с ними — десять человек из числа их братьев.[a] Я вверил им[b] серебро, золото и священные сосуды дома нашего Господа — всё это пожертвовали царь, его советники, вельможи и весь Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из их братьев — десять человек»; под «братьями» здесь могут подразумеваться их собратья.'
    reason: lexical_alternative
  - marker: b
    text: 'В дошедшем до нас греческом тексте буквально: «поставил (или положил) перед ними»; в еврейском параллельном тексте: «отвесил им». По контексту ценности были переданы им на хранение.'
    reason: textual_variant
lexical_decisions:
- source_word: μετʼ αὐτῶν ἐκ τῶν ἀδελφῶν αὐτῶν ἄνδρας δέκα
  choice: И с ними — десять человек из числа их братьев
  rationale: Сохранены присоединительная, несколько отрывистая структура греческой фразы и явное ἄνδρας («людей, мужчин»). Оборот «из числа их братьев» естественно передаёт принадлежность к их собратьям, не уточняя сверх текста, были ли это родственники, соплеменники или собратья-левиты.
- source_word: ἔστησα αὐτοῖς
  choice: Я вверил им
  rationale: Передаёт контекстуальное действие — поручение ценностей этим людям — и не делает вид, будто расхождение источников отсутствует. В сохранившемся греческом буквально стоит «поставил/положил перед ними», тогда как еврейская параллель говорит «отвесил им»; оба свидетельства отмечены в сноске.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: серебро, золото
  rationale: Речь идёт о драгоценных материалах, а не просто о деньгах; краткое перечисление естественно для русского языка.
- source_word: τὰ ἱερὰ σκεύη
  choice: священные сосуды
  rationale: Традиционное и понятное обозначение храмовой утвари, сохраняющее культовый смысл ἱερά.
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: дома нашего Господа
  rationale: Буквально сохраняет греческие «дом» и «наш Господь», не добавляя отсутствующего в тексте слова «Бог» и не заменяя «дом» пояснением «храм».
- source_word: οὕτως ἐδωρήσατο
  choice: всё это пожертвовали
  rationale: Глагол выражает дарение; в храмовом контексте «пожертвовали» звучит естественно. «Всё это» ясно относит дарение ко всему перечисленному — серебру, золоту и сосудам.
- source_word: οἱ σύμβουλοι αὐτοῦ καὶ οἱ μεγιστᾶνες
  choice: его советники, вельможи
  rationale: «Советники» точно передаёт придворную функцию σύμβουλοι, а «вельможи» — высокий общественный ранг μεγιστᾶνες в dignified, но понятном современном русском регистре.
theological_decisions:
- issue: Передача κυρίου ἡμῶν в выражении о храме
  choice: нашего Господа
  alternative: Господа нашего; нашего Владыки
  rationale: Так прямо передаётся греческое κυρίου ἡμῶν без внесения тетраграмматона или отсутствующего слова «Бог».
- issue: Расхождение греческого ἔστησα и еврейской параллели о взвешивании
  choice: вверил им с текстологической сноской
  alternative: поставил перед ними; отвесил им
  rationale: Контекст показывает передачу ценностей на ответственное хранение, но греческое и еврейское свидетельства формулируют действие по-разному. Нейтральное «вверил» сохраняет смысл сцены, а сноска открыто фиксирует напряжение между источниками.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-храмового повествования. Синтаксис первого предложения сохраняет отрывистость греческого оригинала, но остаётся понятным; терминология не привязана к конфессионально специфическому толкованию.
