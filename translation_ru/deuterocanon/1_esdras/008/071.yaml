base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/071.yaml
  text: Lord[a], I am ashamed and disgraced before your face.
translation:
  language: ru
  text: Господи, мне стыдно, я посрамлён перед Твоим лицом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Тобой»; «в Твоём присутствии». Буквально по-гречески: «перед Твоим лицом».'
    reason: Сохранён конкретный семитский по характеру оборот; примечание поясняет его естественные русские эквиваленты.
lexical_decisions:
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος в прямом обращении к Богу; «Господи» естественно и торжественно передаёт греческий вокатив.
- source_word: ᾔσχυμμαι
  choice: мне стыдно
  rationale: Перфектная форма выражает сохраняющееся состояние стыда; безличная русская конструкция звучит естественно и передаёт внутреннее переживание говорящего.
- source_word: ἐντέτραμμαι
  choice: я посрамлён
  rationale: Перфект медиально-пассивного залога усиливает признание стыда и обозначает состояние унижения или бесчестия. «Посрамлён» сохраняет смысловую интенсивность и достойный молитвенный регистр.
- source_word: κατὰ πρόσωπόν σου
  choice: перед Твоим лицом
  rationale: Конкретный образ «лица» сохранён вслед за греческим текстом и его семитским оборотом; выражение указывает на непосредственное предстояние Богу.
theological_decisions:
- issue: Передача обращения Κύριε
  choice: Господи
  alternative: О Господи
  rationale: Греческий текст содержит прямое обращение без дополнительной частицы; «Господи» точно передаёт его и не добавляет отсутствующего в источнике усиления.
- issue: Степень буквальности κατὰ πρόσωπόν σου
  choice: перед Твоим лицом
  alternative: перед Тобой; в Твоём присутствии
  rationale: Более конкретная формулировка сохраняет семитский образ и непосредственность молитвенного предстояния, не устраняя возможный смысл «в Твоём присутствии».
- issue: Соотношение двух выражений стыда
  choice: мне стыдно, я посрамлён
  alternative: мне стыдно и унизительно; я пристыжен и унижен
  rationale: Два отдельных сказуемых сохранены, чтобы не сглаживать усиление и смысловое напряжение греческой пары ᾔσχυμμαι и ἐντέτραμμαι.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным молитвенным звучанием. Оборот «перед Твоим лицом» намеренно сохраняет конкретность оригинала; «посрамлён» несколько возвышенно, но понятно и уместно в исповедальной молитве.
