base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/066.yaml
  text: The rulers and the priests and the Levites have not separated themselves from the foreign nations of the land, with their uncleannesses—from the Canaanites and Hittites and Perizzites and Jebusites and Moabites and Egyptians and Edomites.
translation:
  language: ru
  text: Правители, священники и левиты не отделились от иноплеменных народов земли и от их нечистоты[a] — от хананеев, хеттеев, ферезеев, иевусеев, моавитян, египтян и идумеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза синтаксически сжата. Возможный перевод: «не держались обособленно от иноплеменных народов земли, с их нечистотой». Смысл состоит в том, что названные группы не отделились от этих народов и связанной с ними нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἐχώρισαν
  choice: не отделились
  rationale: Греческий аорист передаёт свершившийся факт того, что требуемого отделения не произошло. Возвратная форма по-русски естественно выражает подразумеваемое отделение самих названных групп.
- source_word: οἱ ἄρχοντες
  choice: правители
  rationale: Слово обозначает носителей общественной власти; «правители» сохраняет официальный характер их положения.
- source_word: οἱ ἱερεῖς καὶ οἱ Λευεῖται
  choice: священники и левиты
  rationale: Устоявшиеся и понятные соответствия названиям храмовых служителей и левитов.
- source_word: ἀλλογενῆ ἔθνη
  choice: иноплеменные народы
  rationale: Так передаётся принадлежность к народам вне Израиля без привнесения современных расовых категорий; «народы» здесь естественнее, чем «племена».
- source_word: τῆς γῆς
  choice: этой земли
  rationale: В контексте речь идёт о конкретной стране, а не обо всей земле; указательное «этой» делает подразумеваемую локальную отнесённость ясной по-русски.
- source_word: ἀκαθαρσίας αὐτῶν
  choice: от их нечистоты
  rationale: Форма ἀκαθαρσίας в представленном греческом тексте стоит в единственном числе и сохраняет культово-нравственный смысл. Предлог «от» восполняется по смыслу глагола отделения, однако сжатость оригинала отмечена в сноске.
- source_word: Χαναναίων ... Ἰδουμαίων
  choice: хананеев, хеттеев, ферезеев, иевусеев, моавитян, египтян и идумеев
  rationale: Список оформлен как пояснение к «иноплеменным народам». «Идумеи» непосредственно отражает греческое Ἰδουμαῖοι и является нормативным русским историко-библейским названием.
theological_decisions:
- issue: Характер нечистоты
  choice: Сохранено слово «нечистота» в его культово-нравственной напряжённости.
  alternative: «мерзости» или нейтральное «обычаи»
  rationale: ἀκαθαρσία обозначает нечистоту и не даёт основания ни усиливать её до «мерзостей», ни ослаблять до простого культурного различия.
- issue: Связь отделения с народами и их нечистотой
  choice: Основной текст говорит об отделении «от иноплеменных народов… и от их нечистоты», а синтаксическая сжатость раскрыта в сноске.
  alternative: «не держались обособленно от иноплеменных народов этой земли среди их нечистоты»
  rationale: Греческая конструкция необычно сжата и допускает различное синтаксическое развёртывание. Выбранный вариант остаётся читаемым и не сводит требование исключительно ни к этнической, ни к обрядовой стороне.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Перечень этнонимов дан в традиционных русских формах; тяжеловесное многократное «и» греческого оригинала сокращено ради естественного русского перечисления.
