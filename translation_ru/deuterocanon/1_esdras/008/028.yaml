base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/028.yaml
  text: And these are the leaders according to their fathers’ houses and their divisions[b][a], who went up with me from Babylon in the reign of Artaxerxes the king.
translation:
  language: ru
  text: И вот главы[a] по их отцовским домам и подразделениям[b], которые поднялись вместе со мной из Вавилона во время царствования царя Артаксеркса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предводители» или «руководители». Греческое προηγούμενοι обозначает тех, кто стоит во главе; еврейский параллельный текст также говорит о главах отцовских домов.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте: «их подразделения», тогда как в еврейском параллельном тексте употреблено генеалогическое выражение: «их родословная» или «их запись по родам». Перевод следует греческому тексту как первичному свидетельству для 1 Ездры.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ προηγούμενοι
  choice: предводители
  rationale: В данном контексте слово обозначает стоящих во главе родовых групп; «предводители» передаёт руководящее положение, не приписывая им более узкой официальной должности.
- source_word: κατὰ τὰς πατριὰς αὐτῶν
  choice: по их отцовским домам
  rationale: πατριά обозначает родовую, клановую группу. «Отцовские дома» сохраняет библейскую социально-родовую категорию и соответствует смыслу еврейского параллельного текста.
- source_word: καὶ τὰς μεριδαρχίας
  choice: и подразделениям
  rationale: Перевод следует первичному греческому свидетельству, где речь идёт о долях, отделениях или организованных подразделениях, не подменяя его генеалогической формулировкой еврейского параллельного текста.
- source_word: οἱ ἀναβάντες
  choice: которые поднялись
  rationale: Сохраняется обычное библейское обозначение пути из Вавилона к Иерусалиму как восхождения, хотя пункт назначения в самом стихе не назван.
- source_word: ἐν τῇ βασιλείᾳ Ἀρταξέρξου τοῦ βασιλέως
  choice: во время царствования царя Артаксеркса
  rationale: В контексте βασιλεία имеет временное значение «царствование»; эта формулировка естественна по-русски и сохраняет повтор титула βασιλέως.
