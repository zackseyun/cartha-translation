base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/075.yaml
  text: And now, for a little while, mercy has come to us from the Lord, the Lord, to leave us a root and a name in this holy place,
translation:
  language: ru
  text: И теперь, на краткое время, нам явлена милость от Господа, Господа, чтобы у нас остались корень и имя в этом святом месте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πόσον τι
  choice: на краткое время
  rationale: Оборот указывает на малую, ограниченную меру; в данном контексте естественнее всего передать её как краткий промежуток времени, сохранив ощущение временной передышки.
- source_word: ἐγενήθη ἔλεος ἡμῖν
  choice: явлена нам милость
  rationale: Буквально милость «возникла/случилась для нас»; русский пассив естественно выражает пережитое проявление милости, не добавляя нового действующего лица.
- source_word: παρὰ τοῦ κυρίου Κυρίου
  choice: от Господа, Господа
  rationale: Сохранён необычный повтор титула в греческом источнике, поскольку его устранение могло бы сгладить текстуальную особенность.
- source_word: καταλειφθῆναι ἡμῖν ῥίζαν καὶ ὄνομα
  choice: Он оставил нам корень и имя
  rationale: «Корень» сохранён как исходная метафора продолжения народа; «имя» передано буквально, без истолкования как слава, память или потомство.
- source_word: ἐν τῷ τόπῳ τούτῳ ἁγιάσματος
  choice: на этом святом месте
  rationale: Сжатая греческая конструкция буквально связана с местом святилища/освящения; выбран естественный русский эквивалент, согласующийся с контекстом храма.
theological_decisions:
- issue: Повтор божественного титула κυρίου Κυρίου
  choice: Господа, Господа
  alternative: Господа Бога
  rationale: Греческий текст содержит именно повтор κύριος, поэтому перевод не заменяет второй титул словом «Бог» и не гармонизирует необычную формулу.
- issue: Образ ῥίζα
  choice: корень
  alternative: остаток
  rationale: Перевод сохраняет образ источника буквально и не сводит его к богословски нагруженному понятию «остаток».
- issue: Значение ὄνομα
  choice: имя
  alternative: память / известность
  rationale: 'Сохранена смысловая открытость: слово может подразумевать продолжение имени и существования общины, но перевод не фиксирует одно толкование.'
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Необычный повтор «Господа, Господа» намеренно сохранён. Двоеточие ясно связывает последующее действие с проявлением милости, не меняя содержания греческой инфинитивной конструкции.
