  terminology: 'Повтор «Господа, Господа» следует сохранить, поскольку он наличествует в данном греческом тексте. «Корень» и «имя» не следует заменять на «остаток», «потомство» или «память»: такие варианты сужают образность оригинала. «Святом месте» приемлемо для τόπῳ ... ἁγιάσματος.'
