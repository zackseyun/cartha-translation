  source_fidelity: 'Основной смысл передан точно: временная милость исходит от «Господа, Господа», а образы «корень» и «имя» сохранены. Однако греческий инфинитив καταλειφθῆναι имеет страдательное значение («быть оставленными/сохраниться для нас»); добавление «Он оставил» вводит личное подлежащее и оформляет действие как завершённое утверждение, чего в исходной конструкции нет.'
