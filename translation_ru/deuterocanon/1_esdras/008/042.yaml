lexical_decisions:
- source_word: συναγαγών
  choice: собрав
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам; русское деепричастие естественно передаёт последовательность и сохраняет единственное число рассказчика.
- source_word: ἐπὶ τὸν λεγόμενον Ποταμόν
  choice: у реки, называемой Рекой
  rationale: λεγόμενον означает «называемый», а Ποταμός, по-видимому, употреблено как обозначение места. Формулировка сохраняет необычное греческое выражение и не подменяет его предположительным названием.
- source_word: παρενεβάλομεν αὐτόθι
  choice: мы стояли там лагерем
  rationale: παρεμβάλλω в данном контексте означает расположиться лагерем. Такая формулировка современна и вместе с указанием длительности передаёт фактическое пребывание в лагере.
- source_word: ἡμέρας τρεῖς
  choice: три дня
  rationale: Винительный падеж выражает продолжительность времени; по-русски она естественно передаётся без предлога.
- source_word: κατέμαθον αὐτούς
  choice: я осмотрел их
  rationale: καταμανθάνω может означать внимательное рассмотрение или изучение. В контексте собранной группы «осмотрел» передаёт личную проверку рассказчиком, не перегружая текст толкованием.
theological_decisions:
- issue: Смена лица внутри стиха
  choice: Сохранён переход от «мы стояли» к «я осмотрел».
  alternative: 'Стилистически выровнять повествование: «мы осмотрели их».'
  rationale: Греческий текст различает действие всей группы (первое лицо множественного числа) и последующее личное действие рассказчика (первое лицо единственного числа); перевод не устраняет это различие.
