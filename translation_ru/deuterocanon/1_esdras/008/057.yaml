base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/057.yaml
  text: And he handed over to them[a], after weighing it out, six hundred fifty talents of silver, and silver vessels worth a hundred talents, and a hundred talents of gold, and twenty golden bowls[b], and ten vessels of fine gleaming bronze.
translation:
  language: ru
  text: И он передал им[a], отвесив, шестьсот пятьдесят талантов серебра, серебряные сосуды общим весом в сто талантов, сто талантов золота, двадцать золотых чаш[b] и десять сосудов из добротной сверкающей бронзы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь заметно отличается от еврейского параллельного текста в Езд 8:27: там названы два сосуда из добротной бронзы и указана стоимость золотых чаш. Поскольку Первая книга Ездры в этом издании переводится с греческого текста, основной текст следует греческому перечню.'
    reason: textual_variant
  - marker: b
    text: 'Возможно также: «двадцать золотых предметов». Греческое слово встречается редко и имеет не вполне ясное значение, но еврейский параллельный текст позволяет понимать его как обозначение чаш или тазов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέδωκεν
  choice: передал
  rationale: Прямо обозначает передачу храмовых ценностей и естественно звучит в современном русском языке.
- source_word: στήσας
  choice: отвесив
  rationale: В контексте перечня драгоценных металлов причастие, вероятнее всего, указывает на предварительное взвешивание; краткая форма сохраняет связь с основным действием.
- source_word: τάλαντα ἀργυρίου ἑξακόσια πεντήκοντα
  choice: шестьсот пятьдесят талантов серебра
  rationale: Сохранена древняя единица веса без пересчёта, как в греческом тексте.
- source_word: σκεύη ἀργυρᾶ ταλάντων ἑκατόν
  choice: серебряные сосуды общим весом в сто талантов
  rationale: «Сосуды» уместно для храмовой утвари, а указание на общий вес ясно передаёт конструкцию с талантами, не вводя отсутствующего в греческом понятия стоимости.
- source_word: χρυσίου ταλάντων ἑκατόν
  choice: сто талантов золота
  rationale: Прямой перевод с сохранением структуры перечня.
- source_word: χρυσώματα
  choice: золотые чаши
  rationale: Редкое греческое слово допускает более общее понимание как золотых предметов, однако еврейский параллельный текст поддерживает значение чаш или чашей-бассейнов.
- source_word: σκεύη χαλκᾶ ἀπὸ χαλκοῦ χρηστοῦ στίλβοντα
  choice: сосуды из добротной сверкающей бронзы
  rationale: Переданы материал, высокое качество и блеск; устранён тяжеловесный повтор слова «бронза», при этом смысл греческого описания сохранён.
- source_word: δέκα
  choice: десять
  rationale: Прямая передача числительного согласно греческому основному тексту.
