base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/021.yaml
  text: Let it be done according to the law of God for God Most High[b][a], so that wrath may not come upon the kingdom of the king and his sons.
translation:
  language: ru
  text: Пусть это будет исполнено по Закону Божьему для Бога Всевышнего[a], чтобы гнев не постиг царство царя и его сыновей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть это будет осуществлено по Закону Божьему для Бога Всевышнего». Греческий глагол означает исполнение или осуществление предписанного.'
    reason: lexical_alternative
  - marker: b
    text: 'Параллельный текст в Ездры 7:23 существенно отличается: он подробнее говорит о снабжении для храмового служения и о тщательном исполнении повеления. Здесь перевод следует греческому тексту 1 Ездры как основному свидетельству.'
    reason: textual_variant
lexical_decisions:
- source_word: κατὰ τὸν τοῦ θεοῦ νόμον
  choice: по Закону Божьему
  rationale: Оборот обозначает соответствие установленной Богом норме. «По Закону Божьему» естественно звучит по-русски и сохраняет юридико-религиозный характер νόμος.
- source_word: ἐπιτελεσθήτω
  choice: пусть это будет исполнено
  rationale: Пассивный императив требует осуществить предписанное. «Исполнено» передаёт выполнение постановления, не добавляя отсутствующего в греческом усиления «в точности».
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: для Всевышнего Бога
  rationale: Дательный падеж указывает на того, ради кого или для служения кому совершается действие. Русский порядок слов передаёт титул естественно и торжественно.
- source_word: ἕνεκα τοῦ μὴ γενέσθαι
  choice: чтобы … не обрушился
  rationale: Конструкция выражает цель — предотвратить нежелательный исход. Глагол «обрушился» идиоматично сочетается с тяжёлым гневом и передаёт направленность εἰς.
- source_word: ὀργή
  choice: гнев
  rationale: Слово обозначает тяжёлое негодование, в данном контексте подразумеваемый Божий гнев; перевод не развивает это подразумевание в отдельное утверждение.
- source_word: βασιλείαν
  choice: царство
  rationale: Прямой и соответствующий контексту эквивалент, обозначающий владение или державу царя.
- source_word: τοῦ βασιλέως καὶ τῶν υἱῶν
  choice: царя и его сыновей
  rationale: Сохранены конкретное обозначение сыновей и синтаксическая связь обоих родительных определений с «царством»; возможное смысловое распределение отмечено в сноске.
theological_decisions:
- issue: Чей гнев имеется в виду
  choice: Сохранено слово «гнев» без явного добавления «Божий».
  alternative: «Чтобы Божий гнев не обрушился…»
  rationale: Контекст Закона и служения Всевышнему ясно подразумевает Божий гнев, однако в самой греческой фразе при слове ὀργή нет определения «Божий».
- issue: К кому относится действие
  choice: «Для Всевышнего Бога»
  alternative: «Всевышнему Богу»
  rationale: Русское «для» естественно выражает совершение предписанного ради Бога и для служения Ему, не исключая направительного оттенка греческого дательного.
- issue: Связь «сыновей» с «царством» и «гневом»
  choice: «На царство царя и его сыновей»
  alternative: «На царство царя и на его сыновей»
  rationale: Греческие родительные формы формально зависят от «царство», но по смыслу возможна угроза и державе царя, и его сыновьям. Основной текст сохраняет структуру, а сноска сообщает естественное смысловое прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Закон Божий» и «Всевышний Бог» понятны широкому читателю; устранено неоправданное усиление «в точности», при этом сохранены лаконичность указа и богословская напряжённость предупреждения.
