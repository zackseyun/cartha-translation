base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/092.yaml
  text: Rise up and carry it through[a], for the matter is yours, and we are with you; be strong and act.
translation:
  language: ru
  text: Встань и доведи это до конца, ведь это дело поручено тебе, а мы с тобой — будем действовать решительно[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение «проявлять силу» сжато и допускает также понимание «быть твёрдыми». В греческом оно связано с «мы с тобой»; еврейский параллельный текст (Езд. 10:4) выражает близкую мысль как обращённое к Ездре побуждение: «будь твёрд и действуй».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Встань
  rationale: Аористное причастие употреблено как побуждение; краткое «Встань» сохраняет энергичный призыв к действию.
- source_word: ἐπίτελει
  choice: доведи это до конца
  rationale: Императив ἐπιτελέω означает завершить, исполнить до конца; этот вариант естественен по-русски и передаёт решительное завершение дела.
- source_word: πρὸς σὲ γὰρ τὸ πρᾶγμα
  choice: ведь это дело поручено тебе
  rationale: Буквально оборот означает «дело — к тебе» и указывает на возложенную ответственность. «Поручено тебе» передаёт идиоматический смысл, не утверждая права собственности на дело.
- source_word: ἡμεῖς μετὰ σοῦ
  choice: а мы с тобой
  rationale: Прямо передаёт заявление о солидарности и поддержке.
- source_word: ἰσχὺν ποιεῖν
  choice: действуй мужественно
  rationale: Сжатое и несколько необычное греческое выражение буквально связано с проявлением силы. Русское побуждение сохраняет смысл решительного действия, не вводя отсутствующего в греческом прямого дополнения.
