  verdict: revise
  source_fidelity: 'Начальные повеления переданы точно: «Встань» соответствует побудительному употреблению ἀναστάς, а «доведи это до конца» удачно передаёт ἐπίτελει. «Это дело поручено тебе» естественно выражает ответственность, заключённую в πρὸς σὲ τὸ πρᾶγμα. Однако заключительное «действуй мужественно» превращает греческое ἡμεῖς («мы») в обращённое к Ездре второе повеление и тем самым утрачивает субъект заключительного инфинитива. Греческий текст связывает действие/проявление силы с «мы с тобой».'
  naturalness: Предлагаемая правка сохраняет краткий, ободряющий тон и звучит по-современному литературно. Тире перед заключительной частью ясно обозначает присоединённое обязательство говорящих без тяжеловесного буквального оборота.
  terminology: «Дело поручено тебе» точно и нейтрально передаёт назначенную ответственность; специальных богословских терминов и имён в стихе нет. «Действовать решительно» передаёт сжатое ἰσχὺν ποιεῖν без конфессионального истолкования. Сноску следует привязать к самому спорному заключительному выражению, а не к «доведи это до конца».
