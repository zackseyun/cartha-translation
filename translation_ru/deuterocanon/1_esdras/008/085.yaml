base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/085.yaml
  text: For you, Lord, who have lightened our sins, have given us such a root; yet we have turned back to transgress your law by mingling with the uncleanness of the nations of the land.
translation:
  language: ru
  text: Ведь Ты, Господи, облегчил тяжесть наших грехов и даровал нам такой корень; но мы вновь вернулись к нарушению Твоего закона, смешиваясь с нечистотой народов этой земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κουφίσας τὰς ἁμαρτίας ἡμῶν
  choice: облегчил бремя наших грехов
  rationale: Глагол κουφίζω означает «облегчать, делать менее тяжёлым». Добавление «бремя» естественно передаёт образ тяжести грехов, не утверждая их полного прощения.
- source_word: τοιαύτην ῥίζαν
  choice: такой корень
  rationale: Сохранён буквальный образ ῥίζα («корень»), поскольку его точный референт в данном стихе неоднозначен и не должен подменяться толкованием «остаток».
- source_word: πάλιν ἀνεκάμψαμεν
  choice: мы снова обратились к тому
  rationale: Передаёт возврат к прежнему образу действий; оборот связан со следующим инфинитивом παραβῆναι.
- source_word: παραβῆναι τὸν νόμον σου
  choice: нарушать Твой закон
  rationale: Παραβαίνω с винительным выражает преступление или нарушение закона.
- source_word: ἐπιμιγῆναι τῇ ἀκαθαρσίᾳ
  choice: смешиваясь с нечистотой
  rationale: Сохраняет метафору смешения и нравственно-ритуально-религиозную многозначность ἀκαθαρσία.
- source_word: τῶν ἐθνῶν τῆς γῆς
  choice: народов этой земли
  rationale: Естественная русская передача; указательное «этой» контекстуально обозначает народы земли, о которой идёт речь.
theological_decisions:
- issue: Смысл облегчения грехов
  choice: облегчил бремя наших грехов
  alternative: простил наши грехи
  rationale: Греческое κουφίσας выражает облегчение тяжести, а не однозначно полное прощение; сохранена смысловая напряжённость.
- issue: Образ ῥίζα
  choice: такой корень
  alternative: такой остаток / такое основание
  rationale: Буквальный образ текста сохранён без богословского отождествления корня с остатком или основанием.
- issue: Нечистота народов
  choice: нечистота народов этой земли
  alternative: нечистые обычаи народов этой земли
  rationale: Не конкретизируется, относится ли нечистота к обычаям, культу, брачным связям или общему состоянию; сохранена неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский язык с молитвенно-исповедальным, dignified регистром. Заглавные местоимения при обращении к Богу использованы как русская издательская норма благоговейного стиля. Точка с запятой сохраняет резкий контраст между Божьей милостью и повторным нарушением закона.
