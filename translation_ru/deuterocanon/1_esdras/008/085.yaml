revisions:
- from: Ведь Ты, Господи, облегчил бремя наших грехов и дал нам такой корень; но мы снова обратились к тому, чтобы нарушать Твой закон, смешиваясь с нечистотой народов этой земли.
  to: Ведь Ты, Господи, облегчил тяжесть наших грехов и даровал нам такой корень; но мы вновь вернулись к нарушению Твоего закона, смешиваясь с нечистотой народов этой земли.
  rationale: Правка ограничена естественностью русского выражения и более прямой передачей греческих конструкций. Неоднозначный образ «корень» и широкое значение «нечистоты» сохранены; смысл не конкретизируется богословски или исторически.
