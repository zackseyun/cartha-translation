base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/081.yaml
  text: And now do not give your daughters in marriage to their sons,[a]
translation:
  language: ru
  text: И теперь не выдавайте ваших дочерей замуж за их сыновей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «не соединяйте ваших дочерей браком с их сыновьями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: И теперь
  rationale: Сохраняет соединительно-временной переход греческого текста, не усиливая его до явно причинного «итак».
- source_word: τὰς θυγατέρας ὑμῶν
  choice: ваших дочерей
  rationale: Прямая и естественная передача определённой именной группы с притяжательным местоимением.
- source_word: μὴ συνοικίσητε
  choice: не выдавайте … замуж
  rationale: В данном брачном контексте συνοικίζω означает соединить для совместной супружеской жизни, то есть выдать замуж; русское выражение естественно передаёт каузативную и семейно-правовую перспективу.
- source_word: τοῖς υἱοῖς αὐτῶν
  choice: за их сыновей
  rationale: Дательный падеж при συνοικίζω естественно передаётся русской конструкцией «выдать замуж за»; «их» относится к упомянутым в контексте народам.
theological_decisions:
- issue: Формулировка запрета на смешанные браки
  choice: не выдавайте ваших дочерей замуж за их сыновей
  alternative: не соединяйте ваших дочерей браком с их сыновьями
  rationale: Выбранная формулировка сохраняет обращённый к семьям социально-правовой смысл запрета, не добавляя отсутствующих в греческой строке богословских пояснений.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная. Порядок «ваших дочерей» слегка формальнее разговорного «своих дочерей» и точнее сохраняет явное ὑμῶν.
