  text: from the sons of Hanunai and their sons[a], twenty men;
translation:
  language: ru
  text: из сынов Ханунея и их сыновей[a] — двадцать мужчин;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся греческий текст гласит: «из сынов Ханунея и их сыновей — двадцать мужчин». Приблизительная еврейская параллель в Езд 8:19 (нумерация книг Ездры и Неемии различается в разных традициях) вместо этого называет Хашавию и Иешаю из сынов Мерари, а также его братьев и их сыновей — всего двадцать.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ τῶν υἱῶν Χανουναίου
  choice: из сынов Ханунея
  rationale: Оборот οἱ ἐκ с родительным падежом обозначает людей, происходящих из названной семейной группы. Краткое «из сынов Ханунея» сохраняет родословный смысл греческого текста; имя передано русской транслитерацией.
- source_word: οἱ υἱοὶ αὐτῶν
  choice: и их сыновей
  rationale: Местоимение αὐτῶν стоит во множественном числе, поэтому перевод следует сохранившемуся греческому чтению и не согласуется искусственно с существенно отличающимся еврейским параллельным текстом.
- source_word: εἴκοσι ἄνδρες
  choice: двадцать мужчин
  rationale: ἄνδρες в контексте подсчёта обозначает взрослых лиц мужского пола; «мужчин» естественно и точно передаёт это значение.
theological_decisions:
- issue: Расхождение между греческим текстом и масоретской параллелью в перечне лиц
  choice: 'В основном тексте переведено греческое чтение: «из сынов Ханунея и их сыновей — двадцать мужчин».'
  alternative: Приблизительная еврейская параллель называет Хашавию и Иешаю из сынов Мерари, а также его братьев и их сыновей — всего двадцать.
  rationale: Для 1 Ездры первичным источником служит греческий текст. Поскольку еврейская параллель существенно отличается в именах и составе группы, её нельзя молча подставлять вместо греческого чтения; расхождение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая форма сохранена в соответствии со структурой перечня. Тире естественно отделяет группу от итогового числа. Имя «Хануней» передано в форме, удобной для русского склонения.
