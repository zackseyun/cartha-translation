base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/076.yaml
  text: and to reveal a lamp for us in the house of our Lord[a], to give us food in the time of our slavery; and while we were enslaved[c][b], we were not forsaken
translation:
  language: ru
  text: и явить нам светильник[a] в доме нашего Господа[b], дать нам пищу во время нашего рабства; и, находясь в рабстве[c], мы не были оставлены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «явить нам свет». Греческое выражение буквально передаёт образ раскрываемого, становящегося видимым светильника или света.'
    reason: lexical_alternative
  - marker: b
    text: «Дом нашего Господа» — храм.
    reason: cultural_note
  - marker: c
    text: 'Или: «когда мы служили». В обеих частях стиха употреблены однокоренные греческие слова, которые могут обозначать рабство, подневольное состояние или служение.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακαλύψαι
  choice: явить
  rationale: Глагол означает «раскрыть, снять покров, сделать видимым». «Явить» естественно передаёт раскрытие света, не внося более истолковывающего значения «восстановить».
- source_word: φωστῆρα
  choice: светильник
  rationale: Существительное обозначает источник света или светило. В контексте дома Господа «светильник» сохраняет конкретный образ; возможен и более общий перевод «свет».
- source_word: οἴκῳ τοῦ κυρίου ἡμῶν
  choice: в доме нашего Господа
  rationale: Сохранён буквальный образ «дома», хотя по контексту речь идёт о храме.
- source_word: τροφὴν
  choice: пищу
  rationale: Прямой и понятный эквивалент со значением пищи или пропитания.
- source_word: δουλείας / δουλεύειν
  choice: рабства / находясь в рабстве
  rationale: Повтор корня δουλ- обозначает подневольное состояние. Русское повторение слова «рабство» сохраняет связь двух оборотов и тяжесть положения.
- source_word: ἐγκατελείφθημεν
  choice: мы не были оставлены
  rationale: Передаёт значение «покинуть, оставить» и сохраняет богословски значимый мотив того, что Бог не оставил народ.
theological_decisions:
- issue: Как передать группу δουλεία / δουλεύειν
  choice: рабства / находясь в рабстве
  alternative: порабощения / когда мы служили
  rationale: Контекст говорит о подчинении чужой власти; «рабство» яснее выражает несвободу, тогда как «служили» может неоправданно смягчить смысл. Альтернатива отмечена в сноске из-за диапазона значения глагола.
- issue: Следует ли переводить οἶκος τοῦ κυρίου как «храм Господа»
  choice: дом нашего Господа
  alternative: храм нашего Господа
  rationale: Основной текст сохраняет исходный образ «дома», а конкретный храмовый референт поясняется в сноске.
- issue: Образ ἀνακαλύψαι φωστῆρα
  choice: явить нам светильник
  alternative: открыть нам свет / сделать видимым наш светильник
  rationale: Выбранный вариант сохраняет образ появления источника света и не превращает его без достаточного основания в прямое утверждение о восстановлении храма или надежды.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет связь с предшествующим контекстом посредством начального «и». Конкретные слова «светильник», «дом», «пища» и повтор «рабство» удерживают образность и лексические связи греческого текста без конфессионального истолкования.
