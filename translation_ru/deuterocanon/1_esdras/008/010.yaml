base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/010.yaml
  text: And having judged what is humane[a], I ordered that those of the nation of the Jews who are willing, and of their own choice, and the priests and the Levites and these others in our kingdom[b], should go with you to Jerusalem.
translation:
  language: ru
  text: Рассудив поступить человеколюбиво, я повелел, чтобы те из иудейского народа, кто желает отправиться по собственной воле,[a] а также священники, левиты и эти люди в нашем царстве[b] пошли с тобой в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Редкое греческое слово допускает и понимание: «те из иудейского народа, кто желает сам сделать выбор»; по-видимому, здесь подчёркнута добровольность участия.'
    reason: lexical_alternative
  - marker: b
    text: Приведённая еврейская параллель в этом месте имеет существенно иное содержание; перевод следует греческому тексту 1 Ездры.
    reason: textual_variant
lexical_decisions:
- source_word: τὰ φιλάνθρωπα
  choice: поступить человеколюбиво
  rationale: Субстантивированное сочетание обозначает человеколюбивый, благожелательный образ действий; глагольная передача естественна по-русски и сохраняет нравственную окраску.
- source_word: κρίνας
  choice: рассудив
  rationale: Аористное причастие выражает принятое после обдумывания решение и предшествует царскому повелению.
- source_word: προσέταξα
  choice: я повелел
  rationale: Передаёт властное распоряжение в достойном административном регистре.
- source_word: τοὺς βουλομένους
  choice: те ... кто желает
  rationale: Сохраняет указание на добровольное желание участвовать.
- source_word: αἱρετίζοντας
  choice: по собственной воле
  rationale: Редкая и трудная форма, вероятно, усиливает мысль о свободном выборе; наречное выражение позволяет избежать неестественного повтора.
- source_word: ἐκ τοῦ ἔθνους τῶν Ἰουδαίων
  choice: из иудейского народа
  rationale: Естественно передаёт принадлежность к народу, не придавая слову ἔθνος значения «язычники».
- source_word: τῶν ἱερέων καὶ τῶν Λευειτῶν
  choice: священники, левиты
  rationale: Устоявшиеся русские соответствия названиям служителей и группы.
- source_word: τῶνδε ἐν τῇ ἡμετέρᾳ βασιλείᾳ
  choice: эти люди в нашем царстве
  rationale: Сохраняет несколько резкое указательное τῶνδε и местонахождение в пределах царства, не домысливая точную группу.
- source_word: συμπορεύεσθαί σοι εἰς Ἰερουσαλήμ
  choice: пошли с тобой в Иерусалим
  rationale: Прямо передаёт совместное путешествие и направление движения.
theological_decisions:
- issue: Существенное расхождение греческого текста с приведённой масоретской параллелью
  choice: Основной текст переведён по греческому свидетельству как царское разрешение на добровольное путешествие в Иерусалим.
  alternative: Заменить содержание фразой о том, что Ездра расположил сердце исследовать, исполнять и преподавать закон Господа.
  rationale: Греческий текст 1 Ездры является первичным источником для данного места и ясно содержит формулу царского распоряжения; гармонизация с существенно отличающимся еврейским текстом устранила бы реальное текстовое расхождение.
- issue: Неясная связь αἱρετίζοντας с окружающими членами перечня
  choice: Связать выражение с желающими из иудейского народа и передать как усиление добровольности.
  alternative: Понимать форму как отдельное указание на людей, которые сами выбирают участников.
  rationale: Контекст поддерживает добровольное участие, однако редкость формы не позволяет исключить иной синтаксический разбор, поэтому альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством царского официального распоряжения. Синтаксис слегка упрощён ради ясности, но сохранены добровольность участия, перечень групп и резкое указательное выражение «эти люди».
