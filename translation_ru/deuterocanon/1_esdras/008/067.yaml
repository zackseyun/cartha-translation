base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/067.yaml
  text: They took some of their daughters as wives for themselves and for their sons[a], and the holy seed was mixed with the foreign nations of the land[b]; and the leaders and the nobles shared in this lawlessness from the beginning of the matter.
translation:
  language: ru
  text: Они взяли некоторых из их дочерей себе и своим сыновьям в жёны, и святое семя[a] смешалось с иноплеменными народами этой земли; а предводители и вельможи с самого начала этого дела участвовали в этом беззаконии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святое потомство» или «святой род». Буквально по-гречески: «святое семя» — заветный образ народа, отделённого для Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были причастны к этому беззаконию». Греческий глагол означает участие или причастность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῴκισαν
  choice: брали ... в жёны
  rationale: Глагол обозначает совместную жизнь и в данном контексте — вступление в брак. Такая передача ясно выражает брачный смысл, не сводя действие к простому сожительству.
- source_word: τινας τῶν θυγατέρων αὐτῶν
  choice: некоторых из их дочерей
  rationale: Сохраняет партитивное значение и указание на ограниченное число дочерей.
- source_word: καὶ αὐτοὶ καὶ οἱ υἱοὶ αὐτῶν
  choice: себе и своим сыновьям
  rationale: По-русски естественно распространяет выражение «брали в жёны» на обе группы участников, сохраняя координацию исходного текста.
- source_word: ἐπεμίγη
  choice: смешалось
  rationale: Сохраняет образ смешения, не заменяя его пояснительным пересказом о браках или происхождении.
- source_word: τὸ σπέρμα τὸ ἅγιον
  choice: святое семя
  rationale: Буквально сохраняет метафору греческого текста и её заветный оттенок, не уточняя сверх текста, идёт ли речь прежде всего о потомстве, роде или народе.
- source_word: εἰς τὰ ἀλλογενῆ ἔθνη τῆς γῆς
  choice: с иноплеменными народами этой земли
  rationale: При русском глаголе «смешалось» требуется предлог «с». «Иноплеменные» передаёт отличие по происхождению, а «этой земли» — местную отнесённость выражения.
- source_word: μετεῖχον
  choice: участвовали в
  rationale: Прямо передаёт значение причастности к названному нарушению и звучит естественно в современном русском языке.
- source_word: οἱ προηγούμενοι καὶ οἱ μεγιστᾶνες
  choice: предводители и вельможи
  rationale: Сохраняет различие между руководящим положением первой группы и высоким общественным статусом второй.
- source_word: τῆς ἀνομίας ταύτης
  choice: в этом беззаконии
  rationale: «Беззаконие» сохраняет сильную правовую и нравственную оценку ἀνομία, не ослабляя её до общего обозначения проступка.
- source_word: ἀπὸ τῆς ἀρχῆς τοῦ πράγματος
  choice: с самого начала этого дела
  rationale: Естественная русская формулировка, близко передающая временное значение и широкое значение πράγμα как дела или происходящего.
theological_decisions:
- issue: Смысл выражения «святое семя» в контексте смешанных браков
  choice: Сохранить метафорическое выражение «святое семя».
  alternative: «святое потомство» или «святой род»
  rationale: Исходный текст использует заветную метафору и не раскрывает её в виде отдельного учения об этничности или родословии. Буквальная метафора сохраняет эту смысловую напряжённость.
- issue: Нравственная характеристика поступка
  choice: Передать ἀνομία словом «беззаконие».
  alternative: «преступление», «нарушение» или «нечестие»
  rationale: Так сохраняется явная правовая и заветная сила греческого слова без конфессионального уточнения характера нарушенного закона.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Слова «семя», «иноплеменные», «предводители», «вельможи» и «беззаконие» сохраняют достоинство и образность источника, оставаясь понятными современному читателю.
