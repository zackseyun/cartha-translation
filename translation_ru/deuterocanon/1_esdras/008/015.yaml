base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/015.yaml
  text: so as to bring sacrifices upon the altar of their Lord[a], the one in Jerusalem.
translation:
  language: ru
  text: чтобы принести жертвы на жертвенник их Господа[a], находящийся в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейской параллели в соответствующем контексте сказано: «для дома их Бога, который в Иерусалиме». Греческий текст здесь буквально говорит: «на жертвенник их Господа, находящийся в Иерусалиме».'
    reason: Существенное различие между греческим текстом и еврейской параллелью.
lexical_decisions:
- source_word: ὥστε
  choice: чтобы
  rationale: Передаёт цель действия в данном распорядительном контексте, не утверждая однозначно наступивший результат.
- source_word: προσενεγκεῖν
  choice: принести
  rationale: Обычное русское обозначение культового принесения жертв; сохраняет как идею доставления, так и совершения жертвоприношения.
- source_word: θυσίας
  choice: жертвы
  rationale: Прямой и общепонятный эквивалент культового термина в контексте жертвенника.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: на жертвенник
  rationale: ἐπί с винительным падежом указывает на направленность действия к жертвеннику и на возложение жертв на него.
- source_word: τοῦ κυρίου αὐτῶν
  choice: их Господа
  rationale: Сохраняет греческое κύριος и притяжательное местоимение, не добавляя отсутствующего в греческом тексте слова «Бог».
- source_word: τὸ ἐν Ἰερουσαλήμ
  choice: находящийся в Иерусалиме
  rationale: Форма среднего рода соотносится с θυσιαστήριον и уточняет, о каком жертвеннике идёт речь.
theological_decisions:
- issue: Передача κύριος в храмовом контексте
  choice: Господь
  alternative: владыка
  rationale: В контексте жертвенника и Иерусалима это почтительный титул Бога Израиля; «Господь» естественно передаёт такое употребление, не вводя дополнительного слова «Бог».
- issue: Расхождение греческого текста с еврейской параллелью
  choice: В основном тексте сохранено греческое «жертвенник их Господа»
  alternative: дом их Бога
  rationale: Греческий текст является первичным основанием перевода. Еврейская параллель подтверждает, что речь идёт о Боге Израиля, но содержит существенно иную формулировку, поэтому она отмечена в сноске, а не внесена в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской лексикой. Оборот «принести жертвы на жертвенник» понятен широкому читателю и сохраняет культовый характер исходного выражения.
