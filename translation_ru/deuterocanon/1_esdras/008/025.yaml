lexical_decisions:
- source_word: εὐλογητὸς
  choice: Благословен
  rationale: Предикативное прилагательное передаёт формулу благословения естественно и торжественно по-русски.
- source_word: μόνος ὁ κύριος
  choice: один лишь Господь
  rationale: Так сохраняется усилительное значение μόνος и исключительность Господа без превращения выражения в отвлечённый титул «единый Господь».
- source_word: ὁ δοὺς
  choice: вложивший
  rationale: В сочетании с εἰς τὴν καρδίαν глагол δίδωμι обозначает внутреннее побуждение; русское «вложить в сердце» точно и идиоматично передаёт образ исходного текста.
- source_word: ταῦτα
  choice: это
  rationale: Русское собирательное «это» естественно указывает на всё ранее сказанное, не конкретизируя неопределённый референт греческого местоимения.
- source_word: εἰς τὴν καρδίαν
  choice: в сердце
  rationale: После глагола «вложить» винительная конструкция «в сердце» естественно передаёт направленность εἰς.
- source_word: μου τοῦ βασιλέως
  choice: царя
  rationale: Передан наиболее вероятный смысл — решение было вложено в сердце царя; проблемное μου не внесено в основной текст, поскольку его буквальное присоединение делает фразу синтаксически неясной. Неопределённость отмечена в сноске.
theological_decisions:
- issue: Исключительное μόνος при κύριος
  choice: один лишь Господь
  alternative: только Господь; единый Господь
  rationale: Выбранная формулировка сохраняет исключительность хвалы или действия, но не разрешает искусственно, к чему именно относится μόνος, и не вводит дополнительного догматического оттенка слова «единый».
- issue: Неясная последовательность μου τοῦ βασιλέως
  choice: сердце царя с текстологической сноской
  alternative: моё сердце, царя; сердце моего господина царя
  rationale: Греческий текст в переданном виде синтаксически труден. Контекстуально вероятно сердце царя, однако вариант «моего господина царя» не имеет ясной опоры в слове κύριος, а буквальное «моё, царя» создаёт иную идентификацию говорящего. Поэтому вероятный смысл дан в тексте, а подлинная трудность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской формулы благословения. Оборот «один лишь Господь» понятен широкому читателю; причастие «вложивший» сохраняет компактность и связь с последующим контекстом. Конечная запятая сохранена, поскольку стих синтаксически продолжается.
