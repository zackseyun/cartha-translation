base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/060.yaml
  text: And the priests and the Levites who had received the silver and the gold and the vessels brought them to Jerusalem, into the temple of the Lord.
translation:
  language: ru
  text: Священники и левиты, приняв серебро, золото и сосуды, принесли всё это в храм Господа в Иерусалиме.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском параллельном тексте сказано: «чтобы доставить [их] в Иерусалим, в дом нашего Бога». Греческий текст 1 Ездры говорит, что их принесли «в храм Господа в Иерусалиме».'
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβόντες
  choice: приняв
  rationale: 'Аористное причастие обозначает действие, предшествующее принесению ценностей: священники и левиты сначала приняли вверенное им, а затем доставили его.'
- source_word: οἱ ἱερεῖς καὶ οἱ Λευεῖται
  choice: священники и левиты
  rationale: Прямое и естественное обозначение двух признанных групп храмовых служителей.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: серебро, золото
  rationale: Греческий текст прямо называет металлы; перевод не уточняет их форму и не истолковывает серебро как деньги.
- source_word: τὰ σκεύη
  choice: сосуды
  rationale: В храмовом контексте «сосуды» — традиционное и достаточно широкое обозначение священных предметов и утвари.
- source_word: ἤνεγκαν
  choice: принесли
  rationale: Глагол выражает доставку предметов к месту назначения без лишнего уточнения способа переноса.
- source_word: ἐν Ἰερουσαλὴμ ... εἰς τὸ ἱερὸν τοῦ κυρίου
  choice: в храм Господа в Иерусалиме
  rationale: Такой порядок естественно передаёт греческое указание на храм Господа, находящийся в Иерусалиме, и не заменяет ἐν («в») направительным «в Иерусалим» под влиянием еврейской параллели.
theological_decisions:
- issue: Божественный титул κυρίου
  choice: Господа
  alternative: нашего Бога
  rationale: Основной греческий текст содержит «храм Господа», тогда как еврейская параллель — «дом нашего Бога». Основной текст следует греческому свидетельству, а разночтение сохраняется в примечании.
- issue: Связь указания ἐν Ἰερουσαλήμ
  choice: храм Господа в Иерусалиме
  alternative: принесли в Иерусалим, в храм Господа
  rationale: Греческое ἐν означает местонахождение («в Иерусалиме»); направительное понимание опирается прежде всего на еврейскую параллель. Перевод сохраняет форму и естественный смысл первичного греческого текста, не скрывая альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Причастная конструкция сохранена без тяжеловесности; «всё это» естественно объединяет три перечисленных вида ценностей и ясно выражает подразумеваемое дополнение при глаголе.
