  text: from our Lord,[a]
translation:
  language: ru
  text: от Господа нашего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленный греческий текст этого стиха содержит только фрагмент «ὑπὸ τοῦ κυρίου ἡμῶν» — «от Господа нашего» (возможный смысл: «Господом нашим»). Приведённая еврейская параллель этой фразе прямо не соответствует, поэтому полный текст предложения здесь не восстанавливается.'
    reason: textual_variant
lexical_decisions:
- source_word: ὑπό
  choice: от
  rationale: С родительным падежом ὑπό обычно обозначает действующее лицо («кем»), но в данном изолированном фрагменте «от» естественно передаёт исходящую от Господа причину или действие, не уточняя отсутствующий контекст.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: κύριος передано традиционным и уместным в молитвенно-богословском контексте словом «Господь»; родительный падеж обусловлен предлогом ὑπό.
- source_word: ἡμῶν
  choice: нашего
  rationale: Местоимение первого лица множественного числа сохранено явно. Постпозиция «Господа нашего» придаёт фразе достоинство и естественно звучит в библейском русском регистре.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: владыка / господин
  rationale: «Господь» сохраняет обычное библейское обозначение Бога и соответствует вероятному молитвенному контексту, тогда как альтернативы могли бы необоснованно изменить богословский оттенок.
- issue: Несоответствие источников и фрагментарность греческого свидетельства
  choice: Перевести только сохранившийся греческий фрагмент
  alternative: Восстановить полный стих по приведённой еврейской параллели
  rationale: Предоставленный греческий текст содержит лишь ὑπὸ τοῦ κυρίου ἡμῶν, а еврейская параллель ему прямо не соответствует. Поэтому восстановление полного предложения внесло бы материал, отсутствующий в основном источнике.
- issue: Отношение, выраженное ὑπό с родительным
  choice: от Господа нашего
  alternative: Господом нашим
  rationale: Без управляющего глагола невозможно уверенно решить, следует ли понимать оборот как указание на непосредственного деятеля («Господом») или на источник («от Господа»). Формулировка «от Господа нашего» сохраняет естественность отдельного фрагмента и не реконструирует пропущенный глагол.
translation_notes:
  register: Современный литературный русский с умеренно традиционным библейским порядком слов «Господа нашего». Строчная форма «от» показывает, что это фрагмент продолжающегося предложения; сноска открыто отмечает неполноту и возможную агентную трактовку.
