base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/088.yaml
  text: Look, we are before you in our lawless deeds, for it is no longer possible to stand before you because of these things.
translation:
  language: ru
  text: Вот, мы пред тобой со своими беззакониями[a], ибо из-за этого уже невозможно стоять пред тобой.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в наших неправдах». Греческое слово может обозначать как беззаконные поступки, так и возникшее вследствие них состояние виновности.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском параллельном месте (Езд. 9:14) та же критическая ситуация выражена иначе: там подчёркнуты Божий гнев и угроза полного исчезновения остатка. Здесь, в 1 Ездры, говорится о невозможности стоять перед Богом из-за этих грехов.'
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет указательную и эмоциональную силу вступления, оставаясь естественным для современного литературного русского языка.
- source_word: ἐσμὲν ἐνώπιόν σου
  choice: мы пред тобой
  rationale: Передаёт пребывание в Божьем присутствии без добавления глагола «стоим», поскольку соответствующий глагол явно появляется далее в стихе.
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: в наших беззакониях
  rationale: Сохраняет как нравственно-правовой смысл ἀνομία, так и возможность понимать выражение одновременно как совершённые нарушения и обусловленное ими виновное состояние.
- source_word: οὐ γάρ ἐστιν στῆναι ἔτι
  choice: невозможно больше стоять
  rationale: Естественно передаёт греческую безличную конструкцию с инфинитивом и сохраняет образ предстояния перед Богом.
- source_word: ἔμπροσθέν σου
  choice: пред тобой
  rationale: Сохраняет торжественный и судебно-религиозный оттенок нахождения перед Богом; повтор соответствует повтору в греческом тексте.
- source_word: ἐπὶ τούτοις
  choice: из-за всего этого
  rationale: Передаёт причинное значение оборота в контексте исповеданных грехов; «всего» естественно обобщает упомянутое ранее, не добавляя нового содержания.
theological_decisions:
- issue: Значение ἀνομίαι в покаянном исповедании
  choice: беззакония
  alternative: беззаконные дела; неправды; виновность
  rationale: «Беззакония» сохраняет связь с нарушением Божьих установлений и не ограничивает выражение только поступками или только состоянием вины.
- issue: Соотношение греческого текста с еврейским параллельным местом Ездры 9:14
  choice: Следовать греческой формулировке о невозможности стоять перед Богом
  alternative: Расширить текст указанием на Божий гнев и уничтожение остатка по еврейскому параллельному месту
  rationale: Для 1 Ездры первичным источником служит греческий текст. Еврейское параллельное место подтверждает покаянный контекст, но здесь выражает кризис иными словами и не должно подменять греческую формулировку.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Оборот «пред тобой» выбран вместо разговорного «перед тобой» ради достоинства регистра; местоимение, относящееся к Богу, дано со строчной буквы как нейтральное редакционное решение.
