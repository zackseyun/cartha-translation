base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/059.yaml
  text: Stay awake and guard them until you hand them over to the chiefs of the priests and the Levites and to the heads of the fathers’ houses of Israel in Jerusalem[b][a], in the chambers of the house of our Lord.
translation:
  language: ru
  text: Бодрствуйте и храните их, пока не передадите начальникам священников и левитов и главам родов Израиля в Иерусалиме, в храмовых помещениях дома нашего Господа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Храмовые помещения» — комнаты при храмовом комплексе; еврейский параллельный текст также говорит о помещениях (לִשְׁכוֹת).
    reason: Пояснение редкого храмового термина παστοφορίοις и подтверждение его широкого значения параллельным свидетельством.
lexical_decisions:
- source_word: ἀγρυπνεῖτε καὶ φυλάσσετε
  choice: Бодрствуйте и храните
  rationale: Сочетание передаёт как неусыпную бдительность, так и ответственное сбережение вверенных ценностей. «Храните» здесь естественнее по-русски, чем «охраняйте это», и сохраняет смысл защитной custody.
- source_word: ἕως τοῦ παραδοῦναι αὐτὰ ὑμᾶς
  choice: пока не передадите
  rationale: Оборот обозначает конечный момент порученной охраны — передачу ценностей ответственным лицам; местоимение «это» вынесено к глаголу «храните» ради естественного русского синтаксиса.
- source_word: φυλάρχοις τῶν ἱερέων καὶ τῶν Λευειτῶν
  choice: начальникам священников и левитов
  rationale: φυλάρχοις означает начальствующих лиц. Зависимые родительные τῶν ἱερέων καὶ τῶν Λευειτῶν естественно относятся к одному обозначению руководителей, без излишнего уточнения «племенные».
- source_word: ἡγουμένοις τῶν πατριῶν τοῦ Ἰσραήλ
  choice: главам родов Израиля
  rationale: «Главы родов» передаёт формальную родовую структуру, подтверждаемую еврейским שָׂרֵי־הָאָבוֹת, и звучит естественнее современного русского буквального «главы отеческих домов».
- source_word: παστοφορίοις
  choice: храмовых помещениях
  rationale: Термин обозначает помещения при храмовом комплексе; такое широкое обозначение не навязывает более узкого смысла «кладовые» и согласуется с параллельным еврейским לִשְׁכוֹת.
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: дома нашего Господа
  rationale: Сохранены храмовая метафора «дом» и явное греческое «нашего Господа», без замены на чтение еврейской параллели.
theological_decisions:
- issue: Обозначение храма в τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: дома нашего Господа
  alternative: храма нашего Господа; дома Господа
  rationale: Греческий первичный текст прямо говорит «дома нашего Господа». Перевод сохраняет и притяжательное местоимение, и библейскую храмовую метафору, не подменяя их формой еврейской параллели.
- issue: Соотношение священников и левитов в φυλάρχοις τῶν ἱερέων καὶ τῶν Λευειτῶν
  choice: одно общее обозначение начальников обеих групп
  alternative: отдельные начальники священников и отдельные начальники левитов
  rationale: Греческий синтаксис допускает понимание одного множественного существительного с двумя зависимыми группами; русский перевод сохраняет эту компактность и не уточняет сверх текста административное устройство.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским регистром. Императив «бодрствуйте» сохраняет конкретную идею неусыпной бдительности; «роды Израиля» естественно передаёт древнюю родовую организацию. Тире отделяет обстоятельство места от длинного ряда адресатов и устраняет возможную синтаксическую двусмысленность.
