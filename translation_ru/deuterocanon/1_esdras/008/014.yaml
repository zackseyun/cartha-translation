translation:
  language: ru
  text: вместе с тем, что народ пожертвовал на храм их Господа в Иерусалиме[a], и золото и серебро, которые следует собрать на быков, баранов, ягнят и то, что к ним прилагается[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская параллель в Ездре 7:16 заметно отличается: там говорится о серебре и золоте, добровольно пожертвованных царём и его советниками Богу Израиля, чья обитель находится в Иерусалиме. Здесь переведён греческий текст 1 Ездры без согласования с этой параллелью.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «то, что следует вместе с ними»; вероятно, имеются в виду дополнительные предметы или приношения, сопровождающие жертвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν τῷ δεδωρημένῳ ὑπὸ τοῦ ἔθνους
  choice: вместе с тем, что народ пожертвовал
  rationale: Передаёт добавочное значение σὺν, дарственный характер формы δεδωρημένῳ и прямо сохраняет указанного в греческом тексте жертвователя — народ.
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου αὐτῶν τὸ ἐν Ἰερουσαλήμ
  choice: на храм их Господа в Иерусалиме
  rationale: «На храм» естественно выражает назначение пожертвования; «их Господа» сохраняет αὐτῶν и не добавляет отсутствующее в греческом слово «Бог».
- source_word: συναχθῆναι, τό τε χρυσίον καὶ ἀργύριον
  choice: а золото и серебро собрать
  rationale: Русский активный инфинитив в безлично-предписывающей конструкции звучит естественнее буквального пассива «быть собранными», сохраняя содержание греческого инфинитива.
- source_word: εἰς ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: на быков, баранов, ягнят
  rationale: Конкретные названия жертвенных животных соответствуют греческим словам и культовому контексту.
- source_word: τὰ τούτοις ἀκόλουθα
  choice: всё необходимое к ним
  rationale: Передаёт сопутствующие жертвоприношениям предметы, не уточняя их сверх общего выражения оригинала; возможная более буквальная передача отмечена в сноске.
theological_decisions:
- issue: Соотношение греческого текста с масоретской параллелью в Ездре 7:16
  choice: Перевести греческое чтение «народом… их Господа» без гармонизации.
  alternative: 'Согласовать с масоретской параллелью: серебро и золото, добровольно пожертвованные царём и его советниками Богу Израиля, чья обитель в Иерусалиме.'
  rationale: Для 1 Ездры первичным свидетельством служит греческий текст; существенное отличие масоретской параллели следует обозначить в сноске, а не устранять в переводе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранена синтаксическая незавершённость стиха как части более длинного предложения; запятая в конце указывает на продолжение.
