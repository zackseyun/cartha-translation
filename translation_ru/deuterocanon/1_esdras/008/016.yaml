base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/016.yaml
  text: And whatever you and your brothers wish to do with the silver and gold[a], carry it out according to the will of your God.
translation:
  language: ru
  text: И всё, что ты вместе со своими братьями пожелаешь сделать с серебром и золотом[a], исполни по воле твоего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском параллельном тексте, Ездры 7:18, сказано конкретнее: речь идёт о том, что покажется хорошим сделать с оставшимся серебром и золотом. Здесь, в 1 Ездры, греческая формулировка шире.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα ὅσα ἂν βούλῃ
  choice: всё, что ты… пожелаешь
  rationale: Открытое относительное выражение с ἄν и сослагательным наклонением передано естественной русской конструкцией, сохраняющей значение свободного намерения.
- source_word: μετὰ τῶν ἀδελφῶν σου
  choice: вместе со своими братьями
  rationale: Передаёт совместность действия и сохраняет обычное значение мужского множественного ἀδελφῶν, не сужая его непременно до родных братьев.
- source_word: ποιῆσαι χρυσίῳ καὶ ἀργυρίῳ
  choice: сделать с серебром и золотом
  rationale: Широкое значение ποιέω и инструментально-объектное употребление дательного падежа сохранены без добавления отсутствующего в греческом уточнения об остатке средств.
- source_word: ἐπιτέλει
  choice: исполни
  rationale: Повелительная форма выражает осуществление задуманного; «исполни» кратко, достойно и отличает основной глагол от предшествующего ποιῆσαι.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ σου
  choice: по воле твоего Бога
  rationale: Естественное русское соответствие, сохраняющее Божью волю как норму употребления средств.
theological_decisions:
- issue: Соотношение широкого греческого текста с более конкретным масоретским параллельным местом в Ездре 7:18
  choice: 'Следовать греческому тексту: широкое разрешение на то, что Ездра пожелает сделать вместе с братьями, ограниченное волей Бога.'
  alternative: 'Гармонизировать с масоретским текстом: «что покажется хорошим сделать с оставшимся серебром и золотом».'
  rationale: Для 1 Ездры основным свидетельством служит греческий текст, где нет слов «оставшееся» или «покажется хорошим». Примечание сообщает о различии, не подменяя исходный текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «ты» выражено для ясности; порядок «серебром и золотом» следует греческому тексту.
