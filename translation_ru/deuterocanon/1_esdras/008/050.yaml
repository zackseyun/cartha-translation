  text: And there I proclaimed a fast before our Lord for the young men[b][a],
translation:
  language: ru
  text: И там я объявил пост перед нашим Господом для юношей[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст буквально и синтаксически не вполне ясен: «И там я молился/дал обет относительно поста для юношей перед нашим Господом». В еврейском параллельном тексте сказано: «И объявил я там пост… перед нашим Богом»; этим, вероятно, объясняется перевод глагола как «объявил».'
    reason: alternative_reading
  - marker: b
    text: 'Еврейский параллельный текст (Езд. 8:21) содержит отсутствующие в этой греческой строке подробности: пост был объявлен у реки Агавы, чтобы смириться перед Богом и просить у Него прямого пути для самих путников, их детей и всего их имущества.'
    reason: cross_reference
lexical_decisions:
- source_word: εὐξάμην
  choice: я объявил
  rationale: Обычные значения εὔχομαι — «молиться» и «давать обет», однако сочетание с «постом» здесь необычно. Еврейский параллельный текст использует וָאֶקְרָא — «я объявил / провозгласил», что ясно передаёт смысл происходящего. Поэтому в основном тексте выбран контекстуальный перевод, а буквальные возможности греческого отмечены в сноске.
- source_word: ἐκεῖ
  choice: там
  rationale: Прямой и естественный перевод наречия места, сохраняющий связь с предшествующим повествованием.
- source_word: νηστείαν
  choice: пост
  rationale: В сочетании с глаголом «объявил» существительное естественно обозначает объявленный пост.
- source_word: τοῖς νεανίσκοις
  choice: для юношей
  rationale: νεανίσκοι означает «юноши, молодые мужчины». Дательный падеж допускает передачу отношения как «для юношей»; этот элемент греческого текста сохранён, хотя в еврейском параллельном месте его нет.
- source_word: ἔναντι
  choice: перед
  rationale: Передаёт значение нахождения или действия в присутствии кого-либо и естественно звучит в выражении религиозного характера.
- source_word: κυρίου ἡμῶν
  choice: нашим Господом
  rationale: Сохраняется чтение основного греческого источника «наш Господь»; отличие еврейского параллельного текста («наш Бог») не вносится в основной текст.
theological_decisions:
- issue: Расхождение греческого и еврейского текстов в основном глаголе
  choice: Контекстуально перевести εὐξάμην как «я объявил»
  alternative: «я молился» или «я дал обет»
  rationale: Буквальные значения греческого глагола создают необычное сочетание с существительным «пост», тогда как еврейское параллельное чтение «объявил пост» даёт связный смысл. Неоднозначность греческого сохранена в сноске.
- issue: Божественный титул
  choice: «наш Господь»
  alternative: «наш Бог»
  rationale: Основной греческий источник содержит κυρίου ἡμῶν, поэтому его чтение сохраняется; вариант еврейского параллельного текста отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис оставлен открытым запятой, поскольку исходная строка представляет собой часть продолжающегося предложения. Формулировка сохраняет все элементы греческого текста, а существенное расхождение с еврейским параллельным свидетельством вынесено в сноски.
