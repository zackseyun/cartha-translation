base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/090.yaml
  text: And Jechonias son of Jeelus[a], of the sons of Israel, cried out and said to Ezra, “We have sinned against the Lord, and foreign women from the nations of the land have dwelt among us[b]; and now there is still hope for all Israel.”
translation:
  language: ru
  text: 'И Иехония, сын Ииела, один из сынов Израиля, возгласил и сказал Ездре: «Мы согрешили против Господа; среди нас поселились иноплеменные женщины из народов этой земли[b]. И теперь для всего Израиля остаётся надежда[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная фраза греческого текста буквально неясна и, вероятно, дошла в повреждённом или сжатом виде. Перевод передаёт вероятный смысл параллельного места: «и теперь ещё есть надежда у Израиля».'
    reason: textual_variant
  - marker: b
    text: 'В греческом тексте сказано, что иноплеменные женщины «поселились» среди израильтян; параллельная традиция выражается определённее: «мы взяли в жёны иноплеменных женщин».'
    reason: alternative_reading
lexical_decisions:
- source_word: φωνήσας
  choice: громко воззвал
  rationale: Причастие от φωνέω указывает на произнесение слов вслух, с возвышением голоса; сочетание сохраняет торжественный и неотложный характер речи.
- source_word: Ἰεχονίας Ἰεήλου
  choice: Иехония, сын Ииела
  rationale: Родительный падеж второго имени естественно понимать как указание на отца; форма имён передаёт греческое свидетельство, не подменяя его иной традицией имён.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: из сынов Израиля
  rationale: Сохранена родословная и заветная окраска греческого выражения, хотя по-русски возможно более гладкое «израильтянин».
- source_word: ἡμάρτομεν εἰς τὸν κύριον
  choice: мы согрешили против Господа
  rationale: Предлог εἰς здесь выражает направленность проступка против Господа; совершенный вид естественно передаёт признание совершённого греха.
- source_word: γυναῖκες ἀλλογενεῖς
  choice: иноплеменные женщины
  rationale: ἀλλογενής обозначает принадлежность к другому народу. «Иноплеменные» точно передаёт этническую и общинную сторону выражения без позднейших богословских коннотаций слова «язычницы».
- source_word: ἐκ τῶν ἐθνῶν τῆς γῆς
  choice: из народов этой земли
  rationale: ἔθνη в данном контексте — «народы», а не непременно «язычники»; определительное «этой» делает русскую фразу естественной и передаёт контекстуально определённую землю.
- source_word: κατῴκησαν
  choice: среди нас поселились
  rationale: Глагол означает «поселиться, обитать». Добавленное по смыслу «среди нас» поясняет включение женщин в общину, но не заменяет греческое чтение более явным упоминанием брака.
- source_word: καὶ νῦν ἔστιν ἐπάνω πᾶς Ἰσραήλ
  choice: но и теперь для всего Израиля остаётся надежда
  rationale: Переданная греческая фраза синтаксически и семантически трудна и, вероятно, повреждена или сжата. Перевод воспроизводит вероятный смысл известного параллельного места Езд 10:2, отмечая текстологическую неопределённость в сноске.
theological_decisions:
- issue: Передача божественного титула κύριος
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Непосредственный источник — греческий текст с κύριος; форма «Господь» точно передаёт титул и не утверждает без отдельного основания, что здесь графически представлен тетраграмматон.
- issue: Смысл трудной заключительной фразы
  choice: для всего Израиля остаётся надежда
  alternative: буквальное, но неясное «теперь весь Израиль — наверху»
  rationale: 'Форма дошедшей греческой фразы не даёт связного смысла. Вероятный смысл сохранён на основании параллельной традиции, однако не выдан за бесспорное чтение: расхождение открыто отмечено в сноске.'
- issue: Характер отношений с иноплеменными женщинами
  choice: среди нас поселились
  alternative: мы взяли в жёны
  rationale: Перевод следует греческому κατῴκησαν и не вносит прямого упоминания брака из параллельной традиции, хотя контекст может подразумевать брачные отношения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены формулы «сыны Израиля» и «воззвал», но синтаксис сделан ясным для современного читателя. Сноски разграничивают перевод греческого свидетельства и восстановление вероятного смысла трудного места.
