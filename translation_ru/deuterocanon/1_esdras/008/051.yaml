  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/051.yaml
  text: to seek from him a prosperous journey for us and for our children and livestock[a].
translation:
  language: ru
  text: чтобы просить у Него благополучного пути для нас, наших детей и нашего скота[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удачного пути», «успеха в пути» или «безопасного пути». Греческое слово означает благоприятное продвижение в путешествии; еврейский параллельный контекст также говорит о помощи против врагов в дороге.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητῆσαι
  choice: просить
  rationale: В сочетании с παρά + родительный падеж инфинитив естественно передаёт обращённую к Богу просьбу; «просить» яснее по-русски, чем буквальное «искать у Него».
- source_word: παρʼ αὐτοῦ
  choice: у Него
  rationale: Оборот указывает на того, от кого ожидают просимого; «у Него» естественно передаёт греческую конструкцию и сохраняет местоименную отсылку.
- source_word: εὐοδίαν
  choice: благополучного пути
  rationale: Существительное обозначает удачное, благоприятное продвижение в пути. Такой перевод не сужает смысл исключительно до безопасности и сохраняет оттенок успешного путешествия.
- source_word: ἡμῖν τε καὶ τοῖς τέκνοις ἡμῶν καὶ κτήνεσιν
  choice: для нас, наших детей и нашего скота
  rationale: τέκνα охватывает детей независимо от пола, а κτήνη в контексте каравана означает домашних или вьючных животных; «скот» здесь кратко и естественно.
theological_decisions:
- issue: Характер просьбы о Божьем содействии в путешествии
  choice: благополучного пути
  alternative: безопасного пути; успеха в пути
  rationale: Греческий текст говорит о благоприятном ходе путешествия, не называя защиту прямо. Еврейский параллельный контекст упоминает помощь против врага в дороге, однако это не следует вводить в основной перевод данного греческого предложения.
translation_notes:
  register: Современный литературный русский язык; оборот сохраняет синтаксическую незавершённость исходного инфинитивного фрагмента. Местоимение «Него» написано с прописной буквы как уважительная отсылка к Богу.
