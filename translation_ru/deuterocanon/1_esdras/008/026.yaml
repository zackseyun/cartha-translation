lexical_decisions:
- source_word: ἐτίμησεν
  choice: почтил
  rationale: Передаёт оказание чести лично говорящему; естественно и достойно звучит по-русски.
- source_word: ἔναντι
  choice: перед
  rationale: Обозначает публичное оказание чести в присутствии названных лиц.
- source_word: τῶν βασιλευόντων
  choice: царствующими
  rationale: Сохраняет причастную форму греческого текста — «теми, кто царствует», — не превращая её без необходимости в простое существительное «царями».
- source_word: φίλων
  choice: друзьями
  rationale: Сохраняет основное значение слова; возможный придворный оттенок пояснён в сноске.
- source_word: μεγιστάνων
  choice: вельможами
  rationale: Естественное русское обозначение высокопоставленных и знатных людей при царском дворе.
