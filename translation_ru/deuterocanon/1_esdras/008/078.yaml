base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/078.yaml
  text: but he has shown us favor before the kings of Persia[a], to give us sustenance and to glorify our sanctuary and to raise up desolate Zion, to give us a stronghold in Judea and Jerusalem.
translation:
  language: ru
  text: но даровал нам благоволение в глазах персидских царей, чтобы дать нам пропитание, прославить наше святилище, восстановить опустошённый Сион и дать нам прочную опору[a] в Иудее и Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укрепление», «безопасность» или «твёрдое положение».'
    reason: 'στερέωμα имеет широкий диапазон значений: нечто твёрдое, опора, укрепление или устойчивость.'
lexical_decisions:
- source_word: ἐποίησεν ἡμᾶς ἐν χάριτι ἐνώπιον
  choice: даровал нам благоволение в глазах
  rationale: Греческий оборот означает, что Бог сделал народ предметом благоволения царей. Русская формулировка естественно передаёт это отношение, не превращая царей в явный субъект последующих инфинитивов.
- source_word: τῶν βασιλέων Περσῶν
  choice: персидских царей
  rationale: Естественная русская передача родительной конструкции со значением принадлежности или определения.
- source_word: δοῦναι ἡμῖν τροφήν
  choice: дать нам пропитание
  rationale: τροφή обозначает пищу или средства к существованию; «пропитание» сохраняет конкретность и допускает более широкий смысл обеспечения.
- source_word: δοξάσαι τὸ ἱερὸν ἡμῶν
  choice: прославить наше святилище
  rationale: δοξάζω передаёт наделение славой и почётом, а ἱερόν — святилище или храмовый комплекс. Выбор близок к форме греческого текста и не сужает значение до украшения здания.
- source_word: ἐγεῖραι τὴν ἔρημον Σειών
  choice: поднять опустошённый Сион
  rationale: Сохраняется образное значение ἐγείρω «поднять, воздвигнуть», тогда как ἔρημος описывает Сион как опустошённый; восстановление подразумевается, но не подставляется вместо образа.
- source_word: στερέωμα
  choice: прочную опору
  rationale: Слово обозначает твёрдость, устойчивое основание или средство укрепления. «Прочная опора» сохраняет широту значения лучше, чем более конкретная «крепость».
- source_word: ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: в Иудее и Иерусалиме
  rationale: Ἰουδαία здесь является географическим названием области; традиционная и современная русская форма — «Иудея».
theological_decisions:
- issue: Субъект инфинитивов δοῦναι, δοξάσαι и ἐγεῖραι
  choice: 'сохранить Бога подразумеваемым субъектом: «чтобы дать… прославить… поднять»'
  alternative: 'сделать персидских царей субъектом: «чтобы они дали…»'
  rationale: Грамматически инфинитивы естественно продолжают действие подразумеваемого божественного субъекта ἐποίησεν. Явное «они» разрешило бы синтаксическую неоднозначность в пользу царей без достаточного основания.
- issue: Значение στερέωμα в молитве о восстановлении
  choice: прочную опору
  alternative: крепость; безопасность; твёрдое положение
  rationale: Греческое слово допускает как конкретное, так и абстрактное понимание. Основной текст передаёт образ устойчивости, а альтернативы отмечены в сноске без догматического уточнения.
- issue: Передача имени Σειών
  choice: Сион
  alternative: Зион
  rationale: «Сион» — укоренившаяся русская библейская форма имени, не добавляющая отдельного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Параллелизм инфинитивов сохранён. Слово «но» оставлено со строчной буквы, поскольку представленный стих синтаксически продолжает предыдущий контекст. Маркер сноски помещён непосредственно при словах «прочную опору», к которым относится лексическая альтернатива.
