base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/023.yaml
  text: And you[a], Ezra, according to the wisdom of your God, appoint judges and magistrates, so that they may judge throughout all Syria and Phoenicia all those who know the law of your God; and you shall teach those who do not know it.
translation:
  language: ru
  text: И ты, Ездра, по мудрости Бога твоего назначь судей и судебных чиновников, чтобы они судили во всей Сирии и Финикии всех знающих закон Бога твоего; а тех, кто его не знает, ты научишь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте названы «Сирия и Финикия»; параллельное место в книге Ездры использует иное обозначение области.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνάδειξον
  choice: назначь
  rationale: Повелительное наклонение обозначает официальное поставление должностных лиц; «назначь» естественно и точно передаёт этот смысл.
- source_word: κριτὰς καὶ δικαστάς
  choice: судей и судебных начальников
  rationale: Сохраняется различие двух греческих наименований судебных должностей; второе передано функционально, без слияния обоих терминов.
- source_word: ὅπως δικάζωσιν
  choice: чтобы они судили
  rationale: Передаёт целевое значение ὅπως и сохраняет лексическую связь с «судьями».
- source_word: ἐν ὅλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: во всей Сирии и Финикии
  rationale: Прямо сохраняет территориальные названия и широту юрисдикции греческого текста.
- source_word: πάντας τοὺς ἐπισταμένους τὸν νόμον
  choice: всех знающих закон
  rationale: ἐπίσταμαι здесь указывает на знание закона; краткая конструкция естественна для современного русского языка.
- source_word: καὶ τοὺς μὴ ἐπισταμένους διδάξεις
  choice: а тех, кто его не знает, ты научишь
  rationale: Будущее время сохранено как предписание в указе; местоимение «его» естественно отсылает к закону.
theological_decisions:
- issue: Греческое территориальное обозначение и расхождение с масоретской параллелью
  choice: Сохранить «Сирия и Финикия» в основном тексте
  alternative: Гармонизировать с иной административно-территориальной формулировкой параллели в книге Ездры
  rationale: Для 1 Ездры первичным источником служит греческий текст, прямо называющий Сирию и Финикию; параллельное семитское свидетельство не должно заменять это чтение.
- issue: Отнесение σου в выражении τοῦ θεοῦ σου
  choice: «Бога твоего»
  alternative: «Бога»
  rationale: Местоимение явно присутствует в греческом и относится к Богу как в выражении о мудрости, так и далее в выражении о законе.
translation_notes:
  register: Современный литературный русский язык с достоинством официального указа. Инверсия «Бога твоего» поддерживает библейский регистр, оставаясь понятной; различие судебных должностей сохранено без чрезмерной архаизации.
