lexical_decisions:
- source_word: ἀπενεγκεῖν
  choice: доставить
  rationale: Инфинитив обозначает перенесение к указанному месту назначения; «доставить» естественно передаёт направленность движения в Иерусалим.
- source_word: δῶρα
  choice: дары
  rationale: Сохраняет широкое значение слова и не превращает его без достаточных оснований в узкий культовый термин; возможный оттенок приношений отмечен в сноске.
- source_word: τῷ κυρίῳ
  choice: Господу / для Господа
  rationale: В данном иудейском библейском контексте κύριος относится к Богу Израиля. Формы с дательным оборотом передают посвящение даров Господу.
- source_word: ἃ ηὔξαμην ἐγώ τε καὶ οἱ φίλοι
  choice: которые дали в обет я и мои друзья
  rationale: «Дать в обет» передаёт религиозно-обещательный смысл εὔχομαι; явное называние «я и мои друзья» сохранено, несмотря на несколько необычное согласование исходной греческой фразы.
- source_word: πᾶν χρυσίον καὶ ἀργύριον
  choice: всё золото и серебро
  rationale: Естественное собирательное выражение, сохраняющее всеохватность πᾶν.
- source_word: ὃ ἐὰν εὑρεθῇ
  choice: какое найдётся
  rationale: Передаёт неопределённость и возможность, выраженные сочетанием ἐάν с сослагательным наклонением.
- source_word: ἐν τῇ χώρᾳ τῆς Βαβυλωνίας
  choice: в земле Вавилонии
  rationale: χώρα здесь обозначает территорию или область; «земля Вавилонии» не навязывает более узкого административного значения.
- source_word: τῷ κυρίῳ εἰς Ἰερουσαλήμ
  choice: для Господа в Иерусалиме
  rationale: Сохраняет краткость и смысл посвящения средств Господу в Иерусалиме, не скрывая синтаксической сжатости греческой фразы.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: В контексте иудейского Писания слово обозначает Бога Израиля; традиционное «Господь» точно и понятно современному читателю.
- issue: Культовый оттенок δῶρα и ηὔξαμην
  choice: дары … дали в обет
  alternative: приношения … обещали
  rationale: Выбранная формулировка сохраняет религиозное посвящение Богу, но не уточняет вид приношения сверх того, что выражено в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет характер продолжения более длинного предложения; формулировка не устраняет неоднозначность заключительного оборота.
