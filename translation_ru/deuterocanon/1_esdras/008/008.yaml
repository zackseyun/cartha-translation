base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/008.yaml
  text: A copy of the document presented by King Artaxerxes to Ezra the priest and reader of the law of the Lord is set out below:[a][b]
translation:
  language: ru
  text: Ниже приводится копия документа, направленного царём Артаксерксом священнику Ездре, чтецу закона Господня:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — «чтец закона Господня». В еврейской параллели, Ездра 7:11, Ездра назван «книжником», а не «чтецом».
    reason: alternative_reading
  - marker: b
    text: Греческая формулировка этого заголовка несколько затруднительна; по смыслу ниже воспроизводится копия документа царя Артаксеркса, адресованного Ездре.
    reason: textual_variant
lexical_decisions:
- source_word: Προσπεσόντος
  choice: направленного
  rationale: 'Передаёт вероятный смысл трудной греческой формулы в документальном заголовке: царский документ был послан или передан Ездре. Выбор не уточняет сверх текста конкретный способ вручения.'
- source_word: παρὰ Ἀρταξέρξου βασιλέως
  choice: царём Артаксерксом
  rationale: παρά с родительным обозначает источник; в связи с царским документом русский творительный естественно указывает, от кого он исходит.
- source_word: πρὸς Ἔσραν
  choice: священнику Ездре
  rationale: 'πρός имеет направительное значение: документ адресован Ездре. Дательный падеж по-русски естественно выражает адресата.'
- source_word: τὸν ἱερέα
  choice: священнику
  rationale: Прямо сохраняет титул Ездры в греческом тексте.
- source_word: ἀναγνώστην τοῦ νόμου Κυρίου
  choice: чтецу закона Господня
  rationale: ἀναγνώστης буквально означает читающего вслух, чтеца. Перевод сохраняет особое чтение греческого свидетеля и не подменяет его словом «книжник» по еврейской параллели.
- source_word: Κυρίου
  choice: Господня
  rationale: Традиционная и естественная русская передача κύριος в наименовании Бога Израиля; форма согласована с устойчивым выражением «закон Господень».
- source_word: ἀντίγραφον
  choice: копия документа
  rationale: ἀντίγραφον — документальная копия; добавление слова «документа» делает по-русски ясным подразумеваемый предмет, не изменяя смысла.
- source_word: τὸ ὑποκείμενον
  choice: Ниже приводится
  rationale: Буквально речь идёт о том, что помещено ниже. В русском документальном заголовке эта формула естественно вводит следующий далее текст.
theological_decisions:
- issue: Соотношение греческого наименования Ездры с еврейской параллелью в Ездре 7:11
  choice: В основном тексте оставлено греческое «чтец закона Господня».
  alternative: «книжник закона Господня» или формулировка еврейской параллели
  rationale: Для 1 Ездры основным источником служит непосредственно греческий текст. Гармонизация с еврейской параллелью скрыла бы реальное различие свидетелей; оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством документального заголовка. Формула «Ниже приводится» устраняет неестественную греческую конструкцию, а «чтец закона Господня» намеренно сохраняет отличительное чтение греческого источника.
