revisions:
- from: Этот Ездра поднялся из Вавилона. Он был искусным[a] книжником в Законе Моисея, данном Богом Израиля,
  to: Этот Ездра вышел из Вавилона, будучи искусным[a] книжником, сведущим в Законе Моисея, переданном Богом Израиля,
  rationale: Исправлена естественность русского глагола движения, восстановлена более тесная связь характеристики Ездры с основным действием и уточнена передача ἐκδεδομένῳ. Добавленное «сведущим» делает русскую связь «книжник в Законе» нормативной, сохраняя значение ἐν как области его компетентности. Конечная запятая сохранена, поскольку греческая фраза продолжается в следующем стихе.
  reviewer_model: gpt-5.6-terra
