base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/003.yaml
  text: This Ezra went up from Babylon[a], being a skillful scribe in the law of Moses that had been given by the God of Israel,
translation:
  language: ru
  text: Этот Ездра вышел из Вавилона, будучи искусным[a] книжником, сведущим в Законе Моисея, переданном Богом Израиля,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «способным»; греческое слово может обозначать природную одарённость, понятливость или приобретённое мастерство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: поднялся
  rationale: Сохраняет обычную библейскую направительную идиому о путешествии из Вавилона в Иерусалим или землю Израиля.
- source_word: γραμματεὺς
  choice: книжником
  rationale: Устоявшееся обозначение человека, сведущего в Писании и Законе; не сводит его роль к административной должности.
- source_word: εὐφυὴς
  choice: искусным
  rationale: Передаёт способность, умение и практическую компетентность Ездры как книжника, не добавляя идеи формального образования.
- source_word: ἐν τῷ Μωυσέως νόμῳ
  choice: в Законе Моисея
  rationale: Сохраняет конструкцию, указывающую на область компетентности Ездры, и традиционное наименование Моисеева Закона.
- source_word: ἐκδεδομένῳ
  choice: данном
  rationale: 'Естественно передаёт пассивное значение причастия: Закон был передан или дарован Богом.'
- source_word: τοῦ θεοῦ τοῦ Ἰσραήλ
  choice: Богом Израиля
  rationale: Прямо и естественно сохраняет указание на божественный источник Закона.
theological_decisions:
- issue: Связь служения Ездры с Законом Моисея
  choice: «искусным книжником в Законе Моисея»
  alternative: «книжником, хорошо знавшим Закон Моисея»
  rationale: Выбранная формулировка сохраняет и роль книжника, и обозначенную греческим текстом компетентность в сфере Закона, не превращая эту характеристику лишь в утверждение об объёме знаний.
- issue: Божественное происхождение Закона
  choice: «Законе Моисея, данном Богом Израиля»
  alternative: «Законе Моисея, который передал Бог Израиля»
  rationale: Сохраняется пассивная форма исходного текста и прямо выражается, что источником Закона является Бог Израиля, без дополнительных богословских уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Длинное греческое предложение разделено для естественности русского повествования; завершающая запятая сохранена, поскольку стих синтаксически продолжается далее.
