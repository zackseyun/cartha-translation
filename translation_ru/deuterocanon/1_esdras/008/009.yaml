translation:
  language: ru
  text: 'Царь Артаксеркс — Ездре, священнику и чтецу закона Господня: приветствие[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «чтецу закона Господня»; в арамейском параллельном тексте Ездры 7:12: «книжнику закона Бога небесного».'
    reason: alternative_reading
lexical_decisions:
- source_word: Βασιλεὺς Ἀρταξέρξης
  choice: Царь Артаксеркс
  rationale: Естественная для русского языка передача царского титула перед именем; отсутствие артикля соответствует стилю заголовка письма.
- source_word: Ἔσρᾳ
  choice: Ездру
  rationale: Дательный падеж адресата передан в составе естественной русской формулы «приветствует Ездру»; используется общепринятая русская форма имени.
- source_word: τῷ ἱερεῖ
  choice: священника
  rationale: Обозначение служения Ездры сохранено как приложение к имени; падеж согласован с русской конструкцией.
- source_word: ἀναγνώστῃ
  choice: чтеца
  rationale: Греческое слово непосредственно обозначает читающего или чтеца. Перевод не гармонизируется с еврейским параллельным текстом, где стоит «книжник».
- source_word: τοῦ νόμου Κυρίου
  choice: закона Господня
  rationale: Сохраняется зависимость родительного падежа и библейски уместная, но понятная современному читателю форма «Господня».
- source_word: χαίρειν
  choice: приветствует
  rationale: Функционально точная и естественная русская передача стандартной греческой эпистолярной формулы приветствия.
theological_decisions:
- issue: Греческое ἀναγνώστῃ и «книжник» в еврейском параллельном тексте Ездры 7:12
  choice: чтеца
  alternative: книжника
  rationale: Основным источником для 1 Ездры служит греческий текст, который здесь прямо называет Ездру чтецом. Отличающееся чтение еврейской параллели не должно подменять греческое, но отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярной царской формулы. Перестройка именной формулы с χαίρειν в глагольную конструкцию «приветствует» делает фразу естественной по-русски, не меняя ее смысла.
