base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/052.yaml
  text: For I was ashamed to ask for horsemen and foot soldiers as an escort for safety against those hostile to us[a].
translation:
  language: ru
  text: Ведь мне было стыдно просить конников и пеших воинов в качестве сопровождения, чтобы обезопасить нас от враждебных нам людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνετράπην
  choice: я постыдился
  rationale: Передаёт чувство стыда и вызванную им сдержанность; естественно и достойно звучит в современном русском.
- source_word: αἰτῆσαι
  choice: просить
  rationale: Инфинитив обозначает обращение с просьбой; дополнение ясно из перечисления воинов.
- source_word: ἵππεις
  choice: конников
  rationale: Прямой и понятный эквивалент, сохраняющий противопоставление пешим воинам.
- source_word: πεζοὺς
  choice: пеших воинов
  rationale: Ясно выражает воинский смысл слова и естественнее буквального «пеших» без существительного.
- source_word: προπομπὴν
  choice: для охраны
  rationale: В данном контексте речь идёт о сопровождающем вооружённом отряде, обеспечивающем безопасность в пути; русское «для охраны» естественно передаёт его функцию.
- source_word: ἕνεκεν ἀσφαλείας
  choice: для охраны
  rationale: Целевая конструкция выражает обеспечение безопасного пути; по-русски это значение компактно объединено с προπομπή.
- source_word: τῆς πρὸς τοὺς ἐναντίους ἡμῖν
  choice: от наших противников
  rationale: Передаёт направленность защиты против тех, кто выступает против общины, не усиливая значение до формального обозначения военного врага.
theological_decisions:
- issue: Несоответствие приведённой масоретской параллели греческому тексту
  choice: Перевести греческое высказывание о просьбе предоставить военную охрану без гармонизации с еврейским текстом о посте и молитве.
  alternative: Заменить или дополнить содержание формулировкой из приведённой масоретской параллели.
  rationale: Для 1 Ездры первичным источником служит греческий текст; приведённая еврейская параллель относится к иному содержательному фрагменту и не должна управлять переводом этого стиха.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет причинное «ведь», личное чувство стыда и военный характер запрашиваемого сопровождения. Формулировка «для охраны от наших противников» естественно объединяет цель сопровождения и источник опасности.
