translation_notes:
  register: Современный литературный русский язык с умеренно книжным, повествовательным тоном. «Казнохранилище» сохраняет древний институциональный колорит и остаётся понятным; синтаксическая неоднозначность греческого выражения не устранена без оговорки, а вынесена в сноску.
