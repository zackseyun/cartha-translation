  source_fidelity: 'Основной текст точно передаёт греческое καὶ εἶπα αὐτοῖς ἐλθεῖν πρὸς: «И я велел им пойти к». Личное имя Λαδδαῖον корректно транслитерировано и грамматически оформлено как «Ладдаю». «Начальнику при казнохранилище» передаёт ἡγούμενον и сжатое, синтаксически не вполне однозначное τὸν ἐν τῷ τόπῳ γαζοφυλακίου без неоправданного уточнения должности или устройства места.'
