base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/045.yaml
  text: And I told them to go to Laddaeus[a], the leader at the place of the treasury[b],
translation:
  language: ru
  text: И я велел им пойти к Ладдаю[a], начальнику при казнохранилище[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте здесь назван только Ладдай, тогда как еврейский параллельный рассказ в Ездры 8:16 перечисляет нескольких посланных мужей. По-видимому, Первая книга Ездры в этом месте сокращает или иначе выстраивает параллельный рассказ.
    reason: alternative_reading
  - marker: b
    text: 'Или: «начальнику в месте казнохранилища»; возможно также понимание: «ведавшему казнохранилищем». Греческое выражение сжато и допускает несколько способов связать последние слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπα αὐτοῖς ἐλθεῖν πρὸς
  choice: я велел им пойти к
  rationale: Конструкция λέγω с инфинитивом передаёт распоряжение; «велел… пойти к» естественно выражает это значение по-русски и сохраняет направление движения к названному человеку.
- source_word: Λαδδαῖον
  choice: Ладдаю
  rationale: Греческое личное имя Λαδδαῖος передано транслитерацией и поставлено в дательном падеже после предлога «к».
- source_word: τὸν ἡγούμενον
  choice: начальнику
  rationale: Причастие обозначает человека, который руководит или отвечает за что-либо. «Начальник» нейтральнее, чем «правитель», и не приписывает ему определённой государственной должности.
- source_word: τὸν ἐν τῷ τόπῳ γαζοφυλακίου
  choice: при казнохранилище
  rationale: Сжатое греческое выражение указывает на место или сферу служения Ладдая. «При казнохранилище» звучит естественно, не перегружая основной текст, а возможные синтаксические оттенки отмечены в сноске.
