    rationale: «Отослать» возможно в брачном контексте, но ἐκβάλλω означает более сильное удаление/изгнание. «Удалить» точнее сохраняет исходную семантику без чрезмерной конкретизации.
  - severity: low
    issue: Определение «из чужих народов» стилистически неловко связано со словом «жён».
    rationale: Формулировка может звучать так, словно жён отправляют «из» народов. Оборот «жён, происходящих из других народов» однозначно характеризует женщин.
  - severity: medium
    issue: Сноска формулирует альтернативу как обрывок фразы и недостаточно ясно описывает проблему.
    rationale: Нужно пояснить, что неясны как значение дательного σοι («тобой»/«для тебя»), так и синтаксическая роль последующего «и все, кто будет повиноваться».
