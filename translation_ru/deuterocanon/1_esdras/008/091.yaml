base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/091.yaml
  text: In this matter let there be for us an oath to the Lord[a], to send away all our wives from among the foreigners, together with their children, as it has been decided by you[b], and by all who obey the law of the Lord.
translation:
  language: ru
  text: 'В этом деле принесём Господу клятву: удалить всех наших жён, происходящих из других народов, вместе с их детьми, как было решено тобой и всеми, кто будет повиноваться закону Господа.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая концовка синтаксически сжата. Дательный в выражении «как было решено тобой» может также пониматься как «как было решено для тебя», а связь слов «и всеми, кто будет повиноваться закону Господа» с предшествующим оборотом не вполне ясна.
    reason: Сохраняет синтаксическую неоднозначность греческого текста, на которой основано основное связное прочтение.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: в этом деле
  rationale: Контекстуально раскрывает краткое греческое выражение и естественно обозначает обсуждаемый вопрос.
- source_word: γενέσθω ἡμῖν ὁρκωμοσία πρὸς τὸν κύριον
  choice: дадим Господу клятву
  rationale: Передаёт призыв к принесению клятвы естественным современным русским языком; отношение к Господу сохранено без введения дополнительного богословского смысла.
- source_word: ἐκβαλεῖν
  choice: отослать
  rationale: В брачном контексте обозначает удаление жён из общины или дома; «отослать» сохраняет серьёзность действия, не усиливая его до явно насильственного «изгнать».
- source_word: πάσας τὰς γυναῖκας ἡμῶν τὰς ἐκ τῶν ἀλλογενῶν
  choice: всех наших жён из чужих народов
  rationale: γυναῖκας по контексту означает жён, а ἀλλογενῶν указывает на происхождение из иных народов, а не на позднейшую богословскую категорию язычников.
- source_word: σὺν τοῖς τέκνοις αὐτῶν
  choice: вместе с их детьми
  rationale: Точно и ясно передаёт включение детей в предполагаемое удаление.
- source_word: ὡς ἐκρίθη σοι
  choice: как было решено тобой
  rationale: Сохраняет судебно-распорядительный оттенок κρίνω и наиболее вероятно понимает дательный σοι как указание на лицо, вынесшее решение.
- source_word: καὶ ὅσοι πειθαρχήσουσιν τοῦ νόμου τοῦ κυρίου
  choice: и всеми, кто будет повиноваться закону Господа
  rationale: Восполняет подразумеваемую синтаксическую связь с предыдущим оборотом, сохраняя будущее значение πειθαρχήσουσιν и управление со значением послушания закону.
theological_decisions:
- issue: Передача κύριος применительно к Богу Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» соответствует устойчивому библейскому русскому употреблению и заветно-правовому контексту.
- issue: Этническое обозначение ἀλλογενῶν
  choice: из чужих народов
  alternative: иноплеменниц; чужеземок; язычниц
  rationale: Выбранный вариант передаёт происхождение из иных народов без анахроничного или конфессионально нагруженного оттенка слова «язычницы».
- issue: Синтаксически сжатое окончание стиха
  choice: решение приписано «тебе и всем, кто будет повиноваться»
  alternative: «как было решено для тебя; и все, кто будет повиноваться закону Господа»
  rationale: Основной текст даёт наиболее связное контекстуальное прочтение, а подлинная неоднозначность греческой конструкции отмечена в сноске.
