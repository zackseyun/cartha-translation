base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/001.yaml
  text: And after these things[a], in the reign of Artaxerxes king of the Persians, Ezra son of Azariah, son of Zechariah, son of Chelkiah, son of Shallum[b], came up.
translation:
  language: ru
  text: После этих событий, в царствование Артаксеркса, царя персов[a], взошёл Ездра, сын Азарии, сына Захарии, сына Хелкии[b], сына Саллума.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «царя персов»; в еврейском параллельном тексте Ездры 7:1 — «царя Персии». Основной текст следует греческому источнику 1 Ездры.'
    reason: alternative_reading
  - marker: b
    text: Греческой форме «Хелкия» в еврейском параллельном тексте соответствует более привычная форма имени «Хилкия».
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταγενέστερος τούτων ἐστίν
  choice: После этих событий
  rationale: Сжатый греческий оборот служит хронологическим переходом. Такое прочтение естественно по-русски и подтверждается еврейским параллельным текстом וְאַחַר הַדְּבָרִים הָאֵלֶּה.
- source_word: βασιλεύοντος Ἀρταξέρξου
  choice: в царствование Артаксеркса
  rationale: Родительный самостоятельный оборот задаёт время действия; выбранная формулировка точно и естественно передаёт его в повествовательном русском стиле.
- source_word: τοῦ βασιλέως Περσῶν
  choice: царя персов
  rationale: В греческом стоит множественное число «персов»; оно сохранено без гармонизации с еврейским параллельным текстом, где сказано «царь Персии».
- source_word: προσέβη
  choice: прибыл
  rationale: Глагол обозначает прибытие с оттенком движения вверх, в данном контексте — восхождение к Иерусалиму. «Прибыл» естественно звучит без добавления не названного в стихе места назначения.
- source_word: Ἔσρας
  choice: Ездра
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: Ἀζαραίου
  choice: Азария
  rationale: Форма соответствует еврейскому имени עֲזַרְיָה; использована принятая русская библейская передача.
- source_word: Ζεχρίου
  choice: Захария
  rationale: Принятая русская форма известного библейского имени.
- source_word: Χελκείου
  choice: Хелкия
  rationale: Основной текст передаёт форму греческого свидетеля; еврейский параллельный текст даёт более привычную форму «Хилкия», отмеченную в сноске.
- source_word: Σαλήμου
  choice: Саллум
  rationale: Форма передаёт библейское имя, соответствующее еврейскому שַׁלּוּם, с учётом греческого написания.
