lexical_decisions:
- source_word: ἔδωκεν αὐτῷ ὁ βασιλεὺς δόξαν
  choice: царь оказал ему честь
  rationale: Буквальное «дал ему славу» в современном русском звучит неестественно. В придворном контексте δόξα обозначает честь, почёт или признание со стороны царя.
- source_word: εὑρόντος χάριν ἐναντίον αὐτοῦ
  choice: потому что тот снискал его благосклонность
  rationale: Родительный самостоятельный оборот передаёт обстоятельство причины. Выражение «снискать благосклонность» естественно воспроизводит библейскую идиому «найти милость перед кем-либо», а местоимение «тот» помогает различить Ездру и царя, не меняя отношений между ними.
- source_word: ἐπὶ πάντα τὰ ἀξιώματα αὐτοῦ
  choice: во всех своих просьбах
  rationale: 'В данном контексте ἀξίωμα вероятнее означает просьбу или ходатайство, а не должность: речь идёт о благосклонном отношении царя ко всем обращениям Ездры. Предложная конструкция передана естественным русским оборотом.'
