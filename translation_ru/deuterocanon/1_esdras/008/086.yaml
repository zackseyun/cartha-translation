base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/086.yaml
  text: Were you not angry with us[a], to destroy us, leaving no root or seed or name of ours?
translation:
  language: ru
  text: Разве Ты не разгневался на нас, чтобы погубить нас, не оставив от нас ни корня, ни семени, ни имени?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «не оставив от нас ни остатка, ни потомства, ни имени». Буквально по-гречески: «корня, семени и имени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: Разве … не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, естественной современной русской конструкцией.
- source_word: ὠργίσθης ἡμῖν
  choice: Ты не разгневался на нас
  rationale: Сохраняет прямое обозначение Божьего гнева и естественно передаёт дательный падеж при глаголе гнева.
- source_word: ἀπολέσαι ἡμᾶς
  choice: чтобы погубить нас
  rationale: Прямо передаёт инфинитив ἀπολέσαι, не ослабляя смысла до простого бедствия или поражения.
- source_word: ἕως τοῦ μὴ καταλιπεῖν
  choice: настолько … не оставив
  rationale: Естественно по-русски выражает предельную степень и итог уничтожения; «настолько» проясняет связь с гневом, не меняя её богословского напряжения.
- source_word: ῥίζαν
  choice: корня
  rationale: Сохраняет конкретный образ греческого текста и его метафорический смысл продолжающегося рода.
- source_word: σπέρμα
  choice: семени
  rationale: Сохраняет буквальный библейский образ, допускающий значение потомства, и поддерживает трёхчастное сочетание с «корнем» и «именем».
- source_word: ὄνομα ἡμῶν
  choice: имени нашего
  rationale: Передаёт продолжение идентичности и существования рода, сохраняя буквальное «имя» и относя «нашего» ко всему перечислению.
theological_decisions:
- issue: Предел уничтожения в покаянной молитве
  choice: Сохранён риторический вопрос о Божьем гневе, способном привести к полному исчезновению корня, семени и имени народа.
  alternative: Передать образы толковательно как «остаток, потомство и память».
  rationale: Греческий текст использует конкретную тройную формулу «корень, семя и имя». Её сохранение позволяет читателю самому увидеть тему полного суда и прекращения рода, не подменяя образы отвлечённым богословским термином.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Обращение к Богу оформлено с прописной буквы. Трёхчастный образ исходного текста сохранён без конфессионального истолкования.
