lexical_decisions:
- source_word: συνανέβησαν
  choice: вместе поднялись
  rationale: Глагол передаёт совместное восхождение. «Поднялись» сохраняет обычный библейский образ путешествия в Иерусалим, а «вместе» выражает значение приставки συν-.
- source_word: ἐκ τῶν υἱῶν Ἰσραήλ
  choice: некоторые из сынов Израиля
  rationale: Предлог ἐκ указывает, что речь идёт о представителях названной группы; «сыны Израиля» близко передаёт греческую родственную формулу, а слово «некоторые» делает её функцию ясной по-русски.
- source_word: ἱερέων
  choice: священников
  rationale: Общепринятое обозначение священнической группы.
- source_word: Λευειτῶν
  choice: левитов
  rationale: Традиционное и понятное обозначение левитов.
- source_word: ἱεροψαλτῶν
  choice: храмовых певцов
  rationale: Сложное слово обозначает певцов, связанных со священным, храмовым служением; выбранный вариант ясно передаёт эту функцию.
- source_word: θυρωρῶν
  choice: привратников
  rationale: Естественное современное обозначение служителей, отвечавших за храмовые входы и ворота.
- source_word: ἱεροδούλων
  choice: храмовых служителей
  rationale: В перечне храмового персонала выражение прежде всего называет группу людей, состоявших при храме. Более сильный оттенок подневольного положения сохранён в сноске.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: Естественная русская конструкция для обозначения направления движения.
theological_decisions:
- issue: Передача υἱῶν Ἰσραήλ в перечне возвратившихся
  choice: сынов Израиля
  alternative: израильтян
  rationale: Основной текст сохраняет образ и форму греческого выражения, не сужая его корпоративного значения; более гладкий русский эквивалент приведён в сноске.
- issue: Передача ἱερόδουλοι
  choice: храмовые служители
  alternative: храмовые рабы
  rationale: В данном перечне термин обозначает установленную категорию храмового персонала. Вариант «служители» естественнее в основном тексте и не утверждает точный юридический статус, которого контекст не раскрывает; возможный оттенок несвободы отмечен в сноске.
