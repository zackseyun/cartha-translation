base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/062.yaml
  text: And when the third day came there, the silver and the gold were weighed out and handed over in the house of the Lord to Marmothi son of Ourias the priest, and with him was Eleazar son of Phinehas; and with them were Josabees son of Jesous and Moeth son of Sabannus, the Levites, by number and by weight, all of it; and the whole weight was recorded at that very time.
translation:
  language: ru
  text: Когда там настал третий день, серебро и золото взвесили и передали в доме Господа священнику Мармофию, сыну Урии[a]. Вместе с ним был Елеазар, сын Финееса, а с ними — левиты Иосавей, сын Иисуса, и Моэт, сын Саванна. Всё было учтено по числу и весу, и весь вес записали тогда же.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В параллельной масоретской традиции имена в этом перечне переданы иначе: Меремоф, сын Урии; Елеазар, сын Финееса; а соответствующие левиты названы Ионафаном, сыном Иисуса, и Ноадией, сыном Биннуя. Основной текст следует греческому свидетельству 1 Ездры. В греческом после имени Мармофия буквально стоят формы «Урии, священнику» без слова «сын»; родственная связь уточнена по принятому пониманию и параллельной традиции.'
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης αὐτόθι ἡμέρας τρίτης
  choice: Когда там настал третий день
  rationale: Генитив абсолютный выражает время, а αὐτόθι — место. Формулировка сохраняет последовательность и некоторую необычность греческого выражения, не превращая его без необходимости в «через три дня».
- source_word: σταθὲν τὸ ἀργύριον καὶ τὸ χρυσίον παρεδόθη
  choice: серебро и золото взвесили и передали
  rationale: Пассивная конструкция естественно передана русской неопределённо-личной; «взвесили» не добавляет отсутствующей в греческом идеи отвешивания части.
- source_word: ἐν τῷ οἴκῳ Κυρίου
  choice: в доме Господа
  rationale: Сохранён библейский храмовый оборот «дом Господа», а не заменён пояснительным словом «храм».
- source_word: Μαρμωθὶ Οὐρείᾳ ἱερεῖ
  choice: священнику Мармофию, сыну Урии
  rationale: Греческие формы имён переданы транслитерацией; родственная связь выражена согласно естественному пониманию последовательности имён и параллельной традиции, хотя в самом греческом слов «сыну» нет.
- source_word: μετʼ αὐτοῦ Ἐλεαζὰρ ὁ τοῦ Φεινεές
  choice: Вместе с ним был Елеазар, сын Финееса
  rationale: Конструкция с артиклем и родительным указывает на происхождение; по-русски естественно уточнить его словом «сын».
- source_word: πρὸς ἀριθμὸν καὶ ὁλκὴν πάντα
  choice: Всё сверили по числу и весу
  rationale: Передана административная проверка всего переданного по количеству и весу; глагол «сверили» делает эллиптический греческий оборот понятным по-русски.
- source_word: ἐγράφη πᾶσα ἡ ὁλκὴ αὐτῇ τῇ ὥρᾳ
  choice: весь вес записали в тот же час
  rationale: ἐγράφη означает внесение письменной записи, а αὐτῇ τῇ ὥρᾳ подчёркивает, что это сделали тогда же.
theological_decisions:
- issue: Передача κύριος в храмовой формуле
  choice: Господь
  alternative: Владыка; ГОСПОДЬ
  rationale: «Дом Господа» — устойчивое и нейтральное библейское обозначение святилища; контекст не требует иной передачи.
- issue: Формы личных имён при расхождении греческой и масоретской традиций
  choice: В основном тексте сохранены греческие формы
  alternative: Нормализовать по более привычным формам параллельной масоретской традиции
  rationale: Для 1 Ездры первичным свидетелем здесь служит греческий текст; альтернативные формы вынесены в примечание, чтобы не скрывать текстологическое расхождение.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Синтаксис разделён на два предложения ради ясности длинного перечня и храмовой отчётности; архаизмы и конфессионально окрашенные уточнения не вводятся.
