base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/068.yaml
  text: And as soon as I heard these things[a], I tore my garments and the holy robe, and I pulled out hair from my head and beard[b], and I sat down stunned and deeply grieved.
translation:
  language: ru
  text: И как только я услышал об этом, я разорвал свои одежды и священное одеяние[a], вырвал волосы на голове и в бороде и сел, ошеломлённый[b] и глубоко опечаленный.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священную одежду». Возможно, имеется в виду официальное священническое одеяние, однако греческий текст прямо этого не уточняет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оцепеневший» или «подавленный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα τῷ ἀκοῦσαί με ταῦτα
  choice: как только я услышал об этом
  rationale: Конструкция передаёт непосредственную временную последовательность; современная русская формулировка сохраняет эту безотлагательность.
- source_word: ἔρρηξα τὰ ἱμάτια
  choice: я разорвал свои одежды
  rationale: Глагол описывает разрывание одежд в знак скорби. Притяжательное местоимение подразумевается контекстом и естественно для русского языка.
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: священное одеяние
  rationale: ἱεράν прямо указывает на священный статус одеяния, но само по себе не уточняет, что оно было именно священническим.
- source_word: κατέτειλον τοῦ τριχώματος τῆς κεφαλῆς καὶ τοῦ πώγωνος
  choice: вырвал волосы на голове и в бороде
  rationale: Форма с родительным передаёт удаление некоторого количества волос; «вырвал волосы» естественно и выразительно описывает жест крайней скорби.
- source_word: σύννους
  choice: ошеломлённый
  rationale: В данном контексте слово обозначает тяжёлое душевное и умственное потрясение; примечание сохраняет возможность оттенков оцепенения или подавленности.
- source_word: περίλυπος
  choice: глубоко опечаленный
  rationale: Передаёт усиленное значение глубокой скорби в современном литературном русском языке.
theological_decisions:
- issue: Степень конкретизации τὴν ἱερὰν ἐσθῆτα
  choice: священное одеяние
  alternative: священническое одеяние
  rationale: Греческий текст называет одеяние священным, но не связывает его прямо с конкретной должностью; перевод не вводит более узкого толкования.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием без архаизмов. Порядок действий и нарастающая скорбь исходного греческого текста сохранены.
