  text: 'Из сыновей Ванаи: Уту, сын Истакалку, и с ним семьдесят мужчин.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βαναὶ
  choice: Из сыновей Баная
  rationale: Сохраняется родословная формула греческого текста; имя передано в форме родительного падежа, естественной для русского языка.
- source_word: Οὐτοῦ Ἰστακάλκου
  choice: Уту, сын Истакалку
  rationale: Греческая последовательность собственных имён в данном перечне понимается как имя человека и имя его отца, согласно смысловой структуре стиха и консультационному английскому слою. Имена транслитерированы непосредственно с греческого; несклоняемые формы помогают не искажать их облик.
- source_word: ἄνδρες ἑβδομήκοντα
  choice: семьдесят мужчин
  rationale: ἄνδρες здесь обозначает взрослых мужчин, входящих в названную группу; точное число сохранено.
