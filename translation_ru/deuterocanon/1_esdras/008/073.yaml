base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/073.yaml
  text: From the times of our fathers[b][a], we have been in great sin until this day.
translation:
  language: ru
  text: Со времён наших отцов[a] мы до сего дня пребываем в великом грехе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наших предков». В греческом тексте буквально: «наших отцов».'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение также подразумевает тяжкую виновность, однако по-гречески буквально сказано: «в великом грехе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν χρόνων
  choice: Со времён
  rationale: Предлог ἀπό с родительным падежом указывает на исходную точку во времени, а χρόνοι — на периоды времени; «со времён» естественно передаёт длительность от прошлого до настоящего.
- source_word: τῶν πατέρων ἡμῶν
  choice: наших отцов
  rationale: Сохраняется мужской род греческого πατέρων и традиционная родовая формула; возможное обобщённое значение «предки» вынесено в сноску.
- source_word: ἐσμεν
  choice: пребываем
  rationale: Настоящее время передано настоящим временем; глагол «пребываем» естественно выражает продолжающееся состояние в сочетании с «со времён… до сего дня».
- source_word: ἐν μεγάλῃ ἁμαρτίᾳ
  choice: в великом грехе
  rationale: Передаёт основное религиозно-нравственное значение ἁμαρτία и сохраняет образ состояния «в грехе», не сводя его исключительно к юридической виновности.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: до сего дня
  rationale: Точная и понятная литературная формула, обозначающая продолжение состояния вплоть до настоящего момента.
theological_decisions:
- issue: Гендерно маркированное обозначение предков
  choice: наших отцов
  alternative: наших предков
  rationale: Греческий текст прямо употребляет πατέρων, «отцов»; основной текст сохраняет эту форму, а более широкое идиоматическое значение отмечено в сноске.
- issue: Грех или вина
  choice: в великом грехе
  alternative: под тяжкой виной
  rationale: ἁμαρτία прежде всего означает «грех». Хотя выражение подразумевает виновность, перевод не заменяет нравственно-религиозное понятие более узким юридическим толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Формула «до сего дня» сохраняет достоинство стиля и остаётся понятной; синтаксис перестроен естественно для русского языка без устранения продолжающегося характера состояния.
