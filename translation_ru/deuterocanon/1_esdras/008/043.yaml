  yaml_path: translation/deuterocanon/1_esdras/008/043.yaml
  text: And from the priests and from the Levites I found no one there[a].
translation:
  language: ru
  text: И среди священников и левитов я никого там не нашёл.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленная для этого места еврейская (масоретская) параллель существенно расходится с греческим текстом; поэтому перевод следует основному здесь греческому свидетельству.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: среди священников
  rationale: Русское «среди священников» естественно передаёт поиск внутри указанной группы; буквальное «из священников» здесь звучало бы менее ясно.
- source_word: ἐκ τῶν Λευειτῶν
  choice: и левитов
  rationale: Предлог «среди» распространяется на оба однородных наименования, сохраняя их параллелизм без тяжеловесного повтора.
- source_word: οὐχ εὗρον
  choice: я никого не нашёл
  rationale: Форма глагола — первое лицо единственного числа; «никого» естественно восполняет подразумеваемое лицо как объект поиска.
- source_word: ἐκεῖ
  choice: там
  rationale: Прямой и естественный эквивалент греческого наречия места.
theological_decisions:
- issue: Существенное расхождение греческого текста с предоставленной приблизительной масоретской параллелью
  choice: 'Основным текстом принят греческий: «И среди священников и левитов я никого там не нашёл».'
  alternative: Предоставленный масоретский материал содержит другую запись перечня — о потомках Бигвая — и не позволяет восстановить данную греческую фразу.
  rationale: Для 1 Ездры исходным свидетельством в задании является греческий текст; приблизительная еврейская параллель здесь словесно ему не соответствует, поэтому она не должна подменять основной источник. Расхождение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза звучит просто и достойно. Порядок компонентов слегка приспособлен к русской идиоматике, при этом сохранены первое лицо, обе названные группы и указание места.
