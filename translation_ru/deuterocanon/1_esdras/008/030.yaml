base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/030.yaml
  text: 'Of the sons of Pharez: Zechariah[a], and with him, according to the record[b], one hundred fifty men.'
translation:
  language: ru
  text: Из потомков Фареса — Захария[a], а с ним по записи — сто пятьдесят мужчин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском параллельном тексте — «Парош», а не «Фарес». Основной текст следует греческому свидетельству 1 Ездры.
    reason: alternative_reading
lexical_decisions:
- source_word: Φαρές
  choice: Фарес
  rationale: Основной текст следует греческому свидетельству 1 Ездры и передаёт имя Φαρές принятой русской библейской формой; отличие еврейской параллели отмечено в сноске.
- source_word: Ζαχαρίας
  choice: Захария
  rationale: Традиционная и понятная русская форма греческого имени, согласующаяся с еврейской параллелью.
- source_word: μετʼ αὐτοῦ
  choice: и с ним
  rationale: Естественно передаёт сопровождение и сохраняет греческий союз καί.
- source_word: ἀπὸ γραφῆς
  choice: по записи
  rationale: Сохраняет общий смысл письменной записи или списка, не сужая выражение до одной только родословной; контекст генеалогического учёта пояснён в сноске.
- source_word: ἄνδρες
  choice: мужчин
  rationale: Передаёт явно мужское обозначение в греческом тексте; еврейская параллель также говорит о лицах мужского пола.
- source_word: ἑκατὸν πεντήκοντα
  choice: сто пятьдесят
  rationale: Прямая передача числительного современным русским языком.
