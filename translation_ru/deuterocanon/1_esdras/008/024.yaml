base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/024.yaml
  text: And all who transgress both the law of your God and the king’s law shall be diligently punished[a], whether by death or by punishment[c][b], by a fine of silver or by confiscation.
translation:
  language: ru
  text: И всякий, кто нарушит и закон твоего Бога, и царский закон, будет наказан[a] со всей строгостью — смертью, иным наказанием, денежным штрафом или тюремным заключением[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленная масоретская параллель существенно отличается по содержанию и относится к другому контексту; поэтому перевод здесь следует греческому тексту как основному свидетельству. Греческое наречие может также означать: «тщательно», «неукоснительно».'
    reason: textual_variant_and_lexical_alternative
  - marker: b
    text: 'Или: «изгнанием». Греческое слово буквально связано с отведением или удалением; в данном юридическом перечне оно, вероятнее всего, обозначает заключение под стражу.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραβαίνωσι
  choice: нарушит
  rationale: Глагол обозначает нарушение установленного закона; «нарушит» естественно и точно передаёт юридический смысл.
- source_word: καὶ τὸν νόμον τοῦ θεοῦ σου καὶ τοῦ βασιλικοῦ
  choice: и закон твоего Бога, и царский закон
  rationale: Парная конструкция καὶ … καὶ выражает двойную правовую обязанность. Субстантивированное τοῦ βασιλικοῦ естественно раскрывается как «царский закон».
- source_word: ἐπιμελῶς κολασθήσονται
  choice: будет неукоснительно наказан
  rationale: Наречие указывает на тщательное, обязательное исполнение наказания. «Неукоснительно» передаёт это лучше, чем неестественное по-русски «тщательно наказан».
- source_word: θανάτῳ
  choice: смертью
  rationale: Дательный падеж обозначает вид или средство наказания; краткая форма соответствует юридическому перечню.
- source_word: τιμωρίᾳ
  choice: иной карой
  rationale: τιμωρία имеет широкое значение наказания. Добавление «иной» делает перечень понятным по-русски после «смертью», не уточняя вид кары, которого греческий текст не называет.
- source_word: ἀργυρίῳ ζημίᾳ
  choice: денежным штрафом
  rationale: Сочетание обозначает имущественное взыскание в серебре, то есть денежный штраф; буквальное «штрафом серебром» в современном русском неестественно.
- source_word: ἀπαγωγῇ
  choice: изгнанием
  rationale: ἀπαγωγή означает отведение или удаление человека. В данном перечне санкций «изгнание» лучше сохраняет прямой смысл слова, чем контекстуально возможная «конфискация».
theological_decisions:
- issue: Соотношение Божьего и царского закона
  choice: и закон твоего Бога, и царский закон
  alternative: закон твоего Бога или царский закон
  rationale: Греческое καὶ … καὶ естественно обозначает совокупную ответственность перед обоими законами, а не выбор между ними.
- issue: Расхождение греческого текста с предоставленной масоретской параллелью
  choice: следовать греческому тексту как основному свидетельству
  alternative: согласовать стих с арамейским текстом Ездры 7:25
  rationale: Предоставленная параллель относится к иному содержательному контексту и не соответствует данному стиху; гармонизация заменила бы перевод реконструкцией.
- issue: Значение ἀπαγωγή в перечне наказаний
  choice: изгнание
  alternative: конфискация
  rationale: Само греческое слово прежде всего указывает на отведение или удаление; значение «конфискация» возможно лишь при предположении об удалении имущества и потому вынесено в примечание как альтернатива.
translation_notes:
  register: Современный литературный русский язык с достоинством официально-правового высказывания. Единственное число «всякий … будет» естественно передаёт греческую обобщающую конструкцию πάντες ὅσοι. Перечень слегка сглажен словом «иной», но широкое значение τιμωρία и неоднозначность ἀπαγωγή сохранены; последняя отмечена сноской.
