translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для библейского родового перечня. Имена переданы в привычной русской библейской форме там, где она устоялась; редкие имена транслитерированы с греческого. Подлинное расхождение с еврейской параллелью не сглажено, а отмечено в сноске.
