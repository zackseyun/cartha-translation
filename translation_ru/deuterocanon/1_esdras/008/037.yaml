  yaml_path: translation/deuterocanon/1_esdras/008/037.yaml
  text: 'From the sons of Baer: Zechariah son of Bemaiah[a], and with him twenty-eight men.'
translation:
  language: ru
  text: Из сыновей Баэра — Захария Бемаи[a], а с ним двадцать восемь мужчин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческие имена и число в этом стихе заметно отличаются от приблизительной еврейской параллели в Езд. 8:9: «из сыновей Иоава — Овадия, сын Иехиила, и с ним двести восемнадцать мужчин». Поскольку здесь 1 Ездры переводится по греческому тексту, в основном тексте сохранены греческие имена и число.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν Βαήρ
  choice: из сыновей Баэра
  rationale: В греческом буквально стоит «из [тех, кто] Баэра»; в контексте родового перечня оборот обозначает семейную или родовую принадлежность. Для ясности по-русски добавлено «сыновей».
- source_word: Ζαχαρίαι
  choice: Захария
  rationale: Принята традиционная русская библейская форма имени, соответствующая греческому Ζαχαρίαι.
- source_word: Βημαί
  choice: сын Бемаи
  rationale: Греческий текст содержит второе имя без явного обозначения отношения. В контексте родословного списка оно, вероятнее всего, является отчественным указанием; слово «сын» добавлено для ясности, а имя передано близко к греческой форме.
- source_word: καὶ μετʼ αὐτοῦ
  choice: и с ним
  rationale: Естественная и точная передача оборота сопровождения в перечне возвратившихся.
- source_word: ἄνδρες εἴκοσι ὀκτώ
  choice: двадцать восемь мужчин
  rationale: ἄνδρες здесь обозначает лиц мужского пола, учтённых в составе группы; «мужчин» сохраняет эту конкретность.
