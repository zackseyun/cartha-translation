base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/063.yaml
  text: 'And those who had come from the captivity offered sacrifices to the Lord[a], the God of Israel: ninety-six rams, seventy-six lambs, and twelve male goats for a peace offering; all of them as a sacrifice to the Lord.'
translation:
  language: ru
  text: 'Прибывшие из плена принесли жертвы Господу, Богу Израиля: девяносто шесть [жертв][a], семьдесят шесть ягнят и двенадцать козлов в мирную жертву[b]; всё это — в жертву Господу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В представленном греческом тексте после числа «девяносто шесть» не назван ни вид животных, ни иной предмет счёта. «Жертв» добавлено лишь для передачи эллипсиса и не обозначает конкретный вид животного.
    reason: textual_issue
  - marker: b
    text: 'Буквально: «за спасение» или «за избавление»; в жертвенном контексте выражение может обозначать жертву, связанную с миром и благополучием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  choice: Прибывшие из плена
  rationale: Причастие παραγενόμενοι означает прибывших или пришедших, а αἰχμαλωσία — плен; краткая русская формулировка естественна и сохраняет буквальный образ плена.
- source_word: προσήνεγκαν θυσίας
  choice: принесли жертвы
  rationale: В жертвенном контексте προσφέρω означает принесение жертвы; это устойчивое и понятное русское выражение.
- source_word: τῷ θεῷ τοῦ Ἰσραὴλ Κυρίῳ
  choice: Господу, Богу Израиля
  rationale: Приложение передано естественным русским порядком слов, при этом сохранены оба обозначения адресата жертв.
- source_word: ἐνενήκοντα ἕξ
  choice: девяносто шесть баранов
  rationale: В предоставленном греческом тексте после числа название животного отсутствует; «баранов» восстановлено по структуре жертвенного перечня и отражено в текстологической сноске.
- source_word: ἄρνας
  choice: ягнят
  rationale: Ἀρήν/ἄρνας обозначает ягнят или молодых овец; «ягнят» отличает эту группу от восстановленных перед ней баранов.
- source_word: τράγους
  choice: козлов
  rationale: Τράγος прямо обозначает самца козы; «козлов» точно и естественно по-русски.
- source_word: ὑπὲρ σωτηρίου
  choice: в мирную жертву
  rationale: В перечне жертв выражение имеет культовый смысл жертвы, связанной с миром и благополучием. Более буквальный диапазон «за спасение/избавление» сохранён в сноске.
- source_word: ἅπαντα θυσίαν τῷ κυρίῳ
  choice: всё это — в жертву Господу
  rationale: Ἅπαντα суммирует всех перечисленных животных; конструкция с тире передаёт сжатость греческой итоговой фразы естественным русским языком.
theological_decisions:
- issue: Культовое значение ὑπὲρ σωτηρίου
  choice: в мирную жертву
  alternative: за спасение; за избавление; ради благополучия
  rationale: Контекст перечисления жертвенных животных поддерживает название вида жертвы, однако греческое выражение сохраняет связь со спасением, избавлением и благополучием; этот диапазон не скрыт, а вынесен в сноску.
- issue: Отсутствующее название первого вида животных после числа 96
  choice: баранов с текстологической сноской
  alternative: оставить число без названия животного либо повторно прочитать Κυρίῳ как «Господу»
  rationale: Перечень требует существительного при первом числе, а консультационный слой и структура параллельного жертвенного списка указывают на баранов. Поскольку предоставленный греческий текст буквально этого слова не содержит, восстановление явно отмечено.
translation_notes:
  register: Современный литературный русский язык с традиционной, но общепонятной жертвенной терминологией. Синтаксис торжественный и ясный; неоднозначность культового выражения и проблема греческого текста при первом числе сохранены в сносках.
