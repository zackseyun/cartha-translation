base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/084.yaml
  text: And everything that happens to us comes because of our evil deeds and our great sins[a].
translation:
  language: ru
  text: И всё, что с нами происходит, случается из-за наших злых дел и великих грехов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё, что постигает нас, случается по причине наших злых дел и великих грехов».'
    reason: Лексическая альтернатива для τὰ συμβαίνοντα πάντα ἡμῖν и διὰ, сохраняющая более торжественную формулировку.
lexical_decisions:
- source_word: τὰ συμβαίνοντα πάντα ἡμῖν
  choice: всё, что с нами происходит
  rationale: Передаёт всеохватность πάντα и значение συμβαίνω — «происходить, случаться с кем-либо» — естественным современным русским языком.
- source_word: γίνεται
  choice: бывает
  rationale: Сохраняет отдельный глагол греческого текста и причинную связь, не повторяя непосредственно «происходит».
- source_word: διὰ
  choice: из-за
  rationale: διά с винительным падежом прямо выражает причину; «из-за» ясно и естественно передаёт неблагоприятную причинную обусловленность.
- source_word: τὰ ἔργα ἡμῶν τὰ πονηρά
  choice: наших злых дел
  rationale: «Злые дела» точно сохраняет нравственную оценку πονηρά и конкретный смысл ἔργα.
- source_word: τὰς μεγάλας ἁμαρτίας
  choice: великих грехов
  rationale: «Великих» формально передаёт μεγάλας, сохраняя указание на тяжесть или значительность грехов без замены на «многочисленные».
theological_decisions:
- issue: Причинная связь между бедствиями народа и его грехами
  choice: 'Сохранена прямая причинная формулировка: происходящее бывает «из-за» злых дел и великих грехов.'
  alternative: Ослабить связь формулировкой «в связи с» или оставить причину подразумеваемой.
  rationale: Греческое διά с винительным падежом прямо обозначает причину. Перевод сохраняет исповедание вины, но не выводит из него более широкой доктрины о причинах всякого страдания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка ясна обычному читателю; причинная сила греческого текста сохранена. Местоимение «наших» относится и к делам, и к грехам по естественной русской координации.
