  yaml_path: translation/deuterocanon/1_esdras/008/036.yaml
  text: 'From the sons of Bani: Salimoth son of Josaphias[a], and with him one hundred sixty men;'
translation:
  language: ru
  text: Из сыновей Вании — Салимоф, сын Иосафии[a], и с ним сто шестьдесят мужчин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский параллельный текст в Езд 8:8 здесь существенно отличается: в нём названы другой род, другой предводитель и другое число людей. Поскольку основной источник 1 Ездры — греческий текст, в основном тексте сохранено его чтение: «Вания… Салимоф, сын Иосафии… сто шестьдесят мужчин». Иосафия — мужское имя.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βανίας
  choice: из сыновей Вании
  rationale: Сохраняет родословную формулу греческого текста; «сыновья» в таком перечне может обозначать потомков или род.
- source_word: Σαλειμὼθ
  choice: Салимоф
  rationale: Имя передано по греческой форме основного источника с традиционной русской библейской передачей конечного θ через «ф».
- source_word: Ἰωσαφίου
  choice: сын Иосафии
  rationale: Родительный падеж имени в контексте родословного списка естественно выражает отцовство; слово «сын» добавлено для ясности подразумеваемой связи.
- source_word: καὶ μετʼ αὐτοῦ
  choice: и с ним
  rationale: Краткая и прямая передача эллиптической формулы перечня.
- source_word: ἄνδρες
  choice: мужчин
  rationale: Передаёт мужской пол участников списка, не обобщая их как людей вообще.
- source_word: ἑκατὸν ἑξήκοντα
  choice: сто шестьдесят
  rationale: Точная и естественная передача количественного числительного.
