base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/070.yaml
  text: And rising from the fasting[a], with his garments and the holy robe torn, he bent his knees and stretched out his hands to the Lord, saying[b],
translation:
  language: ru
  text: 'И, встав после поста, с разодранными одеждами и разодранным священным одеянием[a], он преклонил колени, простёр руки к Господу и сказал[b]:'
  philosophy: optimal-equivalence
  footnotes:
