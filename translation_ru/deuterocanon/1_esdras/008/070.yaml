    text: 'Или: «святое одеяние». Греческий текст не называет его прямо священническим облачением.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте стоит форма множественного числа: «они говорили». По контексту она вводит последующую молитву Ездры; русский перевод передаёт её в единственном числе.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐξεγερθεὶς ἐκ τῆς νηστείας
  choice: встав после поста
  rationale: Передаёт переход от состояния или времени поста к молитве; деепричастная конструкция сохраняет последовательность греческих причастий и естественно звучит по-русски.
- source_word: διερρηγμένα ἔχων τὰ ἱμάτια
  choice: с разодранными одеждами
  rationale: Сохраняет результативное состояние одежды и торжественный регистр, не сужая общее значение ἱμάτια.
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: священным одеянием
  rationale: Передаёт сакральный характер одежды, но не добавляет отсутствующего в греческом тексте прямого указания на священническое облачение.
- source_word: κάμψας τὰ γόνατα
  choice: преклонил колени
  rationale: Устойчивое и понятное русское выражение для молитвенного жеста, соответствующее буквальному «согнув колени».
- source_word: ἐκτείνας τὰς χεῖρας
  choice: простёр руки
  rationale: Естественно передаёт жест молитвы и сохраняет достоинство повествовательного стиля.
- source_word: πρὸς τὸν κύριον
  choice: к Господу
  rationale: Кύριος в молитвенном контексте передан традиционным божественным титулом «Господь».
- source_word: ἔλεγον
  choice: сказал
  rationale: В контексте Ездра вводит собственную последующую молитву. Русское «сказал» ясно и естественно оформляет переход к прямой речи; формальная неоднозначность греческой формы отмечена в сноске.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: В данном обращённом к Богу молитвенном контексте «Господь» является точным, общепонятным и нейтральным по конфессиональной окраске титулом.
- issue: Следует ли называть священное одеяние священническим
  choice: священное одеяние
  alternative: священническое облачение
  rationale: Греческий текст прямо говорит о сакральном одеянии, но не употребляет определения «священническое»; перевод не усиливает институциональную конкретность текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской интонацией. «Преклонил колени» и «простёр руки» сохраняют достоинство молитвенной сцены, оставаясь понятными современному читателю. Все сноски поставлены непосредственно при соответствующих выражениях.
