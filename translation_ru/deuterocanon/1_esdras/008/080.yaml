base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/080.yaml
  text: saying that the land into which you are entering to inherit is a land defiled by the defilement of the foreigners of the land[b][a], and they have filled it with their uncleanness.
translation:
  language: ru
  text: 'говоря: «Земля, в которую вы входите, чтобы унаследовать её, — это земля, осквернённая скверной иноплеменников этой земли[a]; они наполнили её своей нечистотой[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно выражению в древнееврейском параллельном тексте: «народов этой земли». В греческом тексте точнее: «иноплеменников этой земли».'
    reason: alternative_reading
  - marker: b
    text: «Нечистота» здесь может иметь как ритуальный, так и нравственный смысл; формулировка не требует выбирать только один из них.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γῆ
  choice: земля
  rationale: В контексте вхождения и наследования речь идёт об определённой территории, а не обо всём мире.
- source_word: εἰς ἣν εἰσέρχεσθε
  choice: в которую вы входите
  rationale: Сохраняет направительное значение εἰς и форму настоящего времени греческого текста.
- source_word: κληρονομῆσαι
  choice: чтобы унаследовать её
  rationale: Глагол передаёт именно язык наследования; местоимение добавлено для естественности русского синтаксиса без изменения смысла.
- source_word: μεμολυσμένη μολυσμῷ
  choice: осквернённая скверной
  rationale: Сохранён выразительный повтор однокоренных слов и одновременно морально-ритуальная окраска греческих терминов.
- source_word: τῶν ἀλλογενῶν τῆς γῆς
  choice: иноплеменников этой земли
  rationale: «Иноплеменники» точно передаёт указание ἀλλογενής на принадлежность к иному народу; «этой» естественно выражает определённость территории.
- source_word: τῆς ἀκαθαρσίας αὐτῶν
  choice: своей нечистотой
  rationale: «Нечистота» допускает как ритуальный, так и нравственный смысл, не сводя выражение лишь к одному из них.
- source_word: ἐνέπλησαν αὐτήν
  choice: они наполнили её
  rationale: Прямо передаёт значение глагола «наполнять» и результат совершённого действия.
theological_decisions:
- issue: Ритуальный или нравственный характер осквернения
  choice: Сохранены широкие слова «скверна» и «нечистота», допускающие обе стороны смысла.
  alternative: Передать исключительно как обрядовую нечистоту либо исключительно как нравственное развращение.
  rationale: Греческие μολυσμός и ἀκαθαρσία могут иметь и культовое, и этическое значение; контекст не требует устранять эту смысловую напряжённость.
- issue: Передача ἀλλογενῶν с учётом древнееврейской параллельной идиомы
  choice: иноплеменников этой земли
  alternative: народов этой земли
  rationale: Основным источником служит греческий текст, где прямо выражена принадлежность к иному народу; вариант, отражающий древнееврейскую идиому, вынесен в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Однокоренной повтор «осквернённая скверной» намеренно сохранён вслед за греческим оригиналом; порядок сносок приведён к последовательному [a], [b].
