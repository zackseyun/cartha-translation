base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/032.yaml
  text: 'From the sons of Zathoes: Eiechonias son of Jethel[a], and with him two hundred men; from the sons of Adin: Obeth son of Jonathan[b], and with him two hundred fifty men.'
translation:
  language: ru
  text: 'Из сыновей Зафоя: Иехония, сын Иефила[a], и с ним двести мужчин; из сыновей Адина: Убен, сын Ионафана[b], и с ним двести пятьдесят мужчин.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Родовое имя «Зафой» передано по основному греческому тексту; приблизительная параллель в масоретском тексте содержит другое имя.
    reason: alternative_reading
  - marker: b
    text: Имя «Убен» передаёт греческое Οὐβὴν; его русская транслитерация не вполне устойчива, возможны также формы «Увен» или «Овен».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: из сыновей
  rationale: Сохраняет повторяющуюся структуру списка и обозначает принадлежность к роду или семейству.
- source_word: Ζαθόης
  choice: Зафоя
  rationale: Имя передано по основному греческому свидетельству; родительный падеж естественно обусловлен оборотом «из сыновей».
- source_word: Εἰεχονίας
  choice: Иехония
  rationale: Транслитерация греческой формы с учетом принятой русской библейской передачи начального Ιε-/Εἰε-.
- source_word: Ἰεθήλου
  choice: сын Иефила
  rationale: Греческий родительный падеж в контексте перечня выражает отчество; слово «сын» добавлено для ясности.
- source_word: μετʼ αὐτοῦ
  choice: и с ним
  rationale: Прямая и естественная передача формулы сопровождения в переписном списке.
- source_word: ἄνδρες
  choice: мужчин
  rationale: Передает именно мужчин, а не людей вообще, что соответствует значению греческого слова в данном перечне.
- source_word: διακόσιοι
  choice: двести
  rationale: Прямая передача числительного.
- source_word: Ἀδείν
  choice: Адина
  rationale: Транслитерация греческого родового имени в форме, требуемой русским синтаксисом.
- source_word: Οὐβὴν
  choice: Увен
  rationale: Осторожная транслитерация неясной греческой формы Οὐβὴν без внесения неподтвержденного конечного согласного.
- source_word: Ἰωνάθου
  choice: сын Ионафана
  rationale: Родительный падеж истолкован как патронимическая связь, параллельно предыдущей паре имен.
- source_word: διακόσιοι πεντήκοντα
  choice: двести пятьдесят
  rationale: Прямая современная русская передача числительного.
