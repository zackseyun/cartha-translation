base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/029.yaml
  text: From the sons of Phoros[a], Tarosotomos; from the sons of Ietamar, Gamelos; from the sons of David[b],
translation:
  language: ru
  text: Из сынов Фороса[a] — Таросотомос; из сынов Иетамара — Гамелос; из сынов Давида[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческие имена здесь заметно отличаются от приблизительного параллельного места масоретского текста в Езд 8:2, где сказано: «из сынов Финееса — Гершом; из сынов Ифамара — Даниил; из сынов Давида — Хаттуш». Поскольку основным источником для 1 Ездры служит греческий текст, в основном тексте сохранены греческие формы, а не чтения еврейской параллели.'
    reason: alternative_reading
  - marker: b
    text: Фраза «из сынов Давида» остаётся незавершённой, потому что перечень продолжается в следующем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: из сынов
  rationale: Естественная для русского языка родословная формула, сохраняющая повтор и значение выбора представителей из соответствующего рода.
- source_word: Φορός
  choice: Форос
  rationale: Имя передано по основному греческому свидетельству, без согласования с отличающимся еврейским параллельным текстом.
- source_word: Ταροσότομος
  choice: Таросотомос
  rationale: Сохранена транслитерация засвидетельствованной греческой формы; отождествление с именем из приблизительной масоретской параллели было бы неоправданной гармонизацией.
- source_word: Ἰεταμάρου
  choice: Иетамар
  rationale: Русская передача греческой формы Ἰεταμάρ с устранением падежного окончания оригинала.
- source_word: Γάμηλος
  choice: Гамелос
  rationale: Сохранена форма греческого источника, хотя в масоретской параллели стоит имя Даниил.
- source_word: τῶν υἱῶν Δαυείδ
  choice: из сынов Давида
  rationale: Предлог «из» восстановлен по синтаксическому параллелизму перечня; незавершённость формулы сохранена, поскольку имя представителя рода следует далее.
