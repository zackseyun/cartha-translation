base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/031.yaml
  text: From the sons of Pahath-moab[a], Eliaonias son of Zareou, and with him two hundred men;
translation:
  language: ru
  text: Из потомков Пахат-Моава[a] — Елиалония, сын Зараия, и с ним двести мужчин;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте далее стоят имена «Елиалония, сын Зараия»; в еврейском параллельном тексте Ездры 8:4 — «Елиегоэнай, сын Зерахии».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν Μααθμωάβ
  choice: Из потомков Пахат-Моава
  rationale: Греческое Μααθμωάβ передаёт название рода, соответствующее «сынам Пахат-Моава» в еврейском параллельном тексте. «Из потомков» естественно выражает принадлежность к роду и не превращает имя в географическое название.
- source_word: Ἐλιαλωνίας
  choice: Елиалония
  rationale: Имя транслитерировано по первичному греческому свидетелю; еврейская форма в параллельном тексте не подменяет греческое чтение.
- source_word: Ζαραιου
  choice: Зараия
  rationale: Передача следует греческой форме родительного падежа Ζαραιου, сохраняя различие с еврейским параллельным именем Зерахия.
- source_word: καὶ μετʼ αὐτοῦ
  choice: и с ним
  rationale: Прямой и естественный перевод, сохраняющий структуру перечня.
- source_word: ἄνδρες διακόσιοι
  choice: двести мужчин
  rationale: Греческое ἄνδρες прямо означает «мужчины»; перевод следует греческому тексту, несмотря на «мужского пола» в еврейском параллельном месте.
