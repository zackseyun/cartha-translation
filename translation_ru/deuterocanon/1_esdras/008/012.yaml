  text: so that they may inspect Judea and Jerusalem[a], according to the law of the Lord that is in your hand[b],
translation:
  language: ru
  text: чтобы они проверили положение дел в Иудее и Иерусалиме[a] в соответствии с Законом Господа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они провели расследование в Иудее и Иерусалиме»; греческий глагол может обозначать официальную проверку, посещение с целью надзора или выяснение обстоятельств.'
    reason: lexical_alternative
  - marker: b
    text: Греческая конструкция после слов «в соответствии с» сжата и синтаксически не вполне ясна; она может подразумевать Закон Господа, которым располагает адресат. В параллельной традиции Ездры 7:14 говорится о Законе Бога, находящемся «в руке» Ездры, то есть вверенном ему или находящемся у него; этих слов в данном греческом тексте нет.
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое значение союза и естественно вводит придаточное цели.
- source_word: ἐπισκέψωνται
  choice: проверили положение дел
  rationale: В контексте царского поручения глагол обозначает официальное обследование или разбирательство, а не обычное посещение. Добавление «положение дел» делает этот смысл естественным по-русски, не уточняя предмет проверки сверх контекста.
- source_word: κατὰ τὴν Ἰουδαίαν καὶ κατὰ Ἰερουσαλήμ
  choice: в Иудее и Иерусалиме
  rationale: Повторённое κατά обозначает область, к которой относится проверка; предложное выражение естественно передаёт это по-русски.
- source_word: ἀκολούθως
  choice: в соответствии с
  rationale: Сохраняет значение согласованности с установленной нормой.
- source_word: ᾧ ἔχει νόμῳ Κυρίου
  choice: тем, что содержится в Законе Господа
  rationale: 'Передаёт сжатую и несколько необычную греческую конструкцию без внесения отсутствующих в данном греческом тексте слов «у тебя в руке». Формулировка близка смыслу: проверка должна соответствовать содержанию Закона.'
- source_word: Κυρίου
  choice: Господа
  rationale: В иудейском библейском контексте Κυρίου относится к Богу Израиля; традиционное русское соответствие — «Господь».
theological_decisions:
- issue: Передача Κυρίου применительно к Богу Израиля
  choice: Господа
  alternative: Владыки
  rationale: «Господь» — естественное и традиционное русское соответствие κύριος в данном контексте, не привносящее конфессионально специфического толкования.
- issue: Отношение греческого чтения к параллели Ездры 7:14
  choice: 'следовать греческому тексту: «тем, что содержится в Законе Господа»'
  alternative: «по Закону твоего Бога, который у тебя в руке»
  rationale: Основным источником является греческий текст 1 Ездры. Выражение «у тебя в руке» известно по иной текстовой традиции параллельного места, но в представленном греческом чтении отсутствует и потому не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Административный характер поручения передан выражением «проверили положение дел». Необычная греческая конструкция передана осмысленно, но её буквальная форма и параллельное чтение отмечены в сноске.
