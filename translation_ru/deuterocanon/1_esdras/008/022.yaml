  verdict: revise
  source_fidelity: 'Греческий текст передан в целом точно: перечислены все категории храмового персонала, сохранены запрет налогов и иных обложений, а также отсутствие у кого-либо права налагать их. Однако μηδεμία φορολογία при глагольном сказуемом в единственном числе естественнее и точнее передать как «никакой налог», а не «никакие налоги». Кроме того, «ни на кого из» несколько ослабляет прямую конструкцию «на всех ... не должен налагаться»; более ясная русская формулировка сохраняет всеохватность без двусмысленности.'
  naturalness: Текст в основном литературен, но сочетание «ни на кого ... не должны налагаться никакие налоги» тяжеловесно из-за двойного отрицательного построения и несогласования числа с ближайшим смысловым центром. Перестройка на «никакой налог или иное обременение не должен налагаться ни на одного...» звучит естественно для официального постановления.
  terminology: «Священники», «левиты», «храмовые певцы», «привратники» и «храмовые служители» удачны. Описательное «те, кто занимается делами этого храма» точно передаёт πραγματικοί и не сужает значение до должностных лиц. «Иное обременение» адекватно сохраняет контекстуальную неопределённость ἐπιβουλή; примечание корректно отмечает и более буквальный неблагоприятный оттенок слова.
