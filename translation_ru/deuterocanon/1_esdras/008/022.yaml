base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/022.yaml
  text: And it is also declared to you that no tax or other burden is to be imposed on any of the priests[a], Levites, temple singers, gatekeepers, temple servants, or workers of this temple[b], and that no one is to have authority to impose it on them.
translation:
  language: ru
  text: 'Также вам объявляется: никакой налог или иное обременение не должен налагаться ни на одного из священников, левитов, храмовых певцов, привратников, храмовых служителей и тех, кто занимается делами этого храма[b]; никто не вправе возлагать это на них.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Греческое слово обозначает тех, кто занят делами или деятельностью этого храма. Возможен также перевод: «храмовые распорядители», но он может неоправданно сузить круг названных лиц до должностных лиц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγεται
  choice: объявляется
  rationale: В контексте официального указа пассивная форма имеет административно-правовой оттенок; «объявляется» передаёт его естественнее, чем нейтральное «говорится».
- source_word: πᾶσι τοῖς ἱερεῦσιν
  choice: ни на кого из священников
  rationale: При отрицательном предписании такая конструкция естественна по-русски и сохраняет всеохватное значение πᾶσι.
- source_word: Λευείταις
  choice: левитов
  rationale: Традиционная и понятная русская передача названия храмовой группы.
- source_word: ἱεροψάλταις
  choice: храмовых певцов
  rationale: Передаёт как служение певцов, так и явно выраженную первым компонентом слова связь с храмом.
- source_word: θυρωροῖς
  choice: привратников
  rationale: Устоявшееся русское обозначение служителей, охраняющих храмовые входы.
- source_word: ἱεροδούλοις
  choice: храмовых служителей
  rationale: Передаёт принадлежность к храмовому служению, не усиливая без необходимости возможный оттенок рабского статуса.
- source_word: πραγματικοῖς τοῦ ἱεροῦ τούτου
  choice: тех, кто ведёт дела этого храма
  rationale: πραγματικοί обозначает людей, занятых делами или хозяйственной деятельностью; описательная передача не сужает смысл до чиновников или наёмных работников.
- source_word: μηδεμία φορολογία
  choice: никакие налоги
  rationale: φορολογία обозначает налоговое или данническое обложение; множественное число естественно выражает общий запрет на налоги.
- source_word: μηδὲ ἄλλη ἐπιβουλή
  choice: или иные обременения
  rationale: После упоминания налогов слово обозначает иное налагаемое бремя; «обременения» сохраняет широкий административно-правовой смысл, не сводя его только к денежному сбору.
- source_word: μηδένα ἔχειν ἐξουσίαν ἐπιβαλεῖν τούτοις
  choice: никто не вправе возлагать их на этих людей
  rationale: Передаёт юридическое значение ἐξουσία и действие ἐπιβάλλω, при этом местоимение отсылает и к налогам, и к обременениям.
