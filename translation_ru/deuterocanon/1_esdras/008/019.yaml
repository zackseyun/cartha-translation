base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/019.yaml
  text: And I[a], King Artaxerxes, have given orders to the treasurers of Syria and Phoenicia, that whatever Ezra the priest and reader of the law of God Most High may send for, they are to give him carefully, up to one hundred talents of silver[b],
translation:
  language: ru
  text: И вот, я, царь Артаксеркс, распорядился, чтобы хранители казны Сирии и Финикии добросовестно выдавали священнику Ездре, чтецу[b] закона Бога Всевышнего, всё, за чем он пошлёт[a], — вплоть до ста талантов серебра[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё, что он пошлёт». В данном контексте, вероятно, имеется в виду то, за чем Ездра пошлёт кого-либо или о чём направит требование.'
    reason: lexical_alternative
  - marker: b
    text: Греческий текст называет Ездру «чтецом закона»; в параллельной традиции он назван книжником.
    reason: alternative_reading
  - marker: c
    text: Талант — крупная древняя мера веса; точная величина различалась в зависимости от времени и места.
    reason: historical_measure
lexical_decisions:
- source_word: προσέταξα
  choice: распорядился
  rationale: Передаёт властное царское распоряжение и естественно звучит в современном русском официально-повествовательном контексте.
- source_word: γαζοφύλαξι
  choice: хранители казны
  rationale: Точно обозначает должностных лиц, ведавших казёнными средствами, и не сужает их функцию до современного значения слова «казначей».
- source_word: ἐπιμελῶς
  choice: исправно
  rationale: Передаёт требование старательного, добросовестного исполнения распоряжения, не добавляя отсутствующей в греческом идеи срочности.
- source_word: ἀποστείλῃ
  choice: за чем он пошлёт
  rationale: Сохраняет буквальный образ «послать», но по-русски естественно выражает подразумеваемую отправку требования или запроса на выдачу.
- source_word: ἀναγνώστης
  choice: чтец
  rationale: Греческий текст прямо называет Ездру «чтецом», а не «книжником»; перевод сохраняет особенность данного свидетеля.
- source_word: τοῦ νόμου τοῦ θεοῦ τοῦ ὑψίστου
  choice: закона Бога Всевышнего
  rationale: Сохраняет последовательность греческой конструкции и традиционное, понятное русское именование Бога.
- source_word: ἕως ἀργυρίου τάλαντων ἑκατόν
  choice: вплоть до ста талантов серебра
  rationale: Ясно передаёт установленный верхний предел выдачи.
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет эмфатическую вводную частицу греческого текста без чрезмерной архаизации.
theological_decisions:
- issue: Божественный титул τοῦ θεοῦ τοῦ ὑψίστου
  choice: Бога Всевышнего
  alternative: Всевышнего Бога
  rationale: Оба варианта допустимы; выбранный ближе следует греческому порядку определяемого слова и титула и сохраняет богословский вес именования.
- issue: Обозначение роли Ездры словом ἀναγνώστης
  choice: чтец закона
  alternative: книжник закона
  rationale: Хотя в параллельной традиции Ездра назван книжником, первичный греческий свидетель здесь имеет значение «чтец»; замена могла бы устранить реальное текстовое различие.
translation_notes:
  register: Современный литературный русский язык с достоинством царского указа. Формулировка остаётся понятной широкому читателю, избегает конфессиональной терминологии и сохраняет особенности греческого текста, включая «чтеца» и неоднозначное «пошлёт».
