lexical_decisions:
- source_word: ἐντειλάμενος
  choice: поручив
  rationale: Деепричастие сохраняет зависимую причастную форму греческого текста и её связь с предшествующим повествованием; глагол передаёт распорядительный смысл без ненужной резкости.
- source_word: διαλεχθῆναι
  choice: поговорить с
  rationale: Естественно передаёт значение беседы или обращения к названным лицам.
- source_word: Λοδαίῳ
  choice: Лодаием
  rationale: Имя транслитерировано по первичному греческому свидетельству, без согласования с параллельным еврейским текстом.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ
  choice: его братьями
  rationale: Сохранено прямое и обычное значение ἀδελφοί; контекст не требует расширительного перевода «родственники».
- source_word: γαζοφύλαξιν
  choice: хранителями сокровищницы
  rationale: Передаёт функцию лиц, ведавших сокровищницей, и яснее современному читателю, чем менее определённое «казначеями».
- source_word: ἀποστεῖλαι ἡμῖν
  choice: чтобы они прислали нам
  rationale: Сохраняет значение греческого ἀποστέλλω — «посылать»; явное подлежащее делает длинную русскую конструкцию понятнее.
- source_word: τοὺς ἱερατεύσαντας
  choice: тех, кто будет служить священниками
  rationale: Передаёт именно священническое служение, выраженное глаголом ἱερατεύω, не сводя его к общему «служители».
- source_word: ἐν τῷ οἴκῳ τοῦ κυρίου ἡμῶν
  choice: в доме нашего Господа
  rationale: Следует греческому κυρίου ἡμῶν; «дом» сохраняет традиционный библейский образ храма.
theological_decisions:
- issue: κύριος в греческом тексте и אֱלֹהֵינוּ в еврейской параллели
  choice: нашего Господа
  alternative: нашего Бога
  rationale: Основным свидетельством здесь служит греческий текст 1 Ездры. Отличие еврейской параллели сохранено в примечании, а не устранено согласованием.
- issue: Конкретность священнического служения
  choice: тех, кто будет служить священниками
  alternative: служителей
  rationale: Греческое ἱερατεύω прямо обозначает священническое служение, тогда как еврейская параллель использует более широкое слово; различие следует сохранить.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальная зависимая конструкция «поручив» намеренно сохраняет синтаксическую незавершённость данного фрагмента и его связь с предыдущим контекстом. Порядок маркеров в основном тексте приведён к последовательному [a]–[d].
