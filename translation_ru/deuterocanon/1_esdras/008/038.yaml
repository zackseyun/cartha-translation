base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/038.yaml
  text: 'the sons of Astad: Joanes son of Akatan[a], and with him one hundred ten men[b];'
translation:
  language: ru
  text: 'сыновья Астада: Иоанес, сын Акатана[a], и с ним сто десять мужчин[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Иоанес Акатан». В греческом тексте два имени стоят рядом без слова «сын», хотя контекст родословного перечня позволяет понимать второе имя как имя отца.'
    reason: alternative_reading
  - marker: b
    text: 'Еврейская параллель в Ездры 8:10 здесь заметно отличается: в ней приведена иная последовательность родовых и личных имён и указано сто шестьдесят мужчин. Поскольку 1 Ездры переводится по греческому тексту, в основном тексте сохранены греческие имена и число.'
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ Ἀστάδ
  choice: сыновья Астада
  rationale: Греческое выражение обозначает родовую группу; буквальное «сыновья Астада» естественно для формы родословного списка и сохраняет формулировку основного греческого свидетеля.
- source_word: Ἰωάνης
  choice: Иоанес
  rationale: Имя передано транслитерацией греческой формы, поскольку именно греческий текст является основой перевода 1 Ездры.
- source_word: Ἀκατάν
  choice: Акатана
  rationale: Форма понята как имя отца и поставлена в родительном падеже после добавленного по контексту слова «сын»; возможность прочесть её как второе имя отмечена в сноске.
- source_word: μετʼ αὐτοῦ
  choice: и с ним
  rationale: Единственное число местоимения относится к только что названному предводителю; союз сохраняет строение перечня.
- source_word: ἄνδρες
  choice: мужчин
  rationale: Обычное значение греческого ἄνδρες — взрослые мужчины; более биологическое «лиц мужского пола» здесь излишне и опиралось бы скорее на еврейскую параллель.
- source_word: ἑκατὸν δέκα
  choice: сто десять
  rationale: Прямая передача числа греческого текста; расхождение с еврейской параллелью отмечено в сноске.
