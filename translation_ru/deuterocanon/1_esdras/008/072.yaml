base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/072.yaml
  text: For our sins have multiplied beyond our heads[a], and our offenses have risen up to heaven.
translation:
  language: ru
  text: Ибо грехи наши умножились выше наших голов, а проступки по неведению[a] поднялись до неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ошибки», «невольные грехи» либо «дела, совершённые по неведению». В греческом здесь стоит иное слово, чем «грехи» в первой части стиха.'
    reason: Слово ἄγνοιαι допускает оттенки незнания, заблуждения и проступка по неведению; примечание сохраняет эту неоднозначность и отмечает лексическое различие.
lexical_decisions:
- source_word: ἁμαρτίαι
  choice: грехи
  rationale: Прямой и естественный эквивалент греческого слова, обозначающего нравственные проступки и грехи.
- source_word: ἐπλεόνασαν
  choice: умножились
  rationale: Передаёт увеличение количества и сохраняет яркий образ грехов, поднявшихся выше головы.
- source_word: ὑπὲρ τὰς κεφαλὰς ἡμῶν
  choice: выше наших голов
  rationale: Близко передаёт пространственный образ греческого текста и выражает подавляющую меру вины, не заменяя метафору толкованием.
- source_word: ἄγνοιαι
  choice: проступки по неведению
  rationale: Сохраняет отличие от ἁμαρτίαι и передаёт возможный смысл деяний, совершённых из-за незнания или неведения, избегая неестественного русского множественного «неведения».
- source_word: ὑπερήνεγκαν
  choice: поднялись
  rationale: Естественно передаёт направленное вверх движение и сохраняет вертикальный образ, завершающийся словами «до неба».
- source_word: ἕως τοῦ οὐρανοῦ
  choice: до неба
  rationale: Точно и естественно передаёт предел движения в высоком библейском регистре.
theological_decisions:
- issue: Следует ли свести ἁμαρτίαι и ἄγνοιαι к одной категории греха
  choice: 'Сохранить различие: «грехи» и «проступки по неведению».'
  alternative: Передать оба слова как «грехи», «беззакония» или обобщённую «вину».
  rationale: Греческий текст намеренно употребляет два разных существительных. Выбранный перевод сохраняет возможность различия между грехами вообще и проступками, связанными с неведением, не утверждая жёстко, что все вторые были непреднамеренными.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «грехи наши» поддерживает достоинство и ритм фразы, не делая её архаичной; параллельные образы высоты сохранены.
