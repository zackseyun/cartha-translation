base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/064.yaml
  text: And they delivered the king’s decrees to the royal stewards and to the governors of Syria and Phoenicia[a], and they honored the nation and the sanctuary of the Lord.
translation:
  language: ru
  text: И они передали повеления царя царским управляющим и правителям Сирии и Финикии и почтили[a] народ и святилище Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прославили». Греческий глагол допускает более буквальный перевод «прославили», но здесь, вероятно, означает оказание почёта или особого уважения.'
    reason: Лексическая альтернатива для ἐδόξασαν сохраняет возможный более буквальный смысл греческого глагола.
lexical_decisions:
- source_word: ἀπέδωκαν
  choice: передали
  rationale: В административном контексте глагол означает передачу официальных распоряжений властям; «передали» естественно и не уточняет без основания, были ли документы вручены лично.
- source_word: τὰ προστάγματα τοῦ βασιλέως
  choice: повеления царя
  rationale: πρόσταγμα обозначает властное официальное распоряжение. «Повеления» сохраняет силу царской власти, не навязывая более узкий юридический жанр указа.
- source_word: τοῖς βασιλικοῖς οἰκονόμοις
  choice: царским управляющим
  rationale: οἰκονόμος — управляющий или распорядитель; в царской административной среде «царские управляющие» передаёт должностной смысл, не сужая его до казначеев.
- source_word: τοῖς ἐπάρχοις
  choice: правителям
  rationale: ἐπάρχος обозначает областного начальника или правителя. «Правители» понятно современному читателю и не привязывает должность к более поздней системе титулов.
- source_word: ἐδόξασαν
  choice: оказали почёт
  rationale: При неодушевлённом священном объекте и народе глагол может означать публичное возвеличивание, почитание или оказание почестей. Выражение «оказали почёт» естественно в данном административном контексте; более буквальный вариант сохранён в сноске.
- source_word: τὸ ἔθνος
  choice: народу
  rationale: Здесь ἔθνος означает иудейский народ как общность. Русское «народу» естественнее, чем «нации», и не ослабляет коллективного значения.
- source_word: τὸ ἱερὸν
  choice: святилищу
  rationale: ἱερόν может обозначать священное место или храмовый комплекс. «Святилище» сохраняет сакральный оттенок, не сводя значение только к зданию.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Основной источник — греческий текст с κύριος; поэтому употреблено традиционное русское «Господь» без типографического обозначения явного еврейского тетраграмматона.
theological_decisions:
- issue: Передача κύριος в греческой второканонической книге
  choice: Господа
  alternative: ГОСПОДА
  rationale: Поскольку первичным свидетельством служит греческое κύριος, перевод «Господа» сохраняет форму источника и не утверждает, что в данном месте прямо засвидетельствован еврейский тетраграмматон.
- issue: Значение ἐδόξασαν при объектах «народ» и «святилище»
  choice: оказали почёт народу и святилищу
  alternative: прославили народ и святилище
  rationale: Выбранный вариант не вносит оттенок богопоклонения и подходит к публичному признанию или благоприятному отношению властей, тогда как буквальная возможность «прославили» отмечена в сноске.
- issue: Неявная смена деятеля перед ἐδόξασαν
  choice: а те оказали почёт
  alternative: и они оказали почёт
  rationale: В контексте естественным деятелем второй части выступают получившие царские повеления чиновники. Русское «те» ясно отражает эту связь, хотя греческое подлежащее выражено лишь формой глагола и формально допускает отнесение к прежним действующим лицам.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Административные термины переданы понятно и без анахронично узких титулов. Конструкция «а те» делает естественной предполагаемую смену деятеля, оставаясь близкой к контексту.
