base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/033.yaml
  text: 'From the sons of Lam: Esias son of Gotholias[a], and with him seventy men.'
translation:
  language: ru
  text: 'Из сыновей Лама: Есия, сын Гофолии[a], и с ним семьдесят мужчин.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Приблизительный параллельный текст в Езд. 8:3 по масоретской традиции отличается именами и числом: «из сыновей Шехании, сын Яхазиила… триста мужчин». Поскольку здесь 1 Ездры переводится по греческому тексту, в основном тексте сохранены греческие имена и число семьдесят.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Из сыновей
  rationale: Формула вводит родовую группу в перечне; русский вариант естественно передаёт исходную конструкцию.
- source_word: Λάμ
  choice: Лама
  rationale: Имя транслитерировано с греческого и поставлено в родительный падеж; оно не согласуется искусственно с отличающимся масоретским параллельным текстом.
- source_word: Ἐσίας
  choice: Есия
  rationale: Имя передано по греческой форме в традиционно звучащей русской библейской транслитерации.
- source_word: Γοθολίου
  choice: сын Гофолии
  rationale: Родительный падеж личного имени в генеалогическом перечне понят как указание на отца; слово «сын» добавлено для ясности подразумеваемой связи.
- source_word: καὶ μετʼ αὐτοῦ
  choice: и с ним
  rationale: Прямо и естественно передаёт сопровождение в контексте списка.
- source_word: ἄνδρες ἑβδομήκοντα
  choice: семьдесят мужчин
  rationale: ἄνδρες здесь обозначает именно мужчин; перевод сохраняет это значение и число греческого текста.
