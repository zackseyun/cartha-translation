base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/034.yaml
  text: 'From the sons of Sophotius: Zaraias son of Michael[a], and with him seventy men.'
translation:
  language: ru
  text: Из сыновей Софотия — Зараия, сын Михаила[a], и с ним семьдесят мужчин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческие имена и число здесь отличаются от приблизительной еврейской параллели в Ездре 8:6, где сказано: «из сыновей Адина — Евед, сын Ионафана, и с ним пятьдесят мужчин». Поскольку 1 Ездры переводится по греческому тексту, в основном тексте сохранены греческие имена и число.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Из сыновей
  rationale: Предлог ἐκ с родительным падежом указывает на представителя, выбранного из данной родовой группы; формула естественна для перечня.
- source_word: Σοφοτίου
  choice: Софотия
  rationale: Имя передано непосредственно по греческой форме, без согласования с приблизительной еврейской параллелью.
- source_word: Ζαραίας
  choice: Зараия
  rationale: Транслитерация греческого личного имени с формой, естественной для русской библейской ономастики.
- source_word: Μειχαήλου
  choice: сын Михаила
  rationale: Родительный падеж в генеалогическом перечне естественно выражает отчество; слово «сын» добавлено для ясности подразумеваемой связи.
- source_word: μετʼ αὐτοῦ
  choice: и с ним
  rationale: Точно и естественно передаёт сопровождение названного предводителя перечисленными людьми.
- source_word: ἄνδρες
  choice: мужчин
  rationale: Передаёт значение взрослых лиц мужского пола в контексте подсчёта вернувшихся.
- source_word: ἑβδομήκοντα
  choice: семьдесят
  rationale: Прямое соответствие греческому количественному числительному.
