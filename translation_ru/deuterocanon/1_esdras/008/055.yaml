base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/055.yaml
  text: And I set apart twelve men from the leaders of the priests[a], and Eserebias and Asoamias[c][b],
translation:
  language: ru
  text: И я отделил из числа глав священников двенадцать человек, а также Есеревию[a] и Асоамию[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Есеревия, вероятно, соответствует еврейскому имени Шеревия в параллельном тексте.
    reason: alternative_reading
  - marker: b
    text: Асоамия, вероятно, соответствует еврейскому имени Хашавия в параллельном тексте.
    reason: alternative_reading
  - marker: c
    text: Греческий текст здесь короче параллельного текста в Езд. 8:24, где после Шеревии и Хашавии упомянуты ещё десять их братьев.
    reason: cross_reference
lexical_decisions:
- source_word: ἐχώρισα
  choice: отделил
  rationale: Передаёт основное значение «отделить, выделить из группы» и сохраняет формальную окраску назначения, не уточняя сверх греческого текста.
- source_word: φυλάρχων τῶν ἱερέων
  choice: из числа глав священников
  rationale: φυλάρχων обозначает глав или предводителей рода/группы; в сочетании с родительным τῶν ἱερέων речь идёт о руководителях из среды священников. Формулировка естественна по-русски и не навязывает более узкой социальной структуры.
- source_word: ἄνδρας δέκα δύο
  choice: двенадцать человек
  rationale: В данном контексте русское «человек» естественно обозначает мужчин-представителей; число и референт переданы прямо.
- source_word: Ἐσερεβίαν
  choice: Есеревию
  rationale: Имя транслитерировано по первичному греческому свидетелю; вероятное соответствие еврейской форме отмечено в сноске.
- source_word: Ἀσοαμίαν
  choice: Асоамию
  rationale: Имя транслитерировано по греческому тексту; вероятное соответствие еврейской форме отмечено в сноске.
- source_word: καὶ … καὶ
  choice: а также … и
  rationale: Передаёт присоединение двух названных лиц после двенадцати человек, не устраняя возможную неясность относительно их соотношения с этой группой.
theological_decisions:
- issue: Соотношение двенадцати человек с Есеревией и Асоамией
  choice: Сохранить их грамматическое присоединение словами «а также»
  alternative: Понять Есеревию и Асоамию как входящих в число двенадцати
  rationale: Греческая последовательность называет двенадцать человек, затем присоединяет два имени союзом καί; текст не выражает однозначно, входят ли они в число двенадцати, поэтому перевод не должен молча разрешать эту неясность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся близким к греческому, но формулировка «из числа глав священников» устраняет неестественную русскую конструкцию. Имена переданы по греческой форме, поскольку греческий текст является первичным источником для 1 Ездры.
