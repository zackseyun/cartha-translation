base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/027.yaml
  text: And I took courage according to the help of the Lord my God[a], and I gathered from Israel men to go up with me.
translation:
  language: ru
  text: И я обрёл мужество благодаря поддержке Господа, Бога моего,[a] и собрал из среды Израиля мужчин, чтобы они отправились со мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном еврейском тексте Ездры 7:28 употреблено слово, означающее «главы» или «предводители», а не «мужчины». Здесь 1 Ездры следует греческому чтению.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθαρσὴς ἐγενόμην
  choice: я обрёл мужество
  rationale: Оборот означает, что говорящий ободрился и стал увереннее. «Обрёл мужество» естественно звучит по-русски и передаёт оттенок внутреннего укрепления; параллельное еврейское הִתְחַזַּקְתִּי подтверждает смысл силы и смелости.
- source_word: κατὰ τὴν ἀντίλημψιν
  choice: благодаря поддержке
  rationale: ἀντίλημψις обозначает помощь или поддержку. В данном контексте κατὰ естественно передаёт основание обретённого мужества; русское «благодаря» яснее буквального «согласно поддержке», не меняя причинно-опорного смысла выражения.
- source_word: Κυρίου θεοῦ μου
  choice: Господа, Бога моего
  rationale: Перевод следует греческому Κυρίου и сохраняет торжественный, но понятный современный библейский строй речи.
- source_word: συνήγαγον
  choice: собрал
  rationale: Прямой и естественный перевод аориста со значением собирания людей вместе.
- source_word: ἐκ τοῦ Ἰσραὴλ
  choice: из Израиля
  rationale: Кратко передаёт принадлежность мужчин к народу Израиля; значение «из среды Израиля» ясно из контекста.
- source_word: ἄνδρας
  choice: мужчин
  rationale: Греческий текст прямо называет взрослых мужчин. Это чтение сохранено вопреки параллельному еврейскому тексту, где стоят «главы» или «предводители».
- source_word: ὥστε συναναβῆναί μοι
  choice: чтобы они пошли со мной
  rationale: Конструкция передаёт цель собирания. Глагол содержит образ восхождения, обычно связанный с путешествием в Иерусалим; по-русски «пошли» здесь звучит естественно, тогда как пространственный оттенок несущественен для понимания цели.
theological_decisions:
- issue: Расхождение между греческим текстом и параллельным масоретским текстом в обозначении собранных людей
  choice: мужчин
  alternative: глав / предводителей
  rationale: Основным источником для 1 Ездры служит греческий текст, читающий ἄνδρας — «мужчин». В еврейской параллели Ездры 7:28 стоит רָאשִׁים — «главы, предводители». Основной текст следует греческому свидетельству, а значимое разночтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «Господа, Бога моего» сохраняет достоинство стиля, оставаясь понятной. Формулировка не привносит конфессиональных толкований и отмечает различие греческого и еврейского свидетельств.
