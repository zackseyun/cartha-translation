base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/053.yaml
  text: For we had told the king that the strength of our Lord would be with those who seek him for every restoration[a][b].
translation:
  language: ru
  text: Ведь мы сказали царю, что сила нашего Господа будет с теми, кто ищет Его, во всяком восстановлении[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для всякого восстановления». Греческое выражение необычно; его также понимают шире: «для успеха» или «для благополучного исхода».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский параллельный текст здесь значительно отличается: в нём говорится о посте и обращении к Богу, а не повторяются слова, сказанные царю. Перевод следует основному для 1 Ездры греческому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: εἴπαμεν
  choice: мы сказали
  rationale: 'Греческий аорист естественно передаётся русским прошедшим временем; адресат выражен дательным падежом: «сказали царю».'
- source_word: Ἰσχὺς
  choice: сила
  rationale: ἰσχύς обозначает силу или могущество; «сила» ясно и непосредственно передаёт смысл.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: В данном иудейско-греческом контексте κύριος благоговейно относится к Богу; «Господь» сохраняет этот смысл и традиционную библейскую связь.
- source_word: μετὰ τῶν ἐπιζητούντων αὐτόν
  choice: с теми, кто ищет Его
  rationale: ἐπιζητέω может подразумевать усердное искание, однако нейтральное «искать» естественно по-русски и не усиливает текст без необходимости.
- source_word: εἰς πᾶσαν ἐπανόρθωσιν
  choice: для всякого восстановления
  rationale: ἐπανόρθωσις означает восстановление, исправление или приведение в надлежащее состояние. Буквальная формулировка сохраняет необычность и неоднозначность греческого выражения, не подменяя его толкованием вроде «успеха».
theological_decisions:
- issue: Передача κύριος применительно к Богу
  choice: Господь
  alternative: Владыка
  rationale: «Господь» естественно передаёт почтительное божественное именование в контексте Септуагинты, не вводя конфессионально специфического толкования.
- issue: Степень конкретности при передаче ἐπανόρθωσις
  choice: восстановление
  alternative: успех; благополучный исход; исправление
  rationale: Основной греческий свидетель прямо содержит ἐπανόρθωσις. Поэтому перевод сохраняет конкретное значение «восстановление», а более широкие возможные понимания вынесены в примечание; расхождение с еврейской параллелью не устраняется гармонизацией.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Необычная конструкция «для всякого восстановления» намеренно сохранена из-за неоднозначности греческого текста; пояснение дано в сноске.
