base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/079.yaml
  text: And now what shall we say[a], Lord, having these things? They have transgressed your commandments[b], which you gave by the hand of your servants the prophets.
translation:
  language: ru
  text: И что нам теперь сказать, Господи, имея всё это?[a] Они преступили Твои повеления, которые Ты дал через Твоих слуг — пророков.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение «имея всё это» сжато; вероятно, оно отсылает к дарам или обстоятельствам, упомянутым ранее в молитве.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукою Твоих слуг — пророков»; это библейское выражение означает передачу через посредников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: И теперь
  rationale: Сохраняет соединительную силу καί и естественно вводит следующий поворот молитвы.
- source_word: τί ἐροῦμεν
  choice: что скажем
  rationale: Будущее время передано как торжественный риторический вопрос без добавления модального оттенка.
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская форма звательного обращения к Господу.
- source_word: ἔχοντες αὐτά
  choice: имея всё это
  rationale: Сохраняет сжатость и неопределённость греческого выражения; «это» отсылает к ранее названным обстоятельствам или дарам, не уточняя их сверх текста.
- source_word: παρέβησαν
  choice: Они преступили
  rationale: Третье лицо множественного числа передано явно; «преступили» сохраняет нравственно-правовой смысл нарушения Божьих предписаний.
- source_word: τὰ προστάγματά σου
  choice: Твои повеления
  rationale: «Повеления» точно передаёт предписывающий характер προστάγματα и звучит естественно в современном литературном русском.
- source_word: ἃ ἔδωκας
  choice: которые Ты дал
  rationale: Прямо передаёт относительное предложение и обычное значение δίδωμι.
- source_word: ἐν χειρὶ
  choice: через
  rationale: Передаёт значение посредничества, заключённое в библейской идиоме «рукою», не создавая в основном тексте неестественной для современного русского конструкции.
- source_word: τῶν παίδων σου τῶν προφητῶν
  choice: Твоих слуг — пророков
  rationale: В контексте пророческого служения παῖς означает «слуга»; тире ясно показывает, что пророки и есть названные слуги.
theological_decisions:
- issue: Неявно названный субъект παρέβησαν
  choice: Они преступили
  alternative: Мы преступили
  rationale: Греческий глагол стоит в третьем лице множественного числа. Хотя молящийся отождествляет себя с народом, перевод не заменяет грамматическое «они» исповедальным «мы».
- issue: Формула посредничества ἐν χειρὶ
  choice: через Твоих слуг — пророков
  alternative: рукою Твоих слуг-пророков
  rationale: Основной перевод передаёт посредничество естественным современным языком, а буквальный библейский образ сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с торжественным молитвенным звучанием. Синтаксис остаётся ясным для обычного читателя; сжатость и смена подразумеваемого «мы» на выраженное глаголом «они» сохранены. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с традиционным русским библейским регистром.
