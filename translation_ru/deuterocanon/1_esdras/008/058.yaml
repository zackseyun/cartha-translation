base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/058.yaml
  text: And I said to them[a], “You also are holy to the Lord, and the vessels are holy, and the silver and the gold are a vow offering to the Lord[b], the Lord of our fathers.”
translation:
  language: ru
  text: 'И я сказал им: «И вы святы для Господа, и сосуды святы, а серебро и золото — обетный дар[a] Господу, Господу наших отцов[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. εὐχή может означать «обет» или «обетный дар»; в еврейской параллели — «добровольное приношение».
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте: «Господу наших отцов»; в еврейской параллели: «Господу, Богу ваших отцов».'
    reason: textual_variant
lexical_decisions:
- source_word: ἅγιοί / ἅγια
  choice: святы
  rationale: Сохраняет повтор одного и того же греческого корня и его прямой сакральный смысл; формулировка «для Господа» передаёт посвящённость, выраженную дательным падежом.
- source_word: σκεύη
  choice: сосуды
  rationale: В храмовом контексте слово обозначает священные сосуды и принадлежности; «сосуды» — точный и традиционно понятный русский эквивалент.
- source_word: ἀργύριον καὶ τὸ χρυσίον
  choice: серебро и золото
  rationale: Сочетание обозначает драгоценные материалы, а не деньги вообще.
- source_word: εὐχή
  choice: обетный дар
  rationale: Греческое слово прежде всего связано с обетом; «обетный дар» естественно передаёт здесь предмет, посвящённый во исполнение обета. Отличающееся чтение еврейской параллели сохранено в сноске.
- source_word: κυρίῳ τῶν πατέρων ἡμῶν
  choice: Господу наших отцов
  rationale: Перевод следует данному греческому тексту, не добавляя отсутствующего в нём слова «Бог» и сохраняя местоимение первого лица множественного числа.
theological_decisions:
- issue: Значение εὐχή при расхождении с еврейской параллелью נְדָבָה
  choice: обетный дар
  alternative: добровольное приношение
  rationale: Поскольку основным источником является греческий текст, в основном тексте сохранена связь εὐχή с обетом. Еврейская параллель указывает на добровольное приношение, поэтому этот смысл отмечен, но не подменяет греческое чтение.
- issue: Заключительный титул Господа различается в греческом и еврейском свидетельствах
  choice: Господу наших отцов
  alternative: Господу, Богу ваших отцов
  rationale: Основной текст точно отражает греческое κυρίῳ τῶν πατέρων ἡμῶν. Еврейская параллель содержит слово «Бог» и местоимение «ваших»; расхождение открыто обозначено в сноске без искусственного смешения двух форм.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Повтор «святы» и необычная формула «Господу наших отцов» сохранены ради близости к греческому источнику; тире делает именную конструкцию с «обетным даром» ясной.
