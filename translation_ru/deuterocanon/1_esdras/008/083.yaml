lexical_decisions:
- source_word: τοῖς υἱοῖς ὑμῶν
  choice: вашим сыновьям
  rationale: Дательный падеж естественно передан русским дательным. «Сыновьям» сохраняет конкретное значение мужского множественного числа υἱοῖς; оснований расширять его до «детям» в данном фрагменте нет.
- source_word: ἕως αἰῶνος
  choice: навеки
  rationale: Устойчивое греческое выражение обозначает неограниченную, непреходящую длительность. «Навеки» звучит естественно и достойно в современном русском языке.
theological_decisions:
- issue: Фрагментарность текста и существенное расхождение источников
  choice: 'Перевести сохранившийся греческий фрагмент непосредственно: «вашим сыновьям навеки»'
  alternative: Восстановить более полное предложение по приведённой параллели масоретского текста
  rationale: Основным источником является греческий текст, который здесь содержит лишь краткий фрагмент. Приведённая еврейская параллель относится к иному, более пространному контексту, поэтому дополнять по ней греческий текст было бы необоснованно. Фрагментарность подлинника сохранена и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, естественной формулировкой. Начальная строчная буква сохраняет вид фрагмента, продолжающего утраченное или отсутствующее предложение; сноска делает текстологическую ситуацию прозрачной.
