base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/044.yaml
  text: I sent for Eleazar[a], Iduel, Maasman, Enaathan, Shemaiah, Jorib, Nathan, Ennathan, Zechariah, and Mesholabon, the leaders and men of understanding,
translation:
  language: ru
  text: Я послал за Елеазаром[a], Идуилом, Маасманом, Енаатаном, Самаией, Иоривом, Нафаном, Еннатаном, Захарией и Месолавоном — руководителями и сведущими людьми,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые имена в этом стихе сохранились в греческих формах, которые трудно точно соотнести с еврейской параллелью в книге Ездры; поэтому здесь они переданы преимущественно по греческому тексту без полной гармонизации.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλα πρὸς
  choice: Я послал за
  rationale: Сочетание глагола «послал» с πρός и именами лиц в данном контексте естественно передаётся по-русски как отправка за ними, то есть их вызов, без излишнего уточнения способа.
- source_word: Ἐλεάζαρον καὶ Ἰδούηλον καὶ Μαασμὰν καὶ Ἐναατὰν καὶ Σαμαίαν καὶ Ἰώριβον, Ναθάν, Ἐννατάν, Ζαχαρίαν καὶ Μεσολαβών
  choice: Елеазаром, Идуилом, Маасманом, Енаатаном, Самаией, Иоривом, Нафаном, Еннатаном, Захарией и Месолавоном
  rationale: Имена переданы в русской библейской форме там, где соответствие прозрачно, а в остальных случаях транслитерированы по греческому свидетельству Swete; насильственная гармонизация с еврейской параллелью не предпринималась.
- source_word: τοὺς ἡγουμένους
  choice: предводителями
  rationale: Субстантивированное причастие обозначает людей, занимающих ведущее положение; «предводители» передаёт роль и сохраняет достоинство регистра.
- source_word: ἐπιστήμονας
  choice: людьми сведущими
  rationale: Слово обозначает знающих, разумных или опытных людей. «Люди сведущие» сохраняет личный и качественный смысл, не сужая его до формального звания «знатоки».
