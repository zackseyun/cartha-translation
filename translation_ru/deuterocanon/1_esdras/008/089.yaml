base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/089.yaml
  text: And while Ezra was praying and making confession[a], weeping as he lay prostrate before the temple[b], a very great crowd gathered to him from Jerusalem—men and women and young men—for there was great weeping among the multitude.
translation:
  language: ru
  text: И когда Ездра, молясь и исповедуясь[a], плакал, распростершись ниц перед храмом, к нему собралось из Иерусалима чрезвычайно много народу — мужчины, женщины и юноши[b], — потому что в народе стоял великий плач.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вознося благодарение». Греческий глагол допускает оба значения, но покаянный контекст скорее указывает на исповедание.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово означает именно молодых мужчин, а не молодёжь вообще.
    reason: lexical_clarification
lexical_decisions:
- source_word: προσευχόμενος
  choice: молясь
  rationale: Причастие настоящего времени обозначает продолжающееся действие, одновременное с исповеданием и плачем.
- source_word: ἀνθωμολογεῖτο
  choice: исповедуясь
  rationale: В контексте молитвы, слёз и распростёртого положения глагол естественнее всего указывает на исповедание; возможное значение благодарения отмечено в сноске.
- source_word: κλαίων
  choice: плакал
  rationale: Передаёт продолжающийся плач в покаянной и торжественной сцене без ненужной архаизации.
- source_word: χαμαιπετής
  choice: распростершись ниц
  rationale: Передаёт положение человека, поверженного и простёртого на земле, а также выраженную этим жестом смиренность.
- source_word: ἔμπροσθεν τοῦ ἱεροῦ
  choice: перед храмом
  rationale: ἱερόν обозначает храм или храмовый комплекс, а не исключительно внутреннее святилище.
- source_word: ἐπισυνήχθησαν πρὸς αὐτόν
  choice: к нему собралось
  rationale: Сохраняет направленность движения к Ездре и естественно сочетается с собирательным выражением «много народу».
- source_word: ὄχλος πολὺς σφόδρα
  choice: чрезвычайно много народу
  rationale: Передаёт как многочисленность толпы, так и усилитель σφόδρα, оставаясь естественным для современного русского повествования.
- source_word: νεανίαι
  choice: юноши
  rationale: Греческое существительное мужского рода обозначает молодых мужчин, а не молодёжь обоих полов.
- source_word: κλαυθμὸς ... μέγας
  choice: стоял великий плач
  rationale: «Плач» передаёт слышимое коллективное горе, а конструкция «стоял великий плач» звучит естественно и торжественно.
- source_word: ἐν τῷ πλήθει
  choice: в народе
  rationale: Передаёт происходящее внутри собравшегося множества, избегая стилистически тяжёлого повторения слова «толпа».
theological_decisions:
- issue: Значение ἀνθωμολογεῖτο в покаянном контексте
  choice: исповедуясь
  alternative: благодаря / вознося благодарение
  rationale: Хотя глагол допускает значение благодарения или хвалы, молитва, слёзы и положение ниц в данном контексте указывают прежде всего на исповедание. Неустранимая лексическая возможность сохранена в сноске.
- issue: Обозначение νεανίαι
  choice: юноши
  alternative: молодёжь / молодые люди
  rationale: Источник прямо использует форму мужского рода в перечне отдельных групп, поэтому родовое значение не нейтрализовано.
- issue: Храмовая терминология для ἱερόν
  choice: храм
  alternative: святилище
  rationale: «Храм» сохраняет более широкое значение храмового комплекса и не сужает его до внутреннего святилища.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «распростершись ниц» сохраняет телесную выразительность сцены, а «стоял великий плач» — её общественный и скорбный характер. Все сносочные маркеры помещены при соответствующих словам.
