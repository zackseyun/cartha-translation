base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/061.yaml
  text: And after setting out from the place Thera on the twelfth day of the first month[a], they came to Jerusalem by the mighty hand of our Lord that was upon us; and he rescued us from every enemy from the outset[c][b], and they came to Jerusalem.
translation:
  language: ru
  text: И, отправившись из места Фера в двенадцатый день первого месяца,[a] они достигли Иерусалима благодаря могучей руке нашего Господа, бывшей над нами. Он избавил нас от всякого врага при его приближении,[b] и они пришли в Иерусалим.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте место отправления названо «Фера»; в еврейском параллельном тексте Ездры 8:31 говорится о реке Агаве. Поскольку здесь переводится греческая 1-я книга Ездры, в основном тексте сохранено имя «Фера».
    reason: alternative_reading
  - marker: b
    text: Греческое выражение необычно и буквально может быть передано приблизительно как «от входа (или приближения) всякого врага». Еврейский параллельный текст говорит о «руке врага и засаде на дороге», что может поддерживать понимание опасности во время пути, но это толкование не следует считать несомненным.
    reason: textual_variant
  - marker: c
    text: 'В греческом тексте местоимения «наш» и «нас» стоят в первом лице, но затем повествование переходит к третьему лицу: «они пришли». Кроме того, прибытие в Иерусалим упомянуто повторно. Эти особенности сохранены в основном тексте.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀναζεύξαντες
  choice: отправившись
  rationale: Причастие обозначает снятие с места и начало пути; «отправившись» естественно передаёт это значение по-русски.
- source_word: τοῦ τόπου Θερὰ
  choice: из местности Фера
  rationale: Греческий текст называет пункт отправления Θερὰ. Это чтение сохранено как основное, хотя еврейский параллельный текст говорит о реке Агаве.
- source_word: τῇ δωδεκάτῃ τοῦ πρώτου μηνὸς
  choice: в двенадцатый день первого месяца
  rationale: Ясная и точная передача календарного выражения.
- source_word: κατὰ τὴν κραταιὰν χεῖρα τοῦ κυρίου ἡμῶν τὴν ἐφʼ ἡμῖν
  choice: благодаря могучей руке нашего Господа, простёртой над нами
  rationale: Оборот выражает действенную силу и благоволение Бога. «Благодаря» естественно передаёт значение κατὰ в данном контексте, а образ руки сохранён.
- source_word: ἐρύσατο
  choice: избавил
  rationale: Глагол означает избавление или спасение от непосредственной опасности; «избавил» сохраняет библейский образ без лишнего догматического уточнения.
- source_word: ἀπὸ τῆς εἰσόδου ἀπὸ παντὸς ἐχθροῦ
  choice: от всякого врага, нападавшего в пути
  rationale: Греческое выражение в переданном тексте необычно и буквально допускает смысл «от входа/приближения всякого врага». Контекст и еврейская параллель об опасности и засаде на дороге поддерживают понятную передачу нападения в пути; трудность отмечена в сноске.
- source_word: καὶ ἤλθον εἰς Ἰερουσαλήμ
  choice: и они пришли в Иерусалим
  rationale: Сохранены повтор сообщения о прибытии и третье лицо множественного числа, присутствующие в греческом тексте, несмотря на предшествующее первое лицо в местоимениях.
theological_decisions:
- issue: Передача κύριος применительно к Богу Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — естественное и традиционное соответствие κύριος в повествовании о Божьем покровительстве; контекст не требует иного титула.
- issue: Образ могучей руки Бога
  choice: 'сохранить образ буквально: «могучая рука нашего Господа, простёртая над нами»'
  alternative: 'передать объяснительно: «под могучей защитой нашего Господа»'
  rationale: Буквенная образность важна для библейского языка и одновременно понятна современному читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены образ «могучей руки», повтор прибытия и смена грамматического лица; неясное выражение о враге передано по контексту и документировано в сноске.
