revisions:
- from: И, отправившись из местности Фера в двенадцатый день первого месяца,[a] они достигли Иерусалима благодаря могучей руке нашего Господа, простёртой над нами. Он избавил нас от всякого врага, нападавшего в пути,[b] и они пришли в Иерусалим.[c]
  to: И, отправившись из места Фера в двенадцатый день первого месяца,[a] они достигли Иерусалима благодаря могучей руке нашего Господа, бывшей над нами. Он избавил нас от всякого врага при его приближении,[b] и они пришли в Иерусалим.[c]
  rationale: Правка устраняет добавленное значение «простёртой», заменяет менее точное «местности» на «места» и делает передачу текстуально трудного оборота об εἴσοδος менее интерпретативной. Повтор прибытия, топоним греческого текста и смена лица сохранены; сноски прямо отмечают как еврейскую параллель, так и неустранимую трудность греческого выражения.
  reviewer_model: gpt-5.6-terra
