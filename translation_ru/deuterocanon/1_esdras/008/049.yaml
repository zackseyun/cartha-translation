base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/049.yaml
  text: 'And from the temple servants whom David and the leaders had assigned to the service of the Levites: temple servants[a], two hundred twenty[b]; all of them were listed by name.'
translation:
  language: ru
  text: И из храмовых служителей, которых Давид и начальники назначили для работы левитов, — двести двадцать храмовых служителей[a]; все они были записаны поимённо.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нетиним» — заимствованное из еврейского языка специальное название храмовых служителей. В греческом тексте стоит ἱερόδουλοι («храмовые служители»), а в еврейском параллельном тексте — נְתִינִים.'
    reason: lexical_alternative
  - marker: b
    text: Буквально эта фраза указывает на составление поимённой записи, то есть на официальную регистрацию всех их.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἱεροδούλων / ἱερόδουλοι
  choice: храмовых служителей / храмовых служителей
  rationale: Греческое слово обозначает людей, прикреплённых к священному, храмовому служению. «Храмовые служители» ясно передаёт их функцию и согласуется с еврейским параллельным נְתִינִים, не утверждая однозначно рабского статуса.
- source_word: ἔδωκεν
  choice: отдали
  rationale: Сохранено основное значение «дали, отдали». Множественное число по-русски естественно связывает действие с составным субъектом «Давид и начальники», хотя греческая форма стоит в единственном числе при первом названном лице.
- source_word: οἱ ἡγούμενοι
  choice: начальники
  rationale: Слово обозначает руководящих лиц; «начальники» — естественное библейско-историческое обозначение должностных руководителей без чрезмерно узкой политической конкретизации.
- source_word: εἰς τὴν ἐργασίαν τῶν Λευειτῶν
  choice: для служения левитам
  rationale: Передаёт назначение этих людей для работы в помощь левитам; «служение» уместно в храмовом контексте, а дательный падеж сохраняет возможный оттенок обслуживания левитов.
- source_word: διακόσιοι εἴκοσι
  choice: двести двадцать
  rationale: Прямое и современное оформление числительного.
- source_word: πάντων ἐσημάνθη ὀνοματογραφία
  choice: все они были записаны поимённо
  rationale: Естественно передаёт формальную письменную регистрацию по именам, выраженную сочетанием ἐσημάνθη и ὀνοματογραφία.
