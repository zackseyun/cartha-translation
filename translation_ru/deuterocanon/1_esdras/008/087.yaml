base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/087.yaml
  text: Lord of Israel, you are true; for we have been left as a root to this day.
translation:
  language: ru
  text: Господи Израиля, Ты истинен, ведь мы по сей день оставлены как корень.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «оставлены как корень». Образ «корня» может обозначать сохранённую основу или уцелевшую часть; иногда переводят: «оставлены как остаток».'
    reason: Поясняет непривычную метафору и отмечает распространённое смысловое переложение, не выдавая одно толкование за точное значение текста.
lexical_decisions:
- source_word: κύριε τοῦ Ἰσραήλ
  choice: Господи Израиля
  rationale: Сохранено обращение к Господу как к Владыке Израиля; родительный падеж передан прямо и естественно по-русски.
- source_word: ἀληθινὸς εἶ
  choice: Ты истинен
  rationale: Прилагательное ἀληθινός передано предикативно, без сужения смысла до «верен» или «праведен».
- source_word: κατελείφθημεν
  choice: мы оставлены
  rationale: Сохранена пассивная форма аориста, не уточняющая прямо действующее лицо.
- source_word: ῥίζα
  choice: как корень
  rationale: Сохранён конкретный образ «корня», засвидетельствованный греческим текстом, а не заменён толкованием «остаток».
- source_word: ἐν τῇ σήμερον
  choice: до сего дня
  rationale: Идиоматическое временное выражение передано естественным русским оборотом со значением продолжающегося до настоящего дня состояния.
theological_decisions:
- issue: Образ уцелевшего народа
  choice: как корень
  alternative: как остаток
  rationale: Греческий текст прямо использует ῥίζα («корень»). Вариант «остаток» проясняет предполагаемый смысл, но устраняет метафору и поэтому оставлен только в примечании.
- issue: Значение ἀληθινός применительно к Господу
  choice: Ты истинен
  alternative: Ты верен
  rationale: «Истинен» сохраняет более широкий смысл греческого прилагательного и не сводит высказывание исключительно к верности завету.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Прописное «Ты» подчёркивает прямое обращение к Богу; синтаксис остаётся ясным для обычного читателя, при этом образность и пассивная конструкция греческого текста сохранены.
