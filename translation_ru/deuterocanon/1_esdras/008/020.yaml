  source_fidelity: 'Текст точно передаёт греческий оригинал: ὁμοίως — «Также», ἕως в значении количественного предела — «до», πυροῦ — «пшеницы», κόρων — «коров», а μετρητῶν — нейтрально «мер». В частности, «мер вина» не подменяет общее греческое μετρητής более конкретным «батом».'
  naturalness: Краткая эллиптическая формула с тире естественна для продолжения административного перечня в современном литературном русском. Сочетание «ста коров пшеницы» может вне контекста зрительно совпадать с формой слова «корова», но это нормативная форма родительного множественного числа от «кор»; сноска своевременно снимает возможную неоднозначность.
  terminology: «Кор» сохранён как конкретная древняя сухая мера и пояснён. «Меры» для вина сохраняет уровень конкретности греческого текста. Сноска к параллели корректно отмечает баты в Езд. 7:22, не вводя их в основной текст как якобы прямо названные в греческом тексте.
