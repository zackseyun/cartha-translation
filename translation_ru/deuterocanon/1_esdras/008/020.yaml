    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: Также
  rationale: 'Передаёт присоединительный смысл: фраза продолжает перечень разрешённых поставок.'
- source_word: ἕως
  choice: до
  rationale: В административном контексте обозначает верхний предел количества.
- source_word: πυροῦ
  choice: пшеницы
  rationale: Греческое слово называет именно пшеницу, а не зерно вообще.
- source_word: κόρων ἑκατόν
  choice: ста коров
  rationale: Сохраняет конкретную древнюю единицу сухой меры, названную в греческом тексте.
- source_word: οἴνου
  choice: вина
  rationale: Прямое и естественное соответствие греческому οἶνος.
- source_word: μετρητῶν ἑκατόν
  choice: ста мер
  rationale: Греческий текст говорит о мерах жидкости, но не называет их батами; нейтральное «мер» сохраняет степень конкретности первичного источника.
