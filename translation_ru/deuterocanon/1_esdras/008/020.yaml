translation_notes:
  register: Краткая административная формулировка на современном литературном русском. Тире после «Также» помогает естественно передать эллиптическое продолжение перечня. Специальная единица «кор» сохранена и пояснена; более общее греческое μετρητής передано как «мера», без подстановки конкретного «бата» в основной текст.
