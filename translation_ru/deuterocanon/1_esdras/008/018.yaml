base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/018.yaml
  text: And whatever else may come up as a need for the house of your God[a], you shall give from the royal treasury.
translation:
  language: ru
  text: А всё прочее, что потребуется для храма твоего Бога, выдай из царской казны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ λοιπὰ
  choice: всё прочее
  rationale: Передаёт совокупность дополнительных средств или предметов сверх уже названных и естественно звучит в контексте распоряжения.
- source_word: ὅσα ἂν ὑποπίπτῃ σοι εἰς τὴν χρείαν
  choice: что потребуется
  rationale: Кратко и естественно передаёт возможность возникновения практической необходимости; частица ἂν сохраняется в неопределённом характере формулировки.
- source_word: τοῦ ἱεροῦ τοῦ θεοῦ σου
  choice: для храма твоего Бога
  rationale: ἱερόν непосредственно обозначает храм или храмовый комплекс. В данном административном контексте «храм» точнее следует основному греческому свидетелю, тогда как семитский параллельный текст с «домом Бога» подтверждает общий храмовый смысл.
- source_word: δώσεις
  choice: выдай
  rationale: Будущее изъявительное в царском указе имеет предписывающую силу; русский императив ясно и естественно передаёт распоряжение.
- source_word: ἐκ τοῦ βασιλικοῦ γαζοφυλακίου
  choice: из царской казны
  rationale: Точно и идиоматично передаёт официальный источник финансирования; «царская казна» естественнее по-русски, чем буквальное «царское хранилище».
theological_decisions:
- issue: Передача τοῦ ἱεροῦ τοῦ θεοῦ σου при наличии семитского параллельного выражения «дом твоего Бога»
  choice: для храма твоего Бога
  alternative: для дома твоего Бога; для святилища твоего Бога
  rationale: Основным источником является греческий текст, где ἱερόν прямо указывает на храм или храмовый комплекс. Вариант «дом Бога» из приблизительного семитского параллеля не меняет смысла, но не должен вытеснять более точное чтение основного свидетеля.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского распоряжения. Формулировка лаконична и понятна; архаизмы и конфессионально окрашенные выражения не использованы.
