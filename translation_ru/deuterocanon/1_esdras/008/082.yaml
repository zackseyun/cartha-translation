  terminology: «Брать ... в жёны», «искать мира», «окрепнув» и «унаследовать» удачны. «Блага земли» сохраняет широту τὰ ἀγαθὰ τῆς γῆς; «вкушать» поддерживает буквальный пищевой образ, хотя и допускает расширенное значение.
