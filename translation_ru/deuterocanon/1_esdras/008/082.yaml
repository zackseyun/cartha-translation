  source_fidelity: 'Основной смысл передан верно: запрет на браки с дочерьми этих народов, на поиск мира с ними, а также мотив укрепления, вкушения благ земли и наследования земли сохранены. Однако «во все времена» в данном контексте звучит как утверждение о разных исторических эпохах, тогда как τὸν ἅπαντα χρόνον означает непрерывный запрет на всё последующее время; «никогда» передаёт это по-русски яснее. Сочетание «вкушали ... и унаследовали» также смешивает виды в придаточном цели; инфинитивы после «чтобы» точнее отражают два однородных целевых действия.'
