base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/082.yaml
  text: and do not take their daughters for your sons[a], and do not seek peace with them all your days, so that, having become strong, you may eat the good things of the land and inherit it
translation:
  language: ru
  text: и не берите их дочерей в жёны своим сыновьям; никогда не ищите мира с ними[a], чтобы, окрепнув, вкушать блага земли и унаследовать её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с учётом более широкого смысла оборота: «никогда не ищите их мира и благополучия».'
    reason: Сжатое греческое выражение допускает понимание не только как мирных отношений, но и как заботы о благополучии этих народов.
lexical_decisions:
- source_word: λάβητε
  choice: берите … в жёны
  rationale: Глагол буквально означает «брать», но сочетание с дочерьми и сыновьями обозначает заключение брака. Уточнение «в жёны» естественно для современного русского языка и не добавляет нового смысла.
- source_word: ζητήσετε
  choice: ищите
  rationale: Прямо передаёт значение греческого глагола и сохраняет широкий характер запрета.
- source_word: εἰρηνεῦσαι τὰ πρὸς αὐτούς
  choice: мира с ними
  rationale: Сжатый греческий оборот означает стремление к мирным отношениям с ними; перевод сохраняет форму и неоднозначность выражения, а более широкий возможный смысл отмечен в сноске.
- source_word: τὸν ἅπαντα χρόνον
  choice: во все времена
  rationale: Передаёт всеохватность выражения «всё время», не превращая его в метафизическое утверждение о вечности.
- source_word: ἵνα ἰσχύσαντες
  choice: чтобы, окрепнув
  rationale: 'Деепричастная конструкция естественно передаёт аористное причастие и последовательность: обрести силу, а затем пользоваться благами земли.'
- source_word: φάγητε τὰ ἀγαθὰ τῆς γῆς
  choice: вы вкушали блага этой земли
  rationale: «Вкушали блага» сохраняет образ еды, но по-русски также естественно охватывает урожай, достаток и прочие дары земли.
- source_word: κατακληρονομήσητε
  choice: унаследовали её
  rationale: Передаёт выраженную глаголом идею наследования; местоимение «её» естественно восполняет подразумеваемый объект — землю.
theological_decisions:
- issue: Смысл запрета εἰρηνεῦσαι τὰ πρὸς αὐτούς и его связь с параллельной традицией Ездры
  choice: В основном тексте передать непосредственно греческое «не ищите мира с ними».
  alternative: «Не ищите их мира и благополучия» или «не заботьтесь об их благополучии».
  rationale: Греческий текст остаётся главным основанием перевода и прямо говорит о мире или мирных отношениях. Более широкий семитский оттенок благополучия не следует незаметно вносить в основной текст, поэтому он сохранён как возможное прочтение в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; брачный контекст выражен явно, а смысловая неоднозначность оборота о мире сохранена в сноске.
