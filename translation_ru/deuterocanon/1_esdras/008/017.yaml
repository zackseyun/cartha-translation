translation:
  language: ru
  text: Что же касается твоих священных сосудов, которые передают для нужд храма твоего Бога в Иерусалиме,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ κατὰ
  choice: Что же касается
  rationale: В данном контексте κατὰ с винительным падежом вводит новую тему распоряжения; русское «что же касается» естественно передаёт эту функцию, а καί выражено частицей «же».
- source_word: τὰ ἱερὰ σκεύη σου
  choice: твоих священных сосудов
  rationale: σκεύη обозначает сосуды или принадлежности, а ἱερά указывает на их посвящённость для богослужебного употребления. «Священные сосуды» — точное и привычное русское сочетание без излишнего уточнения их вида.
- source_word: τὰ διδόμενα
  choice: которые передают
  rationale: Настоящее страдательное причастие обозначает сосуды, передаваемые адресату. Неопределённо-личная конструкция звучит по-русски естественно и сохраняет нез названного в греческом тексте деятеля.
- source_word: εἰς τὴν χρείαν
  choice: для нужд
  rationale: χρεία здесь указывает на назначение и практическое употребление сосудов при храме. «Для нужд» сохраняет смысл, не добавляя более узкого понятия богослужения.
- source_word: τοῦ ἱεροῦ
  choice: храма
  rationale: ἱερόν прямо обозначает храм или храмовый комплекс. Перевод «храма» следует основному греческому источнику и не заменяет его семитизмом «дома».
- source_word: τοῦ θεοῦ σου τοῦ ἐν Ἰερουσαλήμ
  choice: твоего Бога в Иерусалиме
  rationale: Передаёт принадлежность храма Богу адресата и его местонахождение; компактная русская конструкция остаётся ясной.
