  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτων τελεσθέντων
  choice: Когда всё это было завершено
  rationale: Родительный самостоятельный оборот обозначает действие, завершившееся прежде основного; формулировка естественна для современного русского языка и сохраняет значение доведения до конца.
- source_word: προσηλθόσαν μοι
  choice: ко мне пришли
  rationale: Передаёт обычное значение προσέρχομαι и дательный μοι без излишне книжного «приблизились ко мне».
- source_word: οἱ ἡγούμενοι
  choice: руководители
  rationale: Обозначает людей, стоящих во главе и обладающих авторитетом, но не требует уточнения их формальной должности.
- source_word: λέγοντες
  choice: 'и сказали:'
  rationale: В русском языке личная форма естественно вводит прямую речь следующего стиха; двоеточие сохраняет незавершённую связь с продолжением.
