  terminology: «Дом» сохраняет буквальный библейский термин οἶκος; сноска ясно указывает на храмовый референт. «Великий и могущественный» адекватно передаёт μέγας καὶ ἰσχυρός. «Был завершён» — естественный эквивалент ἐπετέλεσθη.
