base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/013.yaml
  text: And the house was being built over many years before the time of a great and mighty king of Israel[b][a], and it was completed.
translation:
  language: ru
  text: И дом[a] строился много лет — ещё до времени великого и могущественного царя Израиля[b] — и был завершён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «домом» здесь подразумевается храм.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «великим и могущественным царём Израиля». Греческий оборот с διά может иметь инструментальное значение, однако в данном контексте вероятнее временное понимание.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκοδομεῖτο
  choice: возводился
  rationale: Имперфект пассивного залога передаёт продолжавшееся строительство; «возводился» естественно сочетается с последующим указанием на завершение.
- source_word: ὁ οἶκος
  choice: этот дом
  rationale: Сохранено буквальное «дом», хотя по контексту имеется в виду храм; указательное «этот» естественно передаёт определённость предмета речи.
- source_word: ἔμπροσθεν ἐτῶν πλειόνων
  choice: много лет назад
  rationale: Сочетание естественнее всего обозначает давнее время, а не продолжительность строительства; так оно согласуется и с параллельной традицией рассказа.
- source_word: διὰ βασιλέως τοῦ Ἰσραὴλ μεγάλου καὶ ἰσχυροῦ
  choice: великим и могущественным царём Израиля
  rationale: διά с родительным допускает значение посредства или действующего лица; творительный падеж кратко и ясно передаёт эту связь, не называя царя по имени.
- source_word: ἐπετέλεσθη
  choice: был доведён до конца
  rationale: Аорист пассивного залога обозначает достигнутое завершение и сохраняет смысловой контраст с продолжительным «возводился».
theological_decisions:
- issue: Значение слова «дом»
  choice: Сохранено буквальное «дом», с пояснением, что речь о храме.
  alternative: 'Перевести непосредственно: «храм».'
  rationale: Буквальная формулировка сохраняет библейский образ и не затемняет референт благодаря сноске.
- issue: Связь строительства с царём Израиля
  choice: Царь представлен как действующее лицо или посредник строительства.
  alternative: «При великом и могущественном царе Израиля».
  rationale: Инструментальное значение διά с родительным грамматически прямее. Перевод не уточняет, строил ли царь лично, по повелению или посредством подчинённых.
- issue: Временное выражение ἔμπροσθεν ἐτῶν πλειόνων
  choice: «много лет назад».
  alternative: «на протяжении многих лет до времени…».
  rationale: Греческая последовательность естественно указывает на давность события. Это также лучше соответствует историческому контексту прежнего храма, не требуя перестройки синтаксиса.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка следует прежде всего греческому тексту; синтаксическая сжатость раскрыта без указания имени царя и без конфессиональных толкований.
