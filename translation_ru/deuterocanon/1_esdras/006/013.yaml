  source_fidelity: В черновике имперфект οἰκοδομεῖτο удачно передан формой «возводился», однако «много лет назад» превращает ἐτῶν πλειόνων в простое указание на давность и утрачивает значение длительности. Кроме того, основной перевод διά с родительным как творительного падежа («царём») выбирает одну из возможных трактовок трудного греческого оборота. Вслед за английским аудитом предпочтительнее осторожно передать временное понимание, а инструментальное сохранить в сноске.
