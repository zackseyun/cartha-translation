  source_fidelity: 'В целом переданы все основные элементы греческого текста: распоряжение, перечень должностных лиц, требование удалиться от места и не препятствовать Зоровавелю и старейшинам. Однако имя Σαθραβουζάνῃ передано неточно: греческая θ требует передачи «Сатравузан», а не «Сафравузан». Кроме того, «оставили в покое» ближе к ἐᾶσαι («оставить, позволить»), чем интерпретирующее «не мешали».'
