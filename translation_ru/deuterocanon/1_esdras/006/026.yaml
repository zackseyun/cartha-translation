base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/026.yaml
  text: He also ordered Sisinnes[a], governor of Syria and Phoenicia, and Sathrabuzanes and their associates and the appointed governors in Syria and Phoenicia, to keep away from the place, but to leave Zerubbabel, the servant of the Lord and governor of Judea, and the elders of the Jews alone.
translation:
  language: ru
  text: Он также распорядился, чтобы Сисинн, правитель Сирии и Финикии, Сатравузан, их сотрудники и назначенные в Сирии и Финикии правители держались подальше от этого места, а Зоровавеля, слугу Господа и правителя Иудеи, и старейшин иудеев оставили в покое[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позволили Зоровавелю, слуге Господа и правителю Иудеи, и старейшинам иудеев действовать». Греческий глагол буквально означает «оставить» или «позволить»; здесь речь идёт об официальном невмешательстве.'
    reason: Лексическая альтернатива сохраняет диапазон значения ἐᾶσαι и поясняет его в административном контексте.
lexical_decisions:
- source_word: προσετάξεν ... ἐπιμεληθῆναι
  choice: распорядился, чтобы
  rationale: Сочетание передаёт официальное властное предписание; единая русская конструкция естественно выражает силу обоих греческих глаголов без тяжеловесного удвоения.
- source_word: ἐπάρχῳ
  choice: правитель
  rationale: Обозначает провинциального руководителя; «правитель» понятно современному читателю и не навязывает более узкий исторический титул.
- source_word: συνεταίροις
  choice: соратники
  rationale: В данном административном контексте речь идёт о людях, действующих совместно с названными должностными лицами, а не о близких друзьях.
- source_word: ἀποτεταγμένοις ... ἡγεμόσιν
  choice: назначенные ... начальники
  rationale: Перевод сохраняет как идею назначения, так и руководящее положение этих лиц, не отождествляя их ранг без необходимости с рангом ἐπάρχου.
- source_word: ἀπέχεσθαι τοῦ τόπου
  choice: держались подальше от этого места
  rationale: Сохранён пространственный образ греческого текста; в контексте он также передаёт требование официального невмешательства.
- source_word: ἐᾶσαι
  choice: не мешали
  rationale: Глагол означает «оставить, позволить». В контексте распоряжения чиновникам «не мешали» естественно передаёт требование предоставить Зоровавелю и старейшинам возможность продолжать дело, не уточняя не названное в этом стихе действие.
- source_word: παῖδα Κυρίου
  choice: слуге Господа
  rationale: παῖς допускает значения «ребёнок» и «слуга», но здесь это почётное обозначение служения Богу, а не указание на возраст или происхождение.
- source_word: ὕπαρχον ... τῆς Ἰουδαίας
  choice: правителю Иудеи
  rationale: Термин обозначает носителя власти над областью; «правитель» сохраняет административный смысл и не вводит спорного точного титула.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: старейшинам иудеев
  rationale: В общинном контексте πρεσβύτεροι — признанные руководители, поэтому традиционное и ясное «старейшины» предпочтительнее буквального указания на возраст.
theological_decisions:
- issue: Передача Κυρίου в выражении παῖδα Κυρίου
  choice: Господа
  alternative: Владыки / господина
  rationale: В иудейском библейском контексте «Господь» сохраняет почтительное обозначение Бога и не сводит выражение к отношениям с человеческим хозяином.
- issue: Значение παῖς применительно к Зоровавелю
  choice: слуга
  alternative: отрок / ребёнок
  rationale: Контекст требует почётно-служебного, а не возрастного или биологического значения; перевод не добавляет к выражению особого мессианского смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством официального повествования. Имена переданы в принятой библейской форме; синтаксис упрощён до ясного русского предложения, при этом сохранены перечень должностных лиц, пространственная формулировка и неоднозначность ἐᾶσαι.
