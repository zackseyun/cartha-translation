base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/021.yaml
  text: And if it is found that the building of the house of the Lord in Jerusalem was done with the approval of Cyrus the king[a], and if it seems good to our lord the king, let him send us word about these matters.
translation:
  language: ru
  text: И если будет установлено, что строительство дома Господа[a] в Иерусалиме велось с одобрения царя Кира, и если наш господин царь сочтёт нужным, пусть сообщит нам об этих делах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «строительство Господа в Иерусалиме»; по контексту имеется в виду строительство дома, то есть храма, Господа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εὑρίσκηται
  choice: если будет установлено
  rationale: 'Условная пассивная форма передана языком официального расследования: речь идёт об установлении факта по итогам поиска или проверки.'
- source_word: μετὰ τῆς γνώμης Κύρου τοῦ βασιλέως
  choice: с одобрения царя Кира
  rationale: В административном контексте γνώμη обозначает санкцию или одобрение, а не просто личное мнение царя.
- source_word: γενομένην τὴν οἰκοδομήν
  choice: строительство… велось
  rationale: Передаёт осуществление строительных работ, не добавляя отсутствующего в греческом тексте уточнения «восстановление».
- source_word: τοῦ κυρίου τοῦ ἐν Ἰερουσαλήμ
  choice: дома Господа в Иерусалиме
  rationale: В греческой формулировке слово «дом» прямо отсутствует, но контекст строительства святилища требует его смыслового восполнения; «дом Господа» сохраняет библейскую образность лучше, чем более пояснительное «храм».
- source_word: κρίνηται τῷ κυρίῳ βασιλεῖ ἡμῶν
  choice: если наш господин царь сочтёт нужным
  rationale: Естественная русская формула почтительного обращения передаёт решение царя о том, что надлежит сделать.
- source_word: προσφωνησάτω ἡμῖν
  choice: пусть сообщит нам
  rationale: В контексте официальной переписки глагол означает обращение с ответом или передачу официального сообщения.
- source_word: περὶ τούτων
  choice: об этом
  rationale: Естественно передаёт ссылку на совокупность рассматриваемых обстоятельств без тяжеловесного «об этих делах».
theological_decisions:
- issue: Два употребления κύριος с разными референтами
  choice: «Господь» применительно к Богу и «господин» применительно к царю
  alternative: 'Передать оба употребления одинаково: «Господь» либо «господин»'
  rationale: Различие регистра и прописной буквы ясно отделяет божественный титул от придворного обращения, не смешивая Бога Израиля с персидским царём.
- issue: Смысловое восполнение объекта строительства
  choice: «строительство дома Господа» с примечанием о буквальной форме
  alternative: «строительство Господа» или пояснительное «строительство храма Господа»
  rationale: Контекст указывает на святилище, но само греческое выражение необычно и не содержит слова «дом»; примечание сохраняет прозрачность переводческого решения.
translation_notes:
  register: Современный литературный русский с достоинством официального царского письма. Формулировки «будет установлено», «с одобрения» и «сочтёт нужным» поддерживают административно-придворный регистр, оставаясь понятными современному читателю.
