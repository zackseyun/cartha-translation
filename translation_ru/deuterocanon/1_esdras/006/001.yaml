base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/001.yaml
  text: In the second year of the reign of Darius[a], Haggai and Zechariah son of Iddo, the prophets, prophesied to the Jews who were in Judea and Jerusalem in the name of the Lord God of Israel[c][b], to them.
translation:
  language: ru
  text: Во второй год царствования Дария пророки Аггей и Захария, сын Иддо, пророчествовали иудеям, жившим в Иудее и Иерусалиме, во имя Господа, Бога Израиля, Который был над ними.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий заключительный оборот буквально означает «над ними» и наиболее естественно относится к Господу, Богу Израиля. Ввиду сжатости конструкции его также связывают с предшествующим пророчеством; такое понимание менее вероятно в свете арамейской параллели.
    reason: alternative_reading
  - marker: b
    text: В греческом тексте перед словом «пророки» дважды повторён артикль; вероятно, это особенность рукописной передачи. В переводе передан очевидный смысл.
    reason: textual_variant
lexical_decisions:
- source_word: Ἐν δὲ τῷ δευτέρῳ ἔτει τῆς Δαρείου βασιλείας
  choice: Во второй год царствования Дария
  rationale: δέ имеет лёгкую связующую силу, которую по-русски здесь естественно не выражать отдельно; βασιλεία обозначает царствование.
- source_word: ἐπροφήτευσεν
  choice: пророчествовали
  rationale: Греческое сказуемое стоит в единственном числе при составном подлежащем, что допустимо в греческом; русское согласование требует множественного числа.
- source_word: Ἀγγαῖος καὶ Ζαχαρίας ὁ τοῦ Ἐδδεὶν
  choice: Аггей и Захария, сын Иддо
  rationale: Патроним относится к Захарии; форма имени Иддо подтверждается арамейской параллелью.
- source_word: οἱ οἱ προφῆται
  choice: пророки
  rationale: Повтор артикля, вероятно, является особенностью передачи текста; смысл — приложение к именам Аггея и Захарии.
- source_word: ἐπὶ τοὺς Ἰουδαίους
  choice: иудеям
  rationale: При глаголе пророческой речи ἐπί обозначает направленность речи к адресатам, а не враждебность против них.
- source_word: τοὺς ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: жившим в Иудее и Иерусалиме
  rationale: Передаёт греческое название области Ἰουδαία и естественно связывает определение с иудеями.
- source_word: ἐπὶ τῷ ὀνόματι Κυρίου θεοῦ Ἰσραήλ
  choice: от имени Господа, Бога Израиля
  rationale: Оборот выражает полномочие, с которым говорят пророки; русское «от имени» естественно передаёт эту функцию.
- source_word: ἐπ’ αὐτούς
  choice: о них
  rationale: Заключительный сжатый оборот допускает значения «о них», «над ними» или «к ним»; «о них» сохраняет связь с объектом пророчества без неестественного русского оборота.
theological_decisions:
- issue: Передача Κυρίου в иудейском Писании, когда первичным источником служит греческий текст
  choice: Господа
  alternative: ГОСПОДА; Владыки
  rationale: Первичный текст содержит Κύριος; «Господь» является прямым и нейтральным соответствием без подмены греческого чтения реконструированным еврейским именем.
- issue: Отношение пророческой речи, выраженное двумя оборотами с ἐπί
  choice: пророчествовали иудеям ... о них
  alternative: пророчествовали против иудеев ... над ними; пророчествовали иудеям ... к ним
  rationale: Первый оборот естественно обозначает адресатов, тогда как второй остаётся сжатым и неоднозначным. Перевод «о них» не придаёт пророчеству неоправданно враждебного смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён лишь настолько, чтобы длинная греческая фраза оставалась понятной; сохранены приложение «пророки» и неоднозначность заключительного оборота через примечание.
