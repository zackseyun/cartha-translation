  source_fidelity: 'Заключительное ἐπ’ αὐτούς в сочетании с ἐπὶ τῷ ὀνόματι Κυρίου θεοῦ Ἰσραήλ естественнее всего относится к «Господу, Богу Израиля»: «который был над ними». Это подтверждается синтаксисом арамейской параллели. Вариант «о них» делает данный оборот непосредственным содержанием пророчества и тем самым менее точно передаёт его наиболее вероятную синтаксическую связь.'
  naturalness: Основная фраза в целом литературна. После уточнения заключительного оборота лучше употребить формульное «во имя», а не «от имени»; явное относительное предложение делает русский текст ясным и естественным.
  terminology: «Господь, Бог Израиля», «Аггей», «Захария», «Иддо», «иудеи» и «Иудея» переданы удачно. Приложение «пророки» сохранено; повторённый греческий артикль корректно не воспроизводится в основном тексте.
