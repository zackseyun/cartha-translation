    rationale: «О них» сужает ἐπ’ αὐτούς до темы пророчества. В греческом и особенно в арамейской параллели оборот наиболее естественно характеризует Бога Израиля как пребывающего/владычествующего над ними. Русский текст должен отразить эту связь, не выдавая менее вероятное толкование за основной смысл.
  - severity: low
