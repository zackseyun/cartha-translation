  rationale: Исправлена синтаксическая связь заключительного ἐπ’ αὐτούς согласно первичному греческому тексту и поддерживающей его арамейской параллели. Сноска сохраняет отмеченную в английском аудите возможность иной связи, не вводя её в основной текст как предпочтительный смысл. Формула «во имя» точнее передаёт ἐπὶ τῷ ὀνόματι.
