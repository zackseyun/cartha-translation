base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/004.yaml
  text: By whose authorization are you building this house and completing this roof and all the rest? And who are the builders carrying out these things?[a][b]
translation:
  language: ru
  text: По чьему распоряжению вы строите этот дом, завершаете эту кровлю и всё остальное? И кто те строители, которые выполняют эти работы?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По чьему приказу вы строите этот дом…?» Греческое причастие может подчёркивать приказ или указание, на основании которого ведутся работы.'
    reason: lexical_alternative
  - marker: b
    text: Под «домом» здесь подразумевается храм; в переводе сохранено обычное греческое слово, а не подставлено пояснительное «храм».
    reason: cultural_note
lexical_decisions:
- source_word: Τίνος … συντάξαντος
  choice: По чьему распоряжению
  rationale: Родительный вопросительного местоимения вместе с причастием от συντάσσω указывает на лицо, отдавшее распоряжение или санкционировавшее работы. Формулировка сохраняет административный характер вопроса.
- source_word: οἰκοδομεῖτε
  choice: строите
  rationale: Настоящее время передаёт продолжающиеся строительные работы; приставочное «восстанавливаете» добавило бы прямо не выраженный в греческом оттенок.
- source_word: οἶκον
  choice: дом
  rationale: Греческий текст употребляет обычное слово «дом»; по контексту имеется в виду храм, но это поясняется в сноске, а не подменяет исходную лексику.
- source_word: στέγην
  choice: кровлю
  rationale: Слово обозначает крышу или покрытие здания; «кровля» естественно звучит в контексте строительных работ и сохраняет конкретность образа.
- source_word: τἄλλα πάντα
  choice: всё остальное
  rationale: Передаёт совокупность прочих частей или работ без неоправданного уточнения.
- source_word: ἐπιτελεῖτε
  choice: завершаете
  rationale: Глагол выражает доведение работы до конца; выбранный вариант естественен в строительном контексте.
- source_word: οἰκοδόμοι
  choice: строители
  rationale: Общее обозначение занятых строительством людей без сужения до отдельной специальности.
- source_word: οἱ ταῦτα τελοῦντες
  choice: которые выполняют эти работы
  rationale: Причастный оборот обозначает исполнителей происходящего; «эти работы» естественно передаёт ταῦτα в данном контексте и избегает тяжеловесного «совершающие это».
