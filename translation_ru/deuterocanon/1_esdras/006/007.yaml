base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/007.yaml
  text: 'A copy of the letter that Sisinnes[a], the governor of Syria and Phoenicia, and Sathrabuzanes, and their associates, the rulers in Syria and Phoenicia, wrote and sent to King Darius: Greetings.'
translation:
  language: ru
  text: 'Копия письма, которое Сисинн, правитель Сирии и Финикии, написал царю Дарию и которое затем отправили Сисинн, Сатрабузан и их соратники — начальники в Сирии и Финикии: «Царю Дарию — приветствие!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον ἐπιστολῆς
  choice: Копия письма
  rationale: 'Передаёт документальный заголовок естественно и точно: ἀντίγραφον — копия или список документа, ἐπιστολή — письмо.'
- source_word: ἧς ἔγραφεν ... καὶ ἀπέστειλαν
  choice: которое написали ... и отправили
  rationale: В греческом происходит переход от единственного числа ἔγραφεν к множественному ἀπέστειλαν. В основном тексте действие естественно отнесено ко всей названной группе, а грамматический сдвиг отмечен в сноске.
- source_word: Σισίννης
  choice: Сисинн
  rationale: Транслитерация греческой формы имени с естественным для русского языка окончанием.
- source_word: ὁ ἔπαρχος
  choice: правитель
  rationale: Обозначает областного административного начальника; «правитель» понятно современному читателю и не навязывает более узкий исторический титул.
- source_word: Συρίας καὶ Φοινίκης
  choice: Сирии и Финикии
  rationale: Родительный падеж естественно обозначает территорию полномочий.
- source_word: Σαθραβουζάνης
  choice: Сафравузан
  rationale: Русская транслитерация греческой формы имени с передачей θ через «ф» и ζ через «з».
- source_word: οἱ συνέταιροι
  choice: их соратники
  rationale: В официальном контексте означает связанных с названными лицами коллег или помощников; «соратники» сохраняет идею совместного участия.
- source_word: ἡγεμόνες
  choice: начальники
  rationale: Широкое обозначение лиц, облечённых властью. Выбор отличает их от единственного ἔπαρχος и не приписывает всем один и тот же точный ранг.
- source_word: Βασιλεῖ Δαρείῳ χαίρειν
  choice: «Царю Дарию — приветствие!»
  rationale: Передаёт стандартную греческую эпистолярную формулу по-русски, сохраняя адресата и официальный характер приветствия.
