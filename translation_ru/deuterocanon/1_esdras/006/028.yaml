  text: and from the tribute of Coele-Syria and Phoenicia[a], support is to be given carefully to these men for sacrifice to the Lord, to Zerubbabel the governor, for bulls and rams and lambs[c][b],
translation:
  language: ru
  text: и чтобы из налоговых поступлений Келесирии и Финикии[a] этим людям должным образом выделяли средства[b] для жертвоприношения Господу, правителю Зоровавелю[c], на быков, баранов и ягнят,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Келесирия — традиционное греческое название области; буквально оно означает «Полая Сирия».
    reason: cultural_note
  - marker: b
    text: 'Или: «выдавали содержание» либо «предоставляли обеспечение». Греческое σύνταξις обозначает официально назначенные средства или содержание из провинциальных доходов.'
    reason: lexical_alternative
  - marker: c
    text: 'Греческая конструкция здесь сжата: слова «правителю Зоровавелю» могут указывать либо на получателя или распорядителя средств, либо быть присоединённым внутри указа наименованием должностного лица.'
    reason: alternative_reading
lexical_decisions:
- source_word: φορολογίας
  choice: налоговых поступлений
  rationale: В сочетании ἀπὸ τῆς φορολογίας речь идёт о средствах, поступающих от провинциального налогообложения; русский вариант передаёт источник финансирования яснее, чем буквальное «налог» или исторически неоднозначная «дань».
- source_word: κοίλης Συρίας
  choice: Келесирии
  rationale: Κοίλη Συρία — закрепившееся в эллинистической традиции географическое название; оно передано принятой русской формой, а не буквальным «Полая Сирия».
- source_word: ἐπιμελῶς
  choice: исправно
  rationale: Наречие указывает на тщательное, добросовестное исполнение распоряжения. В сочетании с выдачей средств «исправно» звучит естественно и передаёт административный оттенок.
- source_word: σύνταξιν δίδοσθαι
  choice: выделяли средства
  rationale: Σύνταξις здесь означает официальное содержание, ассигнование или обеспечение из доходов провинции; перевод не уточняет форму предоставляемой помощи сверх сказанного в источнике.
- source_word: τούτοις τοῖς ἀνθρώποις
  choice: этим людям
  rationale: Хотя греческое существительное имеет грамматически мужскую форму, в данном обороте оно обычно обозначает группу людей и само по себе не доказывает, что автор подчёркивает их пол; нейтральное по употреблению русское «людям» точно и естественно.
- source_word: εἰς θυσίαν τῷ κυρίῳ
  choice: для жертвоприношения Господу
  rationale: Εἰς выражает цель, а θυσία в данном храмовом контексте обозначает жертвоприношение; κύριος передано как «Господь» в соответствии с непосредственно данным греческим текстом.
- source_word: Ζοροβάβελ ἐπάρχῳ
  choice: правителю Зоровавелю
  rationale: Сохранён дательный падеж и сжатое присоединение титула к имени. Пунктуация не устраняет неоднозначность связи этой группы с получателями или распорядителем средств.
- source_word: ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: быков, баранов и ягнят
  rationale: Названия трёх видов жертвенных животных переданы обычными современными русскими соответствиями; последний термин в жертвенном контексте естественно означает ягнят.
theological_decisions:
- issue: Передача κύριος в контексте жертвоприношения Богу Израиля
  choice: Господу
  alternative: ГОСПОДУ
  rationale: Непосредственный греческий источник содержит κυρίῳ, а не еврейский тетраграмматон; поэтому обычное «Господу» сохраняет форму источника и не вносит дополнительного типографического толкования.
- issue: Синтаксическая роль Ζοροβάβελ ἐπάρχῳ
  choice: 'сохранить сжатое присоединение: «правителю Зоровавелю»'
  alternative: «через правителя Зоровавеля» либо «Зоровавелю, правителю»
  rationale: Греческий дательный допускает понимание Зоровавеля как получателя или распорядителя, но не выражает однозначно посредническое значение; основной текст и примечание сохраняют эту напряжённость.
- issue: Обозначение адресатов τούτοις τοῖς ἀνθρώποις
  choice: этим людям
  alternative: этим мужчинам
  rationale: Форма ἄνθρωποι грамматически мужская, однако обычно означает людей вообще; указание на мужской пол здесь не является отдельным смысловым утверждением и могло бы неоправданно сузить референцию.
translation_notes:
  register: Современный литературный русский язык с достоинством официального указа. Союзное начало и конечная запятая сохранены, поскольку стих является частью более длинного синтаксического периода. «Исправно выделяли средства» естественно передаёт административное ἐπιμελῶς σύνταξιν δίδοσθαι без канцелярской тяжеловесности; неоднозначная позиция Зоровавеля не разрешена молча.
