base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/020.yaml
  text: Now then[a], let it be determined, O king; let a search be made in the royal archives of my lord the king in Babylon,
translation:
  language: ru
  text: 'Итак, царь, пусть будет принято решение[a]: пусть произведут поиск в царских архивах господина-царя, находящихся в Вавилоне,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть будет решено». Греческая форма может обозначать официальное решение или постановление.'
    reason: Лексическая и грамматическая неоднозначность пассивной формы κρίνεται.
lexical_decisions:
- source_word: νῦν οὖν
  choice: Итак
  rationale: Сочетание обозначает переход к выводу и естественно передаётся современным русским «итак»; временной оттенок νῦν в данном контексте подчинён логическому.
- source_word: κρίνεται
  choice: пусть будет принято решение
  rationale: Пассивная форма в административном прошении указывает на официальное решение или постановление. Русская безлично-пассивная конструкция сохраняет эту функцию и не придаёт фразе излишне судебного оттенка.
- source_word: βασιλεῦ
  choice: царь
  rationale: Звательная форма передана прямым обращением; отдельная звательная морфология в современном русском отсутствует.
- source_word: ἐπισκεπτήτω
  choice: пусть проведут проверку
  rationale: Форма третьего лица выражает требование официально обследовать или проверить хранилища документов. Неопределённо-личная конструкция естественна для русского административного контекста.
- source_word: βασιλικοῖς βιβλιοφυλακίοις
  choice: в царских архивах
  rationale: Речь идёт о местах хранения книг и документов; «архивы» точно передаёт их административную функцию и не создаёт образа обычной библиотеки.
- source_word: τοῦ κυρίου βασιλέως
  choice: господина царя
  rationale: κύριος здесь является светским придворным титулом почтения, а не обозначением Бога. Перевод сохраняет формальную почтительность и не добавляет отсутствующего в греческом местоимения «моего».
- source_word: τοῖς ἐν Βαβυλῶνι
  choice: находящихся в Вавилоне
  rationale: Определительная конструкция прямо связывает местонахождение с царскими архивами и устраняет возможную синтаксическую двусмысленность русского текста.
theological_decisions:
- issue: Значение κύριος в формуле τοῦ κυρίου βασιλέως
  choice: господина царя
  alternative: Господа Царя
  rationale: Контекст представляет официальное обращение к земному правителю; поэтому слово не следует оформлять как божественный титул. Строчная буква сохраняет светский смысл исходной формулы.
translation_notes:
  register: Современный литературный русский с достоинством официального прошения. Повтор «господина царя» сохранён ради придворной формулы греческого текста; запятая в конце отражает незавершённость предложения в данном стиховом сегменте.
