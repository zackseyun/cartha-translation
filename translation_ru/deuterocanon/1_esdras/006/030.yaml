  text: so that libations may be offered to God Most High for the king and his sons[b][a], and that they may pray for them.
translation:
  language: ru
  text: чтобы Всевышнему Богу приносились возлияния[a] за царя и его сыновей и чтобы о них молились[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвенные возлияния».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение здесь эллиптично; по смыслу возможно: «молились об их благополучии» или «за их жизнь».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое значение союза и естественно вводит обе однородные формы сослагательного наклонения.
- source_word: προσφέρωνται
  choice: приносились
  rationale: Страдательная форма уместна в контексте храмового жертвоприношения и сохраняет отсутствие названного исполнителя.
- source_word: σπονδαὶ
  choice: возлияния
  rationale: Точный и принятый в русском библейском стиле термин для жидких жертвенных приношений.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: Всевышнему Богу
  rationale: Сохраняет существительное «Бог» и титул «Всевышний» в естественном русском порядке слов.
- source_word: ὑπὲρ τοῦ βασιλέως καὶ τῶν παίδων
  choice: за царя и его сыновей
  rationale: «За» естественно выражает действие в чью-либо пользу; в династическом контексте παῖδες вероятнее означает сыновей, хотя само слово допускает более широкое значение «дети».
- source_word: προσεύχωνται
  choice: молились
  rationale: Прямой и естественный эквивалент, согласованный со вторым целевым «чтобы».
- source_word: περὶ τῆς αὐτῶν
  choice: о них
  rationale: Исходная греческая фраза эллиптична; нейтральное «о них» сохраняет её отнесённость к царю и его сыновьям, не добавляя прямо не названных «благополучия» или «жизни».
theological_decisions:
- issue: Передача божественного титула ὁ ὕψιστος
  choice: Всевышний Бог
  alternative: Бог Всевышний
  rationale: Выбран обычный для современного литературного русского порядок слов; оба компонента титула сохранены без дополнительного богословского уточнения.
- issue: Содержание молитвы в эллиптическом обороте περὶ τῆς αὐτῶν
  choice: о них
  alternative: об их благополучии / за их жизнь
  rationale: Греческий текст в представленном виде не называет предмет молитвы явно. Более конкретные варианты согласуются с контекстом и параллельной традицией, но разрешают сохранённую в основном источнике недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Повтор «чтобы» проясняет координацию двух целевых действий; синтаксическая недосказанность заключительной греческой фразы отмечена в сноске, а не устранена в основном тексте.
