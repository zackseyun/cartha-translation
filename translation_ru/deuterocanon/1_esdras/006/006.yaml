review_pass:
  verdict: revise
  source_fidelity: 'Первая часть точно передаёт οὐκ ἐκωλύθησαν τῆς οἰκοδομῆς: строителям не препятствовали продолжать работу. «Пока Дарию не сообщили о них» верно отражает μέχρις οὗ ὑποσημανθῆναι Δαρείῳ περὶ αὐτῶν. Вторая часть черновика («не был получен ответ») добавляет не выраженного в греческом получателя ответа; пассив προσφωνηθῆναι безопаснее передать без указания получателя как «не был дан ответ», сохранив альтернативное более буквальное понимание в сноске.'
  naturalness: «И им не препятствовали строить» — естественно, но «Им не препятствовали строить» чуть проще и литературнее без начального союза, если стих приводится отдельно. Конструкция «пока Дарию не сообщили о них и не был дан ответ» ясна, сохраняет официальный регистр и не перегружена.
  terminology: Имя «Дарий» передано в нормативной русской форме. «Сообщили» нейтральнее, чем «донесено», и уместно для официального уведомления. «Ответ» соответствует контексту административной переписки, однако возможное значение προσφωνηθῆναι как обращения к кому-либо должно быть отмечено в сноске.
  issues:
  - severity: medium
    issue: «Не был получен ответ» вводит подразумеваемого получателя.
    rationale: Греческий пассив προσφωνηθῆναι не называет того, кем или для кого был получен ответ. Контекст допускает официальный ответ, но «получен» делает направление ответа более определённым, чем исходный текст.
  - severity: low
    issue: Сноска не вполне согласована с основным вариантом.
    rationale: Основной текст уже содержит «получен ответ», тогда как вариант сноски «не был дан ответ» фактически снимает добавленное указание на получателя. Более буквальное альтернативное значение следует сформулировать как «к ним не обратились».
  revised_text: Им не препятствовали строить, пока Дарию не сообщили о них и не был дан ответ[a].
  revised_footnotes:
  - marker: a
    text: 'Или: «и к ним не обратились». Греческий глагол может означать обращение к кому-либо; в контексте официального сообщения Дарию вероятен официальный ответ.'
