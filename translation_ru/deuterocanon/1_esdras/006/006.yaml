translation:
  language: ru
  text: Им не препятствовали строить, пока Дарию не сообщили о них и не был дан ответ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и к ним не обратились». Греческий глагол может означать обращение к кому-либо; в контексте официального сообщения Дарию вероятен официальный ответ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκωλύθησαν
  choice: им не препятствовали
  rationale: Пассивная форма κωλύω означает, что их не удерживали и не останавливали; безличная русская конструкция естественно передаёт этот смысл.
- source_word: τῆς οἰκοδομῆς
  choice: строить
  rationale: Родительный падеж после κωλύω обозначает действие, которому не препятствовали; глагольная передача звучит естественно и сохраняет процессуальный смысл.
- source_word: μέχρις οὗ
  choice: пока не
  rationale: В сочетании с отрицанием эта временная конструкция естественно передаёт предел продолжавшегося положения.
- source_word: ὑποσημανθῆναι
  choice: не было донесено
  rationale: Глагол обозначает сообщение или официальное уведомление; «донесено» уместно передаёт административный контекст и направление сообщения Дарию.
- source_word: Δαρείῳ
  choice: Дарию
  rationale: Традиционная русская форма имени в дательном падеже.
- source_word: περὶ αὐτῶν
  choice: о них
  rationale: Прямо сохраняет референциальную неоднозначность местоимения, не уточняя сверх греческого текста, идёт ли речь о строителях или обо всём деле.
- source_word: προσφωνηθῆναι
  choice: не был получен ответ
  rationale: В последовательности официального донесения и последующей реакции глагол естественно понимается как получение ответа; лексическая широта отмечена в сноске.
