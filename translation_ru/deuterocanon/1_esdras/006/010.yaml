base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/010.yaml
  text: Then we questioned these elders[a], saying[b], ‘Who commanded you to build this house and—’
translation:
  language: ru
  text: 'Тогда мы расспрашивали этих старейшин, говоря: «Кто приказал вам строить этот дом[a] и…»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «этим домом» имеется в виду храм в Иерусалиме.
    reason: cultural_note
  - marker: b
    text: Сохранившийся здесь греческий текст обрывается на слове «и», так что предложение остаётся незаконченным. Перевод сохраняет этот обрыв, не сглаживая его.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπυνθανόμεθα
  choice: мы расспрашивали
  rationale: Имперфект передаёт продолжавшееся или разворачивавшееся выяснение сведений; «расспрашивали» естественно звучит в контексте официального дознания.
- source_word: τῶν πρεσβυτέρων τούτων
  choice: этих старейшин
  rationale: πρεσβύτεροι обозначает признанных старейшин общины, а не просто пожилых мужчин.
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие сохранено близко к форме греческого текста и вводит прямой вопрос без добавления отсутствующих смысловых оттенков.
- source_word: Τίνος ὑμῖν προστάξαντος
  choice: Кто приказал вам
  rationale: Генитивная абсолютная конструкция спрашивает, от кого исходило полномочие; русский личный вопрос точно и естественно передаёт этот смысл.
- source_word: οἰκοδομεῖτε
  choice: строить
  rationale: После «приказал вам» инфинитив естественен по-русски; выбран глагол «строить», а не контекстуальное «восстанавливать», поскольку греческий прямо говорит о строительстве.
- source_word: τὸν οἶκον τοῦτον
  choice: этот дом
  rationale: «Дом» сохраняет прямое значение οἶκος и библейское обозначение храма, не подменяя исходный образ пояснением.
