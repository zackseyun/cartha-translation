  verdict: revise
  source_fidelity: 'Смысл греческого текста в целом передан верно: дорогой обработанный камень, укладываемая в строениях древесина, усердное ведение работ, успешное продвижение дела и завершение с великолепием и тщательностью. Однако заключительное «всё доводилось» сглаживает смену числа в греческом тексте: «дело» стоит в единственном числе, тогда как работы, совершаемые и завершаемые, — во множественном.'
  naturalness: 'Начальное «из дорогих тёсаных камней, с древесиной» синтаксически неровно: сочетание предлогов «из ... с ...» без общего управляющего слова воспринимается как сбой. Более естественно явно назвать использование обоих строительных материалов. «Тщанием» литературно допустимо, но в современном нейтрально-литературном русском «тщательностью» понятнее и не снижает регистр.'
  terminology: «Дорогие тёсаные камни», «древесина», «усердие», «в их руках» и «великолепие» удачно передают строительную и возвышенную лексику исходного текста. Формулировка с «великолепием» сохраняет не вполне однозначную δόξα, не навязывая исключительно значение абстрактной «славы».
