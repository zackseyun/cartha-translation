    reason: cultural_note
lexical_decisions:
- source_word: λίθων ξυστῶν πολυτελῶν
  choice: дорогих тёсаных камней
  rationale: «Тёсаные камни» естественно передаёт строительный смысл ξυστῶν как обработанного, а не необработанного камня; «дорогих» сохраняет значение πολυτελῶν.
- source_word: ξύλων τιθεμένων ἐν τοῖς οἴκοις
  choice: с древесиной, укладываемой в постройках
  rationale: ξύλων обозначает строительную древесину, τιθεμένων — её укладку или установку, а οἴκοις в данном контексте — здания или постройки, не обязательно жилые дома.
- source_word: τὰ ἔργα ἐκεῖνα ἐπὶ σπουδῆς γινόμενα
  choice: те работы велись с усердием
  rationale: σπουδή допускает значения усердия, рвения и поспешности. В отчёте о строительстве «с усердием» передаёт энергичное и старательное исполнение без ненужного оттенка небрежной спешки.
- source_word: εὐοδούμενον τὸ ἔργον ἐν ταῖς χερσὶν αὐτῶν
  choice: дело успешно продвигалось в их руках
  rationale: εὐοδούμενον выражает успешный ход или преуспевание дела; образное «в их руках» сохраняет исходную идиому и остаётся понятным по-русски.
- source_word: ἐν πάσῃ δόξῃ καὶ ἐπιμελείᾳ συντελούμενα
  choice: всё доводилось до конца со всем великолепием и тщанием
  rationale: συντελούμενα указывает на доведение работ до завершения; δόξα в архитектурном контексте означает великолепие, а ἐπιμέλεια — тщательность и заботливое внимание.
