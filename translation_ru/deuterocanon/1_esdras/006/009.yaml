  text: with costly hewn stones[a], with timber laid in the buildings, and those works being done with diligence, and the work prospering in their hands[b], being completed with all glory and care.
translation:
  language: ru
  text: с использованием дорогих тёсаных камней и древесины, укладываемой в постройках; эти работы велись с усердием[a], а само дело успешно продвигалось в их руках, и работы завершались со всяким великолепием[b] и тщательностью.
