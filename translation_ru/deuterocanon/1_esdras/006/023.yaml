base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/023.yaml
  text: In the first year of the reign of Cyrus[a], King Cyrus gave orders that the house of the Lord in Jerusalem should be built, where they offer continual sacrifices by fire,
translation:
  language: ru
  text: В первый год царствования Кира царь Кир повелел возвести дом Господа в Иерусалиме, где приносят жертвы при непрестанном огне[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «где приносят жертвы посредством непрестанного огня». Греческое выражение кратко; слово «непрестанный» непосредственно относится к «огню», но вся фраза может описывать совершаемые там постоянные огненные жертвоприношения.'
    reason: Сохранение синтаксической и лексической неоднозначности выражения διὰ πυρὸς ἐνδελεχοῦς.
lexical_decisions:
- source_word: Ἔτους πρώτου βασιλεύοντος Κύρου
  choice: В первый год царствования Кира
  rationale: Естественная русская формула датировки по году правления, точно передающая временное значение греческой конструкции.
- source_word: βασιλεὺς Κῦρος
  choice: царь Кир
  rationale: Обычный для современного литературного русского порядок титула и имени; царский титул сохранён.
- source_word: προσέταξεν
  choice: повелел
  rationale: Передаёт властное распоряжение, не уточняя сверх текста, было ли оно оформлено как официальный указ.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: дом Господа
  rationale: Сохраняет буквальный образ οἶκος, который в контексте обозначает храм; κύριος передано как «Господь».
- source_word: τὸν ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Кратко и естественно передаёт местонахождение дома.
- source_word: οἰκοδομῆσαι
  choice: возвести
  rationale: Инфинитив выражает содержание повеления; «возвести» естественно сочетается с храмовым сооружением и не добавляет прямо не выраженного значения «восстановить».
- source_word: ἐπιθύουσιν
  choice: приносят жертвы
  rationale: В данном культовом контексте глагол относится к жертвенному приношению; перевод делает это значение понятным современному читателю.
- source_word: διὰ πυρὸς ἐνδελεχοῦς
  choice: постоянно приносят жертвы в огне
  rationale: Фраза по-русски звучит естественно и передаёт идею непрерывности огненных жертвоприношений; компактность греческого допускает связь постоянства как с огнём, так и с самим совершением жертв, поэтому неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача κύριος в обозначении храма
  choice: Господь
  alternative: Владыка; ГОСПОДЬ
  rationale: Основной греческий текст содержит κύριος. «Господь» является точной и традиционной передачей без обратного восстановления еврейского божественного имени, которого непосредственно в данном греческом тексте нет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; повтор «Кира — царь Кир» сохранён вслед за греческим текстом. Конечная запятая сохранена, поскольку исходный фрагмент синтаксически продолжается в следующем стихе.
