  source_fidelity: 'Основной смысл передан верно: датировка, повтор титула «царь Кир», повеление о строительстве дома Господа в Иерусалиме и жертвенная практика сохранены. Однако «постоянно приносят жертвы в огне» грамматически относит постоянство прежде всего к действию «приносят», тогда как ἐνδελεχοῦς непосредственно определяет πυρός («непрестанного огня»).'
  naturalness: «Приносят жертвы при непрестанном огне» — естественная для современного литературного русского, достаточно ясная и более близкая к синтаксису греческого формула. Незавершённость фразы и конечная запятая оправданы тем, что это продолжение более длинного указа.
  terminology: «Царь Кир», «дом Господа» и «повелел возвести» точны по отношению к βασιλεὺς Κῦρος, τὸν οἶκον τοῦ κυρίου и προσέταξεν … οἰκοδομῆσαι. «Господь» соответствует κύριος и не навязывает реконструкцию иной формы божественного имени.
