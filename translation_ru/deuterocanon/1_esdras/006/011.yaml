base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/011.yaml
  text: So we questioned them in order to make it known to you and to write to you the names of the men who were leading them[b][a], and we asked them for the list of names of those who were at their head.
translation:
  language: ru
  text: Поэтому мы расспросили их, чтобы сообщить тебе и написать, кто те люди, которые ими руководили[a], и попросили у них именной список[b] тех, кто стоял во главе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые излагали дело». Греческое причастие допускает оттенок как руководства, так и изложения или представления сведений.'
    reason: lexical_alternative
  - marker: b
    text: То есть письменный перечень имён тех, кто стоял во главе.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπερωτήσαμεν
  choice: мы расспросили
  rationale: Глагол обозначает обращение с вопросами; «расспросили» передаёт официальный характер выяснения сведений лучше, чем нейтральное «спросили».
- source_word: ἕνεκεν τοῦ γνωρίσαι σοι
  choice: чтобы сообщить тебе
  rationale: Конструкция выражает цель; перевод естественно и ясно передаёт её в современном русском языке.
- source_word: γράψαι σοι τοὺς ἀνθρώπους
  choice: написать, кто те люди
  rationale: Буквальное «написать тебе людей» по-русски невозможно. Оборот передаёт намерение письменно указать личности ответственных людей, не вводя слово «имена» раньше, чем оно появляется в следующей части греческого текста.
- source_word: τοὺς ἀφηγουμένους
  choice: которые ими руководили
  rationale: В данном административном контексте причастие естественнее всего указывает на тех, кто возглавлял людей или работы; возможный оттенок представления дела отмечен в сноске.
- source_word: ὀνοματογραφίαν
  choice: именной список
  rationale: Редкое слово обозначает письменную запись имён или реестр; «именной список» кратко и естественно передаёт административный смысл.
- source_word: τῶν προκαθηγουμένων
  choice: тех, кто стоял во главе
  rationale: Перевод сохраняет образ людей, поставленных впереди других и руководящих ими, не сводя выражение к более общему существительному «руководители».
