base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/027.yaml
  text: And I also gave orders that it be fully rebuilt[a], and that attention be given so that they may work together with those from the captivity of Judea until the house of the Lord is finished[b];
translation:
  language: ru
  text: Я также повелел полностью отстроить его и проследить[a] за тем, чтобы они трудились вместе с людьми из иудейского плена[b], пока дом Господа не будет завершён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пристально смотреть»; здесь, вероятно, имеется в виду «проследить» или «позаботиться».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с теми, кто был уведён в плен из Иудеи». Греческое выражение буквально говорит о людях «из плена Иудеи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δὲ
  choice: Я же также
  rationale: Сохраняет присоединительное значение κἀγώ и связующую, слегка контрастивную силу δέ, не утяжеляя фразу.
- source_word: ἐπέταξα
  choice: повелел
  rationale: Передаёт властное распоряжение царя; греческий глагол сам по себе не требует более узкого значения «издал указ».
- source_word: ὁλοσχερῶς οἰκοδομῆσαι
  choice: полностью отстроить его
  rationale: ὁλοσχερῶς указывает на полноту работ, а «отстроить» естественно передаёт восстановление уже существовавшего прежде дома. Местоимение «его» восполняет подразумеваемый из контекста объект.
- source_word: ἀτενίσαι
  choice: проследить
  rationale: Буквально глагол означает пристально смотреть, но здесь, в административном распоряжении, выражает тщательный надзор и заботу об исполнении.
- source_word: ἵνα συνποιῶσιν
  choice: чтобы они трудились вместе
  rationale: Сохраняет невыраженный субъект во множественном числе и значение совместного участия, не уточняя сверх текста, кто именно обозначен местоимением «они».
- source_word: τοῖς ἐκ τῆς αἰχμαλωσίας τῆς Ἰουδαίας
  choice: с вышедшими из иудейского плена
  rationale: Передаёт исходное ἐκ и связь плена с Иудеей; формулировка остаётся понятной по-русски и не добавляет прямо не названного возвращения.
- source_word: μέχρι τοῦ ἐπιτελεσθῆναι
  choice: пока ... не будет завершён
  rationale: Естественно выражает продолжение действия вплоть до полного окончания строительства.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: дом Господа
  rationale: Сохраняет греческий образ «дома», не заменяя его толкованием «храм», и передаёт κύριος как «Господь».
theological_decisions:
- issue: Передача κύριος в выражении о храме
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основной текст греческий и содержит κύριος, а не непосредственно тетраграмматон; поэтому нейтральное «Господь» точнее источнику.
- issue: Кто обозначен подлежащим συνποιῶσιν
  choice: сохранено неопределённое «они»
  alternative: уточнить конкретную группу работников или властей
  rationale: В данном стихе подлежащее не названо, поэтому его конкретизация разрешила бы подлинную контекстуальную неоднозначность за читателя.
translation_notes:
  register: Современный литературный русский с достоинством официального царского распоряжения. Синтаксис сделан плавным, но не устранена неопределённость местоимения «они»; образ «дом Господа» сохранён вместо поясняющего «храм».
