  text: And the elders of the Jews found favor from the Lord[a], having come to oversee the captivity.
translation:
  language: ru
  text: И старейшины иудеев обрели благоволение у Господа[a], став надзирать за пленниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получив надзор над пленом (или изгнанием)». Греческое выражение сжато: слово, буквально означающее «плен» или «изгнание», может метонимически обозначать пленников либо возвратившуюся из плена общину.'
    reason: Сохраняет неоднозначность сочетания ἐπισκοπῆς γενόμενοι ἐπὶ τὴν αἰχμαλωσίαν и объясняет, почему основной текст передаёт вероятный смысл через «пленников».
lexical_decisions:
- source_word: ἔσχον χάριν
  choice: обрели благоволение
  rationale: Передаёт устойчивый смысл выражения как получение благосклонности или одобрения, а не отвлечённой «благодати».
- source_word: ἐπισκοπῆς
  choice: надзор
  rationale: Сохраняет административный оттенок существительного ἐπισκοπή и естественно звучит в данном повествовательном контексте.
- source_word: γενόμενοι ἐπὶ τὴν αἰχμαλωσίαν
  choice: приняв на себя надзор над пленением
  rationale: Передаёт вступление старейшин в положение ответственности, не создавая ложного впечатления о физическом прибытии. Необычное «пленение» оставлено в основном тексте ради лексической близости к греческому αἰχμαλωσία; возможное указание на пленников вынесено в примечание.
- source_word: παρὰ τοῦ κυρίου
  choice: у Господа
  rationale: В сочетании с русским выражением «обрести благоволение» естественная конструкция «у Господа» передаёт Господа как источник и носителя благоволения.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: старейшины иудеев
  rationale: Прямое и естественное обозначение руководителей иудейской общины.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основной греческий текст содержит κύριος; обычное русское «Господь» не подменяет греческое чтение реконструированным божественным именем.
- issue: Толкование αἰχμαλωσία
  choice: пленение
  alternative: пленники / возвратившаяся из плена община
  rationale: Буквальное значение греческого существительного сохранено в основном тексте, а вероятный метонимический смысл отмечен в сноске, поскольку синтаксис сжат и допускает неоднозначность.
