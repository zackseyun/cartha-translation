  text: I, King Darius, have decreed that this be done carefully according to these instructions.
translation:
  language: ru
  text: Я, царь Дарий, постановил, чтобы это было тщательно исполнено согласно этим предписаниям.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «согласно этим вещам». Имеются в виду изложенные выше положения указа Дария.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Я
  rationale: Эксплицитное местоимение сохранено как эмфатическое царское самообозначение в формуле указа.
- source_word: βασιλεὺς Δαρεῖος
  choice: царь Дарий
  rationale: Естественное для русского официально-повествовательного стиля сочетание титула и имени.
- source_word: δεδογμάτικα
  choice: постановил
  rationale: Перфект обозначает официально принятое решение, сохраняющее силу; «постановил» естественно передаёт язык царского указа.
- source_word: ἐπιμελῶς
  choice: тщательно
  rationale: Передаёт требование точного и заботливого исполнения, не добавляя оттенка усердия сверх исходного текста.
- source_word: κατὰ ταῦτα
  choice: согласно этим предписаниям
  rationale: Буквально выражение означает «согласно этому / этим вещам», но в контексте указа отсылает к перечисленным ранее распоряжениям.
- source_word: γίνεσθαι
  choice: чтобы всё это было исполнено
  rationale: В административном контексте инфинитив относится к осуществлению предписанных мер; «исполнено» соответствует языку указа.
