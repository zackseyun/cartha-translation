base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/015.yaml
  text: They also tore down the house and burned it[a], and they took the people captive to Babylon.
translation:
  language: ru
  text: Они также разрушили дом[a] и сожгли его, а народ увели в плен в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Божий дом — храм.
    reason: Уточнение значения слова «дом» в данном историческом контексте.
lexical_decisions:
- source_word: οἶκον
  choice: дом
  rationale: Буквально «дом»; в данном историческом контексте имеется в виду Божий дом, то есть храм. Сохранение слова «дом» передаёт греческую формулировку и библейский образ.
- source_word: καθελόντες
  choice: разрушили
  rationale: Причастие означает снести, разрушить. В сочетании с последующим сожжением «разрушили» естественно передаёт результат действия.
- source_word: ἐνεπύρισαν
  choice: сожгли
  rationale: Глагол означает предать огню, сжечь; краткий русский эквивалент точно передаёт действие.
- source_word: λαὸν
  choice: народ
  rationale: Прямое и естественное обозначение населения Иудеи и Иерусалима как единого целого.
- source_word: ᾐχμαλώτευσαν
  choice: увели в плен
  rationale: Глагол обозначает взятие в плен; «увели в плен» сохраняет образ пленения и направление последующего перемещения, не подменяя его более отвлечённым словом «переселили».
- source_word: εἰς Βαβυλῶνα
  choice: в Вавилон
  rationale: Естественная русская передача направления движения при глаголе «увели».
theological_decisions:
- issue: К чему относится слово «дом»
  choice: В основном тексте сохранено «дом», подразумевающее храм
  alternative: храм
  rationale: Греческий текст употребляет οἶκος («дом»), а не более явное слово «храм». Сноска проясняет исторический референт, не устраняя образность оригинала.
translation_notes:
  register: 'Современный литературный русский язык; повествование краткое и dignified. Союзная структура слегка упорядочена: τε передано усилительным «сам», а καί между действиями — союзом «и»; второе καί перед новой частью фразы естественно передано как «а».'
