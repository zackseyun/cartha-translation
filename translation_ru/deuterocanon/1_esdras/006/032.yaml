  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: сохранены выводное «поэтому», юссивно-импрекативная сила ἀφανίσαι, различие между царём и народом и два действия против храма. Однако настоящее «призывается» ослабляет перфект ἐπικέκληται и может создавать впечатление регулярного действия, тогда как греческая храмовая формула говорит о состоявшемся именовании/призывании имени в данном месте.'
  naturalness: «Воспрепятствовать тому дому» грамматически возможно, но для современного литературного русского заметно тяжеловесно и менее естественно, чем «помешать этому дому». Относительное «кто» после сочетания «всякого царя и всякий народ» допустимо, но «которые» яснее соотносится с обоими названными субъектами.
  terminology: «Господь» и «дом Господа» уместно сохраняют библейскую и храмовую терминологию. «Да истребит» точно передаёт силу проклятия и соответствует высокому официально-библейскому регистру. Сноска должна сохранять неоднозначность ἐπικέκληται, не выдавая богослужебное толкование за единственно возможное значение.
