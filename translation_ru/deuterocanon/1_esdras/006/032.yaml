base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/032.yaml
  text: Therefore may the Lord[a], whose name has been invoked there, destroy every king and nation that stretches out its hand to hinder or to harm that house of the Lord there in Jerusalem.
translation:
  language: ru
  text: Поэтому да истребит Господь[a], чьё имя там наречено, всякого царя и всякий народ, которые протянут руку, чтобы помешать этому дому Господа, что в Иерусалиме, или причинить ему вред.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чьё имя там призвано». Греческое выражение может более буквально передавать именование Божьего имени в этом месте; оно также допускает понимание, связанное с призыванием Божьего имени в богослужении.'
    reason: Лексическая неоднозначность храмовой формулы ἐπικέκληται.
lexical_decisions:
- source_word: διὰ ταῦτα
  choice: Поэтому
  rationale: Передаёт вывод или следствие, вводящее заключительное проклятие царского постановления.
- source_word: ὁ κύριος
  choice: Господь
  rationale: В данном контексте обозначает Бога Израиля; традиционное и ясное русское соответствие κύριος.
- source_word: οὗ τὸ ὄνομα αὐτοῦ ἐπικέκληται ἐκεῖ
  choice: чьё имя призывается там
  rationale: Передаёт связь имени Бога с местом богослужения и возможный смысл призывания имени, не подменяя греческую формулу более определённым выражением о пребывании имени.
- source_word: ἀφανίσαι
  choice: да истребит
  rationale: Инфинитив в контексте постановления имеет характер пожелания-проклятия; конструкция с «да» естественно передаёт оптативно-юссивную силу и сохраняет строгость суда.
- source_word: πάντα βασιλέα καὶ ἔθνος
  choice: всякого царя и всякий народ
  rationale: Сохраняет распределительное значение πάντα и различие между отдельным правителем и народом.
- source_word: ὃς ἐκτενεῖ χεῖρα αὐτοῦ
  choice: кто протянет руку
  rationale: Сохраняет библейский образ в единственном числе и естественно связывает его с каждым из двух возможных нарушителей.
- source_word: κωλῦσαι
  choice: воспрепятствовать
  rationale: Подходит к юридико-административному контексту попытки помешать существованию или деятельности храма.
- source_word: κακοποιῆσαι
  choice: причинить ему вред
  rationale: Передаёт широкий смысл враждебного действия, не ограничивая его только физическим разрушением.
- source_word: τὸν οἶκον Κυρίου ἐκεῖνον τὸν ἐν Ἰερουσαλήμ
  choice: тому дому Господа, что в Иерусалиме
  rationale: Сохраняет храмовое наименование «дом Господа», указательное значение ἐκεῖνον и местонахождение в Иерусалиме.
theological_decisions:
- issue: Формула о Божьем имени при храме
  choice: чьё имя призывается там
  alternative: чьё имя наречено там
  rationale: Основной вариант ясно выражает богослужебное призывание имени и его связь с храмом, а сноска сохраняет более буквальную и неоднозначную возможность понимания греческой формы.
- issue: Модальность ἀφανίσαι в царском постановлении
  choice: да истребит Господь
  alternative: Господь истребит
  rationale: Греческий инфинитив здесь выражает проклятие или волеизъявление, а не однозначное предсказание будущего; форма с «да» сохраняет эту модальную напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского постановления. Конструкция «да истребит» сохраняет торжественный характер проклятия, оставаясь понятной современному читателю; библейский образ протянутой руки и наименование «дом Господа» сохранены.
