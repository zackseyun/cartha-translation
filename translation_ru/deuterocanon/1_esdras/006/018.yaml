base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/018.yaml
  text: And he was commanded to bring back all these vessels[a], to put them in the temple in Jerusalem, and that the temple of the Lord should be built on its site.
translation:
  language: ru
  text: Ему было велено вернуть все эти сосуды[a], поместить их в храме в Иерусалиме, а храм Господа должен был быть построен на том месте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая форма может быть понята и как сообщение о совершённом действии: «Ему было велено, и он принёс обратно все эти сосуды, чтобы поместить их…». Форма глагола ἀπήνεγκεν буквально имеет значение «он принёс/отнёс», хотя в контексте её также понимают как содержание данного ему повеления.'
    reason: Сохранение грамматической неоднозначности формы ἀπήνεγκεν.
lexical_decisions:
- source_word: ἐπετάγη αὐτῷ
  choice: ему было велено
  rationale: Пассивная конструкция передаёт официальный характер распоряжения и не называет того, кто его отдал.
- source_word: ἀπήνεγκεν
  choice: вернуть
  rationale: По контексту речь идёт о возвращении ранее вывезенных храмовых сосудов в Иерусалим. Форма в греческом тексте буквально является аористом изъявительного наклонения («он отнёс/принёс»), однако в данной синтаксической связи естественно воспринимается как содержание повеления; неоднозначность отмечена в сноске.
- source_word: σκεύη
  choice: сосуды
  rationale: В контексте храмового имущества «сосуды» — традиционное и понятное обозначение культовых принадлежностей.
- source_word: ἀποθεῖναι
  choice: поместить
  rationale: Инфинитив означает положить или установить предметы в предназначенном месте; «поместить» звучит естественно и сохраняет нейтральность.
- source_word: ναός
  choice: храм
  rationale: В данном контексте речь идёт об Иерусалимском храме; «храм» — ясный современный русский эквивалент.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Передаёт обычное в Септуагинте обозначение Бога Израиля и соответствует русской библейской традиции.
- source_word: οἰκοδομηθῆναι
  choice: построить
  rationale: Греческий пассивный инфинитив буквально обозначает строительство; «восстановить» возможно по контексту, но прямо формой глагола не выражено.
- source_word: ἐπὶ τοῦ τόπου
  choice: на прежнем месте
  rationale: Выражение указывает на место, где храм должен быть возведён вновь. «На прежнем месте» естественно по-русски передаёт этот локативный смысл в контексте восстановления храма.
theological_decisions:
- issue: Передача κύριος в выражении о храме Бога Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» соответствует устойчивому русскому библейскому употреблению и не вносит дополнительного конфессионального толкования.
- issue: Строительство или восстановление храма
  choice: построить
  alternative: восстановить
  rationale: Выбрано более формальное соответствие οἰκοδομηθῆναι; исторический смысл повторного возведения остаётся понятен из выражения «на прежнем месте».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён по сравнению с буквальным греческим соединением клауз, но официальный характер повеления и неоднозначность глагольной формы сохранены.
