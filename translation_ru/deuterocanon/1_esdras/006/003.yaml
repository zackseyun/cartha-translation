base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/003.yaml
  text: At that time Sisinnes[a], the governor of Syria and Phoenicia, was present with them, along with Sathrabuzanes and his associates; and he said to them,
translation:
  language: ru
  text: 'В то время у них был Сисинн, правитель Сирии и Финикии, вместе с Сатравузаном и их спутниками; и он[a] сказал им:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте глагол «сказал» стоит в единственном числе. Вероятнее всего, говорит Сисинн как главное из названных должностных лиц, хотя рядом с ним упомянуты Сатравузан и их спутники.
    reason: Сохраняет грамматическое единственное число и отмечает некоторую неоднозначность того, кто именно является говорящим.
lexical_decisions:
- source_word: ἐν αὐτῷ τῷ χρόνῳ
  choice: В то время
  rationale: Естественное современное соответствие устойчивому временному обороту; αὐτῷ здесь не требует усилительного «в то самое время».
- source_word: παρῆν πρὸς αὐτούς
  choice: у них находился
  rationale: παρῆν обозначает присутствие, а не обязательно прибытие; сочетание «у них находился» естественно передаёт присутствие при названной группе.
- source_word: Σισίννης
  choice: Сисинн
  rationale: Передача греческого имени в форме, укоренившейся в русской библейской традиции.
- source_word: ὁ ἔπαρχος
  choice: правитель
  rationale: Понятное широкому читателю обозначение областного должностного лица; оно не навязывает более узкий и потенциально анахроничный титул.
- source_word: Συρίας καὶ Φοινίκης
  choice: Сирии и Финикии
  rationale: Родительный падеж естественно обозначает территории, находившиеся в ведении правителя.
- source_word: Σαθραβουζάνης
  choice: Сатравузан
  rationale: Имя передано непосредственно по греческой форме с русским морфологическим оформлением.
- source_word: οἱ συνέταιροι
  choice: их приближёнными
  rationale: В административном контексте слово обозначает сопровождающих или связанных с должностными лицами людей. Местоимение «их» естественно относит группу к двум названным лицам, не уточняя их должности.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: и он сказал им
  rationale: Единственное число εἶπεν сохранено; местоимение делает эту форму ясной по-русски, не превращая её во множественное число.
