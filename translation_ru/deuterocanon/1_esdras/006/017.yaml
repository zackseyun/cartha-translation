base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/017.yaml
  text: And the holy vessels[a], the gold and the silver ones, which Nebuchadnezzar had carried out from the house in Jerusalem and deposited in his own temple—Cyrus the king again brought them out from the temple in Babylon, and they were handed over to Zerubbabel and to Sanabassar the governor.
translation:
  language: ru
  text: А священные сосуды — золотые и серебряные, которые Навуходоносор вынес из дома в Иерусалиме и поместил в своём храме, — царь Кир снова вынес из храма в Вавилонии, и они были переданы Зоровавелю и правителю Сабанассару[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. Σαβανασσάρ («Сабанассар»); вероятно, это имя соответствует имени Шешбацар в книге Ездры.
    reason: Указывает альтернативную, более известную форму имени из параллельной традиции, сохраняя в основном тексте чтение греческого источника.
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: священные сосуды
  rationale: Передаёт культовую посвящённость предметов и конкретное значение σκεύη, не уточняя их форму сверх греческого текста.
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ
  choice: золотые и серебряные
  rationale: Субстантивированные прилагательные отнесены к слову «сосуды»; русское согласование естественно сохраняет две категории.
- source_word: ἐξήνεγκεν
  choice: вынес / снова вынес
  rationale: Глагол обозначает вынесение наружу; повтор πάλιν при втором употреблении передан словом «снова».
- source_word: οἴκου τοῦ ἐν Ἰερουσαλήμ
  choice: дома в Иерусалиме
  rationale: Сохраняет буквальное «дом» и отличие οἶκος от последующего ναός, хотя по контексту речь идёт о храме.
- source_word: ἀπηρείσατο
  choice: поместил
  rationale: Естественно передаёт намеренное размещение сосудов в храме, не добавляя отсутствующей в тексте идеи хранения в сокровищнице.
- source_word: ἐν τῷ αὐτοῦ ναῷ
  choice: в своём храме
  rationale: Передаёт ναός и подчёркнутую притяжательность αὐτοῦ.
- source_word: πάλιν
  choice: снова
  rationale: Сохраняет значение повторного, обратного вынесения сосудов.
- source_word: τοῦ ναοῦ τοῦ ἐν Βαβυλωνίᾳ
  choice: из храма в Вавилонии
  rationale: Βαβυλωνία формально обозначает Вавилонию; перевод не сужает название области до города Вавилона.
- source_word: παρεδόθη
  choice: они были переданы
  rationale: Пассивная форма и официальный характер передачи сохранены; множественное согласование следует смыслу собирательного подлежащего.
- source_word: Ζοροβαβὲλ
  choice: Зоровавелю
  rationale: Употреблена привычная русская библейская форма имени, соответствующая семитскому имени и греческому Ζοροβαβέλ.
- source_word: Σαβανασσάρῳ
  choice: Саванассару
  rationale: Основной текст следует греческой форме имени, не подменяя её гармонизированной формой из Ездры.
- source_word: τῷ ἐπάρχῳ
  choice: правителю
  rationale: Ясный современный эквивалент должностного титула ἔπαρχος; расположение после имени отражает греческую аппозицию.
theological_decisions:
- issue: Различие храмовой терминологии οἶκος и ναός
  choice: Для иерусалимского святилища — «дом», для вавилонского — «храм»
  alternative: В обоих случаях «храм»
  rationale: Различие лексем в греческом тексте сохранено, хотя «дом» здесь по контексту означает храм; это не сглаживает исходную формулировку.
- issue: Форма имени Σαβανασσάρ
  choice: Саванассар в основном тексте
  alternative: Шешбацар в основном тексте
  rationale: Для 1 Ездры первичным свидетелем является греческий текст; вероятное соответствие более известному имени отмечено в сноске без молчаливой гармонизации.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка упрощён ради ясности, но сохранены длинная относительная конструкция, пассивная передача сосудов и различие «дом/храм». Маркер сноски поставлен при «священные сосуды» согласно предоставленному консультационному слою, хотя сама сноска относится к имени Саванассара.
