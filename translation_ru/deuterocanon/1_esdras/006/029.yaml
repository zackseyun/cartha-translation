  text: Likewise also wheat and salt and wine and oil continually year by year[a], as the priests in Jerusalem may direct, are to be used up day by day without dispute,
translation:
  language: ru
  text: Также пшеницу, соль, вино и оливковое масло следует постоянно, из года в год, расходовать изо дня в день, как укажут священники в Иерусалиме, без возражений[a].
