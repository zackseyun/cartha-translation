    reason: lexical_alternative
lexical_decisions:
- source_word: πυρὸν
  choice: пшеница
  rationale: Здесь форма от πυρός обозначает именно пшеницу как конкретный вид припасов, а не зерно вообще.
- source_word: ἅλα
  choice: соль
  rationale: Прямое и естественное обозначение соли как одного из храмовых припасов.
- source_word: οἶνον
  choice: вино
  rationale: Обычное значение слова в перечне припасов для богослужения.
- source_word: ἔλαιον
  choice: масло
  rationale: В данном контексте имеется в виду оливковое масло; в русском библейском перечне достаточно естественного слова «масло».
- source_word: ἐνδελεχῶς
  choice: бесперебойно
  rationale: Передаёт требование постоянного, непрерывающегося снабжения и естественно сочетается с выражениями «из года в год» и «изо дня в день».
- source_word: κατʼ ἐνιαυτόν
  choice: из года в год
  rationale: Сохраняет распределительное значение греческого оборота и повторяемость снабжения ежегодно.
- source_word: ὑπαγορεύσωσιν
  choice: как укажут
  rationale: Глагол означает дать указание или определить требуемое; формулировка сохраняет за иерусалимскими священниками право устанавливать необходимое.
- source_word: ἀναλίσκεσθαι
  choice: расходоваться
  rationale: В контексте храмовых припасов речь идёт об их использовании и исчерпании; «расходоваться» не ограничивает смысл употреблением в пищу.
- source_word: καθʼ ἡμέραν
  choice: изо дня в день
  rationale: Передаёт распределительный характер оборота и регулярность ежедневного использования.
- source_word: ἀναμφισβητήτως
  choice: без возражений
  rationale: Сохраняет прямой оттенок отсутствия спора или оспаривания в административном распоряжении, не устраняя возможный смысл неукоснительного исполнения.
