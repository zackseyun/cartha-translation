    issue: Неуточнённое «масло»
    rationale: В современном русском «масло» нередко прежде всего воспринимается как сливочное; греческое ἔλαιον в данном перечне означает оливковое масло.
  - severity: low
    issue: Неестественная предписательная конструкция «должны ... расходоваться»
    rationale: Она делает припасы субъектом собственного расходования и осложняется согласованием однородного перечня. Безличное «следует расходовать» точнее и естественнее передаёт предписание.
