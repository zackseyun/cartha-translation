base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/016.yaml
  text: In the first year of Cyrus reigning over the land of Babylonia, King Cyrus wrote that this house should be built,
translation:
  language: ru
  text: В первый год царствования Кира над Вавилонией царь Кир написал[a], что этот дом[b] должен быть построен,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царь Кир издал указ, чтобы этот дом был построен». Буквально по-гречески: «написал построить этот дом»; в данном контексте речь идёт о письменном царском распоряжении.'
    reason: lexical_alternative
  - marker: b
    text: «Этот дом» — храм в Иерусалиме.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ πρώτῳ ἔτει
  choice: В первый год
  rationale: Предлог ἐν с дательным обозначает время; слабая связка δέ не требует отдельного противительного союза в русском тексте.
- source_word: βασιλεύοντος Κύρου χώρας Βαβυλωνίας
  choice: царствования Кира над Вавилонской землёй
  rationale: Родительный самостоятельный оборот передан временной именной конструкцией; χώρα означает страну или территорию, а не только город Вавилон.
- source_word: ἔγραψεν
  choice: написал
  rationale: Сохранено прямое значение греческого глагола «написал»; административный смысл царского письменного распоряжения пояснён в сноске.
- source_word: βασιλεὺς Κῦρος
  choice: царь Кир
  rationale: Естественный для русского языка порядок титула и имени.
- source_word: οἰκοδομῆσαι
  choice: что ... должен быть построен
  rationale: Инфинитив после ἔγραψεν передаёт содержание письменного распоряжения; русская придаточная конструкция естественно выражает требуемое действие.
- source_word: τὸν οἶκον τοῦτον
  choice: этот дом
  rationale: Сохранено буквальное значение οἶκος и библейский образ дома; храмовый референт указан в сноске.
theological_decisions:
- issue: К чему относится выражение «этот дом»
  choice: В основном тексте сохранено «этот дом».
  alternative: этот храм
  rationale: Греческий текст употребляет οἶκος; контекст указывает на Иерусалимский храм, но перевод не заменяет исходный образ пояснением.
- issue: Сила царского письменного действия
  choice: Употреблено простое «написал».
  alternative: издал указ
  rationale: Контекст предполагает официальное распоряжение, однако греческий текст прямо говорит лишь «написал»; более административное прочтение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Формулировка сохраняет повтор имени Кира и образ «дома» из греческого текста; конечная запятая показывает продолжение предложения в следующем стихе.
