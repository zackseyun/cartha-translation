base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/012.yaml
  text: But they answered us[a], saying, “We are servants of the Lord, who created heaven and earth.”
translation:
  language: ru
  text: 'Но они ответили нам: «Мы — слуги Господа, сотворившего небо и землю».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мы — дети Господа, сотворившего небо и землю». Греческое слово может означать и «детей», и «слуг»; в данном контексте вероятнее значение «слуги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν ἡμῖν λέγοντες
  choice: они ответили нам
  rationale: Естественная русская передача повествовательной формулы; отдельное «говоря» избыточно, поскольку содержание ответа непосредственно следует далее.
- source_word: παῖδες
  choice: слуги
  rationale: Слово может означать как «дети», так и «слуги»; в контексте официального ответа строителей речь, вероятнее всего, об их принадлежности Господу и служении Ему.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Традиционная и контекстуально уместная передача κύριος применительно к Богу.
- source_word: τοῦ κτίσαντος
  choice: сотворившего
  rationale: Причастная конструкция точно и естественно передаёт греческое определение Господа через Его творческое деяние.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: небо и землю
  rationale: Устойчивая библейская формула, обозначающая весь сотворённый мир.
theological_decisions:
- issue: Значение παῖδες по отношению к Господу
  choice: слуги
  alternative: дети
  rationale: Административно-правовой контекст поддерживает значение служения и принадлежности Богу, однако лексическая неоднозначность сохранена в примечании.
- issue: Передача κύριος применительно к Богу
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет привычное библейское звучание и не привносит дополнительного смыслового оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Тире после «мы» подчёркивает самоопределение говорящих; формула «небо и землю» сохранена без артиклевых добавлений.
