base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/031.yaml
  text: And issue an order that if anyone transgresses any part of what has been written and nullifies it[a], a beam shall be taken from his own property and he shall be hanged on it, and his possessions shall become royal property.
translation:
  language: ru
  text: И распорядиться, чтобы, если кто-нибудь нарушит что-либо из написанного и отменит это, из его собственного имущества взяли бревно и повесили его на нём[a], а всё его имущество стало царской собственностью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвесили его на нём». Греческий глагол означает «повесить» или «подвесить». В древнем карательном контексте иногда допускают также насаживание на деревянный столб или публичное выставление на деревянной конструкции, но точный способ здесь не уточнён.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάξαι
  choice: повелеть
  rationale: Инфинитив продолжает распорядительную формулу и передаёт официальный характер царского предписания.
- source_word: παραβῶσίν τι τῶν γεγραμμένων
  choice: нарушит что-нибудь из написанного
  rationale: Сохраняет юридический смысл παραβαίνω и партитивную конструкцию τι τῶν γεγραμμένων без чрезмерного уточнения.
- source_word: ἀκυρώσωσιν
  choice: отменит это
  rationale: Передаёт значение лишения написанного постановления силы; местоимение соотнесено с нарушенной письменной нормой.
- source_word: λημφθῆναι ξύλον
  choice: пусть ... возьмут бревно
  rationale: ξύλον здесь естественно понимать как деревянный брус или бревно, используемое для наказания.
- source_word: ἐκ τῶν ἰδίων αὐτοῦ
  choice: из его собственного имущества
  rationale: Греческая фраза шире, чем «из его дома», поэтому перевод не вносит отсутствующего в основном источнике уточнения.
- source_word: κρεμασθῆναι
  choice: повесят его
  rationale: Прямо передаёт значение «повесить/подвесить», не определяя точный древний способ казни; возможные оттенки указаны в сноске.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: всё его достояние
  rationale: Обозначает совокупность принадлежащего человеку имущества и естественно звучит в торжественно-правовом контексте.
- source_word: βασιλικά
  choice: царской собственностью
  rationale: Передаёт переход конфискованного имущества в собственность царя.
theological_decisions:
- issue: Точный характер наказания, выраженного κρεμασθῆναι
  choice: повесят его на нём
  alternative: посадят его на него; подвешенным на нём
  rationale: Греческий глагол непосредственно означает повешение или подвешивание, тогда как исторический контекст допускает посажение на кол либо публичное выставление тела. Основной текст сохраняет прямое значение, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным правовым звучанием. Синтаксис сохраняет форму официального повеления; архаизмы сведены к минимуму.
