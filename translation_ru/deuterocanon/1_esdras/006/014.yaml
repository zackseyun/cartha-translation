base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/014.yaml
  text: And because our fathers[a], having provoked him, sinned against the Lord of Israel, the heavenly One, he gave them into the hands of Nebuchadnezzar king of Babylon, king of the Chaldeans;
translation:
  language: ru
  text: И поскольку наши отцы, прогневав Его, согрешили против Господа Израиля, Небесного[a], Он предал их в руки Навуходоносора, царя Вавилона, царя халдеев;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бога небесного». В греческом тексте буквально стоит «Небесного», тогда как в родственной традиции книги Ездры часто употребляется более полный титул «Бог небесный».'
    reason: Указывает возможную передачу необычного греческого божественного титула, не заменяя ею основной текст.
lexical_decisions:
- source_word: ἐπεὶ
  choice: поскольку
  rationale: Союз вводит причину последовавшего суда и естественно передаётся по-русски причинным «поскольку».
- source_word: οἱ πατέρες ἡμῶν
  choice: наши отцы
  rationale: Сохраняет семейно-исторический образ исходного текста и его торжественный оттенок; «предки» было бы возможно, но менее буквально.
- source_word: παραπικράναντες
  choice: прогневав Его
  rationale: Причастие обозначает действие, вызвавшее Божий гнев или ожесточённое противление Ему. «Прогневав Его» естественно и кратко передаёт смысл, не вводя отдельного глагола «восстали».
- source_word: ἥμαρτον εἰς
  choice: согрешили против
  rationale: При ἁμαρτάνω предлог εἰς обозначает направленность проступка против кого-либо; русское сочетание передаёт это идиоматично.
- source_word: τὸν κύριον τοῦ Ἰσραήλ
  choice: Господа Израиля
  rationale: Следует греческому тексту, где сказано именно «Господь Израиля», без добавления слова «Бог».
- source_word: τὸν οὐράνιον
  choice: Небесного
  rationale: Субстантивированное прилагательное стоит в приложении к «Господу Израиля». Такая передача сохраняет необычную форму греческого текста и не подменяет её более полным титулом «Бог небесный».
- source_word: παρέδωκεν αὐτοὺς εἰς χεῖρας
  choice: предал их в руки
  rationale: Сохраняет обычную библейскую идиому передачи во власть врага и ясно выражает судебный характер действия.
- source_word: Ναβουχοδονοσόρ
  choice: Навуходоносора
  rationale: Использована устоявшаяся русская форма имени вавилонского царя.
- source_word: βασιλέως Βαβυλῶνος, βασιλέως τῶν Χαλδαίων
  choice: царя Вавилона, царя халдеев
  rationale: Сохранены оба повторяющихся царских титула и их приложение, как в греческом источнике.
theological_decisions:
- issue: Божественный титул τὸν οὐράνιον при «Господе Израиля»
  choice: Небесного
  alternative: Бога небесного
  rationale: Основной текст следует греческому свидетельству, в котором стоит субстантивированное прилагательное «Небесный», а не полное выражение «Бог небесный». Альтернатива отмечена в сноске ввиду родственной традиции Ездры.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — точное и общепринятое русское соответствие в данном божественном титуле; контекст не требует иной передачи.
- issue: Причинная связь греха и предания во власть Вавилона
  choice: сохранена прямой грамматической связью «поскольку… Он предал»
  alternative: ослабить связь последовательным «когда… тогда»
  rationale: ἐπεί здесь указывает на основание суда. Перевод сохраняет утверждаемую текстом причинность, не добавляя объяснений о её богословском механизме.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «царя… царя…» намеренно сохранён. Местоимения, относящиеся к Богу, написаны с прописной буквы для ясности референции и в соответствии с распространённой русской библейской издательской практикой.
