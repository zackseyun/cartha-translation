base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/019.yaml
  text: Then Sanabassar came and laid the foundations of the house of the Lord in Jerusalem[a], and from that time until now it has been under construction and has not reached completion.
translation:
  language: ru
  text: Тогда Санабассар пришёл и заложил основание дома Господа в Иерусалиме[a]; с того времени и доныне дом строится, но строительство ещё не завершено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Санабассара обычно отождествляют с Шешбацаром, упоминаемым в книге Ездры.
    reason: Альтернативная форма имени и распространённое отождествление в параллельной традиции.
lexical_decisions:
- source_word: Σαναβάσσαρος
  choice: Санабассар
  rationale: Имя передано транслитерацией непосредственно с греческой формы; традиционное отождествление с Шешбацаром отмечено в сноске, а не внесено в основной текст.
- source_word: παραγενόμενος
  choice: пришёл
  rationale: Причастие обозначает прибытие, предшествующее закладке основания; «пришёл» естественно и точно передаёт последовательность действий.
- source_word: εἰσεβάλλετο τοὺς θεμελίους
  choice: заложил основание
  rationale: В строительном контексте глагол с существительным означает закладку основания. Русское единственное число идиоматично для основания здания, хотя греческое существительное стоит во множественном числе.
- source_word: τοῦ οἴκου Κυρίου
  choice: дома Господа
  rationale: Сохранён библейский образ «дом Господа» без поясняющей замены на «храм».
- source_word: ἀπ᾽ ἐκείνου μέχρι τοῦ νῦν
  choice: с того времени и доныне
  rationale: Передана непрерывность периода от начала строительства до времени речи; «доныне» поддерживает достоинство библейского регистра и остаётся понятным.
- source_word: οἰκοδομουμένου
  choice: дом строится
  rationale: Пассивное причастие настоящего времени передаёт продолжающийся процесс; явное «дом» устраняет возможную неясность русского местоимения.
- source_word: οὐκ ἔλαβεν συντέλειαν
  choice: строительство ещё не завершено
  rationale: Греческое выражение буквально говорит, что дело не достигло завершения. Естественная русская формулировка сохраняет результативный смысл; «ещё» ясно связывает его с продолжающимся строительством.
theological_decisions:
- issue: Передача Κυρίου в выражении о храме
  choice: Господа
  alternative: ГОСПОДА
  rationale: Основным источником служит греческий текст с Κυρίου. Поэтому не вводится графическое обозначение тетраграмматона, основанное на предполагаемом семитском фоне.
- issue: Идентичность Санабассара
  choice: В основном тексте сохранено имя Санабассар
  alternative: Шешбацар
  rationale: Греческий свидетель прямо называет Σαναβάσσαρος. Распространённое отождествление с Шешбацаром вероятно, но не должно подменять форму первичного текста и потому вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранено выражение «дом Господа»; синтаксис упрощён ради ясности, а продолжающееся и всё ещё незавершённое строительство выражено двумя согласованными частями.
