base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/002.yaml
  text: Then Zerubbabel son of Salathiel and Jeshua son of Josedek stood up and began to build the house of the Lord in Jerusalem[a], while the prophets of the Lord were with them[c][b], helping them.
translation:
  language: ru
  text: Тогда Зоровавель, сын Салафииля, и Иисус, сын Иоседека, поднялись[a] и начали строить дом Господа в Иерусалиме; пророки Господа были с ними и помогали им[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встали». Греческое причастие может обозначать как буквальное вставание, так и решительное начало действия.'
    reason: lexical_alternative
  - marker: b
    text: В параллельном семитском повествовании среди пророков названы Аггей и Захария; здесь греческий текст говорит о них обобщенно — «пророки Господа». Иисус в этом стихе — послепленный первосвященник, сын Иоседека, а не Иисус Христос.
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественная повествовательная связка, обозначающая последовательность событий.
- source_word: στάς
  choice: поднялись
  rationale: Единственное число греческого причастия при первом имени по смыслу охватывает обоих деятелей; русский перевод согласован с составным подлежащим. «Поднялись» сохраняет как конкретный образ, так и идиоматический смысл решительного начала действия.
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιὴλ
  choice: Зоровавель, сын Салафииля
  rationale: Использованы устоявшиеся русские библейские формы имен, при этом форма Салафиил соответствует греческому Σαλαθιήλ.
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδὲκ
  choice: Иисус, сын Иоседека
  rationale: В русской библейской традиции Ἰησοῦς передается как «Иисус» и для послепленного первосвященника; отчество следует греческой форме Ἰωσεδέκ.
- source_word: ἤρξαντο οἰκοδομεῖν
  choice: начали строить
  rationale: Прямо и естественно передает начинательное значение глагола с инфинитивом.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: дом Господа
  rationale: Сохраняет исходную храмовую метафору «дом», не заменяя ее пояснительным словом «храм».
- source_word: τὸν ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Естественно передает определительную фразу, указывающую местонахождение дома.
- source_word: συνόντων τῶν προφητῶν τοῦ κυρίου
  choice: пророки Господа были с ними
  rationale: Генитив абсолютный передан отдельной сопутствующей конструкцией; сохранено общее обозначение пророков без внесения имен из параллельного текста.
- source_word: βοηθούντων αὐτοῖς
  choice: помогали им
  rationale: Передает продолжающееся содействие ясным современным русским выражением.
theological_decisions:
- issue: Передача κυρίου в храмовом контексте
  choice: Господа
  alternative: Владыки; ГОСПОДА
  rationale: Греческое κυρίου обычно и естественно передается как «Господа»; написание капителью необязательно, поскольку первичным источником здесь служит греческий текст.
- issue: Соотношение греческого текста и масоретской параллели
  choice: Сохранено общее выражение «пророки Господа»
  alternative: Добавить имена Аггея и Захарии
  rationale: Греческий первичный текст не называет пророков по именам. Параллельное семитское свидетельство подтверждает исторический контекст, но не дает основания вносить отсутствующие имена в основной текст.
- issue: Личность Ἰησοῦς в послепленном контексте
  choice: Иисус, сын Иоседека
  alternative: Иешуа, сын Иоседека
  rationale: Устоявшаяся русская библейская форма сохраняет связь с греческим именем; примечание предотвращает смешение с Иисусом Христом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощен без потери последовательности и сопутствующего характера действий; устоявшиеся русские библейские формы имен сохранены.
