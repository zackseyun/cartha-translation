base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/008.yaml
  text: 'Let everything be known to our lord the king: when we came into the land of Judea and to Jerusalem[a], the city, we found the elders of the captivity of the Jews in Jerusalem, the city, building a great new house for the Lord[b],'
translation:
  language: ru
  text: 'Да будет известно нашему господину царю обо всём: прибыв в землю Иудеи и в город Иерусалим, мы застали в городе Иерусалиме старейшин иудеев из числа пленных[a], строивших для Господа большой новый дом[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «старейшин иудеев плена». Греческое выражение сжато; оно связывает старейшин иудеев с пленом или пленённой общиной.'
    reason: lexical_alternative
  - marker: b
    text: «Дом для Господа» означает храм.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα γνωστὰ ἔστω
  choice: Да будет обо всём известно
  rationale: Передаёт формульный характер донесения и сохраняет побудительную форму ἔστω; по-русски звучит официально и естественно.
- source_word: τῷ κυρίῳ ἡμῶν τῷ βασιλεῖ
  choice: нашему господину царю
  rationale: Здесь κύριος — почтительный придворный титул персидского царя, а не обозначение Бога.
- source_word: παραγενόμενοι
  choice: прибыв
  rationale: Деепричастие естественно передаёт временное обстоятельство, выраженное греческим причастием.
- source_word: εἰς τὴν χώραν τῆς Ἰουδαίας
  choice: в землю Иудеи
  rationale: χώρα обозначает землю или область; перевод не навязывает более узкого административного значения.
- source_word: καὶ Ἰερουσαλὴμ τὴν πόλιν
  choice: и в город Иерусалим
  rationale: Сохраняет дополнительное направление движения и аппозиционное указание на город, избегая неестественного русского повтора.
- source_word: κατελάβομεν
  choice: мы застали
  rationale: В данном контексте глагол означает, что прибывшие обнаружили людей за определённым занятием, а не захватили их.
- source_word: τῆς αἰχμαλωσίας τοὺς πρεσβυτέρους τῶν Ἰουδαίων
  choice: старейшин иудеев, вернувшихся из плена
  rationale: Греческое сочетание сжато и буквально связывает старейшин иудеев с пленом; контекст восстановленной общины позволяет передать подразумеваемое возвращение, а буквальная структура отмечена в сноске.
- source_word: οἰκοδομοῦντας οἶκον
  choice: которые строили ... дом
  rationale: Сохраняет буквальное «дом», не заменяя его в основном тексте толкованием «храм», и ясно связывает действие со старейшинами.
- source_word: τῷ κυρίῳ
  choice: для Господа
  rationale: Здесь κύριος относится к Богу Израиля; прописная буква отличает это употребление от придворного титула царя.
- source_word: μέγαν καινόν
  choice: большой новый
  rationale: Прямо передаёт оба определения без усилительного толкования вроде «величественный».
theological_decisions:
- issue: 'Два употребления κύριος в одном стихе: о персидском царе и о Боге Израиля'
  choice: «господину» о царе и «Господа» о Боге
  alternative: «владыке» или «повелителю» о царе и «Господа» о Боге
  rationale: Единый русский корень сохраняет лексическую связь, тогда как регистр и прописная буква ясно различают референтов.
- issue: Значение οἶκος в выражении о Божьем доме
  choice: Сохранить «дом» в основном тексте и пояснить, что имеется в виду храм
  alternative: Перевести непосредственно как «храм»
  rationale: Так сохраняется образность исходного слова и одновременно предотвращается непонимание исторического смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством официального донесения. Начальная формула слегка возвышенна, но понятна; повтор упоминания Иерусалима сохранён, поскольку он присутствует в греческом тексте. Различие между человеческим титулом и именованием Бога обозначено строчной и прописной буквами.
