base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/024.yaml
  text: Let them offer sacrifices with continual fire, whose height is sixty cubits and width sixty cubits, with three courses of polished stone and one course of new local timber; and let the expense be given from the house of Cyrus the king.
translation:
  language: ru
  text: Пусть они приносят жертвы при непрестанном огне. Высота его[a] — шестьдесят локтей, и ширина — шестьдесят локтей; три ряда должны быть из тёсаного камня, а один ряд — из новой местной древесины. Расходы же пусть оплачиваются из дома царя Кира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «высота которого». Греческий текст здесь грамматически неясен; судя по размерам и последующему описанию кладки, речь, вероятно, идёт о храме или здании.'
    reason: Сохраняет заметную неоднозначность исходного греческого текста и не вводит подразумеваемый референт в основной текст как бесспорный.
lexical_decisions:
- source_word: θύουσιν
  choice: пусть они приносят жертвы
  rationale: Передаёт жертвенный смысл θύω и сохраняет предписывающую силу контекста.
- source_word: διὰ πυρὸς ἐνδελεχοῦς
  choice: при непрестанном огне
  rationale: Естественно передаёт идею постоянно поддерживаемого огня, не превращая огонь в самостоятельный вид жертвы.
- source_word: δόμων
  choice: рядов
  rationale: В строительном контексте обозначает горизонтальные ряды кладки или строительного материала.
- source_word: λιθίνων ξυστῶν
  choice: из тёсаного камня
  rationale: ξυστός указывает на обработанный, обтёсанный камень; это ясная современная строительная формулировка.
- source_word: ξυλίνου ἐγχωρίου καινοῦ
  choice: из новой местной древесины
  rationale: 'Сохраняет все три характеристики: материал, местное происхождение и новизну.'
- source_word: τὸ δαπάνημα δοθῆναι
  choice: расходы же пусть оплачиваются
  rationale: Передаёт распоряжение о предоставлении средств естественным современным русским языком.
- source_word: ἐκ τοῦ οἴκου Κύρου τοῦ βασιλέως
  choice: из дома царя Кира
  rationale: Формально сохраняет греческое οἶκος, которое может подразумевать царский дом или казну.
theological_decisions:
- issue: Связь относительного местоимения οὓ с предшествующим текстом
  choice: Сохранена формальная отсылка посредством «его» с пояснительной сноской
  alternative: Явно вставить «храма» или отнести размеры к жертвам/огню
  rationale: 'Греческий текст грамматически и смыслово затруднён: форма οὓ не согласуется очевидным образом с подразумеваемым зданием, но последующие размеры и строительные ряды указывают на сооружение. Добавление «храма» без оговорки чрезмерно устранило бы подлинную неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского предписания. Краткие синтаксические единицы повышают ясность, а «локоть», «царь Кир» и «дом царя» сохраняют историко-библейский колорит.
