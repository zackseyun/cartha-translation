base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/022.yaml
  text: 'Then King Darius ordered a search to be made in the archives kept in Babylon[a], and in Ecbatana, the fortress in the land of Media[b], a scroll was found in which these things had been recorded:'
translation:
  language: ru
  text: 'Тогда царь Дарий приказал провести поиск в архивах, хранившихся в Вавилоне. И в Экбатанах — крепости[a], находившейся в стране Мидии, — было найдено место[b], где было записано следующее:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в цитадели»; греческое слово может обозначать укреплённый административный центр.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «было найдено место, где было записано следующее». Вероятно, имеется в виду место в архиве или часть документа; греческий текст не называет найденный предмет свитком.'
    reason: source_ambiguity
lexical_decisions:
- source_word: προσέταξεν
  choice: приказал
  rationale: Передаёт властное распоряжение царя естественным современным русским языком.
- source_word: ἐπισκέψασθαι
  choice: провести поиск
  rationale: В контексте царских архивов речь идёт об официальном разыскании и проверке документов; выражение сохраняет этот смысл без канцелярской тяжеловесности.
- source_word: βιβλιοφυλακίοις
  choice: в архивах
  rationale: Контекст указывает на хранилища официальных письменных документов, а не на библиотеки общего назначения.
- source_word: τοῖς κειμένοις
  choice: хранившихся
  rationale: Естественно передаёт значение документов или архивов, помещённых и сохраняемых в Вавилоне.
- source_word: Ἐκβατάνοις
  choice: в Экбатанах
  rationale: Употреблена традиционная русская форма названия древнего города во множественном числе.
- source_word: τῇ βάρει
  choice: в крепости
  rationale: Слово обозначает укреплённый административный центр или цитадель; «крепость» понятно современному читателю и не переопределяет объект как дворец.
- source_word: ἐν Μηδείᾳ χώρᾳ
  choice: в земле Мидийской
  rationale: Сохраняет географическое значение χώρα и соответствует достоинству библейского повествования, не навязывая более узкое значение «провинция».
- source_word: τόπος
  choice: место
  rationale: Сохранено буквальное и несколько необычное выражение греческого текста; перевод «свиток» или «запись» был бы контекстуальным истолкованием, не выраженным самим существительным.
- source_word: ὑπομνημάτιστο
  choice: было записано
  rationale: Передаёт фиксацию следующего текста в качестве официальной памятной записи или документа.
- source_word: τάδε
  choice: следующее
  rationale: Естественно вводит содержание найденной записи и точно выполняет указательную функцию греческого слова.
