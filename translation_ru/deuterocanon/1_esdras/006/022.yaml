  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Два предложения устраняют перегруженность греческого синтаксиса, не меняя последовательности событий. Необычное «было найдено место» сохранено ради подлинной лексической неоднозначности источника и пояснено сноской.
