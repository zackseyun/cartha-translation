base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/025.yaml
  text: And the holy vessels of the house of the Lord[a], both the gold and the silver ones, which Nebuchadnezzar carried out from the house in Jerusalem and took to Babylon, are to be restored to the house in Jerusalem where they were placed[b], so that they may be set there.
translation:
  language: ru
  text: И священные сосуды[a] дома Господа[b] — как золотые, так и серебряные, — которые Навуходоносор вынес из дома в Иерусалиме и увёз в Вавилон, возвратить в дом в Иерусалиме, где они находились, чтобы поставить их там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священную утварь». Греческое выражение обозначает храмовые предметы, предназначенные для священного употребления.'
    reason: lexical_alternative
  - marker: b
    text: То есть храма Господа.
    reason: clarification
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: священные сосуды
  rationale: Сохраняет обычное значение σκεύη как сосудов или предметов утвари, а ἱερά указывает на их посвящение для священного употребления; вариант не уточняет их вид сверх источника.
- source_word: οἴκου Κυρίου
  choice: дома Господа
  rationale: Буквально передаёт οἶκος и сохраняет библейский образ; в контексте речь идёт о храме.
- source_word: τά τε χρυσᾶ καὶ ἀργυρᾶ
  choice: как золотые, так и серебряные
  rationale: Субстантивированные прилагательные соотносятся с уже названными сосудами; русская конструкция ясно охватывает обе группы без ненужного повтора.
- source_word: ἐξήνεγκεν … ἀπήνεγκεν εἰς Βαβυλῶνα
  choice: вынес … и увёз в Вавилон
  rationale: «Вынес» сохраняет направленность движения из храма, а «увёз» естественно передаёт последующее перемещение в Вавилон.
- source_word: ἀποκατασταθῆναι
  choice: возвратить
  rationale: Инфинитив соответствует языку распоряжения в окружающем контексте и выражает возвращение предметов на их прежнее, надлежащее место.
- source_word: οὗ ἦν κείμενα
  choice: где они прежде находились
  rationale: Передаёт значение κείμενα «лежали, находились, были помещены» без искусственного образа лежащих сосудов; «прежде» естественно выражает временное соотношение несовершенного вида ἦν с последующим возвращением.
- source_word: ὅπως τεθῇ ἐκεῖ
  choice: чтобы поставить их там
  rationale: Целевая конструкция сохранена. Единственное число греческого сказуемого при собирательно понимаемых предметах естественно передаётся русским множественным местоимением.
- source_word: Ναβουχοδονοσόρ
  choice: Навуходоносор
  rationale: Употреблена традиционная русская библейская форма имени.
theological_decisions:
- issue: Передача Κυρίου в названии храма
  choice: Господа
  alternative: Господень / Владыки
  rationale: Греческий текст содержит Κυρίου; «Господа» прямо и нейтрально передаёт титул, не подменяя его реконструированным древнееврейским именем.
- issue: Обозначение иерусалимского святилища
  choice: дом Господа
  alternative: храм Господа
  rationale: Основной текст сохраняет буквальный и богословски значимый образ «дома», а примечание поясняет его контекстуальный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством официального распоряжения. Инфинитив «возвратить» сохранён как часть синтаксиса указа; тире отделяют распространённую именную группу от предписания и облегчают чтение.
