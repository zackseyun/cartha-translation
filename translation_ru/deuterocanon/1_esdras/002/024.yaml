base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/024.yaml
  text: So now I have ordered that those men be stopped from building the city[a], and that care be taken that nothing further be done beyond this[c][b], and that the evil matter may not advance any more to the harm of kings.
translation:
  language: ru
  text: Итак, теперь я повелел остановить тех людей, чтобы они не строили город[a], и позаботиться о том, чтобы ничего сверх этого не делалось[b] и чтобы это злое дело не распространялось дальше, так что оно будет причинять вред царям[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По контексту речь идёт о восстановлении города, но в греческом тексте сказано просто «строить город».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы ничего не делалось вопреки этому». Греческое выражение допускает оба оттенка: выход за пределы повеления и действие против него.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Или: «досаждая царям» или «причиняя царям беспокойство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν ἐπέταξα
  choice: Итак, теперь я повелел
  rationale: Передаёт логический переход οὖν, временное νῦν и завершённое властное распоряжение, выраженное аористом ἐπέταξα; «повелел» соответствует официальному царскому контексту.
- source_word: ἀποκωλῦσαι τοὺς ἀνθρώπους ἐκείνους
  choice: остановить тех людей
  rationale: Выражает требование воспрепятствовать определённой группе людей; нейтральное «людей» не конкретизирует пол сверх необходимого.
- source_word: τοῦ οἰκοδομῆσαι τὴν πόλιν
  choice: чтобы они не строили город
  rationale: Греческий текст буквально говорит о строительстве, а не употребляет отдельного глагола со значением «восстановить»; контекстуальный вариант вынесен в примечание.
- source_word: προνοηθῆναι
  choice: позаботиться
  rationale: Естественно передаёт требование принять предусмотрительные административные меры.
- source_word: ὅπως μηθὲν παρὰ ταῦτα γένηται
  choice: чтобы ничего сверх этого не делалось
  rationale: Сохраняет возможное пространственно-ограничительное значение παρὰ ταῦτα; альтернативное значение «вопреки этому» отмечено в сноске.
- source_word: τὰ τῆς κακίας
  choice: это злое дело
  rationale: Идиоматическая субстантивированная конструкция обозначает вредное начинание или положение дел. Указательное «это» в русском связывает выражение с уже упомянутым делом, не претендуя на буквальное соответствие отдельному местоимению.
- source_word: μὴ προβῇ ἐπὶ πλεῖον
  choice: не распространялось дальше
  rationale: Передаёт дальнейшее продвижение или разрастание вредного дела естественным современным русским выражением.
- source_word: εἰς τὸ βασιλεῖς ἐνοχλῆσαι
  choice: причиняя вред царям
  rationale: В данном официально-политическом контексте ἐνοχλέω обозначает причинение беспокойства, затруднений или ущерба царской власти; более буквальная альтернатива сохранена в примечании.
