base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/025.yaml
  text: Then[a], when what had been written by King Artaxerxes was read, Rathymus and Samellius the scribe, and those aligned with them[b], hurried up to Jerusalem with horsemen and a battle formation of a crowd.
translation:
  language: ru
  text: Тогда, когда написанное царём Артаксерксом было прочитано, Рафим и Самеллий, писец, вместе со своими сторонниками поспешно отправились в Иерусалим с конниками и множеством людей, выстроенных в боевой порядок[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческие формы имён — «Рафим» и «Самеллий»; в еврейско-арамейском параллельном тексте эти люди названы Рехумом и Шимшаем. Или: «с конницей и множеством людей, выстроенных в боевой порядок». Греческий оборот сжат и может обозначать вооружённое сопровождение или организованный силовой отряд.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγνωσθέντων
  choice: после того как … было прочитано
  rationale: Аористное страдательное причастие в родительном самостоятельном обороте передаёт предшествующее обстоятельство; придаточное времени естественно звучит по-русски и сохраняет страдательный залог.
- source_word: τῶν παρὰ τοῦ βασιλέως Ἀρταξέρξου γραφέντων
  choice: написанное царём Артаксерксом
  rationale: Греческий оборот говорит в общем о написанном, не употребляя специального слова «письмо»; перевод не сужает значение до одного документа.
- source_word: Ῥάθυμος
  choice: Ратим
  rationale: Имя передано с греческой формы основного источника; отождествление с Рехумом в параллельном семитском свидетельстве отмечено в сноске.
- source_word: Σαμέλλιος
  choice: Самеллий
  rationale: Имя транслитерировано с греческого; вероятное соответствие имени Шимшай вынесено в сноску.
- source_word: ὁ γραμματεὺς
  choice: писец
  rationale: γραμματεύς может обозначать писца или административного секретаря; «писец» формально прозрачно и уместно в данном контексте.
- source_word: οἱ τούτοις συντασσόμενοι
  choice: вместе со своими сторонниками
  rationale: Оборот обозначает людей, примкнувших к названным лицам или выступавших на их стороне; русский перевод естественно передаёт эту связь.
- source_word: ἀναζεύξαντες κατὰ σπουδήν
  choice: поспешно отправились
  rationale: ἀναζεύγνυμι обозначает выступление в путь, а κατὰ σπουδήν — поспешность; сочетание передаёт оба компонента без излишнего усиления военного оттенка.
- source_word: μεθʼ ἵππου
  choice: с конниками
  rationale: Единственное число ἵππου здесь, вероятно, имеет собирательное или идиоматическое значение; «с конниками» сохраняет связь с лошадьми и не столь технически однозначно, как «с конницей».
- source_word: ὄχλου παρατάξεως
  choice: с толпой, выстроенной в боевой порядок
  rationale: 'Сжатое и необычное сочетание удерживает оба компонента: ὄχλος — множество или толпа, παράταξις — построение, особенно боевое. Неясность характера вооружённого сопровождения дополнительно отмечена в сноске.'
