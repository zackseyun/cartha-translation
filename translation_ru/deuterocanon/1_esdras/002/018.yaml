base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/018.yaml
  text: Therefore, if this city is rebuilt and the walls are completed, they will certainly not endure to pay tribute, but will even oppose kings.
translation:
  language: ru
  text: Итак, если этот город будет отстроен и стены будут достроены, они ни за что не станут платить дань[a], но даже выступят против царей.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «не станут и дальше платить дань» или «не согласятся платить дань». Греческий оборот буквально говорит, что они «ни за что не станут терпеть, чтобы платить»; речь может идти об отказе и впредь нести бремя дани.'
    reason: lexical_alternative
  - marker: b
    text: Перевод следует непосредственно греческому тексту, поскольку приведённый арамейский масоретский параллельный материал по формулировке не соответствует этому стиху.
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Итак, если
  rationale: οὖν выражает вывод из предшествующего обвинения, а ἐάν вводит реальное условие; сочетание «Итак, если» сохраняет ход рассуждения.
- source_word: ἡ πόλις αὕτη
  choice: этот город
  rationale: Указательное αὕτη естественно передаётся как «этот» и сохраняет перспективу авторов письма.
- source_word: οἰκοδομηθῇ
  choice: будет отстроен
  rationale: Пассивный аорист конъюнктива в условном обороте передан будущим временем; «отстроен» соответствует контексту восстановления уже существовавшего города.
- source_word: τὰ τείχη συντελεσθῇ
  choice: стены будут доведены до конца
  rationale: συντελέω обозначает завершение начатой работы. Такая формулировка передаёт именно полноту окончания строительства, не исправляя стилистическую особенность греческого согласования.
- source_word: φορολογίαν
  choice: дань
  rationale: В данном имперско-политическом контексте φορολογία означает обязательный платёж верховной власти; «дань» точнее, чем нейтральный современный «налог».
- source_word: οὐ μὴ ὑπομείνωσιν δοῦναι
  choice: ни за что не станут платить
  rationale: οὐ μή с конъюнктивом выражает усиленное отрицание. Основной текст передаёт его естественным русским оборотом, а оттенок ὑπομένω — терпеть или продолжать нести бремя — отмечен в сноске.
- source_word: ἀλλὰ καὶ
  choice: но даже
  rationale: 'Оборот усиливает обвинение: речь идёт не только об отказе от дани, но и о более серьёзном противодействии власти.'
- source_word: βασιλεῦσιν ἀντιστήσονται
  choice: выступят против царей
  rationale: ἀνθίστημι означает противостоять, сопротивляться или становиться против кого-либо. «Выступят против» ясно передаёт политическую направленность обвинения, не усиливая её до недвусмысленного вооружённого мятежа.
theological_decisions:
- issue: Характер противодействия царям
  choice: выступят против царей
  alternative: восстанут против царей
  rationale: Греческое ἀντιστήσονται указывает на сопротивление или противостояние, но само по себе не требует значения вооружённого восстания; перевод сохраняет эту широту.
translation_notes:
  register: Современный литературный русский язык с официально-политическим оттенком, соответствующим обвинительному письму. Синтаксис ясен для широкого читателя; усиленное отрицание и нарастание обвинения сохранены.
