base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/002.yaml
  text: the Lord stirred up the spirit of Cyrus king of the Persians[a], and he made a proclamation throughout all his kingdom, and also in writing, saying,
translation:
  language: ru
  text: 'Господь пробудил дух Кира, царя персов[a], и он объявил по всему своему царству — как устно, так и письменно — следующее:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «царя персов»; в еврейском параллельном тексте Ездры 1:1 — «царя Персии».'
    reason: Сохраняется отличие основного греческого текста от еврейской параллели.
lexical_decisions:
- source_word: ἤγειρεν
  choice: пробудил
  rationale: В сочетании с «дух» передаёт внутреннее побуждение, исходящее от Бога, не сводя глагол ни к физическому пробуждению, ни к простому разрешению действовать.
- source_word: Κύριος
  choice: Господь
  rationale: Обычное русское соответствие κύριος в данном повествовательном контексте; речь идёт о Боге Израиля, хотя греческий текст содержит Κύριος, а не тетраграмматон.
- source_word: τὸ πνεῦμα Κύρου
  choice: дух Кира
  rationale: Сохраняет антропологическую многозначность πνεῦμα как внутреннего расположения или побуждения Кира, не заменяя его более узким словом «разум».
- source_word: βασιλέως Περσῶν
  choice: царя персов
  rationale: Следует греческому множественному числу Περσῶν и не гармонизирует его с еврейской параллелью «царь Персии».
- source_word: ἐκήρυξεν
  choice: повелел возвестить
  rationale: Глагол обозначает публичное оглашение через глашатая; каузативная русская формулировка естественна для царского указа и не требует понимать, будто Кир лично возвещал его по всему царству.
- source_word: ὅλῃ τῇ βασιλείᾳ αὐτοῦ
  choice: по всему своему царству
  rationale: Естественно передаёт распространение оглашения по всей территории царства.
- source_word: ἅμα διὰ γραπτῶν
  choice: а также изложить письменно
  rationale: Передаёт добавочное значение ἅμα и письменную форму распоряжения без необоснованного уточнения, шла ли речь о письмах или одном документе.
- source_word: λέγων
  choice: 'следующее:'
  rationale: Естественно вводит содержание указа, продолжающееся в следующем стихе; смысл греческого причастия сохранён без тяжеловесного буквального «говоря».
theological_decisions:
- issue: Божественное действие в решении Кира
  choice: Господь непосредственно пробудил дух Кира
  alternative: Господь лишь позволил Киру действовать или решение было исключительно политическим
  rationale: Греческий текст прямо называет Господа действующим субъектом ἤγειρεν. Перевод сохраняет эту причинность, не объясняя механизм воздействия и не отрицая человеческой воли Кира.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного и царского контекста. Формула «повелел возвестить» ясна обычному читателю и передаёт публичное оглашение; двоеточие естественно открывает текст указа в следующем стихе.
