base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/019.yaml
  text: And you will find in the records what has been written about these things[a], and you will know that that city was rebellious, troubling kings and cities, and that the Jews in it were rebels and had established blockades from of old; for this reason that city was laid waste.
translation:
  language: ru
  text: И ты найдёшь в записях написанное об этих делах и узнаешь, что тот город был мятежным, доставлял беспокойство царям и городам, а иудеи в нём были мятежниками и с давних времён организовали в нём осады[a]; по этой причине этот город был опустошён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «организовали в нём блокаду»; греческое слово может обозначать осаду или осадные действия в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομνηματισμοῖς
  choice: летописях
  rationale: В административном контексте речь идёт об официальных письменных записях, доступных для проверки. «Летописи» естественно передаёт царский архивный источник, не сводя слово к частным комментариям.
- source_word: τὰ γεγραμμένα
  choice: написанное
  rationale: Субстантивированное причастие совершенного вида указывает на уже зафиксированные письменно сведения.
- source_word: ἀποστάτις
  choice: мятежным
  rationale: Здесь слово характеризует политическую непокорность города, а не религиозное отступничество.
- source_word: ὀχλοῦσα
  choice: доставлял беспокойство
  rationale: Передаёт продолжающееся причинение смуты и затруднений царям и городам без неоправданного усиления.
- source_word: ἀποστᾶται
  choice: мятежниками
  rationale: 'Контекст персидского административного обвинения требует политического смысла: участники мятежа, а не вероотступники.'
- source_word: πολιορκίας συνεσταμένοι
  choice: устраивали осады
  rationale: Сочетание обозначает организованную осадную деятельность. «Устраивали осады» естественно по-русски передаёт как πολιορκίας, так и организующий смысл συνεσταμένοι.
- source_word: ἔτι ἐξ αἰῶνος
  choice: с давних времён
  rationale: Передаёт давность и устойчивость обвиняемого поведения современным литературным русским языком.
- source_word: ἠρημώθη
  choice: был опустошён
  rationale: Сохраняет пассивную форму и значение доведения города до запустения или разорения.
theological_decisions:
- issue: Характер обвинения против города и иудеев
  choice: Политический мятеж и враждебная деятельность
  alternative: Религиозное отступничество
  rationale: Хотя слова ἀποστάτις и ἀποστᾶται способны в иных контекстах обозначать отступничество, здесь царь получает обвинение в неповиновении имперской власти; поэтому выбрана политическая лексика.
translation_notes:
  register: Современный литературный русский язык с достоинством официального исторического повествования. Формулировки ясны обычному читателю; политическая направленность обвинения сохранена, а неоднозначность выражения об осадной деятельности отмечена в сноске.
