review_pass:
  verdict: revise
  source_fidelity: Нужна небольшая правка. ὑπομνηματισμοί в данном административном контексте точнее передавать как «записи» (или «архивные записи»), а не «летописи». Кроме того, ἐν αὐτῇ («в нём/в этом городе») относится к осадной деятельности и должно быть выражено. Совершенное причастие συνεσταμένοι лучше передаётся совершенным результативным оборотом, чем несовершенным «устраивали».
  naturalness: Текст в целом литературен и ясен. «В записях» и «организовали в нём осады» звучат естественно в официально-историческом регистре, хотя само обвинение намеренно передаёт несколько странную формулировку оригинала.
  terminology: «Мятежный/мятежники» правильно передаёт политический, а не религиозный смысл ἀποστάτις / ἀποστᾶται. «Осады» — основной нейтральный эквивалент πολιορκίαι; сноска об альтернативе «блокады» сохраняет лексическую широту.
  issues:
  - severity: medium
    issue: «Летописи» для ὑπομνηματισμοῖς
    rationale: «Летописи» обычно обозначают хроники, тогда как греческое слово здесь относится к официальным справочным или архивным записям.
  - severity: medium
    issue: Пропущено «в нём» (ἐν αὐτῇ)
    rationale: Оригинал прямо локализует организованные осады/осадные действия в городе; это обстоятельство следует сохранить.
  - severity: low
    issue: «Устраивали» осады
    rationale: Несовершенный вид ослабляет результативный оттенок совершенного причастия συνεσταμένοι; «организовали» точнее передаёт устроенную или созданную осадную деятельность.
