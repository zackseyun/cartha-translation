revisions:
- from: И ты найдёшь в летописях написанное об этом и узнаешь, что тот город был мятежным, доставлял беспокойство царям и городам, а иудеи в нём были мятежниками и с давних времён устраивали осады[a]; по этой причине этот город был опустошён.
  to: И ты найдёшь в записях написанное об этих делах и узнаешь, что тот город был мятежным, доставлял беспокойство царям и городам, а иудеи в нём были мятежниками и с давних времён организовали в нём осады[a]; по этой причине этот город был опустошён.
  rationale: Правка заменяет анахронично-специфические «летописи» на нейтральные «записи», восстанавливает ἐν αὐτῇ и передаёт συνεσταμένοι совершенным видом. Сохраняются политический характер обвинения, противопоставление «тот город» / «этот город» (ἐκείνη / αὕτη) и отмеченная сноской лексическая неопределённость πολιορκίαι.
  reviewer_model: gpt-5.6-terra
