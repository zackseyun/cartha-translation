base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/020.yaml
  text: Now therefore we make known to you[a], lord king, that if this city is built and its walls are raised up, there will no longer be for you passage into Coele-Syria and Phoenicia.
translation:
  language: ru
  text: 'Итак, доводим до твоего сведения, господин царь: если этот город будет построен и его стены возведены, у тебя больше не будет прохода[a] в Келесирию и Финикию.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доступа» или «пути в Келесирию и Финикию». Буквально по-гречески: «у тебя больше не будет выхода в Келесирию и Финикию»; здесь может подразумеваться утрата возможности прохода или доступа к этим областям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδεικνύομέν
  choice: доводим до твоего сведения
  rationale: Глагол вводит официальное донесение царю; эта формулировка естественна для современного русского административно-придворного регистра и согласуется с арамейским параллельным оборотом «да будет известно».
- source_word: κύριε βασιλεῦ
  choice: господин царь
  rationale: Сохраняет оба элемента греческого обращения без добавления отсутствующего в оригинале притяжательного местоимения.
- source_word: οἰκοδομηθῇ
  choice: будет построен
  rationale: Греческая форма означает «будет построен»; перевод «восстановлен» был бы уместен по контексту, но прямо не выражен глаголом.
- source_word: τὰ ταύτης τείχη
  choice: его стены
  rationale: Естественно передаёт принадлежность стен городу.
- source_word: ἀνασταθῇ
  choice: возведены
  rationale: Передаёт образ поднятия или сооружения стен и не добавляет явно не выраженного значения повторного строительства.
- source_word: ἔξοδός
  choice: прохода
  rationale: В данном контексте слово обозначает возможность пройти или получить доступ к названным областям; буквальный «выход» по-русски звучал бы неясно.
- source_word: κοίλην Συρίαν
  choice: Келесирию
  rationale: Передано принятое историко-географическое название области, а не буквальная калька «Полая Сирия».
- source_word: Φοινίκην
  choice: Финикию
  rationale: Употреблена стандартная русская форма географического названия.
