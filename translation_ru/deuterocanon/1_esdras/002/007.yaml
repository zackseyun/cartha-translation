base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/007.yaml
  text: Then the heads of the ancestral houses of the tribes of Judah and Benjamin[a], and the priests and the Levites, and everyone whose spirit the Lord had stirred up, arose to go up to build the house of the Lord that is in Jerusalem.
translation:
  language: ru
  text: Тогда поднялись главы родов из колен Иуды и Вениамина, священники, левиты и все те, чей дух Господь пробудил[a], чтобы взойти и построить дом Господа, который находится в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском параллельном тексте, Ездры 1:5, сказано: «все, чей дух пробудил Бог». Здесь, в 1 Ездре, стоит «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: καταστήσαντες / וַיָּקוּמוּ
  choice: поднялись
  rationale: Греческая форма в данном контексте синтаксически трудна, тогда как еврейский параллельный текст ясно передаёт значение «встали, поднялись». Последующие инфинитивы движения и цели также поддерживают это понимание.
- source_word: οἱ ἀρχίφυλοι τῶν πατριῶν
  choice: главы родов
  rationale: Выражение обозначает руководителей больших родственных объединений. «Главы родов» естественно для современного русского языка и сохраняет общественную и родовую структуру исходного текста.
- source_word: τῆς Ἰούδα καὶ Βενιαμεὶν φυλῆς
  choice: колен Иуды и Вениамина
  rationale: Хотя греческая формулировка сжата и слово «колено» стоит в единственном числе, по смыслу речь идёт о двух коленах; множественное число по-русски устраняет грамматическую шероховатость, не меняя смысла.
- source_word: ἤγειρεν ... τὸ πνεῦμα
  choice: пробудил ... дух
  rationale: Сохраняется метафора внутреннего побуждения Богом. Глагол «пробудил» звучит естественно и достойно в современном русском библейском повествовании.
- source_word: Κύριος
  choice: Господь
  rationale: Основной греческий источник читает Κύριος; поэтому в главном тексте употреблено «Господь», а отличие еврейской параллели отмечено в сноске.
- source_word: ἀναβῆναι
  choice: отправиться в Иерусалим
  rationale: Греческий глагол буквально означает «подняться, взойти», но применительно к путешествию в Иерусалим современное русское «отправиться» естественно передаёт движение без неясного пространственного оборота.
- source_word: οἰκοδομῆσαι οἶκον τῷ κυρίῳ τὸν ἐν Ἱερουσαλήμ
  choice: построить там дом Господа
  rationale: Передаёт строительство храма Господа и его местонахождение в Иерусалиме. «Построить», а не «восстановить», следует глаголу без явно выраженного значения повторности.
theological_decisions:
- issue: Обозначение Бога в греческом основном тексте отличается от еврейской параллели Ездры 1:5
  choice: Господь пробудил
  alternative: Бог пробудил
  rationale: Для 1 Ездры основным свидетелем служит греческий текст, в котором стоит Κύριος. Еврейское чтение אֱלֹהִים сохраняется в сноске, чтобы не скрывать текстовое различие.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Родовые и культовые термины сохранены, но тяжёлая греческая структура перестроена ради ясности. Тире выделяют поясняющее приложение «все, чей дух…» и помогают однозначно связать сказуемое со всем перечнем.
