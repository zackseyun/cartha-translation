base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/006.yaml
  text: Therefore[a], as many as live in the various places, let the men in his place help him with gold and silver, with gifts, with horses and livestock[b], along with the other things added as vowed offerings for the temple of the Lord in Jerusalem.
translation:
  language: ru
  text: Итак, пусть всякому, кто живёт в тех или иных местах, жители того места помогут золотом и серебром, дарами, конями[a] и скотом вместе со всем прочим, добавленным по обетам для храма Господа[b] в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «конями и скотом». Еврейская параллель в Езд 1:4, 6 отличается: вместо «коней» там употреблены слова, обозначающие имущество и скот. Основной текст следует греческому свидетельству 1 Ездры.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «святилища Господа». Греческое ἱερόν может означать как храм, так и святилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι οὖν κατὰ τοὺς τόπους οἰκοῦσιν
  choice: Итак, каждому из живущих в разных местах
  rationale: Оборот ὅσοι имеет собирательно-распределительный смысл, а οὖν связывает повеление с предшествующим контекстом. Дательный «каждому» естественно согласуется по смыслу с последующим αὐτῷ и сохраняет распределительное отношение.
- source_word: βοηθείτωσαν αὐτῷ οἱ ἐν τῷ τόπῳ αὐτοῦ
  choice: пусть жители его местности помогут
  rationale: Повелительная форма передана конструкцией «пусть… помогут»; οἱ ἐν τῷ τόπῳ αὐτοῦ обозначает местных жителей. «Местность» звучит по-русски естественнее буквального «его место».
- source_word: ἐν χρυσίῳ καὶ ἐν ἀργυρίῳ, ἐν δόσεσιν
  choice: золотом и серебром, дарами
  rationale: ἐν обозначает средство помощи. «Дары» сохраняют широкий смысл δόσεις и не превращают их без основания в особую категорию культовых приношений.
- source_word: μεθʼ ἵππων καὶ κτηνῶν
  choice: конями и скотом
  rationale: ἵπποι буквально означает коней, а κτήνη — домашних животных или скот. Перевод следует первичному греческому свидетелю, несмотря на отличие еврейской параллели.
- source_word: σὺν τοῖς ἄλλοις τοῖς κατʼ εὐχὰς προστεθειμένοις
  choice: вместе со всем прочим, что добавлено по обетам
  rationale: Формулировка сохраняет как добавочный смысл προστεθειμένοις, так и связь κατʼ εὐχάς с обетами, не уточняя, были ли это заранее обещанные или принесённые во исполнение обета вещи.
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου τὸ ἐν Ἱερουσαλήμ
  choice: для храма Господа в Иерусалиме
  rationale: ἱερόν в данном иерусалимском контексте естественно передаётся словом «храм»; εἰς выражает назначение даров. κύριος переведено как «Господь» по форме первичного греческого текста.
theological_decisions:
- issue: Передача κύριος применительно к Богу Израиля
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Первичным источником служит греческий текст с κυρίου, а не непосредственно еврейский тетраграмматон; поэтому используется обычная форма «Господь».
- issue: Обозначение иерусалимского священного здания
  choice: храм
  alternative: святилище
  rationale: Оба значения допустимы для ἱερόν, однако в контексте Иерусалима «храм» является наиболее ясным и естественным; лексическая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейским звучанием. Распределительная конструкция «каждому… его» устраняет неестественную для русского языка смену множественного числа на единственное, не снимая смысловой неоднозначности греческого оборота. Перечень сохранён без архаизмов; повтор предлога ἐν перед золотом и серебром передан естественным русским творительным падежом.
