base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/026.yaml
  text: They began to hinder those who were building[a], and the building of the temple in Jerusalem was stopped until the second year of the reign of Darius, king of the Persians.
translation:
  language: ru
  text: Они стали мешать тем, кто строил, и работы по строительству храма в Иерусалиме не велись[a] до второго года царствования Дария, царя персов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были приостановлены»; греческий глагол указывает, что работы над храмом оставались без движения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο κωλύειν
  choice: стали мешать
  rationale: Сочетание аориста ἄρχομαι с инфинитивом обозначает начало действия; «стали мешать» естественно передаёт это значение и не предвосхищает прямо названную далее остановку работ.
- source_word: τοὺς οἰκοδομοῦντας
  choice: тем, кто строил
  rationale: Передаёт глагольный характер причастия и указывает на людей, занятых строительством.
- source_word: ἤργει
  choice: прекратилось
  rationale: В данном контексте глагол означает, что строительство перестало вестись, оставалось без действия; русский глагол ясно выражает фактическую остановку работ.
- source_word: ἡ οἰκοδομὴ τοῦ ἱεροῦ
  choice: строительство храма
  rationale: Речь идёт о процессе или проекте строительства, а не о готовом здании; ἱερόν здесь естественно передаётся словом «храм».
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Краткая и естественная по-русски передача определения, указывающего местонахождение храма.
- source_word: μέχρι τοῦ δευτέρου ἔτους τῆς βασιλείας Δαρείου
  choice: до второго года царствования Дария
  rationale: μέχρι с родительным указывает временной предел, а βασιλεία здесь означает период царского правления.
- source_word: τοῦ Περσῶν βασιλέως
  choice: царя персов
  rationale: Прямо сохраняет греческую конструкцию «царь персов» и звучит естественно в русском библейском повествовании.
