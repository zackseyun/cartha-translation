base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/022.yaml
  text: I read the letter that you sent to me. Therefore I gave orders to investigate[a], and it was found that that city has from ancient times set itself in opposition to kings,
translation:
  language: ru
  text: Я прочёл письмо, которое вы мне послали. Поэтому я велел провести расследование, и было установлено, что этот город издревле противостоит царям,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέγνων
  choice: Я прочёл
  rationale: Аорист первого лица в контексте официального ответа естественно передаётся русским прошедшим временем; «прочёл» сохраняет значение ознакомления с письмом.
- source_word: τὴν ἐπιστολήν
  choice: письмо
  rationale: Прямое и естественное соответствие существительному ἐπιστολή в административно-эпистолярном контексте.
- source_word: ἣν πέμψατε πρὸς ἐμέ
  choice: которое вы мне послали
  rationale: Передаёт относительную конструкцию и направление действия без ненужной канцелярской тяжеловесности.
- source_word: ἐπέταξα
  choice: я велел
  rationale: Глагол обозначает властное распоряжение; «велел» звучит естественно и сохраняет царско-административный оттенок.
- source_word: ἐπισκέψασθαι
  choice: провести расследование
  rationale: В данном официальном контексте речь идёт о проверке сведений, а не о простом осмотре.
- source_word: εὑρέθη
  choice: было установлено
  rationale: Безличная пассивная формула официального сообщения естественно передаётся выражением «было установлено».
- source_word: ἐξ αἰῶνος
  choice: издревле
  rationale: Здесь выражение указывает на давнюю историческую практику, а не на метафизическую вечность.
- source_word: ἀντιπαρατάσσουσα
  choice: выступал против
  rationale: Причастие означает занимать противостоящую позицию, буквально выстраиваться против; выбранная формулировка сохраняет враждебное противостояние, не усиливая его до однозначного «восставал».
- source_word: βασιλεῦσιν
  choice: царей
  rationale: Прямое соответствие дательному множественного числа с обобщённо-историческим значением.
