base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/023.yaml
  text: and its people were carrying out rebellions and wars within it[a], and strong and harsh kings were in Jerusalem, ruling and exacting tribute from Coele-Syria and Phoenicia.
translation:
  language: ru
  text: И его жители поднимали в нём мятежи и вели войны[a]; в Иерусалиме правили могущественные и жестокие цари, взимавшие дань с Келесирии и Финикии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном месте Ездры 4:15 Иерусалим назван мятежным городом, который вредил царям и областям и в котором издревле происходили восстания; в 4:20 упомянуты могущественные цари, правившие в Иерусалиме и взимавшие дань. Здесь, в 1 Ездре, описание говорит о «мятежах и войнах» и называет Келесирию и Финикию.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἄνθρωποι
  choice: жители его
  rationale: В контексте речь идёт о людях города; «жители» естественно передаёт эту связь, а местоимение указывает на ранее названный город.
- source_word: ἀποστάσεις
  choice: мятежи
  rationale: Слово обозначает политические восстания или отпадения; «мятежи» сохраняет политический смысл и множественное число.
- source_word: πολέμους
  choice: войны
  rationale: Прямое соответствие греческому множественному числу без сужения смысла до отдельных сражений.
- source_word: συντελοῦντες
  choice: поднимали … и вели
  rationale: Причастие относится одновременно к мятежам и войнам. По-русски естественнее передать его сочетающимися с каждым существительным глаголами, сохранив активное и намеренное действие.
- source_word: ἰσχυροὶ καὶ σκληροὶ
  choice: могущественные и жестокие
  rationale: «Могущественные» выражает политическую силу царей, а «жестокие» — их суровый, беспощадный характер; оба признака сохранены раздельно.
- source_word: κυριεύοντες
  choice: правили
  rationale: В политическом контексте обозначает осуществление власти; «правили» звучит естественно и точно.
- source_word: φορολογοῦντες
  choice: взимавшие дань с
  rationale: Передаёт принудительное налогообложение подвластных областей и лучше соответствует имперскому контексту, чем нейтральное «облагавшие налогом».
- source_word: κοίλην Συρίαν
  choice: Келесирии
  rationale: «Келесирия» — закрепившееся русское историко-географическое название области Coele-Syria.
- source_word: Φοινίκην
  choice: Финикии
  rationale: Общепринятое русское название региона.
- source_word: ἐν αὐτῇ
  choice: в нём
  rationale: Местоимение отсылает к ранее названному городу; мужской род соответствует русскому слову «город».
theological_decisions:
- issue: Соотношение расширенного греческого текста с масоретской параллелью в Ездре 4:19–20
  choice: В основном тексте сохранены греческие сведения о мятежах, войнах и дани с Келесирии и Финикии.
  alternative: 'Сблизить перевод с арамейской параллелью: назвать город мятежным и вредившим царям и областям и упомянуть происходивший в нём издревле мятеж.'
  rationale: Для 1 Ездры первичен греческий текст. Арамейская параллель помогает увидеть текстовую традицию, но не должна заменять более полный и иначе сформулированный греческий текст.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис слегка перестроен ради естественной русской сочетаемости: единое греческое συντελοῦντες передано как «поднимали … и вели». Название «Келесирия» употреблено в традиционной русской форме.'
