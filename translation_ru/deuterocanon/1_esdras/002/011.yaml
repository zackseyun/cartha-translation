  yaml_path: translation/deuterocanon/1_esdras/002/011.yaml
  text: And through him they were handed over to Sanamassar[c][b][a], governor of Judea.
translation:
  language: ru
  text: А через него[a] они были переданы Санамассару[b], правителю Иудеи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его руками»; этот оборот подчёркивает посредничество при передаче.'
    reason: lexical_alternative
  - marker: b
    text: Санамассар — греческая форма имени Шешбаццар, приведённого в еврейском параллельном тексте (Езд. 1:8).
    reason: alternative_reading
  - marker: c
    text: Греч. «Иудеи»; в еврейском параллельном тексте — «Иуды».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ τούτου
  choice: И через него
  rationale: Греческое выражение буквально указывает на посредничество или участие лица в передаче. «Через него» естественно передаёт инструментальное значение и не конкретизирует его сверх текста.
- source_word: παρεδόθησαν
  choice: они были переданы
  rationale: Пассивная форма παραδίδωμι означает передачу кому-либо; местоимение «они» отсылает к упомянутым в контексте храмовым сосудам, при этом пассивная конструкция греческого текста сохранена.
- source_word: Σαναμασσάρῳ
  choice: Санамассару
  rationale: Имя передано по греческой форме Σαναμασσάρ, поскольку именно греческий текст является основным источником. Соответствие еврейскому имени Шешбаццар отмечено в сноске.
- source_word: προστάτῃ
  choice: правителю
  rationale: В административном контексте προστάτης обозначает руководителя или должностное лицо. «Правитель» сохраняет официальное значение, не уточняя конкретный титул сверх греческого текста.
- source_word: τῆς Ἰουδαίας
  choice: Иудеи
  rationale: Перевод следует греческому географическому названию Ἰουδαία; форма «Иудея» обычна и понятна в современном русском языке.
