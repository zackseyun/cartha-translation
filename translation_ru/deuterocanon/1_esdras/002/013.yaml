  text: And all the vessels were brought up[a], the gold and silver ones[b], five thousand four hundred and sixty-nine in all.
translation:
  language: ru
  text: 'И все сосуды — золотые и серебряные — были доставлены[a]: всего пять тысяч четыреста шестьдесят девять[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может также подразумевать, что сосуды были «принесены наверх», то есть доставлены в Иерусалим.
    reason: lexical_alternative
  - marker: b
    text: В параллельной описи в Ездры 1:9–10 по еврейскому тексту предметы перечислены и подсчитаны иначе; здесь перевод следует греческому тексту 1 Ездры.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα σκεύη
  choice: все сосуды
  rationale: В контексте храмового имущества σκεύη естественно передаётся словом «сосуды»; оно охватывает перечисленные предметы и сохраняет традиционную, но понятную современному читателю лексику.
- source_word: ἐκομίσθη
  choice: были доставлены
  rationale: Аорист пассивного залога обозначает перемещение предметов. «Были доставлены» естественно по-русски и не добавляет явно не выраженного в греческом направлении движения.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: золотые и серебряные
  rationale: Прилагательные относятся к подразумеваемому σκεύη. Обособленная конструкция с тире ясно связывает их со словом «сосуды» и сохраняет компактность греческой фразы.
- source_word: πεντακισχίλια τετρακόσια ἑξήκοντα ἐννέα
  choice: пять тысяч четыреста шестьдесят девять
  rationale: Греческий текст содержит однозначное количественное числительное; число передано словами в литературном библейском регистре.
