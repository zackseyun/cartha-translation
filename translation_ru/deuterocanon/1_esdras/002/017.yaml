base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/017.yaml
  text: And now let it be known to my lord the king that the Judeans who came up from you to us have come to Jerusalem and are living in that rebellious and wicked city[a]; they are repairing its marketplaces and walls[c][b], and are laying the foundation of a temple.
translation:
  language: ru
  text: И теперь да будет известно царю, господину, что иудеи[a], пришедшие от вас к нам, прибыли в Иерусалим и живут в этом мятежном и нечестивом городе; они восстанавливают его площади и стены и закладывают основание храма[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жители Иудеи». Греческое Ἰουδαῖοι может обозначать выходцев из Иудеи либо иудеев в более широком этнорелигиозном смысле.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «принимаются за строительство храма». Греческое выражение сжато и может обозначать начало храмового строительства, в частности закладку его основания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: да будет известно
  rationale: Сохраняет официальную эпистолярную формулу и её повелительно-пожелательный оттенок, оставаясь понятным в современном русском языке.
- source_word: τῷ κυρίῳ βασιλεῖ
  choice: господину царю
  rationale: κύριος здесь является почтительным придворным титулом человеческого правителя, а не именованием Бога. Притяжательное «моему» в греческом тексте прямо не выражено.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: Обычное русское историческое обозначение; в данном персидском контексте слово может указывать как на выходцев из Иудеи, так и шире на иудеев, поэтому неоднозначность отмечена в сноске.
- source_word: ἀναβάντες παρ’ ὑμῶν πρὸς ἡμᾶς
  choice: поднявшиеся от вас к нам
  rationale: Сохраняет пространственный оттенок ἀναβαίνω — восхождение к Иерусалиму — и направление «от вас к нам».
- source_word: τὴν πόλιν τὴν ἀποστάτιν καὶ πονηράν
  choice: в этом мятежном и нечестивом городе
  rationale: ἀποστάτις в имперском обвинении означает политическую мятежность, а πονηρά передаёт враждебную нравственную оценку города.
- source_word: οἰκοῦσιν
  choice: живут
  rationale: Передаёт продолжающееся проживание естественным современным русским глаголом.
- source_word: ἀγορὰς
  choice: городские площади
  rationale: ἀγορά обозначает общественную площадь, нередко служившую рынком. «Городские площади» естественнее в данном перечне строительных объектов и не сужает значение только до торговли.
- source_word: θεραπεύουσιν
  choice: восстанавливают
  rationale: В сочетании с площадями и стенами глагол означает заботу о сооружениях, их исправление или восстановление; выбранное слово ясно передаёт строительный контекст, не обязательно подразумевая полную перестройку.
- source_word: ναὸν ὑποβάλλονται
  choice: закладывают основание храма
  rationale: Сжатое греческое выражение указывает на начало храмового строительства или устройство основания. Основной текст передаёт наиболее вероятный строительный смысл, а более широкая возможность отмечена в сноске.
theological_decisions:
- issue: Значение κύριος при обращении к земному царю
  choice: господину царю
  alternative: царю, моему господину
  rationale: Контекст однозначно указывает на придворное обращение к монарху; перевод не должен создавать впечатление божественного титула и не добавляет отсутствующее в греческом притяжательное местоимение.
- issue: Определённость ναόν без артикля
  choice: храма
  alternative: некоего храма
  rationale: Русский язык не имеет артиклей, а контекст Иерусалима естественно указывает на известный храм. При этом перевод не вводит отдельного указательного определения и не делает из отсутствия артикля богословского вывода.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким официальным регистром, соответствующим царскому донесению. Синтаксис сохраняет протяжённость исходной фразы, но разделён точкой с запятой для ясности. Архаизмы сведены к устойчивой формуле «да будет известно».
