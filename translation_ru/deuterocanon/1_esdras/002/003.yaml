base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/003.yaml
  text: 'Thus says Cyrus king of the Persians: The Lord of Israel[a], the Most High Lord, has appointed me king of the world,'
translation:
  language: ru
  text: 'Так говорит Кир, царь персов: «Господь Израиля[a], Господь Всевышний, поставил меня царём всего мира,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском параллельном тексте Ездры 1:2 сказано: «Господь, Бог небес», а не «Господь Израиля, Господь Всевышний». Здесь текст 1 Ездры следует греческой форме провозглашения.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τάδε λέγει
  choice: Так говорит
  rationale: Устойчивая формула введения торжественного провозглашения; естественна для современного литературного русского языка и сохраняет официальный тон.
- source_word: ὁ βασιλεὺς Περσῶν Κῦρος
  choice: Кир, царь персов
  rationale: Сохраняет греческое указание на народ во множественном числе и при этом звучит естественно по-русски.
- source_word: Ἐμὲ ἀνέδειξεν βασιλέα
  choice: поставил меня царём
  rationale: ἀναδείκνυμι в данном контексте обозначает возведение или назначение на царское служение; «поставил царём» передаёт официальное наделение властью.
- source_word: τῆς οἰκουμένης
  choice: всего мира
  rationale: οἰκουμένη обозначает обитаемый или подвластный мир. Добавление «всего» естественно выражает всеохватность притязания и согласуется по смыслу с параллельным «все царства земли», не подменяя греческую формулировку.
- source_word: ὁ κύριος τοῦ Ἰσραήλ
  choice: Господь Израиля
  rationale: Прямо следует греческому чтению и не добавляет отсутствующее слово «Бог».
- source_word: Κύριος ὁ ὕψιστος
  choice: Господь Всевышний
  rationale: Сохраняет оба элемента греческого божественного титула и его приложение к предыдущему наименованию.
theological_decisions:
- issue: Различие божественного титула в греческом тексте 1 Ездры и масоретской параллели Ездры 1:2
  choice: Господь Израиля, Господь Всевышний
  alternative: Господь, Бог небес
  rationale: Основным источником служит греческий текст 1 Ездры. Отличающееся еврейское чтение приводится в сноске ради текстовой прозрачности, но не заменяет греческое чтение в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского указа. Синтаксис ясен обычному читателю; греческая титулатура и масштаб царского утверждения сохранены. Конечная запятая оставлена, поскольку стих представляет начало продолжающейся речи.
