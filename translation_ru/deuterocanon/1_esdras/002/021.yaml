base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/021.yaml
  text: 'Then the king wrote back to Rathymus[a], the recorder of the complaints, and to Beeltethmus, and to Samellius the scribe, and to the rest of their associates who lived in Samaria and Syria and Phoenicia[b], as follows:'
translation:
  language: ru
  text: 'Тогда царь написал в ответ Рафиму, записывавшему поступавшие дела[a], Веелтефму, писцу Самеллию и прочим их сотрудникам, жившим в Самарии, Сирии и Финикии[b], следующее:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «записывавшему представленные дела»; греческое административное выражение может относиться к донесениям, жалобам или иным материалам, поступавшим должностному лицу.'
    reason: lexical_alternative
  - marker: b
    text: Греческий текст называет получателей жившими в Самарии, Сирии и Финикии. Параллельная арамейская традиция в книге Ездры отличается именами и формулировками; здесь перевод следует греческому тексту 1 Ездры.
    reason: textual_variant
lexical_decisions:
- source_word: ἀντέγραψεν
  choice: написал в ответ
  rationale: Глагол обозначает письменный ответ; выбран естественный русский оборот, сохраняющий эпистолярный смысл.
- source_word: Ῥαθύμῳ
  choice: Рафиму
  rationale: Имя передано по греческой форме, без согласования с отличающейся формой в параллельной арамейской традиции.
- source_word: τῷ γράφοντι τὰ προσπίπτοντα
  choice: записывавшему поступавшие донесения
  rationale: Оборот описывает административную обязанность записывать то, что поступало или представлялось должностному лицу. Слово «донесения» естественно в контексте переписки, но не исключает значения представленных дел или жалоб.
- source_word: Βεελτέθμῳ
  choice: Веелтефму
  rationale: Сохранена греческая форма собственного имени, а не имя из отличающегося параллельного текста.
- source_word: Σαμελλίῳ γραμματεῖ
  choice: писцу Самеллию
  rationale: γραμματεύς в данном административном контексте означает писца или секретаря; «писец» прямо передаёт греческий термин и соответствует библейскому регистру.
- source_word: τοῖς λοιποῖς τοῖς συντασσομένοις
  choice: прочим их соратникам
  rationale: Причастие указывает на людей, действовавших или состоявших вместе с названными лицами, не уточняя их официальный ранг.
- source_word: οἰκοῦσιν
  choice: жившим
  rationale: Естественная русская передача причастия со значением постоянного проживания.
- source_word: ἐν Σαμαρείᾳ καὶ Συρίᾳ καὶ Φοινίκῃ
  choice: в Самарии, Сирии и Финикии
  rationale: Сохранены все три области, прямо названные в основном греческом свидетельстве.
- source_word: τὰ ὑπογεγραμμένα
  choice: следующее
  rationale: Обычная формула введения текста письма, буквально указывающая на написанное ниже.
