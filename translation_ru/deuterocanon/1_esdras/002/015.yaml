base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/015.yaml
  text: 'In the time of Artaxerxes king of the Persians[a], Belemus and Mithradates and Tabelius and Rathymus and Beeltethmus and Samellius the scribe, and the rest who were associated with them, living in Samaria and the other places[b], wrote the following letter against the inhabitants of Judea and Jerusalem:'
translation:
  language: ru
  text: 'Во времена Артаксеркса, царя персов, Белем, Митридат, Тавеллий, Ратим, Веелтетм, Самеллий-писец и остальные, действовавшие вместе с ними, жившие в Самарии и других местах, написали против жителей Иудеи и Иерусалима[a] следующее письмо[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая конструкция в выражении «написали против жителей Иудеи и Иерусалима» сжата и синтаксически трудна; по смыслу речь идёт о письменной жалобе или обвинении против этих жителей.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «написанное ниже письмо» или «прилагаемое письмо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς ἐπʼ Ἀρταξέρξου τοῦ Περσῶν βασιλέως χρόνοις
  choice: Во времена Артаксеркса, царя персов
  rationale: Передаёт временную формулу и явное греческое определение «царя персов», не уточняя сверх текста, что речь именно о годах царствования.
- source_word: κατέγραψεν
  choice: написали
  rationale: Глагол означает письменное изложение или запись; множественное число естественно согласует сказуемое с перечисленными авторами, тогда как направленность письма выражена оборотом «против жителей».
- source_word: αὐτῶν κατὰ τῶν κατοικούντων ἐν τῇ Ἰουδαίᾳ καὶ Ἱερουσαλήμ
  choice: против жителей Иудеи и Иерусалима
  rationale: κατά с родительным падежом передаёт враждебную или обвинительную направленность. Синтаксически трудное αὐτῶν не получает отдельного русского эквивалента, чтобы не создавать неясной связи; эта особенность отмечена в сноске.
- source_word: Βήλεμος καὶ Μιθραδάτης καὶ Ταβέλλιος καὶ Ῥάθυμος καὶ Βεέλτεθμος καὶ Σαμέλλιος
  choice: Белем, Митридат, Тавеллий, Ратим, Веелтетм, Самеллий
  rationale: Имена переданы русской транслитерацией греческих форм; для Митридата использована укоренившаяся русская форма имени.
- source_word: ὁ γραμματεύς
  choice: писец
  rationale: Сохраняет обычное значение γραμματεύς и допускает как писцовую, так и административную функцию, не заменяя её более узким словом «секретарь».
- source_word: οἱ λοιποὶ οἱ τούτοις συντασσόμενοι
  choice: остальные их сторонники
  rationale: Причастие указывает на людей, присоединившихся к названным лицам или действовавших вместе с ними; «сторонники» естественно передаёт эту связь без военного оттенка.
- source_word: οἰκοῦντες δὲ ἐν Σαμαρείᾳ καὶ τοῖς ἄλλοις τόποις
  choice: жившие в Самарии и других местах
  rationale: Прямо передаёт место проживания и сохраняет неопределённое указание на прочие места.
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: следующее письмо
  rationale: Буквально причастие означает «написанное ниже»; в современном русском «следующее письмо» естественно обозначает текст, который далее цитируется.
