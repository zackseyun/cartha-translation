base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/005.yaml
  text: Therefore[a], if any of you is from his people, may his Lord be with him[c][b], and let him go up to Jerusalem in Judea and build the house of the Lord of Israel—he is the Lord who dwells in Jerusalem.
translation:
  language: ru
  text: Итак, если кто из вас принадлежит к его народу, да будет с ним его Господь. Пусть он взойдёт в Иерусалим, что в Иудее, и пусть строят[a] дом Господа Израиля. Он — Господь, поселившийся в Иерусалиме[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте единственное число («если кто… да будет… пусть он взойдёт») сменяется множественным («пусть строят»). Перевод сохраняет этот переход, не сглаживая его.
    reason: textual_variant
  - marker: b
    text: 'Еврейский параллельный текст в этом месте заметно отличается: в нём говорится о помощи серебром, золотом, имуществом и скотом, а также о добровольном приношении для дома Бога в Иерусалиме. Здесь 1 Ездры следует иной греческой форме предания.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «устроивший жилище в Иерусалиме».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις ἐστὶν οὖν ὑμῶν
  choice: Итак, если кто из вас
  rationale: «Итак» передаёт выводный переход οὖν, а условная конструкция выражена естественно для современного русского языка.
- source_word: ἐκ τοῦ ἔθνους αὐτοῦ
  choice: принадлежит к его народу
  rationale: ἔθνος здесь обозначает народ как общность, а не современное политическое государство; глагол «принадлежит» делает русскую фразу естественной, не меняя отношения принадлежности.
- source_word: ἔστω ὁ κύριος αὐτοῦ μετʼ αὐτοῦ
  choice: да будет с ним его Господь
  rationale: Форма «да будет» сохраняет пожелательно-повелительную силу ἔστω. Слово «Бог» не добавлено, поскольку в греческом тексте стоит только κύριος.
- source_word: ἀναβὰς εἰς τὴν Ἰερουσαλὴμ τὴν ἐν τῇ Ἰουδαίᾳ
  choice: пусть он взойдёт в Иерусалим, что в Иудее
  rationale: «Взойдёт» сохраняет традиционное представление о восхождении в Иерусалим; причастие передано личной формой в соответствии с побудительным контекстом.
- source_word: οἰκοδομείτωσαν
  choice: пусть строят
  rationale: Сохранено множественное число греческого императива, хотя предшествующие формы стоят в единственном числе; необычный переход пояснён в сноске.
- source_word: τὸν οἶκον τοῦ κυρίου τοῦ Ἰσραήλ
  choice: дом Господа Израиля
  rationale: Передана необычная греческая конструкция без добавления отсутствующего слова θεός («Бог») и без гармонизации с другими формами предания.
- source_word: οὗτος ὁ κύριος ὁ κατασκηνώσας ἐν Ἰερουσαλήμ
  choice: Он — Господь, обитающий в Иерусалиме
  rationale: «Обитающий» естественно передаёт идею пребывания и устроения жилища, заключённую в κατασκηνόω, сохраняя отнесение Господа к Иерусалиму.
theological_decisions:
- issue: Передача κύριος применительно к Богу в тексте Септуагинты
  choice: Господь
  alternative: ГОСПОДЬ; Владыка
  rationale: Основным источником служит греческий текст с κύριος. Написание «ГОСПОДЬ» могло бы преждевременно отождествить форму с прямой передачей тетраграмматона, а «Владыка» здесь менее уместно.
- issue: Гармонизация заключительной фразы с еврейской традицией книги Ездры
  choice: Сохранить греческое утверждение «Он — Господь, обитающий в Иерусалиме»
  alternative: «Он — Бог, Который в Иерусалиме»
  rationale: Греческий текст прямо говорит о Господе, обитающем в Иерусалиме; его формулировка сохранена без подмены более привычным чтением параллельной традиции.
- issue: Несогласованность числа в греческом тексте
  choice: 'Сохранить переход от единственного числа к множественному: «пусть он взойдёт… и пусть строят»'
  alternative: 'Согласовать всё в единственном числе: «пусть он взойдёт… и построит»'
  rationale: Переход числа присутствует в засвидетельствованном греческом тексте и может отражать реальную текстовую или синтаксическую напряжённость; перевод не устраняет её молча.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаическая форма «да будет» сохранена как ясное и уместное выражение пожелания; остальная фраза построена современно. Необычный переход числа намеренно оставлен и пояснён.
