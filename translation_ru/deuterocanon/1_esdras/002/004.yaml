base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/004.yaml
  text: and he has appointed me to build a house for him in Jerusalem[b][a], which is in Judea.
translation:
  language: ru
  text: и поручил мне[a] построить для Него дом[b] в Иерусалиме, что в Иудее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повелел мне»; возможно также: «дал мне знать». Греческий глагол может означать как сообщение или указание, так и возложение поручения; еврейский параллельный текст яснее выражает Божье полномочие на строительство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «храм». Буквально в греческом: «дом» — обычное библейское обозначение храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσήμανέν
  choice: поручил
  rationale: В сочетании с инфинитивом глагол передаёт не только сообщение или указание, но и возложение поручения. Русское «поручил мне построить» естественно выражает данное полномочие, не усиливая смысл до безусловного «повелел».
- source_word: οἰκοδομῆσαι
  choice: построить
  rationale: Греческий инфинитив прямо означает «построить»; хотя контекст говорит о восстановлении святилища, приставочного значения «отстроить заново» в форме нет.
- source_word: αὐτῷ
  choice: для Него
  rationale: 'Дательный падеж выражает предназначение: дом должен быть построен для Бога. «Для Него» естественно передаёт посвящение дома.'
- source_word: οἶκον
  choice: дом
  rationale: В греческом стоит обычное слово «дом», употреблённое здесь в библейском смысле Божьего храма. Основной текст сохраняет образ исходника, а явное значение «храм» указано в сноске.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Общепринятая русская форма названия города.
- source_word: τῇ ἐν τῇ Ἰουδαίᾳ
  choice: что в Иудее
  rationale: Оборот приложительно уточняет местонахождение Иерусалима. Краткая русская конструкция сохраняет пояснительную функцию греческого выражения.
theological_decisions:
- issue: Передавать ли οἶκον буквальным «дом» или поясняющим «храм»
  choice: дом
  alternative: храм
  rationale: Греческий текст сохраняет образ дома, а контекст позволяет понять, что речь идёт о святилище. Вариант «храм» полезен как пояснение, но в основном тексте был бы более истолковывающим.
- issue: Насколько сильно передавать ἐσήμανέν в контексте Божьего поручения
  choice: поручил мне
  alternative: повелел мне; дал мне знать
  rationale: Глагол допускает значения сообщения, указания и возложения поручения. «Поручил» передаёт полномочие на строительство, но не превращает неоднозначный греческий глагол в однозначное прямое повеление.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-нейтральным синтаксисом. Формулировка сохраняет библейский образ «дома» и географическое уточнение исходника. Местоимение «Него» написано с прописной буквы как уважительное указание на Бога; это не меняет смысла греческого текста.
