base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/008.yaml
  text: And those around them helped in every way[a], with silver and gold, with horses, with livestock, and with very many freewill offerings[c][b], from all whose mind had been stirred.
translation:
  language: ru
  text: А все, кто был вокруг них, всячески помогали им серебром и золотом, конями[a], скотом и весьма многими молитвами тех многих, чей ум был пробуждён[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейской параллели (Езд. 1:6) здесь говорится об имуществе, а не о конях.
    reason: alternative_reading
  - marker: b
    text: Греческое слово может означать также «обеты»; в еврейской параллели сказано о драгоценных или отборных дарах.
    reason: textual_variant
  - marker: c
    text: 'Или: «чей дух был пробуждён»; таков образ в еврейской параллели. В греческом тексте буквально говорится об уме (или разуме).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περικύκλῳ αὐτῶν
  choice: жившие вокруг них
  rationale: Передаёт окружающих их людей без сужения до непосредственных соседей.
- source_word: ἐβοήθησαν ἐν πᾶσιν
  choice: всячески помогали им
  rationale: Естественно передаёт всесторонний характер помощи; дополнение «им» ясно из контекста и русской синтаксической нормы.
- source_word: ἐν ἀργυρίῳ καὶ χρυσίῳ
  choice: серебром и золотом
  rationale: Творительный падеж естественно выражает инструментальное значение греческого ἐν.
- source_word: ἵπποις
  choice: конями
  rationale: Прямое значение греческого слова; отличие еврейской параллели отмечено в сноске.
- source_word: κτήνεσιν
  choice: скотом
  rationale: Общее и понятное обозначение домашних хозяйственных животных.
- source_word: εὐχαῖς ὡς πλείσταις
  choice: многочисленными приношениями по обету
  rationale: εὐχή может означать молитву или обет; в перечне материальной помощи выражение уместнее понимать как связанные с обетами приношения, не скрывая буквального значения и расхождения с еврейской параллелью в сноске.
- source_word: πολλῶν ὧν ὁ νοῦς ἠγέρθη
  choice: от многих, чей разум был пробуждён
  rationale: Сохраняет греческие «многие», νοῦς («разум») и пассивный образ внутреннего пробуждения, не заменяя его еврейским «дух».
theological_decisions:
- issue: Расхождение греческого текста и еврейской параллели в перечне помощи
  choice: 'Следовать греческому первичному свидетелю: «кони» и εὐχαί, последнее контекстуально передать как «приношения по обету».'
  alternative: 'Гармонизировать с Ездрой 1:6: «имущество» и «драгоценные дары».'
  rationale: Для 1 Ездры исходным является греческий текст; существенные варианты еврейской параллели сохраняются в примечаниях.
- issue: Обозначение внутренней способности, которая была пробуждена
  choice: «разум был пробуждён»
  alternative: «дух был пробуждён»
  rationale: Греческое νοῦς означает разум или ум; «дух» отражает еврейскую параллель, но не должен подменять основной греческий текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет несколько необычное присоединение заключительной греческой фразы через тире, не устраняя её неоднозначность.
