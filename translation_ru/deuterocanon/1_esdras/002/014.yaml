  source_fidelity: 'Передача страдательного аориста ἀνηνέχθη («было доставлено»), агента ὑπὸ Σαμανασσάρου, а также направления «из Вавилона в Иерусалим» в целом точна. «Саманассар» обоснованно сохраняет форму греческого текста; осторожное отождествление в примечании не выдается за чтение оригинала. Однако «вышедшими из плена» несколько сильнее, чем τοῖς ἐκ τῆς αἰχμαλωσίας: греческое выражение характеризует людей как происходящих из плена/изгнания, не обязательно прямо утверждая их выход в данном месте.'
