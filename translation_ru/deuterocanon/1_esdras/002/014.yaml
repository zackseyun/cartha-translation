  text: and it was brought up by Sheshbazzar together with those from the captivity[b][a], from Babylon to Jerusalem.
translation:
  language: ru
  text: И это[b] было доставлено Саманассаром[a] вместе с теми, кто был уведён в плен, из Вавилона в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Саманассаром». Вероятно, имеется в виду Шешбаццар, упоминаемый в соответствующем повествовании книги Ездры.'
    reason: alternative_reading
  - marker: b
    text: Греческий глагол стоит в единственном числе («было доставлено»), но сам предмет в этом предложении не назван и подразумевается из предыдущего контекста.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνηνέχθη
  choice: было доставлено
  rationale: Аорист страдательного залога от ἀναφέρω. «Было доставлено» естественно передаёт перенос предмета; направление движения к Иерусалиму прямо выражено далее и не требует отдельного «поднято».
- source_word: ὑπὸ Σαμανασσάρου
  choice: Саманассаром
  rationale: Передана собственно греческая форма имени Σαμανασσάρος, поскольку греческий текст является основным источником. Отождествление с Шешбаццаром сообщается в примечании, а не подменяет исходную форму в основном тексте.
- source_word: ἅμα τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: вместе с вышедшими из плена
  rationale: ἅμα с дательным означает «вместе с», а выражение οἱ ἐκ τῆς αἰχμαλωσίας обозначает людей, пришедших или вышедших из состояния плена. Формулировка близка к греческому и звучит естественно по-русски.
- source_word: ἐκ Βαβυλῶνος
  choice: из Вавилона
  rationale: Прямо передаёт исходный пункт движения.
- source_word: εἰς Ἱερουσαλήμ
  choice: в Иерусалим
  rationale: Обычная русская передача направления движения, выраженного εἰς.
theological_decisions:
- issue: Отождествление Σαμανασσάρος с Шешбаццаром
  choice: Сохранить в основном тексте греческую форму «Саманассар», указав вероятное отождествление в сноске
  alternative: Передать в основном тексте как «Шешбаццар»
  rationale: Такой выбор сохраняет первичность греческого свидетельства и одновременно позволяет читателю увидеть связь с параллельным повествованием Ездры, не представляя текстологическое отождествление как бесспорную форму самого греческого текста.
- issue: Не названное в греческом тексте подлежащее единственного числа
  choice: Передать местоимением «это» и пояснить грамматику в сноске
  alternative: Восстановить конкретное существительное, например «сосуд» или «всё это»
  rationale: Форма ἀνηνέχθη стоит в единственном числе, но существительное в данном предложении не повторено. Нейтральное «это» сохраняет связность и не уточняет предмет сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сохраняет последовательность греческого сообщения, но избегает архаизмов. Форма имени в основном тексте следует греческому источнику; знакомая по Ездре форма вынесена в примечание.
