base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/010.yaml
  text: Then Cyrus king of the Persians brought them out and handed them over to Mithridates[b][a], his treasurer.
translation:
  language: ru
  text: Тогда Кир, царь персов, вынес их[a] и передал их Митридату, своему казначею[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храмовые сосуды, упомянутые в предыдущем стихе.
    reason: cross_reference
  - marker: b
    text: 'Или: «хранителю его сокровищницы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: вынес
  rationale: Глагол означает вынести или вывести наружу; «вынес» естественно описывает извлечение упомянутых сосудов и согласуется с еврейской параллелью הוֹצִיא.
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: Кир, царь персов
  rationale: Передача близко следует греческой конструкции и сохраняет множественное этническое обозначение Περσῶν.
- source_word: παρέδωκεν
  choice: передал
  rationale: Глагол обозначает официальную передачу в чьё-либо ведение, что точнее простого «дал».
- source_word: Μιθριδάτῃ
  choice: Митридату
  rationale: Устоявшаяся русская передача греческого личного имени Μιθριδάτης в форме дательного падежа.
- source_word: τῷ ἑαυτοῦ γαζοφύλακι
  choice: своему казначею
  rationale: γαζοφύλαξ обозначает должностное лицо, ведающее сокровищницей; «казначей» кратко и естественно передаёт эту административную функцию, а «своему» отражает ἑαυτοῦ.
- source_word: αὐτά
  choice: их
  rationale: Местоимение отсылает к храмовым сосудам из предыдущего стиха. Повтор «их» сохранён в обеих греческих глагольных конструкциях.
- source_word: δὲ
  choice: тогда
  rationale: В повествовательной последовательности частица служит переходом к следующему действию; «тогда» естественно передаёт эту связь без придания ей резкого противопоставления.
