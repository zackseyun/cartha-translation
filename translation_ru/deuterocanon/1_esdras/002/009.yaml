  source_fidelity: 'Текст точно передаёт греческий оригинал: «вынес» соответствует ἐξήνεγκεν, «священные сосуды Господа» — τὰ ἅγια σκεύη τοῦ κυρίου, «увёз из Иерусалима» — μετήγαγεν ἐξ Ἱερουσαλήμ, а «поместил» — ἀπηρείσατο. «В своём капище» обоснованно передаёт культово-идолопоклоннический оттенок ἐν τῷ εἰδώλιῳ αὐτοῦ, не подменяя греческое чтение более нейтральной формой еврейской параллели.'
