base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/009.yaml
  text: And King Cyrus brought out the holy vessels of the Lord[a], which Nebuchadnezzar had carried away from Jerusalem and deposited in the house of his god.
translation:
  language: ru
  text: И царь Кир вынес священные сосуды Господа, которые Навуходоносор увёз из Иерусалима и поместил в своём капище[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое слово может означать «святилище идола» или «храм идола»; в параллельном еврейском тексте: «в доме своего бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: вынес
  rationale: Глагол обозначает вынесение предметов из места хранения; «вынес» точно и естественно передаёт действие Кира.
- source_word: τὰ ἅγια σκεύη
  choice: священные сосуды
  rationale: Сочетание указывает на храмовые сосуды, посвящённые Богу; «священные» ясно передаёт их культовый статус.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Родительный падеж выражает принадлежность сосудов Господу; написание с прописной буквы соответствует обозначению Бога Израиля.
- source_word: μετήγαγεν
  choice: увёз
  rationale: Глагол означает перемещение из одного места в другое; в контексте захвата Иерусалима «увёз» кратко и естественно передаёт насильственный вывоз.
- source_word: ἀπηρείσατο
  choice: поместил
  rationale: В данном контексте речь идёт о размещении захваченных сосудов в культовом здании; «поместил» не добавляет не выраженной в тексте цели хранения.
- source_word: ἐν τῷ εἰδώλιῳ αὐτοῦ
  choice: в своём капище
  rationale: Греческое εἰδώλιον обозначает святилище или храм идола. «Капище» сохраняет более резкую идолопоклонническую окраску греческого текста, тогда как параллельный еврейский текст сформулирован нейтральнее.
theological_decisions:
- issue: Передача κύριος в контексте храмовых сосудов
  choice: Господь
  alternative: Яхве
  rationale: Исходный греческий текст содержит κύριος, а не тетраграмматон; «Господь» сохраняет форму греческого свидетельства и не подменяет её реконструкцией по еврейской параллели.
- issue: Соотношение греческого εἰδώλιον и еврейской параллели
  choice: в своём капище
  alternative: в доме своего бога
  rationale: Перевод следует прежде всего греческому источнику и сохраняет присущую εἰδώλιον оценочную связь с идолом. Более нейтральное чтение еврейской параллели приведено в примечании, чтобы не скрывать текстуальное различие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохранён близким к греческому, но остаётся естественным для русского читателя; оценочная окраска греческого εἰδώλιον не сглажена по еврейской параллели.
