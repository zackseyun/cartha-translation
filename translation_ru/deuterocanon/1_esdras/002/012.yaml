base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/012.yaml
  text: 'And this was their number: a thousand gold libation bowls[a], a thousand silver libation bowls, twenty-nine silver censers, thirty gold bowls, two hundred and ten silver bowls[b], and a thousand other vessels.'
translation:
  language: ru
  text: 'И вот их число: тысяча золотых чаш для возлияний, тысяча серебряных чаш для возлияний, двадцать девять серебряных кадильниц, тридцать золотых чаш, двести десять серебряных чаш[a] и тысяча других сосудов[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цифровая запись числа серебряных чаш в дипломатическом издании греческого текста Суита трудна для истолкования. Здесь она передана как «двести десять», хотя дошедшая форма не вполне ясна.
    reason: textual_variant
  - marker: b
    text: В еврейском параллельном тексте Ездры 1:9 в этом месте перечислены иные предметы и числа. По-видимому, 1 Ездры сохраняет перестроенную или расширенную греческую форму описи, а не дословное соответствие еврейскому тексту.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ τούτων ἀριθμὸς ἦν
  choice: И вот их число
  rationale: Естественная современная формула, вводящая перечень и сохраняющая указательное значение τούτων.
- source_word: σπονδεῖα
  choice: чаши для возлияний
  rationale: Передаёт связь со σπονδή и ясно указывает на культовое назначение предметов, не прибегая к малопонятному термину.
- source_word: χρυσᾶ / ἀργυρᾶ
  choice: золотые / серебряные
  rationale: Обычные русские определения материала, соответствующие греческим прилагательным.
- source_word: θυίσκαι ἀργυραῖ
  choice: серебряные кадильницы
  rationale: В храмовой описи θυίσκη обозначает сосуд или принадлежность для воскурения; «кадильницы» кратко и понятно передаёт вероятную функцию.
- source_word: φιάλαι
  choice: чаши
  rationale: φιάλη — широкая неглубокая ритуальная чаша; современное «чаши» здесь естественнее архаичных или чрезмерно специальных вариантов.
- source_word: ἀργυραῖ ,βυʹ δέκα
  choice: двести десять серебряных чаш
  rationale: Следует принятому в консультационном слое прочтению трудной цифровой записи как 210, при этом неясность рукописной передачи отмечена в сноске.
- source_word: ἄλλα σκεύη
  choice: другие сосуды
  rationale: В контексте храмовой описи σκεύη обозначает различные сосуды и принадлежности; «сосуды» сохраняет предметный и культовый характер перечня.
