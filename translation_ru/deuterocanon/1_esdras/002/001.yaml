base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/001.yaml
  text: In the first year of Cyrus king of Persia[a], for the fulfillment of the word of the Lord by the mouth of Jeremiah,
translation:
  language: ru
  text: В первый год царствования Кира, царя Персии, для исполнения слова Господа[a], изречённого устами Иеремии,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском параллельном тексте здесь стоит священное имя Бога — YHWH.
    reason: Уточнение значимого различия между основным греческим текстом Κυρίου и еврейской параллелью с יהוה.
lexical_decisions:
- source_word: Βασιλεύοντος Κύρου Περσῶν ἔτους πρώτου
  choice: В первый год царствования Кира над персами
  rationale: Генитивный абсолют вместе с ἔτους πρώτου задаёт время действия. Такая формулировка естественна по-русски и близко передаёт греческое «когда Кир царствовал над персами, в первый год»; параллельный еврейский текст подтверждает, что речь идёт о первом годе правления Кира.
- source_word: εἰς συντέλειαν
  choice: чтобы исполнилось
  rationale: Оборот выражает цель или результат — осуществление ранее данного пророческого слова. Русское «чтобы исполнилось» естественно в данном контексте и сохраняет направленность греческого εἰς.
- source_word: ῥήματος Κυρίου
  choice: слово Господа
  rationale: Это прямое и устойчивое соответствие греческому выражению; основной текст следует чтению Κυρίου, а не напрямую форме божественного имени в еврейской параллели.
- source_word: ἐν στόματι Ἰερεμίου
  choice: изречённое устами Иеремии
  rationale: Сохранён конкретный библейский образ «устами Иеремии», а добавленное по-русски причастие ясно показывает, что Господне слово было возвещено через пророка.
theological_decisions:
- issue: Передача Κυρίου при наличии יהוה в еврейском параллельном тексте
  choice: Господа
  alternative: ГОСПОДА
  rationale: Основным источником служит греческий текст, где стоит Κυρίου, поэтому в основном тексте выбрано «Господа». Наличие божественного имени YHWH в еврейской параллели отмечено в сноске без подмены греческого чтения.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранена незавершённость синтаксиса исходного фрагмента: стих продолжается далее.'
