base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/016.yaml
  text: 'To King Artaxerxes our lord: your servants[a], Rathymus, the one over records, and Samellius the scribe, and the rest of their council[c][b], and those in Coele-Syria and Phoenicia.'
translation:
  language: ru
  text: '«Царю Артаксерксу, господину нашему, — твои слуги: Ратим[a], ведающий поступающими делами[b], Самеллий[a], писец, остальные члены их совета и находящиеся в Келесирии[c] и Финикии».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческим именам Ратим и Самеллий приблизительно соответствуют Рехум и Шимшай в параллельном арамейском тексте.
    reason: alternative_reading
  - marker: b
    text: 'Греческое обозначение должности не вполне ясно; буквально: «ведающий тем, что поступает [на рассмотрение]».'
    reason: lexical_alternative
  - marker: c
    text: Келесирия — историческое название области в греческом тексте.
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεῖ Ἀρταξέρξῃ κυρίῳ
  choice: Царю Артаксерксу, господину нашему
  rationale: Дательный падеж оформляет адрес письма; κύριος передан как придворный титул. Притяжательное «нашему» контекстуально выражает почтительность отправителей, хотя в греческом оно не названо прямо.
- source_word: οἱ παῖδές σου
  choice: твои слуги
  rationale: В царской переписке παῖδες обозначает подчинённых или служащих, а не детей; «слуги» сохраняет официальный смысл без излишнего акцента на рабском статусе.
- source_word: Ῥάθυμος
  choice: Ратим
  rationale: Имя передано по основной греческой форме; соответствие с арамейским Рехумом отмечено в сноске.
- source_word: ὁ τὰ προσπίπτοντα
  choice: ведающий поступающими делами
  rationale: Буквально трудная административная формула относится к должностному лицу, ведавшему делами, которые поступали на рассмотрение. Перевод сохраняет неопределённость конкретной должности и не подменяет её позднейшим точным титулом.
- source_word: Σαμέλλιος ὁ γραμματεὺς
  choice: Самеллий, писец
  rationale: Греческая форма имени сохранена как основная; γραμματεύς в административном контексте естественно передаётся традиционным и понятным словом «писец».
- source_word: οἱ ἐπίλοιποι τῆς βουλῆς αὐτῶν
  choice: остальные члены их совета
  rationale: 'Развёрнутая формулировка ясно передаёт собирательный смысл: речь идёт об остальных людях, входящих в их совещательный орган.'
- source_word: οἱ ἐν κοίλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: находящиеся в Келесирии и Финикии
  rationale: Κοίλη Συρία — историческое географическое название, переданное принятой русской формой «Келесирия», а не обобщённым «Сирия».
