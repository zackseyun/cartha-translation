base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/015.yaml
  text: because he had turned the counsel of the king of Assyria toward them[a], to strengthen their hands in the work of the Lord, the God of Israel.
translation:
  language: ru
  text: потому что Он обратил замысел царя Ассирии к ним[a], чтобы укрепить их руки в делах Господа, Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: И греческий текст, и еврейская параллель говорят о «царе Ассирии», хотя в более широком контексте книги Ездры речь идёт о персидском правителе. Перевод сохраняет формулировку источника и не гармонизирует её с этим историческим контекстом.
    reason: alternative_reading
lexical_decisions:
- source_word: μετέστρεψεν
  choice: обратил
  rationale: Аорист означает поворот или изменение направленности; «обратил» естественно передаёт действие Бога без излишнего уточнения.
- source_word: τὴν βουλήν
  choice: замысел
  rationale: βουλή может обозначать совет, намерение или замысел. В отношении царя современное русское «замысел» сохраняет смысл его решения или намерения и звучит естественнее буквального «совет».
- source_word: τοῦ βασιλέως Ἀσσυρίων
  choice: царя Ассирии
  rationale: Греческий текст буквально называет царя ассирийцев; еврейская параллель также говорит о царе Ассирии. Историческая гармонизация с Персией не вносится.
- source_word: ἐπʼ αὐτούς
  choice: к ним
  rationale: Предлог с винительным выражает направленность. «К ним» сохраняет неоднозначность и не разворачивает выражение в толкование «в их пользу».
- source_word: κατισχῦσαι τὰς χεῖρας αὐτῶν
  choice: укрепить их руки
  rationale: Сохранён греческий и семитский библейский образ, означающий придать силы и решимость к труду; он понятен по контексту.
- source_word: ἐπὶ τὰ ἔργα Κυρίου θεοῦ Ἰσραήλ
  choice: в делах Господа, Бога Израиля
  rationale: τὰ ἔργα имеет форму множественного числа, поэтому передано как «делах». Оборот с ἐπί передаёт участие в этих делах; приложение «Бога Израиля» ясно соотнесено с Господом.
theological_decisions:
- issue: Передача Κυρίου
  choice: Господа
  alternative: ГОСПОДА
  rationale: Основной греческий источник содержит κύριος, поэтому употреблено обычное русское «Господь», без переноса типографического обозначения еврейского тетраграмматона из параллельного текста.
- issue: Исторический титул «царь Ассирии»
  choice: сохранить «царя Ассирии»
  alternative: царь Персии; царь
  rationale: И греческий основной текст, и еврейская параллель содержат это наименование. Замена ради исторической гармонизации устранила бы подлинную особенность источника.
- issue: Подразумеваемое подлежащее μετέστρεψεν
  choice: Он
  alternative: Господь
  rationale: В данном фрагменте подлежащее выражено местоименно по контексту. Прописная буква обозначает отсылку к Богу, не добавляя имени, отсутствующего в греческой фразе.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Сохранены понятные традиционные обороты «укрепить их руки» и «Господь, Бог Израиля»; синтаксис сделан плавным, но неоднозначность направленности царского замысла не снята.
