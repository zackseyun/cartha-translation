base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/011.yaml
  text: and all the sons of the captivity[a], because they had purified themselves. For all the Levites together had purified themselves, all of them[b],
translation:
  language: ru
  text: и все сыны плена[a], потому что они очистились. Ибо все левиты все вместе очистились, все до одного[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети плена»; по смыслу: «изгнанники» или «бывшие пленники».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза здесь не завершена по смыслу и, по-видимому, продолжается далее. Слово, переведённое как «очистились», можно также передать: «были очищены».'
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ τῆς αἰχμαλωσίας
  choice: сыны плена
  rationale: Формально близкая передача сохраняет традиционное обозначение общины, связанной с пленом; более гладкое «возвратившиеся из плена» добавило бы отсутствующую в греческом тексте мысль о возвращении.
- source_word: ἡγνίσθησαν
  choice: очистились
  rationale: В данном культовом контексте глагол обозначает обрядовое очищение. Возвратная форма естественна по-русски и передаёт сознательную подготовку к богослужению, не исключая пассивного понимания греческой формы.
- source_word: λευεῖται
  choice: левиты
  rationale: Устоявшееся русское наименование этой группы служителей.
- source_word: ἅμα πάντες
  choice: все… вместе
  rationale: Передаёт как совместность действия, так и полноту состава; заключительное «все до одного» сохраняет повтор πάντες в греческом тексте.
theological_decisions:
- issue: Характер очищения
  choice: очистились
  alternative: были очищены
  rationale: Контекст указывает прежде всего на обрядовую готовность к богослужению, а не на абстрактное внутреннее нравственное обновление. При этом средне-пассивная греческая форма допускает оба синтаксических понимания, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционного общинного выражения «сыны плена». Повтор всеобщности у левитов воспроизведён естественным оборотом «все до одного». Начальная строчная буква и конечная запятая отражают фрагментарность стиха и его синтаксическую связь с соседним контекстом.
