base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/001.yaml
  text: Then Sisinnes[a], governor of Coele-Syria and Phoenicia, and Sathrabuzanes and their associates, following what had been commanded by King Darius[b],
translation:
  language: ru
  text: Тогда Сисинний, правитель Келесирии[a] и Финикии, Сафравузан и их соратники[b], исполняя повеления царя Дария,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Келесирия — официальное историческое название области; греческое выражение здесь не означает просто «полая Сирия».
    reason: cultural_note
  - marker: b
    text: 'Или: «спутники», «партнёры». Греческое слово может обозначать соратников, партнёров или спутников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный временной переход, вводящий следующее действие повествования.
- source_word: Σισίννης
  choice: Сисинн
  rationale: Имя передано в форме, естественной для русской библейской традиции и близкой греческому написанию.
- source_word: ἔπαρχος
  choice: правитель
  rationale: Передаёт гражданскую административную должность, не привнося более узкого римского значения слова «префект».
- source_word: κοίλης Συρίας
  choice: Келесирии
  rationale: Это собственное историко-географическое название области, а не описательное выражение «полая Сирия».
- source_word: Φοινίκης
  choice: Финикии
  rationale: Употреблена общепринятая русская форма географического названия.
- source_word: Σαθραβούζανης
  choice: Сафравузан
  rationale: Имя передано согласно традиционной русской передаче греческой θ через «ф» и в форме, принятой в русской библейской традиции.
- source_word: οἱ συνέταιροι
  choice: их соратники
  rationale: Слово обозначает связанных с названными должностными лицами товарищей, партнёров или помощников; местоимение «их» естественно выражает эту связь, не уточняя её характера.
- source_word: κατακολουθήσαντες
  choice: следуя
  rationale: Сохраняет причастную связь с последующим действием и значение согласования своих действий с распоряжениями.
- source_word: τοῖς ὑπὸ τοῦ βασιλέως Δαρείου προσταγεῖσιν
  choice: повелениям царя Дария
  rationale: Естественная русская передача пассивной конструкции «тому, что было повелено царём Дарием» без утраты смысла.
