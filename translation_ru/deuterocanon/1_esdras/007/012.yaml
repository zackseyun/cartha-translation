base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/012.yaml
  text: And they sacrificed the Passover for all the sons of the captivity[a], and for their brothers the priests[b], and for themselves.
translation:
  language: ru
  text: И они закололи пасхальную жертву[b] для всех сынов плена[a], для своих братьев-священников и для самих себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для всех изгнанников». Буквально по-гречески: «для всех сынов плена» — так названа община возвратившихся из плена.'
    reason: lexical_alternative
  - marker: b
    text: Под «пасхальной жертвой» здесь понимается жертва, закалываемая на Пасху; слово «агнец» в греческом тексте прямо не употреблено.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυσαν
  choice: закололи
  rationale: Глагол θύω обозначает заклание или принесение жертвы. В пасхальном контексте «закололи» точно передаёт конкретное жертвенное действие и естественно сочетается с «пасхальной жертвой».
- source_word: τὸ πάσχα
  choice: пасхальную жертву
  rationale: В сочетании с θύω слово πάσχα указывает на пасхальную жертву, хотя само по себе может обозначать и праздник Пасхи. Такой перевод сохраняет жертвенный смысл, не добавляя отсутствующего в греческом тексте слова «агнец».
- source_word: πᾶσιν τοῖς υἱοῖς τῆς αἰχμαλωσίας
  choice: для всех сынов плена
  rationale: Формально близкое выражение сохраняет корпоративный образ греческого текста и обозначает общину возвратившихся из плена. Более гладкое «для всех бывших пленников» истолковывает идиому и ослабляет её семейно-общинную окраску.
- source_word: ἀδελφοῖς αὐτῶν τοῖς ἱερεῦσιν
  choice: для своих братьев-священников
  rationale: 'Дефисное сложение естественно для современного русского языка и ясно передаёт приложение: речь идёт об их братьях, которые были священниками. Оно также сохраняет семейно-общинный оттенок ἀδελφοῖς.'
- source_word: ἑαυτοῖς
  choice: для самих себя
  rationale: Прямая передача возвратного местоимения в дательном падеже сохраняет последовательность групп, для которых была приготовлена жертва.
theological_decisions:
- issue: Мужская корпоративная лексика в τοῖς υἱοῖς и ἀδελφοῖς
  choice: Сохранить в основном тексте «сынов» и «братьев»
  alternative: «изгнанников», «пленников», «соплеменников»
  rationale: Греческие формы имеют мужской род и одновременно могут обозначать общину корпоративно. Сохранение исходных образов не исключает широкого общинного охвата, который поясняется в сноске, и не вносит дополнительного богословского толкования.
- issue: Значение πάσχα после θύω
  choice: «пасхальную жертву» без уточнения вида животного
  alternative: «пасхального агнца» или «Пасху»
  rationale: Контекст требует жертвенного значения, однако греческий текст прямо не называет агнца. Выбранная формулировка сохраняет эту границу и не смешивает жертву со всем празднованием Пасхи.
translation_notes:
  register: Современный литературный русский с умеренно библейской образностью. «Сыны плена» сохраняет исходную корпоративную идиому, а сноска разъясняет её современному читателю. «Закололи пасхальную жертву» звучит ясно и достойно, сохраняя культовую конкретность греческого текста.
