base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/009.yaml
  text: And the priests and the Levites stood arrayed by divisions for the works of the Lord God of Israel[a], in accordance with the book of Moses[b], and the gatekeepers at each gate.
translation:
  language: ru
  text: И священники и левиты в облачениях заняли свои места по отделениям[a] для совершения дел Господа, Бога Израиля, согласно книге Моисея[b], а привратники — при каждом входе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по племенам» или «по коленам»; здесь, вероятно, имеются в виду упорядоченные отделения священников и левитов для служения.'
    reason: lexical_alternative
  - marker: b
    text: Приблизительная еврейская параллель говорит об укреплении их рук в работе над домом Бога; греческий текст здесь описывает установленное книгой Моисея размещение священников и левитов для дел Господа, Бога Израиля.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστησαν
  choice: заняли свои места
  rationale: В данном контексте глагол обозначает не просто положение стоя, а упорядоченное размещение для служения; выражение естественно по-русски и не вводит идеи назначения извне.
- source_word: ἐστολισμένοι
  choice: в облачениях
  rationale: Причастие указывает на соответствующую одежду или торжественное убранство. «В облачениях» передаёт культовый контекст, не уточняя деталей одеяния, которых нет в греческом тексте.
- source_word: κατὰ φυλάς
  choice: по отделениям
  rationale: Буквально — «по племенам/коленам», но применительно к священникам и левитам выражение, вероятно, обозначает организованные группы служения. Буквальная возможность сохранена в сноске.
- source_word: ἐπὶ τῶν ἔργων
  choice: для совершения дел
  rationale: Предлог с родительным может обозначать сферу ответственности. Формулировка сохраняет широкое «дела», не сводя его безусловно к обязанностям или храмовой службе.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: Господа, Бога Израиля
  rationale: Запятая естественно передаёт приложение и стандартный библейский титул, сохраняя κύριος как «Господь» согласно греческому источнику.
- source_word: ἀκολούθως τῇ Μωσέως βίβλῳ
  choice: согласно книге Моисея
  rationale: Кратко и естественно выражает соответствие письменным предписаниям Моисея.
- source_word: θυρωροί
  choice: привратники
  rationale: Устоявшееся и понятное русское обозначение служителей, охранявших храмовые входы.
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: у каждых ворот
  rationale: Передаёт распределительное значение ἑκάστου и местонахождение привратников при каждом входе.
theological_decisions:
- issue: Передача κύριος при наличии еврейской параллели с именем YHWH
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основным источником стиха служит греческий текст с Κυρίου. Поэтому в основной текст не переносится особое оформление имени YHWH из приблизительной еврейской параллели.
- issue: Характер «дел Господа, Бога Израиля»
  choice: сохранено широкое обозначение «дела»
  alternative: «служение Господу, Богу Израиля» или «работы в доме Бога»
  rationale: Греческое ἔργων допускает понимание как работ, дел или служебных обязанностей. Более конкретное упоминание дома Бога относится к иной, приблизительной еврейской параллели и не должно подменять греческое чтение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность греческого стиха, а эллипсис в последней части передан тире. Формулировки избегают как архаизма «по чредам», так и чрезмерно административного «были распределены».
