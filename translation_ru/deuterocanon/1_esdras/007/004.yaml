base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/004.yaml
  text: And they completed these things by the decree of the Lord[a], the God of Israel, and with the approval of Cyrus and Darius and Artaxerxes[b], kings of the Persians.
translation:
  language: ru
  text: И они завершили всё это по повелению Господа, Бога Израиля, и с одобрения[a] Кира, Дария и Артаксеркса, царя персов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с согласия»; возможно также: «согласно решению».'
    reason: Лексема γνώμη допускает значения согласия, решения, намерения или мнения.
  - marker: b
    text: В греческом тексте — «царя персов» в единственном числе. Формально титул относится к Артаксерксу, хотя по смыслу может характеризовать всех трёх названных правителей как персидских царей.
    reason: Сохранена грамматическая и смысловая неоднозначность греческого текста.
lexical_decisions:
- source_word: συνετέλεσαν
  choice: завершили
  rationale: Глагол означает доведение дела до конца; «завершили» точно и естественно передаёт результативность.
- source_word: ταῦτα
  choice: всё это
  rationale: Передаёт множественное указательное местоимение собирательно и естественно по-русски, не добавляя отсутствующего в греческом уточнения «дела».
- source_word: διὰ προτάγματος
  choice: по повелению
  rationale: Сохраняет инструментальный смысл διά и официальный характер πρόταγμα; «повеление» уместно как для Божьего распоряжения, так и для высокого библейского регистра.
- source_word: τοῦ κυρίου θεοῦ Ἰσραήλ
  choice: Господа, Бога Израиля
  rationale: Приложение «Бога Израиля» сохранено явно; пунктуация делает структуру естественной и недвусмысленной по-русски.
- source_word: μετὰ τῆς γνώμης
  choice: с одобрения
  rationale: В административном контексте γνώμη обозначает согласие, решение или санкцию правителей; «с одобрения» естественно выражает официальное согласие, не превращая его в отдельный указ.
- source_word: Κύρου καὶ Δαρείου καὶ Ἀρταξέρξου
  choice: Кира, Дария и Артаксеркса
  rationale: Использованы устоявшиеся русские формы библейских имён.
- source_word: βασιλέως Περσῶν
  choice: царя персов
  rationale: Формально переданы греческое единственное число βασιλέως и родительный множественного Περσῶν; непосредственное присоединение к Артаксерксу сохраняет синтаксическую неоднозначность.
theological_decisions:
- issue: Соотношение Божьего повеления и разрешения имперских правителей
  choice: Завершение представлено как совершившееся по Божьему повелению и одновременно с одобрения персидских правителей.
  alternative: Одобрение царей можно понимать лишь как подчинённое средство исполнения Божьего повеления.
  rationale: Греческий текст координирует две предложные конструкции и не сводит одну к другой; перевод сохраняет это напряжение без дополнительного богословского объяснения.
- issue: К кому относится титул βασιλέως Περσῶν
  choice: 'Сохранено единственное число: «царя персов».'
  alternative: 'По смыслу титул может относиться ко всем трём названным правителям: «царей персов».'
  rationale: Греческая форма стоит в единственном числе и формально следует за именем Артаксеркса, хотя контекст допускает распространение характеристики на всех трёх.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союзное начало «И они» сохраняет связь с предыдущим контекстом; формулировки понятны без специальной церковной лексики.
