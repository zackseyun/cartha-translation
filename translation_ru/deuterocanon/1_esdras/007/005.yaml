base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/005.yaml
  text: The house was completed by the twenty-third day of the month Adar[b][a], in the sixth year of King Darius.
translation:
  language: ru
  text: Дом[a] был завершён к двадцать третьему дню месяца адара[b], в шестой год царя Дария.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храм; в греческом тексте буквально «дом».
    reason: cross_reference
  - marker: b
    text: 'Буквально: «до третьего и двадцатого дня месяца адара».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνετελέσθη
  choice: был завершён
  rationale: Аорист пассивного залога от συντελέω обозначает достижение завершения; русский пассив сохраняет форму и смысл греческого текста.
- source_word: ὁ οἶκος
  choice: храм
  rationale: Буквально «дом», но в данном контексте речь идёт о храме; «храм» естественно и недвусмысленно передаёт референт.
- source_word: ἕως τρίτης καὶ εἰκάδος
  choice: к двадцать третьему дню
  rationale: Буквально «до третьего и двадцатого»; оборот указывает на срок, к которому строительство было завершено.
- source_word: μηνὸς Ἀδὰρ
  choice: месяца адара
  rationale: Прямая передача греческой родительной конструкции с общепринятым русским названием месяца.
- source_word: τοῦ ἕκτου ἔτους
  choice: в шестой год
  rationale: Естественная русская формула датировки по году царствования.
- source_word: βασιλέως Δαρείου
  choice: царя Дария
  rationale: Родительный оборот обозначает правителя, по царствованию которого датировано событие.
theological_decisions:
- issue: Передача ὁ οἶκος в храмовом контексте
  choice: храм
  alternative: дом
  rationale: Хотя греческое слово буквально означает «дом», повествовательный контекст однозначно указывает на храм; выбор не привносит конфессионального толкования, а делает референт понятным современному читателю.
translation_notes:
  register: Современный литературный русский язык; краткая и dignified историческая формулировка. Название месяца дано со строчной буквы по нормам русского письма. Исторически точная форма имени — «Дарий».
