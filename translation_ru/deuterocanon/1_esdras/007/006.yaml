base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/006.yaml
  text: And the sons of Israel[a], and the priests, and the Levites, and the rest from the captivity who had been brought back[b], did according to what is in the book of Moses.
translation:
  language: ru
  text: И сыны Израиля, и священники, и левиты, и остальные, приведённые из плена[a], поступили согласно написанному в книге Моисея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернувшиеся из плена». Буквально греческое причастие означает «приведённые» или «доставленные».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохраняется устойчивая библейская формула и её этническо-заветный оттенок; выражение понятно в современном литературном русском.
- source_word: οἱ λοιποί
  choice: остальные
  rationale: Естественно передаёт субстантивированное прилагательное и обозначает прочих членов общины после отдельно названных священников и левитов.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας οἱ προσενεχθέντες
  choice: приведённые из плена
  rationale: Передаёт явную пассивную форму причастия προσενεχθέντες и контекст восстановления после плена, не превращая её без пояснения в активное «вернувшиеся».
- source_word: ἀκολούθως τοῖς ἐν τῇ Μωσέως βίβλῳ
  choice: согласно написанному в книге Моисея
  rationale: Естественно выражает соответствие письменному установлению, не подставляя слово «закон», которого в данной греческой фразе нет.
- source_word: ἐποίησαν
  choice: поступили
  rationale: Русский глагол позволяет идиоматично передать «сделали в соответствии с» без добавления отсутствующего в греческом прямого дополнения.
theological_decisions:
- issue: Деятельность или пассивность возвратившихся из плена в οἱ προσενεχθέντες
  choice: приведённые из плена
  alternative: вернувшиеся из плена
  rationale: Греческое причастие имеет пассивную форму и буквально указывает на тех, кого привели или доставили. Контекст допускает общее значение возвращения, поэтому более привычный активный вариант сохранён в сноске, а возможная смысловая напряжённость не устранена из основного текста.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Повтор союза «и» сохраняет ритм греческого перечисления; формула «книга Моисея» передана без конфессионально обусловленного уточнения.
