base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/010.yaml
  text: And the sons of Israel from the captivity kept the Passover on the fourteenth day of the first month[b][a], when the priests and the Levites had purified themselves together.
translation:
  language: ru
  text: И сыны Израиля из числа бывших в плену[a] совершили Пасху в четырнадцатый день первого месяца, когда священники и левиты вместе очистились.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из изгнания». Буквально греческий текст говорит о людях «из плена», то есть о представителях Израиля, принадлежавших к общине, связанной с пленом и возвращением из него.'
    reason: lexical_alternative
  - marker: b
    text: То есть священники и левиты прошли обрядовое очищение, готовясь к Пасхе.
    reason: cultural_note
lexical_decisions:
- source_word: ἤγαγον … τὸ πάσχα
  choice: совершили Пасху
  rationale: Хотя ἄγω буквально означает «вести, приносить», в сочетании с τὸ πάσχα в культовом контексте речь идёт о совершении, то есть праздновании Пасхи. Русское «совершили Пасху» естественно передаёт этот смысл и сохраняет библейский регистр.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохранено традиционное родовое обозначение, буквально отражающее греческое выражение и его связь с праотцом Израилем.
- source_word: τῶν ἐκ τῆς αἰχμαλωσίας
  choice: вышедшие из плена
  rationale: Греческий оборот обозначает людей из среды пленных или пришедших из плена. Причастие «вышедшие» делает синтаксическую связь ясной по-русски, не уточняя сверх текста, каким именно образом они покинули плен.
- source_word: τὸ πάσχα
  choice: Пасху
  rationale: Обычное русское название праздника; поясняющего добавления в основном тексте не требуется.
- source_word: ἐν τῇ τεσσαρεσκαιδεκάτῃ τοῦ πρώτου μηνός
  choice: в четырнадцатый день первого месяца
  rationale: Точная и естественная русская передача указанной в греческом тексте даты.
- source_word: ὅτε
  choice: когда
  rationale: Сохранено временное отношение без усиления его до причинного или последовательного «после того как».
- source_word: ἡγνίσθησαν
  choice: очистились
  rationale: В данном храмовом контексте глагол обозначает обрядовое очищение перед Пасхой. Возвратная форма естественна по-русски и не превращает это действие в отвлечённое нравственное очищение.
- source_word: οἱ ἱερεῖς καὶ οἱ λευεῖται
  choice: священники и левиты
  rationale: Устоявшиеся русские обозначения двух групп храмовых служителей.
- source_word: ἅμα
  choice: вместе
  rationale: Передаёт совместность или одновременность очищения, не устраняя присущую наречию смысловую широту.
theological_decisions:
- issue: Родовое обозначение οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Формулировка сохраняет традиционное корпоративно-родовое значение исходного выражения и не сводит его к одному лишь этнониму.
- issue: Характер очищения ἡγνίσθησαν
  choice: очистились с пояснением в сноске об обрядовом смысле
  alternative: совершили обряд очищения
  rationale: Основной текст сохраняет краткость и формальную открытость греческого глагола, а примечание сообщает необходимый культовый контекст, не внося толкование непосредственно в стих.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Сыны Израиля» намеренно сохраняет достоинство и родовую образность исходного текста; остальной синтаксис сделан ясным для современного читателя.
