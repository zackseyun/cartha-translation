  terminology: «Сыны Израиля», «Пасха», «священники», «левиты» и «очистились» выбраны удачно. Сноска к «очистились» корректно уточняет обрядовый, а не нравственный характер очищения. Формулировку первой сноски следует согласовать с менее конкретизирующим основным текстом.
