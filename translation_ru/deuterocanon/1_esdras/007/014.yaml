  yaml_path: translation/deuterocanon/1_esdras/007/014.yaml
  text: And they kept the Feast of Unleavened Bread for seven days[a], rejoicing before the Lord,
translation:
  language: ru
  text: И они семь дней праздновали Праздник Опресноков, радуясь перед Господом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον τὴν ἑορτήν
  choice: праздновали праздник
  rationale: В контексте религиозного праздника сочетание с ἄγω означает совершать, отмечать праздник; русское выражение естественно передаёт этот смысл.
- source_word: τῶν ἀζύμων
  choice: Опресноков
  rationale: Традиционное и понятное русское название иудейского праздника; еврейская параллель חַג־מַצּוֹת подтверждает наименование.
- source_word: ἑπτὰ ἡμέρας
  choice: семь дней
  rationale: Винительный падеж выражает продолжительность; по-русски длительность естественно передаётся без дополнительного предлога.
- source_word: εὐφραινόμενοι
  choice: радуясь
  rationale: Деепричастие сохраняет сопутствующее действие и передаёт радостный характер празднования.
- source_word: ἔναντι Κυρίου
  choice: перед Господом
  rationale: Буквально и естественно передаёт пребывание в Божьем присутствии, не устраняя возможного культового оттенка.
theological_decisions:
- issue: Передача Κυρίου при наличии еврейской параллели с именем YHWH
  choice: Господом
  alternative: Яхве; ГОСПОДОМ
  rationale: Основным текстом служит греческое Κυρίου; «Господом» сохраняет обычную передачу этого титула и не подменяет греческое чтение реконструированным еврейским именем.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок слов слегка перестроен ради естественного звучания; начальное «И» сохраняет связь с предыдущим контекстом.
