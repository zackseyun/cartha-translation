lexical_decisions:
- source_word: προσήνεγκαν
  choice: принесли
  rationale: В контексте перечисляемых жертв естественное русское соответствие глаголу «приносить»; жертвенный смысл ясен из предметов и контекста.
- source_word: ἐγκαινισμόν
  choice: освящение
  rationale: Слово обозначает торжественное посвящение при введении святилища в употребление; «освящение» естественно и точно передаёт это значение.
- source_word: ἱεροῦ
  choice: дома
  rationale: Хотя греческое слово обычно означает храм или святилище, здесь сохранено традиционное контекстуальное обозначение «дом Господа», соответствующее параллельной храмовой формуле и проверенному консультационному слою.
- source_word: κυρίου
  choice: Господа
  rationale: Стандартная литературная передача греческого титула в библейском контексте.
- source_word: ταύρους
  choice: быков
  rationale: Точное современное обозначение взрослых самцов крупного рогатого скота, приносимых в жертву.
- source_word: κριούς
  choice: баранов
  rationale: Прямое соответствие греческому названию взрослых самцов овец.
- source_word: ἄρνας
  choice: ягнят
  rationale: Естественная русская передача названия молодых овец без добавления неуказанных характеристик.
theological_decisions:
- issue: Характер принесения животных
  choice: Не добавлять слово «в жертву»
  alternative: «принесли в жертву»
  rationale: Жертвенный характер действия очевиден из храмового контекста и перечня животных, но в данной греческой формулировке отдельного выражения «в жертву» нет.
- issue: Обозначение священного здания
  choice: «дом Господа»
  alternative: «храм Господа»
  rationale: Выбрана библейская формула «дом Господа», согласующаяся с контекстом и консультационным текстом; при этом греческое ἱερόν само по себе допускает перевод «храм».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены начальное «И», порядок перечисления и завершающая запятая, поскольку стих синтаксически продолжается.
