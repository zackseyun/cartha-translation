base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/013.yaml
  text: And the sons of Israel who were from the captivity ate[a], all those who had separated themselves from the abominations of the nations of the land[b], seeking the Lord.
translation:
  language: ru
  text: И ели[a] сыны Израиля из числа бывших в плену — все те, кто отделился от мерзостей народов земли[b] и искал Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ели пасхальную пищу; дополнение подразумевается из предыдущего контекста, но в греческом тексте здесь не выражено.
    reason: cross_reference
  - marker: b
    text: 'Возможно также: «племён земли». Имеются в виду окружающие народы; речь идёт об обычаях, которые текст считает оскверняющими.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάγοσαν
  choice: ели
  rationale: Глагол означает «ели»; его объект не назван в самом стихе, хотя из предыдущего контекста ясно, что речь идёт о пасхальной трапезе.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохраняет образность греческого выражения и его родовой и заветный оттенок; формула понятна в современном литературном русском.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: пришедшие из плена
  rationale: Естественно передаёт принадлежность этих людей к вышедшим из плена, не превращая выражение в отвлечённое «изгнание».
- source_word: χωρισθέντες
  choice: отделившиеся
  rationale: Передаёт совершившееся сознательное отделение от оскверняющих обычаев, сохраняя возможный средне-возвратный оттенок формы.
- source_word: βδελυγμάτων
  choice: мерзостей
  rationale: Сохраняет сильную нравственно-культовую оценку греческого слова, не сводя её лишь к ритуальной нечистоте.
- source_word: τῶν ἐθνῶν τῆς γῆς
  choice: народов земли
  rationale: Близко следует греческой конструкции и не придаёт слову ἔθνη более позднего узкотехнического значения «язычники».
- source_word: ζητοῦντες τὸν κύριον
  choice: искавшие Господа
  rationale: Передаёт продолжающуюся религиозную устремлённость названной группы и сохраняет традиционное обозначение κύριος как «Господь».
theological_decisions:
- issue: Следует ли прямо назвать подразумеваемую пасхальную пищу
  choice: 'Оставить дополнение невыраженным: «ели»'
  alternative: «ели пасхальную жертву» или «участвовали в пасхальной трапезе»
  rationale: Пасхальная трапеза ясна из предыдущего контекста, но в данном греческом стихе объект глагола не назван; его добавление в основной текст устранило бы формальную недосказанность источника.
- issue: Характер отделения от окружающих народов
  choice: «отделившиеся от мерзостей народов земли»
  alternative: «отделившиеся от нечистоты народов земли» или «оставившие отвратительные обычаи народов земли»
  rationale: Формулировка сохраняет нравственно-культовую тяжесть βδελύγματα, не истолковывая отделение как чисто этническое или социальное.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Сыны Израиля» сохраняет исходную образность, а причастные обороты позволяют ясно передать приложение πάντες и различие между совершившимся отделением и продолжающимся исканием Господа.
