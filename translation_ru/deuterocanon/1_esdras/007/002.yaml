  source_fidelity: 'Греческий текст передан в целом точно: сохраняются продолжающийся надзор, сравнительная степень заботливости, сотрудничество с двумя названными группами и неуточнённый служебный статус ἱεροστάται. Однако «ещё усерднее» добавляет оттенок дальнейшего усиления, которого сравнительная форма ἐπιμελέστερον сама по себе не требует.'
  naturalness: «Надзирали за священными работами» понятно, но «священные работы» несколько тяжеловесно. В данном контексте «священные дела» естественнее и всё ещё достаточно близко к τὰ ἱερὰ ἔργα; храмовый смысл вынесен в сноску.
  terminology: «Старейшины иудеев» и «храмовые распорядители» удачно передают соответственно πρεσβύτεροι τῶν Ἰουδαίων и ἱεροστάται, не приписывая последним священнического сана. В сноске следует убрать неестественное «святынные работы» и не называть предложное управление русского глагола буквальным содержанием греческого словосочетания.
