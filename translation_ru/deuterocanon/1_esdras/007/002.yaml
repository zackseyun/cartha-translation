base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/002.yaml
  text: They supervised the holy works more diligently[a], working together with the elders of the Jews and the temple overseers.
translation:
  language: ru
  text: Они более усердно надзирали за священными делами[a], трудясь вместе со старейшинами иудеев и храмовыми распорядителями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за священными работами», «за работами в святилище» или «за храмовыми работами». Буквально по-гречески: «священные дела»; еврейский параллельный текст говорит о «работе дома Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεστάτουν
  choice: надзирали
  rationale: Имперфект обозначает продолжавшееся руководство и надзор; «надзирали» естественно сочетается с родительным падежом и сохраняет управленческий оттенок.
- source_word: τῶν ἱερῶν ἔργων
  choice: за священными работами
  rationale: Буквально — «священные работы». Контекст связывает их с храмом, однако основной текст не сужает более широкую греческую формулировку.
- source_word: ἐπιμελέστερον
  choice: ещё усерднее
  rationale: Сравнительное наречие выражает повышенную степень тщательности и усердия; «ещё усерднее» ясно сохраняет сравнительную силу.
- source_word: συνεργοῦντες
  choice: трудясь вместе
  rationale: Причастие передаёт активное совместное участие с названными далее группами.
- source_word: τοῖς πρεσβυτέροις τῶν Ἰουδαίων
  choice: со старейшинами иудеев
  rationale: Формулировка близка греческой конструкции и обозначает признанных старейшин иудейской общины.
- source_word: ἱεροστάταις
  choice: храмовыми распорядителями
  rationale: Слово обозначает лиц, поставленных над священными или храмовыми делами. «Распорядители» передаёт служебно-надзорную функцию, не отождествляя их без достаточных оснований со священниками.
theological_decisions:
- issue: Соотношение греческой формулировки с масоретской параллелью в Езд 6:22
  choice: Сохранить прямое указание греческого текста на совместный труд со старейшинами иудеев и храмовыми распорядителями; параллель использовать лишь для подтверждения храмового контекста работ.
  alternative: 'Передать по масоретской параллели: «укреплять руки их в работе над домом Бога».'
  rationale: Для 1 Ездры первичным является греческий текст, содержащий самостоятельную формулировку, которую нельзя без потерь заменить текстом масоретской параллели.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Священные работы» сохраняет намеренную широту греческого выражения, а «храмовые распорядители» ясно передаёт должностную функцию без конфессионального уточнения.
