revisions:
- from: Они ещё усерднее надзирали за священными работами[a], трудясь вместе со старейшинами иудеев и храмовыми распорядителями.
  to: Они более усердно надзирали за священными делами[a], трудясь вместе со старейшинами иудеев и храмовыми распорядителями.
  rationale: Заменено «ещё усерднее» на нейтральное сравнительное «более усердно». «Священные дела» улучшает естественность русского текста, не сужая греческое выражение до исключительно строительных или храмовых работ. Сноска уточнена в соответствии с греческой лексикой и современным русским употреблением.
