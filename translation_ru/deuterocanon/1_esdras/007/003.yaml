base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/003.yaml
  text: And the holy works prospered[a], while Haggai and Zechariah the prophets were prophesying.
translation:
  language: ru
  text: Священные работы[a] шли успешно, когда пророки Аггей и Захария пророчествовали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «священные дела»; по контексту, вероятно, имеются в виду работы над храмом.'
    reason: Лексическая альтернатива и осторожное контекстуальное пояснение без сужения основного текста.
lexical_decisions:
- source_word: εὐόδα ἐγίνετο
  choice: успешно продвигались
  rationale: Выражение передаёт благоприятный ход и успех работ. Такая формулировка естественна по-русски и сохраняет значение процесса.
- source_word: τὰ ἱερὰ ἔργα
  choice: священные работы
  rationale: Греческий текст буквально говорит о «священных делах/работах», не называя храм прямо. Слово «работы» уместно в контексте строительства и восстановления.
- source_word: προφητευόντων
  choice: пока … пророчествовали
  rationale: 'Родительный самостоятельный оборот обозначает одновременное продолжающееся действие: работы продвигались в то время, когда пророки пророчествовали.'
- source_word: Ἁγγαίου
  choice: Аггей
  rationale: Устоявшаяся русская библейская форма имени пророка.
- source_word: Ζαχαρίου
  choice: Захария
  rationale: Устоявшаяся русская библейская форма имени пророка.
- source_word: τῶν προφητῶν
  choice: пророки Аггей и Захария
  rationale: Определение «пророки» сохранено и естественно поставлено перед именами в русском предложении.
theological_decisions:
- issue: Следует ли прямо назвать «священные работы» работами над храмом
  choice: Сохранить в основном тексте более широкое выражение «священные работы»
  alternative: «работы над храмом» или «работы в доме Божьем»
  rationale: В данном греческом стихе храм прямо не назван, хотя контекст указывает именно на него. Основной текст не должен сужать формулировку оригинала; контекстуальное пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный повествовательный стиль. Формулировка сохраняет одновременность пророческого служения и успешного продвижения работ.
