base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/008.yaml
  text: twelve goats for the sin of all Israel[a], according to the number of the twelve tribal leaders of Israel.
translation:
  language: ru
  text: двенадцать козлов в жертву за грех всего Израиля[a] — по числу двенадцати вождей колен Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за грех всего Израиля»; в жертвенном контексте — «в жертву за грех всего Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιμάρους
  choice: козлов
  rationale: χίμαρος обозначает козла, то есть самца; «козлов» естественно и точно передаёт род и число в жертвенном контексте.
- source_word: ὑπὲρ ἁμαρτίας
  choice: в жертву за грех
  rationale: Буквально выражение означает «за грех», но в данном жертвенном контексте это устойчивая формула жертвы за грех. Добавление «в жертву» делает смысл ясным, не вводя отдельного названия, отсутствующего в греческом.
- source_word: παντὸς τοῦ Ἰσραήλ
  choice: всего Израиля
  rationale: Родительный падеж сохранён естественным русским оборотом и выражает общенародный охват жертвы.
- source_word: πρὸς ἀριθμόν
  choice: по числу
  rationale: Краткий и естественный русский эквивалент, передающий количественное соответствие.
- source_word: φυλάρχων
  choice: вождей колен
  rationale: φυλάρχης — глава или вождь племени; в библейском контексте Израиля «вожди колен» точнее и привычнее, чем общее «племенные вожди».
theological_decisions:
- issue: Следует ли прямо обозначить жертвенный смысл оборота ὑπὲρ ἁμαρτίας
  choice: в жертву за грех всего Израиля
  alternative: за грех всего Израиля
  rationale: Греческий оборот краток, но контекст явно жертвенный. Основной текст передаёт этот смысл естественно по-русски, а сноска сохраняет буквальную форму и отмечает её идиоматический характер.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире естественно связывает число жертвенных животных с числом вождей колен.
