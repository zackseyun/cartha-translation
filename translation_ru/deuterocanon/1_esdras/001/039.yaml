base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/039.yaml
  text: And Nebuchadnezzar took some of the sacred vessels of the Lord and carried them away and deposited them in his temple in Babylon[a].
translation:
  language: ru
  text: И Навуходоносор взял некоторые из священных сосудов Господа, унёс их и поместил в его храме в Вавилоне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взял из священных сосудов Господа»; вероятно, имеется в виду, что он взял часть сосудов, а не все.'
    reason: Сохраняется возможность более буквального понимания ἀπό при объяснении вероятного партитивного смысла.
lexical_decisions:
- source_word: ἀπὸ τῶν ἱερῶν σκευῶν
  choice: некоторые из священных сосудов
  rationale: 'Предлог ἀπό с родительным падежом здесь естественно понимать в партитивном смысле: Навуходоносор взял часть священных сосудов, а не обязательно все. «Священные сосуды» передаёт культовое назначение предметов.'
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Греческое κύριος передано обычным библейским соответствием «Господь»; родительный падеж указывает на принадлежность сосудов Господу.
- source_word: λαβὼν
  choice: взял
  rationale: Причастие передано личной формой глагола, естественной для русского повествования.
- source_word: ἀπενέγκας
  choice: унёс их
  rationale: Глагол обозначает удаление и перенос захваченных предметов; местоимение ясно восстанавливает объект из предыдущей фразы.
- source_word: ἀπηνείσατο
  choice: поместил
  rationale: Редкая форма в данном контексте означает доставление и размещение предметов; «поместил» звучит естественно и не добавляет невыраженной в тексте идеи храмовой сокровищницы.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: в храме своего бога
  rationale: Буквально местоимение означает «его/своём храме», однако по-русски «в своём храме» могло бы ошибочно представить Навуходоносора владельцем личного храма. Контекстуально речь идёт о храме почитаемого им божества; строчная буква не отождествляет его с Господом.
- source_word: ἐν Βαβυλῶνι
  choice: в Вавилоне
  rationale: Принятая русская форма географического названия.
theological_decisions:
- issue: Передача κύριος в греческом историческом повествовании
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основным источником служит греческий текст с κύριος; написание «Господь» передаёт его непосредственно, не вводя типографическое обозначение еврейского тетраграмматона.
- issue: Отнесение αὐτοῦ в выражении «его храм»
  choice: храм своего бога
  alternative: свой храм / его храм
  rationale: Выбранная формулировка устраняет по-русски вероятную двусмысленность, будто храм принадлежал самому царю, и одновременно не создаёт впечатления, что речь о храме Господа. При этом конкретное имя вавилонского божества не добавляется.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Цепочка греческих причастий преобразована в последовательность однородных глаголов. Формулировка лаконична и понятна без архаизмов.
