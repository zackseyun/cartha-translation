  text: In the eighteenth year of Iosias's reign[b][a], this Passover was held.
translation:
  language: ru
  text: В восемнадцатый год царствования Иосии была совершена эта Пасха[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с греческого: «эта Пасха была проведена»; речь идёт о совершении пасхального обряда в то время.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском параллельном повествовании (2 Пар. 35) говорится, что находившиеся там израильтяне совершили тогда Пасху; греческий текст здесь кратко подводит итог этому празднованию.
    reason: cross_reference
lexical_decisions:
- source_word: ὀκτωκαιδεκάτῳ ἔτει
  choice: на восемнадцатом году
  rationale: Дательный времени задаёт временную точку; это естественная и традиционно понятная русская формулировка.
- source_word: βασιλεύοντος Ἰωσείου
  choice: царствования Иосии
  rationale: Родительный самостоятельный оборот буквально означает «когда Иосия царствовал»; именная конструкция по-русски кратко и точно передаёт смысл. Форма имени «Иосия» соответствует устоявшейся русской библейской передаче этого лица.
- source_word: ἤχθη
  choice: была совершена
  rationale: Буквально глагол означает «была приведена/проведена», но применительно к Пасхе обозначает совершение установленного празднования. «Была совершена» естественно передаёт культово-событийный смысл, не усиливая оттенок веселья.
- source_word: τὸ πάσχα
  choice: Пасха
  rationale: Стандартное русское название иудейского праздника; еврейская параллель הַפֶּסַח подтверждает значение.
- source_word: τοῦτο
  choice: эта
  rationale: Указательное местоимение связывает стих с конкретной Пасхой, описанной ранее; «эта» сохраняет данную связь.
