base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/015.yaml
  text: And the gatekeepers were at each gate; no one could leave his own appointed duty[a], for their brothers the Levites had prepared for them.
translation:
  language: ru
  text: И привратники стояли при каждых воротах; никто не мог покинуть назначенное ему служение, потому что их братья, левиты, приготовили для них[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «левиты приготовили для себя». По контексту, вероятно, имеется в виду, что они приготовили необходимое для привратников, чтобы те могли оставаться на назначенном им служении.'
    reason: Сохраняет буквальное возвратное значение ἑαυτοῖς и отмечает контекстуальное понимание «для них».
lexical_decisions:
- source_word: θυρωροὶ
  choice: привратники
  rationale: Обычное русское обозначение служителей, охранявших храмовые ворота; соответствует контексту πυλών.
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: у каждых ворот
  rationale: Естественно передаёт местонахождение служителей и распределительное значение ἑκάστου.
- source_word: οὐκ ἔστιν παραβῆναι
  choice: никто не мог оставить
  rationale: В контексте установленной службы παραβῆναι означает отойти от своего поста или оставить порученное служение.
- source_word: ἕκαστον τὴν ἑαυτοῦ ἐφημερίαν
  choice: назначенное ему служение
  rationale: ἐφημερία обозначает установленную очередь или период храмовой службы; выбранная формулировка сохраняет официальный характер и звучит естественно по-русски.
- source_word: οἱ γὰρ ἀδελφοὶ αὐτῶν οἱ Λευεῖται
  choice: потому что их братья-левиты
  rationale: 'Передаёт пояснительное приложение: братьями названы левиты.'
- source_word: ἡτοίμασαν ἑαυτοῖς
  choice: приготовили всё для них
  rationale: Контекстуально приготовления левитов позволили привратникам не оставлять службу. Добавленное «всё» естественно обозначает необходимое, однако буквальное возвратное значение сохранено в примечании.
theological_decisions:
- issue: Значение возвратного местоимения в ἡτοίμασαν ἑαυτοῖς
  choice: Левиты приготовили необходимое для привратников
  alternative: Левиты приготовили для себя
  rationale: Греческая форма буквально возвратная, но ход мысли связывает приготовления левитов с тем, что привратники не покидали своих мест. Контекстуальное понимание дано в тексте, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; достоинство храмового контекста сохранено без архаизации. «Привратники» и «служение» понятны широкому читателю и соответствуют культовой обстановке.
