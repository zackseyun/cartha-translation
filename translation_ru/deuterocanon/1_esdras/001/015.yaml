revisions:
- from: И привратники стояли у каждых ворот; никто не мог оставить назначенное ему служение, потому что их братья-левиты приготовили всё для них.[a]
  to: И привратники стояли при каждых воротах; никто не мог покинуть назначенное ему служение, потому что их братья, левиты, приготовили для них[a].
  rationale: 'Внесены только безопасные правки: устранено невыраженное в оригинале «всё», улучшено обозначение распределённого поста у ворот, пояснительное приложение выделено запятыми, а знак сноски поставлен у контекстуального, а не буквального перевода возвратного местоимения. Неоднозначность ἑαυτοῖς сохранена в сноске.'
