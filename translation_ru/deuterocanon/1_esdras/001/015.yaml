review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: θυρωροί — храмовые привратники, они не могли покинуть назначенную очередь служения, поскольку левиты сделали необходимые приготовления. Однако «всё» не выражено в греческом тексте: ἡτοίμασαν употреблено без прямого дополнения. Его лучше не вводить как отдельный смысловой элемент, хотя контекстуальное «для них» допустимо при обязательной сноске о буквальном возвратном местоимении.'
  naturalness: «При каждых воротах» естественнее и точнее передаёт распределительное ἐφʼ ἑκάστου πυλῶνος, чем «у каждых ворот». Формулировка «не мог покинуть назначенное ему служение» современна и уместна в храмовом контексте.
  terminology: «Привратники», «левиты» и «служение» удачны. «Братья-левиты» допустимо, но запятая в приложении («их братья, левиты») яснее показывает, что левиты — это названные братья, а не составное наименование.
  issues:
