    issue: Добавлено «всё» в «приготовили всё для них».
    rationale: В греческом ἡτοίμασαν не имеет выраженного дополнения. Контекст позволяет подразумевать необходимое для привратников, но «всё» — необязательное уточнение; лучше сохранить лаконичность оригинала.
  - severity: low
    issue: «У каждых ворот» менее идиоматично для распределительного размещения.
    rationale: «При каждых воротах» точнее обозначает пост у каждого входа и естественно звучит в литературном русском.
  - severity: low
    issue: Позиция маркера сноски после точки.
    rationale: Для русской пунктуационной практики и ясной привязки к спорному «для них» маркер лучше поставить непосредственно после этих слов, перед конечной точкой.
