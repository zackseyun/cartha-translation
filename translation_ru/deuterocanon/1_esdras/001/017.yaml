base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/017.yaml
  text: And the sons of Israel who were found at that time kept the Passover and the feast of unleavened bread for seven days[a][b].
translation:
  language: ru
  text: И сыны Израиля[a], оказавшиеся в то время[b], отпраздновали Пасху и праздник Опресноков в течение семи дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». По-гречески буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «найденные»; то есть те, кто присутствовал в это время.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγοσαν
  choice: совершали
  rationale: Хотя основной смысл глагола — «привели/принесли», при прямых дополнениях «Пасха» и «праздник» он обозначает совершение или празднование установленного обряда. «Совершали» сохраняет культовый оттенок и естественно сочетается с Пасхой и праздником.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Дословное родовое обозначение сохранено в достойной и понятной библейской форме; более идиоматичный вариант — «израильтяне».
- source_word: οἱ εὑρεθέντες
  choice: оказавшиеся там
  rationale: Причастие буквально означает «найденные/оказавшиеся». В контексте речь о присутствовавших в данном месте; «там» передаёт подразумеваемую ситуацией локальность, не превращая оборот в неестественное русское «которые были найдены».
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: в то время
  rationale: Прямой и естественный эквивалент временного выражения; указательное местоимение передано с учётом русского повествовательного дейксиса.
- source_word: τὸ πάσχα
  choice: Пасху
  rationale: Устоявшееся русское название праздника; винительный падеж соответствует синтаксису греческого текста.
- source_word: τὴν ἑορτὴν τῶν ἀζύμων
  choice: праздник Опресноков
  rationale: Устоявшееся и точное название семидневного праздника; «Опресноков» передаёт субстантивированное τῶν ἀζύμων.
- source_word: ἡμέρας ἑπτά
  choice: семь дней
  rationale: Винительный длительности по-русски естественно передаётся беспредложным обозначением продолжительности.
