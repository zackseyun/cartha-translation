base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/005.yaml
  text: according to the writing of David king of Israel[a], and according to the greatness of Solomon his son; and standing in the sanctuary according to your ancestral division, O Levites, before your brothers, the sons of Israel[c][b],
translation:
  language: ru
  text: согласно написанному Давидом, царём Израиля, и согласно величию Соломона, его сына[a]. И вы, левиты, стоящие перед своими братьями, сынами Израиля, станьте в святилище[b] в соответствии с вашим родовым подразделением[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно великолепию Соломона, его сына». Греческое слово означает величие, великолепие или величавость; связь с порядком, установленным Соломоном, возможна, но прямо не выражена.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в святом [месте]».'
    reason: lexical_alternative
  - marker: c
    text: 'Греческая фраза сжата и говорит о «вашем родовом подразделении» в единственном числе. Еврейская параллель выражает эту мысль полнее: «по домам ваших отцов, по вашим подразделениям».'
    reason: alternative_reading
lexical_decisions:
- source_word: γραφήν
  choice: написанному
  rationale: Здесь слово обозначает письменное предписание, связанное с Давидом, а не «Писание» в позднейшем специальном смысле; такой перевод согласуется и с еврейской параллелью בכתב.
- source_word: μεγαλειότητα
  choice: величию
  rationale: Сохраняет прямое значение величия или великолепия, не сводя неоднозначную греческую формулировку к не названному прямо письменному распоряжению Соломона.
- source_word: στᾶντες
  choice: Встаньте
  rationale: Причастие в данном распорядительном контексте естественно имеет императивную силу; русский императив ясно передаёт функцию фразы.
- source_word: ἐν τῷ ἁγίῳ
  choice: в святилище
  rationale: Идиоматично передаёт субстантивированное «в святом [месте]», не уточняя архитектурную зону храма.
- source_word: μεριδαρχίαν τὴν πατρικήν
  choice: по вашим родовым подразделениям
  rationale: Редкое слово указывает на организационное деление, а прилагательное — на родовой принцип; множественное число естественно по-русски и поддерживается еврейской параллелью о домах отцов и подразделениях.
- source_word: τῶν ἔμπροσθεν τῶν ἀδελφῶν ὑμῶν
  choice: перед вашими братьями
  rationale: Сохраняет пространственный либо представительский смысл ἔμπροσθεν без лишнего истолкования.
- source_word: υἱῶν Ἰσραήλ
  choice: сынами Израиля
  rationale: Сохраняет явный родственно-заветный образ греческого выражения, а не заменяет его более общим «израильтянами».
theological_decisions:
- issue: Родовое выражение υἱῶν Ἰσραήλ
  choice: сынами Израиля
  alternative: израильтянами
  rationale: В источнике употреблено мужское родственное обозначение; его сохранение передаёт племенную и заветную образность без конфессионального истолкования.
- issue: Использование еврейской параллели для сжатой греческой фразы
  choice: по вашим родовым подразделениям
  alternative: по вашему родовому подразделению
  rationale: Основой остаётся греческий текст, но еврейская параллель подтверждает, что речь идёт об организационных подразделениях по домам отцов.
- issue: Неоднозначность μεγαλειότητα Σαλωμών
  choice: согласно величию Соломона
  alternative: согласно установлению Соломона
  rationale: Буквальный перевод сохраняет необычную и богословски нейтральную формулировку греческого текста, не превращая «величие» в прямо не названный документ или приказ.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового распоряжения. Императив «Встаньте» естественно передаёт распорядительную силу греческого причастия; сохранены термины родства и подлинная неоднозначность выражения о величии Соломона.
