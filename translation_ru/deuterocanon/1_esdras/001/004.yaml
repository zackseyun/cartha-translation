base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/004.yaml
  text: You will not need to carry it on your shoulders[a]. Now serve the Lord your God, and minister to his people Israel, and prepare yourselves by your fathers' houses and your divisions[b],
translation:
  language: ru
  text: Вам не придётся носить её на плечах[a]. А теперь служите Господу, вашему Богу, и служите его народу, Израилю; приготовьтесь согласно своим отеческим домам и коленам[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «её» относится к ковчегу, названному в предшествующем контексте.
    reason: cross_reference
  - marker: b
    text: 'Буквально по-гречески: «коленам». В еврейском параллельном тексте (2 Пар. 35:4) сказано «отделениям», что может пояснять организационный смысл в данном контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἔσται ὑμῖν ἆραι ἐπʼ ὤμων αὐτήν
  choice: Вам не придётся носить её на плечах
  rationale: Оборот с будущим временем εἰμί и дательным передаёт отсутствие дальнейшей необходимости; «не придётся» естественно выражает это по-русски. ἆραι в данном контексте означает физически нести, а αὐτήν отсылает к упомянутому в контексте ковчегу.
- source_word: λατρεύετε τῷ κυρίῳ θεῷ ὑμῶν
  choice: служите Господу, вашему Богу
  rationale: λατρεύω обозначает служение Богу, в том числе богослужебное; «служите» сохраняет широкий смысл без неоправданного сужения до одного лишь поклонения.
- source_word: θεραπεύετε τὸ ἔθνος αὐτοῦ Ἰσραήλ
  choice: исполняйте служение для Его народа — Израиля
  rationale: Отдельная формулировка сохраняет отличие θεραπεύω от предшествующего λατρεύω. «Народ» естественнее передаёт ἔθνος в заветном контексте, а тире показывает, что «Израиль» называет этот народ.
- source_word: ἑτοιμάσατε
  choice: приготовьтесь
  rationale: Императив употреблён без прямого дополнения; возвратная форма естественно передаёт призыв привести себя и свой порядок служения в готовность.
- source_word: κατὰ τὰς πατριὰς
  choice: по своим отеческим домам
  rationale: πατριά здесь означает родовую группу, или дом отцов; традиционный библейский термин «отеческий дом» сохраняет организационный и родовой оттенки.
- source_word: καὶ τὰς φυλὰς ὑμῶν
  choice: и отделениям
  rationale: Хотя φυλή обычно означает «колено», параллельный еврейский текст употребляет слово со значением служебных подразделений. В данном священническом контексте «отделения» лучше передаёт организационный смысл; буквальная греческая возможность отмечена в сноске.
theological_decisions:
- issue: Различение служения Богу и служения Израилю
  choice: Для λατρεύετε употреблено «служите», а для θεραπεύετε — «исполняйте служение для»
  alternative: 'Передать оба глагола одинаково: «служите»'
  rationale: Греческий текст намеренно употребляет разные глаголы для отношения к Богу и к народу. Различие сохранено без введения специального конфессионального смысла.
- issue: Организационное значение φυλάς
  choice: отделениям
  alternative: коленам
  rationale: Основное словарное значение допускает «колена», однако непосредственный священнический контекст и еврейская параллель указывают на служебные подразделения. Сноска сохраняет доступ к буквальному греческому чтению и не скрывает неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены конкретный образ ношения на плечах, заветное именование Бога и организационная терминология. Заглавное «Его» употреблено как уважительное местоимение о Боге; пунктуация сохраняет незавершённость стиха перед продолжением.
