base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/029.yaml
  text: And he got onto his second chariot[a]; and after being brought back to Jerusalem[b], he ended his life and was buried in his ancestral tomb.
translation:
  language: ru
  text: И он взошёл на свою вторую колесницу; после того как его доставили обратно в Иерусалим, он расстался с жизнью[a] и был похоронен в родовой гробнице.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изменил (или сменил) свою жизнь»; это греческое выражение означает, что он умер.'
    reason: lexical_alternative
  - marker: b
    text: В параллельном месте 2 Пар. 35:24 говорится о «второй колеснице» и добавлено, что весь Иуда и Иерусалим оплакивали Иосию. Там «гробницы его отцов» стоит во множественном числе, тогда как здесь, в 1 Ездры, повествование короче и «гробница» стоит в единственном числе.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέβη ἐπὶ τὸ ἅρμα
  choice: взошёл на колесницу
  rationale: Глагол ἀναβαίνω буквально передаёт движение вверх, а с ἅρμα означает, что человек взошёл или сел на колесницу. «Взошёл» сохраняет образ исходного текста и уместен в литературном повествовании.
- source_word: τὸ ἅρμα τὸ δεύτερον αὐτοῦ
  choice: свою вторую колесницу
  rationale: δεύτερον определяет колесницу как вторую, вероятно запасную или вторую по рангу; притяжательное αὐτοῦ естественно передано возвратным местоимением «свою».
- source_word: ἀποκατασταθεὶς εἰς Ἰερουσαλήμ
  choice: после того как его доставили обратно в Иерусалим
  rationale: Страдательное причастие указывает не просто на возвращение, а на то, что его вернули или доставили назад. Развёрнутая конструкция естественна по-русски и ясно передаёт временную связь.
- source_word: μετήλλαξεν τὸν βίον αὐτοῦ
  choice: расстался с жизнью
  rationale: Греческое выражение буквально говорит о перемене или оставлении жизни и служит эвфемизмом смерти. «Расстался с жизнью» сохраняет образность, не создавая неестественной русской кальки.
- source_word: ἐτάφη
  choice: был похоронен
  rationale: Прямое и обычное соответствие греческой страдательной форме.
- source_word: ἐν τῷ πατρικῷ τάφῳ
  choice: в родовой гробнице
  rationale: πατρικός обозначает принадлежащее отцам или предкам, а τάφος стоит в единственном числе. «Родовая гробница» естественно передаёт семейное место погребения и сохраняет единственное число греческого текста.
