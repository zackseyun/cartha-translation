base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/043.yaml
  text: And after a year[a], Nebuchadnezzar sent and brought him away to Babylon, together with the holy vessels of the Lord,
translation:
  language: ru
  text: Через год Навуходоносор послал за ним и увёл его в Вавилон[a] вместе со священными сосудами Господа,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переселил его в Вавилон». Греческий глагол может обозначать перемещение или принудительное переселение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ᾽ ἐνιαυτόν
  choice: через год
  rationale: Оборот с μετά и винительным падежом обозначает истечение времени. «Через год» естественно передаёт это значение в русском повествовании.
- source_word: ἀποστείλας
  choice: послал за ним
  rationale: Аористное причастие буквально означает «послав». Добавление «за ним» естественно выражает подразумеваемую цель посылки и связывает действие с последующим уводом царя, не уточняя, кто именно был послан.
- source_word: μετήγαγεν
  choice: увёл его в Вавилон
  rationale: Глагол обозначает перемещение или увод из одного места в другое и в данном контексте допускает оттенок принудительного переселения. «Увёл» сохраняет личный объект и направление движения.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение отсылает к упомянутому ранее царю; имя не добавляется, поскольку в греческом тексте его здесь нет.
- source_word: ἅμα
  choice: вместе с
  rationale: 'Здесь наречие выражает сопровождение: царя увели одновременно со священными сосудами.'
- source_word: τοῖς ἱεροῖς σκεύεσιν
  choice: со священными сосудами
  rationale: ἱερός передано как «священный», а σκεύη — как «сосуды»; это точно и естественно для храмовой утвари, не подменяя общее обозначение уточняющим словом «храмовые».
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Родительный падеж передаёт принадлежность сосудов Господу. Греческое κύριος переводится как «Господь» без внесения в основной текст реконструируемого еврейского тетраграмматона.
theological_decisions:
- issue: Передача κύριος в историческом тексте Второканонической книги
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основным источником служит греческий текст, в котором стоит κυρίου. Поэтому сохранено обычное «Господь»; типографическое выделение, подразумевающее еврейское имя Бога, не вводится на основании одного лишь возможного семитского фона.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Причастная конструкция греческого текста развёрнута в последовательные личные глаголы. Конечная запятая сохранена, поскольку предложение продолжается в следующем стихе.
