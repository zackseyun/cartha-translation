base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/022.yaml
  text: And the things concerning him also have been recorded in former times[a], concerning those who sinned and acted wickedly against the Lord beyond every nation and kingdom, and grieved him greatly[b]; and the words of the Lord rose up against Israel.
translation:
  language: ru
  text: 'И всё, что относится к нему, также было записано в прежние времена: о тех, кто согрешили и нечестиво поступали против Господа — более, чем какой-либо народ и царство[a], — и глубоко огорчили Его[b]; и слова Господа восстали против Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превзойдя всякий народ и царство»; то есть их грех превзошёл грех всех народов и царств.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст в этом месте труден: после слов «огорчили Его» стоит ἔστω («пусть будет»), что плохо согласуется с контекстом. В переводе это слово понято как усиление; возможно, здесь сохранилось небольшое повреждение текста.'
    reason: textual_variant
lexical_decisions:
- source_word: τὰ κατʼ αὐτόν
  choice: всё, что касается его
  rationale: Сохраняет широкий, обобщающий смысл греческого выражения и не сужает его до одних лишь деяний.
- source_word: ἀναγέγραπται
  choice: было записано
  rationale: Передаёт перфект пассива и документальный характер сохранившейся записи естественным русским языком.
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: в прежние времена
  rationale: Следует буквальному временному смыслу, не добавляя отсутствующего в греческом слова «летописи» или «книги».
- source_word: περὶ τῶν ἡμαρτηκότων καὶ ἠσεβηκότων
  choice: о тех, кто согрешил и поступал нечестиво
  rationale: Различает грех и нечестивое поведение, сохраняя оба греческих причастия.
- source_word: εἰς τὸν κύριον
  choice: против Господа
  rationale: В контексте нравственного и религиозного противления εἰς имеет направленно-враждебный смысл.
- source_word: παρὰ ἅπαν ἔθνος καὶ βασιλείαν
  choice: больше всякого народа и царства
  rationale: 'Передаёт сравнительное значение παρά с винительным падежом: их вина превосходила вину всех народов и царств.'
- source_word: ἐλύπησαν αὐτόν
  choice: глубоко огорчил Его
  rationale: Сохраняет личностный образ причинённой Богу скорби; единственное число согласовано с собирательным рядом «народ и царство» в сравнительной конструкции, тогда как субъектом по смыслу остаются упомянутые согрешившие.
- source_word: ἔστω
  choice: глубоко
  rationale: Передаёт предполагаемое усиление в трудном месте текста, не пытаясь буквально встроить неуместное здесь «пусть будет»; неопределённость отмечена сноской.
- source_word: οἱ λόγοι τοῦ κυρίου ἀνέστησαν ἐπʼ Ἰσραήλ
  choice: слова Господа восстали против Израиля
  rationale: Сохраняет яркое олицетворение слов Господа и направленность суда против Израиля.
theological_decisions:
- issue: Передача κύριος в греческом историческом тексте
  choice: Господь
  alternative: Владыка
  rationale: «Господь» естественно соответствует κύριος в данном заветно-судебном контексте и не вносит конфессиональных уточнений.
- issue: Антропопатическое выражение ἐλύπησαν αὐτόν
  choice: огорчил Его
  alternative: вызвал Его гнев
  rationale: Греческий текст прямо говорит о скорби Бога; перевод сохраняет эту богословскую напряжённость и не заменяет скорбь гневом.
- issue: Образ действенных слов Господа
  choice: слова Господа восстали против Израиля
  alternative: слова Господа обратились против Израиля
  rationale: Более буквальный вариант сохраняет олицетворение и образ активного судебного выступления, не сводя «слова» лишь к исполнению предсказания.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксис сохраняет необычную последовательность исходного греческого текста, но двоеточие облегчает чтение. Заглавная буква в местоимении «Его» употреблена как принятая в русском религиозном регистре форма почтительного обозначения Бога.
