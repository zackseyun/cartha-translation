  terminology: «Священные сосуды Господа» — точное и устоявшееся обозначение ἱερὰ σκεύη. «Сундуки Господа» передаёт κιβωτούς без неоправданного отождествления с уникальным Ковчегом. «Хранилища» передаёт ἀποθήκας шире и буквальнее, чем «сокровищницы».
