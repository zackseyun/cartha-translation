base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/051.yaml
  text: But he handed everything over into their hands. And after taking all the holy vessels of the Lord, the great and the small, and the chests of the Lord and the royal storehouses, they carried them away to Babylon.
translation:
  language: ru
  text: Но Он всё отдал в их руки. Они взяли все священные сосуды Господа, большие и малые, а также сундуки Господа и царские хранилища и унесли их в Вавилон.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέδωκεν εἰς τὰς χεῖρας αὐτῶν
  choice: отдал в их руки
  rationale: Сохраняет греческую идиому и выраженную ею передачу во власть противника; подлежащее передано местоимением «Он» по контексту.
- source_word: τὰ ἱερὰ σκεύη τοῦ κυρίου
  choice: священные сосуды Господа
  rationale: «Сосуды» — естественное библейское обозначение храмовой утвари и формально соответствует σκεύη.
- source_word: τὰ μεγάλα καὶ τὰ μικρά
  choice: большие и малые
  rationale: Сохранено прямое противопоставление размеров без добавочного толкования.
- source_word: τὰς κιβωτοὺς τοῦ κυρίου
  choice: ковчеги Господа
  rationale: Множественное κιβωτούς буквально обозначает ковчеги, сундуки или лари; «ковчеги» сохраняет традиционный библейский регистр и не отождествляет их с единственным Ковчегом Завета.
- source_word: τὰς βασιλικὰς ἀποθήκας
  choice: царские сокровищницы
  rationale: В данном перечне изымаемых ценностей ἀποθήκαι естественно означает царские хранилища или сокровищницы; выбран литературный и понятный эквивалент.
- source_word: ἀναλαβόντες ἀπήνεγκαν
  choice: взяли … и унесли
  rationale: Передаёт последовательность, выраженную причастием и личным глаголом, естественной русской конструкцией.
theological_decisions:
- issue: Неявное подлежащее παρέδωκεν
  choice: «Он» с прописной буквы
  alternative: «он» или явное «Господь»
  rationale: Греческий текст оставляет подлежащее невыраженным, однако контекст указывает на Бога. Местоимение сохраняет эту синтаксическую неявность и не добавляет имени, отсутствующего в стихе.
- issue: Значение κιβωτούς во множественном числе
  choice: «ковчеги»
  alternative: «сундуки» / «лари»
  rationale: Сохранено более формальное соответствие и сакральный регистр; множественное число предотвращает ошибочное прямое отождествление с единственным Ковчегом Завета.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён до двух ясных предложений, при этом порядок перечисления и смысловые связи греческого текста сохранены.
