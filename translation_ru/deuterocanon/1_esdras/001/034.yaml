  yaml_path: translation/deuterocanon/1_esdras/001/034.yaml
  text: And he fined the nation one hundred talents of silver and one talent of gold[a].
translation:
  language: ru
  text: 'И наложил он на народ взыскание: сто талантов серебра и один талант золота.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оштрафовал народ на сто талантов серебра и один талант золота». Греческий глагол может означать причинение убытка или взыскание штрафа; здесь имеется в виду назначенная в наказание выплата серебром и золотом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζημίωσεν
  choice: наложил взыскание
  rationale: Глагол обозначает причинение убытка или назначение имущественного наказания. В сочетании с конкретными суммами серебра и золота речь идёт о денежном взыскании; такой перевод сохраняет карательный оттенок, не сводя его к обычной подати.
- source_word: τὸ ἔθνος
  choice: на народ
  rationale: ἔθνος здесь обозначает подвластное население как единое целое. «Народ» естественно звучит по-русски и точнее применительно к людям, чем «страна» или «земля».
- source_word: ἀργυρίου τάλαντοις ἑκατόν
  choice: сто талантов серебра
  rationale: Сохранена древняя мера веса и стоимости; родительный падеж естественно указывает металл.
- source_word: χρυσίου ταλάντῳ ἑνί
  choice: один талант золота
  rationale: Перевод сохраняет точное количество и контраст со ста талантами серебра.
