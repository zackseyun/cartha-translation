  text: And the king of Egypt made Joakim his brother king over Judea and Jerusalem[a].
translation:
  language: ru
  text: И царь Египта поставил царём Иоакима, брата его, над Иудеей и Иерусалимом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте имя дано в форме «Иоаким»; в параллельной еврейской традиции обычно употребляется форма «Йехояким».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: поставил царём
  rationale: В контексте царской власти глагол означает назначение или возведение на должность; русское «поставил царём» естественно передаёт каузативный смысл и сохраняет повтор βασιλέα.
- source_word: ὁ βασιλεὺς Αἰγύπτου
  choice: царь Египта
  rationale: Прямое и естественное соответствие греческому сочетанию с родительным падежом.
- source_word: Ἰωακεὶμ
  choice: Иоаким
  rationale: Форма передаёт греческое имя источника и соответствует принятому русскому библейскому написанию; отождествление с Иоакимом еврейской традиции поясняется в сноске.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: брата его
  rationale: Сохраняет родственную связь и допускаемую греческим местоимением отсылку; в контексте «его» естественно относится к ранее упомянутому лицу повествования, а не обязательно к царю Египта.
- source_word: βασιλέα
  choice: царём
  rationale: Точно обозначает названный в греческом официальный царский статус.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: над Иудеей и Иерусалимом
  rationale: Предлог «над» ясно выражает сферу поставленной царской власти и естественно сочетается с конструкцией «поставил царём».
