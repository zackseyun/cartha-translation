base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/030.yaml
  text: And throughout all Judea they mourned for Josiah[a]; and Jeremiah the prophet lamented over Josiah, and the leaders together with the women kept lamenting him to this day[b]; and this was ordained to be done forever.
translation:
  language: ru
  text: И по всей Иудее оплакивали Иосию; пророк Иеремия оплакал Иосию, а предводители вместе с женщинами продолжали оплакивать его по сей день[a]. И было установлено совершать это всегда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском параллельном тексте, 2 Пар. 35:24–25, сказано, что Иосию оплакивали вся Иудея и Иерусалим, а Иеремия произнёс о нём плач. Здесь, в 1 Ездры, добавлены предводители и женщины, оплакивающие его «по сей день».
    reason: cross_reference
  - marker: b
    text: 'Или: «было предписано делать это постоянно»; или: «это стало постоянным обычаем». Греческое выражение указывает на официально установленную продолжающуюся практику, но точный оттенок глагола не вполне ясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: по всей Иудее
  rationale: Естественно передаёт местную сферу действия и полноту ὅλῃ.
- source_word: ἐπένθησαν
  choice: оплакивали
  rationale: Глагол обозначает траур по умершему; русское «оплакивали» ясно выражает погребальный контекст.
- source_word: ἐθρήνησεν
  choice: сложил плач
  rationale: θρηνέω конкретнее общего скорбного переживания и может обозначать произнесение или создание погребального плача; перевод сохраняет отличие от ἐπένθησαν.
- source_word: ὑπὲρ Ἰωσείου
  choice: об Иосии
  rationale: В контексте плача ὑπέρ указывает на того, кому посвящён плач; «об Иосии» естественно по-русски.
- source_word: οἱ προκαθήμενοι
  choice: предводители
  rationale: Слово обозначает стоящих во главе или занимающих видное положение, не уточняя конкретной должности.
- source_word: σὺν γυναιξὶν
  choice: вместе с женщинами
  rationale: Прямо сохраняет выраженное σύν совместное участие.
- source_word: ἐθρηνοῦσαν
  choice: оплакивали
  rationale: Имперфект передаёт продолжавшееся действие; длительность дополнительно выражена оборотом «до сего дня».
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: до сего дня
  rationale: Устойчивый, достоинственный русский оборот, указывающий на продолжение обычая до времени повествователя.
- source_word: ἐξεδόθη τοῦτο γενέσθαι ἀεί
  choice: было установлено совершать это всегда
  rationale: Передаёт формальное введение постоянной практики, не уточняя ни установителя, ни юридическую или культовую форму решения.
theological_decisions:
- issue: Степень нормативности заключительного установления
  choice: было установлено совершать это всегда
  alternative: было предписано делать это вечно; это стало постоянным обычаем
  rationale: Греческий текст говорит о формально закреплённой продолжающейся практике, однако не называет установителя и не определяет её как закон или богослужебное предписание.
translation_notes:
  register: 'Современный литературный русский язык с достоинственным библейским звучанием. «До сего дня» сохранено как понятный традиционный оборот; синтаксис умеренно формален. Маркеры сносок соотнесены с соответствующими утверждениями: [a] — параллельный текст, [b] — неоднозначность заключительной формулы.'
