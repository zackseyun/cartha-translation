  source_fidelity: Заключительный имперфект ἐθρηνοῦσαν обозначает продолжающееся действие, сохраняющееся «по сей день». В черновике эта длительность возможна по контексту, но не выражена явно; кроме того, «сложил плач» может означать сочинение произведения, тогда как греческое ἐθρήνησεν прямо говорит, что Иеремия совершил плач/оплакал Иосию.
  naturalness: Предлагаемый текст сохраняет современный литературный и достойный библейский регистр. «По сей день» естественнее для современного русского, чем несколько более традиционное «до сего дня».
  terminology: «Предводители» приемлемо передаёт οἱ προκαθήμενοι без неоправданного уточнения должности. «Оплакал» для Иеремии и «продолжали оплакивать» для предводителей с женщинами воспроизводят различие аориста и имперфекта. Формула «было установлено» осторожно передаёт ἐξεδόθη, не приписывая установлению конкретной юридической или культовой формы.
