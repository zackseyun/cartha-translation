base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/001.yaml
  text: And Josiah kept the Passover in Jerusalem to the Lord his God[a], and they slaughtered the Passover on the fourteenth day of the first month,
translation:
  language: ru
  text: И отпраздновал Иосия Пасху в Иерусалиме Господу своему[a], и закололи пасхальную жертву в четырнадцатый день первого месяца,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Господу своему»; в еврейском параллельном тексте (2 Пар. 35:1): «Господу».'
    reason: Указывает на значимое различие между основным греческим текстом с притяжательным местоимением и еврейским параллельным свидетельством без него.
lexical_decisions:
- source_word: ἤγαγεν
  choice: отпраздновал
  rationale: Буквально глагол означает «привёл, провёл», но в сочетании с πάσχα обозначает совершение или празднование Пасхи. «Отпраздновал» естественно передаёт культовый контекст.
- source_word: τὸ πάσχα (первое употребление)
  choice: Пасху
  rationale: Здесь имеется в виду пасхальное празднование в целом; традиционное русское название праздника передаёт смысл прямо и естественно.
- source_word: τῷ κυρίῳ αὐτοῦ
  choice: для своего Господа
  rationale: Дательный падеж передаёт посвящённость празднования Господу, а αὐτοῦ — принадлежность «своего». Такая формулировка сохраняет греческое чтение и звучит естественнее буквального «своему Господу» после «отпраздновал».
- source_word: ἔθυσαν
  choice: закололи
  rationale: Глагол обозначает жертвенное заклание. Конкретное «закололи» соответствует и контексту пасхальной жертвы, и семитскому параллельному свидетельству.
- source_word: τὸ πάσχα (второе употребление)
  choice: пасхальную жертву
  rationale: При глаголе жертвенного заклания πάσχα обозначает уже не праздник в целом, а пасхальное жертвенное животное. «Пасхальная жертва» не уточняет вид животного сверх греческого текста.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ τοῦ μηνὸς τοῦ πρώτου
  choice: в четырнадцатый день первого месяца
  rationale: Естественная русская передача временного дательного и последующего родительного оборота.
theological_decisions:
- issue: Передача κύριος при наличии в еврейском параллельном тексте имени YHWH
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основной греческий текст содержит κύριος и притяжательное αὐτοῦ, поэтому перевод сохраняет «своего Господа», не подменяя его формой, принятой для непосредственной передачи тетраграмматона.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Отпраздновал» и «пасхальная жертва» обеспечивают ясность без внесения отсутствующего в греческом тексте уточнения «ягнёнок». Сохранена конечная запятая, поскольку представленный стих синтаксически продолжается далее.
