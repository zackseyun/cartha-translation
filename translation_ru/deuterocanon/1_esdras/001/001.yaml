  rationale: 'Исправлена передача греческого датива: «Господу своему» сохраняет посвящённость действия адресату и притяжательное αὐτοῦ без смыслового сдвига, создаваемого предлогом «для». Соответствующим образом уточнено примечание. Остальная формулировка сохраняет смысл, регистр и синтаксическую незавершённость стиха.'
