base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/041.yaml
  text: And Jehoiakim his son reigned in his place; for when he was appointed[a], he was eight years old.
translation:
  language: ru
  text: И вместо него воцарился Иоаким, его сын; ибо, когда он был поставлен царём[a], ему было восемь лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Согласно греческому тексту, при поставлении царём ему было восемь лет. В других библейских традициях иначе указаны личность царя или его возраст при восшествии на престол; здесь сохранено чтение греческого текста 1 Ездры.
    reason: textual_variant
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: воцарился
  rationale: В историческом повествовании аорист передаёт вступление в царствование; русское «воцарился» естественно выражает смену царя.
- source_word: ἀντ᾽ αὐτοῦ
  choice: вместо него
  rationale: Сохраняет значение замещения и престолонаследия, не сводя выражение лишь к хронологическому «после него».
- source_word: Ἰωακεὶμ
  choice: Иоаким
  rationale: Употреблена традиционная русская библейская форма имени, соответствующая греческому Ἰωακεὶμ.
- source_word: ὁ υἱὸς αὐτοῦ
  choice: его сын
  rationale: Прямая и естественная передача родственного обозначения.
- source_word: ἀνεδείχθη
  choice: был поставлен царём
  rationale: Пассивная форма обозначает официальное возведение или назначение; добавление «царём» ясно передаёт подразумеваемую должность из контекста, сохраняя пассивность выражения.
- source_word: ἐτῶν ὀκτώ
  choice: ему было восемь лет
  rationale: Обычная современная русская форма указания возраста.
theological_decisions:
- issue: Возраст и личность царя в этом сообщении расходятся с более известными параллельными библейскими традициями.
  choice: 'В основном тексте сохранено ясное чтение греческого источника: Иоакиму было восемь лет.'
  alternative: Согласовать имя царя или его возраст с иной библейской традицией.
  rationale: Первичным источником для 1 Ездры служит греческий текст. Его недвусмысленное сообщение нельзя молча исправлять или гармонизировать; расхождение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Воцарился» и «поставлен царём» понятны широкому читателю и подходят для исторического повествования; синтаксис сохраняет причинно-временную связь греческого ὅτε γάρ без искусственной архаизации.
