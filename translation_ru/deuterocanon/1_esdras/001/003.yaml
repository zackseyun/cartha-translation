base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/003.yaml
  text: And he said to the Levites[a], the holy servants of Israel, “Sanctify yourselves to the Lord in the place of the holy ark of the Lord, in the house that Solomon son of David the king built.”
translation:
  language: ru
  text: 'И сказал он левитам, священнослужителям Израиля: «Освятите их[a] для Господа на месте святого ковчега Господня, в доме, который построил царь Соломон, сын Давида».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте — «освятите их», но к кому относится «их», неясно. В еврейском параллельном тексте сказано иначе: «Поставьте святой ковчег в доме, который построил Соломон, сын Давида, царь Израиля».'
    reason: Сноска сохраняет прозрачность в отношении неясного местоимения в основном греческом источнике и существенного отличия еврейской параллели.
lexical_decisions:
- source_word: Λευείταις
  choice: левитам
  rationale: Общепринятое русское библейское наименование потомков Левия; соответствует также еврейской параллели.
- source_word: ἱεροδούλοις
  choice: священнослужителям
  rationale: Передаёт посвящённость священному служению и естественно выступает приложением к слову «левитам», не отождествляя их с отдельной категорией храмовых рабов.
- source_word: ἁγιάσατε αὐτούς
  choice: освятите их
  rationale: 'Сохраняет форму греческого текста: повелительный глагол с местоимением мужского рода во множественном числе. Референт местоимения неясен, и эта неясность не устраняется в основном тексте.'
- source_word: τῷ κυρίῳ
  choice: для Господа
  rationale: В сочетании с «освятите» дательный передаёт посвящение Господу; перевод остаётся привязанным к греческому κύριος.
- source_word: ἐν τῇ θέσει τῆς ἁγίας κιβωτοῦ
  choice: на месте святого ковчега
  rationale: Буквально и понятно передаёт указание места, хотя связь этой фразы с предшествующим повелением в греческом тексте необычна.
- source_word: ἐν τῷ οἴκῳ
  choice: в доме
  rationale: Сохраняет буквальное значение οἶκος; из контекста ясно, что имеется в виду храм.
- source_word: ᾧ ᾠκοδόμησεν Σαλωμὼν ὁ τοῦ Δαυεὶδ ὁ βασιλεύς
  choice: который построил Соломон, сын Давида, царь
  rationale: Сохраняет относительную конструкцию, родственное обозначение и приложенное царское звание без добавления отсутствующего в греческом «Израиля».
theological_decisions:
- issue: Передача κύριος при наличии еврейской параллели с именем YHWH
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основным источником служит греческий текст с κύριος; поэтому в основной текст не переносится графическая конвенция, отражающая еврейское имя.
- issue: Следует ли согласовать неясный греческий текст с более ясной еврейской параллелью
  choice: Сохранить «освятите их» и пояснить разночтение в сноске
  alternative: «Поставьте святой ковчег в доме…»
  rationale: Греческое αὐτούς действительно означает «их», но его референт неясен. Исправление на возвратное «себя» или замена всей фразы чтением еврейской параллели молча разрешили бы текстовую трудность.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Необычная синтаксическая и смысловая напряжённость греческого текста сохранена; пунктуация проясняет приложения, не добавляя отсутствующих связей.
