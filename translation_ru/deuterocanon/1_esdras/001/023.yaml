  yaml_path: translation/deuterocanon/1_esdras/001/023.yaml
  text: And after all this activity of Josias[a], it happened that Pharaoh king of Egypt came to stir up war at Carchemish on the Euphrates[b]; and Josias went out against him.
translation:
  language: ru
  text: После всей этой деятельности Иосии случилось, что фараон, царь Египта, пришёл начать войну в Каркамисе, у Евфрата; и Иосия выступил…[a]
  philosophy: optimal-equivalence
  footnotes:
