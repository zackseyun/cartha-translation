base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/028.yaml
  text: And the king said to his servants[a], “Take me away from the battle, for I am very weak.” And immediately his servants took him away from the battle line,
translation:
  language: ru
  text: 'И сказал царь своим слугам[a]: «Уведите меня с поля боя, потому что я очень ослаб». И слуги тотчас вывели его из боевого строя,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сопровождающим». Греческое слово παῖδες может означать слуг, сопровождающих или молодых людей; в параллельном древнееврейском тексте — «его слуги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παῖς / παισίν / παῖδες
  choice: слуги
  rationale: В контексте царя и сражения речь идёт о личных слугах или сопровождающих, а не о детях; параллельный древнееврейский текст עֲבָדָיו также поддерживает значение «его слуги».
- source_word: Ἀποστήσατέ με
  choice: Уведите меня
  rationale: Повелительная форма означает физически удалить царя из места сражения; «уведите меня» естественно передаёт это действие по-русски.
- source_word: ἀπὸ τῆς μάχης
  choice: с поля боя
  rationale: Оборот обозначает удаление из самой битвы; по-русски «с поля боя» ясно и естественно выражает ситуацию, не добавляя указания на ранение.
- source_word: ἠσθένησα
  choice: я очень ослаб
  rationale: Глагол указывает на наступившую слабость, но сам по себе не означает «я тяжело ранен»; прошедшее совершенное «ослаб» сохраняет результативный оттенок греческого аориста.
- source_word: λίαν
  choice: очень
  rationale: Наречие усиливает степень слабости; «очень» точно и естественно в современном русском языке.
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт немедленность исполнения приказа в достойном повествовательном регистре.
- source_word: παράταξις
  choice: боевой строй
  rationale: Слово обозначает выстроенное боевое расположение или линию войск; «боевой строй» точнее, чем повторное «поле боя».
