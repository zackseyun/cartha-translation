base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/032.yaml
  text: And those from the nation took Jechoniah son of Josiah and made him king in place of Josiah his father, when he was twenty-three years old.
translation:
  language: ru
  text: И люди из народа взяли Иехонию[a], сына Иосии, и поставили его царём вместо его отца Иосии; ему было двадцать три года.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте стоит «Иехонию»; в параллельном повествовании 2 Паралипоменон 36:1 назван Иоахаз.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: взяли
  rationale: Передаёт конкретное действие, предваряющее возведение на царство, без добавления не выраженной в греческом обрядовой детали.
- source_word: οἱ ἐκ τοῦ ἔθνους
  choice: люди из народа
  rationale: Естественно и достаточно близко передаёт греческое выражение; более специальное «народ земли» не вводится, поскольку в основном греческом источнике стоит ἔθνος, а не γῆ.
- source_word: ἀνέδειξαν βασιλέα
  choice: поставили его царём
  rationale: Глагол в данном контексте обозначает назначение или возведение на царство. Русская формула ясна и не конкретизирует церемонию как провозглашение или коронацию.
- source_word: ἀντὶ Ἰωσείου τοῦ πατρὸς αὐτοῦ
  choice: вместо его отца Иосии
  rationale: Сохраняет значение замещения или преемства, выраженное предлогом ἀντί, и естественный русский порядок слов.
- source_word: ὄντα ἐτῶν εἴκοσι τριῶν
  choice: ему было двадцать три года
  rationale: Естественная современная русская передача греческой причастной формулы возраста без изменения её описательного смысла.
- source_word: Ἰεχονίαν
  choice: Иехонию
  rationale: Основной текст следует явному чтению греческого источника — Ἰεχονίαν; расхождение с параллельным повествованием отмечено в сноске.
theological_decisions:
- issue: Расхождение имени с параллельным историческим повествованием
  choice: В основном тексте — «Иехонию» согласно греческому Ἰεχονίαν
  alternative: «Иоахаза» согласно 2 Паралипоменон 36:1
  rationale: Первичным источником для 1 Ездры служит греческий текст. Гармонизация устранила бы реальное текстовое расхождение, поэтому альтернативная идентификация вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Формулировка сохраняет близость к греческому синтаксису, но избегает неестественного буквализма; подлинное расхождение в имени не сглажено.
