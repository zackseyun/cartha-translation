base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/048.yaml
  text: And the God of their fathers sent by his angel to visit their people and to call them back[b][a], because he had compassion on them and on his dwelling place.
translation:
  language: ru
  text: И Царь их отцов[b], Бог их отцов, послал через Своего ангела[a] посетить их народ и призвать их обратно, потому что щадил их и Свою обитель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своего вестника»; греческое ἄγγελος может означать как ангела, так и вестника.'
    reason: lexical_alternative
  - marker: b
    text: 'Начало греческого текста необычно и буквально гласит: «Царь их отцов, Бог их отцов». Оба именования сохранены как стоящие рядом титулы Бога.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный и естественный эквивалент аориста ἀποστέλλω, сохраняющий прямую повествовательную силу.
- source_word: ὁ βασιλεὺς τῶν πατέρων αὐτῶν
  choice: Царь их отцов
  rationale: Передаёт необычное чтение сохранившегося греческого текста как божественный титул, не устраняя его молчаливой правкой.
- source_word: ὁ θεὸς τῶν πατέρων αὐτῶν
  choice: Бог их отцов
  rationale: Сохраняет обычную библейскую формулу и её связь с предками народа.
- source_word: ἐπισκέψασθαι
  choice: посетить
  rationale: Сохраняет библейскую многозначность посещения, предполагающего внимание, заботу или вмешательство.
- source_word: τὸν λαὸν αὐτῶν
  choice: их народ
  rationale: Точно отражает греческое местоимение αὐτῶν — «их», хотя по контексту ожидалось бы «Свой народ».
- source_word: διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: Своего ангела
  rationale: В контексте Божьего посланничества «ангел» является естественным основным значением; возможность значения «вестник» отмечена в сноске.
- source_word: μετακαλέσαι αὐτούς
  choice: призвать их обратно
  rationale: Передаёт значение призыва вернуться, заложенное в сложном глаголе, не уточняя сверх текста, куда именно следует вернуться.
- source_word: καθὸ ἐφείδετο αὐτῶν
  choice: потому что Он щадил их
  rationale: φείδομαι прежде всего допускает значение «щадить»; оно также сохраняет оттенок жалости и милосердия без излишнего истолкования.
- source_word: τοῦ σκηνώματος αὐτοῦ
  choice: Свою обитель
  rationale: Передаёт священное место Божьего пребывания, не сужая значение до переносной скинии и не подменяя его словом «храм».
theological_decisions:
- issue: Необычное двойное именование Бога в начале стиха
  choice: Сохранить «Царь их отцов, Бог их отцов» как два стоящих рядом божественных титула.
  alternative: Считать «Царь их отцов» повреждением текста и опустить либо исправить эту фразу.
  rationale: В дошедшем греческом тексте присутствуют оба именования. Их сохранение честно передаёт источник и не устраняет текстовую трудность.
- issue: Значение ἄγγελος
  choice: ангел
  alternative: вестник, посланник
  rationale: При Божьем посланничестве «ангел» естественен, но греческое слово не исключает более широкого значения; поэтому альтернатива вынесена в сноску.
- issue: Оттенок φείδομαι
  choice: щадил
  alternative: сжалился над, сострадал
  rationale: «Щадил» ближе к основному лексическому значению и сохраняет напряжение между пощадой и состраданием.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Заглавные буквы в «Царь», «Бог», «Своего» и «Он» обозначают Бога; синтаксис сделан естественным, но необычное двойное именование и местоимение «их народ» сохранены по греческому источнику.
