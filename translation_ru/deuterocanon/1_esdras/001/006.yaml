base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/006.yaml
  text: In order[a], sacrifice the Passover, and prepare the sacrifices for your brothers[b], and keep the Passover according to the command of the Lord that was given to Moses.
translation:
  language: ru
  text: В должном порядке[a] принесите пасхальную жертву, приготовьте жертвы для ваших братьев[b] и отпразднуйте Пасху согласно повелению Господа, данному Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по чинам», «в установленном порядке». Выражение указывает на упорядоченное расположение или распределение; еврейский параллельный текст говорит о подразделениях и группах.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «братья» — другие члены народа, а не только родные братья.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τάξει
  choice: в установленном порядке
  rationale: Греческое выражение употреблено наречно и указывает на упорядоченное расположение или действие. Перевод естественен по-русски и сохраняет краткость оригинала; возможный оттенок распределения по разрядам отмечен в сноске.
- source_word: θύσατε τὸ πάσχα
  choice: принесите пасхальную жертву
  rationale: В жертвенном контексте θύω означает приносить в жертву, а τὸ πάσχα может обозначать пасхальную жертву или пасхального агнца. Выбранная формулировка передаёт культовый смысл, не уточняя сверх текста вид жертвенного животного.
- source_word: τὰς θυσίας ἑτοιμάσατε
  choice: приготовьте жертвы
  rationale: Прямой и естественный перевод, сохраняющий множественное число и ритуальный контекст.
- source_word: τοῖς ἀδελφοῖς ὑμῶν
  choice: для ваших братьев
  rationale: Сохраняется мужская родственная лексика оригинала; в данном контексте речь идёт о соплеменниках, что поясняется в сноске.
- source_word: ποιήσατε τὸ πάσχα
  choice: совершите Пасху
  rationale: Сочетание ποιέω с названием Пасхи означает соблюсти или совершить пасхальный обряд. «Совершите Пасху» звучит естественно и достойно, сохраняя формальный обрядовый оттенок.
- source_word: κατὰ τὸ πρόσταγμα τοῦ κυρίου
  choice: согласно повелению Господа
  rationale: πρόσταγμα обозначает властное предписание; «повеление» точно передаёт этот смысл. κύριος переведено как «Господь» в соответствии с непосредственным греческим источником.
- source_word: τὸ δοθὲν τῷ Μωυσῇ
  choice: данному Моисею
  rationale: Причастный оборот непосредственно относится к «повелению» и передан кратко, без добавления отсутствующего в тексте посреднического оттенка.
theological_decisions:
- issue: Значение ἀδελφοῖς в общинном контексте
  choice: братьев
  alternative: соплеменников; собратьев; братьев и сестёр
  rationale: Греческое слово имеет мужскую форму, но здесь обозначает членов народа, а не только родных братьев. Основной текст сохраняет образ оригинала, а широкий контекстуальный смысл разъясняется в сноске.
- issue: Передача κύριος в греческом тексте
  choice: Господа
  alternative: ГОСПОДА
  rationale: Непосредственный источник содержит греческое κύριος, поэтому перевод не ретроверсирует его в тетраграмматон и не вводит типографическое различие, которого нет в исходном тексте.
- issue: Два употребления τὸ πάσχα
  choice: «пасхальную жертву» в первом случае и «Пасху» во втором
  alternative: «Пасху» в обоих случаях
  rationale: С глаголом θύω первое употребление наиболее естественно относится к жертве, тогда как ποιέω τὸ πάσχα обозначает совершение пасхального обряда. Различие передаёт контекстуальные функции одного греческого выражения, не уточняя жертву как агнца.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, богослужебно-историческим регистром. Избегаются как архаизмы вроде «братия», так и разговорные обороты. Название праздника «Пасха» пишется с прописной буквы; в сочетании «пасхальная жертва» прилагательное остаётся со строчной.
