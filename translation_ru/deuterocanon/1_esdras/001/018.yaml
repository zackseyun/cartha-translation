base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/018.yaml
  text: And no Passover like this had been held in Israel since the days of Samuel the prophet.
translation:
  language: ru
  text: И такой Пасхи не совершали в Израиле со времён пророка Самуила.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤχθη
  choice: не совершали
  rationale: Пассивная форма ἄγω в контексте праздника идиоматически означает проведение обряда или празднования. Русское «не совершали» естественно для культового контекста и не сводит смысл лишь к эмоциональному «праздновали».
- source_word: τὸ πάσχα
  choice: Пасхи
  rationale: «Пасха» — общепринятое соответствие πάσχα; в отрицательной конструкции родительный падеж звучит естественно по-русски.
- source_word: τοιοῦτο
  choice: такой
  rationale: 'Передаёт сравнительный смысл: Пасхи такого рода или масштаба прежде не было.'
- source_word: ἐν τῷ Ἰσραήλ
  choice: в Израиле
  rationale: Прямое и естественное обозначение народа и исторической общности, в пределах которой проводится сравнение.
- source_word: ἀπὸ τῶν χρόνων
  choice: со времён
  rationale: Естественный русский историко-временной оборот, точно передающий начальную точку отсчёта с ἀπό.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: пророка Самуила
  rationale: Точно передаёт греческое именование Самуила пророком и соответствует нормальному русскому порядку слов.
theological_decisions:
- issue: Историческая формула сравнения и расхождение с приблизительной масоретской параллелью
  choice: со времён пророка Самуила
  alternative: со времени Самуила-пророка
  rationale: Греческий первичный источник прямо называет Самуила и отсчитывает период от его времён. Приблизительная еврейская параллель не должна вытеснять ясное чтение греческого текста.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная историческая проза. Сохранены отрицательная сравнительная конструкция и культовый оттенок глагола.
