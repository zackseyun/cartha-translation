  terminology: «Земля», «субботы», «запустение» и «семьдесят лет» точны. Замена «соблюдала субботу» на «соблюдала субботний покой» сохраняет субботнюю лексику σαββατιεῖ, не превращая её в предписание, исполняемое землёй.
