base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/055.yaml
  text: until the land had enjoyed its Sabbaths; all the time of its desolation it kept Sabbath[a], to complete seventy years.
translation:
  language: ru
  text: пока земля не насладилась своими субботами[a]; всё время своего запустения она соблюдала субботний покой, чтобы исполнились семьдесят лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пока земля не была довольна своими субботами» или «не нашла удовольствия в своих субботах». Греческий текст олицетворяет землю.'
    reason: Лексическая альтернатива и пояснение сохранённого олицетворения.
lexical_decisions:
- source_word: Ἕως τοῦ εὐδοκῆσαι
  choice: пока … не насладилась
  rationale: Конструкция с ἕως обозначает предел длительности, а εὐδοκέω передаёт удовольствие или удовлетворение. «Насладилась» естественно по-русски сохраняет олицетворение земли и смысл полученного ею субботнего покоя.
- source_word: τὴν γῆν
  choice: земля
  rationale: В контексте изгнания речь идёт о земле Иудеи, а не обо всей Земле или только о почве.
- source_word: τὰ σάββατα αὐτῆς
  choice: своими субботами
  rationale: Сохранены множественное число и явная субботняя терминология, связывающая стих с покоем земли.
- source_word: πάντα τὸν χρόνον τῆς ἐρημώσεως αὐτῆς
  choice: всё время своего запустения
  rationale: Фраза обозначает весь период, когда земля оставалась разорённой и необитаемой; «запустение» соответствует торжественному повествовательному регистру.
- source_word: σαββατιεῖ
  choice: она соблюдала субботу
  rationale: Однокоренной с σάββατον глагол выражает именно субботний покой, а не отдых вообще. Прошедшее время естественно в русском повествовательном контексте и соответствует значению действия в течение завершившегося периода.
- source_word: εἰς συμπλήρωσιν
  choice: пока не исполнилось
  rationale: Оборот указывает на достижение полной меры срока; такая формулировка естественно связывает запустение с завершением семидесяти лет.
- source_word: ἐτῶν ἑβδομήκοντα
  choice: семьдесят лет
  rationale: Числовое выражение переведено буквально ввиду его исторической и богословской значимости.
theological_decisions:
- issue: Субботняя терминология применительно к земле во время изгнания
  choice: Сохранить «своими субботами» и «соблюдала субботу».
  alternative: «периодами субботнего покоя … покоилась» или просто «отдыхала».
  rationale: В греческом намеренно повторяется субботний корень; это подчёркивает представление о том, что в период запустения земля получает не предоставленный ей прежде субботний покой.
- issue: Олицетворение земли
  choice: 'Сохранить землю как действующее лицо: она «насладилась» и «соблюдала субботу».'
  alternative: 'Передать безлично: «пока не были восполнены субботы земли».'
  rationale: Греческий текст олицетворяет землю; устранение этого образа ослабило бы выразительность и богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Повтор субботней лексики и олицетворение земли сохранены; синтаксис сделан понятным для обычного читателя.
