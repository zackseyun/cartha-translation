base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/046.yaml
  text: And though he had sworn by the name of the Lord to King Nebuchadnezzar[a], he broke his oath and rebelled; and, stiffening his neck and his heart[c][b], he transgressed the laws of the Lord God of Israel.
translation:
  language: ru
  text: Хотя он и поклялся царю Навуходоносору именем Господа[a], он нарушил клятву и восстал[b]; ожесточив свою шею и сердце, он преступил установления Господа, Бога Израиля.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможна более близкая к греческому передача начала фразы: «будучи приведён царём Навуходоносором к присяге именем Господа». Предлог при имени царя синтаксически неоднозначен; по смыслу речь идёт о клятве верности ему.'
    reason: lexical_alternative
  - marker: b
    text: Вероятнее всего, имеется в виду восстание против Навуходоносора, хотя в греческом тексте объект не назван прямо.
    reason: alternative_reading
  - marker: c
    text: 'Или: «законы» либо «предписания» Господа, Бога Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρκισθεὶς ἀπὸ τοῦ βασιλέως Ναβουχοδονόσορ
  choice: хотя он поклялся царю Навуходоносору
  rationale: Аористное пассивное причастие указывает на предшествующее действие, а ἀπό при царе может обозначать инициатора приведения к клятве. В основном тексте выбрана естественная русская формулировка, передающая клятву верности царю; формальная неоднозначность отмечена в сноске.
- source_word: τῷ ὀνόματι τοῦ κυρίου
  choice: именем Господа
  rationale: Дательный падеж обозначает имя, которым торжественно скреплена клятва. Формула «именем Господа» естественна по-русски и сохраняет религиозную серьёзность клятвы.
- source_word: ἐφιορκήσας
  choice: нарушил клятву
  rationale: Глагол означает нарушение уже принесённой клятвы. Такая передача яснее современному читателю, чем юридически узкое «совершил клятвопреступление».
- source_word: ἀπέστη
  choice: восстал
  rationale: В царско-политическом контексте глагол означает отпадение или мятеж против владычества; «восстал» передаёт этот смысл, не превращая его в религиозное отступничество.
- source_word: σκληρύνας αὐτοῦ τὸν τράχηλον καὶ τὴν καρδίαν αὐτοῦ
  choice: ожесточив свою шею и сердце
  rationale: Сохранён телесно-нравственный библейский образ упрямства и внутренней непреклонности без поясняющего перефразирования в основном тексте.
- source_word: παρέβη
  choice: преступил
  rationale: Глагол выражает переход установленной границы и нарушение закона; «преступил» сохраняет высокий заветно-правовой тон.
- source_word: τὰ νόμιμα
  choice: установления
  rationale: Слово обозначает установленные нормы или предписания. «Установления» точнее сохраняет оттенок νόμιμα, чем обобщённое «законы», и остаётся понятным современному читателю.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: Господа, Бога Израиля
  rationale: Приложение с запятой ясно передаёт, что Господь назван Богом Израиля, и естественно звучит в современном литературном русском.
theological_decisions:
- issue: Передача κύριος в формуле клятвы и божественном титуле
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Перевод следует непосредственно греческому κύριος и не вводит в основной текст типографическое обозначение еврейского тетраграмматона, отсутствующее как таковое в греческом источнике.
- issue: Следует ли прямо назвать адресата восстания
  choice: он нарушил клятву и восстал
  alternative: он нарушил клятву и восстал против Навуходоносора
  rationale: Объект ἀπέστη в греческом не выражен. Контекст указывает прежде всего на политический мятеж против Навуходоносора, но основной текст не добавляет отсутствующий объект; вероятный смысл вынесен в сноску.
- issue: Сохранение образа ожесточённой шеи и сердца
  choice: ожесточив свою шею и сердце
  alternative: проявив упрямство и ожесточившись сердцем
  rationale: Буквенный образ одновременно описывает внешнее упрямство и внутреннее состояние. Его сохранение не устраняет заложенное в тексте нравственно-богословское напряжение.
translation_notes:
  register: Современный литературный русский с достоинством библейской повествовательной прозы. Сохранены традиционные образы «ожесточить шею и сердце» и правовой глагол «преступить», но синтаксис сделан прозрачным. Частица «хотя» эксплицирует уступительное отношение, подразумеваемое последовательностью клятвы и её нарушения.
