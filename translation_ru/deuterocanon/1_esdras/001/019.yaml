base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/019.yaml
  text: And all the kings of Israel had not kept such a Passover as Josias kept[c][b][a], and the priests and the Levites and the Judeans and all Israel who were found dwelling in Jerusalem.
translation:
  language: ru
  text: И ни один из царей Израиля не совершал такой Пасхи, какую совершил Иосия, — ни священники, ни левиты, ни иудеи[a], ни весь Израиль, находившийся в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жители Иудеи». Здесь слово, вероятно, имеет этногеографический смысл и обозначает народ Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἤγαγον πάσχα τοιοῦτον οἷον ἤγαγεν
  choice: не совершал такой Пасхи, какую совершил
  rationale: Сочетание ἄγω с πάσχα идиоматически обозначает совершение или празднование Пасхи, а не буквальное «ведение». Сравнительная конструкция τοιοῦτον οἷον передана как «такой… какую».
- source_word: Ἰωσείας
  choice: Иосия
  rationale: Современная русская библейская форма имени позволяет однозначно распознать царя; греческая форма Ἰωσείας соответствует еврейскому יֹאשִׁיָּהוּ.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: В данном историческом контексте слово указывает прежде всего на народ Иуды; «иудеи» сохраняет этногеографический оттенок и естественно звучит по-русски.
- source_word: πᾶς Ἰσραὴλ
  choice: весь Израиль
  rationale: Сохранено стандартное собирательное выражение без сужения его объёма.
- source_word: οἱ εὑρεθέντες ἐν τῇ κατοικήσει αὐτῶν ἐν Ἰερουσαλήμ
  choice: те, кто находился тогда в Иерусалиме
  rationale: Греческая фраза синтаксически неловка и буквально говорит о «найденных» в месте их проживания в Иерусалиме. Контекстуально речь идёт о находившихся или проживавших там людях; «тогда» проясняет присутствие при событии, не превращая его обязательно в постоянное жительство.
theological_decisions:
- issue: Объём выражения «все цари Израиля»
  choice: Сохранить широкое историческое утверждение без ограничения царями Иуды.
  alternative: «все прежние цари» или «все цари Израиля и Иуды»
  rationale: В греческом прямо сказано πάντες οἱ βασιλεῖς τοῦ Ἰσραήλ. Перевод не гармонизирует это выражение с более узкой исторической формулировкой.
- issue: Соотнесение Иосии с остальными участниками
  choice: Сохранить простое соединение союзом «и», не добавляя «вместе с».
  alternative: «Иосия вместе со священниками…»
  rationale: 'Источник допускает некоторую синтаксическую шероховатость: после сравнения с Иосией следует ряд участников, соединённых καί. Добавление «вместе с» сделало бы отношение более определённым, чем в греческом.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Совершать Пасху» сохраняет культовый смысл исходной идиомы. Тире помогает показать, что заключительная характеристика относится к «всему Израилю», при этом не устраняет полностью синтаксическую напряжённость греческого текста.
