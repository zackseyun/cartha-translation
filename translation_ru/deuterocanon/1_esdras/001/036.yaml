base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/036.yaml
  text: And he bound Jehoiakim’s nobles[a], and after seizing Zarius his brother[b], he brought him up from Egypt.
translation:
  language: ru
  text: И он[a] связал вельмож[b] Иоакима, а Зария, его брата, схватил и привёл из Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом предложении подлежащее не названо прямо. По более широкому контексту речь идёт о царе Египта; при изолированном чтении сжатая конструкция может быть понята иначе — так, будто действие совершает Иоаким.
    reason: Сохранение синтаксической и исторической неоднозначности исходного текста.
  - marker: b
    text: 'Или: «знатных людей», «сановников».'
    reason: Лексические варианты для τοὺς μεγιστᾶνας.
lexical_decisions:
- source_word: ἔδησεν
  choice: связал
  rationale: Глагол δέω прежде всего означает «связывать, сковывать». «Связал» сохраняет конкретность греческого слова, не уточняя без основания вид заключения или оков.
- source_word: Ἰωακεὶμ τοὺς μεγιστᾶνας
  choice: вельмож Иоакима
  rationale: 'Так передаётся сжатая греческая конструкция в согласии с контекстом: речь идёт о знатных людях, принадлежавших к окружению Иоакима. Имя передано в принятой русской библейской форме.'
- source_word: τοὺς μεγιστᾶνας
  choice: вельмож
  rationale: μεγιστᾶνες обозначает высокопоставленных, влиятельных людей. «Вельможи» — краткое и уместное для исторического повествования обозначение знати, не сводящее её непременно к формальным должностным лицам.
- source_word: Ζάριον
  choice: Зария
  rationale: В греческом тексте стоит винительный падеж имени Ζάριος; русская форма «Зарий» закономерно даёт винительный «Зария» и остаётся близкой к греческому написанию.
- source_word: συλλαβών
  choice: схватил
  rationale: Причастие означает захват или взятие под стражу. В русском однородные сказуемые естественно передают последовательность действий без добавления формально-правового оттенка ареста.
- source_word: ἀνήγαγεν
  choice: привёл
  rationale: ἀνάγω означает вести или доставлять, нередко с направительным оттенком «вверх». «Привёл из Египта» звучит естественно и сохраняет перемещение лица, не вводя отсутствующей в тексте точки назначения.
- source_word: ἐξ Αἰγύπτου
  choice: из Египта
  rationale: Предлог ἐκ обозначает исходный пункт движения; «из Египта» точно и идиоматично передаёт его значение.
theological_decisions:
- issue: Кто совершает действия в сжатом историческом сообщении
  choice: Сохранить местоименное подлежащее «он», относящееся по контексту к египетскому царю, не называя его прямо в основном тексте.
  alternative: 'Понять Иоакима как подлежащее: «И Иоаким связал вельмож…»'
  rationale: Форма имени Ἰωακεὶμ несклоняема, а греческая фраза синтаксически сжата и допускает при изолированном чтении неоднозначность. Однако ближайший повествовательный контекст указывает на продолжающиеся действия египетского правителя. Местоимение сохраняет связность контекста и не добавляет полного обозначения, отсутствующего в данном предложении.
- issue: Связь вельмож с Иоакимом
  choice: Передать τοὺς μεγιστᾶνας как «вельмож Иоакима».
  alternative: Передать как самостоятельный объект — «Иоакима и вельмож», хотя союза «и» перед τοὺς μεγιστᾶνας в греческом нет.
  rationale: Притяжательное понимание отражает сжатую конструкцию консультационного текста и не вставляет отсутствующий союз. Необычность греческой формулировки отмечена в сноске, а не скрыта посредством чрезмерного уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Порядок имён и действий сделан естественным для русского синтаксиса; редкое, но понятное слово «вельможи» сохраняет социально-исторический оттенок оригинала.
