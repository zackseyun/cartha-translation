base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/016.yaml
  text: 'And the matters of the Lord’s sacrifice were completed on that day: the Passover was offered[a], and the sacrifices were brought up onto the altar of the Lord[b], according to the command of King Josias.'
translation:
  language: ru
  text: 'И в тот день было завершено всё, что относилось к жертвоприношению Господу: Пасха была принесена[a], а жертвы были принесены к жертвеннику Господа — согласно повелению царя Иосии[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пасха была принесена». В жертвенном контексте πάσχα может обозначать пасхальную жертву; глагол также можно передать как «была поднесена» или «была представлена».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте стоит форма Ἰωσείου (родительный падеж имени Ἰωσίας). В русской библейской традиции это имя обычно передаётся как «Иосия».
    reason: source_form
lexical_decisions:
- source_word: συνετελέσθη
  choice: было завершено
  rationale: Аорист пассивного залога обозначает завершение всех действий; безличная конструкция естественна для современного русского языка.
- source_word: τὰ τῆς θυσίας τοῦ κυρίου
  choice: всё, что относилось к жертвоприношению Господу
  rationale: Идиоматическое τὰ τῆς передаёт совокупность дел, связанных с жертвоприношением. Дательный «Господу» естественно обозначает адресата жертвы и не сужает выражение до одних лишь обрядов.
- source_word: ἀχθῆναι τὸ πάσχα
  choice: пасхальная жертва была принесена
  rationale: Буквально глагол означает «быть принесённой/доставленной», однако в жертвенном контексте «принесена» сохраняет и движение, и культовый смысл. «Пасхальная жертва» поясняет, что πάσχα здесь обозначает не только праздник.
- source_word: προσαχθῆναι τὰς θυσίας
  choice: жертвы возложены
  rationale: В сочетании с указанием на жертвенник προσάγω описывает поднесение и помещение жертв на него; «возложены» передаёт направленность действия и избегает неясного повтора глагола «принести».
- source_word: ἐπὶ τὸ τοῦ κυρίου θυσιαστήριον
  choice: на жертвенник Господа
  rationale: ἐπί с винительным падежом выражает движение на жертвенник; русский предлог «на» сохраняет этот направительный смысл.
- source_word: κατὰ τὴν ἐπιταγὴν
  choice: согласно повелению
  rationale: ἐπιταγή — властное предписание; «повеление» уместно в контексте царского распоряжения и сохраняет достоинство библейского регистра.
- source_word: τοῦ βασιλέως Ἰωσείου
  choice: царя Иосии
  rationale: «Иосия» — общепринятая русская форма имени, соответствующая греческому Ἰωσίας и узнаваемая по еврейской традиции.
theological_decisions:
- issue: Передача κύριος в ветхозаветном культовом контексте
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основной источник — греческий текст с κύριος, поэтому избрана обычная русская передача «Господь» без ретроспективной подстановки еврейского тетраграмматона.
- issue: Смысл πάσχα
  choice: пасхальная жертва
  alternative: Пасха; пасхальный агнец
  rationale: Контекст жертвоприношения указывает на пасхальную жертву, но текст прямо не называет агнца; поэтому более узкое «пасхальный агнец» не внесено.
- issue: Форма имени Ἰωσείου
  choice: Иосия
  alternative: отдельная транслитерация греческой формы имени
  rationale: В русском языке греческая и еврейская формы этого имени обычно передаются одинаково — «Иосия»; искусственное различение затемнило бы, а не сохранило источник.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность греческого текста, но раскрывает идиому τὰ τῆς ради ясности. Тире перед заключительным обстоятельством подчёркивает, что всё описанное совершено по царскому повелению.
