  source_fidelity: 'Основной смысл передан верно: завершение жертвенных действий, принесение Пасхи и прочих жертв к жертвеннику по повелению царя. Однако «возложены» утверждает именно помещение жертв на жертвенник, тогда как προσάγω прежде всего означает поднести/принести; это излишне конкретизирует действие. «Пасхальная жертва» допустима контекстуально, но несколько сужает πάσχα; лучше сохранить слово «Пасха» и пояснить культовое значение в примечании.'
