base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/021.yaml
  text: And the deeds of Josiah were upright before his Lord[b][a], with a heart full of godliness.
translation:
  language: ru
  text: И дела Иосии были праведны[a] перед его Господом — с сердцем, исполненным благочестия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были направлены правильно» или «были утверждены как правильные».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть благоговейной преданности Богу; возможно также: «набожности» или «почтения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠρθώθη
  choice: были праведны
  rationale: Передаёт нравственную оценку дел Иосии и естественно звучит по-русски; греческая пассивная форма допускает также значение «были приведены в порядок / утверждены как правильные», что отмечено в сноске.
- source_word: τὰ ἔργα
  choice: дела
  rationale: В контексте речь идёт о поступках и образе действий Иосии; «дела» конкретно и не создаёт лишнего богословского оттенка.
- source_word: Ἰωσείου
  choice: Иосии
  rationale: Стандартная русская библейская форма имени в родительном падеже.
- source_word: ἐνώπιον
  choice: перед
  rationale: Кратко сохраняет смысл нахождения перед лицом Господа и оценки Им.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: его Господом
  rationale: Следует непосредственно греческому «его Господа», не добавляя отсутствующих слов «Бог» или имени Господа.
- source_word: ἐν καρδίᾳ πλήρει εὐσεβείας
  choice: от сердца, исполненного благочестия
  rationale: Естественная русская конструкция, выражающая внутреннее расположение, сопровождавшее дела Иосии; при этом сохраняются образы сердца и полноты.
- source_word: εὐσεβείας
  choice: благочестия
  rationale: Точно передаёт религиозную преданность и почтение к Богу в достойном современном русском регистре.
theological_decisions:
- issue: Следует ли расширить κύριος под влиянием еврейской параллели
  choice: его Господом
  alternative: Господом, его Богом; Господом
  rationale: Основным источником служит греческий текст, где стоит τοῦ κυρίου αὐτοῦ без θεός; поэтому добавление «Богом» было бы неоправданным.
- issue: Как передать εὐσέβεια, не сужая её до одной стороны значения
  choice: благочестие
  alternative: набожность; богопочитание; почтение
  rationale: «Благочестие» охватывает религиозную преданность и почтение, не привязывая выражение к частной конфессиональной трактовке.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Формулировка сохраняет краткость греческого текста, местоимение «его» при слове «Господом» и образ сердца, исполненного благочестия.
