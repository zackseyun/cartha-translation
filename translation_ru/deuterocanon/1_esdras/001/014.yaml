base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/014.yaml
  text: And the temple singers[a], the sons of Asaph, were at their stations according to what had been appointed by David, and Asaph and Zechariah and Eddinous[b], who were from the king.
translation:
  language: ru
  text: Храмовые певцы, сыновья Асафа, стояли на своих местах согласно распоряжениям Давида; а Асаф, Захария и Эддинус были от царя[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «те, кто от царя». Сжатое греческое выражение может означать людей, назначенных или присланных царём, либо состоявших при царе.'
    reason: alternative_reading
  - marker: b
    text: Текст здесь отличается от приблизительной еврейской параллели в 2 Пар. 35:12, где говорится о распределении жертв всесожжения. В 1 Ездры вместо этого содержится расширенное сообщение о певцах и названных по имени лицах.
    reason: cross_reference
lexical_decisions:
- source_word: ἱεροψάλται
  choice: храмовые певцы
  rationale: Сложное слово обозначает певцов, связанных с храмовым богослужением. «Храмовые певцы» звучит естественно по-русски и ясно передаёт культовый контекст.
- source_word: υἱοὶ Ἀσάφ
  choice: сыновья Асафа
  rationale: Сохранено традиционное родовое и организационное обозначение признанного сообщества храмовых певцов.
- source_word: ἐπὶ τῆς τάξεως αὐτῶν
  choice: стояли на своих местах
  rationale: В данном богослужебном контексте τάξις указывает на установленное место или служебный распорядок; выбранная формулировка передаёт конкретное размещение и назначенную роль.
- source_word: κατὰ τὰ ὑπὸ Δαυεὶδ τεταγμένα
  choice: согласно распоряжениям Давида
  rationale: τεταγμένα означает установленное или предписанное; формулировка естественно передаёт Давида как источник распорядка.
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: люди царя
  rationale: Греческая фраза сжата и может обозначать людей, присланных или назначенных царём либо состоявших при нём. Краткое выражение «люди царя» сохраняет эту неоднозначную связь, не уточняя её без достаточных оснований.
- source_word: Ἐδδεινοὺς
  choice: Эддинус
  rationale: Имя передано близкой русской транслитерацией засвидетельствованной греческой формы; устойчивого общепринятого русского соответствия нет.
