  source_fidelity: 'Начальная часть передана точно: ἱεροψάλται — «храмовые певцы», υἱοὶ Ἀσάφ — «сыновья Асафа», а ἐπὶ τῆς τάξεως αὐτῶν естественно выражено как «на своих местах». «Согласно распоряжениям Давида» верно передаёт κατὰ τὰ ὑπὸ Δαυεὶδ τεταγμένα. Однако «там же были» добавляет не выраженное в греческом указание на совместное местонахождение названных лиц. Заключительное οἱ παρὰ τοῦ βασιλέως следует сохранить как характеристику Асафа, Захарии и Эддинуса, не уточняя вид их связи с царём.'
