base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/026.yaml
  text: And Josiah did not turn back to his chariot[a], but attempted to fight him, not paying attention to the words of Jeremiah the prophet from the mouth of the Lord.
translation:
  language: ru
  text: И Иосия не повернул назад к своей колеснице[a], но попытался сразиться с ним, не внимая словам пророка Иеремии из уст Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отступил к своей колеснице». Греческое выражение сжато и может подразумевать отказ отойти назад к колеснице или укрыться у неё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπέστρεψεν ἑαυτὸν
  choice: не повернул назад
  rationale: Возвратная конструкция передаёт поворот назад или отступление. Формулировка сохраняет пространственный смысл и не приписывает Иосии не выраженного прямо мотива.
- source_word: ἐπὶ τὸ ἅρμα αὐτοῦ
  choice: к своей колеснице
  rationale: Предлог ἐπί с винительным здесь обозначает направленность к колеснице. Греческая фраза сжата, поэтому возможный смысл отступления к ней отмечен в сноске.
- source_word: πολεμεῖν αὐτὸν ἐπεχείρει
  choice: попытался сразиться с ним
  rationale: ἐπιχειρέω с инфинитивом означает пытаться или браться за действие; «сразиться с ним» естественно передаёт личный объект αὐτόν в военном контексте.
- source_word: οὐ προσέχων
  choice: не внимая
  rationale: Причастный оборот передаёт сопутствующее пренебрежение сказанным. «Не внимая» точно выражает не просто отсутствие слухового восприятия, а отказ принять слова во внимание.
- source_word: ῥήμασιν Ἰερεμίου προφήτου
  choice: словам пророка Иеремии
  rationale: «Словам» прямо передаёт множественное число ῥήμασιν, а порядок имени и титула соответствует естественной современной русской речи.
- source_word: ἐκ στόματος Κυρίου
  choice: из уст Господа
  rationale: Сохранён явный образ источника речи, который подчёркивает, что пророческие слова исходят от Господа.
theological_decisions:
- issue: Божественный источник пророческих слов
  choice: сохранить выражение «из уст Господа»
  alternative: «от Господа»
  rationale: Греческий текст прямо использует образ уст Господа, тем самым усиливая утверждение о божественном происхождении слов Иеремии; упрощение ослабило бы этот акцент.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Оборот «из уст Господа» сохранён как понятный традиционный образ; синтаксис сделан ясным без устранения неоднозначности фразы о колеснице.
