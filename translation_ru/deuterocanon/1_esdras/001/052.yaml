base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/052.yaml
  text: And they burned the house of the Lord[a], and tore down the walls of Jerusalem, and burned its towers with fire[b],
translation:
  language: ru
  text: И они сожгли дом Господа[a], разрушили стены Иерусалима и сожгли огнём его башни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом Господа» — Иерусалимский храм.
    reason: Пояснение контекстуального значения буквального выражения.
  - marker: b
    text: 'В греческом тексте здесь повторён тот же глагол, что и в начале стиха; буквально: «сожгли огнём».'
    reason: Сохранение лексического повтора и несколько избыточного оборота исходного текста.
lexical_decisions:
- source_word: ἐνεπύρισαν
  choice: сожгли
  rationale: Глагол означает «сжечь, предать огню». «Сожгли» ясно передаёт действие, не уточняя сверх текста, было ли сооружение уничтожено полностью; одинаковый перевод в обоих случаях сохраняет повтор греческого глагола.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: дом Господа
  rationale: Буквально οἶκος — «дом»; в данном контексте речь идёт об Иерусалимском храме. Формулировка «дом Господа» сохраняет образ исходного текста, а сноска поясняет значение.
- source_word: κατέλυσαν
  choice: разрушили
  rationale: В отношении стен глагол означает разобрать, повалить или разрушить. «Разрушили» — естественный и точный русский эквивалент без излишнего уточнения способа.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: стены Иерусалима
  rationale: Прямой и естественный перевод греческого словосочетания.
- source_word: τοὺς πύργους αὐτῆς
  choice: его башни
  rationale: Местоимение относится к Иерусалиму. В современном русском согласование по грамматическому роду требует формы «его».
- source_word: ἐν πυρί
  choice: огнём
  rationale: Творительный падеж естественно передаёт инструментальное значение оборота «огнём» и сохраняет присутствующее в греческом тексте явное упоминание огня.
theological_decisions:
- issue: Передача κύριος в выражении о храме
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основным источником здесь служит греческий текст с κυρίου, поэтому принят обычный русский эквивалент «Господа». Написание прописными буквами могло бы привнести указание на еврейское Божественное имя, которого непосредственно в греческом тексте нет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союз «И» сохранён как элемент последовательного рассказа. Повтор «сожгли» и выражение «сожгли огнём» намеренно удерживают структуру и риторическое усиление греческого текста.
