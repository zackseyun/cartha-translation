base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/008.yaml
  text: These things were given from the royal possessions[a], according to the promise, to the people and to the priests and Levites. And Helkias, Zechariah, and Esyelos, the overseers of the sanctuary, gave to the priests for the Passover two thousand six hundred sheep[c][b], and three hundred calves.
translation:
  language: ru
  text: Это было дано из царского имущества — согласно обещанию[a] — народу, священникам и левитам. А Хелкия, Захария и Исиил[b], надзиратели святилища, дали священникам для Пасхи две тысячи шестьсот овец[c] и триста телят.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как было обещано». Буквально по-гречески: «согласно обещанию».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейской параллели (2 Пар. 35:8) соответствующие имена обычно передаются как «Хелкия… Иехиил»; греческий текст 1 Ездры здесь читает: «Хелкия… Исиил».'
    reason: alternative_reading
  - marker: c
    text: В еврейской параллели названы овцы, ягнята и молодые козлы; греческий текст здесь употребляет более общее слово «овцы».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: это
  rationale: Нейтральное указательное местоимение отсылает к упомянутым ранее дарам, не добавляя отсутствующего в греческом уточнения.
- source_word: ἐκ τῶν βασιλικῶν
  choice: из царского имущества
  rationale: Субстантивированное прилагательное обозначает принадлежавшее царю или царскому дому; это также согласуется с еврейской параллелью.
- source_word: κατʼ ἐπαγγελίαν
  choice: согласно обещанию
  rationale: Сохраняет именную форму и не уточняет, кем именно было дано обещание; возможный более свободный вариант отмечен в сноске.
- source_word: οἱ ἐπιστάται τοῦ ἱεροῦ
  choice: распорядители святилища
  rationale: ἐπιστάται обозначает поставленных над делом ответственных лиц; «распорядители» естественно передаёт их административную роль, а «святилище» — сакральный оттенок ἱερόν.
- source_word: εἰς πάσχα
  choice: для Пасхи
  rationale: Передаёт назначение животных для пасхального праздника и жертвоприношения.
- source_word: πρόβατα
  choice: овец
  rationale: Прямое и естественное соответствие греческому слову в данном контексте; более подробная формулировка еврейской параллели вынесена в сноску.
- source_word: μόσχους
  choice: телят
  rationale: μόσχος означает молодое животное крупного рогатого скота; «телята» не вносит дополнительного указания на пол.
