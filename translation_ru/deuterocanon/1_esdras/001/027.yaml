base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/027.yaml
  text: But he arrayed himself for war against him in the plain of Megiddo[a], and the commanders came down against King Josiah.
translation:
  language: ru
  text: Но он приготовился к войне с ним на равнине Мегиддо[a], и военачальники спустились к царю Иосии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском параллельном тексте, 2 Пар. 35:22, сказано: «переоделся, чтобы сразиться с ним», тогда как греческий текст имеет смысл: «приготовился к войне с ним».'
    reason: alternative_reading
lexical_decisions:
- source_word: συνεστήσατο πρὸς αὐτὸν πόλεμον
  choice: приготовился к войне с ним
  rationale: Средний залог передаёт личное вступление в военное противостояние или подготовку к нему. Формулировка сохраняет возвратный оттенок и военный смысл греческого текста, не подменяя его еврейским чтением «переоделся».
- source_word: ἐν τῷ πεδίῳ Μετααδδούς
  choice: на равнине Мегиддо
  rationale: πεδίον означает равнину или открытое поле; параллельный еврейский текст подтверждает общепринятую форму топонима «Мегиддо».
- source_word: κατέβησαν
  choice: выступили
  rationale: Буквально глагол обозначает движение вниз, однако по-русски в военном контексте «выступили» естественно передаёт направленное движение войска, не вводя неясного географического «спустились».
- source_word: οἱ ἄρχοντες
  choice: военачальники
  rationale: Хотя слово может означать правителей или начальников вообще, военный контекст поддерживает значение командиров.
- source_word: πρὸς βασιλέα Ἰωσίαν
  choice: против царя Иосии
  rationale: В контексте начавшегося военного противостояния πρός с винительным естественно допускает враждебное значение «против», хотя буквальное направление к Иосии также возможно.
theological_decisions:
- issue: Расхождение греческого текста с еврейской параллелью во 2 Паралипоменон 35:22
  choice: В основном тексте следовать греческому чтению «приготовился к войне», а еврейскую параллель привести в сноске.
  alternative: «переоделся, чтобы сразиться с ним»
  rationale: Для этой книги основным исходным свидетельством является греческий текст. Еврейская параллель помогает установить топоним, но не должна молча заменять существенно отличающееся греческое чтение.
- issue: Направительное или враждебное значение πρὸς в заключительной части
  choice: против царя Иосии
  alternative: к царю Иосии
  rationale: Военный контекст позволяет понять предлог враждебно; перевод сохраняет последовательность сцены, но неоднозначность отмечена в лексическом обосновании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Приготовился к войне» звучит естественнее буквального «устроил войну» и сохраняет оттенок среднего залога; «военачальники» уточняет ἄρχοντες по военному контексту.
