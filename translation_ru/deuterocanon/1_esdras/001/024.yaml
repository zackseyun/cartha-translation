  text: Josiah met him[a]. And the king of Egypt sent word to him, saying, “What is there between me and you[b], O king of Judea?”
translation:
  language: ru
  text: 'Иосия встретился с ним. Тогда царь Египта послал к нему сказать: «Что между мной и тобой[a], царь Иудеи[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «Какое мне до тебя дело?»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-гречески: «царь Иудеи»; в исторической параллели во Второй книге Паралипоменон этому соответствует «царь Иуды».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπάντησιν αὐτῷ Ἰωσείας
  choice: Иосия вышел ему навстречу
  rationale: Греческий текст представляет собой сжатую конструкцию с существительным «встреча, выход навстречу». Русское глагольное выражение естественно передаёт действие и не уточняет сверх текста, состоялась ли уже сама встреча.
- source_word: διεπέμψατο
  choice: послал к нему сказать
  rationale: Глагол обозначает передачу сообщения, вероятно через посланных людей, однако сами посланники здесь прямо не названы. Такое выражение сохраняет коммуникативное действие без лишнего добавления.
- source_word: Τί ἐμοὶ καὶ σοὶ ἐστίν
  choice: Что между мной и тобой
  rationale: Формулировка близка к структуре греческой семитизированной идиомы и оставляет открытой степень отчуждения или вызова; более свободный русский эквивалент дан в сноске.
- source_word: βασιλεῦ τῆς Ἰουδαίας
  choice: царь Иудеи
  rationale: Перевод следует непосредственно греческому территориальному названию Ἰουδαία. Форма обращения в русском языке передаётся звательным употреблением именительного падежа без добавления междометия «о».
theological_decisions:
- issue: Передача формулы Τί ἐμοὶ καὶ σοὶ ἐστίν
  choice: Что между мной и тобой
  alternative: Какое мне до тебя дело
  rationale: Более буквальная формулировка сохраняет неоднозначность между дистанцированием, возражением и вызовом, не усиливая тон без достаточных оснований.
- issue: Название царства в титуле Ἰουδαίας
  choice: Иудея
  alternative: Иуда
  rationale: Греческий источник имеет Ἰουδαία, поэтому основной текст следует именно этому свидетелю; исторически ожидаемое по параллели название «Иуда» отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прямой речи остаётся близким к греческому, но понятным современному читателю; архаическое «о царь» не используется.
