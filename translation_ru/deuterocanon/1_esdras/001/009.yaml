base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/009.yaml
  text: And Iechonias and Samaias and Nathanael his brother, and Sabias and Ochielos and Joram, commanders of thousands, gave to the Levites for the Passover one thousand sheep and seven hundred calves.
translation:
  language: ru
  text: И Иехония, и Самайя, и Нафанаил, его брат, и Савия, и Охиил, и Иорам, тысяченачальники, дали левитам для Пасхи тысячу овец и семьсот телят.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В параллельном месте еврейского текста (2 Пар. 35:9) названы другие начальники и указаны другие числа: 2600 животных для Пасхи и 300 голов крупного скота. Здесь сохранены имена и числа греческого текста 1 Ездры.'
    reason: textual_variant
lexical_decisions:
- source_word: χιλίαρχοι
  choice: тысяченачальники
  rationale: Передаёт буквальное значение титула — начальники над тысячами — и сохраняет древний административный колорит без римской ассоциации слова «трибуны».
- source_word: εἰς πάσχα
  choice: для Пасхи
  rationale: Выражает назначение животных для пасхального праздника и жертвенной трапезы, не уточняя сверх греческого текста конкретный обрядовый статус.
- source_word: πρόβατα
  choice: овец
  rationale: Обычное и прямое соответствие; греческое слово может шире обозначать мелкий скот, но контекст не требует разворачивать это значение.
- source_word: μόσχους
  choice: телят
  rationale: Прямое современное соответствие слову μόσχος; вариант «молодых быков» был бы более узким по значению.
- source_word: ὁ ἀδελφὸς
  choice: его брат
  rationale: По-русски естественно указывает на родство Нафанаила с непосредственно предшествующим Иехонией; при этом греческий текст буквально имеет определённое «брат», а не явное притяжательное местоимение.
- source_word: ἔδωκαν τοῖς Λευείταις
  choice: дали левитам
  rationale: Сохраняет простую конструкцию передачи с косвенным дополнением и не добавляет административного оттенка.
