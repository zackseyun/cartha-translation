base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/025.yaml
  text: Was I not sent against you by the Lord God? For my war is on the Euphrates[a], and now the Lord is with me, and the Lord is with me, urging me on. Stand aside[b], and do not oppose the Lord.
translation:
  language: ru
  text: «Разве не против тебя послал меня Господь Бог? Ведь моя война — на Евфрате[a]. И теперь Господь со мной, и Господь со мной, побуждая меня спешить[b]. Отступи и не противься Господу».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у Евфрата» либо «при Евфрате». Греческий оборот указывает на место военной кампании; еврейский параллельный текст называет Кархемиш на Евфрате.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ускоряя меня», «торопя меня» или «побуждая меня поспешить». Греческое причастие обозначает, что Господь торопит ход кампании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ πρὸς σὲ ἐξαπέσταλμαι
  choice: Разве не против тебя послал меня
  rationale: Риторический вопрос передан естественной русской конструкцией «разве не…». В военном контексте πρὸς σὲ имеет значение направленности против Иосии; греческий перфект пассива по-русски идиоматично передаётся прошедшим временем.
- source_word: ὑπὸ Κυρίου τοῦ θεοῦ
  choice: Господь Бог
  rationale: Сочетание Κυρίου τοῦ θεοῦ естественно передаётся традиционным и понятным русским титулом «Господь Бог» без добавления притяжательного «мой».
- source_word: ἐπὶ γὰρ τοῦ Εὐφράτου
  choice: Ведь моя война — на Евфрате
  rationale: Оборот указывает на район военной кампании. «На Евфрате» сохраняет географическую формулировку греческого текста; допустимые пространственные оттенки отмечены в сноске.
- source_word: ὁ πόλεμός μού ἐστιν
  choice: моя война
  rationale: 'Прямой перевод сохраняет смысловой акцент: речь идёт о кампании Нехао, а не о войне с Иосией.'
- source_word: μετʼ ἐμοῦ
  choice: со мной
  rationale: Сохранены и формула божественной поддержки, и её намеренное повторение в греческом тексте.
- source_word: ἐπισπεύδων
  choice: побуждая меня поспешить
  rationale: Причастие означает ускорение или понуждение к скорому действию. Такая передача естественна по-русски и не превращает причастный оборот в отдельное утверждение.
- source_word: ἀπόστηθι
  choice: Отступи
  rationale: Императив требует прекратить вмешательство и удалиться; «отступи» соответствует военному контексту и остаётся достаточно широким по смыслу.
- source_word: μὴ ἐναντίου τῷ κυρίῳ
  choice: не противься Господу
  rationale: Краткая, естественная формулировка сохраняет утверждение, что сопротивление походу Нехао равнозначно сопротивлению Господу.
theological_decisions:
- issue: Кого обозначает κύριος в речи Нехао
  choice: Во всех случаях переведено «Господь», а первоначальное «Господь Бог» сохранено без уточнения «мой».
  alternative: Передать более неопределённо как «бог» либо истолковать как божество самого Нехао.
  rationale: Греческий текст прямо употребляет Κυρίου τοῦ θεοῦ и затем Κύριος. Перевод сохраняет притязание Нехао на божественное поручение, но не решает за читателя вопрос об истинности и точной богословской природе этого притязания.
- issue: Повторение καὶ Κύριος μετʼ ἐμοῦ
  choice: Повторение «и Господь со мной» сохранено.
  alternative: Сгладить повтор и объединить части в одно предложение.
  rationale: Повтор присутствует в греческом источнике и усиливает заявленную уверенность Нехао в божественной поддержке; его устранение ослабило бы риторическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис прямой речи сделан ясным для широкого читателя; сохранены риторический вопрос, повтор формулы «Господь со мной» и неразрешённое богословское напряжение заявления Нехао.
