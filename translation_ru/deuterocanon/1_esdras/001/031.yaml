base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/031.yaml
  text: for all the family of Israel[a]. Now these things have been recorded in the book of the histories concerning the kings of Judah, and each deed of Josiah, and his glory, and his understanding in the law of the Lord, and the things done by him, both the former things and those now recounted[b], are recorded in the book of the Kings of Israel and Judah.
translation:
  language: ru
  text: для всего рода Израиля. Всё это записано в книге летописей о царях Иудеи[a]. И каждое из деяний Иосии, и его слава, и его разумение в законе Господа, а также совершённое им и то, что ныне изложено, записаны в книге Царей Израиля и Иуды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в книге исторических записей о царях Иудеи». Речь, по-видимому, идёт о царской летописи или ином историческом источнике.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая формулировка в конце стиха синтаксически шероховата: буквально в ней говорится о «совершённом им» и о том, что «ныне изложено». Перевод сохраняет различие между деяниями Иосии и событиями, рассказанными в настоящем повествовании.'
    reason: textual_difficulty
lexical_decisions:
- source_word: γένος
  choice: род
  rationale: В выражении πᾶν τὸ γένος Ἰσραήλ слово обозначает весь народ как родственное целое; «род Израиля» сохраняет этот оттенок и звучит естественно в библейском контексте.
- source_word: ἀναγέγραπται
  choice: записано
  rationale: Передаёт совершённую запись, сохраняющую силу как документальное свидетельство.
- source_word: βίβλῳ τῶν ἱστορουμένων
  choice: книге летописей
  rationale: Естественно обозначает историческую или архивную запись о царях, не отождествляя источник без достаточных оснований с конкретной канонической книгой.
- source_word: τὸ καθʼ ἓν πραχθὲν τῆς πράξεως Ἰωσείου
  choice: каждое из деяний Иосии
  rationale: Передаёт распределительное значение καθʼ ἓν («каждое по отдельности») и устраняет неприемлемую по-русски тавтологию однокоренных греческих форм.
- source_word: δόξης
  choice: слава
  rationale: Прямой и стилистически уместный эквивалент, допускающий значение почёта и прославленного имени.
- source_word: συνέσεως
  choice: разумение
  rationale: Сохраняет значение осмысленного понимания закона и соответствует достоинству библейского регистра.
- source_word: νόμῳ Κυρίου
  choice: законе Господа
  rationale: Стандартное русское соответствие греческому νόμος Κυρίου.
- source_word: τά τε πραχθέντα ὑπʼ αὐτοῦ καὶ τὰ νῦν ἱστόρηται
  choice: совершённое им — как прежнее, так и ныне изложенное
  rationale: Передаёт различие между совершёнными Иосией делами и тем, что изложено в настоящем повествовании, при этом сноска отмечает синтаксическую шероховатость греческого текста.
- source_word: βυβλίῳ τῶν Βασιλέων Ἰσραὴλ καὶ Ἰούδα
  choice: книге Царей Израиля и Иуды
  rationale: Сохраняет форму названия источника и оба географически-династических обозначения греческого текста.
theological_decisions:
- issue: Передача Κυρίου в выражении νόμῳ Κυρίου
  choice: Господа
  alternative: Владыки; ГОСПОДА
  rationale: Основной греческий текст содержит Κυρίου; традиционное и нейтральное русское соответствие — «Господа». Написание капителью не вводится на основании приблизительной еврейской параллели.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Начальная строчная буква сохранена, поскольку стих начинается продолжением предыдущего предложения. Повтор союза «и» отражает перечислительную структуру греческого текста; тире помогает сделать трудный заключительный оборот понятным, не скрывая его неоднозначности.
