base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/040.yaml
  text: The recorded accounts concerning him, and his uncleanness and impiety, are written in the book of the chronicles of the kings.
translation:
  language: ru
  text: А сведения о нём, его нечистоте и нечестии, записаны в книге летописей царей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱστορηθέντα
  choice: то, что повествуется
  rationale: Субстантивированное причастие обозначает сведения или события, рассказанные либо зафиксированные о нём. Формулировка сохраняет предметный смысл греческого множественного оборота без добавления слова «рассказы».
- source_word: ἀκαθαρσίας
  choice: нечистоте
  rationale: Передаёт нравственно-религиозную оценку, не ограничивая её исключительно ритуальной нечистотой.
- source_word: δυσσεβείας
  choice: нечестии
  rationale: Сохраняет отдельное указание на непочтительность к Богу и безбожное поведение, не сливая его с более общим понятием зла.
- source_word: ἀναγέγραπται
  choice: записано
  rationale: 'Передаёт перфектно-пассивный смысл: сведения были внесены в письменный источник и остаются там зафиксированными.'
- source_word: βίβλῳ τῶν χρόνων τῶν βασιλέων
  choice: книге летописей царей
  rationale: Естественная русская архивная формула для книги царских хроник; χρόνων в данном контексте обозначает летописные записи.
theological_decisions:
- issue: Двойная нравственно-религиозная характеристика ἀκαθαρσίας καὶ δυσσεβείας
  choice: «нечистоте и нечестии»
  alternative: «нечистоте и безбожии» или «скверне и нечестии»
  rationale: Сохранены два самостоятельных обвинительных понятия греческого текста. «Нечестие» точно выражает отсутствие должного почтения к Богу, а «нечистота» оставляет открытым нравственно-религиозный объём первого слова.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным летописным звучанием. Начальное «А» передаёт контрастивно-переходную силу δέ, не добавляя временного значения.
