  source_fidelity: 'Греч. τὰ ... ἱστορηθέντα — аористное страдательное причастие во множественном числе: речь идёт о сведениях, которые были изложены или зафиксированы, а не о том, что повествуется в настоящем времени. «Сведения» естественно передаёт предметный и множественный смысл оборота. «Нечистота и нечестие», «записаны» и «книга летописей царей» точно соответствуют ἀκαθαρσία, δυσσέβεια, ἀναγέγραπται и βίβλος τῶν χρόνων τῶν βασιλέων.'
