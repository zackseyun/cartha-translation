base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/044.yaml
  text: And he appointed Zedekiah king of Judea and Jerusalem; Zedekiah was twenty-one years old[a], and he reigned eleven years.
translation:
  language: ru
  text: И он поставил Седекию царём Иудеи и Иерусалима[a]. Седекия был двадцати одного года и царствовал одиннадцать лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «Иудеи и Иерусалима». В параллельной еврейской традиции в подобных формулах обычно говорится об «Иуде и Иерусалиме»; основной текст следует греческому источнику 1 Ездры и не согласует его с еврейским параллельным текстом.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: поставил
  rationale: В контексте возведения на царство глагол означает назначение или поставление на должность; «поставил царём» естественно и точно передаёт эту формулу.
- source_word: Σεδεκίαν
  choice: Седекию
  rationale: Традиционная русская форма имени библейского царя.
- source_word: βασιλέα τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: царём Иудеи и Иерусалима
  rationale: Сохраняет греческую конструкцию и названия владений, не заменяя «Иудею» на «Иуду» по параллельной еврейской традиции.
- source_word: ὄντα ἐτῶν εἴκοσι ἑνός
  choice: Седекии был двадцать один год
  rationale: Естественная современная русская передача греческой формулы указания возраста; повтор имени устраняет возможную неясность.
- source_word: βασιλεύει δὲ ἔτη ἕνδεκα
  choice: и царствовал он одиннадцать лет
  rationale: «Царствовал» — точный и общепринятый русский эквивалент глагола βασιλεύω; порядок слов звучит плавно и достойно.
