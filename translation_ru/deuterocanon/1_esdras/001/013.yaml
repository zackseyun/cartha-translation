base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/013.yaml
  text: For the priests were offering up the fat until evening[a], and the Levites prepared for themselves and for the priests, their brothers, the sons of Aaron.
translation:
  language: ru
  text: Ибо священники до вечера возносили в жертву жир[a], а левиты приготовили для себя и для своих братьев — священников, сыновей Аарона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвенные части жира». Греческое слово обозначает жир, который приносили на алтаре.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέφερον
  choice: возносили в жертву
  rationale: В жертвенном контексте ἀναφέρω означает принесение на алтаре. Несовершенный вид «возносили» передаёт продолжавшееся до вечера действие.
- source_word: τὰ στέατα
  choice: жир
  rationale: στέαρ обозначает жир, здесь — предназначенный для принесения жертвенный жир. Краткое «жир» сохраняет конкретность греческого выражения; пояснение дано в сноске.
- source_word: ἕως ὀψίας
  choice: до вечера
  rationale: Прямо передаёт временной предел действия, не добавляя значения «допоздна» или «до наступления ночи».
- source_word: ἡτοίμασαν
  choice: приготовили
  rationale: Греческий глагол не называет подразумеваемый объект. Перевод сохраняет эту лаконичность и не уточняет без необходимости, что именно было приготовлено.
- source_word: ἑαυτοῖς
  choice: для себя
  rationale: Естественная передача возвратного дательного, показывающего, что левиты приготовили также и для самих себя.
- source_word: τοῖς ἱερεῦσιν ἀδελφοῖς αὐτῶν
  choice: для священников — своих братьев
  rationale: 'Тире ясно передаёт приложительное отношение: священники названы братьями левитов, без замены родственного языка более общим выражением.'
- source_word: υἱοῖς Ἀαρών
  choice: сыновей Аарона
  rationale: Сохранено традиционное родовое обозначение священников и приложительная связь с предшествующей фразой.
theological_decisions:
- issue: Передача ἀδελφοῖς в священническом и племенном контексте
  choice: своих братьев
  alternative: своих сородичей
  rationale: Греческий текст прямо употребляет слово «братья». Этот вариант сохраняет язык родства и корпоративной близости между левитами и священниками, не сводя его к буквальному родству в одной семье.
- issue: Связь выражения «сыновей Аарона» с предшествующими существительными
  choice: приложение, уточняющее священников — братьев левитов
  alternative: отдельная третья группа получателей
  rationale: Согласованные дательные формы и смысл контекста естественно указывают, что «сыновья Аарона» уточняют, кто именно эти священники; пунктуация отражает эту связь, не вводя дополнительной группы.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Формула «возносили в жертву» делает культовый смысл понятным без добавления в основной текст прямо не названного алтаря; «жир» употреблено в обычном современном значении, а специальный жертвенный смысл пояснён сноской.
