base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/011.yaml
  text: And they roasted the Passover with fire[a], as was proper, and they boiled the sacrifices in the bronze pots and kettles with a pleasing aroma[b], and brought them to all the people.
translation:
  language: ru
  text: И они изжарили пасхальную жертву[a] на огне, как полагалось, а жертвы сварили в бронзовых сосудах и котлах — с благоуханием[b] — и отнесли всему народу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пасху». Здесь это выражение может обозначать пасхальную жертву или пасхальную трапезу.'
    reason: lexical_alternative
  - marker: b
    text: Буквально речь идёт о приятном запахе; в контексте жертвоприношения это выражение может также напоминать о благоухании жертвы.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «всем тем, кто из народа»; возможно, имеются в виду люди из народа в отличие от священников и левитов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤπτησαν
  choice: изжарили
  rationale: Глагол обозначает именно жарение, а не приготовление вообще; это значение дополнительно уточняется словами ἐν πυρί («на огне»).
- source_word: τὸ πάσχα
  choice: пасхальную жертву
  rationale: В данном контексте речь идёт о том, что можно изжарить и затем раздать; выражение обозначает пасхальную жертву, но примечание сохраняет более широкую смысловую ёмкость греческого слова.
- source_word: ἐν πυρί
  choice: на огне
  rationale: Естественная русская формулировка для способа приготовления, точно передающая греческое выражение.
- source_word: ὡς καθήκει
  choice: как полагалось
  rationale: Передаёт нормативный смысл, не уточняя без достаточных оснований, идёт ли речь непосредственно о предписании закона, обычае или ритуальном порядке.
- source_word: τὰς θυσίας
  choice: остальные жертвы
  rationale: «Жертвы» прямо передаёт широкий культовый термин; «остальные» проясняет противопоставление пасхальной жертве, не меняя референта.
- source_word: ἥψησαν
  choice: сварили
  rationale: Глагол обычно означает варку или приготовление в жидкости; названные далее сосуды подтверждают это конкретное значение.
- source_word: ἐν τοῖς χαλκίοις καὶ λέβησιν
  choice: в медных сосудах и котлах
  rationale: Сохраняется различие между двумя видами кухонной утвари; «медные» в современном русском естественно охватывает предметы из меди или медного сплава там, где греческое слово не требует строго различать медь и бронзу.
- source_word: μετʼ εὐωδίας
  choice: с благоуханием
  rationale: Формулировка сохраняет буквальный образ приятного запаха и возможный жертвенный оттенок, не сводя выражение к оценке качества приготовления.
- source_word: ἀπήνεγκαν
  choice: отнесли
  rationale: Передаёт основное значение переноса приготовленных жертв к получателям; идея распределения следует из контекста, но не подставляется вместо значения глагола.
- source_word: πᾶσι τοῖς ἐκ τοῦ λαοῦ
  choice: всему народу
  rationale: Это ясная и естественная русская передача; возможное более узкое указание на людей из простого народа сохраняется в примечании.
theological_decisions:
- issue: Различие способов приготовления пасхальной и прочих жертв
  choice: 'Сохранены разные глаголы: пасхальную жертву «изжарили», остальные жертвы «сварили».'
  alternative: Передать оба глагола общим словом «приготовили».
  rationale: Греческий текст намеренно различает два способа приготовления, вероятно отражая ритуальные требования; обобщение стёрло бы значимую деталь.
- issue: Значение τὸ πάσχα
  choice: «пасхальную жертву» с примечанием о буквальной форме и диапазоне значения
  alternative: «Пасху» или «пасхального агнца»
  rationale: Просто «Пасху» в современном русском легко понять как праздник, который невозможно изжарить, тогда как «пасхального агнца» конкретизирует животное сильнее, чем сам греческий текст.
- issue: Круг получателей в πᾶσι τοῖς ἐκ τοῦ λαοῦ
  choice: «всему народу» в основном тексте
  alternative: «всем из простого народа»
  rationale: Греческая конструкция может отличать народ от священников и левитов, однако не содержит отдельного слова «простой» или «миряне»; возможное различие поэтому вынесено в примечание.
- issue: Жертвенный оттенок μετʼ εὐωδίας
  choice: 'Сохранить конкретный образ: «с благоуханием».'
  alternative: «тщательно» или опустить выражение как стилистическое
  rationale: Лексическое значение связано с приятным запахом и в культовом контексте может напоминать о благоухании жертвы; перевод не должен ни устранять этот оттенок, ни превращать его в явную богословскую формулу.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан ясным для чтения вслух; культовые термины сохранены без архаизмов. Тире вокруг оборота «с благоуханием» помогает избежать ошибочного понимания, будто благоухание было содержимым сосудов.
