base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/038.yaml
  text: After him Nebuchadnezzar king of Babylon came up[a], and he bound him with bronze chains and carried him away to Babylon.
translation:
  language: ru
  text: После него пришёл[a] Навуходоносор, царь Вавилона, связал его бронзовыми оковами и увёл в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднялся», «взошёл». Греческий глагол буквально обозначает движение вверх; в данном контексте он может подразумевать продвижение царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετʼ αὐτὸν
  choice: После него
  rationale: Передаёт временную последовательность и сохраняет личное местоимение, не заменяя его более общим «после этого».
- source_word: ἀνέβη
  choice: выступил
  rationale: В контексте действий царя глагол обозначает движение или продвижение; «выступил» естественно передаёт начало похода, не добавляя прямо не названного дополнения «против него». Буквальный образ движения вверх отмечен в сноске.
- source_word: Ναβουχοδονόσορ
  choice: Навуходоносор
  rationale: Использована закрепившаяся в русской библейской традиции форма известного царского имени.
- source_word: βασιλεὺς Βαβυλῶνος
  choice: царь Вавилона
  rationale: Прямой и естественный перевод титула; приложение отделено запятыми.
- source_word: ἔδησεν
  choice: связал
  rationale: Сохраняет прямое значение глагола, тогда как последующее словосочетание уточняет средство связывания.
- source_word: ἐν χαλκεῖς δεσμοῖς
  choice: бронзовыми оковами
  rationale: «Оковы» естественно обозначают металлические средства удержания, а «бронзовыми» передаёт материальную характеристику χαλκεῖς без устаревшего «медными узами».
- source_word: ἀπήγαγεν
  choice: увёл
  rationale: Передаёт принудительное удаление пленника и звучит естественно в современном литературном русском.
- source_word: εἰς Βαβυλῶνα
  choice: в Вавилон
  rationale: Обычное русское обозначение направления к месту назначения.
