lexical_decisions:
- source_word: ἐδωρήσατο
  choice: дал
  rationale: Средняя форма δωρέομαι означает добровольно дать, подарить или предоставить; «дал» естественно и ясно передаёт царское пожертвование животных.
- source_word: τῷ λαῷ τοῖς εὑρεθέντι
  choice: собравшемуся народу
  rationale: Греческая конструкция буквально содержит значение «народу — тем, кто оказался [там]» и, несмотря на грамматическую неровность, по контексту обозначает присутствовавших или собравшихся людей.
- source_word: ἀρνῶν καὶ ἐρίφων
  choice: ягнят и козлят
  rationale: ἀρνῶν обозначает ягнят, а ἐρίφων — молодых коз; конкретные русские наименования сохраняют различие видов и возраста животных.
- source_word: τριακοντα χιλιάδας
  choice: тридцать тысяч
  rationale: Прямая передача числительного.
- source_word: μόσχους
  choice: телят
  rationale: μόσχος означает телёнка или молодое животное крупного рогатого скота; «телят» не уточняет пол без основания в греческом тексте.
- source_word: τρισχιλίους
  choice: три тысячи
  rationale: Прямая передача числительного.
theological_decisions:
- issue: Значительное расхождение с предоставленной масоретской параллелью
  choice: 'Основной текст переведён исключительно по греческому свидетельству: Иосия предоставляет народу животных.'
  alternative: Согласовать перевод с иной последовательностью действий в еврейской параллели, где говорится о заклании Пасхи, освящении и приготовлении для братьев.
  rationale: Предоставленный еврейский текст не соответствует близко данному греческому стиху. Для 1 Ездры первичным источником является греческий текст; поэтому содержание несовпадающей параллели не внесено в перевод.
