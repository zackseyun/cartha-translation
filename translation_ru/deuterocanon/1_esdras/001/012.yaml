base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/012.yaml
  text: After this they prepared for themselves and for the priests[a], their brothers[b], the sons of Aaron.
translation:
  language: ru
  text: После этого они приготовили для себя и для священников, своих братьев, сыновей Аарона.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ δὲ ταῦτα
  choice: После этого
  rationale: Естественный современный временной переход, точно передающий последовательность событий.
- source_word: ἡτοίμασαν
  choice: они приготовили
  rationale: Сохраняет переходное значение глагола и соответствует контексту приготовления жертвенных долей.
- source_word: ἑαυτοῖς
  choice: для себя
  rationale: Прямая передача возвратного дательного падежа.
- source_word: τε καὶ
  choice: и
  rationale: Связывает двух получателей — самих действующих лиц и священников; в русском отдельная конструкция «как… так и» не обязательна.
- source_word: τοῖς ἱερεῦσιν
  choice: для священников
  rationale: Дательный получателя после глагола «приготовили» естественно передаётся конструкцией с «для».
- source_word: ἀδελφοῖς αὐτῶν
  choice: своих братьев
  rationale: Сохраняет явное родственное обозначение греческого текста; местоимение «своих» однозначно соотносит братьев с подлежащим.
- source_word: υἱοῖς Ἀαρών
  choice: сыновей Аарона
  rationale: Прозрачно сохраняет библейское родовое обозначение и не заменяет его толковательным «потомков».
theological_decisions:
- issue: Соотношение выражений «своих братьев» и «сыновей Аарона»
  choice: 'Передать их как последовательные приложения: «для священников, своих братьев, сыновей Аарона»'
  alternative: «для своих братьев — священников, сыновей Аарона»
  rationale: Греческий текст ставит три обозначения подряд без относительного придаточного. Последовательные приложения сохраняют синтаксическую открытость оригинала и ясно отождествляют священников с сынами Аарона.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Порядок приложений сохранён близко к греческому; лишние пояснения и конфессионально обусловленные толкования не добавлены.
