base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/047.yaml
  text: And the leaders of the people and of the priests also committed much impiety and lawlessness[a], beyond all the uncleannesses of all the nations, and they defiled the sanctuary of the Lord[c][b], which had been sanctified in Jerusalem.
translation:
  language: ru
  text: И предводители народа и священников также во многом поступали нечестиво и беззаконно, превзойдя все нечистоты всех народов, и осквернили святилище Господа[b], освящённое в Иерусалиме[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «храм Господа». Греческое слово ἱερόν может обозначать как святилище, так и храмовый комплекс в более широком смысле.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «освящаемое в Иерусалиме». Греческое причастие может описывать святилище как освящаемое или как пребывающее освящённым.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: οἱ ἡγούμενοι
  choice: предводители
  rationale: Причастие обозначает тех, кто ведёт или управляет. «Предводители» сохраняет значение руководства и подходит к общественно-религиозному контексту.
- source_word: τοῦ λαοῦ καὶ τῶν ἱερέων
  choice: народа и священников
  rationale: Два родительных оборота естественно указывают на две группы, чьи предводители обвиняются; формулировка сохраняет компактность греческого текста и не сводит обвинение лишь к одной группе.
- source_word: πολλὰ ἠσέβησαν καὶ ἠνόμησαν
  choice: совершили много нечестивого и беззаконного
  rationale: Передаёт множество проявлений нечестия и нарушения закона, сохраняя оба аспекта обвинения и звуча естественно по-русски.
- source_word: ὑπὲρ πάσας τὰς ἀκαθαρσίας πάντων τῶν ἐθνῶν
  choice: в нечистоте превзойдя все народы
  rationale: ὑπέρ выражает превосходство или превышение, а ἀκαθαρσίαι несёт нравственно-культовый оттенок нечистоты. Русская формулировка ясно передаёт сравнение без тяжеловесного буквального «превыше всех нечистот».
- source_word: ἐμίαναν
  choice: осквернили
  rationale: В культовом контексте глагол означает сделать нечистым, осквернить; «осквернили» точно сочетается со святилищем.
- source_word: τὸ ἱερὸν τοῦ κυρίου
  choice: святилище Господа
  rationale: ἱερόν может обозначать святилище либо храмовый комплекс. «Святилище» подчёркивает священное пространство, а «Господь» является обычной передачей κύριος применительно к Богу Израиля.
- source_word: τὸ ἁγιαζόμενον
  choice: освящённое
  rationale: Настоящее страдательное причастие может характеризовать святилище как освящаемое или пребывающее освящённым. В русском контексте «освящённое» естественно выражает его установленный священный статус.
- source_word: ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Стандартная передача местного значения предлога и названия города.
theological_decisions:
- issue: Передача κύριος применительно к Богу Израиля
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Греческий первоисточник содержит κύριος, а не еврейское четырёхбуквенное имя; «Господь» сохраняет формулировку греческого текста и традиционное библейское звучание, не восстанавливая имя предположительно.
- issue: Культово-нравственное значение ἀκαθαρσίαι
  choice: нечистота
  alternative: скверна; осквернения
  rationale: «Нечистота» сохраняет одновременно культовый и нравственный оттенки и поддерживает смысловую связь с последующим осквернением святилища.
- issue: Видовое значение τὸ ἁγιαζόμενον
  choice: освящённое
  alternative: освящаемое
  rationale: Причастие настоящего времени допускает более буквальное «освящаемое», однако здесь, вероятнее всего, характеризует святилище как имеющее освящённый статус. Примечание сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для обычного читателя; культовая лексика сохранена без архаизмов и без конфессионально обусловленных уточнений.
