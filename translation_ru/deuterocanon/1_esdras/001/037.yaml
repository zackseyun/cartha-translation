base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/037.yaml
  text: Jehoiakim was twenty-five years old when he became king of Judea and Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: ru
  text: Иоакиму было двадцать пять лет, когда он стал царём Иудеи и Иерусалима[a], и он сделал зло в глазах Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иуды и Иерусалима». В греческом тексте: «Иудеи и Иерусалима», тогда как в параллельной древнееврейской традиции обычно говорится об Иуде и Иерусалиме.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐτῶν δὲ ἦν εἴκοσι πέντε
  choice: был двадцати пяти лет
  rationale: Обычная греческая формула указания возраста; по-русски звучит естественно и сохраняет достоинство библейского повествования.
- source_word: Ἰωακεὶμ
  choice: Иоаким
  rationale: Традиционная русская библейская передача имени; параллельная древнееврейская традиция подтверждает отождествление этого лица.
- source_word: ὅτε ἐβασίλευσεν
  choice: когда стал царём
  rationale: Аорист в формуле возраста естественно указывает на вступление на престол, а не на весь период царствования.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: Иудеи и Иерусалима
  rationale: Передаёт греческое Ἰουδαίας как «Иудея» и сохраняет зависимость родительного падежа от обозначения царской власти.
- source_word: ἐποίησεν τὸ πονηρὸν
  choice: делал зло
  rationale: Естественная русская передача устойчивого библейского выражения о нравственно дурных поступках.
- source_word: ἐνώπιον Κυρίου
  choice: пред Господом
  rationale: Краткая и традиционная, но понятная современному читателю передача значения «перед лицом / в глазах Господа».
theological_decisions:
- issue: Передача Κυρίου
  choice: Господом
  alternative: Яхве; ГОСПОДОМ
  rationale: Первичный источник содержит греческое κύριος, поэтому оно передаётся как «Господь» без обратной подстановки еврейского имени.
- issue: Географическое и политическое обозначение Ἰουδαίας
  choice: Иудеи
  alternative: Иуды
  rationale: Перевод следует первичному греческому чтению Ἰουδαίας; вариант «Иуда» сохраняется в примечании ввиду параллельной древнееврейской традиции.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским звучанием. Формы «царём» и «пред Господом» сохраняют достоинство стиля, оставаясь понятными широкому читателю.
