base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/033.yaml
  text: And he reigned over Israel and Jerusalem for three months[a]; and the king of Egypt deposed him from reigning in Jerusalem[b],
translation:
  language: ru
  text: И царствовал он над Израилем и Иерусалимом три месяца; а царь Египта отстранил его от царствования в Иерусалиме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол, переведённый как «отстранил», в других контекстах может означать «восстановил» или «поставил». Здесь ход повествования указывает на отстранение от царской власти.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: царствовал
  rationale: Глагол обозначает осуществление царской власти; «царствовал» естественно и точно передаёт повествовательный аорист.
- source_word: ἐν Ἰσραὴλ καὶ Ἰερουσαλήμ
  choice: над Израилем и Иерусалимом
  rationale: При глаголе «царствовать» русский язык естественно обозначает подвластную область предлогом «над». Упоминание именно Израиля и Иерусалима сохранено по греческому источнику.
- source_word: μῆνας τρεῖς
  choice: три месяца
  rationale: Естественное русское обозначение продолжительности; дополнительный предлог не требуется.
- source_word: ἀπεκατέστησεν
  choice: отстранил его
  rationale: По ходу повествования речь идёт о прекращении его царствования египетским царём. Выражение «отстранил его от царствования» сохраняет связь с зависимым инфинитивом и не сужает смысл до конкретной процедуры низложения.
- source_word: βασιλεὺς Αἰγύπτου
  choice: царь Египта
  rationale: Прямое и обычное русское соответствие титулу и географическому определению.
- source_word: βασιλεύειν ἐν Ἰερουσαλήμ
  choice: от царствования в Иерусалиме
  rationale: Инфинитив передан отглагольным существительным в конструкции прекращения власти, что естественно по-русски и близко к греческому синтаксису.
theological_decisions:
- issue: Значение ἀπεκατέστησεν при инфинитиве βασιλεύειν
  choice: 'Контекстуальное значение прекращения царствования: царь Египта отстранил его от власти.'
  alternative: Царь Египта восстановил или поставил его царствовать в Иерусалиме.
  rationale: Обычный лексический диапазон глагола допускает значение «восстановить», однако непосредственный историко-повествовательный контекст после трёхмесячного царствования указывает на отстранение. Перевод следует контексту, а подлинная лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис достаточно близок к греческому, но естественен для обычного читателя; союз «а» ясно передаёт повествовательный поворот.
