base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/049.yaml
  text: But they mocked his messengers[a], and whenever the Lord spoke, they were making sport of his prophets, until, in his anger against his nation because of their ungodly deeds[b], he commanded the kings of the Chaldeans to come up against them.
translation:
  language: ru
  text: Но они насмехались над Его посланниками[a] и всякий раз, когда Господь говорил, издевались над Его пророками, пока Он, разгневавшись на Свой народ за его нечестивые дела, не повелел царям халдеев выступить против них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над Его ангелами». Греческое слово может означать как ангелов, так и посланников; здесь параллель с пророками, вероятнее всего, указывает на посланных Богом людей.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте стоит множественное число: «царей халдеев». В еврейской параллели (2 Пар. 36) главное место занимает царь Вавилона Навуходоносор. Перевод следует греческому тексту 1 Ездры.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐμυκτήρισαν
  choice: насмехались
  rationale: Глагол выражает презрительную насмешку; выбранное слово естественно в современном русском и соответствует параллельному упоминанию издевательств над пророками.
- source_word: ἐν τοῖς ἀγγέλοις αὐτοῦ
  choice: над Его посланниками
  rationale: В данном историко-пророческом контексте ἄγγελοι, особенно рядом с «пророками», вероятнее всего обозначает посланных Богом людей. Возможное значение «ангелы» сохранено в сноске.
- source_word: ᾗ ἡμέρᾳ ἐλάλησεν Κύριος
  choice: всякий раз, когда Господь говорил
  rationale: 'Темпоральное выражение по контексту передаёт повторяемость: когда бы Господь ни обращался к ним через Своих представителей, они отвергали Его слово.'
- source_word: ἐκπαίζοντες
  choice: издевались
  rationale: Причастие описывает продолжающееся глумливое обращение с пророками; «издевались» сохраняет усиленный оттенок и не повторяет глагол «насмехались».
- source_word: θυμῶντα αὐτὸν
  choice: Он, разгневавшись
  rationale: Деепричастная конструкция естественно передаёт греческое причастие и сохраняет связь Божьего гнева с последующим повелением.
- source_word: τῷ ἔθνει αὐτοῦ
  choice: на Свой народ
  rationale: Хотя ἔθνος может означать «народ» или «нацию», здесь речь идёт о народе, принадлежащем Богу; «Свой народ» естественно и точно передаёт контекст.
- source_word: δυσσεβήματα
  choice: нечестивые дела
  rationale: Существительное обозначает поступки, выражающие нечестие по отношению к Богу; перевод сохраняет религиозный смысл и понятен современному читателю.
- source_word: προστάξαι ἀναβιβάσαι ἐπ᾽ αὐτοὺς
  choice: повелел двинуть на них
  rationale: 'Сохраняется каузативная форма активного ἀναβιβάσαι: Господь повелевает направить против народа вражеских царей. Военный оборот «двинуть на них» звучит естественно и не превращает конструкцию без необходимости в прямое повеление самим царям.'
- source_word: τοὺς βασιλεῖς τῶν Χαλδαίων
  choice: царей халдеев
  rationale: Перевод сохраняет множественное число греческого текста и не гармонизирует его с единственным числом в еврейской параллели.
theological_decisions:
- issue: Кого обозначает ἀγγέλοις в контексте суда
  choice: людей — Божьих посланников
  alternative: небесных ангелов
  rationale: Непосредственный параллелизм с «Его пророками» указывает прежде всего на людей, через которых Бог обращался к народу. Лексическая неоднозначность отмечена в сноске.
- issue: Следует ли согласовать греческое множественное число «цари халдеев» с еврейской параллелью
  choice: сохранить множественное число греческого текста
  alternative: «царь халдеев», то есть Навуходоносор
  rationale: Для 1 Ездры основным источником является греческий текст. Еврейская параллель служит для сопоставления, но не заменяет засвидетельствованную греческую форму.
- issue: Связь Божьего гнева и нечестивых дел народа
  choice: сохранить причинную связь без дополнительного богословского истолкования
  alternative: усилить формулировку как окончательное отвержение народа
  rationale: Текст связывает гнев и повеление о суде с нечестивыми делами, но не требует добавлять утверждение об окончательном отвержении заветного народа.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным, но повторяемость отвержения Божьего слова, нарастание гнева и каузативное повеление о военном вторжении сохранены. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому библейскому регистру.
