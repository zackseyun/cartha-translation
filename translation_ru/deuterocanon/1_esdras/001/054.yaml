base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/054.yaml
  text: And they were servants to him and to his sons until the Persians came to reign, to fulfill the word of the Lord by the mouth of Jeremiah.
translation:
  language: ru
  text: И были они слугами у него и у его сыновей, пока не воцарились персы, во исполнение слова Господа, сказанного устами Иеремии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παῖδες
  choice: слугами
  rationale: В контексте подчинения царю слово обозначает людей, находящихся у него на службе; «слугами» передаёт смысл, не уточняя сверх текста степень несвободы.
- source_word: αὐτῷ καὶ τοῖς υἱοῖς αὐτοῦ
  choice: у него и у его сыновей
  rationale: Русская конструкция «были слугами у кого-либо» естественно передаёт греческий дательный и сохраняет упоминание преемников царя.
- source_word: μέχρι οὗ βασιλεῦσαι Πέρσας
  choice: пока не воцарились персы
  rationale: Передаёт наступление персидского владычества, выраженное инфинитивной конструкцией после μέχρι οὗ, и звучит естественно в русском повествовании.
- source_word: εἰς ἀναπλήρωσιν
  choice: во исполнение
  rationale: Краткая и литературная формула, сохраняющая оттенок осуществления пророческого слова без жёсткого выбора между целью и результатом.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: слова Господа
  rationale: «Слово Господа» — ясная и традиционная передача пророческого изречения; перевод следует греческому κύριος.
- source_word: ἐν στόματι Ἰερεμίου
  choice: сказанного устами Иеремии
  rationale: Сохраняет библейский образ посредничества пророка и одновременно устраняет возможную неясность буквального «в устах Иеремии».
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основной текст — греческий, где стоит κύριος; поэтому выбрано «Господь», без обратной реконструкции тетраграмматона.
- issue: Связь исторического события с пророчеством
  choice: во исполнение
  alternative: чтобы исполнилось
  rationale: Формула «во исполнение» сохраняет возможный оттенок цели или результата в εἰς ἀναπλήρωσιν и не усиливает причинно-богословскую связь сверх греческого текста.
- issue: Отношение к еврейской параллели
  choice: следовать греческому тексту о служении до воцарения персов
  alternative: согласовать стих с приведённым еврейским текстом о храмовых сосудах
  rationale: Предоставленная еврейская параллель не соответствует содержанию данного греческого стиха и обозначена как приблизительная; первичным свидетельством здесь остаётся греческий текст 1 Ездры.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Воцарились» и «устами Иеремии» сохраняют историко-пророческий регистр, а синтаксис остаётся понятным современному читателю.
