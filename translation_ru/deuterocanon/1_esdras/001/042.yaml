base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/042.yaml
  text: He reigned three months and ten days in Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: ru
  text: Он царствовал в Иерусалиме три месяца и десять дней и делал зло пред Господом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в глазах Господа».'
    reason: Лексический вариант передачи ἔναντι, подчёркивающий Божью оценку поступков.
lexical_decisions:
- source_word: βασιλεύει
  choice: Он царствовал
  rationale: Историческое настоящее греческого текста естественно передаётся в русском прошедшим временем; «царствовал» точно обозначает осуществление царской власти.
- source_word: μῆνας τρεῖς καὶ ἡμέρας δέκα
  choice: три месяца и десять дней
  rationale: Прямое и естественное обозначение продолжительности царствования.
- source_word: ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Предложное сочетание указывает на место и средоточие царствования.
- source_word: ἐποίησεν τὸ πονηρόν
  choice: делал зло
  rationale: Кратко и естественно передаёт библейский оборот с субстантивированным τὸ πονηρόν, сохраняя обобщённую нравственную оценку поступков.
- source_word: ἔναντι Κυρίου
  choice: пред Господом
  rationale: Традиционный, понятный современному читателю библейский оборот, который сохраняет значение пребывания перед Богом и Божьей оценки; возможный смысл «в глазах Господа» вынесен в сноску.
theological_decisions:
- issue: Передача Κυρίου
  choice: Господом
  alternative: ГОСПОДОМ
  rationale: Основным источником служит греческий текст с Κυρίου. Поэтому имя передано как «Господь» без внесения в основной текст оформления, характерного для прямой передачи еврейского тетраграмматона.
- issue: Смысл выражения ἔναντι Κυρίου
  choice: пред Господом
  alternative: в глазах Господа
  rationale: Основной вариант сохраняет образность и допускает как значение присутствия, так и значение Божьей нравственной оценки; альтернативная формулировка поясняет оценочный оттенок, не устраняя смысловую широту греческого выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Оборот «пред Господом» сохранён как ясный и укоренённый в русской библейской речи; устаревшие грамматические формы не используются.
