base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/053.yaml
  text: And they brought all her splendor to ruin[b][a], and he carried the survivors away with the sword to Babylon.
translation:
  language: ru
  text: И они окончательно разорили всё, что было её славой, а оставшихся[a] он увёл с мечом[b] в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уцелевших»; буквально — «оставшихся».'
    reason: lexical_alternative
  - marker: b
    text: Оборот «с мечом» может указывать на насильственное уведение пленников, но может быть и теснее связан с предшествующим разорением — в смысле истребления мечом. В еврейском параллельном рассказе особо подчёркнуто убийство мечом.
    reason: alternative_reading
lexical_decisions:
- source_word: συνετέλεσαν ... ἀχρειῶσαι
  choice: окончательно разорили
  rationale: Сочетание выражает доведение разорения до конца и превращение славных ценностей города в бесполезные или негодные. «Окончательно разорили» естественно передаёт оба смысловых компонента, не добавляя явно культового значения.
- source_word: πάντα τὰ ἔνδοξα αὐτῆς
  choice: всё, что было её славой
  rationale: Субстантивированное τὰ ἔνδοξα обозначает всё славное, великолепное или ценное, принадлежавшее городу. Такая формулировка сохраняет собирательный смысл и женский референт αὐτῆς.
- source_word: τοὺς ἐπιλοίπους
  choice: оставшихся
  rationale: Речь идёт о людях, оставшихся после разорения. Слово не вносит богословских ассоциаций, которые в русском контексте может иметь «остаток».
- source_word: ἀπήγαγεν
  choice: он увёл
  rationale: Единственное число греческого глагола сохранено; по контексту субъектом является царь или предводитель завоевателей. «Увёл» передаёт насильственное перемещение без излишне технического оттенка слова «депортировал».
- source_word: μετὰ ῥομφαίας
  choice: с мечом
  rationale: 'Буквальная формулировка сохраняет сжатость и неоднозначную связь оборота: он может описывать насильственное уведение либо быть теснее связан с предшествующим разорением и убийством.'
- source_word: εἰς Βαβυλῶνα
  choice: в Вавилон
  rationale: Естественная русская передача направления движения.
theological_decisions:
- issue: Смена множественного числа «они разорили» на единственное «он увёл»
  choice: Сохранить смену числа и обозначить единственного субъекта местоимением «он».
  alternative: Передать оба действия как совершённые всем войском.
  rationale: Греческий текст явно переходит от συνετέλεσαν во множественном числе к ἀπήγαγεν в единственном. Контекст позволяет видеть во втором субъекте царя, но перевод не называет его прямо и не устраняет повествовательную напряжённость.
- issue: Передача τοὺς ἐπιλοίπους
  choice: оставшихся
  alternative: остаток
  rationale: Здесь выражение прежде всего обозначает уцелевших после разгрома, а не обязательно богословски значимый «остаток».
- issue: Связь оборота μετὰ ῥομφαίας
  choice: Сохранить буквальное «с мечом» и пояснить неоднозначность в сноске.
  alternative: Под угрозой меча; после истребления мечом.
  rationale: Греческий синтаксис допускает разные оттенки связи, а еврейская параллель особо подчёркивает убийство мечом. Основной текст не должен молча выбирать только одну интерпретацию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Формулировка избегает архаизмов и конфессионально окрашенного слова «остаток», сохраняя смену грамматического субъекта и неоднозначность оборота о мече.
