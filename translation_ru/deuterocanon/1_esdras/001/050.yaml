lexical_decisions:
- source_word: οὗτοι
  choice: Эти люди
  rationale: Указательное местоимение отсылает к упомянутым ранее захватчикам; добавление «люди» естественно проясняет подразумеваемое существительное, не вводя нового смысла.
- source_word: ἀπέκτειναν
  choice: убивали
  rationale: Имперфективное русское «убивали» естественно описывает массовую расправу в повествовании и передаёт значение греческого аориста без архаизма.
- source_word: τοὺς νεανίσκους αὐτῶν
  choice: их юношей
  rationale: Сохранены и мужское значение νεανίσκους, и притяжательное αὐτῶν, относящееся к людям, на которых напали.
- source_word: ἐν ῥομφαίᾳ
  choice: мечом
  rationale: Обычное русское обозначение орудия убийства; передаёт конкретный образ греческого текста.
- source_word: περικύκλῳ τοῦ ἁγίου ἱεροῦ
  choice: вокруг святого храма
  rationale: περικύκλῳ указывает на окружающее пространство, а ἱερόν — на храм или храмовый комплекс, не только на внутреннее святилище.
- source_word: οὐκ ἐφείσαντο
  choice: не щадили
  rationale: Прямой и естественный эквивалент, сохраняющий силу отрицания и не добавляющий толкования о внутренних чувствах убийц.
- source_word: νεανίσκου καὶ παρθένου καὶ πρεσβύτου καὶ νεωτέρου
  choice: ни юноши, ни девы, ни старика, ни того, кто помоложе
  rationale: Отрицательная перечислительная конструкция естественно передана повтором «ни». «Дева» сохраняет значение παρθένος, «старик» обозначает возраст, а не должность, а описательное «тот, кто помоложе» сохраняет сравнительность и относительную широту νεώτερος.
theological_decisions:
- issue: Соотношение греческого текста и приведённой еврейской параллели
  choice: Перевести непосредственно греческое описание убийства вокруг храма
  alternative: Согласовать стих с еврейским текстом о неверности начальников, народа и осквернении дома Господа
  rationale: Приведённая еврейская параллель лишь приблизительна и содержит иной материал. Первичным свидетельством для данного стиха служит греческий текст, поэтому подмена его содержания исказила бы источник.
- issue: Объём значения νεωτέρου
  choice: ни того, кто помоложе
  alternative: ни младшего; ни юноши
  rationale: Субстантивированная сравнительная форма буквально обозначает более молодого человека и может быть шире строго мужской возрастной категории. Перевод сохраняет эту неопределённость и не устраняет напряжение с уже употреблённым νεανίσκου.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Избегнуты архаические «отрок» и «мечом поражали», а также канцелярские обороты. Конечная запятая сохранена, поскольку греческий текст и предоставленный контекст указывают на продолжение предложения.
