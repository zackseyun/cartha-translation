base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/010.yaml
  text: And when these things had taken place[a], the priests and the Levites stood in proper order, holding the unleavened bread, according to the tribes and according to the family divisions of the fathers, before the people, to offer to the Lord according to what is written in the book of Moses[b]; and so they did in the morning.
translation:
  language: ru
  text: И когда всё это было совершено, священники и левиты выстроились в должном порядке, держа опресноки, по коленам и по родовым подразделениям, перед народом, чтобы принести их Господу согласно написанному в книге Моисея[b]. Так они поступили утром.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Греческий текст здесь заметно отличается от приблизительной еврейской параллели в 2 Пар. 35:10, где говорится о начальниках левитов, предоставивших животных для Пасхи. Перевод следует греческому тексту 1 Ездры.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ταῦτα τὰ γενόμενα
  choice: И когда всё это было совершено
  rationale: Оборот в греческом тексте краток и синтаксически шероховат; перевод передаёт обстоятельственное отношение к последующему действию, не добавляя нового события.
- source_word: εὐπρεπῶς
  choice: в должном порядке
  rationale: В культовом контексте наречие указывает на подобающее, упорядоченное расположение, а не только на внешнюю красоту.
- source_word: ἔστησαν
  choice: выстроились
  rationale: Форма передаёт, что священники и левиты заняли свои места; русское «выстроились» естественно выражает церемониальную упорядоченность.
- source_word: τὰ ἄζυμα
  choice: опресноки
  rationale: Обычное и точное русское обозначение пресного хлеба в пасхальном контексте.
- source_word: κατὰ τὰς φυλάς
  choice: по коленам
  rationale: «Колена» — традиционное и понятное обозначение племенных подразделений Израиля.
- source_word: κατὰ τὰς μεριδαρχίας τῶν πατέρων
  choice: по отделениям отцовских домов
  rationale: Передаёт родовую организацию групп, сохраняя патриархальную семейную образность; буквальная краткость греческого выражения отмечена в сноске.
- source_word: προσενεγκεῖν τῷ κυρίῳ
  choice: чтобы принести их Господу
  rationale: В данном богослужебном контексте глагол означает принесение Господу; местоимение ясно соотнесено с опресноками.
- source_word: κατὰ τὰ γεγραμμένα ἐν βιβλίῳ Μωυσῆ
  choice: согласно написанному в книге Моисея
  rationale: Формально и естественно передаёт ссылку на письменное Моисеево установление.
- source_word: καὶ οὕτω τὸ πρωϊνόν
  choice: Так они поступили утром
  rationale: Тёмная и сжатая греческая фраза передана как временное указание без превращения её в специальный термин «утренняя жертва».
theological_decisions:
- issue: Соотношение греческого текста с приблизительной параллелью в 2 Паралипоменон 35:10
  choice: 'Следовать греческой сцене: священники и левиты стоят в порядке с опресноками.'
  alternative: Согласовать стих с еврейской параллелью, где начальники левитов предоставляют пасхальных животных.
  rationale: Для 1 Ездры первичным источником служит греческий текст; существенное отличие еврейской параллели следует отметить, но не устранять гармонизацией.
- issue: Передача τῶν πατέρων
  choice: отцовских домов
  alternative: родовых групп; отделений предков; буквально «отцов»
  rationale: Выбранный вариант сохраняет мужскую родовую образность и одновременно ясно обозначает семейно-родовые подразделения.
- issue: Значение τὸ πρωϊνόν
  choice: временное указание «утром»
  alternative: техническое обозначение утреннего приношения
  rationale: Греческий текст не называет жертву прямо, поэтому перевод не должен устранять неоднозначность посредством богословско-ритуального уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Опресноки», «колена» и «книга Моисея» сохраняют узнаваемый культовый и исторический регистр; синтаксис сделан ясным для современного читателя без гармонизации с еврейской параллелью.
