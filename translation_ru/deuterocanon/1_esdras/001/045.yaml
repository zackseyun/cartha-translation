base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/045.yaml
  text: And he did what was evil before the Lord[a], and he was not ashamed at the words spoken by Jeremiah the prophet from the mouth of the Lord.
translation:
  language: ru
  text: Он делал зло перед Господом и не устыдился слов, сказанных пророком Иеремией из уст Господа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не смутился». Греческий глагол обозначает отсутствие стыда или смущения в связи со словами Иеремии; он не говорит прямо о том, что царь «не смирился», как еврейский параллельный текст в 2 Пар. 36:12.'
    reason: Сохраняет смысловой диапазон οὐκ ἐνετράπη и поясняет отличие от приблизительного еврейского параллельного текста, не подменяя греческое чтение.
lexical_decisions:
- source_word: ἐποίησεν τὸ πονηρόν
  choice: делал зло
  rationale: Устойчивое библейское выражение передаёт нравственную оценку поступков естественно и без лишнего уточнения.
- source_word: ἐνώπιον Κυρίου
  choice: пред Господом
  rationale: Сохраняет идею действия в присутствии и перед судом Господа; это краткая и достойная русская формула.
- source_word: οὐκ ἐνετράπη
  choice: не проникся стыдом
  rationale: Средне-пассивная форма ἐντρέπω здесь обозначает отсутствие стыда или смущения в ответ на пророческое слово. Формулировка естественнее по-русски, чем буквальное «не устыдился слов».
- source_word: ἀπὸ τῶν ῥηθέντων λόγων
  choice: от слов, сказанных
  rationale: Предлог ἀπό указывает на повод или источник ожидаемого чувства стыда; оборот сохраняет структуру греческого текста и остаётся понятным.
- source_word: ὑπὸ Ἰερεμίου τοῦ προφήτου
  choice: пророком Иеремией
  rationale: Точно передаёт действующее лицо при страдательном причастии и сохраняет титул Иеремии.
- source_word: ἐκ στόματος τοῦ κυρίου
  choice: из уст Господа
  rationale: Сохранён зримый пророческий оборот, подчёркивающий, что слова Иеремии исходили от Господа.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: Основной греческий текст содержит κύριος; традиционное и нейтральное русское соответствие «Господь» уместно в формуле божественной речи.
- issue: Смысл οὐκ ἐνετράπη
  choice: не проникся стыдом
  alternative: не смутился; не устыдился
  rationale: Греческий текст прямо говорит о стыде или смущении, а не о смирении. Поэтому перевод не подменяет эту формулировку чтением параллельной еврейской традиции.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Обороты «пред Господом» и «из уст Господа» сохранены как ясные и значимые формулы; синтаксис сделан плавным для обычного современного читателя.
