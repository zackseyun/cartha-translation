lexical_decisions:
- source_word: στήσας
  choice: поставив
  rationale: Аористное причастие от ἵστημι обозначает, что священников поставили на определённые места или назначили к установленному служению; причастная форма сохраняет связь с окружающим повествованием.
- source_word: τοὺς ἱερεῖς
  choice: священников
  rationale: Прямое и контекстуально однозначное соответствие греческому существительному.
- source_word: κατʼ ἐφημερίας
  choice: по чередам служения
  rationale: ἐφημερία обозначает установленную смену или разряд храмового служения. Формулировка передаёт как организационное деление священников, так и чередование их служебных сроков.
- source_word: ἐστολισμένους
  choice: облачённых
  rationale: Причастие от στολίζω указывает, что священники были надлежащим образом одеты или убраны. «Облачённых» естественно для храмового контекста, но не вводит прямо отсутствующего в греческом слова «одежды».
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν здесь естественно означает храм или его священную территорию. Перевод следует первичному греческому тексту, не заменяя его выражением «дом» из еврейской параллели.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: κύριος в греческом источнике передано традиционным и современным русским соответствием «Господь»; родительный падеж обусловлен синтаксисом.
theological_decisions:
- issue: Передача κύριος при наличии יהוה в еврейской параллели
  choice: Господа
  alternative: Яхве; ГОСПОДА
  rationale: Первичным источником служит греческий текст с κύριος. «Господа» сохраняет его форму и не подменяет её реконструированным чтением еврейской параллели.
- issue: Степень конкретизации одежды священников
  choice: облачённых
  alternative: одетых в священнические одежды; украшенных
  rationale: Греческое слово указывает на облачение или убранство, но прямо не называет особых священнических одежд. Выбранный вариант уместен в контексте и сохраняет некоторую широту значения.
- issue: Соотношение греческого «в храме» и еврейского «для служения в доме Господа»
  choice: в храме Господа
  alternative: для служения в доме Господа
  rationale: Греческий текст непосредственно задаёт местное выражение ἐν τῷ ἱερῷ. Еврейская параллель важна для сопоставления, однако её отличающееся чтение не должно вытеснять первичный источник.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Причастный оборот сохранён, поскольку стих синтаксически продолжает окружающее повествование. «Череды служения» понятно передают установленную ротацию, а «облачённых» соответствует храмовому контексту без излишней конкретизации.
