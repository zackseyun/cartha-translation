translation:
  language: ru
  text: И с женщиной[b] он оставляет свою жизнь[a] и не помнит ни отца, ни матери, ни родной земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставляет свою душу» или «оставляет самого себя». Греческое ψυχή может означать жизнь, душу или самого человека.'
    reason: lexical_alternative
