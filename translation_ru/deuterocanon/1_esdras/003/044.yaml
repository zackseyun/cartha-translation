  source_fidelity: Начальное «и» и конструкция «с женщиной» верно отражают καὶ μετὰ τῆς γυναικός. Однако «расстаётся с самой жизнью» в современном русском обычно означает смерть и чрезмерно сужает ἀφίησι τὴν ψυχήν; усилительное «самой» отсутствует в греческом. Более нейтральное «оставляет свою жизнь» сохраняет образ и широту ψυχή, не навязывая значения буквальной гибели.
  naturalness: Предлагаемая правка остаётся литературной и афористичной. «Оставляет свою жизнь» несколько образно, но в данном риторическом контексте естественнее и точнее, чем «расстаётся с самой жизнью».
