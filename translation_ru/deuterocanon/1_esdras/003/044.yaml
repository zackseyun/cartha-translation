    text: '«Женщина» может также означать «жена»: греческое γυνή допускает оба значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τῆς γυναικός
  choice: с женщиной
  rationale: 'μετά с родительным падежом обычно обозначает совместность или связь: «с». Такой перевод сохраняет формальную неоднозначность отношений, не подменяя её причинным «ради женщины».'
- source_word: γυναικός
  choice: женщиной
  rationale: γυνή может означать как женщину, так и жену. Контекст не требует однозначно понимать её как законную супругу, поэтому более широкое «женщина» оставлено в тексте, а вариант отмечен в сноске.
- source_word: ἀφίησι τὴν ψυχήν
  choice: расстаётся с самой жизнью
  rationale: ἀφίημι означает «оставлять, отпускать, покидать», а ψυχή — «жизнь, душа, сам человек». Русское выражение передаёт крайнюю степень самоотдачи, не сводя смысл исключительно к смерти; частица «самой» естественно подчёркивает силу оборота.
- source_word: μέμνηται
  choice: помнит
  rationale: Прямой современный эквивалент со значением «помнить, иметь в мыслях».
- source_word: χώραν
  choice: родной земли
  rationale: В ряду с отцом и матерью χώρα обозначает землю или страну, к которой человек принадлежит. «Родная земля» передаёт личную привязанность, не вводя современного государственного оттенка.
