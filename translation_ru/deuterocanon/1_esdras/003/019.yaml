lexical_decisions:
- source_word: πᾶσαν διάνοιαν
  choice: всякий ум
  rationale: διάνοια может обозначать ум, мысль или помышление. «Всякий ум» сохраняет обобщающий и распределительный смысл πᾶσαν, не сводя выражение только к отдельным мыслям.
- source_word: μεταστρέφει
  choice: обращает
  rationale: Глагол означает поворачивать, изменять направление или состояние. «Обращает» сохраняет образ направленности к последующим εἰς εὐωχίαν καὶ εὐφροσύνην.
- source_word: εἰς εὐωχίαν
  choice: к пиршеству
  rationale: εὐωχία обозначает праздничную трапезу или пиршество; конкретное «пиршество» точнее общего «удовольствие» и не привносит отрицательного оттенка разгула.
- source_word: καὶ εὐφροσύνην
  choice: и веселью
  rationale: εὐφροσύνη означает радость, веселье, хорошее расположение духа. «Веселье» естественно сочетается с «пиршеством» и передаёт праздничный смысл.
- source_word: οὐ μέμνηται
  choice: человек не помнит
  rationale: Форма третьего лица единственного числа имеет обобщённый смысл. Добавление нейтрального родового субъекта «человек» делает русскую фразу ясной, не связывая глагол грамматически с вином как неодушевлённым субъектом.
- source_word: πᾶσαν λύπην
  choice: ни печали
  rationale: λύπη охватывает печаль, скорбь и душевную боль. При отрицании πᾶσαν естественно передаётся по-русски конструкцией «ни печали».
- source_word: πᾶν ὀφείλημα
  choice: ни долга
  rationale: ὀφείλημα буквально означает долг, то, что причитается или должно быть исполнено. «Долг» сохраняет прямой и конкретный смысл, а более широкая возможность отмечена в сноске.
