base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/029.yaml
  text: And those who do not serve in the army or fight[a], but farm the land, again, when they sow, after reaping they bring tribute to the king; and by compelling one another[b], they bring the taxes to the king.
translation:
  language: ru
  text: А те, кто не служат в войске и не воюют, а возделывают землю, также, когда сеют, собрав урожай, приносят царю дань[a]; и, принуждая друг друга[b], вносят царю налоги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приносят царю»; что именно приносят, в греческом тексте не названо. По контексту речь идёт о причитающемся царю платеже, то есть о дани.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «принуждая один другого». Вероятно, имеется в виду взаимное давление, обеспечивающее уплату царских налогов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύονται
  choice: служит в войске
  rationale: Глагол обозначает военную службу или участие в походе; такой перевод естественен по-русски и сохраняет отличие от следующего πολεμοῦσιν.
- source_word: πολεμοῦσιν
  choice: воюет
  rationale: Передаёт непосредственное ведение войны и сохраняет параллель с военной службой.
- source_word: γεωργοῦσιν τὴν γῆν
  choice: возделывает землю
  rationale: Точно передаёт сельскохозяйственный труд и звучит современно и достойно.
- source_word: πάλιν
  choice: в свою очередь
  rationale: В данном перечислении слово обозначает переход к другой группе и её соответствующей обязанности; буквальное «снова» по-русски могло бы ошибочно указывать на повторное действие.
- source_word: ὅταν σπείρωσιν, θερίσαντες
  choice: посеяв и собрав урожай
  rationale: Передаёт обычную последовательность сельскохозяйственных действий до внесения платежа, не перегружая русскую фразу придаточными конструкциями.
- source_word: ἀναφέρουσιν τῷ βασιλεῖ
  choice: приносят дань царю
  rationale: В первом случае объект в греческом не выражен, но контекст царских повинностей указывает на причитающийся царю платёж; «приносят дань» сохраняет конкретный образ доставки.
- source_word: ἀναγκάζοντες
  choice: принуждая
  rationale: Сохраняет выраженную в греческом силу принуждения, не уточняя его не названный механизм.
- source_word: ἕτερος τὸν ἕτερον
  choice: друг друга
  rationale: Естественная русская передача взаимного отношения, буквально выраженного конструкцией «один другого».
- source_word: τοὺς φόρους
  choice: подати
  rationale: Слово обозначает обязательные выплаты правителю; «подати» уместно в древнем царском контексте и отличает явно названные сборы от подразумеваемой дани в первой части.
theological_decisions:
- issue: Передача двух упоминаний платежа царю
  choice: В первом случае — «дань», во втором — «подати»
  alternative: Передать оба случая одинаково как «налоги» или «дань»
  rationale: В первом обороте греческий текст не называет объект глагола ἀναφέρουσιν, тогда как во втором прямо употребляет φόρους. Различение сохраняет это движение от подразумеваемого царского платежа к явно названным обязательным сборам, не придавая тексту конфессионального смысла.
translation_notes:
  register: Современный литературный русский с умеренно торжественным историческим оттенком. Единственное число в глаголах после конструкции «те, кто» соответствует современной нормативной связи с местоимением «кто». Эллипсис первого объекта разъяснён в сноске, а необычная взаимность принуждения сохранена без преждевременного истолкования.
