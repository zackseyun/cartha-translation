  text: And now you do not believe me[a]. Is not the king great in his authority? Do not all the lands fear to touch him?
translation:
  language: ru
  text: И теперь вы мне не верите. Разве царь не велик своей властью? Разве все земли не боятся коснуться его?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «поднять на него руку». Буквально по-гречески: «коснуться его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ
  choice: верите
  rationale: 'В сочетании с дательным местоимением μοι глагол естественно передаётся как «верите мне»: речь идёт о том, что слушатели не принимают утверждение говорящего.'
- source_word: μέγας
  choice: велик
  rationale: Сохраняет прямое значение «великий» и риторическую характеристику высокого положения и могущества царя, не сводя её только к физической силе.
- source_word: ἐξουσίᾳ
  choice: властью
  rationale: Передаёт законное или признанное право распоряжаться и править; творительный падеж сохраняет связь величия царя с его властью.
- source_word: χῶραι
  choice: земли
  rationale: Обозначает территории и области, не привнося современного понятия национальных государств.
- source_word: εὐλαβοῦνται
  choice: боятся
  rationale: В данном контексте глагол выражает опасение и осторожность перед могущественным царём; «боятся» естественно объясняет нежелание причинить ему вред.
- source_word: ἅψασθαι
  choice: коснуться
  rationale: Сохраняет прямое значение греческого глагола и допускает контекстуальный смысл покушения или враждебного воздействия, пояснённый в сноске.
