lexical_decisions:
- source_word: τότε
  choice: тогда
  rationale: Кратко и естественно обозначает следующий этап повествования.
- source_word: γράψαντες
  choice: написал
  rationale: Аористное причастие выражает действие, предшествующее запечатыванию и помещению; в русском оно естественно передано личной формой перед последующими глаголами.
- source_word: ἕκαστος
  choice: каждый
  rationale: 'Сохраняет распределительное значение: каждый участник написал собственный текст.'
- source_word: τὸν ἑαυτοῦ λόγον
  choice: своё высказывание
  rationale: λόγος здесь означает составленное каждым участником утверждение или ответ; «высказывание» естественнее буквального «слово» и не сужает смысл до «довода».
- source_word: ἐσφραγίσαντο
  choice: они запечатали написанное
  rationale: Средняя форма описывает запечатывание составленных текстов; дополнение «написанное» ясно передаёт подразумеваемый объект.
- source_word: ἔθηκαν
  choice: положили
  rationale: Обычный повествовательный эквивалент, подходящий для помещения предметов под изголовье.
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: под изголовье
  rationale: προσκεφάλαιον может обозначать подушку либо опору для головы; «изголовье» сохраняет эту предметную неопределённость лучше, чем однозначное «подушка».
- source_word: Δαρείου τοῦ βασιλέως
  choice: царя Дария
  rationale: Естественная современная русская форма титула и имени в родительном падеже.
