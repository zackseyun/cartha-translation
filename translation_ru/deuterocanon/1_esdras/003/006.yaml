  text: и облачаться в пурпур, и пить из золотых сосудов[a], и спать на золоте[b], и иметь колесницу с золотой упряжью[c], кидар из тонкого льна и ожерелье на шее,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение буквально указывает на питьё с помощью золотых предметов, не уточняя, были ли это чаши или другие сосуды.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «спать на золоте»; вероятно, имеется в виду украшенное золотом ложе, однако в греческом тексте само ложе не названо.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «колесницу с золотой уздой»; сложное греческое прилагательное описывает золотую узду или упряжь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: облачаться в пурпур
  rationale: Средний инфинитив означает надевать на себя или облекаться; «пурпур» естественно передаёт пурпурную одежду как знак роскоши и высокого положения, не добавляя отсутствующего в греческом определения «царский».
- source_word: ἐν χρυσώμασιν πίνειν
  choice: пить из золотых сосудов
  rationale: Фраза указывает на питьё с использованием золотых предметов, но не называет точный вид посуды; «сосуды» сохраняет эту неопределённость и звучит естественно по-русски.
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: спать на золоте
  rationale: Сохранено сжатое и несколько необычное выражение греческого текста без добавления прямо не названной кровати или ложа.
- source_word: ἅρμα χρυσοχάλινον
  choice: колесницу с золотой упряжью
  rationale: Сложное прилагательное связывает золото с уздой или упряжью колесницы; «упряжь» в русском яснее охватывает конскую сбрую, не сводя образ обязательно к одной узде.
- source_word: κίδαριν βυσσίνην
  choice: кидар из тонкого льна
  rationale: κίδαρις обозначает особый головной убор, а βύσσινος — изделие из тонкого льна. Традиционное и точное «кидар» уместно в библейском историческом контексте.
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: ожерелье на шее
  rationale: μανιάκης — шейное украшение, цепь или обруч; нейтральное «ожерелье» естественно для современного русского языка и не уточняет конструкцию украшения.
