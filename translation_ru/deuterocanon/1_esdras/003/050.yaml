  text: And many perished and were led astray and sinned because of women[a].
translation:
  language: ru
  text: И многие погибли, сбились с пути и согрешили из-за женщин[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за жён». Греческое слово γυναῖκες в зависимости от контекста может означать как «женщины», так и «жёны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλοντο
  choice: погибли
  rationale: Аорист от ἀπόλλυμι здесь передаёт гибель или окончательное крушение; «погибли» кратко, естественно и сохраняет силу греческого выражения, не уточняя внешнего деятеля.
- source_word: ἐσφάλησαν
  choice: сбились с пути
  rationale: Пассивная форма от σφάλλω может означать падение, ошибку или уклонение. В нравственном ряду «погибли… согрешили» выражение «сбились с пути» естественно передаёт отклонение, не сводя образ к физическому падению и не навязывая значение обмана.
- source_word: ἡμάρτοσαν
  choice: согрешили
  rationale: В данном нравственно-религиозном контексте это прямое и общепонятное соответствие глаголу ἁμαρτάνω.
- source_word: διὰ τὰς γυναῖκας
  choice: из-за женщин
  rationale: διά с винительным падежом выражает причину. Слово γυναῖκες может означать как «женщины», так и «жёны»; в основном тексте выбрано более широкое значение, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Возможное обобщение и неоднозначность слова γυναῖκες
  choice: женщин
  alternative: жён
  rationale: Само греческое слово допускает оба значения, а данная фраза не ограничивает его однозначно супругами. Более широкое чтение сохранено в тексте без смягчения исходной риторики; более узкое вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и ритмически близкая греческой трёхчастной последовательности. «Сбились с пути» звучит естественно и сохраняет нравственный смысл, не устраняя оттенок падения.
