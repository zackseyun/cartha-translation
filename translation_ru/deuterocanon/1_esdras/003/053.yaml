  verdict: approve
  source_fidelity: 'Перевод точно передаёт последовательность действий, выраженную греческими формами: женщина снимала διάδημα с головы царя, возлагала его на себя и ударяла царя левой рукой. Несовершенный вид («снимала», «надевала», «ударяла») уместно сохраняет описательно-повторительный характер форм в данном контексте. Рефлексивное «на себя» корректно передаёт αὐτῇ, не добавляя прямо не названную в греческом голову.'
  naturalness: Текст естественен для современного литературного русского языка. «Надевала её на себя» несколько менее конкретно, чем «надевала её себе на голову», но это сознательно сохраняет недоговорённость греческого и остаётся нормативным и понятным. Начальное «и» соответствует соединительному καί и допустимо как продолжение повествовательского контекста.
  terminology: «Диадема» — точный историко-лексический эквивалент διάδημα; примечание предлагает доступный вариант «царский венец». «Ударяла» обоснованно не ограничивает ἐράπιζεν только значением пощёчины, а примечание надлежащим образом отмечает эту возможность. Якоря примечаний стоят при соответствующих словах.
