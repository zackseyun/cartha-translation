  text: and she would take the crown from the king’s head and put it on herself[b][a], and she would strike the king with her left hand.
translation:
  language: ru
  text: и снимала диадему[a] с головы царя, надевала её на себя и ударяла царя левой рукой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царский венец». Диадема представляла собой знак царской власти.'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол может означать удар рукой, в частности пощёчину.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: снимала ... с
  rationale: Причастие продолжает описание характерного или повторявшегося действия; русская форма несовершенного вида естественно передаёт эту длительно-повторительную силу.
- source_word: τὸ διάδημα
  choice: диадему
  rationale: Греческое διάδημα обозначает царскую повязку, знак царского достоинства. «Диадема» точнее сохраняет историческую реалии, чем более широкое «корона».
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: надевала её на себя
  rationale: Дательный αὐτῇ относится к самой женщине. Формулировка сохраняет рефлексивный смысл, не добавляя отсутствующего в греческом слова «голова».
- source_word: ἐράπιζεν
  choice: ударяла
  rationale: ῥαπίζω может обозначать удар рукой, в частности пощёчину. Более широкое «ударяла» не сужает значение без необходимости.
- source_word: τῇ ἀριστερᾷ
  choice: левой рукой
  rationale: Форма женского рода предполагает опущенное χείρ, «рука»; творительный падеж естественно передаёт орудийное значение.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Повторяющийся союз прямо соединяет последовательные действия; в русском часть союзов допустимо передать перечислительной интонацией ради естественности.
