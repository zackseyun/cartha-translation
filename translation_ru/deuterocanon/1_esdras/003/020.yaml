  yaml_path: translation/deuterocanon/1_esdras/003/020.yaml
  text: and it makes every heart rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: ru
  text: и оно обогащает всякое сердце, и не помнит ни царя, ни сатрапа; и заставляет всех говорить посредством талантов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заставляет всё говорить посредством талантов». «Талант» — мера веса и крупная денежная единица. Форма «всё» может по смыслу относиться к людям; выражение также может означать, что речь ведётся благодаря деньгам или о деньгах.'
    reason: Сохраняет неоднозначность πάντα и διὰ ταλάντων, поясняя историческое денежное значение «таланта» без навязывания одного толкования.
lexical_decisions:
- source_word: πάσας καρδίας ποιεῖ πλουσίας
  choice: делает богатыми все сердца
  rationale: Сохраняется образ сердца как внутреннего человека и экономическая образность прилагательного πλουσίας; порядок слов слегка приспособлен к естественному русскому синтаксису.
- source_word: οὐ μέμνηται βασιλέα οὐδὲ σατράπην
  choice: не помнит ни царя, ни сатрапа
  rationale: Буквальное значение μέμνηται сохранено без скрытого истолкования как «не считается»; исторический титул σατράπης передан точно.
- source_word: πάντα
  choice: всех
  rationale: Хотя форма πάντα среднего рода допускает «всё», инфинитив λαλεῖν естественно указывает здесь на говорящих людей. Русское «всех» передаёт вероятный практический смысл, а формальная неоднозначность отмечена в сноске.
- source_word: διὰ ταλάντων
  choice: о талантах
  rationale: Талант здесь является денежно-весовой единицей. Предлог διά допускает неоднозначность отношения или средства; «о талантах» даёт понятное контекстуальное чтение, не заменяя исторический термин общим словом «деньги».
- source_word: λαλεῖν
  choice: говорить
  rationale: Прямой и естественный русский эквивалент без ненужного усиления.
