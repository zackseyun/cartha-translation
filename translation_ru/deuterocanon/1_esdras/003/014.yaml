lexical_decisions:
- source_word: ἐξαποστείλας
  choice: разослав вестников
  rationale: Аористное причастие предшествует основному глаголу и, вероятно, подразумевает рассылку людей с повелением; дополнение эксплицировано ради естественности русского языка, но отмечено в сноске как подразумеваемое.
- source_word: ἐκάλεσεν
  choice: созвал
  rationale: Передаёт властный призыв царём множества должностных лиц естественнее, чем нейтральное «позвал».
- source_word: μεγιστᾶνας
  choice: вельмож
  rationale: Обозначает знатных и влиятельных людей государства; «вельможи» — понятное и уместное для исторического повествования русское слово.
- source_word: Περσίδος καὶ τῆς Μηδείας
  choice: Персии и Мидии
  rationale: Общепринятые русские названия исторических областей.
- source_word: σατράπας
  choice: сатрапов
  rationale: Сохранён точный исторический титул персидской администрации.
- source_word: στρατηγοὺς
  choice: военачальников
  rationale: Передаёт военную функцию шире и естественнее, чем современное звание «генералы».
- source_word: τοπάρχας
  choice: правителей областей
  rationale: Функционально передаёт начальников местных территориальных единиц, не вводя малознакомую транслитерацию «топархи».
- source_word: ὑπάτους
  choice: высших сановников
  rationale: Сохраняет значение высокого служебного ранга, не перенося в персидскую среду специфически римский титул «консул» и не смешивая его с сатрапами как правителями.
