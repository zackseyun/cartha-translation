  yaml_path: translation/deuterocanon/1_esdras/003/026.yaml
  text: But the king prevails over them and rules over them, and he is master over them, and whatever he says to them, they will obey.
translation:
  language: ru
  text: Но царь сильнее их, он властвует над ними и господствует над ними; и всё, что бы он им ни сказал, они послушаются.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερισχύει
  choice: превосходит их силой
  rationale: Передаёт значение превосходства в силе или могуществе, сохраняя отличие от следующих глаголов власти.
- source_word: κυριεύει αὐτῶν
  choice: властвует над ними
  rationale: Естественно передаёт осуществление власти и сохраняет повтор объекта.
- source_word: δεσπόζει αὐτῶν
  choice: господствует над ними
  rationale: Сохраняет усилительный ряд и оттенок положения полновластного господина, не сливая выражение с предыдущим глаголом.
- source_word: πᾶν ὃ ἐὰν εἴπῃ αὐτοῖς
  choice: всё, что он им ни прикажет
  rationale: В контексте царской власти εἴπῃ означает сказанное как распоряжение; «ни» естественно передаёт обобщённость конструкции ὃ ἐὰν.
- source_word: ἐνακούσουσιν
  choice: они исполнят
  rationale: В контексте подчинения царскому распоряжению глагол означает послушаться, то есть исполнить сказанное.
