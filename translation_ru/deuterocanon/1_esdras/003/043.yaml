  text: A man leaves his own father[a], who raised him, and his own country, and clings to his own wife,
translation:
  language: ru
  text: Мужчина оставляет своего отца[a], который его вырастил, и свою страну и прилепляется к своей жене,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покидает» или «бросает». Греческий глагол может иметь более сильный смысл, но здесь, вероятно, говорится об уходе от отца и своей страны ради соединения с женой.'
