lexical_decisions:
- source_word: ἄνθρωπος
  choice: Человек
  rationale: В единственном числе обозначает мужчину как типичного участника описываемой брачной ситуации; дальнейшее упоминание жены делает мужскую референцию ясной.
- source_word: τὸν ἑαυτοῦ πατέρα
  choice: своего отца
  rationale: Возвратное ἑαυτοῦ подчёркивает принадлежность; русское «своего» естественно передаёт этот оттенок.
- source_word: ἐγκαταλείπει
  choice: оставляет
  rationale: Глагол допускает более сильное «покидает» или «оставляет на произвол», однако в данном контексте речь, вероятнее всего, идёт об уходе от отца и родной земли ради соединения с женой; нейтральное «оставляет» не вносит лишнего нравственного осуждения.
- source_word: ὃς ἐξέθρεψεν αὐτόν
  choice: который его вырастил
  rationale: ἐκτρέφω обозначает вскармливание и воспитание ребёнка; «вырастил» кратко и естественно передаёт родительскую заботу.
- source_word: τὴν ἰδίαν χώραν
  choice: свою родную землю
  rationale: χώρα может означать землю, область или страну. «Родная земля» в этом контексте естественно передаёт место, к которому человек принадлежит, при сохранении оттенка ἰδίαν.
- source_word: πρὸς τὴν ἰδίαν γυναῖκα
  choice: к своей жене
  rationale: В контексте брачной привязанности γυνή означает «жена»; повторное явное «своей собственной» по-русски было бы тяжеловесным.
- source_word: κολλᾶται
  choice: прилепляется
  rationale: Слово выражает тесное и прочное соединение. «Прилепляется» сохраняет сильный образ греческого глагола и узнаваемую библейскую формулировку, оставаясь понятным современному читателю.
theological_decisions:
- issue: Родовая мужская референция в изречении о браке
  choice: Человек
  alternative: Мужчина
  rationale: ἄνθρωπος буквально означает «человек», а контекст с женой уточняет, что здесь представлен мужчина. «Человек» сохраняет лексическую широту исходного слова, не устраняя мужскую брачную ситуацию.
translation_notes:
  register: Современный литературный русский с умеренно библейской окраской. «Прилепляется» выбрано ради точности образа и межтекстовой узнаваемости; структура и конечная запятая сохранены, поскольку стих представляет часть продолжающегося высказывания.
