lexical_decisions:
- source_word: Ὁ δὲ τρίτος
  choice: Тогда третий
  rationale: Передаёт переход к следующему участнику и сохраняет порядковое числительное без добавления отсутствующего в греческом слова «человек».
- source_word: ὁ εἴπας
  choice: тот, кто говорил
  rationale: Артиклевое причастие аориста указывает на участника по его ранее заявленной теме; русское выражение естественно в данном повествовательном контексте.
- source_word: περὶ τῶν γυναικῶν καὶ τῆς ἀληθείας
  choice: о женщинах и об истине
  rationale: Сохраняет обе темы и повтор предлога, соответствующий греческой конструкции; определённая форма ἀληθείας естественно передаётся как «истина».
- source_word: οὗτός ἐστιν Ζοροβαβέλ
  choice: это был Зоровавель
  rationale: Греческое настоящее время выполняет функцию отождествления, но в русском повествовании, ведущемся в прошедшем времени, естественно «это был».
- source_word: Ζοροβαβέλ
  choice: Зоровавель
  rationale: Форма отражает греческое Ζοροβαβέλ и одновременно соответствует закрепившейся русской библейской передаче имени; вариант пояснён в сноске.
- source_word: ἤρξατο λαλεῖν
  choice: начал говорить
  rationale: Прямо и естественно передаёт начинательную конструкцию ἄρχομαι с инфинитивом.
