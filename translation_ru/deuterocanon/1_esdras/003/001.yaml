  yaml_path: translation/deuterocanon/1_esdras/003/001.yaml
  text: And King Dareios made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia[b],
translation:
  language: ru
  text: И царь Дарий устроил большой пир для всех, кто был ему подвластен, для всех своих домочадцев и для всех вельмож Мидии и Персии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: большой пир
  rationale: δοχή обозначает устроенное угощение, торжественную трапезу или пир; в контексте царского двора «большой пир» естественно передаёт и масштаб, и характер события.
- source_word: τοῖς ὑπʼ αὐτόν
  choice: кто был ему подвластен
  rationale: Оборот буквально означает находящихся «под ним». Выбранная формулировка сохраняет иерархический смысл, не сужая круг лиц до подданных в строго государственно-правовом смысле.
- source_word: οἰκογενέσιν αὐτοῦ
  choice: своих домочадцев
  rationale: Слово охватывает людей, принадлежащих к дому или домашнему кругу правителя, и не ограничивается кровными родственниками, как могло бы подразумевать слово «семья».
- source_word: μεγιστᾶσιν
  choice: вельмож
  rationale: Термин обозначает высокопоставленных, влиятельных людей; «вельможи» естественно и уместно звучит в древнем царском контексте.
- source_word: Μηδείας καὶ τῆς Περσίδος
  choice: Мидии и Персии
  rationale: Греческий текст называет области или державы, а не народы; поэтому сохранены географические названия.
- source_word: βασιλεὺς Δαρεῖος
  choice: царь Дарий
  rationale: «Дарий» — устоявшаяся русская форма имени Δαρεῖος, а «царь» соответствует древнему монархическому контексту.
