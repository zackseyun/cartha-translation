translation_notes:
  register: Современный литературный русский с сохранением ритмического перечисления оригинала. Формула «отнимает силой» различает тайную кражу и насильственный захват; «проникает в дом ради кражи» делает понятным значение редкого греческого глагола. Союз перед последним действием передан как «или», поскольку по-русски такое перечисление естественно воспринимается как ряд возможных способов добычи; общая повторяемость конструкции ὅταν передана словами «всякий раз, когда».
