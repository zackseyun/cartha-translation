  - severity: medium
    issue: Союз «или» перед последним действием
    rationale: В греческом перечислении стоят κλέψῃ καὶ ἁρπάσῃ καὶ κλωποδυτήσῃ. Замена последнего καὶ на «или» меняет связь действий.
