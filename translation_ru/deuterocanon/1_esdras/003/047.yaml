  text: and he watches for the lion[a], and walks in darkness; and whenever he steals and snatches and breaks in[c][b], he brings it to his beloved.
translation:
  language: ru
  text: и смотрит на льва[a], и ходит во тьме; и всякий раз, когда он крадёт, хватает и совершает кражу со взломом[b], он приносит это своей возлюбленной[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наблюдает за львом». Греческий глагол может обозначать внимательное рассматривание или наблюдение; контекст допускает более целенаправленный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Редкий греческий глагол обозначает тайное воровство, особенно кражу со взломом; возможный перевод: «ворует тайком».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «женщине, которую любит». Греческое слово обозначает любимую женщину в романтическом смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: наблюдает за
  rationale: Передаёт внимательное, целенаправленное наблюдение, не исключая более буквального смысла «смотрит на».
- source_word: τὸν λέοντα
  choice: львом
  rationale: Определённость греческого выражения сохранена русской формой «за львом» без добавления неопределённости.
- source_word: ἐν σκότει βαδίζει
  choice: ходит во тьме
  rationale: Прямо сохраняет образ движения во тьме и звучит естественно в современном литературном русском.
- source_word: κλέψῃ
  choice: крадёт
  rationale: Простое общеупотребительное слово точно передаёт тайное присвоение чужого.
- source_word: ἁρπάσῃ
  choice: отнимает силой
  rationale: Выражает присущее глаголу значение насильственного захвата и яснее отличает его от предшествующего «крадёт».
- source_word: κλωποδυτήσῃ
  choice: проникает в дом ради кражи
  rationale: Редкий глагол обозначает тайное воровское проникновение, особенно кражу со взломом; описательный перевод понятен современному читателю и не требует узкоюридического термина.
- source_word: ἀποφέρει
  choice: приносит добытое
  rationale: Глагол обозначает доставление кому-либо; добавленное по смыслу «добытое» естественно восполняет невыраженный объект, отсылая к перечисленным преступным действиям.
- source_word: τῇ ἐρωμένῃ
  choice: своей возлюбленной
  rationale: Передаёт женский род и романтический характер отношения, сохраняя достоинство и не усиливая возможный сексуальный оттенок.
