lexical_decisions:
- source_word: αἱ γυναῖκες
  choice: женщины
  rationale: Прямое и естественное соответствие греческому множественному числу.
- source_word: ἐγέννησαν
  choice: родили
  rationale: Передаёт буквальный смысл рождения женщинами и сохраняет риторическую силу высказывания.
- source_word: τὸν βασιλέα
  choice: царя
  rationale: Обычное соответствие βασιλεύς в данном историко-литературном контексте.
- source_word: πάντα τὸν λαὸν
  choice: весь народ
  rationale: Сохраняет собирательное единственное число греческого выражения.
- source_word: ὃς κυριεύει
  choice: владычествующий
  rationale: Причастная конструкция естественно связывает определение с собирательным существительным «народ» и передаёт значение господства, не сводя его лишь к административному управлению.
- source_word: τῆς θαλάσσης καὶ τῆς γῆς
  choice: над морем и землёй
  rationale: Предлог «над» требуется русским глагольным управлением; отсутствие артиклевой конкретизации в переводе соответствует обобщённой паре «море и земля».
