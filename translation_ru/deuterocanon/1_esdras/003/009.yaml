base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and the one whom the king and the three nobles of Persia judge to be the one whose word is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: ru
  text: 'И сказали они: «Когда царь встанет, ему передадут написанное[a]. И тому, о ком царь и три персидских вельможи решат, что его слово мудрее[b], будет присуждена победа, как записано».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «письменный текст», «документ».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его высказывание мудрее» или «его довод мудрее». Греческое слово λόγος допускает все эти значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθῇ
  choice: встанет
  rationale: Передаёт значение «поднимется, встанет» без излишнего уточнения, идёт ли речь о пробуждении или вставании с ложа.
- source_word: τὸ γράμμα
  choice: написанное
  rationale: В контексте речь идёт о подготовленном письменном высказывании; вариант сохраняет широту γράμμα и не создаёт впечатления частного письма.
- source_word: κρίνῃ
  choice: решат
  rationale: В данном состязании глагол обозначает оценочное решение; по-русски «решат» звучит естественно при составном подлежащем.
- source_word: μεγιστᾶνες
  choice: вельможи
  rationale: Обозначает высокопоставленных персидских сановников или знатных лиц; «вельможи» соответствует придворному контексту и сохраняет достоинство стиля.
- source_word: Περσίδος
  choice: персидских
  rationale: Естественно выражает принадлежность к Персии в сочетании «три персидских вельможи».
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: его слово мудрее
  rationale: Близко передаёт буквальную и несколько необычную конструкцию греческого текста, сохраняя неоднозначность λόγος между словом, высказыванием и доводом.
- source_word: τὸ νῖκος
  choice: победа
  rationale: Прямое соответствие греческому νῖκος; контекст допускает оттенок признания победителем, но не требует замены на «награду».
- source_word: καθὼς γέγραπται
  choice: как и записано
  rationale: Здесь формула указывает на установленный письменно порядок состязания; «записано» естественнее в данном нессылочном контексте, чем библейская формула «написано».
