translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «Возлежит» сохраняет культурную деталь исходного текста; синтаксис остаётся простым и понятным. Начальная строчная буква и конечная точка с запятой отражают продолжение предложения в окружающем контексте.
