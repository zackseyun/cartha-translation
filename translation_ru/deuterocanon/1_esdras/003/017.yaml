lexical_decisions:
- source_word: Ἀπαγγείλατε
  choice: Расскажите
  rationale: Повелительная форма множественного числа передаёт просьбу изложить содержание перед собравшимися; «расскажите» естественно звучит в современной русской прямой речи и сохраняет оттенок сообщения.
- source_word: περὶ τῶν γεγραμμένων
  choice: о написанном
  rationale: Субстантивированное причастие совершенного вида в пассиве обозначает уже составленные письменные высказывания, не уточняя их авторство.
- source_word: ὁ πρῶτος
  choice: первый
  rationale: Субстантивированное порядковое числительное прямо указывает на первого выступающего.
- source_word: ὁ εἴπας
  choice: тот, кто высказался
  rationale: Аористное причастие характеризует первого участника по ранее заявленной им теме; формулировка не утверждает сверх греческого текста, произнёс ли он её устно или представил письменно.
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  choice: о силе вина
  rationale: «Сила» сохраняет основной образ ἰσχύς и в данном контексте естественно обозначает могущество или воздействие вина.
- source_word: ἤρξατο … καὶ ἔφη οὕτως
  choice: начал говорить так
  rationale: Естественная русская формула введения последующей речи передаёт и начало выступления, и οὕτως, избегая тяжеловесного буквального «начал и сказал так».
