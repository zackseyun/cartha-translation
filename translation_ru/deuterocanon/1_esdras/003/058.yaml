    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: снова
  rationale: Наречие обозначает повторность или обратное движение; «снова» естественно сочетается здесь с глаголом возвращения.
- source_word: ἀποτρέχει
  choice: возвращается бегом
  rationale: Сложный глагол с корнем τρέχω передаёт быстрое движение обратно; этот перевод сохраняет и значение возвращения, и образ бега.
- source_word: εἰς τὸν ἑαυτοῦ τόπον
  choice: на своё место
  rationale: «Место» точно передаёт τόπος, а возвратное «своё» сохраняет значение ἑαυτοῦ и звучит естественно по-русски.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: за один день
  rationale: Оборот указывает на срок, в пределах которого совершается движение; по-русски «за один день» ясно передаёт завершённость в течение суток.
