lexical_decisions:
- source_word: ὁ ἕτερος
  choice: Другой
  rationale: Сочетание артикля с ἕτερος указывает на другого участника из уже определённой группы; «Другой» естественно передаёт последовательность, не уточняя сверх текста, что он был именно вторым.
- source_word: ἔγραψεν
  choice: написал
  rationale: Аорист γράφω здесь прямо означает завершённое действие «написал»; контекст не требует более специального «начертал».
- source_word: Ὑπερισχύει
  choice: сильнее
  rationale: ὑπερισχύω выражает превосходство в силе или способность одолевать. В кратком тезисе состязания сравнительное «сильнее» естественно сохраняет это значение, не превращая его без необходимости в явную превосходную степень.
- source_word: ὁ βασιλεύς
  choice: царь
  rationale: βασιλεύς в данном повествовательном контексте точно и традиционно передаётся словом «царь».
