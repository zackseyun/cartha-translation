lexical_decisions:
- source_word: ἐξηγέρθη
  choice: проснулся
  rationale: Аорист пассивной формы здесь употреблён непереходно и обозначает пробуждение ото сна; «проснулся» естественно передаёт смысл в данном повествовательном контексте.
- source_word: λαβόντες
  choice: они взяли
  rationale: Греческое причастие передано личной формой глагола, что сохраняет последовательность действий и звучит естественно по-русски.
- source_word: τὸ γράμμα
  choice: записку
  rationale: В контексте речь идёт о ранее составленном кратком письменном высказывании. «Записка» здесь точнее и естественнее, чем «письмо», которое могло бы ошибочно подразумевать послание отсутствующему адресату.
- source_word: ἔδωκαν αὐτῷ
  choice: подали её ему
  rationale: «Подали» естественно описывает передачу записки царю и не добавляет к тексту существенных деталей.
- source_word: ἀνέγνω
  choice: он прочитал её
  rationale: Местоимение «её» восполняет подразумеваемое в греческом дополнение и ясно отсылает к записке.
