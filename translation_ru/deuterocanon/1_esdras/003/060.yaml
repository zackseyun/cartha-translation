  source_fidelity: «Призывает истину» при прямом дополнении формально возможно, но в современном русском легко означает «призывает истину явиться» и потому хуже передаёт контекстное обращение/прославление, которое допускает καλεῖ. «Взывает к истине» естественно выражает этот смысл, не устраняя отмеченную в сноске лексическую широту. «Неправедного» несколько сужает ἄδικον до религиозно-нравственной категории; «несправедливого» ближе к общему значению «несправедливое, неправое».
  naturalness: Исправленный текст сохраняет торжественный параллелизм, но использует более ясные для современного литературного русского сочетания «взывает к истине» и «нет ничего несправедливого». «Все творения содрогаются и трепещут» остаётся естественной контекстуальной передачей πάντα τὰ ἔργα в космической картине.
  terminology: Олицетворение передано женскими местоимениями без догматического переосмысления. В сноске слово «истина» приведено со строчной буквы, в соответствии с основным текстом; это не приписывает образу статус собственного имени. Сноска b точно фиксирует родовую аномалию μετʼ αὐτοῦ.
