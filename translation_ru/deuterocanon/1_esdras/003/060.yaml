base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/060.yaml
  text: All the earth calls on truth[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: ru
  text: Вся земля взывает к истине[a], и небо благословляет её; все творения содрогаются и трепещут, и при ней[b] нет ничего несправедливого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение можно понять как «призывает истину», «взывает к истине» или «провозглашает истину»: речь идёт об обращении к олицетворённой истине или о её прославлении.'
    reason: lexical_alternative
  - marker: b
    text: В дошедшем греческом тексте здесь стоит местоимение мужского или среднего рода — буквально «при нём / при этом», хотя выше истина обозначена местоимением женского рода. Перевод следует смысловой связи с истиной.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: вся земля
  rationale: В сочетании с небом выражение имеет вселенский охват; «земля» сохраняет этот смысл естественнее, чем «страна».
- source_word: τὴν ἀλήθειαν καλεῖ
  choice: призывает истину
  rationale: Прямое дополнение сохранено, а глагол «призывает» допускает обращение к олицетворённой Истине. Возможные оттенки провозглашения и призывания отмечены в сноске.
- source_word: ὁ οὐρανὸς αὐτὴν εὐλογεῖ
  choice: небо благословляет её
  rationale: Женский род русского слова «истина» естественно сохраняет греческое олицетворение и женское местоимение αὐτήν; «благословляет» соответствует библейскому употреблению εὐλογεῖ.
- source_word: πάντα τὰ ἔργα
  choice: все творения
  rationale: В космическом параллелизме с землёй и небом ἔργα, вероятнее всего, обозначает всё сотворённое. «Творения» передаёт это естественно, не превращая выражение в человеческие «дела».
- source_word: σείεται καὶ τρέμει
  choice: содрогаются и трепещут
  rationale: Парные глаголы сохраняют усиление и образ всеобщего трепета; русское множественное число согласовано с «творения».
- source_word: μετʼ αὐτοῦ
  choice: при ней
  rationale: Предлог μετά передан как присутствие или соприсутствие, а местоимение соотнесено по смыслу с олицетворённой Истиной. Несовпадение рода в дошедшем греческом тексте отмечено в сноске.
- source_word: ἄδικον οὐδέν
  choice: нет ничего неправедного
  rationale: «Неправедного» передаёт нравственно-правовой смысл ἄδικον и сохраняет возвышенный, но понятный современный регистр.
theological_decisions:
- issue: Олицетворение истины
  choice: Сохранить женское олицетворение посредством местоимений «её» и «ней»
  alternative: Передать истину как безличное отвлечённое понятие
  rationale: Греческий текст представляет Истину как реальность, к которой обращается земля и которую благословляет небо; русский грамматический род позволяет сохранить этот образ без искусственности.
- issue: Несовпадение рода местоимения в заключительной части
  choice: В основном тексте отнести местоимение к истине по смыслу, а форму источника раскрыть в сноске
  alternative: Буквально передать «при нём» либо молча исправить несогласование
  rationale: Форма αὐτοῦ мужского или среднего рода формально не согласуется с женским ἀλήθεια, однако контекст по-прежнему указывает на Истину. Сноска сохраняет подлинную грамматическую трудность, не делая русский текст бессвязным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм сохранён; устаревшие обороты исключены. Строчная буква в слове «истина» сохраняет его двойную природу — отвлечённое понятие и олицетворённый образ — без навязывания дополнительной онтологической трактовки.
