  yaml_path: translation/deuterocanon/1_esdras/003/059.yaml
  text: Is not the one who does these things great? And truth is great, and stronger than everything[a][b].
translation:
  language: ru
  text: Разве не велик тот, кто совершает всё это[a]? И истина велика и сильнее всего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот, кто делает всё это». Греческий текст прямо не называет действующее лицо; более широкий контекст может указывать на Бога.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «сильнее всех вещей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет возвышенную, но современную интонацию.
- source_word: μέγας
  choice: велик
  rationale: Прямо передаёт величие и значимость; форма согласована с субстантивированным оборотом «тот, кто».
- source_word: ὃς
  choice: тот, кто
  rationale: Относительное местоимение употреблено субстантивно. Русский оборот естественен и сохраняет единственное личное действующее лицо, не называя его прямо.
- source_word: ταῦτα
  choice: всё это
  rationale: Естественно отсылает к совокупности только что описанных действий, сохраняя указательное значение греческого множественного числа.
- source_word: ποιεῖ
  choice: совершает
  rationale: В контексте действий «совершает» звучит естественно и достойно, точнее по регистру, чем нейтральное «делает».
- source_word: ἡ ἀλήθεια
  choice: истина
  rationale: Передаёт понятие истины или действительности, а не личную верность; в русском артикль не выражается.
- source_word: ἰσχυροτέρα
  choice: сильнее
  rationale: Сохраняет простую сравнительную степень и идею превосходящей силы.
- source_word: παρὰ πάντα
  choice: всего
  rationale: Идиоматично выражает сравнение с совокупностью всего существующего и сохраняет универсальный охват πάντα.
theological_decisions:
- issue: К кому относится «тот, кто совершает всё это»
  choice: Референт оставлен неназванным
  alternative: 'Прямо назвать Бога: «Разве не велик Бог, совершающий всё это?»'
  rationale: Греческий текст содержит субстантивированное относительное местоимение, но прямо не называет Бога. Хотя контекст может указывать на Бога, перевод не устраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной риторикой. Оборот «разве не велик» сохраняет форму риторического вопроса, а «тот, кто» избегает как архаизации, так и внесения в текст прямо не названного Бога.
