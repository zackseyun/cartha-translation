  terminology: '«Истина» является точным и нейтральным соответствием ἀλήθεια в данном контексте. «Велик» и «совершает» соответствуют возвышенному регистру, не будучи архаичными. В сноске a следует устранить неточность: вариант должен сохранять множественность ταῦτα («всё это»), а пояснение должно говорить о неназванном действующем лице, а не неопределённом «лице».'
