  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: ru
  text: 'Третий написал[a]: «Женщины сильнее, но истина побеждает всё».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Женщины одолевают, но превыше всего торжествует истина».'
    reason: 'Лексически допустимый вариант: ὑπερισχύω может означать «одолевать», а ὑπὲρ πάντα — «превыше всего».'
lexical_decisions:
- source_word: ὁ τρίτος
  choice: Третий
  rationale: Артикль с порядковым числительным употреблён субстантивно и обозначает третьего участника; краткая форма естественна по-русски.
- source_word: ἔγραψεν
  choice: написал
  rationale: Аорист γράφω прямо указывает на письменное изложение ответа.
- source_word: Ὑπερισχύουσιν
  choice: сильнее
  rationale: Глагол выражает превосходство в силе. Такой перевод сохраняет отличие от следующего νικᾷ — «побеждает».
- source_word: αἱ γυναῖκες
  choice: женщины
  rationale: Высказывание носит обобщающий характер и касается женщин вообще, а не только жён.
- source_word: ὑπὲρ δὲ πάντα
  choice: но превыше всего
  rationale: Оборот вводит кульминационное противопоставление и утверждает превосходство истины над всем.
- source_word: νικᾷ
  choice: побеждает
  rationale: Активный глагол естественно передаёт смысл «одерживает победу, одолевает» и сохраняет истину как действующий субъект.
- source_word: ἡ ἀλήθεια
  choice: истина
  rationale: В русском отвлечённое существительное естественно употребляется без дополнительных указателей; слово сохраняет универсальный и афористический смысл.
theological_decisions:
- issue: Следует ли понимать ἡ ἀλήθεια как конкретную «эту истину» или как истину вообще
  choice: истина
  alternative: эта истина; правда
  rationale: Контекст представляет универсальное изречение, а не ссылку на отдельное утверждение. «Истина» точно сохраняет отвлечённый и возвышенный смысл.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным афористическим звучанием. Различие между ὑπερισχύουσιν и νικᾷ передано словами «сильнее» и «побеждает».
