  source_fidelity: 'Вторая часть греческого изречения буквально утверждает, что истина побеждает «всё / над всем» (ὑπὲρ πάντα νικᾷ). Формулировка «превыше всего побеждает истина» возможна, но в русском легко понимается как «именно истина побеждает больше всего», а не как её победа над всем. «Истина побеждает всё» точнее и естественнее передаёт связь ὑπὲρ πάντα с νικᾷ. Различие между ὑπερισχύουσιν и νικᾷ сохраняется: «сильнее» и «побеждает».'
  naturalness: '«Третий написал: „Женщины сильнее, но истина побеждает всё“» — современная литературная, краткая и афористичная русская фраза. Порядок слов естественен; торжественность подлинника не утрачена.'
  terminology: «Женщины» верно передаёт обобщённое αἱ γυναῖκες, а «истина» — ἡ ἀλήθεια в универсальном афористическом значении. Не требуется ни конфессионального уточнения, ни замены на «правду».
