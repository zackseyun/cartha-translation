  - severity: low
    issue: Сноска не должна представлять «ὑπὲρ πάντα» только как возможное дополнение к νικᾷ
    rationale: В данном контексте перевод «всё» в основной строке является естественным и точным, а альтернативу можно дать как более буквальное пространственно-сравнительное «превыше всего».
