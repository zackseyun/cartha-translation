  text: and they do not remember[a], when they are drinking, to show affection to friends and brothers[b], and before long they draw swords.
translation:
  language: ru
  text: И, когда они пьют, они забывают[a] проявлять привязанность к друзьям и братьям[b], а вскоре обнажают мечи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он не помнит»; греческий глагол стоит в единственном числе, но в данном обобщающем высказывании рядом употреблены формы множественного числа. Перевод «забывают» естественно передаёт отрицание глагола «помнить» с инфинитивом.'
    reason: lexical_alternative
  - marker: b
    text: Глагол может означать также «ласково относиться» или, в более конкретном смысле, «целовать».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέμνηται
  choice: они не помнят
  rationale: Хотя греческая глагольная форма стоит в единственном числе, окружающие формы множественного числа и обобщающий характер высказывания требуют в естественном русском языке множественного числа; основное значение «помнить» сохранено.
- source_word: ὅταν πίνωσιν
  choice: когда они пьют
  rationale: Сочетание ὅταν с сослагательным наклонением выражает общее, повторяющееся обстоятельство времени; русский оборот передаёт его без излишнего уточнения степени опьянения.
- source_word: φιλάζειν
  choice: проявлять привязанность
  rationale: Глагол обозначает проявление тёплого, дружеского расположения; этот перевод сохраняет широту значения и не сводит его без необходимости к буквальному поцелую.
- source_word: φίλοις καὶ ἀδελφοῖς
  choice: к друзьям и братьям
  rationale: Сохранены обе группы и их риторическое соединение; мужской род соответствует греческой форме и вероятному контексту мужского общения.
- source_word: μετʼ οὐ πολὺ
  choice: вскоре
  rationale: Кратко и естественно передаёт идиому «через непродолжительное время».
- source_word: σπῶνται μαχαίρας
  choice: обнажают мечи
  rationale: Обычный русский эквивалент выражения о вынимании клинкового оружия, ясно передающий внезапный переход к насилию.
