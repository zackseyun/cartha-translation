  text: And he said[a], “Call the young men, and they will declare their words.” And they were called, and they entered.
translation:
  language: ru
  text: 'И сказал он: «Позовите юношей, и они изложат свои слова[a]». Их позвали, и они вошли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изложат свои высказывания»; возможно также: «представят свои доводы». Греческое слово λόγους может означать слова, высказывания, речи или доводы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλέσατε
  choice: Позовите
  rationale: Аористный императив множественного числа от καλέω. «Позовите» естественно передаёт приказ пригласить присутствующих при дворе юношей; повтор того же корня сохранён далее в «позвали».
- source_word: τοὺς νεανίσκους
  choice: юношей
  rationale: νεανίσκος обозначает юношу или молодого мужчину. В данном повествовании речь идёт о молодых мужчинах — участниках состязания.
- source_word: δηλώσουσιν
  choice: изложат
  rationale: Будущее время от δηλόω, «делать ясным, давать знать, объявлять». «Изложат» естественно передаёт публичное представление ими собственных слов, не сводя смысл только к объяснению.
- source_word: τοὺς λόγους αὐτῶν
  choice: свои слова
  rationale: 'λόγοι имеет широкий диапазон значений: слова, высказывания, речи или доводы. Буквальное и достаточно широкое «свои слова» сохраняет неоднозначность греческого выражения.'
- source_word: ἐκλήθησαν
  choice: их позвали
  rationale: Аорист пассива от καλέω. Такая передача сохраняет лексический повтор с «Позовите» и естественно звучит по-русски.
- source_word: εἰσήλθοσαν
  choice: они вошли
  rationale: Форма аориста от εἰσέρχομαι. «Вошли» кратко и точно передаёт движение внутрь помещения.
