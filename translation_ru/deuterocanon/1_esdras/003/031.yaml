  text: He said to strike, and they strike; he said to lay waste, and they lay waste; he said to build, and they build.
translation:
  language: ru
  text: 'Сказал: «Ударить!» — и они ударяют; сказал: «Опустошить!» — и они опустошают; сказал: «Строить!» — и они строят.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπε
  choice: сказал
  rationale: Аорист от λέγω вводит каждое распоряжение. «Сказал» прямо передаёт греческую форму и сохраняет повтор и рубленый ритм, не усиливая её до «приказал».
- source_word: πατάξαι
  choice: ударить
  rationale: Аористный инфинитив обозначает предписанное действие. «Ударить» сохраняет широкое значение насильственного действия и не уточняет отсутствующий в тексте объект.
- source_word: τύπτουσιν
  choice: они ударяют
  rationale: Настоящее время создаёт живую последовательность немедленного исполнения. «Ударяют» поддерживает смысловой параллелизм с «ударить».
- source_word: ἐρημῶσαι
  choice: опустошить
  rationale: Глагол означает сделать пустынным, разорить или опустошить. «Опустошить» естественно для военно-политического контекста и не требует добавления объекта.
- source_word: ἐρημοῦσιν
  choice: они опустошают
  rationale: Настоящее время соответствует инфинитиву ἐρημῶσαι; повтор того же русского корня сохраняет схему «слово — исполнение».
- source_word: οἰκοδομῆσαι
  choice: строить
  rationale: Основное значение — «строить». Перевод «восстанавливать» был бы контекстуально возможен, но внёс бы не выраженный самим греческим глаголом оттенок.
- source_word: οἰκοδομοῦσιν
  choice: они строят
  rationale: Настоящее время и повтор того же корня сохраняют краткость и риторический параллелизм оригинала.
theological_decisions:
- issue: Степень царской власти, подразумеваемая конструкцией εἶπε + инфинитив
  choice: 'Передать буквально: «сказал… и они…»'
  alternative: «приказал… и они исполняют» или «по его слову они…»
  rationale: Действенность слова говорящего раскрывается самим повтором. Более явное указание на приказ и повиновение допустимо как толкование, но выходит за пределы формулировки оригинала.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественно-повествовательный строй. Тире естественно обозначает немедленный переход от распоряжения к исполнению, а точки с запятой сохраняют трёхчастный параллелизм греческого текста.
