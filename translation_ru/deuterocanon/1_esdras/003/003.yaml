lexical_decisions:
- source_word: ἐφάγοσαν καὶ ἐπίοσαν
  choice: ели и пили
  rationale: Простые формы прошедшего времени естественно передают последовательные аористы и не добавляют отсутствующего в греческом оттенка пиршества.
- source_word: ἐμπλησθέντες
  choice: насытившись
  rationale: Деепричастие сохраняет обстоятельственную связь с последующим действием и конкретно обозначает насыщение после еды и питья.
- source_word: ἀνέλυσαν
  choice: разошлись
  rationale: Во множественном числе глагол здесь означает, что собравшиеся после еды покинули собрание; «разошлись» естественно передаёт этот смысл.
- source_word: ἀνέλυσεν εἰς τὸν κοιτῶνα
  choice: удалился в спальню
  rationale: При указании направления тот же глагол описывает уход царя в помещение для сна. «Удалился» сохраняет спокойный повествовательный и царский регистр, а «спальню» ясно передаёт κοιτών.
- source_word: ἐκοιμήθη
  choice: уснул
  rationale: В данном повествовательном ряду глагол естественно означает наступление сна; «уснул» хорошо сочетается с последующим пробуждением.
- source_word: ἔξυπνος ἐγένετο
  choice: затем пробудился
  rationale: Буквально выражение означает «стал бодрствующим». Выбранный вариант естественно передаёт переход к бодрствованию и последовательность событий.
- source_word: ὁ δὲ Δαρεῖος ὁ βασιλεύς
  choice: Царь же Дарий
  rationale: Частица δέ обозначает переход от всей компании к Дарию; постпозитивное «же» передаёт его мягко, без чрезмерного противопоставления.
