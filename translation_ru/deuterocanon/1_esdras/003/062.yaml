lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: истина
  rationale: Передаёт абстрактное понятие, которое в данном изречении олицетворено; определённый артикль не требует обязательного добавления указательного оттенка в русском.
- source_word: μένει
  choice: пребывает
  rationale: Сохраняет значение продолжающегося существования и возвышенный риторический тон; современному читателю слово понятно, хотя и несколько книжно.
- source_word: ἰσχύει
  choice: остаётся сильной
  rationale: Передаёт силу истины и при этом отличает ἰσχύει от последующего κρατεῖ. Добавление «остаётся» делает сочетание с русским прилагательным естественным и связывает его с идеей непрерывности.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Краткое и идиоматичное русское соответствие выражению неограниченной длительности, уместное в возвышенной сентенции.
- source_word: ζῇ
  choice: живёт
  rationale: Прямо сохраняет олицетворение истины.
- source_word: κρατεῖ
  choice: торжествует
  rationale: Передаёт действенное превосходство и победу истины, не смешивая этот глагол с более статическим ἰσχύει.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: во веки веков
  rationale: Устоявшееся и понятное русское выражение передаёт усиленную формулу продолжительности, буквально построенную как «в век века».
theological_decisions:
- issue: Олицетворение истины
  choice: 'Сохранены личностно окрашенные сказуемые: истина пребывает, живёт и торжествует.'
  alternative: 'Передать отвлечённо: «истина вечна и обладает непреходящей силой».'
  rationale: Греческий текст риторически нанизывает личные формы глаголов при ἡ ἀλήθεια. Сохранение олицетворения передаёт силу исходного текста, не уточняя его богословский смысл сверх сказанного.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной, афористической интонацией. Повтор союзов сохраняет риторику греческой фразы; «вовеки» и «во веки веков» различают две исходные формулы длительности.
