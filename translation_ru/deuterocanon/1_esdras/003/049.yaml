  text: And many lost their senses because of women[a], and became servants because of them;
translation:
  language: ru
  text: И многие из-за женщин утратили здравый рассудок[a] и стали из-за них рабами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сбились в собственных помыслах». Греческое выражение несколько идиоматично и сочетает глагол со значением утраты разумного суждения со словами «в собственных мыслях».'
