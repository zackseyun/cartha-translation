lexical_decisions:
- source_word: ἀπενοήθησαν ταῖς ἰδίαις διανοίαις
  choice: утратили здравый рассудок
  rationale: Греческое идиоматическое сочетание выражает утрату разумного суждения; перевод передаёт смысл естественно по-русски, не усиливая его до буквального безумия.
- source_word: διὰ τὰς γυναῖκας
  choice: из-за женщин
  rationale: διά с винительным здесь обозначает причину; «из-за» ясно и естественно передаёт причинное значение.
- source_word: δοῦλοι
  choice: рабами
  rationale: Слово обозначает несвободное, подчинённое положение; «рабами» сохраняет силу греческого выражения и не смягчает его до «слуг».
- source_word: ἐγένοντο
  choice: стали
  rationale: Передаёт наступление нового состояния кратко и естественно.
- source_word: διʼ αὐτάς
  choice: из-за них
  rationale: Местоимение отсылает к женщинам; повтор причинной конструкции оригинала сохранён.
theological_decisions:
- issue: Передача δοῦλοι
  choice: рабами
  alternative: слугами
  rationale: Контекст подчёркивает подчинение, поэтому более сильное «рабами» точнее сохраняет смысл δοῦλοι.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и ритмичная. Причинный повтор «из-за женщин… из-за них» сохранён вслед за греческим текстом.
