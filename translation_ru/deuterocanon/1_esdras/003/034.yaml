  text: But they stand guard around him, and each one cannot go away and do his work, nor do they disobey him.
translation:
  language: ru
  text: Они же стоят вокруг него на страже, и никто из них не может уйти и заняться своим делом; они не ослушиваются его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηροῦσιν
  choice: стоят … на страже
  rationale: Глагол τηρέω здесь, в контексте окружающих царя телохранителей, означает охранять или нести стражу; выражение естественно передаёт продолжительное действие.
- source_word: κύκλῳ περὶ αὐτόν
  choice: вокруг него
  rationale: Оба греческих элемента усиливают пространственное значение окружения; по-русски достаточно естественного «вокруг него» без тяжеловесного дублирования.
- source_word: οὐ δύνανται ἕκαστος
  choice: никто из них не может
  rationale: Греческое сочетание с ἕκαστος буквально указывает на каждого по отдельности; отрицательное русское «никто из них» ясно и естественно сохраняет общий смысл.
- source_word: ποιεῖν τὰ ἔργα αὐτοῦ
  choice: заняться своим делом
  rationale: Передаёт идиоматический смысл «делать свои дела/работу» и сохраняет отнесение αὐτοῦ к каждому стражнику.
- source_word: οὐδὲ παρακούουσιν αὐτοῦ
  choice: они ему не прекословят
  rationale: παρακούω с родительным может означать не слушаться, игнорировать распоряжение; «не прекословят» в данном контексте подчёркивает подчинение приказам, не вводя специальной богословской окраски.
