lexical_decisions:
- source_word: Ὦ ἄνδρες
  choice: Мужи!
  rationale: Звательная форма передана кратким прямым обращением. «Мужи» сохраняет мужской род исходного текста и звучит торжественно, но понятно в контексте речи.
- source_word: οὐχ ὑπερισχύουσιν οἱ ἄνθρωποι
  choice: Разве не люди одерживают верх
  rationale: Частица οὐχ в вопросе предполагает утвердительный ответ. Выражение «одерживают верх» естественно передаёт значение превосходящей силы или преобладания, не сводя его только к физическому насилию; ἄνθρωποι здесь обозначает людей вообще.
- source_word: κατακρατοῦντες
  choice: властвуя над
  rationale: Причастие описывает проявление или основание человеческого превосходства. «Властвуя над» передаёт активное господство и сохраняет причастную связь, не превращая её однозначно в причинное придаточное.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: землёй и морем
  rationale: В паре с морем γῆ обозначает земную сушу или землю как область мира; традиционная пара «земля и море» сохраняет широкий охват исходного выражения.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: всем, что в них
  rationale: Формулировка кратко и естественно сохраняет всеохватность πάντα и соотносит местоимение одновременно с землёй и морем.
