base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/057.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun, because it turns in the circuit of heaven.
translation:
  language: ru
  text: Мужи, разве женщины не сильны? Велика земля, высоко небо, и стремительно движется солнце по своему пути, потому что оно обращается по небесному кругу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо оно вращается по небесному кругу».'
    reason: 'Лексически возможная передача ὅτι στρέφεται: «ибо» вместо «потому что» и «вращается» вместо «обращается».'
lexical_decisions:
- source_word: Ἄνδρες
  choice: Мужи
  rationale: Форма обращения во множественном числе сохраняет прямое обращение к мужчинам и возвышенную риторическую окраску; современное «мужчины» здесь звучало бы менее естественно.
- source_word: οὐκ ἰσχυραὶ αἱ γυναῖκες
  choice: разве женщины не сильны?
  rationale: Оборот передан как риторический вопрос, подразумеваемый контекстом. «Сильны» сохраняет основное значение ἰσχυραί без сужения до физической силы или власти.
- source_word: μεγάλη ἡ γῆ
  choice: Велика земля
  rationale: Порядок слов с предикатом перед подлежащим сохраняет риторическую выразительность и параллелизм греческого текста.
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: высоко небо
  rationale: В современном русском краткая предикативная форма «высоко» естественно описывает высоту неба и поддерживает исходный порядок слов.
- source_word: ταχὺς τῷ δρόμῳ ὁ ἥλιος
  choice: быстро в своём беге солнце
  rationale: δρόμος обозначает бег или путь движения; «в своём беге» сохраняет образ движения, а начальная позиция сказуемого поддерживает параллелизм.
- source_word: ὅτι στρέφεται
  choice: потому что оно обращается
  rationale: ὅτι передаёт причинную связь. «Обращается» сохраняет значение кругового движения στρέφεται и не навязывает современную астрономическую модель.
- source_word: ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: по кругу неба
  rationale: κύκλος может означать круг или круговой путь; выражение «по кругу неба» передаёт пространственный образ исходного текста без излишнего уточнения древней космологии.
