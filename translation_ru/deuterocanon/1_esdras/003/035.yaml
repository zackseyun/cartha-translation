lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: О мужи
  rationale: Сохраняет прямое риторическое обращение и явно мужскую форму греческого ἄνδρες; возвышенная форма уместна в древнем повествовании и понятна современному читателю.
- source_word: πῶς οὐχ
  choice: как же ... не
  rationale: Передаёт риторический вопрос с оттенком очевидности и вызова, не превращая его в простое причинное «почему».
- source_word: ὑπερισχύει
  choice: превосходить всех
  rationale: Глагол означает быть сильнее, брать верх, превосходить. Добавление «всех» естественно выражает подразумеваемое сравнение в контексте спора, не сводя смысл к физическому превосходству.
- source_word: ὁ βασιλεύς
  choice: царю
  rationale: Обычный русский эквивалент существительного βασιλεύς; дательный падеж обусловлен естественной конструкцией «как ... не превосходить».
- source_word: ὅτι
  choice: если
  rationale: В данном риторическом вопросе вводит основание, представленное как очевидное условие; по-русски «если» звучит естественно и сохраняет логическую связь, близкую к «раз его так слушаются».
- source_word: οὕτως ἐπάκουστός ἐστιν
  choice: его так слушаются
  rationale: Передаёт возможные оттенки ἐπάκουστος — «слушают» и «повинуются» — без чрезмерного сужения значения; в отношении царя контекст власти естественно подразумевает послушание.
- source_word: καὶ ἐσίγησεν
  choice: И он умолк
  rationale: Аорист σιγάω обозначает прекращение речи; «умолк» кратко и естественно передаёт завершение выступления.
