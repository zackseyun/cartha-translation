  text: And then the king and the nobles looked at one another, and he began to speak about the truth.
translation:
  language: ru
  text: Тогда царь и вельможи посмотрели друг на друга, и он начал говорить об истине.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγιστᾶνες
  choice: вельможи
  rationale: Слово обозначает высокопоставленных сановников или знатных людей при царском дворе; «вельможи» естественно передаёт придворный и социальный статус, не сужая значение до князей.
- source_word: ἔβλεπον εἰς τὸν ἕτερον
  choice: посмотрели друг на друга
  rationale: При множественном подлежащем выражение имеет взаимное значение. Совершенный вид по-русски естественно передаёт единичный обмен взглядами в последовательном повествовании, хотя греческий имперфект буквально описывает процесс.
- source_word: ἤρξατο λαλεῖν
  choice: начал говорить
  rationale: Обычная начинательная конструкция, естественно и точно обозначающая начало речи.
- source_word: ἀλήθεια
  choice: истине
  rationale: Артикль указывает на истину как определённую тему состязания; сочетание «говорить об истине» сохраняет предмет речи без избыточного пояснения.
