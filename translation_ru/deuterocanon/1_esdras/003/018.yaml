  yaml_path: translation/deuterocanon/1_esdras/003/018.yaml
  text: It makes the mind of the king and of the orphan one[a], and that of the servant and that of the free, and that of the poor and that of the rich;
translation:
  language: ru
  text: Он делает одинаковым образ мыслей царя и сироты, раба и свободного, бедного и богатого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιεῖ
  choice: делает
  rationale: Настоящее время и активное значение греческого глагола переданы прямо и естественно.
- source_word: διάνοιαν μίαν
  choice: одинаковыми мысли
  rationale: Греческое выражение буквально говорит, что склад мысли разных людей становится «одним»; по-русски множественное «одинаковыми мысли» естественно передаёт общий образ мыслей, не добавляя причины или характера этого единства.
- source_word: βασιλέως
  choice: царя
  rationale: Прямое и обычное соответствие греческому обозначению царя.
- source_word: ὀρφανοῦ
  choice: сироты
  rationale: Современное и широкое обозначение человека, лишённого родителей; оно сохраняет контраст социально сильного царя и уязвимого сироты.
- source_word: οἰκέτου
  choice: раба
  rationale: Хотя слово может обозначать домашнего слугу, явное противопоставление ἐλευθέρου указывает прежде всего на несвободный статус.
- source_word: ἐλευθέρου
  choice: свободного
  rationale: Субстантивированное прилагательное естественно передаёт человека свободного состояния в противоположность рабу.
- source_word: πένητος
  choice: бедного
  rationale: Передаёт социально-экономическое положение и образует естественную пару с «богатого».
- source_word: πλουσίου
  choice: богатого
  rationale: Прямое соответствие греческому слову и естественная противоположность «бедного».
theological_decisions:
- issue: Передача οἰκέτου в противопоставлении свободному
  choice: раб
  alternative: слуга; домашний слуга
  rationale: В сочетании с ἐλεύθερος решающим является различие между несвободным и свободным состоянием. «Раб» сохраняет эту социальную остроту, не смягчая исходный текст.
- issue: Смысл διάνοιαν μίαν
  choice: делает одинаковыми мысли
  alternative: объединяет разум; приводит к единомыслию
  rationale: Формулировка сохраняет утверждение о едином состоянии мысли у противопоставленных групп, но не уточняет, идёт ли речь о согласии, одинаковом рассуждении или общей реакции.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Эллиптические повторения греческого текста сведены в ритмический ряд из трёх пар; смысл и социальные контрасты сохранены.
