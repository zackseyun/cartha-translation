lexical_decisions:
- source_word: ὁ εἷς
  choice: Один
  rationale: Оборот буквально означает «один» и в контексте указывает на одного из участников; добавлять существительное нет необходимости.
- source_word: ἔγραψεν
  choice: написал
  rationale: Аорист передаёт завершённое действие в повествовательной последовательности; естественный русский эквивалент — прошедшее время «написал».
- source_word: Ὑπερισχύει
  choice: сильнее
  rationale: Глагол означает «быть сильнее, превосходить, одолевать». Сравнительное «сильнее» сохраняет форму утверждения, не превращая её без необходимости в явно превосходную степень.
- source_word: ὁ οἶνος
  choice: вино
  rationale: Артикль имеет обобщающее значение; по-русски название категории естественно передаётся без дополнительных определителей.
