  yaml_path: translation/deuterocanon/1_esdras/003/030.yaml
  text: And he alone[a], if he says to kill, they kill; if he says to release, they release.
translation:
  language: ru
  text: И хотя он всего один[a], если он велит убить — убивают; если велит отпустить — отпускают.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «и он, если он один»; эту фразу можно также понять как «и он один».'
    reason: Сохранение синтаксической неоднозначности греческого выражения εἰ μόνος ἐστίν.
  - marker: b
    text: 'Или: «освободить — освобождают»; греческий глагол может также означать «отпустить» или «простить» — в зависимости от контекста.'
    reason: Лексическая многозначность глагола ἀφίημι.
lexical_decisions:
- source_word: καὶ αὐτὸς εἰ μόνος ἐστίν
  choice: И хотя он всего один
  rationale: Греческое выражение буквально условно («если он один»), но в контексте противопоставляет единоличную фигуру царя множеству повинующихся ему людей. Уступительная передача естественна по-русски; буквальная неоднозначность сохранена в сноске.
- source_word: ἐὰν εἴπῃ ἀποκτεῖναι
  choice: если он велит убить
  rationale: 'Буквально: «если скажет убить». В контексте царского распоряжения «велит» ясно передаёт силу сказанного, не добавляя судебного оттенка выражения «предать смерти».'
- source_word: ἀποκτέννουσιν
  choice: убивают
  rationale: Прямой глагол настоящего времени сохраняет краткость и категоричность греческой фразы.
- source_word: ἀφεῖναι, ἀφίουσιν
  choice: отпустить — отпускают
  rationale: Глагол допускает значения освобождения, отпускания и прощения. «Отпустить» сохраняет широту значения и параллелизм исходного текста.
