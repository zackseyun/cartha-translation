- source_word: καλὴν τῷ εἴδει καὶ τῷ κάλλει
  choice: прекрасную видом и красотой
  rationale: Сохраняет намеренно усиленную и частично повторную греческую характеристику внешней привлекательности, не сводя её к одному прилагательному.
