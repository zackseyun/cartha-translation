base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/064.yaml
  text: and in her judgment there is nothing unjust[a]. And this is the strength and the kingdom and the authority and the majesty of all the ages[b]. Blessed is the God of truth.
translation:
  language: ru
  text: И в её суде нет ничего несправедливого[a]. И она — сила, царство, власть и величие всех веков[b]. Благословен Бог истины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть в суде олицетворённой Истины; возможно также: «в её решении».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всех веков»; по смыслу возможно: «во веки веков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  choice: суд
  rationale: «Суд» сохраняет юридический смысл — действие или мерило суждения, приписываемое Истине, — и согласуется с последующим «несправедливого».
- source_word: αὐτῆς
  choice: её
  rationale: Местоимение относится к ἀλήθεια («истина»), существительному женского рода; «её» сохраняет развёрнутый в контексте образ олицетворённой Истины.
- source_word: ἄδικον
  choice: несправедливого
  rationale: Слово обозначает нечто неправое или несправедливое; выбранный вариант естественно передаёт судебный оттенок в сочетании со словом κρίσις.
- source_word: ἰσχύς
  choice: сила
  rationale: Прямое и естественное соответствие, передающее мощь без смешения с законной властью, обозначенной далее словом ἐξουσία.
- source_word: βασίλειον
  choice: царство
  rationale: В возвышенном перечислении слово обозначает царское владычество или царство; «царство» сохраняет предметный образ и близость к греческой формулировке.
- source_word: ἐξουσία
  choice: власть
  rationale: «Власть» выражает право и полномочие властвовать, а не только физическую силу.
- source_word: μεγαλειότης
  choice: величие
  rationale: «Величие» естественно для русского славословного регистра и передаёт возвышенность и величавость исходного слова.
- source_word: αὕτη
  choice: она
  rationale: Форма женского рода указывает на Истину; личное местоимение сохраняет её олицетворение и позволяет ясно передать именное предложение.
- source_word: τῶν πάντων αἰώνων
  choice: всех веков
  rationale: Буквальная формулировка сохраняет образ последовательных веков; более идиоматическое значение вечности отмечено в сноске.
- source_word: εὐλογητός
  choice: Благословен
  rationale: Так естественно передаётся греческая формула благословения в возвышенной, но понятной современной русской речи.
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: Бог истины
  rationale: Сохранена родительная конструкция оригинала; перевод «истинный Бог» изменил бы синтаксис и сузил возможный смысл.
theological_decisions:
- issue: Олицетворение Истины посредством форм женского рода
  choice: 'Сохранить олицетворение: «в её суде» и «она»'
  alternative: 'Передать безлично: «в суде истины» и «в этом»'
  rationale: Греческие αὐτῆς и αὕτη имеют женский род и продолжают литературный образ Истины как действующего лица. Русский язык позволяет сохранить этот образ естественно, не вводя дополнительного учения.
- issue: Значение αἰώνων в славословной формуле
  choice: 'Передать буквально: «всех веков»'
  alternative: «Во веки веков» или «навеки»
  rationale: Буквальный вариант сохраняет множественное число и образ веков в оригинале; идиоматическое временное понимание указано в сноске, чтобы не устранять смысловую широту.
- issue: Отношение Истины к силе, царству, власти и величию
  choice: 'Сохранить прямое именное отождествление: «она — сила, царство, власть и величие»'
  alternative: «Ей принадлежат сила, царство, власть и величие»
  rationale: Добавление идеи принадлежности сделало бы выражение более гладким, но изменило бы смелую конструкцию αὕτη ἡ ἰσχύς…; прямой вариант лучше сохраняет поэтическое и богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным славословным звучанием. Краткие параллельные конструкции оригинала сохранены; архаизмы не вводятся, кроме общеупотребительной библейской формулы «Благословен Бог истины».
