  yaml_path: translation/deuterocanon/1_esdras/003/063.yaml
  text: and with her there is no partiality or distinction, but she does what is righteous apart from all that is unjust and evil; and all approve of her works,
translation:
  language: ru
  text: У неё нет ни лицеприятия[a], ни различий, но она поступает праведно, оставаясь в стороне от всего неправедного и злого[b]; и все одобряют её дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «принимать лица» — греческий оборот со значением «проявлять лицеприятие, оказывать предпочтение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «держась в стороне от всех неправедных и злых». Греческие слова могут относиться как ко всему неправедному и злому, так и к неправедным и злым людям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρʼ αὐτῇ
  choice: для неё
  rationale: Передаёт то, что свойственно олицетворённой героине и действует в её отношении; по-русски естественнее, чем пространственное «при ней».
- source_word: λαμβάνειν πρόσωπα
  choice: лицеприятие
  rationale: Устойчивый греческий оборот буквально означает «принимать лица», то есть оказывать предпочтение одним перед другими.
- source_word: διαφορά
  choice: различия
  rationale: Сохраняет параллель с отрицанием лицеприятия и не сужает значение до более конкретного «пристрастия».
- source_word: τὰ δίκαια ποιεῖ
  choice: поступает праведно
  rationale: Естественно передаёт сочетание «делает праведное», сохраняя нравственный смысл субстантивированного прилагательного.
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: оставаясь в стороне от всего неправедного и злого
  rationale: Передаёт значение отделения у ἀπό и сохраняет возможность понимать определения как относящиеся к делам или явлениям, не превращая их без основания в обозначение людей.
- source_word: εὐδοκοῦσι τοῖς ἔργοις αὐτῆς
  choice: одобряют её дела
  rationale: εὐδοκέω здесь выражает положительную оценку, а ἔργα — совершаемые ею дела.
theological_decisions:
- issue: Женский род олицетворённого субъекта
  choice: Сохранить местоимение женского рода «она/неё/её» без добавления имени субъекта.
  alternative: Повторить подразумеваемое из контекста существительное или заменить олицетворение безличной конструкцией.
  rationale: Греческие формы женского рода продолжают данное в контексте олицетворение; явное называние субъекта в самом стихе внесло бы отсутствующее в нём уточнение.
- issue: Референт τῶν ἀδίκων καὶ πονηρῶν
  choice: 'Передать неперсонально: «всего неправедного и злого».'
  alternative: 'Перевести лично: «всех неправедных и злых людей».'
  rationale: Формы допускают как предметно-абстрактное, так и личное понимание. Неперсональная формулировка лучше согласуется с противопоставлением праведных и неправедных поступков, а альтернативу отмечает сноска.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; женское олицетворение и неоднозначность заключительной группы с ἀπό сохранены.
