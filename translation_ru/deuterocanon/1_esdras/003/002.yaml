translation:
  language: ru
  text: и всем сатрапам, военачальникам и правителям областей, подвластным ему, от Индии до Эфиопии, в ста двадцати семи сатрапиях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всем ста двадцати семи провинциям». В греческом тексте употреблён персидский административный термин, здесь переведённый как «сатрапии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σατράπαις
  choice: сатрапам
  rationale: Персидский административный титул; традиционное русское заимствование точно передаёт особую имперскую должность.
- source_word: στρατηγοῖς
  choice: военачальникам
  rationale: В данном перечне должностей слово естественно обозначает военных начальников; вариант понятен современному читателю и не сужает значение до конкретного звания.
- source_word: τοπάρχαις
  choice: правителям областей
  rationale: Термин обозначает правителей местных территориальных единиц; описательный перевод яснее малознакомого «топархам» и отличает их от сатрапов.
- source_word: τοῖς ὑπʼ αὐτὸν
  choice: подвластным ему
  rationale: Передаёт административную подчинённость царю и естественно согласуется со всем перечислением.
- source_word: ἀπὸ τῆς Ἰνδικῆς μέχρι Αἰθιοπίας
  choice: от Индии до Эфиопии
  rationale: Естественная русская формула географического охвата, точно сохраняющая исходные пределы.
- source_word: ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις
  choice: в ста двадцати семи сатрапиях
  rationale: Сохраняет персидскую административную окраску и лексическую связь с «сатрапами»; возможное понимание как охвата всей территории отмечено в сноске.
