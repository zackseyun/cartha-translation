lexical_decisions:
- source_word: ἐθεώρουν
  choice: Я видел
  rationale: Форма может быть понята как 1-е лицо единственного числа или 3-е лицо множественного числа имперфекта; контекст прямой речи поддерживает чтение в 1-м лице. В русском повествовании простой вид «видел» звучит естественно, не устраняя полностью длительный характер наблюдения.
- source_word: αὐτόν
  choice: его
  rationale: Прямое местоименное дополнение сохранено без уточнения референта, поскольку сам греческий текст в пределах стиха его не называет.
- source_word: Ἀπάμην
  choice: Апаму
  rationale: Это винительный падеж имени Ἀπάμη; русская форма «Апама» с винительным «Апаму» соответствует распространённой передаче данного древнего имени.
- source_word: θυγατέρα
  choice: дочь
  rationale: Прямой и естественный эквивалент термина родства.
- source_word: Βαρτάκου
  choice: Вартака
  rationale: Имя передано транслитерацией с учётом традиционной русской передачи греческой β как «в» в библейских именах.
- source_word: τοῦ θαυμαστοῦ
  choice: достославного
  rationale: Слово обозначает человека замечательного, вызывающего восхищение или почитаемого. «Достославный» сохраняет характер эпитета и dignified register, не превращая его однозначно в официальный титул.
- source_word: παλλακὴν
  choice: наложницу
  rationale: Термин обозначает именно наложницу, а не просто возлюбленную или служанку.
- source_word: καθημένην
  choice: сидевшую
  rationale: Причастие женского рода относится к Апаме и описывает её положение.
- source_word: ἐν δεξιᾷ τοῦ βασιλέως
  choice: справа от царя
  rationale: Естественная современная русская передача пространственного выражения; она также допускает подразумеваемое почётное положение при царе.
