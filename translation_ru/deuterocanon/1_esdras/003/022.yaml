  text: And when they rise from the wine[a], they do not remember what they did.
translation:
  language: ru
  text: И когда они поднимаются после вина[a], то не помнят, что сделали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «поднимаются от вина». Речь идёт о том, что они встают после пребывания под воздействием вина; выражение не обязательно означает, что они уже протрезвели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: Вводит обобщённое придаточное времени; русское «когда» естественно передаёт смысл, не утяжеляя фразу вариантом «всякий раз, когда».
- source_word: ἀπὸ τοῦ οἴνου
  choice: после вина
  rationale: Буквально сочетание означает «от вина». По-русски «после вина» сохраняет конкретный образ и указывает на состояние под воздействием вина, не превращая его однозначно в «опьянение» или «отрезвление».
- source_word: ἐγερθῶσιν
  choice: поднимаются
  rationale: Форма ἐγείρω означает «подняться, встать». Выбор сохраняет исходный глагольный образ; перевод «трезвеют» был бы чрезмерным истолкованием.
- source_word: οὐ μέμνηται
  choice: не помнят
  rationale: Хотя в издании Суита глагольная форма стоит в единственном числе, по смыслу она относится к множественному субъекту; русское множественное число естественно передаёт согласование по смыслу.
- source_word: ἃ ἔπραξαν
  choice: что делали
  rationale: Краткая и естественная передача относительного оборота; несовершенный вид по-русски уместно обозначает поступки, совершавшиеся под воздействием вина, без добавления отсутствующего в греческом результата.
