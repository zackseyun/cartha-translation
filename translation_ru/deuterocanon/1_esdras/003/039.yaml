  text: и от них они произошли[a], и эти женщины вскормили тех самых мужчин, которые насадили виноградники, откуда берётся вино[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они родились от них». Буквально греческий текст говорит: «они произошли от них».'
