lexical_decisions:
- source_word: ἐξ αὐτῶν
  choice: от них
  rationale: Предлог ἐξ с родительным падежом обозначает источник или происхождение; в контексте речь идёт о происхождении мужчин от женщин.
- source_word: ἐγένοντο
  choice: они произошли
  rationale: Передаёт происхождение и сохраняет более широкое значение γίνομαι, не сводя его исключительно к биологическому рождению.
- source_word: αὗται
  choice: эти женщины
  rationale: Форма указательного местоимения женского рода прямо отсылает к женщинам; существительное добавлено для ясности и сохранения риторического акцента.
- source_word: ἐξέθρεψαν
  choice: вскормили
  rationale: Глагол включает кормление и взращивание; «вскормили» естественно передаёт оба оттенка в данном контексте.
- source_word: αὐτοὺς τοὺς φυτεύσαντας
  choice: тех самых мужчин, которые насадили
  rationale: Сочетание местоимения с субстантивированным причастием имеет выделительную силу; «тех самых» воспроизводит этот акцент.
- source_word: τοὺς ἀμπελῶνας
  choice: виноградники
  rationale: Обычное и точное соответствие греческому ἀμπελῶνας.
- source_word: ἐξ ὧν ὁ οἶνος γίνεται
  choice: откуда берётся вино
  rationale: Естественная современная формулировка, сохраняющая широкое значение происхождения или получения вина и не уточняющая технологический процесс сверх греческого текста.
theological_decisions:
- issue: Референт и риторическая сила указательного местоимения женского рода αὗται
  choice: В основном тексте прямо указать «эти женщины».
  alternative: Передать только местоимением «эти» или «они».
  rationale: Контекст речи посвящён силе и первенству женщин. Явное указание референта сохраняет логику довода и грамматически выраженный женский род.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Произошли» сохраняет неоднозначность ἐγένοντο, а «вскормили» передаёт как питание, так и взращивание. Пунктуация и конечная запятая отражают незавершённость предложения в предоставленном фрагменте.
