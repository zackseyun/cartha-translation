lexical_decisions:
- source_word: λαμβάνει
  choice: берёт
  rationale: Обычное повествовательное значение глагола; «получает» здесь не соответствует контексту, а «хватает» добавляло бы излишнюю экспрессию.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Сохраняет обобщённый характер греческого существительного в риторическом рассуждении; контекст описывает отдельного представителя людей.
- source_word: ῥομφαίαν
  choice: меч
  rationale: Естественное общее обозначение оружия; более узкое «большой меч» неоправданно конкретизировало бы разновидность клинка.
- source_word: ἐκπορεύεται
  choice: выходит
  rationale: Передаёт буквальное движение наружу и сохраняет отличие от следующего ἐξοδεύειν.
- source_word: ἐξοδεύειν
  choice: идти в поход
  rationale: Передаёт значение выступления или отправления в военный поход, не усиливая его до однозначного «воевать».
- source_word: λῃστεύειν
  choice: грабить
  rationale: Обозначает открытое или насильственное завладение чужим и естественно подходит к контексту похода.
- source_word: κλέπτειν
  choice: красть
  rationale: Стандартное значение глагола, сохраняющее смысловое отличие от «грабить».
- source_word: εἰς τὴν θάλασσαν πλεῖν καὶ ποταμούς
  choice: плавать по морю и рекам
  rationale: Идиоматично передаёт плавание по морю и рекам; буквальное направление «в море» в русском здесь звучало бы менее естественно и не охватывало бы параллельное «рекам».
