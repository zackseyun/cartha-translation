lexical_decisions:
- source_word: ἤρξατο λαλεῖν
  choice: начал говорить
  rationale: Естественно передаёт начало публичного выступления; аорист обозначает очередное событие повествования.
- source_word: ὁ δεύτερος
  choice: второй
  rationale: Определённый артикль с порядковым числительным указывает на второго участника состязания; добавлять «человек» не требуется.
- source_word: ὁ εἴπας
  choice: тот, кто говорил
  rationale: Субстантивированное причастие отсылает к уже высказанному этим участником утверждению. Такая формулировка естественна по-русски и сохраняет связь с предыдущим выступлением.
- source_word: περὶ
  choice: о
  rationale: Предлог с родительным падежом обозначает тему речи; русское «о» кратко и естественно.
- source_word: ἰσχύος
  choice: силе
  rationale: ἰσχύς обозначает силу или могущество. «Сила» — прямой и контекстуально уместный эквивалент, не расширяющий значение до более общего понятия власти.
- source_word: τοῦ βασιλέως
  choice: царя
  rationale: В придворном контексте βασιλεύς прямо означает царя.
