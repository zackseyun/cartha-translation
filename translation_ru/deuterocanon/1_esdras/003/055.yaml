lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: О мужи
  rationale: Сохраняет прямое торжественное обращение к собравшимся мужчинам; «мужи» уместно в достоинственном повествовательном регистре.
- source_word: πῶς οὐκ ἰσχυραὶ αἱ γυναῖκες
  choice: разве женщины не сильны
  rationale: Передаёт риторический вопрос, подразумевающий утвердительный ответ, без устранения его вопросительной формы.
- source_word: ὅτι οὕτως πράσσουσιν
  choice: если они делают такое
  rationale: В данном риторическом контексте ὅτι указывает на основание вывода; русское условное построение естественно передаёт смысл «как же им не быть сильными при том, что они такое делают».
