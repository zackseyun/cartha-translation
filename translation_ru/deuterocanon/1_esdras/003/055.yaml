  source_fidelity: Греч. πῶς οὐκ образует риторический вопрос «как же не…?», а ὅτι вводит основание утверждения («поскольку / раз»), не условие. πράσσουσιν с οὕτως точнее передаётся как «так поступают».
  naturalness: «О мужи» стилистически архаично для современного литературного русского; «Мужи» сохраняет возвышенное публичное обращение и звучит естественнее в краткой реплике.
  terminology: «Женщины» и «сильны» точно передают αἱ γυναῖκες и ἰσχυραί. Специальной богословской терминологии и имён нет.
  issues:
  - severity: medium
    issue: Союз «если» передаёт ὅτι как условие.
    rationale: В данном предложении ὅτι имеет причинно-обосновывающее значение, как в английском аудите «since»; условность в русском меняет логическую связь.
  - severity: low
    issue: «Делают такое» менее точно отражает οὕτως πράσσουσιν.
    rationale: Наречие οὕτως означает «так, таким образом», поэтому «так поступают» ближе к греческой формулировке.
  - severity: low
    issue: «О мужи» избыточно архаизирует обращение.
    rationale: В современном литературном переводе достаточно «Мужи», сохраняющего торжественный регистр оригинала.
