  text: He said[a], ‘Cut it down,’ and they cut it down; he said, ‘Plant it,’ and they plant it.
translation:
  language: ru
  text: 'Он сказал[a]: «Срубить», — и они срубают; сказал: «Посадить», — и они сажают.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте в обоих распоряжениях и при их исполнении объект прямо не назван.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: сказал
  rationale: Аорист λέγω вводит содержание каждого распоряжения. «Сказал» сохраняет простоту и краткий повтор греческого текста, не усиливая значение до «приказал».
- source_word: ἐκκόψαι
  choice: срубить
  rationale: Аористный инфинитив ἐκκόπτω после εἶπεν передаёт содержание распоряжения. «Срубить» естественно обозначает отсечение дерева или насаждения и не добавляет отсутствующий в греческом объект.
- source_word: ἐκκόπτουσιν
  choice: они срубают
  rationale: Настоящее время множественного числа показывает исполнение распоряжения и сохраняет временную форму оригинала; объект, как и в греческом, оставлен невыраженным.
- source_word: φυτεῦσαι
  choice: посадить
  rationale: Аористный инфинитив φυτεύω параллелен ἐκκόψαι и выражает содержание второго распоряжения; в русском инфинитив естественно звучит как краткий приказ.
- source_word: φυτεύουσιν
  choice: они сажают
  rationale: Настоящее время множественного числа воспроизводит параллелизм с ἐκκόπτουσιν и сохраняет невыраженный объект.
