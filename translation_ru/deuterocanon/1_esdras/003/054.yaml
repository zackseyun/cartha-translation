base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/054.yaml
  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she becomes angry with him, he flatters her so that she may be reconciled to him.
translation:
  language: ru
  text: Кроме того, царь, разинув рот, смотрел на неё; и если она смеётся над ним[a], он смеётся; если же она сердится на него, он льстит ей, чтобы она с ним примирилась.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смеётся вместе с ним». Греческий дательный падеж после глагола «смеяться» допускает разные понимания характера этого отношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τούτοις
  choice: Кроме того
  rationale: Естественно передаёт добавочный, накопительный характер связки в рассуждении.
- source_word: χάσκων τὸ στόμα
  choice: разинув рот
  rationale: Сохраняет яркий телесный образ греческого выражения и звучит естественно по-русски.
- source_word: ἐθεώρει αὐτήν
  choice: смотрел на неё
  rationale: Передаёт продолжительное созерцание без внесения дополнительной оценки, которая могла бы появиться в варианте «не сводил с неё глаз».
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  choice: если она смеётся над ним, он смеётся
  rationale: Сохраняет повтор глагола γελάω и основное возможное понимание дательного αὐτῷ; его неоднозначность отмечена в сноске.
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: сердится на него
  rationale: Ясно и современно выражает возникновение недовольства или гнева по отношению к царю.
- source_word: κολακεύει αὐτήν
  choice: льстит ей
  rationale: Прямо передаёт попытку вернуть расположение посредством лести.
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: чтобы она с ним примирилась
  rationale: Сохраняет целевое значение ὅπως и взаимно-отношенческий смысл восстановления согласия.
