  text: And leaving all these things behind[a], they gape at her; with mouths hanging open they stare at her, and all choose her rather than gold and silver and every beautiful thing.
translation:
  language: ru
  text: И, оставив всё это, они разинули рты, глядя на неё, и с разинутыми ртами смотрят на неё; и все предпочитают её золоту, серебру и всякой прекрасной вещи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: оставив
  rationale: Аористное причастие ἀφίημι здесь означает оставить или отложить в сторону; русское деепричастие сохраняет связь с последующими действиями.
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Форма среднего рода множественного числа отсылает ко всему ранее названному; в современном русском естественно собирательное «всё это».
- source_word: εἰς αὐτὴν κέχηναν
  choice: они стоят перед ней разинув рот
  rationale: Глагол передаёт состояние изумлённого, заворожённого созерцания с разинутым ртом; «перед ней» естественно передаёт направленность εἰς αὐτήν.
- source_word: χάσκοντες τὸ στόμα
  choice: смотрят на неё с открытым ртом
  rationale: Сохраняется намеренно усиленный и повторный телесный образ греческого текста, хотя по-русски он звучит несколько необычно.
- source_word: θεωροῦσιν
  choice: смотрят на неё
  rationale: θεωρέω означает внимательно видеть или созерцать; «смотрят» не добавляет чрезмерно сильного оттенка, сохраняя его за контекстом.
- source_word: αἱρετίζουσιν μᾶλλον ἢ
  choice: предпочитают её ...
  rationale: В сравнительной конструкции глагол выражает выбор в пользу одного вместо другого; «предпочитают» естественно и точно передаёт совокупный смысл.
- source_word: πᾶν πρᾶγμα ὡραῖον
  choice: всякой прекрасной вещи
  rationale: Буквальное широкое выражение сохраняет неопределённость πρᾶγμα и значение красоты или привлекательности у ὡραῖον, не сужая его до имущества.
