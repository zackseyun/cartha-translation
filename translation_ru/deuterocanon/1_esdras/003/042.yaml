  source_fidelity: Черновик верно передаёт основную последовательность действий и сравнительное предпочтение женщины золоту, серебру и всякой прекрасной вещи. Однако «стоят перед ней» добавляет отсутствующее в греческом представление о стоянии и не передаёт κέχηναν — «разинули рты / стоят с разинутыми ртами».
  naturalness: Сочетание «стоят перед ней разинув рот» пунктуационно и стилистически неудачно; кроме того, последующее «смотрят ... с открытым ртом» делает повтор тяжеловесным без точной передачи двух греческих выражений. В исправлении повтор сохранён намеренно, но оформлен естественнее для современного литературного русского.
  terminology: Терминологических или богословских проблем нет. «Предпочитают её золоту, серебру и всякой прекрасной вещи» точно выражает αἱρετίζουσιν μᾶλλον ἢ.
