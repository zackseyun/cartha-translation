lexical_decisions:
- source_word: ἐκάθισεν
  choice: сел
  rationale: Аорист в повествовательном контексте естественно передаётся совершенным видом «сел»; вариант «занял своё место» добавлял бы не выраженный прямо оттенок.
- source_word: χρηματιστηρίῳ
  choice: в зале совета
  rationale: Слово обозначает официальное помещение для совещаний, административных или судебных разбирательств. «Зал совета» ясно передаёт официальный характер места, не сужая значение до исключительно судебного.
- source_word: ἀνεγνώσθη
  choice: было прочитано
  rationale: Пассивный аорист буквально означает «было прочитано». Публичное чтение подразумевается контекстом, но наречие «вслух» в греческом тексте отсутствует.
- source_word: γράμμα
  choice: письмо
  rationale: В данном повествовательном контексте слово обозначает письменное послание; «письмо» звучит естественно и точно.
- source_word: ἐνώπιον αὐτῶν
  choice: перед ними
  rationale: Прямой и идиоматичный русский эквивалент, сохраняющий лаконичность и официальный тон повествования.
