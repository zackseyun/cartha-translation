  text: And he will be seated second to Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
translation:
  language: ru
  text: И благодаря своей мудрости он займёт второе место после Дария[a] и будет назван родственником Дария[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет посажен вторым после Дария». Греческий глагол может обозначать как усаживание, так и поставление на определённое место по рангу.'
    reason: lexical_alternative
  - marker: b
    text: Слово «родственник» может означать как действительного родственника, так и почётный придворный статус, указывающий на особую близость к царю.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
  choice: вторым после Дария
  rationale: Передаёт положение второго по рангу по отношению к Дарию; выражение естественно для современного русского языка.
- source_word: καθιεῖται
  choice: будет посажен
  rationale: Сохраняет конкретный образ предоставленного места при дворе и одновременно допускает смысл возведения в соответствующий ранг.
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  choice: за свою мудрость
  rationale: διά с винительным выражает причину; русский оборот кратко и естественно передаёт значение «по причине его мудрости».
- source_word: συγγενής
  choice: родственником
  rationale: Сохраняет основное значение родства, не исключая возможного придворного почётного титула.
- source_word: κληθήσεται
  choice: будет назван
  rationale: Прямо передаёт будущее страдательное значение καλέω и естественно сочетается с обозначением статуса.
