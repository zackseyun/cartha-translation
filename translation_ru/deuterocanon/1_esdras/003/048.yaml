  text: And a man loves his own wife more than his father and mother.
translation:
  language: ru
  text: И человек любит свою жену больше, чем отца и мать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλεῖον … μᾶλλον ἢ
  choice: больше, чем
  rationale: Сочетание сравнительных показателей выражает превосходство по степени. Русское «больше, чем» естественно передаёт смысл, не превращая сравнение в исключительный выбор «вместо».
- source_word: ἀγαπᾷ
  choice: любит
  rationale: Прямой и нейтральный русский эквивалент, сохраняющий простой смысл греческого глагола.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Основное значение — человек; контекст с «свою жену» уточняет, что здесь речь идёт о мужчине, поэтому отдельная замена на «мужчина» не обязательна.
- source_word: τὴν ἰδίαν γυναῖκα
  choice: свою жену
  rationale: γυνή в данном семейном сопоставлении означает «жена», а ἰδίαν передаётся естественным русским возвратным притяжательным местоимением «свою».
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: отца и мать
  rationale: Сохраняются оба явно названных члена семьи; принадлежность понятна из контекста и русского синтаксиса, поэтому добавлять «своих» не требуется.
