  yaml_path: translation/deuterocanon/1_esdras/003/040.yaml
  text: And these make the garments of men[a], and these bring glory to men, and men cannot exist apart from women.
translation:
  language: ru
  text: И они изготавливают одежду для мужчин, и они приносят мужчинам славу, и мужчины не могут быть без женщин.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не могут существовать отдельно от женщин». Греческое εἶναι буквально означает «быть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὗται
  choice: они
  rationale: Женский указательный pronoun относится к женщинам из предшествующего контекста. Русское «они» естественно сохраняет повтор и риторическое ударение.
- source_word: ποιοῦσιν τὰς στολάς
  choice: шьют одежду
  rationale: Буквальное «делают одежду» по-русски менее естественно; в данном сочетании «шьют» ясно передаёт изготовление одежды, не сужая στολάς до парадных одеяний.
- source_word: ποιοῦσιν δόξαν
  choice: приносят славу
  rationale: Греческое выражение буквально говорит, что женщины «делают» мужчинам славу. «Приносят славу» сохраняет возвышенность и смысл чести или признания, звуча естественно по-русски.
- source_word: στολάς
  choice: одежду
  rationale: στολή может означать одежду или одеяние; собирательное «одежду» здесь современно и не подразумевает исключительно торжественные одежды.
- source_word: δόξαν
  choice: славу
  rationale: «Слава» сохраняет широкий диапазон δόξα — славу, честь и достоинство — и риторическую силу выражения.
- source_word: οἱ ἄνθρωποι
  choice: мужчины
  rationale: Хотя ἄνθρωποι может означать людей вообще, непосредственное противопоставление женщинам указывает здесь на мужчин.
- source_word: εἶναι χωρὶς τῶν γυναικῶν
  choice: быть без женщин
  rationale: Передаёт буквальное εἶναι и χωρίς, сохраняя возможную широту утверждения, не уточняя его как биологическое существование или общественную жизнь.
theological_decisions:
- issue: Референция οἱ ἄνθρωποι в противопоставлении τῶν γυναικῶν
  choice: мужчины
  alternative: люди
  rationale: Контекст явно сопоставляет ἄνθρωποι с женщинами, поэтому гендерно определённое «мужчины» точнее передаёт ход аргумента.
- issue: Смысл εἶναι в утверждении о зависимости мужчин от женщин
  choice: быть
  alternative: существовать
  rationale: Греческий инфинитив буквально означает «быть» и допускает широкое понимание. Перевод «существовать» мог бы сильнее свести мысль к продолжению человеческого рода; «быть» сохраняет исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением трёхчастного риторического параллелизма. Повтор «и они» намеренно оставлен. «Шьют одежду» выбрано вместо неидиоматичного «делают одежды», а «приносят славу» — вместо буквального «делают славу».
