base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/061.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, all the sons of men are unjust, and all their works are unjust—all such things. And there is no truth in them[b], and in their injustice they will perish.
translation:
  language: ru
  text: Вино несправедливо, царь несправедлив, женщины несправедливы, несправедливы все сыны человеческие, и несправедливы все их дела и всё подобное.[a] Нет в них истины, и в своей несправедливости они погибнут.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «всё это» или «всё такого рода».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из-за своей несправедливости они погибнут». Греческое выражение допускает как обстоятельственный, так и причинный оттенок.'
    reason: ambiguity
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: несправедлив / несправедливы / несправедливо
  rationale: Повтор одного корня сохраняет настойчивую анафору греческого текста и смысловую связь с ἀδικίᾳ («несправедливости») в конце стиха.
- source_word: οἶνος
  choice: вино
  rationale: Прямое соответствие; в рассуждении вино олицетворяется.
- source_word: ὁ βασιλεύς
  choice: царь
  rationale: Определённая форма передана естественным для русского языка обозначением уже названного в контексте царя.
- source_word: αἱ γυναῖκες
  choice: женщины
  rationale: Контекст не ограничивает значение замужними женщинами, поэтому «жёны» было бы излишним уточнением.
- source_word: πάντες οἱ υἱοὶ τῶν ἀνθρώπων
  choice: все сыны человеческие
  rationale: Сохраняется образное и гендерно маркированное греческое выражение, в русском имеющее понятный библейский антропологический смысл.
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: все их дела
  rationale: «Дела» естественно охватывает поступки и результаты человеческой деятельности.
- source_word: πάντα τὰ τοιαῦτα
  choice: всё подобное этому
  rationale: Передаёт качественно-обобщающий смысл τοιαῦτα; возможна также отсылка ко всему только что перечисленному.
- source_word: ἀλήθεια
  choice: истина
  rationale: Прямое соответствие, сохраняющее противопоставление несправедливости и истины.
- source_word: ἐν τῇ ἀδικίᾳ αὐτῶν
  choice: в своей несправедливости
  rationale: Сохраняет тот же русский корень, что и повторяемое ранее «несправедлив», и не сужает значение до отдельных проступков.
- source_word: ἀπολοῦνται
  choice: они погибнут
  rationale: Средне-пассивная форма допускает непереходное «погибнут» без добавления неуказанного деятеля.
theological_decisions:
- issue: Гендерно маркированное антропологическое выражение υἱοὶ τῶν ἀνθρώπων
  choice: сыны человеческие
  alternative: люди / человеческий род
  rationale: Буквально-образная форма сохраняет исходную идиому, тогда как нейтральное «люди» передало бы её общий смысл, но устранило бы образ.
- issue: Связь несправедливости с гибелью
  choice: в своей несправедливости они погибнут
  alternative: из-за своей несправедливости они погибнут
  rationale: Предлог ἐν сохранён без превращения неоднозначной связи в однозначно причинную; речь может идти о сфере, состоянии или обстоятельстве их гибели.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Риторический повтор «несправедлив… несправедливы… несправедливо» сохранён. Инверсия «Несправедливо вино» передаёт греческую анафору и звучит как торжественное изречение; архаизирующие формы вне устойчивого выражения «сыны человеческие» не использованы.
