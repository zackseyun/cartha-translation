  source_fidelity: 'Смысловые соответствия в целом точны: повтор ἄδικος сохранён одним корнем, «царь», «женщины», «сыны человеческие», «дела», «истина» и будущее «погибнут» передают греческий текст без догматических добавлений. ἐν τῇ ἀδικίᾳ αὐτῶν корректно оставлено в непрояснённой локативно-обстоятельственной формулировке.'
  naturalness: Начальная инверсия «Несправедливо вино» стилистически возможна, но в современном литературном русском может быть прочитана как безличная оценка («несправедливо [что есть] вино»), а не как характеристика вина. Кроме того, тире перед «всё подобное этому» создаёт не вполне ясное присоединение. Более ясная координация сохраняет риторический повтор и эллиптическое обобщение оригинала.
