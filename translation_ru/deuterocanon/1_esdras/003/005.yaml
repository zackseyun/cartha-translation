  yaml_path: translation/deuterocanon/1_esdras/003/005.yaml
  text: Let each of us speak one word that will prevail[a]; and whoever's statement is shown to be wiser than the other's, Darius the king will give him great gifts and great victory honors[b],
translation:
  language: ru
  text: Пусть каждый из нас произнесёт по одному слову, которое одержит верх[a]. И тому, чьё высказывание окажется мудрее, чем у другого, царь Дарий даст великие дары и великие награды за победу[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по одному высказыванию, которое окажется сильнее». Греческое λόγος может означать слово, изречение, высказывание или довод, а ὑπερισχύω — оказаться сильнее, одолеть.'
    reason: lexical_alternative
  - marker: b
    text: Греческое ἐπινίκια обозначает награды или почести, присуждаемые за победу; они отличаются от упомянутых перед этим даров.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπωμεν ἕκαστος ἡμῶν
  choice: Пусть каждый из нас произнесёт
  rationale: Увещательное сослагательное наклонение передано естественной русской конструкцией «пусть», а ἕκαστος ἡμῶν сохраняет распределительное значение.
- source_word: ἕνα λόγον
  choice: по одному слову
  rationale: λόγος может означать слово, изречение или довод. «По одному слову» близко к форме греческого текста и в данном состязательном контексте естественно обозначает краткое высказывание.
- source_word: ὃς ὑπερισχύσει
  choice: которое окажется сильнее других
  rationale: ὑπερισχύω означает превосходить силой, одолевать. Формулировка сохраняет образ состязания и обозначает сравнительное превосходство, не сводя его преждевременно только к победе.
- source_word: οὗ ἂν φανῇ τὸ ῥῆμα αὐτοῦ
  choice: тому, чьё высказывание окажется
  rationale: Неопределённо-относительная конструкция передана через «тому, чьё»; φανῇ здесь означает явиться или оказаться по результату оценки.
- source_word: σοφώτερον τοῦ ἑτέρου
  choice: мудрее высказываний остальных
  rationale: σοφώτερον — сравнительная степень «мудрее». В контексте трёх участников ἕτερος имеет значение прочих соперников; множественное число по-русски устраняет ошибочное впечатление, будто сравниваются лишь двое.
- source_word: δωρεὰς μεγάλας
  choice: великие дары
  rationale: Формально близкая и уместная для повествовательного регистра передача материальных даров.
- source_word: ἐπινίκια μεγάλα
  choice: великие награды за победу
  rationale: ἐπινίκια обозначает награды или почести по случаю победы. «Награды за победу» отличает их от уже названных даров и остаётся ясным современному читателю.
