  yaml_path: translation/deuterocanon/1_esdras/003/027.yaml
  text: If she tells them to make war[a], one against another, they do it; but if she sends them out against the enemies, they go and tear down the mountains and the walls and the towers.
translation:
  language: ru
  text: Если она велит им воевать друг с другом, они это делают; а если пошлёт их против врагов, они идут и преодолевают[a] горы, стены и башни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разрушают», «покоряют». Греческий глагол κατεργάζονται обозначает здесь энергичное действие по отношению к местности и укреплениям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: если она велит
  rationale: Условная конструкция описывает общий случай; «велит» естественно передаёт распорядительную силу её слов в данном контексте, не прибегая к более официальному «приказывает».
- source_word: ποιῆσαι πόλεμον
  choice: воевать
  rationale: Современный и естественный русский эквивалент идиомы «вести войну», сохраняющий военный смысл без тяжеловесности.
- source_word: ἕτερος πρὸς τὸν ἕτερον
  choice: друг с другом
  rationale: Передаёт взаимно-направленное действие греческого оборота; значение противостояния уже ясно из глагола «воевать».
- source_word: ποιοῦσιν
  choice: они это делают
  rationale: Сохраняет широкий возвратный смысл глагола, отсылающего к только что названному действию.
- source_word: ἐξαποστείλῃ
  choice: пошлёт их
  rationale: Передаёт отправление людей на действие; русское «пошлёт» здесь естественно и не требует избыточного «отправит прочь».
- source_word: πρὸς τοὺς πολεμίους
  choice: против врагов
  rationale: Военный контекст требует значения направленного противостояния, естественно выражаемого предлогом «против».
- source_word: βαδίζουσιν
  choice: они идут
  rationale: Сохраняет обычное значение глагола «идти», не добавляя отсутствующего в слове оттенка строевого марша.
- source_word: κατεργάζονται
  choice: сокрушают
  rationale: Глагол обозначает действенное, силовое воздействие и в ряду с горами и укреплениями допускает значения «сокрушать», «разрушать», «покорять». «Сокрушают» применимо ко всему перечислению и сохраняет образную напряжённость.
- source_word: τὰ ὄρη
  choice: горы
  rationale: Сохранено прямое лексическое значение; замена на «твердыни» необоснованно истолковала бы образ.
- source_word: τὰ τείχη
  choice: стены
  rationale: Прямой и понятный эквивалент оборонительных стен.
- source_word: τοὺς πύργους
  choice: башни
  rationale: Прямой эквивалент, соответствующий контексту укреплений.
theological_decisions:
- issue: К кому относится подразумеваемое подлежащее женского рода
  choice: Местоименное подлежащее передано как «она», то есть женщина из ближайшего контекста рассуждения.
  alternative: Повторить «женщина» либо оставить подлежащее невыраженным там, где это допускает русский язык.
  rationale: В греческом тексте подлежащее явно не повторено, но ближайший контекст однозначно задаёт женщину как действующее лицо. «Она» сохраняет связность, не добавляя нового толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, энергичным синтаксисом. Сохранены риторический параллелизм и необычный образ сокрушения гор; пунктуация подчёркивает противопоставление двух условных ситуаций.
