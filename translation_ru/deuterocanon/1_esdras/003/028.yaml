  yaml_path: translation/deuterocanon/1_esdras/003/028.yaml
  text: They kill and are killed[a], and they do not disobey the king’s word; and if they are victorious, they bring everything to the king[b], and whatever else they plunder.
translation:
  language: ru
  text: Они убивают и бывают убиты; приказа царя они не нарушают. А если одерживают победу, то приносят царю всё — и то, что награбят, и всё остальное.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φονεύουσιν καὶ φονεύονται
  choice: убивают и сами бывают убиты
  rationale: Сохранены активная и пассивная формы греческого текста. «Бывают убиты» передаёт повторяющийся характер описываемого поведения воинов и не добавляет не выраженной в тексте взаимности.
- source_word: τὸν λόγον τοῦ βασιλέως οὐ παραβαίνουσιν
  choice: приказа царя они не нарушают
  rationale: λόγος здесь означает выраженную волю или повеление царя; по-русски «приказ царя» естественнее буквального «слово царя». Глагол παραβαίνω передан как «нарушать».
- source_word: ἐὰν δὲ νικήσωσιν
  choice: а если одержат победу
  rationale: νικάω обозначает победу; эта формулировка сохраняет условную конструкцию и соответствует достойному современному регистру.
- source_word: τῷ βασιλεῖ κομίζουσιν πάντα
  choice: приносят царю всё
  rationale: κομίζω в данном контексте означает доставлять добытое царю; «приносят» сохраняет широкое значение греческого глагола.
- source_word: ἐὰν προνομεύσωσιν
  choice: то, что награбят
  rationale: προνομεύω относится к захвату военной добычи. Относительная конструкция естественно передаёт неопределённо-условный оборот ἐὰν с конъюнктивом.
- source_word: τὰ ἄλλα πάντα
  choice: всё остальное
  rationale: Передана обобщающая и всеохватная сила выражения без устранения некоторой избыточности греческой фразы.
