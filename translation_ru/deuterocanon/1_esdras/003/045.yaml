  text: And from this you must know that women rule over you. Do you not labor and toil[a], and give and bring everything to women?
translation:
  language: ru
  text: И из этого вы должны понять, что женщины[a] властвуют над вами. Разве вы не трудитесь и не выбиваетесь из сил, не отдаёте и не приносите им всё?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жёны»; однако греческое слово γυναῖκες может иметь и это значение, но здесь в основном тексте передано в более общем значении: «женщины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντεῦθεν
  choice: из этого
  rationale: Оборот указывает на вывод из предшествующих примеров и сохраняет указательное значение греческого наречия, не сводя его к простому «поэтому».
- source_word: δεῖ ὑμᾶς γνῶναι
  choice: вы должны понять
  rationale: Передаёт необходимость, выраженную δεῖ, а «понять» естественно обозначает требуемое осознание вывода в данном риторическом контексте.
- source_word: γυναῖκες
  choice: женщины
  rationale: Множественное число имеет общее значение «женщины»; хотя контекст допускает отсылку к жёнам, сужать значение в основном тексте не следует.
- source_word: κυριεύουσιν ὑμῶν
  choice: властвуют над вами
  rationale: Сохраняет сильное значение господства или власти и при этом звучит естественно в современном литературном русском языке.
- source_word: πονεῖτε καὶ μοχθεῖτε
  choice: трудитесь и изнуряете себя
  rationale: 'Два выражения сохраняют греческое риторическое удвоение: первое обозначает тяжёлый труд, второе подчёркивает тягость и изнурение.'
- source_word: πάντα
  choice: всё
  rationale: Кратко и естественно передаёт всеохватность греческого слова.
- source_word: δίδοτε καὶ φέρετε
  choice: отдаёте и приносите
  rationale: Оба глагола переданы отдельно, чтобы сохранить накопительный риторический эффект и различие между передачей и принесением.
