base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/037.yaml
  text: Men[a], is not the king great, and are not men many, and does not wine have strength? Who then is the one who rules over them[b], or who is the one who has mastery over them? Is it not women?
translation:
  language: ru
  text: Мужи, разве царь не велик, разве мужчин[a] не много и разве вино не сильно[b]? Кто же повелевает ими, или кто властвует над ними? Не женщины ли?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «людей». Греческое ἄνθρωποι может означать людей вообще, но здесь контекст противопоставляет мужчин женщинам.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Или: «разве вино не обладает силой». Греческий глагол означает «быть сильным, обладать силой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: Мужи!
  rationale: Прямое обращение во множественном числе от ἀνήρ. «Мужи» сохраняет мужской род и торжественный риторический тон, не добавляя отсутствующего в тексте уточнения.
- source_word: μέγας
  choice: велик
  rationale: Передаёт простое утверждение о величии и значимости царя без сужения смысла до одной лишь военной или физической силы.
- source_word: πολλοὶ οἱ ἄνθρωποι
  choice: людей не много
  rationale: ἄνθρωποι обычно означает людей вообще. Русское «людей» сохраняет лексическую широту греческого слова; возможное контекстуальное понимание «мужчин» вынесено в примечание.
- source_word: οἶνος ἰσχύει
  choice: вино не сильно
  rationale: ἰσχύει означает «сильно, обладает силой». Краткая формулировка сохраняет риторический параллелизм исходного текста.
- source_word: δεσπόζων
  choice: повелевает ими
  rationale: Передаёт осуществление власти или господства и естественно сочетается в русском языке с местоимением «ими».
- source_word: κυριεύων
  choice: властвует над ними
  rationale: Слегка отличается от передачи δεσπόζων, сохраняя пару близких по смыслу глаголов без навязывания строгого различия между ними.
- source_word: γυναῖκες
  choice: женщины
  rationale: Обычное значение существительного во множественном числе; контекст не ограничивает его значением «жёны».
theological_decisions:
- issue: Соотношение ἄνθρωποι и последующего γυναῖκες
  choice: Перевести ἄνθρωποι как «люди», а контекстуально возможное «мужчины» указать в примечании.
  alternative: Перевести в основном тексте как «мужчин».
  rationale: Греческое слово лексически шире обозначения мужчин, хотя последующее противопоставление женщинам допускает более узкое контекстуальное понимание. Основной текст и примечание вместе сохраняют эту неоднозначность.
- issue: Передача пары δεσπόζων / κυριεύων
  choice: «повелевает ими» / «властвует над ними»
  alternative: Передать оба причастия одним глаголом «властвует».
  rationale: Два близких по смыслу греческих причастия создают риторическое усиление. Небольшое различие русских глаголов сохраняет форму высказывания, не превращая её в особое богословское разграничение.
- issue: Референт местоимения αὐτῶν
  choice: Сохранить общее «ими / над ними» без уточнения.
  alternative: Явно перечислить царя, людей и вино.
  rationale: Греческий текст использует местоимение и не разъясняет его охват; буквальное местоименное выражение сохраняет эту особенность и риторическую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством риторической речи. Обращение «Мужи!» несколько возвышенно, но естественно для древней публичной речи. Повтор «разве» воспроизводит последовательность риторических вопросов; близкие глаголы власти сохранены раздельно.
