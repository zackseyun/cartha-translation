lexical_decisions:
- source_word: θυσιαστήριον
  choice: жертвенник
  rationale: Обычный и точный русский эквивалент культового термина, обозначающего алтарь для жертвоприношений.
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Устоявшийся библейский термин для жертв, целиком сжигаемых на огне; он точен и сохраняет культовый регистр.
- source_word: καρποῦσθαι
  choice: приносили
  rationale: Переданный греческий глагол необычен для этого контекста; буквальное «пожинать плоды» здесь вводило бы в заблуждение, тогда как контекст жертвенника указывает на совершение приношений.
- source_word: καθʼ ἡμέραν
  choice: ежедневно
  rationale: Естественно передаёт распределительное значение «каждый день».
- source_word: ἐντολήν
  choice: заповедано
  rationale: Передаёт силу обязательного предписания и естественно сочетается с безличной конструкцией русского предложения.
- source_word: ἑπτὰ καὶ δέκα
  choice: семнадцать
  rationale: Нормальная современная форма передачи греческого числительного «семь и десять».
- source_word: προσφέρειν
  choice: приносить
  rationale: Подходит для культовых приношений и не уточняет отсутствующий либо неясный объект после числа.
- source_word: ἄλλα τάλαντα, δέκα κατʼ ἐνιαυτόν
  choice: а также ещё десять талантов в год
  rationale: Сохраняет добавочное значение ἄλλα и не конкретизирует, что именно измеряется талантами, поскольку греческая фраза сжата и текстуально трудна.
