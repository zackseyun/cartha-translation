  yaml_path: translation/deuterocanon/1_esdras/004/048.yaml
  text: And he wrote letters to all the governors in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem[b], so that they might build the city with him.
translation:
  language: ru
  text: И написал он письма всем областным правителям[a] в Келесирии[b] и Финикии, а также тем, кто был в Ливане, с приказом доставить кедровую древесину из Ливана в Иерусалим, чтобы они вместе с ним строили город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правителям округов», «местным правителям»; греч. τοπάρχαις.'
    reason: lexical_alternative
  - marker: b
    text: Келесирия — историческое название области, употреблённое в греческом тексте.
    reason: cultural_note
lexical_decisions:
- source_word: τοπάρχαις
  choice: областным правителям
  rationale: Термин обозначает правителей или должностных лиц, управлявших отдельными областями. «Областные правители» понятно современному читателю и не вводит более узкий административный титул.
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: в Келесирии
  rationale: Κοίλη Συρία здесь — историческое название региона; традиционная русская форма «Келесирия» сохраняет его как имя собственное.
- source_word: Φοινίκῃ
  choice: Финикии
  rationale: Употреблена общепринятая русская форма исторического географического названия.
- source_word: τοῖς ἐν τῷ Λιβάνῳ
  choice: тем, кто находился в Ливане
  rationale: Греческий текст не повторяет титул и оставляет круг лиц неопределённым; перевод не добавляет, что это непременно правители.
- source_word: μεταφέρειν
  choice: доставили
  rationale: В контексте распоряжения о перевозке строительного материала «доставили» естественно передаёт направленное перемещение из Ливана в Иерусалим.
- source_word: ξύλα κέδρινα
  choice: кедровую древесину
  rationale: Выражение обозначает кедровое дерево как строительный материал, без не подтверждённого текстом уточнения «брёвна» или «брусья».
- source_word: ὅπως οἰκοδομήσωσιν
  choice: чтобы они … строили
  rationale: Конструкция с ὅπως и конъюнктивом выражает цель; русское «чтобы» сохраняет эту функцию.
- source_word: μετʼ αὐτοῦ
  choice: вместе с ним
  rationale: Передаёт совместное участие, не уточняя сверх текста, относится ли местоимение к личному присутствию или к поддерживаемому им делу.
- source_word: τὴν πόλιν
  choice: город
  rationale: Греческий текст прямо называет город, а не храм или дом Божий; в данном контексте имеется в виду Иерусалим.
theological_decisions:
- issue: Объект строительных работ
  choice: город
  alternative: храм / дом Божий
  rationale: Перевод следует чтению τὴν πόλιν («город») в указанном греческом источнике и не гармонизирует стих с другими повествованиями о восстановлении храма.
- issue: Соотнесение μετʼ αὐτοῦ
  choice: вместе с ним
  alternative: при его содействии / по его поручению
  rationale: Буквально передано совместное участие, поскольку греческая фраза сама по себе не определяет точный характер этого сотрудничества.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Начальное καί передано союзом «И», поскольку стих продолжает предшествующее повествование. Перестановка компонентов делает длинную греческую конструкцию естественной по-русски, сохраняя всех адресатов и обе цели письма.
