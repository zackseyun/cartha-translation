lexical_decisions:
- source_word: Εἴπωμεν ἕκαστος ἡμῶν
  choice: Пусть каждый из нас скажет
  rationale: Увещевательный конъюнктив первого лица множественного числа естественно передаётся по-русски конструкцией «пусть каждый из нас».
- source_word: ἕνα λόγον
  choice: по одному слову
  rationale: λόγος допускает значения «слово», «высказывание», «довод». В контексте состязания речь идёт об отдельном тезисе; буквальная краткость сохранена, а распределительное «по одному» естественно сочетается с «каждый».
- source_word: ὃς ὑπερισχύσει
  choice: которое окажется сильнее
  rationale: ὑπερισχύω означает превосходить силой, брать верх. Такая передача сохраняет образ состязания и не утверждает заранее, в каком именно смысле тезис победит.
- source_word: καὶ οὗ ἂν φανῇ τὸ ῥῆμα αὐτοῦ σοφώτερον τοῦ ἑτέρου
  choice: И тому, чьё высказывание окажется мудрее, чем у другого
  rationale: φανῇ передаёт результат оценки — «окажется»; ῥῆμα здесь означает произнесённое высказывание. Эллиптическое сравнение с речью другого участника сохранено в естественной русской форме.
- source_word: Δαρεῖος ὁ βασιλεὺς
  choice: царь Дарий
  rationale: Обычный для современного русского библейского повествования порядок титула и имени.
- source_word: δωρεὰς μεγάλας
  choice: великие дары
  rationale: Формально близкая и стилистически достойная передача δωρεά и усилительного μεγάλος.
- source_word: ἐπινίκια μεγάλα
  choice: великие награды за победу
  rationale: ἐπινίκια обозначает награды или почести, связанные с победой. «Награды за победу» ясно передаёт значение, не уточняя без основания, были ли они материальными или почётными.
