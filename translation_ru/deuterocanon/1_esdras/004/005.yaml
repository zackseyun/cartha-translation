  yaml_path: translation/deuterocanon/1_esdras/004/005.yaml
  text: Let each of us speak one word that will prevail[a]; and whoever’s statement appears wiser than the other’s, Darius the king will give him great gifts and great honors of victory[b],
translation:
  language: ru
  text: Пусть каждый из нас скажет по одному слову, которое окажется сильнее[a]. И тому, чьё высказывание окажется мудрее, чем высказывание другого, царь Дарий даст великие дары и великие награды за победу[b],
  philosophy: optimal-equivalence
  footnotes:
