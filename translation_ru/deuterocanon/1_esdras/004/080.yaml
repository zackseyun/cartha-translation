  text: And when the young man went out, lifting up his face toward heaven, facing Jerusalem, he blessed the King of heaven, saying,
translation:
  language: ru
  text: 'Когда юноша вышел, он поднял лицо к небу и, обратившись в сторону Иерусалима, благословил Царя небесного, говоря:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ νεανίσκος
  choice: юноша
  rationale: Естественный и точный русский эквивалент обозначения молодого мужчины.
- source_word: ἄρας τὸ πρόσωπον εἰς τὸν οὐρανὸν
  choice: поднял лицо к небу
  rationale: Сохраняет телесный образ и направление жеста без ненужного истолкования.
- source_word: ἔναντιον Ἰερουσαλήμ
  choice: обратившись в сторону Иерусалима
  rationale: Передаёт пространственную ориентацию по отношению к Иерусалиму; буквальное «напротив Иерусалима» в современном русском могло бы ошибочно обозначать противоположную сторону или противостояние.
- source_word: εὐλόγησεν
  choice: благословил
  rationale: Сохраняет обычную библейскую лексику хвалы и прославления Бога.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: Царя небесного
  rationale: Точно передаёт титул; прописная буква указывает на его употребление как наименование Бога.
- source_word: λέγων
  choice: говоря
  rationale: Сохраняет вводную формулу перед последующей прямой речью.
theological_decisions:
- issue: Значение εὐλογέω применительно к Богу
  choice: благословил
  alternative: прославил / восхвалил
  rationale: Формальный эквивалент сохраняет традиционный библейский смысл человеческого благословения Бога как хвалы, не подменяя его более узким толкованием.
translation_notes:
  register: 'Современный литературный русский с достоинством библейского повествования. Синтаксис слегка перестроен для ясности: обстоятельственный оборот связывает ориентацию к Иерусалиму с молитвенным жестом.'
