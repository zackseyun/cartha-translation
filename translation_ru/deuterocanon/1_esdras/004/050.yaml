lexical_decisions:
- source_word: χώραν
  choice: земля
  rationale: Передаёт широкое значение территории или области, не уточняя её административный статус.
- source_word: κρατήσουσιν
  choice: будут владеть
  rationale: Будущее время греческого глагола сохранено; «владеть» естественно выражает обладание или контроль над землёй.
- source_word: ἀφορολόγητον
  choice: свободна от налогов
  rationale: Ясно и по-современному передаёт освобождение от налогов или дани.
- source_word: ὑπάρχειν
  choice: была
  rationale: Инфинитив в контексте распоряжения естественно передаётся сослагательной конструкцией «чтобы… была».
- source_word: Χαλδαῖοι
  choice: халдеи
  rationale: Прямое соответствие греческому этнониму без интерпретирующей замены на «вавилоняне».
- source_word: ἀφίουσι
  choice: оставили
  rationale: В данном контексте означает покинуть или уступить удерживаемые населённые пункты; форма встроена в зависимое распоряжение после «чтобы».
- source_word: κώμας
  choice: селения
  rationale: Естественное литературное обозначение небольших сельских населённых пунктов; не сужает значение исключительно до деревень современного типа.
- source_word: διακρατοῦσιν
  choice: удерживают
  rationale: Сохраняет усиленное значение продолжающегося владения или контроля и не навязывает оттенок военной оккупации.
