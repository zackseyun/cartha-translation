  yaml_path: translation/deuterocanon/1_esdras/004/070.yaml
  text: And he wrote letters to all the local rulers in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem, so that they might build the city with him.
translation:
  language: ru
  text: И он написал письма всем местным правителям[a] Келесирии и Финикии, а также тем, кто был в Ливане, — доставить кедровую древесину с Ливана в Иерусалим, чтобы они вместе с ним строили город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правителям округов»; греческое слово «топархи» означает правителей отдельных местностей или округов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοπάρχαις
  choice: местным правителям
  rationale: Τοπάρχης обозначает правителя определённой местности или округа. «Местные правители» ясно передаёт административный смысл, не прибегая к малопонятной транслитерации «топархи».
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: Келесирии
  rationale: Κοίλη Συρία здесь является историческим названием области. Традиционная русская форма «Келесирия» сохраняет это значение и не сводит название просто к Сирии.
- source_word: ἔγραψεν ἐπιστολάς
  choice: написал письма
  rationale: Перевод непосредственно передаёт выраженное в греческом действие написания писем, не заменяя его подразумеваемой отправкой.
- source_word: μεταφέρειν
  choice: чтобы они доставили
  rationale: Инфинитив выражает требуемое или целевое действие, изложенное в письмах. «Доставили» естественно описывает перевозку строительного материала из Ливана в Иерусалим.
- source_word: ξύλα κέδρινα
  choice: кедровую древесину
  rationale: Сочетание обозначает кедровое дерево как строительный материал; «древесина» точнее нейтрального «дерево» и не конкретизирует форму материала как брёвна.
- source_word: ὅπως οἰκοδομήσωσιν
  choice: и вместе с ним строили
  rationale: Конструкция с ὅπως и сослагательным наклонением выражает цель. Русская конструкция с общим «чтобы» перед двумя однородными действиями передаёт эту цель естественно.
- source_word: μετ’ αὐτοῦ
  choice: вместе с ним
  rationale: Μετά с родительным падежом выражает совместность. «Вместе с ним» сохраняет её, не превращая выражение в «для него».
- source_word: τὴν πόλιν
  choice: город
  rationale: Πόλις прямо обозначает город, то есть Иерусалим; перевод не подменяет его храмом.
theological_decisions:
- issue: Объект строительных работ в выражении τὴν πόλιν
  choice: город
  alternative: храм
  rationale: Хотя кедровая древесина из Ливана может ассоциироваться со строительством храма, в данном стихе прямо назван «город». Перевод сохраняет формулировку источника и не гармонизирует её с храмовой тематикой.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Историческое название «Келесирия» сохранено, а административный термин передан понятным выражением с пояснением в сноске.
