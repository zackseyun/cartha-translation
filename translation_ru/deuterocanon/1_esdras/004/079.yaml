  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said should be done[a], he himself also ordered to be done and to be sent to Jerusalem.
translation:
  language: ru
  text: И он отправил все сосуды, которые Кир отобрал из Вавилона; и всё, что Кир велел сделать, он и сам приказал сделать и отправить в Иерусалим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: отправил
  rationale: Глагол означает «выслал, отправил». Контекст допускает смысл возвращения храмовых сосудов, но в самом глаголе направление «обратно» прямо не выражено, поэтому оно не добавлено в основной текст.
- source_word: τὰ σκεύη
  choice: сосуды
  rationale: В храмовом контексте слово обозначает культовые сосуды или принадлежности; «сосуды» сохраняет традиционный и понятный смысл без лишней конкретизации.
- source_word: ἃ ἐχώρισεν Κῦρος ἀπὸ Βαβυλῶνος
  choice: которые Кир выделил из находившегося в Вавилоне
  rationale: «Выделил» передаёт отделение и назначение предметов, а конструкция с «из» естественно выражает исходную точку ἀπό, не создавая неясного русского оборота «отделил от Вавилона».
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: всё, что Кир велел сделать
  rationale: При εἶπεν инфинитив выражает предписание; «велел сделать» естественно передаёт эту конструкцию и не ослабляет распорядительного характера слов Кира.
- source_word: καὶ αὐτὸς ἐπέταξεν
  choice: он и сам приказал
  rationale: «И сам» сохраняет эмфатическое αὐτός и добавочное καί, а «приказал» соответствует властному распоряжению ἐπέταξεν.
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι εἰς Ἰερουσαλήμ
  choice: сделать и отправить в Иерусалим
  rationale: Сохранены два координированных инфинитива и их зависимость от «приказал»; русский текст оставляет открытой присущую греческой фразе широту отнесения второго действия.
