  terminology: «Сосуды» уместно для τὰ σκεύη в храмовом контексте и не конкретизирует тип предметов сверх источника. Имена Кир, Вавилон и Иерусалим переданы нормативно. Примечание сохраняет лексическую вариативность χωρίζω, не навязывая толкование.
