base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/036.yaml
  text: All the earth calls truth blessed[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: ru
  text: Вся земля зовёт истину[a], и небо благословляет её; все творения[b] содрогаются и трепещут, и с нею нет ничего несправедливого.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призывает истину». Греческий глагол может означать «звать», «призывать» или «называть»; слова «блаженной» в греческом тексте нет.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все дела» или «все произведения». В данном космическом контексте, вероятно, имеются в виду все сотворённые существа и вещи.'
    reason: lexical_alternative
  - marker: c
    text: В греческом здесь стоит местоимение мужского или среднего рода — буквально «с ним» или «с этим», хотя ранее истина обозначена формами женского рода. По смыслу оно, вероятнее всего, относится к истине.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: Вся земля
  rationale: В сочетании с небом выражение имеет вселенский смысл; «земля», а не «страна», сохраняет космический охват.
- source_word: τὴν ἀλήθειαν καλεῖ
  choice: взывает к истине
  rationale: καλέω с винительным падежом может означать звать или призывать. «Взывает к истине» естественно передаёт обращённость действия к олицетворённой истине, не добавляя отсутствующего в греческом тексте слова «блаженной».
- source_word: ὁ οὐρανὸς αὐτὴν εὐλογεῖ
  choice: небо благословляет её
  rationale: Сохранены возвышенное значение εὐλογεῖ и женское местоимение, согласованное с ἀλήθεια, чтобы передать олицетворение истины.
- source_word: πάντα τὰ ἔργα
  choice: все творения
  rationale: В космическом параллелизме ἔργα вероятнее обозначает всё сотворённое, а не человеческие поступки. Буквальная альтернатива отмечена в сноске.
- source_word: σείεται καὶ τρέμει
  choice: содрогаются и трепещут
  rationale: Парные глаголы переданы двумя близкими по смыслу русскими глаголами, сохраняющими усиление и поэтический ритм.
- source_word: μετʼ αὐτοῦ
  choice: с нею
  rationale: Хотя греческая форма местоимения мужского или среднего рода, ближайший смысловой референт — истина; женская форма сохраняет развёрнутое олицетворение. Формальное несоответствие отмечено в сноске.
- source_word: ἄδικον οὐθέν
  choice: нет ничего несправедливого
  rationale: Передано буквально по смыслу, без сужения до одного лишь понятия «беззаконие» и без внесения дополнительной конфессиональной терминологии.
theological_decisions:
- issue: Олицетворение истины
  choice: Сохранить женское местоимение «её / с нею»
  alternative: 'Передать истину безлично: «это / с этим»'
  rationale: Греческое αὐτήν грамматически согласовано с существительным женского рода ἀλήθεια и поддерживает риторическое олицетворение. Такой перевод не утверждает, что Истина является отдельной личностью.
- issue: Несогласованность μετʼ αὐτοῦ с ἀλήθεια
  choice: В основном тексте отнести местоимение к истине, а форму оригинала оговорить в сноске
  alternative: 'Сохранить мужской или средний род: «с ним / с этим»'
  rationale: Контекст естественно связывает заключительную фразу с истиной, однако необычная форма оригинала не должна быть скрыта, поэтому она вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, поэтическим звучанием. Синтаксический параллелизм оригинала сохранён; архаизмы и искусственно церковнославянские обороты не использованы.
