  text: And for all who go up from Babylonia to build the city[a], there shall be freedom for them and for their children, and for all the priests who go up.
translation:
  language: ru
  text: 'И всем, кто поднимается из Вавилонии, чтобы строить город, предоставить свободу[a]: им, их детям и всем священникам, которые поднимаются.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вольность». В контексте царского указа это слово может подразумевать юридические привилегии или освобождение от некоторых повинностей, однако греческий текст не определяет их точный объём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσβαίνουσιν
  choice: поднимается / поднимаются
  rationale: В контексте возвращения из плена глагол передаёт традиционное восхождение в Иерусалим; «подниматься» сохраняет географический и религиозный оттенок.
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: из Вавилонии
  rationale: Греческий текст называет область Вавилонию, а не только город Вавилон.
- source_word: κτίσαι τὴν πόλιν
  choice: чтобы строить город
  rationale: κτίζω может означать «основывать» или «строить»; хотя по контексту речь идёт о восстановлении, греческий текст прямо не выражает приставочного значения «восстановить».
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: даровать свободу
  rationale: Инфинитивная конструкция продолжает содержание царского распоряжения. «Даровать свободу» естественно передаёт официальное предоставление права, не уточняя его объём.
- source_word: ἐλευθερίαν
  choice: свободу
  rationale: Слово имеет широкое значение свободы; в административном контексте оно может включать привилегии или освобождение от повинностей, но точный смысл не определён.
- source_word: αὐτοῖς τε καὶ τοῖς τέκνοις αὐτῶν
  choice: им, их детям
  rationale: τέκνα непосредственно означает «дети»; перевод «потомки» неоправданно расширил бы формулировку.
- source_word: πᾶσι τοῖς ἱερεῦσι τοῖς προσβαίνουσιν
  choice: всем священникам, которые поднимаются
  rationale: Повтор глагола сохранён, чтобы точно передать структуру греческого текста и распространить предоставляемую свободу на восходящих священников.
