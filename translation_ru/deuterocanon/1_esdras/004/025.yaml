lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: Но царь
  rationale: δέ в ходе сопоставительного рассуждения имеет лёгкий противительный оттенок; «но» естественно связывает эту фразу с предыдущей.
- source_word: ὑπερισχύει
  choice: превосходит их силой
  rationale: Передаёт значение превосходства в силе и сохраняет сравнительную направленность глагола.
- source_word: κυριεύει αὐτῶν
  choice: властвует над ними
  rationale: Отражает осуществление власти или господства и звучит естественно в современном литературном русском.
- source_word: δεσπόζει αὐτῶν
  choice: господствует над ними
  rationale: Сохраняет усиление и оттенок верховной власти по сравнению с κυριεύει, не сливая два близких греческих глагола.
- source_word: πᾶν ὃ ἐὰν εἴπῃ αὐτοῖς
  choice: что бы он им ни приказал
  rationale: Неопределённо-относительная конструкция передана естественным русским оборотом; в контексте царской власти εἴπῃ означает распоряжение, хотя буквально значит «скажет».
- source_word: ἐνακούουσιν
  choice: они повинуются
  rationale: Глагол связан со слушанием, но здесь обозначает деятельное послушание царскому распоряжению.
