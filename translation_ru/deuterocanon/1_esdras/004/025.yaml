  text: But the king prevails over them and rules over them[a], and is master over them, and whatever he says to them, they obey.
translation:
  language: ru
  text: Но царь сильнее их, властвует над ними и повелевает ими, и всё, что он им ни скажет, они повинуются[a].
  philosophy: optimal-equivalence
