base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/055.yaml
  text: And he wrote that support should be given to the Levites until the day when the house would be completed and Jerusalem built[a][b][c][d].
translation:
  language: ru
  text: И он письменно распорядился выдавать левитам содержание[a] до того дня, когда будет завершён дом[b] и построен Иерусалим[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обеспечение», «пособие» или «снабжение».'
    reason: lexical_alternative
  - marker: b
    text: Под «домом» подразумевается храм.
    reason: cross_reference
  - marker: c
    text: 'Или: «восстановлен Иерусалим». В греческом тексте буквально сказано «построен», хотя речь идёт о восстановлении.'
    reason: lexical_alternative
  - marker: d
    text: Греческая формулировка после слов «до того дня» в дошедшем тексте несколько неровна; общий смысл состоит в том, что содержание следовало выдавать до завершения храма и строительства Иерусалима.
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: письменно распорядился
  rationale: Глагол вводит содержание официального письменного распоряжения. Такая передача естественна по-русски и не уточняет адресата, которого греческий текст здесь не называет.
- source_word: δοῦναι
  choice: выдавать
  rationale: Инфинитив зависит от ἔγραψεν и обозначает предписанное действие. Несовершенный вид уместен для продолжающегося обеспечения вплоть до указанного срока.
- source_word: τὴν χορηγίαν
  choice: содержание
  rationale: χορηγία обозначает предоставляемое материальное обеспечение или средства. «Содержание» ясно выражает регулярную поддержку левитов, не уточняя её форму.
- source_word: τοῖς Λευείταις
  choice: левитам
  rationale: Прямая передача дательного падежа, обозначающего получателей содержания.
- source_word: ἕως τῆς ἡμέρας
  choice: до того дня
  rationale: Сохранён временной рубеж, выраженный греческой конструкцией.
- source_word: ᾖ ἐπιτελεσθῇ
  choice: когда будет завершён
  rationale: Передаёт предполагаемое в будущем завершение, одновременно сглаживая синтаксическую неровность дошедшего греческого текста.
- source_word: ὁ οἶκος
  choice: дом
  rationale: Сохранён буквальный библейский образ; в данном контексте под домом подразумевается храм.
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: построен Иерусалим
  rationale: Греческий глагол буквально означает «быть построенным». Контекст допускает «восстановлен», но это толкование не внесено без пояснения в основной текст.
theological_decisions:
- issue: К чему относится «дом»
  choice: Сохранить «дом» в основном тексте, понимая его как Иерусалимский храм
  alternative: Передать непосредственно как «храм»
  rationale: В контексте восстановления «дом» служит обычным обозначением храма. Сохранение исходного образа не затемняет смысл, который поясняется в сноске.
- issue: «Построен» или «восстановлен» применительно к Иерусалиму
  choice: построен
  alternative: восстановлен / отстроен заново
  rationale: Контекст говорит о восстановлении города, однако греческий текст употребляет простой глагол «строить». Буквальное значение сохранено, а контекстуальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством официально-повествовательного библейского стиля. Формула «письменно распорядился» естественно передаёт царский указ; «дом» сохраняет исходный библейский образ, а сноска устраняет возможную неясность.
