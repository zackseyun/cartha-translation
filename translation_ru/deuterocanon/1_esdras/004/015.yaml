  text: And he sat in the council chamber[a], and the letter was read before them. And he said, “Call the young men, and they will explain their words.” And they were called, and they entered.
translation:
  language: ru
  text: 'И он сел в зале заседаний[a], и письмо было прочитано перед ними. Тогда он сказал: «Позовите молодых людей, и они сами объяснят свои слова». Их позвали, и они вошли.'
