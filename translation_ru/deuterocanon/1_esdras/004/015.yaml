lexical_decisions:
- source_word: ἐκάθισεν
  choice: сел
  rationale: Прямо передаёт аорист глагола в повествовательном контексте, не добавляя отсутствующей в греческом церемониальности.
- source_word: χρηματιστηρίῳ
  choice: в зале заседаний
  rationale: Обозначает официальное место слушания или совещания. Этот вариант естественен по-русски и не сужает значение исключительно до суда; лексическая неопределённость отмечена в сноске.
- source_word: ἀνεγνώσθη
  choice: было прочитано
  rationale: Точно передаёт страдательный аорист; указание «вслух» подразумевается обстановкой, но в греческом прямо не выражено.
- source_word: γράμμα
  choice: написанное
  rationale: Сохраняет широкое значение греческого слова — письменный текст или запись — и не создаёт впечатления личного письма, которого контекст не требует.
- source_word: νεανίσκους
  choice: молодых людей
  rationale: Современное и ясное обозначение молодых мужчин, участвующих в состязании.
- source_word: αὐτοὶ
  choice: они сами
  rationale: 'Передаёт выраженное греческим местоимением усиление: участники лично объяснят свои слова.'
- source_word: δηλώσουσιν
  choice: объяснят
  rationale: В сочетании с «свои слова» глагол естественно означает сделать смысл ясным, то есть объяснить сказанное или написанное.
- source_word: λόγους αὐτῶν
  choice: свои слова
  rationale: Сохраняет основное значение λόγοι и естественно выражает принадлежность слов тем, кого призвали.
- source_word: εἰσῆλθοσαν
  choice: вошли
  rationale: Кратко и непосредственно передаёт повествовательный аорист εἰσέρχομαι.
