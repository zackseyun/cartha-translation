  yaml_path: translation/deuterocanon/1_esdras/004/061.yaml
  text: And he took the letters and went out to Babylon[a], and reported to all his brothers.
translation:
  language: ru
  text: Он взял письма, отправился в Вавилон и сообщил всем своим братьям.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «всем своим соплеменникам»; буквально: «всем своим братьям».'
    reason: Лексема ἀδελφοί буквально означает «братья», но здесь может шире обозначать членов его народа или общины.
lexical_decisions:
- source_word: ἔλαβεν
  choice: взял
  rationale: Аорист от λαμβάνω передаёт последовательное завершённое действие; «взял» прямо и естественно сочетается с письмами.
- source_word: τὰς ἐπιστολάς
  choice: письма
  rationale: ἐπιστολή обычно обозначает письмо или письменное послание; множественное число сохранено.
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: отправился в Вавилон
  rationale: ἐξέρχομαι выражает выход или отправление, а εἰς — направление. «Отправился» естественно передаёт движение к месту назначения без неуместно буквального «вышел в Вавилон».
- source_word: ἀπήγγειλεν
  choice: сообщил
  rationale: ἀπαγγέλλω означает сообщать, возвещать или докладывать. Дополнение в греческом не выражено, поэтому и в переводе содержание сообщения не добавлено.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: всем своим братьям
  rationale: Перевод сохраняет мужское множественное число и порядок смысловых компонентов; в контексте «братья» может обозначать более широкий круг соплеменников.
theological_decisions:
- issue: Коллективное значение ἀδελφοῖς
  choice: братьям
  alternative: соплеменникам
  rationale: Основной текст сохраняет прямое значение греческого слова и не устраняет его возможную буквальную либо общинно-этническую широту. Контекстуальная альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Отправился» выбрано вместо буквального и неестественного «вышел», а эллипсис после «сообщил» сохранён, чтобы не добавлять отсутствующий в греческом объект.
