  text: From you are victory and wisdom[a], and yours is the glory, and I am your servant.
translation:
  language: ru
  text: От тебя — победа, и от тебя — мудрость; слава — твоя, а я — твой слуга[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «домашний слуга». Греческое οἰκέτης обозначает слугу в составе домашнего хозяйства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρά σοῦ
  choice: от тебя
  rationale: 'Παρά с родительным падежом здесь указывает на источник: победа и мудрость исходят от того, к кому обращена речь. Повтор сохранён.'
- source_word: νίκη
  choice: победа
  rationale: Прямой и естественный русский эквивалент существительного νίκη.
- source_word: ἡ σοφία
  choice: мудрость
  rationale: Обычное значение σοφία; контекст не требует более узкого смысла вроде «умение» или «благоразумие».
- source_word: σὴ ἡ δόξα
  choice: слава — твоя
  rationale: Предикативная конструкция с притяжательным местоимением подчёркивает принадлежность славы; инверсия сохраняет акцент оригинала и звучит естественно в возвышенной русской речи.
- source_word: οἰκέτης
  choice: слуга
  rationale: В основном тексте выбрано естественное и стилистически уместное «слуга». Более узкое значение — слуга, принадлежащий к домашним, — указано в сноске; перевод «раб» чрезмерно подчёркивал бы правовой статус.
theological_decisions:
- issue: К кому обращено второе лицо
  choice: Прямое обращение сохранено без уточнения адресата; местоимения даны со строчной буквы.
  alternative: Понять обращение как относящееся к Богу либо к царю и обозначить это прописной буквой или пояснением.
  rationale: Греческий текст в данном предложении не называет адресата. Строчная буква не навязывает отождествление и сохраняет возможную повествовательную и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным и несколько возвышенным строем. Тире передают эллиптическую именную конструкцию греческого текста и подчёркивают параллелизм.
