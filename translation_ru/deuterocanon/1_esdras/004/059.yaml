lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Причастие настоящего времени вводит прямую речь; русский деепричастный оборот сохраняет структуру греческого текста.
- source_word: Παρὰ σοῦ
  choice: От Тебя
  rationale: 'παρά с родительным падежом здесь естественно обозначает источник: победа и мудрость исходят от того, к кому обращена речь.'
- source_word: νίκη
  choice: победа
  rationale: Прямое и естественное соответствие существительному νίκη.
- source_word: σοφία
  choice: мудрость
  rationale: Обычное значение σοφία; контекст не требует более узкого смысла «умение» или «искусность».
- source_word: σὴ ἡ δόξα
  choice: Тебе принадлежит слава
  rationale: Передаёт подчёркнутую принадлежность славы адресату и звучит естественно в современном литературном русском языке.
- source_word: οἰκέτης
  choice: слуга
  rationale: Слово обозначает домашнего слугу, в том числе человека в зависимом или рабском положении. «Слуга» соответствует возвышенному контексту самоумаления, а более сильные оттенки отмечены в сноске.
theological_decisions:
- issue: Передача οἰκέτης в исповедании покорности
  choice: слуга
  alternative: домашний слуга; раб
  rationale: «Слуга» сохраняет исповедание принадлежности и подчинения, не делая рабский статус более определённым, чем позволяет данный контекст. Лексически возможный более сильный смысл сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим молитвенно-доксологической речи. Заглавные местоимения передают непосредственное обращение к Богу. Точка с запятой разграничивает утверждения о Боге и признание говорящим собственной принадлежности Ему.
