lexical_decisions:
- source_word: ὅτε ἐξῆλθεν
  choice: когда … вышел
  rationale: Передаёт временное придаточное и обычное значение ἐξέρχομαι, сохраняя последовательность повествования.
- source_word: ὁ νεανίσκος
  choice: юноша
  rationale: Естественное современное соответствие для молодого мужчины; не добавляет отсутствующего в греческом тексте указания на служебное положение.
- source_word: ἄρας τὸ πρόσωπον
  choice: поднял лицо
  rationale: Сохраняет конкретный жест, выраженный аористным причастием, но передаёт его естественной русской глагольной конструкцией.
- source_word: εἰς τὸν οὐρανόν
  choice: к небу
  rationale: В молитвенном контексте οὐρανός означает небо как сферу Божьего пребывания; направление жеста передано предлогом «к».
- source_word: ἐναντίον Ἰερουσαλήμ
  choice: обратившись в сторону Иерусалима
  rationale: Передаёт пространственную ориентацию по отношению к Иерусалиму и позволяет естественно совместить её с поднятым к небу лицом.
- source_word: εὐλόγησεν
  choice: благословил
  rationale: Сохраняет библейское значение εὐλογέω при Боге как объекте; возможное контекстуальное значение «восхвалил» вынесено в примечание.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: Царя небесного
  rationale: Естественный и торжественный русский титул Бога, точно передающий смысл греческого родительного оборота.
theological_decisions:
- issue: Значение εὐλόγησεν в речи, обращённой к Богу
  choice: благословил Царя небесного
  alternative: восхвалил Царя небесного
  rationale: «Благословил» сохраняет характерный библейский оборот и смысловую напряжённость глагола, тогда как «восхвалил» яснее выражает его функцию в данном контексте, но уже истолковывает её.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской окраской. Синтаксис упрощён до естественной русской последовательности без устранения пространственного образа исходного текста.
