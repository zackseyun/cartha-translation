lexical_decisions:
- source_word: οὐ μέμνηται
  choice: забывают
  rationale: Греческая форма стоит в единственном числе, однако последующие πίνωσιν и σπῶνται имеют множественное число и задают обобщённое высказывание о пьющих. Русское множественное число естественно передаёт этот смысл; «забывают» идиоматично выражает отрицание глагола памяти.
- source_word: ὅταν πίνωσιν
  choice: когда они пьют
  rationale: ὅταν с сослагательным наклонением обозначает неопределённую или повторяющуюся ситуацию; настоящее время в русском сохраняет обобщённый характер высказывания.
- source_word: φιλιάζειν
  choice: проявлять дружеское расположение
  rationale: Глагол обозначает дружеское или ласковое отношение и не обязательно подразумевает буквальный поцелуй. Выбранный оборот сохраняет широту значения.
- source_word: φίλοις καὶ ἀδελφοῖς
  choice: к друзьям и братьям
  rationale: Сохраняется прямое значение обоих существительных и различие между дружескими и родственными отношениями.
- source_word: μετʼ οὐ πολὺ
  choice: вскоре
  rationale: Кратко и естественно передаёт идиому «спустя немного времени» и резкий переход к насилию.
- source_word: σπῶνται μαχαίρας
  choice: обнажают мечи
  rationale: σπάω в сочетании с μαχαίρας означает вынимать оружие из ножен; «обнажают мечи» — точное и уместное для литературного русского языка выражение.
