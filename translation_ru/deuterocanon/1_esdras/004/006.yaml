  text: and to put on purple[a], and to drink from gold vessels, and to sleep on gold, and a chariot with gold bridles, and a turban of fine linen, and a necklace around the neck[c][b],
translation:
  language: ru
  text: и облачаться в пурпурные одежды, и пить из золотых сосудов[a], и спать на золоте[b], и иметь колесницу с золотой упряжью[c], и головной убор из тонкого льна, и ожерелье на шее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение указывает на золотые предметы для питья, но не уточняет, были ли это чаши или сосуды другого вида.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «спать на золоте». Вероятно, имеется в виду украшенное золотом ложе, однако слово «ложе» в греческом тексте отсутствует.'
    reason: lexical_alternative
  - marker: c
    text: Греческое сложное слово может означать колесницу с золотой уздой, удилами или, шире, золотой упряжью.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: облачаться в пурпурные одежды
  rationale: Средний инфинитив передаёт действие облачения, а πορφύρα здесь обозначает пурпурную ткань или одежду. Явное «одежды» естественно по-русски и не ограничивает смысл конкретным видом одеяния.
- source_word: ἐν χρυσώμασιν πίνειν
  choice: пить из золотых сосудов
  rationale: χρυσώματα обозначает золотые предметы, употребляемые для питья, но точный вид сосуда не назван. «Сосуды» сохраняет эту неопределённость.
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: спать на золоте
  rationale: В греческом прямо сказано «спать на золоте» без существительного «ложе» или «постель»; буквальный образ сохранён, чтобы не вносить отсутствующую конкретизацию.
- source_word: ἅρμα χρυσοχάλινον
  choice: колесницу с золотой упряжью
  rationale: Сложное прилагательное связывает золото с уздой, удилами или конской сбруей колесницы. «Золотая упряжь» звучит естественно и не сужает значение до одной детали.
- source_word: κίδαριν βυσσίνην
  choice: головной убор из тонкого льна
  rationale: κίδαρις — древний головной убор, подобный тюрбану или тиаре; βύσσινος указывает на тонкую льняную ткань. Описательный перевод понятнее современному читателю и избегает неясного заимствования «кидар».
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: ожерелье на шее
  rationale: μανιάκης обозначает шейное украшение — ожерелье, обруч или гривну. «Ожерелье» является ясным современным соответствием, а предложная фраза прямо указывает место ношения.
