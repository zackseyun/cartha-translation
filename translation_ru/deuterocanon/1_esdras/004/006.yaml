  register: Современный литературный русский язык с умеренно торжественным ритмом перечисления. Повтор союза «и» сохраняет накопительный строй греческой фразы. Перед рядом предметов добавлено «иметь» для естественной русской синтаксической связи после ряда инфинитивов; оно охватывает последующие признаки роскоши и не меняет их предметного содержания.
