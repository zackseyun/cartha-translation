base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/068.yaml
  text: 'And now this is what I ask, O lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you do the vow which I vowed to the King of heaven that it should be done by your mouth.'
translation:
  language: ru
  text: 'Итак, вот о чём я прошу, господин царь, вот с какой просьбой обращаюсь к тебе, и в этом проявится твоё великодушие: умоляю тебя исполнить обет[a], который я дал Царю Небесному, — исполнить его по слову твоих уст[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполнить молитвенное обещание». Греческое слово может означать как обет, так и молитву, но здесь однокоренное выражение «обет, который я дал» поддерживает значение обета.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из твоих уст»; вероятно, имеется в виду произнесённое царём повеление или разрешение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιῶ
  choice: прошу
  rationale: В придворной просительной речи глагол обозначает почтительное обращение с просьбой, а не требование как право.
- source_word: αἰτοῦμαί
  choice: с какой просьбой обращаюсь
  rationale: Передаёт формальную просьбу и сохраняет риторическое удвоение с ἀξιῶ, не создавая неестественного повтора по-русски.
- source_word: μεγαλωσύνη ἡ παρὰ σοῦ
  choice: в этом проявится твоё великодушие
  rationale: Контекст указывает не только на отвлечённое величие царя, но и на исходящий от него великодушный поступок; формулировка естественна для современной русской речи.
- source_word: δέομαι
  choice: умоляю
  rationale: Передаёт усиленную, настоятельную просьбу по сравнению с предшествующими глаголами.
- source_word: ποιήσῃς τὴν εὐχήν
  choice: исполнить обет
  rationale: Буквальное «сделать обет» в данном контексте означает осуществить обещанное; сочетание εὐχή с однокоренным ηὐξάμην преимущественно указывает на обет.
- source_word: ηὐξάμην
  choice: который я дал
  rationale: Русское «дать обет» естественно передаёт значение глагола и сохраняет связь с существительным «обет».
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: Царю Небесному
  rationale: Сохраняет божественный титул и ясно отличает Бога от земного царя, к которому обращена речь.
- source_word: ἐκ στόματός σου
  choice: по слову твоих уст
  rationale: Сохраняет конкретный образ уст и одновременно передаёт контекстуальный смысл царского устного повеления или разрешения.
theological_decisions:
- issue: Кого обозначает титул «Царь Небесный»
  choice: Бога
  alternative: небесного царя как менее определённое обозначение
  rationale: В иудейском придворном контексте это почтительный божественный титул, противопоставленный земному царю.
- issue: Значение εὐχή / ηὐξάμην
  choice: обетная формула
  alternative: молитва или молитвенная просьба
  rationale: Однокоренная конструкция εὐχή ἣν ηὐξάμην и требование её исполнить сильнее поддерживают смысл обета, хотя лексически εὐχή может обозначать и молитву.
- issue: Сила выражения ἐκ στόματός σου
  choice: исполнение посредством слова или повеления царя
  alternative: строго буквальное действие «из твоих уст»
  rationale: Образ сохранён, но в придворном контексте речь, вероятнее всего, идёт о произнесённом царём разрешении или приказе; субъектно-синтаксическая напряжённость исходной фразы не развёрнута в отдельное догматическое толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Обращение «господин царь» сохраняет почтительность оригинала без архаического «о царь». Риторическое удвоение просьбы сохранено, а буквальные греческие идиомы переданы естественно и пояснены в сносках.
