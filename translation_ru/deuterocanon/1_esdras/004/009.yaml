base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and whoever the king and the three nobles of Persia judge that his argument is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: ru
  text: 'Они сказали: «Когда царь встанет, ему передадут документ[a]. Тому же, чьё рассуждение царь и три персидских вельможи сочтут более мудрым[b], будет присуждена победа, как написано».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «запись», «написанное»; греч. τὸ γράμμα.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чью речь» или «чьи доводы»; греч. ὁ λόγος αὐτοῦ σοφώτερος.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθῇ
  choice: встанет
  rationale: В данном контексте форма ἐγείρω означает, что царь встанет — вероятно, ото сна или со своего места; перевод не уточняет это сверх греческого текста.
- source_word: τὸ γράμμα
  choice: документ
  rationale: γράμμα здесь обозначает не частное письмо, а письменный материал, который передадут царю для рассмотрения; «документ» естественно звучит по-русски.
- source_word: κρίνῃ
  choice: сочтут
  rationale: Глагол выражает оценочное решение царя и вельмож; конструкция «сочтут более мудрым» естественнее буквального «рассудят, что…».
- source_word: μεγιστᾶνες
  choice: вельможи
  rationale: Слово обозначает высокопоставленных персидских сановников; «вельможи» передаёт высокий общественный ранг и соответствует историческому контексту.
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: чьё рассуждение … более мудрым
  rationale: λόγος в состязании означает изложенное участником суждение или довод, а не отдельное слово; «рассуждение» сохраняет риторический смысл и сравнительную форму σοφώτερος.
- source_word: τὸ νῖκος
  choice: победа
  rationale: νῖκος прямо означает победу; пассивная конструкция передана естественным русским выражением «будет присуждена победа».
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Перфектная пассивная формула указывает на зафиксированные письменно условия и сохраняется без лишнего уточнения.
