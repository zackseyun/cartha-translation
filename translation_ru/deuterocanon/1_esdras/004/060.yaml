    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς εἶ
  choice: Благословен Ты
  rationale: Предикативное прилагательное в молитвенном благословении Бога. Традиционная русская формула естественна, торжественна и не сводит выражение лишь к человеческой похвале.
- source_word: ὃς ἔδωκάς μοι σοφίαν
  choice: давший мне мудрость
  rationale: Причастный оборот естественно передаёт определительное придаточное с аористом и связывает дар мудрости с нынешним благословением Бога.
- source_word: σοφίαν
  choice: мудрость
  rationale: Прямое и устойчивое соответствие греческому σοφία без неоправданного сужения значения до «понимания».
- source_word: σοὶ ὁμολογῶ
  choice: Тебе я воздаю благодарение
  rationale: В молитвенном контексте ὁμολογῶ с дательным адресата может выражать открытое признание, хвалу и благодарность. Основной текст передаёт наиболее естественный здесь благодарственный смысл, а примечание сохраняет широту греческого глагола.
- source_word: δέσποτα
  choice: Владыка
  rationale: «Владыка» выражает верховную власть и сохраняет отличие δέσποτα от κύριος, обычно передаваемого словом «Господь».
- source_word: τῶν πατέρων
  choice: отцов
  rationale: Перевод сохраняет явно мужской род и не добавляет отсутствующее в греческом местоимение «наших».
theological_decisions:
- issue: Передача обращения δέσποτα к Богу
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: «Владыка» естественно звучит в молитвенном обращении и сохраняет лексическое отличие от κύριος, не подменяя один божественный титул другим.
- issue: Передача πατέρων
  choice: отцов
  alternative: предков; праотцов; наших отцов
  rationale: Греческий текст говорит именно об «отцах», не содержит «наших» и сам по себе не требует уточнения «праотцы».
- issue: Молитвенный смысл ὁμολογῶ
  choice: воздаю благодарение
  alternative: исповедую; признаю; восхваляю
  rationale: 'Контекст обращения к Богу поддерживает благодарственный оттенок, однако многозначность глагола не устраняется: основные альтернативы вынесены в примечание.'
translation_notes:
  register: Современный литературный русский с достоинством молитвенного обращения. Инверсия «Благословен Ты» и титул «Владыка» сохраняют возвышенный библейский регистр, оставаясь понятными современному читателю. Заглавные буквы в местоимениях обращения употреблены как русская благоговейная издательская норма.
