  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: ru
  text: И ты дал обет отстроить храм, который сожгли иудеи, когда Иудея была опустошена халдеями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «который сожгли иудеи». Это трудное чтение отличается от более известного повествования, согласно которому храм сожгли халдеи (вавилоняне).'
    reason: Сохранить необычное чтение исходного греческого текста и открыто обозначить его расхождение с более известной исторической традицией.
lexical_decisions:
- source_word: εὔξω
  choice: дал обет
  rationale: Форма от εὔχομαι здесь сочетается с инфинитивом действия и обозначает принятое на себя обязательство; «дал обет» точнее передаёт этот смысл, чем «помолился».
- source_word: οἰκοδομῆσαι
  choice: отстроить
  rationale: Глагол буквально означает «построить», но речь идёт о восстановлении ранее сожжённого храма; «отстроить» естественно передаёт подразумеваемое восстановление.
- source_word: τὸν ναὸν
  choice: храм
  rationale: В данном контексте ναός обозначает Иерусалимский храм; «храм» — точный и естественный русский эквивалент.
- source_word: ἐνεπύρισαν
  choice: сожгли
  rationale: Глагол означает «предать огню, сжечь». «Сожгли» передаёт действие прямо, не добавляя уточнения о степени разрушения.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохранено прямое обозначение группы в греческом тексте. В историческом контексте слово может иметь этнорегиональный смысл — жители Иудеи.
- source_word: ἐρημώθη
  choice: была опустошена
  rationale: Пассивная форма выражает разорение и запустение страны; «была опустошена» точно и естественно звучит по-русски.
- source_word: Χαλδαίων
  choice: халдеями
  rationale: Греческий текст прямо называет халдеев. Замена на «вавилонянами» была бы историческим пояснением, а не переводом данного слова.
theological_decisions:
- issue: Необычное указание, что храм сожгли иудеи
  choice: 'Сохранено чтение греческого текста: «который сожгли иудеи»'
  alternative: «который сожгли халдеи/вавилоняне»
  rationale: В исходном греческом οἱ Ἰουδαῖοι является подлежащим при ἐνεπύρισαν. Хотя это расходится с более известным историческим повествованием, перевод не исправляет и не гармонизирует трудное чтение, а поясняет его в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным повествовательным строем. Формулировка сохраняет необычное чтение греческого текста без скрытой гармонизации; сноска делает проблему прозрачной для читателя.
