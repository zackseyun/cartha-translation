  source_fidelity: 'Оборот ἀπὸ Βαβυλῶνος в греческом тексте относится к действию ἐχώρισεν и прямо выражает исходную точку («из/от Вавилона»), а не место действия («в Вавилоне»). Черновик заменяет это отношение обстоятельством места. Остальная структура сохранена: emphatic καὶ αὐτός передано как «он также», а два инфинитива после ἐπέταξεν — русскими инфинитивами.'
  naturalness: Исправленный текст остаётся современным литературным русским и сохраняет сжатый административный стиль. «Выделил из Вавилона» несколько необычно, но намеренно воспроизводит формулировку исходника без не подтверждаемого уточнения о месте выделения.
  terminology: «Сосуды» уместно для τὰ σκεύη в храмовом контексте. «Приказал» адекватно передаёт ἐπέταξεν. Не следует добавлять «храмовые», поскольку этого определения в данном стихе нет.
