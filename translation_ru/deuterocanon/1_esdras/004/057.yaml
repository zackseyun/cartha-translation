  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said to do[a], he himself also ordered to be done and sent to Jerusalem.
translation:
  language: ru
  text: И он отправил обратно[a] все сосуды, которые Кир выделил из Вавилона; и всё, что Кир сказал сделать, он также приказал сделать и отправить в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выслал»; контекст возвращения сосудов позволяет перевести «отправил обратно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: отправил обратно
  rationale: Глагол означает «выслал, отправил»; в контексте возвращения храмовых сосудов из Вавилона «обратно» естественно передаёт подразумеваемое возвращение, отмеченное сноской.
- source_word: τὰ σκεύη
  choice: сосуды
  rationale: В контексте храмового имущества слово обозначает священные сосуды или принадлежности; «сосуды» — традиционное, понятное и достаточно точное соответствие.
- source_word: ἃ ἐχώρισεν Κῦρος ἀπὸ Βαβυλῶνος
  choice: которые Кир отделил в Вавилоне
  rationale: χωρίζω передаёт отделение или выделение предметов; оборот ἀπὸ Βαβυλῶνος допускает связь как с отделением от Вавилона, так и с отправлением из Вавилона. Русская формулировка избегает неестественного «отделил от Вавилона» и передаёт контекст выделения сосудов там.
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: всё, что Кир велел сделать
  rationale: Буквально это «всё, что Кир сказал сделать»; «велел» естественно выражает распорядительный смысл инфинитивной конструкции без добавления содержания.
- source_word: καὶ αὐτὸς
  choice: он и сам
  rationale: Сохраняет эмфатическое αὐτός и добавочное значение καί.
- source_word: ἐπέταξεν
  choice: приказал
  rationale: Точно передаёт властное административное распоряжение.
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι εἰς Ἰερουσαλήμ
  choice: сделать и отправить в Иерусалим
  rationale: Сохраняет два координированных инфинитива и направление действия; русский инфинитив после «приказал» не требует искусственной пассивной конструкции.
