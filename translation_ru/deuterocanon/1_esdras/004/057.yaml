  - severity: low
    issue: «Кир велел сделать»
    rationale: εἶπεν ποιῆσαι буквально означает «сказал сделать»; «велел» возможно по контексту, но в сочетании с последующим «приказал» ослабляет различение между εἶπεν и ἐπέταξεν. Нейтральное «сказал сделать» ближе к тексту.
