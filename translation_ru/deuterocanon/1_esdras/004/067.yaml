  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: ru
  text: И ты дал обет отстроить храм, который сожгли иудеи, когда Иудея была разорена халдеями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч.: «который сожгли иудеи». В свете параллельных исторических преданий здесь можно было бы ожидать «который сожгли халдеи (вавилоняне)», однако в представленном греческом тексте прямо сказано «иудеи».'
    reason: alternative_reading
lexical_decisions:
- source_word: εὔξω
  choice: дал обет
  rationale: Аористная форма от εὔχομαι в данном контексте обозначает торжественно принятое обязательство; «дал обет» точнее, чем более общее «обещал», и уместнее, чем «молился».
- source_word: οἰκοδομῆσαι
  choice: отстроить
  rationale: Буквально глагол означает «построить», но речь идёт о ранее сожжённом храме; «отстроить» естественно передаёт восстановление здания, не добавляя идеи сверх контекста.
- source_word: τὸν ναὸν
  choice: храм
  rationale: ναός здесь обозначает храмовое здание в Иерусалиме; «храм» — ясный и общепринятый русский эквивалент.
- source_word: ἐνεπύρισαν
  choice: сожгли
  rationale: Глагол означает предать огню, сжечь. «Сожгли» кратко и точно; более сильное «сожгли дотла» выходило бы за пределы греческой формулировки.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: В историческом контексте слово может обозначать народ Иудеи. «Иудеи» сохраняет этногеографический оттенок и прямо передаёт субъект, названный в греческом тексте.
- source_word: ἐρημώθη
  choice: была разорена
  rationale: Пассивная форма выражает опустошение и разорение страны; эта формулировка естественна по-русски и сохраняет вес исходного выражения.
- source_word: Χαλδαίων
  choice: халдеями
  rationale: Греческий текст прямо называет халдеев. Сохранение исторического этнонима предпочтительнее интерпретирующего варианта «вавилонянами».
theological_decisions:
- issue: Кому приписано сожжение храма
  choice: 'Сохранено прямое чтение греческого текста: храм «сожгли иудеи».'
  alternative: Передать без указания виновников («который был сожжён») либо приписать сожжение халдеям/вавилонянам согласно параллельным историческим преданиям.
  rationale: В представленном греческом тексте οἱ Ἰουδαῖοι является явным подлежащим при ἐνεπύρισαν. Историческое напряжение не следует устранять молчаливым исправлением источника; оно сохраняется в основном тексте и поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным историко-библейским звучанием. Синтаксис остаётся ясным для широкого круга читателей; архаизмы не используются. Исторически напряжённое чтение исходного текста сохранено без сглаживания.
