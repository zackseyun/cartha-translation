  text: Then he said to the king[a], “Remember the vow that I made to rebuild Jerusalem on the day when you received your kingdom,”
translation:
  language: ru
  text: 'Тогда он сказал царю: «Вспомни обет[a], который я дал, — отстроить Иерусалим в день, когда ты получил своё царство».


    [a] Или: «Вспомни молитву, которую я вознёс, чтобы отстроить Иерусалим…» Греческие слова εὐχή и ηὐξάμην могут означать как обет, так и молитву; в данном контексте вероятнее имеется в виду данное обязательство.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вспомни молитву, которую я вознёс, чтобы отстроить Иерусалим…» Греческие слова εὐχή и ηὐξάμην могут означать как обет, так и молитву; в данном контексте вероятнее имеется в виду данное обязательство.'
