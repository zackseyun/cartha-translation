lexical_decisions:
- source_word: Μνήσθητι
  choice: Вспомни
  rationale: Аористный императив выражает прямую просьбу к царю; «вспомни» естественно и точно передаёт призыв удержать в памяти ранее данное обязательство.
- source_word: εὐχήν
  choice: обет
  rationale: Существительное может означать как обет, так и молитву. Здесь инфинитив «восстановить Иерусалим» обозначает конкретное обязательство, поэтому в основном тексте выбрано «обет», а другая возможность сохранена в сноске.
- source_word: ηὐξάμην
  choice: я дал
  rationale: В сочетании с существительным «обет» идиоматическое русское выражение — «дал обет»; оно избегает неестественного повтора и сохраняет смысл греческой конструкции.
- source_word: οἰκοδομῆσαι
  choice: восстановить
  rationale: Сам глагол означает «построить», но применительно к разрушенному Иерусалиму контекст восстановления делает «восстановить» наиболее ясным современным соответствием.
- source_word: παρέλαβες
  choice: ты принял
  rationale: Глагол обозначает получение или принятие царской власти; «принял» не вносит оттенка насильственного захвата.
- source_word: τὸ βασίλειόν σου
  choice: своё царство
  rationale: В контексте восшествия на престол выражение может обозначать и царство, и царскую власть. «Своё царство» сохраняет конкретный образ исходного текста и естественно звучит по-русски.
theological_decisions:
- issue: Значение εὐχή / ηὐξάμην
  choice: Обет, данный говорящим
  alternative: Молитва, вознесённая говорящим
  rationale: Сочетание существительного и глагола допускает оба значения. Конкретное содержание — восстановить Иерусалим — в данном контексте скорее указывает на обязательство; молитвенное прочтение не исключено и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, умеренно торжественным повествовательным регистром. Прямая речь передана без архаизмов; лексическая неоднозначность греческого текста сохранена посредством сноски.
