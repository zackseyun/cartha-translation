  text: And to all who guarded the city[a], he wrote that allotments and wages should be given to them.
translation:
  language: ru
  text: Он также письменно распорядился, чтобы всем, кто охранял город, выдали доли[a] и жалованье.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наделы»; буквально: «жребии», то есть доставшиеся или назначенные доли.'
    reason: Слово κλήρους допускает как буквальное значение «жребии», так и производные значения «доли», «наделы».
lexical_decisions:
- source_word: φρουροῦσι
  choice: кто охранял
  rationale: Причастие обозначает тех, кто охранял город или нёс его стражу; такой перевод естественен по-русски и сохраняет защитно-военный смысл.
- source_word: τὴν πόλιν
  choice: город
  rationale: Определённость, выраженная греческим артиклем, в русском контексте передаётся без обязательного отдельного указательного слова.
- source_word: ἔγραψε
  choice: письменно распорядился
  rationale: Глагол буквально означает «написал», но конструкция с инфинитивом в административном контексте выражает письменное распоряжение. Перевод сохраняет письменный характер действия, не превращая его в более сильное «повелел».
- source_word: δοῦναι αὐτοῖς
  choice: чтобы … выдали
  rationale: Инфинитив передаёт содержание письменного распоряжения; неопределённо-личная конструкция естественна по-русски, поскольку исполнитель в греческом тексте не назван.
- source_word: κλήρους
  choice: доли
  rationale: κλῆρος может означать жребий, полученную по жребию долю или выделенную часть. «Доли» сохраняет широту значения и не сужает его до земельных наделов.
- source_word: ὀψώνια
  choice: жалованье
  rationale: Слово обозначает содержание или плату, особенно военным и служащим. «Жалованье» естественно передаёт регулярное вознаграждение в данном административном контексте.
