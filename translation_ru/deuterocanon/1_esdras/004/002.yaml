lexical_decisions:
- source_word: σατράπαις
  choice: сатрапам
  rationale: Сохраняет конкретный персидский административный титул и его лексическую связь с «сатрапиями» в конце стиха.
- source_word: στρατηγοῖς
  choice: военачальникам
  rationale: Передаёт основное военное значение термина естественным современным русским словом и отличает эту должность от гражданских правителей.
- source_word: τοπάρχαις
  choice: местным правителям
  rationale: Обозначает правителей меньших областей или округов; перевод понятен современному читателю и сохраняет административное различие.
- source_word: τοῖς ὑπʼ αὐτὸν
  choice: подвластным ему
  rationale: Ясно выражает политическое подчинение царю, подразумеваемое греческим оборотом.
- source_word: ἀπὸ τῆς Ἰνδικῆς μέχρι Αἰθιοπίας
  choice: от Индии до Эфиопии
  rationale: Естественно передаёт формулу, обозначающую географические пределы державы.
- source_word: ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις
  choice: во всех ста двадцати семи сатрапиях
  rationale: «Во всех» естественно передаёт распределительный смысл ἐν в данном перечне, а «сатрапиях» сохраняет конкретную имперскую терминологию и связь с «сатрапами».
