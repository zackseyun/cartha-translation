  yaml_path: translation/deuterocanon/1_esdras/004/039.yaml
  text: and with her there is no partiality or favoritism[a], but she does what is just rather than all that is unjust and wicked; and all approve of her works[b],
translation:
  language: ru
  text: И у неё нет ни лицеприятия, ни различий[a]; напротив, она поступает справедливо, чуждаясь всего несправедливого и злого, и все одобряют её дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение, переданное словом «лицеприятие», буквально означает «принимать лица» и обозначает пристрастное отношение. Слово, переведённое как «различия», может также означать предпочтения или фаворитизм.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαμβάνειν πρόσωπα
  choice: лицеприятие
  rationale: Буквально выражение означает «принимать лица», но это греческий идиоматический оборот о пристрастном отношении к людям. «Лицеприятие» точно передаёт судебно-нравственный смысл и понятно в библейском контексте.
- source_word: διάφορα
  choice: корысть
  rationale: Субстантивированная форма допускает значения, связанные с различием, преимуществом, выгодой или вознаграждением. В сочетании с выражением о лицеприятии «корысть» естественно передаёт мысль о выгоде, способной исказить справедливое решение, не сужая её исключительно до формальной взятки.
- source_word: τὰ δίκαια ποιεῖ
  choice: она поступает справедливо
  rationale: Нейтральное множественное τὰ δίκαια буквально означает «справедливое» или «то, что справедливо». Русское выражение «поступает справедливо» естественно передаёт нравственно-судебный смысл.
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: сторонясь всего несправедливого и злого
  rationale: Предлог ἀπό выражает удаление или отделение. «Сторонясь» сохраняет эту пространственно-нравственную образность. Род греческих субстантивированных прилагательных допускает понимание как дел или явлений, так и людей; основной текст выбирает первое, а сноска сохраняет альтернативу.
- source_word: εὐδοκοῦσι τοῖς ἔργοις αὐτῆς
  choice: одобряют её дела
  rationale: Глагол εὐδοκέω здесь означает благосклонно относиться, быть довольным или одобрять. «Одобряют» ясно выражает нравственную оценку дел истины.
- source_word: αὐτὴν / αὐτῆς
  choice: неё / её; она
  rationale: Местоимения относятся к ἀλήθεια, «истине», которая в греческом тексте персонифицирована. Русское «истина» также женского рода, поэтому личный образ сохраняется естественно.
theological_decisions:
- issue: Олицетворение истины
  choice: 'Сохранить женский личный образ: «у неё», «она», «её».'
  alternative: Передать истину безлично или заменить местоимения повторением слова «истина».
  rationale: Греческий контекст риторически изображает истину как действующее лицо. В русском языке такое олицетворение естественно и не требует дополнительного богословского истолкования.
- issue: Объект, от которого истина удаляется
  choice: Понимать τῶν ἀδίκων καὶ πονηρῶν как всё несправедливое и злое.
  alternative: 'Понимать выражение лично: «всех несправедливых и злых людей».'
  rationale: Греческая форма допускает обе возможности. Основной вариант лучше согласуется с противопоставлением «справедливого» и «несправедливого и злого», а альтернативное личное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; олицетворение истины и разделительное значение ἀπό сохранены. Неясность διάφορα и возможное личное понимание субстантивированных прилагательных вынесены в сноски.
