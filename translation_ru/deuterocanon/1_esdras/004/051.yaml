  text: and for the building of the temple[b][a], that twenty talents be given each year until it is built.
translation:
  language: ru
  text: и чтобы на строительство храма ежегодно выдавали двадцать талантов[a], пока храм не будет построен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — крупная древняя мера веса, применявшаяся, в частности, для драгоценных металлов и при денежных расчётах.
    reason: cultural_note
lexical_decisions:
- source_word: οἰκοδομήν
  choice: строительство
  rationale: Существительное обозначает процесс или дело строительства; в данном административном контексте «на строительство» естественно выражает назначение средств.
- source_word: ἱεροῦ
  choice: храма
  rationale: Ἱερόν здесь относится к восстанавливаемому храму; «храм» — ясный и контекстуально точный русский эквивалент.
- source_word: δοθῆναι
  choice: выдавали
  rationale: Пассивный инфинитив указывает на предписанную регулярную передачу средств. Неопределённо-личная форма по-русски естественно передаёт пассивный административный смысл, не уточняя плательщика.
- source_word: κατʼ ἐνιαυτόν
  choice: ежегодно
  rationale: Наречие кратко и точно передаёт повторение выплаты каждый год.
- source_word: τάλαντα εἴκοσι
  choice: двадцать талантов
  rationale: Сохранено традиционное название древней крупной весовой и расчётной единицы; пояснение дано в сноске.
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: пока храм не будет построен
  rationale: Оборот обозначает срок до завершения строительства. Повтор слова «храм» устраняет неестественную для русского языка местоименную двусмысленность, не добавляя нового референта.
