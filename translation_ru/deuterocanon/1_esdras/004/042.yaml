base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/042.yaml
  text: Then the king said to him[a], “Ask for whatever more you want beyond what has been written, and we will give it to you, because you have been found wiser; and you shall sit beside me[c][b], and you shall be called my kinsman.”
translation:
  language: ru
  text: 'Тогда царь сказал ему: «Проси чего пожелаешь сверх того, что написано[a], и мы дадим тебе, потому что ты оказался мудрее. Ты будешь сидеть рядом со мной[b] и будешь называться моим родичем[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проси чего пожелаешь в дополнение к написанному». Вероятно, имеются в виду уже записанные или письменно назначенные награды.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будешь сидеть возле меня». Греческое выражение обозначает близость к царю и почётное место при дворе.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «моим родственником». Здесь это выражение может обозначать дарованный царём высокий статус, а не буквальное кровное родство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἴτησαι
  choice: Проси
  rationale: Аористный императив передаёт прямое приглашение-повеление царя; «проси» естественно и точно в данном контексте.
- source_word: ὃ θέλεις πλείω τῶν γεγραμμένων
  choice: сверх того, что написано, чего пожелаешь
  rationale: Сохраняет открытое значение ὃ θέλεις («чего пожелаешь»), сравнительную силу πλείω и прямую отсылку к уже написанному, не уточняя в основном тексте, что именно было записано.
- source_word: δώσομέν σοι
  choice: мы дадим тебе
  rationale: Передаёт будущее время и множественное число греческого текста; возможный царский плюралитет не сглаживается до единственного числа.
- source_word: ὃν τρόπον
  choice: потому что
  rationale: В контексте выражение вводит основание обещанной награды; причинная связь по-русски передаётся ясно и естественно.
- source_word: εὑρέθης σοφώτερος
  choice: ты оказался мудрее
  rationale: «Оказался» естественно передаёт результат установленной оценки, а «мудрее» сохраняет сравнительную степень без добавления отсутствующего в стихе объекта сравнения.
- source_word: ἐχόμενός μου καθήσῃ
  choice: ты будешь сидеть рядом со мной
  rationale: ἐχόμενος с родительным обозначает непосредственную близость; в придворном контексте речь идёт о почётном месте возле царя.
- source_word: συγγενής μου κληθήσῃ
  choice: тебя будут называть моим родичем
  rationale: Пассивная конструкция сохранена, а «родич» передаёт семейно-статусное значение συγγενής и звучит достойно, не утверждая буквального кровного родства.
theological_decisions:
- issue: Придворное обозначение συγγενής μου
  choice: тебя будут называть моим родичем
  alternative: тебя будут называть моим родственником
  rationale: «Родич» сохраняет оттенок возвышенного придворного статуса и образ родства; «родственник» мог бы сильнее подразумевать буквальную генеалогическую связь.
- issue: Неуказанный объект сравнения в σοφώτερος
  choice: мудрее
  alternative: мудрее других
  rationale: Греческий текст оставляет объект сравнения подразумеваемым, поэтому перевод не восполняет его и сохраняет исходную недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным придворным регистром. Синтаксис разделён на два предложения для ясности, при сохранении последовательности царских обещаний. Формы «мы дадим» и «тебя будут называть» отражают число и залог греческого текста.
