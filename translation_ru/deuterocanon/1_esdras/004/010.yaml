lexical_decisions:
- source_word: ὁ εἷς
  choice: Один
  rationale: В контексте состязания выражение обозначает одного из участников; краткое «один» сохраняет неопределённо-распределительный смысл и естественно звучит по-русски.
- source_word: ἔγραψεν
  choice: написал
  rationale: Аорист γράφω прямо обозначает завершённое действие «написал»; простое прошедшее время соответствует повествовательной последовательности.
- source_word: Ὑπερισχύει
  choice: сильнее
  rationale: Глагол означает превосходить силой или одерживать верх. В контексте вопроса о том, что сильнее всего, сравнительная формулировка наиболее ясна и естественна.
- source_word: ὁ οἶνος
  choice: вино
  rationale: Артикль при существительном имеет обобщающее значение; в русском родовое понятие естественно передаётся без указательного оттенка.
