  text: And many were destroyed and were led astray and sinned because of women[a].
translation:
  language: ru
  text: И многие погибли, и сбились с пути, и согрешили из-за женщин[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за жён». Греческое слово γυναῖκες в зависимости от контекста может означать как женщин, так и жён.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: многие
  rationale: Естественная передача количественного прилагательного во множественном числе.
- source_word: ἀπώλοντο
  choice: погибли
  rationale: Аорист от ἀπόλλυμι обозначает гибель или уничтожение; «погибли» сохраняет силу выражения и не требует уточнять характер гибели.
- source_word: ἐσφάλησαν
  choice: сбились с пути
  rationale: Пассивная/непереходная форма от σφάλλω передаёт уклонение от верного пути или ошибку; выражение естественно в русском и сохраняет нравственный оттенок, не вводя явно действующего соблазнителя.
- source_word: ἡμάρτοσαν
  choice: согрешили
  rationale: Стандартная и точная передача ἁμαρτάνω в нравственно-религиозном контексте.
- source_word: διὰ τὰς γυναῖκας
  choice: из-за женщин
  rationale: διά с винительным выражает причину; «из-за» прямо и естественно передаёт причинную связь. В данном обобщённом контексте γυναῖκας вероятнее означает «женщин», хотя возможно и значение «жён».
theological_decisions:
- issue: Резко звучащая причинная связь между женщинами и гибелью, заблуждением и грехом
  choice: из-за женщин
  alternative: из-за жён
  rationale: Греческий текст прямо выражает причину посредством διά с винительным падежом. Перевод сохраняет риторику и напряжённость исходного текста, не смягчая и не расширяя его утверждение; лексическая неоднозначность γυναῖκας отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая трёхчастная конструкция сохраняет греческий синтаксический параллелизм. «Сбились с пути» звучит естественнее буквального «споткнулись» и не усиливает значение до «были обмануты».
