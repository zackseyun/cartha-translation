  text: And they blessed the God of their fathers, because he had given them relief and release.
translation:
  language: ru
  text: И они благословили Бога своих отцов за то, что Он даровал им облегчение и освобождение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλόγησαν
  choice: благословили
  rationale: 'Прямо передаёт обычное библейское значение глагола в отношении Бога: вознесли Ему хвалу.'
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  choice: Бога своих отцов
  rationale: Естественная русская формулировка, сохраняющая связь с предками и заветной историей народа.
- source_word: ἄνεσιν
  choice: облегчение
  rationale: Передаёт ослабление тягот и наступление передышки; не сужает значение до одного лишь физического покоя.
- source_word: ἄφεσιν
  choice: освобождение
  rationale: В данном контексте обозначает отпуск, избавление или предоставление свободы; «освобождение» сохраняет широту смысла и не вводит без необходимости значение прощения грехов.
theological_decisions:
- issue: Значение ἄφεσις
  choice: освобождение
  alternative: прощение / отпущение
  rationale: Хотя слово может означать «прощение», сочетание с ἄνεσις и повествовательный контекст лучше поддерживают смысл освобождения или отпуска. Перевод не придаёт фразе специально сотериологического значения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Местоимение «Он» написано с прописной буквы согласно распространённой русской религиозной издательской норме; синтаксис сделан естественным без утраты причинной связи ὅτι.
