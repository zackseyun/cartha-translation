translation:
  language: ru
  text: Мужи, разве не одерживает верх вино, раз оно заставляет так поступать? С этими словами он умолк.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: Мужи
  rationale: Прямое обращение во множественном числе; «мужи» сохраняет мужской адресат и уместный для публичной речи возвышенный, но понятный регистр.
- source_word: οὐχ ὑπερισχύει ὁ οἶνος
  choice: разве не превосходит всех вино
  rationale: Риторический вопрос передаёт ожидаемый утвердительный ответ. Глагол ὑπερισχύω означает «быть сильнее, одолевать, превосходить»; «всех» естественно восполняет подразумеваемое сравнение из контекста состязания.
- source_word: ὅτι οὕτως ἀναγκάζει ποιεῖν
  choice: раз оно заставляет поступать так
  rationale: ἀναγκάζει выражает принуждение, а неопределённый объект глагола естественно остаётся невыраженным по-русски. «Поступать так» сохраняет широкий смысл ποιεῖν и указание οὕτως на перечисленные ранее действия.
- source_word: καὶ ἐσίγησεν
  choice: он умолк
  rationale: Аорист обозначает наступившее молчание и завершение речи; «умолк» кратко и естественно передаёт повествовательный переход.
- source_word: οὕτως εἴπας
  choice: Сказав это
  rationale: Причастный оборот передаёт предшествование речи молчанию; в данном контексте οὕτως естественно относится к только что сказанному и по-русски идиоматично выражается словом «это».
