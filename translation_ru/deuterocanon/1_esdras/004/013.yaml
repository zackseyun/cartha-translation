  text: And when the king awoke[a], they took the letter and gave it to him[b], and he read it.
translation:
  language: ru
  text: Когда царь проснулся, они взяли письмо[a], подали его царю, и он прочитал его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «письменный текст»; возможно также: «документ».'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол может означать как просто «прочитал», так и, в некоторых контекстах, «прочитал вслух»; здесь чтение вслух прямо не указано.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐξηγέρθη
  choice: когда царь проснулся
  rationale: Аорист пассивной формы ἐξεγείρω может употребляться непереходно в значении пробуждения или вставания. По контексту естественнее всего «проснулся»; это не навязывает буквального значения «был разбужен».
- source_word: λαβόντες
  choice: они взяли
  rationale: Сопутствующее причастие естественно передано личной формой, сохраняющей последовательность действий.
- source_word: τὸ γράμμα
  choice: письмо
  rationale: γράμμα обозначает здесь переданный царю письменный текст или документ. «Письмо» кратко и естественно, а возможная более широкая семантика отмечена в сноске.
- source_word: ἔδωκαν αὐτῷ
  choice: подали его царю
  rationale: «Подали» естественно описывает передачу документа царю. Повтор «царю» вместо местоимения устраняет в русском тексте возможную двусмысленность.
- source_word: ἀνέγνω
  choice: он прочитал его
  rationale: Глагол означает «прочитал» и в некоторых контекстах может подразумевать чтение вслух. Дополнение «его» естественно восстанавливается из предыдущей части фразы.
