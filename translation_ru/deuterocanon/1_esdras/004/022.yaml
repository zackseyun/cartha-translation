lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: Передаёт общее временное условие естественным русским союзом; значение «всякий раз, когда» возможно, но здесь излишне тяжеловесно.
- source_word: ἀπὸ τοῦ οἴνου
  choice: от вина
  rationale: Сохраняет необычное, но ясное выражение греческого текста и не заменяет его более толковательным словом «опьянение».
- source_word: ἐγερθῶσιν
  choice: очнутся
  rationale: В контексте речь идёт о приходе в себя после воздействия вина. «Очнутся» естественнее по-русски, чем буквальное «встанут», и сохраняет вероятный смысл пробуждения.
- source_word: οὐ μέμνηται
  choice: не помнят
  rationale: Несмотря на форму единственного числа в издании Swete, по смыслу сказуемое относится к подразумеваемому множественному субъекту; русское согласование требует множественного числа.
- source_word: ἃ ἔπραξαν
  choice: что сделали
  rationale: Кратко и естественно передаёт относительное придаточное без ненужного уточнения временной последовательности.
