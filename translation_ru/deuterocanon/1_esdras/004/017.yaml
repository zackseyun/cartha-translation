lexical_decisions:
- source_word: Ἄνδρες
  choice: Мужи
  rationale: Звательная форма множественного числа от ἀνήρ представляет собой прямое обращение к мужчинам. «Мужи» сохраняет мужской род, торжественную риторическую силу и уместно в литературном русском тексте.
- source_word: πῶς ὑπερισχύει
  choice: как велика сила
  rationale: В восклицательной конструкции πῶς указывает на степень, а ὑπερισχύει — на превосходящую силу или способность брать верх. Русское выражение естественно передаёт эту мысль, не добавляя не названного в греческом объектa превосходства.
- source_word: ὁ οἶνος
  choice: вина
  rationale: Прямое соответствие слову «вино»; родительный падеж обусловлен естественной русской конструкцией «сила вина».
- source_word: πάντας τοὺς ἀνθρώπους
  choice: всех людей
  rationale: ἄνθρωπος здесь естественно допускает обобщённое значение «человек, люди». Такой перевод отличает эту группу от конкретного мужского обращения Ἄνδρες и не сужает смысл без достаточного основания.
- source_word: τοὺς πίοντας αὐτόν
  choice: которые его пьют
  rationale: Определительный оборот с причастием настоящего времени передаёт общее, повторяющееся действие; личная форма звучит естественно по-русски.
- source_word: πλανᾷ τὴν διάνοιαν
  choice: вводит в заблуждение разум
  rationale: πλανάω означает уводить с верного пути или вводить в заблуждение, а διάνοια — разум, мыслительную способность. Перевод сохраняет интеллектуальную направленность выражения и не усиливает его до «лишает разума» или «помрачает разум».
