  yaml_path: translation/deuterocanon/1_esdras/004/044.yaml
  text: and all the vessels taken from Jerusalem are to be sent back[a], which Cyrus set apart when he vowed to destroy Babylon[b], and vowed to send there.
translation:
  language: ru
  text: и отослать обратно все сосуды, взятые из Иерусалима, которые Кир выделил, когда дал обет уничтожить Вавилон, и дал обет отправить их туда[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда решил уничтожить Вавилон». Греческий глагол может означать «молиться» или «давать обет»; в этой конструкции с инфинитивом возможно также понимание как торжественного решения. В исходном тексте этот глагол повторён.'
    reason: lexical_alternative
  - marker: b
    text: Вероятнее всего, «туда» означает «в Иерусалим», то есть сосуды надлежало возвратить туда, откуда они были взяты. Греческое выражение кратко и не называет место повторно.
    reason: alternative_reading
lexical_decisions:
- source_word: σκεύη
  choice: сосуды
  rationale: В храмовом контексте слово обозначает сосуды или принадлежности; «сосуды» сохраняет культовый оттенок, не добавляя лишней конкретики.
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  choice: взятые из Иерусалима
  rationale: Нейтрально передаёт причастие и исходный пункт; контекст указывает на ранее увезённые храмовые сосуды.
- source_word: ἐκπέμψαι
  choice: отослать обратно
  rationale: Сам глагол означает «выслать, отослать», а «обратно» естественно выражает контекст возвращения сосудов в Иерусалим.
- source_word: ἐχώρισεν
  choice: отделил
  rationale: Сохраняет прямое значение глагола и допускает административный смысл «выделил, предназначил», не конкретизируя его без необходимости.
- source_word: ηὔξατο
  choice: дал обет
  rationale: Передаёт обычное значение глагола «дать обет» и сохраняет необычное повторение исходного текста.
- source_word: ἐκκόψαι Βαβυλῶνα
  choice: уничтожить Вавилон
  rationale: Буквально глагол связан с отсечением или искоренением; при названии города «уничтожить» естественно передаёт его разрушительную силу.
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: отправить их туда
  rationale: Местоимение «их» эксплицирует подразумеваемый объект — сосуды; «туда» сохраняет краткость и направленность греческого выражения.
theological_decisions:
- issue: Необычная лексика обета и сжатый синтаксис
  choice: Сохранить повтор «дал обет» и не сглаживать его до простого решения или намерения.
  alternative: «решил уничтожить Вавилон и отправить их туда»
  rationale: Трудность стиха носит текстово-лексический, а не вероучительный характер. Повтор соответствует греческому ηὔξατο и сохраняет его торжественный, хотя и исторически необычный оттенок.
- issue: Референт наречия «туда»
  choice: Оставить «туда» в основном тексте и пояснить вероятный референт в сноске.
  alternative: «отправить их в Иерусалим»
  rationale: Иерусалим наиболее вероятен по контексту, но греческий текст называет направление лишь наречием ἐκεῖ; прямое уточнение в тексте сняло бы сохраняющуюся сжатость и неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, библейски достойным звучанием. Синтаксис сделан читаемым, но повтор «дал обет» и краткое «туда» сохранены ради прозрачности исходного греческого текста.
