lexical_decisions:
- source_word: ἐφάγοσαν καὶ ἐπίοσαν
  choice: ели и пили
  rationale: Простая повествовательная передача двух аористов; повтор союза в греческом естественно выражен по-русски одним соединительным «и».
- source_word: ἐμπλησθέντες
  choice: насытившись
  rationale: Причастие указывает на сытость после еды и питья; деепричастие сохраняет последовательность и звучит естественно.
- source_word: ἀνέλυσαν
  choice: разошлись
  rationale: В контексте завершившейся трапезы глагол означает, что собравшиеся разошлись; это точнее по ситуации, чем общее «ушли».
- source_word: ἀνέλυσεν εἰς τὸν κοιτῶνα
  choice: удалился в свою опочивальню
  rationale: Здесь тот же глагол описывает уход царя в спальное помещение. «Удалился» сохраняет оттенок движения прочь, а «опочивальня» уместно передаёт царское внутреннее спальное помещение.
- source_word: ἐκοιμήθη
  choice: уснул
  rationale: В последовательности «удалился… и ἐκοιμήθη» русский глагол «уснул» естественно передаёт наступление сна, не добавляя действия «лёг».
- source_word: ἔξυπνος ἐγένετο
  choice: затем пробудился
  rationale: Идиома буквально означает «стал бодрствующим»; «пробудился» естественно передаёт переход от сна к бодрствованию.
