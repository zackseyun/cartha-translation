translation:
  language: ru
  text: И вино обращает всякий ум к пиршеству и веселью[a], и человек не помнит ни печали, ни долга[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вино обращает всякую мысль к пиршеству и радости».'
    reason: лексическая неоднозначность διάνοια и εὐφροσύνη
  - marker: b
