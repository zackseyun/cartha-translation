lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: сняла
  rationale: В сочетании с венцом на голове глагол естественно передаётся как «сняла» и сохраняет значение удаления предмета.
- source_word: διάδημα
  choice: венец
  rationale: «Венец» — понятное и стилистически достойное обозначение царского головного убора; оно точнее соответствует древнему контексту, чем бытовое современное «корона».
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: возложила его на себя
  rationale: «Возложила» естественно сочетается с венцом, а «на себя» ясно передаёт контекстуальное возвратное значение местоимения.
- source_word: ἐράπιζεν
  choice: ударила
  rationale: Глагол обозначает удар, нередко пощёчину. Основной текст не уточняет вид удара сверх греческого, а более конкретный вариант сохранён в сноске.
- source_word: τῇ ἀριστερᾷ
  choice: левой рукой
  rationale: В греческом подразумевается рука; её явное обозначение необходимо для естественного русского выражения.
