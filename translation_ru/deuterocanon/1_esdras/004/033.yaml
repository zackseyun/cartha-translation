  text: Then the king and the nobles looked at one another[a], and he began to speak about the truth.
translation:
  language: ru
  text: Тогда царь и вельможи[a] смотрели друг на друга, и он начал говорить об истине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сановники»; греческое слово обозначает высокопоставленных придворных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγιστᾶνες
  choice: вельможи
  rationale: Слово обозначает высокопоставленных людей при дворе. «Вельможи» естественно и точно передаёт их высокий общественный и придворный статус.
- source_word: ἔβλεπον
  choice: смотрели
  rationale: Имперфект передаёт продолженное действие в повествовании; русское «смотрели» естественно сочетается с оборотом «друг на друга».
- source_word: εἷς τὸν ἕτερον
  choice: друг на друга
  rationale: Это обычная русская передача взаимного значения греческого оборота; предлог «на» обусловлен управлением глагола «смотреть».
- source_word: ἤρξατο λαλεῖν
  choice: начал говорить
  rationale: Прямая и естественная передача начинательной конструкции без усиления значения.
- source_word: περὶ τῆς ἀληθείας
  choice: об истине
  rationale: 'Артикль допускает определённое понимание: истина выступает как конкретная тема последующей речи. Русское «об истине» сохраняет эту предметную направленность.'
theological_decisions:
- issue: Неявный субъект глагола ἤρξατο
  choice: «он начал»
  alternative: «начал говорить» без выраженного местоимения
  rationale: В греческом субъект выражен лишь формой глагола и определяется из контекста. Русское местоимение «он» делает смену от множественного субъекта предыдущей части понятной, не называя говорящего и не устраняя контекстуальную неоднозначность его личности.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Союзная структура оригинала сохранена без искусственной архаизации; «вельможи» употреблено как понятное обозначение придворной знати.
