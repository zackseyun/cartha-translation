  source_fidelity: 'Текст точно передаёт греческий оригинал: καὶ τότε — «Тогда», ὁ βασιλεὺς καὶ οἱ μεγιστᾶνες — «царь и вельможи», взаимный оборот εἷς τὸν ἕτερον — «друг на друга», а ἤρξατο λαλεῖν περὶ τῆς ἀληθείας — «он начал говорить об истине». Местоимение «он» уместно обозначает единственного, контекстуально подразумеваемого субъекта, не называя его сверх того, что выражено оригиналом.'
