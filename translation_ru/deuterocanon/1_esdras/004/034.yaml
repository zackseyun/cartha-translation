base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/034.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun[b], because it turns in the circle of heaven and again runs back to its own place in one day.
translation:
  language: ru
  text: Мужи, разве женщины не сильны? Велика земля, высоко небо, и быстр бег солнца[a], ибо оно обращается по кругу неба и за один день снова бежит к своему месту.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «быстро в беге»; греческое выражение представляет солнце стремительно движущимся по своему пути.'
    reason: lexical_alternative
  - marker: b
    text: Здесь употреблён обычный наблюдательный язык, описывающий суточное движение солнца по небу.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: Мужи
  rationale: Прямое обращение во множественном числе. «Мужи» сохраняет мужской род греческого слова и уместный для риторической речи возвышенный, но понятный регистр.
- source_word: ἰσχυραὶ
  choice: сильны
  rationale: Передаёт основное значение физической или действенной силы и естественно вписывается в спор о том, что сильнее всего.
- source_word: γυναῖκες
  choice: женщины
  rationale: Контекст не требует сужать значение до «жёны».
- source_word: μεγάλη ἡ γῆ
  choice: Велика земля
  rationale: Предикативная конструкция сохранена ради риторического параллелизма; γῆ в космическом ряду означает землю в целом.
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: высоко небо
  rationale: Естественно передаёт пространственное значение ὑψηλός, не добавляя идеи духовного превознесения.
- source_word: ταχὺς τῷ δρόμῳ ὁ ἥλιος
  choice: стремительно в беге своём солнце
  rationale: Сохраняет образ быстрого движения солнца по пути; инверсия поддерживает параллелизм с предшествующими краткими утверждениями.
- source_word: στρέφεται
  choice: обращается
  rationale: Передаёт круговое движение без внесения современной астрономической терминологии.
- source_word: ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: по кругу неба
  rationale: Формально и ясно сохраняет древний пространственный образ круга или кругового пути неба.
- source_word: πάλιν ἀποτρέχει
  choice: снова бежит
  rationale: Глагол переведён живо, с сохранением образа бега и повторного движения, а не нейтральным «возвращается».
- source_word: εἰς τὸν ἑαυτοῦ τόπον
  choice: к своему месту
  rationale: Не превращает обычное «место» в более специальный космологический термин.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: за один день
  rationale: Естественно передаёт временной предел завершения описанного движения.
theological_decisions:
- issue: Космологическое описание движения солнца
  choice: 'Сохранить наблюдательный язык источника: солнце «обращается» и «бежит»'
  alternative: Переформулировать как кажущееся движение солнца с точки зрения современной астрономии
  rationale: Греческий текст описывает суточное движение солнца обычным языком наблюдения. Перевод не должен ни превращать этот образ в научное утверждение, ни исправлять его посредством позднейших категорий.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной риторикой. Обращение «Мужи» и инвертированные конструкции сохраняют торжественный параллелизм оригинала, тогда как связки и остальная лексика остаются понятными современному читателю.
