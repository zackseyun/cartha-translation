  to: Мужи, разве женщины не сильны? Велика земля, высоко небо, и быстр бег солнца[a], ибо оно обращается по кругу неба и за один день снова бежит к своему месту.[b]
  rationale: 'Исправлена только стилистически неудачная передача ταχὺς τῷ δρόμῳ. «Быстр бег солнца» не добавляет толкования и не устраняет древний образ движения: оно передаёт быстроту солнца относительно его бега (δρόμος). Заменено «потому что» на «ибо» ради согласованного риторического регистра; значение причинного ὅτι сохранено. Сноска a оставлена на словах, передающих соответствующее греческое выражение, а её текст уточнён согласно новой формулировке.'
