translation:
  language: ru
  text: взойти и отстроить Иерусалим и храм, над которым наречено его имя[a]; и семь дней они праздновали с музыкой[b] и радостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на котором призывалось его имя»; или: «который был назван его именем». Это храмовая формула, выражающая принадлежность храма Богу и его особую связь с ним.'
    reason: Семитизированный греческий оборот допускает несколько близких способов передачи.
  - marker: b
    text: 'Или: «с музыкантами».'
    reason: Греческая форма может обозначать музыкальное сопровождение либо музыкантов.
lexical_decisions:
- source_word: ἀναβῆναι
  choice: взойти
  rationale: Сохраняет буквальное значение движения вверх, традиционно связанного с Иерусалимом, не подменяя его более узким толкованием «вернуться».
- source_word: οἰκοδομῆσαι
  choice: отстроить
  rationale: Глагол буквально означает «строить», но контекст восстановления разрушенных Иерусалима и храма требует естественного русского «отстроить».
- source_word: ἱερὸν
  choice: храм
  rationale: Здесь имеется в виду Иерусалимский храм; «храм» — точный и естественный русский эквивалент.
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπ’ αὐτῷ
  choice: над которым было наречено его имя
  rationale: Формулировка сохраняет семитизированный храмовый оборот, выражающий принадлежность храма Богу и его связь с Богом, не сводя его к одному истолкованию.
- source_word: ἐκωθωνίζοντο
  choice: праздновали
  rationale: Редкий глагол обозначает праздничное веселье; «праздновали» ясно и естественно сочетается с музыкой и радостью.
- source_word: μουσικῶν
  choice: с музыкой
  rationale: Форма допускает указание как на музыку, так и на музыкантов; в основном тексте выбран наиболее естественный собирательный вариант, а неоднозначность отмечена в сноске.
- source_word: χαρᾶς
  choice: радостью
  rationale: Прямой и обычный библейский эквивалент, передающий эмоциональный характер праздника.
- source_word: ἡμέρας ἑπτά
  choice: семь дней
  rationale: Естественное русское обозначение продолжительности действия.
theological_decisions:
- issue: Формула о Божьем имени над храмом
  choice: над которым было наречено его имя
  alternative: на котором призывалось его имя; который был назван его именем
  rationale: 'Выбранный оборот сохраняет образный язык греческого текста и его семитскую основу: храм отмечен Божьим именем, принадлежит Богу и связан с ним. Перевод не ограничивает смысл лишь призыванием имени или названием храма.'
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксическая незавершённость начальных инфинитивов сохранена, поскольку стих продолжает предшествующее предложение. Местоимение «его» оставлено со строчной буквы в соответствии с современной нейтральной издательской практикой.
