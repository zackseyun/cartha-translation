lexical_decisions:
- source_word: ἐξαποστείλας
  choice: разослав посланцев
  rationale: Аористное причастие буквально означает «послав/разослав». Дополнение «посланцев» не выражено прямо, но естественно подразумевается в контексте царского созыва; русский деепричастный оборот сохраняет предшествование отправки вызову.
- source_word: ἐκάλεσεν
  choice: созвал
  rationale: В царском контексте передаёт официальный вызов группы лиц и естественнее русского «позвал».
- source_word: μεγιστᾶνας
  choice: вельмож
  rationale: Обозначает знатных и высокопоставленных людей; «вельможи» ясно и стилистически уместно передаёт исторический придворный контекст.
- source_word: Περσίδος καὶ τῆς Μηδείας
  choice: Персии и Мидии
  rationale: Стандартная передача географических названий в зависимом родительном падеже.
- source_word: σατράπας
  choice: сатрапов
  rationale: Сохраняет специфический персидский административный титул и исторический колорит.
- source_word: στρατηγοὺς
  choice: военачальников
  rationale: Передаёт военную руководящую должность без неоправданного сужения до позднейшего формального звания «генерал».
- source_word: τοπάρχας
  choice: правителей областей
  rationale: Передаёт начальников отдельных местностей или округов понятным современным выражением.
- source_word: ὑπάτους
  choice: высших сановников
  rationale: Греческое слово может означать высших должностных лиц, а в римском контексте — консулов. Здесь обобщённая передача избегает внесения римского титула в персидскую административную среду.
