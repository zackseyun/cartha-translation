lexical_decisions:
- source_word: οἰκοδομή
  choice: строительство
  rationale: В сочетании εἰς τὴν οἰκοδομὴν выражает цель выделения средств — строительство храма; процессуальное существительное естественно звучит по-русски.
- source_word: ἱερόν
  choice: храм
  rationale: В данном контексте ἱερόν обозначает храм как священный комплекс; «храм» — ясное и традиционное соответствие.
- source_word: δοθῆναι
  choice: выдавать
  rationale: Пассивный инфинитив в контексте распоряжения о ежегодном финансировании естественно передаётся неопределённо-личной конструкцией; несовершенный вид согласуется с ежегодной повторяемостью.
- source_word: κατ’ ἐνιαυτόν
  choice: ежегодно
  rationale: Передаёт регулярное выделение средств раз в год кратко и естественно.
- source_word: τάλαντα εἴκοσι
  choice: двадцать талантов
  rationale: Сохраняет древнюю единицу веса и денежной оценки без сомнительного пересчёта в современные единицы.
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: пока он не будет построен
  rationale: Передаёт срок действия распоряжения вплоть до завершения строительства; местоимение относится к храму.
