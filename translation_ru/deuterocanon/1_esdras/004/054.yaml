translation:
  language: ru
  text: Он также написал о снабжении и о священническом облачении, в котором они совершают служение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза здесь синтаксически неровная; близко к буквальному: «о снабжении и о священническом облачении, в чём они совершают служение в ней». Слова «в чём» и «в ней» создают трудность; женское местоимение может относиться к одному из предшествующих существительных. Возможно, текст передан в сокращённой или нестабильной форме.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: письменно распорядился
  rationale: В данном контексте речь идёт о царских письменных распоряжениях; перевод передаёт и значение «написал», и функцию записи, не вводя более специального термина «издал указ».
- source_word: χορηγίαν
  choice: снабжение
  rationale: χορηγία обозначает предоставляемое обеспечение или снабжение для определённой цели; широкий термин не уточняет без основания, были ли это содержание, паёк или денежное пособие.
- source_word: ἱερατικὴν στολήν
  choice: священническое облачение
  rationale: Сохраняется единственное число греческого текста; «облачение» естественно и уместно в храмовом контексте, не сужая значение до одной конкретной части одежды.
- source_word: ἐν τίνι … ἐν αὐτῇ
  choice: в котором
  rationale: Двойная предложная конструкция в греческом тексте звучит избыточно и, вероятнее всего, относится к στολή; основной текст передаёт предполагаемую связь естественно, а формальная неровность отмечена в сноске.
- source_word: λατρεύουσιν
  choice: совершают служение
  rationale: В контексте священнического облачения глагол обозначает храмовое, культовое служение; выражение точнее простого «служат» и не сводит действие только к поклонению.
theological_decisions:
- issue: Храмовое значение λατρεύουσιν
  choice: совершают служение
  alternative: поклоняются; служат
  rationale: Упоминание священнического облачения указывает на официальное храмовое служение. Решение обусловлено контекстом и не вводит конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной храмовой лексикой. Синтаксическая избыточность греческого текста сглажена в основном тексте, но честно отражена в сноске.
