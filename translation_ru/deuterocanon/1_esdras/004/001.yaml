  text: And King Darius made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia,
translation:
  language: ru
  text: Царь Дарий устроил большой пир[a] для всех, кто был у него в подчинении, для всех своих домочадцев и для всех вельмож Мидии и Персии,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устроил большое угощение». Греческое слово может обозначать торжественную трапезу или устроенный приём с угощением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοχή
  choice: пир
  rationale: Слово обозначает устроенное угощение или торжественную трапезу. «Пир» естественно передаёт царский масштаб события; возможная более общая передача указана в примечании.
- source_word: μεγάλην
  choice: большой
  rationale: Прилагательное указывает на масштаб или пышность события. «Большой пир» звучит естественно в современном русском языке, не усиливая значение до прямо не выраженного «роскошного».
- source_word: τοῖς ὑπʼ αὐτόν
  choice: для всех, кто был у него в подчинении
  rationale: Передаёт буквальный пространственно-иерархический образ «тех, кто под ним», сохраняя широту выражения и не сужая его до исключительно политических подданных.
- source_word: οἰκογενέσιν
  choice: для всех своих домочадцев
  rationale: Термин относится к людям, принадлежащим к дому или домашнему окружению, и шире непосредственной семьи. «Домочадцы» сохраняет эту широту в сжатой форме.
- source_word: μεγιστᾶσιν
  choice: для всех вельмож
  rationale: Слово обозначает знатных и высокопоставленных людей. «Вельможи» уместно для царского окружения и не сводит их роль к административным чиновникам.
- source_word: Μηδείας καὶ τῆς Περσίδος
  choice: Мидии и Персии
  rationale: Прямая передача географическо-политических наименований в родительном падеже при слове «вельмож».
