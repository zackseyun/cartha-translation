  text: and they blessed the God of their fathers[a], because he had given them relief and release.
translation:
  language: ru
  text: И они благословили Бога своих отцов[a] за то, что Он даровал им облегчение и освобождение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покой и свободу». Греческие слова могут обозначать облегчение от бедствия и освобождение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγησαν
  choice: благословили
  rationale: Когда объектом глагола выступает Бог, «благословили» сохраняет обычную библейскую формулировку и возвышенный регистр; по смыслу возможно также «прославили».
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  choice: Бога своих отцов
  rationale: Устойчивое библейское выражение, связывающее нынешнее поколение с верой предков; буквальная передача звучит естественно по-русски.
- source_word: ἔδωκεν
  choice: даровал
  rationale: Глагол означает «дал»; «даровал» естественно сочетается с Богом как подлежащим и сохраняет достойный библейский регистр без изменения смысла.
- source_word: ἄνεσιν
  choice: облегчение
  rationale: Слово обозначает ослабление давления или бедствия; «облегчение» ясно передаёт этот смысл в современном русском языке.
- source_word: ἄφεσιν
  choice: освобождение
  rationale: В сочетании с ἄνεσιν и в историческом контексте слово естественнее понимать как избавление или освобождение, а не как прощение грехов.
theological_decisions:
- issue: Значение ἄφεσιν во внебогослужебном историческом контексте
  choice: освобождение
  alternative: прощение; отпущение; свобода
  rationale: Хотя ἄφεσις может обозначать прощение или отпущение, здесь речь идёт о дарованном историческом избавлении. «Освобождение» сохраняет смысл слова и не привносит прямо не выраженную идею прощения грехов.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским, достойным регистром. Формула «Бог своих отцов» и глагол «благословили» сохранены как узнаваемые библейские выражения; «облегчение и освобождение» передаёт смысл пары существительных без догматического уточнения.
