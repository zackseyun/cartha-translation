  source_fidelity: 'Текст точно передаёт греческий оригинал: «благословили» соответствует εὐλόγησαν в библейском употреблении с Богом как объектом; «Бога своих отцов» сохраняет стандартную формулу τὸν θεὸν τῶν πατέρων αὐτῶν; «облегчение и освобождение» адекватно передаёт пару ἄνεσιν καὶ ἄφεσιν. Русское прошедшее время «даровал» не добавляет неуместной временной определённости и хорошо выражает совершившееся Божье действие.'
