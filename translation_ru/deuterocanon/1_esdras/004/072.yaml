    rationale: Если стих выводится отдельно, нормативно начать с прописной буквы; союз «И» сохраняет связь с предыдущим перечислением.
  - severity: medium
    issue: Не вполне ясная передача предписывающего результата во втором придаточном
    rationale: «Чтобы халдеи оставили» возможно, но может звучать как условие уже выполненного действия. «Чтобы халдеи покинули» яснее передаёт требование отказаться от удерживаемых селений.
  - severity: low
    issue: «Иудейские селения» менее явно выражает принадлежность
    rationale: τὰς κώμας ... τῶν Ἰουδαίων буквально обозначает селения иудеев. Притяжательная конструкция устраняет потенциальное значение «селения иудейского типа/района».
