translation:
  language: ru
  text: И чтобы вся земля, которой они будут владеть, была для них освобождена от налогов; и чтобы халдеи покинули селения иудеев, которые они удерживают.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χώραν
  choice: земля
  rationale: Широкое обозначение территории; «земля» естественно звучит в юридико-административном контексте и не уточняет без необходимости её политический статус.
- source_word: κρατήσουσιν
  choice: будут владеть
  rationale: Будущее время κρατέω указывает на фактическое обладание или контроль над территорией; «будут владеть» сохраняет временную форму и юридический оттенок.
- source_word: ἀφορολόγητον
  choice: свободна от налогов
  rationale: Передаёт освобождение от налогов или дани современным и ясным русским языком.
- source_word: ὑπάρχειν
  choice: была для них
  rationale: В инфинитивной формуле постановления глагол обозначает установленное состояние; вместе с прилагательным формулировка передаёт предписанный налоговый статус земли.
- source_word: Χαλδαῖοι
  choice: халдеи
  rationale: Сохраняется прямо названный в греческом тексте этноним без исторически объяснительной замены на «вавилоняне».
- source_word: ἀφίουσι
  choice: оставили
  rationale: В данном контексте ἀφίημι означает отказаться от удержания или покинуть; «оставили» естественно сочетается с селениями и сохраняет предписывающую силу.
- source_word: κώμας
  choice: селения
  rationale: κώμη обозначает небольшое поселение или деревню; «селения» — ясное и стилистически достойное обозначение без излишнего уточнения размера.
- source_word: διακρατοῦσιν
  choice: удерживают
  rationale: Сложный глагол подчёркивает продолжающееся удержание под контролем; «удерживают» точнее передаёт этот оттенок, чем нейтральное «владеют».
theological_decisions:
- issue: Юридико-административная сила инфинитивных конструкций в контексте царского постановления
  choice: 'Передать придаточными с «чтобы» и формами прошедшего времени в значении предписанного результата: «чтобы… была», «чтобы… оставили»'
  alternative: 'Буквальные инфинитивы: «быть свободной от налогов», «оставить»'
  rationale: Конструкция перечисляет условия постановления. Русские придаточные с «чтобы» естественно передают предписывающую силу греческих инфинитивов, не усиливая и не ослабляя её.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный юридико-повествовательный регистр. Сохранён этноним «халдеи» и будущее значение κρατήσουσιν; богословских уточнений, отсутствующих в греческом тексте, не внесено.
