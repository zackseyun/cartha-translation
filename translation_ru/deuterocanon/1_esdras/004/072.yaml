  rationale: Исправление сохраняет структуру двух постановительных придаточных с «чтобы», будущую перспективу κρατήσουσιν и буквальный этноним «халдеи». «Освобождена от налогов» более естественно оформляет юридический статус ἀφορολόγητον, а «покинули селения иудеев» ясно передаёт требование ἀφίουσι ... τῶν Ἰουδαίων без добавления исторических толкований.
