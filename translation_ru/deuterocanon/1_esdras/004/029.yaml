lexical_decisions:
- source_word: ἐθεώρουν
  choice: Я видел
  rationale: Форма может быть понята как первое лицо единственного числа или третье лицо множественного числа, но ближайший повествовательный контекст прямой речи указывает на первое лицо. Имперфект передаёт продолженное наблюдение; русское «видел» здесь звучит естественно и не превращает действие в единичный взгляд.
- source_word: αὐτὸν
  choice: его
  rationale: Прямое дополнение к ἐθεώρουν; местоимение сохранено без уточнения референта.
- source_word: Ἀπάμην
  choice: Апаму
  rationale: Винительный падеж имени Ἀπάμη передан русской формой «Апаму».
- source_word: θυγατέρα
  choice: дочь
  rationale: Прямое соответствие обычному термину родства.
- source_word: Βαρτάκου
  choice: Вартака
  rationale: Греческое Β передано по принятой русской традиции как «В»; из формы родительного падежа восстановлена именительная форма «Вартак».
- source_word: τοῦ θαυμαστοῦ
  choice: славного
  rationale: Эпитет обозначает человека замечательного, вызывающего восхищение или широко известного. «Славного» сохраняет эту смысловую широту и естественно сочетается с именем.
- source_word: τὴν παλλακὴν τοῦ βασιλέως
  choice: наложницу царя
  rationale: παλλακή обозначает наложницу или второстепенную супругу; «наложница» исторически точно и не вносит современных ассоциаций слова «любовница».
- source_word: καθημένην
  choice: сидевшую
  rationale: Причастие согласовано с Апамой и описывает её положение.
- source_word: ἐν δεξιᾷ τοῦ βασιλέως
  choice: по правую руку от царя
  rationale: Естественный русский оборот для положения справа от царя, сохраняющий образ «правой руки».
theological_decisions:
- issue: Лицо и число ἐθεώρουν
  choice: 'первое лицо единственного числа: «Я видел»'
  alternative: 'третье лицо множественного числа: «Они видели»'
  rationale: Сама словоформа морфологически неоднозначна, однако контекст продолжающейся речи одного говорящего требует первого лица. Английское «They were watching» не соответствует этому контексту и, кроме того, затрудняет синтаксическую связь двух прямых дополнений — «его и Апаму».
- issue: Характеристика Вартака в τοῦ θαυμαστοῦ
  choice: описательный эпитет «славного»
  alternative: «знаменитого», «достойного восхищения» или формальный титул
  rationale: Прилагательное присутствует в греческом тексте и относится к Вартаку, но оснований считать его официальным титулом нет. Перевод сохраняет описательный характер эпитета.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным повествовательным регистром. Сохранена незавершённость греческой фразы: заключительная запятая показывает, что предложение продолжается в следующем стихе. Аппозитивная цепочка передана без искусственного дробления.'
