  yaml_path: translation/deuterocanon/1_esdras/004/071.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning their freedom[a], that no official, satrap, governor, or steward should come against their doors[b],
translation:
  language: ru
  text: И написал он всем иудеям, поднимавшимся из царства в Иудею, об их свободе[a], чтобы ни один властитель, сатрап, правитель области или распорядитель не выступал против их дверей[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «об их освобождении от повинностей», «об их вольности». Греческое слово обычно означает «свободу», но в данном административном контексте может указывать на законную льготу или неприкосновенность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не выступал против их дверей». Вероятно, должностным лицам запрещалось вторгаться в их дома или предъявлять им там требования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: написал
  rationale: Прямое соответствие обычному значению γράφω; административный характер письма ясен из контекста и не требует добавления слова «указ».
- source_word: τοῖς ἀναβαίνουσιν
  choice: поднимавшимся
  rationale: Сохраняет буквальный образ движения «вверх» в Иудею и не сводит выражение только к возвращению.
- source_word: τῆς βασιλείας
  choice: из царства
  rationale: βασιλεία обозначает владения царя; «царство» прямо передаёт исходное слово, хотя по контексту речь идёт о Персидской державе.
- source_word: ὑπὲρ τῆς ἐλευθερίας
  choice: об их свободе
  rationale: Передаёт ὑπέρ с родительным как тему письма, а ἐλευθερία — обычным словом «свобода», не устраняя возможного административно-правового смысла.
- source_word: πάντα δυνατὸν
  choice: ни один властитель
  rationale: Буквально выражение означает всякого обладающего властью или силой; в отрицательной конструкции естественное русское соответствие — «ни один властитель».
- source_word: σατράπην
  choice: сатрап
  rationale: Сохраняет исторически конкретный персидский административный титул.
- source_word: τοπάρχην
  choice: правитель области
  rationale: Передаёт правителя местности или округа понятным современным выражением, не используя редкое заимствование «топарх».
- source_word: οἰκονόμον
  choice: распорядитель
  rationale: В перечне должностных лиц слово обозначает управляющего или администратора; «распорядитель» сохраняет широту значения.
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  choice: не приходил к их дверям с притязаниями
  rationale: Сохраняет образ дверей, а «с притязаниями» передаёт враждебно-обременительный оттенок ἐπέρχομαι ἐπί в административном контексте, не уточняя вид требований.
theological_decisions:
- issue: Характер свободы, предоставленной царским письмом
  choice: об их свободе
  alternative: об их освобождении от повинностей
  rationale: ἐλευθερία буквально означает свободу, но здесь может подразумевать юридическую льготу или неприкосновенность. Основной текст сохраняет более широкое значение, а примечание отмечает административный оттенок.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Сохранены административные титулы и образ восхождения в Иудею; неясность относительно точного содержания свободы и выражения о дверях вынесена в примечания.
