lexical_decisions:
- source_word: Μνήσθητι
  choice: Вспомни
  rationale: Аористный императив выражает прямой призыв к царю; «вспомни» естественно и точно передаёт его в современном русском языке.
- source_word: εὐχήν
  choice: обет
  rationale: В сочетании с однокоренным глаголом ηὔξω и в данном контексте слово обозначает торжественно принятое обязательство, а не просто молитву.
- source_word: ἣν ηὔξω
  choice: который ты дал
  rationale: Русское устойчивое сочетание «дать обет» естественно передаёт греческую конструкцию с однокоренными существительным и глаголом, не создавая тяжеловесного повтора.
- source_word: οἰκοδομῆσαι
  choice: отстроить
  rationale: Хотя глагол буквально означает «построить», исторический контекст предполагает восстановление прежде существовавшего и разрушенного Иерусалима; «отстроить» передаёт это без лишнего уточнения.
- source_word: τὴν Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Общепринятая русская форма названия города.
- source_word: ἐν τῇ ἡμέρᾳ ᾗ
  choice: в тот день, когда
  rationale: Сохраняет явное указание греческого текста на конкретный день и естественно звучит по-русски.
- source_word: τὸ βασίλειόν σου παρέλαβες
  choice: принял своё царство
  rationale: παραλαμβάνω здесь означает принятие царской власти; формулировка сохраняет образ «получения царства» и достоинство стиля.
theological_decisions:
- issue: Значение εὐχή в обращении к царю
  choice: обет
  alternative: молитва
  rationale: Однокоренной глагол ηὔξω и содержание обещанного действия указывают прежде всего на торжественное обязательство царя. В сноске сохранено возможное значение «молитва», чтобы не скрывать лексическую широту греческого слова.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным звучанием. Тире перед инфинитивом делает содержание обета прозрачным. Маркер сноски поставлен непосредственно после слова «обет», к которому относится пояснение.
