    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ
  choice: верите
  rationale: В данном контексте глагол означает признание истинности слов говорящего; «верите мне» естественно передаёт конструкцию с местоимением в дательном падеже.
- source_word: μέγας
  choice: велик
  rationale: Сохраняет прямое указание на величие и могущество царя, не сужая значение до одной лишь военной силы.
- source_word: ἐξουσίᾳ
  choice: властью
  rationale: Передаёт как властные полномочия царя, так и его реальную способность повелевать; творительный оборот естественен по-русски.
- source_word: χῶραι
  choice: земли
  rationale: Широкое географически-политическое обозначение территорий; «земли» не привносит современного представления о национальных государствах.
- source_word: εὐλαβοῦνται
  choice: боятся
  rationale: В сочетании с инфинитивом выражает страх и осторожность перед действием; краткое «боятся» сохраняет силу риторического вопроса.
- source_word: ἅψασθαι
  choice: прикоснуться
  rationale: Сохраняет конкретный образ прикосновения и представленную в тексте недосягаемость царя, не уточняя это как нападение.
