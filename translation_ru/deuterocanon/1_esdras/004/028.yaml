  text: And now[a], do you not believe me? Is not the king great in his authority? Do not all the lands fear to touch him?
translation:
  language: ru
  text: И теперь вы мне не верите? Разве не велик царь своей властью? Разве не все земли[a] боятся прикоснуться к нему?
  philosophy: optimal-equivalence
  footnotes:
