  yaml_path: translation/deuterocanon/1_esdras/004/078.yaml
  text: And to all who guarded the city[b][a], he wrote to give them allotments and wages.
translation:
  language: ru
  text: А всем, кто охранял город, он написал, чтобы им дали наделы[a] и жалованье[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «доли» или «участки». Греческое κλήρους может обозначать назначенные доли, возможно распределённые по жребию.
    reason: lexical_alternative
  - marker: b
    text: Или «плату» или «содержание». Греческое ὀψώνια может обозначать как денежное вознаграждение, так и продовольственное содержание за службу.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουροῦσι
  choice: охранял
  rationale: Причастие от φρουρέω обозначает охрану или несение стражи; форма «кто охранял» естественно передаёт значение в данном повествовательном контексте.
- source_word: πόλιν
  choice: город
  rationale: Обычное и прямое соответствие греческому πόλις.
- source_word: ἔγραψε
  choice: он написал
  rationale: Сохраняет прямое значение глагола и письменный характер распоряжения, не усиливая его до «приказал».
- source_word: δοῦναι
  choice: чтобы им дали
  rationale: Инфинитив передаёт содержание написанного; придаточное с «чтобы» звучит естественно по-русски и сохраняет неопределённость относительно непосредственных исполнителей.
- source_word: κλήρους
  choice: наделы
  rationale: κλῆρος может означать жребий, долю или выделенный по жребию участок. В сочетании с оплатой служившим охранникам «наделы» передаёт назначенную им долю, не сводя слово к самому бросанию жребия.
- source_word: ὀψώνια
  choice: жалованье
  rationale: ὀψώνια обозначает содержание, провиант или плату за службу, особенно военную. «Жалованье» естественно для оплаты городской стражи, а более широкая семантика отмечена в сноске.
