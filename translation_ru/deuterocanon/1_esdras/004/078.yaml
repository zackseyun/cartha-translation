  source_fidelity: 'Текст точно передаёт греческий оригинал: «всем, кто охранял город» соответствует πᾶσι τοῖς φρουροῦσι τὴν πόλιν; «он написал, чтобы им дали» естественно выражает ἔγραψε δοῦναι αὐτοῖς, не приписывая распоряжению большей категоричности, чем есть в тексте. «Наделы» и «жалованье» адекватно передают κλήρους и ὀψώνια.'
