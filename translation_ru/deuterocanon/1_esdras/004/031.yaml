  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she is offended with him[b], he flatters her so that she may be reconciled to him.
translation:
  language: ru
  text: К тому же царь смотрел на неё, разинув рот. Если она смеётся вместе с ним[a], он тоже смеётся; а если она рассердится на него, он льстит ей, чтобы она с ним примирилась.
  philosophy: optimal-equivalence
