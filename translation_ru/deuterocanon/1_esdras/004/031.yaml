    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τούτοις
  choice: к тому же
  rationale: Естественная русская связка, сохраняющая добавочное значение греческого выражения.
- source_word: χάσκων τὸ στόμα
  choice: разинув рот
  rationale: Сохраняет яркий и несколько разговорный образ открытого рта, передающий зачарованность царя.
- source_word: ἐθεώρει αὐτήν
  choice: смотрит на неё
  rationale: В сочетании с образом разинутого рта глагол обозначает пристальный, увлечённый взгляд; настоящее время согласует сцену с последующими обобщающими условиями.
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  choice: если она смеётся вместе с ним, он тоже смеётся
  rationale: Повтор глагола γελάω сохранён. Дательный αὐτῷ допускает разные отношения; основной вариант передаёт совместный смех, а неоднозначность отмечена в сноске.
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: сердится на него
  rationale: В данном контексте передаёт возникшее недовольство или раздражение без излишне буквального и неестественного «становится горькой против него».
- source_word: κολακεύει αὐτήν
  choice: льстит ей
  rationale: Прямой и современный эквивалент κολακεύω, сохраняющий оттенок заискивания.
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: чтобы она с ним примирилась
  rationale: Передаёт целевое значение ὅπως и восстановление нарушенных отношений, выраженное διαλλάσσομαι.
