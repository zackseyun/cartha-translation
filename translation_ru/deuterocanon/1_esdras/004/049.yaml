  yaml_path: translation/deuterocanon/1_esdras/004/049.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning freedom[a], that no official or satrap or toparch or steward should come to their doors[c][b],
translation:
  language: ru
  text: 'И написал он всем иудеям, поднимавшимся из царства в Иудею, об их свободе[a]: чтобы ни один обладающий властью, ни сатрап, ни местный правитель[b], ни управляющий не приходил к их дверям[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое ἐλευθερία может означать также «освобождение» или «вольность». В административном контексте речь может идти о свободе от повинностей или притеснений, но текст этого не уточняет.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «топарх» — правитель отдельной местности или округа.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «не приходил к их дверям». Вероятно, должностным лицам запрещалось вторгаться к ним или предъявлять им требования у них дома; точный смысл выражения неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: написал
  rationale: Прямое значение глагола; официальный характер письма ясен из контекста, поэтому добавлять «издал указ» не требуется.
- source_word: τοῖς ἀναβαίνουσιν
  choice: поднимавшимся
  rationale: Сохраняет буквальный образ движения «вверх» в Иудею и не сводит его только к возвращению из изгнания.
- source_word: ἀπὸ τῆς βασιλείας
  choice: из царства
  rationale: Передаёт βασιλεία непосредственно, не уточняя сверх греческого текста, что речь идёт об империи или державе.
- source_word: ὑπὲρ τῆς ἐλευθερίας
  choice: об их свободе
  rationale: ὑπέρ здесь естественно понимать как указание на предмет письма; местоимение «их» проясняет русскую связь с иудеями, не меняя содержания.
- source_word: πάντα δυνατὸν
  choice: никто из власть имущих
  rationale: Буквально выражение указывает на «всякого могущественного/обладающего властью»; отрицательная конструкция по-русски естественно передаётся через «никто», а административный смысл сохраняется.
- source_word: σατράπην
  choice: сатрап
  rationale: Сохранён конкретный персидский административный титул.
- source_word: τοπάρχην
  choice: областной правитель
  rationale: Передаёт функцию местного правителя понятным современным русским выражением, не вводя малознакомое заимствование «топарх» в основной текст.
- source_word: οἰκονόμον
  choice: управляющий
  rationale: Нейтрально передаёт οἰκονόμος как распорядителя или администратора и подходит к перечню должностных лиц.
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  choice: не являлся к дверям их домов
  rationale: Сохранён конкретный образ дверей и возможный оттенок недоброжелательного или обременительного прихода; предполагаемый смысл вмешательства или взысканий вынесен в примечание.
