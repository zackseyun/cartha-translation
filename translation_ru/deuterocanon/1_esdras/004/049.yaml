translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Инверсия «И написал он» поддерживает связность библейского рассказа; технические титулы частично сохранены, частично пояснены понятными русскими словами. Неясность πάντα δυνατὸν и образ «дверей» не устранены догматически или чрезмерно конкретизирующим толкованием.
