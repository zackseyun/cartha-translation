translation:
  language: ru
  text: 'Другой написал: «Царь сильнее».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Царь берёт верх». Греческий глагол может означать «быть сильнее» или «одерживать верх».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: Другой
  rationale: Сочетание артикля с ἕτερος указывает на другого, то есть следующего участника; «другой» естественно передаёт последовательность, не вводя отсутствующего в этой фразе порядкового числительного.
- source_word: ἔγραψεν
  choice: написал
  rationale: Аорист γράφω обозначает завершённое действие в повествовательной последовательности; простое прошедшее время точно и естественно.
- source_word: Ὑπερισχύει
  choice: сильнее всех
  rationale: Глагол ὑπερισχύω означает превосходить силой, брать верх, одолевать. В контексте состязательных утверждений эллиптическое «сильнее всех» естественно выражает сравнительное превосходство, хотя греческий допускает также динамическое «берёт верх».
- source_word: ὁ βασιλεύς
  choice: царь
  rationale: βασιλεύς — обычное и точное обозначение царя; более широкое «правитель» было бы менее конкретным.
