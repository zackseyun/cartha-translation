  text: And it makes all hearts rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: ru
  text: И она делает все сердца богатыми и не помнит ни царя, ни сатрапа; и заставляет всех говорить о суммах в талантах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заставляет всех говорить через таланты». То есть говорить о денежных суммах, выраженных в талантах. Талант — древняя мера веса и крупная денежная единица, а не природная способность.'
    reason: Уточняет значение διὰ ταλάντων и древнее денежное значение слова «талант», не скрывая буквальный, несколько неясный образ греческого текста.
lexical_decisions:
- source_word: πάσας καρδίας ποιεῖ πλουσίας
  choice: делает все сердца богатыми
  rationale: Сохраняет образ сердца как средоточия желаний и намерений, а также конструкцию ποιεῖ с прилагательным; более свободное «обогащает всех» устранило бы исходный образ.
- source_word: οὐ μέμνηται
  choice: не помнит
  rationale: Передаёт прямое значение глагола μιμνῄσκομαι. Контекстуально возможно «не считается с», однако буквальный образ намеренно сохранён.
- source_word: βασιλέα οὐδὲ σατράπην
  choice: ни царя, ни сатрапа
  rationale: «Сатрап» сохраняет конкретный персидский историко-административный термин, не обобщая его до «правителя» или «наместника».
- source_word: πάντα
  choice: всех
  rationale: Хотя форма πάντα грамматически среднего рода и буквально может означать «всё», инфинитив «говорить» естественно указывает здесь на людей. В сноске сохраняется формальная альтернатива.
- source_word: διὰ ταλάντων
  choice: о талантах
  rationale: В данном контексте τάλαντα — денежные суммы или единицы веса и стоимости, а не природные способности. Предложное выражение допускает трудную для однозначного воспроизведения связь; «о талантах» даёт понятный смысл, не заменяя древнюю денежную меру современным словом «деньги».
- source_word: ποιεῖ λαλεῖν
  choice: заставляет ... говорить
  rationale: Передаёт каузативную конструкцию и сохраняет повтор глагола ποιεῖ в структуре стиха.
theological_decisions:
- issue: Неявное подлежащее, перенесённое из контекста
  choice: она
  alternative: это; повторить обозначение подразумеваемого предмета или лица
  rationale: Греческий текст не называет подлежащее заново. Русское местоимение женского рода сохраняет отсылку к контексту, не добавляя в сам стих отсутствующего существительного.
- issue: Одушевлённое или формально нейтральное понимание πάντα
  choice: всех
  alternative: всё
  rationale: Выбор «всех» делает сочетание с «говорить» естественным, но грамматическая неоднозначность греческого отмечена в сноске, чтобы не скрывать возможность более формального прочтения.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного риторического параллелизма. Повтор «и» воспроизводит греческую связность; необычный образ «делает все сердца богатыми» оставлен без сглаживания.
