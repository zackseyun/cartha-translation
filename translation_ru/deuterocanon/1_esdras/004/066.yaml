  text: and all the vessels taken from Jerusalem are to be sent back there—those that Cyrus set apart when he vowed to destroy Babylon[c][b][a], and vowed to send there.
translation:
  language: ru
  text: и вернуть туда[c] все сосуды, взятые из Иерусалима, — те, которые Кир выделил, когда дал обет уничтожить Вавилон[a][b] и дал обет отослать их туда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отсечь Вавилон»; по смыслу также возможно: «сокрушить Вавилон».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда молился о том, чтобы уничтожить Вавилон и отослать их туда». Греческий глагол может означать как молитву, так и обет.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «отослать»; значение возвращения следует из контекста, поскольку сосуды были взяты из Иерусалима.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεύη
  choice: сосуды
  rationale: В контексте Иерусалимского храма слово обозначает храмовые сосуды или принадлежности; «сосуды» естественно сохраняет этот смысл, не вводя лишней конкретизации.
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  choice: взятые из Иерусалима
  rationale: Причастие обозначает предметы, ранее унесённые из Иерусалима; нейтральное «взятые» не усиливает текст до «разграбленные» или «захваченные».
- source_word: ἐκπέμψαι
  choice: вернуть туда
  rationale: Сам инфинитив значит «отослать», однако из контекста ясно, что сосуды надлежит возвратить в Иерусалим. Добавочный смысл возврата отмечен сноской.
- source_word: ἃ ἐχώρισεν
  choice: те, которые ... отложил
  rationale: χωρίζω означает отделить или отложить особо. «Отложил» естественно передаёт выделение предметов для последующей отправки.
- source_word: ηὔξατο
  choice: дал обет
  rationale: Сочетание с инфинитивами допускает значение торжественного обещания или обета; возможное значение «молился» сохранено в сноске.
- source_word: ἐκκόψαι Βαβυλῶνα
  choice: уничтожить Вавилон
  rationale: Буквально глагол выражает отсечение или срубание, но применительно к городу естественно означает его уничтожение; буквальный образ сохранён в сноске.
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: отослать туда
  rationale: Передаёт выраженное в греческом тексте направление без добавления во втором случае явно не указанного значения возврата.
theological_decisions:
- issue: Значение ηὔξατο в описании действий Кира
  choice: дал обет
  alternative: молился
  rationale: Инфинитивные дополнения благоприятствуют значению обета или торжественного обещания, но глагол также может обозначать молитву; неоднозначность указана в сноске.
- issue: Явно ли выражать возвращение сосудов
  choice: вернуть туда
  alternative: отослать
  rationale: Контекст возвращения взятых из Иерусалима сосудов делает «вернуть» естественным по-русски, хотя сам глагол ἐκπέμψαι буквально означает «отослать»; это отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного и официального контекста. Порядок слов слегка перестроен ради ясности; повтор «дал обет» сохранён вслед за повтором греческого ηὔξατο.
