  yaml_path: translation/deuterocanon/1_esdras/004/082.yaml
  text: Blessed are you[a], who have given me wisdom; and to you I give thanks, Master of the fathers.
translation:
  language: ru
  text: Благословен Ты, давший мне мудрость; Тебе я приношу благодарность[a], Владыка отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тебе воздаю хвалу»; возможно также: «Тебя открыто признаю». Греческий глагол может означать открытое признание, хвалу или благодарение; здесь «приношу благодарность» соответствует молитвенному контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς εἶ
  choice: Благословен Ты
  rationale: Сохраняет традиционную форму благословения в прямом обращении к Богу и передаёт явную связку εἶ естественной русской конструкцией.
- source_word: ὃς ἔδωκάς μοι σοφίαν
  choice: давший мне мудрость
  rationale: 'Причастный оборот естественно передаёт определительное придаточное с аористом: мудрость уже дарована и теперь принадлежит говорящему.'
- source_word: σοὶ ὁμολογῶ
  choice: Тебя я благодарю
  rationale: В молитвенно-хвалебном контексте ὁμολογέω выражает открытое признание, хвалу или благодарность. «Благодарю» ясно передаёт смысл для современного читателя, а возможная неоднозначность отмечена в сноске.
- source_word: δέσποτα
  choice: Владыка
  rationale: Передаёт значение верховной власти и сохраняет отличие от κύριος, обычно переводимого словом «Господь».
- source_word: τῶν πατέρων
  choice: отцов
  rationale: Буквально передаёт существительное без добавления отсутствующего в греческом притяжательного местоимения; вариант «предков» был бы более истолковывающим.
theological_decisions:
- issue: Передача δέσποτα в обращении к Богу
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: «Владыка» сохраняет оттенок абсолютной власти, отличает δέσποτα от κύριος и звучит достойно в современной русской молитвенной речи.
- issue: Значение ὁμολογῶ в молитвенном контексте
  choice: благодарю
  alternative: исповедую; открыто признаю; прославляю
  rationale: Буквальное «исповедую» в современном русском может ошибочно восприниматься как признание греха. «Благодарю» соответствует контексту благословения за полученную мудрость, при этом более широкий смысл глагола сохранён в сноске.
- issue: Отсутствующее притяжательное местоимение при τῶν πατέρων
  choice: отцов
  alternative: наших отцов; праотцов
  rationale: Перевод не добавляет «наших», которого нет в исходном тексте, и не сужает значение до «праотцов» без необходимости.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного обращения. Заглавные буквы в «Ты» и «Тебя» обозначают обращение к Богу. Синтаксис слегка приподнят, но остаётся ясным для обычного читателя.
