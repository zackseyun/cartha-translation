  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: ru
  text: 'Третий написал: «Женщины сильнее, но истина побеждает всё».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Женщины одерживают верх, но истина одерживает верх над всем».'
    reason: Лексическая альтернатива для ὑπερισχύουσιν и более формальное воспроизведение ὑπὲρ πάντα.
lexical_decisions:
- source_word: ὁ τρίτος
  choice: Третий
  rationale: Артикль с порядковым числительным употреблён субстантивированно и указывает на третьего участника состязания; контекст позволяет не добавлять слово «юноша».
- source_word: ἔγραψεν
  choice: написал
  rationale: Прямое и естественное соответствие глаголу; речь идёт о записанном утверждении третьего участника.
- source_word: Ὑπερισχύουσιν
  choice: сильнее
  rationale: Передаёт сравнительную идею превосходства в силе, естественно звучит в кратком тезисе и не превращает высказывание в описание уже состоявшейся победы.
- source_word: αἱ γυναῖκες
  choice: Женщины
  rationale: В данном общем, афористичном утверждении речь идёт о женщинах вообще, а не только о жёнах.
- source_word: ὑπὲρ δὲ πάντα
  choice: но … всё
  rationale: В сочетании с «побеждает» передаёт превосходство истины над всем; более буквальное «превыше всего» по-русски хуже сочетается с глаголом победы.
- source_word: νικᾷ
  choice: побеждает
  rationale: Сохраняет образ победы, заложенный в νικάω, и настоящее время общеистинного высказывания.
- source_word: ἡ ἀλήθεια
  choice: истина
  rationale: Передаёт персонифицированное абстрактное понятие без неоправданного уточнения его содержания.
theological_decisions:
- issue: Передача заключительного утверждения об истине
  choice: истина побеждает всё
  alternative: истина одерживает верх над всем
  rationale: Основной вариант сохраняет образ победы и абсолютный охват высказывания, не объясняя дополнительно, в каком именно смысле истина побеждает.
translation_notes:
  register: Современный литературный русский язык; краткий, афористичный и достойный регистр. Синтаксис сделан естественным для русского, при этом сохранены сопоставление силы женщин с превосходством истины и образ победы.
