base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/047.yaml
  text: Then King Darius stood up and kissed him[a], and wrote letters for him to all the stewards and regional governors and generals and satraps[b], that they should escort him and all those with him who were going up to build Jerusalem.
translation:
  language: ru
  text: Тогда царь Дарий встал, поцеловал его и написал для него письма всем управляющим, правителям областей, военачальникам и сатрапам, чтобы они сопроводили[a] его и всех, кто вместе с ним отправлялся в Иерусалим, чтобы строить Иерусалим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помогли им отправиться в путь»; греческий глагол может означать не только сопровождение, но и оказание необходимой помощи в дороге.'
    reason: lexical_alternative
  - marker: b
    text: 'По контексту возможно: «восстановить Иерусалим», однако греческий глагол здесь буквально означает «строить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε ἀναστὰς
  choice: Тогда … встал
  rationale: Передаёт последовательность событий и конкретное действие царя естественным современным русским языком.
- source_word: κατεφίλησεν αὐτόν
  choice: поцеловал его
  rationale: Сохраняет прямое значение глагола, не усиливая без необходимости степень выраженной привязанности.
- source_word: ἔγραψεν αὐτῷ τὰς ἐπιστολάς
  choice: написал для него письма
  rationale: Дательный αὐτῷ в контексте указывает, что письма были написаны в его пользу и для содействия его пути.
- source_word: οἰκονόμους
  choice: управляющим
  rationale: Термин обозначает лиц, ведающих хозяйством, имуществом или средствами; «управляющие» сохраняет широту должностного значения и не сводит его только к финансам.
- source_word: τοπάρχας
  choice: правителям областей
  rationale: Передаёт должность местных или областных правителей без малопонятной транслитерации «топархи».
- source_word: στρατηγοὺς
  choice: военачальникам
  rationale: Точное и исторически нейтральное обозначение военных начальников.
- source_word: σατράπας
  choice: сатрапам
  rationale: Сохраняет известное специфическое наименование должности в персидской административной системе.
- source_word: ἵνα προπέμψωσιν
  choice: чтобы они сопроводили
  rationale: Основное контекстуальное значение — проводить или обеспечить продвижение в пути; более широкий оттенок помощи отмечен в сноске.
- source_word: τοὺς μετʼ αὐτοῦ πάντας ἀναβαίνοντας
  choice: всех, кто вместе с ним отправлялся
  rationale: Передаёт всю сопровождающую группу; направление к Иерусалиму выражено естественным русским оборотом без неясного буквального «восходил».
- source_word: οἰκοδομῆσαι τὴν Ἰερουσαλήμ
  choice: в Иерусалим строить его
  rationale: Сохраняет простое значение οἰκοδομέω «строить», не подменяя его контекстуальным «восстанавливать»; местоимение устраняет тяжеловесное «строить Иерусалим» при сохранении объекта.
theological_decisions:
- issue: Строительство или восстановление Иерусалима
  choice: строить его
  alternative: восстановить его
  rationale: Хотя контекст предполагает восстановление разрушенного города, греческий текст употребляет простой глагол «строить»; уточнение не внесено в основной текст, а отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Административные титулы переданы понятно и без излишней архаизации; специфический персидский титул «сатрап» сохранён. Синтаксис слегка перестроен ради естественности, при этом содержание и неоднозначности греческого текста сохранены.
