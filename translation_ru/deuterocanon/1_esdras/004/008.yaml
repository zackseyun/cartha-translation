lexical_decisions:
- source_word: τότε
  choice: тогда
  rationale: Передаёт временную последовательность повествования естественным современным русским словом.
- source_word: γράψαντες ἕκαστος
  choice: каждый написал
  rationale: Аористное причастие обозначает действие, предшествующее главным глаголам; личная конструкция звучит по-русски естественно.
- source_word: τὸν ἑαυτοῦ λόγον
  choice: своё высказывание
  rationale: В данном контексте λόγος означает записанное утверждение участника; «высказывание» не сужает смысл до отдельного слова или формального доказательства.
- source_word: ἐσφραγίσαντο
  choice: они запечатали написанное
  rationale: Объект подразумевается греческим контекстом и выражен по-русски для ясности; возвратная форма глагола здесь не требует отдельного отражения.
- source_word: ἔθηκαν
  choice: положили
  rationale: Простой повествовательный глагол точно и естественно передаёт значение ἔθηκαν.
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: под изголовье
  rationale: προσκεφάλαιον обозначает предмет, служащий опорой для головы; «изголовье» сохраняет неоднозначность между подушкой и подголовником.
- source_word: Δαρείου τοῦ βασιλέως
  choice: царя Дария
  rationale: Естественная русская форма генитивного сочетания, относящегося к изголовью.
