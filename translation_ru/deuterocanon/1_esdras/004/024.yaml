lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: начал говорить
  rationale: Естественно передаёт греческую конструкцию ἄρχομαι с инфинитивом и сохраняет её аспектуальное значение.
- source_word: ὁ δεύτερος
  choice: второй
  rationale: Обозначает второго участника состязания; контекст делает добавление слова «участник» необязательным.
- source_word: ὁ εἴπας περὶ τῆς ἰσχύος τοῦ βασιλέως
  choice: тот, кто говорил о силе царя
  rationale: Причастный оборот определяет говорящего по его тезису; «сила» конкретно и точно передаёт ἰσχύς.
- source_word: Ὦ ἄνδρες
  choice: Мужи!
  rationale: Сохраняет обращение к взрослым мужчинам и подходит к достоинству повествовательной речи; современное «мужчины» здесь звучало бы менее естественно.
- source_word: οὐχ ὑπερισχύουσιν οἱ ἄνθρωποι
  choice: Разве не люди превосходят всех
  rationale: «Разве не» ясно выражает риторический вопрос, ожидающий утвердительного ответа. «Превосходят всех» передаёт значение сравнительного превосходства, подразумеваемое ὑπερισχύω, не подменяя его более узким «побеждают».
- source_word: τὴν γῆν καὶ τὴν θάλασσαν κατακρατοῦντες
  choice: властвуя над землёй и морем
  rationale: Деепричастие сохраняет греческую причастную конструкцию без навязывания исключительно причинной связи; «властвовать над» передаёт господство и контроль в κατακρατέω.
- source_word: καὶ πάντα τὰ ἐν αὐτοῖς
  choice: и над всем, что в них
  rationale: Предлог повторён ради ясной русской синтаксической связи с «властвуя»; местоимение относится к земле и морю.
