base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/037.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, and all the sons of men and all their works are unjust—all such things. And there is no truth in them, and in their injustice they will perish.
translation:
  language: ru
  text: Несправедливо вино, несправедлив царь, несправедливы женщины, несправедливы все сыны человеческие, и несправедливы все их дела — всё подобное этому. Нет в них истины, и в своей несправедливости они погибнут.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: несправедлив / несправедливы / несправедливо
  rationale: Повтор одного корня сохраняет риторический напор греческого текста и охватывает как лица, так и вино и дела; «неправеден» придало бы формулировке более узкий религиозный оттенок.
- source_word: οἶνος
  choice: вино
  rationale: Прямое и естественное соответствие.
- source_word: ὁ βασιλεύς
  choice: царь
  rationale: Определённый артикль и контекст поддерживают определённое, обобщающее наименование; русский язык не требует отдельного показателя определённости.
- source_word: αἱ γυναῖκες
  choice: женщины
  rationale: Обычное значение множественного числа; контекст не требует значения «жёны».
- source_word: πάντες οἱ υἱοὶ τῶν ἀνθρώπων
  choice: все сыны человеческие
  rationale: Сохраняет явно мужскую форму и семитизированный библейский оборот греческого текста, который в контексте обозначает человечество.
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: все их дела
  rationale: «Дела» естественно передаёт широкий смысл человеческих действий и сохраняет всеохватность πάντα.
- source_word: πάντα τὰ τοιαῦτα
  choice: всё подобное этому
  rationale: Передаёт обобщающий характер фразы, не сужая её до одних только перечисленных предметов.
- source_word: ἀλήθεια
  choice: истина
  rationale: Прямое соответствие, уместное в противопоставлении несправедливости.
- source_word: ἀπολοῦνται
  choice: они погибнут
  rationale: Передаёт будущее значение и результат, не вводя явно внешнего деятеля, который их уничтожит.
theological_decisions:
- issue: Мужская форма антропологического выражения πάντες οἱ υἱοὶ τῶν ἀνθρώπων
  choice: все сыны человеческие
  alternative: все люди
  rationale: Выбранный вариант сохраняет форму источника и её представительный характер, не отрицая того, что выражение относится к человечеству в целом.
- issue: Повтор ἄδικος и родственных форм
  choice: несправедлив / несправедливы / несправедливо
  alternative: неправеден / неправедны / неправедно
  rationale: «Несправедлив» ясно передаёт отсутствие справедливости и правильного порядка, сохраняя связь с ἀδικία в конце стиха и не навязывая более специализированной богословской терминологии.
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Синтаксический параллелизм и повтор корня «несправедлив-» намеренно сохранены. Архаизирующий оборот «сыны человеческие» оставлен только там, где он непосредственно отражает формулировку источника.
