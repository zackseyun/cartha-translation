  yaml_path: translation/deuterocanon/1_esdras/004/069.yaml
  text: Then King Darius stood up and kissed him, and he wrote letters for him to all the stewards and local rulers and generals and satraps, that they should send him on his way, along with all those with him who were going up to rebuild Jerusalem.
translation:
  language: ru
  text: Тогда царь Дарий встал, поцеловал его и написал для него письма всем управителям, областным начальникам, военачальникам и сатрапам, чтобы они сопроводили его и всех, кто был с ним и шёл восстановить Иерусалим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεφίλησεν
  choice: поцеловал
  rationale: Передаёт жест расположения и почтения естественным современным русским языком; контекст не требует усиливать значение до «крепко расцеловал».
- source_word: οἰκονόμους
  choice: управителям
  rationale: В данном административном перечне слово обозначает должностных лиц-распорядителей, а не домашних экономов.
- source_word: τοπάρχας
  choice: областным начальникам
  rationale: Передаёт местных правителей или начальников территориальных округов и сохраняет отличие от сатрапов.
- source_word: προπέμψωσιν
  choice: проводили
  rationale: Глагол означает сопроводить или обеспечить дальнейший путь; «проводили» кратко и естественно выражает это в контексте официальных писем.
- source_word: οἰκοδομῆσαι τὴν Ἰερουσαλήμ
  choice: восстановить Иерусалим
  rationale: Буквально «построить Иерусалим», но в повествовательном контексте речь идёт о восстановлении разрушенного города; выбранный глагол ясно передаёт референт без конфессионального истолкования.
