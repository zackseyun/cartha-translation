lexical_decisions:
- source_word: Ἀπαγγείλατέ
  choice: Расскажите
  rationale: Повелительная форма множественного числа передаёт просьбу публично изложить или сообщить; «расскажите» естественно по-русски в данном контексте состязания речей.
- source_word: περὶ τῶν γεγραμμένων
  choice: о написанном
  rationale: Сохраняет предлог περὶ и результативно-пассивный смысл причастия, не уточняя сверх текста, кем именно это было написано.
- source_word: ἤρξατο
  choice: начал
  rationale: Прямое и естественное соответствие повествовательному глаголу начала действия.
- source_word: ὁ πρῶτος ὁ εἴπας
  choice: первый — тот, кто говорил
  rationale: Сохраняет как порядковое обозначение первого участника, так и уточняющую конструкцию с повторным артиклем.
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  choice: о силе вина
  rationale: «Сила» передаёт широкий диапазон ἰσχύς — силу, могущество, власть — и естественно обозначает сравнительную действенность вина.
- source_word: καὶ ἔφη οὕτως
  choice: так
  rationale: В сочетании «начал так» естественно вводит следующую речь и передаёт οὕτως без тяжеловесного повтора «начал и сказал так».
