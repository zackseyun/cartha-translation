translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Греческая сочинительная структура слегка сглажена ради естественности, при этом уточняющее «тот, кто» и предлог «о» сохранены. Маркер сноски поставлен непосредственно после выражения, к которому относится.
