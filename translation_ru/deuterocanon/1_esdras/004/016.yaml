    rationale: «Тот, кто говорил о силе вина» может подразумевать продолженное действие. εἴπας — аористное причастие и лучше передаётся как «тот, кто сказал о силе вина».
  - severity: low
    issue: Неполное выражение формулы начала речи
    rationale: «Начал так» понятно из контекста, но «начал говорить так» более явно передаёт ἤρξατο ... καὶ ἔφη οὕτως, не создавая неестественного буквального повтора.
  - severity: low
