base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/040.yaml
  text: And in her judgment there is nothing unjust[a]. And hers is the strength and the kingdom and the authority and the majesty of all the ages. Blessed be the God of truth.
translation:
  language: ru
  text: И в её суде нет ничего несправедливого. Она — сила, царство, власть и величие во все века[a]. Благословен Бог истины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционной форме: «во веки веков»; буквально: «всех веков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  choice: суд
  rationale: Сохраняет судебный оттенок греческого слова и естественно сочетается с «несправедливого».
- source_word: ἄδικον
  choice: несправедливого
  rationale: Передаёт значение того, что противно справедливости, не усиливая его до более богословски нагруженного «неправедного».
- source_word: ἰσχύς
  choice: сила
  rationale: Прямой современный эквивалент, позволяющий отличить это слово от ἐξουσία — «власть».
- source_word: βασίλειον
  choice: царство
  rationale: Сохраняет традиционный и краткий образ царского правления, не сливая его со следующей «властью».
- source_word: ἐξουσία
  choice: власть
  rationale: Передаёт законное полномочие и господство, оставаясь отличным от физической или действенной «силы».
- source_word: μεγαλειότης
  choice: величие
  rationale: Естественно звучит в хвалебном перечислении и точно передаёт возвышенное величие.
- source_word: τῶν πάντων αἰώνων
  choice: всех веков
  rationale: Сохраняет буквальную структуру греческого выражения; более привычный идиоматический вариант указан в сноске.
- source_word: εὐλογητός
  choice: Благословен
  rationale: Достоинственно и естественно передаёт формулу хвалы без необходимости добавлять отсутствующую в греческом связку.
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: Бог истины
  rationale: Сохраняет генитивную конструкцию и характеристику Бога через истину, не преобразуя её в «истинный Бог».
theological_decisions:
- issue: К кому относятся женские местоимения αὐτῆς и αὕτη
  choice: Они отнесены к олицетворённой истине; это передано формами «её» и «ей».
  alternative: Повторить слово «истина» и тем самым ослабить олицетворение.
  rationale: Ближайший контекст представляет истину как действующее лицо. Русский грамматический род слова «истина» позволяет естественно сохранить этот литературный образ.
- issue: Смысл конструкции αὕτη ἡ ἰσχὺς καὶ τὸ βασίλειον...
  choice: «Ей принадлежат сила, царство, власть и величие».
  alternative: 'Более буквально: «И это — сила, и царство, и власть, и величие…».'
  rationale: В контексте αὕτη продолжает речь об олицетворённой истине; конструкция принадлежности делает подразумеваемую связь ясной по-русски, не меняя референта.
translation_notes:
  register: Современный литературный русский с достоинством доксологической формулы. Олицетворение истины сохранено; перечисление передано ритмично и без конфессионально окрашенных уточнений.
