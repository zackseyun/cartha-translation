    issue: Передача αὕτη как «Ей принадлежат»
    rationale: Это допустимое истолкование подразумеваемой связки, однако αὕτη непосредственно означает «она/эта» и в оригинале отождествляет истину с перечисляемыми достоинствами. Прямое «Она —» точнее сохраняет образ и синтаксический акцент.
  - severity: medium
    issue: «Величие всех веков» двусмысленно в современном русском
    rationale: Форма родительного падежа может описывать «века», а не длительность силы, царства, власти и величия. «Во все века» передаёт смысл τῶν πάντων αἰώνων как всеохватной временной протяжённости; буквальная форма остаётся в сноске.
