lexical_decisions:
- source_word: ἀπενοήθησαν ταῖς ἰδίαις διανοίαις
  choice: потеряли здравомыслие
  rationale: Сочетание описывает утрату здравого рассуждения. Такой перевод естественен по-русски, передаёт смысл глагола в связи с διανοίαις и не навязывает клинического значения безумия.
- source_word: διὰ τὰς γυναῖκας
  choice: из-за женщин
  rationale: διά с винительным выражает причину; краткий русский оборот прямо передаёт эту связь.
- source_word: δοῦλοι ἐγένοντο
  choice: стали рабами
  rationale: Предикативная конструкция означает «стали», а δοῦλοι указывает на рабское, зависимое положение, которое здесь не следует смягчать словом «слуги».
- source_word: διʼ αὐτάς
  choice: из-за них
  rationale: Местоимение относится к женщинам; повтор причинного оборота сохраняет параллелизм греческого текста.
