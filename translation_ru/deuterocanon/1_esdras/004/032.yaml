lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: О мужи
  rationale: Сохраняет прямое риторическое обращение к собравшимся мужчинам; «мужи» здесь уместно в dignified библейском регистре и не смешивает адресатов с женщинами, о которых далее говорится в третьем лице.
- source_word: πῶς οὐκ ἰσχυραὶ αἱ γυναῖκες
  choice: разве женщины не сильны
  rationale: 'Передаёт риторический вопрос, подразумевающий утвердительный ответ: женщины действительно сильны. «Сильны» сохраняет широкое значение ἰσχυραί без преждевременного уточнения характера силы.'
- source_word: ὅτι οὕτως πράσσουσιν
  choice: если они так поступают
  rationale: В данном риторическом контексте ὅτι указывает на основание вывода; русское «если» естественно связывает наблюдаемое действие с заключением, не вводя лишних деталей.
