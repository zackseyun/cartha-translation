  yaml_path: translation/deuterocanon/1_esdras/004/064.yaml
  text: Then the king said to him, “Ask for whatever you want beyond what has been written, and we will give it to you, since you have been found wiser; and you shall sit next to me, and you shall be called my kinsman.”
translation:
  language: ru
  text: 'Тогда царь сказал ему: «Проси чего хочешь сверх написанного, и мы дадим тебе, поскольку ты оказался мудрее; ты будешь сидеть рядом со мной и будешь называться моим родственником».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείω τῶν γεγραμμένων
  choice: сверх написанного
  rationale: Буквально передаёт сравнительно-разделительную конструкцию и сохраняет отсылку к ранее записанному обещанию.
- source_word: ὃν τρόπον εὑρέθης σοφώτερος
  choice: поскольку ты оказался мудрее
  rationale: ὃν τρόπον здесь вводит основание, а εὑρέθης передано естественным русским «оказался»; сравнительная степень σοφώτερος сохранена без уточнения объекта сравнения.
- source_word: ἐχόμενός μου
  choice: рядом со мной
  rationale: В данном контексте выражение обозначает почётное место непосредственно возле царя.
- source_word: συγγενής μου
  choice: моим родственником
  rationale: Нейтрально сохраняет широкий смысл συγγενής — человек, состоящий в родстве, — не конкретизируя степень или юридический характер связи.
