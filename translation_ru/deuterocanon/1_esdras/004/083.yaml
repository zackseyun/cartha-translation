  verdict: approve
  source_fidelity: «Взял письма» точно передаёт ἔλαβεν τὰς ἐπιστολάς. «Отправился в Вавилон» естественно передаёт ἐξῆλθεν εἰς Βαβυλῶνα без неидиоматичной кальки. «Известил всех своих братьев» корректно передаёт ἀπήγγειλεν τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν и, подобно греческому, не называет содержание сообщения.
  naturalness: Текст звучит естественно на современном литературном русском. «Известил» имеет несколько книжный, но вполне уместный для повествовательного библейского регистра оттенок и грамматически допускает невыраженное содержание сообщения.
  terminology: '«Письма», «Вавилон» и «братья» выбраны точно и последовательно. Буквальное «братья» оправдано: хотя в контексте оно может иметь более широкое групповое значение, оснований раскрывать его как «соплеменников» нет.'
