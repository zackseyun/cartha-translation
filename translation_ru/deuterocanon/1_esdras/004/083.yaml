  text: And he took the letters and went out to Babylon and reported to all his brothers[a].
translation:
  language: ru
  text: И он взял письма, отправился в Вавилон и известил всех своих братьев[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сообщил всем своим братьям»; о чём именно он сообщил, в греческом тексте прямо не сказано — это подразумевается из контекста.'
    reason: Сохраняется синтаксическая неопределённость оригинала, где после ἀπήγγειλεν нет явно выраженного дополнения, обозначающего содержание сообщения.
lexical_decisions:
- source_word: ἔλαβεν
  choice: взял
  rationale: Прямое повествовательное соответствие аористу λαμβάνω; не добавляет оттенка официального получения.
- source_word: τὰς ἐπιστολάς
  choice: письма
  rationale: Обычное и естественное значение ἐπιστολή в контексте письменных сообщений.
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: отправился в Вавилон
  rationale: Передаёт движение к месту назначения естественным современным русским языком; буквальное «вышел в Вавилон» здесь звучало бы неясно и неидиоматично.
- source_word: ἀπήγγειλεν
  choice: известил
  rationale: Глагол передаёт значение сообщения или объявления и позволяет по-русски сохранить отсутствие явно названного содержания сообщения.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: всех своих братьев
  rationale: Сохраняет буквальный родственный термин ἀδελφοί и охватывающий смысл πᾶσιν; контекст может подразумевать также соплеменников, но не требует заменять исходный образ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Отправился» выбрано вместо формально буквального, но неестественного «вышел»; «известил» сохраняет достоинство стиля и не вынуждает добавлять отсутствующий в греческом объект.
