  text: And he stopped speaking; and then all the people cried out[a], and then they said, “Great is the truth, and it prevails.”
translation:
  language: ru
  text: 'И он умолк; тогда весь народ воскликнул, и тогда все сказали: «Велика истина, и она одерживает верх»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Велика истина, и она сильнее всего»; возможны также переводы: «она побеждает» или «она преобладает».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπησεν τοῦ λαλεῖν
  choice: он умолк
  rationale: Сочетание означает прекращение речи. Краткое русское «умолк» естественно передаёт завершённое действие без тяжеловесного «перестал говорить».
- source_word: πᾶς ὁ λαός
  choice: весь народ
  rationale: λαός обозначает собравшийся народ; «весь народ» точно передаёт совокупность и сохраняет возвышенный повествовательный регистр.
- source_word: ἐφώνησεν
  choice: воскликнул
  rationale: Глагол обозначает громкое публичное возглашение. Единственное число сохранено в согласовании с собирательным существительным «народ».
- source_word: τότε … καὶ τότε
  choice: тогда … и
  rationale: Повтор τότε в греческом тексте звучит тяжеловесно по-русски; последовательность действий естественно выражена одним «тогда» и союзом «и», без изменения смысла.
- source_word: Μεγάλη ἡ ἀλήθεια
  choice: Велика истина
  rationale: Предикативное прилагательное перед существительным сохранено в форме торжественного, афористического возгласа. Артикль не требует отдельного русского соответствия.
- source_word: ὑπερισχύει
  choice: она одерживает верх
  rationale: Глагол выражает превосходство, преобладание или победу. «Одерживает верх» сохраняет динамическую силу формы настоящего времени и не сводит её только к абстрактному «преобладает».
theological_decisions:
- issue: Характер утверждения об ἀλήθεια
  choice: истина
  alternative: правда
  rationale: «Истина» соответствует отвлечённому и афористическому характеру возгласа и не ограничивает смысл нравственной или судебной «правдой».
- issue: Смысл ὑπερισχύει
  choice: одерживает верх
  alternative: сильнее всего / побеждает / преобладает
  rationale: Выбранный вариант сохраняет открытую смысловую область глагола — превосходство и победное преобладание — не превращая фразу в догматически уточнённое утверждение.
translation_notes:
  register: Современный литературный русский язык с кратким торжественным ритмом публичного возгласа. Синтаксис сделан естественным для русского, при этом сохранены коллективное действие народа и афористическая кульминация.
