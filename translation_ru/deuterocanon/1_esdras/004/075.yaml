base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/075.yaml
  text: And to all who go up from Babylonia to build the city[a], freedom is to belong to them and to their children[b], and to all the priests who go up.
translation:
  language: ru
  text: И всем, кто поднимается из Вавилонии[a], чтобы строить город, должна быть предоставлена свобода[b] — им и их детям, а также всем поднимающимся священникам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом стоит название области — «Вавилония», а не название города «Вавилон».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «свобода должна принадлежать им». Здесь не уточняется, какие именно права или льготы подразумеваются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς προσβαίνουσιν
  choice: всем, кто поднимается
  rationale: 'Причастная конструкция имеет распределительное значение: «всем тем, кто…». Глагол προσβαίνω в контексте возвращения к Иерусалиму передан как «поднимается», что сохраняет библейско-географический образ восхождения.'
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: из Вавилонии
  rationale: В греческом употреблено название области Βαβυλωνία, а не название города Βαβυλών; поэтому «Вавилония» точнее, чем «Вавилон».
- source_word: κτίσαι τὴν πόλιν
  choice: чтобы строить город
  rationale: κτίζω может означать «основывать», «созидать», «строить». Хотя по контексту речь может идти о восстановлении, в тексте это прямо не уточняется, поэтому выбрано нейтральное «строить».
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: должна быть предоставлена свобода
  rationale: Инфинитив выражает содержание повеления или постановления. Буквальное «свобода должна принадлежать» по-русски тяжеловесно; выбранная формулировка естественно передаёт дарование свободы, не уточняя её юридический объём.
- source_word: ἐλευθερίαν
  choice: свобода
  rationale: Основное значение слова — «свобода, вольность». Возможный более узкий смысл льготы или освобождения от повинностей самим стихом не определён.
- source_word: αὐτοῖς τε καὶ τοῖς τέκνοις αὐτῶν
  choice: им и их детям
  rationale: Дательный падеж указывает на получателей свободы; τέκνα естественно передаётся словом «дети» без неоправданного сужения до «сыновей».
- source_word: καὶ πᾶσι τοῖς ἱερεῦσι τοῖς προσβαίνουσιν
  choice: а также всем поднимающимся священникам
  rationale: Заключительная фраза распространяет ту же свободу на поднимающихся священников. Повторение идеи восхождения сохраняет структуру и образность греческого текста.
theological_decisions:
- issue: Характер даруемой ἐλευθερία
  choice: Передать широким словом «свобода», не определяя конкретную юридическую льготу.
  alternative: Истолковать как освобождение от налогов, повинностей или иную гражданскую неприкосновенность.
  rationale: Стих говорит о даровании свободы, но не раскрывает её административно-правового содержания. Широкая передача сохраняет неопределённость источника и не вносит отсутствующего в нём уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством официального постановления. Формулировка остаётся понятной широкому читателю; «поднимается» сохраняет традиционный образ восхождения к Иерусалиму, а «должна быть предоставлена» естественно передаёт предписывающий инфинитив греческого текста.
