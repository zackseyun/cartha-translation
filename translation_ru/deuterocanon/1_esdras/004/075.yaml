  verdict: approve
  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: все возвращающиеся/поднимающиеся из Вавилонии для строительства города, их дети и все поднимающиеся священники названы получателями ἐλευθερία. «Вавилония» верно сохраняет региональное название Βαβυλωνία. «Строить город» не вносит интерпретирующего «восстанавливать». Формула «должна быть предоставлена свобода» несколько эксплицирует декретный характер высказывания, но в данном контексте адекватно передаёт предписывающее содержание инфинитива ὑπάρχειν и не сужает значение ἐλευθερία до налоговой льготы.'
