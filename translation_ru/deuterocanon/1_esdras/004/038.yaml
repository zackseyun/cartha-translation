  terminology: «Истина» — точный и естественный эквивалент ἀλήθεια. «Сильна» удачно сохраняет различие между ἰσχύει и κρατεῖ; «торжествует» хорошо передаёт деятельное преобладание κρατεῖ и не дублирует предыдущее сказуемое.
