  source_fidelity: 'Текст точно передаёт все смысловые элементы греческого оригинала: ἡ ἀλήθεια — «истина», μένει — «пребывает», ἰσχύει — «сильна», ζῇ — «живёт», κρατεῖ — «торжествует». Обе временные формулы сохранены раздельно: «вовеки» и усиленное «во веки веков». Персонификация истины в двух последних сказуемых сохранена без добавления богословских отождествлений.'
