  text: And the truth remains and is strong forever, and lives and prevails forever and ever.
translation:
  language: ru
  text: А истина пребывает и сильна вовеки; она живёт и торжествует во веки веков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: истина
  rationale: Определённый артикль и контекст выделяют истину как персонифицированный субъект; в русском отдельное указательное слово не требуется.
- source_word: μένει
  choice: пребывает
  rationale: Передаёт непрерывность и неизменность, сохраняя возвышенный, но понятный библейский регистр.
- source_word: ἰσχύει
  choice: сильна
  rationale: Отражает присущую истине силу и не смешивает этот глагол с последующим κρατεῖ.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Естественный для русского библейского регистра эквивалент греческого обозначения вечной длительности.
- source_word: ζῇ
  choice: живёт
  rationale: Сохраняет явную персонификацию истины.
- source_word: κρατεῖ
  choice: торжествует
  rationale: Передаёт активное превосходство и победу, оставаясь смыслово отличным от ἰσχύει.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: во веки веков
  rationale: Устоявшееся русское выражение сохраняет усиленную и кульминационную формулу оригинала.
theological_decisions:
- issue: Персонификация истины
  choice: Сохранить личностно окрашенные сказуемые «живёт» и «торжествует»
  alternative: 'Передать абстрактно: «истина не исчезает и сохраняет силу»'
  rationale: Греческий текст прямо приписывает истине жизнь и деятельное превосходство; такая передача сохраняет риторику источника, не вводя дополнительных догматических отождествлений.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Союз «А» сохраняет связь и контраст с предшествующим контекстом. Местоимение «она» после точки с запятой делает длинную координацию естественной по-русски, не меняя субъекта.
