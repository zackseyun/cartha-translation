  text: And the second will sit beside Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
translation:
  language: ru
  text: А второй благодаря своей мудрости сядет рядом с Дарием[a] и будет назван родственником Дария[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет сидеть рядом с Дарием»; греческий глагол обозначает занятие места. Точный оттенок — собственное действие или предоставление почётного места — не вполне ясен.'
    reason: lexical_alternative
  - marker: b
    text: «Родственник» может означать как родича, так и почётное наименование человека, особо приближённого к Дарию.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
  choice: второй
  rationale: Субстантивированное порядковое числительное сохранено без уточнения, которого нет в греческом тексте; оно обозначает второго из упоминаемых участников.
- source_word: καθιεῖται
  choice: будет посажен рядом
  rationale: Будущая форма передаёт размещение на почётном месте. Страдательная русская конструкция естественно выражает оказанную при дворе честь, а «рядом» отражает предполагаемую близость к царю, не превращая её прямо в должностной ранг.
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  choice: за свою мудрость
  rationale: διά с винительным имеет причинное значение; по-русски «за свою мудрость» ясно выражает основание для оказанной чести.
- source_word: συγγενής
  choice: родственником
  rationale: Основное значение — человек одного рода, родственник; при дворе слово могло также служить почётным обозначением близкого к царю лица, что отмечено в сноске.
- source_word: κληθήσεται
  choice: будет назван
  rationale: Будущее страдательное значение сохранено и не уточняется, идёт ли речь о буквальном родстве или официальном почётном наименовании.
