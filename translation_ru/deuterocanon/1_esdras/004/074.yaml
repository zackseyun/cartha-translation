  register: Современный литературный русский язык с сохранением библейского культового термина «всесожжения». Синтаксис сделан ясным при помощи двоеточия и тире, но эллипсис после «семнадцать» сохранён и пояснён в сноске; неопределённость относительно металла также не устранена.
