  text: and on the altar to offer burnt offerings daily[a], as they have been commanded, to offer seventeen, and another ten talents yearly[c][b];
translation:
  language: ru
  text: 'И ежедневно приносить на жертвенник всесожжения[a], как им заповедано: приносить семнадцать[b], а также ежегодно — ещё десять талантов[c];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Употреблённый здесь греческий глагол необычен; более буквально он может означать «обеспечивать» или «доставлять» всесожжения.
    reason: lexical_alternative
  - marker: b
    text: После слова «семнадцать» греческий текст не называет предмет счёта; вероятно, речь идёт о жертвенных приношениях, составлявших ежедневную норму.
    reason: alternative_reading
  - marker: c
    text: Талант — крупная мера веса, часто применявшаяся для драгоценных металлов; какой именно металл имеется в виду, здесь не сказано.
    reason: cultural_note
lexical_decisions:
- source_word: θυσιαστήριον
  choice: жертвенник
  rationale: Обычный и точный русский культовый термин для жертвенника, на котором совершаются жертвоприношения.
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Устоявшееся библейское обозначение жертв, полностью сжигаемых на жертвеннике.
- source_word: καρποῦσθαι
  choice: приносить
  rationale: В данном жертвенном контексте передаёт совершение или обеспечение приношений; необычность греческого глагола отмечена в сноске.
- source_word: καθ’ ἡμέραν
  choice: ежедневно
  rationale: Естественно и точно передаёт регулярность действия.
- source_word: καθὰ ἔχουσιν ἐντολήν
  choice: как им заповедано
  rationale: Передаёт соответствие уже действующему повелению без архаичной тяжеловесности.
- source_word: ἑπτὰ καὶ δέκα
  choice: семнадцать
  rationale: Идиоматическая передача греческого числительного; не названный в тексте предмет счёта намеренно не добавлен.
- source_word: προσφέρειν
  choice: приносить
  rationale: Точно передаёт культовое действие представления жертв или даров; повтор сохраняет связь с жертвенным контекстом.
- source_word: ἄλλα τάλαντα δέκα
  choice: ещё десять талантов
  rationale: Сохраняет добавочное значение ἄλλα и не уточняет не названный в греческом тексте металл.
- source_word: κατ’ ἐνιαυτόν
  choice: ежегодно
  rationale: Краткая современная передача ежегодной периодичности.
