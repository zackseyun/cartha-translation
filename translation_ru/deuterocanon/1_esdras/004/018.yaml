  yaml_path: translation/deuterocanon/1_esdras/004/018.yaml
  text: It makes the mind of the king and of the orphan one[a], and that of the servant and that of the free, and that of the poor and that of the rich.
translation:
  language: ru
  text: Она делает образ мыслей царя и сироты, раба и свободного, бедного и богатого одинаковым[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делает ум (или мысль) царя и сироты одним»; идиоматически: «заставляет царя и сироту думать одинаково», и так же — следующие пары.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: делает
  rationale: Передаёт простое настоящее время и значение причинения, не добавляя отсутствующего в греческом объяснения.
- source_word: τὴν διάνοιαν μίαν
  choice: делает единым образ мыслей
  rationale: διάνοια может означать ум, мысль, образ мыслей или внутренний настрой, а μίαν подчёркивает единство. Формулировка сохраняет образ оригинала и остаётся естественной по-русски.
- source_word: βασιλέως
  choice: царя
  rationale: Обычное и контекстуально точное значение слова βασιλεύς.
- source_word: ὀρφανοῦ
  choice: сироты
  rationale: Прямой современный эквивалент ὀρφανός; социальный контраст сохранён без уточнения пола или возраста.
- source_word: οἰκέτου
  choice: раба
  rationale: οἰκέτης обозначает домашнего слугу, находящегося в рабском положении; противопоставление ἐλεύθερος указывает именно на несвободный статус.
- source_word: ἐλευθέρου
  choice: свободного
  rationale: Сохраняет прямое противопоставление рабу и не вводит устаревшее «свободнорождённый».
- source_word: πένητος
  choice: бедного
  rationale: Естественно передаёт человека скромного достатка или нуждающегося и образует ясную пару с «богатым».
- source_word: πλουσίου
  choice: богатого
  rationale: Прямой эквивалент и естественный антоним к «бедному» в риторическом перечислении.
theological_decisions:
- issue: Перечисленные социальные противоположности уравниваются по образу мыслей, но сам стих не объясняет ни механизма, ни богословского смысла этого воздействия.
  choice: Передать три пары социальных противоположностей без богословского пояснения.
  alternative: Истолковать фразу как утверждение, что все эти люди начинают думать совершенно одинаково.
  rationale: Греческий текст говорит лишь о том, что их διάνοια становится μία; более подробное объяснение сузило бы смысл и устранило бы присущую формулировке образность.
- issue: Подлежащее ποιεῖ в данном отрывке подразумевается из предшествующего контекста.
  choice: «Она»
  alternative: «Это»
  rationale: В окружающем рассуждении речь идёт о женщине; русское местоимение естественно сохраняет контекстуальную связь, тогда как безличное «это» затемнило бы её.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного параллелизма трёх социальных пар. «Раб» выбран вместо более расплывчатого «слуга», поскольку контраст со свободным указывает на правовой статус.
