translation:
  language: ru
  text: Он также записал обеспечение и священническое облачение[a], указав, в чём им совершать служение в нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он также записал снабжение и священническое одеяние, указав, в чём им совершать служение в нём». Греческая фраза сжата: сочетание «в чём… в нём» допускает более одного синтаксического понимания; последнее местоимение, вероятно, относится к облачению.'
