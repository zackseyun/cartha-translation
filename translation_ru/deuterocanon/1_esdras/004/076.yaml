lexical_decisions:
- source_word: ἔγραψεν
  choice: записал
  rationale: Аорист γράφω обозначает письменную фиксацию; «записал» естественно передаёт административный характер действия без добавления отсутствующего в греческом περί.
- source_word: χορηγίαν
  choice: содержание
  rationale: χορηγία означает предоставляемое снабжение или обеспечение. «Содержание» достаточно широко охватывает материальное обеспечение храмового служения и не сводит его только к деньгам.
- source_word: ἱερατικὴν στολήν
  choice: священническое облачение
  rationale: στολή — одежда, одеяние; в культовом контексте «облачение» точно и естественно обозначает священническую одежду, не вводя конкретного фасона.
- source_word: ἐν τίνι
  choice: какое должно быть
  rationale: Греческое выражение синтаксически сжато и буквально означает «в чём». Русская формулировка раскрывает подразумеваемое указание, сохраняя связь с последующим служением.
- source_word: λατρεύσουσιν
  choice: им надлежит совершать служение
  rationale: λατρεύω в храмовом контексте означает культовое служение. Такая формулировка передаёт будущую/предписывающую направленность формы и не ограничивает смысл одним обрядом.
- source_word: ἐν αὐτῇ
  choice: в котором
  rationale: Местоимение женского рода наиболее естественно относится к στολή; по-русски относительное местоимение согласовано со словом «облачение» и передаёт смысл служения в этой одежде.
