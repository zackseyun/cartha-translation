translation:
  language: ru
  text: Разве не велик тот, кто совершает всё это? И истина велика и сильнее всего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχὶ μέγας ὃς ταῦτα ποιεῖ
  choice: Разве не велик тот, кто совершает всё это?
  rationale: Риторический вопрос передан естественной русской конструкцией; ταῦτα сохранено как «всё это», а ποιεῖ — как «совершает», что соответствует возвышенному контексту.
- source_word: ἡ ἀλήθεια
  choice: истина
  rationale: Прямое и стилистически уместное соответствие греческому существительному с абстрактным значением.
- source_word: μεγάλη καὶ ἰσχυροτέρα παρὰ πάντα
  choice: велика и сильнее всего
  rationale: Сохранены параллельные предикаты и сравнительное значение παρὰ πάντα; «сильнее всего» естественно передаёт превосходство над всем без добавочного толкования.
theological_decisions:
- issue: Связь второго предложения с риторическим вопросом
  choice: Но истина велика и сильнее всего
  alternative: И истина велика и сильнее всего
  rationale: Греческое καί допускает как простое присоединение, так и контекстуально-контрастный оттенок. «Но» естественно подчёркивает переход от величия действующего лица к превосходству истины, не меняя содержания утверждения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Синтаксический параллелизм и напряжение между величием совершающего дела и превосходством истины сохранены.
