lexical_decisions:
- source_word: ἀναβῆναι
  choice: взойти
  rationale: Сохраняет библейско-географический оборот о восхождении в Иерусалим и не сводит значение к возвращению.
- source_word: οἰκοδομῆσαι
  choice: восстановить
  rationale: Хотя глагол буквально означает «строить», контекст разрушенных Иерусалима и храма указывает на их восстановление.
- source_word: τὸ ἱερὸν
  choice: храм
  rationale: В данном контексте речь идёт о храме как священном комплексе; «храм» — естественное русское соответствие.
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπʼ αὐτῷ
  choice: над которым было наречено Его имя
  rationale: Близко передаёт библейскую формулу принадлежности и связи с Божьим именем, не заменяя её истолкованием.
- source_word: ἐκωθωνίζοντο
  choice: праздновали
  rationale: Редкий глагол обозначает праздничное веселье; нейтральное «праздновали» не привносит отрицательного оттенка разгула.
- source_word: μετὰ μουσικῶν
  choice: с музыкой
  rationale: Передаёт музыкальное сопровождение, не уточняя без достаточных оснований, имеются ли в виду музыканты или инструменты.
- source_word: χαρᾶς
  choice: радостью
  rationale: Прямое и естественное соответствие в праздничном контексте.
- source_word: ἡμέρας ἑπτά
  choice: семь дней
  rationale: В сочетании с русским глаголом «праздновали» винительный падеж естественно выражает длительность.
theological_decisions:
- issue: Формула Божьего имени применительно к храму
  choice: над которым было наречено Его имя
  alternative: который носит Его имя; где призывалось Его имя
  rationale: Сохранена образная библейская формула, выражающая принадлежность храма Богу и связь с Ним, без сведения её к одному истолкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Местоимение «Его» написано с прописной буквы для ясного указания на Бога. Пунктуация разделяет цель разрешения и последующее семидневное празднование.
