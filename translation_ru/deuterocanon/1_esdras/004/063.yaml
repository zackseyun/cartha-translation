    rationale: Греческое ἐπʼ αὐτῷ в этой формуле относится к храму как к месту, на котором наречено имя Бога. Русское «над которым было наречено» создаёт неестественный пространственный образ и ослабляет связь имени с храмом. «На котором было наречено Его имя» точнее и традиционно понятно.
  - severity: low
    issue: Порядок слов в указании на длительность
    rationale: «И они семь дней праздновали» звучит немного естественнее, чем «И семь дней они праздновали», при полном сохранении значения.
