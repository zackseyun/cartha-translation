translation:
  language: ru
  text: И он письменно распорядился выдавать левитам содержание до того дня, когда будет завершён дом[a] и будет построен Иерусалим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм». В греческом тексте буквально стоит «дом» — обычное в этом контексте обозначение храма.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отстроен Иерусалим». Контекст говорит о восстановлении города, хотя сам греческий глагол означает «быть построенным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: письменно распорядился
  rationale: Глагол означает «написал», но в сочетании с инфинитивом здесь передаёт содержание письменного распоряжения; перевод естественно выражает форму и директивную силу.
- source_word: δοῦναι
  choice: выдавать
  rationale: Аористный инфинитив зависит от ἔγραψεν и обозначает предписанное предоставление содержания; несовершенный вид по-русски уместно передаёт продолжающееся обеспечение до указанного срока.
- source_word: τὴν χορηγίαν
  choice: содержание
  rationale: χορηγία обозначает материальное обеспечение или средства на нужды; «содержание» достаточно широко и естественно для регулярной поддержки левитов.
- source_word: τοῖς Λευείταις
  choice: левитам
  rationale: Дательный падеж обозначает получателей обеспечения.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: до того дня, когда
  rationale: Передаёт временной предел и естественно воспроизводит относительную конструкцию.
- source_word: ἐπιτελεσθῇ
  choice: будет завершён
  rationale: Пассивный аористный конъюнктив указывает на доведение строительства до завершения.
- source_word: ὁ οἶκος
  choice: дом
  rationale: Сохранено буквальное значение греческого слова и его обычное в данном контексте обозначение храма; пояснение дано в сноске.
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: отстроен Иерусалим
  rationale: οἰκοδομηθῆναι буквально означает «быть построенным»; «отстроен» естественно для восстановления разрушенного города, не делая значение чрезмерно конкретным.
