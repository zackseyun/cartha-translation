base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/043.yaml
  text: And some of the heads of families[a], when they arrived at the temple of God in Jerusalem, pledged to raise up the house on its site, according to their ability,
translation:
  language: ru
  text: И некоторые из глав родов, когда они пришли в храм Бога в Иерусалиме, обязались[a] воздвигнуть дом на его месте по мере своих сил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дали обет». Греческий глагол может обозначать принесение обета, но здесь также может выражать торжественное обязательство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγουμένων κατὰ τὰς πατριὰς
  choice: глав родов
  rationale: Сочетание обозначает руководителей родовых объединений; «главы родов» естественно передаёт социальную структуру и сохраняет связь с происхождением по отцовской линии.
- source_word: παραγίνεσθαι
  choice: придя
  rationale: В данном контексте глагол описывает их прибытие к храму в Иерусалиме; деепричастие естественно передаёт временное отношение к основному действию.
- source_word: ἱερὸν τοῦ θεοῦ
  choice: храм Бога
  rationale: ἱερόν обозначает храм или храмовый комплекс; «храм Бога» ясно и непосредственно передаёт смысл.
- source_word: εὔξαντο
  choice: обязались
  rationale: Глагол допускает значение обета, но с инфинитивом также выражает торжественно принятое обязательство. «Обязались» сохраняет серьёзность решения, не превращая его однозначно в формальный культовый обет.
- source_word: ἐγεῖραι
  choice: воздвигнуть
  rationale: Буквально глагол означает «поднять, воздвигнуть». В контексте подразумевается восстановление разрушенного храма, однако выбранное слово сохраняет образ греческого текста.
- source_word: οἶκον
  choice: дом
  rationale: Здесь «дом» означает дом Бога, то есть храм. Сохранение слова поддерживает библейский образ, а предыдущее упоминание храма устраняет неясность.
- source_word: ἐπὶ τοῦ τόπου αὐτοῦ
  choice: на его месте
  rationale: Фраза указывает на возведение дома на принадлежавшем ему прежнем месте; русский оборот краток и естественен.
- source_word: κατὰ τὴν αὐτῶν δύναμιν
  choice: по мере своих сил
  rationale: Выражение охватывает как материальные возможности, так и практическую способность; русский оборот сохраняет эту широту.
theological_decisions:
- issue: Следует ли понимать εὔξαντο как формальный религиозный обет или как более широкое торжественное обязательство
  choice: обязались
  alternative: дали обет
  rationale: Контекст говорит о восстановлении храма, а конструкция с инфинитивом выражает принятие обязательства. Основной текст не утверждает формальный культовый статус действия, тогда как сноска сохраняет возможное значение обета.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Главы родов» и «воздвигнуть дом» сохраняют исторический и храмовый колорит, оставаясь понятными современному читателю.
