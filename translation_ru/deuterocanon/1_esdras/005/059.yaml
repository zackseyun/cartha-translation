base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/059.yaml
  text: And all the people sounded trumpets and shouted with a loud voice, praising the Lord because of the raising up of the house of the Lord.
translation:
  language: ru
  text: И весь народ затрубил и громко воскликнул, восхваляя Господа за возведение дома Господнего[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за восстановление дома Господнего». Греческое слово буквально означает «поднятие»; в данном контексте оно может подразумевать как возведение, так и восстановление храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ λαός
  choice: весь народ
  rationale: Естественное русское обозначение всей собравшейся общины, сохраняющее значение всеохватности.
- source_word: ἐσάλπισαν
  choice: трубил в трубы
  rationale: Глагол означает подачу звука трубами; явное дополнение делает выражение понятным и идиоматичным по-русски.
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: громко восклицал
  rationale: Передаёт и громкость, и торжественный возглас без тяжеловесного буквального оборота «великим голосом».
- source_word: ὑμνοῦντες
  choice: восхваляя
  rationale: Сохраняет направленную к Богу хвалу, не уточняя без достаточных оснований, была ли она непременно песенной.
- source_word: τῷ κυρίῳ
  choice: Господа
  rationale: Обычное русское соответствие греческому κύριος при обозначении Бога Израиля.
- source_word: ἐπὶ τῇ ἐγέρσει
  choice: за возведение
  rationale: «Возведение» естественно передаёт образ поднятия или сооружения здания и не сводит смысл исключительно к закладке основания; возможность понимания как восстановления отмечена в сноске.
- source_word: τοῦ οἴκου Κυρίου
  choice: дома Господнего
  rationale: Сохраняет библейский образ «дома Господнего» и его межтекстовые связи, не заменяя его более толковательным словом «храм».
theological_decisions:
- issue: Передача κύριος применительно к Богу Израиля в храмовом контексте
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Перевод следует непосредственно греческому κύριος, а не реконструирует в основном тексте написание еврейского Божьего имени.
- issue: Значение ἐγέρσις применительно к дому Господнему
  choice: возведение
  alternative: восстановление / отстройка заново
  rationale: Основной текст сохраняет широкий образ сооружения и поднятия здания, тогда как сноска отмечает контекстуально возможный смысл восстановления, не разрешая неоднозначность молча.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Единственное число сказуемых согласовано с собирательным подлежащим «весь народ»; греческое множественное число отражает множественность участников.
