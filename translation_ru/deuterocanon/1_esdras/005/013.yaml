  text: the sons of Bebai[a], six hundred thirty-three; the sons of Argai, one thousand three hundred twenty-two.
translation:
  language: ru
  text: потомков Вевая — шестьсот тридцать три; потомков Аргая[a] — тысяча триста двадцать два.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте стоит «Аргай». В приблизительной параллели масоретского текста — «Азгад» и другое число: 1 222. Таким образом, список в 1 Ездры здесь не полностью совпадает с еврейским списком.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: потомков
  rationale: В перечне возвратившихся это формула, обозначающая родовую группу, связанную с названным предком; «потомков» естественно передаёт смысл по-русски и не ограничивает группу непосредственными сыновьями.
- source_word: Βηβαί
  choice: Вевая
  rationale: Имя передано с греческой формы Βηβαί; падежная форма обусловлена словом «потомков».
- source_word: ἑξακόσιοι τριάκοντα τρεῖς
  choice: шестьсот тридцать три
  rationale: Число прямо следует греческому тексту и передано в современной русской форме.
- source_word: Ἀργαί
  choice: Аргая
  rationale: Основной греческий источник читает Ἀργαί; форма «Аргая» является русским родительным падежом имени Аргай. Отличие от приблизительной масоретской параллели сохранено и отмечено в сноске.
- source_word: χίλιοι τριακόσιοι εἴκοσι δύο
  choice: тысяча триста двадцать два
  rationale: Число прямо следует греческому тексту, несмотря на иное число в приблизительной масоретской параллели.
