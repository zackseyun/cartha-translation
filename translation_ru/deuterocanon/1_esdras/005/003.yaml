lexical_decisions:
- source_word: τυμπάνων
  choice: бубнов
  rationale: τύμπανον обозначает ручной ударный инструмент, подобный бубну; «бубны» естественно и ясно передают праздничный музыкальный контекст.
- source_word: αὐλῶν
  choice: свирелей
  rationale: αὐλός — духовой, обычно язычковый инструмент; «свирели» передают древний тип инструмента лучше, чем современно ассоциируемые «флейты», при сохранении доступного литературного регистра.
- source_word: ἀδελφοὶ
  choice: братья
  rationale: Греческое слово стоит в мужском роде множественного числа; буквальное «братья» сохраняет эту форму, не подменяя её более широким понятием родства.
- source_word: παίζοντες
  choice: играли
  rationale: παίζω может означать праздничную игру, музыку или пляску; рядом с названиями инструментов «играли» сохраняет наиболее вероятный музыкальный смысл, не уточняя его чрезмерно.
- source_word: ἐποίησεν ... συναναβῆναι
  choice: велел им подняться вместе
  rationale: Каузативная конструкция буквально выражает побуждение к совместному восхождению; «велел» естественнее по-русски, чем тяжеловесное «сделал так, чтобы», и сохраняет прямую каузативность.
- source_word: μετʼ ἐκείνων
  choice: с теми людьми
  rationale: Указательное ἐκείνων имеет дистанцирующую силу «с теми»; существительное «людьми» добавлено для естественности русского языка, но его референт определяется контекстом.
