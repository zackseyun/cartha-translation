    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: После этого
  rationale: Естественный современный переход, сохраняющий временную и повествовательную связь; множественное ταῦτα по-русски идиоматично передаётся единственным «этого».
- source_word: ἐξελέγησαν
  choice: были избраны
  rationale: Прямая передача пассивной формы без добавочного смысла назначения на должность.
- source_word: ἀναβῆναι
  choice: отправиться в путь
  rationale: В данном контексте обозначает выступление в обратный путь; буквальное «взойти» по-русски звучало бы неестественно, а пункт назначения в самом стихе не назван.
- source_word: ἀρχηγοὶ οἴκου πατριῶν
  choice: главы родовых домов
  rationale: «Главы» передаёт руководящую роль ἀρχηγοί, а «родовые дома» — объединения семей по отцовской линии, не сводя их к отдельным домохозяйствам.
- source_word: κατὰ φυλὰς αὐτῶν
  choice: каждый по своему племени
  rationale: Передаёт распределительное значение κατά и естественно связывает организацию глав с их племенной принадлежностью.
- source_word: αἱ γυναῖκες αὐτῶν
  choice: их жёны
  rationale: В перечне членов семей γυναῖκες естественнее всего означает жён.
- source_word: οἱ υἱοὶ καὶ αἱ θυγατέρες
  choice: сыновья и дочери
  rationale: Сохраняет раздельное обозначение сыновей и дочерей в греческом тексте.
- source_word: οἱ παῖδες αὐτῶν
  choice: слуги
  rationale: Поскольку сыновья и дочери уже названы, здесь вероятнее всего имеются в виду зависимые домашние работники мужского пола; слово может обозначать как слуг, так и рабов.
- source_word: αἱ παιδίσκαι
  choice: служанки
  rationale: Передаёт женскую форму в паре с παῖδες естественным русским словом, не утверждая точного юридического статуса.
- source_word: τὰ κτήνη αὐτῶν
  choice: их скот
  rationale: В перечне участников переселения κτήνη обозначает домашних животных; «скот» здесь точнее и естественнее широкого «имущество».
