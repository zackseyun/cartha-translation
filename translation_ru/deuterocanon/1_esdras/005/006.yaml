  text: and from the tribe of Judah[a], who spoke wise words to Darius king of the Persians in the second year of his reign, in the month Nisan, the first month.
translation:
  language: ru
  text: и из колена Иуды — тот, кто произнёс мудрые речи перед Дарием[a], царём персов, во второй год его царствования, в месяце нисане, первом месяце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «в присутствии Дария» или «Дарию»; греческое выражение ἐπὶ Δαρείου в этом придворном контексте допускает несколько близких толкований.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλῆς δὲ Ἰούδα
  choice: и из колена Иуды
  rationale: «Колено» — естественное и традиционное русское обозначение племенного подразделения Израиля; частица δέ передана связующим «и» с учётом фрагментарного продолжения предыдущего контекста.
- source_word: ἐλάλησεν
  choice: произнёс
  rationale: В сочетании с λόγους глагол передаёт акт произнесения речи; «произнёс» по-русски естественнее буквального «говорил слова» и не добавляет содержания.
- source_word: ἐπὶ Δαρείου
  choice: перед Дарием
  rationale: В придворном контексте оборот с ἐπί и родительным падежом естественно понимать как речь в присутствии царя; неоднозначность отмечена в сноске.
- source_word: λόγους σοφούς
  choice: мудрые речи
  rationale: Сохраняется множественное число λόγους и характеристика σοφούς; «речи» лучше соответствует придворному повествовательному контексту, чем неестественное «мудрые слова» после «произнёс».
- source_word: δευτέρῳ ἔτει τῆς βασιλείας αὐτοῦ
  choice: во второй год его царствования
  rationale: Точно и естественно передаёт временное указание и значение βασιλεία как периода правления царя.
- source_word: μηνὶ Νισὰν τοῦ πρώτου μηνός
  choice: в месяце нисане, первом месяце
  rationale: Сохранены явное слово «месяц», название нисан и поясняющее приложение о его месте в календаре.
