lexical_decisions:
- source_word: Καὶ ταῦτα τὰ ὀνόματα
  choice: И вот имена
  rationale: Естественно вводит следующий далее перечень, сохраняя связующую силу Καί и указательное значение ταῦτα.
- source_word: τῶν ἀνδρῶν
  choice: мужчин
  rationale: ἀνήρ здесь обозначает именно мужчин, вероятно представителей родовых групп; обобщающее «людей» устранило бы выраженное в греческом тексте значение пола.
- source_word: τῶν ἀναβαινόντων
  choice: которые поднимались
  rationale: Передаёт настоящее причастие и традиционную пространственную перспективу восхождения в землю Израиля или к Иерусалиму, не уточняя пункт назначения сверх текста.
- source_word: κατὰ πατριὰς αὐτῶν
  choice: каждый со своим родом
  rationale: πατριά — родственная группа, ведущая происхождение от общего предка. Дистрибутивная формулировка по-русски естественно передаёт κατὰ и αὐτῶν.
- source_word: εἰς τὰς φυλὰς
  choice: к своим племенам
  rationale: Сохраняет направительное значение εἰς и различает более крупные племенные объединения φυλαί и роды πατριαί.
- source_word: ἐπὶ τὴν μεριδαρχίαν αὐτῶν
  choice: каждый в свою область
  rationale: Редкое μεριδαρχία, вероятно, обозначает выделенную территориальную или административную единицу. «Область» понятно современному читателю и не утверждает спорный точный вид управления; дистрибутивное «каждый» раскрывает смысл αὐτῶν в данном перечне.
