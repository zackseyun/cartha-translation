base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/056.yaml
  text: And they appointed the Levites[a], from twenty years old and upward, over the works of the Lord. Then Jeshua stood with his sons and brothers, and Kadmiel his brother, and the sons of Jeshua son of Henadad, and the sons of Judah son of Eliadun, together with their sons and brothers—all the Levites, united as supervisors of the work, carrying on the works in the house of the Lord[d][c][b]. And the builders built the temple of the Lord.
translation:
  language: ru
  text: 'И поставили левитов от двадцати лет и старше над работами Господними[a]. И встали Иисус со своими сыновьями и братьями — Кадмиил[b], его брат, сыновья Иисуса Хенадада[c] и сыновья Иуды, сына Елиадуна, — со своими сыновьями и братьями: все левиты единодушно руководили работами[d] и трудились над работами в доме Господа. И строители построили храм Господа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слово «работы» употреблено во множественном числе здесь и далее в стихе; его иногда сглаживают до единственного числа «работа».
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте: Дамадиил; параллельная традиция книги Ездры называет этого левита Кадмиилом.'
    reason: alternative_reading
  - marker: c
    text: 'В греческом тексте: «сыновья Иисуса Хемадавуна». Форма «Хенадад» отражает вероятное соответствие имени в параллельной еврейской традиции; связь имён можно понимать как «Иисус, сын Хенадада», однако слово «сына» в греческом тексте не выражено.'
    reason: alternative_reading
  - marker: d
    text: «Руководили работами» передаёт редкое греческое слово, обозначающее тех, кто направлял или контролировал труд.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: поставили
  rationale: В сочетании с ἐπὶ τῶν ἔργων глагол означает назначение левитов ответственными за работы, а не только их физическое размещение.
- source_word: ἀπὸ εἰκοσαετοῦς
  choice: от двадцати лет и старше
  rationale: Оборот обозначает нижний возрастной порог служения; «и старше» естественно передаёт пороговое значение.
- source_word: ἐπὶ τῶν ἔργων τοῦ κυρίου
  choice: над работами Господними
  rationale: ἐπί с родительным указывает на ответственность или надзор; множественное число ἔργων сохранено.
- source_word: ἔστη Ἰησοῦς
  choice: встал Иисус / встали Иисус и перечисленные с ним
  rationale: Русское множественное число согласовано со всем составным подлежащим, тогда как значение греческого глагола — занять своё место и приступить к порученному делу.
- source_word: Δαμαδιήλ
  choice: Кадмиил
  rationale: Основной греческий свидетель читает «Дамадиил», однако параллельная традиция Ездры надёжно указывает на известное имя Кадмиил; расхождение отмечено в сноске.
- source_word: Ἡμαδαβούν
  choice: Хенадад
  rationale: Греческая форма, вероятно, отражает семитское имя Хенадад, известное по параллельному месту; восстановление прозрачно отмечено в сноске.
- source_word: Ἰούδα τοῦ Εἰλιαδοὺν
  choice: Иуды, сына Елиадуна
  rationale: Родительный после личного имени естественно передан как указание на происхождение; менее уверенное имя Елиадун оставлено близким к греческой форме.
- source_word: ὁμοθυμαδόν
  choice: единодушно
  rationale: Наречие выражает согласованность действий и общность цели.
- source_word: ἐργοδιῶκται
  choice: руководившие работами
  rationale: Редкое сложное слово обозначает тех, кто направляет и побуждает ход работ; перевод передаёт надзор без отрицательной окраски слова «надсмотрщики».
- source_word: ποιοῦντες εἰς τὰ ἔργα
  choice: трудившиеся над работами
  rationale: Несколько необычный греческий оборот описывает деятельное участие в храмовых работах; множественное число сохранено.
- source_word: οἰκοδόμησαν οἱ οἰκοδόμοι
  choice: строители построили
  rationale: Сохранён намеренный однокоренной повтор греческого глагола и существительного.
- source_word: ναὸν τοῦ κυρίου
  choice: храм Господа
  rationale: ναός передано как «храм», чтобы сохранить отличие от οἶκος — «дом» — в предыдущей части стиха.
theological_decisions:
- issue: Передача κύριος в греческом тексте о восстановлении храма
  choice: Господь / Господний
  alternative: ГОСПОДЬ
  rationale: Непосредственный источник содержит κύριος; перевод «Господь» сохраняет греческую форму и не подменяет её реконструированным еврейским Божественным именем.
- issue: Нормализация повреждённых или сильно изменённых личных имён
  choice: Кадмиил и Хенадад с текстологическими сносками
  alternative: Дамадиил и Хемадавун строго по форме греческого текста
  rationale: Для этих двух имён параллельная традиция позволяет достаточно уверенно распознать носителей имён; сноски сохраняют доступ к форме основного греческого свидетеля. Более сомнительное имя Елиадун не реконструируется.
- issue: Связь имён Ἰησοῦ Ἡμαδαβούν
  choice: Иисуса, сына Хенадада
  alternative: Иисуса Хемадавуна / Иисуса, Хенадада
  rationale: Последовательность двух родительных в греческом сжата и формально неоднозначна; чтение как родословной связи соответствует контексту и параллельной традиции, но степень реконструкции обозначена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены повтор «строители построили», различие между «домом» и «храмом», а также множественное число «работы». Имена переданы в привычной русской библейской форме там, где параллельная традиция позволяет уверенное отождествление; текстологические решения вынесены в сноски.
