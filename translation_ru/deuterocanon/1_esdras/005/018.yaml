    reason: textual_variant
  - marker: b
    text: 'Последнее географическое название в греческом тексте неясно: оно может быть составным или искажённым при передаче. Поэтому оно сохранено в близкой транслитерации.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ / οἱ ἐξ
  choice: выходцы из
  rationale: В перечне переселенцев оборот обозначает происхождение группы из определённого места. «Выходцы из» естественно передаёт локативный смысл и не привносит формулу «сыновья», присутствующую лишь в приблизительной еврейской параллели.
- source_word: Νετέβας
  choice: Нетевас
  rationale: Имя передано близкой русской транслитерацией греческого чтения без согласования с отличающейся масоретской параллелью.
- source_word: πεντήκοντα πέντε
  choice: пятьдесят пять
  rationale: Прямое соответствие греческому количественному числительному.
- source_word: Ἐνάτου
  choice: Энат
  rationale: Греческая форма является родительным падежом; в русском тексте восстановлена удобная словарная форма топонима, а после предлога употреблён родительный падеж «Эната».
- source_word: ἑκατὸν πεντήκοντα ὀκτώ
  choice: сто пятьдесят восемь
  rationale: Прямое соответствие греческому количественному числительному.
- source_word: Βαιτασμῶν Ζαμμώθ
  choice: Байтасмон-Заммоф
  rationale: Текстуально трудное наименование сохранено посредством близкой транслитерации. Дефис показывает возможное единство сложного топонима, не утверждая точной этимологии.
