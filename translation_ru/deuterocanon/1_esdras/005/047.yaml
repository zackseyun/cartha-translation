base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/047.yaml
  text: Then Jeshua son of Jozadak arose[a], along with his brothers the priests, and Zerubbabel son of Shealtiel and his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: ru
  text: И поднялся Иешуа[a], сын Иоседека, вместе со своими братьями, священниками, а также Зоровавель, сын Салафиила, со своими братьями; они приготовили жертвенник Бога Израиля[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встал»; буквально: «поднявшись». Греческое причастие обозначает начало решительного действия.'
    reason: lexical_alternative
  - marker: b
    text: Иешуа — послепленный священник, сын Иоседека; речь не об Иисусе из Назарета. Греческое Ἰησοῦς передаёт имя, известное в еврейской традиции как Иешуа.
    reason: cross_reference
lexical_decisions:
- source_word: καταστὰς
  choice: поднялся
  rationale: Аористное причастие передаёт начало решительного действия. Личная форма естественна по-русски и не усиливает значение до «возглавил» или «приступил».
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Традиционная русская библейская передача имени этого послепленного первосвященника; примечание предотвращает отождествление с Иисусом из Назарета.
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: сын Иоседека
  rationale: Генитивная конструкция обозначает отчество; форма имени следует греческому тексту и принятой русской библейской традиции.
- source_word: οἱ ἀδελφοὶ αὐτοῦ οἱ ἱερεῖς
  choice: его братья-священники
  rationale: Сохраняется буквальное «братья» и явное указание на их священническое служение; дефисная конструкция звучит естественно и ясно.
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιὴλ
  choice: Зоровавель, сын Салафиила
  rationale: Использованы узнаваемые формы имён из русской библейской традиции, а патроним передан явно.
- source_word: ἡτοίμασαν
  choice: приготовили
  rationale: Передаёт «подготовили, сделали готовым», не уточняя без основания, что жертвенник именно построили или установили.
- source_word: τὸ θυσιαστήριον τοῦ θεοῦ Ἰσραήλ
  choice: жертвенник Бога Израиля
  rationale: «Жертвенник» — точный культовый термин; родительный падеж сохраняет отношение принадлежности или посвящения, не сводя его только к значению «для Бога».
theological_decisions:
- issue: Идентификация лица по имени Ἰησοῦς
  choice: В основном тексте сохранено имя «Иисус», а историческая идентификация пояснена в сноске.
  alternative: Иешуа или Иисус Навин
  rationale: Русская традиция передаёт греческое Ἰησοῦς как «Иисус», но здесь речь о послепленном священнике, а не об Иисусе из Назарета и не о преемнике Моисея. Сноска устраняет возможную двусмысленность без замены имени нетрадиционной формой.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис слегка упрощён по сравнению с длинной греческой цепочкой подлежащих, но её состав и последовательность сохранены. Конечная запятая оставлена, поскольку стих в источнике синтаксически продолжается.
