base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/064.yaml
  text: And they recognized that those from the captivity were building the temple for the Lord God of Israel[a][b].
translation:
  language: ru
  text: И они узнали, что пришедшие из плена[a] строят храм Господу Богу Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто из плена».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «строят храм для Господа Бога Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: узнали
  rationale: Аорист передаёт наступившее знание или распознавание факта. «Узнали» естественно звучит в повествовании и не уточняет без необходимости, получили ли они новые сведения или сами осознали происходящее.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: вернувшиеся из плена
  rationale: Греческое выражение буквально означает «те, кто из плена» и обозначает людей, вышедших или возвратившихся из плена. Выбранный вариант ясен современному читателю; более буквальная форма отмечена в сноске.
- source_word: οἰκοδομοῦσιν
  choice: строят
  rationale: 'Настоящее время в косвенной речи представляет строительство как продолжающееся действие. В русском после глагола прошедшего времени естественно сохраняется настоящее время: «узнали, что … строят».'
- source_word: τὸν ναόν
  choice: храм
  rationale: В контексте восстановления святилища Израиля ναός обозначает храмовое здание; «храм» — точный и общепонятный русский эквивалент.
- source_word: τῷ κυρίῳ θεῷ Ἰσραήλ
  choice: Господу Богу Израиля
  rationale: Русский дательный падеж непосредственно отражает греческий датив и естественно обозначает того, кому посвящается храм. Возможное целевое понимание «для Господа» сохранено в сноске.
theological_decisions:
- issue: Передача κύριος в наименовании Бога Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь Бог Израиля» — укоренённое библейское наименование, соответствующее употреблению κύριος в Септуагинте и не вносящее частного конфессионального толкования.
- issue: Значение дательного τῷ κυρίῳ θεῷ Ἰσραήλ при глаголе строительства
  choice: Господу Богу Израиля
  alternative: для Господа, Бога Израиля
  rationale: Дательный в основном тексте сохраняет грамматическую форму и допускает смысл посвящения; целевое или бенефактивное прочтение дано как допустимая альтернатива, поскольку греческий текст сам его однозначно не разграничивает.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис краток и прозрачен; настоящее время «строят» естественно передаёт продолжающееся действие в косвенной речи. Заглавные буквы в сочетании «Господу Богу» соответствуют русской библейской традиции.
