lexical_decisions:
- source_word: οὐκ ἠδύναντο ἀπαγγεῖλαι
  choice: не могли указать
  rationale: Передаёт невозможность сообщить или представить сведения о происхождении; «указать» естественно звучит в контексте родословного списка.
- source_word: τὰς πατριὰς αὐτῶν καὶ γενεάς
  choice: свои роды и родословия
  rationale: «Роды» передаёт отцовские семейные объединения, а «родословия» — засвидетельствованную линию происхождения; различие между двумя греческими терминами сохранено.
- source_word: ὡς ἐκ τοῦ Ἰσραὴλ εἰσίν
  choice: и тем подтвердить, что происходят из Израиля
  rationale: В контексте речь идёт о неспособности установить израильское происхождение по родовым сведениям. Связка «и тем подтвердить» делает подразумеваемое доказательное отношение ясным, не превращая утверждение в отрицание самого происхождения.
- source_word: υἱοὶ
  choice: потомки
  rationale: В родословном перечне υἱοί может обозначать не только непосредственных сыновей, но и членов рода; «потомки» здесь яснее для современного читателя.
- source_word: Ἀσὰν τοῦ υἱοῦ τοῦ Βαενάν
  choice: Асана, сына сына Баэнана
  rationale: Сохранено необычное двойное выражение родства в переданном греческом тексте, без молчаливого упрощения.
- source_word: Νεκωδάν
  choice: Некодана
  rationale: Имя транслитерировано по греческому первичному источнику; приблизительная масоретская параллель содержит в этом месте другие имена.
- source_word: ἑξακόσιοι πεντήκοντα δύο
  choice: шестьсот пятьдесят два человека
  rationale: Число передано точно; слово «человека» добавлено для естественности русского перечня и явно выражает подразумеваемый подсчёт лиц.
theological_decisions:
- issue: Статус израильского происхождения перечисленных людей
  choice: Фраза описывает невозможность подтвердить происхождение родословными сведениями, а не категорически отрицает его.
  alternative: Перевести так, будто автор прямо утверждает, что они не были из Израиля.
  rationale: Греческое предложение говорит о том, чего они не могли сообщить или установить; оно сохраняет напряжение между возможным происхождением и отсутствием родословного подтверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством родословного перечня. Синтаксис слегка разъяснён для удобочитаемости, но необычная греческая формула родства и неопределённость относительно доказуемости израильского происхождения сохранены.
