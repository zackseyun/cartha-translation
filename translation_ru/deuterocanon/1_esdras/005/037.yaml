base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/037.yaml
  text: 'And they were not able to declare their families and lineage[a], that they were from Israel: the sons of Asan son of Baenan, the sons of Nekodan[b], six hundred fifty-two.'
translation:
  language: ru
  text: 'Они не могли указать свои роды и родословия, что они из Израиля: потомки Асана, сына сына Баэнана[a], и потомки Некодана[b] — шестьсот пятьдесят два человека.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в греческом тексте: «сына сына Баэнана». Это необычное выражение родства сохранено без упрощения.'
    reason: lexical_alternative
  - marker: b
    text: Здесь греческий текст называет Асана, Баэнана и Некодана; приблизительная масоретская параллель в Неемии 7 содержит в соответствующем месте другие имена. Поскольку 1 Ездры переводится по греческому тексту, в основном тексте сохранены греческие формы имён.
