base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/052.yaml
  text: And all who had vowed a vow to God began[a], from the new moon of the first month, to offer sacrifices to God[b], though the temple of God had not yet been built.
translation:
  language: ru
  text: И все, кто дал обет Богу, с новолуния первого месяца начали приносить Богу жертвы, хотя храм Божий ещё не был построен.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и храм Божий ещё не был построен». Союз «хотя» передаёт вероятный уступительный смысл греческого сочинения.'
    reason: lexical_alternative
  - marker: b
    text: 'Параллельный еврейский текст книги Ездры здесь отличается: в нём говорится о празднике Кущей и предписанных ежедневных всесожжениях. Основной текст следует особой греческой формулировке 1 Ездры.'
    reason: cross_reference
lexical_decisions:
- source_word: ὅσοι
  choice: все, кто
  rationale: Передаёт неопределённо-относительное выражение с широким, включительным значением и звучит естественно по-русски.
- source_word: εὔξαντο εὐχήν
  choice: дал обет
  rationale: Однокоренная конструкция означает принесение обета, а не просто молитву. Русское «дал обет» естественно передаёт её смысл без тяжеловесного буквального повтора.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж прямо обозначает, кому дан обет и кому приносятся жертвы; повтор сохранён вслед за греческим текстом.
- source_word: ἀπὸ τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: с новолуния первого месяца
  rationale: «Новолуние» сохраняет календарно-культовое значение νουμηνία, а «с» естественно передаёт исходный момент действия.
- source_word: ἤρξαντο προσφέρειν
  choice: начали приносить
  rationale: Точно передаёт начало продолжавшегося жертвенного действия и соответствует нормальному русскому словоупотреблению.
- source_word: θυσίας
  choice: жертвы
  rationale: Обозначает именно жертвоприношения, а не более широкую категорию даров или приношений.
- source_word: ὁ ναὸς τοῦ θεοῦ οὔπω ᾠκοδόμητο
  choice: храм Божий ещё не был построен
  rationale: Сохраняет прямое значение «построен», не добавляя исторически подразумеваемого «восстановлен».
theological_decisions:
- issue: Смысловая связь заключительной части, введённой καί
  choice: 'Передать уступительно: «хотя храм Божий ещё не был построен»'
  alternative: 'Передать простым сочинением: «и храм Божий ещё не был построен»'
  rationale: Хотя формально употреблено καί, повествовательный смысл подчёркивает напряжение между началом жертвоприношений и отсутствием построенного храма. «Хотя» ясно выражает вероятный уступительный оттенок, а буквальная форма отмечена в сноске.
- issue: Соотношение с параллельным еврейским текстом книги Ездры
  choice: Следовать отличающейся греческой формулировке о давших обет и ещё не построенном храме
  alternative: Согласовать текст с еврейским параллельным местом о празднике Кущей и ежедневных всесожжениях
  rationale: Для 1 Ездры первичным свидетельством служит греческий текст. Материально отличающееся еврейское параллельное место нельзя молча переносить в основной перевод.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для широкого читателя; сохранены повтор слова «Богу», календарный термин «новолуние» и смысловое напряжение между началом жертвоприношений и ещё не построенным храмом.
