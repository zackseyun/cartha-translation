base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/062.yaml
  text: so that the people could not hear the trumpets because of the weeping of the people[a]; for the crowd was sounding them loudly[b], so that it was heard from far away.
translation:
  language: ru
  text: так что народ не слышал труб из-за плача народа[a]. Ведь множество громко трубило[b], так что это было слышно издалека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском параллельном тексте Ездры 3:11 говорится, что народ громко восклицал, восхваляя Господа; здесь, в 1 Ездры, повествование подробнее подчёркивает звуки труб и плач.
    reason: cross_reference
  - marker: b
    text: 'Или: «множество громко издавало трубные звуки». Греческое выражение с глаголом «трубить» допускает понимание как действия трубящих, так и производимого ими звука.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: так что
  rationale: Естественно передаёт значение следствия, выраженное оборотом ὥστε с инфинитивом.
- source_word: τὸν λαὸν μὴ ἀκούειν
  choice: народ не слышал
  rationale: 'Передаёт фактический результат: плач заглушал трубы. В русском контексте отсутствие модального глагола звучит естественно и не предполагает отказа слушать.'
- source_word: τῶν σαλπίγγων
  choice: труб
  rationale: Сохраняет буквальное обозначение инструментов; по смыслу речь идёт об их звуке.
- source_word: διὰ τὸν κλαυθμὸν τοῦ λαοῦ
  choice: из-за плача народа
  rationale: κλαυθμός означает слышимый плач; повтор слова «народ» сохраняет повтор исходного текста.
- source_word: ὁ γὰρ ὄχλος
  choice: ведь множество
  rationale: ὄχλος обозначает массу собравшихся людей. «Множество» сохраняет различие с предшествующим λαός и соответствует достоинству повествовательного регистра.
- source_word: ἦν ὁ σαλπίζων μεγάλως
  choice: громко трубило
  rationale: Сжатая греческая конструкция естественно передаётся глаголом «трубить»; средний род согласуется с собирательным «множество».
- source_word: ὥστε μακρόθεν ἀκούεσθαι
  choice: так что это было слышно издалека
  rationale: Сохраняет второй оборот следствия и безличность пассивного инфинитива; местоимение «это» оставляет референт звука несколько неопределённым, как в греческом.
