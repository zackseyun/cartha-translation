  source_fidelity: 'Перевод точно передаёт греческий текст: оба оборота следствия с ὥστε сохранены, повтор λαός («народ») воспроизведён, а ὄχλος передан отдельно как «множество». «Народ не слышал труб» адекватно выражает результативное μὴ ἀκούειν; «множество громко трубило» естественно передаёт ὁ ὄχλος ἦν ὁ σαλπίζων μεγάλως. Неоднозначный референт заключительного ἀκούεσθαι не конкретизирован сверх текста.'
