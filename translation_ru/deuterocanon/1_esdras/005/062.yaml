  terminology: «Трубы», «плач», «народ» и «множество» уместны. Имя Господа в перекрёстной сноске оформлено в соответствии с русской библейской традицией. Обе сноски имеют корректные якоря и соответствуют английскому аудиторскому следу, не подменяя греческий текст еврейским параллельным местом.
