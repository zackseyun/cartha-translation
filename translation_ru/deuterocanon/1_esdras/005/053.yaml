base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/053.yaml
  text: And they gave silver to the stonecutters and carpenters[a], and drink and food and provisions to the Sidonians and Tyrians, to bring cedar logs from Lebanon, transporting them by rafts to the harbor of Joppa, according to the written decree given to them by Cyrus king of the Persians.
translation:
  language: ru
  text: Они дали серебро каменотёсам и плотникам, а сидонянам и тирянам — питьё, пищу и припасы[a], чтобы те доставили с Ливана кедровые брёвна, переправив их на плотах в гавань Иоппии, согласно письменному указу, данному им Киром, царём персов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «припасы», в этом месте трудно для понимания; в параллельном тексте Ездры 3:7 по еврейскому тексту названо масло.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον
  choice: серебро
  rationale: Сохранено прямое значение греческого слова; в данном контексте серебро служит платой, но заменять его общим словом «деньги» нет необходимости.
- source_word: λατόμοις
  choice: каменотёсам
  rationale: Слово обозначает работников, режущих и обрабатывающих камень; «каменотёсы» точнее, чем более широкое «каменщики».
- source_word: τέκτοσι
  choice: плотникам
  rationale: В контексте храмового строительства речь естественно понимать о мастерах по дереву.
- source_word: ποτὰ καὶ βρωτὰ
  choice: питьё, пищу
  rationale: Прямой и естественный перевод двух собирательных обозначений съестных припасов.
- source_word: χάρα
  choice: припасы
  rationale: Переданная греческая форма трудна в этом контексте. Общее слово «припасы» соответствует перечню практического снабжения, не подменяя греческое чтение конкретным «маслом» из параллельного текста Ездры 3:7.
- source_word: παράγειν
  choice: доставили
  rationale: Инфинитив выражает цель передачи продовольствия сидонянам и тирянам; «доставили» естественно передаёт перемещение леса из Ливана.
- source_word: ξύλα κέδρινα
  choice: кедровые брёвна
  rationale: Речь идёт о заготовленной для строительства древесине, которую затем переправляют плотами.
- source_word: διαφέρειν σχεδίαις
  choice: переправив их на плотах
  rationale: Переданы и действие перевозки, и указанное в греческом средство транспортировки.
- source_word: Ἰόππης λιμένα
  choice: гавань Иоппии
  rationale: «Гавань» точно передаёт λιμήν, а «Иоппия» соответствует укоренившейся русской библейской форме топонима.
- source_word: πρόσταγμα τὸ γραφέν
  choice: письменному указу
  rationale: πρόσταγμα здесь означает официальный царский приказ, а причастие подчёркивает его письменную форму.
theological_decisions:
- issue: Соотношение греческого текста и параллели в Ездре 3:7
  choice: Греческий текст оставлен первичным, а трудное χάρα передано осторожным общим словом «припасы».
  alternative: Внести из еврейской параллели конкретное «масло» либо буквально передать форму как «радость».
  rationale: «Масло» не выражено в сохранившемся греческом чтении, тогда как «радость» нарушает смысл перечня снабжения. Обобщённый перевод сохраняет контекст и не скрывает текстологической трудности, отмеченной в сноске.
- issue: Референт местоимения αὐτοῖς при царском указе
  choice: Сохранено местоимение «им» без уточнения адресатов.
  alternative: Явно назвать адресатами указа либо возвратившихся иудеев, либо сидонян и тирян.
  rationale: Греческая формулировка сама не устраняет возможную неоднозначность; добавочное уточнение разрешило бы её без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён без утраты последовательности действий; тире ясно отделяет плату ремесленникам от снабжения сидонян и тирян.
