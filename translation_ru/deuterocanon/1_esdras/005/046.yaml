  source_fidelity: В целом перевод точно передаёт временную генитивную абсолютную конструкцию, соборное действие, единодушие и пространственную характеристику. «У себя» удачно сохраняет неопределённость ἐν τοῖς ἰδίοις. Однако исходное «каждый из сынов Израиля ... они» создаёт неудачную синтаксическую смену от единственного числа к множественному; греческий текст говорит о «сынах Израиля», причём каждый находился в своём месте.
