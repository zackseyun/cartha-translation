base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/046.yaml
  text: When the seventh month had come[a], and the sons of Israel were each in their own places[c][b], they gathered with one accord in the open area of the first gate on the east.
translation:
  language: ru
  text: Когда наступил седьмой месяц и сыны Израиля[a] — каждый у себя[b] — единодушно собрались на просторном месте[c] у первых ворот, находившихся с восточной стороны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян». В греческом тексте буквально: «сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: То есть каждый находился в своём месте. В еврейском параллельном тексте говорится, что израильтяне жили в своих городах; греческий текст выражается менее определённо.
    reason: cross_reference
  - marker: c
    text: 'Или: «на широком месте», «на площади». Греческое слово обозначает просторное открытое пространство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνστάντος
  choice: когда наступил
  rationale: Генитив абсолютный задаёт время действия и обозначает наступление седьмого месяца; такая передача естественна для современного русского повествования.
- source_word: τοῦ ἑβδόμου μηνός
  choice: седьмой месяц
  rationale: Сохранено прямое календарное обозначение, значимое в данном повествовательном и культовом контексте.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: сынов Израиля
  rationale: Сохранено родственное, заветное наименование греческого текста; более идиоматичный вариант «израильтян» указан в сноске.
- source_word: ἕκαστος ἐν τοῖς ἰδίοις
  choice: каждый … находился у себя
  rationale: Русское «у себя» естественно передаёт пребывание каждого в принадлежащем ему месте, не уточняя вопреки греческому тексту, шла ли речь о доме или городе.
- source_word: συνήχθησαν
  choice: собрались
  rationale: Простой и естественный эквивалент повествовательного аориста, обозначающий совместное собрание.
- source_word: ὁμοθυμαδόν
  choice: единодушно
  rationale: Передаёт не только нахождение вместе, но и общность устремления участников.
- source_word: εἰς τὸ εὐρύχωρον
  choice: на просторном месте
  rationale: Передаёт широкое открытое пространство, не конкретизируя его как городскую площадь.
- source_word: τοῦ πρώτου πυλῶνος
  choice: у первых ворот
  rationale: Сохранено буквальное порядковое обозначение. Русское «ворота» употребляется во множественном числе, хотя греческое существительное стоит в единственном.
- source_word: τοῦ πρὸς τῇ ἀνατολῇ
  choice: обращённых на восток
  rationale: Естественно выражает восточную ориентацию ворот, сохраняя пространственную характеристику греческой фразы.
theological_decisions:
- issue: Родственное наименование τῶν υἱῶν Ἰσραήλ
  choice: сынов Израиля
  alternative: израильтян
  rationale: Формулировка источника сохранена как выражение общей родовой и заветной принадлежности; при этом сноска предлагает естественный собирательный эквивалент без навязывания богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён лишь настолько, чтобы длинная греческая конструкция звучала естественно; архитектурная и топографическая неопределённость источника сохранена.
