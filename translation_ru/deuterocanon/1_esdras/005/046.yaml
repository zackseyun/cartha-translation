- from: Когда наступил седьмой месяц и каждый из сынов Израиля[a] находился у себя[b], они единодушно собрались на просторном месте[c] у первых ворот, обращённых на восток.
  to: Когда наступил седьмой месяц и сыны Израиля[a] — каждый у себя[b] — единодушно собрались на просторном месте[c] у первых ворот, находившихся с восточной стороны.
  rationale: Правка устраняет русское несогласование «каждый ... они», не меняя коллективного значения греческого τῶν υἱῶν Ἰσραήλ и распределительного ἕκαστος. Пространственное определение ворот передано более нейтрально, без излишнего предположения об их ориентации. Все исходные сноски сохранены, а их якоря остаются на соответствующих элементах текста.
