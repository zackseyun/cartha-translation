base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/039.yaml
  text: and he was called by his name[a]. And from these[b], those who were searched for in the genealogical record in the enrollment, and were not found, were excluded from serving as priests.
translation:
  language: ru
  text: и он был назван по его имени[a]. А среди них были те, чью родословную запись искали в регистрационном списке[b]; но её не нашли, и их отстранили от священнического служения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «он был назван в его честь». Греческая фраза сжата, и из одного этого стиха не вполне ясно, к кому относятся местоимения.'
    reason: lexical_alternative
  - marker: b
    text: То есть в официальном регистрационном списке искали запись, подтверждавшую их происхождение и право на священническое служение.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκλήθη ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: он был назван его именем
  rationale: Передаёт пассивное значение ἐκλήθη и связь наречения с именем, не уточняя не вполне ясный в данном стихе референт местоимения αὐτοῦ.
- source_word: τούτων
  choice: из их числа
  rationale: 'Естественно передаёт партитивное значение: речь идёт о некоторых людях из только что упомянутой группы.'
- source_word: ἐζητήθησαν
  choice: некоторых разыскивали
  rationale: 'Русская неопределённо-личная конструкция естественно сохраняет пассивную направленность греческой формы: эти люди были объектом поиска, а не его субъектом.'
- source_word: τῆς γενικῆς γραφῆς
  choice: по родословной записи
  rationale: В контексте проверки права на священническое служение выражение обозначает документальную запись о происхождении.
- source_word: ἐν τῷ καταλοχισμῷ
  choice: в переписном списке
  rationale: Передаёт административный смысл регистрации по списку и звучит понятнее, чем буквальное «при зачислении».
- source_word: μὴ εὑρεθείσης
  choice: эта запись не была найдена
  rationale: Женский род греческого причастия соотносит ненайденное с γραφή, то есть с родословной записью.
- source_word: ἐχωρίσθησαν τοῦ ἱερατεύειν
  choice: их отстранили от священнического служения
  rationale: Передаёт фактическое недопущение к исполнению обязанностей священника, не превращая административное решение в более широкое догматическое утверждение.
theological_decisions:
- issue: Характер недопущения к священническому служению
  choice: отстранили от священнического служения из-за отсутствия подтверждающей родословной записи
  alternative: навсегда исключили из священства
  rationale: Греческий текст указывает на процедурное последствие отсутствия документального подтверждения и не определяет ни окончательность решения, ни богословский статус этих людей.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Неестественный для русского двойной пассив во второй фразе заменён неопределённо-личной конструкцией без изменения того, кто является объектом поиска; неоднозначность начальной фразы сохранена и пояснена в сноске.
