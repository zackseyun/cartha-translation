review_pass:
  verdict: revise
  source_fidelity: Начальная фраза передана без неоправданного уточнения референта, но сочетание «назван его именем» в русском двусмысленно и стилистически тяжеловесно. Во второй фразе греческий пассив ἐζητήθησαν и женское причастие μὴ εὑρεθείσης, относящееся к γραφή, требуют различать людей, которых искали/проверяли по записи, и саму ненайденную запись. Предлагаемая редакция сохраняет эту структуру в естественном русском синтаксисе.
  naturalness: '«Некоторых разыскивали по родословной записи» звучит по-русски неясно: не очевидно, кого или что разыскивали и где. Конструкция с относительным придаточным («чью ... запись искали») ясно связывает ненайденную запись с последующим недопущением, сохраняя сжатость оригинала.'
  terminology: «Родословная запись», «регистрационный список» и «священническое служение» точно и современно передают документально-административный и культовый контекст. «Отстранили от священнического служения» не утверждает окончательного лишения статуса священника.
  issues:
  - severity: medium
    issue: Неестественная и смыслово неясная передача проверки по записи
    rationale: Фраза «некоторых разыскивали по родословной записи в переписном списке» может означать розыск людей с помощью записи, тогда как далее речь именно о ненайденной родословной записи. Нужно синтаксически связать поиск и отсутствие записи.
