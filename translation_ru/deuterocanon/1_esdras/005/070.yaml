base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/070.yaml
  text: And by plots and by stirring up the crowds and by forming factions[a], they hindered the building from being completed all the time of the life of King Cyrus; and the building was halted for two years[b], until the reign of Darius.
translation:
  language: ru
  text: Строя козни, подстрекая народ и создавая враждебные группировки, они мешали завершить строительство на протяжении всей жизни царя Кира[a]. И строителей на два года отстранили от строительства, вплоть до царствования Дария[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё время жизни царя Кира». По смыслу может подразумеваться период его правления.'
    reason: Сохраняет буквальное значение τῆς ζωῆς и отмечает возможный контекстуальный смысл, не подменяя им основной текст.
  - marker: b
    text: 'Заключительную фразу можно также понять безлично: «строительство было остановлено на два года, вплоть до царствования Дария».'
    reason: Фиксирует существенную синтаксическую неоднозначность между личным субъектом во множественном числе и более безличным описанием остановки работ.
lexical_decisions:
- source_word: βουλάς
  choice: строя козни
  rationale: В контексте намеренного противодействия множественное βουλάς означает враждебные замыслы; «козни» естественно передаёт их злонамеренный характер.
- source_word: δημαγωγοῦντες
  choice: подстрекая народ
  rationale: Причастие обозначает воздействие на народные массы с целью возбуждения или склонения их к противодействию; «подстрекая народ» понятно современному читателю и сохраняет отрицательную окраску.
- source_word: συστάσεις ποιούμενοι
  choice: создавая враждебные группировки
  rationale: Оборот указывает на образование организованных объединений или партий. Добавление «враждебные» проясняет их функцию в данном контексте, не сводя значение лишь к беспорядкам.
- source_word: ἀπεκώλυσαν
  choice: мешали
  rationale: Глагол выражает деятельное воспрепятствование, но конструкция с инфинитивом не требует чрезмерно категоричного «не позволили».
- source_word: τοῦ ἀποτελεσθῆναι τὴν οἰκοδομήν
  choice: завершить строительство
  rationale: Передаёт результативный смысл пассивного инфинитива и понимает οἰκοδομή как процесс или строительные работы, а не как готовое здание.
- source_word: πάντα τὸν χρόνον τῆς ζωῆς τοῦ βασιλέως Κύρου
  choice: на протяжении всей жизни царя Кира
  rationale: Естественный русский эквивалент буквального «всё время жизни царя Кира»; формально речь идёт о жизни, а не прямо о царствовании.
- source_word: εἰρχθησαν τῆς οἰκοδομῆς
  choice: строителям … не давали продолжать работу
  rationale: Множественное пассивное εἰρχθησαν естественнее всего предполагает людей, удержанных от строительных работ. Слово «строителям» делает русский текст связным, тогда как альтернативное безличное понимание отмечено в сноске.
- source_word: ἔτη δύο
  choice: два года
  rationale: Прямое и естественное обозначение продолжительности.
- source_word: ἕως τῆς Δαρείου βασιλείας
  choice: вплоть до царствования Дария
  rationale: βασιλεία здесь обозначает период правления Дария; «вплоть до» ясно передаёт временную границу.
theological_decisions:
- issue: Субъект и залог в заключительной части стиха
  choice: 'Пассивная форма во множественном числе отнесена к строителям: им не давали продолжать работу.'
  alternative: Строительство было остановлено на два года.
  rationale: Форма εἰρχθησαν грамматически имеет множественное число и потому наиболее прямо указывает на людей, однако эллиптичность фразы допускает более безличную передачу с самим строительством в центре внимания. Значимая неоднозначность сохранена в сноске.
- issue: Продолжительность противодействия при Кире
  choice: на протяжении всей жизни царя Кира
  alternative: на протяжении всего царствования Кира
  rationale: Греческий текст прямо говорит τῆς ζωῆς, «жизни». Хотя повествовательный контекст может подразумевать период его правления, перевод не заменяет одно понятие другим.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского текста. Синтаксис упрощён без утраты последовательности трёх способов противодействия. Терминология не содержит конфессионально обусловленных уточнений.
