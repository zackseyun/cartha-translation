translation_notes:
  register: Современный литературный русский язык; сохранён деловой характер перечня. Формулировка «на работы» передаёт назначение сокровищницы или средств, не уточняя сверх греческого текста, шла ли речь исключительно о строительстве или также о восстановлении и иных храмовых работах.
