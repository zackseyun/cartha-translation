base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/044.yaml
  text: and to give to the holy treasury for the works one thousand minas of gold[a], and five thousand minas of silver[b], and one hundred priestly garments.
translation:
  language: ru
  text: и внести в священную сокровищницу[a] для работ тысячу мин[b] золота, пять тысяч мин серебра и сто священнических облачений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «в храмовую сокровищницу». Греческое выражение буквально обозначает священную сокровищницу или хранилище, относящееся к святилищу.'
    reason: lexical_alternative
  - marker: b
    text: Мина — древняя мера веса, употреблявшаяся также как единица стоимости. Здесь сохранено древнее наименование без пересчёта в современные меры.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦναι
  choice: передать
  rationale: Инфинитив сохраняет синтаксическое продолжение предыдущего контекста; «передать» естественно описывает внесение ценностей в сокровищницу, не добавляя оттенка формального пожертвования.
- source_word: εἰς τὸ ἱερὸν γαζοφυλάκιον
  choice: в священную сокровищницу
  rationale: «Сокровищница» точно передаёт место хранения ценностей, а «священную» сохраняет определение ἱερόν, не подменяя его более конкретным толкованием.
- source_word: τῶν ἔργων
  choice: на работы
  rationale: Так естественно передаётся значение назначения средств. Множественное число и широкий смысл греческого выражения сохранены без уточнения характера строительных или восстановительных работ.
- source_word: χρυσίου μνᾶς χιλίας
  choice: тысячу мин золота
  rationale: Древняя единица μνᾶ сохранена без приблизительного пересчёта в современные меры; порядок слов естественен для русского перечня.
- source_word: ἀργυρίου μνᾶς πεντακισχιλίας
  choice: пять тысяч мин серебра
  rationale: Формулировка параллельна обозначению золота и точно сохраняет материал и количество.
- source_word: στολὰς ἱερατικὰς
  choice: священнических облачений
  rationale: «Облачения» передаёт служебное назначение одежд точнее общего «одежды», оставаясь понятным в храмовом контексте.
- source_word: ἑκατόν
  choice: сто
  rationale: Прямое и естественное воспроизведение числа в инвентарном перечне.
