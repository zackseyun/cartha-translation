base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/067.yaml
  text: Then Zerubbabel and Jeshua and the heads of the fathers’ houses of Israel said to them[b][a], “It is not for you to build the house for the Lord our God.”
translation:
  language: ru
  text: 'И сказали им Зоровавель, Иисус[a] и главы родов Израиля: «Не вам строить дом[b] Господу, Богу нашему».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. Ἰησοῦς; здесь имеется в виду послепленный первосвященник, обычно называемый Иисусом, сыном Иоседековым; также: Иешуа.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть храм; буквально: «дом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτοῖς
  choice: сказали им
  rationale: В греческом сказуемое стоит в единственном числе при составном подлежащем, что допустимо для библейского повествования; по-русски естественно согласование во множественном числе.
- source_word: Ζοροβαβὲλ
  choice: Зоровавель
  rationale: Традиционная русская форма имени послепленного вождя, соответствующая библейскому употреблению.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Сохранена традиционная русская библейская передача греческого имени; примечание уточняет, что речь идёт о послепленном первосвященнике, которого также называют Иешуа или Иисусом Навином.
- source_word: οἱ ἡγούμενοι τῶν πατριῶν
  choice: главы родов
  rationale: Выражение обозначает руководителей родовых объединений; «главы родов» естественно и точно передаёт древнюю общественную структуру.
- source_word: Οὐχ ὑμῖν τοῦ οἰκοδομῆσαι
  choice: Не вам строить
  rationale: Сохраняет эллиптическую и категоричную конструкцию греческого текста, не добавляя более пространного смысла параллели в Ездре 4:3.
- source_word: τὸν οἶκον
  choice: дом
  rationale: Буквально «дом»; в контексте имеется в виду храм. Основной текст сохраняет исходную метафору, а примечание поясняет значение.
- source_word: Κυρίῳ θεῷ ἡμῶν
  choice: Господу, Богу нашему
  rationale: 'Дательный передаёт того, для кого строится дом. Пунктуация показывает приложение: Господь есть наш Бог.'
theological_decisions:
- issue: Передача Κυρίῳ в контексте строительства храма и на фоне еврейского имени YHWH
  choice: Господу
  alternative: ГОСПОДУ
  rationale: Основным источником служит греческий текст, где стоит κύριος. Поэтому выбрана обычная русская передача «Господь», без замены греческой формы типографическим обозначением тетраграмматона.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейской речи. Синтаксис реплики краток и категоричен, как в греческом оригинале; архаичные обороты по возможности устранены.
