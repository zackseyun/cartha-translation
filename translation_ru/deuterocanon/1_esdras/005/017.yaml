base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/017.yaml
  text: the sons of Baiterous[a], three thousand five; the sons of Ragethlomon, one hundred twenty-three;
translation:
  language: ru
  text: сыновья Баитеруса[a] — три тысячи пять; сыновья из Рагетломона — сто двадцать три;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этого стиха отличается от приблизительной еврейской (масоретской) параллели, где в соответствующем месте сказано: «сыновья Хашума — двести двадцать три». Основной текст следует греческому тексту 1 Ездры и не согласовывает его с масоретским текстом.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: сыновей
  rationale: В контексте переписи это устойчивая родовая формула; винительный падеж естественно продолжает перечень из предыдущего контекста, а «сыновей» сохраняет формальную структуру греческого текста.
- source_word: Βαιτηρούς
  choice: Баитеруса
  rationale: Имя передано транслитерацией с греческой формы Βαιτηρούς и поставлено в родительный падеж после «сыновей».
- source_word: τρισχίλιοι πέντε
  choice: три тысячи пять
  rationale: Точная передача количественного числительного без добавления отсутствующего в греческом союза.
- source_word: ἐκ Ῥαγεθλωμῶν
  choice: из Рагетломона
  rationale: Предлог ἐκ явно выражен в греческом и передан русским «из»; форма имени транслитерирована с греческого источника.
- source_word: ἑκατὸν εἴκοσι τρεῖς
  choice: сто двадцать три
  rationale: Прямая и естественная передача количественного числительного словами, в соответствии со стилем списка.
theological_decisions:
- issue: Греческие имена и числа расходятся с приблизительной масоретской параллелью
  choice: В основном тексте сохранены Баитерус, Рагетломон и числа греческого текста
  alternative: 'Согласовать запись с масоретской параллелью: «сыновей Хашума — двести двадцать три»'
  rationale: Для 1 Ездры первичным источником служит греческий текст; еврейская параллель приблизительна и не должна подменять или гармонизировать ясное чтение греческого свидетеля.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным стилем переписного списка. Тире отделяет название рода от численности; собственные имена переданы по греческому источнику.
