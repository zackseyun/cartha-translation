base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/021.yaml
  text: those from Makalon[a], one hundred twenty-two; those from Betolio, fifty-two; Neipheis, one hundred fifty-six.
translation:
  language: ru
  text: из Макалона[a] — сто двадцать два человека; из Бетолио — пятьдесят два; Неифеев — сто пятьдесят шесть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском параллельном тексте, Неемия 7:25, сказано: «сыновей Рамы и Гевы — шестьсот двадцать один». Здесь 1 Ездры сохраняет существенно иные названия и числа.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  choice: из … — … человек
  rationale: Оборот обозначает людей по месту их происхождения. В русском перечне естественно передать его конструкцией «из [места] — [число] человек», не заимствуя «сыновья» из отличающегося еврейского параллельного текста.
- source_word: Μακαλών
  choice: Макалон
  rationale: Название передано транслитерацией греческой формы без попытки отождествить его с иными названиями из еврейской традиции; после «из» употреблена форма «Макалона».
- source_word: Βετολιώ
  choice: Бетолио
  rationale: Сохраняется греческая форма неустановленного топонима; в русском тексте название оставлено несклоняемым, чтобы избежать предположительной нормализации.
- source_word: Νειφείς
  choice: Неифеи
  rationale: Греческая форма передана как название группы людей. Родительный множественного числа «Неифеев» естественно входит в эллиптическую счётную конструкцию, при этом имя не отождествляется со спорными параллелями.
- source_word: ἑκατὸν εἴκοσι δύο
  choice: сто двадцать два
  rationale: Современная нормативная передача количественного числительного.
- source_word: πεντήκοντα δύο
  choice: пятьдесят два
  rationale: Современная нормативная передача количественного числительного.
- source_word: ἑκατὸν πεντήκοντα ἕξ
  choice: сто пятьдесят шесть
  rationale: Современная нормативная передача количественного числительного.
theological_decisions:
- issue: Расхождение греческого списка с еврейским параллельным текстом в именах и числах
  choice: В основном тексте переведён греческий список без гармонизации; расхождение отмечено в сноске.
  alternative: 'Заменить его чтением Неемии 7:25: «сыновей Рамы и Гевы — шестьсот двадцать один».'
  rationale: Для 1 Ездры первичным источником служит греческий текст. Расхождение слишком существенно, чтобы молча исправлять или согласовывать его по еврейскому параллельному месту; сноска сохраняет прозрачность текстовой традиции.
translation_notes:
  register: Современный литературный русский язык; краткий списочный ритм сохранён с помощью точек с запятой и тире. Слово «человек» добавлено для ясности счёта, а в следующих частях подразумевается эллиптически. Имена переданы по греческому источнику без конфессиональной или предположительной гармонизации.
