base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/045.yaml
  text: And the priests and the Levites and some of the people settled in Jerusalem and the region[a], and the temple singers and the gatekeepers, and all Israel in their villages.
translation:
  language: ru
  text: И поселились священники, левиты и люди из его народа[a] — в Иерусалиме и в области, а храмовые певцы, привратники и весь Израиль — в своих селениях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «те, кто из его народа». К кому относится слово «его», не вполне ясно; вероятно, имеются в виду миряне, в отличие от священников и левитов.'
    reason: Сохранение лексической и синтаксической неоднозначности греческого οἱ ἐκ τοῦ λαοῦ αὐτοῦ.
lexical_decisions:
- source_word: κατῳκίσθησαν
  choice: поселились
  rationale: Естественно передаёт аорист пассивной формы κατοικίζω в контексте обустройства на постоянном месте; русская возвратная форма не навязывает явно названного деятеля.
- source_word: οἱ ἱερεῖς
  choice: священники
  rationale: Общепринятое и точное обозначение культового служения.
- source_word: οἱ Λευεῖται
  choice: левиты
  rationale: Традиционный и однозначный русский эквивалент.
- source_word: οἱ ἐκ τοῦ λαοῦ αὐτοῦ
  choice: люди из его народа[a]
  rationale: Сохраняет выраженное в греческом притяжательное местоимение αὐτοῦ и не превращает фразу без достаточных оснований в «часть народа» или «остальной народ».
- source_word: ἐν Ἰερουσαλὴμ καὶ τῇ χώρᾳ
  choice: в Иерусалиме и в этой области
  rationale: χώρα здесь обозначает территорию или область; указательное «этой» естественно передаёт греческий артикль и связь области с Иерусалимом, не добавляя явно не выраженного значения «окрестная».
- source_word: οἵ τε ἱεροψάλται
  choice: а также храмовые певцы
  rationale: ἱεροψάλται обозначает певцов при святилище; «храмовые певцы» понятно современному читателю и точнее простого «певцы».
- source_word: οἱ θυρωροὶ
  choice: привратники
  rationale: Устоявшееся обозначение служителей, охранявших входы или ворота храма.
- source_word: πᾶς Ἰσραήλ
  choice: весь Израиль
  rationale: Сохраняет обычное коллективное наименование народа, не уточняя, подразумевается ли буквально каждый отдельный человек.
- source_word: ἐν ταῖς κώμαις αὐτῶν
  choice: в своих селениях
  rationale: κώμη — небольшое поселение или селение; «селения» позволяет не навязывать строго современную административную категорию «деревни».
theological_decisions:
- issue: Объём выражения πᾶς Ἰσραήλ
  choice: весь Израиль
  alternative: каждый израильтянин без исключения
  rationale: Сохранено коллективное библейское выражение без догматического или математически исчерпывающего толкования.
- issue: Референт притяжательного αὐτοῦ в οἱ ἐκ τοῦ λαοῦ αὐτοῦ
  choice: его народа с пояснением неоднозначности в сноске
  alternative: из народа; часть народа; остальные из народа
  rationale: Греческий текст содержит местоимение «его», но его референт в данном предложении неочевиден. Основной текст сохраняет эту особенность, а сноска предупреждает читателя об альтернативном понимании.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Перечень сделан читаемым, при этом сохранены повторяющиеся группы исходного текста и неоднозначность выражения «из его народа».
