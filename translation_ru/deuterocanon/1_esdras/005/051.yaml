base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/051.yaml
  text: And after these[a], the regular offerings[b], and the sacrifices for Sabbaths and new moons and all the consecrated feasts.
translation:
  language: ru
  text: И после этого — постоянные приношения[a][b] и жертвы, совершаемые по субботам, в новомесячия и во все освящённые праздники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «регулярные приношения». Греческое слово может обозначать как непрерывно совершаемые приношения, так и приношения, повторяющиеся в установленное время.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском параллельном месте (Езд. 3:4) особо говорится о всесожжении «изо дня в день, по установленному числу на каждый день». Здесь 1 Ездры даёт более широкое перечисление приношений священного календаря.
    reason: cross_reference
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Естественный русский временной переход. Хотя ταῦτα формально стоит во множественном числе, по-русски выражение «после этого» обычно охватывает совокупность предшествующих событий без утраты смысла.
- source_word: προσφορὰς
  choice: приношения
  rationale: Широкий культовый термин, обозначающий то, что приносится Богу; он также сохраняет отличие от следующего, более конкретного θυσίας.
- source_word: ἐνδελεχισμοῦ
  choice: постоянные
  rationale: Слово передаёт непрерывность либо установленную регулярную повторяемость. «Постоянные» сохраняет эту смысловую широту лучше, чем более узкое «ежедневные».
- source_word: θυσίας
  choice: жертвы
  rationale: Передаёт более конкретный жертвенный термин и не смешивает его с общим προσφοράς — «приношения».
- source_word: σαββάτων
  choice: по субботам
  rationale: Русская форма естественно выражает повторяющееся соблюдение суббот, соответствуя греческому множественному числу.
- source_word: νουμηνιῶν
  choice: новомесячиям
  rationale: Традиционный и точный библейский термин для культовых празднований начала месяца; конструкция с «по» охватывает и этот член перечисления.
- source_word: ἑορτῶν πασῶν ἡγιασμένων
  choice: всем освящённым праздникам
  rationale: Причастие ἡγιασμένων указывает, что праздники были отделены для священного употребления. «Освящённым» точнее сохраняет этот оттенок, чем просто «святым».
theological_decisions:
- issue: Соотношение с приблизительной еврейской параллелью в книге Ездры
  choice: Следовать более широкому греческому перечню регулярных приношений и жертв священного календаря.
  alternative: Сузить текст до ежедневных всесожжений, как в еврейской параллели.
  rationale: Греческий текст является первичным источником для 1 Ездры и прямо перечисляет субботы, новомесячия и освящённые праздники. Еврейская параллель помогает понять регулярный характер приношений, но не должна заменять содержание греческого свидетельства.
- issue: Значение ἐνδελεχισμοῦ
  choice: «постоянные» с пояснением возможной регулярной периодичности в сноске.
  alternative: «ежедневные» или «непрерывные».
  rationale: Греческое слово допускает как оттенок непрерывности, так и установленного повторения. Основной текст не должен без достаточных оснований сводить его только к ежедневному ритуалу.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской культовой лексикой. Синтаксическая сжатость греческого перечисления сохранена; тире помогает естественно передать отсутствие нового личного глагола. «Новомесячия» понятно в библейском контексте и точнее, чем описательное «праздники новой луны».
