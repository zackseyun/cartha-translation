base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/069.yaml
  text: But the nations of the land, joining themselves to those in Judea and besieging them, hindered the building of the house.
translation:
  language: ru
  text: Но народы этой земли, тесня жителей Иудеи[a] и осаждая их, препятствовали строительству[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое слово имеет не вполне ясный смысл: оно может означать также «примыкая к», «поселяясь среди» или «нажимая на» жителей Иудеи. Последующее «осаждая» показывает, что речь идёт о враждебных действиях.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мешали строить». Что именно строили, здесь не сказано; из контекста ясно, что речь идёт о храме.'
    reason: contextual_clarification
lexical_decisions:
- source_word: τὰ ... ἔθνη τῆς γῆς
  choice: народы этой земли
  rationale: ἔθνη обозначает окружающие народы или этнические группы. «Народы» сохраняет множественное число и не привносит новозаветного оттенка слова «язычники»; указательное «этой» естественно передаёт определённость выражения в данном контексте.
- source_word: ἐπικοιμώμενα τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: тесня жителей Иудеи
  rationale: Редкий и трудный глагол может передавать присоединение, поселение рядом либо нажим. Последующее «осаждая» ясно задаёт враждебный контекст, поэтому «тесня» естественно выражает давление на находящихся в Иудее, не устраняя лексической сложности, отмеченной в сноске.
- source_word: πολιορκοῦντες
  choice: осаждая их
  rationale: πολιορκέω обычно означает «осаждать». Перевод сохраняет военный образ и относит действие к тем же «народам», несмотря на необычное согласование причастий в греческом.
- source_word: εἶργον
  choice: препятствовали
  rationale: Имперфект указывает на продолжавшееся противодействие. «Препятствовали» передаёт длительную помеху, не утверждая безусловно, что строительство было окончательно прекращено.
- source_word: τοῦ οἰκοδομεῖν
  choice: строительству
  rationale: В греческом буквально сказано «строить» без названного объекта. Русское отглагольное существительное естественно передаёт конструкцию и не добавляет отсутствующего в стихе слова «храм» или «дом».
theological_decisions:
- issue: Неуказанный объект строительства
  choice: препятствовали строительству
  alternative: препятствовали строительству храма / дома
  rationale: Хотя контекст повествования говорит о восстановлении храма, в самом греческом предложении объект при οἰκοδομεῖν не назван. Перевод сохраняет эту недосказанность, а контекстуальное уточнение помещено в сноску, чтобы не превращать толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис краток и прозрачен; причастные конструкции оригинала переданы деепричастиями. Лексическая неоднозначность ἐπικοιμώμενα и невыраженный объект οἰκοδομεῖν сохранены и пояснены в сносках.
