base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/065.yaml
  text: And coming to Zerubbabel and Jeshua and the heads of the fathers’ houses[a], they said to them, “We will build with you.”
translation:
  language: ru
  text: 'Подойдя к Зоровавелю, Иисусу и главам родов, они сказали им: «Мы будем строить вместе с вами».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: Подойдя
  rationale: Аористное причастие обозначает действие, предшествующее речи; деепричастие естественно передаёт эту последовательность по-русски.
- source_word: τῷ Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: к Зоровавелю, Иисусу
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён. В данном послепленном контексте Иисус — историческое лицо эпохи восстановления храма, а не Иисус Христос.
- source_word: τοῖς ἡγουμένοις τῶν πατριῶν
  choice: главам родов
  rationale: ἡγούμενοι обозначает руководителей, а πατριαί — родовые объединения; «главы родов» точно и естественно передаёт общественное устройство, не воспроизводя буквально неясное для современного читателя выражение «отеческие дома».
- source_word: λέγουσιν
  choice: сказали
  rationale: Историческое настоящее греческого повествования естественно передано русским прошедшим временем.
- source_word: Συνοικοδομήσομεν ὑμῖν
  choice: Мы будем строить вместе с вами
  rationale: Глагол συνοικοδομέω содержит значение совместного строительства; «вместе с вами» сохраняет силу приставки συν- и не сводит предложение лишь к общей помощи.
theological_decisions:
- issue: Передача имени Ἰησοῦ в послепленном историческом контексте
  choice: Иисус
  alternative: Иешуа
  rationale: Форма «Иисус» соответствует греческому Ἰησοῦ и устойчивой русской библейской традиции. Контекст отличает этого Иисуса, связанного с восстановлением храма, от Иисуса Христа; замена на «Иешуа» сильнее ориентировалась бы на реконструируемую семитскую форму, чем на основной греческий текст.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным и компактным; архаизмы и конфессионально маркированные формулировки не используются.
