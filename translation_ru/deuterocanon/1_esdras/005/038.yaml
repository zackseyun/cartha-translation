base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/038.yaml
  text: 'And from the priests[a], those who claimed the priesthood, but were not found: the sons of Obbeia, the sons of Akbos, the sons of Iaddous, who had taken Augia as a wife from the daughters of Phaexeldai[b],'
translation:
  language: ru
  text: 'И из священников — те, кто заявлял права на священство, но не были найдены[a]: сыновья Оввии, сыновья Аквоса и сыновья Иаддуса, взявшего в жёны Авгию, одну из дочерей Фаекселдая[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь эллиптичен: «не были найдены», вероятно, означает, что не нашлись подтверждавшие их происхождение родословные записи или запись о принадлежности к священству, как в параллельном месте книги Ездры.'
    reason: lexical_alternative
  - marker: b
    text: Имена в этом перечне отличаются от имён в приблизительной масоретской параллели; перевод следует греческому тексту 1 Ездры и не согласовывает его с Ездрой или Неемией.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: из священников
  rationale: Передаёт принадлежность перечисляемой группы к священническому сословию и сохраняет конструкцию с ἐκ.
- source_word: οἱ ἐμποιούμενοι ἱερωσύνης
  choice: те, кто заявлял права на священство
  rationale: ἐμποιούμενοι указывает на предъявление притязания или права; речь идёт не просто о несении службы, а о заявленном священническом статусе.
- source_word: οὐχ εὑρέθησαν
  choice: не были найдены
  rationale: Формальный перевод сохраняет эллиптичность греческого текста и не подставляет прямо подразумеваемые родословные записи.
- source_word: υἱοὶ Ὀββειά / Ἀκβώς / Ἰαδδοὺς
  choice: сыновья Оввии / Аквоса / Иаддуса
  rationale: В родословном перечне υἱοί может охватывать потомков; традиционная формула «сыновья» сохраняет структуру оригинала. Имена переданы по греческому свидетельству.
- source_word: τοῦ λαβόντος Αὐγίαν γυναῖκα
  choice: взявшего в жёны Авгию
  rationale: Оборот λαμβάνω с γυναῖκα является обычным выражением вступления в брак; русский оборот близок к форме греческого текста и остаётся естественным.
- source_word: τῶν θυγατέρων Φαηξελδαίου
  choice: одну из дочерей Фаекселдая
  rationale: Передаёт принадлежность Авгии к числу дочерей Фаекселдая; имя транслитерировано по греческому тексту без гармонизации с приблизительной масоретской параллелью.
