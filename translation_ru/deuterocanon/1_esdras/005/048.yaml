base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/048.yaml
  text: to offer burnt offerings on it[a], according to what is prescribed in the book of Moses, the man of God.
translation:
  language: ru
  text: чтобы приносить на нём всесожжения[a] согласно тому, что предписано в книге Моисея, человека Божьего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском параллельном тексте, Ездра 3:2, сказано: «как написано в Законе Моисея, человека Божьего». Здесь, в 1 Ездре, употреблены выражения «книга Моисея» и «предписанное», передающие тот же основной смысл иными словами.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσενέγκαι
  choice: приносить
  rationale: В сочетании с жертвенным термином ὁλοκαυτώματα глагол означает совершать приношение жертв, а не просто доставлять их.
- source_word: ἐπ’ αὐτοῦ
  choice: на нём
  rationale: Местоимение отсылает к жертвеннику из предшествующего контекста; мужской род естественно соответствует русскому слову «жертвенник».
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Устоявшийся и точный библейский термин для жертв, целиком сжигаемых на жертвеннике; соответствует также еврейскому עֹלוֹת в параллельном тексте.
- source_word: ἀκολούθως τοῖς ... διηγορευμένοις
  choice: согласно предписанному
  rationale: Передаёт соблюдение авторитетно установленных предписаний и естественно звучит в современном русском языке.
- source_word: ἐν τῇ Μωσέως βίβλῳ
  choice: в книге Моисея
  rationale: Сохраняет греческое βίβλος «книга», не подменяя его чтением еврейской параллели «в Законе Моисея».
- source_word: τοῦ ἀνθρώπου τοῦ θεοῦ
  choice: человека Божьего
  rationale: Сохраняет традиционный библейский титул Моисея и его приложение к имени.
theological_decisions:
- issue: Соотношение греческого текста с еврейской параллелью в Ездре 3:2
  choice: Сохранить греческое «в книге Моисея» и передать διηγορευμένοις как «предписанному».
  alternative: 'Перевести по еврейской параллели: «как написано в Законе Моисея, человека Божьего».'
  rationale: Для 1 Ездры первичен греческий текст, который здесь говорит о «книге Моисея» и о предписанном в ней. Еврейская параллель подтверждает общий законодательно-жертвенный смысл, но не должна заменять греческую формулировку.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Всесожжения» сохранено как понятный устоявшийся культовый термин; синтаксис следует греческому фрагменту, который грамматически продолжает предыдущее предложение.
