base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/055.yaml
  text: And they laid the foundation of the temple of God on the new moon of the second month[a], in the second year after they had come into Judea and Jerusalem.
translation:
  language: ru
  text: И они заложили основание храма Божьего в новолуние второго месяца, во второй год после своего прибытия в Иудею и Иерусалим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθεμελίωσαν
  choice: заложили основание
  rationale: Глагол означает «положить основание, основать»; в сочетании с храмом естественный русский оборот — «заложили основание».
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: храма Божьего
  rationale: ναός прямо обозначает храм или святилище; «храм Божий» точно и естественно передаёт культовое здание в контексте его восстановления.
- source_word: τῇ νουμηνίᾳ τοῦ δευτέρου μηνός
  choice: в новолуние второго месяца
  rationale: νουμηνία обозначает новолуние и начало нового месяца; перевод сохраняет как календарный, так и религиозный оттенок греческого выражения.
- source_word: τοῦ δευτέρου ἔτους
  choice: во второй год
  rationale: Естественная русская форма хронологической датировки.
- source_word: ἐν τῷ ἐλθεῖν
  choice: после своего прибытия
  rationale: Субстантивированный инфинитив с ἐν имеет временное значение; контекст требует отсчёта второго года от прибытия.
- source_word: εἰς τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: в Иудею и Иерусалим
  rationale: εἰς выражает направленное движение; русский предлог «в» естественно передаёт прибытие в область и город.
theological_decisions:
- issue: Передача ναός в контексте восстановления святилища
  choice: храм Божий
  alternative: дом Божий
  rationale: Греческий текст употребляет ναός, обычное слово для храма или святилища. Вариант «храм Божий» точнее сохраняет непосредственное значение и не вносит конфессионального уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка приподнят, но остаётся ясным; необычная двойная географическая формула «в Иудею и Иерусалим» сохранена по греческому тексту.
