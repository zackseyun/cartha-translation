lexical_decisions:
- source_word: εἰσὶν δὲ οὗτοι
  choice: Вот те
  rationale: Передаёт указательное представление начинающегося списка; δέ имеет лёгкую связующую функцию и не требует отдельного противительного союза.
- source_word: οἱ ἐκ τῆς Ἰουδαίας
  choice: кто из Иудеи
  rationale: Греческий текст прямо называет Иудею; формулировка естественно передаёт субстантивированную конструкцию с артиклем.
- source_word: οἱ ἀναβάντες
  choice: возвратился
  rationale: Буквально глагол означает «поднялся», но в контексте возвращения в Иудею современное «возвратился» ясно передаёт направленное возвращение, не создавая неестественного русского оборота.
- source_word: ἐκ τῆς αἰχμαλωσίας τῆς παροικίας
  choice: из плена на чужбине
  rationale: 'Сохраняет оба смысловых компонента: αἰχμαλωσία — плен, παροικία — пребывание вне родной земли, на чужбине.'
- source_word: οὓς μετῴκισεν
  choice: кого … переселил
  rationale: μετοικίζω обозначает принудительное перемещение или переселение; вариант сохраняет возможность понимать действие как депортацию, не добавляя отсутствующего в форме глагола уточнения.
- source_word: Ναβουχοδονοσὸρ
  choice: Навуходоносор
  rationale: Устоявшаяся русская форма имени царя.
- source_word: βασιλεὺς Βαβυλῶνος
  choice: царь Вавилона
  rationale: Естественная и традиционная передача титула и географического определения.
- source_word: εἰς Βαβυλῶνα
  choice: в Вавилон
  rationale: Передаёт указанное направление переселения.
