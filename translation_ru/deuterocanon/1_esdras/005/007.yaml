base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/007.yaml
  text: These are the ones from Judea who came up from the captivity of the exile[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon[b],
translation:
  language: ru
  text: Вот те из Иудеи, кто возвратились из плена на чужбине[a], кого Навуходоносор, царь Вавилона, переселил в Вавилон[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском параллельном тексте Ездры 2:1 сказано «жители области» (буквально «сыновья области»), а не «те, кто из Иудеи». Здесь перевод следует греческому тексту 1 Ездры как основному источнику.
    reason: alternative_reading
  - marker: b
    text: 'Или: «кого Навуходоносор, царь Вавилона, выселил в Вавилон».'
