translation:
  language: ru
  text: сыновья Ареса[a] — семьсот пятьдесят шесть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте стоит имя «Арес» и указано число 756. Приблизительная параллель в масоретском тексте отличается и обозначением рода, и общим числом.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В переписном родословном списке это стандартное обозначение потомков или рода; буквальная форма сохраняет структуру греческого текста и естественно звучит по-русски.
- source_word: Ἀρές
  choice: Ареса
  rationale: Имя передано транслитерацией с греческого Ἀρές и поставлено в родительном падеже после слова «сыновья». Расхождение с приблизительной масоретской параллелью не служит основанием заменять греческое имя.
- source_word: ἑπτακόσιοι πεντήκοντα ἕξ
  choice: семьсот пятьдесят шесть
  rationale: Число полностью и точно передано словами в соответствии с нормами современного русского литературного языка.
theological_decisions:
- issue: Выбор между греческим чтением и существенно отличающейся масоретской параллелью в переписном списке
  choice: 'Сохранены имя рода и число греческого текста: «Ареса… семьсот пятьдесят шесть».'
  alternative: Согласование с приблизительной масоретской параллелью дало бы другое обозначение рода и другое число.
  rationale: Для 1 Ездры первичным источником служит греческий текст. Масоретская параллель здесь приблизительна и расходится с ним по существу, поэтому различие отмечено в сноске, но не устранено гармонизацией.
translation_notes:
  register: Современный литературный русский язык; краткая, формальная подача переписного списка. Тире отделяет название рода от численности и делает фрагмент естественным без добавления отсутствующего в греческом глагола.
