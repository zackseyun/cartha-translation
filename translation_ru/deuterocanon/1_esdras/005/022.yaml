    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В переписном списке это стандартная родовая формула, обозначающая потомков или членов рода; буквальная форма сохраняет структуру греческого текста и естественна для библейского перечня.
- source_word: Καλαμωκάλου
  choice: Каламокала
  rationale: Имя передано транслитерацией с греческого и поставлено в родительном падеже после слова «сыновья»; согласование с отличающимся еврейским параллельным текстом не производится.
- source_word: Ὠνούς
  choice: Онуса
  rationale: Греческая форма передана как собственное имя «Онус» в родительном падеже. Это сохраняет чтение непосредственного греческого источника.
- source_word: ἑπτακόσιοι εἴκοσι πέντε
  choice: семьсот двадцать пять
  rationale: Прямая передача греческого количественного числительного современным русским языком.
- source_word: Ἰερήχου
  choice: Иерихона
  rationale: Использована закрепившаяся в русском языке форма названия «Иерихон», в родительном падеже после «сыновья».
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: двести сорок пять
  rationale: Прямая передача греческого количественного числительного современным русским языком.
theological_decisions:
- issue: Соотношение греческого чтения с приблизительной масоретской параллелью в переписном списке
  choice: Сохранены греческие имена и числа без согласования с масоретским текстом.
  alternative: 'Передать по масоретской параллели: «жители Вефиля и Гая — двести двадцать три».'
  rationale: Непосредственным источником для 1 Ездры служит греческий текст; заметно отличающаяся масоретская параллель является сравнительным свидетельством, а не основанием для исправления греческого чтения.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичной структуры переписного списка. Тире делает подразумеваемое указание числа естественным по-русски; точка с запятой сохраняет связь с продолжающимся перечнем.
