base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/008.yaml
  text: And each returned to Jerusalem and the rest of Judea[a], each to his own city—the ones who had come with Zerubbabel and Jeshua, Nehemiah, Zareiah, Resaiah, Enenius, Mordecai, Beelsarus, Aspharasus, Boroelius, Roimus, and Baanah, their leaders.
translation:
  language: ru
  text: И все возвратились в Иерусалим и в остальную Иудею, каждый в свой город, — те, кто пришёл вместе с Зоровавелем, Иисусом, Неемией, Зараией, Ресайей, Енинием, Мардохеем, Веелсаром, Асфарасом, Воролеем, Роимом и Вааной[a], своими предводителями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Формы нескольких имён в этом перечне отличаются от форм в приблизительных еврейских параллелях книг Ездры и Неемии. Здесь имена переданы по греческому тексту 1 Ездры, без приведения их к еврейским формам.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: возвратился
  rationale: Глагол обозначает возвращение в прежнее место; русское «возвратился» естественно передаёт смысл переселения обратно.
- source_word: εἰς Ἰερουσαλὴμ καὶ τὴν λοιπὴν Ἰουδαίαν
  choice: в Иерусалим или в другие места Иудеи
  rationale: 'Греческое καί буквально значит «и», однако при распределении людей по собственным городам по-русски естественнее «или»: одни направились в Иерусалим, другие — в остальную Иудею. «Другие места Иудеи» ясно передаёт λοιπὴν Ἰουδαίαν без впечатления, будто сама территория Иудеи была «оставшейся».'
- source_word: ἕκαστος εἰς τὴν ἰδίαν πόλιν
  choice: каждый … в свой город
  rationale: Сохранены распределительное единственное число ἕκαστος и значение πόλις «город».
- source_word: οἱ ἐλθόντες
  choice: из тех, кто пришёл
  rationale: Оборот с субстантивированным причастием отнесён к «каждому»; небольшая синтаксическая перестройка делает фразу понятной по-русски.
- source_word: Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: с Зоровавелем, Иисусом
  rationale: Использованы укоренившиеся русские библейские формы этих имён; «Иисус» здесь обозначает послепленного иудейского предводителя, а не Иисуса Христа.
- source_word: proper-name list
  choice: Неемия, Зараий, Ресай, Ениний, Мардохей, Веелсар, Асфарас, Воролей, Роим и Ваана
  rationale: Имена переданы по греческому тексту 1 Ездры и не приведены искусственно к отличающимся формам приблизительных еврейских параллелей.
- source_word: τῶν προηγουμένων αὐτῶν
  choice: своими предводителями
  rationale: Причастие означает тех, кто идёт впереди и руководит; «предводители» сохраняет конкретный общественный смысл лучше, чем отвлечённое «руководители».
theological_decisions:
- issue: Имя Ἰησοῦς в перечне послепленных предводителей
  choice: Иисус
  alternative: Иешуа / Иошуа
  rationale: Русская библейская традиция обычно передаёт греческое Ἰησοῦς как «Иисус». Контекст ясно отличает этого человека от Иисуса Христа, поэтому пояснение в основном тексте не требуется.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок фразы слегка перестроен ради ясности, но распределительный акцент «каждый … в свой город» и отдельные формы греческого перечня сохранены.
