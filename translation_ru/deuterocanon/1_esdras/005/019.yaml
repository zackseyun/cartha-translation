base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/019.yaml
  text: those from Kartatheireios[a], twenty-five; those from Peiras and Berog, seven hundred.
translation:
  language: ru
  text: из Картафеирея[a] — двадцать пять; из Пейраса и Берога — семьсот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В параллельной еврейской традиции здесь приблизительно: «жителей Нетофы — пятьдесят шесть». По-видимому, 1 Ездры сохраняет иной греческий вариант списка.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  choice: из
  rationale: В перечне это эллиптическая формула происхождения. По-русски краткое «из» естественно передаёт списочный стиль, не добавляя отсутствующего в греческом слова «мужчины» или «люди».
- source_word: Καρταθειαρειός
  choice: Картафеирей
  rationale: Трудное греческое географическое название передано консервативной русской транслитерацией и поставлено в родительный падеж после «из»; оно не отождествляется предположительно с еврейской Нетофой.
- source_word: εἴκοσι πέντε
  choice: двадцать пять
  rationale: Прямое соответствие количественному числительному.
- source_word: Πείρας
  choice: Пейрас
  rationale: Собственное название транслитерировано с греческого без попытки согласовать его с существенно отличающейся еврейской параллелью.
- source_word: Βηρόγ
  choice: Берог
  rationale: Собственное название передано прямой русской транслитерацией греческой формы.
- source_word: ἑπτακόσιοι
  choice: семьсот
  rationale: Прямое соответствие количественному числительному.
theological_decisions:
- issue: Резкое расхождение греческого списка с масоретской параллелью
  choice: Перевести греческие названия и числа по тексту Суита, отметив еврейский вариант в сноске.
  alternative: 'Приблизительная еврейская параллель: «жителей Нетофы — пятьдесят шесть».'
  rationale: Для 1 Ездры первичным источником служит греческий текст. Гармонизация устранила бы подлинное текстовое расхождение, поэтому оно сохранено и прозрачно отмечено.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная форма переписного списка. Тире отделяет названия мест от численности. Имена переданы по греческому источнику без спекулятивного отождествления.
