base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/024.yaml
  text: 'The priests: the sons of Jeddus[a], the son of Jeshua, of the sons of Sanabeis, eight hundred seventy-two; the sons of Emerus[c][b], two hundred fifty-two.'
translation:
  language: ru
  text: 'Священники: сыновья Иеддуса, сына Иешуа, из числа сыновей Санавеиса[a], — восемьсот семьдесят два; сыновья Эрмера[b][c] — двести пятьдесят два.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «в сыновей Санавеиса». Оборот в этом переписном списке необычен и, вероятно, указывает на принадлежность к роду, а не на движение или цель.'
    reason: lexical_alternative
  - marker: b
    text: Греческое имя, переданное здесь как «Эрмер», возможно, соответствует священническому роду, который в еврейской традиции известен под именем «Иммер». Основной текст следует непосредственно греческому свидетельству.
    reason: alternative_reading
  - marker: c
    text: 'Предоставленный для этого места параллельный масоретский текст не соответствует данной греческой строке: в 1-й книге Ездры списки местами переставлены и переработаны. Поэтому перевод здесь основан прежде всего на греческом тексте.'
    reason: textual_variant
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: Священники
  rationale: Прямо обозначает отдельную группу в переписном списке и сохраняет его структуру.
- source_word: οἱ υἱοὶ Ἰέδδου
  choice: сыновья Иедда
  rationale: Формальное «сыновья» сохраняет родословную формулу; в данном перечне оно может включать более широкое значение «потомки».
- source_word: τοῦ υἱοῦ Ἰησοῦ
  choice: сына Иешуа
  rationale: Имя передано в форме «Иешуа», соответствующей послепленному историческому контексту и не создающей ненужной ассоциации с новозаветным именованием Иисуса.
- source_word: εἰς τοὺς υἱοὺς Σαναβείς
  choice: из числа сыновей Санавеиса
  rationale: Предлог εἰς в этой переписной формуле необычен. Русское выражение осторожно передаёт принадлежность к роду, не придавая обороту буквального значения направления.
- source_word: ὀκτακόσιοι ἑβδομήκοντα δύο
  choice: восемьсот семьдесят два
  rationale: Числительное передано словами в естественной форме современного русского языка.
- source_word: υἱοὶ Ἐρμήρου
  choice: сыновья Эмера
  rationale: Имя передано на основе греческой формы Ἐρμήρου с русской падежной адаптацией; возможное отождествление с иным традиционным написанием оставлено в примечании.
- source_word: διακόσιοι πεντήκοντα δύο
  choice: двести пятьдесят два
  rationale: Числительное передано прямо и естественно.
