  text: The sons of Phath-moab[a], of the sons of Jeshua and Joab[b], two thousand eight hundred and two.
translation:
  language: ru
  text: Сыновья Фталемоава[a], из сыновей Иисуса и Ровоава[b], — две тысячи восемьсот два.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — Фталемоав; в параллельной еврейской традиции обычно стоит имя Пахат-Моав.
    reason: alternative_reading
  - marker: b
    text: 'Греческий текст гласит: «Иисуса и Ровоава»; соответствующий перечень в книгах Ездры и Неемии обычно связывают с именами Иешуа и Иоав. Поскольку 1-я книга Ездры порой переставляет или перерабатывает материал источника, форма греческого текста сохранена в основном переводе.'
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: Сыновья
  rationale: Сохранена формальная родословная формула греческого текста; в перечне она обозначает также потомков или родовую группу.
- source_word: Φθαλεμωάβ
  choice: Фталемоава
  rationale: Имя передано непосредственно по основному греческому свидетельству, без замены формой из еврейской параллели.
- source_word: εἰς
  choice: из
  rationale: В формуле списка предлог указывает на принадлежность к названной далее родовой группе, а не на движение; краткое «из» естественно передаёт эту связь, не уточняя её сверх текста.
- source_word: Ἰησοῦ καὶ Ῥοβοάβ
  choice: Иисуса и Ровоава
  rationale: Оба имени переданы по греческому тексту. В частности, Ῥοβοάβ не исправлено молча на имя Иоав из параллельного перечня.
- source_word: δισχίλιοι ὀκτακόσιοι δύο
  choice: две тысячи восемьсот два
  rationale: Точное словесное воспроизведение указанного в греческом тексте количества; подразумеваемое «человека» не добавлено.
