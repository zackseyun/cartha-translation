lexical_decisions:
- source_word: συναπέστειλεν
  choice: послал с ними
  rationale: 'Передаёт значение совместного отправления: Дарий направил всадников вместе с возвращавшимися.'
- source_word: ἱππεῖς χιλίους
  choice: тысячу всадников
  rationale: ἱππεῖς обозначает конных воинов; в данном контексте русское «всадники» естественно и сохраняет военный оттенок.
- source_word: ἕως τοῦ ἀποκαταστῆσαι αὐτούς
  choice: пока те не доставили их обратно
  rationale: Сочетание ἕως τοῦ с инфинитивом указывает на действие, до завершения которого продолжалось сопровождение; ἀποκαθίστημι здесь означает возвращение людей в прежнее место. «Те» ясно указывает на всадников, не называя их заново.
- source_word: μετʼ εἰρήνης
  choice: с миром
  rationale: Сохраняет греческий образ и допускает как мирное, так и благополучное возвращение, не сводя выражение только к безопасности.
- source_word: μετὰ μουσικῶν
  choice: под музыку
  rationale: Форма μουσικῶν допускает понимание как музыкального сопровождения, так и музыкантов. «Под музыку» естественно звучит по-русски, а личное значение отмечено в сноске.
