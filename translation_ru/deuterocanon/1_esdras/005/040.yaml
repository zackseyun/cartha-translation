revisions:
- from: И Неемия и Афария сказали им не иметь доли в святынях до тех пор, пока не восстанет священник, облечённый Откровением и Истиной[a][b].
  to: И Неемия и Афария сказали им не пользоваться священными дарами, пока не появится священник, облачённый в Откровение и Истину[a][b].
  rationale: Основная правка устраняет ложное и неидиоматичное «в святынях», передавая контекстуальное значение τῶν ἁγίων как священных даров (в особенности священнических долей), без утверждения в основном тексте, что речь исключительно о еде. Образ ἐνδεδυμένος передан естественной русской конструкцией «облачённый в». Примечания уточнены так, чтобы сохранить традиционную идентификацию пары с уримом и туммимом, но не выдавать приблизительный еврейский параллельный свидетель за прямой источник данной формулировки.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:13:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Греческое μὴ μετέχειν τῶν ἁγίων означает запрет на причастность к «священным вещам»; в данном контексте речь, по всей вероятности, о священнических долях пищи. «Не иметь доли в святынях» неудачно: «святыни» по-русски обычно обозначает предметы почитания или святые места, а предложное «в святынях» меняет смысл. δήλωσις καὶ ἀλήθεια следует передавать смысловыми словами, не подменяя греческую форму традиционными «уримом и туммимом» в основном тексте.'
  naturalness: 'Исправленный вариант сохраняет умеренно возвышенный библейский регистр, но использует ясные современные сочетания: «не пользоваться священными дарами», «пока не появится», «облачённый в».'
  terminology: '«Священные дары» передаёт культовый характер τῶν ἁγίων и не создаёт ложной ассоциации со святыми местами. «Откровение и Истина» сохраняет семантическую форму греческой пары; традиционное отождествление с уримом и туммимом остаётся в примечании. Имена «Неемия» и «Афария» допустимы: первое — устоявшаяся русская библейская форма, второе прямо передаёт греческое Ἀθαρίας.'
  issues:
  - severity: medium
    issue: «Не иметь доли в святынях»
    rationale: 'Это выражение неестественно и семантически неточно: русское «святыни» обычно не означает культовые пищевые доли, а конструкция «в святынях» способна пониматься как нахождение в святых местах.'
  - severity: low
    issue: «облечённый Откровением и Истиной»
    rationale: При сохранении образа облачения естественная русская сочетаемость требует «облачённый в Откровение и Истину».
