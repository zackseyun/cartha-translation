base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/040.yaml
  text: And Nehemiah and Atharias told them not to partake of the holy things until a priest should arise clothed with the Manifestation and the Truth[a][b].
translation:
  language: ru
  text: И Неемия и Афария сказали им не пользоваться священными дарами, пока не появится священник, облачённый в Откровение и Истину[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Откровение и Истина» традиционно отождествляют со священническими предметами, известными как урим и туммим.
    reason: alternative_reading
  - marker: b
    text: То есть им не дозволялось вкушать священнические доли, пока священник не мог вынести окончательное решение.
    reason: cultural_note
lexical_decisions:
- source_word: εἶπεν αὐτοῖς
  choice: сказали им
  rationale: Русское множественное число согласуется с составным подлежащим «Неемия и Афария»; инфинитив далее передаёт распорядительный смысл речи.
- source_word: Ναιμίας
  choice: Неемия
  rationale: Устоявшаяся русская библейская форма имени, соответствующая греческому Ναιμίας.
- source_word: Ἀθαρίας
  choice: Афария
  rationale: Передаёт греческую форму имени непосредственно, с обычным русским соответствием θ — «ф», не заменяя её предполагаемым семитским эквивалентом.
- source_word: μὴ μετέχειν τῶν ἁγίων
  choice: не иметь доли в святынях
  rationale: Передаёт значение участия или доли и сохраняет широту греческого τὰ ἅγια, не сводя выражение в основном тексте исключительно к еде.
- source_word: ἕως ἀναστῇ
  choice: до тех пор, пока не восстанет
  rationale: Передаёт ожидаемое в будущем появление священника и сохраняет возвышенный оттенок ἀναστῇ.
- source_word: ἱερεὺς
  choice: священник
  rationale: Прямой перевод единственного числа без необоснованного уточнения «первосвященник».
- source_word: ἐνδεδυμένος
  choice: облечённый
  rationale: Сохраняет образ облачения и торжественный культовый регистр греческого причастия.
- source_word: τὴν δήλωσιν
  choice: Откровением
  rationale: δήλωσις обозначает обнаружение, прояснение или откровение; заглавная буква показывает, что слово входит в наименование парных священных средств, вероятно соответствующих уриму и туммиму.
- source_word: τὴν ἀλήθειαν
  choice: Истиной
  rationale: Прямо передаёт ἀλήθεια и вместе с «Откровением» сохраняет смысловую форму греческого текста, не подменяя её еврейской транслитерацией.
theological_decisions:
- issue: Передача пары δήλωσις καὶ ἀλήθεια
  choice: «Откровением и Истиной» в основном тексте, с указанием на урим и туммим в примечании
  alternative: «уримом и туммимом»
  rationale: Для 1 Ездры первичным является греческий текст, который переводит или истолковывает традиционные названия, а не транслитерирует их. Основной текст поэтому сохраняет греческие смысловые слова, тогда как вероятное традиционное отождествление сообщается читателю в примечании.
- issue: Характер участия в святынях
  choice: Сохранить широкое «иметь долю в святынях»
  alternative: «вкушать священную пищу»
  rationale: Контекст, вероятно, касается священнических священных приношений, однако сам греческий текст выражен шире. Конкретное культурное значение поясняется в примечании без сужения основного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулы «восстанет» и «облечённый» сохраняют торжественность оригинала, а синтаксис остаётся ясным для современного читателя.
