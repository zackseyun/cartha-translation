  text: the sons of Adonikam[a], thirty-seven; the sons of Bosai, two thousand six hundred six; the sons of Adilion, four hundred fifty-four;
translation:
  language: ru
  text: сыновья Адоникама — тридцать семь[a]; сыновья Босая — две тысячи шестьсот шесть; сыновья Адилия — четыреста пятьдесят четыре;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — «тридцать семь»; в масоретской параллели книги Ездры — «шестьсот шестьдесят шесть».
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В переписном списке это устойчивая родовая формула, обозначающая сыновей или потомков главы рода. Формальное «сыновья» сохраняет структуру греческого текста, не исключая более широкого родового значения.
- source_word: Ἀδωνεικάμ
  choice: Адоникама
  rationale: Имя передано транслитерацией с учётом греческой формы и семитского параллельного свидетельства; падеж обусловлен русской конструкцией «сыновья кого».
- source_word: τριάκοντα ἑπτά
  choice: тридцать семь
  rationale: Точно воспроизводит число греческого источника; расхождение с масоретской параллелью не гармонизируется и отмечается сноской.
- source_word: Βοσαί
  choice: Босая
  rationale: Греческое имя транслитерировано без замены предполагаемым именем из иной текстовой традиции.
- source_word: δισχίλιοι ἑξακόσιοι ἕξ
  choice: две тысячи шестьсот шесть
  rationale: Точное и естественное русское словесное обозначение греческого числа 2606.
- source_word: Ἀδειλίου
  choice: Адилия
  rationale: Греческая форма имени передана русской транслитерацией; окончание родительного падежа естественно после слова «сыновья».
- source_word: τετρακόσιοι πεντήκοντα τέσσαρες
  choice: четыреста пятьдесят четыре
  rationale: Точное и естественное русское словесное обозначение греческого числа 454.
theological_decisions:
- issue: Расхождение имён и чисел переписного списка с масоретской параллелью
  choice: Следовать греческому тексту 1 Ездры и сохранить число «тридцать семь»
  alternative: 'Согласовать число с масоретской традицией: «шестьсот шестьдесят шесть»'
  rationale: Для 1 Ездры первичным источником служит греческий текст. Существенное расхождение нельзя молча устранять; иной вариант вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством переписного перечня. Тире ясно связывает название рода с числом и делает длинный список удобочитаемым; имена переданы последовательно и без конфессиональной гармонизации.
