lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В переписном списке слово обозначает потомков или членов рода; буквальное «сыновья» сохраняет формулу греческого текста и естественно звучит по-русски.
- source_word: Σαμά
  choice: Самы
  rationale: Имя передано по первичному греческому свидетелю как «Сама» и поставлено в родительный падеж после слова «сыновья». Значительное расхождение с масоретской параллелью отмечено в сноске.
- source_word: τρισχίλιοι τρακόσιοι εἷς
  choice: три тысячи триста один человек
  rationale: Числительное передано словами; добавление «человек» естественно проясняет подразумеваемый счёт лиц, не изменяя значения греческого текста.
