    reason: lexical_alternative
  - marker: b
    text: 'В еврейском параллельном тексте (Езд 3:10) сцена описана полнее: поставлены священники в облачениях с трубами, а левиты, потомки Асафа, — с кимвалами, чтобы славить Господа. В 1 Ездры сохранилась сжатая греческая форма этого описания.'
    reason: cross_reference
lexical_decisions:
- source_word: πολλοὶ
  choice: многие
  rationale: Субстантивированное прилагательное обозначает множество участников; краткое «многие» сохраняет эллиптичность греческого текста и не добавляет отсутствующего существительного.
- source_word: διὰ σαλπίγγων
  choice: с трубами
  rationale: διά с родительным здесь имеет инструментальное значение. «С трубами» естественно по-русски и согласуется с более полным еврейским параллельным описанием, не внося его деталей в основной текст.
- source_word: χαρὰ μεγάλη
  choice: великая радость
  rationale: Прямой и стилистически достойный эквивалент, сохраняющий форму именной группы.
- source_word: τῇ φωνῇ
  choice: в голосах
  rationale: Греческое выражение буквально связано с «голосом» и не содержит определения «громкий». Русское множественное число естественно передаёт коллективное звучание при сохранении необычной, сжатой конструкции; добавление «громких» или замена на «крики» были бы толкованием.
