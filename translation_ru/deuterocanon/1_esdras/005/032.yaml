base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/032.yaml
  text: the sons of Dedda[a], the sons of Bachous, the sons of Serar, the sons of Thomthei, the sons of Nasei[b], the sons of Hatepha.
translation:
  language: ru
  text: сыновья Дедды[a], сыновья Вахуса, сыновья Серара, сыновья Томфея, сыновья Насея[b], сыновья Хатефы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь перечислены шесть родовых имён — Дедда, Вахус, Серар, Томфей, Насей и Хатефа, — тогда как приблизительная еврейская параллель содержит три других имени: Левана, Хагава и Аккув. Поскольку в этом месте 1 Ездры за основу перевода взят греческий текст, греческие имена сохранены и не приведены в соответствие с еврейской параллелью.'
    reason: alternative_reading
  - marker: b
    text: Некоторые имена в этом стихе встречаются редко и, возможно, отражают неустойчивость текста или различия в транслитерации в греческой традиции. Перевод консервативно следует представленному греческому тексту.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В перечне вернувшихся это обозначение потомков или родовых групп, а не только непосредственных сыновей; повтор сохраняет структуру греческого текста.
- source_word: Δεδδά
  choice: Дедды
  rationale: Имя передано непосредственно по греческому основному свидетелю и поставлено в родительный падеж после слова «сыновья»; согласование с приблизительной еврейской параллелью не производится.
- source_word: Βαχούς
  choice: Вахуса
  rationale: Консервативная передача греческой формы с β как «в» по традиции русской библейской транслитерации; имя дано в родительном падеже.
- source_word: Σεράρ
  choice: Серара
  rationale: Прямая транслитерация греческого имени без замены отличающимся именем из приблизительной еврейской параллели.
- source_word: Θόμθει
  choice: Томфея
  rationale: 'Редкое имя передано близко к греческой форме: θ как «т», сочетание -θει — как «-фей» в косвенной форме «-фея»; спекулятивная нормализация исключена.'
- source_word: Νασεί
  choice: Насея
  rationale: Греческая форма передана консервативно и поставлена в родительный падеж; оснований для исправления по иным именам нет.
- source_word: Ἁτεφά
  choice: Атефы
  rationale: Начальное густое придыхание отдельно не отражено, что соответствует обычной русской передаче греческих библейских имён; форма имени сохранена максимально близко к Ἁτεφά.
