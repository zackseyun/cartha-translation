  yaml_path: translation/deuterocanon/1_esdras/005/026.yaml
  text: 'The Levites: the sons of Jesueis[a], Koddelou, Bannou, and Soudiou, seventy-four.'
translation:
  language: ru
  text: 'Левиты: сыновья Иесуиса[a], Коддела, Ванна и Судия — семьдесят четыре человека.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые имена в этом стихе отличаются от более известных форм в параллельных местах книг Ездры и Неемии; здесь они переданы по греческому тексту 1 Ездры, без согласования с еврейской традицией.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: Левиты
  rationale: Именительный оборот служит заголовком позиции в перечне; «Левиты» естественно передаёт его без добавления отсутствующего в греческом союза.
- source_word: υἱοὶ
  choice: сыновья
  rationale: Сохранён формальный генеалогический термин; в данном списке он может обозначать также потомков или членов родов, но более широкое значение не внесено непосредственно в текст.
- source_word: Ἰησουείς
  choice: Иесуиса
  rationale: Имя передано по греческой форме Ἰησουείς и поставлено в требуемый русским синтаксисом родительный падеж; оно не заменено именем из параллельной еврейской традиции.
- source_word: Κοδδηλοῦ
  choice: Коддела
  rationale: Передана непосредственно греческая форма имени с двойным δ; гармонизация с более известным параллельным именем Кадмиил не проводится.
- source_word: Βάννου
  choice: Ванна
  rationale: Греческое Β передано по принятому для библейских греческих имён русскому образцу через «В»; форма адаптирована к русскому родительному падежу без гармонизации с еврейскими параллелями.
- source_word: Σουδίου
  choice: Судия
  rationale: Сохранена греческая форма необычного имени, морфологически адаптированная к русскому; предполагаемое еврейское соответствие в основной текст не внесено.
- source_word: ἑβδομήκοντα τέσσαρες
  choice: семьдесят четыре человека
  rationale: Число передано прямо; слово «человека» добавлено для ясного и естественного завершения русской переписной записи, поскольку в греческом подразумевается число перечисленных лиц.
