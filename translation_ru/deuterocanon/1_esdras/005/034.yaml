lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В родословном перечне это формула, обозначающая сыновей, потомков или членов рода. «Сыновья» сохраняет повторяющуюся структуру греческого текста, не исключая родового смысла.
- source_word: Ἁγιά
  choice: Агии
  rationale: Имя передано с греческой формы; начальное придыхание в современном русском обычно не транслитерируется. После слова «сыновья» употреблён родительный падеж.
- source_word: Φακαρὲθ Σαβειή
  choice: Факарет-Савеия
  rationale: Редкое составное или тесно связанное именование передано консервативно с дефисом; греческое φ передано как «ф», а β — традиционным для библейских имён «в».
- source_word: Σαρωθεί
  choice: Сарофея
  rationale: Имя транслитерировано непосредственно с греческого и поставлено в родительный падеж, без согласования с более кратким еврейским параллельным списком.
- source_word: Μεισαίας
  choice: Месии
  rationale: Греческое имя передано в естественной русской библейской форме; сочетание ει не механически воспроизводится как отдельный дифтонг.
- source_word: Γάς
  choice: Гаса
  rationale: Краткая греческая форма имени сохранена без отождествления с именами из иных текстовых традиций.
- source_word: Ἀδδούς
  choice: Аддуя
  rationale: Двойное δ сохранено; окончание оформлено как родительный падеж русской формы «Аддуй».
- source_word: Σουβάς
  choice: Суваса
  rationale: Греческое ου передано русским «у», что соответствует современной русской передаче греческих имён.
- source_word: Ἀφερρά
  choice: Аферры
  rationale: Сохранено удвоенное ρ; имя поставлено в родительный падеж.
- source_word: Βαρωθείς
  choice: Варофея
  rationale: Имя передано по греческой форме с традиционной русской передачей β как «в» и θ как «ф».
- source_word: Σαφάγ
  choice: Сафага
  rationale: Имя транслитерировано прямо с греческого и грамматически оформлено в родительном падеже.
- source_word: Ἀλλών
  choice: Аллона
  rationale: Сохранено удвоенное λ; имя передано без гармонизации с приблизительной еврейской параллелью.
