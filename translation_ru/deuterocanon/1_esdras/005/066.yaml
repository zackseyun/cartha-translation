base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/066.yaml
  text: For we also[a], like you, listen to your Lord, and we will sacrifice to him from the days of Asbakaphath king of the Assyrians[c][b], who brought us here.
translation:
  language: ru
  text: Ведь и мы, как и вы, слушаем вашего Господа и будем приносить Ему жертвы[b] со времён Асбакафата[a], царя ассирийцев, который привёл нас сюда[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Асбакафат — форма имени в греческом тексте; в параллельном месте Ездры 4:2 этот царь назван Асархаддоном.
    reason: alternative_reading
  - marker: b
    text: 'Греческий глагол стоит в будущем времени: «будем приносить жертвы». Сочетание будущего времени с выражением «со времён» необычно, но сохранено в переводе.'
    reason: textual_ambiguity
  - marker: c
    text: Слова «привёл нас сюда» могут подразумевать принудительное переселение при ассирийском владычестве.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοίως … ὑμῖν
  choice: и мы, как и вы
  rationale: Передаёт заявленное говорящими сходство с адресатами естественным современным русским оборотом.
- source_word: ἀκούομεν
  choice: слушаем
  rationale: Сохраняет возможные значения «слышим» и «внимаем», не усиливая их до однозначного «повинуемся».
- source_word: τοῦ κυρίου ὑμῶν
  choice: вашего Господа
  rationale: Сохраняет явное местоимение «вашего» и не добавляет отсутствующего в греческом слове «Бога».
- source_word: ἐπιθύσομεν
  choice: будем приносить Ему жертвы
  rationale: Передаёт форму будущего времени и специальное значение глагола, относящееся к жертвоприношению.
- source_word: ἀπὸ ἡμερῶν
  choice: со времён
  rationale: Естественный русский временной оборот, указывающий на начальную точку действия; необычное сочетание с будущим временем в греческом не сглаживается заменой времени глагола.
- source_word: Ἀσβακαφὰθ
  choice: Асбакафат
  rationale: Имя транслитерировано по основной греческой форме; отождествление с Асарданом по параллельному месту вынесено в примечание.
- source_word: βασιλέως Ἀσσυρίων
  choice: царя ассирийцев
  rationale: Буквально сохраняет этнонимическую форму греческого выражения, не заменяя её на «царя Ассирии».
- source_word: μετήγαγεν … ἐνταῦθα
  choice: привёл нас сюда
  rationale: Передаёт перемещение в данное место, не делая подразумеваемое принудительное переселение явным в основном тексте.
theological_decisions:
- issue: Утверждают ли говорящие, что поклоняются тому же Господу, что и вернувшиеся иудеи
  choice: Их заявление передано прямо, без оценки его искренности или богословской истинности.
  alternative: Перевести ἀκούομεν как «повинуемся» либо расширить κύριος до «Господь, ваш Бог».
  rationale: Греческий текст передаёт самоописание говорящих и называет адресата «вашим Господом»; перевод не должен ни подтверждать, ни опровергать их притязание и не должен добавлять отсутствующее слово «Бог».
- issue: Необычное сочетание будущего времени с выражением «со времён»
  choice: 'Сохранить будущее время: «будем приносить … со времён».'
  alternative: Сгладить фразу как «приносим» или «приносили … со времён».
  rationale: ἐπιθύσομεν формально является будущим временем. Его исправление ради контекстуальной гладкости устранило бы реальное напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис оставлен ясным, но необычная временная форма греческого текста намеренно не нормализована.
