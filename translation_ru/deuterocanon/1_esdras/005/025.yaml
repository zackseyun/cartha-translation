lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В переписном списке это обычная родовая формула, обозначающая членов рода; буквальное «сыновья» сохраняет форму и лаконизм греческого текста.
- source_word: Φασσόρου
  choice: Фассора
  rationale: Передаётся греческая форма имени Φασσόρ, поскольку основным источником здесь служит греческий текст 1 Ездры; родительный падеж естественно соответствует греческому Φασσόρου.
- source_word: χίλιοι διακόσιοι τεσσεράκοντα ἑπτά
  choice: 1 247 человек
  rationale: Числительное точно передаёт сумму 1 247; запись цифрами удобна для переписного списка, а слово «человек» естественно поясняет эллиптическую конструкцию по-русски.
