  text: the gatekeepers[a], four hundred; the sons of Ishmael, sons of Lakubath[b], one thousand.
translation:
  language: ru
  text: привратников — четыреста; потомков Измаила, сыновей Лакувата[a], — тысяча.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «потомки Измаила, сыновья Лакувата, тысяча». Параллельный перечень в Неемии 7 в этом месте не совпадает с ним, поэтому перевод следует греческому свидетельству, не согласуя его с масоретским текстом. Имя «Лакуват», возможно, связано с формой «Аккув» или «Лаккув», известной по параллельным спискам вернувшихся.'
    reason: textual_variant
lexical_decisions:
- source_word: οἱ θυρωροί
  choice: привратников
  rationale: В перечне возвращенцев θυρωροί обозначает служителей, охранявших входы; «привратники» — ясное и принятое русское название этой группы.
- source_word: τετρακόσιοι
  choice: четыреста
  rationale: Прямой перевод количественного числительного, относящегося к привратникам.
- source_word: οἱ Ἰσμαήλου
  choice: потомков Измаила
  rationale: Греческое выражение буквально означает «те, кто от Измаила»; в родовом перечне «потомки Измаила» естественнее и не требует понимать всех перечисленных как непосредственных сыновей.
- source_word: υἱοὶ Λακουβάτου
  choice: сыновей Лакувата
  rationale: υἱοί прямо означает «сыновья», а имя Λακουβάτου передано транслитерацией по основному греческому свидетелю без гармонизации с параллельными списками.
- source_word: χίλιοι
  choice: тысяча
  rationale: Прямой перевод количественного числительного, относящегося к непосредственно предшествующей родовой группе.
