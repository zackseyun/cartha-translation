base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/063.yaml
  text: And when the enemies of the tribe of Judah and Benjamin heard[a], they came to find out what the sound of the trumpets was[b],
translation:
  language: ru
  text: Услышав, враги колена Иуды и Вениамина[a] пришли узнать, что это за звук труб[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте стоит единственное число: «колена Иуды и Вениамина»; по смыслу возможно также: «колен Иуды и Вениамина».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «что это за голос труб».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: услышав это
  rationale: Аористное причастие обозначает действие, предшествующее основному. В греческом дополнение не выражено; русское «это» естественно восполняет подразумеваемый предмет слуха, не уточняя его содержания.
- source_word: οἱ ἐχθροὶ
  choice: враги
  rationale: Существительное обозначает противников; притяжательное «их» в греческом отсутствует, поэтому оно не добавлено.
- source_word: τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: колена Иуды и Вениамина
  rationale: Сохранено единственное число φυλή при двух именах, хотя по-русски возможно множественное «колен»; необычная форма источника отмечена в сноске.
- source_word: ἦλθοσαν
  choice: пришли
  rationale: Простой глагол движения передан обычным русским повествовательным эквивалентом.
- source_word: ἐπιγνῶναι
  choice: узнать
  rationale: Инфинитив цели указывает, что противники пришли выяснить природу услышанного звука.
- source_word: τίς ἡ φωνὴ τῶν σαλπίγγων
  choice: что это за звук труб
  rationale: φωνή применительно к трубам естественно означает «звук»; оборот «что это за…» передаёт вопрос о природе услышанного без добавления значения «что он означал».
