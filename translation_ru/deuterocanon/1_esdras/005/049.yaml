base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/049.yaml
  text: And they gathered themselves to them from the other nations of the land[a], and they were strengthened at the altar in its place; for they were in hostility toward them. All the nations on the land prevailed against them, and they offered sacrifices at the appointed time, and whole burnt offerings to the Lord[c][b], morning and evening.
translation:
  language: ru
  text: И к ним собрались люди из других народов этой земли[a], и они утвердились у жертвенника на своём месте; ведь они были во вражде с ними. Все народы, жившие на этой земле, взяли верх над ними, и они в положенное время приносили жертвы и всесожжения[b] Господу — утром и вечером[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к ним присоединились люди из других народов этой земли». Греческий глагол может подразумевать присоединение к общине.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть жертвы, целиком сжигавшиеся на огне; возможный перевод: «жертвы всесожжения».'
    reason: lexical_alternative
  - marker: c
    text: 'Греческий текст здесь полнее приблизительной еврейской параллели в Езд 3:2: в нём упомянуты вражда, превосходство народов земли и регулярные жертвоприношения утром и вечером.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισυνήχθησαν αὐτοῖς
  choice: к ним собрались
  rationale: Передаёт значение совместного собирания и допускаемый формой оттенок присоединения, не добавляя отсутствующего в греческом слова «некоторые».
- source_word: ἐκ τῶν ἄλλων ἐθνῶν τῆς γῆς
  choice: люди из других народов этой земли
  rationale: ἔθνη означает «народы»; добавленное по-русски «люди» делает обозначение участников естественным, а «этой земли» сохраняет выражение τῆς γῆς без географического домысливания.
- source_word: κατωρθώθησαν
  choice: укрепились
  rationale: Трудный в данном контексте глагол может обозначать приведение в надлежащее или устойчивое положение. «Укрепились» сохраняет смысл обретённой устойчивости и не превращает фразу в техническое описание установки жертвенника.
- source_word: ἐπὶ τὸ θυσιαστήριον ἐπὶ τοῦ τόπου αὐτῶν
  choice: у жертвенника, на своём месте
  rationale: Сохраняет обе предложные конструкции и неоднозначную связь «места» с действующими лицами, не исправляя αὐτῶν на единственное число.
- source_word: ἐν ἔχθρᾳ ἦσαν αὐτοῖς
  choice: они были во вражде с ними
  rationale: Сохраняет именную форму «вражда» и не уточняет сверх текста, какая из названных групп была её инициатором.
- source_word: κατίσχυσαν αὐτοὺς
  choice: одолевали их
  rationale: Передаёт значение превосходства силой или преобладания над кем-либо; несовершенный вид по-русски уместно описывает продолжавшееся давление.
- source_word: κατὰ τὸν καιρὸν
  choice: в положенное время
  rationale: Выражает соблюдение надлежащего, установленного времени жертвоприношений.
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Устоявшийся русский библейский термин точно обозначает жертвы, целиком сжигавшиеся на огне.
- source_word: Κυρίῳ
  choice: Господу
  rationale: Стандартная и естественная передача дательного падежа κύριος в данном богослужебном контексте.
- source_word: τὸ πρωϊνὸν καὶ τὸ δειλινόν
  choice: утром и вечером
  rationale: Естественно передаёт регулярную суточную пару времени жертвоприношений.
theological_decisions:
- issue: Соотношение полного греческого текста с более краткой приблизительной параллелью в Езд 3:2
  choice: Перевести все положения греческого текста, включая вражду, превосходство народов и утренние и вечерние приношения
  alternative: Сблизить стих с еврейской параллелью, опустив или смягчив отсутствующие в ней части
  rationale: Для 1 Ездры первичным свидетелем служит греческий текст; более краткая еврейская параллель не должна устранять его особенности и напряжение.
- issue: Направленность вражды и референты местоимений
  choice: Сохранить формулировку «они были во вражде с ними» и не называть одну сторону врагами другой
  alternative: 'Уточнить: «те враждовали с ними» или «враги противостояли им»'
  rationale: Греческие местоимения в этой последовательности допускают неясность референтов. Нейтральная взаимная конструкция сохраняет напряжение текста без внесения этнической или богословской оценки.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Термин «всесожжения» сохранён ради точности и узнаваемости; синтаксическая неоднозначность местоимений не устранена. Союз «а» перед продолжением о жертвах служит естественной русской связью на фоне противодействия, не меняя фактического содержания.
