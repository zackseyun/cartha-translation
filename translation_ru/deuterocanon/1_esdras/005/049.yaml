  source_fidelity: В целом перевод передаёт полный греческий текст, не гармонизируя его с более краткой параллелью Езд 3:2. Однако аорист κατίσχυσαν лучше передать совершенным видом («взяли верх над ними»), а не несовершенным «одолевали». Трудное κατωρθώθησαν ... ἐπὶ τοῦ τόπου αὐτῶν следует сохранить без излишнего прояснения, но нынешнее «укрепились у жертвенника, на своём месте» по-русски звучит неясно и неестественно.
  naturalness: «Утвердились у жертвенника на своём месте» несколько яснее и естественнее, чем «укрепились ... на своём месте», при этом сохраняет трудную синтаксическую связь оригинала. Союз «а» перед последней частью создаёт невыраженное в греческом противопоставление; нейтральное «и» предпочтительнее.
  terminology: «Жертвенник», «всесожжения» и «Господу» точны и соответствуют современному литературному библейскому регистру. «Другие народы этой земли» уместно; слово «люди» — естественное русское эксплицирование носителей действия и не меняет смысла.
