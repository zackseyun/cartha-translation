  text: сыновья Иаеира[a], сыновья Даисана, сыновья Ноэвы, сыновья Хасевы, сыновья Казеры, сыновья Озея, сыновья Финоя, сыновья Асары, сыновья Вастая, сыновья Ассаны, сыновья Манея, сыновья Нафисея, сыновья Акуфа, сыновья Ахивы, сыновья Асура, сыновья Фаракема,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейской параллели, Неемии 7:46, здесь стоят другие имена: «нефинеи: сыновья Цихи, сыновья Хасуфы, сыновья Таббаофа». В Первой книге Ездры сохранился существенно иной греческий перечень; перевод следует греческому тексту, не согласуя его с еврейской параллелью.'
