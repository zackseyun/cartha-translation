lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В перечне родов это формула, обозначающая членов рода или потомков; буквальное «сыновья» сохраняет повторяющуюся структуру греческого текста без излишнего истолкования.
- source_word: Ἰαείρου
  choice: Иаеира
  rationale: Имя передано по греческой форме Ἰαείρ с русским склонением, без гармонизации с приблизительной еврейской параллелью.
- source_word: Δαισάν
  choice: Даисана
  rationale: Прямая передача греческой формы имени с русским падежным окончанием, требуемым конструкцией «сыновья кого».
- source_word: Νοεβά
  choice: Ноевы
  rationale: Греческое имя передано близко к исходному звучанию и оформлено как склоняемое русское имя.
- source_word: Χασεβά
  choice: Хасевы
  rationale: Начальное χ передано русским «х»; имя не отождествляется предположительно с иным именем еврейской параллели.
- source_word: Καζηρά
  choice: Казеры
  rationale: Сохранена греческая форма имени; η передана как «е» согласно принятой русской библейской традиции передачи греческих имен.
- source_word: Ὀζείου
  choice: Озея
  rationale: Родительная форма указывает на исходное имя Озей; выбрана естественная русская склоняемая форма вместо механической транслитерации греческого генитива.
- source_word: Φινόε
  choice: Финоя
  rationale: Имя передано по греческому написанию, с естественным русским родительным падежом.
- source_word: Βασθαί
  choice: Вастая
  rationale: Греческая β передана традиционным для библейских имен русским «в», θ — «т»; форма адаптирована к русскому склонению.
- source_word: Ναφεισεί
  choice: Нафисея
  rationale: 'Имя транслитерировано с учетом русской библейской традиции: φ как «ф», ει как «и/ей» в основе и естественное окончание родительного падежа.'
- source_word: Ἀκούφ
  choice: Акуфа
  rationale: Прямая передача греческого имени с φ как «ф» и русским родительным окончанием.
- source_word: Ἀχειβά
  choice: Ахивы
  rationale: χ передано как «х», ει — как «и»; сохранена самостоятельная греческая форма имени.
- source_word: Ἀσούρ
  choice: Асура
  rationale: Прямая русская передача греческого имени, без отождествления с более известными созвучными названиями.
- source_word: Φαρακέμ
  choice: Фаракема
  rationale: Имя передано непосредственно с греческого и поставлено в родительный падеж после «сыновья».
