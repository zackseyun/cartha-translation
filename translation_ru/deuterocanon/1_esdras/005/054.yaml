base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/054.yaml
  text: And in the second year[a], when they had come to the house of God in Jerusalem, in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak began, along with their brothers, the priests, the Levites, and all who had come from the captivity to Jerusalem[b],
translation:
  language: ru
  text: Во второй год, когда они прибыли в храм Божий[a] в Иерусалиме, во втором месяце Зоровавель, сын Салафииля, и Иисус, сын Иоседека, вместе со своими братьями, священниками, левитами и всеми, кто пришёл из плена в Иерусалим[b], начали,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилищу Божьему». Греческое слово может обозначать как храм, так и священный храмовый комплекс в более широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все, кто вернулся из изгнания». Буквально в греческом тексте: «все, кто пришёл из плена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ δευτέρῳ ἔτει
  choice: во второй год
  rationale: Прямой и естественный перевод временного дательного падежа.
- source_word: παραγενόμενοι εἰς τὸ ἱερὸν τοῦ θεοῦ
  choice: когда они пришли к храму Божьему
  rationale: Причастие передаёт действие, предшествующее началу работ; придаточное времени естественно звучит по-русски. ἱερόν обозначает храм или весь священный храмовый комплекс.
- source_word: μηνὸς δευτέρου
  choice: во втором месяце
  rationale: Естественная передача родительного времени без уточнения названия месяца, которого нет в греческом тексте.
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιήλ
  choice: Зоровавель, сын Салафииля
  rationale: Использованы устоявшиеся русские библейские формы имён и явно выражено значение греческой патронимической конструкции.
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδέκ
  choice: Иисус, сын Иоседека
  rationale: Сохранена традиционная русская форма имени этого послепленного первосвященника, соответствующая греческому Ἰησοῦς.
- source_word: οἱ ἀδελφοὶ αὐτῶν
  choice: со своими братьями
  rationale: Сохранён мужской род и родственное обозначение исходного текста без замены на более широкое толкование.
- source_word: οἱ ἱερεῖς οἱ Λευεῖται
  choice: священниками, левитами
  rationale: Перечислительная передача сохраняет различимость названных служителей и не превращает выражение в составной титул.
- source_word: πάντες οἱ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  choice: всеми, кто пришёл из плена
  rationale: «Из плена» непосредственно передаёт конкретный смысл αἰχμαλωσία; вариант «вернулся из изгнания» был бы более истолковывающим.
- source_word: ἤρξαντο
  choice: начали
  rationale: 'Сохранена незавершённость конструкции: содержание начатого раскрывается в продолжающемся повествовании.'
theological_decisions:
- issue: Значение культового обозначения τὸ ἱερὸν τοῦ θεοῦ в рассказе о восстановлении
  choice: храм Божий
  alternative: святилище Божье; храмовый комплекс Бога
  rationale: «Храм» естественен в современном русском и сохраняет достаточно широкий смысл; примечание предупреждает, что греческое слово может охватывать весь священный комплекс.
- issue: Обозначение группы οἱ ἀδελφοὶ αὐτῶν
  choice: их братья
  alternative: их соплеменники; их собратья
  rationale: Буквальное родственное обозначение не устраняет возможный более широкий групповой смысл, но и не навязывает его.
- issue: Соотношение священников и левитов в οἱ ἱερεῖς οἱ Λευεῖται
  choice: священники, левиты
  alternative: священники-левиты
  rationale: Пунктуационно-перечислительная передача следует контексту групп участников, не утверждая спорного составного титула.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественной библейской интонацией. Синтаксис сохраняет связь с последующим стихом: глагол «начали» намеренно оставлен без дополнения, как и в греческом тексте. Все имена даны в устоявшихся русских библейских формах.'
