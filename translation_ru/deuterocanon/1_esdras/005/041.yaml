base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/041.yaml
  text: 'All these were Israelites[a], from twelve years old and upward, apart from male and female servants: forty-two thousand three hundred sixty. Their male and female servants were seven thousand three hundred thirty-seven[b]; and the singers and songstresses were two hundred forty-five.'
translation:
  language: ru
  text: Всего израильтян в возрасте от двенадцати лет и старше, не считая слуг и служанок[a], было сорок две тысячи триста шестьдесят. Их слуг и служанок было семь тысяч триста тридцать семь, а певцов и певиц[b] — двести сорок пять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабов и рабынь». Греческие слова могут также означать «мальчиков и девочек», однако здесь, вероятнее всего, речь идёт о домашних слугах зависимого положения.'
    reason: lexical_alternative
  - marker: b
    text: Греческий текст различает две группы певцов, по-видимому мужчин и женщин.
    reason: lexical_clarification
lexical_decisions:
- source_word: Οἱ δὲ πάντες ἦσαν Ἰσραήλ
  choice: Всего израильтян ... было
  rationale: Греческое выражение буквально означает «все были Израиль», но в перечне оно подводит итог числу принадлежащих к Израилю. Русская формулировка передаёт это естественно и сохраняет указание на общность Израиля.
- source_word: ἀπὸ δωδεκαετοῦς
  choice: в возрасте от двенадцати лет и старше
  rationale: Оборот задаёт нижнюю возрастную границу подсчёта; «и старше» ясно выражает включающий смысл.
- source_word: χωρὶς παίδων καὶ παιδισκῶν
  choice: не считая слуг и служанок[a]
  rationale: παῖδες и παιδίσκαι могут обозначать детей, прислугу или рабов и рабынь. Отдельно приведённое далее число этих людей в переписном контексте лучше всего согласуется со значением домашних слуг зависимого положения; неоднозначность отмечена в сноске.
- source_word: μυριάδες τέσσαρες δισχίλιοι τριακόσιοι ἑξήκοντα
  choice: сорок две тысячи триста шестьдесят
  rationale: Точная передача числительного словами в соответствии с достоинством библейского текста.
- source_word: παῖδες τούτων καὶ παιδίσκαι
  choice: Их слуг и служанок
  rationale: τούτων передано притяжательным «их», а гендерно различённая пара сохранена как «слуги и служанки».
- source_word: ἑπτακισχίλιοι τριακόσιοι τριάκοντα ἑπτά
  choice: семь тысяч триста тридцать семь
  rationale: Прямая передача числительного.
- source_word: ψάλται καὶ ψαλτῳδοί
  choice: певцов и певиц[b]
  rationale: Русские формы естественно сохраняют различение двух названных в греческом групп, вероятнее всего мужской и женской.
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: двести сорок пять
  rationale: Прямая передача числительного.
theological_decisions:
- issue: Выражение общинной идентичности ἦσαν Ἰσραήλ
  choice: израильтян
  alternative: были Израилем
  rationale: Контекст перечисления требует обозначения людей, принадлежащих к общине Израиля. «Израильтяне» звучит по-русски естественно, не устраняя заложенную в выражении общинно-заветную идентичность.
- issue: Социальный статус, обозначенный словами παῖδες / παιδίσκαι
  choice: слуги и служанки
  alternative: рабы и рабыни; мальчики и девочки
  rationale: Греческие слова допускают несколько значений. Переписной контекст и отдельный итог для этой группы указывают на домашних зависимых; основной текст не делает правовой статус точнее, чем позволяет контекст, а более жёсткий вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Числа даны словами; синтаксис переписного итога упрощён без потери содержания. Гендерные пары исходного текста сохранены.
