base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/015.yaml
  text: The sons of Azeir Ezekias[a], the sons of Keilan and Azetas, sixty-seven; the sons of Azaros, four hundred thirty-two.
translation:
  language: ru
  text: Сыновья Азира Езекиина[a], сыновья Килана и Азеты — шестьдесят семь; сыновья Азара — четыреста тридцать два.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческие имена и числа в этом стихе заметно отличаются от приблизительного масоретского параллельного места, где в соответствующей части списка сказано: «сыновья Адина — четыреста пятьдесят четыре». Поскольку в 1 Ездры списки возвратившихся нередко расположены или оформлены иначе, здесь сохранено греческое чтение без согласования с еврейским параллельным текстом.'
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В переписном перечне это родовая формула. «Сыновья» сохраняет структуру греческого текста и не вводит толкование «потомки» или «члены рода».
- source_word: Ἀζὴρ Ἐζεκίου
  choice: Азира Езекиина
  rationale: Форма передаёт греческую конструкцию как «Азир, принадлежащий Езекии / сын Езекии», не отождествляя имя с отличающимся масоретским параллельным чтением. Родительный Ἐζεκίου естественно передан русской притяжательной формой «Езекиина» при сохранении возможной генеалогической связи.
- source_word: Κειλὰν
  choice: Килана
  rationale: Имя транслитерировано непосредственно с греческого и поставлено в родительный падеж после «сыновья».
- source_word: Ἀζητάς
  choice: Азеты
  rationale: Греческое имя сохранено без гармонизации с еврейским параллельным перечнем; по синтаксису передано родительным падежом.
- source_word: ἐξήκοντα ἑπτά
  choice: шестьдесят семь
  rationale: Точное число передано словами в соответствии с литературным оформлением перечня.
- source_word: Ἀζάρου
  choice: Азара
  rationale: Греческая форма имени передана русской транслитерацией и не заменена именем из приблизительного масоретского параллельного места.
- source_word: τετρακόσιοι τριάκοντα δύο
  choice: четыреста тридцать два
  rationale: Точное число переведено прямо и естественно по-русски.
