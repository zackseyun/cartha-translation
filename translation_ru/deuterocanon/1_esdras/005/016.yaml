lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В перечне переселенцев слово обозначает потомков, род или семейство названного предка; буквальное «сыновья» сохраняет форму греческого текста и естественно для библейской родословной.
- source_word: Ἀννείς
  choice: Аннеис
  rationale: Имя передано по греческой форме, без согласования с отличающимся еврейским параллельным текстом; после «сыновья» употреблён родительный падеж «Аннеиса».
- source_word: ἑκατὸν εἷς
  choice: сто один
  rationale: Прямая передача количественного числительного современным русским языком.
- source_word: Ἀρόμ
  choice: Аром
  rationale: Сохранена греческая форма собственного имени; после «сыновья» в тексте стоит родительный падеж «Арома».
- source_word: Βασσαί
  choice: Вассай
  rationale: Транслитерация исходит из греческого Βασσαί и не заменяется еврейской формой Бецай; в основном тексте употреблён родительный падеж «Вассая».
- source_word: τριακόσιοι εἴκοσι τρεῖς
  choice: триста двадцать три
  rationale: Точная и естественная передача греческого числительного.
- source_word: Ἀρσειφουρείθ
  choice: Арсейфурейф
  rationale: Близкая к греческому написанию русская передача неясного имени с традиционным соответствием θ → ф; после «сыновья» употреблён родительный падеж «Арсейфурейфа». Возможная связь с именем Хариф вынесена в примечание.
