base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/029.yaml
  text: 'the sons of Tobeis[a], altogether one hundred thirty-nine; the temple servants: the sons of Esau, the sons of Taseipha, the sons of Tabaoth, the sons of Keras, the sons of Soua, the sons of Phalaiou, the sons of Labana[c][b],'
translation:
  language: ru
  text: 'сыновья Товииса — всего сто тридцать девять; храмовые рабы[a]: сыновья Исава, сыновья Тасифы, сыновья Таваофа, сыновья Кираса, сыновья Суа, сыновья Фалая, сыновья Лабаны[b][c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое ἱερόδουλοι можно передать и как «храмовые служители». Перевод «храмовые рабы» сохраняет указание на их подневольный статус.
    reason: lexical_alternative
  - marker: b
    text: В источнике это часть перечня, заканчивающаяся запятой; перечисление храмовых рабов продолжается в следующем стихе.
    reason: cross_reference
  - marker: c
    text: 'Приведённый еврейский параллельный текст Неемии 7:43 здесь не совпадает с греческим текстом словесно: в этом месте 1 Ездры содержит другой раздел списка возвратившихся.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: Сохранена повторяющаяся родословная формула переписного списка; здесь она может обозначать также потомков или членов рода.
- source_word: Τωβείς
  choice: Товиис
  rationale: Имя передано близко к греческой форме; в сочетании «сыновья Товииса» оно поставлено в естественный для русского языка родительный падеж.
- source_word: πάντες
  choice: всего
  rationale: В переписном контексте естественно передаёт итоговое, суммирующее значение слова.
- source_word: ἑκατὸν τριάκοντα ἐννέα
  choice: сто тридцать девять
  rationale: Точно сохраняет указанное в греческом тексте число.
- source_word: οἱ ἱερόδουλοι
  choice: храмовые рабы
  rationale: Передаёт как связь этих людей с храмом, так и выраженный компонент подневольного статуса; более мягкий вариант «храмовые служители» мог бы его затушевать.
- source_word: Ἠσαύ
  choice: Исав
  rationale: Использована закрепившаяся в русском библейском употреблении форма имени.
- source_word: Τασειφά
  choice: Тасифа
  rationale: Редкое имя передано близкой и удобочитаемой русской транслитерацией греческой формы.
- source_word: Ταβαώθ
  choice: Таваоф
  rationale: Сохранена греческая форма имени без подмены предположительной семитской реконструкцией.
- source_word: Κηράς
  choice: Кирас
  rationale: Транслитерация отражает греческие κ и η и позволяет отличить редкое имя от более знакомых имён.
- source_word: Σουά
  choice: Суа
  rationale: Близкая транслитерация греческой формы без внесения неявной в ней семитской шипящей.
- source_word: Φαλαίου
  choice: Фалай
  rationale: Редкое имя передано с учётом греческой формы родительного падежа Φαλαίου; русская форма «Фалай» позволяет естественно образовать «Фалая».
- source_word: Λαβανά
  choice: Лаван
  rationale: Форма передана как имя «Лаван», которое в русском сочетании закономерно принимает родительный падеж «Лавана»; это не меняет состава греческого списка.
theological_decisions:
- issue: Передача социального статуса, выраженного словом ἱερόδουλοι
  choice: храмовые рабы
  alternative: храмовые служители
  rationale: Слово обозначает людей, находящихся в подневольном положении при храме. Выбранный вариант не скрывает этот социальный компонент, а определение «храмовые» указывает на сферу их службы.
- issue: Соотношение греческого текста с приблизительным масоретским параллельным местом
  choice: перевести данный греческий список без замены его содержанием MT
  alternative: вставить сведения о левитах, Иисусе, Кадмииле и потомках Годавии из приведённого еврейского параллельного текста
  rationale: Еврейский фрагмент здесь не является словесной параллелью и сообщает иной материал; для 1 Ездры первичным свидетельством в данном задании остаётся греческий текст.
