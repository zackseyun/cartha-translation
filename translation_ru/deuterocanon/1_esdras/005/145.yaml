- from: И встал Иисус[a], сын Иоседека, вместе со своими братьями-священниками, и Зоровавель, сын Салафиила[b], вместе со своими братьями, и они приготовили жертвенник Бога Израиля.
  to: Поднявшись, Иешуа[a], сын Иоседека, вместе со своими братьями — священниками, и Зоровавель, сын Салафиила[b], вместе со своими братьями приготовили жертвенник Бога Израиля.
  rationale: Правка устраняет русскую синтаксическую шероховатость, не уточняя характер действия сверх καταστάς («поднявшись»). Историческая форма «Иешуа» согласована с контекстом и английским audit trail; обе сноски привязаны непосредственно к соответствующим именам.
