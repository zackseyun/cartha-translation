  yaml_path: translation/deuterocanon/1_esdras/005/145.yaml
  text: And Jeshua son of Josedec arose[a], with his brothers the priests, and Zerubbabel son of Salathiel, with his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: ru
  text: Поднявшись, Иешуа[a], сын Иоседека, вместе со своими братьями — священниками, и Зоровавель, сын Салафиила[b], вместе со своими братьями приготовили жертвенник Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. Ἰησοῦς. В этом послепленном контексте имя обычно передаётся как «Иешуа»; в русской традиции встречается и форма «Иисус».
    reason: lexical_alternative
  - marker: b
    text: Греч. Σαλαθιήλ; соответствующая еврейская форма имени нередко передаётся как «Шеалтиил».
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστὰς
  choice: встал
  rationale: Аористное причастие передаёт переход к решительному действию. «Встал» естественно сохраняет повествовательную динамику и не добавляет более узкого смысла вроде «занял должность».
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Это прямая и традиционная русская передача греческой формы Ἰησοῦς. Контекст однозначно указывает на послепленного первосвященника, а не на Иисуса Христа или Иисуса Навина.
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: сын Иоседека
  rationale: Греческая родительная конструкция указывает на происхождение; в современном русском её естественно передать словом «сын».
- source_word: οἱ ἀδελφοὶ αὐτοῦ οἱ ἱερεῖς
  choice: свои братья-священники
  rationale: Сохраняется семейное обозначение ἀδελφοί и приложение οἱ ἱερεῖς. Дефисное сочетание ясно показывает, что братья были священниками.
- source_word: Ζοροβαβὲλ
  choice: Зоровавель
  rationale: Устоявшаяся русская библейская форма имени послепленного вождя.
- source_word: ὁ τοῦ Σαλαθιὴλ
  choice: сын Салафиила
  rationale: Филиальная конструкция передана явно, а имя — в принятой русской форме, соответствующей греческому Σαλαθιήλ.
- source_word: ἡτοίμασαν
  choice: приготовили
  rationale: Глагол означает «подготовили, сделали готовым». «Приготовили» сохраняет широкое значение и не уточняет без достаточных оснований, был ли жертвенник построен, восстановлен или установлен.
- source_word: τὸ θυσιαστήριον
  choice: жертвенник
  rationale: Традиционный и точный русский эквивалент греческого обозначения алтаря для жертвоприношений.
- source_word: τοῦ θεοῦ Ἰσραήλ
  choice: Бога Израиля
  rationale: Родительный падеж сохраняет греческую конструкцию принадлежности или посвящения, не сводя её исключительно к целевому значению «для Бога».
theological_decisions:
- issue: Передача ἀδελφοί в отношении священнической и семейной группы
  choice: братья
  alternative: родственники; соплеменники; собратья
  rationale: В греческом употреблено прямое мужское родственное обозначение. Контекст допускает более широкую связь внутри рода или группы, но не требует её; поэтому исходная семейная формулировка сохранена.
- issue: Форма имени Ἰησοῦς в послепленном контексте
  choice: Иисус
  alternative: Иешуа; Иисус Навин
  rationale: Русская форма «Иисус» непосредственно соответствует греческому написанию и традиционно употребляется для этого лица как «Иисус, сын Иоседека». Сноска предупреждает, что одна и та же греческая форма может соответствовать разным русским формам имени в зависимости от контекста.
- issue: Характер действия над жертвенником
  choice: приготовили
  alternative: поставили; соорудили; восстановили
  rationale: Греческое ἡτοίμασαν не определяет точный вид практической работы. Нейтральный перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Имена даны в устоявшихся русских библейских формах; синтаксис упрощён для ясности, но последовательность участников и общий греческий строй сохранены. Маркеры сносок размещены непосредственно после относящихся к ним имён.
