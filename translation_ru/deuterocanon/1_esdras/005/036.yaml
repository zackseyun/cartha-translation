  yaml_path: translation/deuterocanon/1_esdras/005/036.yaml
  text: These were the ones who came up from Thermeleth and Thelersas, with Charaathalan and Allar leading them.
translation:
  language: ru
  text: Вот те, кто пришли из Фермелефа и Фелерсаса; их возглавляли Хараафалан и Аллар.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβάντες
  choice: пришёл
  rationale: В контексте возвращения употреблено естественное русское «пришёл»; буквальное «взошёл» здесь звучало бы неясно. Единственное число согласовано с собирательным оборотом «те, кто».
- source_word: ἡγούμενος αὐτῶν
  choice: во главе их были
  rationale: Передаёт значение руководства и сохраняет связь местоимения с названной группой; множественное число обусловлено двумя следующими именами.
- source_word: Θερμέλεθ καὶ Θελερσάς
  choice: Фермелефа и Фелерсаса
  rationale: Имена транслитерированы непосредственно с греческого текста с традиционной передачей θ через «ф».
- source_word: Χαρααθαλὰν καὶ Ἀλλάρ
  choice: Хараафалан и Аллар
  rationale: Транслитерация следует греческому свидетельству, которое является основным источником данного стиха.
