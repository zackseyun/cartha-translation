base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/060.yaml
  text: And from the priests[a], the Levites, and the heads of their ancestral houses came the elders who had seen the former house, and at the building of this one they cried out with a loud cry and great weeping[b],
translation:
  language: ru
  text: И пришли старейшины из числа священников, левитов и глав своих родов — те, кто видел прежний дом[a]. При строительстве этого дома они громко кричали и много плакали[b],
