lexical_decisions:
- source_word: προκαθημένων κατὰ τὰς πατριὰς αὐτῶν
  choice: глав своих родов
  rationale: Причастие обозначает тех, кто стоит во главе или председательствует, а πατριαί — родовые объединения по отцовской линии. «Глав своих родов» естественно передаёт общественное положение и родовую структуру.
- source_word: οἱ πρεσβύτεροι
  choice: старейшины
  rationale: Слово может указывать как на преклонный возраст, так и на общественный статус. «Старейшины» сохраняет обе смысловые стороны.
- source_word: ἑωρακότες
  choice: те, кто видел
  rationale: 'Перфектное причастие указывает на прежний личный опыт, значимый в описываемый момент: эти люди были очевидцами прежнего храма.'
- source_word: τὸν πρὸ τοῦ οἶκον
  choice: прежний дом
  rationale: Сохранён буквальный храмовый образ «дома», а определение «прежний» ясно выражает временное противопоставление.
- source_word: πρὸς τὴν τούτου οἰκοδομήν
  choice: при строительстве этого дома
  rationale: Греческое выражение сжато связывает их реакцию со строительством нынешнего святилища. Русская формулировка передаёт эту связь без уточнения стадии работ.
- source_word: μετὰ κραυγῆς καὶ κλαυθμοῦ μεγάλου
  choice: громко взывали и горько плакали
  rationale: Переданы оба явно названных проявления — громкий возглас и плач. Глагольная конструкция звучит по-русски естественнее буквального сочетания отвлечённых существительных.
theological_decisions:
- issue: Храм назван «домом»
  choice: сохранить слово «дом» в основном тексте
  alternative: перевести как «храм»
  rationale: Греческий текст намеренно сопоставляет «прежний дом» с сооружаемым «этим»; сохранение храмовой метафоры не снимает образность оригинала.
- issue: Характер громких возгласов
  choice: не определять их как исключительно скорбные или радостные
  alternative: передать как вопль скорби
  rationale: Хотя плач явно выражает скорбь, κραυγή само по себе означает громкий крик или возглас. Перевод сохраняет эмоциональную напряжённость, не добавляя отсутствующей квалификации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Порядок слов перестроен ради ясности, но перечисление общественных групп и контраст двух храмов сохранены. Конечная запятая оставлена, поскольку стих синтаксически продолжается в следующем контексте.
