base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/012.yaml
  text: the sons of Iolamus[a], two; the sons of Zatou, nine hundred seventy; the sons of Chorbe, seven hundred five; the sons of Banei, six hundred forty-eight[c][b];
translation:
  language: ru
  text: сыновья Иолама — двое; сыновья Зату[a] — девятьсот семьдесят; сыновья Хорве[b] — семьсот пять; сыновья Ванея[c] — шестьсот сорок восемь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — Ζατοῦ (Зату); в параллельной еврейской традиции — Затту.
    reason: alternative_reading
  - marker: b
    text: Соотношение греческого имени Χορβέ (Хорве) с именами в параллельных еврейских списках неясно; в некоторых параллельных перечнях здесь стоит другое родовое имя.
    reason: textual_variant
  - marker: c
    text: В греческом тексте — Βανεί (Ваней); в параллельном еврейском тексте — Бани, причём там указано другое число.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В перечне вернувшихся это родовая формула, обозначающая потомков или членов рода; буквальное «сыновья» сохраняет форму греческого текста и естественно для библейского списка.
- source_word: Ἰωλάμου
  choice: Иолама
  rationale: Имя передано по греческой форме Ἰωλάμου с русским падежным оформлением после слова «сыновья».
- source_word: δύο
  choice: двое
  rationale: Собирательное числительное естественно относится к лицам мужского пола и точно передаёт число.
- source_word: Ζατοῦ
  choice: Зату
  rationale: Основной текст следует греческому чтению Ζατοῦ; соответствующая еврейская традиция имени Затту отмечена в сноске.
- source_word: ἐννακόσιοι ἑβδομήκοντα
  choice: девятьсот семьдесят
  rationale: Точная передача греческого числительного современным русским языком.
- source_word: Χορβέ
  choice: Хорве
  rationale: Сохранена засвидетельствованная греческая форма без гармонизации с отличающимися параллельными списками.
- source_word: ἑπτακόσιοι πέντε
  choice: семьсот пять
  rationale: Точная и естественная передача числа.
- source_word: Βανεί
  choice: Ванея
  rationale: Греческое Βανεί передано как личное/родовое имя Ваней, поставленное в родительный падеж; параллельная форма Бани и иное число отмечены в сноске.
- source_word: ἑξακόσιοι τεσσεράκοντα ὀκτώ
  choice: шестьсот сорок восемь
  rationale: Точная передача числа, засвидетельствованного в основном греческом источнике.
