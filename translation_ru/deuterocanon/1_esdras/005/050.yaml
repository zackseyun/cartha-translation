base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/050.yaml
  text: And they kept the Feast of Booths[a], as it is commanded in the law, and offered sacrifices day by day, as was fitting.
translation:
  language: ru
  text: И они праздновали праздник Кущей[a], как предписано в законе, и каждый день приносили жертвы, как подобало.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть праздник Шалашей.
    reason: Современное пояснение традиционного названия праздника и лежащего в его основе образа временных жилищ.
lexical_decisions:
- source_word: ἠγάγοσαν
  choice: праздновали
  rationale: Глагол ἄγω в сочетании с названием праздника идиоматически означает справлять или праздновать его; «праздновали» естественно звучит по-русски.
- source_word: τὴν τῆς σκηνοπηγίας ἑορτήν
  choice: праздник Кущей
  rationale: σκηνοπηγία обозначает праздник сооружения кущей. Традиционное русское название узнаваемо и сохраняет конкретный образ временных жилищ.
- source_word: ὡς ἐπιτέτακται
  choice: как предписано
  rationale: Перфект пассивного залога указывает на сохраняющее силу установление; безличная русская конструкция точно и естественно передаёт этот смысл.
- source_word: ἐν τῷ νόμῳ
  choice: в законе
  rationale: Оборот указывает, где содержится предписание. Строчная буква не навязывает понимание слова как формального заглавия.
- source_word: θυσίας
  choice: жертвы
  rationale: θυσία прямо обозначает жертвоприношение; «жертвы» — стандартный и контекстуально точный русский эквивалент.
- source_word: καθ’ ἡμέραν
  choice: каждый день
  rationale: Дистрибутивный оборот подчёркивает повторение действия изо дня в день; «каждый день» передаёт это ясно и естественно.
- source_word: ὡς προσῆκον ἦν
  choice: как подобало
  rationale: Фраза означает то, что было уместно или надлежало делать, не обязательно повторяя оттенок прямого юридического требования, уже выраженный ранее.
theological_decisions:
- issue: Название праздника σκηνοπηγία
  choice: праздник Кущей
  alternative: праздник Шалашей
  rationale: «Праздник Кущей» — укоренившееся русское библейское название, при этом слово «кущи» сохраняет образ временных жилищ. Более прозрачный современный вариант дан в сноске.
- issue: Нормативная сила ὡς προσῆκον ἦν
  choice: как подобало
  alternative: как требовалось
  rationale: Выбранный вариант сохраняет смысл должного и уместного, не усиливая выражение до однозначного юридического требования; прямое предписание уже обозначено словами ὡς ἐπιτέτακται.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Название «праздник Кущей» сохранено ради узнаваемости, а его значение пояснено в сноске. Синтаксис простой, торжественный, но не архаичный.
