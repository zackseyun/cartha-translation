base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/033.yaml
  text: the sons of Solomon’s servants[a], the sons of Assapheioth, the sons of Phaerida, the sons of Jeelei, the sons of Lozon, the sons of Isdael, the sons of Saphuei,
translation:
  language: ru
  text: сыновья слуг Соломона[a], сыновья Ассафеиофа, сыновья Фареиды, сыновья Иеилея, сыновья Лозона, сыновья Исдаила, сыновья Сафуея,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь приведено несколько родовых имён, заметно отличающихся от приблизительной параллели в масоретском тексте, где перечень короче: «сыновья Гиддела, сыновья Гахара, сыновья Реайи».'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: Сохранена повторяющаяся родословная формула греческого текста. В данном перечне она обозначает принадлежность к роду или дому предка.
- source_word: παίδων Σαλωμών
  choice: слуг Соломона
  rationale: παῖς может означать слугу или раба; в административно-родословном контексте нейтральное «слуг» естественно передаёт название этой группы, не усиливая социально-правовой оттенок без необходимости.
- source_word: Σαλωμών
  choice: Соломона
  rationale: Употреблена общепринятая русская форма имени царя Соломона.
- source_word: Ἀσσαφειώθ
  choice: Ассафеиофа
  rationale: Редкое имя передано непосредственно по греческой форме; окончание родительного падежа обусловлено формулой «сыновья кого».
- source_word: Φαρειδά
  choice: Фареиды
  rationale: Имя транслитерировано с греческого без согласования с отличающимся масоретским параллельным перечнем.
- source_word: Ἰεηλεί
  choice: Иеилея
  rationale: Близкая к греческому написанию русская библейская транскрипция с падежным оформлением.
- source_word: Λοζών
  choice: Лозона
  rationale: Прямая и понятная русская передача греческой формы имени.
- source_word: Ἰσδαήλ
  choice: Исдаила
  rationale: Сохранена отличительная форма греческого свидетеля; имя не заменено более привычным еврейским соответствием.
- source_word: Σαφυεί
  choice: Сафуея
  rationale: Редкое имя передано близко к греческому звучанию и оформлено в родительном падеже.
theological_decisions:
- issue: Соотношение греческого перечня с приблизительной параллелью в масоретском тексте
  choice: Перевести полный перечень имён по греческому тексту как основному свидетелю.
  alternative: 'Согласовать перечень с более кратким масоретским текстом: «сыновья Гиддела, сыновья Гахара, сыновья Реайи».'
  rationale: Для 1 Ездры исходным текстом здесь служит греческий текст Свита. Масоретская параллель существенно отличается и потому отмечается в сноске, но не подменяет греческое чтение.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и ритма древнего родословного перечня. Необычные имена переданы по греческому источнику, без скрытого согласования с масоретской параллелью.
