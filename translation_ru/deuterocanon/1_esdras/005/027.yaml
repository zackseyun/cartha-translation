  rationale: Сохранены повтор греческой формулы и традиционная русская передача имени Ἀσάφ — «Асаф».
- source_word: ἑκατὸν εἴκοσι ὀκτώ
  choice: сто двадцать восемь
  rationale: Числительное передано обычной современной русской формой.
