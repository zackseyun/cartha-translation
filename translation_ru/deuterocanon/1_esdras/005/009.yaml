lexical_decisions:
- source_word: ἀριθμὸς
  choice: число
  rationale: Прямое и естественное обозначение численности в заголовке переписного или родового списка.
- source_word: τῶν ἀπὸ τοῦ ἔθνους
  choice: тех, кто был из народа
  rationale: Передаёт значение принадлежности, выраженное ἀπό с родительным падежом, и сохраняет сжатость греческой формулы, не добавляя отсутствующего в тексте глагола движения.
- source_word: οἱ προηγούμενοι αὐτῶν
  choice: их предводителей
  rationale: Причастие буквально обозначает идущих впереди, но в административном и родовом списке естественно указывает на руководителей или глав.
- source_word: υἱοὶ
  choice: сыновья
  rationale: Сохраняет традиционную библейскую формулу родового списка; здесь слово может охватывать потомков или членов рода.
- source_word: Φορὸς
  choice: Фороса
  rationale: Транслитерация имени по первичному греческому свидетелю; различие с параллельной еврейской традицией не устраняется в основном тексте.
- source_word: ἑβδομήκοντα δύο χιλιάδες
  choice: семьдесят две тысячи
  rationale: Точно передаёт число сохранившегося греческого текста, несмотря на его необычную величину и расхождение с параллельной традицией.
