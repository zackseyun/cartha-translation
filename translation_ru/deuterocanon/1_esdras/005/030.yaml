base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/030.yaml
  text: the sons of Akoud[a], the sons of Outa, the sons of Ketab, the sons of Akkaba, the sons of Sybaei, the sons of Anan, the sons of Koua, the sons of Keddour,
translation:
  language: ru
  text: сыновья Акуда[a], сыновья Уты, сыновья Кетава, сыновья Аккавы, сыновья Сивея, сыновья Анана, сыновья Куа, сыновья Кеддура,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте Неемии 7:45 приведён иной перечень родов привратников, в том числе Шаллума, Атера, Талмона, Аккува, Хатиты и Шовая. В 1 Ездры приведён отличающийся греческий перечень, которому и следует перевод.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: сыновья
  rationale: В родословном перечне это традиционная формула, обозначающая членов рода; повтор сохраняет структуру греческого текста, не заменяя её более толковательным «потомки».
- source_word: Ἀκούδ
  choice: Акуд
  rationale: Прямая передача греческой формы имени с учётом норм русской транслитерации библейских имён.
- source_word: Οὐτά
  choice: Ута
  rationale: Греческое ου естественно передаётся по-русски как «у»; имя не согласуется искусственно с отличающимся еврейским перечнем.
- source_word: Κητάβ
  choice: Кетав
  rationale: Конечная греческая бета передана как «в» согласно обычной русской традиции передачи греческих имён.
- source_word: Ἀκκαβά
  choice: Аккава
  rationale: Сохранено удвоенное κ; β передано как «в» в соответствии с русской традицией.
- source_word: Συβαεί
  choice: Сивей
  rationale: Форма передаёт греческое имя в естественном для русского читателя виде, не подменяя его именем из еврейского параллельного списка.
- source_word: Ἀνάν
  choice: Анан
  rationale: Прямая и естественная русская передача греческой формы.
- source_word: Κουά
  choice: Куа
  rationale: Греческое ου передано как «у», с сохранением раздельного звучания последующего α.
- source_word: Κεδδούρ
  choice: Кеддур
  rationale: Сохранено удвоенное δ, а ου передано русским «у».
theological_decisions:
- issue: Соотношение греческого перечня с приблизительной масоретской параллелью в Неемии 7:45
  choice: Перевести имена по греческому тексту 1 Ездры, не согласуя их с еврейским перечнем.
  alternative: 'Заменить некоторые формы именами из масоретской параллели: Шаллум, Атер, Талмон, Аккув, Хатита и Шовай.'
  rationale: Для этой книги первичным свидетельством служит греческий текст. Еврейская параллель заметно отличается по составу и потому используется лишь для сопоставления, а не для исправления греческого списка.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского родового перечня. Повтор «сыновья» намеренно сохраняет формальную структуру греческого оригинала; имена переданы непосредственно с греческого и не гармонизированы с масоретской параллелью.
