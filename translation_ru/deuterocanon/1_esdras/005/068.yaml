base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/068.yaml
  text: For we alone will build for the Lord of Israel[a], in accordance with what Cyrus king of the Persians commanded us.
translation:
  language: ru
  text: Ведь только мы будем строить для Господа Израиля, согласно тому, что повелел нам Кир, царь персов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς γὰρ μόνοι
  choice: Ведь только мы
  rationale: Сочетание передаёт пояснительное значение γὰρ и подчёркнутую исключительность μόνοι; явное местоимение ἡμεῖς естественно сохраняется.
- source_word: οἰκοδομήσομεν
  choice: будем строить
  rationale: Будущее время глагола οἰκοδομέω передано прямо; значение «восстанавливать» возможно по контексту, но не выражено самим греческим глаголом.
- source_word: τῷ κυρίῳ τοῦ Ἰσραήλ
  choice: для Господа Израиля
  rationale: Дательный обозначает того, для кого возводится храм; титул «Господь Израиля» сохраняет структуру и смысл греческого выражения.
- source_word: ἀκολούθως οἷς προσέταξεν ἡμῖν
  choice: согласно тому, что повелел нам
  rationale: Естественная русская передача наречия соответствия и относительной конструкции без добавления невыраженных деталей.
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: Кир, царь персов
  rationale: Передаёт греческое множественное этническое обозначение Περσῶν точнее, чем вариант «царь Персии», и соответствует современному литературному русскому.
theological_decisions:
- issue: Передача κύριος в божественном титуле
  choice: Господь
  alternative: Владыка
  rationale: В выражении «Господь Израиля» κύριος является божественным титулом; традиционное «Господь» точно и нейтрально в конфессиональном отношении.
- issue: Эксклюзивность строителей
  choice: только мы
  alternative: мы одни
  rationale: Сохраняется прямое утверждение μόνοι о том, что строить будут именно они, без смягчения или богословского истолкования мотива отказа.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис краток и прозрачен; собственное имя и царский титул оформлены естественной пояснительной конструкцией.
