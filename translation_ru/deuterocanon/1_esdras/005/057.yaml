base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/057.yaml
  text: And the priests stood arrayed with musicians and trumpets, and the Levites, the sons of Asaph, had the cymbals, praising the Lord and blessing him according to David king of Israel;
translation:
  language: ru
  text: И священники, облачённые в торжественные одежды, заняли свои места с музыкантами и трубами[a], а левиты, сыновья Асафа, держали кимвалы, воспевая Господа и благословляя Его в соответствии с установлением Давида, царя Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с музыкальными инструментами и трубами» либо «под музыку и звуки труб». Греческое слово может обозначать музыкантов, инструменты или музыкальное сопровождение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по примеру Давида, царя Израиля» или «в соответствии с тем, как поступал Давид, царь Израиля». Греческий оборот не уточняет, идёт ли речь прежде всего о предписании Давида или об установленном им образце исполнения.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησαν
  choice: встали
  rationale: Передаёт совершённое действие и церемониальное занятие места без добавления идеи официального назначения.
- source_word: ἐστολισμένοι
  choice: в облачениях
  rationale: Естественно для храмового контекста и обозначает торжественную одежду, не уточняя её вид сверх греческого текста.
- source_word: μετὰ μουσικῶν καὶ σαλπίγγων
  choice: с музыкантами и трубами[a]
  rationale: Передаёт возможное субстантивированное значение μουσικῶν как исполнителей; сноска сохраняет допустимое понимание как музыкального сопровождения или инструментов.
- source_word: Λευεῖται υἱοὶ Ἀσὰφ
  choice: левиты, сыновья Асафа
  rationale: Сохраняет и культовое обозначение, и родовую либо цеховую принадлежность.
- source_word: ἔχοντες τὰ κύμβαλα
  choice: держали кимвалы
  rationale: Прямо и естественно передаёт наличие инструментов в руках у левитов в ходе богослужения.
- source_word: ὑμνοῦντες τῷ κυρίῳ
  choice: воспевая Господа
  rationale: Глагол указывает на хвалу, выражаемую пением; «воспевать» сохраняет это значение и соответствует возвышенному, но понятному регистру.
- source_word: εὐλογοῦντες
  choice: благословляя Его
  rationale: Сохраняет основное значение глагола; местоимение проясняет подразумеваемый объект — Господа.
- source_word: κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  choice: следуя Давиду, царю Израиля[b]
  rationale: Естественная русская формулировка, сохраняющая общую идею соответствия Давидову примеру или предписанию, не сводя её только к одному из этих оттенков.
theological_decisions:
- issue: Передача κύριος в контексте храмового поклонения Богу Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — традиционное и общепонятное соответствие κύριος в данном библейском контексте; оно не вносит конфессионально специфического толкования.
- issue: Точная сила оборота κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  choice: следуя Давиду, царю Израиля
  alternative: по установлению Давида, царя Израиля; по примеру Давида, царя Израиля
  rationale: Греческий оборот может указывать как на предписание, так и на образец или способ исполнения. Основной текст и сноска сохраняют эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным храмовым регистром. «Облачения», «кимвалы» и «воспевать» сохраняют историко-богослужебный колорит, оставаясь понятными в контексте. Синтаксис сделан плавным, без устранения смысловой открытости греческого текста.
