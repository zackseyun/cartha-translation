  text: the sons of Chadiasai and Ammidioi[a], four hundred twenty-two; the sons of Keiramas Kabbes, six hundred twenty-one[b];
translation:
  language: ru
  text: потомки Хадиасаи и Аммидиои — четыреста двадцать два; выходцы из Кеирамы Каббы[a] — шестьсот двадцать один[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст буквально говорит: «те, кто из Кеирамы Каббы». Сочетание имён необычно и допускает понимание как обозначение места происхождения или родовой принадлежности; союза «и» в греческом нет.'
    reason: alternative_reading
  - marker: b
    text: Еврейский параллельный список в Ездре существенно отличается здесь и именами, и числом. Перевод следует греческому тексту 1 Ездры, не согласуя его с еврейским списком.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ Χαδιάσαι καὶ Ἀμμίδιοι
  choice: потомки Хадиасая и Аммидия
  rationale: В контексте переписного списка артикль с именами обозначает семейные или родовые группы. «Потомки» естественно передаёт подразумеваемую принадлежность, а имена транслитерированы по греческому тексту без согласования с отличающимся еврейским параллельным местом.
- source_word: τετρακόσιοι εἴκοσι δύο
  choice: четыреста двадцать два
  rationale: Прямое соответствие греческому количественному числительному.
- source_word: οἱ ἐκ Κειράμας Κάββης
  choice: выходцы из Кеирамы Каббы[a]
  rationale: 'Предлог ἐκ буквально указывает на происхождение: «из». Сочетание двух имён в греческом тексте не содержит союза и остаётся синтаксически неоднозначным, поэтому оно не преобразовано без оговорки в два отдельных рода или населённых пункта.'
- source_word: ἑξακόσιοι εἴκοσι εἷς
  choice: шестьсот двадцать один
  rationale: Прямое соответствие греческому количественному числительному.
