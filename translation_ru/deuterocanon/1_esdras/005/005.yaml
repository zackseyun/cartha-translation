base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/005.yaml
  text: 'The priests[a], the sons of Phinehas, the sons of Aaron: Jeshua son of Jozadak son of Seraiah, and Joakim son of Zerubbabel son of Shealtiel, from the house of David, from the family line of Perez[b],'
translation:
  language: ru
  text: 'Священники из потомков[a] Финееса, из потомков Аарона: Иешуа[b], сын Иоседека, сына Сераии, и Иоаким, сын Зоровавеля, сына Салафиила, из дома Давида, из рода Фареса,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В родословиях слово, буквально означающее «сыновья», может обозначать и более отдалённых потомков.
    reason: lexical_alternative
  - marker: b
    text: Греческое имя Ἰησοῦς можно передать как «Иисус» или «Иешуа»; здесь речь идёт о священнике Иешуа послепленного времени.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: Священники
  rationale: Определённая форма множественного числа вводит перечисление лиц священнического рода; простое «священники» естественно передаёт функцию выражения.
- source_word: υἱοὶ Φινεὲς υἱοὶ Ἀαρών
  choice: потомки Финееса, потомки Аарона
  rationale: В родословном контексте υἱοί обозначает не только непосредственных сыновей, но и более отдалённых потомков. «Потомки» устраняет ложное впечатление, будто названы прямые сыновья Финееса и Аарона.
- source_word: Ἰησοῦς
  choice: Иешуа
  rationale: Имя относится к послепленному первосвященнику. Форма «Иешуа» уместна в ветхозаветном родословном контексте и не создаёт в современном русском языке ошибочной непосредственной ассоциации с Иисусом Христом.
- source_word: ὁ τοῦ Ἰωσεδὲκ τοῦ Σαραιοῦ
  choice: сын Иоседека, сына Сераии
  rationale: Конструкция с артиклем и последовательными родительными падежами выражает родословную цепочку; добавление слова «сын» делает её ясной по-русски, не утверждая большей точности родства, чем допускает контекст.
- source_word: Ἰωακεὶμ ὁ τοῦ Ζοροβαβὲλ τοῦ Σαλαθιὴλ
  choice: Иоаким, сын Зоровавеля, сына Салафиила
  rationale: Сохранена греческая форма имени Иоаким и явно передана родословная цепочка, подразумеваемая генитивной конструкцией.
- source_word: ἐκ τοῦ οἴκου τοῦ Δαυείδ
  choice: из дома Давида
  rationale: В родословно-династическом контексте οἶκος означает дом или династию; традиционное выражение «дом Давида» точно и естественно.
- source_word: ἐκ τῆς γενεᾶς Φάρες
  choice: из рода Фареса
  rationale: γενεά здесь указывает на происхождение и родовую линию, а не на современное поколение; «род» кратко и ясно передаёт этот смысл.
theological_decisions:
- issue: Степень родства в родословных обозначениях
  choice: В обобщающих формулах употреблено «потомки», а генитивные цепочки переданы словом «сын» с пояснением об их родословном характере.
  alternative: Везде буквально повторить «сыновья/сын», что могло бы быть понято исключительно как непосредственное отцовство.
  rationale: Так сохраняются и форма родословной, и присущая древнему словоупотреблению возможность пропуска поколений, без искусственного уточнения точной степени родства.
- issue: Передача имени Ἰησοῦς
  choice: Иешуа
  alternative: Иисус или Иисус Навин
  rationale: Речь идёт о послепленном священнике, а не об Иисусе Христе и не об Иисусе Навине. Выбранная форма различает носителей имени, не вводя христологического отождествления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского родословного перечня. Имена переданы в узнаваемых русских библейских формах; пунктуация сохраняет незавершённость исходного фрагмента, который продолжается далее.
