  text: 'All the temple servants and the sons of Solomon’s servants: three hundred seventy-two[a].'
translation:
  language: ru
  text: Всего храмовых служителей и сыновей слуг Соломона — триста семьдесят два[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храмовых рабов и сыновей рабов Соломона»; греческие слова обозначают зависимое служение и могут подразумевать рабское положение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Всего
  rationale: В перечне слово подводит общий итог названным группам; русское «всего» естественно вводит суммарное число.
- source_word: ἱερόδουλοι
  choice: храмовых служителей
  rationale: Сложное слово обозначает людей, состоявших на службе при храме. «Храмовые служители» ясно передаёт их функцию, не исключая зависимого положения, отмеченного в сноске.
- source_word: υἱοὶ τῶν παίδων Σαλωμών
  choice: сыновей слуг Соломона
  rationale: «Сыновья» сохраняет форму родословно-административного наименования; παῖδες здесь может означать слуг или рабов, поэтому в основном тексте выбрано менее однозначное «слуги».
- source_word: τριακόσιοι ἑβδομήκοντα δύο
  choice: триста семьдесят два
  rationale: Прямая передача количественного числительного современными русскими словами.
theological_decisions:
- issue: Передача обозначений зависимого служения в переписном перечне
  choice: «храмовые служители» и «слуги Соломона» в основном тексте
  alternative: «храмовые рабы» и «рабы Соломона»
  rationale: Греческие слова допускают значение рабского или иного зависимого положения, однако стих прежде всего сообщает административный итог. Основной вариант не усиливает социально-правовой оттенок сверх контекста, а более сильное значение сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая форма административного перечня сохранена. Тире естественно отделяет перечисленные группы от их общего числа.
