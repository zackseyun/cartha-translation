base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/058.yaml
  text: And they cried out with hymns[a], blessing the Lord, because his goodness and his glory are forever for all Israel.
translation:
  language: ru
  text: 'И они гимнами громко возгласили, благословляя Господа: «Ибо Его благость и Его слава — навеки для всего Израиля».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησαν
  choice: громко возгласили
  rationale: Глагол обозначает звучание поднятого голоса; сочетание сохраняет публичный и торжественный характер возгласа, не сводя его просто к пению.
- source_word: δι’ ὕμνων
  choice: в гимнах
  rationale: διά с родительным выражает средство; «в гимнах» естественно по-русски передаёт то, что возглас был облечён в форму гимнов.
- source_word: εὐλογοῦντες
  choice: благословляя
  rationale: Прямой эквивалент причастия, сохраняющий библейский смысл благословения Бога и не заменяющий его более общим «восхваляя».
- source_word: τῷ κυρίῳ
  choice: Господа
  rationale: Дательный при εὐλογοῦντες по-русски естественно передаётся винительным; «Господь» — устойчивое соответствие κύριος в данном греческом богослужебном контексте.
- source_word: χρηστότης
  choice: благость
  rationale: Слово выражает благую, милостивую природу и действие Господа; «благость» точно и уместно в торжественной библейской речи.
- source_word: δόξα
  choice: слава
  rationale: Стандартное и семантически точное библейское соответствие.
- source_word: εἰς τοὺς αἰῶνας
  choice: навеки
  rationale: Идиоматично передаёт продолжительность «во веки» без добавления отсутствующего в греческом глагола «пребывает».
- source_word: παντὶ Ἰσραήλ
  choice: для всего Израиля
  rationale: Дательный в сжатой безглагольной формуле допускает отношение благости и славы ко всему Израилю; «для» естественно по-русски и не навязывает пространственного образа «над/на».
theological_decisions:
- issue: Передача κύριος в греческом девтероканоническом богослужебном тексте
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Исходный греческий текст содержит κύριος, а не непосредственно засвидетельствованный здесь тетраграмматон; обычное «Господь» наиболее точно следует источнику.
- issue: Восполнение сказуемого в эллиптической формуле ὅτι ἡ χρηστότης αὐτοῦ καὶ ἡ δόξα εἰς τοὺς αἰῶνας παντὶ Ἰσραήλ
  choice: тире перед «навеки» без добавленного смыслового глагола
  alternative: «Его благость и слава пребывают навеки для всего Израиля»
  rationale: Греческая фраза безглагольна и сжата. Тире создаёт полноценную русскую конструкцию, сохраняя неопределённость относительно подразумеваемого глагола и не внося идею «пребывания» сверх текста.
translation_notes:
  register: Современный литературный русский с достоинством богослужебного повествования. «Громко возгласили» передаёт силу голоса, «в гимнах» звучит естественно, а «благость» и «навеки» сохраняют узнаваемый библейский регистр. Прямая речь оформлена двоеточием и кавычками как содержание благословения.
