lexical_decisions:
- source_word: ἀπῆραν
  choice: выступили
  rationale: В военном контексте передаёт начало движения войска естественным современным русским языком.
- source_word: σὺν πάσῃ τῇ δυνάμει αὐτῶν
  choice: со всем своим войском
  rationale: δύναμις здесь означает совокупность вооружённых сил, а не отвлечённую «силу».
- source_word: παρεβάλον
  choice: расположились станом
  rationale: Военное значение глагола — разбить или расположить лагерь; выбран dignified, понятный русский оборот.
- source_word: Ἀμμαοῦν
  choice: Аммауса
  rationale: Передаёт форму греческого источника как «Аммаус», не заменяя её более привычным вариантом «Эммаус».
- source_word: ἐν τῇ γῇ τῇ πεδινῇ
  choice: в равнинной земле
  rationale: Сохраняет указание на географический характер области и близко следует структуре греческого текста.
