lexical_decisions:
- source_word: ὡς δʼ ἂν ᾖ
  choice: Но какова бы ни была
  rationale: Частица δέ передана как «но», а сочетание ὡς ἂν с сослагательным наклонением — оборотом «какова бы ни была», сохраняющим сравнительное и неопределённое значение.
- source_word: θέλημα
  choice: воля
  rationale: «Воля» естественно передаёт намерение или изволение, не сужая значение до желания либо заранее определённого замысла.
- source_word: ἐν οὐρανῷ
  choice: на небе
  rationale: Сохранены единственное число и пространственная формулировка греческого текста; метонимическое «воля Небес» не вводится.
- source_word: οὕτως
  choice: так
  rationale: «Так» образует естественную русскую соотносительную конструкцию с начальным «какова».
- source_word: ποιήσει
  choice: Он и поступит
  rationale: Глагол передан лично и активно. «Поступит» в данном контексте естественнее буквального «сделает» без названного дополнения, а частица «и» подчёркивает соотнесённость с «так».
theological_decisions:
- issue: Неявный субъект ποιήσει
  choice: Он и поступит
  alternative: так и будет сделано
  rationale: В греческом стоит активная форма третьего лица единственного числа с подразумеваемым личным субъектом, а не безличный пассив. Местоимение написано с прописной буквы, поскольку контекст и «воля на небе» указывают на Бога, однако имя в текст не добавлено.
- issue: Чья именно «воля»
  choice: воля на небе
  alternative: Его воля на небе
  rationale: При θέλημα нет притяжательного местоимения. Перевод сохраняет эту сжатость и не делает подразумеваемую связь грамматически явной.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной интонацией. Синтаксический параллелизм греческого «как… так…» сохранён; формулировка не устраняет присущую оригиналу неопределённость.
