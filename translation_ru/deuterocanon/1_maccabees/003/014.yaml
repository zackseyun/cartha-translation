  yaml_path: translation/deuterocanon/1_maccabees/003/014.yaml
  text: And he said[a], “I will make a name for myself, and I will be glorified in the kingdom[c][b], and I will fight Judah and those with him who are disregarding the king’s word.”
translation:
  language: ru
  text: 'И он сказал: «Я создам себе имя и прославлюсь в царстве; я буду воевать с Иудой[a] и с теми, кто с ним и кто пренебрегает[b] словом царя[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь об Иуде Маккавее.
    reason: identification
  - marker: b
    text: 'Или: «презирает», «ни во что не ставит».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «приказом царя», «указом царя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσω ἐμαυτῷ ὄνομα
  choice: Я создам себе имя
  rationale: Сохраняет греческий образ и естественно передаёт намерение приобрести известность и славу.
- source_word: δοξασθήσομαι
  choice: прославлюсь
  rationale: Передаёт будущее пассивной формы естественным русским возвратным глаголом, сохраняя значение обретения славы.
- source_word: ἐν τῇ βασιλείᾳ
  choice: в царстве
  rationale: Прямой и сдержанный перевод βασιλεία; дополнение «царя» в греческом отсутствует.
- source_word: πολεμήσω τὸν Ἰούδαν
  choice: я буду воевать с Иудой
  rationale: Естественная русская конструкция для военного выступления против названного лица.
- source_word: τοὺς σὺν αὐτῷ
  choice: с теми, кто с ним
  rationale: Сохраняет неопределённое обозначение сторонников Иуды, не уточняя их роль сверх текста.
- source_word: τοὺς ἐξουθενοῦντας
  choice: кто пренебрегает
  rationale: Передаёт сознательное и презрительное отвержение; более сильный оттенок «презирает» отмечен в сноске.
- source_word: τὸν λόγον τοῦ βασιλέως
  choice: словом царя
  rationale: Сохраняет основное значение λόγος и присущую выражению неоднозначность между словом, приказом и указом.
theological_decisions:
- issue: Идентификация Ἰούδαν
  choice: Личное имя «Иуда», относящееся к Иуде Маккавею
  alternative: Транслитерация «Иудас»
  rationale: Контекст однозначно указывает на предводителя Маккавеев; традиционная и естественная русская форма его имени — «Иуда».
- issue: Характер «слова царя»
  choice: Сохранено буквальное «слово царя»
  alternative: «приказ царя» или «указ царя»
  rationale: λόγος в данном контексте, вероятно, означает властное распоряжение, однако греческий текст использует более широкое слово; перевод не должен без необходимости устранять эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным историческим звучанием. Синтаксис остаётся ясным; повтор «кто» помогает точно связать причастный оборот с людьми, находящимися вместе с Иудой.
