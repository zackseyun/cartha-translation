  yaml_path: translation/deuterocanon/1_maccabees/003/002.yaml
  text: And all his brothers helped him[a], and all who had joined themselves to his father[b], and they fought the war of Israel with gladness.
translation:
  language: ru
  text: Все его братья и все, кто примкнул к его отцу[a], помогали ему и с радостью вели войну Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто связал себя с его отцом», то есть присоединился к Маттафии и поддерживал его.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вели войну за Израиль». Буквально по-гречески: «воевали войну Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθουν
  choice: помогали
  rationale: Имперфект передаёт продолжавшуюся поддержку; форма «помогали» естественна для русского повествования и сохраняет видовой оттенок.
- source_word: πάντες οἱ ἀδελφοὶ αὐτοῦ
  choice: все его братья
  rationale: Речь идёт о родных братьях Иуды, сыновьях Маттафии; буквальное семейное значение ясно из контекста.
- source_word: ὅσοι ἐκολλήθησαν τῷ πατρὶ αὐτοῦ
  choice: все, кто примкнул к его отцу
  rationale: Глагол κολλάω обозначает тесное присоединение или приверженность. «Примкнул» естественно выражает добровольное присоединение и верность, не добавляя специальных договорных или конфессиональных смыслов.
- source_word: ἐπολέμουν τὸν πόλεμον
  choice: вели войну
  rationale: Русское «вели войну» естественно передаёт греческую однокоренную конструкцию «воевали войну», избегая неуместной буквальной шероховатости.
- source_word: Ἰσραήλ
  choice: Израиля
  rationale: 'Родительный падеж сохраняет формальную неоднозначность греческого сочетания: это может быть война, принадлежащая Израилю, ведущаяся Израилем или ради Израиля.'
- source_word: μετʼ εὐφροσύνης
  choice: с радостью
  rationale: Предложное сочетание точно и естественно передаёт εὐφροσύνη как радость и охотное участие.
theological_decisions:
- issue: Значение выражения «война Израиля»
  choice: войну Израиля
  alternative: войну за Израиль
  rationale: Основной текст сохраняет неоднозначный родительный падеж оригинала и не превращает военный конфликт в расширенный богословский тезис. В сноске указано естественное контекстуальное понимание «за Израиль».
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Примкнул» передаёт лояльность без архаизации, а выражение «войну Израиля» намеренно сохраняет смысловую напряжённость греческого родительного падежа; его возможное значение пояснено в сноске.
