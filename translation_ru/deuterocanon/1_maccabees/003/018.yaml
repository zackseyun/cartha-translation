base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/018.yaml
  text: And Judas said, “It is easy for many to be shut up into the hands of a few, and in the sight of heaven there is no difference between saving by many or by few.”
translation:
  language: ru
  text: 'И сказал Иуда: «Многим легко оказаться во власти немногих[a], и перед Небом[b] нет разницы, спасать ли через многих или через немногих».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «быть заключёнными в руках немногих»; то есть попасть в окружение и под их власть. Возможный перевод: «быть преданными в руки немногих».'
    reason: lexical_alternative
  - marker: b
    text: '«Небо», вероятно, употреблено здесь как благоговейное обозначение Бога; возможный смысл: «перед Богом».'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὔκοπόν ἐστιν
  choice: легко
  rationale: Безличное выражение означает, что нечто легко или без труда может произойти; краткое «легко» естественно передаёт его силу.
- source_word: συγκλεισθῆναι ... ἐν χερσὶν ὀλίγων
  choice: оказаться во власти немногих
  rationale: Пассивный инфинитив буквально означает «быть запертыми, окружёнными»; в сочетании «в руках немногих» речь идёт о попадании под их власть. Русское выражение передаёт военный контекст без неестественной кальки.
- source_word: πολλοὺς ... ὀλίγων
  choice: многим ... немногих
  rationale: Сохранено центральное противопоставление многочисленных и малочисленных; существительное «людей» в контексте воинов можно не добавлять.
- source_word: διαφορὰ
  choice: разницы
  rationale: Обычное значение в конструкции οὐκ ἔστι διαφορὰ — «нет разницы»; перевод не привносит более узкого смысла «преимущества».
- source_word: ἐναντίον τοῦ οὐρανοῦ
  choice: перед Небом
  rationale: Сохранено прямо названное в греческом тексте «небо», вероятно служащее благоговейным обозначением Бога; «перед» передаёт значение присутствия или суда.
- source_word: σῴζειν
  choice: спасать
  rationale: Глагол может означать спасение или избавление, в том числе победоносное избавление в бою. «Спасать» сохраняет более широкий богословский оттенок и оставляет объект подразумеваемым.
- source_word: ἐν πολλοῖς ἢ ἐν ὀλίγοις
  choice: через многих или через немногих
  rationale: 'Предлог «через» естественно передаёт инструментальное значение: посредством большого или малого числа людей.'
theological_decisions:
- issue: Благоговейное употребление «неба» в выражении ἐναντίον τοῦ οὐρανοῦ
  choice: Сохранить «Небом», не заменяя его словом «Богом»
  alternative: «перед Богом»
  rationale: В греческом тексте прямо стоит «небо», вероятно как благоговейное иносказание о Боге. Основной текст сохраняет эту формулировку и не снимает её намеренную косвенность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой военной речи. Синтаксис сделан естественным для русского, при этом сохранены краткость, контраст «многие — немногие» и богословски значимое слово «Небо».
