  terminology: «Начальник сирийского войска» корректно передаёт военный смысл ἄρχων τῆς δυνάμεως Συρίας без навязывания конкретного звания. «Собрание» для ἐκκλησίαν исторически уместно и не вносит позднего церковного значения. «Верных» обоснованно сохраняет смысловую широту πιστῶν. Сноски точно объясняют допустимые лексические альтернативы; их якоря стоят после соответствующих слов.
