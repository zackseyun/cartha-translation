base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/013.yaml
  text: And Seron[a], the commander of the army of Syria, heard that Judas had gathered a company and an assembly of the faithful with him[b], and of those going out to war.
translation:
  language: ru
  text: И услышал Серон, начальник сирийского войска, что Иуда собрал отряд[a] и собрание верных[b], бывших с ним и выступавших на войну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собранную группу». Греческое слово обозначает собравшуюся группу людей и в данном контексте может иметь военный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Слово «верные» можно также понять как «преданные»: речь может идти как о преданности делу Иуды, так и о верности завету.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямое и естественное соответствие аористу ἀκούω в повествовательном контексте; может подразумевать получение известия.
- source_word: ὁ ἄρχων τῆς δυνάμεως Συρίας
  choice: начальник сирийского войска
  rationale: ἄρχων в данном военном контексте обозначает начальника или военачальника, а δύναμις — войско; русская формулировка естественна и не приписывает Серону конкретного звания.
- source_word: ἤθροισεν
  choice: собрал
  rationale: Передаёт значение сведения людей вместе и сохраняет словесную связь с последующими обозначениями собранных групп.
- source_word: ἄθροισμα
  choice: отряд
  rationale: Существительное обозначает собранную группу людей; военный контекст допускает «отряд», не обязательно подразумевая формально организованное подразделение.
- source_word: ἐκκλησίαν
  choice: собрание
  rationale: В иудейском контексте эпохи Второго храма означает собрание людей; перевод не привносит позднейшего институционально-христианского смысла слова «церковь».
- source_word: πιστῶν
  choice: верных
  rationale: 'Сохраняет двойной оттенок верности: надёжность и преданность делу, а также возможную религиозно-заветную верность.'
- source_word: μεθʼ αὐτοῦ
  choice: бывших с ним
  rationale: Естественно передаёт сопровождение и согласуется с родительным множественного числа πιστῶν.
- source_word: ἐκπορευομένων εἰς πόλεμον
  choice: выступавших на войну
  rationale: Передаёт военное значение выхода или выступления и сохраняет причастную конструкцию исходного текста.
theological_decisions:
- issue: Перевод ἐκκλησίαν в иудейском военно-религиозном контексте
  choice: собрание
  alternative: община; церковь
  rationale: «Собрание» соответствует обычному значению слова в данном историческом контексте и не переносит в текст более позднее христианское институциональное значение.
- issue: Смысл πιστῶν
  choice: верных
  alternative: преданных
  rationale: «Верных» сохраняет присущую греческому слову смысловую широту между преданностью Иуде и религиозной верностью, не разрешая эту неоднозначность односторонне.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное «И» сохранено как повествовательная связка. Формулировка избегает специальных воинских званий и позднейшей христианской терминологии.
