  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: Серон назван военным начальником сирийского войска; Иуда является субъектом «собрал»; сохранены «отряд» и «собрание верных», а также характеристика верных как бывших с Иудой и выступавших на войну. Причастные формы «бывших» и «выступавших» естественно отражают греческие формы родительного множественного числа и не устраняют их связь с «верных».'
