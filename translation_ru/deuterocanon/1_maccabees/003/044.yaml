base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/044.yaml
  text: And the assembly gathered to be ready for war[b][a], and to pray and ask for mercy and compassion.
translation:
  language: ru
  text: И собралась община[a], чтобы приготовиться к войне[b], помолиться и просить милости и сострадания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собрание». Греческое συναγωγή здесь означает собравшееся сообщество, а не здание.'
    reason: lexical_alternative
  - marker: b
    text: 'Более буквально: «была собрана, чтобы быть готовыми к войне». Греческий глагол имеет пассивную форму, а слово «готовыми» стоит во множественном числе и относится к членам общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθροίσθη
  choice: собралась
  rationale: Аорист пассивной формы от ἀθροίζω естественно передаётся по-русски возвратным глаголом «собралась», обозначающим, что община сошлась вместе; более формальное «была собрана» отмечено как возможный вариант.
- source_word: ἡ συναγωγή
  choice: община
  rationale: Здесь συναγωγή обозначает собравшееся сообщество, а не здание и не обязательно позднейший религиозный институт. «Община» сохраняет коллективный и религиозный оттенок без анахронизма.
- source_word: τοῦ εἶναι ἑτοίμους
  choice: чтобы приготовиться
  rationale: Артиклевый инфинитив выражает цель собрания. «Чтобы приготовиться» естественно передаёт целевое значение и подразумевает готовность участников общины.
- source_word: εἰς πόλεμον
  choice: к войне
  rationale: πόλεμος прямо означает «война»; предлог εἰς при выражении подготовки естественно передаётся сочетанием «к войне».
- source_word: τοῦ προσεύξασθαι
  choice: помолиться
  rationale: Второй артиклевый инфинитив параллельно выражает цель. Совершенный вид соответствует разовому действию в рамках собрания.
- source_word: αἰτῆσαι
  choice: просить
  rationale: Глагол означает «просить, испрашивать». «Просить» ясно и естественно сочетается с последующими дополнениями, не добавляя прямо не названного адресата.
- source_word: ἔλεον
  choice: милости
  rationale: «Милость» сохраняет обычный религиозный смысл ἔλεος в контексте молитвенного обращения.
- source_word: οἰκτειρμούς
  choice: сострадания
  rationale: «Сострадание» отличает οἰκτειρμοί от стоящего рядом ἔλεος и естественно образует пару «милость и сострадание».
theological_decisions:
- issue: Передача συναγωγή в историческом контексте Первой книги Маккавейской
  choice: община
  alternative: собрание; синагога
  rationale: Речь идёт о собравшемся народе, готовящемся к войне и молитве. «Община» не сводит слово к зданию или позднейшему установленному институту и сохраняет его общественный характер.
- issue: Неявный адресат просьбы о милости
  choice: не добавлять «у Бога»
  alternative: просить у Бога милости и сострадания
  rationale: Молитвенный контекст ясно подразумевает Бога, однако в греческом тексте адресат после αἰτῆσαι прямо не назван; перевод сохраняет эту формальную невыраженность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным и общепонятным; лексическая пара «милость и сострадание» сохраняет различие двух греческих существительных. Все примечания отмечены в основном тексте.
