translation:
  language: ru
  text: 'И они громко воззвали к небу: «Что нам с ними делать и куда их увести?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куда нам их отвести?» Греческий глагол может особо подчёркивать, что их нужно увести прочь из нынешнего опасного места.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησαν
  choice: воззвали
  rationale: Глагол обозначает сильный, настойчивый крик; «воззвали» естественно передаёт здесь молитвенное обращение и сохраняет возвышенный, но понятный регистр.
- source_word: φωνῇ
  choice: громко
  rationale: Буквально «голосом»; в сочетании с βοάω оборот усиливает звучность возгласа. Наречие «громко» передаёт это по-русски без тяжеловесного «громким голосом».
- source_word: εἰς τὸν οὐρανόν
  choice: к небу
  rationale: Оборот указывает направление обращения. «К небу» идиоматично по-русски и не делает Бога явным адресатом там, где греческий текст прямо называет только небо.
- source_word: Τί ποιήσωμεν
  choice: Что нам делать
  rationale: Так естественно передаётся совещательное сослагательное наклонение с оттенком растерянности и настоятельности.
- source_word: τούτοις
  choice: с этими людьми
  rationale: Указательное местоимение в дательном падеже само по себе оставляет объект не названным, однако по контексту речь идёт о людях. Добавление «людьми» необходимо для естественного русского синтаксиса и не уточняет их категорию.
- source_word: ἀπαγάγωμεν
  choice: увести
  rationale: Сложный глагол выражает ведение прочь от нынешнего места; «увести» сохраняет этот направительный оттенок точнее, чем общее «отвести» или «взять».
theological_decisions:
- issue: Неявный адресат воззвания к небу
  choice: Сохранено «к небу» без прямого называния Бога
  alternative: «к Богу на небе» или «к Господу»
  rationale: Контекст подразумевает молитву, но греческий текст непосредственно называет небо, а не Бога. Перевод сохраняет формулировку источника и её сдержанную неявность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «Воззвали» поддерживает молитвенную торжественность, тогда как остальная фраза остаётся простой и понятной. Маркер сноски поставлен после предложения, к которому относится лексическая альтернатива.
