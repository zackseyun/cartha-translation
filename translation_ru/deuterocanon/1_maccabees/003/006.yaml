  yaml_path: translation/deuterocanon/1_maccabees/003/006.yaml
  text: And the lawless were restrained because of fear of him[a], and all the workers of lawlessness were thrown into confusion[b], and deliverance prospered in his hand.
translation:
  language: ru
  text: И беззаконники были усмирены страхом перед ним, и все творящие беззаконие пришли в смятение, а избавление[a] через него совершалось успешно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасение». Греческое σωτηρία может означать как избавление, так и спасение; здесь военно-исторический контекст указывает прежде всего на освобождение народа от врагов.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в его руке». Это библейский оборот, означающий, что избавление успешно совершалось через него, его силой и действиями.'
    reason: cultural_note
lexical_decisions:
- source_word: συνεστάλησαν
  choice: были усмирены
  rationale: Пассивная форма передаёт, что страх перед Иудой сдержал и подавил беззаконников. «Были усмирены» сохраняет этот смысл без неоправданного уточнения, будто они именно отступили с поля боя.
- source_word: οἱ ἄνομοι
  choice: беззаконники
  rationale: Слово обозначает людей, для которых характерно беззаконие, и сохраняет корневую связь с ἀνομία во второй части стиха.
- source_word: ἀπὸ τοῦ φόβου αὐτοῦ
  choice: страхом перед ним
  rationale: Оборот выражает причину; творительный падеж естественно передаёт, что они были усмирены из-за страха перед ним.
- source_word: οἱ ἐργάται τῆς ἀνομίας
  choice: все творящие беззаконие
  rationale: Причастный оборот звучит естественнее буквального «делатели беззакония» и сохраняет как образ действия, так и повтор корня «беззакон-».
- source_word: συνεταράχθησαν
  choice: пришли в смятение
  rationale: Передаёт сильное внутреннее потрясение и дезорганизацию, не сужая значение до одного лишь ужаса.
- source_word: εὐωδώθη
  choice: успешно совершалось
  rationale: Глагол означает успешное продвижение или достижение успеха. Русская формулировка передаёт результативность действия и избегает неестественного «избавление преуспевало».
- source_word: σωτηρία
  choice: избавление
  rationale: В военно-историческом контексте речь прежде всего об освобождении и спасении народа от врагов; «избавление» сохраняет более широкий смысл, чем «победа».
- source_word: ἐν χειρὶ αὐτοῦ
  choice: его рукой
  rationale: Русский оборот естественно передаёт библейскую метафору руки как орудия и силы действия, сохраняя образ исходного текста.
theological_decisions:
- issue: Значение σωτηρία в военно-историческом контексте
  choice: избавление
  alternative: спасение
  rationale: Контекст говорит об освобождении народа через военные успехи Иуды. «Избавление» соответствует непосредственному смыслу, а примечание сохраняет более широкую возможность перевода «спасение», не сводя термин ни к позднейшему богословскому употреблению, ни только к победе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор корня «беззакон-» воспроизводит риторическую связь ἄνομοι / ἀνομία; архаические инверсии и неестественные кальки устранены.
