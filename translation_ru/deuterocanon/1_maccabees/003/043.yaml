  text: And each said to his neighbor[a], “Let us restore the ruin of our people and of the holy places.”
translation:
  language: ru
  text: 'И каждый сказал своему ближнему: «Поднимем из руин[a] наш народ и святыни[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально греческое выражение соединяет значения «поднять» и «разрушение (низвержение)», то есть призывает восстановить разорённое.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «святые места»; греческое слово может обозначать как освящённые места, так и священные предметы.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: каждый говорил тому, кто был рядом
  rationale: Сохраняет распределительное ἕκαστος и значение πλησίον как находящегося рядом человека, оставаясь естественным для современного русского языка.
- source_word: Ἀναστήσωμεν τὴν καθαίρεσιν
  choice: поднимем из руин
  rationale: Греческое сочетание буквально соединяет «поднять» с «разрушением, низвержением». Русская формулировка сохраняет образ подъёма после разорения, не воспроизводя неестественное «поднимем разрушение».
- source_word: τοῦ λαοῦ ἡμῶν
  choice: наш народ
  rationale: Прямо и естественно передаёт библейское употребление λαός применительно к народу Израиля.
- source_word: τῶν ἁγίων
  choice: святыни
  rationale: Субстантивированное множественное ἅγια в данном храмовом контексте обозначает освящённые места и предметы. «Святыни» сохраняет эту широту лучше, чем более узкое «святые места».
theological_decisions:
- issue: К чему относится τῶν ἁγίων
  choice: святыни — священные места и/или предметы
  alternative: святые места; святилище
  rationale: Контекст осквернения храма указывает на культовую сферу, однако форма множественного числа не требует ограничивать смысл одним зданием или только местами; поэтому сохранено более широкое обозначение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Образ восстановления после разорения сохранён, а неоднозначность культового термина вынесена в сноску.
