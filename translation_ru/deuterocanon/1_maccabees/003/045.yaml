- from: Иерусалим был необитаем, словно пустыня; никто из рождённых им[a] не входил и не выходил. Святилище попирали, а сыновья чужеземцев находились в крепости[b], ставшей пристанищем для народов. У Иакова отняли радость, и умолкли свирель и кифара[c].
  to: Иерусалим был безлюден, как пустыня; никто из рождённых в нём[a] не входил и не выходил. Святилище попирали, а сыновья чужеземцев находились в крепости[b], ставшей местом пребывания народов. От Иакова была отнята отрада, и умолкли свирель и кифара[c].
  rationale: Исправления ограничены русской идиоматикой и сохранением грамматической неопределённости оригинала. Контекстуальное истолкование γενημάτων вынесено в ясную основную формулировку, тогда как буквальная лексическая странность и возможные смыслы остаются в сноске. Историческое название «Акра» и варианты передачи κινύρα сохранены у соответствующих якорей.
