  yaml_path: translation/deuterocanon/1_maccabees/003/045.yaml
  text: And Jerusalem was uninhabited like a wilderness[a]; there was no one entering or going out from her offspring, and the sanctuary was being trampled down, and sons of foreigners were in the citadel, a lodging place for the nations; and delight was taken away from Jacob[c][b], and flute and harp ceased.
translation:
  language: ru
  text: Иерусалим был безлюден, как пустыня; никто из рождённых в нём[a] не входил и не выходил. Святилище попирали, а сыновья чужеземцев находились в крепости[b], ставшей местом пребывания народов. От Иакова была отнята отрада, и умолкли свирель и кифара[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из его порождений» или «из рождённых им»; по смыслу, вероятно, имеются в виду рождённые в Иерусалиме, то есть его жители.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Акре» — укреплённой цитадели в Иерусалиме.'
    reason: alternative_reading
  - marker: c
    text: 'Греч. κινύρα — древний струнный инструмент; возможные переводы: «лира» или «арфа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀοίκητος ὡς ἔρημος
  choice: необитаем, словно пустыня
  rationale: Передаёт конкретное значение ἀοίκητος и сохраняет выраженное сравнительным оборотом уподобление пустынной местности.
- source_word: ἐκ τῶν γενημάτων αὐτῆς
  choice: из рождённых им
  rationale: Сохраняет необычное γενημάτων («рождённые, порождения»), но по-русски ясно указывает на людей, происходящих из олицетворённого города; местоимение согласовано с русским мужским родом названия «Иерусалим».
- source_word: ἁγίασμα καταπατούμενον
  choice: Святилище попирали
  rationale: Сохраняет буквальный образ попрания и заключённый в нём смысл физического поругания, не сводя его только к абстрактному осквернению.
- source_word: υἱοὶ ἀλλογενῶν
  choice: сыновья чужеземцев
  rationale: Передаёт более конкретную форму греческого выражения, не упрощая её до одного слова «чужеземцы».
- source_word: ἄκρα
  choice: крепость
  rationale: В контексте обозначает укреплённую цитадель в Иерусалиме; «крепость» естественно и понятно современному читателю, а историческое название дано в сноске.
- source_word: κατάλυμα ἐν τοῖς ἔθνεσιν
  choice: пристанищем для народов
  rationale: «Пристанище» передаёт место пребывания или размещения; «для народов» сохраняет нейтральное ἔθνεσιν и трудность конструкции без конфессионально окрашенного уточнения.
- source_word: ἐξῆρθη τέρψις
  choice: отняли радость
  rationale: Естественно передаёт устранение или лишение удовольствия и отрады, выраженное глаголом ἐξαίρω и существительным τέρψις.
- source_word: αὐλὸς καὶ κινύρα
  choice: свирель и кифара
  rationale: «Свирель» уместно передаёт древний духовой инструмент, а «кифара» сохраняет название струнного инструмента, не отождествляя его безоговорочно с современной арфой или лирой.
theological_decisions:
- issue: Необычное выражение ἐκ τῶν γενημάτων αὐτῆς
  choice: никто из рождённых им не входил и не выходил
  alternative: никто из его жителей не входил и не выходил
  rationale: Основной текст сохраняет образ рождения или происхождения из города, тогда как более гладкое «жители» устранило бы реальную лексическую необычность греческого свидетельства.
- issue: Передача ἄκρα как нарицательного слова или исторического названия
  choice: крепость
  alternative: Акра
  rationale: Перевод значения обеспечивает понятность, а сноска сохраняет вероятное историческое название селевкидской цитадели.
- issue: Передача ἔθνεσιν
  choice: для народов
  alternative: для язычников
  rationale: «Народы» ближе к форме исходного текста и не навязывает религиозную интерпретацию там, где контекст допускает этнополитический смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Короткие фразы проясняют длинную греческую цепь, сохраняя её последовательность образов и плачевный тон. Олицетворение Иерусалима передано без искусственного женского рода, поскольку русское название города грамматически мужского рода.
