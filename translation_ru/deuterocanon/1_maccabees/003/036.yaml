translation:
  language: ru
  text: и поселить чужеземцев по всей их земле[a], и их землю разделить по жребию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чужих сыновей». По смыслу — людей из чужого народа, чужеземцев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικίσαι
  choice: поселить
  rationale: 'Каузативный смысл κατοικίζω передан естественным русским глаголом: речь идёт о намеренном заселении покорённой области.'
- source_word: υἱοὺς ἀλλοτρίους
  choice: чужеземцев
  rationale: Буквально выражение означает «чужих сыновей», но в данном контексте обозначает людей из чужого народа, которых намерены поселить на этой земле. «Чужеземцы» точно и естественно передаёт смысл, а буквальная форма отмечена в сноске.
- source_word: ἐν πᾶσι τοῖς ὁρίοις αὐτῶν
  choice: по всей их земле
  rationale: Множественное ὅρια здесь обозначает всю территорию, а не только пограничные линии. Такой перевод естественен по-русски и сохраняет полноту охвата, выраженную πᾶσι.
- source_word: κατακληρονομῆσαι
  choice: разделить по жребию
  rationale: Глагол выражает распределение земли в наследственное владение, связанное с разделом по жребию. Перевод сохраняет существенный оттенок жеребьёвки, не сводя действие к простому разделу.
- source_word: τὴν γῆν αὐτῶν
  choice: их землю
  rationale: 'Прямой и естественный перевод: речь идёт о земле народа, которого намерены вытеснить.'
theological_decisions:
- issue: Передача мужского выражения υἱοὺς ἀλλοτρίους
  choice: чужеземцев
  alternative: чужих сыновей / сынов чужеземцев
  rationale: Буквальная калька в современном русском звучит неясно и может ошибочно восприниматься как указание исключительно на потомков. Контекстуальное значение «чужеземцы» вынесено в основной текст, а форма оригинала сохранена в сноске; богословского уточнения сверх греческого текста не вносится.
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным синтаксисом. Союз «а» перед вторым инфинитивным оборотом естественно связывает две части замысла и не вводит противопоставления, отсутствующего в греческом.
