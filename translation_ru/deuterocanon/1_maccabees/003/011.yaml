  text: And Judas learned of it[a], and he went out to meet him and struck him down and killed him; and many fell wounded, and the rest fled.
translation:
  language: ru
  text: Иуда узнал об этом, вышел ему навстречу, поразил его и убил. Многие пали ранеными, а остальные бежали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: узнал об этом
  rationale: Аорист передаёт наступление знания — Иуда узнал о случившемся или замысле. Дополнение «об этом» естественно восполняет подразумеваемый из контекста предмет сообщения.
- source_word: ἐξῆλθεν εἰς συνάντησιν αὐτῷ
  choice: вышел ему навстречу
  rationale: Сохраняет обычное значение оборота «выйти навстречу»; военный контекст сам указывает, что речь идёт о столкновении.
- source_word: ἐπάταξεν αὐτὸν
  choice: поразил его
  rationale: Передаёт сильный, направленный удар и не смешивает его с последующим прямо названным убийством.
- source_word: ἀπέκτεινεν
  choice: убил
  rationale: Прямой и современный эквивалент глагола ἀποκτείνω.
- source_word: ἔπεσον τραυματίαι πολλοί
  choice: многие пали ранеными
  rationale: Сохраняет указание греческого текста именно на раненых и не подменяет его утверждением, что многие были убиты.
- source_word: οἱ ἐπίλοιποι
  choice: остальные
  rationale: Естественно обозначает оставшуюся часть вражеского отряда.
- source_word: ἔφυγον
  choice: бежали
  rationale: Кратко и ясно передаёт бегство с поля боя.
