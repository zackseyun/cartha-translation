  source_fidelity: 'Текст точно передаёт греческую последовательность: Иуда получает известие, выходит навстречу противнику, поражает и убивает его; затем сообщается о множестве павших раненых и о бегстве остальных. «Пали ранеными» не превращает раненых в прямо названных убитых и сохраняет сжатую, несколько неоднозначную формулировку оригинала.'
