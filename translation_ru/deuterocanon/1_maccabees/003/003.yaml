base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/003.yaml
  text: And he enlarged the glory of his people[a]; he put on a breastplate like a giant, and strapped on his weapons of war; he set battles in order[c][b], shielding the camp with the sword.
translation:
  language: ru
  text: Он умножил славу своего народа[a], надел панцирь, как исполин[b], и препоясался своим боевым оружием. Он вёл войны[c], защищая стан мечом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвысил честь (известность) своего народа». Греческий глагол буквально означает «расширил», а здесь образно говорит об умножении славы.'
    reason: lexical_alternative
  - marker: b
    text: 'Греч. буквально: «как гигант»; по смыслу возможно также: «как могучий воин» или «как богатырь».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «устраивал сражения», «предпринимал войны». Греческий оборот может подчёркивать организацию и ведение военных действий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλάτυνεν δόξαν
  choice: умножил славу
  rationale: Буквальный образ расширения по-русски в сочетании со «славой» звучит неестественно; «умножил» передаёт метафорическое значение увеличения славы и сохраняет возвышенный тон.
- source_word: τῷ λαῷ αὐτοῦ
  choice: своего народа
  rationale: λαός обозначает народ как единое национальное сообщество; возвратное «своего» естественно соотносит народ с действующим лицом.
- source_word: ἐνεδύσατο θώρακα
  choice: надел панцирь
  rationale: θώραξ — защитный доспех для туловища; «панцирь» точнее общего слова «доспехи» и уместен в историко-военном контексте.
- source_word: ὡς γίγας
  choice: как исполин
  rationale: «Исполин» передаёт буквальное значение γίγας и его героическую окраску, оставаясь понятным в возвышенной повествовательной речи.
- source_word: συνεζώσατο τὰ σκεύη τὰ πολεμικὰ αὐτοῦ
  choice: препоясался своим боевым оружием
  rationale: Глагол выражает опоясывание или закрепление снаряжения на себе; «препоясался» сохраняет конкретный образ. В данном военном контексте σκεύη передано как «оружие».
- source_word: πολέμους συνεστήσατο
  choice: вёл войны
  rationale: Оборот допускает значения организации, начинания и ведения военных действий. «Вёл войны» естественно по-русски и не сводит смысл ни только к построению войска, ни к отдельному участию в боях.
- source_word: σκεπάζων τὴν παρεμβολὴν
  choice: защищая стан
  rationale: σκεπάζω здесь выражает защиту, а παρεμβολή — военный лагерь или стан. «Стан» сохраняет компактный возвышенный регистр.
- source_word: ἐν ῥομφαίᾳ
  choice: мечом
  rationale: Предлог ἐν имеет инструментальное значение; ῥομφαία обозначает крупный меч, однако нейтральное «меч» естественнее в основном тексте.
