  text: And his name reached even to the king[c][b][a], and every nation spoke of the battle lines of Judah.
translation:
  language: ru
  text: Имя его дошло до самого царя, и каждый народ рассказывал о боевых построениях Иуды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий оборот труден и буквально может быть понят как «превыше всякого боевого построения». Возможно также: «о сражениях Иуды».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγγισεν ἕως τοῦ βασιλέως
  choice: дошло до самого царя
  rationale: Глагол буквально означает «приблизилось», однако в сочетании с «именем» речь естественно идёт о том, что известность Иуды достигла царя. «До самого царя» передаёт усилительный смысл контекста без неестественного русского оборота.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: имя его
  rationale: Сохранён буквальный образ греческого текста; в данном контексте «имя» означает известность или славу.
- source_word: πᾶν ἔθνος
  choice: каждый народ
  rationale: Передан распределительный смысл сочетания πᾶν с существительным в единственном числе.
- source_word: παράταξιν
  choice: боевых построениях
  rationale: Существительное обозначает выстроенное войско, боевой порядок или боевое построение. Такой перевод сохраняет военный образ и не сводит его без необходимости к победам или сражениям.
- source_word: ἐξηγεῖτο
  choice: рассказывал
  rationale: Имперфект среднего залога здесь имеет смысл «повествовал, подробно рассказывал»; выбран естественный русский эквивалент.
- source_word: Ἰούδα
  choice: Иуды
  rationale: В контексте это Иуда Маккавей; употреблена традиционная русская форма имени данного исторического лица.
theological_decisions:
- issue: Связь трудного оборота ὑπὲρ πᾶν παράταξιν Ἰούδα
  choice: «о боевых построениях Иуды»
  alternative: «превыше всякого боевого построения рассказывал об Иуде каждый народ»
  rationale: Хотя ὑπέρ с винительным падежом обычно выражает превышение, подобное сравнительное прочтение здесь синтаксически и смыслово крайне сжато. Контекст и древняя переводческая традиция поддерживают понимание оборота как рассказа о военных действиях или построениях Иуды. Неопределённость отмечена в сноске, а не устранена молча.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов «имя его» сохраняет достоинство стиля, оставаясь понятным современному читателю.
