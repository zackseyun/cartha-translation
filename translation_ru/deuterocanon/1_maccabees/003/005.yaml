  yaml_path: translation/deuterocanon/1_maccabees/003/005.yaml
  text: And he hunted down the lawless[a], searching them out[b], and he burned those who troubled his people.
translation:
  language: ru
  text: Он преследовал беззаконников, разыскивая их, и сжёг тех, кто тревожил его народ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предал огню тех, кто тревожил его народ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: преследовал
  rationale: Глагол обозначает деятельное и настойчивое преследование. «Преследовал» точно передаёт смысл, не добавляя оттенка охоты, которого сам греческий глагол не требует.
- source_word: ἀνόμους
  choice: беззаконников
  rationale: Существительное в русском сохраняет нравственно-правовой смысл греческого прилагательного и указывает на людей, нарушающих закон и порядок общины.
- source_word: ἐξερευνῶν
  choice: разыскивая их
  rationale: Причастие описывает тщательный поиск преследуемых; местоимение «их» естественно и недвусмысленно связывает действие с беззаконниками.
- source_word: παράσσοντας
  choice: тех, кто тревожил
  rationale: Выражение передаёт причинение беспокойства и вреда без неоправданного сужения до формального политического угнетения.
- source_word: ἐφλόγισεν
  choice: сжёг
  rationale: Глагол прямо обозначает предание огню. Резкая формулировка оригинала сохранена без смягчения и пояснительных добавлений.
- source_word: τὸν λαὸν αὐτοῦ
  choice: его народ
  rationale: Это естественное русское соответствие собирательному λαός, уместное в национально-заветном контексте книги.
theological_decisions:
- issue: Нравственно-правовой смысл ἀνόμους
  choice: беззаконников
  alternative: нечестивцев; преступников
  rationale: «Беззаконников» сохраняет связь как с нравственным, так и с правовым нарушением, не сводя значение только к общей порочности или гражданской преступности.
- issue: Резкость действия ἐφλόγισεν
  choice: сжёг тех, кто тревожил его народ
  alternative: предал огню тех, кто тревожил его народ
  rationale: Перевод не смягчает суровое утверждение греческого текста и не уточняет не названные в нём обстоятельства действия.
translation_notes:
  register: Современный литературный русский язык; изложение краткое, повествовательное и достойное. Сохранены параллельная структура греческой фразы и её суровый тон.
