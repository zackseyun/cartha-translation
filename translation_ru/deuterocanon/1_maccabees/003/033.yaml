lexical_decisions:
- source_word: τρέφειν
  choice: содержать
  rationale: В данном придворно-политическом контексте глагол означает не просто кормить, а обеспечивать всем необходимым и поддерживать во время отсутствия отца.
- source_word: Ἀντίοχον
  choice: Антиоха
  rationale: Имя передано в принятой русской библейской форме и поставлено в винительном падеже согласно греческому тексту.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: его сына
  rationale: Естественная русская конструкция прямо сохраняет указание на родство.
- source_word: ἕως τοῦ ἐπιστρέψαι αὐτόν
  choice: до его возвращения
  rationale: Артиклевый инфинитив с ἕως обозначает временной предел. Именная конструкция сохраняет неоднозначность местоименной отсылки лучше, чем личная форма глагола.
