lexical_decisions:
- source_word: ἀνέστη
  choice: восстал
  rationale: Аорист ἀνίστημι обозначает выступление Иуды как нового действующего лица после отца; «восстал» сохраняет повествовательную силу глагола, не превращая его в технический термин вступления в должность.
- source_word: ὁ καλούμενος
  choice: прозванный
  rationale: Оборот указывает на дополнительное имя или прозвище Иуды. «Прозванный» естественно и кратко передаёт эту функцию.
- source_word: Μακκαβαῖος
  choice: Маккавеем
  rationale: Традиционная русская форма имени-прозвища Μακκαβαῖος — «Маккавей»; творительный падеж обусловлен словом «прозванный».
- source_word: υἱὸς αὐτοῦ
  choice: его сын
  rationale: Прямо и естественно обозначает Иуду как сына ранее упомянутого лица.
- source_word: ἀντʼ αὐτοῦ
  choice: вместо него
  rationale: ἀντί с родительным падежом выражает замещение или преемство. «Вместо него» сохраняет эту широту и не вводит отсутствующего в греческом тексте официально-политического термина.
theological_decisions:
- issue: Характер преемства Иуды
  choice: восстал вместо него
  alternative: стал его преемником
  rationale: Греческий текст повествует о том, что Иуда занял место отца, однако не употребляет технического термина официального преемства. Выбранная формулировка сохраняет как идею замещения, так и повествовательную динамику.
