lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: Когда он закончил говорить
  rationale: Оборот обозначает завершение речи и непосредственный переход к следующему действию; такая передача близка к греческому и естественна по-русски.
- source_word: ἐνήλατο ἐπʼ αὐτούς
  choice: ринулся на них
  rationale: Глагол передаёт резкое, стремительное нападение; «ринулся на них» сохраняет направление движения и военную выразительность.
- source_word: ἄφνω
  choice: внезапно
  rationale: Прямо передаёт неожиданность и стремительность действия.
- source_word: συνετρίβη
  choice: были сокрушены
  rationale: Сохраняет яркий образ разрушительного поражения, выраженный греческим глаголом, не ослабляя его до нейтрального «были побеждены».
- source_word: Σήρων
  choice: Серон
  rationale: Устоявшаяся русская передача греческого имени Σήρων.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: его войско
  rationale: В данном боевом контексте παρεμβολή обозначает военную силу, хотя буквально может указывать и на лагерь; «войско» естественнее как участник разгрома.
- source_word: ἐνώπιον αὐτοῦ
  choice: перед ним
  rationale: Формально сохраняет греческое выражение и его возможный оттенок непосредственного противостояния, не уточняя сверх источника, относится ли местоимение к Иуде.
