base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/041.yaml
  text: And the merchants of the land heard their name[a], and they took very much silver and gold, and servants, and came into the camp to take the sons of Israel as servants[c][b]. And forces from Syria and from the land of foreigners were added to them.
translation:
  language: ru
  text: Купцы той земли услышали об их славе[a], взяли с собой очень много серебра и золота, а также слуг, и пришли в стан, чтобы взять сынов Израиля в рабство[b]. К ним присоединились и войска Сирии и земли иноплеменников[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «об их имени»; возможно также: «о молве о них».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть в положение людей, приобретаемых как собственность; иначе: «в рабы». В греческом тексте здесь употреблено то же слово, которое выше переведено как «слуг».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «к ним прибавились силы Сирии и земли иноплеменников».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔμποροι τῆς χώρας
  choice: купцы той земли
  rationale: ἔμποροι — торговцы или купцы; в контексте людей, прибывших ради приобретения пленников, «купцы» звучит естественно. Указательное «той» по-русски яснее связывает χώρα с упомянутой местностью.
- source_word: τὸ ὄνομα αὐτῶν
  choice: об их славе
  rationale: Буквально выражение означает «об их имени», но здесь «имя» имеет смысл известности, молвы или славы. Основной текст передаёт контекстуальный смысл, а буквальная форма и другие оттенки сохранены в сноске.
- source_word: ἀργύριον καὶ χρυσίον πολὺ σφόδρα
  choice: очень много серебра и золота
  rationale: πολὺ σφόδρα подчёркивает исключительно большое количество; данная формулировка близка греческому тексту и естественна в современном русском языке.
- source_word: παῖδας
  choice: слуг
  rationale: παῖς может означать ребёнка, слугу или раба. В первом употреблении это люди, которых купцы взяли с собой; «слуг» сохраняет широкое значение слова и не вводит отсутствующего в тексте значения «оковы».
- source_word: παρεμβολήν
  choice: стан
  rationale: В военном контексте παρεμβολή означает лагерь или стан. «Стан» сохраняет dignified biblical-historical register without being obscure.
- source_word: τοῦ λαβεῖν τοὺς υἱοὺς Ἰσραὴλ εἰς παῖδας
  choice: чтобы взять сынов Израиля в рабство
  rationale: Оборот выражает цель прибытия купцов. Здесь контекст продажи пленников требует значения рабского состояния; «в рабство» естественнее по-русски, чем буквальное «в слуги», при этом «сынов Израиля» сохраняет форму греческого текста.
- source_word: προσετέθησαν πρὸς αὐτούς
  choice: к ним присоединились
  rationale: Буквально — «были прибавлены к ним». Русское «присоединились» естественно передаёт вступление дополнительных войск в коалицию.
- source_word: δυνάμεις Συρίας καὶ γῆς ἀλλοφύλων
  choice: войска Сирии и земли иноплеменников
  rationale: δυνάμεις в данном военном контексте — вооружённые силы. ἀλλόφυλοι буквально обозначает людей иного племени; «иноплеменники» сохраняет этот широкий смысл, не сужая его без достаточных оснований до филистимлян.
theological_decisions:
- issue: Значение παῖδας в контексте торговли пленниками
  choice: «слуг» в первом употреблении и «в рабство» во втором
  alternative: «рабов» в обоих случаях; «слугами» во втором случае
  rationale: Одно и то же греческое слово имеет широкий диапазон значений, однако во втором употреблении цель купцов явно связана с обращением пленников в человеческую собственность. Перевод сохраняет различие, обусловленное синтаксисом и контекстом, а сноска отмечает повтор греческой лексемы и возможную более буквальную передачу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным историко-библейским оттенком. «Стан», «сыны Израиля» и «иноплеменники» поддерживают достоинство регистра, оставаясь понятными; синтаксис упрощён там, где буквальное следование греческому звучало бы неестественно.
