  yaml_path: translation/deuterocanon/1_maccabees/003/056.yaml
  text: And he said that those building a house[a], and those betrothed to women, and those planting vineyards, and the fearful, should each return to his house[b], according to the law.
translation:
  language: ru
  text: И он велел каждому из тех, кто строил дом, был обручён с женщиной, закладывал виноградник или был робок[b], возвратиться в свой дом согласно Закону[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «согласно Закону», вероятно, отсылают к освобождению некоторых мужчин от участия в сражении во Второзаконии 20:5–8.
    reason: cross_reference
  - marker: b
    text: 'Или: «боялся»; возможно также: «был труслив».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομοῦσιν οἰκίαν
  choice: кто строил дом
  rationale: Причастный оборот передан естественным русским придаточным; единственное число «дом» сохранено.
- source_word: μνηστευομένοις γυναῖκας
  choice: был обручён с женщиной
  rationale: 'Греческая форма обозначает обручение. Единственное число в русском передаёт распределительный смысл: речь не о нескольких невестах у одного мужчины.'
- source_word: φυτεύουσιν ἀμπελῶνας
  choice: сажал виноградник
  rationale: ἀμπελών означает виноградник. Русское единственное число естественно в ряду распределительных категорий и не меняет смысла греческого множественного.
- source_word: δειλοῖς
  choice: боялся
  rationale: Передаёт состояние страха перед битвой, не усиливая текст до однозначного нравственного осуждения как «трус».
- source_word: ἀποστρέφειν ἕκαστον εἰς τὸν οἶκον αὐτοῦ
  choice: каждому ... возвратиться к себе домой
  rationale: Инфинитив имеет силу косвенного повеления; «каждому» сохраняет распределительное ἕκαστον, а «к себе домой» естественно передаёт εἰς τὸν οἶκον αὐτοῦ.
- source_word: κατὰ τὸν νόμον
  choice: согласно Закону
  rationale: Прямо передаёт формулировку источника без добавления отсутствующего уточнения «Моисееву».
theological_decisions:
- issue: Делать ли явной связь с Второзаконием в основном тексте
  choice: Оставить «согласно Закону» и пояснить аллюзию в сноске
  alternative: «согласно Закону Моисея»
  rationale: Греческий текст говорит только «Закон»; конкретизация в основном тексте была бы добавлением.
- issue: Имеет ли δειλοῖς однозначно осуждающий смысл
  choice: «боялся»
  alternative: «был труслив» или «был малодушен»
  rationale: Выбранный вариант сохраняет возможную связь со страхом перед сражением во Второзаконии 20:8 и не снимает лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; синтаксис сделан естественным и ясным, при этом сохранены перечисление установленных Законом категорий, распределительное «каждому» и неоднозначность слова δειλοῖς.
