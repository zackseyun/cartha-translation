revisions:
- from: И он велел каждому из тех, кто строил дом[a], был обручён с женщиной, сажал виноградник или боялся[b], возвратиться к себе домой согласно Закону.
  to: И он велел каждому из тех, кто строил дом, был обручён с женщиной, закладывал виноградник или был робок[b], возвратиться в свой дом согласно Закону[a].
  rationale: Заменено неестественное и семантически менее точное «сажал виноградник» на «закладывал виноградник». «Боялся» заменено на «был робок», чтобы передать прилагательное δειλοῖς без уточнения причины страха или моральной оценки. Маркеры сносок перенесены к соответствующим словам; значение стиха не изменено.
