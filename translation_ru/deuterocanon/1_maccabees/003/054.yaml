lexical_decisions:
- source_word: ἐσάλπισαν
  choice: затрубили
  rationale: Глагол означает «трубить, подавать звук трубой»; «затрубили» естественно сочетается в русском языке с уточнением «в трубы» и передаёт торжественно-боевой контекст.
- source_word: ταῖς σάλπιγξιν
  choice: в трубы
  rationale: Дательный падеж обозначает орудие действия. Русское устойчивое сочетание «трубить в трубы» естественнее буквального «трубить трубами» и сохраняет прямое упоминание инструментов.
- source_word: ἐβόησαν
  choice: воззвали
  rationale: Глагол обозначает громкий крик или возглас. «Воззвали» передаёт сильное голосовое действие и соответствует достоинству повествовательного регистра, не уточняя содержание возгласа.
- source_word: φωνῇ μεγάλῃ
  choice: громко
  rationale: Греческое идиоматическое выражение буквально значит «великим/громким голосом»; наречие «громко» ясно и естественно передаёт его смысл в современном русском языке.
