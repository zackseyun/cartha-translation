translation:
  language: ru
  text: И страх перед Иудой и его братьями начал распространяться[a], а окружавшие их народы терпели поражение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и начался страх перед Иудой и его братьями»; то есть страх перед ними стал распространяться среди других.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и падение постигало окружавшие их народы». Греческий имперфект указывает на продолжавшееся или повторявшееся действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: начал распространяться
  rationale: Аорист ἄρχομαι обозначает начало состояния или процесса. Добавление «распространяться» естественно передаёт подразумеваемое распространение страха, не меняя его причины или объекта.
- source_word: ὁ φόβος
  choice: страх
  rationale: Нейтральное «страх» сохраняет широту φόβος и не усиливает его до «ужаса».
- source_word: Ἰούδα καὶ τῶν ἀδελφῶν αὐτοῦ
  choice: перед Иудой и его братьями
  rationale: При φόβος родительный падеж указывает на тех, кого боялись. Русская конструкция «страх перед» ясно и естественно выражает это отношение.
- source_word: ἡ πτῶσις
  choice: погибель
  rationale: В военно-политическом контексте πτῶσις означает падение, разгром или гибель. «Погибель» сочетается с образом бедствия, обрушивающегося на народы, и не сводит значение к физическому падению.
- source_word: ἐπίπτεν
  choice: обрушивалась
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; «обрушивалась» сохраняет этот вид и образ наступающего бедствия.
- source_word: ἐπὶ τὰ ἔθνη
  choice: на … народы
  rationale: ἔθνη здесь обозначает соседние народы; «народы» остаётся нейтральным и не вносит лишней конфессиональной окраски.
- source_word: τὰ κύκλῳ αὐτῶν
  choice: окружавшие их
  rationale: Передаёт географический смысл соседних народов, находившихся вокруг Иуды и его братьев.
