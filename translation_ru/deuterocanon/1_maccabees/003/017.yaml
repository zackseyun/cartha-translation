base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/017.yaml
  text: But when they saw the camp coming to meet him[a], they said to Judas, “How can we, being so few, fight against so great a multitude? And we are exhausted[c][b], having gone without food today.”
translation:
  language: ru
  text: 'Но когда они увидели войско, идущее ему навстречу[a], то сказали Иуде: «Как нам, столь малочисленным, сражаться с таким множеством? Мы ведь обессилели[b], потому что сегодня ничего не ели[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идущее против него». Греческое выражение буквально указывает на движение к встрече, но в военном контексте подразумевает враждебное столкновение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мы изнемогли». Греческое слово может обозначать физическую слабость или упадок сил; здесь это состояние связано с отсутствием пищи.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможен перевод: «постились сегодня», однако само греческое выражение означает, что они не ели, и не обязательно указывает на обрядовый пост.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολήν
  choice: войско
  rationale: В данном военном контексте слово обозначает военный лагерь либо расположенное в нём войско. Поскольку оно движется навстречу Иуде, по-русски естественнее передать его как «войско», не создавая неуместного образа движущегося лагеря.
- source_word: ἐρχομένην εἰς συνάντησιν αὐτῷ
  choice: идущее ему навстречу
  rationale: Близко передаёт движение к встрече или столкновению; враждебный характер встречи следует из военного контекста, а не добавляется прямо в текст.
- source_word: ὀλιγοστοὶ ὄντες
  choice: столь малочисленным
  rationale: Передаёт малое число людей и подчёркивает противопоставление многочисленному противнику.
- source_word: πολεμῆσαι
  choice: сражаться
  rationale: Естественный современный русский эквивалент в контексте непосредственного боя.
- source_word: πρὸς πλῆθος τοσοῦτο
  choice: с таким множеством
  rationale: Сохраняет риторическое указание на огромную численность противника, не добавляя отсутствующего в греческом тексте существительного «воинов».
- source_word: ἐκλελύμεθα
  choice: мы обессилели
  rationale: Перфектная форма описывает наступившее и сохраняющееся состояние слабости или изнеможения; контекст связывает его с отсутствием пищи.
- source_word: ἀσιτοῦντες
  choice: потому что сегодня ничего не ели
  rationale: Причастие означает пребывание без пищи. Такая передача ясно выражает смысл и не предполагает без достаточного основания обрядовый пост.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямой и естественный современный эквивалент временного наречия.
