  yaml_path: translation/deuterocanon/1_maccabees/003/029.yaml
  text: And he saw that the silver had run out from the treasuries[a], and that the taxes of the country were few because of the division and the blow that he had brought upon the land[b], by removing the customs that had existed from former days.
translation:
  language: ru
  text: И он увидел, что серебро в сокровищницах иссякло, а налоговые поступления страны были невелики из-за раздора и бедствия, которое он навлёк на землю[a], отменив установления[b], существовавшие с давних времён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «из-за распри и удара, который он нанёс стране». Греческие слова могут обозначать политический раскол, вражду, тяжёлое поражение или бедствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «законы», «узаконенные обычаи». Речь идёт о давно существовавших нормах и установившемся порядке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλιπεν
  choice: иссякло
  rationale: Передаёт полное истощение запасов и естественно сочетается с «серебром» в контексте сокровищниц.
- source_word: τὸ ἀργύριον
  choice: серебро
  rationale: Сохраняет конкретный образ греческого текста; в данном контексте понятно как денежные средства.
- source_word: τῶν θησαυρῶν
  choice: в сокровищницах
  rationale: Сохраняет множественное число и не добавляет отсутствующее в стихе определение «царских».
- source_word: οἱ φόροι τῆς χώρας ὀλίγοι
  choice: налоговые поступления страны были невелики
  rationale: По-русски естественно выражает малый объём фискальных доходов; φόροι может обозначать налоги, дань или поступления от них.
- source_word: χάριν τῆς διχοστασίας
  choice: из-за раздора
  rationale: Передаёт причинное значение χάριν с родительным падежом и общественно-политический оттенок διχοστασία.
- source_word: πληγῆς
  choice: бедствия
  rationale: В контексте ущерба всей стране естественнее буквального «удара», при этом сохраняется смысл тяжёлого поражения или несчастья.
- source_word: κατεσκεύασεν ἐπὶ τὴν γῆν
  choice: навлёк на землю
  rationale: Передаёт причинение бедствия стране и сохраняет ответственность действующего лица.
- source_word: τοῦ ἆραι
  choice: отменив
  rationale: Кратко и естественно связывает нанесённый ущерб с устранением прежних установлений; греческая конструкция допускает оттенок средства, результата или цели.
- source_word: τὰ νόμιμα
  choice: установления
  rationale: Охватывает как действующие нормы и законы, так и укоренившиеся обычаи, не сужая значение до одной категории.
- source_word: ἀφʼ ἡμερῶν τῶν πρώτων
  choice: с давних времён
  rationale: Современное русское соответствие идиоме о нормах, существовавших с прежних, ранних времён.
