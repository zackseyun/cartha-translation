  text: И Он сам сокрушит их перед нами; вы же не бойтесь их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντρίψει
  choice: сокрушит
  rationale: Будущее время συντρίβω передаёт решительное, силовое поражение противника. «Сокрушит» естественно для возвышенного военного контекста и сохраняет образ сильнее, чем нейтральное «сломит».
- source_word: πρὸ προσώπου ἡμῶν
  choice: перед нами
  rationale: Выражение буквально указывает на пространство перед лицом или в присутствии говорящих. «Перед нами» кратко и естественно сохраняет этот пространственный смысл, не добавляя идеи изгнания, возможной при переводе «от лица нашего».
- source_word: μὴ φοβηθῆτε ἀπʼ αὐτῶν
  choice: не бойтесь их
  rationale: Конструкция с μή выражает запрет или призыв не поддаваться страху. Современное русское управление «бояться кого» точно и непосредственно передаёт смысл.
- source_word: αὐτὸς
  choice: Он Сам
  rationale: 'Явно выраженное местоимение имеет эмфатическую силу: решающим действующим лицом является Он, а не сила народа. «Он Сам» сохраняет это ударение без поясняющей вставки.'
theological_decisions:
- issue: Личность и эмфатическое значение αὐτός
  choice: «Он Сам» — контекстуальное указание на Бога как решающего деятеля
  alternative: Менее выразительное «Он сокрушит их»
  rationale: Контекст связывает надежду на победу с Божьим действием. Перевод сохраняет грамматическое ударение, но не вставляет в сам стих отсутствующее здесь имя «Бог».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и воинственным звучанием. Прописные буквы в «Он Сам» отражают контекстуальную отнесённость к Богу и эмфазу; синтаксическое противопоставление δέ передано как «вы же».
