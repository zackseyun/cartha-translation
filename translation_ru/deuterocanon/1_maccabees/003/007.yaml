base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/007.yaml
  text: And he embittered many kings[a], and he made Jacob glad by his deeds, and his remembrance is for blessing forever.
translation:
  language: ru
  text: И многим царям он принёс горечь, а Иакова обрадовал своими делами; память о нём — в благословение навеки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «память о нём будет благословенна вовеки». Буквально по-гречески: «память о нём — в благословение навеки».'
    reason: Лексико-синтаксический вариант формулы εἰς εὐλογίαν.
lexical_decisions:
- source_word: ἐπίκρανεν
  choice: принёс горечь
  rationale: Передаёт буквальный образ горечи и причинительное значение глагола, но звучит естественнее по-русски, чем «сделал горькими»; менее истолковательно, чем «разгневал» или «спровоцировал».
- source_word: βασιλεῖς πολλούς
  choice: многим царям
  rationale: Сохраняет точное значение βασιλεῖς («цари»), а дательный падеж обусловлен естественной русской конструкцией «принёс горечь».
- source_word: ηὔφρανεν
  choice: обрадовал
  rationale: 'Кратко и естественно передаёт причинительное значение: он доставил радость, сделал радостным.'
- source_word: τὸν Ἰακώβ
  choice: Иакова
  rationale: Сохраняет данное в греческом тексте имя как собирательное обозначение народа, не заменяя его истолковательным «Израиль».
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: своими делами
  rationale: Творительный падеж естественно выражает средство; «делами» сохраняет библейскую лексику и не звучит архаично.
- source_word: τὸ μνημόσυνον αὐτοῦ
  choice: память о нём
  rationale: По-русски естественно передаёт значение памяти или памятования о человеке; вариант «памятование его» был бы искусственно архаичным.
- source_word: εἰς εὐλογίαν
  choice: в благословение
  rationale: Сохраняет именную библейскую формулу и не превращает её без необходимости в явный страдательный оборот «будет благословенна».
- source_word: ἕως τοῦ αἰῶνος
  choice: навеки
  rationale: Естественно и сжато передаёт устойчивое значение вечной продолжительности.
theological_decisions:
- issue: Собирательное значение имени «Иаков»
  choice: Сохранить «Иаков» как заветное имя народа.
  alternative: Израиль
  rationale: Греческий текст прямо называет Иакова; замена на «Израиль» устранила бы важный библейский образ и внесла бы истолкование в основной текст.
- issue: Формула благословения в заключительной части
  choice: «память о нём — в благословение навеки»
  alternative: «память о нём будет благословенна вовеки»
  rationale: 'В греческом нет выраженного страдательного глагола: употреблена именная формула εἰς εὐλογίαν. Основной перевод сохраняет эту структуру и присущую ей смысловую ёмкость.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм «царям… Иакова» сохранён; точка с запятой отделяет итоговую формулу о памяти героя. Образ горечи удержан без тяжеловесной буквальности.
