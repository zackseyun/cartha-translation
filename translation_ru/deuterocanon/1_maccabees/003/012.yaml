translation:
  language: ru
  text: Они взяли их снаряжение, а Иуда взял меч Аполлония и во все свои дни сражался им.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во все дни»; в контексте это, вероятно, относится ко всему последующему времени жизни Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεύη
  choice: снаряжение
  rationale: В военном контексте слово обозначает имущество или оснащение; «снаряжение» естественно передаёт общий смысл, не сводя его только к оружию или добыче.
- source_word: μάχαιρα
  choice: меч
  rationale: Слово может обозначать меч или более короткий клинок; в данном военном повествовании «меч» — естественный и достаточно широкий русский эквивалент.
- source_word: ἦν πολεμῶν
  choice: сражался
  rationale: Перифрастическая конструкция выражает продолжительное или повторявшееся действие. В сочетании с указанием времени русский несовершенный вид передаёт эту длительность без тяжеловесного «продолжал сражаться».
- source_word: ἐν αὐτῇ
  choice: им
  rationale: 'Местоимение женского рода относится к μάχαιρα; творительный падеж естественно выражает орудийное значение: Иуда сражался этим мечом.'
- source_word: πάσας τὰς ἡμέρας
  choice: до конца своих дней
  rationale: Буквально выражение означает «все дни», а в контексте указывает на всё последующее время жизни Иуды. Русская идиома передаёт вероятный смысл; буквальная форма отмечена в сноске.
