  text: And they spread out the book of the law[b][a], concerning which the nations were searching for the likenesses of their idols.
translation:
  language: ru
  text: И они развернули книгу закона[a], в связи с которой народы разыскивали подобия своих идолов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раскрыли»; возможно также: «развернули свиток закона».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза сжата и допускает разные понимания. Возможно: они искали в книге закона ответ на то, о чём народы вопрошали изображения своих идолов; либо народы исследовали книгу в связи с изготовлением или использованием таких изображений.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξεπέτασαν
  choice: развернули
  rationale: Глагол передаёт физическое разворачивание или раскрытие книги; «развернули» сохраняет этот конкретный образ, не утверждая прямо, что перед ними был именно свиток.
- source_word: τὸ βιβλίον τοῦ νόμου
  choice: книгу закона
  rationale: Прямой и естественный перевод; строчная буква не вносит дополнительного толкования в обозначение закона.
- source_word: περὶ ὧν
  choice: в связи с которой
  rationale: Оборот передаёт связь с книгой закона, но не уточняет искусственно характер этой связи. Греческая конструкция с формой множественного числа сжата и синтаксически трудна.
- source_word: ἐξηρεύων
  choice: разыскивали
  rationale: Передаёт длительное или обычное действие, выраженное имперфектом, и сохраняет основное значение тщательного поиска или исследования.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: Буквальный и наименее конфессионально окрашенный вариант; в контексте имеются в виду народы, не принадлежавшие Израилю.
- source_word: τὰ ὁμοιώματα
  choice: подобия
  rationale: Сохраняет значение сходства или изображения и не сливает это слово с последующим εἴδωλα.
- source_word: τῶν εἰδώλων αὐτῶν
  choice: своих идолов
  rationale: «Идолы» точно передаёт культовый и полемический оттенок εἴδωλα; возвратное «своих» естественно соотносит их с народами.
theological_decisions:
- issue: Связь книги закона с подобиями языческих идолов
  choice: 'Сохранена сжатая формулировка: народы разыскивали подобия своих идолов в некой связи с книгой закона.'
  alternative: Можно понимать стих так, что иудеи искали в книге закона ответ на те вопросы, по которым народы обращались к изображениям своих идолов, либо что народы исследовали саму книгу ради изображений идолов.
  rationale: Греческий текст синтаксически сжат и не обозначает практическую ситуацию однозначно. Основной текст не устраняет эту неясность, а примечание сообщает важнейшие возможные понимания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Несколько необычная конструкция «в связи с которой» оставлена намеренно, чтобы не устранять неясность греческого текста; примечание делает её доступной обычному читателю.
