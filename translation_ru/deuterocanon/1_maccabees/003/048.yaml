review_pass:
  verdict: revise
  source_fidelity: 'Основной текст в целом близок к греческому: ἐξεπέτασαν передано конкретным «развернули», ἐξηρεύων — как длительное «разыскивали», а различие между ὁμοιώματα («подобия/изображения») и εἴδωλα («идолы») сохранено. Однако «в связи с которой» грамматически привязывает относительный оборот к единственному числу «книга», тогда как περὶ ὧν имеет множественное число и оставляет предмет связи не вполне явным. Это допустимо лишь как весьма свободное воспроизведение, но лучше обозначить сжатость конструкции естественнее и без ложной синтаксической определённости.'
  naturalness: «И они развернули книгу закона» звучит естественно в современном литературном библейском русском. Оборот «в связи с которой народы разыскивали...» тяжеловесен и создаёт неясную, но при этом слишком определённую грамматическую связь. Формулировка «о которых» сохраняет множественное число оригинала; примечание объясняет, что его точный референт не назван.
  terminology: '«Книга закона», «народы», «подобия» и «идолы» удачны и нейтральны по регистру. «Подобия» несколько книжно, но уместно и полезно сохраняет отличие от «идолов». В исходном примечании ошибочно предлагается понимание, при котором народы «вопрошали изображения»: такого действия греческий глагол не выражает; его прямой объект — «подобия».'
  issues:
  - severity: medium
    issue: Синтаксис основного текста маскирует множественное число περὶ ὧν.
    rationale: «В связи с которой» относится к «книге» (ед. ч., ж. р.), тогда как греческое «περὶ ὧν» буквально означает «о которых/касательно которых». Точный антецедент в сжатой фразе спорен, поэтому не следует представлять связь как однозначно относящуюся именно к книге.
  - severity: high
    issue: Примечание b включает несоответствующую греческому альтернативу «народы вопрошали изображения своих идолов».
    rationale: ἐξηρεύων означает разыскивать, исследовать, выискивать; при нём τὰ ὁμοιώματα является объектом. Текст не говорит, что народы обращались с вопросами к изображениям. Это толкование нужно удалить, сохранив лишь те варианты, которые отражают поиски/исследование.
  revised_text: И они развернули книгу закона[a], о которых народы разыскивали подобия своих идолов[b].
  revised_footnotes:
  - marker: a
    text: 'Или: «раскрыли»; возможно также: «развернули свиток закона».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза сжата: «о которых» стоит во множественном числе, но её точный предмет связи не назван. Возможны, в частности, понимания, что речь идёт о вопросах, связанных с книгой закона, или что народы исследовали книгу в связи с изготовлением либо использованием подобных изображений.'
    reason: alternative_reading
  revision_rationale: 'Исправлены две проблемы: относительный оборот приведён к множественному числу греческого текста, а примечание очищено от варианта, который менял значение ἐξηρεύων на «вопрошать». Неясность исходной конструкции и её возможная связь с книгой закона сохранены в примечании без догматического или исторически чрезмерного уточнения.'
