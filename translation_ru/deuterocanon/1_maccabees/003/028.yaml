lexical_decisions:
- source_word: γαζοφυλάκιον
  choice: сокровищницу
  rationale: Передаёт хранилище казны; в данном контексте речь идёт о средствах правителя для выплаты войскам.
- source_word: ὀψώνια
  choice: жалованье
  rationale: В военном контексте означает содержание или плату воинам; «жалованье» естественно и точно по-русски.
- source_word: δυνάμεσιν
  choice: войскам
  rationale: Здесь слово обозначает вооружённые силы, а не абстрактную силу.
- source_word: εἰς πᾶσαν χρείαν
  choice: ко всякой необходимости
  rationale: 'Сохраняет широкое значение выражения: готовность к любой возникающей нужде или задаче, не сужая его до военной операции.'
