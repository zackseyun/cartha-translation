  text: And he opened his treasury and gave wages to his forces for a year, and he commanded them to be ready for every need for a year.
translation:
  language: ru
  text: Он открыл свою сокровищницу, выдал своим войскам жалованье на год и приказал им в течение года быть готовыми ко всякой необходимости.
