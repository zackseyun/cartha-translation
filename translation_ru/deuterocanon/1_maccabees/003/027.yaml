  text: When Antiochus the king heard these words[a], he became furiously angry, and he sent out and gathered all the forces of his kingdom, a very strong camp.
translation:
  language: ru
  text: Когда царь Антиох услышал эти слова, он пришёл в ярость, разослал распоряжения и собрал все войска своего царства — чрезвычайно сильное воинство.[a]
  philosophy: optimal-equivalence
