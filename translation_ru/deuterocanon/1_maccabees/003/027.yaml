lexical_decisions:
- source_word: Ὡς δὲ
  choice: Когда
  rationale: Передаёт временной переход к следующему событию естественным современным русским языком.
- source_word: ἤκουσεν ... τοὺς λόγους τούτους
  choice: услышал об этом
  rationale: В данном контексте λόγοι обозначает известие о предшествующих событиях; русский оборот естественно передаёт смысл, не утверждая способ получения сообщения сверх значения ἤκουσεν.
- source_word: ὠργίσθη θυμῷ
  choice: пришёл в ярость
  rationale: Сочетание глагола гнева с θυμός усиливает эмоциональную реакцию; выбранный оборот сохраняет эту интенсивность без буквального удвоения.
- source_word: ἀπέστειλεν καὶ συνήγαγεν
  choice: разослал приказ собрать
  rationale: Греческое ἀπέστειλεν употреблено без выраженного дополнения и, вероятно, подразумевает отправку посланников или распоряжений; перевод делает подразумеваемое действие ясным, сохраняя связь с последующим сбором войск.
- source_word: τὰς δυνάμεις πάσας τῆς βασιλείας αὐτοῦ
  choice: все войска своего царства
  rationale: В военном контексте δυνάμεις означает вооружённые силы; «войска» ясно и естественно передаёт это значение.
- source_word: παρεμβολὴν ἰσχυρὰν σφόδρα
  choice: чрезвычайно сильное воинство
  rationale: παρεμβολή может обозначать как лагерь, так и расположившееся лагерем войско. «Воинство» согласуется с собранными силами и сохраняет военный смысл, а альтернативное значение отмечено в сноске; σφόδρα передано усилителем «чрезвычайно».
