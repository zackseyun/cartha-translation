lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Передаёт указательную силу и молитвенную настоятельность греческого выражения естественным для современного русского языка оборотом.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: Сохраняет прямое значение слова и его военно-политический смысл в контексте, не вводя более узкое религиозное обозначение «язычники».
- source_word: συνῆκται
  choice: собрались
  rationale: Передаёт перфект как возникшее в результате собирания наличное состояние и звучит естественно по-русски.
- source_word: ἐφʼ ἡμᾶς
  choice: против нас
  rationale: В контексте вражеского наступления предлог выражает направленность враждебного действия.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: чтобы истребить нас
  rationale: Инфинитив с артиклем выражает цель; «истребить» передаёт угрозу полного устранения, сохраняя серьёзный и литературный регистр.
- source_word: σὺ οἶδας
  choice: Ты знаешь
  rationale: Прямое обращение к Богу передано просто и без смыслового усиления; прописная буква соответствует принятому русскому благоговейному регистру.
- source_word: ἃ λογίζονται
  choice: что они замышляют
  rationale: В данном враждебном контексте глагол означает обдумывание злого умысла, а не нейтральное размышление.
theological_decisions:
- issue: Значение τὰ ἔθνη в иудейской военной молитве
  choice: народы
  alternative: язычники
  rationale: «Народы» сохраняет лексическую широту греческого текста и прежде всего военно-политический смысл, не превращая обозначение противников в технический религиозный термин.
