base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/049.yaml
  text: And they brought the priestly garments[a], and the firstfruits and the tithes; and they brought forward the Nazirites, who had completed their days.
translation:
  language: ru
  text: И принесли священнические одежды, начатки и десятины; и вывели вперёд назореев, которые завершили положенные дни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у которых завершился срок обета». Буквально по-гречески: «которые исполнили дни» — то есть закончили установленный срок назорейского обета.'
    reason: Лексическая альтернатива и пояснение греческой идиомы.
lexical_decisions:
- source_word: ἤνεγκαν
  choice: принесли
  rationale: Аорист от φέρω здесь обозначает доставление предметов к месту собрания; «принесли» естественно относится и к одеждам, и к приношениям.
- source_word: τὰ ἱμάτια τῆς ἱερωσύνης
  choice: священнические одежды
  rationale: Выражение обозначает одежды, предназначенные для священнического служения. Этот вариант точен, понятен и не привносит более поздней церковной терминологии.
- source_word: τὰ πρωτογεννήματα
  choice: начатки
  rationale: В культовом контексте, рядом с десятинами, слово обозначает первые плоды или первые части урожая, посвящаемые Богу. «Начатки» — устойчивый библейский термин в русском языке.
- source_word: τὰς δεκάτας
  choice: десятины
  rationale: Обычное и точное русское обозначение десятой части, отдаваемой как установленные Законом приношения.
- source_word: ἤγειραν
  choice: вывели вперёд
  rationale: Буквально глагол означает «подняли», но применительно к людям здесь передаёт их публичное выведение или поставление перед собранием. «Вывели вперёд» ясно выражает действие без ложной ассоциации с пробуждением или воскресением.
- source_word: τοὺς Ναζιραίους
  choice: назореев
  rationale: «Назорей» — принятый русский термин для человека, давшего особый обет посвящения по Закону; он сохраняет историко-религиозную специфику понятия.
- source_word: οἳ ἐπλήρωσαν τὰς ἡμέρας
  choice: которые завершили положенные дни
  rationale: Греческий текст буквально говорит о завершении дней и подразумевает установленный срок назорейского обета. «Положенные дни» сохраняет образ исходного выражения, оставаясь понятным по-русски; подразумеваемый смысл разъяснён в сноске.
theological_decisions:
- issue: Передача специального термина Ναζιραίους
  choice: назореев
  alternative: давших назорейский обет
  rationale: Транслитерированный традиционный термин сохраняет установленную Торой категорию посвящения и не превращает её в общее описание.
- issue: Подразумеваемое упоминание обета в οἳ ἐπλήρωσαν τὰς ἡμέρας
  choice: сохранить в основном тексте образ завершённых дней, пояснив обет в сноске
  alternative: у которых завершился срок обета
  rationale: В греческом слов «обет» и «срок» нет, хотя контекст назорейства ясно их подразумевает. Основной вариант сохраняет лаконичность и образность источника, не скрывая смысла благодаря сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены общеупотребительные библейские термины «начатки», «десятины» и «назареи» без архаизации синтаксиса; технически корректная форма в тексте — «назореев».
