  text: to send a force against them[a], to crush and remove the strength of Israel and the remnant of Jerusalem, and to take away its memory from the place,
translation:
  language: ru
  text: послать против них войско, чтобы сокрушить и удалить силу Израиля и остаток Иерусалима, а также удалить из этого места память о нём[a].
  philosophy: optimal-equivalence
  footnotes:
