    text: 'Или: «удалить из этого места памятный знак о нём»; возможен также перевод: «стереть воспоминание о нём».'
    reason: Греческое μνημόσυνον может означать память, воспоминание или памятный знак; αὐτοῦ сохранено местоимением без явного определения референта.
lexical_decisions:
- source_word: ἀποστεῖλαι ἐπʼ αὐτοὺς δύναμιν
  choice: послать против них войско
  rationale: В военном контексте δύναμις обозначает вооружённые силы. «Войско» естественно по-русски и не передаёт здесь отвлечённого значения «сила».
- source_word: τοῦ ἐκρίψαι καὶ ἐξᾶραι
  choice: чтобы сокрушить и искоренить
  rationale: 'Два инфинитива цели переданы разными глаголами: первый выражает насильственное ниспровержение, второй — полное удаление. «Искоренить» сохраняет усиление, не сливая оба действия в одно.'
- source_word: τὴν ἰσχὺν Ἰσραήλ
  choice: силу Израиля
  rationale: Прямо передаёт ἰσχύς и сохраняет родительную конструкцию оригинала.
- source_word: τὸ κατάλιμμα Ἰερουσαλήμ
  choice: остаток Иерусалима
  rationale: κατάλιμμα означает то, что осталось. «Остаток» не сужает значение до одних лишь выживших людей и сохраняет возможный собирательный смысл.
- source_word: ἆραι τὸ μνημόσυνον αὐτοῦ
  choice: изгладить память о нём
  rationale: μνημόσυνον допускает значения памяти, воспоминания и памятного знака. «Изгладить память» естественно выражает намерение уничтожить само воспоминание, сохраняя местоимение мужского рода и не устраняя неоднозначность его отнесения.
- source_word: ἀπὸ τοῦ τόπου
  choice: из этого места
  rationale: Передаёт удаление «из/от места»; указательное «этого» делает русскую фразу естественной, при этом место остаётся прямо не названным.
theological_decisions:
- issue: Объём значения выражения «остаток Иерусалима»
  choice: Сохранено широкое собирательное выражение «остаток Иерусалима».
  alternative: «выжившие жители Иерусалима» или «то, что осталось от Иерусалима»
  rationale: Греческое κατάλιμμα может относиться как к оставшимся людям, так и шире — ко всему уцелевшему. Перевод не ограничивает значение только людьми.
- issue: Референт местоимения αὐτοῦ
  choice: Передано как «о нём», без явного называния референта.
  alternative: «об Израиле» или «об Иерусалиме»
  rationale: Местоимение мужского рода наиболее легко соотнести с Израилем, однако синтаксическая цепочка допускает собирательное отнесение к описанному народу и его остатку. Явное существительное неоправданно устранило бы неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Военная цель выражена ясно; сохранены параллелизм инфинитивов, широкий смысл «остатка» и неоднозначность местоименного референта.
