translation:
  language: ru
  text: Он приблизился к подъёму на Бет-Хорон[a], и Иуда вышел ему навстречу лишь с немногими людьми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Мефорон» (Μεθωρών); имеется в виду место, обычно называемое Бет-Хорон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: приблизился
  rationale: Аорист ἐγγίζω обозначает приближение; «приблизился» естественно передаёт движение к указанному месту.
- source_word: ἕως ἀναβάσεως
  choice: к подъёму
  rationale: ἕως с родительным указывает предел движения, а ἀνάβασις здесь означает ведущий вверх участок пути. Русское «к подъёму» естественно передаёт топографический смысл, не превращая его без достаточных оснований в «перевал».
- source_word: Μεθωρών
  choice: Бет-Хорон
  rationale: Греческая форма Μεθωρών соотносится с известным библейским топонимом Бет-Хорон; нормативная форма вынесена в текст, а расхождение отражено в сноске.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Буквальное и естественное соответствие глаголу; более военное «выступил» добавляло бы оттенок, не выраженный самим словом.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: ему навстречу
  rationale: Обычное идиоматическое выражение движения для встречи с кем-либо.
- source_word: ὀλίγος
  choice: лишь с немногими людьми
  rationale: Прилагательное в единственном числе характеризует Иуду как имеющего при себе малое число людей. Дополнение «людьми» необходимо для ясного русского выражения, а «лишь» передаёт подчёркнутую малочисленность.
