base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/015.yaml
  text: And a strong camp of ungodly men was added and went up with him[b][a], to help him and to execute vengeance on the sons of Israel.
translation:
  language: ru
  text: К нему присоединилось и выступило вместе с ним сильное войско нечестивцев[a], чтобы помочь ему и совершить возмездие над сынами Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильный стан нечестивцев». Греческое слово может обозначать как военный лагерь, так и войско.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «совершить возмездие среди сынов Израиля»; по смыслу речь идёт о карательных действиях против них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεθέτο
  choice: присоединилось
  rationale: Средняя форма передаёт присоединение нового воинского соединения к уже названной силе; по-русски личная конструкция естественнее буквального «было добавлено».
- source_word: ἀνέβη
  choice: выступило
  rationale: В военном повествовании передаёт движение войска без обязательного уточнения направления вверх; буквальное «поднялось» по-русски могло бы быть понято слишком пространственно.
- source_word: παρεμβολὴ
  choice: войско
  rationale: Слово может обозначать как лагерь, так и находящееся в нём войско; здесь оно выступает, помогает и участвует в карательном походе, поэтому «войско» наиболее естественно.
- source_word: ἀσεβῶν
  choice: нечестивцев
  rationale: Сохраняет религиозно-нравственную окраску ἀσεβής, не сводя значение лишь к общей порочности.
- source_word: ἰσχυρὰ
  choice: сильное
  rationale: Прямой и естественный эквивалент, характеризующий военную мощь соединения.
- source_word: βοηθῆσαι αὐτῷ
  choice: чтобы помочь ему
  rationale: Инфинитив выражает цель; простой оборот точно передаёт смысл.
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: совершить возмездие
  rationale: Сохраняет предметную конструкцию греческого текста и идею карательного воздаяния.
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: над сынами Израиля
  rationale: В данном враждебном контексте ἐν указывает на тех, против кого направлено возмездие; «над» естественно сочетается с русским «совершить возмездие».
theological_decisions:
- issue: Передача ἀσεβῶν в военно-политическом контексте
  choice: нечестивцев
  alternative: беззаконников; безбожников; порочных людей
  rationale: «Нечестивцы» удерживает религиозную оценку противников и не вносит более узкого утверждения об отрицании существования Бога.
- issue: Передача υἱοῖς Ἰσραήλ
  choice: сынами Израиля
  alternative: народом Израиля; израильтянами
  rationale: Сохранена традиционная библейская формула и явный образ исходного текста, где υἱοί служит этническим и заветным обозначением.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Выступило» и «войско» обеспечивают естественность военного повествования; «нечестивцы» и «сыны Израиля» сохраняют религиозную и библейскую окраску оригинала.
