base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/037.yaml
  text: And the king took half of the forces that had been left behind and departed from Antioch[a], the city of his kingdom, in the one hundred forty-seventh year[c][b]; and he crossed the Euphrates River and traveled through the upper regions.
translation:
  language: ru
  text: Царь взял с собой половину оставленных войск и выступил из Антиохии[a], города его царства, в сто сорок седьмом году[b]. Он переправился через реку Евфрат и продвигался по верхним областям[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Антиохии, царского города его царства». Греческий оборот может пояснять, что Антиохия была царским, то есть столичным, городом.'
    reason: lexical_alternative
  - marker: b
    text: То есть в 147-м году селевкидской эры.
    reason: cultural_note
  - marker: c
    text: 'Или: «по внутренним областям»; возможно также: «по верхним провинциям». Вероятно, имеются в виду земли к востоку от Евфрата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: взял с собой
  rationale: В военном контексте глагол обозначает, что царь повёл войска с собой; такой перевод точнее простого «взял» и естественен по-русски.
- source_word: τὰς ἡμίσεις τῶν δυνάμεων τὰς καταλειφθείσας
  choice: половину оставленных войск
  rationale: «Войска» передаёт военное значение δυνάμεις, а страдательное «оставленных» сохраняет указание на предшествующее действие, не сводя его к простому «оставшихся».
- source_word: ἀπῆρεν
  choice: выступил
  rationale: В повествовании о военном походе «выступил» естественно передаёт отправление из города.
- source_word: ἀπὸ πόλεως βασιλείας αὐτοῦ
  choice: столицы своего царства
  rationale: Оборот поставлен как приложение к Антиохии; «столица» естественно передаёт вероятный смысл города царской власти, тогда как буквальная конструкция была бы неясна современному читателю. Неоднозначность отмечена в сноске.
- source_word: ἔτους ἑβδόμου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ
  choice: в сто сорок седьмом году
  rationale: Обычная русская форма хронологического указания; речь идёт о 147-м годе селевкидской эры.
- source_word: διεπέρασεν τὸν Εὐφράτην ποταμόν
  choice: переправился через реку Евфрат
  rationale: «Переправился» естественно описывает пересечение крупной реки и сохраняет значение глагола.
- source_word: διεπορεύετο
  choice: продвигался
  rationale: Несовершенный вид передаёт длительное движение, выраженное греческим имперфектом.
- source_word: τὰς ἐπάνω χώρας
  choice: по верхним областям
  rationale: Перевод близок к греческому выражению и не решает окончательно, обозначены ли возвышенные, внутренние или восточные территории.
