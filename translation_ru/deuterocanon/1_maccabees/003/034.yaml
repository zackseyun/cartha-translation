lexical_decisions:
- source_word: παρέδωκεν
  choice: передал
  rationale: Глагол обозначает передачу людей и средств под власть или в распоряжение другого. «Передал» сохраняет конкретный смысл, не добавляя ни враждебного оттенка, ни явной оценки доверия.
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  choice: половину войск
  rationale: Хотя греческая форма слова «половина» стоит во множественном числе, речь идёт о половине совокупных военных сил; по-русски естественно сказать «половину войск».
- source_word: τοὺς ἐλέφαντας
  choice: слонов
  rationale: В греческом тексте сказано просто «слонов». Военный контекст понятен без добавления определения «боевых».
- source_word: ἐνετείλατο αὐτῷ
  choice: дал ему распоряжения
  rationale: Оборот передаёт властное поручение или приказ. «Дал ему распоряжения» естественно звучит в современном русском и подходит к военному контексту.
- source_word: περὶ πάντων ὧν ἐβούλετο
  choice: обо всём, чего хотел
  rationale: Сжатая греческая формулировка не называет прямо предмет или цель желания. Перевод сохраняет эту недосказанность и не добавляет предполагаемого действия.
- source_word: τῶν κατοικούντων
  choice: всех живущих
  rationale: Субстантивированное причастие передано причастным оборотом, чтобы сохранить его глагольный характер и не сужать значение до какой-либо отдельной категории жителей.
- source_word: τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: в Иудее и Иерусалиме
  rationale: При κατοικέω винительный падеж обозначает место проживания; в русском языке это естественно передаётся предлогом «в».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис удерживает повтор союза «и» и структуру греческой фразы, но избегает неестественных буквализмов. Неоднозначность оборота ὧν ἐβούλετο сохранена в основном тексте и пояснена в сноске.
