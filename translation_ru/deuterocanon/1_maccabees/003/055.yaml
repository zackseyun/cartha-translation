lexical_decisions:
- source_word: Καὶ μετὰ τοῦτο
  choice: И после этого
  rationale: Естественно передаёт временной переход и последовательность событий.
- source_word: κατέστησεν
  choice: назначил
  rationale: В контексте распределения военных должностей глагол означает поставление людей на определённые ответственные посты.
- source_word: Ἰούδας
  choice: Иуда
  rationale: Традиционная и общепринятая русская форма имени Ἰούδας в книгах Маккавейских.
- source_word: ἡγουμένους τοῦ λαοῦ
  choice: руководителей народа
  rationale: Сохраняет общее значение тех, кто возглавляет народ, не сводя выражение заранее только к гражданской или военной власти; последующий перечень уточняет военные должности.
- source_word: χιλιάρχους
  choice: тысяченачальников
  rationale: Прозрачно передаёт наименование начальников подразделений в тысячу человек и сохраняет числовую структуру перечня.
- source_word: ἑκατοντάρχους
  choice: сотников
  rationale: Устоявшееся русское обозначение начальников сотен без привнесения специфически римского звания центуриона.
- source_word: πεντηκοντάρχους
  choice: пятидесятников
  rationale: Передаёт соответствующую ступень военной организации и сохраняет параллелизм ряда.
- source_word: δεκαδάρχους
  choice: десятников
  rationale: Кратко и последовательно передаёт начальников десятков, завершая градуированный перечень.
