  text: 'And after this Judas appointed leaders of the people: commanders of thousands[a], and of hundreds, and of fifties, and of tens.'
translation:
  language: ru
  text: 'И после этого Иуда назначил руководителей народа[a]: тысяченачальников, сотников, пятидесятников и десятников.'
