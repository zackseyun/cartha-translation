base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/042.yaml
  text: And Judas and his brothers saw that the troubles had multiplied[a], and that the forces were encamped within their borders[b]; and they recognized the orders of the kingdom that it had commanded to be carried out against the people for destruction and annihilation.
translation:
  language: ru
  text: И увидели Иуда и его братья, что бедствия умножились и что войска расположились станом в их пределах; и узнали они о повелениях царской власти[a], которые она приказала исполнить против народа[b], чтобы погубить и истребить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слова царской власти»; по контексту речь идёт об официальных распоряжениях. Греческий текст называет царскую власть, а не прямо царя.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможно: «народу»; последующие слова о погибели и истреблении показывают, что распоряжения были направлены против народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κακά
  choice: бедствия
  rationale: Множественное число обозначает усилившиеся несчастья и тяжёлые обстоятельства; «бедствия» естественно передаёт военно-политический контекст, не сводя выражение к нравственному злу.
- source_word: αἱ δυνάμεις
  choice: войска
  rationale: В данном военном контексте δυνάμεις означает вооружённые силы; «войска» ясно и естественно по-русски.
- source_word: παρεμβάλλουσιν
  choice: расположились станом
  rationale: Глагол обозначает разбивку лагеря или пребывание в лагере. Совершенный вид передаёт наличное в повествовании состояние войск.
- source_word: ἐν τοῖς ὁρίοις αὐτῶν
  choice: в их пределах
  rationale: ὅρια может обозначать как границы, так и ограниченную ими территорию. «В их пределах» сохраняет эту смысловую ёмкость и указывает на вторжение внутрь территории.
- source_word: ἐπέγνωσαν
  choice: узнали
  rationale: Глагол выражает распознавание или достоверное осознание. В сочетании с официальными распоряжениями естественное русское «узнали о» не утверждает сверх того, каким именно образом сведения были получены.
- source_word: τοὺς λόγους τῆς βασιλείας
  choice: повеления царской власти
  rationale: λόγοι здесь — официальные распоряжения, а βασιλεία обозначает царствующую власть или режим, а не прямо личность царя. Формулировка сохраняет абстрактный субъект греческого текста и остаётся понятной.
- source_word: ἐνετείλατο ποιῆσαι
  choice: которые она приказала исполнить
  rationale: Оборот сочетает приказ и его осуществление; «приказала исполнить» естественно передаёт распоряжение о приведении мер в действие.
- source_word: τῷ λαῷ
  choice: против народа
  rationale: Формально дательный допускает «народу», но цель — погибель и полное истребление — показывает враждебную направленность распоряжений.
- source_word: εἰς ἀπώλειαν καὶ συντέλειαν
  choice: чтобы погубить и истребить его
  rationale: Пара существительных усиливает идею окончательной гибели. Русская целевая конструкция ясно передаёт назначение мер, а два глагола сохраняют усиленное сочетание.
theological_decisions:
- issue: Передача τῆς βασιλείας
  choice: царской власти
  alternative: царства; царя; монархии
  rationale: В источнике стоит абстрактное βασιλεία, а не существительное «царь». «Царская власть» сохраняет безлично-институциональное обозначение правящего режима и не подменяет его личностью царя.
- issue: Враждебное значение τῷ λαῷ
  choice: против народа
  alternative: народу; для народа
  rationale: Хотя дательный сам по себе допускает более буквальную передачу, последующая цель — погибель и истребление — однозначно задаёт враждебную направленность.
- issue: Степень окончательности εἰς ἀπώλειαν καὶ συντέλειαν
  choice: чтобы погубить и истребить его
  alternative: на погибель и конец; на уничтожение и полное истребление
  rationale: Выбранная формулировка передаёт усиление двух терминов, не превращая συντέλεια в богословский термин о конце века и не ослабляя идею окончательного уничтожения.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Начальная инверсия «И увидели Иуда и его братья» сохраняет повествовательный ритм, а лексика избегает как архаической тяжеловесности, так и разговорности. Все примечания отмечены в основном тексте.
