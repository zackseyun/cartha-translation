lexical_decisions:
- source_word: εὐλαβήθη
  choice: испугался
  rationale: Аорист медиально-пассивной формы здесь выражает возникшее опасение из-за возможной нехватки средств; «испугался» естественно передаёт и страх, и начинательный оттенок.
- source_word: μὴ οὐκ ἔχῃ
  choice: что у него не будет средств
  rationale: Конструкция обозначает опасение, что ресурсов окажется недостаточно. Слово «средств» следует из финансового контекста последующих расходов и даров.
- source_word: ὡς ἅπαξ καὶ δὶς
  choice: как уже бывало раз и другой
  rationale: Сохранён греческий оборот, указывающий на прежние повторявшиеся случаи, без сведения смысла к строго двум эпизодам.
- source_word: δαπάνας
  choice: расходы
  rationale: Прямой и естественный финансовый термин, подходящий к контексту царской казны.
- source_word: δόματα
  choice: дары
  rationale: Слово охватывает подарки, пожалования и иные раздачи, не сужая значение до специального административного термина.
- source_word: ἐδίδου
  choice: раздавал
  rationale: Имперфект передаёт обычное, повторявшееся в прошлом действие; «раздавал» естественно сочетается с множественным «дары».
- source_word: ἔμπροσθεν
  choice: прежде
  rationale: Здесь наречие имеет временное значение и отсылает к прежнему периоду щедрых раздач.
- source_word: δαψιλῇ χειρί
  choice: щедрой рукой
  rationale: Сохранена метафора греческого выражения, обозначающего обильную и великодушную раздачу.
