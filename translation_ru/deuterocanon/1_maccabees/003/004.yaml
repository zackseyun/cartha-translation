translation:
  language: ru
  text: И в своих деяниях он уподобился льву, а был словно львёнок, рычащий в поисках добычи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡμοιώθη
  choice: уподобился
  rationale: Аорист пассивного глагола выражает сопоставление, а не превращение. «Уподобился» естественно передаёт сравнение и сохраняет возвышенный повествовательный тон.
- source_word: Λέοντι
  choice: льву
  rationale: Дательный падеж обозначает предмет сравнения при ὡμοιώθη; по-русски это естественно передаётся конструкцией «уподобился льву».
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: в своих деяниях
  rationale: ἔργα здесь означает поступки и воинские подвиги героя. «Деяния» ясно, ёмко и уместно для героического повествования.
- source_word: σκύμνος
  choice: львёнок
  rationale: Слово обозначает детёныша или молодого льва. «Львёнок» точно сохраняет отличие от предшествующего образа взрослого льва и звучит современно.
- source_word: ἐρυγόμενος
  choice: рычащий
  rationale: Причастие описывает мощный голос хищника. «Рычащий» хорошо сочетается с образом львёнка; возможное «ревущий» в данном контексте звучит менее естественно.
- source_word: εἰς θήραν
  choice: в погоне за добычей
  rationale: Оборот передаёт направленность к охоте или добыче. Выбранная формулировка сохраняет динамику хищной погони и естественна по-русски.
