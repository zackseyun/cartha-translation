lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Но мы
  rationale: δέ противопоставляет говорящих упомянутому ранее противнику, а явно выраженное ἡμεῖς подчёркивает «мы».
- source_word: πολεμοῦμεν
  choice: сражаемся
  rationale: Настоящее время передаёт совершающееся или предстоящее в непосредственной ситуации сражение; «сражаемся» естественно звучит в военном контексте.
- source_word: περὶ
  choice: за
  rationale: При глаголе со значением борьбы περί указывает на то, что поставлено на карту и что защищают.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: за свои жизни
  rationale: ψυχή может обозначать душу или жизнь. В контексте вооружённой борьбы основным является конкретный смысл «жизнь»; возвратное «свои» естественно соотносит жизни с подлежащим «мы».
- source_word: τῶν νομίμων ἡμῶν
  choice: свои законы
  rationale: νόμιμα охватывает установленные законом нормы и обычаи, в данном контексте — также унаследованные религиозно-правовые установления. «Законы» кратко и понятно передаёт основную силу выражения.
theological_decisions:
- issue: Значение ψυχαί в военном контексте
  choice: жизни
  alternative: души
  rationale: Речь идёт о вооружённой борьбе и физическом выживании. Выбор «жизни» не навязывает тексту антропологическое противопоставление души и тела, которого контекст не требует; подлинная многозначность отмечена в сноске.
- issue: Объём значения νόμιμα
  choice: законы
  alternative: законные обычаи; отеческие установления
  rationale: Слово включает не только отвлечённое законодательство, но и закреплённый преданием религиозно-общественный уклад. Основной текст сохраняет ясность и вес понятия, а более широкие оттенки указаны в сноске.
