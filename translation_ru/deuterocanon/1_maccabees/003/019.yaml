translation:
  language: ru
  text: Ибо победа в войне зависит не от многочисленности сил, но сила приходит с неба.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλήθει δυνάμεως
  choice: множества сил
  rationale: Сочетание обозначает значительную совокупность человеческих сил, вероятно военных, но не сводится прямо к численности войска. Русское «множество сил» сохраняет и количественный оттенок πλῆθος, и широкий смысл δύναμις.
- source_word: νίκη πολέμου
  choice: победа в войне
  rationale: Естественная современная русская передача генитивного сочетания, обозначающего победу в военном противостоянии.
- source_word: ἀλλʼ ἢ
  choice: но
  rationale: В данном противопоставлении греческий оборот имеет противительное значение; краткое «но» естественно связывает две части высказывания.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: Буквально сохраняет указание на небесный источник и не заменяет почтительное иносказание прямым упоминанием Бога.
- source_word: ἰσχύς
  choice: сила
  rationale: Передаёт физическую и действенную мощь; единственное число отражает греческий текст и противопоставляет небесную силу множеству собранных человеческих сил.
theological_decisions:
- issue: Следует ли раскрывать выражение ἐκ τοῦ οὐρανοῦ как прямое указание на Бога
  choice: сила приходит с неба
  alternative: сила приходит от Бога
  rationale: Греческий текст прямо говорит «с неба», используя характерное почтительное обозначение божественного источника. Перевод сохраняет образ и богословскую сдержанность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством краткого воинского увещания. «Зависит не от» естественно передаёт οὐκ ἐν… ἐστίν без неуклюжего буквального оборота; повтор корня «сил-» сохраняет смысловой контраст близких греческих слов δύναμις и ἰσχύς.
