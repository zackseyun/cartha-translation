  text: And they pursued them down the descent of Beth-horon as far as the plain[a], and about eight hundred of them fell; but the rest fled into the land of the Philistines.
translation:
  language: ru
  text: Они преследовали их по спуску Бет-Хорон до самой равнины. Из них пало около восьмисот человек, а остальные бежали в землю филистимлян.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίωκον
  choice: преследовали
  rationale: Имперфект описывает продолжавшееся преследование; русская форма прошедшего времени естественна для повествования и сохраняет длительный характер действия в контексте.
- source_word: ἐν τῇ καταβάσει Βαιθωρών
  choice: по спуску от Бет-Хорона
  rationale: κατάβασις обозначает спуск или нисходящий путь. Предлог «по» естественно передаёт движение по этому пути, а «от Бет-Хорона» ясно выражает географический смысл названия спуска в данном контексте.
- source_word: ἕως τοῦ πεδίου
  choice: до самой равнины
  rationale: ἕως указывает на предел преследования, а πέδιον — на равнинную местность; частица «самой» естественно подчёркивает достижение этого предела.
- source_word: ἔπεσον ἀπʼ αὐτῶν εἰς ἄνδρας ὀκτακοσίους
  choice: из них пало около восьмисот человек
  rationale: ἀπʼ αὐτῶν означает погибших из числа преследуемых; εἰς с числительным допускает приблизительное количество. «Пало» сохраняет обычную военную формулировку, не уточняя способ смерти.
- source_word: οἱ δὲ λοιποὶ
  choice: а остальные
  rationale: δέ обозначает переход с контрастом между павшими и уцелевшими; «а» звучит естественно в русском повествовании.
- source_word: ἔφυγον εἰς γῆν Φυλιστιείμ
  choice: бежали в землю филистимлян
  rationale: Перевод сохраняет буквальный географический образ «земли филистимлян» и направление движения, выраженное εἰς.
