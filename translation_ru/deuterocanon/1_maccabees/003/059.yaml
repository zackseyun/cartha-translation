  yaml_path: translation/deuterocanon/1_maccabees/003/059.yaml
  text: For it is better for us to die in battle than to look on at the evils of our nation and of the holy things[a].
translation:
  language: ru
  text: Ведь лучше нам умереть в бою, чем смотреть на бедствия нашего народа и святынь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилища», «святые места»; буквально по-гречески: «святые [вещи]».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: лучше
  rationale: Естественно передаёт сравнительную оценку предпочтительного исхода в призывном контексте.
- source_word: ἀποθανεῖν
  choice: умереть
  rationale: Прямой и нейтральный эквивалент инфинитива без дополнительной риторической окраски.
- source_word: ἐν πολέμῳ
  choice: в бою
  rationale: В непосредственном военном контексте обозначает гибель в сражении естественнее, чем более широкое «на войне».
- source_word: ἐφιδεῖν ἐπὶ
  choice: смотреть на
  rationale: Передаёт не просто зрительное восприятие, а положение очевидца, вынужденного наблюдать происходящее.
- source_word: τὰ κακά
  choice: бедствия
  rationale: В данном контексте речь идёт о несчастьях и пагубе, постигших народ и святыни; «бедствия» сохраняет широту значения, не ограничивая его только нравственным злом.
- source_word: τοῦ ἔθνους ἡμῶν
  choice: нашего народа
  rationale: Для исторической общности Израиля современное русское «народ» звучит естественно и не вносит позднейшего политического оттенка слова «нация».
- source_word: τῶν ἁγίων
  choice: святынь
  rationale: Субстантивированное прилагательное среднего рода во множественном числе обозначает священные предметы, места или весь комплекс святого; «святыни» сохраняет множественность и широту референции.
theological_decisions:
- issue: Референт τῶν ἁγίων
  choice: святынь
  alternative: святилища; святых мест; священных предметов
  rationale: Греческая форма среднего рода множественного числа исключает значение «святые» как людей. Перевод «святыни» не сужает выражение исключительно до Храма или отдельных предметов и сохраняет контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, энергичная фраза сохраняет характер воинского призыва. Выражение «нашего народа и святынь» передаёт общий родительный падеж после слова «бедствия» и не устраняет неоднозначность священного референта.
