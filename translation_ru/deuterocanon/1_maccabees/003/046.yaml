base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/046.yaml
  text: And they assembled and came to Mizpah[a], opposite Jerusalem, because formerly Mizpah had been a place of prayer for Israel.
translation:
  language: ru
  text: И они собрались и пришли в Массифу[a], напротив Иерусалима, потому что прежде Массифа была местом молитвы для Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицом к Иерусалиму». Греческое выражение обозначает положение напротив Иерусалима или перед ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: собрались
  rationale: Аористная пассивная форма здесь имеет непереходное собирательное значение; «собрались» естественно передаёт совместное действие.
- source_word: ἦλθοσαν
  choice: пришли
  rationale: С εἰς и обозначением места глагол передаёт движение к месту назначения; «пришли» сохраняет простоту повествования.
- source_word: Μασσηφά
  choice: Массифа
  rationale: Традиционная русская библейская форма названия этого места, понятная читателю и соответствующая греческой форме.
- source_word: κατέναντι Ἰερουσαλήμ
  choice: напротив Иерусалима
  rationale: κατέναντι обозначает положение напротив или перед чем-либо; основной текст сохраняет прямое пространственное значение.
- source_word: τόπος προσευχῆς
  choice: местом молитвы
  rationale: Фраза обозначает место, связанное с молитвой, не уточняя его институциональный или культовый статус.
- source_word: τὸ πρότερον
  choice: прежде
  rationale: Кратко и естественно указывает на более раннее время.
- source_word: τῷ Ἰσραήλ
  choice: для Израиля
  rationale: 'Дательный падеж понимается как дательный отношения или пользы: место служило Израилю местом молитвы.'
theological_decisions:
- issue: Характер Массифы как места поклонения
  choice: местом молитвы
  alternative: молитвенным домом; местом поклонения
  rationale: Греческий текст говорит лишь о месте молитвы и не называет его синагогой, святилищем или жертвенником; перевод не добавляет отсутствующей конкретизации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к греческому, но остаётся естественным; название «Массифа» дано в традиционной русской библейской форме.
