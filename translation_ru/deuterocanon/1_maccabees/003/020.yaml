    issue: Синтаксическое истолкование πλήθει ὕβρεως καὶ ἀνομίας чрезмерно закреплено в основном тексте.
    rationale: «Огромная масса, исполненная...» представляет множество как вражескую массу людей, наделённую качествами. Генитивы могут характеризовать и само множество как изобилие дерзости и беззакония. Более нейтральная русская передача сохраняет эту неопределённость.
  - severity: low
    issue: Слово «огромной» добавляет степень, прямо не выраженную отдельным греческим определением.
    rationale: πλήθει обозначает множество, но не содержит самостоятельного эквивалента «огромный». «Во множестве» передаёт количественный компонент без усиления.
