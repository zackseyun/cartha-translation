    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ἔρχονται πρὸς ἡμᾶς
  choice: Они идут против нас
  rationale: В военном контексте πρός с винительным обозначает враждебное движение; «против нас» ясно передаёт направленность нападения.
- source_word: πλήθει ὕβρεως καὶ ἀνομίας
  choice: огромной массой, исполненной наглости и беззакония
  rationale: πλήθει буквально обозначает множество или массу, а родительные ὕβρεως и ἀνομίας характеризуют её. Добавленное «исполненной» делает необычную греческую конструкцию понятной по-русски, не устраняя её образность.
- source_word: ὕβρεως
  choice: наглости
  rationale: ὕβρις здесь означает вызывающую, насильственную дерзость и надменность; «наглость» передаёт не только внутреннюю гордость, но и оскорбительное поведение.
- source_word: ἀνομίας
  choice: беззакония
  rationale: «Беззаконие» сохраняет прямую связь ἀνομία с попранием закона и одновременно её нравственный смысл.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: чтобы истребить нас
  rationale: Артиклевый инфинитив выражает цель, а ἐξαίρω в данном контексте — полное устранение или уничтожение. «Истребить» естественно передаёт намерение уничтожить людей.
- source_word: τὰς γυναῖκας ἡμῶν καὶ τὰ τέκνα ἡμῶν
  choice: наших жён и наших детей
  rationale: γυναῖκες с притяжательным местоимением здесь естественнее всего понимать как «жёны»; повтор «наших» сохраняет выразительное повторение греческого текста.
- source_word: τοῦ σκυλεῦσαι ἡμᾶς
  choice: и ограбить нас
  rationale: σκυλεύω означает отнимать добычу, обирать или грабить побеждённых. «Ограбить нас» ясно и естественно передаёт этот смысл без добавления отсутствующего в тексте объекта.
