  verdict: revise
  source_fidelity: 'Начальное «Они идут против нас» верно передаёт враждебно направленное πρὸς ἡμᾶς. Обе целевые конструкции переданы точно: ἐξᾶραι — «истребить», а σκυλεῦσαι — «ограбить/разграбить». Однако «огромной массой, исполненной наглости и беззакония» слишком определённо превращает πλήθει в массу людей и приписывает этой массе образ «исполненной» абстрактных качеств. Греческое πλήθει ὕβρεως καὶ ἀνομίας допускает также понимание как изобилия наглости и беззакония; это следует оставить открытым в основном тексте.'
