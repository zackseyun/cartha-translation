  terminology: «Беззаконие» удачно передаёт ἀνομία. Для ὕβρις «наглость» допустима, хотя «дерзость» несколько лучше передаёт вызывающую, насильственную самонадеянность без разговорного оттенка. «Истребить» и «ограбить» уместны в контексте.
  issues:
