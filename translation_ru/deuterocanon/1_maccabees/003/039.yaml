  text: And he sent with them forty thousand men and seven thousand cavalry[a], to come into the land of Judah and destroy it[b], according to the word of the king.
translation:
  language: ru
  text: И он послал с ними сорок тысяч человек и семь тысяч всадников[a], чтобы войти в землю Иуды и уничтожить её по слову царя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семь тысяч коней»; в данном военном перечне «кони», вероятно, обозначают всадников, то есть конное войско.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по приказу царя». Греческое выражение буквально означает «по слову царя», но в этом контексте слово царя имеет силу приказа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: 'Аорист передаёт завершённое действие: отправку войска вместе с ранее названными военачальниками. «Послал» естественно и точно.'
- source_word: μετʼ αὐτῶν
  choice: с ними
  rationale: Прямо указывает, что войско было отправлено вместе с ранее упомянутыми лицами.
- source_word: τεσσεράκοντα χιλιάδας ἀνδρῶν
  choice: сорок тысяч человек
  rationale: Сохраняет буквальное значение ἀνδρῶν, не добавляя отсутствующего в греческом тексте слова «воинов».
- source_word: ἑπτακισχιλίον ἵππον
  choice: семь тысяч всадников
  rationale: ἵππος буквально означает «конь», но в перечне военных сил метонимически обозначает конное войско. По-русски исчисляемое «всадников» естественнее, чем «семь тысяч конницы».
- source_word: τοῦ ἐλθεῖν
  choice: чтобы войти
  rationale: Артиклевый инфинитив выражает цель; «войти» естественно передаёт движение εἰς, направленное в пределы земли Иуды.
- source_word: εἰς γῆν Ἰούδα
  choice: в землю Иуды
  rationale: Сохраняет греческое географическое выражение, не заменяя его более интерпретирующим названием «Иудея».
- source_word: καταφθεῖραι
  choice: уничтожить
  rationale: Передаёт сильное и широкое значение разрушительного действия, не уточняя способ разорения сверх исходного текста.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: по слову царя
  rationale: Сохраняет λόγος как «слово», при этом контекст позволяет понимать его как властное распоряжение.
