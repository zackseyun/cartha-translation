  text: And he was greatly troubled in his soul[a], and he decided to go into Persia[b], to collect the taxes of the regions and to gather much silver.
translation:
  language: ru
  text: И он сильно тревожился в душе[a] и решил отправиться в Персию, чтобы собрать подати с земель и собрать много серебра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был в сильном замешательстве» или «испытывал большие затруднения»; греческий глагол может обозначать как растерянность, так и тяжёлое затруднение.'
    reason: lexical_alternative
  - marker: b
    text: Под «серебром» здесь, вероятно, понимаются денежные средства — серебро в монетах или на вес, а не только необработанный металл.
    reason: cultural_note
lexical_decisions:
- source_word: ἠπορεῖτο τῇ ψυχῇ αὐτοῦ σφόδρα
  choice: сильно смутился в душе
  rationale: Передаёт как внутреннее затруднение и растерянность, выраженные глаголом ἀπορέω, так и усиление σφόδρα; формулировка сохраняет образ души из греческого текста.
- source_word: ἐβουλεύσατο
  choice: решил
  rationale: Средний залог указывает на обдуманное принятие решения; «решил» естественно и точно звучит в современном русском повествовании.
- source_word: πορευθῆναι εἰς τὴν Περσίδα
  choice: отправиться в Персию
  rationale: «Отправиться» естественно передаёт целенаправленное путешествие, а «в Персию» соответствует направлению движения с εἰς.
- source_word: λαβεῖν τοὺς φόρους τῶν χωρῶν
  choice: собрать подати с тех земель
  rationale: φόροι в данном административно-финансовом контексте означает подати или дань; «подати» уместны для древней монархии, а «земли» не придают χῶραι излишне технического значения провинций.
- source_word: συναγαγεῖν ἀργύριον πολύ
  choice: накопить много серебра
  rationale: Сохраняет конкретное «серебро» греческого текста, которое здесь обозначает также денежные средства; «накопить» передаёт результативный оттенок собирания значительной суммы.
