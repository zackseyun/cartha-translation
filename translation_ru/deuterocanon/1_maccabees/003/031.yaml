- from: И он сильно смутился в душе[a] и решил отправиться в Персию, чтобы собрать подати с тех земель и накопить много серебра[b].
  to: И он сильно тревожился в душе[a] и решил отправиться в Персию, чтобы собрать подати с земель и собрать много серебра[b].
