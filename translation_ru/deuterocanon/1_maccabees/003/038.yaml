  yaml_path: translation/deuterocanon/1_maccabees/003/038.yaml
  text: And Lysias chose Ptolemy son of Dorymenes[a], Nicanor, and Gorgias, mighty men among the king’s friends.
translation:
  language: ru
  text: И Лисий избрал Птолемея, сына Доримена, Никанора и Горгия — могущественных людей из числа друзей царя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из числа придворных царя». В эллинистических монархиях выражение «друзья царя» могло быть придворным званием, а не просто указанием на личную дружбу.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: избрал
  rationale: Глагол означает выбор из числа возможных лиц; «избрал» точно передаёт это значение, не добавляя более узкого смысла официального назначения.
- source_word: Πτολεμαῖον τὸν Δορυμένους
  choice: Птолемея, сына Доримена
  rationale: Артикль с родительным падежом личного имени здесь естественно указывает на родственную, прежде всего отцовскую, связь; явное «сына» делает греческую идиому понятной по-русски.
- source_word: ἄνδρας δυνατοὺς
  choice: могущественных мужей
  rationale: ἄνδρας обозначает взрослых мужчин, а δυνατούς может выражать силу, влиятельность и способность действовать. В военном и придворном контексте «могущественных мужей» сохраняет широту этих оттенков.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: из числа друзей царя
  rationale: Родительный оборот относит названных лиц к кругу царских «друзей». Выражение «из числа» естественно передаёт принадлежность к этой группе, а буквальное «друзей царя» сохраняет возможный придворный титул.
