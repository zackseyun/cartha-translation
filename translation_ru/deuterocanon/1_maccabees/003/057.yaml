lexical_decisions:
- source_word: ἀπῆρεν
  choice: выступил
  rationale: В контексте передвижения войска форма глагола означает сняться с места и отправиться в путь; «выступил» естественно сочетается с собирательным субъектом «стан» и сохраняет военный оттенок.
- source_word: ἡ παρεμβολή
  choice: стан
  rationale: Слово обозначает военный лагерь и метонимически находящееся в нём войско. «Стан» позволяет сохранить греческий собирательный образ и приподнятый исторический регистр.
- source_word: παρενεβάλοσαν
  choice: они расположились
  rationale: Глагол в данном военно-походном контексте означает разбить лагерь. Множественное число сохранено после собирательного «стан», как и смена числа в греческом тексте.
- source_word: κατὰ νότον
  choice: к югу от
  rationale: Оборот указывает на местоположение относительно Эммауса, а не просто на направление движения.
- source_word: Ἀμμαούμ
  choice: Эммауса
  rationale: Использована традиционная русская форма географического названия «Эммаус», поставленная в родительный падеж после оборота «к югу от».
