  yaml_path: translation/deuterocanon/1_maccabees/003/058.yaml
  text: And Judas said[a], “Gird yourselves, and become mighty men[b], and be ready in the morning to fight against these nations that have assembled against us to destroy us and our holy things.”
translation:
  language: ru
  text: 'Иуда сказал: «Препояшьтесь, станьте доблестными мужами[a] и будьте готовы утром сразиться с этими народами, которые собрались против нас, чтобы уничтожить нас и наши святыни[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «станьте сильными сынами»; то есть покажите себя доблестными мужами.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наше святилище». Греческое слово стоит во множественном числе и может обозначать священные предметы, святые места или весь храмовый комплекс.'
    reason: alternative_reading
lexical_decisions:
- source_word: Περιζώσασθε
  choice: Препояшьтесь
  rationale: Средний залог повелительного наклонения буквально передаёт действие «препоясаться»; это образное воинское побуждение приготовиться к бою. Русское «препояшьтесь» сохраняет образ и торжественный воинский тон.
- source_word: γίνεσθε εἰς υἱοὺς δυνατούς
  choice: станьте доблестными мужами
  rationale: Буквально греческий текст говорит «станьте сильными сынами», однако оборот идиоматически означает мужественных, доблестных воинов. «Доблестными мужами» естественно звучит по-русски, сохраняет мужской род исходного выражения и его воинскую силу; буквальная форма отмечена в сноске.
- source_word: ἕτοιμοι
  choice: будьте готовы
  rationale: Прямой и естественный русский эквивалент в контексте приготовления к предстоящему сражению.
- source_word: εἰς τὸ πρωῒ
  choice: утром
  rationale: Оборот указывает на утро как время предстоящего боя. «Утром» передаёт это прямо, не уточняя сверх текста, идёт ли речь именно о рассвете.
- source_word: πολεμῆσαι
  choice: сразиться
  rationale: В данном военном контексте «сразиться» естественно передаёт совершение предстоящего боя и сочетается с противником, обозначенным далее.
- source_word: ἔθνεσιν
  choice: народами
  rationale: Греческое слово обозначает народы или иноплеменные нации. «Народы» сохраняет широкий этнополитический смысл, тогда как «язычники» сильнее подчёркивало бы религиозное различие, не обязательное в этой фразе.
- source_word: ἐπισυνηγμένοις
  choice: которые собрались
  rationale: Перфектное причастие описывает народы как уже собравшиеся против Иуды и его людей. Русское придаточное естественно передаёт результирующее состояние.
- source_word: ἐξᾶραι
  choice: истребить
  rationale: В контексте вражеского войска глагол означает устранить посредством уничтожения. «Истребить» передаёт угрозу полного уничтожения людей и святынь.
- source_word: τὰ ἅγια ἡμῶν
  choice: наши святыни
  rationale: 'Субстантивированное множественное число буквально обозначает «наше святое» или «наши святые предметы/места». Русское множественное «святыни» естественно сохраняет широту: это могут быть священные предметы, места или храмовый комплекс.'
theological_decisions:
- issue: Мужское воинское выражение γίνεσθε εἰς υἱοὺς δυνατούς
  choice: станьте доблестными мужами
  alternative: 'буквально: «станьте сильными сынами»; также возможно: «будьте сильными мужами»'
  rationale: Упоминание «сынов» сохранено в сноске как формальная особенность исходного текста, но в основном тексте выбран понятный русский идиоматический оборот без гендерной нейтрализации.
- issue: Референт τὰ ἅγια ἡμῶν
  choice: наши святыни
  alternative: наше святилище
  rationale: Греческое множественное число допускает как священные предметы и места вообще, так и храмовый комплекс. Основной текст не сужает значение до одного здания, а более узкое понимание указано в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным воинским тоном. «Препояшьтесь» намеренно сохраняет яркий образ исходного текста; синтаксис остальной фразы сделан естественным и общепонятным. Все сноски привязаны к соответствующим выражениям основного текста.
