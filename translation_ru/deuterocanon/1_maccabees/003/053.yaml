  yaml_path: translation/deuterocanon/1_maccabees/003/053.yaml
  text: How will we be able to stand before them[a], unless you help us?
translation:
  language: ru
  text: Как же мы сможем устоять перед ними[a], если Ты не поможешь нам?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устоять против них»; греческое выражение может означать противостояние врагам лицом к лицу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: Как же
  rationale: Вводит риторический вопрос о возможности; частица «же» естественно передаёт напряжённость вопроса, не добавляя нового смысла.
- source_word: δυνησόμεθα
  choice: мы сможем
  rationale: Будущая форма δύναμαι обозначает способность в предстоящей ситуации; «сможем» сохраняет и будущее значение, и сомнение в собственных силах.
- source_word: ὑποστῆναι
  choice: устоять
  rationale: В контексте противостояния глагол означает выдержать натиск, не отступить; «устоять» естественно сочетает значение стояния и сопротивления.
- source_word: κατὰ πρόσωπον αὐτῶν
  choice: перед ними
  rationale: Выражение буквально связано с пребыванием лицом к лицу и в данном военном контексте обозначает противостояние. «Перед ними» сохраняет образ и допускает контекстуальный смысл сопротивления.
- source_word: ἐὰν μὴ
  choice: если … не
  rationale: Условное выражение можно передать как «если не» или «если только не»; здесь «если Ты не» звучит естественно и сохраняет условную форму оригинала.
- source_word: σὺ
  choice: Ты
  rationale: Явно выраженное местоимение имеет смысловое ударение. В обращении к Богу прописная буква соответствует принятому русскому издательскому употреблению, а само местоимение сохраняет акцент оригинала.
- source_word: βοηθήσῃς
  choice: поможешь
  rationale: Глагол означает помочь, прийти на помощь. Простое «поможешь» ясно и непосредственно передаёт молитвенную просьбу.
- source_word: ἡμῖν
  choice: нам
  rationale: Дательный падеж при βοηθέω естественно передаётся русской конструкцией «помочь нам».
theological_decisions:
- issue: Обращение к Богу в просьбе о помощи перед сражением
  choice: Сохранено прямое обращение во втором лице без уточнения характера ожидаемой помощи
  alternative: «если Ты не придёшь нам на помощь»
  rationale: Греческий текст подчёркивает зависимость говорящих от Божьей помощи, но не раскрывает здесь, каким именно образом она будет оказана. Перевод не добавляет обещания победы или иных богословских выводов.
translation_notes:
  register: Современный литературный русский язык; молитвенная речь передана прямо и торжественно, но без архаизмов. Сохранена смысловая неоднозначность выражения о стоянии перед противником.
