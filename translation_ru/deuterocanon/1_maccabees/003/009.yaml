  source_fidelity: '«И имя его стало известно до краёв земли» точно передаёт идиоматическую силу ὠνομάσθη ἕως ἐσχάτου τῆς γῆς: буквально речь о том, что он был «назван», но в данном контексте — о широко распространившейся известности. Добавление «имя его» естественно раскрывает подразумеваемое без существенного смыслового сдвига. «Собрал погибавших» хорошо передаёт συνήγαγεν ἀπολλυμένους и сохраняет значение продолжающейся гибели/угрозы гибели, не навязывая сотериологического смысла.'
  naturalness: Текст звучит естественно на современном литературном русском и сохраняет сжатый, повествовательный характер оригинала. Оборот «до краёв земли» нормативен и хорошо соответствует библейскому регистру без архаизации.
  terminology: Ключевые выражения переданы последовательно. «Погибавших» предпочтительнее «погибших», поскольку отражает настоящее причастие ἀπολλυμένους. Сноски уместно фиксируют буквальный вариант и смысловой диапазон, а их маркеры стоят у соответствующих словосочетаний.
