  text: And he was renowned to the ends of the earth[b][a], and he gathered those who were perishing.
translation:
  language: ru
  text: И имя его стало известно до краёв земли,[a] и он собрал погибавших.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он был назван до края земли»; речь может идти о том, что его имя или слава распространились до самых дальних пределов.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «тех, кто был на грани гибели» или «тех, кого уничтожали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠνομάσθη
  choice: имя его стало известно
  rationale: Аорист пассива от ὀνομάζω буквально означает «был назван», но здесь в сочетании с указанием на пределы земли передаёт широкую известность имени; выбран естественный русский оборот без усиления до «прославился».
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: до краёв земли
  rationale: Устойчивый пространственный оборот, обозначающий самые дальние пределы земли; множественное «краёв» естественно в современном русском.
- source_word: συνήγαγεν
  choice: собрал
  rationale: Прямое и контекстуально естественное соответствие аористу συνάγω.
- source_word: ἀπολλυμένους
  choice: погибавших
  rationale: Причастие настоящего времени передаёт людей, находившихся в процессе гибели или под угрозой уничтожения; формулировка сохраняет эту незавершённость и не превращает выражение в богословскую категорию «погибших».
theological_decisions:
- issue: Значение ἀπολλυμένους
  choice: погибавших
  alternative: заблудших / погибших / тех, кого уничтожали
  rationale: Военно-исторический контекст допускает гибель, разорение или угрозу уничтожения. Выбрано широкое выражение, не привносящее сотериологического смысла и сохраняющее аспект продолжающегося бедствия.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Порядок частей и повтор союза «и» сохраняют строй греческой фразы; лексика остаётся понятной обычному читателю.
