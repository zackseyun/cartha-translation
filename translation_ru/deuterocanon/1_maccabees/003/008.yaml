  text: And he went through the cities of Judah[a], and destroyed the ungodly from it[b], and turned away wrath from Israel.
translation:
  language: ru
  text: И прошёл он по городам Иудеи, и истребил в ней нечестивых[a], и отвратил гнев[b] от Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безбожных»; также возможно: «злых».'
    reason: lexical_alternative
  - marker: b
    text: По контексту, вероятно, имеется в виду Божий гнев, хотя в самом стихе Бог прямо не назван.
    reason: alternative_reading
lexical_decisions:
- source_word: διῆλθεν ἐν πόλεσιν Ἰούδα
  choice: прошёл по городам Иудеи
  rationale: Глагол передаёт движение через ряд мест; конструкция с ἐν здесь естественно выражается по-русски как «по городам». Родительный Ἰούδα имеет территориальный смысл, поэтому выбрано современное и ясное «Иудеи».
- source_word: ἐξωλόθρευσεν
  choice: истребил
  rationale: Сильный глагол означает уничтожение или полное устранение. «Истребил» сохраняет суровость греческого выражения и не уточняет способ действия.
- source_word: ἀσεβεῖς
  choice: нечестивых
  rationale: Слово характеризует людей как непочтительных к Богу и нарушающих установленный религиозно-нравственный порядок. «Нечестивые» сохраняет эту направленность точнее, чем более широкое «злые».
- source_word: ἐπʼ αὐτῆς
  choice: в ней
  rationale: Местоимение женского рода естественно отнесено к Иудее как земле. «В ней» сохраняет местоименную форму оригинала и ясно указывает на территорию.
- source_word: ἀπέστρεψεν ὀργὴν
  choice: отвратил гнев
  rationale: Сочетание означает, что гнев был отведён или устранён. «Отвратил гнев» близко к форме оригинала и сохраняет возвышенный библейский регистр.
- source_word: ἀπὸ Ἰσραήλ
  choice: от Израиля
  rationale: Предлог обозначает того, от кого был отведён гнев. Краткая формулировка сохраняет корпоративное значение имени «Израиль».
theological_decisions:
- issue: Чей гнев был отвращён от Израиля
  choice: В основном тексте оставлено просто «гнев», без названного носителя гнева.
  alternative: «гнев Божий» или понимание гнева как общего бедствия либо враждебности против Израиля
  rationale: В данном иудейском библейском контексте ὀργή, вероятно, подразумевает Божий гнев, однако сам стих прямо Бога не называет. Нейтральная формулировка сохраняет недосказанность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм трёх действий сохранён; архаизмы, кроме укоренившегося и точного выражения «отвратил гнев», не используются.
