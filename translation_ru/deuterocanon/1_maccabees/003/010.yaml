  text: And Apollonius gathered Gentiles[a], and from Samaria a large force to wage war against Israel.
translation:
  language: ru
  text: И собрал Аполлоний язычников[a] и большое войско из Самарии, чтобы воевать против Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
