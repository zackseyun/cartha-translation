lexical_decisions:
- source_word: συνήγαγεν
  choice: собрал
  rationale: Аорист обозначает совершённое действие по собиранию людей; «собрал» естественно сочетается и с людьми, и с войском.
- source_word: ἔθνη
  choice: язычников
  rationale: В данном иудейском повествовательном контексте слово обозначает не принадлежащие к Израилю народы; «язычников» передаёт это противопоставление, хотя буквально возможно «народы».
- source_word: δύναμιν μεγάλην
  choice: большое войско
  rationale: Здесь δύναμις означает военную силу, то есть собранные войска; русское «большое войско» ясно и естественно в повествовательном контексте.
- source_word: τοῦ πολεμῆσαι
  choice: чтобы воевать
  rationale: Артиклевый инфинитив выражает цель; придаточное с «чтобы» естественно передаёт эту функцию по-русски.
- source_word: πρὸς Ἰσραήλ
  choice: против Израиля
  rationale: При глаголе войны πρὸς выражает направленность враждебного действия.
- source_word: ἀπὸ Σαμαρίας
  choice: из Самарии
  rationale: Предлог указывает на место происхождения войска; «из Самарии» — обычное русское выражение.
theological_decisions:
- issue: Передача ἔθνη в иудейском контексте войны
  choice: язычников
  alternative: народы
  rationale: Контекст противопоставляет собранные группы Израилю. «Язычников» сохраняет этнорелигиозное различие, не усиливая его до уничижительного обозначения; вариант «народы» отмечен в сноске как более буквальный.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Союз «И» сохранён как связь с предыдущим стихом; порядок компонентов слегка упорядочен ради естественности, при сохранении исходного смысла и неоднозначности ἔθνη.
