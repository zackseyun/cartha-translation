  text: And your holy things have been trampled down and profaned[a], and your priests are in mourning and humiliation.
translation:
  language: ru
  text: И Твои святыни[a] попраны и осквернены, и Твои священники — в трауре и унижении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилище Твоё» или «святое место Твоё»; греческое выражение стоит во множественном числе и буквально означает «Твои святыни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἅγιά σου
  choice: святыни Твои
  rationale: Существительное во множественном числе охватывает посвящённые Богу места и предметы, не сужая значение до одного храмового помещения.
- source_word: κατεπεπάτηται
  choice: попраны
  rationale: Передаёт совершённое над святынями насилие и сохраняющееся последствие, выраженные перфектом страдательного залога.
- source_word: βεβήλωται
  choice: осквернены
  rationale: Естественно передаёт лишение святого его священного статуса; в сочетании со «святынями» ясно выражает поругание посвящённого Богу.
- source_word: οἱ ἱερεῖς σου
  choice: священники Твои
  rationale: Обычное и контекстуально точное обозначение храмовых священнослужителей.
- source_word: ἐν πένθει
  choice: в скорби
  rationale: Передаёт состояние горя и траура в естественной для современного русского языка форме.
- source_word: ταπεινώσει
  choice: унижении
  rationale: Сохраняет значение униженного, бедственного положения и публичного бесчестья.
theological_decisions:
- issue: Объём значения τὰ ἅγιά σου
  choice: Широкое обозначение принадлежащих Богу святынь во множественном числе
  alternative: «святилище Твоё» или «святое место Твоё»
  rationale: Греческое множественное число допускает священные места и предметы в совокупности. Перевод «святыни» не ограничивает смысл единственным архитектурным объектом и сохраняет исходную широту.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимение «Твои» написано с прописной буквы как обращение к Богу; тире естественно передаёт отсутствие связки в греческом тексте.
