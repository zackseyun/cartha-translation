  source_fidelity: «Святыни Твои» точно сохраняет множественное число τὰ ἅγιά и не сужает значение до единственного храмового помещения. «Попраны и осквернены» адекватно передаёт два перфектных страдательных сказуемых κατεπεπάτηται и βεβήλωται. «Священники Твои» точно соответствует οἱ ἱερεῖς σου. Для ἐν πένθει более точным соответствием, чем более широкое «в скорби», будет «в трауре», поскольку речь идёт именно о состоянии траура/оплакивания. «В унижении» хорошо передаёт ταπεινώσει.
