  text: И, сняв лагерь, он пришёл в Дамаск и прошёл по всей области.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζεύξας
  choice: снявшись с места
  rationale: Причастие ἀναζεύξας указывает на снятие лагеря и выступление в путь; выражение сохраняет походный оттенок и естественно звучит в современном русском повествовании.
- source_word: ἦλθεν
  choice: пришёл
  rationale: При εἰς Δαμασκόν глагол обозначает прибытие в Дамаск; «пришёл» прямо передаёт форму и повествовательную перспективу греческого текста.
- source_word: διώδευσεν
  choice: прошёл
  rationale: Глагол означает движение через территорию; «прошёл по всей области» передаёт охват местности без добавления неявной цели путешествия.
- source_word: ἐν πάσῃ τῇ χώρᾳ
  choice: по всей области
  rationale: χώρα здесь обозначает территорию или область; «область» не придаёт слову современного значения государства, а предлог «по» естественно сочетается с русским глаголом движения.
- source_word: καὶ ... καὶ
  choice: И ... и
  rationale: Повтор καί выражает простую последовательность действий; начальное «И» сохраняет связность библейского повествования.
