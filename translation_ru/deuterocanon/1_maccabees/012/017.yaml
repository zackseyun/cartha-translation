lexical_decisions:
- source_word: ἡμᾶς
  choice: нас
  rationale: Прямое дополнение в первом лице множественного числа.
- source_word: δὲ
  choice: но
  rationale: Передаёт контраст с предшествующей мыслью.
- source_word: ἐκύκλωσαν
  choice: окружили
  rationale: Аорист κυκλόω передан русским совершенным видом; сохранён образ окружения, без добавления отсутствующего в греческом указания на длительность.
- source_word: πολλαὶ θλίψεις
  choice: многочисленные бедствия
  rationale: θλίψεις обозначает тяжёлые обстоятельства, притеснения и невзгоды; «бедствия» естественно и достойно звучит в данном историческом контексте. «Многочисленные» позволяет избежать тяжеловесного повтора при сохранении количества.
- source_word: καὶ
  choice: и
  rationale: Простая сочинительная связь двух однородных подлежащих.
- source_word: πόλεμοι πολλοί
  choice: многие войны
  rationale: πόλεμοι означает войны или вооружённые конфликты шире отдельных сражений; порядок определения отражает греческое расположение и акцент.
