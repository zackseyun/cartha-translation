  text: Jonathan the high priest of the nation[a], and the council of elders, and the priests, and the rest of the people of the Jews, to their Spartan brothers[b], greetings.
translation:
  language: ru
  text: 'Ионафан, первосвященник народа[a], и совет старейшин, и священники, и остальной иудейский народ — спартанцам, братьям[b]: приветствие.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иудейского народа». Греческое слово может обозначать народ как этническое и политическое сообщество.'
    reason: lexical_alternative
  - marker: b
    text: Слово «братья» выражает язык дипломатического родства и не обязательно означает кровное родство.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшееся и точное русское наименование этой иудейской должности.
- source_word: τοῦ ἔθνους
  choice: народа
  rationale: Передаёт принадлежность должности Ионафана ко всему национально-политическому сообществу, не опуская явно выраженное определение.
- source_word: ἡ γερουσία
  choice: совет старейшин
  rationale: Прозрачно обозначает руководящий орган старейшин и не вызывает современных ассоциаций, возможных при слове «сенат».
- source_word: ὁ λοιπὸς δῆμος τῶν Ἰουδαίων
  choice: остальной иудейский народ
  rationale: Естественно по-русски отличает всю остальную общину от уже названных старейшин и священников; прилагательное «иудейский» сохраняет этнополитическую и религиозную многозначность.
- source_word: Σπαρτιάταις
  choice: спартанцам
  rationale: Обычное и ясное русское обозначение адресатов.
- source_word: τοῖς ἀδελφοῖς
  choice: своим братьям
  rationale: Сохраняет прямое именование дипломатического родства; местоимение «своим» естественно связывает приложение с адресантами.
- source_word: χαίρειν
  choice: приветствие
  rationale: Передаёт принятую эллинистическую эпистолярную формулу, а не буквальное повеление радоваться.
theological_decisions:
- issue: Смысл обращения к спартанцам как к братьям
  choice: Сохранено «своим братьям» как заявленное в письме дипломатическое родство.
  alternative: «родственникам» или «друзьям»
  rationale: Греческий текст прямо называет адресатов братьями; перевод не должен ни ослаблять, ни дополнительно подтверждать историческую буквальность этого заявления.
translation_notes:
  register: Современный литературный русский язык с достоинством официального письма. Именительный перечень и тире перед адресатом воспроизводят краткую эпистолярную надпись естественнее, чем многократное повторение союза «и»; смысловые элементы греческого текста сохранены.
