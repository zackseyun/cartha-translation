translation:
  language: ru
  text: Ионафан услышал, что военачальники Димитрия вернулись с гораздо большим войском, чем прежде, чтобы воевать против него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямое соответствие повествовательному аористу; слово естественно охватывает получение известия, не уточняя его источник.
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: военачальники Димитрия
  rationale: В военном контексте ἄρχοντες обозначает руководителей или начальников; «военачальники» ясно передаёт их функцию, не приписывая им царской власти.
- source_word: ἐπέστρεψαν
  choice: вернулись
  rationale: Глагол обозначает возвращение. Русская форма прошедшего времени естественно выражает действие, о котором услышал Ионафан, без необходимости вводить специальную форму предпрошедшего времени.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: с гораздо большим войском
  rationale: δύναμις в данном военном повествовании означает вооружённые силы; вместе с ὑπὲρ τὸ πρότερον выражение указывает, что войско было значительно больше прежнего.
- source_word: ὑπὲρ τὸ πρότερον
  choice: чем прежде
  rationale: Сравнительный оборот сопоставляет нынешнее войско с прежним; выбранная формулировка кратка и естественна по-русски.
- source_word: τοῦ πολεμῆσαι πρὸς αὐτόν
  choice: чтобы воевать против него
  rationale: Артиклевый инфинитив выражает цель, а πολεμέω указывает на ведение войны или продолжительную вооружённую борьбу, а не только на отдельное столкновение.
