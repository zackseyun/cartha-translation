  text: And Jonathan went out to meet him with forty thousand chosen men for battle[a], and he came to Beth-shan.
translation:
  language: ru
  text: И вышел Ионафан навстречу ему с сорока тысячами отборных воинов для сражения[a] и пришёл в Бефсан.
  philosophy: optimal-equivalence
