    text: 'Или: «для построения в боевой порядок»; греческое выражение может обозначать боевой строй или развёртывание войска.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Прямо передаёт аорист ἐξέρχομαι и сохраняет простое повествовательное движение без добавления военного оттенка.
- source_word: εἰς ἀπάντησιν αὐτῷ
  choice: навстречу ему
  rationale: Естественно передаёт устойчивый оборот со значением выхода для встречи с кем-либо; контекст сам определяет характер встречи.
- source_word: ἐν τεσσεράκοντα χιλιάσιν ἀνδρῶν
  choice: с сорока тысячами … воинов
  rationale: Предлог ἐν здесь имеет сопроводительное значение. Хотя ἀνδρῶν буквально означает «мужчин», военный контекст и выражение εἰς παράταξιν делают «воинов» естественным и недвусмысленным русским соответствием.
- source_word: ἐπιλεγμέναις
  choice: отборных
  rationale: Передаёт значение специально отобранных людей и естественно сочетается в русском языке с военным обозначением «воины».
- source_word: εἰς παρατάξιν
  choice: для сражения
  rationale: Выражает военное назначение отобранных воинов ясным современным языком; более буквальный образ построения в боевой порядок сохранён в сноске.
- source_word: ἦλθεν εἰς Βεθσάν
  choice: пришёл в Бефсан
  rationale: Сохраняет отдельный глагол движения и пункт назначения. «Бефсан» — традиционная русская библейская форма топонима Βεθσάν.
