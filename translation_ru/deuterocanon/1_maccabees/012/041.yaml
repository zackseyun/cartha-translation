  source_fidelity: 'Текст точно передаёт последовательность греческого повествования: Ионафан выходит навстречу неназванному здесь мужчине, сопровождаемый сорока тысячами отобранных людей, и прибывает в Бефсан. «Воины» несколько конкретизирует буквальное ἀνδρῶν («мужчины/люди»), но такая конкретизация надёжно обусловлена непосредственным военным контекстом и εἰς παρατάξιν; смысла не меняет. «Для сражения» допустимо передаёт целевую военную направленность, а более узкое значение построения/боевого строя корректно сохранено в сноске.'
