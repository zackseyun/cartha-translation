  yaml_path: translation/deuterocanon/1_maccabees/012/025.yaml
  text: And he set out from Jerusalem and met them in the land of Hamath, for he gave them no respite to enter his land.
translation:
  language: ru
  text: Он выступил из Иерусалима и встретил их в земле Хамат, потому что не дал им времени войти в его землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆρεν
  choice: выступил
  rationale: Глагол обозначает отправление в путь; «выступил» естественно передаёт начало военного похода в данном контексте.
- source_word: ἀπήντησεν αὐτοῖς
  choice: встретил их
  rationale: Прямое и естественное соответствие греческому выражению без добавления явно не названного столкновения.
- source_word: τὴν Ἀμαθεῖτιν χώραν
  choice: земле Хамат
  rationale: Передаёт географическое название как «Хамат» и сохраняет значение χώρα — «земля, область».
- source_word: ἀνοχὴν
  choice: времени
  rationale: Здесь слово означает отсрочку или возможность, предоставленную промедлением; выражение «не дал им времени» ясно передаёт смысл в сочетании с инфинитивом.
- source_word: ἐμβατεῦσαι
  choice: войти
  rationale: В контексте вторжения в территорию обозначает вступление, проникновение в землю; нейтральное «войти» не усиливает текст.
