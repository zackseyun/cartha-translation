  text: And they learned that he had been captured and had perished[a], and those with him; and they encouraged one another and went on in close formation, ready for battle.
translation:
  language: ru
  text: И они узнали, что он и те, кто был с ним, были схвачены и погибли; тогда они ободрили друг друга[a] и двинулись дальше сомкнутым строем, готовые к бою.
