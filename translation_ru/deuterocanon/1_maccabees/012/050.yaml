    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: узнали
  rationale: В повествовательном контексте глагол означает, что до них дошли сведения или им стало известно о случившемся; «узнали» звучит естественно и точно.
- source_word: συνελήμφθη
  choice: схвачен
  rationale: Аорист пассивного залога от συλλαμβάνω обозначает захват; краткая форма сохраняет соотнесённость с последующим «погиб».
- source_word: ἀπώλωλεν
  choice: погиб
  rationale: Перфект ἀπόλλυμι здесь указывает на гибель, не уточняя её обстоятельств; «погиб» передаёт этот смысл без лишней конкретизации.
- source_word: οἱ μετʼ αὐτοῦ
  choice: бывшие с ним
  rationale: Формулировка сохраняет широту греческого выражения и не добавляет отсутствующего в тексте указания на пол или статус спутников.
- source_word: παρεκάλεσαν ἑαυτούς
  choice: ободрили друг друга
  rationale: Буквальное возвратное выражение в отношении группы естественно передаёт взаимное укрепление духа; русский взаимный оборот яснее, чем буквальное «ободрили себя».
- source_word: ἐπορεύοντο
  choice: пошли дальше
  rationale: Нейтральный глагол движения соответствует повествовательному значению; военный характер движения выражен последующими словами.
- source_word: συνεστραμμένοι
  choice: сомкнутым строем
  rationale: Причастие описывает людей, собравшихся плотно вместе; в военной сцене «сомкнутым строем» естественно передаёт образ организованного тесного построения.
- source_word: ἕτοιμοι εἰς πόλεμον
  choice: готовые к бою
  rationale: В данном непосредственном столкновении πόλεμος уместно передать как «бой», а не более широкое «война».
