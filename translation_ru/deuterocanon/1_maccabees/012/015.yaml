base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/015.yaml
  text: Therefore we continually remember you at all times[a], at the festivals and on the other appointed days, when we offer sacrifices and in our prayers[b], as it is right and fitting to remember brothers.
translation:
  language: ru
  text: Поэтому мы всегда и непрестанно вспоминаем о вас — на праздниках и в другие положенные дни[a], когда приносим жертвы, а также в наших молитвах, как и должно и подобает вспоминать о братьях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в другие подобающие дни»; речь идёт о днях, которые надлежало или было принято соблюдать.'
    reason: лексическая и культурная неоднозначность выражения καθηκούσαις ἡμέραις
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: непрестанно
  rationale: Передаёт постоянство и регулярность поминовения; в сочетании с «всегда» сохраняет оба элемента греческого выражения ἐν παντὶ καιρῷ ἀδιαλείπτως.
- source_word: ἑορταῖς
  choice: праздниках
  rationale: Естественное современное обозначение религиозных праздничных дней.
- source_word: καθηκούσαις ἡμέραις
  choice: положенные дни
  rationale: Сохраняет значение дней, предписанных или подобающих для соблюдения, не уточняя сверх текста, кем именно они установлены.
- source_word: μνημονεύομεν ὑμῶν
  choice: вспоминаем о вас
  rationale: Естественно по-русски передаёт как память, так и молитвенно-богослужебное упоминание в данном контексте.
- source_word: ἐφʼ ὧν
  choice: когда
  rationale: Идиоматично выражает временную связь с названными праздниками и положенными днями.
- source_word: προσφέρομεν θυσίων
  choice: приносим жертвы
  rationale: Стандартно и ясно передаёт культовое действие, несмотря на необычный генитив θυσίων.
- source_word: προσευχαῖς
  choice: молитвах
  rationale: Сохраняет множественное число и литургический контекст повторяющихся молитв.
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: как и должно и подобает
  rationale: 'Передаёт оба оттенка: должное и уместное; формула звучит достойно и естественно в русском библейском регистре.'
- source_word: ἀδελφῶν
  choice: братьях
  rationale: Сохраняет мужской множественный род и значение братского, общинного родства без инклюзивного расширения.
theological_decisions:
- issue: Значение родственного термина ἀδελφῶν
  choice: братьях
  alternative: соплеменниках
  rationale: Буквальное «братьях» сохраняет богословски и дипломатически значимый язык братства; контекст может подразумевать общинно-этническое родство, но не требует заменять образ толкованием.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Синтаксис сглажен для естественности, но сохранены повторность «всегда и непрестанно», культовая лексика и братский термин оригинала.
