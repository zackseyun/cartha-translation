translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным и достойным звучанием. Начальное «И» сохранено как отражение греческой повествовательной связи. Формулировка не уточняет личности царей и не сужает характер военных действий сверх данных греческого текста.
