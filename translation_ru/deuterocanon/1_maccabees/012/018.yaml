lexical_decisions:
- source_word: ἐπολέμησαν
  choice: пошли на нас войной
  rationale: Аорист πολεμέω обозначает ведение войны или начало военных действий против кого-либо. Это естественное современное русское выражение передаёт полноценный военный смысл глагола и направленность действия на ἡμᾶς.
- source_word: οἱ βασιλεῖς
  choice: цари
  rationale: В данном контексте речь идёт об определённой группе правителей; в русском языке её определённость устанавливается контекстом без отдельного артикля.
- source_word: οἱ κύκλῳ ἡμῶν
  choice: окружавшие нас
  rationale: Субстантивированное сочетание с κύκλῳ и родительным местоимения указывает на царей, находившихся вокруг народа, то есть соседних правителей; причастный оборот естественно связывает это определение с «царями».
