lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Аорист прямо обозначает отправку военных сил; «послал» естественно и точно передаёт действие.
- source_word: δυνάμεις
  choice: войска
  rationale: Во множественном числе и в данном контексте слово обозначает военные силы или подразделения, а не отвлечённые «силы».
- source_word: ἵππον
  choice: конницу
  rationale: Форма единственного числа употреблена собирательно и обозначает конные войска.
- source_word: εἰς Γαλιλαίαν
  choice: в Галилею
  rationale: Предлог εἰς выражает направление движения внутрь области; русский винительный падеж естественно передаёт это значение.
- source_word: εἰς τὸ πεδίον τὸ μέγα
  choice: на Великую равнину
  rationale: πεδίον означает равнину, а повторное εἰς указывает место назначения. Прописная буква отражает вероятное употребление выражения как географического наименования.
- source_word: τοῦ ἀπολέσαι
  choice: чтобы уничтожить
  rationale: Артикулярный инфинитив выражает цель; «уничтожить» сохраняет широкое военное значение, не сводя его исключительно к глаголу «убить».
- source_word: πάντας τοὺς παρὰ Ἰωνάθου
  choice: всех, кто был с Ионафаном
  rationale: παρά при имени лица здесь указывает на связь, присутствие или принадлежность к его стороне; формулировка сохраняет эту смысловую широту.
