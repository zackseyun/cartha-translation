  text: And Simon rebuilt Adida in the Shephelah[b][a], and fortified it with gates and bars.
translation:
  language: ru
  text: И Симон отстроил[b] Адиду в Шефеле[a] и укрепил ворота и засовы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Шефела — холмистая предгорная область Иудеи; возможный перевод: «в низменности».'
    reason: cultural_note
  - marker: b
    text: 'Или: «построил Адиду»; греческий глагол в зависимости от контекста может означать как строительство, так и восстановление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: отстроил
  rationale: Глагол может означать как строительство, так и восстановление. «Отстроил» естественно передаёт вероятное восстановление уже существовавшего города, не утверждая непременно, что он был полностью разрушен.
- source_word: τὴν Ἀδιδὰ
  choice: Адиду
  rationale: Географическое название передано транслитерацией и поставлено в винительный падеж по нормам русского языка.
- source_word: ἐν τῇ σεφηλά
  choice: в Шефеле
  rationale: Сохранено собственное название историко-географической области; форма «Шефела» близка к исходному семитскому топониму, отражённому в греческом тексте.
- source_word: ὠχύρωσεν
  choice: укрепил
  rationale: В контексте городских оборонительных сооружений глагол означает сделать место защищённым, укрепить его.
- source_word: θύρας
  choice: воротами
  rationale: Для укреплённого города θύραι естественно обозначает ворота, а не бытовые двери.
- source_word: μοχλούς
  choice: засовами
  rationale: Слово обозначает запирающие брусья или засовы ворот; «засовы» ясно и естественно передаёт их назначение.
