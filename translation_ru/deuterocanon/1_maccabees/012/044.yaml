translation:
  language: ru
  text: 'И сказал он Ионафану: «Зачем ты поразил весь этот народ[a], когда нам не угрожает война?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол буквально означает «ударил», «поразил», «изрубил» или «отсек». Русское «поразил» сохраняет военный смысл, не уточняя, было ли речь о полном уничтожении народа.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνα τί
  choice: Зачем
  rationale: Переданная в греческом тексте последовательность вопросительных слов синтаксически шероховата, но по контексту выражает вопрос о причине или цели; русское «зачем» естественно передаёт этот смысл.
- source_word: ἔκοψας
  choice: изнурил
  rationale: У κόπτω основное значение связано с ударами и рубкой, но слово также может обозначать изнурение. В контексте Трифон говорит о приведённом Ионафаном многочисленном войске и далее предлагает распустить воинов, поэтому речь, вероятнее всего, об изнурительном выводе всего народа, а не о его истреблении. Сноска сохраняет буквальную образность и неоднозначность греческого слова.
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: весь этот народ
  rationale: λαός означает «народ» и само по себе не ограничено значением «войско»; близкий перевод сохраняет широту обозначения.
- source_word: πολέμου μὴ ἐνεστῶτος ἡμῖν
  choice: ведь войны у нас сейчас нет
  rationale: Причастная конструкция буквально говорит, что война не наступила и не стоит перед ними. Выбранная формулировка естественна по-русски и передаёт отсутствие непосредственной войны.
- source_word: τῷ Ἰωναθάν
  choice: Ионафану
  rationale: Дательный падеж обозначает адресата речи; употреблена традиционная русская форма библейского имени.
