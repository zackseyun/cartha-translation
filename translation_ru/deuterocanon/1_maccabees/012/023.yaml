  yaml_path: translation/deuterocanon/1_maccabees/012/023.yaml
  text: 'And we also write back to you: Your livestock and your possessions are ours[a], and ours are yours[c][b]. Therefore we are giving orders that they report this to you accordingly.'
translation:
  language: ru
  text: 'И мы также пишем вам в ответ: «Ваш скот и ваше имущество — наши, а наше — ваше»[a]. Поэтому мы велим сообщить вам то же самое[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ваш скот и ваше имущество — наши, а наше — ваше». Это дипломатическая формула союза и взаимной поддержки; она не обязательно означает отмену права собственности.'
    reason: cultural_note
  - marker: b
    text: 'Или: «сообщить вам в том же смысле». В греческом тексте содержание сообщения прямо не названо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιγράφομεν
  choice: пишем вам в ответ
  rationale: В эпистолярном контексте глагол означает письменный ответ, а не простое копирование; формулировка сохраняет взаимный характер переписки.
- source_word: κτήνη
  choice: скот
  rationale: Обозначает домашних хозяйственных животных; «скот» естественно и точно передаёт значение в формуле об имуществе.
- source_word: ὕπαρξις
  choice: имущество
  rationale: Здесь слово обозначает материальное достояние или собственность в собирательном смысле.
- source_word: ἐντελλόμεθα
  choice: поручаем
  rationale: Передаёт официальное распоряжение, не придавая фразе излишне резкого военного оттенка.
- source_word: ἀπαγγείλωσιν
  choice: передать вам
  rationale: Глагол означает сообщить или донести весть; субъект в греческом выражен формой третьего лица множественного числа, а объект остаётся подразумеваемым.
- source_word: κατὰ τὰ αὐτά
  choice: то же самое
  rationale: Фраза отсылает к только что изложенному содержанию и естественно передаётся как указание сообщить то же самое.
