  yaml_path: translation/deuterocanon/1_maccabees/012/042.yaml
  text: And Tryphon saw that he had come with a large force[a], and he was afraid to stretch out his hands against him.
translation:
  language: ru
  text: И увидел Трифон, что Ионафан пришёл с большим войском, и побоялся поднять на него руку.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «протянуть против него руки»; это греческое выражение может обозначать враждебное действие вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: пришёл
  rationale: В данном повествовательном контексте аорист παρίστημι обозначает появление Ионафана на месте с военной силой; «пришёл» естественно передаёт движение и не сводит смысл к статическому «стоял».
- source_word: μετὰ δυνάμεως πολλῆς
  choice: с большим войском
  rationale: В военном контексте δύναμις означает вооружённую силу или войско, а не отвлечённую мощь. «Большое войско» ясно и естественно для современного русского читателя.
- source_word: ἐκτείνειν χεῖρας ἐπʼ αὐτόν
  choice: поднять на него руку
  rationale: Русское выражение сохраняет образ руки и передаёт враждебное действие, не уточняя его способ сверх греческого текста.
- source_word: ηὐλαβήθη
  choice: побоялся
  rationale: Глагол выражает страх или опасливую сдержанность; «побоялся» естественно связывает опасение Трифона с отказом от враждебного действия.
