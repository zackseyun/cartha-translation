translation_notes:
  register: Современный литературный русский язык; повествовательный стиль краткий и достоинственный. Имя Ионафана добавлено вместо местоимения ради ясности русского текста, поскольку из контекста именно он пришёл с войском. Идиома передана естественным русским соответствием, а буквальный образ сохранён в сноске.
