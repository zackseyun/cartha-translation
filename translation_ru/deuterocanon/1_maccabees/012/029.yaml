  text: But Jonathan and those with him did not know until morning[a], for they saw the fires burning.
translation:
  language: ru
  text: Но Ионафан и те, кто был с ним, до утра не знали, потому что видели горящие огни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «горящие огни (светы)». В данном контексте, вероятно, имеются в виду костры, оставленные гореть в лагере.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: не знали об этом
  rationale: Передаёт простое отрицание глагола γινώσκω; местоименное «об этом» естественно по-русски указывает на не замеченное ими отступление противника, не уточняя его сверх контекста.
- source_word: ἕως πρωί
  choice: до утра
  rationale: Прямо обозначает временной предел их неведения; «до рассвета» было бы несколько более интерпретирующим.
- source_word: ἔβλεπον
  choice: видели
  rationale: Имперфект служит фоновым объяснением; длительность происходящего дополнительно выражена конструкцией «продолжают гореть».
- source_word: τὰ φῶτα
  choice: огни
  rationale: «Огни» сохраняет связь с буквальным значением «светы» и естественно обозначает видимые ночью костры, не добавляя прямо отсутствующего в греческом уточнения «лагерные».
- source_word: καιόμενα
  choice: продолжают гореть
  rationale: Передаёт наблюдаемое продолжающееся состояние и в сочетании с имперфектом объясняет, почему Ионафан и его люди ничего не поняли до утра.
- source_word: οἱ παρʼ αὐτοῦ
  choice: те, кто был с ним
  rationale: Точно и естественно обозначает сопровождавшую Ионафана группу, не сужая значение до «воинов» или «спутников».
