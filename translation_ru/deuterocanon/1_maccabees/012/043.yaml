  yaml_path: translation/deuterocanon/1_maccabees/012/043.yaml
  text: And he received him honorably[a], introduced him to all his friends, gave him gifts[b], and commanded his friends and his forces likewise to obey him.
translation:
  language: ru
  text: Он принял его с почестями, представил[a] всем своим друзьям[b], дал ему подарки и приказал своим друзьям и войскам так же повиноваться ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «познакомил его». Греческий глагол может означать, что человека представили другим или познакомили с ними.'
    reason: lexical_alternative
  - marker: b
    text: В эллинистическом царском окружении «друзья» могло обозначать не только личных приятелей, но и приближённых правителя.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεδέξατο … ἐνδόξως
  choice: принял … с почестями
  rationale: Сочетание передаёт почётный, торжественный приём человека и естественно звучит в современном литературном русском языке.
- source_word: συνέστησεν
  choice: представил
  rationale: В сочетании с указанием на круг лиц глагол означает, что человека представили или познакомили с ними; «представил» сохраняет уместный здесь официальный оттенок.
- source_word: φίλοις
  choice: друзьям
  rationale: Это прямое соответствие греческому слову. Возможный придворный смысл в эллинистическом окружении отмечен в сноске, но не внесён в основной текст как однозначный.
- source_word: δόματα
  choice: подарки
  rationale: Естественная и точная передача существительного со значением даров или подарков.
- source_word: δυνάμεσιν
  choice: войскам
  rationale: В данном контексте форма множественного числа обозначает подчинённые правителю военные силы; «войска» конкретнее и естественнее абстрактной «силы».
- source_word: ὑπακούειν
  choice: повиноваться
  rationale: Инфинитив выражает требование слушаться и подчиняться; «повиноваться» соответствует официальному характеру приказа.
- source_word: ὡσαύτως
  choice: так же
  rationale: Передаёт сравнительное значение наречия, не уточняя сверх текста, к какому именно ранее названному действию относится это сопоставление.
