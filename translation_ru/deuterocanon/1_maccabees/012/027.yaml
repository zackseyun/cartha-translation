  text: When the sun had set, Jonathan commanded those with him to stay awake and remain at their weapons, to be ready for battle through the whole night; and he posted sentries around the camp.
translation:
  language: ru
  text: Когда солнце зашло, Ионафан приказал тем, кто был с ним, бодрствовать, быть при оружии и всю ночь быть готовыми к сражению; затем он расставил часовых вокруг лагеря.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἔδυ ὁ ἥλιος
  choice: Когда солнце зашло
  rationale: Аорист ἔδυ естественно передаёт завершившийся заход солнца, после которого последовал приказ.
- source_word: ἐπέταξεν
  choice: приказал
  rationale: Сохраняет властный и военный характер распоряжения без лишнего усиления.
- source_word: τοῖς παρʼ αὐτοῦ
  choice: тем, кто был с ним
  rationale: Близко передаёт буквальное значение «тем, кто при нём/с ним», не сужая его до более толковательного «его воинам».
- source_word: γρηγορεῖν
  choice: бодрствовать
  rationale: Передаёт требование не спать и сохранять бдительность; не смешивает его с отдельным действием по выставлению часовых.
- source_word: εἶναι ἐπὶ τοῖς ὅπλοις
  choice: держать оружие наготове
  rationale: Естественная современная передача военного оборота, сохраняющая конкретный образ готового к применению оружия.
- source_word: ἑτοιμάζεσθαι εἰς πόλεμον
  choice: готовясь к сражению
  rationale: В данном непосредственном тактическом контексте πόλεμος обозначает предстоящее сражение; причастный оборот естественно продолжает ряд предписанных действий.
- source_word: διʼ ὅλης τῆς νυκτός
  choice: всю ночь
  rationale: Кратко и точно выражает непрерывную длительность на протяжении целой ночи.
- source_word: ἐξέβαλεν προφύλακας
  choice: расставил часовых
  rationale: Передаёт военное значение выставления охраны, а не буквальное «вывел/выбросил».
- source_word: κύκλῳ τῆς παρεμβολῆς
  choice: вокруг лагеря
  rationale: παρεμβολή здесь означает военный лагерь, а κύκλῳ — размещение охраны по его окружности.
