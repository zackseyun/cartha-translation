base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/053.yaml
  text: And all the nations around them sought to wipe them out[a], for they said, “They have no man to rule and help them. Now then[c][b], let us make war against them and remove their memory from among men.”
translation:
  language: ru
  text: 'И все окрестные народы стремились истребить их[a], говоря: «У них нет мужчины, который правил бы ими и помогал им[b]. Так пойдём же войной на них и изгладим память о них среди людей[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стереть их с лица земли»; греческий глагол передаёт полное искоренение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у них нет мужа, правящего и помогающего»; возможно также: «нет предводителя, который вёл бы их и помогал им».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «уничтожим всякое воспоминание о них среди людей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησαν
  choice: пытались
  rationale: В сочетании с инфинитивом аорист ζητέω выражает целенаправленное стремление или попытку; «пытались» естественно передаёт это значение по-русски.
- source_word: πάντα τὰ ἔθνη τὰ κύκλῳ αὐτῶν
  choice: все окрестные народы
  rationale: ἔθνη здесь обозначает окружающие народы; «окрестные» кратко и литературно передаёт τὰ κύκλῳ αὐτῶν без конфессионально окрашенного «язычники».
- source_word: ἐκτρῖψαι
  choice: истребить
  rationale: Глагол выражает полное уничтожение, буквально стирание; «истребить» сохраняет силу образа и подходит к намерению враждебных народов.
- source_word: ἄνδρα ἄρχοντα καὶ βοηθοῦντα
  choice: правителя, который руководил бы ими и помогал им
  rationale: ἄνδρα с двумя причастиями описывает мужчину, исполняющего функции правителя и помощника. В русском «правитель» уже является существительным мужского рода, а придаточное предложение естественно передаёт оба причастия.
- source_word: πολεμήσωμεν
  choice: пойдём же войной на них
  rationale: Побудительное сослагательное наклонение призывает начать организованную войну; частица «же» передаёт οὖν и усиливает призыв.
- source_word: ἐξαροῦμεν ἐξ ἀνθρώπων τὸ μνημόσυνον αὐτῶν
  choice: изгладим память о них среди людей
  rationale: «Изгладить память» точно и идиоматично передаёт образ устранения μνημόσυνον; ἀνθρώπων имеет обобщённое значение и естественно переводится как «людей».
theological_decisions:
- issue: Мужской образ отсутствующего руководителя
  choice: «нет правителя, который руководил бы ими и помогал им»
  alternative: «нет мужчины, правящего ими и помогающего им»
  rationale: Греческое ἄνδρα формально указывает на мужчину, однако сочетание с ἄρχοντα функционирует как описание правителя. Русское «правитель» сохраняет мужской род и смысл должности, не создавая неестественной конструкции.
- issue: Обобщённое значение ἀνθρώπων
  choice: «среди людей»
  alternative: «среди мужей» или «среди человечества»
  rationale: Здесь ἄνθρωποι обозначает людей вообще, а не только мужчин. «Среди людей» сохраняет объём значения и звучит естественно, не ослабляя угрозу полного забвения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Реплика врагов звучит решительно и прямо; сохранены образ полного истребления и формула изглаживания памяти. Архаизмы и конфессионально нагруженное «язычники» не использованы.
