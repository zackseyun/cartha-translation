base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/036.yaml
  text: and to fortify the walls of Jerusalem[a], and to raise a great barrier between the citadel and the city so as to separate it from the city, so that it might stand by itself, in order that they might neither buy nor sell.
translation:
  language: ru
  text: и укрепить стены Иерусалима, и между крепостью[a] и городом возвести высокую преграду, чтобы отделить её от города, чтобы она оставалась сама по себе и чтобы в ней не покупали и не продавали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Акра» — укреплённая цитадель в Иерусалиме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφυῶσαι
  choice: укрепить
  rationale: Редкий глагол в сочетании со «стенами» обозначает усиление или наращивание оборонительных сооружений. «Укрепить» ясно передаёт военный смысл, не уточняя неизвестный вид строительных работ.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: стены Иерусалима
  rationale: τείχη прямо обозначает городские стены; более широкое «укрепления» здесь не требуется.
- source_word: ὑψῶσαι ὕψος μέγα
  choice: возвести высокую преграду
  rationale: Буквально выражение означает «поднять большую высоту», но в данном строительном контексте речь идёт о высоком сооружении, отделяющем крепость от города. «Высокая преграда» естественно передаёт функцию и акцент на высоте, не называя сооружение стеной без прямого основания в существительном.
- source_word: ἄκρας
  choice: крепостью
  rationale: ἄκρα обозначает укреплённую цитадель в Иерусалиме. «Крепость» понятно современному читателю, а историческое наименование «Акра» сохранено в примечании.
- source_word: εἰς τὸ διαχωρίσαι αὐτὴν τῆς πόλεως
  choice: чтобы отделить её от города
  rationale: Конструкция выражает цель; местоимение женского рода сохраняет отнесение к крепости.
- source_word: κατὰ μόνας
  choice: стояла обособленно
  rationale: Оборот означает отдельное, изолированное положение. Формулировка сохраняет образ самостоятельного стояния сооружения и звучит естественно по-русски.
- source_word: ὅπως μήτε ἀγοράζωσιν μήτε πωλῶσιν
  choice: так чтобы там не могли ни покупать, ни продавать
  rationale: Греческий текст не называет подлежащее множественного числа. Наречие «там» указывает на людей внутри крепости, не вводя их в текст явно.
theological_decisions:
- issue: Историческое обозначение ἄκρα
  choice: В основном тексте передано функционально как «крепость»
  alternative: «Акра» или «цитадель»
  rationale: Это исторически конкретное сооружение, но не богословски спорное понятие. Понятное функциональное обозначение уместно в основном тексте, а собственное историческое название сохранено в примечании.
- issue: Неявное подлежащее при «покупать» и «продавать»
  choice: Сохранено неявным посредством оборота «там не могли»
  alternative: «чтобы находившиеся в ней не могли»
  rationale: Греческое множественное подлежащее подразумевает обитателей крепости, но прямо их не называет. Русская безличная конструкция сохраняет эту сжатость и не устраняет формальную неопределённость.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет цепь целевых действий исходного текста, но упорядочен для ясности. Тон историко-повествовательный, без архаизмов и конфессионально окрашенной терминологии.
