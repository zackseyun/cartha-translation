base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/001.yaml
  text: And when Jonathan saw that the time was favorable to him[b][a], he chose men and sent them to Rome to establish and renew the friendship with them.
translation:
  language: ru
  text: Увидев, что обстоятельства складываются в его пользу,[a] Ионафан выбрал людей и послал их в Рим, чтобы утвердить и возобновить дружбу с римлянами.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «время содействует ему»; то есть обстоятельства или подходящий момент благоприятствуют Ионафану.'
    reason: lexical_alternative
  - marker: b
    text: «Дружба» здесь означает официальные дипломатические отношения, а не только личную привязанность.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν
  choice: Увидев
  rationale: Аористное причастие естественно передаётся русским деепричастием и обозначает обстоятельство, предшествующее основным действиям.
- source_word: ὁ καιρὸς αὐτῷ συνεργεῖ
  choice: обстоятельства складываются в его пользу
  rationale: Идиоматически передаёт мысль о благоприятном стечении обстоятельств; сохраняет значение καιρός как подходящего момента и συνεργεῖ как содействия.
- source_word: ἐπέλεξεν ἄνδρας
  choice: выбрал людей
  rationale: Прямая и понятная передача выбора мужчин, которым предстояло выступить посланниками.
- source_word: ἀπέστειλεν εἰς Ῥώμην
  choice: послал их в Рим
  rationale: Естественная передача дипломатического отправления; местоимение ясно отсылает к выбранным людям.
- source_word: στῆσαι
  choice: утвердить
  rationale: В дипломатическом контексте означает прочно установить или подтвердить отношения; «утвердить» сохраняет этот оттенок.
- source_word: ἀνανεῶσαι
  choice: возобновить
  rationale: Передаёт обновление уже существовавших отношений; по-русски естественно сочетается с дипломатической дружбой.
- source_word: τὴν πρὸς αὐτοὺς φιλίαν
  choice: дружбу с римлянами
  rationale: Сохраняет βασовое значение φιλία, а явное «с римлянами» устраняет неясность местоименной отсылки в русском тексте.
