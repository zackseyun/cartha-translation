  yaml_path: translation/deuterocanon/1_maccabees/012/003.yaml
  text: And they went to Rome[a], and they entered the council chamber, and said, “Jonathan the high priest and the nation of the Jews have sent us to renew with them the alliance as before.”
translation:
  language: ru
  text: 'Они отправились в Рим, вошли в зал совета[a] и сказали: «Первосвященник Ионафан и иудейский народ послали нас возобновить с ними союз, как прежде».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зал сената»; греческое слово называет место заседания правящего совета, не употребляя официального римского названия учреждения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: пришли; вошли
  rationale: В первом случае глагол обозначает прибытие в Рим, во втором — движение внутрь места заседаний. Такое варьирование естественно по-русски и сохраняет смысл повторённого греческого глагола.
- source_word: βουλευτήριον
  choice: зал совета
  rationale: Слово обозначает место заседания правящего совета. Перевод сохраняет конкретное пространственное значение и не подменяет греческое слово официальным римским названием учреждения.
- source_word: Ἰωναθὰν ὁ ἀρχιερεύς
  choice: первосвященник Ионафан
  rationale: ἀρχιερεύς — обычное обозначение первосвященника; порядок слов естественен для современного русского языка.
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: иудейский народ
  rationale: ἔθνος обозначает народ как политико-национальное целое. «Иудейский народ» ясно и естественно передаёт это значение в историческом контексте.
- source_word: ἀπέστειλαν ἡμῖς
  choice: послали нас
  rationale: 'Несмотря на необычную форму местоимения в данном чтении, синтаксический смысл ясен: говорящие были посланы Ионафаном и народом.'
- source_word: ἀνανεώσασθαι
  choice: возобновить
  rationale: В дипломатическом контексте глагол означает восстановить действие ранее существовавшего соглашения.
- source_word: συμμαχίαν
  choice: союз
  rationale: Слово обозначает политический или военный союз между сторонами; «союз» — краткий и нейтральный русский эквивалент.
- source_word: αὐτοῖς ... κατὰ τὸ πρότερον
  choice: с вами прежний
  rationale: В прямой речи местоимение естественно передано со сменой лица как «с вами», то есть с адресатами; κατὰ τὸ πρότερον выражено прилагательным «прежний», указывающим на ранее существовавший союз.
