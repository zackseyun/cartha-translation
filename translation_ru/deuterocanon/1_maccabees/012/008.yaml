  text: And Onias received the man who had been sent with honor[a], and he received the letters[b], in which an alliance and friendship were explained.
translation:
  language: ru
  text: И Ония с почётом принял человека, которого прислали[a], и получил письма, в которых содержались разъяснения о союзе и дружбе[b].
