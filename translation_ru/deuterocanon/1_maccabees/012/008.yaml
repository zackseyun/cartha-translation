lexical_decisions:
- source_word: ἐπεδέξατο
  choice: принял
  rationale: Глагол означает принять или встретить прибывшего; «принял» точно передаёт дипломатический контекст, не усиливая оттенок радушия.
- source_word: ἐνδόξως
  choice: с почётом
  rationale: Наречие указывает на почётный, достойный характер приёма; русское «с почётом» естественно и не создаёт неуместной ассоциации со славой.
- source_word: τὸν ἄνδρα τὸν ἀπεσταλμένον
  choice: посланного человека
  rationale: Передаёт описательное греческое выражение «человека, который был послан», не заменяя его более узким должностным названием «посол».
- source_word: ἔλαβε τὰς ἐπιστολάς
  choice: получил письма
  rationale: В обстановке дипломатической переписки ἔλαβε естественно означает получение переданных писем, а не просто физическое действие «взял».
- source_word: διεσάφειτο
  choice: содержались разъяснения
  rationale: Греческая форма обозначает разъяснение или ясное изложение. Номинальная конструкция позволяет естественно передать по-русски безличный пассив единственного числа.
- source_word: συμμαχίας
  choice: союзе
  rationale: Слово обозначает политический или военный союз; нейтральное «союз» сохраняет дипломатический смысл, не добавляя прямо не выраженного уточнения «военный».
- source_word: φιλίας
  choice: дружбе
  rationale: Прямое соответствие греческому слову; в данном контексте речь идёт о дружеских отношениях между народами или государствами.
