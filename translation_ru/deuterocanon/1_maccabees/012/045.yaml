base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/045.yaml
  text: And now send them away to their homes, but choose for yourself a few men who will be with you; and come with me to Ptolemais, and I will hand it over to you, along with the rest of the strongholds and the large forces and all those in charge of affairs, and then I will depart after turning back; for this is why I have come.
translation:
  language: ru
  text: 'А теперь отпусти их по домам, а себе выбери нескольких человек, которые будут с тобой. Иди со мной в Птолемаиду: я передам тебе её, а также остальные крепости, многочисленные войска и всех распорядителей дел[a]. Возвратившись, я уйду[b], ведь ради этого я здесь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех должностных лиц». Греческое выражение буквально означает людей, поставленных над нуждами или делами.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза сжата: говорящий сначала возвратится или повернёт назад, а затем уйдёт; куда именно, не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστειλον αὐτοὺς εἰς τοὺς οἴκους αὐτῶν
  choice: отпусти их по домам
  rationale: В данном контексте речь идёт о роспуске людей с возвращением домой; русское выражение естественно передаёт и действие, и направление.
- source_word: ἐπίλεξαι δὲ σεαυτῷ ἄνδρας ὀλίγους
  choice: а себе выбери нескольких человек
  rationale: «Себе» отражает средний залог, а «нескольких человек» сохраняет буквальное значение ἄνδρας, не добавляя отсутствующего в тексте слова «воинов».
- source_word: οἵτινες ἔσονται μετὰ σοῦ
  choice: которые останутся с тобой
  rationale: Буквально — «которые будут с тобой»; в контексте роспуска остальных естественное русское «останутся» ясно передаёт подразумеваемое противопоставление.
- source_word: δεῦρο μετ’ ἐμοῦ εἰς Πτολεμαΐδα
  choice: пойдём со мной в Птолемаиду
  rationale: δεῦρο служит побуждением прийти или отправиться вместе с говорящим; «пойдём» естественно при названном пункте назначения.
- source_word: παραδώσω σοι αὐτὴν
  choice: я передам тебе её
  rationale: Передаёт переход контроля над городом без излишнего оттенка капитуляции.
- source_word: τὰ λοιπὰ ὀχυρώματα
  choice: остальные крепости
  rationale: ὀχυρώματα обозначает укреплённые места; «крепости» — ясный и уместный военно-политический эквивалент.
- source_word: τὰς δυνάμεις τὰς πολλὰς
  choice: многочисленные войска
  rationale: В контексте δυνάμεις означает военные силы, а πολλὰς указывает на их многочисленность.
- source_word: πάντας τοὺς ἐπὶ τῶν χρειῶν
  choice: всех распорядителей дел
  rationale: Фраза буквально обозначает всех поставленных над нуждами или делами; перевод сохраняет административный смысл, не приписывая им конкретных должностей.
- source_word: ἐπιστρέψας ἀπελεύσομαι
  choice: После этого я возвращусь и уйду
  rationale: Греческая конструкция с аористным причастием обозначает возвращение или поворот назад, предшествующий уходу; последовательность сохранена без указания не названного в тексте направления.
- source_word: τούτου γὰρ χάριν πάρειμι
  choice: ведь ради этого я и пришёл
  rationale: Естественно передаёт объяснение цели присутствия говорящего; частица «и» подчёркивает именно эту цель.
