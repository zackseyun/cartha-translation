translation:
  language: ru
  text: Ионафан возвратился, созвал старейшин народа и посоветовался с ними о строительстве крепостей в Иудее.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: возвратился
  rationale: В данном повествовательном контексте глагол обозначает физическое возвращение; «возвратился» естественно и точно передаёт смысл.
- source_word: ἐξεκκλησίασεν
  choice: созвал
  rationale: Глагол обозначает созыв людей на собрание. «Созвал» ясно передаёт намеренное официальное действие при прямом дополнении «старейшин».
- source_word: πρεσβυτέρους τοῦ λαοῦ
  choice: старейшин народа
  rationale: Речь идёт о признанных руководителях общины, а не просто о пожилых мужчинах; это устойчивое и понятное русское обозначение.
- source_word: ἐβουλεύσατο μετ’ αὐτῶν
  choice: посоветовался с ними
  rationale: Средний залог выражает совещание и обсуждение вместе с другими; выбранная формулировка естественна в современном русском и сохраняет совместный характер решения.
- source_word: τοῦ οἰκοδομῆσαι
  choice: о строительстве
  rationale: Инфинитив с τοῦ здесь передаёт предмет или замысел совещания. Именная конструкция после «посоветовался» звучит по-русски естественно.
- source_word: ὀχυρώματα
  choice: крепостей
  rationale: Слово обозначает укреплённые оборонительные сооружения или пункты; «крепости» конкретнее и естественнее, чем абстрактное «укрепления».
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: в Иудее
  rationale: Обычное русское название области и прямое обозначение места предполагаемого строительства.
