  text: Therefore we did not wish to trouble you and the rest of our allies and friends in these wars[a].
translation:
  language: ru
  text: Поэтому мы не хотели беспокоить вас и остальных наших союзников и друзей в этих войнах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обременять вас… в этих войнах». Греческий глагол может означать «беспокоить», «досаждать» или «обременять»; здесь, вероятно, имеется в виду дипломатическое или военное бремя, а не личное раздражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἠβουλόμεθα
  choice: мы не хотели
  rationale: Имперфект βούλομαι выражает нежелание или отсутствие намерения в прошлом; «не хотели» естественно передаёт волевой оттенок.
- source_word: οὖν
  choice: поэтому
  rationale: Передаёт вывод, следующий из предшествующего контекста.
- source_word: παρενοχλεῖν
  choice: беспокоить
  rationale: Глагол означает причинять беспокойство, затруднять или обременять. «Беспокоить» сохраняет широту значения, не сводя его только к военной повинности или материальному бремени.
- source_word: ὑμῖν
  choice: вас
  rationale: Местоимение второго лица множественного числа обозначает адресатов письма; при русском переходном глаголе употреблён винительный падеж.
- source_word: τοὺς λοιποὺς
  choice: остальных
  rationale: Указывает на других лиц или стороны помимо адресатов.
- source_word: συμμάχους
  choice: союзников
  rationale: Обычное современное обозначение участников политического или военного союза.
- source_word: φίλους
  choice: друзей
  rationale: Сохраняет прямое значение φίλοι и допускает присущий эллинистической дипломатии политический оттенок.
- source_word: ἐν τοῖς πολέμοις τούτοις
  choice: в этих войнах
  rationale: Буквально и без уточнения передаёт сферу или обстоятельства действия, сохраняя множественное число πολέμοις.
