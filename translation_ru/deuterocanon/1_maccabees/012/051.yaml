translation:
  language: ru
  text: Когда преследователи увидели, что для них это вопрос жизни и смерти[a], они повернули назад.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «что речь идёт об их жизни»; этот оборот означает, что их жизни были в опасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: когда … увидели
  rationale: Аористное причастие передано придаточным времени, естественным для русского повествования. Хотя в греческом тексте причастие стоит в единственном числе при подлежащем во множественном, русский перевод согласован по числу.
- source_word: οἱ διώκοντες
  choice: преследователи
  rationale: Субстантивированное причастие настоящего времени обозначает тех, кто в этот момент ведёт погоню; краткий русский эквивалент сохраняет повествовательный и военный контекст.
- source_word: ὅτι περὶ ψυχῆς ἐστιν αὐτοῖς
  choice: что для них это вопрос жизни и смерти
  rationale: Оборот περὶ ψυχῆς означает смертельную опасность, когда жизнь поставлена на карту. Русская идиома «вопрос жизни и смерти» естественно передаёт этот смысл, а «для них» сохраняет местоименную формулировку греческого текста.
- source_word: ψυχῆς
  choice: жизни
  rationale: Здесь ψυχή обозначает физическую жизнь, а не нематериальную душу.
- source_word: ἐπέστρεψαν
  choice: повернули назад
  rationale: В контексте погони глагол означает перемену направления и прекращение преследования, а не просто возвращение в названное место.
