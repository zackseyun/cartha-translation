review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: страх перед возможным противодействием Ионафана, намерение схватить и убить его, а затем отправление в Бет-Шан. Однако πολεμήσῃ означает «воевать / вести войну», без оттенка начинания, а ἐζήτει — имперфект («искал»), не ингрессивное «стал искать».'
  naturalness: «Начнёт против него войну» неестественно для современного литературного русского; нормативнее «будет воевать против него» или «пойдёт на него войной». В уточнённой версии также явно выражена целевая связь между захватом и убийством.
  terminology: «Ионафан» и «Бет-Шан» допустимы; сноска корректно отмечает греческую форму Βεθσά («Бетса») и традиционную идентификацию. «Не позволит ему» точно сохраняет выраженный в греческом личный объект и не заполняет невыраженное действие.
  issues:
  - severity: medium
    issue: «начнёт против него войну»
    rationale: В греческом πολεμήσῃ нет значения «начнёт»; формулировка по-русски также стилистически тяжеловесна. «Будет воевать против него» передаёт значение без добавления аспекта начала.
  - severity: medium
    issue: «стал искать способ»
    rationale: ἐζήτει стоит в имперфекте и описывает продолжающийся поиск, а не его начало. «Искал способ» точнее.
  - severity: low
    issue: Связь «схватить ... и убить»
    rationale: Два инфинитива в греческом выражают намерение/цель; «схватить Ионафана, чтобы убить его» делает эту связь ясной в русском, не меняя смысла.
  revised_text: Он испугался, что Ионафан не позволит ему[a] и будет воевать против него, и искал способ схватить Ионафана, чтобы убить его. И он выступил и пришёл в Бет-Шан[b].
