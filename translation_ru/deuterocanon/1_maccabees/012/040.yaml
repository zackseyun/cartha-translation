base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/040.yaml
  text: And he became afraid that Jonathan might not permit him and might make war against him[a], and he was seeking a way to seize him and kill him; and he set out and came to Beth-shan.
translation:
  language: ru
  text: Он испугался, что Ионафан не позволит ему[a] и будет воевать против него, и искал способ схватить Ионафана, чтобы убить его. И он выступил и пришёл в Бет-Шан[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «не позволит ему»; что именно Ионафан может не позволить ему сделать, прямо не сказано.'
    reason: Сохранение синтаксической неоднозначности и эллиптичности оригинала.
  - marker: b
    text: В греческом тексте название передано в форме «Бетса»; имеется в виду Бет-Шан.
    reason: Пояснение принятой географической идентификации и различия в форме названия.
lexical_decisions:
- source_word: ηὐλαβήθη
  choice: испугался
  rationale: В данном контексте глагол выражает страх или тревожное опасение; совершенный вид естественно передаёт наступившую реакцию.
- source_word: μὴ ποτε οὐκ ἐάσῃ αὐτὸν
  choice: что Ионафан не позволит ему
  rationale: 'Сохранена эллиптичность греческого текста: указано лицо, которому Ионафан может не позволить действовать, но само действие не названо.'
- source_word: πολεμήσῃ πρὸς αὐτόν
  choice: начнёт против него войну
  rationale: Передан военный, а не просто конфликтный смысл πολεμέω; «начнёт» естественно выражает опасение возможного будущего действия.
- source_word: ἐζήτει πόρον
  choice: стал искать способ
  rationale: πόρος здесь обозначает практический путь или средство осуществить замысел; «стал искать» передаёт развитие повествования.
- source_word: τοῦ συλλαβεῖν αὐτὸν τοῦ ἀποκτεῖναι
  choice: схватить Ионафана и убить
  rationale: Оба инфинитива передают цель. Имя повторено вместо двусмысленного второго местоимения, поскольку в русском два разных лица мужского рода иначе затрудняют понимание.
- source_word: ἀπάρας
  choice: выступил
  rationale: Причастие обозначает отправление в путь; «выступил» сохраняет несколько военный оттенок контекста, не добавляя прямого упоминания лагеря.
- source_word: Βεθσά
  choice: Бет-Шан
  rationale: Использовано узнаваемое современное написание традиционно отождествляемого места; греческая форма отмечена в сноске.
