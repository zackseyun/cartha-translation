  rationale: 'Исправлены два аспектуальных сдвига: не добавляется начало войны и не превращается продолжающийся поиск в его начало. Целевой оттенок двух греческих инфинитивов передан ясной русской конструкцией «чтобы убить его». Сноски и ономастическое решение сохранены.'
