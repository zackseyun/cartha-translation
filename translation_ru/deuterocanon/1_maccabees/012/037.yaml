  yaml_path: translation/deuterocanon/1_maccabees/012/037.yaml
  text: And they gathered to build[a], and the wall of the wadi on the east side fell[b], and he repaired what is called Chaphenatha.
translation:
  language: ru
  text: Они собрались, чтобы строить, и часть стены у русла с восточной стороны обрушилась[a]. Он восстановил то, что называется Хафенафа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза сжата и допускает перевод: «часть стены у сезонного потока (или оврага) на восточной стороне». Слово χείμαρρος может обозначать сезонный поток, его русло или овраг.'
    reason: lexical_alternative
  - marker: b
    text: Хафенафа — переданное по звучанию название. Греческий текст не уточняет, идёт ли речь о месте, участке стены или отдельном сооружении.
    reason: cultural_note
lexical_decisions:
- source_word: συνήχθησαν
  choice: собрались
  rationale: 'Аористная пассивно-медиальная форма здесь употреблена непереходно: люди сошлись для общей цели. «Собрались» естественно и точно передаёт смысл.'
- source_word: τοῦ οἰκοδομεῖν
  choice: чтобы строить
  rationale: Артиклевый инфинитив с τοῦ выражает цель. Перевод не добавляет отсутствующего в греческом тексте объекта и не вводит оттенок «перестраивать».
- source_word: ἔπεσεν
  choice: обрушилась
  rationale: Буквально глагол означает «упала», но применительно к стене современное русское «обрушилась» точно и естественно передаёт событие.
- source_word: τοῦ τείχους
  choice: часть стены
  rationale: 'Родительный падеж после ἔπεσεν естественно понимать партитивно: обрушилась некоторая часть стены, а не обязательно вся стена.'
- source_word: τοῦ χειμάρρου τοῦ ἐξ ἀπηλιώτου
  choice: у русла с восточной стороны
  rationale: χείμαρρος может обозначать сезонный поток, его сухое русло или овраг; сжатая греческая конструкция также допускает неоднозначность синтаксической связи. Формулировка сохраняет географический смысл, не изображая поток постоянно текущим.
- source_word: ἐπεσκεύασεν
  choice: восстановил
  rationale: Глагол означает привести в исправность, отремонтировать или восстановить. «Восстановил» подходит к укреплению либо месту, не утверждая, что оно было полностью отстроено заново.
- source_word: τὸ καλούμενον Χαφεναθά
  choice: то, что называется Хафенафа
  rationale: Средний род артикля и причастия не уточняет, было ли это место, участок стены или сооружение. Неопределённое «то» сохраняет сдержанность оригинала; имя передано транслитерацией.
