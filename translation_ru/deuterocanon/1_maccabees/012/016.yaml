lexical_decisions:
- source_word: εὐφραινόμεθα
  choice: радуемся
  rationale: Настоящее время и средне-страдательная форма здесь передают состояние радости; «радуемся» естественно и точно выражает смысл.
- source_word: δὲ
  choice: же
  rationale: Частица δέ обозначает лёгкое противопоставление или переход. Русское «же» сохраняет эту мягкую связующую функцию, не усиливая её до резкого «но».
- source_word: ἐπὶ
  choice: при конструкции «радоваться» с дательным падежом
  rationale: ἐπί с дательным указывает на основание или повод для радости. Русская конструкция «радуемся вашей славе» передаёт это отношение естественно и без лишнего уточнения причинности.
- source_word: τῇ δόξῃ
  choice: славе
  rationale: δόξα может означать славу, честь или доброе имя. «Слава» сохраняет широту и возвышенный тон греческого слова, а контекстуальные варианты отмечены в сноске.
- source_word: ὑμῶν
  choice: вашей
  rationale: Местоимение второго лица множественного числа относится ко всем адресатам; по-русски это естественно передаётся формой «вашей».
