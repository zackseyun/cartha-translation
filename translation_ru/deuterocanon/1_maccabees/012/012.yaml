  text: But we rejoice in your glory;[a]
translation:
  language: ru
  text: Но мы радуемся вашей славе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы радуемся вашему почёту»; или: «мы радуемся вашей известности».'
    reason: Лексическое значение δόξα здесь может обозначать славу, почёт или доброе имя адресатов.
lexical_decisions:
- source_word: εὐφραινόμεθα
  choice: радуемся
  rationale: Форма передаёт состояние радости; «радуемся» естественно по-русски и сохраняет глагольную силу оригинала.
- source_word: δὲ
  choice: но
  rationale: Частица обозначает мягкое противопоставление или переход; «но» сохраняет связующую силу в данном контексте.
- source_word: ἐπὶ
  choice: вашей славе (дательный падеж при «радоваться»)
  rationale: Предлог с дательным может указывать на основание или повод для радости; русское управление «радоваться чему» естественно передаёт эту связь.
- source_word: τῇ δόξῃ
  choice: славе
  rationale: «Слава» прямо соответствует δόξα и сохраняет широту значения — почёт, доброе имя, известность, — не сужая его до одного оттенка.
- source_word: ὑμῶν
  choice: вашей
  rationale: Передаёт притяжательное значение местоимения второго лица множественного числа и согласуется со словом «слава».
