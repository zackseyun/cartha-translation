lexical_decisions:
- source_word: ἀπροσδεεῖς
  choice: не нуждаемся
  rationale: Передаёт значение «не имеющие нужды, не нуждающиеся» естественным современным русским языком; оборот с «хотя» ясно выражает уступительный смысл причастной конструкции.
- source_word: τούτων
  choice: в этом
  rationale: Нейтральное указательное выражение сохраняет обобщённую отсылку к упомянутому ранее и не конкретизирует её сверх греческого текста.
- source_word: παράκλησιν
  choice: утешение
  rationale: В данном контексте обозначает поддержку и укрепление, получаемые от священных книг. «Утешение» сохраняет широкий смысл слова, тогда как «увещание» было бы здесь неоправданно узким.
- source_word: τὰ βιβλία τὰ ἅγια
  choice: святые книги
  rationale: Прямо передаёт греческое выражение, не подменяя его более специальным термином «Писания» и не сужая исторический смысл.
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  choice: которые у нас в руках
  rationale: Сохраняет конкретный образ греческого текста и одновременно понятно указывает на обладание книгами и доступ к ним.
theological_decisions:
- issue: К чему относится выражение «святые книги»
  choice: Сохранена широкая формулировка, естественно указывающая на священные книги Израиля как источник утешения
  alternative: Прямо назвать их «Священным Писанием» или понимать как священные документы вообще
  rationale: Контекст позволяет видеть здесь священные книги Израиля, но сам греческий текст говорит буквально о «святых книгах»; перевод не уточняет их состав и статус сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Конструкция «находим утешение в» естественно передаёт греческое ἔχοντες παράκλησιν при сохранении смысла; образ «у нас в руках» оставлен в основном тексте.
