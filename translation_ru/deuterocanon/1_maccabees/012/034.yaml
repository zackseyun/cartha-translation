  text: For he heard that they intended to hand over the stronghold to those on Demetrius's side, and he stationed a garrison there so that they might guard it.
translation:
  language: ru
  text: Ибо он услышал, что они намерены передать крепость сторонникам Димитрия, и разместил там гарнизон, чтобы они охраняли её.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямо передаёт аорист ἀκούω и сохраняет возможность понимания как получения известия.
- source_word: βούλονται
  choice: намерены
  rationale: В данном военно-политическом контексте выражает конкретное намерение, не утверждая, что замысел уже начал осуществляться.
- source_word: τὸ ὀχύρωμα
  choice: крепость
  rationale: Естественное современное обозначение укреплённого места; хорошо соответствует военному контексту.
- source_word: παραδοῦναι
  choice: передать
  rationale: Передаёт переход контроля над крепостью другой стороне без добавочного оттенка капитуляции, который могло бы внести слово «сдать».
- source_word: τοῖς παρὰ Δημητρίου
  choice: сторонникам Димитрия
  rationale: Обозначает людей, связанных с Димитрием или принадлежащих к его стороне, не сужая их круг исключительно до воинов.
- source_word: ἔθετο
  choice: поставил
  rationale: В сочетании с «гарнизон» естественно выражает размещение военного подразделения.
- source_word: φρουράν
  choice: гарнизон
  rationale: Здесь слово обозначает оставленный на месте военный отряд, а не отвлечённую обязанность охранять.
- source_word: ὅπως φυλάσσωσιν αὐτήν
  choice: чтобы они охраняли её
  rationale: Сохраняет целевое значение ὅπως с сослагательным наклонением и прямо передаёт функцию гарнизона.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование звучит ясно и достойно. Местоимение «они» в придаточном цели по-русски соотносится с личным составом собирательно понимаемого гарнизона, как и греческое множественное φυλάσσωσιν после единственного φρουράν.
