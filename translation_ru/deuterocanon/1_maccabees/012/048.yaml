  text: But when Jonathan entered Ptolemais[a], the men of Ptolemais shut the gates and seized him, and they killed with the sword all who had come with him.
translation:
  language: ru
  text: Но когда Ионафан вошёл в Птолемаиду, жители Птолемаиды заперли ворота, схватили его и убили мечом всех, кто пришёл вместе с ним.
