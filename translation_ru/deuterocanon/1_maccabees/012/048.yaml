lexical_decisions:
- source_word: ὡς δὲ
  choice: Но когда
  rationale: Передаёт временное значение и одновременно отмечает резкий поворот повествования.
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Естественно и точно передаёт движение внутрь города.
- source_word: Πτολεμαΐδα
  choice: Птолемаиду
  rationale: Устоявшаяся русская форма древнего географического названия.
- source_word: ἀπέκλεισαν
  choice: заперли
  rationale: В сочетании с воротами ясно выражает их закрытие с целью преградить выход.
- source_word: οἱ Πτολεμαεῖται
  choice: жители Птолемаиды
  rationale: Понятно передаёт название жителей города без тяжеловесного этнонима и без ограничения только мужчинами.
- source_word: συνέλαβον
  choice: схватили
  rationale: Передаёт внезапное насильственное задержание, не привнося оттенка законного ареста.
- source_word: πάντας τοὺς συνελθόντας μετʼ αὐτοῦ
  choice: всех, кто пришёл вместе с ним
  rationale: Сохраняет прямое значение совместного прихода; вхождение в город ясно из ближайшего контекста.
- source_word: ἀπέκτειναν ἐν ῥομφαίᾳ
  choice: убили мечом
  rationale: Современная и точная передача идиомы насильственного умерщвления оружием.
