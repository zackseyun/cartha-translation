translation:
  language: ru
  text: Поверив ему, он сделал так, как тот сказал, и отправил войска; они ушли в Иудею.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в землю Иудеи»; греческое выражение буквально означает «в землю Иуды» и обозначает область Иудеи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπιστεύσας αὐτῷ
  choice: Поверив ему
  rationale: Аористное причастие передаёт доверие, которое побудило к последующему действию; деепричастная конструкция естественна в современном русском языке.
- source_word: ἐποίησεν καθὼς εἶπεν
  choice: он сделал, как тот сказал
  rationale: Сохраняется прямой смысл соответствия поступка сказанному; местоимение «тот» естественно различает действующего и того, кому он поверил.
- source_word: ἐξαπέστειλεν τὰς δυνάμεις
  choice: отослал войска
  rationale: В военном контексте δυνάμεις обозначает войска, а ἐξαπέστειλεν — отправление прочь; «отослал» передаёт это без чрезмерно конкретного «распустил».
- source_word: ἀπῆλθον
  choice: ушли
  rationale: Глагол обозначает удаление из прежнего места; «ушли» кратко и естественно передаёт этот смысл.
- source_word: εἰς γῆν Ἰούδα
  choice: в землю Иуды
  rationale: Формулировка близка к греческому выражению и сохраняет образ земли, названной по Иуде; предлог «в» в русском допускает значение направления и входа.
