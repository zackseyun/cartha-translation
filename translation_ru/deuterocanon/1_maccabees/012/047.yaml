  text: But he left three thousand men with himself[a]; about two thousand he left in Galilee[b], and a thousand went with him.
translation:
  language: ru
  text: 'Но он оставил при себе три тысячи человек[a]: около двух тысяч оставил в Галилее, а тысяча присоединилась к нему[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с самим собой».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пошла с ним»; греческий глагол буквально означает «сошлась вместе с ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλιπεν
  choice: оставил
  rationale: Глагол означает «оставить, оставить в распоряжении/наличии»; нейтральное «оставил» сохраняет значение без добавления идеи формального размещения войск.
- source_word: μεθʼ ἑαυτοῦ
  choice: при себе
  rationale: Естественно передаёт рефлексивное греческое выражение «с самим собой» в данном военном контексте.
- source_word: ἄνδρας τρισχιλίους
  choice: три тысячи человек
  rationale: ἄνδρας буквально означает «мужчин/людей»; контекст подразумевает воинов, но слово «человек» не вводит уточнение, отсутствующее в тексте.
- source_word: ὡς δισχιλίους
  choice: около двух тысяч
  rationale: ὡς перед числительным обозначает приблизительность.
- source_word: ἀφῆκεν
  choice: оставил
  rationale: Передаёт значение «оставить, позволить остаться», не конкретизируя действие как официальное размещение отряда.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: в Галилее
  rationale: Обычная передача местного значения ἐν с названием области.
- source_word: χίλιοι
  choice: тысяча
  rationale: Естественная форма числительного в русском повествовании; по смыслу подразумевается тысяча человек.
- source_word: συνῆλθον αὐτῷ
  choice: присоединилась к нему
  rationale: Глагол буквально описывает схождение вместе и в контексте означает присоединение к нему; согласование в единственном числе соответствует русской форме «тысяча».
