  text: Even earlier[a], letters were sent to Onias the high priest from Areus, who was ruling among you, saying, ‘You are our brothers,’ as the copy laid out here shows.
translation:
  language: ru
  text: 'Ещё прежде Арей, царствовавший у вас, послал первосвященнику Онии письма, в которых говорилось: «Вы — наши братья», как показывает приведённая далее копия.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как показывает приложенная здесь копия». Греческое выражение указывает, что копия прежнего письма приводится или прилагается к тексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι πρότερον
  choice: Ещё прежде
  rationale: 'Передаёт усиленное временное значение: это произошло ранее нынешней переписки.'
- source_word: ἀπεστάλησαν ἐπιστολαὶ πρὸς Ὀνίαν τὸν ἀρχιερέα, παρὰ δʼ Ἀρείου
  choice: Арей… послал первосвященнику Онии письма
  rationale: Естественная русская активная конструкция сохраняет направление, источник и множественное число греческого ἐπιστολαί.
- source_word: τοῦ βασιλεύοντος ἐν ὑμῖν
  choice: царствовавший у вас
  rationale: Сохраняет глагольное значение причастия и близко передаёт ἐν ὑμῖν, не заменяя его более сильным «над вами».
- source_word: ὅτι ἐστὲ ἀδελφοὶ ἡμῶν
  choice: 'в которых говорилось: «Вы — наши братья»'
  rationale: ὅτι понято как вводящее содержание письма; прямая речь естественно передаёт заявление о братстве между народами.
- source_word: ὡς τὸ ἀντίγραφον ὑπόκειται
  choice: как показывает приведённая далее копия
  rationale: ἀντίγραφον означает копию документа, а ὑπόκειται указывает, что она помещена или представлена вслед за этим сообщением.
