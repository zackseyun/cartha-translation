    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πάντες
  choice: все они ... пришли
  rationale: Сохраняет явное πάντες и естественно передаёт повествовательный аорист ἦλθον как завершённое возвращение.
- source_word: μετʼ εἰρήνης
  choice: благополучно
  rationale: В данном контексте выражение обозначает безопасное, невредимое возвращение; буквальное «с миром» по-русски могло бы ошибочно подразумевать примирение или мирные намерения.
- source_word: εἰς γῆν Ἰούδα
  choice: в землю Иуды
  rationale: Передаёт территориальное значение γῆ и сохраняет форму имени Ἰούδα, не подменяя её позднейшим провинциальным названием «Иудея».
- source_word: ἐπένθησαν τὸν Ἰωνάθαν
  choice: оплакивали Ионафана
  rationale: «Оплакивать» естественно выражает скорбь по человеку, которого считают погибшим или утраченным, и допускает прямое дополнение, как в греческом.
- source_word: τοὺς μετʼ αὐτοῦ
  choice: тех, кто был с ним
  rationale: Сохраняет неопределённость относительно положения и состава спутников Ионафана.
- source_word: ἐφοβήθησαν σφόδρα
  choice: были охвачены великим страхом
  rationale: Передаёт сильную степень страха, выраженную σφόδρα, в естественном и торжественном русском регистре.
- source_word: ἐπένθησεν Ἰσραὴλ πένθος μέγα
  choice: весь Израиль предался великому плачу
  rationale: Передаёт эмфатическое сочетание однокоренных слов глагола и существительного, избегая неестественного русского «оплакивал великим плачем»; «весь» делает естественным собирательное употребление имени Израиль в данном контексте.
