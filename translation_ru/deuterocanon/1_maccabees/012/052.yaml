  text: And they all came in peace into the land of Judah[a], and they mourned for Jonathan and those with him, and they were greatly afraid; and Israel mourned with great mourning.
translation:
  language: ru
  text: И все они благополучно пришли в Иудею. Они оплакивали Ионафана и тех, кто был с ним, и были охвачены великим страхом. И Израиль скорбел великой скорбью.[a]
