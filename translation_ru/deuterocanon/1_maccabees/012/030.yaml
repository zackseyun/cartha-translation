lexical_decisions:
- source_word: κατεδίωξεν ὀπίσω αὐτῶν
  choice: погнался за ними
  rationale: Сочетание обозначает деятельное преследование отступающих. «Погнался за ними» естественно передаёт и глагол, и направительное ὀπίσω αὐτῶν, не создавая тяжеловесного повтора.
- source_word: οὐκ ἐκατέλαβεν αὐτούς
  choice: не настиг их
  rationale: В контексте погони καταλαμβάνω означает догнать, настичь. «Не настиг» сохраняет повествовательный и военный оттенок точнее, чем более разговорное «не поймал».
- source_word: διέβησαν
  choice: перешли
  rationale: Аорист обозначает совершившийся переход, объясняющий неудачу погони. В русском причинная связь и порядок событий ясны без обязательного добавления «уже».
- source_word: τὸν Ἐλεύθερον ποταμόν
  choice: реку Елевфер
  rationale: Ἐλεύθερον — собственное название реки; форма «реку Елевфер» соответствует естественному русскому порядку слов и традиционной передаче греческого имени.
