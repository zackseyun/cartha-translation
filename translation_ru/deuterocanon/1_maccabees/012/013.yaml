lexical_decisions:
- source_word: ἀπρόσδεοι τούτων
  choice: не нуждаясь в этом
  rationale: Передаёт значение отсутствия нужды в упомянутом ранее, не усиливая его до полной независимости.
- source_word: παράκλησιν
  choice: утешение
  rationale: В данном контексте слово обозначает внутреннюю поддержку и ободрение; «утешение» естественно сочетается с обращением к священным книгам, а возможная широта значения отмечена в сноске.
- source_word: τὰ βιβλία τὰ ἅγια
