base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/039.yaml
  text: And Tryphon sought to rule over Asia[a], to put on the crown[b], and to lay hands on Antiochus the king.
translation:
  language: ru
  text: И Трифон задумал воцариться над Азией[a], возложить на себя диадему и поднять руку на царя Антиоха[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «Азией» здесь подразумевается соответствующее эллинистическое царство, а не Азия в современном географическом смысле.
    reason: cultural_note
  - marker: b
    text: 'Или: «напасть на царя Антиоха»; буквально: «простереть руки против царя Антиоха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησεν
  choice: задумал
  rationale: В данном контексте аорист ζητέω выражает намерение и политическое стремление, а не поиск сведений. «Задумал» естественно передаёт замысел, не утверждая, что он осуществился.
- source_word: βασιλεῦσαι τῆς Ἀσίας
  choice: воцариться над Азией
  rationale: βασιλεύω допускает значения «царствовать» и «стать царём». В сочетании с намерением возложить диадему речь идёт о притязании на царскую власть; «воцариться над» передаёт и начало правления, и территориальный объект.
- source_word: τῆς Ἀσίας
  choice: Азией
  rationale: Сохранено историческое географическое название без поясняющей подмены в основном тексте; его эллинистическое значение разъяснено в сноске.
- source_word: περιθέσθαι τὸ διάδημα
  choice: возложить на себя диадему
  rationale: Средний залог περιθέσθαι указывает на действие по отношению к себе, а διάδημα — именно царская диадема как знак монаршей власти. Формулировка точна и уместна для исторического повествования.
- source_word: ἐκτεῖναι χεῖρας ἐπ’ Ἀντίοχον
  choice: поднять руку на царя Антиоха
  rationale: Русский устойчивый оборот передаёт буквальный образ протянутой против кого-либо руки и его враждебный, насильственный смысл, не уточняя способ нападения.
- source_word: τὸν βασιλέα
  choice: царя
  rationale: 'Титул сохранён явно; в русском языке естественно поставить его перед именем: «царя Антиоха».'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Диадема» точнее общего слова «корона», а устойчивое выражение «поднять руку на» сохраняет образность и намеренно широкое значение греческого оборота.
