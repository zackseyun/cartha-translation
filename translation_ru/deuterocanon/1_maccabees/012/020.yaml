lexical_decisions:
- source_word: Ἄρης
  choice: Арий
  rationale: В заголовке письма это личное имя спартанского царя; передано в принятой исторической форме «Арий», а не как имя бога Ареса.
- source_word: βασιλεὺς
  choice: царь
  rationale: Обычное обозначение монарха; «царь» естественно и точно передаёт титул в данном историческом контексте.
- source_word: Σπαρτιατῶν
  choice: спартанцев
  rationale: Родительный падеж множественного числа указывает на народ, поэтому «царь спартанцев» точнее, чем «царь Спарты».
- source_word: Ὀνείᾳ
  choice: Онию
  rationale: Дательный падеж обозначает адресата письма; русская форма имени поставлена в дательном падеже.
- source_word: ἱερεῖ μεγάλῳ
  choice: первосвященника
  rationale: Устойчивое русское название иудейской должности; в сочетании с именем адресата форма винительного падежа обусловлена естественной русской эпистолярной конструкцией.
- source_word: χαίρειν
  choice: приветствует
  rationale: В начале письма это установленная формула приветствия, а не буквальное повеление радоваться.
