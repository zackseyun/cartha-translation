    text: 'Или: «Так они развертываются (или построены)»; греческий глагол может обозначать как построение, так и тактическое развертывание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Естественная передача повествовательного аориста ἀποστέλλω в современном литературном русском.
- source_word: κατασκόπους
  choice: разведчиков
  rationale: В военном контексте речь идёт о людях, посланных наблюдать за расположением противника; «разведчики» точнее и естественнее, чем «соглядатаи».
- source_word: παρεμβολήν
  choice: стан
  rationale: παρεμβολή в данном военном контексте означает лагерь; «стан» сохраняет достоинство библейского повествования и остаётся понятным.
- source_word: ἀπήγγειλαν
  choice: донесли
  rationale: Передаёт возвращение разведчиков с военным донесением, а не просто сообщение.
- source_word: Οὕτως τάσσονται
  choice: Вот как они выстраиваются
  rationale: Сохраняет указательное οὕτως, настоящее время и значение тактического построения в τάσσονται, не сводя выражение лишь к намерению или планированию.
- source_word: ἐπιπεσεῖν
  choice: напасть
  rationale: Ясно передаёт враждебное нападение; более буквальное «обрушиться» звучало бы в русском контексте неестественно.
- source_word: ἐπʼ αὐτοὺς
  choice: на нас
  rationale: Формально местоимение означает «на них», однако внутри прямой речи разведчиков естественным референтом являются Ионафан и его войско; вариант отмечен сноской ввиду текстовой неоднозначности.
- source_word: τὴν νύκτα
  choice: ночью
  rationale: Естественная русская передача винительного времени со значением действия в течение ночи.
