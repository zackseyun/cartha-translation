lexical_decisions:
- source_word: ἐπειράθημεν
  choice: мы решили
  rationale: В данном контексте дипломатического письма форма передаёт предпринятое намерение; «решили» звучит естественно по-русски, не утверждая, что цель уже достигнута.
- source_word: ἀποστεῖλαι
  choice: послать к вам
  rationale: Греческий текст не называет посылаемый объект. Русский эллипсис сохраняет эту открытость и допускает письмо, весть или посланников без ненужного уточнения.
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: братство и дружбу с вами
  rationale: Сохраняются оба дипломатически-реляционных понятия; «с вами» естественно передаёт πρὸς ὑμᾶς.
- source_word: ἀνανεώσασθαι
  choice: обновить
  rationale: Глагол означает возобновить или обновить ранее существующие отношения; «обновить» сохраняет образ исходного слова.
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: и не стать чужими для вас
  rationale: Передана цель действия и сильный реляционный оттенок ἐξαλλοτριόω; формулировка естественнее буквального «не быть отчуждёнными от вас».
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: ведь прошло уже много времени
  rationale: Русское единственное число идиоматично выражает множество прошедших периодов; «уже» естественно подчёркивает длительность, подразумеваемую контекстом.
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: с тех пор, как вы посылали к нам
  rationale: Объект глагола в греческом не указан, поэтому перевод не конкретизирует, были ли это письмо, весть или посланники.
