  rationale: Правка делает русскую фразу естественной и устраняет современную двусмысленность «земли Иуды». Указательные слова «те» ясно относят цель к адресатам писем. Сохранены дистрибутивность κατὰ τόπον, целевой союз ὅπως, смысловая широта προπέμπω и выражение «с миром». Сноски и их якоря сохранены и соответствуют отмеченным лексическим вариантам.
