translation:
  language: ru
  text: И дали им письма к людям в каждом месте[a], чтобы те помогли им продолжить путь[b] в Иудею с миром.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «место за местом»; речь идёт о письмах, предназначенных людям или властям в отдельных местах по пути.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проводили их дальше». Греческий глагол может означать отправить путников дальше, сопроводить их или помочь им в пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν
  choice: дали
  rationale: Прямое и естественное соответствие аористу δίδωμι в повествовательном контексте.
- source_word: ἐπιστολὰς
  choice: письма
  rationale: Обычное значение ἐπιστολή — письменное послание; множественное число сохранено.
- source_word: αὐτοῖς ... πρὸς αὐτοὺς
  choice: им ... к тем, кто находился
  rationale: 'Два местоимения имеют разные референты: письма дали путешественникам, но адресовали людям по пути. Уточнение устраняет неясность русских местоимений, не добавляя определённой должности адресатам.'
- source_word: κατὰ τόπον
  choice: в каждом месте
  rationale: Передаёт дистрибутивный смысл выражения — по отдельным местам вдоль маршрута.
- source_word: ὅπως
  choice: чтобы
  rationale: Сохраняет целевое значение союза.
- source_word: προπέμπωσιν
  choice: помогли им продолжить путь
  rationale: Глагол может обозначать как отправление дальше, так и сопровождение или содействие путникам; нейтральная формулировка сохраняет широту значения.
- source_word: γῆν Ἰούδα
  choice: землю Иуды
  rationale: Формально близко передаёт конструкцию γῆν Ἰούδα, не заменяя её географическим названием «Иудея».
- source_word: μετʼ εἰρήνης
  choice: с миром
  rationale: Сохраняет образ греческого выражения; в контексте пути подразумевается благополучное и беспрепятственное прибытие.
