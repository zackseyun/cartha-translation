translation:
  language: ru
  text: Ионафан свернул к арабам, называемым завадеями, ударил по ним и захватил их добычу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέκλινεν
  choice: повернул против
  rationale: Передаёт буквальную идею изменения направления и в данном военном контексте ясно указывает, что Ионафан направился против этой группы; более свободное «выступил против» ослабило бы образ поворота.
- source_word: Ἀράβας
  choice: арабов
  rationale: Естественное современное русское обозначение народа во множественном числе.
- source_word: τοὺς καλουμένους
  choice: называемых
  rationale: Прямо и сжато передаёт греческое причастие, вводя название данной группы.
- source_word: Ζαβαδαίους
  choice: завадеями
  rationale: Транслитерация греческого этнонима Ζαβαδαῖοι с привычным для русского языка окончанием названия народа.
- source_word: ἐπάταξεν
  choice: разбил
  rationale: В военном повествовании глагол означает нанесение удара войску или группе; «разбил» звучит естественно по-русски и соответствует последующему захвату добычи, хотя буквальное «поразил» также возможно.
- source_word: σκῦλα
  choice: добычу
  rationale: Обозначает захваченные у противника военные трофеи или имущество; «добыча» ясно и естественно передаёт собирательное значение греческого среднего множественного.
