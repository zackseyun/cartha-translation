  text: It was found in a writing concerning both the Spartans and the Jews that they are brothers and that they are of the family line of Abraham[a][b].
translation:
  language: ru
  text: В письменном источнике[a] о спартанцах и иудеях было найдено, что они — братья и что происходят из рода Авраама[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в документе», «в записи». Греческое слово обозначает письменный источник и здесь не обязательно относится к Священному Писанию.'
    reason: lexical_alternative
  - marker: b
    text: То есть в упомянутом письменном источнике утверждается, что спартанцы и иудеи имеют общее происхождение от Авраама.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρέθη
  choice: было найдено
  rationale: Аорист страдательного залога передан прошедшим временем и безличной пассивной конструкцией, без добавления действующего лица.
- source_word: ἐν γραφῇ
  choice: в одном письменном источнике
  rationale: γραφή здесь означает не обязательно Священное Писание, а некий письменный текст или документ. Слово «одном» естественно для русского изложения и не определяет точный вид источника.
- source_word: περὶ τε τῶν Σπαρτιατῶν καὶ Ἰουδαίων
  choice: о спартанцах и иудеях
  rationale: περί с родительным падежом означает «о, относительно»; парная связь τε…καί сохранена естественным русским союзом «и».
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет прямой образ родства между двумя народами, не ослабляя его до политической дружбы или союзничества.
- source_word: ἐκ γένους Ἀβραάμ
  choice: происходят из рода Авраама
  rationale: Передаёт происхождение и родословную связь, выраженные ἐκ γένους, ясным и современным русским оборотом.
theological_decisions:
- issue: Характер заявленного родства спартанцев и иудеев
  choice: Передать буквально как братство и общее происхождение от Авраама, приписав утверждение письменному источнику.
  alternative: Истолковать «братья» как политических союзников или друзей.
  rationale: Греческий текст прямо говорит об их братстве и происхождении из рода Авраама. Перевод сохраняет это утверждение как содержание цитируемого источника, не вынося суждения о его исторической достоверности.
translation_notes:
  register: Современный литературный русский язык; изложение dignified и доступное. Конструкция сохраняет документальный характер сообщения и не подтверждает от лица переводчика историческую достоверность приведённого утверждения.
