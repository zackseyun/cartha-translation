  yaml_path: translation/deuterocanon/1_maccabees/012/011.yaml
  text: Therefore[a], at all times we continually remember you at the festivals and on the other appointed days, when we offer sacrifices and in our prayers, as it is right and fitting to remember brothers.
translation:
  language: ru
  text: 'Поэтому мы во всякое время непрестанно помним о вас: в праздники и в прочие установленные дни[a], во время приношения жертв и в молитвах, — как и должно и подобает помнить о братьях.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в прочие подобающие дни» или «в прочие положенные дни». Греческое καθηκούσαις может обозначать дни, которые подобает соблюдать, которые обычно соблюдаются или специально для этого установлены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: неизменно
  rationale: Передаёт постоянство и регулярность памятования, не создавая в сочетании с «во всякое время» столь тяжеловесного повтора, как «непрестанно».
- source_word: ἑορταῖς
  choice: праздники
  rationale: Обозначает религиозные праздничные дни; это естественное и понятное современному читателю соответствие.
- source_word: λοιπαῖς καθηκούσαις ἡμέραις
  choice: прочие установленные дни
  rationale: «Прочие» передаёт λοιπαῖς, а «установленные» уместно выражает здесь καθηκούσαις — дни, положенные или предназначенные для соблюдения; неоднозначность отмечена в сноске.
- source_word: μιμνησκόμεθα ὑμῶν
  choice: вспоминаем о вас
  rationale: Естественно передаёт глагол памятования с объектом; контекст жертв и молитв указывает на деятельное поминовение.
- source_word: ἐφʼ ὧν
  choice: когда
  rationale: Естественная временная передача оборота, связывающего названные дни с принесением жертв.
- source_word: προσφέρομεν θυσιῶν
  choice: приносим жертвы
  rationale: Точно сохраняет храмовую, культовую лексику исходного текста.
- source_word: ἐν ταῖς προσευχαῖς
  choice: в молитвах
  rationale: Сохраняет форму и смысл греческого выражения без добавления отсутствующего в оригинале притяжательного местоимения.
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: как и должно и подобает
  rationale: 'Сохраняет парное усиление: нравственную обязательность и уместность действия.'
- source_word: ἀδελφῶν
  choice: братьях
  rationale: Сохраняет грамматически мужское и дипломатически-родственное обозначение исходного текста.
theological_decisions:
- issue: Родственное обозначение ἀδελφῶν
  choice: братьях
  alternative: братьях и сёстрах; соплеменниках; родных
  rationale: Греческая форма мужского рода здесь служит языком братских отношений между народами; нейтрализация ослабила бы риторическую силу оригинала.
- issue: Культовая лексика жертв и молитв
  choice: сохранить прямое упоминание принесения жертв
  alternative: обобщить как «приношения» или «богослужение»
  rationale: Исходный текст прямо называет жертвы и молитвы; обобщение скрыло бы храмовый контекст.
translation_notes:
  register: Современный литературный русский язык с достоинством официального братского послания. Синтаксис сохраняет усиление «во всякое время неизменно» и двойную формулу «должно и подобает», не устраняя риторическую избыточность оригинала.
