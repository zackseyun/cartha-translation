base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/014.yaml
  text: We have tried to send to you and renew the brotherhood and friendship[a], so that we might not become estranged from you; for many years have passed since you sent to us.
translation:
  language: ru
  text: Мы попытались послать к вам, чтобы возобновить братство и дружбу с вами и не отдалиться от вас, ведь прошло много времени с тех пор, как вы послали к нам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «с тех пор, как вы послали к нам». Дополнение при глаголе «послали» не выражено; речь может идти о послании, людях или ином отправленном предмете.
    reason: Сохраняет неоднозначность невыраженного дополнения при ἀπεστείλατε. Аналогичное опущение дополнения при первом «послать» в русском основном тексте отражает синтаксис греческого текста.
lexical_decisions:
- source_word: ἐπειράθημεν
  choice: мы решили
  rationale: В данном дипломатическом контексте передаёт предпринятое намерение; буквальное «мы попытались» по-русски может ошибочно намекать на неудачу.
- source_word: ἀποστεῖλαι
  choice: послать к вам людей
  rationale: Глагол употреблён без выраженного дополнения; по контексту переписки подразумевается отправка представителей. Добавление «людей» обеспечивает естественность русского синтаксиса, не уточняя их официальный статус.
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: наши братские узы и дружбу
  rationale: «Братские узы» естественно передают дипломатическое ἀδελφότης как отношение братства, а φιλία — как «дружбу».
- source_word: ἀνανεώσασθαι
  choice: обновить
  rationale: Передаёт восстановление и подтверждение уже существующих отношений.
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: не стать вам чужими
  rationale: Естественно передаёт цель и значение отчуждения или отдаления; связь с ὑμῶν выражена дательным «вам».
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: ведь прошло уже много времени
  rationale: Идиоматичный русский эквивалент множественного καιροί в значении продолжительных периодов времени; не вводит более узкое «годы», которого нет в греческом.
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: с тех пор, как вы присылали к нам своих посланников
  rationale: Греческий глагол оставляет объект невыраженным. По контексту дипломатической переписки вероятны посланники, но это уточнение отмечено сноской как контекстуальное.
