revisions:
- from: Мы решили послать к вам людей, чтобы обновить наши братские узы и дружбу и не стать вам чужими, ведь прошло уже много времени с тех пор, как вы присылали к нам своих посланников.[a]
  to: Мы попытались послать к вам, чтобы возобновить братство и дружбу с вами и не отдалиться от вас, ведь прошло много времени с тех пор, как вы послали к нам.[a]
  rationale: Редакция восстанавливает значение ἐπειράθημεν как попытки и удаляет не подтверждённые текстом уточнения об отправке людей или посланников. Целевое значение πρὸς τὸ μή передано союзом «чтобы», а ἐξαλλοτριωθῆναι ὑμῶν — нейтральным «не отдалиться от вас».
