review_pass:
  verdict: revise
  source_fidelity: 'В черновике существенно усилены два невыраженных дополнения: «людей» при ἀποστεῖλαι и «своих посланников» при ἀπεστείλατε. Сноска признаёт второе добавление, но основной текст всё же выдаёт его за содержание оригинала. Кроме того, ἐπειράθημεν означает «мы попытались / предприняли попытку», а не «мы решили».'
  naturalness: Предлагаемая редакция сохраняет современный литературный и дипломатический тон. Необычное для русского опущение дополнения при «послать» оправдано намеренным сохранением греческой недосказанности; оно пояснено сноской.
  terminology: «Братство и дружба с вами» прямо передаёт ἀδελφότης καὶ φιλία πρὸς ὑμᾶς без неоговорённого добавления «наши» или «между нами». «Не отдалиться от вас» естественно передаёт цель не стать отчуждёнными.
  issues:
