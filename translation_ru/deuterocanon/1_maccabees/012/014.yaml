    issue: «Мы решили» вместо «Мы попытались»
    rationale: ἐπειράθημεν — аорист от πειράομαι, «попытаться, предпринять попытку». «Решили» заменяет предпринятое действие внутренним намерением.
  - severity: high
    issue: В текст введены «люди» и «свои посланники»
    rationale: В обоих случаях греческий глагол ἀποστέλλω употреблён без выраженного дополнения. Контекст может предполагать послание или представителей, но перевод не должен выбирать один вариант как факт.
  - severity: medium
    issue: Сноска не устраняет добавление в основном тексте
    rationale: Примечание о том, что объект не назван, противоречит формулировке «своих посланников» в переводе; необходима нейтральная основная формулировка.
  revised_text: Мы попытались послать к вам, чтобы возобновить братство и дружбу с вами и не отдалиться от вас, ведь прошло много времени с тех пор, как вы послали к нам.[a]
