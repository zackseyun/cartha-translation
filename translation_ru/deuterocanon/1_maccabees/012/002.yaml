  text: Он также отправил письма спартанцам и в другие места — такого же содержания[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с тем же смыслом»; греческий оборот указывает, что эти письма соответствовали по содержанию только что упомянутому письму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Аорист ἀποστέλλω обозначает завершённое действие; «послал» естественно и точно передаёт его в данном контексте.
- source_word: ἐπιστολὰς
  choice: письма
  rationale: Форма множественного числа прямо указывает на несколько писем.
- source_word: πρὸς Σπαρτιάτας
  choice: спартанцам
  rationale: При глаголе отправления πρός обозначает адресатов; русский дательный падеж передаёт это естественно.
- source_word: τόπους ἑτέρους
  choice: в другие места
  rationale: Сохраняется общее географическое значение τόπους без неоправданного уточнения до областей или государств.
- source_word: κατὰ ταὐτά
  choice: такого же содержания
  rationale: Оборот указывает на соответствие ранее упомянутому письму по содержанию или смыслу; этот вариант точнее простого «так же» и не утверждает дословного совпадения.
