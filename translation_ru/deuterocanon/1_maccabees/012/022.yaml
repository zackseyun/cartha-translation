  yaml_path: translation/deuterocanon/1_maccabees/012/022.yaml
  text: And now[a], since we have learned these things, you will do well to write to us concerning your peace.
translation:
  language: ru
  text: И теперь, узнав это, вы хорошо поступите, если напишете нам о вашем мире.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о вашем благополучии». Греческое слово, переведённое как «мир», может также означать благополучие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: И теперь
  rationale: Сохраняет соединительное καί и временное νῦν, естественно продолжая ход письма.
- source_word: ἀφʼ οὗ ἔγνωμεν ταῦτα
  choice: узнав это
  rationale: 'Причастный оборот естественно передаёт причинно-временной смысл: теперь, когда адресанты получили эти сведения. «Это» по-русски яснее и естественнее, чем буквальное «эти вещи».'
- source_word: καλῶς ποιήσετε
  choice: вы хорошо поступите
  rationale: Устойчиво и понятно передаёт эпистолярную формулу одобрения или вежливого побуждения.
- source_word: γράφοντες ἡμῖν
  choice: если напишете нам
  rationale: Условная конструкция естественно выражает, в чём именно адресаты «хорошо поступят», не усиливая побуждение до приказа.
- source_word: περὶ τῆς εἰρήνης ὑμῶν
  choice: о вашем мире
  rationale: Сохраняет прямое значение εἰρήνη и дипломатический оттенок; возможный смысл благополучия отмечен в сноске.
