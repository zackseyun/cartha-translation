lexical_decisions:
- source_word: οἱ ὑπεναντίοι
  choice: противники
  rationale: Передаёт людей, выступающих против Ионафана, не усиливая значение до «врагов», хотя военный контекст допускает и такой перевод.
- source_word: ἡτοίμασται
  choice: готовы
  rationale: Перфект выражает достигнутое состояние готовности; краткое русское «готовы» естественно передаёт этот результат.
- source_word: οἱ παρʼ αὐτοῦ
  choice: те, кто был с ним
  rationale: Сохраняет буквальный смысл находящихся рядом с Ионафаном и не добавляет отсутствующего в греческом слова «воины».
- source_word: εἰς πόλεμον
  choice: к войне
  rationale: Прямо передаёт направленность подготовки к военным действиям, не сужая значение до одного сражения.
- source_word: ἐφοβήθησαν
  choice: испугались
  rationale: Естественный современный русский эквивалент аориста со значением возникшего страха.
- source_word: ἔπηξαν τὴν καρδίαν αὐτῶν
  choice: пали духом
  rationale: Передаёт смысл образного выражения об утрате мужества; буквальный образ сердца разъяснён в сноске, поскольку дословный перевод по-русски был бы неясен или мог бы получить противоположный смысл.
- source_word: ἀνέκαυσαν πυρὰς
  choice: разожгли костры
  rationale: В лагерном контексте «костры» звучит конкретнее и естественнее общего «огни», сохраняя значение разжигания огня.
- source_word: ἐν τῇ παρεμβολῇ αὐτῶν
  choice: в своём лагере
  rationale: Военное значение παρεμβολή здесь естественно передаётся словом «лагерь»; возвратное «своём» ясно соотносит лагерь с подлежащим.
