  yaml_path: translation/deuterocanon/1_maccabees/012/033.yaml
  text: And Simon went out and passed through as far as Ashkelon and the nearby strongholds[a], and he turned aside to Joppa and took it beforehand.
translation:
  language: ru
  text: Симон выступил и прошёл до Аскалона и близлежащих крепостей; затем он свернул к Иоппии и заблаговременно овладел ею[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «овладел ею первым»; греческий глагол означает, что город заняли заранее, опередив другую сторону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: выступил
  rationale: В повествовании о передвижении военного предводителя «выступил» естественно передаёт выход в путь, не добавляя значения нападения.
- source_word: διώδευσεν
  choice: прошёл
  rationale: Глагол обозначает прохождение через местность или по пути; «прошёл» сохраняет это значение без излишнего акцента на военном марше.
- source_word: ἕως Ἀσκάλωνος
  choice: до Аскалона
  rationale: Предлог ἕως указывает на предел движения; русское «до» точно и естественно передаёт эту пространственную границу.
- source_word: τὰ πλησίον ὀχυρώματα
  choice: близлежащих крепостей
  rationale: ὀχυρώματα — укреплённые места или крепости, а πλησίον указывает на их близость. Родительный падеж продолжает конструкцию «до».
- source_word: ἐξέκλινεν εἰς Ἰόππην
  choice: свернул к Иоппии
  rationale: ἐκκλίνω передаёт отклонение от прежнего направления; «свернул к» естественно обозначает перемену маршрута.
- source_word: προκατελάβετο
  choice: заблаговременно овладел
  rationale: Сложный глагол выражает овладение местом заранее, прежде другой стороны. «Заблаговременно овладел» сохраняет упреждающий оттенок, не уточняя не названного в стихе соперника.
- source_word: αὐτήν
  choice: ею
  rationale: Местоимение относится к Иоппии; женский род сохраняется в соответствии с русским названием города.
