  yaml_path: translation/deuterocanon/1_maccabees/011/040.yaml
  text: And he stayed close to him[a], so that he might hand him over to him, so that he might reign in place of his father. And they reported to him all that Demetrius had done, and the hostility with which his forces were hostile to him; and he remained there many days.
translation:
  language: ru
  text: И он оставался при нём, чтобы передать его ему, чтобы он царствовал вместо своего отца. Ему сообщили обо всём, что сделал Димитрий, и о вражде, которую питали к нему его войска[a]. И он оставался там много дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблены однокоренные слова: буквально — «о вражде, которой враждовали с ним его войска». Речь идёт о враждебности к Димитрию со стороны его войск.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσήδρευσεν αὐτῷ
  choice: неотступно находился при нём
  rationale: Глагол передаёт постоянное пребывание рядом или тесную привязанность к кому-либо. Выражение сохраняет эту пространственно-социальную близость, не приписывая персонажу прямо не названной лести.
- source_word: παραδοῖ αὐτὸν αὐτῷ
  choice: тот передал ему юношу
  rationale: παραδίδωμι означает «передавать, выдавать». Имена и обозначение «юноша» проясняются непосредственным контекстом стиха, а добавленное обозначение помогает избежать непонятного русского сочетания нескольких местоимений, не устраняя реальной неоднозначности их отнесения без контекста.
- source_word: βασιλεύσῃ ἀντὶ τοῦ πατρὸς αὐτοῦ
  choice: юноша царствовал вместо своего отца
  rationale: «Царствовал» точно передаёт βασιλεύω, а «вместо своего отца» сохраняет значение замещения или престолонаследия, выраженное ἀντί.
- source_word: ἀπήγγειλαν
  choice: сообщили
  rationale: Глагол обозначает передачу известия или донесения; «сообщили» естественно звучит в политико-военном повествовании.
- source_word: ὅσα συνετέλεσεν Δημήτριος
  choice: обо всём, что сделал Димитрий
  rationale: Нейтральное «сделал» сохраняет широту συνετέλεσεν и не предполагает ни успешности, ни одобрения его действий.
- source_word: τὴν ἔχθραν ἣν ἐχθραίνονσιν αὐτῷ
  choice: о вражде, которую питали к нему
  rationale: Русское выражение передаёт активную неприязнь, выраженную однокоренными существительным и глаголом в греческом, но избегает неестественного буквального повтора.
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: его собственные войска
  rationale: 'В военном повествовании δυνάμεις означает вооружённые силы. «Собственные» явно передаёт важную мысль: против Димитрия выступали именно его войска.'
- source_word: ἔμεινεν ἐκεῖ ἡμέρας πολλάς
  choice: он оставался там много дней
  rationale: Близкая к форме греческого и естественная русская передача временного указания.
