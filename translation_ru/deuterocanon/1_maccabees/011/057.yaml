  yaml_path: translation/deuterocanon/1_maccabees/011/057.yaml
  text: And Antiochus the younger wrote to Jonathan[a], saying, “I appoint you to the high priesthood, and I appoint you over the four districts, and that you are to be among the king’s Friends.”
translation:
  language: ru
  text: 'И Антиох Младший написал Ионафану: «Утверждаю за тобой сан первосвященника, назначаю тебя правителем четырёх областей, и быть тебе в числе друзей царя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно, «Друзей царя»: вероятно, речь идёт об официальном придворном звании в эллинистической монархии, а не просто о личных друзьях царя.'
    reason: Сохранение возможного специального значения придворного термина φίλοι τοῦ βασιλέως.
lexical_decisions:
- source_word: ἔγραψεν
  choice: написал
  rationale: Прямо передаёт аорист глагола γράφω; последующая прямая речь ясно указывает на содержание письма.
- source_word: ὁ νεώτερος
  choice: Младший
  rationale: Передаёт различительный эпитет Антиоха и естественно звучит как часть имени в русском историческом повествовании.
- source_word: Ἵστημί σοι τὴν ἀρχιερωσύνην
  choice: утверждаю за тобой сан первосвященника
  rationale: В административном контексте выражение означает официальное закрепление должности; оборот «за тобой» сохраняет значение дательного σοι и не предполагает непременно первого назначения на этот сан.
- source_word: καθίστημί σε ἐπὶ τῶν τεσσάρων νομῶν
  choice: назначаю тебя правителем четырёх областей
  rationale: Передаёт официальное поставление над административными единицами; «области» понятно современному читателю и не вносит более узкого технического значения слова «номы».
- source_word: εἶναί σε τῶν φίλων τοῦ βασιλέως
  choice: быть тебе в числе друзей царя
  rationale: Сохраняет отдельную инфинитивную конструкцию греческого текста и вероятный смысл принадлежности к придворному кругу или рангу.
theological_decisions:
- issue: Статус выражения φίλοι τοῦ βασιλέως
  choice: друзья царя с пояснением в сноске о возможном придворном звании
  alternative: личные друзья или приближённые царя
  rationale: Выражение, вероятно, обозначает эллинистический придворный ранг, однако сам греческий текст допускает и обычное лексическое понимание; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского послания. Формула «и быть тебе» слегка торжественна, но естественна в указном контексте и отражает синтаксическую смену в греческом оригинале.
