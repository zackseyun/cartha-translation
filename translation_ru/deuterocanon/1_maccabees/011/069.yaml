  text: But the ambushes rose up from their places and joined battle[a], and all those with Jonathan fled.
translation:
  language: ru
  text: Но сидевшие в засаде[a] вышли со своих мест и вступили в бой, и все, кто был с Ионафаном, бежали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «засады поднялись»; имеются в виду скрывавшиеся в засаде воины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔνεδρα
  choice: сидевшие в засаде
  rationale: Средний род множественного числа буквально обозначает «засады», однако глагол действия указывает на скрывавшихся воинов. Выбранная передача естественна по-русски и не добавляет лишних подробностей.
- source_word: ἐξανέστησαν
  choice: вышли
  rationale: В данном военном контексте глагол описывает появление скрывавшихся бойцов из засады; «вышли» передаёт это яснее, чем буквальное «поднялись».
- source_word: ἐκ τῶν τόπων ἑαυτῶν
  choice: со своих мест
  rationale: Сохраняет простое значение τόποι и возвратное ἑαυτῶν, не уточняя без необходимости, были ли это позиции или укрытия.
- source_word: συνῆψαν πόλεμον
  choice: вступили в бой
  rationale: Естественный русский эквивалент греческого военного оборота со значением начала непосредственного сражения.
- source_word: οἱ παρὰ Ἰωνάθαν
  choice: все, кто был с Ионафаном
  rationale: Передаёт людей, находившихся при Ионафане или сопровождавших его, не усиливая выражение до притяжательного «люди Ионафана».
- source_word: πάντες
  choice: все
  rationale: Явно сохраняет эмфатическое указание на бегство всех находившихся с Ионафаном.
