base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/008.yaml
  text: But King Ptolemy gained control of the cities of the coast as far as Seleucia-by-the-Sea[a], and he was devising evil plans against Alexander.
translation:
  language: ru
  text: Но царь Птолемей овладел приморскими городами вплоть до Селевкии Приморской[a] и обдумывал злые замыслы против Александра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и обдумывал злые замыслы относительно Александра». Греческое περὶ Ἀλεξάνδρου буквально означает «относительно Александра», но в данном контексте подразумеваются враждебные замыслы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκυρίευσεν
  choice: овладел
  rationale: Глагол обозначает обретение господства или контроля; «овладел» естественно передаёт военно-политический контекст и не предполагает непременно долговременного правления.
- source_word: τῶν πόλεων τῆς παραλίας
  choice: приморскими городами
  rationale: Компактно и естественно передаёт города прибрежной области, сохраняя географический смысл греческого выражения.
- source_word: ἕως Σελευκίας τῆς παραθαλασσίας
  choice: вплоть до Селевкии Приморской
  rationale: Определение «Приморская» различает этот город с другими Селевкиями и соответствует значению παραθαλασσίας — находящейся у моря.
- source_word: διελογίζετο
  choice: замышлял
  rationale: Имперфект указывает на продолжающееся обдумывание; в сочетании со «злыми планами» глагол естественно выражает злонамеренное намерение.
- source_word: λογισμοὺς πονηρούς
  choice: злые планы
  rationale: Передаёт как смысл расчётов или замыслов, так и явную отрицательную нравственную характеристику πονηρούς.
- source_word: περὶ Ἀλεξάνδρου
  choice: против Александра
  rationale: Буквально оборот означает «об Александре», однако контекст злых замыслов придаёт ему направленный против Александра смысл; подлинная формальная неоднозначность отмечена в сноске.
