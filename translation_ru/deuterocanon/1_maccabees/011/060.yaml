  yaml_path: translation/deuterocanon/1_maccabees/011/060.yaml
  text: And Jonathan went out[a], and he traveled beyond the river and through the cities, and all the forces of Syria gathered to him as allies, and he came to Ashkelon[b], and the men of the city met him with honor.
translation:
  language: ru
  text: И выступил Ионафан и проходил за рекой[a], через города. Все войска Сирии собрались к нему как союзники[b]. Он пришёл в Аскалон, и жители города встретили его с почестями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте река не названа; в данном историческом контексте, вероятно, имеется в виду Евфрат.
    reason: cultural_note
  - marker: b
    text: 'Возможный перевод: «для союза» или «в союз». Греческое выражение εἰς συμμαχίαν указывает, что сирийские войска собрались в поддержку Ионафана как союзники.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλεν
  choice: выступил
  rationale: В повествовании о военном походе «выступил» естественно передаёт начало движения, не добавляя значения, прямо не выраженного греческим глаголом.
- source_word: διεπορεύετο
  choice: шёл
  rationale: Имперфект передаёт продолжавшееся движение; простое «шёл» сохраняет повествовательную динамику и не уточняет способ передвижения.
- source_word: πέραν τοῦ ποταμοῦ
  choice: по ту сторону реки
  rationale: Передаёт пространственное значение πέραν и сохраняет неопределённость оригинала, где река не названа.
- source_word: ἐν ταῖς πόλεσιν
  choice: по городам
  rationale: Сочетание с глаголом движения естественно понимать как продвижение по городам; русский оборот сохраняет эту связь и не требует добавления «через».
- source_word: δυνάμεις Συρίας
  choice: войска Сирии
  rationale: В данном военном контексте δυνάμεις обозначает вооружённые силы; «войска» звучит естественно и не предполагает непременно единой армии.
- source_word: εἰς συμμαχίαν
  choice: чтобы вступить в союз с ним
  rationale: Оборот с εἰς обозначает направленность или цель сбора. Развёрнутый русский перевод ясно выражает союзническую поддержку Ионафана.
- source_word: Ἀσκαλῶνα
  choice: Аскалон
  rationale: Традиционная русская форма древнего топонима.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: жители города
  rationale: Буквально «те, кто из города»; «жители города» — естественный русский эквивалент без неоправданного ограничения только мужчинами.
- source_word: ἐνδόξως
  choice: с почестями
  rationale: Передаёт почётный, торжественный характер встречи и соответствует современной русской повествовательной норме.
