  yaml_path: translation/deuterocanon/1_maccabees/011/068.yaml
  text: And behold[a], a camp of foreigners met him in the plain, and they set an ambush against him in the mountains, while they themselves advanced from the front.
translation:
  language: ru
  text: И вот, на равнине ему навстречу выступило войско иноплеменников. Они устроили против него засаду в горах, а сами двинулись навстречу с противоположной стороны.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а сами встретили его лицом к лицу». Буквально последняя часть фразы означает: «а сами встретили с противоположной стороны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴ
  choice: войско
  rationale: В военном контексте существительное может обозначать не только лагерь, но и расположенное лагерем войско. Здесь оно выступает навстречу, поэтому «войско» естественнее русского «лагерь» и сохраняет военный смысл.
- source_word: ἀλλοφύλων
  choice: иноплеменников
  rationale: Слово обозначает людей другого племени или народа. «Иноплеменники» сохраняет обобщённый этнический смысл, не отождествляя их ошибочно с филистимлянами.
- source_word: ἀπήντα αὐτῷ
  choice: ему навстречу выступило
  rationale: Передаёт движение войска навстречу герою и звучит естественно в русском военном повествовании.
- source_word: ἐν τῷ πεδίῳ
  choice: на равнине
  rationale: πεδίον здесь обозначает ровную открытую местность в противопоставлении горам.
- source_word: ἐξέβαλον ἔνεδρον
  choice: устроили засаду
  rationale: Русское устойчивое выражение ясно передаёт греческую военную идиому о размещении засады.
- source_word: ἐπʼ αὐτὸν
  choice: против него
  rationale: Сохраняет направленность враждебного действия.
- source_word: ἐν τοῖς ὄρεσιν
  choice: в горах
  rationale: Прямое пространственное соответствие, сохраняющее контраст с равниной.
- source_word: αὐτοὶ δὲ ἀπήντησαν ἐξ ἐναντίας
  choice: а сами двинулись навстречу с противоположной стороны
  rationale: «Сами» сохраняет эмфатическое αὐτοί и противопоставляет основные силы засаде; формулировка удерживает буквальную пространственную неопределённость ἐξ ἐναντίας, не сводя её безоговорочно к атаке с фронта.
