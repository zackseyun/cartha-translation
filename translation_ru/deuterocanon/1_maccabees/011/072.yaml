lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: повернул назад
  rationale: Передаёт обычное значение глагола «поворачивать назад, возвращаться» и сохраняет указание на смену направления.
- source_word: πρὸς αὐτοὺς πόλεμον
  choice: чтобы сразиться с ними
  rationale: Естественно передаёт сжатый греческий оборот, в котором πόλεμον обозначает военное столкновение, направленное против них.
- source_word: ἐτροπώσατο
  choice: обратил их в бегство
  rationale: 'Точно выражает военное значение глагола: заставить противника повернуть и бежать; последующая фраза намеренно сохраняет усиление оригинала.'
- source_word: ἔφυγον
  choice: они бежали
  rationale: Прямой и краткий перевод аориста в повествовании; сохраняет повтор смысла после «обратил их в бегство».
