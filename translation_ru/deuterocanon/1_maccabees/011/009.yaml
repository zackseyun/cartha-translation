base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/009.yaml
  text: And he sent envoys to King Demetrius[a], saying, “Come, let us make a covenant with one another, and I will give you my daughter whom Alexander has[b], and you will reign over your father's kingdom.”
translation:
  language: ru
  text: 'И он послал послов к царю Димитрию со словами: «Приди, заключим между собой договор[a]. Я отдам тебе свою дочь, которая ныне у Александра[b], и ты будешь царствовать над царством своего отца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заключим между собой союз». Греческое διαθήκη обозначает официальное соглашение и также может переводиться словом «завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мою дочь, которую имеет Александр»; речь идёт о дочери, которая в то время была женой Александра.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычная повествовательная передача аориста ἀποστέλλω; современное и естественное русское слово.
- source_word: πρέσβεις
  choice: послов
  rationale: πρέσβεις обозначает официальных дипломатических представителей; «послы» точно передаёт политический контекст.
- source_word: συνθώμεθα ... διαθήκην
  choice: заключим ... договор
  rationale: Сочетание означает заключение формального соглашения. В данном межгосударственном контексте «договор» звучит естественнее, чем богословски окрашенный «завет», при этом не ослабляет официального характера соглашения.
- source_word: πρὸς ἑαυτούς
  choice: между собой
  rationale: Естественно передаёт взаимное значение греческого оборота.
- source_word: δώσω σοι τὴν θυγατέρα μου
  choice: Я отдам тебе мою дочь
  rationale: Сохраняет прямую форму брачно-династического предложения и выраженное в греческом притяжательное местоимение.
- source_word: ἣν ἔχει Ἀλέξανδρος
  choice: которая сейчас у Александра
  rationale: Передаёт, что дочь в настоящее время находится у Александра, не добавляя прямо не названного в этой части стиха уточнения о браке и избегая неестественного «которую Александр имеет».
- source_word: βασιλεύσεις
  choice: будешь царствовать
  rationale: Сохраняет глагольное значение βασιλεύω и высокий, но понятный повествовательный регистр.
- source_word: τῆς βασιλείας τοῦ πατρός σου
  choice: над царством своего отца
  rationale: Родительный падеж при βασιλεύω обозначает область царствования; «над царством» ясно передаёт царство как владение отца.
