lexical_decisions:
- source_word: οἱ φυγόντες παρ᾽ αὐτοῦ
  choice: те, кто бежал от него
  rationale: Субстантивированное причастие обозначает людей, ранее покинувших предводителя; формулировка сохраняет предшествующее действие и связь с αὐτοῦ.
- source_word: ἴδον
  choice: увидев это
  rationale: В греческом объект не назван и восстанавливается из предыдущих событий. Русское «это» обеспечивает естественность, не конкретизируя референт сверх источника.
- source_word: ἐπέστρεψαν πρὸς αὐτόν
  choice: вернулись к нему
  rationale: Передаёт как поворот назад, так и возвращение к ранее оставленному предводителю.
- source_word: ἐδίωκον μετ᾽ αὐτοῦ
  choice: вместе с ним преследовали врагов
  rationale: Имперфект указывает на продолжавшееся преследование. Дополнение «врагов» естественно в русском и определяется военным контекстом, хотя в греческом оно подразумевается.
- source_word: ἕως Κάδης
  choice: до Кадеса
  rationale: ἕως обозначает пространственный предел; форма «Кадеса» соответствует принятой русской передаче названия Кадес.
- source_word: τῆς παρεμβολῆς αὐτῶν
  choice: до их лагеря
  rationale: Военный смысл παρεμβολή передан словом «лагерь». Местоимение сохранено без явного отождествления его референта, поскольку греческий текст этого не уточняет.
- source_word: παρενέβαλον ἐκεῖ
  choice: там расположились станом
  rationale: Выражение передаёт военное устройство лагеря и сохраняет лексическую связь с παρεμβολή без неестественного повтора «лагерь — разбили лагерь».
