  source_fidelity: 'В исходном греческом οἱ φυγόντες является подлежащим при ἴδον: «те, кто бежал от него, увидели [это]». В проекте деепричастный оборот «Увидев это» несколько меняет синтаксическое членение. Существеннее, что дополнение «врагов» при «преследовали» отсутствует в греческом тексте; объект там подразумевается контекстом, но не назван. Его следует не вносить в основной текст. Неопределённый объект ἴδον и неоднозначный референт αὐτῶν корректно отмечены сносками.'
  naturalness: Исправленный порядок слов остаётся естественным для современного литературного русского. «Расположились станом» — понятное и уместное в военном повествовании выражение, хотя и с умеренно книжной окраской.
