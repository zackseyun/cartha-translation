  text: And King Demetrius sat on the throne of his kingdom, and the land was quiet before him.
translation:
  language: ru
  text: И царь Димитрий воссел на престол своего царства, и земля утихла перед ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: воссел
  rationale: В данном царском контексте аорист καθίζω обозначает занятие престола. «Воссел» естественно передаёт торжественный образ воцарения, не добавляя прямо значения «стал царём».
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  choice: на престоле своего царства
  rationale: Сохраняет явное упоминание βασιλεία и греческую родительную конструкцию, оставаясь понятным по-русски.
- source_word: ἡσύχασεν
  choice: утихла
  rationale: Глагол указывает на прекращение волнений и наступление спокойствия, но не обязательно на полный мир или благополучие. «Утихла» сохраняет эту сдержанность.
- source_word: ἡ γῆ
  choice: земля
  rationale: В историческом контексте речь идёт о подвластной территории, а не обо всей земле как мире; русское «земля» сохраняет образ и допускает нужное территориальное значение.
- source_word: ἐνώπιον αὐτοῦ
  choice: пред ним
  rationale: Близко передаёт буквальное «перед ним», сохраняя возможный оттенок спокойствия перед лицом его власти без пояснительного расширения.
- source_word: ὁ βασιλεὺς Δημήτριος
  choice: царь Димитрий
  rationale: Обычный для русского библейско-исторического повествования порядок титула и имени; форма «Димитрий» соответствует традиционной русской передаче этого имени в 1 Маккавейской.
