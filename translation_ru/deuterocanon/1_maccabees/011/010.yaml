  text: For I regret giving him my daughter[a], for he sought to kill me.
translation:
  language: ru
  text: 'Ведь я сожалею, что отдал ему свою дочь[a]: он пытался убить меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он хотел убить меня». Греческий глагол может обозначать как стремление, так и попытку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταμεμέλημαι
  choice: я сожалею
  rationale: Перфектная форма передаёт сохраняющееся в настоящем сожаление о прошлом поступке; «сожалею» естественно звучит в политическом контексте и не привносит религиозного оттенка покаяния.
- source_word: δοὺς
  choice: что отдал
  rationale: Аористное причастие указывает на завершённый поступок, ставший причиной сожаления; конструкция «сожалею, что отдал» естественна для современного русского языка.
- source_word: τὴν θυγατέρα μου
  choice: свою дочь
  rationale: Возвратное притяжательное местоимение нормативно и ясно указывает, что речь идёт о дочери говорящего.
- source_word: ἐζήτησεν
  choice: пытался
  rationale: ζητέω с инфинитивом может означать как стремление, так и попытку совершить действие. «Пытался» естественно в русском контексте; неоднозначность отмечена в сноске.
- source_word: ἀποκτεῖναί
  choice: убить
  rationale: Прямой и нейтральный эквивалент, не добавляющий юридической или нравственной квалификации, присущей слову «убить» в отличие от более маркированного «умертвить» или «совершить убийство».
