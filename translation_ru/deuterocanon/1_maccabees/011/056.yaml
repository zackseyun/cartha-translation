  text: And Tryphon took the elephants and gained control of Antioch[a].
translation:
  language: ru
  text: И Трифон захватил слонов и овладел Антиохией.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «зверей»; в данном военном контексте имеются в виду боевые слоны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: захватил
  rationale: Аорист от λαμβάνω с прямым дополнением в военно-политическом повествовании означает, что Трифон взял слонов под свой контроль; «захватил» естественно передаёт этот смысл по-русски.
- source_word: Τρύφων
  choice: Трифон
  rationale: Традиционная русская передача греческого личного имени.
- source_word: τὰ θηρία
  choice: слонов
  rationale: Буквально выражение означает «зверей» или «животных», но в данном эллинистическом военном контексте обозначает боевых слонов. Конкретный референт вынесен в основной текст, а буквальное значение отмечено в сноске.
- source_word: κατεκράτησεν
  choice: овладел
  rationale: Глагол κατακρατέω с родительным падежом выражает установление власти или контроля. «Овладел Антиохией» кратко и естественно передаёт военно-политический смысл.
- source_word: Ἀντιοχίας
  choice: Антиохией
  rationale: Название города стоит в родительном падеже при κατακρατέω; русская конструкция с «овладел» требует творительного падежа.
