  yaml_path: translation/deuterocanon/1_maccabees/011/062.yaml
  text: And the men from Gaza asked terms of Jonathan[a], and he gave them pledges; and he took the sons of their rulers as hostages and sent them to Jerusalem[b]. And he passed through the country as far as Damascus.
translation:
  language: ru
  text: Люди из Газы обратились к Ионафану с просьбой, и он дал им гарантии[a]. Сыновей их правителей он взял в заложники и отправил в Иерусалим[b]. Затем он прошёл по стране до Дамаска.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дал им правые руки»; это выражение обозначает предоставление гарантий, подтверждение доброй воли или соглашения.'
    reason: lexical_alternative
  - marker: b
    text: После слова «Иерусалим» в данном греческом тексте отдельно стоит слово «Асалим» (Ἀσαλήμ). Оно не вписывается в синтаксис фразы и, возможно, представляет собой искажение текста или случайно попавшее сюда название места.
    reason: textual_variant
lexical_decisions:
- source_word: ἠξίωσαν οἱ ἀπὸ Γάζης Ἰωνάθαν
  choice: Жители Газы обратились к Ионафану с просьбой об условиях мира
  rationale: Буквально речь идёт о «тех, кто из Газы», обратившихся к Ионафану с настоятельной просьбой. Военно-политический контекст позволяет естественно передать подразумеваемый предмет просьбы как условия мира, не утверждая более конкретного содержания переговоров.
- source_word: ἔδωκεν αὐτοῖς δεξιάς
  choice: он дал им заверение
  rationale: Буквально «дал им правые руки»; это устойчивый жест и выражение, обозначающие гарантию доброй воли, верности договорённости или мира. Единственное число «заверение» естественно по-русски и не добавляет прямо отсутствующее в греческом слово «мира».
- source_word: τοὺς υἱοὺς τῶν ἀρχόντων αὐτῶν
  choice: сыновей их правителей
  rationale: ἀρχόντων обозначает лиц, обладающих властью; «правителей» сохраняет политический смысл и торжественно-исторический регистр.
- source_word: εἰς ὅμηρα
  choice: в заложники
  rationale: Оборот указывает, в каком качестве были взяты сыновья правителей; современное русское выражение «взять в заложники» точно и естественно.
- source_word: διῆλθεν τὴν χώραν ἕως Δαμασκοῦ
  choice: прошёл по этой земле вплоть до Дамаска
  rationale: χώρα здесь означает территорию или область, по которой двигался Ионафан; «по этой земле» сохраняет широту обозначения, а «вплоть до Дамаска» точно передаёт ἕως Δαμασκοῦ.
- source_word: Ἀσαλήμ
  choice: не включено в основной текст; отмечено в сноске
  rationale: В данном греческом свидетеле слово стоит изолированно после «Иерусалим» и не образует ясной синтаксической связи. Его присутствие сохранено в примечании как текстологическая трудность, без догматического исправления текста.
