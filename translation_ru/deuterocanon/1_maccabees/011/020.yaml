translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Эллиптическая греческая конструкция раскрыта минимально словом «людей»; историко-техническое название «Акра» вынесено в сноску, чтобы основной текст оставался понятным широкому читателю.
