base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/020.yaml
  text: In those days Jonathan gathered those from Judea to make war against the citadel in Jerusalem[a], and they built many siege engines against it.
translation:
  language: ru
  text: В те дни Ионафан собрал людей из Иудеи, чтобы вести войну против цитадели в Иерусалиме[a], и они соорудили против неё множество осадных машин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против Акры» — укреплённой цитадели в Иерусалиме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: собрал
  rationale: Аорист συνάγω обозначает сбор людей для военной цели; «собрал» естественно передаёт смысл, не добавляя идеи официального собрания.
- source_word: τοὺς ἐκ τῆς Ἰουδαίας
  choice: людей из Иудеи
  rationale: Греческое выражение эллиптично. Слово «людей» необходимо для естественного русского синтаксиса и не сужает обозначение до прямо не названных в тексте мужчин или воинов.
- source_word: τοῦ ἐκπολεμῆσαι
  choice: чтобы начать войну против
  rationale: Артиклевый инфинитив выражает цель, а ἐκπολεμέω — направленное военное выступление против крепости; перевод сохраняет более сильный смысл, чем просто «сражаться».
- source_word: τὴν ἄκραν
  choice: крепости
  rationale: Ἄκρα означает укреплённую цитадель и здесь относится к селевкидской Акре в Иерусалиме. В основном тексте выбрано понятное «крепость», а историческое название сохранено в сноске.
- source_word: μηχανὰς πολλάς
  choice: множество осадных машин
  rationale: В контексте нападения на укрепление μηχαναί — военные осадные устройства, а не машины в современном общем смысле.
- source_word: ἐποίησαν ἐπʼ αὐτὴν
  choice: соорудили против неё
  rationale: Ποιέω при осадных устройствах естественно передаётся как «соорудили»; ἐπʼ αὐτήν сохраняется как указание на то, что устройства предназначались для действий против крепости.
