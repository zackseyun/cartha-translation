lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: После этого
  rationale: Естественный современный повествовательный переход, сохраняющий временное значение греческого оборота.
- source_word: ἀπέστρεψεν
  choice: вернулся
  rationale: Передаёт обычное значение «повернул назад, возвратился» и естественно звучит в данном повествовании.
- source_word: παιδάριον νεώτερον
  choice: совсем юный мальчик
  rationale: παιδάριον обозначает мальчика или ребёнка, а νεώτερον подчёркивает его малый возраст; точная степень сравнительного значения остаётся отмеченной в сноске.
- source_word: ἐβασίλευσεν
  choice: воцарился
  rationale: В последовательности событий аорист естественно указывает на вступление Антиоха на царство, а не просто на продолжительное царствование.
- source_word: ἐπέθετο διάδημα
  choice: возложил на себя царский венец
  rationale: Возвратный оборот передаёт средний залог ἐπέθετο, а «царский венец» ясно выражает функцию διάδημα в доступной современной речи.
theological_decisions:
- issue: Значение ἐβασίλευσεν в контексте
  choice: воцарился
  alternative: стал царствовать; царствовал
  rationale: Сочетание с последующим возложением царского знака указывает на вступление на престол, хотя сам глагол может также обозначать царствование вообще.
- issue: Передача διάδημα
  choice: царский венец
  alternative: диадема
  rationale: «Царский венец» понятно обозначает знак царской власти; более точный исторический термин «диадема» сохранён в сноске без привнесения богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Краткое «воцарился» передаёт вступление на престол; конструкция с тире естественно связывает Антиоха с возвращением Трифона. Все лексические пояснения вынесены в сноски без перегрузки основного текста.
