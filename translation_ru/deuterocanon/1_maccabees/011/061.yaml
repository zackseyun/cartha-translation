base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/061.yaml
  text: And he went from there to Gaza[a], and the men of Gaza shut him out; and he encamped around it, and burned its outlying parts with fire[b], and plundered them.
translation:
  language: ru
  text: И отправился он оттуда в Газу, а жители Газы не впустили его. Тогда он расположился станом вокруг неё[a], предал огню её окрестности[b] и разграбил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осадил её». Греческое выражение буквально описывает расположение вокруг города.'
    reason: lexical_alternative
  - marker: b
    text: Греческое выражение не вполне ясно; возможно, имеются в виду прилегающие к Газе земли или её предместья.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: отправился
  rationale: Естественно передаёт повествовательный аорист глагола движения и сохраняет оттенок ухода из прежнего места.
- source_word: ἀπέκλεισαν
  choice: не впустили его
  rationale: Глагол означает перекрыть доступ или оставить снаружи; русский оборот ясно передаёт враждебный отказ впустить, не добавляя отсутствующего в греческом упоминания ворот.
- source_word: οἱ ἀπὸ Γάζης
  choice: жители Газы
  rationale: Буквально — «те, кто из Газы». В данном контексте речь идёт о жителях или защитниках города; нейтральное «жители Газы» не сужает значение до одних мужчин.
- source_word: περιεκάθισεν περὶ αὐτήν
  choice: расположился станом вокруг неё
  rationale: Сохраняет конкретный образ размещения вокруг города и одновременно позволяет читателю понять осадный контекст, не заменяя выражение однозначным «осадил».
- source_word: τὰ περίπολα αὐτῆς
  choice: её окрестности
  rationale: Выражение не вполне ясно; в осадном контексте, вероятнее всего, обозначает прилегающие к Газе места или предместья. «Окрестности» сохраняет необходимую широту значения.
- source_word: ἐνεπύρισεν ... ἐν πυρί
  choice: предал огню
  rationale: Передаёт усиленное греческое выражение «сжёг огнём» естественным и достойным русским оборотом.
- source_word: ἐσκύλευσεν
  choice: разграбил
  rationale: Точный и современный русский военный термин для захвата добычи и разорения.
