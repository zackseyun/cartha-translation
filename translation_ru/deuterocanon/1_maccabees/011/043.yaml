    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Итак
  rationale: Сочетание обозначает переход к выводу и просьбе; «итак» естественно передаёт логическую связь в современном русском языке.
- source_word: ὀρθῶς ποιήσεις
  choice: ты хорошо поступишь
  rationale: Устойчивый оборот одобряет предлагаемое действие, а не просто выносит отвлечённую нравственную оценку.
- source_word: ἀποστείλας ἡμῖν
  choice: если пошлёшь нам
  rationale: Аористное причастие раскрывает действие, совершив которое адресат поступит хорошо; условная конструкция звучит естественно и сохраняет смысл.
- source_word: ἄνδρας
  choice: людей
  rationale: Греческое слово означает мужчин или людей, не являясь специальным обозначением воинов; военная роль уточняется следующим оборотом.
- source_word: οἳ συμμαχήσουσίν μοι
  choice: которые будут сражаться на моей стороне
  rationale: Глагол обозначает военную помощь в качестве союзников; перевод сохраняет военный характер и личную направленность μοι.
- source_word: ἀπέστησαν
  choice: покинуло меня
  rationale: В данном военном контексте глагол указывает, что силы отошли от говорящего или оставили его; формулировка не уточняет без необходимости, было ли это дезертирством или мятежом.
- source_word: πᾶσαι αἱ δυνάμεις μου
  choice: всё моё войско
  rationale: Хотя греческое выражение формально стоит во множественном числе и может означать «все мои силы», собирательное «всё моё войско» естественно передаёт военное значение и согласуется с глаголом в русском языке.
