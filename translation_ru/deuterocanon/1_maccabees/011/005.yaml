translation:
  language: ru
  text: И они рассказали царю о том, что сделал Ионафан, чтобы обвинить его[a], а царь промолчал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы опорочить его»; или: «чтобы осудить его». Греческий глагол может обозначать как обвинение, так и порицание или поношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: рассказали
  rationale: Глагол означает подробно изложить или поведать. «Рассказали царю» естественно звучит по-русски и не привносит излишне официальный оттенок.
- source_word: ἃ ἐποίησεν Ἰωνάθαν
  choice: о том, что сделал Ионафан
  rationale: Относительная конструкция обозначает совершённые Ионафаном действия; предложное оформление естественно связано с русским глаголом «рассказали».
- source_word: εἰς τὸ ψογίσαι
  choice: чтобы обвинить
  rationale: Оборот выражает цель, а ψογίζω может означать порицать, осуждать или выставлять виновным. В сцене обращения к царю «обвинить» уместно передаёт враждебное донесение, не исключая более общего смысла порицания.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение естественно относится к ближайшему названному лицу — Ионафану; сохранение местоимения соответствует греческому тексту и нормально для русского повествования.
- source_word: ἐσίγησεν
  choice: промолчал
  rationale: Русский глагол совершенного вида точно передаёт аорист и обозначает отсутствие ответа или реакции со стороны царя.
- source_word: ὁ βασιλεύς
  choice: царь
  rationale: Обычный русский эквивалент титула в историческом повествовании.
