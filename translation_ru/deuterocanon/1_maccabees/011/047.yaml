  yaml_path: translation/deuterocanon/1_maccabees/011/047.yaml
  text: And the king called the Jews to his aid[a], and they all gathered to him together; and they spread out in the city, and on that day they killed ten thousand in the city.
translation:
  language: ru
  text: Царь призвал иудеев на помощь, и все они разом собрались к нему. Они рассредоточились по городу[a] и в тот день убили в городе сто тысяч человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «были рассеяны в городе»; перевод «рассредоточились по городу» передаёт вероятный военный смысл выражения в данном контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν … εἰς βοήθειαν
  choice: призвал … на помощь
  rationale: Передаёт призыв и его цель естественным современным русским оборотом.
- source_word: ἐπισυνήχθησαν πρὸς αὐτὸν πάντες ἅμα
  choice: все они разом собрались к нему
  rationale: Сохраняет направленность к царю, полноту πάντες и одновременность ἅμα без тяжеловесного повтора.
- source_word: διεσπάρησαν ἐν τῇ πόλει
  choice: рассредоточились по городу
  rationale: Глагол буквально обозначает рассеивание; в военном контексте «рассредоточились» ясно передаёт организованное распространение по территории города.
- source_word: ἀπέκτειναν
  choice: убили
  rationale: Прямой современный эквивалент без архаизации.
- source_word: εἰς μυριάδας δέκα
  choice: сто тысяч человек
  rationale: Одна μυριάς равна десяти тысячам; δέκα μυριάδες — десять мириад, то есть сто тысяч. Это следует греческому источнику, тогда как консультационный английский слой ошибочно даёт ten thousand.
