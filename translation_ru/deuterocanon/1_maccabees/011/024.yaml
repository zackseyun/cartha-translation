  yaml_path: translation/deuterocanon/1_maccabees/011/024.yaml
  text: And he took silver and gold and clothing and many other gifts[a], and went to the king at Ptolemais, and found favor before him.
translation:
  language: ru
  text: Взяв серебро, золото, одежду и множество других даров, он отправился к царю в Птолемаиду и снискал его благосклонность.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: взяв
  rationale: Аористное причастие обозначает действие, предшествующее отправлению; русское деепричастие естественно сохраняет синтаксическую связь с основным глаголом.
- source_word: ἀργύριον
  choice: серебро
  rationale: В сочетании с золотом и прочими дарами прямое обозначение материала предпочтительнее метонимического «деньги».
- source_word: χρυσίον
  choice: золото
  rationale: Прямое и естественное соответствие термину в перечне даров.
- source_word: ἱματισμόν
  choice: одежду
  rationale: Современное общеупотребительное обозначение одежды как ценного дипломатического дара.
- source_word: ἕτερα ξένια πλείονα
  choice: множество других даров
  rationale: ξένια здесь означает дары, связанные с гостеприимством или дипломатическим обменом; πλείονα указывает на их значительное количество, а ἕτερα — на дополнение к уже перечисленному.
- source_word: ἐπορεύθη πρὸς τὸν βασιλέα εἰς Πτολεμαΐδα
  choice: отправился к царю в Птолемаиду
  rationale: Передаёт и движение к царю, и географическое место назначения естественным русским оборотом.
- source_word: εὗρεν χάριν ἐναντίον αὐτοῦ
  choice: снискал его благосклонность
  rationale: Естественная современная передача библейской идиомы «нашёл милость перед ним»; местоимение ясно относится к царю, а смысл одобрения не расширяется.
