  text: And Jonathan met the king at Joppa with honor, and they greeted one another, and they spent the night there.
translation:
  language: ru
  text: Ионафан с почестями встретил царя в Иоппии; они приветствовали друг друга и переночевали там.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήντησεν
  choice: встретил
  rationale: Аорист глагола обозначает состоявшуюся встречу Ионафана с царём; русский глагол не привносит лишних подробностей о характере встречи.
- source_word: εἰς Ἰόππην
  choice: в Иоппии
  rationale: При глаголе встречи сочетание εἰς с названием места естественно передаёт место события; по-русски здесь идиоматично «в Иоппии».
- source_word: μετὰ δόξης
  choice: с почестями
  rationale: В дипломатическом контексте δόξα указывает на почёт и торжественность встречи, а не на отвлечённую славу. Множественное число естественно для современного русского выражения.
- source_word: ἠσπάσαντο ἀλλήλους
  choice: они приветствовали друг друга
  rationale: ἀσπάζομαι означает приветствовать или радушно встречать; перевод сохраняет взаимность и не конкретизирует жест как объятие.
- source_word: ἐκοιμήθησαν
  choice: переночевали
  rationale: Хотя буквальное значение связано со сном, в повествовании о передвижениях глагол означает пребывание на ночлег; «переночевали» кратко и естественно передаёт этот смысл.
