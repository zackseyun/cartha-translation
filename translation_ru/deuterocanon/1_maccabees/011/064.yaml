lexical_decisions:
- source_word: συνήντησεν
  choice: пошёл им навстречу
  rationale: Передаёт не только встречу, но и направленность движения, выраженную глаголом συνήντησεν.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж множественного числа однозначно указывает на нескольких лиц.
- source_word: κατέλιπεν
  choice: оставил
  rationale: Естественно передаёт значение «оставил (позади, в определённом месте)» без добавления отсутствующей в тексте идеи назначения или размещения.
- source_word: ἐν τῇ χώρᾳ
  choice: в той области
  rationale: χώρα здесь обозначает территорию или местность; «область» естественно звучит в военно-географическом контексте и не сужает смысл до сельской местности.
- source_word: ἀδελφὸν αὐτοῦ Σίμωνα
  choice: своего брата Симона
  rationale: Возвратное притяжательное местоимение ясно соотносит брата с подлежащим, сохраняя родство и имя.
