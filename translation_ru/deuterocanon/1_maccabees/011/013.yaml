base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/013.yaml
  text: And Ptolemy entered Antioch and put on the crown of Asia[a], and he put two crowns on his head, that of Asia and Egypt.
translation:
  language: ru
  text: И вошёл Птолемей в Антиохию, и возложил на себя венец Азии[a], и возложил на голову два венца — Азии и Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «диадему». В греческом тексте дважды употреблено одно и то же обозначение царского знака: сначала «венец Азии», затем «два венца» — Азии и Египта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Прямо передаёт повествовательный аорист движения внутрь города и естественно звучит по-русски.
- source_word: περιέθετο
  choice: возложил на себя / возложил на голову
  rationale: Средний залог указывает на действие, совершённое над собой. Конкретный образ сохраняется без более толковательного «принял власть».
- source_word: διάδημα
  choice: венец
  rationale: Обозначает царский головной знак. «Венец» понятно современному читателю, сохраняет возвышенный исторический регистр и позволяет последовательно передать повтор одного греческого слова.
- source_word: τῆς Ἀσίας
  choice: Азии
  rationale: Греческий текст говорит буквально «Азии»; перевод не сужает значение до Малой Азии и не добавляет пояснение о державе Селевкидов.
- source_word: δύο διαδήματα
  choice: два венца
  rationale: Сохраняются числительное и повтор существительного, подчёркивающие одновременное ношение двух царских знаков.
- source_word: περὶ τὴν κεφαλὴν αὐτοῦ
  choice: на голову
  rationale: Естественный русский способ описать возложение царского головного убора; буквальное «вокруг головы» здесь звучало бы неестественно.
theological_decisions:
- issue: Царская символика двух венцов
  choice: Передать конкретное действие — возложение двух венцов.
  alternative: Истолковать как притязание на власть над Азией и Египтом.
  rationale: Политический смысл подразумевается символическим действием, однако греческий текст описывает именно действие. Перевод не подменяет образ его толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным историко-библейским звучанием. Синтаксический повтор сохранён как элемент повествовательного стиля и для соответствия повтору греческого περιέθετο и διάδημα.
