  text: And as he entered into the cities of Ptolemais[a], he stationed forces as a garrison in each city.
translation:
  language: ru
  text: Когда же он входил в города Птолемаиды[a], то оставлял в каждом городе войска в качестве гарнизона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «в города Птолемаида». Связь названия с выражением «города» синтаксически сжата и допускает разные толкования; здесь она понимается как указание на города, принадлежавшие Птолемею или находившиеся под его властью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Когда же
  rationale: Передаёт временной переход и связующую частицу δέ естественным для русского повествования способом.
- source_word: εἰσεπορεύετο
  choice: входил
  rationale: Имперфект указывает на продолжающееся или повторявшееся действие по мере продвижения через ряд городов; несовершенный вид это сохраняет.
- source_word: εἰς τὰς πόλεις Πτολεμαΐς
  choice: в города Птолемаиды[a]
  rationale: 'Направительное εἰς передано предлогом «в». Сжатая и грамматически необычная связь Πτολεμαΐς с множественным πόλεις не разглажена без пояснения: основной текст следует наиболее вероятному смыслу, а подстрочник и неоднозначность отмечены в сноске.'
- source_word: ἀπετάσσε
  choice: размещал
  rationale: В военном контексте глагол означает расстановку или назначение войск; несовершенный вид согласуется с повторным действием в каждом городе.
- source_word: τὰς δυνάμεις
  choice: войска
  rationale: Естественное русское обозначение организованных вооружённых сил без подразумевания нескольких самостоятельных армий.
- source_word: φρουράν
  choice: как гарнизон
  rationale: 'Передаёт предикативную функцию: войска размещались для несения гарнизонной службы.'
- source_word: ἐν ἑκάστῃ πόλει
  choice: в каждом городе
  rationale: Сохраняет распределительное значение ἑκάστῃ и повторяемость действия по отдельным городам.
