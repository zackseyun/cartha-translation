translation:
  language: ru
  text: И он назначил своего брата Симона военачальником от Тирской лестницы до границ Египта[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полководцем». Греческое слово στρατηγός обозначает военного начальника и в зависимости от контекста может передаваться более конкретно.'
    reason: lexical_alternative
  - marker: b
    text: «Тирская лестница» — географическое название; вероятно, речь идёт о прибрежном проходе или крутом склоне близ Тира, а не о буквальной лестнице.
    reason: cultural_note
lexical_decisions:
- source_word: κατέστησεν
  choice: назначил
  rationale: Глагол обозначает поставление человека на должность; «назначил» естественно передаёт официальный характер действия.
- source_word: στρατηγὸν
  choice: военачальником
  rationale: Слово обозначает военного руководителя; этот вариант не приписывает должности более узкого позднейшего ранга.
- source_word: ἀπὸ τῆς κλίμακος Τύρου
  choice: от Тирской лестницы
  rationale: κλίμαξ здесь служит географическим названием; форма «Тирская лестница» сохраняет топоним и звучит по-русски естественно.
- source_word: ἕως τῶν ὁρίων Αἰγύπτου
  choice: до границ Египта
  rationale: Передаёт конечный предел территории, выраженный сочетанием ἕως с ὅρια.
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: брата своего Симона
  rationale: Сохраняет прямое указание на родство и естественный для русского языка порядок слов.
- source_word: ἀπὸ … ἕως …
  choice: над областью от … до …
  rationale: Добавление «над областью» ясно показывает, что географические пределы относятся к сфере командования; это подразумевается конструкцией при назначении военачальника.
