  yaml_path: translation/deuterocanon/1_maccabees/011/025.yaml
  text: And some lawless men from the nation were making accusations against him[a].
translation:
  language: ru
  text: И некоторые беззаконники из народа выдвигали против него обвинения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подавали против него жалобы», то есть обращались с жалобой к власти. Греческий глагол может означать обращение или прошение; в сочетании «против него» речь идёт о враждебном обвинении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετύγχανον
  choice: выдвигали обвинения
  rationale: В сочетании с κατʼ αὐτοῦ глагол обозначает враждебное обращение к власти с жалобой или обвинением. Несовершенный вид «выдвигали» передаёт имперфект греческого текста.
- source_word: κατʼ αὐτοῦ
  choice: против него
  rationale: Κατά с родительным падежом здесь выражает направленность действия против человека.
- source_word: τινες
  choice: некоторые
  rationale: Передаёт неопределённую часть упомянутой группы без лишнего уточнения.
- source_word: ἄνομοι
  choice: беззаконники
  rationale: Субстантивированное прилагательное характеризует этих людей как пренебрегающих законом; слово сохраняет одновременно правовую и нравственную оценку.
- source_word: τῶν ἐκ τοῦ ἔθνους
  choice: из народа
  rationale: Ἔθνος здесь означает этнически и политически понимаемый народ, к которому принадлежали эти люди, а не язычников.
theological_decisions:
- issue: Передача ἄνομοι
  choice: беззаконники
  alternative: нечестивцы; беззаконные люди
  rationale: «Беззаконники» сохраняет правовой и нравственный смысл слова, не превращая его в специальное богословское обозначение.
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным синтаксисом. «Беззаконники» сохраняет достоинство библейского регистра, а «выдвигали обвинения» естественно передаёт официальный и враждебный характер действия.
