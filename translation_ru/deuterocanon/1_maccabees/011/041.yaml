  to: Ионафан обратился к царю Димитрию с просьбой изгнать из Иерусалима людей из Акры[a], а также тех, кто находился в укреплениях, ибо они воевали против Израиля.
  rationale: Исправлена синтаксическая неполнота исходной русской фразы без добавления в текст невыраженных в греческом «послов» или «письма». Исторически вероятное имя «Акра» вынесено в основной текст, а нарицательное значение ἄκρα и историческая идентификация ясно отмечены в сноске. Сохранены оба объекта изгнания, пространственное «из Иерусалима» и продолжающийся характер враждебных действий.
