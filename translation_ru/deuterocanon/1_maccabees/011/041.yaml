  yaml_path: translation/deuterocanon/1_maccabees/011/041.yaml
  text: And Jonathan sent to Demetrius the king[a], asking that he drive out those in the citadel from Jerusalem, and those in the strongholds; for they were making war against Israel.
translation:
  language: ru
  text: Ионафан обратился к царю Димитрию с просьбой изгнать из Иерусалима людей из Акры[a], а также тех, кто находился в укреплениях, ибо они воевали против Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из крепости». Вероятно, имеется в виду Акра — селевкидская цитадель в Иерусалиме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный глагол передачи послания или поручения; естественно соответствует контексту.
- source_word: πρὸς Δημήτριον τὸν βασιλέα
  choice: к царю Димитрию
  rationale: Естественный русский порядок слов сохраняет имя и царский титул.
- source_word: ἵνα ἐκβάλῃ
  choice: с просьбой изгнать
  rationale: После глагола «послал» союз ἵνα передаёт цель посольства или содержание просьбы, а ἐκβάλῃ указывает на принудительное удаление.
- source_word: τοὺς ἐκ τῆς ἄκρας
  choice: тех, кто находился в крепости
  rationale: ἄκρα обозначает крепость или цитадель и здесь, вероятно, конкретную селевкидскую Акру; нейтральное «крепость» понятно современному читателю, а историческая конкретизация дана в сноске.
- source_word: ἐξ Ἱερουσαλήμ
  choice: из Иерусалима
  rationale: Передаёт пространственное значение ἐξ и направленность изгнания за пределы города.
- source_word: τοὺς ἐν τοῖς ὀχυρώμασιν
  choice: тех, кто был в укреплениях
  rationale: ὀχύρωμα — укреплённое место; множественное «укрепления» сохраняет широту греческого выражения.
- source_word: ἦσαν γὰρ πολεμοῦντες
  choice: потому что они воевали
  rationale: Перифрастическая конструкция описывает продолжавшиеся военные действия; «воевали» естественно выражает организованную вражду.
- source_word: τὸν Ἰσραήλ
  choice: против Израиля
  rationale: При πολεμέω винительный падеж обозначает противника; предлог «против» ясно передаёт это отношение.
