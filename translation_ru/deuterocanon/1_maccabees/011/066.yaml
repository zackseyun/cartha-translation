  text: And they asked him to receive pledges from them[a], and he gave them; then he drove them out from there and took the city, and stationed a garrison in it.
translation:
  language: ru
  text: И они попросили его принять от них заверения[a], и он дал им заверения. Затем он изгнал их оттуда, овладел городом и разместил в нём гарнизон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «принять правые руки». Речь идёт об обмене заверениями мира или верности, который, вероятно, скреплялся рукопожатием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίωσαν
  choice: попросили
  rationale: В сочетании с инфинитивом глагол передаёт просьбу; «потребовали» было бы неоправданно категорично.
- source_word: δεξιὰς λαβεῖν
  choice: принять от них заверения
  rationale: Буквально речь идёт о «правых руках», но это устойчивый жест взаимных заверений или соглашения. Смысл передан в основном тексте, а буквальный образ сохранён в сноске.
- source_word: ἔδωκεν αὐτοῖς
  choice: он дал им заверения
  rationale: 'Греческий текст эллиптичен: подразумеваются те же взаимные заверения. Повтор существительного устраняет неясность русского местоименного выражения.'
- source_word: ἐξέβαλεν
  choice: изгнал
  rationale: Передаёт решительное удаление людей из данного места без стилистически устаревшего «изверг».
- source_word: κατελάβετο
  choice: овладел
  rationale: Средняя форма означает завладеть городом, взять его под свой контроль; «овладел» кратко и естественно передаёт этот смысл.
- source_word: φρουράν
  choice: гарнизон
  rationale: В военном контексте слово обозначает размещённую для охраны и контроля военную силу.
- source_word: ἔθετο ἐπʼ αὐτὴν
  choice: разместил в нём
  rationale: По-русски гарнизон естественно размещают в городе; оборот передаёт установление военного контроля без буквального и неестественного «над ним».
