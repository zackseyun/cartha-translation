  yaml_path: translation/deuterocanon/1_maccabees/011/046.yaml
  text: And the king fled into the court[b][a], and the men of the city seized the passages of the city and began to fight.
translation:
  language: ru
  text: И царь убежал во двор[a], и жители города захватили городские проходы[b] и начали сражаться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во внутренний двор»; вероятно, имеется в виду двор царского дворца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подступы к городу» либо «входы в город»; греческое слово может обозначать проходы и пути доступа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: бежал
  rationale: Аорист φεύγω обозначает бегство от опасности; «бежал» кратко и естественно передаёт срочное отступление.
- source_word: αὐλήν
  choice: двор
  rationale: Слово αὐλή может означать двор или внутренний двор, в данном контексте, вероятно, при царском дворце; добавление «дворцовый» в основной текст было бы конкретнее греческого.
- source_word: κατελάβοντο
  choice: захватили
  rationale: Средняя форма здесь выражает овладение или установление контроля; «захватили» соответствует военной обстановке.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: жители города
  rationale: Буквально — «те, кто из города». «Жители города» звучит по-русски естественно и не ограничивает группу только мужчинами, чего греческий текст прямо не утверждает.
- source_word: τὰς διόδους τῆς πόλεως
  choice: городские проходы
  rationale: δίοδος обозначает проход, путь сообщения или доступ; это выражение сохраняет пространственную неопределённость исходного текста.
- source_word: ἤρξαντο ἐκπολεμεῖν
  choice: начали сражаться
  rationale: Конструкция обозначает начало вооружённой борьбы; выбранная формулировка ясна и естественна в современном русском языке.
