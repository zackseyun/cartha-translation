  yaml_path: translation/deuterocanon/1_maccabees/011/053.yaml
  text: And he proved false in everything that he said[a], and became estranged from Jonathan, and did not repay the favors that Jonathan had shown him, and he oppressed him severely.
translation:
  language: ru
  text: Во всём, что он говорил, он солгал[a], отдалился от Ионафана, не отплатил за благодеяния, которые Ионафан оказал ему, и тяжко притеснял его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступал вероломно во всём, что говорил»; греческий глагол может указывать как на ложь в словах, так и шире — на обманчивое, вероломное поведение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐψεύσατο πάντα ὅσα εἶπεν
  choice: оказался неверен во всём, что говорил
  rationale: Передаёт как ложность сказанного, так и возможный более широкий оттенок вероломства, не сводя глагол исключительно к прямой лжи.
- source_word: ἠλλοτριώθη τῷ Ἰωνάθαν
  choice: отдалился от Ионафана
  rationale: Естественно по-русски выражает наступившее отчуждение и не усиливает значение до открытой вражды.
- source_word: οὐκ ἀνταπέδωκεν τὰς εὐνοίας
  choice: не воздал ему за благодеяния
  rationale: Сохраняет смысл ответного воздаяния и понимает εὐνοίαι как конкретные благодеяния или услуги в политическом контексте.
- source_word: ἃς ἀνταπέδωκεν αὐτῷ
  choice: которые тот ему оказал
  rationale: Местоимение «тот» естественно указывает на Ионафана; «оказал» передаёт совершённые им благодеяния без неестественного для русского повторения глагола «воздать».
- source_word: ἔθλιψεν αὐτὸν σφόδρα
  choice: жестоко притеснял его
  rationale: Передаёт сильное давление и суровое обращение в политическом контексте; «жестоко» естественно выражает интенсивность σφόδρα.
