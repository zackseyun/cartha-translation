  text: And those in the city saw that the Jews had gained control of the city as they wished, and they lost heart, and they cried out to the king with a plea, saying,
translation:
  language: ru
  text: 'И жители города увидели, что иудеи овладели городом, как хотели, и пали духом, и с мольбой воззвали к царю:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ὑπὸ τῆς πόλεως
  choice: жители города
  rationale: Оборот обозначает находившихся в городе людей, а не буквальное положение «под городом». «Жители города» естественно и ясно передаёт подразумеваемую группу.
- source_word: κατεκράτησαν … τῆς πόλεως
  choice: овладели городом
  rationale: Глагол с родительным падежом выражает установление власти или контроля над городом. «Овладели городом» передаёт достигнутый результат, не добавляя отсутствующих в тексте подробностей.
- source_word: ὡς ἠβούλοντο
  choice: как и хотели
  rationale: Оборот указывает, что достигнутый иудеями контроль соответствовал их намерению; частица «и» естественно подчёркивает это соответствие.
- source_word: ἠσθένησαν ταῖς διανοίαις αὐτῶν
  choice: пали духом
  rationale: Буквально речь идёт об ослаблении в мыслях или внутреннем настрое. Русская идиома «пали духом» точно передаёт утрату мужества и решимости.
- source_word: ἐκέκραξαν πρὸς τὸν βασιλέα
  choice: воззвали к царю
  rationale: Глагол обозначает громкий, настойчивый крик или обращение. «Воззвали» сохраняет силу выражения и уместно для достойного повествовательного регистра.
- source_word: μετὰ δεήσεως
  choice: с мольбой
  rationale: δέησις означает настойчивую просьбу, прошение или мольбу. Выбранный вариант краток, понятен и передаёт отчаянный характер обращения.
- source_word: λέγοντες
  choice: двоеточие
  rationale: Причастие вводит прямую речь следующего стиха. В современном русском двоеточие естественно выполняет эту функцию без тяжеловесного «говоря».
