  source_fidelity: 'В целом перевод точно передаёт участников, установление иудеями контроля над городом, утрату мужества и настойчивое обращение к царю. Однако «тогда» вводит явно выраженную временно-следственную связь, которой в греческом тексте нет: там простое последовательное соединение καί. Частица «и» в «как и хотели» также не обязательна и слегка усиливает сопоставление.'
