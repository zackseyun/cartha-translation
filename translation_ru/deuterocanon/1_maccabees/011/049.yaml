  terminology: «Иудеи» корректно передаёт οἱ Ἰουδαῖοι в данном историческом контексте. «Овладели городом» точно передаёт κατεκράτησαν τῆς πόλεως; «с мольбой» соответствует μετὰ δεήσεως.
