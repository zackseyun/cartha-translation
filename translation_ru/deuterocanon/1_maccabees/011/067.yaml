  text: And Jonathan and his camp encamped by the water of Gennesar, and they rose early in the morning for the plain of Nasor.
translation:
  language: ru
  text: И Ионафан и его войско расположились лагерем у вод Геннисара, а на рассвете поднялись и направились на равнину Насор.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на рассвете поднялись к/на равнину Насор»; греческий предлог обозначает направление, хотя отдельного глагола движения в тексте нет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴ
  choice: войско
  rationale: В военном повествовании слово может обозначать как стан, так и находящееся в нём войско. В сочетании «Ионафан со своим войском» русский текст естественно передаёт собирательный смысл, не повторяя «стан» как подлежащее.
- source_word: παρενέβαλον
  choice: расположился станом
  rationale: Прямо передаёт значение устройства лагеря; единственное число согласовано с конструкцией «Ионафан со своим войском» как с единой группой.
- source_word: ἐπὶ τὸ ὕδωρ τοῦ Γεννησάρ
  choice: у вод Геннисарских
  rationale: При глаголе расположения ἐπί с винительным здесь естественно передаётся как нахождение у воды. Прилагательное сохраняет форму топонима Γεννησάρ и ясно связывает название с водоёмом.
- source_word: ὤρθρισαν τὸ πρωὶ
  choice: на рассвете они поднялись
  rationale: Сочетание выражает ранний подъём утром. «На рассвете» естественно передаёт усиленный временной смысл без тяжеловесного повтора «рано утром».
- source_word: εἰς τὸ πεδίον Νασώρ
  choice: направились на равнину Насор
  rationale: εἰς обозначает движение к месту назначения. Глагол движения подразумевается конструкцией и добавлен по-русски ради ясности; «Насор» передаёт греческую форму Νασώρ.
