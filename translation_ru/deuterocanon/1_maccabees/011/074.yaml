lexical_decisions:
- source_word: ἔπεσον
  choice: пало
  rationale: Сохраняет буквальный образ и обычное для повествования о сражении обозначение погибших, не уточняя способ смерти.
- source_word: ἐκ τῶν ἀλλοφύλων
  choice: из иноплеменников
  rationale: Передаёт значение людей, принадлежащих к иному народу, и не сужает его до филистимлян, что здесь контекстом не требуется.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: в тот день
  rationale: Естественное русское соответствие греческому обстоятельству времени.
- source_word: εἰς ἄνδρας τρισχιλίους
  choice: около трёх тысяч человек
  rationale: Конструкция с εἰς может обозначать достигнутое количество или приблизительный итог; «около» естественно передаёт возможную приблизительность, а примечание сохраняет альтернативу.
- source_word: ἐπέστρεψεν
  choice: возвратился
  rationale: В данном контексте обозначает возвращение к названному месту.
- source_word: Ἰωναθάν
  choice: Ионафан
  rationale: Традиционная русская библейская форма имени.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Устоявшаяся русская форма географического названия.
