    issue: «на островах языческих народов»
    rationale: τῶν ἐθνῶν означает «народов/наций»; в данном контексте оно не требует перевода «языческие». Такой вариант необоснованно теологизирует нейтральное этнополитическое обозначение.
  - severity: medium
    issue: «войска, служившие ещё его предкам»
    rationale: В греческом нет явного указания, что войска служили предкам царя или что они продолжали службу «ещё» с того времени. Формулировка должна не добавлять этих деталей.
