base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/038.yaml
  text: And King Demetrius saw that the land was quiet before him and that nothing opposed him[a], so he dismissed all his forces, each to his own place, except for the foreign forces that he had recruited from the islands of the nations[b]; and all the forces from his fathers became hostile to him.
translation:
  language: ru
  text: И увидел царь Димитрий, что страна спокойна перед ним и никто ему не противится. Тогда он распустил все свои войска, отправив их по своим местам, кроме иноземных войск[a], которые он набрал с островов других народов. И все войска, связанные с его предками[b], стали враждебны ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наёмных войск». Греческое выражение прямо указывает на иноземные войска и в данном контексте может подразумевать наёмников.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «войска от отцов». Вероятно, имеются в виду традиционные войска, связанные с предшественниками Димитрия из той же династии, в отличие от оставленных им иноземных частей.'
    reason: cultural_note
lexical_decisions:
- source_word: ἡσύχασεν ἡ γῆ
  choice: страна спокойна
  rationale: В историческом контексте γῆ обозначает подвластную территорию, а ἡσυχάζω — отсутствие волнений и сопротивления; выражение не преувеличивает это состояние до полного мира.
- source_word: ἐνώπιον αὐτοῦ
  choice: перед ним
  rationale: Сохранён образ греческого выражения, которое здесь описывает спокойствие страны по отношению к власти царя.
- source_word: οὐθὲν αὐτῷ ἀνθεστήκει
  choice: никто ему не противится
  rationale: Хотя οὐθέν буквально значит «ничто», в военном и политическом контексте естественное русское «никто» передаёт отсутствие противников; настоящее время отражает продолжавшееся состояние.
- source_word: ἀπέλυσεν πάσας τὰς δυνάμεις αὐτοῦ
  choice: распустил все свои войска
  rationale: В военном контексте ἀπολύω означает отпустить со службы или разослать; «распустил» естественно сочетается с войсками, не утверждая их окончательного упразднения.
- source_word: ἕκαστον εἰς τὸν ἴδιον τόπον
  choice: отправив каждого к себе
  rationale: 'Передан распределительный смысл: каждый воин или отряд возвращается в своё место; буквальное «в своё место» по-русски звучит неестественно.'
- source_word: ξένων δυνάμεων
  choice: иноземных войск
  rationale: ξένος указывает прежде всего на чужеземное происхождение войск; возможный смысл наёмничества не внесён в основной текст.
- source_word: ἐξενολόγησεν
  choice: набрал
  rationale: Глагол обозначает набор иноземцев на военную службу; «набрал» кратко и естественно передаёт этот смысл без обязательного указания на наём.
- source_word: ἀπὸ τῶν νήσων τῶν ἐθνῶν
  choice: на островах языческих народов
  rationale: Сохранены оба элемента греческой фразы — острова и народы. «Языческие народы» ясно выражает обычное для данного корпуса противопоставление неиудейских народов, не сводя выражение просто к «чужеземным островам».
- source_word: ἠχθρασαν αὐτῷ
  choice: стали враждебны ему
  rationale: Передан переход к враждебному отношению, выраженный глаголом, а не только устойчивое состояние.
- source_word: πᾶσαι αἱ δυνάμεις αἱ ἀπὸ τῶν πατέρων
  choice: все войска, служившие ещё его предкам
  rationale: Сжатая греческая конструкция противопоставляет старые династические войска сохранённым иноземным частям. Формулировка делает вероятный исторический смысл понятным, а примечание отмечает буквальную неоднозначность.
