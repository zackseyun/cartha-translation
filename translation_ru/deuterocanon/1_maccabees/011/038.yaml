revisions:
- from: И увидел царь Димитрий, что страна спокойна перед ним и никто ему не противится. Тогда он распустил все свои войска, отправив каждого к себе, кроме иноземных войск[a], которых он набрал на островах языческих народов. И все войска, служившие ещё его предкам[b], стали враждебны ему.
  to: И увидел царь Димитрий, что страна спокойна перед ним и никто ему не противится. Тогда он распустил все свои войска, отправив их по своим местам, кроме иноземных войск[a], которые он набрал с островов других народов. И все войска, связанные с его предками[b], стали враждебны ему.
  rationale: Заменено «языческих народов» на нейтральное «других народов», поскольку исходное ἐθνῶν не называет эти народы языческими. Заключительное определение переформулировано как «связанные с его предками», чтобы сохранить сжатость и неоднозначность αἱ ἀπὸ τῶν πατέρων без добавления утверждения о службе при предках. «По своим местам» точнее и естественнее передаёт ἕκαστον εἰς τὸν ἴδιον τόπον.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:57:00Z'
