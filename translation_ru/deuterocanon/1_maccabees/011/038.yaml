  source_fidelity: Требуются две безопасные правки. «Языческих народов» добавляет к τῶν ἐθνῶν религиозную характеристику, которой греческий текст здесь не выражает; следует передать нейтрально. Формулировка «служившие ещё его предкам» также вносит неявное утверждение о сроке и характере службы, тогда как αἱ ἀπὸ τῶν πατέρων — сжатое и несколько неясное определение войск, связанных с предками царя.
  naturalness: После правок текст остаётся современным литературным русским и сохраняет сдержанный исторический регистр. «По своим местам» естественно передаёт распределительное «каждого в его собственное место», не ограничивая смысл возвращением домой.
  terminology: «Иноземные войска» удачно передаёт ξέναι δυνάμεις, не предрешая вопрос о наёмничестве. Для ἔθνη предпочтительно нейтральное «другие народы», а не «языческие народы». Неоднозначность заключительной группы следует оставить в основном тексте и пояснить в примечании.
  issues:
