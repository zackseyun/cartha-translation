  yaml_path: translation/deuterocanon/1_maccabees/011/016.yaml
  text: And Alexander fled to Arabia[a], that he might be sheltered there[b]; but King Ptolemy was exalted.
translation:
  language: ru
  text: И Александр бежал в Аравию, чтобы там укрыться[a]; а царь Птолемей был возвышен[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы там найти убежище», «чтобы там скрыться» или «чтобы там получить защиту». Греческое выражение цели может подразумевать убежище, сокрытие или защиту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возвысился», «обрёл высокое положение» или «стал могущественным». Буквально греческий глагол означает «был возвышен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: бежал
  rationale: Аорист φεύγω в данном военно-политическом контексте означает поспешное бегство или отступление; «бежал» передаёт это прямо и естественно.
- source_word: Ἀραβίαν
  choice: Аравию
  rationale: Устоявшаяся русская форма географического названия с требуемым винительным падежом после εἰς.
- source_word: τοῦ σκεπασθῆναι αὐτὸν ἐκεῖ
  choice: чтобы там укрыться
  rationale: Конструкция с τοῦ и инфинитивом выражает цель. Пассивный σκεπασθῆναι допускает значения укрытия, сокрытия и защиты; русское возвратное «укрыться» естественно передаёт поиск убежища, не сводя смысл исключительно к тайному сокрытию.
- source_word: ὁ δὲ βασιλεὺς Πτολεμαῖος
  choice: а царь Птолемей
  rationale: δέ здесь обозначает повествовательное сопоставление двух перемен в положении персонажей; «а» по-русски естественнее, чем более резкое «но».
- source_word: ὑψώθη
  choice: возвысился
  rationale: Передаёт образное и формально неоднозначное значение пассива ὑψόω, сохраняя возможность понимать его как обретение высокого положения, славы или могущества.
theological_decisions:
- issue: Значение ὑψώθη в царском и политическом контексте
  choice: возвысился
  alternative: усилился; приобрёл могущество; был возвышен
  rationale: «Возвысился» сохраняет образ и возможный почётный оттенок греческого глагола, не ограничивая его смысл исключительно политическим усилением. Русская форма естественно может обозначать изменение положения субъекта при пассивной греческой форме.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным повествовательным строем. Синтаксис сохраняет сопоставление бегства Александра и возвышения Птолемея; неоднозначность ключевых глаголов раскрыта в сносках.
