lexical_decisions:
- source_word: Ἀλέξανδρος δὲ ὁ βασιλεὺς
  choice: А царь Александр
  rationale: Частица δέ передаёт переход в повествовании; порядок «царь Александр» естественен для русского библейского повествования и сохраняет титул.
- source_word: ἦν ἐν Κιλικίᾳ
  choice: находился в Киликии
  rationale: Так естественно передаётся продолжительное пребывание в данной области; ἐν имеет обычное местное значение.
- source_word: κατὰ τοὺς καιροὺς ἐκείνους
  choice: в то время
  rationale: Идиоматическая передача временного оборота; русский язык не требует сохранения греческого множественного числа.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину пребывания Александра в Киликии.
- source_word: οἱ ἀπὸ τῶν τόπων ἐκείνων
  choice: жители тех мест
  rationale: Субстантивированный оборот буквально обозначает людей из тех мест; «жители» ясно и естественно передаёт референт без тяжеловесного повтора.
- source_word: ἀπεστάτουν
  choice: подняли мятеж
  rationale: В контексте политических событий глагол означает восстание против власти; сочетание передаёт мятежный характер действий, хотя несовершенный вид греческого допускает акцент на продолжающемся состоянии.
