  source_fidelity: 'Начало передано точно: сохранены повтор «услышать», гнев, немедленность и снятие лагеря. В заключительной части исходный текст требует, чтобы Ионафан встретился с автором письма именно в Птолемаиде; формулировка «прибыл к нему в Птолемаиду» не столь точно выражает это и несколько неясно привязывает место встречи. Также «прекратил осаду» сильнее, чем μὴ περικαθῆσθαι («не продолжать/не оставаться вокруг»).'
