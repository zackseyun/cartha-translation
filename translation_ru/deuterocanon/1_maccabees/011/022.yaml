base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/022.yaml
  text: And when he heard it, he was angry. As soon as he heard, he immediately broke camp and came to Ptolemais, and he wrote to Jonathan not to continue the siege, but to meet him for a conference in Ptolemais as quickly as possible.
translation:
  language: ru
  text: Услышав это, он разгневался. Но, едва услышав, он тотчас снял лагерь и пришёл в Птолемаиду. Он написал Ионафану, чтобы тот не продолжал осаду[a], а как можно скорее встретился с ним в Птолемаиде, чтобы переговорить[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не сидеть вокруг»; в данном контексте речь идёт о продолжении осады.'
    reason: lexical_alternative
  - marker: b
    text: Греческая фраза о встрече синтаксически затруднительна и буквально соединяет выражения «встретить его» и «сойтись с ним». Перевод передаёт наиболее вероятный общий смысл.
    reason: textual_variant
lexical_decisions:
- source_word: ἀκούσας / ἤκουσεν
  choice: услышав об этом / как только он услышал
  rationale: Сохранён заметный повтор глагола ἀκούω, при этом русская формулировка остаётся естественной и во второй части подчёркивает быстроту реакции.
- source_word: ὠργίσθη
  choice: разгневался
  rationale: Точно передаёт наступление гнева, не усиливая его до ярости; соответствует достоинству исторического повествования.
- source_word: εὐθέως
  choice: немедленно
  rationale: Прямо выражает незамедлительность действия современным литературным языком.
- source_word: ἀναζεύξας
  choice: снялся с места
  rationale: Глагол обозначает снятие лагеря и выступление в путь. Выбор сохраняет военный контекст, не добавляя отсутствующего в тексте слова «лагерь».
- source_word: ἦλθεν εἰς Πτολεμαΐδα
  choice: пришёл в Птолемаиду
  rationale: Формально близкая и естественная передача глагола движения и пункта назначения.
- source_word: ἔγραψεν Ἰωναθὰν
  choice: написал Ионафану
  rationale: Ионафан понимается как адресат письма; такая конструкция естественна по-русски.
- source_word: τοῦ μὴ περικαθῆσθαι
  choice: чтобы тот прекратил осаду
  rationale: Буквально выражение означает не оставаться сидеть вокруг; в данном военном контексте речь идёт о прекращении осады. Смысловая конкретизация отмечена сноской.
- source_word: ἀπαντῆσαι αὐτὸν αὐτῷ συνμίσγειν
  choice: прибыл к нему ... для встречи
  rationale: Греческая последовательность синтаксически шероховата и буквально содержит близкие идеи встречи и схождения. Перевод передаёт очевидный общий смысл, а трудность исходного текста отмечает сноска.
- source_word: τὴν ταχίστην
  choice: как можно скорее
  rationale: Естественная русская передача наречного суперлатива со значением предельной поспешности.
