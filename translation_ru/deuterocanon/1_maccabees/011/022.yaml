translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Повтор глагола «услышать» сохранён как особенность греческого текста. Не вполне ясная конструкция в конце стиха передана без излишней конкретизации цели переговоров и снабжена пояснением.
