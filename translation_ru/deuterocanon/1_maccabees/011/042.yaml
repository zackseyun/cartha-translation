  yaml_path: translation/deuterocanon/1_maccabees/011/042.yaml
  text: And Demetrius sent to Jonathan[a], saying, “Not only will I do these things for you and for your nation, but I will greatly honor you and your nation, if I find a suitable opportunity.”
translation:
  language: ru
  text: 'И Димитрий послал сказать Ионафану: «Не только это сделаю для тебя и твоего народа, но и воздам великую честь тебе и твоему народу, если представится благоприятный случай».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν Δημήτριος πρὸς Ἰωνάθαν λέγων
  choice: Димитрий послал сказать Ионафану
  rationale: Оборот с ἀποστέλλω и λέγων естественно передаётся по-русски как отправка устного или письменного сообщения; «послал сказать» сохраняет действие и вводит прямую речь без добавления не указанного в тексте посланника.
- source_word: Οὐ μόνον ταῦτα ποιήσω σοι καὶ τῷ ἔθνει σου
  choice: Не только это сделаю для тебя и твоего народа
  rationale: Будущее ποιήσω и конструкция οὐ μόνον переданы прямо. «Народ» естественно обозначает здесь иудейскую общность и не навязывает современного государственно-политического смысла слова «нация».
- source_word: ἀλλʼ ἢ δόξῃ δοξάσω
  choice: но и воздам великую честь
  rationale: 'Когнатная конструкция δόξῃ δοξάσω эмфатична: буквально она повторяет идею чести/славы. Русское «воздам великую честь» сохраняет усиление и звучит достойно и естественно.'
- source_word: σε καὶ τὸ ἔθνος σου
  choice: тебе и твоему народу
  rationale: Сохранены параллелизм и единообразная передача ἔθνος как «народ».
- source_word: ἐὰν εὐκαιρίας τύχω
  choice: если представится благоприятный случай
  rationale: τύχω с родительным выражает обретение возможности, а εὐκαιρία — удобный, благоприятный момент. Безличный русский оборот естественно сохраняет условность обещания.
