base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/039.yaml
  text: Tryphon had formerly been among those with Alexander[a], and seeing that all the forces were grumbling against Demetrius, he went to Simmakoues the Arab, who was rearing Antiochus, the little child of Alexander.
translation:
  language: ru
  text: Трифон прежде принадлежал к сторонникам Александра. Увидев, что всё войско ропщет против Димитрия, он отправился к арабу Симмакую, который воспитывал Антиоха, малолетнего ребёнка Александра[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «маленького ребёнка Александра»; то есть его сына.'
    reason: 'Греческое выражение эллиптично: родственная связь подразумевается, но слово «сын» прямо не употреблено.'
lexical_decisions:
- source_word: Τρύφων
  choice: Трифон
  rationale: Традиционная русская форма греческого личного имени.
- source_word: τῶν παρὰ Ἀλεξάνδρου
  choice: принадлежал к сторонникам Александра
  rationale: Оборот обозначает принадлежность к окружению или партии Александра, не уточняя должность Трифона.
- source_word: τὸ πρότερον
  choice: прежде
  rationale: Кратко и естественно передаёт указание на прежнее положение дел.
- source_word: πᾶσαι αἱ δυνάμεις
  choice: всё войско
  rationale: В данном военном контексте δυνάμεις означает совокупность вооружённых сил; единственное собирательное «войско» естественно по-русски.
- source_word: καταγογγύζουσιν κατὰ τοῦ Δημητρίου
  choice: ропщет против Димитрия
  rationale: «Ропщет» передаёт недовольные жалобы и враждебную направленность κατά с родительным.
- source_word: ἐπορεύθη πρὸς
  choice: отправился к
  rationale: Нейтрально передаёт целенаправленное движение к человеку.
- source_word: Σιμμάκουην τὸν Ἄραβα
  choice: к арабу Симмакую
  rationale: Имя передано непосредственно по греческой форме источника; этническое обозначение оформлено естественной русской аппозицией.
- source_word: ἔτρεφεν
  choice: воспитывал
  rationale: В контексте ребёнка глагол означает растить и содержать, а не только кормить.
- source_word: τὸ παιδάριον τὸ τοῦ Ἀλεξάνδρου
  choice: малолетнего сына Александра
  rationale: Уменьшительное παιδάριον подчёркивает малый возраст, а эллиптическое τὸ τοῦ Ἀλεξάνδρου указывает на принадлежность ребёнка Александру, по контексту — на сыновство.
