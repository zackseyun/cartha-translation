translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис разделён на два предложения ради ясности; начальный δέ не передан отдельным союзом, поскольку здесь он служит связкой повествования. Настоящее время καταγογγύζουσιν передано русским настоящим внутри зависимого сообщения, сохраняя живость греческой формы.
