  yaml_path: translation/deuterocanon/1_maccabees/011/035.yaml
  text: And the other things belonging to us from now on—the tithes and the taxes belonging to us[a], and the salt lakes[b], and the crowns belonging to us—we will grant all these to them.
translation:
  language: ru
  text: А всё прочее, что причитается нам, — десятины и налоги, причитающиеся нам, соляные озёра[a] и венцы, причитающиеся нам[b], — отныне мы предоставим им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соляные пруды» или «соляные промыслы»; буквально по-гречески: «озёра соли». Вероятно, имеются в виду источники добычи соли либо доходы от них.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «венцы». В данном финансовом контексте это слово может обозначать обычное подношение царю в виде венца или связанный с ним денежный либо иной сбор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄλλα
  choice: всё остальное
  rationale: Передаёт открытый перечень дополнительных царских доходов и прав естественным современным русским выражением.
- source_word: ἀνήκοντα ἡμῖν / τῶν ἀνηκόντων ἡμῖν / τοὺς ἀνήκοντας ἡμῖν
  choice: причитается нам / причитающиеся нам
  rationale: В финансово-правовом контексте речь идёт не просто о принадлежности, а о доходах и подношениях, законно полагающихся царю; повтор исходного текста сохранён.
- source_word: ἀπὸ τοῦ νῦν
  choice: отныне
  rationale: Кратко и достойно обозначает вступление распоряжения в силу с настоящего времени.
- source_word: δεκατῶν
  choice: десятины
  rationale: Обычный русский эквивалент для сбора в размере десятой доли.
- source_word: τελῶν
  choice: налоги
  rationale: Широкий и понятный эквивалент для государственных сборов; более узкие значения «пошлины» или «сборы» контекстом не требуются.
- source_word: τὰς τῶν ἁλῶν λίμνας
  choice: соляные озёра
  rationale: Сохраняет буквальный образ греческого выражения «озёра соли», не устраняя возможную отсылку к местам добычи соли или доходам от них.
- source_word: στεφάνους
  choice: венцы
  rationale: Сохраняет буквальное значение и историческую неоднозначность; возможный фискальный смысл объяснён в сноске.
- source_word: πάντα ἐπαρκέσομεν αὐτοῖς
  choice: всё это мы предоставим им
  rationale: В контексте царских уступок передаёт передачу перечисленных прав или доходов, не сужая значение до одного лишь освобождения от платежей.
