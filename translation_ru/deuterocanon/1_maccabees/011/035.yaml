revisions:
- from: А всё остальное, что причитается нам отныне, — десятины и налоги, причитающиеся нам, соляные озёра[a] и причитающиеся нам венцы[b] — всё это мы предоставим им.
  to: А всё прочее, что причитается нам, — десятины и налоги, причитающиеся нам, соляные озёра[a] и венцы, причитающиеся нам[b], — отныне мы предоставим им.
