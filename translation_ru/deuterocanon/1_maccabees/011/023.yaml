base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/023.yaml
  text: But when Jonathan heard, he ordered them to be surrounded; and he chose some of the elders of Israel and some of the priests, and put himself in danger.
translation:
  language: ru
  text: Но когда Ионафан услышал об этом, он приказал окружить их. Затем он выбрал нескольких старейшин Израиля и нескольких священников и подверг себя опасности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «и отдал его опасности». Формулировка неясна; вероятнее всего, имеется в виду, что Ионафан сам подверг себя опасности.'
    reason: textual_variant
lexical_decisions:
- source_word: περικαθίσθαι
  choice: окружить их
  rationale: Инфинитив в данном военном контексте передаёт приказ окружить или блокировать противников. Русская активная конструкция естественна; местоимение «их» восстанавливает подразумеваемый объект из контекста.
- source_word: ἐπέλεξεν
  choice: выбрал
  rationale: Обычное и ясное соответствие глаголу со значением отбора.
- source_word: τῶν πρεσβυτέρων Ἰσραήλ
  choice: нескольких старейшин Израиля
  rationale: 'Родительный падеж при глаголе выбора имеет партитивный смысл: речь идёт о некоторых старейшинах, а не обо всех.'
- source_word: τῶν ἱερέων
  choice: нескольких священников
  rationale: Параллельная партитивная конструкция указывает на некоторых из числа священников.
- source_word: ἔδωκεν αὐτὸν τῷ κινδύνῳ
  choice: подверг себя опасности
  rationale: Передаёт вероятный идиоматический смысл — Ионафан пошёл на личный риск, — тогда как форму αὐτόν в сохранившемся греческом тексте буквально следовало бы передать как «его».
theological_decisions:
- issue: Неясная референция местоимения в ἔδωκεν αὐτὸν τῷ κινδύνῳ
  choice: 'Передать как действие Ионафана по отношению к самому себе: «подверг себя опасности».'
  alternative: «подверг его опасности» или более буквально «отдал его опасности».
  rationale: Это текстово-интерпретационная, а не вероучительная проблема. Контекст поддерживает личный риск Ионафана, однако грамматическая трудность сохранённого αὐτόν отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Партитивное значение выражено словом «нескольких», а трудность греческого местоимения не скрыта и вынесена в сноску.
