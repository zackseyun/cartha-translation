  yaml_path: translation/deuterocanon/1_maccabees/011/058.yaml
  text: And he sent him gold vessels and table service[c][b][a], and gave him authority to drink from gold vessels and to be clothed in purple and to wear a gold clasp.
translation:
  language: ru
  text: И он послал ему золотые сосуды[a] и принадлежности для обслуживания стола[b], а также дал ему право пить из золотых сосудов, носить пурпурные одежды и золотую застёжку[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотые изделия», «золотая утварь».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные значения: принадлежности для прислуживания или само обслуживание; менее вероятно — прислуживающие люди.'
    reason: lexical_alternative
  - marker: c
    text: 'Застёжка для одежды; возможный перевод: «золотая фибула».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρυσώματα
  choice: золотые сосуды
  rationale: Множественное число обозначает изделия из золота; дальнейшее упоминание питья из них указывает прежде всего на сосуды, хотя греческое слово может иметь более широкое значение.
- source_word: διακονίαν
  choice: принадлежности для обслуживания стола
  rationale: В сочетании с золотыми сосудами слово, вероятно, относится к оснащению для придворного обслуживания за столом. Перевод сохраняет предметный смысл дара, не превращая его без достаточных оснований в указание на слуг.
- source_word: ἐξουσίαν
  choice: право
  rationale: Речь идёт о праве или привилегии, официально дарованной царём; русское «право» естественно передаёт этот смысл.
- source_word: πίνειν ἐν χρυσώμασιν
  choice: пить из золотых сосудов
  rationale: Предложное выражение означает пользоваться золотыми сосудами для питья; перевод сохраняет повтор ключевого греческого слова.
- source_word: εἶναι ἐν πορφύρᾳ
  choice: носить пурпурные одежды
  rationale: Греческая идиома указывает на ношение пурпура как знака высокого положения; эксплицитное «одежды» делает фразу ясной по-русски.
- source_word: πόρπην χρυσῆν
  choice: золотую застёжку
  rationale: πόρπη — застёжка или фибула для одежды; «застёжка» точно и понятно передаёт предмет, не уточняя его форму сверх греческого текста.
