  source_fidelity: 'Смысл в целом передан точно: Птолемей направляется в Сирию с мирными заверениями; жители/представители городов принимают его по распоряжению Александра; основание — родство через брак. Однако заключительное местоименное выражение в русском тексте допускает неверное прочтение отношений: оно может быть понято так, будто Александр был тестем Птолемея, тогда как греческое πενθερός указывает, что Птолемей был тестем Александра.'
