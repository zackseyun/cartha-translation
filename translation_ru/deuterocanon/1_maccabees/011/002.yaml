  yaml_path: translation/deuterocanon/1_maccabees/011/002.yaml
  text: And he went out into Syria with peaceful words[a], and the men from the cities opened to him and went out to meet him, because Alexander the king had given an order to meet him[b], since he was his father-in-law.
translation:
  language: ru
  text: И он отправился в Сирию с мирными речами, и жители городов отворяли ему ворота[a] и выходили ему навстречу, потому что царь Александр велел встречать его[b], так как Птолемей был тестем Александра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открывали ему». В греческом тексте не названо, что именно открывали; вероятнее всего, имеются в виду городские ворота.'
    reason: lexical_alternative
  - marker: b
    text: То есть Александр распорядился, чтобы города благосклонно принимали Птолемея и выходили ему навстречу, поскольку Птолемей был тестем Александра.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: отправился
  rationale: В данном повествовательном контексте естественно передаёт начало движения в Сирию, не добавляя к греческому глаголу лишних смысловых оттенков.
- source_word: λόγοις εἰρηνικοῖς
  choice: с мирными речами
  rationale: Сохраняет конкретное λόγοις и передаёт дипломатические заверения, а не просто мирный образ действий.
- source_word: ἤνοιγον αὐτῷ
  choice: открывали ему
  rationale: Сохраняет эллипсис оригинала, где не названо, что именно открывали; вероятнее всего, подразумеваются города или городские ворота.
- source_word: οἱ ἀπὸ τῶν πόλεων
  choice: жители городов
  rationale: Естественно по-русски обозначает людей из городов; греческая конструкция может относиться к жителям или представителям городов.
- source_word: συνήντων αὐτῷ
  choice: выходили ему навстречу
  rationale: Передаёт встречное движение и хорошо сочетается с контекстом торжественного или благожелательного приёма.
- source_word: ἐντολὴ ἦν Ἀλεξάνδρου τοῦ βασιλέως συναντᾷν αὐτῷ
  choice: царь Александр велел встречать его
  rationale: Идиоматично передаёт наличие царского приказа; подразумеваемый адресат распоряжения понятен из упоминания жителей городов.
- source_word: διὰ τὸ πενθερὸν αὐτοῦ εἶναι
  choice: так как тот был его тестем
  rationale: πενθερός означает отца жены, то есть тестя. Указательное «тот» помогает показать, что Птолемей был тестем Александра, хотя местоименная конструкция оригинала сама по себе сжата.
