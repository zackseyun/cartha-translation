lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямо передаёт аорист ἀκούω, который здесь вводит сообщение о полученных Ионафаном сведениях.
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: военачальники Димитрия
  rationale: В сочетании с упоминанием многочисленной военной силы ἄρχοντες естественно означает начальников или командиров, а не гражданских правителей.
- source_word: παρῆσαν
  choice: прибыли
  rationale: Глагол обозначает их присутствие в Кедесе как результат прибытия; по-русски «прибыли» естественно выражает этот смысл.
- source_word: Κῆδες τὴν ἐν τῇ Γαλιλαίᾳ
  choice: Кедес Галилейский
  rationale: Такое наименование естественно по-русски отличает этот Кедес от других одноимённых мест и сохраняет уточнение греческого текста.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: с большим войском
  rationale: В военно-повествовательном контексте δύναμις означает вооружённые силы; «войско» ясно и естественно передаёт смысл.
- source_word: βουλόμενοι
  choice: намереваясь
  rationale: Причастие выражает намерение прибывших военачальников.
- source_word: μεταστῆσαι αὐτὸν τῆς χρείας
  choice: сместить его с должности
  rationale: μεθίστημι допускает значение устранения или смещения, а χρεία — служебной функции или должности. Выбранная формулировка соответствует политико-военному контексту, не скрывая более широкого значения оборота, отмеченного в сноске.
