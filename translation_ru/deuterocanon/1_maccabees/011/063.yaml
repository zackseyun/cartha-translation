  text: And Jonathan heard that Demetrius’s commanders had come to Kedesh in Galilee with a large force[a], intending to remove him from office.
translation:
  language: ru
  text: И услышал Ионафан, что военачальники Димитрия прибыли в Кедес в Галилее с большим войском, намереваясь сместить его с должности[a].
