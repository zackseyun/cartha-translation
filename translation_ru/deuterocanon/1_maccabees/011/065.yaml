  text: And Simon encamped at Bethsura[a], and fought against it for many days, and shut it in.
translation:
  language: ru
  text: Симон расположился лагерем у Бефсуры и много дней сражался против неё, и окружил её[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «блокировал её», «запер её в кольце осады». Греческий глагол означает «замкнуть, окружить, запереть внутри» и здесь, вероятно, описывает осадное окружение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβάλλεν
  choice: расположился лагерем
  rationale: Глагол обозначает размещение лагеря или занятие военной позиции. Этот перевод сохраняет последовательность действий и не смешивает его значение с последующей осадой.
- source_word: Βεθσούρᾳ
  choice: Бефсуры
  rationale: Транслитерация греческой формы названия Βεθσούρα; после предлога «у» употреблён родительный падеж.
- source_word: ἐπολέμει
  choice: много дней сражался против неё
  rationale: Имперфект передаёт продолжавшиеся военные действия; «сражался против» не сужает смысл до одного приступа.
- source_word: ἡμέρας πολλὰς
  choice: много дней
  rationale: Винительный длительности естественно передаётся по-русски обстоятельством времени «много дней».
- source_word: συνέκλεισεν
  choice: окружил её
  rationale: Глагол означает замкнуть, окружить или запереть внутри; в данном военном контексте речь, вероятно, идёт об осадном окружении. «Окружил» звучит естественно и не вводит более специального понятия полной блокады.
