    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Итак, теперь
  rationale: Передаёт и вывод, выраженный οὖν, и переход к нынешнему распоряжению, выраженный νῦν.
- source_word: ἐπιμελεῖσθε
  choice: позаботьтесь
  rationale: Повелительная форма требует внимательно проследить за исполнением распоряжения; «позаботьтесь» естественно звучит по-русски и сохраняет официальный тон.
- source_word: τοῦ ποιῆσαι … ἀντίγραφον
  choice: сделать копию
  rationale: В административном контексте речь идёт об изготовлении письменной копии документа.
- source_word: τούτων
  choice: всего этого
  rationale: Сохраняет широкую отсылку множественного указательного местоимения к изложенному выше содержанию, не сужая её до конкретного вида документа.
- source_word: δοθήτω Ἰωνάθαν
  choice: пусть её передадут Ионафану
  rationale: Естественная русская передача пассивного повеления и дательного падежа адресата; «передадут» уместнее буквального «дадут» в отношении документа.
- source_word: τεθήτω
  choice: пусть … поместят
  rationale: Передаёт официальное распоряжение о размещении копии и согласуется с русской безлично-неопределённой конструкцией.
- source_word: ἐν ὄρει τῷ ἁγίῳ
  choice: на святой горе
  rationale: Топографическое значение ἐν естественно передаётся русским «на»; выражение сохранено без уточняющего толкования как Храмовой горы или Сиона.
- source_word: ἐν τόπῳ ἐπισήμῳ
  choice: на видном месте
  rationale: В данном контексте ἐπίσημος указывает на заметное, доступное общественному вниманию или особо выделенное место.
