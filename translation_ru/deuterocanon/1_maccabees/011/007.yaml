    reason: cultural_note
lexical_decisions:
- source_word: ἐπορεύθη
  choice: пошёл
  rationale: Аорист πορεύομαι обозначает простое передвижение; «пошёл» естественно передаёт последовательное повествовательное действие.
- source_word: μετὰ τοῦ βασιλέως
  choice: с царём
  rationale: μετά с родительным падежом выражает сопровождение.
- source_word: ἕως τοῦ ποταμοῦ
  choice: до реки
  rationale: ἕως указывает на предел пути или сопровождения; русское «до» сохраняет этот смысл.
- source_word: τοῦ καλουμένου Ἐλευθέρου
  choice: называемой Елевфером
  rationale: Причастие καλουμένου означает «называемый», а географическое имя передано традиционной русской транслитерацией.
- source_word: ἐπέστρεψεν
  choice: возвратился
  rationale: Глагол выражает возвращение; «возвратился» подходит к нейтральному историческому повествованию.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: εἰς с названием места указывает на направление и конечный пункт движения.
