  text: And Jonathan went with the king as far as the river called Eleutherus[a], and he returned to Jerusalem.
translation:
  language: ru
  text: И пошёл Ионафан с царём до реки, называемой Елевфером[a], а затем возвратился в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
