base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/028.yaml
  text: And Jonathan asked the king to make Judea[a], the three toparchies, and Samaria tax-free, and he promised him three hundred talents.
translation:
  language: ru
  text: Ионафан попросил царя освободить от налогов Иудею, три топархии[a] и Самарию и обещал ему триста талантов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Топархия — административный округ. В греческом тексте употреблён специальный территориальный термин, а не общее слово «область».
    reason: cultural_note
lexical_decisions:
- source_word: ἠξίωσεν
  choice: попросил
  rationale: В сочетании с инфинитивом глагол обозначает обращённую к царю просьбу; «попросил» передаёт её официальный характер, не усиливая значение до требования.
- source_word: ποιῆσαι … ἀφορολόγητον
  choice: освободить от налогов
  rationale: Естественная русская формулировка для наделения перечисленных территорий статусом, при котором с них не взимают налоги или подати.
- source_word: τὰς τρεῖς τοπαρχίας
  choice: три топархии
  rationale: Сохранён древний административно-территориальный термин, а его значение пояснено в сноске.
- source_word: τὴν Σαμαρῖτιν
  choice: Самарию
  rationale: Стандартное русское географическое название области Самарии.
- source_word: ἐπηγγείλατο
  choice: обещал
  rationale: Средний залог выражает обещание или обязательство; русский глагол сохраняет это значение без добавления неявного предмета обещания.
- source_word: τάλαντα τριακόσια
  choice: триста талантов
  rationale: Сохранена древняя единица веса и денежного расчёта без ненадёжного пересчёта в современные деньги.
