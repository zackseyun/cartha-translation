  text: And Jonathan tore his clothes[a], and put earth on his head[b], and prayed.
translation:
  language: ru
  text: И разорвал Ионафан свои одежды, насыпал себе на голову земли[a] и помолился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Земля на голове и разорванные одежды были принятыми знаками скорби, бедствия или отчаяния. Греческое слово здесь буквально означает «земля»; по смыслу также возможно «пыль».
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: διέρρηξεν
  choice: разорвал
  rationale: Аорист от διαρρήγνυμι обозначает разрывание одежды как знак горя или крайнего отчаяния; «разорвал» точно и естественно передаёт действие.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: свои одежды
  rationale: Ἱμάτια — общее обозначение одежды; «свои одежды» сохраняет возвратное отношение αὐτοῦ к Ионафану и соответствует литературному русскому регистру.
- source_word: ἐπέθετο γῆν ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: насыпал себе на голову земли
  rationale: Γῆ буквально означает «земля»; такая передача сохраняет лексику греческого текста и вместе с тем естественно описывает жест скорби по-русски. Возвратное «себе» передаёт средний залог и принадлежность головы субъекту.
- source_word: προσηύξατο
  choice: помолился
  rationale: Простая и точная передача аориста среднего залога от προσεύχομαι.
- source_word: Ἰωνάθαν
  choice: Ионафан
  rationale: Устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Значение жестов скорби
  choice: Сохранить в основном тексте только описанные действия, не добавляя толкования их смысла.
  alternative: Прямо назвать эти действия знаком скорби или отчаяния.
  rationale: Греческий текст сообщает о жестах и молитве, но не объясняет их. Культурное значение уместнее отметить в сноске, не превращая подразумеваемый смысл в часть повествования.
- issue: Передача γῆ в обрядовом контексте
  choice: земля
  alternative: прах или пыль
  rationale: Хотя «прах» и «пыль» привычны в описаниях древних знаков скорби, в данном месте стоит γῆ, буквально «земля». Выбор сохраняет конкретную лексику источника без конфессионально или традиционно обусловленной подмены.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. Начальное «И» сохраняет связь стиха с предыдущим рассказом; архаизмы исключены.
