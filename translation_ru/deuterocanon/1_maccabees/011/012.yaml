  source_fidelity: 'Русский текст точно передаёт последовательность греческого оригинала: Птолемей отнял свою дочь у Александра, отдал её Димитрию; затем изменилось «лицо» Александра, и вражда между ними обнаружилась. Причастная конструкция «отняв у него» сохраняет предшествование действия и направленность αὐτοῦ («у него», то есть у Александра).'
