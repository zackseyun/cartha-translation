  yaml_path: translation/deuterocanon/1_maccabees/011/012.yaml
  text: And after taking his daughter away from him[a], he gave her to Demetrius; and Alexander’s attitude changed, and their hostility became evident.
translation:
  language: ru
  text: И, отняв у него свою дочь, он отдал её Димитрию; лицо Александра изменилось[a], и их вражда стала явной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лицо Александра изменилось». Это выражение может указывать на перемену в его настроении, отношении или внешнем выражении чувств.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφελόμενος αὐτοῦ τὴν θυγατέρα
  choice: отняв у него свою дочь
  rationale: Причастие ἀφελόμενος передаёт предшествующее действие и оттенок лишения; αὐτοῦ обозначает того, у кого дочь отняли, то есть Александра. «Свою» естественно указывает, что речь о дочери действующего лица, тогда как «у него» сохраняет направленность действия.
- source_word: ἔδωκεν αὐτὴν τῷ Δημητρίῳ
  choice: он отдал её Димитрию
  rationale: Сохранено простое значение ἔδωκεν — «отдал»; брачный контекст не внесён в основной текст сверх прямо сказанного по-гречески.
- source_word: ἠλλοιώθη τὸ πρόσωπον Ἀλεξάνδρου
  choice: лицо Александра изменилось
  rationale: Формальная образность греческого выражения сохранена, поскольку она понятна по-русски и не вынуждает выбирать только между буквальной переменой лица, выражением чувств и переменой отношения.
- source_word: ἐφάνη ἡ ἔχθρα αὐτῶν
  choice: их вражда стала явной
  rationale: ἐφάνη здесь указывает на обнаружение, явное проявление уже существующей вражды; «стала явной» естественно передаёт этот смысл.
