lexical_decisions:
- source_word: οὐδὲ εἷς κατελείφθη ἀπʼ αὐτῶν
  choice: Из них не осталось ни одного
  rationale: Передаёт эмфатическое отрицание οὐδὲ εἷς и естественно выражает по-русски, что из упомянутой группы никто более не остался.
- source_word: πλὴν
  choice: кроме
  rationale: Ясно и естественно передаёт исключительное значение греческого предлога.
- source_word: Ματταθίας ὁ τοῦ Ἀψαλώμου
  choice: Маттафии, сына Авессалома
  rationale: Конструкция с артиклем и родительным падежом обозначает происхождение; традиционные русские формы имён подходят для библейского текста.
- source_word: Ἰούδας ὁ τοῦ Χαλφεί
  choice: Иуды, сына Халфея
  rationale: Родительный падеж при субстантивированном артикле естественно понимается как указание на отца; сохранена принятая русская форма имени Иуда.
- source_word: ἄρχοντες
  choice: начальников
  rationale: В военном контексте слово обозначает лиц, осуществляющих командование; «начальники» передаёт это без политического оттенка слова «правители».
- source_word: τῆς στρατιᾶς τῶν δυνάμεων
  choice: воинских сил
  rationale: Греческое сочетание двух близких военных терминов в русском дословно звучало бы тяжеловесно и тавтологично; выбранное выражение сохраняет военный смысл обоих слов, а неоднозначность отмечена в сноске.
