  yaml_path: translation/deuterocanon/1_maccabees/011/027.yaml
  text: And he confirmed for him the high priesthood[a], and whatever other honors he had formerly held, and he made him rank among the first friends.
translation:
  language: ru
  text: И он утвердил за ним первосвященство и все прочие почести, которыми тот обладал прежде, и причислил его к числу первых друзей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к числу главных друзей». Греческое выражение, вероятно, обозначает официальный придворный ранг в государстве Селевкидов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστήρισεν
  choice: утвердил за ним
  rationale: В административно-политическом контексте речь идёт об официальном подтверждении и закреплении уже полученной должности, а не о первоначальном назначении.
- source_word: ἀρχιερωσύνην
  choice: первосвященство
  rationale: Слово обозначает сан и должность первосвященника; традиционный русский термин точен и естественен.
- source_word: τίμια
  choice: почести
  rationale: Субстантивированное прилагательное здесь обозначает почётные отличия и привилегии, а не материальные ценности.
- source_word: τὸ πρότερον
  choice: прежде
  rationale: Кратко и естественно передаёт указание на ранее принадлежавшие Ионафану почести.
- source_word: τῶν πρώτων φίλων
  choice: к числу первых друзей
  rationale: Сравнительно буквальная передача сохраняет вероятное официальное придворное звание в государстве Селевкидов.
- source_word: ἡγεῖσθαι
  choice: причислил
  rationale: В данной конструкции глагол выражает признание или назначение человека членом определённой статусной группы.
