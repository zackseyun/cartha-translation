  source_fidelity: 'Текст точно передаёт греческий оригинал: «утвердил за ним» адекватно выражает административное подтверждение статуса (ἐστήρισεν αὐτῷ), «первосвященство» соответствует ἀρχιερωσύνην, а «почести, которыми тот обладал прежде» передаёт τίμια ... τὸ πρότερον без неоправданного сужения значения. «Причислил его к числу первых друзей» естественно воспроизводит статусное включение, выраженное конструкцией τῶν πρώτων φίλων ἡγεῖσθαι.'
