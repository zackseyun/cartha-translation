base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/004.yaml
  text: But when he came near Ashdod[a], they showed him the temple of Dagon burned down, and Ashdod and its surrounding villages torn down, and the bodies thrown about[b], and those burned in the war—for they had made heaps of them along his route.
translation:
  language: ru
  text: Когда он приблизился к Азоту, ему показали сожжённый храм Дагона, разрушенные Азот и его окрестные селения[a], разбросанные тела и тех, кого он сжёг во время войны, ибо из них сложили груды вдоль его пути[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пригороды», «окрестности».'
    reason: lexical_alternative
  - marker: b
    text: 'Значение редкого греческого слова βωμίας не вполне ясно: возможно, «груды», «насыпи» или «погребальные костры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: приблизился
  rationale: Естественно и точно передаёт движение к городу без архаического оттенка.
- source_word: Ἄζωτον
  choice: Азот
  rationale: Традиционная русская библейская форма названия города, известного также как Ашдод.
- source_word: ἱερὸν Δαγὼν
  choice: храм Дагона
  rationale: В данном контексте ἱερόν обозначает языческий храм или святилище; «храм» ясно и естественно.
- source_word: ἐνεπυρισμένον
  choice: сожжённый
  rationale: Передаёт результирующее состояние храма после пожара, не добавляя прямо не выраженной степени разрушения.
- source_word: τὰ περιπόλια αὐτῆς
  choice: окрестные селения
  rationale: Передаёт окружающие город поселения или территории и лучше соответствует древнему контексту, чем современное «пригороды».
- source_word: καθῃρημένα
  choice: разрушенные
  rationale: Охватывает смысл снесённых или разорённых города и окрестных поселений.
- source_word: τὰ σώματα ἐρριμμένα
  choice: разбросанные тела
  rationale: Контекст указывает на тела погибших; формулировка сохраняет образ беспорядочно брошенных тел.
- source_word: τοὺς ἐμπεπυρισμένους οὓς ἐνεπύρισε
  choice: сожжённых им
  rationale: Сохраняет объектную конструкцию и прямо выраженное относительным местоимением действие субъекта.
- source_word: ἐν τῷ πολέμῳ
  choice: во время войны
  rationale: πόλεμος шире отдельной битвы; русский оборот естественно передаёт временную рамку.
- source_word: βωμίας
  choice: груды
  rationale: Редкое и не вполне ясное слово в контексте, вероятно, обозначает сложенные груды или насыпи; выбор не конкретизирует их как погребальные костры.
- source_word: ἐν τῇ ὁδῷ αὐτοῦ
  choice: вдоль его пути
  rationale: Ясно передаёт размещение увиденного на дороге, по которой он следовал.
