lexical_decisions:
- source_word: ἀθετήσεται
  choice: не будет отменено
  rationale: Будущее страдательного залога передаёт отмену или лишение силы ранее названных постановлений; «не будет отменено» естественно звучит по-русски и сохраняет юридический оттенок контекста.
- source_word: οὐδὲν τούτων
  choice: ничто из этого
  rationale: Выражение отсылает ко всем ранее перечисленным уступкам или постановлениям и естественно передаёт отрицательное местоимение с указательным оборотом.
- source_word: ἀπὸ τοῦ νῦν
  choice: отныне
  rationale: Кратко и точно передаёт начало действия с настоящего момента; слово уместно в современном литературном тексте официального характера.
- source_word: ἐπὶ τὸν ἅπαντα χρόνον
  choice: во все времена
  rationale: Передаёт полный и неограниченный временной охват греческого выражения, не заменяя его более интерпретирующим «навеки».
