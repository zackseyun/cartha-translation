  source_fidelity: 'Греч. οὐκ ἀθετήσεται передано точно по смыслу будущего страдательного залога: речь о том, что ранее названные установления не будут отменены или лишены силы. οὐδὲν τούτων («ничто из этого») и ἀπὸ τοῦ νῦν («отныне») также переданы верно. Однако «во все времена» обычно означает «в каждое время, всегда» и несколько хуже выражает направленную в будущее длительность ἐπὶ τὸν ἅπαντα χρόνον.'
