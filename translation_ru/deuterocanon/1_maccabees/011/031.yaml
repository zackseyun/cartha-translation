  text: We have also written to you a copy of the letter that Lasthenes wrote to our kinsman concerning you[a], so that you may see it.
translation:
  language: ru
  text: Копию письма, которое Ласфен написал нашему родичу о вас[a], мы также написали вам, чтобы вы могли её увидеть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашему родственнику». Греческое συγγενής может означать кровного родственника, родича, соплеменника или, в зависимости от контекста, почётно именуемого союзника либо соратника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἀντίγραφον τῆς ἐπιστολῆς
  choice: копию письма
  rationale: ἀντίγραφον означает копию или список документа, а ἐπιστολή — письмо. В данном контексте естественно употребить неопределённое по смыслу «копию письма», не воспроизводя греческий артикль отдельным указанием.
- source_word: ἧς ἔγραψεν Λασθένεις
  choice: которое Ласфен написал
  rationale: Относительное местоимение относится к письму; ἔγραψεν передаёт именно действие «написал». Имя Λασθένεις передано в принятой русской библейской форме «Ласфен».
- source_word: τῷ συγγενεῖ ἡμῶν
  choice: нашему родичу
  rationale: συγγενής может обозначать кровного родственника, соплеменника либо почётного приближённого. «Родич» сохраняет родственную лексику и не уточняет степень или характер связи.
- source_word: περὶ ὑμῶν
  choice: о вас
  rationale: περί с родительным падежом здесь естественно означает «о, относительно»; краткое «о вас» соответствует современному русскому литературному употреблению.
- source_word: γεγράφαμεν καὶ πρὸς ὑμᾶς
  choice: мы послали и вам
  rationale: Буквально выражение связано с «написали также вам», однако применительно к копии письма означает её письменное воспроизведение и направление адресатам. «Послали и вам» естественно выражает документальный контекст и значение καί.
- source_word: ὅπως ἰδῆτε
  choice: чтобы вы могли с ним ознакомиться
  rationale: Оборот выражает цель. Буквальное «чтобы вы увидели» по-русски менее естественно применительно к содержанию приложенного письма; «ознакомиться» передаёт предполагаемое прочтение документа без добавления толкования его содержания.
