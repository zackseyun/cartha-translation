  yaml_path: translation/deuterocanon/1_maccabees/011/026.yaml
  text: And the king dealt with him as those before him had dealt with him[a], and he exalted him above all his friends.
translation:
  language: ru
  text: И царь поступил с ним так же, как поступали с ним предшественники царя, и возвысил его над всеми своими друзьями[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед всеми своими друзьями»; возможно также: «в присутствии всех своих друзей». Греческое выражение может означать публичное возвышение при царском дворе, хотя контекст допускает и возвышение по положению над остальными.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν αὐτῷ
  choice: поступил с ним
  rationale: В сочетании с дательным ποιέω обозначает действие или отношение к человеку; «поступил с ним» естественно передаёт этот смысл, не уточняя характера оказанной милости сверх греческого текста.
- source_word: καθὼς ἐποίησαν αὐτῷ οἱ πρὸ αὐτοῦ
  choice: так же, как поступали с ним его предшественники
  rationale: οἱ πρὸ αὐτοῦ относится к прежним царям. «Его предшественники» ясно и естественно выражает подразумеваемую политическую преемственность.
- source_word: ὕψωσεν
  choice: возвысил
  rationale: ὑψόω здесь означает возвышение в достоинстве, почёте или придворном ранге; «возвысил» сохраняет широту и торжественный оттенок греческого слова.
- source_word: ἐναντίον πάντων τῶν φίλων αὐτοῦ
  choice: над всеми своими друзьями
  rationale: В сочетании с «возвысил» выражение допускает смысл превосходства в придворном ранге. «Друзья» сохраняет φίλοι — обычное обозначение членов царского окружения, а альтернативный пространственно-публичный смысл вынесен в примечание.
