base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/055.yaml
  text: And all the forces that Demetrius had dismissed gathered to him[a], and they fought against him; and he fled and was routed.
translation:
  language: ru
  text: И собрались к нему все войска, которые Димитрий распустил[a]. Они сразились с ним, и он бежал и был разбит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отослал» или «уволил со службы». Греческий глагол может означать как удаление воинов из своего присутствия, так и их роспуск; контекст указывает на военное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: собрались
  rationale: Аорист пассивного залога с πρὸς αὐτόν описывает соединение войск с упомянутым человеком; «собрались к нему» естественно передаёт это движение и присоединение.
- source_word: δυνάμεις
  choice: войска
  rationale: В данном военном контексте слово обозначает вооружённые силы; «войска» ясно и естественно по-русски.
- source_word: ἀπεκρόακεν
  choice: распустил
  rationale: Глагол указывает на предшествующее удаление или увольнение воинов; «распустил» сохраняет военный смысл, не уточняя сверх текста, были ли они окончательно уволены или лишь отосланы.
- source_word: ἐπολέμησαν πρὸς αὐτόν
  choice: сразились с ним
  rationale: Оборот имеет противительный смысл и обозначает вооружённое выступление против него; по-русски «сразились с ним» однозначно в данном контексте.
- source_word: ἔφυγεν
  choice: бежал
  rationale: Кратко и точно передаёт бегство с поля боя в последовательности повествовательных аористов.
- source_word: ἐτροπώθη
  choice: был разбит
  rationale: Военное пассивное значение связано с обращением в бегство и разгромом; «был разбит» звучит естественно и сохраняет оттенок военного поражения.
