translation:
  language: ru
  text: И он упрекнул его за то, что тот пожелал его царства.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «упрекнул его за то, что тот возжелал его царства». Греческий глагол, переведённый как «пожелал», в данном контексте может иметь более сильный смысл: «возжелал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐψόγισεν
  choice: упрекнул
  rationale: Глагол означает порицать, винить, упрекать. «Упрекнул» сохраняет личный и обвинительный характер высказывания, не усиливая его до формального осуждения.
- source_word: χάριν τοῦ
  choice: за то, что
  rationale: Сочетание χάριν с субстантивированным инфинитивом выражает причину; «за то, что» естественно связывается в русском с глаголом «упрекнул».
- source_word: ἐπιθυμῆσαι
  choice: пожелал завладеть
  rationale: ἐπιθυμέω обозначает желание, которое здесь направлено на чужое царство и потому имеет оттенок притязания. Выражение передаёт объектное желание естественнее, чем буквальное «пожелал его царства», но не усиливает его до однозначного «возжелал».
- source_word: τῆς βασιλείας
  choice: царством
  rationale: βασιλεία здесь обозначает царство, то есть владение и власть царя; «царство» — прямой и понятный русский эквивалент.
- source_word: αὐτὸν ... αὐτοῦ
  choice: его ... его
  rationale: Повтор местоимения сохраняет присущую греческой фразе компактность и формальную неоднозначность отнесения, хотя по контексту естественно понимать, что обвиняемый пожелал царства обвинителя.
