translation:
  language: ru
  text: 'Царь Димитрий — Ионафану, своему брату, и народу иудейскому: приветствие.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βασιλεὺς Δημήτριος
  choice: Царь Димитрий
  rationale: Царский титул и имя прямо передают отправителя в формуле официального письма; «Димитрий» — традиционная русская библейская форма имени.
- source_word: Ἰωνάθαν
  choice: Ионафану
  rationale: Дательный падеж передаёт адресата; «Ионафан» — устоявшаяся русская библейская форма имени.
- source_word: τῷ ἀδελφῷ
  choice: своему брату
  rationale: Сохраняет прямо выраженное слово «брат» и естественно звучит по-русски; в царской переписке оно может быть почётным дипломатическим обращением, а не указанием на кровное родство.
- source_word: χαίρειν
  choice: приветствие
  rationale: Передаёт стандартную эллинистическую эпистолярную формулу кратко и в официальном регистре.
- source_word: ἔθνει Ἰουδαίων
  choice: народу иудейскому
  rationale: ἔθνος обозначает народ как общность, а Ἰουδαίων определяет его как иудейский; это естественная и исторически уместная русская формулировка.
theological_decisions:
- issue: Значение ἀδελφός в царской переписке
  choice: Сохранено буквальное «брат» без пояснения в основном тексте
  alternative: Передать как «союзник» или понимать как буквального родственника
  rationale: Греческий текст прямо называет Ионафана братом, однако дипломатический контекст допускает почётно-политический смысл. Перевод сохраняет эту смысловую напряжённость и не навязывает одно толкование.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified официально-эпистолярной формой. Тире и двоеточие помогают ясно воспроизвести структуру греческого заголовка письма без лишнего добавления глагола «пишет».
