lexical_decisions:
- source_word: Δὸς
  choice: Протяните
  rationale: Аористный императив δίδωμι буквально означает «дайте». В сочетании с «правыми руками» естественное русское «протяните» сохраняет конкретный жест и передаёт просьбу заключить соглашение.
- source_word: δεξιάς
  choice: правые руки
  rationale: Множественное число сохранено вслед за греческим текстом; это образное обозначение жеста, служившего заверением в мире, союзе или доброй воле. Смысл пояснён в сноске, а не подменён толкованием в тексте.
- source_word: παυσάσθωσαν
  choice: пусть ... перестанут
  rationale: Императив третьего лица передаёт требование прекратить продолжающееся действие; эта конструкция естественна в современном русском языке.
- source_word: πολεμοῦντες
  choice: воевать против
  rationale: Причастие πολεμοῦντες обозначает продолжающиеся военные действия. «Воевать против» ясно сохраняет направленность враждебного действия.
- source_word: ἡμᾶς καὶ τὴν πόλιν
  choice: против нас и города
  rationale: Предлог «против» относится к обоим однородным объектам. «Города» сохраняет определённость греческого τὴν πόλιν без добавления отсутствующего в оригинале притяжательного местоимения «нашего».
