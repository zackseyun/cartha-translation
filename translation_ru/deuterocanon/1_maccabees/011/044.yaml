  text: And Jonathan sent three thousand men, mighty in their strength, to Antioch, and they came to the king, and the king rejoiced at their arrival.
translation:
  language: ru
  text: И Ионафан послал в Антиохию три тысячи мужей, могучих силой. Они пришли к царю, и царь обрадовался их прибытию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их приходу»; возможно также: «их приближению». Греческое слово может обозначать приближение или приход, а в некоторых контекстах — наступление; здесь, вероятнее всего, имеется в виду прибытие людей Ионафана к царю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный глагол со значением отправления; «послал» точно и естественно передаёт его в данном контексте.
- source_word: ἄνδρας τρισχιλίους
  choice: три тысячи мужей
  rationale: ἄνδρας буквально означает «мужей, мужчин». Военный контекст очевиден, однако существительное «воинов» в греческом тексте прямо не употреблено; «мужей» сохраняет формальную точность и достойный библейский регистр.
- source_word: δυνατοὺς ἰσχύι αὐτῶν
  choice: могучих силой
  rationale: Сочетание подчёркивает силу и боеспособность людей. Русская формулировка сохраняет эмфатическую, отчасти плеонастическую структуру греческого выражения, оставаясь понятной.
- source_word: εἰς Ἀντιοχίαν
  choice: в Антиохию
  rationale: Направительное εἰς при названии города естественно передаётся русским «в» с винительным падежом.
- source_word: ἦλθοσαν πρὸς τὸν βασιλέα
  choice: они пришли к царю
  rationale: Прямо передаёт движение к царю без добавления отсутствующей в оригинале смысловой конкретизации.
- source_word: ηὐφράνθη
  choice: обрадовался
  rationale: Глагол означает испытать радость или веселье; «обрадовался» естественно и точно звучит в современном русском повествовании.
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: их прибытию
  rationale: ἐφόδῳ может обозначать приближение, приход или наступление. После сообщения, что люди пришли к царю, наиболее вероятен смысл их прибытия, при этом альтернативы отмечены в сноске.
