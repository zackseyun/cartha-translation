  yaml_path: translation/deuterocanon/1_maccabees/011/033.yaml
  text: To the nation of the Jews[a], our friends, who also maintain what is right toward us, we have decided to do good, because of their goodwill toward us.
translation:
  language: ru
  text: Иудейскому народу — нашим друзьям, соблюдающим должное по отношению к нам, — мы решили оказать благодеяние благодаря их доброжелательности к нам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполняющим свои обязательства перед нами». Буквально: «сохраняющим то, что справедливо по отношению к нам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: Иудейскому народу
  rationale: Дательный падеж передаёт косвенное дополнение при ἐκρίναμεν ἀγαθοποιῆσαι; «народ» естественно передаёт ἔθνος, а «иудейскому» соответствует историко-политическому контексту.
- source_word: φίλοις ἡμῶν
  choice: нашим друзьям
  rationale: Аппозитивное определение адресата; прямой и естественный эквивалент, сохраняющий официально-дипломатический оттенок.
- source_word: συντηροῦσι
  choice: которые соблюдают
  rationale: Глагол обозначает продолжающееся сохранение или исполнение должного; «соблюдают» естественно сочетается со справедливостью и возможными обязательствами.
- source_word: τὰ πρὸς ἡμᾶς δίκαια
  choice: справедливость по отношению к нам
  rationale: Передаёт буквально неопределённое «справедливое/должное в отношении нас», не сводя выражение однозначно к юридическим обязательствам; альтернативное понимание дано в сноске.
- source_word: ἐκρίναμεν
  choice: мы решили
  rationale: В официальном письме выражает принятое властное решение; современное и ясное соответствие.
- source_word: ἀγαθοποιῆσαι
  choice: оказать благодеяние
  rationale: Передаёт намерение принести пользу или сделать добро адресату; «оказать благодеяние» подходит к официальному царскому указу и не уточняет содержание льгот заранее.
- source_word: χάριν
  choice: за
  rationale: Выражает основание благоприятного решения — в ответ на проявленную адресатами доброжелательность; по-русски здесь естественна конструкция «за их доброжелательность».
- source_word: τῆς ἑαυτῶν εὐνοίας πρὸς ἡμᾶς
  choice: их доброжелательность к нам
  rationale: εὔνοια означает благосклонное, доброжелательное расположение, в политическом контексте также лояльность; выбранное выражение сохраняет широту значения.
