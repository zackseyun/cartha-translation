  text: И они подожгли город, и в тот день захватили много добычи, и спасли царя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεπύρισαν
  choice: подожгли
  rationale: Глагол означает предать огню, поджечь; «подожгли город» естественно передаёт каузативное действие, не утверждая сверх текста, что город сгорел полностью.
- source_word: τὴν πόλιν
  choice: город
  rationale: Обычное и прямое соответствие πόλις в данном повествовательном контексте.
- source_word: ἐλάβοσαν σκῦλα πολλὰ
  choice: захватили богатую добычу
  rationale: σκῦλα обозначает военную добычу, а πολλὰ — её значительное количество. Сочетание «богатая добыча» естественно в современном русском и сохраняет количественный смысл.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: в тот день
  rationale: Прямое и идиоматичное русское обозначение времени.
- source_word: ἔσωσαν
  choice: спасли
  rationale: Сохраняет широкий смысл глагола σῴζω — избавить от опасности, спасти — без ненужного уточнения способа.
- source_word: τὸν βασιλέα
  choice: царя
  rationale: В историко-библейском контексте βασιλεύς естественно передаётся словом «царь».
