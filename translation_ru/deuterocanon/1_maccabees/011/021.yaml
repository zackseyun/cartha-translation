  text: And some lawless men[a], who hated their own nation, went to the king and reported to him that Jonathan was besieging the citadel.
translation:
  language: ru
  text: И некоторые беззаконные люди, ненавидевшие свой народ, пошли к царю и сообщили ему, что Ионафан осаждает цитадель[a].
