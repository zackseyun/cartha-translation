lexical_decisions:
- source_word: ἐπορεύθησάν
  choice: пошли
  rationale: Простой повествовательный глагол движения; форма «пошли» естественно передаёт греческий аорист без лишнего уточнения способа передвижения.
- source_word: τινες
  choice: некоторые
  rationale: Сохраняет неопределённость множественного числа; слово «люди» выражено далее как соответствие ἄνδρες.
- source_word: μισοῦντες
  choice: ненавидевшие
  rationale: Причастие сохраняет описательную функцию греческого причастия и естественно связывается с определяемой группой лиц.
- source_word: τὸ ἔθνος αὐτῶν
  choice: свой народ
  rationale: В данном контексте ἔθνος обозначает собственный иудейский народ этих людей; возвратное «свой» ясно передаёт αὐτῶν при совпадении субъекта.
- source_word: ἄνδρες παράνομοι
  choice: беззаконные люди
  rationale: Передаёт нравственно-правовую оценку παράνομοι, не сводя её только к официальному статусу преступников.
- source_word: ἀπήγγειλαν
  choice: донесли
  rationale: В придворно-политическом контексте глагол означает сообщение властителю; «донесли» также уместно передаёт враждебный характер сообщения, заметный из контекста.
- source_word: περικάθηται
  choice: осаждает
  rationale: В сочетании с укреплённым объектом глагол обозначает окружение или осаду; настоящее время сохраняет одновременность действия с сообщением царю.
- source_word: τὴν ἄκραν
  choice: крепость
  rationale: ἄκρα обозначает укреплённую цитадель; «крепость» понятно современному читателю, а исторически конкретное название сохранено в примечании.
