base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/034.yaml
  text: Therefore we have confirmed for them the borders of Judea and the three districts—Aphairema and Lydda and Ramathaim—which were added to Judea from Samaria[a], and all that adjoins them, for all who offer sacrifice in Jerusalem[c][b], instead of the royal taxes that the king formerly received from them each year from the produce of the land and the fruit trees.
translation:
  language: ru
  text: Итак, мы утвердили за ними границы Иудеи и три округа[a] — Афайрему, Лидду и Рамафим, — присоединённые к Иудее из Самарии, со всем, что к ним относится[b], для всех приносящих жертвы в Иерусалиме, взамен царских податей, которые царь прежде ежегодно получал от них с урожая земли и плодов деревьев[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово νομοί обозначает здесь административные округа; в специальной литературе их также называют номами.
    reason: lexical_alternative
  - marker: b
    text: Выражение «всё, что к ним относится» может включать зависимые селения, земли и иные владения, связанные с этими тремя округами.
    reason: lexical_ambiguity
  - marker: c
    text: Греческое слово может обозначать различные плоды деревьев, в том числе фрукты и орехи.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐστήκαμεν
  choice: мы утвердили
  rationale: В контексте царского постановления совершенная форма ἵστημι обозначает официальное установление или закрепление решения; «утвердили» естественно передаёт его юридико-административный характер.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: границы Иудеи
  rationale: ὅρια означает границы или пределы территории; буквальное и ясное соответствие сохранено.
- source_word: τοὺς τρεῖς νομοὺς
  choice: три округа
  rationale: В эллинистическом административном употреблении νομός — территориальный округ. «Округа» понятно современному читателю и не требует специального термина «номы».
- source_word: Ἀφαίρεμα καὶ Λυδδὰ καὶ Ραμαθείμ
  choice: Афайрему, Лидду и Рамафим
  rationale: Названия переданы транслитерацией греческих форм; винительный падеж обусловлен русским синтаксисом после «утвердили».
- source_word: προσετέθησαν τῇ Ἰουδαίᾳ ἀπὸ τῆς Σαμαρίτιδος
  choice: присоединённые к Иудее от Самарии
  rationale: Передаёт административный переход округов от Самарии к Иудее, не уточняя политический механизм сверх текста.
- source_word: πάντα τὰ συγκυροῦντα αὐτοῖς
  choice: со всем, что к ним относится
  rationale: Широкая греческая формулировка может охватывать зависимые селения, земли и прочие принадлежности; русский вариант сохраняет эту неопределённость.
- source_word: πᾶσιν τοῖς θυσιάζουσιν εἰς Ἰερουσαλήμ
  choice: для всех приносящих жертвы в Иерусалиме
  rationale: θυσιάζω означает именно принесение жертвы, а не поклонение вообще; дательный оборот сохранён как указание на тех, в чью пользу действует пожалование.
- source_word: ἀντὶ τῶν βασιλικῶν
  choice: взамен царских податей
  rationale: Субстантивированное τὰ βασιλικά в финансовом контексте обозначает причитавшиеся царю сборы или доходы; «подати» соответствует официальному регистру.
- source_word: ὧν ἐλάμβανεν ὁ βασιλεὺς παρʼ αὐτῶν τὸ πρότερον κατʼ ἐνιαυτόν
  choice: которые царь прежде ежегодно получал от них
  rationale: Имперфект вместе с τὸ πρότερον и κατʼ ἐνιαυτόν указывает на регулярное взимание в прошлом.
- source_word: τῶν γενημάτων τῆς γῆς
  choice: с урожая земли
  rationale: γενήματα охватывает сельскохозяйственный урожай или произведения земли; оборот с «с» естественно сочетается с взиманием податей.
- source_word: τῶν ἀκροδρύων
  choice: плодов деревьев
  rationale: ἀκρόδρυα обозначает древесные плоды, включая в зависимости от контекста фрукты и орехи; перевод не сужает значение до определённого вида продукции.
