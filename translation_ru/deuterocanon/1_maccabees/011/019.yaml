lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: воцарился
  rationale: Аорист βασιλεύω в этой краткой хронологической формуле обозначает вступление Димитрия на царство. «Воцарился» естественно передаёт начальный момент его правления; вариант «царствовал» мог бы быть понят как указание на продолжительность царствования.
- source_word: Δημήτριος
  choice: Димитрий
  rationale: Использована закрепившаяся в русской библейской традиции форма этого личного имени.
- source_word: ἔτους ἑβδομοῦ καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: в сто шестьдесят седьмом году
  rationale: Генитивная конструкция служит формулой датировки; греческий порядок разрядов буквально идёт от единиц к сотням, но по-русски число естественно передаётся как «сто шестьдесят седьмой».
