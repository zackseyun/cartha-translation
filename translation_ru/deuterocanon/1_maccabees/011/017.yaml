lexical_decisions:
- source_word: ἀφεῖλεν
  choice: отсёк
  rationale: В сочетании с прямым дополнением «голову» глагол означает отделение головы от тела; «отсёк» ясно и естественно передаёт действие, не ослабляя его до «снял» или «убрал».
- source_word: Ζαβδιὴλ
  choice: Завдиил
  rationale: Имя передано в форме, принятой в русской библейской традиции для данного персонажа.
- source_word: ὁ Ἀραβ
  choice: араб
  rationale: Определённое этническое обозначение при имени естественно передаётся по-русски приложением «араб».
- source_word: τὴν κεφαλὴν Ἀλεξάνδρου
  choice: Александру голову
  rationale: Русская конструкция с дательным принадлежности естественно выражает, что голова принадлежала Александру, и сохраняет ясность повествования.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный эквивалент греческого глагола; местоимение «её» необходимо в русском для ясного обозначения посланного предмета.
- source_word: τῷ Πτολεμαίῳ
  choice: Птолемею
  rationale: Передаёт имя адресата без добавления отсутствующего в греческом тексте титула «царь».
