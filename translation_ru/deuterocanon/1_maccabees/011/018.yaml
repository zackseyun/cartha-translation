base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/018.yaml
  text: And King Ptolemy died on the third day[a], and those who were in his strongholds were destroyed by those in the strongholds.
translation:
  language: ru
  text: И царь Птолемей умер на третий день, а те, кто находился в его крепостях, были уничтожены теми, кто находился в крепостях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слово «крепости» повторено в обеих частях фразы. Вероятно, речь идёт о людях Птолемея в его крепостях и о другой группе, находившейся в крепостях и выступившей против них, однако точное соотношение этих групп выражено сжато и остаётся неясным.
    reason: Сохранение лексической и синтаксической неоднозначности оригинала.
lexical_decisions:
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямо передаёт значение аориста без эвфемизма и без стилистического утяжеления.
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: на третий день
  rationale: Естественная русская передача греческого оборота; точка отсчёта остаётся заданной ходом повествования и не уточняется сверх текста.
- source_word: οἱ ὄντες
  choice: те, кто находился
  rationale: Передаёт субстантивированное причастие без необоснованного добавления указания на пол и естественно звучит применительно к месту пребывания.
- source_word: ὀχυρώμασιν
  choice: крепостях
  rationale: Слово обозначает укреплённые места; «крепости» сохраняет военный смысл и хорошо выдерживает намеренное повторение.
- source_word: ἀπώλοντο
  choice: были уничтожены
  rationale: Сохраняет результативность и наличие названного далее деятеля, не сужая смысл до одного лишь убийства.
- source_word: ὑπὸ τῶν ἐν τοῖς ὀχυρώμασιν
  choice: теми, кто находился в крепостях
  rationale: Передаёт ὑπό с родительным как указание на деятеля и сохраняет сжатость и повтор исходного текста.
