    text: 'Или: «захватить царство Александра»; греческий глагол может также означать «одолеть» или «подчинить своей власти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθροισεν
  choice: собрал
  rationale: Аорист ἀθροίζω означает «собирать, стягивать»; в военном контексте естественно передаёт мобилизацию сил без излишней конкретизации.
- source_word: δυνάμεις πολλὰς
  choice: многочисленные войска
  rationale: δυνάμεις в военном повествовании обозначает вооружённые силы; «войска» естественно и понятно по-русски, а «многочисленные» согласуется с последующим сравнением с песком.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: как песок на морском берегу
  rationale: Сохраняет традиционный библейский образ несметного множества и звучит естественно в современном литературном русском.
- source_word: πλοῖα πολλά
  choice: множество кораблей
  rationale: Точно передаёт πλοῖα πολλά и позволяет избежать стилистически тяжёлого повтора слова «многочисленные».
- source_word: ἐζήτησεν
  choice: замыслил
  rationale: В данном контексте ζητέω выражает намерение и целенаправленную попытку; «замыслил» естественно сочетается с δόλῳ и сохраняет литературный тон.
- source_word: κατακρατῆσαι
  choice: овладеть
  rationale: Глагол означает одолеть, получить власть или господство над чем-либо; «овладеть царством» передаёт политический смысл, не сводя его исключительно к военному захвату.
- source_word: τῆς βασιλείας Ἀλεξάνδρου
  choice: царством Александра
  rationale: Здесь βασιλεία обозначает владение или царство, а не отвлечённое царствование.
- source_word: δόλῳ
  choice: хитростью
  rationale: δόλος обозначает обманный умысел или коварный способ действия; «хитростью» сохраняет широту значения и не усиливает его до обязательного предательства.
- source_word: προσθεῖναι αὐτὴν τῇ βασιλείᾳ αὐτοῦ
  choice: присоединить его к своему царству
  rationale: «Присоединить» естественно передаёт προσθεῖναι в политическом контексте; местоимение среднего рода соотносится с русским «царство».
