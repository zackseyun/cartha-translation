  text: And Alexander heard[a], and came against him in war; and Ptolemy marched out and met him with a strong force, and routed him.
translation:
  language: ru
  text: Александр услышал об этом и пошёл на него войной. Птолемей вывел войско, встретил его во главе сильного войска и обратил в бегство.
