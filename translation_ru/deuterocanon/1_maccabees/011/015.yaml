lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал об этом
  rationale: В контексте глагол вводит реакцию Александра на предшествующие события. Дополнение «об этом» естественно по-русски и не уточняет содержание сверх контекста.
- source_word: ἦλθεν ἐπʼ αὐτὸν ἐν πολέμῳ
  choice: выступил против него войной
  rationale: Передаёт направленное враждебное движение и военный характер действий, сохраняя несколько необычную конструкцию греческого текста.
- source_word: ἐξήγαγεν
  choice: вывел войско
  rationale: Переходный глагол буквально означает «вывел»; подразумеваемое войско ясно из военного контекста и необходимо для естественной русской фразы.
- source_word: ἀπήντησεν αὐτῷ
  choice: встретил его
  rationale: Прямой и естественный эквивалент в контексте выхода навстречу противнику.
- source_word: ἐν χειρὶ ἰσχυρᾷ
  choice: с могучей силой
  rationale: Греческая идиома буквально говорит «с сильной рукой», но здесь обозначает мощь военного выступления. Русское «с могучей силой» сохраняет образ силы без неестественного буквализма.
- source_word: ἐτροπώσατο αὐτόν
  choice: обратил в бегство
  rationale: 'Точно передаёт военный смысл глагола: заставить противника повернуть назад и бежать, а не просто победить.'
