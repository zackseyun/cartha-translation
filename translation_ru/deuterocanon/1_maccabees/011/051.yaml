base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/051.yaml
  text: And they threw down their weapons and made peace. And the Jews were honored before the king and before all those in his kingdom, and they returned to Jerusalem with much plunder.
translation:
  language: ru
  text: Они бросили оружие и заключили мир. Иудеи удостоились чести перед царём и перед всеми, кто был в его царстве, и возвратились в Иерусалим с богатой добычей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρριψαν τὰ ὅπλα
  choice: бросили оружие
  rationale: Сохраняет конкретный и выразительный образ греческого глагола ῥίπτω; в контексте означает прекращение сопротивления и разоружение.
- source_word: ἐποίησαν εἰρήνην
  choice: заключили мир
  rationale: Естественная русская формула для достижения мирного соглашения; объект в соответствии с греческим текстом не добавлен.
- source_word: ἐδοξάσθησαν
  choice: удостоились чести
  rationale: В историческом контексте речь идёт о признании и общественном почёте, а не о богословском прославлении.
- source_word: ἐναντίον τοῦ βασιλέως
  choice: перед царём
  rationale: Передаёт нахождение в поле зрения и в оценке царя, сохраняя краткость оригинала.
- source_word: ἐνώπιον πάντων τῶν ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: перед всеми, кто был в его царстве
  rationale: Точно сохраняет широкий круг публичного признания, обозначенный греческой фразой.
- source_word: ἐπέστρεψαν εἰς Ἰερουσαλήμ
  choice: возвратились в Иерусалим
  rationale: Прямо и естественно передаёт возвращение к прежнему месту.
- source_word: σκῦλα πολλά
  choice: с богатой добычей
  rationale: σκῦλα обозначает военные трофеи или добычу; сочетание «богатая добыча» естественно выражает значение количества πολλά в современном литературном русском.
