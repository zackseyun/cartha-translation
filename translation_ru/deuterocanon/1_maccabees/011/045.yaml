  text: And those from the city gathered in the middle of the city[a], about one hundred twenty thousand men, and they wanted to kill the king.
translation:
  language: ru
  text: И горожане собрались в центре города — числом сто двадцать тысяч мужчин[a] — и хотели убить царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «двенадцать мириад мужчин», то есть 120 000 мужчин.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνώχθησαν
  choice: собрались
  rationale: Глагол обозначает совместное собирание; возвратная форма естественно передаёт действие самих жителей.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: жители города
  rationale: Буквально — «те, кто из города». В данном контексте «жители города» звучит естественно и не добавляет указания на пол.
- source_word: εἰς τὸ μέσον τῆς πόλεως
  choice: в центре города
  rationale: Передаёт пространственное значение выражения ясно и современно; повтор слова «город» сохранён вслед за греческим текстом.
- source_word: εἰς ἄνδρας δώδεκα μυριάδας
  choice: до ста двадцати тысяч мужчин
  rationale: Оборот с εἰς выражает достигнутое число или общую численность; δώδεκα μυριάδας буквально означает «двенадцать мириад», то есть 120 000, а ἄνδρας прямо указывает на мужчин.
- source_word: ἠβούλοντο
  choice: хотели
  rationale: Форма βούλομαι выражает желание или намерение; «хотели» не усиливает смысл до твёрдой решимости.
- source_word: ἀνελεῖν
  choice: убить
  rationale: В контексте глагол означает лишить жизни; простой современный эквивалент точнее эвфемистических или архаических вариантов.
