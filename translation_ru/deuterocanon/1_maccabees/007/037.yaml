translation:
  language: ru
  text: Ты избрал этот дом, чтобы Твоё имя было наречено над ним[a], чтобы он был домом молитвы и прошения для Твоего народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он носил Твоё имя»; возможно также: «чтобы над ним призывалось Твоё имя». Греческий текст использует библейскую формулу, выражающую принадлежность этого дома Богу и его связь с Божьим именем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελέξω
  choice: Ты избрал
  rationale: Аорист ἐκλέγω обозначает совершённое Божье избрание храма; «избрал» естественно для возвышенной молитвенной речи и сохраняет библейский оттенок выбора.
- source_word: τὸν οἶκον τοῦτον
  choice: этот дом
  rationale: Буквальное «дом» сохраняет библейское наименование храма и связь с последующим выражением «дом молитвы».
- source_word: ἐπικληθῆναι τὸ ὄνομά σου ἐπ’ αὐτόν
  choice: чтобы над ним было наречено Твоё имя
  rationale: 'Оборот близко передаёт греческую формулу и её библейский смысл: храм принадлежит Богу и находится под Его именем; при этом не устраняется возможный оттенок призывания имени.'
- source_word: εἶναι
  choice: чтобы он был
  rationale: Явно выраженное подлежащее делает продолжение целевой конструкции естественным по-русски.
- source_word: οἶκον προσευχῆς
  choice: домом молитвы
  rationale: Точное и укоренённое в библейской речи соответствие греческому генитивному обороту.
- source_word: καὶ δεήσεως
  choice: и прошения
  rationale: «Прошение» отличает настоятельную просьбу от более широкого понятия молитвы, не прибегая к архаичному «моление».
- source_word: τῷ λαῷ σου
  choice: для Твоего народа
  rationale: 'Дательный понят как дательный пользы или отношения: этот дом служит местом молитвы и прошения для Божьего народа. Возможное понимание «со стороны Твоего народа» не вносится в основной текст.'
theological_decisions:
- issue: Храмовая формула о Божьем имени
  choice: чтобы над ним было наречено Твоё имя
  alternative: чтобы он носил Твоё имя; чтобы над ним призывалось Твоё имя
  rationale: Выбранная формулировка сохраняет заветно-храмовый образ принадлежности Богу и связи с Его именем, не сводя его лишь к названию или лишь к акту призывания.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Библейские выражения «этот дом» и «дом молитвы» сохранены без излишней архаизации; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
