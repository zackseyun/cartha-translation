  text: And he himself fell first in the battle. But when his camp saw that Nicanor had fallen[a], they threw down their weapons and fled.
translation:
  language: ru
  text: И он сам первым пал в сражении. Когда же его войско[a] увидело, что Никанор пал, оно побросало оружие и бежало.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его лагерь»; греческое слово может обозначать также расположившееся лагерем войско.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσεν
  choice: пал
  rationale: Буквально передаёт греческий глагол и сохраняет обычную для военного контекста возможность подразумеваемой гибели, не делая её более явной, чем в источнике.
- source_word: αὐτὸς
  choice: он сам
  rationale: Передаёт эмфатическое местоимение, подчёркивающее, что именно Никанор пал первым.
- source_word: πρῶτος
  choice: первым
  rationale: Сохраняет прямое последовательное значение греческого слова.
- source_word: ἐν τῷ πολέμῳ
  choice: в сражении
  rationale: В данном контексте речь идёт о конкретном боевом столкновении, а не о войне в целом.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: его войско
  rationale: παρεμβολή может обозначать как лагерь, так и расположенные лагерем войска; поскольку подлежащему приписано зрение и последующее бегство людей, «войско» естественно передаёт смысл в русском тексте, а образ лагеря сохраняется в примечании как возможная альтернатива.
- source_word: ῥίψαντες τὰ ὅπλα αὐτῶν
  choice: побросали оружие
  rationale: Передаёт поспешное оставление оружия перед бегством; русское совершенное деепричастное значение естественно развёрнуто в последовательные сказуемые.
- source_word: ἔφυγον
  choice: бежали
  rationale: Стандартное и точное обозначение бегства войска с поля боя.
