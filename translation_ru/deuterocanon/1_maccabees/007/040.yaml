lexical_decisions:
- source_word: παρενέβαλεν
  choice: расположился лагерем
  rationale: Глагол обозначает устройство военного лагеря; этот вариант естественен для современного русского языка и сохраняет военный контекст.
- source_word: ἐν Ἀδασὰ
  choice: в Адасе
  rationale: Предлог ἐν указывает на место стоянки; с названием населённого пункта по-русски естественно употребить «в».
- source_word: ἐν τρισχιλίοις ἀνδράσιν
  choice: с тремя тысячами воинов
  rationale: Оборот обозначает сопровождавшее Иуду войско. «Воинов» точнее передаёт военный контекст, чем общее «мужчин» или «людей».
- source_word: προσηύξατο
  choice: помолился
  rationale: Стандартная и прямая передача аориста προσεύχομαι, естественная в повествовательном контексте.
- source_word: εἶπεν
  choice: сказал
  rationale: Обычный повествовательный глагол, вводящий следующую далее молитву.
