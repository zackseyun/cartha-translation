lexical_decisions:
- source_word: ἠγωνίσατο
  choice: боролся
  rationale: Глагол обозначает деятельное стремление и борьбу; здесь речь идёт о притязании на должность, а не обязательно о физическом столкновении.
- source_word: Ἄλκιμος
  choice: Алким
  rationale: Устоявшаяся русская форма имени персонажа в библейской традиции.
- source_word: περὶ
  choice: за
  rationale: При глаголе борьбы предлог указывает на предмет притязаний; сочетание «боролся за» естественно по-русски.
- source_word: τῆς ἀρχιερωσύνης
  choice: первосвященство
  rationale: Слово обозначает сан и должность первосвященника; «первосвященство» кратко сохраняет институциональный смысл.
