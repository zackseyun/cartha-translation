  yaml_path: translation/deuterocanon/1_maccabees/007/018.yaml
  text: And fear and dread fell upon all the people[a], for they said, “There is no truth or justice in them, for they have broken the agreement and the oath that they swore.”
translation:
  language: ru
  text: 'И страх перед ними, и ужас охватили весь народ, потому что люди говорили: «Нет в них ни правды, ни справедливости: они нарушили соглашение[a] и клятву, которую дали».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «договор»; греческое слово здесь может обозначать формально установленную договорённость; в тексте оно сопоставлено с клятвой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν … εἰς πάντα τὸν λαόν
  choice: охватили весь народ
  rationale: Греческий оборот буквально описывает страх и ужас, «павшие на» народ; «охватили» естественно передаёт внезапное распространение этих чувств по всему народу.
- source_word: αὐτῶν ὁ φόβος
  choice: страх перед ними
  rationale: Родительный αὐτῶν указывает на тех, кого народ боялся; этот смысл, отсутствующий в английском консультационном слое, сохранён по греческому источнику.
- source_word: ὁ φόβος … ὁ τρόμος
  choice: страх … ужас
  rationale: Пара сохраняет различие между общим обозначением страха и более сильным потрясением; «ужас» здесь естественнее буквального «трепет».
- source_word: ἀλήθεια καὶ κρίσις
  choice: правды, ни справедливости
  rationale: ἀλήθεια обозначает правдивость и надёжность, а κρίσις в данном нравственно-правовом контексте — справедливое отношение. Конструкция «ни… ни…» естественно передаёт отрицание обоих качеств.
- source_word: παρῆρσαν
  choice: нарушили
  rationale: По контексту глагол означает пренебречь принятыми обязательствами или преступить их; «нарушили» подходит и к соглашению, и к клятве.
- source_word: τὴν στάσιν
  choice: соглашение
  rationale: В сочетании с клятвой слово обозначает установленную договорённость или формальное соглашение, не требуя богословски более нагруженного слова «завет».
- source_word: τὸν ὅρκον ὃν ὤμοσαν
  choice: клятву, которую дали
  rationale: Передаёт явную связь существительного «клятва» с глаголом «клясться» естественным современным русским оборотом.
theological_decisions:
- issue: Следует ли переводить στάσις термином «завет»
  choice: соглашение
  alternative: завет; договор
  rationale: Контекст говорит о нарушении формальной договорённости, скреплённой клятвой, однако само στάσις не обязывает придавать ей специальный богословский смысл завета.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены парные понятия «страх и ужас» и «правда и справедливость»; добавлен явный смысл αὐτῶν — «перед ними» — непосредственно из греческого текста.
