  text: And they pursued them for a day's journey from Adasa until they came to Gazera[a], and they sounded the signal trumpets behind them.
translation:
  language: ru
  text: И они преследовали их на протяжении дневного пути — от Адасы до Газеры — и затрубили им вслед в сигнальные трубы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδίωκον
  choice: преследовали
  rationale: Имперфект изображает продолжавшееся преследование; русский несовершенный вид естественно передаёт эту длительность.
- source_word: ὁδὸν ἡμέρας μιᾶς
  choice: на расстояние дневного пути
  rationale: Оборот обозначает путь, проходимый за один день; такой перевод ясен и не утверждает, что погоня непременно длилась ровно сутки.
- source_word: ἀπὸ Ἀδασὰ
  choice: от Адасы
  rationale: Название места передано транслитерацией с нормативным русским падежным оформлением.
- source_word: ἕως τοῦ ἐλθεῖν εἰς Γαζηρά
  choice: до Газеры
  rationale: Оборот указывает конечный пункт движения; краткая русская форма точно и естественно передаёт его пространственный смысл.
- source_word: ἐσάλπισαν
  choice: трубя
  rationale: Деепричастная конструкция естественно связывает звучание труб с преследованием, не меняя состава событий.
- source_word: ὀπίσω αὐτῶν
  choice: им вслед
  rationale: В контексте бегства и погони это естественный русский эквивалент буквального «позади них», сохраняющий пространственную перспективу.
- source_word: ταῖς σάλπιγξιν τῶν σημασιῶν
  choice: в сигнальные трубы
  rationale: Родительный τῶν σημασιῶν характеризует назначение труб для подачи сигналов; выражение соответствует военному контексту и звучит естественно по-русски.
