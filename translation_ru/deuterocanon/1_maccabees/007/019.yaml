base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/019.yaml
  text: And Bacchides departed from Jerusalem and encamped at Bethzaith[a], and he sent and seized many of the men who had deserted to him, and some of the people[c][b], and slaughtered them in the great pit.
translation:
  language: ru
  text: Вакхид ушёл из Иерусалима и расположился лагерем в Вексете[a]. Он послал людей схватить многих из мужчин, перебежавших к нему, а также некоторых из народа, и заколол их в большой яме[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «Вексет» (Βηξέθ); точная форма и местонахождение этого топонима не вполне ясны.
    reason: textual_geographical_uncertainty
  - marker: b
    text: 'Или: «в большом колодце» или «в большой цистерне». Греческое φρέαρ может означать яму, колодец или цистерну; предлог буквально значит «в, внутрь». Глагол буквально означает «заколол (как жертву)», но в данном контексте обозначает насильственное убийство.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ἀπῆρεν
  choice: ушёл
  rationale: Глагол обозначает отправление из названного места; «ушёл из Иерусалима» естественно и точно передаёт движение прочь.
- source_word: παρενέβαλεν
  choice: расположился лагерем
  rationale: В военном повествовании глагол означает разбить или устроить лагерь.
- source_word: ἐν Βηξέθ
  choice: в Вифзаите
  rationale: Консервативная передача греческого топонима Βηξέθ без попытки уверенно восстановить спорную семитскую форму.
- source_word: ἀπέστειλεν καὶ συνέλαβεν
  choice: послал людей, и те схватили
  rationale: В греческом языке объект после «послал» не назван; по-русски такая формулировка естественно выражает подразумеваемых исполнителей, не приписывая Вакхиду личного захвата пленников.
- source_word: τῶν μετ’ αὐτοῦ αὐτομολησάντων ἀνδρῶν
  choice: из перебежавших к нему воинов
  rationale: αὐτομολέω обозначает переход на другую сторону, обычно в военном контексте; ἀνδρῶν здесь уместно передать как «воинов» с учётом обстановки.
- source_word: τινας τοῦ λαοῦ
  choice: некоторых из народа
  rationale: Сохраняется партитивное значение и неопределённость количества.
- source_word: ἔθυσεν
  choice: заколол
  rationale: Глагол буквально связан с закланием жертвы, но контекст описывает жестокое убийство. «Заколол» сохраняет насильственный и возможный жертвенный оттенок, не представляя действие законным богослужебным жертвоприношением.
- source_word: εἰς τὸ φρέαρ τὸ μέγα
  choice: над большим колодцем
  rationale: φρέαρ может означать колодец, водосборник или яму. При глаголе заклания εἰς допускает понимание действия над отверстием, куда стекала кровь или падали тела; это правдоподобно, но не бесспорно, поэтому неоднозначность отмечена сноской.
theological_decisions:
- issue: Жертвенная окраска глагола ἔθυσεν вне культового контекста
  choice: заколол
  alternative: принёс в жертву; убил; перебил
  rationale: Выбор сохраняет необычную лексику исходного текста и жестокость сцены, но не утверждает, что описано законное ритуальное жертвоприношение.
- issue: Связь казни с большим φρέαρ
  choice: над большим колодцем
  alternative: в большую яму; у большого колодца; в большом водосборнике
  rationale: Греческая конструкция допускает несколько пространственных толкований. Основной текст предлагает связное понимание сцены, а сноска сохраняет реальную лексическую и синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис разделён на два предложения ради ясности. Имена и реалии переданы без архаизации; жестокая и жертвенная окраска ἔθυσεν сохранена словом «заколол», а не сглажена нейтральным «убил».
