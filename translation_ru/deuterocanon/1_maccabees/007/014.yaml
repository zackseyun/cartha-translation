  yaml_path: translation/deuterocanon/1_maccabees/007/014.yaml
  text: For they said[a], “A man, a priest from the seed of Aaron, has come with the forces[b], and he will not wrong us.”
translation:
  language: ru
  text: 'Ибо они сказали: «Пришёл человек, священник из рода Аарона[a], с войсками[b], и он не поступит с нами несправедливо».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из семени Аарона»; то есть из числа потомков Аарона.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть с военными силами; возможный перевод: «с войском» или «с отрядами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπαν γάρ
  choice: Ибо они сказали
  rationale: γάρ вводит объяснение предшествующего действия, а аорист εἶπαν естественно передаётся простым прошедшим временем.
- source_word: Ἄνθρωπος ἱερεὺς
  choice: человек, священник
  rationale: 'Сохранены последовательность греческого текста и пояснительное приложение: речь идёт об отдельном мужчине, который является священником.'
- source_word: ἐκ τοῦ σπέρματος Ἀαρών
  choice: из рода Аарона
  rationale: В генеалогическом контексте σπέρμα обозначает происхождение и потомство. «Из рода Аарона» естественно для современного русского языка и сохраняет указание на священническую родословную; буквальный образ отмечен в сноске.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Аорист описывает состоявшееся прибытие; русское совершенное прошедшее время сохраняет повествовательную непосредственность прямой речи.
- source_word: ἐν ταῖς δυνάμεσιν
  choice: с войсками
  rationale: Множественное число δύναμις в данном контексте обозначает военные силы. «С войсками» передаёт и военный смысл, и форму множественного числа.
- source_word: οὐκ ἀδικήσει ἡμᾶς
  choice: он не поступит с нами несправедливо
  rationale: ἀδικέω выражает несправедливое действие против кого-либо и может включать причинение вреда. Выбранная формулировка сохраняет нравственно-правовой оттенок, не сводя смысл лишь к физическому ущербу.
theological_decisions:
- issue: Связь родословной со священнической законностью
  choice: из рода Аарона
  alternative: из семени Аарона; из потомков Аарона
  rationale: Фраза подчёркивает аароново происхождение священника как основание доверия говорящих. Перевод сохраняет эту связь, не добавляя оценки законности его притязаний от лица переводчика.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксическая конструкция «человек, священник» намеренно сохраняет заметное приложение греческого текста; лексика остаётся понятной широкому читателю.
