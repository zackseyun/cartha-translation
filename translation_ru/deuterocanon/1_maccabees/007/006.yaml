base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/006.yaml
  text: And they accused the people before the king[a], saying, “Judas and his brothers have destroyed all your friends, and have scattered us from our land.”
translation:
  language: ru
  text: 'И они обвинили народ перед царём, сказав: «Иуда и его братья уничтожили всех твоих друзей[a] и рассеяли нас, оторвав от нашей земли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сторонников»; при царском дворе слово «друзья» могло обозначать политических союзников или приближённых царя.'
    reason: Лексема φίλοι допускает как обычное значение «друзья», так и политико-придворный оттенок.
lexical_decisions:
- source_word: κατηγόρησαν τοῦ λαοῦ
  choice: обвинили народ
  rationale: Глагол κατηγορέω с родительным падежом обозначает обвинение; перевод прямо и естественно передаёт враждебное донесение царю.
- source_word: πρὸς τὸν βασιλέα
  choice: перед царём
  rationale: В контексте официального обвинения выражение передаёт направленность речи к царю и формальную обстановку разбирательства.
- source_word: Ἀπώλεσεν
  choice: уничтожили
  rationale: ἀπόλλυμι здесь означает погубить или устранить людей. Множественное число естественно согласуется в русском с составным подлежащим «Иуда и его братья», хотя греческий глагол стоит в единственном числе и выдвигает Иуду на первый план.
- source_word: οἱ φίλοι σου
  choice: твоих друзей
  rationale: Основное значение φίλοι сохранено; возможный специальный смысл царских приближённых или политических сторонников отмечен в сноске.
- source_word: ἐσκόρπισεν ἀπὸ τῆς γῆς ἡμῶν
  choice: изгнали из нашей земли
  rationale: Буквально глагол означает «рассеял», но сочетание с удалением из земли в данном военно-политическом контексте естественно передаётся как изгнание. Так сохраняется смысл насильственного вытеснения без неясной русской формулировки «рассеяли нас от земли».
theological_decisions:
- issue: Единственное число греческих глаголов при выражении «Иуда и его братья»
  choice: 'Русское множественное число: «уничтожили… изгнали»'
  alternative: 'Сохранить грамматическое выдвижение Иуды: «Иуда уничтожил… и изгнал — он и его братья»'
  rationale: В греческом Иуда представлен как ведущий деятель, однако буквальное единственное число при однородных подлежащих звучало бы по-русски ненормативно или потребовало бы добавления отсутствующих слов. Множественное число ясно передаёт совместную ответственность, не внося вероучительного толкования.
translation_notes:
  register: Современный литературный русский язык; речь краткая, обвинительная и официальная. Сохранено «царь» как естественное библейско-историческое обозначение. Основной текст избегает архаизмов и конфессионально окрашенных уточнений.
