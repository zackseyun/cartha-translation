lexical_decisions:
- source_word: κατὰ Χαρφαρασαραμά
  choice: у Харфарасарамы
  rationale: κατά с названием места в данном повествовании указывает на место сражения. Редкий и трудный топоним передан транслитерацией непосредственно по приведённому греческому тексту, без попытки исправить его по иным формам.
- source_word: ἔπεσαν
  choice: пали
  rationale: В военном контексте глагол означает гибель в бою; «пали» сохраняет краткость и достоинство греческой формулировки.
- source_word: τῶν παρὰ Νικάνορος
  choice: воинов Никанора
  rationale: Оборот обозначает людей, находившихся при Никаноре, то есть его воинов; такая передача естественна по-русски и не меняет принадлежности группы.
- source_word: ὡς πεντακισχίλιοι ἄνδρες
  choice: около пяти тысяч
  rationale: ὡς перед числительным выражает приблизительность; слово ἄνδρες по смыслу учтено в сочетании «воинов Никанора».
- source_word: ἔφυγον
  choice: уцелевшие бежали
  rationale: Греческий текст кратко меняет подразумеваемый субъект после сообщения о павших. В русском явное «уцелевшие» устраняет ложное впечатление, будто бежали павшие, не уточняя численности или состава беглецов.
- source_word: εἰς τὴν πόλιν Δαυείδ
  choice: в город Давида
  rationale: εἰς передаёт движение внутрь или по направлению к месту; «город Давида» — описательное библейское название, которое следует переводить, а не транслитерировать.
