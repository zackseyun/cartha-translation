base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/025.yaml
  text: But when Alcimus saw that Judas and those with him had grown strong[a], and realized that he was not able to withstand them, he returned to the king and brought wicked charges against them.
translation:
  language: ru
  text: Но когда Алким увидел, что Иуда и те, кто был с ним, окрепли, и понял, что не может противостоять им[a], он вернулся к царю и выдвинул против них злонамеренные обвинения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В напечатанном греческом тексте буквально: «понял, что может противостоять им». Однако ход повествования, по-видимому, предполагает смысл «не может противостоять им», принятый в переводе.'
    reason: textual_variant
lexical_decisions:
- source_word: ὡς δὲ ἴδεν
  choice: Но когда Алким увидел
  rationale: ὡς с аористом вводит временное придаточное, а δέ обозначает лёгкий повествовательный поворот; «Но когда» естественно передаёт обе функции.
- source_word: ἐνίσχυσεν
  choice: окрепли
  rationale: Глагол обозначает обретение или возрастание силы. Русское «окрепли» кратко и естественно передаёт достигнутое состояние; множественное число согласовано с составным субъектом «Иуда и его сторонники».
- source_word: οἱ μετ’ αὐτοῦ
  choice: его сторонники
  rationale: Буквально — «те, кто с ним». В данном военном и политическом контексте «сторонники» звучит естественно и не уточняет сверх текста их официальный статус.
- source_word: ἔγνω
  choice: понял
  rationale: Здесь глагол выражает осознание, вызванное увиденным; «понял» точнее передаёт повествовательную связь, чем нейтральное «знал».
- source_word: δύναται ὑποστῆναι αὐτούς
  choice: не может противостоять им
  rationale: В напечатанном греческом тексте отрицание отсутствует, однако последующее возвращение Алкима к царю указывает на невозможность противостоять Иуде. Перевод следует связному контексту, а буквальное чтение прозрачно отмечено в сноске.
- source_word: ἐπέστρεψεν πρὸς τὸν βασιλέα
  choice: вернулся к царю
  rationale: ἐπιστρέφω здесь означает возвращение или обращение назад; «вернулся к царю» ясно и идиоматично.
- source_word: κατηγόρησεν αὐτῶν πονηρά
  choice: возвёл на них злые обвинения
  rationale: κατηγορέω имеет значение «обвинять», а πονηρά даёт обвинениям нравственно отрицательную оценку. Формулировка сохраняет как обвинительный, так и оценочный оттенок.
theological_decisions:
- issue: Смысл δύναται ὑποστῆναι αὐτούς при отсутствии отрицания в напечатанном греческом тексте
  choice: 'Передать контекстуально ожидаемую невозможность: «не может противостоять им», снабдив место сноской.'
  alternative: 'Буквально по сохранившемуся тексту: «может противостоять им».'
  rationale: 'Неотрицательная форма противоречит непосредственному ходу повествования: увидев усиление Иуды, Алким отступает и обращается к царю с обвинениями. Вероятно, отрицание подразумевается или было утрачено при передаче текста. Сноска сохраняет значимую текстовую неоднозначность и не выдаёт контекстуальное решение за бесспорное чтение источника.'
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным тоном. Имена и политическая лексика переданы в традиционной библейской форме без архаизации. Значимая трудность греческого текста вынесена в сноску.
