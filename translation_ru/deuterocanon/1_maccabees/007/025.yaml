  source_fidelity: 'Основной смысл передан точно. Однако οἱ μετ’ αὐτοῦ означает нейтрально «те, кто был с ним», тогда как «его сторонники» добавляет политико-оценочный оттенок, отсутствующий в греческом. Контекстуальное «не может противостоять» допустимо лишь при явно сохраняющей текстологическую оговорку сноске: в изданном греческом тексте стоит утвердительная форма.'
