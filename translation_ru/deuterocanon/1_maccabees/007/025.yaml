    rationale: Греческое выражение обозначает «тех, кто с ним», без прямого утверждения, что это именно сторонники; такая замена сужает референцию.
  - severity: low
    issue: Сноска чрезмерно категорично формулирует контекстуальное решение
    rationale: Слова «контекст ясно указывает» и отсутствие оговорки о характере решения могут создать впечатление, будто отрицание содержится в источнике. Следует обозначить, что перевод следует контекстуально вероятному смыслу, в то время как напечатанный текст читает «может».
