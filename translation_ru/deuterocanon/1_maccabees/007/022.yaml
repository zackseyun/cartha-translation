  - severity: medium
    issue: γῆν Ἰούδα передано как «землю Иуды».
    rationale: В этом контексте речь идёт о территории Иудеи; форма «земля Иуды» по-русски может быть понята как личное владение человека по имени Иуда.
  - severity: low
    issue: «Возмущал их народ» недостаточно точно передаёт ταράσσοντες.
    rationale: Русское «возмущать» обычно означает вызывать негодование, тогда как греческий глагол здесь обозначает внесение беспорядка, смуты или тревоги.
