lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτόν
  choice: собрались к нему
  rationale: Передаёт направленное присоединение к нему без излишнего уточнения о формальном вступлении в его ряды.
- source_word: πάντες οἱ ταράσσοντες
  choice: все, кто возмущал
  rationale: Сохраняет глагольную силу причастия ταράσσοντες — причинять смуту, волнение, беспорядок — и избегает оценочного существительного «смутьяны».
- source_word: τὸν λαὸν αὐτῶν
  choice: их народ
  rationale: Явно передаёт присутствующее в греческом притяжательное αὐτῶν; λαός естественно переводится как «народ».
- source_word: κατεκράτησαν
  choice: захватили
  rationale: В сочетании с территориальным объектом выражает установление власти и контроля; краткое русское слово не предполагает законного или вечного владения.
- source_word: γῆν Ἰούδα
  choice: землю Иуды
  rationale: Сохраняет конкретное территориальное значение γῆ и форму имени Иуда, характерную для обозначения области в 1 Маккавейской.
- source_word: ἐποίησαν πληγὴν μεγάλην
  choice: нанесли тяжёлый удар
  rationale: Естественно передаёт греческую идиому и сохраняет образ удара, не сужая значение до одной лишь резни или эпидемии.
- source_word: ἐν Ἰσραήλ
  choice: Израилю
  rationale: В русском выражение «нанести Израилю удар» естественно обозначает пострадавший народ, хотя греческое ἐν допускает также значение «в Израиле» или «среди Израиля»; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Кого или что обозначает ἐν Ἰσραήλ
  choice: Израилю
  alternative: в Израиле; среди Израиля
  rationale: Контекст говорит о вреде, причинённом народу Израиля, однако форма с ἐν буквально обозначает сферу или среду действия и не обязана быть только географической. Основной текст выбран ради естественного русского синтаксиса, а исходная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сохраняет последовательность греческих предложений с повтором союза «и», а лексика остаётся понятной обычному читателю.
