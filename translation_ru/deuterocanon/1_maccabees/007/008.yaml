  text: And the king chose Bacchides[a], one of the king’s Friends, governor of the region beyond the River, and great in the kingdom, and faithful to the king[b],
translation:
  language: ru
  text: И царь избрал Вакхида, одного из Друзей царя[a], правившего областью по ту сторону Реки[b], занимавшего высокое положение в царстве и верного царю,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Друзья царя» — вероятно, официальный придворный ранг или признанный круг царских советников и приближённых в эллинистическом государстве, а не просто личные друзья царя.
    reason: cultural_note
  - marker: b
    text: '«По ту сторону Реки» — территориальное обозначение, вероятно относящееся к землям к западу от Евфрата в системе имперского управления; возможно и более буквальное понимание: «за Рекой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: избрал
  rationale: Передаёт прямое значение «выбрал, отобрал» и сохраняет торжественный повествовательный регистр, не добавляя более узкого смысла официального назначения.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: одного из Друзей царя
  rationale: Родительный имеет разделительное значение. Написание «Друзей» с прописной буквы указывает на вероятный придворный статус, а не только на личную дружбу; пояснение вынесено в сноску.
- source_word: κυριεύοντα
  choice: правившего
  rationale: Причастие обозначает осуществление власти. «Правившего» естественно по-русски и не превращает описание в прямо названную в греческом тексте должность губернатора.
- source_word: ἐν τῷ πέραν τοῦ ποταμοῦ
  choice: областью по ту сторону Реки
  rationale: Передаёт территориальное значение выражения понятным современным языком. Слово «областью» восполняет подразумеваемую административную территорию, а «Реки» сохраняет форму известного географического обозначения.
- source_word: μέγαν ἐν τῇ βασιλείᾳ
  choice: занимавшего высокое положение в царстве
  rationale: В данном политическом контексте μέγαν указывает на высокий статус и влияние, а не на физическую величину; русский оборот передаёт этот смысл естественно.
- source_word: πιστὸν τῷ βασιλεῖ
  choice: верного царю
  rationale: Сохраняет смысл личной и политической верности, не сужая πιστός только до административной лояльности.
