  text: And an assembly of scribes gathered to Alcimus and Bacchides to seek justice[a].
translation:
  language: ru
  text: И собрались к Алкиму и Вакхиду книжники, чтобы искать справедливости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искать того, что справедливо». Греческое слово может иметь как нравственный, так и правовой смысл.'
    reason: Лексическая неоднозначность δίκαια.
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: собрались
  rationale: Аористальная форма описывает совместное собирание группы; возвратный глагол естественен по-русски и не навязывает внешнего организатора.
- source_word: πρὸς
  choice: к
  rationale: После глагола движения и собирания предлог указывает направление к Алкиму и Вакхиду, возможно также последующее присоединение к ним.
- source_word: συναγωγὴ γραμματέων
  choice: книжники
  rationale: Конструкция буквально означает «собрание книжников», но русский глагол во множественном числе позволяет естественно передать собравшуюся группу без тяжеловесного повтора «собралось собрание».
- source_word: ἐκζητῆσαι
  choice: чтобы искать
  rationale: Инфинитив цели передан придаточным цели; «искать» сохраняет открытость исходного выражения.
- source_word: δίκαια
  choice: справедливости
  rationale: Субстантивированное среднее множественного числа охватывает справедливое, правое и законное; «справедливости» естественно передаёт нравственно-правовой диапазон, не сужая его до конкретных условий соглашения.
- source_word: Ἄλκιμον
  choice: Алкиму
  rationale: Традиционная русская передача имени с требуемым дательным падежом.
- source_word: Βακχίδην
  choice: Вакхиду
  rationale: Традиционная русская библейская передача имени с требуемым дательным падежом.
theological_decisions:
- issue: Значение δίκαια в политически напряжённом контексте
  choice: искать справедливости
  alternative: искать того, что справедливо; добиваться правды; искать справедливых условий
  rationale: Греческий текст не уточняет, идёт ли речь о правосудии, нравственной правоте или справедливых условиях. Выбранная формулировка сохраняет этот нравственно-правовой диапазон и не приписывает книжникам более узкой цели.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Книжники» сохраняет историко-религиозный термин; синтаксис упрощён без потери коллективного значения συναγωγή.
