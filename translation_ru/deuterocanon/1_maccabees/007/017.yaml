lexical_decisions:
- source_word: Σάρκας
  choice: плоть
  rationale: Передаёт конкретный и резкий образ греческого слова, не смягчая его до «тела» или «останки».
- source_word: ὁσίων σου
  choice: святых Твоих
  rationale: Сохраняет значение посвящённости Богу и обращение к Нему, не вводя более узкого позднейшего представления о канонизированных святых.
- source_word: ἐξέχεαν
  choice: пролили
  rationale: Глагол означает «выливать, изливать, проливать». «Пролили» естественно сочетается с кровью, но намеренно сохраняет необычное общее управление словами «плоть» и «кровь».
- source_word: κύκλῳ Ἱερουσαλήμ
  choice: вокруг Иерусалима
  rationale: Прямо и естественно передаёт пространственное значение κύκλῳ.
- source_word: οὐκ ἦν αὐτοῖς ὁ θάπτων
  choice: некому было похоронить их
  rationale: Современная русская идиома ясно передаёт отсутствие человека, который совершил бы погребение.
theological_decisions:
- issue: Передача ὁσίων в молитвенном плаче, перекликающемся с Псалмом
  choice: святых
  alternative: верных; благочестивых; угодников
  rationale: «Святых» сохраняет сакральный и заветный оттенок слова, не сужая его значения до нравственной характеристики и не устраняя возможную библейскую многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского плача. Необычное сочетание «плоть… и кровь… пролили» сохранено как намеренно резкий образ исходного греческого текста; буквальная особенность пояснена в сноске.
