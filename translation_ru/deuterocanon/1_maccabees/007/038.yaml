  source_fidelity: Русский текст точно передаёт греческий оригинал. «Соверши возмездие над…» адекватно передаёт ποίησον ἐκδίκησιν ἐν; «лагерь» соответствует παρεμβολή; множественное «пусть они падут» естественно охватывает человека и его лагерь. «От меча» верно передаёт ἐν ῥομφαίᾳ. «Не дай им уцелеть» является допустимой контекстуальной передачей μὴ δῷς αὐτοῖς μονήν, а сноска честно сохраняет лексическую неоднозначность.
