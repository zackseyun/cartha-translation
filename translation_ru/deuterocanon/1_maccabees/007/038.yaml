base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/038.yaml
  text: Take vengeance on this man and on his camp[a], and let them fall by the sword. Remember their blasphemies[b], and grant them no survival.
translation:
  language: ru
  text: Соверши возмездие над этим человеком и над его лагерем, и пусть они падут от меча. Вспомни их богохульства[a] и не дай им уцелеть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оскорбления», «злословие». Греческое слово может обозначать оскорбительную речь вообще, но в этой молитве вероятен более религиозно окрашенный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не дай им пребывания». Возможны также значения: «не дай им пристанища» или «не дай им передышки»; в данном контексте речь, вероятно, о том, чтобы враги не уцелели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον ἐκδίκησιν
  choice: Соверши возмездие
  rationale: Передаёт прямую просьбу о карающем Божьем воздаянии и сохраняет силу греческого оборота, не ослабляя его до общего понятия справедливости.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ καὶ ἐν τῇ παρεμβολῇ αὐτοῦ
  choice: над этим человеком и над его лагерем
  rationale: При ἐκδίκησις предлог ἐν указывает здесь на тех, над кем совершается возмездие; παρεμβολή в военном контексте означает лагерь.
- source_word: πεσάτωσαν ἐν ῥομφαίᾳ
  choice: пусть они падут от меча
  rationale: Молитвенно-повелительная форма πεσάτωσαν передана конструкцией «пусть… падут», а ἐν ῥομφαίᾳ — устойчивым русским выражением о гибели от оружия.
- source_word: μνήσθητι
  choice: Вспомни
  rationale: Сохраняет форму обращения к Богу с просьбой принять злодеяния во внимание для суда.
- source_word: δυσφημιῶν
  choice: богохульства
  rationale: В контексте молитвы и священного конфликта слово, способное обозначать злую или оскорбительную речь вообще, вероятнее всего имеет религиозно окрашенный смысл; более широкое значение отмечено в сноске.
- source_word: μὴ δῷς αὐτοῖς μονήν
  choice: не дай им уцелеть
  rationale: В контексте просьбы о поражении врагов μονή обозначает возможность остаться, продолжить существование или найти устойчивое пребывание. Контекстуальное «уцелеть» естественно по-русски, а буквальная неоднозначность сохранена в сноске.
theological_decisions:
- issue: Смысл δυσφημιῶν в молитве о возмездии
  choice: богохульства
  alternative: оскорбления; злословие; клевета
  rationale: Религиозный контекст позволяет сохранить направленность враждебной речи против Бога и святыни, не сводя проступок к межличностному оскорблению; широкий лексический диапазон указан читателю.
- issue: Смысл просьбы μὴ δῷς αὐτοῖς μονήν
  choice: не дай им уцелеть
  alternative: не дай им пристанища; не дай им передышки; не дай им остаться
  rationale: Контекст допускает понимание как просьбы не оставить врагам возможности сохраниться после суда, однако существительное μονή само по себе может обозначать пребывание, место пребывания или возможность задержаться. Сноска не позволяет превратить контекстуальный выбор в единственно возможное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Формы «возмездие», «падут от меча» и «богохульства» сохраняют высокий библейский регистр, оставаясь понятными современному читателю; лексическая неоднозначность отмечена сносками.
