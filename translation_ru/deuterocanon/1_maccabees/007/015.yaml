lexical_decisions:
- source_word: ἐλάλησεν μετʼ αὐτῶν
  choice: говорил с ними
  rationale: Передаёт значение μετά с родительным («с») и естественно звучит в современном русском повествовании.
- source_word: εἰρηνικοὺς λόγους
  choice: миролюбиво
  rationale: Естественная русская передача буквального «мирные слова»; выражает примирительный характер речи, не утверждая искренности говорящего.
- source_word: ὤμοσεν αὐτοῖς
  choice: поклялся им
  rationale: Точно и кратко передаёт аорист ὄμνυμι и адресата клятвы.
- source_word: Οὐκ ἐκζητήσομεν
  choice: Мы не причиним
  rationale: В сочетании с κακόν глагол означает намерение предпринимать или замышлять зло; по-русски отрицательное обещание естественно выражается как «не причиним».
- source_word: ὑμῖν κακὸν
  choice: зла вам
  rationale: Сохраняет широкое значение κακόν — «зло, вред, беда» — не сужая его только до телесного ущерба.
- source_word: τοῖς φίλοις ὑμῶν
  choice: вашим друзьям
  rationale: Передаёт обычное значение φίλοι без неоправданного сужения до политических союзников.
