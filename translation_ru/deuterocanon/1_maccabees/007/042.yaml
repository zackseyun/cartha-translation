base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/042.yaml
  text: So crush this camp before us today[a], and let the rest know that he has spoken wickedly against your holy things; judge him according to his wickedness.
translation:
  language: ru
  text: Так сокруши сегодня перед нами этот стан, и пусть остальные узнают, что он нечестиво говорил против Твоих святынь[a]. Суди его по его нечестию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против Твоего святилища». Греческий текст буквально говорит о «Твоих святынях» во множественном числе; это выражение может охватывать всё посвящённое Богу, включая святилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντριψον
  choice: сокруши
  rationale: Аористный императив выражает призыв к решительному уничтожению; «сокруши» естественно звучит в торжественной молитве и подходит для военного поражения.
- source_word: παρεμβολὴν
  choice: стан
  rationale: В данном военном контексте слово обозначает лагерь или стан; «стан» кратко, ясно и сохраняет возвышенный регистр.
- source_word: ἐνώπιον ἡμῶν
  choice: перед нами
  rationale: Прямо передаёт пространственное и событийное значение «в нашем присутствии, на наших глазах».
- source_word: οἱ ἐπίλοιποι
  choice: остальные
  rationale: Сохраняет широту греческого выражения «оставшиеся», не уточняя без достаточного основания, что речь именно об уцелевших.
- source_word: κακῶς ἐλάλησεν
  choice: нечестиво говорил
  rationale: Передаёт нравственно-религиозную порочность речи, а не просто неудачную или грубую манеру говорить.
- source_word: ἐπὶ τὰ ἅγιά σου
  choice: против Твоих святынь
  rationale: 'Множественное число «святыни» сохраняет неоднозначность: это могут быть священные предметы, места или всё посвящённое Богу.'
- source_word: κρῖνον αὐτὸν
  choice: Суди его
  rationale: Сохраняет основное судебное значение κρίνω и не усиливает его заранее до «осуди».
- source_word: κατὰ τὴν κακίαν αὐτοῦ
  choice: по его нечестию
  rationale: Формально и естественно передаёт просьбу о суде, соответствующем его нравственному злу.
theological_decisions:
- issue: Единственное число αὐτόν после коллективного упоминания стана
  choice: 'Сохранено единственное число: «он / его»'
  alternative: Передать собирательно, относя обвинение ко всему вражескому войску или прямо назвать его предводителя
  rationale: Греческий текст переходит от коллективного «этот стан» к одному виновнику речи. Сохранение единственного числа не устраняет грамматическое напряжение и не вводит не названного в стихе референта.
- issue: Объём значения τὰ ἅγιά σου
  choice: «Твои святыни»
  alternative: «Твоё святилище»
  rationale: Множественное число может обозначать священные предметы и места в целом либо святилище как священную область. Основной текст сохраняет более широкую форму, а возможное узкое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного и судебного контекста. Формы «Твоих» и повелительные глаголы поддерживают прямое обращение к Богу; синтаксис остаётся ясным для широкого читателя.
