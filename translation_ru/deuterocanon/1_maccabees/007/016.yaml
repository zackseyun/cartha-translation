  yaml_path: translation/deuterocanon/1_maccabees/007/016.yaml
  text: 'And they trusted him[a], and he seized sixty men from among them and killed them in one day, according to the words that he wrote:'
translation:
  language: ru
  text: 'И они доверились ему. Из их числа схватили[a] шестьдесят мужчин, и он убил их за один день, согласно словам, которые он написал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «схватили… и он убил» — сначала стоит глагол во множественном числе, а затем в единственном.'
    reason: Сохранение грамматической неоднозначности исходного текста и возможного различия между исполнителями захвата и главным действующим лицом.
lexical_decisions:
- source_word: ἐνεπίστευσαν
  choice: доверились
  rationale: Глагол обозначает оказанное кому-либо доверие; «доверились» естественно для повествования и не придаёт выражению специального богословского смысла.
- source_word: συνέλαβον
  choice: схватили
  rationale: Сохранено множественное число греческой формы и её значение насильственного захвата; безлично-неопределённая для русского контекста конструкция не добавляет отсутствующего в тексте субъекта.
- source_word: ἐξ αὐτῶν
  choice: из их числа
  rationale: 'Передаёт партитивный смысл: шестьдесят человек были выбраны из более многочисленной группы.'
- source_word: ἑξήκοντα ἄνδρας
  choice: шестьдесят человек
  rationale: В данном контексте ἄνδρας обозначает взрослых мужчин, но по-русски при числительном нейтральное «человек» звучит естественно и точно.
- source_word: ἀπέκτεινεν
  choice: он убил
  rationale: Сохранены единственное число и прямое значение глагола; текст не обозначает судебной процедуры, поэтому «казнил» было бы излишним уточнением.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: за один день
  rationale: Передаёт совершение всего действия в пределах одного дня и естественно звучит по-русски.
- source_word: κατὰ τοὺς λόγους
  choice: согласно словам
  rationale: Сохраняет формальную связь последующего события с письменным изречением, цитируемым далее.
- source_word: οὓς ἔγραφεν
  choice: которые он написал
  rationale: Сохранены активная форма, мужской субъект в единственном числе и предваряющая цитату некоторая резкость греческой конструкции; не уточняется, кто именно подразумевается под «он».
theological_decisions:
- issue: Смена числа повествовательного субъекта между συνέλαβον и ἀπέκτεινεν
  choice: 'Сохранить: «схватили… и он убил»'
  alternative: 'Сгладить до единственного числа: «он схватил… и убил»'
  rationale: Греческий свидетель явно переходит от множественного числа к единственному. Сохранение этой смены не решает за читателя, действовал ли предводитель лично, через своих людей или совместно с ними; особенность пояснена в сноске.
- issue: Неопределённость субъекта в οὓς ἔγραφεν
  choice: Сохранить формулировку «которые он написал» без уточнения личности
  alternative: 'Передать безлично: «как написано»'
  rationale: Активная форма единственного числа присутствует в греческом тексте и, вероятно, относится к автору последующей цитаты, однако сам стих прямо его не называет.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены лаконичность, жестокая прямота рассказа и обрыв перед последующей цитатой; архаизмы и конфессионально окрашенные уточнения не вводились.
