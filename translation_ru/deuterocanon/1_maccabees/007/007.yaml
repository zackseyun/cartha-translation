  yaml_path: translation/deuterocanon/1_maccabees/007/007.yaml
  text: Now then, send a man whom you trust, and let him go and see all the destruction that he has done to us and to the king’s land, and let him punish them and all who are helping them.
translation:
  language: ru
  text: Итак, пошли человека, которому доверяешь; пусть он пойдёт и увидит всё разорение, которое тот причинил нам и земле царя, и пусть накажет их и всех, кто приходит им на помощь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστειλον
  choice: пошли
  rationale: Прямой повелительный глагол; «пошли» естественно и точно передаёт приказ.
- source_word: ἄνδρα ᾧ πιστεύεις
  choice: человека, которому доверяешь
  rationale: Сохраняет относительное придаточное и подчёркивает личное доверие адресата, а не только общую надёжность посланника.
- source_word: πορευθεὶς ἰδέτω
  choice: пусть он пойдёт и увидит
  rationale: Причастие, связанное с императивом, естественно передано последовательностью двух действий без добавочного оттенка официальной проверки.
- source_word: τὴν ἐξολέθρευσιν ἅπασαν
  choice: всё разорение
  rationale: «Разорение» охватывает причинённое опустошение, а «всё» сохраняет усиление ἅπασαν.
- source_word: ἣν ἐποίησεν
  choice: которое тот причинил
  rationale: В русском сочетание «причинил разорение» естественнее буквального «сделал»; указательное «тот» ясно отсылает к ранее названному противнику.
- source_word: τῇ χώρᾳ τοῦ βασιλέως
  choice: земле царя
  rationale: Сохраняет конкретное значение χώρα как земли или области и избегает современного государственно-политического оттенка слова «страна».
- source_word: κολάσατο
  choice: пусть накажет
  rationale: Нейтрально передаёт требование карательного действия, не усиливая его до мести.
- source_word: τοὺς ἐπιβοηθοῦντας αὐτοῖς
  choice: всех, кто приходит им на помощь
  rationale: Передаёт деятельный оттенок причастия и идею оказания помощи, не сужая её непременно до военной поддержки.
