lexical_decisions:
- source_word: ἦλθεν πρὸς Ἰούδαν
  choice: пришёл к Иуде
  rationale: Оборот с πρός обозначает движение к человеку. «Пришёл к Иуде» естественно передаёт повествовательное действие, не добавляя мотивов.
- source_word: ἠσπάσαντο ἀλλήλους
  choice: приветствовали друг друга
  rationale: ἀσπάζομαι обычно означает приветствовать. Возможное объятие не выражено глаголом однозначно, поэтому нейтральный перевод точнее сохраняет смысл.
- source_word: εἰρηνικῶς
  choice: мирно
  rationale: Наречие описывает внешне мирный характер встречи и сохраняет иронический контраст с готовившимся захватом.
- source_word: οἱ πολέμιοι
  choice: враги
  rationale: Субстантивированное πολέμιοι обозначает определённую, понятную из контекста группу противников.
- source_word: ἕτοιμοι ἐξαρπάσαι
  choice: были готовы схватить
  rationale: ἐξαρπάζω может обозначать внезапное или насильственное схватывание. «Схватить» ясно передаёт замысел врагов, а дополнительный оттенок отмечен в сноске.
