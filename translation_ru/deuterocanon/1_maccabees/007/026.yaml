base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/026.yaml
  text: And the king sent Nikanor[a], one of his honored rulers, who hated and was hostile to Israel[b], and commanded him to destroy the people.
translation:
  language: ru
  text: И царь послал Никанора, одного из своих именитых сановников[a], который ненавидел Израиль и враждовал с ним, и приказал ему истребить народ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одного из своих прославленных правителей»; также возможно: «одного из своих знатных должностных лиц».'
    reason: Лексическая альтернатива для ἀρχόντων… τῶν ἐνδόξων.
  - marker: b
    text: 'Или: «искоренить народ» либо «уничтожить народ».'
    reason: Лексическая альтернатива для ἐξᾶραι τὸν λαόν.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный глагол со значением отправления человека с поручением; «послал» естественно и точно передаёт его здесь.
- source_word: ὁ Βασιλεὺς
  choice: царь
  rationale: В контексте это титул правящего монарха, а не божественное наименование.
- source_word: Νικάνορα
  choice: Никанора
  rationale: Традиционная и непосредственно соответствующая греческому написанию русская передача имени.
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ τῶν ἐνδόξων
  choice: одного из своих именитых сановников
  rationale: ἄρχων обозначает высокопоставленного правителя или должностное лицо, а ἔνδοξος — именитого, почитаемого, прославленного. «Сановник» естественно передаёт придворно-государственный статус без излишнего уточнения должности.
- source_word: μισοῦντα καὶ ἐχθραίνοντα τῷ Ἰσραήλ
  choice: который ненавидел Израиль и враждовал с ним
  rationale: 'Относительное предложение естественно передаёт два причастия и сохраняет усиление: личную ненависть и деятельную вражду.'
- source_word: ἐνετείλατο αὐτῷ
  choice: приказал ему
  rationale: Передаёт властный характер распоряжения и явно сохраняет адресата приказа.
- source_word: ἐξᾶραι τὸν λαόν
  choice: истребить народ
  rationale: В данном военно-политическом контексте ἐξαίρω означает устранить или искоренить; «истребить» ясно передаёт разрушительную силу приказа, не сводя его к переселению.
theological_decisions:
- issue: Степень силы выражения ἐξᾶραι τὸν λαόν
  choice: истребить народ
  alternative: устранить народ; искоренить народ; уничтожить народ
  rationale: Контекст враждебного царского приказа требует сильного значения, однако сам греческий глагол допускает оттенки удаления и искоренения. Основной текст передаёт угрозу уничтожения, а примечание сохраняет лексическую широту.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для русского: греческие причастия переданы определительным придаточным. Термин «сановник» сохраняет высокий государственный статус, не приписывая Никанору конкретной должности.'
