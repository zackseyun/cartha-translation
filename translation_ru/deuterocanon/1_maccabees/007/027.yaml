  text: And Nikanor came to Jerusalem with a large force, and he sent to Judas and his brothers deceitfully with peaceful words, saying,
translation:
  language: ru
  text: 'Никанор пришёл в Иерусалим с большим войском и отправил к Иуде и его братьям посланцев с притворно мирными словами, говоря:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυνάμει πολλῇ
  choice: с большим войском
  rationale: В данном военном контексте δύναμις обозначает вооружённую силу, то есть войско, а не отвлечённую «силу».
- source_word: ἀπέστειλεν πρὸς Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ
  choice: отправил к Иуде и его братьям посланцев
  rationale: У ἀποστέλλω объект может подразумеваться; по-русски добавление «посланцев» естественно выражает акт отправки к адресатам, не меняя содержания.
- source_word: μετὰ δόλου λόγους εἰρηνικούς
  choice: с притворно мирными словами
  rationale: Передаёт сочетание внешне мирного содержания речи с обманным намерением; «притворно» относится к миролюбивому характеру слов, не утверждая, что сами слова непременно были ложны в каждой детали.
- source_word: λέγων
  choice: говоря
  rationale: Сохраняет ввод прямой речи и синтаксическую незавершённость стиха, продолжающуюся в следующем стихе.
