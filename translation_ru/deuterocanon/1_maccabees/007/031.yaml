lexical_decisions:
- source_word: ἔγνω
  choice: узнал
  rationale: Аорист γινώσκω обозначает здесь получение нового знания, а не простое пребывание в состоянии знания; «узнал» естественно передаёт этот смысл.
- source_word: ἀπεκαλύφθη
  choice: раскрыт
  rationale: Пассивная форма указывает, что замысел стал известен. «Раскрыт» сохраняет пассивный смысл и не вносит ненужного религиозного оттенка слова «откровение».
- source_word: ἡ βουλὴ αὐτοῦ
  choice: его замысел
  rationale: В военно-политическом контексте βουλή означает намерение или план. «Замысел» звучит естественно и не придаёт выражению чрезмерно отрицательной окраски.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Прямое соответствие глаголу со значением выхода; военный оттенок оставлен контексту, поскольку сам глагол не требует перевода «выступил».
- source_word: εἰς συνάντησιν
  choice: навстречу
  rationale: Выражение обозначает движение для встречи или столкновения. «Вышел навстречу» кратко и естественно сохраняет неопределённость относительно характера встречи.
- source_word: τῷ Ἰούδα
  choice: Иуде
  rationale: Передача греческого личного имени Ἰούδας традиционной русской библейской формой «Иуда»; дательный падеж обусловлен конструкцией συνάντησιν с лицом, которому выходят навстречу.
