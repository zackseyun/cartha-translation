    reason: alternative_reading
  - marker: b
    text: 'В греческом тексте буквально стоит сжатое и несколько неясное: «эти повернули против этих»; к каким именно группам относятся местоимения, определяется только из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: вышли они
  rationale: Передаёт обычный повествовательный глагол движения и сохраняет не названный прямо субъект греческого текста.
- source_word: κωμῶν
  choice: селений
  rationale: κώμη обозначает небольшое неукреплённое поселение; «селение» естественно в русском историческом повествовании и не сужает значение до совсем малой деревни.
- source_word: κυκλόθεν
  choice: расположенных вокруг
  rationale: Наречие указывает на окружавшую местность; формулировка связывает его с выходом людей из окрестных селений, не превращая само слово в отдельный военный манёвр.
- source_word: ὑπερεφέρων αὐτούς
  choice: обошли их с флангов
  rationale: Редкая и контекстуально трудная форма, вероятно, описывает достигнутое в бою позиционное преимущество. Перевод согласуется с движением со всех сторон, но возможные более общие значения отмечены в сноске.
- source_word: ἀνέστρεφον
  choice: повернули
  rationale: Сохраняет основное пространственное значение глагола, не уточняя без достаточных оснований, было ли это отступлением, разворотом или возвращением в бой.
- source_word: οὗτοι πρὸς τούτους
  choice: Те же повернули против них
  rationale: Сохраняет контраст между двумя группами и намеренную неуточнённость сжатой греческой местоименной конструкции.
- source_word: ἔπεσαν πάντες ῥομφαίᾳ
  choice: все пали от меча
  rationale: Естественная русская формула военного повествования, близкая к греческой конструкции.
- source_word: οὐ κατελείφθη ἐξ αὐτῶν οὐδὲ εἷς
  choice: из них не осталось ни одного
  rationale: Передаёт усиленное отрицание и подчёркивает полное уничтожение отряда.
