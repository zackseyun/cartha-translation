  source_fidelity: 'Основной ход повествования передан верно: жители Иудеи выходят из окрестных селений, получают тактическое преимущество над противниками, затем следует намеренно неясное местоименное описание разворота, гибель всех и подчёркнутое отсутствие уцелевших. Однако «селений Иудеи, расположенных вокруг» не вполне точно выражает κυκλόθεν: речь естественнее понимать как выход «из всех окрестных селений Иудеи», а не как характеристику селений, расположенных вокруг без названного центра.'
