base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/033.yaml
  text: And after these words Nikanor went up to Mount Zion, and some of the priests came out from the sanctuary, and some of the elders of the people, to greet him peaceably and to show him the burnt offering that was being offered for the king.
translation:
  language: ru
  text: После этих слов Никанор поднялся на гору Сион. Некоторые из священников вышли из святилища[a], и некоторые из старейшин народа[b] вышли, чтобы мирно приветствовать его и показать ему всесожжение, приносившееся за царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из святого места». Греческое выражение может более конкретно обозначать святилище или священную храмовую территорию.'
    reason: lexical_alternative
  - marker: b
    text: 'Повторённый предлог «из» здесь, вероятно, имеет разделительное значение: вышли представители священников и старейшин, а не обязательно все они.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: поднялся
  rationale: Передаёт движение вверх к горе Сион и сохраняет обычную для библейского повествования пространственную ориентацию.
- source_word: τὸ ὄρος Σιών
  choice: гора Сион
  rationale: Традиционное и понятное русское обозначение места; соответствует греческой конструкции.
- source_word: ἐξῆλθαν
  choice: вышли навстречу ему
  rationale: Глагол означает выход из некоторого места; добавление «навстречу ему» естественно связывает движение с последующей целью приветствовать Никанора, не меняя смысла.
- source_word: ἀπὸ τῶν ἱερέων ... καὶ ἀπὸ τῶν πρεσβυτέρων τοῦ λαοῦ
  choice: некоторые из священников ... и некоторые из старейшин народа
  rationale: 'Повторённое ἀπό здесь вероятнее всего имеет партитивный смысл: вышли представители обеих групп, а не обязательно все их члены.'
- source_word: ἐκ τῶν ἁγίων
  choice: из святилища
  rationale: Множественное τὰ ἅγια в данном храмовом контексте естественно обозначает священное место или храмовое святилище; буквальная альтернатива отмечена в сноске.
- source_word: ἀσπάσασθαι αὐτὸν εἰρηνικῶς
  choice: чтобы мирно приветствовать его
  rationale: Передаёт действие приветствия и мирный характер или намерение встречи, не усиливая его до сердечного приёма.
- source_word: δεῖξαι αὐτῷ
  choice: показать ему
  rationale: Прямой и естественный эквивалент инфинитива цели.
- source_word: τὴν ὁλοκαύτωσιν
  choice: всесожжение
  rationale: Устоявшийся русский библейский термин для жертвы, сжигаемой целиком.
- source_word: τὴν προσφερομένην
  choice: приносившееся
  rationale: Причастная форма сохраняет значение продолжающегося или совершаемого в то время жертвоприношения.
- source_word: ὑπὲρ τοῦ βασιλέως
  choice: за царя
  rationale: Естественное русское выражение для жертвы, совершаемой в пользу царя или от его имени; исходная конструкция не уточняет точнее характер отношения.
