lexical_decisions:
- source_word: ἐγνώσθη αὐτῷ
  choice: стало ему известно
  rationale: 'Аорист пассивного залога передаёт наступившее состояние: дело дошло до его сведения. Эта формулировка сохраняет пассивный оттенок и дательный αὐτῷ.'
- source_word: τὸ πρᾶγμα
  choice: это дело
  rationale: πρᾶγμα обозначает дело, обстоятельство или происшествие; «это дело» естественно отсылает к описанной ранее ситуации, не сужая смысла.
- source_word: Μή μοι δείξητε
  choice: Не показывайте мне
  rationale: μή с императивом выражает запрет, а δείκνυμι буквально означает «показывать». Прямая формулировка сохраняет силу приказа.
- source_word: τὰ πρόσωπα αὐτῶν
  choice: их лиц
  rationale: Буквально — «их лица». Родительный падеж после отрицания нормативен и естественен в русском; конкретный образ сохранён, а его контекстуальный смысл пояснён в сноске.
