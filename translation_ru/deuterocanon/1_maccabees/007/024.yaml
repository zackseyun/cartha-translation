lexical_decisions:
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Прямо передаёт повествовательный аорист ἐξέρχομαι и сохраняет образ движения без архаизации.
- source_word: πάντα τὰ ὅρια τῆς Ἰουδαίας
  choice: ко всем пределам Иудеи
  rationale: ὅρια допускает значения «границы», «пределы» и «области». «Пределы» сохраняет географический размах исходного выражения и естественно сочетается с движением.
- source_word: κυκλόθεν
  choice: в её окрестности
  rationale: Наречие расширяет охват за пределы собственно Иудеи; существительное «окрестности» естественно передаёт этот смысл по-русски.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: расправился
  rationale: Греческий оборот буквально означает совершение возмездия. «Распра́вился» ясно передаёт карательное действие, не придавая ему непременно личного мотива мести.
- source_word: ἐν τοῖς ἀνδράσιν
  choice: с теми людьми
  rationale: При ἐκδίκησιν предлог обозначает лиц, на которых направлено возмездие. «Людьми» здесь естественнее буквального «мужами»; указательное «теми» передаёт определённый артикль, не уточняя их принадлежность.
- source_word: τοῖς αὐτομολήσασιν
  choice: с перебежчиками
  rationale: Причастие αὐτομολέω обозначает тех, кто самовольно перешёл на другую сторону. «Перебежчики» точно и кратко передаёт военный и политический оттенок.
- source_word: ἐνεστάλησαν
  choice: им не давали
  rationale: Передаёт пассивное значение удерживания или воспрепятствования и оставляет действующее лицо неназванным, как в греческом тексте.
- source_word: τοῦ πορεύεσθαι εἰς χώραν
  choice: ходить в страну
  rationale: Конструкция с τοῦ и инфинитивом обозначает действие, которому препятствовали. χώρα может означать страну, землю, область или сельскую местность; основной текст сохраняет широкое значение, а примечание отмечает варианты.
