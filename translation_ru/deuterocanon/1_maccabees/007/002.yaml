  yaml_path: translation/deuterocanon/1_maccabees/007/002.yaml
  text: And it happened[a], as he was entering the royal house of his fathers, that the forces seized Antiochus and Lysias to bring them to him.
translation:
  language: ru
  text: 'И случилось: когда он входил в царский дворец своих предков, войска схватили Антиоха и Лисия, чтобы привести их к нему.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: 'И случилось: когда'
  rationale: Сохранена повествовательная переходная формула и её временная связь; двоеточие делает конструкцию естественной по-русски.
- source_word: εἰσεπορεύετο
  choice: он входил
  rationale: Несовершенный вид передаёт действие, происходившее в момент последующих событий.
- source_word: οἶκον βασιλείας πατέρων αὐτοῦ
  choice: царский дворец своих предков
  rationale: «Царский дворец» естественно передаёт необычное греческое «дом царства», то есть царскую резиденцию или династический дворец; «предков» ясно выражает династический смысл множественного πατέρων.
- source_word: συνέλαβον
  choice: схватили
  rationale: Передаёт насильственное задержание без привнесения оттенка формальной юридической процедуры.
- source_word: αἱ δυνάμεις
  choice: войска
  rationale: В данном военно-политическом контексте множественное существительное обозначает военные силы.
- source_word: ἀγαγεῖν αὐτοὺς αὐτῷ
  choice: чтобы привести их к нему
  rationale: Инфинитив цели передан придаточным цели; местоименная неоднозначность оригинала сохранена.
