- from: И он послал его вместе с нечестивым Алкимом, и они[a] утвердили за Алкимом священство[b], а ему приказал совершить возмездие среди сынов Израиля[c].
  to: И он послал его и нечестивого Алкима, и они[a] утвердили Алкима в священстве[b], а Алкиму приказал совершить возмездие среди сынов Израиля[c].
  rationale: 'Исправлена синтаксическая связь при «послал»: Алким является вторым отправленным лицом, а не спутником первого. Явно назван адресат приказа — Алким. Множественное число «они утвердили», отражающее форму ἔστησαν в предоставленном греческом тексте, сохранено и снабжено примечанием. Альтернатива для ἐν сохранена без навязывания контекстуального толкования в основном тексте.'
