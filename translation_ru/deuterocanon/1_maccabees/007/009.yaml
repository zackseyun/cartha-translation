base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/009.yaml
  text: And he sent him and Alcimus the ungodly[a], and established the priesthood for him[b], and commanded him to carry out vengeance on the sons of Israel.
translation:
  language: ru
  text: И он послал его и нечестивого Алкима, и они[a] утвердили Алкима в священстве[b], а Алкиму приказал совершить возмездие среди сынов Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь стоит множественное число: «они утвердили», хотя до и после этого говорится о действиях одного лица.'
    reason: textual_ambiguity
  - marker: b
    text: 'Буквально: «утвердили за ним священство»; то есть поставили Алкима на священническое служение.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможный перевод: «против сынов Израиля». Греческий предлог обозначает среду, в которой должно совершиться возмездие, но контекст допускает враждебную направленность.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный глагол отправления; «послал» естественно и сохраняет прямоту греческого выражения.
- source_word: Ἄλκιμον τὸν ἀσεβῆ
  choice: нечестивым Алкимом
  rationale: «Нечестивый» передаёт религиозно-нравственную оценку ἀσεβής, не сводя её лишь к общей порочности.
- source_word: ἔστησαν αὐτῷ τὴν ἱερωσύνην
  choice: они утвердили за Алкимом священство
  rationale: Сохранено множественное число ἔστησαν, хотя оно создаёт резкую смену подлежащего. Местоимение раскрыто именем Алкима для ясности ближайшего референта; «утвердили ... священство» остаётся близким к форме источника.
- source_word: ἐνετείλατο
  choice: приказал
  rationale: Передаёт властный характер распоряжения и звучит естественнее в современном русском повествовании, чем более архаичное «повелел».
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: совершить возмездие
  rationale: Сохраняет предметную конструкцию греческого текста и суровую семантику ἐκδίκησις, не заменяя её более узким «наказать».
- source_word: ἐν τοῖς υἱοῖς Ἰσραήλ
  choice: среди сынов Израиля
  rationale: «Среди» непосредственно передаёт ἐν как сферу действия и не устраняет возможный в контексте враждебный смысл; этническая формула «сыны Израиля» сохранена.
theological_decisions:
- issue: Нравственно-религиозная характеристика Алкима (ἀσεβής)
  choice: нечестивый
  alternative: безбожный; порочный
  rationale: «Нечестивый» сохраняет направленность оценки на неуважение к Богу и святыне, тогда как «порочный» слишком широк, а «безбожный» может означать прямое отрицание существования Бога.
- issue: Смена числа подлежащего при ἔστησαν
  choice: они утвердили
  alternative: он утвердил
  rationale: Издание источника имеет форму третьего лица множественного числа. Русский текст сохраняет эту грамматическую особенность, не исправляя её молча по окружающему контексту.
- issue: Значение ἐν в выражении о возмездии
  choice: среди сынов Израиля
  alternative: против сынов Израиля; над сынами Израиля
  rationale: Основной текст сохраняет пространственно-сферическое значение предлога и вместе с существительным «возмездие» допускает враждебную направленность. Более явное «против» дано в примечании как контекстуальная возможность.
- issue: Традиционная мужская этническая формула υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Буквальная формула сохраняет образ и стиль источника; нейтральное «израильтяне» было бы понятнее, но убрало бы выраженную исходным текстом родственную метафору.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сделан понятным без устранения необычной смены числа в греческом тексте. Имена и традиционная формула «сыны Израиля» переданы в принятом русском библейском облике.
