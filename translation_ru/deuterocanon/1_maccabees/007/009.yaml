  verdict: revise
  source_fidelity: 'Основная передача верна: ἀπέστειλεν — «послал», Ἄλκιμον τὸν ἀσεβῆ — «нечестивого Алкима», ἔστησαν сохранено во множественном числе, ἐνετείλατο — «приказал», а ἐν τοῖς υἱοῖς Ἰσραήλ обоснованно передано как «среди сынов Израиля» с примечанием об альтернативе. Однако в черновике меняется синтаксическая связь: «послал его вместе с ... Алкимом» делает Алкима спутником при отправлении, тогда как αὐτὸν καὶ Ἄλκιμον означает, что были посланы двое — «его и ... Алкима». Кроме того, «а ему приказал» после множественного «они утвердили» неоднозначно: греческое αὐτῷ относится к Алкиму, что следует ясно выразить.'
  naturalness: «Послал его и нечестивого Алкима» естественно для современного литературного русского и точно передаёт координацию дополнений. Формула «приказал Алкиму совершить возмездие» снимает ненужную референциальную неясность. Сохранение неожиданного «они утвердили» оправдано формой текста Swete; примечание кратко объясняет этот разрыв.
  terminology: «Нечестивый», «священство», «возмездие» и «сыны Израиля» уместны и сохраняют регистр и смысл греческого текста. «Утвердили за Алкимом священство» допустимо, но «утвердили Алкима в священстве» более идиоматично и всё ещё передаёт τὴν ἱερωσύνην как предоставленное ему священническое достоинство; буквальная формулировка сохранена в примечании.
