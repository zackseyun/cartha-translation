lexical_decisions:
- source_word: ἄνδρες
  choice: мужчины
  rationale: Существительное имеет явно мужской род и обозначает конкретную группу мужчин; перевод сохраняет это значение, не заменяя его более общим словом «люди».
- source_word: ἄνομοι
  choice: беззаконные
  rationale: Передаёт противление закону, включая вероятный оттенок нарушения Закона завета, и не сводит характеристику к общей нравственной порочности.
- source_word: ἀσεβεῖς
  choice: нечестивые
  rationale: Сохраняет религиозный смысл непочтительности к Богу и естественно звучит в современном литературном русском языке.
- source_word: ἐξ Ἰσραήλ
  choice: из Израиля
  rationale: Указывает, что эти мужчины происходили из среды самого Израиля.
- source_word: ἡγείται αὐτῶν
  choice: их возглавлял
  rationale: Естественно передаёт роль Алкима как предводителя группы; настоящее историческое передано русским повествовательным прошедшим.
- source_word: βουλόμενος
  choice: желавший
  rationale: Причастие выражает стремление и мотив Алкима, а не только отвлечённое намерение.
- source_word: ἱερατεύειν
  choice: стать священником
  rationale: Основной текст сохраняет прямое значение греческого инфинитива — нести священническое служение — не добавляя отсутствующего в самом слове определения «первосвященник»; контекстуальная конкретизация вынесена в примечание.
- source_word: πρὸς αὐτόν
  choice: к нему
  rationale: С глаголом движения предлог обозначает приближение к названному ранее лицу.
theological_decisions:
- issue: Передача двух осуждающих характеристик израильтян
  choice: беззаконные и нечестивые
  alternative: злые и нечестивые
  rationale: Раздельно сохранены правовой/заветный и религиозный аспекты греческих слов, без сведения их к одному общему порицанию.
- issue: Степень конкретизации священнического стремления Алкима
  choice: стать священником
  alternative: стать первосвященником
  rationale: Греческий инфинитив сам по себе не содержит значения «перво-», хотя исторический контекст указывает на притязание Алкима на должность первосвященника. Основной текст сохраняет формальную неоднозначность, а примечание сообщает контекстуально вероятный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Начальное «И пришли» сохраняет повествовательную связь с контекстом; точка с запятой ясно отделяет характеристику группы от указания на её предводителя.
