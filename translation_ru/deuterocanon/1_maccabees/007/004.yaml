lexical_decisions:
- source_word: αἱ δυνάμεις
  choice: войска
  rationale: В военном контексте существительное обозначает вооружённые силы или воинские отряды; «войска» естественно и не уточняет их состав сверх греческого текста.
- source_word: ἀπέκτειναν
  choice: убили
  rationale: Аорист прямо обозначает совершённое убийство; «убили» передаёт смысл без архаизации и без добавочного оттенка официальной казни.
- source_word: ἐκάθισεν
  choice: воссел
  rationale: В сочетании с престолом глагол описывает занятие царского престола. «Воссел» сохраняет образ исходного текста и соответствует современному торжественно-историческому регистру.
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: на престоле своего царства
  rationale: Формулировка близко передаёт греческое сочетание и сохраняет связь престола с царской властью Димитрия, не сводя её к более свободному «царском престоле».
- source_word: Δημήτριος
  choice: Димитрий
  rationale: Традиционная русская библейская форма греческого имени.
