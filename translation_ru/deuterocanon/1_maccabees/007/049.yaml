lexical_decisions:
- source_word: ἔστησαν
  choice: установили
  rationale: Аорист ἵστημι здесь обозначает учреждение постоянного обычая; «установили» естественно и точно передаёт этот смысл.
- source_word: τοῦ ἄγειν
  choice: отмечать
  rationale: Артикулированный инфинитив выражает содержание установленного обычая. «Отмечать день» сохраняет широкий смысл соблюдения памятной даты, не навязывая исключительно праздничного оттенка.
- source_word: κατʼ ἐνιαυτόν
  choice: ежегодно
  rationale: Наречие естественно передаёт значение регулярности «из года в год» в современном литературном русском.
- source_word: τὴν ἡμέραν ταύτην
  choice: этот день
  rationale: Прямо передаёт указательное местоимение ταύτην и сохраняет связь с описанным событием.
- source_word: τῇ τρισκαιδεκάτῃ
  choice: тринадцатого
  rationale: Дательный падеж указывает дату; в русском нормативно употребление родительного падежа числительного при обозначении календарного дня.
- source_word: τοῦ Ἀδάρ
  choice: адара
  rationale: Название месяца транслитерировано и поставлено в родительный падеж согласно русскому синтаксису даты.
