- from: Иуда узнал[a], что тот пришёл к нему с коварным замыслом. Иуда испугался его и больше не захотел видеть его лица.
  to: Иуде стало известно[a], что тот выступил против него с коварством; он встревожился из-за него и больше не захотел видеть его лица.
  rationale: Безлично-пассивная конструкция «Иуде стало известно» воспроизводит ἐγνώσθη ... τῷ Ἰούδα, не называя источник сведений. «Выступил против него» передаёт враждебную направленность ἦλθεν ἐπ’ αὐτόν, а «с коварством» сохраняет обобщённое значение μετὰ δόλου. «Встревожился из-за него» передаёт тревогу, вызванную этим человеком, без чрезмерного усиления. Сноска отражает как естественный русский вариант, так и буквальную структуру оригинала.
