lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος τῷ Ἰούδα
  choice: Иуда узнал
  rationale: Греческая безлично-пассивная конструкция означает, что сведения стали известны Иуде. Естественная русская конструкция передаёт смысл без введения неназванного осведомителя; альтернативное буквальное понимание отмечено в сноске.
- source_word: ὁ λόγος
  choice: опущено как отдельное существительное в основном тексте
  rationale: В данном контексте λόγος обозначает сведения или известие о намерении противника. Русское «Иуда узнал, что…» естественно включает это значение; вариант с явным «известие» сохранён в сноске.
- source_word: μετὰ δόλου
  choice: с коварным замыслом
  rationale: Оборот указывает не просто на ложь, а на скрытое злонамеренное намерение при встрече. «С коварным замыслом» ясно и естественно передаёт это в современном русском, не усиливая до прямого «предательства».
- source_word: ἦλθεν ἐπ’ αὐτόν
  choice: пришёл к нему
  rationale: ἐπί с винительным допускает направленность к человеку, а контекст враждебности уже выражен оборотом «с коварным замыслом». Перевод «пришёл против него» был бы менее естественным по-русски и мог бы неоправданно представить открытое нападение.
- source_word: ἐπτοήθη ἀπ’ αὐτοῦ
  choice: испугался его
  rationale: Глагол означает испуг или сильную тревогу, а ἀπό обозначает источник этого состояния. Краткое русское выражение точно и идиоматично передаёт обе части.
- source_word: οὐκ ἠβουλήθη ἔτι
  choice: больше не захотел
  rationale: Передаёт прекращение прежней готовности встречаться и последовавший осознанный отказ без излишне официального оттенка.
- source_word: ἰδεῖν τὸ πρόσωπον αὐτοῦ
  choice: видеть его лица
  rationale: Сохранён образ лица, присутствующий в греческом тексте и подчёркивающий личную встречу; после отрицания употреблён естественный русский родительный падеж.
