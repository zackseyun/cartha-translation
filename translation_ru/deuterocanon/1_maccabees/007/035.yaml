lexical_decisions:
- source_word: ὤμοσεν
  choice: поклялся
  rationale: Аорист ὄμνυμι обозначает принесение клятвы; «поклялся» кратко и естественно передаёт торжественный характер действия.
- source_word: μετὰ θυμοῦ
  choice: с гневом
  rationale: Оборот передаёт эмоциональное состояние и манеру говорящего; «с гневом» сохраняет силу θυμός без неоправданного усиления до «ярости».
- source_word: παραδοθῇ
  choice: не будут преданы
  rationale: Пассивный конъюнктив παραδίδωμι означает передачу кого-либо во власть другого; «преданы в мои руки» сохраняет формальный и военный оттенок.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: его стан
  rationale: παρεμβολή может означать военный лагерь или находящееся в нём войско. «Стан» сохраняет конкретный военный образ и допускает оба оттенка.
- source_word: τὸ νῦν
  choice: теперь
  rationale: Выражение подчёркивает настоящее время и не обязательно требует усилительного «немедленно».
- source_word: εἰς χεῖράς μου
  choice: в мои руки
  rationale: Сохранена ясная и естественная по-русски метафора передачи под власть говорящего.
- source_word: ἐπιστρέψω ἐν εἰρήνῃ
  choice: я возвращусь с миром
  rationale: Так передаётся условно-временная форма и сохраняется широкий смысл ἐν εἰρήνῃ, не сводимый только к физической невредимости.
theological_decisions:
- issue: Незавершённая формула клятвы в пределах стиха
  choice: Сохранить оборванное условно-временное предложение и обозначить продолжение многоточием
  alternative: Завершить клятву словами из следующего стиха
  rationale: Греческий текст данного стиха оканчивается до главной части клятвы, которая следует далее. Перевод сохраняет структуру источника, не перенося сюда текст следующего стиха.
- issue: Связь ἐὰν ἐπιστρέψω с предшествующим условием
  choice: Передать как «то, когда я возвращусь»
  alternative: «то, если я возвращусь»
  rationale: После первого условия второй оборот естественно вводит обстоятельство будущего возвращения, при котором исполнится подразумеваемая угроза; «когда» даёт естественный русский синтаксис, не восполняя саму угрозу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной окраской. «Стан» выбран как понятный библейско-исторический военный термин; архаические формы и конфессионально окрашенная лексика не использованы.
