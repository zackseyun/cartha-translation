translation:
  language: ru
  text: И народ очень обрадовался и отпраздновал тот день как день великой радости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «провели тот день как день великой радости»; это оборот со значением «соблюдали» или «праздновали этот день».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐφράνθη
  choice: обрадовался
  rationale: Аорист пассивной формы εὐφραίνω здесь имеет естественное непереходное значение и передаёт радостный отклик народа.
- source_word: ὁ λαός
  choice: народ
  rationale: Греческий текст говорит просто «народ»; уточнение «Израиля» не добавляется, поскольку его нет в стихе.
- source_word: σφόδρα
  choice: весьма
  rationale: Наречие усиливает выражение радости; «весьма» сохраняет приподнятый повествовательный стиль и остаётся понятным современному читателю.
- source_word: ἦγαγον
  choice: праздновали
  rationale: Буквально глагол означает «вели/проводили», но в сочетании с ἡμέραν выражает соблюдение или празднование дня.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: тот день
  rationale: Прямое и естественное соответствие указательной конструкции.
- source_word: ἡμέραν εὐφροσύνης μεγάλην
  choice: как день великой радости
  rationale: Передаёт праздничную радость и сохраняет повтор слова «день», присутствующий в греческом тексте.
