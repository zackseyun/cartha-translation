lexical_decisions:
- source_word: ἐμυκτήρισεν
  choice: насмехался над
  rationale: Глагол передаёт презрительную насмешку, буквально связанную с гримасой или задиранием носа. «Насмехался над» естественно звучит по-русски и сохраняет оттенок презрения.
- source_word: κατεγέλασεν
  choice: смеялся над
  rationale: Глагол прямо означает «смеяться над, высмеивать». Конкретный образ смеха сохранён, а значение не слито с предыдущим глаголом.
- source_word: ἐμίανεν
  choice: осквернил
  rationale: Глагол означает «осквернять, загрязнять, делать нечистым». «Осквернил» сохраняет сильный религиозно-нравственный оттенок, не уточняя способ действия, который в стихе не назван.
- source_word: ἐλάλησεν ὑπερηφάνως
  choice: говорил надменно
  rationale: Наречие обозначает высокомерную, надменную или дерзкую манеру речи. «Говорил надменно» точно и естественно передаёт греческую конструкцию.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: и ... и ... и ... и
  rationale: Повтор союза создаёт нарастающее перечисление последовательных проявлений презрения; он сохранён ради ритма и риторического эффекта оригинала.
