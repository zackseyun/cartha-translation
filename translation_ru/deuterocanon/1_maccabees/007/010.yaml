review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан точно: последовательность ухода и прибытия, военная сила, посланцы, адресаты и обманный характер мирных речей сохранены. Однако «земля Иуды» в современном русском может быть понята как владение самого Иуды (Иуды Маккавея), тогда как γῆν Ἰούδα обозначает территорию Иудеи.'
  naturalness: «Он отправился и пришёл» и «с мирными речами, но с обманом» естественны для современного литературного повествования. Формула «за которыми скрывался обман» допустима, но несколько сильнее истолковывает синтаксическую связь; более близкая ко греческому конструкция сохраняет краткость и двусмысленность степени внешней миролюбивости.
  terminology: «Иудея» является обычным русским географическим обозначением этой земли и исключает смешение с личным именем Иуда. «Вестники», «войско», «Иуда» и «братья» уместны и точны.
  issues:
  - severity: medium
    issue: Территориальное название «в землю Иуды»
    rationale: Греческое γῆν Ἰούδα означает землю/область Иудеи, а не землю, принадлежащую Иуде, к которому затем направляются вестники. В русском требуется географическое название «Иудея».
  - severity: low
    issue: «За которыми скрывался обман»
    rationale: Это передаёт общий смысл, но разворачивает конструкцию μετὰ δόλου как скрытый за словами обман. «Но с обманом» ближе к исходной формулировке и сохраняет её лаконичность.
  revised_text: Он отправился и пришёл в землю Иудеи с большим войском. Затем он послал вестников к Иуде и его братьям с мирными речами, но с обманом.
