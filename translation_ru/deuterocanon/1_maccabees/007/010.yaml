  text: And he departed and came into the land of Judah with a large force[a], and he sent messengers to Judas and to his brothers with peaceful words, but with deceit.
translation:
  language: ru
  text: Он отправился и пришёл в землю Иудеи с большим войском. Затем он послал вестников к Иуде и его братьям с мирными речами, но с обманом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν καὶ ἦλθεν
  choice: отправился в путь и пришёл
  rationale: Передаёт последовательность отбытия и прибытия, выраженную двумя аористами, не уточняя маршрут или способ передвижения.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: с большим войском
  rationale: В данном военно-политическом контексте δύναμις означает вооружённые силы; «войско» естественно и ясно передаёт этот смысл.
- source_word: εἰς γῆν Ἰούδα
  choice: в землю Иуды
  rationale: Сохраняет явно выраженное γῆ и территориальное значение родительного Ἰούδα.
- source_word: ἀπέστειλεν ἀγγέλους
  choice: послал вестников
  rationale: ἄγγελοι здесь — люди, направленные с сообщением; «вестники» не привносит ангелологического смысла.
- source_word: πρὸς Ἰούδαν καὶ πρὸς τοὺς ἀδελφοὺς αὐτοῦ
  choice: к Иуде и его братьям
  rationale: Точно передаёт адресатов и сохраняет прямое значение ἀδελφοί.
- source_word: λόγους εἰρηνικοὺς μετὰ δόλου
  choice: с мирными речами, за которыми скрывался обман
  rationale: Передаёт контраст между внешне миролюбивой речью и обманным намерением; связь μετὰ δόλου с сообщением сохранена без чрезмерно буквальной и неестественной русской конструкции.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование ясное и достойное по тону. «Мирные речи» сохраняет образную форму оригинала, а «за которыми скрывался обман» естественно выражает подразумеваемое противопоставление внешних слов и внутреннего умысла.
