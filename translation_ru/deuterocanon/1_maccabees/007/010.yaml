revisions:
- from: Он отправился в путь и пришёл в землю Иуды с большим войском. Затем он послал вестников к Иуде и его братьям с мирными речами, за которыми скрывался обман.
  to: Он отправился и пришёл в землю Иудеи с большим войском. Затем он послал вестников к Иуде и его братьям с мирными речами, но с обманом.
  rationale: Исправлено географическое обозначение, чтобы устранить возможное смешение Иудеи с личным именем Иуда. Формулировка о мирных речах и обмане приближена к греческому λόγους εἰρηνικοὺς μετὰ δόλου без добавления более определённого образа скрытого намерения. Смысл и регистр сохранены.
