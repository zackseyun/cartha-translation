  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: побудительное отрицание («Пусть не будет»), военное μάχη («сражение»), противопоставление говорящего адресатам («между мною и вами»), приход с малым числом спутников и целевую встречу «в мире». Множественное число адресатов сохранено. Буквальное «ваши лица» оправдано и сохраняет образ оригинала.'
