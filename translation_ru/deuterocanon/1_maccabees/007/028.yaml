  text: Let there be no battle between me and you. I will come with a few men, so that I may see your faces in peace.
translation:
  language: ru
  text: Пусть не будет сражения между мною и вами. Я приду с немногими людьми, чтобы увидеть ваши лица в мире.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ ἔστω
  choice: Пусть не будет
  rationale: Побудительно-запретительная конструкция передана прямым пожеланием, естественным для современного русского языка.
- source_word: μάχη
  choice: сражения
  rationale: В военно-политическом контексте слово обозначает вооружённое столкновение; «сражение» сохраняет конкретность греческого текста.
- source_word: ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν
  choice: между мною и вами
  rationale: Передаёт противопоставление говорящего множеству адресатов и сохраняет различие числа.
- source_word: ἥξω
  choice: Я приду
  rationale: Будущая форма ἥκω здесь обозначает приход к адресатам.
- source_word: ἐν ἀνδράσιν ὀλίγοις
  choice: с немногими людьми
  rationale: ἐν при обозначении лиц выражает сопровождение; перевод сохраняет указание на малочисленность свиты, не добавляя прямо не названной характеристики «воины».
- source_word: ἵνα ἴδω
  choice: чтобы увидеть
  rationale: Инфинитивная конструкция с «чтобы» ясно передаёт цель прихода и звучит естественно по-русски.
- source_word: ὑμῶν τὰ πρόσωπα
  choice: ваши лица
  rationale: Сохранён конкретный и допускающий идиоматическое понимание образ личной встречи.
- source_word: μετ’ εἰρήνης
  choice: в мире
  rationale: Буквально и сдержанно передаёт мирный характер встречи, не усиливая значение до дружбы.
