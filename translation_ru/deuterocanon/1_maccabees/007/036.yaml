  yaml_path: translation/deuterocanon/1_maccabees/007/036.yaml
  text: “I will burn this house.” And he went out in anger[a]. Then the priests entered and stood before the altar and the sanctuary, and they wept and said[b],
translation:
  language: ru
  text: '«Я сожгу этот дом»[a]. И он вышел в гневе. Тогда священники вошли, встали перед жертвенником и святилищем, заплакали и сказали[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть храм. В греческом тексте буквально: «этот дом» — так могли называть храм.'
    reason: lexical_alternative
  - marker: b
    text: Слова священников, начатые здесь, приводятся в следующем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: ἐμπυριῶ
  choice: сожгу
  rationale: Будущее время передаёт прямую угрозу предать огню. «Сожгу» естественно и лаконично, не усиливая значение до обязательного полного уничтожения.
- source_word: τὸν οἶκον τοῦτον
  choice: этот дом
  rationale: Буквально «этот дом»; в контексте имеется в виду храм. Сохранение слова «дом» передаёт формулировку греческого текста и её библейское звучание.
- source_word: μετὰ θυμοῦ
  choice: в гневе
  rationale: Естественно передаёт сильное раздражение или гнев персонажа, сохраняя торжественный повествовательный регистр.
- source_word: οἱ ἱερεῖς
  choice: священники
  rationale: Обычное и точное обозначение храмовых священников.
- source_word: ἔστησαν κατὰ πρόσωπον
  choice: встали перед
  rationale: Передаёт положение лицом к жертвеннику и святилищу без ненужного уточнения, отсутствующего в исходном тексте.
- source_word: τοῦ θυσιαστηρίου
  choice: жертвенником
  rationale: Традиционный и точный русский культовый термин для алтаря, на котором приносят жертвы.
- source_word: τοῦ ναοῦ
  choice: святилищем
  rationale: ναός обозначает собственно святилище, а не обязательно весь храмовый комплекс; перевод сохраняет отличие от οἶκος ранее в стихе.
- source_word: ἔκλαυσαν
  choice: заплакали
  rationale: Естественный современный русский глагол, точно передающий начало плача в данной последовательности действий.
- source_word: εἶπαν
  choice: сказали
  rationale: Стандартная формула введения прямой речи, продолжающейся в следующем стихе.
