lexical_decisions:
- source_word: οὐ προσεῖχον
  choice: не вняли
  rationale: Глагол προσέχω с дательным падежом означает «обращать внимание», «прислушиваться», «принимать во внимание». «Не вняли» естественно передаёт сознательное недоверие к сказанному и сохраняет несколько возвышенный повествовательный регистр.
- source_word: τοῖς λόγοις αὐτῶν
  choice: их словам
  rationale: Буквальное и естественное соответствие, обозначающее содержание сказанного.
- source_word: ἴδου γὰρ
  choice: потому что
  rationale: γάρ вводит основание предшествующей реакции. ἴδου служит показателем привлечения внимания; в современном русском его отдельная передача («вот», «смотрите») здесь звучала бы тяжеловесно, поэтому его дискурсивная функция отражена пояснительной связью, а наличие в греческом отмечено в сноске.
- source_word: ἦλθον
  choice: те пришли
  rationale: Аорист передан прошедшим временем. Указательное «те» естественно уточняет смену субъекта и предотвращает двусмысленность русского местоимения «они».
- source_word: μετὰ δυνάμεως πολλῆς
  choice: с большой силой
  rationale: δύναμις может означать силу, мощь или военный отряд. Формулировка сохраняет лексическую широту греческого, тогда как контекстуально вероятный военный смысл поясняется в сноске.
