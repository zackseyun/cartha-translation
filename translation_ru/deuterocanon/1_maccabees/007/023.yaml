base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/023.yaml
  text: And Judas saw all the evil that Alcimus and those with him had done among the sons of Israel[a], beyond even the nations.
translation:
  language: ru
  text: Иуда увидел всё зло, содеянное Алкимом и его сторонниками среди сынов Израиля, — зло, превосходившее даже зло языческих народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «большее, чем язычники». Греческое выражение означает, что зло, совершённое Алкимом и его сторонниками, превзошло зло окружающих языческих народов.'
    reason: Лексическая альтернатива и пояснение эллиптического сравнения.
lexical_decisions:
- source_word: ἴδεν
  choice: увидел
  rationale: Прямое повествовательное значение аориста ὁράω; в контексте включает осознание происходящего.
- source_word: ἅπαν τὴν κακίαν
  choice: всё зло
  rationale: Передаёт как нравственную окраску κακία, так и полноту, выраженную ἅπαν.
- source_word: ἐποίησεν
  choice: совершили
  rationale: Русский совершенный вид естественно обозначает уже содеянное зло; множественное число согласовано с составным субъектом «Алким и его сторонники».
- source_word: οἱ μετ’ αὐτοῦ
  choice: его сторонники
  rationale: Идиома обозначает людей, примкнувших к Алкиму или действовавших вместе с ним; «сторонники» естественнее буквального «бывшие с ним».
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: среди сынов Израиля
  rationale: Сохраняет значение сферы действия у ἐν и явный библейский образ «сынов Израиля», не превращая его без достаточных оснований в «против израильтян».
- source_word: ὑπὲρ τὰ ἔθνη
  choice: большее, чем даже у языческих народов
  rationale: ὑπέρ с винительным выражает превосходящую степень; «даже» передаёт риторическую остроту сопоставления, а «языческие народы» ясно обозначает народы вне Израиля в данном контексте.
theological_decisions:
- issue: Передача υἱοῖς Ἰσραήλ
  choice: среди сынов Израиля
  alternative: среди народа Израиля; среди израильтян
  rationale: Сохранён филиальный библейский оборот исходного текста и его заветно-историческая окраска.
- issue: Передача τὰ ἔθνη
  choice: языческие народы
  alternative: народы; язычники
  rationale: В иудейском контексте выражение противопоставляет Израиль окружающим народам. Выбранная формулировка передаёт это значение, не сводя слово только к отдельным лицам.
- issue: Смысл эллиптического сравнения ὑπὲρ τὰ ἔθνη
  choice: зло Алкима и его сторонников было больше зла у языческих народов
  alternative: они сделали сынам Израиля больше зла, чем языческие народы
  rationale: Греческая конструкция кратка и допускает различную развёртку подразумеваемого сравнения. Основной текст сохраняет сопоставление степени зла, а сноска отмечает возможную событийную формулировку.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Оборот «сыны Израиля» сохранён как узнаваемое выражение исходного текста; «его сторонники» делает повествование естественным и ясным. Сравнение сформулировано без устранения присущей греческому тексту краткости и смыслового напряжения.
