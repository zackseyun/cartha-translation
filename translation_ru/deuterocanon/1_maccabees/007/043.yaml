lexical_decisions:
- source_word: συνῆψαν αἱ παρεμβολαὶ εἰς πόλεμον
  choice: сошлись войска в битве
  rationale: Военный контекст придаёт συνάπτω значение вступления в непосредственное сражение; «сошлись… в битве» естественно передаёт начало боя. Множественное παρεμβολαί буквально означает «лагеря», но здесь обозначает противостоящие военные силы.
- source_word: τῇ τρισκαιδεκάτῃ τοῦ μηνὸς Ἀδάρ
  choice: в тринадцатый день месяца адара
  rationale: Дательный падеж выражает время; слово «день» обоснованно восполнено календарным контекстом. Название месяца дано в современной русской форме со строчной буквы.
- source_word: συνετρίβη
  choice: было сокрушено
  rationale: Глагол συντρίβω сильнее нейтрального «побеждать» и передаёт разгром, сохраняя пассивную конструкцию исходного текста.
- source_word: ἡ παρεμβολὴ Νικάνορος
  choice: войско Никанора
  rationale: В единственном числе παρεμβολή здесь обозначает находившиеся под началом Никанора военные силы. «Войско» яснее современному читателю, чем буквальный «лагерь», и сохраняет референт.
