translation:
  language: ru
  text: И вышел Никанор из Иерусалима, и расположился лагерем в Вефороне, и встретило его сирийское войско[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «войско Сирии»; греческое δύναμις может означать военный отряд, вооружённые силы или войско.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Прямо передаёт аорист ἐξέρχομαι и движение из Иерусалима, не добавляя отсутствующего в глаголе значения военного выступления.
- source_word: παρενέβαλεν
  choice: расположился лагерем
  rationale: В военном повествовании παρεμβάλλω означает разбить или расположить лагерь; выбранная формулировка естественна для современного русского языка.
- source_word: Βεθωρών
  choice: Беф-Орон
  rationale: Традиционная русская библейская передача географического названия; предлог «у» естественно обозначает расположение лагеря возле города.
- source_word: συνήντησεν αὐτῷ
  choice: встретило его
  rationale: Сохраняет широкое значение «встретить» и не уточняет, присоединилось ли войско к Никанору, поскольку этого сам глагол не выражает.
- source_word: δύναμις Συρίας
  choice: сирийское войско
  rationale: В военном контексте δύναμις обозначает вооружённые силы или войско, а родительный Συρίας естественно передаётся русским относительным прилагательным; возможная более буквальная конструкция отмечена в сноске.
