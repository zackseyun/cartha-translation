lexical_decisions:
- source_word: πρῶτοι
  choice: первыми
  rationale: 'Предикативное употребление с ἦσαν выражает первенство: хасидеи первыми проявили эту инициативу.'
- source_word: Ἀσιδαῖοι
  choice: хасидеи
  rationale: Передано как устоявшееся транслитерированное название группы, без поясняющего толкования внутри текста.
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: среди сынов Израиля
  rationale: Предлог ἐν здесь означает «среди», а традиционное семейно-заветное выражение «сыны Израиля» сохранено; более естественный вариант дан в примечании.
- source_word: ἐπεζήτουν
  choice: искали
  rationale: Имперфект допускает длительное или предпринимавшееся действие; «искали» естественно сохраняет его без избыточного уточнения.
- source_word: παρʼ αὐτῶν
  choice: у них
  rationale: Παρά с родительным падежом обозначает источник; русское сочетание «искать у кого-либо мира» сохраняет направленность просьбы и множественное число местоимения.
- source_word: εἰρήνην
  choice: мира
  rationale: Сохранено основное значение существительного без конкретизации как «мирного соглашения» или «условий мира».
theological_decisions:
- issue: Передача этнического и заветного выражения υἱοῖς Ἰσραήλ
  choice: среди сынов Израиля
  alternative: среди израильтян
  rationale: Греческий текст буквально употребляет «сынов Израиля» — традиционное национально-заветное выражение. Оно сохранено в основном тексте, а естественный русский эквивалент указан в примечании.
