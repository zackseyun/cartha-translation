  text: And he appointed Alcimus over the country, and left with him a force to help him; and Bacchides went away to the king.
translation:
  language: ru
  text: И он поставил Алкима над страной и оставил при нём войско, чтобы помогать ему; а Вакхид отправился к царю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν ... τὴν χώραν τῷ Ἀλκίμῳ
  choice: поставил Алкима над страной
  rationale: Оборот передаёт назначение Алкима правителем страны; такая формулировка естественна по-русски и сохраняет административный смысл греческого текста.
- source_word: τὴν χώραν
  choice: страной
  rationale: В данном политико-административном контексте χώρα обозначает страну или территорию.
- source_word: ἀφῆκεν μετ’ αὐτοῦ
  choice: оставил при нём
  rationale: Речь о том, что военная сила была оставлена в распоряжении Алкима; «при нём» естественно выражает это по-русски.
- source_word: δύναμιν
  choice: войско
  rationale: В повествовательном военном контексте δύναμις означает вооружённые силы; «войско» ясно передаёт этот смысл, не уточняя численность.
- source_word: τοῦ βοηθεῖν αὐτῷ
  choice: чтобы помогать ему
  rationale: Артиклевый инфинитив выражает цель, ради которой войско было оставлено при Алкиме.
- source_word: ἀπῆλθεν
  choice: отправился
  rationale: Глагол обозначает уход и движение к названному далее лицу; «отправился» звучит естественно и достойно в русском повествовании.
- source_word: πρὸς τὸν βασιλέα
  choice: к царю
  rationale: Предлог с винительным падежом указывает направление движения. Значение «обратно» контекстуально возможно, но в греческом прямо не выражено.
