lexical_decisions:
- source_word: Οἱ παρὰ τοῦ βασιλέως
  choice: царские люди
  rationale: Оборот обозначает людей, находящихся при царе или действующих от его имени. «Царские люди» естественно передаёт принадлежность к царю, не уточняя сверх текста, были ли это посланники, военачальники или воины.
- source_word: ἐδυσφήμουν
  choice: злословили
  rationale: Глагол обозначает оскорбительную, хулительную речь. «Злословили» сохраняет широту значения и не делает явно богословский смысл единственно возможным; вариант «богохульствовали» отмечен в сноске.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Прямо передаёт аорист глагола движения и сохраняет образ выступившего для действия ангела.
- source_word: ἄγγελός σου
  choice: Твой ангел
  rationale: Хотя ἄγγελος может означать также «вестник», контекст отсылает к сверхъестественному Божьему вмешательству, поэтому «ангел» точнее по контексту.
- source_word: ἐπάταξεν
  choice: поразил
  rationale: В данном повествовательном контексте глагол означает нанесение смертельного удара. «Поразил» передаёт результат без архаического оборота.
- source_word: ἐν αὐτοῖς
  choice: среди них
  rationale: Предложное сочетание указывает на число поражённых внутри названной группы; «среди них» естественно передаёт этот собирательно-разделительный смысл.
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: сто восемьдесят пять тысяч
  rationale: Передано точное числительное греческого текста словами, что соответствует стилю связного библейского повествования.
theological_decisions:
- issue: Следует ли передавать δυσφημέω явно богословским термином
  choice: злословили
  alternative: богохульствовали
  rationale: Контекст допускает хулу против Бога, однако сам греческий глагол шире и может обозначать оскорбительную или поносительную речь. Основной текст сохраняет эту смысловую широту, а богословски более явный вариант дан в сноске.
- issue: Кого обозначает ἄγγελός σου
  choice: Твой ангел
  alternative: Твой вестник
  rationale: Историческая аллюзия указывает на небесного исполнителя Божьего суда. «Ангел» сохраняет этот контекстуальный смысл, тогда как «вестник» мог бы неоправданно ослабить его.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для русского: греческая конструкция с временным ὅτε передана придаточным «когда». Обращённое к Богу местоимение написано с прописной буквы.'
