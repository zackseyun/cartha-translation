  text: When those from the king were speaking abusively[b][a], your angel went out and struck down one hundred eighty-five thousand among them.
translation:
  language: ru
  text: Когда люди царя злословили[a], Твой ангел вышел и поразил сто восемьдесят пять тысяч из них[b].
  philosophy: optimal-equivalence
  footnotes:
