  yaml_path: translation/deuterocanon/1_maccabees/007/047.yaml
  text: And they took the spoils and the plunder[a], and they cut off Nikanor’s head and his right hand, which he had stretched out in arrogance, and brought them and displayed them beside Jerusalem.
translation:
  language: ru
  text: И они взяли трофеи и добычу, отсекли голову Никанора и его правую руку, которую он надменно простирал, принесли их и выставили около Иерусалима[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рядом с Иерусалимом»; точное место не указано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκῦλα
  choice: трофеи
  rationale: Слово обозначает снятые с побеждённых военные трофеи; «трофеи» сохраняет военный смысл и отличается от следующего существительного.
- source_word: προνομήν
  choice: добыча
  rationale: Слово указывает на захваченное имущество; «добыча» естественно передаёт смысл и сохраняет парное сочетание со словом «трофеи».
- source_word: ἀφεῖλαν
  choice: отсекли
  rationale: При дополнениях «голову» и «правую руку» глагол означает физическое отделение частей тела; «отсекли» точно и естественно выражает действие.
- source_word: δεξιὰν
  choice: правая рука
  rationale: Субстантивированное прилагательное обычно обозначает правую руку; перевод не расширяет значение до всей руки от плеча.
- source_word: ἐξέτεινεν
  choice: простирал
  rationale: Имперфект передаёт предшествующее и характерное действие Никанора; «простирал» сохраняет образ протянутой руки без уточнения не названного в стихе объекта.
- source_word: ἐν ὑπερηφάνως
  choice: надменно
  rationale: Несмотря на необычную греческую форму, выражение ясно передаёт высокомерие; наречие естественно связано с глаголом «простирал».
- source_word: ἤνεγκαν
  choice: принесли
  rationale: Глагол φέρω в повествовательной последовательности означает, что отсечённые голову и руку доставили к указанному месту.
- source_word: ἐξέτειναν
  choice: выставили
  rationale: Буквально глагол означает «простёрли», но в данном контексте речь идёт о публичном выставлении принесённых останков; «выставили» передаёт действие без добавления способа экспонирования.
- source_word: παρὰ τὴν Ἰερουσαλήμ
  choice: около Иерусалима
  rationale: Предлог παρά с винительным здесь выражает положение рядом с городом; формулировка не уточняет, было ли это у ворот, за стенами или в ином конкретном месте.
theological_decisions:
- issue: Публичное обращение с останками Никанора
  choice: Передать событие как историческое действие победителей, сохранив упоминание надменности Никанора, но не добавляя нравственной оценки.
  alternative: Истолковать выставление как особый акт суда либо указать конкретное место у городских ворот или при храме.
  rationale: Стих описывает поступок и связывает отсечённую руку с надменностью Никанора, однако не называет точного места и не даёт прямой богословской оценки происходящего.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Повтор союзов слегка сглажен ради естественного синтаксиса, при этом последовательность действий и различие между трофеями и добычей сохранены.
