  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: датировку, патронимик Димитрия, исход из Рима, движение «вверх» с малочисленными спутниками к приморскому городу и последующее обретение царской власти. «Поднялся» обоснованно сохраняет оттенок ἀνέβη, а не нейтрализует его до «прибыл».'
