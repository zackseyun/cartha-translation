base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/001.yaml
  text: In the one hundred fifty-first year[a], Demetrius son of Seleucus went out from Rome, and went up with a few men to a city by the sea[b], and reigned there.
translation:
  language: ru
  text: В сто пятьдесят первом году[a] Димитрий, сын Селевка, вышел из Рима и с немногими людьми поднялся в приморский город[b], где воцарился[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в 151 году селевкидской эры, приблизительно в 162–161 гг. до н. э.; точное соответствие зависит от принятого способа отсчёта года.
    reason: historical_context
  - marker: b
    text: 'Буквально: «в город у моря».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «и царствовал там». Греческий глагол может обозначать как вступление в царскую власть, так и царствование.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔτους ἑνὸς καὶ πεντηκοστοῦ
  choice: В сто пятьдесят первом году
  rationale: Естественная русская формула датировки точно передаёт греческое порядковое числительное.
- source_word: ἐξῆλθεν ... ἐκ Ῥώμης
  choice: вышел из Рима
  rationale: Сохраняет простой глагол движения и исходный пункт, не добавляя идеи бегства.
- source_word: Δημήτριος ὁ τοῦ Σελεύκου
  choice: Димитрий, сын Селевка
  rationale: Артикль с родительным падежом имени отца естественно передаётся русским патронимическим оборотом.
- source_word: ἀνέβη
  choice: поднялся
  rationale: Сохраняет пространственный образ греческого ἀναβαίνω и не заменяет его нейтральным «прибыл».
- source_word: σὺν ἀνδράσιν ὀλίγοις
  choice: с немногими людьми
  rationale: Передаёт малочисленность сопровождавшей Димитрия группы без уточнения их статуса.
- source_word: εἰς πόλιν παραθαλασσίαν
  choice: в приморский город
  rationale: Естественный современный русский эквивалент выражения «город у моря»; буквальный образ отмечен в сноске.
- source_word: ἐβασίλευσεν
  choice: воцарился
  rationale: В данном повествовательном контексте аорист естественно указывает на начало царствования; возможное значение «царствовал» сохранено в сноске.
theological_decisions:
- issue: Видо-временной и исторический оттенок ἐβασίλευσεν
  choice: воцарился
  alternative: царствовал там
  rationale: Контекст описывает прибытие Димитрия и обретение им царской власти. Однако сам греческий глагол может обозначать как вступление на престол, так и царствование, поэтому альтернатива не устраняется.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Синтаксис остаётся близким к последовательности греческого текста; «приморский город» выбрано ради естественности, а неоднозначность заключительного царского глагола документирована в сноске.
