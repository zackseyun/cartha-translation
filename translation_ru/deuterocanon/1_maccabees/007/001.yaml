  terminology: Имена «Димитрий» и «Селевк» нормативны для русского библейско-исторического употребления. «Приморский город» — естественный эквивалент παραθαλασσίαν; сноска корректно сохраняет буквальный вариант. «Воцарился» уместно передаёт контекстуально вероятное ингрессивное значение ἐβασίλευσεν, а вариант «царствовал там» надлежащим образом зафиксирован.
