lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: возвратился
  rationale: Аорист обозначает возвращение к царю; «возвратился» естественно и точно передаёт движение назад.
- source_word: μετὰ θυμοῦ
  choice: в гневе
  rationale: Предложное сочетание описывает состояние, в котором он вернулся; русский оборот сохраняет эмоциональную силу и звучит естественно.
- source_word: ἀπήγγειλεν
  choice: передал… рассказал
  rationale: Один греческий глагол охватывает слова и увиденное. В русском контексте распределение на два близких глагола позволяет естественно передать и дословное сообщение слов, и рассказ о наблюдениях.
- source_word: τοὺς λόγους τούτους
  choice: эти слова
  rationale: Сохраняет конкретное указание на только что произнесённые слова, не обобщая их как «весть» или «дела».
- source_word: τὴν δόξαν Σίμωνος
  choice: о великолепии Симона
  rationale: В повествовательном контексте δόξα, вероятно, обозначает зримое величие и впечатляющее положение Симона; «великолепие» сохраняет этот смысл, а сноска отмечает более широкую семантику.
- source_word: πάντα ὅσα εἶδεν
  choice: обо всём, что видел
  rationale: Прямо передаёт всеохватность выражения без ненужного уточнения субъекта.
- source_word: ὠργίσθη ὁ βασιλεὺς ὀργὴν μεγάλην
  choice: царь сильно разгневался
  rationale: Естественно передаёт усиление греческой однокоренной конструкции, которую невозможно буквально воспроизвести по-русски без тяжеловесности.
