  text: But he turned back to the king in anger[a], and reported to him these words and the splendor of Simon and everything that he had seen; and the king became very angry.
translation:
  language: ru
  text: Но он в гневе возвратился к царю и передал ему эти слова, рассказал о великолепии Симона[a] и обо всём, что видел; и царь сильно разгневался.
