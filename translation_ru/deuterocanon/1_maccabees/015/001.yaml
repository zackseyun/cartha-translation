  text: And Antiochus son of King Demetrius sent letters from the islands of the sea to Simon[a], priest and ethnarch of the Jews[b], and to all the nation.
translation:
  language: ru
  text: И Антиох, сын царя Димитрия, послал с островов в море письма Симону, священнику и этнарху[a] иудеев[b], и всему народу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этнарх — официальный титул правителя или главы народа.
    reason: cultural_note
  - marker: b
    text: 'Возможный перевод: «иудеяне»; греческое слово может обозначать иудейский народ в этнорелигиозном либо регионально-политическом смысле — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычное значение аориста ἀποστέλλω; в сочетании с письмами это естественный и точный русский глагол.
- source_word: ἐπιστολάς
  choice: письма
  rationale: Форма множественного числа обозначает несколько письменных посланий; «письма» естественно в современном русском языке.
- source_word: ἀπὸ τῶν νήσων τῆς θαλάσσης
  choice: с островов моря
  rationale: Передаёт исходную предложно-родительную конструкцию и сохраняет неопределённость относительно того, какие именно острова имеются в виду.
- source_word: ἱερεῖ
  choice: священнику
  rationale: Дательный падеж согласован с именем Симона и обозначает его служение; отсутствие артикля не требует добавления уточняющего титула.
- source_word: ἐθνάρχῃ
  choice: этнарху
  rationale: Сохраняет особый историко-политический титул, не подменяя его более узким понятием «правитель» или «наместник».
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: В данном контексте слово обозначает народ, которым руководит Симон; русский термин сохраняет этническое, религиозное и политико-региональное наложение значений.
- source_word: παντὶ τῷ ἔθνει
  choice: всему народу
  rationale: Передаёт собирательный смысл ἔθνος и синтаксически обозначает второго адресата писем наряду с Симоном.
- source_word: τοῦ βασιλέως
  choice: царя
  rationale: Родительный падеж естественно входит в сочетание «сын царя Димитрия» и точно передаёт царский титул.
theological_decisions:
- issue: Передача политического титула ἐθνάρχης
  choice: этнарх
  alternative: правитель народа; наместник
  rationale: Транслитерированный исторический титул не навязывает тексту более определённую модель власти, чем выражено в греческом источнике.
- issue: Объём значения Ἰουδαῖοι
  choice: иудеи
  alternative: жители Иудеи
  rationale: «Иудеи» наиболее естественно обозначает здесь народ в целом, но примечание сохраняет возможный регионально-политический оттенок исходного слова.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Порядок адресатов и множественное число «письма» сохранены; редкий титул «этнарх» пояснён в сноске.
