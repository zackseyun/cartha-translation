  text: And he was not willing to accept them[a], but rejected everything that he had previously agreed to with him[b], and became estranged from him.
translation:
  language: ru
  text: Он не хотел принимать их, но отверг всё, о чём прежде договорился с ним, и стал чуждаться его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал относиться к нему как к чужому».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἠβούλετο
  choice: не захотел
  rationale: Передаёт нежелание принять предложенное; в русском повествовании естественнее, чем буквальное «не желал», при этом смысл волевого отказа сохраняется.
- source_word: αὐτὰ δέξασθαι
  choice: принять их
  rationale: Местоимение сохраняет отсылку к названному ранее, не уточняя предмет сверх данного стиха; «принять» соответствует контексту предложения или приношения.
- source_word: ἠθέτησεν
  choice: отверг
  rationale: Передаёт отказ признавать или соблюдать прежние договорённости, не сужая значение до специального юридического термина.
- source_word: πάντα ὅσα συνέθετο αὐτῷ τὸ πρότερον
  choice: всё, о чём прежде договорился с ним
  rationale: Средний залог συντίθημι здесь имеет смысл достижения договорённости; формулировка естественна по-русски и сохраняет взаимный характер соглашения.
- source_word: ἠλλοτριοῦτο αὐτῷ
  choice: стал к нему относиться как к чужому
  rationale: Формулировка сохраняет образ чуждости в ἀλλοτριόομαι и обозначает начавшееся отчуждение, не усиливая его до открытой вражды.
