  text: For he knew that troubles had gathered against him[b][a], and the forces had abandoned him.
translation:
  language: ru
  text: Ведь он знал, что против него собрались беды[a], и войска покинули его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беды скопились против него». Греческий глагол выражает сосредоточение бед или враждебных обстоятельств.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вооружённые силы оставили его». Греческое слово имеет военное значение и, вероятно, обозначает поддерживавшие его отряды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: он знал
  rationale: Форма οἶδα обозначает продолжительное состояние знания в прошлом; простое «знал» естественно передаёт её по-русски.
- source_word: ἐπισυνῆκται
  choice: обступили
  rationale: 'Перфект ἐπισυνάγω указывает на уже сложившееся положение: беды собрались и окружили его. «Обступили» естественно передаёт сосредоточение враждебных обстоятельств, не превращая их в буквальные войска.'
- source_word: ἐπʼ αὐτόν
  choice: его
  rationale: При глаголе «обступили» направленность ἐπί выражена винительным падежом; в сноске сохранён более буквальный вариант «собрались против него».
- source_word: κακά
  choice: беды
  rationale: В данном контексте κακά означает несчастья и тяжёлые обстоятельства, а не нравственное зло. «Беды» широко и понятно передаёт этот смысл.
- source_word: ἀφῆκαν
  choice: покинули
  rationale: Аорист ἀφίημι здесь означает, что вооружённая поддержка оставила человека; «покинули» передаёт оттенок оставления без излишнего усиления.
- source_word: αἱ δυνάμεις
  choice: войска
  rationale: Во множественном числе δυνάμεις в военно-политическом повествовании обычно обозначает вооружённые силы. «Войска» естественнее по-русски, при этом притяжательное «его» не добавлено, поскольку его нет в греческом тексте.
