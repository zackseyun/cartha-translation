    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: расположился станом против
  rationale: Военный контекст и сочетание с ἐπί указывают на разбивку лагеря у города с враждебной целью, вероятно в рамках осады.
- source_word: Δῶρα
  choice: Доры
  rationale: Передаёт греческую форму топонима Δῶρα; родительный падеж обусловлен русским управлением после «против».
- source_word: δώδεκα μυριάδες
  choice: двенадцать мириад
  rationale: Сохраняет древнегреческую единицу счёта и образ выражения оригинала; числовое значение разъяснено в сноске.
- source_word: ἀνδρῶν πολεμιστῶν
  choice: воинов
  rationale: Естественно и точно обозначает мужчин, участвующих в боевых действиях, без тяжеловесного буквального оборота.
- source_word: ὀκτακισχίλια ἵππος
  choice: восемь тысяч всадников
  rationale: ἵππος буквально означает «конь», но здесь употреблено собирательно как военное обозначение конных бойцов.
