lexical_decisions:
- source_word: Τρύφων
  choice: Трифон
  rationale: Традиционная русская передача греческого личного имени.
- source_word: δὲ
  choice: же
  rationale: Частица обозначает мягкий повествовательный переход с оттенком противопоставления; постпозитивное «же» естественно передаёт это в русском языке.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: сел на корабль
  rationale: Аористное причастие от ἐμβαίνω с εἰς πλοῖον означает вступление на судно; «сел на корабль» — естественная современная формулировка, сохраняющая последовательность действий.
- source_word: ἔφυγεν
  choice: бежал
  rationale: Глагол φεύγω здесь обозначает бегство; «бежал» сохраняет смысл поспешного отступления и не добавляет значения успешного спасения.
- source_word: εἰς Ὀρθωσίαν
  choice: в Орфосию
  rationale: Предлог εἰς при названии места обозначает направление движения; «в» естественно употребляется с русской формой названия города.
