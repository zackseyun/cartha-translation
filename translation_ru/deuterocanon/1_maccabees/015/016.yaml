  text: Lucius[a], consul of the Romans, to King Ptolemy, greetings.
translation:
  language: ru
  text: 'Луций, римский консул, — царю Птолемею: приветствие.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблена обычная формула начала письма: «царю Птолемею — приветствие».'
    reason: cultural_note
lexical_decisions:
- source_word: Λεύκιος
  choice: Луций
  rationale: Традиционная русская форма латинского личного имени Lucius, переданного в греческом тексте как Λεύκιος.
- source_word: ὕπατος
  choice: консул
  rationale: Исторически точное обозначение римской государственной должности; в эллинистическом греческом ὕπατος обычно служит соответствием латинскому consul.
- source_word: Ῥωμαίων
  choice: римский
  rationale: Греческий родительный множественного числа буквально означает «римлян», но естественное русское название должности — «римский консул»; смысл принадлежности к римской государственной системе сохранён.
- source_word: Πτολεμαίῳ
  choice: Птолемею
  rationale: Устоявшаяся русская форма царского имени; дательный падеж обозначает адресата письма.
- source_word: βασιλεῖ
  choice: царю
  rationale: Прямое и традиционное русское соответствие царскому титулу βασιλεύς; форма дательного падежа согласуется с именем адресата.
- source_word: χαίρειν
  choice: приветствие
  rationale: Передаёт стандартную греческую эпистолярную формулу, а не буквальный призыв «радоваться»; двоеточие естественно оформляет русское начало письма.
