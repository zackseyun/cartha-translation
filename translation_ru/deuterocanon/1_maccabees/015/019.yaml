base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/019.yaml
  text: It therefore seemed good to us to write to the kings and the countries[a], that they should not seek harm against them, and should not make war against them and their cities and their countries[b], and that they should not join in alliance with those who are making war against them.
translation:
  language: ru
  text: Поэтому мы сочли уместным написать царям и странам[a], чтобы они не замышляли против них зла, не вели войны против них, их городов и их земель[b] и не вступали в союз с теми, кто воюет против них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Одно и то же греческое слово χώρα употреблено здесь о странах, которым адресовано письмо, а далее — о землях, принадлежащих иудеям; в обоих случаях возможны также переводы «земли» или «области».
    reason: lexical_alternative
  - marker: b
    text: В печатном тексте Суита перед словом «города» стоит буква Α, по-видимому вследствие издательской или транскрипционной ошибки; по контексту речь идёт об «их городах».
    reason: textual_variant
lexical_decisions:
- source_word: ἤρεσεν οὖν ἡμῖν
  choice: Поэтому мы сочли нужным
  rationale: Передаёт официальную формулу одобрения и принятого решения естественным современным русским языком, не превращая её в безличное «было решено».
- source_word: γράψαι τοῖς βασιλεῦσιν καὶ ταῖς χώραις
  choice: написать царям и странам
  rationale: Сохраняет прямое значение γράψαι и политический смысл χώραι как территориальных образований — адресатов письма.
- source_word: μὴ ἐκζητήσωσιν αὐτοῖς κακά
  choice: чтобы они не замышляли против них зла
  rationale: ἐκζητέω указывает на намеренное стремление причинить зло; «замышлять зло» естественно выражает этот смысл без добавления конкретного способа причинения вреда.
- source_word: μὴ πολεμήσωσιν αὐτοὺς
  choice: не воевали с ними
  rationale: Ясно и естественно передаёт формальный военно-политический смысл πολεμέω.
- source_word: τὰς πόλεις αὐτῶν καὶ τὰς χώρας αὐτῶν
  choice: с их городами и землями
  rationale: Для второго употребления χώρα выбрано «земли», поскольку речь идёт о принадлежащих им территориях; это естественнее по-русски, чем «их страны», при сохранении смысловой связи в примечании.
- source_word: ἵνα μὴ συμμαχώσιν
  choice: и не вступали в союз
  rationale: Передаёт значение военного союзничества, сохраняя официальный регистр.
- source_word: τοῖς πολεμοῦσιν αὐτούς
  choice: с теми, кто воюет против них
  rationale: Сохраняет настоящее, продолжающееся значение причастия и прямое обозначение враждующих сторон.
