  yaml_path: translation/deuterocanon/1_maccabees/015/023.yaml
  text: and to all the regions[a], and to Sampsame, and to the Spartans[b], and to Delos and to Myndus and to Sicyon and to Caria and to Samos and to Pamphylia and Lycia and to Halicarnassus and to Cos and to Side and to Aradus and to Rhodes and to Phaselis and Gortyna and Cnidus and Cyprus and Cyrene.
translation:
  language: ru
  text: 'А также во все области: в Сампсаму[a], к спартанцам, на Делос, в Минд, Сикион, Карию, на Самос, в Памфилию и Ликию, в Галикарнас, на Кос, в Сиду, Арад, на Родос, в Фаселиду, Гортину, Книд, на Кипр и в Кирену.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное местонахождение Сампсамы неизвестно; название передано близко к греческой форме.
    reason: cultural_note
lexical_decisions:
- source_word: πάσας τὰς χώρας
  choice: во все области
  rationale: χώρα обозначает область, территорию или землю; «области» естественно вводит перечень мест назначения и не вызывает ассоциации с современными государствами.
- source_word: Σαμψάμῃ
  choice: в Сампсаму
  rationale: Не вполне достоверно отождествлённый топоним передан близко к греческой форме; окончание согласовано с русским склонением.
- source_word: Σπαρτιάταις
  choice: к спартанцам
  rationale: Форма обозначает народ Спарты, а не сам город; предлог «к» передаёт направление послания к людям.
- source_word: καὶ εἰς ...
  choice: а также / в / на / к
  rationale: εἰς в перечне адресатов и мест назначения передаётся естественными русскими предлогами, выбранными по типу географического названия.
- source_word: τὴν Καρίδα
  choice: Карию
  rationale: В контексте имеется в виду область Кария; использована принятая русская форма топонима.
- source_word: τὴν Παμφυλίαν καὶ Λυκίαν
  choice: в Памфилию и Ликию
  rationale: Оба названия относятся к областям; общий предлог естественно распространяется на оба однородных члена.
- source_word: Κῶ
  choice: на Кос
  rationale: Использована общепринятая русская форма названия острова; предлог «на» соответствует русскому географическому употреблению.
- source_word: Ἄραδον
  choice: Арад
  rationale: Выбрана традиционная русская форма древнего города, соответствующая греческому Ἄραδος.
- source_word: τὴν Φασηλίδα
  choice: Фаселиду
  rationale: Сохранена форма «Фаселида», традиционно встречающаяся в русской библейской и исторической передаче этого топонима.
- source_word: Κνίδον
  choice: Книд
  rationale: Употреблена общепринятая русская форма греческого топонима Κνίδος.
theological_decisions: []
