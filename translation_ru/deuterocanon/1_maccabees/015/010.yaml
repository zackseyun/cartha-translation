lexical_decisions:
- source_word: Ἔτους τετάρτου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: В сто семьдесят четвёртом году
  rationale: Естественная русская форма датировки точно передаёт порядковое числительное; название эры не добавляется, поскольку его нет в греческом тексте.
- source_word: ἐξῆλθεν
  choice: отправился
  rationale: Передаёт выход и направленное движение Антиоха, не усиливая глагол до явно военного «выступил в поход».
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: в землю своих предков
  rationale: Сохраняет образ земли, принадлежавшей отцам Антиоха, а «предков» в современном русском естественно передаёт родовое значение πατέρων.
- source_word: συνῆλθον πρὸς αὐτὸν
  choice: к нему собрались
  rationale: Сохраняет значение совместного схождения и присоединения к Антиоху без лишнего уточнения мотивов.
- source_word: πᾶσαι αἱ δυνάμεις
  choice: все войска
  rationale: В военно-историческом контексте δυνάμεις обозначает военные силы; «войска» звучит естественно и ясно.
- source_word: ὥστε ὀλίγους εἶναι σὺν Τρύφωνι
  choice: так что с Трифоном остались лишь немногие
  rationale: Передаёт результат, вводимый ὥστε, и краткость греческой конструкции. «Немногие» сохраняет отсутствие точного числа, а «остались» естественно выражает подразумеваемый контекст перехода сил к Антиоху.
