review_pass:
  verdict: revise
  source_fidelity: Вторая сумма в 500 талантов верно понята как дополнительная и относящаяся и к разорению, и к φόροι городов. Однако «начнут войну» добавляет значение начала военных действий, которого в ἐκπολεμήσουσιν нет; глагол означает вести/развязать войну против адресатов. Оборот «в счёт податей с городов» также чрезмерно конкретизирует отношение городов к платежам как взимание именно с них, тогда как греческий генитив допускает более широкое «подати/дань городов».
  naturalness: Текст в целом современный и литературный. «Будут воевать против вас» естественнее и точнее в данном ультимативном контексте. «Подати городов» сохраняет исторический регистр и не навязывает направление платежа; пояснительная сноска фиксирует возможное «дань городов».
  terminology: «Таланты серебра», «разорение» и «подати» уместны. «Подати городов» лучше, чем «подати с городов», поскольку не снимает синтаксическую неоднозначность τῶν φόρων τῶν πόλεων. «Вместо них» сохраняет неуточнённую отсылку ἀντʼ αὐτῶν.
