lexical_decisions:
- source_word: εἰ δὲ μή
  choice: Если же нет
  rationale: Передаёт условный переход и при повторении сохраняет подчёркнутую форму ультиматума.
- source_word: δότε
  choice: дайте
  rationale: Формально соответствует широкому значению императива; финансовый смысл ясен из упоминания суммы.
- source_word: ἀντʼ αὐτῶν
  choice: вместо них
  rationale: Сохраняет значение замещения, не уточняя сверх контекста, к чему относится местоимение.
- source_word: πεντακόσια τάλαντα ἀργυρίου
  choice: пятьсот талантов серебра
  rationale: Естественно передаёт сумму и сохраняет древнюю единицу веса и денежного исчисления.
- source_word: τῆς καταφθορᾶς ἧς κατεφθάρατε
  choice: за причинённое вами разорение
  rationale: Передаёт тяжесть ущерба и ответственность адресатов, избегая неестественного буквального повтора однокоренных слов.
- source_word: τῶν φόρων τῶν πόλεων
  choice: податей с городов
  rationale: φόροι в данном политико-финансовом контексте означает обязательные платежи, налоги или дань; «подати» сохраняет исторический оттенок без излишней архаизации.
- source_word: ἀλλὰ τάλαντα πεντακόσια
  choice: ещё пятьсот талантов
  rationale: В сжатой синтаксической конструкции обозначает дополнительную вторую сумму.
- source_word: παραγενόμενοι
  choice: они придут
  rationale: Деепричастная по форме последовательность естественно передана личной формой, обозначающей прибытие перед военными действиями.
- source_word: ἐκπολεμήσουσιν ὑμᾶς
  choice: начнут войну против вас
  rationale: Передаёт направленное военное выступление и звучит естественно в контексте царской угрозы.
