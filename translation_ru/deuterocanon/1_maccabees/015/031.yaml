  text: But if not[a], give five hundred talents of silver in place of them, and another five hundred talents for the destruction that you have caused and for the taxes of the cities. But if not[b], they will come and make war against you.
translation:
  language: ru
  text: Если же нет, дайте вместо них пятьсот талантов серебра и ещё пятьсот талантов — за причинённое вами разорение и за подати городов[a]. Если же нет, они придут и будут воевать против вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за дань городов». Греческая конструкция сжата: дополнительные пятьсот талантов требуются как за причинённое разорение, так и за φόροι городов; точное отношение городов к этим платежам не уточнено.'
