  yaml_path: translation/deuterocanon/1_maccabees/015/014.yaml
  text: And he encircled the city[a], and the ships closed in from the sea; and he pressed the city from the land and from the sea[b], and he allowed no one to go out or to come in.
translation:
  language: ru
  text: Он окружил город[a], и корабли сомкнулись[b] со стороны моря; он теснил город с суши и с моря и никому не позволил ни выйти, ни войти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обложил город». Греческий глагол буквально обозначает окружение, тогда как значение осады следует из контекста.'
    reason: lexical_alternative
  - marker: b
    text: Глагол, переведённый как «сомкнулись», может означать соединение, сближение или вступление в столкновение; здесь, вероятно, речь о кораблях, сближавшихся для усиления осады со стороны моря.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: окружил
  rationale: Передаёт конкретный образ полного охвата города, не добавляя более узкого значения «осадил», которое определяется контекстом.
- source_word: συνῆψαν
  choice: сомкнулись
  rationale: При подлежащем «корабли» глагол описывает их сближение и смыкание у города со стороны моря; перевод сохраняет образ, не утверждая прямо, что началось морское сражение.
- source_word: συνέθλιβεν
  choice: теснил
  rationale: Сильный глагол в имперфекте обозначает продолжавшееся давление. «Теснил» естественно звучит в военном контексте и сохраняет длительность действия без неуместного буквального образа физического сокрушения города.
- source_word: ἀπὸ τῆς γῆς καὶ ἀπὸ τῆς θαλάσσης
  choice: с суши и с моря
  rationale: Сохраняет повтор направления давления с двух сторон и естественно звучит по-русски.
- source_word: οὐκ εἴασεν
  choice: никому не позволял
  rationale: Имперфект передан формой несовершенного вида, выражающей продолжавшийся запрет.
- source_word: ἐκπορεύεσθαι καὶ εἰσπορεύεσθαι
  choice: ни выйти, ни войти
  rationale: Естественная русская парная формула ясно передаёт полную блокаду; при общем отрицании греческое καί идиоматично передаётся конструкцией «ни… ни…».
