lexical_decisions:
- source_word: νῦν οὖν
  choice: Итак
  rationale: Передаёт логический переход к требованию и его непосредственность; отдельное «теперь» по-русски здесь было бы тяжеловесным и избыточным.
- source_word: παράδοτε
  choice: отдайте
  rationale: Прямой повелительный глагол, обозначающий передачу владения или контроля, без дополнительного оттенка капитуляции.
- source_word: τὰς πόλεις ἃς κατελάβετε
  choice: города, которые вы захватили
  rationale: καταλαμβάνω в данном политико-военном контексте означает силой овладеть городами; «захватили» ясно и естественно передаёт этот смысл.
- source_word: τοὺς φόρους τῶν τόπων
  choice: налоги с мест
  rationale: φόροι обозначает налоги или дань. «Налоги» — понятный современный эквивалент, а предлог «с» естественно выражает источник взимания.
- source_word: ὧν κατεκυριεύσατε
  choice: над которыми вы установили власть
  rationale: Передаёт приобретение господства или политического контроля, сохраняя результативный оттенок приставочного глагола.
- source_word: τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας
  choice: за пределами Иудеи
  rationale: Греческая конструкция сжата и синтаксически неловка; в контексте она, вероятнее всего, ограничивает требование территориями вне собственно Иудеи. Перевод передаёт вероятный смысл, а буквальная возможность отмечена в сноске.
theological_decisions:
- issue: Толкование пограничной формулы τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας
  choice: за пределами Иудеи
  alternative: 'буквальнее: «от границ Иудеи»; возможно также понимание «принадлежащих к границам Иудеи»'
  rationale: Это не доктринальный вопрос, но значимое текстовое толкование. Контекст указывает на города и доходы с территорий за границей Иудеи, однако сжатость греческой фразы не позволяет представить это как бесспорное буквальное значение; поэтому неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с прямым, официально-политическим тоном требования. Избегаются как архаичное «дань», так и канцелярски тяжёлые формулировки; неоднозначность заключительной греческой конструкции не скрыта.
