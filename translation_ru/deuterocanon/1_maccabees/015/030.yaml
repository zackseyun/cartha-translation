  text: Now then[a], hand over the cities that you seized, and the taxes of the places over which you gained control, beyond the borders of Judea.
translation:
  language: ru
  text: Итак, отдайте города, которые вы захватили, и налоги с мест, над которыми вы установили свою власть, за пределами Иудеи.[a]
