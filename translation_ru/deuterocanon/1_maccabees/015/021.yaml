  yaml_path: translation/deuterocanon/1_maccabees/015/021.yaml
  text: If[a], then, any pestilent men have escaped from their land to us, hand them over to Simon the high priest[b], so that he may punish them according to their law.
translation:
  language: ru
  text: Итак, если какие-либо зловредные люди[a] сбежали из своей страны к нам, выдайте их первосвященнику Симону, чтобы он наказал их[b] по их закону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злодеи», «смутьяны»; буквальнее — «люди, подобные заразе». Греческое λοιμοί — резкое обозначение опасных, пагубных людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «совершить над ними правосудие»; возможно также: «отомстить им». Греческий глагол может обозначать и наказание, и возмездие, однако слова «по их закону» указывают здесь прежде всего на судебное действие.'
    reason: alternative_reading
lexical_decisions:
- source_word: λοιμοὶ
  choice: зловредные люди
  rationale: При обозначении людей λοιμοί — резкое бранное слово о тех, кого считают опасными и пагубными, словно зараза. «Зловредные люди» сохраняет осуждающую силу образа, но не сводит его без достаточных оснований к юридическому термину «преступники».
- source_word: διαπεφεύγασιν
  choice: бежали
  rationale: Перфект обозначает совершившееся бегство с сохраняющимся результатом. В контексте выдачи беглецов русское «бежали» звучит естественно и передаёт переход из их страны во владения адресатов.
- source_word: χώρας
  choice: страны
  rationale: 'Здесь χώρα имеет политико-географический смысл: страна или территория. «Страна» естественно в сочетании «из своей страны» и не вводит лишней административной точности.'
- source_word: παράδοτε
  choice: выдайте
  rationale: Императив требует передать беглецов под власть Симона. «Выдайте» точно и естественно передаёт экстрадиционный характер распоряжения.
- source_word: ἀρχιερεῖ
  choice: первосвященнику
  rationale: Стандартное русское обозначение иудейского ἀρχιερεύς.
- source_word: ἐκδικήσει
  choice: покарал
  rationale: Глагол допускает значения возмездия и осуществления правосудия. «Покарал» сохраняет суровость действия, а оборот «по их закону» задаёт ему судебно-правовую рамку.
- source_word: κατὰ τὸν νόμον αὐτῶν
  choice: по их закону
  rationale: Сохранено множественное αὐτῶν — «их», без исправления на «его» и без уточнения, прямо не выраженного в греческом тексте.
theological_decisions:
- issue: Смысл ἐκδικήσει в правовом и политическом контексте
  choice: судебная кара, с сохранением оттенка возмездия
  alternative: отомстит им / совершит над ними возмездие
  rationale: Последующие слова «по их закону» указывают на законное разбирательство, а не на частную месть. При этом «покарал» не устраняет присущую глаголу строгость и возможность оттенка возмездия.
translation_notes:
  register: Современный литературный русский язык с официально-правовой интонацией царского распоряжения. Синтаксис остаётся ясным и достоинственным; резкость λοιμοί и смысловая напряжённость ἐκδικήσει сохранены и пояснены в сносках.
