lexical_decisions:
- source_word: περὶ δὲ Ἰόππης καὶ Γαζαρηνῶν αἰτεῖς
  choice: Что же до Иоппии и Газары, которых ты требуешь
  rationale: Греческое αἰτεῖς здесь по контексту означает требование передачи городов. Форма Γαζαρηνῶν в издании несколько необычна, но относится к Газаре; названия переданы в традиционной русской библейской форме.
- source_word: πληγὴν μεγάλην
  choice: великий ущерб
  rationale: Буквально πληγή — «удар, поражение»; в данном контексте речь о тяжёлом вреде, причинённом людям и земле. «Великий ущерб» сохраняет силу выражения и естественно звучит по-русски.
- source_word: τούτων δώσομεν τάλαντα ἑκατόν
  choice: За них мы дадим сто талантов
  rationale: Указательное τούτων относится к названным городам; перевод сохраняет краткость и переговорный характер предложения.
- source_word: οὐκ ἀπεκρίθη αὐτῷ λόγον
  choice: он ничего ему не ответил
  rationale: Греческая идиома буквально означает «не ответил ему ни слова»; выбран естественный русский эквивалент без уточнения не названного здесь субъекта.
