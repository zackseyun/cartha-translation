  yaml_path: translation/deuterocanon/1_maccabees/015/041.yaml
  text: And he fortified Kedron and stationed there cavalry and forces[a], so that by going out they might patrol the roads of Judea[c][b], just as the king had ordered him.
translation:
  language: ru
  text: Он укрепил Кедрон[a] и разместил там конницу[b] и войска, чтобы они выходили и патрулировали дороги Иудеи[c], как повелел ему царь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отстроил Кедрон». Греческий глагол буквально означает «построил» или «отстроил»; перевод «укрепил» обусловлен военным контекстом и последующим размещением войск.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всадников».'
    reason: lexical_alternative
  - marker: c
    text: Глагол, переведённый как «патрулировали», может также подразумевать движение по дорогам с целью их контроля, нападений или набегов.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: укрепил
  rationale: Глагол буквально означает «построил» или «обустроил», но военный контекст и последующее размещение войск указывают на укрепление города или опорного пункта.
- source_word: τὴν Κεδρὼν
  choice: Кедрон
  rationale: Название места передано транслитерацией греческой формы Κεδρών.
- source_word: ἔταξεν
  choice: разместил
  rationale: В сочетании с конницей и войсками глагол обозначает их назначение и расположение в определённом месте.
- source_word: ἵππεις
  choice: конницу
  rationale: Существительное во множественном числе обозначает всадников как род войск; «конница» естественно звучит в современном русском военном повествовании.
- source_word: δυνάμεις
  choice: войска
  rationale: Широкий военный термин; «войска» сохраняет обобщённый смысл и не уточняет вид подразделений.
- source_word: ἐκπορευόμενοι
  choice: выходили
  rationale: 'Причастие передаёт сопутствующее действие: войска должны были выходить из Кедрона для действий на дорогах.'
- source_word: ἐξοδεύωσιν
  choice: патрулировали
  rationale: Редкий глагол связан с передвижением по дорогам; в данном военном контексте речь, вероятно, идёт о контроле дорог, хотя возможен более агрессивный оттенок набегов или преследования.
- source_word: τὰς ὁδοὺς τῆς Ἰουδαίας
  choice: дороги Иудеи
  rationale: Прямо передаёт географический родительный падеж и естественно звучит по-русски.
- source_word: καθὰ συνετέταξεν αὐτῷ ὁ βασιλεύς
  choice: как повелел ему царь
  rationale: Форма глагола выражает ранее данное властное распоряжение; «повелел» соответствует царскому и военному контексту.
