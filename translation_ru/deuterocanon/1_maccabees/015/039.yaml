  yaml_path: translation/deuterocanon/1_maccabees/015/039.yaml
  text: And he commanded him to encamp opposite Judea[a]; and he commanded him to build Kedron and fortify the cities, and to fight against the people[b]. But the king was pursuing Tryphon.
translation:
  language: ru
  text: И приказал ему разбить лагерь напротив Иудеи[a]. Он также приказал ему построить Кедрон[b], укрепить города и воевать с народом. А царь тем временем преследовал Трифона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Иудеей», «лицом к Иудее». Греческое выражение обозначает расположение напротив или перед Иудеей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отстроить Кедрон». Греческий глагол сам по себе не уточняет, предстояло ли построить это место заново или восстановить и обустроить его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
  choice: приказал
  rationale: Передаёт властный характер распоряжения; повтор глагола в греческом тексте сохранён.
- source_word: παρεμβάλλειν
  choice: разбить лагерь
  rationale: Естественное современное выражение, сохраняющее военный смысл глагола.
- source_word: κατὰ πρόσωπον τῆς Ἰουδαίας
  choice: напротив Иудеи
  rationale: Передаёт прежде всего пространственное значение оборота, не добавляя преждевременно смысла враждебности.
- source_word: οἰκοδομῆσαι
  choice: отстроить
  rationale: В контексте укрепления военного пункта естественно обозначает обустройство или восстановление места, однако возможный смысл простого строительства отмечен в сноске.
- source_word: τὴν Κεδρὼν
  choice: Кедрон
  rationale: Топоним передан транслитерацией греческой формы.
- source_word: ὀχυρῶσαι
  choice: укрепить
  rationale: Точно и естественно передаёт создание или усиление оборонительных сооружений.
- source_word: τὰς πόλεις
  choice: города
  rationale: Прямой эквивалент греческого πόλεις.
- source_word: ὅπως πολεμῇ τὸν λαόν
  choice: воевать с народом
  rationale: Передаёт цель приказа и продолжительное ведение военных действий без стилистической тяжеловесности.
- source_word: τὸν λαόν
  choice: народ
  rationale: Сохраняет коллективное обозначение иудейского народа без современного политического оттенка слова «нация».
- source_word: ἐδίωκε
  choice: тем временем преследовал
  rationale: Имперфект передаёт продолжающееся фоновое действие; «тем временем» естественно обозначает его одновременность с приказами.
- source_word: Τρύφωνα
  choice: Трифона
  rationale: Традиционная русская передача греческого личного имени Τρύφων.
