  yaml_path: translation/deuterocanon/1_maccabees/015/029.yaml
  text: You have laid waste their borders[a], and you have inflicted a great blow on the land[c][b], and you have gained control of many places in my kingdom.
translation:
  language: ru
  text: Вы опустошили их земли[a], нанесли стране тяжёлый удар[b] и овладели многими местами в моём царстве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их пределы»; греческое выражение может обозначать границы, пограничные области или территорию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «причинили стране огромный ущерб»; греческое слово может означать удар, рану, поражение или бедствие.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «стали господствовать над многими местами в моём царстве»; греческий глагол означает обретение или осуществление господства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὅρια αὐτῶν
  choice: их земли
  rationale: ὅρια может обозначать не только пограничные линии, но и ограниченную ими территорию; при глаголе «опустошили» естественное русское сочетание «их земли» яснее передаёт территориальный смысл.
- source_word: ἠρημώσατε
  choice: опустошили
  rationale: Глагол означает приводить в запустение, разорять; «опустошили» точно и естественно передаёт результат военного разорения.
- source_word: πληγὴν μεγάλην
  choice: тяжёлый удар
  rationale: πληγή допускает значения удара, раны, бедствия или поражения. В военно-политической жалобе «тяжёлый удар» сохраняет образ и не вводит значение эпидемии.
- source_word: ἐπὶ τῆς γῆς
  choice: стране
  rationale: γῆ здесь обозначает землю или страну, которой причинён ущерб; дательный оборот «нанесли стране» естественно передаёт греческую конструкцию.
- source_word: ἐκυριεύσατε
  choice: овладели
  rationale: Глагол выражает установление господства или контроля. «Овладели» подходит к территориальному контексту, не утверждая непременно законной власти.
- source_word: τόπων πολλῶν
  choice: многими местами
  rationale: Буквальное широкое обозначение τόποι сохранено без уточнения, будто речь идёт об административных областях.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: в моём царстве
  rationale: βασιλεία здесь означает владения царя; «царство» — прямой и уместный эквивалент.
