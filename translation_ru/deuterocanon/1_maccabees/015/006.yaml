  footnotes:
  - marker: a
    text: 'Или: «изготовлять собственную чеканную монету как денежную единицу твоей страны». В греческом тексте употреблён общий глагол «делать» и слова, обозначающие чеканную монету и деньги, находящиеся в обращении.'
