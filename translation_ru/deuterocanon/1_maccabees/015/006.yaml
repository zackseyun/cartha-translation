lexical_decisions:
- source_word: ποιῆσαι
  choice: чеканить
  rationale: Хотя ποιέω буквально означает «делать, изготовлять», при объекте κόμμα в контексте права выпуска денег современное русское «чеканить» естественно и точно передаёт подразумеваемое действие.
- source_word: κόμμα
  choice: монету
  rationale: Здесь слово обозначает чеканную монету или монетный выпуск; единственное число в русском может иметь собирательное значение и хорошо подходит к административной привилегии.
- source_word: ἴδιον
  choice: собственную
  rationale: Передаёт принадлежность адресату и его право на особый монетный выпуск.
- source_word: νόμισμα
  choice: которая будет иметь хождение
  rationale: νόμισμα означает находящиеся в обращении деньги; придаточная конструкция по-русски ясно передаёт назначение собственной монеты и избегает неестественного повторения «монета — валюта».
- source_word: τῆς χώρας σου
  choice: в твоей стране
  rationale: χώρα здесь обозначает подвластную адресату страну или территорию; предложная форма соответствует русскому выражению «иметь хождение в стране».
