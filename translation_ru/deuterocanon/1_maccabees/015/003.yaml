  text: Since certain pestilent men seized control of the kingdom of our fathers[a], and I want to reclaim the kingdom so that I may restore it as it was before, I have enlisted a multitude of forces and equipped warships[c][b];
translation:
  language: ru
  text: Так как некие злодеи захватили царство наших отцов[a], я намерен претендовать на это царство, чтобы восстановить его таким, каким оно было прежде; я набрал многочисленное войско[b] и снарядил боевые корабли[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «некие язвы (или моры) овладели царством наших отцов»; греческое λοιμοί здесь, вероятно, служит бранным обозначением пагубных людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «набрал множество воинов»; греческий глагол может также подразумевать набор чужеземных или наёмных войск.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «подготовил» либо «построил боевые корабли»; греческий глагол допускает значения как оснащения и подготовки, так и сооружения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Так как
  rationale: Передаёт причинно-пояснительную связь с последующими действиями говорящего.
- source_word: τινες λοιμοὶ
  choice: некие злодеи
  rationale: Буквально λοιμοί означает «моры, язвы», но здесь это бранное метафорическое обозначение пагубных людей; «злодеи» естественно передаёт личное и резко отрицательное значение.
- source_word: κατεκράτησαν
  choice: захватили
  rationale: В сочетании с родительным падежом обозначает овладение и установление власти над царством.
- source_word: τῆς βασιλείας τῶν πατέρων ἡμῶν
  choice: царство наших отцов
  rationale: Сохраняет династический и родовой смысл греческого сочетания без сведения βασιλεία к отвлечённой «царской власти».
- source_word: βούλομαι
  choice: я намерен
  rationale: В официальном политическом контексте естественно передаёт волю и намерение говорящего.
- source_word: ἀντιποιήσασθαι τῆς βασιλείας
  choice: вернуть себе это царство
  rationale: Средний залог с родительным падежом выражает притязание на владение; контекст наследственного царства допускает естественное «вернуть себе», не утверждая отдельно юридическую правомерность притязания.
- source_word: ὅπως ἀποκαταστήσω αὐτὴν
  choice: чтобы восстановить его
  rationale: Точно передаёт целевое значение ὅπως и смысл восстановления прежнего состояния.
- source_word: ὡς ἦν τὸ πρότερον
  choice: таким, каким оно было прежде
  rationale: Ясно и естественно обозначает возвращение царства к прежнему состоянию.
- source_word: ἐξενολόγησα πλῆθος δυνάμεων
  choice: набрал многочисленное войско
  rationale: Передаёт военный набор большого количества сил; возможный оттенок набора чужеземных или наёмных воинов отмечен в сноске.
- source_word: κατεσκεύασα πλοῖα πολεμικά
  choice: снарядил боевые корабли
  rationale: κατασκευάζω может означать подготовить, оснастить или построить; «снарядил» естественно выражает подготовку кораблей к войне без утверждения, что они были построены заново.
