    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὀφείλημα βασιλικόν
  choice: всякая задолженность царю
  rationale: Сочетание обозначает всё, что причитается царю; «задолженность царю» ясно передаёт фискальный контекст и не создаёт ошибочного впечатления, будто должен сам царь.
- source_word: τὰ ἐσόμενα βασιλικά
  choice: будущие царские поступления
  rationale: Субстантивированное прилагательное с будущим причастием указывает на будущие суммы, которые должны поступить царю, не уточняя их категорию.
- source_word: ἀπὸ τοῦ νῦν καὶ εἰς τὸν ἅπαντα χρόνον
  choice: отныне и на все времена
  rationale: Формула передаёт как начальную точку действия указа, так и заявленную неограниченную продолжительность.
- source_word: ἀφέσθω σοι
  choice: да будут тебе прощены
  rationale: Юридико-фискальное значение ἀφίημι здесь — освободить от уплаты, простить причитающееся; форма «да будут» сохраняет постановляющий стиль указа.
