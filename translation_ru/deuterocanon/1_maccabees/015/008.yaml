  text: And let every royal debt[a], and the royal revenues yet to come, from now on and for all time, be remitted to you.
translation:
  language: ru
  text: И всякая задолженность царю, а также будущие царские поступления[a] отныне и на все времена да будут тебе прощены.
  philosophy: optimal-equivalence
