  text: And Athenobius, the king’s friend, came to Jerusalem, and he saw the splendor of Simon, and a display of gold and silver vessels, and an impressive retinue; and he was astonished, and reported to him the king’s words.
translation:
  language: ru
  text: И прибыл Афинобий, друг царя, в Иерусалим. Увидев великолепие Симона, выставленную золотую и серебряную утварь[a] и многочисленную свиту, он поразился и передал Симону слова царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово κυλίκιον редко и трудно для точного истолкования; возможно, здесь имеется в виду стол или сервиз с дорогой золотой и серебряной посудой, предназначенной для питья.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηνόβιος
  choice: Афинобий
  rationale: Традиционная русская передача греческого личного имени с учётом произношения θ как «ф».
- source_word: φίλος τοῦ βασιλέως
  choice: друг царя
  rationale: Формально передаёт греческое выражение и сохраняет возможность понимать его как придворный титул, не подменяя его более узким толкованием.
- source_word: δόξαν
  choice: великолепие
  rationale: В повествовательном контексте речь идёт о видимом блеске и высоком положении Симона, а не о богословской «славе».
- source_word: κυλίκιον μετὰ χρυσωμάτων καὶ ἀργυρωμάτων
  choice: выставленную золотую и серебряную утварь
  rationale: Редкое κυλίκιον, вероятно, обозначает выставленный столовый или питейный сервиз; обобщённая передача сохраняет предметный и зрительный характер сцены, не навязывая спорной точной идентификации.
- source_word: παράστασιν ἱκανήν
  choice: многочисленную свиту
  rationale: Выражение указывает на значительное число сопровождавших или прислуживавших Симону людей; «свита» естественно передаёт придворный контекст.
- source_word: ἐξίστατο
  choice: поразился
  rationale: Передаёт сильное изумление Афинобия естественным современным русским глаголом.
- source_word: ἀπήγγειλεν αὐτῷ τοὺς λόγους τοῦ βασιλέως
  choice: передал Симону слова царя
  rationale: Явное имя вместо местоимения устраняет возможную русскую двусмысленность адресата, который однозначно определяется контекстом, и сохраняет содержание греческой фразы.
