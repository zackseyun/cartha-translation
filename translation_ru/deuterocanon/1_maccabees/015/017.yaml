lexical_decisions:
- source_word: πρεσβευταὶ
  choice: послы
  rationale: Передаёт официальных дипломатических представителей естественным и современным русским словом.
- source_word: φίλοι ἡμῶν καὶ σύμμαχοι
  choice: наши друзья и союзники
  rationale: Сохраняет различие между отношениями дружбы и формальным союзом.
- source_word: ἀνανεούμενοι
  choice: чтобы возобновить
  rationale: Естественно выражает цель прибытия; греческое причастие обозначает обновление ранее установленных отношений.
- source_word: τὴν ἐξ ἀρχῆς φιλίαν καὶ συμμαχίαν
  choice: прежнюю дружбу и союз
  rationale: По смыслу ἐξ ἀρχῆς указывает на отношения, установленные ранее; «прежнюю» звучит по-русски естественнее буквального «от начала».
- source_word: ἀπεσταλμένοι ἀπὸ
  choice: были посланы
  rationale: Передаёт страдательное значение и естественно обозначает тех, по чьему поручению прибыли послы.
- source_word: Σιμωνος τοῦ ἀρχιερέως
  choice: первосвященником Симоном
  rationale: ἀρχιερεύς традиционно и точно передаётся словом «первосвященник».
- source_word: τοῦ δήμου τῶν Ἰουδαίων
  choice: народом иудеев
  rationale: δῆμος здесь обозначает народ как общественно-политическое целое; примечание сохраняет возможный оттенок гражданского собрания.
