  yaml_path: translation/deuterocanon/1_maccabees/015/007.yaml
  text: But Jerusalem and the holy places are to be free; and all the weapons that you have made[a], and the strongholds that you have built, which you hold, shall remain yours.
translation:
  language: ru
  text: А Иерусалим и святые места[a] пусть будут свободны; и всё оружие, которое ты изготовил, и укрепления, которые ты построил и которыми владеешь, пусть останутся у тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилище» либо «святыни». Греческое выражение τὰ ἅγια может обозначать священные места или священные предметы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ
  choice: Иерусалим
  rationale: Общепринятая русская форма названия города.
- source_word: τὰ ἅγια
  choice: святые места
  rationale: Субстантивированное среднее множественное может обозначать священные места, святилище или священные предметы; в контексте статуса Иерусалима уместно широкое пространственное обозначение без неоправданного сужения.
- source_word: ἐλεύθερα
  choice: свободны
  rationale: Прямая передача царской уступки свободы от вмешательства или повинностей; намеренно сохранена широта значения.
- source_word: ὅπλα
  choice: оружие
  rationale: Естественное современное обозначение военного снаряжения; русское собирательное единственное число соответствует греческому множественному по смыслу.
- source_word: κατεσκεύασας
  choice: изготовил
  rationale: Передаёт совершённое изготовление или устройство оружия точнее, чем более широкое «приготовил».
- source_word: ὀχυρώματα
  choice: укрепления
  rationale: Широкое военно-инженерное обозначение укреплённых сооружений, не ограничивающее смысл отдельными крепостями.
- source_word: ᾠκοδόμησας
  choice: построил
  rationale: Прямая и естественная передача глагола строительства применительно к укреплениям.
- source_word: ὧν κρατεῖς
  choice: которыми владеешь
  rationale: Передаёт фактическое удержание и обладание укреплениями; «контролируешь» звучало бы более административно и современно.
- source_word: μενέτω σοι
  choice: пусть останутся у тебя
  rationale: Естественно выражает разрешение сохранить владение; число согласовано по-русски с ближайшим множественным «укрепления», тогда как греческое сказуемое имеет собирательное единственное число.
