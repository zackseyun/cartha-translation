  text: And King Antiochus pursued him[a], and he came to Dora, fleeing to the seacoast.
translation:
  language: ru
  text: Царь Антиох преследовал его, а тот, спасаясь бегством, пришёл в Дору, расположенную у моря.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Дору у моря». Греческий оборот характеризует Дору как город, расположенный у моря.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: погнался
  rationale: Глагол διώκω обозначает активное преследование; «погнался» естественно передаёт начавшееся военное преследование, не уточняя его способ.
- source_word: Ἀντίοχος ὁ βασιλεύς
  choice: царь Антиох
  rationale: В современном русском повествовательном стиле титул естественно ставится перед именем.
- source_word: ἦλθεν εἰς Δῶρα
  choice: прибыл в Дору
  rationale: В данном контексте ἔρχομαι описывает достижение города после бегства; «прибыл» ясно передаёт движение к месту назначения.
- source_word: φεύγων
  choice: спасаясь бегством
  rationale: Причастие обозначает действие, сопутствующее прибытию; этот оборот естественно передаёт, что преследуемый бежал от опасности.
- source_word: τὴν ἐπὶ τὴν θάλασσαν
  choice: расположенную у моря
  rationale: Греческий оборот характеризует Дору как город у моря. Такой перевод сохраняет географический акцент и избегает впечатления, будто побережье было отдельным от Доры пунктом назначения.
