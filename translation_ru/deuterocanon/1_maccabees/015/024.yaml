lexical_decisions:
- source_word: τὸ δὲ ἀντίγραφον
  choice: А копию
  rationale: ἀντίγραφον обозначает копию документа; «копию» естественно передаёт административный контекст, а δέ здесь выражено присоединительным «а».
- source_word: αὐτῶν
  choice: с них
  rationale: Сохранено формально множественное число греческого местоимения и его отсылка к предшествующим письменным распоряжениям; русский оборот «копию с них» позволяет не заменять множественное число единственным.
- source_word: ἔγραψεν
  choice: он написал
  rationale: Передано основное значение глагола γράφω без добавления не выраженной прямо идеи отправки.
- source_word: Σίμωνι τῷ ἀρχιερεῖ
  choice: первосвященнику Симону
  rationale: Дательный падеж передаёт адресата, а «первосвященник» — устоявшийся русский эквивалент ἀρχιερεύς в иудейском контексте.
