  text: And Cendebeus came to Jamnia[b][a], and began to provoke the people and to invade Judea and to take the people captive and to kill them.
translation:
  language: ru
  text: Кендевей прибыл в Ямнию и начал раздражать народ, вторгаться в Иудею[a], брать людей в плен и убивать их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «входить в Иудею»; греческий глагол допускает более буквальный перевод, но контекст указывает на враждебное военное вторжение.'
    reason: lexical_alternative
  - marker: b
    text: 'Местоимение «их» отсутствует в греческом тексте, но подразумевается как общий объект последовательных действий: «брать людей в плен и убивать [их]».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγενήθη
  choice: прибыл
  rationale: Аорист παραγίνομαι обозначает прибытие в указанное место; «прибыл» естественно для повествования и точнее передаёт завершённое перемещение.
- source_word: Κενδεβαῖος
  choice: Кендевей
  rationale: Традиционная русская передача греческого личного имени, соответствующая форме Κενδεβαῖος.
- source_word: Ἰαμνείαν
  choice: Ямнию
  rationale: Устоявшаяся русская форма географического названия Ἰαμνεία.
- source_word: ἤρξατο τοῦ ἐρεθίζειν
  choice: начал притеснять
  rationale: Конструкция означает начало действия. В данном военном контексте ἐρεθίζω передаёт враждебные действия против населения; «притеснять» звучит естественно, не уточняя способ сверх текста.
- source_word: τὸν λαόν
  choice: народ / людей
  rationale: λαός обозначает народ как коллектив; при последующем пленении русское «людей» позволяет естественно обозначить отдельных представителей того же народа.
- source_word: ἐμβατεύειν εἰς τὴν Ἰουδαίαν
  choice: вторгаться в Иудею
  rationale: Сам глагол допускает значение «входить», однако сочетание с пленением и убийством ясно задаёт контекст враждебного военного вторжения.
- source_word: αἰχμαλωτίζειν
  choice: брать людей в плен
  rationale: Глагол обозначает захват людей в плен, особенно во время военных действий.
- source_word: φονεύειν
  choice: убивать их
  rationale: φονεύω означает «убивать». Местоимение «их» естественно восполняет по-русски подразумеваемый объект — ранее упомянутых людей.
