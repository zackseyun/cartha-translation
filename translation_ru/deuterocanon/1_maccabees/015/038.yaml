  text: And the king appointed Cendebaeus commander of the coastal region, and gave him infantry and cavalry forces.
translation:
  language: ru
  text: И царь назначил Кендевея военачальником приморской области и дал ему пешие и конные войска.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  choice: назначил
  rationale: В административно-военном контексте глагол означает официальное поставление на должность; «назначил» естественно и точно передаёт это действие.
- source_word: Κενδεβαῖον
  choice: Кендевея
  rationale: Форма имени «Кендевей» соответствует принятой русской библейской традиции и здесь поставлена в винительном падеже.
- source_word: ἐπιστράτηγον
  choice: военачальником
  rationale: Термин обозначает военного начальника, поставленного над определённой территорией; «военачальник» сохраняет военный смысл, не уточняя сверх текста характер должности.
- source_word: τῆς παραλίας
  choice: приморской области
  rationale: παραλία может обозначать не только берег, но и прибрежную территорию; при названии должности речь идёт о территориальной сфере полномочий.
- source_word: δυνάμεις πεζικὰς καὶ ἱππικὰς
  choice: пешие и конные войска
  rationale: Сочетание обозначает воинские силы двух родов — пехоту и конницу; выбранная формулировка близка структуре греческого текста и понятна современному читателю.
- source_word: ἔδωκεν αὐτῷ
  choice: дал ему
  rationale: Прямой эквивалент простого греческого выражения; военный контекст ясно показывает, что войска были переданы в его распоряжение.
