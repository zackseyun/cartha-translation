lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Мы же
  rationale: Частица δέ выражает контраст с предшествующим высказыванием; конструкция «мы же» естественно передаёт его по-русски.
- source_word: καιρὸν ἔχοντες
  choice: пока у нас есть благоприятная возможность
  rationale: καιρός обозначает подходящий, благоприятный момент, а не просто время; причастный оборот передан естественной временной конструкцией без устранения оттенка удобного случая.
- source_word: ἀντεχόμεθα
  choice: твёрдо держимся
  rationale: Средний залог передаёт стойкую приверженность и удержание; выбранная формулировка сохраняет эту силу, не сводя смысл исключительно к юридическому притязанию.
- source_word: τῆς κληρονομίας
  choice: наследия
  rationale: В данном контексте κληρονομία означает наследственную собственность, родовое достояние; «наследие» естественно охватывает как унаследованное владение, так и связь с предками.
- source_word: ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: принадлежащего нам и нашим отцам
  rationale: Оба родительных определения относятся к одному κληρονομία; причастный оборот ясно показывает единое наследие и избегает впечатления, будто речь идёт о двух разных наследствах.
