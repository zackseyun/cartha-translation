lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный соединительный союз, продолжающий повествование без уточнения временной последовательности.
- source_word: ταῦτα
  choice: обо всём этом
  rationale: Естественно передаёт указательное местоимение среднего рода во множественном числе и его отсылку к ранее изложенному содержанию.
- source_word: ἔγραψεν
  choice: написал
  rationale: Прямое и идиоматичное соответствие аористу γράφω в значении письменного сообщения.
- source_word: Δημητρίῳ τῷ βασιλεῖ
  choice: царю Деметрию
  rationale: Русский порядок слов естественно передаёт приложение «Деметрию, царю»; титул относится только к Деметрию.
- source_word: Ἀττάλῳ
  choice: Атталу
  rationale: Общепринятая русская форма исторического имени Аттал в дательном падеже.
- source_word: Ἀράθῃ
  choice: Ариарату[a]
  rationale: Несмотря на чтение Ἀράθῃ у Света, по историческому контексту здесь, вероятнее всего, имеется в виду царь Ариарат; примечание сохраняет прозрачность текстологической формы.
- source_word: Ἀρσάκῃ
  choice: Арсаку
  rationale: Общепринятая русская форма царского имени Арсак в дательном падеже.
