- from: Итак, теперь я оставляю в силе для тебя все льготы[b], которые даровали тебе цари, бывшие до меня, и все прочие льготы, которые он тебе даровал[a].
  to: Итак, теперь я подтверждаю за тобой все льготы[b], которые предоставили тебе цари до меня, а также любые другие льготы, которые он тебе предоставил[a].
  rationale: Правка улучшает естественность современного литературного русского и точнее передаёт юридико-административную функцию глагола ἵστημι. Она также яснее выражает неограниченный охват «других» льгот. Переданное в греческом тексте несогласованное единственное число последнего глагола не нормализовано и сохранено вместе со сноской.
