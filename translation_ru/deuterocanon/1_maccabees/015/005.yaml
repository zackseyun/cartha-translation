translation:
  language: ru
  text: Итак, теперь я подтверждаю за тобой все льготы[b], которые предоставили тебе цари до меня, а также любые другие льготы, которые он тебе предоставил[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В принятом греческом тексте последний глагол стоит в единственном числе — «он предоставил тебе», хотя ранее говорится о царях во множественном числе. Возможно, это особенность сохранившегося текста; по смыслу можно было бы ожидать: «они предоставили тебе».'
    reason: textual_variant
  - marker: b
    text: Под «льготами» здесь понимаются царские послабления в налогах, сборах или иных повинностях; речь не обязательно идёт о полном освобождении от всех обязательств.
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: Итак, теперь
  rationale: Передаёт и выводное значение οὖν, и временное значение νῦν, сохраняя официальный переход в царском заявлении.
- source_word: ἵστημί
  choice: оставляю в силе
  rationale: В административно-правовом контексте означает утверждение или сохранение действия ранее предоставленных льгот; эта формулировка естественна по-русски и не предполагает физического значения «ставлю».
- source_word: σοι
  choice: для тебя
  rationale: Сохраняет значение лица, в пользу которого подтверждаются льготы.
- source_word: πάντα τὰ ἀφαιρέματα
  choice: все льготы
  rationale: ἀφαιρέματα обозначает снятые или уменьшенные взыскания и иные царские послабления. «Льготы» естественно передаёт широкий административно-фискальный смысл без неоправданного уточнения.
- source_word: ἃ ἀφῆκάν σοι
  choice: которые даровали тебе
  rationale: Форма ἀφίημι здесь относится к предоставлению послаблений; «даровали» соответствует торжественному регистру царского указа.
- source_word: οἱ πρὸ ἐμοῦ βασιλεῖς
  choice: цари, бывшие до меня
  rationale: Прямо передаёт временную последовательность правителей и звучит естественно в русском историческом повествовании.
- source_word: καὶ ὅσα ἄλλα ἀφαιρέματα
  choice: и все прочие льготы
  rationale: Передаёт открытую совокупность дополнительных, не перечисленных по отдельности уступок.
- source_word: ἀφῆκέν σοι
  choice: которые он тебе даровал
  rationale: Сохраняет неожиданное единственное число глагола в принятом греческом тексте, не исправляя его молча на множественное.
