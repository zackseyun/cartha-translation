  text: But King Antiochus encamped against Dora a second time[a], continually bringing his forces against it and constructing siege engines[b], and he shut Tryphon in so that he could neither go in nor go out.
translation:
  language: ru
  text: Царь Антиох во второй раз[a] расположился лагерем против Доры, непрестанно направляя против неё свои силы и сооружая осадные машины. Он запер Трифона, не давая ему ни войти, ни выйти.
  philosophy: optimal-equivalence
