    reason: alternative_reading
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Δωρὰ
  choice: расположился лагерем против Доры
  rationale: Военный смысл παρεμβάλλω и враждебная направленность ἐπί переданы ясно и естественно.
- source_word: ἐν τῇ δευτέρᾳ
  choice: во второй раз
  rationale: Эллиптическое выражение в данном контексте вероятнее всего указывает на повторное расположение лагерем или выступление против города; неоднозначность отмечена в сноске.
- source_word: προσάγων διὰ παντὸς αὐτῇ τὰς χεῖρας
  choice: непрестанно направляя против неё свои силы
  rationale: Буквальное «подводя к ней руки» представляет военную идиому постоянного наступательного давления; «свои силы» передаёт её смысл без неестественного буквализма.
- source_word: μηχανὰς ποιούμενος
  choice: сооружая осадные машины
  rationale: В контексте осады μηχαναί обозначает военные осадные устройства.
- source_word: συνέκλεισεν τὸν Τρύφωνα
  choice: окружил Трифона
  rationale: συνέκλεισεν означает замкнуть, окружить или запереть; «окружил» естественно сочетается с последующим полным ограничением передвижения.
- source_word: τοῦ εἰσπορεύεσθαι καὶ ἐκπορεύεσθαι
  choice: не давая ему ни войти, ни выйти
  rationale: Конструкция передаёт воспрепятствование движению внутрь и наружу и подчёркивает полноту блокады.
