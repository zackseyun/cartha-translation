  source_fidelity: 'Основной перевод точно передаёт военный контекст: Антиох располагается лагерем против Доры, постоянно ведёт осадные действия и лишает Трифона возможности передвигаться. «Окружил» допустимо, но «запер» точнее передаёт συνέκλεισεν и лучше объясняет последующее ограничение входа и выхода. Выражение ἐν τῇ δευτέρᾳ эллиптично; «во второй раз» — естественное основное понимание, но сноска должна отражать реальную формальную неоднозначность, а не неподтверждённые варианты «этап» или «позиция».'
