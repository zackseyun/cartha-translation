  text: 'And Numenius and those with him came back from Rome[a], bringing letters to the kings and the countries, in which these things had been written:'
translation:
  language: ru
  text: 'И Нумений и его спутники вернулись из Рима[a], привезя письма царям и странам, в которых было написано следующее:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «пришли… из Рима»; из контекста ясно, что они вернулись оттуда после посольства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: вернулись
  rationale: Греческая форма буквально означает «пришёл», причём сказуемое стоит в единственном числе при составном подлежащем. Однако из контекста ясно, что Нумений возвращается из посольства в Рим; русское множественное число естественно согласуется с Нумением и его спутниками.
- source_word: οἱ παρʼ αὐτοῦ
  choice: его спутники
  rationale: Идиома обозначает людей, находившихся при Нумении и сопровождавших его; «его спутники» передаёт это кратко и естественно.
- source_word: ἐκ Ῥώμης
  choice: из Рима
  rationale: Обычная передача ἐκ с названием места, откуда прибыли.
- source_word: ἔχοντες ἐπιστολάς
  choice: привезя письма
  rationale: 'Причастный оборот выражает сопутствующее обстоятельство: они прибыли, имея при себе официальные письма. «Привезя» естественно передаёт это движение в русском языке.'
- source_word: τοῖς βασιλεῦσι καὶ ταῖς χώραις
  choice: царям и странам
  rationale: Дательный падеж указывает адресатов писем. χώρα здесь допускает значения «страна», «земля» или «область»; «странам» — ясный современный эквивалент.
- source_word: ἐν αἷς ἐγέγραπτο τάδε
  choice: в которых было написано следующее
  rationale: Фраза вводит содержание писем. «Следующее» естественно выполняет вводную функцию перед цитатой, хотя буквально τάδε означает «это/вот что».
