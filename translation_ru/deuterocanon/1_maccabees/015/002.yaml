  footnotes:
  - marker: a
    text: 'Буквальнее: «они содержали такую форму (формулировку)» или «были следующего содержания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «народу иудеев»; греческое Ἰουδαίων может обозначать как иудеев в этническом и религиозном смысле, так и жителей Иудеи.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν περιέχουσαι
  choice: содержали они
  rationale: Сочетание описывает содержание упомянутых ранее писем. Русское «содержали они» передаёт греческую конструкцию достаточно близко и при этом звучит естественнее буквального «были содержащими».
- source_word: τὸν τρόπον τοῦτον
  choice: следующее
  rationale: В документальной вводной формуле выражение указывает на последующее содержание или формулировку. «Следующее» естественно по-русски; более буквальное «такую форму» отмечено в сноске.
- source_word: ἱερεῖ μεγάλῳ
  choice: первосвященнику
  rationale: Это общепринятое русское обозначение иудейской должности верховного священника.
- source_word: ἐθνάρχῃ
  choice: этнарху
  rationale: Сохранён конкретный эллинистический политический титул, а не заменён более общим словом «правитель».
- source_word: ἔθνει Ἰουδαίων
  choice: иудейскому народу
  rationale: ἔθνος здесь обозначает народ как целое, а Ἰουδαίων допускает этнорелигиозное и географическое понимание. В основном тексте выбрано естественное коллективное выражение «иудейский народ».
- source_word: χαίρειν
  choice: приветствие
  rationale: В начале письма это устойчивая эпистолярная формула, а не самостоятельный призыв «радуйтесь».
theological_decisions:
- issue: Передача политико-этнического обозначения Ἰουδαίων
  choice: иудейскому народу
  alternative: народу Иудеи / народу иудеев
  rationale: В обращении царского письма речь, вероятнее всего, идёт о коллективном народе, а не только о жителях географической области. Возможный географический оттенок сохранён в сноске.
- issue: Степень идиоматичности вводной формулы документа
  choice: содержали они следующее
  alternative: содержали такую формулировку
  rationale: Выбран естественный русский оборот, сохраняющий указание на содержание писем и не воспроизводящий неуклюже греческую перифрастическую конструкцию.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского послания. Синтаксис обращения оформлен тире для ясности; исторический титул «этнарх» сохранён.
