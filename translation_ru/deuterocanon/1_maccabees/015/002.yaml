  text: 'And they contained this form: “King Antiochus to Simon the high priest and ethnarch[a], and to the nation of the Jews[b], greetings.”'
translation:
  language: ru
  text: 'Их содержание было следующим[a]: «Царь Антиох — Симону, первосвященнику и этнарху, и иудейскому народу[b] — приветствие».'
