  yaml_path: translation/deuterocanon/1_maccabees/015/004.yaml
  text: But I want to go out into the country[a], so that I may pursue those who have devastated our country and laid waste many cities in the kingdom[b];
translation:
  language: ru
  text: Но я хочу выступить в поход по стране[a], чтобы преследовать[b] тех, кто разорил нашу страну и опустошил многие города в царстве;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пройти по всей стране»; выражение κατὰ τὴν χώραν может обозначать движение по территории или через неё.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выступить против» или «покарать»; глагол μετέρχομαι может означать преследование виновных с враждебным намерением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βούλομαι
  choice: хочу
  rationale: Передаёт личное желание и намерение говорящего прямо и естественно для современного русского языка.
- source_word: ἐκβῆναι κατὰ τὴν χώραν
  choice: выступить в поход по стране
  rationale: Глагол ἐκβαίνω выражает выход или выступление, а κατά с винительным при движении — продвижение по территории; военный контекст позволяет естественное русское «выступить в поход».
- source_word: ὅπως μετέλθω
  choice: чтобы преследовать
  rationale: Целевая конструкция указывает на намеренное действие против виновных; μετέρχομαι здесь означает погоню или выступление против них, не обязательно формальное наказание.
- source_word: τοὺς κατεφθαρκότας τὴν χώραν ἡμῶν
  choice: тех, кто разорил нашу страну
  rationale: Καταφθείρω обозначает доведение до разорения или гибели; «разорил» сохраняет сильное значение, не утверждая непременно полного уничтожения.
- source_word: τοὺς ἠρημωκότας πόλεις πολλὰς
  choice: опустошил многие города
  rationale: Ἐρημόω означает делать пустынным, безлюдным, опустошать; выбранный вариант естественен применительно к городам.
- source_word: ἐν τῇ βασιλείᾳ
  choice: в царстве
  rationale: Сохраняет определённую форму греческого текста без добавления отсутствующего местоимения «моём».
