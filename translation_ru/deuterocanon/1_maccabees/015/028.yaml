  text: And he sent to him Athenobius[a], one of his Friends, to confer with him, saying, “You are holding Joppa and Gazara and the citadel in Jerusalem[b], cities of my kingdom.”
translation:
  language: ru
  text: 'И послал он к нему Афинобия, одного из своих Друзей, чтобы побеседовать с ним, сказав: «Вы удерживаете Иоппию, Газару[b] и Акру в Иерусалиме[a] — города моего царства».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крепость в Иерусалиме». Греческое слово ἄκρα означает «крепость», «цитадель», но здесь может быть также закрепившимся названием селевкидской крепости в Иерусалиме.'
    reason: lexical_alternative
  - marker: b
    text: Газара — греческая форма названия города, обычно отождествляемого с Газером.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный эквивалент, естественный для современного литературного русского языка.
- source_word: Ἀθηνόβιον
  choice: Афинобия
  rationale: Греческое личное имя передано традиционной русской транслитерацией и поставлено в винительный падеж.
- source_word: ἕνα τῶν φίλων αὐτοῦ
  choice: одного из своих Друзей
  rationale: В эллинистическом придворном контексте «Друзья» вероятно обозначает официальный круг царских приближённых; прописная буква сохраняет эту возможность.
- source_word: κοινολογησόμενον αὐτῷ
  choice: чтобы вступить с ним в переговоры
  rationale: Форма обозначает предстоящую беседу или совещание; контекст царского требования допускает «переговоры», не уточняя их исход.
- source_word: κατακρατεῖτε
  choice: удерживаете
  rationale: Передаёт продолжающееся обладание и контроль, сохраняя обвинительный оттенок без излишнего усиления до «захватили» или «оккупируете».
- source_word: Ἰόππης
  choice: Иоппию
  rationale: Устоявшаяся русская библейская форма названия Иоппии.
- source_word: Γαζάρων
  choice: Газару
  rationale: Сохраняет греческую форму топонима, представленную в источнике; отождествление с Газером отмечено в сноске.
- source_word: τῆς ἄκρας ἐν Ἰερουσαλήμ
  choice: Акру в Иерусалиме
  rationale: В данном историческом контексте ἄκρα может выступать как закрепившееся название селевкидской крепости; транслитерация сохраняет эту историческую конкретность, а нарицательное значение дано в сноске.
- source_word: πόλεις τῆς βασιλείας μου
  choice: города моего царства
  rationale: Прямая и естественная передача греческой родительной конструкции.
