  text: And Simon sent him two thousand chosen men to fight alongside him[b][a], and silver and gold and sufficient equipment.
translation:
  language: ru
  text: И послал ему Симон две тысячи отборных воинов, чтобы сражаться на его стороне[a], а также серебро, золото и достаточно снаряжения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы оказать ему союзническую помощь». Греческий глагол может обозначать поддержку союзника в более широком смысле; здесь контекст указывает прежде всего на военную помощь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «достаточно припасов». Греческое слово имеет широкое значение и в зависимости от контекста может обозначать снаряжение, принадлежности или припасы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный глагол со значением отправки; «послал» естественно и точно передаёт греческий аорист.
- source_word: διαχιλίους ἄνδρας ἐκλεκτούς
  choice: две тысячи отборных воинов
  rationale: ἄνδρας буквально означает «мужей/людей», но военный контекст и цель их отправки позволяют естественно передать «воинов»; ἐκλεκτούς обозначает специально отобранных людей.
- source_word: συμμαχῆσαι αὐτῷ
  choice: чтобы сражаться на его стороне
  rationale: Глагол обозначает союзническое участие, особенно совместные военные действия; формулировка передаёт практический смысл, не сводя его только к формальному заключению союза.
- source_word: ἀργύριον καὶ χρυσίον
  choice: серебро, золото
  rationale: Прямые конкретные соответствия; сочетание двух драгоценных металлов не требует заменять ἀργύριον словом «деньги».
- source_word: σκεύη ἱκανά
  choice: достаточно снаряжения
  rationale: σκεύη — широкое обозначение утвари, принадлежностей или оснащения; в военном контексте «снаряжение» наиболее естественно, а ἱκανά указывает на достаточное количество.
