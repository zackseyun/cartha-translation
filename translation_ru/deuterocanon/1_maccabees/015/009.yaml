  terminology: «Народ» уместен для ἔθνος в данном историко-политическом контексте. «Святилище» не сужает ἱερόν до конкретного здания. Выборы «честь» и «слава» передают соответственно акт оказания почести и его публичный результат; существенного смыслового расхождения с греческой однокоренной цепочкой нет.
