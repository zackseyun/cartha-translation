base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/009.yaml
  text: And when we establish our kingdom[a], we will honor you and your nation and the sanctuary with great glory[c][b], so that your glory may become evident in all the earth.
translation:
  language: ru
  text: Когда же мы утвердим своё царство, то воздадим великую честь тебе, твоему народу и святилищу[a], чтобы ваша слава стала явной по всей земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храму». Греческое ἱερόν может обозначать как храм, так и весь священный храмовый комплекс.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «по всей земле» можно также понять как «по всей стране» или «по всему миру»; объём значения греческого γῆ определяется контекстом.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστήσωμεν
  choice: утвердим
  rationale: 'Передаёт установление и упрочение царской власти; сочетание ὡς δʼ ἂν с аористом сослагательного наклонения выражает будущее условие: «когда утвердим».'
- source_word: βασιλείαν ἡμῶν
  choice: своё царство
  rationale: В контексте царского послания βασιλεία обозначает царство или царскую власть; «царство» естественно сохраняет политико-институциональный смысл.
- source_word: δοξάσωμέν ... δόξῃ μεγάλῃ
  choice: воздадим великую честь
  rationale: Греческая конструкция буквально повторяет однокоренные формы «прославим ... великой славой», но в дипломатическом контексте речь идёт о публичном возвеличивании и почестях. Русское выражение передаёт смысл без неуместно богословского оттенка.
- source_word: ἔθνος
  choice: народ
  rationale: Здесь имеется в виду иудейский народ как единое сообщество; по-русски «народ» естественнее, чем «нация», для данного исторического контекста.
- source_word: ἱερὸν
  choice: святилище
  rationale: Сохраняет широту значения ἱερόν, которое может обозначать храм или весь священный храмовый комплекс.
- source_word: φανερὰν γενέσθαι
  choice: стала явной
  rationale: 'Естественно передаёт результат: слава должна сделаться открытой и известной.'
- source_word: τὴν δόξαν ὑμῶν
  choice: ваша слава
  rationale: «Слава» здесь означает публичную известность, почёт и величие; выбор также частично сохраняет повтор δόξα/δοξάζω.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: по всей земле
  rationale: Сохраняет возможную широкую географическую отнесённость γῆ, не сужая её однозначно до одной страны и не усиливая до «всего мира».
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с достоинством царского дипломатического послания. Однокоренная греческая цепочка δοξάσωμεν—δόξῃ—δόξαν передана не полностью буквально: «воздадим великую честь» звучит естественно в политическом контексте, а «ваша слава» сохраняет риторический мотив публичного величия. Местоимение ὑμῶν во множественном числе передано как «ваша», относясь к адресату вместе с его народом и святилищем.'
