  text: And they brought a gold shield worth five thousand minas[a].
translation:
  language: ru
  text: И они принесли золотой щит стоимостью в пять тысяч мин[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотой щит в пять тысяч мин». Греческое выражение допускает более буквальный перевод, но здесь, вероятно, указывает на стоимость щита.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: принесли
  rationale: Аорист от φέρω обозначает простое действие доставки дара; «принесли» естественно звучит по-русски и не добавляет более формального смысла «преподнесли».
- source_word: ἀσπίδα
  choice: щит
  rationale: Обычное значение слова ἀσπίς; нейтральное и понятное современному читателю обозначение без неоправданного уточнения типа щита.
- source_word: χρυσῆν
  choice: золотой
  rationale: Прилагательное прямо указывает на золото как материал или характеристику щита и естественно сочетается с последующим указанием стоимости.
- source_word: ἀπὸ μνῶν πεντακισχιλίων
  choice: стоимостью в пять тысяч мин
  rationale: Хотя конструкция буквально содержит ἀπό и сумму, в контексте дипломатического дара она, вероятнее всего, указывает на стоимость; русский оборот ясно передаёт этот смысл, а формальная неоднозначность отмечена в сноске.
- source_word: μνῶν
  choice: мин
  rationale: Сохранено историческое название древней единицы веса и денежного счёта без неточного пересчёта в современные единицы.
