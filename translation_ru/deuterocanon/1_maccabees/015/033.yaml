  yaml_path: translation/deuterocanon/1_maccabees/015/033.yaml
  text: And Simon answered and said to him[a], “We have neither taken foreign land nor seized what belongs to others, but only the inheritance of our fathers[b], which at one time was unjustly taken over by our enemies.”
translation:
  language: ru
  text: 'И Симон ответил ему: «Мы не захватили чужой земли и не завладели чужим достоянием, а лишь наследием наших отцов, которое наши враги некогда несправедливо[a] захватили».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без надлежащего судебного разбирательства»; греческое слово может подчёркивать как несправедливость, так и отсутствие должного рассмотрения дела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν ἀλλοτρίαν
  choice: чужой земли
  rationale: ἀλλότριος здесь означает принадлежащий другим, а не обязательно находящийся в иной стране; «чужой» точно передаёт притязание на право собственности.
- source_word: εἴλημμεν
  choice: не захватывали
  rationale: Перфект λαμβάνω в контексте территориального спора обозначает совершённое присвоение с сохраняющимся результатом; «захватывали» естественно выражает отрицаемое неправомерное приобретение.
- source_word: ἀλλοτρίων
  choice: чужим достоянием
  rationale: Субстантивированный родительный множественного числа обозначает то, что принадлежит другим. «Достояние» позволяет передать эллипсис и не ограничивать смысл одной лишь землёй.
- source_word: κεκρατήκαμεν
  choice: не завладевали
  rationale: κρατέω означает овладевать, держать под властью; в данном контексте «завладевать» сохраняет политико-имущественный смысл.
- source_word: ἀλλὰ τῆς κληρονομίας τῶν πατέρων ἡμῶν
  choice: но вернули наследие наших отцов
  rationale: Противительный оборот эллиптически продолжает сказуемое, а последующее относительное предложение показывает, что речь идёт о возвращении ранее отнятого наследия. Добавление «вернули» делает русскую фразу грамматически полной, не расширяя утверждение.
- source_word: ἀκρίτως
  choice: несправедливо
  rationale: Наречие может указывать на действие без надлежащего суда или решения; «несправедливо» передаёт общий смысл, а более буквальные оттенки сохранены в сноске.
- source_word: ἐν τινι καιρῷ
  choice: некогда
  rationale: Выражение указывает на неопределённое время в прошлом, а не обязательно на длительность; «некогда» кратко и естественно сохраняет эту неопределённость.
- source_word: κατεκρατήθη
  choice: завладели
  rationale: Пассив κατακρατέω означает, что наследие оказалось под властью врагов. При смене синтаксической перспективы русское активное «которым… завладели» ясно и естественно передаёт тот же смысл.
theological_decisions:
- issue: Характер притязания на землю предков
  choice: наследие наших отцов
  alternative: наше родовое наследие
  rationale: Формулировка сохраняет заявленное в тексте наследственное право, не добавляя самостоятельного богословского или национального обоснования.
- issue: Передача πατέρων
  choice: наших отцов
  alternative: наших предков
  rationale: «Отцов» сохраняет явно мужскую форму источника и традиционный смысл праотцов, оставаясь понятным в контексте.
- issue: Эллипсис после ἀλλά
  choice: но вернули наследие
  alternative: но [взяли] наследие
  rationale: Греческий текст оставляет сказуемое подразумеваемым. Контекст ранее отнятого владения поддерживает смысл возвращения; вариант не превращает притязание Симона в более широкое богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством исторической речи. Сохранены юридико-политический характер ответа и параллель между чужой землёй и чужим достоянием; громоздкое «ответив, сказал» передано естественным «ответил».
