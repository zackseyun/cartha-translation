  text: And Ptolemy wrote these things and sent word to the king that he should send him forces as help, and hand over their country and the cities.
translation:
  language: ru
  text: И написал Птолемей об этом и послал царю просьбу прислать ему войска на помощь и передать ему их страну и города.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψεν ταῦτα
  choice: написал об этом
  rationale: Естественная русская передача буквального «написал это» в контексте сообщения о произошедшем.
- source_word: δυνάμεις
  choice: войска
  rationale: В данном военном контексте означает вооружённые силы, а не абстрактные «силы».
- source_word: εἰς βοήθειαν
  choice: на помощь
  rationale: Краткая и естественная передача цели отправки войск.
- source_word: παραδῷ
  choice: передать ему
  rationale: Передаёт значение вручения или предоставления под власть; местоимение «ему» явно выражает подразумеваемого получателя, Птолемея.
- source_word: τὴν χώραν αὐτῶν καὶ τὰς πόλεις
  choice: их страну и города
  rationale: Сохраняет местоименную отсылку и различие между всей территорией и отдельными городами.
