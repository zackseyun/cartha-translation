lexical_decisions:
- source_word: ἀνέβη
  choice: поднялся
  rationale: Передаёт направительное значение ἀναβαίνω («идти/подниматься вверх») и естественно звучит в повествовании.
- source_word: Γαζάρων
  choice: из Газары
  rationale: Сохраняет эллинизированное название места, засвидетельствованное в греческом тексте, в нормативной русской форме.
- source_word: ἀπήγγειλεν
  choice: сообщил
  rationale: Точно передаёт принесение известия или донесения и соответствует военно-политическому контексту.
- source_word: συνετέλει
  choice: что делал
  rationale: Имперфект указывает на продолжавшееся действие; естественное русское выражение сохраняет широту значения глагола, который также может означать осуществление замысла или предприятия.
- source_word: Κενδεβαῖος
  choice: Кендевей
  rationale: Традиционная русская передача греческого личного имени, сохраняющая его узнаваемость в библейском контексте.
