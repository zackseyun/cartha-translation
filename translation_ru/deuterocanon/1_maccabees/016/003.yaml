base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/003.yaml
  text: But now I have grown old[a], and you also, by mercy, are mature in years. Become my replacements, and my brother’s, and go out and fight on behalf of our nation[c][b], and may the help from heaven be with you.
translation:
  language: ru
  text: Но теперь я состарился, а вы, по милости[a], уже достаточно взрослые. Займите наше место — моё и моего брата[b], выступите и сражайтесь за наш народ, и да будет с вами помощь с неба[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «в милости» или «милостью». В греческом тексте не сказано прямо, чья это милость, хотя контекст естественно указывает на Божью милость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «станьте вместо меня и моего брата».'
    reason: alternative_reading
  - marker: c
    text: «Помощь с неба» — почтительный способ говорить о Божьей помощи, не называя Бога прямо.
    reason: cultural_note
lexical_decisions:
- source_word: γεγήρακα
  choice: я состарился
  rationale: Перфект передаёт нынешнее состояние как результат процесса старения; «я состарился» естественно сохраняет оба оттенка.
- source_word: ἐν τῷ ἐλέει
  choice: по милости
  rationale: Греческое выражение буквально указывает на милость, но не называет того, кто её явил. Формулировка сохраняет эту недосказанность и хорошо звучит по-русски.
- source_word: ἱκανοί ἐστε ἐν τοῖς ἔτεσιν
  choice: уже достигли зрелых лет
  rationale: ἱκανός обозначает достаточность или пригодность; в сочетании с указанием на возраст речь идёт о зрелости, позволяющей принять ответственность.
- source_word: γίνεσθε ἀντʼ ἐμοῦ καὶ τοῦ ἀδελφοῦ μου
  choice: займите место моё и моего брата
  rationale: ἀντί с родительным падежом выражает замещение. Эта формулировка точно и естественно передаёт призыв выступить вместо обоих.
- source_word: ἐξελθόντες ὑπερμαχεῖτε
  choice: выступите и сражайтесь за
  rationale: Причастие ἐξελθόντες обозначает выход в поход, а ὑπερμαχεῖτε — борьбу в защиту кого-либо. «Выступите и сражайтесь за» сохраняет оба действия.
- source_word: ἔθνους
  choice: народ
  rationale: В данном контексте слово обозначает иудейское национальное сообщество. Русское «народ» передаёт этническую и общественную общность естественнее, чем более государственно окрашенное «нация».
- source_word: ἐκ τοῦ οὐρανοῦ βοήθεια
  choice: помощь с неба
  rationale: Сохраняется образ помощи, исходящей с неба, и косвенное указание на божественную поддержку без добавления имени Бога.
- source_word: ἤτω μεθʼ ὑμῶν
  choice: да будет с вами
  rationale: Повелительная форма третьего лица здесь выражает пожелание или благословение; «да будет» соответствует её торжественному характеру.
theological_decisions:
- issue: Неявное указание на Бога в словах о милости и помощи с неба
  choice: Не называть Бога прямо в основном тексте
  alternative: «по милости Божьей»; «да будет с вами Божья помощь»
  rationale: Хотя контекст естественно предполагает божественную милость и помощь, греческий текст прямо Бога не называет. Перевод сохраняет эту почтительную косвенность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным звучанием. Синтаксис сохраняет последовательность призыва и заключительное благословение; архаизмы сведены к уместной формуле «да будет».
