base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/016.yaml
  text: And when Simon and his sons became drunk[a], Ptolemy and those with him rose up and took their weapons, and entered the banquet against Simon, and killed him and his sons, and some of his young servants.
translation:
  language: ru
  text: Когда Симон и его сыновья опьянели, Птолемей и те, кто был с ним, встали, взяли своё оружие, вошли к Симону на пир[a] и убили его, его сыновей и нескольких его юных слуг[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на застолье с возлияниями»; греческое слово может обозначать пир, на котором пили вино.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мальчиков»; греческое слово может обозначать как мальчика, так и юного слугу или прислужника.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐμεθύσθη
  choice: опьянели
  rationale: Аорист передаёт наступление состояния опьянения; «опьянели» естественно выражает это по-русски, в отличие от более статичного «были пьяны».
- source_word: ἐξανέστη
  choice: встали
  rationale: Глагол обозначает решительное начало действия; простое «встали» сохраняет повествовательную последовательность без лишнего усиления.
- source_word: οἱ μετʼ αὐτοῦ
  choice: те, кто был с ним
  rationale: Греческое выражение не уточняет, были ли это слуги, воины или сообщники, поэтому перевод сохраняет его неопределённость.
- source_word: ἔλαβον τὰ ὅπλα αὐτῶν
  choice: взяли своё оружие
  rationale: ὅπλα здесь означает оружие; возвратное местоимение естественно передаёт принадлежность оружия действующим лицам.
- source_word: ἐπεισῆλθοσαν τῷ Σίμωνι
  choice: вошли к Симону
  rationale: Перевод сохраняет движение внутрь и направленность на Симона. Враждебный характер входа ясно раскрывается последующим убийством, поэтому более сильное «ворвались» не вводится в основной текст.
- source_word: συμπόσιον
  choice: пир
  rationale: «Пир» — естественное и ёмкое обозначение совместной праздничной трапезы; возможный более узкий оттенок застолья с возлияниями отмечен в сноске.
- source_word: ἀπέκτειναν
  choice: убили
  rationale: Это прямой и стилистически нейтральный эквивалент, не добавляющий отдельной правовой или нравственной квалификации вроде «совершили убийство».
- source_word: παιδαρίων
  choice: юных слуг
  rationale: Слово может обозначать как мальчиков, так и молодых слуг или прислужников; контекст окружения правителя допускает служебную роль, а возрастной оттенок сохранён словом «юных».
