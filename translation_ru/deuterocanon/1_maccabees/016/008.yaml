lexical_decisions:
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: затрубили в трубы
  rationale: Естественная русская передача военного сигнала с сохранением конкретного образа труб.
- source_word: ἐτροπώθη
  choice: был обращён в бегство
  rationale: В военном контексте пассивная форма τρέπω означает разгром и обращение неприятеля в бегство; последующее упоминание бегства оставшихся развивает этот смысл.
- source_word: παρεμβολὴ
  choice: войско
  rationale: 'Хотя слово может означать «лагерь», здесь оно обозначает людей Кендевея: именно они несут потери и бегут в крепость.'
- source_word: ἔπεσον τραυματίαι
  choice: пали ранеными
  rationale: Близко передаёт греческое выражение и не утверждает, что все павшие непременно погибли.
- source_word: καταλειφθέντες
  choice: оставшиеся
  rationale: Сохраняет буквальный смысл причастия, не усиливая его до однозначного «уцелевшие».
- source_word: ὀχύρωμα
  choice: крепость
  rationale: Естественное современное обозначение укреплённого места в данном военном контексте.
