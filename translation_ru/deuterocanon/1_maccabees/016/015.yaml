lexical_decisions:
- source_word: ὑπεδέξατο
  choice: принял
  rationale: Глагол означает принять или приветить гостей; «принял» естественно звучит в контексте притворного гостеприимства и не усиливает положительную окраску.
- source_word: ὁ τοῦ Ἀβουβον
  choice: сын Авува
  rationale: Эллиптическое греческое обозначение выражает патроним; личное имя из контекста не добавляется, поскольку в данном стихе оно отсутствует.
- source_word: εἰς τὸ ὀχύρωματιν
  choice: в крепости
  rationale: Несмотря на необычную форму существительного в издании Суита, речь явно идёт об укреплённом месте; «крепость» — точный и естественный русский эквивалент.
- source_word: τὸ καλούμενον Δὼκ
  choice: называемой Док
  rationale: Передаёт греческую формулу наименования и транслитерирует топоним Δώκ как «Док».
- source_word: μετὰ δόλου
  choice: с коварным умыслом
  rationale: Сочетание сохраняет значение намеренного обмана и естественно связывается по-русски с притворным приёмом гостей.
- source_word: ὃ ᾠκοδόμησεν
  choice: построенной им
  rationale: Относительное придаточное относится к крепости; причастный оборот ясно и компактно показывает, что её построил сам действующий субъект.
- source_word: ἐποίησεν αὐτοῖς πότον μέγαν
  choice: устроил для них богатый пир
  rationale: Существительное πότος буквально подчёркивает питьё, но может обозначать пиршество; основной текст передаёт естественный контекст застолья, а буквальный оттенок сохраняется в сноске.
- source_word: ἐνέκρυψεν ἐκεῖ ἄνδρας
  choice: спрятал там людей
  rationale: Прямо передаёт преднамеренное сокрытие людей на месте будущего нападения, не добавляя прямо не названного в стихе слова «засада».
