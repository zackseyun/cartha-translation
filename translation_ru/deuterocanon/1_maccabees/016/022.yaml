lexical_decisions:
- source_word: ἀκούσας
  choice: Услышав об этом
  rationale: Аористное причастие естественно передаёт предшествующее обстоятельство; «об этом» по-русски ясно связывает слух с известием из контекста.
- source_word: ἐξέστη σφόδρα
  choice: он сильно встревожился
  rationale: В контексте покушения выражение обозначает сильное потрясение или тревогу; этот вариант естественен и не сводит смысл к простому удивлению.
- source_word: συνέλαβεν
  choice: схватил
  rationale: Передаёт захват людей без привнесения формальной юридической процедуры, которую могло бы подразумевать «арестовал».
- source_word: τοὺς ἄνδρας
  choice: людей
  rationale: В данном контексте речь идёт о конкретной группе мужчин; русское «людей» естественно после «схватил» и не меняет референтов.
- source_word: τοὺς ἐλθόντας ἀπολέσαι αὐτόν
  choice: пришедших убить его
  rationale: В контексте покушения ἀπόλλυμι означает лишить жизни; «убить» яснее и естественнее русского «погубить».
- source_word: ἀπέκτεινεν
  choice: умертвил их
  rationale: Глагол прямо означает причинение смерти; «умертвил» позволяет ясно передать действие и избежать неуклюжего непосредственного повтора «убить».
- source_word: ἔγνω
  choice: знал
  rationale: Прямо сохраняет утверждение текста о его знании, не уточняя, было ли это внезапным осознанием.
- source_word: ἐζήτουν αὐτὸν ἀπολέσαι
  choice: они искали случая убить его
  rationale: Передаёт целенаправленное и продолжавшееся намерение, выраженное имперфектом ζητέω с инфинитивом, естественным современным русским оборотом.
