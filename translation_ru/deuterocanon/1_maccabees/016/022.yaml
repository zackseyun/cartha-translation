  source_fidelity: 'В целом смысл передан верно: временное причастие, сильная тревога, захват пришедших и их убийство, а также знание об их намерении сохранены. Однако «искали случая убить» добавляет не выраженное в греческом тексте понятие удобного случая; ζητέω с инфинитивом означает, что они стремились/пытались убить его.'
  naturalness: Текст в целом естественен, но «умертвил» несколько книжно и менее обычно для современного повествования, чем «убил». «Схватил мужчин» прямо передаёт συγκεκριенное masculine plural ἄνδρας и остаётся естественным в данном контексте.
  terminology: Специальная богословская терминология отсутствует. «Убить» уместно передаёт ἀπολέσαι в контексте покушения и сохраняет повтор ключевого действия в начале и конце стиха.
