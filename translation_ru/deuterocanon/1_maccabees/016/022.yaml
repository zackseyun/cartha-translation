    rationale: В оригинале ἐζήτουν αὐτὸν ἀπολέσαι означает «стремились/пытались убить его»; слово «случая» вводит дополнительный объект и конкретизирует способ намерения без опоры на текст.
  - severity: low
    issue: «людей» вместо «мужчин»
    rationale: Русское «людей» возможно, но ἄνδρας прямо обозначает мужчин; «мужчин» точнее сохраняет исходную референцию.
  - severity: low
    issue: «умертвил»
    rationale: Слово понятно, но имеет несколько приподнятый оттенок. Простое «убил» современнее и яснее; повтор соответствует повтору ἀπολέσαι в греческом тексте.
  revised_text: Услышав это, он сильно встревожился, схватил мужчин, пришедших убить его, и убил их, потому что знал, что они стремились убить его.
