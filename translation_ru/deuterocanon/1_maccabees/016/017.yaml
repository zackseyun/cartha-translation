translation:
  language: ru
  text: И совершил он великое вероломство[a], и отплатил злом за добро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тяжко нарушил верность»; возможно также: «совершил великое беззаконие». Греческое слово может обозначать нарушение доверия, верности или обязательства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: совершил
  rationale: В сочетании с существительным ἀθεσίαν глагол обозначает совершение поступка; «совершил» естественно передаёт эту конструкцию и её нравственную оценку.
- source_word: ἀθεσίαν
  choice: вероломство
  rationale: Существительное указывает на нарушение верности, доверия или обязательства. В данном повествовательном контексте «вероломство» точно передаёт конкретное предательство, не сводя смысл к отвлечённому беззаконию.
- source_word: μεγάλην
  choice: великое
  rationale: Прилагательное усиливает тяжесть проступка. «Великое» сохраняет прямую связь с греческим словом и соответствует возвышенному повествовательному регистру.
- source_word: ἀνταπέδωκεν
  choice: отплатил
  rationale: Глагол выражает воздаяние или ответное действие; «отплатил» естественно сочетается с противопоставлением зла и добра.
- source_word: κακὰ
  choice: злом
  rationale: Субстантивированное прилагательное обозначает злые поступки или дурное обращение. «Злом» сохраняет нравственный смысл и образ ответного воздаяния.
- source_word: ἀντὶ ἀγαθῶν
  choice: за добро
  rationale: 'Оборот обозначает обмен или воздаяние: зло было дано в ответ на добро. Русское выражение «отплатил злом за добро» кратко и точно передаёт контраст.'
theological_decisions:
- issue: Нравственная характеристика ἀθεσία
  choice: Передано как конкретное нарушение верности — «вероломство».
  alternative: «великое беззаконие», «великая неверность», «тяжкое нарушение верности»
  rationale: Контекст говорит о предательском поступке в отношениях, а не только об отвлечённом беззаконии. Выбор сохраняет этическую и повествовательную силу выражения, не вводя позднейших специальных богословских значений.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным библейским ритмом. Устойчивое выражение «отплатил злом за добро» естественно для широкого круга читателей и точно сохраняет греческое противопоставление.
