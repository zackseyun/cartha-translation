lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Сохраняет указательно-побудительную силу греческого слова и естественно звучит в заключительной отсылке к письменному источнику.
- source_word: ταῦτα
  choice: всё это
  rationale: Передаёт собирательную отсылку к изложенным выше событиям; по-русски естественнее буквального «эти вещи».
- source_word: γέγραπται
  choice: записано
  rationale: Передаёт перфект пассива как существующую письменную запись и уместно в архивном контексте.
- source_word: ἐπὶ βιβλίῳ
  choice: в книге
  rationale: В документальном контексте ἐπί с дательным обозначает нахождение записи в письменном источнике; «в книге» естественно по-русски.
- source_word: ἡμερῶν ἀρχιερωσύνης αὐτοῦ
  choice: дней его первосвященства
  rationale: Сохраняет конкретную и, вероятно, летописную формулировку оригинала, не заменяя её интерпретирующим «летопись первосвященства».
- source_word: ἀφʼ οὗ
  choice: с того времени, когда
  rationale: Ясно обозначает исходную точку охватываемого записью периода.
- source_word: ἐγενήθη ἀρχιερεὺς
  choice: он стал первосвященником
  rationale: Естественно передаёт вступление в должность, не вводя не названного в греческом тексте действующего лица.
- source_word: μετὰ τὸν πατέρα αὐτοῦ
  choice: после своего отца
  rationale: Сжато сохраняет смысл преемства в должности; возвратное «своего» устраняет возможную неясность в русском синтаксисе.
