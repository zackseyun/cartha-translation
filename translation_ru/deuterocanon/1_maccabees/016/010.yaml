  text: And they fled into the towers in the fields of Azotus[a], and he burned it with fire; and about a thousand men fell from among them[c][b], and he returned to Judea in peace.
translation:
  language: ru
  text: Они бежали в башни, стоявшие в полях Азота[a], а он сжёг всё это огнём[b]. Из них пало около тысячи человек[c], после чего он с миром вернулся в Иудею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Азот — греческое название Ашдода.
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте буквально: «сжёг её огнём». Местоимение стоит в единственном числе; его точный референт неясен и может пониматься собирательно — о башнях и укреплённой местности — либо относиться к подразумеваемому городу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тысяча человек». Греческое выражение может обозначать приблизительное число.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγον
  choice: бежали
  rationale: Передаёт обычное повествовательное значение глагола в контексте отступления после сражения, не добавляя оттенка успешного спасения.
- source_word: πύργους
  choice: башни
  rationale: Сохраняет конкретный образ оборонительных башен; более общее «укрепления» было бы истолковывающим переводом.
- source_word: ἐν τοῖς ἀγροῖς
  choice: в полях
  rationale: Близко передаёт греческое выражение и естественно звучит в русском повествовании; оборот «стоявшие» ясно связывает местоположение с башнями.
- source_word: Ἀζώτου
  choice: Азота
  rationale: Использована традиционная русская форма греческого названия Ἄζωτος; соответствующее еврейское название Ашдод указано в примечании.
- source_word: ἐνεπύρισεν αὐτὴν ἐν πυρί
  choice: сжёг это место огнём
  rationale: Сохраняет единственное число местоимения αὐτήν и усиленный образ огня, не исправляя его на множественное число по слову «башни». Слово «место» позволяет по-русски передать возможное собирательное обозначение укреплённой местности.
- source_word: ἔπεσον
  choice: пало
  rationale: Сохраняет обычную для военного повествования метафору гибели, присутствующую в греческом тексте.
- source_word: ἐξ αὐτῶν
  choice: из них
  rationale: 'Передаёт партитивный смысл: погибшие принадлежали к упомянутой группе бегущих.'
- source_word: εἰς ἄνδρας χιλίους
  choice: около тысячи человек
  rationale: Необычная количественная конструкция с εἰς здесь естественно выражает приблизительное число; возможность понимать её как точное число отмечена в примечании.
- source_word: ἀπέστρεψεν
  choice: вернулся
  rationale: Естественно передаёт завершение похода и возвращение в Иудею.
- source_word: μετʼ εἰρήνης
  choice: с миром
  rationale: Сохраняет буквальный и богословски не перегруженный образ мирного возвращения, не сужая его до значения «невредимым» или «благополучно».
