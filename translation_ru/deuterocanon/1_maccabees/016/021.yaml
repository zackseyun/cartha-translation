  text: And he ran on ahead and reported to John in Gazara that his father and his brothers had perished[a], and that he had sent men to kill you also.
translation:
  language: ru
  text: Он побежал вперёд и сообщил Иоанну в Газаре, что его отец и братья погибли и что он послал людей, чтобы убить и его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и что он послал [кого-то], чтобы убить и тебя». В греческом тексте не сказано, кого именно он послал; слово «людей» добавлено для ясности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν
  choice: побежал вперёд
  rationale: Передаёт как движение вперёд, так и поспешность, выраженные причастием.
- source_word: ἀπήγγειλεν
  choice: сообщил
  rationale: Естественно передаёт принесённое вестником известие без излишне официального оттенка.
- source_word: εἰς Γάζαρα
  choice: Иоанну в Газаре
  rationale: В сочетании с адресатом сообщения оборот естественно указывает место, где находился Иоанн.
- source_word: ἀπώλετο
  choice: погибли
  rationale: Глагол обозначает гибель и в данном контексте подразумевает насильственную смерть, не уточняя её способа.
- source_word: Ἀπέσταλκεν
  choice: он послал людей
  rationale: Перфект указывает на уже совершённую отправку с сохраняющейся актуальностью; дополнение «людей» подразумевается, но не выражено в греческом тексте.
- source_word: καὶ σὲ ἀποκτεῖναι
  choice: убить также и его
  rationale: В косвенной речи русское местоимение третьего лица естественно соответствует обращённому к Иоанну греческому σέ и сохраняет усиление καὶ σέ — «также и тебя».
