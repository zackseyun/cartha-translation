  language: ru
  text: Ведь он был зятем первосвященника[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое γαμβρός может иметь более широкое значение — «родственник по браку»; здесь наиболее вероятный смысл — «зять».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: был
  rationale: Имперфект глагола εἰμί обозначает продолжавшееся в прошлом состояние; в данном кратком пояснении естественно передаётся формой «был».
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предыдущему контексту; русское «ведь» естественно и компактно сохраняет эту связь.
- source_word: γαμβρός
  choice: зять
  rationale: В контексте наиболее вероятно значение «зять», то есть муж дочери; при этом греческое слово может шире обозначать родственника по браку, что отмечено в сноске.
- source_word: τοῦ ἀρχιερέως
  choice: первосвященника
  rationale: ἀρχιερεύς — устойчивое обозначение первосвященника в иудейском контексте; родительный падеж передаёт отношение родства.
