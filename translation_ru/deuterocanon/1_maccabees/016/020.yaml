lexical_decisions:
- source_word: ἑτέρους
  choice: других
  rationale: Неопределённое множественное число обозначает дополнительных людей, отличных от упомянутых ранее; краткое «других» естественно по-русски и не добавляет отсутствующего в греческом существительного.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный глагол о направлении людей с поручением; «послал» точно и стилистически нейтрально.
- source_word: καταλαβέσθαι
  choice: захватить
  rationale: В военно-политическом контексте глагол означает овладеть или взять под контроль; «захватить» передаёт враждебный характер действия, не уточняя его способ.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Устоявшаяся русская форма географического названия.
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: храмовую гору
  rationale: Естественное русское обозначение возвышенности, на которой находился храмовый комплекс; сохраняет значение ὄρος и передаёт родительную связь с ἱερόν без тяжеловесного буквального оборота.
