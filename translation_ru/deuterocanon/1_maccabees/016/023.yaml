  text: And the rest of the accounts concerning John, and his wars, and his mighty deeds that he did, and the building of the walls that he built, and his acts—
translation:
  language: ru
  text: А прочее о делах Иоанна, о его войнах, о доблестных подвигах, которые он совершил, о возведении стен, которые он построил, и о его деяниях —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ λοιπὰ τῶν λόγων Ἰωάννου
  choice: прочее о делах Иоанна
  rationale: В историографической заключительной формуле λόγοι обозначает сведения или повествование о делах человека, а τὰ λοιπά — остальной, не изложенный здесь материал. Русское «прочее о делах Иоанна» естественно и сохраняет обобщённость выражения.
- source_word: πολέμων
  choice: войнах
  rationale: Слово обозначает военные конфликты в широком смысле; «войнах» точнее сохраняет этот охват, чем более узкие «битвах» или «сражениях».
- source_word: ἀνδραγαθιῶν ... ὧν ἠνδραγάθησεν
  choice: доблестных подвигах, которые он совершил
  rationale: Однокоренные существительное и глагол выражают доблесть и героические свершения. Перевод передаёт похвальный оттенок, избегая неестественного однокоренного повтора в русском.
- source_word: οἰκοδομῆς τῶν τειχέων ὧν ᾠκοδόμησεν
  choice: возведении стен, которые он построил
  rationale: Сохранены и отглагольное существительное, и относительное придаточное оригинала. «Возведение» естественно применительно к оборонительным стенам, а «построил» передаёт повтор корня без стилистической тяжеловесности.
- source_word: πράξεων
  choice: других его деяниях
  rationale: πράξεις — широкий итоговый термин для поступков и свершений. Добавление «других» по-русски ясно показывает, что это заключительный обобщающий пункт после уже перечисленных дел, не меняя референта.
- source_word: Καὶ
  choice: А
  rationale: В заключительной формуле русское «А» естественно продолжает предшествующее повествование и вводит сведения, оставленные за его пределами; механическое «И» здесь звучало бы менее идиоматично.
