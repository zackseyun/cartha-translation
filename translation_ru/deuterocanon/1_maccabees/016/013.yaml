lexical_decisions:
- source_word: ὑψώθη ἡ καρδία αὐτοῦ
  choice: вознеслось его сердце
  rationale: Сохранён образный строй греческой идиомы, обозначающей горделивое возвышение; смысловая альтернатива дана в сноске.
- source_word: ἐβουλήθη
  choice: замыслил
  rationale: Передаёт сформировавшееся намерение и естественно сочетается с последующим инфинитивом, не утверждая, что цель уже была достигнута.
- source_word: κατακρατῆσαι τῆς χώρας
  choice: захватить власть над страной
  rationale: Глагол с родительным падежом выражает установление господства; перевод ясно передаёт политический характер намерения.
- source_word: ἐβούλευετο δόλῳ
  choice: стал строить коварные замыслы
  rationale: Сочетание передаёт продолжающееся враждебное планирование посредством обмана; «коварные» сохраняет оттенок δόλῳ.
- source_word: κατὰ Σίμωνος καὶ κατὰ τῶν υἱῶν αὐτοῦ
  choice: против Симона и его сыновей
  rationale: Прямо сохраняет направленность заговора против Симона и его сыновей.
- source_word: ἆραι αὐτούς
  choice: устранить их
  rationale: «Устранить» сохраняет некоторую недосказанность αἴρω («убрать, удалить»), хотя в данном враждебном контексте, вероятно, подразумевается насильственное уничтожение.
