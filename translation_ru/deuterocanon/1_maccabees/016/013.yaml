  text: And his heart was lifted up[a], and he intended to seize control of the country, and he was plotting deceitfully against Simon and against his sons[b], to remove them.
translation:
  language: ru
  text: И сердце его возгордилось[a], и он замыслил захватить власть над страной; он строил козни против Симона и его сыновей, чтобы устранить их[b].
  philosophy: optimal-equivalence
  footnotes:
