  terminology: Имя Симон передано правильно. «Захватить власть над страной» приемлемо для κατακρατῆσαι τῆς χώρας. «Устранить их» сохраняет намеренную недосказанность ἆραι αὐτούς; сноска корректно поясняет вероятный насильственный оттенок, не превращая его в основной текст.
