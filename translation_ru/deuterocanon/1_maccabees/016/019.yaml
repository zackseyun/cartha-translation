  text: And he sent others to Gazara to take John[a], and to the commanders of thousands he sent letters to come to him[b], so that he might give them silver and gold and gifts.
translation:
  language: ru
  text: И послал он других в Газару, чтобы увести Иоанна[a], а тысяченачальникам послал письма, чтобы те пришли к нему, чтобы он дал им серебро и золото и дары.
