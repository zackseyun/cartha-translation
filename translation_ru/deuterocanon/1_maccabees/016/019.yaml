lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный глагол, естественно передающий действие без излишнего усиления.
- source_word: ἑτέρους
  choice: других
  rationale: Сохраняет эллипсис греческого текста и не добавляет прямо не названное существительное «людей».
- source_word: Γάζαρα
  choice: Газара
  rationale: Передаёт греческую форму названия места; более известное соответствие — Гезер.
- source_word: ἄραι
  choice: устранить
  rationale: Инфинитив αἴρω может означать «убрать», «удалить», «унести». В контексте враждебного замысла «устранить» сохраняет угрожающий смысл, не конкретизируя способ действия.
- source_word: τοῖς χιλιάρχοις
  choice: тысяченачальникам
  rationale: Устоявшееся и понятное русское обозначение военачальников, буквально командующих тысячей.
- source_word: ἐπιστολὰς
  choice: письма
  rationale: Прямое значение слова; перевод «приказы» был бы более узким и толковательным.
- source_word: παραγενέσθαι πρὸς αὐτόν
  choice: велев им явиться к нему
  rationale: Инфинитив после упоминания писем передаёт их содержание; «явиться» естественно выражает прибытие к вышестоящему лицу.
- source_word: ὅπως δῷ αὐτοῖς
  choice: чтобы он дал им
  rationale: Сохраняет целевое значение конструкции ὅπως с сослагательным наклонением.
- source_word: ἀργύριον καὶ χρυσίον
  choice: серебро, золото
  rationale: Буквально и ясно передаёт традиционную пару названий драгоценных металлов.
- source_word: δόματα
  choice: дары
  rationale: Достойный литературный эквивалент со значением подарков или пожалований.
