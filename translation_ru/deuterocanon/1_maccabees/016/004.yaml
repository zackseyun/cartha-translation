lexical_decisions:
- source_word: ἐπέλεξεν
  choice: отобрал
  rationale: Глагол означает целенаправленный выбор из более широкого круга людей; «отобрал» естественно звучит в контексте набора войска.
- source_word: ἐκ τῆς χώρας
  choice: по всей стране
  rationale: χώρα обозначает страну, землю или область; сочетание «отобрал по всей стране» ясно передаёт набор людей с данной территории, не привязывая его к одному городу.
- source_word: εἴκοσι χιλιάδας ἀνδρῶν πολεμιστῶν
  choice: двадцать тысяч воинов
  rationale: «Воинов» кратко и естественно передаёт мужчин, предназначенных для сражения; числительное сохраняется без изменений.
- source_word: ἱππεῖς
  choice: всадников
  rationale: Существительное обозначает конных воинов; «всадников» ближе к конкретной форме греческого текста, чем собирательное «конница».
- source_word: ἐπορεύθησαν ἐπὶ τὸν Κενδεβαῖον
  choice: они выступили против Кендевея
  rationale: В военном повествовании πορεύομαι указывает на движение или поход, а ἐπί с винительным — на направленность против противника. «Выступили против» сохраняет оба оттенка.
- source_word: ἐκοιμήθησαν
  choice: расположились на ночлег
  rationale: Буквально глагол означает «легли спать», но в походном контексте речь идёт об остановке войска на ночь. Выражение сохраняет ночной оттенок лучше, чем просто «стали лагерем».
- source_word: Μωδαείμ
  choice: Модине
  rationale: Использована узнаваемая русская форма топонима Модин с нормативным предложным падежом.
- source_word: Κενδεβαῖον
  choice: Кендевея
  rationale: Имя передано традиционно звучащей русской формой «Кендевей» и поставлено в винительный падеж после «против».
