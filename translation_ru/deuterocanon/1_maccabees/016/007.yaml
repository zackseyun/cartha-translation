  text: Он распределил воинов и всадников среди пеших воинов; а конница противника была очень многочисленна.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεῖλεν
  choice: разделил и разместил
  rationale: Глагол означает «разделить, распределить». В данном военном контексте сочетание передаёт как разделение войска, так и последующее распределение всадников, не уточняя тактическую схему сверх сказанного в греческом тексте.
- source_word: τὸν λαόν
  choice: войско
  rationale: Буквально — «народ», однако здесь речь идёт о людях под военным командованием. «Войско» естественно для современного русского языка и ясно передаёт контекст.
- source_word: τοὺς ἱππεῖς
  choice: всадников
  rationale: Прямое обозначение воинов, сражающихся верхом; индивидуальная форма уместна в описании их размещения среди пеших.
- source_word: ἐν μέσῳ τῶν πεζῶν
  choice: среди пеших воинов
  rationale: πεζοί — воины, сражающиеся пешими. Формулировка понятна современному читателю и сохраняет указание на расположение всадников внутри пешего строя.
- source_word: ἡ δὲ ἵππος
  choice: а конница
  rationale: ἵππος буквально означает «конь», но здесь употреблено собирательно в значении конного войска. «Конница» точно передаёт этот военный смысл.
- source_word: τῶν ὑπεναντίων
  choice: противника
  rationale: Слово обозначает противостоящую сторону. Единственное число в собирательном значении естественно для русского военного повествования.
- source_word: πολλὴ σφόδρα
  choice: была очень многочисленна
  rationale: Сочетание подчёркивает большую численность. Этот вариант естественно выражает количественный смысл и усиление σφόδρα.
