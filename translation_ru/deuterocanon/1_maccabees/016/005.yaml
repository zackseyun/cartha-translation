  text: And when they rose early in the morning[a], they went into the plain; and behold, a large force came to meet them, infantry and cavalry, and a wadi was between them.
translation:
  language: ru
  text: Встав рано утром, они направились на равнину. И вот, навстречу им выступило большое войско — пехота и конница, а между ними было русло сезонного потока.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бурный поток» либо «вади». Греческое слово может обозначать сезонный водоток или его русло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες τὸ πρωὶ
  choice: Встав рано утром
  rationale: Деепричастный оборот естественно передаёт предшествующее действие, а «рано утром» ясно выражает временное указание.
- source_word: ἐπορεύοντο
  choice: они направились
  rationale: В данном повествовательном контексте русский совершенный вид звучит естественно и передаёт начало и ход движения без излишне тяжеловесного «шли».
- source_word: τὸ πεδίον
  choice: на равнину
  rationale: В военном контексте πεδίον означает открытую ровную местность, а не возделанное поле.
- source_word: δύναμις πολλὴ
  choice: большое войско
  rationale: δύναμις здесь обозначает значительные вооружённые силы; «войско» понятно современному читателю и соответствует последующему уточнению о пехоте и коннице.
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: навстречу им выступило
  rationale: Передаёт движение к встрече или столкновению, не усиливая формулировку до прямого «напало».
- source_word: πεζικοὶ καὶ ἱππεῖς
  choice: пехота и конница
  rationale: Обычные и точные русские наименования двух родов войск.
- source_word: χειμάρρους
  choice: русло сезонного потока
  rationale: Термин обозначает зимний или сезонный водоток и может относиться как к потоку, так и к его руслу; разъясняющий перевод естественнее заимствованного «вади».
- source_word: ἦν ἀνὰ μέσον αὐτῶν
  choice: между ними было
  rationale: Прямо сохраняет пространственное положение преграды между двумя сторонами.
