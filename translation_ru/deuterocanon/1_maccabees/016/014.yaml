  source_fidelity: «Объезжал города страны» хорошо передаёт ἐφοδεύων и сохраняет оттенок последовательного посещения. «Спустился в Иерихон», имена, число года, месяц и название месяца переданы верно. Однако «заботился об управлении ими» придаёт τὰς ἐπιμελείας αὐτῶν чрезмерно узкий, институциональный смысл и в русском языке звучит не вполне естественно; греческое выражение обозначает попечение о городах, их делах или нуждах.
  naturalness: Разделение исходного длинного предложения на два русских уместно. Формулировка «заботясь об их нуждах» естественна, ясна и не добавляет конкретной административной структуры. Датировку лучше сохранить в составе второго предложения, как в оригинале.
  terminology: «Иерихон», «Маттафия», «Иуда» и «Шеват» нормативны для современного литературного библейского русского. Сноска корректно отличает греческую графическую форму «Сават» от принятой русской формы «Шеват».
