revisions:
- from: Симон объезжал города страны и заботился об управлении ими. Он спустился в Иерихон вместе со своими сыновьями Маттафией и Иудой в сто семьдесят седьмом году, в одиннадцатом месяце — месяце Шеват[a].
  to: Симон объезжал города страны, заботясь об их нуждах. Он спустился в Иерихон вместе со своими сыновьями Маттафией и Иудой в сто семьдесят седьмом году, в одиннадцатом месяце — месяце Шеват[a].
  rationale: Заменено «заботился об управлении ими» на «заботясь об их нуждах», чтобы точнее передать широкое значение греческого выражения о попечении над делами городов, не сужая его до формального управления. Остальная передача соответствует греческому тексту и английской аудиторской фиксации.
