  text: Simon was making a circuit of the cities in the country and taking care of their administration[a], and he went down to Jericho, he and Mattathias and Judas his sons, in the one hundred seventy-seventh year, in the eleventh month—that is, the month Shebat.
translation:
  language: ru
  text: Симон объезжал города страны, заботясь об их нуждах. Он спустился в Иерихон вместе со своими сыновьями Маттафией и Иудой в сто семьдесят седьмом году, в одиннадцатом месяце — месяце Шеват[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте название месяца передано как «Сават»; Шеват — общепринятая русская форма этого названия.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοδεύων
  choice: объезжал
  rationale: Передаёт последовательное посещение городов в ходе поездки и подразумеваемый административный надзор; звучит естественнее буквального «совершал обход».
- source_word: τὰς πόλεις τὰς ἐν τῇ χώρᾳ
  choice: города страны
  rationale: χώρα здесь обозначает территорию или страну, в пределах которой находились города.
- source_word: φροντίζων τὰς ἐπιμελίας αὐτῶν
  choice: заботился об управлении ими
  rationale: Сохраняет сочетание заботы и практического попечения об административных делах городов, не сводя его лишь к удовлетворению нужд.
- source_word: κατέβη εἰς Ἰεριχώ
  choice: спустился в Иерихон
  rationale: Сохраняет направительное значение καταβαίνω и естественную русскую форму названия города.
- source_word: αὐτὸς καὶ Ματταθίας καὶ Ἰούδας καὶ οἱ υἱοὶ αὐτοῦ
  choice: вместе со своими сыновьями Маттафией и Иудой
  rationale: Естественно передаёт перечисление Симона и двух названных по имени сыновей; приложение «его сыновья» отнесено к Маттафии и Иуде.
- source_word: ἔτους ἑβδόμου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: в сто семьдесят седьмом году
  rationale: Прямо передаёт номер года по подразумеваемой в контексте эре, не добавляя отсутствующего в стихе пояснения.
- source_word: μηνὶ ἐνδεκάτῳ
  choice: в одиннадцатом месяце
  rationale: Точное и естественное соответствие греческому выражению.
- source_word: Σαβάτ
  choice: Шеват
  rationale: Употреблена узнаваемая русская передача названия семитского месяца; греческая форма отмечена в сноске.
