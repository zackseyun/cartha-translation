  yaml_path: translation/deuterocanon/1_maccabees/016/006.yaml
  text: And he himself and his people encamped opposite them; and when he saw the people afraid to cross the wadi[a], he crossed first, and the men saw him and crossed after him.
translation:
  language: ru
  text: И он вместе со своим войском расположился станом напротив них. Увидев, что люди боятся перейти вади[a], он перешёл первым; и когда воины увидели это, они перешли вслед за ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бурный поток», «русло потока»; греческое слово обозначает сезонный водоток, наполняющийся после дождей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: расположился станом
  rationale: Военный контекст требует значения «стать лагерем, расположиться станом»; выражение естественно для современного русского повествования.
- source_word: αὐτὸς καὶ ὁ λαὸς αὐτοῦ
  choice: он вместе со своим войском
  rationale: λαός буквально означает «народ», но здесь обозначает находящихся под его началом людей в военном походе; «войско» ясно передаёт контекст, не добавляя конфессионального оттенка.
- source_word: κατὰ πρόσωπον αὐτῶν
  choice: напротив них
  rationale: Оборот обозначает позицию лицом к противнику, перед ним; «напротив них» сохраняет пространственный и тактический смысл.
- source_word: δειλούμενον
  choice: боятся
  rationale: Причастие описывает страх или робость людей в данной ситуации, а не выносит им нравственного приговора как трусам.
- source_word: τὸν χειμάρρουν
  choice: вади
  rationale: χείμαρρους — сезонный водоток или его русло, наполняющееся после дождей. Географический термин «вади» точно и кратко передаёт эту реалии; пояснение дано в сноске.
- source_word: διεπέρασεν πρῶτος
  choice: он перешёл первым
  rationale: Прямая формулировка сохраняет акцент на личном примере предводителя.
- source_word: οἱ ἄνδρες
  choice: воины
  rationale: Буквально «мужи, мужчины»; в непосредственном военном контексте «воины» естественно уточняет референт без добавления притяжательного местоимения.
- source_word: κατόπισθεν αὐτοῦ
  choice: вслед за ним
  rationale: Передаёт движение позади предводителя и естественную последовательность действий.
