lexical_decisions:
- source_word: Καὶ
  choice: А
  rationale: Связующее «А» естественно продолжает повествование, не добавляя временного оттенка, которого нет в греческом.
- source_word: Πτολεμαῖος ὁ τοῦ Ἀβούβου
  choice: Птолемей, сын Авува
  rationale: Родительный оборот передаёт патронимическое обозначение; явное «сын» необходимо для естественного и ясного русского текста.
- source_word: ἦν καθεστημένος
  choice: был поставлен
  rationale: Перифрастическая конструкция обозначает состояние, наступившее в результате прежнего назначения; «был поставлен» сохраняет и назначение, и его действующий результат.
- source_word: στρατηγὸς
  choice: правителем
  rationale: В сочетании с указанием подведомственной территории слово обозначает военно-административную должность; «правитель» естественнее передаёт здесь полномочия над округом, чем узкое «военачальник».
- source_word: εἰς τὸ πεδίον Ἰεριχώ
  choice: Иерихонской равнины
  rationale: При обозначении должности εἰς указывает сферу полномочий, а πεδίον — равнину; русская конструкция с родительным падежом кратко и естественно выражает управление этой территорией.
- source_word: εἶχεν ἀργύριον καὶ χρυσίον πολύ
  choice: владел множеством серебра и золота
  rationale: «Владел» в данном контексте ясно выражает обладание богатством, а «множеством серебра и золота» сохраняет смысл πολύ и предметное значение существительных.
