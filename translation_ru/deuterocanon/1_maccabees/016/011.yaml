  text: And Ptolemy son of Abubus had been appointed governor over the plain of Jericho[a], and he had much silver and gold;
translation:
  language: ru
  text: А Птолемей, сын Авува, был поставлен правителем Иерихонской равнины[a] и имел много серебра и золота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово στρατηγός может также означать «военачальник» или «военный правитель». Здесь оно переведено как «правитель», поскольку речь идёт о власти над определённой территорией, а не только о командовании войском.
