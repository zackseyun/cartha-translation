base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/002.yaml
  text: And Simon called his two older sons, Judas and John, and said to them, “I and my brothers and my father’s house have fought the wars of Israel from youth until this day, and it has prospered in our hands to deliver Israel many times.”
translation:
  language: ru
  text: 'И призвал Симон двух своих старших сыновей, Иуду и Иоанна, и сказал им: «Я, мои братья и дом моего отца вели войны Израиля с юности до сего дня, и нам удавалось избавлять Израиль много раз».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и преуспело в наших руках избавить Израиль много раз».'
    reason: Сноска сохраняет образность и необычную конструкцию греческого εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν, тогда как основной текст передаёт её естественным современным русским выражением.
lexical_decisions:
- source_word: τοὺς δύο υἱοὺς αὐτοῦ τοὺς πρεσβυτέρους
  choice: двух своих старших сыновей
  rationale: Сравнительная форма πρεσβυτέρους означает «старших»; этот вариант естественен по-русски и не утверждает, что у Симона было всего два сына.
- source_word: ἐπολεμήσαμεν τοὺς πολέμους Ἰσραήλ
  choice: вели войны Израиля
  rationale: 'Глагол передаёт продолжительную военную деятельность, а родительный падеж «Израиля» сохраняет неоднозначность: войны могли быть войнами Израиля или войнами за Израиль.'
- source_word: ἀπὸ νεότητος ἕως τῆς σήμερον ἡμέρας
  choice: с юности до сего дня
  rationale: Сохраняется временной диапазон от ранних лет до момента речи; оборот имеет достойный библейский регистр и остаётся понятным современному читателю.
- source_word: εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν
  choice: нам удавалось
  rationale: Естественно передаёт идиому успешного действия без неуклюжего буквального выражения «преуспело в наших руках» и без добавления не названного в греческом тексте субъекта.
- source_word: ῥύσασθαι τὸν Ἰσραήλ
  choice: избавлять Израиль
  rationale: «Избавлять» точно выражает спасение от военной опасности и не усиливает здесь сотериологический оттенок.
- source_word: πλεονάκις
  choice: много раз
  rationale: Прямо передаёт повторяемость успешного избавления.
theological_decisions:
- issue: Кому приписано избавление Израиля
  choice: 'Сохранить семью Симона как названных человеческих деятелей: «нам удавалось избавлять Израиль».'
  alternative: «Бог даровал нам много раз избавить Израиль» или буквальное «в наших руках преуспело избавить Израиль».
  rationale: Греческий текст прямо не называет Бога субъектом действия, хотя выражение может подразумевать провиденциальный успех. Перевод не добавляет божественного деятеля и не устраняет акцент на человеческом участии.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным библейским звучанием. Имена переданы в традиционной русской форме: Симон, Иуда, Иоанн. Неоднозначность выражения «войны Израиля» сохранена.'
