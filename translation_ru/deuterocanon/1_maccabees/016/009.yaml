  yaml_path: translation/deuterocanon/1_maccabees/016/009.yaml
  text: Then Judas[a], the brother of John, was wounded; but John pursued them until he came to Kedron[b], which he had built.
translation:
  language: ru
  text: Тогда Иуда, брат Иоанна, был ранен, но Иоанн преследовал их, пока не дошёл до Кедрона[a], который он построил[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кедрон — название места; не следует смешивать его с одноимённым потоком близ Иерусалима.
    reason: geographical_clarification
  - marker: b
    text: Слова «который он построил» грамматически относятся к Кедрону; местоимение «он» естественнее всего понимать как указание на Иоанна, хотя греческий текст не называет его повторно.
    reason: antecedent_ambiguity
lexical_decisions:
- source_word: ἐτραυματίσθη
  choice: был ранен
  rationale: Пассивный аорист в военном контексте обозначает полученную Иудой рану; «был ранен» передаёт это прямо и естественно.
- source_word: κατεδίωξεν
  choice: преследовал
  rationale: Глагол означает деятельное преследование отступающего противника; выбранное слово соответствует повествовательному и военному контексту.
- source_word: ἕως ἐλθεῖν
  choice: пока не дошёл
  rationale: Инфинитивная конструкция обозначает предел преследования. По ближайшему синтаксическому продолжению субъектом движения естественно понимать Иоанна, не устраняя при этом объект преследования из предыдущей части фразы.
- source_word: Κεδρών
  choice: Кедрон
  rationale: Прямая и привычная русская передача греческого топонима Κεδρών.
- source_word: οἰκοδόμησεν
  choice: построил
  rationale: Глагол прямо означает «построил»; перевод «укрепил» добавлял бы отсутствующий в исходном тексте смысл.
