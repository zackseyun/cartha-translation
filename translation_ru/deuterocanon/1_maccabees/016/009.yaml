  naturalness: Современная литературная русская формулировка естественна и ясна. «Был ранен», «преследовал их» и «пока не дошёл» уместны в сжатом историческом повествовании. Сочетание «Кедрон, который он построил» несколько необычно лишь потому, что речь идёт о населённом месте, но оно верно передаёт исходный текст и не нуждается в сглаживании.
  terminology: Имена «Иуда», «Иоанн» и топоним «Кедрон» переданы последовательно. «Построил» точно соответствует οἰκοδόμησεν и не вносит более узкого смысла, например «укрепил». Сноски корректно поясняют топоним и синтаксическую отсылку, не навязывая интерпретацию.
