  text: to Azotus[a], and they entered Beth-dagon, their idol temple, to be saved[b]. And Jonathan burned Azotus and the cities around it.
translation:
  language: ru
  text: в Азот[a], и вошли в Бет-Дагон, своё идольское святилище[b], чтобы спастись. Ионафан же предал огню Азот и окрестные города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Азот — греческое название Ашдода.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «свой идол». Вероятно, здесь имеется в виду идольское святилище в Бет-Дагоне, а не только изваяние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄζωτον
  choice: Азот
  rationale: Сохранена греческая форма названия города; еврейский эквивалент «Ашдод» указан в примечании.
- source_word: εἰσῆλθον
  choice: вошли
  rationale: Естественно и точно передаёт аорист глагола движения.
- source_word: Βηθδαγὼν
  choice: Бет-Дагон
  rationale: Название передано транслитерацией с разделением компонентов, понятным современному русскому читателю.
- source_word: τὸ εἴδωλον αὐτῶν
  choice: своё идольское святилище
  rationale: Буквально выражение означает «свой идол», однако в данном синтаксическом и повествовательном контексте оно, вероятнее всего, обозначает святилище при Бет-Дагоне; неоднозначность сохранена в примечании.
- source_word: τοῦ σωθῆναι
  choice: чтобы спастись
  rationale: Инфинитив с артиклем выражает цель; в военном контексте речь идёт о физическом спасении.
- source_word: ἐνεπύρισεν
  choice: предал огню
  rationale: Достойная повествовательная формулировка, передающая действие «поджёг», но не утверждающая непременно полное уничтожение.
- source_word: τὰς πόλεις τὰς κύκλῳ
  choice: окрестные города
  rationale: Кратко и естественно передаёт города, расположенные вокруг Азота.
theological_decisions:
- issue: Значение σωθῆναι в контексте военного бегства
  choice: физически спастись, найти убежище
  alternative: получить духовное спасение
  rationale: Повествование описывает попытку укрыться от военной угрозы в языческом святилище, поэтому богословский смысл спасения здесь не навязывается.
- issue: Референт выражения τὸ εἴδωλον αὐτῶν
  choice: идольское святилище в Бет-Дагоне
  alternative: только изваяние идола
  rationale: Глагол «вошли» и название Бет-Дагон указывают на здание или храмовый комплекс, но буквальное значение выражения отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным повествовательным строем. Начальная форма «в Азот» сохранена как продолжение предложения из предыдущего стиха. Частица «же» поддерживает плавный переход к действию Ионафана.
