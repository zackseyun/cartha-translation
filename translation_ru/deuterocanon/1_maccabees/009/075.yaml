  text: And he encamped against Joppa[a], but those from the city shut him out, because a garrison of Apollonius was in Joppa; and they fought against it.
translation:
  language: ru
  text: И он расположился станом против Иоппии, но жители города не впустили его, потому что в Иоппии находился гарнизон Аполлония; и они сразились с ней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «они сразились с ней». После предшествующего глагола в единственном числе подлежащее неожиданно меняется на множественное; вероятно, имеются в виду Ионафан и его воины, а местоимение «с ней» относится к Иоппии. Неоднозначность исходного текста сохранена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ
  choice: расположился станом против
  rationale: Передаёт как буквальное устройство военного лагеря, так и враждебную направленность действия против города.
- source_word: Ἰόππην / ἐν Ἰόππῃ
  choice: Иоппии / в Иоппии
  rationale: Традиционная русская форма древнего названия города с нормативным склонением.
- source_word: ἀπέκλεισαν αὐτὸν
  choice: не впустили его
  rationale: Естественно по-русски выражает значение недопущения в город при сохранении прямого объекта «его».
- source_word: οἱ ἐκ τῆς πόλεως
  choice: жители города
  rationale: Ясно обозначает людей, принадлежавших к городу, не добавляя указания на пол.
- source_word: φρουρὰ Ἀπολλωνίου
  choice: гарнизон Аполлония
  rationale: Передаёт находившийся в городе военный отряд, принадлежавший Аполлонию или подчинённый ему.
- source_word: ἐπολέμησαν αὐτήν
  choice: они сразились с ней
  rationale: Сохраняет множественное число греческого глагола и женский род местоимения, вероятнее всего относящегося к Иоппии, не сглаживая резкую смену подлежащего.
