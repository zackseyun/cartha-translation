  footnotes:
  - marker: a
    text: 'Греческий текст здесь представляет собой обрывок предложения: «Тайно позади них. Ионафан понял, что это засада». Резкое начало, вероятно, связано с предшествующим контекстом; как самостоятельный стих этот фрагмент не образует законченного предложения.'
