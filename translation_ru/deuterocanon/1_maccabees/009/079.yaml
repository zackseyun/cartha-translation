lexical_decisions:
- source_word: κρυπτῶς
  choice: тайно
  rationale: Наречие обозначает скрытый, негласный образ действия; «тайно» точно и естественно передаёт этот смысл.
- source_word: κατόπισθεν
  choice: позади
  rationale: В данном военном контексте пространственное значение «позади» наиболее непосредственно.
- source_word: αὐτῶν
  choice: них
  rationale: Местоимение стоит в родительном падеже множественного числа и указывает на множественного референта.
- source_word: ἔγνω
  choice: понял
  rationale: Аорист γινώσκω здесь описывает распознание ситуации; по-русски «понял» естественнее, чем статическое «знал», и не добавляет лишних подробностей.
- source_word: ἔνεδρον
  choice: засада
  rationale: Военный термин может обозначать как засаду, так и отряд, находящийся в засаде; «засада» сохраняет эту контекстуальную ёмкость и звучит естественно.
