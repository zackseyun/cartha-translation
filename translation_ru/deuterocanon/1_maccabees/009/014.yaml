  text: And Judas saw that Bacchides and the main strength of the camp were on the right[b][a], and all the men courageous in heart gathered around him.
translation:
  language: ru
  text: И увидел Иуда, что Вакхид и главная сила войска находятся справа, и собрались к нему все мужественные сердцем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεν
  choice: увидел
  rationale: Прямое повествовательное значение аориста от ὁράω; не добавляет оттенка умозаключения.
- source_word: τὸ στερέωμα τῆς παρεμβολῆς
  choice: главная сила войска
  rationale: В военном контексте στερέωμα обозначает крепкое ядро или основную силу, а παρεμβολή — расположенное в боевом порядке войско; перевод не сводит выражение к физическому укреплению.
- source_word: ἐν τοῖς δεξιοῖς
  choice: справа
  rationale: Естественно передаёт положение на правой стороне или правом фланге, не уточняя больше, чем сказано в греческом тексте.
- source_word: συνῆλθον αὐτῷ
  choice: собрались к нему
  rationale: Сохраняет значение совместного схождения и направленность к Иуде, выраженную дательным αὐτῷ.
- source_word: πάντες οἱ εὔψυχοι τῇ καρδίᾳ
  choice: все мужественные сердцем
  rationale: Передаёт мужество и внутреннюю решимость, сохраняя образ сердца; русская форма множественного числа в данном военном контексте относится к мужчинам-воинам без добавления отсутствующего существительного.
theological_decisions:
- issue: Родовая отнесённость участников сражения
  choice: все мужественные сердцем
  alternative: все мужественные мужи
  rationale: Греческая форма мужского рода в контексте обозначает воинов, однако существительного «мужи» в оригинале нет. Русское субстантивированное прилагательное сохраняет мужскую отнесённость и формальную краткость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской повествовательной интонацией. Сохранены повтор союза «и», образ сердца и неоднозначность выражения о главной силе войска; не добавлено прямое обозначение правого фланга.
