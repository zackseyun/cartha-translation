  source_fidelity: 'Текст точно передаёт греческий оригинал: «увидел» соответствует ἰδεν; «Вакхид и главная сила войска» передаёт Βακχίδης καὶ τὸ στερέωμα τῆς παρεμβολῆς без ошибочного понимания στερέωμα как укрепления; «справа» сохраняет неуточнённость ἐν τοῖς δεξιοῖς; «собрались к нему» передаёт συνῆλθον αὐτῷ; «все мужественные сердцем» сохраняет образное τῇ καρδίᾳ.'
