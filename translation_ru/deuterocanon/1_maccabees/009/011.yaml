  yaml_path: translation/deuterocanon/1_maccabees/009/011.yaml
  text: And the force moved out from the camp and took their stand to meet them[a], and the cavalry was divided into two parts, and the slingers and the archers went before the force, and all the mighty men were in the front ranks.
translation:
  language: ru
  text: И войско вышло из лагеря и построилось им навстречу. Конница была разделена на две части, пращники и лучники шли впереди войска, а все сильные воины находились в первых рядах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а передовыми бойцами были все сильные воины». Греческое выражение сжато; слово πρωταγωνισταί, вероятно, обозначает тех, кто сражается впереди, в первых рядах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν ἡ δύναμις ἀπὸ τῆς παρεμβολῆς
  choice: войско вышло из лагеря
  rationale: В военном контексте ἀπαίρω обозначает выступление из места стоянки, δύναμις — вооружённое войско, а παρεμβολή — лагерь.
- source_word: ἔστησαν εἰς συνάντησιν αὐτοῖς
  choice: построилось им навстречу
  rationale: Передаёт как намеренное занятие позиции, так и цель — встретить противника; военный глагол «построилось» естественнее буквального «встало».
- source_word: ἡ ἵππος
  choice: конница
  rationale: Собирательное употребление слова «лошадь» в военном контексте обозначает конные войска.
- source_word: ἐμερίσθη ... εἰς δύο μέρη
  choice: была разделена на две части
  rationale: Прямая передача пассивной конструкции и тактического разделения подразделения.
- source_word: οἱ σφενδονῆται καὶ οἱ τοξόται
  choice: пращники и лучники
  rationale: Устоявшиеся русские наименования воинов, вооружённых пращами и луками.
- source_word: προεπορεύοντο τῆς δυνάμεως
  choice: шли впереди войска
  rationale: 'Сохраняет пространственное значение: эти подразделения двигались перед основными силами, без добавления смысла командования.'
- source_word: οἱ πρωταγωνισταὶ πάντες οἱ δυνατοί
  choice: все сильные воины находились в первых рядах
  rationale: Передаёт вероятный тактический смысл πρωταγωνισταί — сражающиеся на передовой позиции — и сохраняет значение δυνατοί как сильных, способных воинов.
