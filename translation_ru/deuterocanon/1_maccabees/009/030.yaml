  text: Now therefore we have chosen you today to be for us, in his place, a ruler and leader, to fight our war.
translation:
  language: ru
  text: Итак, сегодня мы избрали тебя, чтобы вместо него ты стал для нас правителем и предводителем, чтобы вести нашу войну.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρετισάμεθα
  choice: мы избрали
  rationale: Средний аорист обозначает выбор человека для определённого служения. «Избрали» естественно передаёт осознанный совместный выбор, не превращая его в технический избирательный термин.
- source_word: ἀντʼ αὐτοῦ
  choice: вместо него
  rationale: Оборот прямо указывает на занятие места прежнего руководителя и сохраняет ясную связь с предшественником.
- source_word: ἄρχοντα
  choice: правителем
  rationale: Слово широко обозначает лицо, наделённое властью. «Правитель» сохраняет общий властный смысл и не сужает его до чисто военной должности.
- source_word: ἡγούμενον
  choice: вождём
  rationale: Здесь обозначен тот, кто ведёт народ, в том числе в военном противостоянии. «Вождь» отчётливо отличается от «правителя» и естественно соответствует историческому контексту.
- source_word: τοῦ πολεμῆσαι
  choice: и вёл
  rationale: Артикулированный инфинитив выражает цель избрания. Русская конструкция «чтобы… стал… и вёл» естественно передаёт эту цель без тяжеловесного буквального оборота.
- source_word: τὸν πόλεμον ἡμῶν
  choice: нашу войну
  rationale: πόλεμος означает войну, а не отдельное сражение; притяжательное местоимение сохраняет представление об общей борьбе говорящих.
theological_decisions:
- issue: Передача парных титулов ἄρχοντα καὶ ἡγούμενον
  choice: правителем и вождём
  alternative: правителем и руководителем; начальником и предводителем
  rationale: 'Выбранный вариант сохраняет два различных аспекта: властное положение и деятельное предводительство. Он не вводит позднейшего официального или конфессионального титула.'
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным историческим звучанием. Синтаксис перестроен естественно для русского: единая целевая конструкция «чтобы… стал… и вёл» передаёт греческие εἰς с винительным и τοῦ с инфинитивом.'
