  text: After these words it was reported to Jonathan and Simon his brother that the sons of Jambri were holding a great wedding[a], and were bringing the bride from Nadabath, the daughter of one of the great nobles of Canaan, with a large escort.
translation:
  language: ru
  text: После этих слов Ионафану и его брату Симону сообщили, что сыновья Иамври устраивают большую свадьбу и ведут из Надавафы невесту — дочь одного из великих вельмож Ханаана — в сопровождении большой свиты[a].
  philosophy: optimal-equivalence
  footnotes:
