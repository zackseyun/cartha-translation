    text: 'Или: «в сопровождении большого шествия». Греческое слово παραπομπή может обозначать как сопровождающую свиту, так и само торжественное шествие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τοὺς λόγους τούτους
  choice: После этих слов
  rationale: Сохраняет прямое значение λόγοι и естественно служит переходом к следующему событию; более широкое «после этого» устранило бы возможную отсылку именно к сказанному.
- source_word: ἀπηγγέλησαν
  choice: донесли
  rationale: Безличная конструкция естественно передаёт греческую пассивную форму и не вводит не названного в тексте деятеля.
- source_word: Ἰωναθὰν καὶ Σίμωνι τῷ ἀδελφῷ αὐτοῦ
  choice: Ионафану и его брату Симону
  rationale: Передаёт дательный падеж и ясно относит обозначение родства к Симону как брату Ионафана.
- source_word: Υἱοὶ Ἰαμβρὶ
  choice: сыновья Иамври
  rationale: Сохраняет родовое наименование и семейно-клановую форму греческого выражения, не заменяя её толкованием «род Иамври».
- source_word: ποιοῦσιν γάμον μέγαν
  choice: устраивают большую свадьбу
  rationale: Идиоматично передаёт ποιεῖν γάμον, а прилагательное «большую» сохраняет μέγαν без добавления прямо не названного свадебного пира.
- source_word: ἄγουσι τὴν νύμφην
  choice: везут … невесту
  rationale: В данном свадебном контексте естественно передаёт движение невесты к месту свадьбы; «ведут» могло бы неоправданно подразумевать пешее шествие.
- source_word: ἀπὸ Ναδαβάθ
  choice: из Надавафа
  rationale: Предлог «из» обозначает исходный пункт, а имя передано транслитерацией греческой формы с традиционной передачей θ через «ф».
- source_word: θυγατέρα ἑνὸς τῶν μεγάλων μεγιστάνων Χαναάν
  choice: дочь одного из знатнейших вельмож Ханаана
  rationale: «Вельможа» передаёт высокий общественный ранг μεγιστάν, а превосходная форма «знатнейших» естественно воспроизводит усиленное сочетание μεγάλων μεγιστάνων без тяжеловесного повтора.
- source_word: μετὰ παραπομπῆς μεγάλης
  choice: в сопровождении большой свиты
  rationale: Передаёт конкретный смысл сопровождающей группы; возможность понимать παραπομπή как торжественное шествие сохранена в сноске.
