  yaml_path: translation/deuterocanon/1_maccabees/009/033.yaml
  text: And Jonathan and Simon his brother[a], and all those with him, learned of it[b], and they fled into the wilderness of Tekoa and encamped by the water of the cistern of Asphar.
translation:
  language: ru
  text: Ионафан, его брат Симон и все, кто был с ним, узнали об этом[a] и бежали в пустыню Фекои. Они разбили лагерь у воды цистерны Асфар[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узнали». В греческом не сказано прямо, что именно они узнали; это подразумевается из контекста.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может означать яму, цистерну или колодец; сочетание со словом «вода» указывает на источник воды или резервуар.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: узнали об этом
  rationale: Аорист γινώσκω обозначает, что группа получила известие о подразумеваемых из контекста событиях; дополнение в греческом не выражено, поэтому «об этом» передаёт его без излишнего уточнения.
- source_word: ἔφυγον
  choice: бежали
  rationale: Глагол выражает бегство перед опасностью и сохраняет срочность действия.
- source_word: ἔρημον Θεκώε
  choice: пустыню Фекои
  rationale: ἔρημος здесь обозначает малонаселённую пустынную местность; «пустыня» естественно для иудейского географического контекста.
- source_word: παρενέβαλον
  choice: расположились станом
  rationale: Глагол означает разбить или устроить лагерь; выбранный оборот сохраняет повествовательный и слегка военный оттенок.
- source_word: ἐπὶ τὸ ὕδωρ λάκκου
  choice: у водоёма
  rationale: Буквально говорится о расположении у воды λάκκος. Поскольку λάκκος может быть ямой или цистерной, а наличие воды указывает на источник либо резервуар, «водоём» естественно передаёт смысл, не уточняя устройство сверх текста.
- source_word: Ἀσφάρ
  choice: Асфар
  rationale: Название транслитерировано непосредственно по греческой форме.
