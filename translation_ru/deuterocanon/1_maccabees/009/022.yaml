  yaml_path: translation/deuterocanon/1_maccabees/009/022.yaml
  text: And the rest of the accounts concerning Judas, and his wars, and the brave deeds that he did, and his greatness, were not recorded; for they were very many.
translation:
  language: ru
  text: А остальные рассказы об Иуде, о его войнах, о совершённых им доблестных подвигах и о его величии не были записаны, потому что их было чрезвычайно много.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ περισσὰ τῶν λόγων Ἰούδα
  choice: остальные рассказы об Иуде
  rationale: Оборот обозначает оставшуюся, не изложенную здесь часть повествований или сведений об Иуде; «рассказы» естественно передаёт историографическое значение λόγοι.
- source_word: τῶν πολέμων
  choice: о его войнах
  rationale: Слово широко обозначает военные конфликты Иуды; «войны» сохраняет объём греческого выражения, не сужая его до отдельных сражений.
- source_word: τῶν ἀνδραγαθιῶν ὧν ἐποίησεν
  choice: о совершённых им доблестных подвигах
  rationale: ἀνδραγαθία означает проявление доблести или геройский поступок. «Доблестные подвиги» передаёт хвалебную окраску без архаического буквального указания на мужественность.
- source_word: τῆς μεγαλωσύνης αὐτοῦ
  choice: о его величии
  rationale: В данном контексте μεγαλωσύνη обозначает величие и выдающийся масштаб личности Иуды, а не специальный царский титул.
- source_word: οὐ κατεγράφη
  choice: не были записаны
  rationale: Пассивная форма указывает, что всё перечисленное не вошло в письменную летопись; форма единственного числа в греческом согласована с собирательным τὰ περισσά, тогда как по-русски естественно множественное число при «рассказы».
- source_word: πολλὰ γὰρ ἦν σφόδρα
  choice: потому что их было чрезвычайно много
  rationale: Передаёт объяснительное γάρ и усиленное σφόδρα, а местоимение «их» ясно отсылает к не записанным рассказам и сведениям.
