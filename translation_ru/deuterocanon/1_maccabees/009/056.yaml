  text: И Алким умер тогда, в тяжких мучениях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Алким умер тогда после тяжких мучений». Греческий оборот μετὰ βασάνου μεγάλης может описывать как мучения, сопровождавшие его смерть, так и тяжёлые страдания, предшествовавшие ей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: умер
  rationale: Аорист ἀποθνῄσκω прямо сообщает о наступившей смерти; «умер» — естественный и точный русский эквивалент.
- source_word: Ἄλκιμος
  choice: Алким
  rationale: Использована традиционная русская форма имени, принятая для этого персонажа.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: в то время
  rationale: Оборот обозначает общее время события без придания слову καιρός специального смысла.
- source_word: μετὰ βασάνου μεγάλης
  choice: претерпев тяжкие мучения
  rationale: Выражение передаёт сильные страдания, связанные со смертью или предшествовавшие ей. Деепричастный оборот звучит естественно по-русски, сохраняя при этом контекстуальную неоднозначность, пояснённую в сноске.
- source_word: βασάνου
  choice: мучения
  rationale: Слово обозначает тяжёлую боль, истязание или мучительное страдание; множественное число в русском идиоматично передаёт интенсивность.
