base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/045.yaml
  text: For behold[a], the battle is before us and behind us, while the water of the Jordan is on this side and on that, with marsh and forest[b], and there is no place to turn aside.
translation:
  language: ru
  text: 'Ведь смотрите: битва перед нами и позади нас, а воды Иордана — с этой и с той стороны, болото и лес; и уклониться некуда[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отступить некуда»; также возможно: «спастись некуда». Греческий глагол буквально означает «уклониться, свернуть в сторону» и в данном контексте указывает на отсутствие пути отхода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Ведь вот
  rationale: Сочетание передаёт пояснительное γάρ и привлекающее внимание ἰδού, сохраняя живой, но достойный современный русский регистр.
- source_word: ὁ πόλεμος
  choice: битва
  rationale: В данном тактическом контексте речь идёт о непосредственном сражении, а не о войне в широком смысле.
- source_word: ἐξ ἐναντίας ἡμῶν καὶ ἐξόπισθεν ἡμῶν
  choice: перед нами и позади нас
  rationale: Пространственное противопоставление ясно передаёт положение воинов между силами противника.
- source_word: τὸ ὕδωρ τοῦ Ἰορδάνου
  choice: воды Иордана
  rationale: Множественное число естественно по-русски обозначает речную воду как преграду и сохраняет явный акцент греческого текста на воде.
- source_word: ἔνθεν καὶ ἔνθεν
  choice: и по одну, и по другую сторону
  rationale: Передаёт распределительное пространственное значение греческого оборота естественным русским выражением.
- source_word: ἕλος καὶ δρυμός
  choice: болото и лес
  rationale: Прямые и понятные обозначения двух видов труднопроходимой местности; δρυμός здесь не обязательно означает именно дубраву.
- source_word: οὐκ ἔστι τόπος τοῦ ἐκκλῖναι
  choice: уклониться некуда
  rationale: Сохраняет образ сворачивания в сторону или уклонения, одновременно естественно выражая отсутствие пути отхода.
