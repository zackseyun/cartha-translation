lexical_decisions:
- source_word: ἐξέλεξεν
  choice: выбрал
  rationale: Прямо передаёт аорист глагола со значением выбора и естественно звучит в современном русском языке.
- source_word: Βακχίδης
  choice: Вакхид
  rationale: Традиционная русская форма греческого личного имени.
- source_word: τοὺς ἀσεβεῖς ἄνδρας
  choice: нечестивых людей
  rationale: ἀσεβεῖς обозначает людей, отвергающих благочестие; «нечестивых» сохраняет религиозно-нравственный оттенок, а «людей» здесь естественно передаёт множественное ἄνδρας без утраты личного характера обозначения.
- source_word: κατέστησεν
  choice: поставил
  rationale: В данном контексте глагол означает наделение положением и властью; «поставил» передаёт это прямо и идиоматично.
- source_word: κυρίους
  choice: правителями
  rationale: Буквально слово означает «господами» или «владыками», но в политико-административном контексте речь идёт о лицах, получивших власть; буквальная возможность отмечена в сноске.
- source_word: τῆς χώρας
  choice: страны
  rationale: χώρα здесь обозначает территорию или страну; родительный падеж естественно сочетается с «правителями» и сохраняет греческую конструкцию.
