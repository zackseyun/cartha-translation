    text: Название «Феманафа-Фарафон» также передают как «Фимнафа-Фарафон» или «Тимнаф-Фарафон»; варианты отражают различия в традициях передачи древнего топонима.
    reason: lexical_alternative
  - marker: b
    text: «Тефон» — передача греческой формы названия; в некоторых традициях встречается вариант «Тафон».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν
  choice: возвратились
  rationale: Глагол обозначает возвращение в прежнее место; эта передача естественна для современного русского литературного языка.
- source_word: ᾠκοδόμησαν
  choice: построили
  rationale: Греческий глагол означает «строить, возводить» и сам по себе не указывает однозначно на повторное строительство, поэтому «отстроили» или «восстановили» было бы излишним уточнением.
- source_word: πόλεις ὀχυράς
  choice: укреплённые города
  rationale: Сочетание обозначает города, подготовленные к обороне; выбран обычный и точный русский оборот.
- source_word: τὸ ὀχύρωμα
  choice: крепость
  rationale: Существительное обозначает укреплённое оборонительное сооружение; «крепость» ясно и естественно передаёт его в данном военном контексте.
- source_word: Ἰερειχώ
  choice: Иерихон
  rationale: Устоявшаяся русская форма библейского топонима.
- source_word: Ἐμμαούμ
  choice: Эммаус
  rationale: Устоявшаяся русская форма топонима.
- source_word: Βεθωρών
  choice: Бет-Хорон
  rationale: Форма близка к семитскому топониму и соответствует современному русскому употреблению.
- source_word: Βαιθήλ
  choice: Вефиль
  rationale: Традиционная и широко узнаваемая русская библейская форма названия Бет-Эль.
- source_word: Θεμανάθα Φαραθών
  choice: Фамнафа-Фарафон
  rationale: Транслитерация следует греческой форме с традиционной передачей θ через «ф»; вариантность древнего топонима отмечена в сноске.
- source_word: Τεφών
  choice: Тефон
  rationale: Прямая и читаемая передача греческой формы; вариантное написание сохранено в сноске.
- source_word: ἐν τείχεσιν ὑψηλοῖς
  choice: с высокими стенами
  rationale: Предлог ἐν здесь описывает оснащение или обстоятельства укрепления; русский оборот естественно передаёт эту функцию.
- source_word: πύλαις καὶ μοχλοῖς
  choice: воротами и засовами
  rationale: Обычные значения слов точно описывают оборонительные элементы; «засовы» передают запирающие брусья ворот.
