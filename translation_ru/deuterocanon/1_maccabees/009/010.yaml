base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/010.yaml
  text: And Judas said[a], “Far be it from me to do this thing—to flee from them. And if our time has drawn near, let us die bravely for the sake of our brothers[b], and let us not leave a cause for reproach to our glory.”
translation:
  language: ru
  text: 'Иуда сказал: «Не бывать тому, чтобы я совершил такое — бежал от них! Приблизился наш час; умрём же доблестно[a] ради наших братьев и не дадим повода опорочить нашу славу[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умрём мужественно»; греческое выражение означает смерть с мужеством и доблестью.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «не оставим причины (или основания, обвинения) нашей славе». Здесь «слава» может означать также честь, доброе имя или репутацию.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Μή μοι γένοιτο
  choice: Не бывать тому, чтобы я
  rationale: Современная и выразительная русская формула решительного личного отказа, соответствующая греческому оптативу отрицания.
- source_word: ποιῆσαι τὸ πρᾶγμα τοῦτο, φυγεῖν ἀπʼ αὐτῶν
  choice: совершил такое — бежал от них
  rationale: Инфинитив φυγεῖν поясняет, в чём состоит «такое» дело; тире естественно передаёт это пояснение по-русски.
- source_word: ἤγγικεν ὁ καιρὸς ἡμῶν
  choice: Наше время приблизилось
  rationale: Сохраняет утверждение греческого текста и неоднозначность καιρός как решающего срока или часа, вероятно связанного со смертью в бою. Условное «если» в греческом отсутствует.
- source_word: ἀποθάνωμεν ἀνδρίᾳ
  choice: умрём же доблестно
  rationale: Передаёт призыв и значение мужества, доблести и отваги без архаичного или чрезмерно буквального выражения «по-мужски».
- source_word: χάριν τῶν ἀδελφῶν ἡμῶν
  choice: ради наших братьев
  rationale: Прямо передаёт χάριν с родительным падежом и сохраняет мужской род ἀδελφῶν в военном и национально-родственном контексте.
- source_word: μὴ καταλίπωμεν αἰτίαν τῇ δόξῃ ἡμῶν
  choice: не оставим пятна на нашей славе
  rationale: Естественная русская формулировка для мысли о поступке, который дал бы основание к порицанию и повредил бы чести или доброй славе; неоднозначность ключевых слов отмечена в сноске.
theological_decisions:
- issue: Значение ἀδελφῶν в военном контексте
  choice: братьев
  alternative: соплеменников; братьев и сестёр
  rationale: Форма греческого слова явно мужского рода и здесь, вероятнее всего, обозначает собратьев-воинов или соотечественников. Перевод не расширяет её до смешанной группы без текстового основания.
- issue: Значение δόξα в контексте чести и позора
  choice: слава
  alternative: честь; доброе имя; репутация
  rationale: «Слава» сохраняет обычное соответствие δόξα, а образ «пятна» показывает контекстуальное значение общественной чести и доброго имени, не сводя слово только к одному из этих оттенков.
- issue: Утверждение ἤγγικεν без условной частицы
  choice: Наше время приблизилось
  alternative: Если наше время приблизилось
  rationale: В исходном греческом тексте нет условной частицы; καί связывает следующее утверждение с предыдущим. Поэтому условное «если», присутствующее в консультационном английском тексте, не внесено.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным воинским регистром. Решительный отказ передан идиоматически; декларативный характер фразы о приблизившемся времени восстановлен по греческому источнику. Сноски стоят непосредственно при словах, которые они поясняют.
