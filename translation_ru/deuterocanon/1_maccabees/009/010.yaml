  source_fidelity: Начало, «ради наших братьев» и призыв «умрём же доблестно» в целом верно передают греческий текст. «Наше время приблизилось» формально возможно, но по-русски звучит менее естественно, чем «приблизился наш час» для καιρός. Образ «не оставим пятна на нашей славе» несколько преобразует αἰτία («причина, повод, основание для обвинения/упрёка») в уже наличествующее пятно; безопаснее передать мысль как недопущение повода опорочить славу.
