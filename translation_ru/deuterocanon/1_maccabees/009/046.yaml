lexical_decisions:
- source_word: νῦν οὖν
  choice: Итак, теперь
  rationale: Сочетание передаёт одновременно вывод из предшествующего и настоятельный переход к немедленному действию.
- source_word: κεκράξατε
  choice: воззовите
  rationale: Аористный императив κράζω выражает настойчивый, громкий призыв о помощи. «Воззовите» естественно для молитвенного контекста и сохраняет возвышенный библейский регистр.
- source_word: εἰς οὐρανόν
  choice: к небу
  rationale: Греческий текст буквально называет небо; в контексте это, вероятно, благоговенная метонимия Бога или небесной сферы. Перевод сохраняет формулировку источника, не раскрывая метонимию в основном тексте.
- source_word: ὅπως
  choice: чтобы
  rationale: Союз вводит цель или предполагаемый результат и естественно передаётся русским «чтобы».
- source_word: διασωθῆτε
  choice: вы были спасены
  rationale: Пассивный аористный конъюнктив διασῴζω означает спасение или избавление от непосредственной опасности. Пассивная конструкция сохраняет грамматическую форму и не называет прямо действующего избавителя.
- source_word: ἐκ χειρὸς
  choice: от руки
  rationale: Сохранён понятный библейский образ руки как власти или контроля, а не заменён толкованием «от власти».
- source_word: ἐχθρῶν ἡμῶν
  choice: наших врагов
  rationale: Прямой и естественный русский эквивалент греческой притяжательной конструкции.
theological_decisions:
- issue: Следует ли перевести «небо» буквально или истолковать его как прямое обозначение Бога
  choice: к небу
  alternative: к Богу
  rationale: В греческом тексте стоит «к небу». Хотя выражение, вероятно, благоговенно указывает на Бога, прямое именование Бога устранило бы сохранённую источником метонимию и богословскую сдержанность.
- issue: Следует ли явно назвать Бога совершающим спасение
  choice: чтобы вы были спасены
  alternative: чтобы Бог спас вас
  rationale: Греческая пассивная форма оставляет действующее лицо неназванным. Русский пассив сохраняет эту особенность и допускаемый контекстом намёк на божественное действие, не делая его эксплицитнее оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Воззовите» и образ «от руки» сохраняют достоинство и образность оригинала, оставаясь понятными современному читателю.
