lexical_decisions:
- source_word: ἀπῆραν
  choice: выступили
  rationale: В данном повествовательном и военном контексте глагол обозначает отправление в путь; «выступили» естественно передаёт начало движения войска, не утверждая прямо, что оно снялось с лагеря.
- source_word: ἐπορεύθησαν
  choice: пошли
  rationale: Обычный глагол движения; «пошли» сохраняет простоту оригинала и не добавляет прямо не выраженного значения «двинулись походным строем».
- source_word: εἰς Βερέαν
  choice: к Верее
  rationale: εἰς выражает направление к месту. «К Верее» сохраняет направительное значение, не утверждая однозначно, что войско вошло в город.
- source_word: ἐν εἴκοσι χιλιάσιν ἀνδρῶν
  choice: с двадцатью тысячами воинов
  rationale: В этой конструкции ἐν указывает на численность сопровождающей военной силы. «Воинов» яснее контекстуального «мужей» и естественно для современного русского языка.
- source_word: δισχιλίοις ἵπποις
  choice: двумя тысячами всадников
  rationale: Буквально сказано «двумя тысячами коней», однако в военном контексте «кони» метонимически обозначают конное войско. Основной текст передаёт предполагаемый смысл, а буквальная форма отмечена в сноске.
