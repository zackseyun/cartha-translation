base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/068.yaml
  text: And they fought against Bacchides[a], and he was crushed by them, and they pressed him hard, because his plan and his attack were in vain.
translation:
  language: ru
  text: И они сражались с Вакхидом, сокрушили его и сильно теснили, потому что его замысел и наступление оказались тщетными.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. κενή буквально значит «пустая»; в данном контексте: «безрезультатная», «напрасная». ἔφοδος также может означать «нападение» или «натиск».'
    reason: Уточняет буквальное лексическое значение κενή без неверного указания на множественное число и отмечает допустимый диапазон значения ἔφοδος.
lexical_decisions:
- source_word: ἐπολέμησαν πρὸς
  choice: вступили в бой с
  rationale: Передаёт направленное противостояние в военном контексте и звучит естественно по-русски.
- source_word: συνετρίβη ὑπʼ αὐτῶν
  choice: сокрушили его
  rationale: Активная русская конструкция естественно передаёт греческий пассив и сохраняет яркий образ сокрушения, не сводя его к нейтральному «победили».
- source_word: ἔθλιβον αὐτὸν σφόδρα
  choice: они сильно теснили его
  rationale: «Теснили» соответствует военному контексту θλίβω, а «сильно» передаёт усилительное σφόδρα.
- source_word: βουλή
  choice: замысел
  rationale: В данном контексте обозначает задуманный Вакхидом план действий; «замысел» сохраняет смысловую широту слова.
- source_word: ἔφοδος
  choice: наступление
  rationale: Слово может означать нападение, натиск или наступление; здесь «наступление» естественно обозначает военную операцию, не уточняя её характер сверх греческого текста.
- source_word: κενή
  choice: оказались тщетными
  rationale: Буквально прилагательное означает «пустая», а в переносном употреблении — безрезультатная, напрасная; множественное число требуется русским составным подлежащим.
- source_word: Βακχίδην
  choice: Вакхидом
  rationale: Традиционная русская форма имени Βακχίδης; творительный падеж обусловлен конструкцией «вступили в бой с».
