  text: And Bacchides learned of it on the Sabbath day[b][a], and he himself and all his army came to the other side of the Jordan.
translation:
  language: ru
  text: И Вакхид узнал об этом в субботу, и сам он со всем своим войском пришёл на другой берег Иордана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за Иордан». Греческое выражение может обозначать как область по ту сторону реки, так и движение на другой берег.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: узнал об этом
  rationale: Аорист γινώσκω здесь обозначает получение сведений; дополнение «об этом» естественно восполняет подразумеваемый из контекста объект.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: в субботу
  rationale: Буквально «в день суббот»; это обычное греческое обозначение субботнего дня. Краткое «в субботу» естественно для современного русского языка.
- source_word: αὐτὸς
  choice: сам он
  rationale: 'Сохраняет эмфатический характер местоимения: Вакхид лично выступил вместе со своим войском.'
- source_word: πᾶν τὸ στράτευμα αὐτοῦ
  choice: со всем своим войском
  rationale: Передаёт всю военную силу под его командованием; творительная конструкция естественно выражает совместное движение.
- source_word: πέραν τοῦ Ἰορδάνη
  choice: на другой берег Иордана
  rationale: В сочетании с глаголом движения передаёт прибытие на противоположную сторону реки, не уточняя направление переправы.
