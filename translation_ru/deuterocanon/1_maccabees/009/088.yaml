lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: И когда
  rationale: Греческая повествовательная формула обозначает переход к следующему событию; краткое «И когда» естественно передаёт её функцию в современном русском, не утяжеляя фразу буквальным «И случилось, что, когда».
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямое значение глагола уместно в контексте получения известия или сообщения.
- source_word: τοὺς λόγους τούτους
  choice: эти слова
  rationale: Передаёт λόγοι близко к форме оригинала и сохраняет возможный оттенок как произнесённых слов, так и сообщения.
- source_word: προσέθετο δοξάσαι
  choice: продолжил оказывать почести
  rationale: Конструкция προστίθημι с инфинитивом выражает продолжение или последующее действие; «оказывать почести» естественно передаёт δοξάζω в царско-политическом контексте без богословски окрашенного «прославлять».
- source_word: πόρπην
  choice: застёжку
  rationale: πόρπη обозначает декоративное приспособление для скрепления одежды. «Застёжка» сохраняет общий смысл, не уточняя без достаточных оснований форму предмета.
