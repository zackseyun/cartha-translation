lexical_decisions:
- source_word: παρεμβολὴ
  choice: войско
  rationale: В военном контексте слово может обозначать как лагерь, так и расположившееся в нём войско. Здесь речь идёт о людях Иуды, которые не выдерживали натиска, поэтому «войско» естественнее буквального «лагерь».
- source_word: ὅτι ἡ παρεμβολὴ αὐτοῦ
  choice: что его войско дрогнуло
  rationale: 'Греческая фраза в дошедшем тексте кратка и синтаксически неполна: после слов о войске отсутствует явное сказуемое. «Дрогнуло» передаёт подразумеваемое ослабление или отступление войска под натиском, не представляя дополнение как бесспорное чтение.'
- source_word: ὁ πόλεμος ἔθλιβεν αὐτόν
  choice: битва теснила его
  rationale: В данном эпизоде πόλεμος обозначает непосредственное сражение, а ἔθλιβεν — продолжающийся сильный нажим. «Теснила» сохраняет образ давления и подходит к военной обстановке.
- source_word: συνετρίβη τῇ καρδίᾳ
  choice: сердце его было сокрушено
  rationale: Формулировка сохраняет сильную метафору сокрушения сердца и пассивную конструкцию оригинала, не сводя её лишь к печали или унынию.
- source_word: καιρὸν
  choice: времени
  rationale: В контексте срочного боя имеется в виду доступное время, а вместе с ним и возможность действовать; русское «времени» передаёт это естественно.
- source_word: συναγαγεῖν αὐτούς
  choice: собрать их
  rationale: Глагол означает собрать или созвать вместе. «Собрать их» близко к греческому и не добавляет более узкого смысла «вновь сплотить».
