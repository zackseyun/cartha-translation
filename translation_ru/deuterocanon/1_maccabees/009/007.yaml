  text: And Judas saw that his camp was failing, because the battle was pressing hard on him; and he was crushed in heart, because he had no time to gather them together.
translation:
  language: ru
  text: И увидел Иуда, что его войско дрогнуло[a], потому что битва теснила его. Сердце его было сокрушено, потому что у него не было времени собрать их.
