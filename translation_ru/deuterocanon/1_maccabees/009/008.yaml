    text: 'Или: «ослабел», «лишился мужества»; греческий глагол может обозначать физический или душевный упадок сил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελύθη
  choice: пал духом
  rationale: Пассивная форма ἐκλύω может обозначать физическое ослабление или внутреннюю утрату мужества. В военном контексте выражение «пал духом» естественно передаёт надлом решимости, не исключая более общего смысла ослабления, отмеченного в сноске.
- source_word: τοῖς καταλειφθεῖσιν
  choice: тем, кто остался
  rationale: Причастие от καταλείπω обозначает оставшихся; формулировка близка к греческому тексту и не уточняет без достаточного основания, были ли это именно уцелевшие или оставленные позади.
- source_word: Ἀναστῶμεν
  choice: Встанем
  rationale: Увещательное сослагательное наклонение передано формой совместного побуждения. «Встанем» сохраняет образ подъёма и уместно звучит в военном призыве.
- source_word: ἀναβῶμεν
  choice: пойдём
  rationale: Глагол буквально означает «поднимемся, пойдём вверх», однако в данном сочетании может описывать выступление против врага. «Пойдём» естественно по-русски и не навязывает не удостоверенную контекстом топографию.
- source_word: τοὺς ὑπεναντίους ἡμῶν
  choice: наших противников
  rationale: ὑπεναντίος обозначает стоящих напротив, противоборствующую сторону. «Противники» точно передаёт значение, не усиливая его до более общего «враги».
- source_word: ἐὰν ἄρα
  choice: быть может
  rationale: Сочетание выражает неуверенность или осторожную надежду. «Быть может» сохраняет колеблющийся тон речи.
- source_word: δυνώμεθα
  choice: нам удастся
  rationale: В условной конструкции речь идёт о возможности или способности вступить в бой. Русское «нам удастся» идиоматично выражает эту неуверенную возможность, хотя буквальнее было бы «мы сможем».
- source_word: πολεμῆσαι αὐτούς
  choice: сразиться с ними
  rationale: Инфинитив πολεμῆσαι означает воевать или вступить в бой. «Сразиться с ними» ясно передаёт непосредственный военный контекст и управление, естественное для русского языка.
