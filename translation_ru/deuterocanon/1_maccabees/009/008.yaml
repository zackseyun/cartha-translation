  text: And he was dismayed[a], and said to those who were left, “Let us rise and go up against our adversaries, if perhaps we are able to fight them.”
translation:
  language: ru
  text: 'И он пал духом[a] и сказал тем, кто остался: «Встанем и пойдём на наших противников — быть может, мы сможем сразиться с ними».'
  philosophy: optimal-equivalence
