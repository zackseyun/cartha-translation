lexical_decisions:
- source_word: παρεβεβληκὼς
  choice: стоял лагерем
  rationale: Перфектное причастие от παρεμβάλλω в военном контексте выражает состояние расположения лагерем; «стоял лагерем» естественно передаёт этот смысл по-русски.
- source_word: ἐν Ἀλασά
  choice: в Аласе
  rationale: Предлог ἐν обозначает местонахождение; несклоняемая передача топонима «Аласа» сохраняет форму имени и даёт естественное русское сочетание «в Аласе».
- source_word: τρισχίλιοι
  choice: три тысячи
  rationale: Прямая передача количественного числительного.
- source_word: ἄνδρες
  choice: воины
  rationale: Хотя буквально ἄνδρες означает «мужчины», военный контекст ясно указывает на участников войска; «воины» естественно и без лишней конкретизации передаёт контекстуальное значение.
- source_word: ἐκλεκτοὶ
  choice: отборных
  rationale: ἐκλεκτοί здесь обозначает специально выбранных, лучших воинов; «отборных» — современная и точная военная формулировка.
- source_word: μετʼ αὐτοῦ
  choice: с ним было
  rationale: Оборот прямо обозначает присутствие людей вместе с Иудой; русская конструкция сохраняет это значение без добавления идеи движения или сопровождения.
