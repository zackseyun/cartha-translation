base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/029.yaml
  text: Since your brother Judas has died[a], and there is no man like him to go out against the enemies and Bacchides, and those who hate our nation,
translation:
  language: ru
  text: С тех пор как умер твой брат Иуда, нет человека, подобного ему, который выступил бы против врагов, Вакхида и тех, кто ненавидит наш народ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте конец фразы синтаксически неровен: буквально — «и среди тех, кто ненавидит наш народ». Здесь он понят как указание ещё на одну группу противников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀφʼ οὗ
  choice: С тех пор как
  rationale: Передаёт временное значение оборота и сохраняет связь нынешнего положения со смертью Иуды.
- source_word: ὁ ἀδελφός σου Ἰούδας
  choice: твой брат Иуда
  rationale: Прямой и естественный перевод притяжательного словосочетания и принятой русской формы имени.
- source_word: τετελεύτηκεν
  choice: умер
  rationale: Прямо передаёт совершившуюся смерть; результативность греческого перфекта раскрывается всем оборотом «с тех пор как» и последующим описанием нынешнего положения.
- source_word: ἀνὴρ ὅμοιος αὐτῷ
  choice: человека, подобного ему
  rationale: «Человек» в данном отрицательном обороте естественнее современного русского «муж» и сохраняет личностно-мужской референт в контексте военного предводительства.
- source_word: οὐκ ἔστιν
  choice: нет
  rationale: Естественная русская форма экзистенциального отрицания.
- source_word: ἐξελθεῖν
  choice: который выступил бы
  rationale: В военном контексте глагол означает выход для противостояния; сослагательная конструкция естественно связывается с отсутствием подходящего предводителя.
- source_word: πρὸς τοὺς ἐχθρούς
  choice: против врагов
  rationale: πρός при обозначении враждебного противостояния естественно передаётся предлогом «против».
- source_word: καὶ Βακχίδην
  choice: Вакхида
  rationale: Имя включено в ряд объектов противостояния; русский падеж явно показывает синтаксическую связь без повторения предлога.
- source_word: καὶ ἐν τοῖς ἐχθαίνουσιν τοῦ ἔθνους ἡμῶν
  choice: и тех, кто ненавидит наш народ
  rationale: Передаёт вероятный контекстуальный смысл как ещё одной враждебной группы, но текстовая неловкость ἐν отмечена в сноске.
- source_word: τοῦ ἔθνους ἡμῶν
  choice: наш народ
  rationale: Здесь ἔθνος обозначает иудейский народ как общность. В современном русском «наш народ» звучит естественнее и менее анахронично, чем «наша нация».
theological_decisions:
- issue: Передача ἀνήρ в контексте военного предводительства
  choice: человека
  alternative: мужчины / мужа
  rationale: Русское «человек» в конструкции «нет человека, подобного ему» идиоматично и не устраняет конкретного мужского референта — Иуду; «муж» здесь архаично, а «мужчина» стилистически снижено.
- issue: Передача ἔθνος ἡμῶν
  choice: наш народ
  alternative: нашу нацию
  rationale: «Народ» сохраняет значение единой этнорелигиозной и политической общности, не привнося современного оттенка национального государства.
- issue: Синтаксическая неровность ἐν τοῖς ἐχθαίνουσιν
  choice: 'как объект противостояния: «тех, кто ненавидит наш народ»'
  alternative: 'буквально: «среди ненавидящих наш народ»'
  rationale: Контекст и перечисление после «выступил бы против» поддерживают значение дополнительной враждебной группы, однако подлинная неоднозначность не скрыта и вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Военный смысл ἐξελθεῖν передан глаголом «выступить», а трудность греческой конструкции сохранена в примечании, не перегружая основной текст.
