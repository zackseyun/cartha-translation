  text: And the battle grew intense[a], and Jonathan stretched out his hand to strike Bacchides[b], but he turned away from him to the rear.
translation:
  language: ru
  text: И бой становился всё ожесточённее[a]. Ионафан протянул руку, чтобы поразить Вакхида, но тот уклонился от него, подавшись назад[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «И бой сомкнулся» или «И схватка стала теснее». Греческий глагол может изображать сближение сражающихся или усиление боя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но он уклонился от него, подавшись назад». В греческом подлежащее не названо прямо; по смыслу, вероятнее всего, имеется в виду Вакхид, уклонившийся от удара Ионафана.'
    reason: ambiguity
lexical_decisions:
- source_word: συνῆγεν ὁ πόλεμος
  choice: бой становился всё ожесточённее
  rationale: В данном боевом контексте непереходное употребление συνάγω передаёт сближение, стягивание или усиление схватки. Эта формулировка естественна по-русски и выражает нарастание напряжённости, не сводя выражение к буквальному «собирался».
- source_word: ἐξέτεινεν ... τὴν χεῖρα αὐτοῦ
  choice: протянул руку
  rationale: Сохраняет образ исходного греческого выражения и звучит естественно в современном русском языке.
- source_word: πατάξαι
  choice: поразить
  rationale: Передаёт сильный, направленный удар, вероятно оружием, не добавляя прямо не выраженного в греческом указания на убийство.
- source_word: Βακχίδην
  choice: Вакхида
  rationale: Традиционная русская передача имени Βακχίδης; здесь употреблена форма винительного падежа.
- source_word: ἐξέκλινεν ἀπ᾿ αὐτοῦ
  choice: уклонился от него
  rationale: Передаёт движение в сторону от удара без чрезмерно конкретного толкования способа уклонения.
- source_word: εἰς τὰ ὀπίσω
  choice: отступив назад
  rationale: Естественно выражает направленное назад движение в военной сцене; деепричастная конструкция связывает его с уклонением.
