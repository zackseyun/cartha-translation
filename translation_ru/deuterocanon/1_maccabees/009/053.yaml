lexical_decisions:
- source_word: ἔλαβον
  choice: взяли
  rationale: Прямое повествовательное соответствие; в сочетании «взяли… в заложники» естественно передаёт взятие людей под контроль без усиления до «схватили».
- source_word: τοὺς υἱοὺς
  choice: сыновей
  rationale: Греческий текст прямо говорит о сыновьях, поэтому мужское родственное обозначение сохранено.
- source_word: τῶν ἡγουμένων
  choice: правителей
  rationale: Субстантивированное причастие обозначает людей, стоящих во главе; «правители» ясно и уместно в историческом повествовании.
- source_word: τῆς χώρας
  choice: страны
  rationale: χώρα может означать страну, землю или область; «страны» сохраняет широкий территориальный смысл и естественно сочетается со словом «правители».
- source_word: ὁμήρα
  choice: в заложники
  rationale: ὅμηρα обозначает заложников; русская конструкция «взяли… в заложники» точно и идиоматично выражает их статус.
- source_word: ἔθεντο
  choice: поместили
  rationale: Передаёт действие размещения в определённом месте и выдерживает умеренно официальный повествовательный регистр.
- source_word: ἐν τῇ ἄκρᾳ
  choice: в крепости
  rationale: ἄκρα означает укреплённую цитадель и здесь может относиться к иерусалимской Акре; понятное родовое обозначение дано в тексте, а собственное название — в сноске.
- source_word: ἐν φυλακῇ
  choice: под стражу
  rationale: Фраза указывает на охраняемое содержание; «под стражу» не уточняет сверх текста, находились ли заложники именно в тюремном помещении.
