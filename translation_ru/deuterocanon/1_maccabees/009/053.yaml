  text: And they took the sons of the leaders of the land as hostages[a], and placed them under guard in the citadel in Jerusalem.
translation:
  language: ru
  text: И они взяли сыновей правителей страны в заложники и поместили их под стражу в крепости[a] в Иерусалиме.
  philosophy: optimal-equivalence
