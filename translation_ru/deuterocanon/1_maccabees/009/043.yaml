  source_fidelity: '«К берегам Иордана» выражает лишь направление движения, тогда как ἕως требует указания достигнутого предела: «до берегов Иордана». Остальные смысловые соответствия верны: «услышал» сохраняет невыраженный объект, суббота передана как единственное число по смыслу греческого иудейского идиоматизма, а «с большим войском» адекватно передаёт военную силу.'
