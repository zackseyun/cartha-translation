  text: And Bacchides heard[a], and on the day of the Sabbaths he came as far as the banks of the Jordan with a great force.
translation:
  language: ru
  text: И услышал Вакхид и в субботний день пришёл до берегов Иордана с большим войском.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямо передаёт аорист ἀκούω и, как в греческом тексте, оставляет подразумеваемым, что именно Вакхид услышал из предшествующего контекста.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: в день субботний
  rationale: Естественно передаёт устойчивое иудейско-греческое обозначение субботнего дня; грамматическое множественное число σαββάτων здесь не требует буквального множественного числа по-русски.
- source_word: ἕως τῶν κρηπῖδων τοῦ Ἰορδάνου
  choice: к берегам Иордана
  rationale: В географическом контексте κρηπίδες означает края или берега реки. Русское направление «к берегам» естественно выражает достижение указанного предела после глагола движения.
- source_word: ἐν δυνάμει πολλῇ
  choice: с большим войском
  rationale: В военном повествовании δύναμις обозначает вооружённые силы. «Большое войско» ясно и естественно передаёт смысл, хотя формально возможны «с большими силами» или «с большой силой».
- source_word: Βακχίδης
  choice: Вакхид
  rationale: Традиционная русская форма греческого личного имени, соответствующая норме русской библейской ономастики.
