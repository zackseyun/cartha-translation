  text: He pursued after him as far as Azotus[a], and the camps joined battle behind him[b]. And Apollonius left behind a thousand horsemen
translation:
  language: ru
  text: Он преследовал его до Азота, и войска вступили в бой у него в тылу[a]. А Аполлоний оставил позади тысячу всадников[b]
  philosophy: optimal-equivalence
  footnotes:
