    text: 'Буквально: «лагеря сошлись позади него для битвы». Вероятно, речь идёт о военных силах, вступивших в бой в его тылу.'
    reason: lexical_alternative
  - marker: b
    text: Приведённый греческий текст заканчивается словами «А Аполлоний оставил позади тысячу всадников»; предложение выглядит незавершённым и, вероятно, продолжается в следующем стихе.
    reason: textual_variant
lexical_decisions:
- source_word: δίωξεν ὀπίσω αὐτοῦ
  choice: преследовал его
  rationale: В военном повествовании διώκω означает погоню или преследование; русское «преследовал его» естественно передаёт сочетание с ὀπίσω αὐτοῦ.
- source_word: εἰς Ἄζωτον
  choice: до Азота
  rationale: После глагола преследования εἰς обозначает предел движения; «до Азота» передаёт продолжительность погони до указанного места.
- source_word: συνῆψαν … εἰς πόλεμον
  choice: вступили в бой
  rationale: В военном контексте συνάπτω с εἰς πόλεμον обозначает завязывание сражения. Этот перевод ясен по-русски и не расширяет «бой» до более общего понятия войны.
- source_word: αἱ παρεμβολαί
  choice: войска
  rationale: Буквально слово может означать «лагеря» или «станы», но здесь действующим субъектом сражения являются размещённые в них военные силы; «войска» естественно передаёт контекстуальную метонимию.
- source_word: ὀπίσω αὐτοῦ
  choice: у него в тылу
  rationale: Во втором употреблении выражение имеет пространственный смысл. «У него в тылу» передаёт положение боя позади названного мужчины, не уточняя неоднозначного референта местоимения.
- source_word: ἀπέλειπεν
  choice: оставил позади
  rationale: Перевод сохраняет отделительное значение приставки ἀπο- и не добавляет отсутствующего в греческом уточнения о цели оставленного отряда.
- source_word: χιλίαν ἵππον
  choice: тысячу всадников
  rationale: В военном счёте ἵππος, буквально «конь», метонимически обозначает конницу или всадников; русское «тысячу всадников» ясно и естественно.
