    reason: cross_reference
lexical_decisions:
- source_word: ὠχύρωσαν
  choice: укрепили
  rationale: Глагол означает усиление обороны или возведение укреплений; «укрепили» естественно сочетается со всеми перечисленными объектами.
- source_word: τὴν πόλιν
  choice: город
  rationale: Буквальное значение πόλις; определённость передана контекстуально, поскольку русский язык не имеет артикля.
- source_word: Βεθοσούραν
  choice: Бет-Цур
  rationale: Устоявшаяся русская передача семитского географического названия, соответствующего греческой форме Βεθοσούρα.
- source_word: Γάζαρα
  choice: Газары
  rationale: Передаёт греческую форму названия; окончание согласовано с синтаксисом русского перечисления. Более известная форма «Гезер» отмечена в сноске.
- source_word: τὴν ἄκραν
  choice: крепость
  rationale: ἄκρα обозначает укреплённую высоту или цитадель; в данном контексте это иерусалимская крепость. Нарицательное значение сохранено без превращения слова в непояснённое имя собственное.
- source_word: ἔθεντο ἐν αὐταῖς δυνάμεις
  choice: разместив в них войска
  rationale: ἔθεντο буквально означает «поместили», а в военном контексте естественно передаётся как «разместили»; δυνάμεις здесь — военные силы, то есть войска.
- source_word: παραθέσεις βρωμάτων
  choice: запасы продовольствия
  rationale: Сочетание обозначает отложенные или складированные припасы; «запасы продовольствия» точно и естественно передаёт смысл.
