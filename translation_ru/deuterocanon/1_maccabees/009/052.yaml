  text: And they fortified the city[a], and Beth-zur, and Gazara, and the citadel[b], and they stationed forces in them and supplies of food.
translation:
  language: ru
  text: Они укрепили город, Бет-Цур, Газара[b] и крепость[a] и разместили в них войска и запасы продовольствия.
  philosophy: optimal-equivalence
  footnotes:
