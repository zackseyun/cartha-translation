lexical_decisions:
- source_word: παρενέβαλεν
  choice: расположил лагерем
  rationale: Глагол обозначает размещение войск лагерем; переходная форма с винительным падежом здесь передаёт действие военачальника по размещению сил.
- source_word: τρισχιλίαν ἵππον
  choice: три тысячи всадников
  rationale: ἵππος употреблено собирательно в значении конного войска; «всадников» естественно сочетается с точным числительным.
- source_word: δύναμιν πολλήν
  choice: многочисленное войско
  rationale: В военном повествовании δύναμις означает не отвлечённую силу, а войско; перевод сохраняет широкий смысл выражения.
- source_word: ἐπορεύθη εἰς Ἄζωτον
  choice: двинулся к Азоту
  rationale: Передаёт целенаправленное передвижение войска, не добавляя более узкого значения похода или нападения.
- source_word: ὡς διοδεύων
  choice: словно лишь проходя мимо
  rationale: ὡς представляет действие как видимость или предлог; «лишь» естественно выражает возможный притворный характер манёвра, отмеченный также в сноске.
- source_word: ἅμα προσῆγεν εἰς τὸ πεδίον
  choice: в то же время он выводил войско на равнину
  rationale: προσάγω имеет значение «подводить, выводить вперёд»; подразумеваемый объект раскрыт как войско для ясного русского синтаксиса.
- source_word: διὰ τὸ ἔχειν αὐτὸν πλῆθος ἵππου
  choice: потому что у него была многочисленная конница
  rationale: Причинная конструкция передана прямо, а собирательное πλῆθος ἵππου — естественным русским военным выражением.
- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: он полагался на неё
  rationale: Форма выражает устойчивую уверенность; местоимение сохраняет неоднозначность греческого антецедента, разъяснённую в сноске.
