translation:
  language: ru
  text: В тот день на стороне Вакхида пало около тысячи человек.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при Вакхиде». Греческий оборот с παρά может обозначать связь с Вакхидом или нахождение рядом с ним; он не утверждает прямо, что Вакхид лично был причиной их гибели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέπεσαν
  choice: пало
  rationale: В военном контексте глагол означает гибель в бою; «пало» сохраняет греческий образ и естественно звучит по-русски.
- source_word: παρὰ Βακχίδα
  choice: при Вакхиде
  rationale: Оборот с παρά и винительным падежом указывает на связь с Вакхидом, но не выражает прямо, что эти люди были убиты им. «При Вакхиде» сохраняет эту неопределённость лучше, чем причинное «от рук Вакхида».
- source_word: τῇ ἡμέρᾳ ἐκείνῃ
  choice: в тот день
  rationale: Естественная русская передача обычного временного дательного оборота.
- source_word: εἰς χιλίους ἄνδρας
  choice: около тысячи человек
  rationale: εἰς с числительным обозначает приблизительное количество или итоговую численность; русское «около тысячи» передаёт этот смысл без буквализма.
