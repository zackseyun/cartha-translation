  to: Всё стояло, как повелел Ионафан, и их кони устали. Тогда Симон развернул своё войско и вступил в сражение с[a]
  rationale: Исправлено лишь необоснованное уточнение подлежащего в начале стиха; «Всё стояло» сохраняет отсутствие названного личного субъекта, насколько это возможно в естественном русском. Также слегка улучшена современная естественность формулировки о конях и редакторский стиль сноски. Незавершённая конструкция после «с» и её якорь сохранены, поскольку греческий текст заканчивается на τὴν.
