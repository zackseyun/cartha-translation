  source_fidelity: 'Начальное «Он» неоправданно снимает неоднозначность греческого ὑστήκει: в данном фрагменте подлежащее не названо, а форма сама по себе не требует мужского личного субъекта. Остальная передача верна: ἐκοπίασαν передано без усиления, ἐξέλυσεν τὴν δύναμιν — уместным военным оборотом, а обрыв после πρός τὴν сохранён.'
  naturalness: «Кони их» и «утомились» понятны, но «их кони устали» естественнее для современного литературного русского. Эллиптическое «Всё стояло» позволяет не вводить мужской субъект и остаётся связным в русском повествовании. Оборот «вступил в сражение с» намеренно оставлен незавершённым.
  terminology: Имена Ионафан и Симон переданы последовательно. «Войско» уместно для δύναμις в данном военном контексте. Богословски нагруженной терминологии в отрывке нет.
