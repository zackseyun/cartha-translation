lexical_decisions:
- source_word: ὑστήκει
  choice: Он оставался на месте
  rationale: Форма передаёт продолжающееся пребывание в занятой позиции. Подлежащее в данном фрагменте прямо не названо; мужской род выбран по ближайшему повествовательному контексту, однако сама греческая форма рода не выражает.
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: как повелел Ионафан
  rationale: καθώς обозначает соответствие, а ἐπιτάσσω — властное распоряжение; «повелел» сохраняет военный и повествовательный регистр.
- source_word: ἐκοπίασαν οἱ ἵπποι αὐτῶν
  choice: кони их утомились
  rationale: κοπιάω означает устать от усилий; «утомились» не усиливает смысл до полного изнеможения.
- source_word: ἐξέλυσεν Σίμων τὴν δύναμιν αὐτοῦ
  choice: Симон развернул своё войско
  rationale: В военном контексте ἐκλύω здесь передаёт выдвижение или развёртывание сил, а δύναμις — военную силу, естественно выраженную словом «войско».
- source_word: συνῆψεν πρὸς
  choice: вступил в сражение с
  rationale: Сочетание συνάπτω с πρός в военном повествовании обозначает схождение с противником и начало боя.
- source_word: τὴν
  choice: —
  rationale: Предоставленный греческий текст обрывается на артикле женского рода винительного падежа. В русском переводе незавершённость передана обрывом после предлога «с», без домысливания отсутствующего существительного.
