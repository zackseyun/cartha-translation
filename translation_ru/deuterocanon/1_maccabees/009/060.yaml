base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/060.yaml
  text: And he refrained from coming with a large force[a], and secretly sent letters to all his allies in Judea, so that they might seize Jonathan and those with him; but they were not able[b], because their plan became known to them.
translation:
  language: ru
  text: И он отказался прийти с большими силами и тайно разослал письма всем своим союзникам в Иудее, чтобы они схватили Ионафана и тех, кто был с ним. Но он не смог этого сделать[a], потому что Ионафану и его людям стал известен их замысел[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «но им не удалось этого сделать»; хотя греческий глагол стоит в единственном числе, он может обозначать действие заговорщиков как целого.'
    reason: grammatical_ambiguity
  - marker: b
    text: То есть замысел заговорщиков стал известен тем, кого они намеревались схватить, — Ионафану и его людям.
    reason: referential_clarification
lexical_decisions:
- source_word: ἀπῆρεν τοῦ ἐλθεῖν
  choice: отказался прийти
  rationale: Оборот обозначает прекращение или оставление намерения совершить действие. «Отказался прийти» естественно передаёт это значение, не уточняя причину решения.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: с большими силами
  rationale: В данном военном контексте δύναμις означает войско или военную силу. Выражение «с большими силами» сохраняет некоторую широту греческого слова и звучит естественно по-русски.
- source_word: ἀπέστειλεν ἐπιστολὰς λάθρᾳ
  choice: тайно разослал письма
  rationale: λάθρᾳ указывает на скрытый характер отправки; «разослал» уместно при множестве адресатов.
- source_word: πᾶσι τοῖς συμμάχοις αὐτοῦ τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: всем своим союзникам в Иудее
  rationale: σύμμαχοι — политические или военные союзники; определительная группа τοῖς ἐν τῇ Ἰουδαίᾳ обозначает их местонахождение.
- source_word: ὅπως συλλάβωσι
  choice: чтобы они схватили
  rationale: συλλαμβάνω здесь означает захватить или схватить; «схватили» не привносит более узкого юридического смысла ареста.
- source_word: τοὺς σὺν αὐτῷ
  choice: тех, кто был с ним
  rationale: Перевод сохраняет обобщённость греческого выражения и не добавляет отсутствующего в нём уточнения о статусе этих людей.
- source_word: οὐκ ἠδύνατο
  choice: он не смог этого сделать
  rationale: Глагол стоит в единственном числе и грамматически естественно относится к главному заговорщику. Добавленное «этого сделать» ясно связывает невозможность с попыткой захватить Ионафана, не меняя смысла.
- source_word: ἔγνωσθη αὐτοῖς ἡ βουλὴ αὐτῶν
  choice: Ионафану и его людям стал известен их замысел
  rationale: βουλή в контексте означает замысел или план. Явное называние подразумеваемых участников устраняет неестественную для русского языка цепочку одинаковых местоимений; принадлежность замысла противникам сохраняется.
