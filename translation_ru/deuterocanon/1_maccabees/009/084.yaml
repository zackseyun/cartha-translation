lexical_decisions:
- source_word: αὐτῆς
  choice: её
  rationale: Сохранено женское местоимение греческого текста; из-за утраты начала отрывка его антецедент здесь не назван.
- source_word: ἔλαβεν τὰ σκῦλα αὐτῶν
  choice: он взял их добычу
  rationale: σκῦλα обозначает военную добычу; «взял их добычу» естественно передаёт повествовательный аорист и притяжательное местоимение.
- source_word: τὸ ἱερὸν Δαγὼν
  choice: храм Дагона
  rationale: В контексте языческого культа ἱερόν естественно передаётся словом «храм»; форма Δαγών понята как имя божества в родительном отношении.
- source_word: τὸ ἱερὸν αὐτῆς
  choice: её храм
  rationale: Перевод сохраняет женский род αὐτῆς и не заменяет его более определённым антецедентом, отсутствующим в данном отрывке.
- source_word: ἐνεπύρισεν ἐν πυρί
  choice: сжёг огнём
  rationale: Намеренная греческая эмфаза глагола и оборота ἐν πυρί сохранена посредством слегка торжественного, но понятного русского сочетания.
- source_word: οἱ πεπτωκότες μαχαίρᾳ
  choice: павшие от меча
  rationale: Субстантивированное перфектное причастие передано кратко, с сохранением результирующего значения; оборот обрывается вместе с источником.
