  text: And he accepted[a], and did according to his words, and swore to him not to seek harm against him all the days of his life.
translation:
  language: ru
  text: Он согласился и поступил по его словам; и поклялся ему, что не будет замышлять против него зла[a] во все дни своей жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «не искать ему зла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεδέξατο
  choice: согласился
  rationale: Средняя форма в данном контексте обозначает принятие ранее предложенных условий; «согласился» естественно передаёт смысл, не создавая впечатления физического получения чего-либо.
- source_word: ἐποίησεν κατὰ τοὺς λόγους αὐτοῦ
  choice: поступил по его словам
  rationale: Оборот означает действие в соответствии со сказанным; выбранная формулировка сохраняет образ греческого текста и остаётся понятной по-русски.
- source_word: ὤμοσεν
  choice: поклялся
  rationale: Глагол прямо обозначает принесение клятвы; русский глагол передаёт и действие, и его торжественный характер.
- source_word: μὴ ἐκζητῆσαι αὐτῷ κακὸν
  choice: не будет замышлять против него зла
  rationale: В сочетании с κακόν глагол выражает намеренное стремление причинить зло или вред. «Замышлять против него зло» естественно передаёт враждебный умысел, тогда как буквальное «искать ему зла» в современном русском звучит менее обычно.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτοῦ
  choice: во все дни своей жизни
  rationale: Формулировка близко сохраняет греческий образ продолжительности на протяжении всей жизни и поддерживает библейский ритм.
