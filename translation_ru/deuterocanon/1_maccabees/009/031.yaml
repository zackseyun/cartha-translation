lexical_decisions:
- source_word: ἐπεδέξατο
  choice: принял на себя
  rationale: Средняя форма глагола ἐπιδέχομαι здесь обозначает принятие на себя роли или должности; выражение естественно передаёт добровольное вступление в руководство.
- source_word: ἡγεσίαν
  choice: руководство
  rationale: ἡγεσία означает руководство или командование; «руководство» сохраняет широту значения и не приписывает Ионафану царской власти.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: в то время
  rationale: Прямой и естественный для современного русского языка эквивалент греческого обстоятельства времени.
- source_word: ἀνέστη
  choice: встал
  rationale: ἀνέστη буквально означает «встал» или «поднялся»; в данном контексте слово образно указывает на выступление Ионафана в качестве преемника.
- source_word: ἀντί
  choice: на место
  rationale: Предлог ἀντί выражает замещение или преемство; «на место» ясно передаёт эту связь без оттенка противостояния.
- source_word: Ἰούδου
  choice: Иуды
  rationale: Передача греческого имени Ἰούδας как «Иуда» соответствует устойчивому русскому библейскому употреблению в повествовании о Маккавеях.
