base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/009.yaml
  text: But they turned away from him[a], saying, “We certainly cannot do it. Instead, let us save our own lives for now. Let us return with our brothers and fight against them[b], but we are few.”
translation:
  language: ru
  text: 'Но они отвернулись от него[a] и сказали: «Нет, мы не сможем. Лучше пока спасём свои жизни[b]. Вернёмся вместе с нашими братьями и сразимся с ними, а нас мало».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отвергли его»; греческое выражение может означать не только движение прочь, но и отказ последовать его совету.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «спасём свои души»; здесь греческое слово означает жизнь человека, находящегося в смертельной опасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν αὐτόν
  choice: они отвернулись от него
  rationale: Передаёт как образ поворота прочь, так и возможный контекстуальный смысл отказа последовать совету Иуды, не сводя выражение только к формальному отвержению.
- source_word: Οὐ μὴ δυνώμεθα
  choice: Нет, мы не сможем
  rationale: Сочетание οὐ μή выражает усиленное отрицание; начальное «Нет» естественно передаёт решительный отказ по-русски.
- source_word: σώσωμεν τὰς ἑαυτῶν ψυχὰς
  choice: спасём свои жизни
  rationale: В военном контексте ψυχαί означает жизни людей, а не души как богословское понятие.
- source_word: τὸ νῦν
  choice: пока
  rationale: Кратко и естественно обозначает временную меру в нынешней опасности.
- source_word: ἐπιστρέψωμεν μετὰ τῶν ἀδελφῶν ἡμῶν
  choice: вернёмся вместе с нашими братьями
  rationale: Сохраняет обычное значение μετά с родительным — «вместе с» — и прямо передаёт ἀδελφῶν как «братьями».
- source_word: πολεμήσωμεν πρὸς αὐτούς
  choice: сразимся с ними
  rationale: Естественно передаёт вооружённое противостояние, обозначенное πολεμέω πρὸς.
- source_word: ἡμεῖς δὲ ὀλίγοι
  choice: но сейчас нас мало
  rationale: Сохраняет противительный оттенок δέ и лаконичность фразы; «сейчас» проясняет, что речь идёт о нынешней малочисленности данной группы.
theological_decisions:
- issue: Значение ψυχὰς в боевом контексте
  choice: жизни
  alternative: души
  rationale: Речь идёт о физическом спасении от смертельной опасности; вариант «души» мог бы внести не требуемый контекстом богословский смысл.
- issue: Передача ἀδελφῶν
  choice: братьями
  alternative: соратниками
  rationale: Буквальный мужской термин сохранён; контекст допускает значение соплеменников или боевых товарищей, но не требует заменять исходный образ.
- issue: Связь заключительного δέ
  choice: но
  alternative: ведь / потому что
  rationale: Сохранён выраженный в греческом противительный союз, хотя по смыслу заключительная фраза также объясняет предложение отступить.
translation_notes:
  register: Современный литературный русский язык, прямой и достойный повествовательный стиль. Реплика звучит как решительное, но практическое возражение воинов; сохранены краткость оригинала и неоднозначность первого глагольного выражения.
