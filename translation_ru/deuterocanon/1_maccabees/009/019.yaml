  text: And Jonathan and Simon carried Judas their brother and buried him in the tomb of his fathers at Modein[a][b].
translation:
  language: ru
  text: Ионафан и Симон унесли своего брата Иуду и похоронили его в гробнице его предков в Модеине.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦραν
  choice: унесли
  rationale: В контексте погребения форма от αἴρω означает, что братья подняли и перенесли погибшего; «унесли» естественно передаёт это действие, не добавляя слова «тело», которого в греческом тексте нет.
- source_word: Ἰωναθὰν καὶ Σίμων
  choice: Ионафан и Симон
  rationale: Традиционные русские формы личных имён сохраняют узнаваемость и соответствуют современному библейскому регистру.
- source_word: Ἰούδα τὸν ἀδελφὸν αὐτοῦ
  choice: своего брата Иуду
  rationale: Хотя αὐτοῦ имеет форму единственного числа, при составном подлежащем речь идёт об общем брате Ионафана и Симона. Русское возвратное притяжательное «своего» естественно выражает эту связь и не создаёт ложной отсылки только к одному из них.
- source_word: ἔθαψαν
  choice: похоронили
  rationale: Обычное и точное русское обозначение погребения; сам способ помещения в гробницу выражен последующим обстоятельством.
- source_word: ἐν τῷ τάφῳ
  choice: в гробнице
  rationale: τάφος здесь обозначает семейную гробницу или место погребения; «гробница» лучше согласуется с упоминанием предков, чем отдельная «могила».
- source_word: τῶν πατέρων αὐτοῦ
  choice: его предков
  rationale: Множественное πατέρων в данном погребальном контексте имеет родовое значение. «Предков» ясно и естественно передаёт смысл, тогда как буквальное «отцов» в современном русском могло бы быть понято слишком узко.
- source_word: ἐν Μωδεείμ
  choice: в Модеине
  rationale: Предлог ἐν с названием места естественно передаётся русским «в»; форма «Модеин» следует греческому топониму Μωδεείμ.
