lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный глагол со значением отправления; «послал» точно и естественно передаёт форму аориста.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: своего брата
  rationale: Возвратное притяжательное местоимение естественно в русском при совпадении обладателя с подлежащим.
- source_word: ἡγούμενον τοῦ ὄχλου
  choice: во главе отряда
  rationale: Причастие обозначает руководящую роль брата. В данном военно-походном контексте ὄχλος — сопровождающая группа людей; «отряд» звучит естественнее буквального «толпа», не приписывая брату определённого воинского звания.
- source_word: παρεκάλεσεν
  choice: попросил
  rationale: В контексте практической просьбы это естественная передача широкого значения «просить, убеждать, настоятельно призывать» без неоправданного усиления.
- source_word: τοὺς Ναβαταίους φίλους αὐτοῦ
  choice: своих друзей-набатеев
  rationale: Сохраняются и дружеские отношения, и этническая принадлежность; «набатеи» — принятое современное русское название.
- source_word: παραθέσθαι αὐτοῖς
  choice: принять
  rationale: В данном контексте средний инфинитив может обозначать принятие имущества с ответственностью за него; краткая основная формулировка не устраняет возможного оттенка хранения, отмеченного в сноске.
- source_word: τὴν ἀποσκευήν αὐτῶν τὴν πολλήν
  choice: их большой обоз
  rationale: ἀποσκευή обозначает совокупность багажа, имущества и снаряжения в пути. «Обоз» естественно передаёт это коллективное значение в походной обстановке, а «большой» сохраняет указание на значительное количество.
