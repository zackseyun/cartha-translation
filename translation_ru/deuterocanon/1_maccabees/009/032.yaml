lexical_decisions:
- source_word: ἔγνω
  choice: узнал об этом
  rationale: Аорист γινώσκω здесь обозначает получение сведений; «узнал об этом» естественно передаёт смысл в повествовательном контексте, не сводя его к простому обладанию знанием.
- source_word: ἐζήτει
  choice: искал
  rationale: Имперфект передаёт продолжавшееся или предпринимавшееся действие; русское «искал» сохраняет эту незавершённость без лишнего уточнения.
- source_word: ἀποκτεῖναι
  choice: чтобы убить
  rationale: Инфинитив выражает цель поисков; «чтобы убить» прямо и современно передаёт значение, не предполагая судебной казни.
- source_word: Βακχίδης
  choice: Вакхид
  rationale: Использована традиционная русская форма имени, соответствующая греческому Βακχίδης.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение мужского рода в винительном падеже указывает на упомянутого в контексте мужчину; «его» сохраняет референциальную неоднозначность исходной фразы.
