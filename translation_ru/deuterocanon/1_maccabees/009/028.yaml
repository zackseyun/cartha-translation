lexical_decisions:
- source_word: ἠθροίσθησαν
  choice: собрались
  rationale: Аорист пассивной формы ἀθροίζω употреблён здесь непереходно, со значением совместного собирания; «собрались» естественно и точно передаёт действие.
- source_word: πάντες
  choice: все
  rationale: Сохраняет краткое и прямое собирательное значение греческого слова.
- source_word: οἱ φίλοι
  choice: друзья
  rationale: Буквальное и контекстуально уместное соответствие; возможный оттенок «сторонники» не следует вносить в основной текст без необходимости.
- source_word: Ἰούδου
  choice: Иуды
  rationale: Родительный падеж передаёт связь друзей с Иудой без смыслового расширения.
- source_word: εἶπον
  choice: сказали
  rationale: Обычное повествовательное соответствие глаголу λέγω.
- source_word: τῷ Ἰωναθάν
  choice: Ионафану
  rationale: Дательный падеж обозначает адресата речи; использована традиционная русская библейская форма имени.
