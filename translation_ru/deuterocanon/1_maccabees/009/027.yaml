  yaml_path: translation/deuterocanon/1_maccabees/009/027.yaml
  text: And there was great distress in Israel[a], such as had not been since the day when a prophet was no longer seen among them.
translation:
  language: ru
  text: И настало великое бедствие в Израиле — такого не бывало с того дня, как среди них перестал появляться пророк.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пророк не был виден им»; греческую форму можно также понимать как «пророк не появлялся у них».'
    reason: Сохраняет неоднозначность пассивной формы οὐκ ὤφθη и дательного αὐτοῖς.
lexical_decisions:
- source_word: ἐγένετο
  choice: настало
  rationale: Передаёт событийное начало бедствия и естественно звучит в русском повествовании; простое «было» слабее выражает наступление кризиса.
- source_word: θλίψις μεγάλη
  choice: великое бедствие
  rationale: θλίψις обозначает тяжёлое притеснение, скорбь или бедствие. Этот вариант ясен современному читателю и не придаёт слову узкого эсхатологического смысла.
- source_word: ἐν τῷ Ἰσραήλ
  choice: в Израиле
  rationale: 'Сохраняет локально-корпоративный смысл: бедствие охватило народ Израиля.'
- source_word: ἥτις οὐκ ἐγένετο
  choice: такого не бывало
  rationale: 'Естественно передаёт качественно-сравнительную конструкцию: бедствие было беспримерным за указанный период.'
- source_word: ἀφʼ ἧς ἡμέρας
  choice: с того дня, как
  rationale: Сохраняет обозначенную в греческом тексте временную точку отсчёта.
- source_word: οὐκ ὤφθη
  choice: перестал появляться
  rationale: Пассивная форма ὁράω может означать «не был виден» либо идиоматически «не появлялся». В данном контексте перевод выражает прекращение явления пророков, не превращая это в отвлечённое учение.
- source_word: προφήτης
  choice: пророк
  rationale: Единственное число сохранено и понимается обобщённо, как указание на отсутствие пророческого присутствия.
- source_word: αὐτοῖς
  choice: среди них
  rationale: Передаёт присутствие пророка внутри общины; буквальное «им» в современном русском здесь звучало бы неясно.
theological_decisions:
- issue: Смысл отсутствия пророка
  choice: Исторический период, когда среди Израиля перестал появляться пророк
  alternative: Указание на то, что конкретный пророк не был виден народу
  rationale: Единственное число естественно понимать обобщённо. Формулировка относится к описываемому историческому периоду и не утверждает более широкого догмата о прекращении пророчества.
- issue: Значение οὐκ ὤφθη
  choice: перестал появляться
  alternative: не был виден
  rationale: Греческая форма допускает как буквальное пассивное прочтение, так и значение «появляться». Основной текст использует естественный русский оборот, а сноска сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Тире делает тяжёлую сравнительную конструкцию яснее, не меняя её смысла; архаизмы и конфессионально окрашенные термины не используются.
