  yaml_path: translation/deuterocanon/1_maccabees/009/001.yaml
  text: And Demetrius heard that Nicanor and his forces had made war[a], and he sent Bacchides and Alcimus into the land of Judah a second time, and the right wing with them.
translation:
  language: ru
  text: И услышал Димитрий, что Никанор и его войска вели войну, и во второй раз послал Вакхида и Алкима в землю Иуды, а с ними — правое крыло[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «правый рог»; в военной речи так называли правое крыло, или правый фланг, войска.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал
  rationale: Передаёт простой повествовательный глагол без добавочного значения «узнал из официального сообщения».
- source_word: ἐποίησεν ... πόλεμον
  choice: вели войну
  rationale: Естественно передаёт греческую идиому «делать войну»; прошедшее время сохраняет сообщение о предшествующем действии без уточнения его исхода.
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: его войска
  rationale: Военный смысл δυνάμεις передан общеупотребительным русским словом без излишнего уточнения состава сил.
- source_word: προσέθετο ... ἐκ δευτέρου ἀποστεῖλαι
  choice: во второй раз послал
  rationale: Сочетание выражает повторное действие; перевод сохраняет явное указание ἐκ δευτέρου и избегает неестественного буквального «добавил послать».
- source_word: γῆν Ἰούδα
  choice: землю Иуды
  rationale: Сохраняет буквальную географическую формулировку источника, не заменяя её более поздним названием «Иудея».
- source_word: τὸ δεξιὸν κέρας
  choice: правое крыло
  rationale: В военном контексте κέρας обозначает фланг или крыло войска; «правое крыло» естественно и точно передаёт этот смысл.
