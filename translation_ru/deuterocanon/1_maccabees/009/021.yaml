  text: How the mighty one has fallen, he who was saving Israel.
translation:
  language: ru
  text: Как пал могучий[a], спасавший Израиль!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эти слова перекликаются с библейской формулой плача: «Как пали сильные!» (ср. 2 Царств 1:19, 25, 27).'
    reason: cross_reference
lexical_decisions:
- source_word: Πῶς
  choice: Как
  rationale: Вводит скорбное восклицание, а не вопрос; «как» сохраняет традиционную формулу плача без добавления междометия.
- source_word: ἔπεσεν
  choice: пал
  rationale: Аорист от πίπτω передаёт совершившееся падение; в контексте плача «пал» естественно означает гибель и сохраняет возвышенный тон.
- source_word: δυνατός
  choice: могучий
  rationale: Прилагательное употреблено субстантивированно и в единственном числе. «Могучий» сохраняет лаконичность, возвышенный регистр и не добавляет слова «воин» или имени Иуды.
- source_word: σώζων
  choice: спасавший
  rationale: Причастие настоящего времени описывает продолжающееся или характерное дело погибшего; русское причастие прошедшего времени несовершенного вида естественно передаёт эту длительность относительно момента его гибели.
- source_word: τὸν Ἰσραήλ
  choice: Израиль
  rationale: Прямое дополнение сохранено как имя собственное; оно может обозначать народ, но уточнение «народ Израиля» в сам текст не добавляется.
theological_decisions:
- issue: Отзвук библейской формулы плача
  choice: «Как пал могучий»
  alternative: «Как погиб сильный человек»
  rationale: Формулировка сохраняет вероятную перекличку с плачем во 2 Царств 1:19, 25, 27, не превращая аллюзию в явную цитату и не уточняя личность погибшего сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным звучанием плача. Восклицательный знак передаёт эмоциональную силу греческого Πῶς; синтаксическая сжатость оригинала сохранена.
