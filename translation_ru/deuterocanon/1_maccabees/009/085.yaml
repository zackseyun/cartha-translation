lexical_decisions:
- source_word: σὺν
  choice: вместе с
  rationale: Предлог обозначает присоединение к ранее названной группе или числу; перевод сохраняет его добавочное значение.
- source_word: τοῖς ἐμπυρισθεῖσιν
  choice: сожжёнными
  rationale: Субстантивированное пассивное причастие от ἐμπυρίζω прямо указывает на тех, кого сожгли. Вариант «сожжёнными заживо» был бы конкретнее сохранившегося греческого текста.
- source_word: εἰς
  choice: до
  rationale: Предлог вводит итоговое число; «до восьми тысяч» кратко и естественно передаёт достижение общей численности.
- source_word: ἄνδρας
  choice: мужчин
  rationale: Греческое ἄνδρας обозначает именно мужчин, а не людей вообще; гендерная определённость сохранена.
- source_word: ὀκτακισχιλίους
  choice: восьми тысяч
  rationale: Прямой перевод количественного числительного с падежным согласованием после «до».
- source_word: ἀπῆρεν
  choice: он ушёл
  rationale: Аорист передаёт завершённое удаление или отбытие. «Ушёл» естественно для современного русского повествования и не уточняет способ отправления.
