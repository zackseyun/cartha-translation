  text: And all the lawless men took counsel, saying, “Look, Jonathan and those with him are living in peace, confident; so now let us bring Bacchides, and he will seize them all in a single night.”
translation:
  language: ru
  text: 'И все беззаконники стали совещаться, говоря: «Вот, Ионафан и те, кто с ним, живут спокойно и уверенно.[a] Итак, теперь приведём Вакхида, и он схватит их всех за одну ночь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живут в покое, будучи уверенными»; возможно также: «живут спокойно, доверяя». Греческий текст сочетает спокойное проживание (ἐν ἡσυχίᾳ κατοικοῦσιν) с причастием πεποιθότες, означающим уверенность или доверие; объект доверия не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: стали совещаться
  rationale: Средняя форма передаёт совместное обдумывание и обсуждение замысла; перевод не усиливает значение до непременно тайного заговора.
- source_word: οἱ ἄνομοι
  choice: беззаконники
  rationale: Сохраняет значение людей, отвергающих или нарушающих закон, и естественно обозначает группу действующих лиц мужского пола.
- source_word: Ἰδοὺ
  choice: вот
  rationale: Современный и естественный указательный возглас, привлекающий внимание.
- source_word: οἱ παρ᾿ αὐτοῦ
  choice: те, кто с ним
  rationale: Передаёт принадлежность к окружению Ионафана, не уточняя, были ли это воины, спутники или иные сторонники.
- source_word: ἐν ἡσυχίᾳ κατοικοῦσιν
  choice: живут спокойно
  rationale: Отражает спокойное, ничем не тревожимое пребывание и не переопределяет его как формальное состояние мира.
- source_word: πεποιθότες
  choice: чувствуя себя в безопасности
  rationale: Передаёт состояние уверенности и защищённости в данном контексте, не вводя более сильного толкования «ничего не подозревая».
- source_word: ἄξομεν
  choice: приведём
  rationale: Будущая форма в контексте совещания выражает предложение общего действия; по-русски это естественно передаётся формой первого лица множественного числа.
- source_word: συλλήψεται
  choice: схватит
  rationale: Сохраняет широкое и энергичное значение захвата, не придавая действию узко юридического характера.
- source_word: ἐν νυκτὶ μιᾷ
  choice: за одну ночь
  rationale: Передаёт подчёркнутую краткость и сосредоточенность задуманного захвата в пределах одной ночи.
