base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/070.yaml
  text: And Jonathan learned of it[b][a], and sent ambassadors to him to make peace with him and to return the captives to them.
translation:
  language: ru
  text: Ионафан узнал об этом и послал к нему послов[a], чтобы заключить с ним мир и вернуть им пленников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланников». Греческое слово означает официальных представителей, направленных для дипломатических переговоров.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «плен»; здесь речь идёт о людях, взятых в плен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: узнал об этом
  rationale: Аорист γινώσκω здесь обозначает получение известия или осознание случившегося; «узнал об этом» естественно передаёт значение, сохраняя подразумеваемый в греческом объект.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычное и точное соответствие ἀποστέλλω в данном контексте.
- source_word: πρέσβεις
  choice: послов
  rationale: πρέσβεις обозначает официальных представителей, направленных для дипломатических переговоров; «послы» точно и естественно передаёт эту функцию.
- source_word: τοῦ συνθέσθαι πρὸς αὐτὸν εἰρήνην
  choice: чтобы заключить с ним мир
  rationale: Конструкция с артиклевым инфинитивом выражает цель, а συντίθεσθαι ... εἰρήνην — достижение или заключение мира. Формулировка не уточняет сверх текста, шла ли речь о формальном договоре.
- source_word: ἀποδοῦναι
  choice: вернуть
  rationale: Глагол означает отдать обратно или возвратить удерживаемое; «вернуть» естественно сочетается с «пленниками».
- source_word: τὴν αἰχμαλωσίαν
  choice: пленников
  rationale: Формально существительное может означать «плен» или совокупность пленных, но здесь конкретно подразумеваются захваченные люди, которых надлежало вернуть.
- source_word: αὐτοῖς
  choice: им
  rationale: Местоимение сохранено без поясняющего добавления, поскольку греческий текст прямо не называет группу, к которой должны были вернуть пленных.
