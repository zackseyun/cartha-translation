  yaml_path: translation/deuterocanon/1_maccabees/009/039.yaml
  text: And they lifted up their eyes and looked, and behold, a noisy procession and much baggage; and the bridegroom came out to meet them, with his friends and his brothers, with tambourines and musicians and many weapons.
translation:
  language: ru
  text: 'Они подняли глаза и увидели: вот шумное шествие и большой обоз. Жених вышел им навстречу с друзьями и братьями, с бубнами, музыкантами и множеством оружия.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θροῦς
  choice: шумное шествие
  rationale: Существительное обозначает шум, гул или суматоху; в данном свадебном контексте естественно передать видимый и слышимый свадебный кортеж как «шумное шествие», сохранив образ английского консультационного слоя.
- source_word: ἀποσκευή πολλή
  choice: большой обоз
  rationale: ἀποσκευή может обозначать имущество, поклажу или обоз; «большой обоз» кратко и естественно передаёт множество сопровождавшей процессию клади.
- source_word: οἱ φίλοι αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: с друзьями и братьями
  rationale: Сохраняется прямое различение друзей и братьев без уточнения, были ли братья родными или членами более широкого круга родства.
- source_word: τύμπανα
  choice: бубны
  rationale: В данном контексте речь идёт об ударных инструментах типа ручных барабанов или тамбуринов; традиционное и понятное русское соответствие — «бубны».
- source_word: μουσικοί
  choice: музыканты
  rationale: Форма обозначает исполнителей музыки; конкретные инструменты источник не называет.
- source_word: ὅπλα πολλά
  choice: множество оружия
  rationale: Сохраняет необычное для свадебной сцены упоминание многочисленного оружия, важное для последующего повествования.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Формула «подняли глаза и увидели: вот» сохраняет библейскую зрительную последовательность, но избегает неестественного буквального «и вот». Синтаксис разделён на два предложения ради ясности.'
