lexical_decisions:
- source_word: ἐν ἔτει τρίτῳ καὶ πεντηκοστῷ καὶ ἑκατοστῷ
  choice: в сто пятьдесят третьем году
  rationale: Греческая дата выражена сложением числительных; русское порядковое числительное передаёт её естественно и точно.
- source_word: τῷ μηνὶ τῷ δευτέρῳ
  choice: во втором месяце
  rationale: Прямо передаёт обстоятельство времени, не уточняя не названный в тексте календарь.
- source_word: ἐπέταξεν
  choice: приказал
  rationale: Глагол обозначает властное распоряжение; «приказал» естественно и сохраняет силу выражения.
- source_word: καθελεῖν / καθεῖλεν / καθαιρεῖν
  choice: разрушить / разрушил / разрушение
  rationale: Повтор одного русского корня отражает повтор греческого καθαιρέω и ясно передаёт физический снос.
- source_word: τὸ τεῖχος
  choice: стену
  rationale: Обычное и контекстуально точное значение τεῖχος как стены, окружающей пространство.
- source_word: τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας
  choice: внутреннего двора святилища
  rationale: Передаёт внутренний двор храмового священного пространства естественным современным русским языком, не вводя более узкой топографической детализации.
- source_word: τὰ ἔργα τῶν προφητῶν
  choice: сооружения пророков
  rationale: В контексте разрушения ἔργα, вероятно, обозначает построенные или восстановленные объекты; связь с пророками сохранена без уточнения их характера.
- source_word: ἐνήρξατο τοῦ καθαιρεῖν
  choice: Так он начал разрушение
  rationale: Передаёт начинательное значение конструкции и избегает неясного русского местоимения при нескольких возможных объектах разрушения.
theological_decisions:
- issue: Храмовая топография в τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας
  choice: внутреннего двора святилища
  alternative: внутреннего двора святого места
  rationale: «Святилище» естественно обозначает здесь храмовое священное пространство и не навязывает позднейшую техническую схему его частей.
- issue: Неясное историческое выражение τὰ ἔργα τῶν προφητῶν
  choice: сооружения пророков
  alternative: дела пророков
  rationale: Контекст физического сноса указывает на материальные объекты, однако греческий текст не сообщает, что именно это были за сооружения; эта неопределённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный регистр. Сохранены хронологическая формула, храмовая лексика и неясность исторического выражения; повтор греческого глагола разрушения передан однокоренными русскими словами.
