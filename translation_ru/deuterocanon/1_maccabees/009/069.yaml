  yaml_path: translation/deuterocanon/1_maccabees/009/069.yaml
  text: And he became angry with those lawless men who had advised him to come into the country[a], and he killed many of them, and he decided to depart to his own land.
translation:
  language: ru
  text: Он разгневался на тех беззаконных людей, которые посоветовали ему прийти в эту страну, и они убили многих из них[a]. Тогда он решил уйти в свою землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте издания Swete буквально: «и они убили многих из них». Субъект глагола во множественном числе не назван, тогда как окружающие глаголы стоят в единственном числе и относятся к предводителю. Поэтому возможно, что здесь следует понимать: «и он убил многих из них».'
    reason: textual_variant
lexical_decisions:
- source_word: ὠργίσθη
  choice: разгневался
  rationale: Передаёт аорист ὀργίζομαι естественным для современного литературного русского языка глаголом, не усиливая степень гнева сверх греческого текста.
- source_word: τοῖς ἀνδράσι τοῖς ἀνόμοις
  choice: на тех беззаконных людей
  rationale: «Беззаконных» сохраняет нравственно-правовой смысл ἀνόμοις точнее, чем более общее «нечестивых»; указательное «тех» естественно связывает определение с последующим причастным оборотом.
- source_word: τοῖς συμβουλεύσασιν αὐτῷ
  choice: которые посоветовали ему
  rationale: Причастие обозначает людей, давших ему совет; личная конструкция ясна и естественна по-русски.
- source_word: ἐλθεῖν εἰς τὴν χώραν
  choice: прийти в эту страну
  rationale: χώρα в данном военно-географическом контексте означает страну или область; «эту страну» звучит естественно и не привносит заветных оттенков слова «земля».
- source_word: ἀπέκτειναν ἐξ αὐτῶν πολλούς
  choice: они убили многих из них
  rationale: В издании Swete стоит форма третьего лица множественного числа ἀπέκτειναν. Перевод сохраняет грамматику исходного текста и не устраняет неясность субъекта без текстуального основания; вероятное единственное число разъяснено в примечании.
- source_word: ἐβουλεύσατο
  choice: решил
  rationale: В контексте глагол выражает принятое решение, а не только размышление или совещание.
- source_word: τοῦ ἀπελθεῖν
  choice: уйти
  rationale: Артиклевый инфинитив передаёт содержание решения; «уйти» ясно и естественно для повествовательного регистра.
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: в свою землю
  rationale: Сохраняет конкретный образ γῆ и возвратное притяжательное значение αὐτοῦ; выражение может обозначать собственную страну или владение героя.
