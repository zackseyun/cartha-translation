lexical_decisions:
- source_word: μετεστράφη
  choice: обернулась
  rationale: Передаёт пассивное изменение и резкий поворот от праздника к скорби; естественно звучит по-русски.
- source_word: ὁ γάμος
  choice: свадьба
  rationale: В контексте речь идёт о свадебном торжестве, а не о браке как установлении.
- source_word: πένθος
  choice: траур
  rationale: Обозначает скорбь и публичное оплакивание после гибели; создаёт ясный контраст со свадьбой.
- source_word: φωνὴ
  choice: звуки
  rationale: Здесь слово обозначает слышимое музыкальное звучание; множественное число естественно сочетается с музыкантами.
- source_word: μουσικῶν
  choice: музыкантов
  rationale: Форма допускает понимание как лиц, исполняющих музыку; неоднозначность с музыкальными инструментами сохранена в сноске.
- source_word: θρῆνον
  choice: плачем
  rationale: Передаёт погребальное или скорбное оплакивание и сохраняет краткий параллелизм оригинала.
