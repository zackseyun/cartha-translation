  text: And they kept seeking out and searching for the friends of Judas[a], and they were bringing them to Bacchides[b], and he took vengeance on them and mocked them.
translation:
  language: ru
  text: Они разыскивали и выслеживали друзей Иуды[a], приводили их к Вакхиду; он мстил им, а они глумились над ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сторонников Иуды», «союзников Иуды». Буквально: «друзей Иуды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεζήτουν καὶ ἐξηραύνων
  choice: разыскивали и выслеживали
  rationale: Два близких по смыслу глагола передают настойчивый, продолжающийся розыск. «Выслеживали» естественно выражает активное преследование, не устраняя усиление оригинала.
- source_word: τοὺς φίλους Ἰούδου
  choice: друзей Иуды
  rationale: Сохранено буквальное значение φίλοι; в данном политико-военном контексте слово может также обозначать сторонников или союзников, что отмечено в сноске.
- source_word: ἦγον αὐτοὺς πρὸς Βακχίδην
  choice: приводили их к Вакхиду
  rationale: Имперфект передаёт повторяющееся действие, а πρός с винительным — движение к лицу. «Приводили» уместно в контексте задержания и передачи людей.
- source_word: ἐξεδίκα αὐτούς
  choice: он мстил им
  rationale: Глагол может означать наказание, осуществление возмездия или месть. Контекст враждебной расправы поддерживает «мстил», при этом неоднозначность отражена в сноске.
- source_word: ἐνέπαιζον αὐτοῖς
  choice: издевался над ними
  rationale: ἐμπαίζω обозначает насмешку, глумление или обращение с человеком как с предметом забавы. «Издевался» передаёт не только словесную насмешку, но и унизительный характер происходящего.
