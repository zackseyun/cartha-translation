- source_word: ἐκόψαντο
  choice: оплакивали
  rationale: Средняя форма κόπτω в контексте смерти обозначает ритуальное оплакивание. «Оплакивали» естественно звучит по-русски и позволяет сохранить повтор греческого глагола.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение относится к Иуде из предшествующего контекста.
- source_word: ἐκεῖ
  choice: там
  rationale: Прямой и естественный перевод наречия места.
- source_word: πᾶς Ἰσραήλ
  choice: весь Израиль
  rationale: Сохранено собирательное национальное обозначение, обычное для библейской речи.
- source_word: κοπετὸν μέγαν
  choice: великим плачем
  rationale: Оборот сохраняет усиление и связь однокоренного существительного с предшествующим ἐκόψαντο, не перегружая текст описанием конкретных траурных жестов.
- source_word: ἔπενθουν
  choice: скорбели
  rationale: Глагол πενθέω близок по смыслу к языку оплакивания, но лексически отличен; «скорбели» передаёт этот сдвиг.
- source_word: ἡμέρας πολλὰς
  choice: много дней
  rationale: Винительный длительности естественно передаётся по-русски без предлога.
- source_word: καὶ εἶπαν
  choice: 'и говорили:'
  rationale: Имперфект в повествовательной последовательности вводит последующее изречение; двоеточие соответствует русской пунктуации перед прямой речью следующего стиха.
