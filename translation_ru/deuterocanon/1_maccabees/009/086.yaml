  text: From there Jonathan moved on and encamped at Ashkelon[a], and those from the city came out to meet him with great honor.
translation:
  language: ru
  text: Оттуда Ионафан двинулся дальше и расположился лагерем у Аскалона. Жители города вышли ему навстречу с великими почестями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая строка в издании Света обрывается после καὶ ἐπέ-, однако предшествующее предложение, заканчивающееся словами «с великими почестями», полностью и позволяет уверенно перевести этот фрагмент стиха.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: Оттуда
  rationale: Естественно передаёт пространственный переход в повествовании.
- source_word: παρενέβαλεν
  choice: расположился лагерем
  rationale: Сохраняет военный оттенок глагола и звучит естественно в современном русском языке.
- source_word: εἰς Ἀσκάλωνα
  choice: у Аскалона
  rationale: При глаголе расположения лагерем русский язык требует обозначения места; форма «у Аскалона» не подразумевает, что войско вошло внутрь города.
- source_word: ἐξῆλθον οἱ ἐκ τῆς πόλεως
  choice: Жители города вышли
  rationale: Естественно и без существенного уточнения передаёт буквально неопределённое «те, кто из города, вышли».
- source_word: εἰς συνάντησιν αὐτῷ
  choice: ему навстречу
  rationale: Обычное русское соответствие повествовательному обороту со значением выхода для встречи.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: приняли его с великим почётом
  rationale: В данном контексте δόξα обозначает торжественный, почётный приём, а не отвлечённую славу; добавление «приняли» делает смысл оборота ясным по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Двинулся дальше» естественно передаёт продолжение пути, предполагаемое связкой ἐκεῖθεν и контекстом, не утяжеляя текст буквальным синтаксисом фрагмента.
