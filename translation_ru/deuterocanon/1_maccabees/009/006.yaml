lexical_decisions:
- source_word: τὸ πλῆθος τῶν δυνάμεων
  choice: множество войск
  rationale: В военном контексте δυνάμεις обозначает войска или вооружённые силы, а πλῆθος — их большое количество. «Множество войск» сохраняет множественное число и не сводит выражение к одной армии.
- source_word: πολλοί εἰσιν
  choice: как их много
  rationale: Пояснительная фраза непосредственно подчёркивает численное превосходство увиденных войск; такой оборот естественен по-русски и сохраняет повтор исходного текста.
- source_word: ἐφοβήθησαν σφόδρα
  choice: сильно испугались
  rationale: Наречие σφόδρα усиливает страх; «сильно испугались» ясно и естественно передаёт наступившую реакцию.
- source_word: ἐξερρύησαν
  choice: покинули
  rationale: Глагол буквально связан с истечением наружу и здесь описывает уход людей из лагеря; нейтральное «покинули» не решает без достаточных оснований, был ли это бег или незаметное дезертирство. Возможная более сильная трактовка вынесена в сноску.
- source_word: παρεμβολῆς
  choice: лагерь
  rationale: В данном военном контексте παρεμβολή означает лагерь или стан; «лагерь» — современный и ясный эквивалент.
- source_word: οὐ κατελείφθησαν ἐξ αὐτῶν ἀλλʼ ἢ ὀκτακόσιοι ἄνδρες
  choice: осталось из них лишь восемьсот человек
  rationale: Формулировка точно передаёт число оставшихся после ухода остальных и звучит естественно в современном русском языке.
