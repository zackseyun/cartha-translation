  yaml_path: translation/deuterocanon/1_maccabees/009/074.yaml
  text: When Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem; and Simon his brother met him to help him.
translation:
  language: ru
  text: Когда Ионафан услышал слова Аполлония, он пришёл в волнение, отобрал десять тысяч человек и вышел из Иерусалима. Симон, брат Ионафана, встретил его, чтобы оказать ему помощь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Когда … услышал
  rationale: Оборот с ὡς и аористом вводит придаточное времени; русский союз «когда» естественно передаёт последовательность событий.
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: слова Аполлония
  rationale: Сохранено прямое значение λόγοι без конкретизации как «весть» или «угрозы».
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: он пришёл в волнение
  rationale: Выражение обозначает внутреннее душевно-умственное движение. «Пришёл в волнение» сохраняет неопределённость эмоции и не сводит её ни к страху, ни к гневу.
- source_word: ἐπέλεξεν
  choice: отобрал
  rationale: В военном контексте «отобрал» естественно передаёт целенаправленный выбор людей.
- source_word: δέκα χιλιάδας ἀνδρῶν
  choice: десять тысяч человек
  rationale: Передано буквальное обозначение численности без добавления отсутствующего в греческом слова «воинов».
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: вышел из Иерусалима
  rationale: Близко передаёт простой глагол движения, не добавляя значения «выступил в поход».
- source_word: συνήντησεν αὐτῷ ἐπὶ βοήθειαν αὐτοῦ
  choice: встретился с ним, чтобы помочь ему
  rationale: «Встретился» непосредственно передаёт συνήντησεν, а придаточное цели отражает ἐπὶ βοήθειαν; не добавляется более сильное значение «присоединился».
