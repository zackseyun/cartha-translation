translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным строем. Начальное φυγεῖν расценено как остаток предыдущего стиха и не включено, поскольку синтаксически данный стих начинается с Ὡς δὲ ἤκουσεν.
