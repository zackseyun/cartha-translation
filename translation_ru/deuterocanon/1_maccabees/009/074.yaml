  source_fidelity: 'В целом перевод точно передаёт последовательность действий, численность, происхождение из Иерусалима и цель помощи. Однако «встретился с ним» обозначает взаимную встречу и несколько ослабляет активное συνήντησεν: Симон именно встретил Ионафана.'
