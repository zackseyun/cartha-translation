  text: And Bacchides saw that Alcimus had died, and he returned to the king, and the land of Judah was quiet for two years.
translation:
  language: ru
  text: Вакхид узнал, что Алким умер, возвратился к царю, и земля Иуды два года пребывала в покое.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: узнал
  rationale: Буквально глагол означает «увидел», но с придаточным ὅτι в повествовательном контексте естественно передаёт осознание или получение известия; по-русски «узнал, что» звучит яснее, чем «увидел, что» применительно к смерти Алкима.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Аорист констатирует смерть Алкима; русское прошедшее время естественно выражает событие, предшествующее возвращению Вакхида, без необходимости вводить дополнительную грамматическую форму.
- source_word: ἀπέστρεψεν
  choice: возвратился
  rationale: Глагол означает «повернул назад, возвратился»; «возвратился» точно и естественно передаёт движение обратно к царю.
- source_word: πρὸς τὸν βασιλέα
  choice: к царю
  rationale: Предлог πρός с винительным падежом обозначает направленность движения к лицу; нормативное русское соответствие — «к царю».
- source_word: ἡσύχασεν
  choice: оставалась в покое
  rationale: Глагол обозначает состояние тишины, покоя и отсутствия волнений. Выражение «оставалась в покое» передаёт политическое затишье, не усиливая его до богословски нагруженного понятия полного мира.
- source_word: ἡ γῆ Ἰούδα
  choice: земля Иуды
  rationale: Сохраняется явно названная γῆ — «земля» и библейская форма территориального наименования «Иуда», а не более позднее «Иудея».
- source_word: ἔτη δύο
  choice: два года
  rationale: Винительный длительности естественно передаётся по-русски сочетанием «два года»; обстоятельственное значение ясно из конструкции предложения.
