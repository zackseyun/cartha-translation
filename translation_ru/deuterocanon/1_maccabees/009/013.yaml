  text: И земля содрогнулась от их станов, а сражение шло с утра до вечера.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσείσθη
  choice: содрогалась
  rationale: Передаёт сильное сотрясение земли и естественно звучит по-русски; длительный вид уместен в описании продолжавшегося воздействия двух станов.
- source_word: παρεμβολῶν
  choice: станов
  rationale: Во множественном числе обозначает расположившиеся друг против друга военные лагеря; «станы» сохраняет военный контекст и число оригинала.
- source_word: ὁ πόλεμος συνηγμένος
  choice: битва продолжалась
  rationale: Греческое выражение буквально необычно — «битва была сведена/соединена» — и в данном контексте означает, что бой был начат и шёл; выбранное выражение естественно передаёт длительность, не усиливая образ до «бушевала».
- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  choice: с утра до вечера
  rationale: Точная и естественная передача временного диапазона.
