    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-гречески: «начал наносить удары и подниматься с войсками»; «продвигаться» передаёт вероятный военный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάτεξεν
  choice: поразил
  rationale: Аорист от πατάσσω обозначает нанесение удара или военное поражение. «Поразил» сохраняет конкретность действия и соответствует возвышенному, но современному повествовательному регистру.
- source_word: Ὀδομηρὰ
  choice: Одомеру
  rationale: Личное имя передано транслитерацией; форма винительного падежа естественна для русского предложения.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: его братьев
  rationale: ἀδελφοί прежде всего означает родных братьев; контекст не требует расширять значение до «родственников» или «соплеменников».
- source_word: τοὺς υἱοὺς Φασιρὼν
  choice: сынов Фасирона
  rationale: Буквальное «сынов» сохраняет родовую формулу оригинала и не устраняет возможную широту значения «потомки».
- source_word: ἐν τῷ σκηνώματι αὐτῶν
  choice: в их стане
  rationale: σκηνῶμα буквально связано с шатром или жилищем, однако в военном контексте обозначает место стоянки группы. «Стан» кратко и естественно передаёт военный лагерь.
- source_word: ἐξηρξατο
  choice: начал
  rationale: Глагол выражает начало действия; «начал» прямо сохраняет его фазовое значение.
- source_word: τύπτειν
  choice: наносить удары
  rationale: τύπτω означает «бить, ударять». Выражение сохраняет образ ударов и отчасти намеренную лексическую перекличку с ἐπάτεξεν, не создавая неестественного русского повтора.
- source_word: ἀναβαίνειν
  choice: продвигаться
  rationale: Буквальное значение — «идти вверх, подниматься»; в данном боевом контексте вероятен смысл наступательного продвижения. Более буквальная возможность отмечена в сноске.
- source_word: ἐν ταῖς δυνάμεσιν
  choice: с войсками
  rationale: Множественное δυνάμεις часто обозначает военные силы. «С войсками» сохраняет множественное число и не добавляет отсутствующего в греческом притяжательного местоимения.
