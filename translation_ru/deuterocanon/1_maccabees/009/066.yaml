translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейско-историческим оттенком. Слово «стан» выбрано как понятное в контексте военного повествования; архаичные глаголы вроде «сразил» или «восходить» не использованы. Союз «а затем» делает последовательность действий ясной, не меняя содержания.
