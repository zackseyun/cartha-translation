  text: And he struck Odomera and his brothers and the sons of Phasiron in their camp[b][a], and he began to strike and to advance with his forces.
translation:
  language: ru
  text: И он поразил Одомеру, его братьев и сынов Фасирона в их стане[a], а затем начал наносить удары и продвигаться с войсками[b].
