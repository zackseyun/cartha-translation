  yaml_path: translation/deuterocanon/1_maccabees/009/015.yaml
  text: And the right wing was crushed before them[b][a], and he pursued after them as far as the mountain of Azotus.
translation:
  language: ru
  text: И правое крыло[a] было сокрушено перед ними, и он преследовал их до горы Азота[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «правый рог» — военная метафора, обозначающая правую сторону, или крыло, войска.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «до горной местности Азота». Греческое выражение может обозначать как отдельную гору, так и возвышенную местность, связанную с Азотом.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνετρίβη
  choice: было сокрушено
  rationale: Пассивная форма συντρίβω передаёт образ сокрушения, то есть решительного поражения, не заменяя его более толковательным «было обращено в бегство».
- source_word: τὸ δεξιὸν κέρας
  choice: правое крыло их войска
  rationale: Буквально κέρας означает «рог», но здесь это военная метафора правой части боевого строя. «Крыло войска» естественно по-русски и ясно передаёт смысл.
- source_word: ἀπʼ αὐτῶν
  choice: перед ними
  rationale: В контексте сражения оборот указывает, что неприятельское крыло не устояло перед наступавшими; «перед ними» сохраняет образ и не вводит прямо выраженного в греческом действующего лица.
- source_word: ἔδωκεν ὀπίσω αὐτῶν
  choice: он преследовал их
  rationale: Греческий оборот означает погоню за отступавшими. Единственное число «он» сохраняет форму исходного текста и, по контексту, относится к Иуде как предводителю.
- source_word: ἕως Ἀζώτου ὄρους
  choice: до горы Азота
  rationale: Такой перевод близок к греческой конструкции и не утверждает с излишней уверенностью, обозначено ли здесь собственное название отдельной горы или возвышенность в области Азота.
