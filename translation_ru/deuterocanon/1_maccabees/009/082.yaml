  source_fidelity: 'Перевод точно сохраняет фрагментарный характер греческого свидетельства: начальный винительный «фалангу» оставлен без искусственно восстановленного сказуемого, а заключительное «и они бежали в» обрывается, как и источник. «Конница» адекватно передаёт собирательное ἡ ἵππος; «распалась», «были сокрушены», «рассеялась по равнине» соответствуют греческим глаголам и военному контексту. Неясный субъект множественного числа не уточняется сверх источника. Передача ἀπʼ αὐτοῦ как «им» допустима и не вносит имени или иной идентификации.'
