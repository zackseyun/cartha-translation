lexical_decisions:
- source_word: φάλαγγα
  choice: фалангу
  rationale: Военный термин φάλαγξ обозначает фалангу или сомкнутый боевой строй. «Фалангу» сохраняет конкретность и обрывочный синтаксис дошедшего греческого текста.
- source_word: ἵππος
  choice: конница
  rationale: Форма единственного числа употреблена собирательно и обозначает конные войска; «конница» естественно передаёт этот военный смысл.
- source_word: ἐξελύθη
  choice: распалась
  rationale: Глагол выражает разъединение или разрушение строя; «распалась» передаёт это без излишнего усиления до полного разгрома.
- source_word: συνετρίβησαν
  choice: были сокрушены
  rationale: Глагол обозначает тяжёлое поражение, буквально сокрушение; пассивная конструкция сохраняет форму и силу греческого выражения.
- source_word: ἀπʼ αὐτοῦ
  choice: им
  rationale: В данном военном контексте сочетание указывает на деятеля, от которого исходило поражение; творительный падеж кратко и естественно передаёт «от него / им», не добавляя имени.
- source_word: ἐσκορπίσθη
  choice: рассеялась
  rationale: Точное и естественное обозначение разрозненного бегства воинского подразделения.
- source_word: πεδίῳ
  choice: равнине
  rationale: πεδίον в повествовании о сражении обозначает открытую равнинную местность, а не обязательно возделанное поле.
