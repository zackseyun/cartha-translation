  naturalness: '«Под покровом горы» звучит поэтически и в современном русском недостаточно определённо: «покров горы» может пониматься как снежный или растительный покров. «Под прикрытием горы» естественно передаёт укрытие, обеспечиваемое горой, и подходит к контексту бегства.'
