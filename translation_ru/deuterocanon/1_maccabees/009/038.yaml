lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: вспомнили
  rationale: Аорист медиального μιμνῄσκομαι прямо передаёт значение «вспомнили»; дополнение с «об» естественно для современного русского языка.
- source_word: Ἰωάνου τοῦ ἀδελφοῦ αὐτῶν
  choice: об Иоанне, своём брате
  rationale: Сохраняется имя в принятой русской библейской форме и прямо выражается родственная связь, без добавления отсутствующих в греческом тексте подробностей.
- source_word: ἀνέβησαν
  choice: поднялись
  rationale: Передаёт пространственное движение вверх, не уточняя места назначения сверх сказанного в греческом тексте.
- source_word: ἐκρύβησαν
  choice: укрылись
  rationale: Форма по контексту означает, что они спрятались или нашли укрытие; возвратный глагол естественно передаёт это по-русски.
- source_word: ὑπὸ τὴν σκέπην τοῦ ὄρους
  choice: под покровом горы
  rationale: «Покров» сохраняет конкретный образ покрытия и одновременно возможный оттенок защиты, не сводя многозначное σκέπη только к физическому укрытию или абстрактной защите.
