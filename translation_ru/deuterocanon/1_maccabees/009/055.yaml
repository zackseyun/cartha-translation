    issue: «дела его были остановлены»
    rationale: ἐνεποδίσθη означает «были затруднены, стеснены, встречали препятствие»; «остановлены» может утверждать окончательное или полное прекращение, которого глагол сам по себе не требует.
  - severity: medium
    issue: «уста его сомкнулись»
    rationale: ἀπεφράγη — пассив от «заграждать, закупоривать, перекрывать»; данный вариант заменяет действие над устами возвратным «сомкнулись» и ослабляет образ препятствия речи.
