  text: At that time Alcimus was struck down[a], and his works were hindered; his mouth was stopped up, and he was paralyzed, and he could no longer speak a word or give orders concerning his house.
translation:
  language: ru
  text: В то время Алким был поражён, и делам его было воспрепятствовано; уста его оказались закрыты, его разбил паралич, и он уже не мог ни слова сказать и распорядиться о своём доме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о своих домашних»; или: «о своих делах». Греческое слово «дом» (οἶκος) может обозначать не только здание, но и семью, домочадцев или всё домашнее хозяйство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγη
  choice: был поражён
  rationale: Передаёт внезапное тяжёлое поражение, не уточняя ни медицинской причины, ни действующего лица, которых греческий текст прямо не называет.
- source_word: ἐνεποδίσθη τὰ ἔργα αὐτοῦ
  choice: дела его были остановлены
  rationale: В контексте тяжёлой утраты дееспособности речь идёт о прекращении его занятий и начинаний; формулировка сохраняет пассивную конструкцию.
- source_word: ἀπεφράγη τὸ στόμα αὐτοῦ
  choice: уста его сомкнулись
  rationale: Сохраняет телесный образ преграды для речи, но звучит естественно и достойно по-русски.
- source_word: παρελύθη
  choice: его разбил паралич
  rationale: Передаёт обычное значение глагола — паралич или тяжёлую физическую обездвиженность — без постановки более точного медицинского диагноза.
- source_word: οὐκ ἠδύνατο ἔτι λαλῆσαι λόγον
  choice: он уже не мог ни слова сказать
  rationale: Естественно воспроизводит отрицание, ἔτι и греческое выражение λαλῆσαι λόγον.
- source_word: ἐντείλασθαι
  choice: распорядиться
  rationale: В данном административно-домашнем контексте глагол означает отдать распоряжения или указания.
- source_word: περὶ τοῦ οἴκου αὐτοῦ
  choice: о своём доме
  rationale: Сохраняет широкое значение οἶκος, которое может охватывать дом, домочадцев, хозяйство и семейные дела; неоднозначность поясняется в сноске.
theological_decisions:
- issue: Характер поражения Алкима
  choice: Тяжёлое внезапное поражение описано без прямого указания на Божий суд и без точного диагноза.
  alternative: Назвать случившееся Божьей карой либо конкретно инсультом или припадком.
  rationale: В стихе употреблены пассивные формы, но действующее лицо не названо; также текст описывает симптомы, не устанавливая медицинскую причину.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Уста» поддерживает достоинство регистра и параллелизм последовательных телесных поражений; синтаксис остаётся ясным для современного читателя.
