  text: And they rose up against them from the ambush and killed them[a]; and many fell wounded, and the rest fled to the mountain[b], and they took all their equipment.
translation:
  language: ru
  text: И они вышли из засады и напали на них, убили их; многие пали, получив ранения[a], а остальные бежали на гору, и они захватили всё их снаряжение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многие пали как жертвы сражения». Греческое слово τραυματίαι может обозначать как раненых, так и, шире, выведенных из строя в бою.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всё их походное имущество» или «всю их утварь». Греческое слово σκεύη имеет широкое значение — вещи, принадлежности или снаряжение; военный контекст указывает здесь на личное либо походное имущество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν ἐπʼ αὐτοὺς ἀπὸ τοῦ ἐνέδρου
  choice: поднялись на них из засады
  rationale: Сохраняет образ внезапного выступления из укрытия и враждебную направленность действия, не заменяя глагол более толковательным «напали».
- source_word: ἀπέκτειναν αὐτούς
  choice: убили их
  rationale: Прямой и современный эквивалент греческого выражения без архаизации.
- source_word: ἔπεσαν τραυματίαι πολλοί
  choice: многие пали ранеными
  rationale: Передаёт и глагол «пали», и значение τραυματίαι как раненых, не утверждая, что все они погибли.
- source_word: οἱ ἐπίλοιποι
  choice: остальные
  rationale: Естественно обозначает тех, кто не был убит или выведен из строя и сумел бежать.
- source_word: ἔφυγον εἰς τὸ ὄρος
  choice: бежали на гору
  rationale: Сохраняет единственное число и конкретный образ исходного текста; варианты «в горы» и «в горную местность» были бы более интерпретирующими.
- source_word: ἔλαβον πάντα τὰ σκεύη αὐτῶν
  choice: захватили всё их снаряжение
  rationale: В военном контексте σκεύη естественно означает снаряжение или походное имущество; «захватили» передаёт завладение им после столкновения.
