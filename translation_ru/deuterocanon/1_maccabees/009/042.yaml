lexical_decisions:
- source_word: ἐξεδίκησαν τὴν ἐκδίκησιν αἵματος
  choice: отомстили за кровь
  rationale: Греческая конструкция с однокоренными словами буквально передаёт усиленное выражение кровной мести. Русское «отомстили за кровь» естественно и точно выражает смысл, не воспроизводя неуклюжий повтор.
- source_word: ἀδελφοῦ αὐτῶν
  choice: своего брата
  rationale: Единственное число прямо указывает на брата; возвратное «своего» естественно соотносит его с действующими лицами.
- source_word: ἀπέστρεψαν
  choice: возвратились
  rationale: Глагол обозначает возвращение или движение обратно; «возвратились» соответствует повествовательному регистру.
- source_word: εἰς τὸ ὄρος τοῦ Ἰορδάνου
  choice: в нагорье Иордана
  rationale: ὄρος может обозначать не только отдельную гору, но и гористую местность. «Нагорье» сохраняет географическую неоднозначность лучше, чем указание на конкретную вершину.
