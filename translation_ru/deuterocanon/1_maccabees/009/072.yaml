  yaml_path: translation/deuterocanon/1_maccabees/009/072.yaml
  text: And he returned to him the captives whom he had formerly taken captive from the land of Judah[a], and he turned back and went away to his own land[b], and he no longer came again into their borders.
translation:
  language: ru
  text: И он возвратил ему пленников, которых прежде увёл в плен из земли Иудеи[a]; затем повернул назад и отправился в свою страну и больше не приходил в их пределы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плен»; здесь слово обозначает совокупность людей, уведённых в плен.'
    reason: lexical_alternative
  - marker: b
    text: Греческое выражение буквально означает «больше не прибавил приходить», то есть больше не приходил в их пределы.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκεν
  choice: возвратил
  rationale: Глагол означает отдать обратно то, что было захвачено; «возвратил» естественно сочетается с «пленниками».
- source_word: τὴν αἰχμαλωσίαν
  choice: пленников
  rationale: Буквально существительное обозначает «плен» или совокупность пленённых; в данном контексте речь идёт о людях, поэтому конкретное «пленников» передаёт смысл яснее.
- source_word: ᾐχμαλώτευσεν
  choice: увёл в плен
  rationale: Передаёт военный контекст захвата людей и сохраняет смысловую связь со словом «пленников».
- source_word: τὸ πρότερον
  choice: прежде
  rationale: Кратко и естественно обозначает действие, совершённое ранее.
- source_word: ἐκ γῆς Ἰούδα
  choice: из земли Иуды
  rationale: Сохраняет явно выраженное в греческом тексте географическое слово γῆ, «земля».
- source_word: ἀποστρέψας
  choice: повернул назад
  rationale: Причастие описывает последующее обратное движение; личная глагольная форма естественна в современном русском повествовании.
- source_word: ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  choice: ушёл в свою землю
  rationale: Сохраняет значение удаления и указание на принадлежащую ему страну или землю.
- source_word: οὐ προσέθετο ἔτι ἐλθεῖν
  choice: больше не приходил
  rationale: Греческая конструкция προστίθημι с инфинитивом выражает повторение или продолжение действия; по-русски естественно передаётся как «больше не приходил».
- source_word: τὰ ὅρια αὐτῶν
  choice: их пределы
  rationale: ὅρια может обозначать границы, пограничные области или территорию; «пределы» сохраняет эту ёмкость и подходит возвышенному историческому повествованию.
