lexical_decisions:
- source_word: χρυσῆν
  choice: золотую
  rationale: Прилагательное женского рода означает «золотую» и согласуется с подразумеваемым из предшествующего контекста предметом.
- source_word: '[подразумеваемый из контекста предмет]'
  choice: пряжку
  rationale: В данном фрагменте существительное опущено, поэтому для связности русского текста оно восстановлено по контексту. Поскольку восстановление носит толковательный характер, оно отмечено сноской.
- source_word: ὡς ἔθος ἐστὶν διδόσθαι
  choice: какую по обычаю дарят
  rationale: Естественно передаёт обычай вручать такой предмет, сохраняя сопоставительный оборот греческого текста.
- source_word: συγγενεῦσιν τῶν βασιλέων
  choice: родственникам царей
  rationale: Прямо сохраняет родственное значение συγγενεῦσιν и не уточняет характер родства сверх источника.
- source_word: Ἀκκαρὼν
  choice: Аккарон
  rationale: Передаёт греческую форму топонима транслитерацией; более привычная форма «Екрон» указана в сноске.
- source_word: πάντα τὰ ὅρια αὐτῆς
  choice: со всеми его землями
  rationale: В контексте земельного пожалования ὅρια обозначает принадлежащую городу территорию, а не только пограничные линии. В русском местоимение согласовано с названием города.
- source_word: εἰς κληρονομίαν
  choice: в наследие
  rationale: Кратко и естественно передаёт пожалование земли как наследственного владения.
