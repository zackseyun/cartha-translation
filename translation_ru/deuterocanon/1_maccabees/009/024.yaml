lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: В те дни
  rationale: Естественная русская повествовательная формула, точно передающая греческое обстоятельство времени.
- source_word: ἐγενήθη
  choice: разразился
  rationale: В сочетании с «голод» естественно выражает наступление тяжёлого бедствия, не меняя событийного значения глагола.
- source_word: λιμὸς μεγάλη σφόδρα
  choice: чрезвычайно сильный голод
  rationale: «Голод» передаёт λιμός, а сочетание «чрезвычайно сильный» сохраняет усиление μεγάλη σφόδρα и звучит естественнее буквального «весьма великий».
- source_word: αὐτομόλησεν
  choice: перешла на сторону противника
  rationale: Глагол обозначает бегство или переход на другую, обычно вражескую, сторону; выбранная формулировка ясно передаёт политико-военную смену принадлежности.
- source_word: ἡ χώρα
  choice: страна
  rationale: 'Сохраняет широкое значение χώρα и допускает обычную метонимию: страна как её население.'
- source_word: μετʼ αὐτῶν
  choice: вместе с ними
  rationale: Передаёт μετά с родительным как совместность и сохраняет неопределённую отсылку местоимения исходного текста.
