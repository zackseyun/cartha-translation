lexical_decisions:
- source_word: στρεψεν
  choice: повернул назад
  rationale: Аорист от στρέφω здесь обозначает обратное движение. «Повернул назад» передаёт его прямо, не уточняя, вернулся ли Ионафан в исходное место.
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  choice: вместе с теми, кто был с ним
  rationale: Формулировка близка к греческому выражению и не вводит отсутствующего в нём уточнения «воины».
- source_word: ἔχοντες
  choice: неся
  rationale: Причастие выражает сопутствующее обстоятельство и в связи с военной добычей естественно передаётся глаголом «нести».
- source_word: σκῦλα πολλά
  choice: богатую добычу
  rationale: σκῦλα означает захваченные в столкновении трофеи или добычу; «богатая добыча» естественно передаёт большое её количество.
