  source_fidelity: 'Перевод точно передаёт движение в Вет-Баси, определение места «в пустыне», восстановление разрушенного и последующее укрепление поселения. Единственное число αὐτοῦ не сглажено: оно отражено в тексте и специально пояснено в сноске. Множественное число русских сказуемых обоснованно согласовано с составным подлежащим и не меняет греческой неоднозначности.'
