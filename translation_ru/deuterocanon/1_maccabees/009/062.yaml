base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/062.yaml
  text: And Jonathan and Simon and those with them withdrew to Beth-basi in the wilderness[b][a], and rebuilt its ruins and fortified it.
translation:
  language: ru
  text: Ионафан, Симон и те, кто был с ним,[a] отошли в Бет-Баси, что в пустыне, отстроили разрушенное там[b] и укрепили это место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «те, кто был с ним». Единственное число местоимения сохранено вслед за греческим текстом, хотя перед ним названы Ионафан и Симон.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «восстановили его развалины»; буквально: «отстроили то, что в нём было разрушено».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξεχώρησεν
  choice: отошли
  rationale: Глагол обозначает удаление или отход; в военном повествовании «отошли» передаёт смысл без усиления до «бежали».
- source_word: οἱ μετʼ αὐτοῦ
  choice: те, кто был с ним
  rationale: Сохранено единственное число греческого αὐτοῦ, хотя сказуемое по нормам русского языка согласовано со всем составным подлежащим.
- source_word: Βεθβασί
  choice: Бет-Баси
  rationale: Название места передано транслитерацией в форме, удобной для русского чтения.
- source_word: τὴν ἐν τῇ ἐρήμῳ
  choice: что в пустыне
  rationale: Оборот определяет местонахождение Бет-Баси; «пустыня» естественно передаёт библейское употребление ἔρημος.
- source_word: ᾠκοδόμησεν τὰ καθηρημένα αὐτῆς
  choice: отстроили разрушенное там
  rationale: Контекстуальное «отстроили» выражает восстановление того, что было снесено или разрушено; «там» естественно передаёт соотнесённость αὐτῆς с поселением.
- source_word: ἐστερέωσεν αὐτήν
  choice: укрепили это место
  rationale: В контексте вооружённого противостояния глагол означает укрепление поселения; явное «это место» избегает неясного местоимения.
