  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для русского: множественное число сказуемых соотнесено с составным подлежащим, при этом неоднозначность единственного числа в выражении οἱ μετʼ αὐτοῦ сохранена и пояснена в сноске.'
