lexical_decisions:
- source_word: Ἰούδας
  choice: Иуда
  rationale: Традиционная русская форма греческого имени Ἰούδας; здесь речь об Иуде Маккавее.
- source_word: ἔπεσεν
  choice: пал
  rationale: Аорист πίπτω буквально означает «пал». В рассказе о сражении это обычное выражение, подразумевающее гибель, но перевод сохраняет лаконичность и некоторую непрямоту греческого текста.
- source_word: οἱ λοιποὶ
  choice: остальные
  rationale: Передаёт тех, кто оставался помимо названного Иуды, и естественно противопоставляет их ему.
- source_word: ἔφυγον
  choice: бежали
  rationale: В контексте сражения φεύγω обозначает бегство от противника; «бежали» — прямой и стилистически уместный русский эквивалент.
