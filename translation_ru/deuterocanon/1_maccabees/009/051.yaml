lexical_decisions:
- source_word: ἔθεντο
  choice: разместили
  rationale: В военном контексте передаёт размещение или расквартирование людей; естественнее буквального «положили».
- source_word: φρουράν
  choice: гарнизон
  rationale: Здесь речь идёт о военном отряде, размещённом в укреплённых местах, поэтому «гарнизон» точнее общего «стража».
- source_word: ἐν αὐτοῖς
  choice: в них
  rationale: Местоимение отсылает к ранее названным местам; перевод сохраняет эту отсылку, не уточняя её сверх текста стиха.
- source_word: τοῦ ἐχθραίνειν
  choice: чтобы враждовать
  rationale: Конструкция с артиклевым инфинитивом и τοῦ выражает цель размещения гарнизона; «враждовать» сохраняет деятельный и потенциально продолжительный характер греческого глагола.
- source_word: τῷ Ἰσραήλ
  choice: против Израиля
  rationale: Дательный падеж обозначает объект враждебного действия; по-русски сочетание «враждовать против» ясно передаёт направленность вражды.
