  text: But Bacchides was on the right wing[a], and the phalanx came near from both sides, and they were sounding the trumpets[b], and those with Judas also sounded the trumpets, they too.
translation:
  language: ru
  text: Вакхид же находился на правом крыле[a]. Фаланга приблизилась с обеих сторон[b], и они трубили в трубы; и те, кто был с Иудой, тоже затрубили в трубы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на правом роге»; это военное выражение означает правое крыло или фланг.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с двух направлений».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βακχίδης
  choice: Вакхид
  rationale: Устоявшаяся русская передача имени Bacchides в традиции переводов 1 Маккавейской.
- source_word: ἐν τῷ δεξιᾷ κέρατι
  choice: на правом крыле
  rationale: κέρας буквально означает «рог», но в военном контексте обозначает крыло или фланг построения; «правое крыло» естественно и точно передаёт этот термин.
- source_word: ἤγγισεν
  choice: приблизилась
  rationale: Аорист ἐγγίζω обозначает приближение; нейтральное «приблизилась» ясно передаёт движение к столкновению.
- source_word: ἡ φάλαγξ
  choice: фаланга
  rationale: Сохранён конкретный военный термин и образ организованного боевого строя.
- source_word: ἐκ τῶν δύο μερῶν
  choice: с обеих сторон
  rationale: Естественная русская передача движения с двух сторон или направлений без уточнения не выраженной в греческом тактики.
- source_word: ἐφώνουν ταῖς σάλπιγξιν
  choice: они трубили в трубы
  rationale: Имперфект передан формой несовершенного вида, сохраняющей длительность или фоновый характер звучания боевых труб.
- source_word: οἱ παρὰ Ἰούδαν
  choice: те, кто был с Иудой
  rationale: Передаёт людей, находившихся при Иуде или на его стороне, не сужая выражение до более конкретного «воины Иуды».
- source_word: ἐσάλπισαν
  choice: затрубили в трубы
  rationale: Совершенный вид передаёт аорист и сохраняет аспектуальный контраст с предшествующим «трубили».
- source_word: καὶ αὐτοὶ
  choice: тоже
  rationale: Передаёт усиленное указание на то, что люди Иуды ответили тем же действием; отдельное «сами» по-русски создавало бы не предусмотренное контекстом противопоставление.
