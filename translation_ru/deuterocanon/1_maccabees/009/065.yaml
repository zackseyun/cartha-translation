translation:
  language: ru
  text: И Ионафан оставил своего брата Симона в городе, а сам вышел в окрестности и пришёл с группой людей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «пришёл с числом». Выражение эллиптично; вероятно, имеется в виду группа людей или отряд, но её численность и характер не уточняются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  choice: оставил
  rationale: Аорист ἀπολείπω обозначает, что Ионафан оставил Симона в городе, тогда как сам отправился оттуда; «оставил» естественно передаёт это действие.
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: своего брата Симона
  rationale: Русский порядок слов естественно передаёт приложение и однозначно относит родство к Ионафану.
- source_word: ἐν τῇ πόλει
  choice: в городе
  rationale: Стандартное значение πόλις; оно также поддерживает пространственное противопоставление дальнейшему выходу за город.
- source_word: ἐξῆλθεν εἰς τὴν χώραν
  choice: вышел в окрестности
  rationale: χώρα здесь обозначает местность вне города. «В окрестности» естественно выражает контраст с городом, не уточняя без основания, была ли это сельская местность или более обширная область.
- source_word: ἦλθεν ἀρίθμῳ
  choice: пришёл с некоторым числом людей
  rationale: 'Греческое выражение эллиптично: буквально говорится о приходе «с числом», причём из военного контекста подразумеваются люди. Перевод сохраняет неопределённость относительно размера и характера группы.'
