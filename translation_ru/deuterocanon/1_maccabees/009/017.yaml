lexical_decisions:
- source_word: ἐβαρύνθη
  choice: становилась всё ожесточённее
  rationale: Буквально глагол передаёт утяжеление, но в контексте битвы означает, что сражение усиливалось и становилось суровее. Русское выражение естественно передаёт контекстуальный смысл.
- source_word: ὁ πόλεμος
  choice: битва
  rationale: Хотя πόλεμος может означать «война», здесь речь идёт о конкретном сражении.
- source_word: ἔπεσαν τραυματίαι
  choice: падали ранеными
  rationale: Перевод сохраняет как глагол «падать», так и прямое указание на раненых, не превращая их без основания в погибших.
- source_word: πολλοὶ
  choice: многие
  rationale: Прямой и естественный количественный эквивалент.
- source_word: ἐκ τούτων καὶ ἐκ τούτων
  choice: с обеих сторон
  rationale: Греческое симметричное выражение буквально означает «из этих и из тех» и идиоматически указывает на обе противоборствующие стороны.
