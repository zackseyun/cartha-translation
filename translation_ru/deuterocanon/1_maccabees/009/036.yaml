  text: And the sons of Jambri came out from Medaba[a], and they seized John and everything he had, and went away with them.
translation:
  language: ru
  text: И вышли сыновья Ямври из Медавы, схватили Иоанна и всё, что у него было, и ушли, забрав с собой Иоанна и всё, что у него было[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ушли, имея [при себе]». Греческий оборот эллиптичен и относится к Иоанну и ко всему, что у него было.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰαμβρεὶ
  choice: сыновья Ямври
  rationale: Сохраняется буквальное обозначение «сыновья», которое в контексте может относиться также к членам рода или дома; имя передано транслитерацией с греческого.
- source_word: ἐκ Μηδαβά
  choice: из Медавы
  rationale: Предлог ἐκ обозначает движение из какого-либо места; «из Медавы» естественно передаёт это значение по-русски.
- source_word: συνέλαβον
  choice: схватили
  rationale: Глагол обозначает насильственный захват; «схватили» передаёт враждебный характер действия, не добавляя судебного оттенка слова «арестовали».
- source_word: Ἰωάνην
  choice: Иоанна
  rationale: Использована традиционная русская передача греческого имени Ἰωάνης.
- source_word: πάντα ὅσα εἶχεν
  choice: всё, что у него было
  rationale: Формулировка сохраняет всеохватность πάντα и относительную конструкцию ὅσα εἶχεν, оставаясь естественной для современного русского языка.
- source_word: ἀπῆλθον ἔχοντες
  choice: ушли, забрав всё это с собой
  rationale: Греческий оборот буквально означает «ушли, имея [при себе]» и отсылает к ранее названным Иоанну и всему, что у него было. Русская формулировка передаёт унесение добычи и удержание пленника, не перегружая фразу повтором.
