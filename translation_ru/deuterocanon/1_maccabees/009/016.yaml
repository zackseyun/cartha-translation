  text: And those on the left wing[a], seeing that the right wing had been crushed, turned back at the heels of Judas and those with him[b], from behind.
translation:
  language: ru
  text: А те, кто был на левом крыле[a], увидев, что правое крыло разбито, повернули и с тыла пошли по пятам Иуды и тех, кто был с ним[b].
