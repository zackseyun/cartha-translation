    text: 'Буквально: «на левом роге» и далее «правый рог»; в греческой военной речи «рог» означает крыло или фланг войска.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «повернули по пятам Иуды и тех, кто был с ним, сзади»; это выражение описывает тесное преследование с тыла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριστερὸν κέρας / δεξιὸν κέρας
  choice: левое крыло / правое крыло
  rationale: Буквально κέρας означает «рог», но здесь это греческое военное обозначение крыла войска. «Крыло» естественно и точно передаёт смысл парных выражений.
- source_word: συνετρίβη
  choice: разбито
  rationale: Сохраняет сильное значение пассивной формы — «было сломлено, сокрушено», — не вводя более специального и толковательного «обращено в бегство».
- source_word: ἐπέστρεψαν
  choice: повернули
  rationale: Передаёт перемену направления движения в бою, не уточняя сверх текста, повернули ли воины назад или развернулись в сторону Иуды.
- source_word: κατὰ πόδας ... ἐκ τῶν ὄπισθεν
  choice: с тыла пошли по пятам
  rationale: Сочетает образ греческой идиомы «по пятам» с явно указанным движением или преследованием сзади; по-русски звучит естественно и сохраняет близость преследователей.
- source_word: τῶν μετʼ αὐτοῦ
  choice: тех, кто был с ним
  rationale: Не сужает широкое обозначение спутников Иуды до «его воинов», хотя в контексте речь идёт о сражении.
