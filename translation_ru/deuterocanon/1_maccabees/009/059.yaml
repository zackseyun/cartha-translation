lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет лаконичную последовательность повествования.
- source_word: πορευθέντες
  choice: придя
  rationale: Аористное причастие обозначает действие, предшествующее основному; «придя» естественно передаёт движение к подразумеваемому месту или лицу, не утяжеляя фразу.
- source_word: συνεβουλεύσαντο
  choice: стали советоваться
  rationale: Средний залог передаёт совместное участие в совещании; «советоваться» естественно сочетается в русском языке с указанием собеседника.
- source_word: αὐτῷ
  choice: с ним
  rationale: Дательный падеж при συνεβουλεύσαντο указывает на лицо, с которым держали совет.
