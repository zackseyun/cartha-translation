lexical_decisions:
- source_word: ἐλθὼν
  choice: он пришёл
  rationale: Аористное причастие вводит следующее последовательное действие; личная форма естественно передаёт греческое повествование по-русски.
- source_word: παρεβάλεν ἐπὶ
  choice: расположился станом против
  rationale: Военный оборот означает разбить лагерь или расположиться против укреплённого места; формулировка не подменяет его более узким значением «осадил».
- source_word: Βεθβασί
  choice: Вефваси
  rationale: Название места передано традиционной русской библейской транслитерацией с учётом греческой формы.
- source_word: ἐπολέμησεν αὐτὴν
  choice: сражался против неё
  rationale: Сохраняет значение ведения боевых действий и грамматическое соотнесение названия поселения с женским родом.
- source_word: ἡμέρας πολλὰς
  choice: много дней
  rationale: Естественно передаёт винительный длительности.
- source_word: ἐποίησεν μηχανάς
  choice: соорудил осадные машины
  rationale: В данном военном контексте μηχαναί обозначает устройства, применяемые при осаде; «соорудил» передаёт изготовление или устройство таких средств.
