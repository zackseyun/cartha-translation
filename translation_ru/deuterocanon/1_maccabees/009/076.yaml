lexical_decisions:
- source_word: φοβηθέντες
  choice: испугавшись
  rationale: Аористное причастие передаёт действие, побудившее жителей открыть город; деепричастие естественно выражает эту причинно-временную связь по-русски.
- source_word: ἤνοιξαν
  choice: открыли
  rationale: В греческом тексте прямое дополнение не названо. Перевод сохраняет эту недосказанность, не добавляя в основной текст «ворота».
- source_word: οἱ ἐκ τῆς πόλεως
  choice: жители города
  rationale: Субстантивированное выражение обозначает людей, находившихся в городе или принадлежавших к нему; «жители города» звучит естественно и не добавляет указания на пол или воинский статус.
- source_word: ἐκυρίευσεν
  choice: овладел
  rationale: Глагол κυριεύω здесь означает установление власти или контроля над городом; «овладел» точно и естественно передаёт военный контекст.
- source_word: Ἰόππης
  choice: Иоппией
  rationale: «Иоппия» — традиционная русская форма названия города; творительный падеж обусловлен управлением глагола «овладел».
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямой эквивалент аориста ἀκούω; он не уточняет содержание услышанного и позволяет сохранить обрыв фразы в данном свидетельстве.
