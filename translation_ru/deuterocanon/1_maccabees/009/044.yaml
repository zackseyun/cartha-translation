  yaml_path: translation/deuterocanon/1_maccabees/009/044.yaml
  text: And Jonathan said to his brothers[a], “Let us rise now and fight for our lives, for today is not as yesterday and the day before.”
translation:
  language: ru
  text: 'И сказал Ионафан своим братьям: «Встанем же теперь и будем сражаться за наши жизни, ибо сегодня не так, как вчера и позавчера».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστῶμεν
  choice: Встанем же
  rationale: Аористный конъюнктив имеет побудительное значение. «Встанем же» естественно передаёт призыв и военную решимость; частица «же» выражает настоятельность, подразумеваемую νῦν, без тяжеловесного «теперь».
- source_word: πολεμήσωμεν
  choice: будем сражаться
  rationale: Глагол обозначает вступление в бой; «будем сражаться» естественно сочетается с побудительным «встанем» и сохраняет длительную перспективу борьбы.
- source_word: ὑπὲρ τῶν ψυχῶν ἡμῶν
  choice: за нашу жизнь
  rationale: В контексте непосредственной угрозы ψυχαί означает жизнь как предмет защиты, а не нематериальные души. Русское единственное число в выражении «за нашу жизнь» естественно обозначает общую борьбу за выживание.
- source_word: ἀδελφοῖς αὐτοῦ
  choice: своим братьям
  rationale: Сохранено прямое родственное обозначение греческого текста без расширения до «соратников» или «соплеменников».
- source_word: οὐ γάρ ἐστιν σήμερον ὡς ἐχθὲς καὶ τρίτην ἡμέραν
  choice: потому что сегодня всё не так, как вчера и позавчера
  rationale: Оборот «вчера и третий день» идиоматически указывает на два предшествующих дня. «Вчера и позавчера» ясно и естественно передаёт смысл; «всё» по-русски делает эллиптическое сравнение полноценным, не уточняя, что именно изменилось.
