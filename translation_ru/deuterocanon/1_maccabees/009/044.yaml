  source_fidelity: 'В черновике верно переданы обращение Ионафана к братьям, побудительный призыв, значение ψυχαί как «жизни» и временная идиома «вчера и позавчера». Однако νῦν («теперь, сейчас») не следует заменять одной лишь частицей «же»: она усиливает призыв, но не выражает временного значения. «Всё не так» несколько расширяет исходную эллиптическую формулу.'
