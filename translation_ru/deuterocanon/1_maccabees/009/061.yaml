  yaml_path: translation/deuterocanon/1_maccabees/009/061.yaml
  text: And they seized from the men of the country fifty men who were leaders of wickedness[a], and he killed them.
translation:
  language: ru
  text: И они схватили пятьдесят человек из жителей той земли — предводителей зла[a], — и он убил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «предводителей зла»; выражение может означать руководителей злых дел или главных злодеев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέλαβον
  choice: схватили
  rationale: Передаёт насильственное взятие людей под стражу, не привнося подразумеваемой словом «арестовали» официальной судебной процедуры.
- source_word: ἀπὸ τῶν ἀνδρῶν τῆς χώρας
  choice: из жителей той земли
  rationale: Предлог ἀπό указывает на выбор людей из более широкой группы; «жители той земли» естественно передаёт местную принадлежность и избегает неестественного буквального оборота «из мужчин земли».
- source_word: τῶν ἀρχηγῶν τῆς κακίας
  choice: предводителей зла
  rationale: '«Предводители» передаёт ведущую роль, а «зла» сохраняет широкий смысл κακία и неоднозначность сочетания: это могут быть руководители злых дел либо главные злодеи.'
- source_word: εἰς πεντήκοντα ἄνδρας
  choice: пятьдесят человек
  rationale: Оборот указывает на число схваченных; по-русски числительное естественно передаётся без отдельного выражения εἰς.
- source_word: ἀπέκτεινεν
  choice: убил
  rationale: Сохраняет основное значение глагола и не привносит судебного оттенка, который возник бы при переводе «казнил».
theological_decisions:
- issue: Переход от множественного числа к единственному в последней части стиха
  choice: 'Сохранено: «они схватили… и он убил их»'
  alternative: 'Согласовать во множественном числе: «и они убили их»'
  rationale: В греческом тексте явно употреблены сначала множественное συνέλαβον, затем единственное ἀπέκτεινεν. Перевод сохраняет эту грамматическую напряжённость и не уточняет без основания, к кому относится «он».
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным и достойным звучанием. Тире выделяют приложение и делают синтаксические связи ясными; смена числа у сказуемых намеренно сохранена.
