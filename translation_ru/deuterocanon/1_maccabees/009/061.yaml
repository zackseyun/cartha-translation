  source_fidelity: 'Текст точно передаёт греческую конструкцию: отбор пятидесяти человек из местного населения, характеристику их как ἀρχηγοὶ τῆς κακίας и намеренную смену числа между «они схватили» и «он убил». «Жители той земли» естественно выражает τῶν ἀνδρῶν τῆς χώρας в русском контексте, не вводя существенного дополнительного смысла.'
