  verdict: revise
  source_fidelity: В исходном греческом τελευτάя клауза сохраняет невыраженный субъект («они») и содержит ἐπ’ αὐτούς — направленность «против них / на них». Вариант «преследователи ... вслед за ними» чрезмерно конкретизирует и субъект, и характер движения. Кроме того, единственное число ἐνεπήδησεν непосредственно относится к Ионафану, тогда как далее стоит множественное число («они переплыли»).
  naturalness: Предлагаемая редакция естественна для современного литературного русского и ясно отражает переход от действия Ионафана к совместному действию группы. Указательное «те» в последней части сохраняет исходную неуточнённость субъекта без искусственного введения «преследователей».
  terminology: «Ионафан» и «Иордан» переданы нормативно. «Прыгнул в Иордан» воспроизводит внезапное движение ἐνεπήδησεν; «переплыли на другой берег» точно передаёт διεκολύμβησαν εἰς τὸ πέραν. «Против них» сохраняет направленно-враждебный оттенок ἐπί с винительным, не навязывая конкретного мотива.
