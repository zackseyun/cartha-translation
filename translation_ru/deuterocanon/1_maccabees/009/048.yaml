    rationale: Греческий текст в этом стихе употребляет лишь «они»; хотя контекст может указывать на противников Ионафана, слово «преследователи» является дополнительной интерпретацией.
  - severity: medium
    issue: «Вслед за ними» заменяет значение ἐπ’ αὐτούς.
    rationale: Этот вариант возможен контекстуально, но не передаёт прямо выраженную направленность «против/на них» и сужает смысл до преследования.
  - severity: low
