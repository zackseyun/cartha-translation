  yaml_path: translation/deuterocanon/1_maccabees/009/048.yaml
  text: And Jonathan and those with him jumped into the Jordan and swam across to the other side[a], and they did not cross the Jordan after them.
translation:
  language: ru
  text: Ионафан прыгнул в Иордан вместе с теми, кто был с ним, и они переплыли на другой берег; те не перешли Иордан против них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не перешли Иордан вслед за ними» или «чтобы напасть на них». Греческий оборот сжат: он указывает на движение против Ионафана и его людей, но не уточняет его цель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεπήδησεν
  choice: бросились в
  rationale: Глагол передаёт резкий прыжок или стремительное движение в воду. В русском множественное число согласуется с составным подлежащим «Ионафан и те, кто был с ним»; «бросились в» звучит естественно и сохраняет внезапность действия.
- source_word: οἱ μετ᾿ αὐτοῦ
  choice: те, кто был с ним
  rationale: Нейтрально передаёт широкое значение оборота, не добавляя отсутствующего в греческом уточнения «воины» или «мужчины».
- source_word: διεκολύμβησαν
  choice: переплыли
  rationale: Сложный глагол обозначает пересечение водной преграды вплавь; русский глагол кратко и точно передаёт и способ, и завершённость движения.
- source_word: εἰς τὸ πέραν
  choice: на другой берег
  rationale: В контексте реки оборот естественно означает противоположный берег; этот вариант конкретнее и идиоматичнее буквального «на другую сторону».
- source_word: οὐ διέβησαν ἐπ᾿ αὐτοὺς τὸν Ἰορδάνην
  choice: преследователи не перешли Иордан вслед за ними
  rationale: Субъект восстанавливается из предшествующего контекста. ἐπί с винительным допускает направленное, в том числе враждебное, движение; «вслед за ними» естественно выражает преследование, не утверждая прямо, что нападение состоялось.
- source_word: Ἰορδάνην
  choice: Иордан
  rationale: Устоявшееся русское название реки; добавление слова «река» не требуется.
