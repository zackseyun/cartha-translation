base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/023.yaml
  text: And it happened that after the death of Judas[a], the lawless emerged in all the territories of Israel[b], and all those who worked unrighteousness sprang up.
translation:
  language: ru
  text: 'И случилось после смерти Иуды: во всех областях Израиля объявились беззаконники, и поднялись все, кто творил неправду[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершал несправедливость».'
    reason: Греческое ἀδικία может обозначать как неправедность вообще, так и несправедливость.
lexical_decisions:
- source_word: ἐγένετο
  choice: случилось
  rationale: Передаёт обычную повествовательную формулу естественным современным русским языком без архаического «было».
- source_word: τελευτὴν
  choice: смерти
  rationale: В данном контексте обозначает смерть Иуды, а не отвлечённый «конец».
- source_word: ἐξέκυψαν
  choice: объявились
  rationale: Глагол описывает внезапное появление или выход наружу; «объявились» естественно передаёт, что беззаконники стали действовать открыто.
- source_word: οἱ ἄνομοι
  choice: беззаконники
  rationale: Сохраняет субстантивированное значение и связь с понятием закона, не сводя выражение к общему «злодеи».
- source_word: ἐν πᾶσιν τοῖς ὁρίοις Ἰσραήλ
  choice: во всех областях Израиля
  rationale: Здесь ὅρια обозначает всю совокупность территорий или местностей Израиля, а не только пограничные линии.
- source_word: ἀνέτειλαν
  choice: повсюду поднялись
  rationale: Сохраняет образ появления и разрастания, присущий глаголу, а добавленное «повсюду» естественно передаёт всеобщий охват πάντες в контексте.
- source_word: οἱ ἐργαζόμενοι τὴν ἀδικίαν
  choice: все, кто творил неправду
  rationale: «Творить неправду» — естественное и вместе с тем библейски весомое русское выражение; форма «творил» передаёт устойчивую деятельность.
theological_decisions:
- issue: Передача нравственно и заветно окрашенных понятий ἄνομοι и ἀδικία
  choice: «беззаконники» и «творил неправду»
  alternative: «нечестивые» и «совершал несправедливость»
  rationale: Выбранные слова сохраняют связь ἄνομοι с законом и передают ἀδικία как широкое нравственное зло, не ограничивая его судебной или общественной несправедливостью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Двоеточие после вводной повествовательной формулы делает длинное греческое предложение ясным, не меняя его логики.
