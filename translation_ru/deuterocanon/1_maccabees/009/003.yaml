  rationale: Военный контекст глагола сохраняется; выражение звучит естественно в современном литературном русском языке.
- source_word: εἰς Ἱερουσαλήμ
  choice: в Иерусалиме
  rationale: После глагола расположения лагерем оборот естественно передаёт достигнутое местонахождение; направительное значение предлога εἰς отмечено в сноске.
