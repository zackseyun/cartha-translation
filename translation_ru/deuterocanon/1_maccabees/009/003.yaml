- source_word: τοῦ μηνὸς τοῦ πρώτου
  choice: в первый месяц
  rationale: Родительный падеж имеет временное значение; русское «в первый месяц» естественно и точно передаёт указание времени.
- source_word: ἔτους δευτέρου καὶ πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: сто пятьдесят второго года
