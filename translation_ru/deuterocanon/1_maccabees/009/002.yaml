  text: And they traveled on the road to Galgala[a], and encamped against Mesaloth in Arbela, and captured it[b], and destroyed many people.
translation:
  language: ru
  text: И они пошли по дороге к Галгале и расположились лагерем против Мессалота, что в Арбелах; они захватили его[a] и погубили множество людей.
