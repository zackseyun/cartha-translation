    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: пошли
  rationale: Аорист πορεύομαι обозначает движение или путь; «пошли» естественно звучит по-русски и не уточняет без достаточных оснований, был ли это именно военный марш.
- source_word: ὁδὸν τὴν εἰς Γάλγαλα
  choice: по дороге к Галгале
  rationale: Сохраняет конкретный образ пути и направление движения, выраженные конструкцией с ὁδόν.
- source_word: παρενέβαλον ἐπὶ
  choice: расположились лагерем против
  rationale: В военном контексте παρεμβάλλω означает разбить или расположить лагерь; ἐπί здесь указывает на враждебное расположение у цели.
- source_word: Μεσσαλὼθ τὴν ἐν Ἀρβήλοις
  choice: Мессалота, что в Арбелах
  rationale: Определительный оборот связывает Мессалот с местностью Арбелы; множественное «в Арбелах» отражает греческое ἐν Ἀρβήλοις.
- source_word: προκατελίβοντο
  choice: захватили его
  rationale: Редкий и трудный глагол в данном контексте обозначает овладение укреплённым местом; естественное «захватили» передаёт основной смысл, а возможный оттенок упреждения отмечен в сноске.
- source_word: ἀπώλεσεν ψυχὰς ἀνθρώπων πολλὰς
  choice: погубили множество людей
  rationale: Буквально речь идёт о погублении многих человеческих жизней. Русское выражение ясно передаёт смертельный исход и естественно воспроизводит греческую идиому.
