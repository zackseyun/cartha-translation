translation:
  language: ru
  text: Вакхид узнал об этом, собрал все свои силы[a] и отдал приказ людям из Иудеи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё своё множество»; в данном контексте, вероятно, имеются в виду все находившиеся под его началом воины или сторонники.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «тем, кто находился в Иудее». Греческое выражение буквально означает «тем, кто из Иудеи» и может указывать на происхождение или принадлежность, а не только на местонахождение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: узнал об этом
  rationale: Аорист γινώσκω в повествовательной последовательности означает, что Вакхид получил сведения о случившемся; «узнал об этом» естественно передаёт наступление знания.
- source_word: συνήγαγεν
  choice: собрал
  rationale: Глагол обозначает сведение людей вместе для совместного действия; в военном контексте «собрал» звучит естественно.
- source_word: πᾶν τὸ πλῆθος αὐτοῦ
  choice: все свои силы
  rationale: Буквально выражение означает «всё своё множество», но в данном военном контексте речь идёт о всей совокупности подчинённых ему воинов или сторонников.
- source_word: τοῖς ἐκ τῆς Ἰουδαίας
  choice: тем, кто был из Иудеи
  rationale: 'Предлог ἐκ прежде всего указывает на происхождение или принадлежность: «из Иудеи». Добавление «был» делает русскую фразу плавной, не превращая её в чисто местное «находившимся в Иудее».'
- source_word: παρήγγειλεν
  choice: отдал приказ
  rationale: Глагол означает дать распоряжение или приказ; единственное число соответствует греческой форме и естественно в данном контексте.
