translation:
  language: ru
  text: И содрогнулась земля под живущими на ней[a], и весь дом Иакова облёкся в стыд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страна содрогнулась». Греческое γῆ может означать как «землю», так и «страну, землю народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσείσθη
  choice: содрогнулась
  rationale: Аорист пассивного σείω описывает сотрясение или дрожь. «Содрогнулась» естественно в возвышенной повествовательной речи и не решает однозначно, буквально ли это землетрясение или образ потрясения.
- source_word: ἡ γῆ
  choice: земля
  rationale: Русское «земля», как и греческое γῆ, может обозначать и землю вообще, и определённую страну/землю, поэтому сохраняет исходную неоднозначность.
- source_word: ἐπὶ τοὺς κατοικοῦντας αὐτήν
  choice: под живущими на ней
  rationale: 'Оборот передаёт пространственный образ: земля содрогается под теми, кто на ней живёт. Это естественнее по-русски, чем буквальное «над живущими», и не придаёт ἐπί неоправданно враждебного смысла.'
- source_word: πᾶς ὁ οἶκος Ἰακώβ
  choice: весь дом Иакова
  rationale: Сохранена традиционная библейская формула, обозначающая народ Иакова, без поясняющей замены на «весь Израиль».
- source_word: ἐνεδύσατο
  choice: облёкся
  rationale: Средний залог ἐνδύω буквально выражает облачение себя во что-либо. «Облёкся» сохраняет поэтическую метафору и согласуется с собирательным единственным числом «дом».
- source_word: αἰσχύνην
  choice: стыд
  rationale: «Стыд» прямо передаёт αἰσχύνη и допускает как внутреннее переживание, так и публичное посрамление.
theological_decisions:
- issue: Широкое или локальное значение γῆ
  choice: земля
  alternative: страна; та земля
  rationale: Выбор «земля» сохраняет присущую греческому слову неоднозначность и широкий размах плачевой речи; сноска отмечает возможное локальное понимание.
- issue: Сохранение метафоры ἐνεδύσατο αἰσχύνην
  choice: облёкся в стыд
  alternative: покрылся стыдом; был посрамлён
  rationale: В греческом явно присутствует образ одежды. Его сохранение передаёт поэтическую и богословски нейтральную силу текста, не сводя выражение только к чувству или только к общественному бесчестью.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формулы «дом Иакова» и «облёкся в стыд» сохранены ради образности и межтекстового библейского оттенка; синтаксис остаётся понятным современному читателю.
