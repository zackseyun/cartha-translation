  source_fidelity: Греческое πένθος μέγα означает великую скорбь/траур; ἐπὶ Ἰσραήλ передаёт скорбь, постигшую Израиль, а ἐν παντὶ τόπῳ αὐτῶν — её распространённость по всем «их местам». Черновой вариант в целом передаёт общий смысл, но «повсюду, где жили израильтяне» сужает исходную формулировку, которая может включать и места, принадлежавшие народу, а не только населённые им.
  naturalness: «Великий траур охватил Израиль во всех его местах» — естественный современный литературный русский с умеренно библейским регистром. Он точнее, чем «великий плач», передаёт общественную скорбь πένθος и не требует пояснительного придаточного в основном тексте.
