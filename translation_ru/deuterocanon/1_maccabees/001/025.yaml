lexical_decisions:
- source_word: ἐγένετο
  choice: охватил
  rationale: В сочетании с πένθος и ἐπί глагольная конструкция естественно передаётся по-русски как наступление и распространение плача; «охватил» сохраняет направленность бедствия на Израиль.
- source_word: πένθος μέγα
  choice: великий плач
  rationale: πένθος обозначает скорбь и общественный траур. «Великий плач» сохраняет общинный характер скорби и соответствует возвышенному повествовательному регистру, оставаясь понятным современному читателю.
- source_word: ἐπὶ Ἰσραήλ
  choice: охватил Израиль
  rationale: Такой оборот передаёт смысл скорби, постигшей Израиль, естественнее буквального «на Израиле» и не сводит конструкцию лишь к указанию места.
- source_word: ἐν παντὶ τόπῳ αὐτῶν
  choice: повсюду, где жили израильтяне
  rationale: Греческая фраза имеет распределительный смысл и указывает на все места, принадлежавшие народу или населённые им. Перевод ясно передаёт распространённость плача, а буквальная форма отмечена в сноске.
