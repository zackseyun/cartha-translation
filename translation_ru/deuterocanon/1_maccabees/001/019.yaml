translation:
  language: ru
  text: Они захватили укреплённые города в земле Египта, а он взял добычу земли Египта.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάβοντο
  choice: захватили
  rationale: Аорист среднего залога от καταλαμβάνω в военном контексте означает овладение городами силой; «захватили» естественно и точно передаёт этот смысл.
- source_word: τὰς πόλεις τὰς ὀχυράς
  choice: укреплённые города
  rationale: ὀχυράς указывает на оборонительную укреплённость городов; сочетание «укреплённые города» является обычным современным русским выражением.
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: в земле Египетской
  rationale: Сохраняется географическая формула греческого текста и достойный повествовательный регистр без смыслового расширения.
- source_word: ἔλαβεν
  choice: он взял
  rationale: Единственное число передано явно, чтобы сохранить смену грамматического числа между двумя частями стиха.
- source_word: τὰ σκῦλα
  choice: добычу
  rationale: В данном военном контексте σκῦλα означает имущество, захваченное у противника; «добыча» ясно и естественно передаёт это значение.
theological_decisions:
- issue: Переход от множественного числа κατελάβοντο к единственному ἔλαβεν
  choice: 'Сохранить переход: «они захватили… а он взял»'
  alternative: 'Согласовать обе части по числу: «они захватили… и взяли» либо «он захватил… и взял»'
  rationale: Греческий источник намеренно или по меньшей мере явно меняет число сказуемого. Перевод сохраняет эту особенность и не устраняет возможное различие между действиями войска и царя.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Союз «а» ясно обозначает смену подлежащего, не добавляя причинного или богословского толкования.
