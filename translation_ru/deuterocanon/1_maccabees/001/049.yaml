translation:
  language: ru
  text: чтобы они забыли Закон и изменили все установления.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαθέσθαι
  choice: забыли
  rationale: Точно передаёт аористный инфинитив со значением «забыть»; в конструкции цели естественна русская форма с «чтобы».
- source_word: τοῦ νόμου
  choice: Закон
  rationale: Речь идёт о Законе как о религиозно-нормативной реальности Израиля; прописная буква ясно передаёт это значение.
- source_word: ἀλλάξαι
  choice: изменили
  rationale: Передаёт намеренное изменение существующих предписаний, не усиливая значение до «отменили» или «заменили».
- source_word: πάντα τὰ δικαιώματα
  choice: все установления
  rationale: «Установления» естественно и достаточно широко передаёт δικαιώματα как обязательные предписания Закона.
theological_decisions:
- issue: Характер воздействия на установления Закона
  choice: изменили
  alternative: отменили / заменили
  rationale: Греческое ἀλλάξαι означает «изменить»; более сильные варианты сузили бы или усилили смысл без достаточного основания.
translation_notes:
  register: Современный литературный русский язык; краткая и dignified формулировка сохраняет целевую связь с предыдущим контекстом и параллелизм двух инфинитивов.
