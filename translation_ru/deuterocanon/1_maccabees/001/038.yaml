  yaml_path: translation/deuterocanon/1_maccabees/001/038.yaml
  text: And the inhabitants of Jerusalem fled because of them[a], and she became a dwelling place of foreigners; she became foreign to her offspring, and her children abandoned her.
translation:
  language: ru
  text: И жители Иерусалима бежали из-за них, и город стал жилищем чужеземцев; он стал чужим для своих потомков[a], и дети его покинули его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для своих плодов». Греческое слово может обозначать как потомство, так и то, что произведено или выращено; ближайшая параллель — «дети его» — говорит в пользу значения «потомки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγον
  choice: бежали
  rationale: Передаёт вынужденное бегство кратко и естественно, не ослабляя смысла до простого ухода.
- source_word: οἱ κάτοικοι
  choice: жители
  rationale: Обычное современное обозначение людей, живущих в Иерусалиме; соответствует историческому повествованию.
- source_word: διʼ αὐτούς
  choice: из-за них
  rationale: 'Передаёт причинное значение διά с винительным падежом: жители бежали вследствие действий упомянутых прежде притеснителей.'
- source_word: κατοικία ἀλλοτρίων
  choice: жилищем чужеземцев
  rationale: Сохраняет конкретный образ города, занятого чужими, и звучит естественно в современном литературном русском языке.
- source_word: ἐγένετο ἀλλοτρία
  choice: стал чужим
  rationale: Сохраняет смысл отчуждения и лексическую перекличку с «чужеземцами» в предыдущей части.
- source_word: τοῖς γενήμασιν αὐτῆς
  choice: для своих потомков
  rationale: γενήματα допускает значения потомства и произведённого плодородия; параллель с последующим «дети» делает значение «потомки» наиболее вероятным, при этом альтернатива отмечена в сноске.
- source_word: τὰ τέκνα αὐτῆς
  choice: дети его
  rationale: τέκνα обозначает детей без ограничения по полу и продолжает семейный образ жителей как детей города.
- source_word: ἐγκατέλειπον
  choice: покинули
  rationale: Передаёт оставление города его детьми в ясной современной форме; контекст сохраняет оттенок запустения.
theological_decisions:
- issue: Олицетворение Иерусалима и грамматический род
  choice: Сохранить олицетворение через упоминание потомков и детей, но согласовать местоимения с русским мужским родом слова «город».
  alternative: Использовать женские местоимения «она/её», буквально отражая женский род греческих форм.
  rationale: В греческом женские формы относятся к олицетворённому Иерусалиму, однако в русском «Иерусалим» и «город» мужского рода. Женское согласование было бы грамматически неестественным. Семейный и эмоциональный образ сохраняется словами «потомки» и «дети» без внесения нового обозначения города.
