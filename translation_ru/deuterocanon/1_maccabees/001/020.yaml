  yaml_path: translation/deuterocanon/1_maccabees/001/020.yaml
  text: And after striking Egypt[a], Antiochus returned in the one hundred forty-third year; and he went up against Israel and Jerusalem with a great multitude.
translation:
  language: ru
  text: После того как Антиох поразил Египет, он возвратился в сто сорок третьем году и выступил против Израиля и Иерусалима с многочисленным войском.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с тяжёлым множеством»; возможно также: «с мощной военной силой».'
    reason: Сноска поясняет необычное греческое выражение ἐν ὄχλῳ βαρεῖ, буквальный образ которого не воспроизводится в естественном русском варианте.
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: возвратился
  rationale: В данном повествовательном контексте аорист обозначает физическое возвращение Антиоха после египетского похода.
- source_word: μετὰ τὸ πατάξαι Αἴγυπτον
  choice: после того как … нанёс поражение Египту
  rationale: Оборот μετὰ τό с инфинитивом выражает последующее время; военный контекст позволяет естественно передать πατάσσω как «нанести поражение», не обязательно подразумевая полное завоевание.
- source_word: ἐν τῷ ἑκατοστῷ καὶ τεσσερακοστῷ καὶ τρίτῳ ἔτει
  choice: в сто сорок третьем году
  rationale: Сохранена формула датировки исходного текста без добавления не названной в стихе эры.
- source_word: ἀνέβη ἐπὶ Ἰσραὴλ καὶ Ἱεροσόλυμα
  choice: выступил против Израиля и Иерусалима
  rationale: В военном контексте ἐπί с винительным имеет враждебную направленность; «выступил против» естественно передаёт движение и намерение, тогда как буквальное «поднялся» по-русски здесь менее ясно.
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: с огромным войском
  rationale: ὄχλος обозначает здесь не просто толпу, а массу воинов, а βαρεῖ подчёркивает её значительность и мощь. Русское «огромное войско» передаёт смысл естественно и сохраняет масштаб выражения.
