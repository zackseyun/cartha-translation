  text: И он увёл в плен женщин и детей, а скот они забрали как добычу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они завладели скотом» или «они унаследовали скот». Греческий глагол обычно означает получение чего-либо во владение, нередко по наследству, но здесь, в контексте завоевания, речь идёт о скоте, забранном как добыча.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐχμαλώτευσεν
  choice: увели ... в плен
  rationale: Глагол обозначает захват в качестве военнопленных или увод в плен; выражение сохраняет принудительный военный характер действия. Хотя в греческом стоит единственное число, по контексту действующее лицо — собирательная вражеская сила, поэтому по-русски естественно множественное «они».
- source_word: τὰς γυναῖκας
  choice: женщин
  rationale: γυνή может означать и «женщина», и «жена», но в перечислении жертв наряду с детьми здесь уместно общее значение «женщины».
- source_word: τὰ τέκνα
  choice: детей
  rationale: τέκνα — общее обозначение детей без ограничения по полу.
- source_word: τὰ κτήνη
  choice: скот
  rationale: κτήνη обозначает домашних хозяйственных животных; современное русское «скот» точно и естественно передаёт это значение.
- source_word: ἐκληρονόμησαν
  choice: забрали как добычу
  rationale: Обычное значение глагола связано с наследованием или вступлением во владение, однако в контексте завоевания он означает присвоение скота победителями. Перевод передаёт контекстуальный смысл, а примечание сохраняет необычную лексику оригинала.
