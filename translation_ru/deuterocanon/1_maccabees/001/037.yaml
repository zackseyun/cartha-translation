  text: And they poured out innocent blood around the sanctuary, and they defiled the sanctuary.
translation:
  language: ru
  text: И пролили невинную кровь вокруг святилища, и осквернили святилище.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέχεαν
  choice: пролили
  rationale: В сочетании с «кровь» глагол естественно передаётся по-русски как «пролили»; при этом сохраняется конкретный и выразительный образ греческого текста.
- source_word: αἷμα ἀθῷον
  choice: невинную кровь
  rationale: Устойчивое библейское выражение, обозначающее кровь людей, не заслуживавших насильственной смерти.
- source_word: κύκλῳ
  choice: вокруг
  rationale: 'Точно и естественно передаёт пространственное значение: по окружности или в окрестности святилища.'
- source_word: τοῦ ἁγιάσματος / τὸ ἁγίασμα
  choice: святилища / святилище
  rationale: «Святилище» обозначает священное место и соответствует храмовому контексту; повтор одного и того же русского слова сохраняет риторический повтор греческого текста.
- source_word: ἐμόλυναν
  choice: осквернили
  rationale: Передаёт культовое и нравственное загрязнение священного места точнее, чем более бытовые варианты.
theological_decisions:
- issue: Культовое значение ἁγίασμα
  choice: святилище
  alternative: святое место; храмовое святилище
  rationale: Контекст указывает на священное пространство Иерусалимского храма. «Святилище» сохраняет культовый смысл, не уточняя объём понятия сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксический параллелизм и повтор слова «святилище» сохранены; дополнительных пояснений и конфессионально окрашенной терминологии нет.
