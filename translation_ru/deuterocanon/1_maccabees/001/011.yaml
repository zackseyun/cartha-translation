base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/011.yaml
  text: In those days lawless men came out from Israel and persuaded many[a], saying, “Let us go and make a covenant with the nations around us, because since we separated ourselves from them[c][b], many evils have found us.”
translation:
  language: ru
  text: 'В те дни из среды Израиля вышли беззаконники[a] и убедили многих, говоря: «Пойдём и заключим завет с окружающими нас народами, потому что с тех пор, как мы отделились от них[b], нас постигло много бед[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны беззакония», то есть люди, отличавшиеся беззаконием.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с тех пор, как мы были отделены от них». Греческую форму можно понимать и в более пассивном смысле.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «нас нашли многие беды», то есть нас постигли многочисленные несчастья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ Ἰσραὴλ
  choice: из среды Израиля вышли
  rationale: Сохраняет образ движения изнутри Израиля и естественно передаёт появление этой группы среди народа.
- source_word: υἱοὶ παράνομος
  choice: беззаконники
  rationale: Идиоматично обозначает людей, характеризующихся беззаконием; буквальный семейный оборот отмечен в сноске.
- source_word: ἀνέπεισαν πολλοὺς
  choice: убедили многих
  rationale: Прямо передаёт значение глагола, не добавляя лексически не выраженной идеи обмана.
- source_word: Πορευθῶμεν
  choice: Пойдём
  rationale: Естественная русская передача побудительного сослагательного наклонения первого лица множественного числа.
- source_word: διαθώμεθα διαθήκην
  choice: заключим завет
  rationale: Сохраняет ключевую библейскую терминологию и формальный характер предлагаемой связи.
- source_word: τῶν ἐθνῶν τῶν κύκλῳ ἡμῶν
  choice: с окружающими нас народами
  rationale: Передаёт соседние народы без привнесения более поздней новозаветной окраски слова «язычники».
- source_word: ἀφʼ ἧς ἐχωρίσθημεν ὑπʼ αὐτῶν
  choice: с тех пор, как мы отделились от них
  rationale: Естественно передаёт временное значение ἀφʼ ἧς и допустимое возвратное понимание пассивной формы; пассивная возможность сохранена в сноске.
- source_word: εὗρεν ἡμᾶς κακὰ πολλὰ
  choice: нас постигло много бед
  rationale: Естественно передаёт греческую идиому «многие беды нашли нас», где κακά означает бедствия или несчастья.
theological_decisions:
- issue: Заветная терминология в политически и религиозно напряжённом контексте
  choice: заключим завет
  alternative: заключим соглашение / союз
  rationale: διαθήκη — значимый библейский термин; «завет» сохраняет богословский вес намерения установить формальную связь с окружающими народами.
- issue: Кто выступил инициатором отделения Израиля от народов
  choice: мы отделились от них
  alternative: нас отделили от них
  rationale: Средне-пассивная форма допускает возвратное и пассивное понимание. В основном тексте выбран естественный возвратный вариант, а подлинная неоднозначность обозначена сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан понятным обычному читателю; ключевое слово «завет» сохранено, а буквальные семитизирующие обороты и грамматическая неоднозначность отражены в сносках.
