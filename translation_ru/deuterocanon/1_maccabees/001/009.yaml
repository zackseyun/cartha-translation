  yaml_path: translation/deuterocanon/1_maccabees/001/009.yaml
  text: And they all put on crowns after his death[a], and their sons after them for many years[b]; and they multiplied evils in the land.
translation:
  language: ru
  text: После его смерти все они надели диадемы[a], а после них их сыновья носили их ещё многие годы; и они умножили зло в стране[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царские венцы». Греческое слово обозначает диадемы — знаки царской власти.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «умножили нечестие»; возможно также: «умножили бедствия в стране». Греческое выражение может обозначать как нравственное зло, так и его пагубные последствия.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθεντο
  choice: возложили на себя
  rationale: Средний залог в сочетании с обозначением царской регалии передаёт сознательное принятие и ношение знака царской власти; выражение сохраняет конкретный образ греческого текста.
- source_word: διαδήματα
  choice: царские венцы
  rationale: Слово обозначает диадемы как особые знаки царской власти. «Царские венцы» понятно современному читателю и сохраняет царственный смысл; более точный термин приведён в сноске.
- source_word: μετὰ τὸ ἀποθανεῖν αὐτόν
  choice: после его смерти
  rationale: Конструкция с артиклевым инфинитивом указывает на время после смерти Александра; перевод краток и естественен.
- source_word: ὀπίσω αὐτῶν
  choice: вслед за ними
  rationale: В данном династическом контексте выражение обозначает преемство, а не пространственное положение.
- source_word: ἔτη πολλά
  choice: на протяжении многих лет
  rationale: Винительный длительности обозначает продолжительный период времени; выбранная формулировка естественна в современном русском языке.
- source_word: ἐπλήθυναν
  choice: умножили
  rationale: Глагол передаёт активное увеличение и сохраняет выразительность исходного текста.
- source_word: κακὰ
  choice: зло
  rationale: Собирательное «зло» сохраняет широту греческого множественного числа, которое может охватывать и нравственное зло, и причинённые бедствия.
- source_word: ἐν τῇ γῇ
  choice: на земле
  rationale: Формулировка естественна для библейского повествования и не сужает значение насильно до одной страны, хотя контекст допускает смысл «в стране».
theological_decisions:
- issue: Смысловой объём κακὰ
  choice: широкое «зло»
  alternative: «нечестие», «бедствия» или «несчастья»
  rationale: Греческое слово допускает как нравственный, так и событийно-пагубный смысл. Широкий перевод сохраняет эту напряжённость и не сводит оценку правителей только к одному аспекту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и образ принятия царских регалий сохранены; неоднозначность слова κακὰ не устранена.
