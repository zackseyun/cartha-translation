  yaml_path: translation/deuterocanon/1_maccabees/001/063.yaml
  text: And they chose to die[a], so that they might not be defiled by the foods and might not profane the holy covenant[b]; and they died.
translation:
  language: ru
  text: И они предпочли умереть, чтобы не оскверниться пищей[a] и не осквернить святой завет[b]; и умерли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «съестным» или «яствами»; здесь имеется в виду пища, употребление которой осквернило бы их согласно закону завета.'
    reason: lexical_alternative
  - marker: b
    text: Греческое выражение стоит без артикля; однако по контексту речь идёт об известном Израилю завете.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπεδέξαντο ἀποθανεῖν
  choice: предпочли умереть
  rationale: Передаёт добровольное принятие смерти как выбора в данных обстоятельствах; по-русски звучит естественнее буквального «приняли умереть» и не приписывает им радостного отношения к смерти.
- source_word: μιανθῶσιν
  choice: оскверниться
  rationale: Сохраняет смысл ритуально-нравственного осквернения в контексте верности закону и завету.
- source_word: τοῖς βρώμασιν
  choice: пищей
  rationale: Греческое слово обозначает съестное, здесь — пищу, употребление которой повлекло бы осквернение. Русское собирательное единственное естественно передаёт греческое множественное число без неоправданного сужения до мяса.
- source_word: βεβηλώσωσιν
  choice: осквернить
  rationale: Передаёт обращение со святыней как с несвятым и сохраняет связь с определением «святой»; повтор корня с «оскверниться» отражает тесный смысловой параллелизм греческих глаголов.
- source_word: διαθήκην ἁγίαν
  choice: святой завет
  rationale: В контексте имеется в виду известный Израилю завет, хотя формально греческое словосочетание стоит без артикля.
- source_word: ἀπέθανον
  choice: умерли
  rationale: Греческий текст прямо говорит «умерли», не выражая грамматически причинного значения «были преданы смерти».
theological_decisions:
- issue: Характер осквернения от пищи
  choice: Ритуально-нравственное осквернение вследствие употребления недозволенной пищи
  alternative: Общее нравственное развращение, связанное с пищевыми обычаями
  rationale: Контекст верности закону и святому завету указывает на пищевые запреты, но слово «оскверниться» сохраняет как обрядовую, так и нравственную сторону, не сводя смысл только к одной из них.
- issue: Определённость выражения διαθήκην ἁγίαν
  choice: «святой завет» как конкретный, известный завет
  alternative: «некий святой завет» или формально неопределённое «святой завет»
  rationale: Несмотря на отсутствие артикля в греческом, историко-литературный контекст ясно указывает на завет Израиля с Богом; примечание сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. Сохранены параллелизм двух придаточных цели и резкое заключение «и умерли». Маркеры примечаний поставлены при словах, к которым они относятся.
