lexical_decisions:
- source_word: ἔγραψεν
  choice: написал
  rationale: Обычное значение аориста глагола γράφω — «написал». Контекст придаёт написанному силу царского распоряжения, но перевод «издал указ» был бы конкретнее самого греческого выражения.
- source_word: πάσῃ τὴν βασιλεία αὐτοῦ
  choice: всему своему царству
  rationale: Несмотря на необычное согласование в сохранившемся греческом тексте, оборот обозначает всё царство как адресата или область действия царского распоряжения. Формулировка естественна по-русски и сохраняет полноту охвата.
- source_word: εἶναι πάντας
  choice: чтобы все стали
  rationale: Инфинитив передаёт содержание царского повеления. «Стали» естественно сочетается с εἰς и выражает переход к навязанному единству; более буквальное «были» также возможно и отмечено в сноске.
- source_word: εἰς λαὸν ἕνα
  choice: одним народом
  rationale: λαός здесь обозначает народ как общественно-этническое или политическое целое. «Одним народом» передаёт объединительную и ассимиляционную направленность приказа, не привнося современного понятия национального государства.
theological_decisions:
- issue: Политико-этнический смысл слова λαός
  choice: одним народом
  alternative: единым народом; одной нацией
  rationale: Речь идёт об имперской унификации, а не о богословском учении о народе завета. «Одним народом» сохраняет прямой общественно-политический смысл и не вносит лишних конфессиональных оттенков.
- issue: Динамический или статический смысл εἶναι с εἰς
  choice: стали
  alternative: были
  rationale: Предлог εἰς при «одним народом» позволяет услышать направленность к новому состоянию, поэтому «стали» уместно в контексте ассимиляционного приказа. Однако собственно инфинитив εἶναι означает «быть», и эта подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и торжественно-нейтральный. Сохранён глагол «написал», без административного уточнения «издал указ». Формулировка «одним народом» понятна широкому читателю и не перегружена современно-политической терминологией.
