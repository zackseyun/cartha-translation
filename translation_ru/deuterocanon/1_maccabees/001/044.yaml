    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλία
  choice: письма
  rationale: В административном контексте речь идёт о письменных царских распоряжениях, а не о книгах в современном смысле.
- source_word: ἐν χειρὶ ἀγγέλων
  choice: с вестниками
  rationale: Оборот буквально означает «в руке вестников» и указывает на доставку через посланцев; по-русски это естественно передаётся как «с вестниками».
- source_word: προπορεύθηναι ὀπίσω
  choice: чтобы их жители следовали
  rationale: Сочетание выражает следование предписанному порядку. Добавление «их жители» ясно обозначает подразумеваемых адресатов, не меняя смысла.
- source_word: νομίμων
  choice: законам
  rationale: В контексте царского распоряжения слово передаёт обязательную норму, хотя может также обозначать обычаи или установления; эта неоднозначность отмечена в сноске.
- source_word: ἀλλοτρίων
  choice: чуждым
  rationale: Слово обозначает нечто чужое, принадлежащее другим и не свойственное Иудее; «чуждым» сохраняет этот смысл без излишнего уточнения.
- source_word: τῆς γῆς
  choice: этой земле
  rationale: Греческий текст говорит просто о «земле», подразумевая Иудею. Указательное «этой» делает русскую фразу естественной, не называя землю точнее источника.
theological_decisions:
- issue: Объём значения νόμιμα в контексте преследования
  choice: законам
  alternative: обычаям; установлениям
  rationale: «Законам» сохраняет официальный и принудительный характер царского требования, тогда как возможное значение «обычаям» вынесено в сноску.
- issue: Сила инфинитивного оборота после сообщения об отправке писем
  choice: чтобы их жители следовали
  alternative: с повелением следовать; чтобы шли вслед
  rationale: Так передаётся содержание и цель писем без усиления греческого текста прямым добавлением слова «повеление».
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Синтаксис сохраняет последовательность греческого текста, а лексическая неоднозначность νόμιμα не устраняется, но отражается в сноске.
