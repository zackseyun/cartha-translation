  text: Her sanctuary was laid waste like a wilderness; her feasts were turned into mourning, her Sabbaths into reproach, her honor into contempt,
translation:
  language: ru
  text: Её святилище было разорено и стало подобно пустыне; её праздники обратились в скорбь, её субботы — в поругание, её честь — в презрение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἁγίασμα
  choice: святилище
  rationale: Слово обозначает священное место, храмовое святилище Иерусалима, а не отвлечённую святость.
- source_word: ἠρημώθη
  choice: было опустошено
  rationale: Пассивная форма передаёт разорение и запустение; русский вариант естественен и сохраняет силу греческого глагола.
- source_word: ὡς ἔρημος
  choice: словно пустыня
  rationale: Сохраняется явное сравнение с ὡς и библейский образ безлюдного, опустевшего места.
- source_word: αἱ ἑορταὶ
  choice: праздники
  rationale: В храмовом контексте речь идёт о религиозных праздничных торжествах Израиля; «праздники» ясно и естественно для современного читателя.
- source_word: ἐστράφησαν εἰς πένθος
  choice: обратились в скорбь
  rationale: Передаёт превращение праздников в состояние траура и сохраняет торжественно-поэтический строй плача.
- source_word: τὰ σάββατα
  choice: субботы
  rationale: Множественное число относится к повторяющимся субботним дням и их соблюдению.
- source_word: εἰς ὀνειδισμόν
  choice: в поругание
  rationale: «Поругание» передаёт публичный позор, оскорбление и поношение, не уточняя виновника.
- source_word: τιμὴ
  choice: честь
  rationale: Здесь слово означает почёт и достоинство, которыми прежде обладал олицетворённый город.
- source_word: εἰς ἐξουδένωσιν
  choice: в презрение
  rationale: Передаёт обращение с кем-либо как с ничтожным и презираемым; формулировка кратка и параллельна предыдущим членам стиха.
theological_decisions:
- issue: Референт женского местоимения αὐτῆς
  choice: Последовательно перевести как «её», оставив подразумеваемым олицетворённый Иерусалим.
  alternative: Явно повторить «Иерусалима» или сказать «города».
  rationale: Греческий текст повторяет местоимение женского рода, не называя заново его референт. Русское «её» сохраняет контекстуальную неоднозначность, олицетворение города и ритм плача.
translation_notes:
  register: Современный литературный русский с достоинством библейского плача. Синтаксический параллелизм оригинала сохранён; во второй половине использованы тире при подразумеваемом глаголе, чтобы избежать тяжеловесного повторения и удержать ритм.
