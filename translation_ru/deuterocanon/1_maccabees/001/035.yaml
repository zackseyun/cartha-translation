lexical_decisions:
- source_word: παρέθεντο
  choice: сложили
  rationale: Глагол передаёт размещение запасов в укреплённом месте; «сложили» естественно по-русски и не дублирует последующее ἀπέθεντο.
- source_word: ὅπλα
  choice: оружие
  rationale: Обычное современное обозначение вооружения в военном контексте.
- source_word: τροφήν
  choice: продовольствие
  rationale: В контексте снабжения гарнизона речь идёт не просто о пище, а о запасе продовольствия.
- source_word: συναγαγόντες
  choice: собранную
  rationale: Причастная конструкция сохраняет действие, предшествующее помещению добычи, без тяжеловесности.
- source_word: τὰ σκῦλα Ἰερουσαλήμ
  choice: собранную в Иерусалиме добычу
  rationale: σκῦλα означает захваченную добычу; генитив Ἰερουσαλήμ здесь естественно понимать как указание на место или источник её захвата.
- source_word: ἀπέθεντο
  choice: поместили
  rationale: Передаёт укладывание добычи в указанном месте и позволяет избежать неестественного повторения глагола «сложили».
- source_word: ἐκεῖ
  choice: там
  rationale: Прямо отсылает к укреплённому месту из предыдущего стиха.
- source_word: μεγάλην παγίδα
  choice: великой западнёй
  rationale: «Западня» сохраняет предметную метафору опасной ловушки и возвышенный библейский регистр.
theological_decisions:
- issue: Подлежащее при ἐγένετο εἰς μεγάλην παγίδα
  choice: стала эта крепость великой западнёй
  alternative: и это стало великой западнёй
  rationale: В греческом подлежащее не выражено явно. По контексту наиболее вероятна отсылка к укреплённой цитадели из предыдущего стиха; добавление «эта крепость» делает русский текст ясным, не уточняя, для кого именно она стала западнёй.
- issue: Метафорический смысл μεγάλην παγίδα
  choice: великой западнёй
  alternative: великой ловушкой
  rationale: «Западня» сохраняет образность и зловещий оттенок, не превращая метафору в пояснительное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; образ западни сохранён. Подлинная невыраженность греческого подлежащего учтена по ближайшему контексту.
