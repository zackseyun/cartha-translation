  text: And they stationed there a sinful nation, lawless men, and they strengthened themselves in it.
translation:
  language: ru
  text: И разместили там грешный народ — беззаконных людей — и укрепились в ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκαν ἐκεῖ
  choice: разместили там
  rationale: Передаёт целенаправленное поселение или размещение людей в крепости; естественнее по-русски, чем буквальное «положили там».
- source_word: ἔθνος ἁμαρτωλόν
  choice: грешный народ
  rationale: Сохраняет коллективное обозначение ἔθνος и нравственно-религиозную оценку ἁμαρτωλόν, не сужая значение до современного политического смысла слова «нация».
- source_word: ἄνδρας παρανόμους
  choice: людей беззаконных
  rationale: Приложение поясняет характеристику размещённой группы; «беззаконных» точно передаёт παρανόμους в контексте нарушения Закона.
- source_word: ἐνίσχυσαν ἐν αὐτῇ
  choice: они укрепились в ней
  rationale: Медиальное по смыслу употребление передано как обретение прочного положения в крепости; местоимение женского рода соотносится с крепостью из ближайшего контекста.
theological_decisions:
- issue: Значение παρανόμους
  choice: беззаконных
  alternative: преступных
  rationale: В маккавейском контексте слово может подразумевать противление Закону, поэтому «беззаконных» сохраняет богословско-заветный оттенок, не добавляя конфессионального толкования.
- issue: Референт αὐτῇ
  choice: в ней
  alternative: там
  rationale: Сохранено местоименное указание греческого текста и его возможная связь с крепостью; замена на «там» устранила бы грамматическую деталь источника.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранён параллелизм «грешный народ, людей беззаконных» и подлинная некоторая неоднозначность последней фразы.
