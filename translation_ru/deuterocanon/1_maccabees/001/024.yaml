lexical_decisions:
- source_word: λαβὼν πάντα
  choice: забрав всё
  rationale: Аористное причастие обозначает действие, завершившееся до ухода; деепричастный оборот естественно передаёт эту последовательность, а «всё» сохраняет всеохватность πάντα.
- source_word: ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  choice: ушёл в свою землю
  rationale: «Ушёл» ясно передаёт удаление, выраженное ἀπῆλθεν; «в свою землю» сохраняет значение γῆ и возвратный по смыслу посессивный оттенок αὐτοῦ.
- source_word: ἐποίησαν φονοκτονίαν
  choice: совершили убийство
  rationale: Сочетание глагола с существительным естественно передаётся по-русски устойчивым выражением «совершить убийство» и сохраняет сильную нравственную оценку редкого слова φονοκτονία.
- source_word: ἐλάλησαν ὑπερηφανίαν μεγάλην
  choice: говорили с великой надменностью
  rationale: Такой оборот звучит естественно в современном русском языке, сохраняя значение речи, величины проявления и порицаемой гордости; необычная греческая конструкция с прямым дополнением пояснена в сноске.
theological_decisions:
- issue: Нравственная сила φονοκτονίαν
  choice: убийство
  alternative: кровопролитие; резня
  rationale: «Убийство» сохраняет выраженную в греческом слове нравственную оценку и не ослабляет её до нейтрального обозначения смерти, при этом более широкие контекстуальные варианты отмечены в сноске.
- issue: Характер ὑπερηφανία
  choice: надменность
  alternative: гордость; высокомерие
  rationale: «Надменность» ясно передаёт отрицательно окрашенную гордость в речи, не вводя дополнительных конфессиональных толкований.
translation_notes:
  register: Современный литературный русский язык с кратким повествовательным синтаксисом. Сохранена смена единственного числа («он ушёл») на множественное («они совершили»), присутствующая в греческом тексте; неоднозначные лексические оттенки вынесены в сноски.
