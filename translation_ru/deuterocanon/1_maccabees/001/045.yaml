lexical_decisions:
- source_word: κωλῦσαι
  choice: запретить
  rationale: В контексте царского постановления инфинитив обозначает официальное запрещение, а не просто создание препятствий.
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Устоявшийся и точный русский культовый термин для жертв, целиком сжигаемых на огне.
- source_word: θυσίας
  choice: жертвы
  rationale: Сохраняет общее обозначение жертвоприношений и его отличие от более конкретных всесожжений и возлияний.
- source_word: σπονδὴν
  choice: возлияния
  rationale: В русском библейском языке это ясное название ритуального излияния напитка; множественное число естественно для общего запрета ряда обрядов.
- source_word: ἐκ τοῦ ἁγιάσματος
  choice: в святилище
  rationale: При κωλῦσαι оборот по смыслу указывает на устранение этих обрядов из сферы святилища; по-русски естественнее прямо обозначить место, где запрещалось их совершать. Буквальная форма с «из» отмечена в сноске.
- source_word: βεβηλῶσαι
  choice: осквернять
  rationale: Передаёт обращение со священными днями как с несвятыми и звучит естественно в современном русском религиозном контексте.
- source_word: σάββατα
  choice: субботы
  rationale: Сохраняет явное множественное число греческого текста и обозначает субботние дни вообще.
- source_word: ἑορτάς
  choice: праздники
  rationale: Естественный современный термин для установленных религиозных праздничных дней.
theological_decisions:
- issue: Терминология храмовых жертвоприношений Израиля
  choice: 'Сохранить отдельные категории: «всесожжения, жертвы и возлияния».'
  alternative: Обобщить их как «приношения» или «богослужение».
  rationale: Греческий текст перечисляет конкретные храмовые обряды, запрет которых направлен на прекращение жертвенного служения; обобщение стёрло бы значимые различия.
- issue: Направительный оттенок ἐκ τοῦ ἁγιάσματος
  choice: В основном тексте передать смысл естественным русским оборотом «в святилище», сохранив буквальную форму в сноске.
  alternative: Перевести формально как «из святилища».
  rationale: При глаголе запрета предлог выражает исключение обрядов из сферы святилища. Русское «из святилища» может ошибочно представить уже находящиеся там предметы, которые выносят наружу.
translation_notes:
  register: Современный литературный русский с сохранением точной библейской культовой лексики. Синтаксис продолжает перечень предписаний из предыдущего контекста; запятая в конце заменена точкой, поскольку представлен отдельный стих.
