  text: And he entered the sanctuary in arrogance[a], and took the golden altar, and the lampstand of the light with all its utensils,
translation:
  language: ru
  text: И вошёл он в святилище надменно и взял золотой жертвенник, светильник[a] и все его принадлежности,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «светильник света»; возможно также: «светильник для света».'
    reason: Сноска сохраняет заметную конструкцию λυχνίαν τοῦ φωτός, тогда как основной текст передаёт её естественным современным русским выражением.
lexical_decisions:
- source_word: ἁγίασμα
  choice: святилище
  rationale: Обозначает священное место в храме, не вынуждая уточнять конкретное внутреннее помещение.
- source_word: ἐν ὑπερηφανίᾳ
  choice: с надменностью
  rationale: Передаёт обстоятельство образа действия и явно отрицательную нравственную окраску существительного ὑπερηφανία.
- source_word: θυσιαστήριον τὸ χρυσοῦν
  choice: золотой жертвенник
  rationale: Естественное русское соответствие греческому сочетанию существительного с прилагательным в храмовом контексте.
- source_word: λυχνίαν τοῦ φωτός
  choice: светильник
  rationale: В русском храмовом контексте «светильник» сам по себе выражает предназначение для света; буквальное «светильник света» было бы неестественным.
- source_word: σκεύη αὐτῆς
  choice: все его принадлежности
  rationale: Передаёт связанные со светильником предметы достаточно широко и естественно, не сужая значение до сосудов.
theological_decisions:
- issue: Следует ли понимать ἁγίασμα как строго определённое помещение храма
  choice: святилище
  alternative: Святое место
  rationale: «Святилище» сохраняет храмовый и сакральный смысл, не вводя более точного разграничения помещений, чем допускает греческий текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксический параллелизм греческого текста сохранён; архаизмы и ненужная техническая конкретизация устранены.
