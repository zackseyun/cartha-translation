translation:
  language: ru
  text: И он забрал добычу из города, предал его огню и разрушил вокруг города его дома и городские стены.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: забрал
  rationale: Передаёт простое повествовательное значение λαμβάνω в контексте военной добычи, не уточняя способ её захвата сверх сказанного в тексте.
- source_word: τὰ σκῦλα τῆς πόλεως
  choice: добычу из города
  rationale: σκῦλα обозначает военную добычу; родительный τῆς πόλεως естественно передан по-русски как указание на источник добычи.
- source_word: ἐνεπύρισεν αὐτὴν πυρί
  choice: предал его огню
  rationale: Сохраняет явное упоминание огня в πυρί и избегает неестественного русского повтора «сжёг огнём»; местоимение относится к городу.
- source_word: καθεῖλεν
  choice: разрушил
  rationale: Глагол выражает насильственное разрушение или снос; «разрушил» естественно сочетается и с домами, и со стенами.
- source_word: τοὺς οἴκους αὐτῆς
  choice: его дома
  rationale: οἶκοι здесь обозначает городские дома или здания; русское местоимение согласовано со словом «город».
- source_word: τὰ τείχη αὐτῆς
  choice: его стены
  rationale: τείχη — оборонительные городские стены; контекст позволяет употребить краткое «стены».
- source_word: κύκλῳ
  choice: по всему периметру
  rationale: Передаёт круговой охват и полноту разрушения городских стен в ясной современной формулировке.
