translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским достоинством. Тире показывает, что «те, кого… находили» поясняет, в отношении кого в Израиле совершались эти действия; неоднозначность связи греческих членов предложения не устраняется чрезмерным истолкованием.
