lexical_decisions:
- source_word: ἐν ἰσχύϊ αὐτῶν
  choice: Пользуясь своей силой
  rationale: Предлог ἐν здесь указывает на средство действия. Такой перевод естественно передаёт инструментальный смысл и сохраняет оттенок превосходящей, принуждающей силы, не сводя выражение только к физическому насилию.
- source_word: ἐποίουν οὕτω
  choice: они поступали так
  rationale: Имперфект ἐποίουν обозначает продолжавшиеся или повторявшиеся действия; эта длительность дополнительно раскрывается последующим выражением «месяц за месяцем».
- source_word: τῷ Ἰσραήλ
  choice: с Израилем
  rationale: Русское управление «поступать так с кем-либо» естественно передаёт греческий дательный падеж, не добавляя отсутствующего в тексте предлога со значением прямого противодействия.
- source_word: τοῖς εὑρισκομένοις
  choice: с теми, кого … находили
  rationale: Субстантивированное пассивное причастие относится к людям, которых обнаруживали. Развёрнутая конструкция естественна по-русски и сохраняет пассивный смысл.
- source_word: ἐν παντὶ μηνὶ καὶ μηνὶ
  choice: месяц за месяцем
  rationale: Повтор существительного выражает регулярную повторяемость; русское «месяц за месяцем» передаёт её ясно и идиоматично.
- source_word: ἐν ταῖς πόλεσιν
  choice: в городах
  rationale: Прямой и нейтральный эквивалент, не добавляющий значения «повсюду».
