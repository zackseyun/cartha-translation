  text: After two years had passed, the king sent a chief collector of tribute to the cities of Judah, and he came to Jerusalem with a heavy crowd.
translation:
  language: ru
  text: По прошествии двух лет царь послал в города Иудеи начальника по сбору дани, и тот пришёл в Иерусалим с большой толпой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с большим множеством людей»; буквально: «с тяжёлой толпой». Выражение указывает на многочисленную сопровождавшую его массу людей и в данном контексте может подразумевать значительную силу.'
    reason: Сохраняет лексическую неоднозначность ἐν ὄχλῳ βαρεῖ между множеством людей и значительной сопровождающей силой, не утверждая, что это непременно войско.
lexical_decisions:
- source_word: Μετὰ δύο ἐτῶν ἡμερῶν
  choice: Через два года
  rationale: Греческая идиома буквально содержит выражение «после двух лет дней», но естественно обозначает истечение двух лет; краткое русское выражение точно передаёт временной смысл.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Прямой и естественный эквивалент аориста глагола «посылать».
- source_word: ἄρχοντα φορολογίας
  choice: начальника по сбору дани
  rationale: ἄρχων указывает на начальствующее должностное лицо, а φορολογία — на взимание дани или налогов. Формулировка сохраняет и ранг чиновника, и его фискальную функцию.
- source_word: εἰς τὰς πόλεις Ἰούδα
  choice: в города Иудеи
  rationale: После глагола движения εἰς естественно передаётся русским «в»; Ἰούδα здесь обозначает географическую область — Иудею.
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: с многочисленным войском
  rationale: ὄχλος означает толпу или множество, а βαρύς буквально — «тяжёлый» и в данном контексте указывает на значительную сопровождающую силу. «Войско» естественно для военно-административной сцены, однако степень военного оттенка остаётся контекстуальным толкованием, поэтому буквальные варианты отмечены в сноске.
