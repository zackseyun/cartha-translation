lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: После этого
  rationale: Естественный современный русский переход, точно передающий временную последовательность; множественное «после этих событий» возможно, но здесь звучит тяжелее.
- source_word: ἔπεσεν ἐπὶ τὴν κοίτην
  choice: слёг в постель
  rationale: Русское выражение естественно описывает начало тяжёлой, предсмертной болезни. Оно передаёт контекст греческого буквального образа «упал на ложе», не создавая лишнего впечатления внезапного физического падения.
- source_word: ἔγνω
  choice: понял
  rationale: Аорист обозначает наступившее осознание; «понял» в данном контексте естественнее русского «знал» и не добавляет внешнего источника знания.
- source_word: ἀποθνήσκει
  choice: умирает
  rationale: Настоящее время передаёт продолжающийся процесс умирания, а не только близость будущей смерти.
