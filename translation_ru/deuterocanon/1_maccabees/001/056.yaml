  text: Найденные ими книги Закона они разорвали и сожгли в огне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ βιβλία
  choice: книги
  rationale: «Книги» естественно и достаточно точно передаёт множественное βιβλία, не уточняя без необходимости материальную форму рукописей как свитков.
- source_word: τοῦ νόμου
  choice: Закона
  rationale: В данном контексте речь идёт об иудейском Законе, то есть Торе; прописная буква ясно обозначает этот конкретный священный корпус, не добавляя конфессионального толкования.
- source_word: ἃ εὗρον
  choice: найденные
  rationale: Причастная конструкция естественно передаёт относительное придаточное «которые они находили/нашли» и сохраняет связь с книгами, не придавая местоимению значения «все без исключения».
- source_word: κατασχίσαντες
  choice: разрывали
  rationale: Глагол обозначает разрывание на части. Русское «разрывали» передаёт насильственное повреждение книг; соединение с последующим глаголом отражает сопутствующее действие греческого причастия.
- source_word: ἐνεπύρισαν πυρί
  choice: сжигали в огне
  rationale: Формулировка сохраняет явное упоминание огня в греческом тексте и звучит по-русски естественнее буквального «сжигали огнём».
