  verdict: approve
  source_fidelity: 'Текст точно передаёт оба альтернативных основания преследования: обнаружение «книги завета» у человека и приверженность закону. «Где бы ни находили» уместно воспроизводит неопределённо-относительное ὅπου и повторительный оттенок имперфекта εὑρίσκετο. Местоимение «его» естественно относится к человеку, у которого находили книгу, а не к книге. «Царский указ предавал его смерти» адекватно передаёт τὸ σύγκριμα τοῦ βασιλέως ἐθάνατου αὐτόν без ненужного уточнения способа казни.'
  naturalness: Перевод звучит естественно для современного литературного русского при сохранении сдержанного библейско-исторического регистра. Оборот «был привержен закону» несколько формальнее разговорной нормы, но здесь стилистически и контекстуально уместен; «предавал его смерти» точно поддерживает официальный карательно-правовой тон.
