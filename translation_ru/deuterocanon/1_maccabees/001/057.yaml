base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/057.yaml
  text: And wherever a book of the covenant was found with anyone[a], or if anyone consented to the law[b], the king’s decree put him to death.
translation:
  language: ru
  text: И где бы ни находили у кого-либо книгу завета[a], или если кто-либо был привержен закону[b], царский указ предавал его смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «книгу завета»; возможно также: «документ завета» или «книгу закона (завета)».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть придерживался иудейского закона и сохранял ему верность; возможно также: «одобрял закон» или «соглашался с законом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: где бы ни
  rationale: 'Передаёт неопределённо-относительное и распределительное значение: речь идёт о каждом месте, где происходило такое обнаружение.'
- source_word: εὑρίσκετο
  choice: находили
  rationale: Имперфект в пассивной форме выражает повторяющееся действие; неопределённо-личная русская конструкция естественно передаёт этот пассив.
- source_word: παρὰ τινι
  choice: у кого-либо
  rationale: В данном контексте оборот обозначает нахождение книги при человеке или в его распоряжении, не уточняя юридический характер владения.
- source_word: βιβλίον διαθήκης
  choice: книгу завета
  rationale: Буквально сохраняет многозначный библейский оборот, который может обозначать книгу или документ, связанный с заветом.
- source_word: συνευδόκει
  choice: был привержен
  rationale: Глагол обозначает одобрение, согласие и солидарность; в контексте гонения речь идёт не просто о мнении, а о верности закону. Формулировка сохраняет это значение без конфессионального уточнения.
- source_word: τῷ νόμῳ
  choice: закону
  rationale: Контекст указывает на иудейский закон, однако перевод не добавляет отсутствующего в греческом тексте уточнения «Моисееву».
- source_word: τὸ σύγκριμα τοῦ βασιλέως
  choice: царский указ
  rationale: Оборот обозначает официальное решение или постановление царя, имеющее обязательную и карательную силу.
- source_word: ἐθάνατου αὐτόν
  choice: предавал его смерти
  rationale: Каузативная форма означает лишение жизни по властному постановлению; выбранная формулировка сохраняет официальный судебно-карательный оттенок и повторительный аспект имперфекта.
theological_decisions:
- issue: Значение τῷ νόμῳ
  choice: «закону» — в контексте иудейскому закону, или Торе
  alternative: закон вообще либо развёрнутое «Закону Моисея»
  rationale: Контекст гонений Антиоха ясно указывает на ancestral Jewish law, но добавление имени Моисея сделало бы перевод более определённым, чем исходный текст.
- issue: Характер отношения, выраженного συνευδόκει
  choice: приверженность закону
  alternative: согласие с законом или одобрение закона
  rationale: В условиях преследования глагол подразумевает солидарность и верность, однако перевод не уточняет конкретные обряды или убеждения, которых текст прямо не называет.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Конструкция «где бы ни находили» передаёт повторяемость репрессий; «царский указ предавал его смерти» сохраняет олицетворённую синтаксическую структуру греческого текста и официальный тон.
