  text: And he entered Egypt with a heavy force, with chariots and elephants and horsemen and a great fleet.
translation:
  language: ru
  text: И вошёл он в Египет с могучим войском — с колесницами, слонами, всадниками и большим флотом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «большим вооружением»; возможно также: «большими экспедиционными силами». Греческое слово στόλος может обозначать не только флот, но и военное снаряжение либо вооружённую экспедицию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Прямо передаёт аорист εἰσέρχομαι и, в отличие от «вторгся», не добавляет прямо не выраженной оценки, хотя военный характер вступления ясен из контекста.
- source_word: ὄχλῳ βαρεῖ
  choice: с могучим войском
  rationale: В военном контексте ὄχλος обозначает массу воинов, а βαρεῖ — её весомость и силу. «Могучее войско» естественно по-русски и передаёт не только многочисленность, но и военную мощь.
- source_word: ἅρμασιν
  choice: с колесницами
  rationale: Прямой эквивалент; военный контекст делает уточнение «боевыми» необязательным.
- source_word: ἐλέφανσιν
  choice: слонами
  rationale: Прямое соответствие греческому слову; по контексту речь идёт о боевых слонах, но это пояснение не требуется в основном тексте.
- source_word: ἱππεῦσιν
  choice: всадниками
  rationale: Точно и естественно передаёт обозначение конных воинов, сохраняя конкретный образ исходного текста.
- source_word: στόλῳ μεγάλῳ
  choice: большим флотом
  rationale: στόλος может обозначать снаряжение, вооружённую экспедицию или флот. В контексте египетского похода «флот» является вероятным значением, но подлинная лексическая неоднозначность отмечена в сноске.
