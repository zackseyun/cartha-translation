lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: И постиг
  rationale: В данном итоговом повествовательном высказывании передаёт наступление тяжёлого состояния или бедствия естественным русским оборотом, не сводя ἐγένετο к простому «был».
- source_word: ὀργὴ
  choice: гнев
  rationale: «Гнев» сохраняет силу греческого слова и его возможный оттенок суда, при этом сам по себе не называет источник.
- source_word: μεγάλη ... σφόδρα
  choice: великий
  rationale: В постпозитивном σφόδρα заключено сильное усиление. Русское «великий гнев» звучит весомо и естественно; дополнительное «весьма» сделало бы краткую фразу тяжеловесной.
- source_word: ἐπὶ Ἰσραήλ
  choice: постиг Израиль
  rationale: Оборот естественно передаёт направленность или обрушившееся на Израиль действие, не вынуждая выбирать между русскими «против» и «на».
theological_decisions:
- issue: Источник гнева
  choice: Не назван; формулировка не приписывает гнев прямо Богу, гонителям или обстоятельствам.
  alternative: «возгорелся великий гнев против Израиля» / «великий гнев Божий постиг Израиль»
  rationale: В греческом тексте субъект или источник гнева не указан. Добавление Бога либо гонителей устранило бы подлинную неоднозначность.
- issue: Направленность или воздействие гнева
  choice: «постиг Израиль»
  alternative: «был великий гнев против Израиля» / «великий гнев обрушился на Израиль»
  rationale: ἐπί допускает понимание гнева как направленного против Израиля или обрушившегося на него. Основной текст передаёт итоговое бедствие, а примечание сохраняет альтернативную направленность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием итоговой фразы. «Постиг» привычно для повествования о тяжёлом бедствии и не вводит явного действующего лица.
