lexical_decisions:
- source_word: πεντεκαιδεκάτῃ ἡμέρᾳ Χασελεὺ
  choice: в пятнадцатый день месяца кислева
  rationale: Дательный оборот передаёт дату. Добавление слова «месяца» естественно для современного русского языка и ясно показывает, что кислев — название месяца.
- source_word: τῷ πέμπτῳ καὶ τεσσερακοστῷ ἔτει
  choice: в сто сорок пятом году
  rationale: В контексте книги подразумевается сто сорок пятый год селевкидской эры; это поясняется в сноске, но не вставляется в основной текст.
- source_word: ᾠκοδόμησαν
  choice: воздвигли
  rationale: Глагол буквально означает «построили». «Воздвигли» естественно сочетается как с культовым сооружением на жертвеннике, так и с алтарями и сохраняет повтор одного греческого глагола.
- source_word: βδέλυγμα ἐρημώσεως
  choice: мерзость запустения
  rationale: Традиционная и достаточно буквальная передача сохраняет компактность, межтекстовые связи и смысловую неоднозначность греческого выражения.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: на жертвеннике
  rationale: ἐπί с винительным здесь обозначает помещение или сооружение предмета на жертвеннике.
- source_word: ἐν πόλεσιν Ἰούδα κύκλῳ
  choice: в окрестных городах Иудеи
  rationale: κύκλῳ указывает на города по всей окружающей местности; «окрестные города Иудеи» естественно передаёт это по-русски.
- source_word: βωμούς
  choice: языческие алтари
  rationale: βωμός обозначает алтарь, здесь явно противопоставленный храмовому θυσιαστήριον. Уточнение «языческие» естественно передаёт культовое различие и предотвращает неясное повторение слова «жертвенник».
theological_decisions:
- issue: Передача βδέλυγμα ἐρημώσεως, выражения с последующим библейско-богословским звучанием
  choice: мерзость запустения
  alternative: опустошающая мерзость; мерзость, вызывающая запустение
  rationale: Традиционная формула сохраняет межтекстовую связь и не решает принудительно, является ли родительный ἐρημώσεως описанием результата, действия или устойчивого наименования.
- issue: Различение θυσιαστήριον и βωμός
  choice: жертвенник для θυσιαστήριον; языческие алтари для βωμούς
  alternative: жертвенник; жертвенники
  rationale: Греческий текст употребляет разные культовые термины. Выбранная передача ясно отличает законный храмовый жертвенник от сооружённых в городах инокультовых алтарей, не вводя конкретного божества или обряда.
