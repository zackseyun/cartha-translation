    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθεντο
  choice: вынудили
  rationale: Аорист среднего залога от τίθημι буквально означает «поместили»; в сочетании с обозначением укрытия здесь передаёт причинное действие. «Вынудили» естественно выражает этот смысл, не усиливая его до прямого указания на насильственное изгнание.
- source_word: τὸν Ἰσραήλ
  choice: Израиль
  rationale: Единственное число с артиклем обозначает народ как единое целое. «Израиль» сохраняет коллективную форму исходного текста.
- source_word: ἐν κρυφίοις
  choice: скрываться
  rationale: Субстантивированное прилагательное во множественном числе буквально указывает на тайные, укромные места. В сочетании с ἔθεντο русское «вынудили… скрываться» естественно передаёт переход народа к тайному существованию.
- source_word: ἐν παντὶ φυγαδευτηρίῳ
  choice: во всех убежищах
  rationale: φυγαδευτήριον — место бегства или убежище. Греческое единственное число с πᾶς имеет распределительный смысл, который по-русски естественно передаётся множественным числом «во всех убежищах».
- source_word: αὐτῶν
  choice: его
  rationale: Местоимение соотносится с коллективным «Израиль» и обозначает принадлежавшие или доступные ему убежища; русское единственное число согласуется с сохранённым названием народа.
