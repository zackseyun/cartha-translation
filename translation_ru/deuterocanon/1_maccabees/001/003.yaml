lexical_decisions:
- source_word: διῆλθεν
  choice: прошёл
  rationale: Передаёт движение через земли и дальнейшее продвижение, не уточняя маршрут или способ передвижения.
- source_word: ἕως ἄκρων τῆς γῆς
  choice: до краёв земли
  rationale: Сохраняет образное обозначение самых отдалённых пределов мира и его гиперболический размах.
- source_word: ἔλαβεν σκῦλα
  choice: захватил добычу
  rationale: σκῦλα — военная добыча; глагол «захватил» естественно передаёт её получение в ходе завоеваний.
- source_word: πλήθους ἐθνῶν
  choice: у множества народов
  rationale: Сохраняет значение многочисленности и обозначает народы как источник захваченной добычи.
- source_word: ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ
  choice: земля затихла перед ним
  rationale: «Затихла» сохраняет образ наступившего покоя или безмолвия перед лицом победителя, не сводя его прямо к политическому подчинению.
- source_word: ὑψώθη
  choice: он возвысился
  rationale: Передаёт возвышение положения и славы героя, сохраняя пассивно-результативный оттенок греческой формы.
- source_word: ἐπήρθη ἡ καρδία αὐτοῦ
  choice: сердце его вознеслось
  rationale: Сохраняет греческий образ вознесённого сердца и его вероятный оттенок гордости, не заменяя образ прямым толкованием.
theological_decisions:
- issue: Нравственная оценка выражения ἐπήρθη ἡ καρδία αὐτοῦ
  choice: сердце его вознеслось
  alternative: он возгордился
  rationale: Греческий текст использует образное выражение, вероятно подразумевающее гордость, но не называет её прямо. Основной текст сохраняет эту смысловую напряжённость, а сноска поясняет возможный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан плавным и ясным; ключевые образы «краёв земли», затихшей земли и вознесённого сердца сохранены.
