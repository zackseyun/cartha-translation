  text: And rulers and elders groaned; virgins and young men grew weak[a], and the beauty of the women was altered.
translation:
  language: ru
  text: И правители и старейшины стонали; девы и юноши обессилели, а красота женщин изменилась.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стала иной». Греческий текст говорит, что красота женщин изменилась, не уточняя, в чём именно состояла эта перемена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστέναξαν
  choice: стонали
  rationale: Передаёт слышимое выражение тяжёлой скорби и сохраняет телесную силу греческого глагола, не сводя его к более слабому «вздыхали».
- source_word: ἄρχοντες
  choice: правители
  rationale: Общее обозначение людей, облечённых властью; не предполагает наследственного титула.
- source_word: πρεσβύτεροι
  choice: старейшины
  rationale: Сохраняет значение признанных старших представителей общины, а не просто пожилых мужчин.
- source_word: παρθένοι
  choice: девы
  rationale: Сохраняет прямое указание греческого слова на девственность; «девушки» было бы естественнее разговорно, но менее точно.
- source_word: νεανίσκοι
  choice: юноши
  rationale: Естественно и точно обозначает молодых мужчин.
- source_word: ἠσθένησαν
  choice: обессилели
  rationale: Передаёт наступившее состояние слабости кратко и естественно.
- source_word: τὸ κάλλος
  choice: красота
  rationale: Прямое и понятное соответствие существительному со значением красоты или привлекательности.
- source_word: ἠλλοιώθη
  choice: изменилась
  rationale: 'Сохраняет неопределённость греческого пассива: характер перемены не уточняется.'
