  text: И она стала засадой против святилища и постоянным злым врагом[a] Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злым клеветником». Греческое διάβολος может означать клеветника или противника; здесь военный контекст говорит в пользу значения «враг».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: стала она
  rationale: Аорист γίνομαι обозначает наступившее состояние; женское местоимение естественно отсылает к ранее упомянутой крепости или цитадели.
- source_word: εἰς ἔνεδρον
  choice: засадой
  rationale: ἔνεδρον означает засаду или место, где подстерегают; творительный падеж после «стала» естественно передаёт эту роль.
- source_word: τῷ ἁγιάσματι
  choice: против святилища
  rationale: ἁγίασμα здесь обозначает священное место, то есть храмовое святилище; враждебное отношение естественно выражено предлогом «против».
- source_word: εἰς διάβολον πονηρόν
  choice: злым врагом
  rationale: В данном историко-военном контексте διάβολος — нарицательное обозначение противника, а не титул сверхъестественного существа; πονηρός передано словом «злой».
- source_word: τῷ Ἰσραήλ
  choice: Израиля
  rationale: В русском языке сочетание «враг Израиля» естественно передаёт враждебную направленность греческого дательного.
- source_word: διὰ παντός
  choice: постоянным
  rationale: Выражение означает непрерывность или постоянство; прилагательное естественно связано с именной частью сказуемого.
theological_decisions:
- issue: Следует ли передавать διάβολον как титул «дьявол» или как нарицательное слово
  choice: 'нарицательное: «враг»'
  alternative: «клеветник»; «дьявол»
  rationale: Речь идёт о враждебной роли крепости или размещённой в ней силы по отношению к Израилю. Перевод «дьявол» внёс бы в повествование более позднее титульное употребление.
translation_notes:
