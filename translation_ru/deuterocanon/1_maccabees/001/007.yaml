lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: царствовал
  rationale: Аорист глагола βασιλεύω обозначает осуществление царской власти; «царствовал» — естественный и точный русский эквивалент в историческом повествовании.
- source_word: ἔτη δώδεκα
  choice: двенадцать лет
  rationale: Винительный падеж выражает продолжительность времени. Беспредложное сочетание «двенадцать лет» идиоматично по-русски и близко к греческой конструкции.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямой эквивалент простого аориста ἀποθνῄσκω; сохраняет нейтральный, лишённый эвфемизма тон источника.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Повтор союза сохраняет паратактическое строение греческой фразы и прямо связывает два события, не добавляя толкования их последовательности.
- source_word: Ἀλέξανδρος
  choice: Александр
  rationale: Устоявшаяся русская форма греческого личного имени Ἀλέξανδρος.
