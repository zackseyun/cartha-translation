    text: 'Буквально: «сделали себе крайнюю плоть»; то есть скрыли видимый признак обрезания или попытались восстановить видимость крайней плоти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν ἑαυτοῖς ἀκροβυστίαν
  choice: сделали себе крайнюю плоть
  rationale: Буквально передаёт намеренно резкое и конкретное греческое выражение. Подразумевается сокрытие или устранение видимого признака обрезания; смысл разъяснён в сноске, чтобы не заменять образ толкованием.
- source_word: ἀπέστησαν
  choice: отступили
  rationale: Передаёт сознательный отход и неверность завету без употребления более позднего специального термина «отпали от веры» или «апостасировали».
- source_word: διαθήκης ἁγίας
  choice: от святого завета
  rationale: Хотя в греческом нет артикля, контекст указывает на известный святой завет Израиля с Богом; определённость естественно выражается по-русски контекстом.
- source_word: ἐζευγίσθησαν
  choice: впряглись в одно ярмо
  rationale: Сохраняет метафору ярма и передаёт добровольное соединение или сопряжение с народами.
- source_word: τοῖς ἔθνεσιν
  choice: с народами
  rationale: Буквально и без лишней конфессиональной окраски обозначает нееврейские народы, противопоставленные народу завета.
- source_word: ἐπράθησαν
  choice: продали себя
  rationale: Передаёт медиально-пассивную форму как добровольное самоотдание и нравственное порабощение.
- source_word: τοῦ ποιῆσαι πονηρόν
  choice: чтобы творить зло
  rationale: Естественно передаёт целевое значение конструкции и сохраняет краткость оригинала.
theological_decisions:
- issue: Насколько явно раскрывать выражение об устранении видимого признака обрезания
  choice: Сохранить в основном тексте буквальное выражение «сделали себе крайнюю плоть»
  alternative: 'Передать смысл прямо: «восстановили себе крайнюю плоть» или «сделали себя необрезанными»'
  rationale: Конкретный и резкий образ важен для изображения сознательного отречения от заветной принадлежности. Чтобы не устранять подлинную образность греческого текста, буквальная формулировка оставлена в стихе, а её смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены конкретный образ крайней плоти, метафора ярма и формула самопродажи; синтаксис сделан ясным для обычного читателя.
