lexical_decisions:
- source_word: πᾶς νυμφίος
  choice: каждый жених
  rationale: Единственное число с πᾶς имеет распределительное значение; «каждый жених» естественно передаёт охват и сохраняет брачный контекст.
- source_word: ἀνέλαβε θρῆνον
  choice: подхватил плач
  rationale: Сочетание обозначает начало или поднятие плача; «подхватил плач» сохраняет образную, сжатую поэтическую формулировку греческого текста.
- source_word: καθημένη
  choice: сидевшая
  rationale: Женский род причастия сохранён без добавления прямо не названного существительного «невеста», чтобы не устранять сжатость и подразумеваемый характер субъекта.
- source_word: ἐν παστῷ
  choice: в брачном чертоге
  rationale: παστός здесь означает брачный покой или чертог; выбран торжественный, но понятный русский эквивалент, соответствующий поэтическому регистру.
- source_word: ἐγένετο ἐν πένθει
  choice: погрузилась в скорбь
  rationale: Передаёт наступление нового состояния, выраженное ἐγένετο, а не только статическое пребывание в печали.
