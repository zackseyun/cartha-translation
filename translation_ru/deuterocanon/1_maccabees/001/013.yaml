  text: And some from the people eagerly sought this[a], and they went to the king; and he gave them authority to practice the customs of the nations.
translation:
  language: ru
  text: Некоторые из народа горячо пожелали этого и отправились к царю; им дали право исполнять установления народов.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть установления нееврейских народов; возможный перевод: «обычаи язычников».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом буквально: «они дали им право», хотя непосредственно перед этим упомянут царь в единственном числе.'
    reason: source_ambiguity
lexical_decisions:
- source_word: προεθυμήθησάν
  choice: горячо этого пожелали
  rationale: Глагол выражает сильную готовность или стремление. Местоимение «этого» восполняет подразумеваемый из контекста объект, не уточняя его сверх греческого текста.
- source_word: τινες ἀπὸ τοῦ λαοῦ
  choice: некоторые из народа
  rationale: Передаёт выделение части израильского народа и не добавляет отсутствующего в греческом слова «мужчины».
- source_word: ἐπορεύθησαν πρὸς τὸν Βασιλέα
  choice: отправились к царю
  rationale: Естественно передаёт движение к царю в современном литературном русском языке.
- source_word: ἔδωκαν αὐτοῖς ἐξουσίαν
  choice: им дали право
  rationale: Безличная по смыслу русская конструкция сохраняет необычное множественное число греческого глагола после упоминания царя и не навязывает однозначного субъекта. «Право» здесь естественнее, чем более широкое «власть».
- source_word: ποιῆσαι
  choice: исполнять
  rationale: В сочетании с δικαιώματα обозначает следование установленным нормам или обычаям, а не просто совершение единичного действия.
- source_word: τὰ δικαιώματα τῶν ἐθνῶν
  choice: установления народов
  rationale: «Установления» сохраняет нормативный оттенок δικαιώματα, а «народы» буквально передаёт ἐθνῶν; контекстуальное значение поясняется в сноске.
theological_decisions:
- issue: Значение ἐθνῶν в иудейском контексте
  choice: народов
  alternative: язычников
  rationale: Буквальное «народы» сохраняет этнический и общественный смысл слова и не превращает его без необходимости в позднейший технический религиозный термин; контекст пояснён в сноске.
- issue: Субъект формы ἔδωκαν («дали»)
  choice: им дали право
  alternative: царь дал им право
  rationale: В греческом стоит множественное число, хотя непосредственно перед ним назван царь в единственном числе. Неопределённо-личная русская конструкция сохраняет смысл разрешения, не устраняя грамматическую неоднозначность источника.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис сделан плавным, но нормативная лексика и неоднозначность греческого текста сохранены.
