  yaml_path: translation/deuterocanon/1_maccabees/001/051.yaml
  text: According to all these words he wrote to his whole kingdom[a], and he appointed overseers over all the people; and he commanded the cities of Judah to offer sacrifices, city by city.
translation:
  language: ru
  text: В соответствии со всеми этими повелениями он написал своему царству[a], назначил над всем народом надзирателей и приказал городам Иудеи приносить жертвы в каждом городе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он направил письменное распоряжение своему царству». Буквально: «написал своему царству»; греческий датив обозначает адресата.'
    reason: Сохраняет краткую конструкцию оригинала и отмечает естественный в русском способ её понимания без добавления множественного числа или способа рассылки.
lexical_decisions:
- source_word: κατὰ πάντας τοὺς λόγους τούτους
  choice: В соответствии со всеми этими повелениями
  rationale: κατά выражает соответствие, а λόγοι в контексте царского распоряжения естественно передаётся как «повеления»; это сохраняет связь с предшествующими требованиями.
- source_word: ἔγραψεν τῇ βασιλείᾳ αὐτοῦ
  choice: он разослал письменные указы по своему царству
  rationale: Глагол ἔγραψεν буквально означает «написал», а дательный τῇ βασιλείᾳ указывает на царство как адресата. Такая передача ясно выражает официальное письменное распоряжение, не добавляя слова «всему», которого нет в греческом тексте.
- source_word: ἐποίησεν ἐπισκόπους
  choice: поставил … надзирателей
  rationale: ἐπίσκοποι здесь обозначает назначенных царём контролирующих должностных лиц. «Надзиратели» передаёт административный смысл и не вызывает анахроничной ассоциации с позднейшей церковной должностью.
- source_word: ἐπὶ πάντα τὸν λαόν
  choice: над всем народом
  rationale: ἐπί с винительным падежом обозначает сферу власти и надзора назначенных лиц.
- source_word: ἐνετείλατο
  choice: приказал
  rationale: Глагол выражает властное распоряжение; «приказал» естественно передаёт его силу в данном повествовательном контексте.
- source_word: ταῖς πόλεσιν Ἰούδα
  choice: городам Иудеи
  rationale: Формальная и естественная передача обозначения городов области Иудеи.
- source_word: θυσιάζειν
  choice: приносить жертвы
  rationale: Идиоматическая русская передача культового действия, обозначенного глаголом θυσιάζω.
- source_word: κατὰ πόλιν καὶ πόλιν
  choice: каждому городу отдельно
  rationale: Повторное распределительное выражение подчёркивает, что приказ должен исполняться в каждом городе; выбранная формулировка звучит естественно по-русски.
theological_decisions:
- issue: Возможное анахроничное понимание ἐπισκόπους
  choice: надзирателей
  alternative: епископов; смотрителей; уполномоченных
  rationale: Речь идёт о царских должностных лицах, следивших за исполнением указа, а не о церковном служении. «Надзиратели» сохраняет административный смысл без привнесения позднейшей экклезиологии.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Административная лексика передаёт принудительный характер царского указа; церковный анахронизм устранён. Тире перед заключительным оборотом подчёркивает распределительный характер приказа.
