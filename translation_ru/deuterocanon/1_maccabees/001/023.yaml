translation:
  language: ru
  text: И взял он серебро и золото и драгоценные сосуды[a]; и взял скрытые сокровища[b], которые нашёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «желанные» или «желательные сосуды»; по смыслу также возможно: «ценные сосуды».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «тайные сокровища» или «скрытые хранилища сокровищ»; греческое выражение может обозначать как спрятанные ценности, так и скрытые сокровищницы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: взял
  rationale: Прямое и нейтральное соответствие аористу λαμβάνω; варианты «захватил» и «унёс» сильнее подчёркивали бы насилие или перемещение, чего сам глагол прямо не выражает.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: серебро и золото
  rationale: Сохраняет конкретное обозначение храмовых ценностей; в русском определённость, выраженная греческими артиклями, естественно передаётся контекстом.
- source_word: τὰ σκεύη τὰ ἐπιθυμητά
  choice: драгоценные сосуды
  rationale: В контексте храмовой утвари σκεύη естественно передать как «сосуды», а ἐπιθυμητά — идиоматично как «драгоценные», то есть желанные и высоко ценимые; буквальная оттеночная возможность отмечена в сноске.
- source_word: τοὺς θησαυροὺς τοὺς ἀποκρύφους
  choice: тайные сокровища
  rationale: Передаёт основное значение скрытых ценностей, не устраняя возможность понимать θησαυροί как тайные хранилища; эта неоднозначность отражена в сноске.
- source_word: οὓς εὗρεν
  choice: которые нашёл
  rationale: Прямо и естественно передаёт относительное придаточное и мотив обнаружения спрятанного.
