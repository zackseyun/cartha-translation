translation:
  language: ru
  text: Они построили вокруг города Давида большую и крепкую стену и крепкие башни, и он стал для них цитаделью[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Акрой». Греческое слово ἄκρα может означать «цитадель, крепость» либо служить историческим названием селевкидской крепости в Иерусалиме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: обнесли
  rationale: Хотя глагол обычно означает «строить», сочетание с городом, стеной и башнями описывает возведение вокруг города оборонительных сооружений. «Обнесли ... стеной» естественно передаёт эту конструкцию, не подменяя её общим «укрепили».
- source_word: τὴν πόλιν Δαυεὶδ
  choice: город Давида
  rationale: Устойчивое и прозрачное обозначение исторического места, соответствующее греческой конструкции.
- source_word: τείχει μεγάλῳ καὶ ὀχυρῷ
  choice: большой и крепкой стеной
  rationale: 'Передаёт оба определения: μέγας указывает на величину, а ὀχυρός — на оборонительную прочность.'
- source_word: πύργοις ὀχυροῖς
  choice: с мощными башнями
  rationale: «Мощными» естественно выражает военную прочность башен и избегает тяжеловесного повтора слова «крепкими».
- source_word: ἐγένετο αὐτοῖς εἰς ἄκραν
  choice: он стал для них цитаделью
  rationale: Местоимение «он» относится к городу. «Цитадель» передаёт обычное значение ἄκρα как укреплённой возвышенности или крепости; возможное историческое имя сохранено в сноске.
