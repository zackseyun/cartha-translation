base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/030.yaml
  text: And he spoke peaceful words to them with deceit[a], and they trusted him; then he fell upon the city suddenly, struck it a great blow[b], and destroyed many people from Israel.
translation:
  language: ru
  text: Он коварно говорил им мирные речи[a], и они доверились ему[b]. Тогда он внезапно напал на город, нанёс ему тяжёлый удар и погубил многих из народа Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также: «слова мира». Речь идёт о примирительных заверениях, произнесённых с коварным намерением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поверили ему». В данном контексте они приняли его заверения и положились на них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν αὐτοῖς λόγους εἰρηνικούς
  choice: говорил им мирные речи
  rationale: Передаёт сочетание глагола речи с прямым дополнением и сохраняет примирительный характер сказанного, не утверждая, что намерения говорившего были мирными.
- source_word: ἐν δόλῳ
  choice: коварно
  rationale: 'Естественно передаёт обстоятельственное значение греческой предложной конструкции: мирные речи служили обману. «С обманом» было бы формальнее, но неестественно по-русски.'
- source_word: ἐπίστευσαν αὐτῷ
  choice: они доверились ему
  rationale: В данном повествовательном контексте речь идёт о практическом доверии к заверениям, а не о богословской вере. Возвратная форма подчёркивает, что люди положились на его слова.
- source_word: ἐπέπεσεν ἐπὶ τὴν πόλιν ἐξαίφνα
  choice: внезапно напал на город
  rationale: Передаёт образ стремительного нападения ясно и естественно; буквальное «обрушился на город» возможно, но звучит более образно, чем требуется контекстом.
- source_word: ἐπάταξεν αὐτὴν πληγὴν μεγάλην
  choice: нанёс ему тяжёлый удар
  rationale: Сохраняет греческий оборот с существительным «удар» и не сужает его заранее до «резни», хотя дальнейший текст ясно указывает на гибель людей.
- source_word: ἀπώλεσεν λαὸν πολὺν ἐξ Ἰσραήλ
  choice: погубил многих из народа Израиля
  rationale: «Погубил» передаёт здесь смертоносное уничтожение, а «многих из народа Израиля» естественно выражает принадлежность многочисленных погибших к Израилю.
theological_decisions:
- issue: Значение ἐπίστευσαν вне богословского контекста
  choice: они доверились ему
  alternative: они поверили ему
  rationale: Обе передачи возможны, но «доверились» лучше выражает практическое следствие обманчивых мирных заверений и не привносит сюда специального богословского смысла веры.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис остаётся ясным и последовательным; архаизмы вроде «поразил великим поражением» устранены, а образ «тяжёлого удара» сохранён.
