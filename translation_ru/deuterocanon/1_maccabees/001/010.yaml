base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/010.yaml
  text: And from them came forth a sinful root[a], Antiochus Epiphanes, son of King Antiochus, who had been a hostage in Rome[b]. And he reigned in the one hundred forty-seventh year of the kingdom of the Greeks.
translation:
  language: ru
  text: И от них произошёл греховный корень[a] — Антиох Эпифан, сын царя Антиоха, который был заложником в Риме. Он воцарился в сто сорок седьмом году царства греков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечестивый корень»; возможно также понимание образа как «греховный отпрыск». В греческом тексте буквально: «корень».'
    reason: lexical_alternative
  - marker: b
    text: То есть по летосчислению Селевкидской эры, названному здесь летами «царства греков».
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ αὐτῶν
  choice: от них произошёл
  rationale: Передаёт возникновение из ранее упомянутой династической среды и естественно сочетается в русском языке с последующей метафорой корня.
- source_word: ῥίζα ἁμαρτωλός
  choice: греховный корень
  rationale: Сохраняет буквальный растительный образ ῥίζα и нравственную оценку ἁμαρτωλός, не заменяя метафору истолковывающим обозначением человека или потомка.
- source_word: Ἀντίοχος Ἐπιφανής
  choice: Антиох Эпифан
  rationale: Использована традиционная русская передача имени и эпитета исторического лица.
- source_word: ὅμηρα
  choice: заложником
  rationale: Несмотря на греческую форму множественного числа, слово относится к одному Антиоху и обозначает политического заложника, удерживаемого как гарантию.
- source_word: ἐβασίλευσεν
  choice: воцарился
  rationale: В сочетании с указанием конкретного года глагол обозначает вступление на царство; «воцарился» точно и кратко передаёт это событие.
- source_word: ἔτει ἑκατοστῷ καὶ ἑβδόμῳ καὶ τεσσαρακοστῷ
  choice: в сто сорок седьмом году
  rationale: Естественная русская передача греческой формулы датировки.
- source_word: βασιλείας Ἑλλήνων
  choice: царства греков
  rationale: Сохраняет политическую форму исходного выражения, тогда как примечание поясняет, что речь идёт о системе летосчисления.
theological_decisions:
- issue: Метафорическая нравственная характеристика ῥίζα ἁμαρτωλός
  choice: Сохранить метафору как «греховный корень»
  alternative: «нечестивый отпрыск», «грешный человек» или «корень греха»
  rationale: Исходный текст вводит Антиоха посредством выразительной и намеренно резкой метафоры. Её сохранение передаёт авторскую нравственную оценку, не сводя образ к одному возможному толкованию.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Растительная метафора сохранена; тире естественно вводит имя того, кто назван «греховным корнем». Местоимение заменено началом нового предложения, чтобы избежать тяжеловесной цепочки придаточных.
