lexical_decisions:
- source_word: συνηθροίσθησαν ... πρὸς αὐτούς
  choice: собрались к ним
  rationale: Передаёт значение совместного присоединения к названной группе без добавочного толкования.
- source_word: πᾶς ὁ ἐγκαταλείπων τὸν νόμον
  choice: все, кто оставлял Закон
  rationale: Несовершенный вид отражает процессуальный оттенок причастия настоящего времени ἐγκαταλείπων; «Закон» обозначает Закон Моисея и потому дано с прописной буквы.
- source_word: ἐποίησαν κακὰ
  choice: творили зло
  rationale: Естественная и вместе с тем близкая к греческому формула, сохраняющая обобщённый характер κακά.
- source_word: ἐν τῇ γῇ
  choice: в стране
  rationale: В контексте речь идёт о земле/стране Израиля; «в стране» звучит естественно и не уточняет сверх исходного текста.
theological_decisions:
- issue: Характер оставления Закона
  choice: кто оставлял Закон
  alternative: кто оставил Закон
  rationale: Настоящее причастие допускает характеристику продолжающегося или типичного действия; несовершенный вид сохраняет эту смысловую напряжённость и не превращает её в однократный завершённый акт.
translation_notes:
