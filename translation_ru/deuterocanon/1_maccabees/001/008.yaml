  text: And his sons became strong[a], each in his own place;
translation:
  language: ru
  text: И его слуги обрели власть — каждый в своей области[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый на своём месте». Греческое слово τόπος означает «место», но в данном контексте может обозначать область или сферу власти. Слово, переведённое как «слуги», также может означать «дети» или «сыновья»; здесь оно, по-видимому, относится к приближённым Александра.'
    reason: Лексическая неоднозначность παῖδες и τόπος; исторический контекст.
lexical_decisions:
- source_word: ἐπεκράτησαν
  choice: утвердились у власти
  rationale: Глагол ἐπικρατέω означает «возобладать», «укрепиться», «получить перевес». В контексте преемников Александра выражение «утвердились у власти» естественно передаёт установление ими фактического контроля, не добавляя прямо не названного объекта правления.
- source_word: οἱ παῖδες αὐτοῦ
  choice: его слуги
  rationale: παῖδες допускает значения «дети/сыновья» и «слуги». В ближайшем историческом контексте речь идёт о приближённых и военачальниках Александра, разделивших власть после его смерти, поэтому выбрано «слуги»; лексическая неоднозначность отмечена в сноске.
- source_word: ἕκαστος
  choice: каждый
  rationale: Сохранено обычное распределительное значение греческого слова.
- source_word: ἐν τῷ τόπῳ αὐτοῦ
  choice: в своей области
  rationale: Буквально τόπος — «место», но здесь слово, вероятнее всего, обозначает область, в которой каждый преемник установил власть. «В своей области» понятно современному читателю и сохраняет некоторую широту значения.
