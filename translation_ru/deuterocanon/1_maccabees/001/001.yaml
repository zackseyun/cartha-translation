base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/001.yaml
  text: And it happened[a], after Alexander the Macedonian, the son of Philip, who had come out from the land of Kittim, struck down Darius king of the Persians and Medes, that he reigned in his place[b], having first reigned over Greece.
translation:
  language: ru
  text: 'И случилось так: после того как Александр Македонский, сын Филиппа, вышедший из земли Киттим[a], поразил[b] Дария, царя персов и мидян, он воцарился вместо него, прежде царствовав над Грецией.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Киттим — традиционное библейское название. В зависимости от контекста оно может обозначать Кипр или, шире, западные земли.
    reason: cultural_note
  - marker: b
    text: 'Или: «победил», «разгромил». Греческий глагол буквально означает «поразил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: И случилось так
  rationale: Сохранена повествовательная формула, но без архаичного «и было»; двоеточие естественно вводит последующее историческое сообщение.
- source_word: μετὰ τὸ πατάξαι
  choice: после того как ... поразил
  rationale: Конструкция с μετά и субстантивированным инфинитивом обозначает предшествующее событие; «поразил» сохраняет и военную силу глагола, и возможность понимать его как «разгромил».
- source_word: Ἀλέξανδρον τὸν Φιλίππου τὸν Μακεδόνα
  choice: Александр Македонский, сын Филиппа
  rationale: Сохранены и географическо-этническое обозначение, и происхождение; порядок приспособлен к естественному русскому употреблению.
- source_word: ἐξῆλθεν ἐκ τῆς γῆς Χεττιείμ
  choice: вышедший из земли Киттим
  rationale: Причастный оборот передаёт относительное придаточное и направительное значение ἐξέρχομαι, не сводя топоним к конкретной современной территории.
- source_word: Χεττιείμ
  choice: Киттим
  rationale: Сохранён традиционный библейский топоним посредством транслитерации; более конкретные отождествления не вносятся в основной текст.
- source_word: ἐπάταξεν
  choice: поразил
  rationale: Русское «поразил» сохраняет буквальную ударную образность πατάσσω и допускает контекстуальный смысл военной победы.
- source_word: ἐβασίλευσεν ἀντʼ αὐτοῦ
  choice: воцарился вместо него
  rationale: Переданы как начало/принятие царской власти, так и смысл преемства по отношению к Дарию.
- source_word: πρότερον ἐπὶ τὴν Ἑλλάδα
  choice: прежде царствовав над Грецией
  rationale: πρότερον передано как временное «прежде», а управление царской властью над Грецией выражено естественным русским оборотом.
theological_decisions:
- issue: Историко-географическое значение Χεττιείμ
  choice: Киттим
  alternative: Кипр; Македония; западные земли
  rationale: Греческий текст сохраняет традиционный библейский топоним, исторический охват которого неоднозначен; основной текст не должен молча выбирать одно из возможных отождествлений.
- issue: Военное значение πατάσσω
  choice: поразил
  alternative: победил; разгромил
  rationale: Выбор сохраняет буквальную силу глагола и одновременно не исключает его контекстуального значения «одержал победу над».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным историко-библейским звучанием. Синтаксис сделан понятным для широкого читателя, при этом сохранены повествовательная формула, все идентификаторы Александра и неоднозначность топонима и военного глагола.
