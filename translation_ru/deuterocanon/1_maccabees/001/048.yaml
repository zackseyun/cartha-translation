lexical_decisions:
- source_word: ἀφεῖναι
  choice: оставлять
  rationale: В данном контексте ἀφίημι означает оставлять кого-либо в определённом состоянии; русский несовершенный инфинитив естественно передаёт содержание предписания в продолжающемся перечне.
- source_word: τοὺς υἱοὺς αὐτῶν
  choice: их сыновей
  rationale: υἱοί обозначает именно сыновей, что также соответствует упоминанию обрезания.
- source_word: ἀπεριτμήτους
  choice: необрезанными
  rationale: Прямой и общепринятый эквивалент, сохраняющий заветное и обрядовое значение слова.
- source_word: βδελύξαι
  choice: осквернять
  rationale: Глагол выражает как осквернение, так и превращение во что-либо отвратительное; в сочетании с ἀκάθαρτος «осквернять» звучит естественно и передаёт обрядово-нравственный смысл, а более буквальный оттенок отмечен в сноске.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: их души
  rationale: ψυχή может означать душу, жизнь или самого человека; «души» сохраняет религиозно-нравственную весомость контекста и не устраняет лексическую многозначность полностью.
- source_word: ἐν παντὶ ἀκαθάρτῳ
  choice: всем нечистым
  rationale: 'Фраза допускает инструментальное понимание: осквернять посредством всего нечистого. Такая формулировка кратка и естественна по-русски.'
- source_word: βεβηλώσαι
  choice: лишать их святости
  rationale: βεβηλόω означает делать несвященным, профанировать или осквернять. Выбранная формулировка отличает этот глагол от предшествующего βδελύξαι и понятна современному читателю.
theological_decisions:
- issue: Значение ψυχή в обрядово-заветном контексте
  choice: их души
  alternative: их самих; их жизнь
  rationale: «Души» сохраняет нравственную и религиозную напряжённость текста, тогда как «жизнь» здесь слишком слабо, а «их самих» снимает образность оригинала.
- issue: Соотношение осквернения и утраты святости
  choice: осквернять их души… и лишать их святости
  alternative: делать их души мерзостными… и профанировать их
  rationale: Перевод сохраняет два отдельных действия и не сводит βδελύξαι и βεβηλώσαι к одному русскому глаголу, избегая при этом малопонятного в данном контексте «профанировать».
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Сохранена синтаксическая форма продолжающегося перечня инфинитивов; терминологически тяжёлое «профанировать» заменено понятным выражением «лишать святости».
