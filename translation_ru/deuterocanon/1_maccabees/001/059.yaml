base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/059.yaml
  text: And on the twenty-fifth day of the month they were sacrificing on the altar that was upon the altar of burnt offering[a].
translation:
  language: ru
  text: И в двадцать пятый день месяца они приносили жертвы на жертвеннике, стоявшем на алтаре всесожжения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь употреблены два разных слова: «жертвенник» (βωμός) и «алтарь всесожжения» (θυσιαστήριον), то есть один жертвенник был поставлен на храмовом алтаре.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμπτῃ καὶ εἰκάδι
  choice: в двадцать пятый день
  rationale: Греческая формула обозначает двадцать пятый день месяца; выбран естественный современный русский способ указания даты.
- source_word: τοῦ μηνός
  choice: месяца
  rationale: Родительный падеж входит в формулу даты и естественно передаётся сочетанием «в двадцать пятый день месяца».
- source_word: θυσιάζοντες
  choice: они приносили жертвы
  rationale: Причастие передано личной глагольной формой ради естественного русского повествования; несовершенный вид сохраняет значение продолжавшегося или повторявшегося культового действия.
- source_word: ἐπὶ τὸν βωμόν
  choice: на жертвеннике
  rationale: ἐπί с винительным здесь указывает на поверхность, на которой совершалось жертвоприношение.
- source_word: βωμός
  choice: жертвенник
  rationale: Отдельный термин передан словом «жертвенник», чтобы сохранить его отличие от θυσιαστήριον в пределах одного стиха, не добавляя прямо не выраженного определения «языческий».
- source_word: θυσιαστήριον
  choice: алтарь всесожжения
  rationale: В храмовом контексте это обозначение основного жертвенного алтаря; уточнение «всесожжения» сохраняет различие двух греческих культовых терминов и делает пространственное отношение понятным.
theological_decisions:
- issue: Различие между βωμός и θυσιαστήριον в контексте осквернения храма
  choice: Передать βωμός как «жертвенник», а θυσιαστήριον как «алтарь всесожжения»
  alternative: Передать оба слова как «жертвенник» либо назвать βωμός «языческим жертвенником»
  rationale: Греческий текст намеренно употребляет два разных культовых слова и, вероятно, описывает дополнительный жертвенник, поставленный на главном храмовом алтаре. Перевод сохраняет это различие, но не вносит в основной текст контекстуально вероятное, однако прямо не выраженное определение «языческий».
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Различие двух греческих культовых терминов сохранено без конфессионально обусловленного толкования.
