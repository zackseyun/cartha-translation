base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/043.yaml
  text: And many from Israel approved of his worship[a], and they sacrificed to the idols and profaned the Sabbath.
translation:
  language: ru
  text: И многие из Израиля одобрили его богослужение[a], принесли жертвы идолам и осквернили субботу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласились с его богослужением»; возможно также: «нашли удовольствие в его богослужении».'
    reason: Глагол ηὐδόκησαν может обозначать одобрение, согласие или удовольствие; αὐτοῦ буквально означает «его» и не уточняет в самой фразе характер этой связи.
lexical_decisions:
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: многие из Израиля
  rationale: Сохраняет выраженную предлогом ἀπό принадлежность к народу Израиля и естественно звучит по-русски.
- source_word: ηὐδόκησαν
  choice: одобрили
  rationale: Передаёт сознательное согласие и принятие, не усиливая значение до эмоционального удовольствия.
- source_word: τῇ λατρίᾳ αὐτοῦ
  choice: введённое им богослужение
  rationale: λατρεία обозначает религиозное служение или культ; добавление «введённое» естественно проясняет, что речь о насаждаемом им порядке богопочитания, а не о поклонении самому царю.
- source_word: ἔθυσαν τοῖς εἰδώλοις
  choice: приносили жертвы идолам
  rationale: Обычная русская формулировка культового действия, точно передающая глагол θύω и дательный падеж адресата.
- source_word: ἐβεβήλωσαν τὸ σάββατον
  choice: оскверняли субботу
  rationale: Передаёт нарушение святости субботы; несовершенный вид по-русски естественно согласуется с перечислением практик, хотя греческие формы аориста суммарно представляют совершившиеся действия.
theological_decisions:
- issue: Значение λατρεία применительно к насаждаемой царём языческой религии
  choice: введённое им богослужение
  alternative: его богослужение; его культ; служение ему
  rationale: В контексте речь идёт о принятии установленного царём религиозного порядка. Формулировка сохраняет культовый смысл, не создавая ненужного впечатления, будто объектом поклонения непременно был сам царь.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью без архаизмов. «Богослужение» доступнее и нейтральнее слова «культ»; «суббота» пишется со строчной буквы по нормам русского языка.
