lexical_decisions:
- source_word: κατὰ τὴν δόξαν αὐτῆς
  choice: По мере её славы
  rationale: κατά с винительным падежом выражает соразмерность или соответствие. «По мере» естественно передаёт связь между прежней славой города и возрастанием его бесчестья, сохраняя возможный оттенок «сообразно её славе».
- source_word: ἐπληθύνθη
  choice: умножалось
  rationale: Глагол обозначает увеличение, умножение. Русское несовершенное прошедшее естественно описывает нарастание состояния и сохраняет возвышенный строй фразы.
- source_word: ἀτιμασμός
  choice: бесчестье
  rationale: Слово означает лишение чести, позор или унижение. «Бесчестье» образует ясный смысловой контраст со «славой» и сохраняет отвлечённое существительное оригинала.
- source_word: τὸ ὕψος αὐτῆς
  choice: её возвышение
  rationale: ὕψος буквально означает высоту, но здесь в контексте судьбы Иерусалима естественно воспринимается как высокое, почётное положение. «Возвышение» сохраняет метафору высоты и не сводит выражение только к славе.
- source_word: ἐστράφη εἰς πένθος
  choice: обратилось в скорбь
  rationale: Оборот передаёт превращение одного состояния в другое. «Обратилось в скорбь» точно и литературно сохраняет образ резкого перелома.
