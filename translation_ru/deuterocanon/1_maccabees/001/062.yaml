  terminology: '«Осквернённой пищи» уместно в ритуальном контексте и удачно не смешивает κοινός с ἀκάθαρτος. В сноске лучше говорить «буквально: „осквернённого/общего“» и пояснить, что подразумевается пища, а не утверждать, будто греческое слово буквально означает «общее» в форме, эквивалентной русскому существительному «пища».'
