  source_fidelity: 'Основной смысл передан верно: πολλοὶ ἐν Ἰσραήλ — «многие в Израиле», два усилительных глагола сохранены, а τοῦ μὴ φαγεῖν передано целевым оборотом. Однако «между собой» для ἐν αὐτοῖς по-русски создаёт неестественный и чрезмерно конкретный оттенок взаимного действия; греческий оборот лучше оставить как «в себе» / «в самих себе», отметив возможное «среди них» в сноске. Кроме того, κοινά — субстантивированное среднее множественного числа («осквернённого/обычного»), а не прямо «пища»; добавление «пищи» оправдано контекстом, но буквальное значение в сноске следует сформулировать грамматически точно.'
