  text: And many in Israel stood firm and were strengthened among themselves so as not to eat defiled food;[a]
translation:
  language: ru
  text: И многие в Израиле проявили твёрдость и укрепились в себе, чтобы не есть осквернённой пищи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение, переведённое как «укрепились в себе», может также означать «укрепились среди них». «Осквернённой пищи» — буквально «осквернённого» или «общего»; в данном контексте подразумевается пища, считавшаяся ритуально неприемлемой.
    reason: Сохранение неоднозначности ἐν αὐτοῖς и пояснение ритуального значения κοινά.
lexical_decisions:
- source_word: πολλοὶ ἐν Ἰσραήλ
  choice: многие в Израиле
  rationale: Сохраняет краткую количественную формулировку и естественный для русского языка оборот без добавления слова «люди».
- source_word: ἐκραταιώθησαν
  choice: проявили твёрдость
  rationale: Передаёт образ обретённой силы и стойкости в данном контексте сопротивления, не сводя глагол лишь к внутренней решимости.
- source_word: ὠχυρώθησαν
  choice: укрепились
  rationale: Сохраняет второй, близкий по смыслу глагол и риторическое удвоение исходного текста.
- source_word: ἐν αὐτοῖς
  choice: между собой
  rationale: Понимает сжатое выражение как указание на взаимную поддержку и сплочённость многих израильтян; неоднозначность отмечена в сноске.
- source_word: τοῦ μὴ φαγεῖν
  choice: чтобы не есть
  rationale: Естественно передаёт целевое значение артиклевого инфинитива с отрицанием.
- source_word: κοινά
  choice: осквернённой пищи
  rationale: В контексте иудейских пищевых установлений κοινός обозначает пищу, считавшуюся ритуально осквернённой, а не просто обычной; слово «пища» ясно выражает подразумеваемый объект.
theological_decisions:
- issue: Ритуальный смысл κοινά в контексте пищевых установлений
  choice: осквернённой пищи
  alternative: 'нечистой пищи; буквально: обычного, общего'
  rationale: «Осквернённой» отличает κοινός от более прямого ἀκάθαρτος и сохраняет ритуальный смысл, не вводя лишней конфессиональной терминологии.
- issue: Неоднозначное ἐν αὐτοῖς
  choice: между собой
  alternative: в себе; среди них
  rationale: Контекст допускает указание на взаимное укрепление группы, однако греческий оборот сжат и может быть понят как внутреннее укрепление каждого; эта неоднозначность не скрыта, а вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Риторическое сочетание двух близких глаголов сохранено; синтаксис остаётся ясным для обычного читателя.
