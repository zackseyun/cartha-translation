  text: И построили они в Иерусалиме гимнасий по обычаям народов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «язычников». По-гречески буквально: «народов»; в иудейской речи так обычно называли нееврейские народы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: построили
  rationale: Аорист прямо обозначает завершённое действие строительства; «построили» естественно и точно передаёт конкретное действие.
- source_word: γυμνάσιον
  choice: гимнасий
  rationale: Речь идёт о специфическом эллинистическом учреждении, а не просто о месте для физических упражнений. Исторический термин «гимнасий» сохраняет культурную конкретность.
- source_word: ἐν Ἱεροσολύμοις
  choice: в Иерусалиме
  rationale: Естественная современная русская передача локативного оборота.
- source_word: κατὰ
  choice: по
  rationale: Предлог выражает соответствие образцу; в сочетании «по обычаям» краткая русская форма звучит естественно и сохраняет смысл.
- source_word: τὰ νόμιμα
  choice: обычаям
  rationale: В данном контексте слово указывает на принятые установления и практики, а не только на формальные законы.
- source_word: τῶν ἐθνῶν
  choice: других народов
  rationale: Греческое выражение буквально означает «народов», но в иудейском контексте обозначает нееврейские народы. Добавление «других» естественно обозначает это противопоставление без более конфессионально окрашенного слова «язычники».
theological_decisions:
- issue: Передача ἐθνῶν в контексте противопоставления иудеев нееврейским народам
  choice: других народов
  alternative: язычников
  rationale: Выбранная передача сохраняет основное лексическое значение и контекстное противопоставление, не усиливая отрицательной оценки, которой само греческое слово здесь прямо не выражает.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Историко-культурный термин «гимнасий» сохранён ради точности; синтаксис сделан ясным и естественным.
