base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/006.yaml
  text: And he called his honored servants[a], who had been brought up with him from youth, and divided his kingdom among them while he was still alive.
translation:
  language: ru
  text: И он призвал своих знатных слуг[a], которые с юности воспитывались вместе с ним, и ещё при жизни разделил между ними своё царство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово παῖδες может означать «дети», «юноши» или «слуги». Здесь уточнения «знатные» и «воспитывались вместе с ним с юности» указывают, вероятно, на доверенных придворных спутников, а не на родных сыновей.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: призвал
  rationale: Глагол означает «позвал, призвал». «Призвал» естественно передаёт созыв приближённых правителем, не добавляя излишней официальности.
- source_word: τοὺς παῖδας αὐτοῦ
  choice: своих … слуг[a]
  rationale: παῖς может означать ребёнка, юношу или слугу. Последующие определения указывают здесь на доверенных придворных, воспитывавшихся вместе с царём, а не на его родных сыновей; «слуг» сохраняет основное служебное значение слова, а примечание отмечает неоднозначность.
- source_word: ἐνδόξους
  choice: знатных
  rationale: В отношении людей слово обозначает высокое положение, известность или почёт. «Знатных» естественно для придворного контекста и не приобретает неуместного оттенка «славы».
- source_word: τοὺς συνεκτρόφους αὐτοῦ ἀπὸ νεότητος
  choice: которые с юности воспитывались вместе с ним
  rationale: Передаёт значение совместного воспитания с ранних лет, не сужая его до более специального «молочных братьев» и ясно указывая, с кем они росли.
- source_word: διεῖλεν αὐτοῖς
  choice: разделил между ними
  rationale: Глагол означает разделить или распределить; конструкция с «между ними» естественно выражает передачу частей царства нескольким лицам.
- source_word: τὴν βασιλείαν αὐτοῦ
  choice: своё царство
  rationale: Хотя βασιλεία может означать также царскую власть или царствование, возможность раздела между несколькими людьми поддерживает здесь территориально-политическое значение «царство».
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: ещё при жизни
  rationale: Кратко и естественно передаёт генитив абсолютный и подчёркивает, что раздел состоялся до его смерти.
