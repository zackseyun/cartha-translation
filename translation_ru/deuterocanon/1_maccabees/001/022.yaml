    reason: lexical_alternative
  - marker: b
    text: Греческий глагол буквально может означать «содрал» или «снял верхний слой»; вероятно, речь идёт о снятии золотой облицовки или декоративного покрытия.
    reason: lexical_alternative
lexical_decisions:
- source_word: τράπεζαν τῆς προθέσεως
  choice: стол для хлебов предложения
  rationale: В храмовом контексте πρόθεσις обозначает выставление хлебов перед Богом. Формулировка сохраняет традиционно узнаваемое «хлебы предложения», одновременно ясно указывая на назначение стола.
- source_word: σπονδεῖα
  choice: сосуды для возлияний
  rationale: Слово обозначает культовые принадлежности, связанные с возлияниями; такой перевод точен и понятен современному читателю.
- source_word: φιάλας
  choice: чаши
  rationale: φιάλη — широкая ритуальная чаша; общее русское «чаши» естественно передаёт предмет без излишней технической конкретизации.
- source_word: θυΐσκας τὰς χρυσᾶς
  choice: золотые кадильницы
  rationale: Речь идёт о золотых приспособлениях для воскурения благовоний; «кадильницы» — краткий и узнаваемый храмовый термин.
- source_word: καταπέτασμα
  choice: завесу
  rationale: Слово обозначает храмовую завесу; этот вариант точен, естественен и сохраняет культовый оттенок.
- source_word: στεφάνους
  choice: венцы
  rationale: В данном перечне στέφανοι, вероятно, являются декоративными венцами. «Венцы» сохраняет предметную неоднозначность лучше, чем пояснительное «украшения».
- source_word: κόσμον τὸν χρυσοῦν
  choice: золотое украшение
  rationale: κόσμος здесь означает убранство или украшение, а не «мир»; единственное число соответствует греческой форме.
- source_word: κατὰ πρόσωπον τοῦ ναοῦ
  choice: на фасаде храма
  rationale: В контексте снятия архитектурного убранства выражение естественно указывает на лицевую сторону храма. «На фасаде» ясно передаёт пространственный смысл, хотя буквально возможно «перед храмом».
- source_word: ἐλέπισεν πάντα
  choice: всё это он ободрал
  rationale: Глагол выражает соскабливание, сдирание или снятие наружного слоя; «ободрал» сохраняет резкий физический образ удаления золотой облицовки или отделки.
