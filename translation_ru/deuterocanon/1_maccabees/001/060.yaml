lexical_decisions:
- source_word: περιτετμηκυίας
  choice: обрезавших
  rationale: Перфектное действительное причастие женского рода множественного числа представляет женщин как совершивших обрезание или распорядившихся его совершить. Русское действительное причастие сохраняет форму и завершённость действия, а возможный каузативный оттенок отмечен в сноске.
- source_word: τὰ τέκνα αὐτῶν
  choice: своих детей
  rationale: τέκνα означает «детей». Возвратное «своих» естественно по-русски соотносит детей с женщинами и не сужает значение до «сыновей», хотя по контексту речь идёт о мальчиках.
- source_word: ἐθανάτωσαν
  choice: предавали смерти
  rationale: Глагол означает причинить смерть, умертвить. «Предавали смерти» соответствует официальному характеру преследования и не добавляет явно судебного смысла слова «казнили».
- source_word: κατὰ τὸ πρόσταγμα
  choice: согласно указу
  rationale: πρόσταγμα обозначает властное предписание, приказ или указ. В контексте официальной политики «указ» передаёт формальный характер распоряжения.
theological_decisions:
- issue: Степень непосредственного участия женщин в обрезании детей
  choice: Женщины названы «обрезавшими своих детей».
  alternative: Женщины велели обрезать своих детей или устроили их обрезание.
  rationale: Действительное причастие поддерживает прямую формулировку, но может охватывать действие, совершённое по распоряжению женщин; эта подлинная неоднозначность сохранена сноской.
- issue: Объём значения τέκνα в контексте обрезания
  choice: «детей»
  alternative: «сыновей»
  rationale: Хотя обрезанию подвергались лица мужского пола, греческий текст использует более широкое слово τέκνα. Перевод не вносит отсутствующего в форме существительного уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис следует греческому порядку мысли; запятая в конце сохранена, поскольку стих продолжается в следующем контексте.
