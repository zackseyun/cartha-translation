  text: to build altars and shrines and idols[a], and to sacrifice swine and unclean animals,
translation:
  language: ru
  text: воздвигать жертвенники, святилища и идолов и приносить в жертву свиней и нечистый[a] скот,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обычный скот»; греческое слово может означать «обычный, общий», но здесь, вероятно, указывает на ритуальную нечистоту.'
    reason: Лексическая альтернатива для κοινά.
lexical_decisions:
- source_word: οἰκοδομῆσαι
  choice: воздвигать
  rationale: Инфинитив продолжает перечень предписанных действий. «Воздвигать» естественно сочетается с культовыми сооружениями и идолами и сохраняет возвышенный повествовательный регистр.
- source_word: βωμούς
  choice: жертвенники
  rationale: βωμός обозначает сооружение для жертвоприношений; «жертвенники» — прямой и привычный русский эквивалент.
- source_word: τεμένη
  choice: святилища
  rationale: τέμενος означает посвящённое божеству место или священный участок. «Святилища» понятно современному читателю и не перегружает текст техническим выражением «священные участки».
- source_word: εἴδωλα
  choice: идолов
  rationale: В данном иудейском полемическом контексте речь идёт о предметах языческого поклонения, поэтому «идолы» точнее нейтрального «изображения».
- source_word: θύειν
  choice: приносить в жертву
  rationale: Передаёт культовое значение глагола θύω и естественно сочетается с названиями жертвенных животных.
- source_word: ὕεια
  choice: свиней
  rationale: Форма обозначает свиней; современное русское слово ясно передаёт смысл без ненужной архаизации.
- source_word: κτῆνη κοινά
  choice: нечистый скот
  rationale: κτῆνη здесь обозначает домашних животных или скот, а κοινά в иудейском контексте ритуальной чистоты имеет смысл «нечистый, осквернённый». Сноска сохраняет буквальную лексическую возможность «обычный».
theological_decisions:
- issue: Значение κοινά в контексте иудейских предписаний о чистоте
  choice: нечистый скот
  alternative: обычный скот
  rationale: Основное значение κοινός — «общий, обычный», однако в эллинистическом иудейском употреблении слово часто обозначает ритуальную нечистоту. Контекст насаждения противных Торе культовых практик поддерживает перевод «нечистый», а сноска сохраняет подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инфинитивная конструкция сохранена, поскольку стих синтаксически продолжает предшествующее повеление. Запятая в конце отражает продолжение предложения в следующем стихе.
