translation:
  language: ru
  text: И чтобы каждый оставил свои обычаи[a]. И все народы подчинились слову царя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои законы»; «свои традиционные обычаи». Греческое τὰ νόμιμα может обозначать традиционные правовые и религиозные нормы и обряды.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «повелению царя»; «указу царя». Буквально по-гречески: «слову царя»; оборот также может означать «по слову царя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείπειν
  choice: оставил
  rationale: Инфинитив выражает отказ от прежних установлений; «оставил» естественно передаёт это в контексте царского требования, не добавляя оттенков сверх греческого текста.
- source_word: ἕκαστον
  choice: каждый
  rationale: Сохраняет распределительное значение формы единственного числа.
- source_word: τὰ νόμιμα αὐτοῦ
  choice: свои установления
  rationale: νόμιμα охватывает традиционные правовые и религиозные нормы и обычаи. «Установления» сохраняет этот широкий смысл лучше, чем только «законы» или только «обычаи».
- source_word: ἐπεδέξαντο
  choice: приняли
  rationale: Передаёт основное значение «принять, одобрить», оставляя контексту оттенок подчинения царскому распоряжению.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: Нейтрально обозначает все подвластные царю народы; перевод «язычники» внёс бы не обязательное здесь противопоставление.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: слово царя
  rationale: Близко следует греческому λόγος, при этом контекст позволяет понимать его как царское повеление или указ.
