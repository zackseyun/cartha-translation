translation_notes:
  register: Современный литературный русский язык с краткой, официально-повествовательной формулировкой. Оборот «по слову царя» намеренно сохраняет лексику и некоторую неоднозначность греческого текста; «тот» добавлено для естественной русской коррелятивной конструкции. Буква «ё» употреблена последовательно.
