translation:
  language: ru
  text: И всякий, кто не поступит по слову царя, умрёт[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не исполнит приказа царя». Буквально в греческом тексте: «не поступит по слову царя»; в данном контексте речь идёт о его приказе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ ποιήσῃ
  choice: кто не поступит
  rationale: Неопределённо-обобщающая конструкция с ἄν и аористом сослагательного наклонения означает «кто бы ни» / «всякий, кто». В данном контексте ποιέω обозначает исполнение царского распоряжения; «не поступит» естественно по-русски и сохраняет связь с последующим оборотом «по слову».
- source_word: κατὰ τὸ ῥῆμα
  choice: по слову
  rationale: ῥῆμα буквально означает «слово, высказывание»; в контексте царского предписания оно подразумевает приказ. «По слову» сохраняет образ и менее конкретно, чем «по приказу», не устраняя лексическую неоднозначность оригинала.
- source_word: τοῦ βασιλέως
  choice: царя
  rationale: Обычный родительный падеж, обозначающий принадлежность слова или распоряжения царю; «царя» — точный и естественный русский эквивалент.
- source_word: ἀποθανεῖται
  choice: умрёт
  rationale: Будущая форма ἀποθνῄσκω непосредственно означает «умрёт». Контекст подразумевает смертную казнь, однако исполнитель действия в греческом тексте не назван, поэтому перевод не уточняет «будет казнён».
