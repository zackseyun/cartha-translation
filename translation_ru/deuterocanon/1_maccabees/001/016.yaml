  yaml_path: translation/deuterocanon/1_maccabees/001/016.yaml
  text: And the kingdom was established before Antiochus[a], and he undertook to rule the land of Egypt, so that he might rule over the two kingdoms.
translation:
  language: ru
  text: И царство утвердилось за Антиохом[a], и он вознамерился царствовать над Египетской землёй, чтобы царствовать над двумя царствами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «царство было приготовлено перед Антиохом». Греческое выражение может означать, что его власть была закреплена за ним прежде, чем он обратился к Египту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡτοιμάσθη
  choice: утвердилось
  rationale: Пассивная форма буквально означает «было приготовлено, приведено в готовность», но в данном политическом контексте указывает на то, что царство было устроено или закреплено за Антиохом. «Утвердилось» естественно передаёт этот смысл, не превращая его в подробное толкование.
- source_word: ἡ βασιλεία
  choice: царство
  rationale: Слово может означать как царскую власть или царствование, так и царство. Упоминание далее «двух царств» поддерживает конкретное значение «царство», при этом оттенок царской власти сохраняется контекстом.
- source_word: ἐνώπιον Ἀντιόχου
  choice: за Антиохом
  rationale: Буквально — «перед Антиохом». В сочетании с глаголом ἡτοιμάσθη выражение, вероятно, означает, что царство было закреплено или обеспечено за ним. Русское «утвердилось за Антиохом» передаёт этот политический смысл; буквальная форма отмечена в сноске.
- source_word: ὑπέλαβεν
  choice: вознамерился
  rationale: С инфинитивом глагол обозначает принятие намерения или предприятия. «Вознамерился» ясно выражает замысел Антиоха овладеть царской властью над Египтом, не утверждая заранее успешность его действий.
- source_word: βασιλεῦσαι
  choice: царствовать
  rationale: Глагол обозначает осуществление царской власти. «Царствовать над» естественно сочетается с территорией и сохраняет повтор того же греческого глагола далее в стихе.
- source_word: γῆς Αἰγύπτου
  choice: над Египетской землёй
  rationale: Сохраняется территориальный акцент греческого выражения «земля Египта»; форма «Египетская земля» звучит в русском литературно и понятно.
- source_word: ὅπως
  choice: чтобы
  rationale: Союз вводит цель; «чтобы» прямо и естественно передаёт целевое значение.
- source_word: ἐπὶ τὰς δύο βασιλείας
  choice: над двумя царствами
  rationale: Прямо передаёт власть над двумя отдельными царствами — уже принадлежавшим Антиоху и Египтом — без добавления отсутствующего в тексте пояснения.
