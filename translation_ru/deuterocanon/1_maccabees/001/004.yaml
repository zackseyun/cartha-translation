  source_fidelity: 'Основной текст в целом точно передаёт военную силу, начало правления и подчинение дани. Однако «сделались его данниками» менее естественно относится ко всему смешанному перечню стран, народов и политических образований; «стали платить ему дань» яснее передаёт εἰς φόρον. Сноска неточно называет «тиранические владения» буквальным переводом: буквальное соответствие — «тирании», тогда как территориальное значение является контекстуальным толкованием.'
