lexical_decisions:
- source_word: συνῆξεν δύναμιν ἰσχυρὰν σφόδρα
  choice: собрал чрезвычайно сильное войско
  rationale: В данном военном контексте δύναμις обозначает вооружённую силу; русское «войско» естественно передаёт смысл, а «чрезвычайно сильное» сохраняет усиление ἰσχυρὰν σφόδρα.
- source_word: ἦρξεν
  choice: стал властвовать
  rationale: ἄρχω с родительным падежом означает «властвовать над»; «стал» передаёт возможный начинательный оттенок аориста, не сводя глагол к нейтральному обладанию.
- source_word: χωρῶν
  choice: странами
  rationale: χώρα здесь означает территории или земли; «страны» естественно в историко-политическом перечислении и не обязательно подразумевает современные национальные государства.
- source_word: ἐθνῶν
  choice: народами
  rationale: ἔθνη обозначает покорённые народы; «народы» точнее отличает людей от предшествующих территорий.
- source_word: τυραννιῶν
  choice: владениями
  rationale: Слово обозначает области или государства, находящиеся под властью тиранов. «Владения» звучит естественно по-русски и сохраняет политико-территориальный смысл; буквальная связь с тиранической властью отмечена в сноске.
- source_word: ἐγένοντο αὐτῷ εἰς φόρον
  choice: они сделались его данниками
  rationale: Оборот выражает переход под обязанность платить дань. «Сделались его данниками» передаёт как возникшее состояние, так и политико-фискальное подчинение.
