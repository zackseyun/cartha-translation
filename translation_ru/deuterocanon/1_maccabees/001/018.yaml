  text: And he waged war against Ptolemy the king of Egypt[a]; and Ptolemy was routed before him and fled[b], and many fell wounded.
translation:
  language: ru
  text: И он вступил в войну с Птолемеем, царём Египта. Птолемей отступил перед ним[a] и бежал, и многие пали ранеными[b].
