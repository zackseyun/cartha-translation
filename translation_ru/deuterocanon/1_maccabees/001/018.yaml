    reason: lexical_alternative
lexical_decisions:
- source_word: συνεστήσατο πόλεμον
  choice: вступил в войну
  rationale: Выражение означает начало и ведение военного противостояния. Такой перевод естественен по-русски и не сводит смысл лишь к формальному объявлению войны.
- source_word: πρὸς Πτολεμαῖον
  choice: с Птолемеем
  rationale: При слове «война» предлог обозначает противника; русское сочетание «вступить в войну с кем-либо» естественно передаёт враждебную направленность.
- source_word: ἐνετράπη
  choice: отступил
  rationale: В военном контексте глагол может означать, что войско повернули назад, обратили в бегство или разбили. «Отступил» сохраняет образ движения назад и не усиливает степень поражения сверх бесспорного.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: перед ним
  rationale: Идиома описывает отступление перед лицом противника. «Перед ним» кратко и естественно сохраняет этот пространственный образ.
- source_word: ἔφυγεν
  choice: бежал
  rationale: Глагол прямо обозначает бегство с поля боя; «бежал» ясно и стилистически уместно.
- source_word: ἔπεσαν
  choice: пали
  rationale: Сохранён обычный для описания битвы образ падения; перевод не утверждает прямо, что все упомянутые погибли.
- source_word: τραυματίαι πολλοί
  choice: многие пали ранеными
  rationale: Сочетание указывает на многочисленных раненых или поражённых в бою. Формулировка сохраняет связь между падением и ранением, а возможная неоднозначность поясняется в сноске.
