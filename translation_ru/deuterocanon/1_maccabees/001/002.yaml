  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεστήσατο
  choice: вёл
  rationale: В сочетании с πολέμους глагол обозначает ведение войн; «вёл» естественно по-русски и не сужает значение до одного лишь начала военных действий.
- source_word: πολέμους πολλούς
  choice: многочисленные войны
  rationale: Сохраняет широкое значение военных конфликтов во множественном числе; «походы» было бы более истолковывающим, а «сражения» — слишком узким.
- source_word: ἐκράτησεν
  choice: захватывал
  rationale: В военном контексте глагол означает овладение укреплёнными местами. Несовершенный вид по-русски согласует перечисление деяний в рамках повествовательной характеристики.
- source_word: ὀχυρωμάτων
  choice: крепости
  rationale: Передаёт укреплённые места кратким и естественным современным русским словом.
- source_word: ἔσφαξεν
  choice: уничтожал
  rationale: Передаёт насильственное лишение жизни без архаического оттенка; при этом несколько смягчает буквальную кровавую окраску σφάζω ради естественности литературного русского повествования.
- source_word: βασιλεῖς
  choice: царей
  rationale: Сохраняет конкретный монархический титул греческого текста.
