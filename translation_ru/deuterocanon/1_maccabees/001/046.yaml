  source_fidelity: '«И осквернять святилище и святых» точно передаёт греческую конструкцию καὶ μιᾶναι ἁγίασμα καὶ ἁγίους: сохранены союзное продолжение перечня, инфинитив и два прямых дополнения. «Осквернять» хорошо выражает культовую семантику μιᾶναι; «святилище» точно соответствует ἁγίασμα. ἁγίους — винительный падеж мужского рода множественного числа, субстантивированное прилагательное; «святых» сохраняет отнесённость к лицам и не конкретизирует группу.'
