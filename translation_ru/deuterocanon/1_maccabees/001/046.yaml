  text: and to defile the sanctuary and the holy ones;[a]
translation:
  language: ru
  text: и осквернять святилище и святых[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвящённых Богу людей» или «святой народ». Греческий текст буквально говорит: «святых».'
    reason: Лексическая альтернатива поясняет, что субстантивированное прилагательное, вероятнее всего, обозначает людей, не определяя конкретную группу.
lexical_decisions:
- source_word: μιᾶναι
  choice: осквернять
  rationale: Инфинитив означает делать ритуально или нравственно нечистым; «осквернять» естественно передаёт культовый смысл и сочетается как со святилищем, так и с людьми.
- source_word: ἁγίασμα
  choice: святилище
  rationale: В контексте гонений на иудейское богослужение слово обозначает священное пространство храма; «святилище» — точный и естественный русский эквивалент.
- source_word: ἁγίους
  choice: святых
  rationale: Форма мужского рода во множественном числе, употреблённая субстантивированно, вероятнее всего относится к людям. «Святых» сохраняет буквальный смысл и грамматическую неопределённость относительно конкретной группы.
theological_decisions:
- issue: К кому относится ἁγίους
  choice: к посвящённым Богу людям («святым»)
  alternative: «святому народу»; менее вероятно — «священным предметам»
  rationale: Мужской род множественного числа прежде всего указывает на лиц. Текст не уточняет, идёт ли речь о священниках, всём святом народе или иной группе, поэтому перевод не конкретизирует референта.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной культовой лексикой. Союз «и» и инфинитив сохранены, поскольку стих продолжает перечень предписаний из предыдущего контекста.
