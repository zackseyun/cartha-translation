lexical_decisions:
- source_word: θυρίδων
  choice: входов
  rationale: Форма θυρίδων может обозначать двери, проёмы или входы. «У входов» естественно передаёт место действия, не вводя излишне конкретных архитектурных деталей.
- source_word: οἰκιῶν
  choice: в дома
  rationale: οἰκία в данном повествовательном контексте прямо обозначает дом; сочетание «входов в дома» естественно для современного русского языка.
- source_word: πλατείαις
  choice: улицах
  rationale: πλατεῖα может обозначать широкую улицу или открытое общественное пространство. «Улицах» сохраняет более широкое значение; возможность перевода «площадях» отмечена в сноске.
- source_word: ἐθυμίων
  choice: воскуряли благовония
  rationale: θυμιάω означает сжигать ароматическое вещество как культовое приношение. «Воскуряли благовония» передаёт как физическое действие, так и его обрядовый оттенок, не уточняя объект поклонения.
- source_word: ἐπὶ ... καὶ ἐν
  choice: у ... и на
  rationale: 'Русские предлоги выбраны идиоматически по соответствующим местам: у входов и на улицах. Буквальное «на входах» звучало бы неестественно и могло бы создать ложный пространственный образ.'
