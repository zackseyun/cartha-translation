  text: And now send a hundred talents of silver, and two of his sons as hostages, so that, once released, he may not revolt from us; and we will release him.
translation:
  language: ru
  text: А теперь пришли сто талантов серебра и двух его сыновей в качестве заложников, чтобы он после освобождения не восстал против нас; и мы отпустим его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργυρίου ἑκατὸν τάλαντα
  choice: сто талантов серебра
  rationale: Сохраняет меру веса и естественно передаёт родительный оборот греческого текста.
- source_word: ὅμηρα
  choice: в заложники
  rationale: Точно передаёт требование отдать сыновей как гарантию верности.
- source_word: ἀποστατήσῃ ἀφʼ ἡμῶν
  choice: не восстал против нас
  rationale: Глагол обозначает отпадение или мятеж; в данном политическом контексте естественно «восстал против нас».
- source_word: ἀφήσομεν αὐτόν
  choice: тогда мы отпустим его
  rationale: Будущее время передаёт обещание освобождения при выполнении условия; «тогда» ясно выражает логическую связь.
theological_decisions:
- issue: Связь причастия ἀφεθείς с последующим действием
  choice: выйдя на свободу
  alternative: когда его отпустят; будучи отпущен
  rationale: 'Сохраняет временно-условный смысл: опасаются, что после освобождения он поднимет мятеж, не превращая причастие в отдельное богословское утверждение.'
translation_notes:
  register: Современный литературный русский язык с исторически уместным словом «талант». Синтаксис прямой и dignified; двукратное ἀφίημι передано разными естественными выражениями — «выйдя на свободу» и «отпустим» — без изменения смысла.
