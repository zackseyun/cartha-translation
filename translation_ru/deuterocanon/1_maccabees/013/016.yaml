revisions:
- from: А теперь пришли сто талантов серебра и двух его сыновей в заложники, чтобы, выйдя на свободу, он не восстал против нас; тогда мы отпустим его.
  to: А теперь пришли сто талантов серебра и двух его сыновей в качестве заложников, чтобы он после освобождения не восстал против нас; и мы отпустим его.
  rationale: Минимальная правка устраняет невыраженное в оригинале «тогда», уточняет значение страдательного причастия ἀφεθείς и сохраняет современный литературный, исторически уместный регистр.
