lexical_decisions:
- source_word: ἔγνω
  choice: понял
  rationale: Аорист γινώσκω обозначает осознание Симоном обмана; «понял» естественно передаёт это в современном русском.
- source_word: δόλῳ
  choice: с обманом
  rationale: Дательный падеж выражает образ действия. Формулировка сохраняет явное существительное «обман» и намеренный характер речи.
- source_word: λαλοῦσιν πρὸς αὐτόν
  choice: они говорят с ним
  rationale: Настоящее время в косвенной перспективе передаёт продолжающуюся речь, обращённую к Симону.
- source_word: πέμπει
  choice: послал
  rationale: Историческое настоящее передано русским прошедшим временем, естественным для повествования.
- source_word: τὸ ἀργύριον
  choice: деньги
  rationale: В контексте требуемого платежа ἀργύριον означает деньги, хотя буквально может обозначать серебро.
- source_word: τὰ παιδάρια
  choice: мальчиков
  rationale: παιδάρια обозначает мальчиков или юных сыновей; вариант не преувеличивает ни их малолетство, ни зрелость.
- source_word: μή ποτε
  choice: чтобы не
  rationale: Оборот вводит предотвращаемый или опасаемый результат; современная русская конструкция передаёт его без архаизации.
- source_word: ἔχθραν ἄρῃ μεγάλην
  choice: вызвать сильной вражды
  rationale: Идиома буквально говорит о «воздвижении» великой вражды; «вызвать сильную вражду» естественно передаёт причинный смысл.
- source_word: πρὸς τὸν λαόν
  choice: среди народа
  rationale: С ἔχθρα предлог πρός допускает несколько типов отношения. В контексте выбран смысл возникновения общественной враждебности среди народа, при сохранении альтернативы в примечании.
