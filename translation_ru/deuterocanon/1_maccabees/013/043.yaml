  text: In those days he encamped against Gaza and surrounded it with encampments[a], and he made a siege engine and brought it up to the city, and he struck one tower and captured it.
translation:
  language: ru
  text: В те дни он расположился лагерем против Газы, окружил её военными лагерями, соорудил осадную машину[a] и подвёл её к городу. Затем он нанёс удар по одной башне и овладел ею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гелеполу» — особый вид осадной машины; греческое слово здесь является более точным техническим термином.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Γάζαν
  choice: расположился лагерем против Газы
  rationale: Передаёт военное значение глагола «разбить лагерь» и враждебную направленность конструкции с ἐπί, не заменяя её более общим «выступил против».
- source_word: ἐκύκλωσεν αὐτὴν παρεμβολαῖς
  choice: окружил её военными лагерями
  rationale: 'Сохраняет два отдельных образа оригинала: окружение города и систему расположенных вокруг него военных лагерей.'
- source_word: ἑλέπολιν
  choice: осадную машину
  rationale: Понятное современному читателю обозначение устройства для осады города; более точный греческий технический термин пояснён в сноске.
- source_word: προσήγαγεν τῇ πόλει
  choice: подвёл её к городу
  rationale: Естественно описывает перемещение осадной машины вплотную к цели и сохраняет женский род русского слова «машина».
- source_word: ἐπάταξεν πύργον ἕνα
  choice: нанёс удар по одной башне
  rationale: Не усиливает значение глагола до «разрушил» или «пробил» и сохраняет буквальное «одна башня», не добавляя отсутствующей в греческом партитивной конструкции «одна из башен».
- source_word: κατελάβετο
  choice: овладел ею
  rationale: В военном контексте глагол означает захват; местоимение естественно относится к непосредственно названной башне, при этом не вводится новый явный объект.
