base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/022.yaml
  text: And Tryphon prepared all his cavalry to come; but on that night there was a very great snowfall[a], and he did not come because of the snow. So he broke camp and went into the Gilead region.
translation:
  language: ru
  text: Трифон приготовил всю свою конницу, чтобы выступить, но в ту ночь выпало чрезвычайно много снега, и из-за снега он не выступил. Тогда он снялся с места и пошёл в Галаадскую область.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «в Галаадитиду», то есть в область Галаад.
    reason: Сохраняет сведения об исходной греческой форме регионального названия и поясняет её значение.
lexical_decisions:
- source_word: ἡτοίμασεν
  choice: приготовил
  rationale: Прямо передаёт подготовку войска, не уточняя сверх текста характер приготовлений.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: всю свою конницу
  rationale: В военном контексте собирательное ἵππος обозначает конное войско; «конница» естественно и точно передаёт этот смысл.
- source_word: ἐλθεῖν
  choice: выступить
  rationale: В контексте военного передвижения буквальное «прийти» по-русски звучало бы неестественно; «выступить» передаёт начало намеченного движения, не добавляя цели.
- source_word: χιών πολλὴ σφόδρα
  choice: выпало чрезвычайно много снега
  rationale: Сохраняет сильное количественное усиление πολλὴ σφόδρα и выражает его естественным современным русским языком.
- source_word: οὐκ ἦλθεν διὰ τὴν χιόνα
  choice: из-за снега он не выступил
  rationale: Сохраняет прямо выраженную причинную связь, не заменяя утверждение текста более толковательным «не смог выступить».
- source_word: ἀπῆρεν
  choice: снялся с места
  rationale: Передаёт отбытие военного отряда и вероятное сворачивание стоянки, но менее конкретно, чем «снял лагерь», которого греческий текст явно не упоминает.
- source_word: Γαλααδῖτιν
  choice: Галаадскую область
  rationale: Передаёт греческое название территории понятной русской географической формой, согласующейся с традиционным именем «Галаад».
