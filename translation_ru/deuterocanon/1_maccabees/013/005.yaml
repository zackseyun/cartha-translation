lexical_decisions:
- source_word: μή μοι γένοιτο
  choice: да не случится мне
  rationale: Оптатив с отрицанием выражает решительное отвержение такой возможности; эта формула сохраняет торжественность и силу греческого выражения, оставаясь понятной по-русски.
- source_word: φείσασθαί μου τῆς ψυχῆς
  choice: щадить свою жизнь
  rationale: В данном контексте ψυχή означает жизнь человека, а не нематериальную душу; возвратное «свою» естественно передаёт греческую конструкцию с родительным падежом.
- source_word: ἐν παντὶ καιρῷ θλίψεως
  choice: во время бедствия
  rationale: Выражение обозначает время или обстоятельства тяжёлого испытания. Русское единственное число передаёт обобщённый характер греческой фразы без неестественной буквальности.
- source_word: οὐ γάρ εἰμι κρείσσων
  choice: ведь я не лучше
  rationale: κρείσσων допускает значения «лучше», «сильнее», «выше»; в сравнении Симона с погибшими братьями «лучше» естественно передаёт мысль об отсутствии у него превосходства или особого права беречь себя.
- source_word: τῶν ἀδελφῶν μου
  choice: моих братьев
  rationale: В повествовательном контексте речь идёт о родных братьях Симона, поэтому буквальное и современное «братьев» точно соответствует источнику.
