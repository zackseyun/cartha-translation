  text: And Tryphon set out from Ptolemais with a large force to enter the land of Judah[a], and Jonathan was with him in custody;
translation:
  language: ru
  text: И Трифон выступил из Птолемаиды с многочисленным войском, чтобы войти в землю Иуды, а Ионафан был с ним под стражей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в заключении»; греческое выражение может обозначать как содержание под охраной, так и заключение.'
    reason: Сохраняется смысловой диапазон ἐν φυλακῇ, а примечание даёт содержательно отличающуюся альтернативу основному переводу.
lexical_decisions:
- source_word: ἀπῆρεν
  choice: выступил
  rationale: Глагол обозначает отправление из какого-либо места; «выступил» естественно передаёт начало похода в данном военном контексте, не усиливая значение до «вторгся».
- source_word: μετὰ δυνάμεως πολλῆς
  choice: с многочисленным войском
  rationale: В повествовании о военных действиях δύναμις означает вооружённые силы, а не отвлечённую «силу»; «многочисленное войско» ясно и естественно передаёт этот смысл.
- source_word: εἰσελθεῖν εἰς γῆν Ἰούδα
  choice: чтобы войти в землю Иуды
  rationale: Инфинитив выражает цель движения. «Войти» сохраняет нейтральное значение греческого глагола, тогда как «вторгнуться» добавило бы прямо не выраженный оттенок.
- source_word: γῆν Ἰούδα
  choice: землю Иуды
  rationale: Так сохраняется географическое выражение оригинала без замены его более поздним привычным названием «Иудея».
- source_word: ἐν φυλακῇ
  choice: под стражей
  rationale: Выражение может обозначать заключение или охраняемое содержание. «Под стражей» передаёт положение Ионафана как пленника, не предполагая непременно тюремного здания.
