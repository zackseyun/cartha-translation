lexical_decisions:
- source_word: Σίμων δὲ
  choice: Симон же
  rationale: Частица δὲ обозначает мягкий повествовательный переход или лёгкое противопоставление; постпозитивное «же» естественно передаёт её без чрезмерного усиления контраста.
- source_word: παρενέβαλεν
  choice: расположился лагерем
  rationale: В военном контексте παρεμβάλλω означает разбить или расположить лагерь. Выбранная формулировка ясна современному читателю и сохраняет военный оттенок.
- source_word: ἐν Ἀδείδοις
  choice: в Адиде
  rationale: Предлог ἐν с топонимом указывает на место. Русское «в Адиде» естественно для названия поселения; форма «Адида» отражает греческий топоним Ἀδείδοις.
- source_word: κατὰ πρόσωπον
  choice: напротив
  rationale: Сочетание имеет пространственное значение — «перед лицом», «лицом к», «напротив». Здесь краткое «напротив» точно передаёт взаимное расположение.
- source_word: τοῦ πεδίου
  choice: равнины
  rationale: πεδίον обозначает ровную открытую местность, то есть равнину; этот вариант лучше географического контекста, чем «поле».
