lexical_decisions:
- source_word: Βασιλεὺς Δημήτριος
  choice: Царь Димитрий
  rationale: Передаёт имя и царский титул как начало формулы официального послания; определённый артикль в греческом отсутствует.
- source_word: Σίμωνι
  choice: Симону
  rationale: Дательный падеж обозначает адресата; форма «Симон» традиционна и естественна в русском библейском контексте.
- source_word: ἀρχιερεῖ
  choice: первосвященнику
  rationale: Точно передаёт должность адресата и согласуется с дательным падежом Σίμωνι.
- source_word: καὶ
  choice: и
  rationale: Сохраняет простое соединение двух титулов Симона.
- source_word: φίλῳ βασιλέων
  choice: другу царей
  rationale: Сохраняет придворный почётный титул и буквальное множественное число βασιλέων, не сводя выражение к более толковательному «царскому другу».
