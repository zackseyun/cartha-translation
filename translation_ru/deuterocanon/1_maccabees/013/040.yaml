lexical_decisions:
- source_word: ἐπιτήδειοι
  choice: пригодные
  rationale: Сохраняет значение соответствия или пригодности, не уточняя сверх текста юридические требования либо расположенность к стороне говорящего.
- source_word: γράφηναι
  choice: для внесения в списки
  rationale: Передаёт административный смысл записи и естественно сочетается с последующим императивом ἐγγραφέσθωσαν.
- source_word: τοὺς περὶ ἡμᾶς
  choice: наших людей
  rationale: В данном политико-административном контексте оборот, буквально означающий «тех, кто вокруг нас», вероятно, обозначает людей или сторонников говорящего; сноска сохраняет буквальную форму и неоднозначность.
- source_word: ἐγγραφέσθωσαν
  choice: пусть их внесут
  rationale: Продолжает административный образ официального внесения в списки, избегая тяжеловесного повтора полного выражения.
- source_word: γενέσθω ἀνὰ μέσον ἡμῶν εἰρήνη
  choice: и пусть между нами будет мир
  rationale: Естественная современная передача стандартной формулы мира с сохранением взаимного смысла «между нами».
