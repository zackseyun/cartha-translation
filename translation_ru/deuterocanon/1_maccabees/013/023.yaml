  text: But when he came near to Baskama, he killed Jonathan, and he was buried there.
translation:
  language: ru
  text: Когда же он приблизился к Баскаме, то убил Ионафана, и тот был там похоронен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Когда же
  rationale: Передаёт переход к следующему событию и лёгкое повествовательное противопоставление без его усиления.
- source_word: ἤγγισεν
  choice: приблизился к
  rationale: Точно передаёт аорист ἐγγίζω со значением приближения к месту и естественно звучит по-русски.
- source_word: τῆς Βασκαμά
  choice: Баскаме
  rationale: Название места транслитерировано с греческого как «Баскама» и поставлено в требуемый управлением дательный падеж.
- source_word: ἀπέκτεινεν
  choice: убил
  rationale: Прямой современный эквивалент глагола «убить»; не привносит оттенка официальной казни.
- source_word: τὸν Ἰωναθάν
  choice: Ионафана
  rationale: Использована укоренившаяся русская библейская форма личного имени.
- source_word: ἐτάφη
  choice: был похоронен
  rationale: Передаёт аорист страдательного залога θάπτω просто и без дополнительных образных оттенков.
- source_word: ἐκεῖ
  choice: там
  rationale: Естественный русский эквивалент простого наречия места.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным стилем. Местоимение «тот» во второй части устраняет возможную для русского текста двусмысленность относительно погребённого лица, тогда как греческая форма мужского рода по контексту относится к Ионафану.
