  text: And they answered with a loud voice, saying, “You are our leader in place of Judas and Jonathan your brother.”
translation:
  language: ru
  text: 'И они громко ответили: «Ты — наш предводитель вместо Иуды и Ионафана, твоего брата».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: ответили
  rationale: Прямой и естественный перевод повествовательного аориста ἀποκρίνομαι.
- source_word: φωνῇ μεγάλῃ
  choice: громко
  rationale: Дательный образа действия естественно передаётся русским наречием; значение сильного, громкого голоса сохраняется.
- source_word: ἡγούμενος
  choice: предводитель
  rationale: Передаёт широкое значение того, кто ведёт народ и стоит во главе него, не сужая смысл до строго официальной, царской или исключительно военной должности.
- source_word: ἀντί
  choice: вместо
  rationale: Сохраняет прямое значение замещения и преемства без добавления отсутствующего в греческом тексте формального титула.
- source_word: Ἰούδου
  choice: Иуды
  rationale: Традиционная русская форма имени Иуда в контексте Иуды Маккавея.
- source_word: Ἰωνάθου
  choice: Ионафана
  rationale: Устоявшаяся русская форма личного имени.
- source_word: τοῦ ἀδελφοῦ σου
  choice: твоего брата
  rationale: Сохраняет явное уточнение греческого текста, относящееся к Ионафану.
theological_decisions:
- issue: Характер положения Симона, обозначенного словом ἡγούμενος
  choice: предводитель
  alternative: правитель; вождь; военачальник
  rationale: Греческое слово указывает на признанное руководство Симона после Иуды и Ионафана, но само по себе не требует ни царского, ни административного, ни исключительно военного титула.
translation_notes:
  register: Современный литературный русский язык; речь торжественная, но естественная. Конструкция λέγοντες не передана отдельным «говоря», поскольку в русском прямая речь после глагола ответа выражает её без тяжеловесности.
