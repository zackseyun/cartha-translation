  text: As for the silver that your brother Jonathan owed to the royal treasury because of the needs he had[b][a], we have held him liable for it.
translation:
  language: ru
  text: Что касается серебра, которое твой брат Ионафан задолжал царской казне из-за своих нужд, мы удерживаем его из-за этого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение может означать, что его держат, задерживают или принуждают в связи с этим долгом. Иногда его понимают здесь как освобождение от долга, однако обычное значение глагола — «удерживать, стеснять».
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ ἀργυρίου
  choice: Что касается серебра
  rationale: Περὶ вводит тему, а ἀργύριον в финансовом контексте означает серебро или деньги; буквальное «серебро» здесь понятно по-русски.
- source_word: ὤφειλεν
  choice: задолжал
  rationale: Передаёт обычное значение финансовой задолженности и естественно сочетается с указанием казны.
- source_word: εἰς τὸ βασιλικόν
  choice: царской казне
  rationale: Субстантивированное βασιλικόν обозначает царское ведомство или имущество; в контексте денежного долга наиболее естественно «царская казна».
- source_word: διʼ ἃς εἶχεν χρείας
  choice: из-за своих нужд
  rationale: χρεία прежде всего может обозначать нужду, потребность или дело. Перевод сохраняет широту и некоторую неясность греческой фразы, не навязывая недоказанное значение официальных должностей.
- source_word: συνέχομεν αὐτόν
  choice: мы удерживаем его за это
  rationale: Передаёт засвидетельствованное значение συνέχω — держать, удерживать, стеснять. Контекст может допускать задержание или принуждение из-за долга; значение «освободили» лексически неочевидно и не должно молча подменять греческий текст.
