  text: And Tryphon learned that Simon had arisen in place of Jonathan his brother, and that he was about to engage him in war; and he sent envoys to him, saying,
translation:
  language: ru
  text: 'И Трифон узнал, что Симон выступил вместо своего брата Ионафана[a] и собирается начать с ним войну[b]; и послал к нему послов с такими словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встал вместо своего брата Ионафана» или «занял место своего брата Ионафана»; греческое выражение может обозначать появление Симона как преемника, а не просто физическое вставание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вступить с ним в битву» или «вступить с ним в войну»; греческое выражение означает вступление в вооружённый конфликт.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: узнал
  rationale: 'Аорист передаёт наступление осведомлённости: Трифон получил сведения о сложившемся положении, а не просто пребывал в состоянии знания.'
- source_word: ἀνέστη ... ἀντὶ Ἰωνάθου
  choice: встал на место ... Ионафана
  rationale: Передаёт и образ вставания, и контекст замещения или преемства, не уточняя сверх греческого текста официальный характер преемства.
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: своего брата
  rationale: Возвратное местоимение естественно указывает по-русски, что Ионафан был братом Симона.
- source_word: συνάπτειν αὐτῷ ... εἰς πόλεμον
  choice: вступить с ним в войну
  rationale: Естественно передаёт идиому вхождения в вооружённый конфликт; местоимение «с ним» сохраняет соотнесённость с Трифоном.
- source_word: μέλλει
  choice: собирается
  rationale: Передаёт намеченное или ожидаемое ближайшее действие, не утверждая, что война уже началась.
- source_word: ἀπέστειλεν ... πρέσβεις
  choice: послал ... послов
  rationale: «Послы» передаёт дипломатический статус представителей лучше, чем общее «вестники».
- source_word: λέγων
  choice: со словами
  rationale: Естественно вводит продолжающуюся в следующем стихе прямую речь и сохраняет незавершённость синтаксиса.
