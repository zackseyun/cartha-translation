lexical_decisions:
- source_word: πολέμησον τὸν πόλεμον ἡμῶν
  choice: Веди нашу войну
  rationale: Глагол πολεμέω с однокоренным дополнением πόλεμον образует усиленную конструкцию со значением ведения войны. «Веди нашу войну» сохраняет и военный смысл, и личную заинтересованность говорящих, выраженную ἡμῶν, оставаясь понятным по-русски.
- source_word: πάντα ὅσα ἐὰν εἴπῃς ἡμῖν
  choice: всё, что ты нам скажешь
  rationale: Оборот охватывает любые последующие указания и выражает готовность полностью им подчиниться. Русская формулировка естественно передаёт как всеохватность πάντα ὅσα, так и направленность речи к говорящим в ἡμῖν.
- source_word: ποιήσομεν
  choice: мы сделаем
  rationale: Будущее время ποιέω здесь прямо обещает исполнить сказанное; «мы сделаем» сохраняет простоту и не добавляет отсутствующей в тексте интерпретации.
