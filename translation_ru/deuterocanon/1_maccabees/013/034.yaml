    rationale: Собирательное «были грабежом» сглаживает множественное число. «Были грабительскими захватами» передаёт и множественность, и смысл насильственного присвоения.
  - severity: low
    issue: Неясная референция местоимения «тот»
    rationale: Хотя по контексту имеется в виду царь Димитрий, явное обозначение субъекта цели яснее и сохраняет смысл греческой конструкции.
