review_pass:
  verdict: revise
  source_fidelity: 'В черновике необоснованно добавлено «нескольких»: ἄνδρας означает «мужчин», без указания на малое или неопределённо ограниченное число. Конструкция цели верно понимает Деметрия как того, кто должен предоставить ἄφεσις, но это лучше назвать прямо, не полагаясь на несколько разговорное «тот». Множественное ἁρπασίαι точнее передать множественным обозначением грабительских захватов, а не единственным собирательным «грабежом».'
  naturalness: «Предоставил стране освобождение» сохраняет намеренную широту греческого слова и в историко-административном контексте звучит более естественно, чем «даровал стране освобождение». Явное «царь» делает синтаксис прозрачным. «Грабительские захваты» — естественное литературное выражение, не сводящее обвинение к современно-юридическому термину «грабёж».
  terminology: Имена «Симон», «Димитрий» и «Трифон» переданы нормативно. «Освобождение» допустимо для ἄφεσις при поясняющей сноске; сноска не утверждает категорично налоговое значение, а отмечает вероятный административно-фискальный контекст.
