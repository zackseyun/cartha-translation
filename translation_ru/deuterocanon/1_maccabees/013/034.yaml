  yaml_path: translation/deuterocanon/1_maccabees/013/034.yaml
  text: And Simon chose men and sent them to Demetrius the king to grant remission to the land[a], because all the acts of Tryphon were acts of plundering.
translation:
  language: ru
  text: Симон выбрал мужчин и послал их к царю Димитрию, чтобы царь предоставил стране освобождение[a], поскольку все деяния Трифона были грабительскими захватами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предоставил стране облегчение». Греческое слово может означать освобождение, отмену или прощение обязательств; здесь, вероятно, речь идёт об административных или налоговых повинностях.'
    reason: Сохраняется широта значения ἄφεσις и отмечается вероятный, но прямо не выраженный в стихе административно-финансовый смысл.
lexical_decisions:
- source_word: ἐπελέξατο
  choice: выбрал
  rationale: Средняя форма глагола здесь имеет обычное значение выбора; «выбрал» естественно и точно передаёт действие.
- source_word: ἄνδρας
  choice: нескольких мужчин
  rationale: ἄνδρας обозначает взрослых мужчин; слово «нескольких» естественно по-русски выражает неопределённое множество без уточнения их числа или официального статуса.
- source_word: ἀπέστειλεν πρὸς Δημήτριον τὸν βασιλέα
  choice: послал их к царю Димитрию
  rationale: Местоимение «их» восстанавливает подразумеваемое дополнение — ранее выбранных мужчин; порядок титула и имени соответствует современному русскому употреблению.
- source_word: τοῦ ποιῆσαι ἄφεσιν τῇ χώρᾳ
  choice: чтобы тот даровал стране освобождение[a]
  rationale: Оборот передаёт цель посольства, а «тот» ясно указывает на царя как предполагаемого дарователя. ἄφεσις означает освобождение или прощение обязательств; более узкое указание на налоги оставлено для сноски, поскольку в стихе оно прямо не названо.
- source_word: χώρᾳ
  choice: стране
  rationale: χώρα в данном политико-территориальном контексте обозначает страну или территорию; «стране» естественно в сочетании с административным освобождением.
- source_word: πᾶσαι αἱ πράξεις Τρύφωνος
  choice: все действия Трифона
  rationale: Сохраняется обобщающее и сравнительно формальное обозначение поступков или действий Трифона.
- source_word: ἦσαν ἁρπασίαι
  choice: были грабежом
  rationale: ἁρπασίαι обозначает насильственные захваты, грабёж или хищения. Собирательное «грабежом» звучит естественно и сохраняет обвинительный характер высказывания.
