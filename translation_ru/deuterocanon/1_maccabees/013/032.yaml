  text: And he reigned in his place[a], and put on the crown of Asia[b], and inflicted a great blow on the land.
translation:
  language: ru
  text: И он воцарился вместо него, возложил на себя диадему Азии и нанёс стране тяжёлый удар.[a]
  philosophy: optimal-equivalence
