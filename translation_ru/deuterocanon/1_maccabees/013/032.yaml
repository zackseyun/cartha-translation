lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: воцарился
  rationale: Аорист допускает как обозначение начала царствования, так и само осуществление царской власти; в контексте преемства «воцарился» естественно и кратко передаёт вступление на место прежнего царя.
- source_word: ἀντʼ αὐτοῦ
  choice: вместо него
  rationale: Сохраняет присущее ἀντί значение замещения и яснее передаёт преемство, чем более общее «после него».
- source_word: περιέθετο
  choice: возложил на себя
  rationale: Средний залог передаёт действие, направленное на самого деятеля; выражение сохраняет конкретный образ принятия царского знака.
- source_word: τὸ διάδημα
  choice: диадему
  rationale: διάδημα обозначает именно царскую головную повязку, знак царской власти. Современное русское «диадема» достаточно понятно и точнее, чем более широкое «корона».
- source_word: τῆς Ἀσίας
  choice: Азии
  rationale: Буквально сохраняет географически-политическое обозначение греческого текста, не уточняя его как «Малая Азия» или «Азиатское царство».
- source_word: ἐποίησεν πληγὴν μεγάλην
  choice: нанёс тяжёлый удар
  rationale: Передаёт образ удара или тяжкого бедствия, не сужая значение до болезни и не превращая метафору в однозначное «опустошение».
- source_word: ἐπὶ τῆς γῆς
  choice: стране
  rationale: В политико-военном контексте γῆ естественно означает территорию или страну; дательный оборот по-русски идиоматично сочетается с «нанёс удар».
