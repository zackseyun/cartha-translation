    rationale: В греческом один глагол συνετρίβη; добавление отдельного «изгнан» излишне расчленяет и конкретизирует смысл. Следует передать устранение как результат сокрушения, не утверждая самостоятельное изгнание.
  - severity: medium
    issue: «других струнных инструментов»
    rationale: νάβλαις называет инструмент; слова «других» в оригинале нет.
