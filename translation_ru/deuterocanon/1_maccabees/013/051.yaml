  yaml_path: translation/deuterocanon/1_maccabees/013/051.yaml
  text: And he entered it on the twenty-third day of the second month, in the one hundred seventy-first year, with praise and palm branches and with harps and cymbals and stringed instruments and with hymns and songs, because a great enemy had been crushed out of Israel.
translation:
  language: ru
  text: И вошёл он в неё в двадцать третий день второго месяца, сто семьдесят первого года, с хвалой и пальмовыми ветвями, под звуки кинноров[a], кимвалов и струнных инструментов[b], с гимнами и песнями, ибо великий враг был сокрушён, так что был устранён из Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Киннор — древний струнный инструмент; его также передают словами «лира» или «арфа», но точное современное соответствие не установлено.
    reason: lexical_alternative
  - marker: b
    text: Греческое слово обозначает особый древний струнный инструмент, который также называют наблой, арфой или псалтерием; его точный вид неясен.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν εἰς αὐτήν
  choice: вошёл он в неё
  rationale: Местоимение женского рода естественно отсылает к ранее упомянутой крепости или цитадели; простой глагол движения передаёт аорист без добавочного оттенка.
- source_word: τῇ τρίτῃ καὶ εἰκάδι τοῦ δευτέρου μηνός
  choice: в двадцать третий день второго месяца
  rationale: Современная и ясная передача греческой календарной формулы.
- source_word: ἔτους ἑνὸς καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: сто семьдесят первого года
  rationale: Сохраняется точное обозначение года по подразумеваемой в контексте эре без пояснения внутри стиха.
- source_word: μετὰ αἰνέσεως
  choice: с хвалебными возгласами
  rationale: αἴνεσις означает хвалу; в описании торжественного вступления конкретизировано как публичное выражение хвалы, без сужения до благодарения.
- source_word: βαΐων
  choice: пальмовыми ветвями
  rationale: Ясно обозначает празднично используемые ветви пальмы.
- source_word: κινύραις
  choice: кинноров
  rationale: Транслитерация сохраняет название конкретного древнего струнного инструмента и не отождествляет его без достаточных оснований с современной арфой или лирой.
- source_word: κυμβάλοις
  choice: кимвалов
  rationale: Традиционное и точное русское название соответствующего ударного инструмента.
- source_word: νάβλαις
  choice: других струнных инструментов
  rationale: Точное современное соответствие древнего инструмента не установлено; родовое обозначение остаётся понятным, а слово «других» показывает, что киннор также струнный.
- source_word: ὕμνοις καὶ ᾠδαῖς
  choice: с гимнами и песнями
  rationale: Сохраняется различие между двумя греческими музыкально-поэтическими терминами без искусственной литургической конкретизации.
- source_word: συνετρίβη ἐχθρὸς μέγας ἐξ Ἰσραήλ
  choice: великий враг был сокрушён и изгнан из Израиля
  rationale: Передаётся как сокрушение врага, приведшее к его удалению из среды или земли Израиля; добавление «изгнан» делает функцию ἐξ естественной по-русски, не сводя её к уничтожению самого врага.
theological_decisions:
- issue: Характер торжества
  choice: Передать публичную хвалу, музыку и песни без позднейшей литургической или мессианской конкретизации.
  alternative: 'Использовать более специальную культовую лексику: «благодарение», «псалмы».'
  rationale: Греческий текст описывает праздничное избавление и допускает религиозный оттенок хвалы, но не требует узкотехнических терминов.
- issue: Смысл ἐξ Ἰσραήλ при пассивном συνετρίβη
  choice: Передать результат как сокрушение и изгнание врага из Израиля.
  alternative: «великий враг Израиля был сокрушён» или буквально «враг был сокрушён из Израиля».
  rationale: Предлог ἐξ относится к удалению врага из Израиля, а не обозначает принадлежность врага Израилю. Русская формула сохраняет одновременно поражение и устранение врага, не утверждая непременно его полное уничтожение.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Календарная формула сохранена, названия точно не идентифицируемых инструментов разъяснены в сносках. Повторы союзов слегка сглажены, но перечислительный, торжественный ритм оригинала сохранён.
