- from: И вошёл он в неё в двадцать третий день второго месяца сто семьдесят первого года с хвалебными возгласами и пальмовыми ветвями, под звуки кинноров[a], кимвалов и других струнных инструментов[b], с гимнами и песнями, потому что великий враг был сокрушён и изгнан из Израиля.
  to: И вошёл он в неё в двадцать третий день второго месяца, сто семьдесят первого года, с хвалой и пальмовыми ветвями, под звуки кинноров[a], кимвалов и струнных инструментов[b], с гимнами и песнями, ибо великий враг был сокрушён, так что был устранён из Израиля.
  rationale: Правка восстанавливает широту «хвалы», убирает не имеющее опоры слово «других» и не представляет устранение врага как отдельное, прямо названное изгнание. Оборот «так что был устранён из Израиля» передаёт направленность ἐξ Ἰσραήλ как следствие сокрушения, сохраняя исходную смысловую связь.
