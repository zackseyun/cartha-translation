  source_fidelity: 'Нужна правка двух мест. Μετὰ αἰνέσεως означает «с хвалой»; «хвалебные возгласы» неоправданно конкретизирует способ выражения хвалы. В συνετρίβη ... ἐξ Ἰσραήλ нет отдельного глагола «изгнать»: сочетание передаёт сокрушение врага с его устранением из Израиля, поэтому исходное «был сокрушён и изгнан» добавляет второе действие. Кроме того, «других струнных инструментов» добавляет отсутствующее в греческом «других».'
  naturalness: Исправленный текст сохраняет современный литературный, исторически торжественный регистр. «Под звуки» естественно вводит перечисление инструментов, а «с хвалой» точно и лаконично передаёт αἴνεσις.
  terminology: «Кинноры» и «струнные инструменты» допустимы при данных сносках, поскольку точная идентификация κινύρα и νάβλα не вполне надёжна. «Кимвалы», «гимны» и «песни» уместны. Сноска b должна описывать именно νάβλαις и не подразумевать, что это непременно «другие» инструменты.
