  text: And to the elders and the nation of the Jews[a], greetings. We have received the gold crown and the palm branch that you sent[b], and we are ready to make great peace with you and to write to the officials in charge to grant you remissions.
translation:
  language: ru
  text: Старейшинам и иудейскому народу — приветствие. Мы получили золотой венец и пальмовую ветвь[a], которые вы прислали, и готовы заключить с вами полный мир и написать ведающим делами, чтобы они предоставили вам льготы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пальмовый лист»; греческое слово обозначает пальмовую ветвь, использовавшуюся в церемониальных или почётных целях.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, имеются в виду административные или налоговые льготы, однако греческий текст здесь не уточняет их вид.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβυτέροις
  choice: старейшинам
  rationale: В официальном обращении речь идёт о признанных руководителях общины, а не просто о пожилых людях.
- source_word: ἔθνει Ἰουδαίων
  choice: народу иудейскому
  rationale: Передаёт корпоративное значение ἔθνος и сохраняет торжественно-официальный тон, оставаясь естественным по-русски.
- source_word: χαίρειν
  choice: приветствие
  rationale: Это стандартная эпистолярная формула; буквальное «радоваться» в современном русском здесь вводило бы в заблуждение.
- source_word: στέφανον τὸν χρυσοῦν
  choice: золотой венец
  rationale: Венец является дипломатическим даром; «венец» точнее сохраняет историко-церемониальную окраску στέφανος, чем современное «корона».
- source_word: βαΐν
  choice: пальмовую ветвь
  rationale: βαΐον обозначает пальмовую ветвь, имевшую церемониальное или почётное значение; единственное число источника сохранено.
- source_word: κεκομίσμεθα
  choice: мы получили
  rationale: Перфект обозначает состоявшееся получение присланных даров.
- source_word: ἕτοιμοί ἐσμεν
  choice: готовы
  rationale: Прямая и естественная передача выражения готовности в официальном письме.
- source_word: ποιεῖν ὑμῖν εἰρήνην μεγάλην
  choice: заключить с вами прочный мир
  rationale: Идиоматично для русского дипломатического контекста и передаёт усиление μεγάλην, не воспроизводя неестественное «сделать великий мир».
- source_word: τοῖς ἐπὶ τῶν χρειῶν
  choice: ведающим делами
  rationale: Сохраняет обобщённость административного выражения и не приписывает адресатам более конкретной должности, чем указано в греческом.
- source_word: ἀφεῖναι ὑμῖν ἀφέματα
  choice: предоставили вам освобождения
  rationale: Сохраняет широту значения и формальную окраску однокоренной конструкции, не уточняя без достаточного основания, были ли освобождения налоговыми или иными.
