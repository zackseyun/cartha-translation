lexical_decisions:
- source_word: ἐπορεύετο
  choice: поступал
  rationale: Имперфект обозначает продолжавшееся в прошлом действие; в сочетании с δόλῳ естественное русское «поступал коварно» передаёт образ действий, не сводя глагол к буквальному перемещению.
- source_word: δόλῳ
  choice: коварно
  rationale: Дательный падеж допускает значение образа действия или средства. Наречие естественно по-русски и передаёт смысл обмана и вероломства.
- source_word: μετὰ Ἀντιόχου
  choice: с … Антиохом
  rationale: μετά с родительным означает «с»; хотя контекст раскрывает враждебность Трифона, перевод не подменяет выраженное в греческом значение значением «против».
- source_word: τοῦ βασιλέως τοῦ νεωτέρου
  choice: с молодым царём Антиохом
  rationale: νεώτερος формально является сравнительной формой и может означать «младший», однако в данном контексте естественное русское «молодой царь» характеризует юного Антиоха; вариант «младшим царём» отмечен в сноске как более буквальный.
- source_word: ἀπέκτεινεν
  choice: убил
  rationale: Нейтрально и прямо передаёт значение глагола, не добавляя юридической оценки, присущей слову «убил преднамеренно» или «совершил убийство».
