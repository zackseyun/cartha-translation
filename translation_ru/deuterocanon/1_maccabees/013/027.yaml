  text: And Simon built over the tomb of his father and his brothers[a], and he raised it high to be seen[b], with dressed stone at the back and at the front.
translation:
  language: ru
  text: И Симон возвёл сооружение над гробницей своего отца и своих братьев, сделал его высоким и заметным[a], с тёсаным камнем сзади и спереди[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внушительным на вид». Греческое выражение может указывать как на заметность сооружения, так и на производимое им зрительное впечатление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гладко обработанным камнем». Греческое слово обозначает камень, поверхность которого обтесали, оскоблили или иным образом тщательно обработали.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: возвёл сооружение
  rationale: Глагол означает «строить, возводить». В греческом дополнение подразумевается; слово «сооружение» делает русскую фразу естественной, не уточняя вид надгробной постройки.
- source_word: ἐπὶ τὸν τάφον
  choice: над гробницей
  rationale: ἐπί с винительным здесь указывает на сооружение, возведённое над местом погребения.
- source_word: ὕψωσεν αὐτόν
  choice: сделал его высоким
  rationale: Передаёт прямой физический смысл ὑψόω — «поднимать, делать высоким» — без добавления символического значения.
- source_word: τῇ ὁράσει
  choice: заметным
  rationale: 'Дательный оборот характеризует зрительное восприятие сооружения: оно было хорошо видно или производило сильное впечатление. Основной текст передаёт вероятный смысл видимости, а примечание сохраняет возможное значение внешнего облика.'
- source_word: λίθῳ ξυστῷ
  choice: тёсаным камнем
  rationale: ξυστός обозначает обработанное соскабливанием или сглаживанием; «тёсаный камень» — естественный русский архитектурный термин, не обязательно подразумевающий зеркальную полировку.
- source_word: ἐκ τῶν ὄπισθεν καὶ ἐκ τῶν ἔμπροσθεν
  choice: сзади и спереди
  rationale: Сохраняется парное указание на заднюю и переднюю стороны сооружения.
