lexical_decisions:
- source_word: ἔκοψαντο … κοπετὸν μέγαν
  choice: совершил … великий плач
  rationale: Греческое сочетание обозначает сильный, вероятно публичный, траурный плач. Русское выражение передаёт идиому естественно, не добавляя прямо не названного жеста биения себя в грудь.
- source_word: πᾶς Ἰσραήλ
  choice: весь Израиль
  rationale: Коллективное обозначение народа в целом; согласование глагола в единственном числе естественно для русского языка.
- source_word: ἐπένθησαν αὐτόν
  choice: оплакивал его
  rationale: Глагол означает скорбеть или носить траур по умершему; «оплакивал» точно соответствует погребальному контексту и сохраняет отличие от предшествующей идиомы.
- source_word: ἡμέρας πολλὰς
  choice: много дней
  rationale: Винительный продолжительности естественно передаётся по-русски обстоятельством времени без обязательного предлога.
