  text: Вот гробница, которую он соорудил в Модеине; она стоит до сего дня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάφος
  choice: гробница
  rationale: В данном контексте слово обозначает не просто могилу, а монументальное семейное погребальное сооружение.
- source_word: ἐποίησεν
  choice: соорудил
  rationale: Глагол ποιέω буквально означает «сделал», однако применительно к гробнице русское «соорудил» естественно передаёт создание постройки.
- source_word: ἐν Μωδεεὶμ
  choice: в Модеине
  rationale: Предлог ἐν передан как «в», а греческая форма географического названия — традиционной русской транслитерацией «Модеин» с предложным падежом.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: до сего дня
  rationale: Устойчивое выражение указывает, что гробница продолжала существовать во время написания повествования; формула «до сего дня» ясна и сохраняет библейское достоинство стиля.
- source_word: οὗτος
  choice: Вот
  rationale: Указательное местоимение вводит отождествление описанного памятника; «вот» естественно передаёт его указательную силу в русском языке.
