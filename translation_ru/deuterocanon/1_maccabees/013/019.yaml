  text: And he sent the young men and the hundred talents[a], but he broke his word and did not release Jonathan.
translation:
  language: ru
  text: И послал он мальчиков и сто талантов. Но Трифон не сдержал слова[a] и не отпустил Ионафана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обманул» или «поступил вероломно». Греческий глагол может обозначать обман вообще; здесь речь идёт о том, что Трифон не выполнил обещанного после получения денег и заложников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλε
  choice: послал
  rationale: Обычное повествовательное значение аориста ἀποστέλλω; современный и естественный русский эквивалент.
- source_word: τὰ παιδάρια
  choice: мальчиков
  rationale: παιδάριον обозначает мальчика или юного слугу. В контексте речь идёт о ранее потребованных юных заложниках; «мальчиков» сохраняет указание на возраст, не добавляя прямо отсутствующего в этой фразе слова «сыновей».
- source_word: τὰ ἑκατὸν τάλαντα
  choice: сто талантов
  rationale: Прямое обозначение оговорённой денежной суммы; определённость в русском достаточно передаётся контекстом.
- source_word: διεψεύσατο
  choice: не сдержал слова
  rationale: Средняя форма διαψεύδομαι может означать обман или неверность обещанию. В данном контексте выражение указывает на отказ выполнить условие после получения заложников и денег.
- source_word: οὐκ ἀφῆκεν
  choice: не отпустил
  rationale: Поскольку Ионафан находился в плену, ἀφίημι здесь означает освобождение удерживаемого человека.
- source_word: τὸν Ἰωναθάν
  choice: Ионафана
  rationale: Традиционная русская библейская передача имени Ἰωναθάν с требуемым винительным падежом.
theological_decisions:
- issue: Неявная смена действующего лица
  choice: Во второй фразе назван Трифон
  alternative: Сохранить местоимение «он»
  rationale: 'В греческом оба глагола имеют подразумеваемые подлежащие, но контекст требует смены: посылает Симон, а нарушает обещание и удерживает Ионафана Трифон. Имя устраняет неестественную для русского двусмысленность, не меняя смысла повествования.'
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Талант» сохранён как древняя единица веса и денежной стоимости. Формулировка «не сдержал слова» естественна и передаёт контекст обещания, а сноска сохраняет более широкое значение греческого глагола.
