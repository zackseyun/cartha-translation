base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/049.yaml
  text: But those in the citadel at Jerusalem were prevented from going out into the country and from buying and selling[a]; and they became very hungry[b], and many of them perished from famine.
translation:
  language: ru
  text: А тем, кто находился в крепости[a] в Иерусалиме, не давали выходить в окрестности, покупать и продавать[b]. Они жестоко голодали, и многие из них умерли от голода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Акре». Греческое ἄκρα может означать «крепость, цитадель» либо служить названием селевкидской крепости в Иерусалиме — Акры.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте перед словами «покупать и продавать» союз «и» повторён дважды (καὶ καὶ). Смысл ясен; вероятно, это ошибка переписчика.
    reason: textual_variant
lexical_decisions:
- source_word: ἄκρας
  choice: крепости
  rationale: ἄκρα обозначает укреплённую цитадель и вместе с тем может употребляться как название иерусалимской Акры. «Крепость» ясно передаёт значение в основном тексте, а именование «Акра» сохранено в сноске.
- source_word: ἐκωλύοντο
  choice: не давали
  rationale: Форма передаёт продолжительное внешнее препятствие. Безличное «не давали» естественно по-русски и не вводит не названного в греческом тексте действующего лица.
- source_word: ἐκπορεύεσθαι εἰς τὴν χώραν
  choice: выходить в окрестности
  rationale: Речь идёт о выходе из иерусалимской крепости на окружающую город территорию; «окрестности» точнее контекстуального русского «страну» или «землю».
- source_word: ἀγοράζειν καὶ πωλεῖν
  choice: покупать и продавать
  rationale: Сохранены оба конкретных действия, а не обобщённое «торговать».
- source_word: ἐπείνασαν σφόδρα
  choice: жестоко голодали
  rationale: Передаёт крайнюю степень голода естественным и достойным русским выражением, не ослабляя σφόδρα.
- source_word: ἀπώλοντο
  choice: умерли
  rationale: В контексте голода глагол означает физическую смерть; «умерли» современнее и прямее, чем «погибли», не добавляя насильственного оттенка.
- source_word: ἱκανοὶ
  choice: многие
  rationale: Передаёт значительное, но не уточнённое число людей.
- source_word: τῷ λιμῷ
  choice: от голода
  rationale: В данном контексте λιμός обозначает смертельный голод, вызванный блокадой; русское «от голода» естественно обозначает причину смерти.
