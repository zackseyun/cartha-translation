lexical_decisions:
- source_word: ἐβόησαν πρὸς Σίμωνα
  choice: воззвали к Симону
  rationale: Глагол βοάω обозначает громкий, настойчивый зов. «Воззвали» передаёт и силу обращения, и его срочность, сохраняя достоинство повествовательного стиля.
- source_word: δεξιὰς λαβεῖν
  choice: принять заверения в верности
  rationale: Буквально выражение означает «принять правые руки», но здесь это идиома, связанная с формальным подтверждением добрых намерений или верности. Смысл передан понятно для современного читателя, а буквальный образ сохранён в сноске.
- source_word: ἔδωκεν αὐτοῖς
  choice: Он дал им такие заверения
  rationale: Объект глагола подразумевается из предшествующей идиомы. Слово «такие» делает русскую фразу связной, не уточняя содержание заверений сверх сказанного в греческом тексте.
- source_word: ἐξέβαλεν αὐτοὺς ἐκεῖθεν
  choice: изгнал их оттуда
  rationale: ἐκβάλλω выражает принудительное удаление; «изгнал» естественно и точно передаёт его силу в военно-политическом контексте.
- source_word: τὴν ἄκραν
  choice: крепость
  rationale: ἄκρα означает укреплённую цитадель и в данном контексте может обозначать конкретную иерусалимскую Акру. В основном тексте употреблено понятное нарицательное слово, а историческое название отмечено в сноске.
- source_word: ἀπὸ τῶν μιασμάτων
  choice: от осквернений
  rationale: μίασμα обозначает осквернение, в том числе культовое. Множественное число оригинала сохранено.
theological_decisions:
- issue: Буквальная или идиоматическая передача δεξιὰς λαβεῖν
  choice: 'Идиоматическая передача: «принять заверения в верности»'
  alternative: 'Буквально: «принять правые руки»; также возможно: «принять гарантии»'
  rationale: Буквальная калька была бы непонятна современному русскому читателю. Выбранная формулировка сохраняет идею формального заверения, не сводя её без достаточных оснований исключительно к гарантии безопасности.
- issue: Передача τὴν ἄκραν как нарицательного слова или исторического названия
  choice: 'В основном тексте: «крепость»'
  alternative: «Акра»
  rationale: Греческое слово допускает чтение как обычного обозначения цитадели и как названия конкретной селевкидской крепости в Иерусалиме. Основной текст остаётся прозрачным, а историческая идентификация сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис упрощён ради ясности, при этом сохранены последовательность действий, множественное число «осквернений» и неоднозначность исторического обозначения крепости.
