lexical_decisions:
- source_word: Ἔτους ἑκατοστοῦ ἑβδομηκοστοῦ πρώτῃ
  choice: В сто семьдесят первом году
  rationale: Греческая формула датировки естественно передаётся по-русски предложным сочетанием с порядковым числительным.
- source_word: ὁ ζυγὸς
  choice: ярмо
  rationale: Слово ζυγός буквально обозначает ярмо и метафорически — подчинение или гнетущую власть. «Ярмо» сохраняет исходный образ и торжественно-историческое звучание.
- source_word: τῶν ἐθνῶν
  choice: народов
  rationale: ἐθνῶν может означать народы вообще, а в иудейской речи — язычников. «Народов» ближе к форме греческого текста и не устраняет заложенную в нём смысловую широту; контекстуальный вариант отмечен в сноске.
- source_word: ἀπὸ τοῦ Ἰσραήλ
  choice: с Израиля было снято
  rationale: Предлог ἀπό выражает удаление или отделение. Русская конструкция «с Израиля было снято ярмо» естественно передаёт прекращение господства; глагол «было снято» восполняет эллипсис греческой фразы.
theological_decisions:
- issue: Передавать ли τῶν ἐθνῶν как «народов» или как «язычников»
  choice: народов
  alternative: язычников
  rationale: Стих возвещает окончание чужеземного господства над Израилем. Хотя в иудейском контексте возможно значение «язычники», буквальное «народы» сохраняет лексическую неоднозначность и не усиливает без необходимости религиозное противопоставление.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранена метафора ярма; эллиптическая греческая конструкция раскрыта естественным русским сказуемым «было снято».
