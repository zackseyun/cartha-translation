lexical_decisions:
- source_word: ἐξήλοντο
  choice: выскочили
  rationale: Форма передаёт стремительное движение наружу; «выскочили» сохраняет динамику греческого глагола и направление из осадной башни в город, не уточняя сверх текста способ проникновения.
- source_word: οἱ ἐν τῇ ἑλεπόλει
  choice: те, кто находился в осадной башне
  rationale: ἑλέπολις — осадная машина, обычно башенного типа. «Осадная башня» понятно современному читателю; нейтральное «те, кто находился» не добавляет отсутствующего в греческом обозначения воинов.
- source_word: εἰς τὴν πόλιν
  choice: в город
  rationale: Передаёт обычное значение πόλις и направительное значение εἰς.
- source_word: κίνημα μέγα
  choice: великое смятение
  rationale: κίνημα здесь означает сильное волнение, беспорядок или потрясение в городе. «Великое смятение» сохраняет широту значения, не усиливая его до мятежа или восстания.
- source_word: ἐγένετο
  choice: началось
  rationale: В сочетании с обозначением смятения естественно по-русски передаёт возникновение события; буквальное «стало» или «произошло» звучало бы менее естественно.
