lexical_decisions:
- source_word: οἱ δὲ ἐκ τῆς ἄκρας
  choice: А находившиеся в крепости
  rationale: ἄκρα здесь обозначает укреплённую цитадель; конструкция с ἐκ указывает на людей, находившихся там или принадлежавших к её гарнизону. «Крепость» естественно и понятно передаёт смысл в данном военном контексте.
- source_word: ἀπέστελλον πρεσβεύτας
  choice: продолжали посылать к нему послов
  rationale: Имперфект ἀπέστελλον выражает продолжавшееся или повторявшееся действие. πρεσβευταί — официальные посланники, поэтому выбрано «послы».
- source_word: κατεσπούδαζον αὐτὸν τοῦ ἐλθεῖν
  choice: настойчиво просили его прийти
  rationale: Глагол передаёт усердное, настойчивое побуждение; имперфект согласуется с продолженным действием. «Просили» сохраняет смысл обращения через послов, не усиливая его до приказа или принуждения.
- source_word: πρὸς αὐτὸν
  choice: к ним[a]
  rationale: В печатном греческом тексте стоит единственное число «к нему», однако контекст указывает на людей в крепости как на коллективного адресата. В основном тексте дан контекстуально ясный вариант, а форма источника отмечена в сноске.
- source_word: διὰ τῆς ἐρήμου
  choice: через пустыню
  rationale: διά с родительным обозначает путь через местность; ἐρῆμος здесь естественно передаётся словом «пустыня» без уточнения характера ландшафта.
- source_word: ἀποστεῖλαι αὐτοῖς τροφάς
  choice: доставить им продовольствие
  rationale: τροφαί в осадном и военном контексте означает запасы пищи, то есть продовольствие. «Доставить» естественно выражает отправку припасов к нуждающимся в них людям.
