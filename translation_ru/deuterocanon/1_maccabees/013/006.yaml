  yaml_path: translation/deuterocanon/1_maccabees/013/006.yaml
  text: But I will take vengeance for my nation[a], and for the sanctuary, and for our women and children[c][b], because all the nations have gathered to wipe us out out of hatred.
translation:
  language: ru
  text: Но я отомщу за свой народ, за святилище[a], за наших женщин и детей[b], потому что все народы собрались, чтобы истребить нас из ненависти[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за святыни» или «за святые места»; греческое слово стоит во множественном числе и буквально означает «святые [предметы или места]».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за наших жён и детей».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ради ненависти»; возможно также: «из-за вражды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующему контексту естественным современным русским союзом.
- source_word: ἐκδικήσω
  choice: я отомщу
  rationale: Будущая форма выражает возмездие за причинённое зло; «отомщу за» точно и естественно сочетается с перечисленными объектами защиты.
- source_word: τοῦ ἔθνους μου
  choice: мой народ
  rationale: В данном контексте ἔθνος обозначает еврейскую общность. «Народ» по-русски естественнее, чем «нация», и сохраняет общественно-политический смысл.
- source_word: τῶν ἁγίων
  choice: святилище
  rationale: Субстантивированное множественное число среднего рода буквально означает «святое / святыни»; в храмовом контексте 1 Маккавейской наиболее вероятен смысл святилища или святых мест.
- source_word: τῶν γυναικῶν καὶ τῶν τέκνων ἡμῶν
  choice: наших женщин и детей
  rationale: γυναῖκες может означать как «женщины», так и «жёны». Более широкое «женщины» соответствует перечислению членов всей общины, а неоднозначность отмечена в сноске.
- source_word: συνήχθησαν
  choice: собрались
  rationale: Аорист пассивной формы здесь идиоматически описывает объединение враждебных народов; русское возвратное «собрались» естественно передаёт результат.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: Передаёт окружающие народы без внесения новозаветного оттенка слова «язычники».
- source_word: ἐκτρῖψαι ἡμᾶς
  choice: истребить нас
  rationale: Глагол обозначает полное уничтожение; «истребить» сохраняет силу выражения и соответствует достоинству исторической речи.
- source_word: ἔχθρας χάριν
  choice: из ненависти
  rationale: Кратко и естественно передаёт мотив действия; буквальная конструкция означает «ради ненависти» или «из-за вражды».
theological_decisions:
- issue: Референт τῶν ἁγίων
  choice: святилище
  alternative: святыни; святые места
  rationale: Храмовая направленность книги и перечисление того, что находится под угрозой, делают святилище наиболее вероятным референтом. Однако грамматическая форма допускает более буквальные варианты, поэтому они сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык; военная решимость передана сильно, но без разговорной сниженности. Синтаксический параллелизм греческого перечисления сохранён повтором «за».
