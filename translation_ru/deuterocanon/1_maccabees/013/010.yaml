    rationale: τελέσαι τὰ τείχη означает довести до завершения стены, то есть закончить их возведение; по-русски стены не «завершают» без уточнения действия.
  - severity: low
    issue: В «всех воинов» не выражен отдельный компонент ἄνδρας («мужчин»).
    rationale: Мужской род слова «воины» в современном русском не обязательно ограничивает группу мужчинами, тогда как греческий текст делает это явно.
