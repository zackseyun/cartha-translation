translation:
  language: ru
  text: И собрал он всех мужчин-воинов, и поспешил завершить возведение стен Иерусалима, и укрепил его со всех сторон.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγεν
  choice: собрал
  rationale: Аорист συνάγω обозначает созыв и объединение людей; «собрал» естественно звучит по-русски и не уточняет способ действия сверх исходного текста.
- source_word: πάντας τοὺς ἄνδρας τοὺς πολεμιστάς
  choice: всех воинов
  rationale: Слово «воинов» точно передаёт военное значение πολεμιστάς и в русском языке обозначает мужчин в данном историческом контексте; отдельная передача ἄνδρας сделала бы выражение тяжеловесным.
- source_word: ἐτάχυνεν τοῦ τελέσαι
  choice: поспешил завершить
  rationale: Сочетание передаёт срочность действия и направленность на окончание работ; это естественная русская конструкция, сохраняющая смысл глагола и инфинитива.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: стены Иерусалима
  rationale: Прямо передаёт генитивную конструкцию и ясно указывает на городские оборонительные стены.
- source_word: ὠχύρωσεν
  choice: укрепил
  rationale: В военном контексте «укрепил» означает сделал город более защищённым и соответствует значению ὀχυρόω.
- source_word: αὐτὴν κυκλόθεν
  choice: его со всех сторон
  rationale: Женское αὐτήν относится к Иерусалиму как к городу; по нормам русского согласования местоимение «его» соотносится с названием «Иерусалим». «Со всех сторон» естественно передаёт κυκλόθεν.
theological_decisions:
- issue: Гендерно маркированное обозначение воинов
  choice: всех воинов
  alternative: всех мужчин-воинов
  rationale: Греческий текст содержит ἄνδρας и тем самым указывает на мужчин, однако русское «воины» в данном древнем военном контексте естественно сохраняет этот смысл. Вариант «мужчин-воинов» формально явнее, но стилистически неестественен и избыточен.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранена последовательность трёх действий и повтор союза «и», соответствующий греческому синтаксису.
