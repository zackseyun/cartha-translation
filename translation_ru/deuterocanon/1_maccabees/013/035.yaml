lexical_decisions:
- source_word: ἀπέστειλεν αὐτῷ
  choice: отправив
  rationale: Глагол означает «послал, отправил»; деепричастная конструкция естественно связывает отправку с письменным ответом, прямо названным далее.
- source_word: Δημήτριος ὁ βασιλεύς
  choice: царь Димитрий
  rationale: Традиционная и естественная для русской библейской прозы постановка титула перед именем.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: следующего содержания
  rationale: Оборот вводит слова документа; по-русски так естественно предваряют приводимый далее текст письма.
- source_word: ἀπεκρίθη αὐτῷ
  choice: ответил ему
  rationale: Сохранено прямое значение глагола «ответил» без избыточного повторения мысли об отправке.
- source_word: ἔγραψεν αὐτῷ ἐπιστολὴν τοιαύτην
  choice: письмо следующего содержания
  rationale: Передаёт письменную форму ответа и вводит текст письма, который следует за двоеточием.
