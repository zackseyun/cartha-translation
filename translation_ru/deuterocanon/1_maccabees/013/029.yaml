  text: And he made these as devices, setting up great pillars; and on the pillars he made suits of armor for an everlasting memorial, and beside the armor, ships engraved, to be seen by all who sail the sea.
translation:
  language: ru
  text: Он искусно соорудил их, окружив большими колоннами. На колоннах он поместил полные доспехи — на вечную память[a], а рядом с доспехами — вырезанные изображения кораблей, чтобы их видели все, кто плывёт по морю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для вечного имени»; то есть для непреходящей памяти или славы.'
    reason: Греческое εἰς ὄνομα αἰώνιον буквально говорит о «вечном имени» и в контексте обозначает долговечную память.
lexical_decisions:
- source_word: μηχανήματα
  choice: искусные сооружения
  rationale: Существительное обозначает искусно устроенные конструкции или сооружения. Такой перевод естественен по-русски и сохраняет оттенок продуманного устройства, не сводя слово ни к современным «механизмам», ни просто к «памятникам».
- source_word: περιθεὶς στύλους μεγάλους
  choice: окружив большими колоннами
  rationale: Причастие περιθεὶς передаёт размещение колонн вокруг ранее названных сооружений; «колонны» здесь естественнее архитектурного «столпы».
- source_word: πανοπλίας
  choice: полные доспехи
  rationale: πανοπλία — полный комплект вооружения и доспехов. Перевод не уточняет без достаточного основания, были ли это настоящие доспехи, их изображения или декоративные воинские трофеи.
- source_word: πλοῖα ἐγγεγλυμμένα
  choice: вырезанные изображения кораблей
  rationale: Причастие ἐγγεγλυμμένα указывает на резное или гравированное исполнение; добавление «изображения» ясно передаёт, что речь не о настоящих кораблях.
- source_word: τῶν πλεόντων τὴν θάλασσαν
  choice: все, кто плывёт по морю
  rationale: Прямая и естественная передача греческого выражения без неоправданного сужения до моряков как профессии.
