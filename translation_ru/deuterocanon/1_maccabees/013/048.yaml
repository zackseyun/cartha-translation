  text: And he drove out from it every impurity[a], and settled in it men who practice the law, and fortified it[b], and built for himself a residence in it.
translation:
  language: ru
  text: И он удалил оттуда всякую нечистоту[a], поселил там мужчин, соблюдающих Закон, укрепил это место[b] и построил там для себя жилище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякое осквернение». Греческое слово может широко обозначать нечистоту — в том числе обрядовую или нравственную.'
    reason: lexical_alternative
  - marker: b
