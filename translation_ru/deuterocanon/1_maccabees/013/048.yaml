    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλεν
  choice: удалил
  rationale: Передаёт решительное устранение из данного места; в сочетании с абстрактным «нечистота» по-русски звучит естественнее, чем буквальное «изгнал».
- source_word: ἀκαθαρσίαν
  choice: нечистоту
  rationale: Сохраняет широкий религиозно-нравственный смысл греческого слова, не ограничивая его только обрядовым или только моральным осквернением.
- source_word: κατῴκισεν
  choice: поселил
  rationale: 'Точно передаёт каузативный смысл: он разместил там новых жителей.'
- source_word: ἄνδρας
  choice: людей
  rationale: В данном контексте слово обозначает поселенцев, характеризуемых соблюдением Закона; русское «людей» естественно передаёт группу жителей, не утверждая сверх контекста, что речь исключительно о мужчинах-воинах.
- source_word: οἵτινες τὸν νόμον ποιοῦσιν
  choice: соблюдающих Закон
  rationale: Устойчиво и ясно передаёт идиому «исполнять Закон» и продолжающийся образ жизни этих людей.
- source_word: προσοχύρωσεν
  choice: укрепил это место
  rationale: Передаёт фортификационное укрепление. Указательное «это место» устраняет в русском двусмысленность местоимения женского рода при отсутствии названного в самом стихе существительного.
- source_word: ᾠκοδόμησεν ἑαυτῷ ... οἴκησιν
  choice: построил там для себя жилище
  rationale: Естественно передаёт строительство собственного места проживания без стилистически тяжёлого однокоренного повтора.
theological_decisions:
- issue: Объём значения ἀκαθαρσία в контексте очищения
  choice: всякую нечистоту
  alternative: всякое осквернение
  rationale: Формулировка сохраняет возможность обрядового, нравственного и культового значения и не разрешает намеренно широкое значение текста.
- issue: Передача ἄνδρας
  choice: людей
  alternative: мужчин
  rationale: Хотя греческое существительное имеет мужскую форму, здесь оно обозначает заселяемую группу по её верности Закону; «людей» является обычной современной русской передачей в таком контексте, тогда как «мужчин» могло бы неоправданно подчеркнуть биологический пол.
- issue: Статус νόμος
  choice: Закон
  alternative: закон
  rationale: В контексте 1 Маккавейской книги имеется в виду Закон Израиля, поэтому прописная буква естественно указывает на конкретную религиозную реалию, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сохранён последовательным и энергичным; архаизмы и чрезмерно буквальные обороты устранены.
