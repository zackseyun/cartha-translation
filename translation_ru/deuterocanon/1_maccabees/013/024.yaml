lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: повернул назад
  rationale: Передаёт направительное значение аориста ἐπιστρέφω — «повернуть назад, возвратиться» — и естественно связывается с последующим уходом.
- source_word: ἀπῆλθεν
  choice: ушёл
  rationale: Глагол ἀπέρχομαι обозначает удаление с места действия; «ушёл» кратко и естественно передаёт это в современном русском повествовании.
- source_word: γῆν
  choice: землю
  rationale: γῆ имеет широкий смысл «земля, страна, территория»; «землю» сохраняет общность исходного выражения и не добавляет политического оттенка.
- source_word: αὐτοῦ
  choice: свою
  rationale: При совпадении обладателя с подлежащим русское возвратное притяжательное местоимение «свою» естественно и точно передаёт αὐτοῦ.
- source_word: Τρύφων
  choice: Трифон
  rationale: Использована традиционная русская форма греческого личного имени Τρύφων.
