lexical_decisions:
- source_word: ἔστησεν
  choice: воздвиг
  rationale: В контексте погребальных памятников глагол передаёт конкретное действие сооружения и установки монументальных построек.
- source_word: ἑπτὰ πυραμίδας
  choice: семь пирамид
  rationale: Прямое соответствие греческому πυραμίδας; форма и назначение сооружений не уточняются сверх сказанного в источнике.
- source_word: μίαν κατέναντι τῆς μιᾶς
  choice: одну напротив другой
  rationale: Естественно по-русски передаёт взаимное расположение сооружений и сохраняет образ греческой фразы.
- source_word: τῷ πατρὶ καὶ τῇ μητρὶ
  choice: для отца, матери
  rationale: Дательный падеж понимается как указание на тех, кому посвящены памятники; притяжательное местоимение не добавлено, поскольку оно отсутствует в греческом тексте и связь ясна из контекста.
- source_word: τέσσαρσιν ἀδελφοῖς
  choice: четырёх братьев
  rationale: ἀδελφοῖς в данном семейном перечне обозначает братьев мужского пола; форма согласована с русской конструкцией «для».
