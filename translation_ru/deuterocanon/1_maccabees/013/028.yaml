  source_fidelity: «Воздвиг семь пирамид» точно передаёт ἔστησεν ἑπτὰ πυραμίδας. Конструкция «одну напротив другой» сохраняет необычную, но ясную формулу μίαν κατέναντι τῆς μιᾶς и не пытается объяснить, как именно были размещены семь сооружений. Дативы переданы как указание на тех, для кого воздвигнуты памятники. Добавление «своих» в русском тексте не меняет референцию, которая очевидна из непосредственного контекста, и устраняет неестественное впечатление, будто речь идёт о неопределённых отце, матери и братьях.
