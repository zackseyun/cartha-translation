- source_word: οὐκ ἀπέστειλα
  choice: я не послал
  rationale: Аорист естественно передан прошедшим временем с сохранением первого лица прямой речи.
- source_word: τὸ ἀργύριον
  choice: серебро
  rationale: Сохраняет конкретный образ греческого слова, которое в контексте обозначает серебро как средство платежа.
- source_word: τὰ παιδάρια
  choice: мальчиков
  rationale: Передаёт основное возрастное значение уменьшительной формы παιδάριον и не навязывает социальную роль; возможное значение молодых слуг отмечено в сноске.
- source_word: ἀπώλετο
  choice: погиб
  rationale: Прямо и естественно передаёт значение прекращения жизни или уничтожения, не уточняя способ и виновника.
