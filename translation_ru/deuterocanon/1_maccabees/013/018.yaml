lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие вводит прямую речь и сохраняет связь с предшествующим множественным субъектом, не уточняя его заново.
- source_word: Ὅτι
  choice: Поскольку
