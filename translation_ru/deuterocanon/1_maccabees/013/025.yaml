lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал людей
  rationale: Греческий глагол означает «послал», но не называет тех, кого послали. В русском языке одно лишь «послал» здесь требует дополнения; «людей» естественно восполняет подразумеваемый объект, не уточняя их число или положение.
- source_word: ἔλαβεν
  choice: забрали
  rationale: В контексте речь идёт о том, что посланные доставили останки Ионафана. «Забрали» естественно передаёт значение «взяли», не добавляя идеи, которой нет в тексте.
- source_word: τὰ ὀστᾶ
  choice: останки
  rationale: Буквально — «кости». В современном русском повествовании о переносе тела умершего «останки» звучит естественно и достойно, сохраняя конкретный смысл контекста.
- source_word: Ἰωναθὰν
  choice: Ионафана
  rationale: Традиционная русская форма библейского имени Jonathan.
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  choice: его брата
  rationale: Прямо и естественно передаёт родственную связь без дополнительного усиления.
- source_word: ἔθαψεν αὐτόν
  choice: похоронили его
  rationale: Обычное современное обозначение погребения. Множественное число согласовано с явно выраженными по-русски посланными людьми; Симон остаётся инициатором всего действия.
- source_word: ἐν Μωδεεὶμ
  choice: в Модине
  rationale: Передаёт греческую форму топонима Μωδεείμ в принятой русской библейской форме и естественно сочетается с предлогом «в».
- source_word: πόλει τῶν πατέρων αὐτοῦ
  choice: городе его предков
  rationale: Буквально — «городе его отцов». В данном контексте πατέρες обозначает предков; такой перевод ясен современному читателю и не создаёт ложного впечатления, будто речь только о непосредственных отцах.
