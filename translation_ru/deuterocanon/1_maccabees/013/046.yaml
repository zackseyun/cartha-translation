  text: And they said, “Do not deal with us according to our wickedness, but according to your mercy.”
translation:
  language: ru
  text: 'И они сказали: «Не поступай с нами по нашим злым делам, но по твоей милости».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρήσῃ
  choice: поступай с нами
  rationale: Средняя форма χράομαι с дательным падежом здесь означает обращаться с кем-либо, поступать по отношению к кому-либо. «Поступай с нами» естественно передаёт этот смысл в форме мольбы.
- source_word: κατὰ τὰς πονηρίας ἡμῶν
  choice: по нашим злым делам
  rationale: Множественное число πονηρίας указывает на конкретные проявления зла или дурные поступки; перевод сохраняет множественность и нравственную оценку исходного текста.
- source_word: ἔλεός
  choice: милости
  rationale: ἔλεος означает милость или сострадание; «милость» прямо и уместно передаёт контраст с воздаянием за злые дела.
- source_word: Μὴ ἡμῖν χρήσῃ
  choice: Не поступай с нами
  rationale: Греческая конструкция выражает прямую просительную мольбу; выбранная формулировка звучит естественно, современно и достойно.
theological_decisions:
- issue: Покаянное противопоставление заслуженного воздаяния и милости
  choice: Передать просьбу не поступать с говорящими по их злым делам, а поступить по милости.
  alternative: «Не воздавай нам за наше нечестие, но яви нам Свою милость»
  rationale: Выбранный перевод сохраняет параллельную конструкцию κατά… κατά и не добавляет отсутствующих в греческом тексте понятий воздаяния или явления милости.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Местоимение «Своей» написано с прописной буквы как традиционное уважительное указание на адресата мольбы; архаическая лексика не используется.
