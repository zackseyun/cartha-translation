  text: And Simon built up the stronghold of Judea[a], and he surrounded it with high towers and great walls and gates and bars[b], and he placed provisions in the strongholds.
translation:
  language: ru
  text: 'И Симон построил крепость Иудеи и окружил её укреплениями: высокими башнями, большими стенами, башнями, воротами и засовами; в укреплениях он разместил запасы продовольствия.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слово «башнями» повторяется; этот повтор сохранён. В начале стиха «крепость» стоит в единственном числе, а здесь — во множественном.
    reason: textual_and_grammatical_ambiguity
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: укрепил
  rationale: В основном значении глагол означает «построил», но применительно к уже названной крепости естественное русское «укрепил» передаёт её обустройство и усиление, не сводя действие лишь к возведению с нуля.
- source_word: τὸ ὀχύρωμα τῆς Ἰουδαίας
  choice: крепость Иудеи
  rationale: ὀχύρωμα обозначает укреплённое место или крепость; единственное число и прямой генитив сохранены.
- source_word: περιετείχισεν
  choice: обнёс её
  rationale: Глагол означает окружить стеной или укреплениями; последующий перечень называет средства укрепления.
- source_word: πύργοις ὑψηλοῖς
  choice: высокими башнями
  rationale: Прямой и естественный перевод военной архитектурной лексики.
- source_word: τείχεσιν μεγάλοις
  choice: мощными стенами
  rationale: Буквально «большими стенами»; «мощными» естественнее по-русски и передаёт масштаб оборонительных стен без лишней конкретизации.
- source_word: πύργοις καὶ πύλαις καὶ μοχλοῖς
  choice: башнями, воротами и засовами
  rationale: Повтор πύργοις сохранён как особенность греческого текста. μοχλοῖς — поперечные брусья или засовы для запирания ворот; «засовы» ясно передаёт функцию.
- source_word: ἔθετο βρώματα
  choice: разместил запасы продовольствия
  rationale: βρώματα буквально означает пищу; в военном контексте речь идёт о продовольственных запасах. «Разместил» сохраняет значение ἔθετο, не усиливая его до явно выраженного «заготовил».
- source_word: ἐν τοῖς ὀχυρώμασιν
  choice: в крепостях
  rationale: Сохранено множественное число греческого текста, несмотря на единственное число в начале стиха.
