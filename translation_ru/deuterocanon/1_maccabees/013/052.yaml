lexical_decisions:
- source_word: ἔστησεν
  choice: установил
  rationale: Глагол обозначает учреждение постоянного порядка на будущее; «установил» естественно передаёт институциональный смысл.
- source_word: κατʼ ἐνιαυτὸν τοῦ ἄγειν τὴν ἡμέραν ταύτην
  choice: ежегодно праздновать этот день
  rationale: Оборот указывает на ежегодное повторение празднования; инфинитивная конструкция по-русски естественно передаётся как установленное действие.
- source_word: προσωχύρωσεν
  choice: укрепил
  rationale: Сложный глагол означает дополнительное укрепление обороны; русский глагол сохраняет военный смысл без излишнего уточнения.
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: гору святилища
  rationale: Передаёт ὄρος и ἱερόν близко к форме греческого текста, не вводя позднейший термин «Храмовая гора».
- source_word: τὸ παρὰ τὴν ἄκραν
  choice: рядом с крепостью
  rationale: ἄκρα допускает нарицательное значение «крепость», а παρά здесь выражает пространственную близость; возможность собственного имени сохранена в сноске.
- source_word: ᾤκει
  choice: поселился
  rationale: В контексте речь идёт о пребывании Симона после укрепления места; «поселился» естественно выражает начало и последующее продолжение проживания, хотя греческий имперфект буквально описывает проживание.
- source_word: οἱ παρʼ αὐτοῦ
  choice: со своими людьми
  rationale: Выражение обозначает людей из ближайшего окружения или свиты; перевод не сужает их до семьи либо воинов.
