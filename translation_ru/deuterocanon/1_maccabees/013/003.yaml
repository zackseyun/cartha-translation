base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/003.yaml
  text: And he encouraged them and said to them[a], “You yourselves know what I and my brothers and my father’s house have done for the laws and the holy things, and the wars and the distresses.”
translation:
  language: ru
  text: 'Он ободрил их и сказал им: «Вы сами знаете всё, что сделали я, мои братья и дом моего отца ради законов и святынь[a], и знаете о войнах и бедствиях».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради законов и святилища». В греческом тексте буквально стоит «святых [вещей]»; выражение может обозначать как святилище, так и святыни или священные установления в более широком смысле.'
    reason: Лексическая неоднозначность τῶν ἁγίων.
lexical_decisions:
- source_word: παρεκάλεσεν
  choice: ободрил
  rationale: В данном контексте Симон укрепляет дух собравшихся; «ободрил» передаёт поддерживающее значение глагола, не сужая его до формального увещевания.
- source_word: Αὐτοὶ οἴδατε
  choice: вы сами знаете
  rationale: Явное местоимение αὐτοί усиливает обращение; «сами» сохраняет это смысловое ударение.
- source_word: οἶκος τοῦ πατρός μου
  choice: дом моего отца
  rationale: Сохранён библейский семейно-родовой образ «дома», который здесь обозначает семью и род отца.
- source_word: περὶ τῶν νόμων καὶ τῶν ἁγίων
  choice: ради законов и святынь
  rationale: «Ради» естественно выражает деятельность в защиту или во благо названного; множественное τῶν ἁγίων передано широким словом «святыни», без неоправданного сведения смысла только к святилищу.
- source_word: τοὺς πολέμους
  choice: о войнах
  rationale: Сохраняется множественное число и прямое значение слова; предлог добавлен по нормам русского управления при глаголе «знаете».
- source_word: τὰς στενοχωρίας
  choice: о бедствиях
  rationale: «Бедствия» передаёт тяжёлые стеснённые обстоятельства и страдания, не добавляя отсутствующего в греческом тексте глагола «перенесли».
- source_word: ἐποιήσαμεν
  choice: сделали
  rationale: Простое и широкое соответствие ποιέω; форма множественного числа согласуется с составным подлежащим «я, мои братья и дом моего отца».
theological_decisions:
- issue: Объём значения τῶν ἁγίων
  choice: святынь
  alternative: святилища
  rationale: Субстантивированное прилагательное во множественном числе может обозначать святые предметы, священные установления или святилище. Основной текст сохраняет более широкий смысл, а возможное узкое понимание отмечено в сноске.
- issue: Синтаксическая связь «войн и бедствий»
  choice: 'связано с «знаете»: «а также о войнах и бедствиях»'
  alternative: связать с «сделали» либо добавить «которые мы перенесли»
  rationale: В греческом после конструкции ὅσα…ἐποιήσαμεν следуют существительные иного рода в винительном падеже, что создаёт свободное присоединение к «знаете». Русский перевод проясняет грамматическую связь, но не добавляет конкретного действия или переживания, которого источник прямо не выражает.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Оборот «дом моего отца» сохранён как прозрачный родовой образ; остальной синтаксис сделан естественным для современного читателя.
