  text: And after these things Tryphon came to enter the city and wipe it out[a], and he encircled the road to Adora[b]; and Simon and his camp marched opposite him to every place where he went.
translation:
  language: ru
  text: После этого Трифон пришёл, чтобы войти в город и уничтожить его, и двинулся в обход по дороге в Адору[a]; а Симон со своим войском двигался напротив него повсюду, куда тот направлялся[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «обошёл дорогу в Адору» или «перекрыл дорогу в Адору». Греческое выражение буквально связывает круговое движение с дорогой, но точный военный манёвр неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «шёл параллельно ему» или «шёл ему навстречу». Греческий глагол указывает на то, что войско Симона соразмеряло свои передвижения с передвижениями Трифона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Естественный современный переход, сохраняющий временную последовательность греческого текста.
- source_word: τοῦ ἐμβατεῦσαι εἰς τὴν πόλιν
  choice: чтобы войти в город
  rationale: Конструкция с τοῦ и инфинитивом передаёт цель; нейтральное «войти» не усиливается до «вторгнуться», поскольку враждебное намерение ясно из следующей фразы.
- source_word: ἐκτρῖψαι αὐτήν
  choice: уничтожить его
  rationale: В военном контексте ἐκτρίβω означает полное разорение или уничтожение; местоимение согласовано с русским словом «город».
- source_word: ἐκύκλωσεν ὁδὸν τὴν εἰς Ἄδωρά
  choice: двинулся в обход по дороге в Адору
  rationale: Передаёт образ кругового или обходного движения и синтаксическую связь с дорогой на Адору, не утверждая безоговорочно, что дорога была перекрыта.
- source_word: Ἄδωρά
  choice: Адору
  rationale: Прямая передача греческой формы географического названия с русским падежным окончанием.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: со своим войском
  rationale: παρεμβολή может обозначать как лагерь, так и расположившееся в нём войско; в описании передвижения естественнее «войско».
- source_word: ἀντιπαρῆγεν αὐτῷ
  choice: шёл параллельно ему
  rationale: Глагол обозначает согласованное встречное, параллельное или противостоящее передвижение; выбранная формулировка естественна по-русски и сохраняет смысл тактического сопровождения без утверждения о прямом нападении.
- source_word: εἰς πάντα τόπον οὗ ἐπορεύετο
  choice: повсюду, куда тот направлялся
  rationale: Естественно передаёт постоянное соответствие передвижений Симона маршруту Трифона.
