lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямо передаёт аорист ἀκούω, вводящий полученное Симоном известие, без добавления оттенка официального уведомления.
- source_word: συνῆγεν
  choice: собирает
  rationale: Настоящее время в придаточном изъяснительном естественно для русского языка и передаёт незавершённость действия, выраженную греческим имперфектом.
- source_word: δύναμιν πολλὴν
  choice: большое войско
  rationale: В военном контексте δύναμις обозначает вооружённые силы; «большое войско» ясно и естественно, не уточняя их организационную структуру.
- source_word: τοῦ ἐλθεῖν
  choice: чтобы вторгнуться
  rationale: Артикулированный инфинитив выражает цель. В контексте движения в чужую землю с намерением уничтожить её «вторгнуться» естественно передаёт враждебный характер прихода, подразумеваемый контекстом.
- source_word: γῆν Ἰούδα
  choice: землю Иуды
  rationale: Формально сохраняет греческое географическое обозначение и не подменяет его более поздним административным названием «Иудея».
- source_word: τοῦ ἐκτρῖψαι αὐτήν
  choice: и уничтожить её
  rationale: Второй артикулированный инфинитив продолжает выражение цели; ἐκτρίβω передаёт намерение полностью уничтожить землю или страну как политико-территориальное целое.
