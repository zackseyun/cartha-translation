lexical_decisions:
- source_word: ὅσα
  choice: всё, что
  rationale: Неопределённое содержание договорённостей в греческом тексте оставлено без добавления существительного «соглашения»; русское «всё, что» естественно сохраняет эту неявность.
- source_word: ἐστήσαμεν
  choice: мы установили
  rationale: В дипломатическом контексте глагол означает введение или закрепление условий; «установили» сохраняет официальный оттенок и не уточняет сверх текста, были ли это соглашения, постановления или условия.
- source_word: πρὸς ὑμᾶς
  choice: вместе с вами
  rationale: Предлог выражает отношение между сторонами. Этот вариант естественно передаёт совместный, договорный контекст, не сводя выражение к одностороннему действию «для вас».
- source_word: ἔστηκεν
  choice: остаётся в силе
  rationale: Перфект ἵστημι здесь указывает на продолжающуюся действительность ранее установленного. Русская формула точно передаёт дипломатический смысл, хотя образ буквального «стоит» не сохраняется.
- source_word: ὀχυρώματα
  choice: укрепления
  rationale: Общее обозначение укреплённых объектов; «укрепления» не навязывает более узкого значения «крепости».
- source_word: ᾠκοδομήσατε
  choice: вы построили
  rationale: Передаёт обычное значение глагола «строить», не подменяя его контекстуальным «укрепили».
- source_word: ὑπαρχέτω ὑμῖν
  choice: пусть остаются за вами
  rationale: В административно-правовом контексте форма подтверждает владение укреплениями. Оборот «остаются за вами» сочетает значение принадлежности с продолжением ранее признанного положения.
