base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/039.yaml
  text: But we forgive you the oversights and the sins up to this present day[a], and the crown tax that you owed; and if anything else was being levied in Jerusalem[b], let it no longer be levied.
translation:
  language: ru
  text: Мы прощаем вам совершённые до сегодняшнего дня проступки по неведению[a] и грехи, а также венечную подать[b], которую вы были должны; и если в Иерусалиме взималось что-либо ещё, пусть впредь не взимается.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ошибки, совершённые по неведению».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «венец»; вероятно, имеется в виду царская подать, называемая венечной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφίεμεν
  choice: прощаем
  rationale: Глагол охватывает прощение проступков и отмену обязательств; «прощаем» сохраняет нравственно-правовую широту выражения.
- source_word: ἀγνοήματα
  choice: проступки по неведению
  rationale: Передаёт вину, возникшую из-за незнания или неумышленности, и отличает её от более общего ἁμαρτήματα.
- source_word: ἁμαρτήματα
  choice: грехи
  rationale: Сохраняет обычную нравственную силу греческого слова, не сводя его к административным нарушениям.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: до сегодняшнего дня
  rationale: Естественно и точно обозначает временную границу объявленного прощения.
- source_word: στέφανον
  choice: венечную подать
  rationale: Буквально слово означает «венец», но здесь обозначает связанный с ним царский сбор; традиционно-административное «венечная подать» сохраняет и образ, и фискальный смысл.
- source_word: ὠφείλετε
  choice: вы были должны
  rationale: Передаёт существовавшее прежде долговое обязательство, которое указом отменяется.
- source_word: ἐτελωνεῖτο
  choice: взималось
  rationale: В контексте налогов глагол указывает на взимание пошлины или сбора; нейтральная формулировка не уточняет неизвестный вид платежа.
- source_word: μηκέτι τελωνιζέσθω
  choice: пусть впредь не взимается
  rationale: Сохраняет пассивную форму и официальный, предписывающий тон указа.
theological_decisions:
- issue: Нравственный или только административный смысл ἁμαρτήματα
  choice: грехи
  alternative: преступления; проступки
  rationale: Хотя контекст политико-фискальный, греческое слово сохраняет нравственную окраску; перевод «грехи» не устраняет напряжение между нравственным прощением и царским освобождением от повинностей.
- issue: Буквальная или фискальная передача στέφανον
  choice: венечная подать
  alternative: венец; царская подать
  rationale: Просто «венец» в данном контексте был бы неясен, тогда как «венечная подать» обозначает сбор и одновременно сохраняет буквальный образ греческого слова.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным тоном царского указа. Парные понятия ἀγνοήματα и ἁμαρτήματα разграничены, а административная формула передана ясно и без излишней архаизации.
