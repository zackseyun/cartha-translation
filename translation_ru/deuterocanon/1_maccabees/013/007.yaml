lexical_decisions:
- source_word: ἀνεζωπύρισεν
  choice: вновь воспламенился
  rationale: Глагол передаёт образ снова разгорающегося огня и одновременно указывает на возвращение жизненной силы и решимости; русская формулировка сохраняет метафору и естественно описывает подъем духа.
- source_word: τὸ πνεῦμα
  choice: дух
  rationale: Буквальное соответствие сохраняет образ внутренней силы и решимости народа, не сужая значение до одного лишь мужества или настроения.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: его народа
  rationale: Передаёт родительный падеж и притяжательное αὐτοῦ без устранения личной связи, выраженной в греческом тексте.
- source_word: ἀκοῦσαι
  choice: когда они услышали
  rationale: Инфинитив обозначает обстоятельство, при котором произошло оживление духа; придаточное времени ясно и естественно передаёт этот смысл по-русски.
- source_word: τῶν λόγων τούτων
  choice: эти слова
  rationale: Прямое и естественное обозначение только что произнесённой речи.
