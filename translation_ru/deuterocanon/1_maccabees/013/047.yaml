base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/047.yaml
  text: And Simon came to terms with them and did not fight against them[a]. He drove them out of the city and cleansed the houses in which the idols were[b], and so he entered it with hymns and blessings.
translation:
  language: ru
  text: И Симон договорился с ними и не стал воевать против них[a]. Он изгнал их из города, очистил дома, в которых находились идолы[b], и вошёл в город с пением гимнов и благословениями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласился с ними». Греческое причастие может означать достижение соглашения, благодаря которому Симон не вступил с ними в бой.'
    reason: lexical_alternative
  - marker: b
    text: То есть дома, где находились изображения языческих богов; очищение, вероятно, имело не только бытовое, но и религиозное значение.
    reason: cultural_note
lexical_decisions:
- source_word: συνευδὼν
  choice: договорился с ними
  rationale: Причастие обозначает согласие или достижение договорённости; в данном контексте речь идёт о практическом соглашении, позволившем избежать сражения.
- source_word: ἐπολέμησεν
  choice: не стал воевать против них
  rationale: Передаёт военное значение глагола и естественно выражает решение Симона не вступать в бой.
- source_word: ἐξέβαλεν
  choice: изгнал
  rationale: Сохраняет принудительный характер удаления жителей из города.
- source_word: ἐκαθάρισεν
  choice: очистил
  rationale: В сочетании с упоминанием идолов слово указывает не только на уборку, но и на устранение культового осквернения.
- source_word: τὰ εἴδωλα
  choice: идолы
  rationale: Контекст подразумевает языческие культовые изображения, а не изображения вообще.
- source_word: ὑμνῶν
  choice: с пением гимнов
  rationale: Причастие описывает способ торжественного входа; эта формулировка ясно передаёт действие и сохраняет богослужебный оттенок.
- source_word: εὐλογῶν
  choice: с благословениями
  rationale: Сохраняет основное значение «благословлять» и не сводит его без необходимости к одной лишь хвале.
theological_decisions:
- issue: Культовое значение очищения домов, где находились идолы
  choice: «очистил», а не просто «убрал» или «вычистил»
  alternative: «очистил от скверны» / «вычистил»
  rationale: Греческий текст связывает очищение с присутствием идолов, что предполагает религиозный аспект; при этом перевод не добавляет прямо не названного обряда.
- issue: Объект благословения в εὐλογῶν
  choice: 'Оставлен невыраженным: «с благословениями»'
  alternative: «благословляя Бога»
  rationale: В контексте, вероятно, подразумевается благословение Бога, однако прямого дополнения в греческом тексте нет, поэтому неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; местоимение αὐτήν передано как «город», чтобы избежать неестественной и двусмысленной русской анафоры.
