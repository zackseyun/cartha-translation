lexical_decisions:
- source_word: ἀνὴρ
  choice: стал мужем
  rationale: В данном контексте выражение указывает на достижение Иоанном зрелости и способности нести ответственность. «Стал мужем» сохраняет образ греческого текста и звучит естественнее, чем буквальное «есть муж».
- source_word: ἔθετο
  choice: поставил
  rationale: При назначении на руководящую должность русское «поставил» естественно передаёт действие и сохраняет образ исходного глагола.
- source_word: ἡγούμενον τῶν δυνάμεων πάσων
  choice: во главе всех войск
  rationale: В сочетании с обозначением военных сил причастие означает командование; эта формулировка ясна и не сужает значение до отдельного подразделения.
- source_word: ᾤκει
  choice: жил
  rationale: Имперфект обозначает продолжающееся проживание; «жил» — естественный современный эквивалент.
- source_word: ἐν Γαζάροις
  choice: в Газаре
  rationale: Сохранена греческая форма топонима с нормативным русским склонением; более известное название «Гезер» указано в сноске.
theological_decisions:
- issue: Неявный субъект глагола ᾤκει
  choice: «И жил он»
  alternative: «И Иоанн жил» / «И Симон жил»
  rationale: Греческий текст не называет субъект повторно. Местоименная конструкция сохраняет эту грамматическую неоднозначность и не вводит толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сделан ясным для широкого читателя; неоднозначность последнего подлежащего сохранена.
