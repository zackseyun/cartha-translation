  text: And Simon saw that John his son was a man[a], and he appointed him commander over all the forces; and he lived in Gazara.
translation:
  language: ru
  text: И увидел Симон, что его сын Иоанн стал мужчиной, и поставил его во главе всех войск. И жил он в Газаре[a].
  philosophy: optimal-equivalence
