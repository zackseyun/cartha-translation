  text: And Jonathan son of Absalom sent a considerable force with him to Joppa[a], and he drove out those who were in it and remained there.
translation:
  language: ru
  text: Он послал в Иоппию Ионафана, сына Авессалома, а с ним — значительный отряд. Ионафан изгнал тех, кто находился в городе, и остался там[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «остался там, в ней». Повторное указание места, вероятно, подчёркивает, что он остался в самом городе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный глагол направления человека с поручением; пропущенное в греческом подлежащее сохранено местоимением «он», поскольку оно определяется контекстом.
- source_word: Ἰωνάθαν τὸν τοῦ Ἀψαλώμου
  choice: Ионафана, сына Авессалома
  rationale: Конструкция с артиклем и родительным падежом обозначает происхождение; традиционные русские формы имён уместны в библейском тексте.
- source_word: δύναμιν ἱκανὴν
  choice: значительный отряд
  rationale: δύναμις здесь означает военную силу, то есть отряд, а ἱκανή указывает на его существенную численность или достаточную мощь. «Значительный отряд» естественно передаёт оба оттенка.
- source_word: εἰς Ἰόππην
  choice: в Иоппию
  rationale: εἰς обозначает направление к городу; «Иоппия» — устоявшаяся русская библейская форма топонима.
- source_word: ἐξέβαλεν
  choice: изгнал
  rationale: В военно-политическом контексте глагол означает принудительное удаление находившихся в городе людей.
- source_word: τοὺς ἐν αὐτῇ ὄντας
  choice: тех, кто находился в городе
  rationale: Формулировка сохраняет неопределённость греческого текста относительно личности и статуса этих людей; слово «жители» могло бы необоснованно обозначить постоянное население.
- source_word: ἔμεινεν ἐκεῖ ἐν αὐτῇ
  choice: остался там
  rationale: Естественная русская передача пребывания в уже названной Иоппии; сочетание двух указаний места в греческом отмечено в сноске.
