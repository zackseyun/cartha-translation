  rationale: Формально соответствует инфинитиву и уместно вводит приводимую далее датировочную формулу.
- source_word: ἐν ταῖς συγγραφαῖς καὶ συναλλάγμασιν
  choice: в документах и договорах
  rationale: συγγραφαί обозначает письменные документы, а συναλλάγματα в данном административно-правовом контексте — договоры или соглашения.
- source_word: Ἔτους πρώτου
  choice: Первый год
  rationale: Передаёт краткую официальную формулу летосчисления; по-русски она естественнее, чем буквальное «Год первый».
- source_word: ἐπὶ Σίμωνος
  choice: при Симоне
  rationale: ἐπί с родительным в датировочной формуле указывает на время правления или пребывания у власти; «при Симоне» сохраняет это значение, не превращая формулу в обозначение принадлежности года.
- source_word: ἀρχιερέως μεγάλου
  choice: великом первосвященнике
  rationale: 'Переданы оба элемента титула: ἀρχιερεύς и усиливающее μεγάλου.'
- source_word: στρατηγοῦ
  choice: военачальнике
  rationale: Точно и естественно передаёт военный титул στρατηγός без привязки к современной системе генеральских званий.
- source_word: ἡγουμένου
  choice: вожде
  rationale: Обозначает ведущего или правящего человека; «вождь» сохраняет широкий политический смысл и хорошо сочетается с официальным титулом.
- source_word: Ἰουδαίων
  choice: иудеев
  rationale: В русском библейском и историческом контексте «иудеи» естественно обозначает данный этнополитический коллектив; возможный более географический смысл отмечен в сноске.
theological_decisions:
