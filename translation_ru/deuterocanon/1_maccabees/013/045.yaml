  text: And those in the city went up onto the wall with their wives and children, having torn their garments, and they cried out with a loud voice, asking Simon to give them his right hand.
translation:
  language: ru
  text: И находившиеся в городе поднялись на стену вместе с жёнами и детьми, разодрав одежды[b], и громко взывали, прося Симона дать им заверения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дать им правые руки». Это выражение могло означать обменяться заверениями доброй воли, обещать безопасность или предложить условия мира.'
    reason: lexical_alternative
  - marker: b
    text: Разрывание одежды было принятым знаком скорби, бедствия или настоятельной мольбы.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν
  choice: поднялись
  rationale: Передаёт направленное вверх движение и естественно сочетается с восхождением на городскую стену.
- source_word: οἱ ἐν τῇ πόλει
  choice: находившиеся в городе
  rationale: Сохраняет собирательную и неопределённую форму греческого выражения, не добавляя отсутствующего существительного.
- source_word: σὺν ταῖς γυναιξὶ καὶ τοῖς τέκνοις
  choice: вместе с жёнами и детьми
  rationale: В контексте осады речь, вероятнее всего, идёт о мужчинах города и сопровождавших их жёнах и детях; русский вариант естественно передаёт эту связь.
- source_word: ἐπὶ τὸ τεῖχος
  choice: на стену
  rationale: При глаголе восхождения обозначает подъём на городскую стену, а не простое приближение к ней.
- source_word: διερρωχότες τὰ ἱμάτια αὐτῶν
  choice: они разорвали на себе одежды
  rationale: Передаёт совершённое действие и возникшее вследствие него состояние; «одежды» соответствует библейскому контексту и остаётся понятным современному читателю.
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: громко взывали
  rationale: Естественно и выразительно передаёт усилительную греческую конструкцию без тяжеловесного буквального оборота «великим голосом».
- source_word: ἀξιοῦντες
  choice: прося
  rationale: В данном контексте обозначает настойчивую просьбу; нейтральное «прося» не усиливает её до требования.
- source_word: δεξιὰς αὐτοῖς δοῦναι
  choice: протянуть им правую руку
  rationale: Сохраняет конкретный образ греческой идиомы и его неоднозначность, а вероятный смысл обещания мира или безопасности поясняется в сноске.
theological_decisions:
- issue: Идиоматическое значение выражения δεξιὰς ... δοῦναι при сдаче осаждённого города
  choice: 'Сохранить в основном тексте образ правой руки: «протянуть им правую руку»'
  alternative: «дать им обещание безопасности» или «предложить им условия мира»
  rationale: Греческое множественное δεξιάς употреблено идиоматически о заверении, соглашении или гарантии доброй воли. Основной текст сохраняет образ, не сводя его безоговорочно к одному виду договора; смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис упрощён для ясности, но последовательность событий и конкретный образ греческой идиомы сохранены.
