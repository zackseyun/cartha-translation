  to: И находившиеся в городе поднялись на стену вместе с жёнами и детьми, разодрав одежды[b], и громко взывали, прося Симона дать им заверения[a].
  rationale: Правка устраняет добавленный временной оттенок, точнее передаёт синтаксическую роль перфектного причастия и заменяет неудачный буквальный жестовый перевод греческой идиомы на естественное русское выражение. Сноска сохраняет буквальный образ «правых рук» и не сводит значение к одному конкретному виду соглашения.
