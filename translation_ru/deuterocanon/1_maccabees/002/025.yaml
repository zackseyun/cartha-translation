lexical_decisions:
- source_word: τὸν ἄνδρα τοῦ βασιλέως
  choice: царского человека
  rationale: Буквальное сочетание «человек царя» обозначает человека, принадлежащего к царской службе или представляющего царя. Формулировка «царский человек» сохраняет прямоту греческого текста, а сноска поясняет вероятный служебный статус.
- source_word: τὸν ἀναγκάζοντα
  choice: принуждавшего их
  rationale: Причастие от ἀναγκάζω выражает реальное принуждение. Местоимение «их» восполняет подразумеваемый объект из контекста — местных жителей, которых заставляли участвовать в жертвоприношении.
- source_word: θύειν
  choice: приносить жертвы
  rationale: В культовом контексте θύω означает совершать жертвоприношение; русское сочетание «приносить жертвы» естественно и точно передаёт этот смысл.
- source_word: ἀπέκτεινεν
  choice: убил
  rationale: Прямой современный эквивалент ἀποκτείνω, без архаической или судебной окраски.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: в тот момент
  rationale: Фраза выделяет время совершения действия. «В тот момент» естественно связывает убийство с непосредственно предшествующим событием и сохраняет временной акцент оригинала.
- source_word: τὸν βωμὸν
  choice: жертвенник
  rationale: βωμός обозначает культовый алтарь; «жертвенник» — точный и привычный русский библейский термин.
- source_word: καθεῖλεν
  choice: разрушил
  rationale: καθαιρέω здесь означает свалить или снести сооружение. «Разрушил» ясно передаёт насильственное уничтожение жертвенника, не добавляя лишних подробностей.
theological_decisions:
- issue: Подразумеваемый объект при «принуждавшего приносить жертвы»
  choice: принуждавшего их приносить жертвы
  alternative: принуждавшего людей приносить жертвы; принуждавшего его приносить жертву; принуждавшего приносить жертвы
  rationale: В греческом тексте объект при ἀναγκάζοντα прямо не назван, но контекст говорит о жителях, которых царская власть заставляла совершать запрещённые жертвоприношения. Множественное «их» передаёт этот контекст, не сводя принуждение к одному человеку.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис краток и энергичен, как в греческом оригинале; архаизмы и конфессионально окрашенные толкования не используются.
