  yaml_path: translation/deuterocanon/1_maccabees/002/070.yaml
  text: And he died in the one hundred forty-sixth year[a], and his sons buried him in the tombs of his fathers at Modein, and all Israel mourned for him with great mourning.
translation:
  language: ru
  text: И умер он в сто сорок шестом году[a]. Его сыновья похоронили его в гробницах своих отцов в Модеине, и весь Израиль оплакивал его великим плачем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть, вероятно, в сто сорок шестом году эры Селевкидов.
    reason: Культурно-историческое пояснение системы датировки, не названной прямо в греческом тексте.
lexical_decisions:
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямой и естественный эквивалент аориста без эвфемизма.
- source_word: ἐν τῷ ἕκτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: в сто сорок шестом году
  rationale: Естественно передаёт греческую формулу датировки и сохраняет порядковое значение, не добавляя названия эры.
- source_word: ἔθαψαν
  choice: похоронили
  rationale: Обычный современный русский глагол, точно обозначающий погребение.
- source_word: τάφοις πατέρων αὐτοῦ
  choice: в гробницах его предков
  rationale: «Гробницы» передаёт τάφοις, а «предков» естественно выражает родовое значение πατέρων в данном погребальном контексте.
- source_word: Μωδεείν
  choice: Модеин
  rationale: Транслитерация греческой формы географического названия, согласованная с русской библейской традицией.
- source_word: ἐκόψαντο
  choice: оплакивал
  rationale: Передаёт траурное действие без необоснованного уточнения конкретного ритуального жеста.
- source_word: κοπετὸν μέγαν
  choice: великим плачем
  rationale: Сохраняет усиление, выраженное родственным по корню дополнением, и звучит достойно и понятно по-русски.
- source_word: πᾶς Ἰσραήλ
  choice: весь Израиль
  rationale: Естественное коллективное обозначение народа в целом.
theological_decisions:
- issue: К какой эре относится хронологическая формула
  choice: В основном тексте оставлено «в сто сорок шестом году»
  alternative: «в сто сорок шестом году эры Селевкидов»
  rationale: Греческий текст не называет эру. Исторически речь, вероятнее всего, идёт об эре Селевкидов, но это поясняется в сноске, а не добавляется в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Краткие повествовательные предложения улучшают читаемость; формула «великим плачем» сохраняет торжественную интенсивность оригинала.
