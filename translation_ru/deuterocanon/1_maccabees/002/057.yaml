  text: David[a], because of his mercy, inherited the throne of an everlasting kingdom.
translation:
  language: ru
  text: Давид[a] благодаря своему милосердию унаследовал престол вечного царства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давид по милости Бога унаследовал престол вечного царства». Местоимение «его» в греческом тексте можно отнести не к Давиду, а к Богу.'
    reason: alternative_reading
lexical_decisions:
- source_word: Δαυεὶδ
  choice: Давид
  rationale: Общепринятая русская форма библейского имени.
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: благодаря своему милосердию
  rationale: Предлог ἐν с дательным падежом здесь допускает значение основания или средства. Такой перевод естественно передаёт вероятную причинную связь и относит αὐτοῦ к Давиду, не скрывая иной возможности в сноске.
- source_word: ἐκληρονόμησεν
  choice: унаследовал
  rationale: Передаёт основное значение κληρονομέω и сохраняет династический оттенок получения престола как наследия.
- source_word: θρόνον
  choice: престол
  rationale: Традиционное и стилистически уместное обозначение царской власти; определённость понятна из контекста без отдельного средства выражения.
- source_word: βασιλείας αἰωνίας
  choice: вечного царства
  rationale: Сохраняет родительную конструкцию и передаёт αἰωνίας как непреходящий, вечный характер царства.
theological_decisions:
- issue: К кому относится αὐτοῦ в выражении ἐν τῷ ἐλέει αὐτοῦ
  choice: 'Местоимение отнесено к Давиду: «благодаря своему милосердию».'
  alternative: «по милости Бога» или «благодаря Божьей милости».
  rationale: Ближайшим названным референтом является Давид, а контекст перечисляет похвальные качества праведников. Однако грамматика допускает отнесение местоимения к Богу, поэтому богословская неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Формулировка краткая и ясная; «престол» и «вечное царство» сохраняют торжественный характер исходного текста.
