  yaml_path: translation/deuterocanon/1_maccabees/002/063.yaml
  text: Today he will be exalted[a], and he will surely not be found, because he has returned to his dust[b], and his plans have perished.
translation:
  language: ru
  text: Сегодня он будет возвышен[a], и его никогда не найдут, потому что он возвратился в свой прах, и его замысел погиб[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет поднят». Греческое слово может означать как буквальное поднятие, так и возвышение в положении или известности.'
