    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  choice: Сегодня
  rationale: Передаёт непосредственность временного указания и сохраняет афористическое звучание.
- source_word: ἐπαρθήσεται
  choice: будет возвышен
  rationale: Сохраняет страдательную форму и допускает как буквальный образ поднятия, так и контекстуальное возвышение в положении или славе.
- source_word: οὐ μὴ εὑρεθῇ
  choice: его уже не найдут
  rationale: Частица «уже» естественно передаёт по-русски категоричность усиленного греческого отрицания οὐ μή, не утяжеляя фразу.
- source_word: ἐπέστρεψεν
  choice: возвратился
  rationale: Точно передаёт совершившееся возвращение; прошедшее время естественно после причинного «потому что».
- source_word: εἰς τὸν χοῦν αὐτοῦ
  choice: в свой прах
  rationale: «Прах» сохраняет образ смертности и вероятную отсылку к возвращению человека в прах, тогда как «земля» была бы менее выразительна.
- source_word: ὁ διαλογισμὸς αὐτοῦ
  choice: замысел его
  rationale: Единственное число исходного текста сохранено; «замысел» в данном контексте естественно охватывает намерение или план человека, не превращая выражение в утверждение об исчезновении души.
- source_word: ἀπώλετο
  choice: погиб
  rationale: Передаёт резкую завершённость ἀπόλλυμι и согласуется с единственным числом слова «замысел».
theological_decisions:
- issue: Смысл διαλογισμός после смерти человека
  choice: «замысел его погиб»
  alternative: «мысль его исчезла»; «планы его рухнули»
  rationale: Греческий текст говорит об исчезновении замысла, мысли или рассуждения человека, но не называет душу и не формулирует учение о её судьбе. Единственное число также сохранено.
- issue: Характер возвышения в ἐπαρθήσεται
  choice: «будет возвышен»
  alternative: «будет поднят»; «вознесётся»
  rationale: Формулировка сохраняет образ высоты и страдательный залог, не уточняя без достаточных оснований, идёт ли речь о положении, почёте или ином виде возвышения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и афористическим строем. Инверсия «замысел его» сохраняет достоинство библейской речи без чрезмерной архаизации; все примечания обозначены в основном тексте.
