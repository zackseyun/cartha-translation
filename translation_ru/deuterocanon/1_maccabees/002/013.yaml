lexical_decisions:
- source_word: ἵνα τί
  choice: Зачем
  rationale: В койне сочетание употребляется как вопрос о причине или цели. «Зачем» естественно передаёт здесь скорбный риторический вопрос, не добавляя отсутствующего в греческом тексте объяснения.
- source_word: ἡμῖν
  choice: нам
  rationale: 'Дательный ἡμῖν при инфинитиве обозначает субъект действия: буквально «нам жить». Русская конструкция «нам жить» естественна и позволяет сохранить форму исходного выражения.'
- source_word: ἔτι
  choice: ещё
  rationale: 'Наречие указывает на продолжение: «ещё, по-прежнему». В сочетании «ещё жить» оно сохраняет подразумеваемое сомнение в смысле дальнейшей жизни.'
- source_word: ζῇν
  choice: жить
  rationale: Инфинитив настоящего времени означает жить или продолжать жить. Краткое «жить» точно и естественно; значение продолжения уже выражено словом «ещё».
