base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/037.yaml
  text: saying[a], “Let us all die in our innocence; heaven and earth testify against you concerning us[b], that you are destroying us unjustly.”
translation:
  language: ru
  text: 'говоря: «Умрём же все в нашей невиновности[a]. Небо и земля свидетельствуют о нас, что вы губите нас без суда[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в нашей простоте», «в нашем чистосердечии». Греческое слово может обозначать простоту, искренность и цельность; здесь оно, вероятно, подчёркивает невиновность и отсутствие злого умысла.'
    reason: lexical_alternative
  - marker: b
    text: То есть без разбирательства и судебного решения, а потому несправедливо.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие вводит прямую речь и естественно продолжает синтаксис предшествующего контекста.
- source_word: Ἀποθάνωμεν οἱ πάντες
  choice: Умрём же все
  rationale: Аористный сослагательный имеет побудительное значение; частица «же» естественно передаёт решимость призыва, а «все» сохраняет охват οἱ πάντες.
- source_word: ἐν τῇ ἁπλότητι ἡμῶν
  choice: в нашей невиновности
  rationale: В контексте отказа от сопротивления ἁπλότης указывает прежде всего на моральную непричастность к вине и отсутствие злого умысла; буквальные оттенки простоты и чистосердечия сохранены в примечании.
- source_word: μαρτυρεῖ ἐφʼ ἡμᾶς
  choice: свидетельствуют о нас
  rationale: Оборот допускает судебно-направительный оттенок, но «о нас» естественно связывает свидетельство неба и земли с последующим содержанием ὅτι, не добавляя однозначно отсутствующего в греческом «против вас».
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: Небо и земля
  rationale: Сохранена традиционная библейская формула; единственное число греческого сказуемого при составном подлежащем по-русски естественно передаётся множественным числом.
- source_word: ἀκρίτως
  choice: без суда
  rationale: Передаёт конкретный судебный смысл — без разбирательства или вынесения решения — и сохраняет заложенное в контексте обвинение в несправедливости.
- source_word: ἀπόλλυτε ἡμᾶς
  choice: вы губите нас
  rationale: Настоящее время и прямое обращение сохранены; «губите» передаёт широкий смысл ἀπόλλυμι и в данном контексте ясно подразумевает убийство.
theological_decisions:
- issue: Смысл ἁπλότης в контексте мученической смерти
  choice: невиновность
  alternative: простота; чистосердечие; искренность
  rationale: Говорящие утверждают свою непричастность к вине и отказ от насилия, однако примечание сохраняет более широкий лексический диапазон греческого слова.
- issue: Направленность μαρτυρεῖ ἐφʼ ἡμᾶς
  choice: свидетельствуют о нас
  alternative: свидетельствуют за нас; свидетельствуют против вас из-за нас
  rationale: Предлог ἐπί здесь допускает неоднозначность. Нейтральное «о нас» сохраняет связь с содержанием свидетельства и не вводит в основной текст спорную адресную формулу.
- issue: Сила ἀκρίτως
  choice: без суда
  alternative: несправедливо; без разбирательства
  rationale: Так сохраняется процедурно-правовой оттенок греческого наречия, тогда как примечание раскрывает его моральный смысл.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Побудительное «Умрём же» звучит решительно, но не архаично. Формула «Небо и земля свидетельствуют» сохраняет торжественный судебный образ; неоднозначность ἐφʼ ἡμᾶς не разрешена добавлением «против вас».
