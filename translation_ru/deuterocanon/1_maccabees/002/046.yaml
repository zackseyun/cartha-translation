  text: And they circumcised the uncircumcised boys[a], as many as they found within the borders of Israel[b], by force.
translation:
  language: ru
  text: И они обрезали всех необрезанных мальчиков, которых нашли в пределах Израиля[a], насильно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на территории Израиля»; возможно также: «в областях Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с силой»; по смыслу речь идёт о принуждении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέτεμον
  choice: обрезали
  rationale: Аорист действительного залога от περιτέμνω, обычного греческого глагола для совершения обрезания; русский эквивалент точен и естественен.
- source_word: τὰ παιδάρια τὰ ἀπερίτμητα
  choice: всех необрезанных мальчиков
  rationale: παιδάριον может обозначать ребёнка или мальчика; в связи с обрезанием «мальчиков» естественно передаёт вероятный круг лиц, не уточняя возраст сверх текста. Сочетание с ὅσα передано словом «всех».
- source_word: ὅσα εὗρεν
  choice: которых нашли
  rationale: Несмотря на единственное число εὗρεν в издании Света, оборот с нейтральным множественным ὅσα имеет собирательно-распределительный смысл. По-русски согласование с подразумеваемой группой действующих лиц естественно передаётся множественным числом.
- source_word: ἐν ὁρίοις Ἰσραήλ
  choice: в пределах Израиля
  rationale: ὅρια может означать границы, территорию или области. «В пределах Израиля» сохраняет территориальный смысл и не сужает его до пограничной полосы.
- source_word: ἐν ἰσχύϊ
  choice: насильно
  rationale: Буквально оборот означает «с силой», но в данном контексте указывает на принуждение. «Насильно» ясно и кратко передаёт этот смысл.
theological_decisions:
- issue: Нравственная и богословская оценка описанного действия
  choice: 'Передать действие описательно и не смягчать принуждение: «насильно».'
  alternative: «с силой» или «ревностно»
  rationale: ἐν ἰσχύϊ здесь характеризует применение силы. Перевод не должен ни оправдывать действие, ни добавлять прямое осуждение, которого в стихе нет.
