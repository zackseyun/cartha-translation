  yaml_path: translation/deuterocanon/1_maccabees/002/009.yaml
  text: The vessels of her glory were carried away captive[a]; her infants were slain in her streets[b], her young men by the enemy’s sword.
translation:
  language: ru
  text: Сосуды её славы были уведены в плен[a]; младенцы её были убиты на её улицах[b], а юноши её — мечом врага.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были отведены как пленники». Греческое выражение подчёркивает насильственное уведение в плен.'
    reason: lexical_alternative
  - marker: b
    text: Повторяющееся «её» относится к олицетворённому городу в окружающем контексте — вероятно, к Иерусалиму, или Сиону.
    reason: cross_reference
lexical_decisions:
- source_word: σκεύη
  choice: сосуды
  rationale: Слово обозначает сосуды, утварь или принадлежности; «сосуды» сохраняет вероятную связь со священной утварью, не уточняя её сверх греческого текста.
- source_word: δόξης
  choice: славы
  rationale: «Слава» передаёт возвышенный тон и возможный священный оттенок, сохраняя при этом значение великолепия и почёта.
- source_word: αἰχμάλωτα ἀπήχθη
  choice: были уведены в плен
  rationale: Сочетание выражает насильственное перемещение как пленников. Необычная применительно к сосудам формулировка сохраняет олицетворяющую силу греческого текста.
- source_word: νήπια
  choice: младенцы
  rationale: Слово указывает на совсем маленьких детей; «младенцы» кратко и торжественно передаёт трагический смысл.
- source_word: ἀπεκτάθη
  choice: были убиты
  rationale: Глагол прямо обозначает лишение жизни. Современное «были убиты» ясно и естественно, не ослабляя трагизма.
- source_word: πλατείαις
  choice: улицах
  rationale: Слово может обозначать широкие улицы или открытые городские пространства; «улицах» естественно в контексте и не вносит излишней конкретизации.
- source_word: νεανίσκοι
  choice: юноши
  rationale: «Юноши» сохраняет возрастное отличие от младенцев и соответствует возвышенному плачевному регистру.
- source_word: ῥομφαίᾳ
  choice: мечом
  rationale: Основное контекстуальное значение — меч; указание на особо крупный клинок здесь не существенно.
- source_word: ἐχθροῦ
  choice: врага
  rationale: Единственное число в родительном падеже естественно передаётся собирательно или представительно как «врага».
theological_decisions:
- issue: К кому относится повторяющееся местоимение αὐτῆς («её»)
  choice: Сохранить женское местоимение, не называя его референт в самом стихе.
  alternative: Прямо назвать Иерусалим или Сион.
  rationale: Антецедент определяется окружающим контекстом. Местоимение сохраняет поэтическое олицетворение города и не делает текст более определённым, чем греческий оригинал.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией плача. Сохранены параллелизм, олицетворение города и намеренно необычный образ сосудов, уведённых в плен.
