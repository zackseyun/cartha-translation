base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/051.yaml
  text: Remember the deeds of our fathers[a], which they did in their generations, and receive great glory and everlasting glory.
translation:
  language: ru
  text: Вспомните дела наших отцов, совершённые ими в свои времена[a], и обретите великую славу и славу вечную.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в своих поколениях».'
    reason: Буквальная форма сохраняет неоднозначность греческого выражения, которое может указывать на поколения или на эпоху жизни каждого из отцов.
lexical_decisions:
- source_word: μνήσθητε
  choice: Вспомните
  rationale: Аорист повелительного наклонения выражает прямой призыв деятельно обратиться памятью к примеру предков.
- source_word: τῶν πατέρων ἡμῶν
  choice: наших отцов
  rationale: Сохраняет мужской род и библейское звучание греческого πατέρων; по контексту речь идёт о праотцах Израиля.
- source_word: ἔργα
  choice: дела
  rationale: Передаёт конкретные и памятные поступки предков естественным для современного русского языка словом.
- source_word: ταῖς γενεαῖς αὐτῶν
  choice: в своё время
  rationale: Идиоматично передаёт действия отцов в соответствующие им эпохи; буквальная форма приведена в сноске из-за возможной смысловой широты выражения.
- source_word: δέξασθε
  choice: обретите
  rationale: В данном увещевании естественно обозначает получение или достижение славы вследствие верности; буквальное «примите» по-русски здесь звучит менее ясно.
- source_word: δόξαν μεγάλην καὶ δόξαν αἰώνιον
  choice: великую славу и славу вечную
  rationale: Сохраняет повтор δόξαν, его риторическое усиление и различие двух определений, не подменяя второе употребление понятием известности или почёта.
theological_decisions:
- issue: Мужское обозначение предков πατέρων
  choice: наших отцов
  alternative: наших предков
  rationale: Греческий текст использует явно мужской род; перевод сохраняет эту форму и традиционную библейскую связь с праотцами Израиля.
- issue: Повтор слова δόξα
  choice: великую славу и славу вечную
  alternative: великую славу и вечную известность
  rationale: Дословный повтор сохраняет богословскую и риторическую открытость понятия δόξα — славы, чести или признания — и не сужает второе употребление до посмертной известности.
- issue: Значение ταῖς γενεαῖς αὐτῶν
  choice: в своё время
  alternative: в своих поколениях
  rationale: Основной текст передаёт вероятный временной смысл естественно по-русски, а сноска сохраняет буквальную конструкцию и присущую ей неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Инверсия «славу вечную» сохраняет торжественный параллелизм и отчётливый повтор исходного слова.
