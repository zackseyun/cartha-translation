lexical_decisions:
- source_word: ὁ καλούμενος
  choice: прозванный
  rationale: В перечне сыновей оборот обозначает дополнительное имя или прозвище; «прозванный» естественно и кратко передаёт эту функцию.
- source_word: Αὐαράν
  choice: Авараном
  rationale: Транслитерация греческой формы Αὐαράν с падежным оформлением, требуемым русской конструкцией «прозванный».
- source_word: Σαφφούς
  choice: Сапфусом
  rationale: Следование засвидетельствованному греческому тексту Σαφφούς; английское Apphus отражает иную текстовую форму и здесь не принимается как основная.
