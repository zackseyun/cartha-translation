  source_fidelity: 'Греч. καὶ διέρρηξεν ... τὰ ἱμάτια αὐτῶν, καὶ περιεβάλοντο σάκκους, καὶ ἐπένθησαν σφόδρα точно передаёт последовательность траурных действий: разорвали одежды, облачились во вретище, затем сильно скорбели. Вариант «разорвали на себе одежды» и «облачились во вретище» верен. Однако «предались глубокой скорби» несколько перефразирует простой глагол ἐπένθησαν и заменяет наречное усиление σφόδρα существительным с качественным определением.'
