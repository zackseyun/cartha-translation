translation:
  language: ru
  text: Маттафия и его сыновья разорвали на себе одежды, облачились во вретище и глубоко скорбели.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέρρηξεν
  choice: разорвали на себе
  rationale: Глагол обозначает разрывание одежд как знак скорби или возмущения. Выражение «разорвали на себе одежды» естественно передаёт этот известный жест; греческое единственное число сказуемого при составном подлежащем по-русски передано множественным.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: одежды
  rationale: Ἱμάτια означает одежду или верхние одежды. Множественное «одежды» уместно в литературном библейском повествовании и не сужает значение до конкретного вида одеяния.
- source_word: περιεβάλοντο σάκκους
  choice: облачились во вретище
  rationale: 'Оборот описывает принятую форму траура: надевание грубой ткани. «Вретище» — устойчивое и понятное в библейском контексте русское обозначение траурной одежды; единственное собирательное число естественно передаёт греческое множественное σάκκους.'
- source_word: ἐπένθησαν σφόδρα
  choice: предались глубокой скорби
  rationale: Ἐπένθησαν означает скорбеть, оплакивать; σφόδρα сильно усиливает действие. Цельный русский оборот естественно передаёт интенсивную скорбь, не добавляя отсутствующего в тексте оттенка горечи.
- source_word: Ματταθίας
  choice: Маттафия
  rationale: Использована закрепившаяся в русской библейской традиции форма имени; падежная форма определяется синтаксисом русского предложения.
