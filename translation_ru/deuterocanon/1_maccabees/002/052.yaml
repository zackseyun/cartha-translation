  yaml_path: translation/deuterocanon/1_maccabees/002/052.yaml
  text: Was not Abraham found faithful in testing[b][a], and was it counted to him as righteousness?
translation:
  language: ru
  text: Разве Авраам не оказался верным в испытании[a], и разве это не было вменено ему в праведность?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при испытании»; греческое слово может также означать «искушение», но здесь речь идёт о проверке Авраама.'
    reason: lexical_alternative
  - marker: b
    text: Ср. Быт 15:6; здесь слова о вменении праведности связаны с испытанием Авраама.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀβραάμ
  choice: Авраам
  rationale: Традиционная и общепринятая русская форма имени патриарха.
- source_word: πειρασμῷ
  choice: в испытании
  rationale: πειρασμός может обозначать испытание, тяжёлое переживание или искушение; здесь контекст говорит о проверке верности Авраама, а не о склонении ко греху.
- source_word: εὑρέθη πιστός
  choice: оказался верным
  rationale: 'Передаёт результат проверки: Авраам был явлен и признан верным. Эта формулировка естественнее для современного русского языка, чем буквальное «был найден верным».'
- source_word: ἐλογίσθη αὐτῷ
  choice: это было вменено ему
  rationale: Сохраняет отсылку к Быт 15:6 и расчётно-декларативный оттенок λογίζομαι, не добавляя позднейшего богословского истолкования. Местоимение «это» сохраняет некоторую неоднозначность того, что именно было вменено.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Устоявшийся русский библейский эквивалент, уместный в контексте Авраама и отсылки к Быт 15:6.
theological_decisions:
- issue: Связь испытания Авраама с вменением праведности
  choice: Обе части переданы как единый риторический вопрос без разъяснения их хронологической и богословской связи.
  alternative: Истолковать стих как богословское объединение событий Быт 15:6 и Быт 22 либо прямо добавить, что в праведность была вменена вера Авраама.
  rationale: Греческий текст связывает испытание и вменение праведности, но не объясняет точный характер этой связи. Перевод сохраняет напряжение и не гармонизирует два эпизода.
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В аллюзии на Авраама «праведность» точно передаёт библейско-религиозный смысл и соответствует устойчивому русскому словоупотреблению.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Риторическая форма оригинала сохранена. «Оказался верным» выбрано вместо буквального и менее естественного «был найден верным».
