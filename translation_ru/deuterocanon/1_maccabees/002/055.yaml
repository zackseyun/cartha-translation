lexical_decisions:
- source_word: Ἰησοῦς
  choice: Иисус Навин
  rationale: В данном перечне верных деятелей Израиля имеется в виду Иисус Навин, сын Навина. Принятая русская библейская форма отличает его от Иисуса Христа.
- source_word: ἐν τῷ πληρῶσαι
  choice: исполнив
  rationale: Деепричастная конструкция естественна по-русски и передаёт сопутствующее обстоятельство, не закрепляя окончательно временное или инструментальное значение греческого оборота.
- source_word: λόγον
  choice: слово
  rationale: Широкое и компактное соответствие греческому λόγος; оно не уточняет без достаточных оснований, идёт ли речь о повелении, обещании или деле.
- source_word: ἐγένετο
  choice: стал
  rationale: Обычное русское выражение перехода к названному положению или служению.
- source_word: κριτὴς
  choice: судьёй
  rationale: Прямое соответствие κριτής, сохраняющее библейско-историческое наименование роли и не заменяющее его более общим словом «вождь».
- source_word: ἐν Ἰσραήλ
  choice: в Израиле
  rationale: Прямо передаёт ἐν и не усиливает смысл до «над Израилем».
theological_decisions:
- issue: Что именно означает «слово», исполненное Иисусом Навином
  choice: Сохранено общее «слово»
  alternative: «повеление», «обещание» или «дело»
  rationale: λόγος сам по себе не требует более узкого толкования; общий перевод сохраняет возможную отсылку, не навязывая определённого богословского или повествовательного понимания.
- issue: Характер связи между исполнением слова и становлением судьёй
  choice: Передано деепричастием «исполнив»
  alternative: «когда исполнил» или «тем, что исполнил»
  rationale: Греческое ἐν с субстантивированным инфинитивом допускает временной и инструментальный оттенки; основной текст не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционной библейской формы имени «Иисус Навин». Формулировка краткая и торжественно-нейтральная; неоднозначности греческого текста отмечены в сносках.
