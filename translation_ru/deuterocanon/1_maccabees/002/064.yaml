  text: And you, children, be strong and act like men in your law, because in it you will be glorified.
translation:
  language: ru
  text: И вы, дети, будьте сильны и мужайтесь[a] в вашем Законе, потому что в нём вы прославитесь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покажите себя мужами», то есть «будьте отважны». В греческом употреблён глагол с явно мужским образом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вы будете почтены»; «вы обретёте славу».'
    reason: alternative_reading
lexical_decisions:
- source_word: τέκνα
  choice: дети
  rationale: Широкое обозначение потомков, не ограниченное сыновьями; естественно передаёт обращение Маттафии к своим детям.
- source_word: ἰσχύετε
  choice: будьте сильны
  rationale: Настоящее повелительное наклонение выражает призыв сохранять силу и стойкость; русский оборот звучит естественно и сохраняет увещевательную силу.
- source_word: ἀνδρίζεσθε
  choice: мужайтесь
  rationale: Русский глагол естественно передаёт призыв к мужеству и при этом сохраняет мужской образ, заложенный в греческом слове; буквальный оттенок указан в сноске.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: в вашем Законе
  rationale: Сохраняются предлог ἐν, обозначающий сферу действия, и явное притяжательное местоимение ὑμῶν. Заглавная буква указывает на Закон как Закон народа Израиля.
- source_word: δοξασθήσεσθε
  choice: вы прославитесь
  rationale: Будущая пассивная форма передана без уточнения действующего лица; формулировка сохраняет связь со славой и не сводит обещание только к общественному почёту.
theological_decisions:
- issue: Мужской образ в ἀνδρίζεσθε
  choice: мужайтесь
  alternative: покажите себя мужами; будьте отважны
  rationale: Выбор звучит естественно по-русски, передаёт значение храбрости и не устраняет мужской образ исходного глагола; более буквальная передача дана в сноске.
- issue: Смысл δοξασθήσεσθε
  choice: вы прославитесь
  alternative: вы будете почтены; вы обретёте славу
  rationale: Греческий текст не называет того, кто прославит адресатов, и не определяет точный характер славы. Перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского увещания. Синтаксис следует греческому тексту, но остаётся понятным обычному читателю; «мужайтесь» естественно сохраняет и идиоматический смысл, и образность оригинала.
