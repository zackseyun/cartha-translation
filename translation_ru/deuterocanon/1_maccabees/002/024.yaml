  to: Маттафия увидел это и воспылал ревностью; всё внутри у него содрогнулось[a]. Он дал волю гневу по суду[b] и, подбежав, заколол того человека на жертвеннике.
  rationale: Исправлены две точки, где черновик либо ослаблял специфический оттенок греческого текста, либо неоправданно конкретизировал его. «Воспылал ревностью» сохраняет мотив ζηλόω, а «по суду» передаёт κατὰ τὸ κρίμα без решения спорного вопроса о природе этого «суда». Сцена насилия и указание на жертвенник сохранены без смягчения; обе сноски имеют корректные якоря.
