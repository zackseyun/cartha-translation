  text: And Mattathias saw it and was zealous, and his inward parts trembled, and he brought up wrath according to the judgment, and running up he slaughtered him on the altar.
translation:
  language: ru
  text: Маттафия увидел это и воспылал ревностью; всё внутри у него содрогнулось[a]. Он дал волю гневу по суду[b] и, подбежав, заколол того человека на жертвеннике.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его почки содрогнулись» — древнее образное выражение глубокого внутреннего потрясения.'
    reason: cultural_note
  - marker: b
    text: 'Возможно также: «согласно судебному решению» или «в соответствии с установлением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήλωσεν
  choice: его охватила ревность
  rationale: Передаёт вспыхнувшую ревностную, негодующую решимость, а не зависть; сохраняет значимый мотив ревности, не добавляя толкования.
- source_word: οἱ νεφροὶ αὐτοῦ
  choice: всё внутри у него
  rationale: Греческое выражение буквально означает «его почки» и обозначает глубочайшие внутренние чувства. Естественная русская формулировка сохраняет телесный образ внутреннего потрясения без неуместной анатомичности; буквальный смысл указан в сноске.
- source_word: ἀνήνεγκεν θυμόν
  choice: дал волю гневу
  rationale: Естественно передаёт выход наружу сильного гнева; буквальное «вознёс/вынес гнев» по-русски было бы неясно и искусственно.
- source_word: κατὰ τὸ κρίμα
  choice: как требовал приговор
  rationale: Сохраняет судебный смысл κρίμα и не уточняет сверх текста, идёт ли речь о Божьем постановлении, законе или конкретном приговоре.
- source_word: δραμὼν
  choice: подбежал
  rationale: Передаёт стремительное движение Маттафии к человеку у жертвенника.
- source_word: ἔσφαξεν
  choice: заколол
  rationale: Сохраняет резкость σφάζω и его возможный жертвенный оттенок, особенно выразительный рядом с упоминанием жертвенника.
- source_word: ἐπὶ τὸν βωμόν
  choice: на жертвеннике
  rationale: Прямо передаёт шокирующее место действия и наиболее естественно соответствует ἐπί с винительным в данном контексте.
theological_decisions:
- issue: Насколько явно передавать мотив ревности о завете и судебной кары
  choice: Сохранить лексику ревности, приговора и заклания без смягчения и без поясняющей вставки.
  alternative: 'Истолковать: «он пришёл в ярость» или «казнил его по закону».'
  rationale: Греческий текст сближает поступок Маттафии с ревностью о Законе и представляет его как исполнение суда, однако не разъясняет основание приговора. Перевод сохраняет эту богословскую и нравственную напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Короткая последовательность действий и повтор союзной связи переданы естественным русским синтаксисом; жестокость сцены не смягчена. Все сноски отмечены в основном тексте.
