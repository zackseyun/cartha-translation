  text: Caleb[a], when he testified before the assembly, received the land as an inheritance.
translation:
  language: ru
  text: Когда Халев засвидетельствовал перед собранием[a], он получил землю в наследие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дал свидетельство собранию».'
    reason: Глагол ἐπιμαρτυρέω допускает передачу через выражение «давать свидетельство», а дательный τῇ ἐκκλησίᾳ — как адресат свидетельства.
lexical_decisions:
- source_word: Χαλὲβ
  choice: Халев
  rationale: Имя передано в принятой русской библейской форме.
- source_word: ἐν τῷ ἐπιμαρτυρῆσαι
  choice: когда засвидетельствовал
  rationale: Конструкция ἐν с субстантивированным инфинитивом естественно выражает временное обстоятельство; глагол сохраняет смысл свидетельства или подтверждающего показания.
- source_word: τῇ ἐκκλησίᾳ
  choice: перед собранием
  rationale: В данном иудейском историческом контексте ἐκκλησία означает собравшуюся общину Израиля, а не христианскую церковь; «перед собранием» естественно сочетается с глаголом свидетельства.
- source_word: ἔλαβε
  choice: получил
  rationale: В контексте удела и наследия глагол обозначает обретение во владение, а не активный захват.
- source_word: γῆν
  choice: землю
  rationale: Речь идёт о земле, полученной Халевом; русская форма с винительным падежом естественна и не требует добавления притяжательного местоимения.
- source_word: κληρονομίαν
  choice: в наследие
  rationale: Передаёт значение унаследованного или выделенного владения без добавления отсутствующего в греческом тексте слова «своё».
theological_decisions:
- issue: Значение ἐκκλησία в повествовании о Халеве
  choice: собрание
  alternative: церковь; община
  rationale: Здесь имеется в виду собравшийся народ Израиля; «церковь» было бы анахронично, а «собрание» сохраняет исторический и общественный смысл.
- issue: Связь свидетельства Халева с получением земли
  choice: временная формулировка «когда…»
  alternative: причинная формулировка «за то, что…»
  rationale: Греческая конструкция ясно задаёт обстоятельственную или временную связь, но не выражает причину настолько явно, чтобы вводить её в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; термин «собрание» избегает христианского анахронизма.
