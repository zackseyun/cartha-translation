base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/018.yaml
  text: Now then[a], come forward first and carry out the king’s command, as all the nations have done, and the rulers of Judah, and those left in Jerusalem; and you and your house will be among the king’s Friends[b], and you and your sons will be honored with silver and gold and many gifts.
translation:
  language: ru
  text: Итак, выйди вперёд первым и исполни повеление царя, как поступили все народы, правители Иудеи и оставшиеся в Иерусалиме; и ты, и твой дом будете среди Друзей царя[a], а тебя и твоих сыновей почтут серебром, золотом и многими дарами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение может означать просто «друзей царя», но, вероятно, здесь имеется в виду придворное звание «Друзья» — признанный круг царских приближённых и советников.
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «дары», может обозначать царские пожалования, выплаты или другие блага в дополнение к серебру и золоту.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: итак
  rationale: Сочетание вводит настойчивый вывод или призыв из предшествующей речи; русское «итак» естественно передаёт эту связку без тяжеловесного «теперь же».
- source_word: πρόσελθε πρῶτος
  choice: выступи первым
  rationale: Императив означает приблизиться или выйти вперёд, а πρῶτος призывает Маттафию первым подать публичный пример. «Выступи первым» сохраняет и движение, и общественный характер призыва.
- source_word: ποίησον τὸ πρόσταγμα τοῦ βασιλέως
  choice: исполни приказ царя
  rationale: πρόσταγμα — властное предписание; «исполнить приказ» является естественным современным соответствием.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: ἔθνη может обозначать языческие народы, но здесь служит широким политико-этническим обозначением. «Народы» сохраняет объём греческого выражения, не сужая его до специального религиозного термина.
- source_word: οἱ ἄρχοντες Ἰούδα
  choice: правители Иудеи
  rationale: ἄρχοντες обозначает лиц, обладающих властью; «правители» передаёт официальный и политический оттенок.
- source_word: οἱ καταλειφθέντες ἐν Ἰερουσαλήμ
  choice: оставшиеся в Иерусалиме
  rationale: Причастие допускает значения «оставшиеся» и «оставленные»; нейтральная формулировка не уточняет без основания, были ли это выжившие или просто остававшиеся жители.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: в число Друзей царя
  rationale: В эллинистической придворной среде φίλοι могло быть названием признанной категории приближённых. Прописная буква отмечает вероятный титульный смысл, а оборот остаётся понятным современному читателю.
- source_word: δοξασθήσεσθε
  choice: будете почтены
  rationale: В контексте царского вознаграждения глагол означает наделение почётом и отличиями, а не богословское прославление.
- source_word: ἀποστολαῖς πολλαῖς
  choice: многими дарами
  rationale: Рядом с серебром и золотом слово естественно указывает на царские пожалования, выдачи или иные вознаграждения; «дары» ясно передаёт общий смысл, а более широкий диапазон отмечен в сноске.
theological_decisions:
- issue: Придворное значение φίλοι
  choice: «Друзья царя» с прописной буквы и пояснительной сноской
  alternative: «друзья царя» в обычном личном смысле
  rationale: Политический контекст и эллинистическое словоупотребление делают официальный придворный статус вероятным, однако сноска сохраняет осторожность и не представляет его как бесспорный.
- issue: Объём значения ἔθνη
  choice: «народы»
  alternative: «язычники»
  rationale: Так сохраняется этнополитическая широта греческого слова и не вносится более узкая религиозная характеристика, хотя в данном контексте могут подразумеваться неиудейские народы.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис слегка упрощён по сравнению с длинной греческой цепочкой: второе предложение начинается словом «Тогда», которое ясно выражает обещанное следствие. Архаизмы и конфессионально окрашенная лексика не используются.'
