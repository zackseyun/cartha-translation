  to: Итак, выйди вперёд первым и исполни повеление царя, как поступили все народы, правители Иудеи и оставшиеся в Иерусалиме; и ты, и твой дом будете среди Друзей царя[a], а тебя и твоих сыновей почтут серебром, золотом и многими дарами[b].
