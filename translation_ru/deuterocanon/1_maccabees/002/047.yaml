lexical_decisions:
- source_word: ἐδίωξαν
  choice: преследовали
  rationale: Передаёт активное враждебное преследование, не уточняя без достаточных оснований, были ли противники изгнаны или убиты.
- source_word: τοὺς υἱοὺς τῆς ὑπερηφανίας
  choice: сынов гордыни
  rationale: Сохраняет семитизированный греческий оборот и его резкую образность; смысловое значение — люди, отличающиеся надменной гордостью.
- source_word: ὑπερηφανίας
  choice: гордыни
  rationale: «Гордыня» ясно выражает нравственно отрицательную, надменную гордость и естественно сочетается с оборотом «сыны гордыни».
- source_word: κατευωδώθη
  choice: преуспевало
  rationale: Передаёт успешный ход начинания, сохраняя образ дела, которому сопутствует успех.
- source_word: τὸ ἔργον
  choice: дело
  rationale: Прямой и достаточно широкий эквивалент, не сужающий значение до конкретной задачи, предприятия или военного дела.
- source_word: ἐν χειρὶ αὐτῶν
  choice: в их руках
  rationale: Естественный современный русский оборот, сохраняющий библейский образ действия и управления через чьи-либо руки.
