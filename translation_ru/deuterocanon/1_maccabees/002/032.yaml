  yaml_path: translation/deuterocanon/1_maccabees/002/032.yaml
  text: And many ran after them[a], and when they caught up with them, they encamped against them and joined battle with them on the Sabbath day.
translation:
  language: ru
  text: И многие бросились за ними; настигнув их, они расположились лагерем против них и вступили с ними в бой в субботний день.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «в день суббот»; это идиоматическое обозначение субботнего дня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδραμον ὀπίσω αὐτῶν
  choice: бросились за ними
  rationale: Передаёт погоню и сохраняет динамичность буквального «побежали за ними»; в данном военном контексте это естественное современное выражение.
- source_word: πολλοί
  choice: многие
  rationale: Прямое и стилистически нейтральное соответствие количественному обозначению.
- source_word: καταλαβόντες αὐτούς
  choice: настигнув их
  rationale: В контексте погони καταλαμβάνω означает «догнать, настичь», а не обязательно «схватить».
- source_word: παρενέβαλον ἐπʼ αὐτούς
  choice: расположились лагерем против них
  rationale: Сохраняет военное значение παρεμβάλλω — разбить или расположить лагерь, — а ἐπί передаёт направленность против неприятеля.
- source_word: συνεστείλαντο πρὸς αὐτοὺς πόλεμον
  choice: вступили с ними в бой
  rationale: Естественно передаёт начало непосредственных военных действий, не расширяя смысл до продолжительной войны.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: в субботний день
  rationale: Идиоматически передаёт семитизированное греческое выражение с формально множественным σαββάτων, обозначающее день субботы.
theological_decisions:
- issue: Передача σαββάτων в иудейском календарном выражении
  choice: в субботний день
  alternative: в день суббот / в субботу
  rationale: Выбранный вариант ясно обозначает священный день покоя и сохраняет торжественно-повествовательный регистр, не придавая грамматическому множественному числу несвойственного ему богословского значения.
