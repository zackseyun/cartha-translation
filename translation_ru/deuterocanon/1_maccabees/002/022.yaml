  text: We will not obey the king’s decree by turning aside from our worship, to the right or to the left.
translation:
  language: ru
  text: Мы не станем повиноваться царскому закону[a], чтобы уклониться от нашего служения ни вправо ни влево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мы не станем слушать царский закон». Греческий глагол может означать как «слушать», так и «повиноваться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσόμεθα
  choice: не подчинимся
  rationale: Глагол буквально означает «слушать», но с обозначением закона или повеления может выражать повиновение. В данном контексте речь идёт об отказе исполнять царское предписание.
- source_word: νόμον
  choice: закону
  rationale: Это прямое соответствие греческому νόμος. Контекст показывает, что имеется в виду установленное царём предписание, однако перевод «закон» сохраняет исходную формулировку и её противопоставление верности своему богопочитанию.
- source_word: παρελθεῖν
  choice: не отступим
  rationale: Глагол передаёт переход за установленную границу или уклонение. «Отступим» естественно сочетается с последующим направительным образом «ни вправо, ни влево».
- source_word: λατρίαν
  choice: служения
  rationale: Λατρεία означает религиозное служение и поклонение. «Служение» сохраняет широту значения и не сужает его до одного лишь обряда или богослужебного собрания.
- source_word: δεξιὰν ἢ ἀριστεράν
  choice: ни вправо, ни влево
  rationale: Отрицательная русская конструкция естественно передаёт идиому об уклонении в любую сторону и сохраняет её направительный образ.
theological_decisions:
- issue: Соотношение царского закона и религиозной верности
  choice: Сохранено выражение «закон царя» без замены на «указ» или «повеление».
  alternative: «указ царя» или «повеление царя»
  rationale: Буквальный вариант сохраняет напряжение между обязательным царским установлением и верностью традиционному служению, не вводя дополнительной оценки законности царской власти.
- issue: Объём значения λατρεία
  choice: «наше служение»
  alternative: «наше поклонение» или «наше богослужение»
  rationale: «Служение» охватывает религиозную практику в целом и не ограничивает смысл внутренним поклонением либо литургическим обрядом.
translation_notes:
  register: Современный литературный русский язык; формулировка торжественная, но доступная. Сохранён библейский образ уклонения вправо или влево.
