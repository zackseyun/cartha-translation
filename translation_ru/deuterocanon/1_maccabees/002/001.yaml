  yaml_path: translation/deuterocanon/1_maccabees/002/001.yaml
  text: In those days Mattathias son of John, son of Simeon, a priest of the sons of Joarib, rose up from Jerusalem and settled in Modein.
translation:
  language: ru
  text: В те дни Маттафия, сын Иоанна, сына Симеона, священник из рода Иоарива, ушёл из Иерусалима и поселился в Модеине.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστη … ἀπὸ Ἱερουσαλήμ
  choice: ушёл из Иерусалима
  rationale: В сочетании с ἀπό глагол ἀνίστημι обозначает отправление с места; буквальное «встал из Иерусалима» по-русски неестественно. «Ушёл» передаёт исходный образ действия, не уточняя способ передвижения.
- source_word: ἱερεὺς τῶν υἱῶν Ἰωαρίβ
  choice: священник из рода Иоарива
  rationale: Оборот «из сыновей Иоарива» указывает на священнический род; «из рода» ясно и естественно передаёт генеалогическую принадлежность.
- source_word: ἐκάθισεν
  choice: поселился
  rationale: В данном повествовательном контексте глагол означает, что Маттафия обосновался и стал жить в Модеине, а не просто сел.
- source_word: Μωδεείν
  choice: Модеин
  rationale: Передана традиционная русская форма географического названия с учётом греческого Μωδεείν.
