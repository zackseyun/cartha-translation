  text: И они поспешили начать против них войну[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они поспешили выступить против них»; возможно также: «они быстро напали на них». Греческая фраза предельно кратка; буквально: «они ускорили против них войну».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάχυναν
  choice: поспешили
  rationale: Аорист ταχύνω передаёт быстрое, безотлагательное совершение действия; «поспешили» сохраняет этот глагольный оттенок, не уточняя военный манёвр.
- source_word: πόλεμον
  choice: начать войну
  rationale: Буквально πόλεμον означает «войну», но сжатое греческое сочетание по-русски естественно передаётся как «поспешили начать войну»; это сохраняет лексическое значение и смысл быстрого перехода к военным действиям.
- source_word: ἐπʼ αὐτούς
  choice: против них
  rationale: При обозначении враждебного военного действия ἐπί с винительным падежом естественно переводится «против них».
