lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Кратко и естественно передаёт временную последовательность повествования.
- source_word: κατέβησαν
  choice: спустились
  rationale: Сохраняет выраженное в греческом глаголе значение движения вниз, не сглаживая его до общего «пошли».
- source_word: πολλοὶ
  choice: многие
  rationale: Прямой и естественный количественный эквивалент.
- source_word: ζητοῦντες
  choice: искавшие
  rationale: Причастие передаёт продолжающееся, характеризующее этих людей стремление.
- source_word: δικαιοσύνην
  choice: праведности
  rationale: В данном контексте обозначает нравственную правоту и верность должному; этот выбор также позволяет отличить слово от следующего κρίμα.
- source_word: καὶ κρίμα
  choice: и правосудия
  rationale: «Правосудие» передаёт судебно-общественную сторону κρίμα и сохраняет два связанных, но не тождественных идеала.
- source_word: εἰς τὴν ἔρημον
  choice: в пустыню
  rationale: Устойчивое библейское обозначение безлюдной, необжитой местности.
- source_word: καθίσαι ἐκεῖ
  choice: чтобы поселиться там
  rationale: В контексте глагол означает обосноваться и жить, а не буквально сесть.
theological_decisions:
- issue: Передача δικαιοσύνη в паре с κρίμα
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет нравственно-религиозный объём δικαιοσύνη, тогда как «правосудие» для κρίμα передаёт смежный судебный аспект; различие между понятиями не устраняется.
translation_notes:
