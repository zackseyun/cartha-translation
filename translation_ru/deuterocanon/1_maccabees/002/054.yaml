lexical_decisions:
- source_word: Φινεὲς
  choice: Финеес
  rationale: Традиционная русская библейская форма имени, соответствующая греческому Φινεὲς.
- source_word: ὁ πατὴρ ἡμῶν
  choice: отец наш
  rationale: Сохранено буквальное родственное обозначение и его риторическая сила; по контексту речь идёт о предке.
- source_word: ἐν τῷ ζηλῶσαι ζῆλον
  choice: за то, что возревновал ревностью
  rationale: Оборот передаёт вероятную причинную связь и сохраняет усилительную однокоренную конструкцию глагола и существительного в греческом тексте.
- source_word: ἔλαβε
  choice: получил
  rationale: В данном контексте речь идёт о дарованном ему завете, а не о захвате или присвоении.
- source_word: διαθήκην
  choice: завет
  rationale: Устоявшийся библейский эквивалент, сохраняющий связь с повествованием о Финеесе.
- source_word: ἱερωσύνης ἁγίας
  choice: святого священства
  rationale: Естественно передаёт родительный оборот и сохраняет ключевые понятия святости и священства.
theological_decisions:
- issue: Связь ревности Финееса с получением завета
  choice: 'Передать ἐν τῷ + инфинитив причинно: «за то, что»'
  alternative: «когда он возревновал»
  rationale: Контекст указывает на основание получения завета, однако примечание сохраняет возможное временное прочтение конструкции.
- issue: Усилительная однокоренная конструкция ζηλῶσαι ζῆλον
  choice: Сохранить как «возревновал ревностью»
  alternative: «проявил ревность»
  rationale: Нарочитый повтор отражает эмфазу исходного текста и его библейскую риторическую окраску, не добавляя толкования.
