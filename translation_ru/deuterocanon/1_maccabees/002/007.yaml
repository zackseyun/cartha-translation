base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/007.yaml
  text: And he said[a], “Alas! Why was I born to see the ruin of my people and the ruin of the holy city, and to sit there while it was given into the hand of enemies[b], and the sanctuary into the hand of foreigners?”
translation:
  language: ru
  text: 'И сказал он: «Горе мне! Для чего я родился — чтобы увидеть разорение[a] моего народа и разорение святого города, сидеть там, когда город отдан в руки врагов[b], а святилище — в руки чужеземцев?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «сокрушения моего народа»; в греческом здесь множественное число, которое может подчёркивать размах бедствия.'
    reason: lexical_alternative
  - marker: b
    text: Выражения «в руки врагов» и «в руки чужеземцев» — библейский образ передачи под их власть.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴμοι
  choice: Горе мне!
  rationale: Междометие скорбного восклицания; этот вариант сохраняет личный характер плача и звучит весомо, но понятно современному читателю.
- source_word: ἵνα τί τοῦτο ἐγενήθην
  choice: Для чего я родился
  rationale: В контексте плача ἐγενήθην естественно передаёт появление на свет, а ἵνα τί выражает мучительный вопрос о цели или причине.
- source_word: τὰ συντρίμματα τοῦ λαοῦ μου
  choice: разгром моего народа
  rationale: Форма множественного числа обозначает сокрушительное, многостороннее бедствие; «разгром» естественно сочетается со словом «народ» и передаёт масштаб опустошения.
- source_word: τὸ σύντριμμα τῆς πόλεως τῆς ἁγίας
  choice: разорение святого города
  rationale: Передаёт состояние разрушения города, сохраняя параллель с бедствием народа без неестественного буквального повторения.
- source_word: καθίσαι ἐκεῖ
  choice: сидеть там
  rationale: Сохраняет конкретный образ неподвижного присутствия и беспомощности, а не истолковывает его как проживание.
- source_word: ἐν τῷ δοθῆναι αὐτὴν
  choice: когда город отдан
  rationale: Артиклевый инфинитив с ἐν обозначает сопутствующее обстоятельство; существительное «город» повторено ради ясного русского согласования и устранения двусмысленного местоимения.
- source_word: ἐν χειρὶ ἐχθρῶν
  choice: в руки врагов
  rationale: Сохранена библейская идиома передачи под чужую власть.
- source_word: τὸ ἁγίασμα
  choice: святилище
  rationale: Обозначает священное место и не расширяет значение до всего города или храма как здания.
- source_word: ἐν χειρὶ ἀλλοτρίων
  choice: в руки чужеземцев
  rationale: ἀλλότριοι здесь противопоставлены своему народу и обозначают посторонних, иноземных захватчиков; «чужеземцы» сохраняет это различие.
theological_decisions:
- issue: Передача национально-заветной лексики плача
  choice: «мой народ» и «святой город» без поясняющих добавлений
  alternative: «моя нация» и прямо добавленное название «Иерусалим»
  rationale: Греческий текст использует λαός и описательное обозначение города. Перевод сохраняет их богословскую насыщенность, не уточняя сверх источника.
- issue: Образ передачи города и святилища чужой власти
  choice: Сохранить выражение «в руки»
  alternative: Передать толкованием «под власть»
  rationale: Библейский образ руки одновременно означает обладание и власть; его сохранение не снимает заложенную в тексте образность.
translation_notes:
  register: Современный литературный русский язык с достоинством плача. Синтаксический параллелизм и конкретный образ «сидеть там» сохранены; архаизмы и конфессионально окрашенные расширения не вводились.
