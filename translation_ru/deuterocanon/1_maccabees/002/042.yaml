base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/042.yaml
  text: Then a company of Hasideans gathered to them[a], mighty in strength from Israel, everyone who willingly devoted himself to the law.
translation:
  language: ru
  text: Тогда к ним собралась группа асидеев[a] — сильных, могучих людей из Израиля, все добровольно посвятившие себя Закону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хасидеи». Историческое название иудейской группы, отличавшейся ревностью к Закону.'
    reason: Указывает вариант передачи имени и поясняет, что это название определённой группы, а не просто характеристика «благочестивые».
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτούς
  choice: к ним собралась
  rationale: Передаёт движение к ранее упомянутым людям и объединение с ними, не усиливая смысл до формального вступления в войско. Русское согласование дано с собирательным существительным «группа», тогда как греческое множественное число отражает людей, составляющих эту группу.
- source_word: συναγωγὴ
  choice: группа
  rationale: Нейтрально обозначает собравшееся объединение людей и не привносит более позднего значения «синагога» или церковного оттенка слова «община».
- source_word: Ἀσιδαίων
  choice: асидеев
  rationale: Сохранено историческое наименование конкретной иудейской группы, а не его возможное описательное толкование «благочестивые».
- source_word: ἰσχυρὰ δυνάμει
  choice: сильная своей мощью
  rationale: Сохраняет подчёркнутую, отчасти плеонастическую формулировку греческого текста, не превращая группу без достаточных оснований в «войско» или «отряд».
- source_word: ἀπὸ Ἰσραήλ
  choice: из Израиля
  rationale: Буквально сохраняет указание на происхождение и не сужает его до отдельного колена или только территории.
- source_word: πᾶς ὁ ἑκουσιαζόμενος τῷ νόμῳ
  choice: все, кто добровольно посвятил себя Закону
  rationale: Передаёт добровольность и деятельную преданность, выраженные причастием, без добавления явно военного смысла. Прописная буква показывает, что речь идёт о Законе Моисея.
theological_decisions:
- issue: Передача названия Ἀσιδαίων
  choice: асидеи
  alternative: хасидеи; благочестивые
  rationale: Транслитерированное историческое название сохраняет групповую идентичность и не подменяет её толкованием нравственных качеств участников.
- issue: Смысл ἑκουσιαζόμενος τῷ νόμῳ
  choice: добровольно посвятил себя Закону
  alternative: вызвался ради Закона; добровольно встал на сторону Закона
  rationale: Выбранный вариант сохраняет добровольную личную приверженность Закону, но не решает неоднозначность фразы в пользу исключительно военной мобилизации.
- issue: Характер группы в выражении ἰσχυρὰ δυνάμει
  choice: сильная своей мощью
  alternative: могучее войско; сильный отряд
  rationale: Греческая фраза подчёркивает силу группы, но прямо не называет её войском; перевод избегает неоправданной милитаризации.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка торжественный, но понятный; историческое название сохранено, а тяжеловесные архаизмы вроде «сонм» и «мужественные силою» исключены.
