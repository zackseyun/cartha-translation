  source_fidelity: 'Смысл в целом передан верно: к ранее упомянутым людям присоединилось собрание асидеев; это была сильная группа из Израиля, состоявшая из тех, кто добровольно посвятил себя Закону. Однако «сильная своей мощью» — неестественная для современного литературного русского тавтология и стилистически утяжеляет фразу. «Сильная силой» ближе к греческому ἰσχυρὰ δυνάμει, но также неудачна по-русски; «сильная, могучая» передаёт усиление естественно, не превращая группу в войско.'
