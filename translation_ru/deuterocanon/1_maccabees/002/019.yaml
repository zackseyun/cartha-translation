  verdict: revise
  source_fidelity: Нужна правка синтаксиса. Греческое ἀποστῆναι — инфинитив, а не личная форма «отступает»; русское «каждый отступает ... и они избрали» создаёт не обусловленную оригиналом смену синтаксической конструкции. ἀκούουσιν следует передать как «слушают», не делая повиновение прямым лексическим значением. Необычное οἴκῳ τῆς βασιλείας τοῦ βασιλέως удачно и без чрезмерной буквальности передано как «во владениях царя» и объяснено сноской.
  naturalness: Предлагаемая конструкция «слушают его, отступив каждый ... и избрав ...» естественна для современного литературного русского и при этом сохраняет незавершённую условную часть фразы. «Поклонение, принятое от отцов» устраняет двусмысленность выражения «служение своих отцов», которое по-русски может означать служение, оказываемое самим отцам.
  terminology: «Маттафия», «народы», «повеления» и «громким голосом» приемлемы. «Поклонение, принятое от отцов» передаёт культовое λατρεία без внесения конкретизации о богах или позднейшего технического термина.
