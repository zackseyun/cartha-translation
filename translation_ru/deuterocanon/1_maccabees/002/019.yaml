  yaml_path: translation/deuterocanon/1_maccabees/002/019.yaml
  text: And Mattathias answered and said with a loud voice[a], “Even if all the nations in the kingdom of the king listen to him, each one turning away from the worship of his fathers[b], and have chosen his commandments,”
translation:
  language: ru
  text: 'Маттафия ответил и сказал громким голосом: «Даже если все народы во владениях царя[a] слушают его, отступив каждый от поклонения, принятого от отцов, и избрав его повеления,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в доме царства царя»; греческое выражение необычно и, вероятно, означает всю область царской власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῇ μεγάλῃ
  choice: громким голосом
  rationale: Близко передаёт греческое выражение и сохраняет торжественную повествовательную выразительность.
- source_word: ἔθνη
  choice: народы
  rationale: Речь идёт о разных подвластных царю народах; вариант не вносит дополнительного значения «язычники».
- source_word: οἴκῳ τῆς βασιλείας τοῦ βασιλέως
  choice: во владениях царя
  rationale: Естественно по-русски передаёт необычное греческое обозначение области царской власти; буквальное «в доме царства царя» было бы неясно.
- source_word: ἀκούουσιν αὐτοῦ
  choice: слушаются его
  rationale: Русское «слушаются» сохраняет образ слушания и одновременно выражает подразумеваемое контекстом повиновение.
- source_word: ἀποστῆναι
  choice: отступает
  rationale: Передаёт отделение от прежнего культа, не превращая слово в позднейший технический термин «отступничество».
- source_word: λατρίας πατέρων αὐτοῦ
  choice: служения своих отцов
  rationale: «Служение» передаёт культовый смысл λατρεία и естественно сочетается с указанием на унаследованную от отцов религиозную практику.
- source_word: ᾑρετίσαντο
  choice: избрали
  rationale: Передаёт прямой смысл осознанного выбора или предпочтения.
- source_word: ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: его повеления
  rationale: В данном контексте это царские предписания; «повеления» избегает ненужной ассоциации исключительно с божественными заповедями.
theological_decisions:
- issue: Передача необычного выражения οἴκῳ τῆς βασιλείας τοῦ βασιλέως
  choice: во владениях царя
  alternative: в доме царства царя; в царстве царя
  rationale: Выбранный вариант сохраняет значение царской области и остаётся понятным современному читателю; необычность оригинала отмечена в сноске.
- issue: Передача ἀκούουσιν αὐτοῦ как слушания или повиновения
  choice: слушаются его
  alternative: слушают его; повинуются ему
  rationale: «Слушаются» удерживает лексический образ слышания/слушания, но не скрывает контекстуальный смысл подчинения царю.
- issue: Синтаксическая неоднозначность ἀποστῆναι и смена числа перед ᾑρετίσαντο
  choice: каждый отступает ... и они избрали
  alternative: чтобы каждый отступил ... и избрал
  rationale: 'Сохранена заметная в греческом переходность конструкции: единственное число ἕκαστος и последующее множественное ᾑρετίσαντο. Перевод не устраняет эту шероховатость без достаточных оснований.'
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Формула «ответил и сказал» сохранена как характерная библейская повествовательная конструкция. Стих представляет собой незавершённую условную часть высказывания, поэтому конец оставлен открытым.
