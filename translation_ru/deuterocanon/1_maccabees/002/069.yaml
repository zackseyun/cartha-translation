lexical_decisions:
- source_word: ηὐλόγησεν
  choice: благословил
  rationale: Аорист εὐλογέω обозначает совершённое Маттафией благословение присутствующих; «благословил» естественно и точно передаёт смысл.
- source_word: προσετέθη
  choice: отошёл
  rationale: Буквально пассивная форма значит «был присоединён», однако в устойчивой формуле смерти по-русски естественно передаётся глаголом «отошёл»; буквальный образ отмечен в сноске.
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  choice: к своим отцам
  rationale: Сохранён традиционный библейский образ соединения с умершими предками без его антропологического истолкования.
theological_decisions:
- issue: Передача формулы смерти προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: отошёл к своим отцам
  alternative: был присоединён к своим отцам
  rationale: Основной текст должен быть понятен современному русскому читателю и вместе с тем сохранять традиционный образ. Такая передача обозначает смерть, не уточняя посмертное состояние человека; буквальная форма дана в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и краткости исходной библейской формулы. Местоимение «он» поставлено после сказуемого для естественного ритма и ясного подлежащего.
