  text: And he was zealous for the law[a], just as Phinehas was against Zambri son of Salom.
translation:
  language: ru
  text: И он проявил ревность к Закону, как поступил Финеес с Замврием, сыном Салома.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте имена переданы как Замврий и Салом; в Числах 25 эти лица более известны как Зимри, сын Салу.
    reason: Перекрёстная ссылка и пояснение различающихся форм имён.
lexical_decisions:
- source_word: ἐζήλωσεν
  choice: проявил ревность
  rationale: Аорист обозначает деятельную, выразившуюся в решительном поступке ревность. Формулировка передаёт действие естественным современным русским языком, не сводя его к одному внутреннему чувству.
- source_word: τῷ νόμῳ
  choice: о законе
  rationale: Дательный падеж указывает на предмет ревности. Сочетание «ревность о законе» точно передаёт смысл и сохраняет связь с иудейским законом без навязывания особой типографской трактовки.
- source_word: καθὼς
  choice: как
  rationale: Союз вводит прямое историческое сопоставление поступка Маттафии с поступком Финееса.
- source_word: ἐποίησεν
  choice: поступил
  rationale: Широкое по значению ποιέω здесь естественно передаётся глаголом «поступил». Он не добавляет к краткой аллюзии явного описания насилия и позволяет обороту с дательным падежом определить участника действия.
- source_word: Φινεὲς
  choice: Финеес
  rationale: Устоявшаяся русская библейская форма имени персонажа из Чисел 25.
- source_word: τῷ Ζαμβρὶ
  choice: с Замврием
  rationale: Оборот «поступить с кем-либо» естественно передаёт греческое ἐποίησεν с дательным падежом и сохраняет некоторую невыраженность характера действия, понятного из аллюзии.
- source_word: υἱῷ Σαλώμ
  choice: сыном Салома
  rationale: 'Имена переданы по формам греческого источника: Ζαμβρί — Замврий, Σαλώμ — Салом; более привычные формы из Чисел указаны в примечании.'
theological_decisions:
- issue: Насколько явно передавать подражание Маттафии насильственному поступку Финееса
  choice: Сохранить прямое сопоставление, не смягчая его и не разворачивая аллюзию в пояснительный пересказ
  alternative: Прямо сказать, что Финеес убил Замврия, либо ослабить связь с насилием
  rationale: Греческий текст прямо сопоставляет ревность Маттафии с поступком Финееса, но выражает сам поступок широким глаголом ποιέω. Перевод сохраняет и силу сопоставления, и лаконичность исходной формулировки, не добавляя оценки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаичное «возревновал» заменено ясным выражением «проявил ревность»; имена переданы в формах, соответствующих греческому источнику.
