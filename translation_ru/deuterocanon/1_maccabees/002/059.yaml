lexical_decisions:
- source_word: Ἀνανίας, Ἀζαρίας, Μισαήλ
  choice: Анания, Азария и Мисаил
  rationale: Употреблены традиционные и узнаваемые в русском библейском контексте формы имён трёх юношей из книги Даниила; они также близко передают греческие формы.
- source_word: πιστεύσαντες
  choice: поверив
  rationale: Деепричастие естественно и достаточно точно передаёт аористное причастие со значением веры или доверия, не заменяя глагол отвлечённым существительным «вера».
- source_word: ἐσώθησαν
  choice: спаслись
  rationale: Форма передаёт пассивный аорист σῴζω естественным русским возвратным глаголом; в данном контексте речь идёт о спасении от смертельной опасности.
- source_word: ἐκ φλογός
  choice: от пламени
  rationale: Сохраняется конкретный образ единственного числа φλόξ и естественно передаётся исходное значение предлога ἐκ.
theological_decisions:
- issue: Связь πιστεύσαντες с ἐσώθησαν
  choice: «поверив, спаслись»
  alternative: «потому что поверили, спаслись»; «благодаря вере спаслись»
  rationale: 'Деепричастная конструкция сохраняет некоторую смысловую открытость греческого причастия: вера сопутствует спасению и может пониматься как его основание или обстоятельство. Причинный перевод был бы более определённым, а «благодаря вере» заменило бы глагольную форму существительным.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Традиционные формы имён обеспечивают узнаваемую связь с повествованием Дан 3; синтаксис остаётся близким к греческому, но естественным по-русски.
