lexical_decisions:
- source_word: ὁ ναὸς
  choice: святилище
  rationale: ναός может обозначать храм или его священную внутреннюю часть. «Святилище» сохраняет культовый смысл и не сужает выражение до всего храмового комплекса.
- source_word: ἐγένετο
  choice: стало
  rationale: Аорист γίνομαι выражает перемену состояния; русское «стало» передаёт это естественно и точно.
- source_word: αὐτῆς
  choice: её
  rationale: Местоимение женского рода соотносится с олицетворённым Иерусалимом и сохраняет олицетворение исходного текста.
- source_word: ὡς ἀνὴρ ἔνδοξος
  choice: подобно почтенному мужу
  rationale: Сохранены сравнительная конструкция и образ мужчины, наделённого общественным почётом. «Почтенный» естественно передаёт здесь возможное значение ἔνδοξος как «пользующийся почётом», не устраняя его смысловой широты.
