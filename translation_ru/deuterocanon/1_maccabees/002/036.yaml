lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: не ответили
  rationale: Прямое и естественное соответствие греческому глаголу в контексте обращения противников к укрывшимся.
- source_word: λίθον
  choice: ни камня
  rationale: Сохранено единственное число греческого текста; конструкция с «ни» естественно передаёт отрицание по-русски.
- source_word: ἐνετίναξαν
  choice: не бросили
  rationale: Глагол обозначает резкое, силовое бросание; «бросили» звучит естественно, а контекст бросания камня передаёт насильственный характер действия.
- source_word: ἐνέφραξαν
  choice: не заградили
  rationale: Глагол имеет значение преграждения или перекрытия; «заградили» сохраняет пространственный смысл без добавления отсутствующих в греческом тексте «входов».
- source_word: τοὺς κρυφούς
  choice: тайных убежищ
  rationale: Субстантивированное прилагательное допускает понимание как скрытых или тайных мест. В данном контексте речь, вероятнее всего, идёт о местах укрытия, а не о людях.
