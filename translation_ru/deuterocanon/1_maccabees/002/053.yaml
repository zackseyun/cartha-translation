  text: Joseph[a], in the time of his distress, kept the commandment, and became lord of Egypt.
translation:
  language: ru
  text: Иосиф в пору своего бедствия соблюл заповедь[a] и стал владыкой Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «повеление». Греческий текст не уточняет, какая именно заповедь имеется в виду; это может быть обобщённым указанием на послушание Иосифа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν καιρῷ στενοχωρίας αὐτοῦ
  choice: в пору своего бедствия
  rationale: Передаёт временную конструкцию и состояние тяжёлых, стеснённых обстоятельств естественным и достойным современным русским языком.
- source_word: ἐφύλαξε
  choice: соблюл
  rationale: В сочетании с «заповедь» выражает верное исполнение и послушание; совершенный вид соответствует греческому аористу.
- source_word: ἐντολήν
  choice: заповедь
  rationale: Сохраняет нравственно-религиозный смысл греческого слова, не уточняя, имеется ли в виду конкретная заповедь или послушание Божьей воле вообще.
- source_word: κύριος Αἰγύπτου
  choice: владыкой Египта
  rationale: Передаёт высокий статус и власть Иосифа, не смешивая это употребление κύριος с божественным титулом; форма с родительным падежом сохраняет компактность греческого выражения.
theological_decisions:
- issue: К чему относится послушание Иосифа
  choice: Общая формулировка о соблюдении заповеди во время испытания
  alternative: Конкретная отсылка к отказу Иосифа согрешить с женой Потифара
  rationale: Греческий текст не называет конкретной заповеди. Перевод сохраняет эту неопределённость, хотя контекст может напоминать события Бытия 39.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Владыка» здесь обозначает земную власть Иосифа, а не божественный титул.
