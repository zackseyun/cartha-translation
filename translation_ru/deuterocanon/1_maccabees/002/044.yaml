base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/044.yaml
  text: They joined them and became a support for them[a]. They also formed a force and struck down sinners in their anger, and lawless men in their wrath[b]; and the rest fled to the nations to save themselves.
translation:
  language: ru
  text: К ним присоединились[a] и стали для них опорой. Они собрали войско и в гневе поразили грешников, а в ярости — беззаконников; остальные бежали к народам, чтобы спастись[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «были прибавлены к ним»; то есть вступили в их группу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к язычникам». Греческое выражение может подразумевать окружающие нееврейские народы либо их земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσετέθησαν
  choice: присоединились
  rationale: Пассивная форма буквально допускает «были присоединены / прибавились», но в данном контексте естественно передаёт вступление людей в группу.
- source_word: εἰς στήριγμα
  choice: стали для них опорой
  rationale: στήριγμα означает опору или поддержку; этот вариант сохраняет образ и естественно звучит по-русски.
- source_word: συνεστήσαντο δύναμιν
  choice: собрали воинскую силу
  rationale: δύναμις может обозначать как силу, так и вооружённый отряд. Формулировка сохраняет эту смысловую связь, не превращая группу однозначно в регулярное войско.
- source_word: ἐπάταξαν
  choice: поражали
  rationale: Глагол обозначает нанесение тяжёлых, нередко смертельных ударов. «Поражали» сохраняет военную силу выражения, не уточняя прямо, что всех убили.
- source_word: ἁμαρτωλούς
  choice: грешников
  rationale: Прямо сохраняет нравственно-религиозную оценку греческого текста.
- source_word: ἐν ὀργῇ αὐτῶν
  choice: в гневе
  rationale: Передаёт ὀργή и позволяет отличить его от более бурного θυμός в параллельной части.
- source_word: ἄνδρας ἀνόμους
  choice: беззаконных мужей
  rationale: Сохраняет и смысл ἀνόμους как нарушающих закон, и явно мужское обозначение ἄνδρας.
- source_word: ἐν θυμῷ αὐτῶν
  choice: в ярости
  rationale: «Ярость» передаёт горячую, бурную силу θυμός и сохраняет усиление относительно «гнева».
- source_word: οἱ λοιποί
  choice: остальные
  rationale: Естественно обозначает тех из противников, кто не был поражён.
- source_word: εἰς τὰ ἔθνη
  choice: к другим народам
  rationale: В данном иудейском контексте речь идёт об окружающих нееврейских народах или их землях; «другим» делает это значение понятным, не вводя новозаветно окрашенный термин «язычники» в основной текст.
- source_word: σωθῆναι
  choice: чтобы спастись
  rationale: Пассивный инфинитив цели после глагола бегства естественно передаётся возвратным русским глаголом и означает поиск спасения или безопасности.
theological_decisions:
- issue: Нравственные обозначения участников военного конфликта
  choice: Сохранены «грешники» и «беззаконные мужи» как оценки самого повествования.
  alternative: «злодеи и преступники» либо «нечестивцы и беззаконники»
  rationale: Греческий текст представляет конфликт в нравственно-религиозных категориях; перевод не должен сводить их лишь к политической или уголовной характеристике.
- issue: Передача явно мужского ἄνδρας
  choice: «мужей»
  alternative: «людей»
  rationale: Источник использует явно мужское существительное; его значение сохранено без гендерной нейтрализации.
- issue: Смысл τὰ ἔθνη
  choice: «другие народы» в основном тексте с пояснением в сноске
  alternative: «язычники» или формальное «народы»
  rationale: Выражение может обозначать как нееврейские народы, так и связанные с ними территории. Перевод сохраняет контекстуальный смысл, а сноска отмечает диапазон значения.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксис сделан ясным для широкого читателя; нравственная и военная напряжённость оригинала сохранена. «Мужей» употреблено намеренно как точная передача ἄνδρας.
