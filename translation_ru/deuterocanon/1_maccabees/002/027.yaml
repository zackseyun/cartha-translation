  yaml_path: translation/deuterocanon/1_maccabees/002/027.yaml
  text: And Mattathias cried out in the city with a loud voice, saying, “Everyone who is zealous for the law and upholds the covenant, let him come out after me.”
translation:
  language: ru
  text: 'И возгласил Маттафия в городе громким голосом: «Всякий, кто ревнует о Законе и хранит завет, пусть выйдет вслед за мной».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέκραξεν
  choice: возгласил
  rationale: Передаёт сильный публичный призыв; это естественное и достойное по стилю соответствие греческому глаголу без разговорного оттенка.
- source_word: ἐν τῇ πόλει
  choice: в городе
  rationale: Прямо сохраняет локативное значение греческого оборота.
- source_word: φωνῇ μεγάλῃ
  choice: громким голосом
  rationale: Сохраняет конкретный образ исходной конструкции и естественно звучит по-русски.
- source_word: Πᾶς ὁ ζηλῶν τῷ νόμῳ
  choice: Всякий, кто ревнует о Законе
  rationale: «Ревнует о» выражает горячую преданность и деятельную заботу; написание «Закон» указывает на Тору в данном иудейском контексте.
- source_word: ἱστῶν διαθήκην
  choice: хранит завет
  rationale: В данном контексте ἵστημι означает поддерживать верность уже существующему завету, а не учреждать его. «Хранит» естественно передаёт деятельную верность.
- source_word: ἐξελθέτω ὀπίσω μου
  choice: пусть выйдет вслед за мной
  rationale: Сохраняет как физический выход, важный для повествования, так и направленность следом за Маттафией.
theological_decisions:
- issue: Передача διαθήκη в контексте отношений Израиля с Богом
  choice: завет
  alternative: союз; договор
  rationale: «Завет» — устоявшийся русский библейский термин, сохраняющий богословский вес понятия и не привносящий дополнительной конфессиональной интерпретации.
- issue: Передача νόμος как Торы
  choice: Закон
  alternative: закон
  rationale: Прописная буква ясно показывает, что речь идёт не о праве вообще, а о данном Израилю Законе, не добавляя этого пояснения в сам текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, публично-призывным звучанием. Синтаксис близок к греческому, но естественен по-русски; сохранены конкретность выхода из города и напряжённая covenantal формулировка.
