  text: And now[a], children, be zealous for the law[b], and give your lives for the covenant of our fathers.
translation:
  language: ru
  text: А теперь, дети[a], ревнуйте о Законе и отдайте свои жизни за завет[b] наших отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыновья». Греческое слово τέκνα означает «дети»; хотя здесь Маттафия обращается непосредственно к своим сыновьям, само слово не уточняет их пола.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ради завета наших отцов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: дети
  rationale: Форма обращения обозначает потомков вообще и сохраняет отеческий тон речи; непосредственные слушатели — сыновья Маттафии, однако само греческое слово не означает исключительно сыновей.
- source_word: ζηλώσατε τῷ νόμῳ
  choice: ревнуйте о Законе
  rationale: Глагол передаёт горячую, деятельную преданность. Русское библейское выражение «ревновать о» остаётся понятным и сохраняет силу призыва; прописная буква указывает на Тору как определённый Закон.
- source_word: δότε τὰς ψυχὰς ὑμῶν
  choice: отдайте свои жизни
  rationale: В контексте призыва к самопожертвованию ψυχαί означает жизнь, а не отдельно мыслимую нематериальную душу. Перевод близок к форме оригинала и естественен по-русски.
- source_word: ὑπὲρ διαθήκης
  choice: за завет
  rationale: ὑπέρ выражает то, ради чего совершается жертва, или то, в защиту чего выступают. «За завет» кратко сохраняет оба оттенка.
- source_word: πατέρων ἡμῶν
  choice: наших отцов
  rationale: Перевод сохраняет явно мужскую родовую лексику оригинала и её традиционный заветный смысл.
theological_decisions:
- issue: Значение ψυχή в призыве к самопожертвованию
  choice: жизни
  alternative: души; самих себя
  rationale: Контекст требует значения физической жизни и не ставит вопрос о составе человека; «души» могло бы необоснованно сузить смысл.
- issue: Родовая формула πατέρων ἡμῶν
  choice: наших отцов
  alternative: наших предков
  rationale: Оригинал прямо говорит об «отцах» Израиля; сохранение этой формы не нейтрализует историко-заветную лексику.
- issue: Референт νόμος
  choice: Закон
  alternative: закон
  rationale: В маккавейском контексте речь идёт не о законе вообще, а о данном Израилю Законе; прописная буква ясно передаёт этот референт, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Выражение «ревнуйте о Законе» передаёт религиозную напряжённость оригинала без архаизации всего стиха; синтаксис краток и соответствует предсмертному наставлению.
