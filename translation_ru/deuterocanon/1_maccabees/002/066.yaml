base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/066.yaml
  text: And Judas Maccabeus himself, strong in might from his youth, shall be your commander of the army, and you shall fight the battle against the nations.
translation:
  language: ru
  text: А сам Иуда Маккавей, могучий с юности[a], будет у вас предводителем войска, и вы будете вести войну против народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст буквально содержит трудный оборот, приблизительно: «сильный силой от него, от юности своей». По-видимому, смысл в том, что Иуда был могуч с юности.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: Иуда Маккавей
  rationale: Традиционная русская передача имени и прозвания в контексте 1 Маккавейской книги.
- source_word: ἰσχυρὸς δυνάμει
  choice: могучий
  rationale: Сжатая и естественная русская передача усилительного сочетания «сильный силой», сохраняющая акцент на воинской мощи.
- source_word: ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ
  choice: с юности
  rationale: Передаёт ясный смысл трудного греческого оборота, не воспроизводя в основном тексте его неясную избыточность.
- source_word: ἄρχοντα στρατιᾶς
  choice: предводителем войска
  rationale: Естественно обозначает военного руководителя и сохраняет значение обоих греческих слов.
- source_word: πολεμήσετε πόλεμον
  choice: будете вести войну
  rationale: Идиоматическая современная русская передача греческой однокоренной конструкции «воевать войну».
- source_word: λαῶν
  choice: против народов
  rationale: Сохраняет широкое значение «народы», не вводя более богословски нагруженное «язычники».
theological_decisions:
- issue: Передача трудного оборота ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ
  choice: В основном тексте дан вероятный смысл «с юности», а формальная трудность отмечена в сноске.
  alternative: 'Буквально воспроизвести: «могучий силой от него, от юности своей».'
  rationale: Буквальный вариант по-русски неясен и не позволяет уверенно установить референт ἐκ αὐτοῦ. Перевод сохраняет доступный смысл, а сноска — подлинную текстовую трудность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Предводитель войска» уместно для древнего контекста, но остаётся понятным современному читателю; синтаксис не архаизирован.
