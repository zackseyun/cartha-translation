lexical_decisions:
- source_word: ἔφυγον
  choice: бежал
  rationale: Греческий аорист передаёт совершившееся бегство; при составном подлежащем в русском естественно согласование в единственном числе с ближайшим «он», а участие сыновей выражено оборотом «вместе со своими сыновьями».
- source_word: εἰς τὰ ὄρη
  choice: в горы
  rationale: Обычный современный русский эквивалент направления движения, соответствующий εἰς с винительным падежом.
- source_word: ἐγκατέλιπον
  choice: оставив
  rationale: Передаёт оставление имущества позади без более сильного оттенка окончательного отказа, который могло бы внести «бросив»; деепричастная конструкция естественно связывает два действия.
- source_word: ὅσα εἶχον
  choice: всё, что у них было
  rationale: Сохраняет широкий объём относительного выражения и естественно передаёт множественное число субъекта в форме «у них».
