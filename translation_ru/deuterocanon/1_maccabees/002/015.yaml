lexical_decisions:
- source_word: οἱ παρὰ τοῦ Βασιλέως
  choice: посланцы царя
  rationale: Оборот буквально означает «те, кто от царя» и обозначает людей, действующих по его поручению. «Посланцы царя» естественно передаёт делегированную власть, не уточняя их должность сверх греческого текста.
- source_word: καταναγκάζοντες
  choice: принуждавшие
  rationale: Причастие выражает сильное принуждение, а не просто убеждение или давление; выбранный вариант точно передаёт эту силу и естественно звучит по-русски.
- source_word: τὴν ἀποστασίαν
  choice: к отступничеству
  rationale: В данном контексте речь идёт о принуждении оставить верность иудейской вере и установленному ею образу жизни. «Отступничество» сохраняет религиозный смысл и богословский вес слова.
- source_word: εἰς Μωδεείν
  choice: в Модеин
  rationale: При глаголе движения εἰς естественно передаётся русским «в»; «Модеин» служит прямой транслитерацией названия Μωδεείν.
- source_word: Καὶ ἦλθον
  choice: И пришли
  rationale: Сохраняет повествовательную связь, выраженную Καί, и простой последовательный ход греческого текста.
theological_decisions:
- issue: Значение ἀποστασία в контексте гонения
  choice: отступничество в религиозном смысле
  alternative: мятеж в политическом смысле; отпадение или измена в общем смысле
  rationale: Ближайший контекст Первой книги Маккавейской говорит о насильственном отказе от соблюдения иудейской веры и участии в языческих обрядах. Поэтому религиозный смысл здесь является основным, хотя само греческое слово вне контекста может иметь более широкий смысл отпадения.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и dignified. Порядок слов сделан естественным для русского, при этом сохранены все смысловые элементы греческого текста.
