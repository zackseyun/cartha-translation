lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой соединительный переход и паратактическое течение греческого повествования.
- source_word: αὐτῷ υἱοὶ πέντε
  choice: было у него пять сыновей
  rationale: Дательный αὐτῷ в подразумеваемой бытийно-притяжательной конструкции естественно передаётся по-русски оборотом «было у него»; порядок слов сохраняет повествовательный ритм.
- source_word: Ἰωάννης
  choice: Иоанн
  rationale: Традиционная русская библейская передача греческого имени Ἰωάννης.
- source_word: ὁ ἐπικαλούμενος
  choice: прозванный
  rationale: Причастие обозначает дополнительное имя или прозвище; «прозванный» здесь кратко и естественно, не утверждая, что речь непременно о фамилии.
- source_word: Γαδδίς
  choice: Гаддисом
  rationale: Имя или прозвище транслитерируется с греческой формы; творительный падеж требуется русским глагольным управлением при «прозванный».
