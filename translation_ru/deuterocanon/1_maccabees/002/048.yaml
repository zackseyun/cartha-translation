lexical_decisions:
- source_word: ἀντελάβοντο
  choice: вырвали
  rationale: Средняя форма ἀντιλαμβάνομαι может означать поддержку, помощь или избавление. Сочетание с ἐκ χειρός и враждебными силами указывает здесь на активное освобождение; «вырвали» естественно передаёт также образ изъятия из чужих рук.
- source_word: τοῦ νόμου
  choice: закон
  rationale: В данном маккавейском контексте имеется в виду иудейский Закон, Тора. Строчная буква следует греческому тексту и не навязывает издательского истолкования.
- source_word: ἐκ χειρὸς
  choice: из рук
  rationale: Сохранён конкретный библейский образ руки как власти или обладания; русское выражение «вырвать из рук» понятно и естественно.
- source_word: τῶν ἐθνῶν
  choice: народов
  rationale: Буквальное значение ἔθνη — «народы». В контексте это неиудейские народы, однако перевод не вводит более истолковывающие обозначения «язычники» или «иноверцы».
- source_word: τῶν βασιλέων
  choice: царей
  rationale: Прямое соответствие βασιλεῖς; контекст не требует расширительного «правителей».
- source_word: οὐκ ἔδωκαν κέρας
  choice: не дали … поднять рог
  rationale: Сохранён библейский образ рога как силы, власти или возвышения. Глагол «поднять» делает образ естественным по-русски, не сводя его к одному отвлечённому значению.
- source_word: τῷ ἁμαρτωλῷ
  choice: грешнику
  rationale: Прямой перевод существительного в единственном числе; вариант «нечестивцу» сильнее истолковывает нравственную характеристику.
