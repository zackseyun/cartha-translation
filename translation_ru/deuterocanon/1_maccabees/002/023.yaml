lexical_decisions:
- source_word: ὡς ἐπαύσατο
  choice: когда он закончил
  rationale: Передаёт завершение речи и последовавшее за ним действие без излишнего усиления временного оттенка.
- source_word: λαλῶν τοὺς λόγους τούτους
  choice: говорить эти слова
  rationale: Естественно и достаточно близко передаёт греческое причастное сочетание.
- source_word: προσῆλθεν
  choice: вперёд вышел
  rationale: В публичной сцене выражает приближение человека к жертвеннику на виду у собравшихся.
- source_word: ἀνὴρ Ἰουδαῖος
  choice: один иудей
  rationale: Передаёт мужской род и этнорелигиозную принадлежность; слово «один» естественно вводит нового участника повествования без числового акцента.
- source_word: ἐν ὀφθαλμοῖς πάντων
  choice: на глазах у всех
  rationale: Современный и ясный русский эквивалент греческой идиомы публичной видимости.
- source_word: θυσιάσαι
  choice: чтобы принести жертву
  rationale: Передаёт целевое значение инфинитива и сохраняет культовый смысл.
- source_word: ἐπὶ τοῦ βωμοῦ
  choice: на жертвеннике
  rationale: Стандартное русское обозначение места жертвоприношения.
- source_word: ἐν Μωδεείμ
  choice: в Модеине
  rationale: Русская форма топонима, основанная на греческом Μωδεείμ и согласованная с нормами русской передачи библейских географических названий.
- source_word: κατὰ τὸ πρόσταγμα τοῦ βασιλέως
  choice: по повелению царя
  rationale: Естественно передаёт действие в соответствии с властным приказом царя.
theological_decisions:
- issue: Значение Ἰουδαῖος
  choice: иудей
  alternative: житель Иудеи; иудейский мужчина
  rationale: В контексте гонения речь прежде всего об этнорелигиозной принадлежности, хотя греческое слово может также обозначать происхождение из Иудеи; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным повествовательным тоном. Формулировки естественны для широкой аудитории; сохранены публичный характер поступка и культовая терминология.
