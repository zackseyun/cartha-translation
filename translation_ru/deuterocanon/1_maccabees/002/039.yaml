  text: And Mattathias and his friends learned of it, and they mourned for them very greatly.
translation:
  language: ru
  text: Маттафия и его друзья узнали об этом и горько оплакали погибших.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: узнали об этом
  rationale: Аорист γινώσκω обозначает здесь получение известия о только что рассказанном событии; эта формулировка естественно передаёт наступившее осознание.
- source_word: οἱ φίλοι αὐτοῦ
  choice: его друзья
  rationale: Прямое соответствие φίλοι, которое в данном повествовании обозначает близких и верных сторонников Маттафии.
- source_word: ἐπένθησαν
  choice: оплакивали
  rationale: Глагол означает скорбное оплакивание умерших и в контексте гибели людей точнее общего «скорбели».
- source_word: ἐπʼ αὐτούς
  choice: погибших
  rationale: Оборот указывает на людей, по которым совершалось оплакивание. Контекстуальное существительное делает русскую фразу ясной, не меняя референта местоимения.
- source_word: ἕως σφόδρα
  choice: глубоко
  rationale: Сочетание резко усиливает выражение скорби; «глубоко оплакивали» естественно и достойно звучит по-русски, передавая высокую степень переживания.
