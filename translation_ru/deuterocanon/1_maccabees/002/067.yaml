lexical_decisions:
- source_word: προσάξετε πρὸς ὑμᾶς
  choice: соберите вокруг себя
  rationale: Сочетание глагола с πρὸς ὑμᾶς означает привести людей к себе, присоединить их к своей стороне. «Соберите вокруг себя» естественно передаёт призыв сплотить сторонников.
- source_word: πάντας τοὺς ποιητὰς τοῦ νόμου
  choice: всех, кто исполняет закон
  rationale: ποιηταί здесь — не создатели закона, а те, кто осуществляет его требования на деле. «Исполняет закон» точно и естественно выражает активное соблюдение.
- source_word: ἐκδικήσατε ἐκδίκησιν
  choice: отомстите
  rationale: В греческом употреблена усилительная конструкция из однокоренных глагола и существительного. По-русски глагол «отомстите» ясно и без неестественного повтора передаёт основной смысл; усиление отмечено в сноске.
- source_word: τοῦ λαοῦ ὑμῶν
  choice: за свой народ
  rationale: Родительный падеж при ἐκδίκησιν указывает на тех, за кого надлежит отомстить. Возвратное «свой» естественно соотносит народ с подлежащим второго лица множественного числа.
theological_decisions:
- issue: Передача νόμος в иудейском контексте Маккавейских книг
  choice: закон
  alternative: Закон; Тора
  rationale: В данном контексте речь идёт об отеческом законе Израиля, однако греческий текст употребляет обычное νόμος с артиклем. Написание со строчной буквы сохраняет исходную форму и не вводит отсутствующего в источнике типографского толкования.
- issue: Характер призыва ἐκδικήσατε ἐκδίκησιν
  choice: отомстите за свой народ
  alternative: совершите возмездие за свой народ
  rationale: Текст прямо содержит повеление отомстить; перевод сохраняет его силу и не смягчает богословско-нравственное напряжение выражением общего характера вроде «добейтесь справедливости».
translation_notes:
  register: Современный литературный русский язык с ясной, достойной повелительной интонацией. Синтаксис сохраняет подчёркнутое καὶ ὑμεῖς («И вы»), а неестественный для русского однокоренной повтор вынесен в сноску.
