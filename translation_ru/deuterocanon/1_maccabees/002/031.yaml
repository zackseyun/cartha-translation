  yaml_path: translation/deuterocanon/1_maccabees/002/031.yaml
  text: And it was reported to the king’s men and to the forces that were in Jerusalem[a], the city of David, that men who had scattered because of the king’s command had gone down into the hidden places in the wilderness.
translation:
  language: ru
  text: И донесли людям царя и войскам, находившимся в Иерусалиме, городе Давида, что люди, нарушившие повеление царя[a], спустились в укромные места в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза сжата и допускает также перевод: «что люди, рассеявшиеся из-за повеления царя, спустились в скрытые места в пустыне».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: донесли
  rationale: Безличная пассивная формула сообщения естественно передаётся по-русски неопределённо-личной конструкцией.
- source_word: τοῖς ἀνδράσιν τοῦ βασιλέως
  choice: людям царя
  rationale: Сохраняет широкое значение ἄνδρες и не уточняет без основания, были ли это чиновники или воины.
- source_word: ταῖς δυνάμεσιν
  choice: войскам
  rationale: В данном военно-политическом контексте δυνάμεις обозначает вооружённые силы; форма множественного числа сохранена.
- source_word: ἐν Ἰερουσαλὴμ πόλει Δαυείδ
  choice: в Иерусалиме, городе Давида
  rationale: Естественно передаёт приложение πόλει Δαυείδ и сохраняет оба наименования.
- source_word: κατέβησαν
  choice: спустились
  rationale: Передаёт пространственное значение глагола без добавления направления, не указанного явно помимо последующей предложной группы.
- source_word: διεσκέδασαν τὴν ἐντολὴν τοῦ βασιλέως
  choice: нарушившие повеление царя
  rationale: При прямом дополнении «повеление» буквальное значение «рассеяли» по-русски невозможно; контекстуальное «нарушили/отвергли» даёт связный смысл. Лексическая и синтаксическая неоднозначность отмечена в сноске.
- source_word: εἰς τοὺς κρυφοὺς
  choice: в тайные убежища
  rationale: Субстантивированное κρυφούς обозначает скрытые места; «тайные убежища» естественно и ясно передаёт бегство в укрытие.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Обычный библейский эквивалент ἔρημος в данном географическом контексте.
theological_decisions:
- issue: Значение διεσκέδασαν с прямым дополнением τὴν ἐντολὴν τοῦ βασιλέως
  choice: Люди нарушили царское повеление и укрылись в пустыне.
  alternative: Люди рассеялись из-за царского повеления и затем ушли в скрытые места.
  rationale: Греческая фраза с обычным значением διεσκέδασαν «рассеяли» и дополнением «повеление» сжата и необычна. Основной текст следует возможному значению «расстроили, отвергли, нарушили», а иной способ связать глагол с бегством сохраняется в сноске, без устранения подлинной неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис ясен для широкого читателя; административные и военные роли не конкретизированы сверх греческого текста.
