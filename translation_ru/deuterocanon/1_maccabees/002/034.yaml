  yaml_path: translation/deuterocanon/1_maccabees/002/034.yaml
  text: And they said, “We will not come out, nor will we do the king’s word, to profane the Sabbath day.”
translation:
  language: ru
  text: 'И они сказали: «Мы не выйдем и не исполним повеления царя, и тем самым не оскверним субботний день».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελευσόμεθα
  choice: мы не выйдем
  rationale: Будущее время от ἐξέρχομαι означает «выйти». В контексте речь идёт об отказе покинуть укрытие; «не выйдем» точно и естественно передаёт смысл.
- source_word: ποιήσομεν τὸν λόγον τοῦ βασιλέως
  choice: не исполним повеления царя
  rationale: 'Буквально: «не сделаем слова царя». Русское «исполнить повеление» естественно выражает выполнение царского приказа, сохраняя связь с ποιέω («делать, исполнять»).'
- source_word: βεβηλῶσαι
  choice: осквернив
  rationale: Глагол означает обращение со святыней как с чем-то несвятым, её осквернение. Деепричастие передаёт связь между исполнением повеления и вызванным этим нарушением святости субботы, не сводя оборот исключительно к намерению.
- source_word: ἡμέραν τῶν σαββάτων
  choice: субботний день
  rationale: Формально сочетание содержит множественное число «суббот», но служит обычным обозначением дня субботы. Русское «субботний день» ясно и естественно.
theological_decisions:
- issue: Передача священного характера субботы в βεβηλῶσαι τὴν ἡμέραν τῶν σαββάτων
  choice: осквернив субботний день
  alternative: нарушив субботний день
  rationale: '«Осквернив» сохраняет культовый смысл βεβηλόω: речь идёт не просто о несоблюдении правила, а об обращении со святым днём как с несвятым.'
- issue: Связь инфинитива βεβηλῶσαι с исполнением царского повеления
  choice: деепричастный оборот «осквернив»
  alternative: целевой оборот «чтобы осквернить»
  rationale: Греческий инфинитив допускает целевую или результативную связь. В русском «чтобы осквернить» могло бы ошибочно представить осквернение как собственную цель говорящих; деепричастный оборот сохраняет смысл осквернения как следствия исполнения приказа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формулировки понятны без специальных богословских знаний; архаические обороты вроде «сотворить слово царя» не используются.
