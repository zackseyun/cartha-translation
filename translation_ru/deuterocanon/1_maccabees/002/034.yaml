  source_fidelity: '«Мы не выйдем» точно передаёт будущее ἐξελευσόμεθα. «Не исполним повеления царя» верно передаёт идиоматическое ποιήσομεν τὸν λόγον τοῦ βασιλέως. Однако деепричастие «осквернив» обычно обозначает предшествующее или сопутствующее действие и способно создать неверную временно-логическую связь: как будто осквернение предшествует исполнению повеления. Греческий инфинитив βεβηλῶσαι связывает исполнение царского приказа с осквернением субботы как его целью/следствием.'
