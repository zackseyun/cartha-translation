lexical_decisions:
- source_word: Ἕως τοῦ νῦν
  choice: До сих пор
  rationale: Сохраняет временное значение и намеренную краткость греческой фразы, не превращая её явно в истолкование «пока ещё не поздно».
- source_word: ἐξέλθοντες
  choice: выйдите
  rationale: Причастие входит в побудительную последовательность и по-русски естественно передаётся повелительной формой; обращение направлено к тем, кому велят покинуть укрытие.
- source_word: ποιήσατε
  choice: поступите
  rationale: Передаёт широкое значение ποιέω и естественно сочетается с оборотом «по слову царя».
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: по слову царя
  rationale: Сохраняет лексему λόγος как «слово», не исключая контекстуального значения приказа или повеления.
- source_word: ζήσεσθε
  choice: будете жить
  rationale: Буквально передаёт будущее время ζάω и сохраняет подразумеваемое обещание сохранить жизнь без пояснительной добавки.
