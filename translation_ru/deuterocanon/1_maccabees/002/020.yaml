translation:
  language: ru
  text: Но я, мои сыновья и мои братья будем жить по завету наших отцов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «пойдём в завете наших отцов». По смыслу греческий оборот означает жить, сохраняя верность завету.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: Но я
  rationale: Слияние καί и ἐγώ буквально допускает «и я» или «я тоже», однако в данном контексте союз выражает противопоставление тем, кто согласился отступить; по-русски это естественно передаётся как «но я».
- source_word: οἱ υἱοί μου
  choice: мои сыновья
  rationale: υἱοί здесь прямо обозначает сыновей Маттафии; родовая конкретность исходного текста сохранена.
- source_word: οἱ ἀδελφοί μου
  choice: мои братья
  rationale: Основное значение ἀδελφοί — «братья». Более широкое «родственники» возможно в иных контекстах, но здесь для такого расширения нет достаточных оснований.
- source_word: πορευσόμεθα ἐν διαθήκῃ
  choice: будем жить по завету
  rationale: Буквально выражение означает «пойдём в завете», но в сочетании с διαθήκη глагол описывает образ жизни и верность обязательствам завета. Русское «жить по завету» естественно передаёт этот смысл, а буквальная форма отмечена в сноске.
- source_word: πατέρων ἡμῶν
  choice: наших отцов
  rationale: Сохранено буквальное и богословски значимое обозначение предшествующих поколений как «отцов», без нейтрализации до «предков».
theological_decisions:
- issue: Заветный оборот πορευσόμεθα ἐν διαθήκῃ
  choice: будем жить по завету наших отцов
  alternative: пойдём в завете наших отцов; будем держаться завета наших отцов
  rationale: Оборот выражает не пространственное движение, а решимость строить жизнь в верности унаследованному завету. Выбранная формулировка передаёт это без конфессионального уточнения и без устранения образа заветной верности.
- issue: Мужские термины родства
  choice: мои сыновья… мои братья… наших отцов
  alternative: мои дети… мои родственники… наших предков
  rationale: Греческий текст последовательно употребляет конкретные мужские обозначения родства; их сохранение передаёт историческую и семейную определённость высказывания.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной библейской речи. Формулировка «жить по завету» понятна обычному читателю; более буквальный, но неестественный по-русски оборот сохранён в сноске.
