  terminology: «Маттафия» — традиционная русская форма имени; «жертвенники» точно передаёт βωμούς и уместно в современном литературном библейском регистре. Местоимение «их» обоснованно сохраняет неуточнённый в самом стихе референт αὐτῶν.
