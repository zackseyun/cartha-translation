lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: обходил окрестности
  rationale: Глагол передаёт движение по округе, от места к месту; такой перевод естественен по-русски и не создаёт неуместного образа военного окружения.
- source_word: καθεῖλον
  choice: разрушал
  rationale: Глагол означает низвергать, сносить или разрушать; несовершенный вид по-русски согласует действие с обходом разных мест и передаёт последовательную деятельность.
- source_word: βωμοὺς
  choice: жертвенники
  rationale: βωμός обозначает жертвенник; это прямой и привычный библейский эквивалент, не смешивающий его с понятием высот.
- source_word: αὐτῶν
  choice: их
  rationale: Сохранено местоимение исходного текста без уточнения его референта, который определяется ближайшим контекстом.
- source_word: Ματταθίας
  choice: Маттафия
  rationale: Употреблена традиционная русская библейская форма имени; форма «Маттафия» соответствует именительному падежу.
theological_decisions:
- issue: Культовая принадлежность разрушенных сооружений
  choice: их жертвенники
  alternative: жертвенники вообще
  rationale: Притяжательное αὐτῶν указывает на жертвенники противников или отступников в контексте. Перевод сохраняет указание, не добавляя более конкретной характеристики.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой. Синтаксис краткий и повествовательный; подлинная неопределённость местоимения «их» сохранена.
