  yaml_path: translation/deuterocanon/1_maccabees/002/065.yaml
  text: And look, Simeon your brother—I know that he is a man of counsel. Listen to him all your days; he will be a father to you.
translation:
  language: ru
  text: И вот, Симеон, брат ваш, — я знаю, что он человек рассудительный. Слушайтесь его во все дни; он будет вам отцом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: И вот
  rationale: Естественная современная передача указательно-привлекающей внимание частицы, сохраняющая торжественный оттенок без архаичного «се».
- source_word: ἀνὴρ βουλῆς
  choice: человек рассудительный
  rationale: Передаёт человека, способного давать мудрый совет и принимать обдуманные решения; буквальное «человек совета» по-русски неестественно.
- source_word: αὐτοῦ ἀκούετε
  choice: Слушайтесь его
  rationale: В контексте отцовского наставления оборот означает не только слышать, но внимать его руководству.
- source_word: πάσας τὰς ἡμέρας
  choice: во все дни
  rationale: Сохраняет временную формулу оригинала и её возвышенный регистр.
- source_word: εἰς πατέρα
  choice: отцом
  rationale: 'Естественно передаёт предикативное значение роли: он будет для них как отец и руководитель.'
theological_decisions:
- issue: Характер отцовства Симеона
  choice: он будет вам отцом
  alternative: он будет для вас вместо отца
  rationale: Сохранена прямая метафора оригинала без добавочного толкования о замещении Маттафии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сохраняет последовательность греческого наставления, избегая архаизма «се» и неестественного буквализма.
