lexical_decisions:
- source_word: ἀνέστησαν ἐπʼ αὐτούς
  choice: пошли на них
  rationale: Оборот обозначает враждебное выступление против кого-либо; такой перевод сохраняет образ действия и не уточняет способ нападения сверх греческого текста.
- source_word: ἐν τῷ πολέμῳ
  choice: войной
  rationale: В сочетании с «пошли на них» естественно передаёт вооружённое выступление и непосредственное боевое столкновение.
- source_word: τοῖς σάββασιν
  choice: в субботу
  rationale: Хотя греческая форма множественного числа, в данном контексте речь идёт о нападении в конкретный субботний день; русский язык естественно требует единственного числа.
- source_word: ἀπέθανον
  choice: умерли
  rationale: Сохранён непереходный глагол исходного текста. Контекст указывает на насильственную гибель, но форма «были убиты» сделала бы это более явным, чем греческий оригинал.
- source_word: τὰ κτήνη
  choice: скот
  rationale: Обозначает домашних хозяйственных животных; «скот» — ясный и естественный русский эквивалент.
- source_word: ἕως χιλίων ψυχῶν ἀνθρώπων
  choice: до тысячи человек
  rationale: ἕως с числом естественно выражает верхний предел; ψυχῶν ἀνθρώπων здесь служит для подсчёта людей. Формулировка сохраняет возможную неточность числа.
