  text: And seeing the blasphemies being committed in Judah and in Jerusalem,
translation:
  language: ru
  text: И, увидев богохульства, совершаемые в Иудее и Иерусалиме,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδών
  choice: увидев
  rationale: Аористное причастие от ὁράω; деепричастие сохраняет зависимость от последующего действия в контексте и естественно звучит по-русски.
- source_word: βλασφημίας
  choice: богохульства
  rationale: Прямо передаёт религиозный характер оскорбительных и нечестивых деяний, не сужая смысл до одного лишь святотатства.
- source_word: τὰς γινομένας
  choice: совершаемые
  rationale: Причастие настоящего времени обозначает происходящие в тот период действия; сочетание «богохульства, совершаемые» идиоматично передаёт γίνομαι при данном существительном.
- source_word: ἐν Ἰούδᾳ
  choice: в Иудее
  rationale: В данном повествовательном контексте название обозначает территорию; современная русская форма «Иудея» ясна и естественна.
- source_word: ἐν Ἱερουσαλήμ
  choice: в Иерусалиме
  rationale: Общепринятая русская передача географического названия с требуемым предложным падежом.
theological_decisions:
- issue: Передача βλασφημίας в рассказе о религиозном осквернении
  choice: богохульства
  alternative: святотатства; кощунства
  rationale: «Богохульства» сохраняет явную направленность греческого слова против Бога и святыни. «Святотатства» могло бы неоправданно сузить значение до посягательств на священные предметы, а «кощунства» несколько ослабляет прямоту термина.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный библейского повествования. Начальное «И» и деепричастный оборот сохраняют синтаксическую связь стиха с последующим высказыванием; конечная запятая показывает незавершённость предложения.
