  text: And those from the king answered and said to Mattathias[a], saying, “You are a ruler, honored and great in this city[b], and supported by sons and brothers.”
translation:
  language: ru
  text: 'Представители царя ответили Маттафии: «Ты — правитель, славный и великий в этом городе и имеешь прочную опору в сыновьях и братьях[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты прочно утвердился благодаря сыновьям и братьям». Греческое выражение может обозначать как поддержку со стороны семьи, так и прочное положение Маттафии, связанное с его сыновьями и братьями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: люди царя
  rationale: Греческое выражение буквально обозначает «тех, кто от царя» и в данном контексте указывает на его представителей. «Люди царя» кратко и естественно передаёт эту связь, не уточняя сверх текста, были ли они посланцами или должностными лицами.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν ... λέγοντες
  choice: ответили
  rationale: Тройная повествовательная формула буквально означает «ответили и сказали, говоря», но по-русски такое накопление звучит искусственно. Один глагол «ответили» полностью передаёт её речевую функцию.
- source_word: Ἄρχων
  choice: начальник
  rationale: Слово обозначает человека, обладающего властью или признанным главенством. «Начальник» сохраняет оттенок общественного положения и не вводит конкретной должности, не названной в тексте.
- source_word: ἔνδοξος
  choice: почитаемый
  rationale: В обращении речь идёт о признании и уважении в обществе; «почитаемый» передаёт этот смысл естественнее, чем буквальное «славный».
- source_word: μέγας
  choice: влиятельный
  rationale: Здесь μέγας характеризует высокий общественный вес Маттафии. «Влиятельный» ясно выражает контекстуальный смысл, тогда как «великий» в современном русском могло бы приписать ему историческое величие.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: в этом городе
  rationale: Прямое и нормативное соответствие греческому выражению; πόλις передано как «город» без попытки определить размер поселения.
- source_word: ἐστηριγμένος ἐν υἱοῖς καὶ ἀδελφοῖς
  choice: опираешься на сыновей и братьев
  rationale: Причастие выражает устойчивость или прочное положение, связанное с сыновьями и братьями. Выбранная формулировка естественно передаёт семейную поддержку, а возможный оттенок «прочно утвердившийся среди них» сохранён в примечании.
