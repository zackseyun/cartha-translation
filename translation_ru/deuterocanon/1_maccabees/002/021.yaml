lexical_decisions:
- source_word: ἵλεως ἡμῖν
  choice: Да не будет того, чтобы мы
  rationale: Греческое выражение передаёт решительное отвержение самой возможности поступка. Русская формула «да не будет того» сохраняет торжественную силу и не превращает неоднозначную идиому в прямое упоминание Бога.
- source_word: καταλεῖπειν
  choice: оставили
  rationale: В контексте речь идёт не о простом физическом оставлении, а об отказе от верности Закону; «оставили» естественно по-русски и сохраняет эту серьёзность без избыточного усиления.
- source_word: νόμον
  choice: Закон
  rationale: Контекст однозначно указывает на известный Закон Израиля как целостную заветную норму; прописная буква помогает передать это определённое значение в русском библейском употреблении.
- source_word: δικαιώματα
  choice: установления
  rationale: Слово обозначает предписанные нормы и постановления. «Установления» понятно современному читателю и не сужает смысл до одной области религиозного или гражданского права.
theological_decisions:
- issue: Заветный смысл νόμον καὶ δικαιώματα
  choice: Закон и установления
  alternative: закон и постановления; Закон и уставы
  rationale: Передача сохраняет отсылку к заветной правовой традиции Израиля, не вводя позднейших конфессиональных разграничений.
- issue: Неоднозначность выражения ἵλεως ἡμῖν
  choice: Основной текст передаёт идиоматическое решительное отвержение; буквальный оттенок милости отмечен в сноске
  alternative: Да будет милостиво к нам — оставить Закон и установления
  rationale: В данном построении выражение обычно функционирует как формула сильного отрицания, однако его буквальная связь с милостью остаётся заметной и потому не должна быть полностью скрыта.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной формулой решительного отказа. Синтаксис сохраняет краткость и декларативную силу оригинала.
