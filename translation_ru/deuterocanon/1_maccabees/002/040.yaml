base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/040.yaml
  text: And one man said to his neighbor[a], “If we all do as our brothers did, and do not fight against the Gentiles for our lives and our rights[b], they will quickly destroy us from the land.”
translation:
  language: ru
  text: 'И один сказал другому: «Если все мы поступим так, как поступили наши братья, и не будем сражаться с язычниками[a] за нашу жизнь и наши права[b], то теперь они вскоре истребят нас с этой земли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «народы». Здесь, по-видимому, имеются в виду нееврейские народы, противостоящие иудеям.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «установления», «законные требования» либо «предписания». Греческое слово может обозначать установленные нормы, законные права или обязательные постановления.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἀνὴρ πρὸς τὸν πλησίον αὐτοῦ
  choice: один сказал другому
  rationale: Естественно передаёт греческую конструкцию со значением разговора между членами одной группы, сохраняя единственное число исходного текста.
- source_word: ἀδελφοὶ
  choice: братья
  rationale: Сохраняет прямое значение мужского множественного числа и в контексте обозначает ранее погибших единоверцев.
- source_word: πολεμήσωμεν
  choice: будем сражаться
  rationale: Передаёт вооружённое сопротивление без усиления до формального объявления войны.
- source_word: τὰ ἔθνη
  choice: язычники
  rationale: В данном иудейском контексте обозначает противостоящие евреям нееврейские народы; буквальная возможность «народы» сохранена в сноске.
- source_word: ψυχῆς
  choice: жизнь
  rationale: Здесь ψυχή означает физическую жизнь, которую необходимо защитить, а не отвлечённую «душу».
- source_word: δικαιωμάτων
  choice: установления
  rationale: Слово может обозначать установленные нормы, предписания или законные права. «Установления» сохраняет юридико-религиозную широту термина и не вносит исключительно современное понимание прав.
- source_word: νῦν τάχιον
  choice: очень скоро
  rationale: В контексте сочетание выражает близость и быстроту грозящего уничтожения; буквальное «теперь быстрее» по-русски было бы неясным.
- source_word: ὀλεθρεύσουσιν
  choice: истребят
  rationale: Передаёт сильное значение полного уничтожения общины и естественно сочетается с выражением «с этой земли».
- source_word: ἀπὸ τῆς γῆς
  choice: с этой земли
  rationale: γῆ здесь относится к земле их проживания, а не ко всей земле как миру; указательное «этой» естественно подразумевается контекстом.
theological_decisions:
- issue: Значение τὰ ἔθνη в контексте иудейского сопротивления
  choice: язычники
  alternative: народы
  rationale: Противопоставление «нашим братьям» показывает, что речь идёт о нееврейских противниках. Сноска сохраняет буквальное и более широкое значение.
- issue: Значение δικαιωμάτων
  choice: установления
  alternative: права; законные требования; предписания
  rationale: Греческое слово допускает как нормативно-религиозный, так и юридический оттенок. Основной текст не ограничивает его современным понятием индивидуальных прав, а сноска сохраняет смысловую неоднозначность.
- issue: Защита жизни и установлений вооружённой силой
  choice: описательное утверждение участников повествования
  alternative: понимание реплики как общего богословского предписания
  rationale: Перевод не превращает историческую речь персонажей в универсальную норму и не смягчает содержащийся в ней призыв к сопротивлению.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Формулировка ясна для широкого читателя; сохранены резкость угрозы и неоднозначность юридико-религиозного термина δικαιώματα.
