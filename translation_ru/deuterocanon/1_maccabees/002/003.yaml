lexical_decisions:
- source_word: Σίμων
  choice: Симон
  rationale: Традиционная русская передача греческой формы личного имени Σίμων; она естественна для библейского текста и отличает эту форму от Συμεών («Симеон»).
- source_word: ὁ καλούμενος
  choice: прозванный
  rationale: Субстантивированное причастие указывает на дополнительное имя или прозвище. «Прозванный» кратко и естественно передаёт эту функцию, не утверждая точнее необходимого, было ли Фасси прозвищем, почётным именем или иным обозначением.
- source_word: Θασσίς
  choice: Фасси
  rationale: 'Непереводимое собственное обозначение передано по традиционной русской системе транслитерации греческих библейских имён: Θ — «Ф»; конечное -ς отдельно не воспроизводится, что соответствует укоренившейся форме «Фасси».'
