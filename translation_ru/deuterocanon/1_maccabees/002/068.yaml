translation:
  language: ru
  text: Воздайте народам воздаяние[a] и внимайте повелениям Закона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом употреблены однокоренные слова: «воздайте воздаяние»; этот повтор усиливает мысль об ответном воздаянии.'
    reason: Передача эмфатической однокоренной конструкции и пояснение буквального соответствия.
lexical_decisions:
- source_word: ἀνταποδίδοτε ἀνταπόδομα
  choice: Воздайте … по заслугам
  rationale: Однокоренная греческая конструкция усиливает мысль об ответном воздаянии. Естественный русский оборот передаёт взаимно-ответный и в данном контексте карательный оттенок, не утяжеляя фразу искусственным повтором.
- source_word: τοῖς ἔθνεσιν
  choice: народам
  rationale: ἔθνη может обозначать как народы вообще, так и языческие, нееврейские народы. «Народам» сохраняет этнополитическую широту греческого слова; контекст указывает на окружающие Израиль народы.
- source_word: προσέχετε εἰς
  choice: внимайте
  rationale: Глагол призывает внимательно относиться к чему-либо. «Внимайте» звучит достойно и лаконично, не подменяя внимательность прямым значением «исполняйте».
- source_word: προστάγματα
  choice: повелениям
  rationale: Слово обозначает предписания или приказы. «Повеления» ясно передаёт обязательную силу этих установлений.
- source_word: τοῦ νόμου
  choice: Закона
  rationale: В контексте имеется в виду Закон Израиля, Тора; прописная буква помогает обозначить этот конкретный религиозно-исторический референт.
theological_decisions:
- issue: Передача τοῖς ἔθνεσιν
  choice: народам
  alternative: язычникам
  rationale: «Язычникам» явно выражает нееврейскую принадлежность, но сужает этнополитический оттенок. «Народам» сохраняет неоднозначность исходного слова.
- issue: Сила выражения ἀνταποδίδοτε ἀνταπόδομα
  choice: воздайте … по заслугам
  alternative: воздайте воздаяние; отплатите
  rationale: Выбранный оборот сохраняет призыв к ответному воздаянию, но не усиливает значение до однозначной «кары» или «мести», которых существительное само по себе не требует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «воздайте» и «внимайте» соответствуют жанру предсмертного наставления, оставаясь понятными современному читателю.
