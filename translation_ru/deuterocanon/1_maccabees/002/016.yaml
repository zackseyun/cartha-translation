lexical_decisions:
- source_word: τὴν πόλιν
  choice: в город
  rationale: Винительный падеж обозначает направление движения, заданного предшествующей частью предложения. Русское «в город» естественно передаёт это значение, не восстанавливая отсутствующие в данном фрагменте слова.
- source_word: ἵνα θυσιάσωσιν
  choice: чтобы принести жертву
  rationale: ἵνα с сослагательным наклонением выражает цель. «Принести жертву» естественно и точно передаёт культовое значение θυσιάζω.
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: многие из Израиля
  rationale: Сохраняется близкая к греческой формулировка, где ἀπό указывает на происхождение или принадлежность.
- source_word: πρὸς αὐτοὺς προσῆλθαν
  choice: перешли к ним
  rationale: Выражение буквально обозначает движение к ним, а в данном контексте, вероятно, также подразумевает переход на их сторону. «Перешли к ним» сохраняет оба оттенка, не усиливая смысл до безусловного «присоединились».
- source_word: συνήχθησαν
  choice: собрались
  rationale: Форма передаёт совместное собирание. Русское возвратное «собрались» естественно выражает значение греческого пассива/непереходного употребления без тяжеловесного «были собраны».
theological_decisions:
- issue: Политико-религиозное присоединение, подразумеваемое πρὸς αὐτοὺς προσῆλθαν
  choice: перешли к ним
  alternative: подошли к ним; присоединились к ним
  rationale: В контексте жертвоприношения выражение, вероятно, означает переход на сторону царских представителей, однако сам греческий текст описывает приближение к ним. Выбранная формулировка сохраняет контекстуальный намёк, не превращая его в более однозначное утверждение о полной приверженности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное многоточие показывает, что предоставленный исходный фрагмент начинается в середине предложения. Союз «и» последовательно передаёт καί без добавления невыраженного противопоставления.
