  text: All her glory was taken away; instead of being free[a], she became a servant.
translation:
  language: ru
  text: Всё её великолепие было отнято[a]; из свободной она стала рабыней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё её убранство было снято». Греческое κόσμος здесь означает убранство, красоту или великолепие, а не «мир».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ κόσμος αὐτῆς
  choice: всё её великолепие
  rationale: В данном контексте κόσμος означает не «мир», а убранство, красоту или великолепие; πᾶς при существительном в единственном числе выражает полноту утраты.
- source_word: ἀφηρέθη
  choice: было отнято
  rationale: Форма страдательного залога передаёт лишение, совершённое внешней силой, не уточняя действующее лицо.
- source_word: ἀντὶ ἐλευθέρας ἐγενήθη εἰς δούλην
  choice: из свободной она стала рабыней
  rationale: Русская конструкция естественно и ясно передаёт резкую смену положения, выраженную противопоставлением ἐλευθέρα и δούλη.
theological_decisions:
- issue: Передача δούλη в противопоставлении ἐλευθέρα
  choice: рабыня
  alternative: служанка
  rationale: Здесь речь идёт именно об утрате свободы и переходе в подневольное состояние; «рабыня» сохраняет силу противопоставления «свободная — рабыня».
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией плача. Женский род сохраняет олицетворение города; формулировка остаётся ясной для современного читателя.
