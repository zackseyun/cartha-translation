  text: And do not fear the word of a sinful man[a], for his glory is for dung and worms.
translation:
  language: ru
  text: И не бойтесь слова грешного человека[a], ибо слава его — навоз и черви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не бойтесь того, что говорит грешный человек». Буквально по-гречески: «не бойтесь от слова грешного человека».'
    reason: лексическая альтернатива и пояснение необычного греческого управления
lexical_decisions:
- source_word: λόγου
  choice: слов
  rationale: В сочетании с ἀπό после φοβηθῆτε слово λόγος обозначает исходящие от человека слова, то, что он говорит. Русское множественное «слов» естественно передаёт это собирательное значение, тогда как буквальное «слова» в единственном числе здесь звучало бы менее естественно.
- source_word: ἀνδρὸς ἁμαρτωλοῦ
  choice: грешного человека
  rationale: Сохраняется мужской род ἀνήρ и определение ἁμαρτωλός; сочетание звучит по-русски естественно и не превращает определение в существительное без необходимости.
- source_word: μὴ φοβηθῆτε
  choice: не бойтесь
  rationale: Прямо передаёт запретительный аористный конъюнктив, не сужая смысл до «не поддавайтесь угрозам».
- source_word: δόξα
  choice: слава
  rationale: Сохраняет возвышенное и ироническое звучание δόξα, охватывая славу, почёт и блеск грешного человека.
- source_word: εἰς κόπρια
  choice: обратится в навоз
  rationale: Предлог εἰς выражает направленность к унизительному итогу; «обратится в» естественно передаёт переход, а «навоз» сохраняет резкость образа κόπρια.
- source_word: καὶ εἰς σκώληκας
  choice: и червей
  rationale: «Черви» сохраняют широкий смысл σκώληκες и образ телесного распада, не конкретизируя его до личинок.
theological_decisions:
- issue: Следует ли передавать ἀνήρ как конкретно мужское обозначение или обобщённо
  choice: 'мужское обозначение: «грешного человека»'
  alternative: «грешника» или гендерно нейтральное обозначение
  rationale: В греческом стоит ἀνήρ в мужском роде; русский вариант сохраняет эту форму, не делая утверждение более универсальным, чем исходный текст.
- issue: Насколько буквально сохранять образ посмертного унижения и распада
  choice: «слава его обратится в навоз и червей»
  alternative: «его слава окончится тлением»
  rationale: Конкретные образы навоза и червей составляют риторическую силу предупреждения и не должны сглаживаться. При этом «обратится в» естественно выражает направленность εἰς, не устраняя возможного смысла конечной участи.
translation_notes:
  register: Современный литературный русский язык с dignified библейским тоном. Сохранены резкость образа и лаконичность наставления; необычная конструкция с λόγος разъяснена в сноске.
