  text: And look—our holy things, our beauty, and our glory have been laid waste, and the nations have defiled them.
translation:
  language: ru
  text: И вот, наша святыня, наша красота и наша слава опустошены, и народы осквернили их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἅγια ἡμῶν
  choice: наша святыня
  rationale: Субстантивированное множественное τὰ ἅγια обозначает священное место или святыни; в контексте разорённого храма естественное русское собирательное «святыня» сохраняет сакральный смысл, тогда как буквальное «наши святые вещи» звучит неестественно.
- source_word: ἡ καλλονὴ ἡμῶν
  choice: наша красота
  rationale: Прямо передаёт καλλονή и сохраняет поэтический параллелизм трёх определений.
- source_word: ἡ δόξα ἡμῶν
  choice: наша слава
  rationale: Обычное и контекстуально точное соответствие δόξα.
- source_word: ἠρημώθη
  choice: опустошены
  rationale: Пассивная форма передаёт состояние разорения и запустения; множественное сказуемое по-русски согласовано с однородным составным подлежащим.
- source_word: ἔθνη
  choice: народы
  rationale: Сохраняет широкое значение «народы» без внесения более узкого конфессионально окрашенного «язычники».
- source_word: ἐβεβήλωσαν
  choice: осквернили
  rationale: Передаёт культовое значение βεβηλόω — лишить святости, профанировать.
- source_word: αὐτά
  choice: их
  rationale: Сохраняет местоименное множественное число греческого текста; вероятный референт — перечисленные священные ценности, причём неоднозначность не устраняется.
theological_decisions:
- issue: Референт местоимения αὐτά
  choice: Сохранить форму «их» без уточнения.
  alternative: «её» с отнесением только к святыне либо явное повторение «святыни».
  rationale: Греческое местоимение стоит во множественном числе и допускает отнесение к перечисленному целому; конкретизация сузила бы исходный текст.
- issue: Передача ἔθνη
  choice: «народы»
  alternative: «язычники»
  rationale: Исходное слово само по себе означает народы; контекст может подразумевать иноземные языческие народы, но перевод не должен без необходимости делать это толкование явным.
translation_notes:
  register: Современный литературный русский с торжественным библейским ритмом. Начальное «И вот» естественно передаёт καὶ ἰδού; трёхчастный параллелизм сохранён. Архаизмы и конфессионально маркированная лексика не использованы.
