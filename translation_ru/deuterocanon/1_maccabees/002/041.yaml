base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/041.yaml
  text: And on that day they decided, saying, “If any man comes against us for battle on the Sabbath day, we will fight against him, and we will certainly not all die as our brothers died in the hiding places.”
translation:
  language: ru
  text: 'И в тот день они решили: «Если кто-нибудь придёт воевать против нас в субботний день, мы будем сражаться с ним и не умрём все, как умерли наши братья в укрытиях».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: они решили
  rationale: Передаёт совместно принятое обдуманное решение естественным современным русским языком.
- source_word: Πᾶς ἄνθρωπος ὃς ἐὰν ἔλθῃ
  choice: если кто-нибудь придёт
  rationale: Условная конструкция с ἐὰν обозначает любого возможного нападающего; по-русски естественно передаётся через «если кто-нибудь».
- source_word: εἰς πόλεμον
  choice: воевать
  rationale: Инфинитив цели кратко и естественно выражает приход с намерением вступить в бой.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: в субботний день
  rationale: Сохраняет указание на день субботы без добавления конфессиональной интерпретации.
- source_word: ἐν τοῖς κρυφοῖς
  choice: в укрытиях
  rationale: Нейтрально передаёт субстантивированное прилагательное во множественном числе — скрытые, потаённые места.
theological_decisions:
- issue: Допустимость оборонительного боя в субботу
  choice: 'Передать решение героев прямо, без богословской оценки: «мы будем сражаться с ним».'
  alternative: Уточнить «будем защищаться» или добавить нравственное оправдание.
  rationale: Греческий текст говорит πολεμήσομεν и описывает принятое решение, но не формулирует здесь отдельного богословского обоснования; добавлять его не следует.
- issue: Усиленное отрицание οὐ μὴ ἀποθάνωμεν
  choice: «не умрём все»
  alternative: «ни за что не умрём все» или «мы, конечно, не умрём все».
  rationale: Контекст передаёт твёрдую решимость; русское будущее с отрицанием сохраняет смысл, не создавая неуместной эмоциональной окраски.
translation_notes:
  register: Современный литературный русский язык; повествование с прямой речью звучит ясно и достойно. Синтаксис немного упрощён относительно греческого «решили, говоря», поскольку буквальное воспроизведение было бы тяжеловесным.
