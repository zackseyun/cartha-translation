  text: они, их сыновья, их жёны и их скот, потому что бедствия тяжело обрушились на них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: они сами
  rationale: Самостоятельное αὐτοί допускает лёгкий эмфатический оттенок; «они сами» естественно продолжает перечень из предыдущего стиха.
- source_word: οἱ υἱοὶ αὐτῶν
  choice: их сыновья
  rationale: υἱοί прямо обозначает сыновей, а не детей вообще.
- source_word: αἱ γυναῖκες αὐτῶν
  choice: их жёны
  rationale: В перечне членов семей γυναῖκες с притяжательным местоимением естественно означает жён.
- source_word: τὰ κτήνη αὐτῶν
  choice: их скот
  rationale: κτήνη обозначает домашних хозяйственных животных; «скот» — краткий и естественный русский эквивалент.
- source_word: ἐσκληρύνθη ἐπʼ αὐτοὺς
  choice: тяжело обрушились на них
  rationale: Буквально глагол связан с ожесточением или суровостью, но вместе с τὰ κακά выражает усиление и тяжесть постигших их бедствий.
- source_word: τὰ κακά
  choice: бедствия
  rationale: В данном контексте субстантивированное «злое/плохое» означает несчастья, тяготы или бедствия, а не нравственное зло.
