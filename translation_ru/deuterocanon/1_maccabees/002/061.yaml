    reason: lexical_alternative
lexical_decisions:
- source_word: ἐννοήθητε
  choice: вдумайтесь
  rationale: Аорист повелительного наклонения во множественном числе выражает призыв осмыслить свидетельство истории. «Вдумайтесь» естественно передаёт и размышление, и побудительную силу формы, не сводя её только к интеллектуальному пониманию.
- source_word: κατὰ γενεὰν
  choice: из поколения в поколение
  rationale: Оборот охватывает последовательные поколения и указывает на историческую повторяемость Божьей верности. Русская идиома передаёт этот временной размах без излишнего уточнения синтаксической связи.
- source_word: ἐλπίζοντες
  choice: надеющиеся
  rationale: Причастие настоящего времени от ἐλπίζω прямо обозначает тех, кто возлагает надежду. «Надеющиеся» сохраняет смысл упования и не заменяет его более узким «доверяющие».
- source_word: ἐπʼ αὐτόν
  choice: на Него
  rationale: Местоимение сохранено, а прописная буква помогает современному русскому читателю увидеть подразумеваемого в контексте Бога, не подменяя местоимение существительным.
- source_word: ἀσθενήσουσιν
  choice: не ослабеют
  rationale: Будущее время от ἀσθενέω может означать «быть/стать слабым». «Не ослабеют» сохраняет глагольную динамику и не усиливает высказывание до однозначного «не потерпят неудачи».
theological_decisions:
- issue: К кому относится местоимение αὐτόν («Него»)
  choice: Подразумеваемый референт — Бог; местоимение сохранено.
  alternative: Оставить референт полностью неопределённым и написать «него» со строчной буквы.
  rationale: Ближайший контекст вспоминает Божью верность предкам и призывает уповать на Него. Сохранение местоимения следует греческому тексту, а прописная буква соответствует ясному контекстуальному референту.
- issue: Характер обещания в οὐκ ἀσθενήσουσιν
  choice: «не ослабеют» — обещание сохранения сил/стойкости.
  alternative: «не потерпят неудачи» — более широкое понимание результата.
  rationale: Греческий глагол допускает более широкое толкование, однако прямое значение связано со слабостью. Перевод не превращает стих в безусловное обещание внешнего успеха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Тире сохраняет некоторую открытость связи оборота «из поколения в поколение» с призывом вдуматься и с последующим обобщением. Формы «надеющиеся» и «Него» уместны в торжественном наставлении и остаются понятными широкому читателю.
