  text: And so consider[a], from generation to generation[b], that all who hope in him will not grow weak.
translation:
  language: ru
  text: 'Итак, вдумайтесь[a]: из поколения в поколение все надеющиеся на Него не ослабеют[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уразумейте»; возможно также: «примите к сердцу».'
