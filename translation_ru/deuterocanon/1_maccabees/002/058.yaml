lexical_decisions:
- source_word: Ἠλίας
  choice: Илия
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: ἐν τῷ ζηλῶσαι ζῆλον
  choice: проявив ревность
  rationale: Естественно передаёт обстоятельственное значение конструкции с артиклевым инфинитивом и усиление однокоренным дополнением, не сводя связь однозначно к причине.
- source_word: νόμου
  choice: о Законе
  rationale: В контексте речь идёт о Законе Моисея, поэтому прописная буква помогает обозначить конкретный религиозный смысл.
- source_word: ἀνελήμφθη
  choice: был взят
  rationale: Передаёт пассивную форму и не добавляет представления о восхождении собственной силой.
- source_word: ὡς εἰς τὸν οὐρανόν
  choice: словно на небо
  rationale: Сохраняет сравнительно-характеризующий оттенок ὡς и при этом звучит естественно по-русски.
theological_decisions:
- issue: Следует ли явно передавать ὡς в описании взятия Илии
  choice: 'Сохранить сравнительный оттенок: «словно на небо».'
  alternative: «на небо»
  rationale: В греческом тексте перед εἰς τὸν οὐρανόν стоит ὡς; его сохранение не позволяет незаметно сделать выражение более категоричным, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка избегает архаичного «ревновал ревностью», но сохраняет усилительный смысл греческого оборота.
