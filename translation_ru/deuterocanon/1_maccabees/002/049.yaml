    text: 'Или: «укрепились высокомерие и поношение». Греческий глагол подчёркивает, что они прочно утвердились.'
    reason: lexical_alternative
  - marker: b
    text: Буквально здесь соединены два близких греческих слова со значением гнева, что усиливает выражение. Текст не уточняет, чей это гнев.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν αἱ ἡμέραι τοῦ Ματταθίου ἀποθανεῖν
  choice: Когда Маттафии приблизилось время умереть
  rationale: Естественная для современного русского передача греческого временного оборота с сохранением смысла приближающейся смерти.
- source_word: ἐστηρίχθη
  choice: утвердились
  rationale: 'Передаёт результативно-пассивный смысл: высокомерие и поругание прочно укоренились; форма согласована с двумя однородными подлежащими.'
- source_word: ὑπερηφανία
  choice: высокомерие
  rationale: Точно выражает надменную, морально порочную гордость в современном литературном русском.
- source_word: ἔλεγμος
  choice: поругание
  rationale: В контексте общественного бедствия обозначает поношение и унижение, а не наставительное обличение.
- source_word: καιρὸς καταστροφῆς
  choice: время гибели
  rationale: Сохраняет зловещий смысл решающего периода разрушения или крушения и звучит естественно по-русски.
- source_word: ὀργὴ θυμοῦ
  choice: яростного гнева
  rationale: Передаёт усиление, создаваемое сочетанием двух близких обозначений гнева, без тяжеловесного буквального повтора.
theological_decisions:
- issue: Чей гнев подразумевается
  choice: Не уточнять носителя гнева
  alternative: Явно назвать гнев Божьим либо человеческой яростью преследователей
  rationale: В греческом тексте субъект или источник гнева не назван, поэтому перевод сохраняет эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский; повествование ясное и сдержанно-торжественное. Синтаксис естественный, без архаизации; подлинная неопределённость относительно гнева сохранена.
