  text: And the days drew near for Mattathias to die[a], and he said to his sons, “Now arrogance and reproach have grown strong[b], and it is a time of ruin and furious wrath.”
translation:
  language: ru
  text: 'Когда Маттафии приблизилось время умереть, он сказал своим сыновьям: «Теперь утвердились[a] высокомерие и поношение; настало время гибели и яростного гнева[b]».'
  philosophy: optimal-equivalence
  footnotes:
