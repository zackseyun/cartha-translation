lexical_decisions:
- source_word: ποῖον ἔθνος
  choice: Какой народ
  rationale: Передаёт риторический вопрос; «народ» естественно выражает здесь политико-коллективное значение ἔθνος.
- source_word: ἐκληρονόμησεν
  choice: не унаследовал
  rationale: Сохраняет образ получения в наследие или в удел, заложенный в κληρονομέω, и простое прошедшее значение аориста.
- source_word: βασιλείαν
  choice: царства
  rationale: В сочетании с глаголом наследования и последующим упоминанием добычи конкретное политическое значение «царство» наиболее естественно; родительный падеж требуется русским глаголом с отрицанием.
- source_word: ἐκράτησεν
  choice: не завладел
  rationale: Передаёт значение овладения и установления контроля, звуча естественно по-русски и не ослабляя контекст завоевания.
- source_word: τῶν σκύλων αὐτῆς
  choice: его военной добычей
  rationale: σκῦλα обозначает добычу, взятую в войне; «военная добыча» ясно передаёт это значение. Местоимение «его» грамматически соотносится с «царством», как и αὐτῆς с βασιλείαν, не конкретизируя состав добычи.
