  text: Daniel[a], in his simplicity, was rescued from the mouth of lions.
translation:
  language: ru
  text: Даниил в своём чистосердечии[a] был избавлен из пасти львов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своей искренности» или «в своей цельности». Греческое слово может означать простоту, искренность, нераздвоенность и нравственную прямоту.'
    reason: Лексическая многозначность ἁπλότης не передаётся полностью одним русским словом.
lexical_decisions:
- source_word: Δανιήλ
  choice: Даниил
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: ἁπλότης
  choice: чистосердечие
  rationale: Слово передаёт присущие греческому термину искренность, нераздвоенность и нравственную прямоту, не сводя его к наивной «простоте» и не усиливая однозначно до «непорочности».
- source_word: ἐρύσθη
  choice: был избавлен
  rationale: Пассивная форма аориста обозначает избавление от конкретной смертельной опасности; «был избавлен» естественно звучит в русском библейском повествовании и не вносит лишнего толкования.
- source_word: ἐκ στόματος λεόντων
  choice: из пасти львов
  rationale: Естественный русский эквивалент яркого греческого оборота с единственным числом στόματος и множественным λεόντων.
theological_decisions:
- issue: Значение ἁπλότης в похвальном упоминании Даниила
  choice: чистосердечие
  alternative: простота; искренность; цельность; непорочность
  rationale: «Чистосердечие» сохраняет положительный нравственный смысл и оттенок внутренней нераздвоенности, не утверждая более узкое толкование, чем допускает греческое слово.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Сохранена конструкция «в своём…», чтобы не превращать греческое ἐν в однозначно причинное «за» или «благодаря».
