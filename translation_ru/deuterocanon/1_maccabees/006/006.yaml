  yaml_path: translation/deuterocanon/1_maccabees/006/006.yaml
  text: And Lysias marched at first with a strong force[a], but was driven back before them, and they grew strong by means of the weapons that they had taken from the camps they had cut down.
translation:
  language: ru
  text: Сначала Лисий выступил с сильным войском, но был обращён в бегство перед ними. Они же стали сильнее благодаря оружию, которое захватили в разгромленных ими лагерях[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «они одерживали верх с помощью оружия, которое захватили в уничтоженных ими лагерях». Греческое слово может означать как усиление, так и преобладание, а последнее относительное предложение представляет собой сжатый военный оборот; буквально употреблён глагол «вырезать, вырубать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: выступил
  rationale: В военном контексте глагол обозначает движение войска; «выступил» естественно передаёт начало похода.
- source_word: δυνάμει ἰσχυρᾷ
  choice: с сильным войском
  rationale: Здесь δύναμις означает военную силу, а не отвлечённое могущество; по-русски «войско» ясно выражает контекст.
- source_word: ἐν πρώτοις
  choice: сначала
  rationale: Оборот указывает на начальный этап описываемых событий и подготавливает последующий контраст.
- source_word: ἀνετράπη ἀπὸ προσώπου αὐτῶν
  choice: был обращён перед ними в бегство
  rationale: Военный смысл пассивной формы — быть отброшенным или обращённым в бегство; «перед ними» сохраняет образ греческого выражения ἀπὸ προσώπου αὐτῶν.
- source_word: ἴσχυσαν
  choice: стали сильнее
  rationale: Глагол допускает значения «укрепились» и «одержали верх». В сочетании с орудийным дательным здесь сохранён акцент на усилении благодаря захваченному оружию, а другая возможность отмечена в сноске.
- source_word: ὅπλοις
  choice: благодаря оружию
  rationale: Так явно и естественно передаётся орудийное значение дательного падежа.
- source_word: ἔλαβον
  choice: захватили
  rationale: В военном контексте оружие было взято как трофей, поэтому «захватили» точнее простого «взяли».
- source_word: παρεμβολῶν
  choice: лагерях
  rationale: παρεμβολή в данном военном повествовании означает лагерь или стан.
- source_word: ἐξέκοψαν
  choice: разгромленных ими
  rationale: Буквально глагол означает «вырезать, вырубать», но применительно к лагерям выражает их уничтожение или разгром; буквальный образ и сжатость оборота пояснены в сноске.
