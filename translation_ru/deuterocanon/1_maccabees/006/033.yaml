  text: And the king rose early in the morning and moved the camp out in full force on the road to Beth-zachariah[a], and the forces drew up for battle[b], and they sounded the trumpets.
translation:
  language: ru
  text: Царь рано утром поднялся и двинул лагерь с большим напором по дороге к Бет-Захарии[a][b]. Войска выстроились для боя и затрубили в трубы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по дороге через Бет-Захарию». Греческое выражение может обозначать движение по пути, проходящему через это место.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «со всем стремлением (или: напором)». Греческое слово обозначает порыв, стремительное движение или натиск.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρισεν
  choice: встал рано утром
  rationale: Глагол обозначает ранний подъём или начало действий на рассвете; перевод сохраняет временной акцент, не отождествляя сам подъём с выступлением.
- source_word: ἀπῆρεν τὴν παρεμβολὴν
  choice: двинул весь лагерь
  rationale: Сочетание означает снятие лагеря и организованное выступление находившегося в нём войска; «двинул лагерь» сохраняет образ исходного текста.
- source_word: ἐν ὁρμήματι αὐτῆς
  choice: со всей его мощью
  rationale: ὅρμημα передаёт напор, порыв или движущую силу. В военном контексте формулировка выражает мощное движение всего лагеря, не сводя смысл только к численному составу.
- source_word: κατὰ τὴν ὁδὸν Βεθζαχαριά
  choice: по дороге к Бет-Захарии
  rationale: κατά с ὁδός указывает на движение по дороге или маршруту; дательный оборот с «к» естественно передаёт направление к названному месту.
- source_word: διετάξαντο αἱ δυνάμεις εἰς τὸν πόλεμον
  choice: войска выстроились к бою
  rationale: Средняя форма διετάξαντο в военном контексте указывает на построение сил в боевой порядок; возвратная формулировка сохраняет грамматическую перспективу греческого текста.
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: затрубили трубы
  rationale: Русская конструкция естественно передаёт греческое обозначение военного трубного сигнала и сохраняет множественное число инструментов.
- source_word: Βεθζαχαριά
  choice: Бет-Захария
  rationale: Название передано транслитерацией, с обычным русским склонением в контексте направления.
