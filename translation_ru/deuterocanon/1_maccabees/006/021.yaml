  yaml_path: translation/deuterocanon/1_maccabees/006/021.yaml
  text: And they came out from it[a], from the confinement, and some of the ungodly from Israel joined them.
translation:
  language: ru
  text: И они вышли оттуда[a], из заключения, и некоторые нечестивцы из Израиля присоединились к ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из него». Место, к которому относится местоимение, в самом стихе не названо. «Заключение» также можно передать как «осада» или «состояние запертости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ἐξ αὐτοῦ
  choice: они вышли оттуда
  rationale: Естественно передаёт выход из места, обозначенного местоимением с неявным в самом стихе антецедентом, не добавляя конкретного названия.
- source_word: συγκλεισμοῦ
  choice: заточения
  rationale: Передаёт основное значение состояния, при котором люди заперты или окружены, не сводя выражение исключительно к военной осаде.
- source_word: ἐκολλήθησαν αὐτοῖς
  choice: к ним примкнули
  rationale: Глагол выражает присоединение и тесную связь с группой; «примкнули» естественно для данного общественно-политического контекста.
- source_word: τινες τῶν ἀσεβῶν
  choice: некоторые из нечестивых
  rationale: Сохраняет неопределённость τινες и религиозно-нравственную характеристику ἀσεβῶν.
- source_word: ἐξ Ἰσραήλ
  choice: в Израиле
  rationale: В данном сочетании обозначает принадлежность этих людей к народу Израиля; русское «из нечестивых в Израиле» звучит естественнее буквального «из Израиля» и не предполагает, что речь идёт лишь о территории.
theological_decisions:
- issue: Религиозно-нравственная характеристика ἀσεβῶν
  choice: нечестивых
  alternative: безбожных; нечестивцев
  rationale: «Нечестивые» сохраняет указание на непочтительность к Богу и нравственную порочность, не сужая значение до отрицания существования Бога и не усиливая его сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повтор греческих конструкций с ἐξ сглажен в основном тексте ради естественности; неопределённость местоименного указания отмечена в сноске.
