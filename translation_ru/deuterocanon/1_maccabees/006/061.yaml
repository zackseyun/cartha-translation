  - marker: b
    text: 'В греческом тексте глагол стоит в единственном числе: «он вышел», хотя по контексту иногда переводят: «они вышли».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: поклялись
  rationale: Аорист ὄμνυμι прямо обозначает принесение клятвы. Русское «поклялись» естественно согласуется с составным подлежащим «царь и правители» и сохраняет юридическую силу выражения.
- source_word: ὁ βασιλεὺς
  choice: царь
  rationale: Обычное и уместное для исторического повествования соответствие βασιλεύς.
- source_word: οἱ ἄρχοντες
  choice: правители
  rationale: Передаёт политический смысл ἄρχοντες достаточно широко, не сужая его до конкретной должности.
- source_word: ἐπὶ τούτοις
  choice: на этих условиях
  rationale: Оборот отсылает к ранее изложенным условиям соглашения; такая передача естественна по-русски и ясно обозначает предмет клятвы.
- source_word: ἐξῆλθεν
  choice: он вышел
  rationale: Сохраняется единственное число греческого глагола. Местоимение делает невыраженное подлежащее явным, не устанавливая его личность сверх текста.
- source_word: τοῦ ὀχυρώματος
  choice: из крепости
  rationale: ὀχύρωμα означает укреплённое место; «крепость» кратко и естественно передаёт военный характер объекта.
