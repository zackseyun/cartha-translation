  text: And the king and the rulers swore this to them[a]; then he came out from the stronghold[b],
translation:
  language: ru
  text: И царь и правители поклялись им на этих условиях[a]. Тогда он вышел из крепости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «поклялись им в этом»; выражение относится к условиям, названным выше.'
