  yaml_path: translation/deuterocanon/1_maccabees/006/014.yaml
  text: Look[a], I am perishing in great grief in a foreign land. And he called Philip, one of his friends[b], and appointed him over all his kingdom.
translation:
  language: ru
  text: «Вот, я погибаю в великой скорби в чужой земле».[a] Он призвал Филиппа, одного из своих друзей,[b] и поставил его над всем своим царством.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот, я умираю в великой печали». Греческое ἀπόλλυμαι может означать как гибель, так и смерть, а λύπη — скорбь, печаль или страдание.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «один из его друзей» может также обозначать придворный статус царского приближённого, а не только личного друга.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Естественный для современной русской речи выразительный указательный маркер, сохраняющий непосредственность слов говорящего.
- source_word: ἀπόλλυμαι
  choice: я погибаю
  rationale: Передаёт широкий смысл гибели и приближающейся смерти, не сужая его до нейтрального «умираю».
- source_word: λύπῃ μεγάλῃ
  choice: от великой скорби
  rationale: Творительный падеж в греческом допускает причинное понимание; выражение сохраняет силу переживания и литературное достоинство.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: в чужой земле
  rationale: Естественно передаёт пребывание вне своей страны и оттенок отчуждённости.
- source_word: ἐκάλεσεν
  choice: призвал
  rationale: В данном повествовательном и царском контексте естественно означает, что Филипп был вызван к царю.
- source_word: Φίλιππον
  choice: Филиппа
  rationale: Традиционная русская передача греческого личного имени.
- source_word: ἕνα τῶν φίλων αὐτοῦ
  choice: одного из своих друзей
  rationale: Сохраняет прямое значение φίλος; возможный придворный титул разъясняется в сноске.
- source_word: κατέστησεν
  choice: поставил
  rationale: Передаёт официальное наделение полномочиями, оставаясь близким к греческому глаголу и библейскому повествовательному стилю.
- source_word: ἐπὶ πάσης τῆς βασιλείας αὐτοῦ
  choice: над всем своим царством
  rationale: Ясно выражает власть над всей державой и сохраняет структуру исходной фразы.
