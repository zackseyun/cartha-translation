  text: And if he does not get ahead of them quickly[a], they will do greater things than these[b], and he will not be able to restrain them.
translation:
  language: ru
  text: И если он без промедления не упредит их[a], они сделают больше, чем это[b], и он не сможет сдержать их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не опередит их быстро»; греческий глагол может означать действовать раньше другой стороны, чтобы предупредить её действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «большее, чем это»; в данном контексте это может означать более серьёзные или более масштабные действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαταλάβῃ
  choice: упредит
  rationale: Глагол обозначает действие наперёд, позволяющее опередить или предупредить действия другой стороны. «Упредить» естественно для военно-политического контекста и не сводит смысл к простой погоне.
- source_word: διὰ τάχους
  choice: без промедления
  rationale: Идиоматическое выражение передаёт срочность и необходимость действовать быстро.
- source_word: μείζονα τούτων
  choice: дела ещё более значительные, чем эти
  rationale: Сохраняет буквальное значение сравнительной формы «большие/значительные», не заменяя его однозначно на «худшие»; отрицательная оценка следует из контекста.
- source_word: κατασχεῖν
  choice: сдержать
  rationale: Передаёт значение удержать, обуздать или не дать продолжать действия; уместно в данном военно-политическом контексте.
- source_word: αὐτῶν
  choice: их
  rationale: Греческий родительный при инфинитиве по-русски естественно передаётся прямым дополнением к глаголу «сдержать».
- source_word: οὐ δυνήσεται
  choice: он не сможет
  rationale: Точно передаёт будущее время и невозможность совершить действие.
