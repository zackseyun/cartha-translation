lexical_decisions:
- source_word: ἔδειξαν
  choice: показали
  rationale: Прямое соответствие греческому аористу в повествовательном контексте; дательный τοῖς ἐλέφασιν естественно передаётся как «слонам».
- source_word: αἷμα σταφυλῆς καὶ μόρων
  choice: кровь винограда и тутовых ягод
  rationale: Сохранён яркий образ «крови», обозначающий красный сок. Единственное число σταφυλῆς имеет собирательное значение, а μόρων означает ягоды тутового дерева.
- source_word: τοῦ παραστῆσαι
  choice: чтобы разъярить
  rationale: Оборот с τοῦ и инфинитивом выражает цель; в данном военном контексте речь идёт о приведении слонов в возбуждённое, яростное состояние для боя.
- source_word: εἰς τὸν πόλεμον
  choice: перед битвой
  rationale: Передаёт направленность подготовки к предстоящему сражению естественным современным русским выражением.
