lexical_decisions:
- source_word: ἀριθμὸς τῶν δυνάμεων
  choice: численность его войска
  rationale: Передаёт военный смысл сочетания естественным современным русским языком; δυνάμεις здесь обозначает совокупность вооружённых сил.
- source_word: πεζῶν
  choice: пеших воинов
  rationale: Точно обозначает воинов, сражавшихся пешими, и сохраняет противопоставление всадникам.
- source_word: ἵππων
  choice: всадников
  rationale: Буквально слово означает «лошадей», но в перечне родов войск метонимически обозначает конные отряды.
- source_word: ἐλέφαντες
  choice: слона
  rationale: Прямое соответствие греческому слову с необходимым русским согласованием после числительного.
- source_word: εἰδότες πόλεμον
  choice: обученных для войны
  rationale: Буквально «знающих войну»; применительно к слонам выражение естественно указывает на подготовленность к военным действиям, не утверждая сверх текста конкретный вид обучения.
