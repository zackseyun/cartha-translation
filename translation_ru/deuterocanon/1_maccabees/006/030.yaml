  text: And the number of his forces was one hundred thousand foot soldiers[a], and twenty thousand horsemen[b], and thirty-two elephants trained for war.
translation:
  language: ru
  text: Численность его войска составляла сто тысяч пеших воинов, двадцать тысяч всадников[a] и тридцать два слона, обученных для войны[b].
