  yaml_path: translation/deuterocanon/1_maccabees/006/026.yaml
  text: And behold[a], today they have encamped against the citadel in Jerusalem, to capture it and the sanctuary, and they have fortified Beth-zur.
translation:
  language: ru
  text: И вот, сегодня они расположились лагерем против цитадели[a] в Иерусалиме, чтобы захватить её и святилище, а Бет-Цур укрепили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Акры» — названия укреплённой цитадели в Иерусалиме.'
    reason: Слово ἄκρα может быть понято как нарицательное «цитадель» или как название конкретной иерусалимской крепости — Акры.
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: И вот
  rationale: Сохраняет функцию указательного дискурсивного маркера, привлекающего внимание, и естественно звучит в современном литературном русском.
- source_word: παρεμβεβλήκασιν
  choice: они расположились лагерем против
  rationale: Передаёт военное размещение лагеря против укреплённого места, не усиливая значение до прямо не выраженной глаголом осады.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямой и естественный эквивалент временного наречия.
- source_word: ἐπὶ τὴν ἄκραν
  choice: против крепости
  rationale: ἄκρα обозначает укреплённую цитадель; «крепость» понятно современному читателю, а возможное историческое название «Акра» сохранено в сноске.
- source_word: τοῦ καταλαβέσθαι αὐτὴν
  choice: чтобы захватить её
  rationale: Конструкция с τοῦ и инфинитивом выражает цель, а καταλαμβάνω в данном военном контексте означает овладеть, захватить.
- source_word: τὸ ἁγίασμα
  choice: святилище
  rationale: Точно и кратко передаёт обозначение священного храмового пространства.
- source_word: τὴν Βεθσούραν
  choice: Бет-Цур
  rationale: Передача исторического топонима в форме, соответствующей его семитскому происхождению и принятой русской библейской ономастике.
- source_word: ὠχύρωσαν
  choice: укрепили
  rationale: Прямо передаёт действие по усилению обороны города или крепости.
