lexical_decisions:
- source_word: κατακολουθεῖν
  choice: следовать
  rationale: Инфинитив обозначает следование или подчинение; в сочетании с «повелениями» естественно передаёт послушание без избыточного толкования.
- source_word: προστάγμασιν
  choice: повелениям
  rationale: Слово обозначает властные предписания; «повеления» сочетается с личным местоимением «его» и сохраняет возвышенный, но понятный регистр.
- source_word: οἱ τοῦ λαοῦ ἡμῶν
  choice: люди из нашего народа
  rationale: Передаёт эллиптическое греческое выражение «те из нашего народа», не добавляя указания на пол.
- source_word: χάριν τούτου
  choice: из-за этого
  rationale: Ясно и естественно выражает причинное значение оборота.
- source_word: ἠλλοτριοῦντο
  choice: отдалялись
  rationale: Имперфект передаёт продолжавшийся процесс отчуждения; «отдалялись» естественно выражает общественное и политическое размежевание.
- source_word: ἀφʼ ἡμῶν
  choice: от нас
  rationale: Прямо передаёт значение отделения с ἀπό.
- source_word: πλὴν ὅσοι εὑρίσκοντο ἀφʼ ἡμῶν
  choice: кроме тех, кто оказывался среди нас
  rationale: «Кроме тех» передаёт исключение, а «оказывался» сохраняет буквальный образ εὑρίσκοντο. «Среди нас» естественно выражает возможное значение местонахождения или принадлежности, не устраняя неоднозначность.
