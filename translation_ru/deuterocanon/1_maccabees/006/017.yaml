lexical_decisions:
- source_word: ἐπέγνω
  choice: узнал
  rationale: Аорист передаёт момент, когда Лисий получил известие; «узнал» естественно выражает это в русском повествовании.
- source_word: τέθνηκεν
  choice: умер
  rationale: Перфект обозначает совершившуюся смерть с сохраняющимся результатом; в русском после «узнал, что» это естественно передаётся формой «умер».
- source_word: κατέστησεν βασιλεύειν
  choice: поставил … царём
  rationale: Сочетание означает возведение человека на царство. Такая формулировка передаёт и действие κατέστησεν, и царскую функцию βασιλεύειν, оставаясь естественной по-русски.
- source_word: ἀντʼ αὐτοῦ
  choice: вместо него
  rationale: Оборот указывает, что Антиох занял место умершего царя.
- source_word: ἐξέθρεψεν
  choice: воспитывал
  rationale: Глагол означает растить и воспитывать ребёнка; несовершенный вид по-русски естественно обозначает продолжительный процесс воспитания.
- source_word: νεώτερον
  choice: с юных лет
  rationale: Форма указывает на юный возраст Антиоха в период воспитания, не уточняя его точнее, чем греческий текст.
