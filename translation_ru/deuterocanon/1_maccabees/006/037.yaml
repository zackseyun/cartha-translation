  text: and on them were strong wooden towers[a], covered over, on each beast, fitted on them with engines; and on each one were thirty-two fighting men[b], and its Indian driver.
translation:
  language: ru
  text: На каждом животном[a] находились прочные крытые деревянные башни, оснащённые боевыми машинами; на них находились тридцать два сражавшихся воина и его индиец-погонщик[b].
