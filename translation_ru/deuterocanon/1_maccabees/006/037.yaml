lexical_decisions:
- source_word: πύργοι ξύλινοι
  choice: деревянная башня
  rationale: πύργος обозначает башню или башенную надстройку; единственное число в русском согласовано с распределительным ἐφʼ ἑκάστου — «на каждом».
- source_word: ὀχυροὶ σκεπαζόμενοι
  choice: прочная крытая
  rationale: ὀχυρός передаёт прочность и защищённость, а σκεπαζόμενος — наличие покрытия; такая формулировка естественна и не уточняет устройство крыши сверх сказанного в греческом.
- source_word: θηρίου
  choice: животном
  rationale: θηρίον здесь является общим обозначением животного; контекст указывает на боевого слона, что отмечено в сноске без замены исходного общего слова.
- source_word: ἐζωσμένοι ἐπʼ αὐτοῖς μηχαναῖς
  choice: закреплённая на нём при помощи особых приспособлений
  rationale: Оборот описывает оснащение или крепление башен на животных посредством μηχαναί — устройств, механизмов либо приспособлений. «Приспособления» сохраняет широту термина и даёт ясный образ крепления.
- source_word: ἄνδρες δύο καὶ τριάκοντα οἱ πολεμοῦντες
  choice: тридцать два воина
  rationale: Причастие οἱ πολεμοῦντες определяет мужчин по их боевой функции; «воины» передаёт это кратко и естественно.
- source_word: ὁ Ἰνδὸς αὐτοῦ
  choice: его погонщик-индиец
  rationale: Буквально выражение означает «его индиец». В данном описании слонов подразумевается индийский погонщик при каждом животном; роль раскрыта в тексте, а буквальность отмечена в сноске.
