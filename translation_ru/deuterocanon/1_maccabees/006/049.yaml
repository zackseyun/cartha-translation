base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/049.yaml
  text: And he came to terms with those in Bethsura and went out from the city[a], because they had no provisions there to remain shut up in it, because it was a sabbath year for the land.
translation:
  language: ru
  text: Он заключил соглашение с жителями Бет-Суры и вышел из города, потому что у них там не было припасов, чтобы оставаться в нём взаперти, ибо для земли был субботний год.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для земли была суббота»; то есть субботний год, когда землю оставляли необрабатываемой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν μετὰ τῶν ἐκ Βεθσούρων
  choice: Он заключил соглашение с жителями Бет-Суры
  rationale: Идиома ἐποίησεν μετά в контексте осады означает заключение соглашения или достижение договорённости. «Заключил соглашение» естественно и ясно передаёт военный контекст; οἱ ἐκ Βεθσούρων обозначает людей из Бет-Суры, то есть её жителей.
- source_word: ἐξῆλθε ἐκ τῆς πόλεως
  choice: и они вышли из города
  rationale: Хотя греческая форма глагола стоит в единственном числе, по смыслу действие относится к собирательной группе жителей Бет-Суры, с которыми было заключено соглашение. Русское множественное число устраняет ложное впечатление, будто из города вышел заключавший соглашение военачальник.
- source_word: διατροφή
  choice: припасов
  rationale: В условиях осады слово обозначает средства пропитания и содержания. «Припасы» передаёт практический смысл, не ограничивая его исключительно готовой пищей.
- source_word: τοῦ συνκλεισθαι ἐν αὐτῇ
  choice: чтобы оставаться в осаде
  rationale: Инфинитив описывает продолжительное пребывание запертыми внутри города. Выражение «оставаться в осаде» естественно для современного русского военного повествования и сохраняет обстоятельство вынужденной замкнутости.
- source_word: σάββατον ἦν τῇ γῇ
  choice: для земли был субботний год
  rationale: Буквально сказано, что для земли была «суббота»; по контексту имеется в виду год покоя земли. Добавление слова «год» предотвращает смешение с еженедельной субботой, а примечание сохраняет буквальную форму.
theological_decisions:
- issue: Значение выражения σάββατον ἦν τῇ γῇ
  choice: для земли был субботний год
  alternative: для земли была суббота
  rationale: Контекст нехватки припасов указывает на год, когда землю оставляли под паром. Основной текст передаёт подразумеваемый временной период ясно, а сноска отмечает буквальную формулировку и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Использованы понятные слова «заключил соглашение», «припасы», «оставаться в осаде»; буквальная библейская метафора о субботе земли сохранена в сноске.
