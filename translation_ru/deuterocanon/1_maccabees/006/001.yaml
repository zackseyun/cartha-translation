  yaml_path: translation/deuterocanon/1_maccabees/006/001.yaml
  text: And King Antiochus was traveling through the upper regions[a], and he heard that in Elymais, in Persia, there was a city renowned for wealth, silver, and gold;
translation:
  language: ru
  text: Царь Антиох проходил через верхние области и услышал, что в Элимаиде, в Персиде[a], есть город, славящийся богатством, серебром и золотом;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Персии». Греческое название может обозначать как собственно персидскую область (Персиду), так и Персию в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: проходил через
  rationale: Имперфект передаёт продолжавшееся движение через некоторую местность; «проходил через» естественно сохраняет этот длительный оттенок.
- source_word: τὰς ἐπάνω χώρας
  choice: верхние области
  rationale: χῶραι обозначает земли или области, а ἐπάνω — буквально «верхние». Перевод сохраняет пространственную формулировку, не уточняя без достаточных оснований, шла ли речь о внутренних, восточных или нагорных землях.
- source_word: Ἐλυμαΐς
  choice: Элимаида
  rationale: Передача греческого географического названия в принятой русской форме.
- source_word: ἐν τῇ Περσίδι
  choice: в Персиде
  rationale: Περσίς может обозначать собственно персидскую область; «Персида» точнее сохраняет региональное название, тогда как более привычное «Персия» приведено в примечании.
- source_word: πόλις ἔνδοξος
  choice: город, славящийся
  rationale: ἔνδοξος здесь указывает на известность и славу города, а не на его нравственное достоинство.
- source_word: πλούτῳ, ἀργυρίῳ, καὶ χρυσίῳ
  choice: богатством, серебром и золотом
  rationale: Дательный падеж указывает, чем именно славился город; перечисление сохранено без сведения серебра и золота к одному общему понятию богатства.
