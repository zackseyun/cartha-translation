lexical_decisions:
- source_word: ἐκθρέψαι
  choice: воспитать
  rationale: В данном контексте глагол означает вырастить и воспитать юного преемника; «воспитать» естественно передаёт смысл, не сводя его лишь к физическому питанию.
- source_word: τοῦ βασιλεύειν
  choice: для царствования
  rationale: Артикулярный инфинитив указывает на цель воспитания; «для царствования» сохраняет прямую связь с царской властью и не добавляет отсутствующих в тексте подробностей.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямой и нейтральный эквивалент без эвфемизма.
- source_word: ἐκεῖ
  choice: там
  rationale: Естественная передача простого наречия места.
- source_word: ἔτους ἐνάτου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ
  choice: в сто сорок девятом году
  rationale: Передаёт греческое обозначение года в естественной современной русской форме.
