  - marker: b
    text: 'Буквально: «от них». Вероятнее всего, речь идёт о войсках противника, хотя местоимение может шире относиться ко всей только что упомянутой царской силе.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰσχὺν
  choice: мощь
  rationale: Передаёт силу и военное могущество царства; в данном контексте естественнее и выразительнее нейтрального «силу».
- source_word: βασιλείας
  choice: царства
  rationale: Сохраняет широту греческого слова, которое здесь обозначает монархическое государство и его могущество, не сводя смысл только к царской власти.
- source_word: ὁρμήμα
  choice: яростный натиск
  rationale: Передаёт энергичное, силовое движение вперёд в бою. «Натиск» естественен по-русски, а «яростный» сохраняет интенсивность образа.
- source_word: δυνάμεων
  choice: войск
  rationale: В военном контексте множественное число δυνάμεις обозначает вооружённые силы; «войск» звучит естественно и не уточняет их состав сверх исходного текста.
- source_word: ἐξέκλιναν
  choice: отступили
  rationale: В данном боевом контексте глагол «уклонились/отвернули» обозначает отход от противника; «отступили» ясно передаёт действие, не добавляя причины.
- source_word: ἀπʼ αὐτῶν
  choice: от них
  rationale: Сохраняет множественное число местоимения и его наиболее вероятную связь с непосредственно предшествующими «войсками», не устраняя возможную более широкую отсылку.
