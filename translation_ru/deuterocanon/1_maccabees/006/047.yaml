translation:
  language: ru
  text: Они увидели мощь царства и натиск войск[a] и отступили от них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стремительный напор войск» или «атака войск». Греческое слово обозначает мощное движение вперёд в бою.'
