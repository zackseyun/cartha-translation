    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσέδυσεν
  choice: проскользнул
  rationale: Глагол обозначает проникновение внутрь или под что-либо скользящим, ныряющим движением; «проскользнул» живо передаёт стремительный манёвр под слона.
- source_word: ὑπὸ τὸν ἐλέφαντα
  choice: под слона
  rationale: Прямое пространственное выражение, естественное для современного русского языка.
- source_word: ὑπέθηκεν αὐτῷ
  choice: нанёс ему удар снизу
  rationale: Выражение в данном контексте идиоматично и не вполне ясно. Перевод передаёт нападение снизу, не уточняя оружие сверх того, что выражено в самом стихе.
- source_word: ἀνεῖλεν αὐτόν
  choice: убив его
  rationale: Причастный оборот естественно связывает нанесённый удар с его результатом и точно передаёт значение «убил».
- source_word: ἔπεσεν ἐπὶ τὴν γῆν ἐπάνω αὐτοῦ
  choice: Слон рухнул на землю прямо на него
  rationale: Повтор существительного устраняет неясность русского местоимения; «рухнул» естественно описывает падение тяжёлого животного, а «прямо на него» сохраняет обе пространственные составляющие греческой фразы.
- source_word: ἀπέθανεν ἐκεῖ
  choice: он погиб там
  rationale: «Погиб» естественно передаёт смерть человека в результате падения слона, а «там» сохраняет простое указание места без добавочного усиления.
