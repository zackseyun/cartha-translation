lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: возвратился
  rationale: В данном контексте аорист ἀποστρέφω обозначает возвращение из названных областей; «возвратился» естественно звучит по-русски и не добавляет идеи отступления.
- source_word: ἀπὸ τῆς Περσίδος καὶ Μηδίας
  choice: из Персии и Мидии
  rationale: Прямое и естественное обозначение исходного пункта движения после ἀπό; употреблены общепринятые русские географические названия.
- source_word: αἱ δυνάμεις
  choice: войска
  rationale: В военно-политическом повествовании δυνάμεις обозначает вооружённые силы; «войска» — ясный и достаточно широкий русский эквивалент.
- source_word: αἱ πορευθεῖσαι τῷ βασιλεῖ μετʼ αὐτοῦ
  choice: и с ним войска, ходившие с царём
  rationale: Формулировка сохраняет оба элемента трудного греческого оборота — связь войск с царём и их пребывание «с ним», — не пытаясь окончательно разрешить неясное синтаксическое соотношение местоимения и дательного падежа.
- source_word: ζητεῖ
  choice: стремится
  rationale: Настоящее время передаёт продолжающееся намерение; «стремится» выражает целенаправленную попытку, не утверждая, что цель уже достигнута.
- source_word: παραλαβεῖν
  choice: взять в свои руки
  rationale: В контексте борьбы за власть παραλαμβάνω означает принять или захватить руководство; русский оборот естественно передаёт переход контроля.
- source_word: τὰ τῶν πραγμάτων
  choice: управление делами
  rationale: Греческая идиома обозначает ведение или руководство делами вообще; перевод сохраняет широкий административно-политический смысл.
