  text: And part of the king’s camp spread out over the high mountains[a], and some over the lowlands; and they advanced securely and in formation.
translation:
  language: ru
  text: Часть царского войска развернулась на высоких горах, а некоторые — в низинах[a]; они двигались безопасно и в строю.
