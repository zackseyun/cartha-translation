lexical_decisions:
- source_word: ἐξετάθη
  choice: растянулась
  rationale: Аорист пассивного залога передаёт размещение или развёртывание части войска на протяжённой местности; «растянулась» естественно сочетается с распределением сил по разным высотам.
- source_word: μέρος τι
  choice: часть
  rationale: Неопределённое местоимение указывает на некоторую, точно не названную часть; по-русски достаточно естественного «часть».
- source_word: παρεμβολῆς τοῦ βασιλέως
  choice: царского войска
  rationale: В военном повествовании παρεμβολή может обозначать не только лагерь, но и расположившуюся лагерем армию. Поскольку далее описано движение людей, «войско» яснее передаёт подразумеваемый субъект.
- source_word: ἐπὶ τὰ ὑψηλὰ ὄρη
  choice: по высоким горам
  rationale: ἐπί с винительным обозначает распространение по местности; перевод сохраняет прямое упоминание высоких гор.
- source_word: τινες ἐπὶ τὰ ταπεινά
  choice: другие отряды — по низинам
  rationale: Субстантивированное ταπεινά обозначает низкие места в противопоставлении высоким горам. «Другие отряды» естественно выражает подразумеваемые группы людей, не превращая τινες в неопределённое «некоторые» без существительного.
- source_word: ἤρχοντο
  choice: они продвигались
  rationale: Имперфект описывает продолжавшееся движение войска; «продвигались» передаёт целенаправленное военное передвижение.
- source_word: ἀσφαλῶς
  choice: уверенно
  rationale: В контексте организованного наступления наречие может указывать на движение без опасения и помех; «уверенно» звучит естественно, не сводя смысл только к физической безопасности.
- source_word: τεταγμένως
  choice: стройными рядами
  rationale: Наречие от τάσσω указывает на упорядоченное военное построение; русское выражение ясно и наглядно передаёт движение в строю.
