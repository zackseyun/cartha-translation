lexical_decisions:
- source_word: ἀνέστησαν αὐτῷ εἰς πόλεμον
  choice: они выступили против него на войну
  rationale: Оборот передаёт организованное вооружённое выступление против него; «выступили против него на войну» сохраняет образ исходного глагола и военный смысл выражения.
- source_word: ἔφυγεν
  choice: он бежал
  rationale: 'Прямо передаёт значение глагола: обращённое в бегство отступление, а не просто уход или спасение.'
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: ушёл оттуда
  rationale: Естественно и точно обозначает удаление из названного места, сохраняя указательное «оттуда».
- source_word: μετὰ λύπης μεγάλης
  choice: в великой печали
  rationale: λύπη допускает значения печали, скорби и душевного огорчения; выбранная формулировка близка греческому тексту и соответствует достоинству повествования.
- source_word: ἀποστρέψαι εἰς Βαβυλῶνα
  choice: чтобы возвратиться в Вавилон
  rationale: Инфинитив естественно понимается как указание цели ухода. «Возвратиться» сохраняет смысл движения назад, а εἰς передаётся направительным «в».
