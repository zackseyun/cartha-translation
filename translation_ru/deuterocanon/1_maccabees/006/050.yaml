  yaml_path: translation/deuterocanon/1_maccabees/006/050.yaml
  text: And the king captured Bethsura[b][a], and he stationed a garrison there to guard it.
translation:
  language: ru
  text: И царь овладел Бетсурой[a] и поставил там гарнизон, чтобы удерживать её[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взял Бетсуру»; «захватил Бетсуру». Греческий глагол обозначает овладение городом и установление над ним контроля.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы охранять её». Греческое слово может означать как охрану города, так и его удержание под контролем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελάβετο
  choice: овладел
  rationale: В военном контексте глагол означает взятие места под контроль; «овладел» естественно передаёт успешный захват укреплённого города, сохраняя при этом более общее значение греческого слова.
- source_word: ὁ βασιλεύς
  choice: царь
  rationale: Прямой и естественный перевод титула без подстановки имени из контекста.
- source_word: τὴν Βεθσούραν
  choice: Бетсурой
  rationale: Передаёт греческую форму топонима Βεθσούρα и не гармонизирует её с еврейской формой Бет-Цур.
- source_word: ἐπέταξεν
  choice: поставил
  rationale: В сочетании с φρουράν глагол указывает на размещение или назначение военной силы; «поставил гарнизон» звучит естественно по-русски.
- source_word: φρουράν
  choice: гарнизон
  rationale: Военная сила, оставленная в захваченном городе для его удержания, точнее всего обозначается словом «гарнизон».
- source_word: τηρεῖν αὐτήν
  choice: чтобы удерживать её
  rationale: В данном военном контексте τηρεῖν выражает задачу сохранять контроль над городом; «удерживать» точнее передаёт эту функцию, чем общее «охранять».
