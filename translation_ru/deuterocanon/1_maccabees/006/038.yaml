  source_fidelity: Перевод точно передаёт расположение оставшейся конницы по обеим сторонам лагеря. «Всадники» обоснованно эксплицирует носителей двух греческих причастий при собирательном «конница». «Потрясали оружием» удачно передаёт угрожающее κατασείοντες с естественным для русского подразумеваемым объектом. Передача καταφρασσόμενοι как «смыкали ряды» является осторожным контекстуальным решением для трудного слова и не вносит догматических или исторически неоправданных деталей.
