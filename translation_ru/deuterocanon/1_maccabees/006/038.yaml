  yaml_path: translation/deuterocanon/1_maccabees/006/038.yaml
  text: And he stationed the remaining cavalry on both sides[a], at the two flanks of the camp[b], brandishing and fully armed in the phalanxes.
translation:
  language: ru
  text: Остальную конницу он поставил по обеим сторонам, на двух флангах лагеря; всадники потрясали оружием[a] и смыкали ряды в фалангах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «размахивали оружием». Греческое слово подразумевает угрожающее потрясание или размахивание, но его объект прямо не назван.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выстраивались в фаланги»; греческое слово здесь трудно для истолкования и, вероятно, обозначает уплотнение либо построение боевых рядов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ἐπίλοιπον ἵππον
  choice: остальную конницу
  rationale: В военном контексте ἵππος может собирательно обозначать конницу; такой перевод естественен по-русски и представляет её как единое подразделение.
- source_word: ἔνθεν καὶ ἔνθεν
  choice: по обеим сторонам
  rationale: Оборот обозначает размещение с той и другой стороны, а не беспорядочное расположение.
- source_word: ἐπὶ τὰ δύο μέρη τῆς παρεμβολῆς
  choice: на двух флангах лагеря
  rationale: παρεμβολή здесь означает военный лагерь, а τὰ δύο μέρη — две его стороны; «фланги» естественно передаёт тактический смысл.
- source_word: κατασείοντες
  choice: потрясали оружием
  rationale: Причастие выражает угрожающее размахивание или потрясание; подразумеваемый объект в русском тексте уточнён как оружие.
- source_word: καταφρασσόμενοι
  choice: смыкали ряды
  rationale: В данном тактическом контексте слово, вероятно, описывает уплотнение или выстраивание боевого порядка; перевод сохраняет оттенок действия, не сводя его однозначно к вооружённости.
- source_word: ἐν ταῖς φάλαγξιν
  choice: в фалангах
  rationale: Сохранён конкретный эллинистический военный термин, а не более общее «в боевых рядах».
