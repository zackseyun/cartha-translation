lexical_decisions:
- source_word: ἀπαγγέλλων τις
  choice: вестник и сообщил
  rationale: Греческая конструкция буквально означает «некто, сообщая»; по-русски естественнее передать лицо как «вестник», а действие — личной формой глагола.
- source_word: εἰς τὴν Περσίδα
  choice: в Персию
  rationale: При глаголе движения εἰς обозначает место, куда пришёл вестник; современное русское название — «Персия».
- source_word: αἱ παρεμβολαί
  choice: войска
  rationale: παρεμβολή может означать «лагерь» или находящееся в нём войско; здесь множественное число обозначает военные соединения, которые отправились в поход и были разбиты.
- source_word: γῆν Ἰούδα
  choice: землю Иуды
  rationale: Сохранена греческая формулировка с личным именем Иуда, обозначающая Иудейскую землю.
- source_word: τετρόπωνται
  choice: разбиты
  rationale: Перфект пассивной формы τρέπω в военном контексте означает, что войска обращены в бегство, разгромлены; «разбиты» кратко передаёт поражение и его наличный результат.
