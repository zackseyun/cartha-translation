base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/048.yaml
  text: And from the king’s camp they went up to meet them at Jerusalem[a], and the king encamped in Judea and at Mount Zion.
translation:
  language: ru
  text: Из царского лагеря[a] они поднялись им навстречу в Иерусалим, а царь расположился лагерем в Иудее, на горе Сион.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стана».'
    reason: Лексическая альтернатива для греческого παρεμβολή в военном контексте; «лагерь» также согласован с передачей родственного глагола далее в стихе.
lexical_decisions:
- source_word: παρεμβολῆς
  choice: стана
  rationale: В военном контексте слово обозначает стан или лагерь. «Стан» сохраняет повествовательную торжественность и военный смысл, оставаясь понятным современному читателю.
- source_word: ἀνέβησαν
  choice: поднялись
  rationale: Передаёт буквальное движение вверх и традиционное представление о восхождении к Иерусалиму, не добавляя не выраженного прямо значения «выступили в поход».
- source_word: εἰς συνάντησιν αὐτῶν
  choice: навстречу им
  rationale: Естественно передаёт греческий оборот о движении для встречи, не уточняя, была ли встреча мирной или враждебной.
- source_word: εἰς Ἰερουσαλήμ
  choice: к Иерусалиму
  rationale: Предлог εἰς прежде всего выражает направление; русский вариант сохраняет направленность движения, не превращая её без необходимости в указание места «у Иерусалима».
- source_word: παρενέβαλεν
  choice: расположился лагерем
  rationale: В военном повествовании глагол означает разбить или расположить лагерь. Выбран естественный современный оборот.
- source_word: Ἰουδαίαν
  choice: Иудее
  rationale: Здесь Ἰουδαία обозначает географическую область Иудею.
- source_word: ὄρος Σιών
  choice: горы Сион
  rationale: Традиционная и прозрачная передача топонима; конструкция с «у» естественно соответствует второму εἰς в контексте размещения лагеря.
