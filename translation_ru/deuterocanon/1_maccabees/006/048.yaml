  to: Из царского лагеря[a] они поднялись им навстречу в Иерусалим, а царь расположился лагерем в Иудее, на горе Сион.
  rationale: Внесены минимальные правки для более прямой передачи направительного εἰς при Иерусалиме и обозначения горы Сион как места лагеря, а также для современного и терминологически последовательного военного словоупотребления. Неоднозначность местоимений и характер предполагаемой встречи сохранены.
