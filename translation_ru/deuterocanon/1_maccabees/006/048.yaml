    issue: «у горы Сион»
    rationale: Оборот обозначает местонахождение возле горы и тем самым вносит пространственное уточнение, которого греческое εἰς ὄρος Σιών не требует. «На горе Сион» лучше сохраняет обозначение места лагеря.
  - severity: low
    issue: «к Иерусалиму»
    rationale: 'При εἰς Ἰερουσαλήμ предпочтительнее «в Иерусалим»: это прямее передаёт направленность к городу и не создаёт впечатления, что движение остановилось лишь у него.'
  - severity: low
    issue: 'Формулировка примечания «далее буквально: „разбил лагерь“»'
    rationale: Это не буквальная, а возможная идиоматическая передача глагола. Примечание следует ограничить реальной лексической альтернативой, не заявляя буквальность.
  revised_text: Из царского лагеря[a] они поднялись им навстречу в Иерусалим, а царь расположился лагерем в Иудее, на горе Сион.
