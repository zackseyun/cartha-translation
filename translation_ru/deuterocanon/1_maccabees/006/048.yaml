review_pass:
  verdict: revise
  source_fidelity: В целом переданы военное значение παρεμβολή/παρεμβάλλω, движение «поднялись» и неуточнённые референты местоимений. Однако «у горы Сион» ослабляет второе εἰς до положения вблизи горы, тогда как текст связывает царское расположение лагерем с горой Сион как местом. «В Иерусалим» точнее передаёт направленность εἰς Ἰερουσαλήμ, чем «к Иерусалиму».
  naturalness: «Царский лагерь» и «расположился лагерем» естественны для современного литературного исторического повествования. «Поднялись им навстречу в Иерусалим» сохраняет намеренную краткость и не добавляет характера встречи.
  terminology: «Лагерь» последовательно передаёт военный образ существительного παρεμβολή и глагола παρεμβάλλω. «Иудея» и «гора Сион» — нормативные передачи географического названия и топонима.
  issues:
