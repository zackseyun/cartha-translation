  yaml_path: translation/deuterocanon/1_maccabees/006/059.yaml
  text: and let us establish for them to walk according to their own laws[a], as before; for it was because of their laws, which we set aside[b], that they became angry and did all these things.
translation:
  language: ru
  text: И установим для них возможность жить по своим законам[a], как прежде. Ведь именно из-за своих законов, которые мы упразднили[b], они разгневались и сделали всё это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступать согласно своим установлениям (обычаям)». Греческое выражение буквально означает «ходить по своим законам», то есть строить жизнь в соответствии с ними.'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол буквально означает «рассеяли» или «разрушили»; здесь имеется в виду, что их законы и связанные с ними обычаи были отменены, подавлены или расстроены.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσωμεν
  choice: установим
  rationale: 'Аорист конъюнктива в побудительной конструкции выражает предложение: «установим». Здесь речь идёт об установлении порядка, позволяющего им вновь следовать своим законам.'
- source_word: τοῦ πορεύεσθαι
  choice: чтобы они жили по
  rationale: Буквально глагол означает «идти, ходить», но в сочетании с законами идиоматически говорит об устроении жизни в соответствии с ними. «Жили по» естественно передаёт этот смысл по-русски.
- source_word: τοῖς νομίμοις αὐτῶν
  choice: по своим законам
  rationale: νομίμοις может означать законы, установления или обычаи. В данном контексте речь идёт об иудейских религиозно-правовых установлениях; «законы» ясно передаёт основной смысл.
- source_word: ὡς τὸ πρότερον
  choice: как прежде
  rationale: Прямое и естественное обозначение восстановления прежнего положения.
- source_word: χάριν
  choice: именно из-за
  rationale: Послелог выражает причину. Частица «именно» естественно подчёркивает вынесенную вперёд причинную конструкцию греческого текста.
- source_word: διεσκεδάσαμεν
  choice: мы упразднили
  rationale: Буквальное значение связано с рассеиванием или разрушением целостности; применительно к законам глагол означает их устранение либо подавление. «Упразднили» кратко и ясно передаёт практический результат, а сноска сохраняет образ и менее категоричные варианты.
- source_word: ὠργίσθησαν
  choice: они разгневались
  rationale: Точная литературная передача наступившего гнева без чрезмерного усиления.
- source_word: ἐποίησαν ταῦτα πάντα
  choice: сделали всё это
  rationale: Естественная русская итоговая формула, сохраняющая обобщающий охват πάντα.
