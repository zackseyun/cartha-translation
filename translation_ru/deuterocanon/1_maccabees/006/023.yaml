lexical_decisions:
- source_word: κρίσιν
  choice: суд
  rationale: Сохраняет широкий юридический смысл греческого слова и не уточняет искусственно, идёт ли речь о судебном решении, правосудии или приговоре; переданный текст начинается с середины фразы.
- source_word: ἐκδικήσεις
  choice: отомстишь за
  rationale: Передаёт смысл воздаяния за причинённое зло; возможность значения «добьёшься справедливости для» отмечена в сноске.
- source_word: τοὺς ἀδελφοὺς ἡμῶν
  choice: наших братьев
  rationale: Прямо сохраняет родственный термин; в данном контексте он также может обозначать соплеменников или соратников.
- source_word: εὐδοκοῦμεν
  choice: мы согласны
  rationale: В контексте политической лояльности глагол выражает благосклонное согласие или готовность; «согласны» естественно звучит по-русски и не преувеличивает эмоциональный оттенок.
- source_word: δουλεύειν
  choice: служить
  rationale: Здесь речь идёт о подчинении и верности царю, поэтому «служить» уместнее буквального «быть рабами».
- source_word: τῷ πατρί σου
  choice: твоему отцу
  rationale: Прямое соответствие греческому выражению без контекстуального расширения.
- source_word: πορεύεσθαι τοῖς ὑπʼ αὐτοῦ λεγομένοις
  choice: жить по его словам
  rationale: Естественно передаёт идиоматический смысл поведения в соответствии со сказанным, сохраняя «слова» вместо более узкого толкования «повеления».
