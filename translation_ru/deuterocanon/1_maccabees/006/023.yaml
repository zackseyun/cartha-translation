  source_fidelity: Перевод верно сохраняет фрагментарное начало, юридически широкий смысл κρίσιν, личное местоимение во 2-м лице в ἐκδικήσεις, а также политически-вассальный смысл δουλεύειν. «Отомстишь за наших братьев» допустимо, и альтернативное значение глагола добросовестно отмечено. Для πορεύεσθαι τοῖς ὑπʼ αὐτοῦ λεγομένοις предпочтительнее передать следование сказанному, а не «жить по словам», поскольку последнее в русском несколько менее точно и стилистически расплывчато.
  naturalness: «Мы согласны служить» возможно, но «Мы готовы служить» естественнее передаёт εὐδοκοῦμεν в контексте заявленной лояльности. «Поступать согласно тому, что он говорит» — современное литературное и ясное выражение, сохраняющее незаданную словом греческого текста степень обязательности сказанного.
