lexical_decisions:
- source_word: ἐπέδραμεν αὐτῷ
  choice: устремился на него
  rationale: Глагол передаёт стремительный наступательный бросок, а местоимение сохраняет явно выраженный объект действия; формулировка естественна для военного повествования.
- source_word: θράσει
  choice: смело
  rationale: Дательный падеж выражает образ действия; «смело» кратко и точно передаёт дерзновенную решимость.
- source_word: εἰς μέσον τῆς φάλαγγος
  choice: в самую середину фаланги
  rationale: «Фаланга» сохраняет конкретный военный образ греческого текста, а «самую» естественно подчёркивает значение μέσον.
- source_word: ἐθανάτου
  choice: поражая насмерть
  rationale: Имперфект обозначает продолжавшееся или повторявшееся действие. Деепричастная конструкция связывает его с броском, не ослабляя буквального значения «убивал».
- source_word: δεξιὰ καὶ εὐώνυμα
  choice: направо и налево
  rationale: Это естественное русское соответствие устойчивому обозначению действий по обе стороны.
- source_word: ἐσχίζοντο
  choice: ряды расступались
  rationale: Буквально глагол означает «разделялись, рассекались». В данном военном контексте подразумеваются люди или строй; «ряды расступались» ясно передаёт картину, не уточняя причину сверх текста.
- source_word: ἀπʼ αὐτοῦ
  choice: перед ним
  rationale: Контекстуально выражение описывает, как строй раскрывался по мере его продвижения; «перед ним» идиоматично передаёт пространственное отношение.
- source_word: ἔνθα καὶ ἔνθα
  choice: в обе стороны
  rationale: Выражение буквально указывает на разделение «туда и сюда»; в сочетании с предшествующим «направо и налево» речь идёт о расхождении по обе стороны.
