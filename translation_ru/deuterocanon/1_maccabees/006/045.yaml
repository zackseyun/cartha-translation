    issue: «Ряды расступались» смягчает ἐσχίζοντο.
    rationale: Греческий пассивный имперфект изображает строй как разделяемый или рассекаемый; русское «расступались» может означать, что воины сами уступали дорогу. «Рассекались» сохраняет более сильный и нейтральный образ исходника.
  - severity: low
    issue: Сочетание «устремился на него, в самую середину фаланги» стилистически неровно.
    rationale: После «на него» второе обстоятельство направления воспринимается как присоединённое с запинкой. Упрощение порядка слов делает фразу естественнее, не изменяя синтаксических отношений греческого текста.
