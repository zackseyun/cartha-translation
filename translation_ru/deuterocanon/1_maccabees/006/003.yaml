base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/003.yaml
  text: And he came and sought to take the city and plunder it[a], but he was not able, because the plan became known to those from the city.
translation:
  language: ru
  text: И он пришёл и пытался захватить город и разграбить его, но не смог, потому что его замысел[a] стал известен жителям города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это дело»; также возможно: «его намерение». Греческое λόγος может означать слово, сообщение, дело или замысел; здесь речь, по-видимому, о ставшем известным намерении захватить и разграбить город.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβεῖν
  choice: захватить
  rationale: В военном контексте глагол означает овладеть городом; «захватить» ясно и естественно передаёт этот смысл.
- source_word: προνομεῦσαι
  choice: разграбить
  rationale: Глагол обозначает взятие добычи, разорение и грабёж; «разграбить» точно передаёт предполагаемое действие над городом.
- source_word: ἐζήτει
  choice: пытался
  rationale: Буквально глагол означает «искал, стремился»; в сочетании с инфинитивами современное русское «пытался» естественно выражает намеренную, но неудавшуюся попытку.
- source_word: οὐκ ἠδυνάσθη
  choice: не смог
  rationale: Кратко и естественно передаёт выраженную в греческом невозможность осуществить намерение.
- source_word: ἐγνώσθη
  choice: стал известен
  rationale: 'Сохраняет пассивное значение: замысел сделался известным, без уточнения того, каким образом о нём узнали.'
- source_word: ὁ λόγος
  choice: его замысел
  rationale: В данном повествовательном контексте λόγος, вероятнее всего, обозначает задуманное предприятие или намерение царя. Притяжательное «его» естественно указывает на действующее лицо, хотя в греческом оно подразумевается контекстом.
- source_word: τοῖς ἐκ τῆς πόλεως
  choice: жителям города
  rationale: Буквально — «тем, кто из города»; по контексту речь идёт о жителях или защитниках города. «Жителям города» звучит естественно и не сужает группу до воинов.
