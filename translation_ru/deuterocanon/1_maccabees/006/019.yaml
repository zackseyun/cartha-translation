lexical_decisions:
- source_word: ἐλογίσατο
  choice: решил
  rationale: Средняя форма здесь передаёт обдуманное и твёрдое намерение; «решил» естественно выражает это по-русски.
- source_word: ἐξᾶραι
  choice: искоренить их
  rationale: Инфинитив обозначает решительное, насильственное устранение. «Искоренить» сохраняет сильный смысл, не уточняя способ уничтожения сверх греческого текста.
- source_word: ἐξεκκλησίασεν
  choice: созвал
  rationale: Глагол означает собрать или созвать людей; при дополнении «весь народ» русское «созвал» звучит естественно и точно.
- source_word: πάντα τὸν λαόν
  choice: весь народ
  rationale: Это прямое соответствие греческому выражению. Хотя в данном контексте речь, вероятно, идёт о собранных для войны людях, перевод не заменяет «народ» более узким словом «войско».
- source_word: τοῦ περικαθίσαι ἐπʼ αὐτούς
  choice: чтобы осадить их
  rationale: Артикулярный инфинитив выражает цель, а буквальное «сесть вокруг» в военном контексте является выражением осады. «Чтобы осадить» ясно и естественно передаёт смысл.
