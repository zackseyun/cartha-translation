  text: and that the temple in it was exceedingly rich[a], and that there were gold coverings there, and breastplates and weapons, which Alexander son of Philip, the Macedonian king, who first reigned over the Greeks, had left there.
translation:
  language: ru
  text: 'и что храм в нём был чрезвычайно богат: там находились золотые покрытия[a], панцири и оружие, оставленные Александром, сыном Филиппа, македонским царём, который первым воцарился над греками.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покрытия из золота». Греческое слово обозначает покрытия в широком смысле; точный вид этих предметов не указан.'
    reason: Сохраняет лексическую неопределённость καλύμματα χρυσᾶ, не приписывая греческому тексту отсутствующую синтаксическую неоднозначность.
lexical_decisions:
- source_word: ἱερὸν
  choice: храм
  rationale: В данном контексте слово обозначает городской храм или святилище; «храм» ясно и естественно передаёт смысл.
- source_word: πλούσιον σφόδρα
  choice: чрезвычайно богат
  rationale: Сохраняет усилительное значение σφόδρα и указывает на великое богатство храма.
- source_word: καλύμματα χρυσᾶ
  choice: золотые покрытия
  rationale: καλύμματα имеет общее значение покрытий; нейтральный перевод не уточняет форму предметов, не названную в греческом тексте.
- source_word: θώρακες
  choice: панцири
  rationale: Точно обозначает защитные доспехи для туловища и естественно звучит в историческом повествовании.
- source_word: ὅπλα
  choice: оружие
  rationale: В перечне военного снаряжения это ясный современный эквивалент.
- source_word: κατέλειπεν
  choice: оставленные
  rationale: Причастная конструкция по-русски естественно связывает перечисленные предметы с более ранним действием Александра.
- source_word: Ἀλέξανδρος ὁ τοῦ Φιλίππου
  choice: Александром, сыном Филиппа
  rationale: Прямо и естественно передаёт греческое отчество.
- source_word: ὁ βασιλεὺς ὁ Μακεδών
  choice: македонским царём
  rationale: Сохраняет и царский титул, и македонскую принадлежность Александра.
- source_word: ὃς ἐβασίλευσεν τοῖς Ἕλλησι πρῶτος
  choice: который первым воцарился над греками
  rationale: Передаёт πρῶτος и управление с дательным падежом, не исправляя и не разъясняя историческое утверждение текста.
