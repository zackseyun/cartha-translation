  text: And when the sun flashed on the golden shields, the mountains flashed from them and shone like torches of fire.
translation:
  language: ru
  text: Когда же солнце засияло на золотых щитах, от них заблистали горы и засветились, словно огненные факелы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιλβεν
  choice: засияло / заблистали
  rationale: 'Глагол описывает яркий блеск: сначала солнечный свет на металлических щитах, затем его отражение на горах. В русском повтор одного глагола звучал бы тяжеловесно, поэтому использованы близкие по смыслу глаголы.'
- source_word: χρυσᾶς ἀσπίδας
  choice: золотых щитах
  rationale: Прямое и естественное соответствие греческому выражению; определение «золотых» не уточняет, были ли щиты цельнозолотыми или покрыты золотом.
- source_word: τὰ ὄρη
  choice: горы
  rationale: Основное значение ὄρη; оно сохраняет масштаб и выразительность картины.
- source_word: ἀπʼ αὐτῶν
  choice: от них
  rationale: Сохраняет краткость и допускает естественно понятный в контексте смысл отражённого от щитов света.
- source_word: κατήγαζεν
  choice: засветились
  rationale: Передаёт озарение и исходящий свет, не усиливая образ сверх греческого текста.
- source_word: ὡς λαμπάδες πυρός
  choice: словно огненные факелы
  rationale: Естественный современный русский эквивалент яркого сравнения; буквальное «факелы огня» звучало бы неестественно.
