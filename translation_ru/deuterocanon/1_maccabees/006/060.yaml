translation:
  language: ru
  text: И это предложение понравилось царю и правителям[a], и он послал к ним, чтобы заключить мир[b], и они приняли[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это слово» либо «это дело понравилось царю и правителям». Греческое λόγος может обозначать высказанное предложение или обсуждаемое дело.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «он послал к ним заключить мир». В греческом тексте прямо не сказано, послал ли он вестников или послание.'
    reason: lexical_alternative
  - marker: c
    text: То есть они приняли мирное предложение или условия мира.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρεσεν
  choice: понравилось
  rationale: Передаёт одобрение царя и правителей естественным современным русским языком.
- source_word: ὁ λόγος
  choice: это предложение
  rationale: В дипломатическом контексте λόγος обозначает высказанное предложение или обсуждаемое дело; указательное «это» связывает его с предшествующей речью.
- source_word: ἐναντίον τοῦ βασιλέως καὶ τῶν ἀρχόντων
  choice: царю и правителям
  rationale: При ἤρεσεν оборот идиоматически указывает на тех, кому предложение понравилось; буквальное «перед царём» по-русски исказило бы синтаксическую связь.
- source_word: ἀρχόντων
  choice: правителям
  rationale: Сохраняет значение лиц, обладающих властью, не уточняя их должности сверх греческого текста.
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: он послал к ним
  rationale: 'Сохраняет неопределённость оригинала: не сказано прямо, были ли посланы вестники или послание.'
- source_word: εἰρηνεῦσαι
  choice: чтобы заключить мир
  rationale: Естественно передаёт дипломатическую цель посылки; формулировка не вводит специальных договорных подробностей.
- source_word: ἐπεδέξαντο
  choice: они согласились
  rationale: В контексте означает принятие мирного предложения; объект, как и в греческом, остаётся подразумеваемым.
