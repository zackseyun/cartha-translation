base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/057.yaml
  text: And they kept urging and pressing to depart[a]. And he said to the king and the leaders of the army and the men, “We are growing weaker day by day, and our food is scant, and the place where we are encamped is strong[b], and the affairs of the kingdom are pressing upon us.”
translation:
  language: ru
  text: 'И они торопили и настойчиво требовали уйти. Тогда он сказал царю, военачальникам и воинам: «С каждым днём мы слабеем[a], пищи у нас мало, место, где мы расположились лагерем, укреплено, а дела царства требуют нашего внимания[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «С каждым днём мы истощаемся»; греческий глагол может означать ослабевать, иссякать или приходить в изнеможение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дела царства лежат на нас»; то есть настоятельно требуют нашего внимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέσπευδον καὶ ἐπενύοντο
  choice: торопили и настойчиво требовали
  rationale: Два имперфекта передают продолжительное, усиленное побуждение к уходу; сочетание сохраняет накопительный характер греческой фразы.
- source_word: τοῦ ἀπελθεῖν
  choice: уйти
  rationale: Естественное современное выражение, подходящее для ухода войска, без излишне книжного оттенка слова «отбыть».
- source_word: Ἐκλείπομεν
  choice: мы слабеем
  rationale: Глагол может обозначать ослабление, истощение или убыль. «Слабеем» естественно звучит в контексте осады и не сводит смысл только к численности войска или запасам.
- source_word: ἡ τροφὴ ἡμῖν ὀλίγη
  choice: пищи у нас мало
  rationale: Прямой и современный перевод, ясно передающий нехватку пропитания.
- source_word: παρεμβάλλομεν
  choice: мы расположились лагерем
  rationale: Передаёт продолжающееся пребывание войска на стоянке.
- source_word: ὀχυρός
  choice: хорошо укреплено
  rationale: В военном контексте слово указывает на укреплённость и трудность овладения местом; это точнее простого «сильное» по-русски.
- source_word: ἐπίκειται ἡμῖν τὰ τῆς βασιλείας
  choice: дела царства требуют нашего внимания
  rationale: Естественно передаёт образ настоятельно лежащих на них государственных дел, сохраняя политико-административную широту выражения.
