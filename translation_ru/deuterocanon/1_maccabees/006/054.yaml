  yaml_path: translation/deuterocanon/1_maccabees/006/054.yaml
  text: And a few men were left in the sanctuary[a], because the famine had overpowered them; and they were scattered, each to his own place.
translation:
  language: ru
  text: И осталось в святилище[a] лишь несколько мужчин, потому что голод одолел их; и они рассеялись — каждый в своё место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в святом месте» или «в священных пределах». Буквально по-гречески: «в святых [местах/святынях]»; это храмовое выражение, обозначающее священную территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπελείφθησαν
  choice: осталось
  rationale: Пассивная форма ὑπολείπω описывает оставшийся малый остаток. Русское «осталось» естественно передаёт результат, не вводя прямо названного деятеля.
- source_word: ἐν τοῖς ἁγίοις
  choice: в святилище
  rationale: Субстантивированное множественное число среднего рода имеет здесь пространственный храмовый смысл и обозначает священную территорию; «в святилище» ясно и естественно передаёт этот смысл.
- source_word: ἄνδρες ὀλίγοι
  choice: лишь несколько мужчин
  rationale: ἄνδρες указывает именно на мужчин, а ὀλίγοι — на их малое число. Частица «лишь» подчёркивает ограниченность остатка, выраженную порядком и сочетанием слов.
- source_word: κατεκράτησεν αὐτῶν ὁ λιμός
  choice: голод одолел их
  rationale: κατακρατέω означает взять верх, подчинить своей силе. «Одолел» сохраняет образ голода как силы, возобладавшей над людьми.
- source_word: ἐσκορπίσθησαν
  choice: они рассеялись
  rationale: Русская возвратная форма естественно передаёт итоговое рассредоточение, соответствуя греческому пассиву без предположения о конкретном внешнем деятеле.
- source_word: ἕκαστος εἰς τὸν τόπον αὐτοῦ
  choice: каждый в своё место
  rationale: «Место» сохраняет широкое значение τόπος; перевод «домой» был бы излишней конкретизацией.
theological_decisions:
- issue: Значение храмового выражения ἐν τοῖς ἁγίοις
  choice: в святилище
  alternative: в святом месте; в священных пределах
  rationale: Контекст требует пространственного, связанного с храмом понимания. Основной вариант звучит естественно, а примечание сохраняет неоднозначность греческого выражения.
translation_notes:
  register: Современный литературный русский язык; сдержанный повествовательный стиль. Сохранены храмовая неоднозначность выражения и сильная персонификация голода; архаизмы и конфессионально окрашенная терминология не вводятся.
