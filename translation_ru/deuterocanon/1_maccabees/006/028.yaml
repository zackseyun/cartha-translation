  text: And the king was enraged when he heard it, and he gathered all his Friends, the commanders of his forces, and those over the reins.
translation:
  language: ru
  text: Услышав это, царь разгневался и собрал всех своих Друзей[a], военачальников своего войска и тех, кто ведал поводьями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Друзья» — официальный титул высокопоставленных царских приближённых.
    reason: Предотвращает ошибочное понимание слова как обозначения обычных личных друзей.
  - marker: b
    text: 'Буквально: «тех, кто над поводьями». Точный характер этой должности неясен.'
    reason: Сохраняет буквальный образ и неопределённость греческого выражения, не отождествляя эту группу без достаточных оснований с начальниками конницы.
lexical_decisions:
- source_word: οἱ φίλοι αὐτοῦ
  choice: свои Друзья
  rationale: В эллинистическом придворном контексте «Друзья» — не просто личные приятели царя, а почётная группа приближённых; прописная буква обозначает титульное употребление.
- source_word: ἄρχοντας δυνάμεως αὐτοῦ
  choice: военачальники своего войска
  rationale: ἄρχοντες здесь означает начальствующих лиц, а δύναμις в данном военном контексте — войско или вооружённые силы.
- source_word: τοὺς ἐπὶ τῶν ἡνιῶν
  choice: начальники конницы
  rationale: Буквально выражение говорит о поставленных «над поводьями»; по контексту это руководители конницы. Смысл передан естественно, а буквальный образ сохранён в примечании.
