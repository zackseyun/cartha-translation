  text: And they divided the beasts among the units, and beside each elephant they stationed a thousand men in coats of mail, with bronze helmets on their heads, and five hundred picked horsemen assigned to each beast.
translation:
  language: ru
  text: И распределили зверей по боевым отрядам[a]. При каждом слоне[b] поставили по тысяче воинов, облачённых в кольчуги, с бронзовыми шлемами на головах, а к каждому зверю приставили по пятьсот отборных всадников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по подразделениям»; возможно также: «по фалангам». Греческое выражение здесь неоднозначно, но, вероятнее всего, обозначает части боевого строя.'
    reason: lexical_alternative
  - marker: b
    text: Греческий предлог может означать «при каждом слоне», «для каждого слона» или «у каждого слона».
    reason: lexical_alternative
lexical_decisions:
- source_word: διεῖλον
  choice: распределили
  rationale: Аорист διαιρέω здесь обозначает распределение слонов между частями боевого строя; «распределили» естественнее передаёт военную организацию, чем буквальное «разделили».
- source_word: τὰ θηρία
  choice: зверей
  rationale: Сохранено буквальное обозначение θηρία; из последующего упоминания слона ясно, о каких животных идёт речь.
- source_word: εἰς τὰς φάραγγας
  choice: по боевым отрядам
  rationale: Фраза в данном контексте трудна. Вероятен военный смысл — подразделения или части строя; «по боевым отрядам» понятно современному читателю и не навязывает узкий технический термин «фаланги».
- source_word: παρέστησαν
  choice: поставили
  rationale: В военном контексте глагол означает разместить или поставить при ком-либо; русское «поставили» звучит естественно и сохраняет пространственный смысл.
- source_word: ἐφʼ ἑκάστῳ ἐλέφαντι
  choice: при каждом слоне
  rationale: ἐπί с дательным допускает значения «при», «у», «для» и «на». «При каждом слоне» сохраняет неоднозначность тактической привязки и не создаёт впечатления, будто тысяча воинов находилась на слоне.
- source_word: τεθωρακισμένους ἐν ἁλυσιδωτοῖς
  choice: воинов в кольчугах
  rationale: Оборот описывает воинов, облачённых в плетёные доспехи; «в кольчугах» кратко и конкретно передаёт вид защиты.
- source_word: περικεφαλαῖαι χαλκαῖ
  choice: медными шлемами
  rationale: Прямое и традиционно понятное соответствие обозначению шлемов из χαλκός, то есть меди или медного сплава.
- source_word: διατεταγμένοι
  choice: приставили
  rationale: Причастие передаёт упорядоченное назначение всадников к каждому животному; в русском предложении оно естественно выражено личной глагольной формой.
- source_word: ἐκλελεγμένοι
  choice: отборных
  rationale: Совершенное причастие означает специально выбранных; «отборные» естественно характеризует выделенных для этой задачи всадников.
