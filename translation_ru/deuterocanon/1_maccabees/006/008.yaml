  yaml_path: translation/deuterocanon/1_maccabees/006/008.yaml
  text: And it happened that when the king heard these words[a], he was astonished and greatly shaken; and he fell upon his bed and became sick from grief, because it had not happened for him as he had planned.
translation:
  language: ru
  text: И когда царь услышал эти слова, он был поражён и сильно потрясён. Он упал на постель и от горя заболел, потому что всё вышло не так, как он задумал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что случилось не так, как он ожидал».'
    reason: Глагол ἐνθυμέομαι допускает оттенок как намерения или замысла, так и того, что царь держал в уме и ожидал.
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσεν
  choice: и когда услышал
  rationale: Греческий оборот вводит следующий эпизод повествования. По-русски простое «и когда» естественно передаёт переход, не воспроизводя тяжеловесно семитизированную конструкцию.
- source_word: ἐθαμβήθη
  choice: был поражён
  rationale: Глагол выражает сильное изумление или потрясение; контекст дурных вестей требует более широкого «поражён», не уточняющего сверх текста, был ли это ужас или удивление.
- source_word: ἐσαλεύθη σφόδρα
  choice: сильно потрясён
  rationale: Метафорическое σαλεύω обозначает внутреннее потрясение, а «сильно» сохраняет усилительное σφόδρα.
- source_word: ἔπεσεν ἐπὶ τὴν κοίτην
  choice: слёг
  rationale: В данном контексте русское «слёг» естественно передаёт, что царь оказался в постели вследствие потрясения и последующей болезни; буквальное «упал на постель» могло бы ошибочно подразумевать физическое падение.
- source_word: ἐνέπεσεν εἰς ἀρρωστίαν
  choice: заболел
  rationale: Идиоматично передаёт вхождение в состояние болезни без неестественной кальки «впал в болезнь».
- source_word: ἀπὸ τῆς λύπης
  choice: от горя
  rationale: Сохраняет причинное значение ἀπό и передаёт λύπη как глубокую скорбь из-за постигшей неудачи.
- source_word: οὐκ ἐγένετο αὐτῷ καθὼς ἐνεθυμεῖτο
  choice: всё вышло не так, как он задумал
  rationale: Естественная русская формулировка сохраняет безличный характер оборота и значение несбывшегося намерения; местоимение «всё» делает подразумеваемый исход событий ясным.
