  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для широкого круга читателей; эмоциональная последовательность — потрясение, постель, болезнь от горя — сохранена. Маркер сноски поставлен после всего допускающего иной перевод причинного оборота.
