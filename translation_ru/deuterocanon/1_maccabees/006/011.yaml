  yaml_path: translation/deuterocanon/1_maccabees/006/011.yaml
  text: And I said in my heart, ‘Into what distress I have come, and into a great סער? now I am in it—though I was kind and beloved.’
translation:
  language: ru
  text: 'И сказал я в сердце своём: «В какое бедствие и в какую великую бурю я попал — и теперь нахожусь в ней! Ведь я был добр и любим».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ
  choice: сказал я в сердце своём
  rationale: Сохраняет библейскую идиому внутренней речи и близость к греческой конструкции.
- source_word: Ἕως τίνος θλίψεως ἦλθον
  choice: до какого же бедствия я дошёл
  rationale: Ἕως τίνος передаёт восклицательную меру или крайнюю степень; θλῖψις здесь — тяжёлое бедствие, притеснение или скорбь.
- source_word: κλύδωνος μεγάλου
  choice: великой бури
  rationale: κλύδων буквально обозначает сильное волнение, прибой или бушующие волны; «буря» естественно передаёт метафору потрясения.
- source_word: ἐν ᾧ νῦν εἰμί
  choice: и теперь нахожусь в ней
  rationale: Относительное местоимение согласуется с ближайшим образом великой бури; русская формулировка сохраняет эту образность.
- source_word: χρηστὸς
  choice: добр
  rationale: χρηστός может означать добрый, благой, мягкий или благосклонный; «добр» уместно в характеристике отношения царя к людям.
- source_word: ἀγαπώμενος
  choice: любим
  rationale: Пассивное причастие настоящего времени означает «тот, кого любят»; краткое «любим» точно и естественно.
theological_decisions:
- issue: Логическая связь ὅτι с предыдущим признанием
  choice: Ведь я был добр и любим
  alternative: Потому что я был добр и любим
  rationale: ὅτι формально допускает причинное «потому что», однако в контексте воспоминание о прежней доброте и любви звучит как основание недоумения или контраст с нынешним бедствием. «Ведь» сохраняет связь, не навязывая жёсткой причинности и не вводя отсутствующее в греческом «хотя».
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранена внутренняя речь и морская метафора; синтаксис слегка упорядочен для естественного русского звучания без устранения смыслового напряжения в ὅτι.
