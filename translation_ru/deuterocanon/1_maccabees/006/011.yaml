  terminology: «Сказал я в сердце своём» оправданно сохраняет библейскую идиому. «Добр и любим» точно отражает χρηστός и ἀγαπώμενος, не добавляя толкования. «Ведь» является допустимым мягким соответствием ὅτι и не вносит отсутствующего в источнике противительного «хотя».
