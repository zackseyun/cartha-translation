  source_fidelity: 'Смысл в целом передан верно: внутренняя речь, бедствие, образ великого морского волнения, нынешнее пребывание в нём и прежняя характеристика говорящего сохранены. Однако «До какого же бедствия и великой бури я дошёл» неудачно объединяет два дополнения: греческие θλίψεως и κλύδωνος координированы как то, во что говорящий пришёл; по-русски естественнее повторить предлог и вопросительное слово. κλύδων — прежде всего мощная волна, вал, бурное волнение; «буря» допустима как естественная метафорическая передача, хотя несколько обобщает морской образ.'
