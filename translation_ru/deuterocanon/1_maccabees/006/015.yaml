lexical_decisions:
- source_word: διάδημα
  choice: диадема
  rationale: Греческое слово обозначает царскую головную повязку — знак царской власти; «диадема» точно передаёт историческую реалию и понятно современному читателю.
- source_word: στολὴν αὐτοῦ
  choice: свою царскую одежду
  rationale: В данном контексте στολή — особая одежда правителя. Возвратное «свою» естественно передаёт αὐτοῦ при совпадении обладателя с подлежащим, а «царскую» проясняет функцию одежды, не сводя её к конкретному фасону.
- source_word: δακτύλιον
  choice: перстень
  rationale: Слово означает кольцо; «перстень» уместен для предмета, выступающего знаком власти, но не добавляет отсутствующего в греческом тексте значения «печатка».
- source_word: τοῦ ἀγαγεῖν
  choice: чтобы тот привёл
  rationale: Инфинитив с τοῦ выражает цель. Местоимение «тот» естественно указывает на получателя регалий и устраняет неясность русского нулевого субъекта, не добавляя нового участника.
- source_word: Ἀντίοχον τὸν υἱὸν αὐτοῦ
  choice: его сына Антиоха
  rationale: Такой порядок слов естественен по-русски и сохраняет указание, что Антиох — сын подлежащего главного предложения.
