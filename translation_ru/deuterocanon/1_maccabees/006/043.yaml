base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/043.yaml
  text: And Eleazar the Avaran saw one of the beasts armored with royal breastplates[a], and it towered above all the beasts[b], and it appeared that the king was on it.
translation:
  language: ru
  text: Елеазар Аваран увидел одного из зверей[a], облачённого в царские доспехи. Он возвышался над всеми остальными зверями, и казалось, что на нём находится царь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «зверей»; из контекста ясно, что речь идёт о боевых слонах.'
    reason: cultural_note
  - marker: b
    text: 'Или: «создавалось впечатление, что на нём царь». Греческий текст говорит лишь о видимости, а не о достоверно установленном факте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεάζαρ ὁ Σαυαρὰν
  choice: Елеазар Аваран
  rationale: Обозначение передано как традиционное имя-прозвище этого персонажа; форма «Аваран» узнаваема в русской библейской традиции и сохраняет функцию имени собственного.
- source_word: ἐν τῶν θηρίων
  choice: одного из зверей
  rationale: Несмотря на грамматическую шероховатость греческой формы, контекст требует выделения одного животного из числа остальных. Слово θηρίον буквально передано как «зверь», а военный контекст пояснён в сноске.
- source_word: τεθωρακισμένον θώραξιν βασιλικοῖς
  choice: облачённого в царские доспехи
  rationale: Сочетание родственных слов θωρακίζω и θώραξ обозначает защитное вооружение. «Царские доспехи» естественно передаёт смысл и не создаёт неуклюжего повтора.
- source_word: ὑπεράγον
  choice: возвышался над
  rationale: Форма указывает на заметное превосходство животного над прочими, вероятнее всего по высоте или величине; «возвышался над» сохраняет наглядность без излишнего уточнения.
- source_word: ὤφθη ὅτι ἐν αὐτῷ ἐστιν ὁ βασιλεύς
  choice: казалось, что на нём находится царь
  rationale: Безличное «казалось» сохраняет выраженную в греческом видимость, а не достоверность. «На нём» естественно для всадника на слоне, тогда как буквальное «в нём» по-русски вводило бы в заблуждение.
