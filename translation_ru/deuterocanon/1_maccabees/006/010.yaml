  text: And he called all his friends and said to them[a], “Sleep departs from my eyes[c][b], and my heart faints from anxiety.”
translation:
  language: ru
  text: 'И созвал он всех своих друзей[a] и сказал им: «Сон уходит от моих глаз, и сердце моё изнемогает от тревоги[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех своих приближённых». При дворе словом «друзья» могли называть людей из ближайшего окружения правителя, в том числе советников.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение можно также перевести: «и я пал духом от тревоги» или «и сердце моё поникло от тревоги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: созвал
  rationale: Аорист καλέω здесь означает, что он призвал к себе сразу всех названных далее людей; «созвал» естественно передаёт это в русском повествовании.
- source_word: πάντας τοὺς φίλους αὐτοῦ
  choice: всех своих друзей
  rationale: Основное значение φίλοι — «друзья». В эллинистическом придворном контексте слово могло обозначать приближённых правителя, однако основной текст сохраняет прямое значение, а контекстуальная возможность отмечена в сноске.
- source_word: Ἀφίσταται ἀπὸ τῶν ὀφθαλμῶν μου ὁ ὕπνος
  choice: Сон уходит от моих глаз
  rationale: 'Сохранён образ оригинала: ἀφίσταται означает «отступает, удаляется, уходит», а настоящее время передаёт продолжающуюся бессонницу.'
- source_word: συνέπεπτον τῇ καρδίᾳ
  choice: сердце моё изнемогает
  rationale: Греческое выражение буквально описывает внутреннее падение или упадок в сердце. Русское «сердце изнемогает» естественно передаёт состояние душевного бессилия, не устраняя образ сердца.
- source_word: ἀπὸ τῆς μερίμνης
  choice: от тревоги
  rationale: μέριμνα означает тревогу, беспокойство или тягостную заботу; «тревога» соответствует тяжести переживания в данном контексте.
