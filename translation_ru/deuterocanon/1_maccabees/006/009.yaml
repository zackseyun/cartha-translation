  yaml_path: translation/deuterocanon/1_maccabees/006/009.yaml
  text: And he remained there for many days[a], because great grief came over him, and he thought that he was dying.
translation:
  language: ru
  text: И пробыл он там много дней, потому что великая скорбь вновь охватила его[a], и он подумал, что умирает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великая скорбь снова поднялась в нём». Греческий глагол подчёркивает, что скорбь возобновилась или вернулась.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: пробыл он там
  rationale: Передаёт длительное пребывание в данном месте естественным русским выражением, соответствующим контексту.
- source_word: ἡμέρας πλείους
  choice: много дней
  rationale: Выражение указывает на продолжительный срок; «много дней» сохраняет смысл и звучит естественно.
- source_word: ἀνεκαινίσθη ἐπ᾽ αὐτόν
  choice: вновь охватила его
  rationale: Пассивная форма ἀνακαινίζω указывает на возобновление или возвращение скорби; выбранное выражение естественно передаёт и повторность, и воздействие переживания на человека.
- source_word: λύπη μεγάλη
  choice: великая скорбь
  rationale: «Скорбь» точно и весомо передаёт λύπη, а «великая» прямо отражает μεγάλη и соответствует достоинству повествования.
- source_word: ἐλογίσατο
  choice: подумал
  rationale: Глагол может означать «рассудил», «счёл» или «заключил»; «подумал» сохраняет широту значения и не усиливает степень уверенности без необходимости.
- source_word: ὅτι ἀποθνήσκει
  choice: что умирает
  rationale: Настоящее время греческого глагола представляет смерть как уже происходящий процесс, а не только как будущее событие.
