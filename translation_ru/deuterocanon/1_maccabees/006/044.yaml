  language: ru
  text: Он отдал себя, чтобы спасти свой народ и приобрести себе вечное имя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν ἑαυτόν
  choice: отдал себя
  rationale: Близко передаёт добровольную самоотдачу героя и сохраняет лаконичность греческого выражения.
- source_word: τοῦ σῶσαι
  choice: чтобы спасти
  rationale: Инфинитив с артиклем выражает цель; современная русская конструкция с «чтобы» передаёт её ясно и естественно.
- source_word: τὸν λαὸν αὐτοῦ
  choice: свой народ
  rationale: Возвратное притяжательное местоимение естественно соотносит народ с подлежащим и избегает тяжеловесного «его народ».
- source_word: περιποιῆσαι αὐτῷ
  choice: приобрести себе
  rationale: Глагол может означать приобретение или снискание; «приобрести себе» сохраняет прямое значение и целевую направленность дательного αὐτῷ.
- source_word: ὄνομα αἰώνιον
  choice: вечное имя
  rationale: Формально и идиоматично передаёт идею непреходящей славы или памяти, не подменяя образ толкованием.
theological_decisions:
- issue: Возможный жертвенный оттенок выражения «отдал себя»
  choice: Сохранить буквальное «отдал себя»
  alternative: «пожертвовал собой»
  rationale: Греческий текст говорит о самоотдаче, но не употребляет специальной жертвенной лексики; буквальная передача сохраняет смысловую широту и не усиливает богословскую интерпретацию.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и понятная. Порядок целей сохранён, скрытые пояснения не добавлены.
