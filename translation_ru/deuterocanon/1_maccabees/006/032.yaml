translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Военная лексика ясна и естественна; не добавляется не выраженная в греческом мысль об отступлении. Маркер сноски поставлен после слова «крепости», к которому относится лексическая альтернатива.
