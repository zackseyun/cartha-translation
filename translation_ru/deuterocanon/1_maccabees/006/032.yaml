  text: And Judas moved away from the citadel and encamped at Beth-zachariah[a], opposite the king’s camp.
translation:
  language: ru
  text: Иуда выступил из крепости[a] и расположился лагерем у Веф-Захарии, напротив царского лагеря.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Акры»; Акра — укреплённая цитадель в Иерусалиме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: выступил
  rationale: Глагол обозначает отправление из некоторого места. В военном повествовании «выступил» звучит естественно и не привносит идеи отступления.
- source_word: ἄκρας
  choice: крепости
  rationale: Ἄκρα означает укреплённую цитадель или крепость; в 1 Маккавейской это также может быть название иерусалимской Акры. Основной текст сохраняет понятное нарицательное значение, а вариант с названием дан в сноске.
- source_word: παρενέβαλεν
  choice: расположился лагерем
  rationale: Военный глагол означает разбить лагерь или стать лагерем; выбран современный и ясный русский оборот.
- source_word: εἰς Βεθζαχαριά
  choice: у Веф-Захарии
  rationale: После глагола расположения лагерем εἰς естественно передаётся как указание места. «Веф-Захария» соответствует укоренившейся русской форме топонима.
- source_word: ἀπέναντι
  choice: напротив
  rationale: Точно передаёт пространственное положение перед другим лагерем или по другую сторону от него, не уточняя дистанцию.
- source_word: παρεμβολῆς
  choice: лагеря
  rationale: Существительное обозначает военный лагерь; краткое «лагерь» естественно в данном контексте.
- source_word: τοῦ βασιλέως
  choice: царского
  rationale: Прилагательное естественно передаёт греческий родительный падеж принадлежности.
