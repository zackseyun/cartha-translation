  source_fidelity: Начальное «их предавали смерти» точно передаёт пассивный имперфект ἐθανατοῦντο, а «разграбляли» — насильственное расхищение в διηρπάζοντο. «Простёрли руку ... на» сохраняет образ ἐξέτειναν χεῖρα ἐπί. Однако κληρονομίαι стоит во множественном числе и обозначает наследственные владения; собирательное «наше наследие» допустимо, но здесь неоправданно сглаживает множественное число и имущественно-территориальный оттенок. «Земли» для ὅρια возможно, но несколько преждевременно выбирает значение территорий; сноска должна яснее сохранять лексическую альтернативу без добавления смысла «вокруг них».
  naturalness: Текст в целом звучит естественно в современном литературном русском; начальная строчная буква уместна для продолжения контекста. «Наши наследственные владения» естественно в данном историко-политическом контексте и точнее, чем «наше наследие».
