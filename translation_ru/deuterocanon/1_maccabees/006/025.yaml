    text: 'Или: «все их пределы» или «все их территории». Греческое слово может означать как границы, так и определяемые ими территории.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθανατοῦντο
  choice: их предавали смерти
  rationale: Имперфект пассива передаёт продолжавшееся или повторявшееся действие в прошлом; выражение сохраняет пассивную форму и значение насильственного лишения жизни.
- source_word: κληρονομίαι ἡμῶν
  choice: наше наследие
  rationale: Собирательное единственное число по-русски естественно обозначает унаследованное родовое имущество или земли и сохраняет идею наследственного владения.
- source_word: διηρπάζοντο
  choice: разграбляли
  rationale: Глагол означает насильственно расхищать или захватывать; русская активная неопределённо-личная конструкция естественно передаёт греческий пассивный имперфект.
- source_word: ἐξέτειναν χεῖρα
  choice: простёрли руку на
  rationale: Сохранён образ враждебного посягательства; оборот понятен в современном литературном русском.
- source_word: ὅρια
  choice: земли
  rationale: Во множественном числе слово может обозначать не только границы, но и ограниченные ими области или территории; «земли» естественно сочетается с πάντα и оставляет территориальный смысл.
- source_word: αὐτῶν
  choice: их
  rationale: Местоимение сохранено буквально, поскольку его референт и точный характер связи с территориями не следует уточнять без достаточных оснований.
