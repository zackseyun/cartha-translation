  yaml_path: translation/deuterocanon/1_maccabees/006/007.yaml
  text: and they tore down the abomination that he had built upon the altar in Jerusalem[a], and they surrounded the sanctuary, as before, with high walls, and also Bethsura[b], his city.
translation:
  language: ru
  text: и разрушили мерзость, которую он воздвиг на жертвеннике в Иерусалиме[a], и, как прежде, окружили святилище высокими стенами, а также Бетсуру — его город[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечто отвратительное». Греческое слово имеет особую культовую окраску и обозначает нечто оскорбительное и неприемлемое в богослужении.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «Бетсуру — его город» в греческом тексте сжато. Местоимение «его», вероятно, относится к Иуде; возможно также понимание: город, находившийся под его властью.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθεῖλαν
  choice: разрушили
  rationale: Аорист καθαιρέω обозначает насильственное разрушение или снос сооружения; «разрушили» естественно передаёт физическое действие.
- source_word: τὸ βδέλυγμα
  choice: мерзость
  rationale: βδέλυγμα — нечто отвратительное, особенно в культовом контексте. «Мерзость» сохраняет библейскую и культовую окраску, не добавляя отсутствующих в греческом тексте слов.
- source_word: ᾠκοδόμησεν
  choice: воздвиг
  rationale: Глагол буквально означает «построил»; в отношении культового сооружения или предмета «воздвиг» звучит естественно и сохраняет идею сооружения.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: на жертвеннике
  rationale: ἐπί с винительным падежом здесь указывает на размещение поверх жертвенника; простой предлог «на» точен и естественен по-русски.
- source_word: τὸ ἁγίασμα
  choice: святилище
  rationale: В храмовом контексте ἁγίασμα обозначает священное место или храмовый комплекс; «святилище» передаёт это без излишнего уточнения.
- source_word: καθὼς τὸ πρότερον
  choice: как прежде
  rationale: Фраза указывает на восстановление прежнего состояния; краткий оборот сохраняет смысл и порядок мысли.
- source_word: ἐκύκλωσαν τείχεσιν ὑψηλοῖς
  choice: окружили ... высокими стенами
  rationale: Глагол означает «окружать», а дательный τείχεσιν ὑψηλοῖς обозначает средство; перевод близок к форме и смыслу греческого текста.
- source_word: τὴν Βεθσουρὰ πόλιν αὐτοῦ
  choice: Бетсуру — его город
  rationale: Сжатая греческая конструкция сохранена без устранения неясности местоимения αὐτοῦ; тире естественно оформляет приложение в русском тексте.
theological_decisions:
- issue: Передача βδέλυγμα в культово-полемическом контексте
  choice: мерзость
  alternative: нечто отвратительное
  rationale: «Мерзость» сохраняет устойчивую библейскую культовую окраску слова, но перевод не расширен до выражения «мерзость запустения», которого в этом стихе нет.
- issue: Референт местоимения αὐτοῦ в выражении πόλιν αὐτοῦ
  choice: 'сохранить буквально: «его город»'
  alternative: город, находившийся под его властью
  rationale: Вероятным референтом в контексте является Иуда, однако греческая форма сжата и не поясняет отношение; буквальная передача сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис сохраняет последовательность греческого сообщения, но пунктуация делает длинную конструкцию ясной для современного читателя.
