base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/031.yaml
  text: And they came through Idumea and encamped against Bethsura[a], and they fought for many days, and they made siege engines; but they came out and burned them with fire[b], and fought bravely.
translation:
  language: ru
  text: Они прошли через Идумею, расположились лагерем против Бетсуры и сражались много дней. Они соорудили осадные машины, но защитники вышли[a], сожгли их огнём и сражались мужественно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте глагол «вышел» стоит в единственном числе после глаголов во множественном числе; вероятнее всего, здесь собирательно имеются в виду защитники Бетсуры, совершившие вылазку.
    reason: textual_variant
  - marker: b
    text: 'Или: «доблестно»; греческое наречие буквально означает «по-мужски».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς Ἰδουμαίας
  choice: через Идумею
  rationale: διά с родительным падежом обозначает движение через область; «Идумея» — принятое русское название.
- source_word: παρενεβάλοσαν ἐπὶ Βεθσουρᾷ
  choice: расположились лагерем против Бетсуры
  rationale: Военный контекст и ἐπί с дательным указывают на враждебное расположение у осаждаемого города.
- source_word: ἐπολέμησαν ἐπʼ ἡμέρας πολλάς
  choice: сражались много дней
  rationale: Оборот выражает продолжительность; перевод естественен для современного русского повествования.
- source_word: μηχανὰς
  choice: осадные машины
  rationale: В контексте осады речь идёт о военных устройствах, а не о машинах вообще.
- source_word: ἔξηλθεν
  choice: защитники вышли
  rationale: В греческом стоит глагол единственного числа среди форм множественного числа; контекст подразумевает вылазку защитников Бетсуры. Добавление «защитники» делает подразумеваемого участника ясным, а сноска сохраняет грамматическую особенность источника.
- source_word: ἐνεπύρισαν αὐτοὺς ἐν πυρί
  choice: сожгли их огнём
  rationale: Сохраняется усиленная греческая формулировка; местоимение наиболее естественно относится к осадным машинам.
- source_word: ἀνδρωδῶς
  choice: мужественно
  rationale: Передаёт значение храбрости и сохраняет этимологический оттенок греческого наречия без архаичной тяжеловесности.
