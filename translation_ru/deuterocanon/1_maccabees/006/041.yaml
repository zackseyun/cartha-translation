lexical_decisions:
- source_word: ἐσαλεύοντο
  choice: содрогались
  rationale: Передаёт продолженное состояние сильного физического и душевного потрясения, выраженное имперфектом, не сужая смысл до одного лишь страха.
- source_word: φωνῆς πλήθους αὐτῶν
  choice: гул их множества
  rationale: В военном контексте φωνή обозначает совокупный слышимый шум огромной массы людей; «гул» естественно передаёт этот образ.
- source_word: ὁδοιπορίας τοῦ πλήθους
  choice: поступь множества
  rationale: ὁδοιπορία буквально связана с передвижением или шествием; «поступь» кратко и образно передаёт звук движения войска, не добавляя отсутствующей в тексте конкретики.
- source_word: συγκρουσμοὺς τῶν ὅπλων
  choice: лязг оружия
  rationale: Передаёт слышимое соударение военного снаряжения; «оружие» сохраняет более широкое значение ὅπλα, а «лязг» звучит естественно по-русски.
- source_word: παρεμβολή
  choice: стан
  rationale: В данном повествовании слово обозначает военный лагерь; «стан» сохраняет dignified повествовательный регистр и допускает восприятие лагеря вместе с расположенным в нём войском.
- source_word: μεγάλη σφόδρα καὶ ἰσχυρά
  choice: чрезвычайно велик и силён
  rationale: Сохраняет усиление σφόδρα и две отдельные характеристики — огромный размер и военную мощь.
