lexical_decisions:
- source_word: ἔτους πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: в сто пятидесятом году
  rationale: Родительная формула датировки естественно передаётся по-русски предложным оборотом; греческий порядок числительных означает 150-й год.
- source_word: ἐποίησεν
  choice: соорудил
  rationale: В данном военном контексте глагол обозначает изготовление или устройство сложных приспособлений; «соорудил» звучит естественно и не уточняет, сделал ли он их лично.
- source_word: ἐπʼ αὐτούς
  choice: против них
  rationale: Предлог ἐπί с винительным в контексте осады выражает направленность враждебного действия.
- source_word: βελοστασίεις
  choice: метательные орудия
  rationale: Термин обозначает устройства для метания снарядов; выбранное выражение сохраняет широту значения и не сводит его к одному виду, например катапультам.
- source_word: μηχανάς
  choice: осадные машины
  rationale: Хотя слово само по себе значит «машины, устройства», военный контекст указывает на инженерные средства для осады.
