lexical_decisions:
- source_word: μηχανὰς
  choice: осадные машины
  rationale: В военном контексте речь идёт о механических приспособлениях, применявшихся при осаде. «Осадные машины» естественно и точно передаёт смысл, не уточняя их вид.
- source_word: πρὸς
  choice: против
  rationale: В данном контексте предлог с винительным падежом выражает направленность против средств противника.
- source_word: ἐπολέμησαν
  choice: сражались
  rationale: Глагол обозначает ведение боя; «сражались» звучит естественно в русском повествовании и не добавляет отсутствующих в тексте деталей.
- source_word: ἡμέρας πολλάς
  choice: много дней
  rationale: Винительный падеж обозначает продолжительность времени; по-русски это естественно передаётся оборотом «много дней».
- source_word: καὶ αὐτοὶ
  choice: и они тоже
  rationale: Сочетание указывает, что оборонявшиеся, со своей стороны, также изготовили подобные устройства.
