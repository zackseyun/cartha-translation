base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/012.yaml
  text: 'But now I remember the evils that I did in Jerusalem: I took all the silver vessels and the gold vessels that were in it[a], and I sent orders to wipe out the inhabitants of Judah for nothing.'
translation:
  language: ru
  text: 'Но теперь я вспоминаю зло, которое совершил в Иерусалиме: я забрал все находившиеся в нём серебряные и золотые сосуды и послал людей, чтобы истребить жителей Иудеи без всякой причины.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιμνήσκομαι
  choice: я вспоминаю
  rationale: Настоящее время передаёт происходящее теперь осознание прошлого; «вспоминаю» естественно в современной русской речи.
- source_word: τῶν κακῶν
  choice: зло
  rationale: Субстантивированное «зло» сохраняет нравственную оценку поступков говорящего и по-русски звучит естественнее буквального множественного «злодеяния» в этой конструкции.
- source_word: πάντα τὰ σκεύη τὰ ἀργυρᾶ καὶ τὰ χρυσᾶ
  choice: все ... серебряные и золотые сосуды
  rationale: «Сосуды» — уместное обозначение храмовой утвари; определение «находившиеся в нём» отнесено ко всей группе.
- source_word: ἐξαπέστειλα τοῦ ἐξᾶραι
  choice: послал истребить
  rationale: Сохраняет глагол отправки и целевой инфинитив, не добавляя прямо не названное существительное «приказ»; «истребить» передаёт сильное значение полного устранения жителей.
- source_word: τοὺς κατοικοῦντας Ἰούδα
  choice: жителей Иудеи
  rationale: Естественная русская передача обозначения людей, живущих в области Иуда/Иудея.
- source_word: διὰ κενῆς
  choice: без всякой причины
  rationale: Передаёт идиоматический смысл необоснованности действия; «впустую» могло бы ошибочно означать лишь отсутствие результата.
theological_decisions:
- issue: Нравственная оценка действий Антиоха в его собственной речи
  choice: «зло, которое совершил»
  alternative: «бедствия, которые причинил» / «дурные поступки»
  rationale: Греческое κακά допускает широкий спектр значений, но в контексте признания говорящим своих поступков уместно сохранить прямую нравственную оценку, не усиливая её дополнительной богословской терминологией.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис остаётся близким к греческой последовательности признания: воспоминание, разграбление, попытка истребления. Название области передано традиционным русским «Иудея».'
