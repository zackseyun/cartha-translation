  yaml_path: translation/deuterocanon/1_maccabees/006/053.yaml
  text: But there was no food in the holy place[a], because it was the seventh year[b], and those who had escaped into Judea from the nations had eaten up the remnant of the supplies.
translation:
  language: ru
  text: Но в святилище не было пищи, потому что шёл седьмой год[a], а те, кто спасся от языческих народов и пришли в Иудею, съели остаток припасов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть субботний год — каждый седьмой год, когда землю не обрабатывали; этим объясняется нехватка пищи.
    reason: cultural_note
lexical_decisions:
- source_word: βρώματα
  choice: пища
  rationale: Широкое обозначение съестных запасов; «пища» естественно звучит и не вносит лишней конкретизации.
- source_word: ἐν τοῖς ἁγίοις
  choice: в святилище
  rationale: Субстантивированное множественное число буквально означает «в святых местах», но в контексте указывает на храмовое священное пространство; «в святилище» передаёт это ясно и достойно.
- source_word: διὰ τὸ ἕβδομον ἔτος εἶναι
  choice: потому что шёл седьмой год
  rationale: Сохраняет прямую формулировку греческого текста, не подменяя её истолкованием «субботний год».
- source_word: οἱ ἀνασωζόμενοι
  choice: те, кто спасся
  rationale: Причастие обозначает людей, которые избежали опасности и благополучно достигли Иудеи; «спасся» сохраняет возможный оттенок избавления, не уточняя способ.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: пришёл в Иудею
  rationale: Передаёт направленное движение внутрь области, выраженное εἰς, и естественно соединяется по-русски с указанием исходной точки.
- source_word: ἀπὸ τῶν ἐθνῶν
  choice: от языческих народов
  rationale: В иудейско-греческом контексте ἔθνη обозначает неиудейские народы; такой перевод понятнее буквального «от народов» и сохраняет этнический, а не сугубо территориальный смысл.
- source_word: κατέφαγον
  choice: съели
  rationale: Глагол означает полное потребление съестных запасов; сочетание с «остаток» уже передаёт исчерпанность и по-русски звучит естественно.
- source_word: τὸ ὑπόλιμμα τῆς παραθέσεως
  choice: остаток припасов
  rationale: ὑπόλιμμα — то, что осталось, а παράθεσις в данном контексте — отложенные или заготовленные припасы. Краткое выражение естественно для рассказа об осаде.
theological_decisions:
- issue: Следует ли прямо назвать седьмой год субботним годом
  choice: В основном тексте сохранено «седьмой год»
  alternative: «субботний год»
  rationale: Греческий текст говорит именно «седьмой год». Его исторический смысл пояснён в примечании, чтобы не заменять перевод толкованием.
- issue: Как передать ἐθνῶν в иудейском историческом контексте
  choice: «языческих народов»
  alternative: «народов»; «язычников»; «чужеземных народов»
  rationale: Выражение указывает на неиудейские народы. «Языческих народов» сохраняет множественное число и делает подразумеваемое противопоставление понятным без новозаветной конфессиональной нагрузки.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Синтаксис следует ходу греческой фразы, но перестроен там, где буквальный порядок слов был бы неестественен. Единственный маркер примечания [a] поставлен непосредственно после поясняемого выражения.
