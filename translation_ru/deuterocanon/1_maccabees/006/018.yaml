  yaml_path: translation/deuterocanon/1_maccabees/006/018.yaml
  text: He named him Eupator[a]. And those from the citadel were hemming Israel in around the sanctuary[b], seeking evil continually and serving as a support to the nations.
translation:
  language: ru
  text: Он дал ему имя Евпатор. А люди из крепости окружали Израиль вокруг святилища[a], постоянно замышляли зло и служили опорой для народов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вокруг святынь» или «вокруг святых мест»; буквально: «вокруг святых [мест/предметов]». Вероятно, имеется в виду храмовая территория.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «опорой для язычников».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ
  choice: дал ему имя
  rationale: Естественная русская передача греческого оборота, обозначающего наречение именем.
- source_word: Εὐπάτωρ
  choice: Евпатор
  rationale: Имя или почётное прозвание передано традиционной русской транслитерацией.
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: люди из крепости
  rationale: ἄκρα обозначает укреплённую цитадель в Иерусалиме; формулировка не добавляет отсутствующего в греческом указания на пол.
- source_word: συγκλείοντες ... κύκλῳ
  choice: держали ... в окружении
  rationale: Передаёт длительное действие — стеснение и блокирование со всех сторон — и учитывает κύκλῳ.
- source_word: τὸν Ἰσραὴλ
  choice: Израиль
  rationale: Сохранено собирательное единственное число исходного текста.
- source_word: κύκλῳ τῶν ἁγίων
  choice: у святилища
  rationale: По контексту τὰ ἅγια относится к храму или священной храмовой территории; краткое «святилище» естественно по-русски, а буквальная множественность отмечена в сноске.
- source_word: ζητοῦντες κακὰ
  choice: замышляли зло
  rationale: Передаёт устойчивую враждебную направленность выражения естественнее, чем буквальное «искали зло».
- source_word: διʼ ὅλου
  choice: постоянно
  rationale: Идиома выражает непрерывность или повторяемость в течение всего времени.
- source_word: στήριγμα τοῖς ἔθνεσιν
  choice: служили опорой для языческих народов
  rationale: στήριγμα означает опору или поддержку; τοῖς ἔθνεσιν здесь указывает на чужеземные народы, противопоставленные Израилю.
theological_decisions:
- issue: Передача ἔθνεσιν
  choice: языческие народы
  alternative: народы; язычники
  rationale: В данном этнополитическом контексте речь идёт о чужеземных неиудейских силах. «Языческие народы» ясно выражает это значение, не привнося специфически новозаветной богословской схемы.
- issue: Значение τῶν ἁγίων
  choice: святилище
  alternative: священная территория; святыни
  rationale: Контекст указывает на храмовый комплекс, однако греческая форма множественного числа допускает более широкое понимание; неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным, при этом собирательное «Израиль» и неоднозначность обозначения храмовой территории сохранены. Маркеры сносок размещены непосредственно при соответствующих выражениях.
