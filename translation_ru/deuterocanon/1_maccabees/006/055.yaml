base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/055.yaml
  text: And Lysias heard that Philip[a], whom King Antiochus had appointed while he was still alive to bring up Antiochus his son so that he might reign,
translation:
  language: ru
  text: И Лисий услышал, что Филипп, которому царь Антиох ещё при жизни поручил воспитать своего сына Антиоха, чтобы тот царствовал[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы тот стал царём». Греческий инфинитив βασιλεῦσαι может означать как царствование, так и вступление на престол.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямо передаёт аорист ἀκούω, который здесь вводит полученное известие.
- source_word: κατέστησεν
  choice: поручил
  rationale: В сочетании с инфинитивом ἐκθρέψαι глагол обозначает официальное возложение обязанности; по-русски «поручил воспитать» естественнее буквального «назначил воспитать».
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: ещё при жизни
  rationale: Кратко и ясно передаёт временное значение родительного самостоятельного оборота и указывает, что назначение было сделано при жизни царя Антиоха.
- source_word: ἐκθρέψαι
  choice: воспитать
  rationale: Передаёт выращивание и воспитание юного наследника, не сужая смысл до одного обучения.
- source_word: εἰς τὸ βασιλεῦσαι αὐτόν
  choice: чтобы тот царствовал
  rationale: Сохраняет целевое значение конструкции и не уточняет сверх греческого текста, идёт ли речь собственно о царствовании или о вступлении на престол.
- source_word: ὁ βασιλεὺς Ἀντίοχος
  choice: царь Антиох
  rationale: Естественная русская форма титула перед именем.
