  text: 'Они пошли к царю и сказали: «Доколе ты не сделаешь…?»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившийся греческий текст данного стиха в предоставленном источнике неполон и обрывается после слов «Доколе ты не сделаешь…?». Многоточие отражает обрыв источника, а не намеренное сокращение перевода.
    reason: textual_variant
