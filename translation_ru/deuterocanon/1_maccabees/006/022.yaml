    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: пошли
  rationale: Аорист депонентного πορεύομαι в повествовательном контексте естественно передаётся глаголом «пошли».
- source_word: πρὸς τὸν βασιλέα
  choice: к царю
  rationale: πρός с винительным обозначает движение к лицу; «к царю» — точная и естественная русская передача.
- source_word: Ἕως πότε
  choice: доколе
  rationale: Устойчивое вопросительное выражение жалобы на промедление; «доколе» сохраняет краткость, настойчивость и достоинство библейской речи.
- source_word: οὐ ποιήσεις
  choice: ты не будешь действовать
  rationale: ποιέω имеет широкое значение «делать, действовать». Поскольку сохранившийся текст обрывается и дополнение отсутствует, «действовать» передаёт требование вмешательства, не уточняя его содержания.
