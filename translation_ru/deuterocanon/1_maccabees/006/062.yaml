  text: And the king entered Mount Zion[a], and when he saw the fortification of the place[b], he broke the oath that he had sworn and gave orders to tear down the wall all around.
translation:
  language: ru
  text: Царь вошёл на гору Сион и, увидев укрепление этого места, нарушил клятву, которую дал, и приказал разрушить всю окружную стену.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Прямо передаёт повествовательный аорист εἰσέρχομαι и движение внутрь указанного места.
- source_word: ὁ βασιλεὺς
  choice: царь
  rationale: Обычное соответствие βασιλεύς в историческом повествовании.
- source_word: τὸ ὄρος Σιών
  choice: гора Сион
  rationale: Передаёт ὄρος и сохраняет традиционную русскую форму библейского топонима.
- source_word: τὸ ὀχύρωμα τοῦ τόπου
  choice: укрепление этого места
  rationale: ὀχύρωμα обозначает укрепление или укреплённое сооружение; нейтральное «укрепление» не уточняет его вид сверх греческого текста. Указательное «этого» естественно связывает место с только что названным Сионом.
- source_word: ἠθέτησεν
  choice: нарушил
  rationale: В сочетании с клятвой глагол означает пренебрежение обязательством или его попрание; «нарушил клятву» естественно по-русски и сохраняет нравственную весомость выражения.
- source_word: τὸν ὁρκισμὸν ὃν ὤμοσεν
  choice: клятву, которую дал
  rationale: Русское устойчивое сочетание «дать клятву» естественно передаёт как существительное ὁρκισμός, так и относительное придаточное ὃν ὤμοσεν, не создавая тяжеловесного повтора «поклялся клятвой».
- source_word: ἐνετείλατο
  choice: приказал
  rationale: Краткое и точное соответствие ἐντέλλομαι в военном повествовательном контексте.
- source_word: καθεῖλεν
  choice: разрушить
  rationale: Стену не просто повреждают, а сносят; русский инфинитив естественно зависит от «приказал» и передаёт результативный смысл καθαιρέω.
- source_word: τὸ τεῖχος κυκλόθεν
  choice: всю окружную стену
  rationale: τεῖχος — «стена», а κυκλόθεν указывает на стену по всему периметру. «Всю окружную стену» ясно выражает полный охват и звучит естественнее буквального «стену кругом».
theological_decisions:
- issue: Нравственная сила ἠθέτησεν применительно к клятве
  choice: нарушил клятву
  alternative: отменил клятву; пренебрёг клятвой
  rationale: Контекст говорит об отказе царя соблюдать данное под клятвой обязательство. «Нарушил» сохраняет нравственную оценку действия, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан плавным, без архаизмов; сохранена последовательность действий греческого текста.
