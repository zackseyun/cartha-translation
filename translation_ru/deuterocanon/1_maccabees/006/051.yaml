  register: Современный литературный русский язык с умеренно формальной исторической лексикой. Повтор слова «орудия» сохраняет ясность перечня, а кавычки при слове «скорпионы» обозначают специальный военный термин. Маркер сноски помещён непосредственно после поясняемого слова.
