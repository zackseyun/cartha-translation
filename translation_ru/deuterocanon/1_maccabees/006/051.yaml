  yaml_path: translation/deuterocanon/1_maccabees/006/051.yaml
  text: And he encamped against the sanctuary for many days[a], and there he set up missile-launchers and engines and fire-throwers and stone-throwers and scorpions, to shoot arrows and slingstones.
translation:
  language: ru
  text: Он много дней стоял лагерем против святилища и установил там метательные орудия, осадные машины, огнеметательные и камнеметательные орудия, а также «скорпионы»[a] для метания стрел и камней из пращей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть небольшие военные машины для метания стрел или других снарядов.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: стоял лагерем
  rationale: Глагол обозначает расположение лагерем. Военный контекст подразумевает осаду, но перевод не заменяет исходный образ более узким выражением «осаждал».
- source_word: ἐπὶ τὸ ἁγίασμα
  choice: против святилища
  rationale: ἐπί с винительным падежом при военном действии передаёт направленность и враждебное расположение против цели; ἁγίασμα здесь — святилище или храмовая территория.
- source_word: ἡμέρας πολλάς
  choice: много дней
  rationale: Естественная передача винительного длительности в современном русском языке.
- source_word: ἔστησεν
  choice: установил
  rationale: Глагол означает поставить или привести в установленное положение; «установил» естественно применительно к осадному оборудованию.
- source_word: βελοστασίσεις
  choice: метательные орудия
  rationale: Термин обозначает приспособления для пуска метательных снарядов. Обобщённый перевод не сужает значение до одних только стрел.
- source_word: μηχανὰς
  choice: осадные машины
  rationale: Общее слово «машины» в данном военном перечне относится к осадным устройствам; уточнение делает смысл понятным современному читателю, не определяя конкретный тип.
- source_word: πυροβόλα
  choice: огнеметательные орудия
  rationale: Сложное слово буквально обозначает устройства, метавшие огонь. Такая передача избегает современной ассоциации слова «огнемёт» с оружием, выбрасывающим струю горючей смеси.
- source_word: λιθοβόλα
  choice: камнеметательные орудия
  rationale: Буквально — устройства, метавшие камни. Перевод сохраняет значение и не навязывает конкретную реконструкцию вроде катапульты.
- source_word: σκορπίδια
  choice: «скорпионы»
  rationale: Это историческое название небольших метательных военных машин; кавычки и сноска предотвращают понимание слова как названия животных.
- source_word: εἰς τὸ βάλλεσθαι
  choice: для метания
  rationale: Конструкция с артиклевым инфинитивом выражает назначение или цель установленных орудий.
- source_word: βέλη
  choice: стрелы
  rationale: Хотя слово может обозначать метательные снаряды вообще, в сочетании с отдельным упоминанием пращевых камней здесь уместно более конкретное «стрелы».
- source_word: σφενδόνας
  choice: камни из пращей
  rationale: В перечне метаемых предметов слово указывает на пращевые снаряды; описательный перевод естественнее и понятнее, чем специальное «пращевые пули».
