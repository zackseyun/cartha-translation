  source_fidelity: Черновик верно передаёт участников, число павших и их принадлежность к царской стороне. Однако «приблизились в боевом строю» скорее описывает уже имеющийся строй при приближении, тогда как εἰς παράταξιν обозначает движение к боевому построению / построение для боя. Во втором употреблении παρεμβολή точнее передать как «лагерь», как и в английской контрольной версии; «царское войско» допустимо контекстуально, но менее точно передаёт то же слово.
  naturalness: Предлагаемая формулировка естественна для современного литературного русского и сохраняет краткий военный стиль повествования. «Пали» — устойчивая, неархаичная боевая формула.
  terminology: «Войско» в первом случае естественно передаёт сопровождавшую Иуду военную силу, а «царский лагерь» во втором сохраняет буквальный образ παρεμβολή и не устраняет возможную метонимию. «Выстроившись для боя» передаёт εἰς παράταξιν без излишней технической терминологии.
