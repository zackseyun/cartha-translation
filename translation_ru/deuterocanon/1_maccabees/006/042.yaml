lexical_decisions:
- source_word: ἤγγισεν
  choice: приблизились
  rationale: Глагол означает «приблизился, подошёл». В русском множественное число естественно согласуется с составным подлежащим «Иуда и его войско»; военный контекст передан без усиления смысла до прямого вступления в бой.
- source_word: παρεμβολὴ
  choice: войско
  rationale: В военном контексте слово может обозначать лагерь, стан или находящееся в нём войско. Здесь речь идёт о совместном движении и о павших людях, поэтому «войско» естественно передаёт метонимический смысл в обоих случаях.
- source_word: εἰς παράταξιν
  choice: в боевом строю
  rationale: παράταξις обозначает построение или расположение войск для боя. Эта формулировка ясно сохраняет военный образ и естественно сочетается с движением войска.
- source_word: ἔπεσαν
  choice: пало
  rationale: Сохранена обычная для описания сражения метафора «пасть», которая подразумевает гибель, но не заменяет образ более прямым «было убито».
- source_word: ἑξακισχίλιοι ἄνδρες
  choice: шесть тысяч человек
  rationale: «Человек» точно и естественно передаёт ἄνδρες при числительном в современном русском; принадлежность этих людей к войску ясна из контекста.
