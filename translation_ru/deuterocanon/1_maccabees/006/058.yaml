lexical_decisions:
- source_word: νῦν οὖν
  choice: Итак
  rationale: Передаёт вывод из предыдущего рассуждения и переход к предложению действовать; отдельное «теперь» в современном русском здесь избыточно.
- source_word: δῶμεν δεξιὰν
  choice: протянем… правую руку
  rationale: Сохраняет образ греческого выражения «дать правую руку» и естественно передаёт по-русски жест, означающий заверение в мире или союзе.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: этим людям
  rationale: Нейтрально и точно передаёт ἀνθρώποις; контекст не требует сужать значение до слова «мужчины».
- source_word: ποιήσωμεν ... εἰρήνην
  choice: заключим мир
  rationale: Естественное русское выражение для официального установления мирных отношений в военно-политическом контексте.
- source_word: μετʼ αὐτῶν
  choice: с ними
  rationale: Прямо обозначает сторону, с которой предлагается заключить мир.
- source_word: μετὰ παντὸς ἔθνους αὐτῶν
  choice: со всем их народом
  rationale: «Народ» естественно передаёт ἔθνος в данном контексте, а «всем» сохраняет полноту παντός.
