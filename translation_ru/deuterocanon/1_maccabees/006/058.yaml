  text: Now then[a], let us give our right hand to these men, and let us make peace with them and with their whole nation;
translation:
  language: ru
  text: Так давайте же дадим этим людям правую руку[a] и заключим мир с ними и со всем их народом.
  philosophy: optimal-equivalence
  footnotes:
