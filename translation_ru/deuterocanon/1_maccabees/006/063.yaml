  text: And he departed in haste and returned to Antioch, and he found Philip in control of the city, and he fought against him and took the city by force.
translation:
  language: ru
  text: Он поспешно выступил и вернулся в Антиохию. Там он обнаружил, что Филипп держит город под своей властью, вступил с ним в бой и силой овладел городом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆρεν κατὰ σπουδήν
  choice: поспешно выступил
  rationale: Сочетание передаёт как отправление с прежнего места, так и срочность действия; «выступил» естественно звучит в повествовании о военном походе.
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: вернулся в Антиохию
  rationale: Глагол с направительным оборотом указывает на возвращение к прежнему месту; выбранная формулировка точна и естественна по-русски.
- source_word: εὗρεν Φίλιππον κυριεύοντα τῆς πόλεως
  choice: обнаружил, что Филипп держит город под своей властью
  rationale: Причастие κυριεύοντα обозначает фактическое господство или контроль над городом, не обязательно царское правление. Формулировка сохраняет этот смысл без лишнего титульного оттенка.
- source_word: ἐπολέμησεν πρὸς αὐτόν
  choice: вступил с ним в бой
  rationale: Выражение ясно передаёт военное столкновение и в современном русском звучит естественнее буквального «воевал против него».
- source_word: κατελάβετο τὴν πόλιν βίᾳ
  choice: силой овладел городом
  rationale: καταλαμβάνω в данном военном контексте означает захват, а βίᾳ подчёркивает применение силы; «овладел городом» — устойчивое русское выражение.
