  text: These were there beforehand[a], wherever the beast might be; and wherever it went, they went with it and did not leave it.
translation:
  language: ru
  text: Они заранее были там, где бы ни находился зверь[a]; и куда бы он ни шёл, они шли вместе с ним и не отходили от него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «животное»; в данном контексте речь идёт о слоне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Они
  rationale: Указательное местоимение отсылает к людям, упомянутым ранее; в современном русском повторное «эти» без существительного звучало бы менее естественно.
- source_word: πρὸ καιροῦ
  choice: заранее
  rationale: Передаёт временной смысл предварительного присутствия или готовности, не добавляя отсутствующего в греческом глагола «расставить».
- source_word: οὗ ἂν ᾖ
  choice: где бы ни находился
  rationale: Конструкция с ἄν обозначает неопределённое, повторяющееся обстоятельство места; русская форма с «бы ни» сохраняет эту открытость.
- source_word: τὸ θηρίον
  choice: зверь
  rationale: Сохраняет буквальное значение греческого слова, тогда как из контекста ясно, что речь идёт о слоне.
- source_word: ἐπορεύετο
  choice: шёл
  rationale: Нейтрально передаёт движение, не добавляя военного оттенка глагола «маршировать».
- source_word: ἅμα
  choice: вместе с ним
  rationale: Естественно передаёт согласованное движение людей рядом с животным.
- source_word: οὐκ ἀφίσταντο ἐπʼ αὐτοῦ
  choice: не отходили от него
  rationale: Передаёт продолжительное пребывание рядом и отсутствие удаления; формулировка естественна для современного русского языка.
