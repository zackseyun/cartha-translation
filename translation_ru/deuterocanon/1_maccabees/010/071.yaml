base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/071.yaml
  text: Now then[a], if you trust in your forces, come down to us in the plain, and let us meet there[b], because with me is the strength of the cities.
translation:
  language: ru
  text: Итак, если ты уверен в своих войсках, спустись к нам на равнину, и там мы сойдёмся[a], ведь со мной — сила городов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «померимся силами». Греческое выражение в этом контексте подразумевает непосредственное противостояние и может означать вступление в бой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «войска городов». Греческое выражение может собирательно обозначать военную поддержку, предоставленную городами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθας ἐπὶ ταῖς δυνάμεσίν σου
  choice: ты уверен в своих войсках
  rationale: Перфект πέποιθας выражает устойчивую уверенность, а множественное δυνάμεις в военном контексте обозначает вооружённые силы; перевод передаёт и уверенность, и конкретный военный смысл.
- source_word: κατάβηθι πρὸς ἡμᾶς
  choice: спустись к нам
  rationale: Сохраняется пространственное значение императива и направленность движения к говорящему.
- source_word: εἰς τὸ πεδίον
  choice: на равнину
  rationale: πεδίον обозначает ровную открытую местность, подходящую для сражения; по-русски движение естественно выражается сочетанием «на равнину».
- source_word: συγκριθῶμεν ἑαυτοῖς
  choice: мы сойдёмся
  rationale: В контексте военного вызова выражение означает непосредственное противостояние. «Сойдёмся» естественно передаёт вызов, не уточняя сверх текста способ столкновения.
- source_word: δύναμις τῶν πόλεων
  choice: сила городов
  rationale: Сингулярное δύναμις передано собирательным «сила», а родительный τῶν πόλεων сохранён без преждевременного решения, идёт ли речь о войсках, ресурсах или общей поддержке городов.
