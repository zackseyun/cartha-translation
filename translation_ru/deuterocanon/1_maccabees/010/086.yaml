  text: And Jonathan departed from there and encamped at Ashkelon[a], and the people of the city came out to meet him with great honor.
translation:
  language: ru
  text: Ионафан выступил оттуда и расположился лагерем в Аскалоне. Жители города вышли ему навстречу с великими почестями.[a]
  philosophy: optimal-equivalence
  footnotes:
