    text: 'Или: «с великим великолепием»; греческое выражение может подчёркивать как оказанную Ионафану честь, так и пышность устроенной встречи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: выступил
  rationale: Аорист ἀπαίρω обозначает отправление с прежнего места; «выступил» естественно передаёт движение и уместен в повествовании о военном предводителе.
- source_word: παρενέβαλεν
  choice: расположился лагерем
  rationale: παρεμβάλλω в данном военно-походном контексте означает разбить или расположить лагерь; выбранная формулировка ясна современному читателю и сохраняет военный оттенок.
- source_word: εἰς Ἀσκάλωνα
  choice: у Аскалона
  rationale: Предлог εἰς обычно указывает направление к месту; при глаголе расположения лагерем русское «у Аскалона» естественно передаёт прибытие к городу, не утверждая, что войско вошло внутрь него.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: жители города
  rationale: Буквально «те, кто из города»; речь естественно идёт о жителях, причём греческое выражение не требует ограничения только мужчинами.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: ему навстречу
  rationale: Устойчивое выражение означает выйти для встречи с кем-либо; русский оборот точно и естественно передаёт направленность действия.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: с великими почестями
  rationale: δόξα здесь может обозначать почёт, великолепие или славу. Контекст торжественной встречи делает «с великими почестями» наиболее естественным, сохраняя публичный и возвышенный характер приёма.
