  text: And those in the city[a], being afraid, opened the gates, and Jonathan took control of Joppa.
translation:
  language: ru
  text: Те, кто был в городе, испугались и открыли ворота[a], и Ионафан овладел Иоппией.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыли»; в греческом тексте ворота прямо не названы, но, вероятно, подразумеваются по контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθέντες
  choice: испугались
  rationale: Аористное причастие передаёт обстоятельство, предшествующее открытию; личная форма с союзом «и» звучит по-русски естественно и сохраняет причинно-временную связь без усиления степени страха.
- source_word: ἤνοιξαν
  choice: открыли ворота
  rationale: В греческом прямо сказано лишь «открыли», без названного дополнения. В военно-городском контексте естественно подразумеваются ворота; это уточнение вынесено также в сноску, чтобы сохранить прозрачность исходной неоднозначности.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: те, кто был в городе
  rationale: Передаёт группу людей, находившихся в городе, не добавляя указания на пол и не сужая выражение до формального понятия «жители».
- source_word: ἐκυρίευσεν
  choice: овладел
  rationale: Глагол означает получить власть, господство или контроль над чем-либо. «Овладел» естественно для военно-политического контекста и не требует уточнять способ взятия города.
- source_word: Ἰόππης
  choice: Иоппией
  rationale: Употреблена традиционная русская библейская форма названия «Иоппия» в творительном падеже после глагола «овладел».
