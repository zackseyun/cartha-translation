  yaml_path: translation/deuterocanon/1_maccabees/010/004.yaml
  text: For he said[a], “Let us get ahead of him by making peace with him, before he makes common cause with Alexander against us.”
translation:
  language: ru
  text: 'Ведь он сказал: «Опередим его и заключим с ним мир, прежде чем он встанет на сторону Александра против нас».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прежде чем он поставит себя с Александром против нас», то есть присоединится к Александру или вступит с ним в союз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προφθάσωμεν
  choice: Опередим его
  rationale: 'Аорист сослагательного наклонения употреблён как побуждение к совместному действию: следует успеть прежде другого и тем самым его опередить.'
- source_word: τοῦ εἰρηνεῦσαι μετʼ αὐτοῦ
  choice: и заключим с ним мир
  rationale: После προφθάνω артиклевый инфинитив обозначает действие, которое нужно совершить первым. В политическом контексте εἰρηνεύω означает установить мирные отношения; «заключить мир» естественно передаёт этот смысл по-русски.
- source_word: πρὶν ἢ
  choice: прежде чем
  rationale: Вводит действие, которое говорящий стремится предотвратить, совершив своё действие раньше.
- source_word: θεῖναι αὐτὸν μετὰ Ἀλεξάνδρου
  choice: он встанет на сторону Александра
  rationale: Буквальное «поставит себя с Александром» является политической идиомой, обозначающей присоединение или союз. Выбранная формулировка сохраняет образ стороны и не уточняет формальную природу союза.
- source_word: καθʼ ἡμῶν
  choice: против нас
  rationale: κατά с родительным падежом обозначает направленную против говорящих враждебность.
