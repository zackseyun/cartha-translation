  source_fidelity: 'Перевод точно передаёт побудительное Προφθάσωμεν («Опередим его»), дипломатическое εἰρηνεῦσαι μετ’ αὐτοῦ («заключим с ним мир») и политический смысл идиомы θεῖναι … μετὰ Ἀλεξάνδρου («встанет на сторону Александра»). Направленность καθ’ ἡμῶν ясно сохранена: «против нас».'
