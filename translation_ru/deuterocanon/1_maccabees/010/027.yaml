  text: We rejoiced[a]. And now continue still to keep faith with us,
translation:
  language: ru
  text: Мы обрадовались. И теперь продолжайте и впредь хранить верность нам[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сохранять преданность нам»; по смыслу также: «оставаться верными нам».'
    reason: Лексические оттенки πίστις и всей конструкции τοῦ συντηρῆσαι πρὸς ἡμᾶς πίστιν в дипломатическом контексте.
lexical_decisions:
- source_word: ἐχάρημεν
  choice: Мы обрадовались
  rationale: Аорист χαίρω здесь имеет непереходное значение и сообщает о состоявшейся радости; «обрадовались» естественно и сохраняет временную форму.
- source_word: καὶ νῦν
  choice: И теперь
  rationale: Передаёт как связку с предшествующим высказыванием, так и переход к нынешнему призыву.
- source_word: ἐμείνατε
  choice: продолжайте
  rationale: Форма μένω имеет побудительную силу; в сочетании с последующим инфинитивом русское «продолжайте» звучит естественно.
- source_word: ἔτι
  choice: и впредь
  rationale: Выражает продолжение уже существующего положения; «и впредь» уместно в официальной переписке и не дублирует глагол механически.
- source_word: τοῦ συντηρῆσαι
  choice: хранить
  rationale: Артикулированный инфинитив συντηρέω обозначает сохраняемое действие; «хранить верность» — естественное русское сочетание.
- source_word: πρὸς ἡμᾶς
  choice: нам
  rationale: В сочетании с πίστις обозначает направленность верности по отношению к говорящим; русский дательный падеж передаёт это идиоматично.
- source_word: πίστιν
  choice: верность
  rationale: В дипломатическом и союзническом контексте πίστις означает надёжность, преданность обязательствам или лояльность, а не религиозную веру.
theological_decisions:
- issue: Значение πίστιν в политико-союзническом контексте
  choice: верность
  alternative: веру; лояльность
  rationale: Контекст царской переписки указывает на соблюдение союзнической верности. Перевод «веру» в современном русском был бы воспринят преимущественно религиозно и затемнил бы смысл; «лояльность» допустима, но стилистически менее торжественна.
translation_notes:
  register: Современный литературный русский с умеренно официальным тоном царской переписки. Конечная запятая сохранена, поскольку представленный греческий текст является началом продолжающегося предложения.
