  yaml_path: translation/deuterocanon/1_maccabees/010/083.yaml
  text: And the cavalry was scattered in the plain[a], and they fled to Azotus and entered Beth-dagon, their idol temple, to save themselves.
translation:
  language: ru
  text: Конница была рассеяна по равнине, и всадники бежали в Азот. Они вошли в Бет-Дагон — храм своего идола[a], чтобы спастись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вошли в Бет-Дагон, их идола». Греческое приложение выражено сжато; по смыслу речь идёт о святилище, связанном с их идолом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἵππος
  choice: конница / всадники
  rationale: Существительное стоит в единственном числе, но в военном контексте имеет собирательное значение и обозначает конное войско. При последующем глаголе во множественном числе слово «всадники» естественно обозначает тех же людей и устраняет неясность местоимения.
- source_word: ἐσκορπίσθη
  choice: рассеялась
  rationale: Пассивная форма передаёт разгром и рассеяние конного отряда; «рассеялась» естественно звучит по-русски и сохраняет образ исходного текста.
- source_word: ἐν τῷ πεδίῳ
  choice: по равнине
  rationale: πεδίον обозначает открытую ровную местность. Русское «по равнине» передаёт пространство, на котором рассеялась конница, естественнее буквального «на равнине».
- source_word: Ἄζωτον
  choice: Азот
  rationale: Сохранена традиционная греческая форма названия города, соответствующая непосредственному источнику, а не еврейская форма «Ашдод».
- source_word: Βηθδαγὼν
  choice: Бет-Дагон
  rationale: Название передано транслитерацией и оформлено через дефис, чтобы отразить его состав и обеспечить удобочитаемость.
- source_word: τὸ εἴδωλον αὐτῶν
  choice: храм своего идола
  rationale: 'Буквально: «их идола», однако в Бет-Дагон входят как в культовое здание. Добавление слова «храм» раскрывает сжатое приложение, а «идол» сохраняет отрицательную оценку слова εἴδωλον.'
- source_word: τοῦ σωθῆναι
  choice: чтобы спастись
  rationale: 'Артиклевый инфинитив выражает цель. Формулировка сохраняет допустимую двусмысленность: речь может идти как о спасении от непосредственной опасности, так и о поиске убежища.'
theological_decisions:
- issue: Передача εἴδωλον в контексте филистимского культа
  choice: храм своего идола
  alternative: свой идол; святилище своего идола
  rationale: Слово «идол» сохраняет полемическую оценку греческого текста и не заменяется нейтральным обозначением божества. Слово «храм» делает понятным, каким образом беглецы могли войти в Бет-Дагон, но буквальная сжатость отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный стиль. Длинное греческое предложение разделено на два для ясности; связь между собирательным словом «конница» и глаголами множественного числа передана словом «всадники».
