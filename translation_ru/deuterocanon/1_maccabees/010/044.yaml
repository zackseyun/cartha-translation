  yaml_path: translation/deuterocanon/1_maccabees/010/044.yaml
  text: And for the rebuilding and the renovation of the works of the sanctuary[b][a], the expense will be given by order of the king.
translation:
  language: ru
  text: А расходы на строительство и обновление сооружений святилища будут покрыты из средств царя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение буквально означает «из слова/счёта царя». В административно-финансовом контексте оно может относиться к царскому счёту или реестру; возможно также понимание: «по распоряжению царя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθῆναι
  choice: строительство
  rationale: Субстантивированный инфинитив обозначает строительные работы; в контексте восстановления храма речь фактически идёт о новом строительстве или восстановлении, но нейтральное «строительство» не добавляет отсутствующей в самом глаголе приставочной семантики.
- source_word: ἐπικαινισθῆναι
  choice: обновление
  rationale: Глагол означает сделать новым снова, обновить; здесь рядом со строительством он указывает на материальное восстановление, а не на обрядовое повторное освящение.
- source_word: τὰ ἔργα τῶν ἁγίων
  choice: сооружения святилища
  rationale: ἔργα имеет широкое значение дел, работ или созданных сооружений, а τὰ ἅγια в храмовом контексте обозначает священное место или храмовый комплекс. Русское выражение естественно передаёт предмет строительных работ.
- source_word: ἡ δαπάνη δοθήσεται
  choice: расходы … будут покрыты
  rationale: Буквально «расход будет дан»; русская финансовая формула «расходы будут покрыты» естественно передаёт предоставление средств на указанные работы.
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  choice: из средств царя
  rationale: В административно-финансовом контексте λόγος может означать счёт, расчётную запись или статью царских средств. «Из средств царя» ясно передаёт источник финансирования, не вводя более конкретного понятия казны.
