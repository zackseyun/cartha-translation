  text: And he sent him a gold clasp[a], as is the custom to give to the king’s kinsmen; and he gave him Accaron and all its territory as an inheritance.
translation:
  language: ru
  text: И послал он ему золотую застёжку, какую по обычаю дарят царским родственникам, и отдал ему Аккарон[a] со всей его областью в наследство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Аккарон — греческая форма названия города, более известного по древнееврейской форме как Екрон.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόρπην χρυσῆν
  choice: золотую застёжку
  rationale: πόρπη обозначает застёжку или скрепляющее украшение; этот вариант конкретен, понятен современному читателю и не уточняет форму предмета сверх данных греческого текста.
- source_word: ὡς ἔθος ἐστὶν διδόσθαι
  choice: какую по обычаю дарят
  rationale: Естественно передаёт безличную конструкцию и смысл установленного обычая при царском дворе.
- source_word: τοῖς συγγενεῦσιν τῶν βασιλέων
  choice: царским родственникам
  rationale: Сохраняет множественное число и общий смысл категории лиц, связанных родством с царями, не сужая выражение до родственников одного конкретного царя.
- source_word: Ἀκκαρὼν
  choice: Аккарон
  rationale: Передаёт греческую форму топонима; более привычная древнееврейская форма «Екрон» отмечена в сноске.
- source_word: πάντα τὰ ὅρια αὐτῆς
  choice: со всей его областью
  rationale: ὅρια может означать границы, а во множественном числе — охватываемую ими территорию. В контексте передачи города естественное русское выражение «со всей его областью» точно передаёт территориальный смысл.
- source_word: εἰς κληρονομίαν
  choice: в наследственное владение
  rationale: Передаёт одновременно идеи наследования и владения, уместные для пожалования города с прилегающей областью.
