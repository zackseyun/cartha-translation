  text: 'И послал Александр к Птолемею, царю Египта, послов с такими словами:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Аорист ἀποστέλλω передаёт завершённое действие в повествовании; «послал» естественно и точно по-русски.
- source_word: πρὸς Πτολεμαῖον
  choice: к Птолемею
  rationale: При глаголе отправления πρὸς с винительным обозначает адресата; по-русски естественно «к Птолемею».
- source_word: πρέσβεις
  choice: послов
  rationale: πρέσβεις обозначает официальных дипломатических представителей; «послы» сохраняет государственно-дипломатический смысл.
- source_word: βασιλέα Αἰγύπτου
  choice: царю Египта
  rationale: Приложение к имени Птолемея; «царь Египта» соответствует историческому и библейскому регистру.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: с такими словами
  rationale: Оборот вводит содержание последующего послания; «с такими словами» звучит естественно и сохраняет указание на его формулировку.
- source_word: λέγων
  choice: ':'
  rationale: Причастие λέγων вводит прямую речь следующего стиха. В современном русском эту функцию яснее и естественнее передаёт двоеточие, без избыточного «говоря».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Дипломатический термин передан как «послы»; буквальное завершающее «говоря» заменено нормативным знаком введения прямой речи.
