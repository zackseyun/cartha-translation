base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/033.yaml
  text: And every Jewish person who has been taken captive from the land of Judah into any part of my kingdom I release as free[a], without payment; and let all also remit the taxes on them and on their livestock.
translation:
  language: ru
  text: И каждого иудея, уведённого в плен из земли Иуды в какую-либо часть моего царства, я безвозмездно отпускаю на свободу; и пусть все отменят подати, взимаемые с них и с их скота.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть все отменят подати и [подати] их скота». В греческом тексте после «и» подразумевается слово «подати»; выражение может относиться специально к податям со скота либо более широко — к податям с людей и к связанным с их имуществом сборам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν ψυχὴν Ἰουδαίων
  choice: каждого иудея
  rationale: ψυχή в таком административном контексте означает человека; «каждого иудея» естественно передаёт распределительное πᾶσαν.
- source_word: τὴν αἰχμαλωτισθεῖσαν
  choice: уведённого в плен
  rationale: Причастие обозначает человека, сделанного пленником; формулировка также уместна для пленения с последующим перемещением.
- source_word: ἀπὸ γῆς Ἰούδα
  choice: из земли Иуды
  rationale: Сохраняет буквальное наименование γῆ Ἰούδα и не заменяет его более истолковывающим «из Иудеи».
- source_word: εἰς πᾶσαν βασιλείαν μου
  choice: в какую-либо часть моего царства
  rationale: Передаёт смысл нахождения пленников где угодно в пределах царства, избегая неестественного буквального «во всё моё царство».
- source_word: ἀφίημι ἐλευθέραν δωρεάν
  choice: я безвозмездно отпускаю на свободу
  rationale: ἀφίημι ἐλευθέραν выражает освобождение, а δωρεάν подчёркивает отсутствие выкупа или платы.
- source_word: πάντες ἀφιέτωσαν
  choice: пусть все освободят
  rationale: Повелительная форма обращена ко всем подчинённым царской власти и требует снять соответствующие фискальные обязательства.
- source_word: τοὺς φόρους
  choice: от податей
  rationale: φόροι обозначает налоги или дань; «подати» соответствует контексту царского административного указа и допускает сборы, связанные со скотом.
- source_word: κτηνῶν αὐτῶν
  choice: их скот
  rationale: κτῆνος означает домашний скот или рабочих животных; «скот» — ясный и естественный русский эквивалент.
