  text: And all the surplus that they did not pay from the revenues[a], as in the former years[b], from now on they shall give for the works of the house.
translation:
  language: ru
  text: И весь остаток[a], который они не отдали из поступлений, как в прежние годы, отныне будут отдавать на работы Дома[b].
  philosophy: optimal-equivalence
  footnotes:
