lexical_decisions:
- source_word: πλεονάζον
  choice: остаток
  rationale: Субстантивированное причастие обозначает то, что осталось сверх обычных расходов; «остаток» естественно звучит в финансово-административном контексте и не усиливает значение до «излишка».
- source_word: ἀπέδωσαν
  choice: не перечислили
  rationale: В данном финансовом контексте глагол означает передачу или внесение причитающихся средств; «перечислили» ясно передаёт административный характер действия.
- source_word: χρειῶν
  choice: поступлений
  rationale: Хотя обычное значение χρεία — «нужда, потребность, расход», здесь сочетание с ἀπό в финансовом постановлении указывает на средства или поступления, из которых производилось перечисление. Выбор сохраняет фискальный смысл, не вводя более узкого понятия налога.
- source_word: ἐν τοῖς πρώτοις ἔτεσιν
  choice: в прежние годы
  rationale: πρῶτος здесь соотносит прежние годы с новым порядком, а не обязательно обозначает буквально первые годы некоторого периода.
- source_word: τὰ ἔργα
  choice: работы
  rationale: Множественное число обозначает работы или проекты, связанные с храмом; перевод не уточняет без достаточных оснований, были ли это строительство или ремонт.
- source_word: τοῦ οἴκου
  choice: в Доме
  rationale: Буквально «дома»; это традиционное почтительное обозначение храма. Заглавная буква помогает современному читателю распознать особое употребление без замены исходного образа в основном тексте.
theological_decisions:
- issue: Обозначение храма словом οἶκος
  choice: Дом с пояснительной сноской
  alternative: храм
  rationale: Сохранён исходный библейский образ «Дома», при этом сноска устраняет возможную неясность; каких-либо конфессиональных уточнений не добавлено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Формулировка остаётся понятной как административное распоряжение; порядок придаточных слегка выровнен ради естественного русского синтаксиса. Подлинная лексическая широта πλεονάζον и образное обозначение храма сохранены в тексте и сносках.
