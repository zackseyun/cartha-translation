  yaml_path: translation/deuterocanon/1_maccabees/010/029.yaml
  text: And we will grant you many remissions[a], and we will give you gifts. And now I release you and exempt all the Jews from the taxes, from the salt duty[c][b], and from the crown levies.
translation:
  language: ru
  text: И мы предоставим вам множество льгот[a] и дадим вам дары. А теперь я освобождаю вас и избавляю всех иудеев от налогов, от платы за соль[b] и от венечных сборов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «множество освобождений». Греческое выражение ἀφέματα πολλά в данном контексте относится к финансовым и административным послаблениям.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от цены соли». Вероятно, имеется в виду установленный платёж или налог, связанный с солью.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «от венцов». Так могли называть почётные венцы, подносимые царю, либо денежные сборы вместо них.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀφήσομεν … ἀφέματα πολλά
  choice: предоставим вам множество льгот
  rationale: В административно-финансовом контексте сочетание обозначает предоставление многочисленных послаблений или освобождений от обязательств; «льготы» естественно передаёт этот смысл по-русски, не привнося значения прощения грехов.
- source_word: δόματα
  choice: дары
  rationale: Широкое обозначение того, что царь жалует подданным; «дары» сохраняет официальный и вместе с тем понятный характер высказывания.
- source_word: ἀπολύω
  choice: освобождаю
  rationale: Глагол означает отпускать или освобождать; здесь он употреблён в контексте снятия повинностей. Отдельный глагол сохранён, чтобы не сгладить структуру греческого текста.
- source_word: ἀφίημι … ἀπὸ
  choice: избавляю … от
  rationale: При перечислении налоговых обязательств конструкция обозначает освобождение от них. «Избавляю от» позволяет избежать неестественного повтора с предшествующим «освобождаю».
- source_word: φόρων
  choice: налогов
  rationale: Современное и ясное обозначение обязательных платежей государству.
- source_word: τιμῆς τοῦ ἁλός
  choice: платы за соль
  rationale: τιμή может означать цену либо установленный платёж. В данном финансовом перечне, вероятнее всего, имеется в виду сбор, связанный с солью; перевод сохраняет некоторую неоднозначность выражения.
- source_word: στεφάνων
  choice: венечных сборов
  rationale: Буквально речь идёт о «венцах», но в эллинистической финансовой практике это могли быть почётные венцы, подносимые правителю, или их денежный эквивалент. «Венечные сборы» передаёт и образ, и фискальный смысл.
