translation_notes:
  register: 'Современный литературный русский язык с умеренно официальным тоном царского указа. Сохранена смена числа и лица: сначала «мы предоставим», затем «я освобождаю», как в греческом тексте. Необычные налоговые термины разъяснены в сносках без устранения присущей оригиналу неоднозначности.'
