  yaml_path: translation/deuterocanon/1_maccabees/010/021.yaml
  text: And Jonathan put on the holy robe in the seventh month[a], in the one hundred sixtieth year, at the feast of Booths, and he gathered forces and made many weapons.
translation:
  language: ru
  text: Ионафан надел священное облачение в седьмом месяце сто шестидесятого года, в праздник Кущей[a]. Он собрал войска и изготовил много оружия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздник Шалашей». Греческое название буквально связано с возведением временных жилищ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδύσατο
  choice: надел
  rationale: Средняя форма глагола ἐνδύω обозначает, что Ионафан облачился; «надел» естественно и конкретно передаёт действие.
- source_word: τὴν ἁγίαν στολήν
  choice: священное облачение
  rationale: στολή означает одеяние или торжественную одежду, а ἁγίαν указывает на её освящённое, священническое назначение. «Облачение» сохраняет официальный культовый оттенок, не уточняя вид одежды сверх греческого текста.
- source_word: τῷ ἑβδόμῳ μηνί
  choice: в седьмом месяце
  rationale: Дательный времени естественно передаётся русским оборотом с предлогом «в».
- source_word: ἔτους ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: сто шестидесятого года
  rationale: Греческая порядковая конструкция обозначает 160-й год; словесная форма соответствует литературной библейской хронологии.
- source_word: ἐν ἑορτῇ σκηνοπηγίας
  choice: в праздник Кущей
  rationale: σκηνοπηγία — праздник возведения временных жилищ. «Праздник Кущей» — понятное и укоренившееся русское название, а буквальный образ пояснён в сноске.
- source_word: συνήγαγεν δυνάμεις
  choice: собрал войска
  rationale: δυνάμεις в данном военном контексте означает вооружённые силы; «собрал войска» естественнее буквального «собрал силы».
- source_word: κατεσκεύασεν ὅπλα πολλά
  choice: изготовил много оружия
  rationale: κατασκευάζω допускает значения изготовления и подготовки, а ὅπλα — оружие. Выбран прямой смысл, соответствующий контексту военных приготовлений.
