  text: Царь Александр собрал крупные силы и разбил лагерь напротив Димитрия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγεν
  choice: собрал
  rationale: Аорист συνάγω в военном контексте означает сосредоточить, собрать силы; «собрал» естественно и точно передаёт действие.
- source_word: δυνάμεις μεγάλας
  choice: большие силы
  rationale: Во множественном числе δυνάμεις обозначает здесь войска или военные силы, а μεγάλας указывает на их значительность по численности; выражение сохраняет число и не сужает смысл до одного войска.
- source_word: παρενέβαλεν
  choice: расположился лагерем
  rationale: В военном повествовании παρεμβάλλω означает разбить или расположить лагерь; выбранная формулировка ясна и соответствует современному литературному русскому.
- source_word: ἐξ ἐναντίας
  choice: напротив
  rationale: Выражение передаёт пространственное положение противоборствующих сторон и не добавляет отсутствующего в греческом тексте указания на начало нападения.
- source_word: Δημητρίῳ
  choice: Димитрия
  rationale: Традиционная русская библейская форма имени Δημήτριος; родительный падеж обусловлен предлогом «напротив».
- source_word: Ἀλέξανδρος ὁ βασιλεὺς
  choice: Царь Александр
  rationale: Естественный для современного русского порядок титула и имени без изменения смысла греческой аппозиции.
