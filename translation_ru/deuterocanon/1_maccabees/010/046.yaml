base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/046.yaml
  text: But when Jonathan and the people heard these words[a], they did not believe them or accept them, because they remembered the great evil that he had done in Israel[b], and how he had oppressed them severely.
translation:
  language: ru
  text: Когда Ионафан и народ услышали эти слова[a], они не поверили им и не приняли их, потому что помнили о великом зле, которое он совершил в Израиле[b], и о том, как жестоко он их угнетал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не доверились им и не приняли их». В греческом тексте различаются отказ поверить словам и отказ принять их.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которое он совершил в Израиле». Это может означать зло, совершённое среди Израиля или на его территории; возможно также понимание: «причинённое Израилю как народу».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐπίστευσαν αὐτοῖς
  choice: не поверили им
  rationale: Передаёт отказ счесть слова правдивыми или искренними; местоимение сохраняет отсылку к «этим словам».
- source_word: οὐδὲ ἐπεδέξαντο
  choice: и не приняли их
  rationale: Глагол обозначает благосклонное принятие слов или предложения; перевод сохраняет отличие от внутреннего доверия.
- source_word: ἐμνήσθησαν
  choice: помнили
  rationale: В данном причинном обороте естественно выражает сохранявшуюся память о прежних злодеяниях, обусловившую отказ.
- source_word: τῆς κακίας τῆς μεγάλης
  choice: о великом зле
  rationale: Сохраняет широкий и весомый нравственно-практический смысл κακία, не сужая его до одного вида проступка.
- source_word: ἧς ἐποίησεν ἐν Ἰσραήλ
  choice: которое он причинил Израилю
  rationale: По-русски сочетание «сделал зло в Израиле» двусмысленно и менее естественно; дательный передаёт направленность вреда на Израиль, а буквальное пространственное понимание отмечено в сноске.
- source_word: ἔθλιψεν αὐτοὺς σφόδρα
  choice: как жестоко он их угнетал
  rationale: «Угнетал» соответствует политико-военному контексту длительного притеснения, а «жестоко» естественно передаёт усилитель σφόδρα.
theological_decisions:
- issue: К кому относится подразумеваемое подлежащее прежних враждебных действий
  choice: Сохранено единственное число «он»
  alternative: Множественное «они» при корпоративном понимании политической стороны
  rationale: Греческие формы ἐποίησεν и ἔθλιψεν стоят в единственном числе, поэтому перевод не подменяет непосредственного референта коллективным.
- issue: Значение ἐν Ἰσραήλ
  choice: «причинил Израилю» в основном тексте
  alternative: «совершил в Израиле» как более буквальное пространственное прочтение
  rationale: Греческое ἐν буквально означает «в», но в контексте возможно как указание на действия среди Израиля, так и на зло против Израиля; неоднозначность сохранена сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Парная конструкция «не поверили… и не приняли» сохраняет смысловое различие греческих глаголов; причинная связь и напряжённость воспоминания о прежнем угнетении переданы без конфессиональной конкретизации.
