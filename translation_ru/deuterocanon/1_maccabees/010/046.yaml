  naturalness: Фраза «совершил в Израиле» в сочетании с «великом зле» естественна для современного литературного русского и сохраняет повествовательный, библейски сдержанный регистр. Пара «не поверили ... и не приняли» удачно передаёт различие греческих глаголов.
