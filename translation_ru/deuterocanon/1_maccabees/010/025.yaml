lexical_decisions:
- source_word: ὅπως ὦσιν σὺν ἐμοὶ εἰς βοήθειαν
  choice: чтобы они были со мной и помогали мне
  rationale: Передаёт цель и значение εἰς βοήθειαν естественным современным русским оборотом, не превращая людей в абстрактную «помощь».
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: иудейскому народу
  rationale: Контекстуально и стилистически естественная передача адресата — народа Иудеи.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: письмо такого содержания
  rationale: Идиоматически вводит следующую за формулой текстовую цитату; глагол «послал» в эпистолярном контексте подразумевает послание.
- source_word: χαίρειν
  choice: Приветствую вас!
  rationale: Передаёт обычную греческую эпистолярную формулу приветствия понятным современным русским языком.
