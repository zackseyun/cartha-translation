base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/047.yaml
  text: And they were pleased with Alexander[a], because he had become for them the initiator of peaceful terms, and they fought alongside him all the days.
translation:
  language: ru
  text: Они были довольны Александром[a], потому что он стал для них инициатором мирных предложений, и всё это время сражались на его стороне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одобрили Александра»; «были благосклонны к Александру».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν ἐν Ἀλεξάνδρῳ
  choice: предпочли Александра
  rationale: В контексте выбора между соперниками оборот выражает благосклонное решение в пользу Александра; русское «предпочли» естественно передаёт и одобрение, и контекст выбора.
- source_word: ἐγένετο αὐτοῖς
  choice: он … им
  rationale: Греческое выражение буквально означает «стал/оказался для них»; в русском оно естественно включено в конструкцию о сделанном им предложении.
- source_word: ἀρχηγὸς λόγων εἰρηνικῶν
  choice: первым предложил … мирные условия
  rationale: Сжатое греческое выражение буквально допускает «предводитель/зачинатель мирных речей»; выбранная формулировка передаёт инициативу Александра в примирительных переговорах, не превращая его в общего «вождя».
- source_word: συνεμάχουν αὐτῷ
  choice: воевали на его стороне
  rationale: Глагол обозначает совместные военные действия в качестве союзников; перевод сохраняет явный военный смысл.
- source_word: πάσας τὰς ἡμέρας
  choice: всё это время
  rationale: Идиома выражает непрерывность поддержки в последующий период; буквальное «все дни» в современном русском здесь звучало бы неестественно.
