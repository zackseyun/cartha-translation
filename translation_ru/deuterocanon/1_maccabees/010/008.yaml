  text: And they were greatly afraid when they heard that the king had given them authority to gather forces[a].
translation:
  language: ru
  text: И они сильно испугались[a], когда услышали, что царь дал им право собирать войска.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «испугались великим страхом» — греческий оборот, выражающий очень сильный страх.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: сильно испугались
  rationale: Греческий оборот с однокоренным дополнением буквально означает «испугались великим страхом» и служит для усиления. Русское «сильно испугались» естественно передаёт эту интенсивность.
- source_word: ὅτε ἤκουσαν
  choice: когда услышали
  rationale: Прямо передаёт временную связь и сохраняет естественное течение повествования.
- source_word: ἔδωκεν αὐτοῖς ὁ βασιλεὺς
  choice: царь дал им
  rationale: 'Порядок слов адаптирован к современному русскому синтаксису без изменения смысла: полномочие исходит от царя и дано упомянутым лицам.'
- source_word: ἐξουσίαν
  choice: право
  rationale: В данном контексте слово обозначает предоставленное царём официальное дозволение или полномочие; «право» ясно и естественно выражает этот смысл.
- source_word: συναγαγεῖν δυνάμεις
  choice: собирать войска
  rationale: В военном контексте δυνάμεις означает вооружённые силы или войска, а συναγαγεῖν — собирать, стягивать или формировать их. Выбранный вариант близок к греческому и понятен современному читателю.
