lexical_decisions:
- source_word: ἐρώτησον καὶ μάθε
  choice: Расспроси и узнай
  rationale: 'Два повелительных глагола сохранены: сначала получение сведений через расспросы, затем обретение знания.'
- source_word: οἱ λοιποὶ οἱ βοηθοῦντές ἡμῖν
  choice: те остальные, что помогают нам
  rationale: Передаёт λοιποί как остальных людей и сохраняет активный смысл причастия βοηθοῦντες без неоправданного сужения до военной поддержки.
- source_word: λέγουσιν
  choice: они говорят
  rationale: Сохранены множественное число и настоящее время греческого глагола; местоимение естественно указывает на тех, кого предлагается расспросить.
- source_word: Οὐκ ἔστιν ὑμῖν στάσις ποδὸς κατὰ πρόσωπον ἡμῶν
  choice: Вам не устоять перед нами
  rationale: Естественная русская передача военного вызова и невозможности удержаться перед противником; буквальный образ постановки ноги отмечен в сноске.
- source_word: δὶς ἐτροπώθησαν
  choice: дважды были обращены в бегство
  rationale: Сохраняет точное значение δὶς и сильный военный смысл пассивной формы ἐτροπώθησαν.
- source_word: οἱ πατέρες σου
  choice: твои предки
  rationale: В данном историко-династическом контексте πατέρες обозначает предков; сохранено обращение к одному лицу через форму «твои».
- source_word: ἐν τῇ γῇ αὐτῶν
  choice: в своей земле
  rationale: Возвратное притяжательное местоимение по-русски естественно передаёт принадлежность земли предкам и подчёркивает, что поражение произошло на их собственной территории.
