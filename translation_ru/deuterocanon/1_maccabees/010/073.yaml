  text: And now you will not be able to withstand the cavalry and so great a force in the plain[a], where there is neither stone nor pebble nor a place to flee.
translation:
  language: ru
  text: И теперь ты не сможешь противостоять коннице[a] и столь большому войску на равнине, где нет ни камня, ни гальки, ни места для бегства.
  philosophy: optimal-equivalence
  footnotes:
