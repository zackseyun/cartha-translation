    text: В греческом тексте буквально «конь»; единственное число употреблено собирательно и означает конницу, то есть конные войска.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνήσῃ
  choice: ты не сможешь
  rationale: Будущее время δύναμαι прямо выражает предстоящую неспособность; эта форма естественна в современном русском языке.
- source_word: ὑποστῆναι
  choice: противостоять
  rationale: В военном контексте глагол означает устоять перед наступающей силой, оказывая сопротивление.
- source_word: τὴν ἵππον
  choice: коннице
  rationale: Буквально «конь» употреблено как собирательное обозначение конных войск; «конница» точно и естественно передаёт смысл.
- source_word: δύναμιν τοσαύτην
  choice: столь многочисленному войску
  rationale: Здесь δύναμις обозначает военную силу, а τοσαύτην подчёркивает её значительность; по контексту речь идёт прежде всего о численном и боевом превосходстве.
- source_word: ἐν τῷ πεδίῳ
  choice: на равнине
  rationale: πέδιον означает ровную открытую местность; русское «на равнине» идиоматично и сохраняет противопоставление местности, дающей укрытие.
- source_word: λίθος
  choice: камня
  rationale: Общее обозначение камня, сохранённое отдельно от следующего названия мелких камней.
- source_word: κόχλας
  choice: гальки
  rationale: Слово обозначает мелкие округлые камни или гальку; перевод сохраняет отличие от λίθος.
- source_word: τόπος τοῦ φυγεῖν
  choice: места, куда можно было бы бежать
  rationale: Оборот выражает наличие места или возможности для бегства; развёрнутая русская конструкция звучит естественно и сохраняет смысл.
