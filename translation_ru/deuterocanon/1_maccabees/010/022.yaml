  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный греческий текст этого стиха неполон и обрывается посреди предложения на слове «и». Поэтому перевод сохраняет незавершённую фразу, не восполняя отсутствующие слова.
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Обычный соединительный союз; сохраняет паратактическое течение греческого повествования.
- source_word: ἤκουσεν
  choice: услышал
  rationale: Аорист глагола ἀκούω здесь означает восприятие сказанного; «услышал» естественно и точно передаёт повествовательный смысл.
- source_word: Δημήτριος
  choice: Димитрий
  rationale: Традиционная русская форма греческого личного имени Δημήτριος в библейском контексте.
- source_word: τοὺς λόγους τούτους
  choice: эти слова
  rationale: λόγοι может означать слова, высказывания или сообщение; в данном контексте «эти слова» естественно и достаточно буквально передаёт сочетание с указательным местоимением.
- source_word: καὶ
  choice: и…
  rationale: Предоставленный греческий текст обрывается на втором союзе καὶ. Союз сохранён, а многоточие ясно обозначает незавершённость фразы без восполнения отсутствующего текста.
