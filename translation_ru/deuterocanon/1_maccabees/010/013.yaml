lexical_decisions:
- source_word: κατέλιπεν
  choice: оставил
  rationale: Аорист καταλείπω обозначает оставление места; «оставил» точно передаёт простой повествовательный смысл, не усиливая его до «покинул навсегда» или «бросил».
- source_word: ἕκαστος
  choice: каждый
  rationale: 'Слово подчёркивает распределённость действия: каждый человек поступил так отдельно; русское «каждый» естественно сохраняет эту силу без внесения отсутствующей в греческой форме гендерной конкретизации.'
- source_word: τὸν τόπον αὐτοῦ
  choice: своё место
  rationale: τόπος имеет широкое значение «место». Хотя в контексте возможен оттенок позиции или поста, буквальное «своё место» сохраняет широту исходного выражения.
- source_word: ἀπῆλθεν
  choice: ушёл
  rationale: ἀπέρχομαι означает удалиться, уйти. «Ушёл» естественно передаёт движение прочь и не создаёт ненужного повтора с глаголом «оставил».
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: в свою землю
  rationale: γῆ здесь обозначает родную территорию или землю каждого. «В свою землю» сохраняет образ и значение принадлежности, не привнося современного национально-государственного оттенка слова «страна».
