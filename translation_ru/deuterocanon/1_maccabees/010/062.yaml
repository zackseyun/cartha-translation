  text: And the king gave orders to them[a], and they stripped Jonathan of his garments and clothed him in purple[b]; and they did so.
translation:
  language: ru
  text: Царь приказал им[a], и с Ионафана сняли одежды и облачили его в пурпур[b]. Они так и сделали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'После слов «царь приказал им» греческий текст употребляет глаголы «снял» и «облачил» в единственном числе, а в конце снова переходит к множественному: «они так и сделали». По смыслу приказ исполнили царские служители.'
    reason: textual_variant
  - marker: b
    text: Пурпурная одежда при царском дворе была знаком высокого положения и особой чести.
    reason: cultural_note
lexical_decisions:
- source_word: προσέταξεν
  choice: приказал
  rationale: Глагол выражает властное распоряжение; краткое «приказал» естественно передаёт царскую власть.
- source_word: ἐξέδυσεν
  choice: с Ионафана сняли
  rationale: Хотя греческая форма стоит в единственном числе, окружающие формы множественного числа указывают на исполнителей царского приказа. Неопределённо-личная русская конструкция сохраняет эту смысловую связь, не называя исполнителя сверх текста.
- source_word: ἱμάτια
  choice: одежды
  rationale: Множественное число «одежды» передаёт общее обозначение предметов одежды и соответствует торжественному придворному контексту, не сужая смысл до мантий.
- source_word: ἐνέδυσεν
  choice: облачили его
  rationale: «Облачили» естественно описывает церемоническое переодевание и сохраняет возвышенный, но понятный регистр.
- source_word: πορφύραν
  choice: в пурпур
  rationale: Греческое существительное может обозначать пурпурную ткань или одеяние. «В пурпур» сохраняет эту краткость и придворную символику, не добавляя прямо не названную «мантию».
- source_word: ἐποίησαν οὕτως
  choice: они так и сделали
  rationale: Идиоматично передаёт итоговое указание на точное исполнение царского распоряжения.
