translation:
  language: ru
  text: И иноплеменники, находившиеся в крепостях, которые построил Вакхид, убежали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφυγον
  choice: бежали
  rationale: Аорист φεύγω обозначает бегство; «бежали» кратко и естественно передаёт совершившееся действие, не уточняя, было ли это отступлением или спасением.
- source_word: ἀλλογενεῖς
  choice: иноплеменники
  rationale: Слово обозначает людей иного народа или происхождения. «Иноплеменники» сохраняет этнический смысл и не привносит богословских оттенков слова «язычники».
- source_word: ὀχυρώμασιν
  choice: крепостях
  rationale: Термин обозначает укреплённые места или оборонительные сооружения; «крепости» — естественный и точный военный эквивалент в данном контексте.
- source_word: οἷς οἰκοδόμησεν
  choice: которые построил
  rationale: Относительное предложение относится к крепостям. В русском языке последовательность событий ясна без грамматического аналога английского предпрошедшего времени.
- source_word: Βακχίδης
  choice: Вакхид
  rationale: Использована традиционная русская передача имени Βακχίδης.
