lexical_decisions:
- source_word: ἤτω
  choice: пусть ... будет
  rationale: Форма повелительного наклонения третьего лица от εἰμί; передаёт предписывающую силу царского указа.
- source_word: ἁγία
  choice: свят
  rationale: Прямо сохраняет религиозный и культовый смысл ἅγιος применительно к Иерусалиму.
- source_word: ἀφιεμένη
  choice: освобождён
  rationale: В данном административно-фискальном контексте пассивное причастие от ἀφίημι естественно указывает на освобождение города от повинностей; сноска сохраняет возможное значение посвящения или отделения.
- source_word: τὰ ὅρια αὐτῆς
  choice: со своими пределами
  rationale: ὅρια допускает значение как границ, так и территории в их пределах; «пределы» кратко сохраняет эту неоднозначность.
- source_word: αἱ δεκάται
  choice: десятинами
  rationale: Обычное обозначение десятин, связанных с Иерусалимом и его пределами.
- source_word: τὰ τέλη
  choice: податями
  rationale: τέλη обозначает налоги, сборы или пошлины; «подати» уместны в тексте царского указа и не сужают значение до одного вида платежей.
theological_decisions:
- issue: Соотношение ἁγία и ἀφιεμένη
  choice: 'Передать оба определения раздельно: «свят и освобождён»'
  alternative: «свят и отделён» или «свят и посвящён»
  rationale: Греческий текст содержит два согласованных определения. Контекст налоговых льгот поддерживает значение «освобождён», но возможный сакральный оттенок не устраняется и отмечен в сноске.
- issue: Объём значения τὰ ὅρια αὐτῆς
  choice: «со своими пределами»
  alternative: «со своей территорией» или «со своими границами»
  rationale: Так сохраняется подлинная неоднозначность между пограничными рубежами и прилегающей к городу территорией.
