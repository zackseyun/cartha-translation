  text: I too will write to them words of encouragement and honor and gifts,[a]
translation:
  language: ru
  text: Напишу и я им слова ободрения и почёта, а также о дарах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слова ободрения, возвышения и даров». Греческое ὕψους буквально означает «высота, возвышение» и может подразумевать оказание чести или повышение положения. Связь слова «дары» с предыдущими словами в греческом тексте не вполне ясна.'
    reason: Лексическая и синтаксическая неоднозначность.
lexical_decisions:
- source_word: γράψω
  choice: напишу
  rationale: Будущее действительного залога прямо выражает намерение говорящего.
- source_word: κἀγώ
  choice: и я
  rationale: Красис καί + ἐγώ имеет присоединительно-усилительный смысл; «и я» естественно передаёт его по-русски.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж обозначает адресатов письма.
- source_word: λόγους
  choice: слова
  rationale: Широкое значение существительного сохранено без излишнего уточнения содержания письма.
- source_word: παρακλήσεως
  choice: ободрения
  rationale: В дипломатическом контексте слово может обозначать ободрение, заверение или благосклонный призыв; «ободрение» сохраняет положительный тон и смысловую широту.
- source_word: ὕψους
  choice: почёта
  rationale: Буквально слово означает «высоту, возвышение», но здесь, вероятно, указывает на оказание чести или повышение положения; «почёт» естественно передаёт социально-политический смысл.
- source_word: δομάτων
  choice: дары
  rationale: Прямое и стилистически достойное соответствие слову со значением даров или подношений.
