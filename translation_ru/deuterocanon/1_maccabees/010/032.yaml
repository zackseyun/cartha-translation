  source_fidelity: 'В целом переданы все смысловые компоненты греческого текста: отказ от полномочий, их передача первосвященнику и право последнего выбрать охрану. Однако местоимение «её» после слова «крепость» двусмысленно: его можно отнести как к «власти», так и к «крепости». В греческом δίδωμι относится к ἐξουσίαν, то есть передаются именно полномочия. Кроме того, ἄνδρας прямо обозначает мужчин; нейтральное «людей» не полностью сохраняет это указание.'
