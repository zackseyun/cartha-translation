  yaml_path: translation/deuterocanon/1_maccabees/010/032.yaml
  text: I also relinquish the authority over the citadel in Jerusalem[a], and I give it to the high priest, so that he may appoint in it men whom he himself chooses to guard it.
translation:
  language: ru
  text: Я также отказываюсь от власти над крепостью в Иерусалиме[a] и передаю эту власть первосвященнику, чтобы он назначил в ней мужчин, которых сам изберёт, для её охраны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Акрой в Иерусалиме» — с традиционной передачей названия этой укреплённой цитадели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφίημι
  choice: отказываюсь
  rationale: В административном контексте глагол означает отказ от притязания или контроля, а не прощение; настоящее время сохраняет форму греческого текста.
- source_word: ἐξουσίαν
  choice: власть над
  rationale: Передаёт юридико-административное право распоряжаться крепостью, не сводя значение лишь к физическому контролю.
- source_word: ἄκρας
  choice: крепостью
  rationale: Здесь имеется в виду укреплённая цитадель в Иерусалиме; «крепость» естественно и понятно современному русскому читателю.
- source_word: δίδωμι
  choice: передаю её
  rationale: В данном официальном контексте речь идёт о передаче крепости под власть первосвященника; «передаю» по-русски точнее, чем буквальное «даю».
- source_word: ἀρχιερεῖ
  choice: первосвященнику
  rationale: Устоявшееся русское обозначение ἀρχιερεύς в иудейском религиозно-политическом контексте.
- source_word: ὅπως ἂν καταστῇ
  choice: чтобы он поставил
  rationale: καθίστημι здесь означает поставить или назначить людей для несения охраны; «поставил» сохраняет как назначение, так и размещение на посту.
- source_word: ἄνδρας
  choice: людей
  rationale: В контексте охраны речь идёт о мужчинах, однако русское «людей» естественно обозначает отобранный состав и не добавляет отсутствующего в тексте слова «воинов».
- source_word: οὓς ἂν ἐκλέξηται αὐτός
  choice: которых сам изберёт
  rationale: «Сам» сохраняет эмфатическое αὐτός и подчёркивает личное право первосвященника выбирать охрану.
- source_word: τοῦ φυλάσσειν αὐτήν
  choice: охранять её
  rationale: Передаёт целевое значение конструкции с инфинитивом и военный смысл φυλάσσω.
theological_decisions:
- issue: Передача ἄκρα как нарицательного названия или исторического топонима
  choice: крепость
  alternative: Акра
  rationale: Греческое слово обозначает укреплённую цитадель; нарицательное «крепость» ясно передаёт смысл, а историческое наименование «Акра» сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского указа. Синтаксис сохраняет последовательность греческих действий, но избегает неестественного буквального «даю её».
