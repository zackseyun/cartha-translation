  yaml_path: translation/deuterocanon/1_maccabees/010/056.yaml
  text: And now I will do for you what you wrote; but meet me at Ptolemais[a], so that we may see one another, and I will become related by marriage to you, just as you said.
translation:
  language: ru
  text: И теперь я сделаю для тебя то, о чём ты написал. Но встреться со мной в Птолемаиде, чтобы мы увиделись, и я вступлю с тобой в родство через брак[a], как ты и сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заключу с тобой брачный союз». Греческий глагол означает установление родства через брак; из более широкого контекста видно, что речь идёт о династическом браке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσω
  choice: я сделаю
  rationale: 'Прямо передаёт широкое значение глагола: исполнить изложенное в письме, не уточняя действие сверх греческого текста.'
- source_word: ἃ ἔγραψας
  choice: то, о чём ты написал
  rationale: Естественно по-русски указывает на содержание письма и в данном контексте яснее буквального «то, что ты написал».
- source_word: ἀπάντησον εἰς Πτολεμαΐδα
  choice: встреть меня в Птолемаиде
  rationale: Императив обозначает встречу, а оборот с εἰς — направленность к месту встречи; по-русски при глаголе «встреть» место естественно выражается предложным падежом.
- source_word: ὅπως ἰδωμεν ἀλλήλους
  choice: чтобы нам увидеться друг с другом
  rationale: Сохраняет буквальный образ взаимного видения и выражает цель естественным современным русским оборотом.
- source_word: ἐπιγαμβρεύσω
  choice: я породнюсь с тобой через брак
  rationale: Передаёт установление родства посредством брака, не добавляя прямо не названных в этом стихе участников династического брака.
- source_word: καθὼς εἴρηκας
  choice: как ты и сказал
  rationale: Естественно передаёт ссылку на ранее высказанное предложение; частица «и» подчёркивает соответствие ему.
