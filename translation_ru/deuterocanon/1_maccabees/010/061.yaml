base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/061.yaml
  text: And pestilent men from Israel gathered against him[a], lawless men, to bring charges against him[b]; but the king paid no attention to them.
translation:
  language: ru
  text: И собрались против него зловредные люди из Израиля[a], люди беззаконные, чтобы подать на него жалобу[b], но царь не обратил на них внимания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «люди, подобные заразе»; греческое выражение представляет собой необычно резкое метафорическое оскорбление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выступить с обвинением против него»; греческое выражение может обозначать жалобу, прошение против кого-либо или обвинение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν ἐπʼ αὐτόν
  choice: собрались против него
  rationale: Передаёт совместное выступление группы и враждебный смысл ἐπί в данном судебно-политическом контексте.
- source_word: ἄνδρες λοιμοί
  choice: зловредные люди
  rationale: Сохраняет резко порицательный характер метафорического λοιμοί, связанного с бедствием или заразой, но звучит естественно в современном русском тексте.
- source_word: ἐξ Ἰσραήλ
  choice: из Израиля
  rationale: Прямо обозначает происхождение или принадлежность этих людей.
- source_word: ἄνδρες παράνομοι
  choice: люди беззаконные
  rationale: Передаёт значение παράνομοι — действующие вопреки закону — и сохраняет риторический параллелизм греческой фразы.
- source_word: ἐντυχεῖν κατʼ αὐτοῦ
  choice: подать на него жалобу
  rationale: В административно-судебном контексте выражение означает обратиться к власти с жалобой или обвинением против кого-либо; русский вариант сохраняет этот смысл, не утверждая непременно формального предъявления обвинения.
- source_word: οὐ προσέσχεν αὐτοῖς
  choice: не обратил на них внимания
  rationale: Естественно передаёт отказ царя выслушать их или принять их обращение к рассмотрению.
- source_word: ὁ βασιλεύς
  choice: царь
  rationale: Обычное и контекстуально уместное русское обозначение эллинистического монарха.
