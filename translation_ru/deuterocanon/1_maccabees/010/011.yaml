lexical_decisions:
- source_word: τοὺς ποιοῦντας τὰ ἔργα
  choice: тем, кто выполнял работы
  rationale: Естественно передаёт работников, занятых строительными работами, не сужая выражение до конкретной профессии.
- source_word: οἰκοδομεῖν
  choice: обнести … укреплением
  rationale: В сочетании с κυκλόθεν и εἰς ὀχύρωσιν передаёт распоряжение о строительстве укрепления вокруг названных объектов.
- source_word: τὸ ὄρος Σιὼν
  choice: гору Сион
  rationale: Формально сохраняет ὄρος как «гора», не заменяя его более толковательным «холм».
- source_word: ἐκ λίθων τετραγώνων
  choice: из тёсаных камней
  rationale: τετράγωνος буквально указывает на камни правильной, четырёхугольной формы; в русском строительном контексте «тёсаные камни» звучит естественно и передаёт подготовленную правильную кладку.
- source_word: εἰς ὀχύρωσιν
  choice: укреплением
  rationale: Передаёт назначение строительства — оборонительное укрепление — без добавления не выраженных в источнике деталей.
