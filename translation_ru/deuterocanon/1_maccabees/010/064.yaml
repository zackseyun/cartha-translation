  yaml_path: translation/deuterocanon/1_maccabees/010/064.yaml
  text: And it happened that[a], when those who met him saw his splendor, as it had been proclaimed, and that he was clothed in linen[b], they all fled.
translation:
  language: ru
  text: И вот, когда те, кто встречал его, увидели его великолепие — как он провозгласил — и его самого, одетого в льняную одежду[b], все они бежали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «одетого в льняное полотно»; греческое слово может обозначать льняную ткань или одежду из неё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: 'И случилось так: когда'
  rationale: Передаёт повествовательный переход и временное значение греческой конструкции естественным современным русским языком.
- source_word: οἱ ἐντυγχάνοντες
  choice: встречавшие его
  rationale: Причастие обозначает людей, которые встречались с ним или попадались ему навстречу; дополнение «его» ясно из контекста.
- source_word: τὴν δόξαν αὐτοῦ
  choice: его великолепие
  rationale: В данном царском и публичном контексте δόξα прежде всего указывает на видимое величие и пышность, хотя слово допускает перевод «слава».
- source_word: καθὼς ἐκήρυξεν
  choice: как и было провозглашено
  rationale: Сохраняет значение публичного провозглашения и не вводит не названного в греческом тексте деятеля.
- source_word: περιβεβλημένον αὐτὸν σινδόνα
  choice: что он облачён в льняную одежду
  rationale: Передаёт состояние одетого или обёрнутого в σινδών — льняное полотно либо одежду — без добавления отсутствующего в тексте определения «тонкий».
- source_word: ἔφυγον πάντες
  choice: все они бежали
  rationale: Прямо передаёт сильное значение глагола φεύγω и всеобщность, выраженную πάντες.
theological_decisions:
- issue: Значение δόξα в описании царского облика
  choice: великолепие
  alternative: слава
  rationale: Контекст говорит о зримом царском великолепии, а не обязательно о богословской славе; возможная более буквальная передача отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Повтор «увидели» делает синтаксическую связь прозрачной и устраняет возможное ошибочное отнесение второго оборота к слову «великолепие».
