lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал об этом
  rationale: В повествовательном контексте аорист ἀκούω означает получение известия; добавление «об этом» естественно по-русски и не вводит нового содержания.
- source_word: ἐλυπήθη σφόδρα
  choice: сильно опечалился
  rationale: Передаёт эмоциональное значение пассивной формы λυπέω и усилитель σφόδρα ясным современным литературным языком.
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: возвратился в Антиохию
  rationale: В данном контексте ἀποστρέφω обозначает возвращение; русское «возвратился» точно и естественно передаёт движение обратно.
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: царь Александр
  rationale: Естественный русский порядок титула и имени; артикль при βασιλεύς и приложение не требуют буквального порядка «Александр, царь».
