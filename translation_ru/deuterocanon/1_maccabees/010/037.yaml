base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/037.yaml
  text: And some of them shall be appointed in the king’s great strongholds[a], and from among them some shall be appointed over the needs of the kingdom, being trustworthy; and let those over them and the rulers be from among them, and let them live by their own laws[b], just as the king commanded in the land of Judah.
translation:
  language: ru
  text: И некоторые из них будут назначены в большие царские крепости, а из их числа будут назначены ведать нуждами царства люди, заслуживающие доверия[a]. Пусть и поставленные над ними, и правители будут из их числа; и пусть они живут по своим законам[b], как повелел царь в земле Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведать делами (служебными обязанностями) царства». Греческое выражение может обозначать нужды, дела или административные обязанности царства.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пусть ходят по своим законам»; это греческий оборот со значением «жить и поступать согласно своим законам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασταθήσεται
  choice: будет назначена / будут назначены
  rationale: В административно-военном контексте будущая пассивная форма καθίστημι означает назначение на должность или пост; согласование по числу естественно передаёт подразумеваемых людей.
- source_word: ὀχυρώμασιν τοῖς μεγάλοις
  choice: в большие царские крепости
  rationale: ὀχύρωμα обозначает укреплённое место или крепость, а μεγάλοις — их величину или значимость; «большие крепости» сохраняет прямой смысл без излишнего уточнения.
- source_word: ἐπὶ χρειῶν τῆς βασιλείας
  choice: для нужд царства
  rationale: χρεῖαι может обозначать нужды, дела или служебные обязанности. Основной текст сохраняет близкое к греческому «нужды», а административный оттенок отмечен в сноске.
- source_word: οὖσιν εἰς πίστιν
  choice: заслуживающие доверия люди
  rationale: В данном контексте πίστις относится не к вере как богословскому понятию, а к надёжности людей на царской службе.
- source_word: οἱ ἐπʼ αὐτῶν
  choice: начальники над ними
  rationale: Сжатая греческая конструкция обозначает лиц, поставленных над упомянутыми служащими; перевод сохраняет её relational meaning без чрезмерной конкретизации.
- source_word: οἱ ἄρχοντες
  choice: правители
  rationale: ἄρχοντες — широкое обозначение лиц, обладающих властью; «правители» соответствует официальному тону царского распоряжения.
- source_word: πορευέσθωσαν τοῖς νόμοις αὐτῶν
  choice: пусть они живут по своим законам
  rationale: Греческое «идти/ходить по законам» идиоматически означает строить жизнь и поведение в соответствии с ними. «Жить по своим законам» естественно передаёт этот смысл по-русски.
- source_word: ἐν γῇ Ἰούδα
  choice: в земле Иуды
  rationale: Перевод сохраняет буквальное географическое выражение греческого текста, не заменяя его более интерпретирующим названием «Иудея».
theological_decisions:
- issue: Значение πίστις в выражении οὖσιν εἰς πίστιν
  choice: заслуживающие доверия
  alternative: верные; надёжные
  rationale: Контекст говорит о пригодности к царской службе, поэтому πίστις здесь выражает благонадёжность и доверие, а не богословское понятие веры.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным тоном, соответствующим царскому распоряжению. Синтаксис упрощён лишь настолько, чтобы длинная греческая фраза оставалась понятной; повтор «из их числа» сохранён как существенный акцент на назначении собственных начальников и правителей.
