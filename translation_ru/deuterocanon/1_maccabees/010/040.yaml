  text: And I also give, year by year, fifteen thousand shekels of silver from the king’s account, from the places that belong to him.
translation:
  language: ru
  text: И я также ежегодно даю пятнадцать тысяч серебряных сиклей с царского счёта[a], из областей, принадлежащих ему[b].
