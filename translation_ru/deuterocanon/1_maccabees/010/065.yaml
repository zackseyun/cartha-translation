base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/065.yaml
  text: And the king honored him[a], and enrolled him among the first friends[b], and appointed him general and governor of a district.
translation:
  language: ru
  text: Царь почтил его, внес в число первых друзей[a] и назначил военачальником и правителем округа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «первые друзья», вероятно, обозначает официальный придворный ранг; возможно также: «главные друзья».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово, переведенное как «правитель округа», обозначает административного правителя территориальной части.
    reason: cultural_note
lexical_decisions:
- source_word: ἐδόξασεν
  choice: почтил
  rationale: В придворно-политическом контексте глагол означает оказание чести или придание высокого статуса, а не богословское «прославил».
- source_word: ἔγραψεν αὐτὸν τῶν πρώτων φίλων
  choice: внес в число первых друзей
  rationale: Глагол γράφω здесь указывает на официальное зачисление или внесение в перечень; оборот «внес в число» естественно передает этот смысл по-русски.
- source_word: τῶν πρώτων φίλων
  choice: первых друзей
  rationale: Вероятно, это официальный придворный ранг. Буквальная форма сохраняет историческую терминологию и не подменяет ее более толковательным выражением «главных приближенных».
- source_word: στρατηγόν
  choice: военачальником
  rationale: Слово обозначает военную должность; «военачальник» ясно отличает ее от следующей административной должности и звучит естественно в историческом повествовании.
- source_word: μεριδάρχην
  choice: правителем округа
  rationale: Термин обозначает правителя территориальной части или округа. Такой перевод понятен без неясной транслитерации и не приписывает должности чрезмерно точного административного статуса.
