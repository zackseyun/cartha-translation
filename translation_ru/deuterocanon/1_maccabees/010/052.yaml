  source_fidelity: Перевод точно передаёт последовательность греческих аористов и сохраняет незавершённую синтаксическую цепь, завершающуюся запятой. «Вернулся в своё царство» соответствует ἀνέστρεψα εἰς τὴν βασιλείαν μου; «воссел на престоле моих отцов» адекватно передаёт династическую формулу ἐκάθισα ἐπὶ θρόνου πατέρων μου; «овладел властью», «сокрушил Димитрия» и «подчинил себе нашу страну» верно отражают ἐκράτησα τῆς ἀρχῆς, συνέτριψα и ἐπεκράτησα τῆς χώρας ἡμῶν. Формулировка «подчинил себе» несколько сильна, но находится в пределах значения установления господства и не создаёт смыслового искажения.
