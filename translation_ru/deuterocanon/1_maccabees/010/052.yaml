  text: After I returned to my kingdom and sat on the throne of my fathers[a], and took control of the rule, and crushed Demetrius and gained control of our land,
translation:
  language: ru
  text: После того как я вернулся в своё царство, воссел на престоле моих отцов[a], овладел властью, сокрушил Димитрия и подчинил себе нашу страну,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «престоле моих предков». Буквально по-гречески: «престоле моих отцов»; это династическое выражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: После того как
  rationale: В данном контексте оборот вводит предшествующие обстоятельства; русская конструкция естественно передаёт прежде всего временную последовательность, не исключая смысловой связи с дальнейшим изложением.
- source_word: ἀνέστρεψα εἰς τὴν βασιλείαν μου
  choice: я вернулся в своё царство
  rationale: Глагол обозначает возвращение, а βασιλεία здесь указывает на царство как владение или политическую область.
- source_word: ἐκάθισα ἐπὶ θρόνου πατέρων μου
  choice: воссел на престоле моих отцов
  rationale: «Воссел» естественно для достойного царского повествования, а «престол моих отцов» сохраняет буквальный династический образ греческого текста.
- source_word: ἐκράτησα τῆς ἀρχῆς
  choice: овладел властью
  rationale: Кратко и естественно передаёт обретение контроля над правлением, не уточняя, было ли оно законным или насильственным.
- source_word: συνέτριψα τὸν Δημήτριον
  choice: сокрушил Димитрия
  rationale: Сохраняет сильную военно-политическую окраску глагола συντρίβω.
- source_word: ἐπεκράτησα τῆς χώρας ἡμῶν
  choice: подчинил себе нашу страну
  rationale: Передаёт установление господства над территорией; «страна» здесь обозначает землю или область и не обязательно предполагает современное национальное государство.
theological_decisions:
- issue: Династическое выражение πατέρων μου
  choice: моих отцов
  alternative: моих предков
  rationale: Буквальное «отцов» сохраняет патрилинейную династическую формулу и не сглаживает образ исходного текста; более широкое значение отмечено в сноске.
