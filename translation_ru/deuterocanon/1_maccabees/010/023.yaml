  yaml_path: translation/deuterocanon/1_maccabees/010/023.yaml
  text: He was grieved and said[a], “What is this that we have done, that Alexander has gotten ahead of us in securing friendship with the Jews for support?”
translation:
  language: ru
  text: 'Он огорчился и сказал: «Что же это мы сделали, что Александр опередил нас, заручившись дружбой с иудеями, чтобы обрести опору[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заручившись дружбой с иудеями как опорой».'
    reason: Греческое εἰς στήριγμα может обозначать цель приобретения дружбы — обрести поддержку — или представлять эту дружбу как опору.
lexical_decisions:
- source_word: ἐλυπήθη
  choice: Он огорчился
  rationale: Передаёт эмоциональную боль и досаду в политическом контексте, не усиливая их до отчаяния.
- source_word: Τί τοῦτο ἐποιήσαμεν
  choice: Что же мы сделали?
  rationale: Естественная современная русская форма риторического самообвинения; частица «же» сохраняет эмоциональное выделение греческого τοῦτο.
- source_word: προέφθακεν ἡμᾶς
  choice: опередил нас
  rationale: Точно и естественно передаёт значение «сделал раньше нас, предупредил наши действия».
- source_word: φιλίαν
  choice: дружбой
  rationale: Сохраняет прямое значение слова, тогда как политический оттенок союзнических отношений ясен из контекста.
- source_word: καταλαβέσθαι
  choice: заручившись
  rationale: Средний залог выражает приобретение чего-либо для себя; «заручиться дружбой» естественно звучит в дипломатическом контексте.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеев
  rationale: 'Русская конструкция «заручиться дружбой кого-либо» естественно передаёт реляционный дательный: дружбу с иудеями.'
- source_word: εἰς στήριγμα
  choice: чтобы обрести опору
  rationale: Передаёт целевую направленность εἰς и образ поддержки или политической опоры, не сужая смысл до формального союза.
