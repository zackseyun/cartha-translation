    text: 'Или: «собрал большие силы». Греческое δύναμις может обозначать военную силу вообще, а не только организованное войско.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέστησεν
  choice: поставил
  rationale: В административном контексте глагол означает назначение на должность; «поставил» сохраняет официальный оттенок и близок к форме греческого текста.
- source_word: τὸν ὄντα ἐπὶ Κοίλης Συρίας
  choice: начальствовавшего над Келесирией
  rationale: Оборот обозначает властные полномочия Аполлония в области; причастная конструкция естественна для русского повествования и не уточняет конкретный титул.
- source_word: συνήγαγεν
  choice: собрал
  rationale: Передаёт основное значение «свести вместе, собрать»; военный смысл ясен из дополнения.
- source_word: δύναμιν μεγάλην
  choice: большое войско
  rationale: В военном повествовании δύναμις обозначает вооружённые силы, однако термин может быть шире формально организованной армии; эта широта отмечена в сноске.
- source_word: παρενέβαλεν
  choice: расположился лагерем
  rationale: Естественно передаёт стандартное военное значение глагола — разбить лагерь, стать лагерем.
- source_word: ἐν Ἰαμνείᾳ
  choice: в Иамнии
  rationale: Сохраняет прямое значение предлога ἐν и традиционно узнаваемую русскую форму топонима.
