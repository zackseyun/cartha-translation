  text: And Demetrius appointed Apollonius[a], who was over Coele-Syria, and he gathered a great force and encamped in Jamnia;
translation:
  language: ru
  text: И Димитрий назначил Аполлония, правителя Келесирии; тот собрал большое войско[a] и расположился лагерем в Иамнии.
