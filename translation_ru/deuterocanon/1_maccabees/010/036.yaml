base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/036.yaml
  text: And let up to thirty thousand men from the Jews be enrolled in the king’s forces[a], and provisions shall be given to them, as is fitting for all the king’s forces.
translation:
  language: ru
  text: Пусть в царские войска будут зачислены до тридцати тысяч мужчин из числа иудеев; им будет предоставлено содержание[a], как полагается всем царским войскам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «продовольствие», «паёк»; буквально — «гостеприимство». Здесь греческое ξενιά означает обеспечение, предоставляемое воинам.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγραφήθήτωσαν
  choice: пусть … будет зачислено
  rationale: Пассивная повелительная форма обозначает официальное внесение в списки для военной службы; «зачислено» естественно передаёт военно-административный смысл.
- source_word: τῶν Ἰουδαίων
  choice: из иудеев
  rationale: 'В контексте выражение имеет партитивный смысл: указанное число мужчин должно быть набрано из иудейского населения.'
- source_word: εἰς τὰς δυνάμεις τοῦ βασιλέως
  choice: в царские войска
  rationale: δυνάμεις здесь означает вооружённые силы царя; множественное число сохранено без предположений об их организационной структуре.
- source_word: εἰς τριάκοντα χιλιάδας ἀνδρῶν
  choice: до тридцати тысяч человек
  rationale: εἰς при числительном указывает предел количества — «до»; ἀνδρῶν в контексте набора в войска обозначает взрослых мужчин, тогда как по-русски «человек» после числительного звучит естественно и не меняет смысла.
- source_word: δοθήσεται
  choice: будет предоставлено
  rationale: Будущее время страдательного залога передано в официально-административном регистре.
- source_word: ξενιά
  choice: содержание
  rationale: В военно-административном контексте слово обозначает материальное обеспечение воинов, а не только гостеприимство; «содержание» сохраняет широту значения.
- source_word: ὡς καθῆκει
  choice: как и
  rationale: В данном сравнении выражение указывает на положенное по принятому порядку обеспечение; естественная русская конструкция передаёт это без тяжеловесности.
- source_word: πάσαις ταῖς δυνάμεσιν τοῦ βασιλέως
  choice: всем царским войскам
  rationale: Дательный падеж обозначает тех, кому такое обеспечение обычно полагается; военное значение δυνάμεις сохранено.
