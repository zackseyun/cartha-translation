- from: И пусть из иудеев будет зачислено в царские войска до тридцати тысяч человек; им будет предоставлено содержание[a], как и всем царским войскам.
  to: Пусть в царские войска будут зачислены до тридцати тысяч мужчин из числа иудеев; им будет предоставлено содержание[a], как полагается всем царским войскам.
