  text: And King Demetrius heard, and he gathered very many forces, and went out to meet him in battle.
translation:
  language: ru
  text: Царь Димитрий услышал об этом, собрал весьма многочисленные войска и выступил ему навстречу, чтобы сразиться с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал об этом
  rationale: Глагол вводит реакцию Димитрия на предшествующее известие; добавление «об этом» естественно для русского языка и не уточняет содержание сверх контекста.
- source_word: συνήγαγεν
  choice: собрал
  rationale: Передаёт основное значение «собрать вместе», не привнося более специального смысла военного призыва.
- source_word: δυνάμεις
  choice: войска
  rationale: В данном военном контексте множественное число обозначает вооружённые силы; «войска» естественно и сохраняет множественность.
- source_word: πολλὰς σφόδρα
  choice: весьма многочисленные
  rationale: Сочетание выражает усиленно большое количество; выбранная формулировка точна и соответствует достоинству повествовательного регистра.
- source_word: ἐξῆλθεν
  choice: выступил
  rationale: В военном контексте естественно передаёт выход навстречу противнику, не добавляя деталей о способе движения.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: ему навстречу
  rationale: Сохраняет буквальный образ движения навстречу; враждебный характер встречи выражен последующей фразой.
- source_word: εἰς πόλεμον
  choice: чтобы сразиться с ним
  rationale: Передаёт цель выхода и военный характер встречи естественным русским выражением; местоимение делает синтаксическую связь ясной.
