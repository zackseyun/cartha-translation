  yaml_path: translation/deuterocanon/1_maccabees/010/067.yaml
  text: And in the one hundred sixty-fifth year[a], Demetrius the son of Demetrius came from Crete into the land of his fathers.
translation:
  language: ru
  text: В сто шестьдесят пятом году Димитрий, сын Димитрия, прибыл с Крита в землю своих предков[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в землю своих отцов», то есть в землю предков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔτει πέμπτῳ καὶ ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: В сто шестьдесят пятом году
  rationale: Греческое составное числительное естественно передано современным русским порядковым числительным; обозначение года по селевкидской эре сохранено без добавленного пояснения в основном тексте.
- source_word: ἦλθεν
  choice: прибыл
  rationale: В данном повествовательном контексте глагол обозначает прибытие к указанному месту; «прибыл» по-русски звучит естественнее, чем буквальное «пришёл», и не добавляет лишнего смысла.
- source_word: Δημήτριος ὁ υἱὸς Δημητρίου
  choice: Димитрий, сын Димитрия
  rationale: Использована устоявшаяся русская форма имени; приложение передано ясной родословной конструкцией.
- source_word: ἐκ Κρήτης
  choice: с Крита
  rationale: Предлог ἐκ указывает на исходный пункт движения; нормативная русская форма — «с Крита».
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: в землю своих предков
  rationale: «Земля» сохраняет территориальный смысл γῆ, а «предков» естественно передаёт идиоматическое множественное πατέρων, не превращая выражение в более широкое понятие «родина».
