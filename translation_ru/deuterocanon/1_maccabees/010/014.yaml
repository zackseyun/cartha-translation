  yaml_path: translation/deuterocanon/1_maccabees/010/014.yaml
  text: But in Bethsura some of those who had abandoned the law and the commandments were left behind, for it was a refuge for them.
translation:
  language: ru
  text: Но в Бетсуре остались некоторые из тех, кто оставил Закон и заповеди, потому что она служила им убежищем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Передаёт противопоставление предыдущему контексту естественным русским союзом.
- source_word: ἐν Βεθσούροις
  choice: в Бетсуре
  rationale: Название крепости передано в традиционной русской форме и поставлено в предложный падеж.
- source_word: ὑπελείφθησάν
  choice: остались
  rationale: Форма допускает значение «были оставлены / остались»; по-русски непереходное «остались» естественно передаёт наличие уцелевшей группы без навязывания внешнего деятеля.
- source_word: τῶν καταλειπόντων τὸν νόμον καὶ τὰ προστάγματα
  choice: из тех, кто оставил Закон и заповеди
  rationale: Причастная конструкция передана ясным определительным оборотом; καταλείπω здесь означает отказ или отход, а «оставил» сохраняет сдержанный тон оригинала.
- source_word: φυγαδευτήριον
  choice: убежищем
  rationale: Обозначает место укрытия или прибежище; «убежище» ясно и естественно в данном контексте.
theological_decisions:
- issue: Соотношение «Закона» и «заповедей»
  choice: Закон и заповеди
  alternative: закон и постановления
  rationale: Сохранены два отдельных греческих понятия без их слияния; «заповеди» понятно современному читателю и соответствует контексту религиозной верности.
- issue: Смысл пассивной формы ὑπελείφθησάν
  choice: остались
  alternative: были оставлены
  rationale: Выбрана естественная русская формулировка, которая не вводит не названного в тексте деятеля; возможный пассивный оттенок остаётся неакцентированным.
translation_notes:
  register: Современный литературный русский язык; изложение краткое, повествовательное и dignified, без архаизмов. Слово «Закон» написано с прописной буквы как обозначение иудейского Закона.
