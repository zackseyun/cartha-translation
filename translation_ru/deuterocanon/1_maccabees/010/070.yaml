base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/070.yaml
  text: And he sent to Jonathan the high priest[a], saying, “You alone are lifting yourself up against us, while I have become an object of ridicule and reproach because of you[c][b]; and why do you exercise authority over us in the mountains?”
translation:
  language: ru
  text: 'И он послал к первосвященнику Ионафану с такими словами: «Ты один идёшь против нас[a], а я из-за тебя стал посмешищем и предметом поношения. Почему же ты властвуешь над нами в горах[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превозносишься над нами». Греческий глагол может выражать как выступление против кого-либо, так и самовозвышение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в горной стране». Греческое выражение может обозначать не только высокие горы, но и холмистую горную область.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλεν πρὸς … λέγων
  choice: послал … сказать
  rationale: Естественно передаёт отправку сообщения адресату, не уточняя, был ли послан гонец или письмо.
- source_word: τὸν ἀρχιερέα
  choice: первосвященнику
  rationale: Обычное русское обозначение признанной иудейской должности Ионафана.
- source_word: Σὺ μονώτατος
  choice: Ты один
  rationale: Передаёт усиленную исключительность превосходной формы μονώτατος без тяжеловесного «ты единственный».
- source_word: ἐπαίρῃ ἐφʼ ἡμᾶς
  choice: восстаёшь против нас
  rationale: В контексте враждебного вызова глагол означает выступление против кого-либо; вариант сохраняет возможный оттенок самовозвышения, отмеченный в сноске.
- source_word: ἐγενήθην εἰς καταγέλωτα καὶ ὀνειδισμόν
  choice: стал посмешищем и предметом поношения
  rationale: 'Сохраняет два параллельных существительных: публичное осмеяние и поношение.'
- source_word: διὰ σέ
  choice: из-за тебя
  rationale: Прямо и естественно выражает причинное значение διά с винительным падежом.
- source_word: ἐξουσιάζῃ ἐφʼ ἡμᾶς
  choice: властвуешь над нами
  rationale: Кратко и точно передаёт осуществление власти или контроля, не усиливая его до явно тиранического господства.
- source_word: ἐν τοῖς ὄρεσιν
  choice: в горах
  rationale: Формально соответствует греческому множественному числу; более широкое географическое значение поясняется в сноске.
