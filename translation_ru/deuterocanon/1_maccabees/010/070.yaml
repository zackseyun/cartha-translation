  verdict: revise
  source_fidelity: 'Основной смысл передан верно: адресат назван первосвященником Ионафаном, причинная связь διὰ σέ сохранена, а ἐξουσιάζῃ передано без неоправданного усиления. Однако «восстаёшь против нас» передаёт лишь враждебное выступление и не отражает возможного, заметного в ἐπαίρῃ, оттенка самовозвышения. Кроме того, конструкция «послал ... сказать» в данном контексте менее ясна, чем формула передачи послания.'
  naturalness: «И он послал к первосвященнику Ионафану с такими словами» естественно для современного литературного русского и не уточняет способ отправки. «Ты один идёшь против нас» звучит прямо и обвинительно; лексическая сноска сохраняет возможное значение самовозвышения.
  terminology: «Первосвященник», «посмешище», «поношение» и «властвуешь» уместны для историко-библейского регистра. Сноска к «горам» остаётся корректной и привязана к поясняемому выражению.
