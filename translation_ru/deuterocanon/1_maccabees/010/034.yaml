  source_fidelity: 'Черновик в целом точно передаёт перечень календарных дат, повелительную форму указа и распространение льгот на всех иудеев царства. Однако «повинностей» чрезмерно конкретизирует ἀφέσεως: в данном административном контексте это, вероятно, освобождение или снятие обязательств, но сам термин не называет именно повинности. Кроме того, «новомесячия» имеет книжно-архаический оттенок для заявленного современного литературного варианта.'
  naturalness: «Дни новолуния» и «назначенные дни» звучат современнее и яснее, чем «новомесячия» и «установленные дни». «По всему моему царству» естественно выражает территориальный охват фразы ἐν πάσῃ τῇ βασιλείᾳ μου.
  terminology: «Субботы» сохранены как календарный термин. «Освобождение от налогов и от обязательств» различает ἀτέλεια и ἄφεσις, не придавая последнему богословского значения и не закрепляя спорно узкий вид обязательств.
