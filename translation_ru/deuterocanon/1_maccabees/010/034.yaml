base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/034.yaml
  text: And let all the festivals and the Sabbaths and the new moons and the appointed days[a], and the three days before a festival and the three days after a festival, all be days of tax exemption and release for all the Jews who are in all my kingdom.
translation:
  language: ru
  text: И пусть все праздники, субботы, дни новолуния и назначенные дни, а также три дня перед праздником и три дня после праздника будут днями освобождения от налогов и от обязательств[a] для всех иудеев по всему моему царству.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может также означать «отпущение», «прощение» или «освобождение». В этом царском указе оно, по-видимому, относится к административному освобождению от обязательств.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑορταὶ
  choice: праздники
  rationale: Передаёт праздничные дни и торжества естественным современным русским словом.
- source_word: σάββατα
  choice: субботы
  rationale: Сохраняет множественное число и прямую связь с иудейским календарём.
- source_word: νουμηνίαι
  choice: новомесячия
  rationale: Устоявшееся обозначение религиозных празднований при наступлении нового месяца.
- source_word: ἡμέραι ἀποδεδειγμέναι
  choice: установленные дни
  rationale: Причастие указывает на официально назначенные или особо определённые дни.
- source_word: ἔστωσαν
  choice: пусть ... будут
  rationale: Сохраняет повелительно-постановляющую силу формулировки царского указа.
- source_word: ἀτελείας
  choice: освобождения от налогов
  rationale: В административном контексте слово обозначает освобождение от налогов, податей или сборов.
- source_word: ἀφέσεως
  choice: повинностей
  rationale: В сочетании с ἀτελείας подразумевает предоставленное властью освобождение от обязательств; добавление зависимого слова после общего «освобождения» делает смысл ясным по-русски, не придавая выражению богословского значения прощения грехов.
- source_word: πᾶσι τοῖς Ἰουδαίοις τοῖς οὖσιν ἐν πάσῃ τῇ βασιλείᾳ μου
  choice: для всех иудеев во всём моём царстве
  rationale: Естественно передаёт как получателей льгот, так и их распространение на всю территорию царства.
theological_decisions:
- issue: Значение ἀφέσεως в царском административном указе
  choice: освобождение от повинностей
  alternative: отпущение; прощение; освобождение от обязательств
  rationale: Контекст касается гражданских льгот в праздничные дни, а не прощения грехов. Вместе с тем сноска сохраняет более широкий смысл греческого слова и не сводит его к одной точно названной обязанности.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского постановления. Перечень календарных observances передан кратко и ритмично; административный смысл льгот выражен ясно, а смысловая широта ἀφέσεως сохранена в сноске.
