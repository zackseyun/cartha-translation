revisions:
- from: И пусть все праздники, субботы, новомесячия и установленные дни, а также три дня перед праздником и три дня после него будут днями освобождения от налогов и повинностей[a] для всех иудеев во всём моём царстве.
  to: И пусть все праздники, субботы, дни новолуния и назначенные дни, а также три дня перед праздником и три дня после праздника будут днями освобождения от налогов и от обязательств[a] для всех иудеев по всему моему царству.
  rationale: Правка устраняет неоправданное сужение ἄφεσις до «повинностей», обновляет книжно-архаичное «новомесячия» и делает передачу назначенных дат и территориального охвата более естественной, не меняя смысла указа.
