  yaml_path: translation/deuterocanon/1_maccabees/010/006.yaml
  text: And he gave him authority to gather forces[a], and to make weapons, and for him to be his ally, and he said that the hostages in the citadel should be handed over to him.
translation:
  language: ru
  text: И он дал ему право собирать войска, изготовлять оружие и быть его союзником, а заложников, находившихся в крепости[a], велел передать ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Акре» — укреплённой цитадели в Иерусалиме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ... ἐξουσίαν
  choice: дал ... право
  rationale: В политическом контексте ἐξουσία обозначает официально предоставленное полномочие или право; русское «дал право» естественно передаёт делегированный характер разрешения.
- source_word: συναγαγεῖν δυνάμεις
  choice: собирать войска
  rationale: δυνάμεις здесь означает военные силы, а συναγαγεῖν — их сбор; «собирать войска» ясно и естественно для современного русского языка.
- source_word: κατασκευάζειν ὅπλα
  choice: изготовлять оружие
  rationale: Сочетание κατασκευάζειν с ὅπλα в данном военном контексте указывает на изготовление или заготовку вооружения; выбран прямой и понятный перевод.
- source_word: εἶναι αὐτῷ σύμμαχον αὐτόν
  choice: быть его союзником
  rationale: σύμμαχος означает «союзник». Формулировка сохраняет сжатость греческой инфинитивной конструкции и не добавляет отсутствующих в тексте пояснений к местоимениям.
- source_word: τὰ ὅμηρα
  choice: заложников
  rationale: ὅμηρα — лица, удерживаемые как обеспечение обязательств; исторически точный русский эквивалент — «заложники».
- source_word: ἡ ἄκρα
  choice: крепость
  rationale: ἄκρα обозначает укреплённую цитадель; «крепость» понятно широкому читателю, а возможное употребление как названия иерусалимской Акры сохранено в сноске.
- source_word: εἶπεν παραδοῦναι
  choice: велел передать
  rationale: Инфинитив после εἶπεν здесь выражает распоряжение. «Велел передать» естественно передаёт директивную силу конструкции.
