  text: И царь Александр написал Ионафану, чтобы тот пришёл на встречу с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψεν
  choice: написал
  rationale: Прямое соответствие аористу γράφω; не добавляет отсутствующего в греческом тексте слова «письмо».
- source_word: ὁ βασιλεὺς Ἀλέξανδρος
  choice: царь Александр
  rationale: Естественный для русского библейского повествования порядок титула и имени.
- source_word: Ἰωνάθῃ
  choice: Ионафану
  rationale: Дательный падеж обозначает адресата написанного; «Ионафан» — традиционная русская форма имени.
- source_word: ἐλθεῖν
  choice: чтобы тот пришёл
  rationale: Передаёт инфинитив ἐλθεῖν и сохраняет направленность движения к Александру; местоимение «тот» устраняет возможную синтаксическую двусмысленность по-русски.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: к нему на встречу
  rationale: Естественно передаёт цель прихода — встречу с царём — и сохраняет отдельную от «прийти» конструкцию греческого текста.
