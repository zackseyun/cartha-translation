  naturalness: Формулировка в целом литературна и соответствует официально-административному регистру. «Чтобы они считались единым целым и чтобы не подчинялись» звучит яснее и грамматически ровнее, чем общий оборот «чтобы считаться ... и не подчиняться».
  terminology: '«Округа», «область Самарии» и «власть первосвященника» удачно передают административно-правовой контекст. Сноску к «единым целым» следует уточнить: греческое выражение буквально содержит образ нахождения «под одним», а не просто образования единого целого.'
