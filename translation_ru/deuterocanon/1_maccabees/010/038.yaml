base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/038.yaml
  text: And the three districts added to Judea from the territory of Samaria[a], let them be attached to Judea, so as to be reckoned as one[b], so as not to obey any other authority except that of the high priest.
translation:
  language: ru
  text: И три округа, присоединённые к Иудее из области Самарии[a], пусть будут присоединены к Иудее, чтобы они считались единым целым[b] и чтобы не подчинялись никакой иной власти, кроме власти первосвященника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «три нома» — эллинистический административный термин, обозначающий округа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «оказаться под одной [властью]»; то есть составить одну административную единицу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομοὺς
  choice: округа
  rationale: В эллинистическом административном употреблении νόμος обозначает территориально-административную единицу, а не «закон». «Округа» ясно и естественно передаёт этот смысл по-русски.
- source_word: προστεθέντας / προστεθήτω
  choice: присоединённые / пусть будут присоединены
  rationale: Повтор однокоренного глагола сохраняет связь причастия и повелительной формы προστίθημι и официальный характер указа.
- source_word: χώρας Σαμαρίας
  choice: области Самарии
  rationale: χώρα здесь означает территорию или область Самарии; «область» естественно звучит в административно-географическом контексте.
- source_word: πρὸς τὸ λογισθῆναι
  choice: чтобы считаться
  rationale: Конструкция выражает цель, а λογίζομαι здесь имеет официальный смысл признания или учёта в определённом качестве.
- source_word: τοῦ γενέσθαι ὑφʼ ἕνα
  choice: единым целым
  rationale: Буквально сжатая фраза означает «стать под одним»; по контексту речь идёт об объединении в одну административную единицу. Буквальная форма отмечена в сноске, чтобы не скрывать неоднозначность.
- source_word: ὑπακοῦσαι ἄλλης ἐξουσίας
  choice: подчиняться никакой иной власти
  rationale: ὑπακούω передаёт подчинение, а ἐξουσία — управляющую власть или юрисдикцию; выбранная формулировка соответствует правовому контексту.
- source_word: ἀλλʼ ἢ τοῦ ἀρχιερέως
  choice: кроме власти первосвященника
  rationale: Родительный падеж относится к подразумеваемой власти; явное повторение слова «власть» делает русскую фразу ясной, не расширяя смысл.
theological_decisions:
- issue: Характер власти первосвященника в указе
  choice: Фраза передана как указание на административно-политическую юрисдикцию первосвященника.
  alternative: Можно понимать её шире — как полное религиозное и гражданское подчинение первосвященнику.
  rationale: Контекст говорит о присоединении территорий и неподчинении иной власти. Перевод не приписывает указу более широких богословских притязаний, чем прямо выражено в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно официальным звучанием, соответствующим царскому указу. Синтаксис упрощён лишь настолько, насколько необходимо для ясности; административная терминология и смысл юрисдикции сохранены.
