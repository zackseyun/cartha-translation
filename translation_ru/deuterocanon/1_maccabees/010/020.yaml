base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/020.yaml
  text: And now today we have appointed you high priest of your nation[c][b][a], and to be called the king’s Friend—and they sent him a purple robe and a crown of gold—and to take our side and maintain friendship with us.
translation:
  language: ru
  text: И теперь, сегодня, мы поставили тебя первосвященником твоего народа, чтобы тебя называли другом царя[a]. — И послали ему пурпурную одежду и золотой венец[b]. — И чтобы ты был на нашей стороне[c] и сохранял дружбу с нами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «друг царя» могло быть официальным придворным званием при эллинистических правителях.
    reason: lexical_alternative
  - marker: b
    text: Греческий текст здесь переходит от царской речи в первом лице («мы… поставили») к повествованию в третьем лице («послали ему»); этот переход сохранён в переводе.
    reason: textual_variant
  - marker: c
    text: 'Буквально: «мыслить наше»; то есть поддерживать наши интересы, держать нашу сторону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεστάκαμέν
  choice: поставили
  rationale: В контексте официального назначения совершенная форма καθίστημι означает возведение в должность; «поставили» естественно и традиционно передаёт это в русском библейском регистре.
- source_word: ἀρχιερέα
  choice: первосвященником
  rationale: Устоявшееся русское наименование высшей иудейской священнической должности.
- source_word: τοῦ ἔθνους σου
  choice: твоего народа
  rationale: Здесь ἔθνος обозначает иудейский народ как национально-политическое целое; «народ» по-русски естественнее, чем «нация», и сохраняет корпоративный смысл.
- source_word: φίλον βασιλέως
  choice: другом царя
  rationale: Буквально передаёт выражение, которое в эллинистическом придворном обиходе могло быть официальным почётным званием; это пояснено в сноске.
- source_word: καλεῖσθαι
  choice: повелели именоваться
  rationale: Одного русского инфинитива после «поставили» недостаточно для ясной связи неоднородных назначений; «повелели» раскрывает подразумеваемую распорядительную силу царской формулы, а «именоваться» точно передаёт καλεῖσθαι.
- source_word: πορφύραν
  choice: пурпурное облачение
  rationale: Слово может обозначать пурпурную ткань или одежду; в контексте пожалования знаков достоинства подразумевается предмет одежды. «Облачение» сохраняет достоинство регистра без чрезмерной конкретизации фасона.
- source_word: στέφανον χρυσοῦν
  choice: золотой венец
  rationale: στέφανος означает венец или корону; «венец» близок греческому образу и уместен для эллинистического знака почёта.
- source_word: φρονεῖν τὰ ἡμῶν
  choice: будь же на нашей стороне
  rationale: Буквально «мыслить наше» — политическая идиома, означающая благосклонность к интересам говорящего и поддержку его стороны.
- source_word: συντηρεῖν φιλίαν πρὸς ἡμᾶς
  choice: сохраняй дружбу с нами
  rationale: Передаёт продолжительное поддержание союзно-дипломатических отношений, выраженное συντηρεῖν.
- source_word: ἀπέστειλαν αὐτῷ
  choice: послали ему
  rationale: Сохранена форма третьего лица множественного числа и переход от царской речи к повествовательному сообщению; неопределённо-личная русская конструкция не вводит отсутствующего в греческом явного субъекта.
theological_decisions:
- issue: Придворное обозначение φίλον βασιλέως
  choice: «другом царя» со сноской о возможном официальном звании
  alternative: «царским Другом» или «Другом царя»
  rationale: Выражение, вероятно, имело титулярное значение, однако прописная буква в русском тексте выглядела бы искусственно и могла бы чрезмерно предрешить степень его формализации.
- issue: Смена лица в ἀπέστειλαν αὐτῷ
  choice: 'сохранён переход к третьему лицу: «послали ему»'
  alternative: гармонизировать как «мы послали тебе»
  rationale: Предоставленный греческий текст явно переходит от первого лица множественного числа к третьему и меняет адресата с «тебя» на «ему»; сглаживание устранило бы подлинную текстовую неровность.
- issue: Синтаксическая зависимость инфинитивов καλεῖσθαι, φρονεῖν и συντηρεῖν
  choice: передана как содержание царского назначения и повеления, с естественными русскими личными формами
  alternative: 'формально сохранить цепочку инфинитивов: «и именоваться… и мыслить… и сохранять…»'
  rationale: Греческая конструкция неровна, особенно из-за вставного повествовательного сообщения. Русские личные формы делают смысл понятным, не устраняя смену речевого плана и не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным историко-библейским регистром. Слова «первосвященник», «облачение» и «венец» соответствуют сцене официального пожалования, но синтаксис остаётся доступным. Тире отмечают вставное повествовательное сообщение и возвращение к царскому обращению, не скрывая неровности греческого текста.
