  text: Ионафан жил в Иерусалиме и начал строить и обновлять город.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾤκησεν
  choice: поселился
  rationale: Аорист от οἰκέω в данном повествовательном контексте естественно передаёт начало проживания Ионафана в Иерусалиме, а не только общее состояние «жил».
- source_word: οἰκοδομεῖν
  choice: отстраивать
  rationale: Глагол означает «строить, застраивать»; в отношении существующего города русское «отстраивать» ясно передаёт строительные и восстановительные работы.
- source_word: καινίζειν
  choice: обновлять
  rationale: Сохраняет самостоятельное значение «делать новым, обновлять» и не сводит его без необходимости к одному лишь ремонту или восстановлению.
