base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/001.yaml
  text: And in the one hundred sixtieth year[a], Alexander, the son of Antiochus Epiphanes, came up and took Ptolemais, and they received him[c][b], and he reigned there.
translation:
  language: ru
  text: В сто шестидесятом году Александр, сын Антиоха Эпифана, выступил[a] и овладел Птолемаидой[b]; его приняли, и он стал там царём[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднялся» или «пошёл вверх»; в повествовании о военном походе это может означать «двинулся» или «выступил».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «захватил Птолемаиду», «занял Птолемаиду».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «царствовал там». Греческий глагол может обозначать как вступление на царство, так и осуществление царской власти.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἔτει ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: В сто шестидесятом году
  rationale: Естественная русская формула датировки, точно передающая греческое «в шестидесятом и сотом году» без уточнения эры, которой исходный текст прямо не называет.
- source_word: ἀνέβη
  choice: выступил
  rationale: В военно-историческом контексте глагол обозначает движение или поход. «Выступил» звучит естественно по-русски, а буквальный пространственный оттенок сохранён в сноске.
- source_word: ὁ τοῦ Ἀντιόχου ὁ Ἐπιφανής
  choice: сын Антиоха Эпифана
  rationale: Конструкция с родительным падежом указывает на происхождение Александра. Царский эпитет передан в традиционной русской форме «Эпифан».
- source_word: κατελάβετο
  choice: овладел
  rationale: Средняя форма выражает установление контроля над городом. «Овладел» сохраняет военно-политическую силу выражения, не уточняя без необходимости способ взятия.
- source_word: ἐπεδέξαντο αὐτόν
  choice: Жители города приняли его
  rationale: Множественное число без названного подлежащего естественно относится к людям в Птолемаиде. «Приняли» сохраняет открытым, шла ли речь о приветствии, политическом признании или о том и другом.
- source_word: ἐβασίλευσεν ἐκεῖ
  choice: он стал там царём
  rationale: Аорист после принятия Александра городом допускает начинательное значение — вступление на царство. В сноске сохранено также возможное значение осуществления царской власти.
theological_decisions:
- issue: 'Значение ἐβασίλευσεν: вступление на царство или царствование'
  choice: стал там царём
  alternative: царствовал там
  rationale: Контекст последовательных завершённых действий поддерживает начинательное понимание, однако форма сама по себе допускает и значение «царствовал», поэтому альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Короткие последовательные фразы передают греческий паратаксис без тяжеловесного многократного «и». Название «Птолемаида» и эпитет «Эпифан» даны в традиционных русских формах.
