  source_fidelity: 'Перевод точно передаёт оба глагола в форме множественного числа: находившиеся/люди из крепости передали заложников Ионафану и они же возвратили их родителям. Это следует греческому тексту (παρέδωκαν ... ἀπέδωκαν), не перенимая без достаточного основания английское смысловое уточнение «он возвратил». «Заложники» адекватно передаёт τὰ ὅμηρα, а «родителям» — τοῖς γονεῦσιν αὐτῶν.'
