  text: And those from the citadel handed over the hostages to Jonathan[a], and he returned them to their parents.
translation:
  language: ru
  text: И находившиеся в крепости[a] передали заложников Ионафану и возвратили их родителям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово ἄκρα означает укреплённую цитадель; эту иерусалимскую крепость традиционно называют Акрой.
    reason: cultural_note
lexical_decisions:
- source_word: παρέδωκαν
  choice: передали
  rationale: Глагол означает «передать, выдать»; «передали» естественно передаёт действие без добавления правового или враждебного оттенка.
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: находившиеся в крепости
  rationale: Оборот обозначает людей, связанных с укреплённой цитаделью в Иерусалиме. Такая формулировка естественна по-русски и не уточняет их пол или статус сверх греческого текста.
- source_word: Ἰωναθὰν
  choice: Ионафану
  rationale: Традиционная русская форма имени; несклоняемая греческая форма здесь по синтаксису обозначает косвенный объект.
- source_word: τὰ ὅμηρα
  choice: заложников
  rationale: ὅμηρα обозначает заложников; последующее местоимение мужского рода и упоминание родителей подтверждают, что речь идёт о людях, а не об отвлечённых залогах.
- source_word: ἀπέδωκαν
  choice: возвратили
  rationale: Форма глагола имеет множественное число и означает «отдали обратно, возвратили». Русское множественное число сохраняет грамматику греческого текста, не заменяя её единственным числом.
- source_word: τοῖς γονεῦσιν αὐτῶν
  choice: их родителям
  rationale: γονεῖς означает родителей; это точнее, чем более широкое «семьям».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным синтаксисом. Множественное число «возвратили» следует непосредственно греческому ἀπέδωκαν и сохраняет имеющуюся в исходном тексте смысловую напряжённость, хотя английский консультационный текст истолковывает субъект как Ионафана.
