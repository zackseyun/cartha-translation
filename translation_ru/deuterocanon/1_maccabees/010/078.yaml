  text: And he pursued him to Azotus[a], and the camps joined battle behind him.
translation:
  language: ru
  text: И он преследовал его до Азота, и войска позади него вступили в бой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «и войска вслед за ним вступили в бой». Греческое выражение может указывать как на положение позади него, так и на следование за ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδίωξεν ὀπίσω αὐτοῦ
  choice: преследовал его
  rationale: Военный контекст требует активного «преследовал»; сочетание с ὀπίσω αὐτοῦ по-русски естественно передаётся прямым дополнением без избыточного «вслед за ним».
- source_word: εἰς Ἄζωτον
  choice: до Азота
  rationale: εἰς обозначает направление и предел преследования; «до Азота» естественно передаёт движение к городу. «Азот» — закрепившаяся русская библейская форма названия.
- source_word: αἱ παρεμβολαί
  choice: войска
  rationale: В данном повествовании речь идёт не о неподвижных лагерях, а о военных силах, вступающих в сражение; «войска» ясно передаёт контекстуальное значение множественного числа.
- source_word: συνῆψαν … εἰς πόλεμον
  choice: вступили в бой
  rationale: В военном контексте συνάπτω с εἰς πόλεμον означает начало непосредственного боевого столкновения; выбранная формулировка точна и естественна по-русски.
- source_word: ὀπίσω αὐτοῦ
  choice: позади него
  rationale: Сохранено пространственное значение «позади него» и не устранена возможная соотнесённость местоимения с одним из участников преследования.
