base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/063.yaml
  text: And the king seated him with himself[a], and said to his officials, “Go out with him into the middle of the city, and proclaim that no one is to bring a complaint against him about any matter, and let no one trouble him for any reason.”
translation:
  language: ru
  text: 'Царь посадил его рядом с собой и сказал своим сановникам: «Выйдите вместе с ним в центр города и провозгласите, чтобы никто не подавал против него жалобы ни по какому делу[a] и никто не беспокоил его ни по какому поводу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы никто не обращался против него с ходатайством ни по какому делу». Греческий глагол может означать обращение или подачу прошения, здесь, вероятно, в официальном или судебном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθισεν αὐτὸν ὁ βασιλεὺς μετʼ αὑτοῦ
  choice: Царь посадил его рядом с собой
  rationale: Передаёт каузативное значение καθίζω («посадить») и почётное место рядом с царём; по-русски звучит естественно.
- source_word: τοῖς ἄρχουσιν
  choice: своим сановникам
  rationale: В придворном контексте ἄρχοντες обозначает облечённых властью царских должностных лиц; «сановники» сохраняет высокий, но понятный регистр без военной конкретизации.
- source_word: Ἐξέλθατε μετʼ αὐτοῦ εἰς μέσον τῆς πόλεως
  choice: Выйдите вместе с ним на середину города
  rationale: Близко передаёт движение εἰς μέσον и публичное центральное место объявления, не добавляя прямо не выраженного в греческом значения «сопровождайте».
- source_word: κηρύξατε
  choice: провозгласите
  rationale: Сохраняет официальный и публичный характер объявления глашатая.
- source_word: τοῦ μηδένα ἐντυγχάνειν κατὰ τούτου περὶ μηδενὸς πράγματος
  choice: чтобы никто не подавал против него жалобы ни по какому делу
  rationale: В сочетании с κατά глагол ἐντυγχάνω вероятно обозначает официальное или судебное обращение против лица. «Подавал жалобы» ясно выражает этот смысл, а примечание сохраняет более широкую возможность «обращаться с прошением».
- source_word: μηδεὶς αὐτῷ ἐνοχλείτω
  choice: никто не беспокоил его
  rationale: Передаёт широкое значение ἐνοχλέω — беспокоить, докучать, причинять затруднения — без неоправданного усиления до «преследовать».
- source_word: περὶ παντὸς λόγου
  choice: ни по какому поводу
  rationale: Передаёт всеохватность выражения и позволяет избежать тяжёлого повтора слова «дело» после πρᾶγμα.
