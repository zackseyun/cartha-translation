  yaml_path: translation/deuterocanon/1_maccabees/010/082.yaml
  text: And Simon deployed his force and joined battle with the phalanx[a], for the cavalry had been thrown into disorder[c][b]; and they were crushed by him and fled.
translation:
  language: ru
  text: И Симон развернул свои силы и вступил в бой с фалангой, потому что конница пришла в расстройство[a]. Они были сокрушены им и бежали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «конница распалась»; то есть потеряла строй и согласованность.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλυσεν
  choice: развернул
  rationale: В сочетании с «свои силы» глагол описывает введение войска в действие или его боевое развёртывание; буквальное «распустил» по-русски передало бы неверный смысл.
- source_word: τὴν δύναμιν αὐτοῦ
  choice: свои силы
  rationale: Здесь δύναμις означает воинский контингент или боевую силу; множественное «силы» естественно для современного русского военного повествования и не завышает масштаб до целой армии.
- source_word: συνῆψεν πρὸς τὴν φάλαγγα
  choice: вступил в бой с фалангой
  rationale: Оборот означает непосредственное боевое столкновение; формулировка ясна и сохраняет исторически конкретное обозначение строя φάλαγξ.
- source_word: ἡ ἵππος
  choice: конница
  rationale: Буквально «конь/лошадь», но в данном военном контексте это собирательное обозначение конницы.
- source_word: ἐξελύθη
  choice: пришла в расстройство
  rationale: Пассивная форма передаёт утрату конницей строя и согласованности, не предвосхищая последующее прямое сообщение о бегстве.
- source_word: συνετρίβησαν
  choice: были сокрушены
  rationale: Глагол выражает решительный разгром в сражении; пассивная конструкция сохранена.
- source_word: ἀπʼ αὐτοῦ
  choice: им
  rationale: В данном контексте оборот естественно обозначает Симона как деятеля, нанесшего поражение; русская форма «им» прямо и кратко передаёт это отношение.
