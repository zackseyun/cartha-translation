lexical_decisions:
- source_word: καὶ ἐγένετο ὡς
  choice: 'И случилось так: когда'
  rationale: Сохранена повествовательная переходная формула ἐγένετο, но передана естественной для современного русского повествования конструкцией.
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямое и контекстуально естественное соответствие аористу ἀκούω; вариант «узнал» был бы более толковательным.
- source_word: τοὺς λόγους τούτους
  choice: эти слова
  rationale: Формально соответствует λόγους и сохраняет связь с предшествующей речью или сообщением, не сужая значение до «вести».
- source_word: προσέθετο δοξάσαι
  choice: стал оказывать … ещё больше почестей
  rationale: Передаёт добавочное или усилительное значение προσέθετο и политико-общественный смысл δοξάσαι. Русское выражение естественно и не вносит богословски окрашенного значения «прославлять».
- source_word: τὸν Ἰωναθάν
  choice: Ионафану
  rationale: Традиционная русская форма имени; дательный падеж обусловлен конструкцией «оказывать почести».
