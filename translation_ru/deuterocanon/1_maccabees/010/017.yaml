lexical_decisions:
- source_word: ἔγραψεν
  choice: написал
  rationale: 'Аорист γράφω прямо обозначает завершённое действие: «написал».'
- source_word: ἐπιστολὰς
  choice: письма
  rationale: Форма винительного падежа множественного числа ясно указывает на несколько писем; нейтральное современное соответствие — «письма».
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Аорист ἀποστέλλω естественно передаётся глаголом «послал»; он сохраняет повествовательный стиль и связь однородных сказуемых.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж местоимения означает «ему»; имя адресата не добавляется, поскольку в греческом тексте здесь стоит местоимение.
