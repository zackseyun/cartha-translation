  text: and let us establish friendship with him[a]. And now, give me your daughter as a wife, and I will become related by marriage to you[b], and I will give gifts to you and to her worthy of you.
translation:
  language: ru
  text: и заключим с ним дружбу[a]. А теперь отдай мне свою дочь в жёны, и я породнюсь с тобой через брак[b] и дам тебе и ей дары, достойные тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заключим с ним союз»; буквально по-гречески — «дружбу», но в данном царском контексте речь, вероятно, идёт также о политическом союзе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я войду в твою семью через брак». Греческий глагол означает вступление в родственную связь посредством брака.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνστήσωμεν
  choice: заключим
  rationale: Побудительный конъюнктив выражает совместное предложение; сочетание «заключим дружбу» естественно передаёт установление отношений и уместно в дипломатическом контексте.
- source_word: φιλίαν
  choice: дружбу
  rationale: Сохранено прямое значение существительного; в царском контексте оно может подразумевать также политический союз, что отмечено в сноске.
- source_word: δός μοι τὴν θυγατέρα σου εἰς γυναῖκα
  choice: отдай мне свою дочь в жёны
  rationale: Передаёт брачную формулу и её династически-договорной оттенок, оставаясь понятным на современном русском языке.
- source_word: ἐπιγαμβρεύσω
  choice: я породнюсь с тобой через брак
  rationale: Глагол обозначает вступление в родство посредством брака; перевод сохраняет акцент не только на женитьбе, но и на возникновении родственной связи.
- source_word: δόματα
  choice: дары
  rationale: Общее значение слова сохранено без добавления отсутствующего в греческом уточнения «свадебные».
- source_word: ἄξιά σου
  choice: достойные тебя
  rationale: Близко передаёт мысль о дарах, соответствующих достоинству и положению адресата, сохраняя личное обращение.
