lexical_decisions:
- source_word: ἐπεκρίθη … λέγων
  choice: ответил
  rationale: Естественная русская передача формулы ответа; отдельное «сказав» было бы избыточно.
- source_word: Ἀγαθὴ ἡμέρα
  choice: Добрый это день
  rationale: Сохраняет эмфатическую именную конструкцию и торжественно-положительную оценку дня.
- source_word: γῆν πατέρων σου
  choice: землю своих отцов
  rationale: Передаёт родовую землю предков без добавочного толкования.
- source_word: ἐκάθισας ἐπὶ θρόνου
  choice: воссел на престоле
  rationale: Дигнифицированная и естественная формула вступления на царский престол.
- source_word: βασιλείας αὐτῶν
  choice: их царства
  rationale: Сохраняет местоименную отсылку к отцам и возможную смысловую напряжённость выражения.
