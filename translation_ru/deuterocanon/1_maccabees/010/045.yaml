  yaml_path: translation/deuterocanon/1_maccabees/010/045.yaml
  text: and for the walls of Jerusalem to be rebuilt and fortified all around[a], the expense will be paid from the king’s treasury, and for the walls in Judea to be rebuilt.
translation:
  language: ru
  text: И чтобы стены Иерусалима были отстроены и укреплены со всех сторон, расходы будут покрыты из царской казны[a], и чтобы были отстроены стены в Иудее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «расходы будут покрыты по распоряжению царя». Греческое выражение допускает как финансово-учётный смысл, так и указание на царский приказ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθῆναι / οἰκοδομῆσαι
  choice: были отстроены
  rationale: Глагол обозначает строительство; применительно к существующим городским укреплениям «отстроены» естественно передаёт их восстановление, не усиливая смысл до полной перестройки.
- source_word: τὰ τείχη
  choice: стены
  rationale: Обычное значение — городские или крепостные стены; более широкое «укрепления» выходило бы за пределы греческого слова.
- source_word: ὀχυρῶσαι
  choice: укреплены
  rationale: Глагол означает сделать прочными и обороноспособными; «укреплены» точно и естественно сочетается со стенами.
- source_word: κυκλόθεν
  choice: со всех сторон
  rationale: Передаёт пространственное значение «кругом, повсюду вокруг» современным литературным русским языком.
- source_word: ἡ δαπάνη δοθήσεται
  choice: расходы будут покрыты
  rationale: Буквально «расход будет дан»; в финансово-административном контексте русское «расходы будут покрыты» ясно передаёт смысл.
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  choice: из царской казны
  rationale: При упоминании расходов λόγος допускает финансово-учётный смысл. «Из царской казны» естественно обозначает источник средств, хотя греческая фраза допускает и понимание как царского распоряжения; это отмечено в сноске.
- source_word: Ἰουδαίᾳ
  choice: Иудее
  rationale: В эллинистическом контексте географическое название обозначает Иудею.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно официальным тоном, соответствующим царскому административному обещанию. Сохранена синтаксическая связь с окружающим перечнем посредством начального «и чтобы»; добавление «а также» делает заключительную однородную конструкцию ясной по-русски.
