base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/058.yaml
  text: And King Alexander met him and gave him Cleopatra his daughter[a], and he held her wedding in Ptolemais, as kings do[b], with great splendor.
translation:
  language: ru
  text: Царь Александр встретил его и выдал за него свою дочь Клеопатру[a]. Он устроил её свадьбу в Птолемаиде по-царски[b], с великой пышностью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдал ему в жёны свою дочь Клеопатру». Греческий глагол в данном контексте прямо указывает на выдачу замуж.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как цари»; также возможно: «по обычаю царей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήντησεν
  choice: встретил
  rationale: Глагол означает «встретить» или «выйти навстречу»; простой вариант «встретил» естественен по-русски и не уточняет направление движения, которого контекст не требует.
- source_word: ἐξέδοτο
  choice: выдал за него
  rationale: В брачном контексте средняя форма ἐκδίδωμι означает «выдать замуж». Местоимение «за него» ясно указывает на адресата и передаёт брачный смысл глагола.
- source_word: Κλεοπάτραν τὴν θυγατέρα αὐτοῦ
  choice: свою дочь Клеопатру
  rationale: Такой порядок слов наиболее естественен в современном русском языке и точно передаёт приложение в греческом тексте.
- source_word: ἐποίησεν τὸν γάμον αὐτῆς
  choice: устроил её свадьбу
  rationale: Сочетание ποιέω с γάμος означает устроить или отпраздновать свадьбу; выбранный вариант современен и сохраняет событийный смысл.
- source_word: ἐν Πτολεμαΐδι
  choice: в Птолемаиде
  rationale: Использована традиционная русская форма греческого топонима с нормативным предложным падежом.
- source_word: καθὼς οἱ βασιλεῖς
  choice: по-царски
  rationale: Кратко и естественно передаёт значение «как [делают] цари», то есть в подобающей царям манере; буквальная альтернатива сохранена в сноске.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: с великой пышностью
  rationale: В описании свадебной церемонии δόξα обозначает великолепие и почёт, а не богословскую «славу»; «пышность» естественно передаёт царский размах торжества.
