  text: And he said[b][a], “Will we find one man like this? And now let us make him our friend and ally.”
translation:
  language: ru
  text: 'И сказал он: «Разве найдём мы хотя бы одного такого человека? А теперь сделаем его нашим другом[a] и союзником».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «друг» здесь может обозначать не только личную привязанность, но и официальный политический статус при эллинистическом дворе.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ εὑρήσομεν
  choice: Разве найдём мы
  rationale: Сочетание μή с будущим изъявительного наклонения вводит риторический вопрос, предполагающий отрицательный ответ. Русское «разве» естественно передаёт эту силу, не превращая вопрос в прямое утверждение.
- source_word: ἄνδρα τοιοῦτον ἕνα
  choice: хотя бы одного такого человека
  rationale: ἄνδρα обозначает мужчину, но в данном русском обороте «человек» естественно относится к конкретному мужчине; «хотя бы одного» передаёт подчёркнутую единичность ἕνα в риторическом вопросе.
- source_word: καὶ νῦν
  choice: А теперь
  rationale: В русском «а теперь» естественно обозначает переход от оценки к предлагаемому действию, сохраняя последовательность греческого выражения.
- source_word: ποιήσωμεν αὐτὸν
  choice: сделаем его
  rationale: Сохранено прямое значение ποιέω; в сочетании с дополнениями выражение понятно как установление политических отношений.
- source_word: φίλον
  choice: другом
  rationale: «Друг» сохраняет отличие φίλος от следующего σύμμαχος, хотя в эллинистической придворной речи слово могло обозначать официальный статус.
- source_word: σύμμαχον
  choice: союзником
  rationale: Точно передаёт политический или военный союз, выраженный словом σύμμαχος.
