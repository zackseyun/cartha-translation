  yaml_path: translation/deuterocanon/1_maccabees/010/049.yaml
  text: And the two kings joined battle[a], and Demetrius's camp fled, and Alexander pursued him and prevailed over them.
translation:
  language: ru
  text: И два царя вступили в бой, и войско Димитрия обратилось в бегство; Александр преследовал его и одержал верх над ними.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте местоимения меняют число: Александр «преследовал его и одержал верх над ними». Вероятно, «его» относится к Димитрию как предводителю, а «ними» — к его войску.'
    reason: Сохранён переход от единственного числа к множественному, который может показаться читателю неожиданным.
lexical_decisions:
- source_word: συνῆψαν πόλεμον
  choice: вступили в бой
  rationale: Греческий военный оборот означает начало непосредственного сражения; русский вариант естественен и сохраняет значение без лишнего усиления.
- source_word: οἱ δύο βασιλεῖς
  choice: два царя
  rationale: Прямая передача явно названного подлежащего.
- source_word: ἡ παρεμβολὴ Δημητρίου
  choice: стан Димитрия
  rationale: παρεμβολή обозначает стан, лагерь или находящееся в нём войско. «Стан» сохраняет конкретный образ и допускает метонимическое обозначение сил Димитрия.
- source_word: ἔφυγεν
  choice: обратился в бегство
  rationale: Точно передаёт простое значение глагола «бежать» в военном контексте, не добавляя прямо не выраженной идеи полного разгрома.
- source_word: ἐδίωξεν αὐτόν
  choice: преследовал его
  rationale: Сохраняет единственное число греческого местоимения; естественным референтом является Димитрий как предводитель.
- source_word: ἴσχυσεν ἐπʼ αὐτούς
  choice: одержал верх над ними
  rationale: Передаёт превосходство Александра над противниками, не усиливая выражение до безоговорочного полного уничтожения.
