base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/077.yaml
  text: And Apollonius heard[a], and he encamped with three thousand cavalry and a large force, and went to Azotus as though passing through, and at the same time advanced into the plain[b], because he had a multitude of cavalry and trusted in it.
translation:
  language: ru
  text: Аполлоний услышал об этом, расположился лагерем с тремя тысячами всадников и многочисленным войском и направился в Азот, делая вид, будто лишь проходит мимо[a]. В то же время он продвигался на равнину, потому что у него была многочисленная конница[b] и он полагался на неё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «как бы проходя через». Греческий оборот представляет его движение как обычный проход, а не как открытое нападение.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте буквально стоит собирательное слово «конь», обозначающее конные войска.
    reason: cultural_note
lexical_decisions:
- source_word: παρενέβαλεν
  choice: расположился лагерем с
  rationale: В военном повествовании глагол обозначает устройство лагеря. Предлог «с» естественно связывает действие с перечисленными далее войсками, стоящими в винительном падеже.
- source_word: τρισχιλίαν ἵππον
  choice: тремя тысячами всадников
  rationale: ἵππος употреблено собирательно в значении конницы; при точном числе по-русски естественнее назвать отдельных всадников.
- source_word: δύναμιν πολλήν
  choice: многочисленным войском
  rationale: δύναμις здесь означает военную силу, а не отвлечённое могущество; «войско» ясно передаёт контекст.
- source_word: ἐπορεύθη εἰς Ἄζωτον
  choice: направился к Азоту
  rationale: Нейтрально передаёт движение к городу, не уточняя сверх греческого текста, вошёл ли он в него.
- source_word: ὡς διοδεύων
  choice: делая вид, будто лишь проходит мимо
  rationale: Оборот передаёт видимость транзитного движения и вероятный оттенок притворства, не превращая его в прямое утверждение о намерении.
- source_word: ἅμα προσῆγεν εἰς τὸ πεδίον
  choice: В то же время он продвигался на равнину
  rationale: ἅμα выражает одновременность, а προσάγω в данном военном контексте — продвижение вперёд. «На равнину» сохраняет направленность εἰς.
- source_word: πλῆθος ἵππου
  choice: многочисленная конница
  rationale: Собирательное ἵππος здесь обозначает конные войска; сочетание с πλῆθος указывает на их многочисленность.
- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: полагался на неё
  rationale: Совершенная форма выражает устойчивую уверенность, а местоимение естественно отнесено к непосредственно предшествующей коннице.
