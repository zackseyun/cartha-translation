  text: Аполлоний тайно оставил позади них тысячу всадников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλειπεν
  choice: оставил
  rationale: 'Передаёт простое действие глагола: Аполлоний оставил часть конницы позади основных сил.'
- source_word: χιλίαν ἵππον
  choice: тысячу всадников
  rationale: Собирательное употребление ἵππος в военном контексте обозначает конницу; по-русски естественно выразить численность как «тысячу всадников».
- source_word: κρυπτῶς
  choice: тайно
  rationale: Наречие означает скрытно, так, чтобы противник не заметил; «тайно» сохраняет его наречную форму и связь с действием.
- source_word: κατόπισθεν αὐτῶν
  choice: у них в тылу
  rationale: В военной сцене выражение указывает на расположение позади противника; «у них в тылу» ясно и естественно передаёт тактический смысл, не уточняя способ укрытия.
