  source_fidelity: 'Основной смысл передан верно: дипломатическая верность, сохранение дружеских отношений и отказ присоединиться к врагам. Однако «соблюдая договоры» перестраивает греческую конструкцию в деепричастный оборот и несколько сужает связь πίστις с договорами. Более близко и естественно: «сохранили верность нам в договорах». Не выраженный в греческом объект «об этом» лучше не вводить в основной текст, особенно при намеренно оборванной фразе.'
