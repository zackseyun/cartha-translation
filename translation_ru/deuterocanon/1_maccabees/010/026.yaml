lexical_decisions:
- source_word: ἐπεὶ
  choice: поскольку
  rationale: Союз вводит основание для последующего сообщения; «поскольку» естественно передаёт причинный смысл.
- source_word: συνετηρήσατε πίστιν πρὸς ἡμᾶς
  choice: вы сохранили верность нам
  rationale: В дипломатическом контексте πίστις означает надёжность, верность или лояльность; «сохранили верность нам» точно и естественно передаёт это значение.
- source_word: συνθήκας
  choice: соблюдая договоры
  rationale: Речь идёт о формальных политических соглашениях. Деепричастная конструкция делает связь с сохранением верности ясной по-русски, не меняя дипломатического смысла.
- source_word: ἐνεμείνατε τῇ φιλία ἡμῶν
  choice: остались в дружбе с нами
  rationale: Глагол означает продолжать твёрдо держаться отношений; φιλία здесь сохраняет прямой смысл дружбы с возможным политическим оттенком союза.
- source_word: οὐ προσεχωρήσατε τοῖς ἐχθροῖς ἡμῶν
  choice: не примкнули к нашим врагам
  rationale: προσχωρέω обозначает присоединение к другой стороне; «примкнули» уместно в военно-политическом контексте.
- source_word: ἠκούσαμεν
  choice: мы услышали об этом
  rationale: Аорист передан прошедшим временем. «Об этом» эксплицирует подразумеваемый объект и делает оборот естественным по-русски, при этом незавершённость фразы сохраняется.
theological_decisions:
- issue: Значение πίστις в политико-дипломатическом контексте
  choice: верность
  alternative: вера; преданность; лояльность
  rationale: Здесь речь не о вероучительной вере, а о надёжности в договорных отношениях. «Верность» сохраняет широкий смысл слова и естественно сочетается с отношением к адресату.
translation_notes:
