  yaml_path: translation/deuterocanon/1_maccabees/010/039.yaml
  text: Ptolemais and the territory adjoining it I have given as a gift to the holy ones in Jerusalem[b][a], for the expenses that come first for the holy place.
translation:
  language: ru
  text: Птолемаиду и прилегающую к ней область[a] я отдал в дар святым в Иерусалиме — на первоочередные расходы для святых.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Птолемаиду и всё, что к ней относится»; или: «Птолемаиду и присоединённую к ней округу».'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная часть греческого текста сформулирована неясно. Буквально: «на первоочередные расходы для святых». В храмово-финансовом контексте она может подразумевать расходы для святыни, священных нужд или священного служения.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πτολεμαΐδα
  choice: Птолемаиду
  rationale: Традиционная русская передача греческого названия города; винительный падеж соответствует его синтаксической роли.
- source_word: τὴν προσκυροῦσαν αὐτῇ
  choice: прилегающую к ней область
  rationale: Причастный оборот обозначает территорию, примыкающую к городу или административно связанную с ним; добавление слова «область» естественно выражает подразумеваемый географический объект.
- source_word: δέδωκα
  choice: я отдал
  rationale: Греческий перфект обозначает совершённое пожалование с сохраняющимся результатом; в русском дипломатическом повествовании это естественно передаётся совершенным прошедшим временем.
- source_word: δόμι
  choice: в дар
  rationale: Необычная форма текста относится к лексике дара или пожалования; «в дар» кратко и идиоматично передаёт её вероятный смысл.
- source_word: τοῖς ἁγίοις τοῖς ἐν Ἰερουσαλήμ
  choice: святым, находящимся в Иерусалиме
  rationale: Форма мужского/субстантивированного множественного числа грамматически поддерживает отнесение к святым людям или посвящённому сообществу; перевод не подменяет их единственным числом «святилищу».
- source_word: εἰς τὴν προκαθήκουσαν δαπάνην
  choice: на первоочередные расходы
  rationale: Передаёт идею расходов, стоящих прежде, назначенных заранее или имеющих преимущественное значение, не создавая неестественной русской конструкции.
- source_word: τοῖς ἁγίοις
  choice: по святыне
  rationale: В заключительной дательной форме возможна связь с сакральными нуждами, святыней или священным служением; контекст расходов позволяет передать культовое назначение, сохранив неопределённость в примечании.
theological_decisions:
- issue: К кому или чему относится первое τοῖς ἁγίοις
  choice: к святым людям или посвящённому сообществу в Иерусалиме
  alternative: к Иерусалимскому святилищу
  rationale: Грамматическая форма множественного числа естественно указывает на лиц; замена её на единственное «святилищу» была бы толковательным упрощением.
- issue: Смысл заключительного τοῖς ἁγίοις в финансово-храмовом контексте
  choice: расходы, относящиеся к святыне или священным нуждам
  alternative: необходимые расходы для святых людей
  rationale: Греческая фраза неловка и допускает оба понимания. Основной текст отражает храмовый контекст, а примечание сохраняет личное прочтение как реальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского пожалования. Синтаксис упрощён для ясности, но неоднозначность двух употреблений τοῖς ἁγίοις не устранена без примечания.
