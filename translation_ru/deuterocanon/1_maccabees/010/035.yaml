  text: And no one will have authority to act against or harass any of them in any matter.
translation:
  language: ru
  text: И никто не будет вправе взыскивать[a] с кого-либо из них или притеснять его по какому бы то ни было делу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предпринимать действия против». Греческий глагол может обозначать как взыскание с человека, так и действие в отношении него.'
    reason: Сохраняет лексическую неоднозначность πρᾶξαι, которую контекст склоняет к юридико-финансовому взысканию, но не устраняет полностью.
lexical_decisions:
- source_word: οὐχ ἕξει ἐξουσίαν οὐδεὶς
  choice: никто не будет вправе
  rationale: Передаёт юридический смысл ἐξουσία как права или полномочия в контексте царского указа и естественно звучит по-русски.
- source_word: πρᾶξαι
  choice: взыскивать
  rationale: При личном дополнении πράσσω может означать взыскание с кого-либо; контекст предоставляемых льгот поддерживает этот юридико-финансовый смысл, хотя греческое слово допускает и более широкое понимание.
- source_word: παρενοχλεῖν
  choice: притеснять
  rationale: Передаёт причинение неприятностей, давление и враждебное вмешательство, не сужая значение до одного вида преследования.
- source_word: τινα αὐτῶν
  choice: с кого-либо из них … его
  rationale: Сохраняет отнесение запрета к любому отдельному человеку из защищаемой группы; местоимение связывает оба однородных действия с одним лицом.
- source_word: περὶ παντὸς πράγματος
  choice: по какому бы то ни было делу
  rationale: Сохраняет всеохватность выражения и широкое значение πρᾶγμα — дело, вопрос или обстоятельство.
