  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: понял
  rationale: Аорист γινώσκω передаёт наступившее в ходе событий осознание; «понял» естественно выражает этот момент, не сводя его к статическому «знал».
- source_word: ἔνεδρον
  choice: засада
  rationale: Слово обозначает засаду или отряд, находящийся в засаде. «Засада» кратко и без лишнего уточнения сохраняет собирательную широту греческого существительного.
- source_word: κατόπισθεν αὐτοῦ
  choice: позади него
  rationale: Оборот прямо указывает на положение в тылу Ионафана; «позади него» точно и естественно передаёт пространственное значение.
- source_word: ἐστιν
  choice: находится
  rationale: Настоящее время глагола εἰμί здесь утверждает наличие и расположение засады; «находится» позволяет естественно передать оба оттенка по-русски.
- source_word: καὶ
  choice: И
  rationale: Союз связывает предложение с предыдущим повествованием без добавления причинного или временного толкования.
