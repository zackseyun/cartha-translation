  yaml_path: translation/deuterocanon/1_maccabees/010/075.yaml
  text: And he encamped against Joppa[a], and those from the city shut him out, because a garrison of Apollonius was in Joppa[b]; and they fought against it.
translation:
  language: ru
  text: Он расположился лагерем против Иоппии, и жители города не впустили его, потому что в Иоппии находился гарнизон Аполлония; и они воевали против неё.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Неё» — то есть Иоппии, городу.
    reason: referent_clarification
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Ἰόππην
  choice: расположился лагерем против Иоппии
  rationale: В военном контексте παρεμβάλλω означает разбить или расположить лагерь; ἐπί с винительным передаёт направленность действий против города.
- source_word: ἀπέκλεισαν αὐτόν
  choice: не впустили его
  rationale: ἀποκλείω буквально означает «закрыть доступ, оставить снаружи»; естественное русское выражение передаёт отказ во входе в город без добавления отсутствующих в греческом тексте ворот.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: жители города
  rationale: Буквально «те, кто из города». В данном повествовании «жители города» звучит естественно и не вводит излишне узкого указания только на мужчин.
- source_word: φρουρὰ Ἀπολλωνίου
  choice: гарнизон Аполлония
  rationale: φρουρά здесь обозначает размещённый в городе военный гарнизон, находящийся под властью или на стороне Аполлония.
- source_word: ἐπολέμησαν αὐτήν
  choice: они вступили с ней в бой
  rationale: πολεμέω означает воевать или сражаться против; женское местоимение αὐτήν грамматически соотносится с Иоппией, то есть с городом.
