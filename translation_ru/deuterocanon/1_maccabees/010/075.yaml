  rationale: Исправлены лишь союз, чтобы не вносить необязательного противопоставления, и заключительный глагольный оборот, чтобы естественно и прямо передать «воевали против неё». Примечание сохранено и сокращено, поскольку оно надёжно разъясняет женское местоимение, относящееся к Иоппии.
