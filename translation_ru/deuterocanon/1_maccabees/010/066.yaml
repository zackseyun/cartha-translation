lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: возвратился
  rationale: В сочетании с εἰς Ἱερουσαλήμ глагол означает возвращение в указанное место; «возвратился» точно и естественно передаёт повествовательный смысл.
- source_word: Ἰωνάθαν
  choice: Ионафан
  rationale: Традиционная русская библейская форма имени, соответствующая греческому Ἰωνάθαν.
- source_word: εἰς Ἱερουσαλήμ
  choice: в Иерусалим
  rationale: Предлог εἰς обозначает направление движения; русское «в» с винительным падежом передаёт его естественно.
- source_word: μετʼ εἰρήνης
  choice: с миром
  rationale: μετά с родительным падежом буквально выражает сопутствие; «с миром» сохраняет конструкцию и может обозначать благополучное, безопасное возвращение.
- source_word: εὐφροσύνης
  choice: радостью
  rationale: Существительное обозначает радость, веселье или ликование; «радость» здесь ясно и достойно звучит в кратком повествовательном предложении.
