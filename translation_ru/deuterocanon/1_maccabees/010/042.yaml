    rationale: В черновике «ежегодно» модифицирует «брали». В греческом κατʼ ἐνιαυτόν следует за ἀπὸ τοῦ λόγου и естественно относится к счёту/расчёту; перенос в «ежегодному счёту» точнее отражает исходный порядок и связь.
  - severity: low
    issue: Неестественный субъект при «освобождаются от взыскания»
    rationale: Денежные суммы по-русски обычно не «освобождаются от взыскания»; отменяется или прекращается их взимание. Эта перестройка не меняет смысла ἀφίεται в фискальном контексте.
