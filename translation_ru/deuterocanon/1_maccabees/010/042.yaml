review_pass:
  verdict: revise
  source_fidelity: 'Смысловой состав передан верно: речь о пяти тысячах серебряных сиклей, прежде регулярно взимавшихся из храмовых доходов/по храмовому счёту, от взимания которых отказываются, поскольку они принадлежат служащим священникам. Однако «ежегодно» в основном тексте присоединено к «брали», тогда как греческое κατʼ ἐνιαυτόν непосредственно стоит при административном обороте ἀπὸ τοῦ λόγου; безопаснее передать его как «по ежегодному счёту», сохранив сноску о возможном членении. «Пять тысяч сиклей ... освобождаются от взыскания» также менее естественно по-русски, чем явное обозначение отмены взимания суммы.'
  naturalness: 'Предлагаемая правка делает фразу яснее в современном литературном русском: отменяется именно взимание денежной суммы, а не сами деньги. «Ибо» соответствует официально-указному достоинству регистра без архаизации.'
  terminology: «Сиклей серебра», «святилище», «доходы», «священники» и «совершающие служение» уместны и не навязывают конфессионального толкования. «Ежегодный счёт святилища» передаёт административное значение λόγος; сноска сохраняет альтернативу «расчёт».
  issues:
