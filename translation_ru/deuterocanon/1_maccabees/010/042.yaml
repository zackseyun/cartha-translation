revisions:
- from: И сверх того пять тысяч сиклей серебра, которые ежегодно, как и в прежние годы, брали из доходов по счёту святилища[a], также освобождаются от взыскания, потому что они принадлежат священникам, совершающим служение.
  to: И сверх того, взимание пяти тысяч сиклей серебра, которые, как и в прежние годы, брали из доходов по ежегодному счёту святилища[a], также отменяется, ибо эти средства принадлежат священникам, совершающим служение.
  rationale: Правка уточняет связь «ежегодного» с административным «счётом», а также заменяет менее естественную конструкцию о деньгах, «освобождающихся от взыскания», на ясную передачу отмены взимания. Неоднозначность сжатого финансового оборота сохранена в сноске.
