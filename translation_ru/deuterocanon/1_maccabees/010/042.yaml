  yaml_path: translation/deuterocanon/1_maccabees/010/042.yaml
  text: And in addition to these things[a], the five thousand shekels of silver that they used to take from the revenues, as in former years, from the sanctuary account each year, these also are remitted, because they belong to the priests who minister.
translation:
  language: ru
  text: И сверх того, взимание пяти тысяч сиклей серебра, которые, как и в прежние годы, брали из доходов по ежегодному счёту святилища[a], также отменяется, ибо эти средства принадлежат священникам, совершающим служение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из ежегодного счёта святилища»; или: «из ежегодного расчёта святилища». Греческий оборот со словом λόγος имеет административный смысл и выражен сжато.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεντακισχιλίους σίκλους ἀργυρίου
  choice: пять тысяч сиклей серебра
  rationale: Сохранена древняя денежно-весовая единица и естественная для русского библейского регистра конструкция.
- source_word: ἐλάμβανον
  choice: брали
  rationale: В сочетании с «ежегодно» форма передаёт обычное, повторявшееся в прошлом действие, выраженное греческим имперфектом.
- source_word: ἀπὸ τῶν χρειῶν
  choice: из доходов
  rationale: В данном финансово-административном контексте слово обозначает поступления или доходы, а не буквальные «нужды».
- source_word: ὡς ἐν τοῖς πρώτοις ἔτεσιν
  choice: как и в прежние годы
  rationale: Передаёт сопоставление с установившейся практикой прошлых лет.
- source_word: τοῦ ἁγίου
  choice: святилища
  rationale: Существительное с артиклем указывает на священное место, здесь — храмовое святилище и связанные с ним средства.
- source_word: ἀπὸ τοῦ λόγου κατʼ ἐνιαυτόν
  choice: ежегодно … по счёту
  rationale: λόγος имеет административное значение «счёт, расчёт, отчётность»; с κατʼ ἐνιαυτόν оборот остаётся сжатым и допускает различное синтаксическое членение.
- source_word: ἀφίεται
  choice: освобождаются от взыскания
  rationale: В налогово-финансовом контексте речь идёт об отмене взимания; русский оборот яснее буквального «отпускаются» и сохраняет административный смысл.
- source_word: διὰ τὸ ἀνήκειν αὐτὰ
  choice: потому что они принадлежат
  rationale: Передаёт законную принадлежность или причитающееся право на эти средства.
- source_word: τοῖς ἱερεῦσιν τοῖς λειτουργοῦσιν
  choice: священникам, совершающим служение
  rationale: Сохраняет культовый оттенок λειτουργέω и указывает на священническое служение в святилище.
