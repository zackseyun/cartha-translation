  text: And Jonathan came to Jerusalem[a], and read the letters in the hearing of all the people and those in the citadel.
translation:
  language: ru
  text: Ионафан пришёл в Иерусалим и прочитал письма перед всем народом и людьми из крепости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «людьми из Акры»; Акра — укреплённая цитадель в Иерусалиме.'
    reason: Греческое ἄκρα может быть нарицательным обозначением крепости или относиться к конкретной иерусалимской цитадели, известной как Акра.
lexical_decisions:
- source_word: ἦλθεν
  choice: пришёл
  rationale: Аорист ἔρχομαι в последовательном повествовании естественно передаётся глаголом «пришёл»; «прибыл» было бы несколько более интерпретирующим.
- source_word: ἀνέγνω
  choice: прочитал вслух
  rationale: Сам глагол означает «прочитал», а оборот εἰς τὰ ὦτα указывает на устное чтение перед слушателями; в русском это естественно выражается сочетанием «прочитал вслух».
- source_word: τὰς ἐπιστολάς
  choice: письма
  rationale: ἐπιστολή обычно обозначает письмо или письменное послание; в данном контексте прямой русский эквивалент «письма» наиболее точен.
- source_word: εἰς τὰ ὦτα παντὸς τοῦ λαοῦ
  choice: вслух всему народу
  rationale: Буквальный оборот «в уши всего народа» является греческой идиомой публичного оглашения; выбран естественный русский эквивалент без потери смысла.
- source_word: τῶν ἐκ τῆς ἄκρας
  choice: людям из крепости
  rationale: Предлог ἐκ буквально выражает происхождение или принадлежность к месту. Формулировка сохраняет это значение и не уточняет без достаточного основания, находились ли эти люди в крепости в момент чтения.
