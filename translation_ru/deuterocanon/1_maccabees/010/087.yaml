  text: Ионафан возвратился вместе с теми, кто был с ним, и они несли с собой много добычи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: возвратился
  rationale: Аорист обозначает возвращение Ионафана с места сражения; «возвратился» естественно звучит в повествовании и не уточняет направление сверх греческого текста.
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  choice: вместе с теми, кто был с ним
  rationale: Формулировка сохраняет несколько идиоматичный смысл греческого выражения и не добавляет прямо не указанного военного оттенка варианта «со своими воинами».
- source_word: ἔχοντες
  choice: неся
  rationale: Причастие описывает сопутствующее возвращению действие. «Неся» естественно сочетается с материальной военной добычей и не добавляет значения «обратно».
- source_word: σκῦλα
  choice: добычу
  rationale: Слово обозначает имущество, захваченное в бою. «Добыча» — ясный и современный русский эквивалент; контекст передаёт военный характер слова.
- source_word: πολλά
  choice: богатую
  rationale: При собирательном существительном «добыча» качественно-количественное сочетание «богатая добыча» естественно передаёт значение большого количества.
