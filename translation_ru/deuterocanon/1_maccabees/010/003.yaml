  text: And Demetrius sent letters to Jonathan with peaceful words[b][a], so as to honor him.
translation:
  language: ru
  text: И Димитрий послал Ионафану письма с мирными словами[a], чтобы возвысить его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со словами мира».'
    reason: Сохраняется более буквальный вариант передачи греческого выражения λόγοις εἰρηνικοῖς.
  - marker: b
    text: 'Буквально: «сделать его великим»; здесь возможно также значение «возвеличить» или «оказать ему почесть».'
    reason: Примечание сохраняет буквальный образ глагола μεγαλῦναι и его смысловой диапазон в политическом контексте.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычное и естественное соответствие аористу ἀποστέλλω в контексте письменных сообщений.
- source_word: ἐπιστολὰς
  choice: письма
  rationale: Сохраняет форму множественного числа греческого существительного и естественно звучит по-русски.
- source_word: λόγοις εἰρηνικοῖς
  choice: с мирными словами
  rationale: Передаёт как существительное λόγοις, так и характеристику εἰρηνικοῖς, не сводя выражение лишь к общему понятию дружелюбного тона.
- source_word: ὥστε
  choice: чтобы
  rationale: В данном контексте оборот естественно выражает цель действий Димитрия; русское «чтобы» ясно и не перегружает фразу.
- source_word: μεγαλῦναι
  choice: возвысить
  rationale: Передаёт буквальную идею увеличения величия и уместный здесь политический смысл повышения положения или оказания особой чести, не сужая значение до одного из этих оттенков.
- source_word: Ἰωναθὰν
  choice: Ионафану
  rationale: Традиционная русская библейская форма имени, поставленная в дательном падеже согласно греческому πρὸς Ἰωναθάν и нормам русского языка.
- source_word: Δημήτριος
  choice: Димитрий
  rationale: Традиционная русская форма имени этого персонажа в библейском контексте.
