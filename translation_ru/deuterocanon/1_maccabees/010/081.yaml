  text: But the people stood as Jonathan had commanded[a], and their horses grew weary.
translation:
  language: ru
  text: Народ же оставался на месте, как повелел Ионафан, и кони их утомились.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте сказано просто «кони их». По контексту, вероятнее всего, имеются в виду кони вражеской конницы, утомившиеся, пока люди Ионафана оставались на месте.
    reason: Сохранение неоднозначного референта местоимения и пояснение наиболее вероятного контекстуального смысла.
lexical_decisions:
- source_word: ὁ δὲ λαός
  choice: Народ же
  rationale: λαός передано обычным словом «народ», обозначающим здесь людей Ионафана; частица δέ выражает переход в повествовании с лёгким оттенком сопоставления.
- source_word: ἱστήκει
  choice: оставался на месте
  rationale: 'Форма описывает продолжавшееся состояние: люди стояли там, где им было велено. Этот перевод естественно передаёт удержание позиции, не добавляя идеи активного сопротивления.'
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: как повелел Ионафан
  rationale: ἐπιτάσσω означает «приказывать, повелевать»; «повелел» соответствует достоинству исторического повествования и ясно указывает на предшествующий приказ.
- source_word: ἐκοπίασαν
  choice: утомились
  rationale: κοπιάω обозначает усталость от напряжения; «утомились» сохраняет результативный смысл, не усиливая его до полного изнеможения.
- source_word: οἱ ἵπποι αὐτῶν
  choice: кони их
  rationale: Буквально сохранено местоимение «их», поскольку его референт в самой греческой фразе не назван однозначно. Постпозиция местоимения звучит естественно в литературном повествовании и не снимает двусмысленности.
