base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/030.yaml
  text: And instead of the third of the seed-sowing[a], and instead of the half of the fruit of the trees that falls to me to receive, I release it from this day and onward, from being taken from the land of Judah and from the three districts added to it from Samaria and Galilee[c][b], from this day and for all time.
translation:
  language: ru
  text: В отношении трети урожая с посевов[a] и половины плодов с деревьев, причитающихся мне, отныне и впредь я отменяю их взимание[b] с земли Иуды и с трёх округов[c], присоединённых к ней из Самарии и Галилеи, — с нынешнего дня и навсегда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «треть посева». По смыслу речь идёт о трети урожая, полученного от посевов.'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду царская доля урожая, то есть подать, которая прежде причиталась царю.
    reason: cultural_note
  - marker: c
    text: Греческое слово νομοί обозначает административные области или округа.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ τρίτου τῆς σπορᾶς
  choice: что касается трети урожая с посевов
  rationale: В контексте царской налоговой льготы ἀντί вводит предмет отменяемого взыскания, а σπορά обозначает посев или урожай от посева. Формулировка передаёт смысл доли урожая и избегает неестественного буквального «треть посева».
- source_word: τοῦ ἡμίσους τοῦ καρποῦ τοῦ ξυλίνου
  choice: половины плодов с деревьев
  rationale: Выражение относится к плодам древесных культур. Выбран естественный современный русский оборот без буквального и непонятного «деревянного плода».
- source_word: τοῦ ἐπιβάλλοντός μοι λαβεῖν
  choice: которые мне причитается получать
  rationale: В фискальном контексте оборот указывает на долю, полагающуюся царю. Безличная конструкция сохраняет оттенок законного притязания, не усиливая значение до насильственного изъятия.
- source_word: ἀφίημι
  choice: я отменяю их взимание
  rationale: Глагол означает отказ от причитающегося дохода. В данном контексте речь идёт не о моральном прощении, а об отмене сбора царской доли.
- source_word: ἀπὸ τῆς σήμερον καὶ ἐπέκεινα
  choice: отныне и впредь
  rationale: Естественное и торжественное соответствие формуле, обозначающей начало действия постановления с настоящего момента.
- source_word: γῆς Ἰούδα
  choice: земли Иуды
  rationale: Прямо сохраняет географическое наименование исходного текста и не подменяет его более интерпретирующим «Иудея».
- source_word: τῶν τριῶν νομῶν
  choice: трёх округов
  rationale: νομοί здесь — административные единицы. «Округа» понятно современному читателю и сохраняет административный смысл.
- source_word: τῶν προστιθεμένων αὐτῇ
  choice: присоединённых к ней
  rationale: Передаёт включение трёх округов в территорию земли Иуды; «присоединённых» естественнее по-русски, чем буквальное «добавленных».
- source_word: ἀπὸ τῆς Σαμαρίτιδος καὶ Γαλιλαίας
  choice: из Самарии и Галилеи
  rationale: Предлог «из» ясно показывает, что округа были выделены из названных областей и присоединены к земле Иуды.
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: на все времена
  rationale: Передаёт бессрочный, постоянный характер льготы в формальном, но современном русском регистре.
