  source_fidelity: 'Содержание передано в целом точно: названы обе царские доли, отказ от их взимания, земля Иуды, три административных округа, их происхождение из Самарии и Галилеи, а также обе временные формулы. Однако в основном тексте есть грамматическая ошибка согласования: при двух однородных предметах «которые мне причитается» требуется множественное число. Формулировка «в отношении» естественно передаёт здесь вводное ἀντί без неуклюжего буквального «вместо».'
