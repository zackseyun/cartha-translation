base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/057.yaml
  text: And Ptolemy went out from Egypt[a], he and Cleopatra his daughter, and came to Ptolemais in the one hundred sixty-second year.
translation:
  language: ru
  text: И вышел Птолемей из Египта вместе со своей дочерью Клеопатрой и прибыл в Птолемаиду в сто шестьдесят втором году[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в 162 году эры Селевкидов.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Аорист ἐξέρχομαι буквально означает «вышел»; в данном рассказе о путешествии слово обозначает отправление из Египта и сохраняет образ исходного текста.
- source_word: αὐτὸς καὶ Κλεοπάτρα ἡ θυγάτηρ αὐτοῦ
  choice: вместе со своей дочерью Клеопатрой
  rationale: Оборот называет самого Птолемея и его дочь совместными участниками поездки. Русское «вместе со своей дочерью» естественно передаёт координацию, не перегружая фразу буквальным «он и».
- source_word: ἦλθεν
  choice: прибыл
  rationale: В контексте движения к названному городу ἔρχομαι обозначает прибытие; «прибыл» ясно и естественно звучит в русском историческом повествовании.
- source_word: εἰς Πτολεμαΐδα
  choice: в Птолемаиду
  rationale: Предлог εἰς с названием города указывает направление движения и естественно передаётся русским «в» с винительным падежом.
- source_word: ἔτους δευτέρου καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: в сто шестьдесят втором году
  rationale: Аддитивная греческая формула буквально обозначает 162-й год; русский порядковый числительный передаёт её ясно и без изменения смысла.
