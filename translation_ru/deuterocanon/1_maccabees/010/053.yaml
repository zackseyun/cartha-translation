  text: And I joined battle with him[a], and he and his camp were crushed by us, and we sat on the throne of his kingdom;
translation:
  language: ru
  text: И я вступил с ним в битву, и он и его войско были сокрушены нами, и мы воссели на престоле его царства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνῆψα πρὸς αὐτὸν μάχην
  choice: я вступил с ним в битву
  rationale: Греческое военное выражение означает вступить в сражение; этот перевод сохраняет образ и естественно звучит по-русски.
- source_word: συνετρίβη
  choice: были сокрушены
  rationale: Глагол передаёт решительный разгром, а не просто поражение. Множественное число естественно согласуется в русском с составным подлежащим «он и его войско».
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: его войско
  rationale: В военном контексте παρεμβολή может обозначать лагерь или расположенное в нём войско; здесь при упоминании разгрома правителя смысл «войско» наиболее естественен.
- source_word: ὑφʼ ἡμῶν
  choice: нами
  rationale: Кратко и прямо сохраняет указание на действующее лицо и форму первого лица множественного числа.
- source_word: ἐκαθίσαμεν
  choice: мы воссели
  rationale: Буквально глагол означает «сели», но сочетание с престолом обозначает занятие царской власти; «воссели» естественно для торжественного повествовательного регистра и не добавляет нового смысла.
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: на престоле его царства
  rationale: Сохраняет оба понятия — престол и царство — и не уточняет сверх текста характер власти.
