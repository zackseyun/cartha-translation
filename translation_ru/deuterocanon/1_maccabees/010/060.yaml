  yaml_path: translation/deuterocanon/1_maccabees/010/060.yaml
  text: And he went with splendor to Ptolemais[a], and met the two kings; and he gave them silver and gold, and many gifts to their friends[c][b], and found favor before them.
translation:
  language: ru
  text: И он с пышностью[a] отправился в Птолемаиду и встретился с двумя царями. Он дал им серебро и золото, а их друзьям[b] — множество даров, и снискал их расположение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со славой», «с великолепием»; греческое выражение указывает на почётную и пышную обстановку его прибытия.'
    reason: lexical_alternative
  - marker: b
    text: В эллинистическом придворном обиходе «друзьями» могли называть приближённых царя или придворных.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπορεύθη
  choice: отправился
  rationale: Естественная для повествования передача аориста глагола движения; не уточняет способ передвижения.
- source_word: μετὰ δόξης
  choice: с пышностью
  rationale: В данном контексте выражение обозначает почётное, великолепное появление; такой перевод избегает возможного богословского оттенка слова «слава».
- source_word: Πτολεμαΐδα
  choice: Птолемаиду
  rationale: Употреблена традиционная русская форма географического названия Птолемаида.
- source_word: ἀπήντησεν
  choice: встретился
  rationale: Передаёт дипломатическую встречу естественным современным русским языком, не добавляя отсутствующего в тексте описания приветствия.
- source_word: τοῖς δυσὶν βασιλεῦσιν
  choice: с двумя царями
  rationale: Прямая передача определённой пары царей, известной из контекста.
- source_word: ἔδωκεν
  choice: дал
  rationale: Сохраняет обычное значение греческого глагола; торжественный характер вручения понятен из контекста.
- source_word: ἀργύριον καὶ χρυσίον
  choice: серебро и золото
  rationale: Прямая и устойчивая передача названий драгоценных материалов.
- source_word: τοῖς φίλοις αὐτῶν
  choice: их друзьям
  rationale: Сохраняет основное значение φίλοι, не превращая возможное придворное обозначение в явно выраженный официальный титул.
- source_word: δόματα πολλά
  choice: множество даров
  rationale: Достоинственная и естественная передача словосочетания в дипломатическом контексте.
- source_word: εὗρεν χάριν ἐναντίον αὐτῶν
  choice: снискал их расположение
  rationale: Передаёт греческую идиому естественным современным русским выражением без неясного буквализма «нашёл милость перед ними».
