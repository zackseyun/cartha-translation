  text: And King Alexander heard the promises that Demetrius had sent to Jonathan, and they told him about the wars and the brave deeds that he and his brothers had done, and the hardships they had endured.
translation:
  language: ru
  text: Царь Александр услышал об обещаниях, которые Димитрий послал Ионафану. Ему рассказали о войнах и доблестных деяниях Ионафана и его братьев, а также о тяготах, которые они перенесли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: обещаниях
  rationale: Слово обозначает данные Димитрием заверения или обязательства; «обещания» естественно звучит по-русски и не придаёт им излишне формального оттенка.
- source_word: διηγήσαντο
  choice: рассказали
  rationale: Глагол означает подробно изложить или поведать; «рассказали» ясно и естественно вводит содержание сообщения.
- source_word: πολέμους
  choice: войнах
  rationale: Сохранено множественное число и широкий смысл греческого слова; «битвы» неоправданно сузило бы значение.
- source_word: ἀνδραγαθίας
  choice: доблестных деяниях
  rationale: Передаёт проявления мужества и похвальную окраску исходного слова, сохраняя достоинство повествования.
- source_word: κόπους
  choice: тяготах
  rationale: В данном контексте речь идёт о тяжёлых испытаниях и лишениях, а не просто о труде.
- source_word: ἔσχοσαν
  choice: пришлось перенести
  rationale: В сочетании с κόπους глагол указывает на пережитые и вынесенные тяготы; русский оборот естественно передаёт этот смысл.
- source_word: ἀδελφοὶ
  choice: братьев
  rationale: В контексте имеются в виду родные братья Ионафана из семьи Маккавеев.
