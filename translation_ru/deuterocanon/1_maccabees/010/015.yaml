translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным историко-повествовательным тоном. Во втором предложении имя Ионафана повторено вместо местоимения, чтобы устранить неестественную для русского синтаксическую двусмысленность относительно того, кто совершал деяния, при сохранении смысла греческого текста.
