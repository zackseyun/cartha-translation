base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/074.yaml
  text: But when Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem, and Simon his brother met him to help him.
translation:
  language: ru
  text: Услышав слова Аполлония, Ионафан пришёл в волнение[a], отобрал десять тысяч человек и вышел из Иерусалима. Симон, его брат, встретил Ионафана, чтобы помочь ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был внутренне взволнован», «был задет». Греческое выражение обозначает внутреннее возбуждение, не уточняя, о каком именно чувстве идёт речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Услышав
  rationale: Деепричастная конструкция естественно передаёт временную связь; слабое повествовательное δέ не требует отдельного союза в русском контексте.
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: слова Аполлония
  rationale: Сохраняет конкретное указание на сказанное Аполлонием, не превращая λόγοι в более узкое «послание».
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: пришёл в волнение
  rationale: Передаёт внутреннее движение или возбуждение, не уточняя его как гнев, тревогу либо страх.
- source_word: ἐπέλεξεν δέκα χιλιάδας ἀνδρῶν
  choice: отобрал десять тысяч человек
  rationale: В военном контексте «отобрал» естественно выражает осознанный выбор людей, а «человек» не добавляет отсутствующего в греческом существительного «воинов».
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: вышел из Иерусалима
  rationale: Прямой и естественный эквивалент без добавления военной окраски вроде «выступил в поход».
- source_word: συνήντησεν αὐτῷ
  choice: присоединился к нему
  rationale: По контексту Симон приходит к Ионафану для совместного действия; русский буквальный вариант «встретил его» мог бы ошибочно подразумевать случайную встречу или движение навстречу.
- source_word: ἐπὶ βοήθειαν αὐτοῦ
  choice: чтобы помочь ему
  rationale: Ясно и современно передаёт цель прибытия Симона.
