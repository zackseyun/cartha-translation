lexical_decisions:
- source_word: μνησθήσεται
  choice: припомнит
  rationale: Будущее время сохранено; в данном контексте глагол означает не просто вспомнить, а принять прежние деяния в расчёт, причём с явно неблагоприятным оттенком.
- source_word: πάντων τῶν κακῶν
  choice: всё зло
  rationale: Передаёт широкое нравственно отрицательное значение κακά и сохраняет собирательный охват πάντων, не сужая смысл до отдельных обид или проступков.
- source_word: ὧν συνετελέσαμεν
  choice: которое мы причинили
  rationale: В контексте враждебных поступков сочетание естественно передаётся как совершение и причинение зла; первое лицо множественного числа сохранено.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: его братьям
  rationale: Сохранено прямое значение ἀδελφοί без уточнения, идёт ли речь о родных братьях или соратниках/соплеменниках.
- source_word: τὸ ἔθνος αὐτοῦ
  choice: его народу
  rationale: В историческом контексте ἔθνος обозначает народ; «народ» естественнее и нейтральнее, чем «нация».
