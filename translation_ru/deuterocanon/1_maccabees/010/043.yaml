base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/043.yaml
  text: And as for any who flee to the sanctuary in Jerusalem and in all its borders[a], owing royal taxes or any other obligation, let them be released[b], along with everything that belongs to them in my kingdom.
translation:
  language: ru
  text: И все, кто убежит в святилище в Иерусалиме и во всех его пределах[a], если за ними числятся царские подати или какие-либо иные обязательства[b], пусть будут освобождены — и они сами, и всё, что принадлежит им в моём царстве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «найдёт убежище в храме в Иерусалиме и на всей относящейся к нему территории». Греческие слова могут обозначать храмовый комплекс или связанную с ним территорию; не вполне ясно, к чему именно относятся «пределы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будучи должен царское и всякое дело». Речь может идти о податях, долгах и иных правовых притязаниях.'
    reason: alternative_reading
lexical_decisions:
- source_word: φύγωσιν
  choice: убежит
  rationale: Глагол φεύγω прежде всего обозначает бегство; направление к святилищу придаёт ему оттенок поиска убежища, но этот оттенок не подменяет прямого значения.
- source_word: ἱερὸν
  choice: святилище
  rationale: ἱερόν может обозначать весь священный храмовый комплекс, а не только здание храма; «святилище» уместно и в контексте права убежища.
- source_word: ὁρίοις
  choice: пределы
  rationale: ὅρια обозначает границы или территорию в их пределах. Русское «пределы» сохраняет возможную связь как со святилищем, так и с прилегающей территорией, не уточняя её административный статус.
- source_word: βασιλικὰ
  choice: царские подати
  rationale: Субстантивированное прилагательное обозначает причитающееся царской власти; в данном фискально-правовом контексте «царские подати» передаёт вероятный смысл без сведения его только к одному виду налога.
- source_word: πᾶν πρᾶγμα
  choice: какие-либо иные обязательства
  rationale: Буквально выражение означает «всякое дело», но при ὀφείλων оно относится к тому, что человек должен или за что отвечает. «Обязательства» сохраняет более широкий смысл, чем «долги».
- source_word: ἀπολελύσθωσαν
  choice: пусть будут освобождены
  rationale: Перфектный пассивный императив выражает властное постановление об освобождении от притязаний или обязательств; формула подходит стилю царского указа.
- source_word: πάντα ὅσα ἐστὶν αὐτοῖς
  choice: всё, что принадлежит им
  rationale: Широкая формулировка не ограничивается явно названным видом имущества и естественно передаёт принадлежность.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: в моём царстве
  rationale: Прямое и естественное обозначение территории, находящейся под властью царя.
theological_decisions:
- issue: Объём убежища и освобождения, связанного с Иерусалимским святилищем
  choice: Указ распространяет освобождение на людей, бежавших в святилище или относящиеся к нему пределы, а также на принадлежащее им имущество в царстве.
  alternative: Можно понимать «во всех его пределах» как более широкое указание на территорию Иерусалима, а «всякое дело» — не только как имущественное или правовое обязательство.
  rationale: Синтаксис связывает бегство к святилищу с освобождением от того, что причитается царю, и от иных притязаний. При этом принадлежность «пределов» и точный охват πᾶν πρᾶγμα остаются не вполне определёнными, поэтому перевод не сужает их до храмового двора и частных долгов.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского указа. Конструкция «если за ними числятся» делает несогласованный по числу греческий оборот естественным по-русски, а «и они сами, и всё» ясно сохраняет грамматический охват освобождения.
