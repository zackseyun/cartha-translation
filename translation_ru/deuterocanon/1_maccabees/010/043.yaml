- from: И все, кто убежит в святилище в Иерусалиме или в пределы, принадлежащие ему[a], если за ними числятся царские подати или какие-либо иные обязательства[b], пусть будут освобождены — и они сами, и всё, что принадлежит им в моём царстве.
  to: И все, кто убежит в святилище в Иерусалиме и во всех его пределах[a], если за ними числятся царские подати или какие-либо иные обязательства[b], пусть будут освобождены — и они сами, и всё, что принадлежит им в моём царстве.
