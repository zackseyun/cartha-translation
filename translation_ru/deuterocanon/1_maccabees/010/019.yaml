lexical_decisions:
- source_word: Ἰωνάθαν
  choice: Ионафану
  rationale: Имя передано в принятой русской библейской форме «Ионафан»; дательный падеж естественно выражает адресата в формуле начала письма.
- source_word: χαίρειν
  choice: приветствие
  rationale: В начале письма инфинитив χαίρειν служит устойчивой формулой приветствия, а не буквальным повелением радоваться.
- source_word: ἀκηκόαμεν
  choice: мы слышали
  rationale: Русское прошедшее время естественно передаёт совершённое слышание, результат которого сохраняет значение для настоящего контекста.
- source_word: περὶ σοῦ
  choice: о тебе
  rationale: Прямой и современный русский эквивалент сочетания περί с родительным падежом.
- source_word: ἀνὴρ ἀγαθὸς ἰσχύϊ
  choice: человек, сильный
  rationale: Сочетание ἀγαθός с дательным ἰσχύϊ характеризует Ионафана как достойного или выдающегося в силе; «сильный» естественно передаёт смысл в незавершённой фразе, не добавляя отсутствующего продолжения.
- source_word: καὶ
  choice: и…
  rationale: Союз сохранён, поскольку предоставленный греческий текст оканчивается на нём; многоточие показывает обрыв предложения, не реконструируя продолжение.
