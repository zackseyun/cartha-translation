lexical_decisions:
- source_word: ἀνταποδώσομεν
  choice: воздадим
  rationale: Будущее время глагола со значением ответного воздаяния. «Воздадим» сохраняет взаимный характер действия и уместно в dignified modern literary Russian.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж обозначает адресата ответного воздаяния и прямо передаётся русским «вам».
- source_word: ἀγαθὰ
  choice: добром
  rationale: Субстантивированное прилагательное среднего рода во множественном числе обозначает неопределённые благодеяния. Русское собирательное «добром» естественно передаёт широкий смысл, не уточняя вид награды.
- source_word: ἀνθʼ ὧν
  choice: за то, что
  rationale: Оборот выражает основание и взаимность воздаяния; «за то, что» естественно соединяет обе смысловые стороны.
- source_word: ποιεῖτε
  choice: вы делаете
  rationale: Настоящее время представляет действие как совершаемое или продолжающееся; русский несовершенный вид сохраняет эту аспектуальную открытость.
- source_word: μεθʼ ἡμῶν
  choice: вместе с нами
  rationale: μετά с родительным буквально означает «с нами». Добавление «вместе» делает русскую конструкцию естественной и сохраняет возможный смысл сотрудничества, не подменяя его более узким «для нас».
