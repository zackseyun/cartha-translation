  text: И мы отблагодарим вас добром за то, что вы делаете вместе с нами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с нами». Оборот может означать совместные действия, а также действия для нас или по отношению к нам; он может подразумевать сотрудничество или благожелательное отношение.'
