  yaml_path: translation/deuterocanon/1_maccabees/010/084.yaml
  text: And Jonathan set Azotus and the cities around it on fire[a], and he took their spoil[b]; and he burned the temple of Dagon and its shrines with fire.
translation:
  language: ru
  text: Ионафан предал огню Азот[a] и окрестные города и захватил их добычу; храм Дагона и её храм[b] он сжёг огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Азот — греческая форма названия Ашдод.
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст повторяет слово «храм»: буквально — «храм Дагона и её храм он сжёг огнём». Возможно, местоимение «её» относится к городу Азоту; не вполне ясное повторение сохранено.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐνεπύρισεν
  choice: предал огню / сжёг огнём
  rationale: Глагол означает «поджечь, предать огню, сжечь». Два русских выражения сохраняют значение обоих употреблений и избегают неестественного однообразия; заключительное «огнём» передаёт усилительное ἐν πυρί.
- source_word: Ἄζωτον
  choice: Азот
  rationale: Передана греческая форма названия города; более известное еврейское соответствие «Ашдод» указано в сноске.
- source_word: τὰς πόλεις τὰς κύκλῳ αὐτῆς
  choice: окрестные города
  rationale: Естественно передаёт города, расположенные вокруг Азота.
- source_word: τὰ σκῦλα αὐτῶν
  choice: их добычу
  rationale: σκῦλα обозначает военную добычу; местоимение αὐτῶν сохранено словом «их».
- source_word: τὸ ἱερὸν Δαγὼν
  choice: храм Дагона
  rationale: В данном повествовательном контексте ἱερόν естественно обозначает храм или храмовое святилище; Δαγών понимается как несклоняемое имя в зависимом положении.
- source_word: τὸ ἱερὸν αὐτῆς
  choice: её храм
  rationale: Греческий текст буквально повторяет существительное ἱερόν и употребляет местоимение женского рода, которое естественно соотнести с городом Азотом. Неясность и стилистическая неровность источника сохранены, а не заменены неподтверждённым множественным «святилища».
- source_word: ἐν πυρί
  choice: огнём
  rationale: Естественное русское инструментальное соответствие греческому обороту, подчёркивающему сожжение.
