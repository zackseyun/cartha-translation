lexical_decisions:
- source_word: ἐστερέωσεν πόλεμον
  choice: битва яростно продолжалась
  rationale: Греческое выражение буквально передаёт усиление или упорное продолжение войны/битвы; в данном повествовательном контексте естественный русский оборот «битва продолжалась» сохраняет длительность действия, а σφόδρα передано словом «яростно».
- source_word: ἕως ἔδυ ὁ ἥλιος
  choice: до захода солнца
  rationale: Идиоматический перевод буквального «пока не зашло солнце», краткий и естественный для современного русского повествования.
- source_word: ἔπεσεν
  choice: пал
  rationale: В контексте битвы глагол означает гибель; «пал» сохраняет военную окраску и достоинство исходного повествования.
- source_word: ὁ Δημήτριος
  choice: Димитрий
  rationale: Традиционная русская библейская форма греческого имени Δημήτριος.
