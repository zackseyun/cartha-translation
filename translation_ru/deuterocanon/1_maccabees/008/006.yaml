  yaml_path: translation/deuterocanon/1_maccabees/008/006.yaml
  text: and Antiochus the great king of Asia[a], who came against them in war, having one hundred twenty elephants and cavalry and chariots and a very great force, was crushed by them.
translation:
  language: ru
  text: и Антиоха, великого царя Азии, который пошёл на них войной со ста двадцатью слонами, конницей[a], колесницами и чрезвычайно многочисленным войском, — и был он ими сокрушён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте буквально стоит слово «конь» в единственном числе, но в этом перечне военных сил оно употреблено собирательно и означает конницу.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίοχον
  choice: Антиоха
  rationale: Традиционная русская форма имени Ἀντίοχος; винительный падеж сохраняет синтаксическую связь с предшествующим контекстом.
- source_word: τὸν μέγαν βασιλέα τῆς Ἀσίας
  choice: великого царя Азии
  rationale: Прямо передаёт приложение и значение μέγαν; родительный τῆς Ἀσίας естественно выражен русским родительным без уточнения характера власти.
- source_word: τὸν πορευθέντα ἐπʼ αὐτοὺς εἰς πόλεμον
  choice: который пошёл на них войной
  rationale: Естественная современная русская формулировка сохраняет движение против противника и военный смысл оборота.
- source_word: ἔχοντα
  choice: со
  rationale: Русская конструкция с предлогом лаконично и естественно вводит перечень военных сил, не меняя отношения к Антиоху.
- source_word: ἑκατὸν εἴκοσι ἐλέφαντας
  choice: ста двадцатью слонами
  rationale: Точное числовое соответствие, оформленное творительным падежом после «со».
- source_word: ἵππον
  choice: конницей
  rationale: Единственное число греческого слова в военном перечне имеет собирательное значение и обозначает конные войска.
- source_word: ἅρματα
  choice: колесницами
  rationale: Стандартное прямое обозначение боевых колесниц.
- source_word: δύναμιν πολλὴν σφόδρα
  choice: чрезвычайно многочисленным войском
  rationale: В данном военном контексте δύναμις означает войско; πολλὴν σφόδρα передано усилительным сочетанием, естественным по-русски.
- source_word: συνετρίβη
  choice: был он ими сокрушён
  rationale: Сохраняет пассивную форму и сильный образ полного разгрома, выраженный συντρίβω.
- source_word: ἀπʼ αὐτῶν
  choice: ими
  rationale: Передаёт деятеля при пассивной конструкции непосредственно и без добавочного толкования.
