  text: Whomever they wish to help and to make king[a], they make king; and whomever they wish, they remove[b], and they have become very great.
translation:
  language: ru
  text: Кого они захотят поддержать и возвести на престол, того возводят; а кого захотят, того смещают. И возвысились они чрезвычайно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и достигли они огромного могущества». Буквально: «и возвысились они чрезвычайно».'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: οἷς δʼ ἂν βούλωνται
  choice: кого они захотят
  rationale: Неопределённо-относительная конструкция с ἄν и сослагательным наклонением обозначает любого человека по их выбору. По-русски это естественно передаётся сочетанием «кого… захотят».
- source_word: βοηθεῖν
  choice: поддержать
  rationale: В политико-военном контексте «поддержать» точнее простого «помочь» и при этом не добавляет к тексту конкретного вида помощи.
- source_word: καὶ βασιλεύειν … βασιλεύουσιν
  choice: и возвести на престол, того возводят
  rationale: Хотя βασιλεύειν обычно означает «царствовать», параллелизм с последующим βασιλεύουσιν и противопоставление смещению указывают здесь на установление избранного лица царём. «Возвести на престол» естественно передаёт эту политическую причинность и сохраняет повтор.
- source_word: μεθιστῶσιν
  choice: смещают
  rationale: Глагол может означать перемещение или устранение; применительно к правителям «смещают» ясно выражает удаление от власти, не уточняя способ.
- source_word: ὑψώθησαν σφόδρα
  choice: возвысились они чрезвычайно
  rationale: Перевод сохраняет образ глагола ὑψόω и усилительное значение σφόδρα, не сводя выражение исключительно к военной или политической мощи.
