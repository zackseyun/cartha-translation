  text: According to these terms[a], the Romans thus made an agreement with the people of the Jews.
translation:
  language: ru
  text: На таких условиях римляне заключили соглашение с народом иудеев[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жителей Иудеи». Греческое слово Ἰουδαίων в зависимости от контекста может обозначать как иудейский народ, так и жителей Иудеи.'
    reason: Лексическая неоднозначность этнонима Ἰουδαίων.
lexical_decisions:
- source_word: κατὰ τοὺς λόγους τούτους
  choice: На таких условиях
  rationale: В договорном контексте λόγοι означает не просто «слова», а изложенные условия; κατὰ выражает соответствие им. Русская формулировка естественно передаёт юридический смысл.
- source_word: οὕτως
  choice: передано построением всей фразы
  rationale: Значение «так, таким образом» уже заключено в обороте «На таких условиях»; отдельное «таким образом» создало бы в русском ненужный повтор.
- source_word: ἔστησαν
  choice: заключили соглашение
  rationale: В дипломатическом контексте форма ἵστημι означает установление договорённости. Хотя существительное «соглашение» в греческом не выражено, оно естественно восполняет эллиптическую юридическую формулу, не уточняя её как конкретный вид договора.
- source_word: Ῥωμαῖοι
  choice: римляне
  rationale: Этноним обозначает коллективную сторону соглашения и естественно передаётся русским множественным числом.
- source_word: τῷ δήμῳ
  choice: с народом
  rationale: δῆμος здесь обозначает народ как общественно-политическое целое; дательный падеж указывает на вторую сторону установленной договорённости.
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: В данном дипломатическом контексте имеется в виду иудейский народ как коллективное целое. Слово также допускает географический оттенок «жителей Иудеи», который сохранён в примечании.
theological_decisions:
- issue: Значение Ἰουδαίων
  choice: иудеев
  alternative: жителей Иудеи
  rationale: Контекст говорит о народе как стороне дипломатического соглашения, поэтому этнорелигиозное обозначение «иудеи» вероятнее; вместе с тем греческое слово допускает географическое понимание, и эта неоднозначность отмечена.
translation_notes:
  register: Современный литературный русский язык с краткой и достойной договорно-исторической формулировкой. Эллипсис греческого юридического оборота раскрыт минимально; смысловая избыточность между κατὰ τοὺς λόγους τούτους и οὕτως устранена естественным русским синтаксисом.
