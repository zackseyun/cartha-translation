lexical_decisions:
- source_word: συμμαχήσει
  choice: будет действовать как союзник
  rationale: Будущее время глагола συμμαχέω означает вступить в союз или действовать совместно как союзник. В договорном контексте этот перевод сохраняет политико-военный смысл, не сводя его только к участию в сражении.
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: Иудейский народ
  rationale: ἔθνος обозначает народ как политическое и общественное целое; «иудейский народ» естественно и точно передаёт сочетание с родительным τῶν Ἰουδαίων.
- source_word: ὡς ἂν ὁ καιρὸς ὑπογράφῃ αὐτοῖς
  choice: когда того потребуют обстоятельства
  rationale: ὡς ἄν с сослагательным наклонением выражает неопределённое условие времени или случая. καιρός здесь означает подходящий момент или сложившиеся обстоятельства, а ὑπογράφῃ — то, что они укажут или предпишут. Русское выражение передаёт общий смысл естественно, не сохраняя неясную буквальную метафору письма.
- source_word: καρδίᾳ πλήρει
  choice: от всего сердца
  rationale: Буквально выражение означает «с полным сердцем» и указывает на искренность и полную самоотдачу. «От всего сердца» — современный и понятный русский идиом, сохраняющий образ сердца.
