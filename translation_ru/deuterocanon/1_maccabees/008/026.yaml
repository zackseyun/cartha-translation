base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/026.yaml
  text: To those who make war on them they shall neither give nor supply grain[a], weapons, silver, or ships, as Rome has decided; and they shall keep their obligations, taking nothing.
translation:
  language: ru
  text: А тем, кто воюет против них, они не будут ни давать, ни поставлять зерно, оружие, серебро или корабли, как постановил Рим; и будут соблюдать свои обязательства[a], ничего не получая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут соблюдать свои условия»; или: «будут соблюдать положения своего договора». В греческом употреблено сочетание однокоренных слов, буквально: «будут соблюдать то, что надлежит соблюдать»; здесь оно относится к договорным условиям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς πολεμοῦσιν
  choice: тем, кто воюет против них
  rationale: Субстантивированное причастие обозначает враждебную сторону; «против них» восполняет подразумеваемый объект из контекста договора, не сужая значение до непосредственных нападающих.
- source_word: οὐ δώσουσιν οὐδὲ ἐπαρκέσουσιν
  choice: не будут ни давать, ни поставлять
  rationale: Сохраняется различие между непосредственной передачей и обеспечением необходимыми средствами; будущее время в договорном тексте выражает обязательное условие.
- source_word: σῖτον
  choice: зерно
  rationale: σίτος здесь естественно обозначает зерно или зерновые припасы; «зерно» точнее общего «продовольствие» и не ограничивает смысл пшеницей.
- source_word: ὅπλα
  choice: оружие
  rationale: Ясный современный эквивалент военного термина в перечне материальной помощи.
- source_word: ἀργύριον
  choice: серебро
  rationale: Сохранено буквальное обозначение серебра, которое могло служить денежным средством; перевод «деньги» был бы более широким.
- source_word: πλοῖα
  choice: корабли
  rationale: В военно-дипломатическом контексте это естественный русский эквивалент.
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: как постановил Рим
  rationale: Оборот ἔδοξεν с дательным обозначает официальное решение; «постановил» передаёт юридико-дипломатический регистр.
- source_word: φυλάξονται τὰ φυλάγματα αὐτῶν
  choice: будут соблюдать свои обязательства
  rationale: Родственная глагольно-именная конструкция буквально означает соблюдение того, что надлежит соблюдать; в договорном контексте речь идёт об обязательствах или условиях соглашения.
- source_word: οὐθὲν λαβόντες
  choice: ничего не получая
  rationale: Причастный оборот передан близко к греческому; «получая» в договорном контексте естественнее русского «беря» и не добавляет прямо не выраженного «взамен».
