  yaml_path: translation/deuterocanon/1_maccabees/008/010.yaml
  text: And when the report became known to them, they sent one general against them, and they fought against them, and many of them fell wounded, and they took their wives and their children captive, and plundered them, and gained control of their land, and pulled down their strongholds, and plundered them.
translation:
  language: ru
  text: Когда это известие дошло до них, они послали против них одного военачальника, вступили с ними в бой, и многие из них пали ранеными. Они взяли в плен их жён и детей, разграбили их, овладели их землёй, разрушили их укрепления и разграбили их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте выражение «разграбили их» повторено в конце стиха. Повтор сохранён в основном тексте: он может быть намеренным усилением, но может также объясняться повтором, возникшим при передаче текста.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος αὐτοῖς
  choice: это известие дошло до них
  rationale: В данном повествовательном контексте λόγος означает известие или сообщение, ставшее известным римлянам; естественная русская формулировка сохраняет смысл пассивного ἐγνώσθη.
- source_word: ἀπέστειλαν ἐπʼ αὐτοὺς στρατηγὸν ἕνα
  choice: они послали против них одного военачальника
  rationale: «Военачальник» точно и естественно передаёт военное значение στρατηγός; «одного» сохраняет выраженное в греческом тексте ἕνα.
- source_word: ἐπολέμησαν πρὸς αὐτούς
  choice: вступили с ними в бой
  rationale: Передаёт военное столкновение и направленность против неприятеля без излишне буквального повторения «против них».
- source_word: ἔπεσαν ἐξ αὐτῶν τραυματίαι πολλοί
  choice: многие из них пали ранеными
  rationale: Сохраняет как глагол «пали», так и значение τραυματίαι — раненые или поражённые в бою, не уточняя вопреки тексту, что все они погибли.
- source_word: ᾐχμαλώτισαν τὰς γυναῖκας αὐτῶν καὶ τὰ τέκνα αὐτῶν
  choice: взяли в плен их жён и детей
  rationale: Глагол обозначает захват военнопленных; γυναῖκες при притяжательном местоимении в этом контексте естественно понимать как жён.
- source_word: ἐπρονόμευσαν αὐτούς
  choice: разграбили их
  rationale: Глагол означает разграбить или разорить после победы. Его повтор в конце стиха сохранён, а добавленное «снова» делает повтор понятным по-русски, не устраняя его.
- source_word: κατεκράτησαν τῆς γῆς αὐτῶν
  choice: овладели их землёй
  rationale: Передаёт установление власти и контроля над землёй, выраженное κατακρατέω с родительным падежом.
- source_word: καθεῖλον τὰ ὀχυρώματα αὐτῶν
  choice: разрушили их укрепления
  rationale: καθαιρέω здесь означает разрушить или снести, а ὀχυρώματα — оборонительные укрепления или укреплённые места.
