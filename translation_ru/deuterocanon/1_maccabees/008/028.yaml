base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/028.yaml
  text: And grain[a], weapons, or silver shall not be given to the allies, as it seemed good to Rome; and they shall keep these provisions[b], and not with deceit.
translation:
  language: ru
  text: И союзникам не будут даны ни зерно, ни оружие, ни серебро, как постановил Рим[a]; и они будут соблюдать эти условия[b] без обмана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как было угодно Риму»; это официальная формула со значением «как решил (постановил) Рим».'
    reason: cultural_note
  - marker: b
    text: 'Или: «эти предписания», «эти обязательства». Греческое выражение буквально означает «это подлежащее соблюдению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμάχοις
  choice: союзникам
  rationale: Дательный падеж множественного числа обозначает стороны военно-политического союза; «союзникам» естественно для договорного контекста.
- source_word: δοθήσεται
  choice: не будут даны
  rationale: Сохранены будущее время, страдательный залог и отсутствие названного действующего лица; множественное число в русском согласовано с однородным рядом предметов.
- source_word: σῖτος
  choice: зерно
  rationale: Слово обозначает зерно или хлебные припасы вообще; перевод не сужает значение до пшеницы.
- source_word: ὅπλα
  choice: оружие
  rationale: В военно-договорном контексте речь идёт о вооружении; собирательное «оружие» ясно и естественно по-русски.
- source_word: ἀργύριον
  choice: серебро
  rationale: Сохранено буквальное обозначение серебра, хотя в данном контексте оно могло служить денежными средствами.
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: как постановил Рим
  rationale: Греческая формула выражает официальное решение; «постановил» передаёт её юридико-дипломатический смысл без неестественной русской кальки «как показалось хорошим».
- source_word: φυλάξονται
  choice: будут соблюдать
  rationale: В правовом и договорном контексте глагол означает исполнение или соблюдение установленных требований.
- source_word: τὰ φυλάγματα ταῦτα
  choice: эти условия
  rationale: Буквально это «то, что надлежит соблюдать»; в контексте договора «условия» естественно передаёт обязательные установления, не уточняя их сверх текста.
- source_word: οὐ μετὰ δόλου
  choice: без обмана
  rationale: Кратко и точно передаёт требование исполнять договор не лукаво и не обманным образом.
