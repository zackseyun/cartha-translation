lexical_decisions:
- source_word: ἔλαβον αὐτὸν ζῶντα
  choice: захватили его живым
  rationale: Оборот прямо указывает, что его взяли в плен живым; «захватили» естественно передаёт военный контекст.
- source_word: ἔστησαν αὐτοῖς διδόναι
  choice: обязали их ... платили им ... давали ... уступили
  rationale: Конструкция выражает установленное победителями обязательство; «обязали» сохраняет её юридически-принудительный смысл.
- source_word: φόρον μέγαν
  choice: большую дань
  rationale: В политическом контексте φόρος — дань, взимаемая с подчинённого правителя или государства; μέγαν передано без усилительной интерпретации.
- source_word: ὅμηρα
  choice: заложников
  rationale: Речь идёт о людях, предоставляемых в обеспечение политического соглашения.
- source_word: διαστολήν
  choice: уступили часть владений
  rationale: Точное значение редкого термина в данном контексте неясно; перевод выражает вероятную территориальную уступку, а примечание сохраняет смысловую неопределённость.
- source_word: τοὺς βασιλεύοντας μετʼ αὐτὸν
  choice: царствующие после него
  rationale: Сохранены причастная форма и значение престолонаследия без замены на более толковательное «его преемники».
