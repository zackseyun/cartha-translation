review_pass:
  verdict: revise
  source_fidelity: Передача βασιλεύοντας как «царствующие после него» в целом близка к греческому, а «дань» и «заложники» точны в данном политическом контексте. Однако в основном тексте «и уступили» грамматически превращает последнюю обязанность в уже совершённое действие, тогда как διδόναι относится ко всему перечислению обязанностей.
  naturalness: Исходная конструкция «обязали их, чтобы ... платили ... давали ... и уступили» синтаксически не согласована и тяжеловесна. Перестройка с инфинитивами делает фразу естественной для современного литературного русского.
  terminology: «Захватили его живым» допустимо, хотя «взяли живым» ближе к нейтральному ἔλαβον. «Большую дань» и «заложников» следует сохранить. Значение διαστολήν остаётся спорным; «уступить часть территории» отражает вероятный контекстуальный смысл, а примечание необходимо для сохранения неопределённости.
  issues:
  - severity: medium
    issue: Несогласованная форма «и уступили часть владений».
    rationale: Греческое διδόναι — инфинитив при ἔστησαν и координируется с предыдущими обязанностями. Русское прошедшее время «уступили» ошибочно сообщает о завершённой уступке, а не о предписании её совершить.
  - severity: low
    issue: «Часть владений» менее точно обозначает территориальный предмет спорного термина.
    rationale: «Территория» естественнее и яснее в политико-правовом контексте; примечание оговаривает, что греческое διαστολήν может означать также разделение или разграничение.
  revised_text: и взяли его живым[a] и обязали его и тех, кто будет царствовать после него, платить им большую дань, давать заложников и уступить часть территории[b].
