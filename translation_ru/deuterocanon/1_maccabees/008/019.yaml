  yaml_path: translation/deuterocanon/1_maccabees/008/019.yaml
  text: And they went to Rome—the journey was very long indeed—and entered the council chamber and answered[b][a],
translation:
  language: ru
  text: И они отправились в Рим — путь был чрезвычайно долгим[a] — вошли в зал совета[b] и ответили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дорога была чрезвычайно длинной». Греческое выражение буквально говорит о весьма большом пути или дороге; по смыслу имеется в виду дальность путешествия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «здание сената». Греческое слово обозначает место заседаний совета; в римском контексте это могло быть место заседаний сената.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: отправились
  rationale: Аорист депонентного πορεύομαι обозначает движение; «отправились» естественно передаёт начало и совершение далёкого путешествия, не утяжеляя повествование.
- source_word: εἰς Ῥώμην
  choice: в Рим
  rationale: Направительное εἰς с названием города естественно передаётся русским «в Рим».
- source_word: ἡ ὁδὸς πολλὴ σφόδρα
  choice: путь был чрезвычайно долгим
  rationale: ὁδός буквально означает «путь, дорога», а πολλὴ σφόδρα здесь подчёркивает его исключительную протяжённость. Русское «путь был чрезвычайно долгим» сохраняет образ пути и естественно выражает смысл длительного путешествия.
- source_word: εἰσῆλθον
  choice: вошли
  rationale: Обычное значение аориста εἰσέρχομαι; краткая форма соответствует последовательному повествованию.
- source_word: τὸ βουλευτήριον
  choice: зал совета
  rationale: βουλευτήριον обозначает помещение, где заседает совет. «Зал совета» прозрачно передаёт греческое слово, не уточняя сверх текста, что речь именно о здании сената.
- source_word: ἀπεκρίθησαν
  choice: ответили
  rationale: Форма ἀποκρίνομαι обычно значит «ответили». Хотя содержание ответа следует далее и конструкция по-русски остаётся несколько открытой, буквальное значение сохранено без добавления подразумеваемого адресата или речи.
