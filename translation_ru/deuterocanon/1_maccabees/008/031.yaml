base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/031.yaml
  text: And concerning the wrongs that King Demetrius is doing to them[a], we wrote to him, saying, “Why have you made your yoke heavy upon our friends and allies, the Jews?”
translation:
  language: ru
  text: 'А о бедах, которые царь Димитрий причиняет им[a], мы написали ему: «Почему ты сделал своё ярмо тяжким для наших друзей и союзников, иудеев?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о злодеяниях»; или: «о причиняемом им вреде». Греческое выражение может обозначать пагубные поступки или притеснительные меры, а не только нравственное зло в отвлечённом смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τῶν κακῶν
  choice: о бедах
  rationale: В данном контексте κακά обозначает причиняемое зло, бедствия или вред, а не только нравственное зло как отвлечённое понятие. «О бедах» естественно по-русски и сохраняет широту выражения.
- source_word: συντελεῖται εἰς αὐτούς
  choice: которые ... причиняет им
  rationale: Оборот указывает на действия Димитрия, оборачивающиеся вредом для иудеев. «Причиняет им» передаёт направленность и продолжающийся характер притеснений без неестественной буквальности.
- source_word: ἐγράψαμεν αὐτῷ
  choice: мы написали ему
  rationale: Аорист в повествовательном контексте естественно передаётся русским прошедшим временем совершенного вида.
- source_word: Διὰ τί ἐβάρυνας τὸν ζυγόν σου
  choice: Почему ты возложил тяжёлое ярмо
  rationale: Перевод сохраняет образ ярма и значение обременения. Русское «возложил тяжёлое ярмо» звучит естественнее буквального «утяжелил своё ярмо», не устраняя метафору угнетающей власти.
- source_word: ἐπὶ τοὺς φίλους ἡμῶν τοὺς συμμάχους Ἰουδαίους
  choice: на иудеев, наших друзей и союзников
  rationale: Приложение ясно отождествляет иудеев с друзьями и союзниками римлян; выбранный порядок естественен для современного русского языка и сохраняет обе характеристики.
