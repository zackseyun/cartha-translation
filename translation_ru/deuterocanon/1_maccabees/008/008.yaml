lexical_decisions:
- source_word: χώραν τὴν Ἰνδικὴν καὶ Μηδίαν καὶ Λυδίαν
  choice: Индию, Мидию, Лидию
  rationale: Названия областей переданы принятыми русскими географическими именами. Родовое χώραν не воспроизводится отдельно перед каждым названием, поскольку по-русски перечисление естественно и без слова «земля».
- source_word: ἀπὸ τῶν καλλίστων χωρῶν αὐτῶν
  choice: часть их лучших земель
  rationale: Предлог ἀπό при превосходной степени имеет здесь разделительное значение; «часть» делает его ясным по-русски. Местоимение «их» сохраняет форму греческого αὐτῶν и не подменяет её толкованием «его».
- source_word: λαβόντες αὐτὰς παρ' αὐτοῦ
  choice: Отняв всё это у него
  rationale: Аористное причастие передаёт предшествующее действие. «Отняв ... у него» естественно выражает получение территорий от побеждённого правителя, а «всё это» охватывает перечисленные земли.
- source_word: ἔδωκαν αὐτὰς Εὐμενεῖ τῷ βασιλεῖ
  choice: они отдали эти земли царю Евмену
  rationale: Личное местоимение восстанавливает подразумеваемое подлежащее, а повтор «эти земли» делает женское множественное αὐτάς понятным в русском тексте. Титул перед именем передан в обычной русской форме.
