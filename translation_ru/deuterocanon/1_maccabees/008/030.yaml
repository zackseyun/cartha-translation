  yaml_path: translation/deuterocanon/1_maccabees/008/030.yaml
  text: But if[a], after these terms, these people and those decide to add or to remove anything, they will do so by their own choice[b], and whatever they add or remove will be valid.
translation:
  language: ru
  text: Но если после этих условий обе стороны[a] решат что-либо добавить или изъять, они поступят по собственному выбору, и всё, что они добавят или изымут, будет иметь силу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «эти и эти»; повтор указательных местоимений обозначает обе стороны договора.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет действительно» либо «будет обязательным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους
  choice: условий
  rationale: В контексте договора λόγοι обозначает изложенные условия или положения, а не просто произнесённые слова.
- source_word: βουλεύσωνται
  choice: решат
  rationale: В условной формулировке глагол указывает на принятое после обдумывания решение; «решат» естественно передаёт этот смысл по-русски.
- source_word: οὗτοι καὶ οὗτοι
  choice: обе стороны
  rationale: Повтор указательных местоимений относится к двум участникам договора. «Обе стороны» ясно передаёт двусторонний характер формулы, а буквальность отмечена в сноске.
- source_word: προσθεῖναι ἢ ἀφελεῖν
  choice: добавить или изъять
  rationale: Эта пара обозначает внесение изменений в договорные условия. «Изъять» уместно в юридическом контексте и сохраняет противопоставление добавлению.
- source_word: ἐξ αἱρέσεως αὐτῶν
  choice: по собственному выбору
  rationale: αἵρεσις здесь означает выбор или решение, а не религиозное течение; перевод сохраняет указание на добровольное совместное решение сторон.
- source_word: κύρια
  choice: иметь силу
  rationale: В правовом контексте κύρια означает действительность и обязательную силу внесённых изменений.
