  yaml_path: translation/deuterocanon/1_maccabees/008/032.yaml
  text: If they still bring charges against you[a], we will execute judgment on them, and we will fight against them by sea and by land.
translation:
  language: ru
  text: Если же они и впредь будут обращаться с жалобой на тебя, мы рассудим их дело и будем воевать против тебя на море и на суше.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «будем воевать против тебя». Такое обращение к адресату трудно согласовать с остальным контекстом. Некоторые переводы передают эту фразу иначе: «будем воевать за тебя» либо «против них».'
    reason: textual_difficulty
lexical_decisions:
- source_word: ἐὰν οὖν ἔτι
  choice: Если же они и впредь
  rationale: Условие передано прямо; οὖν связывает фразу с предшествующим и здесь естественно выражается частицей «же», а ἔτι указывает на возможное продолжение или возобновление действий — «и впредь».
- source_word: ἐντύχωσιν κατὰ σοῦ
  choice: будут обращаться с жалобой на тебя
  rationale: ἐντυγχάνω с κατά обозначает в данном дипломатико-судебном контексте обращение с жалобой или прошением против адресата, а не вооружённое нападение.
- source_word: ποιήσομεν αὐτοῖς τὴν κρίσιν
  choice: мы рассудим их дело
  rationale: Выражение означает совершить судебное разбирательство или предоставить судебное решение применительно к их жалобе. Русская формулировка остаётся ясной и не навязывает спорного понимания αὐτοῖς как указания на наказание «над ними».
- source_word: πολεμήσομέν σε
  choice: будем воевать против тебя
  rationale: В засвидетельствованном греческом тексте стоит местоимение σε, «тебя», а глагол πολεμέω с прямым дополнением означает вести войну против кого-либо. Эта трудная в контексте формулировка сохранена.
- source_word: διὰ τῆς θαλάσσης καὶ διὰ τῆς ξηρᾶς
  choice: на море и на суше
  rationale: Естественная русская военная формула, точно передающая обе сферы ведения войны.
theological_decisions:
- issue: Неожиданный объект военных действий в заключительной части
  choice: Сохранено чтение «будем воевать против тебя»
  alternative: «будем воевать за тебя» или «будем воевать против них»
  rationale: Греческий текст прямо читает πολεμήσομέν σε — «будем воевать против тебя». Хотя контекст допускает подозрение на текстовую трудность и некоторые пересказы меняют объект, исправлять засвидетельствованный текст без рукописного основания не следует.
- issue: Значение αὐτοῖς при τὴν κρίσιν ποιεῖν
  choice: «рассудим их дело»
  alternative: «совершим над ними суд»
  rationale: Дательный αὐτοῖς может указывать на лиц, чью жалобу рассмотрят, а не обязательно на осуждаемых. Нейтральная формулировка сохраняет судебный смысл и не создаёт противоречия с последующей угрозой адресату.
translation_notes:
  register: Современный литературный русский язык с достоинством дипломатического послания. Формулировка ясна широкому читателю; синтаксическая и смысловая трудность греческого текста не скрыта.
