  yaml_path: translation/deuterocanon/1_maccabees/008/011.yaml
  text: And they enslaved them to this day[a]. And the remaining kingdoms and the islands, as many as ever resisted them[b], they destroyed and enslaved to them.
translation:
  language: ru
  text: И они поработили их до сего дня[a]. А остальные царства и острова — всех, кто когда-либо противостоял им, — они разорили[b] и обратили себе в рабство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до нынешнего дня».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уничтожили» или «опустошили»; греческий глагол может обозначать тяжёлое разорение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδουλώσαντο
  choice: поработили
  rationale: Глагол передаёт не просто политическое подчинение, а обращение в рабскую зависимость; «поработили» сохраняет эту силу и уместен в военно-политическом контексте.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: до сего дня
  rationale: Устойчивое и понятное выражение, обозначающее продолжение состояния вплоть до времени повествователя.
- source_word: τὰς ἐπιλοίπους βασιλείας
  choice: остальные царства
  rationale: ἐπίλοιπος означает оставшийся или прочий; «остальные царства» естественно продолжает перечень предшествующего контекста.
- source_word: τὰς νήσους
  choice: острова
  rationale: Прямой перевод без необязательного расширения до «островных владений».
- source_word: ὅσοι ποτὲ ἀντέστησαν αὐτοῖς
  choice: всех, кто когда-либо противостоял им
  rationale: Формулировка сохраняет неопределённо-всеобъемлющий смысл ὅσοι и усиление ποτέ, а также личную форму греческого оборота.
- source_word: κατέφθειραν
  choice: разорили
  rationale: В данном контексте глагол обозначает тяжёлое разрушение и опустошение. «Разорили» не требует понимать действие как полное истребление тех, кого затем обратили в рабство.
- source_word: ἐδούλωσαν αὐτοῖς
  choice: обратили себе в рабство
  rationale: «Обратили в рабство» сохраняет сильное значение δουλόω, а «себе» передаёт явное αὐτοῖς — зависимость устанавливается в пользу римлян.
theological_decisions:
- issue: Передача лексики рабства в военно-политическом контексте
  choice: поработили; обратили себе в рабство
  alternative: подчинили; покорили
  rationale: Более мягкие варианты передают политическое господство, но ослабляют прямую рабскую семантику глаголов группы δουλόω. Выбранный перевод сохраняет суровость греческого текста, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским оттенком. Выражение «до сего дня» сохраняет достоинство регистра и остаётся общеупотребительным. Тире проясняет присоединительный оборот «всех, кто…», отражающий грамматический переход греческого текста от царств и островов к противостоявшим римлянам людям.
