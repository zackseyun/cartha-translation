  yaml_path: translation/deuterocanon/1_maccabees/008/023.yaml
  text: May it go well for the Romans and for the nation of the Jews[a], on sea and on land forever[b]; and may sword and enemy be far from them.
translation:
  language: ru
  text: Да будет хорошо римлянам и народу иудеев на море и на суше навеки; и да будут меч и враг далеко от них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλῶς γένοιτο
  choice: Да будет благо
  rationale: Оптатив выражает пожелание благополучия. Формулировка сохраняет торжественный язык договора и естественно звучит по-русски.
- source_word: Ῥωμαίοις
  choice: римлянам
  rationale: Дательный падеж множественного числа обозначает римский народ как сторону договора.
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: народу иудейскому
  rationale: ἔθνος здесь обозначает народ как этнополитическое целое; «иудейскому» соответствует историческому контексту книги.
- source_word: ἐν τῇ θαλάσσῃ καὶ ἐπὶ τῆς ξηρᾶς
  choice: на море и на суше
  rationale: Естественная русская парная формула, сохраняющая греческий меризм двух областей деятельности.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Передаёт неограниченную длительность пожелания и соответствует торжественному договорному регистру.
- source_word: ῥομφαία
  choice: меч
  rationale: Сохраняет конкретный образ оружия исходного текста, хотя в контексте слово может метонимически обозначать войну.
- source_word: ἐχθρός
  choice: враг
  rationale: Прямой русский эквивалент; единственное число может иметь собирательное или обобщающее значение.
- source_word: μακρυνθείη ἀπ' αὐτῶν
  choice: да будут ... далеко от них
  rationale: Передаёт пожелание, выраженное пассивным оптативом, и сохраняет пространственный образ удаления.
