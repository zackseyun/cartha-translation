lexical_decisions:
- source_word: ἐὰν δὲ ἐνστῇ πόλεμος
  choice: Но если война… начнётся
  rationale: Условная конструкция передана естественно по-русски; ἐνστῇ обозначает наступление или возникновение войны.
- source_word: Ῥώμῃ
  choice: против Рима
  rationale: Дательный указывает, кого затрагивает война; «против Рима» ясно передаёт враждебное наступление и естественно сочетается с дальнейшим «против кого-либо».
- source_word: προτέρα
  choice: прежде
  rationale: 'Сохранено значение первоочерёдности: речь идёт о случае, когда война сначала затронет римскую сторону.'
- source_word: ἢ πᾶσι τοῖς συμμάχοις αὐτῶν
  choice: или против кого-либо из его союзников
  rationale: Греческое πᾶσι в данном распределительном контексте естественно передаётся как «кого-либо из»; местоимение согласовано с русским единственным числом «Рим».
- source_word: ἐν πάσῃ κυρίᾳ αὐτῶν
  choice: в пределах всех его владений
  rationale: κυρία здесь имеет территориально-политический смысл — область господства или владения; формулировка сохраняет широкий охват πάσῃ.
