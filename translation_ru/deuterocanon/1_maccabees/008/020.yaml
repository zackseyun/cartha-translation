base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/020.yaml
  text: Judas[a], who is also called Maccabeus, and his brothers and the multitude of the Jews sent us to you, to establish an alliance and peace with you, and to have us enrolled as your allies and friends.
translation:
  language: ru
  text: «Иуда, называемый также Маккавеем, его братья и множество иудеев послали нас к вам, чтобы установить с вами союз и мир и чтобы нас внесли в число ваших союзников и друзей[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы нас записали как ваших союзников и друзей». Греческое выражение, вероятно, подразумевает официальную дипломатическую запись или внесение в список.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: Иуда
  rationale: Традиционная и естественная русская форма библейского имени Ἰούδας.
- source_word: ὁ καὶ Μακκαβαῖος
  choice: называемый также Маккавеем
  rationale: Передаёт конструкцию с дополнительным именем или прозвищем и естественно звучит по-русски.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: его братья
  rationale: Прямое значение выражения; контекст не требует расширять его до более общего «братья по вере».
- source_word: τὸ πλῆθος τῶν Ἰουδαίων
  choice: множество иудеев
  rationale: Сохраняет собирательное значение πλῆθος, не превращая названную группу в формальное собрание и не добавляя значения «весь народ».
- source_word: ἀπέστειλαν ἡμᾶς πρὸς ὑμᾶς
  choice: послали нас к вам
  rationale: Точное и естественное соответствие греческой конструкции.
- source_word: στῆσαι μεθ' ὑμῶν
  choice: установить с вами
  rationale: В дипломатическом контексте στῆσαι означает учреждение или установление отношений; порядок слов сохраняет связь «с вами» и с союзом, и с миром.
- source_word: συμμαχίαν καὶ εἰρήνην
  choice: союз и мир
  rationale: Передаёт оба существительных без добавления отсутствующих в тексте уточнений «военный» или «мирный договор».
- source_word: γραφῆναι ἡμᾶς
  choice: чтобы нас внесли в число
  rationale: Пассивный инфинитив γράφω здесь, вероятно, обозначает официальную запись или регистрацию; русский оборот передаёт этот административно-дипломатический смысл.
- source_word: συμμάχους καὶ φίλους ὑμῶν
  choice: ваших союзников и друзей
  rationale: Сохраняет устойчивую дипломатическую пару и отношение, выраженное греческим местоимением в родительном падеже.
