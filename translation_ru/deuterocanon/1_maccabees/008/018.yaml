  text: and to remove their yoke[a], because they saw that the kingdom of the Greeks was enslaving Israel.
translation:
  language: ru
  text: и сбросить их ярмо, потому что они видели, как царство греков порабощает Израиль, обращая его в рабство[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с усилительным повтором: «порабощает Израиль в рабство»; по смыслу также: «ввергает Израиль в неволю».'
    reason: Передаёт необычную однокоренную конструкцию греческого текста и её более идиоматичный русский вариант.
lexical_decisions:
- source_word: ἆραι
  choice: сбросить
  rationale: В сочетании с «ярмом» аористный инфинитив αἴρω означает устранить, снять гнёт; «сбросить ярмо» — естественный русский фразеологизм.
- source_word: ζυγὸν αὐτῶν
  choice: их ярмо
  rationale: 'Сохраняется исходная метафора ярма и местоименная неоднозначность: текст прямо не заменяет «их» уточняющим обозначением власти.'
- source_word: βασιλείαν τῶν Ἑλλήνων
  choice: царство греков
  rationale: Формально передаёт политическое значение βασιλεία и сохраняет этнополитическое обозначение Ἑλλήνων без конкретизации как империи.
- source_word: καταδουλουμένους
  choice: порабощает
  rationale: Глагол обозначает обращение в рабство или полное подчинение; настоящее время естественно передаёт наблюдаемое продолжающееся действие.
- source_word: δουλίαν
  choice: обращая его в рабство
  rationale: Дополнительный оборот сохраняет усилительный повтор рабской лексики исходного текста, но оформляет его естественно по-русски.
theological_decisions:
- issue: Усиленный повтор лексики рабства в историко-политическом контексте
  choice: порабощает Израиль, обращая его в рабство
  alternative: порабощает Израиль
  rationale: Сочетание καταδουλόω и δουλία намеренно усиливает образ полного порабощения. Перевод сохраняет это ударение, не смягчая его до общего «подчиняет».
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа ярма. Фраза «сбросить ярмо» понятна широкому читателю; усиленная рабская лексика оставлена заметной, но грамматически естественной.
