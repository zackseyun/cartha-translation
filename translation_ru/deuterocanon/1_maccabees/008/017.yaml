lexical_decisions:
- source_word: ἐπέλεξεν
  choice: выбрал
  rationale: Обычное значение глагола — «выбрал, избрал»; «выбрал» естественно для современного повествования и не придаёт действию лишнего оттенка официального назначения.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Прямой и естественный повествовательный эквивалент греческого глагола.
- source_word: στῆσαι
  choice: чтобы установить
  rationale: Инфинитив выражает цель посольства; «установить» уместно для дипломатических отношений и передаёт смысл учреждения формальной связи.
- source_word: φιλίαν
  choice: дружбу
  rationale: Сохраняет основное лексическое значение; в сочетании с «союзом» ясно приобретает дипломатический оттенок.
- source_word: συμμαχίαν
  choice: союз
  rationale: Точно передаёт политический или военный альянс, не уточняя его характер сверх сказанного в источнике.
- source_word: τοῦ Ἀκχώς
  choice: сына Аккоса
  rationale: 'Повтор артикля перед родительным падежом естественно допускает продолжение родословной цепочки: Евполем — сын Иоанна, а Иоанн — сын Аккоса.'
- source_word: αὐτοῖς
  choice: с римлянами
  rationale: Дательный падеж обозначает сторону, с которой предполагалось установить отношения. Явное «с римлянами» устраняет неестественную для русского языка местоименную двусмысленность, сохраняя ясную отсылку к Риму.
