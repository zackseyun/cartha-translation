lexical_decisions:
- source_word: δυνατοὶ ἰσχύϊ
  choice: могучи силой
  rationale: Несколько усиленная греческая формула подчёркивает военную мощь; русское выражение сохраняет эту эмфазу и звучит достойно.
- source_word: διηγήσαντο αὐτῷ
  choice: ему рассказали
  rationale: Глагол означает подробное сообщение или повествование; нейтральное «рассказали» естественно в современном русском контексте.
- source_word: τοὺς πολέμους αὐτῶν
  choice: об их войнах
  rationale: «Войны» прямо передаёт множественное число и не сужает значение до отдельных битв или походов.
- source_word: τὰς ἀνδραγαθίας
  choice: доблестных деяниях
  rationale: Передаёт воинскую отвагу и выдающиеся подвиги без ненужной гендерной конкретизации и архаической тяжеловесности.
- source_word: ἃς ποιοῦσιν ἐν τοῖς Γαλάταις
  choice: среди галатов
  rationale: Сохраняет буквальную пространственно-реляционную неопределённость ἐν τοῖς Γαλάταις, не подменяя её более определённым «против галатов» или «в Галатии».
- source_word: κατεκράτησαν αὐτῶν
  choice: покорили их
  rationale: Глагол обозначает одоление и установление власти; «покорили» естественно связывает военную победу с последующим наложением дани.
- source_word: ἤγαγον αὐτοὺς ὑπὸ φόρον
  choice: обложили данью
  rationale: Устойчивое русское выражение ясно передаёт политико-финансовое подчинение, буквально выраженное как приведение под дань.
