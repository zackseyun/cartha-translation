base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/004.yaml
  text: And they gained control of the whole region by their counsel and by the sword—though the region was very far away from them—and of the kings who came against them from the end of the earth[a], until they crushed them and struck them with a great blow[b]; and the rest give them tribute year by year.
translation:
  language: ru
  text: И они подчинили себе всю эту область благодаря своим замыслам и мечу — хотя область эта находилась очень далеко от них, — а также царей, выступивших против них от края земли[a], пока не сокрушили их и не нанесли им тяжкий удар; остальные[b] же платят им дань из года в год.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от края земли»; это выражение означает чрезвычайно далёкое место.'
    reason: lexical_alternative
  - marker: b
    text: Под «остальными» могут подразумеваться прочие цари или народы, которые продолжают ежегодно платить римлянам дань.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεκράτησαν
  choice: подчинили себе
  rationale: Передаёт установление силового политического господства и естественно сочетается как с областью, так и с царями.
- source_word: τοῦ τόπου παντός
  choice: всю ту область
  rationale: В данном геополитическом контексте τόπος обозначает территорию или область; указательное «ту» помогает связности повествования, не расширяя смысл до всей земли.
- source_word: τῇ βουλῇ αὐτῶν
  choice: благодаря своим замыслам
  rationale: βουλή здесь может обозначать продуманный план, политический расчёт или совет. «Замыслы» сохраняет широту значения и образно противопоставляется мечу.
- source_word: τῇ ῥομφαίᾳ
  choice: мечу
  rationale: Сохраняет исходную метонимию военной силы.
- source_word: μακρὰν ἀπέχων ἀπʼ αὐτῶν σφόδρα
  choice: находилась очень далеко от них
  rationale: Прямо передаёт удалённость и усилительное σφόδρα.
- source_word: τῶν βασιλέων τῶν ἐπελθόντων ἐπʼ αὐτούς
  choice: а также царей, выступивших против них
  rationale: Генитив продолжает ряд объектов при κατεκράτησαν; «выступивших против» ясно выражает враждебное наступление.
- source_word: ἀπʼ ἄκρου τῆς γῆς
  choice: от края земли
  rationale: Близко следует греческому единственному числу и сохраняет древний пространственный образ крайней удалённости.
- source_word: συνέτριψαν
  choice: сокрушили
  rationale: Передаёт сильный военный глагол и решительность разгрома.
- source_word: ἐπάταξαν ἐν αὐτοῖς πληγὴν μεγάλην
  choice: нанесли им тяжёлое поражение
  rationale: Естественно по-русски передаёт идиому о сильном ударе, не создавая неясного буквального оборота.
- source_word: οἱ ἐπίλοιποι
  choice: остальные
  rationale: Сохраняет неопределённость греческого текста относительно того, имеются ли в виду прочие цари, народы или уцелевшие противники.
- source_word: ὀιδόασιν αὐτοῖς φόρον
  choice: платят им дань
  rationale: Устойчивое русское выражение для регулярной выплаты φόρος; настоящее время исходного текста сохранено.
- source_word: κατʼ ἐνιαυτόν
  choice: из года в год
  rationale: Передаёт повторяющийся ежегодный характер выплаты.
