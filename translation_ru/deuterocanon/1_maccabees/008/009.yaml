  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истребить их»; греческий глагол может означать насильственное уничтожение, но также имеет более широкое значение «устранить, удалить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ τῆς Ἑλλάδος
  choice: пришедшие из Греции
  rationale: Передаёт буквальное указание на происхождение, не заменяя его более широким этнонимом «греки»; в русском для субстантивированного оборота естественно добавить «пришедшие».
- source_word: ἐβουλεύσαντο
  choice: задумали
  rationale: Средний аорист обозначает принятое после обдумывания намерение; «задумали» звучит естественно и не усиливает отрицательную окраску до «замыслили зло».
- source_word: ἐλθεῖν
  choice: выступить против них
  rationale: Буквально «прийти», но в военно-политическом контексте русское «выступить против» естественно выражает направленное враждебное движение; объект восстанавливается из последующего αὐτούς.
- source_word: ἐξᾶραι
  choice: устранить
  rationale: Сохраняет широту значения «удалить, устранить», не утверждая однозначно полное истребление, хотя контекст допускает более сильный смысл.
- source_word: αὐτούς
  choice: их
  rationale: Обычная передача винительного местоимения, относящегося к упомянутому народу.
