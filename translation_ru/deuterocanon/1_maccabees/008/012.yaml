base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/012.yaml
  text: But with their allies and with those who relied on them they maintained friendship[a], and they gained control over the kingdoms near and far[b]; and all who heard their name feared them.
translation:
  language: ru
  text: А со своими союзниками[а] и с теми, кто на них полагался, они поддерживали с ними дружеские отношения; они подчинили себе близкие и далёкие царства, и все, кто слышал их имя[б], боялись их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: 'Или: «друзьями». Греческое φίλοι может обозначать как личных друзей, так и политических союзников; здесь дипломатический контекст говорит в пользу значения «союзники».'
    reason: lexical_alternative
  - marker: б
    text: Выражение «слышать чьё-либо имя» может означать услышать о его известности или славе.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: А со
  rationale: δέ продолжает повествование с лёгким оттенком перехода; русское «а» естественно передаёт эту связь, не усиливая её до резкого противопоставления.
- source_word: τῶν φίλων αὐτῶν
  choice: своими союзниками
  rationale: φίλοι буквально может означать «друзья», но в политико-дипломатическом контексте речь, вероятнее всего, идёт о дружественных государствах или партнёрах; неоднозначность отмечена в сноске.
- source_word: τῶν ἐπαναπαυομένων αὐτοῖς
  choice: теми, кто на них полагался
  rationale: Причастие ἐπαναπαυομένων выражает доверие и зависимость; «полагался» передаёт это естественно и без лишнего оттенка покоя.
- source_word: συνετήρησαν αὐτοῖς φιλίαν
  choice: они сохраняли дружбу
  rationale: συντηρέω означает сохранять или поддерживать, а φιλία здесь обозначает устойчивые дружественные отношения. Формулировка также сохраняет повтор темы дружбы в греческом тексте.
- source_word: κατεκράτησαν
  choice: подчинили себе
  rationale: κατακρατέω выражает установление господства или превосходства. «Подчинили себе» передаёт политическое владычество, не приписывая римлянам формального царского титула.
- source_word: τῶν βασιλειῶν τῶν ἐγγὺς καὶ τῶν μακρῶν
  choice: царства близкие и далёкие
  rationale: Сохраняется прямое значение βασιλεῖαι и краткая пространственная пара «близкие и далёкие», охватывающая широкую географию.
- source_word: ὅσοι ἤκουσαν τὸ ὄνομα αὐτῶν
  choice: все, кто слышал их имя
  rationale: Перевод сохраняет образное выражение оригинала; «имя» здесь может подразумевать известность или славу, что поясняется в сноске.
- source_word: ἐφοβοῦντο αὐτούς
  choice: боялись их
  rationale: Прямая современная формулировка точно передаёт страх перед могуществом римлян.
