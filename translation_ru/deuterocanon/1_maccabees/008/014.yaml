base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/014.yaml
  text: And in all these matters not one of them put on a crown[b][a], nor did they clothe themselves in purple so as to exalt themselves by it.
translation:
  language: ru
  text: И при всём этом никто из них не возлагал на себя диадему[a] и не облачался в пурпур[b], чтобы возвеличить себя этим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть царскую головную повязку — знак царской власти.
    reason: lexical_alternative
  - marker: b
    text: Пурпурное одеяние служило знаком царского или высокого положения.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἅπασιν τούτοις
  choice: при всём этом
  rationale: Естественно связывает стих с предшествующим описанием римского государственного устройства и сохраняет широкий охват греческого выражения.
- source_word: ἐπέθετο ... διάδημα
  choice: не возлагал на себя диадему
  rationale: Глагол передаёт действие возложения, а «диадема» точно обозначает царскую головную повязку, связанную с монархической властью.
- source_word: πορφύραν
  choice: не облачался в пурпур
  rationale: 'Сохраняет краткую метонимию оригинала: пурпур означает пурпурное одеяние и связан с царским или высоким положением.'
- source_word: ἁδρυνθῆναι
  choice: чтобы возвеличить себя
  rationale: Передаёт целевое значение инфинитива и идею внешнего возвышения собственного статуса без излишнего уточнения нравственного мотива.
- source_word: ἐν αὐτῇ
  choice: этим
  rationale: 'Естественно выражает инструментальный смысл: возвеличение посредством пурпура; при этом сохраняется отсылка к предшествующему образу.'
