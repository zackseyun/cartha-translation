lexical_decisions:
- source_word: βουλευτήριον
  choice: совет
  rationale: Обозначает совещательный или правящий орган; «совет» естественно по-русски и не сужает значение до строго римского сената или помещения для заседаний.
- source_word: ἐποίησαν ἑαυτοῖς
  choice: учредили они у себя
  rationale: В контексте учреждения органа власти передаёт идиоматический смысл «создали для себя», сохраняя возвратную направленность выражения.
- source_word: καθ' ἡμέραν
  choice: каждый день
  rationale: Прямо и естественно передаёт регулярность действия.
- source_word: ἐβουλεύοντο
  choice: совещались
  rationale: Имперфект указывает на повторяющееся, обычное действие; сочетание с «каждый день» ясно выражает эту длительность.
- source_word: τριακόσιοι καὶ εἴκοσι
  choice: триста двадцать человек
  rationale: Числительное передано прямо; слово «человек» добавлено по нормам русского языка для ясности подразумеваемого состава совета.
- source_word: βουλευόμενοι διὰ παντός
  choice: постоянно заботясь
  rationale: Причастие повторяет корень предыдущего глагола и буквально связано с совещанием; в сочетании с περὶ τοῦ πλήθους здесь естественно передаёт непрестанную попечительную деятельность совета без тяжеловесного повтора «постоянно совещаясь».
- source_word: περὶ τοῦ πλήθους
  choice: о народе
  rationale: πλῆθος в гражданском контексте обозначает совокупность народа; «народ» современнее и яснее буквального «множество».
- source_word: τοῦ εὐκοσμεῖν ἑαυτούς
  choice: чтобы поддерживать у себя добрый порядок
  rationale: εὐκοσμεῖν означает хорошо устраивать, содержать в порядке. Формулировка сохраняет значение общественного порядка и возвратное ἑαυτούς, не усиливая его до однозначного «управлять собой».
