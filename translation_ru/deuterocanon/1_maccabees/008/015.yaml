revisions:
- from: И учредили они у себя совет, и каждый день триста двадцать человек совещались, постоянно заботясь о народе, чтобы поддерживать у себя добрый порядок.[a]
  to: И учредили они у себя совет, и каждый день триста двадцать человек совещались, постоянно обсуждая дела народа, чтобы поддерживать у себя надлежащий порядок.[a]
  rationale: Исправлено «постоянно заботясь» на «постоянно обсуждая дела народа», чтобы передать βουλευόμενοι как продолжение совещательной деятельности. Добавление «дела» делает русскую конструкцию естественной и выражает предмет обсуждения, не меняя гражданского смысла περὶ τοῦ πλήθους. Сноска переработана, чтобы не подменять ἑαυτούς словами «свои дела» и сохранять допустимую смысловую широту εὐκοσμεῖν.
