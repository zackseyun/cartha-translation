base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/005.yaml
  text: And Philip[a], and Perseus king of the Kittians[b], and those who rose up against them—they crushed them in war and prevailed over them.
translation:
  language: ru
  text: И Филиппа, и Персея, царя киттеев[a], и тех, кто восстал против них[b], они сокрушили в войне и одолели их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «киттеев». В данном историческом контексте это название, вероятно, относится к Македонскому царству; некоторые переводы передают предполагаемый смысл как «македонян».'
    reason: alternative_reading
  - marker: b
    text: В дошедшем до нас греческом тексте перед словами «тех, кто восстал» союз καὶ («и») повторён трижды. По-видимому, это текстовая неправильность, не меняющая общего смысла.
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππον
  choice: Филиппа
  rationale: Общепринятая русская форма греческого личного имени; винительный падеж передаёт синтаксис исходного текста.
- source_word: Περσέα
  choice: Персея
  rationale: Общепринятая русская форма греческого личного имени; винительный падеж соответствует исходному тексту.
- source_word: Κιτιέων
  choice: киттеев
  rationale: Сохранён этноним во множественном числе, а не внесено историческое отождествление с македонянами. Форма «киттеи» согласуется с русской библейской передачей родственного названия «Киттим».
- source_word: βασιλέα
  choice: царя
  rationale: Естественная и традиционная русская передача царского титула в библейском историческом повествовании.
- source_word: τοὺς ἐπηρμένους ἐπʼ αὐτοὺς
  choice: тех, кто восстал против них
  rationale: Передаёт метафору враждебного выступления, не сводя выражение только к нападению или формальному мятежу.
- source_word: συνέτριψαν
  choice: сокрушили
  rationale: Сохраняет сильный образ решительного военного поражения и звучит естественно в современном литературном русском языке.
- source_word: πολέμῳ
  choice: в войне
  rationale: Близко передаёт дательный падеж обстоятельства или средства, не сужая значение до одной битвы.
- source_word: κατεκράτησαν αὐτῶν
  choice: одолели
  rationale: Ясно выражает достижение превосходства над противниками, не утверждая непременно длительного политического господства.
theological_decisions:
- issue: Исторически значимый этноним Κιτιέων
  choice: киттеев
  alternative: македонян; жителей Китиона
  rationale: Основной текст следует засвидетельствованному греческому этнониму и не подменяет его вероятным историческим толкованием. Возможное отнесение к Македонскому царству указано в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского исторического повествования. Парная конструкция «и … и …» сохраняет перечисление оригинала; резкая смена к подлежащему «они» оставлена, поскольку она присутствует в греческом тексте и связывается с римлянами из предшествующего контекста.
