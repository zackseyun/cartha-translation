  yaml_path: translation/deuterocanon/1_maccabees/008/001.yaml
  text: And Judas heard the name of the Romans[a], that they are mighty in strength, and that they are well disposed toward all who attach themselves to them, and that as many as come to them obtain friendship with them[b],
translation:
  language: ru
  text: 'Иуда услышал о славе римлян[a]: они весьма сильны, благосклонны ко всем, кто примыкает к ним, и со всяким, кто приходит к ним, вступают в дружеские отношения[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «об имени римлян»; здесь «имя» означает славу, известность или репутацию.'
    reason: lexical_alternative
  - marker: b
    text: «Дружеские отношения» здесь могут означать официальную политическую дружбу или союз, а не только личную привязанность.
    reason: cultural_note
lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямо передаёт аорист глагола «слышать» и естественно вводит полученные Иудой сведения.
- source_word: τὸ ὄνομα τῶν Ῥωμαίων
  choice: о славе римлян
  rationale: Буквально — «имя римлян»; здесь ὄνομα обозначает известность, славу или репутацию. Русское «о славе» естественно передаёт смысл идиомы, а буквальная форма сохранена в примечании.
- source_word: δυνατοὶ ἐν ἰσχύϊ
  choice: весьма сильны
  rationale: Греческое сочетание эмфатично и буквально говорит о «сильных силой». Наречие «весьма» сохраняет усиление без неестественной русской тавтологии.
- source_word: εὐδοκοῦσιν
  choice: благосклонны
  rationale: В данном контексте речь идёт о благоприятном отношении римлян к тем, кто с ними сближается; это слово не сводится к внутреннему удовольствию.
- source_word: τοῖς προστεθειμένοις αὐτοῖς
  choice: ко всем, кто примыкает к ним
  rationale: Причастие обозначает людей, присоединившихся или примкнувших к римлянам. «Примыкает» сохраняет политический оттенок, не превращая его однозначно в формальный союз.
- source_word: ὅσοι ἐὰν προσέλθωσιν αὐτοῖς
  choice: со всяким, кто приходит к ним
  rationale: Передаёт обобщающе-неопределённую конструкцию и сохраняет образ приближения или обращения к римлянам.
- source_word: ἐσπῶντο αὐτοῖς φιλίαν
  choice: вступают в дружеские отношения
  rationale: Формулировка передаёт установление φιλία как отношений дружбы; в политическом контексте это могло включать официальную дружбу или союз, что поясняется в примечании.
