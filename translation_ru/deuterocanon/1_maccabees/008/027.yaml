  text: Likewise[a], if war should first come upon the nation of the Jews, the Romans will fight as allies wholeheartedly[b], as the occasion may direct them.
translation:
  language: ru
  text: Равным образом, если война прежде постигнет народ иудеев, римляне от всей души выступят на их стороне, как того потребуют обстоятельства.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как им подскажут обстоятельства»; греческое выражение допускает смысл указания или предписания сообразно сложившимся обстоятельствам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτὰ
  choice: Так же и
  rationale: Переходная формула отсылает к только что изложенным взаимным обязательствам и естественно передаёт значение «таким же образом».
- source_word: ἔθνει Ἰουδαίων
  choice: народ иудеев
  rationale: ἔθνος здесь означает народ как общность; такая формулировка близка греческой конструкции и уместна для исторического контекста.
- source_word: συμβῇ προτέρῳ πόλεμος
  choice: война прежде постигнет
  rationale: Сохраняются условность оборота ἐὰν с сослагательным наклонением и временной приоритет προτέρῳ — война сначала постигает иудеев.
- source_word: συμμαχήσουσιν
  choice: выступят их союзниками
  rationale: Глагол обозначает деятельную военную помощь союзнику, а не только формальное заключение союза.
- source_word: ἐκ ψυχῆς
  choice: от всей души
  rationale: Устойчивое русское выражение передаёт полноту усердия и решимости, сохраняя образность греческой фразы.
- source_word: ὡς ἂν αὐτοῖς ὁ καιρὸς ὑπογράφῃ
  choice: как им укажут обстоятельства
  rationale: καιρός обозначает складывающуюся обстановку или подходящий момент, а ὑπογράφῃ — указание либо предписание; множественное «обстоятельства» звучит по-русски естественно и сохраняет открытость условия.
