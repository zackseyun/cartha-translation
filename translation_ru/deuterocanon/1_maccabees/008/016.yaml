base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/016.yaml
  text: And they entrust one man to rule over them each year and to exercise lordship over all their land[a], and all listen to the one, and there is no envy or jealousy among them.
translation:
  language: ru
  text: И каждый год они вверяют одному человеку власть над собой и над всей своей землёй; все слушаются этого одного, и нет среди них ни зависти, ни соперничества.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστεύουσιν
  choice: вверяют ... власть
  rationale: С инфинитивами ἄρχειν и κυριεύειν глагол означает, что одному человеку доверяют осуществление власти; такая передача естественна по-русски и не сводит смысл к простому «верят».
- source_word: ἑνὶ ἀνθρώπῳ
  choice: одному человеку
  rationale: Передаёт единственность носителя власти; в современном русском «человек» здесь естественно обозначает конкретное лицо, хотя греческая форма грамматически мужского рода.
- source_word: ἄρχειν αὐτῶν
  choice: власть над собой
  rationale: Передаёт политическое управление ими без неестественного повтора «править ими» после конструкции «вверяют власть».
- source_word: κατ' ἐνιαυτόν
  choice: каждый год
  rationale: Сохраняет значение ежегодной смены или назначения на годичный срок, не уточняя административную процедуру сверх текста.
- source_word: κυριεύειν πάσης τῆς γῆς αὐτῶν
  choice: '[власть] над всей своей землёй'
  rationale: κυριεύειν выражает господство или полновластие, а γῆ в данном политическом контексте — подвластную землю; общая конструкция с «властью» по-русски передаёт оба координированных инфинитива без тяжеловесности.
- source_word: ἀκούουσιν τοῦ ἑνός
  choice: слушаются этого одного
  rationale: ἀκούω с родительным в контексте управления подразумевает повиновение. «Слушаются» сохраняет образ слушания и естественно выражает послушание, не усиливая его до категоричного «повинуются».
- source_word: φθόνος
  choice: зависть
  rationale: Обычное значение слова — завистливая неприязнь.
- source_word: ζῆλος
  choice: соперничество
  rationale: В отрицательной паре с φθόνος речь идёт не о положительном рвении, а о ревнивом соперничестве; русский вариант ясно отличает его от «зависти».
