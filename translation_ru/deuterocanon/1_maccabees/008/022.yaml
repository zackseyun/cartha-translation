base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/022.yaml
  text: And this is the copy of the document that they copied onto bronze tablets and sent to Jerusalem, to be there among them as a memorial of peace and alliance.
translation:
  language: ru
  text: И вот копия документа, который они переписали на бронзовых табличках и отправили в Иерусалим, чтобы там, у них, она служила напоминанием о мире и союзе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: копия
  rationale: Обозначает воспроизведённый письменный текст; «копия» естественно звучит в официально-административном контексте.
- source_word: γραφῆς
  choice: документа
  rationale: В данном контексте речь идёт об официальной записи, а не о Писании вообще; «документ» ясно передаёт этот смысл.
- source_word: ἀντέγραψαν
  choice: переписали
  rationale: Глагол означает изготовление письменной копии; «переписали» сохраняет связь с «копией» без неестественного повтора.
- source_word: ἐπὶ δέλτους χαλκαῖς
  choice: на бронзовых табличках
  rationale: δέλτοι — таблички для письма, а χαλκαῖς указывает на бронзу; сочетание подходит для официальной договорной записи.
- source_word: μνημόσυνον
  choice: напоминание
  rationale: Слово обозначает то, что сохраняет память о чём-либо. «Напоминание» естественно в современном русском и не привносит значения памятника.
- source_word: εἰρήνης
  choice: о мире
  rationale: Греческий текст говорит именно о мире, не уточняя формально «мирный договор».
- source_word: συμμαχίας
  choice: союзе
  rationale: Прямое соответствие политическому или военному союзу; точный характер союза остаётся контекстуально открытым.
- source_word: παρ' αὐτοῖς
  choice: у них
  rationale: Передаёт нахождение документа в распоряжении иерусалимской общины; в сочетании с «там» звучит по-русски естественно.
- source_word: εἶναι
  choice: чтобы он хранился
  rationale: Инфинитив выражает цель отправки. «Хранился» естественно поясняет длительное пребывание официальной копии, подразумеваемое контекстом и словом μνημόσυνον.
