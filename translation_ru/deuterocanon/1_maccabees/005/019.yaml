lexical_decisions:
- source_word: ἐνετείλατο
  choice: повелел
  rationale: Передаёт властный характер поручения, выраженный глаголом ἐντέλλομαι, и естественно звучит в повествовательном контексте.
- source_word: Πρόσεχετε
  choice: заботьтесь
  rationale: С родительным τοῦ λαοῦ τούτου императив указывает на внимательное попечение и охрану народа, а не только на осторожность или мысленное внимание.
- source_word: τοῦ λαοῦ τούτου
  choice: об этом народе
  rationale: Сохраняет собирательное единственное число λαός и связь с глаголом заботы в естественной русской конструкции.
- source_word: μὴ συνάψητε πόλεμον
  choice: не вступайте в бой
  rationale: Греческое военное выражение означает вступить в столкновение; перевод сохраняет запрет начинать боевое соприкосновение, не расширяя его до всей войны.
- source_word: πρὸς τὰ ἔθνη
  choice: с другими народами
  rationale: ἔθνη обозначает окружающие неиудейские народы. Слово «другими» естественно проясняет противопоставление «этому народу», не вводя более конфессионально окрашенное «язычники».
- source_word: ἕως τοῦ ἐπιστρέψαι ἡμᾶς
  choice: пока мы не вернёмся
  rationale: Естественно передаёт временной предел, выраженный ἕως с субстантивированным инфинитивом.
