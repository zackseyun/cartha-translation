lexical_decisions:
- source_word: συνειλημμένοι
  choice: заперты
  rationale: Причастие передаёт состояние людей, окружённых или удерживаемых внутри названных городов. «Заперты» сохраняет образ замкнутости, не уточняя без достаточных оснований, что речь непременно идёт о формальной осаде или заключении под стражу.
- source_word: εἰς
  choice: в
  rationale: При пассивном причастии и названиях мест εἰς обозначает достигнутое местонахождение; по-русски естественно «заперты в».
- source_word: Βοσσορὰ καὶ Βοσόρ, ἐν Ἀλάμοις, Κασφὼρ, Μακέδ, καὶ Καρναΐν
  choice: в Боссоре и Босоре, в Аламисе, Касфоре, Македе и Карнаине
  rationale: Названия переданы близкой транслитерацией форм греческого текста Суита, без их согласования с более привычными вариантами из других текстовых и переводческих традиций. Предлог «в» перед второй группой отражает явно употреблённое ἐν.
- source_word: ὀχυραὶ
  choice: укреплены
  rationale: В описании городов слово указывает на наличие оборонительных укреплений; краткая форма «укреплены» передаёт это конкретнее, чем общее «сильны».
- source_word: μεγάλαι
  choice: велики
  rationale: «Велики» сохраняет широкое значение греческого прилагательного, которое может относиться к размеру или значительности городов, не устраняя эту смысловую широту.
- source_word: πᾶσαι αἱ πόλεις αὗται
  choice: все эти города
  rationale: Прямое и естественное соответствие греческой итоговой фразе.
