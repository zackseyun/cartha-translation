  source_fidelity: 'Греч. καὶ διέβησαν τὸν Ἰορδάνην εἰς τὸ πεδίον τὸ μέγα κατὰ πρόσωπον Βαισάν буквально сообщает: «и они перешли Иордан в великую равнину напротив Байсана». Черновик верно передаёт переход через Иордан, направление движения, равнину и пространственное отношение к Байсану. Однако «вышли на» добавляет отдельный глагольный оттенок выхода, которого в греческом нет: εἰς относится непосредственно к «перешли».'
  naturalness: «И они перешли Иордан в великую равнину напротив Байсана» несколько тяжеловесно в современном русском, но точно отражает единое направление движения. Более естественное «перешли Иордан и направились на...» вводило бы второй глагол, поэтому не предпочтительно при оптимальной эквивалентности. Конструкция «перешли Иордан к великой равнине» меняет εἰς («в, на») на менее определённое «к». Сохранённый вариант приемлем в литературно-библейском регистре.
  terminology: «Иордан», «равнина» и «Байсан» соответствуют греческому тексту и принятому принципу передачи греческой формы топонима. Сноска корректно отмечает обычное, но не абсолютное отождествление с Беф-Саном.
