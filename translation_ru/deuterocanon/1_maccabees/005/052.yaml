lexical_decisions:
- source_word: διέβησαν
  choice: перешли
  rationale: Аорист διαβαίνω в повествовании о передвижении означает переход с одного берега на другой; «перешли» естественно сочетается с прямым дополнением «Иордан».
- source_word: τὸν Ἰορδάνην
  choice: Иордан
  rationale: Определённый артикль указывает на реку Иордан; в русском библейском и литературном употреблении название реки может передаваться без добавления «река».
- source_word: εἰς τὸ πεδίον τὸ μέγα
  choice: вышли на великую равнину
  rationale: πεδίον обозначает равнину или ровную местность, а μέγα — её значительность или обширность. Глагольное дополнение «вышли» естественно передаёт направительное εἰς после перехода реки, не меняя последовательности движения.
- source_word: κατὰ πρόσωπον
  choice: напротив
  rationale: В географическом описании оборот означает положение перед чем-либо, лицом к нему или напротив него; «напротив» кратко и ясно сохраняет пространственное отношение.
- source_word: Βαισάν
  choice: Байсан
  rationale: Русская транслитерация передаёт греческую форму Βαισάν, не подменяя её отождествляемым с ней еврейским названием Беф-Сан.
