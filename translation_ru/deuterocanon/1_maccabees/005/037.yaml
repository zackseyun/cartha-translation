  text: After these words[a], Timotheus gathered another camp and encamped opposite Raphon, beyond the stream.
translation:
  language: ru
  text: После этих слов Тимофей собрал ещё одно войско и расположился лагерем напротив Рафона, по ту сторону потока[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по ту сторону сезонного водотока»; греческое слово может обозначать поток, наполняющийся водой в сезон дождей, или его русло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰ ῥήματα ταῦτα
  choice: После этих слов
  rationale: Фраза естественно отсылает к только что сказанному; ῥήματα допускает также значение «события, дела», но ближайший контекст поддерживает перевод «слова».
- source_word: συνήγαγεν
  choice: собрал
  rationale: Глагол обозначает собирание или стягивание людей и естественно звучит применительно к военной силе.
- source_word: παρεμβολὴν ἄλλην
  choice: ещё одно войско
  rationale: παρεμβολή может означать как лагерь, так и расположенное в нём войско. Буквальное «собрал другой лагерь» по-русски неестественно; значение военной силы согласуется с συνήγαγεν, тогда как образ лагеря сохраняется в следующем глаголе.
- source_word: παρενέβαλεν
  choice: расположился лагерем
  rationale: Передаёт обычное военное значение глагола — разбить лагерь, сохраняя связь с παρεμβολή.
- source_word: κατὰ πρόσωπον
  choice: напротив
  rationale: В военно-географическом контексте оборот указывает на расположение лицом к месту, то есть напротив него.
- source_word: Ῥαφὼν
  choice: Рафона
  rationale: Название места передано транслитерацией греческой формы и поставлено в требуемый русским синтаксисом родительный падеж.
- source_word: ἐκ πέραν τοῦ χειμάρρου
  choice: по ту сторону потока
  rationale: ἐκ πέραν указывает на дальнюю сторону водотока, а χειμάρρους может обозначать поток, бурный сезонный водоток или сухое в иное время русло. Основной перевод остаётся естественным и не уточняет состояние воды сверх текста.
