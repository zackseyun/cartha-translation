  text: And Gorgias came out from the city, and his men, to meet them in battle.
translation:
  language: ru
  text: И вышел Горгий из города, а с ним его люди, чтобы сразиться с ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Аорист ἐξέρχομαι обозначает выход изнутри наружу; «вышел» точно и естественно передаёт движение из города.
- source_word: πόλεως
  choice: города
  rationale: Обычное значение πόλις — «город»; оно сохраняет городской и военный контекст повествования.
- source_word: οἱ ἄνδρες αὐτοῦ
  choice: его люди
  rationale: Буквально речь идёт о людях Горгия; контекст показывает, что это его военный отряд, но слово «воины» было бы несколько более толковательным.
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: чтобы сразиться с ними
  rationale: Оборот означает выход навстречу им, а следующее εἰς πόλεμον явно придаёт встрече характер вооружённого столкновения; единая русская формулировка избегает неестественного «навстречу им на битву».
- source_word: εἰς πόλεμον
  choice: сразиться
  rationale: Военный смысл «на битву / для битвы» естественно выражен русским глаголом «сразиться» в сочетании с предшествующим оборотом встречи.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; лаконичный повествовательный стиль. Конструкция «а с ним его люди» естественно передаёт греческое присоединение подлежащего καὶ οἱ ἄνδρες αὐτοῦ и устраняет возможное ошибочное понимание, будто вышел один Горгий.
