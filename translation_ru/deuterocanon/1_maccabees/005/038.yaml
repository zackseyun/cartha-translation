  text: And Judas sent men to spy out the camp[a], and they reported to him, saying, “All the nations around you have gathered together against them—a very great force.”
translation:
  language: ru
  text: 'Иуда послал людей разведать лагерь. Они донесли ему: «Все народы вокруг вас собрались против них[a] — весьма многочисленное войско».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте сочетание местоимений в этой речи несколько неожиданно: «вокруг вас … против них». Перевод сохраняет переданный текст, не заменяя «них» на «вас» или «нас».'
    reason: Сохранение неоднозначной и контекстуально неожиданной местоименной формы исходного текста.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал людей
  rationale: Глагол означает «послал»; слово «людей» восполняет подразумеваемое дополнение и позволяет ясно выразить цель поручения по-русски.
- source_word: κατασκοπῆσαι
  choice: разведать
  rationale: В данном военном контексте инфинитив обозначает скрытое наблюдение и сбор сведений о расположении противника; «разведать» звучит естественно и точно.
- source_word: παρεμβολήν
  choice: лагерь
  rationale: В военном повествовании слово обычно обозначает лагерь или стан войска; «лагерь» — ясный современный эквивалент.
- source_word: ἀπήγγειλαν
  choice: донесли
  rationale: Глагол обозначает сообщение полученных сведений; «донесли» уместно для возвращения разведчиков с докладом.
- source_word: Ἐπισυνηγμένοι εἰσὶν
  choice: собрались
  rationale: Перифрастический перфект описывает состояние, возникшее в результате сбора; русское «собрались» естественно передаёт и совершившееся действие, и наличное объединение.
- source_word: πρὸς αὐτοὺς
  choice: против них
  rationale: В военном контексте πρὸς с обозначением лиц естественно понимать как враждебную направленность. Местоимение третьего лица сохранено без согласования с ближайшим контекстом.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: Здесь ἔθνη обозначает окружающие этнополитические группы; «народы» не вносит конфессионально окрашенного значения «язычники».
- source_word: τὰ κύκλῳ ὑμῶν
  choice: живущие вокруг вас
  rationale: Оборот указывает на соседние народы. Добавленное «живущие» делает определение естественным по-русски, а второе лицо множественного числа точно сохраняет ὑμῶν.
- source_word: δύναμις πολλὴ σφόδρα
  choice: это весьма большое войско
  rationale: В военном повествовании δύναμις означает вооружённую силу или войско, а σφόδρα усиливает πολλή. Указательное «это» оформляет греческую именную фразу естественным русским предложением.
