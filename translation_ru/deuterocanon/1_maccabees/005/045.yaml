lexical_decisions:
- source_word: συνήγαγεν
  choice: собрал
  rationale: Аорист συνάγω обозначает собирание людей в одну группу; «собрал» прямо и естественно передаёт действие.
- source_word: πάντα Ἰσραὴλ τοὺς ἐν τῇ Γαλααδίτιδι
  choice: всех израильтян, находившихся в Галааде
  rationale: Речь идёт обо всём израильском населении, находившемся в этой области. Такое выражение естественно по-русски и не превращает «Израиль» в отвлечённое обозначение народа.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: от мала до велика
  rationale: Устойчивое русское выражение сохраняет широкий смысл всеохватности и не сужает его исключительно до возраста.
- source_word: τὰς γυναῖκας αὐτῶν
  choice: их жёнами
  rationale: При притяжательном αὐτῶν и перечислении семей наиболее вероятно значение «жёны», хотя γυνή само по себе также означает «женщина».
- source_word: ἀποσκευήν
  choice: пожитками
  rationale: Здесь ἀποσκευή означает переносимое имущество сопровождающих группу семей. «Пожитки» естественнее русского «багаж» в повествовании о переселении людей с семьями.
- source_word: παρεμβολὴν μεγάλην σφόδρα
  choice: огромное множество
  rationale: Оборот приложением характеризует всю собранную группу, включая семьи и имущество. «Множество» подходит контексту, а «огромное» передаёт усиленное μεγάλην σφόδρα; возможное военное значение слова отмечено в сноске.
- source_word: ἐλθεῖν εἰς γῆν Ἰούδα
  choice: чтобы отправиться в землю Иуды
  rationale: Инфинитив выражает цель собирания. «Отправиться» естественно описывает предстоящее совместное передвижение, а «земля Иуды» сохраняет форму географического названия в греческом тексте.
