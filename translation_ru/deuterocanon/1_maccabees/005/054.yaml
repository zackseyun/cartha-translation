lexical_decisions:
- source_word: ἀνέβησαν
  choice: взошли
  rationale: Передаёт буквальное движение вверх к горе Сион и естественно звучит в современном русском языке.
- source_word: τὸ ὄρος Σιὼν
  choice: гору Сион
  rationale: Сохраняет географическое наименование и синтаксически естественно сочетается с глаголом «взошли».
- source_word: ἐν εὐφροσύνῃ καὶ χαρᾷ
  choice: с ликованием и радостью
  rationale: Сохраняет два близких, но различимых обозначения праздничной радости; «ликование» хорошо передаёт торжественный оттенок εὐφροσύνη.
- source_word: προσήγαγον
  choice: принесли
  rationale: В жертвенном контексте означает принесение дара Богу; русское «принесли» сохраняет как конкретное действие, так и культовый смысл.
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Традиционный и точный русский термин для жертв, целиком сжигавшихся на жертвеннике; дополнительное пояснение дано в сноске.
- source_word: οὐκ ἔπεσεν ἐξ αὐτῶν οὐθεὶς
  choice: ни один из них не пал
  rationale: Сохраняет усиленное отрицание и военное употребление глагола «пасть», то есть погибнуть.
- source_word: ἕως τοῦ ἐπιστρέψαι ἐν εἰρήνῃ
  choice: до их возвращения с миром
  rationale: Передаёт временной предел конструкции с ἕως и сохраняет более широкий смысл εἰρήνη, не сводя его только к безопасному возвращению.
theological_decisions:
- issue: Жертвенная терминология для ὁλοκαυτώματα
  choice: всесожжения
  alternative: жертвы всесожжения; жертвы, целиком сожжённые на жертвеннике
  rationale: «Всесожжения» точно обозначает жертвы, полностью предававшиеся огню, и не добавляет конфессионально обусловленного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Сохранены повтор близких слов «ликованием и радостью», военная идиома «пал» и выражение «с миром».
