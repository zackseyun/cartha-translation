lexical_decisions:
- source_word: ἐμνήσθη
  choice: вспомнил
  rationale: Прямо передаёт аорист μιμνῄσκομαι и естественно обозначает воспоминание, побуждающее к последующему действию.
- source_word: κακίας
  choice: о злодеяниях
  rationale: В данном повествовательном контексте κακία обозначает враждебные дурные поступки; множественное число по-русски естественно передаёт совокупность причинённого зла, не уточняя мотив сверх текста.
- source_word: υἱῶν Βαιάν
  choice: сыновей Ваиана
  rationale: Сохраняет буквальную родовую формулу, которая может обозначать сыновей, потомков или клан, не заменяя её пояснительным толкованием.
- source_word: παγίδα
  choice: западнёй
  rationale: Сохраняет образ опасной ловушки и согласуется с последующим упоминанием засад.
- source_word: σκάνδαλον
  choice: камнем преткновения
  rationale: Передаёт метафорический образ причины падения, сохраняя традиционно понятное и литературное выражение.
- source_word: ἐν τῷ ἐνεδρεύειν αὐτοὺς
  choice: устраивая им засады
  rationale: Естественно передаёт обстоятельственно-инструментальное значение конструкции с артиклевым инфинитивом и указывает народ как объект нападений.
- source_word: ἐν ταῖς ὁδοῖς
  choice: на дорогах
  rationale: Современное и идиоматичное обозначение путей, где происходили засады.
