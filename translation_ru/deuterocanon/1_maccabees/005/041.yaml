  text: But if we cross over and camp beyond the river[a], we will cross over to him.
translation:
  language: ru
  text: Но если мы перейдём, а он разобьёт лагерь по ту сторону реки, мы переправимся к нему[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против него». В военном контексте движение «к нему» может означать наступление на него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέλθωμεν
  choice: мы перейдём
  rationale: Аорист сослагательного наклонения после ἐὰν выражает будущее условие; «перейдём» естественно передаёт пересечение преграды, подразумеваемой военным контекстом.
- source_word: παρεμβάλῃ
  choice: он расположится лагерем
  rationale: Форма глагола стоит в 3-м лице единственного числа, поэтому субъект не следует объединять с «мы»; в военном контексте глагол означает разбить или расположить лагерь.
- source_word: πέραν τοῦ ποταμοῦ
  choice: по ту сторону реки
  rationale: Так передаётся пространственное значение πέραν — на дальней стороне реки — без ненужного уточнения направления.
- source_word: διαπεράσομεν
  choice: мы переправимся
  rationale: Будущее время обозначает последующее пересечение реки; «переправимся» ясно и естественно передаёт военное движение, сохраняя связь с первым глаголом перехода.
- source_word: πρὸς αὐτόν
  choice: к нему
  rationale: Предлог πρὸς обозначает направленное движение к человеку; нейтральный вариант сохраняет присущую греческой фразе неоднозначность, а враждебный смысл поясняется в сноске.
