translation:
  language: ru
  text: 'говоря: «Против них собрались силы из Птолемаиды, Тира, Сидона и всей Галилеи иноплеменников[a], чтобы истребить нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всей Галилеи язычников». Греческое выражение буквально означает «Галилеи иноплеменников»; «иноплеменники» обозначает людей другого народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие настоящего времени передано деепричастием, сохраняющим связь с предшествующим контекстом.
- source_word: Ἐπισυνήχθη ἐπʼ αὐτούς
  choice: Против них собрались
  rationale: Военный смысл ἐπί с винительным передан словом «против». В русском естественная возвратная конструкция передаёт факт сбора, не добавляя прямо не названного в греческом слова «войско».
- source_word: ἐκ Πτολεμαΐδος καὶ Τύρου καὶ Σιδῶνος
  choice: из Птолемаиды, Тира, Сидона
  rationale: Сохранены географические названия и исходное направление движения; многократное καί естественно передано перечислением.
- source_word: πάσης Γαλιλαίας ἀλλοφύλων
  choice: иноплеменники … из всей Галилеи
  rationale: ἀλλόφυλοι обозначает людей другого народа; «иноплеменники» сохраняет этнополитический оттенок и звучит уместно в историческом повествовании. Неоднозначная связь родительного падежа отмечена в сноске.
- source_word: τοῦ ἐξαναλῶσαι ἡμᾶς
  choice: чтобы истребить нас
  rationale: Артикулированный инфинитив передаёт цель, а «истребить» выражает полное уничтожение без разговорности.
theological_decisions:
- issue: Передача ἀλλόφυλοι в историко-военном контексте
  choice: иноплеменники
  alternative: язычники
  rationale: Здесь слово прежде всего этнически и политически противопоставляет чужой народ, поэтому «иноплеменники» точнее нейтрального смысла оригинала и не вносит дополнительной богословской окраски.
- issue: Смена лиц в ἐπʼ αὐτούς … ἡμᾶς
  choice: против них … нас
  alternative: против нас … нас
  rationale: Необычная смена третьего лица на первое присутствует в греческом тексте и сохранена, а не устранена посредством согласования.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Выбрано «истребить», а не разговорное «стереть с лица земли»; не добавлено отсутствующее в оригинале слово «войско».
