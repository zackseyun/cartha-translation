  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. Формулы «подняли глаза» и «и вот» сохраняют стиль исходного текста, оставаясь понятными современному читателю. Длинная греческая фраза разделена на два предложения ради естественности и ясности русского синтаксиса.
