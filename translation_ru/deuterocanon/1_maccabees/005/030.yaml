lexical_decisions:
- source_word: ἐγένετο ἑωθινή
  choice: когда наступило утро
  rationale: Естественное русское обозначение наступления утра, сохраняющее повествовательный переход.
- source_word: ἦραν τοὺς ὀφθαλμοὺς αὐτῶν
  choice: они подняли глаза
  rationale: Сохраняет ясный и привычный библейский образ, не сводя его просто к «посмотрели».
- source_word: ἰδοὺ
  choice: и вот
  rationale: Передаёт указательную силу частицы и внезапное открытие представшей перед ними картины.
- source_word: λαὸς πολὺς οὗ οὐκ ἦν ἀριθμός
  choice: огромное множество людей, которым не было числа
  rationale: Передаёт как величину собравшейся массы, так и отдельное усиление о её неисчислимости; «людей» не уточняется как «воинов», поскольку этого слова в греческом тексте нет.
- source_word: αἴροντες κλίμακας
  choice: они несли лестницы
  rationale: Причастие описывает одновременное действие множества; самостоятельное предложение делает длинную греческую конструкцию ясной по-русски.
- source_word: μηχανὰς
  choice: осадные машины
  rationale: В контексте штурма укрепления слово означает военные приспособления или машины, применяемые при осаде.
- source_word: καταλαβεῖσθαι τὸ ὀχύρωμα
  choice: чтобы овладеть укреплением
  rationale: Передаёт целевое значение инфинитива и военный смысл захвата укреплённой позиции.
- source_word: ἐπολέμουν αὐτούς
  choice: сражались с ними
  rationale: Несовершенный вид передаёт продолжавшееся действие; местоименная неоднозначность оригинала сохранена без добавочного уточнения участников.
