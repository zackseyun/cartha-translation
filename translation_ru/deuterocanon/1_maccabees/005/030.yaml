  verdict: revise
  source_fidelity: 'В целом лексика точно передаёт греческий текст: утро, поднятие глаз, неожиданно увиденное неисчислимое множество, лестницы, осадные машины, цель захвата укрепления и продолжающееся сражение. Однако в нынешнем разделении на предложения местоимение «они» после «они подняли глаза» может быть прочитано как относящееся к первоначальным наблюдателям, тогда как αἴροντες и ἐπολέμουν естественно относятся к увиденному множеству. Редакция устраняет эту нежелательную в русском референциальную неясность.'
