  yaml_path: translation/deuterocanon/1_maccabees/005/051.yaml
  text: And he destroyed every male with the edge of the sword[a], and uprooted it, and took the plunder of the city[b], and passed through the city over the slain.
translation:
  language: ru
  text: И он истребил всех мужчин остриём меча[a], искоренил город[b], взял городскую добычу и прошёл через город по убитым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устами меча» — устойчивый библейский оборот со значением «остриём меча».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вырвал его с корнем», «уничтожил его полностью». Греческий глагол сохраняет образ вырывания с корнем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: истребил
  rationale: В военном контексте аорист ἀπόλλυμι означает причинение гибели и уничтожение. «Истребил» сохраняет суровую и всеохватную силу выражения.
- source_word: πᾶν ἀρσενικόν
  choice: всех мужчин
  rationale: Собирательное выражение охватывает всё мужское население; современное русское «всех мужчин» передаёт его прямо и без смягчения.
- source_word: ἐν στόματι ῥομφαίας
  choice: остриём меча
  rationale: Буквально «устами меча»; это семитизированная идиома, означающая поражение мечом. Русское «остриём меча» сохраняет образ и остаётся понятным.
- source_word: ἐξερρίζωσεν
  choice: искоренил
  rationale: Глагол буквально обозначает вырывание с корнем, а здесь — полное уничтожение города как поселения. «Искоренил» удерживает корневой образ исходного слова.
- source_word: αὐτήν
  choice: город
  rationale: Местоимение женского рода отсылает к подразумеваемому греческому πόλις. Повтор существительного в русском устраняет неясность рода и не меняет референта.
- source_word: τὰ σκῦλα τῆς πόλεως
  choice: городскую добычу
  rationale: σκῦλα — военная добыча. Такая формулировка естественна в современном русском и ясно передаёт принадлежность добычи городу.
- source_word: διῆλθεν διὰ τῆς πόλεως
  choice: прошёл через город
  rationale: Передано нейтральное значение движения через город без добавления отсутствующего в греческом указания на строевой марш.
- source_word: ἐπάνω τῶν ἀπεκταμμένων
  choice: по убитым
  rationale: Субстантивированное причастие означает убитых людей. Выражение сохраняет краткость и мрачную наглядность греческого текста, не добавляя слова «тела».
theological_decisions:
- issue: Язык насилия и масштаб уничтожения
  choice: 'Прямо сохранить полную силу военного насилия: «истребил всех мужчин», «остриём меча», «искоренил город».'
  alternative: Смягчить до «победил» или «захватил», либо ослабить образ полного уничтожения.
  rationale: Греческий текст выражается недвусмысленно и сурово. Перевод не должен ни приглушать жестокость повествования, ни расширять её за пределы прямо сказанного.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Синтаксис сохраняет стремительную цепь действий оригинала; суровость описания не смягчена. Повтор «город» вместо местоимения обеспечивает естественную русскую связность и однозначную отсылку.
