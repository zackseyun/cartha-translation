  language: ru
  text: И жители города заперли их внутри и заложили ворота камнями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκλεισαν
  choice: заперли их внутри
  rationale: Глагол означает «запирать, отрезать, заключать»; сочетание естественно по-русски передаёт, что находившиеся внутри оказались заперты.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: жители города
  rationale: Буквально «те, кто из города». В данном контексте речь идёт о действующих сообща людях города; «жители города» не добавляет указания на пол и звучит естественно.
- source_word: ἐνέφραξαν
  choice: заложили
  rationale: Глагол обозначает перекрытие или закупоривание; при указании на камни русское «заложили» точно передаёт конкретный способ преграждения.
- source_word: τὰς πύλας
  choice: ворота
  rationale: Обычное русское соответствие для городских ворот; форма существительного в русском языке сохраняет значение греческого множественного числа.
- source_word: λίθοις
  choice: камнями
  rationale: Творительный падеж естественно передаёт инструментальный дательный греческого текста и материал, которым были перекрыты ворота.
