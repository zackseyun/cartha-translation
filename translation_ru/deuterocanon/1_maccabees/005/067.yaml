  text: On that day priests fell in battle[a], because they wanted to act bravely[b], when they went out into battle without counsel.
translation:
  language: ru
  text: В тот день в сражении пали священники, потому что он хотел[a] проявить доблесть, когда они вышли на бой, не посоветовавшись[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь стоит единственное число: «он хотел». Кто именно имеется в виду, не уточняется; по контексту возможен смысл: «они хотели проявить доблесть».'
    reason: textual_grammatical_ambiguity
  - marker: b
    text: 'Или: «не обдумав»; буквально — «без совета».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: пали
  rationale: Устойчивое и естественное обозначение гибели в бою, сохраняющее воинскую окраску греческого выражения.
- source_word: ἱερεῖς
  choice: священники
  rationale: Неопределённая форма множественного числа передаёт отсутствие артикля и указывает на представителей священнического сословия.
- source_word: πολέμῳ
  choice: в сражении
  rationale: Дательный падеж обозначает обстоятельство, при котором они погибли; «в сражении» естественно по-русски.
- source_word: βουλομένου αὐτοῦ
  choice: потому что он хотел
  rationale: Форма в греческом тексте стоит в единственном числе; причинный оттенок генитивной абсолютной конструкции сохранён без уточнения, кто именно подразумевается под «он».
- source_word: ἀνδραγαθῆσαι
  choice: проявить доблесть
  rationale: Глагол означает выказать мужество или совершить доблестный поступок; выбранная формулировка звучит современно и сохраняет оттенок показанной на деле отваги.
- source_word: ἐν τῷ αὐτοὺς ἐξελθεῖν
  choice: когда они вышли
  rationale: Субстантивированный инфинитив с винительным субъектом здесь естественно передаётся временным придаточным.
- source_word: εἰς τὸν πόλεμον
  choice: на бой
  rationale: Выражение обозначает выход для участия в конкретном военном столкновении; «на бой» естественно и не перегружает русскую фразу повтором слова «сражение».
- source_word: ἀβουλεύτως
  choice: не посоветовавшись
  rationale: Передаёт действие без совета или предварительного обсуждения, не сводя смысл исключительно к эмоциональной опрометчивости.
theological_decisions:
- issue: Референт αὐτοῦ в βουλομένου αὐτοῦ ἀνδραγαθῆσαι
  choice: 'Сохранено единственное число: «он хотел», без указания имени или явного антецедента.'
  alternative: «они хотели проявить доблесть», если согласовать оборот со священниками по контексту или предположить иную форму исходного текста.
  rationale: Предоставленный греческий текст недвусмысленно имеет форму единственного числа, хотя последующее αὐτούς относится к множеству. Перевод не исправляет эту напряжённость молча, а отмечает её в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной повествовательной формой. Сохранён воинский оборот «пали», а грамматическая напряжённость между единственным αὐτοῦ и множественным αὐτούς не устранена конъектурой.
