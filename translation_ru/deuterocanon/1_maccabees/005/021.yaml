lexical_decisions:
- source_word: ἐπορεύθη
  choice: отправился
  rationale: Аорист πορεύομαι обозначает движение без обязательного военного оттенка. «Отправился» естественно для повествования и не добавляет значения «выступил в поход».
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: Предлог εἰς передаёт направленное движение внутрь области; по-русски это естественно выражается сочетанием «в Галилею».
- source_word: συνῆψεν πόλεμους πολλοὺς
  choice: вступил во многие сражения
  rationale: Оборот συνάπτειν πόλεμον означает вступать в бой или вести военные действия. «Вступил во многие сражения» сохраняет множественное число и лучше соответствует отдельным столкновениям, чем «вёл много войн».
- source_word: πρὸς τὰ ἔθνη
  choice: с языческими народами
  rationale: В данном иудейском военно-историческом контексте τὰ ἔθνη обозначает окружающие нееврейские народы. «Языческие народы» передаёт это значение яснее, чем одно слово «народы», при этом не сводит их к отдельным лицам.
- source_word: συνετρίβη
  choice: были сокрушены
  rationale: Пассивная форма συντρίβω имеет сильное значение «разбить, сокрушить»; выбранный вариант сохраняет образную силу греческого и не ослабляет её до простого «были побеждены».
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: перед ним
  rationale: Семитизированный греческий оборот буквально указывает на поражение «перед лицом» Симона, то есть при встрече с ним или перед его наступлением. «Перед ним» кратко сохраняет исходный образ, не конкретизируя способ поражения.
