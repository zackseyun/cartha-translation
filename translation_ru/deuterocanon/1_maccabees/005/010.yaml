lexical_decisions:
- source_word: ἀπέστειλαν γράμματα
  choice: послали письма
  rationale: Прямо и естественно передаёт отправку письменных сообщений; аорист выражен русским прошедшим совершенного вида.
- source_word: Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ
  choice: Иуде и его братьям
  rationale: Иуда — традиционная русская форма имени; братья здесь обозначают его братьев-мужчин, действующих вместе с ним.
- source_word: Ἐπισυνηγμένοι εἰσὶν
  choice: собрались
  rationale: Передаёт наличное состояние как результат состоявшегося сбора и естественно звучит по-русски.
- source_word: τὰ ἔθνη τὰ κύκλῳ ἡμῶν
  choice: окружающие нас народы
  rationale: Сохраняет этнополитический смысл ἔθνη и географическое значение κύκλῳ без позднейших богословских коннотаций слова «язычники».
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: чтобы истребить нас
  rationale: Инфинитив с артиклем передаёт цель; «истребить» выражает намерение полностью уничтожить общину и сохраняет достойный литературный регистр.
theological_decisions:
- issue: Передача ἔθνη в историческом контексте
  choice: народы
  alternative: язычники
  rationale: Здесь речь идёт прежде всего об окружающих этнополитических сообществах; «народы» не привносит более позднюю богословскую окраску.
- issue: Передача ἀδελφοί с учётом пола
  choice: братьям
  alternative: родным / братьям и сёстрам
  rationale: В повествовании имеются в виду братья Иуды, мужчины-соратники; расширительное инклюзивное значение контекстом не требуется.
- issue: Степень силы ἐξᾶραι
  choice: истребить нас
  alternative: уничтожить нас
  rationale: Выбранный вариант сохраняет идею полного устранения, не ослабляя угрозу и не переходя в разговорный стиль.
translation_notes:
  register: Современный литературный русский язык, сдержанный историко-повествовательный регистр. Начальное «И» сохранено как связь с предыдущим повествованием; оборот «со словами» естественно вводит содержание письма.
