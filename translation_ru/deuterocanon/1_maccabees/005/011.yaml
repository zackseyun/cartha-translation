lexical_decisions:
- source_word: ἑτοιμάζοντές εἰσιν
  choice: готовятся
  rationale: Описательная конструкция с причастием передаёт продолжающуюся подготовку к действию.
- source_word: προκαταλαβέσθαι
  choice: захватить
  rationale: В контексте речь идёт о враждебном овладении укреплением; присущий приставке оттенок упреждающего действия сохранён в сноске, поскольку его явное включение в основной текст создало бы неясное «прежде нас», хотя говорящие уже укрылись там.
- source_word: τὸ ὀχύρωμα
  choice: укрепление
  rationale: Слово обозначает укреплённое место или оборонительную позицию; «укрепление» естественно сочетается с местом убежища.
- source_word: εἰς ὃ κατεφύγομεν
  choice: в котором мы укрылись
  rationale: Передаёт не только бегство, но и цель καταφεύγω — найти убежище.
- source_word: ἡγεῖται
  choice: предводительствует
  rationale: Сохраняет значение руководства военной силой, не уточняя без необходимости формальный ранг Тимофея.
- source_word: τῆς παρεμβολῆς αὐτῶν
  choice: их войском
  rationale: παρεμβολή может обозначать как военный лагерь, так и расположенное в нём войско; при глаголе руководства «войском» звучит по-русски естественно.
