lexical_decisions:
- source_word: ἐτροπώθη
  choice: были разбиты и бежали
  rationale: Военный пассив обозначает разгром, приведший к бегству; такое сочетание естественно передаёт смысл греческого глагола по-русски и подготавливает последующее преследование.
- source_word: ἐδιώχθησαν
  choice: враги преследовали их
  rationale: Греческий пассив естественно выражен активной конструкцией с подразумеваемым противником; смысл вражеского преследования после разгрома сохранён.
- source_word: ἕως τῶν ὁρίων τῆς Ἰουδαίας
  choice: до границ Иудеи
  rationale: Передаёт предел преследования и обычное значение множественного ὅρια — «границы».
- source_word: ἔπεσον
  choice: пало
  rationale: Сохраняет традиционную военную метафору греческого текста и ясно подразумевает гибель в бою, не заменяя её пояснительным «погибло».
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: в тот день
  rationale: Естественное современное русское соответствие временной формуле.
- source_word: ἐκ τοῦ λαοῦ Ἰσραήλ
  choice: из народа Израиля
  rationale: Близко передаёт ἐκ и указывает, что павшие принадлежали к народу Израиля.
- source_word: εἰς δισχιλίους ἄνδρας
  choice: около двух тысяч человек
  rationale: С числительным εἰς может обозначать приблизительное итоговое число; «человек» в русском здесь естественнее, чем гендерно маркированное «мужчин».
