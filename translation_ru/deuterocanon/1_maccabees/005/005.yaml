  source_fidelity: 'Текст точно передаёт последовательность греческих действий и их участников: противники были заперты им в башнях; затем он расположился против них лагерем, предал их заклятию и сжёг башни вместе со всеми находившимися внутри. Пассив διεκλείσθησαν естественно и без смысловой потери передан русской активной конструкцией с указанным деятелем. Сохранены как военный образ παρέβαλεν, так и усиленное ἐνεπύρισεν … ἐν πυρί.'
