  yaml_path: translation/deuterocanon/1_maccabees/005/005.yaml
  text: And they were shut up by him in the towers[a], and he encamped against them, and he devoted them to destruction, and he burned its towers with fire[b], along with all who were in them.
translation:
  language: ru
  text: Он запер их в башнях, расположился станом против них, предал их заклятию[a] и сжёг её башни огнём[b] вместе со всеми, кто в них находился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть обрёк их на полное уничтожение. Греческий глагол обозначает предание людей или вещей заклятию, а не просто словесное проклятие.
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте стоит местоимение женского рода в единственном числе — буквально «её башни»; вероятно, речь идёт о городе, упомянутом в контексте.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκλείσθησαν ὑπʼ αὐτοῦ
  choice: Он запер их
  rationale: Греческая пассивная конструкция означает, что действующий военачальник запер или замкнул их внутри. Активная конструкция естественнее по-русски и сохраняет указанного деятеля.
- source_word: πύργους
  choice: башнях
  rationale: Основное значение — оборонительные башни; контекст не требует расширительного перевода «укрепления».
- source_word: παρέβαλεν ἐπʼ αὐτούς
  choice: расположился станом против них
  rationale: Передаёт буквальный образ постановки военного лагеря и враждебную направленность действия, не подменяя его более узким понятием осады.
- source_word: ἀνεθεμάτισεν
  choice: предал их заклятию
  rationale: Сохраняет библейское понятие посвящения на уничтожение, а не сводит глагол к проклятию или обычному убийству.
- source_word: ἐνεπύρισεν ... ἐν πυρί
  choice: сжёг ... огнём
  rationale: Сохраняет смысл поджога и намеренное греческое усиление упоминанием огня.
- source_word: αὐτῆς
  choice: её
  rationale: Сохраняет женский род и единственное число греческого местоимения, которое, вероятно, относится к упомянутому в контексте городу.
- source_word: σὺν πᾶσιν τοῖς ἐνοῦσιν
  choice: вместе со всеми, кто в них находился
  rationale: Передаёт всеохватность πᾶσιν и ясно связывает находившихся внутри с башнями.
theological_decisions:
- issue: Передача ἀνεθεμάτισεν в контексте священной войны
  choice: предал их заклятию
  alternative: обрёк их на уничтожение
  rationale: «Предал заклятию» сохраняет сакрально-военный оттенок посвящения уничтожению. Сноска разъясняет непривычный современному читателю смысл и не позволяет понять выражение как простое словесное проклятие.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Выражение «расположился станом» сохраняет конкретный военный образ, а редкое «предал заклятию» сопровождено пояснительной сноской.
