lexical_decisions:
- source_word: Ἔτι ... ἀνεγινώσκοντο
  choice: Письма ещё читали
  rationale: Ἔτι вместе с имперфектом пассива передаёт продолжавшееся в прошлом действие; по-русски естественно выразить это сочетанием «ещё читали».
- source_word: αἱ ἐπιστολαὶ
  choice: Письма
  rationale: Прямое и естественное обозначение письменных посланий в повествовательном контексте.
- source_word: ἰδοὺ
  choice: как вдруг
  rationale: В данном повествовании ἰδού отмечает внезапное появление новых людей; «как вдруг» естественно передаёт эту функцию в современном русском языке.
- source_word: ἄγγελοι ἕτεροι
  choice: другие вестники
  rationale: В историческом контексте ἄγγελοι — люди, доставляющие известие, а не небесные ангелы; ἕτεροι означает «другие».
- source_word: παρεγένοντο ἐκ τῆς Γαλιλαίας
  choice: из Галилеи прибыли
  rationale: Передаёт появление прибывших на месте действия и сохраняет географическое указание.
- source_word: διερρηχότες τὰ ἱμάτια
  choice: в разорванных одеждах
  rationale: Перфектное причастие описывает состояние прибывших; разорванные одежды служат знаком скорби или тревоги.
- source_word: ἀπαγγέλλοντες κατὰ τὰ ῥήματα ταῦτα
  choice: и передали такие слова
  rationale: Оборот вводит содержание следующего сообщения; формулировка близка к греческому тексту и естественна перед прямой речью.
