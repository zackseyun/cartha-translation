  text: 'Письма ещё читали, как вдруг из Галилеи прибыли другие вестники в разорванных одеждах[a] и передали такие слова:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разорвав на себе одежды». Разорванные одежды были знаком скорби или сильной тревоги.'
