lexical_decisions:
- source_word: ὁ ἀνὴρ Ἰούδας
  choice: муж Иуда
  rationale: Сохраняет необычное аппозиционное выражение греческого текста и при этом использует достоинственный библейско-литературный оборот; здесь ἀνήρ обозначает взрослого мужчину, а не человечество вообще.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: его братья
  rationale: Прямое и естественное обозначение братьев Иуды в данном контексте.
- source_word: ἐδοξάζοντο σφόδρα
  choice: пользовались великим почётом
  rationale: Передаёт пассивное значение признания и прославления со стороны людей, а также усиление σφόδρα; по-русски естественнее контекстуального варианта «были весьма прославляемы».
- source_word: ἐναντίον παντὸς Ἰσραὴλ
  choice: у всего Израиля
  rationale: Здесь ἐναντίον выражает положение в глазах и оценке всего народа; русский оборот «пользовались почётом у» естественно передаёт это отношение.
- source_word: τῶν ἐθνῶν πάντων
  choice: у всех народов
  rationale: Сохраняет широкий этнополитический смысл ἔθνη, не сужая его до конфессионально окрашенного «язычники».
- source_word: οὗ ἠκούετο τὸ ὄνομα αὐτῶν
  choice: повсюду, где слышали их имя
  rationale: Передаёт обобщённо-локативный смысл οὗ и сохраняет исходную идиому об имени, не заменяя её толкованием «слава» или «известность».
