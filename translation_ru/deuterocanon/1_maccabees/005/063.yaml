    rationale: В современном русском «муж» обычно означает супруга и потому создаёт ложное, потенциально комическое или непонятное значение. Греческое ὁ ἀνήρ здесь является мужским обозначением при имени, а не указанием на брачный статус.
  - severity: low
    issue: «где слышали их имя»
    rationale: Форма с неопределённым активным субъектом несколько ослабляет пассивную конструкцию ἠκούετο. «Где было слышно их имя» сохраняет исходную образность и грамматическое направление.
  - severity: low
