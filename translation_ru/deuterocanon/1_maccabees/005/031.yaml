lexical_decisions:
- source_word: ἦρκται
  choice: уже началась
  rationale: Перфектная форма показывает, что битва уже началась и продолжалась, когда Иуда это заметил; «уже» естественно передаёт достигнутое состояние.
- source_word: ὁ πόλεμος
  choice: битва
  rationale: В данном эпизоде речь идёт о конкретном сражении, а не о войне в целом.
- source_word: ἡ κραυγὴ τῆς πόλεως
  choice: крик из города
  rationale: Так естественно передаётся громкий крик, исходящий из города, без буквального олицетворения города.
- source_word: ἀνέβη ἕως οὐρανοῦ
  choice: поднимался до неба
  rationale: Сохраняется пространственный образ крика, восходящего к небу; русский имперфектив уместно рисует разворачивающуюся сцену.
- source_word: σάλπιγξιν
  choice: под звуки труб
  rationale: Дательный падеж допускает значение сопровождения или образа действия; выражение ясно обозначает звучание военных труб.
- source_word: κραυγῇ μεγάλῃ
  choice: и громкие вопли
  rationale: Множественное «вопли» естественно звучит в описании городского шума и передаёт силу массового крика.
