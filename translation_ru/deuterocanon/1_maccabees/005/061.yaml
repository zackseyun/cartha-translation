  text: And there was a great rout among the people[a], because they had not listened to Judas and his brothers[b], thinking that they themselves would act bravely.
translation:
  language: ru
  text: И народ обратился в великое бегство[a], потому что они не послушали Иуду и его братьев, полагая, что сами проявят доблесть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ потерпел тяжёлое поражение» или «народ был наголову разбит». Греческое слово означает обращение в бегство, а затем и разгром.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «думая, что сами совершат доблестные подвиги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τροπὴ μεγάλη
  choice: тяжёлое поражение
  rationale: В военном контексте τροπή обозначает обращение в бегство и последовавший разгром. Русское «тяжёлое поражение» естественно передаёт итог события, а более буквальный образ сохранён в сноске.
- source_word: ἐν τῷ λαῷ
  choice: народ потерпел
  rationale: λαός буквально означает «народ»; преобразование греческой безличной конструкции в русскую личную делает фразу естественной, не подменяя народ более узким словом «войско».
- source_word: οὐκ ἤκουσαν
  choice: не послушали
  rationale: ἀκούω с родительным падежом здесь означает не просто услышать, а внять наставлению. «Не послушали» сохраняет и слуховой образ, и подразумеваемое неповиновение.
- source_word: Ἰούδα
  choice: Иуду
  rationale: Традиционная русская форма имени Ἰούδας в книгах Маккавейских — «Иуда».
- source_word: ἀδελφῶν
  choice: братьев
  rationale: В данном контексте речь идёт о братьях Иуды; буквальное и естественное соответствие.
- source_word: οἰόμενοι
  choice: полагая
  rationale: Причастие передаёт их ошибочное предположение и мотив действий; «полагая» уместно в современном литературном повествовании.
- source_word: ἀνδραγαθῆσαι
  choice: смогут проявить доблесть
  rationale: Глагол означает поступить мужественно или отличиться доблестью. Этот вариант передаёт не только храбрость действия, но и стремление показать себя доблестными.
- source_word: αὐτοί
  choice: и сами
  rationale: Эмфатическое местоимение подчёркивает их уверенность, что они способны отличиться без Иуды и его братьев; частица «и» естественно усиливает это значение по-русски.
theological_decisions:
- issue: Причинная сила ὅτι
  choice: поражение произошло потому, что они не послушали Иуду и его братьев
  alternative: воспринимать последующую часть лишь как свободное повествовательное пояснение без выраженной причинности
  rationale: Союз ὅτι прямо вводит причину поражения. Перевод сохраняет авторскую историко-нравственную оценку, не развивая её в отдельное вероучительное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальная греческая конструкция καὶ ἐγενήθη передана естественной русской фразой без обязательного начального «и». Сохранены слово «народ», причинная связь и эмфаза αὐτοί; неоднозначность военного термина и оттенок ἀνδραγαθῆσαι отмечены в сносках.
