lexical_decisions:
- source_word: ἐμερίσθησαν
  choice: выделили
  rationale: Пассивная форма μερίζω обозначает распределение людей между военачальниками. Русская неопределённо-личная конструкция «выделили» естественно передаёт это военно-административное действие, не уточняя не названного в греческом деятеля.
- source_word: Σίμωνι
  choice: Симону
  rationale: Дательный падеж указывает, кому была выделена группа людей; форма имени соответствует принятой русской библейской традиции.
- source_word: ἄνδρες τρισχίλιοι
  choice: три тысячи человек
  rationale: ἄνδρες буквально означает «мужчины, люди»; в контексте речь идёт о воинах, однако «человек» сохраняет лексическую сдержанность оригинала и естественно сочетается с числительным.
- source_word: τοῦ πορευθῆναι
  choice: чтобы они отправились
  rationale: Артикулярный инфинитив выражает цель. «Чтобы они отправились» ясно связывает поход в Галилею с выделенными Симону людьми и не добавляет более узкого значения «выступили в поход».
- source_word: Γαλιλαίαν
  choice: Галилею
  rationale: Традиционное русское название области; после глагола движения употреблён винительный падеж с предлогом «в».
- source_word: Ἰούδα
  choice: Иуде
  rationale: Здесь это личное имя военачальника Иуды Маккавея; дательный падеж передаёт распределение второй группы ему.
- source_word: ἄνδρες ὀκτακισχίλιοι
  choice: восемь тысяч
  rationale: Во второй параллельной части слово «человек» естественно опущено по-русски, но однозначно восполняется из первой части.
- source_word: Γαλααδῖτιν
  choice: Галаад
  rationale: Прилагательное, употреблённое субстантивно, обозначает Галаадскую область. Традиционное краткое географическое название «Галаад» точно и естественно в основном тексте.
