lexical_decisions:
- source_word: ἐπισυνήγοντο
  choice: сходились
  rationale: Имперфект передаёт продолжавшееся или повторявшееся присоединение людей; «сходились» естественно выражает это движение и собрание.
- source_word: πρὸς αὐτούς
  choice: к ним
  rationale: Предлог πρός с винительным здесь указывает на движение к людям; «к ним» сохраняет направленность.
- source_word: εὐφημοῦντες
  choice: восхваляя их
  rationale: Причастие обозначает одобрительную, хвалебную речь. «Восхваляя» звучит естественно в повествовательном контексте, а местоимение «их» делает понятным подразумеваемый по контексту объект похвалы.
