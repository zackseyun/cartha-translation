  text: And he turned aside to Maapha and fought against it, and he captured it and killed every male in it, and he took its spoils and burned it with fire.
translation:
  language: ru
  text: И он свернул к Маафе, вступил с ней в бой, захватил её, убил в ней всех мужчин, взял добычу и предал её огню.
