lexical_decisions:
- source_word: ἀπέκλινεν
  choice: свернул к
  rationale: Передаёт изменение направления пути, не усиливая выражение до прямого «двинулся против».
- source_word: Μααφὰ
  choice: Маафа
  rationale: Транслитерация греческого названия Μααφά с естественным для русского языка окончанием.
- source_word: ἐπολέμησεν αὐτήν
  choice: вступил с ней в бой
  rationale: Естественно передаёт военное столкновение и сохраняет местоименную отсылку к городу.
- source_word: κατελάβετο αὐτήν
  choice: захватил её
  rationale: В военном контексте глагол означает овладение городом.
- source_word: πᾶν ἀρσενικὸν αὐτῆς
  choice: всех мужчин в ней
  rationale: Ясная современная формулировка, сохраняющая всеохватность исходного выражения; в контексте населения города «мужчин» звучит естественнее буквального «всех мужского пола».
- source_word: τὰ σκῦλα αὐτῆς
  choice: добычу
  rationale: Общеупотребительное русское обозначение захваченного военного имущества; принадлежность городу ясна из контекста.
- source_word: ἐνέπρησεν αὐτὴν ἐν πυρί
  choice: предал её огню
  rationale: Достоинная и естественная русская формула, передающая как сожжение города, так и явно названный в греческом огонь.
