  yaml_path: translation/deuterocanon/1_maccabees/005/016.yaml
  text: When Judas and the people heard these words[b][a], a great assembly gathered to consider what they should do for their brothers who were in distress and being attacked by them.
translation:
  language: ru
  text: Когда Иуда и народ услышали эти слова[a], было созвано большое собрание, чтобы обсудить, что им делать для своих братьев[b], находившихся в бедствии и подвергавшихся нападениям с их стороны[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эти вести»; буквально: «эти слова».'
    reason: lexical_alternative
  - marker: b
    text: «Братья» — здесь соплеменники, другие представители иудейского народа.
    reason: cultural_note
  - marker: c
    text: То есть, по контексту, со стороны враждебных окружающих народов; в греческом тексте стоит только местоимение «их».
    reason: referent_ambiguity
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Когда ... услышали
  rationale: ὡς с аористом вводит временное придаточное; русское «когда» естественно передаёт последовательность событий, не добавляя оттенка немедленности.
- source_word: Ἰούδας
  choice: Иуда
  rationale: Традиционная русская передача греческого личного имени Ἰούδας в библейском контексте.
- source_word: ὁ λαός
  choice: народ
  rationale: Обозначает народ, связанный с Иудой, а не только войско.
- source_word: τοὺς λόγους τούτους
  choice: эти слова
  rationale: Сохраняет прямое значение λόγους; по контексту возможно также понимание «эти вести», что отмечено в сноске.
- source_word: ἐπισυνήχθη ἐκκλησία μεγάλη
  choice: собралось большое собрание
  rationale: Передаёт факт созыва многочисленного общественного собрания и не вносит более позднего значения «церковь»; неизбежный корневой повтор приемлем, но синтаксис остаётся естественным и прозрачным.
- source_word: βουλεύσασθαι τί ποιήσωσιν
  choice: чтобы решить, что им делать
  rationale: Передаёт целенаправленное совместное совещание о практических действиях; «решить» здесь означает обсудить и определить образ действий.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: для своих братьев
  rationale: Сохраняет мужской термин родства источника; в контексте это соплеменники Иуды и народа.
- source_word: τοῖς οὖσιν ἐν θλίψει
  choice: находившихся в бедствии
  rationale: θλῖψις выражает тяжёлое положение, притеснение и бедствие; «в бедствии» звучит ясно и достойно.
- source_word: πολεμουμένοις ὑπʼ αὐτῶν
  choice: подвергавшихся нападениям с их стороны
  rationale: Пассивное причастие обозначает военные действия против братьев. Местоименная отсылка сохранена, поскольку сам стих не называет нападающих прямо.
theological_decisions:
- issue: Передача ἐκκλησία в иудейском историческом повествовании
  choice: собрание
  alternative: община; народное собрание; церковь
  rationale: «Собрание» передаёт общественно-совещательный смысл и не навязывает более поздних церковных коннотаций.
- issue: Передача ἀδελφοῖς как названия соплеменников
  choice: братья
  alternative: соплеменники; собратья; братья и сёстры
  rationale: Сохраняется образ родства и грамматическая форма греческого текста; более широкий национальный смысл поясняется в сноске.
- issue: Неясный антецедент αὐτῶν в ὑπʼ αὐτῶν
  choice: с их стороны
  alternative: со стороны врагов; со стороны язычников
  rationale: Внутри отдельного стиха референт местоимения не назван явно. Перевод сохраняет эту отсылку, а контекстуальное понимание поясняется, не подменяя текст.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис следует греческой последовательности, но остаётся понятным обычному читателю. Подлинная местоименная неоднозначность сохранена и пояснена сноской.
