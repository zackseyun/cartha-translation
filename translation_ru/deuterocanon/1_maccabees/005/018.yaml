  text: And he left Joseph son of Zechariah and Azariah[a], leaders of the people, with the rest of the forces in Judea for defense.
translation:
  language: ru
  text: И оставил он Иосифа, сына Захарии, и Азарию, предводителя народа, с остальными войсками в Иудее для её охраны.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы стеречь её»; греческое выражение подчёркивает охрану и бдительное наблюдение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλιπεν
  choice: оставил
  rationale: Прямо передаёт значение «оставил позади»; контекст подразумевает поручение, но сам глагол не означает формального назначения.
- source_word: Ἰώσηφον τὸν τοῦ Ζαχαρίου
  choice: Иосифа, сына Захарии
  rationale: Оборот τὸν τοῦ с родительным падежом указывает на отцовство; русская формулировка естественна и сохраняет родословное указание.
- source_word: Ἀζαρίαν
  choice: Азарию
  rationale: Традиционная русская библейская передача личного имени.
- source_word: ἡγούμενον τοῦ λαοῦ
  choice: предводителя народа
  rationale: Причастие стоит в единственном числе и по ближайшему синтаксическому согласованию характеризует Азарию. «Предводитель» передаёт руководство, не превращая его в строго определённую должность.
- source_word: μετὰ τῶν ἐπιλοίπων τῆς δυνάμεως
  choice: с остальными войсками
  rationale: В военном контексте δύναμις обозначает вооружённые силы, а ἐπίλοιπος — оставшуюся часть.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: в Иудее
  rationale: Обычная русская форма географического названия.
- source_word: εἰς τήρησιν
  choice: для её охраны
  rationale: τήρησις обозначает охрану, наблюдение или обеспечение сохранности; местоимение «её» естественно связывает цель с Иудеей, не сужая её до боевой обороны.
theological_decisions:
- issue: К кому относится ἡγούμενον τοῦ λαοῦ
  choice: 'к Азарии: «Азарию, предводителя народа»'
  alternative: 'к Иосифу и Азарии вместе: «вождей народа»'
  rationale: Греческое ἡγούμενον имеет форму винительного падежа мужского рода единственного числа; поэтому множественное «вожди» грамматически не выражено. Ближайшим возможным определяемым является Азария.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «оставил он» поддерживает повествовательный ритм, а «предводитель» сохраняет широкий смысл руководящей роли.
