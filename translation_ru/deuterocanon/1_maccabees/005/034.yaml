lexical_decisions:
- source_word: ἐπέγνω
  choice: узнало
  rationale: Глагол обозначает распознавание или установление личности; в данном контексте войско Тимофея узнало, что перед ним Маккавей.
- source_word: ἡ παρεμβολὴ Τιμοθέου
  choice: войско Тимофея
  rationale: παρεμβολή буквально может означать военный лагерь или стан, но здесь выступает как собирательное обозначение находившихся в нём воинов, что подтверждается последующим глаголом во множественном числе. «Войско Тимофея» естественно передаёт смысл по-русски.
- source_word: ὁ Μακκαβαῖός
  choice: Маккавей
  rationale: Устоявшаяся русская форма имени или прозвания; определённый артикль не требует отдельной передачи.
- source_word: ἔφυγον ἀπὸ προσώπου αὐτοῦ
  choice: побежало от него
  rationale: Семитизированный оборот буквально означает бегство от чьего-либо лица или присутствия; естественная русская передача сохраняет военный смысл.
- source_word: ἐπάταξεν αὐτοὺς πληγὴν μεγάλην
  choice: нанёс им тяжёлое поражение
  rationale: Греческая конструкция буквально говорит о нанесении великого удара; в военном повествовании русское выражение ясно передаёт решительный разгром без неуместной буквальности.
- source_word: ἔπεσον
  choice: пало
  rationale: Обычный военный эвфемизм, который сохраняет образ исходного текста и ясно подразумевает гибель в бою.
- source_word: εἰς ὀκτακισχιλίους ἄνδρας
  choice: около восьми тысяч человек
  rationale: Предлог εἰς при числительном допускает понимание приблизительного или округлённого итога; «около» естественно выражает эту возможность, а примечание сохраняет альтернативное точное прочтение.
