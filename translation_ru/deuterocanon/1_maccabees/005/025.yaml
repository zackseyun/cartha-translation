lexical_decisions:
- source_word: συνήντησαν
  choice: встретили
  rationale: Простой повествовательный глагол со значением встречи; «встретили» естественно по-русски и не подразумевает враждебности.
- source_word: Ναβαταίοις
  choice: набатеев
  rationale: Устоявшееся русское наименование народа; падеж обусловлен управлением русского глагола.
- source_word: ὑπήντησαν αὐτοῖς εἰρηνικῶς
  choice: а те мирно приняли их
  rationale: ὑπαντάω может означать выход навстречу или приём, а εἰρηνικῶς подчёркивает мирный характер встречи. «А те» естественно обозначает набатеев как субъект последующих действий, что соответствует развитию рассказа, тогда как сноска сохраняет лексическую вариативность выражения.
- source_word: διηγήσαντο
  choice: рассказали им
  rationale: Глагол обозначает подробное изложение или повествование; «рассказали» точно и естественно передаёт смысл. Косвенное дополнение «им» эксплицирует адресатов, ясных из контекста.
- source_word: ἅπαντα τὰ συμβεβηκότα
  choice: обо всём, что случилось
  rationale: Передаёт как всеохватность ἅπαντα, так и завершившиеся к тому моменту события, без тяжеловесности.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: с их братьями
  rationale: Сохраняет буквальный язык родства и не подменяет его толкованием «соплеменники» или «иудеи».
- source_word: ἐν τῇ Γαλααδίτιδι
  choice: в Галааде
  rationale: Краткая и традиционно понятная русская передача названия области Галаад.
