  text: And when Judas came near to the wadi[a], he stationed the scribes of the people at the wadi and commanded them, saying, “Do not let anyone camp[b], but let them all come into the battle.”
translation:
  language: ru
  text: 'Когда Иуда приблизился к руслу потока[a], он разместил у него писцов народа[b] и приказал им: «Не позволяйте никому разбивать лагерь; пусть все идут в бой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к бурному потоку», «к ручью» либо «к сухому руслу». Греческое слово может обозначать сезонный водоток и его русло.'
    reason: lexical_alternative
  - marker: b
    text: «Писцы народа» могли быть служившими при войске распорядителями или учётчиками; в переводе сохранено буквальное наименование «писцы».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: приблизился
  rationale: Естественный повествовательный глагол, точно передающий приближение к указанному месту.
- source_word: χειμάρρουν τοῦ ὕδατος
  choice: русло потока
  rationale: χειμάρρους обозначает поток, особенно сезонный или бурный, а также его русло; сочетание «русло потока» естественно по-русски передаёт географический характер местности без буквального и неуклюжего «поток воды».
- source_word: ἔστησεν
  choice: поставил
  rationale: В данном военном контексте означает разместить людей на определённом месте; «поставил» ясно и естественно передаёт это действие.
- source_word: γραμματεῖς τοῦ λαοῦ
  choice: писцов народа
  rationale: Сохранено буквальное наименование γραμματεῖς и конструкция с родительным падежом, хотя в военном контексте эти люди могли выполнять административные обязанности.
- source_word: ἐπὶ τοῦ χειμάρρου
  choice: у потока
  rationale: ἐπί с родительным падежом здесь указывает на положение у данного географического объекта; повторение слова сохраняет связь с первой частью стиха.
- source_word: Μὴ ἀφῆτε ἄνθρωπον παρεμβαλεῖν
  choice: Не позволяйте никому разбивать лагерь
  rationale: Конструкция ἀφῆτε с инфинитивом выражает запрет допускать действие, а παρεμβαλεῖν в военном употреблении означает разбить лагерь. «Никому» естественно передаёт обобщённое ἄνθρωπον.
- source_word: ἐρχέσθωσαν πάντες εἰς τὸν πόλεμον
  choice: пусть все идут в бой
  rationale: Передаёт повелительную форму, всеобщность участия и направленное движение к непосредственному сражению.
