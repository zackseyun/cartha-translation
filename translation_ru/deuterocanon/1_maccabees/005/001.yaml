lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: И когда
  rationale: Семитизированная повествовательная формула вводит следующее событие; буквальное «И случилось, когда» в современном русском здесь тяжеловесно, тогда как «И когда» сохраняет связность и временную структуру.
- source_word: τὰ ἔθνη κυκλόθεν
  choice: окрестные народы
  rationale: Передаёт географический смысл κυκλόθεν и сохраняет нейтральное значение ἔθνη, не вводя более интерпретативное «язычники».
- source_word: ᾠκοδομήθη τὸ θυσιαστήριον
  choice: жертвенник восстановлен
  rationale: Хотя глагол буквально означает «построен», контекст повествует о восстановлении после осквернения; «восстановлен» естественно передаёт контекстуальный смысл.
- source_word: ἐνεκαινίσθη τὸ ἁγίασμα
  choice: святилище вновь освящено
  rationale: В храмовом контексте глагол обозначает обновление и новое посвящение священному употреблению; эта формулировка ясна и не сводит действие лишь к ремонту.
- source_word: ὡς τὸ πρότερον
  choice: как прежде
  rationale: Кратко и естественно обозначает возвращение к прежнему состоянию.
- source_word: ὠργίσθη σφόδρα
  choice: пришли в сильную ярость
  rationale: Передаёт наступление состояния и высокую степень гнева, выраженную аористом ὠργίσθη и наречием σφόδρα.
theological_decisions:
- issue: Кого обозначает τὰ ἔθνη в иудейском историческом контексте
  choice: окрестные народы
  alternative: окрестные язычники
  rationale: Греческий текст буквально говорит о народах вокруг; контекст указывает на соседние неиудейские народы, но нейтральный перевод сохраняет формулировку источника и не усиливает религиозную квалификацию.
