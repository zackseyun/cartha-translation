  source_fidelity: 'Основная синтаксическая связь передана верно: Иосиф, сын Захарии, и второй военачальник узнают о действиях других лиц. Однако «военные подвиги» чрезмерно сближает τοῦ πολέμου с προηγущим ἀνδραγαθήσεων («доблестные деяния») и утрачивает прямое значение «война». Имя «Азария» представляет контекстуально поддержанное чтение, но расхождение со строкой Суита должно быть ясно отмечено сноской.'
  naturalness: '«Услышали о доблестных деяниях и о войне, которую они вели» звучит естественно в современном литературном русском. Указательное «те» после относительного местоимения в исходной фразе тяжеловесно и не нужно: местоимение «они» достаточно ясно отсылает к участникам предшествующего повествования.'
  terminology: «Военачальники» точно и естественно передаёт ἄρχοντες τῶν δυνάμεων. «Доблестные деяния» удачно передаёт ἀνδραγαθήσεις. Для τοῦ πολέμου предпочтительно сохранить «война», не превращая его в ещё один синоним подвигов.
