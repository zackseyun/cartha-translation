lexical_decisions:
- source_word: ἤκουσεν
  choice: услышали о
  rationale: Греческое единственное число при составном подлежащем передано нормативным русским множественным; предлог «о» естественно вводит содержание услышанного.
- source_word: Ἰωσὴφ ὁ τοῦ Ζαχαρία
  choice: Иосиф, сын Захарии
  rationale: Конструкция с артиклем и родительным падежом обозначает происхождение; «сын Захарии» ясно и естественно по-русски.
- source_word: Ζαχαρίας
  choice: Азария[a]
  rationale: Хотя в предоставленном тексте Суита здесь стоит «Захария», повествовательный контекст и основная текстовая традиция называют вторым военачальником Азарию; расхождение отмечено сноской.
- source_word: ἄρχοντες τῶν δυνάμεων
  choice: начальники войска
  rationale: Передаёт военное руководство без приписывания героям конкретного современного звания; собирательное «войско» естественно для δυνάμεις в данном контексте.
- source_word: ἀνδραγαθήσεων
  choice: доблестных деяниях
  rationale: Сохраняет значение мужества и выдающихся поступков, избегая архаичного буквального выражения «мужские подвиги».
- source_word: τοῦ πολέμου
  choice: военных подвигах
  rationale: В сочетании с ἀνδραγαθήσεων выражение указывает на славные действия на войне; конкретизация делает фразу естественной по-русски, не сводя её просто к известию о войне.
- source_word: οἷα ἐποίησαν
  choice: которые те совершили
  rationale: Относительное выражение относится к упомянутым деяниям; указательное «те» устраняет возможное ошибочное отнесение действий к Иосифу и Азарии, сохраняя отсылку к ранее названным участникам походов.
