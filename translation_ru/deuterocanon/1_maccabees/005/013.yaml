lexical_decisions:
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: наши братья
  rationale: Сохраняет прямой термин родства; в контексте он, вероятно, обозначает соплеменников-израильтян, но греческий текст говорит именно «братья».
- source_word: οἱ ὄντες ἐν τοῖς Τουβίου
  choice: жившие в земле Товии
  rationale: Передаёт местное значение оборота естественным русским языком, не превращая не вполне ясную форму Τουβίου в название народа.
- source_word: τεθανάτωνται
  choice: убиты
  rationale: Перфектная страдательная форма θανατόω указывает на совершившееся умерщвление и его наличный результат; военный контекст поддерживает значение насильственной смерти.
- source_word: αἰχμαλωτίκασι
  choice: увели в плен
  rationale: Глагол обозначает пленение; эта формулировка естественна по-русски и сохраняет военный смысл.
- source_word: τὴν ὑποσκευήν
  choice: имущество
  rationale: ὑποσκευή может обозначать поклажу, снаряжение или движимое имущество; здесь обобщающее «имущество» лучше всего соответствует перечню захваченного.
- source_word: ἀπώλεσαν
  choice: погубили
  rationale: Сохраняет более широкую семантику «уничтожить, погубить», оставаясь понятным при прямом дополнении, обозначающем людей.
- source_word: ὡς μίαν χιλιάδα ἀνδρῶν
  choice: около тысячи мужчин
  rationale: ὡς при числительном выражает приблизительность, а ἀνδρῶν прямо обозначает мужчин.
