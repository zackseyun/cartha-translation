  text: And Judas gave orders to make proclamation in the camp that each should encamp in the place where he is.
translation:
  language: ru
  text: Иуда приказал объявить по лагерю, чтобы каждый расположился там, где находился.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы каждый оставался на своём месте». Греческое выражение допускает понимание этого приказа как распоряжения всем сохранять свои нынешние позиции.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: приказал
  rationale: Передаёт властное распоряжение кратко и естественно для современного русского языка.
- source_word: κηρῦξαι
  choice: объявить
  rationale: В данном военном контексте обозначает публичное оглашение распоряжения по всему лагерю.
- source_word: παρεμβολῇ
  choice: лагерю
  rationale: В военном контексте παρεμβολή означает лагерь; конструкция «объявить по лагерю» естественно передаёт распространение объявления внутри него.
- source_word: παρεμβαλεῖν
  choice: расположился
  rationale: Передаёт размещение в военном лагере и позволяет сохранить возможный смысл приказа оставаться на текущем месте.
- source_word: ἕκαστον
  choice: каждый
  rationale: Сохраняет распределительное значение греческой формы, не добавляя отсутствующего в тексте указания на пол.
- source_word: ἐν ᾧ ἐστιν τόπῳ
  choice: там, где находился
  rationale: Естественно передаёт местное значение и наиболее вероятную отсылку к положению каждого в момент приказа; прошедшее время согласуется с русским косвенным повествованием.
