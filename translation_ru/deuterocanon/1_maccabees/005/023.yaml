  text: And he took them from Galilee and from Arbactis[a], together with the women and the children and all that belonged to them[b], and they brought them into Judea with great rejoicing.
translation:
  language: ru
  text: И он взял их из Галилеи и в Арбактах[a], вместе с женщинами и детьми и всем, что у них было, и они[b] привели их в Иудею с великой радостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст буквально говорит «в Арбактах». По смыслу движения возможно также: «из Арбакт».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте происходит переход от единственного числа («он взял») к множественному («они привели»). Перевод сохраняет эту переданную форму, не согласовывая глаголы.
    reason: textual_variant
lexical_decisions:
- source_word: παρέλαβεν
  choice: взял
  rationale: В повествовании глагол означает, что он принял людей под свою защиту и взял их с собой; краткое «взял» сохраняет широту греческого слова.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: из Галилеи
  rationale: Прямо передаёт исходное место движения и использует принятое русское название области.
- source_word: ἐν Ἀρβάκτοις
  choice: в Арбактах
  rationale: Сохраняет переданный греческим текстом предлог ἐν и не устраняет возможную синтаксическую неровность; название места передано транслитерацией.
- source_word: σὺν ταῖς γυναιξὶν καὶ τοῖς τέκνοις
  choice: вместе с женщинами, детьми
  rationale: «Женщинами» не сужает значение до «жён», а современное русское перечисление не требует повторения союза.
- source_word: πάντα ὅσα ἦν αὐτοῖς
  choice: всем, что у них было
  rationale: Естественно и широко передаёт их имущество и принадлежавшие им вещи.
- source_word: ἤγαγον
  choice: они привели
  rationale: Сохраняет множественное число переданного греческого глагола и обозначает сопровождение людей в Иудею.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: в Иудею
  rationale: Естественно передаёт направленное движение внутрь области.
- source_word: μετʼ εὐφροσύνης μεγάλης
  choice: с великой радостью
  rationale: Передаёт сильную, праздничную радость достойным и понятным современным русским выражением.
theological_decisions:
- issue: Смена числа сказуемого
  choice: Сохранён переход от единственного числа («он взял») к множественному («они привели»).
  alternative: 'Согласовать оба глагола в единственном числе: «он взял… и привёл».'
  rationale: Греческий текст явно содержит παρέλαβεν в единственном и ἤγαγον во множественном числе; гармонизация устранила бы подлинную неровность текста.
translation_notes:
