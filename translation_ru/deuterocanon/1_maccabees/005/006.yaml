  text: And he crossed over against the sons of Ammon[a], and found a strong force and a large people[b], with Timothy leading them.
translation:
  language: ru
  text: И он переправился, чтобы выступить против сынов Аммона[a], и встретил сильное войско[b] и многочисленный народ во главе с Тимофеем.
