lexical_decisions:
- source_word: διεπέρασεν
  choice: переправился
  rationale: Глагол обозначает переход или переправу на другую сторону; русский вариант сохраняет направленность движения, не уточняя неизвестный маршрут.
- source_word: ἐπὶ
  choice: чтобы выступить против
  rationale: В контексте военного похода предлог выражает враждебную направленность. Такая передача естественнее буквального «к» и не утверждает, что столкновение уже началось.
- source_word: τοὺς υἱοὺς Ἀμμών
  choice: сынов Аммона
  rationale: Сохранено буквальное выражение греческого текста; более привычный этноним «аммонитяне» дан в примечании.
- source_word: χεῖρα κραταιὰν
  choice: сильное войско
  rationale: Буквально выражение означает «сильную руку», но в данном военном контексте χείρ обозначает организованную вооружённую силу. Примечание сохраняет прозрачность исходной метафоры.
- source_word: λαὸν πολύν
  choice: многочисленный народ
  rationale: Передача сохраняет коллективное значение λαός и не сужает его до «армии», хотя контекст является военным.
- source_word: ἡγούμενον αὐτῶν
  choice: во главе с Тимофеем
  rationale: Естественно передаёт значение причастия «ведущий, возглавляющий», не усиливая его до специального военного звания.
