lexical_decisions:
- source_word: ἐδίωξεν
  choice: преследовал
  rationale: Естественный военный термин, передающий продолжение погони за отступающим противником.
- source_word: ἕως τῶν πόλεων Πτολεμαΐδος
  choice: до городов Птолемаиды
  rationale: Сохраняет выраженные в греческом тексте предел движения и множественное число «городов»; родительный падеж передаёт их связь с Птолемаидой без уточнения неясной географической детали.
- source_word: ἔπεσον
  choice: пало
  rationale: Сохраняет обычный для военного повествования образ погибших в бою, не заменяя его более истолковывающим «были убиты».
- source_word: ἐκ τῶν ἐθνῶν
  choice: из народов
  rationale: Прямо передаёт принадлежность павших к неиудейским народам и не вводит более конфессионально окрашенное обозначение «язычники».
- source_word: εἰς τρισχιλίους ἄνδρας
  choice: около трёх тысяч человек
  rationale: εἰς при числительном может обозначать численную величину и допускать приблизительность; русская формулировка звучит естественно и сохраняет эту возможность.
- source_word: τὰ σκῦλα αὐτῶν
  choice: их добычу
  rationale: «Добыча» естественно обозначает захваченное после сражения имущество, а «их» передаёт αὐτῶν.
