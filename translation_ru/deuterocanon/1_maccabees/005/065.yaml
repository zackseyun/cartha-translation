base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/065.yaml
  text: And Judas and his brothers went out[a], and they fought the sons of Esau in the land to the south, and he struck Hebron and its daughter towns; he tore down its fortress[b], and he burned its towers all around.
translation:
  language: ru
  text: Иуда и его братья выступили и воевали с сынами Исава[a] в земле, лежащей к югу. Он поразил Хеврон и зависевшие от него селения[b], разрушил его крепость и со всех сторон сжёг его башни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть с идумеями; буквально: «с сынами Исава».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «его дочерей» — так назывались небольшие селения, зависевшие от главного города.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: выступили
  rationale: В военном повествовательном контексте естественно передаёт начало похода, не усиливая значение до «отправились в поход».
- source_word: ἐπολέμουν
  choice: воевали
  rationale: Передаёт продолжительный оттенок имперфекта и естественно сочетается с обозначением противника.
- source_word: τοὺς υἱοὺς Ἠσαῦ
  choice: с сынами Исава
  rationale: Сохраняет буквальный библейский оборот и его связь с историей Исава и Эдома; этнический смысл пояснён в сноске.
- source_word: ἐν τῇ γῇ τῇ πρὸς νότον
  choice: в земле, лежащей к югу
  rationale: Близко передаёт греческое географическое описание, не превращая его без достаточного основания в имя собственное «Негев».
- source_word: ἐπάταξεν
  choice: Он поразил
  rationale: Сохраняет единственное число греческого глагола, вновь выделяющего Иуду как предводителя, и не уточняет, означает ли действие нападение или окончательную победу.
- source_word: τὴν Χεβρὼν
  choice: Хеврон
  rationale: Традиционная и общеупотребительная русская форма названия города.
- source_word: τὰς θυγατέρας αὐτῆς
  choice: зависевшие от него селения
  rationale: Естественно раскрывает древний географический образ «дочерей» города как подчинённых ему небольших поселений; сам образ отмечен в сноске.
- source_word: καθεῖλεν
  choice: разрушил
  rationale: Ясно и с надлежащей силой передаёт уничтожение укрепления.
- source_word: τὸ ὀχύρωμα αὐτῆς
  choice: его крепость
  rationale: «Крепость» — краткий и естественный эквивалент обозначения укреплённого оборонительного сооружения.
- source_word: ἐνεπύρισεν κυκλόθεν
  choice: со всех сторон сжёг
  rationale: Передаёт как действие огня, так и пространственное значение κυκλόθεν — «кругом, со всех сторон».
theological_decisions:
- issue: Этноним или буквальное родственное обозначение в τοὺς υἱοὺς Ἠσαῦ
  choice: сыны Исава
  alternative: идумеи; потомки Исава
  rationale: Буквальная форма сохраняет межтекстовую связь с библейским повествованием об Исаве и отношениях Израиля с Эдомом, тогда как сноска сообщает читателю этнический референт без подмены текста толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным для широкого читателя; сохранены библейский оборот «сыны Исава», смена множественного числа на единственное при Иуде и неопределённость военного глагола «поразил».
