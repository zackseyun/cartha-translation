  source_fidelity: 'Текст точно передаёт греческий оригинал: сохранены военный выход Иуды с братьями, буквальное «сыны Исава», географическое «в земле, лежащей к югу», а также переход к единственному числу, выделяющий Иуду. «Поразил» не навязывает более узкого значения, чем ἐπάταξεν. «Со всех сторон сжёг его башни» передаёт ἐνεπύρισεν κυκλόθεν без необоснованного уточнения.'
