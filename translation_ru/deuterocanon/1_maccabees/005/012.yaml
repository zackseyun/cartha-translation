  text: Now then[a], come and rescue us from their hand[b], because a great number of our people has fallen.
translation:
  language: ru
  text: Теперь же приди и избавь нас из их рук[a], ведь множество наших людей пало[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из их руки» — обычный образ власти или вражеского контроля.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово не уточняет, означает ли «пало» гибель, поражение или и то и другое.
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν οὖν
  choice: Теперь же
  rationale: Передаёт временное значение νῦν и переходно-следственный оттенок οὖν, сохраняя настойчивость просьбы.
- source_word: ἐλθὼν ἔξελου
  choice: приди и избавь
  rationale: Аористное причастие ἐλθών при повелительном ἔξελου естественно передаётся по-русски двумя однородными повелительными формами. «Избавь» выражает спасение от непосредственной опасности или вражеской власти.
- source_word: ἐκ χειρὸς αὐτῶν
  choice: из их рук
  rationale: Сохраняет образ греческого выражения «из их руки», но использует естественное для современного русского языка множественное число в значении избавления от чужой власти.
- source_word: πέπτωκεν
  choice: пало
  rationale: Буквально сохраняет образ падения; в военном контексте слово может подразумевать гибель, поражение или оба значения, поэтому более узкое толкование не вносится.
- source_word: ἐξ ἡμῶν πλῆθος
  choice: множество наших людей
  rationale: Передаёт и количественный акцент πλῆθος, и принадлежность к говорящей общине, выраженную ἐξ ἡμῶν, в понятной современной русской форме.
