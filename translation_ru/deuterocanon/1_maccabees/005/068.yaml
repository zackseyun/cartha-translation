base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/068.yaml
  text: And Judas turned aside into Azotus[a], the land of foreigners, and he tore down their altars, and burned the carved images of their gods with fire, and plundered the spoil of the cities[b], and returned to Judea.
translation:
  language: ru
  text: И Иуда свернул в Азот, в землю иноплеменников[a], разрушил их жертвенники; изваяния их богов они сожгли[b], он забрал добычу из городов и возвратился в Иудею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с учётом исторического контекста: «в землю филистимлян». Буквально по-гречески: «в землю иноплеменников».'
    reason: alternative_reading
  - marker: b
    text: В греческом тексте глагол «сожгли» стоит во множественном числе, тогда как окружающие его глаголы — в единственном. Вероятно, здесь подразумеваются воины Иуды.
    reason: source_grammar
lexical_decisions:
- source_word: ἐξέκλινεν
  choice: свернул
  rationale: Передаёт изменение направления движения естественным современным русским языком, не уточняя мотив.
- source_word: Ἄζωτον
  choice: Азоту
  rationale: Сохраняет греческую эллинизированную форму топонима Ἄζωτος; падеж обусловлен русским синтаксисом.
- source_word: γῆν ἀλλοφύλων
  choice: в землю иноплеменников
  rationale: Передаёт буквальный и достаточно широкий смысл ἀλλόφυλοι — людей иного племени; историческая конкретизация вынесена в примечание.
- source_word: καθεῖλεν τοὺς βωμοὺς
  choice: разрушил их жертвенники
  rationale: Конкретно передаёт уничтожение культовых сооружений; «жертвенники» — обычный русский эквивалент βωμοί.
- source_word: τὰ γλυπτὰ τῶν θεῶν αὐτῶν
  choice: изваяния их богов
  rationale: Сохраняет указание на изготовленные резные изображения, не заменяя его более интерпретирующим словом «идолы».
- source_word: κατέκαυσαν
  choice: они сожгли
  rationale: Сохраняет множественное число греческого глагола, резко сменяющее единственное число окружающих форм.
- source_word: ἐσκύλευσεν τὰ σκῦλα τῶν πόλεων
  choice: он разграбил города
  rationale: 'Естественно передаёт семантически избыточную для русского языка конструкцию с однокоренными глаголом и существительным: буквально — «захватил добычу городов».'
- source_word: ἐπέστρεψεν εἰς τὴν Ἰουδαίαν
  choice: возвратился в Иудею
  rationale: Точно и естественно передаёт возвращение в регион.
theological_decisions:
- issue: Этническое обозначение ἀλλόφυλοι в историческом контексте Филистии
  choice: земля иноплеменников
  alternative: земля филистимлян
  rationale: Основной текст сохраняет более широкую формулировку греческого источника и не вносит прямое этническое название; исторически вероятная конкретизация дана в примечании.
- issue: Переход к множественному числу в κατέκαυσαν после глаголов единственного числа
  choice: они сожгли
  alternative: он сжёг
  rationale: Сохранено подлинное грамматическое напряжение источника. Множественное число, вероятно, подразумевает воинов Иуды, но перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис слегка расчленён точкой с запятой, чтобы ясно сохранить неожиданную смену числа у глагола «сожгли». Без архаизмов вроде «истуканов» и без конфессиональной конкретизации.
