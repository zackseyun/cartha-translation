  yaml_path: translation/deuterocanon/1_maccabees/005/046.yaml
  text: And they came as far as Ephron. This was a large city at the entrance[a], very strong. There was no way to turn aside from it to the right or to the left, but only to go through the middle of it.
translation:
  language: ru
  text: И дошли они до Ефрона. Это был большой, весьма укреплённый город у входа[a]. Его нельзя было обойти ни справа, ни слева — оставалось только идти через середину города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у прохода» или «на подступах». Греческое выражение указывает на положение Ефрона у входа или прохода, чем объясняется, почему город нельзя было обойти.'
    reason: Лексическая неоднозначность выражения ἡ τῆς εἰσόδου.
lexical_decisions:
- source_word: ἦλθον ἕως Ἐφρών
  choice: дошли они до Ефрона
  rationale: ἕως с названием места обозначает предел движения. «Дошли до» естественно передаёт это значение; название места дано в традиционной русской форме «Ефрон».
- source_word: αὕτη ἡ πόλις μεγάλη
  choice: Это был большой город
  rationale: Указательное αὕτη передано явно, а именная конструкция оформлена естественным для русского языка предложением.
- source_word: ἡ τῆς εἰσόδου
  choice: город у входа[a]
  rationale: εἴσοδος буквально обозначает вход или подступ. Формулировка сохраняет пространственный образ, а возможный смысл горного или стратегического прохода отмечен в сноске.
- source_word: ἰσχυρὰ σφόδρα
  choice: весьма укреплённый
  rationale: Применительно к городу ἰσχυρά указывает на его оборонительную мощь. «Весьма укреплённый» естественно выражает этот военный смысл, не добавляя конкретных деталей укреплений.
- source_word: οὐκ ἦν ἐκκλῖναι ἀπ’ αὐτῆς δεξιὰν ἢ ἀριστεράν
  choice: Его нельзя было обойти ни справа, ни слева
  rationale: Безличная конструкция выражает невозможность уклониться от маршрута и миновать город с какой-либо стороны. «Обойти» ясно передаёт тактический смысл контекста.
- source_word: ἀλλ’ ἢ διὰ μέσου αὐτῆς πορεύεσθαι
  choice: оставалось только идти через середину города
  rationale: ἀλλ’ ἢ задаёт единственную возможную альтернативу, а διὰ μέσου сохраняет образ движения через середину самого города.
