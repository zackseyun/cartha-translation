lexical_decisions:
- source_word: τοῖς ἀνδράσιν τῆς δυνάμεως
  choice: воинам
  rationale: В военном контексте сочетание обозначает мужчин, составляющих боевую силу или войско. «Воинам» естественно передаёт смысл по-русски и сохраняет указание на участников сражения; буквальное «мужам войска» звучало бы тяжеловесно.
- source_word: Πολεμήσατε
  choice: Сражайтесь
  rationale: Аористный императив выражает прямой призыв немедленно вступить в бой. «Сражайтесь» передаёт военный смысл и побудительную силу формы.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямой современный эквивалент, подчёркивающий неотложность призыва.
- source_word: ὑπὲρ
  choice: за
  rationale: В данном контексте предлог указывает на борьбу ради других или в их защиту. Краткое русское «за» сохраняет эту смысловую ёмкость, не сужая значение до одного лишь оборонительного действия.
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: наших братьев
  rationale: Перевод сохраняет грамматически мужское обозначение исходного текста и выраженную им общинную солидарность; в контексте речь может идти не только о родных братьях, но и о соплеменниках-израильтянах.
theological_decisions:
- issue: Гендерно маркированное обозначение членов общины
  choice: наших братьев
  alternative: наших соплеменников; наших братьев и сестёр
  rationale: Греческое ἀδελφῶν имеет форму мужского рода. «Братьев» сохраняет форму и образ исходного текста, тогда как возможный широкий общинный смысл поясняется в сноске без расширения основного текста.
translation_notes:
  register: Современный литературный русский язык; краткая, прямая военная речь. Местоимение «он» сохранено, поскольку имя говорящего определяется ближайшим контекстом. Формулировка не архаизирована, но выдержана в достойном повествовательном регистре.
