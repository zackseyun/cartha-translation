  text: And they seized the city[a], and they burned the temple precinct with fire, together with all who were in it; and Karnain was routed, and it could no longer stand before Judas.
translation:
  language: ru
  text: Они овладели городом и предали огню священный участок вместе со всеми, кто там находился[a]. Карнаин был разгромлен и уже не мог устоять перед Иудой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместе со всем, что там находилось». Греческое выражение допускает более широкое понимание, хотя в данном контексте, вероятнее всего, речь идёт о людях, находившихся внутри священного участка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκατελάβοντο
  choice: овладели
  rationale: В данном повествовательном контексте глагол означает захват и занятие города. Передача приставочного значения προ- отдельным словом сделала бы русский текст неестественным и внесла бы неочевидный временной оттенок.
- source_word: τέμενος
  choice: священный участок
  rationale: Слово обозначает посвящённую божеству ограждённую территорию, а не обязательно только здание храма; выбранный вариант сохраняет эту широту значения.
- source_word: ἐνεπύρισαν ἐν πυρί
  choice: предали огню
  rationale: Русское выражение естественно передаёт усиленную греческую конструкцию со значением полного сожжения, не воспроизводя её тавтологически.
- source_word: σὺν πᾶσιν τοῖς οὖσιν ἐν αὐτῷ
  choice: вместе со всеми, кто там находился
  rationale: Субстантивированное причастие во множественном числе наиболее естественно относится к людям внутри священного участка; более широкая грамматически возможная трактовка сохранена в сноске.
- source_word: ἐτροπώθη
  choice: был разгромлен
  rationale: 'Пассивная форма имеет здесь военное значение: противник был обращён в бегство или потерпел поражение. «Был разгромлен» естественно звучит применительно к городу и его защитникам.'
- source_word: Καрναῒν
  choice: Карнаин
  rationale: Транслитерация греческой формы названия в соответствии с нормами современного русского языка.
- source_word: οὐκ ἐδύνατο ἔτι ὑποστῆναι
  choice: уже не мог устоять
  rationale: Сохраняется образ способности стоять против наступающего противника и одновременно ясно выражается невозможность дальнейшего сопротивления.
- source_word: κατὰ πρόσωπον Ἰούδα
  choice: перед Иудой
  rationale: Это естественная русская передача идиомы в контексте прямого военного противостояния; буквальное «лицом к лицу против Иуды» было бы тяжеловесным.
