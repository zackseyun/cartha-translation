lexical_decisions:
- source_word: προκατελάβε
  choice: захватил
  rationale: В повествовании о военных действиях глагол обозначает овладение местом; «захватил» естественно передаёт смысл, не придавая приставке προ- сомнительного отдельного значения «заранее».
- source_word: Ἰαζὴρ
  choice: Иазер
  rationale: Традиционная русская библейская форма названия города, соответствующая греческому топониму.
- source_word: θυγατέρας
  choice: зависевшие от него поселения
  rationale: Буквально «дочери»; в географическом употреблении так называются меньшие населённые пункты, административно связанные с главным городом. Развёрнутая передача ясна современному читателю и сохраняет отношение зависимости.
- source_word: ἀπέστρεψεν
  choice: возвратился
  rationale: Точно и естественно передаёт возвращение после военного похода.
- source_word: Ἰουδαίαν
  choice: Иудею
  rationale: Здесь имеется в виду эллинистическая область Иудея, а не древнее колено или царство Иуды.
