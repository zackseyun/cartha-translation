lexical_decisions:
- source_word: Ποιήσωμεν ... ἑαυτοῖς ὄνομα
  choice: прославим своё имя
  rationale: Греческое выражение буквально означает «сделаем себе имя», то есть приобретём известность и славу. Выбранный вариант сохраняет образ имени и естественно передаёт смысл по-русски.
- source_word: καὶ αὐτοὶ
  choice: и мы
  rationale: Сочетание подчёркивает, что говорящие хотят и сами совершить подобное; в прямой речи естественно передаётся как «и мы».
- source_word: πορευθῶμεν πολεμῆσαι
  choice: пойдём воевать
  rationale: Два побудительных действия переданы прямо и естественно; «воевать» обозначает участие в военных действиях, не сужая смысл до одного сражения.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: ἔθνη может означать народы вообще и, в данном контексте, окружающие нееврейские народы. «Народы» сохраняет широту греческого слова.
- source_word: τὰ κύκλῳ ἡμῶν
  choice: которые вокруг нас
  rationale: Передаёт пространственное значение κύκλῳ и ясно связывает определение с народами.
theological_decisions:
- issue: Идиома ποιεῖν ὄνομα
  choice: прославим своё имя
  alternative: сделаем себе имя; приобретём себе славу
  rationale: Выбранная формулировка сохраняет библейский образ «имени», но не оставляет современного читателя с неясной буквальной калькой.
- issue: Значение ἔθνη
  choice: народы
  alternative: язычники; иноплеменники
  rationale: Стих описывает историко-военное действие; нейтральное «народы» не вводит более узкого богословского оттенка, хотя контекст подразумевает окружающие нееврейские народы.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Побуждение передано естественным «давайте» и согласованными формами будущего времени; военная и этническая лексика оставлена ясной и без конфессиональной нагрузки.
