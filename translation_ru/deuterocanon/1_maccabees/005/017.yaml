  text: And Judas said to Simon his brother[a], “Choose men for yourself, and go and rescue your brothers in Galilee; but I and Jonathan my brother will go into Gileaditis.”
translation:
  language: ru
  text: 'Иуда сказал своему брату Симону: «Выбери себе людей, ступай и спаси своих братьев в Галилее, а мы с моим братом Ионафаном отправимся в Галаадскую область[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в Галаадитиду» — так по-гречески названа область Галаада; возможно также: «в Галаад».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίλεξον σεαυτῷ ἄνδρας
  choice: Выбери себе людей
  rationale: Передаёт повелительное наклонение, возвратное местоимение и общее слово ἄνδρας без контекстуального уточнения «воинов».
- source_word: πορεύου
  choice: ступай
  rationale: Естественное русское повеление отправиться в путь; сохраняет самостоятельную побудительную силу глагола.
- source_word: ῥῦσαι
  choice: спаси
  rationale: В контексте непосредственной военной угрозы означает активное избавление от опасности; «спаси» ясно и естественно передаёт этот смысл.
- source_word: τοὺς ἀδελφούς σου
  choice: своих братьев
  rationale: Сохраняет родственный образ греческого текста, не подменяя его пояснительным «соплеменников» или «единоверцев».
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: в Галилее
  rationale: Прямая и естественная передача местного значения.
- source_word: ἐγὼ δὲ καὶ Ἰωναθὰν ὁ ἀδελφός μου
  choice: а мы с моим братом Ионафаном
  rationale: Союз «а» передаёт разграничение поручений, а конструкция «мы с…» звучит естественно в современном литературном русском и сохраняет указание на братство.
- source_word: πορευσόμεθα
  choice: отправимся
  rationale: Передаёт будущее время и движение к назначенному месту несколько точнее, чем общее «пойдём».
- source_word: εἰς τὴν Γαλααδῖτιν
  choice: в Галаадскую область
  rationale: Передаёт региональное значение названия Γαλααδῖτις понятным современному читателю способом, не сводя его без пояснения к одному лишь «Галааду».
