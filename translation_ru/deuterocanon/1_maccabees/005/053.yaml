lexical_decisions:
- source_word: ἐπισυνάγων
  choice: собирал
  rationale: 'Передаёт продолжительное действие Иуды: он вновь собирал вместе тех, кто отстал во время перехода.'
- source_word: τοὺς ἐσχατίζοντας
  choice: отстававших
  rationale: Причастие обозначает людей, оказывавшихся позади колонны; «отстававших» естественно передаёт процесс, не превращая их в особый арьергард.
- source_word: παρακαλῶν
  choice: ободрял
  rationale: В условиях трудного перехода глагол может сочетать поддержку и призыв продолжать путь; «ободрял» сохраняет этот широкий смысл.
- source_word: τὸν λαόν
  choice: народ
  rationale: Сохраняет прямое значение греческого слова и не сужает его до «войска» или «воинов».
- source_word: κατὰ πᾶσαν τὴν ὁδόν
  choice: на всём пути
  rationale: Естественная русская формулировка, выражающая действие, продолжавшееся на протяжении всего пути.
- source_word: γῆν Ἰούδα
  choice: землю Иуды
  rationale: Следует буквальной географической формулировке источника и сохраняет библейское название, не заменяя его словом «Иудея».
