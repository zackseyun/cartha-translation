lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις αἷς
  choice: в то время, когда
  rationale: Естественная современная русская передача временного оборота, сохраняющая его связь с последующими событиями.
- source_word: ἦν
  choice: находились
  rationale: По-русски глагол согласован с составным подлежащим «Иуда и Ионафан»; «находились» ясно выражает пребывание в данной местности.
- source_word: Γαλαάδ
  choice: Галаад
  rationale: Устоявшаяся русская библейская форма географического названия.
- source_word: Σίμων ὁ ἀδελφὸς αὐτοῦ
  choice: их брат Симон
  rationale: Греческое местоимение стоит в единственном числе, однако по смыслу Симон назван братом упомянутых Иуды и Ионафана; русское «их» естественно и избегает ложной привязки лишь к ближайшему имени.
- source_word: Γαλιλαίᾳ
  choice: Галилее
  rationale: Устоявшаяся русская библейская форма названия области.
- source_word: κατὰ πρόσωπον Πτολεμαΐδος
  choice: напротив Птолемаиды
  rationale: Сохраняет пространственный смысл греческого выражения без уточнения положения или направления, которого текст однозначно не задаёт.
- source_word: Πτολεμαΐδος
  choice: Птолемаиды
  rationale: Устоявшаяся русская форма названия города, поставленная в родительном падеже согласно управлению.
