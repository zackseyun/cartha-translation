  yaml_path: translation/deuterocanon/1_maccabees/005/062.yaml
  text: But they were not from the offspring of those men through whose hand deliverance had been given to Israel[a].
translation:
  language: ru
  text: Но сами они не были потомками тех мужей, через которых Израилю было даровано избавление[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через их руку»; возможно также: «их рукой».'
    reason: Сохраняется буквальная форма семитизированного греческого оборота διὰ χειρὸς αὐτῶν, обозначающего действие через чьё-либо посредство.
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Но сами они
  rationale: δέ выражает контраст с предшествующим повествованием, а αὐτοί придаёт местоимению лёгкое усиление; сочетание «Но сами они» естественно передаёт оба оттенка.
- source_word: ἐκ τοῦ σπέρματος
  choice: не происходили из рода
  rationale: В данном генеалогическом обороте σπέρμα обозначает происхождение, потомство или род. Русское «происходили из рода» ясно передаёт принадлежность к линии названных мужей и звучит естественнее буквального «из семени».
- source_word: τῶν ἀνδρῶν ἐκείνων
  choice: тех мужей
  rationale: ἀνδρῶν указывает на конкретных мужчин, о которых шла речь; «мужей» сохраняет историко-библейский оттенок без чрезмерной архаизации.
- source_word: ἐδόθη
  choice: было даровано
  rationale: Страдательная форма δίδωμι указывает, что избавление было дано; «даровано» сохраняет пассивность и не называет прямо подразумеваемого подателя.
- source_word: σωτηρία
  choice: избавление
  rationale: В историко-военном контексте речь идёт о конкретном спасении Израиля от опасности. «Избавление» передаёт этот смысл, не сужая его до одной лишь победы и не навязывая позднейшей догматической окраски.
- source_word: διὰ χειρὸς αὐτῶν
  choice: через которых
  rationale: Греческий семитизированный оборот буквально говорит о действии «через их руку» и обозначает посредничество или орудие действия. В основном тексте смысл естественно передан по-русски как «через которых», а буквальный образ сохранён в примечании.
theological_decisions:
- issue: Значение σωτηρία в историко-военном контексте
  choice: избавление
  alternative: спасение; победа
  rationale: «Избавление» сохраняет широкую идею спасения Израиля в конкретной исторической опасности, не превращая её исключительно в военную победу и не придавая выражению излишне специального богословского смысла.
- issue: Посредничество в обороте διὰ χειρὸς αὐτῶν
  choice: через которых
  alternative: через их руку; их рукой
  rationale: Такой перевод ясно передаёт человеческое посредничество, при этом пассив «было даровано» сохраняет неназванным того, кто даровал избавление. Буквальная образность отмечена в сноске, а не устранена бесследно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Мужей» и «даровано» поддерживают достоинство стиля, оставаясь понятными; тяжеловесный буквализм «из семени» и «через их руку» вынесен из основного текста.
