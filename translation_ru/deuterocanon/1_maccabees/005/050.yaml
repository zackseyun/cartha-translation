  text: And the men of the city encamped, and they fought against the city all that day and all that night, and the city was delivered into his hands.
translation:
  language: ru
  text: Мужчины из города разбили лагерь и сражались против города весь тот день и всю ночь, и город был отдан в его руки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «в его руки»; местоимение стоит в единственном числе. В некоторых переводах здесь употребляется множественное число — «в их руки» — в согласовании с предыдущими действующими лицами.'
    reason: Сохранён неожиданный переход от множественного числа к единственному в греческом тексте.
lexical_decisions:
- source_word: παρενέβαλον
  choice: расположились лагерем
  rationale: Глагол обозначает размещение лагеря или занятие военной позиции. Этот перевод сохраняет конкретный военный образ, не усиливая значение до «атаковали».
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: мужчины города
  rationale: ἄνδρες означает именно мужчин, а родительный оборот связывает их с городом. Формулировка сохраняет эту точность, хотя дальнейшее упоминание борьбы против города создаёт трудность уже в самом греческом тексте.
- source_word: ἐπολέμησαν τὴν πόλιν
  choice: сражались против города
  rationale: Глагол означает вести бой или войну; винительный падеж передан естественной для русского языка конструкцией с «против». Объект «город» сохранён, несмотря на контекстуальную странность фразы.
- source_word: ὅλην τὴν ἡμέραν ἐκείνην καὶ ὅλην τὴν νύκτα
  choice: весь тот день и всю ночь
  rationale: Передаётся повторение ὅλην и последовательность дня и ночи в естественной современной русской форме.
- source_word: παρεδόθη
  choice: был отдан
  rationale: Пассивная форма сохраняет значение передачи или отдачи и не называет подразумеваемого деятеля.
- source_word: ἐν χερσὶν αὐτοῦ
  choice: в его руки
  rationale: Сохранены образное выражение и единственное число местоимения αὐτοῦ, хотя предшествующие действующие лица обозначены множественным числом.
theological_decisions:
- issue: Переход к единственному числу в заключительной части
  choice: сохранить «в его руки»
  alternative: сгладить как «в их руки» или передать «под их власть»
  rationale: Греческий текст содержит αὐτοῦ в единственном числе. Возможная отсылка к предводителю не выражена прямо, поэтому перевод не устраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным повествовательным тоном. Военная лексика передана ясно и без архаизмов; контекстуальная странность выражения «мужчины города… сражались против города» не сглажена, поскольку она присутствует в исходном греческом тексте.
