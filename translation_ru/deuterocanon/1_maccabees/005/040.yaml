base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/040.yaml
  text: And Timotheus said to the commanders of his forces[a], when Judas and his camp were drawing near to the wadi, “If he crosses over to us first, we will not be able to withstand him[b], because he will surely prevail against us.”
translation:
  language: ru
  text: 'И Тимофей сказал военачальникам своего войска, когда Иуда со своим станом приближался к потоку[a]: «Если он первым переправится к нам, мы не сможем устоять перед ним, потому что он сможет одолеть нас[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. буквально: «к потоку воды». Слово может обозначать сезонный поток или водоток; вероятно, имеется в виду естественная преграда, через которую предстояло переправиться.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «он сможет против нас»; по смыслу — окажется сильнее и одолеет их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρχουσιν τῆς δυνάμεως αὐτοῦ
  choice: военачальникам своего войска
  rationale: В военном контексте ἄρχοντες — начальники или командиры, а δύναμις обозначает вооружённые силы. Выбранное выражение естественно и ясно передаёт их функцию.
- source_word: ἐν τῷ ἐγγίζειν
  choice: когда ... приближался
  rationale: Конструкция с субстантивированным инфинитивом выражает одновременность; придаточное времени естественно передаёт её по-русски.
- source_word: Ἰούδαν καὶ τὴν παρεμβολὴν αὐτοῦ
  choice: Иуда со своим станом
  rationale: παρεμβολή может обозначать лагерь или расположившееся лагерем войско. «Со своим станом» сохраняет эту ёмкость и соответствует историческому повествовательному регистру без излишней архаики.
- source_word: χειμάρρουν τοῦ ὕδατος
  choice: руслу потока
  rationale: χειμάρρους обозначает поток, особенно сезонный, либо его русло. «Русло потока» передаёт особенность местности и делает последующую переправу понятной; буквальная греческая формулировка отмечена в сноске.
- source_word: διαβῇ πρὸς ἡμᾶς πρότερος
  choice: первым переправится к нам
  rationale: διαβαίνω означает пересечь преграду или переправиться, а πρότερος указывает, что Иуда сделает это раньше противника.
- source_word: ὑποστῆναι αὐτόν
  choice: устоять перед ним
  rationale: В данном военном контексте глагол означает выдержать натиск или противостоять противнику; русский оборот краток и естественен.
- source_word: δυνήσεται πρὸς ἡμᾶς
  choice: он одолеет нас
  rationale: Греческое выражение сжато и буквально говорит, что Иуда «сможет против нас». По контексту речь о его превосходстве в бою; менее гладкая буквальная форма сохранена в сноске как лексическая альтернатива.
- source_word: Τιμόθεος
  choice: Тимофей
  rationale: Это традиционная и общепонятная русская форма греческого имени Τιμόθεος.
- source_word: Ἰούδαν
  choice: Иуда
  rationale: Использована традиционная русская форма имени Иуды Маккавея.
