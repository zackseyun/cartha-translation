  - severity: medium
    issue: Сноска a неточно маркирована как буквальная и добавляет спекулятивную деталь.
    rationale: τοῦ ὕδατος буквально означает «воды», поэтому «к водному потоку» не воспроизводит конструкцию буквально; фраза о русле, которое «могло быть наполнено водой», не следует непосредственно из текста.
