lexical_decisions:
- source_word: ἀπῆρεν
  choice: выступил
  rationale: В данном повествовательном и военном контексте глагол обозначает отправление в путь; «выступил» естественно передаёт начало движения от указанного места.
- source_word: ἐκεῖθεν
  choice: оттуда
  rationale: Прямо обозначает исходную точку движения.
- source_word: νυκτός
  choice: ночью
  rationale: Наречное употребление родительного падежа; краткий и естественный русский эквивалент.
- source_word: ἐπορεύετο
  choice: шёл
  rationale: Форма имперфекта представляет движение как продолжавшийся процесс; русский несовершенный вид сохраняет эту длительность без утяжеления фразы.
- source_word: ἕως ἐπὶ
  choice: до
  rationale: Сочетание указывает на предел движения; «до» передаёт его без добавления отдельного глагола прибытия.
- source_word: ὀχύρωμα
  choice: укрепление
  rationale: Слово обозначает укреплённое место или оборонительное сооружение; «укрепление» сохраняет общность значения и не уточняет тип объекта сверх греческого текста.
