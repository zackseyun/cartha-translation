  text: And he set out from there by night[a], and he kept going until he reached the stronghold.
translation:
  language: ru
  text: И ночью он выступил оттуда и шёл до укрепления[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крепости». Греческое слово может обозначать укреплённое место в более общем смысле.'
