lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: повернули
  rationale: Глагол обозначает перемену направления; «повернули» не создаёт необязательного впечатления отступления.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: его войско
  rationale: παρεμβολή может обозначать как лагерь, так и расположенное в нём войско; при совместном движении с Иудой естественное русское соответствие — «войско».
- source_word: ὁδὸν εἰς τὴν ἔρημον
  choice: по дороге в пустыню
  rationale: Передаёт и ὁδόν («дорога, путь»), и направление εἰς τὴν ἔρημον без излишнего сглаживания сжатой греческой конструкции.
- source_word: εἰς Βοσὸρ
  choice: к Восору
  rationale: Предлог выражает направление движения; топоним передан в традиционной русской библейской форме «Восор».
- source_word: ἄφνω
  choice: внезапно
  rationale: Прямо передаёт неожиданность и резкость военного манёвра.
- source_word: κατελάβετο
  choice: захватил
  rationale: В военном контексте глагол означает овладение городом.
- source_word: πᾶν ἀρσενικόν
  choice: всех мужчин
  rationale: Греческое выражение буквально охватывает всех лиц мужского пола; в современном русском повествовании «всех мужчин» звучит естественно, сохраняя суровый смысл контекста.
- source_word: ἐν στόματι ῥομφαίας
  choice: остриём меча
  rationale: Устойчивый библейский оборот буквально означает «устами меча»; «остриём меча» передаёт его смысл естественным и вместе с тем образным русским выражением.
- source_word: τὰ σκῦλα
  choice: добычу
  rationale: Слово обозначает имущество, захваченное на войне; «добыча» ясно и достойно звучит в данном контексте.
- source_word: ἐνέπρησεν αὐτὴν πυρί
  choice: сжёг город огнём
  rationale: Сохраняет явно названное в греческом тексте «огнём», а повтор существительного «город» устраняет возможную неясность местоимения в русском.
