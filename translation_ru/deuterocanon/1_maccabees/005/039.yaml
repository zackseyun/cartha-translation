lexical_decisions:
- source_word: Ἄραβες
  choice: Арабы
  rationale: Прямое и естественное современное обозначение народа.
- source_word: μεμίσθωνται
  choice: были наняты
  rationale: Перфект передаёт уже состоявшийся наём и сохраняющееся вследствие этого положение; слово «наёмники» не вводится, поскольку в греческом оно лишь подразумевается.
- source_word: εἰς βοήθειαν αὐτοῖς
  choice: им в помощь
  rationale: Кратко и естественно передаёт цель найма и сохраняет местоименное указание оригинала.
- source_word: παρεμβάλλουσιν
  choice: стояли лагерем
  rationale: Настоящее время описывает текущую военную обстановку; русское прошедшее согласуется с повествовательным контекстом и передаёт состояние лагеря.
- source_word: πέραν τοῦ χειμάρρου
  choice: по ту сторону потока
  rationale: χείμαρρος может означать бурный сезонный поток и его русло; «поток» сохраняет образ без заимствованного географического термина.
- source_word: ἕτοιμοι τοῦ ἐλθεῖν ἐπὶ σὲ εἰς πόλεμον
  choice: готовые выступить против тебя на войну
  rationale: Сохраняет движение, враждебную направленность и единственное число местоимения σέ.
- source_word: εἰς συνάντησιν αὐτῶν
  choice: им навстречу
  rationale: Естественная русская передача выхода для встречи или столкновения; военный характер понятен из контекста.
