  yaml_path: translation/deuterocanon/1_maccabees/005/033.yaml
  text: And he went out against them in three divisions from outside them[a]; and they sounded the trumpets and cried out in prayer.
translation:
  language: ru
  text: И он выступил против них тремя отрядами, с внешней стороны от них[a]; он протрубил в трубы[b], и они воззвали в молитве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «снаружи от них»; выражение указывает лишь на пространственное отношение и не уточняет, идёт ли речь о лагере, строе или иной занятой ими местности.'
    reason: Сохранение пространственной неоднозначности греческого выражения ἔξωθεν αὐτῶν без добавления в основной текст понятия «расположение».
  - marker: b
    text: 'В греческом здесь глагол стоит в единственном числе — «он протрубил», а далее следует множественное: «они воззвали».'
    reason: Грамматическая смена числа в источнике важна для проверки перевода и не должна быть молча сглажена.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: выступил против них
  rationale: В военном контексте глагол означает выход или выступление для сражения; дополнение «против них» естественно передаёт направленность действия, не превращая его в более конкретное «напал».
- source_word: ἐν τρισὶν ἀρχαῖς
  choice: тремя отрядами
  rationale: Здесь ἀρχαί, вероятнее всего, обозначает три организованные воинские части. «Отрядами» понятно современному читателю и не сводит выражение к трём начальникам.
- source_word: ἔξωθεν αὐτῶν
  choice: находясь вне их расположения
  rationale: Греческое выражение буквально указывает на положение «снаружи/вне их». Добавление «расположения» делает фразу естественной по-русски, но не уточняет без достаточных оснований, шла ли речь о лагере, фланге или тыле.
- source_word: ἐσάλπισεν ταῖς σάλπιγξιν
  choice: протрубил трубами
  rationale: Сохранено единственное число греческого глагола и множественное число существительного. «Протрубил» передаёт подачу военного сигнала несколько естественнее, чем буквальное «затрубил в трубы».
- source_word: ἐβόησαν
  choice: воззвали
  rationale: Глагол обозначает громкий крик или взывание. В сочетании с молитвой «воззвали» сохраняет и силу голоса, и религиозный характер действия.
- source_word: ἐν προσευχῇ
  choice: в молитве
  rationale: Прямое соответствие греческой предложной конструкции, обозначающей образ или сферу действия.
theological_decisions:
- issue: Следует ли явно передать военную направленность ἐξῆλθεν
  choice: выступил против них
  alternative: вышел
  rationale: Контекст сражения требует ясного указания на противостояние, однако перевод не усиливает действие до «напал».
- issue: Смена числа между ἐσάλπισεν и ἐβόησαν
  choice: протрубил… они воззвали
  alternative: протрубили… и воззвали
  rationale: 'В основном тексте сохранена грамматическая напряжённость источника: сначала стоит глагол единственного числа, затем — множественного. Возможное коллективное понимание не подменяет форму засвидетельствованного греческого текста.'
- issue: Пространственное значение ἔξωθεν αὐτῶν
  choice: вне их расположения
  alternative: позади них / с внешней стороны от них
  rationale: Греческая фраза допускает пространственную неоднозначность. Перевод не определяет её как тыл, фланг или конкретный лагерь.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Военная терминология ясна и не перегружена специальными словами; синтаксис сохраняет последовательность действий и заметную смену подлежащего в греческом тексте.
