  source_fidelity: Передача «выступил против них тремя отрядами» хорошо отражает военный контекст ἐξῆλθεν и ἐν τρισὶν ἀρχαῖς. Сингулярное «протрубил» и последующее множественное «они воззвали» точно сохраняют смену числа в греческом тексте. Однако «находясь вне их расположения» вводит отсутствующее в оригинале понятие «расположение» и несколько меняет синтаксическую связь ἔξωθεν αὐτῶν.
