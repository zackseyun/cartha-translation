  text: And he set out to go into the land of the foreigners[a], and he passed through Samaria.
translation:
  language: ru
  text: И он отправился в землю иноплеменников[a] и проходил через Самарию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «землю филистимлян», поскольку греческое слово ἀλλόφυλοι в библейском употреблении может служить традиционным обозначением филистимлян. В основном тексте сохранено более широкое значение, так как сам стих не уточняет, о каком народе идёт речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: отправился
  rationale: Аорист ἀπαίρω обозначает начало движения; «отправился» естественно передаёт этот смысл по-русски.
- source_word: τοῦ πορευθῆναι
  choice: в
  rationale: Артиклевый инфинитив выражает цель движения. В сочетании «отправился в землю» цель естественно передана русской конструкцией с предлогом направления без избыточного «чтобы пойти».
- source_word: γῆν ἀλλοφύλων
  choice: землю иноплеменников
  rationale: ἀλλόφυλοι буквально обозначает людей иного племени и в библейском греческом может служить традиционным названием филистимлян. Более широкое «иноплеменники» сохраняет формулировку данного стиха и не вводит более узкую идентификацию в основной текст.
- source_word: διεπορεύετο
  choice: прошёл через
  rationale: Глагол означает движение через область. Хотя греческий имперфект представляет действие в процессе, в русском повествовании совершенный вид естественно обозначает прохождение данного отрезка пути.
- source_word: τὴν Σαμάριαν
  choice: Самарию
  rationale: Общепринятая русская форма географического названия в винительном падеже после «через».
