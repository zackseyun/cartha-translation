  yaml_path: translation/deuterocanon/1_maccabees/005/003.yaml
  text: And Judas fought against the sons of Esau in Judea[a], in the Akrabattene region, because they were hemming in Israel. And he struck them with a great blow, and humbled them[b], and took their spoils.
translation:
  language: ru
  text: Иуда воевал с сынами Исава[a] в Иудее, в области Акрабаттина[b], потому что они окружали Израиль. Он нанёс им тяжёлое поражение, усмирил их и захватил их добычу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «потомками Исава»; вероятно, имеются в виду идумеи. В греческом тексте буквально: «сыны Исава».'
    reason: lexical_alternative
  - marker: b
    text: Акрабаттина — название области в Иудее. Сжатую греческую конструкцию можно также понять как «в Иудее, у Акрабаттины».
    reason: cultural_note
lexical_decisions:
- source_word: ἐπολέμει
  choice: воевал с
  rationale: Имперфект передаёт продолжавшиеся военные действия; русское «воевал с» естественно выражает значение конструкции с πρὸς.
- source_word: υἱοὺς Ἠσαῦ
  choice: сынами Исава
  rationale: Сохранено буквальное этногенеалогическое обозначение греческого текста; замена на «идумеями» была бы исторически вероятным, но интерпретирующим уточнением.
- source_word: ἐν τῇ Ἰουδαίᾳ τὴν Ἀκραβαττήνην
  choice: в Иудее, в области Акрабаттине
  rationale: Сжатая и несколько необычная греческая конструкция передана как указание региона внутри Иудеи, без чрезмерно жёсткого разрешения синтаксической неоднозначности.
- source_word: περικάθηντο
  choice: окружали
  rationale: Глагол обозначает расположение вокруг или враждебное окружение; «окружали» сохраняет образ и не предполагает непременно формальной осады города.
- source_word: τὸν Ἰσραήλ
  choice: Израиль
  rationale: Сохранено собирательное национальное наименование исходного текста.
- source_word: ἐπάταξεν αὐτοῖς πληγὴν μεγάλην
  choice: нанёс им тяжёлое поражение
  rationale: Греческая военная идиома буквально говорит о нанесении великого удара; выбран естественный современный русский эквивалент.
- source_word: συνέστειλεν αὐτούς
  choice: усмирил их
  rationale: В военном контексте глагол означает стеснить, подавить или подчинить; «усмирил» передаёт подавление сопротивления, не подразумевая полного уничтожения.
- source_word: τὰ σκῦλα αὐτῶν
  choice: их добычу
  rationale: Имеется в виду военная добыча, захваченная после победы.
