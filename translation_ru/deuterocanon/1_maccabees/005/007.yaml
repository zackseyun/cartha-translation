- source_word: συνῆψεν πρὸς αὐτοὺς πολέμους πολλούς
  choice: вступал с ними во многие сражения
  rationale: Идиома συνάπτειν πόλεμον означает вступать в бой или завязывать сражение; множественное число и πολλούς переданы естественным русским выражением.
- source_word: συνετρίβησαν πρὸ προσώπου αὐτοῦ
  choice: они были сокрушены перед ним
  rationale: Сохранены страдательная форма, образ сокрушения и буквальное пространственно-реляционное выражение πρὸ προσώπου αὐτοῦ, допускающее оттенок «под его натиском».
- source_word: ἐπάταξεν αὐτούς
  choice: он поразил их
  rationale: Глагол πατάσσω в военном контексте передан традиционным и достаточно широким «поразил», без необоснованного уточнения «убил» или «разгромил».
