  yaml_path: translation/deuterocanon/1_maccabees/005/002.yaml
  text: And they were plotting to remove the offspring of Jacob who were among them[b][a], and they began to kill and wipe out those among the people.
translation:
  language: ru
  text: И они замышляли устранить потомков Иакова, находившихся среди них[a], и начали убивать людей из этого народа и искоренять его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «род (или потомство) Иакова, находившийся среди них».'
    reason: Уточняет значение γένος и более буквальную форму причастного оборота.
  - marker: b
    text: 'Греческое выражение ἐν τῷ λαῷ сжато и допускает также локативное понимание: «начали убивать среди народа и искоренять».'
    reason: Сохраняет синтаксическую неоднозначность предложной группы и не приписывает ей однозначную связь с обоими глаголами.
lexical_decisions:
- source_word: ἐβουλεύοντο
  choice: замышляли
  rationale: Имперфект передаёт продолжавшийся замысел, а контекст указывает на враждебное намерение.
- source_word: ἆραι
  choice: истребить
  rationale: В сочетании с последующими θανατοῦν и ἐξαίρειν глагол означает устранение народа с явно смертоносной целью; «истребить» естественно передаёт общий замысел.
- source_word: τὸ γένος Ἰακώβ
  choice: потомков Иакова
  rationale: γένος обозначает род, происхождение или потомство; этот вариант сохраняет генеалогический смысл и избегает современных расовых оттенков.
- source_word: τοὺς ὄντας ἐν μέσῳ αὐτῶν
  choice: живших среди них
  rationale: Причастный оборот выделяет потомков Иакова, находившихся среди враждебных народов; добавление «живших» естественно по-русски и не меняет смысла.
- source_word: ἤρξαντο τοῦ θανατοῦν
  choice: начали убивать
  rationale: Конструкция обозначает начало действия, а θανατόω — умерщвление или предание смерти.
- source_word: ἐν τῷ λαῷ
  choice: народ
  rationale: Сжатая греческая конструкция допускает связь с действиями «убивать и искоренять»; основной текст передаёт объект как народ в целом, а неоднозначность отмечена в сноске.
- source_word: ἐξαίρειν
  choice: искоренять
  rationale: В данном насильственном контексте глагол выражает не простое удаление, а последовательное уничтожение; «искоренять» сохраняет усиление после «убивать».
theological_decisions:
- issue: Этническое и заветно-историческое обозначение τὸ γένος Ἰακώβ
  choice: потомков Иакова
  alternative: род Иакова; народ Иакова
  rationale: Перевод сохраняет указание на происхождение от Иакова и не привносит современных представлений о расе.
- issue: Нарастание смысла в ἆραι … θανατοῦν … ἐξαίρειν
  choice: истребить … убивать и искоренять
  alternative: устранить … предавать смерти и уничтожать
  rationale: Передана последовательность от замысла уничтожения к начавшемуся убийству и искоренению, без смягчения насилия.
- issue: Синтаксическая неоднозначность ἐν τῷ λαῷ
  choice: понимать как указание на народ, подвергаемый убийству и искоренению
  alternative: 'понимать локативно: «среди народа»'
  rationale: Греческая фраза сжата и допускает более одного синтаксического понимания, поэтому альтернативу следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Замышляли», «потомки» и «искоренять» понятны широкому читателю и сохраняют серьёзность текста; архаизмы и конфессионально окрашенные формулы не использованы.
