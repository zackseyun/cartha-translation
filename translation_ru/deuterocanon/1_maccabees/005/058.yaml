    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλαν
  choice: отдали приказ
  rationale: Глагол обозначает распоряжение или приказ; в военном контексте это естественная и точная русская формулировка.
- source_word: τοῖς ἀπὸ τῆς δυνάμεως τῆς μετʼ αὐτῶν
  choice: воинам из отряда, бывшего с ними
  rationale: δύναμις здесь означает военное подразделение или войско, а ἀπό сохраняет оттенок принадлежности к его составу. «Отряд» позволяет передать фразу естественно, не устраняя её партитивный смысл.
- source_word: ἐπορεύθησαν
  choice: выступили
  rationale: В повествовании о передвижении воинов «выступили» точнее и естественнее общего «пошли», не добавляя идеи строевого марша, прямо не выраженной глаголом.
- source_word: ἐπὶ Ἰαμνίαν
  choice: против Иамнии
  rationale: ἐπί с винительным при военном движении может обозначать направленность враждебного выступления. Этот вероятный смысл сохранён, а нейтральная пространственная трактовка отмечена в сноске.
- source_word: Ἰαμνίαν
  choice: Иамнии
  rationale: «Иамния» — традиционная и узнаваемая русская передача греческого названия города; падеж обусловлен предлогом «против».
