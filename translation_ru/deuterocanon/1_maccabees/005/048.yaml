base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/048.yaml
  text: And Judas sent them peaceful words[a], saying, “We will pass through your land to go to our own land, and no one will harm you; we will only pass through on foot.” But they were not willing to open to him.
translation:
  language: ru
  text: 'Иуда послал им мирные предложения, сказав: «Мы пройдём через вашу землю, чтобы добраться до нашей земли. Никто не причинит вам вреда; мы лишь пройдём пешком». Но они не захотели открыть ему[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте не сказано прямо, что именно они не захотели открыть; вероятно, имеются в виду ворота. Тем самым они отказали Иуде во входе и проходе.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν πρὸς αὐτοὺς Ἰούδας λόγους εἰρηνικούς
  choice: Иуда отправил к ним послание с мирными словами
  rationale: Оборот сохраняет образ «мирных слов» и дипломатический характер обращения, но вводит естественное для русского языка «послание», подразумеваемое глаголом отправления.
- source_word: Διελευσόμεθα εἰς τὴν γῆν σου
  choice: Мы пройдём через вашу землю
  rationale: Будущая форма διέρχομαι обозначает намерение пересечь территорию. Местоимение передано во множественном числе по адресату и последующему ὑμᾶς.
- source_word: τοῦ ἀπελθεῖν εἰς τὴν γῆν ἡμῶν
  choice: чтобы уйти в нашу землю
  rationale: Артиклевый инфинитив выражает цель. Перевод не добавляет прямо не выраженного в греческом значения «вернуться».
- source_word: οὐδεὶς κακοποιήσει ὑμᾶς
  choice: Никто не причинит вам вреда
  rationale: κακοποιέω в военно-дипломатическом контексте естественно означает причинение вреда или дурное обращение.
- source_word: πλὴν τοῖς ποσὶν παρελευσόμεθα
  choice: мы лишь пройдём пешком
  rationale: Переданы и ограничительное πλὴν, и образ прохождения «ногами»; формулировка подчёркивает мирный транзит и не превращает её в специальное противопоставление коннице.
- source_word: οὐκ ἠβούλοντο ἀνοῖξαι αὐτῷ
  choice: они не захотели открыть ему
  rationale: 'Сохранено не названное в греческом дополнение при «открыть»: речь может идти о воротах, городе либо доступе для прохода.'
