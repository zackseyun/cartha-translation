lexical_decisions:
- source_word: διεπέρασεν
  choice: переправился
  rationale: Глагол обозначает переход или переправу с одной стороны на другую; русский глагол сохраняет пространственный образ, не уточняя местность.
- source_word: πρὸς αὐτοὺς
  choice: к ним
  rationale: Предлог с винительным падежом выражает движение к кому-либо, но в военном контексте может подразумевать выступление против них; основное направление сохранено в тексте, а альтернатива отмечена в сноске.
- source_word: πρότερον
  choice: первым
  rationale: Наречие указывает, что он переправился раньше остальных или впереди них; «первым» естественно передаёт это значение.
- source_word: πᾶς ὁ λαὸς αὐτοῦ
  choice: весь его народ
  rationale: Буквально сохранено значение λαός — «народ»; военный контекст показывает, что здесь имеются в виду сопровождавшие его силы, но перевод не сужает смысл до «войска».
- source_word: ἔμπροσθεν αὐτοῦ
  choice: шёл впереди него
  rationale: Пространственное выражение передано естественной русской конструкцией; глагол «шёл» добавлен для связности без изменения смысла.
- source_word: συνετρίβησαν
  choice: были сокрушены
  rationale: Страдательная форма и образ решительного разгрома сохранены посредством «были сокрушены».
- source_word: πάντα τὰ ἔθνη
  choice: все языческие народы
  rationale: В повествовательном контексте 1 Маккавейской ἔθνη обозначает окружающие неиудейские народы; «языческие народы» передаёт это различие яснее, чем буквальное «народы».
- source_word: ἔρριψαν πάντα τὰ ὅπλα αὐτῶν
  choice: побросали всё своё оружие
  rationale: Разговорно нейтральный совершенный глагол «побросали» естественно изображает массовое оставление оружия при бегстве.
- source_word: τέμενος
  choice: святилище
  rationale: Слово обозначает освящённое место или храмовую ограду; «святилище» сохраняет религиозный характер места, не утверждая точный тип сооружения.
- source_word: Καρναΐν
  choice: Карнаине
  rationale: Название передано русской транслитерацией греческой формы Καρναΐν и склонено после предлога «в».
