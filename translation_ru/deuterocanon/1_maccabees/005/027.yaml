  text: And in the other cities of Gilead they are shut in[a]; tomorrow they will encamp against the strongholds, capture them[c][b], and destroy all of them in a single day.
translation:
  language: ru
  text: А в остальных городах Галаада они окружены[a]. Завтра враги намерены расположиться станом против укреплений, захватить их и истребить всех до одного за один день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заперты» либо «взяты в кольцо». Греческое слово описывает людей, окружённых и лишённых возможности выйти, но не обязательно обозначает осаду как специальный военный термин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπαῖς πόλεσιν
  choice: в остальных городах
  rationale: Передаёт значение «оставшиеся, прочие» и естественно связывает эти города с ранее названными.
- source_word: τῆς Γαλααδίτιδος
  choice: Галаада
  rationale: Общепринятое русское географическое название области; родительный падеж естественно передаёт греческое определение.
- source_word: συνειλημμένοι
  choice: окружены
  rationale: Перфектное страдательное причастие описывает текущее состояние людей, замкнутых в кольце враждебных сил; слово не требует уточнять формальную осаду.
- source_word: εἰς αὔριον
  choice: завтра
  rationale: Прямое и естественное временное обозначение.
- source_word: πάσονται
  choice: намерены
  rationale: Редкая форма в данном контексте выражает предстоящее намерение; русский оборот сохраняет оттенок запланированного близкого действия, а не только простого будущего.
- source_word: παρεμβαλεῖν ἐπὶ
  choice: расположиться станом против
  rationale: Сохраняет военный образ постановки лагеря против укреплённых мест, не сводя его заранее к нападению или осаде.
- source_word: τὰ ὀχυρώματα
  choice: укрепления
  rationale: Нейтрально и точно обозначает укреплённые места; по контексту это те места, где укрываются осаждённые.
- source_word: καταλαβέσθαι
  choice: захватить
  rationale: Передаёт овладение укреплёнными местами в последовательности военных действий.
- source_word: ἐξᾶραι
  choice: истребить
  rationale: При личном дополнении ἅπαντας αὐτούς и в военном контексте глагол означает полное устранение через уничтожение.
- source_word: ἅπαντας αὐτοὺς
  choice: всех до одного
  rationale: Естественно передаёт усиленную всеохватность ἅπαντας.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: за один день
  rationale: Подчёркивает намерение совершить всё действие в пределах одного дня.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский с достоинством историко-военного повествования. Явное «враги» добавлено для ясности при смене подразумеваемого субъекта: окружены иудеи, а расположиться станом, захватить и истребить намерены их противники. Сохранён буквальный военный образ постановки стана.'
