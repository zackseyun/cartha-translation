lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: собрались
  rationale: Передаёт совместное и в данном контексте враждебное выступление группы естественным русским глаголом.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: Прямо передаёт окружающие неизраильские народы, не привнося новозаветных оттенков слова «язычники».
- source_word: τὰ ἐν τῇ Γαλααδίτιδι
  choice: жившие в Галааде
  rationale: Контекстуально раскрывает субстантивированное определение и естественно обозначает народы данной области.
- source_word: ἐπὶ τὸν Ἰσραὴλ
  choice: против израильтян
  rationale: Следующее причастное определение указывает на людей; множественное «израильтян» ясно и естественно передаёт собирательное «Израиль».
- source_word: τοὺς ὄντας ἐπὶ τοῖς ὁρίοις αὐτῶν
  choice: находившихся в их пределах
  rationale: ἐπὶ τοῖς ὁρίοις допускает пограничный оттенок, но здесь может обозначать пребывание на территории этих народов; «в их пределах» сохраняет территориальную отнесённость без излишней конкретизации.
- source_word: τοῦ ἐξᾶραι αὐτούς
  choice: чтобы истребить их
  rationale: Передаёт целевое значение и намерение полностью устранить или уничтожить израильтян; лексическая широта отмечена в сноске.
- source_word: ἔφυγον
  choice: те бежали
  rationale: «Те» устраняет возможную для русского текста двусмысленность подлежащего после упоминания двух групп, не меняя референта.
- source_word: Δάθεμα
  choice: Датему
  rationale: Русская транслитерация топонима Δάθεμα с требуемым винительным падежом после «в» при обозначении движения.
- source_word: τὸ ὀχύρωμα
  choice: крепость
  rationale: Краткое и естественное обозначение укреплённого оборонительного места.
