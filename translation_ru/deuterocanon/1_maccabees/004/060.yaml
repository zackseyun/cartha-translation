base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/060.yaml
  text: And at that time they built up Mount Zion with high walls all around and strong towers[a], lest the nations come and trample it, as they had done before.
translation:
  language: ru
  text: В то время они возвели вокруг горы Сион высокие стены и крепкие башни, чтобы народы[a], придя, не попрали их[b], как сделали прежде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «язычники». Греческое τὰ ἔθνη может означать как «народы», так и «язычников», то есть неиудейские народы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально местоимение стоит во множественном числе и может относиться к укреплениям; по смыслу возможно также: «не попрали её», то есть гору Сион как укреплённое место.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: возвели
  rationale: Глагол буквально обозначает строительство. В русском предложении он естественно сочетается с прямо названными стенами и башнями и сохраняет оборонительный смысл контекста без замены на более толковательное «укрепили».
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: в то время
  rationale: Естественная современная передача обычного временного оборота.
- source_word: τὸ ὄρος Σιὼν
  choice: гора Сион
  rationale: Традиционная и ясная русская форма географического названия.
- source_word: κυκλόθεν
  choice: вокруг
  rationale: Передаёт окружение горы оборонительными сооружениями со всех сторон.
- source_word: τείχη ὑψηλὰ
  choice: высокие стены
  rationale: Прямая и идиоматичная передача обозначения укреплений.
- source_word: πύργους ἰσχυρούς
  choice: крепкие башни
  rationale: Сохраняет акцент ἰσχυρούς на прочности и оборонительной силе башен.
- source_word: μή ποτε
  choice: чтобы … не
  rationale: Естественно выражает в русском языке цель-предостережение, не прибегая к архаичному обороту.
- source_word: παραγενηθέντα τὰ ἔθνη
  choice: народы, придя
  rationale: Сохраняет и значение прибытия, выраженное причастием, и основное значение τὰ ἔθνη; возможный контекстуальный перевод «язычники» дан в сноске.
- source_word: καταπατήσωσιν
  choice: попрали
  rationale: «Попрать» точно передаёт образ физического и враждебного попирания; слово литературно и понятно в историко-библейском повествовании.
- source_word: αὐτά
  choice: их
  rationale: Сохраняется формальное множественное число греческого местоимения, которое естественно соотносится с только что названными стенами и башнями; возможное понимание укреплённого места как целого отмечено в сноске.
- source_word: ὡς ἐποίησαν τὸ πρότερον
  choice: как сделали прежде
  rationale: Кратко и точно сохраняет отсылку к прежним действиям враждебных народов.
theological_decisions:
- issue: Значение τὰ ἔθνη в историческом контексте
  choice: народы
  alternative: язычники
  rationale: «Народы» ближе к основному значению греческого выражения и не превращает его без необходимости в позднейший богословский термин; в данном контексте речь, однако, идёт о неиудейских народах, поэтому «язычники» остаётся допустимой альтернативой.
- issue: Референт местоимения αὐτά
  choice: их — стены и башни либо укрепления в совокупности
  alternative: её — гору Сион как укреплённое место
  rationale: Греческое местоимение имеет множественное число, тогда как «гора» стоит в единственном. Основной текст сохраняет эту грамматическую особенность, а сноска отмечает контекстуально возможное собирательное понимание всего укреплённого места.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис греческой фразы перестроен естественным для русского образом: стены и башни сделаны прямыми дополнениями к «возвели», при этом строительство вокруг горы и оборонительная цель полностью сохранены.'
