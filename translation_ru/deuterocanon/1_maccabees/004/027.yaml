  source_fidelity: 'Первая часть передана точно: «пришёл в смятение» и «пал духом» хорошо различают συνεχύθη и ἤθυμει. «С Израилем произошло не то, чего он хотел» верно передаёт противопоставление желаемого и действительного. В заключении греческое οὐχ οἷα ἐνετείλατο αὐτῷ ὁ βασιλεὺς ἐξέβη означает, что исход оказался не таким, как приказал ему царь; это лучше выразить через «вышло не так», а не через «повеление ... не исполнилось».'
