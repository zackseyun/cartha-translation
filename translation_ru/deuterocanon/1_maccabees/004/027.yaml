  yaml_path: translation/deuterocanon/1_maccabees/004/027.yaml
  text: But when he heard all this[a], he was confounded and lost heart, because what had happened to Israel was not what he wanted, and what the king had commanded him had not come about.
translation:
  language: ru
  text: Но, услышав обо всём этом, он пришёл в смятение и пал духом, потому что с Израилем произошло не то, чего он хотел, и вышло не так, как повелел ему царь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεχύθη
  choice: пришёл в смятение
  rationale: Пассивная форма передаёт сильное внутреннее замешательство и потрясение; выражение естественно для современного литературного русского языка.
- source_word: ἤθυμει
  choice: пал духом
  rationale: Глагол обозначает подавленность и утрату мужества; русское выражение кратко и идиоматично передаёт это состояние.
- source_word: οὐχ οἷα ἤθελεν
  choice: не то, чего он хотел
  rationale: Сохраняет прямое противопоставление желаемого действительному, не уточняя, шла ли речь о желании, намерении или ожидании.
- source_word: γέγονεν τῷ Ἰσραήλ
  choice: с Израилем произошло
  rationale: Естественно передаёт события, затронувшие Израиль, и результативный оттенок перфекта.
- source_word: ἐνετείλατο αὐτῷ ὁ βασιλεὺς
  choice: повеление царя, данное ему
  rationale: Существительное «повеление» сохраняет властный характер царского распоряжения, а оборот ясно обозначает адресата.
- source_word: ἐξέβη
  choice: не исполнилось
  rationale: В контексте царского повеления обозначает, что предписанный результат не осуществился; перевод не приписывает субъекту дополнительной вины или неспособности.
