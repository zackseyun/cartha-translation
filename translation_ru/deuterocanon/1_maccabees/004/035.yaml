base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/035.yaml
  text: But when Lysias saw the rout that had happened to his own force[a], and the boldness that had arisen in Judas’s men, and how they were ready either to live or to die nobly, he departed for Antioch, and recruited foreign troops, intending, after becoming stronger in number[b], to come again into Judea.
translation:
  language: ru
  text: Увидев же, что его войско обращено в бегство, и какой отвагой исполнились люди Иуды[a], готовые либо жить, либо доблестно умереть, Лисий ушёл в Антиохию. Там он стал набирать иноземных воинов[b], намереваясь увеличить численность своего войска и снова прийти в Иудею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отвага Иуды». Из следующей фразы, где употреблено множественное число — «готовые», — видно, что речь идёт о людях Иуды.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «набирать наёмников». Греческий глагол указывает прежде всего на набор чужеземцев; что это были именно наёмные воины, прямо не сказано.'
    reason: alternative_reading
lexical_decisions:
- source_word: τροπή
  choice: обращено в бегство
  rationale: В военном контексте слово обозначает не просто поражение, а разгром и бегство войска.
- source_word: σύνταξις
  choice: войско
  rationale: Хотя слово может означать боевой строй или построение, здесь по-русски естественнее передать его как войско, потерпевшее разгром.
- source_word: θάρσος
  choice: отвага
  rationale: Передаёт возникшие после победы мужество и решимость сторонников Иуды.
- source_word: ἕτοιμοι εἶεν ἢ ζῆν ἢ τεθνάναι γενναίως
  choice: готовые либо жить, либо доблестно умереть
  rationale: Сохранена уравновешенная конструкция с двумя инфинитивами; γενναίως передано словом «доблестно», сохраняющим оттенок мужества и чести.
- source_word: ἐξενολόγει
  choice: стал набирать иноземных воинов
  rationale: Глагол непосредственно указывает на набор чужеземцев; значение «наёмники» возможно, но подразумевает оплату, не выраженную явно.
- source_word: πλεοναστὸν πάλιν γενηθέντα
  choice: намереваясь увеличить численность своего войска
  rationale: Фраза выражает намерение вернуться с более многочисленными силами; подразумеваемое войско названо для ясности по-русски.
- source_word: παραγίνεσθαι εἰς τὴν Ἰουδαίαν
  choice: снова прийти в Иудею
  rationale: Сохраняет направленность движения и смысл нового похода в Иудею.
