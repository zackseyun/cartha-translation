  text: And they offered sacrifice according to the law on the new altar of burnt offering that they had made[a].
translation:
  language: ru
  text: И принесли они жертву по Закону на новом жертвеннике всесожжений, который они соорудили.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на новом жертвеннике для всесожжений, который они соорудили».'
    reason: 'Лексико-синтаксическая альтернатива: родительный τῶν ὁλοκαυτωμάτων можно передать как назначение жертвенника.'
lexical_decisions:
- source_word: ἀνήνεγκαν
  choice: принесли
  rationale: В жертвенном контексте ἀναφέρω означает «приносить в жертву»; в сочетании с «жертву» русский глагол естественно передаёт культовый смысл.
- source_word: θυσίαν
  choice: жертву
  rationale: Слово обозначает жертву или жертвоприношение; «жертву» сохраняет конкретную культовую лексику оригинала.
- source_word: κατὰ τὸν νόμον
  choice: по Закону
  rationale: Оборот указывает на соответствие предписаниям Закона; прописная буква ясно передаёт отсылку к Моисееву Закону.
- source_word: θυσιαστήριον τῶν ὁλοκαυτωμάτων
  choice: жертвеннике всесожжений
  rationale: Устойчивое библейское выражение, обозначающее жертвенник, предназначенный для всесожжений; множественное число непосредственно отражает греческий родительный множественного числа.
- source_word: τὸ καινόν
  choice: новом
  rationale: Передаёт простое противопоставление нового жертвенника прежнему, осквернённому, не добавляя отсутствующих в тексте деталей.
- source_word: ὃ ἐποίησαν
  choice: который они соорудили
  rationale: В данном контексте ποιέω означает изготовление или возведение жертвенника; «соорудили» естественнее и точнее конкретизирует подразумеваемое действие, не выходя за рамки контекста.
theological_decisions:
- issue: Культовая терминология храмового богослужения
  choice: Сохранить прямые выражения «принесли жертву» и «жертвенник всесожжений».
  alternative: Обобщить как «совершили приношение» или просто «на жертвеннике».
  rationale: Стих говорит именно о восстановлении законного храмового жертвоприношения; обобщённая лексика ослабила бы культовый и правовой акцент.
- issue: Значение определённого выражения τὸν νόμον
  choice: «по Закону» с прописной буквы.
  alternative: «по закону» со строчной буквы.
  rationale: Контекст указывает на конкретный священный Закон, регулирующий жертвоприношения; прописная буква передаёт эту референцию, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской культовой лексикой. Порядок слов сделан естественным для русского, при этом сохранены последовательность событий и явная ссылка на Закон.
