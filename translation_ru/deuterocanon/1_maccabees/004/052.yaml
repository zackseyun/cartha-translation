lexical_decisions:
- source_word: ὤρθρισαν
  choice: встали рано
  rationale: Глагол обозначает ранний подъём или действие на рассвете; этот перевод сохраняет временной акцент и не добавляет отсутствующих в тексте подробностей.
- source_word: τὸ πρωὶ
  choice: утром
  rationale: Выражение уточняет время и вместе с «встали рано» передаёт лёгкую избыточность греческой формулировки естественным русским языком.
- source_word: τῇ πέμπτῃ καὶ εἰκάδι
  choice: в двадцать пятый день
  rationale: Стандартная передача греческого обозначения двадцать пятого дня месяца.
- source_word: τοῦ μηνὸς τοῦ ἐνάτου
  choice: девятого месяца
  rationale: Прямая и естественная передача родительного оборота в составе даты.
- source_word: Χασελεὺ
  choice: кислев
  rationale: Устоявшаяся в современном русском языке форма названия еврейского месяца; греческая форма — Χασελεύ.
- source_word: τοῦ ὀγδόου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ ἔτους
  choice: в сто сорок восьмом году
  rationale: Естественная русская форма датировки, точно передающая порядковое числительное греческого текста.
theological_decisions:
- issue: Отсчёт года
  choice: В основном тексте указано только «в сто сорок восьмом году».
  alternative: «В сто сорок восьмом году эры Селевкидов».
  rationale: Греческий текст не называет эру прямо; её историческое отождествление вынесено в примечание, чтобы не добавлять контекстуальное уточнение в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Союз «И» сохранён как средство связности рассказа; лёгкая временная избыточность «встали рано утром» отражает сочетание ὤρθρισαν и τὸ πρωὶ. Название месяца дано со строчной буквы по нормам русского языка.
