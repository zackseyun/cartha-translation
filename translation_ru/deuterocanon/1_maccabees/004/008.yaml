  text: And Judas said to the men with him[a], “Do not fear their multitude[b], and do not be terrified by their attack.”
translation:
  language: ru
  text: 'Иуда сказал людям, бывшим с ним: «Не бойтесь их многочисленности и не падайте духом[b] перед их натиском[a]».'
  philosophy: optimal-equivalence
  footnotes:
