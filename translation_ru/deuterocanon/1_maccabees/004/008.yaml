lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: Не бойтесь
  rationale: Прямой запрет точно передаёт повелительную форму φοβέομαι и естественно звучит по-русски.
- source_word: τὸ πλῆθος αὐτῶν
  choice: их многочисленности
  rationale: πλῆθος здесь указывает на численное превосходство противника; «многочисленность» сохраняет этот смысл, не превращая войско в неопределённую «толпу».
- source_word: τὸ ὅρμημα αὐτῶν
  choice: перед их натиском
  rationale: ὅρμημα обозначает стремительный напор, наступление или атаку. «Натиск» естественно передаёт динамику военного контекста; предлог «перед» необходим для нормативного русского управления при выражении «падать духом».
- source_word: μὴ δειλωθῆτε
  choice: не падайте духом
  rationale: Форма от δειλόω выражает утрату мужества под воздействием угрозы. «Не падайте духом» сохраняет отличие от предыдущего «не бойтесь» и не вносит осуждающего оттенка слова «трусить».
- source_word: τοῖς ἀνδράσιν τοῖς μετʼ αὐτοῦ
  choice: людям, бывшим с ним
  rationale: Передаёт значение ἀνδράσιν и уточняющего оборота «бывшим с ним», не добавляя отсутствующего в самой фразе обозначения их как воинов.
