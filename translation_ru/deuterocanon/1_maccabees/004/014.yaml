lexical_decisions:
- source_word: συνῆψαν
  choice: вступили они в бой
  rationale: В военном контексте συνάπτω означает вступить в сражение; явное дополнение «в бой» естественно передаёт подразумеваемый греческим глаголом смысл.
- source_word: συνετρίβησαν
  choice: были сокрушены
  rationale: Страдательная форма συντρίβω передаёт образ полного слома или разгрома; «были сокрушены» сохраняет выразительность оригинала лучше, чем нейтральное «были побеждены».
- source_word: τὰ ἔθνη
  choice: народы
  rationale: Это прямое соответствие греческому выражению, сохраняющее его широту и не сводящее обозначение безусловно к одному толкованию.
- source_word: τὸ πεδίον
  choice: равнину
  rationale: πεδίον обозначает ровную открытую местность; «равнина» точно и естественно передаёт этот географический смысл.
theological_decisions:
- issue: Значение τὰ ἔθνη в данном контексте
  choice: народы
  alternative: язычники
  rationale: Основной текст сохраняет буквальную этнополитическую формулировку и её неоднозначность; контекстуально возможное значение «язычники» отмечено в сноске, а не внесено как однозначное толкование.
translation_notes:
  register: Современный литературный русский язык; повествование краткое, торжественное и динамичное. Сохранены последовательность греческих предложений и яркий страдательный образ «были сокрушены».
