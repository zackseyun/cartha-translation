lexical_decisions:
- source_word: ἔφυγον
  choice: бежали
  rationale: Аорист φεύγω обозначает бегство от опасности; «бежали» естественно и кратко передаёт военное отступление.
- source_word: πάντες
  choice: все они
  rationale: Субстантивированное πάντες подчёркивает полноту группы; «все они» ясно и естественно передаёт это значение по-русски.
- source_word: γῆν
  choice: землю
  rationale: В данном военно-географическом контексте γῆ означает землю или область; «землю» сохраняет простоту и не добавляет лишней конкретизации.
- source_word: ἀλλοφύλων
  choice: иноплеменников
  rationale: ἀλλόφυλος буквально обозначает принадлежащего к иному народу или племени. «Иноплеменники» сохраняет эту смысловую широту и не отождествляет их без достаточных оснований исключительно с филистимлянами.
