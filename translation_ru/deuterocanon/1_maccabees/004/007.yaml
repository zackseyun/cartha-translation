    reason: Передаёт лексический вариант ἐθνῶν и поясняет необычное для русского буквальное согласование τεθωρακισμένην с «лагерем».
lexical_decisions:
- source_word: παρεμβολὴν
  choice: лагерь
  rationale: Слово обозначает военный лагерь; это краткий и естественный русский эквивалент.
- source_word: ἐθνῶν
  choice: язычников
  rationale: В контексте 1 Маккавейской книги речь идёт о нееврейских народах, противостоящих Иуде; «язычников» естественно передаёт это значение в русском библейском повествовании.
- source_word: ἰσχυρὰν
  choice: сильный
  rationale: Передаёт военную мощь и грозный характер лагеря без добавления отсутствующего в тексте прямого указания на укрепления.
- source_word: τεθωρακισμένην
  choice: воины были в доспехах
  rationale: Греческое причастие буквально характеризует лагерь как «облачённый в доспехи», метонимически указывая на находившееся в нём войско. Развёрнутая формулировка сохраняет образ доспехов и звучит естественно по-русски.
- source_word: ἵππον
  choice: конница
  rationale: Единственное число употреблено собирательно и в военном контексте обозначает конные силы.
- source_word: κυκλοῦσαν
  choice: окружала
  rationale: Передаёт расположение конницы вокруг лагеря ясно и без излишнего усиления.
- source_word: οὗτοι διδακτοὶ πολέμου
  choice: всадники были обучены военному делу
  rationale: Мужское множественное οὗτοι по смыслу указывает на людей, составлявших конницу; выражение подчёркивает их военную подготовку, а не просто боевой опыт.
