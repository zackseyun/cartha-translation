  text: And Gorgias came to the camp of Judas by night, and found no one; and he was looking for them in the mountains, because he said, “These men are fleeing from us.”
translation:
  language: ru
  text: 'И пришёл Горгий ночью в лагерь Иуды и никого не нашёл. Он искал их в горах, потому что сказал: «Они бегут от нас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολή
  choice: лагерь
  rationale: В данном военном контексте слово обозначает место расположения войска; «лагерь» естественно и точно передаёт смысл.
- source_word: ἐζήτει
  choice: искал
  rationale: Имперфект указывает на продолжавшееся действие; русское «искал» передаёт его без ненужного утяжеления.
- source_word: ἐν τοῖς ὄρεσιν
  choice: в горах
  rationale: Прямое и естественное соответствие греческому выражению.
- source_word: Φεύγουσιν
  choice: бегут
  rationale: Настоящее время сохранено в прямой речи; по контексту речь идёт о бегстве от противника.
