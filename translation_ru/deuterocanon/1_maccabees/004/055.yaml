  text: And all the people fell on their faces[b][a], and they worshiped and blessed toward heaven the one who had prospered them.
translation:
  language: ru
  text: И весь народ пал ниц, поклонился и благословил к небу того, кто даровал им успех[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благословил к небу»; греческое выражение может обозначать направленность благословения или служить благоговейным косвенным указанием на Бога, пребывающего на небесах. Или: «того, кто сделал их путь успешным».'
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: ἔπεσον ... ἐπὶ πρόσωπον
  choice: пал ниц
  rationale: Устойчивое современное русское выражение точно передаёт телесное простирание в знак поклонения; единственное число согласуется с собирательным «народ».
- source_word: πᾶς ὁ λαός
  choice: весь народ
  rationale: Естественная передача собирательного выражения без излишнего политического оттенка слова «нация».
- source_word: προσεκύνησαν
  choice: поклонились
  rationale: В культовом контексте глагол означает благоговейное поклонение; русский глагол сохраняет как телесный, так и религиозный смысл.
- source_word: ηὐλόγησαν
  choice: благословили
  rationale: Сохраняет прямое значение греческого глагола и допустимую библейскую конструкцию, в которой люди благословляют Бога, то есть прославляют Его.
- source_word: εἰς οὐρανόν
  choice: обратившись к небу
  rationale: Передаёт направленность действия, выраженную εἰς, и одновременно сохраняет возможное косвенное указание на Бога небес.
- source_word: τὸν εὐοδώσαντα αὐτούς
  choice: Того, кто даровал им успех
  rationale: Причастная конструкция косвенно обозначает Бога. «Даровал им успех» естественно передаёт каузативный смысл εὐοδόω и лучше звучит по-русски, чем буквальное «сделал их успешными».
theological_decisions:
- issue: Кого обозначает «Тот, кто даровал им успех»
  choice: Сохранено косвенное указание на Бога без добавления имени «Бог»
  alternative: «Бога, даровавшего им успех»
  rationale: Греческий текст использует субстантивированное причастие и не называет Бога прямо; перевод сохраняет эту благоговейную перифразу.
- issue: Функция выражения εἰς οὐρανόν
  choice: Направление поклонения и благословения — «обратившись к небу»
  alternative: «небо» как благоговейное обозначение Бога
  rationale: Греческая конструкция допускает как пространственную направленность, так и косвенную отсылку к Богу; основной текст не исключает ни одного оттенка.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Пал ниц» и «благословили» сохраняют достоинство и культовый характер сцены; местоимение «Того» написано с прописной буквы как прозрачное указание на Бога, не добавляя Его имени в текст.
