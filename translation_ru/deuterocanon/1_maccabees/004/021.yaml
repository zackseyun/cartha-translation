lexical_decisions:
- source_word: συνιδόντες
  choice: увидев / когда увидели
  rationale: Причастие συνοράω здесь обозначает восприятие увиденного; временная передача естественна по-русски и не усиливает значение до «осознали».
- source_word: ἐδειλώθησαν σφόδρα
  choice: сильно испугались
  rationale: Глагол передаёт сильный страх и утрату мужества, а σφόδρα усиливает его; выбранная формулировка ясна и естественна в современном русском языке.
- source_word: παρεμβολή
  choice: лагерь
  rationale: В данном военном контексте слово обозначает лагерь или стан; «лагерь» — современное и точное соответствие, сохраняющее образ исходного текста.
- source_word: ἐν τῷ πεδίῳ
  choice: на равнине
  rationale: πεδίον обозначает ровную открытую местность; по-русски местонахождение естественно выражается сочетанием «на равнине».
- source_word: ἑτοίμην εἰς παράταξιν
  choice: готовый к сражению
  rationale: Фраза означает готовность к боевому построению. В основном тексте смысл передан естественно, а специальный военный оттенок παράταξις отмечен в сноске.
