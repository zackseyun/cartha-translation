  yaml_path: translation/deuterocanon/1_maccabees/004/048.yaml
  text: And they rebuilt the sanctuary and the interior of the house[b][a], and they consecrated the courts.
translation:
  language: ru
  text: Они восстановили святилище[a] и внутренние помещения храма[b], а дворы освятили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святое место»; греческое выражение может обозначать священную часть храма.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дома»; здесь имеется в виду здание храма.'
    reason: cultural_note
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: восстановили
  rationale: Глагол буквально означает «построили», но в контексте ремонта и повторного освящения осквернённого храма речь идёт о восстановительных строительных работах.
- source_word: τὰ ἅγια
  choice: святилище
  rationale: В храмовом контексте форма среднего рода множественного числа обозначает священное пространство; «святилище» естественно передаёт это значение, не превращая выражение в указание на священные предметы.
- source_word: τὰ ἐντὸς τοῦ οἴκου
  choice: внутренние помещения храма
  rationale: Субстантивированное τὰ ἐντός пространственно указывает на то, что находится внутри здания. Русское «внутренние помещения» конкретно и естественно в перечне восстановленных частей храмового комплекса.
- source_word: οἴκου
  choice: храма
  rationale: Буквально οἶκος — «дом», однако здесь это устойчивое обозначение храмового здания. В современном русском «храм» сразу проясняет референт; буквальная образность отмечена в сноске.
- source_word: τὰς αὐλάς
  choice: дворы
  rationale: В контексте храмовой архитектуры αὐλαί — храмовые дворы; «дворы» является точным и привычным русским термином.
- source_word: ἡγίασαν
  choice: освятили
  rationale: Глагол означает ритуально отделить как святое; «освятили» точно и естественно передаёт это действие по-русски.
theological_decisions:
- issue: Обозначение священного пространства храма
  choice: Передать τὰ ἅγια словом «святилище» и отличить его от внутренних помещений храмового здания.
  alternative: «святое место» или, менее вероятно в данном контексте, «святыни»
  rationale: Последовательность архитектурных обозначений — святилище, внутреннее пространство здания и дворы — указывает на части храмового комплекса. При этом сноска сохраняет допустимую лексическую неоднозначность τὰ ἅγια.
- issue: Передача храмового наименования οἶκος
  choice: В основном тексте употребить «храм».
  alternative: Сохранить буквальное «дом»
  rationale: В данном контексте референтом несомненно является храмовое здание. «Храм» обеспечивает ясность для современного читателя, а буквальное значение и библейская метафора дома сохраняются в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной храмовой терминологией. Синтаксис сохраняет краткость и последовательность греческого текста; союз «а» естественно выделяет освящение дворов как отдельное действие.
