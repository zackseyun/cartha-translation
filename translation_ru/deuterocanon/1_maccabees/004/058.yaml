  yaml_path: translation/deuterocanon/1_maccabees/004/058.yaml
  text: And there was very great rejoicing among the people[a], and the reproach of the nations was turned away.
translation:
  language: ru
  text: И была в народе великая, чрезвычайная радость, и поношение со стороны народов было устранено.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поношение язычников»; досл.: «поношение народов».'
    reason: Лексический вариант для ἐθνῶν и краткая передача греческого родительного, который в контексте может обозначать поношение, исходящее от окружающих народов.
lexical_decisions:
- source_word: ἐγενήθη
  choice: была
  rationale: Естественная русская передача повествовательной формулы без добавления не названного в тексте деятеля.
- source_word: εὐφροσύνη μεγάλη ... σφόδρα
  choice: чрезвычайно великая радость
  rationale: Сохраняет значение общей праздничной радости и двойное усиление μεγάλη и σφόδρα.
- source_word: ἐν τῷ λαῷ
  choice: в народе
  rationale: Естественно обозначает радость, охватившую народ как общность.
- source_word: ἀπεστράφη
  choice: было отвращено
  rationale: Сохраняет пассивную конструкцию и образ устранённого, отведённого поношения, не называя деятеля.
- source_word: ὀνειδὸς
  choice: поношение
  rationale: Передаёт публичный позор и укор со стороны других, сохраняя библейский регистр.
- source_word: ἐθνῶν
  choice: от народов
  rationale: В данном контексте родительный может указывать на источник поношения; «народы» остаётся буквальным и менее конфессионально окрашенным, чем «язычники».
theological_decisions:
- issue: Соотношение «народа» и «народов»
  choice: «народ» обозначает Израиль/Иудею, а «народы» — окружающие неиудейские народы, но это различие не поясняется внутри стиха
  alternative: Явно перевести «язычники» или понимать оба слова обобщённо
  rationale: Исторический контекст поддерживает противопоставление, однако формулировка оригинала сохраняется без внесения дополнительного конфессионального толкования.
- issue: Смысл родительного ἐθνῶν
  choice: поношение, исходившее от народов
  alternative: поношение народов, то есть позор, лежавший на них или связанный с ними
  rationale: Контекст восстановления иудейского богослужения естественно указывает на устранение позора, причинённого чужими народами; сжатость греческой конструкции допускает пояснение в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повтор «народе / народов» сохранён вслед за греческим противопоставлением; архаичное «зело» и более конфессионально нагруженное «язычники» не вынесены в основной текст.
