lexical_decisions:
- source_word: παρέλαβεν
  choice: взял с собой
  rationale: В военном контексте глагол обозначает, что Горгий взял названные силы с собой; этот вариант естественен по-русски и не уточняет сверх текста, принял ли он над ними командование.
- source_word: πεντακισχιλίους ἄνδρας
  choice: пять тысяч человек
  rationale: ἄνδρας буквально означает «мужчин, людей»; военный контекст ясно указывает на бойцов, поэтому более общее «человек» сохраняет лексику источника без лишнего уточнения.
- source_word: χιλίαν ἵππον ἐκλεκτήν
  choice: тысячу отборных всадников
  rationale: ἵππον употреблено как собирательное обозначение конницы, а ἐκλεκτήν указывает на отборный состав; «отборные всадники» естественно и точно передаёт оба элемента.
- source_word: ἀπῆρεν
  choice: выступил в путь
  rationale: Глагол означает отправиться или выступить; выражение передаёт начало движения войска, не усиливая военную окраску до значения «выступил в поход».
- source_word: ἡ παρεμβολή
  choice: стан
  rationale: Слово буквально обозначает лагерь или стан и может метонимически относиться к расположившемуся там войску. «Стан» сохраняет образ греческого текста, а сноска поясняет собирательный смысл.
- source_word: νυκτός
  choice: ночью
  rationale: Родительный времени передаёт действие в ночное время; «ночью» — точный, естественный и стилистически нейтральный русский эквивалент.
