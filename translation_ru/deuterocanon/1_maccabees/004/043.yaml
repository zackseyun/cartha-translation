  source_fidelity: 'В целом переданы все основные компоненты греческого текста: очищение святилища, удаление камней и их помещение в нечистое место. Однако «камни, осквернённые нечистотой» избыточно разворачивает τοὺς λίθους τοῦ μιασμοῦ и неестественно дублирует лексику осквернения и нечистоты. Более прямое «осквернённые камни» точно передаёт смысл генитивной конструкции, не добавляя способа или причины осквернения.'
  naturalness: «И очистили святилище» и «отнесли в нечистое место» естественны для современного литературного русского с библейским регистром. Сочетание «осквернённые нечистотой» тяжеловесно и тавтологично; «осквернённые камни» ясно и идиоматично.
  terminology: «Очистили», «святилище», «осквернённые» и «нечистое место» сохраняют культовую семантику греческого текста. «Нечистое» следует оставить именно в этом регистре, не заменяя на бытовое «грязное».
