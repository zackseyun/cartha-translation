    rationale: τοὺς λίθους τοῦ μιασμοῦ буквально говорит о камнях осквернения/осквернённых камнях; греческий текст не уточняет, что они были осквернены именно «нечистотой». Добавление дублирует культовые понятия μιασμός и ἀκάθαρτος, которые в оригинале относятся к разным частям фразы.
