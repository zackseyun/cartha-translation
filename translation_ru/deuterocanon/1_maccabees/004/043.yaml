  text: And they cleansed the sanctuary, and carried the stones of defilement to an unclean place.
translation:
  language: ru
  text: И очистили святилище, а осквернённые камни отнесли в нечистое место.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαθάρισαν
  choice: очистили
  rationale: Передаёт как практическое очищение, так и обрядовое устранение нечистоты; естественно звучит в современном русском библейском повествовании.
- source_word: τὰ ἅγια
  choice: святилище
  rationale: В контексте восстановления храма субстантивированное среднее множественное обозначает священное пространство, а не абстрактные «святыни» или отдельные предметы.
- source_word: ἦραν
  choice: отнесли
  rationale: Глагол означает «подняли, взяли» и в данном контексте подразумевает перенос камней прочь; «отнесли» конкретно и естественно передаёт действие.
- source_word: τοὺς λίθους τοῦ μιασμοῦ
  choice: камни, осквернённые нечистотой
  rationale: Сохраняет необычную генитивную связь с μιασμός и ясно показывает, что камни были связаны с культовым осквернением; формула не сводит смысл к обычной грязи.
- source_word: εἰς τόπον ἀκάθαρτον
  choice: в нечистое место
  rationale: Сохраняет библейскую лексику обрядовой нечистоты и смысловое соответствие между осквернёнными камнями и местом их удаления.
theological_decisions:
- issue: Культовая терминология при восстановлении храма
  choice: Последовательно сохранить язык очищения, осквернения и нечистоты
  alternative: 'Передать нейтрально-бытовыми словами: «вымыли», «грязные камни», «грязное место»'
  rationale: Греческий текст описывает не просто физическую уборку, а устранение культового осквернения; это богословски значимое измерение нельзя сглаживать.
- issue: Значение τὰ ἅγια
  choice: святилище
  alternative: святыни / святое место
  rationale: Контекст указывает на храмовое священное пространство. «Святилище» точно и без лишней конкретизации передаёт этот смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис краткий и повествовательный; культовые термины сохранены без архаизации.
