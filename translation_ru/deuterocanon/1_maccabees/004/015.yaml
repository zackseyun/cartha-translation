  text: But all the rear guard fell by the sword[a], and they pursued them as far as Gazara and as far as the plains of Judea and Azotus and Jamnia[c][b], and about three thousand of them fell.
translation:
  language: ru
  text: А все, кто был в тылу, пали от меча. Победители преследовали их до Газары[a], до равнин Иудеи, до Азота и до Иамнии[b], и из них пало около трёх тысяч человек[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Газара — греческое название города, обычно отождествляемого с Гезером.
    reason: cross_reference
  - marker: b
    text: Азот — греческая форма названия Ашдода; Иамнию обычно отождествляют с Явне.
    reason: cross_reference
  - marker: c
    text: 'Или: «из них пало до трёх тысяч человек»; греческий оборот указывает на приблизительное число погибших.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔσχατοι πάντες
  choice: А все, кто был в тылу
  rationale: ἔσχατοι буквально обозначает «последних» или «находившихся позади»; контекст позволяет передать расположение в войске, не вводя более специального понятия «арьергард», которого греческий текст прямо не требует.
- source_word: ἔπεσαν ἐν ῥομφαίᾳ
  choice: пали от меча
  rationale: Сохранён обычный библейский военный оборот, обозначающий гибель от оружия.
- source_word: ἐδίωξαν
  choice: преследовали
  rationale: Прямое и естественное обозначение военного преследования.
- source_word: ἕως Γαζήρων
  choice: до Газары
  rationale: Передана греческая форма топонима; его общепринятое отождествление с Гезером вынесено в сноску.
- source_word: τῶν πεδίων τῆς Ἰουδαίας
  choice: до равнин Иудеи
  rationale: πεδία означает равнинные, открытые пространства; «равнины» сохраняет географический смысл.
- source_word: Ἀζώτου καὶ Ἰαννείας
  choice: Азота и Иамнии
  rationale: Использованы русские формы греческих топонимов, а их более известные семитские соответствия отмечены в сноске.
- source_word: ἔπεσαν ἐξ αὐτῶν εἰς ἄνδρας τρισχιλίους
  choice: пало из них около трёх тысяч человек
  rationale: Оборот εἰς ἄνδρας с числительным выражает приблизительное число людей; русский перевод сохраняет и приблизительность, и указание на погибших.
