lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: повернул назад
  rationale: Аорист ἐπιστρέφω обозначает смену направления; в военном контексте «повернул назад» передаёт конкретное движение естественнее, чем нейтральное «возвратился».
- source_word: ἡ δύναμις
  choice: со своим войском
  rationale: В военном повествовании δύναμις означает вооружённый отряд или войско. Творительная конструкция естественно передаёт совместное действие Иуды и его воинов; притяжательное «своим» ясно выражает их связь без излишней формализации.
- source_word: ἀπὸ τοῦ διώκειν
  choice: прекратил преследование
  rationale: ἀπό с субстантивированным инфинитивом здесь выражает прекращение действия. Русская формулировка ясно передаёт отказ от дальнейшей погони.
- source_word: ὀπίσθεν αὐτῶν
  choice: преследование
  rationale: В сочетании с διώκειν оборот означает погоню за отступающими противниками. В русском глагол или существительное «преследовать/преследование» уже включает значение движения следом, поэтому отдельное «за ними» было бы избыточно в данной формулировке.
