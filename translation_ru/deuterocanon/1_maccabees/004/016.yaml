  source_fidelity: Греческое καὶ ἐπέστρεψεν Ἰούδας καὶ ἡ δύναμις ἀπὸ τοῦ διώκειν ὀπίσθεν αὐτῶν означает, что Иуда и военная сила прекратили погоню и повернули обратно. Проект верно передаёт прекращение преследования и смену направления, но перестраивает составное подлежащее в конструкцию «Иуда со своим войском» и оформляет сказуемые в единственном числе, что менее точно отражает два явно названных субъекта.
