  terminology: «Войско» — уместная передача δύναμις в данном военном контексте. «Преследование» адекватно передаёт διώκειν ὀπίσθεν αὐτῶν; отдельное «за ними» в русском не требуется. Притяжательное «его» допустимо по контексту, но не следует растворять войско в предложной группе при Иуде.
