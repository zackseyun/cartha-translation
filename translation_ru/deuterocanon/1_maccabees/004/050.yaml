base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/050.yaml
  text: And they burned incense on the altar[a], and they lit the lamps that were on the lampstand[b], and they shone in the temple.
translation:
  language: ru
  text: Они воскурили благовония на жертвеннике, зажгли светильники, находившиеся на светильной подставке, и светильники сияли в храме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «храм» здесь может обозначать собственно святилище, внутреннюю часть храмового комплекса.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθυμίασαν
  choice: воскурили благовония
  rationale: Глагол обозначает сожжение благовоний в культовом действии; «воскурили благовония» точно и естественно передаёт эту специфику.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: на жертвеннике
  rationale: ἐπί с винительным указывает на совершение действия на поверхности жертвенника; русское выражение сохраняет конкретность обряда.
- source_word: ἐξῆψαν
  choice: зажгли
  rationale: Форма означает «зажгли, воспламенили»; для светильников «зажгли» — наиболее естественный современный эквивалент.
- source_word: τοὺς λύχνους
  choice: светильники
  rationale: λύχνος обозначает конкретный источник света, светильник, а не абстрактный свет.
- source_word: τῆς λυχνίας
  choice: светильнике
  rationale: λυχνία — подставка, несущая светильники; в русской библейской и литературной речи «светильник» может обозначать весь храмовый прибор. Повторение сохраняет связь однокоренных греческих терминов, хотя их референты различны.
- source_word: ἐφαίνοντο
  choice: засияли
  rationale: В контексте подлежащим остаются светильники; глагол передаёт их сияние. «Засияли» естественно выражает результат зажигания, не превращая форму в безличную конструкцию.
- source_word: ἐν τῷ ναῷ
  choice: в храме
  rationale: ναός здесь обозначает храм, вероятно его внутреннее святилище; основной текст использует понятное широкому читателю слово, а более узкое значение отмечено в сноске.
theological_decisions:
- issue: Культовая терминология при восстановлении храмового служения
  choice: 'Сохранены конкретные термины: «воскурили благовония», «жертвенник», «светильники», «храм».'
  alternative: Передать действия обобщёнными выражениями о поклонении или жертвоприношении.
  rationale: Стих описывает определённые обрядовые действия; обобщение устранило бы историческую и культовую конкретность.
- issue: Субъект заключительного глагола
  choice: «те засияли» — сияют зажжённые светильники.
  alternative: Безличное «и стало светло» или каузативное «и они осветили храм».
  rationale: Греческая форма ἐφαίνοντο грамматически соотносится со светильниками и описывает их сияние; явное местоимение устраняет возможное ошибочное отнесение действия к людям.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной храмовой лексикой. Союзная последовательность оригинала сохранена, но повтор подлежащего в последней части заменён местоимением «те» ради ясности. Маркер сноски поставлен после слова «храме», к которому относится примечание.
