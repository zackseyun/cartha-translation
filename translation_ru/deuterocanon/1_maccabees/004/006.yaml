  source_fidelity: Перевод верно передаёт χρονологическое указание ἅμα ἡμέρᾳ («На рассвете»), явление Иуды с отрядом в поле и недостаточность вооружения. Формулировка «не столько, сколько им хотелось» уместно выражает οὐκ εἶχον καθὼς ἠβούλοντο, не утверждая полного отсутствия снаряжения. Множественное «мечей» допустимо как русская передача собирательно-обобщённого μάχαιραν в описании вооружения трёхтысячного отряда.
