  text: And at daybreak Judas appeared in the plain with three thousand men; but they did not have armor and a sword as they wished.
translation:
  language: ru
  text: На рассвете Иуда появился на равнине с тремя тысячами воинов. Однако защитного снаряжения и мечей[a] у них было не столько, сколько им хотелось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «покрытий и меча». Вероятно, имеются в виду защитное вооружение и мечи в недостаточном количестве.'
    reason: Поясняет неоднозначное καλύμματα и собирательное употребление единственного числа μάχαιραν, не закрепляя спорный конкретный вид защитного вооружения в основном тексте.
lexical_decisions:
- source_word: ἅμα ἡμέρᾳ
  choice: на рассвете
  rationale: Устойчиво и естественно передаёт наступление дня.
- source_word: ὤφθη
  choice: появился
  rationale: Передаёт пассивную форму со значением явления в поле зрения, не утяжеляя русский текст буквальным «был увиден».
- source_word: ἐν τῷ πεδίῳ
  choice: на равнине
  rationale: Прямое пространственное значение πεδίον в данном военном контексте.
- source_word: ἐν τρισχιλίοις ἀνδράσιν
  choice: с тремя тысячами воинов
  rationale: Предлог ἐν обозначает сопровождающую силу; «воины» яснее контекстуального «мужчины».
- source_word: καλύμματα
  choice: защитное снаряжение
  rationale: Буквально «покрытия»; в военном контексте речь идёт о защитном вооружении, но точный его вид не уточнён, поэтому «доспехи» или «щиты» были бы уже.
- source_word: μάχαιραν
  choice: мечей
  rationale: Греческое единственное число имеет обобщённое, собирательное значение; русский множественный ряд естественно относится к вооружению трёх тысяч воинов.
- source_word: οὐκ εἶχον καθὼς ἠβούλοντο
  choice: у них было не столько, сколько им хотелось
  rationale: Контекст показывает недостаточность имеющегося вооружения, а не обязательно его полное отсутствие; такая формулировка сохраняет сравнительное значение καθὼς.
