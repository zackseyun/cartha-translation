base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/030.yaml
  text: And when he saw that the camp was strong[a], he prayed and said, “Blessed are you, O Savior of Israel, who crushed the assault of the mighty one by the hand of your servant David[b], and gave the camp of the foreigners into the hands of Jonathan son of Saul and of the one who carried his armor.”
translation:
  language: ru
  text: 'Увидев, что стан силён, он помолился и сказал: «Благословен Ты, Спаситель Израиля! Ты сокрушил натиск могучего[a] рукою раба Твоего Давида[b] и предал стан иноплеменников в руки Ионафана, сына Саула, и его оруженосца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение, вероятно, отсылает к Голиафу, однако греческий текст называет его лишь «могучим».
    reason: cross_reference
  - marker: b
    text: 'Или: «Твоего слуги Давида». Греческое δοῦλος может означать раба или слугу; здесь оно подчёркивает принадлежность Давида Богу и его подчинение Ему. Молитва отсылает к победе Давида над Голиафом, а далее — к сражению Ионафана и его оруженосца с филистимлянами.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: παρεμβολή
  choice: стан
  rationale: В военном контексте слово обозначает лагерь или расположившееся в нём войско. «Стан» сохраняет оба оттенка и соответствует возвышенному молитвенному контексту.
- source_word: ἰσχυράν
  choice: силён
  rationale: Прямо передаёт военную мощь стана, не уточняя за греческий текст, идёт ли речь об укреплённости лагеря или силе войска.
- source_word: σωτήρ
  choice: Спаситель
  rationale: Сохраняет титул Бога и богословскую весомость греческого слова.
- source_word: συντρίψας
  choice: сокрушил
  rationale: Передаёт решительную и полную победу, сохраняя библейскую образность.
- source_word: ὅρμημα
  choice: натиск
  rationale: Обозначает стремительное нападение; «натиск» естественно звучит в военном контексте и не ослабляет силу исходного слова.
- source_word: τοῦ δυνατοῦ
  choice: могучего
  rationale: Субстантивированное прилагательное оставлено без имени, как в греческом тексте; контекстуальная отсылка к Голиафу поясняется в сноске.
- source_word: ἐν χειρὶ
  choice: рукою
  rationale: Сохранена характерная библейская формула выражения посредничества или орудия действия.
- source_word: δούλου
  choice: раба
  rationale: В обращении к Богу слово выражает полную принадлежность и подчинение Давида Богу. Русская библейская формула «раб Твой» естественна в молитвенной речи; возможный перевод «слуга» отмечен в сноске.
- source_word: ἀλλοφύλων
  choice: иноплеменников
  rationale: Передаёт буквальное обозначение людей иного народа, не подставляя прямо имя филистимлян, которого в данном стихе нет.
- source_word: τοῦ αἰρόντος τὰ σκεύη αὐτοῦ
  choice: его оруженосца
  rationale: Естественный русский военный термин точно передаёт человека, носившего оружие или снаряжение Ионафана.
theological_decisions:
- issue: Передача δοῦλος применительно к Давиду
  choice: раб Твой Давид
  alternative: слуга Твой Давид
  rationale: «Раб» сохраняет идею принадлежности Богу и соответствует естественной русской молитвенной формуле, тогда как «слуга» возможен лексически, но слабее передаёт подчинённое положение.
- issue: Следует ли прямо назвать Голиафа и филистимлян
  choice: 'сохранить обобщённые выражения греческого текста: «могучий» и «иноплеменники»'
  alternative: «Голиаф» и «филистимляне»
  rationale: Историческая аллюзия ясна, однако исходный стих не называет их прямо. Обобщённые обозначения сохраняют форму и меру определённости оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-библейским звучанием. Синтаксис упрощён относительно греческой цепочки союзов, но последовательность действий сохранена. Формы «Благословен Ты», «рукою раба Твоего» и «предал… в руки» поддерживают достоинство и аллюзивный характер молитвы без архаизации всего стиха.
