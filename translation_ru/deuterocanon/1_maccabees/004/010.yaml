base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/010.yaml
  text: And now let us cry out to heaven; if he is willing toward us[a], he will remember the covenant of our fathers and crush this camp before us today.
translation:
  language: ru
  text: 'А теперь воззовём к небу: если Он благоволит к нам[a], то вспомнит завет отцов и сегодня сокрушит этот стан у нас на глазах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если Он пожелает нас»; то есть если Он расположен к нам, благосклонен к нам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βοήσωμεν
  choice: воззовём
  rationale: Аорист сослагательного наклонения имеет побудительное значение. «Воззовём» передаёт настоятельное обращение за помощью и сохраняет возвышенный, но понятный библейский регистр.
- source_word: εἰς οὐρανόν
  choice: к небу
  rationale: Сохранён греческий образ обращения к небу без поясняющей замены на «к Богу».
- source_word: εἰ θελήσει ἡμᾶς
  choice: если Он благоволит к нам
  rationale: Буквально θέλω с личным дополнением означает «желать нас», однако по смыслу выражает благосклонное расположение Бога. «Благоволит к нам» естественно по-русски и сохраняет как личную направленность, так и условность.
- source_word: μνησθήσεται
  choice: вспомнит
  rationale: Передаёт обычный язык завета, где Божье воспоминание подразумевает последующее действие.
- source_word: διαθήκης πατέρων
  choice: завет наших отцов
  rationale: 'Сохраняет неоднозначность родительного оборота: речь может идти о завете, связанном с предками, или о завете, заключённом с ними.'
- source_word: συντρίψει
  choice: сокрушит
  rationale: Передаёт силу глагола и хорошо соответствует военному контексту.
- source_word: τὴν παρεμβολὴν ταύτην
  choice: этот стан
  rationale: παρεμβολή может обозначать лагерь или войско. «Стан» сохраняет конкретный образ расположившейся вражеской силы и уместен в литературном библейском регистре.
- source_word: κατὰ πρόσωπον ἡμῶν
  choice: у нас на глазах
  rationale: Естественный современный русский эквивалент выражения «перед нашим лицом», обозначающий действие непосредственно перед ними, в их присутствии.
theological_decisions:
- issue: Неявное подлежащее глаголов после обращения «к небу»
  choice: Указать местоимение «Он», относящееся к Богу
  alternative: Оставить подлежащее невыраженным
  rationale: Единственное число глаголов по контексту относится к Богу; русское предложение с явным подлежащим яснее. Прописная буква соответствует принятому русскому оформлению местоимения, относящегося к Богу, не добавляя имени, отсутствующего в греческом тексте.
- issue: Значение εἰ θελήσει ἡμᾶς
  choice: «если Он благоволит к нам»
  alternative: «если Он пожелает нас»; «если Он будет к нам благосклонен»; «если мы Ему угодны»
  rationale: Формально необычное сочетание θέλω с личным дополнением выражает благоприятную волю или расположение Бога. Основной текст передаёт этот смысл естественно, а сноска сохраняет буквальную особенность и возможные оттенки.
- issue: Связь условия с последующими глаголами
  choice: Передать конструкцией «если… то…»
  alternative: Сохранить простое соединение союзом «и»
  rationale: Так яснее передаётся условная зависимость последующего воспоминания о завете и сокрушения стана, заложенная в греческой конструкции, без изменения её богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Воззовём», «завет» и «сокрушит» сохраняют достоинство речи; синтаксис остаётся понятным широкому читателю. Единственный маркер сноски [a] помещён непосредственно после спорного выражения.
