  yaml_path: translation/deuterocanon/1_maccabees/004/051.yaml
  text: And they placed loaves on the table[a], and they spread out the curtains[b]; and they completed all the works that they had done.
translation:
  language: ru
  text: И положили на стол хлебы[a], и развернули завесы[b], и завершили все работы, которые они выполнили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлеб». В греческом тексте стоит форма множественного числа: «хлебы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «занавеси»; это слово часто обозначает храмовые завесы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: положили
  rationale: Аорист ἐπιτίθημι обозначает действие «положить на»; русский глагол естественно сочетается со столом и не добавляет отсутствующей в греческом технической окраски.
- source_word: τὴν τράπεζαν
  choice: на стол
  rationale: Передаёт простое значение существительного без уточнений вроде «стол хлебов предложения», которых в данном стихе нет.
- source_word: ἄρτους
  choice: хлебы
  rationale: Сохраняет множественное число греческого текста и в храмовом контексте естественно обозначает отдельные ритуальные хлебы.
- source_word: ἐξεπέτασαν
  choice: развесили
  rationale: Глагол означает расправить или развернуть; применительно к храмовым завесам «развесили» ясно выражает их установку, не сводя действие к простому раскладыванию.
- source_word: τὰ καταπετάσματα
  choice: завесы
  rationale: В храмовом контексте καταπέτασμα обозначает завесу или занавес; «завесы» — естественный и традиционно понятный русский эквивалент.
- source_word: ἐτέλεσαν
  choice: завершили
  rationale: Точно передаёт значение доведения дела до конца.
- source_word: πάντα τὰ ἔργα
  choice: все работы
  rationale: Сохраняет множественность отдельных работ и звучит естественно по-русски.
- source_word: ἃ ἐποίησαν
  choice: которые совершали
  rationale: Передаёт ἐποίησαν через общий глагол действия и избегает русского противоречия «завершили… которые завершили»; несовершенный вид по-русски представляет работы как выполнявшийся комплекс, доведённый до конца.
theological_decisions:
- issue: Наименование храмовых предметов
  choice: Обычные наименования «стол», «хлебы», «завесы» без дополнительных технических определений
  alternative: «стол хлебов предложения»; «занавеси»
  rationale: Греческий текст не содержит расширенных культовых названий. Перевод сохраняет храмовый контекст, но не вносит в основной текст отсутствующих уточнений.
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный синтаксис и достойный библейский регистр. Повтор союзов сохранён как черта исходного текста, а точка с запятой отделяет итоговое действие.
