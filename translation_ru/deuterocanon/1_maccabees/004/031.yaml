  yaml_path: translation/deuterocanon/1_maccabees/004/031.yaml
  text: Hand over this camp into the hands of your people Israel, and let them be put to shame because of their army and their cavalry.
translation:
  language: ru
  text: Предай[a] этот лагерь в руки Твоего народа, Израиля, и пусть они будут посрамлены из-за своей силы и конницы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально греческий глагол может означать «запри» или «заключи»; в данном контексте: «отдай этот лагерь во власть Твоего народа, Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также перевод: «пусть они будут посрамлены за свою силу и конницу»; слово «сила» может означать также «военную мощь» или «войско».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  choice: Предай
  rationale: Основное значение глагола — «запереть, заключить», однако в этой военной молитве он означает отдать вражеский лагерь во власть Израиля. «Предай» естественно передаёт этот смысл и сохраняет торжественный регистр.
- source_word: παρεμβολήν
  choice: лагерь
  rationale: Слово может обозначать как лагерь, так и расположившееся в нём войско. «Лагерь» сохраняет конкретный образ исходного текста, не исключая подразумеваемой вражеской силы.
- source_word: εἰς χεῖρας
  choice: в руки
  rationale: Сохранён общеупотребительный библейский образ передачи под чью-либо власть.
- source_word: λαοῦ σου Ἰσραήλ
  choice: Твоего народа Израиля
  rationale: Оборот называет Израиль Божьим народом; форма без добавочного толкования ясно передаёт эту связь.
- source_word: αἰσχυνθήτωσαν
  choice: пусть они будут посрамлены
  rationale: 'Передаёт повелительно-желательное и результативное значение пассивной формы: речь не только о внутреннем стыде, но о позоре поражения.'
- source_word: ἐπὶ τῇ δυνάμει
  choice: при всей своей силе
  rationale: δύναμις может означать силу, военную мощь или войско. В сочетании с конницей речь идёт о военной силе; конструкция «при всей» естественно выражает, что она не спасёт врагов от посрамления.
- source_word: τῇ ἵππῳ αὐτῶν
  choice: своей … коннице
  rationale: Единственное число ἵππος здесь имеет собирательное военное значение; «конница» ясно и точно передаёт его по-русски.
theological_decisions:
- issue: Молитвенная просьба к Богу отдать вражеский лагерь Израилю
  choice: Предай этот лагерь в руки Твоего народа Израиля
  alternative: Заключи этот лагерь в руки Твоего народа Израиля
  rationale: Выбранный вариант сохраняет Божье действие как источник победы, но не превращает буквальный пространственный образ глагола в неестественную русскую фразу.
- issue: Отношение посрамления врагов к их военной мощи
  choice: пусть они будут посрамлены при всей своей силе и коннице
  alternative: пусть они будут посрамлены из-за своей силы и конницы
  rationale: Предлог ἐπί с дательным допускает несколько смысловых оттенков. Основной текст передаёт контраст между их военной мощью и поражением, а примечание сохраняет возможное причинное или обстоятельственное прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены идиома «в руки» и молитвенная форма «пусть…». Неясность оборота ἐπὶ τῇ δυνάμει отражена в примечании.
