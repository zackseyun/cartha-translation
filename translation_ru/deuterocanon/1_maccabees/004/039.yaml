  text: And they tore their garments[a], and made great lamentation, and put ashes on their heads.
translation:
  language: ru
  text: И они разорвали на себе одежды[a], подняли великий плач и посыпали головы пеплом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Разрывание одежд, громкий плач и посыпание головы пеплом — традиционные в библейской культуре знаки скорби и траура.
    reason: cultural_note
lexical_decisions:
- source_word: διέρρηξαν τὰ ἱμάτια αὐτῶν
  choice: разорвали на себе одежды
  rationale: Глагол означает «разрывать»; добавление идиоматического «на себе» естественно передаёт по-русски обрядовый жест раздирания собственной одежды, а «одежды» сохраняет возвышенный повествовательный регистр.
- source_word: ἐκόψαντο κοπετὸν μέγαν
  choice: подняли великий плач
  rationale: Сочетание однокоренных глагола и существительного обозначает сильный, публично выраженный траурный плач. Русская идиома передаёт интенсивность и не добавляет не названного в греческом телесного жеста.
- source_word: σποδὸν
  choice: пеплом
  rationale: Собирательное существительное обозначает пепел; творительный падеж требуется естественной русской конструкцией «посыпать чем».
- source_word: ἐπέθεντο σποδὸν ἐπὶ τὴν κεφαλὴν αὐτῶν
  choice: посыпали головы пеплом
  rationale: Буквально речь идёт о возложении пепла на голову; «посыпали головы пеплом» — ясная и естественная русская формулировка. Единственное число κεφαλή при множественном αὐτῶν передано распределительным множественным числом.
