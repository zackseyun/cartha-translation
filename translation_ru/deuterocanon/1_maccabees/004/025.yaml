lexical_decisions:
- source_word: ἐγενήθη
  choice: пришло
  rationale: Аорист γίνομαι обозначает наступление события или результата; «пришло» естественно сочетается с «избавлением» и передаёт динамику исходной конструкции.
- source_word: σωτηρία
  choice: избавление
  rationale: В военно-историческом контексте речь идёт о конкретном спасении народа от врагов; «избавление» сохраняет широту значения и не сводит его только к победе в сражении.
- source_word: μεγάλη
  choice: великое
  rationale: Прямо передаёт усилительное значение прилагательного и сохраняет торжественный, но понятный регистр.
- source_word: τῷ Ἰσραήλ
  choice: к Израилю
  rationale: Дательный обозначает того, кому досталось избавление; сочетание «пришло к Израилю» естественно передаёт эту направленность и сохраняет собирательное название народа.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: в тот день
  rationale: Обычное современное русское обозначение конкретного времени, сохраняющее указательное значение ἐκείνῃ.
