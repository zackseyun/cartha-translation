lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: вернулся
  rationale: Глагол обозначает возвращение или движение назад; в данном повествовательном контексте естественно «вернулся».
- source_word: σκυλίαν τῆς παρεμβολῆς
  choice: за добычей из лагеря
  rationale: σκυλία обозначает военную добычу, а παρεμβολή — военный лагерь. Предложная конструкция передаёт возвращение с целью забрать лагерную добычу.
- source_word: ἔλαβε
  choice: взял
  rationale: Сохранено единственное число греческого глагола, согласованное с подлежащим «Иуда»; он может выступать как предводитель и представитель своего отряда.
- source_word: χρυσίον καὶ ἀργύριον πολὺ
  choice: много золота и серебра
  rationale: Естественная русская передача большого количества обоих драгоценных металлов.
- source_word: ὑάκινθον καὶ πορφύραν
  choice: ткани синего и пурпурного цвета
  rationale: В перечне ценностей слова вероятнее всего обозначают дорогие окрашенные ткани либо соответствующие красители; «ткани» делает предметный смысл понятным, не прибегая к устаревшему названию цвета.
- source_word: θαλασσίαν
  choice: морской пурпур
  rationale: Субстантивированное прилагательное буквально означает «морская»; рядом с названиями дорогих цветов и тканей вероятна отсылка к морскому пурпуру. Неуверенность в точном референте сохранена в сноске.
- source_word: πλοῦτον μέγαν
  choice: великое богатство
  rationale: Кратко и близко к греческому выражению передаёт итоговую характеристику обильной добычи.
