  naturalness: Предлагаемая редакция сохраняет ясный современный литературный синтаксис. «Вернулся к добыче из лагеря» естественно передаёт возвращение к захваченному имуществу; «морские товары» требует пояснения, но в самом тексте не создаёт искусственной конструкции.
  terminology: «Добыча» точно передаёт σκυλία, «лагерь» — παρεμβολή. «Синие ткани» и «пурпурные ткани» уместно эксплицируют предметный смысл ὑάκινθον и πορφύραν. Для θαλασσίαν выбран нейтральный широкий вариант с примечанием, а не неподтверждённое «морской пурпур».
