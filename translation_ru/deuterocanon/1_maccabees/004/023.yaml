  text: And Judas returned to the plunder of the camp[a], and took much gold and silver, and blue cloth and purple cloth and sea goods[b], and great wealth.
translation:
  language: ru
  text: Иуда вернулся к добыче из лагеря и взял много золота и серебра, синие ткани, пурпурные ткани, морские товары[a] и великое богатство.
