lexical_decisions:
- source_word: ἀλλόφυλοι
  choice: иноплеменники
  rationale: Слово обозначает людей иного народа. В данном контексте это не филистимляне, а вообще чужеземные, неиудейские силы; «иноплеменники» сохраняет этнический оттенок и подходит возвышенному историческому повествованию.
- source_word: ἦραν ... τοὺς ὀφθαλμοὺς αὐτῶν
  choice: подняли глаза
  rationale: Естественный современный русский эквивалент греческой идиомы со значением «посмотрели вверх/взглянули», сохраняющий её образность.
- source_word: ἶδαν
  choice: увидели
  rationale: Прямо передаёт повествовательный аорист, не добавляя оттенков внезапности или длительности.
- source_word: ἐχομένους
  choice: расположившимися
  rationale: Причастие здесь описывает занимаемое противостоящим войском положение. «Расположившимися» естественно в военном контексте, но не уточняет без достаточных оснований, был ли это лагерь или боевой строй.
- source_word: ἐξ ἐναντίας
  choice: напротив
  rationale: Передаёт пространственное положение лицом к противнику и не усиливает выражение дополнительным значением нападения.
