  yaml_path: translation/deuterocanon/1_maccabees/004/033.yaml
  text: Strike them down with the sword of those who love you, and let all who know your name praise you with hymns.
translation:
  language: ru
  text: Порази их мечом тех, кто любит Тебя, и пусть все, знающие имя Твоё, восхваляют Тебя в гимнах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατάβαλε
  choice: Порази
  rationale: Императив передаёт просьбу повергнуть или сразить врагов; «порази» естественно сочетается с орудием «мечом» и сохраняет возвышенный молитвенный тон.
- source_word: ῥομφαίᾳ ἀγαπώντων σε
  choice: мечом тех, кто любит Тебя
  rationale: Сохранена греческая конструкция с инструментальным дательным и родительным определением; меч представлен как меч любящих Бога, без добавления причинного или посреднического толкования.
- source_word: οἱ εἰδότες τὸ ὄνομά σου
  choice: знающие имя Твоё
  rationale: Буквально и естественно передаёт библейское выражение о знающих Божье имя, не сводя «знать» лишь к интеллектуальной осведомлённости.
- source_word: ἐν ὕμνοις
  choice: в гимнах
  rationale: Сохраняет явное указание на хвалебные песнопения и форму множественного числа.
theological_decisions:
- issue: Меч как средство действия Бога через любящих Его
  choice: «мечом тех, кто любит Тебя»
  alternative: «мечом любящих Тебя» / «посредством меча тех, кто любит Тебя»
  rationale: Выбранная формулировка сохраняет компактность и подлинную неоднозначность греческого инструментального дательного, не уточняя сверх текста характер Божьего и человеческого действия.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-поэтической речи. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции; синтаксис остаётся понятным обычному читателю.
