  yaml_path: translation/deuterocanon/1_maccabees/004/036.yaml
  text: Then Judas and his brothers said[a], “Look, our enemies have been crushed[b]. Let us go up to cleanse the sanctuary and dedicate it.”
translation:
  language: ru
  text: 'Тогда Иуда и его братья сказали: «Вот, враги наши сокрушены. Поднимемся[a], чтобы очистить святилище и освятить его[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взойдём»; имеется в виду подъём к Иерусалиму и храму.'
    reason: cultural_note
  - marker: b
    text: 'Или: «посвятить его», «торжественно открыть его». Греческий глагол обозначает посвящение или открытие; в данном контексте речь идёт о восстановлении осквернённого храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: сказали
  rationale: Обычная повествовательная форма глагола «говорить». В русском требуется множественное число при составном подлежащем «Иуда и его братья», хотя в греческом стоит единственное число.
- source_word: Ἰούδας
  choice: Иуда
  rationale: Традиционная русская передача этого библейского имени.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: его братья
  rationale: Прямое и естественное обозначение родных братьев Иуды в данном контексте.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современное и выразительное междометие, привлекающее внимание к свершившемуся поражению врагов.
- source_word: συνετρίβησαν
  choice: сокрушены
  rationale: Передаёт решительный военный разгром и сохраняет образную силу глагола συντρίβω.
- source_word: οἱ ἐχθροὶ ἡμῶν
  choice: враги наши
  rationale: Точная передача принадлежности; такой порядок слов уместен в торжественной прямой речи.
- source_word: ἀναβῶμεν
  choice: Поднимемся
  rationale: Увещательное сослагательное наклонение передано формой совместного побуждения; сохранено указание на подъём к Иерусалиму и храму.
- source_word: καθαρίσαι
  choice: очистить
  rationale: В храмовом контексте глагол обозначает устранение ритуального осквернения, а не только физическую уборку.
- source_word: τὰ ἅγια
  choice: святилище
  rationale: Хотя форма буквально может обозначать «святыни» или «святое место», контекст восстановления храма указывает на святилище как целое.
- source_word: ἐγκαινίσαι
  choice: вновь освятить
  rationale: Глагол означает посвятить или торжественно открыть; контекст уже существовавшего, но осквернённого храма требует передать повторное освящение, не скрывая при этом буквальной лексической широты.
theological_decisions:
- issue: Культовое значение сочетания καθαρίσαι τὰ ἅγια
  choice: очистить святилище
  alternative: очистить святыни; очистить святое место
  rationale: Речь идёт о восстановлении Иерусалимского храма после осквернения. Выражение «очистить святилище» ясно передаёт и место действия, и ритуальный характер очищения.
- issue: Значение ἐγκαινίσαι после осквернения храма
  choice: вновь освятить его
  alternative: освятить его; торжественно открыть его
  rationale: Сам глагол допускает значения посвящения и открытия, а повествовательный контекст указывает на повторное освящение. Слово «вновь» делает этот контекст явным, а сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировки понятны широкому читателю; культовые термины сохранены там, где они существенны для смысла.
