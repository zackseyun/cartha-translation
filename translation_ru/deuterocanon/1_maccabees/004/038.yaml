base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/038.yaml
  text: And they saw our sanctuary laid waste[a], and the altar defiled, and the gates burned down, and in the courts plants growing as in a thicket or as on one of the mountains[b], and the chambers torn down.
translation:
  language: ru
  text: И увидели они наше святилище опустошённым, жертвенник — осквернённым, ворота — сожжёнными; во дворах разрослись растения, как в чаще или на одной из гор, а храмовые помещения были разрушены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое παστοφόρια обозначает помещения, связанные с храмовым комплексом; их точное назначение и расположение неясны.
    reason: cultural_note
lexical_decisions:
- source_word: ἁγίασμα
  choice: святилище
  rationale: В контексте храма обозначает священное место; «святилище» естественно передаёт культовый смысл.
- source_word: ἠρημωμένον
  choice: опустошённым
  rationale: Передаёт состояние разорения и запустения, выраженное перфектным причастием.
- source_word: θυσιαστήριον
  choice: жертвенник
  rationale: Традиционный и точный русский термин для культового алтаря, на котором приносят жертвы.
- source_word: βεβηλωμένον
  choice: осквернённым
  rationale: Передаёт нарушение святости жертвенника и ритуальное осквернение.
- source_word: πύλας
  choice: ворота
  rationale: Естественное обозначение ворот храмового комплекса во множественном числе исходного текста.
- source_word: κατακεκαυμένας
  choice: сожжёнными
  rationale: Передаёт завершённый результат уничтожения огнём без добавления невыраженной детали.
- source_word: αὐλαῖς
  choice: дворах
  rationale: В данном контексте речь идёт о храмовых дворах.
- source_word: φυτὰ πεφυκότα
  choice: разрослись растения
  rationale: Естественно выражает возникшую и продолжающуюся бесконтрольную растительность.
- source_word: δρυμῷ
  choice: чаще
  rationale: Передаёт образ густой дикой растительности; точнее по контексту, чем нейтральное «лес».
- source_word: παστοφόρια
  choice: храмовые помещения
  rationale: Осторожная передача помещений при храмовом комплексе без спорного уточнения их функции или расположения.
- source_word: καθῃρημένα
  choice: были разрушены
  rationale: Передаёт результат сноса или разборки строений; точный способ разрушения из контекста неясен.
