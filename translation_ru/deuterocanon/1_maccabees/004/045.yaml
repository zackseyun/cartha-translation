  yaml_path: translation/deuterocanon/1_maccabees/004/045.yaml
  text: And it seemed to them a good plan to tear it down[a], lest it become a reproach to them because the nations had defiled it; so they tore down the altar.
translation:
  language: ru
  text: И они сочли хорошим решением разрушить его, чтобы он не стал для них позором из-за того, что народы[a] осквернили его; и разрушили жертвенник.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «язычники». Греческое выражение τὰ ἔθνη может означать «народы» или, в данном иудейском контексте, «язычников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσεν αὐτοῖς βουλὴ ἀγαθή
  choice: они сочли правильным
  rationale: Греческая идиома буквально говорит, что им «выпал добрый совет»; по-русски естественно передать её как принятое ими разумное решение, не добавляя внешнего советчика.
- source_word: καθελεῖν / καθεῖλον
  choice: разрушить / разрушили
  rationale: Глагол обозначает разбор или разрушение жертвенника. Повтор одного русского корня сохраняет лексическую связь между решением и последующим действием.
- source_word: μή ποτε γένηται αὐτοῖς εἰς ὄνειδος
  choice: чтобы он не стал для них позором
  rationale: ὄνειδος охватывает значения позора, бесчестья и предмета укора. «Позором» ясно и естественно передаёт общественную сторону этого понятия в современном русском языке.
- source_word: ἐμίαναν
  choice: осквернили
  rationale: В культовом контексте μιαίνω обозначает ритуальное осквернение; этот выбор сохраняет религиозный смысл и не сводит действие к физическому загрязнению.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: Это прямое и наименее интерпретирующее соответствие греческому выражению. В данном иудейском контексте оно может обозначать языческие народы, поэтому возможный перевод «язычники» отмечен в сноске.
- source_word: τὸ θυσιαστήριον
  choice: жертвенник
  rationale: Устоявшееся и точное русское обозначение культового сооружения для принесения жертв.
theological_decisions:
- issue: Культовое осквернение жертвенника
  choice: осквернили
  alternative: загрязнили; сделали нечистым
  rationale: Перевод сохраняет ритуально-религиозную силу глагола, не уточняя сверх текста характер нечистоты и не привнося позднейших доктринальных категорий.
- issue: Обозначение τὰ ἔθνη
  choice: народы
  alternative: язычники
  rationale: Основной текст сохраняет буквальную широту выражения, а сноска сообщает его обычное контекстуальное значение для иудейского повествования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сохраняет причинную связь и повтор глагола оригинала; местоимения оставлены там, где их референт — жертвенник — ясен из контекста.
