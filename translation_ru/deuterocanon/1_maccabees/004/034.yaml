  yaml_path: translation/deuterocanon/1_maccabees/004/034.yaml
  text: And they engaged one another in battle[a], and about five thousand men from the camp of Lysias fell[b], and they fell before them.
translation:
  language: ru
  text: И они сошлись друг с другом в бою, и из лагеря Лисия пало около пяти тысяч человек[a]; они пали перед ними[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пять тысяч человек». Греческий оборот с εἰς может обозначать приблизительное количество или итоговое число.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «напротив них»; греческое выражение обозначает положение лицом к противнику, напротив него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλον ἀλλήλοις
  choice: сошлись друг с другом в бою
  rationale: Военный оборот передаёт взаимное вступление противоборствующих сторон в сражение; формулировка естественна для современного русского повествования и сохраняет значение ἀλλήλοις.
- source_word: ἔπεσον / ἔπεσαν
  choice: пало / пали
  rationale: В повествовании о битве глагол означает гибель воинов, но буквальное «пали» сохраняет сдержанность и образность греческого текста. Повтор глагола в оригинале сохранён.
- source_word: ἐκ τῆς παρεμβολῆς Λυσίου
  choice: из лагеря Лисия
  rationale: παρεμβολή в данном военном контексте обозначает лагерь или расположенное в нём войско. «Из лагеря Лисия» непосредственно сохраняет пространственный образ и принадлежность.
- source_word: εἰς πεντακισχιλίους ἄνδρας
  choice: около пяти тысяч человек
  rationale: εἰς при числительном может указывать на приблизительное количество либо на число, до которого дошёл итог; «около» естественно передаёт эту возможность, не превращая число в заведомо точное.
- source_word: ἐξ ἐναντίας αὐτῶν
  choice: перед ними
  rationale: Выражение указывает на положение напротив противника. «Перед ними» естественно в контексте битвы, тогда как точный пространственный оттенок допускает также переводы «напротив них» и «лицом к ним».
