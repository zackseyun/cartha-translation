base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/056.yaml
  text: And they celebrated the dedication of the altar for eight days, and they offered whole burnt offerings with gladness, and they sacrificed a sacrifice of deliverance and praise.
translation:
  language: ru
  text: И восемь дней они праздновали освящение жертвенника, с радостью возносили всесожжения и приносили жертву спасения[a] и хвалы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мирную жертву». Буквально по-гречески: «жертву спасения и хвалы».'
    reason: Сохраняется неоднозначность между прозрачным значением греческого σωτηρίου («спасение, избавление») и возможным техническим обозначением мирной жертвы.
lexical_decisions:
- source_word: ἐποίησαν τὸν ἐγκαινισμὸν
  choice: праздновали освящение
  rationale: Сочетание буквально означает совершение обновления или посвящения; в данном контексте речь идёт о торжественном освящении восстановленного жертвенника. «Праздновали» естественно передаёт событийный смысл ἐποίησαν, а «освящение» — культовый характер ἐγκαινισμός.
- source_word: τοῦ θυσιαστηρίου
  choice: жертвенника
  rationale: Обычный и точный русский эквивалент культового термина θυσιαστήριον.
- source_word: ἡμέρας ὀκτώ
  choice: восемь дней
  rationale: Винительный длительности естественно передаётся по-русски оборотом «восемь дней».
- source_word: προσήνεγκαν
  choice: возносили
  rationale: В контексте жертвоприношения глагол означает принесение жертвы. «Возносили» сохраняет культовую окраску и позволяет избежать тесного повтора с последующим ἔθυσαν.
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Традиционный, точный и понятный библейский термин для жертв, целиком сжигаемых на жертвеннике.
- source_word: μετʼ εὐφροσύνης
  choice: с радостью
  rationale: Прямое и естественное выражение радостного характера торжества.
- source_word: ἔθυσαν
  choice: приносили
  rationale: В сочетании со словом «жертва» русское «приносили» звучит естественно и точно обозначает жертвенное действие.
- source_word: θυσίαν σωτηρίου
  choice: жертву спасения
  rationale: Формально сохраняет греческое σωτηρίου — «спасения, избавления», не сводя выражение безоговорочно к техническому названию мирной жертвы.
- source_word: αἰνέσεως
  choice: и хвалы
  rationale: Прямо передаёт зависимый родительный падеж и сохраняет параллель со «спасения».
theological_decisions:
- issue: Культовое значение θυσίαν σωτηρίου
  choice: жертву спасения
  alternative: мирную жертву; жертву благополучия
  rationale: В жертвенном контексте выражение может обозначать категорию мирных жертв, однако греческая форма сохраняет явную связь со спасением или избавлением. Основной текст передаёт эту связь буквально, а примечание фиксирует культовую альтернативу, не снимая неоднозначности.
- issue: Характер освящения жертвенника
  choice: освящение жертвенника
  alternative: обновление жертвенника; посвящение жертвенника
  rationale: После осквернения и восстановления жертвенника речь идёт о его новом введении в священное употребление. «Освящение» ясно и естественно передаёт культовый смысл, хотя ἐγκαινισμός также содержит оттенок обновления или торжественного посвящения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис сделан плавным, культовые термины сохранены без архаизации; повтор греческих глаголов передан различными естественными русскими сочетаниями.
