  text: Пока Иуда ещё говорил это вполголоса, показалась какая-то часть[a], выглянувшая из-за горы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «какая-то часть»; вероятно, имеется в виду часть неприятельского войска, показавшаяся из-за горы.'
    reason: Греческий текст прямо не называет, частью чего была показавшаяся группа; сноска поясняет вероятный военный контекст, не снимая неопределённости основного текста.
lexical_decisions:
- source_word: ἔτι ὑποφθεγγομένου Ἰούδου ταῦτα
  choice: Пока Иуда ещё говорил это вполголоса
  rationale: Передаёт одновременность действий, выраженную конструкцией с причастием, и сохраняет оттенок тихой, приглушённой речи у ὑποφθέγγομαι.
- source_word: ὤφθη
  choice: показалась
  rationale: 'Естественно передаёт пассивную форму с непереходным значением: нечто стало видимым.'
- source_word: μέρος τι
  choice: какая-то часть
  rationale: Сохраняет неопределённость и буквальный образ греческого текста, не добавляя прямо отсутствующих слов «войска» или «врагов».
- source_word: ἐκκύπτον
  choice: выходившая
  rationale: В данном повествовательном контексте причастие обозначает появление из-за укрытия или выход наружу; выбран нейтральный вариант без излишне конкретного «выглядывавшая».
- source_word: ἐκ τοῦ ὄρους
  choice: с горы
  rationale: Близко передаёт исходное направление ἐκ и сохраняет единственное число ὄρος.
