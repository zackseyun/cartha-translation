  yaml_path: translation/deuterocanon/1_maccabees/004/061.yaml
  text: And they stationed a force there to guard it[a], and they fortified it to guard Bethsura[b], so that the people might have a stronghold facing Idumea.
translation:
  language: ru
  text: И они поставили там отряд охранять его[a] и укрепили его для охраны Бетсуры[b], чтобы у народа была крепость напротив Идумеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «велели отряду охранять его». Греческий глагол может означать «приказать» или «назначить», но здесь, вероятно, речь идёт о размещении воинов на сторожевом посту.'
    reason: lexical_alternative
  - marker: b
    text: Бетсура — укреплённое место к югу от Иерусалима, занимавшее стратегическое положение на направлении к Идумее.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέταξαν
  choice: поставили
  rationale: В сочетании с δύναμιν и инфинитивом τηρεῖν глагол означает назначение военного отряда на сторожевой пост; «поставили» естественно передаёт это действие, сохраняя оттенок распоряжения.
- source_word: δύναμιν
  choice: отряд
  rationale: В данном военном контексте слово обозначает воинское подразделение или вооружённую силу; «отряд» звучит ясно и не уточняет его численность.
- source_word: τηρεῖν
  choice: охранять / для охраны
  rationale: Оба употребления относятся к военной охране места; небольшое синтаксическое варьирование делает русскую фразу естественной, не меняя смысла.
- source_word: ὠχύρωσαν
  choice: укрепили
  rationale: Глагол означает сделать место защищённым или укреплённым; «укрепили» сохраняет военно-оборонительный смысл.
- source_word: Βαιθσουρά
  choice: Бетсура
  rationale: Название передано транслитерацией греческой формы в современной русской орфографии.
- source_word: τοῦ ἔχειν
  choice: чтобы ... была
  rationale: Конструкция с артиклевым инфинитивом выражает цель; русское «чтобы» ясно передаёт целевое значение.
- source_word: ὀχύρωμα
  choice: крепость
  rationale: Существительное обозначает укреплённое оборонительное место; «крепость» естественно и точно в данном стратегическом контексте.
- source_word: κατὰ πρόσωπον τῆς Ἰδουμαίας
  choice: напротив Идумеи
  rationale: Выражение пространственно указывает на положение перед Идумеей, лицом к ней; «напротив Идумеи» сохраняет этот образ без лишнего уточнения.
