lexical_decisions:
- source_word: ἀλλοφύλων
  choice: иноплеменников
  rationale: Передаёт обозначение людей, принадлежащих к иному народу, и сохраняет историко-библейский оттенок без чрезмерно современного значения слова «иностранцы».
- source_word: διεσώθησαν
  choice: удалось спастись
  rationale: Естественно выражает успешное избавление уцелевших из разгромленного войска.
- source_word: παραγενηθέντες
  choice: добравшись до Лисия
  rationale: Причастие означает прибытие; дополнение «до Лисия» естественно по-русски связывает прибытие с последующим сообщением ему.
- source_word: ἀπήγγειλαν
  choice: рассказали
  rationale: В данном повествовательном контексте передаёт сообщение о случившемся естественнее, чем канцелярское «доложили».
- source_word: πάντα τὰ συμβεβηκότα
  choice: обо всём, что произошло
  rationale: Точно и идиоматично передаёт совокупность случившихся событий.
