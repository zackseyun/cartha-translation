lexical_decisions:
- source_word: ὥστε
  choice: чтобы
  rationale: В данном контексте союз с инфинитивами выражает цель предшествующего передвижения войска; русское «чтобы» передаёт это естественно и без излишнего акцента на достигнутом результате.
- source_word: ἐπιβαλεῖν ἐπὶ
  choice: напасть на
  rationale: Сочетание обозначает направленное силовое выступление против цели; «напасть на» ясно и естественно передаёт военный смысл.
- source_word: παρεμβολή
  choice: стан
  rationale: В военном контексте слово означает лагерь или стан. «Стан» сохраняет краткость и соответствует достоинству библейского повествования, оставаясь понятным современному читателю.
- source_word: πατάξαι
  choice: поразить
  rationale: Глагол обозначает нанесение удара и по контексту может предполагать тяжёлое или смертельное поражение, но сам по себе не требует перевода «убить».
- source_word: ἄφνω
  choice: внезапно
  rationale: Прямо передаёт идею неожиданной, стремительной атаки, не добавляя отсутствующего в слове специального значения засады.
- source_word: οἱ υἱοὶ τῆς ἄκρας
  choice: люди из крепости
  rationale: Буквально «сыновья крепости», но здесь это обозначение связанных с крепостью людей, а не родства. Функциональный перевод звучит естественно и не уточняет без достаточного основания, были ли они именно гарнизоном.
- source_word: ἄκρα
  choice: крепость
  rationale: Слово обозначает укреплённую цитадель; здесь, вероятно, имеется в виду иерусалимская Акра. В основном тексте «крепость» непосредственно сообщает смысл, а название и буквальная форма отмечены в сноске.
- source_word: ὁδηγοί
  choice: проводниками
  rationale: В контексте скрытого военного подхода речь идёт о людях, указывавших путь; «проводники» точнее ситуативного русского, чем общее «вожди».
