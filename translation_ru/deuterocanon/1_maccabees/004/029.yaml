  yaml_path: translation/deuterocanon/1_maccabees/004/029.yaml
  text: And they came into Idumea and encamped at Beth-zur[a], and Judas met them with ten thousand men.
translation:
  language: ru
  text: Они пришли в Идумею и расположились лагерем у Вефсуры[a]. Иуда выступил им навстречу с десятью тысячами воинов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — Βηθορούς; по контексту это Вефсура (Бет-Цур).
    reason: Необычная форма топонима допускает разное отождествление; сноска открыто сообщает форму источника и принятое контекстуальное понимание.
lexical_decisions:
- source_word: ἦλθον εἰς τὴν Ἰδουμαίαν
  choice: пришли в Идумею
  rationale: Простая повествовательная формула движения; название Ἰδουμαία передано как историко-географическое «Идумея», а не заменено более древним названием «Эдом».
- source_word: παρεμβάλον
  choice: расположились лагерем
  rationale: В военном контексте глагол означает разбить или устроить лагерь; выбран естественный современный русский оборот.
- source_word: ἐν Βηθορούς
  choice: у Вефсуры
  rationale: По контексту похода через Идумею речь идёт о крепости Бет-Цур, традиционно называемой по-русски Вефсурой. Предлог «у» естественно обозначает расположение войска возле укреплённого пункта; необычная греческая форма отмечена в сноске.
- source_word: συνήντησεν αὐτοῖς
  choice: выступил им навстречу
  rationale: В военном повествовании выражение обозначает не случайную встречу, а целенаправленный выход навстречу противнику; перевод сохраняет это значение без прямого добавления упоминания битвы.
- source_word: ἐν δέκα χιλιάσιν ἀνδρῶν
  choice: с десятью тысячами воинов
  rationale: Предлог ἐν здесь указывает на сопровождающую силу. Хотя ἀνδρῶν буквально означает «мужей/мужчин», военный контекст естественно передаётся словом «воинов».
