translation:
  language: ru
  text: И они совещались о том, что делать с осквернённым жертвенником всесожжения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с обесчещенным жертвенником всесожжения»; или: «с поруганным жертвенником всесожжения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: стали совещаться
  rationale: Средняя форма передаёт совместное обсуждение и поиск решения, а не только уже принятое решение.
- source_word: θυσιαστηρίου
  choice: жертвенником
  rationale: Обычное культовое значение слова; следующий родительный оборот уточняет назначение жертвенника.
- source_word: ὁλοκαυτώσεως
  choice: всесожжения
  rationale: Указывает на жертвенник, предназначенный для жертв всесожжения; это точный и привычный русский библейский термин.
- source_word: βεβηλωμένου
  choice: осквернённым
  rationale: Передаёт совершившееся культовое осквернение священного предмета, не конкретизируя способ нарушения святости.
- source_word: τί αὐτῷ ποιήσωσιν
  choice: что сделать с
  rationale: Естественно передаёт предмет обсуждения — как поступить с жертвенником, не предполагая заранее конкретного действия над ним.
theological_decisions:
- issue: Культовое состояние жертвенника
  choice: осквернённым жертвенником всесожжения
  alternative: обесчещенным / лишённым святости жертвенником всесожжения
  rationale: «Осквернённым» сохраняет культовый смысл βεβηλωμένου и не добавляет конфессионального толкования; другие варианты лексически возможны.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественной библейской лексикой. Синтаксис перестроен естественно для русского: вопрос τί αὐτῷ ποιήσωσιν включён в оборот «о том, что сделать с…», при этом смысл совместного совещания сохранён.'
