base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/059.yaml
  text: And Judas and his brothers and all the assembly of Israel decreed that the days of the dedication of the altar should be observed at their appointed times[a], year by year, for eight days, from the twenty-fifth day of the month Chislev, with gladness and joy.
translation:
  language: ru
  text: Иуда, его братья и всё собрание Израиля постановили, чтобы дни посвящения жертвенника праздновались в установленные для них сроки, из года в год, в течение восьми дней, начиная с двадцать пятого дня месяца кислева[a], с ликованием и радостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая форма Χασελεύ передаёт название иудейского месяца, по-русски обычно называемого «кислев».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: постановили
  rationale: В сочетании с последующим оборотом ἵνα глагол обозначает установление обязательного ежегодного празднования; множественное число естественно согласует сказуемое с составным подлежащим в русском языке.
- source_word: ἐκκλησία
  choice: собрание
  rationale: Речь идёт о собранном народе Израиля в дохристианском иудейском контексте; «собрание» передаёт значение без позднейших церковных ассоциаций.
- source_word: ἵνα ἄγωνται
  choice: чтобы … праздновались
  rationale: Оборот означает регулярное соблюдение праздничных дней; «праздновались» естественно передаёт как соблюдение, так и радостный характер события.
- source_word: ἐγκαινισμοῦ τοῦ θυσιαστηρίου
  choice: посвящения жертвенника
  rationale: ἐγκαινισμός в данном культовом контексте обозначает посвящение восстановленного жертвенника; «жертвенник» точно передаёт θυσιαστήριον.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: в установленное для них время
  rationale: Фраза указывает на закреплённый календарный срок ежегодного праздника и сохраняет соотнесённость местоимения с праздничными днями.
- source_word: ἐνιαυτὸν κατʼ ἐνιαυτὸν
  choice: из года в год
  rationale: Устойчивый русский оборот точно выражает ежегодное повторение.
- source_word: ἡμέρας ὀκτώ
  choice: восемь дней
  rationale: Передаёт продолжительность празднования без ненужного пояснения.
- source_word: ἀπὸ τῆς πέμπτης καὶ εἰκάδος
  choice: начиная с двадцать пятого дня
  rationale: ἀπό обозначает начальную точку восьмидневного периода; «начиная с» ясно выражает эту временную функцию.
- source_word: τοῦ μηνὸς Χασελεὺ
  choice: месяца кислева
  rationale: «Кислев» — узнаваемая русская форма названия иудейского месяца; особенность греческого написания отмечена в сноске.
- source_word: μετʼ εὐφροσύνης καὶ χαρᾶς
  choice: с ликованием и радостью
  rationale: Сохраняется усилительная пара двух существительных, выражающих праздничную радость.
theological_decisions:
- issue: Передача ἐκκλησία в иудейском контексте Второго храма
  choice: собрание
  alternative: община; народ
  rationale: «Собрание» обозначает совокупно собранный Израиль и не переносит в текст более позднее специально христианское значение слова «церковь».
- issue: Значение ἐγκαινισμός применительно к жертвеннику
  choice: посвящение
  alternative: освящение; обновление
  rationale: «Посвящение» сохраняет культовый смысл введения восстановленного жертвенника в священное употребление, не сводя слово только к материальному обновлению и не добавляя конфессиональной конкретизации обряда.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; сохранены календарная точность, коллективный характер постановления и двойное выражение праздничной радости.
