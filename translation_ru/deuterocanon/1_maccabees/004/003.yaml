lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал
  rationale: Сохраняет отсутствие явно названного дополнения в греческом тексте и допускает как буквальное слышание, так и получение известия.
- source_word: ἀπῆρεν
  choice: выступили
  rationale: Передаёт целенаправленное отправление для военного действия; множественное число естественно согласует сказуемое с составным русским подлежащим «он и сильные воины».
- source_word: οἱ δυνατοὶ
  choice: сильные воины
  rationale: Сочетает буквальное значение «сильные» с очевидным в данном контексте военным смыслом, не добавляя отсутствующего в греческом притяжательного местоимения.
- source_word: πατάξαι
  choice: поразить
  rationale: Сохраняет образ удара и не представляет победу как уже достигнутый результат; слово уместно в достойном повествовательном регистре.
- source_word: τὴν δύναμιν
  choice: войско
  rationale: В военном контексте δύναμις обозначает вооружённые силы; «войско» естественно и ясно по-русски, не обязательно подразумевая постоянную регулярную армию.
- source_word: τοῦ βασιλέως
  choice: царя
  rationale: Родительный падеж естественно передаёт принадлежность войска царю.
- source_word: τὴν ἐν Ἐμμαούμ
  choice: находившееся в Эммаусе
  rationale: Точно определяет войско по его местонахождению, не добавляя более узкого смысла «расположенное» или «стоявшее лагерем».
