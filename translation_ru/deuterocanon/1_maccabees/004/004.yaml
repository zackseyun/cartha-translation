lexical_decisions:
- source_word: ἕως ἔτι
  choice: пока ... ещё
  rationale: Сжатое греческое сочетание в данном контексте естественно выражает промежуток времени, в течение которого должно произойти действие; перевод сохраняет временное значение обоих элементов.
- source_word: αἱ δυνάμεις
  choice: войска
  rationale: Во множественном числе δύναμις обозначает военные силы; «войска» естественно для современного русского языка и не уточняет их организационную структуру.
- source_word: ἐσκορπισμέναι
  choice: были рассеяны
  rationale: Причастие указывает, что войска не были собраны вместе; «рассеяны» прямо передаёт это состояние.
- source_word: ἀπὸ τῆς παρεμβολῆς
  choice: вне лагеря
  rationale: παρεμβολή в военном контексте означает «лагерь», а ἀπό выражает удалённость от него. «Вне лагеря» передаёт пространственный смысл естественнее, чем буквальное «от лагеря».
