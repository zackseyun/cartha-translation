  text: And they took whole stones according to the law[b][a], and built a new altar as before.
translation:
  language: ru
  text: И взяли они цельные камни согласно Закону[a], и построили новый жертвенник, подобный прежнему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «нетёсаные камни». По-гречески буквально: «цельные камни»; слова «согласно Закону», вероятно, отсылают к предписаниям Торы о камнях для жертвенника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как прежде»; возможно также: «по прежнему образцу».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: взяли
  rationale: 'Конкретное значение аориста λαμβάνω в данном контексте: они взяли материал для строительства.'
- source_word: λίθους ὁλοκλήρους
  choice: цельные камни
  rationale: ὁλόκληρος означает «целый, цельный, неповреждённый». Перевод сохраняет прямое значение греческого выражения, не подменяя его вероятным подразумеваемым смыслом «нетёсаные».
- source_word: κατὰ τὸν νόμον
  choice: согласно Закону
  rationale: Обычное выражение соответствия законному предписанию; прописная буква указывает на Закон как Тору и естественна в данном контексте.
- source_word: ᾠκοδόμησαν
  choice: построили
  rationale: Глагол означает «строить, сооружать». Вариант «восстановили» добавил бы смысл, прямо не выраженный греческим текстом.
- source_word: θυσιαστήριον καινὸν
  choice: новый жертвенник
  rationale: Прямой и естественный перевод существительного θυσιαστήριον и определения καινός.
- source_word: κατὰ τὸ πρότερον
  choice: подобный прежнему
  rationale: Средний род τὸ πρότερον допускает отнесение к прежнему жертвеннику; перевод передаёт соответствие нового жертвенника прежнему, а наречное понимание отмечено в сноске.
theological_decisions:
- issue: Следует ли прямо назвать камни нетёсаными ввиду требований Торы
  choice: В основном тексте оставить «цельные камни».
  alternative: «нетёсаные камни»
  rationale: Греческий текст буквально говорит о цельных или неповреждённых камнях, а связь с требованиями Торы отдельно выражена словами «согласно Закону». Перевод «нетёсаные» вероятен по смыслу, но делает подразумеваемое явным.
- issue: Относится ли κατὰ τὸ πρότερον к прежнему жертвеннику или к прежнему способу строительства
  choice: «подобный прежнему»
  alternative: «как прежде»; «по прежнему образцу»
  rationale: Форма среднего рода позволяет соотнести выражение с θυσιαστήριον, также среднего рода, однако греческая конструкция сохраняет возможность наречного понимания; она отражена в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис торжественный, но понятный. Лексика «Закон» и «жертвенник» сохраняет библейский регистр без архаизации.
