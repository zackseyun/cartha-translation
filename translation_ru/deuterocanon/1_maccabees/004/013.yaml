lexical_decisions:
- source_word: ἐξῆλθαν
  choice: вышли
  rationale: Прямо передаёт аорист глагола движения из какого-либо места, не добавляя отсутствующего в греческом тексте указания на марш.
- source_word: παρεμβολῆς
  choice: лагеря
  rationale: В данном военном контексте слово обозначает лагерь; это естественный и точный современный русский эквивалент.
- source_word: εἰς πόλεμον
  choice: на битву
  rationale: Передаёт направленность на непосредственное сражение; вариант «на войну» был бы здесь чрезмерно широким.
- source_word: ἐσάλπισαν
  choice: затрубили
  rationale: Русский глагол естественно выражает подачу сигнала трубами без обязательного добавления названия инструмента, которого в греческом тексте нет.
- source_word: οἱ παρὰ Ἰούδου
  choice: бывшие с Иудой
  rationale: Сохраняет нейтральное обозначение сопровождавшей Иуду группы и не усиливает его до более интерпретирующего «люди Иуды».
- source_word: Ἰούδου
  choice: Иудой
  rationale: Традиционная русская форма имени персонажа; творительный падеж обусловлен предлогом «с».
