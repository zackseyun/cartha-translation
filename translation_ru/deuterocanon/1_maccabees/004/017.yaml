lexical_decisions:
- source_word: ἐπιθυμήσητε
  choice: стремитесь
  rationale: Глагол выражает сильное желание или устремление. В военном наставлении «не стремитесь к добыче» звучит естественно и передаёт запрет преждевременно увлекаться трофеями, не добавляя специфического оттенка заповеди «не пожелай».
- source_word: σκύλων
  choice: добыче
  rationale: Множественное число σκῦλα обозначает захваченные у неприятеля вещи, военную добычу. Русское собирательное «добыча» ясно и уместно в современном литературном тексте.
- source_word: πόλεμος
  choice: битва
  rationale: Хотя πόλεμος может означать войну в целом, контекст говорит о непосредственно предстоящем столкновении, поэтому «битва» точнее.
- source_word: ἐξ ἐναντίας ἡμῶν
  choice: ещё впереди
  rationale: Греческое выражение буквально указывает на то, что битва находится напротив, перед ними. В данном призыве «ещё впереди» естественно передаёт пространственный образ и смысл незавершённого противостояния.
- source_word: λαόν
  choice: народу
  rationale: Сохранено широкое значение греческого λαός без интерпретирующего сужения до «воинов» или «войска».
