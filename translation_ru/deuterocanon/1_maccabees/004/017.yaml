  verdict: revise
  source_fidelity: «Не стремитесь к добыче» передаёт общий призыв, но греческое ἐπιθυμέω точнее выражено как «не желайте». Существеннее, что «битва ещё впереди» добавляет временной оттенок («ещё») и не передаёт прямо ἐξ ἐναντίας ἡμῶν — «перед нами / против нас».
  naturalness: Исправленный вариант краток, естествен для современного литературного русского и сохраняет торжественно-воинский регистр прямой речи.
  terminology: «Добыча» удачно передаёт σκῦλα как военные трофеи. «Битва» оправданно передаёт πόλεμος в данном ближайшем тактическом контексте. «Перед нами» сохраняет пространственную образность оригинала, не устраняя возможный смысл противостояния.
  issues:
