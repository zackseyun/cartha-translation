    issue: Добавленное слово «ещё»
    rationale: В греческом нет указания на временное «ещё»; ἐξ ἐναντίας ἡμῶν означает, что битва находится перед ними, напротив них или против них.
  - severity: low
    issue: «Не стремитесь» вместо «Не желайте»
    rationale: «Стремиться к добыче» возможно по-русски, но смещает значение сильного желания к целенаправленному действию. «Не желайте» ближе к ἐπιθυμήσητε и столь же естественно в этом регистре.
