translation:
  language: ru
  text: И он выбрал безупречных священников[a], преданных Закону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священников, не имеющих изъяна, ревнителей Закона». Греческие слова могут подчёркивать как отсутствие порока или изъяна, так и горячую приверженность Закону.'
    reason: Лексические альтернативы сохраняют обрядовый оттенок ἀμώμους и более энергичное прочтение θελητάς.
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: выбрал
  rationale: Аорист ἐπιλέγω обозначает совершённый и намеренный выбор; «выбрал» естественно передаёт это действие по-русски.
- source_word: ἱερεῖς
  choice: священников
  rationale: Обычное обозначение священников в иудейском храмовом контексте.
- source_word: ἀμώμους
  choice: безупречных
  rationale: Слово может указывать как на отсутствие вины, так и на отсутствие изъяна, особенно значимое применительно к священникам. «Безупречных» сохраняет эту широту, а обрядовый оттенок отмечен в сноске.
- source_word: θελητὰς
  choice: преданных
  rationale: θελητής обозначает того, кто желает чего-либо или расположен к этому. В сочетании с νόμου речь идёт о сознательной положительной приверженности; «преданных» звучит естественно и не сводит смысл к простой готовности.
- source_word: νόμου
  choice: Закону
  rationale: В контексте 1 Маккавейской книги имеется в виду известный читателям иудейский Закон, а не закон вообще. Заглавная буква естественно обозначает Тору в современной русской библейской речи.
theological_decisions:
- issue: Передавать ли νόμου как закон вообще или как конкретный иудейский Закон
  choice: Закону
  alternative: закону
  rationale: Хотя в греческом существительное употреблено без артикля, в 1 Маккавейской книге νόμος обычно означает отеческий иудейский Закон. Заглавная буква передаёт эту определённость, не добавляя конфессионального толкования.
- issue: Понимать ли ἀμώμους преимущественно нравственно или как указание на отсутствие телесного/обрядового изъяна
  choice: безупречных, с сохранением двойного оттенка в сноске
  alternative: не имеющих изъяна
  rationale: Священнический контекст допускает обрядовую пригодность, тогда как само слово также выражает безукоризненность. Основной текст не должен неоправданно устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок слов слегка подчёркивает качества избранных священников; «преданных Закону» естественно передаёт их деятельную приверженность.
