    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: повернув назад
  rationale: Аористное причастие передаёт предшествующее действие и сохраняет значение изменения направления, не уточняя места назначения.
- source_word: ὕμνουν
  choice: пели гимны
  rationale: Глагол ὑμνέω обозначает исполнение хвалебных песнопений; перевод сохраняет музыкальный и богослужебный оттенок.
- source_word: ᾐνοῦν
  choice: воздавали хвалу
  rationale: Отдельный перевод второго глагола, αἰνέω, сохраняет парную конструкцию и не сливает её с пением гимнов.
- source_word: εἰς οὐρανόν
  choice: небу
  rationale: Буквально речь направлена «к небу»; в данном контексте это почтительное иносказательное обозначение Бога. Форма «небу» естественна по-русски после «воздавали хвалу».
- source_word: Ὅτι καλὸν
  choice: Ибо Он благ
  rationale: Формула перекликается с библейскими славословиями о благости Бога. Хотя греческое καλόν формально допускает безличное понимание, следующее «милость Его» поддерживает личный смысл.
- source_word: εἰς τὸν αἰῶνα
  choice: вовек
  rationale: Краткий традиционный русский эквивалент выражения вечной продолжительности, уместный в литургической формуле.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: милость Его
  rationale: ἔλεος прямо означает милость, сострадание; порядок слов сохраняет возвышенный характер формулы и остаётся понятным современному читателю.
theological_decisions:
- issue: Неявное подлежащее в формуле хвалы
  choice: 'Личное прочтение о Боге: «Ибо Он благ»'
  alternative: 'Безличное прочтение: «Ибо это благо»'
  rationale: Контекст хвалы, направленной к небу, и местоимение в выражении «милость Его» делают личное прочтение наиболее вероятным, но формальная неоднозначность греческого отмечена в сноске.
- issue: «Небо» как почтительное обозначение Бога
  choice: Сохранить буквальный образ «небу» и пояснить его
  alternative: 'Передать прямо: «Богу»'
  rationale: Так сохраняется исходное иносказание без затемнения его подразумеваемого адресата.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом, соответствующим повествованию и цитируемой богослужебной формуле. Архаическое «вовек» сохранено как общеупотребительное в библейском славословии; остальные формулировки естественны для современного читателя.
