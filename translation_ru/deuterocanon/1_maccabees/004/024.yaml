  text: 'And when they turned back, they sang hymns and gave praise to heaven: “For he is good; his mercy endures forever.”'
translation:
  language: ru
  text: 'И, возвратившись, они пели гимны и воздавали хвалу небу[a]: «Ибо Он благ[b], и милость Его — вовек».'
  philosophy: optimal-equivalence
  footnotes:
