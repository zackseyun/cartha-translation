lexical_decisions:
- source_word: ἴδεν
  choice: увидел
  rationale: Аорист от ὁράω обозначает непосредственное зрительное восприятие; простое «увидел» естественно вводит наблюдение в повествовании.
- source_word: τετρόπωται
  choice: обращены в бегство
  rationale: Перфектная форма от τρέπω в военном контексте указывает на уже совершившееся отступление вследствие натиска. Пассивное выражение передаёт военный смысл, не усиливая его до полного уничтожения или окончательного поражения.
- source_word: ἐνπυρίζουσιν
  choice: поджигают
  rationale: Настоящее время передаёт продолжающееся действие, а глагол означает предавать огню, поджигать.
- source_word: τὴν παρεμβολήν
  choice: лагерь
  rationale: В данном военном повествовании παρεμβολή означает военный лагерь; это точный и естественный современный русский эквивалент.
- source_word: ὁ καπνὸς ὁ θεωρούμενος
  choice: видимый дым
  rationale: Причастие от θεωρέω подчёркивает, что дым можно было наблюдать; «видимый дым» кратко и естественно сохраняет эту характеристику.
- source_word: ἐνεφάνιζε
  choice: ясно показывал
  rationale: Глагол означает делать явным, обнаруживать; сочетание передаёт очевидность вывода по дыму.
- source_word: τὸ γεγονός
  choice: что произошло
  rationale: Субстантивированная перфектная форма обозначает уже совершившееся событие или положение дел; русская конструкция звучит естественно и сохраняет временной оттенок.
