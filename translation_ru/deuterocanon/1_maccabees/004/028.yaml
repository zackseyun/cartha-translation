  text: And in the following year he assembled sixty thousand chosen men and five thousand cavalry[b][a], so as to make war against them.
translation:
  language: ru
  text: А на следующий год он собрал шестьдесят тысяч отборных воинов и пять тысяч всадников, чтобы пойти на них войной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ἐρχομένῳ ἐνιαυτῷ
  choice: на следующий год
  rationale: Буквально — «в наступающем году»; в повествовательной последовательности естественное русское соответствие — «на следующий год».
- source_word: συνελόχησεν
  choice: собрал
  rationale: Глагол обозначает сбор и формирование войска; «собрал» ясно передаёт смысл, не добавляя отсутствующих в греческом тексте подробностей.
- source_word: ἀνδρῶν ἐπιλέκτων
  choice: отборных воинов
  rationale: ἐπίλεκτος указывает на специально отобранных людей; «воины» естественно проясняет их военную роль, заданную контекстом.
- source_word: ἑξήκοντα χιλιάδας
  choice: шестьдесят тысяч
  rationale: Прямое воспроизведение численности пешего войска.
- source_word: πεντακισχιλίαν ἵππον
  choice: пять тысяч всадников
  rationale: ἵππος употреблено как военное собирательное обозначение конницы; в русском счёт людей естественно передаётся словом «всадников».
- source_word: ὥστε ἐκπολεμῆσαι αὐτούς
  choice: чтобы пойти на них войной
  rationale: Оборот передаёт цель военного сбора, а ἐκπολεμέω означает вести или начинать войну против кого-либо; выбранная формулировка естественна и сохраняет силу выражения.
