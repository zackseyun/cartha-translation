  text: Then Judas ordered men to fight those in the citadel until he had cleansed the sanctuary[a].
translation:
  language: ru
  text: Тогда Иуда велел людям сражаться с теми, кто был в крепости[a], до тех пор, пока он не очистит святилище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Акре» — укреплённой цитадели в Иерусалиме.'
    reason: Сохраняет вероятное историко-географическое значение ἄκρα как названия конкретной крепости.
lexical_decisions:
- source_word: ἐπέταξεν
  choice: велел
  rationale: Передаёт властное распоряжение естественным современным русским языком; «приказал» также возможно, но в сочетании с инфинитивом «велел» звучит плавнее.
- source_word: ἀνδράσιν
  choice: воинам
  rationale: Буквально — «мужам», однако военный контекст ясно указывает на назначенных для боя людей. «Воинам» естественно по-русски и не добавляет более узкого значения, чем допускает контекст.
- source_word: πολεμεῖν
  choice: сражаться
  rationale: Точно и идиоматично передаёт продолжительное вооружённое противостояние, порученное этим людям.
- source_word: τοὺς ἐν τῇ ἄκρᾳ
  choice: с теми, кто находился в крепости
  rationale: ἄκρα обозначает укреплённую цитадель; в данном контексте, вероятно, имеется в виду конкретная иерусалимская Акра. Описательный перевод оставлен в тексте, а историческое название — в сноске.
- source_word: ἕως
  choice: пока … не
  rationale: Обычная русская конструкция для обозначения временного предела действия и ожидаемого результата.
- source_word: καθαρίσῃ
  choice: он не очистит
  rationale: Аорист конъюнктива после ἕως указывает на ожидаемое завершение очищения. Единственное число естественнее всего относит действие к Иуде; настоящее-будущее в конструкции «пока не» идиоматично в русском повествовании.
- source_word: τὰ ἅγια
  choice: святилище
  rationale: В храмовом контексте субстантивированное множественное среднего рода означает священное пространство, а не отвлечённо «святыни» или отдельные священные предметы.
theological_decisions:
- issue: Референт ἄκρα
  choice: В основном тексте — «крепость», в сноске — «Акра», укреплённая цитадель в Иерусалиме.
  alternative: «Акра» непосредственно в основном тексте; «цитадель».
  rationale: Греческое слово формально является нарицательным, но в маккавейском историческом контексте, вероятно, обозначает конкретную иерусалимскую твердыню. Текст сохраняет понятность, а сноска — историческую определённость.
- issue: Субъект καθαρίσῃ
  choice: 'Иуда: «пока он не очистит».'
  alternative: 'Неопределённо или пассивно: «пока святилище не будет очищено».'
  rationale: Форма глагола стоит в единственном числе, и ближайший явно названный субъект — Иуда. Перевод не превращает активную конструкцию в пассивную, хотя практическое очищение могло совершаться назначенными людьми.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Военный контекст передан естественно, без архаизмов; историческая неоднозначность слова ἄκρα сохранена посредством сноски.
