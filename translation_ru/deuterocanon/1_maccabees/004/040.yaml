translation:
  language: ru
  text: И они пали лицом на землю, затрубили в сигнальные трубы[a] и воззвали к небу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в трубы сигналов». Вероятно, речь идёт о трубах, которыми подавали сигналы, а не о трубах при знамёнах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσον ἐπὶ πρόσωπον ἐπὶ τὴν γῆν
  choice: пали лицом на землю
  rationale: Передаёт буквально описанную позу и естественно звучит по-русски, не подменяя физическое действие более истолковывающим «простёрлись ниц».
- source_word: ἐσάλπισαν
  choice: затрубили
  rationale: Русский глагол прямо и естественно передаёт действие — трубить в трубы — без лишних добавлений.
- source_word: ταῖς σάλπιγξιν τῶν σημαιῶν
  choice: в сигнальные трубы
  rationale: 'Родительный оборот, вероятнее всего, указывает на назначение труб: ими подавали сигналы. Формулировка сохраняет этот смысл и остаётся ясной для современного читателя.'
- source_word: ἐβόησαν εἰς οὐρανόν
  choice: воззвали к небу
  rationale: «Воззвали» передаёт громкий, настойчивый призыв, а «к небу» сохраняет направленность εἰς οὐρανόν без явной замены «неба» словом «Бог».
theological_decisions:
- issue: Адресат воззвания в выражении εἰς οὐρανόν
  choice: к небу
  alternative: к Богу
  rationale: Греческий текст прямо говорит «к небу». Перевод не раскрывает эту метонимию как «к Богу», сохраняя образность и формальную неоднозначность исходного выражения.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис краток и ритмичен; «воззвали» сохраняет возвышенный оттенок, оставаясь понятным современному читателю.
