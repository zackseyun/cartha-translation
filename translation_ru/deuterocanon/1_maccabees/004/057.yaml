    reason: lexical_alternative
lexical_decisions:
- source_word: κατεκόσμησαν
  choice: украсили
  rationale: Глагол обозначает украшение, придание чему-либо нарядного вида; это естественный и точный русский эквивалент.
- source_word: τὸ κατὰ πρόσωπον τοῦ ναοῦ
  choice: переднюю часть храма
  rationale: Оборот указывает на лицевую, обращённую вперёд часть храмового здания; перевод ясен и не вводит излишне специального термина «фасад».
- source_word: στεφάνοις χρυσοῖς
  choice: золотыми венцами
  rationale: στέφανος может означать венец, венок или декоративную гирлянду. «Венцы» сохраняют основной образ, а контекстуальная альтернатива отмечена в сноске.
- source_word: ἀσπιδίσκαις
  choice: маленькими щитами
  rationale: Уменьшительная форма от ἀσπίς указывает на небольшие щиты, вероятно декоративные; перевод понятен современному читателю.
- source_word: ἐνεκαίνισαν
  choice: обновили
  rationale: Хотя глагол способен означать новое посвящение или торжественное введение в употребление, прямые дополнения «ворота» и «боковые помещения» здесь поддерживают значение обновления или восстановления.
- source_word: πύλας
  choice: ворота
  rationale: πύλαι обозначает ворота; выбор также сохраняет различие с дверями, прямо названными в следующем глаголе.
- source_word: παστοφόρια
  choice: боковые помещения
  rationale: Термин обозначает помещения храмового комплекса, но их конкретная функция не определена достаточно ясно; нейтральный перевод не сужает значение до кладовых или священнических комнат.
- source_word: ἐθύρωσαν αὐτά
  choice: снабдили их дверями
  rationale: Глагол буквально означает устроить или установить двери; местоимение естественно относится к воротам и боковым помещениям вместе.
