base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/049.yaml
  text: And they made new holy vessels[b][a], and they brought the lampstand and the altar of burnt offerings and of incense and the table into the temple.
translation:
  language: ru
  text: И сделали они новую священную утварь и внесли светильник, жертвенник всесожжений и воскурений[a] и стол в святилище[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слово «жертвенник» стоит в единственном числе, а «всесожжений» и «воскурений» оба относятся к нему. По устройству храма речь обычно идёт о двух разных жертвенниках.
    reason: lexical_alternative
  - marker: b
    text: Здесь «святилище» означает внутреннее здание храма, а не весь храмовый комплекс.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: сделали
  rationale: Прямо передаёт изготовление новых предметов, не добавляя указания на особую технику работы.
- source_word: τὰ σκεύη τὰ ἅγια
  choice: священные принадлежности
  rationale: В храмовом контексте σκεύη обозначает предметы и утварь для богослужения; «принадлежности» понятно современному читателю и не сужает значение до сосудов.
- source_word: καινά
  choice: новые
  rationale: καινά указывает на вновь изготовленные, а не только восстановленные предметы.
- source_word: εἰσήνεγκαν
  choice: внесли
  rationale: Глагол естественно передаёт перемещение названных предметов внутрь святилища.
- source_word: τὴν λυχνίαν
  choice: светильник
  rationale: В культовом контексте λυχνία обозначает храмовый светильник; это традиционный и понятный русский термин.
- source_word: τὸ θυσιαστήριον τῶν ὁλοκαυτωμάτων καὶ θυμιαμάτων
  choice: жертвенник всесожжений и воскурений
  rationale: Сохраняет единственное число θυσιαστήριον и зависимость обоих родительных от него, не устраняя синтаксическую неоднозначность греческого текста.
- source_word: τὴν τράπεζαν
  choice: стол
  rationale: Греческий текст говорит просто о столе; уточнение о хлебах предложения добавило бы отсутствующие здесь слова.
- source_word: εἰς τὸν ναόν
  choice: в святилище
  rationale: ναός здесь означает внутреннее здание храма, а не весь храмовый комплекс; «святилище» точно выражает этот смысл.
theological_decisions:
- issue: Идентификация жертвенника или жертвенников
  choice: 'Сохранить грамматическое единственное число: «жертвенник всесожжений и воскурений».'
  alternative: 'Передать подразумеваемые два предмета: «жертвенник всесожжений и жертвенник воскурений» либо, исходя из храмового контекста, упомянуть только жертвенник воскурений.'
  rationale: В представленном греческом тексте стоит одно существительное θυσιαστήριον, с которым связаны оба родительных. Хотя известное устройство храма предполагает два разных жертвенника и создаёт смысловое напряжение, перевод не должен молча исправлять или разворачивать исходный текст.
- issue: Уточнение назначения стола
  choice: Оставить «стол» без поясняющего добавления.
  alternative: «стол хлебов предложения»
  rationale: Назначение предмета ясно из храмового контекста, но прямо в этом стихе не названо.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Начальное «И» и инверсия «сделали они» сохраняют повествовательную связность и достоинство, не создавая чрезмерно архаичного звучания.
