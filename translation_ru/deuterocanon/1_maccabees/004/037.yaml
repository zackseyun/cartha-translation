lexical_decisions:
- source_word: συνήχθη
  choice: собрался
  rationale: Аорист пассивного залога от συνάγω здесь естественно передаёт совместное действие всего стана; русское «собрался» сохраняет собирательный смысл без тяжеловесного «был собран».
- source_word: ἡ παρεμβολὴ πᾶσα
  choice: весь стан
  rationale: παρεμβολή в данном военном контексте означает стан или лагерь, а πᾶσα подчёркивает полноту состава. «Весь стан» — краткое, достойное и понятное обозначение собравшегося войска.
- source_word: ἀνέβησαν
  choice: они поднялись
  rationale: Глагол обозначает движение вверх; «поднялись» естественно передаёт как высоту места, так и направленное движение, не добавляя отсутствующего в тексте указания на марш.
- source_word: εἰς ὄρος Σιών
  choice: на гору Сион
  rationale: εἰς при глаголе движения указывает направление, ὄρος означает гору, а несклоняемая форма «Сион» соответствует современной русской библейской норме.
