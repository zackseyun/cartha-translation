  text: And all the nations will know that there is one who redeems and saves Israel[a].
translation:
  language: ru
  text: И узнают все народы, что есть тот, кто искупает и спасает Израиль.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что он — тот, кто искупает и спасает Израиль». В греческом тексте субъект прямо не назван.'
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσονται
  choice: узнают
  rationale: Будущая форма γινώσκω выражает обретение знания или признание факта; «узнают» естественно передаёт этот оттенок и предсказательный характер высказывания.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: Передаёт универсальный этнополитический охват выражения, не сужая его до значения «язычники».
- source_word: ὅτι ἔστιν
  choice: что есть
  rationale: Сохраняет экзистенциальную конструкцию и не вводит явно названного субъекта, отсутствующего в греческом тексте.
- source_word: ὁ λυτρούμενος
  choice: Тот, кто искупает
  rationale: Субстантивированное причастие настоящего времени обозначает действующего избавителя; «искупает» сохраняет образ выкупа и характер продолжающегося действия.
- source_word: σώζων
  choice: спасает
  rationale: Точно передаёт обычное значение σῴζω и сохраняет его богословскую ёмкость, естественно сочетаясь с «искупает».
- source_word: τὸν Ἰσραήλ
  choice: Израиль
  rationale: Прямо и ясно передаёт имя народа без ненужного пояснительного расширения.
theological_decisions:
- issue: Неявный субъект при субстантивированных причастиях «искупающий и спасающий Израиль»
  choice: Экзистенциальная формулировка «есть Тот, кто искупает и спасает Израиль» без прямого именования Бога в основном тексте.
  alternative: «Он — Тот, кто искупает и спасает Израиль».
  rationale: Контекст указывает на Бога, однако в самой греческой фразе субъект при ἔστιν явно не выражен. Основной текст сохраняет эту сдержанность и присущую оригиналу неоднозначность.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный регистр. Заглавное «Тот» помогает естественно оформить субстантивированное обозначение лица, не называя его прямо.
