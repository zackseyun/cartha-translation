base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/009.yaml
  text: Remember how our fathers were saved in the Red Sea when Pharaoh pursued them with force[a].
translation:
  language: ru
  text: Вспомните, как наши отцы были спасены в Красном море[a], когда фараон преследовал их со своим войском[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в море Красном». Традиционное название — «Красное море»; с учётом древнееврейского фона рассказа об исходе также переводят «Тростниковое море».'
    reason: Лексическая альтернатива и древнееврейский фон топонима.
  - marker: b
    text: 'Или: «с силой», «во всей силе». Греческое слово может обозначать силу, мощь или военные силы.'
    reason: Сохранение смысловой неоднозначности ἐν δυνάμει.
lexical_decisions:
- source_word: μνήσθητε
  choice: Вспомните
  rationale: Аористный императив призывает слушателей намеренно обратиться к известному событию; «вспомните» естественно и прямо передаёт этот призыв.
- source_word: ἐσώθησαν
  choice: были спасены
  rationale: Пассивная форма σῴζω означает спасение или избавление. «Были спасены» сохраняет библейскую лексику спасения и уместно для исторического избавления.
- source_word: οἱ πατέρες ἡμῶν
  choice: наши отцы
  rationale: Буквально передаёт мужскую форму греческого выражения и его традиционное значение — праотцы Израиля.
- source_word: ἐν θαλάσσῃ ἐρυθρᾷ
  choice: в Красном море
  rationale: Это прямое соответствие греческой фразе; в библейском греческом так обычно называется море, через которое вышел Израиль.
- source_word: ἐδίωξεν
  choice: преследовал
  rationale: Точно и естественно передаёт военное преследование, выраженное глаголом διώκω.
- source_word: ἐν δυνάμει
  choice: со своим войском
  rationale: В данном повествовательном контексте δύναμις может обозначать военную силу, то есть войско. Русское «с силой» звучало бы неестественно и менее ясно; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Лексика спасения в контексте исторического избавления
  choice: были спасены
  alternative: были избавлены; были спасены от гибели
  rationale: Форма σῴζω допускает историческое избавление, но перевод «спасены» сохраняет более широкий библейский смысл, не вводя позднейших богословских уточнений.
- issue: Обозначение предков Израиля
  choice: наши отцы
  alternative: наши предки; наши праотцы
  rationale: Греческий текст содержит явно мужское выражение. «Наши отцы» сохраняет форму источника и традиционную связь с поколением исхода.
- issue: Значение ἐν δυνάμει
  choice: со своим войском
  alternative: с силой; во всей силе
  rationale: Контекст преследования фараоном естественно допускает военное значение δύναμις, однако греческая фраза может шире означать силу или мощь, поэтому альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным звучанием. Синтаксис краток и призывен; традиционная библейская формула «наши отцы» сохранена без архаизации остального стиха.
