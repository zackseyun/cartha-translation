  yaml_path: translation/deuterocanon/1_maccabees/004/018.yaml
  text: And Gorgias and the force are in the hill country near us[a]. But now stand against our enemies and fight them[b], and after this take the spoils with boldness.
translation:
  language: ru
  text: И Горгий и его войско находятся в горной местности неподалёку от нас.[a] Но теперь встаньте против наших врагов и сразитесь с ними, а после этого смело берите добычу.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на горе неподалёку от нас». Греческое выражение может обозначать как конкретную гору, так и горную местность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а после этого берите добычу с уверенностью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γοργίας
  choice: Горгий
  rationale: Традиционная русская форма греческого личного имени.
- source_word: δύναμις
  choice: войско
  rationale: В данном военном контексте слово обозначает вооружённые силы; «войско» естественно по-русски и не уточняет их численность или устройство.
- source_word: ἐν τῷ ὄρει
  choice: в горной местности
  rationale: Форма единственного числа может обозначать как конкретную гору, так и гористую область; основной текст передаёт уместный здесь более широкий географический смысл, а альтернатива отмечена в сноске.
- source_word: ἐγγὺς ἡμῶν
  choice: неподалёку от нас
  rationale: Естественно передаёт пространственную близость и непосредственность угрозы.
- source_word: στῆτε
  choice: встаньте против
  rationale: Сохраняет образ решительного противостояния и повелительную силу военной речи.
- source_word: πολεμήσατε
  choice: сразитесь
  rationale: В контексте предстоящего боя это естественный и достойный русский эквивалент.
- source_word: σκῦλα
  choice: добычу
  rationale: Обозначает имущество, захваченное после победы; «добыча» ясно и естественно звучит в современном русском языке.
- source_word: μετὰ παρρησίας
  choice: смело
  rationale: В данном контексте выражает бесстрашие и уверенность при взятии добычи после победы; наречие делает фразу естественной по-русски.
