  yaml_path: translation/deuterocanon/1_maccabees/004/054.yaml
  text: At the time[a], on the very day when the nations had defiled it[b], on that very day it was rededicated with songs and lyres and harps and cymbals.
translation:
  language: ru
  text: В то время, в тот самый день, когда язычники осквернили его,[a] он был вновь освящён с песнями, лирами, арфами[b] и кимвалами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «когда язычники лишили его святости». Греческий глагол обозначает осквернение или превращение священного в несвященное.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое слово обозначает древний струнный инструмент, точный вид которого неизвестен; возможен более общий перевод: «струнными инструментами».'
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸν καιρὸν κατὰ τὴν ἡμέραν
  choice: В то же время, в тот самый день
  rationale: Передаёт временное соответствие и подчёркнутое указание на точный день естественным современным русским языком.
- source_word: ἐβεβήλωσαν
  choice: осквернили
  rationale: В храмовом контексте глагол означает лишение святости, осквернение; выбранное слово ясно и сохраняет культовый смысл.
- source_word: αὐτό
  choice: его
  rationale: Сохранено местоимение оригинала без уточнения его референта как святилища или жертвенника.
- source_word: τὰ ἔθνη
  choice: язычники
  rationale: В данном повествовательном контексте речь идёт о неиудейских народах; «язычники» естественно передаёт этот смысл по-русски.
- source_word: ἐνεκαινίσθη
  choice: был вновь освящён
  rationale: Форма выражает культовое восстановление и новое посвящение после осквернения; перевод сохраняет пассив и не уточняет референт местоимения.
- source_word: ἐν ᾠδαῖς
  choice: с песнями
  rationale: Предлог перед музыкальными средствами естественно передаётся русским инструментальным оборотом.
- source_word: κιθάραις
  choice: лирами
  rationale: Кифара относится к инструментам лирового типа; «лиры» отличает её от следующего инструмента.
- source_word: κινύραις
  choice: арфами
  rationale: Точная идентификация древнего струнного инструмента не вполне ясна; «арфы» — традиционный и понятный эквивалент.
- source_word: κυμβάλοις
  choice: кимвалами
  rationale: Устоявшееся русское наименование древнего ударного инструмента, уместное в библейском регистре.
theological_decisions:
- issue: Культовый смысл ἐνεκαινίσθη после осквернения
  choice: был вновь освящён
  alternative: был заново посвящён; был обновлён
  rationale: «Вновь освящён» ясно выражает восстановление сакрального статуса, не сводя действие к материальному ремонту и не вводя конфессиональной специфики.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Риторическое совпадение дня осквернения и повторного освящения подчёркнуто выражением «в тот самый день». Местоименный референт намеренно не конкретизирован.
