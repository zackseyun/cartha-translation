  yaml_path: translation/deuterocanon/1_maccabees/004/032.yaml
  text: Give them cowardice[a], and melt the boldness of their strength, and let them be shaken by their own crushing.
translation:
  language: ru
  text: Дай им малодушие и растопи дерзость, которую внушает им сила; пусть они содрогнутся от собственного сокрушения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть они содрогнутся при своей гибели». Слово, переведённое как «сокрушение», может обозначать также разгром, гибель или уничтожение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὸς
  choice: Дай
  rationale: Прямой повелительный глагол сохраняет простоту и силу молитвенного прошения.
- source_word: δειλίαν
  choice: малодушие
  rationale: Передаёт не обычный страх, а трусость и утрату мужества; в современном литературном русском звучит естественнее, чем отвлечённое «трусость» после «дай».
- source_word: τῆξον
  choice: растопи
  rationale: Сохраняет яркую метафору таяния, не сводя её к нейтральному «ослабь».
- source_word: θράσος
  choice: дерзость
  rationale: Передаёт агрессивную смелость противника и допускает отрицательный оттенок, уместный в контексте.
- source_word: ἰσχύος
  choice: силы
  rationale: Сохраняет родительную конструкцию θράσος ἰσχύος без добавочного толкования.
- source_word: σαλευθήτωσαν
  choice: пусть они содрогнутся
  rationale: Передаёт пассивно-разрешительный императив и сильное потрясение; по-русски естественнее буквального «пусть будут поколеблены».
- source_word: συντριβῇ
  choice: сокрушении
  rationale: Сохраняет конкретный образ сокрушения, одновременно допуская более общее значение гибели или разгрома.
- source_word: αὐτῶν
  choice: своём
  rationale: Русское возвратное местоимение ясно связывает сокрушение с теми же людьми, которые должны содрогнуться.
theological_decisions:
- issue: Язык молитвы о поражении врагов
  choice: Сохранены прямые прошения о малодушии, крушении дерзости и потрясении врагов.
  alternative: Смягчить стих до общего прошения об их поражении.
  rationale: Греческий текст прямо обращён к Богу с просьбой подорвать стойкость вражеских сил; смягчение устранило бы его богословскую и риторическую напряжённость.
- issue: Значение τῇ συντριβῇ αὐτῶν
  choice: «при своём сокрушении»
  alternative: «при своей гибели» или «из-за своего разгрома»
  rationale: Выбранный вариант сохраняет образность συντριβή и не сужает неоднозначную предложно-падежную связь до одной причинной трактовки.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-военной речи. Сохранены параллельные повелительные конструкции и конкретная метафора «растопи»; точка с запятой делает длинную фразу яснее.
