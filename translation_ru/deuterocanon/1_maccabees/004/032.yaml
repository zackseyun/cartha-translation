  verdict: revise
  source_fidelity: «Малодушие» точно передаёт δειλίαν, а «растопи» удачно сохраняет образ τῆξον. Однако «дерзость их силы» в русском языке двусмысленно приписывает дерзость самой силе, тогда как греческий генитив естественно выражает дерзость, основанную на силе. «Пусть они содрогнутся» приемлемо передаёт σαλευθήτωσαν, но заключительное «при своём сокрушении» звучит неестественно и слабо связывает потрясение с их разгромом.
  naturalness: Фраза в целом имеет подходящий высокий, молитвенный регистр. Безопасная синтаксическая перестройка второго прошения делает связь «дерзости» и «силы» естественной для современного литературного русского; «от собственного сокрушения» естественно передаёт связь, допускаемую греческим дательным, не устраняя образ сокрушения.
  terminology: «Сокрушение» сохраняет конкретную образность συντριβή; в сноске обоснованно указаны «разгром», «гибель» и «уничтожение» как контекстуальные альтернативы. Возвратное «собственного» ясно относит сокрушение к тем же врагам, не добавляя богословского истолкования.
  issues:
