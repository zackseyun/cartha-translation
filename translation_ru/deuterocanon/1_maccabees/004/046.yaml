  terminology: «Храмовая гора» — удачная современная передача ἐν τῷ ὄρει τοῦ οἴκου; сноска корректно сохраняет буквальный образ. «Пророк» передаёт неопределённое προφήτην без догматического уточнения. «Дать ответ о них» сохраняет намеренно широкий характер ἀποκριθῆναι περὶ αὐτῶν.
