  yaml_path: translation/deuterocanon/1_maccabees/004/046.yaml
  text: And they set the stones aside on the temple hill in a suitable place[a], until a prophet should come to give an answer concerning them.
translation:
  language: ru
  text: И они отложили камни в подходящем месте на храмовой горе[a], пока не придёт пророк, чтобы дать ответ о них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на горе Дома», то есть на храмовой горе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθεντο
  choice: отложили
  rationale: Глагол обозначает помещение предметов отдельно до последующего решения; «отложили» естественно передаёт временное сохранение.
- source_word: τοὺς λίθους
  choice: эти камни
  rationale: Определённость и ближайший контекст указывают на уже упомянутые камни; принадлежность жертвеннику не добавляется в основной текст.
- source_word: ἐν τῷ ὄρει τοῦ οἴκου
  choice: на храмовой горе
  rationale: Буквально «на горе Дома»; «храмовая гора» ясно и естественно передаёт идиоматическое обозначение территории Храма.
- source_word: ἐν τόπῳ ἐπιτηδείῳ
  choice: в подходящем месте
  rationale: ἐπιτήδειος выражает пригодность или уместность места.
- source_word: μέχρι τοῦ παραγενηθῆναι
  choice: пока не придёт
  rationale: Конструкция указывает на ожидаемое в будущем событие с точки зрения повествования.
- source_word: προφήτην
  choice: пророк
  rationale: Существительное без артикля не обозначает прямо какого-либо определённого пророка.
- source_word: τοῦ ἀποκριθῆναι περὶ αὐτῶν
  choice: и не даст ответа о них
  rationale: Сохраняется буквальный смысл «ответить о них» и совещательно-авторитетный характер ответа без уточнения, что это юридическое решение.
theological_decisions:
- issue: Роль ожидаемого пророка
  choice: ожидается будущий пророк, который даст авторитетный ответ о камнях
  alternative: пророк должен вынести формальное правовое решение; либо это лишь условная формула отсрочки решения
  rationale: Греческий текст говорит об ожидании пророка, который ответит относительно камней, но не уточняет ни характер процедуры, ни время, ни статус этого решения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формулировка ясна широкому читателю; буквальный образ «гора Дома» сохранён в сноске.
