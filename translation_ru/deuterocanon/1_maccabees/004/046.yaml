  source_fidelity: 'В целом смысл передан точно: камни были отложены на храмовой горе в пригодном месте в ожидании пророка, который должен был дать ответ относительно них. Однако «эти камни» вводит указательное значение, которого греческий текст не выражает; определённый артикль τοὺς естественнее передать просто как «камни» в данном контексте. Кроме того, придаточная конструкция «пока не придёт пророк и не даст ответа» может быть понята как два равноправных будущих события, тогда как τοῦ ἀποκριθῆναι выражает цель прихода пророка.'
