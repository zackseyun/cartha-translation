  text: And they were cultivating their land in peace[a], and the land was yielding its produce, and the trees of the fields their fruit.
translation:
  language: ru
  text: И они возделывали свою землю в мире, и земля давала урожай, а деревья на равнинах[a] — свои плоды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в полях». Греческое слово πεδίων может означать равнины, поля или вообще открытую местность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοῦντες
  choice: возделывали
  rationale: Передаёт продолжительный земледельческий труд и значение причастия при описательной форме прошедшего времени.
- source_word: γῆν
  choice: землю
  rationale: В контексте речь идёт об обрабатываемой ими земле, а не о земле как мире в целом.
- source_word: μετʼ εἰρήνης
  choice: в мире
  rationale: Сохраняет именную форму греческого выражения и охватывает как отсутствие войны, так и спокойствие и безопасность.
- source_word: ἐδίδου
  choice: давала
  rationale: Несовершенный вид естественно передаёт длительное или обычное действие греческого имперфекта.
- source_word: γενήματα
  choice: урожай
  rationale: Обозначает произведения земли в широком сельскохозяйственном смысле и позволяет отличить их от плодов деревьев в следующей части.
- source_word: ξύλα
  choice: деревья
  rationale: Упоминание их плодов показывает, что имеются в виду живые плодоносящие деревья, а не древесина.
- source_word: πεδίων
  choice: на равнинах
  rationale: πέδιον прежде всего обозначает ровную открытую местность; русский оборот естественно выражает местонахождение деревьев и сохраняет географический оттенок.
- source_word: καρπὸν
  choice: плоды
  rationale: При деревьях это прямой и естественный русский эквивалент.
