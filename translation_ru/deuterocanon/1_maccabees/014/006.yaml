lexical_decisions:
- source_word: ἐπλάτυνεν
  choice: расширил
  rationale: Передаёт буквальное значение «сделал шире» и естественно сочетается с территориальными границами.
- source_word: τὰ ὅρια
  choice: границы
  rationale: Точно передаёт обозначение рубежей или территориальных пределов.
- source_word: τῷ ἔθνει αὐτοῦ
  choice: своего народа
  rationale: ἔθνος здесь обозначает народ как политико-национальную общность; русское «народ» сохраняет этот смысл и не смешивает его с χώρα — «страной».
- source_word: ἐκράτησεν
  choice: установил власть над
  rationale: Сочетание передаёт значение господства и фактического контроля, выраженное κρατέω с родительным падежом, не утверждая формального права собственности.
- source_word: τῆς χώρας
  choice: страной
  rationale: χώρα означает землю, область или страну; «страна» здесь естественно обозначает территорию, находящуюся под властью правителя.
