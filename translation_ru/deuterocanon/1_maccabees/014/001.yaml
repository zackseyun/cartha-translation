  text: And in the one hundred seventy-second year[a], King Demetrius gathered his forces and went into Media[b], to obtain help for himself so that he might make war against Tryphon.
translation:
  language: ru
  text: В сто семьдесят втором году[a] царь Димитрий собрал свои войска и отправился в Мидию, чтобы заручиться поддержкой и воевать с Трифоном.
  philosophy: optimal-equivalence
  footnotes:
