lexical_decisions:
- source_word: ἐν ἔτει δευτέρῳ καὶ ἑβδομηκοστῷ καὶ ἑκατοστῷ
  choice: в сто семьдесят втором году
  rationale: Греческая аддитивная формула буквально называет второй, семидесятый и сотый год; современный русский естественно передаёт её порядковым числительным. Историческая система отсчёта пояснена в сноске.
- source_word: συνήγαγεν τὰς δυνάμεις αὐτοῦ
  choice: собрал свои войска
  rationale: В военном контексте δυνάμεις означает вооружённые силы; «войска» естественно передаёт греческое множественное число, а «собрал» точно соответствует συνήγαγεν.
- source_word: ἐπορεύθη εἰς Μηδίαν
  choice: отправился в Мидию
  rationale: Нейтральный глагол движения не требует добавлять более узкое значение «выступил походом»; «отправился» естественно описывает целенаправленное путешествие.
- source_word: τοῦ ἐπισπάσθαι βοήθειαν ἑαυτῷ
  choice: чтобы заручиться поддержкой
  rationale: Конструкция выражает цель, а средний инфинитив ἐπισπάσθαι передаёт идею привлечения помощи на свою сторону. Русское «заручиться поддержкой» идиоматично выражает и приобретение, и привлечение содействия.
- source_word: ὅπως πολεμήσῃ τὸν Τρύφωνα
  choice: и воевать с Трифоном
  rationale: Вторая целевая конструкция зависит от намерения получить поддержку. «Воевать» передаёт длительное военное противостояние, выраженное πολεμέω, без ненужного усиления.
- source_word: Δημήτριος / Τρύφωνα
  choice: Димитрий / Трифон
  rationale: Использованы укоренившиеся в русской библейской и исторической традиции формы греческих имён.
