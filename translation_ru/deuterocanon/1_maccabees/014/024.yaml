base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/024.yaml
  text: After these things Simon sent Numenius to Rome[a], carrying a large gold shield weighing a thousand minas, to establish the alliance with them.
translation:
  language: ru
  text: После этого Симон послал Нумения в Рим. Тот нёс большой золотой щит весом в тысячу мин[a], чтобы утвердить союз с римлянами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Мина — древняя мера веса. Тысяча мин указывает на исключительно тяжёлый и ценный дипломатический дар.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После этого
  rationale: Естественный русский повествовательный переход, сохраняющий связь с предшествующими событиями; буквальное «после этих событий» также возможно, но здесь тяжелее.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Прямой и естественный эквивалент аориста со значением завершённого действия.
- source_word: Νουμήνιον
  choice: Нумения
  rationale: Имя передано традиционной русской транслитерацией и поставлено в винительный падеж.
- source_word: εἰς Ῥώμην
  choice: в Рим
  rationale: Обычная русская передача направления движения к городу.
- source_word: ἔχοντα
  choice: Тот нёс
  rationale: Причастный оборот раскрыт отдельным предложением для ясности; значение состоит в том, что посланник вёз дипломатический дар.
- source_word: ἀσπίδα χρυσῆν μεγάλην
  choice: большой золотой щит
  rationale: Сохраняются предмет, материал и указание на величину без архаизации.
- source_word: ὁλκὴν μνῶν χιλίων
  choice: весом в тысячу мин
  rationale: Краткая и точная передача конструкции, обозначающей вес щита.
- source_word: εἰς τὸ στῆσαι
  choice: чтобы утвердить
  rationale: Артикулированный инфинитив выражает цель; «утвердить» естественно для дипломатического союза и допускает смысл его формального закрепления.
- source_word: πρὸς αὐτοὺς
  choice: с римлянами
  rationale: Референт местоимения эксплицирован по ближайшему контексту — это жители или власти Рима; такая передача устраняет неестественное русское «с ними», не меняя смысла.
- source_word: τὴν συμμαχίαν
  choice: союз
  rationale: Прямой контекстуальный эквивалент политико-военного союза.
