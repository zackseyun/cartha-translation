  yaml_path: translation/deuterocanon/1_maccabees/014/002.yaml
  text: And Arsaces, the king of Persia and Media, heard that Demetrius had come into his territory, and he sent one of his commanders to capture him alive.
translation:
  language: ru
  text: Арсак, царь Персии и Мидии, услышал, что Димитрий вступил в его владения, и послал одного из своих начальников захватить его живым.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал
  rationale: Прямо передаёт аорист ἀκούω и естественно вводит полученное царём известие, не уточняя способ его получения.
- source_word: Ἀρσάκης
  choice: Арсак
  rationale: Устоявшаяся русская форма имени Arsaces, соответствующая традиции передачи имён эллинистической эпохи.
- source_word: ὁ βασιλεὺς Περσίδος καὶ Μηδίας
  choice: царь Персии и Мидии
  rationale: Естественная и исторически узнаваемая русская передача географических названий Περσίς и Μηδία.
- source_word: ἦλθεν
  choice: вступил
  rationale: В сочетании с указанием на чужие владения выражает прибытие Димитрия на подвластную Арсаку территорию; русская форма прошедшего времени естественно передаёт предшествование в контексте.
- source_word: τὰ ὅρια αὐτοῦ
  choice: его владения
  rationale: Множественное ὅρια буквально обозначает границы или пределы, а здесь по смыслу — находящуюся под властью царя территорию. «Владения» сохраняет политико-территориальный оттенок.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Точная и естественная передача аориста ἀποστέλλω в повествовательной прозе.
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ
  choice: одного из своих начальников
  rationale: ἄρχων — широкое обозначение правителя, начальника или должностного лица. «Начальник» соответствует порученной силовой задаче, не приписывая лицу более узкого военного или придворного чина.
- source_word: συλλαβεῖν
  choice: захватить
  rationale: Передаёт насильственное задержание в военно-политической обстановке точнее, чем юридически окрашенное «арестовать».
- source_word: ζῶντα
  choice: живым
  rationale: Идиоматически передаёт предикативное причастие и ясно указывает, что Димитрия следовало взять не убивая.
