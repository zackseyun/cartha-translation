  yaml_path: translation/deuterocanon/1_maccabees/014/043.yaml
  text: and that he should have charge of the holy things[a], and that he should be obeyed by all, and that all documents in the country should be written in his name[d][c][b], and that he should wear purple and gold.
translation:
  language: ru
  text: и чтобы он ведал святынями[a], и чтобы все повиновались ему[b], и чтобы все документы в стране составлялись от его имени[c], и чтобы он носил пурпур и золото[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «святилищем» или «священными делами». В греческом тексте буквально стоит широкое выражение «святыни».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы его слушались» или «чтобы он был услышан всеми»; здесь речь о признании его власти и повиновении ему.'
    reason: lexical_alternative
  - marker: c
    text: То есть все официальные документы в стране должны были составляться и издаваться с его полномочия.
    reason: cultural_note
  - marker: d
    text: Пурпурная одежда и золото служили знаками высокого положения и официальной почести.
    reason: cultural_note
lexical_decisions:
- source_word: μέλῃ ... περὶ
  choice: ведал
  rationale: В контексте постановления оборот обозначает порученную Симону ответственность и надзор; «ведал» естественно передаёт официальный характер полномочий.
- source_word: τῶν ἁγίων
  choice: святынями
  rationale: Греческое субстантивированное множественное число охватывает священные предметы и дела; «святынями» сохраняет широту выражения, не сужая его до одного святилища.
- source_word: ἀκούηται
  choice: все повиновались ему
  rationale: Буквально глагол означает «быть услышанным», но в перечне властных полномочий имеет смысл «быть послушанным, пользоваться повиновением».
- source_word: συγγραφαὶ
  choice: документы
  rationale: Слово может обозначать письменные акты и официальные записи; «документы» уместно и не сужает значение до одного юридического жанра.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: от его имени
  rationale: Оборот указывает на официальное составление или издание документов с его санкции и властью.
- source_word: πορφύραν
  choice: пурпур
  rationale: Греческий текст называет престижный пурпур без уточнения вида одежды; русский оборот «носить пурпур» сохраняет эту форму и символику.
- source_word: χρυσοφορῇ
  choice: носил ... золото
  rationale: Глагол означает носить на себе золото или золотые украшения; в сочетании с пурпуром обозначает знаки высокого положения.
theological_decisions:
- issue: Объём значения τῶν ἁγίων
  choice: святынями
  alternative: святилищем; священными делами
  rationale: Форма множественного числа шире обозначения одного здания и может включать священные предметы и храмовые дела; перевод сохраняет эту намеренную широту.
translation_notes:
  register: Современный литературный русский язык с достоинством официального постановления. Повтор «и чтобы» сохранён вслед за греческой синтаксической структурой; лексика ясная, без конфессионального уточнения широкого выражения о святынях.
