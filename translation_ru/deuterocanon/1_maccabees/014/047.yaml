  text: And Simon accepted it[a], and agreed to be high priest and to be commander and ethnarch of the Jews and priests[c][b], and to be over them all.
translation:
  language: ru
  text: И Симон принял это и согласился быть первосвященником, а также военачальником и этнархом[a] иудеев[b] и священников, и стоять во главе всех их[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этнарх — исторический титул правителя или главы народа.
    reason: cultural_note
  - marker: b
    text: 'Или: «жителей Иудеи». Греческое слово может обозначать иудеев как народ или жителей Иудеи.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «руководить ими всеми», «быть поставленным над ними всеми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: принял это
  rationale: Средняя форма глагола указывает на принятие Симоном ранее изложенного решения или установления; местоимение «это» естественно восполняет подразумеваемый объект.
- source_word: εὐδόκησεν
  choice: согласился
  rationale: В данном контексте глагол выражает добровольное согласие принять названные служения, а не просто удовольствие или одобрение.
- source_word: ἀρχιερατεύσαι
  choice: быть первосвященником
  rationale: Инфинитив означает исполнять обязанности первосвященника; прямое русское выражение сохраняет официальный характер служения.
- source_word: στρατηγός
  choice: военачальник
  rationale: Слово обозначает военного руководителя; «военачальник» ясно и без излишне современного оттенка передаёт этот смысл.
- source_word: ἐθνάρχης
  choice: этнарх
  rationale: Сохранён исторический политический титул, точный объём полномочий которого не следует сводить к общему слову «правитель».
- source_word: Ἰουδαίων
  choice: иудеев
  rationale: В национально-политическом контексте слово обозначает народ; «иудеи» сохраняет также возможный историко-географический оттенок.
- source_word: ἱερέων
  choice: священников
  rationale: Прямой перевод множественного числа; священники названы как отдельная группа наряду с иудеями.
- source_word: προστῆσαι
  choice: стоять во главе
  rationale: Глагол передаёт руководство и положение над другими; русское выражение сохраняет образ «стояния впереди/над» и звучит естественно.
- source_word: ἁπάντων
  choice: их всех
  rationale: Форма относится ко всем ранее названным группам; местоимение делает эту связь явной по-русски.
theological_decisions:
- issue: Передача политического титула ἐθνάρχης
  choice: этнарх
  alternative: правитель народа; народный вождь
  rationale: Транслитерация сохраняет историческую специфику должности и не приписывает ей более точного конституционного содержания, чем даёт источник.
- issue: Передача Ἰουδαίων
  choice: иудеев
  alternative: жителей Иудеи
  rationale: Греческое слово допускает как этническое, так и территориальное понимание. В контексте общенародного постановления предпочтено название народа, а возможный территориальный оттенок отмечен в сноске.
- issue: Связь заключительного ἁπάντων
  choice: их всех — всех ранее названных
  alternative: всего — всех дел или всей общины
  rationale: Грамматически форма допускает широкую отсылку; наиболее естественно понимать её как совокупность названных людей, не уточняя структуру власти сверх текста.
translation_notes:
  register: Современный литературный русский язык с достойным историко-повествовательным звучанием. Технический титул «этнарх» сохранён и пояснён; синтаксис слегка упрощён по сравнению с греческой цепочкой инфинитивов, но её смысловая структура сохранена.
