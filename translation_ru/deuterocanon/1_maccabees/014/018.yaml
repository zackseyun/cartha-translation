    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψαν
  choice: написали
  rationale: Основное значение глагола — «писать»; материал табличек сам указывает на то, что текст был нанесён как надпись.
- source_word: δέλτους χαλκᾶς
  choice: на бронзовых табличках
  rationale: δέλτος обозначает табличку для письма, а χαλκᾶς — материал; предложный оборот естественно передаёт носитель официального текста.
- source_word: τοῦ ἀνανεώσασθαι
  choice: чтобы возобновить
  rationale: Артиклевый инфинитив выражает цель; «чтобы возобновить» ясно и естественно передаёт эту конструкцию.
- source_word: φιλίαν
  choice: дружбу
  rationale: Сохраняет прямое значение слова и его дипломатический оттенок дружественных отношений.
- source_word: συμμαχίαν
  choice: союз
  rationale: Краткое и нормативное обозначение военно-политического союза.
- source_word: ἔστησαν
  choice: заключили
  rationale: В контексте дипломатических отношений глагол означает установление или оформление соглашения; по-русски союз естественно «заключают».
- source_word: πρὸς αὐτόν
  choice: с ним
  rationale: В контексте отношений и союза πρὸς с винительным естественно передаётся русским «с ним».
- source_word: Ἰούδαν καὶ Ἰωνάθαν τοὺς ἀδελφοὺς αὐτοῦ
  choice: с Иудой и Ионафаном, его братьями
  rationale: Приложение ясно указывает, что Иуда и Ионафан были братьями адресата, то есть Симона.
