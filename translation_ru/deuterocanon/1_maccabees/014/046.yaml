lexical_decisions:
- source_word: εὐδόκησεν
  choice: одобрил
  rationale: Аорист здесь выражает общее положительное решение народа; «одобрил» естественно передаёт официальный характер этого согласия.
- source_word: πᾶς ὁ λαός
  choice: весь народ
  rationale: Передаёт и πᾶς, и ὁ λαός без излишне политизированного толкования.
- source_word: θέσθαι Σίμωνι ποιῆσαι
  choice: чтобы Симон поступал
  rationale: Сжатая инфинитивная конструкция обозначает принятое народом решение о действиях Симона; русская конструкция с «чтобы» передаёт её ясно и естественно.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: согласно этим словам
  rationale: Сохраняет буквальный образ греческого λόγους и связь с ранее изложенными постановлениями, не подменяя их толкованием в основном тексте.
