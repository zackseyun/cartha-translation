- source_word: προσηγορεῦνται
  choice: именуют
  rationale: Глагол означает называние или официальное обозначение определённым титулом; «именуют» сохраняет оттенок дипломатического признания.
- source_word: φίλοι
  choice: друзьями
  rationale: Прямой эквивалент греческого слова, которое здесь входит в дипломатическую формулу.
- source_word: σύμμαχοι
  choice: союзниками
  rationale: Обычный современный русский термин для участников политического или военного союза.
- source_word: οἱ ἀδελφοί
  choice: братьями
  rationale: Греческое существительное имеет форму мужского рода во множественном числе и в данном контексте выражает братские отношения между политическими сторонами.
- source_word: ἀπήντησαν
  choice: приняли
  rationale: Буквально глагол означает «встретили», но применительно к послам обозначает официальный дипломатический приём; эта буквальная возможность отражена в примечании.
- source_word: πρεσβευταῖς
  choice: послов
  rationale: Слово обозначает официальных представителей; «послы» точно и естественно передаёт их дипломатический статус.
- source_word: ἐνδόξως
  choice: с почётом
  rationale: Наречие описывает почётный, достойный приём; предложное сочетание звучит естественно и торжественно в современном русском языке.
