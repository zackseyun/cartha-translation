lexical_decisions:
- source_word: ἐν Σαραμέλ
  choice: В Сарамеле
  rationale: Предлог ἐν с названием места естественно передаётся по-русски как «в»; название транслитерировано.
- source_word: συναγωγῆς μεγάλης
  choice: на великом собрании
  rationale: συναγωγή здесь обозначает публичное собрание, а не здание синагоги; «великом» сохраняет торжественно-официальный оттенок μεγάλη.
- source_word: τῶν ἱερέων καὶ λαοῦ καὶ ἀρχόντων ἔθνους καὶ τῶν πρεσβυτέρων τῆς χώρας
  choice: священников, народа, предводителей народа и старейшин страны
  rationale: Сохраняется перечисление общественных групп. ἄρχοντες передано как «предводители», чтобы обозначить руководителей без излишне узкого указания на официальную должность; ἔθνος в данном контексте — «народ», χώρα — «страна».
- source_word: ἐγνώσθη ἡμῖν
  choice: нам было объявлено
  rationale: Пассивная официальная формула вводит содержание публичного постановления; «было объявлено» естественно передаёт её функцию и официальный тон.
