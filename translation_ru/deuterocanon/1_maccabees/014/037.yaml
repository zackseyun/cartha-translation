  text: And he settled Jewish men in it, and fortified it for the security of the country and the city, and raised the walls of Jerusalem.
translation:
  language: ru
  text: Он поселил в ней иудейских мужчин, укрепил её, чтобы обеспечить безопасность страны и города, и увеличил высоту стен Иерусалима.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατῴκισεν
  choice: поселил
  rationale: 'Передаёт каузативный смысл: он устроил этих людей в данном месте как постоянных жителей.'
- source_word: ἄνδρας Ἰουδαίους
  choice: мужчин-иудеев
  rationale: Сохраняет явно мужское значение ἄνδρας и этнорелигиозное обозначение Ἰουδαίους; дефисное сочетание естественно связывает оба элемента.
- source_word: ὠχύρωσεν
  choice: укрепил
  rationale: Обычное русское обозначение оборонительного укрепления места в военно-историческом контексте.
- source_word: πρὸς ἀσφάλειαν
  choice: для безопасности
  rationale: Ясно передаёт целевое значение оборонительных действий.
- source_word: τῆς χώρας
  choice: страны
  rationale: Передаёт более обширную территорию, противопоставленную городу, не сужая значение до окрестностей.
- source_word: τῆς πόλεως
  choice: города
  rationale: Прямое соответствие πόλις; в контексте речь идёт об Иерусалиме.
- source_word: ὕψωσεν
  choice: сделал выше
  rationale: Точно передаёт увеличение высоты стен, не утверждая более конкретно, были ли они перестроены или надстроены.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: стены Иерусалима
  rationale: Естественная русская конструкция, сохраняющая множественное число греческого текста.
