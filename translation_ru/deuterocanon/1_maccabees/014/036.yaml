base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/036.yaml
  text: And in his days it prospered in his hands to remove the nations from their land[a], and those in the city of David in Jerusalem who had made for themselves a citadel, from which they would go out and defile the area around the sanctuary, and they inflicted great damage on its purity.
translation:
  language: ru
  text: И в его дни ему сопутствовал успех в том, чтобы удалить народы из их земли и жителей города Давида в Иерусалиме, устроивших себе цитадель[a], из которой они выходили, оскверняли окрестности святыни и наносили великий ущерб её чистоте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Акру» — укреплённую цитадель в Иерусалиме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδώθη ἐν ταῖς χερσὶν αὐτοῦ
  choice: дело в его руках увенчалось успехом
  rationale: Передаёт безличную пассивную конструкцию и сохраняет греческий образ рук как сферы действенной власти, не превращая её просто в «ему удалось».
- source_word: τοῦ ἐξαρθῆναι
  choice: были изгнаны
  rationale: В контексте удаления враждебных народов и обитателей цитадели глагол обозначает устранение с территории; «изгнаны» естественно по-русски и не предполагает их истребления.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: Сохраняет основной смысл греческого слова и не вводит более конфессионально окрашенное «язычники».
- source_word: χώρα
  choice: страна
  rationale: Передаёт территорию, из которой были изгнаны чужеземные силы; местоимение «их» сохраняет неоднозначность греческого αὐτῶν.
- source_word: ἄκραν
  choice: цитадель
  rationale: Точный общеупотребительный эквивалент укреплённой крепости; историческое понимание слова как названия Акры отмечено в сноске.
- source_word: ἐμίανον
  choice: оскверняли
  rationale: Сохраняет культовый смысл ритуального загрязнения в храмовом контексте.
- source_word: κύκλῳ τῶν ἁγίων
  choice: окрестности святыни
  rationale: Естественно передаёт сжатое выражение о пространстве вокруг святого места, не сводя его к абстрактным «святым предметам».
- source_word: πληγὴν μεγάλην
  choice: великий ущерб
  rationale: Передаёт метафорический смысл серьёзного вреда; «великий» поддерживает достоинство библейского регистра.
- source_word: ἁγνείᾳ
  choice: её чистоте
  rationale: Отражает именно чистоту, прежде всего культовую; местоимение соотносит её со святыней, подразумеваемой контекстом.
theological_decisions:
- issue: Культовая терминология в храмовом контексте
  choice: «оскверняли», «святыня», «чистота»
  alternative: Обобщённые выражения «портили», «святое место», «святость»
  rationale: Греческий текст подчёркивает ритуальное осквернение храмового пространства; культовая лексика сохраняет храмоцентричный смысл без добавления конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Двоеточие проясняет отношение результата к вводной безличной конструкции; тире помогает естественно связать вторую группу изгнанных с тем же сказуемым. Неоднозначность местоимения αὐτῶν сохранена как «их».
