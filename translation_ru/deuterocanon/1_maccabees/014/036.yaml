  - severity: low
    issue: Неестественная формула «дело в его руках увенчалось успехом»
    rationale: Она слишком буквально калькирует образ и не даёт понять, какое именно «дело» имеется в виду. Русская безлично-результативная конструкция позволяет передать смысл без такого стилистического сбоя.
