  terminology: «Газера», «Бет-Цур» и «крепость» приемлемы. Сноска корректно сохраняет возможность понимать ἄκρα как иерусалимскую Акру. «Нечистоты» сохраняет культовую маркированность и множественное число исходника без богословских уточнений.
