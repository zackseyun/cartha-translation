base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/007.yaml
  text: And he gathered many captives[a], and he took control of Gezer and Beth-zur and the citadel, and he removed the uncleanness from it, and there was no one opposing him.
translation:
  language: ru
  text: И собрал он множество пленных, и овладел Газерой, Бет-Цуром и крепостью[a], очистил её от нечистот, и не было никого, кто противостоял бы ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Акрой» — так называлась укреплённая цитадель в Иерусалиме.'
    reason: Слово ἄκρα может обозначать как крепость вообще, так и конкретную иерусалимскую Акру.
lexical_decisions:
- source_word: συνήγαγεν αἰχμαλωσίαν πολλήν
  choice: собрал множество пленных
  rationale: Греческое выражение буквально говорит о «многом плене», но по смыслу обозначает большое число пленников; выбранный вариант естественен по-русски и сохраняет конкретность действия.
- source_word: ἐκυρίευσεν
  choice: овладел
  rationale: Глагол обозначает обретение господства или контроля; «овладел» точно передаёт военно-политический захват перечисленных мест.
- source_word: Γαζάρων
  choice: Газерой
  rationale: Передача греческой формы Γάζαρα как «Газера» соответствует принятой в русской библейской традиции форме названия города.
- source_word: Βαιθσούρων
  choice: Бет-Цуром
  rationale: Форма «Бет-Цур» узнаваемо и близко передаёт семитское географическое название в современной русской транслитерации.
- source_word: τῆς ἄκρας
  choice: крепостью
  rationale: Ἄκρα может быть нарицательным обозначением крепости или названием конкретной иерусалимской цитадели; в основном тексте дано прозрачное нарицательное значение, а исторически конкретное прочтение вынесено в сноску.
- source_word: ἐξῆρεν τὰς ἀκαθαρσίας ἐξ αὐτῆς
  choice: очистил её от всего нечистого
  rationale: Оборот естественно передаёт удаление предметов или проявлений нечистоты и сохраняет возможный культовый оттенок множественного τὰς ἀκαθαρσίας без неестественного русского «нечистот».
- source_word: οὐκ ἦν ὁ ἀντικείμενος αὐτῷ
  choice: не осталось никого, кто противостоял бы ему
  rationale: Формулировка передаёт отсутствие противника или сопротивляющегося и звучит естественно в повествовательном русском контексте.
theological_decisions:
- issue: Культовый смысл τὰς ἀκαθαρσίας
  choice: «очистил её от всего нечистого»
  alternative: «удалил из неё нечистоты» / «удалил из неё осквернения»
  rationale: Выбранная формулировка сохраняет религиозно-культовую окраску нечистоты, но не уточняет, шла ли речь о предметах, обрядах или иных источниках осквернения.
- issue: Нарицательное или собственное значение ἄκρα
  choice: «крепостью» в основном тексте
  alternative: «Акрой» как названием конкретной иерусалимской цитадели
  rationale: Греческое слово допускает оба понимания. Основной текст передаёт непосредственно выраженное значение, а исторически конкретное прочтение сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Топонимы даны в узнаваемых формах; синтаксис сделан плавным, без устранения неоднозначности слова ἄκρα.
