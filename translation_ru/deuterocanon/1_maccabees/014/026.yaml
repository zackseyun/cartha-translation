  to: Ибо он сам, его братья и дом его отца проявили стойкость; они сражались с врагами Израиля, отбивая их от них[b], и обеспечили ему свободу[a]. Они записали это на бронзовых табличках и поместили их на памятной стеле на горе Сион.
  rationale: Исправление устраняет интерпретационное уточнение «от народа» из основного текста, сохраняя пространственно-защитный смысл ἀπʼ αὐτῶν посредством «отбивая их от них» и документируя неясность сноской. Также заменён неестественный оборот о свободе, при этом единственное число греческого αὐτῷ и возможная отсылка к Симону либо к персонифицированному Израилю сохранены.
