base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/026.yaml
  text: For he and his brothers and his father's house stood firm[a], and they fought the enemies of Israel away from them, and established freedom for him, and recorded it on bronze tablets, and set them on a pillar on Mount Zion.
translation:
  language: ru
  text: Ибо он сам, его братья и дом его отца проявили стойкость; они сражались с врагами Израиля, отбивая их от них[b], и обеспечили ему свободу[a]. Они записали это на бронзовых табличках и поместили их на памятной стеле на горе Сион.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «ему» (единственное число). Вероятно, имеется в виду Израиль как народ; возможно также отнесение этих слов лично к Симону.'
    reason: Сохранение неоднозначного референта греческого местоимения αὐτῷ.
  - marker: b
    text: 'В греческом тексте: «от них». Вероятнее всего, имеются в виду Израильтяне или народ, однако местоимение не называет референта прямо.'
    reason: Сохранение неоднозначного референта греческого местоимения αὐτῶν.
lexical_decisions:
- source_word: ἐστήρισεν
  choice: проявили твёрдость
  rationale: Глагол может означать «укрепить», «утвердить» или «быть стойким». Хотя в греческом стоит единственное число при первом участнике составного подлежащего, по смыслу действие относится к Симону, его братьям и отцовскому дому; русское множественное число естественно передаёт эту связь.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: его братья
  rationale: Сохранено обычное прямое родственное значение без необоснованного расширения до «сородичей».
- source_word: ὁ οἶκος τοῦ πατρὸς αὐτοῦ
  choice: дом его отца
  rationale: Сохраняется библейский образ рода и семейной линии; оборот понятен в современном литературном русском.
- source_word: ἐπολέμησαν τοὺς ἐχθροὺς Ἰσραὴλ ἀπʼ αὐτῶν
  choice: сражались с врагами Израиля, отгоняя их от народа
  rationale: «Сражались» прямо передаёт военное действие, а «отгоняя их от народа» выражает значение удаления в ἀπʼ αὐτῶν и проясняет подразумеваемый коллективный референт без тяжеловесной буквальности.
- source_word: ἔστησαν αὐτῷ ἐλευθερίαν
  choice: утвердили для него свободу
  rationale: «Утвердили свободу» близко передаёт сочетание ἔστησαν и ἐλευθερίαν. Мужское единственное «для него» сохраняет грамматическую форму αὐτῷ и не устраняет неоднозначность её референта.
- source_word: κατέγραψαν ἐν δέλτοις χαλκαῖς
  choice: записали это на бронзовых табличках
  rationale: Передаёт письменную фиксацию и материал носителя; «это» естественно отсылает к изложенному постановлению или признанию заслуг.
- source_word: ἔθεντο ἐν στήλῃ
  choice: поместили их на стеле
  rationale: «Стела» точнее «столпа» обозначает памятную вертикальную плиту или монумент, на котором могли быть закреплены бронзовые таблички.
- source_word: ἐν ὄρει Σιών
  choice: на горе Сион
  rationale: Нормативная русская форма для названия горы.
theological_decisions:
- issue: Референт αὐτῷ в выражении ἔστησαν αὐτῷ ἐλευθερίαν
  choice: Сохранить в основном тексте мужское единственное число «для него» и пояснить вероятную отсылку к Израилю в сноске.
  alternative: Передать «для народа» или «для Израиля», либо отнести местоимение лично к Симону.
  rationale: Ближайший контекст говорит о врагах Израиля и о национальной свободе, однако греческое αὐτῷ формально допускает мужской единичный референт. Сноска сохраняет и грамматику источника, и смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством историко-библейского повествования. Библейский оборот «дом его отца» сохранён, тогда как «стела» употреблена как точный и понятный термин. Синтаксис слегка разделён на два предложения ради ясности.
