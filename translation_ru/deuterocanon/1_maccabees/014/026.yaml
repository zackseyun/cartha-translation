  text: ἐστήρισεν γὰρ αὐτὸς καὶ οἱ ἀδελφοὶ αὐτοῦ καὶ ὁ οἶκος τοῦ πατρὸς αὐτοῦ, καὶ ἐπολέμησαν τοὺς ἐχθροὺς Ἰσραὴλ ἀπʼ αὐτῶν, καὶ ἔστησαν αὐτῷ ἐλευθερίαν, καὶ κατέγραψαν ἐν δέλτοις χαλκαῖς, καὶ ἔθεντο ἐν στήλῃ ἐν ὄρει Σιών.
