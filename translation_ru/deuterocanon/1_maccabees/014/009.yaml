lexical_decisions:
- source_word: πρεσβύτεροι
  choice: старейшины
  rationale: В общественной обстановке слово обозначает уважаемых старших мужей общины; перевод сохраняет социальный оттенок, не утверждая непременно формальную должность.
- source_word: ἐν ταῖς πλατείαις
  choice: на площадях
  rationale: πλατεῖαι может обозначать широкие улицы или открытые городские площади; здесь естественно передаёт место общественного общения.
- source_word: ἐκάθηντο
  choice: сидели
  rationale: Имперфект рисует продолжающуюся или обычную сцену; русское «сидели» передаёт её естественно.
- source_word: πάντες περὶ ἀγαθῶν ἐκοινολόγουν
  choice: все вместе беседовали о благополучии
  rationale: ἐκοινολόγουν выражает совместную беседу, а широкое περὶ ἀγαθῶν в контексте мирной и благополучной жизни допускает собирательное «о благополучии», не сужая речь до отдельных благ.
- source_word: οἱ νεανίσκοι
  choice: юноши
  rationale: Точное и естественное обозначение молодых мужчин в возвышенном историческом повествовании.
- source_word: ἐνεδύσαντο
  choice: облачились
  rationale: Средний залог обозначает, что они сами надели одежду; «облачились» соответствует торжественному контексту.
- source_word: δόξας
  choice: славу
  rationale: Буквальное значение множественного δόξας — «славы»; в сочетании с глаголом облачения слово образно указывает на почётное или великолепное убранство. Основной текст сохраняет необычный образ и его смысловую напряжённость.
- source_word: στολὰς πολέμου
  choice: воинские одежды
  rationale: Буквально «одежды войны»; перевод сохраняет предмет одежды и военную окраску, не подменяя выражение более узким «доспехи».
