  text: and that the Jews and the priests were pleased that Simon should be their leader and high priest forever[a], until a trustworthy prophet should arise.
translation:
  language: ru
  text: и что иудеи и священники одобрили, чтобы Симон был их предводителем и первосвященником навеки, пока не восстанет пророк, достойный доверия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «верный пророк» или «истинный пророк». Греческое πιστός может означать того, кто верен или достоин доверия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: одобрили
  rationale: Глагол выражает благосклонное решение или официальное согласие; «одобрили» естественно передаёт это значение в контексте постановления.
- source_word: ἡγούμενον
  choice: предводителем
  rationale: Слово обозначает руководителя, не уточняя конкретной политической должности; «предводитель» сохраняет эту широту и соответствует возвышенному историческому контексту.
- source_word: ἀρχιερέα
  choice: первосвященником
  rationale: Устоявшееся русское обозначение должности верховного священника.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Передаёт формулу неограниченной длительности, не устраняя её напряжения с последующим ограничительным оборотом «пока».
- source_word: ἕως τοῦ ἀναστῆναι
  choice: пока не восстанет
  rationale: Передаёт ожидаемое в будущем появление пророка и обозначенную текстом временную границу.
- source_word: προφήτην πιστόν
  choice: пророк, достойный доверия
  rationale: πιστός здесь может характеризовать пророка как надёжного, заслуживающего доверия; описательный вариант естественен по-русски и не исключает возможного значения «верный».
theological_decisions:
- issue: Соотношение εἰς τὸν αἰῶνα и последующего ἕως
  choice: Сохранить одновременно «навеки» и ограничение «пока не восстанет пророк».
  alternative: Ослабить «навеки» до значения неопределённо долгого срока либо считать последующую оговорку лишь пояснением.
  rationale: Греческий текст сочетает формулу постоянства с явной временной границей; перевод сохраняет это смысловое и богословское напряжение, не разрешая его за читателя.
- issue: Значение πιστόν применительно к пророку
  choice: «достойный доверия»
  alternative: «верный» или «истинный»
  rationale: Все эти значения лексически возможны. Основной текст подчёркивает надёжность и признанность пророка, а сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксис постановления сохранён, но сделан естественным; термин «предводитель» не навязывает более узкой политической должности.
