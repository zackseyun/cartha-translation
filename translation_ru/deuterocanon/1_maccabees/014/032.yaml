lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Передаёт временную и повествовательную последовательность кратко и естественно.
- source_word: ἀνέστησενσεν
  choice: поднялся
  rationale: Печатная форма аномальна и, по контексту, указывает на выступление Симона ради своего народа; «поднялся» сохраняет образ и не расширяет его до свободного пересказа.
- source_word: ἐπολέμησεν περὶ τοῦ ἔθνους αὐτοῦ
  choice: сражался за свой народ
  rationale: περὶ при глаголе войны выражает действие ради или в защиту кого-либо; «сражался за» естественно передаёт это по-русски.
- source_word: ἔθνος
  choice: народ
  rationale: В данном контексте обозначает иудейский народ как единое общественно-политическое целое. Русское «народ» исторически естественнее, чем «нация», и не устраняет коллективного смысла.
- source_word: ἐδαπάνησεν χρήματα πολλὰ τῶν ἑαυτοῦ
  choice: потратил много собственных денег
  rationale: Точно и современно передаёт расходование значительных личных средств Симона.
- source_word: ὡπλοδότησεν
  choice: вооружил
  rationale: Кратко и точно передаёт снабжение оружием.
- source_word: τοὺς ἄνδρας τῆς δυνάμεως τοῦ ἔθνους αὐτοῦ
  choice: мужчин из войска своего народа
  rationale: «Мужчин» сохраняет явно мужское ἄνδρας, а «войско» передаёт военное значение δύναμις в этом контексте.
- source_word: ὀψώνια
  choice: жалованье
  rationale: В военном контексте слово означает содержание или плату воинам; «жалованье» естественно обозначает выдаваемую им денежную плату.
theological_decisions:
- issue: Передача ἔθνος в иудейском общественно-политическом контексте
  choice: народ
  alternative: нация
  rationale: «Народ» сохраняет коллективную идентичность Израиля и лучше соответствует естественной русской речи об античном периоде, не привнося оттенков современного национализма.
- issue: Мужской референт в τοὺς ἄνδρας
  choice: мужчин
  alternative: воинов
  rationale: Исходный текст прямо называет мужчин; перевод сохраняет это уточнение, не заменяя его родово нейтральным обозначением.
- issue: Аномальная печатная форма ἀνέστησενσεν
  choice: поднялся
  alternative: выступил
  rationale: Контекст требует начала активных действий Симона, однако текстовая форма испорчена или содержит повтор. «Поднялся» сохраняет традиционный образ, а примечание открыто сообщает о трудности.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Предложения разделены для ясности; военная лексика конкретна, но не архаична. Все примечания отмечены в основном тексте.
