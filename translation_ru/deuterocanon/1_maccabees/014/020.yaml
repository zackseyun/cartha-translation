base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/020.yaml
  text: And this is the copy of the letter that the Spartans sent—the rulers of the Spartans and the city—to Simon the high priest[a], and to the elders and the priests and the rest of the people of the Jews, their brothers[b], greetings.
translation:
  language: ru
  text: Вот копия посланий[a], которые спартанцы — правители Спарты и город — направили первосвященнику Симону, старейшинам, священникам и остальному народу иудеев, своим братьям[b], с приветствием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «копия посланий». В греческом тексте стоит множественное число, хотя далее приводится одно дипломатическое послание.'
    reason: Сохраняет формальное множественное число оригинала и поясняет его соотношение с последующим текстом.
  - marker: b
    text: «Братьям» — дипломатическое обозначение отношений между спартанцами и иудеями.
    reason: Поясняет функцию обращения, не утверждая характера или исторической обоснованности заявленного родства.
lexical_decisions:
- source_word: ἀντίγραφον
  choice: копия
  rationale: Обозначает письменную копию или воспроизведение документа; «копия» естественно и точно передаёт смысл в данном контексте.
- source_word: ἐπιστολῶν
  choice: посланий
  rationale: Сохранено множественное число греческого текста. «Послание» соответствует официальной дипломатической переписке и звучит естественнее, чем архаичное «эпистола».
- source_word: οἱ Σπαρτιᾶται Σπαρτιατῶν ἄρχοντες καὶ ἡ πόλις
  choice: спартанцы — правители спартанцев и город
  rationale: 'Сохранена сжатая аппозиционная конструкция оригинала: официальными отправителями названы правители и город как гражданско-политическое целое.'
- source_word: ἱερεῖ μεγάλῳ
  choice: первосвященнику
  rationale: Устоявшееся русское наименование данной иудейской должности; буквальное «великому священнику» было бы неестественным и могло бы затемнить смысл.
- source_word: πρεσβυτέροις
  choice: старейшинам
  rationale: В общественно-религиозном контексте речь идёт о признанных руководителях, а не просто о пожилых людях.
- source_word: τῷ λοιπῷ δήμῳ τῶν Ἰουδαίων
  choice: остальному народу иудеев
  rationale: δῆμος обозначает народ как гражданское сообщество; перевод сохраняет и значение, и конструкцию с родительным падежом.
- source_word: ἀδελφοῖς
  choice: своим братьям
  rationale: Дательное приложение относится к адресатам и выражает заявленное дипломатическое братство спартанцев и иудеев; «своим» ясно показывает связь с отправителями.
- source_word: χαίρειν
  choice: Приветствуем вас!
  rationale: Передаёт стандартную эпистолярную формулу приветствия естественным современным русским языком.
theological_decisions:
- issue: Передача официального титула ἱερεῖ μεγάλῳ
  choice: первосвященнику
  alternative: великому священнику
  rationale: «Первосвященник» — точное и общепринятое русское обозначение этой должности, не привносящее дополнительного конфессионального толкования.
- issue: Характер обращения ἀδελφοῖς
  choice: своим братьям
  alternative: братьям
  rationale: Перевод сохраняет формулу братства между спартанцами и иудеями как дипломатическое заявление, не уточняя и не переосмысляя природу этого родства.
translation_notes:
  register: Современный литературный русский язык с достоинством официального дипломатического документа. Сохранены множественное число «посланий» и несколько сжатая аппозиция оригинала; двоеточие вводит формулу приветствия.
