lexical_decisions:
- source_word: ἔστησεν
  choice: утвердил
  rationale: В сочетании с обозначением должности глагол передаёт установление или официальное подтверждение положения; «утвердил» естественно выражает политико-административное признание, не подразумевая учреждения самого первосвященства.
- source_word: ἀρχιερωσύνην
  choice: первосвященство
  rationale: Существительное обозначает сан и должность первосвященника. «Первосвященство» кратко и точно сохраняет форму исходного существительного.
- source_word: κατὰ ταῦτα
  choice: в соответствии с этим
  rationale: Оборот отсылает к изложенным ранее решениям или условиям. Перевод сохраняет эту отсылку, не уточняя сверх греческого текста, шла ли речь именно об условиях.
- source_word: βασιλεὺς Δημήτριος
  choice: царь Димитрий
  rationale: «Царь» соответствует βασιλεύς, а «Димитрий» — традиционная русская библейская форма имени Δημήτριος.
- source_word: αὐτῷ
  choice: за ним
  rationale: В русском сочетании «утвердить за кем-либо» естественно обозначает официальное закрепление сана или права за данным лицом.
