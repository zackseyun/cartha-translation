  yaml_path: translation/deuterocanon/1_maccabees/014/021.yaml
  text: The envoys who had been sent to our people reported to us about your glory and honor[a], and we rejoiced at their arrival.
translation:
  language: ru
  text: Посланники[a], отправленные к нашему народу, сообщили нам о вашей славе и чести, и мы обрадовались их прибытию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посольство (делегация), отправленное к нашему народу, сообщило нам…» Греческое выражение может обозначать как дипломатическую миссию, так и самих посланников; основной текст говорит о посланниках, поскольку далее упомянуто «их прибытие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πρεσβεῖαι
  choice: посланники
  rationale: Хотя форма πρεσβεῖαι может обозначать посольства или делегации, согласование с причастием мужского рода οἱ ἀποσταλέντες и последующее αὐτῶν позволяют понимать её как обозначение самих посланников. Русское «посланники» естественно для дипломатического контекста.
- source_word: οἱ ἀποσταλέντες
  choice: отправленные
  rationale: Причастие указывает, что их отправление к народу адресатов предшествовало сообщению; русская полная причастная форма точно и естественно передаёт эту связь.
- source_word: πρὸς τὸν δῆμον ἡμῶν
  choice: к нашему народу
  rationale: δῆμος обозначает народ как гражданское или политическое сообщество. «Наш народ» понятно современному читателю и не сужает значение до собрания или государственного учреждения.
- source_word: ἀπήγγειλαν ἡμῖν
  choice: сообщили нам
  rationale: Глагол выражает передачу вести или официального донесения; «сообщили нам» сохраняет деловой характер фразы без канцелярской тяжеловесности.
- source_word: περὶ τῆς δόξης ὑμῶν καὶ τιμῆς
  choice: о вашей славе и чести
  rationale: Прямое и достойное по стилю соответствие паре δόξα и τιμή, выражающей общественное признание и почёт.
- source_word: ηὐφράνθημεν
  choice: мы обрадовались
  rationale: Передаёт сильную радость естественным современным русским языком; более буквальное «возрадовались» звучало бы архаично.
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: их прибытию
  rationale: ἐφόδος здесь естественно означает приход или прибытие. Перевод не добавляет прямо не выраженного в греческом уточнения, что это было возвращение.
