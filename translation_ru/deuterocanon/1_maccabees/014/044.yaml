base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/044.yaml
  text: And it is not permitted for anyone of the people or of the priests to set aside any of these things, or to contradict what is said by him, or to convene an assembly in the country without him, or to put on purple and wear a gold clasp.
translation:
  language: ru
  text: И никому из народа или священников не позволено отменять что-либо из этого, возражать против того, что он скажет, созывать без него собрание в стране[a], облачаться в пурпур и носить золотую застёжку[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «создавать без него группировку в стране». Греческое слово συστροφή может означать собрание, объединение или группировку, в том числе противоборствующую.'
    reason: lexical_alternative
  - marker: b
    text: Пурпурная одежда и золотая застёжка служили знаками высокого положения или официальной почести.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔξεστιν
  choice: не позволено
  rationale: Передаёт официально-правовой запрет ясно и естественно, не усиливая его до отдельного утверждения о законности.
- source_word: ἀθετῆσαί τι τούτων
  choice: отменять что-либо из этого
  rationale: ἀθετέω здесь означает упразднить, признать недействительным или отвергнуть ранее установленные положения; «отменять» естественно для контекста постановления.
- source_word: ἀντειπεῖν τοῖς ὑπʼ αὐτοῦ ῥηθησομένοις
  choice: возражать против того, что он скажет
  rationale: Сохраняется значение противоречия или выступления против, а будущий пассивный причастный оборот передан будущим временем как указание на последующие распоряжения Симона.
- source_word: ἐπιστρέψαι συστροφὴν
  choice: созывать собрание
  rationale: Трудное сочетание может обозначать организацию собрания, объединения или группировки; нейтральное «созывать собрание» соответствует административному контексту, а возможный негативный оттенок отмечен в сноске.
- source_word: ἐν τῇ χώρᾳ
  choice: в стране
  rationale: χώρα обозначает подвластную территорию или страну; этот вариант уместен в государственно-административном контексте.
- source_word: περιβαλέσθαι πορφύραν
  choice: облачаться в пурпур
  rationale: Сохраняет символическое обозначение пурпурной одежды как знака высокого положения и звучит достойно по-русски.
- source_word: ἐνπορποῦσθαι πόρπην χρυσῆν
  choice: носить золотую застёжку
  rationale: Передаёт ношение закрепляемого золотого украшения или знака достоинства без излишне узкой идентификации его как конкретного типа броши.
theological_decisions:
- issue: Характер запрета в гражданском постановлении
  choice: Передать стих как юридико-политическое установление исключительных полномочий Симона.
  alternative: Истолковать συστροφή как мятежную группировку и тем самым придать запрету более сильную морально-политическую окраску.
  rationale: Контекст представляет общественное постановление о статусе и полномочиях Симона. Греческий текст не требует однозначно понимать συστροφή как мятеж, поэтому эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством официального постановления. Синтаксис сохранён как последовательность однородных запретов; неоднозначность συστροφή не устранена излишне категоричным переводом.
