  source_fidelity: 'В целом смысл передан верно: πίστις в обоих случаях уместно передана как «верность», а должности Симона названы точно. Однако «Поэтому» делает простое повествовательное καί выводным, а «хранил праведность и верность по отношению к своему народу» недостаточно ясно передаёт συνετήρησεν с дательным в значении постоянного поддержания/проявления этих качеств ради народа.'
