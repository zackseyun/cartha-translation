  to: И народ увидел верность Симона[a] и славу, которую он задумал принести своему народу, и поставил его своим предводителем и первосвященником — за всё это, за праведность и верность, которые он неизменно проявлял в служении своему народу, и за то, что он всеми средствами стремился возвысить свой народ.
