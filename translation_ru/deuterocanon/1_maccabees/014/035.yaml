base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/035.yaml
  text: And the people saw the faithfulness of Simon and the glory that he had purposed to bring about for his nation[a], and they appointed him as their leader and high priest, because he had done all these things, and because of the righteousness and the faithfulness that he had maintained for his nation[b], and because he had sought in every way to exalt his people.
translation:
  language: ru
  text: И народ увидел верность Симона[a] и славу, которую он задумал принести своему народу, и поставил его своим предводителем и первосвященником — за всё это, за праведность и верность, которые он неизменно проявлял в служении своему народу, и за то, что он всеми средствами стремился возвысить свой народ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать также «надёжность» или «веру»; здесь, в обоих случаях его употребления, речь, вероятнее всего, о доказанной делами верности Симона.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν / πίστιν
  choice: верность
  rationale: В обоих случаях контекст говорит о доказанной делами надёжности и преданности Симона своему народу; «вера» здесь могла бы создать неуместное впечатление, будто речь прежде всего о его религиозном убеждении.
- source_word: δόξαν
  choice: славу
  rationale: '«Слава» сохраняет широту греческого слова: оно может обозначать честь, высокий статус или известность, которые Симон намеревался доставить своему народу.'
- source_word: ἐβουλεύσατο ποιῆσαι
  choice: задумал принести
  rationale: Передаёт обдуманное намерение Симона и естественно сочетается в русском языке со «славой».
- source_word: ἔθεντο
  choice: поставили
  rationale: В данном контексте глагол обозначает официальное утверждение Симона в должностях.
- source_word: ἡγούμενον
  choice: предводителем
  rationale: Сохраняет общее значение руководителя, не уточняя политическую должность сверх греческого текста.
- source_word: ἀρχιερέα
  choice: первосвященником
  rationale: Устоявшееся русское обозначение верховного священнического служения в иудейском контексте.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: Сохраняет этическую широту термина; возможный общественно-политический оттенок «справедливости» отмечен в сноске.
- source_word: συνετήρησεν τῷ ἔθνει αὐτοῦ
  choice: хранил ... по отношению к своему народу
  rationale: Передаёт длительное и последовательное сохранение праведности и верности в отношениях Симона с народом, избегая неестественного буквального оборота.
- source_word: ἐζήτησεν παντὶ τρόπῳ ὑψῶσαι
  choice: всеми средствами стремился возвысить
  rationale: Передаёт настойчивое использование всех доступных способов для повышения положения и чести народа.
theological_decisions:
- issue: Значение πίστις при характеристике Симона
  choice: верность
  alternative: вера; надёжность
  rationale: Историко-политический контекст и параллель с конкретными делами указывают прежде всего на преданность и надёжность Симона. Сноска сохраняет лексическую широту слова, не превращая его здесь исключительно в обозначение религиозной веры.
- issue: Значение δικαιοσύνη в описании общественного поведения Симона
  choice: праведность
  alternative: справедливость
  rationale: Термин может охватывать как нравственную правоту, так и справедливое управление. Основной текст сохраняет более широкое «праведность», а гражданско-правовой оттенок указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким историко-библейским регистром. «Предводитель» и «первосвященник» звучат достойно и ясно; синтаксис разделён на два предложения для естественной читаемости без изменения логических связей оригинала.
