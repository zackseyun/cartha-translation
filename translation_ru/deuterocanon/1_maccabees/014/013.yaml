lexical_decisions:
- source_word: ἐξέλιπεν πολεμῶν
  choice: никто уже не воевал
  rationale: Греческое сочетание буквально выражает прекращение военных действий. По контексту подразумевается неопределённый субъект — противник; безлично-обобщённая русская формулировка естественно передаёт этот смысл, не создавая неясного местоимения «он».
- source_word: αὐτούς
  choice: против них
  rationale: Прямое местоименное соответствие, отсылающее к упомянутым ранее жителям или народу.
- source_word: ἐπὶ τῆς γῆς
  choice: в стране
  rationale: В историко-политическом контексте γῆ обозначает страну или землю как территорию, а не весь мир.
- source_word: οἱ βασιλεῖς αὐτῶν
  choice: их цари
  rationale: Сохраняет естественное значение родительного местоимения и связь царей с противниками.
- source_word: συνετρίβησαν
  choice: были сокрушены
  rationale: Пассивная форма и сильный образ глагола συντρίβω переданы буквально и уместно для решительного военного поражения.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: в те дни
  rationale: Устойчивое, ясное и стилистически достойное соответствие греческому временному обороту.
