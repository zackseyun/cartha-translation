  source_fidelity: Перевод точно передаёт постановительный характер εἶπαν θέσθαι, письменный акт (τὴν γραφὴν ταύτην), материал и форму носителя (ἐν δέλτοις χαλκαῖς), установку самих досок и их размещение в охраняемой храмовой зоне. «Во дворе святилища» является допустимой передачей ἐν περιβόλῳ τῶν ἁγίων и согласуется с английским audit trail («in the court of the sanctuary»). «Надёжном месте» адекватно сохраняет смысл ἐν τόπῳ πιστῷ.
