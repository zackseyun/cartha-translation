  text: And they said that this document should be put on bronze tablets and set up in the court of the sanctuary, in a secure place.
translation:
  language: ru
  text: И постановили поместить эту запись на медных досках и установить их во дворе святилища, в надёжном месте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν γραφὴν ταύτην
  choice: эту запись
  rationale: Передаёт конкретный письменный акт или документ, о котором говорится в контексте, без излишне канцелярского оттенка.
- source_word: εἶπαν θέσθαι
  choice: постановили поместить
  rationale: В данном постановляющем контексте εἶπαν выражает принятое решение, а θέσθαι — размещение текста на досках; перевод сохраняет смысл, не добавляя прямо не выраженного «высечь».
- source_word: ἐν δέλτοις χαλκαῖς
  choice: на медных досках
  rationale: χαλκοῦς может обозначать медный или бронзовый материал; традиционное и прямое «медных» сохраняет лексическую широту греческого слова.
- source_word: ἐν περιβόλῳ τῶν ἁγίων
  choice: во дворе святилища
  rationale: περίβολος обозначает ограждённую храмовую территорию или двор, а τὰ ἅγια здесь естественно передаётся как «святилище».
- source_word: ἐν τόπῳ πιστῷ
  choice: в надёжном месте
  rationale: πιστός в данном сочетании означает безопасное, сохранное или надёжное место.
theological_decisions:
- issue: Значение τῶν ἁγίων
  choice: святилища
  alternative: святых мест
  rationale: Контекст установки официальной надписи на храмовой территории поддерживает собирательное обозначение святилища, не вводя дополнительной конфессиональной конкретизации.
translation_notes:
  register: Современный литературный русский язык; официальный характер решения передан словом «постановили», при этом синтаксис остаётся ясным и естественным.
