  text: And he fortified the cities of Judea[a], and Bethsura on the borders of Judea, where formerly the weapons of the enemies had been, and he stationed there a garrison of Jewish men.
translation:
  language: ru
  text: Он укрепил города Иудеи и Бетсуру, расположенную на границе Иудеи, где прежде находилось оружие врагов, и разместил там гарнизон из иудейских мужчин[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из мужчин — жителей Иудеи». Греческое Ἰουδαίους здесь может указывать как на иудеев, так и на жителей Иудеи; ἄνδρας прямо обозначает мужчин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠχύρωσεν
  choice: укрепил
  rationale: Глагол обозначает укрепление городов и крепостей оборонительными сооружениями или военными мерами; «укрепил» естественно передаёт это значение.
- source_word: τὰς πόλεις
  choice: города
  rationale: Обычное значение существительного; в данном военно-административном контексте речь идёт об укреплённых городских центрах.
- source_word: Βαιθσουρὰμ
  choice: Бетсуру
  rationale: Передача греческой формы топонима русской транслитерацией; винительный падеж соответствует синтаксису предложения.
- source_word: ἐπὶ τῶν ὁρίων
  choice: на границе
  rationale: Выражение указывает на пограничное положение Бетсуры. Русское единственное число «на границе» здесь естественнее буквального «на границах», не меняя смысла.
- source_word: ὅπλα
  choice: оружие
  rationale: Собирательное русское «оружие» ясно и естественно передаёт военное снаряжение, ранее находившееся в этом месте.
- source_word: τῶν πολεμίων
  choice: врагов
  rationale: Родительный падеж обозначает принадлежность оружия неприятелю; «врагов» — прямой и понятный эквивалент.
- source_word: τὸ πρότερον
  choice: прежде
  rationale: Кратко и естественно обозначает прежнее положение дел.
- source_word: ἔθετο ἐκεῖ φρουράν
  choice: разместил там гарнизон
  rationale: В военном контексте сочетание означает размещение постоянного охранного отряда; «разместил» сохраняет действие, а «гарнизон» — военную функцию.
- source_word: ἄνδρας Ἰουδαίους
  choice: гарнизон из иудеев
  rationale: Ἰουδαίους может обозначать иудеев как этнорелигиозную общность либо жителей Иудеи. Слово ἄνδρας указывает на мужчин, но по-русски в составе выражения «гарнизон из иудеев» мужской состав грамматически ясен без тяжеловесного «мужчин-иудеев».
theological_decisions:
- issue: Значение Ἰουδαίας / Ἰουδαίους
  choice: Иудея / иудеи
  alternative: Иудея / жители Иудеи
  rationale: Ἰουδαία однозначно передаётся как название области «Иудея». Форма Ἰουδαίους допускает как этнорелигиозное, так и регионально-политическое понимание; основной текст использует традиционное и ёмкое «иудеи», а региональная возможность сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с ясным историко-военным стилем. Синтаксис слегка упрощён по сравнению с греческой цепочкой союзов, но все смысловые связи сохранены; причастный оборот «расположенную» устраняет возможную неясность, что пограничное определение относится к Бетсуре.
