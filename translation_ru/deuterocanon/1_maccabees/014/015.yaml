  text: He honored the holy things and increased the vessels of the sanctuary[a][b].
translation:
  language: ru
  text: Он почтил святыни[a] и умножил сосуды святилища[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прославил святилище»; или: «почтил священные предметы». Греческое выражение τὰ ἅγια может обозначать как святыни, так и, в более широком смысле, святилище.'
    reason: lexical_alternative
  - marker: b
    text: То есть священные сосуды и принадлежности, использовавшиеся в святилище.
    reason: cultural_note
lexical_decisions:
- source_word: τὰ ἅγια
  choice: святыни
  rationale: Форма среднего рода множественного числа может обозначать священные предметы или, шире, святилище. «Святыни» сохраняет широкий смысл и не сливает первую часть стиха со второй.
- source_word: ἐδόξασεν
  choice: почтил
  rationale: Глагол выражает воздание славы или чести; в данном историческом и культовом контексте «почтил» звучит естественно и достойно.
- source_word: ἐπλήθυνεν
  choice: умножил
  rationale: Глагол означает сделать более многочисленным; здесь речь, вероятно, идет о пополнении храмовой утвари.
- source_word: τὰ σκεύη
  choice: сосуды
  rationale: В культовом контексте слово обозначает сосуды и принадлежности, используемые при богослужении; «сосуды» — традиционный и понятный русский эквивалент.
- source_word: τῶν ἁγίων
  choice: святилища
  rationale: Родительный оборот указывает на священное место или сферу, к которой относятся сосуды; «святилища» ясно передает культовый контекст.
theological_decisions:
- issue: Значение τὰ ἅγια в первой части стиха
  choice: Передано как «святыни» с сохранением собирательной широты выражения.
  alternative: «Святилище» или «священные предметы».
  rationale: Греческое выражение допускает предметное и пространственное понимание; основной текст не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Лаконичный параллелизм греческого текста сохранен; неоднозначность τὰ ἅγια отмечена в сноске.
