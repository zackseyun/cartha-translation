lexical_decisions:
- source_word: ἐχορήγησεν
  choice: снабдил
  rationale: Передаёт обеспечение необходимым, вероятно за счёт правителя, и естественно сочетается с продовольствием.
- source_word: βρώματα
  choice: продовольствием
  rationale: Буквально речь о пище, но в контексте снабжения городов уместно собирательное военно-административное «продовольствие».
- source_word: ἔταξεν αὐτὰς ἐν σκεύεσιν ὀχυρώσεως
  choice: оснастил их средствами для укрепления
  rationale: Передаёт приведение городов в подготовленное оборонительное состояние и не сужает σκεύεσιν до оружия или отдельных орудий.
- source_word: ἕως ὅτου
  choice: так что
  rationale: В данном контексте оборот естественно выражает достигнутый результат или степень, а буквальное временное «пока не» по-русски создавало бы неуместный смысл прекращения действий.
- source_word: τὸ ὄνομα τῆς δόξης αὐτοῦ
  choice: его славное имя
  rationale: Естественная русская передача тяжеловесной греческой генитивной конструкции «имя его славы».
- source_word: ὠνομάσθη
  choice: стало известно
  rationale: Передаёт контекстуальное значение пассива ὀνομάζω — имя получило широкую известность, — сохраняя буквальную форму в примечании.
- source_word: ἕως ἄκρου γῆς
  choice: до края земли
  rationale: Сохраняет единственное число и образ крайнего предела земли в греческом тексте.
