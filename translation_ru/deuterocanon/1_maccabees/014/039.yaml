  text: and he made him one of his Friends[a], and he honored him with great honor.
translation:
  language: ru
  text: и сделал его одним из своих Друзей[a], и удостоил его великой чести.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одним из своих друзей». Греческое выражение может обозначать как личную дружбу, так и, что здесь вероятнее, принадлежность к официальному кругу царских «Друзей».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησεν
  choice: сделал
  rationale: В конструкции с дополнением и именной группой означает введение человека в определённый круг или статус; «сделал его одним из» близко передаёт греческую форму и естественно звучит по-русски.
- source_word: τῶν φίλων αὐτοῦ
  choice: одним из своих Друзей
  rationale: Родительный множественного числа обозначает включение в группу. В эллинистической придворной среде «Друзья» могло быть наименованием признанного придворного ранга; прописная буква передаёт вероятный титулярный смысл, не устраняя возможности обычного значения.
- source_word: ἐδόξασεν
  choice: удостоил чести
  rationale: В царском и политическом контексте глагол обозначает оказание почести или возвышение, а не богословское «прославление».
- source_word: δόξῃ μεγάλῃ
  choice: великой чести
  rationale: Дательный падеж выражает то, чем или в какой мере он был почтён. «Великая честь» сохраняет социально-политический смысл и воспроизводит усиление исходного выражения.
theological_decisions:
- issue: Следует ли понимать φίλοι как обычное обозначение друзей или как придворный титул
  choice: «Друзей» с прописной буквы — для передачи вероятного значения придворного звания
  alternative: «друзей» — в смысле личных близких или товарищей
  rationale: В эллинистическом царском употреблении «Друзья» часто составляли официальный круг приближённых. Сноска сохраняет подлинную смысловую неоднозначность греческого текста.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified повествовательным строем. Повтор корня δόξ- передан естественным русским оборотом «удостоил… чести», без искусственного «прославил славой».
