  text: And the land was at rest all the days of Simon, and he sought good for his nation; and his authority and his glory were pleasing to them all his days.
translation:
  language: ru
  text: И земля пребывала в покое во все дни Симона, и он искал блага для своего народа; и власть его и слава его были им угодны во все его дни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασεν
  choice: покоилась
  rationale: Передаёт установившееся спокойное состояние страны, не добавляя идеи официально заключённого мира.
- source_word: ἡ γῆ
  choice: земля
  rationale: В данном историческом контексте обозначает землю народа, а не весь мир; традиционное и естественное библейское соответствие.
- source_word: ἐζήτησεν ἀγαθὰ
  choice: искал блага
  rationale: Сохраняет активное стремление Симона к благополучию народа и близко следует греческой формулировке.
- source_word: τῷ ἔθνει αὐτοῦ
  choice: для своего народа
  rationale: В современном русском «народ» естественно обозначает здесь иудейскую этнополитическую общность; «нация» звучала бы более современно-политически.
- source_word: ἡ ἐξουσία αὐτοῦ
  choice: власть его
  rationale: Передаёт осуществляемые Симоном полномочия и управление без усиления до царского владычества.
- source_word: ἡ δόξα αὐτοῦ
  choice: слава его
  rationale: Сохраняет возвышенный тон δόξα и допускает присущие слову оттенки чести и известности.
- source_word: ἤρεσεν αὐτοῖς
  choice: были угодны им
  rationale: Естественно согласует в русском два однородных подлежащих и сохраняет положительную оценку со стороны народа.
- source_word: πάσας τὰς ἡμέρας ... πάσας τὰς ἡμέρας
  choice: во все дни ... во все его дни
  rationale: Сохраняет намеренный повтор, обрамляющий характеристику всего времени правления Симона.
theological_decisions:
- issue: Политическая похвала правлению Симона
  choice: Передать стих как историческую похвалу без добавления заветных или мессианских смыслов.
  alternative: Истолковать покой земли как прямо названный дар Бога или придать образу Симона мессианское значение.
  rationale: Греческий текст положительно оценивает правление Симона, но в этом стихе прямо не называет Бога источником покоя и не использует мессианских категорий.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Повтор «во все дни» сохранён; синтаксис близок к греческому, но остаётся ясным и естественным.
