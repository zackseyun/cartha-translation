  source_fidelity: 'Смысловые соответствия в черновике точны: ἡ γῆ передано как «земля», ἐζήτησεν ἀγαθὰ — как активное стремление к благу народа, а ἐξουσία и δόξα — без неоправданного усиления. Повтор χρονологической формулы также сохранён. Однако «покоилась земля» в современном литературном русском звучит несколько неестественно и может вызвать образ физически «отдыхающей» земли; «пребывала в покое» точнее передаёт установленное спокойное состояние ἡσύχασεν.'
