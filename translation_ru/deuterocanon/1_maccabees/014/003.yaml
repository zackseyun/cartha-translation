lexical_decisions:
- source_word: ἐπορεύθη
  choice: пошёл
  rationale: Аорист πορεύομαι служит здесь простым повествовательным глаголом движения; военный оттенок не добавляется сверх явно названного нападения.
- source_word: ἐπάταξεν
  choice: напал на
  rationale: πάτασσω буквально связано с ударом, но применительно к военному лагерю естественное русское «напал на» сохраняет действие и не привносит обязательного результата «разгромил» или «победил».
- source_word: παρεμβολὴν
  choice: лагерь
  rationale: В данном военном контексте παρεμβολή обозначает лагерь или стан; «лагерь» ясно и естественно для современного читателя.
- source_word: συνέλαβεν
  choice: захватил
  rationale: συλλαμβάνω означает схватить или захватить; «захватил» соответствует военному контексту и не несёт современного юридического оттенка слова «арестовал».
- source_word: ἤγαγεν
  choice: привёл
  rationale: ἄγω обозначает сопровождение или доставление человека к другому лицу; «привёл к Арсаку» точно передаёт конструкцию.
- source_word: Ἀρσάκην
  choice: Арсаку
  rationale: Использована традиционная русская форма имени Ἀρσάκης — Арсак, поставленная в дательном падеже после «к».
- source_word: ἔθετο αὐτὸν ἐν φυλακῇ
  choice: заключил в темницу
  rationale: Греческое сочетание буквально означает «поместил его под стражу / в заключение»; устойчивое русское выражение «заключил в темницу» естественно передаёт помещение пленника в узилище.
