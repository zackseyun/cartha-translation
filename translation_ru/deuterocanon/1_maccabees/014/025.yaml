  text: When the people heard these words[a], they said, “What favor shall we repay to Simon and to his sons?”
translation:
  language: ru
  text: 'Когда народ услышал эти слова, он сказал: «Чем нам отблагодарить Симона и его сыновей?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Когда услышал
  rationale: Вводит временное обстоятельство и сохраняет естественную для русского повествования последовательность; δέ отдельно не выражено, поскольку здесь оно лишь связывает события.
- source_word: ὁ δῆμος
  choice: народ … люди
  rationale: δῆμος обозначает народ как единое сообщество. Повторное «люди» при сказуемом во множественном числе естественно передаёт смысловое согласование греческого εἶπαν с собирательным существительным и избегает ненормативного «народ сказали».
- source_word: τῶν λόγων τούτων
  choice: эти слова
  rationale: Прямо отсылает к предшествующим словам и точно передаёт λόγοι в данном контексте.
- source_word: Τίνα χάριν ἀποδώσομεν
  choice: Чем нам отблагодарить
  rationale: Естественная русская передача вопроса о том, какую благодарность или ответную услугу воздать; сохраняет взаимный смысл сочетания χάρις с ἀποδίδωμι без неестественного буквального оборота.
- source_word: Σίμωνι καὶ τοῖς υἱοῖς αὐτοῦ
  choice: Симона и его сыновей
  rationale: После «отблагодарить» русский требует винительного падежа; υἱοί конкретно означает сыновей.
