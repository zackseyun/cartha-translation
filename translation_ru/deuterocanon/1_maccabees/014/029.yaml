base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/029.yaml
  text: Since wars had often arisen in the land[a], Simon son of Mattathias, one of the sons of Joarib, and his brothers gave themselves to danger and stood against the adversaries of their nation, so that their sanctuary and the law might stand[c][b], and they glorified their nation with great glory.
translation:
  language: ru
  text: Поскольку в стране часто вспыхивали войны, Симон, сын Маттафии, из рода Иоарива, и его братья подвергли себя опасности[a] и противостояли врагам своего народа, чтобы устояли их святилище[b] и закон; так они принесли своему народу великую славу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отдавали себя опасности»; оборот подчёркивает добровольное принятие риска.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их святыни» либо «их священные места». В греческом употреблена форма множественного числа, которая может обозначать святыни или храмовый комплекс в целом.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Буквально: «прославили свой народ великой славой».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐπεὶ πολλάκις ἐγενήθησαν πόλεμοι ἐν τῇ χώρᾳ
  choice: Поскольку в стране часто вспыхивали войны
  rationale: Причинное ἐπεὶ передано словом «поскольку»; сочетание ἐγενήθησαν πόλεμοι обозначает неоднократное возникновение войн, для чего по-русски естественно «вспыхивали войны».
- source_word: Σίμων δὲ ὁ υἱὸς Ματταθίου ὁ υἱὸς τῶν υἱῶν Ἰωαρίβ
  choice: Симон, сын Маттафии, из рода Иоарива
  rationale: Громоздкое буквальное «сын из сынов Иоарива» выражает родовую принадлежность; «из рода Иоарива» естественно передаёт генеалогический смысл, не утверждая непосредственного сыновства.
- source_word: ἔδωκαν ἑαυτοὺς τῷ κινδύνῳ
  choice: добровольно подвергали себя опасности
  rationale: Греческий оборот буквально изображает предание себя опасности и подчёркивает сознательное принятие риска. Русское выражение сохраняет этот смысл без неестественной кальки.
- source_word: ἀντέστησαν τοῖς ὑπεναντίοις τοῦ ἔθνους αὐτῶν
  choice: противостояли врагам своего народа
  rationale: ἀντέστησαν обозначает деятельное сопротивление; ὑπεναντίοι — враждебных противников. В данном национально-историческом контексте ἔθνος естественно передаётся как «народ».
- source_word: ὅπως σταθῇ τὰ ἅγια αὐτῶν καὶ ὁ νόμος
  choice: чтобы устояли их святилище и закон
  rationale: «Устояли» сохраняет образ глагола ἵστημι и выражает сохранение святилища и закона под натиском врагов. τὰ ἅγια — формально множественное обозначение святынь или священного пространства, здесь контекстуально переданное собирательным единственным «святилище».
- source_word: δόξῃ μεγάλῃ ἐδόξασαν τὸ ἔθνος αὐτῶν
  choice: так они принесли своему народу великую славу
  rationale: Передаёт усилительный однокоренной оборот «прославили великой славой» естественным современным русским языком, сохраняя значение великой чести и славы.
theological_decisions:
- issue: Значение τὰ ἅγια αὐτῶν
  choice: их святилище
  alternative: их святыни / их священные места
  rationale: Форма множественного числа допускает священные предметы или места, однако соседство с законом и контекст защиты храмового устройства поддерживают собирательное значение «святилище». Неоднозначность отмечена в сноске.
- issue: Передача ὁ νόμος
  choice: закон
  alternative: Закон
  rationale: Речь идёт об иудейском законе, то есть Торе, но греческий текст не кодирует принятую в некоторых традициях смысловую капитализацию. Строчная буква сохраняет нейтральность.
- issue: Передача ἔθνος в отношении иудеев
  choice: народ
  alternative: народность / нация
  rationale: В памятной общественно-политической надписи слово имеет корпоративный смысл. Русское «народ» передаёт его без современных националистических оттенков слова «нация».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным историко-библейским звучанием. Синтаксис публичного памятного постановления сохранён, но облегчён точкой с запятой; кальки и архаизмы исключены.
