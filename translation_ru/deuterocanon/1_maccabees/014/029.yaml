  naturalness: Современный литературный русский в целом естественен. Замена «добровольно подвергали себя опасности» на «подвергли себя опасности» делает временно-видовую форму точнее и фразу компактнее, не утрачивая смысла добровольного риска, пояснённого в сноске.
  terminology: «Святилище», «закон», «народ» и «великая слава» уместны и нейтральны. Сноска к «святилищу» корректно сохраняет неоднозначность греческого множественного τὰ ἅγια. «Из рода Иоарива» является естественной передачей генеалогического оборота без ложного утверждения о непосредственном сыновстве.
