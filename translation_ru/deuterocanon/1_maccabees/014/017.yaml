lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: Но когда они услышали
  rationale: ὡς с аористом вводит временное придаточное, а δέ обозначает мягкий переход или лёгкое противопоставление; «но когда» естественно продолжает повествование.
- source_word: Σίμων ὁ ἀδελφὸς αὐτοῦ
  choice: Симон, его брат
  rationale: Приложение прямо указывает на родство Симона с ранее названным лицом; запятые обеспечивают ясность в современном русском.
- source_word: γέγονεν
  choice: стал
  rationale: Перфект обозначает совершившееся вступление в должность с сохраняющимся результатом; в русском повествовании «стал» естественно передаёт это значение.
- source_word: ἀντ' αὐτοῦ
  choice: вместо него
  rationale: 'ἀντί выражает замещение или преемство: Симон занял должность своего брата.'
- source_word: ἀρχιερεὺς
  choice: первосвященником
  rationale: Устойчивое и точное русское наименование высшей иудейской священнической должности.
- source_word: ἐπικρατεῖ
  choice: правит
  rationale: В данном политико-территориальном контексте глагол означает осуществление власти или управления; настоящее время сохраняет видовременной контраст греческого текста и подчёркивает продолжающееся положение дел.
- source_word: τῆς χώρας
  choice: страной
  rationale: χώρα здесь обозначает территорию как целое, в состав которой входят далее упомянутые города; «страной» естественно и достаточно широко.
- source_word: τῶν πόλεων τῶν ἐν αὐτῇ
  choice: находящимися в ней городами
  rationale: 'Формулировка сохраняет явное пространственное отношение: города расположены в пределах названной страны.'
theological_decisions:
- issue: Политический смысл ἐπικρατεῖ в историческом повествовании
  choice: правит
  alternative: владеет; держит под своей властью
  rationale: Контекст говорит о гражданской и территориальной власти Симона. «Правит» передаёт управление, не добавляя богословских или конфессиональных оттенков.
translation_notes:
  register: 'Современный литературный русский язык с достойным повествовательным тоном. Сохранена незавершённость стиха: в греческом тексте это придаточная часть предложения, заканчивающаяся запятой.'
