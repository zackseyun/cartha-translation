  text: And with all his glory he took Joppa as a harbor[a], and made it an access point to the islands of the sea.
translation:
  language: ru
  text: И во всей своей славе он овладел Иоппией, чтобы иметь гавань, и открыл доступ к островам моря.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «и устроил вход к островам моря». Вероятно, имеется в виду, что Иоппия стала пунктом морского сообщения с островами.'
    reason: Лексическая неоднозначность выражения ἐποίησεν εἴσοδον и функции дательного падежа.
lexical_decisions:
- source_word: μετὰ πάσης τῆς δόξης αὐτοῦ
  choice: во всей своей славе
  rationale: Сохраняет возвышенный хвалебный тон и широкий смысл δόξα — славу, почёт и величие, — не сводя его только к внешнему великолепию.
- source_word: ἔλαβεν
  choice: овладел
  rationale: Передаёт широкое значение «взял, приобрёл во владение», не усиливая военный оттенок до однозначного «захватил».
- source_word: τὴν Ἰόππην
  choice: Иоппией
  rationale: «Иоппия» — традиционная русская форма библейского топонима Ἰόππη.
- source_word: εἰς λιμένα
  choice: чтобы иметь гавань
  rationale: 'Естественно передаёт целевое или результативное значение εἰς: Иоппия была приобретена для использования в качестве гавани. «Гавань» близко соответствует λιμήν.'
- source_word: ἐποίησεν εἴσοδον
  choice: открыл доступ
  rationale: В данном контексте сочетание означает создание входа или возможности сообщения; русское «открыл доступ» ясно выражает практическую функцию Иоппии.
- source_word: ταῖς νήσοις τῆς θαλάσσης
  choice: к островам моря
  rationale: Дательный падеж обозначает направленность или отношение доступа, а выражение «острова моря» сохраняет возвышенную форму греческого родительного оборота.
