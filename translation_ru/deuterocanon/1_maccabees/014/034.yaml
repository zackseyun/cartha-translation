  yaml_path: translation/deuterocanon/1_maccabees/014/034.yaml
  text: And he fortified Joppa[a], which is by the sea, and Gazara, which is on the borders of Azotus, where the enemies had formerly lived; and he settled Jews there[b], and placed in them whatever was needed for their restoration.
translation:
  language: ru
  text: Он укрепил приморскую Иоппию и Газару[a], находившуюся у границ Азота, где прежде жили враги. Он поселил там иудеев и разместил в этих городах всё необходимое для их восстановления[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Газер» — более привычная форма этого древнего названия; в греческом тексте здесь стоит «Газара».'
    reason: lexical_alternative
  - marker: b
    text: Слова «для их восстановления» могут относиться как к восстановлению этих городов, так и к восстановлению или возобновлению поселённых в них иудейских общин; греческая формулировка допускает оба оттенка.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠχύρωσεν
  choice: укрепил
  rationale: Глагол обозначает укрепление города или места в военно-оборонительном смысле; «укрепил» естественно и точно передаёт это значение.
- source_word: Ἰόππην
  choice: Иоппию
  rationale: Традиционная русская библейская передача греческого топонима Ἰόππη.
- source_word: τὴν ἐπὶ τῆς θαλάσσης
  choice: приморскую
  rationale: Кратко и естественно передаёт расположение города у моря, не меняя географического смысла.
- source_word: Γάζαραν
  choice: Газару
  rationale: Сохраняет эллинизированную форму топонима, непосредственно засвидетельствованную в греческом тексте; более привычная форма «Газер» отмечена в сноске.
- source_word: τὴν ἐπὶ τῶν ὁρίων Ἀζώτου
  choice: находившуюся у границ Азота
  rationale: ὅρια может обозначать границы или пограничную область; эта формулировка точно передаёт географическое положение и естественна по-русски.
- source_word: οἱ πολέμιοι
  choice: враги
  rationale: Прямой и контекстуально уместный эквивалент обозначения враждебных противников.
- source_word: κατῴκισεν
  choice: поселил
  rationale: 'Передаёт каузативный смысл: он сделал так, чтобы иудеи жили в этих местах.'
- source_word: Ἰουδαίους
  choice: иудеев
  rationale: В контексте 1 Маккавейской слово охватывает этническую, религиозную и политическую принадлежность; «иудеи» — традиционный и ясный русский эквивалент.
- source_word: ὅσα ἐπιτήδεια
  choice: всё необходимое
  rationale: Сохраняет широту выражения, которое может включать припасы, средства и иные необходимые вещи, не сужая его до продовольствия.
- source_word: πρὸς τὴν τούτων ἐπανόρθωσιν
  choice: для их восстановления
  rationale: ἐπανόρθωσις означает восстановление или приведение в надлежащее состояние; местоимение τούτων оставляет возможной отсылку как к местам, так и к поселённым там общинам.
- source_word: ἔθετο ἐν αὐτοῖς
  choice: разместил в этих городах
  rationale: Идиоматично передаёт буквальное «поместил в них»; множественное местоимение естественно соотносится с двумя названными городами.
theological_decisions:
- issue: Референт τούτων в выражении πρὸς τὴν τούτων ἐπανόρθωσιν
  choice: Сохранить местоименную формулировку «для их восстановления» и пояснить неоднозначность в сноске.
  alternative: Явно истолковать как «для восстановления этих городов» либо «для обустройства поселённых там иудеев».
  rationale: Греческая формулировка сжата и допускает отнесение восстановления к названным местам либо к возникшим в них иудейским общинам; перевод не должен без необходимости устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис разделён на два предложения для ясности. Топонимы переданы в традиционных библейских формах; подлинная неоднозначность заключительной фразы сохранена и пояснена сноской.
