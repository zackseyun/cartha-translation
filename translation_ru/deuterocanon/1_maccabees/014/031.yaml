  yaml_path: translation/deuterocanon/1_maccabees/014/031.yaml
  text: And their enemies planned to invade their land[a], to destroy their land and to stretch out their hands against their holy places.
translation:
  language: ru
  text: И враги их задумали вторгнуться в их землю, чтобы разорить их землю и простереть руки на их святыни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их святые места»; возможно также: «их священные предметы» или «их святилище». В греческом тексте стоит множественное число τὰ ἅγια.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλήθησαν
  choice: задумали
  rationale: Передаёт возникший у врагов замысел или намерение, не усиливая значение до окончательного решения.
- source_word: ἐμβατεῦσαι
  choice: вторгнуться
  rationale: В сочетании с указанием на чужую землю и в военном контексте глагол обозначает враждебное вступление, то есть вторжение.
- source_word: χώραν
  choice: землю
  rationale: Естественное соответствие для территории народа; повтор слова сохранён вслед за греческим текстом.
- source_word: τοῦ ἐκτρῖψαι
  choice: чтобы разорить
  rationale: Оборот выражает цель; «разорить землю» естественно передаёт её опустошение и уничтожение, не создавая неуместного представления об истреблении самой территории.
- source_word: ἐκτεῖναι τὰς χεῖρας ἐπὶ
  choice: простереть руки на
  rationale: Сохранён образ греческого оборота и его враждебная направленность, при этом конкретный вид посягательства не уточняется.
- source_word: τὰ ἅγια
  choice: их святыни
  rationale: Русское множественное число сохраняет форму оригинала и допускает значение священных мест либо священных предметов.
theological_decisions:
- issue: Значение τὰ ἅγια в культовом контексте
  choice: их святыни
  alternative: их святые места; их священные предметы; их святилище
  rationale: Греческая форма множественного числа семантически широка. «Святыни» сохраняет множественность и не сводит выражение без достаточных оснований только к одному святилищу или только к предметам культа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и повтор «их землю» сохранены; оборот «простереть руки» удерживает образность оригинала.
