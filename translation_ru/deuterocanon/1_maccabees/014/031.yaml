  source_fidelity: 'Текст точно передаёт греческий синтаксис и смысл: ἐβουλήθησαν — «задумали», военное ἐμβατεῦσαι — «вторгнуться», целевой инфинитив τοῦ ἐκτρῖψαι — «чтобы разорить». Повтор «их землю» обоснованно сохранён. «Простереть руки на» удерживает образ ἐκτεῖναι τὰς χεῖρας ἐπὶ и не конкретизирует характер враждебного посягательства. «Их святыни» адекватно передаёт множественное τὰ ἅγια, не сужая референт до здания либо предметов.'
