  yaml_path: translation/deuterocanon/1_maccabees/014/023.yaml
  text: And it pleased the people to receive the men with honor[a], and to place a copy of their words in the public records of the people, so that the people of the Spartans might have a memorial of them[b]; and they wrote a copy of these things to Simon the high priest.
translation:
  language: ru
  text: И народ постановил принять этих людей с почестями и поместить копию их слов в официальные книги народа[a], чтобы у народа спартанцев было памятное свидетельство; копию же этого они написали первосвященнику Симону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в книги, предназначенные для народа»; имеются в виду официальные городские архивы или реестры.'
    reason: cultural_note
lexical_decisions:
- source_word: ἤρεσεν τῷ δήμῳ
  choice: народ постановил
  rationale: В контексте официального гражданского решения русское «постановил» естественно передаёт формулу одобрения, выраженную безличной конструкцией с дательным падежом.
- source_word: ἐπιδέξασθαι τοὺς ἄνδρας ἐνδόξως
  choice: принять этих людей с почестями
  rationale: «Принять» сохраняет официальный характер благосклонного приёма; «с почестями» точно и естественно передаёт ἐνδόξως, не добавляя излишней эмоциональности.
- source_word: τὸ ἀντίγραφον τῶν λόγων αὐτῶν
  choice: копию их послания
  rationale: В дипломатическом контексте λόγοι обозначает переданное ими сообщение или содержание речи; «послание» по-русски яснее, чем буквальное «слова», при сохранении документального смысла.
- source_word: τοῦ δέσθαι
  choice: поместить
  rationale: В сочетании с копией и книгами глагол означает внесение или помещение документа в официальный архив.
- source_word: ἐν τοῖς ἀποδεδειγμένοις τῷ δήμῳ βιβλίοις
  choice: в официальные книги народа
  rationale: Причастие указывает на книги, специально назначенные для общественного пользования; формулировка сохраняет образ книг и передаёт их официальный архивный статус.
- source_word: τοῦ μνημόσυνον ἔχειν
  choice: чтобы ... сохранилась память об этом
  rationale: Артикулированный инфинитив выражает цель, а μνημόσυνον — память или памятное свидетельство; русская формулировка естественно сохраняет мемориальный оттенок.
- source_word: τὸν δῆμον τῶν Σπαρτιατῶν
  choice: у спартанского народа
  rationale: Передаёт гражданско-политический смысл δῆμος и генитив Σπαρτιατῶν естественным современным русским выражением.
- source_word: τὸ δὲ ἀντίγραφον τούτων ἔγραψαν
  choice: копию же этого они написали
  rationale: 'Сохраняет формальную неоднозначность: греческий текст прямо говорит о написании копии, не уточняя отдельным глаголом её отправку.'
- source_word: Σίμωνι τῷ ἀρχιερεῖ
  choice: первосвященнику Симону
  rationale: Дательный падеж передан как адресат составленной копии; титул и имя расположены в естественном для русского языка порядке.
