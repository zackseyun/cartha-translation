  text: He made peace upon the land, and Israel rejoiced with great joy.
translation:
  language: ru
  text: Он установил мир в стране[a], и Израиль возрадовался великой радостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на земле»; греч. «на земле (стране)».'
    reason: Слово γῆ может означать как страну или землю определённого народа, так и землю в более широком смысле; контекст указывает прежде всего на страну Израиля.
lexical_decisions:
- source_word: ἐποίησεν τὴν εἰρήνην
  choice: установил мир
  rationale: Сочетание ποιέω с εἰρήνην буквально означает «сделал мир», но по-русски естественно передаётся как «установил мир»; это выражает наступление общественного спокойствия без лишнего смыслового расширения.
- source_word: ἐπὶ τῆς γῆς
  choice: в стране
  rationale: В контексте 1 Маккавейской γῆ обозначает страну, то есть землю Израиля, а ἐπί с родительным допускает пространственное значение. «В стране» естественнее современному русскому, чем буквальное «на земле»; исходная конструкция отмечена в сноске.
- source_word: ηὐφράνθη
  choice: возрадовался
  rationale: Форма передаёт радостный отклик. «Возрадовался» сохраняет возвышенный повествовательный регистр и сочетается с последующим усилительным оборотом.
- source_word: Ἰσραήλ
  choice: Израиль
  rationale: Традиционная русская форма имени народа, выступающего здесь как собирательное целое.
- source_word: εὐφροσύνην μεγάλην
  choice: великой радостью
  rationale: Винительный падеж употреблён обстоятельственно и усиливает однокоренной глагол. Русское «возрадовался великой радостью» сохраняет намеренный этимологический повтор греческого текста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранён усилительный однокоренной оборот «возрадовался великой радостью», отражающий εὐφράνθη… εὐφροσύνην μεγάλην.
