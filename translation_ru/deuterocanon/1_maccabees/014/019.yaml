lexical_decisions:
- source_word: ἀνεγνώσθησαν
  choice: были прочитаны
  rationale: Аорист пассивного залога от ἀναγινώσκω; в контексте посланий означает их чтение вслух. Русское «были прочитаны» прямо передаёт форму и смысл, не добавляя отсутствующего в тексте наречия «публично».
- source_word: ἐνώπιον
  choice: перед
  rationale: Обозначает совершение действия в присутствии собравшихся; «перед» естественно и точно передаёт эту связь.
- source_word: ἐκκλησίας
  choice: собранием
  rationale: В данном иудейском общественно-религиозном контексте речь идёт о собравшемся сообществе, а не о христианской церкви; «собрание» избегает анахронизма.
- source_word: ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Прямое и естественное соответствие греческому обстоятельству места.
theological_decisions:
- issue: Значение ἐκκλησία в дохристианском контексте
  choice: собрание
  alternative: церковь; община
  rationale: «Собрание» сохраняет общественный и коллективный смысл слова, не привнося позднейшей христианской терминологии.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка с сохранением пассивной конструкции оригинала. Местоимение «они» согласуется с подразумеваемыми документами или посланиями из контекста.
