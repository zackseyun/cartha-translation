  text: 'И они внесли в постановления народного собрания[a] сказанное ими, а именно: «Нумений, сын Антиоха, и Антипатр, сын Иасона, послы иудеев[b], прибыли к нам, чтобы возобновить дружественные отношения с нами[c]».'
