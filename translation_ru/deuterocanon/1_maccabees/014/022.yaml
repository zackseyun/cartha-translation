- source_word: τὰ ὑπ’ αὐτῶν εἰρημένα
  choice: сказанное ими
  rationale: Кратко и точно передаёт содержание высказываний послов и пассивную форму греческого оборота.
- source_word: ἐν ταῖς βουλαῖς τοῦ δήμου
  choice: в постановлениях народа
  rationale: βουλαί допускает значения «решения», «постановления» и «совещания»; в официально-дипломатическом контексте речь, вероятнее всего, идёт о документах, содержащих решения гражданского собрания. Перевод не сводит выражение просто к устным обсуждениям.
- source_word: οὕτως
  choice: такую запись
  rationale: По функции слово вводит точное содержание официальной записи; по-русски эта связь естественнее передаётся данным оборотом.
- source_word: πρεσβευταί
  choice: послы
  rationale: Обозначает официальных представителей, направленных с дипломатическим поручением.
- source_word: Α Ἰουδαίων
  choice: иудеев
  rationale: Изолированная альфа в переданном греческом тексте не образует ясного осмысленного чтения; перевод следует прозрачному синтаксису «послы иудеев», отмечая проблему в сноске.
- source_word: ἀνανεούμενοι
  choice: чтобы возобновить
  rationale: Причастие выражает цель прибытия — обновить ранее существовавшие дипломатические отношения; целевой оборот звучит естественно по-русски.
- source_word: τὴν πρὸς ἡμᾶς φιλίαν
  choice: дружественные отношения с нами
  rationale: φιλία здесь имеет дипломатический оттенок и обозначает официальные отношения дружбы, возможно с союзным содержанием; перевод сохраняет этот оттенок, не усиливая его до однозначного «союза».
