  text: And in Rome[a], and even as far as Sparta, they heard that Jonathan had died, and they were deeply grieved.
translation:
  language: ru
  text: И в Риме[a], и вплоть до Спарты услышали, что Ионафан умер, и глубоко опечалились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте глагол «услышал» стоит в единственном числе, тогда как далее сказано во множественном числе: «опечалились». Перевод передаёт подразумеваемый коллективный смысл: в Риме и вплоть до Спарты люди услышали эту весть.'
    reason: textual_variant
lexical_decisions:
- source_word: ἤκουσεν
  choice: услышали
  rationale: В переданном греческом тексте стоит форма единственного числа, однако последующий глагол ἐλυπήθησαν имеет множественное число, а по смыслу подразумеваются жители названных мест. Русская неопределённо-личная форма «услышали» естественно передаёт этот коллективный смысл; несогласованность исходного текста отмечена в сноске.
- source_word: ἐν Ῥώμῃ
  choice: в Риме
  rationale: Прямое обозначение места посредством ἐν с названием города.
- source_word: καὶ ἕως Σπάρτης
  choice: и вплоть до Спарты
  rationale: ἕως с родительным падежом обозначает предел распространения вести. «Вплоть до Спарты» сохраняет географический размах выражения и звучит естественно по-русски.
- source_word: ἀπέθανεν
  choice: умер
  rationale: В русском придаточном после глагола восприятия простое прошедшее время естественно обозначает смерть, предшествовавшую получению вести; специальная форма предпрошедшего времени не требуется.
- source_word: ἐλυπήθησαν σφόδρα
  choice: глубоко опечалились
  rationale: Сочетание передаёт сильную скорбь; «глубоко опечалились» сохраняет интенсивность и соответствует современному литературному регистру.
