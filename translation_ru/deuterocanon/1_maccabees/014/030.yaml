  to: Ионафан собрал их народ, стал их первосвященником и присоединился к своему народу[a].
  rationale: Убрано не обусловленное греческим текстом усиление «воедино», более естественно передан дательный αὐτοῖς, а заключительный библейский оборот сформулирован понятно для современного читателя. Сноска сохраняет пассивный образ греческого текста и объясняет его идиоматическое значение, не навязывая дополнительных представлений о посмертном состоянии.
