  text: And Jonathan gathered their nation[a], and became their high priest, and was added to his people.
translation:
  language: ru
  text: Ионафан собрал их народ, стал их первосвященником и присоединился к своему народу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «был присоединён к своему народу». Это библейский оборот, обозначающий смерть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθροισεν
  choice: собрал воедино
  rationale: Аорист ἀθροίζω означает «собирать, объединять». Сочетание «собрал воедино» естественно по-русски и передаёт не просто созыв, но сплочение народа.
- source_word: τὸ ἔθνος αὐτῶν
  choice: их народ
  rationale: ἔθνος здесь обозначает коллективное национальное сообщество. «Народ» в современном русском звучит естественнее, чем «нация», и сохраняет общественно-политический смысл; местоимение αὐτῶν передано как «их».
- source_word: ἐγενήθη αὐτοῖς ἀρχιερεύς
  choice: стал у них первосвященником
  rationale: ἐγενήθη с именной частью сказуемого естественно передаётся глаголом «стал»; дательный αὐτοῖς сохранён оборотом «у них», а ἀρχιερεύς — общепринятым словом «первосвященник».
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: был причислен к своему народу
  rationale: Перевод сохраняет образ греческого пассивного выражения и одновременно узнаваемый библейский оборот, обозначающий смерть и присоединение к предкам.
- source_word: λαός
  choice: народ
  rationale: λαός обычно обозначает народ как единое сообщество; «народ» — точный, ясный и стилистически достойный русский эквивалент.
theological_decisions:
- issue: Идиоматическое обозначение смерти в προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: был причислен к своему народу
  alternative: отошёл к своему народу
  rationale: Основной текст близко сохраняет греческий образ присоединения, не сводя его лишь к нейтральному сообщению «умер». В сноске поясняется идиоматический смысл и даётся более привычный библейский вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксический параллелизм трёх греческих частей сохранён; архаизмы и конфессионально окрашенные уточнения не добавлены.
