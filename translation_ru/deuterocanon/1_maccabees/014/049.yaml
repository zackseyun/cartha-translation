lexical_decisions:
- source_word: ἀντίγραφα
  choice: списки
  rationale: В документальном контексте слово обозначает копии или воспроизведения документов; «списки» естественно передаёт это значение в русском литературном и историческом стиле.
- source_word: θέσθαι
  choice: следовало положить
  rationale: Инфинитив продолжает содержание ранее изложенного постановления; эта формулировка передаёт предписывающую силу и сохраняет связь с контекстом.
- source_word: γαζοφυλακίῳ
  choice: сокровищницу
  rationale: Слово обозначает сокровищницу или помещение для хранения ценностей; здесь оно также служит местом хранения официальных документов.
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое значение греческого союза.
- source_word: ἔχῃ
  choice: они были у
  rationale: Так естественно по-русски выражается подразумеваемое обладание документами Симоном и его сыновьями без тяжеловесного повторения объекта.
