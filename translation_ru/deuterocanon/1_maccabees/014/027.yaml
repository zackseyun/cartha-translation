lexical_decisions:
- source_word: ἀντίγραφον τῆς γραφῆς
  choice: копия документа
  rationale: ἀντίγραφον означает копию или дубликат, а γραφή в данном официально-историческом контексте — письменный документ, а не Писание.
- source_word: Ὀκτωκαιδεκάτῃ Ἐλούλ
  choice: в восемнадцатый день месяца элул
  rationale: Форма порядкового числительного датирует документ; добавление «день месяца» естественно и ясно передаёт смысл греческой формулы.
- source_word: ἔτους δευτέρου ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: в сто семьдесят втором году
  rationale: Точно передаёт датировку по эре и соответствует современной русской норме.
- source_word: τοῦτο τρίτον ἔτος
  choice: который был третьим годом
  rationale: Относительное предложение естественно связывает общую датировку с исчислением времени служения Симона.
- source_word: ἐπὶ Σίμωνος τοῦ ἀρχιερέως
  choice: первосвященства Симона
  rationale: В формуле датировки ἐπί с родительным указывает на время пребывания лица в должности; такое выражение здесь яснее буквального «при Симоне-первосвященнике».
theological_decisions:
- issue: Значение γραφή в данном контексте
  choice: документ
  alternative: письменный текст; запись
  rationale: Контекст официальной надписи указывает на административно-правовой документ; перевод «Писание» создал бы отсутствующий в оригинале богословский оттенок.
- issue: Характер третьего года при Симоне
  choice: третий год первосвященства Симона
  alternative: третий год при первосвященнике Симоне
  rationale: ἐπί с родительным допускает более общее «при Симоне»; контекст и приложение «первосвященник» позволяют выразить датировку по сроку его служения, не приписывая ему царского правления.
translation_notes:
  register: Современный литературный русский язык с официально-документальным оттенком. Многоточие сохраняет незавершённость фразы, которая продолжается в следующем стихе.
