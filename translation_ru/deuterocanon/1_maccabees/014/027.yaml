  source_fidelity: '«Копия документа» точно передаёт ἀντίγραφον τῆς γραφῆς в данном официальном контексте. Однако «который был третьим годом первосвященства Симона» чрезмерно конкретизирует синтаксис: τοῦτο τρίτον ἔτος ἐπὶ Σίμωνος τοῦ ἀρχιερέως — самостоятельная датировочная формула «в третьем году при Симоне, первосвященнике».'
