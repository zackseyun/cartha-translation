  text: 'And this is the copy of the writing: On the eighteenth of Elul[a], in the one hundred seventy-second year, and this was the third year under Simon the high priest,'
translation:
  language: ru
  text: 'И вот копия документа: в восемнадцатый день месяца элул[a], в сто семьдесят втором году, в третьем году при Симоне, первосвященнике,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Элул — месяц еврейского календаря, соответствующий примерно августу—сентябрю.
