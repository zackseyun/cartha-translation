  text: But if anyone does anything contrary to these things[a], or sets aside any of them, he shall be liable.
translation:
  language: ru
  text: Но если кто-нибудь поступит вопреки этим постановлениям или отменит какое-либо из них, тот подлежит ответственности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот будет виновен». Греческое выражение может обозначать как юридическую ответственность, так и виновность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα ποιήσῃ
  choice: поступит вопреки этим постановлениям
  rationale: Оборот παρά с винительным при ποιέω выражает действие в нарушение ранее изложенных положений. «Постановлениям» естественно передаёт юридический контекст, хотя буквально стоит «этому».
- source_word: ἀθετήσῃ
  choice: отменит
  rationale: В контексте официального постановления глагол означает лишить силы, отменить или отвергнуть; «отменит» сохраняет юридическую направленность и понятно современному читателю.
- source_word: τι τούτων
  choice: какое-либо из них
  rationale: Частичное выражение указывает на любой отдельный пункт из ранее перечисленных постановлений.
- source_word: ἔνοχος ἔσται
  choice: тот подлежит ответственности
  rationale: ἔνοχος в юридическом контексте обозначает виновность или подлежание взысканию. Формулировка сохраняет правовую неопределённость относительно конкретной санкции.
