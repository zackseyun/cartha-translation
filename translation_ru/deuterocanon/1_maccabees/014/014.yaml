  yaml_path: translation/deuterocanon/1_maccabees/014/014.yaml
  text: And he strengthened all the humble of his people[a]; he sought out the law[b], and removed every lawless and evil thing.
translation:
  language: ru
  text: И он укрепил всех смиренных в своём народе[a]; он ревностно искал закона[b] и устранил всё беззаконное и злое.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех униженных в своём народе», «всех людей низкого положения в своём народе». Греческое слово может указывать как на смиренных по характеру, так и на людей низкого общественного положения.'
    reason: lexical_alternative
  - marker: b
    text: Под «законом», вероятнее всего, подразумевается древний закон иудейского народа, то есть Тора.
    reason: cultural_note
lexical_decisions:
- source_word: ἐστήρισεν
  choice: укрепил
  rationale: Передаёт основное значение «сделал твёрдым, поддержал, укрепил» и естественно звучит в контексте правления Симона.
- source_word: πάντας τοὺς ταπεινοὺς τοῦ λαοῦ αὐτοῦ
  choice: всех смиренных в своём народе
  rationale: «Смиренных» сохраняет нравственный и социальный оттенки ταπεινός; конструкция «в своём народе» естественно выражает принадлежность, не исключая значения людей низкого положения.
- source_word: τὸν νόμον ἐξεζήτησεν
  choice: ревностно искал закона
  rationale: ἐξεζήτησεν обозначает настойчивое, усердное искание. Родительный падеж после «искал» нормативен и сохраняет прямую связь с греческим νόμος.
- source_word: ἐξῆρεν
  choice: устранил
  rationale: Широкий глагол позволяет отнести действие как к людям, так и к поступкам или явлениям, не уточняя того, чего не уточняет греческий текст.
- source_word: πάντα ἄνομον καὶ πονηρόν
  choice: всё беззаконное и злое
  rationale: Субстантивированные прилагательные среднего рода переданы столь же обобщённо; «беззаконное» сохраняет словесную связь с предшествующим «законом».
theological_decisions:
- issue: Обозначает ли νόμος конкретно Тору
  choice: закон
  alternative: Закон; Тора
  rationale: Контекст, вероятнее всего, указывает на иудейский наследственный Закон, однако греческое написание само по себе не выражает капитализации. Строчная буква сохраняет формальную неоднозначность, а примечание поясняет культурный смысл.
- issue: Имеет ли ταπεινούς преимущественно социальное или нравственное значение
  choice: смиренных
  alternative: униженных; людей низкого положения
  rationale: Греческое слово допускает и смирение как качество, и низкое общественное положение. Основной текст сохраняет традиционно понятное широкое обозначение, а примечание явно отмечает второй оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксический параллелизм греческого текста сохранён; архаизмы и конфессионально маркированные уточнения не вводятся.
