    reason: alternative_reading
lexical_decisions:
- source_word: στρατηγόν
  choice: военачальником
  rationale: Передаёт военно-руководящее значение στρατηγός, не приписывая Симону конкретного современного воинского звания.
- source_word: μέλῃ
  choice: заботился
  rationale: Естественно передаёт значение попечения и ответственности, выраженное μέλω.
- source_word: τῶν Α ἅγιον
  choice: о святыне
  rationale: Контекст указывает на священное место или храмовую святыню, однако повреждённая либо затруднительная греческая форма не позволяет считать референт совершенно бесспорным; неоднозначность отмечена в сноске.
- source_word: καθιστάναι
  choice: назначал ответственных
  rationale: В административном контексте означает ставить или назначать людей для ведения перечисленных областей; слово «ответственных» естественно восполняет подразумеваемых лиц.
- source_word: τῶν ἔργων αὐτῶν
  choice: за их работы
  rationale: Сохраняет прямое значение ἔργα и притяжательное αὐτῶν, не сужая смысл до одной конкретной разновидности работ.
- source_word: χώρας
  choice: за страну
  rationale: χώρα обозначает землю, страну или территорию; «страна» соответствует широкому административному контексту.
- source_word: ὅπλων
  choice: оружие
  rationale: Ясный современный эквивалент для военного значения ὅπλα.
- source_word: ὀχυρωμάτων
  choice: крепости
  rationale: Передаёт укреплённые места без избыточно описательного оборота.
theological_decisions:
- issue: Референт затруднительного выражения τῶν Α ἅγιον
  choice: В основном тексте — «святыне»
  alternative: «священных предметах» или «святом месте»
  rationale: «Святыня» естественно подходит к храмовому контексту и сохраняет некоторую широту значения; сноска не скрывает текстуально-лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством официального постановления. Синтаксис сохраняет продолжение ряда зависимых оборотов предыдущего контекста; повтор «за» делает административное перечисление ясным.
