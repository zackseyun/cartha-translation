  yaml_path: translation/deuterocanon/1_maccabees/014/012.yaml
  text: And each sat under his own vine and his own fig tree[a], and there was no one to frighten them.
translation:
  language: ru
  text: И каждый сидел под своей виноградной лозой и своей смоковницей[a], и некому было устрашать их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эти слова перекликаются с библейским образом мира и безопасности; ср. 3 Царств 4:25 и Михея 4:4.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκάθισεν
  choice: сидел
  rationale: Аорист сохраняет конкретный образ спокойного пребывания; «сидел» естественно передаёт библейскую картину мирной и безопасной жизни.
- source_word: ἕκαστος
  choice: каждый
  rationale: Передаёт распределительное значение без добавления отсутствующего в греческом тексте указания на пол.
- source_word: ὑπὸ
  choice: под
  rationale: Сохраняет пространственное значение и устойчивый библейский образ пребывания под лозой и смоковницей.
- source_word: ἄμπελον
  choice: виноградной лозой
  rationale: Точно и понятно передаёт название растения, сохраняя традиционный библейский образ.
- source_word: συκῆν
  choice: смоковницей
  rationale: «Смоковница» — точное и литературно уместное русское название фигового дерева в библейском контексте.
- source_word: οὐκ ἦν ὁ ἐκφοβῶν
  choice: некому было устрашать
  rationale: Субстантивированное причастие обозначает отсутствие того, кто наводил бы страх; эта конструкция кратка и сохраняет причинительное значение глагола.
- source_word: αὐτούς
  choice: их
  rationale: Прямо передаёт местоимение, относящееся к людям, наслаждавшимся безопасностью.
theological_decisions:
- issue: 'Межтекстовая формула мира: «под своей виноградной лозой и своей смоковницей»'
  choice: Сохранить буквальный земледельческий образ в основном тексте.
  alternative: Передать обобщённо как мирную, благополучную и безопасную жизнь.
  rationale: Буквальный образ сохраняет узнаваемую библейскую формулу мира и безопасности и не сводит её смысл к одному пояснительному пересказу.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и библейской образности. «Смоковница» выбрана как точный и узнаваемый библейский термин; синтаксис сделан естественным, без конфессиональных уточнений.
