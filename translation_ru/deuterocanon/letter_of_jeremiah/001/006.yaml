translation:
  language: ru
  text: Ибо мой ангел с вами, и он сам заботится о вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разыскивает (или: ищет) ваши души». Греческое ψυχαί может означать «души», «жизни» или самих людей; в данном контексте основной текст передаёт смысл попечения.'
    reason: Сохраняет буквальное значение ἐκζητῶν и лексическую неоднозначность ψυχαί, не делая неестественной основную русскую фразу.
lexical_decisions:
- source_word: ἄγγελός
  choice: ангел
  rationale: В данном контексте Божье первое лицо («Мой») и присутствие рядом с адресатами указывают прежде всего на небесного посланника; «ангел» сохраняет наиболее вероятный смысл, не уточняя его природу сверх текста.
- source_word: μεθʼ ὑμῶν
  choice: с вами
  rationale: μετά с родительным падежом прямо выражает совместное присутствие; «с вами» естественно и точно передаёт эту конструкцию.
- source_word: ἐκζητῶν
  choice: заботится о
  rationale: Глагол буквально обозначает усиленное искание или разыскивание, однако с объектом «ваши жизни/души» здесь выражает деятельную личную заботу. Буквальное «ищет ваши жизни» по-русски звучало бы неясно и могло бы создать ошибочное впечатление угрозы; смысловая образность отмечена в сноске.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: о ваших жизнях
  rationale: ψυχή может обозначать душу, жизнь или самого человека. В контексте присутствия и попечения Божьего ангела «жизни» естественно передаёт заботу о людях как о целостных личностях и не навязывает разделения души и тела; вариант «душах» сохранён в сноске.
- source_word: αὐτὸς
  choice: он сам
  rationale: Самостоятельное αὐτός имеет усилительное значение; «он сам» сохраняет акцент на личном действии ангела.
theological_decisions:
- issue: Значение ψυχή в контексте ангельского попечения
  choice: ваших жизнях
  alternative: ваших душах
  rationale: «Жизни» соответствует одному из обычных значений ψυχή и передаёт заботу о сохранности самих людей, не внося позднейшего противопоставления души и тела. Лексически допустимое и традиционное «душах» приведено в сноске, чтобы сохранить смысловую широту исходного слова.
- issue: Характер действия ἐκζητῶν
  choice: заботится о
  alternative: разыскивает / ищет
  rationale: Контекст допускает понимание усиленного искания как деятельного попечения, но не объясняет его механизм. Перевод передаёт вероятную функцию действия, а сноска сохраняет буквальный образ и не устраняет исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Начальное «ведь» передаёт пояснительное γάρ. Прописная буква в «Мой» отражает речь Бога как говорящего, не добавляя отдельного титула. Формально неестественное «ищет ваши жизни» заменено контекстуально понятным «заботится о ваших жизнях», при этом буквальная конструкция сохранена в сноске.
