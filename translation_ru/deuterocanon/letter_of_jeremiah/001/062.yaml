  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/062.yaml
  text: And the fire sent from above[a], to consume mountains and forests, does what it was appointed to do[b]; but these are not comparable to it either in appearance or in power.
translation:
  language: ru
  text: И огонь, посланный свыше, чтобы пожирать горы и леса, исполняет предписанное ему[a]; а эти не подобны ему ни по виду, ни по силе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполняет то, что было назначено (или велено)». Греческое выражение может означать установленное, предписанное или приказанное.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не уподоблены ему» — ни по виду, ни по силе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῦρ
  choice: огонь
  rationale: Прямое соответствие; природная разрушительная сила огня противопоставлена бессилию идолов.
- source_word: ἐξαποσταλὲν ἄνωθεν
  choice: посланный свыше
  rationale: Сохраняет указание на происхождение сверху, не конкретизируя его словами «с небес» или «от Бога», которых в греческом тексте нет.
- source_word: ἐξαναλῶσαι
  choice: чтобы пожирать
  rationale: Передаёт целевое значение инфинитива и полное уничтожение огнём; по-русски естественно сочетается с горами и лесами.
- source_word: ὄρη καὶ δρυμούς
  choice: горы и леса
  rationale: Точно и естественно передаёт образы гор и лесистых пространств.
- source_word: ποιεῖ τὸ συνταχθέν
  choice: исполняет предписанное ему
  rationale: τὸ συνταχθέν обозначает назначенное, установленное или веленное; формулировка сохраняет целенаправленность действия и не сужает значение до явного приказа.
- source_word: ταῦτα
  choice: эти
  rationale: Сохраняет краткость указательного местоимения; из контекста ясно, что речь идёт об идолах.
- source_word: οὔτε ταῖς ἰδέαις οὔτε ταῖς δυνάμεσιν
  choice: ни по виду, ни по силе
  rationale: «Вид» передаёт внешнюю форму, а «сила» — действенную мощь; парная конструкция естественна в современном русском языке.
- source_word: ἀφωμοιωμένα
  choice: не подобны ему
  rationale: Естественно выражает отсутствие сходства или сопоставимости, не устраняя оба названных аспекта — вид и силу.
theological_decisions:
- issue: Источник огня, посланного «свыше»
  choice: Сохранено «свыше» без явного добавления «с небес» или «от Бога».
  alternative: «посланный с небес» / «посланный Богом»
  rationale: ἄνωθεν допускает небесный или божественный источник в контексте, но прямо его не называет; перевод сохраняет эту подразумеваемость без усиления.
- issue: Отнесение указательного местоимения ταῦτα
  choice: В основном тексте оставлено «эти».
  alternative: «эти идолы»
  rationale: Референтом являются идолы из контекста, однако существительное в данном предложении отсутствует; краткая форма сохраняет структуру оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет противопоставление природного огня и идолов; формулировки понятны без конфессионально окрашенных уточнений.
