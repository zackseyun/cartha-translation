base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/014.yaml
  text: In his right hand he holds a dagger and an axe[a], but he cannot rescue himself from war and robbers. Therefore it is evident that they are not gods[b]; so do not fear them.
translation:
  language: ru
  text: В правой руке он держит кинжал[a] и топор, но сам себя не спасёт ни от войны, ни от разбойников[b]. Отсюда ясно, что они не боги; итак, не бойтесь их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «короткий меч». Греческое ἐγχειρίδιον обозначает ручное оружие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «грабителей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγχειρίδιον
  choice: кинжал
  rationale: Слово обозначает ручное оружие, обычно кинжал или короткий меч. «Кинжал» естественно звучит по-русски и хорошо сочетается с упомянутым далее топором.
- source_word: δεξιᾷ
  choice: в правой руке
  rationale: Дательный падеж при ἔχει имеет локативный смысл; по-русски естественно сказать «держит в правой руке».
- source_word: πέλεκυν
  choice: топор
  rationale: Это обычное и достаточно широкое соответствие греческому слову; более узкое «секира» придало бы тексту ненужную архаичность.
- source_word: ἐξελεῖται
  choice: не спасёт
  rationale: Будущая форма среднего залога вместе с ἑαυτόν выражает неспособность идола избавить самого себя. Русское «сам себя не спасёт» сохраняет форму утверждения и ясно передаёт смысл.
- source_word: λῃστῶν
  choice: разбойников
  rationale: Слово обозначает грабителей или действующих с насилием разбойников; в контексте угрозы наряду с войной «разбойники» наиболее уместны.
- source_word: ὅθεν
  choice: отсюда
  rationale: Слово вводит вывод из неспособности идола защитить себя. «Отсюда ясно» естественно передаёт ход рассуждения.
- source_word: γνῶριμοί εἰσιν οὐκ ὄντες θεοί
  choice: ясно, что они не боги
  rationale: Буквальная конструкция «они узнаваемы как не являющиеся богами» по-русски неестественна. Выбранная формулировка сохраняет очевидность вывода, не добавляя богословского толкования.
- source_word: μὴ οὖν φοβηθῆτε αὐτούς
  choice: итак, не бойтесь их
  rationale: «Итак» передаёт логическую связь οὖν, а «не бойтесь их» сохраняет прямую запретительно-увещевательную силу аористного конъюнктива.
theological_decisions:
- issue: Переход от единственного числа в описании идола к множественному числу в выводе
  choice: Сохранить единственное число в первых двух частях («он держит», «сам себя не спасёт») и множественное в заключении («они не боги», «не бойтесь их»).
  alternative: Согласовать всё предложение во множественном числе.
  rationale: Греческий текст сначала описывает одного представительного идола, а затем распространяет вывод на всех подобных идолов. Сохранение перехода передаёт риторическую структуру источника.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным библейским звучанием. Избегаются архаизмы вроде «десница» и «секира». Союзная и числовая структура сохраняет контраст и переход от отдельного идола ко всему классу идолов.
