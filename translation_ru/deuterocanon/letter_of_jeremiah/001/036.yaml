  text: They certainly cannot set a blind man upright for seeing[a], nor can they rescue a man when he is in distress.
translation:
  language: ru
  text: Они никак не могут дать зрение слепому[a] и не могут вызволить человека, оказавшегося в беде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «поставить слепого так, чтобы он видел». Греческое выражение сжато; оно может обозначать как наделение слепого способностью видеть, так и приведение его в состояние, в котором он способен видеть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπον
  choice: человека / слепому
  rationale: Дважды употреблённое существительное обозначает отдельного человека как представителя людей вообще. В первом обороте естественный русский синтаксис позволяет передать сочетание ἄνθρωπον τυφλόν субстантивированным прилагательным «слепому».
- source_word: τυφλὸν
  choice: слепому
  rationale: Обычное обозначение физически слепого человека; дательный падеж обусловлен естественной русской конструкцией «вернуть кому-либо зрение».
- source_word: εἰς ὅρασιν
  choice: зрение
  rationale: Выражение буквально указывает на видение или способность видеть; в сочетании с глаголом оно естественно передаётся как результат — обретение зрения.
- source_word: οὐ μὴ
  choice: никак не могут / не могут
  rationale: Эмфатическое отрицание решительно исключает способность идолов помочь. В первой части «никак» явно передаёт усиление; во второй параллельное отрицание сохраняет тот же общий категорический смысл без тяжеловесного повтора.
- source_word: περιστήσωσιν
  choice: вернуть
  rationale: В данном компактном обороте глагол, вероятно, означает привести человека в состояние видения, то есть восстановить ему зрение. Поскольку буквальная конструкция допускает иной оттенок, он отмечен в сноске.
- source_word: ἐν ἀνάγκῃ ὄντα
  choice: попавшего в беду
  rationale: ἀνάγκη здесь обозначает тяжёлое, стеснённое положение, а причастие ὄντα описывает состояние человека. Русский причастный оборот ясно и естественно выражает эту связь.
- source_word: ἐξέλωνται
  choice: избавить
  rationale: Средняя форма ἐξαιρέω означает вызволить или спасти из опасности либо бедственного положения. «Избавить» сохраняет связь с подразумеваемым освобождением от беды.
theological_decisions:
- issue: Категоричность неспособности идолов
  choice: «никак не могут» в первой части и параллельное «не могут» во второй
  alternative: «ни в коем случае не смогут» в обеих частях
  rationale: Форма οὐ μή выражает решительное отрицание. Современная русская формулировка сохраняет полную неспособность идолов, но не вводит дополнительного временного оттенка будущего.
- issue: Характер помощи слепому
  choice: вернуть слепому зрение
  alternative: поставить слепого для видения
  rationale: Контекст противопоставляет беспомощность идолов реальной способности помочь. При этом необычная и сжатая греческая конструкция не должна становиться основанием для уточнения способа исцеления; возможное более буквальное понимание вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с ясным, категоричным параллелизмом. Формулировка доступна широкому читателю, избегает архаизмов и сохраняет смысловую неоднозначность первой части посредством сноски.
