  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/007.yaml
  text: For their tongue has been scraped by a craftsman[a], and they are overlaid with gold and silver[b], but they are false and cannot speak.
translation:
  language: ru
  text: Ибо язык у них выскоблен мастером[a]; сами же они покрыты золотом и серебром, но они ложны[b] и не могут говорить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вырезан»; «отполирован мастером». Греческий глагол указывает на соскабливание или заглаживание при ремесленной обработке идола.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они — ложь». Греческое слово может характеризовать идолов как нечто ложное или как воплощение лжи.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γλῶσσα
  choice: язык
  rationale: Передаёт прямое телесное значение греческого слова; контекст подчёркивает неспособность идолов говорить.
- source_word: κατεξυσμένη
  choice: выскоблен
  rationale: Сохраняет конкретный образ обработки поверхности соскабливанием или заглаживанием, не сводя значение только к резьбе.
- source_word: ὑπὸ τέκτονος
  choice: мастером
  rationale: τέκτων обозначает ремесленника или изготовителя; материал здесь прямо не уточнён, поэтому узкое «плотником» неоправданно.
- source_word: περίχρυσα καὶ περιάργυρα
  choice: покрыты золотом и серебром
  rationale: Естественно передаёт параллельные прилагательные со значением наружного покрытия обоими драгоценными металлами.
- source_word: ψευδῆ
  choice: ложны
  rationale: Сохраняет предикативную характеристику идолов как ложных, не уточняя сверх текста, являются ли они «ложью» или «обманом».
- source_word: οὐ δύνανται λαλεῖν
  choice: не могут говорить
  rationale: Прямой и естественный перевод конструкции способности с инфинитивом.
theological_decisions:
- issue: Характеристика идолов словом ψευδῆ
  choice: они ложны
  alternative: они — ложь
  rationale: Форма допускает понимание идолов как ложных вещей или как воплощения лжи. Основной текст сохраняет прилагательную характеристику и не усиливает онтологическое толкование; вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к греческому, но остаётся естественным; конкретная ремесленная образность сохранена.
