  text: But when the clouds are commanded by God to move over the whole inhabited world[a], they accomplish what was appointed.
translation:
  language: ru
  text: Когда же Бог повелевает облакам пройти над всем обитаемым миром, они исполняют то, что назначено.[a]
  philosophy: optimal-equivalence
  footnotes:
