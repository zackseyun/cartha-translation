  text: Без ног их носят на плечах, показывая людям собственное бесчестие; и те, кто служит им, стыдятся,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνευ ποδῶν
  choice: не имея ног
  rationale: Естественно передаёт буквальное «без ног» и подчёркивает неспособность идолов передвигаться самостоятельно.
- source_word: ἐπʼ ὤμοις φέρονται
  choice: носятся на плечах
  rationale: Страдательная форма сохраняет мысль о том, что идолов вынуждены переносить другие; настоящее время соответствует греческому тексту.
- source_word: ἐνδεικνύμενοι τὴν ἑαυτῶν ἀτιμίαν
  choice: показывая ... собственное бесчестие
  rationale: Сохраняет значение явного обнаружения их униженного, недостойного положения без богословского расширения.
- source_word: τοῖς ἀνθρώποις
  choice: людям
  rationale: Современный нейтральный эквивалент, относящийся к людям вообще.
- source_word: οἱ θεραπεύοντες αὐτά
  choice: те, кто служит им
  rationale: В контексте идолов θεραπεύω означает служение или почитание; «служит» сохраняет религиозный оттенок и не сужает смысл до физического ухода.
- source_word: αἰσχύνονται
  choice: стыдятся
  rationale: Средняя форма естественно передаётся как «стыдятся»; это сохраняет возможную смысловую связь со следующим контекстом, не превращая её без необходимости в пассивное «посрамлены».
theological_decisions:
- issue: Характер служения идолам в θεραπεύοντες
  choice: служит им
  alternative: поклоняется им / ухаживает за ними
  rationale: «Служит» достаточно широко передаёт культовое служение, не добавляя более узкого действия поклонения и не сводя выражение к уходу за предметами.
- issue: Значение αἰσχύνονται
  choice: стыдятся
  alternative: оказываются посрамлены
  rationale: Грамматически и контекстуально возможно состояние стыда; выбран возвратный глагол, сохраняющий прямую форму греческого выражения и не навязывающий внешнее посрамление.
translation_notes:
  register: Современный литературный русский язык с сохранением обличительного и достоинственного тона. Структура греческой фразы и повторная беспомощность идолов переданы ясно; запятая в конце сохранена как признак продолжения предложения в следующем стихе.
