  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/047.yaml
  text: How then can the things made by them endure? For they have left behind lies and disgrace for those who come after[a][b].
translation:
  language: ru
  text: Как же тогда устоит то, что они изготовили?[a] Ведь тем, кто придёт после, они оставили ложь и позор.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что же тогда будет с тем, что они изготовили?» Греческое выражение может ставить общий вопрос о будущей участи этих рукотворных предметов.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «оставили последующим поколениям ложь и бесчестье».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς τε δὴ
  choice: Как же тогда
  rationale: Передаёт риторический вопрос, а также усилительный и выводный оттенок сочетания частиц, не перегружая русскую фразу.
- source_word: μέλλει
  choice: устоит
  rationale: В риторическом контексте глагол выражает вопрос о будущей участи и способности созданного сохраниться; «устоит» естественно передаёт эту перспективу, не превращая её в буквальное «намеревается».
- source_word: τὰ ὑπʼ αὐτῶν κατασκευασθέντα
  choice: то, что они изготовили
  rationale: Субстантивированное причастие обозначает созданные или сооружённые ими предметы. Единственное собирательное «то» естественно по-русски и не добавляет прямо слово «идолы», хотя контекст указывает на них.
- source_word: κατέλιπον
  choice: оставили
  rationale: Глагол указывает на оставленное в наследие последующим людям; в сочетании с адресатом «тем, кто придёт после» простой глагол «оставили» ясно сохраняет этот смысл.
- source_word: ψεύδη
  choice: ложь
  rationale: Русское собирательное существительное естественно передаёт множественное ψεύδη и сохраняет полемическое обозначение обмана и ложности идолов.
- source_word: ὄνειδος
  choice: позор
  rationale: Передаёт публичный стыд, бесчестье и укор, заключённые в греческом слове.
- source_word: τοῖς ἐπιγινομένοις
  choice: тем, кто придёт после
  rationale: Сохраняет открытое обозначение последующих людей или поколений без сужения смысла до непосредственных потомков.
theological_decisions:
- issue: К чему относится выражение о сделанном людьми
  choice: В основном тексте сохранено общее «то, что они изготовили»; по контексту речь идёт об идолах или культовых изображениях.
  alternative: Прямо назвать эти предметы «идолами».
  rationale: Вся ближайшая речь направлена против идолов, однако само данное выражение остаётся общим. Перевод не подменяет контекстуальный вывод явным словом, отсутствующим в стихе.
- issue: Значение риторического вопроса с μέλλει
  choice: Вопрос передан как сомнение в том, что рукотворное устоит.
  alternative: «Что же тогда будет с тем, что они изготовили?»
  rationale: Греческая конструкция допускает более общее указание на будущую участь, тогда как контекст подчёркивает недолговечность рукотворных объектов. Сноска сохраняет более буквальную и открытую альтернативу.
translation_notes:
  register: Современный литературный русский язык с краткой, достоинственной риторической формой. «Устоит» звучит естественно и передаёт подразумеваемую недолговечность, а сноска сохраняет неоднозначность греческой конструкции. Все сноски отмечены в основном тексте.
