lexical_decisions:
- source_word: ὡσαύτως
  choice: Подобно этому
  rationale: Передаёт сравнительную связь с предшествующими примерами и естественно вводит очередную аналогию.
- source_word: ἀστραπή
  choice: молния
  rationale: Обычное и точное русское обозначение молнии как природного явления.
- source_word: ὅταν ἐπιφάνῃ
  choice: когда появляется
  rationale: Близко передаёт значение ἐπιφαίνω — «появляться, становиться видимым», не заменяя его более интерпретирующим «сверкает».
- source_word: εὔοπτός ἐστιν
  choice: её ясно видно
  rationale: Естественная русская конструкция, передающая значение «легко различима, явно видна».
- source_word: τὸ δʼ αὐτό
  choice: так же и
  rationale: 'Кратко и естественно продолжает сопоставление: «то же самое и…».'
- source_word: πνεῦμα
  choice: ветер
  rationale: Контекст природных явлений, глагол πνεῖ и указание на всякую землю требуют здесь метеорологического значения.
- source_word: ἐν πάσῃ χώρᾳ
  choice: во всякой земле
  rationale: Сохраняет универсализирующий смысл χώρα как земли, края или области и соответствует достоинству библейского регистра.
- source_word: πνεῖ
  choice: дует
  rationale: Точно и идиоматично передаёт общефактическое настоящее время применительно к ветру.
theological_decisions:
- issue: Значение потенциально богословски нагруженного слова πνεῦμα
  choice: ветер
  alternative: дух; дыхание
  rationale: В ряду наблюдаемых природных явлений и при глаголе «дует» метеорологическое значение наиболее обоснованно. Оно не привносит в текст неуместного учения о духе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохранён параллельным и ясным; двоеточие с точкой передано точкой с запятой.
