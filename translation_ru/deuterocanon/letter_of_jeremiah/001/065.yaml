  text: For they can neither curse kings nor bless them[a].
translation:
  language: ru
  text: Ведь они не могут ни проклясть царей, ни благословить их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «они ни за что не проклянут царей и не благословят [их]»; усиленное отрицание в данном контексте указывает на их неспособность сделать то или другое.'
    reason: 'Лексическая альтернатива: сохранён буквальный оттенок усиленного отрицания.'
lexical_decisions:
- source_word: Οὔτε γὰρ
  choice: Ведь ... ни ... ни
  rationale: γάρ придаёт фразе пояснительный характер, а οὔτε вводит парную отрицательную конструкцию. «Ведь» и «ни… ни…» естественно передают эту связь по-русски.
- source_word: βασιλεῦσιν
  choice: царей
  rationale: Форма дательного падежа множественного числа от βασιλεύς зависит от глаголов проклятия и благословения; в современном русском эти глаголы требуют винительного падежа.
- source_word: οὐ μὴ καταράσωνται
  choice: не могут ... проклясть
  rationale: Усиленное отрицание οὐ μή с аористом сослагательного наклонения выражает решительное отрицание или невозможность. В контексте бессилия идолов естественно передать это как неспособность.
- source_word: οὔτε μὴ εὐλογήσωσι
  choice: ни благословить их
  rationale: Вторая часть параллельна первой. Не названное повторно дополнение ясно восстанавливается из «царей» и передано местоимением «их».
theological_decisions:
- issue: Смысл усиленного отрицания в полемике против идолов
  choice: 'Передать как неспособность: «не могут ни… ни…»'
  alternative: 'Передать как решительное отрицание будущего действия: «ни за что не проклянут… и не благословят»'
  rationale: Греческая конструкция допускает оттенок категорического отрицания, однако контекст говорит о бессилии идолов. Формулировка «не могут» ясно передаёт этот смысл, не вводя дополнительного богословского утверждения.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Союз «ведь» сохраняет пояснительную связь с контекстом, а конструкция «не могут ни… ни…» естественно выражает бессилие идолов.
