  source_fidelity: 'Текст точно передаёт оба координированных эмфатически отрицательных будущих утверждения: «никогда не поставят» и «никогда не дадут» адекватно отражают οὐ μή с аористным сослагательным наклонением. «Царя» соответствует βασιλέα, «стране» передаёт χώρας без неоправданного сужения до современного государства, «дождя» — ὑετόν, а «людям» естественно выражает обобщённое ἀνθρώποις. «Ведь» уместно передаёт пояснительное γάρ.'
