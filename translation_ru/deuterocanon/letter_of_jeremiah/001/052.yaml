translation:
  language: ru
  text: Ведь они никогда не поставят стране[a] царя и никогда не дадут людям дождя,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земле» или «области». Греческое χώρα может означать землю, страну или область.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλέα
  choice: царя
  rationale: Винительный падеж единственного числа; в русском языке отсутствие артикля естественно передаёт неопределённость греческой формы.
- source_word: χώρας
  choice: стране
  rationale: χώρα обозначает землю, страну или область. Дательный «стране» естественно передаёт смысл того, для какой территории поставляется царь, не связывая выражение с современным понятием государства-нации.
- source_word: οὐ μὴ ἀναστήσωσιν
  choice: никогда не поставят
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание в будущем. «Никогда не поставят» сохраняет эту эмфазу и передаёт ἀνίστημι в смысле установления правителя.
- source_word: ὑετόν
  choice: дождя
  rationale: Обычное обозначение дождя; родительный падеж требуется при отрицании и звучит естественно по-русски.
- source_word: ἀνθρώποις
  choice: людям
  rationale: Дательный множественного числа ἄνθρωπος в обобщающем значении. Русское «людям» точно и естественно относится ко всем людям.
- source_word: οὐ μὴ δῶσιν
  choice: никогда не дадут
  rationale: Повтор «никогда не» передаёт самостоятельное усиленное отрицание οὐ μή во второй части и сохраняет параллелизм.
- source_word: γάρ
  choice: ведь
  rationale: Частица вводит пояснение или обоснование; «ведь» естественно сохраняет связь с предыдущей мыслью.
theological_decisions:
- issue: Характер утверждения о неспособности идолов
  choice: 'Сохранено усиленное отрицание будущего действия: «никогда не поставят… никогда не дадут».'
  alternative: «Не могут ни поставить… ни дать…»
  rationale: Греческий текст употребляет не прямую лексику способности, а эмфатическое отрицание будущего. Выбранный вариант не добавляет отдельного модального утверждения, хотя контекст подразумевает бессилие идолов.
- issue: Обобщающее значение ἀνθρώποις
  choice: людям
  alternative: человекам
  rationale: «Людям» в современном русском литературном языке естественно выражает родовое, всеобщее значение без ненужной архаизации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Параллельный повтор «никогда не» сохраняет эмфазу греческого οὐ μή; заключительная запятая оставлена в соответствии с тем, что стих представляет часть продолжающегося предложения.
