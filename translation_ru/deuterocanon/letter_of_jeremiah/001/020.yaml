translation:
  language: ru
  text: лица их почернели от дыма из дома[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из святилища» или «из храма»; буквально по-гречески: «из дома».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμελανωμένον
  choice: почернели
  rationale: 'Перфектное страдательное причастие от μελανόω обозначает достигнутое состояние: лица стали чёрными от дыма. Русское «почернели» естественно и конкретно передаёт этот результат.'
- source_word: τὸ πρόσωπον αὐτῶν
  choice: лица их
  rationale: Хотя πρόσωπον стоит в единственном числе, при множественном обладателе выражение имеет распределительный смысл; по-русски естественно употребить множественное «лица».
- source_word: ἀπὸ τοῦ καπνοῦ
  choice: от дыма
  rationale: ἀπό указывает на источник или причину; сочетание «почернели от дыма» точно и естественно передаёт причинный смысл.
- source_word: τοῦ ἐκ τῆς οἰκίας
  choice: из дома
  rationale: ἐκ обозначает происхождение дыма, а οἰκία в своём прямом значении — «дом». Более узкие культовые значения не вносятся в основной текст.
theological_decisions:
- issue: Следует ли в контексте идолов истолковательно перевести οἰκία как «святилище» или «храм»
  choice: дом
  alternative: святилище; храм
  rationale: В греческом стоит обычное слово οἰκία, а не специальное обозначение культового здания. Основной текст сохраняет прямое значение, тогда как возможный контекстуальный смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский; краткая, наглядная формулировка с сохранением греческого порядка образов и без избыточной культовой конкретизации.
