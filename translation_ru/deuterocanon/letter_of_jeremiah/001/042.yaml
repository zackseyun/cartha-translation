translation:
  language: ru
  text: А женщины, обвязавшись шнурами[a], сидят на улицах и воскуряют[b] отруби[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поместив вокруг себя шнуры (или верёвки)». Их символическое значение здесь не объясняется.'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол означает сжигать что-либо, производя дым, в том числе в качестве курения; однако далее названы именно отруби, а не обычное благовоние.
    reason: cultural_note
  - marker: c
    text: В представленном греческом тексте «воскуряя» стоит в женском роде единственного числа, хотя «женщины» — во множественном; перевод передаёт действие во множественном числе по смыслу.
    reason: textual_note
lexical_decisions:
- source_word: περιθέμεναι
  choice: обвязавшись
  rationale: Возвратное причастие обозначает, что женщины поместили нечто вокруг себя; деепричастие «обвязавшись» естественно передаёт это действие по-русски, не объясняя его возможного обрядового смысла.
- source_word: σχοινία
  choice: шнурами
  rationale: Слово обозначает шнуры или верёвки. «Шнуры» сохраняет неопределённость относительно их толщины и назначения.
- source_word: ἐν ταῖς ὁδοῖς
  choice: на улицах
  rationale: В данном публичном, вероятно городском контексте это наиболее естественное соответствие; буквальное «на дорогах» звучало бы менее уместно.
- source_word: ἐγκάθηνται
  choice: сидят
  rationale: Простая форма настоящего времени точно и естественно передаёт описываемое положение.
- source_word: θυμιῶσα
  choice: воскуряют
  rationale: Глагол обозначает сжигание с образованием дыма, в частности в обрядовом контексте. «Воскуряют» сохраняет этот оттенок, тогда как простое «сжигают» его ослабило бы.
- source_word: τὰ πίτυρα
  choice: отруби
  rationale: Обычное значение πίτυρα — «отруби»; «мякина» обозначала бы иной продукт переработки зерна.
theological_decisions:
- issue: Характер действий женщин и значение шнуров
  choice: 'Передать лишь явно описанные действия: женщины обвязаны шнурами, сидят на улицах и воскуряют отруби.'
  alternative: Истолковать шнуры и воскурение как элементы конкретного культа или обряда плодородия.
  rationale: Греческий текст не объясняет символику шнуров и не называет определённого обряда, поэтому перевод не должен вносить отсутствующее в нём конфессиональное или историко-религиозное толкование.
- issue: Числовое несогласование θυμιῶσα с подлежащим во множественном числе
  choice: По смыслу согласовать действие с «женщинами» и перевести глагол во множественном числе.
  alternative: Воспроизвести единственное число, создав в русском тексте грамматическое несогласование или подразумевая одну женщину.
  rationale: Переданный греческий текст содержит форму женского рода единственного числа при подлежащем во множественном числе. Контекст связывает действие с женщинами в целом; русское множественное число передаёт очевидный синтаксический смысл, а расхождение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным глаголом «воскуряют», уместным для описания обрядового действия. Формулировка остаётся ясной и описательной, не уточняя неизвестное назначение шнуров и обряда.
