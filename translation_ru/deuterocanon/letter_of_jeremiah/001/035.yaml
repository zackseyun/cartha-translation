translation:
  language: ru
  text: Они ни за что не спасут человека от смерти и не избавят слабого от сильного.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ θανάτου
  choice: от смерти
  rationale: Предлог ἐκ с родительным θανάτου обозначает избавление из-под власти или угрозы смерти; по-русски это естественно передаётся сочетанием «от смерти» без уточнения, идёт ли речь о смертельной опасности или уже наступившей смерти.
- source_word: ἄνθρωπον
  choice: человека
  rationale: ἄνθρωπον употреблено в единственном числе и имеет обобщающее значение; русское «человека» точно и естественно передаёт его без неоправданного указания на пол.
- source_word: οὐ μὴ ῥύσωνται
  choice: ни за что не спасут
  rationale: Сочетание οὐ μή с будущим временем выражает усиленное отрицание. «Ни за что не спасут» сохраняет эту категоричность и естественно звучит в современном русском языке; ῥύομαι здесь означает спасение от гибели.
- source_word: ἥττονα
  choice: слабого
  rationale: Сравнительная форма ἥττονα субстантивирована и обозначает более слабую сторону в противопоставлении сильному. В русском краткая пара «слабого — от сильного» естественно сохраняет антитезу.
- source_word: ἀπὸ ἰσχυροῦ
  choice: от сильного
  rationale: Фраза указывает на сильную сторону, из-под власти которой требуется избавление. «От сильного» сохраняет лаконизм и прямое противопоставление греческого текста.
- source_word: μὴ ἐξέλωνται
  choice: не избавят
  rationale: Средний залог ἐξαιρέω может означать избавление или вызволение из опасности. «Не избавят» ясно передаёт смысл и хорошо соответствует параллельному «не спасут».
