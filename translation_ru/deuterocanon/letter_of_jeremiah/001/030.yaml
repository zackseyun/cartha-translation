lexical_decisions:
- source_word: διφρεύουσιν
  choice: восседают
  rationale: Глагол связан с сиденьем, в том числе колесничным, и может обозначать церемониальное сидение. В контексте пребывания внутри домов «восседают» естественно передаёт торжественную или ритуальную позу, не вводя маловероятной здесь езды на колесницах.
- source_word: χιτῶνας
  choice: хитонах
  rationale: χιτών — нижняя одежда, хитон; точный и понятный в библейском контексте термин предпочтительнее общего «одеждах».
- source_word: διερρωγότας
  choice: разорванных
  rationale: Причастие совершенного вида указывает на одежду, уже приведённую в разорванное состояние; «разорванных» точно и современно.
- source_word: ἐξυρημένους
  choice: обритыми
  rationale: Форма обозначает удаление волос бритьём и относится как к головам, так и к бородам.
- source_word: ἀκάλυπτοί
  choice: непокрытой
  rationale: Прямо передаёт отсутствие головного покрытия; единственное число естественно в русском при собирательном описании каждого из жрецов.
- source_word: οἴκοις
  choice: домах
  rationale: Сохраняет прямое значение греческого слова, не сужая его интерпретационно до «храмов» или «святилищ».
theological_decisions:
- issue: Описание обрядового поведения языческих жрецов
  choice: Передать только видимые детали — сидение, разорванные хитоны, обритые головы и бороды, непокрытые головы.
  alternative: Назвать эти действия обрядами скорби или истолковать сидение как буквальное пребывание на престоле либо езду на колеснице.
  rationale: Греческий текст не объясняет назначения этих действий. Перевод сохраняет конкретное описание и его возможную культовую окраску, не закрепляя спорное толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Жрецы» ясно обозначает служителей языческого культа; «восседают» сохраняет необычность и возможную церемониальность греческого глагола. Синтаксис упрощён без утраты деталей оригинала.
