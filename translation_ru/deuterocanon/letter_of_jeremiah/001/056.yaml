  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/056.yaml
  text: How then can it be accepted or supposed that they are gods? Wooden gods overlaid with silver and overlaid with gold will certainly not save themselves from thieves or robbers[a][b].
translation:
  language: ru
  text: Как же можно допустить или счесть, что они — боги?[a] Деревянные боги, покрытые серебром и золотом, не смогут спасти себя ни от воров, ни от разбойников.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Как же следует допускать или считать, что они — боги?» В греческом стоят два отглагольных прилагательных, усиливающих риторический вопрос.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «деревянные боги, посеребрённые и позолоченные». Греческие составные прилагательные подчёркивают, что это изготовленные предметы, покрытые серебром и золотом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: Как же
  rationale: Передаёт выводный характер οὖν и силу риторического вопроса естественным современным русским оборотом.
- source_word: ἐκδεκτέον ἢ νομιστέον
  choice: можно допустить или счесть
  rationale: Сохраняет два однородных греческих отглагольных прилагательных и различие между допущением утверждения и признанием чего-либо таковым.
- source_word: ὅτι εἰσὶν θεοί
  choice: что они — боги
  rationale: Прямо передаёт греческое θεοί; тире подчёркивает именную часть сказуемого и поддерживает полемическую интонацию.
- source_word: Οὔτε ἀπὸ κλεπτῶν οὔτε ἀπὸ ληστῶν
  choice: Ни от воров, ни от разбойников
  rationale: Повтор «ни… ни…» воспроизводит οὔτε… οὔτε и сохраняет различие между тайными похитителями и открытыми грабителями.
- source_word: οὐ μὴ διασώσωνται
  choice: никак не спасутся
  rationale: «Никак не» передаёт усиленное отрицание οὐ μή. Возвратная форма «не спасутся» сохраняет контекстуальную возможность понимать глагол как неспособность уцелеть или уберечь самих себя.
- source_word: θεοὶ ξύλινοι
  choice: деревянные боги
  rationale: Сохраняет буквальное наименование θεοί и заложенную в сочетании иронию, не подменяя его пояснительным словом «идолы».
- source_word: περιάργυροι καὶ περίχρυσοι
  choice: покрытые серебром и золотом
  rationale: Передаёт значение внешнего покрытия драгоценными металлами ясным современным выражением и подчёркивает рукотворность предметов.
theological_decisions:
- issue: Передача θεοί в полемике против идолопоклонства
  choice: боги
  alternative: идолы; так называемые боги
  rationale: В греческом тексте прямо стоит θεοί. Контекст сам обличает ложность их божественного статуса, поэтому перевод не добавляет истолковывающего определения.
- issue: Залог и смысл διασώσωνται
  choice: не спасутся
  alternative: не спасут себя; не уцелеют
  rationale: Форма допускает оттенок спасения или сохранения; русское «не спасутся» сохраняет эту смысловую широту и сатирическую мысль об их полной беспомощности.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной полемической интонацией. Синтаксис сохраняет риторический вопрос и усиленное отрицание; лексика избегает как архаизмов, так и разговорности.
