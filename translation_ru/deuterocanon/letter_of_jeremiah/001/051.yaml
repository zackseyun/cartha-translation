- source_word: Τίνι
  choice: Кому
  rationale: Дательный падеж вопросительного местоимения передан буквально; он относится к безличному обороту «известно».
- source_word: οὖν
  choice: же
  rationale: Частица естественно передаёт связующее и выводное значение οὖν в русском вопросе, не усиливая его до строгого «следовательно».
- source_word: γνωστὸν ἐστὶν
  choice: известно
  rationale: Безличное «известно» точно и естественно передаёт греческое γνωστὸν ἐστὶν.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит придаточное, выражающее содержание известного.
- source_word: οὐκ εἰσὶν
  choice: не
  rationale: В составе именного сказуемого «не боги» прямо передаёт отрицание связки без добавочного толкования.
- source_word: θεοί
  choice: боги
  rationale: Обычное и прозрачное соответствие множественному числу θεός в контексте полемики с идолами.
