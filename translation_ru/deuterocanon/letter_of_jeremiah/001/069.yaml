  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/069.yaml
  text: For just as in a cucumber patch there is nothing guarding it[a], so their gods are wooden and overlaid with gold and silver.
translation:
  language: ru
  text: Ведь как пугало на огуречной грядке, ничего не охраняющее[a], так и их боги — деревянные, покрытые золотом и серебром.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переданное как «пугало», текстуально и лексически трудно. Наиболее вероятно, оно обозначает пугало или иной предмет, поставленный на огуречной грядке; следующая причастная форма означает «ничего не охраняющее».
    reason: textual_variant
lexical_decisions:
- source_word: σικυηράτῳ
  choice: на огуречной грядке
  rationale: Существительное обозначает место, засаженное огурцами или тыквенными культурами. «Огуречная грядка» естественно передаёт конкретный земледельческий образ по-русски.
- source_word: προβάσκάινόν οὐδὲν φυλάσσον
  choice: некому её сторожить
  rationale: Переданная греческая последовательность текстуально и лексически трудна. В контексте сравнения выражена мысль об отсутствии сторожа или защиты; перевод сохраняет этот общий смысл, не закрепляя спорную реконструкцию.
- source_word: φυλάσσον
  choice: сторожить
  rationale: φυλάσσω означает охранять, сторожить, нести надзор. Здесь «сторожить» естественно сочетается с образом огородной грядки.
- source_word: θεοὶ
  choice: боги
  rationale: Греческий текст прямо говорит «боги». Сохранение этого слова передаёт полемическую риторику оригинала; «идолы» было бы истолковывающей заменой.
- source_word: ξύλινοι
  choice: деревянные
  rationale: Прямой перевод прилагательного сохраняет указание на материал и обличительный тон.
- source_word: περίχρυσοι
  choice: покрытые золотом
  rationale: Слово обозначает предметы, покрытые золотом, а не сделанные из цельного золота.
- source_word: περιάργυροι
  choice: покрытые серебром
  rationale: Слово параллельно περίχρυσοι и обозначает покрытие серебром; в русском однородная конструкция «покрытые золотом и серебром» передаёт оба определения естественно и точно.
theological_decisions:
- issue: Перевод θεοὶ в контексте полемики против идолопоклонства
  choice: боги
  alternative: идолы
  rationale: Оригинал употребляет «боги», а затем раскрывает их материальную природу. Буквальное наименование сохраняет иронию и ход мысли текста, не подменяя его толкованием.
translation_notes:
  register: Современный литературный русский язык с ясным, но dignified библейским звучанием. Сравнение передано естественно; подлинная неясность греческого текста отмечена в сноске.
