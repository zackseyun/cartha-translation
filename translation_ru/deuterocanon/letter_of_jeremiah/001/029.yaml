  text: For how could they be called gods[b][a], since women set out offerings before silver and gold and wooden gods?
translation:
  language: ru
  text: Ибо как же их можно назвать богами?[a] Ведь женщины ставят приношения[b] перед серебряными, золотыми и деревянными богами.
  philosophy: optimal-equivalence
  footnotes:
