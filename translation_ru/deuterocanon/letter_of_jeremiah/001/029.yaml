    text: 'Или: «На каком основании их можно назвать богами?»'
    reason: lexical_alternative
  - marker: b
    text: Слово «приношения» подразумевается по смыслу; греческий глагол буквально означает «ставить перед», «подавать» или «предлагать».
    reason: implicit_object
lexical_decisions:
- source_word: Πόθεν
  choice: как
  rationale: В риторическом вопросе передаёт невозможность или отсутствие оснований называть эти предметы богами; буквальное «откуда» по-русски здесь звучало бы неестественно.
- source_word: κληθείησαν
  choice: их можно назвать
  rationale: Пассивный аорист оптатива выражает потенциальность в риторическом вопросе. Местоимение «их» ясно восстанавливает подразумеваемый предмет речи из контекста.
- source_word: θεοί / θεοῖς
  choice: боги / богами
  rationale: Сохранено прямое наименование «боги», поскольку именно оно создаёт полемическую иронию текста; замена на «идолы» заранее разрешила бы заложенное в оригинале противоречие.
- source_word: ὅτι
  choice: ведь
  rationale: Передаёт причинное обоснование предшествующего риторического вопроса естественным современным русским языком.
- source_word: γυναῖκες
  choice: женщины
  rationale: Прямо сохраняет указанную в греческом тексте группу действующих лиц.
- source_word: παρατιθέασιν
  choice: ставят приношения перед
  rationale: Глагол означает «ставить перед, подавать, предлагать». Слово «приношения» эксплицирует подразумеваемый в культовом контексте объект действия, а «перед» сохраняет пространственную конструкцию с дательным падежом.
- source_word: θεοῖς ἀργυροῖς καὶ χρυσοῖς καὶ ξυλίνοις
  choice: перед серебряными, золотыми и деревянными богами
  rationale: Сохранены прилагательные материала и повторное слово «богами», чтобы передать предметность этих богов и полемическую силу оригинала.
theological_decisions:
- issue: Передавать θεοί как «боги» или как «идолы»
  choice: боги
  alternative: идолы
  rationale: Греческий текст намеренно называет изображения «богами», одновременно ставя под сомнение правомерность такого названия. «Боги» сохраняет иронию и ход аргумента.
- issue: Насколько явно передавать подразумеваемый объект при παρατιθέασιν
  choice: ставят приношения перед
  alternative: ставят перед / подносят
  rationale: В оригинале объект не назван, но культовое действие подразумевает подношения. Добавление «приношения» делает фразу понятной, а сноска отмечает эту экспликацию, не выдавая её за прямо выраженное слово.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Риторический вопрос передан естественно, при этом сохранены полемическая ирония слова «боги», материальные определения и причинная связь между двумя частями стиха.
