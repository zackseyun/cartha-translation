lexical_decisions:
- source_word: ὅθεν
  choice: Отсюда
  rationale: Передаёт вывод, следующий из предшествующего описания бессилия идолов; сохраняет образное значение «из этого» и логическую связь.
- source_word: γινώσεσθε
  choice: вы узнаете
  rationale: Будущее изъявительное наклонение γινώσκω естественно передаётся будущим временем и обозначает вывод, к которому придут адресаты.
- source_word: θεοί
  choice: боги
  rationale: Прямой и полемически выразительный эквивалент, относящийся к мнимым богам, представленным идолами.
- source_word: μὴ οὖν φοβεῖσθε
  choice: Поэтому не бойтесь
  rationale: Сохраняет запрет и выводное значение οὖν в ясной современной русской форме.
- source_word: αὐτά
  choice: их
  rationale: Нейтральное местоимение естественно отсылает по-русски к подразумеваемым идолам, не добавляя отсутствующего в греческом существительного.
theological_decisions:
- issue: К кому относятся местоимения в отрицании божественности и повелении не бояться
  choice: Местоимения сохранены; в непосредственном контексте они относятся к изображениям-идолам, которым приписывают божественность.
  alternative: Понимать их шире — как мнимых богов, представленных этими изображениями.
  rationale: Греческий текст использует местоимение среднего рода αὐτά и не уточняет референт существительным. Сохранение местоимений не устраняет намеренно связь между изображениями и представляемыми ими богами.
