lexical_decisions:
- source_word: ἔστι δὲ καὶ ὅτε
  choice: Бывает и так, что
  rationale: Оборот указывает на повторяющиеся случаи, а не на одно событие; такая передача естественна по-русски и сохраняет присоединительное значение δὲ καὶ.
- source_word: ὑφαιρούμενοι
  choice: забирая
  rationale: Причастие означает изъятие или унесение, нередко тайное либо нечестное. Нейтральное «забирая» не сужает значение, а более сильные оттенки отмечены в сноске.
- source_word: οἱ ἱερεῖς
  choice: жрецы
  rationale: В контексте служителей языческих богов современное русское «жрецы» точнее и естественнее, чем «священники».
- source_word: ἀπὸ τῶν θεῶν αὐτῶν
  choice: у своих богов
  rationale: 'Предлог обозначает источник изъятия, а возвратное «своих» сохраняет иронию: жрецы обирают тех богов, которым сами служат.'
- source_word: χρυσὸν καὶ ἀργύριον
  choice: золото и серебро
  rationale: Греческий текст называет драгоценные материалы, не уточняя, были ли это деньги, украшения или иные предметы.
- source_word: εἰς ἑαυτοὺς καταναλοῦσιν
  choice: расходуют всё это на себя
  rationale: Глагол передаёт расходование или употребление, а εἰς ἑαυτούς — личную выгоду жрецов. «Всё это» ясно отсылает к золоту и серебру и делает фразу естественной по-русски.
theological_decisions:
- issue: Изображение злоупотреблений жрецов и бессилия идолов
  choice: Показано, что жрецы забирают ценности у собственных богов и расходуют их на себя, без смягчения сатирического смысла.
  alternative: Передать ὑφαιρούμενοι прямо как «крадя», сильнее подчеркнув преступный характер поступка.
  rationale: Текст обличает одновременно корысть жрецов и неспособность идолов защитить принадлежащие им ценности. Основной перевод сохраняет это напряжение, не делая обязательным самый сильный возможный оттенок причастия.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным звучанием. «Жрецы» последовательно обозначает служителей языческих богов. Конечная запятая сохранена, поскольку данный стих синтаксически продолжается далее.
