lexical_decisions:
- source_word: πῶς οὖν
  choice: Как же после этого
  rationale: Передаёт риторический вопрос и вывод из предшествующего обличения идолов; «после этого» естественно выражает обусловленность вывода предыдущими доводами.
- source_word: νομιστέον
  choice: считать
  rationale: Вопросительная конструкция с инфинитивом по-русски естественно передаёт заложенный в греческом отглагольном прилагательном смысл должного или возможного с риторическим отрицанием.
- source_word: ἢ
  choice: или
  rationale: Сохраняет простое разделение двух близких по смыслу действий.
- source_word: κλητέον
  choice: называть
  rationale: Прямо передаёт идею именования и согласуется с общим дополнением «их богами».
- source_word: αὐτοὺς ὑπάρχειν θεούς
  choice: их богами
  rationale: Русская конструкция «считать или называть их богами» ясно и естественно передаёт греческое дополнение с ὑπάρχειν, не усиливая его до отдельного утверждения о существовании.
theological_decisions:
- issue: Риторическая и долженствующая сила νομιστέον и κλητέον
  choice: Передать как риторический вопрос «Как же… считать или называть их богами?»
  alternative: «Как же тогда следует считать или называть их богами?»
  rationale: Основной текст естественно по-русски ставит под сомнение правомерность признания идолов богами, а сноска сохраняет более явный долженствующий оттенок греческих форм. Перевод не превращает вопрос в более широкое метафизическое утверждение.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified риторическая формулировка без архаизмов. Оборот «после этого» подчёркивает связь с предшествующим доводом, а общий предикатив «богами» сохраняет компактность греческой фразы.
