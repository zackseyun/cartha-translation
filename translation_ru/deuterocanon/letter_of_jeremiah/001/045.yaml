  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/045.yaml
  text: They are made by carpenters and goldsmiths; they can become nothing other than what the craftsmen want them to become.
translation:
  language: ru
  text: Они изготовлены плотниками и золотых дел мастерами; они не могут стать ничем иным, кроме того, чем хотят сделать их мастера.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπὸ τεκτόνων
  choice: плотниками
  rationale: Предлог ὑπό с родительным обозначает действующих лиц, а τέκτονες в контексте изготовления идолов — мастера по дереву, то есть плотники.
- source_word: χρυσοχόων
  choice: золотых дел мастерами
  rationale: Точное и естественное русское обозначение ремесленников, работающих с золотом.
- source_word: κατεσκευασμένα εἰσίν
  choice: изготовлены
  rationale: Передаёт результат совершённого человеческого изготовления и сохраняет пассивный смысл греческой конструкции.
- source_word: οὐθὲν ἄλλο μὴ γένηται
  choice: не могут стать ничем иным
  rationale: 'Передаёт выраженное контекстом ограничение: идолы не обретают никакого вида или состояния независимо от замысла изготовителей.'
- source_word: βούλονται
  choice: хотят
  rationale: Прямо и естественно передаёт волю мастеров, не сужая значение до заранее составленного плана.
- source_word: οἱ τεχνῖται
  choice: мастера
  rationale: Общее обозначение умелых ремесленников уместно после более конкретных наименований плотников и золотых дел мастеров.
- source_word: αὐτὰ γενέσθαι
  choice: чем хотят сделать их
  rationale: В русском языке такая конструкция естественно передаёт желаемый мастерами результат; буквальное повторение глагола «стать» здесь было бы тяжеловесным.
theological_decisions:
- issue: Характер утверждения об идолах
  choice: Идолы полностью зависят от изготовивших их людей и не могут стать чем-либо помимо приданного им мастерами вида.
  alternative: Ограничиться указанием лишь на человеческое происхождение идолов, не выражая их неспособность к независимому становлению.
  rationale: 'Вторая часть стиха развивает первую: человеческое изготовление означает полную зависимость изделия от воли мастеров. Перевод сохраняет эту полемическую направленность, не добавляя иных богословских утверждений.'
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. Выражение «золотых дел мастера» сохраняет ремесленную конкретность, а синтаксис второй части передаёт зависимость идолов от человеческого замысла без неестественной буквальности.
