  text: They are indeed like a beam from a house[a], but they say that their hearts are licked away; while the creeping things from the ground devour them and their clothing, they do not perceive it.
translation:
  language: ru
  text: Они и вправду подобны балке из дома[a], однако говорят, что их сердца вылизывают; когда ползающие по земле твари пожирают и их самих, и их одежды, они этого не чувствуют.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобны одной из балок дома». Слова «из дома» могут указывать на происхождение балки либо характеризовать её как часть строения.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: δοκός
  choice: балка
  rationale: Слово обозначает крупный деревянный элемент строения; «балка» естественно передаёт сравнение идолов с обработанным строительным брусом.
- source_word: καρδίας
  choice: сердца
  rationale: Буквальное название сохраняет насмешливый антропоморфный образ деревянных идолов; возможный конкретный смысл — их внутренность.
- source_word: ἐκλείχεσθαι
  choice: вылизаны
  rationale: Передаёт образ глагола λείχω («лизать») без пояснительного усиления; необычность выражения соответствует греческому образу постепенного уничтожения внутренности.
- source_word: ἑρπετῶν
  choice: ползающие по земле твари
  rationale: Широкое обозначение ползающих существ, не ограниченное современным классом пресмыкающихся; сочетание также передаёт ἀπὸ τῆς γῆς.
- source_word: κατεσθιόντων
  choice: пожирают
  rationale: Сохраняет выразительное значение активного поедания и уничтожения.
- source_word: ἱματισμόν
  choice: одежды
  rationale: Современное и понятное обозначение облачения, покрывающего идолов.
- source_word: οὐκ αἰσθάνονται
  choice: не чувствуют
  rationale: Передаёт отсутствие ощущения у идолов и усиливает контекстуальную иронию; местоимение «этого» обозначает всё происходящее.
theological_decisions:
- issue: К кому относятся местоимения и кто является субъектом заключительного глагола
  choice: 'Идолы: твари пожирают их и их одежды, а сами идолы этого не чувствуют.'
  alternative: В части высказывания могут подразумеваться почитатели идолов, особенно как субъект φασίν («говорят»).
  rationale: Ближайшие референты αὐτούς, αὐτῶν и οὐκ αἰσθάνονται — идолы; это согласуется с продолжающимся обличением их бесчувственности.
- issue: Передача образа уничтожаемых «сердец» идолов
  choice: Сохранено буквальное «сердца».
  alternative: «Внутренности» или «внутренняя часть».
  rationale: Греческий текст намеренно приписывает деревянным предметам часть тела; буквальная передача сохраняет насмешливый образ и не устраняет его двусмысленность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской полемической речи. Необычный образ «сердца их вылизаны» сохранён намеренно; более разговорное «не замечают» отвергнуто в пользу сенсорного «не чувствуют».
