  verdict: revise
  source_fidelity: 'В целом смысл передан точно: δοκός — «балка», καρδίας сохранено как «сердца», ἑρπετά и ἱματισμός переданы адекватно, а заключительное «они этого не чувствуют» верно относит отсутствие ощущения к идолам. Однако «вылизаны» в русском означает скорее результат облизывания, тогда как ἐκλείχεσθαι выражает уничтожение/съедание посредством лизания; требуется передать уходящий, разрушительный эффект.'
  naturalness: «Сердца их вылизаны» грамматически возможно, но в современном литературном русском звучит как неясный и статичный образ. «Их сердца вылизывают» сохраняет намеренную странность греческой антропоморфной метафоры, но яснее передаёт продолжающееся действие. «Ползающие по земле твари» естественно, хотя «существа, ползающие по земле» несколько нейтральнее.
  terminology: «Балка», «сердца», «одежды» и «не чувствуют» уместны. Не следует заменять «сердца» толковательным «внутренности» в основном тексте. Сноска к «из дома» обоснованно отмечает синтаксическую неоднозначность и якорь поставлен корректно.
