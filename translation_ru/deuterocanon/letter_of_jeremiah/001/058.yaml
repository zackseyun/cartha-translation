  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/058.yaml
  text: So a king who displays his own courage is better than the false gods[a], or a useful vessel in a house, which its owner will use, or a door in a house that keeps safe the things in it, or the false gods, and a wooden pillar in palaces is better than the false gods.
translation:
  language: ru
  text: Поэтому царь, проявляющий собственную доблесть, лучше ложных богов; и полезный сосуд в доме, которым пользуется его владелец, — лучше ложных богов; и дверь в доме, сохраняющая то, что находится внутри, — лучше ложных богов; и деревянный столб во дворцах — лучше ложных богов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Поэтому
  rationale: Передаёт итоговый вывод из предшествующего рассуждения.
- source_word: κρεῖσσον
  choice: лучше
  rationale: Естественно передаёт сравнительное значение и сохраняет повторяющуюся полемическую формулу.
- source_word: βασιλέα ἐπιδεικνύμενον τὴν ἑαυτοῦ ἀνδρείαν
  choice: царь, проявляющий собственную доблесть
  rationale: Причастный оборот относится к царю; «собственную» сохраняет рефлексивное усиление ἑαυτοῦ, а «доблесть» соответствует достойному регистру ἀνδρεία.
- source_word: σκεῖος ἐν οἰκίᾳ χρήσιμον
  choice: полезный сосуд в доме
  rationale: «Сосуд» сохраняет широкое обозначение предмета домашнего обихода, не сужая его до конкретной утвари.
- source_word: ἐφʼ ᾧ χρήσεται ὁ κεκτημένος
  choice: которым пользуется его владелец
  rationale: Естественная русская передача практической пригодности предмета; настоящее время в русском выражает обычное, характерное употребление и не требует тяжеловесного будущего.
- source_word: οἱ ψευδεῖς θεοί
  choice: ложные боги
  rationale: В контексте идолопоклонства ψευδεῖς характеризует их как ненастоящих богов; формула ясна и богословски не перегружена.
- source_word: θύρα ἐν οἰκίᾳ διασώζουσα τὰ ἐν αὐτῇ ὄντα
  choice: дверь в доме, сохраняющая то, что находится внутри
  rationale: Передаёт защитную функцию двери и оставляет референцию местоимения достаточно общей, как в греческом.
- source_word: ξύλινος στύλος ἐν βασιλείοις
  choice: деревянный столб во дворце
  rationale: Буквально и естественно передаёт архитектурный образ; собирательно-локативное ἐν βασιλείοις по-русски идиоматично выражено единственным числом.
theological_decisions:
- issue: Повтор формулы ἢ οἱ ψευδεῖς θεοί после каждого сравнения
  choice: Явно повторить «лучше ложных богов» после каждого предмета сравнения.
  alternative: Свести все примеры в один перечень с единственным итоговым сравнением.
  rationale: Повтор составляет полемический ритм греческого текста и подчёркивает бесполезность ложных богов; его устранение неоправданно сгладило бы риторику.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской полемической речи. Пунктуация расчленяет рыхлую греческую сравнительную конструкцию, а повтор сказуемого делает её понятной без утраты исходного риторического нажима.
