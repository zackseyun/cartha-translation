  text: The wooden things and the gold-covered and silver-covered things are like stones from the mountain[a], and those who serve them will be put to shame.
translation:
  language: ru
  text: Деревянные предметы, предметы, покрытые золотом, и предметы, покрытые серебром, подобны камням с горы, а те, кто служит им[a], будут посрамлены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклоняются им». Греческий глагол может означать как служение, так и культовое поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀπὸ τοῦ ὄρους λίθοις
  choice: камням с горы
  rationale: Дательный падеж обусловлен ὡμοιωμένοι; выражение обозначает то, с чем сравниваются идолы. «Камням с горы» естественно по-русски и сохраняет образ обычного неодушевлённого камня без добавления отсутствующей в греческом тексте идеи добычи в каменоломне.
- source_word: ὡμοιωμένοι εἰσὶν
  choice: подобны
  rationale: Перфектное страдательное причастие с εἰμί здесь выражает устойчивое уподобление; краткое прилагательное «подобны» естественно передаёт состояние сравнения.
- source_word: τὰ ξύλινα
  choice: деревянные
  rationale: Субстантивированное прилагательное буквально обозначает «деревянные [предметы]». Эллиптическая форма по-русски сохраняет отсутствие явного существительного в греческом тексте, а контекст указывает на идолов.
- source_word: τὰ περίχρυσα
  choice: покрытые золотом
  rationale: περίχρυσος обозначает предмет, покрытый или облицованный золотом. Выражение ясно для современного читателя и не уточняет без необходимости технику покрытия.
- source_word: τὰ περιάργυρα
  choice: покрытые серебром
  rationale: Передаёт параллельное περίχρυσα значение предметов, покрытых серебром, и сохраняет материальную образность и синтаксический параллелизм.
- source_word: οἱ δὲ θεραπεύοντες αὐτά
  choice: а те, кто служит им
  rationale: θεραπεύω может означать служение, уход или культовое почитание. «Служит им» сохраняет широту слова и естественно звучит в контексте служения идолам.
- source_word: κατασχυνθήσονται
  choice: будут посрамлены
  rationale: Будущее страдательного залога передано страдательной конструкцией, сохраняющей пророческую и судебную силу высказывания.
theological_decisions:
- issue: Передача θεραπεύοντες в контексте идолопоклонства
  choice: те, кто служит им
  alternative: те, кто поклоняется им
  rationale: Контекст допускает узкое культовое значение «поклоняется», однако «служит» точнее сохраняет семантическую широту греческого глагола и библейскую формулу служения идолам, не снимая культового смысла.
translation_notes:
  register: Современный литературный русский язык с лаконичной, достоинственной синтаксической формой. Субстантивированные определения «деревянные, покрытые золотом и покрытые серебром» намеренно сохраняют эллиптичность оригинала; явное «идолы» не добавлено.
