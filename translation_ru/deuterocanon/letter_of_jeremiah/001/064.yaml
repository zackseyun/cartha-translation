lexical_decisions:
- source_word: γνόντες
  choice: зная
  rationale: 'Аористное причастие здесь выражает обстоятельство с причинно-логическим оттенком: запрет основан на осознании того, что идолы не являются богами. «Зная» естественно звучит по-русски и не перегружает фразу.'
- source_word: οὖν
  choice: итак
  rationale: Частица обозначает вывод из предшествующего рассуждения. «Итак» ясно передаёт итогово-логическую связь и уместно в современном литературном русском.
- source_word: οὐκ εἰσὶν θεοί
  choice: они не боги
  rationale: Прямо передаёт отрицательную именную конструкцию и сохраняет полемическую силу текста, не вводя дополнительных понятий вроде «божественных существ».
- source_word: μὴ φοβῆσθε
  choice: не бойтесь
  rationale: Естественная русская форма запрета, точно передающая повелительное значение и допускающая прямое дополнение.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение отсылает к упомянутым ранее идолам. «Их» сохраняет форму исходного текста без поясняющей вставки.
theological_decisions:
- issue: Передача θεοί в контексте полемики с идолопоклонством
  choice: боги
  alternative: божественные существа
  rationale: Текст отрицает божественность идолов. «Боги» непосредственно соответствует θεοί, сохраняет риторическое напряжение и не вносит более узкого истолкования.
