revisions:
- from: Ведь как ворона между небом и землёй[a], так и когда огонь обрушится на дом деревянных, покрытых золотом или покрытых серебром богов[b], их жрецы убегут и спасутся, а сами они сгорят дотла, словно балки в середине дома.
  to: Ведь как ворона находится между небом и землёй[a], так и когда в дом деревянных, покрытых золотом или покрытых серебром богов[b] попадёт огонь, их жрецы убегут и спасутся, а сами они сгорят дотла, словно балки, находящиеся посередине.
  rationale: Исправлена русская синтаксическая неполнота начального сравнения без развёртывания его предполагаемого смысла. «Попадёт огонь» точнее передаёт ἐμπέσῃ εἰς, а финальный образ освобождён от добавленного слова «дома». Примечание к начальному сравнению приведено к нейтральному описанию текстовой трудности.
