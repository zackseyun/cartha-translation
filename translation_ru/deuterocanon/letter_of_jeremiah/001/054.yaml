review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: сохранены образ вороны, «дом» богов, три характеристики идолов, бегство и спасение жрецов, а также полное сгорание самих богов. Однако «огонь обрушится на дом» несколько меняет направление ἐμπέσῃ εἰς («попадёт/ворвётся в дом»), а «в середине дома» добавляет отсутствующее в греческом уточнение «дома».'
  naturalness: 'Начальная конструкция в черновике слишком эллиптична для русского: «как ворона между небом и землёй, так и когда...» не образует ясного сопоставления. Добавление «находится» минимально сглаживает фразу, не истолковывая образ. «Попадёт огонь» — естественнее и ближе к греческому направлению действия.'
  terminology: «Ворона», «дом ... богов», «жрецы», «покрытые золотом/серебром» и «сгорят дотла» удачны. Примечание a не должно утверждать конкретное толкование («идолы столь же беспомощны», «на виду»), которого нет в самом кратком и синтаксически трудном греческом сравнении.
  issues:
  - severity: medium
    issue: Примечание a излагает спорное толкование образа как установленный смысл.
    rationale: Греческое начало стиха крайне кратко и не объясняет, в чём именно состоит сравнение вороны с идолами. Следует отметить эллиптичность, не добавляя «беспомощны» и «на виду».
  - severity: low
    issue: «Огонь обрушится на дом» передаёт движение на поверхность, а не внутрь дома.
    rationale: ἐμπέσῃ εἰς οἰκίαν означает попадание/вторжение огня в дом; «когда в дом ... попадёт огонь» сохраняет это точнее.
  - severity: low
    issue: «Балки в середине дома» включает слово «дома», которого в греческом тексте нет.
    rationale: δοκοὶ μέσοι буквально характеризует балки как находящиеся посередине; контекст здания понятен, но лучше не вносить его в перевод.
