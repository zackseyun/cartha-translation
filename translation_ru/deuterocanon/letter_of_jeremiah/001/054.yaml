base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/054.yaml
  text: For just as a crow is between heaven and earth[a], so also when fire falls into a house of wooden or gold-covered or silver-covered gods, their priests will flee and be saved[b], but they themselves will be burned up like beams in the middle.
translation:
  language: ru
  text: Ведь как ворона находится между небом и землёй[a], так и когда в дом деревянных, покрытых золотом или покрытых серебром богов[b] попадёт огонь, их жрецы убегут и спасутся, а сами они сгорят дотла, словно балки, находящиеся посередине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальное сравнение в греческом тексте выражено предельно кратко; его точная связь с последующим высказыванием не раскрыта.
    reason: cultural_note
  - marker: b
    text: 'Или: «в храм деревянных, покрытых золотом или покрытых серебром богов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ … καὶ γὰρ
  choice: как … так и
  rationale: Передаёт сравнительную связь между кратким начальным образом и последующим описанием, минимально сглаживая эллиптический греческий синтаксис.
- source_word: κορώνη
  choice: ворона
  rationale: Обычное и конкретное значение греческого слова; обобщение до «птицы» не требуется.
- source_word: ἀνὰ μέσον τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: между небом и землёй
  rationale: Естественное русское пространственное выражение, сохраняющее исходный образ.
- source_word: ἐμπέσῃ … πῦρ
  choice: огонь обрушится на
  rationale: Сохраняет значение внезапного вторжения или падения огня, не заменяя его более толковательным «начнётся пожар».
- source_word: οἰκίαν θεῶν
  choice: дом … богов
  rationale: Основное значение οἰκία — «дом»; контекстуальное «храм» дано в примечании.
- source_word: ξύλινων ἢ περιχρύσων ἢ περιηργύρων
  choice: деревянных, покрытых золотом или покрытых серебром
  rationale: Точно передаёт материал и наружное покрытие изображений, сохраняя параллелизм трёх определений.
- source_word: φεύξονται καὶ διασωθήσονται
  choice: убегут и спасутся
  rationale: 'Сохраняет оба глагола: бегство как действие и спасение как его результат.'
- source_word: δοκοὶ μέσοι
  choice: балки в середине дома
  rationale: Передаёт архитектурный образ и естественно раскрывает пространственное значение μέσοι в русском синтаксисе.
- source_word: κατακαυθήσονται
  choice: сгорят дотла
  rationale: Выражает усиленное значение полного уничтожения огнём.
theological_decisions:
- issue: Эллиптическое сравнение в начале стиха
  choice: Сохранить образ вороны и связать части конструкцией «как … так и»
  alternative: Развернуть смысл образа, прямо назвав идолов беспомощными
  rationale: Греческий текст выражается кратко и неоднозначно; перевод сохраняет риторический образ, не превращая предполагаемый смысл в основной текст.
- issue: Передача οἰκίαν θεῶν
  choice: «дом … богов» в основном тексте
  alternative: «храм … богов»
  rationale: «Дом» формально ближе к греческому слову, тогда как «храм» является ясным контекстуальным толкованием и потому вынесен в примечание.
- issue: К кому относится местоименное αὐτοί
  choice: Передать как «сами они», сохраняя отсылку к идолам-богам
  alternative: 'Эксплицировать: «сами идолы»'
  rationale: Грамматическая отсылка в контексте ясна, а сохранение местоимения воспроизводит противопоставление жрецов и их богов без добавочной номинации.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Сохранены конкретный образ вороны, полемическое противопоставление жрецов и идолов и резкий образ полного сгорания; эллипсис оригинала лишь минимально сглажен ради понятности.
