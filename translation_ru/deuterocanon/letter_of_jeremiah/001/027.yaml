review_pass:
  verdict: revise
  source_fidelity: 'В основном переданы и структура, и смысл стиха. Однако «принесённые им» добавляет указание на адресата приношений, которого греческий текст прямо не содержит; «часть жертв» также вносит невыраженное ограничение. ἀπ’ αὐτῶν естественно связывается с жертвами: женщины заготавливают из них пищу для хранения. «Не уделяют ничего» точно передаёт μεταδῶσιν и яснее обозначает отсутствие доли для нуждающихся.'
  naturalness: «Жрецы», «беспомощный» и общий регистр соответствуют современному литературному русскому с уместной библейской окраской. Исправленная формулировка сохраняет параллелизм, устраняя несколько тяжеловесное и избыточно конкретное «заготавливая часть жертв впрок».
  terminology: «Жрецы» уместно в полемическом контексте идольского культа. «Жертвы» сохраняет соответствие θυσίαι. «Бедному» и «беспомощному» адекватно передают обобщающие дативы πτωχῷ и ἀδυνάτῳ. Сноска к ἀποδιδόμενοι должна говорить о «жертвах», а не о «принесённых им жертвах».
