  text: And their priests[a], taking back their sacrifices, make use of them; likewise their women, preserving some from them[b], give none to the poor or the helpless.
translation:
  language: ru
  text: А их жрецы, забирая обратно их жертвы[a], пользуются ими; так же и их женщины, заготавливая из них пищу впрок[b], ничего не уделяют ни бедному, ни беспомощному.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «получая обратно их жертвы». Греческая форма может обозначать возвращение или получение приношений обратно для собственного пользования.'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол обозначает заготовку пищи для хранения, вероятно путём засолки или вяления.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποδιδόμενοι
  choice: забирая обратно
  rationale: Средняя форма допускает значение возвращения или получения обратно; выражение передаёт присвоение жрецами жертв, не уточняя сверх текста, каким именно образом они их получают.
- source_word: καταχρῶνται
  choice: пользуются ими
  rationale: Глагол может обозначать пользование, полное употребление или расходование. Нейтрально-описательный перевод сохраняет возможность отрицательного оттенка, который создаётся контекстом.
- source_word: ταριχεύουσαι
  choice: заготавливая часть жертв впрок
  rationale: Глагол обозначает сохранение пищи, обычно посредством засолки или иной обработки. Основной текст передаёт цель действия естественным современным языком, а конкретный древний способ поясняется в сноске.
- source_word: μεταδῶσιν
  choice: делятся
  rationale: Глагол означает давать кому-либо долю из имеющегося; «делятся» точнее простого «дают» выражает участие другого в запасённой пище.
- source_word: πτωχῷ
  choice: с бедным
  rationale: Единственное число имеет обобщающее значение и естественно передаётся русским обозначением представителя этой категории.
- source_word: ἀδυνάτῳ
  choice: с беспомощным
  rationale: Слово обозначает лишённого силы или возможности помочь себе; в данном контексте «беспомощный» яснее, чем более широкое «слабый».
theological_decisions:
- issue: Нравственная оценка присвоения жертв жрецами и женщинами
  choice: Описать их действия без добавления прямого осуждения
  alternative: Передать καταχρῶνται как «злоупотребляют ими» или «присваивают их»
  rationale: Греческий текст допускает отрицательный оттенок, но не требует явного глагола осуждения; полемический смысл достаточно ясно возникает из описания того, что жертвами пользуются сами служители и не делятся с нуждающимися.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Жрецы» выбрано для служителей идолов; синтаксический параллелизм греческого текста сохранён. Все поясняемые места снабжены маркерами [a] и [b] в основном тексте.
