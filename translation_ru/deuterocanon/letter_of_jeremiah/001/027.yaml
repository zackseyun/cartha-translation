- from: А их жрецы, забирая обратно принесённые им жертвы[a], пользуются ими; так же и их женщины, заготавливая часть жертв впрок[b], ничем не делятся ни с бедным, ни с беспомощным.
  to: А их жрецы, забирая обратно их жертвы[a], пользуются ими; так же и их женщины, заготавливая из них пищу впрок[b], ничего не уделяют ни бедному, ни беспомощному.
  rationale: 'Убраны два невыраженных в греческом уточнения: что жертвы были принесены именно жрецам и что женщины заготавливали только их часть. «Из них пищу» эксплицирует подразумеваемую у ταριχεύουσαι пищевую обработку, не конкретизируя способ; он сохранён в сноске. «Ничего не уделяют» передаёт значение дать кому-либо долю и естественно сочетается с двумя группами нуждающихся.'
  reviewer_model: gpt-5.6-terra
