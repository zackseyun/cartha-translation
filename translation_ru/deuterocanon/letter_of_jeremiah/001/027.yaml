    rationale: В τὰς θυσίας αὐτῶν сказано лишь «их жертвы/приношения». Хотя контекст позволяет предполагать приношения идолам, адресат «им» не выражен и не должен вводиться в основной текст.
  - severity: medium
    issue: Добавлено «часть жертв»
    rationale: Ни ταριχεύουσαι, ни ἀπ’ αὐτῶν не указывают явно на «часть». Предлог передаёт источник действия («из них»), но не требует количественного уточнения.
