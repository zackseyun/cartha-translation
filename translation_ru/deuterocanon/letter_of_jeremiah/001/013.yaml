- from: И держит он скипетр, как человек — судья страны,[a] но не погубит того, кто согрешит против него.[b]
  to: Он держит скипетр, как человек — судья страны,[a] который не погубит[b] того, кто грешит против него.
  rationale: Исправление восстанавливает относительную конструкцию оригинала (ὃς) и убирает отсутствующий в греческом союзе «но», не навязывая толкования референта относительного придаточного. Также настоящее «грешит» точнее передаёт ἁμαρτάνοντα, а якорь сноски о глаголе перенесён к слову, которое она поясняет.
