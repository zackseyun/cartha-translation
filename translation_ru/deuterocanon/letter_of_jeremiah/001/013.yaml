  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/013.yaml
  text: And he holds a scepter like a man[a], a judge of a country[b], who will not destroy the one who sins against him.
translation:
  language: ru
  text: Он держит скипетр, как человек — судья страны,[a] который не погубит[b] того, кто грешит против него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «области» или «земли». Греческое χώρα может обозначать страну, область или землю.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не убьёт» или «не устранит». Греческий глагол может означать убийство либо устранение; здесь он подчёркивает неспособность идола покарать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκήπτρον
  choice: скипетр
  rationale: Слово обозначает жезл власти; «скипетр» естественно сохраняет царственно-судебную символику.
- source_word: κριτὴς
  choice: судья
  rationale: Прямо передаёт образ человека, наделённого судебной властью, не заменяя его более широким понятием «правитель».
- source_word: χώρας
  choice: страны
  rationale: χώρα может обозначать землю, страну или область; «страны» здесь звучит естественно и не требует уточнять административный статус территории.
- source_word: ἀνελεῖ
  choice: не погубит
  rationale: Глагол ἀναιρέω допускает значения «убить», «устранить», «погубить». Выбор сохраняет широту смысла и подчёркивает неспособность идола покарать виновного.
- source_word: τὸν εἰς αὐτὸν ἁμαρτάνοντα
  choice: того, кто согрешит против него
  rationale: Передаёт субстантивированное причастие и направленность проступка против идола, сохраняя нравственно-религиозный оттенок ἁμαρτάνω.
- source_word: ὡς ἄνθρωπος κριτὴς χώρας
  choice: как человек — судья страны
  rationale: Тире ясно связывает «человека» с приложением «судья страны» и передаёт сравнение идола с человеческим судьёй.
theological_decisions:
- issue: Идол представлен в образе человеческого судьи
  choice: 'Сохранить прямое сопоставление: идол держит знак власти, как человек-судья, но не способен покарать согрешившего против него.'
  alternative: Передать κριτὴς χώρας как «правитель области».
  rationale: «Судья» сохраняет юридический образ оригинала и контраст между внешним знаком власти и действительным бессилием идола.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис слегка упрощён для ясности; союз «но» естественно выражает смысловой контраст между видимостью власти и бессилием, заложенный в контексте.
