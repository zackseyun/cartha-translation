  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/040.yaml
  text: 'Moreover[a], even the Chaldeans themselves dishonor them: whenever they see a mute person unable to speak, they bring him before Bel and ask that he make him speak[c][b], as though he were able to perceive.'
translation:
  language: ru
  text: 'Кроме того, даже сами халдеи бесчестят их: всякий раз, когда они видят немого, который не может говорить, они приводят его к Вилу[a] и просят Вила даровать ему речь — словно он способен воспринимать[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вил — вавилонское имя или титул божества, связанный с Мардуком.
    reason: cultural_note
  - marker: b
    text: 'Или: «словно он способен понять»; возможен также смысл: «заметить происходящее».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ καὶ
  choice: Кроме того, даже
  rationale: Передаёт добавочное значение ἔτι δέ и усилительное καί, вводя новый довод против идолов.
- source_word: αὐτῶν τῶν Χαλδαίων
  choice: сами халдеи
  rationale: 'αὐτῶν при существительном имеет усилительное значение: идолов бесчестят даже их собственные почитатели.'
- source_word: ἀτιμαζόντων αὐτά
  choice: бесчестят их
  rationale: Сохраняет прямое значение ἀτιμάζω и местоименную отсылку к идолам из контекста.
- source_word: ἐνεὸν οὐ δυνάμενον λαλῆσαι
  choice: немого, который не может говорить
  rationale: Точно и в современном нейтральном регистре передаёт как обозначение человека, так и поясняющий оборот оригинала.
- source_word: προσενεγκάμενοι τὸν Βῆλον
  choice: приводят его к Вилу
  rationale: В контексте подразумевается принесение или представление немого перед изображением божества; «приводят к Вилу» естественно передаёт ритуальную ситуацию без излишнего уточнения.
- source_word: ἐξιοῦσιν φωνῆσαι
  choice: просят Вила даровать ему речь
  rationale: Подлежащее подразумевается из контекста; формулировка ясно передаёт просьбу о том, чтобы немой заговорил, и избегает цепочки неоднозначных местоимений.
- source_word: ὡς δυνατοῦ ὄντος αὐτοῦ αἰσθέσθαι
  choice: словно тот способен что-либо воспринять
  rationale: Сохраняет ироническое сравнение и широкое значение αἰσθάνομαι — воспринимать, замечать, сознавать — не сводя его только к пониманию.
theological_decisions:
- issue: Как именно халдеи бесчестят идолов
  choice: Их обращение к Вилу за исцелением немого представлено как действие, невольно обнаруживающее бессилие идола.
  alternative: Речь может идти шире о непочтительном отношении халдеев к собственным богам или изображениям.
  rationale: Непосредственный контекст полемики и пример с немым подчёркивают неспособность идола воспринимать и действовать, однако перевод не добавляет прямого богословского вывода сверх текста.
- issue: Способность Вила αἰσθέσθαι
  choice: «способен что-либо воспринять»
  alternative: «способен понять» или «способен заметить»
  rationale: Широкая формулировка сохраняет смысловую напряжённость греческого глагола между чувственным восприятием, осознанием и замечанием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «Вила» использован для устранения неясности русских местоимений; тире подчёркивает иронический итог фразы. Все сноски отмечены в основном тексте.
