  text: For since they are wooden, overlaid with gold and overlaid with silver, it will afterward be known that they are false; to all the nations and to the kings it will be evident that they are not gods but works of human hands, and there is no work of God in them.
translation:
  language: ru
  text: Ибо они деревянные, покрытые золотом и покрытые серебром; впоследствии станет известно, что они ложны. Всем народам и царям будет очевидно, что они не боги, а изделия человеческих рук и что в них нет никакого Божьего дела.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάρχοντα γὰρ ξύλινα
  choice: Ведь поскольку они деревянные
  rationale: Передаёт причинное γάρ и описательное ὑπάρχοντα с естественным русским порядком слов.
- source_word: περίχρυσα καὶ περιάργυρα
  choice: покрытые золотом и покрытые серебром
  rationale: Сохраняет параллелизм двух греческих прилагательных и подчёркивает, что речь идёт о внешнем покрытии.
- source_word: ψευδῆ
  choice: ложны
  rationale: 'Сохраняет широкое значение: идолы оказываются не тем, за что их выдают; не сужает смысл до одного лишь «поддельны».'
- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: изделия человеческих рук
  rationale: Естественно по-русски передаёт рукотворность объектов, сохраняя образ рук.
- source_word: οὐθὲν θεοῦ ἔργον ἐν αὐτοῖς ἐστίν
  choice: в них нет никакого Божьего дела
  rationale: 'Формально сохраняет повтор ἔργον и неоднозначность выражения: в них нет ни Божьего действия, ни произведения Бога.'
theological_decisions:
- issue: Отрицание божественности идолов
  choice: они не боги
  alternative: они не являются богами
  rationale: Прямо и без конфессионального расширения воспроизводит οὐκ εἰσὶ θεοί.
- issue: Значение «Божьего дела» в идолах
  choice: в них нет никакого Божьего дела
  alternative: в них нет никакого действия Бога
  rationale: Выбрана более формальная передача, чтобы не устранять смысловое напряжение и сохранить лексическую связь с предшествующим «изделия».
translation_notes:
  register: 'Современный литературный русский язык, торжественный, но общепонятный. Синтаксис слегка упрощён по сравнению с длинным греческим периодом: поставлена точка после первой смысловой части без изменения логической связи.'
