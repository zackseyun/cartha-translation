base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/026.yaml
  text: Therefore[a], if one of them falls to the ground, they cannot raise themselves up; and if someone sets it upright, it will not move by itself; and if it is tilted, it will certainly not be made straight. Rather[b], gifts are set before them as before the dead.
translation:
  language: ru
  text: Поэтому[a], если один из них упадёт на землю, он не сможет подняться сам; и если кто-нибудь поставит его стоймя, он сам не сдвинется; а если его наклонят, то уже никак не выпрямить. Но дары[b] кладут перед ними, как перед мёртвыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая конструкция здесь сжата и допускает более буквальное понимание: «как бы не упасть на землю, чтобы подняться самим». Смысл в контексте: упавший идол не способен подняться сам.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приношения». В данном контексте это могут быть дары, подносимые при почитании идолов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τό
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего описания; при этом сноска отмечает сжатость и буквальную форму греческой конструкции.
- source_word: μή ποτε ἐπὶ τὴν γῆν πέσῃ, δι' αὐτῶν ἀνίστασθαι
  choice: если один из них упадёт на землю, сам он подняться не сможет
  rationale: Смысл сжатой греческой фразы — бессилие идола самостоятельно подняться после падения. Единственное число представляет один предмет из всего класса идолов.
- source_word: μήτε ἐὰν τις αὐτὸ ὀρθὸν στήσῃ, δι' ἑαυτοῦ κινηθήσεται
  choice: и если кто-нибудь поставит его прямо, сам он не сдвинется
  rationale: Сохраняется противопоставление внешнего действия человека и неспособности идола к самостоятельному движению.
- source_word: μήτε ἐὰν κλιθῇ, οὐ μὴ ὀρθωθῇ
  choice: а если он наклонится, то уже никак не выпрямится
  rationale: «Наклонится» естественно передаёт κλιθῇ, а «никак не» отражает усиленное отрицание οὐ μή.
- source_word: τὰ δῶρα αὐτοῖς παρατίθεται
  choice: дары ставят перед ними
  rationale: «Дары» сохраняет широкое значение δῶρα; глагольная конструкция по-русски естественно передаёт безлично-пассивный смысл παρατίθεται.
theological_decisions:
- issue: Число и референт местоимений, относящихся к идолам
  choice: В условных предложениях употреблено единственное число для одного типичного идола, а в заключении — множественное число для идолов как класса.
  alternative: Употребить множественное число во всём стихе либо единственное число во всём стихе.
  rationale: Греческий текст переходит между формами в обобщённом описании. Выбранное решение сохраняет этот смысловой переход и остаётся ясным по-русски.
- issue: Сила отрицания οὐ μὴ ὀρθωθῇ
  choice: «уже никак не выпрямится»
  alternative: «не выпрямится» или «не будет выпрямлен»
  rationale: Формулировка передаёт категоричность усиленного греческого отрицания, не добавляя богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировки понятны широкому читателю; сохранены физические образы падения, неподвижности и наклона, а также сравнение идолов с мёртвыми.
