  to: И подобно тому, как для девушки, любящей украшения, берут золото и делают венцы, так и они делают венцы на головы своих богов;
  rationale: Добавлены соотносительные элементы «подобно тому, как … так и», чтобы передать функцию ὥσπερ и устранить ложное синтаксическое присоединение «для девушки» к головам богов. Повтор «делают венцы» — необходимая для русского явная развёртка эллиптического сравнения; существенная лексика и богословски значимое «своих богов» сохранены. Дательный при παρθένῳ остаётся переданным как «для девушки», не навязывая спорного решения о точной конструкции греческой фразы.
