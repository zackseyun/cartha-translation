translation:
  language: ru
  text: И подобно тому, как для девушки, любящей украшения, берут золото и делают венцы, так и они делают венцы на головы своих богов;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ
  choice: как для
  rationale: Вводит сравнение; в сочетании с дальнейшим изготовлением венцов естественно передаёт уподобление украшению девушки, не превращая оборот в новую тему.
- source_word: παρθένῳ
  choice: девушки
  rationale: Передаёт значение «дева, молодая незамужняя женщина» без избыточного акцента на сексуальном статусе; женский образ и возрастная окраска сохраняются.
- source_word: φιλοκόσμῳ
  choice: любящей украшения
  rationale: Передаёт составное прилагательное со значением любви к нарядам и украшениям естественным современным выражением.
- source_word: λαμβάνοντες
  choice: они берут
  rationale: Причастие передано личной глагольной формой для ясного и естественного русского синтаксиса при сохранении последовательности действий.
- source_word: χρυσίον
  choice: золото
  rationale: Прямо передаёт название материала без неподтверждённой конкретизации.
- source_word: κατασκευάζουσιν
  choice: делают
  rationale: Нейтрально передаёт изготовление венцов; «изготавливают» было бы тяжелее, а «устраивают» менее точно в данном контексте.
- source_word: στεφάνους
  choice: венцы
  rationale: Сохраняет значение головного украшения из драгоценного материала и подходит возвышенному библейскому регистру; возможное «короны» было бы более узким.
- source_word: ἐπὶ τὰς κεφαλάς
  choice: на головы
  rationale: Сохраняет конкретную пространственную направленность греческого оборота.
- source_word: τῶν θεῶν αὐτῶν
  choice: своих богов
  rationale: Русское возвратное местоимение естественно соотносит богов с действующими лицами; слово «богов» сохраняет формулировку источника и не заменяется толкованием «идолов».
theological_decisions:
- issue: Передавать θεῶν как «богов» или истолковывать как «идолов»
  choice: своих богов
  alternative: своих идолов
  rationale: Хотя контекст полемически говорит об изображениях, греческий текст употребляет θεῶν. Основной текст сохраняет это обозначение, не подменяя его интерпретацией.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Венцы» сохраняет предметную широту στεφάνους и звучит естественнее в данном регистре, чем разговорное или узко монархическое «короны».
