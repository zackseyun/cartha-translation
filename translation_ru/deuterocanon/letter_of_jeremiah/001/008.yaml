  source_fidelity: Оборот ὥσπερ παρθένῳ φιλοκόσμῳ вводит сравнение с девушкой, любящей украшения; дательный παρθένῳ допускает передачу «для девушки». Однако в русском исходный вариант связывает «для девушки» непосредственно с изготовлением венцов «на головы богов», отчего сравнение читается неясно и почти как утверждение, что венцы богов делают для девушки. Перестройка с соотносительным «так» делает сопоставление явным, не добавляя смыслового толкования.
  naturalness: «И как для девушки … они берут золото и делают венцы на головы…» синтаксически шероховато и семантически двусмысленно. Пара «подобно тому как … так и» естественна для современного литературного русского. «Венцы для голов» также менее естественно, чем «венцы на головы», но последнее следует сохранить как указание на предназначенное возложение.
  terminology: «Девушка, любящая украшения», «золото», «венцы» и «своих богов» приемлемо передают παρθένος, φιλοκόσμος, χρυσίον, στέφανοι и θεῶν αὐτῶν. «Венцы» сохраняет широту στεφάνους; «богов» не подменяет текст истолковательным «идолов».
