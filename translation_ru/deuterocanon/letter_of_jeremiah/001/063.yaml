  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/063.yaml
  text: Therefore they are to be regarded neither as gods nor to be called gods, since they are unable either to judge a case or to do good to people.
translation:
  language: ru
  text: Поэтому их не следует ни считать богами, ни называть богами, ведь они не способны ни вершить суд, ни делать людям добро.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Передаёт вывод, следующий из предшествующего рассуждения, естественным современным русским союзным словом.
- source_word: νομιεῖσθαι
  choice: считать
  rationale: В данном контексте глагол обозначает признание или представление о ком-либо как о боге; «считать богами» звучит ясно и естественно.
- source_word: κλητέον ὑπάρχειν
  choice: не следует… называть богами
  rationale: Оборот выражает должное наименование; конструкция с «не следует» сохраняет нормативный оттенок и образует параллель с «считать богами».
- source_word: θεούς
  choice: богами
  rationale: Прямое и обычное обозначение мнимых языческих богов; более отвлечённое «божествами» здесь не требуется.
- source_word: οὐ δυνατῶν ὄντων αὐτῶν
  choice: ведь они не способны
  rationale: Генитив абсолютный указывает основание сделанного вывода; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: κρίσιν κρῖναι
  choice: вершить суд
  rationale: Однокоренной греческий оборот относится к осуществлению суда или вынесению решения. «Вершить суд» сохраняет судебный смысл и достоинство стиля без неестественного повтора.
- source_word: εὖ ποιεῖν
  choice: делать… добро
  rationale: Передаёт обычное значение греческого выражения — делать добро, приносить пользу — без сужения смысла до одной лишь практической выгоды.
- source_word: ἀνθρώποις
  choice: людям
  rationale: Дательный множественного числа обозначает людей вообще; «людям» — точный и естественный родо-нейтральный эквивалент.
theological_decisions:
- issue: Отрицание божественного статуса идолов
  choice: их не следует ни считать богами, ни называть богами
  alternative: их нельзя ни признавать богами, ни именовать богами
  rationale: Перевод сохраняет двойное отрицание — как признания статуса, так и соответствующего наименования, — не добавляя отсутствующего в тексте метафизического объяснения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и умеренно библейским звучанием. Параллельная конструкция «ни… ни…» сохраняет риторическую силу оригинала; «вершить суд» уместно в полемическом контексте и понятно современному читателю.
