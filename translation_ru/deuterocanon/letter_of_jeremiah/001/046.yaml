lexical_decisions:
- source_word: αὐτοί τε
  choice: И сами те
  rationale: Сочетание передаёт соединительную силу τε и эмфатическое αὐτοί, подчёркивающее, что речь идёт о самих изготовителях идолов.
- source_word: οἱ κατασκευάσαντες
  choice: кто сделал
  rationale: Аористное причастие обозначает изготовителей идолов; «сделал» ясно и естественно передаёт создание рукотворных изображений.
- source_word: αὐτά
  choice: их
  rationale: Местоимение отсылает к упомянутым в контексте идолам.
- source_word: οὐ μὴ γένωνται
  choice: вовсе не будут
  rationale: Конструкция οὐ μή с сослагательным наклонением выражает усиленное отрицание будущей возможности; «вовсе не» сохраняет эту эмфазу.
- source_word: πολυχρόνιοι
  choice: долговечны
  rationale: Предикативное прилагательное означает «живущие долго, долговечные»; краткая форма естественно сочетается с «будут» и сохраняет сопоставление смертных мастеров с их изделиями.
