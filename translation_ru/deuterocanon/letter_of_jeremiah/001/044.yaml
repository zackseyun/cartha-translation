  text: Everything that happens to them is false[a]; how then should one suppose or call them gods?
translation:
  language: ru
  text: Всё, что происходит с ними, ложно; как же тогда можно считать или называть их богами?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом в конце прямо стоит инфинитив со значением «быть, существовать»; дословная передача этой конструкции по-русски была бы тяжеловесной.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ γενόμενα αὐτοῖς
  choice: Всё, что происходит с ними
  rationale: Оборот охватывает всё происходящее с идолами или относящееся к ним, не уточняя действующее лицо. Русское «происходит с ними» естественно передаёт широту и неоднозначность греческого выражения.
- source_word: ψευδῆ
  choice: ложно
  rationale: Предикативное прилагательное характеризует всё упомянутое как ложное, ненастоящее или обманчивое. «Ложно» кратко и не усиливает смысл до прямого обвинения во лжи.
- source_word: πῶς οὖν
  choice: как же тогда
  rationale: Передаёт и вывод из предыдущего утверждения, и риторический характер вопроса современным русским языком.
- source_word: νομιστέον
  choice: можно считать
  rationale: Безличное отглагольное прилагательное выражает то, что следует или допустимо полагать; в отрицательном риторическом вопросе естественно звучит «как можно считать».
- source_word: κλητέον
  choice: или называть
  rationale: 'Сохраняет параллель между внутренним признанием и внешним именованием: «считать или называть».'
- source_word: ὡς θεοὺς αὐτοὺς ὑπάρχειν
  choice: их богами
  rationale: По-русски сочетание «считать или называть их богами» естественно передаёт, что им приписывается бытие или статус богов. Наличие в греческом отдельного глагола ὑπάρχειν отмечено в сноске, чтобы не скрывать экзистенциальный оттенок.
theological_decisions:
- issue: Отрицание божественного бытия или статуса идолов
  choice: Основной текст говорит, что идолов нельзя считать или называть богами.
  alternative: «Как же тогда можно считать или говорить, что они существуют как боги?»
  rationale: Греческое ὑπάρχειν допускает более явное указание на существование, однако в данной конструкции естественный русский оборот «считать их богами» уже включает приписывание им реального статуса богов. Сноска сохраняет экзистенциальный оттенок, не превращая стих в более широкое метафизическое утверждение.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос звучит ясно и достойно. Сохранена смысловая напряжённость между «называть богами» и явным греческим указанием на бытие или существование.
