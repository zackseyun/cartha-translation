revisions:
- from: И сами они не способны осознать это и оставить их[a], потому что лишены способности понимать.
  to: И сами они не могут[a], хотя и понимают, оставить их, ибо не обладают способностью воспринимать.
  rationale: Редакция сохраняет эмфатическое «сами они», не уточняет невыраженные референты и передаёт вероятный уступительный оттенок νοήσαντες. Напряжение между «хотя и понимают» и отсутствием способности воспринимать оставлено, поскольку оно присутствует в греческой формулировке; альтернативное, более буквальное прочтение дано в примечании.
