  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/041.yaml
  text: And they themselves cannot[a], even though they perceive it, leave them behind, for they have no perception.
translation:
  language: ru
  text: И сами они не могут[a], хотя и понимают, оставить их, ибо не обладают способностью воспринимать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не могут, поняв, оставить их»; греческое причастие νοήσαντες можно передать более буквально, хотя в контексте оно, вероятно, имеет уступительный смысл.'
    reason: Сохранение синтаксической неоднозначности греческого причастия.
lexical_decisions:
- source_word: οὐ δύνανται
  choice: не способны
  rationale: Передаёт выраженную глаголом δύναμαι неспособность и естественно связывает два последующих действия.
- source_word: αὐτοὶ
  choice: сами они
  rationale: Сохраняет эмфатический характер местоимения. В ближайшем контексте речь идёт о людях, обращающихся к идолу, а не о самих идолах.
- source_word: νοήσαντες
  choice: осознать это
  rationale: Причастие от νοέω обозначает понимание или осознание. По смыслу оно входит в сферу отрицания при οὐ δύνανται; «это» проясняет подразумеваемый объект — бессилие идола — не меняя содержания.
- source_word: καταλιπεῖν
  choice: оставить
  rationale: Сохраняет основное значение «покинуть, оставить»; здесь имеется в виду отказ от идолов.
- source_word: αὐτά
  choice: их
  rationale: Местоимение среднего рода во множественном числе относится к идолам; русское «их» сохраняет краткость оригинала.
- source_word: αἴσθησιν οὐκ ἔχουσιν
  choice: лишены способности понимать
  rationale: Передаёт отсутствие восприятия и разумения как устойчивой способности, что объясняет неспособность говорящих распознать бессилие идолов.
theological_decisions:
- issue: К кому относится αὐτοὶ
  choice: К людям, которые обращаются к идолу
  alternative: К самим идолам
  rationale: В ближайшем контексте подлежащее — люди, приводящие к Вилу немого и просящие даровать ему речь. Именно они не распознают противоречия и не оставляют идолов. Такое прочтение следует контексту и не приписывает идолам подразумеваемого понимания.
- issue: Синтаксическая роль νοήσαντες
  choice: 'Смысловое действие под отрицательной модальностью: «не способны осознать… и оставить»'
  alternative: 'Уступительное прочтение: «не могут, хотя и понимают, оставить»; либо более буквальное: «не могут, поняв, оставить»'
  rationale: Буквальная форма причастия допускает разные синтаксические оттенки, однако последующая причина «лишены способности понимать» поддерживает прочтение, при котором неспособность распространяется и на осознание. Альтернатива сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и сдержанно торжественная. Избегаются архаизмы и конфессионально окрашенные термины. Повтор корня со значением понимания отражает смысловую связь νοέω и αἴσθησις, но передан разными конструкциями ради естественности.
