translation:
  language: ru
  text: Они никогда не проявят милосердия к вдове[a] и не сделают добра сироте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни за что не пожалеют вдову». В греческом тексте употреблено усиленное отрицание οὐ μή.'
    reason: lexical_alternative
