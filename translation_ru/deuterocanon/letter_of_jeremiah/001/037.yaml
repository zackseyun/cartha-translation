    reason: lexical_alternative
lexical_decisions:
- source_word: χήραν
  choice: к вдове
  rationale: Форма χήραν — винительный падеж единственного числа от χήρα. В русском языке при глагольном сочетании «проявить милосердие к» естественно требуется дательный падеж; единственное число сохраняет собирательно-представительный смысл греческого текста.
- source_word: οὐ μὴ ἐλεήσωσιν
  choice: никогда не проявят милосердия
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание. «Никогда не» передаёт его категоричность, а «проявят милосердие» сохраняет нравственно-религиозный оттенок глагола ἐλεέω.
- source_word: οὔτε
  choice: и не
  rationale: οὔτε присоединяет второе отрицательное высказывание к первому. В данном русском предложении «и не» звучит естественнее отдельного «ни», не ослабляя параллелизма.
- source_word: ὀρφανῷ
  choice: сироте
  rationale: ὀρφανῷ — дательный падеж единственного числа от ὀρφανός, обозначающего сироту или ребёнка, оставшегося без отца. «Сироте» — ясный современный эквивалент, сохраняющий число и падеж исходного текста.
- source_word: εὖ ποιήσουσιν
  choice: сделают добра
  rationale: Оборот εὖ ποιέω буквально означает «делать добро», «благодетельствовать», «приносить пользу». Выражение «сделают добра» сохраняет глагольную структуру и нравственный смысл оригинала.
theological_decisions:
- issue: Передача традиционной пары χήρα / ὀρφανός, обозначающей социально уязвимых людей
  choice: вдова / сирота
  alternative: вдова / оставшийся без отца
  rationale: '«Вдова / сирота» — понятная современному читателю библейская пара. Она сохраняет обличительный смысл стиха: идолы неспособны оказать милость и помощь уязвимым. Возможный более узкий смысл ὀρφανός отмечен в сноске, а не навязан основному тексту.'
translation_notes:
  register: Современный литературный русский язык; строй фразы простой и достоинственный. Усиленное отрицание передано словом «никогда», параллелизм двух отрицательных частей сохранён. Все сноски привязаны к соответствующим словам основного текста.
