  text: For when war and calamities come upon them[a], the priests consult among themselves where they may hide with them.
translation:
  language: ru
  text: Ведь когда на них[a] обрушатся война и бедствия, жрецы совещаются между собой, где бы спрятаться вместе с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть на идолов или их изображения, о которых говорится в окружающем отрывке.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: Передаёт общую будущую ситуацию; в русском контексте естественно выражает повторяющийся возможный случай.
- source_word: ἐπέλθῃ ἐπʼ αὐτά
  choice: на них обрушатся
  rationale: Сохраняет направленность действия против упомянутых предметов и уместно сочетается с войной и бедствиями.
- source_word: πόλεμος
  choice: война
  rationale: Прямое и контекстуально подходящее соответствие, обозначающее более широкое военное бедствие, а не отдельное сражение.
- source_word: κακά
  choice: бедствия
  rationale: В данном контексте речь идёт о пагубных событиях, а не о нравственном зле; слово сохраняет литературное достоинство и понятно современному читателю.
- source_word: βουλεύονται πρὸς ἑαυτούς
  choice: совещаются между собой
  rationale: Естественно передаёт взаимное обсуждение жрецов, выраженное медиальной формой и оборотом πρὸς ἑαυτούς.
- source_word: ποῦ
  choice: где
  rationale: Прямо вводит содержание совещания о месте укрытия.
- source_word: συγκαρυβῶσι μετʼ αὐτῶν
  choice: где бы спрятаться вместе с ними
  rationale: Редкий глагол указывает на сокрытие, а приставка σύν и μετʼ αὐτῶν подчёркивают совместность; русская возвратная форма «спрятаться» естественно сохраняет этот смысл.
theological_decisions:
- issue: Референт αὐτά / αὐτῶν
  choice: Сохранить местоимения «них / ними» в основном тексте, пояснив, что речь об идолах или изображениях, в сноске.
  alternative: Прямо заменить местоимения словом «идолы» в основном тексте.
  rationale: Греческий текст оставляет референт местоименным, хотя ближайший контекст ясно указывает на идолов. Такое решение сохраняет форму и иронию оригинала, не внося пояснение непосредственно в стих.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Жрецы» выбрано вместо «священники», поскольку речь идёт о служителях языческих идолов. Частица «ведь» передаёт объяснительное γὰρ; конструкция «где бы спрятаться» естественно выражает косвенный вопрос и целевой оттенок.
