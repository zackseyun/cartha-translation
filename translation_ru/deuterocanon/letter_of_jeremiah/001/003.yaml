  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/003.yaml
  text: But now in Babylon you will see gods of silver and gold and wood[a], being carried on shoulders, showing fear to the nations.
translation:
  language: ru
  text: Теперь же в Вавилоне вы увидите богов — серебряных, золотых и деревянных, — которых несут на плечах и которые являют народам страх[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внушают страх народам», «наводят страх на народы». Буквально по-гречески: «являют (показывают) народам страх»; выражение может описывать как само устрашающее зрелище, так и его воздействие на людей.'
    reason: Лексическая неоднозначность выражения δεικνύντας φόβον τοῖς ἔθνεσιν.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Теперь же
  rationale: «Теперь» передаёт усиленное νυνί, а частица «же» сохраняет переходно-противительный оттенок δέ без излишне резкого «но».
- source_word: ὄψεσθε
  choice: вы увидите
  rationale: Форма будущего времени от ὁράω имеет здесь прямое предсказательное значение.
- source_word: ἐν Βαβυλῶνι
  choice: в Вавилоне
  rationale: Обычное и точное выражение местного значения.
- source_word: θεοὺς
  choice: богов
  rationale: Перевод сохраняет употреблённое в греческом тексте слово «боги» и заключённую в контексте иронию; замена на «идолов» заранее внесла бы оценку переводчика.
- source_word: ἀργυροῦς καὶ χρυσοῦς καὶ ξυλίνους
  choice: серебряных, золотых и деревянных
  rationale: Прилагательные прямо обозначают материал и естественно образуют в русском языке трёхчастный ряд.
- source_word: ἐπʼ ὤμων αἰρομένους
  choice: которых несут на плечах
  rationale: Развёрнутая относительная конструкция ясно передаёт страдательный смысл причастия и образ переносимых культовых изображений.
- source_word: δεικνύντας φόβον
  choice: являют … страх
  rationale: Несколько сжатая формулировка сохраняет буквальную связь «показывать/являть страх», не сводя её безоговорочно к причинению страха; более естественные причинительные варианты приведены в примечании.
- source_word: τοῖς ἔθνεσιν
  choice: народам
  rationale: Дательный множественного числа передан без добавления конфессионально окрашенного значения «язычникам».
theological_decisions:
- issue: Передавать ли θεοὺς словом «боги» или оценочным словом «идолы»
  choice: боги
  alternative: идолы
  rationale: Исходный текст называет изображения «богами»; сохранение этого обозначения не устраняет иронию и позволяет последующему контексту самому раскрыть полемический смысл.
- issue: Как передать неоднозначное δεικνύντας φόβον
  choice: являют народам страх
  alternative: внушают страх народам; наводят страх на народы
  rationale: Основной текст сохраняет необычную и семантически напряжённую греческую формулировку, а примечание сообщает вероятное причинительное понимание, не выдавая его за единственно возможное.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Относительные конструкции делают длинную греческую причастную фразу понятной, а тире выделяют перечень материалов без изменения синтаксической связи.
