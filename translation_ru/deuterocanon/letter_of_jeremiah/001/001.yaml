lexical_decisions:
- source_word: Διὰ τὰς ἁμαρτίας ὑμῶν
  choice: За грехи ваши
  rationale: διά с винительным выражает причину. «За грехи ваши» естественно передаёт основание грядущего наказания и сохраняет торжественный библейский строй без архаизма.
- source_word: ἃς ἡμαρτήκατε
  choice: которыми вы согрешили
  rationale: Греческая однокоренная конструкция буквально повторяет понятие греха. Русское «грехи… которыми вы согрешили» необычно, но понятно и сохраняет риторическое усиление оригинала.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: против Бога
  rationale: В контексте нравственной вины выражение обозначает направленность проступка против Бога, а не просто совершение чего-либо перед Ним.
- source_word: ἀχθήσεσθε
  choice: вы будете уведены
  rationale: Будущее страдательного залога от ἄγω в контексте насильственного переселения означает, что адресатов уведут; такой вариант точен и естествен по-русски.
- source_word: εἰς Βαβυλῶνα
  choice: в Вавилон
  rationale: εἰς обозначает направление и место назначения; «в Вавилон» — естественный русский эквивалент.
- source_word: αἰχμάλωτοι
  choice: пленниками
  rationale: Именная часть характеризует состояние адресатов при их насильственном отведении. Творительный «пленниками» сохраняет множественное число и смысл плена.
- source_word: ὑπὸ Ναβουχοδονοσὸρ
  choice: Навуходоносором
  rationale: ὑπό при страдательном глаголе обозначает действующее лицо; русский творительный передаёт эту функцию.
- source_word: βασιλέως τῶν Βαβυλωνίων
  choice: царём вавилонян
  rationale: Перевод сохраняет этническую формулировку оригинала — «царь вавилонян», а не заменяет её географическим «царь Вавилона».
theological_decisions:
- issue: Однокоренное повторение ἁμαρτίας … ἡμαρτήκατε
  choice: Сохранить как «грехи… которыми вы согрешили»
  alternative: «грехи, которые вы совершили»
  rationale: Повтор в оригинале подчёркивает личную виновность адресатов. Хотя буквальная конструкция несколько необычна по-русски, она остаётся понятной; более гладкий вариант указан в сноске.
- issue: Значение ἐναντίον τοῦ θεοῦ
  choice: «против Бога»
  alternative: «перед Богом» / «в глазах Бога»
  rationale: Нравственный контекст греха и последующего наказания поддерживает значение противления Богу, при этом перевод не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены причинная связь, пассивная форма насильственного переселения, множественное «пленниками» и намеренное однокоренное повторение оригинала; сноска предлагает более гладкий русский вариант.
