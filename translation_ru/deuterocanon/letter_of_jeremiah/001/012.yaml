  text: They wipe off their faces because of the dust from the house[a], which is thick upon them.
translation:
  language: ru
  text: Им вытирают лица из-за пыли из дома, которая толстым слоем лежит на них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которой на них больше», то есть пыль скопилась на них в большом количестве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκμάσσονται
  choice: им вытирают
  rationale: 'Средне-пассивная форма в контексте насмешки над беспомощными идолами естественно передаётся русским пассивом: лица идолов вытирают служители. Это не создаёт ложного впечатления, будто идолы действуют сами.'
- source_word: τὸ πρόσωπον αὐτῶν
  choice: лица
  rationale: Греческое единственное число при местоимении множественного числа по-русски естественно передать множественным «лица», поскольку речь идёт о лицах нескольких идолов.
- source_word: διὰ τὸν ... κονιορτόν
  choice: из-за пыли
  rationale: Предлог διά с винительным имеет причинное значение, а κονιορτός обозначает именно пыль.
- source_word: ἐκ τῆς οἰκίας
  choice: в доме
  rationale: Буквально оборот указывает на пыль «из дома», то есть находящуюся и накопившуюся внутри здания. Русское «пыль в доме» ясно передаёт источник и обстановку, не вводя отсутствующих в тексте слов «храм» или «святилище».
- source_word: ὃς ἐστιν πλείω ἐπʼ αὐτοῖς
  choice: которая толстым слоем лежит на них
  rationale: Сравнительная форма πλείω буквально означает «больше», но здесь выражает большое количество пыли на идолах. «Толстым слоем лежит» естественно передаёт образ, а буквальная особенность отмечена в сноске.
theological_decisions:
- issue: К кому относятся местоимения множественного числа и кто совершает действие
  choice: Местоимения относятся к идолам; их лица вытирают другие люди.
  alternative: Формально среднюю форму можно было бы передать так, словно идолы сами вытирают себе лица.
  rationale: Контекст сатиры изображает идолов беспомощными предметами, нуждающимися в человеческом уходе. Пассивная конструкция сохраняет эту мысль, не приписывая им самостоятельного действия.
translation_notes:
  register: Современный литературный русский язык; конкретный и сдержанный образ сохранён. «Дом» оставлен вместо более толковательных «храм» или «святилище». Маркер сноски поставлен после относящейся к ней части стиха.
