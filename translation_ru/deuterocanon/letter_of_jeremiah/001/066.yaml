  source_fidelity: Переданы все три отрицательных утверждения, усиленное οὐ μή, а также различие между «явить знамения», «сиять» и «светить». Подлежащее «они» правомерно восстановлено из контекста. Перестановка обстоятельств в исправленном тексте сохраняет их при глаголе «явить», не превращая народы в адресатов и не устраняя синтаксическую неоднозначность греческого текста.
  naturalness: Оборот «среди народов на небе» в исходном порядке по-русски создаёт неестественное и почти неизбежное впечатление, будто народы находятся на небе. Вариант «среди народов никаких знамений на небе» ясно и литературно выражает оба обстоятельства. «Уж точно» имеет разговорный оттенок; «никаких» естественно передаёт усиленное будущее отрицание в современном литературном русском.
  terminology: «Знамения» уместно для σημεῖα и сохраняет библейский регистр без навязывания значения «предзнаменования». «На небе», «солнце», «луна», «сиять» и «светить» точны и естественны. Сноска корректно отмечает лексическую возможность «в небесах».
