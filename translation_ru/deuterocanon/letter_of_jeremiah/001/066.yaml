  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/066.yaml
  text: They will certainly not show signs in the heavens among the nations[a], nor will they shine like the sun, nor give light like the moon.
translation:
  language: ru
  text: И они не явят среди народов никаких знамений на небе[a], не засияют, как солнце, и не будут светить, как луна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в небесах». Греческое οὐρανός может обозначать как небо в возвышенном смысле, так и видимое небо; здесь речь идёт о небесных явлениях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖά
  choice: знамения
  rationale: Слово σημεῖον обозначает знак или знамение; «знамения» естественно передаёт здесь речь о небесных явлениях, не сужая смысл до зловещих предзнаменований.
- source_word: ἐν ἔθνεσιν
  choice: среди народов
  rationale: ἔθνη в Септуагинте обычно означает народы; этот вариант естественен по-русски и не вносит более узкого значения «язычники».
- source_word: ἐν οὐρανῷ
  choice: на небе
  rationale: οὐρανός может означать небо как небесную сферу или видимое небо; «на небе» естественно в контексте знамений, солнца и луны, а неоднозначность отмечена в сноске.
- source_word: οὐ μὴ δείξωσιν
  choice: уж точно не явят
  rationale: Сочетание οὐ μή с сослагательным наклонением выражает усиленное отрицание; «уж точно не» ясно и естественно передаёт его силу.
- source_word: λάμψουσιν
  choice: засияют
  rationale: Глагол означает сиять; совершенный вид с отрицанием естественно передаёт будущую форму и сравнение с солнцем.
- source_word: φωτιοῦσιν
  choice: будут светить
  rationale: Перевод сохраняет отличие от λάμψουσιν («засияют») и естественно описывает свет луны.
- source_word: σελήνη
  choice: луна
  rationale: Обычное русское обозначение соответствующего небесного тела.
theological_decisions:
- issue: Подлежащее глаголов во множественном числе
  choice: Местоимение «они» сохраняет подразумеваемую из контекста отсылку к идолам.
  alternative: 'Прямо назвать подлежащее: «идолы».'
  rationale: В греческом стихе подлежащее не названо и переносится из контекста; местоимение не расширяет и не уточняет текст сверх необходимого.
- issue: Связь обстоятельств ἐν ἔθνεσιν и ἐν οὐρανῷ
  choice: 'Сохранены оба обстоятельства без попытки снять возможную синтаксическую неловкость: «среди народов на небе».'
  alternative: Перестроить как «не явят народам знамений на небе» или «не явят среди народов небесных знамений».
  rationale: Греческая последовательность допускает некоторую неоднозначность связи; буквальная близость не позволяет без основания сделать народы адресатами знамений или превратить «на небе» в определение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским словом «знамения». Усиленное отрицание передано разговорно нейтральным оборотом «уж точно», а параллелизм солнца и луны сохранён.
