  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/033.yaml
  text: Whether they suffer some harm from anyone or receive some good[a], they will not be able to repay it[b]; they cannot set up a king or remove one.
translation:
  language: ru
  text: Причинит ли им кто-нибудь какое-нибудь зло или окажет им добро, они не смогут воздать тем же[a]; они не могут ни поставить царя, ни отстранить его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол означает дать в ответ, отплатить — как за зло, так и за добро.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поставить царя или убрать [его]».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε ἐὰν ... οὔτε ἐὰν
  choice: Потерпят ли ... или получат
  rationale: Парная условная конструкция естественно передаётся по-русски через «ли ... или», сохраняя две противопоставленные возможности.
- source_word: κακόν τι πάθωσιν ὑπό τινος
  choice: потерпят ... от кого-нибудь зло
  rationale: Оборот обозначает неблагоприятное воздействие со стороны неопределённого лица; «потерпеть зло» сохраняет пассивный смысл πάσχω и звучит литературно.
- source_word: ἀγαθόν
  choice: получат добро
  rationale: В эллиптической второй части подразумевается переживание чего-либо доброго. «Получат добро» естественно противопоставлено «потерпят зло» и не сужает смысл до конкретного благодеяния.
- source_word: δυνήσονται ἀνταποδοῦναι
  choice: не смогут воздать
  rationale: ἀνταποδίδωμι означает дать в ответ, как за причинённое зло, так и за сделанное добро. «Воздать» сохраняет эту двусторонность и не требует добавления отсутствующего в греческом объектного местоимения.
- source_word: καταστῆσαι βασιλέα
  choice: поставить царя
  rationale: καθίστημι здесь означает установить или назначить царя. «Поставить царя» кратко и ясно передаёт политический смысл.
- source_word: ἀφελέσθαι
  choice: отстранить его
  rationale: Глагол означает убрать или лишить положения; дополнение «его» восстанавливает подразумеваемого царя, не усиливая значение до однозначного «свергнуть».
theological_decisions:
- issue: Объём утверждения о бессилии идолов
  choice: Идолы не способны ответить ни за причинённое им зло, ни за сделанное им добро, а также не способны поставить или отстранить царя.
  alternative: Отнести «воздать» только к причинённому злу либо передать политическую формулу как «назначить царя или лишить его власти».
  rationale: Греческая парная конструкция связывает невозможность ответного действия с обеими ситуациями, а заключительная часть распространяет полемику на политическую власть. Перевод сохраняет широту утверждения без дополнительных богословских выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для широкого читателя; сохранены противопоставление зла и добра, смена будущей формы на настоящее время и лаконизм политической формулы.
