  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/034.yaml
  text: Likewise[a], they are certainly not able to give either wealth or bronze; if someone makes a vow to them and does not pay it back[b], they will certainly not seek it.
translation:
  language: ru
  text: Точно так же они никак не могут дать ни богатства, ни бронзы[a]. Если кто-нибудь даст им обет и не исполнит его, они ни за что не станут требовать его исполнения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «меди»; возможно, имеются в виду деньги или другие ценности из этого металла.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не станут искать его»; также возможно: «не станут добиваться этого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: Так же и
  rationale: Связывает этот пример с предшествующими доводами; по-русски естественно передаёт значение «подобным образом».
- source_word: πλοῦτον
  choice: богатства
  rationale: Передаёт общее значение материального достатка, не сужая его до денег.
- source_word: χαλκὸν
  choice: бронзы
  rationale: Сохраняет прямое обозначение металла; возможное значение «медь» отмечено в сноске.
- source_word: οὐ μὴ δύνωνται δοῦναι
  choice: никак не могут дать
  rationale: Частица «никак» естественно передаёт усиленное отрицание οὐ μή без тяжеловесности.
- source_word: ἐάν τις αὐτοῖς εὐχὴν εὐξάμενος
  choice: Если кто-нибудь даст им обет
  rationale: Когнатная конструкция εὐχὴν εὐξάμενος идиоматически означает принесение обета.
- source_word: μὴ ἀποδῷ
  choice: не исполнит его
  rationale: В сочетании с обетом ἀποδίδωμι означает выполнить, исполнить обещанное; буквальное «не отдаст» по-русски было бы неясно.
- source_word: οὐ μὴ ἐπιζητήσωσιν
  choice: ни за что не станут требовать его исполнения
  rationale: Передаёт усиленное отрицание и контекстуальный смысл ἐπιζητέω — добиваться или требовать исполнения; буквальное значение отмечено в сноске.
theological_decisions:
- issue: Бессилие идолов в отношении материальных благ и обетов
  choice: Идолы не способны ни даровать материальные блага, ни потребовать исполнения данного им обета.
  alternative: 'Заключительную фразу можно понять более буквально: «они не станут искать его».'
  rationale: Контекст изображает идолов бессильными, но перевод не развивает эту мысль сверх сказанного в греческом тексте; буквальная многозначность глагола сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и достойный. Усиленное отрицание οὐ μή передано естественными русскими средствами «никак» и «ни за что». Местоименные связи раскрыты там, где буквальное воспроизведение могло бы вызвать неясность.
