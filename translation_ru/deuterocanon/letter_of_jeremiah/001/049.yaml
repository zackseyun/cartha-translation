  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/049.yaml
  text: How then can one fail to perceive that they are not gods[b][a], since they neither save themselves from war nor from calamities?
translation:
  language: ru
  text: Как же можно не понять, что они не боги, ведь они не спасают самих себя ни от войны, ни от бедствий?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни от войны, ни от зол (бед)». Греческое κακῶν (от κακόν) здесь может означать зло, беды, несчастья или губительные события.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν οὐκ ἔστιν αἰσθέσθαι
  choice: Как же можно не понять
  rationale: Сохраняет риторическое отрицание и выводное значение οὖν, естественно передавая очевидность заключения по-русски.
- source_word: ὅτι οὐκ εἰσὶν θεοί
  choice: что они не боги
  rationale: Прямо воспроизводит полемическое утверждение греческого текста, не подменяя θεοί словом «идолы».
- source_word: οἳ
  choice: если они
  rationale: В данном контексте относительное предложение обосновывает вывод; «если они» естественно выражает довод, не усиливая его до более однозначного причинного союза.
- source_word: οὔτε σώζουσιν ἑαυτοὺς
  choice: они не спасают самих себя ни
  rationale: 'Передаёт значение σώζω и подчёркнутую иронию: мнимые боги неспособны спасти даже себя.'
- source_word: ἐκ πολέμου
  choice: от войны
  rationale: Прямой и естественный эквивалент широкого значения πόλεμος.
- source_word: οὔτε ἐκ κακῶν
  choice: ни от бедствий
  rationale: Здесь κακά обозначает губительные события или несчастья; «бедствия» передаёт конкретный контекстуальный смысл, не сводя выражение к нравственному злу.
theological_decisions:
- issue: Значение θεοί в полемике против идолопоклонства
  choice: «не боги»
  alternative: «не божества» или парафраз «всего лишь идолы»
  rationale: Греческий текст сам отрицает их божественность. Буквальное «боги» сохраняет форму и богословскую остроту утверждения без пояснительной подмены.
- issue: Логическая связь οἳ с главным утверждением
  choice: «если они»
  alternative: «ведь они» или «поскольку они»
  rationale: Условная русская конструкция естественно представляет их неспособность к самоспасению как очевидное доказательство, сохраняя некоторую гибкость относительного греческого оборота.
translation_notes:
  register: Современный литературный русский язык; риторический, полемический и достойный регистр. Конструкция звучит ясно для широкого читателя и сохраняет отрицательную риторическую форму оригинала.
