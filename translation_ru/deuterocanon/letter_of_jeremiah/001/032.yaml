lexical_decisions:
- source_word: ἀπὸ τοῦ ἱματισμοῦ αὐτῶν ἀφελόμενοι
  choice: Сняв с них одежды
  rationale: 'Аористное причастие передаёт действие, предшествующее основному: жрецы снимают с идолов составляющие их убранство одежды. Русская конструкция сохраняет местоимение αὐτῶν и естественно передаёт отделение, выраженное ἀπό.'
- source_word: οἱ ἱερεῖς
  choice: жрецы
  rationale: В контексте служителей языческих идолов современное русское «жрецы» точнее, чем «священники», и не вызывает неуместных ассоциаций с иудейским или христианским священством.
- source_word: ἐνδύουσιν
  choice: одевают в них
  rationale: Глагол означает надевать одежду на кого-либо. Добавленное «в них» естественно указывает, что снятые с идолов одежды используются для семей жрецов; это следует из синтаксической связи двух действий.
- source_word: τὰς γυναῖκας αὐτῶν
  choice: своих жён
  rationale: Возвратное притяжательное «своих» в русском языке естественно соотносит жён с подлежащим «жрецы» и не вносит дополнительного эмфазиса.
- source_word: τὰ παιδία
  choice: детей
  rationale: Нейтральное и широкое обозначение детей без неоправданного уточнения возраста или пола.
theological_decisions:
- issue: Референт αὐτῶν в выражении о снятых одеждах
  choice: Сохранено местоимение «с них», а в сноске пояснено, что речь об идолах.
  alternative: 'Передать непосредственно: «сняв одежды с идолов».'
  rationale: Греческий текст употребляет местоимение, тогда как окружающий контекст определяет его референт. Основной текст сохраняет форму источника и его связность, не жертвуя ясностью благодаря сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Жрецы» выбрано для ясного обозначения служителей языческого культа. Формулировка краткая и сохраняет последовательность действий греческого текста.
