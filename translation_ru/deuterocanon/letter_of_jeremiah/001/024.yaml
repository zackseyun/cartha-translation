    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πάσης τιμῆς
  choice: за какую угодно цену
  rationale: Оборот буквально связывает приобретение со «всякой ценой». Русское «за какую угодно цену» естественно передаёт готовность платить требуемую цену, не уточняя её величину и не вводя отсутствующего в тексте значения «очень дорого».
- source_word: ἠγορασμένα
  choice: покупают
  rationale: Причастие перфекта страдательного залога от ἀγοράζω представляет идолов как товар, который приобретают за плату. Настоящее время с неопределённо-личной конструкцией естественно по-русски выражает это общее положение; торговый смысл глагола сохранён.
- source_word: πνεῦμα
  choice: дыхание
  rationale: В полемике против идолов речь прежде всего об отсутствии признака жизни. «Дыхание» конкретно передаёт эту мысль, тогда как допустимое значение «дух» сохранено в сноске.
- source_word: ἐν οἷς
  choice: в них
  rationale: Местоимение относится к идолам; «в них» точно и естественно передаёт греческую предложную конструкцию.
theological_decisions:
- issue: Значение πνεῦμα применительно к идолам
  choice: дыхание
  alternative: дух
  rationale: «Дыхание» подчёркивает безжизненность идолов и не усиливает фразу до отвлечённого онтологического утверждения. Поскольку πνεῦμα также может означать «дух», эта смысловая возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Разговорная резкость и церковнославянизмы исключены. Противопоставление передано простым союзом «но».
