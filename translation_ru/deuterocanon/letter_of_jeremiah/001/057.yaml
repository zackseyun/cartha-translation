lexical_decisions:
- source_word: οἱ ἰσχύοντες
  choice: сильные
  rationale: Субстантивированное причастие обозначает людей, обладающих силой или властью. «Сильные» кратко и прямо сохраняет форму и смысл греческого выражения.
- source_word: περιελοῦνται
  choice: снимут
  rationale: Глагол означает снять или удалить то, что находится вокруг или на предмете; в контексте речь идёт об украшениях идолов.
- source_word: τὸ χρυσίον καὶ τὸ ἀργύριον
  choice: золото и серебро
  rationale: Греческий текст не содержит притяжательного местоимения, поэтому оно не добавлено и в переводе.
- source_word: τὸν ἱματισμὸν τὸν περικείμενον αὐτοῖς
  choice: надетое на них одеяние
  rationale: ἱματισμός обозначает одежду или одеяние, а περικείμενον — находящееся вокруг них, на них. «Надетое на них одеяние» естественно по-русски передаёт зримый образ облачённых идолов.
- source_word: ἀπελεύσονται ἔχοντες
  choice: уйдут, унося
  rationale: Сопутствующее причастие показывает, что грабители уходят, забрав одеяние с собой. Эта конструкция сохраняет и движение, и обладание похищенным.
- source_word: οὔτε ἑαυτοῖς οὐ μὴ βοηθήσωσιν
  choice: сами же они ни в коем случае себе не помогут
  rationale: Сочетание οὐ μή выражает усиленное отрицание с будущим значением. Рефлексивное ἑαυτοῖς указывает, что идолы не смогут помочь самим себе.
theological_decisions:
- issue: К кому относится заключительная фраза
  choice: Она относится к идолам, которые не помогут самим себе.
  alternative: Её можно понимать шире как общее утверждение об их беспомощности.
  rationale: В ближайшем контексте местоимения относятся к идолам, а ἑαυτοῖς прямо выражает возвратное значение. Перевод сохраняет направленность фразы на их неспособность защитить себя, не расширяя утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Одеяние» выбрано вместо разговорного «одежда» как естественное обозначение облачения культовых изображений; синтаксис остаётся ясным для современного читателя.
