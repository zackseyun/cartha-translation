  text: From them the strong will strip away the gold and the silver[a], and they will go off with the clothing that is wrapped around them[b]; yet they certainly will not help themselves.
translation:
  language: ru
  text: С них сильные[a] снимут золото и серебро и уйдут, унося одеяние, надетое на них; но сами идолы ни в коем случае не помогут самим себе[b].
