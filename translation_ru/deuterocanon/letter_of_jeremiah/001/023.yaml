  text: For the gold with which they are adorned for beauty—unless someone wipes off the rust—it will certainly not shine; for not even when they were being cast did they perceive it.
translation:
  language: ru
  text: Ведь золото, которым их украшают для красоты, если кто-нибудь не сотрёт с него ржавчину, вовсе не будет блестеть; ибо они и тогда, когда их отливали, этого не сознавали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιτίθενται εἰς κάλλος
  choice: которым их украшают для красоты
  rationale: Передаёт нанесение золота на идолов ради внешней красоты, не вводя более узкого технического способа отделки.
- source_word: ἐκμάξῃ τὸν ἰόν
  choice: сотрёт с него ржавчину
  rationale: ἰός обозначает ржавчину или коррозийный налёт; «сотрёт» точно передаёт физическое очищение поверхности.
- source_word: οὐ μὴ στίλψωσιν
  choice: нисколько не заблестит
  rationale: Усиленное отрицание οὐ μή передано категорично; по-русски сказуемое естественно согласовано с ближайшим подлежащим «золото».
- source_word: ἐχωνεύοντο
  choice: их отливали
  rationale: В данном контексте χωνεύω относится к изготовлению металлических идолов посредством плавки и отливки.
- source_word: ᾐσθάνοντο
  choice: они ничего не чувствовали
  rationale: Передаёт отсутствие восприятия у идолов и сохраняет полемическую персонификацию оригинала.
theological_decisions:
- issue: Неодушевлённость идолов
  choice: «они ничего не чувствовали»
  alternative: «они этого не сознавали»
  rationale: Глагол αἰσθάνομαι допускает значения восприятия и осознания; «не чувствовали» естественно подчёркивает бесчувственность идолов, не усиливая текст дополнительным богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранён переход от золота в единственном числе к идолам во множественном числе во второй части стиха.
