  verdict: revise
  source_fidelity: В черновике добавлено отсутствующее в греческом тексте слово «другие» перед «птицы». τὰ ὄρνεα означает «птицы»; отдельное предшествующее упоминание ласточек не даёт оснований превращать это в остаточную категорию. «Слетаются» удачно для птиц, но при общем сказуемом также для кошек создаёт в русском неверный образ полёта. «Садятся» передаёт результат движения/размещения на идолах и естественно относится ко всем перечисленным животным.
  naturalness: Исправленный вариант сохраняет современный литературный и сдержанно библейский регистр. Конструкция «садятся ... равно как и кошки» грамматически и образно естественна, не заставляя кошек «слетаться».
  terminology: «Летучие мыши», «ласточки», «птицы» и «кошки» точно передают νυκτερίδες, χελιδόνες, τὰ ὄρνεα и αἴλουροι. «Равно как и» адекватно передаёт усиленное присоединение ὡσαύτως δὲ καί без избыточной тяжеловесности.
