    rationale: В оригинале τὰ ὄρνεα — просто «птицы»; признак «другие» не выражен и сужает/перестраивает референцию перечисления.
  - severity: medium
    issue: «Слетаются» относится также к кошкам.
    rationale: Греческое сказуемое общее для всего перечня, но русское «слетаться» обычно подразумевает полёт и потому неестественно и фактически неуместно для кошек. Контекстуально нейтральное «садятся» сохраняет картину пребывания животных на идолах.
