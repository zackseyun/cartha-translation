  text: Upon their bodies and upon their heads bats[a], swallows, and the birds alight, and likewise also the cats.
translation:
  language: ru
  text: На их тела и головы садятся летучие мыши, ласточки и птицы, равно как и кошки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «налетают на них».'
    reason: Глагол ἐφίπτανται может обозначать полёт на что-либо или посадку/размещение на поверхности; «садятся» выбрано в основном тексте, поскольку сказуемое относится и к кошкам.
lexical_decisions:
- source_word: ἐπὶ τὸ σῶμα αὐτῶν καὶ ἐπὶ τὴν κεφαλήν
  choice: на их тела и головы
  rationale: Повтор предлога ἐπί ясно задаёт место, однако в современном русском его естественно не дублировать. Единственное число греческих существительных имеет распределительный смысл при αὐτῶν, поэтому по-русски употреблено множественное число.
- source_word: ἐφίπτανται
  choice: слетаются
  rationale: Глагол означает прилетать на что-либо, опускаться или садиться сверху. «Слетаются» естественно передаёт движение множества животных к идолам и допускает их посадку на них.
- source_word: νυκτερίδες
  choice: летучие мыши
  rationale: Обычное и точное русское название этих животных.
- source_word: χελιδόνες
  choice: ласточки
  rationale: Прямое видовое значение греческого слова сохранено.
- source_word: τὰ ὄρνεα
  choice: другие птицы
  rationale: Поскольку летучие мыши и ласточки уже названы отдельно, добавление «другие» естественно выражает подразумеваемую остаточную категорию птиц и устраняет в русском впечатление нелогичного повтора.
- source_word: ὡσαύτως δὲ καὶ οἱ αἴλουροι
  choice: а также кошки
  rationale: Кратко и естественно передаёт присоединительное значение сочетания ὡσαύτως δὲ καί; αἴλουροι имеет обычное значение «кошки».
theological_decisions:
- issue: Характер полемики против идолов
  choice: Сохранить буквальный образ животных, беспрепятственно слетающихся на идолов.
  alternative: Истолковать животных символически или прямо пояснить бессилие идолов.
  rationale: Греческий текст создаёт насмешливый образ беспомощности идолов без явного толкования; перевод сохраняет этот образ и не добавляет богословских пояснений.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским повествованием без архаизмов. Синтаксис слегка сглажен ради естественности, при этом предметный образ и последовательность перечисления сохранены.
