revisions:
- from: На их тела и головы слетаются летучие мыши, ласточки и другие птицы, а также кошки.[a]
  to: На их тела и головы садятся летучие мыши, ласточки и птицы, равно как и кошки.[a]
  rationale: Убрано не имеющее опоры в источнике «другие». Сказуемое заменено на «садятся», чтобы сохранить общий синтаксис греческого перечисления и естественный русский смысл для птиц, летучих мышей и кошек. Сноска перенесена к глаголу и отмечает допустимый динамический оттенок без навязывания одного спорного нюанса.
