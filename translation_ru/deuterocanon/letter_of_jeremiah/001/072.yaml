  text: So a righteous man who has no idols is better[b][a], for he will be far from reproach.
translation:
  language: ru
  text: Итак, праведный человек, у которого нет идолов, лучше, ведь он будет далёк от позора.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Позор» также можно передать как «поношение» или «бесчестье».
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσον
  choice: лучше
  rationale: Сравнительная форма передана кратко и непосредственно; основание сравнения подразумевается контекстом, как и в греческом тексте.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно звучит в современном русском тексте.
- source_word: ἄνθρωπος δίκαιος
  choice: праведный человек
  rationale: Сохраняет единственное число и библейское нравственно-религиозное значение δίκαιος, не сужая смысл до юридической справедливости.
- source_word: οὐκ ἔχων εἴδωλα
  choice: у которого нет идолов
  rationale: Естественно передаёт определительный оборот с причастием и отрицание обладания или связи с идолами.
- source_word: ἔσται
  choice: будет
  rationale: Прямо передаёт форму будущего времени без архаического оттенка.
- source_word: μακρὰν ἀπὸ ὀνειδισμοῦ
  choice: будет далёк от позора
  rationale: Сохраняет пространственную метафору μακρὰν ἀπό; «позор» естественно выражает общественное бесчестье, заключённое в ὀνειδισμός.
theological_decisions:
- issue: Обобщающее единственное число ἄνθρωπος
  choice: праведный человек
  alternative: праведник; праведная личность
  rationale: «Человек» точно и естественно сохраняет обобщающий характер греческого единственного числа, не вводя дополнительного конфессионального оттенка.
- issue: Не названный прямо объект сравнения при κρείσσον
  choice: сохранить эллиптическое «лучше праведный человек»
  alternative: праведный человек превосходит идолов; лучше быть праведным человеком
  rationale: Греческий текст оставляет вторую сторону сравнения невыраженной. Её явное добавление либо изменение конструкции на «лучше быть» разрешило бы неоднозначность, которой нет в источнике.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Необычная эллиптическая сравнительная конструкция сохранена ради точности исходному тексту; остальной синтаксис сделан ясным и естественным.
