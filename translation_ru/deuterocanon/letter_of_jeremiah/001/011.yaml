  text: But these are not preserved from rust and moths[a], though they are clothed in purple garments.
translation:
  language: ru
  text: Но они не защищены от ржавчины и моли[a], хотя облачены в пурпурные одежды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от коррозии и того, что их разъедает». Греческое слово βρωμάτων шире по значению, чем «моль», однако упоминание одежды делает «моль» наиболее естественным вариантом в данном контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: они
  rationale: Указательное местоимение относится к идолам, названным в предшествующем контексте; добавлять слово «идолы» в сам стих нет необходимости.
- source_word: οὐ διασώζονται
  choice: не защищены
  rationale: В данном контексте выражение означает неспособность уберечься от физического разрушения; этот вариант естественен по-русски и не вызывает лишней ассоциации с духовным спасением.
- source_word: ἀπὸ ἰοῦ
  choice: от ржавчины
  rationale: 'Здесь ἰός обозначает ржавчину или коррозию: речь идёт о материальном разрушении идолов.'
- source_word: βρωμάτων
  choice: моли
  rationale: Греческое слово допускает более широкое понимание того, что поедает или разрушает, но последующее упоминание одежды делает моль наиболее естественным конкретным образом; широта значения сохранена в сноске.
- source_word: περιβεβλημένων αὐτῶν
  choice: хотя облачены
  rationale: 'Родительный самостоятельный оборот передан уступительно, чтобы сохранить иронию: роскошное одеяние не защищает идолов от разрушения.'
- source_word: ἱματισμὸν πορφυροῦν
  choice: в пурпурные одежды
  rationale: ἱματισμός обозначает одежду как одеяние, а πορφυροῦν — пурпурную окраску, связанную с богатством и великолепием; множественное число звучит естественно в современном русском.
theological_decisions:
- issue: Значение διασώζονται в полемике против идолопоклонства
  choice: физическая защищённость от разрушения
  alternative: избавление или спасение в более широком смысле
  rationale: Непосредственный контекст подчёркивает бессилие идолов и их подверженность материальному разрушению, поэтому перевод не должен привносить значение духовного спасения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Формулировка лаконична; уступительное «хотя» сохраняет иронию оригинала, а неоднозначность βρωμάτων отмечена в сноске.
