  text: Wild animals are better than they are[a], because they can escape into shelter and help themselves.
translation:
  language: ru
  text: Дикие звери лучше их[a], потому что могут убежать в укрытие и помочь самим себе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Звери превосходят их, потому что могут убежать под защиту и принести пользу самим себе».'
    reason: Лексические варианты для κρείττω, σκέπη и ὠφελέω.
lexical_decisions:
- source_word: τὰ θηρία
  choice: дикие звери
  rationale: θηρία обозначает диких животных или зверей; выражение «дикие звери» ясно передаёт смысл и сохраняет противопоставление идолам.
- source_word: κρείττω
  choice: лучше
  rationale: Сравнительная форма выражает превосходство. Здесь речь идёт не о нравственном достоинстве, а о практическом преимуществе зверей перед бездеятельными идолами.
- source_word: αὐτῶν
  choice: их
  rationale: Местоимение относится к идолам, о которых говорится в ближайшем контексте; русское «их» естественно в сравнительной конструкции.
- source_word: ἃ δύνανται
  choice: потому что могут
  rationale: Относительное предложение объясняет основание сравнения; причинная связь естественно выражена союзом «потому что».
- source_word: ἐκφυγόντα
  choice: убежать
  rationale: Причастие от ἐκφεύγω передаёт уход или бегство от опасности; инфинитив после «могут» делает сжатую греческую конструкцию естественной по-русски.
- source_word: εἰς σκέπην
  choice: в укрытие
  rationale: σκέπη означает укрытие или защищённое место, а εἰς обозначает движение внутрь или по направлению к нему.
- source_word: αὐτὰ ὠφελῆσαι
  choice: помочь самим себе
  rationale: Возвратное значение показывает, что звери способны действовать себе на пользу, в отличие от идолов. Формулировка не усиливает значение до обязательного «спасти себя».
theological_decisions:
- issue: К кому относится αὐτῶν в сравнении
  choice: Местоимение «их» относится к идолам, высмеиваемым в окружающем контексте.
  alternative: 'Явно назвать референт: «лучше этих идолов».'
  rationale: Сохранение местоимения следует греческому тексту и не добавляет существительное, хотя контекст достаточно ясно указывает на идолов.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и сатирически заострённая. Сохранено местоименное указание на идолов и практический, а не нравственный смысл сравнения.
