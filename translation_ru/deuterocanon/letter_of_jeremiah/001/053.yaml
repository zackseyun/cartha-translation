- from: Они не могут рассудить даже собственного дела[a] и не могут избавить от несправедливости, потому что бессильны.
  to: Они не могут разобрать собственного дела[a] и не могут никого избавить от несправедливости, потому что бессильны.
  rationale: Убрано не выраженное в оригинале «даже». «Разобрать собственное дело» естественно передаёт юридическую связку κρίσιν … διακρίνωσιν ἑαυτῶν. Добавление «никого» требуется русской синтаксической нормой при сохранении основного абстрактного прочтения ἀδίκημα; альтернативное конкретное понимание («пострадавшего») сохранено в сноске. Смысл и полемический регистр стиха не изменены.
