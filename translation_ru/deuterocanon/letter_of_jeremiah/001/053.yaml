  - severity: medium
    issue: Конструкция «избавить от несправедливости» не называет того, кого избавляют.
    rationale: Греческий аккузатив ἀδίκημα компактен и спорен, однако русскому глаголу «избавить» обычно требуется дополнение. «Никого» делает фразу грамматически и стилистически полной, не навязывая конкретное толкование ἀδίκημα.
