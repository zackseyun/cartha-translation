  source_fidelity: 'Первая часть передана в целом верно: κρίσιν … διακρίνωσιν ἑαυτῶν относится к разбирательству/решению дела, касающегося самих идолов. Однако «даже» не имеет прямой опоры в греческом тексте и создаёт дополнительное сопоставительное ударение. Во второй части сохранено допустимое абстрактное понимание ἀδίκημα («несправедливость»), но исходная русская конструкция с опущенным адресатом избавления менее ясна, чем требуется современному литературному русскому. Исправленный текст передаёт причинное ἀδύνατοι ὄντες и не снимает отмеченную в сноске неоднозначность ἀδίκημα.'
  naturalness: '«Рассудить даже собственного дела» звучит несколько шероховато: наречие «даже» избыточно, а сочетание лучше заменить на естественное юридическое «разобрать собственное дело». «Не могут избавить от несправедливости» возможно как сжатая конструкция, но без дополнения воспринимается неполной. «Не могут никого избавить от несправедливости» естественно и сохраняет абстрактный объект греческого слова.'
  terminology: «Разобрать дело» сохраняет судебный оттенок κρίσις/διακρίνω без архаизации. «Избавить от несправедливости» нейтрально передаёт ῥύσωνται и ἀδίκημα; «никого» — необходимое русское эксплицитное дополнение, не определяющее, идёт ли речь о пострадавшем или вообще о ком-либо. «Бессильны» точно и естественно передаёт ἀδύνατοι.
