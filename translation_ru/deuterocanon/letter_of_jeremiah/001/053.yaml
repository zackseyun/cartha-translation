  text: They cannot judge their own case[a], nor can they rescue one who is wronged, because they are powerless;
translation:
  language: ru
  text: Они не могут разобрать собственного дела[a] и не могут никого избавить от несправедливости, потому что бессильны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они не могут вынести решения по собственному делу и не могут защитить пострадавшего от несправедливости». Греческая фраза сжата: ἀδίκημα может означать несправедливость, неправое деяние или причинённый ущерб; в данном контексте оно может также подразумевать пострадавшего от несправедливости.'
    reason: Лексическая и синтаксическая неоднозначность греческого текста.
lexical_decisions:
- source_word: κρίσίν … διακρίνωσιν ἑαυτῶν
  choice: рассудить даже собственного дела
  rationale: Сочетание κρίσις и διακρίνω передаёт судебное решение или разбирательство, а ἑαυτῶν указывает, что дело касается самих идолов. «Даже» естественно подчёркивает их неспособность разобраться в собственном деле, хотя в греческом это значение выражено конструкцией в целом, а не отдельной частицей.
- source_word: οὐ μὴ … οὐδὲ μὴ
  choice: не могут … и не могут
  rationale: Усиленные греческие отрицания в контексте описывают полную неспособность идолов действовать. Повтор «не могут» ясно и естественно передаёт эту категоричность по-русски.
- source_word: ῥύσωνται
  choice: избавить
  rationale: ῥύομαι означает спасать или избавлять от беды и угнетения. «Избавить» сохраняет связь со следующим обозначением несправедливости и не вносит лишних богословских оттенков.
- source_word: ἀδίκημα
  choice: от несправедливости
  rationale: Существительное может обозначать несправедливость, неправое деяние или причинённый ущерб. Абстрактная передача близка к форме греческого текста и сохраняет его сжатость и неоднозначность.
- source_word: ἀδύνατοι ὄντες
  choice: потому что бессильны
  rationale: Причастный оборот называет причину неспособности идолов. Эта формулировка естественна для современного русского языка и сохраняет полемический акцент оригинала.
theological_decisions:
- issue: Характер бессилия идолов
  choice: Практическая неспособность судить и избавлять от несправедливости
  alternative: Общее метафизическое утверждение о природе идолов
  rationale: Стих прямо говорит о неспособности идолов совершать названные действия. Перевод не расширяет это утверждение до не сформулированного здесь учения об их природе.
- issue: Объект избавления при ἀδίκημα
  choice: Сохранено абстрактное «от несправедливости»
  alternative: «Спасти того, с кем поступили несправедливо»
  rationale: Греческое ἀδίκημα обычно обозначает неправду, несправедливость или проступок, однако сочетание с ῥύομαι допускает понимание по смыслу как избавление пострадавшего. Основной текст сохраняет грамматическую форму оригинала, а конкретизирующее прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и полемический. Судебная лексика сохранена без архаизмов. Неоднозначность компактной греческой конструкции вынесена в сноску.
