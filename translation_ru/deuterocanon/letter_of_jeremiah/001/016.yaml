lexical_decisions:
- source_word: τοιοῦτοι ὑπάρχουσιν
  choice: Таковы
  rationale: 'Кратко и естественно передаёт итоговую характеристику: указательное τοιοῦτοι и связочное употребление ὑπάρχουσιν.'
- source_word: οἱ θεοὶ αὐτῶν
  choice: их боги
  rationale: Сохраняет прямое обозначение греческого текста и его полемическую остроту; «идолы» было бы контекстуальным истолкованием.
- source_word: καθιδρυμένων αὐτῶν
  choice: поставленные
  rationale: Передаёт установку изображений на определённом месте, не привнося более узкого смысла «возведённые на престол».
- source_word: ἐν τοῖς οἴκοις
  choice: в домах
  rationale: Следует обычному значению οἶκος; перевод «в храмах» был бы неоправданным уточнением.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν πλήρεις εἰσὶν κονιορτοῦ
  choice: Их глаза полны пыли
  rationale: Сохраняет буквальный сатирический образ безжизненных изображений.
- source_word: ἀπὸ τῶν ποδῶν τῶν εἰσπορευομένων
  choice: поднятой ногами входящих
  rationale: 'Естественно по-русски выражает источник пыли: она попадает на изображения от ног тех, кто входит; субстантивированное причастие передано словом «входящих».'
theological_decisions:
- issue: Референт выражения «их боги»
  choice: Сохранить «их боги» как полемическое название почитаемых изображений.
  alternative: их идолы
  rationale: Хотя контекст говорит об идолах, в греческом стоит θεοί, «боги». Основной текст не должен сглаживать намеренную полемическую формулировку автора.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, ясная и сохраняет достоинство и сатирическую предметность оригинала. Причастный оборот «поставленные в домах» воспроизводит греческую конструкцию без лишнего временного уточнения.
