  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/005.yaml
  text: When you see a crowd in front of them and behind them bowing down to them[a], say in your mind, ‘It is you whom one must worship, Master.’
translation:
  language: ru
  text: 'Увидев множество людей перед ними и позади них, поклоняющихся им[a], скажите про себя: «Тебе должно поклоняться, Владыка».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «падающих ниц перед ними». Греческий глагол προσκυνέω может обозначать как телесный поклон, так и религиозное поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντας
  choice: Увидев
  rationale: Сохраняет форму и временное значение аористного причастия; подразумеваемые адресаты раскрываются последующим повелительным «скажите».
- source_word: ὄχλον
  choice: множество людей
  rationale: Естественно передаёт собирательное значение ὄχλος и яснее, чем одно слово «толпа», связывается с причастием множественного числа «поклоняющихся».
- source_word: ἔμπροσθεν καὶ ὄπισθεν αὐτῶν
  choice: перед ними и позади них
  rationale: Сохраняет конкретное пространственное описание без дополнительного толкования.
- source_word: προσκυνοῦντας αὐτά
  choice: поклоняющихся им
  rationale: Передаёт как телесный поклон, так и культовое почитание идолов; неоднозначность отмечена в сноске.
- source_word: εἴπατε δὲ τῇ διανοίᾳ
  choice: скажите про себя
  rationale: Естественная современная русская формулировка для внутренней, невысказанной речи; δέ не получает отдельного выражения, поскольку здесь оно служит лёгким переходом и по-русски было бы тяжеловесно.
- source_word: Σοὶ δεῖ προσκυνεῖν
  choice: Тебе должно поклоняться
  rationale: Начальное «Тебе» сохраняет эмфатическую позицию местоимения, а безличная конструкция передаёт необходимость δεῖ, не добавляя отсутствующего в греческом субъекта.
- source_word: Δέσποτα
  choice: Владыка
  rationale: Сохраняет отличие от κύριος и передаёт обращение к верховному господину в достойном, понятном религиозном регистре.
theological_decisions:
- issue: Передача божественного обращения Δέσποτα
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: «Владыка» сохраняет лексическое отличие Δέσποτα от κύριος и выражает верховную власть Бога, не подменяя исходный титул обычным соответствием для κύριος.
- issue: Значение προσκυνέω применительно к идолам и Богу
  choice: поклоняться в обоих случаях
  alternative: падать ниц перед идолами; поклоняться Богу
  rationale: 'Повтор одного русского глагола сохраняет намеренное лексическое противопоставление греческого текста: люди воздают идолам то поклонение, которое должно быть обращено к Владыке. Возможный телесный оттенок первого употребления сохранён в сноске.'
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис близок к греческому, но остаётся естественным; обращение «Владыка» употреблено вместо более привычного «Господь», чтобы сохранить различие исходных титулов.
