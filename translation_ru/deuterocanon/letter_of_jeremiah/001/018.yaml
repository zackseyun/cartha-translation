  text: They light lamps for them, more than for themselves, though they cannot see a single one of them.
translation:
  language: ru
  text: Перед ними зажигают больше светильников, чем для самих себя, однако они не могут видеть ни одного из них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνους
  choice: светильники
  rationale: Греческое λύχνος обозначает конкретный светильник, обычно масляный, а не свет вообще; слово сохраняет образ освещения перед идолами.
- source_word: καίουσιν
  choice: зажигают
  rationale: При дополнении «светильники» это естественная русская передача значения «зажигать, возжигать».
- source_word: πλείους ἢ ἑαυτοῖς
  choice: больше, чем для самих себя
  rationale: Сохраняет сравнительную конструкцию и не уточняет сверх греческого текста, идет ли речь о фактическом использовании или предоставлении светильников.
- source_word: ὧν οὐδένα
  choice: ни одного из них
  rationale: Относительное местоимение отсылает к светильникам, а отрицательная конструкция подчеркивает, что идолы не видят ни одного.
- source_word: δύνανται ἰδεῖν
  choice: не могут увидеть
  rationale: Прямая и ясная передача полной неспособности идолов видеть.
theological_decisions:
- issue: Референт подразумеваемого подлежащего при δύνανται ἰδεῖν
  choice: «они» — идолы, перед которыми зажигают светильники
  alternative: Почитатели не видят от идолов никакой пользы
  rationale: Ближайший контекст высмеивает бесчувственность идолов; именно им предназначены светильники, которых они не способны видеть. Местоимение оставлено без добавления существительного, поскольку референт определяется контекстом.
translation_notes:
  register: Современный литературный русский язык; достоинство тона сочетается с ясностью. «Перед ними» естественно выражает дательный ἑαυτοῖς в контексте культового освещения, а повторное «они» сохраняет направленность насмешки на идолов.
