  source_fidelity: Точно переданы оба глагола громкого крика (ὠρύονται ... βοῶντες), пространственное ἐναντίον («перед»), выражение «своими богами» и неопределённое τινές («люди»). «На поминальной трапезе по умершему» адекватно передаёт ἐν περιδείπνῳ νεκροῦ, не навязывая более узкое описание обряда.
