  text: But they howl, shouting before their gods, like some at a funeral meal for the dead.
translation:
  language: ru
  text: Но они воют, крича перед своими богами, словно люди на поминальной трапезе по умершему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на трапезе по умершему»; греческое выражение обозначает поминальную или погребальную трапезу, связанную с умершим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠρύονται
  choice: воют
  rationale: Глагол обозначает громкий, напоминающий звериный вой или плач крик; «воют» сохраняет яркую и насмешливую образность контекста.
- source_word: βοῶντες
  choice: крича
  rationale: Причастие передаёт громкое взывание; «крича» естественно сочетается с «воют» и сохраняет усиление шумного крика.
- source_word: ἐναντίον
  choice: перед
  rationale: 'В данном контексте прежде всего выражено пространственное значение: люди кричат перед своими богами.'
- source_word: θεῶν αὐτῶν
  choice: своими богами
  rationale: Греческий текст буквально называет их «богами»; возвратное «своими» естественно передаёт принадлежность при русском подлежащем.
- source_word: ὥσπερ τινὲς
  choice: словно люди
  rationale: Сравнение и неопределённое множественное τινές переданы естественным русским оборотом без попытки установить конкретную группу.
- source_word: ἐν περιδείπνῳ νεκροῦ
  choice: на поминальной трапезе по умершему
  rationale: Редкое слово περίδειπνον обозначает трапезу, связанную с погребением или поминовением умершего; выбранный вариант ясно передаёт культурный контекст и сохраняет образ трапезы.
theological_decisions:
- issue: Передача θεῶν в полемическом контексте об идолах
  choice: богами
  alternative: идолами
  rationale: Хотя речь идёт об идолах, греческий текст прямо говорит «их боги». Сохранение слова «боги» передаёт полемическую формулировку источника и не подменяет её толкованием.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет резкую образность греческого текста. «Поминальная трапеза» звучит достойно и понятно, не сводя древний обычай к какой-либо одной современной форме поминок.
