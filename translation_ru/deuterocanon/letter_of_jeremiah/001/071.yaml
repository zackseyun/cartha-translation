lexical_decisions:
- source_word: πορφύρας
  choice: пурпурной ткани
  rationale: В данном контексте πορφύρα обозначает дорогое пурпурное убранство идолов; «пурпурная ткань» ясно передаёт предметный смысл и звучит естественно по-русски.
- source_word: μαρμάρου
  choice: мрамору
  rationale: Прямое соответствие греческому μάρμαρον; речь идёт о дорогом материале, украшающем идолов.
- source_word: τῆς ἐπ’ αὐτοὺς σηπομένης
  choice: гниющим на них
  rationale: Сохранён резкий, конкретный образ распада, выраженный σηπομένης. Русское множественное число связывает определение с двумя однородными названиями материалов, не устраняя необычность образа гниющего мрамора.
- source_word: γνωσθήσεται
  choice: станет ясно
  rationale: Передаёт будущее обнаружение и очевидность того, что идолы не являются богами.
- source_word: θεοί
  choice: боги
  rationale: Прямой эквивалент, сохраняющий явное отрицание божественности идолов.
- source_word: ἐξ ὑστέρου
  choice: в конце концов
  rationale: Передаёт значение последующего, конечного исхода естественным современным русским выражением.
- source_word: βρωθήσονται
  choice: съедят
  rationale: Сохраняет буквальный и наглядный смысл глагола — «быть съеденными», не называя возможного деятеля и не сводя образ только к тлению.
- source_word: ὄνειδος
  choice: позором
  rationale: Передаёт публичный стыд и бесчестье, заключённые в ὄνειδος.
- source_word: ἐν τῇ χώρᾳ
  choice: в той стране
  rationale: χώρα может означать страну, землю или область; «в той стране» естественно в русском контексте и не сужает значение до конкретной местности.
theological_decisions:
- issue: К чему относятся местоимение αὐτά и последующий позор
  choice: «их самих» относится к идолам, а «это» — к их конечной гибели как позорному событию
  alternative: Считать главным референтом заключительных слов сами материалы либо передать последний оборот так, будто непосредственно идолы «станут позором»
  rationale: Контекст послания направлен против бессильных идолов, а усилительное αὐτά естественно возвращает речь к ним. Вместе с тем единственное число ἔσται лучше сохраняется русским «это станет позором», без искусственного согласования во множественном числе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Сохранены конкретность и насмешливая резкость греческого образа; необычное сочетание «мрамору, гниющему» не сглажено. Маркер сноски [a] помещён непосредственно после соответствующего слова.
