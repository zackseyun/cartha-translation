  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/002.yaml
  text: So when you enter Babylon[a], you will be there for many years and a long time, until seven generations; but after this I will bring you out from there in peace.
translation:
  language: ru
  text: Итак, когда вы войдёте в Вавилон, вы пробудете там многие годы, долгое время, вплоть до семи поколений[a]; после же этого я выведу вас оттуда с миром.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на протяжении семи поколений». Греческое выражение буквально означает «вплоть до семи поколений» и может обозначать срок изгнания округлённо или стилизованно.'
    reason: Лексико-синтаксическая неоднозначность выражения ἕως γενεῶν ἑπτά.
lexical_decisions:
- source_word: εἰσελθόντες οὖν
  choice: Итак, когда вы войдёте
  rationale: Аористное причастие при будущем сказуемом передано естественным русским придаточным времени; οὖν сохранено как связующее «итак».
- source_word: εἰς Βαβυλῶνα
  choice: в Вавилон
  rationale: Обычное русское обозначение направленного движения к городу.
- source_word: ἔσεσθε ἐκεῖ ἔτη πλείω
  choice: вы пробудете там многие годы
  rationale: «Пробудете» естественно выражает длительность будущего пребывания; πλείω в данном контексте означает множество лет, а не явное сравнение.
- source_word: καὶ χρόνον μακρόν
  choice: и долгое время
  rationale: Сохранено отдельное усиливающее указание на продолжительность, не слитое с предшествующей фразой.
- source_word: ἕως γενεῶν ἑπτά
  choice: вплоть до семи поколений
  rationale: «Вплоть до» передаёт предельное значение ἕως, а множественное число и числительное сохранены без превращения выражения в «до седьмого поколения».
- source_word: μετὰ τοῦτο δὲ
  choice: после же этого
  rationale: Частица «же» передаёт мягкий переход и противопоставление между долгим пребыванием и последующим исходом.
- source_word: ἐξάξω ὑμᾶς ἐκεῖθεν
  choice: я выведу вас оттуда
  rationale: Передано прямое значение выведения из места без добавления отсутствующих в греческом тексте понятий возвращения или спасения.
- source_word: μετʼ εἰρήνης
  choice: с миром
  rationale: Устойчивое и ёмкое русское выражение сохраняет образ греческой предложной конструкции и допускает оттенки мирного и благополучного исхода.
theological_decisions:
- issue: Следует ли усиливать заключительное обещание словами о спасении или возвращении
  choice: я выведу вас оттуда с миром
  alternative: я спасу вас и мирно возвращу оттуда
  rationale: Глагол ἐξάξω говорит о выведении, но сам по себе не называет это спасением и не содержит значения «назад»; перевод не добавляет этих богословски значимых уточнений.
- issue: Как понимать срок ἕως γενεῶν ἑπτά
  choice: вплоть до семи поколений
  alternative: до седьмого поколения / на протяжении семи поколений
  rationale: Сохранены необычная конструкция с ἕως и множественное число γενεῶν, чтобы не устранять возможную стилизованность или округлённость обозначения срока.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи, но без архаизации. Необычное повторное указание на длительность сохранено. Местоимение говорящего передано со строчной буквы по нейтральной современной норме; это не меняет подразумеваемого говорящего.
