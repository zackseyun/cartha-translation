  text: In the same way[a], their wooden gods overlaid with gold and silver are made like a scarecrow in a garden, on which every bird sits, and also like a dead body thrown out in the dark.
translation:
  language: ru
  text: Таким же образом их деревянные боги, покрытые золотом и серебром, уподоблены пугалу[a] в саду, на которое садится всякая птица, а также мёртвому телу, брошенному в темноте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «садовому столбу» или «сторожевой фигуре в саду». Греческое слово встречается редко; оно обозначает предмет, установленный в саду, на который птицы беспрепятственно садятся.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν αὐτὸν τρόπον
  choice: Так же
  rationale: Естественно вводит продолжение сравнения и сохраняет связь с предшествующим контекстом.
- source_word: βάμψῳ
  choice: пугалу
  rationale: Редкое греческое слово обозначает установленный в саду предмет или фигуру; контекст, где на него садятся птицы, допускает понятное современному читателю «пугало», при этом буквальная неопределённость отмечена в сноске.
- source_word: ἐν κήπῳ
  choice: в саду
  rationale: Прямое и обычное соответствие κῆπος без неоправданного сужения до фруктового сада.
- source_word: ἐφ’ ἧς πᾶν τὸ ὄρνεον ἐπικάθηται
  choice: на которое садится всякая птица
  rationale: Передаёт относительное придаточное и подчёркивает бессилие предмета, не способного отгонять птиц.
- source_word: τῷ νεκρῷ ἐρριμμένῳ ἐν σκότει
  choice: мертвецу, брошенному во тьме
  rationale: Сохраняет конкретный образ νεκρός, результативный оттенок причастия ἐρριμμένῳ и буквальное значение ἐν σκότει, не превращая тьму в метафизическое понятие.
- source_word: ἀφωμοίωνται
  choice: уподобились
  rationale: Форма русского совершенного вида естественно передаёт греческий перфект и сравнительно-пассивную семантику без добавочного объяснения.
- source_word: οἱ θεοὶ αὐτῶν ξύλινοι καὶ περίχρυσοι καὶ περιάργυροι
  choice: деревянные боги их, покрытые золотом и серебром
  rationale: Передаёт деревянную основу идолов и золотое и серебряное покрытие; порядок «боги их» придаёт фразе умеренно библейское достоинство, оставаясь понятным.
theological_decisions:
- issue: Характер сравнений в полемике против идолов
  choice: Идолы прямо сопоставлены с бессильным садовым пугалом и брошенным мертвецом.
  alternative: Первый образ можно передать более буквально как садовый столб или сторожевую фигуру.
  rationale: Текст показывает безжизненность и бессилие идолов посредством двух образов; перевод сохраняет эту полемическую силу, не добавляя конфессионального толкования.
