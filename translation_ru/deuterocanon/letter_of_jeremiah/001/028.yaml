  terminology: «Женщины во время месячных» и «роженицы» адекватно передают вероятный смысл ἀποκαθημένη и λεχώς, не приписывая тексту более узкой интерпретации. В примечании полезно сохранить буквальное значение первого слова и указать вероятностный характер объяснения.
