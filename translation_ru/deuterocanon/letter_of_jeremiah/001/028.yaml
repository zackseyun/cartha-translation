base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/028.yaml
  text: They touch their sacrifices while sitting apart and lying with women. Therefore[a], knowing from these things that they are not gods, do not fear them.
translation:
  language: ru
  text: Женщины во время месячных и роженицы прикасаются к их жертвам.[a] Итак, поняв из этого, что они не боги, не бойтесь их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально первое выражение означает «сидящая отдельно» и, вероятно, относится к женщине, отделённой на время месячных; второе обозначает женщину после родов. Греческая фраза кратка и грамматически неровна.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαθημένη
  choice: женщина во время месячных
  rationale: Субстантивированное причастие буквально изображает женщину, «сидящую отдельно»; в данном сочетании оно, вероятнее всего, обозначает женщину, отделённую на время менструации. Ясная передача смысла сохраняет подразумеваемый контекст ритуальной нечистоты.
- source_word: λεχώ
  choice: роженица
  rationale: Греческое существительное обозначает женщину после родов, находящуюся в родильном покое. «Роженица» естественно и кратко передаёт это значение по-русски.
- source_word: ἅπτονται
  choice: прикасаются
  rationale: Глагол означает «касаться, прикасаться»; здесь важен сам факт контакта с жертвами.
- source_word: γνόντες
  choice: зная
  rationale: Причастие выражает вывод, который адресаты должны сделать на основании приведённых признаков.
- source_word: θεοί
  choice: боги
  rationale: Прямое значение слова соответствует полемике против идолов.
- source_word: μὴ φοβηθῆτε
  choice: не бойтесь
  rationale: Отрицательное повеление передано прямо и естественно, без добавления значения «почитать», которого форма сама по себе не требует.
theological_decisions:
- issue: Ритуальная нечистота женщин и оскверняемость идолов
  choice: Назвать женщину во время месячных и роженицу, сохранив древний контекст состояний, считавшихся ритуально нечистыми.
  alternative: 'Передать буквально и менее определённо: «сидящая отдельно и женщина на родильном ложе».'
  rationale: Сочетание ἀποκαθημένη и λεχώ указывает на конкретные состояния ритуальной нечистоты. Полемический смысл в том, что идолы допускают прикосновение таких людей и потому не являются богами; перевод передаёт этот довод, не утверждая от себя общую богословскую оценку женщин.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-наставительным завершением. «Роженица» употреблено в традиционном, но понятном современному читателю значении; архаизмы и конфессионально окрашенные термины исключены.
