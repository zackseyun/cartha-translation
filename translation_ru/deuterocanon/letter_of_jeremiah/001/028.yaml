  source_fidelity: 'Основной смысл передан верно: речь о прикосновении к жертвам женщин, находящихся в состояниях, которые в древнем контексте связывались с ритуальной нечистотой, и из этого выводится бессилие «богов». Однако «зная по этому» неестественно по-русски и неточно передаёт ἀπὸ τούτων («из этого», «по этим признакам»).'
