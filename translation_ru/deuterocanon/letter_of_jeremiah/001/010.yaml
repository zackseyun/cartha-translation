    reason: alternative_reading
lexical_decisions:
- source_word: δώσουσιν
  choice: дадут
  rationale: Сохранена форма будущего времени греческого глагола; в контексте она продолжает описание того, что происходит с идолами и принадлежащими им вещами.
- source_word: ἀπʼ αὐτῶν
  choice: из принадлежащего им
  rationale: Буквальное «из них» по-русски неясно. Формулировка передаёт исходный местоименный оборот и вероятную отсылку к предметам, связанным с идолами, не уточняя их как пожертвования или имущество сверх сказанного в контексте.
- source_word: ταῖς ἐπὶ τοῦ στέγους πόρναις
  choice: блудницам на крыше
  rationale: πόρναι обозначает блудниц; ἐπὶ τοῦ στέγους буквально указывает на нахождение на крыше. Культовый или храмовый статус в греческом тексте прямо не выражен.
- source_word: κοσμοῦσί
  choice: украшают
  rationale: Глагол означает украшать или наряжать; «украшают» сохраняет возвышенный повествовательный регистр и допускает последующее указание на одежды.
- source_word: ὡς ἀνθρώπους
  choice: как людей
  rationale: ἀνθρώπους имеет общее значение «людей», а не только мужчин.
- source_word: τοῖς ἐνδύμασιν
  choice: одеждами
  rationale: Творительный падеж передаёт инструментальный дательный греческого текста; множественное число отражает ἐνδύμασιν.
- source_word: θεοὺς ἀργυροῦς καὶ θεοὺς χρυσοῦς καὶ ξυλίνους
  choice: богов серебряных, богов золотых и деревянных
  rationale: Сохранён повтор слова «богов» при первых двух определениях и его эллипсис при последнем, что воспроизводит ритмический, отчасти насмешливый перечень оригинала.
theological_decisions:
- issue: Следует ли придавать πόρναι культовое значение
  choice: блудницам
  alternative: храмовым блудницам / культовым блудницам
  rationale: Греческий текст называет их блудницами и помещает на крыше, но прямо не говорит, что они исполняли культовую или храмовую функцию; такое уточнение оставлено только как возможное толкование в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Сохранены будущее время первого глагола, настоящее время второго, повтор «богов» и неоднозначность местоимения; архаическое, но общеизвестное «блудницы» соответствует регистру и не добавляет культовой конкретизации.
