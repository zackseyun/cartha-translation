  text: Therefore be on your guard[a], lest you too, having become like the foreigners, become like them, and fear seize you because of them,
translation:
  language: ru
  text: Итак, остерегайтесь, чтобы и вы, уподобившись иноплеменникам, не уподобились им[a] и чтобы страх из-за них не овладел вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте один и тот же глагол повторён дважды: «уподобившись… не уподобились».'
    reason: Указывает на намеренно сохранённый необычный повтор исходного текста.
lexical_decisions:
- source_word: εὐλαβήθητε
  choice: остерегайтесь
  rationale: В данном предостерегающем контексте аористный императив передаёт настойчивый призыв быть начеку; «остерегайтесь» естественно и не привносит значения благоговения.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего предостережения и ясно связывает фразу с контекстом.
- source_word: μὴ καὶ ὑμεῖς
  choice: чтобы и вы… не
  rationale: Естественно передаёт отрицательное предостережение и сохраняет включительное усиление «и вы».
- source_word: ἀφομοιωθέντες … ἀφομοιωθῆτε
  choice: уподобившись … не уподобились
  rationale: Сохраняет повтор одного греческого глагола, его страдательно-возвратный оттенок и риторическую настойчивость, хотя повтор по-русски звучит необычно.
- source_word: τοῖς ἀλλοφύλοις
  choice: иноплеменникам
  rationale: Точно обозначает людей иного народа, не вводя более позднего специального смысла слова «язычники» и не сводя выражение просто к гражданству.
- source_word: φόβος ὑμᾶς λάβῃ
  choice: страх … не овладел вами
  rationale: Сохраняет образ страха как силы, захватывающей человека, и звучит естественно в современном литературном русском.
- source_word: ἐπʼ αὐτοῖς
  choice: перед ними
  rationale: Передаёт страх по отношению к ним и не устраняет неоднозначность местоименного указания; возможен также причинный оттенок «из-за них».
theological_decisions:
- issue: Смысл предостережения с повтором ἀφομοιόω
  choice: Сохранено общее предостережение не уподобляться иноплеменникам, без явного добавления указания на идолопоклонство.
  alternative: 'Уточнить: не перенимать идолопоклоннические обычаи иноплеменников.'
  rationale: Ближайший контекст связывает предостережение с идолами и поведением окружающих народов, однако сам стих формулирует его шире; перевод не должен подменять текст контекстуальным толкованием.
- issue: Референт αὐτοῖς
  choice: Местоимение «ними» оставлено без поясняющего существительного.
  alternative: Передать как «перед идолами» или отнести местоимение только к иноплеменникам.
  rationale: Греческое местоимение допускает контекстуальное соотнесение, которое в изолированном стихе не следует принудительно разрешать; русское местоимение сохраняет напряжение текста.
translation_notes:
  register: Современный литературный русский с достоинством библейского предостережения. Выбрано понятное, но слегка возвышенное «иноплеменникам»; синтаксический и лексический повтор оригинала сохранён, а неоднозначный референт местоимения не уточняется.
