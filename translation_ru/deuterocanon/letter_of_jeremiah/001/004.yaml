  terminology: «Иноплеменникам» удачно передаёт τοῖς ἀλλοφύλοις без конфессиональной или этнически оценочной интерпретации. «Остерегайтесь» соответствует предупредительной силе εὐλαβήθητε. Местоимение «них» сохраняет неуточнённость референта, но предлог следует исправить.
