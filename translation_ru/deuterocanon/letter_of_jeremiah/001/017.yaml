  source_fidelity: 'Основной смысл передан точно: сравнение с человеком, совершившим преступление против царя и ведомым на смерть, а также меры защиты домов идолов от грабителей сохранены. Однако формулировка «как дворы ограждены вокруг человека» по-русски затрудняет восприятие и недостаточно ясно выражает, что охраняются/ограждаются именно дворы вокруг такого человека.'
