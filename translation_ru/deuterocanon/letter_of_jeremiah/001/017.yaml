base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/017.yaml
  text: And just as the courts are secured around one who has wronged a king[a], as one being led away to death, so the priests fortify their houses with doors and locks and bars[b], so that they may not be plundered by robbers.
translation:
  language: ru
  text: И подобно тому как дворы вокруг человека, провинившегося перед царём[a] и ведомого на смерть, охраняются, так жрецы защищают дома своих идолов[b] дверями, замками и засовами, чтобы грабители не разграбили их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дворы вокруг человека, оскорбившего царя, ограждены». Начало сравнения в греческом тексте синтаксически трудно; общий смысл состоит в том, что вокруг человека, совершившего преступление против царя и ведомого на смерть, принимаются усиленные меры охраны.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их дома». Имеются в виду дома или храмовые здания идолов, которые охраняют жрецы.'
    reason: cultural_note
lexical_decisions:
- source_word: περιτετράχηλαι εἰσὶν αἱ αὐλαί
  choice: дворы ограждены вокруг
  rationale: 'Сохраняет трудный пространственный образ греческого текста: αὐλαί — дворы, а перфектная пассивная форма указывает на их ограждённость или защищённость вокруг человека.'
- source_word: τινὶ ἠδικηκότι βασιλέα
  choice: человека, провинившегося перед царём
  rationale: ἀδικέω означает поступить неправедно, причинить зло или провиниться; русское выражение естественно передаёт юридический смысл, не утверждая, что вред был нанесён лично царю.
- source_word: ὡς ἐπὶ θάνατον ἀπηγμένῳ
  choice: ведомого на смерть
  rationale: Передаёт движение под стражей и смертельный исход, не конкретизируя способ казни.
- source_word: ὀχυροῦσιν
  choice: укрепляют
  rationale: Глагол означает делать укреплённым или защищённым; выбор сохраняет сатирический образ зданий идолов как уязвимых крепостей.
- source_word: τοὺς οἴκους αὐτῶν
  choice: дома своих идолов
  rationale: Слово οἴκους буквально означает «дома», а местоимение по контексту относится к идолам. Явное указание референта устраняет неестественную для русского двусмысленность, будто речь идёт о домах самих жрецов, сохраняя при этом исходный образ «домов».
- source_word: θυρώμασιν τε καὶ κλείθροις καὶ μοχλοῖς
  choice: дверями, замками и засовами
  rationale: Ясно и естественно передаёт накопительный перечень средств физической защиты.
- source_word: συληθῶσι
  choice: не разграбили
  rationale: συλάω обозначает ограбление, разорение или снятие добычи; русский глагол точно подходит к действиям грабителей.
- source_word: λῃστῶν
  choice: грабители
  rationale: λῃσταί — грабители или разбойники; здесь нейтральное «грабители» прямо соответствует угрозе разграбления.
theological_decisions:
- issue: К чему относится выражение «их дома» в контексте обличения идолопоклонства
  choice: «дома своих идолов»
  alternative: «их дома»; «их храмы»; «их святилища»
  rationale: Контекст указывает на здания, где находятся идолы и которые охраняют жрецы. «Дома своих идолов» сохраняет буквальный образ οἴκους, не подменяя его специальным культовым термином, и не позволяет ошибочно отнести дома к жрецам.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской прозы. Сохранены развернутое сравнение, накопительный перечень средств защиты и ирония: безжизненные идолы нуждаются в охране от людей.'
