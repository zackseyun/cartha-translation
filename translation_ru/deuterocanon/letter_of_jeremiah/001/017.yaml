  rationale: Исправление устраняет неестественный русский порядок слов в первом сравнении и согласует сноску с новой формулировкой. Смысл греческого текста, его неопределённость в трудном начальном образе и буквальный образ «домов» сохранены. Замена «укрепляют» на «защищают» делает русский перечень средств охраны естественным, не меняя значения ὀχυροῦσιν в данном контексте.
