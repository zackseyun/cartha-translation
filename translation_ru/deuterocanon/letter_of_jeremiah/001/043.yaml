revisions:
- from: Но если какую-нибудь из них утащит один из прохожих и ляжет с ней[a], она укоряет стоящую рядом за то, что та не удостоилась того же, что и она, и что её верёвка не была разорвана[b].
  to: Но когда одну из них утащит один из прохожих и она ляжет с ним[a], она укоряет стоящую рядом за то, что та не удостоилась того же, чего удостоилась она, и что её шнур не был разорван[b].
  rationale: 'Правка устраняет изменение субъектной структуры: прохожий совершает увлечение, тогда как женская фигура является субъектом «ляжет с ним». «Но если» заменено на «Но когда» для передачи ὅταν. Смысл последнего отрицательного члена сохранён как второе основание упрёка. Слово «шнур» выбрано как естественный русский эквивалент σχοινίον, не превращая вероятную функцию крепления в утверждение основного текста.'
