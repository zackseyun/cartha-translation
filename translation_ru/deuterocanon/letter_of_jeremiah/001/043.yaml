  text: But whenever one of them is dragged away by one of the passersby and lies with him[a], she reproaches the one next to her because she was not deemed worthy as she was[c][b], nor was her cord broken.
translation:
  language: ru
  text: Но когда одну из них утащит один из прохожих и она ляжет с ним[a], она укоряет стоящую рядом за то, что та не удостоилась того же, чего удостоилась она, и что её шнур не был разорван[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уснёт (или будет спать)»; здесь это сдержанный эвфемизм половой связи.'
    reason: cultural_note
  - marker: b
    text: Вероятно, имеется в виду шнур или верёвка, которой было закреплено идольское изображение; автор сатирически представляет такие фигуры женщинами, соперничающими за мужское внимание.
    reason: cultural_note
lexical_decisions:
- source_word: ἐφελκυσθεῖσα
  choice: утащит
  rationale: Пассивное причастие от ἐφέλκω передаёт физическое увлечение или утаскивание; форма «утащит» естественно встраивается в русскую условно-временную конструкцию и сохраняет грубую сатирическую образность.
- source_word: ὑπό τινος τῶν παραπορευομένων
  choice: один из прохожих
  rationale: Передаёт неопределённость τις и значение παραπορεύομαι — проходить мимо.
- source_word: κοιμηθῇ
  choice: ляжет с ней
  rationale: Сохраняет сдержанный библейский эвфемизм половой связи и делает подразумеваемого мужчину явным по-русски.
- source_word: τὴν πλησίον
  choice: стоящую рядом
  rationale: Контекстуально речь идёт о соседней женской фигуре; пространственное выражение точнее, чем потенциально межличностное «ближнюю».
- source_word: ὀνειδίζει
  choice: укоряет
  rationale: Передаёт значение упрёка или поношения в современном литературном регистре без излишней разговорности.
- source_word: οὐκ ἠξίωται
  choice: не удостоилась
  rationale: 'Сохраняет оценочный оттенок пассивной формы: её не сочли достойной такого же обращения.'
- source_word: ὥσπερ καὶ αὐτή
  choice: того же, что и она
  rationale: Естественно выражает сравнение и устраняет в русском синтаксисе неясность неполной конструкции, не добавляя нового содержания.
- source_word: τὸ σχοινίον αὐτῆς διεράγη
  choice: её верёвка не была разорвана
  rationale: Буквально сохраняет предметный образ σχοινίον и пассив διεράγη, не конкретизируя назначение верёвки сверх текста.
theological_decisions:
- issue: Кого обозначают женские формы и выражение «одна из них»
  choice: Женские идольские изображения олицетворены как женщины
  alternative: Женщины, связанные с языческими святилищами
  rationale: Ближайший контекст высмеивает идолов, описывая их как женщин; упоминание верёвки поддерживает образ закреплённой статуи. Однако перевод не вводит слово «статуя», сохраняя возможность иной референции.
- issue: Связь последнего отрицательного придаточного с упрёком
  choice: 'Оба обстоятельства входят в содержание упрёка: соседняя фигура не удостоилась того же, и её верёвка не была разорвана'
  alternative: Последняя часть является самостоятельным сообщением повествователя
  rationale: Параллельные οὔτε и отрицательная структура естественно продолжают основание упрёка; русское повторение «и что» делает эту связь ясной, не меняя образа.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской сдержанностью. Сатира и намеренно грубоватая физическая образность оригинала сохранены; спорный референт женских форм не конкретизирован непосредственно в тексте.
