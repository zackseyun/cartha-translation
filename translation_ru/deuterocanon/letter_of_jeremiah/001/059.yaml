  text: For the sun and the moon and the stars, being bright and sent out for needs, are obedient.
translation:
  language: ru
  text: Ведь солнце, луна и звёзды, сияющие и посылаемые для служения[a], послушны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для удовлетворения нужд»; греческое выражение может означать полезное служение, удовлетворение нужд или исполнение предназначенных функций.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥλιος
  choice: солнце
  rationale: Прямое и обычное обозначение небесного светила.
- source_word: σελήνη
  choice: луна
  rationale: Стандартное соответствие в традиционной триаде «солнце, луна и звёзды».
- source_word: ἄστρα
  choice: звёзды
  rationale: Точное соответствие форме множественного числа, обозначающей небесные светила.
- source_word: ὄντα λαμπρά
  choice: сияющие
  rationale: Естественно передаёт их светлое, излучающее свет состояние; причастная форма сохраняет связь с греческой конструкцией.
- source_word: ἀποστελλόμενα
  choice: посылаемые
  rationale: Сохраняет страдательное значение и образ небесных светил, направляемых исполнять определённую функцию.
- source_word: ἐπὶ χρείας
  choice: для служения
  rationale: Передаёт значение пользы, нужды и исполнения предназначенной функции более естественно по-русски, чем буквальное «для нужд»; диапазон значения отмечен в сноске.
- source_word: εὐήκοά
  choice: послушны
  rationale: Передаёт готовность повиноваться и сохраняет противопоставление идолам, неспособным действовать.
theological_decisions:
- issue: Действующая сила и предназначение небесных светил
  choice: Солнце, луна и звёзды представлены как посылаемые и послушные, однако тот, кто их посылает, прямо не назван.
  alternative: Понять выражение лишь как указание на постоянство природных процессов.
  rationale: Сочетание страдательного причастия ἀποστελλόμενα и прилагательного εὐήκοα подразумевает подчинение установленному порядку, но перевод не добавляет слова «Бог», которого в данном стихе нет.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет возвышенную, но понятную форму. Причастный оборот передаёт структуру греческого текста, а слово «послушны» сохраняет его олицетворяющую силу.
