  text: Итак, для нас совершенно не очевидно, что они — боги; поэтому не бойтесь их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατʼ οὐδένα ... τρόπον
  choice: никоим образом
  rationale: Идиома выражает полное, категорическое отрицание. «Никоим образом» естественно для современного литературного русского языка и сохраняет усилительный оттенок.
- source_word: φανερὸν
  choice: очевидно
  rationale: 'В предикативной конструкции слово обозначает то, что явно и несомненно обнаруживается. «Очевидно» сохраняет эпистемический акцент: ничто не показывает, что обсуждаемые идолы являются богами.'
- source_word: θεοί
  choice: боги
  rationale: Обычное значение множественного числа θεοί передано прямо; так сохраняется полемическое отрицание божественности идолов.
- source_word: μὴ φοβῆσθε
  choice: не бойтесь
  rationale: Прямой и естественный русский императив точно передаёт запрет испытывать перед ними страх.
- source_word: διό
  choice: поэтому
  rationale: Союз вводит вывод из предшествующего утверждения. «Поэтому» ясно сохраняет логическую связь.
- source_word: οὖν
  choice: итак
  rationale: Частица обозначает итоговый вывод из предшествующего рассуждения; «итак» естественно передаёт эту функцию и не смешивается с последующим διό.
theological_decisions:
- issue: Референт αὐτούς в заключительной части
  choice: «их» — идолы, которых ложно считают богами
  alternative: «их» — названные «боги» без уточнения их природы
  rationale: Непосредственный контекст всего отрывка посвящён рукотворным идолам. Местоименная передача «их» сохраняет референцию и анти-идолопоклоннический довод, не добавляя в основной текст пояснений сверх греческого.
- issue: Характер утверждения φανερὸν ὅτι εἰσὶν θεοί
  choice: Сохранить формулировку об отсутствии очевидности их божественности
  alternative: 'Категорично перевести: «они вовсе не боги»'
  rationale: Греческий текст формулирует вывод через отсутствие явного свидетельства, а не прямой именной тезис. Перевод сохраняет эту риторическую и богословскую напряжённость, не усиливая отрицание сверх источника.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской прозы. Синтаксис близок к греческому ходу мысли: итоговое οὖν передано словом «итак», а причинно-следственное διό — словом «поэтому». Тире перед «боги» помогает естественно прочитать составное именное сказуемое.'
