  text: when it goes out against sinners from the presence of the Lord[a], to destroy every possession of sinners.
translation:
  language: ru
  text: когда оно выйдет против грешников от лица Господа, чтобы уничтожить всё достояние грешников[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё имущество»; греческое слово может также обозначать всё, чем грешники располагают, или основу их положения.'
    reason: Ὑπόστασις в данном контексте может относиться к имуществу, совокупному достоянию либо к тому, что составляет основу положения; примечание сохраняет эту лексическую широту.
lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: Союз вводит временное придаточное с ожидаемым событием; «когда» естественно передаёт это значение, не приписывая действию повторяемости.
- source_word: ἐξέλθῃ
  choice: оно выйдет
  rationale: Подлежащее в стихе не названо и восстанавливается из предшествующего контекста. Местоимение среднего рода сохраняет эту отсылку, не уточняя её вопреки греческому тексту.
- source_word: ἐφʼ ἁμαρτωλοὺς
  choice: против грешников
  rationale: ἐπί при глаголе движения здесь выражает направленность враждебного, карающего действия; «против» ясно и естественно передаёт этот смысл.
- source_word: ἀπὸ προσώπου Κυρίου
  choice: от лица Господа
  rationale: Сохранён библейский образ лица как обозначения непосредственного присутствия и источника исходящего суда; русское выражение звучит достойно и понятно.
- source_word: ὀλεθρεύσαι
  choice: чтобы уничтожить
  rationale: Инфинитив обозначает цель исходящего действия. «Уничтожить» передаёт силу глагола прямо, без дополнительного толкования.
- source_word: πᾶσαν ὑπόστασιν ἁμαρτωλῶν
  choice: всё достояние грешников
  rationale: В эллинистическом и библейском греческом ὑπόστασις может обозначать имущество, достояние или то, чем кто-либо располагает. «Достояние» естественно охватывает совокупность принадлежащего грешникам, а примечание сохраняет лексическую неоднозначность.
theological_decisions:
- issue: Неназванное подлежащее ἐξέλθῃ
  choice: Сохранить отсылку местоимением «оно»
  alternative: Назвать действующую силу или лицо по предшествующему контексту
  rationale: Сам стих не называет подлежащего; его конкретизация могла бы преждевременно снять синтаксическую и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейским оборотом «от лица Господа». Структура временного придаточного сохранена; формулировка не добавляет отсутствующее в данном стихе подлежащее.
