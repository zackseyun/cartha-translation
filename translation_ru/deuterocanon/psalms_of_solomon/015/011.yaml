  text: And the inheritance of sinners is destruction and darkness, and their lawlessness will pursue them down to Hades.
translation:
  language: ru
  text: И удел грешников — гибель и тьма, и их беззаконие будет преследовать их до самой преисподней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до Ада внизу». Греч. ᾅδης означает мир мёртвых; здесь речь не обязательно идёт о геенне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κληρονομία
  choice: удел
  rationale: «Удел» естественно передаёт то, что достаётся человеку, и сохраняет образ назначенной доли; буквальное «наследие» здесь по-русски менее естественно.
- source_word: ἁμαρτωλῶν
  choice: грешников
  rationale: Прямое и естественное соответствие субстантивированному множественному числу.
- source_word: ἀπώλεια
  choice: гибель
  rationale: Передаёт катастрофический исход без архаического оттенка и без излишне узкого догматического толкования.
- source_word: σκότος
  choice: тьма
  rationale: Сохраняет буквальный образ и его нравственно-эсхатологическую силу; в возвышенном поэтическом контексте естественнее, чем «темнота».
- source_word: ἀνομία
  choice: беззаконие
  rationale: Сохраняет прямую связь слова с нарушением закона, не обобщая его до «зла» или «нечестия».
- source_word: διώξεται
  choice: будет преследовать
  rationale: Передаёт будущее время и образ неотступной погони, не сужая значение до гонения за веру.
- source_word: ἕως ᾅδου κάτω
  choice: до самого Ада внизу
  rationale: «До самого» выражает предельное значение ἕως, а «внизу» отдельно сохраняет κάτω; «Ад» здесь употреблён как традиционное русское наименование мира мёртвых, а не как уточнение о геенне.
theological_decisions:
- issue: Передача ᾅδης
  choice: Ад
  alternative: мир мёртвых; преисподняя
  rationale: Греческий текст называет ᾅδης — область мёртвых, а не геенну. Традиционное «Ад» сохраняет именование, но сноска оговаривает исходный смысл и не отождествляет его автоматически с местом окончательного наказания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, поэтическим звучанием. Параллелизм греческой строки и повтор союза «и» сохранены; формулировка не устраняет напряжение между образом назначенного удела и беззаконием, которое само преследует грешников.
