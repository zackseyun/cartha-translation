  text: And what is man able to do[a], except give thanks to your name?
translation:
  language: ru
  text: И что может человек, кроме как воздавать благодарение[a] имени Твоему?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исповедовать имя Твоё»; или: «прославлять имя Твоё». Греческий глагол в зависимости от контекста может иметь каждое из этих значений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: что
  rationale: Вопросительное местоимение указывает на действие, которое способен совершить человек, а не на личность.
- source_word: δυνατὸς ἄνθρωπος
  choice: может человек
  rationale: Греческое сочетание выражает способность; по-русски подразумеваемое действие естественно передаётся личной конструкцией «что может человек».
- source_word: εἰ μὴ
  choice: кроме как
  rationale: В риторическом вопросе оборот вводит единственное исключение и естественно передаётся выражением «кроме как».
- source_word: ἐξομολογήσασθαι
  choice: воздавать благодарение
  rationale: В библейском греческом применительно к Богу и Его имени глагол часто означает благодарственное прославление. Формулировка сохраняет возвышенный молитвенный регистр, а сноска отмечает реальную многозначность.
- source_word: τῷ ὀνόματί σου
  choice: имени Твоему
  rationale: Сохранена дательная конструкция и библейский образ действия, обращённого к Божьему имени, без смыслового сглаживания.
