lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: Передаёт временное придаточное с сослагательным наклонением и естественно выражает ожидаемое событие; «всякий раз, когда» придало бы фразе более выраженный повторительный смысл.
- source_word: ἐπισκέπτηται
  choice: посетит
  rationale: Сохраняет библейский образ Божьего посещения как целенаправленного вмешательства, не уточняя сверх текста, благотворно оно или карательно; судебный характер задаёт следующая фраза.
- source_word: τὴν γῆν
  choice: землю
  rationale: 'Русское «землю» сохраняет возможную широту значения γῆ: весь мир или конкретная земля; основное прочтение здесь — земля как мир.'
- source_word: ἐν κρίματι αὐτοῦ
  choice: со Своим судом
  rationale: Естественно по-русски передаёт сопутствующий Божьему посещению суд, сохраняя значение κρίμα как суда или судебного решения.
