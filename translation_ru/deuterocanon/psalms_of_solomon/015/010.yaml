lexical_decisions:
- source_word: σημεῖον
  choice: знак
  rationale: «Знак» прямо передаёт широкое значение греческого слова и сохраняет возможную перекличку с другими упоминаниями знака; более узкие варианты «метка» и «клеймо» добавляли бы смысловой оттенок.
- source_word: ἀπωλείας
  choice: гибели
  rationale: «Гибель» естественно и весомо передаёт уничтожение или конечную погибель, не сужая выражение до одной конкретной формы наказания.
- source_word: ἐπὶ
  choice: на
  rationale: С родительным τοῦ μετώπου предлог обозначает местонахождение на поверхности; по-русски это естественно передаётся предлогом «на».
- source_word: μετώπου αὐτῶν
  choice: на их лбах
  rationale: Греческое единственное число имеет распределительное значение; русское множественное число ясно и естественно показывает, что знак находится на лбу у каждого из них.
theological_decisions:
- issue: Характер связи между знаком и гибелью
  choice: знак гибели
  alternative: гибельный знак
  rationale: Родительное определение сохранено без уточнения, означает ли знак принадлежность гибели, предвещает её или удостоверяет обречённость; тем самым не снимается неоднозначность греческого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Союз «ибо» передаёт γάρ и связь с предыдущей строкой; тире естественно восполняет отсутствующую в греческом связку.
