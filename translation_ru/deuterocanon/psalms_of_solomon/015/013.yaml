base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/013.yaml
  text: For sins will lay waste the houses of sinners[b][a], and sinners will perish on the day of the Lord’s judgment forever.
translation:
  language: ru
  text: Ибо грехи опустошат дома грешников[a], и грешники погибнут в день суда Господня навеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разорят»; букв. также возможно: «сделают пустынными».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «на век».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτίαι
  choice: грехи
  rationale: Форма множественного числа обозначает конкретные грехи или их совокупность; прямой русский эквивалент сохраняет персонифицированное действие подлежащего.
- source_word: ἐξερημώσουσιν
  choice: опустошат
  rationale: Глагол означает сделать пустынным, разорить или опустошить; «опустошат» естественно по-русски передаёт тяжесть последствий.
- source_word: οἴκους
  choice: дома
  rationale: Сохранено основное буквальное значение; контекст не требует однозначно расширять его до «семейств» или «домочадцев».
- source_word: ἁμαρτωλῶν
  choice: грешников
  rationale: Прямой родительный падеж сохраняет повтор корня в последующей части стиха и его риторический параллелизм.
- source_word: ἀπολοῦνται
  choice: погибнут
  rationale: Средняя форма здесь выражает гибель или окончательное крушение, не уточняя внешнего способа уничтожения.
- source_word: ἐν ἡμέρᾳ κρίσεως Κυρίου
  choice: в день суда Господня
  rationale: Естественная русская временная конструкция сохраняет принадлежность суда Господу и торжественный регистр.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: В контексте суда выражение передаёт непреходящую окончательность; «навеки» сохраняет возвышенный, но понятный современному читателю тон.
theological_decisions:
- issue: Сфера действия εἰς τὸν αἰῶνα
  choice: «навеки» относится к глаголу «погибнут»
  alternative: Фразу можно понять как более общее усиление всего высказывания о суде или буквально передать «на век».
  rationale: Конечная позиция оборота естественнее всего связывает его с гибелью грешников. Порядок слов перевода сохраняет эту близость, не превращая выражение в характеристику продолжительности самого дня суда.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены причинное «ибо», повтор «грехи — грешников — грешники» и буквальный образ домов; неоднозначность слова «дома» не снята толкованием.
