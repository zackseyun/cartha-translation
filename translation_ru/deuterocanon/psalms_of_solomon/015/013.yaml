  text: αἱ γὰρ ἁμαρτίαι ἐξερημώσουσιν οἴκους ἁμαρτωλῶν, καὶ ἀπολοῦνται ἁμαρτωλοὶ ἐν ἡμέρᾳ κρίσεως Κυρίου εἰς τὸν αἰῶνα,
  language: Greek
