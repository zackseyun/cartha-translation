lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: Союз вводит основание или пояснение к окружающему высказыванию; «ибо» естественно сохраняет причинно-пояснительный смысл.
- source_word: ἐλπὶς
  choice: надежда
  rationale: Прямое соответствие греческому существительному, без ненужного расширения смысла.
- source_word: καταφυγὴ
  choice: прибежище
  rationale: Передаёт место или источник защиты и естественно сочетается в поэтической речи со словом «надежда».
- source_word: τῶν πτωχῶν
  choice: бедных
  rationale: Сохраняет прежде всего социально-экономический оттенок πτωχός; более широкое «нуждающихся» могло бы размыть его.
- source_word: σύ
  choice: Ты —
  rationale: Явно выраженное местоимение сохранено для смыслового акцента; тире естественно оформляет русское именное сказуемое без добавления связки.
- source_word: ὁ θεός
  choice: Боже
  rationale: Артиклированная форма именительного падежа по функции является прямым обращением; русский звательный остаток «Боже» передаёт это естественно и достойно.
