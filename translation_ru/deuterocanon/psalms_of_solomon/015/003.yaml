translation:
  language: ru
  text: Ибо кто силён, Боже, если не в том, чтобы благодарить Тебя в истине?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздавать Тебе хвалу в истине»; греческий глагол может также означать открыто признавать или исповедовать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: кто
  rationale: Прямое вопросительное местоимение вводит риторический вопрос; «кто» точно и естественно передаёт греческое слово.
- source_word: ἰσχύει
  choice: в силах
  rationale: Глагол обозначает силу или способность; сочетание с инфинитивом по-русски естественно передаётся выражением «в силах».
- source_word: ὁ θεός
  choice: Боже
  rationale: Артиклевая форма именительного падежа употреблена как обращение; русский звательный остаток «Боже» сохраняет молитвенный характер строки.
- source_word: ἐξομολογήσασθαί
  choice: благодарить
  rationale: В библейском греческом этот глагол с дательным лица часто означает благодарение или хвалу. Здесь «благодарить» лучше соответствует богослужебному контексту и не создаёт узко покаянного смысла русского «исповедоваться».
- source_word: σοι
  choice: Тебя
  rationale: При русском глаголе «благодарить» адресат выражается винительным падежом, хотя в греческом стоит дательный.
- source_word: ἐν ἀληθείᾳ
  choice: истинно
  rationale: Наречное употребление естественно передаёт значение правдивости и искренности, сохраняя связь с «истиной».
theological_decisions:
- issue: Значение ἐξομολογήσασθαί в молитвенном контексте
  choice: благодарить Тебя
  alternative: исповедовать Тебя; воздавать Тебе хвалу
  rationale: В Септуагинте ἐξομολογέομαι с дательным Бога преимущественно обозначает благодарение или хвалу. «Благодарить» сохраняет это основное значение, тогда как «исповедоваться Тебе» могло бы ошибочно подразумевать исповедание грехов.
- issue: Эллиптическая конструкция ἰσχύει … εἰ μή с инфинитивом
  choice: кто в силах… как не…
  alternative: кто силён… кроме как…; кто способен… если не…
  rationale: Выбранная формулировка сохраняет риторическую и несколько напряжённую конструкцию оригинала, не добавляя явно отсутствующего субъекта или объекта способности.
translation_notes:
  register: Современный литературный русский с торжественным молитвенным оттенком. Синтаксическая напряжённость риторического вопроса сохранена, но выражение «в силах» делает связь глагола с инфинитивом понятной русскому читателю.
