  text: Their inheritance will not be found for their children,[a]
translation:
  language: ru
  text: Их наследства не окажется у их детей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Их наследство не будет найдено для их детей»; то есть оно не перейдёт к их потомкам.'
    reason: Греческий дательный τοῖς τέκνοις допускает оттенки обладания, предназначения или передачи, а страдательная форма εὑρεθήσεται буквально означает «будет найдено».
lexical_decisions:
- source_word: ἡ κληρονομία αὐτῶν
  choice: их наследства
  rationale: «Наследство» прямо передаёт семейно-правовой смысл κληρονομία. Родительный падеж естественно обусловлен русской отрицательной конструкцией «не окажется».
- source_word: οὐχ εὑρεθήσεται
  choice: не окажется
  rationale: Будущее страдательное εὑρίσκω буквально означает «не будет найдено». В данном контексте русское «не окажется» естественно сохраняет сдержанный смысл отсутствия, не превращая его прямо в «не перейдёт» или «не достанется».
- source_word: τοῖς τέκνοις αὐτῶν
  choice: у их детей
  rationale: Предлог «у» естественно передаёт возможное значение обладания при греческом дательном и не ограничивает τέκνα только малолетними детьми; речь может идти о потомках.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. «Не окажется у» звучит естественнее буквального страдательного оборота, при этом сохраняет неоднозначность греческого текста относительно отсутствия наследства и его неперехода к потомкам.
