base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/009.yaml
  text: For they will flee from the holy ones as those pursued by war[a], but they will pursue sinners and overtake them; and those who practice lawlessness will not escape the Lord’s judgment[c][b]; they will be captured like those seized by experienced enemies.
translation:
  language: ru
  text: 'Ибо они побегут от благочестивых, словно гонимые войной[a], но грешников будут преследовать и настигнут. Творящие беззаконие не избегнут суда Господа: их захватят, как захватывают опытные враги.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сжатое греческое выражение можно также понять: «словно люди, гонимые войной».'
    reason: alternative_reading
lexical_decisions:
- source_word: φεύξονται
  choice: побегут
  rationale: Будущая форма прямо передаёт бегство; «побегут» естественно сочетается с ἀπό («от»).
- source_word: ὡς διωκόμενοι πολέμου
  choice: словно преследуемые на войне
  rationale: Сохраняет сжатый и несколько неоднозначный военный образ греческого текста, не уточняя без основания, кем именно ведётся преследование.
- source_word: ἀπὸ ὁσίων
  choice: от благочестивых
  rationale: ὅσιοι здесь обозначает благочестивых, верных Богу людей; такой перевод отличает термин от ἅγιοι («святые») и не придаёт ему позднейшего специального смысла.
- source_word: καταδιώξονται
  choice: будут преследовать
  rationale: Передаёт усиленное значение погони, сохраняя словесную связь с предшествующим «преследуемые».
- source_word: καταλήψονται
  choice: настигнут
  rationale: В последовательности «преследовать и настигнуть» естественно выражает успешное завершение погони.
- source_word: οἱ ποιοῦντες ἀνομίαν
  choice: творящие беззаконие
  rationale: Причастный оборот передаёт характерное, продолжающееся поведение, а не только постоянный ярлык.
- source_word: τὸ κρίμα Κυρίου
  choice: суда Господа
  rationale: «Суд» сохраняет широкий смысл κρίμα — судебного решения или осуждения — без преждевременного сужения до одного значения.
- source_word: ὡς ὑπὸ πολεμίων ἐμπείρων καταλημφθήσονται
  choice: их настигнут, как настигают опытные враги
  rationale: Естественная русская конструкция сохраняет пассивный смысл, повтор глагола «настигать» и характеристику врагов как опытных.
theological_decisions:
- issue: Передача κύριος в выражении τὸ κρίμα Κυρίου
  choice: суда Господа
  alternative: суда Владыки
  rationale: «Господь» является прямым и традиционно понятным соответствием κύριος; греческий текст не даёт оснований вводить здесь конкретную форму божественного имени.
- issue: Обозначение ὅσιοι
  choice: благочестивые
  alternative: святые
  rationale: Выбор отражает религиозную верность и благочестие, не смешивая ὅσιοι с более общим обозначением ἅγιοι и не превращая слово в конфессиональный титул.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксический параллелизм и военная образность сохранены; сжатая неоднозначность первого сравнения пояснена в сноске.
