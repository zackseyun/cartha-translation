base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/006.yaml
  text: The one who does these things will never be shaken by evil[d][c][b][a]; a flame of fire and the wrath of the unrighteous will not touch him.
translation:
  language: ru
  text: Тот, кто поступает так, вовек не поколеблется ни от зла, ни от пламени огня[a]; и гнев, обращённый на неправедных[b], его не коснётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пламени огня»; возможно также: «огненного пламени». Родительный падеж слова «пламя» указывает, что оно, вероятнее всего, продолжает оборот «от зла», а не служит подлежащим при словах «не коснётся».'
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: 'Возможно также: «гнев неправедных». Греческий родительный падеж допускает оба понимания: гнев может быть направлен на неправедных или исходить от них.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὁ ποιῶν ταῦτα
  choice: Тот, кто поступает так
  rationale: Субстантивированное причастие передано естественной обобщающей конструкцией; ταῦτα отсылает к описанным ранее поступкам, поэтому «поступает так» звучит по-русски естественнее буквального «делает это».
- source_word: οὐ σαλευθήσεται εἰς τὸν αἰῶνα
  choice: вовек не поколеблется
  rationale: Будущее пассивное σαλευθήσεται выражает утрату устойчивости, а εἰς τὸν αἰῶνα усиливает отрицание указанием на непреходящую длительность.
- source_word: ἀπὸ κακοῦ
  choice: от зла
  rationale: κακόν допускает значения нравственного зла и бедствия; «зло» сохраняет широкую нравственно-разрушительную окраску и связь с последующими угрозами.
- source_word: φλογὸς πυρός
  choice: от пламени огня
  rationale: Родительный φλογός синтаксически естественно продолжает управление ἀπό; русское «пламя огня» сохраняет яркую, несколько семитизированную образность исходного оборота.
- source_word: ὀργὴ ἀδίκων
  choice: гнев, обращённый на неправедных
  rationale: Родительный ἀδίκων может быть объективным; ближайший контекст связывает этот гнев с судом над грешниками, поэтому направление гнева выражено явно, но альтернативное понимание сохранено в примечании.
- source_word: οὐχ ἅψεται αὐτοῦ
  choice: его не коснётся
  rationale: ἅπτομαι буквально означает «касаться, достигать»; выбранная формулировка естественна и сохраняет образ защищённости.
theological_decisions:
- issue: Означает ли ἀπὸ κακοῦ нравственное зло или причиняемый вред/бедствие?
  choice: от зла
  alternative: от беды; от вреда
  rationale: «Зло» сохраняет смысловую широту греческого слова и не сводит обещание лишь к физическому ущербу.
- issue: Является ли ἀδίκων субъективным или объективным родительным?
  choice: гнев, обращённый на неправедных
  alternative: гнев неправедных
  rationale: Форма сама по себе двусмысленна, однако ближайший контекст следующего стиха указывает на гнев суда против грешников. Подлинная грамматическая неоднозначность отмечена в сноске.
- issue: К какой части предложения относится φλογὸς πυρός?
  choice: 'продолжение оборота с ἀπό: «от пламени огня»'
  alternative: «пламя огня» как субъект глагола «не коснётся»
  rationale: φλογός стоит в родительном падеже, а не в именительном, поэтому лучше всего понимать его как второй член, управляемый ἀπό. Это предотвращает грамматически необоснованное превращение «пламени» в субъект следующего глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Вовек» сохраняет достоинство и ритм без архаической перегруженности; синтаксическая неоднозначность греческого текста не скрыта, а вынесена в примечания.
