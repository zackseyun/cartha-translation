  yaml_path: translation/deuterocanon/psalms_of_solomon/015/015.yaml
  text: But those who fear the Lord will be shown mercy in it[a], and they will live by the mercy of their God, but sinners will perish forever.
translation:
  language: ru
  text: Но боящиеся Господа будут помилованы в ней[a] и будут жить милостью своего Бога, а грешники погибнут навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в ней». Вероятно, речь идёт о ранее упомянутом дне суда Господа; возможно также указание на землю из предыдущей строки.'
    reason: Сохранение неоднозначного антецедента греческого местоимения.
lexical_decisions:
- source_word: φοβούμενοι
  choice: боящиеся
  rationale: Субстантивированное причастие обозначает людей, для которых характерен страх перед Господом; «боящиеся Господа» — естественное для библейской поэзии выражение, сохраняющее смысл благоговейного страха.
- source_word: κύριον
  choice: Господа
  rationale: Обычное и уместное в данном религиозном контексте соответствие κύριος.
- source_word: ἐλεηθήσονται
  choice: будут помилованы
  rationale: Будущее страдательного залога передано явно; формулировка подчёркивает, что милость им оказывается, а не заслуживается ими.
- source_word: ἐν αὐτῇ
  choice: в ней
  rationale: Сохранены местоименная форма и невыраженный антецедент греческого текста. Женский род допускает соотнесение как с ранее упомянутым днём, так и с землёй; пояснение дано в сноске.
- source_word: ἐν τῇ ἐλεημοσύνῃ
  choice: милостью
  rationale: Здесь ἐλεημοσύνη означает Божью милость, а не милостыню; творительный падеж естественно передаёт основание или средство, благодаря которому они живут.
- source_word: ἀπολοῦνται
  choice: погибнут
  rationale: Передаёт тяжесть суда и не уточняет сверх текста способ или характер гибели.
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: навеки
  rationale: Кратко и естественно передаёт усиленное указание на неограниченную длительность.
theological_decisions:
- issue: Антецедент местоимения αὐτῇ
  choice: В основном тексте сохранено местоимение «в ней» без явного антецедента.
  alternative: Можно было перевести «в тот день», связывая местоимение с ранее упомянутым днём суда Господа, либо понимать его как указание на землю.
  rationale: Греческий текст данного стиха не называет существительное повторно. Буквальная местоименная передача сохраняет реальную неоднозначность и не разрешает её без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, псалмическим звучанием. Синтаксис остаётся ясным, а повтор слов, связанных с милостью, сохранён как значимый элемент оригинала.
