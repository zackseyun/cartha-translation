lexical_decisions:
- source_word: σημεῖον
  choice: знак
  rationale: «Знак» сохраняет широкий смысл распознаваемого указания или обозначения, не сводя слово непременно к физической метке; альтернативный оттенок отмечен в сноске.
- source_word: δικαίους / δικαίων
  choice: праведные / праведных
  rationale: Субстантивированное прилагательное обозначает праведных как группу; такой способ передачи естественен для современного литературного русского языка и сохраняет повтор исходного слова.
- source_word: εἰς σωτηρίαν
  choice: для спасения
  rationale: Передаёт целевую направленность εἰς и сохраняет богословски ёмкое значение σωτηρία, не сужая его до одного лишь избавления от конкретной беды.
- source_word: λιμός
  choice: голод
  rationale: В перечне бедствий слово обозначает массовый голод, а не просто индивидуальное чувство голода.
- source_word: ῥομφαία
  choice: меч
  rationale: Стандартная и контекстуально уместная передача образа войны и насильственной гибели.
- source_word: θάνατος
  choice: смерть
  rationale: Это прямое значение греческого слова. Возможный в традиционных перечнях бедствий оттенок «мор» не вносится в основной текст без достаточной необходимости, но отмечается в сноске.
- source_word: μακράν
  choice: далеки от
  rationale: Естественно передаёт пространственно-образное удаление названных бедствий от праведных.
theological_decisions:
- issue: Характер «знака Божьего» и его отношение к спасению
  choice: Сохранена открытая формулировка «знак Божий — на праведных, для спасения»
  alternative: «Божья метка на праведных спасает их»
  rationale: Исходный текст не уточняет физическую форму знака и не выражает глаголом точный механизм его действия; поэтому перевод не превращает образ в однозначное утверждение о метке или причинном действии.
- issue: Значение θάνατος в перечне бедствий
  choice: смерть
  alternative: мор
  rationale: Основной перевод следует явному греческому словоупотреблению, сохраняя возможность идиоматического значения «мор» в примечании и не устраняя подлинную лексико-контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Эллиптическое построение первой части сохранено с помощью тире; повтор слова «праведных» удерживает композицию греческого текста.
