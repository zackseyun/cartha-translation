  yaml_path: translation/deuterocanon/psalms_of_solomon/015/001.yaml
  text: When I was in distress[a], I called on the name of the Lord; I hoped for help from the God of Jacob[b], and I was saved.
translation:
  language: ru
  text: Когда я был в беде, я призвал имя Господа; я уповал на помощь Бога Иакова и был спасён[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавлен».'
    reason: Лексически σῴζω может обозначать как спасение вообще, так и конкретное избавление от беды.
lexical_decisions:
- source_word: Ἐν τῷ θλίβεσθαί με
  choice: Когда я был в бедствии
  rationale: Конструкция ἐν с субстантивированным инфинитивом передаёт время действия («когда»), а θλίβεσθαι обозначает состояние притеснения, скорби или бедствия. Выбранная формулировка естественна по-русски и не сужает смысл до конкретного вида несчастья.
- source_word: ἐπεκαλεσάμην
  choice: я призвал
  rationale: Средняя форма в данном контексте означает молитвенно призвать, обратиться с воззванием; «призвал» сохраняет обычную библейскую формулу с последующим «имя Господа».
- source_word: τὸ ὄνομα Κυρίου
  choice: имя Господа
  rationale: Сохранено устойчивое библейское выражение, в котором призывание имени означает обращение к самому Господу.
- source_word: εἰς βοήθειαν ἤλπισα τοῦ θεοῦ Ἰακώβ
  choice: я уповал на помощь Бога Иакова
  rationale: 'Порядок и связи слов естественнее всего понимать так: εἰς βοήθειαν является предметом упования, а τοῦ θεοῦ Ἰακώβ определяет источник или принадлежность помощи. Русское «уповал на помощь Бога Иакова» точно и естественно передаёт эту конструкцию.'
- source_word: ἐσώθην
  choice: был спасён
  rationale: Пассивный аорист σῴζω прямо передан как «был спасён»; контекст допускает также конкретное избавление от бедствия, что отмечено в сноске.
theological_decisions:
- issue: Смысл ἐσώθην в контексте бедствия
  choice: был спасён
  alternative: был избавлен
  rationale: «Спасён» сохраняет основное и более широкое значение глагола, не исключая конкретного избавления; альтернативный контекстуальный оттенок вынесен в сноску, чтобы не навязывать исключительно сотериологическое прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формы «призвал имя Господа» и «Бог Иакова» сохранены как узнаваемые библейские выражения; архаизмы и конфессионально окрашенные добавления не использованы.
