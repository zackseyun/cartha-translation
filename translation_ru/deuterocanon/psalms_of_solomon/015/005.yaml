lexical_decisions:
- source_word: ψαλμὸν καινὸν μετὰ ᾠδῆς
  choice: новый псалом с песнью
  rationale: «Псалом» сохраняет религиозно-поэтическое значение ψαλμός, «новый» прямо передаёт καινός, а «с песнью» естественно и достаточно формально отражает μετὰ ᾠδῆς.
- source_word: ἐν εὐφροσύνῃ καρδίας
  choice: в радости сердца
  rationale: Формулировка сохраняет внутренний источник радости и поэтическую конструкцию с родительным падежом.
- source_word: καρπὸν χειλέων
  choice: плод уст
  rationale: Сохранена библейская метафора плода, обозначающая произносимую хвалу или исповедание, без сведения её просто к «словам».
- source_word: ἐν ὀργάνῳ ἤρμοσμένῳ γλώσσης
  choice: на настроенном орудии языка
  rationale: «Орудие» передаёт ὄργανον, «настроенном» — музыкальный оттенок ἤρμοσμένῳ, а родительная конструкция «языка» сохраняет компактный образ греческого текста.
- source_word: ἀπαρχὴν χειλέων
  choice: начаток уст
  rationale: «Начаток» сохраняет образ первого приношения, тогда как более общее «приношение» ослабило бы связь с культовой образностью.
- source_word: ἀπὸ καρδίας ὁσίας καὶ δικαίας
  choice: от святого и праведного сердца
  rationale: «Святого и праведного» естественно сохраняет религиозно-нравственную пару ὁσίας καὶ δικαίας.
