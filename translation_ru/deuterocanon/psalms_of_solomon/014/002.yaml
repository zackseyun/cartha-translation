lexical_decisions:
- source_word: ὅσιοι / ὅσιοι αὐτοῦ
  choice: благочестивые / Его благочестивые
  rationale: ὅσιος обозначает людей, отличающихся благочестием и верностью Богу. «Благочестивые» сохраняет религиозно-нравственный смысл и не привносит более поздних церковных оттенков, возможных у слова «святые».
- source_word: Κυρίου / τοῦ κυρίου
  choice: Господни / Господа
  rationale: В первом обороте форма «Господни» естественно передаёт принадлежность людей Господу, а во втором «рай Господа» яснее и современнее; оба варианта передают родительный падеж κύριος.
- source_word: ζήσονται
  choice: будут жить
  rationale: Прямо и естественно передаёт будущее время глагола ζάω.
- source_word: ἐν αὐτῷ
  choice: по нему
  rationale: С учётом ближайшего контекста местоимение, вероятнее всего, относится к «закону» из предыдущего стиха; «жить по нему» естественно выражает жизнь согласно закону. Формальная неоднозначность греческого отмечена в сноске.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Краткий, возвышенный и понятный эквивалент устойчивого выражения со значением непрестанной, вечной жизни.
- source_word: παράδεισος
  choice: рай
  rationale: «Рай» сохраняет возвышенные и эсхатологические ассоциации греческого παράδεισος.
- source_word: τὰ ξύλα τῆς ζωῆς
  choice: деревья жизни
  rationale: Сохраняется явное множественное число τὰ ξύλα, несмотря на привычный библейский образ единственного «дерева жизни».
theological_decisions:
- issue: Отнесение местоимения в ἐν αὐτῷ
  choice: «по нему» — к закону из предыдущего стиха
  alternative: «в Нём» — к Господу
  rationale: Форма αὐτῷ сама по себе допускает оба отнесения. Ближайший контекст указывает на закон, однако неоднозначность не устраняется и вынесена в сноску.
- issue: Метафорическая сила второй части
  choice: 'Три именительные группы переданы как отождествление: «рай Господа, деревья жизни, — Его благочестивые»'
  alternative: Рай Господа принадлежит Его благочестивым; Его благочестивые находятся в раю Господа
  rationale: В греческом нет выраженного глагола, а три формы именительного падежа стоят в приложении. Тире сохраняет смелое поэтическое отождествление, не превращая его в отношение принадлежности или местонахождения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Господни» и «вовеки» поддерживают поэтическое достоинство строки, оставаясь понятными; пунктуация сохраняет параллелизм и метафорическое отождествление оригинала.
