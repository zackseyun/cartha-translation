base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/004.yaml
  text: But not so the sinners and the lawless[a], who loved a day of sharing in their sin; their desire lay in the brevity of corruption,
translation:
  language: ru
  text: Но не таковы грешники и беззаконники, полюбившие день участия в своём грехе; их желание — в кратковечности тления[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в малости тления»; возможно также: «в ничтожности тления».'
    reason: Греческое μικρότης может обозначать краткость, малость или ничтожность, а контекст поддерживает временной оттенок, не исключая качественного.
lexical_decisions:
- source_word: καὶ οὐχ οὕτως
  choice: Но не таковы
  rationale: Передаёт резкое противопоставление предыдущим стихам и естественно вводит в русском языке названных далее грешников и беззаконников.
- source_word: οἱ ἁμαρτωλοὶ καὶ παράνομοι
  choice: грешники и беззаконники
  rationale: Сохраняет оба греческих обозначения, не сводя нравственную и законопреступную характеристики к одному слову.
- source_word: οἱ ἠγάπησαν ἡμέραν
  choice: полюбившие день
  rationale: Сохраняет необычную сжатость выражения и единственное число ἡμέραν, не заменяя его более общим понятием времени.
- source_word: ἐν μετοχῇ ἁμαρτίας αὐτῶν
  choice: участия в своём грехе
  rationale: «Участие» прямо передаёт μετοχή, а возвратное «своём» естественно соотносит αὐτῶν с субъектом придаточного оборота.
- source_word: ἐν μικρότητι σαπρίας
  choice: в кратковечности тления
  rationale: В контексте противопоставления вечной участи праведных выражение указывает на недолговечность того, что подвержено распаду. «Тление» сохраняет образ разложения в σαπρία, а не сводит его к современному значению административной коррупции.
- source_word: ἡ ἐπιθυμία αὐτῶν
  choice: их желание
  rationale: Нейтральное «желание» сохраняет широкий смысл ἐπιθυμία; именная конструкция с тире отражает сжатость греческой фразы.
theological_decisions:
- issue: Временное или качественное значение μικρότης в выражении ἐν μικρότητι σαπρίας
  choice: 'Основной текст передаёт временной оттенок: «в кратковечности тления».'
  alternative: «в малости тления» или «в ничтожности тления»
  rationale: Предыдущий контекст противопоставляет постоянство святых преходящей участи грешников, однако само слово допускает буквальное значение малости; неоднозначность отмечена в сноске, а не устранена без оговорки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Сохранены параллельные нравственные обозначения и необычная сжатость греческого синтаксиса; спорное выражение не превращено в анахроничную «мелкую коррупцию».
