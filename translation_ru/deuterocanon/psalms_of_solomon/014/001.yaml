base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/001.yaml
  text: The Lord is faithful to those who love him in truth[a], to those who endure his discipline, to those who walk in the righteousness of his commandments[b], in the law that he commanded us for our life.
translation:
  language: ru
  text: Господь верен тем, кто любит Его в истине, кто стойко переносит Его воспитание[a], кто ходит в праведности Его повелений[b] — в законе, который Он заповедал нам для нашей жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его наставление» или «Его вразумление». Греческое παιδεία может означать обучение, воспитание и исправляющее воздействие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς
  choice: верен
  rationale: Предикативное прилагательное выражает надёжность и постоянство Господа по отношению к перечисленным людям; «верен» естественно и сохраняет богословскую весомость выражения.
- source_word: Κύριος
  choice: Господь
  rationale: В иудейско-греческом молитвенном контексте слово выступает как божественный титул.
- source_word: ἀγαπῶσιν
  choice: любит
  rationale: Прямой современный эквивалент, сохраняющий личный и заветный оттенок глагола.
- source_word: ἐν ἀληθείᾳ
  choice: в истине
  rationale: 'Формулировка сохраняет структуру греческого выражения и его возможную смысловую широту: истинность, искренность и верность истине.'
- source_word: ὑπομένουσιν
  choice: стойко принимает
  rationale: Глагол обозначает терпеливую стойкость под воздействием трудного или исправляющего опыта; сочетание естественнее по-русски, чем буквальное «претерпевает вразумление».
- source_word: παιδείαν
  choice: вразумление
  rationale: В контексте Божьего нравственного формирования слово включает исправление и наставление; «вразумление» передаёт оба оттенка лучше, чем узко карательное «наказание».
- source_word: πορευομένοις
  choice: ходит
  rationale: Сохранена библейская метафора жизненного поведения, понятная в современном литературном русском языке.
- source_word: δικαιοσύνῃ
  choice: праведности
  rationale: Контекст говорит о правильной жизни согласно Божьим повелениям; «праведность» сохраняет обычный религиозно-нравственный смысл слова, не исключая оттенка справедливости.
- source_word: προσταγμάτων
  choice: повелений
  rationale: Слово обозначает предписания или приказы; «повеления» соответствует возвышенному поэтическому регистру и не смешивается с последующим «законом».
- source_word: νόμῳ
  choice: законе
  rationale: Стандартный и прозрачный эквивалент в контексте Божьих повелений.
- source_word: εἰς ζωὴν ἡμῶν
  choice: для нашей жизни
  rationale: Сохранено единственное число ζωή и целевая направленность εἰς; выражение представляет закон как данный ради жизни общины.
theological_decisions:
- issue: Связь выражения «в законе» с предшествующей частью
  choice: Передать через пояснительное тире как дальнейшее определение сферы хождения по Божьим повелениям
  alternative: Начать отдельную синтаксическую единицу или непосредственно присоединить без знака пояснения
  rationale: Греческий текст допускает тесную связь как с «ходящими», так и с «повелениями». Тире сохраняет непрерывность перечисления и показывает пояснительный характер фразы, не превращая её в отдельное утверждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейско-поэтическим звучанием. Сохранены параллельные обороты «кто…», метафора хождения и формула «в истине»; местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской религиозной издательской традиции.
