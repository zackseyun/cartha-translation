  to: Поэтому их наследие — царство мёртвых[a], тьма и погибель, и в день милости к праведным[b] они не будут найдены. Но верные Господу унаследуют жизнь в радости.
  rationale: 'Исправлена неточная характеристика ᾅδης в сноске: «царство мёртвых» сохранено как ясный контекстуальный перевод, но не представлено как буквальное значение. «Благочестивые Господа» заменено на естественное для современного русского «верные Господу»; это передаёт смысл οἱ ὅσιοι Κυρίου без отождествления с ἅγιοι. Неоднозначность выражения ἐν ἡμέρᾳ ἐλέους δικαίων сохранена и отмечена сноской.'
