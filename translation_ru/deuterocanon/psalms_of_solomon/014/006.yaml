    rationale: Буквально это «Аид»; «область/царство мёртвых» — объяснительный перевод. Формулировку сноски следует уточнить.
  - severity: medium
    issue: «Благочестивые Господа» не вполне естественно в современном русском.
    rationale: Греческий родительный выражает принадлежность; по-русски «верные Господу» передаёт требуемую связь естественнее, сохраняя религиозно-нравственный смысл ὅσιοι.
