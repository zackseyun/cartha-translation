base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/006.yaml
  text: Therefore Hades and darkness and destruction are their inheritance[a], and they will not be found in the day of mercy for the righteous[d][c][b]. But the holy ones of the Lord will inherit life in gladness.
translation:
  language: ru
  text: Поэтому их наследие — царство мёртвых[a], тьма и погибель, и в день милости к праведным[b] они не будут найдены. Но верные Господу унаследуют жизнь в радости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. ᾅδης (Аид) — область, или царство, мёртвых; это слово не обязательно означает «ад» в более позднем смысле места окончательного наказания.
    reason: cultural_note
  - marker: b
    text: 'Возможно также: «в день милости праведных». Греческая конструкция допускает понимание праведных либо как получателей милости, либо как тех, кому она принадлежит или от кого исходит.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующего контекста кратко и естественно.
- source_word: κληρονομία
  choice: наследие
  rationale: Сохраняет образ наследования и поддерживает смысловую перекличку с глаголом κληρονομήσουσιν далее в стихе.
- source_word: ᾅδης
  choice: царство мёртвых
  rationale: Передаёт древнегреческое обозначение области умерших, не привнося более позднее и узкое представление об аде как месте окончательного наказания.
- source_word: σκότος
  choice: тьма
  rationale: Прямой и стилистически уместный эквивалент в трёхчленном перечислении.
- source_word: ἀπώλεια
  choice: погибель
  rationale: Передаёт гибель и окончательную утрату; слово естественно для возвышенного библейского регистра и не требует уточнения характера уничтожения.
- source_word: οὐχ εὑρεθήσονται
  choice: они не будут найдены
  rationale: Сохраняет будущее время и пассивную форму греческого выражения, не уточняя, кто именно их не найдёт.
- source_word: ἐν ἡμέρᾳ ἐλέους δικαίων
  choice: в день милости к праведным
  rationale: Понимает родительный δικαίων как указание на тех, кому оказывается милость; неоднозначность конструкции отмечена в сноске.
- source_word: ὅσιοι
  choice: благочестивые
  rationale: Различает ὅσιοι и ἅγιοι и передаёт преданность Богу и благочестие, не заменяя их словом «святые».
- source_word: Κυρίου
  choice: Господа
  rationale: Прямо сохраняет родительную конструкцию и принадлежность благочестивых Господу.
- source_word: κληρονομήσουσιν ζωὴν
  choice: унаследуют жизнь
  rationale: Сохраняет мотив наследия и явный контраст с наследием нечестивых в первой части стиха.
- source_word: ἐν εὐφροσύνῃ
  choice: в радости
  rationale: Естественно и ясно передаёт радостное состояние, сохраняя предложную конструкцию.
theological_decisions:
- issue: Значение ᾅδης
  choice: царство мёртвых
  alternative: ад; Аид; преисподняя
  rationale: Греческое слово обозначает область умерших и само по себе не требует позднейшего богословского содержания, часто связываемого в русском языке со словом «ад».
- issue: Смысл δικαίων в выражении ἐν ἡμέρᾳ ἐλέους δικαίων
  choice: милость направлена к праведным
  alternative: милость исходит от праведных
  rationale: Контраст с участью нечестивых лучше поддерживает понимание праведных как получателей милости, однако грамматически возможное иное прочтение сохранено в сноске.
- issue: Передача ὅσιοι
  choice: благочестивые
  alternative: верные; святые
  rationale: «Благочестивые» передаёт религиозную преданность, характерную для ὅσιοι, и не стирает различия с обычным греческим словом ἅγιοι — «святые».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены параллелизм, трёхчленное перечисление и повтор мотива наследия; редкое сочетание «благочестивые Господа» оставлено ради точной передачи принадлежности без добавления отсутствующего в тексте предлога.
