  source_fidelity: 'Основной смысл передан точно: сохранены выводное «поэтому», трёхчастное описание удела, будущее страдательное «не будут найдены» и противопоставление благочестивых. Однако ᾅδης не означает буквально «царство мёртвых»: это толковательный эквивалент. Кроме того, конструкция «благочестивые Господа» формально понятна, но для современного литературного русского звучит неестественно.'
  naturalness: «Царство мёртвых» читается естественно, но сноска должна отличать переводческое пояснение от буквального значения. «Верные Господу» — более естественная русская передача принадлежности и благочестия, выраженного οἱ ὅσιοι Κυρίου, без церковнославянской тяжеловесности.
  terminology: «Погибель», «наследие/унаследуют», «тьма» и «радость» уместны. «Верные Господу» хорошо передаёт ὅσιοι как людей, отличающихся благочестием и верностью, не смешивая этот термин с ἅγιοι («святые»). Неоднозначность δικαίων следует оставить в сноске.
