base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/003.yaml
  text: Their planting is rooted forever[a]; they will not fail all the days of heaven[d][c][b], because Israel is the portion and inheritance of God.
translation:
  language: ru
  text: Их насаждение укоренено навеки; они не исчезнут[a] во все дни неба[b], потому что Израиль — удел и наследие Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не прекратят существовать», «не придут к концу».'
    reason: lexical_alternative
  - marker: b
    text: «Во все дни неба» — буквальное возвышенное выражение, обозначающее всю длительность существующего миропорядка.
    reason: cultural_note
lexical_decisions:
- source_word: φυτεία
  choice: насаждение
  rationale: Сохраняет образ посаженного и не уточняет сверх греческого текста, идёт ли речь о самом народе или о том, что было насаждено.
- source_word: ἐρριζωμένη
  choice: укоренено
  rationale: Передаёт ботанический образ и устойчивое состояние, выраженное перфектным страдательным причастием.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Естественно передаёт контекстуальный смысл непреходящей устойчивости.
- source_word: ἐκλήξουσιν
  choice: не исчезнут
  rationale: В современном русском ясно выражает прекращение существования, при этом не вводит значение неудачи или неверности.
- source_word: πάσας τὰς ἡμέρας τοῦ οὐρανοῦ
  choice: во все дни неба
  rationale: Сохраняет необычный возвышенный образ оригинала, не заменяя его толкованием «пока существует небо».
- source_word: μερὶς
  choice: удел
  rationale: Передаёт значение выделенной доли и соответствует библейскому языку принадлежности.
- source_word: κληρονομία
  choice: наследие
  rationale: Сохраняет смысл наследственного достояния и хорошо сочетается со словом «удел».
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: Прямо передаёт родительный падеж принадлежности без дополнительного богословского истолкования.
theological_decisions:
- issue: Израиль как принадлежащие Богу удел и наследие
  choice: Израиль — удел и наследие Бога
  alternative: Израиль — Божий удел и наследие
  rationale: Выбранная конструкция близка порядку и грамматике греческого текста и сохраняет утверждение о принадлежности, не развивая его в конфессиональное толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Необычное выражение «дни неба» сохранено намеренно и пояснено в сноске; сельскохозяйственный образ последовательно передан словами «насаждение» и «укоренено».
