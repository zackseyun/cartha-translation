base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/005.yaml
  text: And they did not remember God[a], that the ways of men are known before him continually[c][b], and he knows the secrets of the heart before they come to be.
translation:
  language: ru
  text: И они не вспомнили о Боге — о том, что пути людей всегда известны пред Ним и что тайны сердца[a] Он знает прежде, чем они возникнут[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внутренние комнаты (или кладовые) сердца»; по смыслу — всё сокрытое в сердце.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прежде, чем они появятся» либо «прежде, чем они станут существовать». Греческое выражение имеет широкий смысл: «до того, как они возникнут».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν τοῦ θεοῦ
  choice: не вспомнили о Боге
  rationale: Греческий аорист передаёт факт того, что они не вспомнили и не приняли Бога во внимание; русское «не вспомнили о Боге» естественно и сохраняет нравственный оттенок выражения.
- source_word: ὁδοὶ ἀνθρώπων
  choice: пути людей
  rationale: «Пути» сохраняет библейский образ и допускает как буквальный, так и нравственный смысл — образ жизни и поступки людей.
- source_word: γνωσταὶ ἐνώπιον αὐτοῦ διὰ παντός
  choice: всегда известны пред Ним
  rationale: Формулировка передаёт постоянство Божьего знания и сохраняет образ пребывания перед Богом; «пред Ним» соответствует возвышенному, но понятному библейскому регистру.
- source_word: ταμεῖα καρδίας
  choice: тайны сердца
  rationale: Буквально ταμεῖα — внутренние комнаты или кладовые; здесь выражение метонимически обозначает сокрытое в сердце. «Тайны сердца» естественно по-русски и согласуется с последующим «возникнут», не устраняя образ полностью без пояснения.
- source_word: ἐπίσταται
  choice: знает
  rationale: Глагол означает уверенное, полное знание; «знает» ясно передаёт смысл и поддерживает параллель с «известны».
- source_word: πρὸ τοῦ γενέσθαι
  choice: прежде, чем они возникнут
  rationale: Оборот буквально означает «до того, как [они] станут / возникнут». «Возникнут» сохраняет широту греческого выражения применительно к мыслям, намерениям и другим тайнам сердца.
theological_decisions:
- issue: Объём Божьего предведения в заключительной части стиха
  choice: Бог знает тайны сердца ещё до того, как они возникнут
  alternative: Бог знает сокрытое в сердце до того, как оно проявится в поступках
  rationale: Греческий текст связывает πρὸ τοῦ γενέσθαι с сокрытым в сердце и не ограничивает знание Бога лишь будущими внешними действиями. Перевод сохраняет широкое утверждение, не привязывая его к определённой богословской системе.
- issue: Связь ὅτι с предшествующим упоминанием Бога
  choice: 'Пояснительная конструкция: они не вспомнили о Боге — о том, что Ему известны пути людей'
  alternative: 'Причинная связь: они не вспомнили Бога, потому что пути людей известны Ему'
  rationale: В данном контексте ὅτι естественнее понимать как введение содержания того, о чём они не вспомнили. Тире и оборот «о том, что» делают эту связь ясной по-русски, не превращая её в нелогичное причинное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Пред Ним» сохраняет достоинство и образность оригинала, а «тайны сердца» обеспечивает ясность без конфессионально обусловленного толкования.
