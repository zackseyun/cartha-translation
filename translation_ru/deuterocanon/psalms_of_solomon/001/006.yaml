  text: and they were insolent in their prosperity[c][b][a], and they did not endure.
translation:
  language: ru
  text: И при своём благополучии[a] они вели себя надменно, и не выдержали[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «среди своих благ»; возможно также: «пользуясь своими благами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не устояли», «не вынесли этого». В греческом не сказано, что именно они не выдержали.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξύβρισαν
  choice: вели себя надменно
  rationale: Глагол передаёт дерзкое, высокомерное, вызывающее поведение. Такое выражение сохраняет нравственную силу греческого слова и естественно звучит по-русски.
- source_word: ἐν τοῖς ἀγαθοῖς αὐτῶν
  choice: при своём благополучии
  rationale: Субстантивированное множественное ἀγαθά может обозначать блага, имущество или благополучие; в данном контексте фраза, вероятнее всего, описывает обстоятельства их достатка, но буквальная образность отмечена в сноске.
- source_word: οὐκ ἤνεγκαν
  choice: не выдержали
  rationale: Форма глагола φέρω здесь может означать «вынести», «выдержать», «устоять». Дополнение в греческом не названо, поэтому русский текст также не уточняет, чего именно они не выдержали.
