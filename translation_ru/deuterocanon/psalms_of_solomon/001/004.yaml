lexical_decisions:
- source_word: ὁ πλοῦτος αὐτῶν
  choice: их богатство
  rationale: «Богатство» прямо передаёт πλοῦτος и естественно употребляется в русском как собирательное единственное число.
- source_word: διεδόθη
  choice: распространилось
  rationale: Пассивная форма означает широкое распространение или рассеивание; возвратная русская форма звучит естественно и не привносит узкого смысла намеренной раздачи.
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: по всей земле
  rationale: Так передаётся пространственный охват выражения; русское «земля», как и греческое γῆ, допускает значение как территории, так и всего мира.
- source_word: ἡ δόξα αὐτῶν
  choice: слава их
  rationale: «Слава» сохраняет возвышенный регистр и охватывает значения чести, известности и великолепия, возможные для δόξα.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: до края земли
  rationale: Краткое, поэтичное и понятное обозначение предельной удалённости, близкое к форме греческого выражения.
theological_decisions:
- issue: Масштаб значения γῆ в двух частях стиха
  choice: В обоих случаях употреблено многозначное русское «земля».
  alternative: В первой части перевести «по всей стране», а во второй — «до края земли».
  rationale: Греческий текст дважды употребляет γῆ. Русское «земля» сохраняет его подлинную неоднозначность между определённой территорией и всем миром, не навязывая локального или всемирного понимания.
- issue: Отсутствие выраженного глагола во второй части
  choice: 'Сохранена поэтическая эллиптичность с помощью тире: «и слава их — до края земли».'
  alternative: 'Добавить «достигла»: «и слава их достигла края земли».'
  rationale: В греческой второй части глагол отсутствует и подразумевается из первой. Русская конструкция с тире остаётся понятной и сохраняет параллелизм, не уточняя действие сверх источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «слава их» и эллиптическое тире поддерживают ритм параллельных частей, оставаясь понятными современному читателю.
