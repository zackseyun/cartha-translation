  text: Suddenly[a], a cry of war was silenced before me; he will hear me[c][b], because I am filled with righteousness.
translation:
  language: ru
  text: Внезапно умолкни предо мною, крик войны![a] Он услышит меня, потому что я исполнен праведности.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое κωφωθή обычно понимают как аористный страдательный императив: «стань немым», то есть «умолкни». Возможна также передача: «будь лишён голоса». В иной реконструкции текста вместо этого читают форму со значением «предо мною был услышан крик войны».'
    reason: textual_and_grammatical_ambiguity
  - marker: b
    text: 'Или: «справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξάπινα
  choice: внезапно
  rationale: Передаёт резкое, неожиданное наступление события и естественно звучит в современном русском языке.
- source_word: κωφωθὴ
  choice: умолкни
  rationale: 'Форма κωφωθή естественно понимается как аористный страдательный императив второго лица единственного числа от κωφόω: буквально «стань немым/будь заглушён». В обращении к крику по-русски наиболее ясно и поэтично «умолкни».'
- source_word: κραυγὴ πολέμου
  choice: крик войны
  rationale: Сохраняет структуру греческого сочетания и допускает как буквальный крик, связанный с войной, так и боевой клич.
- source_word: ἐνώπιόν μου
  choice: предо мною
  rationale: Точное и естественное для возвышенной поэзии соответствие выражению «передо мной, в моём присутствии».
- source_word: ἐπακούσεταί μου
  choice: Он услышит меня
  rationale: Глагол может подразумевать благосклонное слушание или отклик, однако прямое «услышит» не добавляет в текст обещания ответа. Неявный субъект сохранён местоимением без вставки имени Бога.
- source_word: ἐπλήσθην
  choice: я исполнен
  rationale: Аорист передан состоянием с наличным результатом; «исполнен» естественно в поэтическом и молитвенном регистре.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: В данном религиозно-нравственном контексте «праведность» точнее основного смысла δικαιοσύνη, при сохранении возможного оттенка справедливости в примечании.
theological_decisions:
- issue: Неявный субъект ἐπακούσεταί μου
  choice: «Он услышит меня», с подразумеваемым Богом
  alternative: «Бог услышит меня» или «я буду услышан»
  rationale: Греческий текст не называет субъекта. Молитвенный контекст позволяет понимать Бога, но вставка слова «Бог» устранила бы сохранённую оригиналом неявность.
- issue: Заявление говорящего о δικαιοσύνη
  choice: «я исполнен праведности»
  alternative: «я исполнен справедливости»
  rationale: Перевод сохраняет сильное и богословски напряжённое самоутверждение говорящего, не ослабляя его пояснительной перефразировкой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Инверсия «предо мною» и обращение «крик войны» сохраняют резкость и необычность греческой фразы, не сглаживая её в повествовательное сообщение.
