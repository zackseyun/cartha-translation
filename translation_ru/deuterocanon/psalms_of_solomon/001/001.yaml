lexical_decisions:
- source_word: ἘΒΟΗΣΑ
  choice: Я воззвал
  rationale: Аорист βοάω обозначает настойчивый крик, обращённый к Богу. «Воззвал» сохраняет силу глагола и естественно звучит в возвышенной молитвенной речи.
- source_word: πρὸς Κύριον
  choice: к Господу
  rationale: πρός с винительным падежом указывает, к кому направлен зов; κύριος передано принятым в молитвенном контексте словом «Господь».
- source_word: ἐν τῷ θλίβεσθαί με
  choice: когда был тесним
  rationale: Конструкция ἐν с субстантивированным инфинитивом имеет временное значение. Пассивное «был тесним» сохраняет образ внешнего давления и не превращает выражение в отвлечённое «в скорби».
- source_word: εἰς τέλος
  choice: до конца
  rationale: 'Буквальная передача сохраняет неоднозначность: оборот может указывать на предельную степень, полноту либо продолжительность притеснения.'
- source_word: πρὸς τὸν θεὸν
  choice: к Богу
  rationale: Сохранён параллельный второй адресатный оборот, повторяющий и усиливающий молитвенный зов.
- source_word: ἐν τῷ ἐπιδέσθαι ἁμαρτωλοὺς
  choice: когда на меня напали грешники
  rationale: Форма ἐπιδέσθαι лексически трудна. В контексте плача вероятнее всего подразумевается враждебное действие грешников; объект «на меня» естественно восстанавливается по первому лицу предыдущей части и по русскому управлению.
- source_word: ἁμαρτωλοὺς
  choice: грешники
  rationale: Прямая передача обозначения людей как совершающих грех; более оценочное «нечестивцы» не требуется.
theological_decisions:
- issue: Передача κύριος в обращённой к Богу молитве
  choice: Господь
  alternative: Владыка
  rationale: «Господь» соответствует обычному библейскому употреблению и не добавляет более узкого оттенка господства.
- issue: Повтор двойного обращения «к Господу… к Богу»
  choice: Сохранить оба наименования и параллельную структуру
  alternative: Объединить обращения в одно
  rationale: Греческий текст намеренно повторяет πρός и два божественных наименования; сохранение повтора передаёт поэтическое усиление, не отождествляя его с отдельным догматическим утверждением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-поэтическим регистром. Синтаксический параллелизм оригинала сохранён; тире проясняет вторую часть, не устраняя её тесной связи с первой. Архаичные формы и конфессионально окрашенные уточнения не используются.
