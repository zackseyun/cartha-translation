  text: 'Они были вознесены до звёзд[a] и сказали: «Они никогда не падут»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до самых звёзд». Это гиперболический образ крайней высоты.'
