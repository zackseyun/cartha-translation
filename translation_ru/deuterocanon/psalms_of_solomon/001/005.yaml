    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὑψώθησαν
  choice: возвысились
  rationale: Аорист пассивной формы от ὑψόω передаёт достижение большой высоты и в данном контексте допускает как буквальный образ возвышения, так и оттенок превознесённости. Русское «возвысились» естественно сохраняет эту смысловую широту, не вводя явно действующего лица.
- source_word: ἕως τῶν ἄστρων
  choice: до самых звёзд
  rationale: ἕως с родительным обозначает предел или степень. Частица «самых» естественно передаёт предельность и гиперболическую высоту образа.
- source_word: εἶπαν
  choice: сказали
  rationale: Нейтральный повествовательный глагол речи, не требующий усилительного толкования вроде «заявили».
- source_word: Οὐ μὴ πέσωσιν
  choice: Они ни за что не падут
  rationale: Сочетание οὐ μή выражает усиленное отрицание, а πέσωσιν грамматически является формой третьего лица множественного числа. «Ни за что не падут» передаёт твёрдую уверенность и сохраняет третье лицо исходного текста.
theological_decisions:
- issue: Следует ли представить слова как самоуверенное хвастовство или как нейтральное утверждение устойчивости
  choice: Усиленное «ни за что не падут» сохраняет оттенок самоуверенного заявления.
  alternative: Более нейтральное «не падут».
  rationale: Усилительная конструкция οὐ μή требует более сильного отрицания, однако перевод не добавляет прямого нравственного осуждения.
- issue: Относится ли местоимение третьего лица к самим говорящим
  choice: 'Сохранено прямое высказывание в третьем лице: «Они… не падут».'
  alternative: «Мы ни за что не падём», если понимать говорящих как относящих слова к самим себе.
  rationale: Форма πέσωσιν — третье лицо множественного числа, поэтому замена её первым лицом устранила бы реальную грамматическую особенность и возможную неоднозначность греческого текста.
translation_notes:
  register: Современный литературный русский язык с поэтической, но понятной образностью. Формулировка сохраняет достоинство псалмового регистра, усиленное отрицание и необычное третье лицо греческой прямой речи.
