  terminology: «Грехи» — прямой и уместный эквивалент ἁμαρτίαι. «Тайными» передаёт область значений ἀπόκρυφα, не сужая её до физических «тайных мест» и не утверждая определённо, что грехи были скрыты именно от говорящего или от Бога.
