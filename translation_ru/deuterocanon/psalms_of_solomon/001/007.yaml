lexical_decisions:
- source_word: αἱ ἁμαρτίαι αὐτῶν
  choice: их грехи
  rationale: Прямо передаёт множественное число существительного ἁμαρτίαι и притяжательное αὐτῶν, не уточняя характер проступков.
- source_word: ἐν ἀποκρύφοις
  choice: совершались тайно
  rationale: Субстантивированное множественное ἀποκρύφοις употреблено кратко и, вероятнее всего, имеет обстоятельственное значение. Русское «тайно» сохраняет идею сокрытости, не сводя её непременно к физическим тайным местам; «совершались» добавлено для естественной русской связи с существительным «грехи».
- source_word: καὶ ἐγώ
  choice: и я
  rationale: Сохраняет обычное соединительное значение καί и не усиливает противопоставление посредством «но».
- source_word: οὐκ ᾔδειν
  choice: не знал
  rationale: Естественно и прямо передаёт несовершенную форму οἶδα как отсутствие знания или осведомлённости.
theological_decisions:
- issue: Характер сокрытости в ἐν ἀποκρύφοις
  choice: Грехи совершались тайно, без уточнения, от кого именно они были скрыты.
  alternative: Их грехи были в тайных местах / относились к сокрытому.
  rationale: Греческое выражение кратко и допускает несколько оттенков. Последующее «и я не знал» указывает на неведение говорящего, но не требует утверждать, что грехи были скрыты только от него или от Бога.
translation_notes:
  register: Современный литературный русский язык с простым, достойным синтаксисом. Формулировка сохраняет последовательность греческого текста и его смысловую открытость; добавленный глагол «совершались» нужен для естественного русского выражения.
