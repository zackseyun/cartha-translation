  source_fidelity: Греч. ἐν ἀποκρύφοις — краткое эллиптическое выражение («в сокрытом / тайно»), не называющее прямо ни место, ни того, от кого скрыто. Вариант «совершались тайно» передаёт допустимый смысл, однако добавляет глагол действия и аспектуальную длительность, которых в исходном именном выражении нет. «Были тайными» точнее сохраняет предикативный характер и неопределённость сокрытости. «И я не знал» прямо передаёт καὶ ἐγὼ οὐκ ᾔδειν, не превращая καί в более сильное «но».
