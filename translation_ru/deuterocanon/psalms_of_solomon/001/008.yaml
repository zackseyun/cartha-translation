  source_fidelity: 'Первая часть точно передаёт сравнительное значение ὑπὲρ: «беззакония» этой группы были больше, чем у предшествующих народов. «Святыни Господа» удачно сохраняет множественное число и не сужает τὰ ἅγια до одного только храмового помещения. Во второй части «подвергли ... кощунственному осквернению» передаёт общий смысл, но менее прямо соответствует личной активной форме ἐβεβήλωσαν; более точен глагол «осквернили».'
