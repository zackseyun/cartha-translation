  text: Their lawless deeds surpassed those of the nations before them[b][a]; they profaned the holy things of the Lord with profanation.
translation:
  language: ru
  text: Их беззакония превзошли беззакония предшествовавших им народов; они осквернили святыни Господа[a] кощунственным осквернением.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилище Господа» либо «святые места Господа». Греческое выражение стоит во множественном числе и может обозначать как священные предметы и места вообще, так и храмовое святилище.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «осквернили… осквернением»; однокоренной оборот в греческом усиливает мысль о кощунственном обращении со святыней.'
    reason: source_form
lexical_decisions:
- source_word: αἱ ἀνομίαι αὐτῶν
  choice: их беззакония
  rationale: Множественное число сохранено; «беззакония» естественно обозначает поступки, нарушающие Божий закон, не сводя выражение к отвлечённому качеству.
- source_word: ὑπὲρ τὰ πρὸ αὐτῶν ἔθνη
  choice: превзошли беззакония народов, живших прежде них
  rationale: ὑπέρ с винительным передаёт сравнение и превосходство. Повтор слова «беззакония» по-русски ясно выражает подразумеваемый объект сравнения, тогда как буквальное «превзошли народы» могло бы означать превосходство самих людей.
- source_word: ἐβεβήλωσαν
  choice: подвергли… кощунственному осквернению
  rationale: Глагол означает обращение со святыней как с чем-то несвятым, её профанацию. Перестройка с существительным позволяет естественно передать по-русски и глагол, и однокоренное усиление ἐν βεβηλώσει.
- source_word: τὰ ἅγια Κυρίου
  choice: святыни Господа
  rationale: '«Святыни» сохраняет множественное число и широту греческого выражения: речь может идти о священных предметах, местах или о святилище как сакральном пространстве.'
- source_word: ἐν βεβηλώσει
  choice: кощунственному осквернению
  rationale: Прилагательное «кощунственному» передаёт не просто загрязнение, а нарушение священного статуса; конструкция сохраняет усилительный смысл однокоренного сочетания без неестественного русского повтора.
theological_decisions:
- issue: Следует ли понимать τὰ ἅγια Κυρίου узко как храмовое святилище или шире как принадлежащие Господу святыни
  choice: святыни Господа
  alternative: святилище Господа; святые места Господа
  rationale: Форма τὰ ἅγια — средний род множественного числа — допускает храмовое значение, но сама по себе не требует ограничивать смысл одним зданием или помещением. Более широкая передача сохраняет смысловую открытость текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Избегаются как архаическое «святая Господня», так и узкое уточнение «храм», которого нет в самой формулировке стиха. Повтор «беззакония» введён ради ясности сравнения.
