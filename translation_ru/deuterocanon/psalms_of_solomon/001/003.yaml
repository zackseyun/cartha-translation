translation:
  language: ru
  text: Я подумала в сердце своём, что исполнилась праведности[a], когда благоденствовала и стала многодетной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости». Греческое слово допускает оба значения, но здесь, вероятнее всего, говорится о представлении говорящей о собственной праведности.'
