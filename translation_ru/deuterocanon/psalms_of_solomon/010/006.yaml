  yaml_path: translation/deuterocanon/psalms_of_solomon/010/006.yaml
  text: Righteous and holy is our Lord in his judgments forever[a], and Israel will praise the name of the Lord with gladness.
translation:
  language: ru
  text: Праведен и свят Господь наш в Своих судах вовек[a], и Израиль будет восхвалять имя Господа с радостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь наш праведен и свят».'
    reason: Отмечает возможный нейтральный русский порядок слов при сохранении того же предикативного смысла.
lexical_decisions:
- source_word: δίκαιος
  choice: праведен
  rationale: В предикативном употреблении по отношению к Господу слово обозначает нравственную правоту и праведность; «праведен» сохраняет богословскую полноту и не сужает смысл до одной лишь судебной справедливости.
- source_word: ὅσιος
  choice: свят
  rationale: В высказывании о Боге «свят» естественно передаёт сакрально-нравственный смысл греческого прилагательного.
- source_word: Κύριος
  choice: Господь
  rationale: Здесь слово служит божественным титулом, поэтому традиционное и ясное соответствие — «Господь».
- source_word: κρίμασιν
  choice: в судах
  rationale: Дательный падеж множественного числа указывает на Божьи суды или судебные решения; «в судах Своих» сохраняет краткость и поэтический строй оригинала.
- source_word: εἰς τὸν αἰῶνα
  choice: вовек
  rationale: Устойчивое выражение передаёт неограниченную длительность; «вовек» уместно в современной возвышенной поэтической речи.
- source_word: αἰνέσει
  choice: будет восхвалять
  rationale: Будущее время передано прямо; «восхвалять» естественно сочетается с именем Господа и соответствует торжественному регистру псалма.
- source_word: τῷ ὀνόματι Κυρίου
  choice: имя Господа
  rationale: Слово «имя» сохранено, поскольку здесь оно имеет не только номинативный, но и религиозно-репрезентативный смысл.
- source_word: ἐν εὐφροσύνῃ
  choice: с радостью
  rationale: Оборот обозначает радостный образ совершения хвалы; «с радостью» ясно и естественно для современного читателя.
theological_decisions:
- issue: Передача двух предикативных качеств Господа без смыслового сближения или замены одного из них.
  choice: праведен и свят
  alternative: справедлив и верен
  rationale: «Праведен и свят» сохраняет различие между нравственно-судебным и сакральным измерениями греческих δίκαιος и ὅσιος.
- issue: Порядок предикативных прилагательных и подлежащего.
  choice: Праведен и свят Господь наш
  alternative: Господь наш праведен и свят
  rationale: Начальная позиция качеств отражает эмфатический порядок греческого текста и естественна для возвышенной русской поэзии, не меняя содержания высказывания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмопевческим звучанием. Инверсия «Праведен и свят Господь наш» сохраняет акцент оригинала; формы «Своих» и «вовек» поддерживают достоинство стиля, оставаясь понятными.
