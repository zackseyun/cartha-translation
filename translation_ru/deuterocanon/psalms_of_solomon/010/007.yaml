base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/007.yaml
  text: And the pious will give thanks in the assembly of the people[d][c][b][a], and God will have mercy on the poor in the gladness of Israel.
translation:
  language: ru
  text: И благочестивые[a] будут благодарить в собрании народа, и Бог помилует бедных в радости Израиля.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верные»; также возможно: «святые».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также перевод: «среди радости Израиля»; по смыслу возможно: «к радости Израиля».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ὅσιοι
  choice: благочестивые
  rationale: Передаёт благочестие и верность Богу, выраженные словом ὅσιοι, не смешивая его с обычным обозначением «святых» (ἅγιοι).
- source_word: ἐξομολογήσονται
  choice: будут благодарить
  rationale: В религиозном языке Септуагинты глагол часто означает публично благодарить или воздавать хвалу; контекст собрания поддерживает это значение.
- source_word: ἐν ἐκκλησίᾳ λαοῦ
  choice: в собрании народа
  rationale: Сохраняет смысл публично собравшейся общины и естественно звучит по-русски.
- source_word: πτωχοὺς
  choice: бедных
  rationale: Прямо передаёт социальный и материальный смысл существительного, не ослабляя его до более общего «нуждающихся».
- source_word: ἐλεήσει
  choice: помилует
  rationale: Сохраняет богословскую весомость Божьего милосердного действия и соответствует будущему времени греческого глагола.
- source_word: ἐν εὐφροσύνῃ Ἰσραήλ
  choice: среди радости Израиля
  rationale: Передаёт ἐν как обозначение обстановки, в которой совершается действие, сохраняет образ общей радости и не превращает её явно в результат Божьей милости.
theological_decisions:
- issue: Обозначение группы словом ὅσιοι
  choice: благочестивые
  alternative: святые; верные
  rationale: «Благочестивые» отражает набожность и заветную верность этой группы, но не приравнивает ὅσιοι безоговорочно к «святым» и не сводит многозначное слово только к верности.
- issue: Связь выражения ἐν εὐφροσύνῃ Ἰσραήλ с Божьей милостью
  choice: среди радости Израиля
  alternative: к радости Израиля
  rationale: Греческое ἐν естественнее обозначает сферу или обстановку действия. Вариант «к радости» возможен по смыслу, но делает радость результатом милости яснее, чем это выражено в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм двух частей и повтор союза «и» сохранены; архаизмы и конфессионально окрашенная терминология не вводятся.
