  yaml_path: translation/deuterocanon/psalms_of_solomon/010/005.yaml
  text: For the testimony is in the law of the everlasting covenant[a]; the testimony of the Lord is upon the ways of men in visitation.
translation:
  language: ru
  text: Ибо свидетельство — в законе вечного завета; свидетельство Господа — о путях людей при посещении.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Ибо свидетельство в законе вечного завета — это свидетельство Господа о путях людей, когда Он посещает их».'
    reason: Греческий текст допускает понимание двух частей как единого предложения; кроме того, ἐν ἐπισκοπῇ может быть передано придаточной формой «когда Он посещает их».
lexical_decisions:
- source_word: μαρτυρία
  choice: свидетельство
  rationale: Сохраняет юридический и заветный оттенок греческого слова, а также его намеренный повтор в двух параллельных частях стиха.
- source_word: ἐν νόμῳ διαθήκης αἰωνίου
  choice: в законе вечного завета
  rationale: Близко передаёт греческую конструкцию и естественно звучит в современном литературном русском; «вечного» сохраняет αἰωνίου без дополнительного толкования.
- source_word: Κυρίου
  choice: Господа
  rationale: Передаёт κύριος как традиционный божественный титул в контексте завета.
- source_word: ἐπὶ ὁδοὺς ἀνθρώπων
  choice: над путями людей
  rationale: Сохраняет пространственно-направленную образность ἐπί и не сужает обобщённое ἀνθρώπων до обозначения только мужчин.
- source_word: ἐν ἐπισκοπῇ
  choice: при посещении
  rationale: Сохраняет именную форму и смысл божественного посещения, включающий надзор, испытание или суд, не разрешая контекстуальную неоднозначность.
- source_word: '[подразумеваемая связка]'
  choice: тире
  rationale: В греческом обе части безглагольны; русское тире естественно передаёт подразумеваемую связку и подчёркивает параллелизм.
theological_decisions:
- issue: Характер «посещения» (ἐπισκοπή)
  choice: при посещении
  alternative: при надзоре / когда Он посещает
  rationale: 'Выбрана формулировка, сохраняющая традиционно-библейскую многозначность: речь может идти о Божьем внимании, проверке, вмешательстве или суде; уточнять один из этих смыслов текст не требует.'
- issue: Синтаксическая связь двух половин стиха
  choice: два параллельных безглагольных высказывания
  alternative: 'единое высказывание: «свидетельство в законе… есть свидетельство Господа…»'
  rationale: Повтор ἡ μαρτυρία и структура греческой строки лучше поддерживают поэтический биколон, хотя синтаксически возможно и объединённое прочтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Повтор слова «свидетельство» и параллельное построение сохранены. Формула «при посещении» намеренно несколько торжественна, чтобы удержать именную форму и богословскую ёмкость ἐπισκοπή.
