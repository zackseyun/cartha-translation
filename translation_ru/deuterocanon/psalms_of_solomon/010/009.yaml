  yaml_path: translation/deuterocanon/psalms_of_solomon/010/009.yaml
  text: The Lord’s salvation is upon the house of Israel for everlasting self-control[a][b][c].
translation:
  language: ru
  text: Спасение Господа — над домом Израиля, для вечной радости[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Да будет спасение Господа над домом Израиля»; безглагольная греческая фраза может иметь силу благословительного пожелания.'
    reason: alternative_reading
  - marker: b
    text: В печатном издании Swete здесь εὐφροσύνην — «радость, ликование». Форма σωφροσύνην в переданной электронной строке означала бы «благоразумие, самообладание».
    reason: textual_note
lexical_decisions:
- source_word: τοῦ κυρίου ἡ σωτηρία
  choice: Спасение Господа
  rationale: Родительный падеж естественно передаёт принадлежность или источник; формулировка сохраняет торжественный псалмический регистр.
- source_word: ἐπὶ οἶκον Ἰσραήλ
  choice: над домом Израиля
  rationale: Сохраняется образ пребывающего над Израилем спасения и явно выраженное οἶκον — «дом».
- source_word: εἰς
  choice: для
  rationale: Предлог обозначает цель или результат; «для» сохраняет эту смысловую открытость и звучит естественно по-русски.
- source_word: εὐφροσύνην
  choice: радости
  rationale: В печатном тексте Swete стоит εὐφροσύνην — «радость, ликование». Переданная в задании форма σωφροσύνην является ошибкой транскрипции и не должна определять основной перевод.
- source_word: αἰώνιον
  choice: вечной
  rationale: Прилагательное передаёт непрекращающийся, непреходящий характер радости.
theological_decisions:
- issue: Смысл безглагольной фразы ἡ σωτηρία ἐπὶ οἶκον Ἰσραήλ
  choice: 'утверждение: «Спасение Господа — над домом Израиля»'
  alternative: 'пожелание: «Да будет спасение Господа над домом Израиля»'
  rationale: Греческая фраза не содержит глагола и допускает как утверждение, так и благословительное пожелание. В основном тексте сохранено наиболее прямое утверждение, а альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным псалмическим звучанием. Тире позволяет не вводить в безглагольную фразу лишний смысловой глагол.
