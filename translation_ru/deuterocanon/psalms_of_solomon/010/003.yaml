base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/003.yaml
  text: For he has made straight the ways of the righteous[c][b][a], and he will not pervert them in discipline.
translation:
  language: ru
  text: Ибо Он выпрямил пути[a] праведных и не искривит их[b] при вразумлении[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стези».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не извратит их» или «не уклонит их».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «во время наставления»; возможно также: «посредством исправления».'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ὤρθωσε
  choice: выпрямил
  rationale: 'Передаёт совершённое действие аориста и сохраняет пространственный образ: Бог сделал пути прямыми.'
- source_word: ὁδοὺς
  choice: пути
  rationale: Естественное для русского библейского стиля слово, обозначающее как дорогу, так и образ жизни или поведения.
- source_word: δικαίων
  choice: праведных
  rationale: Субстантивированное прилагательное в родительном множественного числа обозначает праведных людей; краткий русский эквивалент сохраняет эту форму.
- source_word: διαστρέψει
  choice: не искривит их
  rationale: Глагол противопоставлен ὤρθωσε и продолжает образ прямых и кривых путей; местоимение «их» естественно восполняет подразумеваемое дополнение «пути».
- source_word: ἐν παιδείᾳ
  choice: при вразумлении
  rationale: «Вразумление» охватывает исправительное наставление и дисциплину, не сводя παιδεία ни к обучению, ни к наказанию; «при» сохраняет возможный обстоятельственный смысл ἐν.
theological_decisions:
- issue: Отношение Божьего вразумления к путям праведных
  choice: Даже в процессе вразумления Бог не делает пути праведных кривыми.
  alternative: Бог не собьёт самих праведных с пути посредством наказания; либо Он не поступит превратно, вразумляя их.
  rationale: Явное дополнение «пути» и противопоставление «выпрямил — не искривит» делают продолжение пространственной метафоры наиболее вероятным, но конструкция ἐν παιδείᾳ допускает оттенки обстоятельства или средства.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Пара «выпрямил — не искривит» сохраняет внутренний образ греческого текста; прописное «Он» указывает на Бога по контексту, не добавляя имени в основной текст.
