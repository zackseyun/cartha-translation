base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/008.yaml
  text: For God is kind and merciful forever[b][a], and the assemblies of Israel will glorify the name of the Lord.
translation:
  language: ru
  text: Ибо Бог благ[a] и милостив вовек, и собрания[b] Израиля прославят имя Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добр».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «общины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ибо
  rationale: Союз вводит основание или пояснение; «ибо» сохраняет причинно-пояснительную связь и соответствует достоинству поэтической речи.
- source_word: χρηστός
  choice: благ
  rationale: Слово обозначает доброту и благость. «Благ» естественно сочетается с характеристикой Бога и рядом с «милостив», не сводя значение лишь к нравственной оценке «добр».
- source_word: ἐλεήμων
  choice: милостив
  rationale: Передаёт готовность проявлять милость и сохраняет традиционное, но понятное современному читателю обозначение Божьего свойства.
- source_word: εἰς τὸν αἰῶνα
  choice: вовек
  rationale: Устойчиво и кратко передаёт неограниченную длительность; форма уместна в современной литературной библейской поэзии.
- source_word: συναγωγαὶ
  choice: собрания
  rationale: Передаёт множественное число и значение собравшихся сообществ, не навязывая более позднего институционального смысла слова «синагога».
- source_word: Ἰσραὴλ
  choice: Израиля
  rationale: Родительный падеж естественно выражает принадлежность собраний народу Израиля.
- source_word: δοξάσουσιν
  choice: прославят
  rationale: Сохраняет будущее время и сильный хвалебно-доксологический смысл глагола.
- source_word: τὸ ὄνομα Κυρίου
  choice: имя Господа
  rationale: Прямо передаёт устойчивое библейское выражение и титул κύριος.
theological_decisions:
- issue: Передача κύριος в греческом иудейском тексте
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет общепринятый библейский титул и не уточняет сверх текста, относится ли он здесь к передаче Божьего имени или употреблён как титул.
- issue: Оттенок χρηστός как свойства Бога
  choice: благ
  alternative: добр
  rationale: «Благ» удерживает возможные оттенки доброты, благости и благожелательности, не превращая их в узко конфессиональное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой окраской. Формы «ибо», «благ» и «вовек» остаются понятными и сохраняют достоинство исходной поэтической речи; синтаксис сделан естественным для русского языка.
