  yaml_path: translation/deuterocanon/psalms_of_solomon/010/001.yaml
  text: Blessed is the man whom the Lord remembered with rebuke[a], and who was turned away from an evil way by a scourge, to be cleansed from sin[e][d][c][b], so that it might not increase.
translation:
  language: ru
  text: Блажен муж, которого Господь вспомнил, обличая его[a], и который бичом был удержан от злого пути[b], чтобы быть очищенным от греха и не умножать его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в обличении»; возможно также: «с укором» или «вразумляя его».'
    reason: lexical_alternative
  - marker: b
    text: Глагол буквально означает «был окружён»; здесь смысл, по-видимому, в том, что человек был словно ограждён от злого пути или не допущен на него.
    reason: lexical_alternative
  - marker: c
    text: 'Заключительные слова можно понять и так: «чтобы грех не умножился»; возможно также: «чтобы он не увеличивал его».'
    reason: alternative_reading
lexical_decisions:
- source_word: Μακάριος ἀνὴρ
  choice: Блажен муж
  rationale: Сохраняет форму благословенного изречения и грамматически мужской род оригинала; это также узнаваемая, но не устаревшая библейская формула.
- source_word: ἐμνήσθη
  choice: вспомнил
  rationale: Передаёт прямое значение глагола и сохраняет образ того, что Господь обратил на человека деятельное внимание.
- source_word: ἐν ἐλεγμῷ
  choice: обличая его
  rationale: Естественно выражает по-русски обстоятельственный смысл греческого оборота и сохраняет значение обличения, не сводя его только к наказанию.
- source_word: ἐκυκλώθη
  choice: был удержан
  rationale: Буквально глагол означает «был окружён»; в данном контексте пассивная форма описывает преграду, не позволившую продолжать злой путь. Образ отмечен в сноске.
- source_word: ὁδοῦ πονηρᾶς
  choice: от злого пути
  rationale: Сохраняет нравственную метафору пути и естественно звучит в современном литературном русском языке.
- source_word: ἐν μάστιγι
  choice: бичом
  rationale: Сохраняет конкретный и строгий образ телесного взыскания, выраженный существительным μάστιξ.
- source_word: καθαρισθῆναι ἀπὸ ἁμαρτίας
  choice: чтобы очиститься от греха
  rationale: Передаёт целевое значение инфинитива, пассивно-возвратный смысл очищения и единственное число ἁμαρτίας как собирательное понятие.
- source_word: τοῦ μὴ πληθῦναι
  choice: и не умножать его
  rationale: Сохраняет активную форму инфинитива и естественно связывает подразумеваемое дополнение с «грехом», не превращая выражение в утверждение о самопроизвольном росте греха.
theological_decisions:
- issue: Кто или что не должно умножаться в заключительной фразе
  choice: Человек не должен умножать грех
  alternative: Грех не должен умножиться
  rationale: Греческий активный инфинитив πληθῦναι допускает подразумеваемый субъект и объект, но краткая конструкция неоднозначна. Основной текст следует активной форме, а альтернативное понимание сохранено в сноске.
- issue: Дисциплинарное действие Господа
  choice: Обличение и бич представлены как средство возвращения с дурного пути и очищения
  alternative: Ослабить образ до общего наставления или исправления
  rationale: Текст прямо сочетает ἐλεγμός и μάστιξ; их конкретность сохранена без добавления конфессионального толкования о природе или цели Божьего наказания.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Формула «Блажен муж» сохранена ради жанра макаризма; синтаксис остальной строки сделан понятным современному читателю. Конкретные образы обличения, пути и бича не смягчены, а неоднозначность заключительного инфинитивного оборота вынесена в сноску.
