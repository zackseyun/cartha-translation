base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/004.yaml
  text: And the mercy of the Lord is upon those who love him in truth[b][a], and the Lord will remember his servants with mercy.
translation:
  language: ru
  text: И милость Господа — на любящих Его в истине[a], и Господь вспомнит Своих служителей[b] с милостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верно»; или: «искренне».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рабов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος / ἐλέει
  choice: милость / с милостью
  rationale: «Милость» естественно передаёт как сострадание, так и благосклонность Господа, не сужая смысл до одного оттенка.
- source_word: Κυρίου / Κύριος
  choice: Господа / Господь
  rationale: В иудейском молитвенном контексте это естественная передача божественного титула κύριος.
- source_word: ἐπὶ
  choice: на
  rationale: Сохраняет греческий образ милости, пребывающей на людях, и соответствует возвышенному библейскому регистру.
- source_word: ἀγαπῶντας αὐτόν
  choice: любящих Его
  rationale: Субстантивированное причастие передано естественным русским причастным оборотом с сохранением продолжающегося характера отношения.
- source_word: ἐν ἀληθείᾳ
  choice: в истине
  rationale: Формально близкая передача сохраняет возможные оттенки подлинности, искренности и верности, не разрешая неоднозначность в пользу одного из них.
- source_word: μνήσεται
  choice: вспомнит
  rationale: Будущее время и прямой смысл глагола сохранены; в контексте речь идёт о действенном, благосклонном памятовании Господа.
- source_word: δούλων
  choice: служителей
  rationale: В молитвенном контексте «служители» естественно обозначает принадлежащих Господу и служащих Ему, тогда как более жёсткий социальный оттенок отмечен в сноске.
theological_decisions:
- issue: Передача δοῦλος
  choice: служителей
  alternative: рабов
  rationale: Основной текст подчёркивает отношение служения Господу, не выдвигая на первый план юридический статус; буквальная и более сильная альтернатива сохранена в сноске.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» соответствует божественному титулу в иудейском богослужебном контексте и не вносит дополнительного оттенка господства.
- issue: Смысл ἐν ἀληθείᾳ
  choice: в истине
  alternative: верно / искренне
  rationale: Формулировка сохраняет богословскую и нравственную ёмкость греческого выражения, не сводя его лишь к искренности или верности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-поэтическим звучанием. Синтаксический параллелизм оригинала сохранён; заглавные местоимения при обращении к Богу соответствуют русской религиозно-издательской традиции.
