lexical_decisions:
- source_word: ὁ ἑτοιμάζων
  choice: Тот, кто готовит
  rationale: Субстантивированное причастие настоящего времени обозначает всякого человека, который готов принять исправительное воздействие; эта конструкция сохраняет обобщённый характер высказывания.
- source_word: νῶτον
  choice: спину
  rationale: Прямое соответствие греческому существительному; притяжательное местоимение в русском здесь не требуется.
- source_word: εἰς μάστιγας
  choice: под бичи
  rationale: Предлог εἰς выражает направленность и готовность принять удары. «Под бичи» естественно передаёт образ и сохраняет связь с μάστιξ в предыдущем стихе.
- source_word: καθαρισθήσεται
  choice: очистится
  rationale: Будущая пассивная форма указывает на последующее очищение; русское возвратное «очистится» естественно передаёт пассивный результат, не ограничивая его ритуальным или исключительно нравственным смыслом.
- source_word: χρηστὸς
  choice: благ
  rationale: В речи о Господе «благ» — современное литературное и достойное соответствие со значением доброты и благости.
- source_word: κύριος
  choice: Господь
  rationale: Обычное библейское соответствие κύριος в данном контексте.
- source_word: τοῖς ὑπομένουσιν
  choice: к тем, кто стойко переносит
  rationale: ὑπομένω обозначает выдерживание трудного воздействия; «стойко переносит» ясно выражает продолжительное терпение, не превращая его в простое пассивное ожидание.
- source_word: παιδείαν
  choice: наказание
  rationale: В контексте бичей слово обозначает исправительную меру, а не просто обучение. «Наказание» сохраняет суровость образа, тогда как примечание отмечает более широкий оттенок вразумления.
theological_decisions:
- issue: Характер очищения через принятую кару
  choice: Сохранить широкое понятие очищения как результата стойко перенесённого исправительного наказания.
  alternative: Понимать очищение узко как ритуальное очищение либо шире как оправдание через страдание.
  rationale: Связь καθαρισθήσεται с παιδεία поддерживает исправительно-нравственный оттенок, однако сам текст не уточняет механизм и вид очищения, поэтому перевод не разрешает эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Образ бичей сохранён прямо; синтаксис остаётся ясным для обычного читателя. Формула «Господь благ» передаёт достоинство исходного изречения без конфессиональных добавлений.
