  text: And the Lord hears the prayer of everyone in the fear of God[b][a], and the Lord fulfills every request of a soul that hopes in him.
translation:
  language: ru
  text: И Господь слышит[a] молитву всякого, кто живет в страхе Божьем[b], и Господь исполняет всякое прошение души[c], уповающей на него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышал». Греческий аорист здесь может пониматься как выражающий общую, непреходящую истину.'
