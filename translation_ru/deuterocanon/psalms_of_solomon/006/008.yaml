  - marker: c
    text: 'Или: «всякую просьбу человека, уповающего на него». Греч.: «души».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος / ὁ κύριος
  choice: Господь
  rationale: Обычное и естественное русское соответствие титулу κύριος в библейском контексте. Повторение слова «Господь» в обеих частях сохраняет греческий акцент.
- source_word: εἰσήκουσεν
  choice: слышит
  rationale: Хотя в греческом стоит аорист, в параллели с настоящим ἐπιτελεῖ он выражает общее, непреходящее положение; русское настоящее время передаёт это естественно.
- source_word: παντὸς ἐν φόβῳ θεοῦ
  choice: всякого, кто пребывает в страхе Божьем
  rationale: Передаёт эллиптическое греческое выражение понятным современным русским языком, сохраняя состояние благоговейного страха перед Богом, а не сводя его лишь к отдельному действию.
- source_word: αἴτημα
  choice: прошение
  rationale: «Прошение» естественно для молитвенного контекста и сохраняет возвышенный, но понятный регистр.
- source_word: ψυχῆς
  choice: души
  rationale: Прямо сохраняет антропологический и молитвенный образ греческого текста; контекстуально возможно также «человека».
- source_word: ἐλπιζούσης πρὸς αὐτόν
  choice: уповающей на него
  rationale: «Уповать на» естественно передаёт направленную к Богу надежду и доверие, выраженные причастием с πρὸς.
- source_word: ἐπιτελεῖ
  choice: исполняет
  rationale: Сочетается с «прошением» и передаёт доведение просимого до осуществления.
theological_decisions:
- issue: Значение «страха Божьего»
  choice: Сохранено выражение «страх Божий» без поясняющей замены на «благоговение».
  alternative: благоговеет перед Богом
  rationale: Греческое φόβος θεοῦ сохраняет библейское смысловое напряжение между страхом и благоговением; перевод не должен заранее сужать его значение.
- issue: Душа или человек
  choice: Сохранено буквальное «душа».
  alternative: человек
  rationale: Так не устраняется возможная антропологическая выразительность ψυχή; более идиоматическое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной молитвенной лексикой. Синтаксис сделан понятным без устранения особенностей греческого текста; повтор «Господь» сохранён. Местоимение «него» написано со строчной буквы согласно нейтральной современной издательской практике.
