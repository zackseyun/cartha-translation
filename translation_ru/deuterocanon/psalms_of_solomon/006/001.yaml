lexical_decisions:
- source_word: Μακάριος
  choice: Блажен
  rationale: Передаёт формулу блаженства и сохраняет торжественный, назидательный тон, не сводя смысл к субъективному ощущению счастья.
- source_word: ἀνὴρ
  choice: муж
  rationale: Сохраняет мужской род и единственное число греческого слова, а также традиционный строй изречения о блаженстве; в данном контексте форма может иметь обобщающий смысл.
- source_word: καρδία
  choice: сердце
  rationale: Сохраняет библейский образ внутреннего расположения человека без сужающего толкования как одного лишь разума или чувства.
- source_word: ἑτοίμη
  choice: готово
  rationale: Точно выражает состояние готовности и естественно согласуется в русском языке со словом «сердце».
- source_word: ἐπικαλέσασθαι
  choice: призывать
  rationale: Передаёт религиозный смысл обращения к Господу и образует естественное библейское сочетание «призывать имя Господа»; русский несовершенный вид здесь выражает расположение и готовность к действию, не исключая конкретного обращения.
- source_word: τὸ ὄνομα
  choice: имя
  rationale: Сохраняет значимый библейский оборот и не заменяет его толкованием через власть, присутствие или славу.
- source_word: Κυρίου
  choice: Господа
  rationale: Стандартно передаёт κύριος в составе устойчивого оборота «имя Господа».
theological_decisions:
- issue: Объект и характер призывания в выражении ἐπικαλέσασθαι τὸ ὄνομα Κυρίου
  choice: призывать имя Господа
  alternative: воззвать к Господу по имени
  rationale: Выбран буквальный библейский оборот, сохраняющий богословски насыщенное слово «имя» и не уточняющий сверх исходного текста, идёт ли речь преимущественно о молитве, исповедании или просьбе о помощи.
translation_notes:
