  text: When he remembers the name of the Lord[a], he will be saved.
translation:
  language: ru
  text: Когда он вспомнит имя Господа[a], то будет спасён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет избавлен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ μνημονεύειν
  choice: Когда … вспомнит
  rationale: Конструкция ἐν τῷ с инфинитивом естественно выражает здесь время; совершенный вид «вспомнит» идиоматичен по-русски и соотносит воспоминание с последующим спасением.
- source_word: αὐτὸν
  choice: он
  rationale: 'Местоимение понято как винительный субъект субстантивированного инфинитива, а не как его прямое дополнение: «когда он вспомнит», а не «когда вспомнят его».'
- source_word: τὸ ὄνομα Κυρίου
  choice: имя Господа
  rationale: Формулировка близко передаёт греческий текст и сохраняет библейскую значимость выражения «имя Господа».
- source_word: σωθήσεται
  choice: будет спасён
  rationale: Будущее страдательное от σῴζω допускает значения спасения и избавления; основной вариант сохраняет широту и богословское звучание глагола.
theological_decisions:
- issue: Смысл σωθήσεται
  choice: будет спасён
  alternative: будет избавлен
  rationale: Контекст стиха не требует сужать значение до избавления от конкретной опасности, поэтому оставлен более широкий вариант, а лексическая альтернатива вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным библейским строем. Частица «то» естественно обозначает соотношение временного придаточного с главным предложением.
