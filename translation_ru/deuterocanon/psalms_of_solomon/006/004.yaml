lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  choice: видение
  rationale: Предлог ἀπό при глаголе ταράσσω указывает на причину тревоги, а ὅρασις обозначает увиденное, видение; по-русски причинная связь естественно передана конструкцией с подлежащим.
- source_word: πονηρῶν ἐνυπνίων αὐτοῦ
  choice: злых снов его
  rationale: Сохранены значение πονηρός как «злой, дурной» и относящееся к снам притяжательное местоимение αὐτοῦ. Постпозиция «его» поддерживает ясность связи и возвышенный поэтический регистр.
- source_word: οὐ ταραχθήσεται
  choice: не встревожит
  rationale: Греческая пассивная форма буквально означает «он не будет приведён в смятение». Русская активная конструкция с причиной в роли подлежащего естественнее и сохраняет смысл без добавления толкования.
