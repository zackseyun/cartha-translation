lexical_decisions:
- source_word: εὐλογητὸς
  choice: Благословен
  rationale: Сохраняет традиционную доксологическую формулу и естественно звучит в современном литературном русском.
- source_word: Κύριος
  choice: Господь
  rationale: Обычное русское соответствие κύριος как божественного титула в контексте хвалы.
- source_word: ὁ ποιῶν
  choice: являющий
  rationale: Сочетание ποιεῖν ἔλεος идиоматически означает проявлять или оказывать милость; «являющий милость» сохраняет достоинство и ясность формулировки.
- source_word: ἔλεος
  choice: милость
  rationale: Прямое и традиционное соответствие, передающее сострадание и благоволение.
- source_word: τοῖς ἀγαπῶσιν αὐτὸν
  choice: тем, кто любит Его
  rationale: Естественная русская передача субстантивированного причастия без изменения смысла.
- source_word: ἐν ἀληθείᾳ
  choice: в истине
  rationale: Формально близкая передача, сохраняющая неоднозначность между пребыванием в истине, искренностью и верностью.
