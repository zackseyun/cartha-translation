  text: With gladness in his heart he sang praise to the name of God[b][a], and he entreated the Lord for all his household.
translation:
  language: ru
  text: С радостью в сердце он воспел имя Бога и молил Господа[a] обо всех своих домашних.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «умолял лицо Господа» — библейский оборот со значением просьбы о Его благоволении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν εὐφρίᾳ καρδίας αὐτοῦ
  choice: С радостью в сердце
  rationale: Передаёт радость как внутреннее состояние человека, сохраняя библейский образ сердца и естественный русский порядок слов.
- source_word: ἐξύμνησεν
  choice: воспел
  rationale: Глагол означает хвалебное, гимническое прославление; «воспел» кратко и достойно передаёт значение сильнее, чем простое «прославил».
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: имя Бога
  rationale: Греческий текст прямо называет Божье имя. Русская конструкция «воспел имя Бога» естественно передаёт дательный объект при греческом глаголе.
- source_word: ἐδεήθη
  choice: молил
  rationale: Передаёт настойчивую просьбу, а не молитву вообще, и естественно сочетается с обозначением того, к кому обращена просьба.
- source_word: τοῦ προσώπου Κυρίου
  choice: Господа
  rationale: При δέομαι генитив обозначает того, кого умоляют. Буквальное «лицо Господа» является семитским оборотом; его форма и смысл пояснены в сноске.
- source_word: περὶ παντὸς τοῦ οἴκου αὐτοῦ
  choice: обо всех своих домашних
  rationale: Здесь οἶκος обозначает людей, составляющих домочадство, а не здание. Этот вариант ясен современному читателю и сохраняет охват всего дома.
theological_decisions:
- issue: Передача оборота τοῦ προσώπου Κυρίου
  choice: молил Господа
  alternative: умолял лицо Господа / искал благоволения Господа
  rationale: Генитив зависит от ἐδεήθη и называет того, к кому обращена мольба; это не обстоятельство места «перед Господом». В основном тексте употреблён естественный русский эквивалент, а буквальный семитский образ сохранён в сноске без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Воспел» сохраняет гимнический оттенок, а «домашние» ясно обозначает всё домочадство.
