  text: His ways are directed by the Lord, and the works of his hands are guarded by the Lord his God.
translation:
  language: ru
  text: Пути его направляются Господом, и дела рук его хранимы Господом, его Богом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ ὁδοὶ αὐτοῦ
  choice: пути его
  rationale: Сохраняет конкретный образ греческого выражения и допускает переносное значение — образ жизни, поступки или начинания человека, не сужая смысл.
- source_word: κατευθύνονται
  choice: направляются
  rationale: 'Передаёт настоящее время и пассивный залог: Господь выступает действующим лицом, направляющим пути человека. Вариант также не исключает оттенка «делаются прямыми».'
- source_word: πεφυλαγμένα
  choice: хранимы
  rationale: 'Передаёт результирующее состояние, выраженное перфектным страдательным причастием: дела находятся под Божьей охраной. Краткая форма причастия соответствует возвышенному, но понятному библейскому регистру.'
- source_word: ἔργα χειρῶν αὐτοῦ
  choice: дела рук его
  rationale: Сохраняет прозрачную телесную метафору оригинала и не заменяет её более отвлечённым выражением.
- source_word: ὑπὸ Κυρίου θεοῦ αὐτοῦ
  choice: Господом, его Богом
  rationale: Творительный падеж естественно передаёт действующее лицо при греческом страдательном обороте с ὑπό; приложение «его Богом» сохраняет личное отношение, выраженное αὐτοῦ.
theological_decisions:
- issue: Божественное действие в обеих страдательных конструкциях
  choice: Господь прямо представлен Тем, кто направляет пути человека и хранит дела его рук.
  alternative: Ослабить мысль до общего благословения или успеха перед Господом.
  rationale: В обеих частях Господь явно назван действующим лицом посредством ὑπό; перевод сохраняет сильное утверждение о Божьем провидении, не объясняя далее соотношение Божьего действия и человеческой ответственности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм и повтор слова «Господом» сохранены. Инверсия «дела рук его» удерживает образ и ритм оригинала, оставаясь понятной современному читателю.
