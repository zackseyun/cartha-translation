  text: His soul will not be terrified at the crossing of rivers and the tossing of seas[a][b][c].
translation:
  language: ru
  text: Душа его[a] не устрашится[c] при переправе через реки и при волнении морей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Жизнь его»; или: «Он сам».'
