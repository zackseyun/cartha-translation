  - marker: b
    text: 'Или: «при морской зыби».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не придёт в ужас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: душа
  rationale: «Душа» сохраняет широкий смысл внутренней жизни, жизни и самой личности, а также возвышенный поэтический регистр оригинала.
- source_word: διάβασις
  choice: переправа
  rationale: Существительное обозначает переход или переправу; «переправа через реки» естественно передаёт образ опасного пересечения водной преграды.
- source_word: σάλος
  choice: волнение
  rationale: Слово обозначает колебание, качку или бурное движение воды. «Волнение морей» ясно и поэтично передаёт этот образ, не уточняя сверх оригинала степень бури.
- source_word: πτοηθήσεται
  choice: не устрашится
  rationale: Глагол выражает сильный испуг, потрясение или ужас. «Не устрашится» передаёт эту интенсивность и сохраняет возвышенный тон.
