base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/007.yaml
  text: God made every fragrant tree spring up for them[a], so that Israel might pass through in the visitation of the glory of their God.
translation:
  language: ru
  text: Бог взрастил для них всякое благоуханное дерево, чтобы Израиль прошёл при посещении славы их Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под надзором (или попечением) славы их Бога».'
    reason: Лексема ἐπισκοπή допускает значения «посещение», «надзор» и «попечение»; конструкция с родительным падежом остаётся неоднозначной.
lexical_decisions:
- source_word: πᾶν ξύλον
  choice: всякое … дерево
  rationale: 'При существительном в единственном числе πᾶν имеет распределительное значение: имеются в виду все виды таких деревьев.'
- source_word: εὐωδίας
  choice: благоуханное
  rationale: Родительный падеж передаёт качество дерева; «благоуханное» естественно сохраняет образ приятного аромата и возвышенный поэтический регистр.
- source_word: ἀνέτειλεν
  choice: взрастил
  rationale: Глагол обозначает появление или произрастание; «взрастил» сохраняет растительный образ и ясно выражает действие Бога.
- source_word: παρέλθῃ
  choice: прошёл
  rationale: Форма передаёт движение через приготовленное пространство; русский глагол «пройти» естественен в данном контексте, хотя направление в греческом прямо не уточнено.
- source_word: ἐπισκοπῇ
  choice: посещении
  rationale: Слово может обозначать посещение, надзор или попечение. «Посещение» сохраняет возвышенный богословский оттенок деятельного присутствия Бога, не сводя его к административному надзору.
- source_word: δόξης
  choice: славы
  rationale: Буквальная родительная связь с ἐπισκοπῇ сохранена; «слава» является обычным и уместным библейским соответствием.
theological_decisions:
- issue: Значение выражения ἐν ἐπισκοπῇ δόξης θεοῦ αὐτῶν
  choice: при посещении славы их Бога
  alternative: под попечением славы их Бога
  rationale: Основной текст сохраняет возможный смысл посещения и необычную родительную связь со «славой», не превращая её без достаточных оснований в прилагательное «славное». Сноска отмечает также засвидетельствованные значения надзора и попечения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Необычность заключительной греческой конструкции сохранена, а не устранена толкованием; альтернативные значения вынесены в сноску.
