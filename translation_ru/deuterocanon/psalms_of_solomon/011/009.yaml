base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/009.yaml
  text: May the Lord do what he has spoken concerning Israel and Jerusalem[a]; may the Lord raise up Israel in the name of his glory[d][c][b]. The Lord’s mercy be upon Israel forever and ever.
translation:
  language: ru
  text: Да совершит Господь то, что Он сказал об Израиле и Иерусалиме[a]; да поднимет Господь Израиль во имя Своей славы[b]. Милость Господа да пребудет над Израилем вовеки и навсегда[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «да исполнит Господь то, что Он сказал об Израиле и Иерусалиме».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «да восстановит Господь Израиль». Выражение «во имя Своей славы» можно также понять как «силой Своего славного имени» или «ради Своего славного имени».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «вовек и ещё (далее)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαι
  choice: да совершит
  rationale: Аористный оптатив выражает пожелание. «Да совершит» передаёт действие более естественно и достойно, чем буквальное «да сделает», не уточняя сверх текста, каким именно образом сказанное будет осуществлено.
- source_word: ἐλάλησεν ἐπὶ
  choice: сказал об
  rationale: Сочетание с ἐπί и винительным падежом обозначает речь об Израиле и Иерусалиме; «сказал об» сохраняет широкое значение, не превращая слова прямо в обещание или пророчество.
- source_word: ἀναστήσαι
  choice: да поднимет
  rationale: «Поднимет» сохраняет образ греческого глагола и оставляет открытыми значения восстановления, утверждения и возвышения, не сводя его к одному толкованию.
- source_word: ἐν ὀνόματι δόξης αὐτοῦ
  choice: во имя Своей славы
  rationale: Формулировка сохраняет сжатую структуру оригинала и оба значимых понятия — «имя» и «слава», не заменяя их более узким причинным или инструментальным толкованием.
- source_word: ἔλεος
  choice: милость
  rationale: «Милость» — ясное и традиционно понятное соответствие, не добавляющее отсутствующей в греческом тексте конфессиональной терминологии.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: вовеки и навсегда
  rationale: Идиоматическое русское усиление передаёт неограниченную продолжительность и дополнительное καὶ ἔτι, избегая неестественного буквального оборота «вовек и ещё».
theological_decisions:
- issue: Смысл того, что Господь «поднимет» Израиль
  choice: Сохранён широкий образ «поднимет», без уточнения вида события.
  alternative: «восстановит Израиль» или «вновь утвердит Израиль»
  rationale: Греческий глагол допускает восстановление, возвышение или утверждение и сам по себе не требует ни исключительно политического, ни воскресительного понимания.
- issue: Значение выражения «во имя Своей славы»
  choice: Сохранена формальная неоднозначность греческой фразы.
  alternative: «силой Своего славного имени» или «ради Своего славного имени»
  rationale: Предлог ἐν и сочетание существительных не позволяют безусловно выбрать инструментальное или целевое истолкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-псалмическим строем. Повтор «Господь» сохранён ради риторического параллелизма; архаизмы сведены к минимуму. Заглавные местоимения в отношении Господа соответствуют принятому русскому библейскому регистру.
