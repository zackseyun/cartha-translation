  text: Put on[a], Jerusalem, the garments of your glory; make ready your sacred robe[c][b], for God has spoken good things to Israel forever and ever.
translation:
  language: ru
  text: Облекись, Иерусалим, в одежды славы твоей; приготовь своё священное одеяние[a], потому что Бог изрёк Израилю благое навеки и впредь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одеяние святости твоей»; возможно также: «одеяние твоего святилища».'
    reason: Греческое ἁγίασμα может обозначать святость или освящённость, святыню либо святилище.
  - marker: b
    text: 'Буквально: «на век и ещё далее».'
    reason: Примечание сохраняет необычное добавочное значение καὶ ἔτι, которое можно понимать как усиленную формулу вечной длительности.
lexical_decisions:
- source_word: ἔνδυσαι
  choice: облекись
  rationale: Средний императив призывает Иерусалим самому облачиться. «Облекись» сохраняет возвышенный поэтический тон и естественно сочетается с дополнением «в одежды».
- source_word: τὰ ἱμάτια τῆς δόξης σου
  choice: в одежды славы твоей
  rationale: Сохранены множественное число, образ облачения и сильное библейское значение δόξα — «слава». Постпозиция «твоей» придаёт строке достойное, но понятное звучание.
- source_word: ἑτοίμασον
  choice: приготовь
  rationale: Прямо передаёт повелительное значение «приготовь, сделай готовым» без излишней архаизации.
- source_word: τὴν στολὴν
  choice: одеяние
  rationale: Единственное число и торжественный характер στολή переданы словом «одеяние», не сужающим образ до конкретного вида одежды.
- source_word: τοῦ ἁγιάσματός σου
  choice: святыни твоей
  rationale: Родительная конструкция сохранена формально. «Святыня» допускает отнесение как к освящённости, так и к святилищу, поэтому не устраняет присущую греческому слову неоднозначность.
- source_word: ἐλάλησεν ἀγαθὰ
  choice: возвестил … благо
  rationale: «Возвестил» естественно для торжественной поэзии и сохраняет речевое действие, а «благо» передаёт субстантивированное множественное ἀγαθὰ без добавления явного понятия обещания.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: навеки и впредь
  rationale: Передаёт как неограниченную длительность εἰς τὸν αἰῶνα, так и добавочное продолжение καὶ ἔτι; намеренная смысловая избыточность оригинала не сведена просто к «навеки».
theological_decisions:
- issue: Значение τοῦ ἁγιάσματός σου в образе облачения Иерусалима
  choice: «одеяние святыни твоей» с пояснением неоднозначности
  alternative: «одеяние святости твоей» или «твоё священное одеяние»
  rationale: ἁγίασμα может обозначать святость, освящённую вещь либо святилище. Основной текст сохраняет родительную конструкцию и культово-поэтическую многозначность, а примечание показывает главные возможные понимания.
- issue: Характер благих слов Бога Израилю
  choice: «возвестил Израилю благо»
  alternative: «обещал Израилю благо»
  rationale: Глагол ἐλάλησεν прямо говорит о речевом действии, но не уточняет его как обещание. Поэтому перевод не вводит более узкую богословскую категорию обещания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим строем. Слова «облекись», «одеяние» и «возвестил» поддерживают торжественность, оставаясь понятными современному читателю; синтаксис следует параллелизму греческой строки.
