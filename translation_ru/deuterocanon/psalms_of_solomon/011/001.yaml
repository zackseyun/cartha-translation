lexical_decisions:
- source_word: Σαλπίσατε
  choice: Трубите
  rationale: Аористный императив множественного числа выражает обращённый к нескольким лицам призыв подать публичный трубный сигнал. «Трубите» естественно и сохраняет повелительную силу.
- source_word: ἐν Σιὼν
  choice: на Сионе
  rationale: Русская литературная и библейская норма предпочитает сочетание «на Сионе»; оно передаёт местное значение ἐν без ненужной буквальности.
- source_word: ἐν σάλπιγγι
  choice: в трубу
  rationale: Инструментальное ἐν с дательным падежом естественно передаётся русским устойчивым выражением «трубить в трубу».
- source_word: σημασίας
  choice: подающую знак
  rationale: Существительное означает знак или сигнал. Описательный оборот даёт ясный современный русский текст и сохраняет функцию трубы как средства созыва.
- source_word: ἁγίων
  choice: святым
  rationale: Форма допускает отнесение к святым людям; дательный передаёт вероятный объективный смысл генитива — знак предназначен святым. При этом не уточняется, кто именно назван святыми.
theological_decisions:
- issue: К кому относится ἁγίων и какова функция родительного падежа
  choice: '«знак святым»: святые понимаются как адресаты сигнала, без уточнения их группы'
  alternative: «знамение святых» или «святое знамение»
  rationale: 'Контекст созыва и возвращения рассеянных поддерживает объективное понимание: сигнал подаётся святым. Однако сжатая греческая цепочка родительных допускает другие синтаксические прочтения, поэтому неоднозначность отмечена в сноске.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Выбрано привычное «на Сионе», а не буквальное «в Сионе». Запятая сохранена, поскольку стих, вероятно, продолжается далее.
