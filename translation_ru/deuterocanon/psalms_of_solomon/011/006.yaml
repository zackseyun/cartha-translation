  yaml_path: translation/deuterocanon/psalms_of_solomon/011/006.yaml
  text: The hills fled from their approach[c][b][a]; the forests gave them shade along their way.
translation:
  language: ru
  text: Холмы бежали перед их приближением[a], а леса давали им тень на их пути[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бежали от их появления»; греческое выражение ἀπὸ εἰσόδου αὐτῶν допускает оттенки приближения, прихода или вступления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во время их прохождения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ βουνοὶ
  choice: холмы
  rationale: βουνός обычно обозначает холм или возвышенность, а не высокую гору; «холмы» сохраняет масштаб образа.
- source_word: ἔφυγον
  choice: бежали
  rationale: Прямое значение φεύγω — «бежать, спасаться бегством»; перевод сохраняет яркое олицетворение.
- source_word: ἀπὸ εἰσόδου αὐτῶν
  choice: перед их приближением
  rationale: Сочетание ἀπό с φεύγω передаёт удаление от чьего-либо наступления или появления; «перед их приближением» естественно по-русски выражает пространственно-ситуативный смысл, не сводя εἴσοδος к входу в помещение.
- source_word: οἱ δρυμοὶ
  choice: леса
  rationale: δρυμός обозначает лесистую местность, лес или чащу; «леса» наиболее естественно соответствует параллельному образу природного пространства.
- source_word: ἐσκίασαν αὐτοῖς
  choice: давали им тень
  rationale: Так переданы действие глагола σκιάζω и благоприятный для путников оттенок дательного αὐτοῖς.
- source_word: ἐν τῇ παρόδῳ αὐτῶν
  choice: на их пути
  rationale: πάροδος может обозначать прохождение или путь; «на их пути» кратко и естественно передаёт контекст движения.
