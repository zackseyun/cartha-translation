  yaml_path: translation/deuterocanon/psalms_of_solomon/011/004.yaml
  text: They come from the north in the joy of their God[a]; from distant islands God has gathered them.
translation:
  language: ru
  text: С севера идут они в радости своего Бога; с далёких островов[a] собрал их Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с далёких побережий».'
    reason: Греческое νῆσοι обычно означает «острова», но в библейском употреблении может относиться к приморским землям или побережьям.
lexical_decisions:
- source_word: ἀπὸ βορρᾶ
  choice: с севера
  rationale: Предлог ἀπό с родительным обозначает исходную точку, а βορρᾶ — север; «с севера» естественно и точно передаёт направление.
- source_word: ἔρχονται
  choice: идут они
  rationale: Настоящее время передано настоящим временем; «идут» сохраняет картину движения и звучит естественно в данном контексте.
- source_word: τῇ εὐφροσύνῃ
  choice: в радости
  rationale: Дательный падеж выражает образ действия или сопутствующее состояние; буквальная именная конструкция сохраняет выразительность греческого текста.
- source_word: τοῦ θεοῦ αὐτῶν
  choice: своего Бога
  rationale: Возвратно-притяжательное «своего» в русском языке естественно соотносит Бога с подлежащим «они» и прямо передаёт принадлежность, выраженную родительным падежом.
- source_word: ἐκ νήσων μακρόθεν
  choice: с далёких островов
  rationale: ἐκ обозначает источник или исходную точку, μακρόθεν — удалённость; νῆσοι обычно означает «острова», но может обозначать также приморские земли, что отмечено в сноске.
- source_word: συνήγαγεν
  choice: собрал
  rationale: Греческий аорист передан русским совершенным видом в прошедшем времени как завершённое действие без добавления отсутствующего в оригинале временного оттенка.
- source_word: ὁ θεός
  choice: Бог
  rationale: Явно названный субъект сохранён; конечная позиция «Бог» отражает порядок греческого текста и подчёркивает Божье действие.
