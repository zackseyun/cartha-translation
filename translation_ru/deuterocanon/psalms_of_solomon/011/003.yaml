  yaml_path: translation/deuterocanon/psalms_of_solomon/011/003.yaml
  text: Stand[a], O Jerusalem, on high[c][b], and see your children gathered from east and west by the Lord.
translation:
  language: ru
  text: Встань, Иерусалим, на высоте и посмотри на своих детей, собранных Господом воедино[a] с востока и запада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместе»; выражение может также подразумевать, что они собраны одновременно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆθι
  choice: Встань
  rationale: Аористный императив призывает олицетворённый Иерусалим встать и занять место, откуда он сможет увидеть возвращающихся детей; «встань» прямо и естественно передаёт повеление.
- source_word: ἐφʼ ὑψηλοῦ
  choice: на высоте
  rationale: Выражение указывает на возвышенное место, служащее точкой обзора. «На высоте» сохраняет конкретный пространственный образ и не уточняет характер возвышения сверх греческого текста.
- source_word: τὰ τέκνα σου
  choice: своих детей
  rationale: τέκνα охватывает потомков обоих полов; возвратное «своих» естественно в русском предложении при обращении к Иерусалиму.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: с востока и запада
  rationale: Формы множественного числа обозначают стороны света или соответствующие области; по-русски это естественно передаётся единственным числом.
- source_word: συνηγμένα
  choice: собранных
  rationale: Причастие обозначает тех, кого свели или собрали вместе; форма согласована с «детей» и сохраняет пассивное действие.
- source_word: εἰς ἅπαξ
  choice: воедино
  rationale: Сжатое выражение может подчёркивать совместность, единство или одновременность собрания. «Воедино» естественно передаёт основную идею объединения, не внося значения внезапности или окончательности.
- source_word: ἀπὸ Κυρίου
  choice: Господом
  rationale: Предлог ἀπό при пассивном причастии указывает на действующее лицо или источник действия; русский творительный падеж ясно и естественно выражает эту связь.
theological_decisions:
- issue: Значение εἰς ἅπαξ в описании собирания
  choice: воедино
  alternative: одновременно; разом; вместе
  rationale: Контекст допускает оттенок одновременности, но прежде всего изображает детей Иерусалима как единое собрание. Перевод не придаёт фразе специального эсхатологического значения и сохраняет смысловую напряжённость в примечании.
translation_notes:
  register: Современный литературный русский с достоинством поэтического обращения. Синтаксис прост и доступен; конкретный образ возвышенного места сохранён, а неоднозначность εἰς ἅπαξ отмечена без перегрузки основного текста.
