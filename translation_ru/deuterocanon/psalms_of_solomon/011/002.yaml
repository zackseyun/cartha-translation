lexical_decisions:
- source_word: κηρύξατε
  choice: Возвестите
  rationale: Повелительное наклонение множественного числа требует публичного, торжественного провозглашения; «возвестите» сохраняет этот оттенок и уместно в возвышенной поэтической речи.
- source_word: φωνὴν
  choice: голос
  rationale: Сохраняет конкретный образ греческого текста и не сводит выражение лишь к содержанию вести.
- source_word: εὐαγγελιζομένου
  choice: несущего благую весть
  rationale: Передаёт причастие как обозначение того, кто возвещает радостную весть, не превращая его в позднейший технический богословский термин.
- source_word: ἠλέησεν
  choice: помиловал
  rationale: Естественно и точно передаёт действие ἐλεέω, сохраняя в центре фразы Божью милость.
- source_word: ἐν τῇ ἐπισκοπῇ αὐτῶν
  choice: посетив его
  rationale: 'Передаёт ἐπισκοπή как милостивое Божье посещение, а αὐτῶν — как объективный родительный: Бог посетил Израиль. Единственное число «его» согласуется с русским собирательным названием «Израиль».'
theological_decisions:
- issue: Значение ἐπισκοπή в заключительной фразе
  choice: милостивое Божье посещение Израиля
  alternative: попечение о нём или спасительное вмешательство ради него
  rationale: Контекст благой вести и милости указывает на благотворное Божье действие. Основной текст делает направление действия ясным, а примечание сохраняет более широкий смысловой диапазон существительного.
translation_notes:
