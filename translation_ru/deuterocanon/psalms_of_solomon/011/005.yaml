  text: Он понизил высокие горы, превратив их в ровную землю для них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он смирил высокие горы, обратив их в равнину для них».'
    reason: 'Лексическая альтернатива: ἐταπείνωσεν может передаваться как «смирил», а ὁμαλισμός — как «равнина».'
lexical_decisions:
- source_word: ὄρη
  choice: горы
  rationale: Обычное значение существительного — горы или крупные холмы; «горы» лучше сохраняет масштаб образа.
- source_word: ὑψηλά
  choice: высокие
  rationale: Прямое определение естественно передаёт физическую высоту без излишней поэтической приподнятости.
- source_word: ἐταπείνωσεν
  choice: понизил
  rationale: При объекте «горы» глагол выражает физическое понижение; этот выбор сохраняет образ и звучит ясно по-русски.
- source_word: εἰς ὁμαλισμόν
  choice: превратив … в ровную землю
  rationale: Оборот указывает на результат — горы становятся ровной местностью; деепричастная конструкция естественно выражает этот итог.
- source_word: αὐτοῖς
  choice: для них
  rationale: 'Дательный падеж здесь наиболее вероятно обозначает пользу: выравнивание совершается ради них.'
