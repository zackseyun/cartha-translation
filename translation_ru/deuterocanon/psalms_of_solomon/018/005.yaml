  source_fidelity: «Чтобы отвратить душу, готовую слушать, от неразумия в неведении» точно передаёт аористный инфинитив ἀποστρέψαι, направление ἀπό, ψυχή и смысловой диапазон εὔκοος. Различение ἀμαθία и ἀγνοία сохранено. Оборот «в неведении» намеренно не уточняет, относится ли он прежде всего к неразумию или к действию, что соответствует синтаксической неоднозначности греческого текста.
