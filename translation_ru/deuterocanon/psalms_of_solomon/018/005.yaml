translation:
  language: ru
  text: чтобы отвратить душу, готовую слушать[a], от неразумия в неведении[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «послушную душу», «душу, восприимчивую к наставлению».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте различаются ἀμαθία («неразумие», недостаток учения) и ἀγνοία («неведение», незнание); это не простое повторение одного понятия. Связь слов «в неведении» с остальной фразой остаётся неоднозначной.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψαι
  choice: чтобы отвратить
  rationale: Аористный инфинитив передаёт цель — отвести кого-либо от чего-либо; «отвратить» сохраняет направленность, выраженную ἀπό, и соответствует возвышенному, но понятному регистру.
- source_word: ψυχὴν
  choice: душу
  rationale: В нравственно-религиозном контексте «душа» сохраняет антропологическую полноту ψυχή и естественно звучит по-русски.
- source_word: εὔκοον
  choice: готовую слушать
  rationale: Прилагательное буквально обозначает готовность слышать и может подразумевать послушание или восприимчивость к наставлению. Описательный перевод передаёт основу значения, не сводя его только к покорности.
- source_word: ἀμαθίας
  choice: неразумия
  rationale: «Неразумие» выражает недостаток учения и рассудительности, отличая ἀμαθία от следующего ἀγνοία; перевод обоих слов как «неведение» стёр бы намеренное различие.
- source_word: ἐν ἀγνοίᾳ
  choice: в неведении
  rationale: 'Буквальный предложный оборот сохраняет сжатость оригинала и неоднозначность его связи: он может обозначать состояние или обстоятельство неразумия либо действия.'
