lexical_decisions:
- source_word: διατάξας
  choice: установил
  rationale: Глагол передаёт целенаправленное упорядочение и назначение; «установил» естественно сочетается со светилами и не сводит смысл лишь к пространственному размещению.
- source_word: φωστῆρας
  choice: светила
  rationale: Обычное для современного литературного русского обозначение небесных источников света, сохраняющее возвышенный поэтический регистр.
- source_word: ἐν πορείᾳ
  choice: в их движении
  rationale: Передаёт упорядоченное движение светил, не привнося современной астрономической терминологии вроде «орбиты».
- source_word: καιροὺς ὡρῶν
  choice: назначенных сроков времён
  rationale: Сохраняет оба временных существительных и семантику установленного срока у καιρός. Некоторая необычность оборота отражает необычность греческого выражения; значение ὥρα здесь не сужено до современного шестидесятиминутного «часа».
- source_word: ἀφʼ ἡμερῶν εἰς ἡμέρας
  choice: изо дня в день
  rationale: Естественный русский оборот, передающий непрерывную повторяемость и регулярность.
- source_word: παρέβησαν
  choice: не уклонились
  rationale: В контексте предписанного пути глагол прежде всего обозначает отклонение или сход с установленной дороги, хотя в иных контекстах может иметь смысл нарушения.
- source_word: ὁδοῦ
  choice: с пути
  rationale: Сохраняет образ заданного пути небесных светил; русский глагол «уклониться» естественно требует предлога «с».
- source_word: ἐνετείλατο
  choice: повелел
  rationale: Передаёт властное предписание и подходит возвышенному, но современному регистру. Оборот «следовать которым» делает русскую фразу грамматически естественной, не меняя предмет повеления.
