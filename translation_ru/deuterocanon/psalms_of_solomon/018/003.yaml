    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακούει
  choice: внимают
  rationale: Глагол обозначает не просто восприятие звука, а внимательное, отзывчивое слушание; «внимают» естественно сочетается с «уши» и сохраняет возвышенный тон.
- source_word: δέησιν
  choice: мольбе
  rationale: Слово обозначает настоятельную просьбу или моление. «Мольба» передаёт её напряжённость и остаётся понятной современному читателю.
- source_word: πτωχοῦ
  choice: бедняка
  rationale: Греческая форма стоит в мужском роде и единственном числе. «Бедняк» сохраняет эту конкретность, не превращая образ в отвлечённое собирательное понятие.
- source_word: ἐν ἐλπίδι
  choice: в надежде
  rationale: 'Близкий перевод сохраняет краткость и допускаемую греческим текстом неоднозначность связи: выражение может характеризовать мольбу, молящегося или само обращение к Богу.'
- source_word: κρίματά
  choice: суды
  rationale: «Суды» прямо передаёт Божьи судебные решения и деяния, не сужая значение до одних постановлений.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: над всей землёй
  rationale: Предлог ἐπί здесь допускает пространственный оттенок охвата или власти; «над всей землёй» сохраняет образ и широту действия.
- source_word: μετὰ ἐλέους
  choice: с милостью
  rationale: Именная конструкция следует греческому тексту и сохраняет напряжённое сочетание суда и милости.
theological_decisions:
- issue: Соотношение Божьих судов и милости
  choice: «суды Твои — над всей землёй с милостью»
  alternative: «Ты милостиво судишь всю землю»
  rationale: Выбранная конструкция не превращает именную фразу в явное утверждение о процессе суда и сохраняет исходное соседство понятий суда и милости без богословского сглаживания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмической интонацией. Инверсия «Уши Твои» и «суды Твои» поддерживает поэтический параллелизм; лексика остаётся доступной и не привносит конфессионально специфических толкований.
