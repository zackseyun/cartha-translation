translation:
  language: ru
  text: Уши Твои внимают мольбе бедняка в надежде[a]; суды Твои над всей землёй совершаются с милостью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молитве» или «молению бедняка». Выражение «в надежде» может относиться к мольбе, к бедняку или к самому обращению к Богу.'
    reason: lexical_and_syntactic_ambiguity
