lexical_decisions:
- source_word: Κύριε
  choice: Господи
  rationale: Русская звательная форма естественно и достойно передаёт прямое обращение к Богу без добавления междометия «о».
- source_word: τὸ ἔλεός σου
  choice: милость Твоя
  rationale: «Милость» точно передаёт ἔλεος как милосердное благоволение Бога и сохраняет привычный библейский регистр.
- source_word: ἐπὶ
  choice: над
  rationale: «Над» сохраняет пространственный образ милости, простирающейся над названными творениями; связка в настоящем времени по-русски естественно опускается.
- source_word: τὰ ἔργα τῶν χειρῶν σου
  choice: делами рук Твоих
  rationale: Формулировка сохраняет конкретный образ греческого текста и не сужает значение до одного лишь акта творения.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: «Вовеки» кратко и точно передаёт неограниченную длительность, оставаясь понятным в современном литературном русском языке.
theological_decisions:
- issue: Следует ли явно истолковать ἔργα τῶν χειρῶν σου как сотворённый мир.
  choice: Сохранить образ «дела рук Твоих».
  alternative: «Творения Твои» или «всё, что создали руки Твои».
  rationale: Греческий текст допускает связь с творением, но не выражает её специальным термином; буквальный образ сохраняет широту и богословскую открытость выражения.
- issue: Как передать отношение милости к делам Божьих рук в конструкции ἐπὶ.
  choice: «Милость Твоя — над делами рук Твоих».
  alternative: «Милость Твоя пребывает на делах рук Твоих».
  rationale: «Над» сохраняет пространственную метафору и не добавляет прямо не выраженного глагола «пребывает».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «милость Твоя» и прописные местоимения поддерживают молитвенный регистр; конкретный антропоморфный образ оригинала сохранён.
