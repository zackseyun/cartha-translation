  source_fidelity: 'Основной смысл передан верно: Κύριε — «Господи», ἔλεος — «милость», а «дела рук Твоих» сохраняет образ оригинала и не сужает его до понятия творения. Однако русское «милость Твоя — над делами» допускает нежелательное буквальное понимание пространственного превосходства; глагольная форма яснее передаёт образ ἐπὶ как милости, простирающейся на/над названным.'
  naturalness: «Господи, Твоя милость простирается над делами рук Твоих вовеки» звучит как современный литературный русский с уместно возвышенным молитвенным регистром. Она избегает тяжеловесной эллиптической конструкции с тире и не требует читателю восстанавливать отношение милости к «делам».
  terminology: «Господи», «милость» и «дела рук Твоих» сохранены. Местоимение «Твоих» с прописной буквы соответствует принятому в черновике благоговейному оформлению. В примечании не следует предлагать «всё, что Ты сотворил» как равноправную лексическую альтернативу, поскольку это уже истолковывает образ «дел рук» как исключительно творческий.
