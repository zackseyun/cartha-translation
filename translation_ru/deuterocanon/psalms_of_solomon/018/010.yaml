lexical_decisions:
- source_word: γενεὰ ἀγαθὴ
  choice: доброе поколение
  rationale: Сохраняет собирательное значение γενεά и широкое, незауженное значение ἀγαθή; порядок слов естественен для современного русского языка.
- source_word: ἐν φόβῳ θεοῦ
  choice: в страхе Божьем
  rationale: Сохраняет весомую библейскую формулу, включающую благоговение, трепет и послушание, не сводя её только к почтению.
- source_word: ἐν ἡμέραις ἐλέους
  choice: в дни милости
  rationale: Близко передаёт множественное число и сохраняет возможность понимания этих дней как отмеченных Божьей милостью.
- source_word: διάψαλμα
  choice: Перерыв
  rationale: Доступно передаёт вероятную литургическую или музыкальную функцию термина, не приписывая ему излишне точного значения.
- source_word: '[именная фраза без связки]'
  choice: тире без добавленного глагола
  rationale: Греческий текст не содержит глагола; русская поэтическая речь допускает такую конструкцию, а тире делает её ясной, не устраняя исходную лаконичность.
theological_decisions:
- issue: Передача φόβος θεοῦ
  choice: страх Божий
  alternative: благоговение перед Богом
  rationale: Традиционная библейская формула сохраняет смысловое напряжение между страхом, трепетом, благоговением и послушанием.
- issue: Характер «дней милости»
  choice: сохранена неопределённая формула «в дни милости»
  alternative: во дни Божьей милости
  rationale: В греческом тексте не назван податель милости, хотя контекст может подразумевать Бога; перевод не делает это подразумевание явным.
translation_notes:
  register: Лаконичный, возвышенный поэтический регистр. Сохранена безглагольная структура греческой строки; тире помогает естественному русскому чтению. Форма «Божьем» современная литературная, без архаизации.
