translation:
  language: ru
  text: Да очистит Бог Израиль ко дню милости в благословении, ко дню избрания при воздвижении[a] Своего Помазанника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при возвышении Своего Помазанника». Греческое слово допускает значения воздвижения, поставления и возвышения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρίσαι
  choice: да очистит
  rationale: Форма может быть понята как аорист оптатива третьего лица единственного числа и в данном синтаксисе естественно выражает пожелание или молитву. «Очистит» сохраняет как обрядовый, так и нравственно-духовный оттенок.
- source_word: Ἰσραήλ
  choice: Израиль
  rationale: 'При подлежащем ὁ θεός несклоняемое Ἰσραήλ естественнее всего понимать как прямое дополнение: Бог очищает Израиль. Это не требует вставки «нас» и не превращает сочетание в «Бог Израиля».'
- source_word: εἰς ἡμέραν ἐλέους
  choice: ко дню милости
  rationale: 'Предлог εἰς имеет направленное, перспективное значение: очищение совершается в преддверии грядущего дня милости.'
- source_word: ἐν εὐλογίᾳ
  choice: в благословении
  rationale: 'Буквальная и намеренно открытая формулировка сохраняет неясность связи оборота: он может обозначать обстоятельство очищения либо характеризовать день милости.'
- source_word: εἰς ἡμέραν ἐκλογῆς
  choice: ко дню избрания
  rationale: «Избрание» естественно передаёт существительное ἐκλογή в библейском контексте и сохраняет идею выбора, не уточняя без основания, кто именно избирает или избирается.
- source_word: ἐν ἀνάξει
  choice: при воздвижении
  rationale: «Воздвижение» сохраняет образ поднятия и допускает оттенки поставления, явления и возвышения, не сводя выражение только к царскому прославлению.
- source_word: χριστοῦ αὐτοῦ
  choice: Своего Помазанника
  rationale: Χριστός здесь является титулом ожидаемой фигуры. «Помазанник» передаёт исходный смысл титула и его иудейско-мессианский контекст; местоимение «Своего» однозначно относится к Богу.
theological_decisions:
- issue: Синтаксическая роль Ἰσραήλ
  choice: 'Прямое дополнение: «Бог [да] очистит Израиль»'
  alternative: «Бог Израиля да очистит нас»
  rationale: Артикль и именительный падеж в ὁ θεός отмечают подлежащее, тогда как несклоняемое Ἰσραήλ может быть дополнением. Такое чтение даёт переходному глаголу выраженный объект и не требует добавлять отсутствующее в греческом «нас».
- issue: Значение ἐν ἀνάξει χριστοῦ αὐτοῦ
  choice: «при воздвижении Своего Помазанника»
  alternative: «при возвышении Своего Помазанника»
  rationale: 'Выбранный вариант сохраняет конкретный образ поднятия и богословскую открытость: речь может идти о поставлении, явлении или возвышении Помазанника.'
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейской торжественностью. Частица «да» естественно передаёт пожелательный оптатив. Синтаксическая параллель «ко дню… ко дню…» сохранена; неоднозначные предложные связи не уточняются сверх греческого текста.
