base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/004.yaml
  text: And your love is upon the offspring of Abraham, the sons of Israel. Your discipline is upon us as upon a firstborn, an only son,
translation:
  language: ru
  text: И любовь Твоя — на потомках Авраама, сынах Израиля. Наставление Твоё — на нас, как на сыне-первенце, единственном сыне,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη σου
  choice: любовь Твоя
  rationale: Прямо передаёт ἀγάπη и сохраняет тёплый заветный оттенок; возвышенный порядок слов уместен в поэтическом обращении к Богу.
- source_word: σπέρμα Ἀβραάμ
  choice: потомках Авраама
  rationale: σπέρμα употреблено в собирательном значении; «потомки» естественно звучит по-русски и ясно передаёт связь с Авраамом.
- source_word: υἱοὺς Ἰσραήλ
  choice: сынах Израиля
  rationale: Сохраняет буквальный образ «сынов» и его перекличку с последующим единственным числом υἱόν; приложение поясняет, кто такие потомки Авраама.
- source_word: ἡ παιδία σου
  choice: наставление Твоё
  rationale: Передаёт исправляющее и воспитывающее воздействие, не сводя значение к наказанию. Форма παιδία в данном контексте понимается как παιδεία.
- source_word: ἐφʼ ἡμᾶς
  choice: на нас
  rationale: Сохраняет повтор предлога ἐπί и параллелизм с предшествующим «на потомках».
- source_word: ὡς υἱὸν πρωτότοκον μονογενῆ
  choice: как на сыне-первенце, единственном сыне
  rationale: Сохраняет оба определения — πρωτότοκον и μονογενῆ — не сливая их и передавая одновременно образ первенца и уникально дорогого единственного сына.
theological_decisions:
- issue: Соотношение образов «первенец» и «единственный сын»
  choice: 'Сохранены оба определения в приложении: «сыне-первенце, единственном сыне»'
  alternative: «единственном первородном сыне»
  rationale: Греческий текст намеренно соединяет πρωτότοκον и μονογενῆ. Перевод не устраняет возможное смысловое напряжение и не навязывает ему позднейшее догматическое истолкование.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Синтаксический параллелизм двух предложений и повтор «на» сохранены; конечная запятая оставлена, поскольку стих продолжается в следующем сегменте.
