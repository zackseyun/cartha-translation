  text: And they have not gone astray since the day he created them[a]. From ancient generations they have not departed from their ways[d][c][b], unless God commanded them by the command of his servants.
translation:
  language: ru
  text: И они не уклонялись с того дня, как Он сотворил их.[a] Со времён древних поколений они не отступали от своих путей,[b] если только Бог не повелел им по повелению Своих рабов.[c]
