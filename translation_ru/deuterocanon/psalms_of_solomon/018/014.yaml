    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: ἐπλανήθησαν
  choice: не уклонились
  rationale: Передаёт отклонение от установленного пути и не уточняет внешнюю причину; вариант «не блуждали» отмечен в сноске.
- source_word: ἔκτισεν
  choice: сотворил
  rationale: Прямое и естественное библейское соответствие глаголу κτίζω в контексте Божьего творения.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: со дня, когда
  rationale: Естественно передаёт начальную временную точку и продолжающееся с того дня состояние.
- source_word: ἀπὸ γενεῶν ἀρχαίων
  choice: со времён древних поколений
  rationale: Сохраняет явное упоминание поколений и значение глубокой древности.
- source_word: ἀπέστησαν
  choice: не отступали
  rationale: Передаёт удаление от установленного порядка и сохраняет сочетание с «путями».
- source_word: ὁδῶν αὐτῶν
  choice: от своих путей
  rationale: Сохраняет широкий образный диапазон ὁδός; в данном контексте это могут быть установленные пути движения или порядки.
- source_word: ἐνετείλατο
  choice: повелевал
  rationale: Передаёт властное распоряжение; несовершенный русский вид естественно согласуется с описанием неизменного порядка на протяжении поколений.
- source_word: ἐν ἐπιταγῇ δούλων αὐτοῦ
  choice: велением Своих рабов
  rationale: Формально сохраняет инструментальное ἐν и зависимый родительный δούλων αὐτοῦ, не устраняя трудность и неоднозначность связи; возможное посредническое понимание вынесено в сноску.
- source_word: δούλων
  choice: рабов
  rationale: Точно передаёт δοῦλος и подчёркивает полную принадлежность Богу, не смягчая слово до «служителей».
theological_decisions:
- issue: К кому относится местоимение «они»
  choice: Оставить «они» без уточнения референта
  alternative: Назвать небесные светила, стихии или сотворённые существа
  rationale: В самом греческом предложении подлежащее подразумевается и определяется контекстом; уточнение в переводе преждевременно устранило бы эту неоднозначность.
- issue: Связь выражения ἐν ἐπιταγῇ δούλων αὐτοῦ
  choice: Сохранить формальное «велением Своих рабов»
  alternative: «через Своих рабов» или «по установлению через Своих рабов»
  rationale: Родительный падеж буквально связывает веление с Божьими рабами, тогда как функция всей предложной группы допускает разные толкования. Основной текст не должен безоговорочно превращать рабов в посредников.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Заглавные местоимения «Он», «Своих» обозначают Бога по принятой русской религиозно-литературной норме. Синтаксическая трудность заключительной фразы сохранена, но пояснена сноской.
