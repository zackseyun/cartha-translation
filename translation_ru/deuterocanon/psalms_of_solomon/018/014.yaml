    issue: Вид глагола «повелевал»
    rationale: Греческое ἐνετείλατο — аорист. Несовершенный вид в русском создаёт значение обычного или многократного действия, которого текст прямо не задаёт.
  - severity: low
    issue: Не вполне естественное «не уклонились со дня, когда...»
    rationale: Для длительности от момента творения современный русский предпочтительно употребляет «не уклонялись с того дня, как...».
  - severity: low
    issue: Неясность оборота «разве только Бог повелевал им велением...»
    rationale: «Если только Бог не повелел им по повелению Своих рабов» точнее передаёт εἰ μὴ с аористом и делает синтаксическую связь понятнее, не устраняя смысловую трудность оригинала.
