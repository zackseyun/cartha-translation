  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитающий в вышних местах»; или: «обитающий на высочайших небесах».'
    reason: Греческое выражение ἐν ὑψίστοις буквально допускает значения «в вышних местах» и, по контексту, «на высочайших небесах», но прямо не называет небеса.
lexical_decisions:
- source_word: μέγας
  choice: велик
  rationale: Передаёт основное значение прилагательного и естественно звучит в славословии, не сводя смысл исключительно к могуществу.
- source_word: ἔνδοξος
  choice: славен
  rationale: Сохраняет прямую связь со славой Бога и образует естественную для русского славословия пару «велик и славен».
- source_word: ἐν ὑψίστοις
  choice: на высотах
  rationale: Передаёт возвышенный пространственный образ естественным современным русским языком, не уточняя сверх греческого текста, что речь непременно идёт о небесах.
- source_word: κατοικῶν
  choice: обитающий
  rationale: Причастие сохраняет форму и значение продолжающегося пребывания; слово звучит достойно и уместно по отношению к Богу.
