    reason: lexical_alternative
lexical_decisions:
- source_word: ῥάβδον
  choice: жезлом
  rationale: ῥάβδος означает жезл, посох или розгу. В сочетании с παιδεία слово «жезл» сохраняет образ власти и исправительного воздействия, не сводя его только к телесному наказанию.
- source_word: παιδείας
  choice: наставления
  rationale: παιδεία охватывает воспитание, обучение и исправление. «Наставление» естественно по-русски и сохраняет более широкий смысл, чем одно лишь «наказание».
- source_word: χριστοῦ
  choice: Помазанника
  rationale: χριστός здесь выступает как мессианский титул; «Помазанник» непосредственно передаёт его значение и естественно сочетается с родительным «Господня».
- source_word: κυρίου
  choice: Господня
  rationale: Родительный падеж κυρίου передан традиционной и ясной конструкцией «Помазанника Господня», при сохранении возможной синтаксической неоднозначности в сноске.
- source_word: φόβῳ
  choice: страхе
  rationale: φόβος в отношении Бога включает благоговение, однако «страх» точнее сохраняет библейскую весомость исходного слова.
- source_word: θεοῦ αὐτοῦ
  choice: его Богом
  rationale: Явное местоимение αὐτοῦ сохранено; предлог «перед» требует творительного падежа и создаёт естественное русское выражение «в страхе перед его Богом».
- source_word: σοφίᾳ
  choice: мудрости
  rationale: σοφία обычно и прямо означает мудрость.
- source_word: πνεύματος
  choice: духа
  rationale: Безартиклевое πνεύματος допускает понимание как человеческого духа, так и Божьего Духа; строчная буква в основном тексте не предрешает вопрос.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: δικαιοσύνη в перечне качеств естественно передаётся как «праведность»; возможный оттенок справедливости отмечен в сноске.
- source_word: ἰσχύος
  choice: силе
  rationale: ἰσχύς обозначает силу или мощь; «сила» — наиболее нейтральный и естественный русский эквивалент.
theological_decisions:
- issue: Связь χριστοῦ κυρίου
  choice: Помазанника Господня
  alternative: Господа Помазанника; Помазанника-Господа
  rationale: Сжатая последовательность родительных форм допускает разные синтаксические соотношения. Основной вариант хорошо соответствует обычному мессианскому выражению, но неоднозначность сохранена в примечании.
- issue: Значение πνεύματος
  choice: духа
  alternative: Духа
  rationale: Греческий текст сам по себе не вынуждает видеть здесь прямое указание на Божьего Духа. Строчное написание осторожно сохраняет неоднозначность, а альтернативное понимание отмечено в сноске.
- issue: Соотношение σοφίᾳ с последующими родительными
  choice: в мудрости духа, праведности и силе
  alternative: в мудрости духа, праведности и силы
  rationale: Пунктуация и синтаксическое членение допускают либо перечень параллельных качеств, либо зависимость всех трёх родительных от «мудрости». Основной перевод выбирает более естественный по-русски перечень, не устраняя альтернативу из примечания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Жезл», «Помазанник» и «праведность» сохраняют образность и богословскую насыщенность оригинала; синтаксис сделан понятным без устранения реальной неоднозначности греческого текста.
