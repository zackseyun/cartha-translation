  yaml_path: translation/deuterocanon/psalms_of_solomon/018/002.yaml
  text: Your kindness is upon Israel like a rich gift[a]; your eyes look upon them[c][b], and none of them will be lacking.
translation:
  language: ru
  text: Твоя доброта над Израилем — словно щедрый дар[a]; Твои очи взирают на них[b], и никто из них не будет терпеть недостатка[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий образ поэтически сжат; буквально в нём говорится о «щедром даре» над Израилем. δόμα означает «дар», а не «кровлю» (δῶμα).
    reason: lexical_clarification
  - marker: b
    text: Местоимение стоит в среднем роде множественного числа; здесь оно отнесено к Израилю как к народу.
    reason: referent_clarification
  - marker: c
    text: 'Или: «и среди них не будет недостатка».'
    reason: alternative_reading
lexical_decisions:
- source_word: χρηστότης
  choice: доброта
  rationale: Слово обозначает благость, проявляющуюся как доброе и благожелательное отношение. «Доброта» естественно передаёт личный и деятельный оттенок, не сужая его до отдельного благодеяния.
- source_word: δόματος πλουσίου
  choice: словно щедрый дар
  rationale: δόμα (с омикроном) означает «дар», а не «кровлю/дом» (δῶμα). «Щедрый дар» передаёт πλούσιος в значении обильного, богатого дара; «словно» естественно выражает сжатое поэтическое сопоставление.
- source_word: ἐπὶ Ἰσραήλ
  choice: над Израилем
  rationale: ἐπί здесь изображает доброту Бога, простирающуюся над Израилем; «над» сохраняет пространственно-поэтический образ.
- source_word: ἐπιβλέποντες
  choice: взирают на
  rationale: Причастие передаёт направленный, внимательный взгляд. «Взирают» сохраняет зрительный образ и возвышенный поэтический регистр, не заменяя его более истолковывающим «охраняют».
- source_word: οὐχ ὑστερήσει ἐξ αὐτῶν
  choice: никто из них не будет терпеть недостатка
  rationale: 'Греческая фраза эллиптична: единственное число глагола допускает подразумеваемое «никто/ни один», а ὑστερέω может означать нуждаться или испытывать недостаток. Русская формулировка ясно передаёт этот вероятный смысл.'
theological_decisions:
- issue: Смысл заключительной фразы
  choice: Речь идёт о том, что никто из находящихся под Божьим взором не будет терпеть недостатка.
  alternative: '«И среди них не будет недостатка»; менее вероятно: «Он не оставит без помощи никого из них».'
  rationale: Греческий текст краток и допускает безличное понимание, однако сочетание глагола в единственном числе с ἐξ αὐτῶν естественно восполняется как «никто из них». В перевод не вводится конкретный вид обеспечения или защиты.
- issue: Соотнесение местоимения αὐτά
  choice: В основном тексте оно передано личным «них» по смыслу — как указание на людей Израиля.
  alternative: 'Формально средний род множественного числа может отсылать к ранее названным предметам или обстоятельствам: «на это».'
  rationale: Ближайший смысловой референт — Израиль как совокупность людей, но грамматическая форма местоимения не позволяет считать это совершенно однозначным; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. «Очи» и «взирают» поддерживают достоинство поэтической речи, оставаясь понятными; синтаксис сделан естественным для русского, а неясности греческого отмечены в сносках.
