  yaml_path: translation/deuterocanon/psalms_of_solomon/018/013.yaml
  text: Their way is in the fear of God every day[b][a], from the day God created them and forever.
translation:
  language: ru
  text: Каждый день их путь[a] — в страхе Божьем[b], со дня, когда Бог сотворил их, и вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «образ жизни»; или: «стезя» вместо «путь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в благоговении перед Богом» вместо «в страхе Божьем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φόβῳ θεοῦ
  choice: в страхе Божьем
  rationale: Сохраняет устойчивое библейское выражение и его богословскую весомость; здесь страх включает благоговение и направленную к Богу верность, но перевод не сводит значение только к благоговению.
- source_word: ὁδὸς
  choice: путь
  rationale: Сохраняет метафору жизненного пути; «образ жизни» яснее раскрывает смысл, но уже является толкованием.
- source_word: καθʼ ἑκάστην ἡμέραν
  choice: каждый день
  rationale: Естественно передаёт регулярность и непрерывность действия.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: со дня, когда
  rationale: Точно обозначает исходную временную точку и естественно соединяется в русском языке с последующим глаголом.
- source_word: ἔκτισεν
  choice: сотворил
  rationale: Передаёт обычное значение κτίζω и сохраняет акцент на Боге как Творце.
- source_word: ἕως αἰῶνος
  choice: вовеки
  rationale: Краткое и уместное для поэтического регистра обозначение неограниченной длительности; соответствует эсхатологической открытости выражения.
