  text: Blessed are those who come to be in those days[b][a], to see the good things of the Lord that he will do for the generation to come.
translation:
  language: ru
  text: Блаженны те, кто будет жить в те дни[a] и увидит благие дела[b], которые Господь совершит для грядущего поколения.
  philosophy: optimal-equivalence
  footnotes:
