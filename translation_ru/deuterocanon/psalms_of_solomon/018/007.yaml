lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Сохраняет возвышенное звучание формулы блаженства и не сводит её к субъективному ощущению счастья.
- source_word: οἱ γενόμενοι
  choice: те, кому доведётся жить
  rationale: Естественно передаёт людей, которые окажутся в названном времени, не сужая значение причастия исключительно до «родившихся».
- source_word: ἐν ἡμέραις ἐκείναις
  choice: в те дни
  rationale: Точная, привычная для библейской речи и при этом современная временная формула.
- source_word: ἰδεῖν
  choice: увидеть
  rationale: Прямо передаёт инфинитив и подразумеваемую возможность стать свидетелями Господних благодеяний.
- source_word: τὰ ἀγαθὰ Κυρίου
  choice: блага от Господа
  rationale: Сохраняет широкое значение субстантивированного прилагательного и естественно выражает Господа как источник благ, не ограничивая смысл только духовными благословениями.
- source_word: ἃ ποιήσει
  choice: которые Он дарует
  rationale: В сочетании с «благами» это естественная русская передача того, что Господь произведёт или осуществит; божественная деятельность и будущее время сохранены.
- source_word: γενεᾷ τῇ ἐρχομένῃ
  choice: грядущему поколению
  rationale: Кратко и точно сохраняет направленность к поколению, которое придёт в будущем.
theological_decisions:
- issue: Связь «благ Господа» с Его будущим действием
  choice: «блага от Господа, которые Он дарует»
  alternative: «добрые дела Господа, которые Он совершит»
  rationale: Греческое τὰ ἀγαθά обозначает прежде всего блага или добро, а не обязательно дела; выбранный вариант не превращает неопределённые блага в конкретную категорию деяний.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Оборот «кому доведётся жить» делает фразу естественной и сохраняет широту γενόμενοι; местоимение «Он» однозначно относится к Господу.
