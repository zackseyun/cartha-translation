lexical_decisions:
- source_word: κατευθῦναι
  choice: направлять
  rationale: Инфинитив выражает целенаправленное нравственное руководство; «направлять» естественно передаёт движение по верному пути, не сужая значение до обучения.
- source_word: ἄνδρας
  choice: мужей
  rationale: Греческое слово имеет явно мужскую форму. «Мужей» сохраняет её и соответствует достоинству поэтической речи, хотя в современной речи звучит возвышенно.
- source_word: ἐν ἔργοις δικαιοσύνης
  choice: в делах праведности
  rationale: Передача сохраняет конкретное существительное ἔργοις («делах») и обычное религиозно-нравственное значение δικαιοσύνη («праведность»), не исключая оттенка справедливости.
- source_word: φόβῳ θεοῦ
  choice: в страхе Божьем
  rationale: Дательный падеж допускает значение сферы или образа действия. Эта формулировка сохраняет библейскую идиому и не сводит страх Божий лишь к чувству испуга.
- source_word: καταστῆσαι
  choice: поставить
  rationale: Инфинитив параллелен κατευθῦναι и обозначает помещение или утверждение людей перед Господом. «Поставить» сохраняет широту исходного значения.
- source_word: ἐνώπιον Κυρίου
  choice: перед Господом
  rationale: Прозрачная и естественная передача пространственно-реляционного оборота; она может означать также пребывание в присутствии Господа.
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В данном нравственно-религиозном контексте «праведность» передаёт основное значение, но греческое слово может также обозначать справедливость; этот оттенок отмечен в сноске.
- issue: Синтаксическая связь φόβῳ θεοῦ
  choice: в страхе Божьем
  alternative: страхом Божьим
  rationale: Дательный падеж можно понимать как обозначение сферы или образа действия либо как средство. Основной текст сохраняет традиционную библейскую формулу, не устраняя грамматическую многозначность полностью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Форма «мужей» сознательно сохраняет мужскую форму греческого ἄνδρας; «Божьем» и «перед» предпочтены более архаичным «Божием» и «пред».
