lexical_decisions:
- source_word: τῷ μακρὰν ἀπὸ θεοῦ
  choice: Когда я был далеко от Бога
  rationale: Сжатый и несколько необычный греческий оборот передан как обстоятельство времени; это естественно по-русски и не добавляет нового содержания.
- source_word: παρʼ ὀλίγον
  choice: едва не
  rationale: Устойчивый оборот означает «почти, едва не»; выбран естественный русский эквивалент.
- source_word: ἐξεχύθη ἡ ψυχή μου εἰς θάνατον
  choice: душа моя едва не излилась в смерть
  rationale: Сохранён яркий образ глагола ἐκχέω — «изливать» — и слово ψυχή как «душа»; необычное направление «в смерть» отражает греческое εἰς θάνατον и поэтическое напряжение строки.
- source_word: σύνεγγυς πυλῶν ᾅδου
  choice: у самых врат Аида
  rationale: σύνεγγυς выражает непосредственную близость, поэтому «у самых» точнее простого «у». «Аид» сохраняет прямое обозначение ᾅδης и не сужает его до позднейшего представления о месте наказания.
- source_word: μετὰ ἁμαρτωλοῦ
  choice: вместе с грешником
  rationale: Сохранены единственное число и отсутствие определённости. Формулировка не решает, имеется ли в виду отдельный человек или обобщённый образ грешника.
theological_decisions:
- issue: Передача ᾅδου
  choice: Аида
  alternative: могилы; царства мёртвых; ада
  rationale: Греческий текст прямо употребляет ᾅδης. Транслитерированная форма сохраняет образ подземного мира/царства мёртвых и не подменяет его более узким догматическим понятием.
- issue: Передача ψυχή
  choice: душа
  alternative: жизнь
  rationale: ψυχή допускает оба значения. «Душа» сохраняет лексику молитвенного самовыражения и буквальный образ, а значение «жизнь» отмечено в сноске.
- issue: Значение единственного ἁμαρτωλοῦ
  choice: с грешником
  alternative: с грешным; с нечестивцем
  rationale: Греческая форма может обозначать как отдельного грешника, так и представителя целого разряда людей. Основной текст сохраняет неопределённое единственное число, не навязывая ни индивидуальное, ни собирательное толкование.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Сохранены метафора изливающейся души и образ врат Аида; синтаксис слегка упорядочен тире, чтобы ясно связать вторую пространственную характеристику с угрозой смерти.
