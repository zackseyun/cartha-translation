  text: If a person is rebuked by means of his ruin[b][a], your testing is in his flesh and in poverty.
translation:
  language: ru
  text: Если человека обличают через его гибель[a][b], то Твоё испытание — в его плоти и в бедности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если душа обличается в руке своей гибели». Греческий текст первой части стиха труден и допускает разные толкования.'
    reason: alternative_reading
  - marker: b
    text: 'Более буквально вторая часть: «Твоё испытание — в его плоти и в бедности».'
    reason: formal_rendering
lexical_decisions:
- source_word: ἐλέγχηται (ἐλέγχω)
  choice: обличается
  rationale: Глагол передаёт выявление проступка и исправительное порицание. «Обличается» сохраняет этот оттенок, не превращая выражение в судебный приговор.
- source_word: ψυχήν (ψυχή)
  choice: человек
  rationale: В семитизированном греческом ψυχή может обозначать не только «душу» или «жизнь», но и самого человека. Такое значение также согласуется с последующими местоимениями мужского рода, относящимися к тому же лицу.
- source_word: ἐν χειρὶ
  choice: через
  rationale: Оборот «в руке» здесь, вероятно, является семитизмом со значением средства или действующей силы. Естественное русское «через» передаёт инструментальный смысл, тогда как буквальный образ сохранён в сноске.
- source_word: ἀπωλίας (ἀπώλεια)
  choice: крушение
  rationale: Слово может означать гибель, уничтожение или разорение. «Крушение» допускает тяжёлое разорение человека, не утверждая непременно его физическую смерть.
- source_word: δοκιμασία
  choice: испытываешь
  rationale: Существительное обозначает испытание, выявляющее подлинное качество. В русском предложении оно естественно передано личной глагольной конструкцией при сохранении обращения к Богу.
- source_word: σαρκί (σάρξ)
  choice: плоть
  rationale: «Плоть» сохраняет конкретный телесный смысл и традиционную библейскую лексику, не сводя слово к отвлечённой человеческой природе.
- source_word: πενίᾳς
  choice: бедностью
  rationale: Несмотря на необычную форму в данном греческом свидетеле, слово ясно указывает на бедность или нужду; «бедностью» непосредственно передаёт материальное лишение как средство испытания.
theological_decisions:
- issue: Синтаксис трудного оборота ἐν χειρὶ ἀπωλίας αὐτοῦ
  choice: «через собственное крушение»
  alternative: «в руке своей гибели» / «во власти своей гибели»
  rationale: Греческий текст допускает более буквальное понимание «в руке», однако, вероятно, отражает семитский инструментальный оборот. Основной текст остаётся понятным, а буквальная конструкция и неопределённость сохранены в сноске.
- issue: Связь δοκιμασία σου с последующими обстоятельствами
  choice: «Ты испытываешь его плоть и бедностью»
  alternative: «Твоё испытание — в его плоти и в бедности»
  rationale: Глагольная русская конструкция естественно выражает обращение к Богу и передаёт испытание через телесную немощь и материальную нужду. Более формальное чтение приведено в сноске, поскольку греческий синтаксис допускает его.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенной библейской лексикой. Заглавное «Ты» обозначает обращение к Богу, явное по контексту притяжательного σου. Трудность греческого синтаксиса не скрыта: основной текст передаёт вероятный смысл, а буквальные варианты вынесены в сноски.'
