base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/005.yaml
  text: I will give thanks to you[a], O God, because you took hold of me for salvation[d][c][b], and you did not count me with sinners for destruction.
translation:
  language: ru
  text: Буду благодарить Тебя[a], Боже, потому что Ты пришёл мне на помощь, чтобы спасти меня[b], и не причислил меня к грешникам на погибель[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Буду славить Тебя» или «Буду исповедовать Тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ты помог мне для избавления»; греческий оборот может выражать цель или результат помощи.'
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: 'Букв.: «не счёл меня вместе с грешниками на погибель».'
    reason: formal_rendering
lexical_decisions:
- source_word: ἐξομολογήσομαί
  choice: буду благодарить
  rationale: В обращённой к Богу молитве глагол выражает благодарное прославление; вариант «буду благодарить» естественен по-русски и не создаёт ошибочного впечатления исповедания греха.
- source_word: ἀντελάβου μου
  choice: Ты пришёл мне на помощь
  rationale: ἀντιλαμβάνομαι здесь означает действенно помочь или поддержать. Формулировка передаёт смысл, а также сохраняет связь с образом Бога как помощника в ближайшем контексте.
- source_word: εἰς σωτηρίαν
  choice: чтобы спасти меня
  rationale: Оборот εἰς с винительным указывает на цель или результат Божьей помощи. Русская целевая конструкция звучит естественно, не устраняя возможного оттенка результата.
- source_word: οὐκ ἐλογίσω με
  choice: не причислил меня
  rationale: 'λογίζομαι здесь имеет оценочно-классифицирующий смысл: говорящий не был сочтён принадлежащим к группе грешников.'
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: к грешникам
  rationale: Русское «причислить к» естественно передаёт совместное отнесение к группе. Определённый артикль в русском отдельно не выражается; его групповое значение сохраняется контекстом.
- source_word: εἰς ἀπώλειαν
  choice: на погибель
  rationale: Фраза обозначает гибель как предназначенный исход. «На погибель» сохраняет направленность греческого εἰς и торжественный библейский регистр.
theological_decisions:
- issue: Характер σωτηρία
  choice: спасти меня
  alternative: даровать мне спасение / избавить меня
  rationale: Греческое слово может обозначать как религиозное спасение, так и конкретное избавление. Основной текст сохраняет широкое «спасти», а примечание отмечает альтернативу.
- issue: Отнесение к «грешникам» и погибели
  choice: не причислил меня к грешникам на погибель
  alternative: не счёл меня вместе с грешниками обречённым на погибель
  rationale: Выбранная формулировка не уточняет сверх текста, является ли «погибель» приговором, целью или конечным исходом, и не вводит учения о механизме осуждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Обращение «Боже» и формы местоимения с прописной буквы поддерживают достоинство текста; синтаксис остаётся понятным современному читателю. Все примечания обозначены в основном тексте.
