  text: Clothe my tongue and my lips with words of truth[c][b][a]; keep anger and senseless wrath far from me.
translation:
  language: ru
  text: Облеки мой язык и мои уста в слова истины[a]; удали от меня гнев и безрассудную ярость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Окружи», «огради» или «удержи мой язык и мои уста словами истины».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «неразумную ярость» либо «необоснованный гневный порыв».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίστειλον
  choice: облеки
  rationale: Глагол может обозначать окружение, обёртывание или облачение. «Облеки» сохраняет конкретный поэтический образ и естественно сочетается с просьбой наполнить речь истиной; возможные оттенки ограничения и охраны отмечены в сноске.
- source_word: γλῶσσάν μου καὶ τὰ χείλη μου
  choice: мой язык и мои уста
  rationale: Сохранены телесные образы и параллелизм оригинала. «Уста» передаёт χείλη в возвышенном, но понятном молитвенно-поэтическом регистре.
- source_word: ἐν λόγοις ἀληθείας
  choice: в слова истины
  rationale: При глаголе «облеки» предлог ἐν естественно передан конструкцией «облеки … в». Сочетание «слова истины» сохраняет множественное число λόγοις и зависимость родительного ἀληθείας.
- source_word: ὀργὴν καὶ θυμὸν
  choice: гнев и ярость
  rationale: Два близких, но различных греческих слова переданы двумя русскими существительными с различной интенсивностью, без их сведения в одно понятие.
- source_word: ἄλογον
  choice: безрассудную
  rationale: Слово характеризует ярость как лишённую разумного основания или контроля. «Безрассудную» точно и естественно выражает этот смысл в современном русском языке.
- source_word: μακρὰν ποίησον ἀπʼ ἐμοῦ
  choice: удали от меня
  rationale: Это естественная русская передача буквального «сделай далёкими от меня», сохраняющая направленную к Богу просьбу устранить гнев и ярость.
