  yaml_path: translation/deuterocanon/psalms_of_solomon/016/015.yaml
  text: When the righteous one endures in these things[b][a], he will be shown mercy by the Lord.
translation:
  language: ru
  text: Когда праведник[b] переносит всё это[a], он будет помилован Господом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Перенося всё это, праведник будет помилован Господом». Греческий оборот может указывать как на время, так и на обстоятельство, при котором это произойдёт.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально — форма мужского рода в единственном числе; возможно также: «праведный человек». Здесь она может употребляться в обобщающем смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ὑπομεῖναι
  choice: когда … устоит
  rationale: Конструкция ἐν с субстантивированным инфинитивом допускает временное и обстоятельственно-инструментальное понимание. В основном тексте выбран естественный для русского языка временной оборот; другая возможность сохранена в примечании.
- source_word: δίκαιον
  choice: праведник
  rationale: Винительный падеж здесь, вероятнее всего, обозначает смысловой субъект инфинитива. Существительное «праведник» кратко и естественно передаёт субстантивированное прилагательное мужского рода, которое может иметь обобщающий смысл.
- source_word: ἐν τούτοις
  choice: среди всего этого
  rationale: Оборот отсылает к ранее упомянутым испытаниям и тяготам. Формулировка сохраняет эту отсылку, не уточняя обстоятельства сверх греческого текста.
- source_word: ἐλεηθήσεται
  choice: будет помилован
  rationale: Будущее страдательного залога передано страдательной конструкцией. «Помилован» сохраняет смысл оказанной милости, а не просто сочувствия.
- source_word: ὑπὸ Κυρίου
  choice: Господом
  rationale: ὑπό с родительным падежом обозначает действующее лицо при страдательном глаголе; русский творительный падеж естественно и точно передаёт эту функцию.
theological_decisions:
- issue: Передача κύριος
  choice: Господь / Господом
  alternative: Владыка / Владыкой
  rationale: В молитвенно-богословском контексте «Господь» является традиционным и современно понятным соответствием κύριος, не добавляющим частного конфессионального толкования.
- issue: Связь стойкости праведника с Божьей милостью
  choice: 'временная связь: «когда … устоит»'
  alternative: 'обстоятельственно-инструментальная связь: «проявляя стойкость …»'
  rationale: Греческая конструкция допускает оба оттенка. Основной текст не представляет милость как заслуженную награду, а альтернативный синтаксический оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-поэтического текста. Синтаксис сделан ясным для широкого читателя; страдательная конструкция и богословски значимое слово «милость» сохранены через форму «будет помилован».
