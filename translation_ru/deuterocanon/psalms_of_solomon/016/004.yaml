  text: He prodded me like a horse’s goad He prodded me like a horse’s goad to watchfulness for Him; my Savior and my helper saved me at all times.
translation:
  language: ru
  text: Он кольнул меня, словно стрекало, которым погоняют коня, — к его бодрствованию[a]; мой Спаситель и Помощник во всякое время спасал меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к его бодрствованию». Референт греческого местоимения «его» (αὐτοῦ) неясен; возможны различные толкования этой фразы.'
    reason: Передаёт присутствующее в оригинале местоимение, не предрешая его референт или смысл связи с «бодрствованием».
lexical_decisions:
- source_word: ἔνυξέν
  choice: уколол
  rationale: Глагол νύσσω обозначает укол или толчок острым предметом; «уколол» сохраняет конкретность образа стрекала.
- source_word: κέντρον ἵππου
  choice: стрекало коня
  rationale: κέντρον здесь — острый погоняющий инструмент; родительный ἵππου указывает на его употребление для коня.
- source_word: ἐγρήγορσιν
  choice: бодрствовать
  rationale: Существительное означает бодрствование, бдительность или пробуждение; глагольная конструкция естественнее по-русски.
- source_word: σωτὴρ
  choice: Спаситель
  rationale: Обычный и содержательно точный эквивалент; прописная буква уместна как обозначение Бога в контексте молитвенного обращения.
- source_word: ἀντιλήμπτωρ
  choice: Помощник
  rationale: Слово обозначает того, кто поддерживает и приходит на помощь; «Помощник» естественно и не сужает смысл до одного вида защиты.
- source_word: ἐν παντὶ καιρῷ
  choice: во всякое время
  rationale: Формально и идиоматически передаёт постоянство помощи без усиления до абсолютного «всегда».
- source_word: ἔσωσέν με
  choice: спасал меня
  rationale: Русский несовершенный вид согласуется с обстоятельством повторяемости «во всякое время», сохраняя значение избавления.
theological_decisions:
- issue: Референт αὐτοῦ в выражении ἐπὶ τὴν ἐγρήγορσιν αὐτοῦ
  choice: 'Не выражать местоименный референт в основном тексте: «чтобы я бодрствовал»'
  alternative: «чтобы бодрствовать для Него» или «к Его бодрствованию»
  rationale: Греческое αὐτοῦ буквально допускает несколько синтаксических и смысловых связей, а формулировка «для Него» богословски конкретизирует не вполне ясный текст. Основной перевод передаёт несомненную идею приведения к бдительности, а неоднозначность отмечена в сноске.
- issue: Заглавные буквы в «Спаситель» и «Помощник»
  choice: Писать с прописной буквы
  alternative: Писать со строчной буквы
  rationale: В контексте Псалмов Соломона эти наименования относятся к Богу; прописная буква соответствует современному русскому религиозному регистру, не добавляя отдельного догматического утверждения.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Конкретный образ стрекала сохранён; тяжёлая буквальная конструкция перестроена в естественную целевую фразу. Все сноски отмечены в основном тексте.
