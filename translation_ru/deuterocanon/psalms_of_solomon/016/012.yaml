    reason: lexical_alternative
  - marker: b
    text: 'Или: «мне будет достаточно того, что дано».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  choice: благоволение
  rationale: Слово обозначает благосклонность, добрую волю или благорасположение. «Благоволение» естественно для молитвенного контекста и не сужает смысл до сугубо эмоционального удовольствия.
- source_word: ἱλαρότητος
  choice: радость
  rationale: Слово передаёт бодрую радость, весёлость или светлое расположение духа. «Радость» звучит современно и достойно, не приобретая разговорного оттенка.
- source_word: στήρισον
  choice: утверди
  rationale: Глагол означает сделать твёрдым, устойчивым. «Утверди» сохраняет этот образ и позволяет отличить его от ἐνισχύω в следующей части стиха.
- source_word: ψυχήν
  choice: душу
  rationale: В молитвенном контексте «душа» естественно передаёт внутреннего человека и сохраняет традиционную антропологическую широту ψυχή.
- source_word: ἐν τῷ ἐνισχῦσαί σε
  choice: когда Ты укрепишь
  rationale: Конструкция ἐν с артиклевым инфинитивом допускает временное понимание. Такой перевод ясен по-русски и сохраняет обстоятельственный характер оборота.
- source_word: ἀρκέσει μοι
  choice: мне будет довольно
  rationale: Будущая форма выражает достаточность. Оборот «мне будет довольно» сохраняет прямой смысл и соответствует возвышенному, но понятному молитвенному регистру.
- source_word: τὸ δοθέν
  choice: того, что дано
  rationale: Субстантивированное причастие намеренно не уточняет ни предмет, ни дарителя. Формулировка сохраняет эту открытость и не добавляет слова «дар».
theological_decisions:
- issue: Связь εὐδοκία с просьбой об утверждении души
  choice: 'передать как средство или сопровождающее основание: «благоволением и радостью»'
  alternative: «утверди благоволение вместе с радостью в моей душе»
  rationale: Падежная форма μετὰ ἱλαρότητος и синтаксис допускают некоторую шероховатость; выбранное чтение следует наиболее естественной связи εὐδοκία с μετὰ ἱλαρότητος и не превращает благоволение однозначно во внутреннее качество молящегося.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Различие между στήρισον («утверди») и ἐνισχῦσαί («укрепишь») сохранено. Местоимение «Ты» написано с прописной буквы как принятое в русском молитвенном обращении; это регистровое, а не богословское уточнение.
