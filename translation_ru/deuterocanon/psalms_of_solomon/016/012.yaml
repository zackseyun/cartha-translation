  text: But establish my soul with favor and gladness[a]; when you strengthen my soul[b], what has been given will be enough for me.
translation:
  language: ru
  text: Но утверди мою душу благоволением и радостью[a]; когда Ты укрепишь мою душу, мне будет довольно того, что дано[b].
