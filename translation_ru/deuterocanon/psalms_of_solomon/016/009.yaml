lexical_decisions:
- source_word: κατεύθυνον
  choice: направь
  rationale: Императив выражает просьбу к Богу направить действия говорящего по верному пути; «направь» естественно передаёт значение устроения и руководства.
- source_word: τὰ ἔργα τῶν χειρῶν μου
  choice: дела моих рук
  rationale: Сохранён конкретный семитизированный образ, обозначающий труд и поступки человека; по-русски он понятен и звучит достойно.
- source_word: ἐν τόπῳ σου
  choice: в Твоём месте
  rationale: Основное значение τόπος — «место». Буквально близкий перевод сохраняет неясность выражения и не подменяет её толкованием «в Твоём присутствии».
- source_word: τὰ διαβήματά μου
  choice: мои шаги
  rationale: Образ шагов может относиться как к движениям человека, так и ко всему ходу его жизни; русский эквивалент сохраняет оба оттенка.
- source_word: ἐν τῇ μνήμῃ σου
  choice: в памятовании о Тебе
  rationale: 'Так передан вероятный объективный генитив: говорящий помнит Бога. Формулировка также соответствует параллельному употреблению в контексте псалма и избегает ошибочного понимания «в Твоей памяти».'
- source_word: διαφύλαξον
  choice: сохрани
  rationale: Глагол обозначает усиленное хранение и оберегание; «сохрани» естественно сочетается с образом жизненных шагов.
theological_decisions:
- issue: Кто является субъектом памятования в ἐν τῇ μνήμῃ σου
  choice: 'псалмопевец помнит Бога: «в памятовании о Тебе»'
  alternative: 'Бог помнит псалмопевца: «в Твоей памяти»'
  rationale: Объективное понимание родительного σου лучше согласуется с аналогичным выражением в контексте, где речь идёт о памятовании человека о Боге; альтернативу отмечает сноска, поскольку сама форма родительного падежа допускает формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Образы «дела рук» и «шаги» сохранены. Необычность выражения «в Твоём месте» намеренно удерживает конкретность и неоднозначность греческого текста; более плавное толкование дано в сноске.
