  - marker: b
    text: 'Или: «если бы Господь не поддержал меня».'
    reason: lexical_alternative
  - marker: c
    text: Слово «навеки» может относиться либо к Божьей милости, либо ко всему действию спасительной помощи.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ διενεχθῆναι
  choice: когда … отрывали
  rationale: Конструкция ἐν с субстантивированным инфинитивом имеет временное значение. Страдательное «отрывали» естественно по-русски передаёт насильственное удаление или разлучение, допускаемое глаголом διαφέρω в данном контексте.
- source_word: ψυχήν μου
  choice: душу мою
  rationale: «Душа» сохраняет личностный и духовный вес ψυχή в молитвенном контексте; инверсия придаёт строке умеренно возвышенное, но понятное звучание.
- source_word: ἀπὸ Κυρίου θεοῦ Ἰσραήλ
  choice: от Господа, Бога Израиля
  rationale: Предлог ἀπό обозначает удаление от кого-либо, а «Бога Израиля» естественно читается как приложение к «Господу».
- source_word: εἰ μὴ
  choice: если бы … не
  rationale: Сочетание вводит нереальное условие. Русская конструкция «если бы не» сохраняет условный характер фразы и её связь с предшествующим стихом.
- source_word: ἀντελάβετό μου
  choice: пришёл мне на помощь
  rationale: Средний глагол ἀντιλαμβάνομαι с родительным здесь означает поддержать или оказать помощь. Выбранный вариант точен и естествен в современном русском.
- source_word: τῷ ἐλέει αὐτοῦ
  choice: Своей милостью
  rationale: 'Дательный имеет инструментальное значение: помощь совершается посредством Божьей милости. Возвратное «Своей» ясно соотносит милость с Господом.'
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Обычное идиоматическое соответствие обороту; конечная позиция сохраняет возможную связь как с милостью, так и со всем действием помощи.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — естественное и традиционно узнаваемое соответствие κύριος в обращённом к Богу библейском тексте; контекст не требует более узкого толкования.
- issue: Сфера действия εἰς τὸν αἰῶνα
  choice: Сохранить «навеки» в конце фразы
  alternative: «Своей вечной милостью»
  rationale: Греческий порядок допускает отнесение оборота либо к милости, либо шире к спасительной помощи. Конечная позиция не устраняет эту неоднозначность.
- issue: Незавершённость условной конструкции
  choice: Сохранить условное «если бы … не»
  alternative: 'Перестроить в самостоятельное утверждение: «но Господь пришёл мне на помощь»'
  rationale: В греческом стих продолжает мысль предыдущего стиха. Самостоятельное утверждение сгладило бы синтаксическую связь и изменило риторическую форму оригинала.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным звучанием. Синтаксическая незавершённость условной части намеренно сохранена, поскольку стих завершает мысль, начатую ранее; тире помогает читателю различить временную и условную части. Все примечания отмечены в основном тексте.
