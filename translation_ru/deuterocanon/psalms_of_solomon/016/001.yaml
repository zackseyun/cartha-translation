translation:
  language: ru
  text: Когда душа моя задремала вдали от Господа,[a] я едва не соскользнул в глубокий сон.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «задремала в удалении от Господа» или «отдельно от Господа».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «едва не соскользнул в погружение сна». Греческое выражение может обозначать нисхождение в сон, его тяжесть или оцепенение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: 'Ἐν τῷ νυστάξαι (в переданном тексте: συστάξαι)'
  choice: Когда … задремала
  rationale: В издании Swete здесь следует читать νυστάξαι, а не OCR-форму συστάξαι; конструкция ἐν τῷ с аористным инфинитивом имеет временное значение. «Задремала» естественно передаёт νυστάζω и поддерживает связь с последующим ὕπνου.
- source_word: ψυχήν μου
  choice: душа моя
  rationale: ψυχή может обозначать душу, жизнь или самого человека; в молитвенно-поэтическом контексте «душа» сохраняет внутреннее и духовное звучание.
- source_word: ἀπὸ Κυρίου
  choice: вдали от Господа
  rationale: ἀπό выражает удаление или отделение. «Вдали от Господа» передаёт пространственно-реляционный образ, не уточняя его богословскую причину.
- source_word: παρὰ μικρόν
  choice: едва не
  rationale: Устойчивое сочетание означает «почти»; по-русски перед глаголом нежелательного результата естественно «едва не».
- source_word: ὠλίσθησα
  choice: соскользнул
  rationale: Глагол означает потерять опору, поскользнуться или соскользнуть. Приставочная форма сохраняет образ движения вниз и сочетается с последующим погружением в сон.
- source_word: ἐν καταφορᾷ ὕπνου
  choice: в глубокий сон
  rationale: καταφορά может обозначать движение вниз, погружение, тяжёлую дремоту или глубокий сон. В основном тексте выбран естественный русский оборот, а образ нисхождения отмечен в сноске.
- source_word: Κυρίου
  choice: Господа
  rationale: Кύριος в данном религиозном контексте передано традиционным и понятным титулом «Господь».
theological_decisions:
- issue: Выражает ли ἀπὸ Κυρίου источник состояния или удаление от Господа
  choice: 'удаление: «вдали от Господа»'
  alternative: «от Господа» как указание на источник
  rationale: Обычное значение ἀπό и контекст опасного духовного оцепенения поддерживают значение отделения. Формулировка сохраняет напряжение текста, не объясняя, было ли это удаление причиной, состоянием или следствием дремоты.
- issue: Следует ли понимать сон буквально или как образ духовной опасности
  choice: сохранён образ сна без истолкования
  alternative: явно назвать духовное оцепенение или смерть
  rationale: Стих допускает переносное прочтение, однако прямо говорит о дремоте и сне; перевод не должен подменять образ толкованием.
translation_notes:
  register: Современный литературный русский с поэтической сдержанностью. Порядок слов «душа моя» поддерживает псалмический регистр, а «едва не соскользнул в глубокий сон» остаётся понятным обычному читателю. Все сноски отмечены в основном тексте.
