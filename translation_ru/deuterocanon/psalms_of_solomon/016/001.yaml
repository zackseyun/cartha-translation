    rationale: Предоставленный исходный текст содержит συστάξαι, а перевод и лексическое решение переводят νυστάξαι. Поскольку чтение спорно на уровне предоставленных данных, предполагаемое исправление должно быть явно обозначено в сноске, а не представлено как несомненный текст.
  - severity: medium
    issue: «В глубокий сон» ослабляет καταφορᾷ
    rationale: Καταφορά допускает не только глубину сна, но и нисхождение, погружение либо сонное оцепенение. В основном тексте можно сохранить образ «сонной глубины», оставив варианты в сноске.
  - severity: medium
    issue: Сноска a неточна в формулировке «Буквально также возможно»
