  yaml_path: translation/deuterocanon/psalms_of_solomon/016/007.yaml
  text: Restrain me[a], O God, from evil sin and from every evil woman who causes a foolish man to stumble.
translation:
  language: ru
  text: Удержи меня[a], Боже, от злого греха и от всякой злой женщины, заставляющей неразумного споткнуться[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Возьми надо мной власть, Боже, и удержи от…»'
    reason: Передаёт буквальный оттенок ἐπικρατέω — господствовать, властвовать, овладевать — и его связь с ἀπό, не меняя смысла основного текста.
  - marker: b
    text: 'Буквально: «заставляющей неразумного споткнуться»; также возможно: «становящейся западнёй для неразумного».'
    reason: Сохраняет образ σκανδαλίζω и отмечает возможный переносный смысл морального падения, не внося его в основной текст.
lexical_decisions:
- source_word: ἐπικράτησόν μου ... ἀπό
  choice: Удержи меня ... от
  rationale: Императив ἐπικράτησον с местоимением и последующим ἀπό выражает просьбу к Богу взять человека под власть и тем самым удержать от названных опасностей. Русское «удержи меня от» естественно передаёт смысл просьбы, а более буквальный оттенок власти сохранён в сноске.
- source_word: ἁμαρτίας πονηρᾶς
  choice: злого греха
  rationale: ἀπό обозначает удаление или ограждение от чего-либо; πονηρά придаёт существительному сильную нравственную оценку. Несколько необычное сочетание «злой грех» сохраняет повтор πονηρᾶς в обеих частях стиха.
- source_word: πάσης γυναικὸς πονηρᾶς
  choice: всякой злой женщины
  rationale: πάσης при существительном в единственном числе имеет всеохватный смысл; «всякой» естественно для молитвенно-поэтического регистра и не ослабляет определение πονηρᾶς.
- source_word: σκανδαλιζούσης
  choice: вводящей ... в грех
  rationale: σκανδαλίζω обозначает действие, становящееся для другого западнёй, причиной падения или греха. «Вводящей в грех» ясно выражает нравственный смысл в современном русском; образ преткновения отмечен в сноске.
- source_word: ἄφρονα
  choice: неразумного
  rationale: Субстантивированное прилагательное мужского рода обозначает человека, лишённого рассудительности или мудрости. «Неразумного» сохраняет мужскую грамматическую форму, не добавляя отсутствующего в греческом существительного.
theological_decisions:
- issue: Характер действия женщины в σκανδαλιζούσης ἄφρονα
  choice: вводящей неразумного в грех
  alternative: служащей камнем преткновения для неразумного / заставляющей неразумного споткнуться
  rationale: Контекст молитвы об ограждении от греха поддерживает нравственный смысл σκανδαλίζω, но образ падения и возможная более широкая семантика не исключаются и сохранены в примечании.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-поэтической речи. Синтаксис остаётся близким к греческому параллелизму; повтор «злого / злой» намеренно передаёт повтор πονηρᾶς. Все маркеры сносок присутствуют в основном тексте.
