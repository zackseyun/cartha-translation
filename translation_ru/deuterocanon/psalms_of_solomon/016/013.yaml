  yaml_path: translation/deuterocanon/psalms_of_solomon/016/013.yaml
  text: For if you do not strengthen[b][a], who will endure discipline in poverty?
translation:
  language: ru
  text: Ибо если Ты не укрепишь[a], кто перенесёт наказание[b] в бедности?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте не сказано, кого или что Бог укрепляет.
    reason: cultural_note
  - marker: b
    text: 'Или: «наставление», «воспитание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνισχύσῃς
  choice: укрепишь
  rationale: Глагол означает наделить силой или поддержать. Переходный глагол без выраженного дополнения сохраняет незавершённость греческой конструкции; это отмечено в сноске.
- source_word: ὑφέξεται
  choice: перенесёт
  rationale: Будущая форма передаёт стойкое перенесение бремени; «перенесёт» естественно звучит в риторическом вопросе.
- source_word: παιδείαν
  choice: наказание
  rationale: παιδεία охватывает воспитание, наставление и исправляющее наказание. В контексте нужды и необходимости выстоять «наказание» передаёт тяжёлую исправительную сторону понятия, не исключая воспитательного смысла, указанного в сноске.
- source_word: ἐν πενίᾳ
  choice: в бедности
  rationale: Прямо передаёт состояние материальной нужды, обозначенное πενία.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Заглавное «Ты» отражает прямое обращение к Богу. Сохранён риторический вопрос и не восполнено отсутствующее в греческом дополнение при «укрепишь».
