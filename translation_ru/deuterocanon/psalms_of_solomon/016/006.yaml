lexical_decisions:
- source_word: ἀποστήσῃς
  choice: не удаляй
  rationale: Глагол означает заставить что-либо отступить или удалиться. «Не удаляй» позволяет сохранить один общий глагол при двух дополнениях, как в греческом тексте.
- source_word: ἔλεός
  choice: милости
  rationale: Ἔλεος обозначает милость или сострадание. «Милость» — прямой, естественный и уместный для молитвы русский эквивалент.
- source_word: μνήμην περὶ σοῦ
  choice: памяти о Тебе
  rationale: Оборот буквально обозначает память или памятование, направленное на Бога; «память о Тебе» естественно передаёт его по-русски без лишнего истолкования.
- source_word: καρδίας
  choice: сердца
  rationale: В библейской речи «сердце» обозначает внутреннюю жизнь человека, включая память, мысль и преданность; метафору следует сохранить.
- source_word: ἕως θανάτου
  choice: до самой смерти
  rationale: Фраза имеет ясное временное значение. Частица «самой» придаёт русской формулировке естественность и подчёркивает предельный момент, не меняя смысла.
theological_decisions:
- issue: Смысл ἔλεος
  choice: милость
  alternative: сострадание; неизменная любовь
  rationale: Контекст не требует сужать ἔλεος до чувства сострадания или расширять его до богословски насыщенного понятия верной заветной любви. «Милость» сохраняет достаточную смысловую широту.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-поэтической речи. Инверсия «Твоей милости» и обращение «Боже» сохраняют возвышенный регистр, оставаясь понятными. Тире помогает показать, что общий глагол «не удаляй» управляет и вторым дополнением, а оборот «из моего сердца» относится к памяти о Боге.
