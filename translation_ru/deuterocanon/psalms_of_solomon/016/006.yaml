  text: Do not withdraw your mercy from me[a], O God[c][b], nor the remembrance of you from my heart until death.
translation:
  language: ru
  text: Не удаляй от меня Твоей милости[a], Боже, и не удаляй из моего сердца памяти о Тебе[b] до смерти.
  philosophy: optimal-equivalence
  footnotes:
