  text: And do not let the beauty of a lawless woman deceive me[a], nor that of anything laid before me by worthless sin.
translation:
  language: ru
  text: И пусть не обманет меня красота беззаконной женщины и красота всего, что предлагается бесполезным грехом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и ничто, предлагаемое бесполезным грехом». Греческая фраза сжата: «всего, что предлагается» может пониматься как зависимое от слова «красота» либо как отдельный предмет обольщения.'
    reason: Отмечает сжатый и синтаксически трудный оборот παντὸς ὑποκειμένου, сохраняя основной перевод, который следует родительному падежу.
lexical_decisions:
- source_word: μὴ ἀπατησάτω με
  choice: пусть не обманет меня
  rationale: Аористный императив с μή передан естественной для русского языка запретительно-пожелательной конструкцией; «обманет» прямо выражает значение ἀπατάω в контексте обольщения.
- source_word: κάλλος γυναικὸς παρανόμου
  choice: красота беззаконной женщины
  rationale: κάλλος означает «красота», а παράνομος характеризует женщину как нарушающую закон; «беззаконная» сохраняет нравственно-религиозный вес слова без лишнего уточнения.
- source_word: καὶ παντὸς ὑποκειμένου
  choice: и всего, что предлагается
  rationale: Родительный παντός синтаксически соотнесён с γυναικός и понимается как также зависящий от κάλλος. Причастие ὑποκειμένου многозначно; «что предлагается» естественно передаёт образ чего-либо поставленного перед человеком как предмет соблазна, не добавляя отсутствующее в греческом «мне».
- source_word: ἀπὸ ἁμαρτίας ἀνωφελοῦς
  choice: бесполезным грехом
  rationale: ἀνώφελος значит «бесполезный, не приносящий пользы»; творительный передаёт ἀπό как источник или действующую причину при пассивном «предлагается».
theological_decisions:
- issue: Синтаксическая связь παντὸς ὑποκειμένου
  choice: 'Понимать как второй родительный, зависящий от κάλλος: «красота… и всего…»'
  alternative: 'Понимать как отдельный субъект подразумеваемого «пусть не обманет»: «и ничто, предлагаемое…»'
  rationale: Форма родительного падежа поддерживает зависимость от κάλλος, хотя сжатый греческий допускает более свободное восстановление эллипсиса; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с молитвенной, но понятной конструкцией «пусть не обманет». Сохранены сжатость оригинала и его необычная синтаксическая связь; архаизмы и конфессионально окрашенные уточнения не вводятся.
