  text: Keep grumbling and faintheartedness in affliction far from me[a], when I sin, as you discipline me for repentance.
translation:
  language: ru
  text: Удали от меня ропот и малодушие в скорби, когда я согрешаю и Ты вразумляешь меня, чтобы я обратился.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В дошедшем до нас греческом тексте буквально: «если Ты согрешишь (или: ошибёшься), вразумляя [меня], чтобы я обратился». Вероятно, текст в этом месте повреждён.'
    reason: 'Сохранить подлинную текстовую трудность: форма ἁμαρτήσῃς стоит во втором лице единственного числа, хотя контекст предполагает согрешение молящегося.'
lexical_decisions:
- source_word: γογγυσμόν
  choice: ропот
  rationale: Слово обозначает недовольное ворчание или жалобу; «ропот» естественно звучит в молитвенном контексте и передаёт оттенок внутреннего недовольства.
- source_word: ὀλιγοψυχίαν
  choice: малодушие
  rationale: Буквально слово указывает на «малость духа», то есть упадок мужества; «малодушие» сохраняет нравственно-психологический смысл и достоинство стиля.
- source_word: ἐν θλίψει
  choice: в скорби
  rationale: θλῖψις означает скорбь, бедствие или тяжёлое стеснение; «в скорби» близко к греческому и уместно в молитвенной речи.
- source_word: μάκρυνον ἀπʼ ἐμοῦ
  choice: удали от меня
  rationale: Императив буквально требует отдалить названные состояния от молящегося; по-русски это ясно и естественно передаётся выражением «удали от меня».
- source_word: ἐὰν ἁμαρτήσῃς
  choice: когда я согрешаю
  rationale: Переданный текст содержит форму второго лица («если Ты согрешишь/ошибёшься»), что резко нарушает смысл обращения к Богу и, вероятно, отражает раннюю текстовую порчу. Основной текст передаёт контекстуально ожидаемый смысл «когда я согрешаю», а засвидетельствованное чтение сохранено в примечании.
- source_word: ἐν τῷ σε παιδεύειν
  choice: и Ты вразумляешь меня
  rationale: Оборот с артиклевым инфинитивом имеет временное значение; σε — явно выраженный субъект действия («Ты»), а объект «меня» естественно восстанавливается из контекста молитвы. «Вразумляешь» передаёт исправительную, а не только карательную сторону παιδεύω.
- source_word: εἰς ἐπιστροφήν
  choice: чтобы я обратился
  rationale: ἐπιστροφή — обращение или возвращение; целевая конструкция передаёт направленность вразумления к возвращению человека на верный путь, не сужая смысл исключительно до чувства раскаяния.
theological_decisions:
- issue: Форма второго лица в ἐὰν ἁμαρτήσῃς при обращении к Богу
  choice: В основном тексте передан контекстуально ожидаемый смысл «когда я согрешаю», а буквальное чтение рукописного греческого отмечено в сноске.
  alternative: «Если Ты ошибёшься, вразумляя меня, чтобы я обратился»
  rationale: Буквальное чтение грамматически возможно, но приписывает Богу ошибку или грех и противоречит ходу молитвы. Вместо молчаливого устранения трудности перевод даёт осмысленный основной текст и открыто фиксирует проблему в примечании.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической торжественностью. Местоимение «Ты» написано с прописной буквы как форма прямого обращения к Богу. Синтаксис сделан плавным и понятным, а сложное чтение греческого текста не скрыто, но вынесено в сноску.
