lexical_decisions:
- source_word: δικαιοσύναι
  choice: праведные дела
  rationale: Множественное число здесь естественно указывает на конкретные проявления праведности; буквальное «праведности» в современном русском звучит неестественно.
- source_word: ὁσίων σου
  choice: верных Тебе
  rationale: ὅσιος обозначает благочестивого, преданного Богу человека; такой перевод передаёт религиозную верность без смешения с более узким термином «святые».
- source_word: ἐνώπιόν σου
  choice: пред Тобой
  rationale: Краткое, возвышенное и естественное соответствие выражению «перед Твоим лицом».
- source_word: γνώσεώς σου
  choice: Твоего ведения
  rationale: Сохраняет смысл Божьего знания и оттенок всеохватывающей осведомлённости; «ведение» уместно в современном литературном библейском регистре.
theological_decisions:
- issue: Характер δικαιοσύναι
  choice: праведные дела
  alternative: праведность / праведности
  rationale: Множественное число сохранено семантически как совокупность поступков, без утверждения особой доктрины о заслугах.
- issue: Обозначение τῶν ὁσίων σου
  choice: верных Тебе
  alternative: Твоих благочестивых / Твоих святых
  rationale: Передаёт принадлежность и преданность Богу, не отождествляя термин автоматически с канонизированными святыми.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным, риторический вопрос сохранён; обращения «Господи» и «Боже» переданы непосредственно.
