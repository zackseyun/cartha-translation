review_pass:
  verdict: revise
  source_fidelity: 'Греческий текст передан в целом точно: δικαιοσύναι уместно передано как конкретные «праведные дела», а риторический вопрос сохранён. Однако начальное καί во второй части означает «и», не «же»; его следует передать. Формула «верных Тебе» несколько уточняет исходное τῶν ὁσίων σου («Твоих благочестивых/святых»), превращая притяжательное σου в характеристику верности.'
  naturalness: Текст звучит литературно и понятно. «Твоего ведения» допустимо в возвышенном стиле, но «Твоего знания» естественнее для современного литературного русского и непосредственно передаёт γνώσεώς σου.
  terminology: '«Праведные дела» хорошо отражает множественное число δικαιοσύναι без искусственного «праведности». Для ὅσιοι предпочтительно «благочестивые»: это сохраняет религиозно-нравственный смысл термина, не добавляя конкретизированного «верные Тебе» и не навязывая позднейшего титула «святые». Обращения «Господи» и «Боже» переданы верно.'
  issues:
