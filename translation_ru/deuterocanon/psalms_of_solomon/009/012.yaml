  yaml_path: translation/deuterocanon/psalms_of_solomon/009/012.yaml
  text: He will cleanse a soul in sins by confession, by open acknowledgment.
translation:
  language: ru
  text: Он очистит душу в грехах[a] — через исповедание, через открытые признания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в грехах». Греческое выражение может описывать состояние или сферу, в которой находится душа; источник не говорит прямо «от грехов».'
    reason: Формулировка необычна по-русски, но важна для сохранения предлога и неоднозначности греческого текста.
lexical_decisions:
- source_word: καθαρίσει
  choice: очистит
  rationale: Будущее время глагола καθαρίζω передано прямо и без добавления подразумеваемого субъекта.
- source_word: ψυχὴν
  choice: душу
  rationale: Обычное соответствие для ψυχή в данном нравственно-религиозном контексте.
- source_word: ἐν ἁμαρτίαις
  choice: в грехах
  rationale: Сохранён греческий предлог ἐν и множественное число; не внесено более определённое «от грехов», которого в источнике нет.
- source_word: ἐν ἐξομολογήσει
  choice: через исповедание
  rationale: ἐξομολόγησις здесь обозначает исповедание или признание; инструментальное значение ἐν естественно передаётся русским «через».
- source_word: ἐν ἐξαγορίαις
  choice: через открытые признания
  rationale: Редкое ἐξαγορία связано с открытым высказыванием или оглашением; множественное число источника сохранено.
theological_decisions:
- issue: Отношение очищения к грехам
  choice: «душу в грехах»
  alternative: «душу от грехов»
  rationale: В греческом стоит ἐν ἁμαρτίαις, а не обычное прямое выражение удаления «от грехов». Более гладкий вариант мог бы преждевременно снять смысловую и синтаксическую напряжённость текста.
- issue: Средство очищения
  choice: «через исповедание, через открытые признания»
  alternative: «в исповедании, в открытых признаниях»
  rationale: Повтор ἐν после сказуемого естественно допускает инструментальное понимание; русский вариант ясно передаёт это, не уточняя механизм очищения и не вводя конфессиональной доктрины.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Тире разграничивает объект очищения и средства очищения; повтор «через» сохраняет параллелизм двух греческих оборотов.
