  source_fidelity: 'Греч. τὰ ἔργα ἡμῶν ἐν ἐκλογῇ καὶ ἐξουσίᾳ τῆς ψυχῆς ἡμῶν передано по смыслу точно: поступки отнесены к нравственному выбору и власти/способности души. Инфинитив τοῦ ποιῆσαι сохранён как «творить», а противопоставление δικαιοσύνην / ἀδικίαν удачно передано симметричной парой «праведность и неправедность». «Делами наших рук» сохраняет конкретный инструментальный образ ἔργοις χειρῶν ἡμῶν.'
