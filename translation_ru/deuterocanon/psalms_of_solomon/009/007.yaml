  yaml_path: translation/deuterocanon/psalms_of_solomon/009/007.yaml
  text: Our deeds are within the choice and power of our soul[d][c][b][a], to do righteousness and unrighteousness with the works of our hands.
translation:
  language: ru
  text: 'Наши поступки зависят от выбора нашей души и находятся в её власти[a]: творить праведность[b] и неправедность делами наших рук.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в выборе и власти нашей души». «Власть» может также означать способность или возможность действовать.'
    reason: Сохраняет необычную форму исходной конструкции и смысловой диапазон ἐξουσία.
  - marker: b
    text: 'Или: «справедливость».'
    reason: Отмечает допустимое значение δικαιοσύνη, не сужая основной текст до него.
lexical_decisions:
- source_word: τὰ ἔργα ἡμῶν
  choice: наши поступки
  rationale: «Поступки» естественно обозначает нравственно значимые действия и в данном контексте точнее русского «дела», которое непосредственно повторяется далее в инструментальном обороте.
- source_word: ἐκλογῇ
  choice: от выбора
  rationale: Здесь слово обозначает нравственный выбор, а не богословское «избрание».
- source_word: ἐξουσίᾳ
  choice: находятся в её власти
  rationale: Сохраняется значение власти или реальной возможности распоряжаться действием; русская конструкция передаёт нравственную дееспособность без институционального оттенка.
- source_word: τῆς ψυχῆς ἡμῶν
  choice: нашей души
  rationale: Сохранён явный образ души как внутреннего субъекта нравственного выбора; замена на «нас самих» была бы естественнее, но менее прозрачна источнику.
- source_word: τοῦ ποιῆσαι
  choice: творить
  rationale: Инфинитив сохраняет некоторую открытость между пояснительным и целевым оттенками греческой конструкции; «творить» уместно сочетается с абстрактными «праведность» и «неправедность».
- source_word: δικαιοσύνην
  choice: праведность
  rationale: Сохраняет широкий нравственный и богословский смысл слова и образует точную смысловую пару с «неправедностью».
- source_word: ἀδικίαν
  choice: неправедность
  rationale: Передаёт формальное противопоставление δικαιοσύνη / ἀδικία и не сужает значение до общественной несправедливости.
- source_word: ἔργοις χειρῶν ἡμῶν
  choice: делами наших рук
  rationale: Сохранён конкретный образ рук как орудия, которым внутренний выбор воплощается в поступках.
theological_decisions:
- issue: Сильное утверждение о нравственной способности и ответственности человека
  choice: «зависят от выбора нашей души и находятся в её власти»
  alternative: «наши поступки — в выборе и власти нашей души»
  rationale: Перевод прямо сохраняет утверждение текста о человеческом выборе и способности совершать как праведное, так и неправедное, не ослабляя и не превращая его в систематическое учение о свободе воли.
- issue: Пара δικαιοσύνη / ἀδικία
  choice: «праведность и неправедность»
  alternative: «справедливость и несправедливость»
  rationale: Симметричная пара сохраняет широкий нравственный контраст оригинала и не вводит более узкий современный социально-правовой оттенок.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис слегка перестроен ради ясности: единая греческая конструкция с ἐν передана параллельными русскими сказуемыми «зависят» и «находятся», а буквальная форма приведена в сноске. Лексическая симметрия «праведность — неправедность» намеренно сохранена.'
