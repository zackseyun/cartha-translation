lexical_decisions:
- source_word: κυρίου
  choice: Господа
  rationale: Родительный падеж естественно передаёт греческую генитивную связь и сохраняет обычное библейское соответствие для κύριος.
- source_word: ἐλεημοσύνη
  choice: милость
  rationale: В данном контексте слово обозначает милосердное отношение и действие Господа к Израилю; «милость» кратко, естественно и сохраняет богословскую насыщенность выражения.
- source_word: ἡ ἐπʼ οἶκον Ἰσραήλ
  choice: над домом Израиля
  rationale: Предлог ἐπί с винительным падежом указывает на направленность милости к Израилю; «над» сохраняет пространственный образ, а «дом Израиля» — коллективное наименование народа.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: во веки и впредь
  rationale: Выражение усиливает идею неограниченной длительности. «Во веки и впредь» передаёт как εἰς τὸν αἰῶνα, так и добавочное καὶ ἔτι, не сводя их к одному наречию.
