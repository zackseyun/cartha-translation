lexical_decisions:
- source_word: ἵνα
  choice: Чтобы
  rationale: Передаёт целевое или результативное значение ἵνα и сохраняет связь с предшествующим контекстом.
- source_word: δικαιωθῇς
  choice: Ты был признан правым
  rationale: При Боге как субъекте пассивная форма означает не обретение праведности, а признание или явное подтверждение Его правоты. Русское выражение понятно и сохраняет пассивный оттенок.
- source_word: ὁ θεός
  choice: Боже
  rationale: Форма именительного падежа выполняет функцию прямого обращения; русский звательный эквивалент «Боже» естественен для молитвенной поэзии.
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: в Своей праведности
  rationale: Сохраняет ключевое значение δικαιοσύνη и близкую к греческой конструкцию, не исключая оттенка справедливости.
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: среди наших беззаконий
  rationale: «Среди» непосредственно передаёт пространственно-сферический образ ἐν, а «беззакония» сохраняет связь ἀνομία с нарушением закона и не ослабляет слово до общего «грехи».
theological_decisions:
- issue: Значение δικαιωθῇς при обращении к Богу
  choice: «был признан правым» в основном тексте
  alternative: «был оправдан»
  rationale: Основной вариант показывает, что речь идёт о подтверждении Божьей правоты, а не об изменении Его нравственного состояния; примечание сохраняет более формальное и богословски напряжённое соответствие.
- issue: Передача δικαιοσύνη
  choice: «праведность»
  alternative: «справедливость»
  rationale: «Праведность» сохраняет широкий богословский диапазон греческого слова, тогда как возможный судебный оттенок «справедливости» отмечен отдельно.
- issue: Отношение второго ἐν к остальной фразе
  choice: «среди наших беззаконий»
  alternative: «в отношении наших беззаконий»
  rationale: Основной текст сохраняет образ сферы или обстоятельств, не превращая предлог в однозначно причинную связь; альтернативное понимание как отношения к беззакониям дано в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным молитвенным строем. Обращение «Боже» сохраняет псалмический регистр; прописные формы местоимений поддерживают уважительный характер прямого обращения.
