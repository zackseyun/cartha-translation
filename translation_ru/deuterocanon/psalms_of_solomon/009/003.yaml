  source_fidelity: 'Текст точно передаёт синтаксическое движение греческого: ἵνα отражено союзом «Чтобы», δικαιωθῇς — пассивной конструкцией «Ты был признан правым», обращение ὁ θεός — «Боже», а оба предложных оборота с ἐν сохранены без неоправданного превращения второго в причинный. «Среди наших беззаконий» является допустимой прямой передачей сферного/обстоятельственного значения ἐν и не снимает имеющейся синтаксической неоднозначности.'
