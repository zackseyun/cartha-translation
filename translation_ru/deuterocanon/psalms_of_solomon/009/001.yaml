  yaml_path: translation/deuterocanon/psalms_of_solomon/009/001.yaml
  text: When Israel was carried away into exile to a foreign land[a], when they departed from the Lord who had redeemed them,
translation:
  language: ru
  text: Когда Израиль был уведён в изгнание на чужую землю, когда они отступили от Господа[a], искупившего их,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отошли от Господа»; возможно также: «отпали от Господа».'
    reason: 'Лексическая неоднозначность ἀποστῆναι: глагол может обозначать удаление, отступление или отпадение.'
lexical_decisions:
- source_word: ἀπαχθῆναι
  choice: был уведён
  rationale: Пассивный инфинитив указывает на то, что Израиль насильственно увели, а не что он отправился добровольно; «был уведён» естественно передаёт депортацию.
- source_word: ἀποικεσίᾳ
  choice: в плен
  rationale: В данном контексте слово обозначает насильственное переселение и пребывание вдали от своей земли. «В плен» ясно и естественно передаёт историческую реальность, не сводя выражение лишь к месту проживания.
- source_word: γῆν ἀλλοτρίαν
  choice: на чужую землю
  rationale: Прилагательное подчёркивает, что земля принадлежит другим и не является землёй Израиля; «чужая земля» сохраняет эту смысловую окраску.
- source_word: ἀποστῆναι
  choice: отступили
  rationale: Глагол может обозначать как удаление, так и вероотступничество. «Отступили» сохраняет эту намеренную двусмысленность и направленность действия, заданную ἀπό.
- source_word: Κυρίου
  choice: Господа
  rationale: Традиционное и естественное русское соответствие κύριος в контексте отношений Бога с Израилем.
- source_word: τοῦ λυτρωσαμένου
  choice: искупившего
  rationale: Причастие обозначает Господа как избавителя-искупителя Израиля; «искупившего» сохраняет как смысл освобождения, так и богословский оттенок искупления.
theological_decisions:
- issue: Характер отступления Израиля от Господа
  choice: отступили
  alternative: отошли / отпали
  rationale: Текст допускает понимание как удаления от Господа, так и религиозного отпадения. Основной вариант не уточняет степень или формальный характер отступничества сверх того, что выражено греческим глаголом.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвенной речи. Синтаксический параллелизм двух конструкций ἐν τῷ сохранён повтором «когда». Местоимение во второй части передано множественным числом вслед за греческим αὐτούς, несмотря на собирательное единственное «Израиль».
