lexical_decisions:
- source_word: ἡρέτισω
  choice: избрал
  rationale: Глагол означает сознательно выбрать или предпочесть; «избрал» ясно передаёт смысл и сохраняет возвышенный, но современный библейский регистр.
- source_word: σπέρμα
  choice: потомство
  rationale: «Потомство» естественно передаёт собирательное единственное число греческого слова. Более буквальное «семя» возможно, но в современном русском менее прозрачно; «потомки» утратило бы форму собирательного единственного числа.
- source_word: παρὰ
  choice: превыше
  rationale: 'С винительным падежом здесь выражено сопоставление или предпочтение: потомство Авраама избрано выше остальных народов. «Превыше» сохраняет сравнительную силу фразы, тогда как возможное «из среды» представляет иной оттенок её понимания.'
- source_word: ἔθνη
  choice: народы
  rationale: «Народы» — прямой и наименее истолковывающий эквивалент. Перевод «язычники» внёс бы более специальное религиозное противопоставление, которого само слово здесь не требует.
theological_decisions:
- issue: Избрание потомства Авраама по отношению ко всем народам
  choice: 'Передать прямо: Бог избрал потомство Авраама «превыше всех народов».'
  alternative: Бог избрал потомство Авраама из среды всех народов; Бог предпочёл потомство Авраама всем народам.
  rationale: Греческий текст утверждает особый Божий выбор и выражает сравнительное предпочтение. Перевод сохраняет эту богословскую напряжённость, не сводя избрание к простому отделению и не развивая его в более позднюю доктринальную систему.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавное «Ты» употреблено как традиционная форма обращения к Богу. «Превыше» несколько торжественно, но понятно и позволяет кратко сохранить сравнительную конструкцию греческого текста.
