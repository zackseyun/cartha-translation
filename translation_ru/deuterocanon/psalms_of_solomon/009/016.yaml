  yaml_path: translation/deuterocanon/psalms_of_solomon/009/016.yaml
  text: And now you are God, and we are your people whom you loved. Look and have compassion, O God of Israel, because we are yours; and do not withdraw your mercy from us, lest they attack us.
translation:
  language: ru
  text: И ныне Ты — Бог, а мы — Твой народ, который Ты возлюбил. Взгляни и сжалься, Боже Израиля, ведь мы принадлежим Тебе. Не отнимай от нас Своей милости, чтобы они не напали на нас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: И ныне
  rationale: Сохраняет переход и молитвенную торжественность греческого выражения, оставаясь понятным современному читателю.
- source_word: λαὸς σοῦ ὃν ἠγάπησας
  choice: Твой народ, который Ты возлюбил
  rationale: Прямо передаёт определительное придаточное и прошедшее действие ἠγάπησας без добавления богословских уточнений.
- source_word: ἴδε καὶ οἰκτείρησον
  choice: Взгляни и сжалься
  rationale: Передаёт два императива; «сжалься» естественно выражает призыв к состраданию в молитвенном контексте.
- source_word: ὅτι σοί ἐσμεν
  choice: ведь мы принадлежим Тебе
  rationale: Идиоматично передаёт дательный принадлежности σοί и смысл «мы — Твои», не смешивая его с предшествующим «Твой народ».
- source_word: μὴ ἀποστῇς ἔλεός σου ἀφʼ ἡμῶν
  choice: Не отнимай от нас Своей милости
  rationale: Естественно по-русски передаёт просьбу не удалить или не отвести милость; субъектом действия в греческом остаётся Бог.
- source_word: ἵνα μὴ ἐπιθῶνται ἡμῖν
  choice: чтобы они не напали на нас
  rationale: Передаёт отрицательную целевую либо предупредительную конструкцию; неопределённое «они» сохранено, поскольку противники в самом стихе не названы.
theological_decisions:
- issue: Формула σύ ὁ θεός
  choice: Ты — Бог
  alternative: Ты Бог наш
  rationale: В греческом нет притяжательного местоимения «наш»; перевод не добавляет его и сохраняет лаконичное исповедание.
- issue: Связь Божьей милости и нападения врагов
  choice: «чтобы они не напали на нас» без пояснения причинности
  alternative: «иначе они нападут на нас»
  rationale: ἵνα μή допускает целевой или результативно-предупредительный оттенок. Формулировка с «чтобы не» сохраняет синтаксическую открытость оригинала и не утверждает жёсткую причинную схему.
translation_notes:
  register: Современный литературный русский с умеренно торжественным молитвенным регистром. Местоимения, обращённые к Богу, написаны с прописной буквы по принятой русской религиозной издательской традиции. Пунктуация разделяет исповедание, просьбу о сострадании и просьбу о сохранении милости, не меняя последовательности мысли.
