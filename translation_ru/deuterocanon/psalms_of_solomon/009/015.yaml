  rationale: Перевод уточнён только там, где русская конструкция могла исказить синтаксическую связь греческого ἐν μεταμελείᾳ. Новая формулировка сохраняет настоящее значение ἁμαρτάνοντας и не вводит невыраженную в оригинале последовательность между грехом и раскаянием. Прямой порядок слов повышает естественность современного русского текста.
