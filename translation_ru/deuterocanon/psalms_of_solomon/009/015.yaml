  yaml_path: translation/deuterocanon/psalms_of_solomon/009/015.yaml
  text: You will bless the righteous[a], and you do not call them to account for the things in which they sinned[c][b]; and your goodness is toward those who sin in repentance.
translation:
  language: ru
  text: Ты благословишь праведных и не призываешь их к ответу за то, в чём они согрешили; и Твоя благость — к тем, кто грешит и испытывает раскаяние[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в сожалении»; слово может обозначать также угрызения совести или сожаление о содеянном.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίους
  choice: праведных
  rationale: Субстантивированное прилагательное обозначает людей, отличающихся праведностью; русский эквивалент сохраняет нравственно-религиозный смысл и естественно сочетается с глаголом «благословишь».
- source_word: εὐλογήσεις
  choice: благословишь
  rationale: Форма будущего времени передана прямо; «благословишь» соответствует религиозному контексту и сохраняет отличие от следующего глагола настоящего времени.
- source_word: οὐκ εὐθύνεις
  choice: не призываешь их к ответу
  rationale: Настоящее время εὐθύνεις сохранено, а выражение передаёт судебно-нравственный оттенок требования ответа за проступок, не сводя значение к наказанию.
- source_word: περὶ ὧν ἥμαρτοσαν
  choice: за то, в чём они согрешили
  rationale: Передаёт отнесённость взыскания к совершённым грехам и сохраняет структуру относительного оборота без неестественной буквальности.
- source_word: χρηστότης
  choice: благость
  rationale: «Благость» передаёт и нравственную доброту, и милостивое отношение Бога; слово уместно в возвышенной, но понятной религиозной речи.
- source_word: ἁμαρτάνοντας
  choice: к тем, кто грешит
  rationale: Причастие передано глагольным оборотом, чтобы не превращать характеристику в статичный ярлык «грешники».
- source_word: ἐν μεταμελείᾳ
  choice: в раскаянии
  rationale: Основной перевод передаёт состояние раскаяния, при этом возможные оттенки сожаления и угрызений совести отмечены в сноске.
theological_decisions:
- issue: Связь Божьей благости с грешащими и раскаянием
  choice: Сохранить тесную связь оборота «в раскаянии» с выражением «к тем, кто грешит»
  alternative: 'Передать пояснительно: «к тем, кто, согрешив, раскаивается»'
  rationale: Греческий предложный оборот следует непосредственно за причастием и характеризует названных людей, однако более пояснительный перевод добавил бы временную последовательность, не выраженную явно.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Заглавные местоимения «Ты», «Твоя» соответствуют молитвенному обращению к Богу. Контраст будущего «благословишь» и настоящего «не призываешь» сохранён.
