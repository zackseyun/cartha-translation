  source_fidelity: «И в праведности Твоей Ты посещаешь сынов человеческих» точно передаёт καὶ ἐν τῇ δικαιοσύνῃ σου ἐπεσκέπτῃ υἱοὺς ἀνθρώπων. «Посещаешь» сохраняет широкую семантику ἐπεσκέπτῃ и не сводит её преждевременно к судебному исследованию или попечению.
  naturalness: Фраза грамматична и звучит достойно в современном литературном русском с умеренно библейским регистром. Формула «сынов человеческих» намеренно традиционна, но понятна; поясняющая сноска предотвращает неверное узкое понимание.
  terminology: «Праведность» — уместная и точная передача δικαιοσύνη. «Сыны человеческие» корректно сохраняет образ и родовую форму υἱοὺς ἀνθρώπων, а сноска верно поясняет обобщённую референцию. Сноска к «посещаешь» добросовестно отмечает релевантные смысловые возможности, не выдавая спорный судебный оттенок за единственно возможный.
