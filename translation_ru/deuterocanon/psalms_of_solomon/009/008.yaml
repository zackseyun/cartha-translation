  text: and in your righteousness you visit the sons of men[b][a];
translation:
  language: ru
  text: и в праведности Твоей Ты посещаешь[a] сынов человеческих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытываешь»; греческий глагол может также означать внимательное наблюдение, проверку или попечение.'
    reason: lexical_alternative
  - marker: b
    text: То есть людей, человеческий род.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: в праведности Твоей
  rationale: Сохраняется предложная конструкция греческого текста и богословски ёмкое «праведность», которое здесь может обозначать как Божье свойство, так и образ Его действия.
- source_word: ἐπεσκέπτῃ
  choice: посещаешь
  rationale: «Посещаешь» прямо передаёт широкий смысл ἐπισκέπτομαι и не снимает контекстуальной неоднозначности между приходом, внимательным наблюдением и проверкой. Судебный оттенок возможен в контексте, но не вводится в основной текст как единственный смысл.
- source_word: υἱοὺς ἀνθρώπων
  choice: сынов человеческих
  rationale: Традиционная семитизированная формула сохранена в естественном для библейского русского языка виде; при этом она обозначает людей вообще, что пояснено в сноске.
theological_decisions:
- issue: Характер Божьего «посещения» людей
  choice: Сохранить нейтрально-ёмкое «посещаешь».
  alternative: «испытываешь», «проверяешь» или «наблюдаешь за»
  rationale: Ближайший контекст допускает судебное исследование, однако сам глагол шире и может выражать посещение, внимание или попечение. Основной перевод не должен преждевременно устранять эту напряжённость.
- issue: Родовая формула υἱοὺς ἀνθρώπων
  choice: Сохранить образ «сынов человеческих».
  alternative: «людей» или «человеческий род»
  rationale: Мужская образность исходной устойчивой формулы сохраняется, а её обобщённое значение поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Заглавные местоимения при обращении к Богу соответствуют русской религиозно-литературной традиции. Формула «сыны человеческие» слегка возвышенна, но понятна и точно сохраняет образ исходного текста.
