  text: To whom will you show kindness[a], O God[b], if not to those who call on the Lord?
translation:
  language: ru
  text: К кому Ты будешь добр[a], Боже, если не к тем, кто призывает Господа?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к кому Ты проявишь доброту».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνι
  choice: к кому
  rationale: Дательный падеж вопросительного местоимения вводит риторический вопрос о том, на кого направлена Божья доброта; «к кому» естественно сочетается с выражением «быть добрым».
- source_word: χρηστεύσῃ
  choice: будешь добр
  rationale: Форма является 2-м лицом единственного числа будущего времени и обозначает доброе, благожелательное отношение или действие. Перевод сохраняет прямое обращение к Богу и не сужает смысл до особого богословского понятия милости.
- source_word: ὁ θεός
  choice: Боже
  rationale: Именительный падеж с артиклем здесь употреблён как обращение, что согласуется со 2-м лицом глагола; русский звательный оборот «Боже» передаёт это естественно и точно.
- source_word: ἐπικαλουμένοις
  choice: тем, кто призывает
  rationale: Причастие обозначает людей, обращающихся к Господу с призывом или молитвой; «призывает» сохраняет религиозный смысл и остаётся понятным современному читателю.
- source_word: κύριον
  choice: Господа
  rationale: В религиозном контексте κύριος передано традиционным и семантически уместным словом «Господь».
