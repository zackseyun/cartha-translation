  source_fidelity: Текст точно передаёт греческий риторический вопрос. τίνι передано как «К кому», χρηστεύσῃ — как второличное будущее «Ты будешь добр», а ὁ θεός корректно распознано как обращение «Боже». Условно-исключительный оборот «если не к тем» соответствует εἰ μὴ τοῖς. «Тем, кто призывает Господа» адекватно передаёт ἐπικαλουμένοις τὸν κύριον.
  naturalness: Фраза естественна для современного литературного русского и сохраняет возвышенный молитвенный регистр. «Будешь добр» в сочетании с «к кому» грамматически и стилистически нормально; риторический вопрос звучит ясно.
  terminology: «Боже» уместно передаёт вокативное употребление ὁ θεός, а «Господа» последовательно передаёт κύριον в контексте призывания. Терминология не вносит конфессионального уточнения.
