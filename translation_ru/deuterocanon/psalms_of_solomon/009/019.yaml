  terminology: «Завет» и «уповать» — удачные и устойчивые соответствия для данного библейского контекста. «Отцы» сохраняет исходное обозначение предков; «обратится» удерживает религиозно значимый образ поворота/возвращения. Примечание корректно отмечает буквальный диапазон «обращение/возвращение» и возможный покаянный смысл, не навязывая его основному тексту.
