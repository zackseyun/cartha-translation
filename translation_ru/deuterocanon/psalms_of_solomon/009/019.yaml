  source_fidelity: Русский текст точно передаёт основное содержание греческого оригинала. «Ты заключил с нашими отцами завет» естественно выражает заветную формулу ἐν διαθήκῃ διέθου; «о нас» сохраняет нейтральное περὶ ἡμῶν; будущее «будем уповать» соответствует ἐλπιοῦμεν. Временное «когда наша душа обратится» является допустимым естественным развёртыванием ἐν ἐπιστροφῇ ψυχῆς ἡμῶν и не сводит его однозначно к покаянию.
