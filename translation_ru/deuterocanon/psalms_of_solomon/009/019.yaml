base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/019.yaml
  text: In a covenant you appointed to our fathers concerning us[b][a], and we will hope in you in the turning back of our soul.
translation:
  language: ru
  text: Ты заключил с нашими отцами завет о нас, и мы будем уповать на Тебя, когда наша душа обратится[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при обращении (или возвращении) нашей души»; возможно также: «когда мы покаемся».'
    reason: 'Сохраняется диапазон значений ἐπιστροφή: возвращение, обращение и, в религиозном контексте, покаяние.'
lexical_decisions:
- source_word: ἐν διαθήκῃ διέθου
  choice: Ты заключил… завет
  rationale: Греческое сочетание передаёт библейскую формулу установления завета. По-русски «заключил завет» естественно выражает единое словесно-именное действие, не превращая ἐν διαθήκῃ в неясный предложный оборот.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: с нашими отцами
  rationale: Сохранено прямое значение «отцы»; в данном контексте имеются в виду отцы-предки, с которыми был заключён завет.
- source_word: περὶ ἡμῶν
  choice: о нас
  rationale: Передаёт основное значение περί с родительным падежом — «о, относительно», не подменяя его более истолковывающим «ради нас».
- source_word: ἐλπιοῦμεν ἐπὶ σὲ
  choice: мы будем уповать на Тебя
  rationale: Будущее время формы ἐλπιοῦμεν сохранено; «уповать на» естественно и достойно передаёт направленную на Бога надежду.
- source_word: ἐν ἐπιστροφῇ ψυχῆς ἡμῶν
  choice: когда наша душа обратится
  rationale: Сохранены образ возвращения/обращения и коллективное единственное число ψυχῆς; временное придаточное естественно передаёт обстоятельственное ἐν, не сводя выражение однозначно к покаянию.
theological_decisions:
- issue: Следует ли прямо передавать ἐπιστροφή как покаяние
  choice: когда наша душа обратится
  alternative: когда мы покаемся
  rationale: Контекст допускает покаянный смысл, но греческое слово буквально обозначает обращение или возвращение. Основной текст сохраняет образ и богословскую многозначность, а явное толкование вынесено в примечание.
- issue: Характер завета περὶ ἡμῶν
  choice: завет о нас
  alternative: завет ради нас
  rationale: «О нас» сохраняет более широкое значение греческого оборота и не утверждает сверх текста, что завет был заключён исключительно ради говорящих.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Уповать» уместно для молитвенной речи и остаётся понятным; синтаксис сделан естественным для русского языка без устранения образа обращения души.
