lexical_decisions:
- source_word: ἀφήσει
  choice: простит
  rationale: Будущее время глагола ἀφίημι в сочетании с «грехами» естественно означает «простит»; это ясный и современный русский эквивалент.
- source_word: ἁμαρτίας
  choice: грехи
  rationale: Форма множественного числа прямо обозначает грехи; буквальный эквивалент естественен по-русски.
- source_word: τοῖς ἡμαρτηκόσι
  choice: тем, кто согрешил
  rationale: Перфектное действительное причастие обозначает людей, совершивших грех; придаточная конструкция сохраняет глагольный смысл и не превращает выражение в устойчивый ярлык «грешники».
- source_word: τίνι
  choice: кому
  rationale: Дательный падеж вопросительного местоимения естественно передаётся русским «кому» при глаголе «простит».
theological_decisions:
- issue: Круг тех, кому даруется прощение
  choice: Риторический вопрос утверждает, что прощение обращено к тем, кто действительно согрешил.
  alternative: Прощение относится только к тем, кто уже осознал свой грех.
  rationale: В самой строке нет уточнения об осознании или покаянии; такое ограничение не следует вносить в перевод. Риторическую силу вопроса следует сохранить.
translation_notes:
  register: Современный литературный русский язык; краткая и естественная формулировка сохраняет риторический вопрос оригинала. Местоимение «Он» написано с прописной буквы как указание на Бога, подразумеваемого контекстом.
