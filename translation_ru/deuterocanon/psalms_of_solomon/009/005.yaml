  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: γὰρ передано союзом «ведь», универсальное πᾶς ποιῶν — «всякий, кто», ἄδικα — «неправду», а будущее пассивное κρυβήσεται сохранено в образе невозможности укрыться. Оборот «от Твоего знания» близко воспроизводит ἀπὸ τῆς γνώσεώς σου и не подменяет знание Бога более узким «вниманием» или «замечанием».'
  naturalness: «Ведь всякий, кто творит неправду, не укроется от Твоего знания» грамматически корректно и понятно. Формулировка «творит неправду» имеет уместный для библейского текста умеренно возвышенный характер, оставаясь доступной современному читателю. «Твоего знания» несколько формально, но это осознанная и оправданная близость к греческому выражению.
  terminology: «Неправда» удачно сохраняет связь с полем δικαιοσύνη/ἀδικία, существенную для контекста, и предпочтительнее обобщающего «зло». Заглавная буква в «Твоего» последовательно маркирует обращение к Богу. Сноска предлагает допустимую более эксплицитную лексическую альтернативу.
