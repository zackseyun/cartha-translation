lexical_decisions:
- source_word: οὐ … κρυβήσεται
  choice: не укроется
  rationale: 'Передаёт будущую пассивную форму и сохраняет исходный образ: совершающий неправду не сможет остаться сокрытым от Бога.'
- source_word: ἀπὸ τῆς γνώσεώς σου
  choice: от Твоего знания
  rationale: Формально и смыслово соответствует греческому выражению, не сводя широкое понятие Божьего знания лишь к вниманию или замечанию.
- source_word: πᾶς ποιῶν ἄδικα
  choice: всякий, кто творит неправду
  rationale: Сохраняет универсальность πᾶς, причастную конструкцию ποιῶν и нравственно-судебный оттенок ἄδικα. «Творит неправду» звучит естественно и достойно в русском библейском регистре.
theological_decisions:
- issue: Связь ἄδικα с тематическим противопоставлением праведности и неправды
  choice: творит неправду
  alternative: делает зло
  rationale: «Неправда» сохраняет связь с лексическим полем праведности и справедливости, тогда как общее «зло» ослабило бы эту связь.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавная буква в местоимении «Твоего» обозначает обращение к Богу. Конструкция сохраняет греческую последовательность мысли и образ сокрытия, не заменяя его толкованием «не ускользнет от внимания».
