lexical_decisions:
- source_word: ὅτι
  choice: ибо
  rationale: Союз вводит основание или пояснение к предшествующей мысли; «ибо» сохраняет эту связь и соответствует возвышенному поэтическому регистру.
- source_word: αἰσχύνη
  choice: стыд
  rationale: Прямой современный эквивалент, сохраняющий нравственный смысл и оттенок публичного бесчестия без неоправданного усиления.
- source_word: ἡμῖν καὶ τοῖς προσώποις ἡμῶν
  choice: на нас и на наших лицах
  rationale: Два параллельных датива оставлены при одном подлежащем, чтобы сохранить устройство греческой фразы и конкретный образ видимого стыда.
- source_word: περὶ ἁπάντων
  choice: из-за всего этого
  rationale: В контексте оборот естественно указывает на причину стыда. Указательное «этого» по-русски связывает обобщение с уже названными обстоятельствами; более буквальное тематическое понимание отмечено в сноске.
