  source_fidelity: Текст точно передаёт обе части греческого стиха. «Были изгнаны» адекватно воспроизводит сильный пассив ἀπερρίφησαν в контексте лишения данного Господом наследия. «Рассеяние Израиля — среди всех народов» сохраняет именную конструкцию ἡ διασπορὰ τοῦ Ἰσραὴλ и распределительный смысл ἐν παντὶ ἔθνει, не превращая утверждение без необходимости в глагольное. «По слову Бога» соответствует κατὰ τὸ ῥῆμα τοῦ θεοῦ и не сужает значение ῥῆμα до указа или пророчества.
