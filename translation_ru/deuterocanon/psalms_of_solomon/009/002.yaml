base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/002.yaml
  text: They were cast out from the inheritance that the Lord gave them; the dispersion of Israel is among every nation[a], according to the word of God.
translation:
  language: ru
  text: Они были изгнаны из наследия, которое дал им Господь; рассеяние Израиля — среди всех народов[a], по слову Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Израиль рассеян среди всех народов».'
    reason: 'Лексико-синтаксическая альтернатива: естественный глагольный перевод именного выражения ἡ διασπορὰ τοῦ Ἰσραήλ.'
lexical_decisions:
- source_word: ἀπερρίφησαν
  choice: были изгнаны
  rationale: Пассивная форма передаёт решительное удаление из данного Богом удела; «изгнаны» естественно звучит в контексте изгнания и сильнее, чем эмоциональное «отвергнуты».
- source_word: κληρονομίας
  choice: наследия
  rationale: «Наследие» сохраняет библейский смысл удела или владения, дарованного Богом, и не сужает значение исключительно до земли.
- source_word: Κύριος
  choice: Господь
  rationale: Обычный библейский эквивалент κύριος; здесь слово обозначает Бога Израиля как дарующего наследие.
- source_word: διασπορὰ
  choice: рассеяние
  rationale: Существительное «рассеяние» воспроизводит именную форму греческого текста и указывает как на состояние, так и на совокупность рассеянного Израиля.
- source_word: ῥῆμα
  choice: слово
  rationale: «Слово» непосредственно передаёт широкое значение ῥῆμα и сохраняет возможность понимать его как изречение, провозглашение или постановление Бога.
- source_word: ἐν παντὶ ἔθνει
  choice: среди всех народов
  rationale: 'Русское множественное число естественно передаёт распределительный смысл греческого единственного числа с πᾶς: «в каждом народе / среди всех народов».'
theological_decisions:
- issue: Следует ли преобразовать именное выражение ἡ διασπορὰ τοῦ Ἰσραὴλ в глагольное «Израиль рассеян»
  choice: 'Сохранено именное выражение: «рассеяние Израиля»'
  alternative: «Израиль рассеян среди всех народов»
  rationale: Именная конструкция ближе к греческому тексту и сохраняет присущую ему смысловую открытость, хотя по-русски глагольный вариант звучит несколько плавнее.
- issue: Точное отношение κατὰ τὸ ῥῆμα τοῦ θεοῦ к рассеянию
  choice: «по слову Бога»
  alternative: «по постановлению Бога» или «согласно слову Бога»
  rationale: Выбранная формулировка не уточняет без необходимости, идёт ли речь о пророческом изречении, повелении или судебном постановлении Бога.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис сохраняет параллельность и именную конструкцию оригинала, но «ἐν παντὶ ἔθνει» передано естественным русским оборотом «среди всех народов».
