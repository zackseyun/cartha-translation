  text: ἀπερρίφησαν ἀπὸ κληρονομίας ἧς ἔδωκεν αὐτοῖς Κύριος· ἐν παντὶ ἔθνει ἡ διασπορὰ τοῦ Ἰσραὴλ κατὰ τὸ ῥῆμα τοῦ θεοῦ.
