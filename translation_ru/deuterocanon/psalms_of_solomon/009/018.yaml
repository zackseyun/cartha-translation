lexical_decisions:
- source_word: ἔθου
  choice: возложил
  rationale: Аорист τίθημι передаёт совершённое действие «поместил, возложил»; этот выбор сохраняет образ имени, положенного «на» народ, и естественно сочетается с ἐφ’ ἡμᾶς.
- source_word: τὸ ὄνομά σου ἐφʼ ἡμᾶς
  choice: на нас Своё имя
  rationale: Сохранены и прямой объект «Своё имя», и пространственно-реляционный образ предлога ἐπί — имя Господа пребывает на Его народе.
- source_word: οὐ καταπαύσεις τὸν αἰῶνα
  choice: вовек не снимешь его
  rationale: Активное καταπαύσεις означает, что Господь не прекратит и не устранит ранее совершённое действие; «не снимешь» естественно продолжает образ имени, возложенного на народ. τὸν αἰῶνα передано традиционным и понятным «вовек».
theological_decisions:
- issue: Не выраженный в греческом тексте объект при καταπαύσεις
  choice: Местоимение «его» отнесено к ближайшему существительному «имя»
  alternative: «и это не прекратишь вовек» / «и не прекратишь вовек»
  rationale: По-русски переходный глагол требует ясного дополнения; ближайший и наиболее естественный референт — Божье имя. Сноска сохраняет сведения о грамматической невыраженности объекта и не выдаёт это толкование за однозначную форму оригинала.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Вовек» уместно в поэтическом контексте и понятно современному читателю; прописные формы «Ты», «Своё» употреблены как почтительное обращение к Богу.
