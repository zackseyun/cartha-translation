  text: For the judgments of the Lord are in righteousness toward each man and household[a][b][c].
translation:
  language: ru
  text: Ибо суды Господа совершаются в праведности над каждым человеком и каждым домом[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «по человеку и дому»; вероятнее всего, выражение имеет распределительный смысл — применительно к каждому человеку и каждому дому.'
    reason: lexical_alternative
  - marker: b
    text: «В праведности» можно также передать как «справедливо», поскольку речь идёт о судах Господа.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «суды Господа праведны».'
    reason: previous_rendering
lexical_decisions:
- source_word: κρίματα
  choice: суды
  rationale: Передаёт судебные решения и действия суда, сохраняя юридическую и нравственную силу греческого слова.
- source_word: Κυρίου
  choice: Господа
  rationale: Обычный и уместный русский эквивалент κύριος в данном контексте.
- source_word: ἐν δικαιοσύνῃ
  choice: в праведности
  rationale: Сохраняет именную конструкцию оригинала и тематическое повторение δικαιοσύνη в окружающем контексте, не сводя её только к наречному «справедливо».
- source_word: κατʼ ἄνδρα
  choice: над каждым человеком
  rationale: 'Передаёт вероятный распределительный смысл κατά: Божий суд относится к каждому человеку в отдельности; «человек» здесь естественнее для общего значения, чем гендерно маркированное «мужчина».'
- source_word: οἶκον
  choice: домом
  rationale: Сохраняет буквальный образ «дома», который в данном контексте может включать семью или домочадцев.
theological_decisions:
- issue: Характер связи ἐν δικαιοσύνῃ с κρίματα
  choice: суды совершаются в праведности
  alternative: суды праведны / суды справедливы
  rationale: Выбранная формулировка сохраняет греческую предложную именную конструкцию и её возможный смысл как сферы или образа совершения суда, не устраняя допустимое понимание результата как праведного.
- issue: Значение κατʼ ἄνδρα καὶ οἶκον
  choice: над каждым человеком и домом
  alternative: по каждому человеку и дому
  rationale: Контекст допускает распределительное применение суда к отдельному человеку и дому; «над» естественно сочетается по-русски со словом «суд», тогда как буквальное «по человеку» здесь неясно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка сохраняет именную лексическую цепь «праведность» и подлинную неоднозначность конструкции κατά с винительным падежом; «дом» оставлен в основном тексте, а значение семьи или домочадцев поясняется смыслом и сноской.
