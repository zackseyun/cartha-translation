  text: For you are a righteous judge over all the peoples of the earth[a].
translation:
  language: ru
  text: Ибо Ты — праведный Судья над всеми народами земли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над всеми племенами земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: Союз вводит основание для предшествующей мысли; «ибо» естественно передаёт причинно-пояснительную связь в достоинном литературном регистре.
- source_word: σὺ
  choice: Ты
  rationale: Выраженное местоимение подчёркивает Бога как Судью; прописная буква соответствует принятому русскому благоговейному употреблению.
- source_word: κριτὴς δίκαιος
  choice: праведный Судья
  rationale: Сохраняет прямое значение существительного и нравственно-богословскую насыщенность прилагательного; русский порядок слов звучит естественно.
- source_word: ἐπὶ
  choice: над
  rationale: В сочетании с обозначением судьи передаёт власть и юрисдикцию по отношению ко всем народам.
- source_word: πάντας τοὺς λαοὺς
  choice: всеми народами
  rationale: «Народы» сохраняет множественность человеческих общностей и не сводит значение к современным политическим государствам.
- source_word: τῆς γῆς
  choice: земли
  rationale: Универсальный контекст указывает на всю землю, а не на отдельную страну или территорию.
theological_decisions:
- issue: Объём Божьего суда
  choice: над всеми народами земли
  alternative: над всеми племенами земли
  rationale: Формулировка сохраняет универсальность греческого выражения, не ограничивая Божью судебную власть каким-либо одним народом.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-библейской речи. Синтаксис краток и ясен; обращение к Богу передано прописным «Ты», а титульное «Судья» — прописной буквой как обозначение Бога.
