  source_fidelity: Точно переданы причинная связь ὅτι («Ибо»), подчеркнутое σὺ («Ты»), характеристика Бога как δικαίος κριτής («праведный Судья»), а также всеохватность πάντας τοὺς λαοὺς τῆς γῆς («всеми народами земли»). «Над» естественно передаёт ἐπί в значении судебной власти или юрисдикции.
  naturalness: Фраза краткая, ясная и соответствует современному литературному русскому в возвышенно-библейском регистре. «Ибо» несколько книжно, но уместно для сохранения причинно-пояснительной связи и регистра. Инверсия с тире звучит естественно.
  terminology: «Праведный Судья» точно и традиционно передаёт κριτὴς δίκαιος. «Народы» удачно сохраняет множественное λαοί без неоправданного сведения к современным государствам. Прописные «Ты» и «Судья» допустимы в русском благоговейном библейском оформлении и не меняют смысла. Сноска корректно отмечает допустимый лексический вариант, хотя основной текст предпочтительнее.
