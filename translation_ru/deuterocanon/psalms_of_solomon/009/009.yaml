  source_fidelity: 'Первая часть в целом точно передаёт греческий текст: δικαιοσύνη / ἀδικία сохранены как нравственная антитеза, θησαυρίζει — как образ накопления, а παρὰ Κυρίῳ — как «у Господа». Во второй части «за погибель своей души» является естественным русским истолкованием, однако несколько сильнее связывает ἐν ἀπωλείᾳ с причинением гибели, чем позволяет краткая и синтаксически неоднозначная греческая формула. Более нейтральная конструкция сохраняет эту неоднозначность.'
