  terminology: «Праведность», «неправда», «Господь» и «душа» соответствуют регистру и исходной лексике. «Неправда» допустима, хотя «неправедность» дала бы более формальную симметрию; менять её не требуется. Сноска к ψυχή корректно отмечает значения «жизнь» и «сам человек».
