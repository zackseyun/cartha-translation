lexical_decisions:
- source_word: ὁ ποιῶν
  choice: кто творит
  rationale: Субстантивированное причастие передано обобщённо-личной конструкцией; она сохраняет действенный смысл и не навязывает оттенок постоянной привычки.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: В нравственном противопоставлении «праведность» естественно передаёт личный этический смысл δικαιοσύνην; возможный оттенок справедливости отмечен в сноске.
- source_word: θησαυρίζει
  choice: накапливает
  rationale: Глагол обозначает собирание и накопление сокровища. «Накапливает» звучит современно и сохраняет образ отложенного блага.
- source_word: ζωὴν
  choice: жизнь
  rationale: Неопределённое существительное обозначает приобретаемую или сохраняемую у Бога жизнь без необходимости добавлять артиклевое уточнение.
- source_word: αὐτῷ
  choice: себе
  rationale: Дательный падеж имеет возвратный смысл и подчёркивает последствия поступка для самого действующего лица.
- source_word: παρὰ Κυρίῳ
  choice: у Господа
  rationale: παρά с дательным может обозначать пребывание или наличие при ком-либо. «У Господа» естественно сохраняет идею жизни, хранимой в Божьем присутствии, не исключая оттенков «пред Господом» или «от Господа».
- source_word: ἀδικίαν
  choice: неправду
  rationale: «Неправда» образует ясное нравственное противопоставление праведности и охватывает как неправедность, так и несправедливый поступок.
- source_word: αἴτιος
  choice: несёт ответственность
  rationale: Прилагательное выражает личную ответственность, виновность или причинную причастность. Эта формулировка понятна современному читателю и не сводит смысл лишь к субъективному чувству вины.
- source_word: τῆς ψυχῆς
  choice: своей души
  rationale: ψυχή может означать душу, жизнь или самого человека. В данном нравственно-религиозном контексте «душа» сохраняет вес предостережения, а иные значения указаны в сноске.
- source_word: ἐν ἀπωλείᾳ
  choice: за погибель
  rationale: Греческое выражение буквально компактно и допускает разные синтаксические связи. В основном тексте выбран естественный русский способ выразить ответственность за гибель, а более буквальные варианты сохранены в сноске.
theological_decisions:
- issue: Личная ответственность и погибель во второй части стиха
  choice: Неправедный сам несёт ответственность за погибель собственной души.
  alternative: Он виновен в отношении своей души, находящейся в погибели; он ответствен за себя самого на пути к гибели.
  rationale: Греческая фраза кратка и неоднозначна. Основной вариант ясно передаёт личную виновность, не вводя внешнего виновника; сноска сохраняет менее определённые способы связать τῆς ψυχῆς и ἐν ἀπωλείᾳ.
- issue: Значение ψυχή
  choice: В основном тексте — «душа».
  alternative: «жизнь» или «сам человек».
  rationale: «Душа» соответствует нравственно-религиозному звучанию стиха, однако греческое слово имеет более широкий семантический диапазон, который отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Парная конструкция «кто… и кто…» сохраняет симметрию греческого текста и союз καί. Формулировка второй части сделана естественной по-русски, а синтаксическая неоднозначность оригинала вынесена в сноску.
