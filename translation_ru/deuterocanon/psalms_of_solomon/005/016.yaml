  text: But your gift is abundant in kindness and rich[b][a], and the hope in you will not be disappointed in the gift.
translation:
  language: ru
  text: Но дар Твой щедр, исполнен доброты и богат, и надеющийся на Тебя не будет обделён даром.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза сжата и допускает также перевод: «и тому, кто надеется на Тебя, Ты не поскупишься дать». Буквальное построение не вполне ясно: «и нет надежды на Тебя — не поскупится в даре».'
    reason: Греческий текст эллиптичен; не выражено однозначно, кто является подразумеваемым субъектом глагола и как связать две последние части предложения.
lexical_decisions:
- source_word: δόμα
  choice: дар
  rationale: Существительное означает «дар, то, что дано». «Дар» сохраняет конкретность греческого слова и соответствует контексту Божьей щедрости.
- source_word: πολύ
  choice: щедр
  rationale: Буквально слово указывает на величину или обилие. В сочетании с «даром» русское «щедр» естественно передаёт изобильность, не сводя смысл к физическому размеру.
- source_word: μετὰ χρηστότητος
  choice: исполнен доброты
  rationale: χρηστότης обозначает доброту, благость, благожелательность. Такая формулировка передаёт качество Божьего дара и звучит естественнее буквального «с добротой».
- source_word: πλούσιον
  choice: богат
  rationale: 'Сохранён прямой образ греческого слова: дар назван богатым, то есть обильным и изобильным.'
- source_word: ἡ ἐλπὶς ἐπὶ σέ
  choice: надеющийся на Тебя
  rationale: Греческое выражение буквально говорит о «надежде на Тебя», но в сжатой конструкции, вероятно, подразумевает человека, возлагающего надежду на Бога. Русская формулировка ясно передаёт это, не меняя объекта надежды.
- source_word: οὐ φείσεται ἐν δόματι
  choice: не будет обделён даром
  rationale: φείδομαι обычно значит «щадить, беречь, сдерживаться, давать скупо». По контексту надеющийся является получателем Божьей щедрости; перевод передаёт это без ошибочного представления, будто нуждающийся сам не поскупится давать.
theological_decisions:
- issue: Кто проявляет или испытывает сдержанность в заключительной части стиха
  choice: Надеющийся на Бога не будет обделён Божьим даром
  alternative: 'Бог не поскупится на дар тому, кто надеется на Него; либо: надеющийся на Бога не поскупится в даянии'
  rationale: Греческая фраза эллиптична и допускает разные способы восполнения подразумеваемого субъекта. Контекст противопоставляет ограниченную человеческую помощь обильному Божьему дару, поэтому основной текст представляет надеющегося получателем, а не дающим; неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Заглавные местоимения, обращённые к Богу, сохранены как издательская норма. Параллельные определения «щедр, исполнен доброты и богат» удерживают накопительный ритм оригинала.
