lexical_decisions:
- source_word: μακάριος
  choice: Блажен
  rationale: Традиционный термин блаженства, сохраняющий псалмический и богословский регистр; «счастлив» или «удачлив» звучали бы более плоско.
- source_word: οὗ
  choice: тот, о ком
  rationale: Родительное относительное местоимение зависит от μνημονεύει; русское «тот, о ком» естественно передаёт личное отношение.
- source_word: μνημονεύει
  choice: помнит
  rationale: Передаёт основное значение «помнить, помнить о ком-либо» и не исключает оттенка деятельной Божьей заботы.
- source_word: ἐν συμμετρίᾳ
  choice: в должной мере
  rationale: συμμετρία обозначает соразмерность, надлежащую меру или умеренность; это выражение естественно по-русски и сохраняет мысль о соразмерности.
- source_word: αὐταρκίας
  choice: достаток
  rationale: В данном контексте слово обозначает достаточность, обеспеченность или довольство. «Достаток» передаёт наличие необходимого и не создаёт впечатления независимости человека от Бога.
theological_decisions:
- issue: Значение αὐταρκίας в связи с действием Бога
  choice: Фраза понимается как указание на то, что Бог даёт человеку необходимое в должной мере.
  alternative: Фраза может подчёркивать внутреннее довольство либо, более буквально, самодостаточность.
  rationale: Поскольку подлежащим является Бог, перевод не должен внушать мысль о человеческой независимости от Него. Добавленное «давая ему» естественно раскрывает подразумеваемую связь Божьей памяти с достатком, а сноски сохраняют лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным псалмическим началом. Необычная греческая конструкция раскрыта умеренно и без конфессиональной конкретизации; неоднозначность существительного αὐταρκία отмечена в сносках.
