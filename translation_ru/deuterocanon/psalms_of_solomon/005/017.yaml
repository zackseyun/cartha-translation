lexical_decisions:
- source_word: ἔλεός
  choice: милость
  rationale: ἔλεος прямо обозначает милость и сострадание; «милость» сохраняет вес существительного и не привносит более узкого заветного оттенка.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: по всей земле
  rationale: ἐπί с винительным здесь выражает распространение на всю землю; «по всей земле» естественно передаёт всеохватность выражения.
- source_word: Κύριε
  choice: Господи
  rationale: Форма звательного обращения естественно передаётся русским звательным остатком «Господи».
- source_word: χρηστότητι
  choice: в благости
  rationale: χρηστότης может означать доброту, благость или благожелательность; «в благости» сохраняет абстрактное качество и возвышенный, но понятный регистр.
- source_word: '[implied copula]'
  choice: —
  rationale: Греческая фраза безглагольная; русское именное предложение естественно обходится без добавления связки, а тире ясно передаёт предикативную связь.
