lexical_decisions:
- source_word: ἐν τῷ θλίβεσθαι ἡμᾶς
  choice: Когда нас постигает скорбь
  rationale: Конструкция ἐν с субстантивированным инфинитивом имеет временное значение. Формулировка передаёт состояние бедствия или притеснения, не сводя его исключительно к гонению.
- source_word: ἐπικαλεσόμεθα
  choice: мы взываем
  rationale: Будущая форма выражает обращение к Богу с призывом о помощи. В русском молитвенном контексте «взываем» звучит естественно и достойно.
- source_word: εἰς βοήθειαν
  choice: о помощи
  rationale: Оборот указывает на цель обращения; в сочетании «взываем о помощи» это передаётся ясно и идиоматично.
- source_word: οὐκ ἀποστρέψῃ
  choice: Ты не отвергнешь
  rationale: Глагол буквально связан с отворачиванием. «Не отвергнешь» естественно передаёт здесь отказ принять просьбу, сохраняя личностный характер молитвы.
- source_word: τὴν δέησιν ἡμῶν
  choice: нашей мольбы
  rationale: δέησις обозначает настоятельную просьбу, обращённую из нужды. «Мольба» сохраняет её напряжённость и молитвенную окраску.
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν εἶ
  choice: потому что Ты — наш Бог
  rationale: ὅτι вводит основание уверенности молящихся. «Потому что» явно сохраняет причинную связь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Местоимение «Ты» написано с прописной буквы как допустимая русская форма почтительного обращения к Богу. Настоящее «взываем» передаёт естественное для русского языка значение уверенного будущего в контексте; в сноске сохранён явный будущий вариант.
