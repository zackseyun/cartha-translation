lexical_decisions:
- source_word: βαρύνῃς
  choice: не возлагай… тяжёлую
  rationale: Глагол передаёт идею утяжеления. В сочетании с «рукой» русский оборот «возлагать тяжёлую руку» естественно сохраняет исходный образ сильного давления.
- source_word: χεῖρά
  choice: руку
  rationale: Сохранён конкретный образ руки, которая в библейской речи может обозначать проявление силы или причиняемое бедствие; метафора не заменена толкованием.
- source_word: ἐφʼ ἡμᾶς
  choice: на нас
  rationale: Предлог передан в соответствии с пространственным образом тяжёлой руки, лежащей на людях, без неоправданного сужения смысла до открытой враждебности.
- source_word: ἵνα μὴ
  choice: чтобы… не
  rationale: Оборот естественно передаёт зависимую отрицательную целевую или результативную конструкцию, не устраняя присущую ей смысловую гибкость.
- source_word: διʼ ἀνάγκην
  choice: по принуждению
  rationale: Выражение обозначает необходимость, давление или вынужденность. «По принуждению» ясно передаёт мысль о грехе, к которому могут подтолкнуть тяжёлые обстоятельства.
- source_word: ἁμάρτωμεν
  choice: мы не согрешили
  rationale: Совершенный вид естественно передаёт аорист сослагательного наклонения после ἵνα μὴ и сохраняет зависимость действия от предшествующей просьбы.
