  yaml_path: translation/deuterocanon/psalms_of_solomon/005/001.yaml
  text: O Lord God[a], I will praise your name with exultation, in the midst of those who know your righteous judgments.
translation:
  language: ru
  text: Господи Боже, буду хвалить имя Твоё с ликованием среди знающих Твои праведные суды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди понимающих Твои справедливые решения».'
    reason: Лексически возможны значения ἐπίσταμαι «понимать», κρίματα «решения» и δίκαια «справедливые».
lexical_decisions:
- source_word: Κύριε ὁ θεός
  choice: Господи Боже
  rationale: Естественное для русской библейской молитвенной речи обращение, сохраняющее звательный характер κύριε и следующий за ним титул ὁ θεός.
- source_word: αἰνέσω
  choice: буду хвалить
  rationale: Будущее время передаёт намерение или твёрдое решение говорящего и звучит естественно по-русски.
- source_word: τῷ ὀνόματί σου
  choice: имя Твоё
  rationale: Сохраняет ясный библейский оборот, относящийся к явленному имени и достоинству Бога.
- source_word: ἐν ἀγαλλιάσει
  choice: с ликованием
  rationale: Передаёт радостный, торжественный образ совершения хвалы в современном литературном регистре.
- source_word: ἐν μέσῳ
  choice: среди
  rationale: Естественно выражает нахождение говорящего внутри сообщества, не утрачивая пространственно-общинного смысла греческого оборота.
- source_word: ἐπισταμένων
  choice: знающих
  rationale: Передаёт основное значение ἐπίσταμαι — «знать, понимать, быть сведущим»; возможный оттенок понимания отмечен в сноске.
- source_word: τὰ κρίματά σου τὰ δίκαια
  choice: Твои праведные суды
  rationale: «Суды» сохраняет судебно-нормативный диапазон κρίματα, а «праведные» передаёт нравственно-богословский оттенок δίκαια.
