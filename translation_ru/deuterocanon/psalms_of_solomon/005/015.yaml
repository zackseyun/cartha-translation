lexical_decisions:
- source_word: χρηστότης
  choice: доброта
  rationale: Слово обозначает доброту или благожелательность; здесь речь идёт о благодеянии человеку, а «доброта» сохраняет нравственный и достаточно широкий смысл.
- source_word: ἀνθρώπου
  choice: человека
  rationale: Родительный падеж передан прямо; русское «человек» естественно выражает обобщённого участника изречения, не устраняя единственного числа.
- source_word: ἐν φειδῷ
  choice: скупа
  rationale: Оборот указывает на ограниченность, бережливую меру или скупость. Краткое «скупа» сохраняет афористичность и критический оттенок контекста.
- source_word: ἡ αὔριον
  choice: откладывается на завтра
  rationale: 'Греческая конструкция эллиптична: буквально прилагательное с подразумеваемой связкой соседствует с «завтра». Русский перевод восполняет вероятный смысл отсрочки, отмечая неоднозначность в сноске.'
- source_word: δευτερώσῃ
  choice: повторит её
  rationale: Глагол значит «сделать во второй раз, повторить». Местоимение связывает действие с ранее названной добротой и делает фразу естественной по-русски.
- source_word: γογγυσμοῦ
  choice: ропота
  rationale: «Ропот» точно передаёт недовольное ворчание и соответствует достоинству библейского регистра, оставаясь понятным современному читателю.
- source_word: θαυμάσεις
  choice: ты удивишься
  rationale: Сохранены будущее время и второе лицо единственного числа; «удивишься» естественно и точно передаёт θαυμάζω.
