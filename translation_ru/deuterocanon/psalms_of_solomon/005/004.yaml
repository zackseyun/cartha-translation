translation:
  language: ru
  text: Ведь никто не возьмёт добычу у сильного человека[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трофеи» вместо «добычу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ведь он не возьмёт добычу у сильного человека». В греческом подлежащее не выражено явно.'
    reason: source_ambiguity
lexical_decisions:
- source_word: λήψεται
  choice: возьмёт
  rationale: Будущая форма λαμβάνω; в сочетании с добычей естественно передаётся глаголом «взять». Невыраженный субъект в данном контексте передан обобщённым «никто».
- source_word: σκῦλα
  choice: добычу
  rationale: Слово обозначает имущество, захваченное как военная добыча. Русское «добыча» ясно и естественно; вариант «трофеи» также возможен.
- source_word: παρὰ
  choice: у
  rationale: С родительным падежом παρά указывает на источник, от которого что-либо получают или забирают; в русском обороте «взять у кого-либо» предлог «у» звучит естественно.
- source_word: ἀνδρὸς δυνατοῦ
  choice: сильного человека
  rationale: ἀνήρ обозначает мужчину или человека мужского пола, а δυνατός — силу или могущество. «Сильный человек» сохраняет конкретный образ и естественно звучит в русском языке.
theological_decisions:
- issue: Невыраженный субъект при λήψεται
  choice: никто не возьмёт
  alternative: он не возьмёт
  rationale: В греческом тексте подлежащее прямо не названо. Обобщённое отрицание «никто» соответствует возможному неопределённо-личному смыслу и не создаёт местоимения без ясного предшествующего лица; буквальная возможность «он» сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык; краткая пословичная формулировка сохраняет причинный союз γάρ и образ сильного человека, без конфессиональных уточнений.
