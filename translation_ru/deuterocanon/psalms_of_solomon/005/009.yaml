  text: And if you do not turn us back[a], we will not keep away[c][b], but we will come to you.
translation:
  language: ru
  text: И если Ты не возвратишь нас[a], мы не станем держаться вдали[b], но придём к Тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обратишь нас»; или: «не восстановишь нас».'
