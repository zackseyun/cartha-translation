  - marker: b
    text: 'Или: «мы не удержимся»; или: «мы не останемся вдали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: если … не
  rationale: Прямая условная конструкция передаёт греческое условие, не сводя его к более сжатому «если только не».
- source_word: ἐπιστρέψῃς
  choice: обратишь
  rationale: Глагол передаёт направленное возвращение или обращение. «Обратишь» сохраняет образ поворота и допускает как духовный, так и более общий смысл восстановления, не уточняя его без основания в тексте.
- source_word: ἡμᾶς
  choice: нас
  rationale: Сохранено простое местоименное дополнение первого лица множественного числа.
- source_word: οὐκ ἀφεξόμεθα
  choice: мы не станем держаться вдали
  rationale: Средняя форма ἀπέχω здесь выражает удерживание себя на расстоянии или уклонение. Русская формулировка естественно подготавливает противопоставление «но придём к Тебе».
- source_word: ἀλλʼ
  choice: но
  rationale: Обычный противительный союз точно и без усиления передаёт контраст.
- source_word: ἐπὶ σὲ ἥξομεν
  choice: придём к Тебе
  rationale: ἥκω обозначает приход или прибытие; русский оборот сохраняет личную направленность обращения.
theological_decisions:
- issue: Следует ли передавать ἐπιστρέψῃς как явно доктринальное обращение или как восстановление
  choice: обратишь нас
  alternative: возвратишь нас; восстановишь нас
  rationale: Греческий глагол допускает значения поворота, возвращения и восстановления. Выбранная формулировка сохраняет эту напряжённость и не вводит однозначно ни физическое возвращение, ни специальное учение об обращении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Сохранена парадоксальная связь между Божьим обращением людей и их собственным приходом к Нему.
