translation:
  language: ru
  text: Ибо Ты[a] добр и милосерден — прибежище бедного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В печатном издании Суита читается «σὺ χρηστὸς» («Ты добр»). В приведённой электронной строке местоимение σὺ, по-видимому, пропущено.
    reason: 'Текстологическая прозрачность: объясняет явное «Ты» и синтаксическое отношение «прибежища бедного» как приложения, не утверждая недоказанный характер электронной ошибки.'
lexical_decisions:
- source_word: χρηστός
  choice: добр
  rationale: Передаёт благой, доброжелательный характер обращённого к Богу «Ты» естественным современным русским словом; по роду прилагательное относится не к женскому καταφυγή, а к подразумеваемому или засвидетельствованному в печатном тексте местоимению «Ты».
- source_word: ἐλεήμων
  choice: милосерден
  rationale: Прямо сохраняет значение проявляющего милость и уместный для псалма богословский вес.
- source_word: καταφυγή
  choice: прибежище
  rationale: Сохраняет метафору места защиты и традиционно, но понятно звучит в современном литературном русском.
- source_word: τοῦ πτωχοῦ
  choice: бедного
  rationale: Передаёт единственное число и значение неимущего или нуждающегося, не сужая его до конкретного оттенка страдания.
- source_word: ὅτι
  choice: ибо
  rationale: Выражает пояснительно-причинную связь с предшествующим контекстом и соответствует достоинству псалмового регистра.
theological_decisions:
- issue: К кому относятся определения «добр и милосерден»
  choice: К Богу, к которому обращаются на «Ты»; «прибежище бедного» дано как приложение.
  alternative: 'Считать «прибежище бедного» подлежащим: «прибежище бедного добро и милосердно».'
  rationale: Мужской род χρηστός и ἐλεήμων не согласуется с существительным женского рода καταφυγή. Поэтому определения относятся к мужскому адресату, а «прибежище бедного» называет Его приложением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмовым звучанием. «Ибо» и «прибежище» сохраняют достоинство жанра, оставаясь понятными; тире ясно оформляет приложение.
