lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Но если
  rationale: Сохраняет условное значение ἐὰν и лёгкий противительный поворот, выраженный δέ.
- source_word: κεκραγέναι με
  choice: я воззову
  rationale: Передаёт обращённый к Богу громкий призыв естественной для молитвенной речи формой; греческий перфектный инфинитив в сжатой конструкции по-русски требует личной формы.
- source_word: πρὸς σέ
  choice: к Тебе
  rationale: Естественно передаёт направленность молитвенного обращения к Богу.
- source_word: μὴ παρασιωπήσῃς ἀπʼ ἐμοῦ
  choice: не обойди меня молчанием
  rationale: Сохраняет более полное значение παρασιωπάω — пройти мимо или оставить без ответа, умолчав, — и позволяет естественно передать ἀπʼ ἐμοῦ.
