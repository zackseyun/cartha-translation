  text: And if they are hungry[a], they will lift up their faces to you.
translation:
  language: ru
  text: И если они будут голодны, то поднимут к Тебе свои лица.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «поднимут к Тебе своё лицо» — греческое выражение, передающее обращение к Богу за помощью или в уповании на Него.
    reason: cultural_note
lexical_decisions:
- source_word: πεινάσωσιν
  choice: будут голодны
  rationale: 'Аорист сослагательного наклонения с ἐὰν образует условие, относящееся к возможному будущему: «если они будут голодны». Формулировка естественна по-русски и не усиливает значение до «будут умирать от голода».'
- source_word: ἀροῦσιν
  choice: поднимут
  rationale: Будущая форма αἴρω буквально означает «поднимать, возносить». Выбор сохраняет конкретный образ обращения к Богу, не заменяя его более толковательным глаголом.
- source_word: πρόσωπον αὐτῶν
  choice: свои лица
  rationale: В греческом стоит единственное число «лицо» при местоимении множественного числа, однако по-русски при нескольких действующих лицах естественно множественное «свои лица».
- source_word: πρὸς σέ
  choice: к Тебе
  rationale: Предлог πρὸς выражает направленность. «К Тебе» естественно сочетается с «поднимут ... лица» и сохраняет обращение к Богу.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-поэтического контекста. Местоимение обращения к Богу написано с прописной буквы. Сохранён телесный образ исходного текста, а его идиоматическое значение пояснено в сноске.
