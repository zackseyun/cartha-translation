  source_fidelity: Текст точно передаёт условное значение ἐὰν с аористом сослагательного наклонения («если они будут голодны») и будущее действие ἀροῦσιν. «Поднимут к Тебе свои лица» сохраняет буквальный телесный образ αἴρω + πρόσωπον πρὸς σέ, не подменяя его толкованием.
  naturalness: Фраза понятна и приемлема в современном литературном русском; несколько возвышенный образ «поднимут ... лица» уместен для молитвенно-поэтического контекста. Союз «то» факультативен, но не нарушает естественности.
  terminology: Обращение «Тебе» последовательно оформлено с прописной буквы в соответствии с заданным регистром. «Свои лица» является естественной русской передачей единственного πρόσωπον при множественном обладателе. Сноска корректно отмечает буквальное единственное число и осторожно поясняет идиоматический смысл без догматического расширения.
