  text: And who will take from all that you have made, unless you give it?
translation:
  language: ru
  text: И кто возьмёт что-либо из всего, что Ты сотворил, если Ты не дашь?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς λήψεται ἀπὸ πάντων ὧν ἐποίησας
  choice: кто возьмёт что-либо из всего, что Ты сотворил
  rationale: Греческое ἀπό с родительным обозначает взятие из совокупности сотворённого; «что-либо» естественно и ясно передаёт подразумеваемый объект глагола λήψεται, не превращая πάντα в прямое дополнение.
- source_word: ἐὰν μὴ σὺ δῷς
  choice: если Ты не дашь
  rationale: Условное ἐὰν μή передано прямо. Выделенное местоимение σύ отражено явным «Ты»; объект δῷς в греческом не выражен, поэтому в русском также оставлен подразумеваемым.
theological_decisions:
- issue: Зависимость творения от даяния Бога
  choice: если Ты не дашь
  alternative: если Ты не дашь это
  rationale: Отсутствующий в греческом объект не уточняется, благодаря чему сохраняются лаконичность и широта исходного утверждения о Божьем даровании.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Прописное «Ты» употреблено как традиционное уважительное обращение к Богу; синтаксис сохранён в форме риторического вопроса.
