  text: For if I am hungry[a], I will cry out to you, O God, and you will give to me.
translation:
  language: ru
  text: Ведь если я проголодаюсь, я воззову к тебе, Боже, и ты дашь мне[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте не сказано, что именно Бог даст; буквально: «дашь мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινάσω
  choice: проголодаюсь
  rationale: Аорист конъюнктива с ἐὰν выражает возможное будущее условие; совершенный вид естественно передаёт наступление голода.
- source_word: κεκράξομαι
  choice: воззову
  rationale: Передаёт усиленное обращение к Богу, выраженное глаголом κράζω, и соответствует достоинству поэтической молитвенной речи.
- source_word: ὁ θεός
  choice: Боже
  rationale: Форма с артиклем морфологически является именительным падежом, но в библейском греческом здесь выполняет функцию обращения.
- source_word: δώσεις μοι
  choice: дашь мне
  rationale: Сохраняет простое значение глагола «дать» и не добавляет не названный в греческом тексте объект.
