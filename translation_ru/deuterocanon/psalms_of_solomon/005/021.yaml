lexical_decisions:
- source_word: ηὐφράνθησαν
  choice: возрадовались
  rationale: Аорист пассивной формы обозначает обретённую радость; русское возвратное «возрадовались» естественно передаёт результат, сохраняя торжественный тон.
- source_word: οἱ φοβούμενοι Κύριον
  choice: боящиеся Господа
  rationale: Субстантивированное причастие обозначает людей, для которых характерен благоговейный страх перед Господом; традиционная русская формула понятна и не требует поясняющего расширения.
- source_word: ἐν ἀγαθοῖς
  choice: благам
  rationale: Контекст указывает на хорошие дары или блага, ставшие причиной радости. Дательный после «возрадовались» даёт естественную русскую фразу, а примечание сохраняет более буквальную инструментальную возможность.
- source_word: ἡ χρηστότης σου
  choice: благость Твоя
  rationale: «Благость» охватывает и нравственную доброту, и благотворное расположение; это достоинственно и шире, чем «доброта» или «милость».
- source_word: ἐπʼ Ἰσραήλ
  choice: над Израилем
  rationale: ἐπί с винительным здесь естественно передаёт направленность или распространение Божьей благости на Израиль; «над» сохраняет образ пребывающего покровительства.
- source_word: τῇ βασιλείᾳ σου
  choice: в Царстве Твоём
  rationale: 'Дательный падеж не согласуется с винительным Ἰσραήλ, поэтому вероятнее выражает сферу: «в Твоём Царстве». Неоднозначная возможность соотнести царство с Израилем сохранена в примечании.'
theological_decisions:
- issue: Связь выражения τῇ βασιλείᾳ σου с Ἰσραήλ
  choice: «над Израилем, в Царстве Твоём»
  alternative: «над Израилем — Царством Твоим»
  rationale: Различие падежей препятствует прямому грамматическому приложению, поэтому основной текст понимает дательный как указание сферы. Однако семантическое отождествление Израиля с Божьим царством возможно и отмечено без догматического разрешения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Заглавные буквы в местоимениях «Твоя», «Твоём» поддерживают принятый молитвенный регистр; синтаксис остаётся ясным для современного читателя.
