  source_fidelity: Греч. ἱκανὸν τὸ μέτριον ἐν δικαιοσύνῃ утверждает достаточность умеренной (скромной) доли в/при праведности. Во второй части ἐν τούτῳ сохраняет отсылку ко всему сказанному, а εἰς πλησμονὴν ἐν δικαιοσύνῃ обозначает направленность к полноте/достатку в праведности. «Насыщение» допустимо, но сужает πλησμονή до сытости; «полнота» лучше удерживает широкий смысл. Английский audit trail явно повреждён повтором и не должен определять русское чтение.
