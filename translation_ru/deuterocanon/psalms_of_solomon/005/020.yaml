translation:
  language: ru
  text: Скромной доли достаточно при праведности, и в этом — благословение Господа, к полноте в праведности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸν
  choice: Достаточна
  rationale: Передаёт значение достаточности без усиления до изобилия.
- source_word: τὸ μέτριον
  choice: скромная доля
  rationale: Субстантивированное прилагательное обозначает умеренное, небольшое количество или удел; «скромная доля» естественно звучит по-русски и сохраняет материальный оттенок контекста.
- source_word: ἐν δικαιοσύνῃ
  choice: с праведностью / в праведности
  rationale: 'Сохранено повторение греческого выражения и его широкая смысловая напряжённость: речь может идти как о праведном образе жизни, так и о справедливом обладании достатком.'
- source_word: εἰς πλησμονὴν
  choice: ведущее к насыщению
  rationale: εἰς выражает направленность или результат, а πλησμονή — наполненность, сытость или удовлетворение; «насыщение» не сужает смысл до богатства.
- source_word: Κυρίου
  choice: Господа
  rationale: Обычная и уместная передача греческого титула Κύριος в библейском русском регистре.
theological_decisions:
- issue: Связь благословения Господа с умеренной долей и праведностью
  choice: Благословение представлено как находящееся «в этом» и ведущее к насыщению в праведности.
  alternative: Понять πλησμονή как материальное изобилие, гарантируемое праведностью.
  rationale: 'Греческий текст не требует обещания богатства: πλησμονή допускает значение насыщения или удовлетворённости, а повтор ἐν δικαιοσύνῃ удерживает праведность в центре высказывания.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и повтор «праведность» сохранены, хотя по-русски они несколько необычны, поскольку это значимая особенность исходного текста.
