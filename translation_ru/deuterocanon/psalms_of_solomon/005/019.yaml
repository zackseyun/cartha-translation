  text: Если человек обладает избытком[a], он грешит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если человек имеет слишком много».'
    reason: 'Лексическая альтернатива: более разговорно передаёт идею превышения меры в ὑπερπλεονάσῃ.'
lexical_decisions:
- source_word: ἐὰν
  choice: если
  rationale: Вводит условное придаточное; «если» естественно передаёт условие, не добавляя обязательного повторительного оттенка.
- source_word: ὑπερπλεονάσῃ
  choice: слишком много
  rationale: Глагол обозначает превышение меры, избыток. Оборот «слишком много» краток, естественен по-русски и сохраняет идею чрезмерности, не подменяя её толкованием о жадности.
- source_word: ὁ ἄνθρωπος
  choice: у человека
  rationale: В обобщающем изречении русское «у человека» естественно передаёт родовое значение ἄνθρωπος и не ограничивает смысл мужчинами.
- source_word: ἐξαμαρτάνει
  choice: он грешит
  rationale: Передаёт прямой нравственный смысл глагола; местоимение необходимо для естественного русского синтаксиса после конструкции «у человека».
theological_decisions:
- issue: Следует ли истолковать избыток как жадность или любостяжание
  choice: 'Сохранено широкое утверждение о чрезмерном обладании: «Если у человека слишком много, он грешит».'
  alternative: Если человек преизобилует, он грешит.
  rationale: Греческий текст связывает превышение меры с грехом, но прямо не называет внутренний мотив жадностью; перевод сохраняет эту смысловую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткое афористическое построение. Формулировка dignified и понятна широкому читателю, без конфессионально обусловленного уточнения смысла.
