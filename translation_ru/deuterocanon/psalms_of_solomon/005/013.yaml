  text: You feed kings and rulers and peoples, O God; and You sustain kings and rulers and peoples, O God; and who is the hope of the poor and needy, if not you, Lord?
translation:
  language: ru
  text: Ты питаешь царей, правителей и народы, Боже; и кто — надежда бедного и нуждающегося, если не Ты, Господи?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρέφεις
  choice: питаешь
  rationale: Передаёт прямое значение греческого глагола — обеспечивать пищей, кормить; контекст допускает более широкую заботу, но не требует добавочного глагола «поддерживаешь».
- source_word: ἄρχοντας
  choice: правителей
  rationale: Естественное современное соответствие для лиц, обладающих властью, без сужения до конкретной должности.
- source_word: λαούς
  choice: народы
  rationale: Сохраняет множественное число и широкий коллективный смысл греческого слова.
- source_word: πτωχοῦ καὶ πένητος
  choice: бедного и нуждающегося
  rationale: 'Различает два близких греческих обозначения: человека в бедности и человека, испытывающего нужду.'
- source_word: ἐλπίς
  choice: надежда
  rationale: Прямое и богословски нейтральное соответствие, сохраняющее образ Бога как единственного упования.
theological_decisions:
- issue: Единственность Бога как надежды бедного и нуждающегося
  choice: «кто надежда …, если не Ты»
  alternative: «на кого ещё надеяться …, кроме Тебя»
  rationale: Выбранная формулировка ближе сохраняет именную конструкцию и риторический вопрос греческого текста, не разъясняя его сверх оригинала.
- issue: Повтор фразы в английском консультационном тексте
  choice: Фраза о царях, правителях и народах переведена один раз
  alternative: Повторить её с добавлением «поддерживаешь»
  rationale: В засвидетельствованном греческом источнике имеется только одно сказуемое τρέφεις и нет повторной фразы; поэтому английское удвоение не перенесено.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Обращения к Богу переданы традиционными формами «Боже» и «Господи»; местоимение «Ты» написано с прописной буквы как уместная русская издательская норма почтительного обращения.
