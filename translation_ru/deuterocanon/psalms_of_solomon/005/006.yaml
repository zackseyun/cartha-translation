base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/006.yaml
  text: For man and his portion from you are in the balance[a]; he will not add so as to exceed your judgment[b], O God.
translation:
  language: ru
  text: Ибо человек и его доля от Тебя — на весах; он не прибавит сверх Твоего суда, Боже.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος
  choice: человек
  rationale: Единственное число и местоимение αὐτοῦ сохранены; «человек» естественно передаёт как конкретное, так и обобщённое значение без ненужного уточнения пола.
- source_word: μερὶς
  choice: доля
  rationale: «Доля» передаёт назначенную человеку часть или меру и хорошо сочетается с образом весов.
- source_word: παρὰ σοῦ
  choice: от Тебя
  rationale: 'Παρά с родительным падежом обозначает источник: доля, а грамматически, возможно, и человек с его долей — от Бога. Локативное «перед Тобой» здесь не соответствует форме παρὰ σοῦ.'
- source_word: ἐν σταθμῷ
  choice: на весах
  rationale: Сохраняется конкретный образ взвешивания; по-русски предмет находится «на весах».
- source_word: οὐ προσθήσει
  choice: он не прибавит
  rationale: Будущее время и буквальная идея прибавления сохранены без усиления до значения «не сможет».
- source_word: τοῦ πλεονάσαι
  choice: так, чтобы превысить
  rationale: Оборот передаёт направленность или результат прибавления — выход за установленную Богом меру.
- source_word: κρίμα
  choice: решение
  rationale: В контексте установленной Богом доли слово обозначает Его определяющее или судебное решение; вариант «суд» отмечен в сноске.
- source_word: ὁ θεός
  choice: Боже
  rationale: Именительный по форме употреблён как обращение и естественно передаётся русским звательным обращением.
theological_decisions:
- issue: Обобщённое значение ἄνθρωπος в единственном числе
  choice: 'Сохранить единственное число: «человек»'
  alternative: «Люди» или «человечество»
  rationale: Источник представляет отдельного человека в обобщённом смысле и затем соотносит с ним местоимение единственного числа; русское «человек» сохраняет обе стороны выражения.
- issue: Характер Божьего κρίμα
  choice: «решение» с вариантом «суд» в сноске
  alternative: Только «суд» или «приговор»
  rationale: Контекст допускает как установленную Богом меру, так и судебную оценку. Основной текст не сужает значение до карательного приговора, а сноска сохраняет судебный оттенок.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической сдержанностью. Заглавные местоимения в обращении к Богу соответствуют принятой русской библейской традиции. Тире перед «на весах» естественно восполняет отсутствующую в греческом связку.
