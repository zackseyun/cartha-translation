    rationale: Κρίμα прежде всего означает суд, судебное решение/приговор; в данном контексте «суд» точнее и сильнее связано с образом взвешивания. Русская конструкция с «так, чтобы» стилистически неуклюжа; «сверх» естественно выражает παρά в сочетании с идеей превышения.
