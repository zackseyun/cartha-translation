  text: You feed the birds and the fish[z], as you give rain to the desolate places for the sprouting of grass[a], to prepare fodder in the wilderness for every living thing.
translation:
  language: ru
  text: Ты кормишь птиц и рыб, посылая дождь в пустынные места, чтобы взошла трава, чтобы приготовить в пустыне корм для всего живого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты кормишь птиц и рыб, когда даёшь дождь пустынным местам, чтобы взошла трава, чтобы приготовить в пустыне пищу для всего живого».'
    reason: Греческий оборот ἐν τῷ с инфинитивом может иметь временной оттенок («когда даёшь») наряду с инструментальным («посылая»); χορτάσματα может передаваться более общим словом «пища» наряду с «корм».
lexical_decisions:
- source_word: πετεινὰ
  choice: птиц
  rationale: Существительное обозначает летающих существ, в данном контексте естественнее всего — птиц.
- source_word: τρέφεις
  choice: кормишь
  rationale: Передаёт конкретный смысл обеспечения пищей и сохраняет образ Божьей заботы о живых существах.
- source_word: ἐν τῷ διδόναι σὲ
  choice: посылая
  rationale: Греческий оборот допускает значение средства или времени; деепричастие естественно выражает здесь то, как Бог кормит живых существ, давая дождь.
- source_word: ὑετὸν ἐρήμοις
  choice: дождь на пустынные земли
  rationale: Так сохраняется образ дождя, приходящего в бесплодные, пустынные места, при естественном русском управлении.
- source_word: εἰς ἀνατολὴν χλόης
  choice: чтобы взошла трава
  rationale: ἀνατολή буквально указывает на восход или появление; применительно к χλόη речь идёт о всходах свежей зелени или травы.
- source_word: ἑτοιμάσαι χορτάσματα
  choice: чтобы приготовить ... корм
  rationale: Инфинитив ἑτοιμάσαι передан как цель, а χορτάσματα — как корм, то есть пища, которой насыщаются живые существа.
- source_word: ἐν ἐρήμῳ παντὶ ζῶντι
  choice: в пустыне ... для всего живого
  rationale: Формулировка сохраняет пустынный образ и всеохватность παντὶ ζῶντι без ограничения только животными определённого рода.
theological_decisions:
- issue: Связь между дарованием дождя и кормлением творения
  choice: посылая дождь
  alternative: когда Ты даёшь дождь
  rationale: Оборот ἐν τῷ с инфинитивом может быть инструментальным или временным. В основном тексте выбран инструментальный оттенок как наиболее связный по смыслу, без исключения временного прочтения.
- issue: Целевое значение ἑτοιμάσαι
  choice: чтобы приготовить
  alternative: и приготовляя
  rationale: Аористный инфинитив естественно выражает цель или предполагаемый результат дарования дождя; русское «чтобы приготовить» сохраняет эту направленность.
translation_notes:
  register: Современный литературный русский язык с прямым и достойным обращением к Богу. «Ты» написано с прописной буквы по принятой русской библейской традиции. Образы пустыни, дождя, всходящей травы и корма сохранены без конфессиональных уточнений.
