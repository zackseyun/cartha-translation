base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/014.yaml
  text: And you will hear[a], for who is kind and gentle but you[c][b], to gladden the soul of the humble when you open your hand in mercy?
translation:
  language: ru
  text: И Ты услышишь[a], ибо кто добр и кроток, кроме Тебя, чтобы обрадовать душу смиренного[b], когда Ты по милости раскрываешь Свою руку[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благосклонно выслушаешь», «ответишь». Глагол может обозначать такое слушание молитвы, за которым следует отклик.'
    reason: lexical_alternative
  - marker: b
    text: 'В предоставленном греческом тексте стоит несогласованная форма ταπεινὸν. Вероятно, следует читать ταπεινοῦ — «смиренного [человека]»; возможно также понимание: «смиренную душу».'
    reason: textual_note
  - marker: c
    text: «Раскрыть руку» — библейский образ щедрого дара и обеспечения нуждающегося.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπακούσῃ
  choice: услышишь
  rationale: Глагол означает не просто восприятие звука, но внимательное или благосклонное слушание и в молитвенном контексте может подразумевать ответ. «Услышишь» сохраняет эту смысловую ёмкость.
- source_word: χρηστός
  choice: добр
  rationale: Передаёт благость, доброжелательность и готовность благотворить; краткая форма естественна в риторическом вопросе.
- source_word: ἐπιεικής
  choice: кроток
  rationale: В данном хвалебном контексте слово обозначает мягкость, незлобивость и снисходительность. «Кроток» сохраняет возвышенный поэтический регистр, не сводя значение лишь к юридической снисходительности.
- source_word: εὐφρᾶναι
  choice: чтобы обрадовать
  rationale: Аористный инфинитив поясняет или выражает характерное действие названного добрым и кротким Бога; конструкция с «чтобы» естественно передаёт эту синтаксическую связь.
- source_word: ψυχὴν
  choice: душу
  rationale: «Душа» соответствует молитвенно-поэтическому регистру и обозначает внутреннее существо человека.
- source_word: ταπεινὸν / вероятное ταπεινοῦ
  choice: смиренного
  rationale: 'Перевод следует вероятному чтению ταπεινοῦ («смиренного [человека]»), которое согласуется с ψυχὴν как зависимый родительный: «душу смиренного». Несогласованная форма ταπεινὸν в предоставленном тексте отмечена в сноске как текстовая трудность.'
- source_word: ἐν τῷ ἀνοῖξαι χεῖρά σου
  choice: когда Ты раскрываешь Свою руку
  rationale: Сохраняется яркий библейский образ открытой руки как щедрого дара и обеспечения; временная конструкция естественна по-русски.
- source_word: ἐν ἐλέει
  choice: по милости
  rationale: Передаёт основание и характер Божьего действия и звучит естественнее по-русски, чем буквальное «в милости».
theological_decisions:
- issue: Связь инфинитива εὐφρᾶναι с описанием Бога
  choice: «чтобы обрадовать» как пояснение того, в чём проявляются Божья доброта и кротость
  alternative: 'Понимать как отдельное следствие: «так что Ты радуешь»'
  rationale: Греческий инфинитив допускает пояснительный или результативный оттенок. Перевод сохраняет связь с предшествующим описанием, не превращая её в жёсткое утверждение о цели.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Синтаксис близок греческому риторическому вопросу, но не перегружен буквальными оборотами. Заглавные местоимения при обращении к Богу сохранены как уместная русская издательская конвенция.
