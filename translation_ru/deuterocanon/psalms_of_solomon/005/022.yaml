lexical_decisions:
- source_word: εὐλογημένη
  choice: Благословенна
  rationale: Форма женского рода согласована со словом «слава» и сохраняет славословную формулу без добавления отсутствующего в греческом глагола.
- source_word: δόξα
  choice: слава
  rationale: Прямой и устойчивый эквивалент, передающий как Божье величие, так и связанный с ним язык хвалы.
- source_word: Κυρίου
  choice: Господа
  rationale: Передаёт греческое κύριος; форма родительного падежа соответствует синтаксису выражения «слава Господа».
- source_word: ὅτι
  choice: ибо
  rationale: Сохраняет объяснительно-причинную связь и соответствует возвышенному, но понятному стилю славословия.
- source_word: αὐτὸς
  choice: Он Сам
  rationale: Сохраняет усилительное значение местоимения, не добавляя идеи исключительности, которой греческий текст прямо не выражает.
- source_word: βασιλεὺς
  choice: Царь
  rationale: Основное значение слова и естественное обозначение Божьего царского владычества в русском библейском регистре.
