lexical_decisions:
- source_word: οὐρανός
  choice: небо
  rationale: В паре с γῆ слово образует всеохватный космический образ «небо и земля». «Небо» сохраняет этот библейский меризм и не сводит образ к погодному явлению.
- source_word: ἐβαρύνθησεν
  choice: отяготилось
  rationale: Передаёт образ тяжести или обременённости, не уточняя её причину и не истолковывая глагол как указание на потемнение или бурю.
- source_word: γῆ
  choice: земля
  rationale: В сочетании с «небом» здесь естествен широкий смысл всей земли, а не отдельной страны или территории.
- source_word: ἐβδελύξατο
  choice: возгнушалась
  rationale: Глагол выражает сильное отвращение; «возгнушалась» сохраняет нравственную окраску и возвышенный поэтический регистр.
- source_word: αὐτούς
  choice: ими
  rationale: Русское управление глагола «гнушаться» требует творительного падежа; местоимение указывает на людей, осуждаемых в контексте.
theological_decisions:
- issue: Характер реакции неба и земли
  choice: Сохранена поэтическая персонификация творения без пояснения причины его реакции.
  alternative: Истолковать тяжесть неба как бремя грехов осуждаемых людей или как признак бури.
  rationale: Греческий текст описывает реакцию космоса, но прямо не называет ни грехи причиной тяжести, ни метеорологическое явление.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической лексикой. «Отяготилось» и «возгнушалась» передают параллелизм и олицетворение неба и земли, не превращая первую половину строки в описание погоды.
