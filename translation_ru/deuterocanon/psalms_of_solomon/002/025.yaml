translation:
  language: ru
  text: Ибо они насмехались и не щадили — в гневе и ярости, с негодованием.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с озлоблением»; возможно также: «с мстительным гневом» (μετὰ μηνίσεως).'
    reason: Лексема μήνισις обозначает сильный, нередко длительный гнев или негодование; в зависимости от контекста возможен оттенок озлобления либо мстительности.
lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: Союз вводит основание предшествующего высказывания; «ибо» естественно сохраняет причинно-пояснительную связь и достойный поэтический регистр.
- source_word: ἐνέπαιξαν
  choice: насмехались
  rationale: Передаёт насмешку и презрительное обращение без избыточного уточнения объекта, который в греческом тексте не назван.
- source_word: οὐκ ἐφείσαντο
  choice: не щадили
  rationale: Точно и компактно передаёт отсутствие пощады, сохраняя суровость греческой формулировки.
- source_word: ἐν ὀργῇ
  choice: в гневе
  rationale: Прямое соответствие греческой предложной конструкции и первый элемент риторического нарастания.
- source_word: καὶ θυμῷ
  choice: и ярости
  rationale: «Ярость» отличает θυμός от ὀργή и усиливает эмоциональный ряд, не сводя два близких понятия к повтору.
- source_word: μετὰ μηνίσεως
  choice: с неистовым негодованием
  rationale: μήνισις обозначает сильный, устойчивый и потенциально мстительный гнев; сочетание передаёт кульминационную силу выражения, не закрепляя однозначно мотив мести.
