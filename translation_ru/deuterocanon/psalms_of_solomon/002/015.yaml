  text: Because they themselves defiled what was pure in the filth of illicit mingling[c][b][a]. My belly and my inward parts ache over these things.
translation:
  language: ru
  text: За то, что они сами осквернили чистое[a] скверной[c] смешения[b]. От всего этого болят у меня живот и внутренности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святое» либо «святыни».'
