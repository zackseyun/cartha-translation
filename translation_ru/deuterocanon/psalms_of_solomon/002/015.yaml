  - marker: b
    text: 'Буквально: «смешения»; здесь это слово, вероятно, имеет нравственно предосудительный или половой смысл.'
    reason: cultural_note
  - marker: c
    text: В представленном греческом тексте стоит ῥύμῳ; вероятно, это опечатка вместо ῥύπῳ — «грязью, скверной». Чтение «на улице» грамматически ожидало бы форму ῥύμῃ.
    reason: textual_note
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: За то, что
  rationale: Передаёт причинное основание скорби и сохраняет связь с предшествующим контекстом.
- source_word: αὐταὶ
  choice: они сами
  rationale: Сохраняет эмфатический характер местоимения и его женский род, не добавляя отсутствующего в стихе существительного.
- source_word: ἐμίαυσαν (вероятно, опечатка вместо ἐμίαναν)
  choice: осквернили
  rationale: Контекст и ожидаемая форма глагола μιαίνω указывают на нравственно-ритуальное осквернение.
- source_word: ἁγνά
  choice: чистое
  rationale: Субстантивированное среднее множественного числа естественно передаётся собирательным «чистое»; возможный оттенок святости отмечен в сноске.
- source_word: ἐν ῥύμῳ (вероятно, опечатка вместо ἐν ῥύπῳ)
  choice: скверной
  rationale: Форма ῥύμῳ не соответствует дательному падежу слова ῥύμη («улица»); контекст осквернения поддерживает чтение ῥύπῳ, «грязью, скверной».
- source_word: ἀναμίξεως
  choice: смешения
  rationale: Сохраняет буквальный образ смешения и не устраняет намеренно его вероятный нравственный или сексуальный подтекст.
- source_word: τὴν κοιλίαν μου καὶ τὰ σπλάγχνα μου
  choice: мой живот и мои внутренности
  rationale: Сохраняет телесную образность и силу мучительной, глубоко переживаемой скорби.
- source_word: πονῶ ἐπὶ τούτοις
  choice: От этого болят
  rationale: Естественно по-русски выражает настоящую телесную боль, вызванную описанными событиями.
theological_decisions:
- issue: Значение ἁγνά
  choice: чистое
  alternative: святое / святыни
  rationale: Греческое слово допускает как нравственно-ритуальную чистоту, так и оттенок святости; основной текст сохраняет более широкий смысл, а альтернатива указана в сноске.
- issue: Характер «смешения»
  choice: Не уточнять прямо как половую распущенность
  alternative: блудное смешение / половая распущенность
  rationale: Контекст, вероятно, нравственно или сексуально окрашен, но само существительное означает «смешение»; буквальный образ сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной лексикой. Телесные образы сохранены без эвфемизации; синтаксис сделан естественным для русского языка, а подлинная неоднозначность слов ἁγνά и ἀναμίξεως вынесена в сноски.
