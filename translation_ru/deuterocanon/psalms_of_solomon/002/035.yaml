    text: 'Или: «не узнали Его»; «не признали Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀνιστῶν ἐμέ
  choice: возносящий меня
  rationale: Причастие ἀνιστῶν означает поднятие или возвышение. «Возносящий» естественно сочетается с «к славе» и сохраняет противопоставление последующей участи гордых, не уточняя способ возвышения.
- source_word: εἰς δόξαν
  choice: к славе
  rationale: εἰς указывает на цель или итог; «к славе» передаёт направленность и звучит естественно по-русски.
- source_word: κομίζων
  choice: ведущий
  rationale: В предоставленном греческом тексте стоит κομίζων, а не κοιμίζων. Здесь глагол выражает приведение к указанному исходу; «ведущий» сохраняет направленность конструкции εἰς ἀπωλίαν и не вносит отсутствующий в данном чтении образ сна.
- source_word: ὑπερηφάνους
  choice: гордых
  rationale: Субстантивированное прилагательное обозначает надменных, горделивых людей. «Гордых» кратко и естественно сохраняет нравственную оценку.
- source_word: ἀπωλίαν αἰῶνος
  choice: вечной погибели
  rationale: Родительный αἰῶνος при ἀπωλίαν наиболее естественно выражает непреходящий характер погибели. «Вечная погибель» сохраняет серьёзность выражения без лишней конкретизации его природы.
- source_word: ἐν ἀτιμίᾳ
  choice: в бесчестии
  rationale: Формально близкая передача ἀτιμία сохраняет смысл утраты чести и позора; возможное идиоматическое «с позором» отмечено в сноске.
- source_word: οὐκ ἔγνωσαν αὐτόν
  choice: они не познали Его
  rationale: '«Не познали» сохраняет широкий диапазон γινώσκω: отсутствие знания, распознания или признания. Заглавная буква отражает очевидную отсылку к Богу в данном контексте.'
theological_decisions:
- issue: Характер выражения ἀπωλίαν αἰῶνος
  choice: вечная погибель
  alternative: погибель века / погибель навеки
  rationale: Основной текст передаёт вероятное значение продолжительности, но не уточняет состояние или механизм погибели и тем самым не разрешает богословский вопрос сверх греческого текста.
- issue: Смысл ἔγνωσαν применительно к Богу
  choice: не познали Его
  alternative: не узнали Его / не признали Его
  rationale: «Познали» оставляет открытыми познавательный, распознавательный и нравственно-реляционный оттенки глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Сохранена единая причастная конструкция греческого текста. Перевод следует засвидетельствованному в предоставленном источнике чтению κομίζων; спорная редакционная гипотеза κοιμίζων не внесена в основной текст.
