  text: the one who raises me to glory and brings the proud to everlasting destruction in disgrace[d][c][b][a], because they did not know him.
translation:
  language: ru
  text: возносящий меня к славе и ведущий гордых к вечной погибели в бесчестии[a], потому что они не познали Его[b].
  philosophy: optimal-equivalence
  footnotes:
