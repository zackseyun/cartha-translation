lexical_decisions:
- source_word: περιέζωσατο
  choice: опоясалась / обвязала
  rationale: Средняя форма обозначает действие над собой. В русском повтор глагольной идеи делает обе части параллельными и естественными, сохраняя общий греческий сказуемый.
- source_word: σάκκον
  choice: вретищем
  rationale: Традиционный и узнаваемый библейский термин для грубой одежды скорби; творительный падеж естественно сочетается с «опоясалась».
- source_word: ἐνδύματος εὐπρεπείας
  choice: нарядной одежды
  rationale: Передаёт привлекательность и достойный внешний вид одежды без избыточной роскоши, которой греческое выражение не требует.
- source_word: σχοινίον
  choice: верёвкой
  rationale: Общеупотребительное обозначение верёвки или шнура; в данном образе подчёркивает грубую замену головного украшения.
- source_word: στεφάνου
  choice: венка
  rationale: В контексте украшения головы «венок» передаёт στεφάνος без обязательного царского оттенка слова «корона».
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с сохранением общеизвестного библейского слова «вретище». Синтаксис слегка развёрнут: подразумеваемый во второй половине греческий глагол передан явно ради ясности и естественности. Контраст между одеждой скорби и праздничным убранством сохранён.'
