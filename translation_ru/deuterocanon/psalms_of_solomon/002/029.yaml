lexical_decisions:
- source_word: τοῦ ἐπιθεῖναι
  choice: чтобы повергнуть
  rationale: Субстантивированный инфинитив продолжает предшествующее прошение о воздаянии. «Повергнуть» естественно передаёт направленное действие и унижение, не превращая оборот в простое «пристыдить».
- source_word: τὴν ὑπερηφανίαν
  choice: надменность
  rationale: Существительное обозначает высокомерное само­возвышение. «Надменность» здесь точнее нейтрально звучащей вне контекста «гордости» передаёт отрицательную оценку.
- source_word: τοῦ δράκοντος
  choice: дракона
  rationale: Сохранён буквальный и выразительный греческий образ; перевод не устанавливает прямо, какой правитель или враждебная сила за ним подразумевается.
- source_word: ἐν ἀτιμίᾳ
  choice: в бесчестье
  rationale: Оборот обозначает состояние позора, утраты чести и унижения. «В бесчестье» сохраняет самостоятельный смысл ἀτιμία, не сводя его к идиоме «пристыдить».
theological_decisions:
- issue: Кого обозначает «дракон»
  choice: Сохранить метафору «дракон» в основном тексте.
  alternative: Прямо назвать исторического чужеземного правителя или угнетающую державу.
  rationale: Сам стих не называет подразумеваемое лицо или силу. Сохранение образа соответствует греческому тексту и не снимает намеренно оставленную в нём неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенно-поэтическим строем. Оборот «повергнуть … в бесчестье» сохраняет достоинство регистра, образность и семантическую самостоятельность ἀτιμία.
