  source_fidelity: «Из-за всего этого» faithfully renders ἕνεκεν τούτων without overdefining the preceding referent. «Он сказал» preserves the unexpanded subject of εἶπεν. «Отбросьте их подальше от меня» accurately conveys the imperative ἀπορρίψατε, the object αὐτά, and the distancing force of μακράν ἀπ’ ἐμοῦ. «Красота его славы не принесла им пользы» retains the full κάλλος τῆς δόξης αὐτοῦ construction and appropriately renders οὐκ εὐώδωκεν αὐτοῖς in a non-materially restricted sense. Ending the direct quotation after «от меня» is a defensible modern punctuation decision and avoids presenting the following third-person clause as necessarily part of the utterance.
  naturalness: The Russian is fluent, modern literary prose with an appropriately restrained biblical register. «Отбросьте» is vivid but natural; «не принесла им пользы» is idiomatic and clear. The deliberately unresolved «его» is grammatically natural, though contextually ambiguous as in the source.
  terminology: «Красота», «слава» and «польза» preserve the relevant lexical components without doctrinal expansion. The textual-variant footnote is correctly anchored to «его», and the lexical-alternative note is correctly anchored to the verb phrase. No theological or confessional terminology has been imposed.
