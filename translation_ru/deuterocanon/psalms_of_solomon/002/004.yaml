  yaml_path: translation/deuterocanon/psalms_of_solomon/002/004.yaml
  text: Because of these things he said[a], “Cast them far away from me[c][b]; the beauty of his glory did not prosper them.”
translation:
  language: ru
  text: 'Из-за всего этого он сказал: «Отбросьте их подальше от меня». Красота его славы[a] не принесла им пользы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В одной рукописи: «её славы» вместо «его славы».'
    reason: textual_variant
  - marker: b
    text: 'Или: «не содействовала их благополучию»; греческий глагол может означать как принесение пользы, так и дарование успеха или процветания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν τούτων
  choice: Из-за всего этого
  rationale: Передаёт явную причинную отсылку к описанному ранее, не уточняя сверх греческого текста, что именно имеется в виду.
- source_word: εἶπεν
  choice: он сказал
  rationale: 'Сохранён обычный глагол речи и местоименная сдержанность оригинала: личность говорящего определяется контекстом.'
- source_word: Ἀπορρίψατε αὐτὰ μακρὰν ἀπ’ ἐμοῦ
  choice: Отбросьте их подальше от меня
  rationale: «Отбросьте» сохраняет резкую образность ἀπορρίπτω, а «подальше от меня» естественно передаёт пространственное усиление μακρὰν ἀπ’ ἐμοῦ.
- source_word: οὐκ εὐώδωκεν αὐτοῖς
  choice: не принесла им пользы
  rationale: В данном контексте εὐοδόω обозначает пользу или благоприятный результат; выбранная формулировка ясна по-русски и не навязывает исключительно материального смысла процветания.
- source_word: τὸ κάλλος τῆς δόξης αὐτοῦ
  choice: Красота его славы
  rationale: Сохранена генитивная конструкция и оба смысловых компонента — κάλλος («красота») и δόξα («слава»). Русское «его» также не вынуждает преждевременно определять референт местоимения.
theological_decisions:
- issue: Граница прямой речи
  choice: Прямая речь заканчивается после «от меня»
  alternative: Включить слова «Красота его славы не принесла им пользы» в прямую речь
  rationale: Императив и первое лицо естественно образуют самостоятельное Божье высказывание, после которого повествователь продолжает от третьего лица. Поскольку древнегреческий текст не имел современных кавычек, синтаксическая возможность иной пунктуации остаётся, но выбранное членение устраняет немотивированный переход от первого лица к третьему внутри одной реплики.
- issue: Референт αὐτοῦ
  choice: его
  alternative: уточнить как «Божьей» либо «святилища/жертвенника»
  rationale: Форма αὐτοῦ сама по себе допускает отнесение к существительному мужского или среднего рода. Перевод «его» сохраняет реальную неоднозначность и не закрепляет спорный референт.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка сохраняет резкость повеления, повтор понятий «красота» и «слава», а также неоднозначность местоимения αὐτοῦ; архаизмы и конфессионально маркированные уточнения не используются.
