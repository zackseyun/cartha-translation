  text: because the sons of Jerusalem defiled the holy things of the Lord; they profaned the offerings of God with their lawless acts.
translation:
  language: ru
  text: за то, что сыны Иерусалима[a] осквернили святыни Господа и своими беззаконными делами обесчестили приношения Богу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети Иерусалима». В греческом тексте буквально: «сыны».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дары Бога» или «дары Божии»; в храмовом контексте, вероятно, имеются в виду священные дары, приносимые Богу.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: за то, что
  rationale: Оборот связывает последующее воздаяние с названной причиной; «за то, что» естественно передаёт как причинный, так и ответно-возмездный оттенок.
- source_word: οἱ υἱοὶ Ἱερουσαλήμ
  choice: сыны Иерусалима
  rationale: Сохраняется явно мужская форма греческого υἱοί и образное обозначение жителей или народа Иерусалима.
- source_word: ἐμίαναν
  choice: осквернили
  rationale: Глагол обозначает ритуальное загрязнение святого; «осквернили» ясно сохраняет культовый смысл.
- source_word: τὰ ἅγια Κυρίου
  choice: святыни Господа
  rationale: Субстантивированное neutrum plural охватывает священные предметы или иные святыни и не сводится без достаточного основания к одному зданию святилища.
- source_word: ἐβεβήλωσαν
  choice: обесчестили
  rationale: Передаёт обращение со священным как с несвященным и звучит естественно в современном литературном русском; возможное более специальное «профанировали» менее общедоступно.
- source_word: τὰ δῶρα τοῦ θεοῦ
  choice: приношения Богу
  rationale: В храмовом контексте δῶρα естественно обозначает посвящённые Богу дары-приношения. Дательный оборот по-русски устраняет ошибочное впечатление, будто речь идёт о дарах, данных Богом людям; буквальная форма отмечена в сноске.
- source_word: ἐν ἀνομίαις
  choice: своими беззаконными делами
  rationale: Передаёт инструментальный или сопутствующий смысл ἐν и связывает множественное ἀνομίαις с конкретными проявлениями беззакония.
theological_decisions:
- issue: Направленность выражения τὰ δῶρα τοῦ θεοῦ
  choice: приношения Богу
  alternative: дары Божии
  rationale: Храмовый контекст поддерживает понимание даров, посвящённых Богу, однако грамматическая форма сама по себе допускает буквальную передачу, поэтому она сохранена как альтернатива в сноске без догматического уточнения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Сыны» и «святыни» сохраняют образность и культовый контекст, а синтаксис остаётся понятным современному читателю.
