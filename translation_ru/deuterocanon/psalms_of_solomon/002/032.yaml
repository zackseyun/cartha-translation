base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/032.yaml
  text: because he despised him with dishonor[a]; he did not consider that he was a man[b], and afterward he did not consider.
translation:
  language: ru
  text: потому что он презрел его в бесчестии; он не принял во внимание, что он человек, и не принял во внимание последующего[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конца», «исхода» или «того, что будет потом».'
    reason: Греческое τὸ ὕστερον может обозначать последующее, а также конечный результат или исход.
lexical_decisions:
- source_word: ἐξουδένωσεν
  choice: с презрением предал
  rationale: Глагол означает считать кого-либо ничем, презирать или обращаться с ним пренебрежительно. Оборот «с презрением предал его бесчестью» естественно передаёт и действие глагола, и связанную с ним позорящую участь.
- source_word: ἐν ἀτιμίᾳ
  choice: бесчестью
  rationale: ἀτιμία обозначает бесчестье, позор, утрату чести. Русская конструкция «предал бесчестью» передаёт результирующий позор без добавления конфессионального толкования.
- source_word: ἐλογίσατο
  choice: принял во внимание
  rationale: 'Повтор одного и того же оборота сохраняет намеренный повтор греческого глагола и его смысл: учесть, принять в расчёт.'
- source_word: ἄνθρωπός
  choice: человек
  rationale: Нейтральное современное русское слово точно передаёт родовое значение ἄνθρωπος и оставляет в контексте намёк на человеческую ограниченность и смертность.
- source_word: τὸ ὕστερον
  choice: то, что будет потом
  rationale: Субстантивированное выражение может указывать на последующее, позднейший итог или конец. Основной перевод сохраняет временную направленность, не сводя её однозначно к «исходу» или «концу».
theological_decisions:
- issue: Неуказанные подлежащие при ἐξουδένωσεν и ἐλογίσατο
  choice: Не называть первое подлежащее Богом; смену вероятного деятеля обозначить словом «тот»
  alternative: «Бог… он…» либо повторное «он… он…»
  rationale: Имя Бога отсутствует в данном греческом стихе, поэтому его добавление превратило бы контекстуальный вывод в часть текста. Вместе с тем русское «тот» делает вероятную смену деятеля читаемой, не называя его и не устраняя полностью местоименную зависимость от контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом. Сохранены причинное начало стиха, повтор «не принял во внимание» и смысловая напряжённость местоименных отсылок; явное «Бог» не добавлено, поскольку в греческом тексте этого слова нет.
