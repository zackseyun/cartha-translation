  yaml_path: translation/deuterocanon/psalms_of_solomon/002/017.yaml
  text: For you repaid the sinners according to their deeds[c][b][a], and according to their exceedingly evil sins.
translation:
  language: ru
  text: Ибо Ты воздал грешникам[a] по их делам[b] и по их чрезвычайно злым грехам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий артикль может указывать на определённую, уже известную группу грешников.
    reason: source_nuance
  - marker: b
    text: 'Или: «поступкам».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «весьма дурным грехам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκας
  choice: воздал
  rationale: «Воздал» передаёт возвращение человеку должного по его поступкам и сохраняет судебный оттенок греческого глагола.
- source_word: τοῖς ἁμαρτωλοῖς
  choice: грешникам
  rationale: Прямое и устойчивое соответствие греческому существительному; форма с артиклем может обозначать уже известную группу, но добавление «этим» в основной текст было бы чрезмерно определённым.
- source_word: ἔργα
  choice: делам
  rationale: «Дела» естественно передаёт конкретные нравственно оцениваемые поступки и сохраняет традиционную библейскую лексику без архаизации.
- source_word: ἁμαρτίας
  choice: грехам
  rationale: Прямое соответствие, сохраняющее нравственно-религиозный смысл греческого слова.
- source_word: πονηρὰς σφόδρα
  choice: чрезвычайно злым
  rationale: Определение согласовано с «грехами», как в греческом тексте, а наречие «чрезвычайно» сохраняет усилительное значение σφόδρα.
theological_decisions:
- issue: Определённость выражения τοῖς ἁμαρτωλοῖς
  choice: Передать как «грешникам», отметив возможную определённость в сноске
  alternative: «этим грешникам» или «тем грешникам»
  rationale: Русский язык не имеет артикля. Указательное местоимение могло бы необоснованно уточнить референцию, тогда как сноска сохраняет возможный групповой смысл без навязывания исторической идентификации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Параллелизм двух оборотов «по их…» и союз «и» сохранены; местоимение «Ты» написано с прописной буквы как обращение к Богу.
