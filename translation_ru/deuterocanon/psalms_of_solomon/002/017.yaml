  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: ὅτι отражено союзом «ибо», ἀπέδωκας — судебно-воздаяющим «воздал», а оба оборота с κατά сохранены как «по их…». Союз «и» перед δεύτεым параллельным оборотом присутствует. Усиление σφόδρα передано словом «чрезвычайно», а πονηράς — «злым».'
