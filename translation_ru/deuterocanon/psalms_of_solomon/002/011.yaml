  text: For no man has done on it what they did[a][b].
translation:
  language: ru
  text: Ибо ни один человек не совершил на ней[a] того, что совершили они.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть на земле, упомянутой в предыдущем стихе.
    reason: referent_clarification
  - marker: b
    text: 'Буквально возможно также: «не каждый человек…», однако в данном обобщении отрицание естественно понимать как «ни один человек…».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предыдущей мысли; «ибо» сохраняет причинную связь и достоинство поэтической речи.
- source_word: οὐκ ... πᾶς ἄνθρωπος
  choice: ни один человек не
  rationale: В данном отрицательном обобщении сочетание естественно передаётся по-русски универсальным отрицанием; слово ἄνθρωπος означает человека в общем смысле.
- source_word: ἐποίησεν
  choice: совершил
  rationale: Аорист обозначает завершённое действие; «совершил» естественно сочетается с тяжестью описываемых поступков и не добавляет отсутствующего в греческом объектного уточнения.
- source_word: ἐπ’ αὐτῆς
  choice: на ней
  rationale: Местоимение женского рода отсылает к ἡ γῆ («земля») в предыдущем стихе, поэтому выражение имеет пространственный смысл, а не значение действия против Иерусалима.
- source_word: ὅσα ἐποίησαν
  choice: того, что совершили они
  rationale: Передаёт соотносительно-сравнительный смысл ὅσα и сохраняет выразительное противопоставление одного человека группе, обозначенной формой множественного числа.
