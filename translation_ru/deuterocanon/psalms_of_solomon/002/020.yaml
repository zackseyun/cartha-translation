  source_fidelity: Перевод верно следует контекстуально обоснованному пониманию спорной формы συνείδισαν как «поносили / оскорбляли», а не «увидели». Оборот «когда его попирали» естественно передаёт ἐν καταπατήσει, не добавляя деятеля попрания. «Низвергли» уместно передаёт κατέσπασεν; русское множественное число необходимо для согласования с «народы», тогда как греческое единственное число нормально при среднем роде множественного числа ἔθνη. Образы «великолепие» и «престол славы» сохранены.
