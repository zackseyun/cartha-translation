  text: For the nations insulted Jerusalem in her trampling[c][b][a]; they pulled her splendor down from the throne of glory.
translation:
  language: ru
  text: Ибо народы поносили Иерусалим, когда его попирали[a]; они низвергли его великолепие[b] с престола славы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в его попрании»; возможный перевод: «во время его попрания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его красоту».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «со славного престола».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνείδισαν
  choice: поносили
  rationale: По контексту и текстологической истории форма понимается в значении «поносить, оскорблять», а не как форма глагола «видеть». «Поносили» естественно передаёт публичное унижение Иерусалима и сохраняет возвышенный регистр.
- source_word: ἐν καταπατήσει
  choice: когда его попирали
  rationale: Предложная конструкция обозначает положение Иерусалима во время попрания. Придаточное предложение естественно по-русски передаёт этот образ, не называя деятеля.
- source_word: κατέσπασεν
  choice: низвергли
  rationale: Глагол выражает сильное движение вниз. Единственное число в греческом допустимо при подлежащем среднего рода во множественном числе ἔθνη; в русском согласование передаётся множественным числом.
- source_word: τὸ κάλλος αὐτῆς
  choice: его великолепие
  rationale: κάλλος может обозначать красоту или великолепие; в образе Иерусалима на престоле «великолепие» лучше передаёт его видимое достоинство и славу. Местоимение согласовано с грамматическим родом русского названия «Иерусалим».
- source_word: ἀπὸ θρόνου δόξης
  choice: с престола славы
  rationale: Сохранена генитивная конструкция оригинала и возвышенный образ прежнего почётного положения Иерусалима.
