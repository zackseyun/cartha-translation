  terminology: Название «Иерусалим» передано последовательно. «Престол славы» сохраняет высокий образный регистр оригинала без конфессионального истолкования. Сноски корректно отмечают переводческие альтернативы для ἐν καταπατήσει, κάλλος и конструкции ἀπὸ θρόνου δόξης; их якоря стоят на соответствующих элементах.
