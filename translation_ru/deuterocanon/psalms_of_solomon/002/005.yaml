lexical_decisions:
- source_word: ἐξουδενώθη
  choice: было презрено
  rationale: Пассивная форма передаёт отношение к чему-либо как к ничтожному, то есть презрение. Средний род «оно» сохраняет связь с предшествующим предметом речи и не создаёт ошибочной отсылки к мужчине.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: пред Богом
  rationale: Прямое и естественное соответствие греческому обороту, обозначающему Божье присутствие или Божью оценку.
- source_word: ἠτιμώθη
  choice: обесчещено
  rationale: Глагол обозначает лишение чести и позор; «обесчещено» близко передаёт его значение и поддерживает параллелизм стиха.
- source_word: ἕως εἰς τέλος
  choice: до конца
  rationale: Буквально сохраняет временную или предельную формулировку греческого текста, не сводя её безоговорочно к усилительному значению «совершенно».
theological_decisions:
- issue: Невыраженное подлежащее глаголов среднего рода
  choice: Оно
  alternative: Он
  rationale: Форма русского среднего рода отражает вероятную отсылку к предмету речи из ближайшего контекста — святилищу/жертвеннику или великолепию славы, — а не к грешнику-мужчине; сам греческий стих подлежащего явно не называет.
- issue: Смысл ἕως εἰς τέλος
  choice: до конца
  alternative: совершенно, окончательно
  rationale: Сохранена подлинная неоднозначность между продолжительностью/пределом и усилением степени бесчестия.
translation_notes:
  register: Современный литературный русский язык с достоинством и близостью к греческому синтаксису. Союз «и» естественно связывает параллельные пассивные сказуемые; неоднозначность заключительной фразы вынесена в примечание.
