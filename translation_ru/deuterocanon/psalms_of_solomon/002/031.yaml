review_pass:
  verdict: approve
  source_fidelity: «Тело его» точно передаёт σῶμα без неоправданного усиления до «труп». «Носимое по волнам» адекватно сохраняет страдательный характер διαφερόμενον и пространственное ἐπὶ κυμάτων. «В великом поругании» передаёт публичное унижение и надругательство, заключённые в ἐν ὕβρει πολλῇ, не сужая смысл до одного конкретного вида насилия. «Некому было похоронить его» верно выражает οὐκ ἦν ὁ θάπτων — отсутствие того, кто мог бы совершить погребение.
  naturalness: Фраза намеренно сохраняет поэтическую, фрагментарную структуру оригинала и естественно читается в умеренно возвышенном библейском регистре. Сочетание «в великом поругании» литературно и понятно; более разговорная замена не требуется.
  terminology: Термины «тело», «поругание» и «похоронить» уместны, современны и не вносят конфессионального толкования. Сноска стоит непосредственно после выражения, к которому относится, и даёт допустимые смысловые альтернативы.
