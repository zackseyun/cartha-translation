lexical_decisions:
- source_word: σῶμα
  choice: тело
  rationale: Обычное значение греческого слова; контекст ясно указывает на смерть, поэтому нет необходимости усиливать текст словом «труп».
- source_word: διαφερόμενον
  choice: носимое
  rationale: Страдательное причастие передаёт движение под действием внешней силы, возможно из стороны в сторону; «носимое по волнам» звучит естественно и не уточняет характер движения сверх греческого текста.
- source_word: ἐπὶ κυμάτων
  choice: по волнам
  rationale: Естественно передаёт движение тела на поверхности волн; сочетание связано с причастием «носимое».
- source_word: ἐν ὕβρει πολλῇ
  choice: в великом поругании
  rationale: ὕβρις здесь выражает тяжкое оскорбление, бесчестье и надругательство над умершим. «Поругание» сохраняет смысловую ёмкость и достоинство регистра.
- source_word: οὐκ ἦν ὁ θάπτων
  choice: некому было похоронить его
  rationale: Идиоматичный русский эквивалент конструкции, обозначающей отсутствие человека, который совершил бы погребение.
