  yaml_path: translation/deuterocanon/psalms_of_solomon/002/014.yaml
  text: Just as they themselves used to do[a], they displayed their iniquities before the sun, and the daughters of Jerusalem were profane according to your judgment[d][c][b],
translation:
  language: ru
  text: Как поступали они сами, так выставили напоказ свои беззакония при свете солнца[a], и дочери Иерусалима были осквернены по Твоему приговору[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед солнцем», то есть открыто, у всех на виду.'
