  - marker: b
    text: 'Или: «были нечисты согласно Твоему суду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὰ ἐποίουν αὐτοί
  choice: Как поступали они сами, так
  rationale: Сохраняет сравнительную конструкцию καθά и эмфатическое αὐτοί, не добавляя спорного значения многократности.
- source_word: παρεδειγμάτισαν
  choice: выставили напоказ
  rationale: Передаёт идею публичного выставления и позора естественным современным русским выражением.
- source_word: ἀδικίας αὐτῶν
  choice: свои беззакония
  rationale: Множественное число обозначает конкретные нечестивые деяния; «беззакония» сохраняет нравственно-религиозную весомость слова.
- source_word: ἀπέναντι τοῦ ἡλίου
  choice: при свете солнца
  rationale: Близко к буквальному образу и одновременно понятно как указание на открытость происходившего.
- source_word: βέβηλοι
  choice: осквернены
  rationale: Контекстуально передаёт утрату святости и ритуально-нравственное осквернение; грамматическая форма допускает понимание состояния или результата.
- source_word: κατὰ τὸ κρίμα σου
  choice: по Твоему приговору
  rationale: «Приговор» естественно выражает судебный смысл κρίμα и сохраняет связь состояния дочерей Иерусалима с Божьим решением.
theological_decisions:
- issue: Значение βέβηλοι в связи с κατὰ τὸ κρίμα σου
  choice: были осквернены по Твоему приговору
  alternative: были нечисты согласно Твоему суду / были поруганы по Твоему приговору
  rationale: Выбранный вариант сохраняет сакральную противоположность святого и осквернённого, но не уточняет, означает ли приговор признание их состояния или действие, приведшее к нему.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвенной речи. Местоимение, обращённое к Богу, написано с прописной буквы. Синтаксический параллелизм первой части сохранён; неоднозначность βέβηλοι и судебного оборота отмечена в сноске.
