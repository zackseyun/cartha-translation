review_pass:
  verdict: approve
  source_fidelity: Перевод точно передаёт греческий текст. «Я признаю Тебя праведным» адекватно выражает δικαιώσω при Боге как прямом дополнении, не создавая впечатления, будто говорящий делает Бога праведным. Будущее время сохранено. «В прямоте сердца» соответствует ἐν εὐθύτητι καρδίας, а «в Твоих судах — Твоя праведность» сохраняет множественное число κρίμασιν, смысловую связь с δικαιοσύνη и повторное обращение «Боже».
  naturalness: Текст звучит как современный литературный русский с уместно возвышенным псалмическим оттенком. Оборот «в прямоте сердца» несколько книжный, но понятен, естественен в данном регистре и близок образности оригинала. Тире во второй части удачно передаёт русскую именную конструкцию.
  terminology: «Праведным» и «праведность» последовательно передают судебно-нравственную лексику δικαιόω/δικαιοσύνη. «Суды» является традиционным и ясным переводом κρίματα в отношении Божьих судебных решений. Сноски корректно отмечают допустимые альтернативы, не навязывая богословской интерпретации.
