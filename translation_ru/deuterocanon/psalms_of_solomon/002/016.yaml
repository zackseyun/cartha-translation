  yaml_path: translation/deuterocanon/psalms_of_solomon/002/016.yaml
  text: I will declare you righteous[a], O God, with an upright heart; for in your judgments is your righteousness[b], O God.
translation:
  language: ru
  text: Я признаю Тебя праведным[a], Боже, в прямоте сердца, потому что в Твоих судах — Твоя праведность[b], Боже.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оправдаю Тебя»; или: «подтвержу Твою правоту».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώσω
  choice: признаю Тебя праведным
  rationale: Будущее время, действительный залог, первое лицо единственного числа. Поскольку объектом является Бог, речь не о том, что говорящий делает Бога праведным, а о признании и провозглашении Его правоты. Этот перевод сохраняет судебный оттенок глагола и при этом естественно звучит по-русски.
- source_word: ἐν εὐθύτητι καρδίας
  choice: в прямоте сердца
  rationale: Формулировка близко передаёт образ внутренней прямоты и нравственной цельности, сохраняя при этом возвышенный, но понятный русский регистр.
- source_word: κρίμασιν
  choice: судах
  rationale: Множественное число обозначает Божьи судебные решения или действия суда. «В Твоих судах» — прямой и естественный перевод.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Слово характеризует нравственную правоту Бога, явленную в Его судах. «Справедливость» также возможна по контексту и отмечена в сноске.
theological_decisions:
- issue: Смысл δικαιώσω при Боге как прямом дополнении
  choice: признаю Тебя праведным
  alternative: оправдаю Тебя; подтвержу Твою правоту
  rationale: Выбранная формулировка не предполагает, будто человек наделяет Бога праведностью, но сохраняет смысл признания или провозглашения Его правоты, не устраняя судебного оттенка исходного глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Повтор обращения «Боже» и синтаксический параллелизм оригинала сохранены.
