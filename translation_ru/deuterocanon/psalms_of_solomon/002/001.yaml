  yaml_path: translation/deuterocanon/psalms_of_solomon/002/001.yaml
  text: When the sinner acted arrogantly[a], he tore down fortified walls with battering rams[b], and you did not stop him.
translation:
  language: ru
  text: Когда грешник проявлял высокомерие, он таранами разрушал укреплённые стены, а Ты не остановил его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν τῷ ὑπερηφανεύεσθαι
  choice: Когда ... возгордился
  rationale: Конструкция ἐν τῷ с инфинитивом имеет здесь временное значение. «Возгордился» естественно передаёт высокомерное самовозвышение, выраженное глаголом ὑπερηφανεύομαι.
- source_word: τὸν ἁμαρτωλόν
  choice: грешник
  rationale: Сохранены определённость и единственное число греческого выражения без усиления до более толковательного «нечестивец».
- source_word: ἐν κριοῖς
  choice: таранами
  rationale: Буквально κριοί означает «бараны», но в контексте разрушения крепостных стен обозначает осадные тараны. Оборот отнесён к κατέβαλλε, как подсказывают контекст и наиболее естественный синтаксический разбор.
- source_word: κατέβαλλε
  choice: сокрушал
  rationale: Несовершенный вид русского глагола передаёт длительное или разворачивающееся действие греческого имперфекта; «сокрушал» уместно для разрушения укреплённых стен.
- source_word: τείχη ὀχυρά
  choice: укреплённые стены
  rationale: Так передаётся военное значение ὀχυρά применительно к стенам, без архаизма и без потери смысла.
- source_word: οὐκ ἐκώλυας
  choice: Ты не остановил его
  rationale: Местоименное дополнение, подразумеваемое по контексту, восполнено ради естественности русского языка. Прописная буква отражает обращение к Богу, не добавляя к тексту отдельного титула.
theological_decisions:
- issue: Адресат второго лица в οὐκ ἐκώλυας
  choice: «Ты» с прописной буквы
  alternative: «ты» со строчной буквы
  rationale: Контекст псалма подразумевает обращение к Богу; прописная буква соответствует достоинству современного русского библейского регистра, хотя в самом греческом письме это различие грамматически не маркировано.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Синтаксис оставлен ясным и небуквалистским; несовершенный вид «сокрушал» сохраняет аспект греческого имперфекта. Подлинная лексическая образность κριοῖς отмечена в сноске.
