  yaml_path: translation/deuterocanon/psalms_of_solomon/002/024.yaml
  text: And I saw[a], and I entreated the face of the Lord and said, “Enough, Lord[d][c][b], of your hand weighing heavily on Israel by the attack of the nations.”
translation:
  language: ru
  text: 'И я увидел и взмолился пред лицом Господа[a] и сказал: «Довольно, Господи,[b] того, что руки Твои[c] тяжело лежат на Израиле при нашествии народов[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «умолял лицо Господа»; по смыслу также возможно: «обратился с мольбой к Господу».'
    reason: Сохранён семитский оборот с «лицом» Господа, который может обозначать Его присутствие или благоволение.
  - marker: b
    text: 'Или: «Сочти достаточным, Господи»; возможно также: «Пусть будет достаточно, Господи».'
    reason: Повелительное Ἱκάνωσον допускает более буквальное выражение достаточности, чем краткое «Довольно».
  - marker: c
    text: 'Буквально во множественном числе: «руки Твои». Это библейский образ тяжести Божьего воздействия или суда.'
    reason: Сохранены грамматическое число и культурно-библейская метафора исходного текста.
  - marker: d
    text: 'Или: «через нападение народов»; возможно также: «при наведении народов».'
    reason: Существительное ἐπαγωγή может обозначать как наведение или приведение, так и нападение либо нашествие; предлог ἐν допускает как обстоятельственный, так и инструментальный оттенок.
lexical_decisions:
- source_word: ἐδεήθην τοῦ προσώπου Κυρίου
  choice: взмолился пред лицом Господа
  rationale: Глагол δέομαι обозначает настойчивую мольбу, а выражение τοῦ προσώπου Κυρίου буквально сохраняет семитский образ лица, то есть присутствия Господа. Русское «пред лицом Господа» понятно в библейском регистре и не превращает «лицо» в прямой объект мольбы.
- source_word: Ἱκάνωσον
  choice: Довольно
  rationale: Повелительная форма выражает просьбу признать меру страдания достаточной и прекратить его. Краткое «Довольно» естественно передаёт настойчивость обращения, а более буквальные оттенки отмечены в сноске.
- source_word: τοῦ βαρύνεσθαι χεῖράς σου ἐπʼ Ἰσραήλ
  choice: того, что руки Твои тяготеют над Израилем
  rationale: Сохранены множественное число χεῖράς и библейский образ тяжести Божьих рук как суда или давления. Оборот с «того, что» естественно связывает инфинитивную конструкцию с возгласом «Довольно».
- source_word: ἐν ἐπαγωγῇ ἐθνῶν
  choice: через нашествие народов
  rationale: Предлог ἐν здесь допускает инструментальное понимание, а ἐπαγωγή может обозначать наведение, наступление или вторжение. «Через нашествие народов» сохраняет участие народов как орудия бедствия, не уточняя его сверх греческого текста.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и современно понятная русская форма прямого обращения к Богу Израиля; она соответствует κύριος без привнесения более узкого оттенка «господин» или «хозяин».
theological_decisions:
- issue: Образ Божьих рук, тяготеющих над Израилем
  choice: Сохранить образ во множественном числе без пояснения причины суда в основном тексте
  alternative: 'Передать истолковательно: «прекрати карать Израиль»'
  rationale: Греческий текст говорит образно и не называет действие прямо наказанием. Буквенный образ сохраняет богословское напряжение между Божьим действием и нашествием народов.
- issue: Значение Ἱκάνωσον в обращении к Богу
  choice: 'Передать как просьбу о прекращении: «Довольно»'
  alternative: «Удовольствуйся, Господи» или «сочти это достаточным»
  rationale: Контекст ясно указывает на мольбу прекратить бедствие, однако буквальные варианты могут сильнее подразумевать удовлетворение Бога страданием. Основной перевод избегает ненужного догматического усиления, а неоднозначность сохраняется в сноске.
- issue: Роль народов в бедствии Израиля
  choice: «через нашествие народов»
  alternative: «при нашествии народов» или «при наведении народов»
  rationale: Инструментальное «через» согласуется с ἐν и ближайшим контекстом, но не утверждает подробно, каким образом Божье действие соотносится с человеческой ответственностью нападающих народов.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Оборот «пред лицом Господа» намеренно сохраняет исходный семитизм, тогда как остальной синтаксис сделан естественным для современного читателя. Местоимения в обращении к Богу написаны с прописной буквы согласно распространённой русской библейской издательской норме.
