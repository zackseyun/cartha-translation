lexical_decisions:
- source_word: πονηρὰ
  choice: зло
  rationale: Широкое нравственное понятие передано кратко и весомо, без неоправданного сужения до конкретного вида проступка.
- source_word: ἐποίησαν
  choice: совершили
  rationale: В сочетании со словом «зло» это естественная современная русская формулировка, соответствующая греческому «сделали».
- source_word: εἰς ἅπαξ
  choice: разом
  rationale: «Разом» сохраняет возможные оттенки одновременности, совместности и единократной решительности; ближайший контекст поддерживает понимание «все вместе», тогда как сама греческая фраза допускает также «раз и навсегда».
- source_word: τοῦ μὴ ἀκοῦσαι
  choice: не желая слушать
  rationale: Передаёт отрицательное слышание как намеренную позицию и звучит естественно по-русски, не устраняя полностью возможный целевой или результативный оттенок конструкции.
