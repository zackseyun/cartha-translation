lexical_decisions:
- source_word: ἐποίησαν
  choice: поступили
  rationale: Глагол ποιέω буквально означает «делать», однако при указании побуждений по-русски естественнее «поступили». Дополнение не вводится, поскольку мысль продолжается в следующем стихе.
- source_word: ζήλῳ
  choice: рвения
  rationale: «Рвение» передаёт деятельную, внешне принципиальную устремлённость и естественно противопоставляется личному желанию. Возможное значение «ревность» сохранено в примечании.
- source_word: ἐπιθυμίᾳ
  choice: желанию
  rationale: Нейтрально-широкое «желание» не сужает смысл до сексуальной страсти, но в контексте сохраняет отрицательную оценку своекорыстного побуждения.
- source_word: ψυχῆς
  choice: своей души
  rationale: Так сохраняются и буквальный образ души, и принадлежность желания действующим лицам; формулировка соответствует возвышенному псалмическому регистру.
