lexical_decisions:
- source_word: γνώσεται
  choice: узнает
  rationale: Будущая форма γινώσκω передаёт наступающее познание или признание; «узнает» прямо и естественно сохраняет этот смысл, не уточняя его сверх текста.
- source_word: ἡ γῆ
  choice: земля
  rationale: γῆ может означать «земля» или «страна»; широкий контекст всех Божьих судов поддерживает универсальное «земля».
- source_word: τὰ κρίματά σου
  choice: Твои суды
  rationale: κρίματα обозначает судебные решения или акты суда; «суды» сохраняет юридический и богословский диапазон слова без лишнего пояснения.
- source_word: πάντα
  choice: все
  rationale: πάντα относится ко всей именной группе и указывает на полноту Божьих праведных судов.
- source_word: τὰ δίκαια
  choice: праведные
  rationale: δίκαια характеризует суды как соответствующие правде и справедливости; «праведные» сохраняет нравственный оттенок, тогда как «справедливые» остаётся естественной альтернативой.
- source_word: ὁ θεός
  choice: Боже
  rationale: Именительный с артиклем употреблён как обращение; русский звательный эквивалент «Боже» естественно передаёт молитвенный тон.
