base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/040.yaml
  text: For the Lord is kind to those who call on him with endurance[a], to act according to his mercy toward his holy ones[c][b], to stand continually before him in strength.
translation:
  language: ru
  text: Ибо благ Господь к тем, кто призывает Его с терпением и стойкостью[a], по Своей милости являя её Своим благочестивым[b], — чтобы всегда стоять перед Ним в силе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с терпеливой стойкостью». Греческое слово может обозначать терпение, стойкость и постоянство в испытаниях.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с преданными Ему»; возможен также более буквальный перевод: «со святыми Своими».'
    reason: lexical_alternative
  - marker: c
    text: 'Греческая фраза синтаксически сжата: «…явить по Своей милости [её] Своим благочестивым, всегда стоять перед Ним в силе». В русском переводе последнее выражение передано как относящееся к благочестивым; связь и субъект инфинитивов в греческом тексте сформулированы менее явно.'
    reason: source_ambiguity
lexical_decisions:
- source_word: χρηστὸς
  choice: благ
  rationale: Передаёт доброту и благосклонность Господа, сохраняя достоинство поэтической речи; вариант «добр» возможен, но несколько слабее выражает благодетельность.
- source_word: ἐπικαλουμένοις αὐτὸν
  choice: к тем, кто призывает Его
  rationale: Глагол обозначает молитвенное обращение и взывание к Богу; «призывает» естественно передаёт этот религиозный смысл.
- source_word: ἐν ὑπομονῇ
  choice: с терпеливой стойкостью
  rationale: Сочетание охватывает как терпение, так и упорное постоянство под испытанием, не сводя ὑπομονή к пассивному ожиданию.
- source_word: ποιῆσαι κατὰ τὸ ἔλεος αὐτοῦ
  choice: Он поступает по Своей милости
  rationale: Греческий инфинитивный оборот синтаксически сжат. Личная форма делает русский текст понятным, сохраняя мысль о действии Господа, определяемом Его милостью.
- source_word: τοῖς ὁσίοις αὐτοῦ
  choice: с преданными Ему
  rationale: ὅσιοι здесь характеризует людей как благочестивых и верных Богу; «преданные Ему» отличает это слово от обычного обозначения «святых» и естественно звучит по-русски.
- source_word: διὰ παντὸς
  choice: всегда
  rationale: Кратко и естественно передаёт непрерывность или постоянство.
- source_word: παρεστᾶναι … ἐν ἰσχύι
  choice: чтобы они … стояли пред Ним в силе
  rationale: Сохраняет образ устойчивого пребывания перед Богом и оставляет источник силы неуточнённым.
theological_decisions:
- issue: Сжатая последовательность инфинитивов ποιῆσαι и παρεστᾶναι
  choice: 'Первый инфинитив раскрыт как действие Господа, а второй — как цель или результат для преданных Ему: «чтобы они… стояли».'
  alternative: Формально возможно сохранить оба инфинитива либо отнести παρεστᾶναι к Господу в значении Его постоянного присутствия рядом.
  rationale: Такое прочтение лучше всего связывает милостивое действие Господа с укреплённым стоянием Его верных перед Ним. Однако греческий синтаксис допускает неоднозначность, поэтому она отмечена в сноске, а не скрыта.
- issue: Значение ὅσιοι
  choice: «преданные Ему»
  alternative: «благочестивые Его» или «святые Его»
  rationale: В Псалмах Соломона слово может обозначать особую общность благочестивых и верных Богу; перевод не должен без необходимости отождествлять его с ἅγιοι, обычно передаваемым как «святые».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Форма «пред Ним» сохраняет достоинство сакральной поэзии, оставаясь понятной. Синтаксис слегка распрямлён ради ясности, а подлинная неоднозначность греческих инфинитивов вынесена в сноску.
