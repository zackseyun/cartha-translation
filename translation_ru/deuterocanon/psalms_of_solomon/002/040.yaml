  source_fidelity: 'Основной смысл передан верно: χρηστός относится к благости Господа, ἐπικαλεῖσθαι — к молитвенному призыванию, а ὑπομονή — к стойкому терпению. Однако «чтобы они… стояли» грамматически закрепляет один из возможных способов соотнести второй инфинитив с «благочестивыми», тогда как сжатая греческая конструкция не выражает целевую связь столь явно. Кроме того, «преданные Ему» несколько свободно передаёт τοῖς ὁσίοις αὐτοῦ; «благочестивые Свои» точнее сохраняет религиозно-нравственный оттенок ὅσιοι и не смешивает его с ἅγιοι («святые»).'
  naturalness: Текст в целом литературен и уместно псалмичен. Сочетание «с терпеливой стойкостью» понятно, но тяжеловесно; «с терпением и стойкостью» естественнее, хотя несколько раскрывает единое греческое понятие. Формула «поступает … с преданными Ему» возможна, но «являет … милость Своим благочестивым» более естественна по-русски.
  terminology: «Благ» и «призывает Его» удачны для умеренно возвышенного регистра. Для ὅσιοι предпочтительно «благочестивые Свои»; это передаёт значение «pious/devout» и не навязывает тождества со «святыми». «Пред Ним» допустимо, но «перед Ним» несколько нейтральнее для современного литературного русского.
