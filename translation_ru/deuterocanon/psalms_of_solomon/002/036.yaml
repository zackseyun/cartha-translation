lexical_decisions:
- source_word: ἴδετε
  choice: узрите
  rationale: Повелительная форма призывает влиятельных людей распознать совершившийся суд; «узрите» сохраняет возвышенный поэтический регистр и звучит естественно в данном обращении.
- source_word: μεγιστᾶνες
  choice: вельможи
  rationale: Слово обозначает высокопоставленных, влиятельных людей; «вельможи» передаёт и общественный статус, и торжественный характер обращения.
- source_word: κρίμα
  choice: суд
  rationale: «Суд» достаточно широко передаёт как судебное решение Господа, так и его осуществление, не сужая значение до одного лишь приговора.
- source_word: κυρίου
  choice: Господа
  rationale: κύριος употреблено как божественный титул; традиционное «Господь» уместно в современном литературном библейском русском.
- source_word: μέγας βασιλεὺς καὶ δίκαιος
  choice: великий и праведный Царь
  rationale: Оба определения естественно относятся к βασιλεύς; прописная буква подчёркивает употребление царского титула применительно к Господу.
- source_word: κρίνων τὴν ὑπʼ οὐρανόν
  choice: судящий всё, что под небом
  rationale: 'Греческое выражение эллиптично: существительное после артикля подразумевается. Русское «всё, что под небом» естественно обозначает всю поднебесную область, при этом добавленное «всё» является экспликацией подразумеваемой совокупности, а не отдельного греческого слова.'
theological_decisions:
- issue: Связь ὅτι с предшествующим призывом увидеть суд Господа
  choice: двоеточие и самостоятельное утверждение «Он — великий и праведный Царь»
  alternative: «суд Господа, ибо Он — великий и праведный Царь» или «суд Господа, что Он — великий и праведный Царь»
  rationale: ὅτι может вводить основание или содержание. Двоеточие сохраняет смысловую открытость и избегает неестественного русского оборота, не вынуждая однозначно выбирать между «ибо» и «что».
- issue: Подразумеваемое дополнение в τὴν ὑπʼ οὐρανόν
  choice: всё, что под небом
  alternative: землю под небом; поднебесный мир
  rationale: В греческом существительное опущено. Выбранный вариант не вводит явно ни «землю», ни «мир», но передаёт универсальный охват царского суда; эллиптичность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим звучанием. «Узрите» и «вельможи» поддерживают возвышенный регистр псалма, не делая синтаксис архаичным. Двоеточие после «суд Господа» обеспечивает ясность и сохраняет неоднозначность ὅτι.
