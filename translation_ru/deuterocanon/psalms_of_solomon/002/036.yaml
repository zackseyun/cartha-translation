  text: And now see[a], you nobles of the earth, the judgment of the Lord, that he is a great and righteous king[b], judging what is under heaven.
translation:
  language: ru
  text: 'И теперь взгляните, вельможи земли[a], на суд Господа: Он — великий и праведный Царь, судящий то, что под небом[b].'
  philosophy: optimal-equivalence
  footnotes:
