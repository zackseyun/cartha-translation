  yaml_path: translation/deuterocanon/psalms_of_solomon/002/013.yaml
  text: They made the sons of Jerusalem a mockery[a], like prostitutes within her; everyone passing by would enter in broad daylight[c][b]; they mocked them with their lawless deeds.
translation:
  language: ru
  text: Они выставили сынов Иерусалима на посмешище, словно блудниц в Иерусалиме[a]; всякий проходивший входил средь бела дня[b]; они глумились над их беззакониями[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «вместо блудниц в Иерусалиме»; оборот ἀντὶ πορνῶν допускает как значение замещения, так и контекстуально сравнительный смысл унижения.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «перед солнцем», то есть открыто, при дневном свете.'
    reason: lexical_alternative
  - marker: c
    text: Заключительные слова можно также понять как «глумились своими беззакониями»; греческая конструкция и отсылка местоимения допускают неоднозначность.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησαν … εἰς ἐμπαιγμόν
  choice: выставили … на посмешище
  rationale: Сочетание буквально означает, что кого-либо поставили или сделали предметом осмеяния; русское «выставили на посмешище» естественно передаёт и действие, и публичное унижение.
- source_word: τοὺς υἱοὺς Ἱερουσαλήμ
  choice: сынов Иерусалима
  rationale: Сохраняется явно мужской род греческого выражения и его родственный образ.
- source_word: ἀντὶ πορνῶν
  choice: словно блудниц
  rationale: В контексте унижения сравнительный перевод звучит естественно, однако более буквальное «вместо блудниц» сохранено в примечании как реальная лексическая возможность.
- source_word: ἐν αὐτῇ
  choice: в самом городе
  rationale: Женское местоимение относится к Иерусалиму как к городу; такая передача избегает неестественного рассогласования с русским мужским названием «Иерусалим».
- source_word: πᾶς ὁ πορευόμενος εἰσεπορεύετο
  choice: всякий проходивший входил
  rationale: Повтор глаголов движения передан сжато, а имперфект «входил» сохраняет оттенок повторявшегося или обычного действия.
- source_word: κατέναντι τοῦ ἡλίου
  choice: средь бела дня
  rationale: Буквальный образ «перед солнцем» обозначает открытое действие при дневном свете; русский оборот сохраняет его выразительность без двойного перевода.
- source_word: ἐνέπαιζον ταῖς ἀνομίαις αὐτῶν
  choice: глумились над их беззакониями
  rationale: Дательный падеж после ἐνέπαιζον естественно допускает объект насмешки; местоименная отсылка остаётся в тексте неуточнённой, как и в греческом.
theological_decisions:
- issue: Референт местоимения αὐτῶν в заключительной фразе
  choice: сохранить неопределённое «их»
  alternative: уточнить как «своими беззаконными делами» или добавить объект «над ними»
  rationale: Греческая форма сама по себе не устраняет неоднозначность референта; уточнение могло бы без достаточных оснований изменить распределение виновности и смысл сцены.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Выставили на посмешище» и «средь бела дня» ясны обычному читателю и сохраняют публичный характер унижения; «блудницы» и «беззакония» поддерживают библейский регистр без конфессионального уточнения.
