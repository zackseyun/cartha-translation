  yaml_path: translation/deuterocanon/psalms_of_solomon/002/030.yaml
  text: And I did not delay until God showed me his insolence[a], pierced through on the mountains of Egypt[d][c][b], utterly despised on land and sea.
translation:
  language: ru
  text: 'И недолго мне пришлось ждать, пока Бог не показал мне его высокомерие[a]: сам он был пронзён на горах Египта[b] и унижен ниже самого ничтожного на земле и на море[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его дерзость», «его бесчинство». Греческое ὕβρις может обозначать надменность, проявившуюся в оскорбительном или возмутительном поведении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на горах Египта». Причастие «пронзённый» в греческом тексте стоит в мужском роде и относится к самому человеку, а не к его «высокомерию».'
    reason: grammar_and_literal_rendering
  - marker: c
    text: 'Буквально греческая фраза сжата: «униженного более [или ниже] самого малого на земле и на море».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐχρόνισα
  choice: недолго мне пришлось ждать
  rationale: В контексте речь, вероятнее всего, о том, что ответ Бога не заставил говорящего долго ждать, а не о решении самого говорящего не медлить. Русская формулировка передаёт этот смысл естественно.
- source_word: ὕβριν
  choice: дерзость
  rationale: Слово обозначает высокомерие, переходящее в оскорбительное и вызывающее поведение. «Дерзость» сохраняет как гордыню, так и оттенок возмутительного поступка.
- source_word: ἐκκενεκεντημένον
  choice: сам он был пронзён
  rationale: Причастие мужского рода относится не к «дерзости», а к самому притеснителю. Явно выраженное «сам он» устраняет ложную синтаксическую связь, не уточняя оружие или способ смерти.
- source_word: ἐπὶ τῶν ὀρέων Αἰγύπτου
  choice: на горах Египта
  rationale: Прямой перевод сохраняет неожиданное, но ясное указание греческого текста на горы, не заменяя его более общим «в горной местности».
- source_word: ὑπὲρ ἐλάχιστον ἐξουδενωμένον
  choice: унижен ниже самого ничтожного
  rationale: Греческое выражение сжато и сравнительно по форме; русский перевод сохраняет предельную степень унижения и делает подразумеваемое сравнение понятным.
theological_decisions:
- issue: Связь между «дерзостью» и причастиями мужского рода
  choice: 'После двоеточия прямо назван сам человек: «сам он был пронзён… и унижен».'
  alternative: 'Сохранить буквальную цепочку: «его дерзость, пронзённого… униженного…».'
  rationale: В греческом ἐκκενεκεντημένον и ἐξουδενωμένον стоят в мужском роде и не могут определять женское ὕβριν. Уточнение субъекта сохраняет смысл текста и не превращает «дерзость» в образно пронзённую сущность.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Синтаксис слегка развёрнут ради ясности рода греческих причастий; необычный образ «гор Египта» сохранён без сглаживания.
