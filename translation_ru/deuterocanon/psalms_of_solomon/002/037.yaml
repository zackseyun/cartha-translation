  yaml_path: translation/deuterocanon/psalms_of_solomon/002/037.yaml
  text: Bless God[a], you who fear the Lord with understanding, because the mercy of the Lord is upon those who fear him[b], with judgment.
translation:
  language: ru
  text: Благословляйте Бога, боящиеся Господа с разумением, ибо милость Господа — на боящихся Его, с судом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со знанием»; или: «с рассудительностью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Повелительное наклонение множественного числа призывает к непосредственному прославлению Бога; «благословляйте» сохраняет характерный для библейской речи образ, не сводя его к более общему «прославляйте».
- source_word: οἱ φοβούμενοι
  choice: вы, боящиеся
  rationale: Причастный оборот употреблён как обращение к тем, кому адресовано повеление; добавление «вы» делает это обращение ясным по-русски.
- source_word: κύριον / Κυρίου
  choice: Господа
  rationale: Традиционный и точный русский эквивалент κύριος как божественного титула.
- source_word: ἐν ἐπιστήμῃ
  choice: с разумением
  rationale: Передаёт осознанный, исполненный понимания страх перед Господом и звучит естественнее буквального «в знании», не устраняя возможных оттенков знания и рассудительности.
- source_word: ἔλεος
  choice: милость
  rationale: Прямой и укоренённый в русской библейской речи эквивалент, соответствующий молитвенно-хвалебному регистру стиха.
- source_word: μετὰ κρίματος
  choice: вместе с судом
  rationale: Сохраняет сжатое соположение милости и суда в греческом тексте, не заменяя κρίμα истолковывающим словом «справедливость».
theological_decisions:
- issue: Соотношение милости и суда в μετὰ κρίματος
  choice: 'Сохранить сжатое соположение: «милость Господа — на боящихся Его, вместе с судом».'
  alternative: «милость Господа к боящимся Его соединена со справедливостью»
  rationale: Греческая фраза не уточняет, означает ли κρίμα суд, справедливость или судебную меру и как именно оборот связан с милостью. Основной текст сохраняет эту богословскую напряжённость и синтаксическую сжатость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Обращение «вы, боящиеся» сохраняет достоинство и ясность; тире помогает передать конструкцию ἔλεος Κυρίου ἐπὶ без добавления отсутствующего в исходнике глагола.
