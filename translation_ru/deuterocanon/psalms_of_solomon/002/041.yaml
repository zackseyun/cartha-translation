  text: Blessed is the Lord forever in the sight of his servants.
translation:
  language: ru
  text: Благословен Господь вовеки перед рабами Своими.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии рабов Своих».'
    reason: ἐνώπιον может обозначать как положение «перед» кем-либо, так и пребывание «в присутствии» кого-либо.
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Благословен
  rationale: Предикативное прилагательное передаёт утвердительную форму славословия, не превращая её в пожелание «да будет благословен».
- source_word: Κύριος
  choice: Господь
  rationale: Обычное и естественное русское соответствие греческому божественному титулу κύριος.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Краткое устойчивое выражение вечной длительности, уместное в славословии и понятное современному читателю.
- source_word: ἐνώπιον
  choice: перед
  rationale: Сохраняет пространственно-реляционное значение «перед лицом, в присутствии», не добавляя толкования о том, каким образом рабы воспринимают славословие.
- source_word: δούλων αὐτοῦ
  choice: рабами Своими
  rationale: «Рабы» сохраняет обычную библейскую характеристику принадлежности и служения Богу; возвратное «Своими» естественно соотносит их с Господом как подлежащим.
theological_decisions:
- issue: Характер славословия
  choice: «Благословен Господь» как утверждение
  alternative: «Да будет благословен Господь» как пожелание
  rationale: Греческий текст содержит предикативное εὐλογητός без частицы или иной формы, явно выражающей пожелание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Вовеки» и «рабы» сохранены как понятные традиционные слова; синтаксис остаётся кратким и торжественным.
