  yaml_path: translation/deuterocanon/psalms_of_solomon/002/007.yaml
  text: He dealt with them according to their sins[b][a], because he abandoned them into the hands of those who prevailed over them.
translation:
  language: ru
  text: Он поступил с ними по их грехам, ибо[a] оставил их в руках тех, кто одерживал над ними верх.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен смысл: «Он поступил с ними по их грехам тем, что оставил их…»'
    reason: Союз ὅτι может вводить не только причину, но и пояснение того, в чём состояло названное действие.
  - marker: b
    text: 'Или: «тех, кто одолевал их»; также возможно: «тех, кто был сильнее их».'
    reason: Причастие κατισχυόντων может подчёркивать как совершаемое одоление, так и превосходство в силе.
lexical_decisions:
- source_word: κατὰ τὰς ἁμαρτίας αὐτῶν
  choice: по их грехам
  rationale: 'Оборот выражает соответствие или меру: случившееся с ними соответствовало их грехам. Формулировка сохраняет судебный оттенок и библейскую лаконичность.'
- source_word: ἐποίησεν αὐτοῖς
  choice: поступил с ними
  rationale: 'Буквально: «сделал им». Русское «поступил с ними» естественно передаёт действие по отношению к ним, не добавляя конкретного вида наказания.'
- source_word: ὅτι
  choice: ибо
  rationale: Союз может иметь причинное либо пояснительно-обосновывающее значение. «Ибо» естественно связывает обе части и не сводит связь исключительно к прямой причинности.
- source_word: ἐγκατέλειπεν
  choice: оставил
  rationale: Глагол означает оставить, покинуть, лишив поддержки. «Оставил» сохраняет значение исходного слова и не подменяет его более узким «предал».
- source_word: εἰς χεῖρας
  choice: в руках
  rationale: Сохранён исходный библейский образ нахождения во власти другого; по-русски после «оставил» естественно «в руках».
- source_word: κατισχυόντων
  choice: тех, кто одерживал над ними верх
  rationale: Причастие обозначает тех, кто пересиливал или одолевал их. Выбранная формулировка передаёт активное превосходство, а не только статическое качество силы.
theological_decisions:
- issue: Логическая связь, вводимая ὅτι
  choice: «ибо» с примечанием о пояснительном прочтении
  alternative: «потому что» или «тем, что»
  rationale: Контекст допускает как обоснование сказанного, так и пояснение того, каким образом Бог поступил с ними по их грехам. Перевод не должен догматически устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены краткость исходной фразы и образ «рук», при этом буквальное «сделал им» заменено естественным русским «поступил с ними».
