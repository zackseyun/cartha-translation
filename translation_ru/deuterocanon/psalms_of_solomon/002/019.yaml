translation:
  language: ru
  text: Ты сделал память о них известной на земле[a]. Бог — праведный судья, и Он не проявит лицеприятия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «Ты сделал известной (или: явил) память о них от земли». Сочетание необычно; «земля» может также означать «страна». Перевод «истребил память о них с земли» соответствует предполагаемому контекстуальному смыслу, но не обычному значению греческого глагола.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не станет дивиться лицу». Это греческая идиома: судья не оказывает предпочтения человеку из-за его личности или положения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδήλωσας
  choice: сделал известной
  rationale: Глагол δηλόω означает «делать известным, являть, обнаруживать». Перевод следует засвидетельствованному греческому тексту, хотя сочетание с последующими словами необычно; значение «истребил» или «удалил» не вносится без рукописного основания.
- source_word: τὸ μνημόσυνον αὐτῶν
  choice: память о них
  rationale: μνημόσυνον может означать память, воспоминание или памятование. «Память о них» естественно по-русски и не требует понимать слово как вещественный памятник.
- source_word: ἀπὸ τῆς γῆς
  choice: от земли
  rationale: Предлог ἀπό передаёт удаление или исходную точку, а γῆ означает «земля» либо «страна». Формулировка «от земли» сохраняет необычность и неоднозначность греческой фразы, не исправляя её по предполагаемому смыслу.
- source_word: κριτὴς δίκαιος
  choice: праведный Судья
  rationale: Сочетание прямо характеризует Бога как Судью, суд Которого нравственно прав и справедлив.
- source_word: οὐ θαυμάσει πρόσωπον
  choice: не проявит лицеприятия
  rationale: Буквально выражение означает «не станет дивиться лицу», но это идиома о пристрастии к человеку из-за его положения или личности. «Не проявит лицеприятия» точно и достойно передаёт её смысл.
theological_decisions:
- issue: Необычный смысл первой части стиха
  choice: Сохранить засвидетельствованное значение «сделал известной», отметив необычность всей фразы в сноске.
  alternative: «Ты истребил память о них с земли» или «Ты сделал так, что память о них исчезла с земли».
  rationale: Контекст может наводить на мысль об уничтожении памяти, однако греческий глагол ἐδήλωσας означает «сделал известным/явил». Контекстуальная догадка не должна молча заменять чтение источника.
- issue: Образ лица в судебном высказывании
  choice: Передать идиоматический смысл как отсутствие лицеприятия.
  alternative: «Не станет дивиться лицу».
  rationale: Буквальная калька затемняет общепринятый смысл греческой идиомы и может создать ложный богословский оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Первая фраза намеренно сохраняет необычность исходного греческого текста; вторая передана ясной современной судебно-нравственной лексикой.
