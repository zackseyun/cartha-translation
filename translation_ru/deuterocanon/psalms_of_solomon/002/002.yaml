lexical_decisions:
- source_word: ἀνέβησαν
  choice: взошли на
  rationale: Передаёт буквальное движение вверх и направленность ἐπὶ с винительным падежом, не добавляя военного смысла.
- source_word: τὸ θυσιαστήριόν σου
  choice: Твой жертвенник
  rationale: «Жертвенник» — традиционное и понятное русское соответствие культовому θυσιαστήριον; местоимение сохраняет прямое обращение к Богу.
- source_word: ἔθνη ἀλλότρια
  choice: чужие народы
  rationale: «Народы» сохраняет основное значение ἔθνη, а «чужие» передаёт ἀλλότρια — их принадлежность к иному народу и отчуждённость от святыни.
- source_word: κατεπάτησαν
  choice: топтали
  rationale: Глагол выражает попрание ногами и оскверняющий характер действия; несовершенный вид по-русски естественно изображает сам процесс.
- source_word: ἐν ὑποδήμασιν αὐτῶν
  choice: своими сандалиями
  rationale: Творительный падеж естественно передаёт средство действия; «сандалии» исторически уместнее общего «обувь».
- source_word: ἐν ὑπερηφανίᾳ
  choice: в надменности
  rationale: Сохраняет именную конструкцию оригинала и передаёт высокомерный, дерзкий характер осквернения.
theological_decisions:
- issue: Значение ἔθνη в иудейском культовом контексте
  choice: народы
  alternative: язычники
  rationale: '«Народы» сохраняет лексическую неоднозначность: слово может обозначать как народы вообще, так и нееврейские народы; вариант «язычники» был бы более узким толкованием.'
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавная буква в «Твой» обозначает прямое обращение к Богу. Порядок маркеров приведён в соответствие с последовательностью поясняемых слов: [a] относится к ἀλλότρια, [b] — к ἔθνη.'
