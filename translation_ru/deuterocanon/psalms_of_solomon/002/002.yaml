  text: Foreign nations went up onto your altar[b][a]; they trampled it with their sandals in arrogance.
translation:
  language: ru
  text: Чужеземные[a] народы[b] взошли на Твой жертвенник; они надменно попрали его своими сандалиями.
  philosophy: optimal-equivalence
