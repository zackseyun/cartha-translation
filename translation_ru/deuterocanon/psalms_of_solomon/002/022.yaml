lexical_decisions:
- source_word: περιείλατο
  choice: сняла с себя
  rationale: 'Аорист среднего залога описывает действие самой женщины: она снимает то, что было на ней. Формулировка естественна по-русски и не привносит отсутствующего в греческом тексте насилия.'
- source_word: μίτραν
  choice: головной убор
  rationale: В данном контексте слово обозначает почётный женский головной убор персонифицированного Иерусалима. Общее обозначение сохраняет образ и не сужает значение до современного тюрбана или исключительно царской диадемы.
- source_word: δόξης
  choice: славы
  rationale: Родительный падеж передан прямо, чтобы сохранить возвышенное описание и связь убора с дарованными Богом честью и великолепием.
- source_word: περιέθηκεν αὐτῇ
  choice: возложил на неё
  rationale: Глагол означает «положить, надеть на кого-либо». «Возложил» естественно сочетается с почётным головным убором и сохраняет образ Божьего дара.
- source_word: ὁ θεός
  choice: Бог
  rationale: Прямой и стандартный перевод без добавления отсутствующего в тексте титула.
