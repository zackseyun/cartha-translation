  text: and to show mercy to the righteous from the humiliation of the sinner[c][b][a], and to repay the sinner for what he did to the righteous.
translation:
  language: ru
  text: и помиловать праведника, избавив его от унижения, причинённого грешником[a][b], и воздать грешнику за то, что он сделал праведнику.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и помиловать праведника от унижения грешника». Греческая конструкция сжата; слова «избавив его» передают наиболее вероятный смысл.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «унижение», может также означать «бедствие», «угнетение» или «униженное положение». Оборот «унижение грешника» допускает понимание как унижение, причинённое грешником.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: помиловать
  rationale: Передаёт деятельное проявление милости, а не только чувство жалости; инфинитив сохраняет синтаксическую связь с контекстом.
- source_word: δίκαιον / δικαίῳ
  choice: праведника / праведнику
  rationale: Субстантивированное прилагательное в единственном числе обозначает праведного человека; русская форма «праведник» естественна и сохраняет личностный характер противопоставления.
- source_word: ἀπὸ ταπεινώσεως
  choice: избавив его от унижения
  rationale: Предлог ἀπό указывает на удаление или избавление от состояния унижения. Добавление «избавив его» делает сжатую греческую конструкцию понятной по-русски, не скрывая в примечании её буквальной формы.
- source_word: ἁμαρτωλοῦ / ἁμαρτωλῷ
  choice: грешником / грешнику
  rationale: Сохраняет единственное число и прямое противопоставление грешника праведнику. В первой части творительный падеж выражает вероятный смысл источника или виновника унижения.
- source_word: ἀποδοῦναι
  choice: воздать
  rationale: Точно передаёт ответное, здесь карательное, воздаяние и соответствует возвышенному поэтическому регистру без архаической тяжеловесности.
- source_word: ἀνθʼ ὧν
  choice: за то, что
  rationale: Естественно выражает основание ответного воздаяния и сохраняет причинно-ретрибутивный смысл оборота.
- source_word: ἐποίησεν δικαίῳ
  choice: он сделал праведнику
  rationale: Дательный падеж передан обычной русской конструкцией с адресатом действия; враждебность не усиливается сверх сказанного в греческом тексте.
