lexical_decisions:
- source_word: υἱοὶ καὶ θυγατέρες
  choice: Сыновья и дочери
  rationale: Сохранено прямое парное обозначение лиц обоего пола; обобщение «дети» устранило бы явную форму исходного текста.
- source_word: ἐν αἰχμαλωσίᾳ πονηρᾷ
  choice: в тяжком плену
  rationale: αἰχμαλωσία означает плен, а πονηρός здесь естественно характеризует его как мучительный, бедственный или жестокий. «Тяжкий плен» передаёт суровость положения без неестественного буквального выражения «злой плен».
- source_word: ἐν σφραγῖδι ὁ τράχηλος αὐτῶν
  choice: на шее у них печать
  rationale: Греческая конструкция с ἐν сжата и буквально связывает их собирательно названную шею с печатью или оттиском. Русская формулировка сохраняет образ и не уточняет без достаточных оснований способ нанесения знака.
- source_word: ἐν ἐπισήμῳ
  choice: отмечены
  rationale: ἐπίσημος может обозначать помеченное, заметное или выделяющееся. «Отмечены» сохраняет широкий смысл и не сужает образ до обязательного клеймения.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди народов
  rationale: Нейтральное прямое соответствие, уместное для контекста плена и публичного унижения; вариант «среди язычников» внёс бы более узкое религиозное толкование.
