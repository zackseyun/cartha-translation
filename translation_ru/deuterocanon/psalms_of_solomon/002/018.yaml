lexical_decisions:
- source_word: ἀνέκαλυψας
  choice: обнажил
  rationale: Передаёт значение «открыл, снял покров, выставил на вид» и естественно сочетается с «грехами», не добавляя идеи судебного обличения сверх греческого текста.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: их грехи
  rationale: Прямое и естественное соответствие греческому выражению.
- source_word: ἵνα φανῇ
  choice: чтобы явился
  rationale: Сохраняет целевое значение ἵνα и пассивный оттенок φανῇ — «стал явным, обнаружился».
- source_word: τὸ κρίμα σου
  choice: Твой суд
  rationale: κρίμα здесь может обозначать судебное решение или суд; краткое «суд» сохраняет эту ёмкость и соответствует контексту.
theological_decisions:
- issue: Связь раскрытия грехов с Божьим судом
  choice: Сохранена целевая конструкция «чтобы явился Твой суд»
  alternative: «так что Твой суд стал виден»
  rationale: ἵνα обычно выражает цель, поэтому причинно-целевое напряжение оригинала не следует ослаблять до простого результата.
- issue: Значение κρίμα
  choice: «суд»
  alternative: «приговор» / «судебное решение»
  rationale: «Суд» не сужает смысл до одного приговора и сохраняет возможную широту греческого слова.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвенной речи. Заглавная буква в «Твой» обозначает обращение к Богу согласно принятой русской издательской традиции; дополнительных пояснений в тексте не требуется.
