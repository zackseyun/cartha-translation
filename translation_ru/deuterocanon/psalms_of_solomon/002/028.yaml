lexical_decisions:
- source_word: ἐκχέαι
  choice: излить
  rationale: Сохраняет греческий образ изливаемого гнева и естественно сочетается в русском языке со словом «гнев».
- source_word: τὴν ὀργὴν αὐτῶν
  choice: их гнев
  rationale: «Гнев» передаёт сильную, направленную против людей ярость; местоимение αὐτῶν сохранено без уточнения референта.
- source_word: ἐν ἁρπάγματι
  choice: предавая нас разграблению
  rationale: Компактное и трудное греческое сочетание описывает насильственное разорение; выбранная формулировка передаёт обстоятельство, при котором враги изливают свой гнев, не превращая пострадавших однозначно в «добычу».
- source_word: μὴ χρονίσῃς
  choice: не медли
  rationale: Краткая и естественная для молитвенного обращения передача просьбы не откладывать действие.
- source_word: ἀποδοῦναι αὐτοῖς εἰς κεφαλάς
  choice: воздать им на их же головы
  rationale: Сохраняет библейский образ воздаяния, возвращающегося на виновных; «их же» естественно выражает подразумеваемую возвратность идиомы.
theological_decisions:
- issue: Образ воздаяния на головы виновных
  choice: Сохранена молитва о том, чтобы Бог воздал врагам «на их же головы».
  alternative: 'Передать смысл отвлечённо: «покарать их за содеянное».'
  rationale: Греческий текст содержит конкретный образ возвращающегося воздаяния; его не следует смягчать или заменять богословским пересказом.
- issue: Связь гнева с разграблением
  choice: Разграбление представлено как способ или обстоятельство излияния вражеского гнева.
  alternative: 'Понять ἐν ἁρπάγματι как указание на добычу: «излить на нас гнев, как на добычу».'
  rationale: Оборот допускает некоторую синтаксическую неоднозначность, поэтому основной текст выбирает наиболее естественное контекстуальное понимание, а иной оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным тоном. Сохранены образ «излить гнев», прямое обращение «Боже» и телесная метафора воздаяния; архаизмы и конфессионально окрашенные формулы не вводились.
