  yaml_path: translation/deuterocanon/psalms_of_solomon/002/033.yaml
  text: He said[a], "I will be lord of land and sea," and he did not know that God is great[b], mighty in his great strength.
translation:
  language: ru
  text: 'Он сказал: «Я буду владыкой суши и моря», — и не знал, что Бог велик и могуч в Своей великой силе.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могуч Своей великой силой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: владыка
  rationale: В контексте человеческой похвальбы слово обозначает притязание на господство, а не божественный титул. «Владыка» сохраняет возвышенный тон и смысл власти.
- source_word: γῆς
  choice: суша
  rationale: В устойчивом противопоставлении γῆ καὶ θάλασσα речь естественно идет о суше и море; это также сохраняет возможный широкий географический охват.
- source_word: οὐκ ἔγνω
  choice: не знал
  rationale: Прямо передает аорист ἔγνω и сохраняет заложенную в контрасте нравственную иронию, не заменяя знание истолкованием или признанием.
- source_word: κραταιὸς
  choice: могуч
  rationale: Передает силу и мощь в приподнятом поэтическом регистре и естественно сочетается с последующим упоминанием Божьей силы.
- source_word: ἐν ἰσχύϊ αὐτοῦ τῇ μεγάλῃ
  choice: великой силой Своей
  rationale: Творительный падеж естественно передает сферу или основание могущества; постпозиция «Своей» поддерживает возвышенный поэтический строй и ясно относит силу к Богу.
theological_decisions:
- issue: Следует ли понимать ὁ θεὸς как титульное именование или как простое утверждение о Боге
  choice: что Бог велик, могуч великой силой Своей
  alternative: что Бог — великий и могучий
  rationale: Греческий текст естественнее читается как утверждение о величии и могуществе Бога в противопоставление человеческой похвальбе; титульное прочтение добавило бы не выраженный явно акцент.
- issue: Синтаксическая связь κραταιὸς ἐν ἰσχύϊ αὐτοῦ τῇ μεγάλῃ
  choice: могуч великой силой Своей
  alternative: велик и могуч в Своей великой силе
  rationale: Выбранная формулировка сохраняет кратийос как отдельное сказуемое и связывает могущество с ἰσχύς, не устраняя несколько необычную интенсивность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены контраст между человеческим притязанием и Божьим могуществом, а также усиление «велик — могуч — великой силой». Маркер сноски помещен в основном тексте.
