lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз продолжает ход молитвы, не добавляя отсутствующего в греческом тексте временного оттенка.
- source_word: συντελεσθήσονται
  choice: будут истреблены
  rationale: Будущее страдательного залога от συντελέω означает доведение до конца; во враждебном контексте «будут истреблены» естественно передаёт подразумеваемую гибель, сохраняя страдательную конструкцию.
- source_word: ἐὰν μὴ
  choice: если … не
  rationale: Естественная русская передача условного оборота ἐὰν μή; она сохраняет формальную условность исходной фразы.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма естественно передаёт прямое молитвенное обращение.
- source_word: ἐπιτιμήσεις
  choice: обличишь
  rationale: Передаёт властное порицание и сдерживающее вмешательство, выраженные глаголом ἐπιτιμάω.
- source_word: ἐν ὀργῇ σου
  choice: в гневе Твоём
  rationale: Сохраняет предложную конструкцию и серьёзный, судебный оттенок ὀργή; прописная буква у притяжательного местоимения соответствует достоинству молитвенного регистра.
theological_decisions:
- issue: Не выраженный явно субъект συντελεσθήσονται
  choice: Сохранено местоимение «они» без уточнения референта
  alternative: «Израиль будет истреблён»
  rationale: В самом стихе субъект прямо не назван. Подстановка «Израиль» могла бы прояснить контекст, но устранила бы подлинную синтаксическую неоднозначность греческого текста.
- issue: Соотношение субъекта «они» и дополнения «их»
  choice: Сохранены разные синтаксические роли без поясняющей подстановки
  alternative: Явно назвать одну из групп по контексту
  rationale: Греческий допускает восстановление референтов из предшествующего контекста, однако данный стих сам их не называет; перевод не должен молча закреплять спорное толкование.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. Инверсия «в гневе Твоём» сохраняет достоинство и ритм, не делая фразу архаичной. Не выраженный в греческом субъект намеренно не конкретизирован.
