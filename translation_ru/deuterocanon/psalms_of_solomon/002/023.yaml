lexical_decisions:
- source_word: ἀτιμίᾳ
  choice: с позором
  rationale: Существительное обозначает бесчестье, унижение, утрату почёта. Оборот «с позором» естественно передаёт обстоятельственное значение дательного падежа и публичный характер унижения.
- source_word: κάλλος
  choice: красота
  rationale: Прямое соответствие основному значению слова; в контексте олицетворённого города может также подразумевать его былое великолепие, но перевод не должен сужать образ.
- source_word: ἀπερρίφη
  choice: была повержена
  rationale: Глагол означает «была брошена, отброшена». «Была повержена» сохраняет страдательную конструкцию, направленность вниз и возвышенный, но понятный псалмический регистр.
- source_word: ἐπὶ τὴν γῆν
  choice: наземь
  rationale: ἐπί с винительным выражает движение на поверхность; «наземь» кратко и естественно передаёт образ падения и унижения.
