  yaml_path: translation/deuterocanon/psalms_of_solomon/002/008.yaml
  text: For he turned his face away from mercy toward them—young and old and their children[b][a], all at once.
translation:
  language: ru
  text: Ибо он отвратил своё лицо от милости к ним[a] — к молодым и старым[b] и к их детям — всем разом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от сострадания к ним»; по смыслу возможно также: «чтобы не миловать их».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к молодому и старцу»; греческие формы единственного числа употреблены собирательно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: отвратил
  rationale: Глагол передаёт поворот прочь; вместе с «лицом» традиционный и понятный глагол «отвратил» сохраняет конкретный образ греческого текста.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: своё лицо
  rationale: Буквальная передача сохраняет библейский антропоморфный образ; «своё» естественно по-русски при совпадении субъекта и обладателя.
- source_word: ἀπὸ ἐλέους αὐτῶν
  choice: от милости к ним
  rationale: Сохраняется сжатая и несколько неоднозначная греческая конструкция, не превращая образ в абстрактное утверждение «лишил их милости».
- source_word: νέον καὶ πρεσβύτην
  choice: к молодым и старым
  rationale: Хотя в греческом употреблены формы единственного числа, сочетание имеет собирательно-распределительный смысл; русское множественное число звучит естественно и охватывает обе возрастные группы.
- source_word: τέκνα αὐτῶν
  choice: к их детям
  rationale: τέκνα обозначает детей без ограничения по полу, поэтому «детям» точнее, чем «сыновьям».
- source_word: εἰς ἅπαξ
  choice: всем разом
  rationale: Выражение передаёт одновременность и всеохватность совершающегося суда; «всем разом» естественно связывается с перечисленными группами.
theological_decisions:
- issue: Антропоморфный образ отворачивания лица
  choice: Сохранён конкретный оборот «отвратил своё лицо».
  alternative: «лишил их милости» или «перестал сострадать им»
  rationale: Греческий текст выражает отказ в милости через телесно-реляционный образ; его не следует без необходимости заменять отвлечённым богословским толкованием.
- issue: Смысл сжатого оборота ἀπὸ ἐλέους αὐτῶν
  choice: «от милости к ним»
  alternative: «от сострадания к ним» / «чтобы не миловать их»
  rationale: Выбранный вариант сохраняет ключевое понятие милости и грамматическую сжатость оригинала; сноска отмечает возможное смысловое развёртывание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «отвратил своё лицо». Тире проясняют, что молодые, старые и дети входят в число тех, к кому относится отказ в милости, при этом сохраняется сжатость исходной фразы.
