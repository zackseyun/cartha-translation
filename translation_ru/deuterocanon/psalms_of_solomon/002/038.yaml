lexical_decisions:
- source_word: διαστεῖλαι
  choice: провести различие
  rationale: Передаёт судебное разграничение двух нравственных категорий и сохраняет возможность значения «разделить», отмеченную в сноске.
- source_word: ἀνὰ μέσον
  choice: между
  rationale: Естественно передаёт греческий оборот, обозначающий различие или разделение двух сторон.
- source_word: δικαίου
  choice: праведником
  rationale: Единственное число сохранено как обобщённое обозначение представителя нравственной категории.
- source_word: ἁμαρτωλοῦ
  choice: грешником
  rationale: Сохраняет единственное число и прямое смысловое противопоставление слову «праведник».
- source_word: ἀποδοῦναι
  choice: воздать
  rationale: В контексте суда выражает соответствующее поступкам воздаяние; слово естественно для достойного библейского регистра.
- source_word: ἁμαρτωλοῖς
  choice: грешникам
  rationale: Точно передаёт дательный падеж множественного числа как адресатов воздаяния.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Идиоматично выражает наиболее вероятное здесь значение продолжительности, тогда как буквальная временная формулировка сохранена в сноске.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: по их делам
  rationale: Кратко и естественно передаёт норму воздаяния в соответствии с совершёнными поступками.
theological_decisions:
- issue: Обобщённое единственное число нравственных категорий
  choice: «праведником и грешником»
  alternative: «праведными и грешниками»; «праведным человеком и грешником»
  rationale: Греческие формы стоят в единственном числе и обобщённо представляют две нравственные категории; русский перевод сохраняет и число, и естественность выражения.
- issue: Продолжительность воздаяния в εἰς τὸν αἰῶνα
  choice: «навеки» с буквальной альтернативой в сноске
  alternative: «на век»; «на протяжении века»
  rationale: В данном контексте выражение, вероятнее всего, обозначает непрекращающееся или вечное воздаяние, но сноска сохраняет буквальную временную образность и не устраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным судебно-библейским регистром. Инфинитивная структура и конечная точка с запятой сохранены как признаки связи со смежным контекстом.
