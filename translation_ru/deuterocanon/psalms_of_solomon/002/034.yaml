  yaml_path: translation/deuterocanon/psalms_of_solomon/002/034.yaml
  text: He himself is king over the heavens[a], and judges kings and rulers;
translation:
  language: ru
  text: Он сам — Царь над небесами и судит царей и правителей;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: он сам
  rationale: Явно передаёт усилительное местоимение и сохраняет акцент на том, что царская власть принадлежит именно Ему.
- source_word: βασιλεὺς
  choice: Царь
  rationale: Сохраняет прямой царский титул; в греческом это именная часть сказуемого без артикля, поэтому по-русски естественна конструкция с тире.
- source_word: ἐπὶ τῶν οὐρανῶν
  choice: над небесами
  rationale: ἐπί с родительным здесь выражает господство, а не просто местонахождение; множественное число τῶν οὐρανῶν передано словом «небесами».
- source_word: κρίνων
  choice: судит
  rationale: Греческое причастие естественно передано личной формой глагола, обозначающей осуществление суда, без изменения его связи с подлежащим.
- source_word: ἀρχάς
  choice: правителей
  rationale: В сочетании с «царями» слово обозначает носителей земной власти; «правители» ясно и современно, не привнося специального значения «духовные власти».
theological_decisions:
- issue: Объём царской власти в выражении ἐπὶ τῶν οὐρανῶν
  choice: Царство над небесами
  alternative: Царствование на небесах
  rationale: Родительный падеж после ἐπί в данном контексте лучше выражает власть над небесами, а не только пребывание на небесах; греческое множественное число сохранено.
- issue: Связь причастия κρίνων с утверждением о царской власти
  choice: Одно и то же лицо является Царём и судит земных властителей
  alternative: «Царь над небесами, судящий царей и правителей»
  rationale: Личная форма по-русски звучит естественнее, сохраняя одновременное утверждение царской и судебной власти. Причастный вариант возможен синтаксически, но не меняет основной смысл.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Тире оформляет именное сказуемое; прописная буква в слове «Царь» подчёркивает употребление как божественного титула. Конечная точка с запятой сохранена в соответствии с пунктуацией исходного фрагмента.
