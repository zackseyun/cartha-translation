lexical_decisions:
- source_word: ἐν τῷ κατασκηνοῦν
  choice: Когда ... обитает
  rationale: 'Сочетание ἐν с субстантивированным инфинитивом передаёт временное значение: «когда» или «в то время как». Русское «когда ... обитает» естественно и точно выражает эту конструкцию.'
- source_word: κατασκηνοῦν
  choice: обитает
  rationale: Глагол означает пребывание, поселение или размещение шатра. «Обитает» сохраняет образ постоянного присутствия и звучит естественно в современном литературном русском; более буквальный образ отмечен в сноске.
- source_word: τὸ ὄνομά σου
  choice: Твоё имя
  rationale: 'Метафора сохранена без истолковывающей замены на «Ты» или «Твоё присутствие»: в библейской речи имя может обозначать явленное присутствие Бога, но текст прямо говорит именно об имени.'
- source_word: ἐν μέσῳ ἡμῶν
  choice: среди нас
  rationale: Естественный русский эквивалент, сохраняющий общинный смысл близкого присутствия.
- source_word: ἐλεηθησόμεθα
  choice: мы будем помилованы
  rationale: Форма будущего времени страдательного залога передана прямо. «Будем помилованы» точно выражает получение милости и уместно для возвышенного, но понятного регистра.
