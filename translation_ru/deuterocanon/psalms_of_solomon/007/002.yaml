  text: For you have rejected them[a], O God[c][b]; let not their foot trample the inheritance of your sanctuary.
translation:
  language: ru
  text: Ибо Ты отверг их[a], Боже[c]; да не попирают их ноги наследие Твоего святилища[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая форма здесь понимается как неаугментированный аорист: «Ты отверг их» или «Ты оттолкнул их». Её также предлагали читать как обращённую к Богу просьбу: «отгони их».'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «Твоё святое наследие», если последнее сочетание понимать как указание на качество наследия, а не на его связь со святилищем.'
    reason: lexical_alternative
  - marker: c
    text: 'Или, согласно менее вероятному разбору всей фразы: «Ибо отгони их, Боже, чтобы их ноги не попирали наследие Твоего святилища».'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀπώσω
  choice: Ты отверг
  rationale: 'Форма естественнее всего понимается как неаугментированный аорист среднего залога, 2-е лицо единственного числа: речь идёт о совершённом Божьем отвержении. В сноске сохранено менее вероятное волитивное прочтение, отражённое в истории перевода.'
- source_word: πατήσαι
  choice: да не попирает
  rationale: Независимая конструкция с μή передаёт пожелание или молитвенное запрещение, а глагол в контексте враждебного осквернения сильнее простого «ступать».
- source_word: ὁ ποὺς αὐτῶν
  choice: их нога
  rationale: Сохранено собирательное единственное число греческого текста; по-русски выражение остаётся понятным и придаёт образу сжатую торжественность.
- source_word: κληρονομίαν
  choice: наследие
  rationale: «Наследие» сохраняет идею удела, полученного и принадлежащего Богу, а также её библейские и заветные оттенки.
- source_word: ἁγιάσματός σου
  choice: Твоего святилища
  rationale: В контексте угрозы попрания слово обозначает прежде всего освящённое место; «святилище» естественно передаёт культовое значение.
theological_decisions:
- issue: Значение ἀπώσω и связь двух частей стиха
  choice: '«Ты отверг их»; далее самостоятельное пожелание: «да не попирает…»'
  alternative: «Отгони их… чтобы их ноги не попирали…»
  rationale: Грамматически предпочтительно видеть в ἀπώσω аорист среднего залога, 2-е лицо единственного числа, а в μὴ πατήσαι — независимое пожелание. Альтернативу не исключили молча, а вынесли в сноски.
- issue: Отношение κληρονομίαν и ἁγιάσματός σου
  choice: «наследие Твоего святилища»
  alternative: «Твоё святое наследие»
  rationale: Родительный падеж непосредственно связывает наследие со святилищем, однако атрибутивное понимание возможно и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейской торжественностью. Местоимение «Ты» и притяжательное «Твоего» написаны с прописной буквы как традиционная форма почтительного обращения к Богу. Конструкция «да не попирает» сохраняет самостоятельный характер греческого пожелания и звучит естественно в сакральном регистре.
