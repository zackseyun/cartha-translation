lexical_decisions:
- source_word: ἀποστείλῃς
  choice: пошлёшь
  rationale: Прямо передаёт значение глагола «посылать» и сохраняет образ смерти как посланной Богом силы.
- source_word: θάνατον
  choice: смерть
  rationale: Основное и наиболее точное значение греческого слова; возможная контекстуальная связь с мором не должна подменять лексическое значение в основном тексте.
- source_word: ἐντελῇ αὐτῷ
  choice: дашь ей повеление
  rationale: Передаёт Божью власть распоряжаться смертью. Женский род местоимения естественно обусловлен родом русского слова «смерть» и сохраняет олицетворение.
- source_word: περὶ ἡμῶν
  choice: о нас
  rationale: Краткий естественный эквивалент, сохраняющий смысл распоряжения относительно молящихся.
- source_word: ἐλεήμων
  choice: милосерден
  rationale: Точный и стилистически достойный библейский эквивалент.
- source_word: οὐκ ὀργισθήσῃ τοῦ συντελέσαι ἡμᾶς
  choice: не разгневаешься настолько, чтобы положить нам конец
  rationale: Естественно передаёт связь гнева с итоговым полным уничтожением, не утверждая, что Бог вообще не гневается.
theological_decisions:
- issue: Степень Божьего гнева и полное уничтожение народа
  choice: не разгневаешься настолько, чтобы положить нам конец
  alternative: не разгневаешься, чтобы окончательно уничтожить нас
  rationale: 'Формулировка сохраняет напряжение текста: возможный гнев не отрицается, но милосердие не допускает полного истребления.'
- issue: Значение θάνατος в вероятном контексте Божьей кары
  choice: смерть
  alternative: мор
  rationale: Хотя контекст может напоминать повествование о моровой язве, греческое слово само по себе означает «смерть»; более узкое толкование вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Обращение к Богу оформлено с прописной буквы. Олицетворение смерти сохранено естественными средствами русского языка.
