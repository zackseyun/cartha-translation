  text: For if you send death[a], you will command it concerning us; for you are merciful[c][b], and you will not be angry so as to bring us to an end.
translation:
  language: ru
  text: Ибо если Ты пошлёшь смерть[a], то отдашь ей распоряжение относительно нас; ведь Ты милосерден и не разгневаешься настолько, чтобы истребить нас до конца.
  philosophy: optimal-equivalence
  footnotes:
