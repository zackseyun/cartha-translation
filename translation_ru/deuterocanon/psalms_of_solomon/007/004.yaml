    issue: Неестественная передача ἐντελῇ αὐτῷ περὶ ἡμῶν
    rationale: Выражение «дать ей повеление о нас» не является естественной современной русской конструкцией. Греческий текст говорит о распоряжении, данном смерти относительно людей говорящего.
  - severity: low
    issue: Спекулятивное примечание о море
    rationale: θάνατος означает «смерть». Возможная связь с мором зависит от контекстуальной реконструкции и не должна подаваться как специальное значение слова в данном стихе; в самом греческом тексте отчётливо засвидетельствовано олицетворение смерти.
