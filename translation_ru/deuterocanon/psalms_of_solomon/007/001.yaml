  yaml_path: translation/deuterocanon/psalms_of_solomon/007/001.yaml
  text: Do not depart from us[a], O God[c][b], lest those who hate us without cause attack us.
translation:
  language: ru
  text: Не уходи от нас[a], Боже, чтобы ненавидящие нас без причины[b] не напали на нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол буквально связан со снятием шатра и уходом со стоянки; здесь это яркий образ удаляющегося Божьего присутствия.
    reason: cultural_note
  - marker: b
    text: 'Или: «чтобы ненавидящие нас не напали на нас ни за что». Греческое наречие можно связать либо с ненавистью, либо с нападением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσκηνώσῃς
  choice: не уходи
  rationale: В контексте молитвы глагол означает удаление Божьего присутствия. Русское «не уходи» звучит естественно и передаёт просьбу, а заключённый в греческом глаголе образ снятия шатра отмечен в сноске.
- source_word: ἀφʼ ἡμῶν
  choice: от нас
  rationale: Предлог выражает удаление от общины; «от нас» непосредственно передаёт это значение.
- source_word: ἵνα μὴ
  choice: чтобы … не
  rationale: Оборот вводит предотвращаемый или опасаемый результат; это наиболее естественная современная русская конструкция.
- source_word: ἐπιθῶνται ἡμῖν
  choice: не напали на нас
  rationale: Глагол обозначает враждебное нападение; выбран прямой и современный русский эквивалент.
- source_word: οἱ μισοῦντα ἡμᾶς
  choice: ненавидящие нас
  rationale: Субстантивированное причастие естественно передаётся русским причастным оборотом.
- source_word: δωρεάν
  choice: без причины
  rationale: Наречие может указывать на необоснованность ненависти; вместе с тем его синтаксическая связь допускает отнесение к нападению, что отражено в сноске.
theological_decisions:
- issue: Образ удаления Божьего шатра или места пребывания
  choice: В основном тексте передать идиоматически как «не уходи», сохранив образ в сноске
  alternative: «Не уноси от нас Своего шатра» / «не удаляй от нас Своего жилища»
  rationale: Греческий ἀποσκηνόω связан со снятием шатра и уходом со стоянки, однако буквальные русские варианты либо неестественны, либо вводят явное дополнение, которого в стихе нет. Сноска сохраняет богословски значимый образ удаляемого присутствия, не превращая его в отдельное существительное в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Порядок обращения «Боже» сохраняет непосредственность оригинала; синтаксис прост и понятен широкому читателю.
