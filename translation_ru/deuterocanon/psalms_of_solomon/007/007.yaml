  text: And we will call upon you[a], and you will hear us.
translation:
  language: ru
  text: И мы воззовём к Тебе, и Ты услышишь нас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внемлешь нам», «выслушаешь нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσόμεθαί (ἐπικαλέω)
  choice: призовём
  rationale: В молитвенном контексте глагол означает обратиться к Богу, призвать Его. «Призовём» естественно для русского библейского стиля и не добавляет смысла ответа, которого в самом глаголе нет.
- source_word: σε
  choice: Тебя
  rationale: Прямое дополнение второго лица сохранено; прописная буква соответствует принятому русскому оформлению обращения к Богу.
- source_word: ἐπακούσει (ἐπακούω)
  choice: услышишь
  rationale: 'Передаёт основное значение глагола и сохраняет некоторую смысловую широту: речь может идти не только о физическом восприятии, но и о благосклонном внимании. Перевод «ответишь» был бы более истолковывающим.'
- source_word: ἡμῶν
  choice: нас
  rationale: При ἐπακούω греческий родительный падеж естественно передаётся по-русски прямым объектом «нас»; добавление «нашу молитву» не требуется и отсутствует в источнике.
theological_decisions:
- issue: Подразумевает ли ἐπακούσει ответ Бога на молитву
  choice: услышишь нас
  alternative: ответишь нам
  rationale: Греческий глагол может подразумевать благосклонное слушание, однако явно не выражает последующий ответ. Более буквальное «услышишь» сохраняет богословскую и лексическую напряжённость, не усиливая утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Параллельная конструкция «и мы… и Ты…» сохранена. Местоимения обращения к Богу написаны с прописной буквы как стилистическая издательская норма, не меняющая смысла.
