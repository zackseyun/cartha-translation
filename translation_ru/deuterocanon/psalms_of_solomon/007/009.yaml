  yaml_path: translation/deuterocanon/psalms_of_solomon/007/009.yaml
  text: You will guide us at the time of your help[b][a], to show mercy to the house of Jacob for the day that you promised them.
translation:
  language: ru
  text: Ты направишь нас[a] во время Твоей помощи, чтобы помиловать дом Иакова к тому дню, который Ты обещал им.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поведёшь нас прямым путём». Греческий глагол может означать направление движения или выпрямление пути.'
    reason: lexical_alternative
  - marker: b
    text: 'Конечная глагольная форма текстуально затруднительна; здесь по контексту она понята в смысле «Ты обещал им». Более буквальное, но хуже согласующееся с контекстом прочтение: «я обещал им».'
    reason: textual_variant
lexical_decisions:
- source_word: κατευθυνεῖς
  choice: направишь
  rationale: Глагол передаёт направление пути или движения; «направишь» сохраняет этот образ и естественно звучит в обращённой к Богу молитве.
- source_word: ἐν καιρῷ
  choice: во время
  rationale: Оборот обозначает определённое время или благоприятный момент; «во время» прямо передаёт временное значение ἐν καιρῷ.
- source_word: ἀντιλήψεως
  choice: помощи
  rationale: Существительное означает помощь или поддержку. «Помощь» — ясный и нейтральный вариант, не сужающий значение до избавления.
- source_word: τοῦ ἐλεῆσαι
  choice: чтобы помиловать
  rationale: Инфинитив выражает цель; «чтобы помиловать» сохраняет и целевое значение, и действие милосердия.
- source_word: τὸν οἶκον Ἰακώβ
  choice: дом Иакова
  rationale: Сохранено библейское коллективное наименование без поясняющей замены на «Израиль».
- source_word: εἰς ἡμέραν
  choice: ради того дня
  rationale: Предлог направляет мысль к ожидаемому, назначенному дню. «Ради того дня» сохраняет устремлённость к нему, не сводя оборот лишь к указанию времени действия.
- source_word: ἐπηγγείλω αὐτοῖς
  choice: Ты обещал им
  rationale: 'Форма в рукописной традиции затруднительна, однако контекст прямого обращения к Богу поддерживает второе лицо: обещание дано Богом.'
theological_decisions:
- issue: Следует ли раскрыть выражение «дом Иакова» как «Израиль» или «народ Израиля»
  choice: Сохранено «дом Иакова».
  alternative: «Израиль»; «народ Израиля»
  rationale: Греческий текст прямо называет дом Иакова. Буквенное сохранение выражения удерживает его заветное и литературное звучание без добавления толкования.
- issue: Кто является субъектом обещания в заключительной части стиха
  choice: «Ты обещал им» — субъектом назван Бог, к Которому обращена молитва.
  alternative: «Я обещал им»
  rationale: Греческая форма текстуально трудна и допускает более буквальное понимание как первого лица, но непосредственный молитвенный контекст делает второе лицо наиболее связным прочтением; трудность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимение «Твоей» написано с прописной буквы как принятая в религиозном русском тексте форма почтительного обращения; синтаксис остаётся ясным для широкого читателя, а выражение «дом Иакова» сохраняет библейскую образность.
