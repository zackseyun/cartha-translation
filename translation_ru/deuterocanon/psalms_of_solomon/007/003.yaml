lexical_decisions:
- source_word: σὺ
  choice: Ты
  rationale: Личное местоимение выражено отдельно, хотя форма греческого глагола уже указывает на второе лицо; перевод сохраняет это смысловое выделение и противопоставление Божьего воздействия передаче во власть народов.
- source_word: ἐν θελήματί σου
  choice: по Своей воле
  rationale: Предлог ἐν здесь естественно передаёт соответствие Божьей воле; русское «по Своей воле» звучит ясно и сохраняет обращённость фразы к Богу.
- source_word: παιδεύσον
  choice: вразуми
  rationale: Глагол παιδεύω охватывает наставление, воспитание и исправляющее наказание. «Вразуми» в данном молитвенном контексте естественно соединяет наставляющий и исправительный оттенки, не сводя смысл только к наказанию.
- source_word: δῷς
  choice: не отдавай нас
  rationale: Буквально глагол означает «давать», но в контексте речь идёт о передаче во власть народов. Дополнение «нас» подразумевается из предыдущей части и необходимо для ясного русского текста.
- source_word: ἔθνεσιν
  choice: народам
  rationale: Форма во множественном числе обозначает чужеземные народы. «Народам» сохраняет широкое значение и не сужает его до конфессионально окрашенного «язычникам».
