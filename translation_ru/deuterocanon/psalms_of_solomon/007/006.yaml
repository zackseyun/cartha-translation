  text: and no nation will prevail against us, because you are our defender.
translation:
  language: ru
  text: И ни один народ не одолеет нас, потому что Ты — наш защитник.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἰσχύσει
  choice: не одолеет
  rationale: Глагол ἰσχύω обозначает силу или способность; в сочетании с πρὸς ἡμᾶς естественно передаёт смысл «оказаться сильнее, одолеть».
- source_word: πρὸς ἡμᾶς
  choice: нас (при глаголе «одолеет»)
  rationale: Предлог πρός с винительным при глаголе силы имеет здесь направленно-противительный смысл; по-русски он естественно выражается прямым дополнением при «одолеть».
- source_word: ἔθνος
  choice: народ
  rationale: ἔθνος может обозначать народ или нацию. «Народ» звучит естественно в русском библейском контексте и не вносит уточнения «языческий», которого сам стих явно не требует.
- source_word: ὑπερασπιστής
  choice: защитник
  rationale: Существительное обозначает того, кто встаёт на защиту другого. «Защитник» сохраняет краткую, титульную форму греческого выражения.
theological_decisions:
- issue: Формулировка о Божьей защите
  choice: потому что Ты — наш защитник
  alternative: ибо Ты защищаешь нас
  rationale: В греческом употреблено именное сказуемое, а не глагольная конструкция. Перевод сохраняет исповедальную силу и компактность определения Бога как защитника.
- issue: Объём понятия ἔθνος
  choice: народ
  alternative: языческий народ
  rationale: Перевод не уточняет религиозную принадлежность противника, поскольку в данном стихе ἔθνος само по себе не требует такого богословского сужения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавная буква в «Ты» передаёт почтительное обращение к Богу; тире подчёркивает именное сказуемое.
