translation:
  language: ru
  text: Ибо Ты будешь вечно миловать народ Израиля и не отвергнешь его; и мы вечно будем под Твоим ярмом и под бичом Твоего вразумления.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτειρήσεις
  choice: будешь миловать
  rationale: Будущее время и значение сострадательной милости переданы естественным русским глаголом без ослабления до простого чувства жалости.
- source_word: τὸ γένος Ἰσραήλ
  choice: народ Израиля
  rationale: В данном контексте γένος обозначает общность потомков Израиля; «народ» звучит естественно и не привносит современного расового оттенка слова «род».
- source_word: οὐκ ἀπώσεις
  choice: не отвергнешь его
  rationale: Форма от ἀπωθέω выражает отказ или отвержение; местоимение «его» добавлено ради ясной русской связи с народом Израиля.
- source_word: ὑπὸ ζυγόν σου
  choice: под Твоим ярмом
  rationale: Сохранён конкретный образ ярма, выражающий подчинение Божьей власти.
- source_word: μάστιγα παιδίας σου
  choice: под бичом Твоего вразумления
  rationale: μάστιξ передано сильным конкретным словом «бич», а παιδεία — как исправляющее и наставляющее воздействие, то есть «вразумление».
theological_decisions:
- issue: Соотношение вечной милости и исправляющего наказания
  choice: Сохранить рядом образы милости, ярма и бича вразумления
  alternative: Смягчить «бич» до «жезла» или истолковать наказание как одно лишь обучение
  rationale: Греческий текст намеренно удерживает вместе Божье сострадание, власть и болезненное исправление; перевод не должен устранять это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-поэтической речи. Заглавные местоимения обращения к Богу соблюдены. Эллиптическое сказуемое во второй части восполнено как «будем», а подразумеваемый повтор ὑπό — как второе «под».
