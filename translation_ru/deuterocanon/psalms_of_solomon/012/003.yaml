  source_fidelity: Русский текст точно сохраняет именную конструкцию ἡ παροικία αὐτοῦ с поясняющими инфинитивами, конкретные «дома» и «деревья радости», а также не устраняет намеренно трудную синтаксическую связь φλογιζούσης с εὐφροσύνης. «Воспламеняющей беззаконников» корректно передаёт женский родительный падеж единственного числа причастия и не вносит отсутствующего в греческом значения «против».
