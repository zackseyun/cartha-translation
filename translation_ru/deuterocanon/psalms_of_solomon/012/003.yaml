  yaml_path: translation/deuterocanon/psalms_of_solomon/012/003.yaml
  text: His dwelling is to fill houses with a lying tongue[a], to cut down trees of gladness[d][c][b], flaming against the lawless.
translation:
  language: ru
  text: Его пребывание[a] — наполнять дома лживым языком, срубать деревья радости[b], воспламеняющей беззаконников[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его жизнь на чужбине», «Его проживание»; греческое слово может обозначать пребывание или проживание, особенно в качестве пришельца.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «деревья радости». Вероятно, это метафорический образ того, благодаря чему дом процветает и радуется.'
    reason: cultural_note
  - marker: c
    text: 'Заключение в греческом тексте синтаксически сжато. Причастие «воспламеняющей» по форме согласуется с «радости»; возможен также более буквальный оттенок: «зажигающей беззаконников».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ παροικία αὐτοῦ
  choice: Его пребывание
  rationale: Существительное παροικία обозначает проживание или пребывание, нередко с оттенком жизни на чужбине. Именная конструкция сохранена, поскольку последующие инфинитивы поясняют, в чём состоит его пребывание.
- source_word: ἐμπλῆσαι οἴκους
  choice: наполнять дома
  rationale: Греческий инфинитив передан инфинитивом, а конкретный образ домов сохранён без замены на более отвлечённое «семьи».
- source_word: ἐν γλώσσῃ ψεύδει
  choice: лживым языком
  rationale: Перевод сохраняет телесный образ языка как орудия лжи и естественно передаёт инструментальное значение конструкции с ἐν.
- source_word: ἐκκόψαι δένδρα εὐφροσύνης
  choice: срубать деревья радости
  rationale: Сильный глагол ἐκκόψαι и образ деревьев переданы буквально; вероятная метафора не раскрывается в основном тексте путём пояснительного пересказа.
- source_word: φλογίζούσης παρανόμους
  choice: воспламеняющей беззаконников
  rationale: Причастие φλογιζούσης имеет форму женского рода, родительного падежа, единственного числа и грамматически естественнее всего относится к εὐφροσύνης («радости»), а παρανόμους передано как прямое дополнение, без добавления отсутствующего в греческом значения «против».
