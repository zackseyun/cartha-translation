lexical_decisions:
- source_word: γλῶττα
  choice: язык
  rationale: Сохранён конкретный поэтический образ единственного числа, который может иметь собирательное значение.
- source_word: ψιθύρων
  choice: клеветников
  rationale: В данном контексте слово обозначает тех, кто тайно распространяет порочащие речи; «клеветников» естественно передаёт отрицательную нравственную окраску, тогда как более буквальное «шептунов» дано в примечании.
- source_word: ἀπόλοιτο
  choice: да погибнет
  rationale: Форма выражает пожелание или призыв к суду; русская конструкция «да погибнет» сохраняет торжественный и молитвенно-поэтический тон.
- source_word: ἐν πυρὶ φλογός
  choice: в пылающем огне
  rationale: Идиоматический русский оборот сохраняет усиленный образ огня и пламени без неестественного буквального «в огне пламени».
- source_word: ἀπὸ ὁσίων
  choice: да будет он удалён от благочестивых
  rationale: Предлог ἀπό передаёт отделение, а ὅσιοι здесь — благочестивые, преданные Богу люди. Добавление сказуемого делает эллиптическую греческую фразу понятной по-русски, не устраняя её смысловой связи с пожеланием.
