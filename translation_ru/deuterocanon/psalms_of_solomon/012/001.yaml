translation:
  language: ru
  text: Господи, избавь душу мою от человека беззаконного и злого, от языка беззаконного, шепчущего и говорящего ложь и обман.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Господи
  rationale: Прямое обращение к Богу; звательная форма «Господи» естественна для современной русской молитвенной речи и не добавляет отсутствующего в греческом междометия.
- source_word: ῥῦσαι
  choice: избавь
  rationale: Аористный императив выражает просьбу о решительном спасении от угрозы; «избавь» естественно сочетается с конструкцией «от» и сохраняет молитвенный регистр.
- source_word: τὴν ψυχήν μου
  choice: душу мою
  rationale: ψυχή допускает значения «душа», «жизнь» и «я сам»; буквальный образ сохранён, поскольку он естественен по-русски и не устраняет смысловую широту оригинала.
- source_word: ἀνδρὸς παρανόμου καὶ πονηροῦ
  choice: человека беззаконного и злого
  rationale: ἀνήρ здесь обозначает отдельного человека мужского пола, однако в русском «человек» естественнее в данной конструкции; определения сохраняют различие между нарушением закона и нравственным злом.
- source_word: γλώσσης παρανόμου καὶ ψιθυροῦ
  choice: языка беззаконного, шепчущего
  rationale: Оба определения синтаксически относятся к «языку». Причастие «шепчущего» передаёт необычное греческое определение естественно и сохраняет образ тайной вредоносной речи.
- source_word: λαλούσης ψευδῆ καὶ δόλια
  choice: говорящего ложь и обман
  rationale: 'Причастие относится к «языку»; субстантивированные прилагательные переданы собирательными существительными, сохраняя два аспекта речи: ложность и коварный обман.'
