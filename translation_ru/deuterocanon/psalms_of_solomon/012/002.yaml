lexical_decisions:
- source_word: ἐν ποικιλίᾳ στροφῆς
  choice: полны всевозможных извилистых оборотов
  rationale: Сочетание буквально передаёт «многообразие поворота» и характеризует речь как изменчивую, уклончивую и витиеватую. Русское «извилистые обороты» сохраняет образ поворотов речи, а «всевозможных» выражает ποικιλίᾳ.
- source_word: οἱ λόγοι τῆς γλώσσης
  choice: слова на языке
  rationale: Сохранён конкретный образ языка, а не заменён абстрактным словом «речь»; выражение при этом естественно для современного русского языка.
- source_word: ἀνδρὸς πονηροῦ
  choice: злого человека
  rationale: Здесь πονηρός имеет нравственную окраску. «Человек» естественно передаёт ἀνήρ в обобщающем изречении, не превращая его в указание исключительно на пол.
- source_word: καλλονὴ
  choice: привлекательность
  rationale: Основное значение связано с красотой, но в контексте подчёркнута её притягательная сила, способная распространять зло. «Привлекательность» сохраняет эту функцию без добавления идеи магического или личного обаяния.
- source_word: πῦρ ἀνάπτον
  choice: огонь, разгорающийся
  rationale: Настоящее действительное причастие передаёт продолжающееся воспламенение или разгорание, а не уже завершённое действие.
- source_word: ἐν λαῷ
  choice: среди народа
  rationale: Передан коллективный смысл λαός без уточнения, о каком именно народе или сообществе идёт речь.
