base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/004.yaml
  text: May God throw lawless houses into turmoil in war by whispering lips[a]; may God remove from the innocent the lips of the lawless in distress[c][b], and may the bones of whisperers be scattered away from those who fear the Lord.
translation:
  language: ru
  text: Да приведёт Бог в смятение на войне дома беззаконных[b] шепчущими устами[a]; да удалит Бог в бедствии[c] от невинных уста беззаконных, и да будут рассеяны кости шептунов — вдали от боящихся Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клеветническими устами» / «кости клеветников». Однокоренные греческие слова обозначают не просто тихую речь, а также скрытые злонамеренные пересуды или клевету.'
    reason: lexical_alternative
  - marker: b
    text: «Дома» здесь могут означать также семьи или домочадцев беззаконных, а не только здания.
    reason: lexical_alternative
  - marker: c
    text: Оборот «в бедствии» можно отнести к невинным, к беззаконным или к обстоятельствам самого удаления; греческий текст не указывает это однозначно.
    reason: source_ambiguity
lexical_decisions:
- source_word: συνταράξαι
  choice: да приведёт ... в смятение
  rationale: Передаёт пожелание-мольбу и значение сильного потрясения или смятения, не сужая его до физического разрушения.
- source_word: οἴκους
  choice: дома
  rationale: Сохраняет конкретный образ греческого текста; возможное значение «семьи, домочадства» отмечено в сноске.
- source_word: παρανόμους / παρανόμων
  choice: беззаконных
  rationale: Библейски естественно передаёт тех, кто преступает закон, не заменяя эту характеристику общим словом «нечестивые».
- source_word: χείλεσι ψιθυροῖς
  choice: шепчущими устами
  rationale: Сохраняет образ уст и скрытой речи, а творительный падеж передаёт инструментальный смысл. Оттенок злонамеренного наговора пояснён в сноске.
- source_word: μακρύναι
  choice: да удалит
  rationale: Ясно выражает молитвенное пожелание держать вдали или устранить.
- source_word: ἀκάκων
  choice: невинных
  rationale: Естественно передаёт нравственную незлобивость и непричастность ко злу без архаического оттенка.
- source_word: ἐν ἀπορίᾳ
  choice: в бедствии
  rationale: Передаёт состояние тяжёлого положения, нужды или беспомощности; синтаксическая отнесённость оборота остаётся неоднозначной и отмечена в сноске.
- source_word: ψιθύρων
  choice: тех, кто шепчется
  rationale: Сохраняет лексическую связь с «шепчущими устами» и образ скрытой речи; злонамеренный смысл указан в сноске.
- source_word: φοβουμένων Κύριον
  choice: боящихся Господа
  rationale: Сохраняет устойчивое библейское обозначение благоговейно преданных Богу людей.
theological_decisions:
- issue: Подразумеваемое подлежащее первого пожелания
  choice: «Бог» выражено в первом предложении
  alternative: Оставить первое пожелание без явно названного действующего лица до слов ὁ θεός во второй части
  rationale: Русское предложение требует ясного носителя действия; ближайшее явно названное подлежащее — Бог. Это соответствует параллелизму молитвенных пожеланий, хотя в греческом ὁ θεός формально появляется только при втором глаголе.
- issue: К кому относится ἐν ἀπορίᾳ
  choice: Сохранена синтаксическая неоднозначность оборотом «в бедствии»
  alternative: Однозначно отнести бедствие либо к невинным, либо к беззаконным
  rationale: Положение греческого оборота допускает разные связи, поэтому перевод не должен без необходимости разрешать богословски и смыслово значимый вопрос о том, кто находится в бедствии.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Повтор «да» сохраняет молитвенно-пожелательную форму; «уста» и «боящиеся Господа» поддерживают достоинство поэтического регистра. Необычный образ разбросанных костей сохранён без смягчения.
