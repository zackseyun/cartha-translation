base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/006.yaml
  text: May the Lord protect a quiet soul that hates the unjust[c][b][a], and may the Lord guide a man who makes peace in the house.
translation:
  language: ru
  text: Да сохранит Господь спокойную душу[a], ненавидящую неправедных, и да направит[b] Господь человека, творящего мир в доме[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жизнь» либо «самого человека».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выпрямит путь»; греческий глагол может обозначать как направление, так и приведение пути в прямое, верное состояние.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «среди домашних»; греческое слово может означать и дом как место, и домочадцев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξαι
  choice: да сохранит
  rationale: Аорист оптатива выражает молитвенное пожелание; конструкция «да сохранит» естественно передаёт и эту модальность, и смысл охраны и сбережения.
- source_word: Κύριος
  choice: Господь
  rationale: В данном молитвенном пожелании слово употреблено как наименование Бога; традиционное и ясное соответствие — «Господь».
- source_word: ψυχὴν
  choice: душу
  rationale: «Душа» сохраняет антропологическую широту ψυχή и образ внутреннего человека, не сводя слово только к физической жизни.
- source_word: ἡσύχιον
  choice: спокойную
  rationale: Прилагательное обозначает спокойствие, тишину и отсутствие мятежности; «спокойную» звучит естественнее современного русского сочетания «тихая душа» и не добавляет смысла безмолвия.
- source_word: μισοῦσαν ἀδίκους
  choice: ненавидящую неправедных
  rationale: Причастие согласовано с «душой» и описывает её нравственную установку; субстантивированное ἀδίκους передано без уточнения как «неправедных».
- source_word: κατευθύναι
  choice: да направит
  rationale: Глагол может означать направление по верному пути или выпрямление пути; «направит» близко к форме источника и естественно в молитвенном контексте.
- source_word: ἄνδρα
  choice: человека
  rationale: В этом обобщённом нравственном высказывании «человека» естественно передаёт единичное лицо; более буквальное «мужа» в современном русском могло бы ошибочно пониматься как «супруга».
- source_word: ποιοῦντα εἰρήνην
  choice: творящего мир
  rationale: Выражение передаёт активное установление мира и сохраняет образную, молитвенно-поэтическую форму греческого оборота.
- source_word: ἐν οἴκῳ
  choice: в доме
  rationale: «В доме» непосредственно передаёт οἶκος и сохраняет возможную отсылку как к жилищу, так и к домашнему кругу.
theological_decisions:
- issue: Объект ненависти в выражении μισοῦσαν ἀδίκους
  choice: «ненавидящую неправедных» — ненависть направлена на названных людей
  alternative: «ненавидящую неправду» — ненависть направлена только на безличное зло
  rationale: Греческое ἀδίκους — субстантивированное прилагательное во множественном числе, то есть «неправедных [людей]». Смягчение до ненависти лишь к неправде устранило бы нравственное напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной молитвенной интонацией. Повтор «Господь» сохранён вслед за греческим текстом. Конструкция «да сохранит… и да направит…» передаёт параллельные оптативы, а «творящего мир» сохраняет поэтический характер без чрезмерной архаизации.
