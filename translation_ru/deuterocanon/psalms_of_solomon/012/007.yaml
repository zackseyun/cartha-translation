lexical_decisions:
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Родительный падеж передаёт принадлежность спасения Господу и допускает подразумеваемый смысл его происхождения от Него.
- source_word: ἡ σωτηρία
  choice: спасение
  rationale: «Спасение» сохраняет широкий смысл избавления и естественно звучит в возвышенном молитвенном контексте.
- source_word: ἐπὶ Ἰσραήλ
  choice: над Израилем
  rationale: Предлог ἐπί передан пространственно-образным оборотом «над Израилем», подходящим для благословения и не сводящим выражение к простому обладанию.
- source_word: παῖδα αὐτοῦ
  choice: Его слугой
  rationale: παῖς может означать слугу, ребёнка или сына; в речи об отношениях Бога и Израиля «слуга» хорошо передаёт заветную принадлежность и служение, а неоднозначность отмечена в сноске.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Устойчивое библейское наречие ясно передаёт неограниченную длительность и сохраняет достоинство стиля.
theological_decisions:
- issue: Модальность безглагольного предложения
  choice: 'Пожелание: «Да пребудет»'
  alternative: 'Утверждение: «пребывает» / «есть»'
  rationale: В греческом конечный глагол отсутствует, однако окружающие строки построены как молитвенные пожелания с оптативами. Поэтому здесь вероятнее благословение или прошение, но грамматическая возможность утверждения сохранена в сноске.
- issue: Значение παῖς применительно к Израилю
  choice: «слуга»
  alternative: «дитя» или «сын»
  rationale: Контекст допускает заветное обозначение Израиля как Божьего слуги, но само греческое слово сохраняет семейную семантику; она не устранена и указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Формула «да пребудет» передаёт благословительный характер строки; «вовеки» сохраняет библейскую торжественность, оставаясь понятным современному читателю.
