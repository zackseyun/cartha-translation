  text: May the sinners perish from the presence of the Lord once for all[c][b][a], and may the devout of the Lord inherit the promises.
translation:
  language: ru
  text: Да погибнут грешники[c] от лица Господа раз и навсегда[b], а верные Господу[a] да унаследуют обетования.
  philosophy: optimal-equivalence
  footnotes:
