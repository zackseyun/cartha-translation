    reason: lexical_alternative
  - marker: c
    text: В греческом перед словом «грешники» стоит определённый артикль; поэтому здесь может подразумеваться конкретная группа людей.
    reason: source_nuance
lexical_decisions:
- source_word: ἀπόλοιντο
  choice: да погибнут
  rationale: Оптатив выражает пожелание или молитвенное прошение; конструкция с «да» передаёт это значение и сохраняет возвышенный, но понятный регистр.
- source_word: οἱ ἁμαρτωλοὶ
  choice: грешники
  rationale: Прямой эквивалент сохраняет обозначенную в греческом нравственную и, возможно, групповую категорию. Поскольку в русском нет артиклей, определённость поясняется в сноске.
- source_word: ἀπὸ προσώπου Κυρίου
  choice: пред лицом Господа
  rationale: Устойчивое русское библейское выражение естественно передаёт буквальный образ «лица» и смысл пребывания перед Господом.
- source_word: ἅπαξ
  choice: раз и навсегда
  rationale: В данном контексте передаёт возможный оттенок окончательности; более нейтральное «однажды/один раз» приведено в сноске.
- source_word: ὅσιοι Κυρίου
  choice: верные Господу
  rationale: Передаёт благочестие и преданность Богу естественным современным русским языком, не придавая слову узкого технического значения.
- source_word: κληρονομήσαισαν
  choice: да унаследуют
  rationale: Оптатив вновь выражает пожелание, а глагол «унаследуют» сохраняет образ получения обещанного наследия.
- source_word: ἐπαγγελίας
  choice: обетования
  rationale: «Обетования» — понятный и укоренённый в библейской речи эквивалент божественных обещаний, особенно уместный рядом с глаголом «унаследовать».
theological_decisions:
- issue: Определённость выражения οἱ ἁμαρτωλοί
  choice: В основном тексте — «грешники», с пояснением в сноске о возможной конкретной группе.
  alternative: «Эти грешники»
  rationale: Русский язык не выражает определённость артиклем, а добавление «эти» чрезмерно конкретизировало бы референта. Сноска сохраняет возможную полемическую направленность текста.
- issue: Значение ὅσιοι
  choice: «верные Господу»
  alternative: «святые Господа» или «благочестивые Господни»
  rationale: Выбранный вариант сохраняет смысл религиозной преданности и принадлежности Господу, не решая вопрос в пользу ангелологических или конфессионально-технических значений слова «святые».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллелизм двух пожеланий сохранён конструкциями «да погибнут» и «да унаследуют»; архаизирующая лексика сведена к широко понятным выражениям «пред лицом Господа» и «обетования».
