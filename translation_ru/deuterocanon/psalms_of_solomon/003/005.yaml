  text: The righteous man is attentive and will declare the Lord just; The righteous man is attentive and will vindicate the Lord; he falls, and he looks to see what God will do for him., and he looks to see what God will do for him.
translation:
  language: ru
  text: Праведник внимателен и признает Господа правым[a]; он падает и смотрит, что Бог сделает с ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оправдает Господа».'
    reason: Лексическая альтернатива для δικαιώσει, сохраняющая более буквальную, но по-русски менее прозрачную формулировку.
  - marker: b
    text: 'Или: «что Бог сделает для него».'
    reason: Дательный αὐτῷ может обозначать действие по отношению к человеку либо действие в его пользу; основной текст сохраняет более нейтральный смысл.
lexical_decisions:
- source_word: προσέχων
  choice: внимателен
  rationale: Причастие передаёт постоянную настороженность и сосредоточенность праведника; краткое прилагательное естественно выражает эту характеристику по-русски.
- source_word: ὁ δίκαιος
  choice: праведник
  rationale: Субстантивированное прилагательное в единственном числе обозначает типичного праведного человека; «праведник» — точное и естественное соответствие.
- source_word: δικαιώσει
  choice: признает … правым
  rationale: При Господе как прямом дополнении глагол означает признать или подтвердить Его правоту, а не наделить Его праведностью. Совершенный вид «признает» также передаёт греческое будущее время.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Традиционное и контекстуально уместное обозначение Бога; прописная буква сохраняет благоговейный регистр.
- source_word: ἔπεσεν
  choice: он падает
  rationale: Хотя в греческом стоит аорист, в контексте описания характерного поведения праведника он имеет обобщённый, гномический смысл; русское настоящее время естественно согласуется с последующим «смотрит».
- source_word: ἀποβλέπει
  choice: смотрит
  rationale: Глагол выражает направленный, ожидающий взгляд. «Смотрит» сохраняет образ, не усиливая его до истолковывающего «уповает» или «ожидает».
- source_word: τί ποιήσει αὐτῷ ὁ θεός
  choice: что сделает для него Бог
  rationale: Дательный αὐτῷ допускает благоприятное «для него» и более нейтральное «с ним». Контекст ожидания Божьей помощи несколько поддерживает первый вариант, а второй сохранён в примечании.
theological_decisions:
- issue: Означает ли δικαιώσει, что праведник оправдывает Господа или признаёт Его правоту?
  choice: признает Господа правым
  alternative: оправдает Господа
  rationale: Основной вариант ясно выражает положительное суждение праведника о Божьей правоте и не создаёт впечатления, будто человек делает Бога праведным. Более буквальная формулировка сохранена в примечании.
- issue: Имеет ли Божье действие в τί ποιήσει αὐτῷ благоприятный или нейтральный смысл?
  choice: что сделает для него Бог
  alternative: что сделает с ним Бог
  rationale: Ближайший контекст надежды на избавление склоняет к благоприятному смыслу, однако форма дательного падежа сама по себе не устраняет нейтрального или неблагоприятного оттенка, поэтому двусмысленность отмечена.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической мудростной речи. Синтаксис краток и параллелен греческому; богословская двусмысленность не устранена, а вынесена в примечания.
