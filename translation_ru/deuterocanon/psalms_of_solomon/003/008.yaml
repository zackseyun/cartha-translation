  yaml_path: translation/deuterocanon/psalms_of_solomon/003/008.yaml
  text: The righteous continually watches over his house[b][a], to remove wrongdoing in his transgression.
translation:
  language: ru
  text: Праведник постоянно проверяет свой дом[b], чтобы устранить неправду в связи с собственным проступком[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «в своём проступке». Возможны также значения: «при собственном проступке» или «из-за собственного проступка».'
    reason: 'Оборот ἐν παραπτώματι αὐτοῦ неоднозначен: нейтральная формулировка основного текста не закрепляет лишь временное толкование.'
  - marker: b
    text: «Дом» здесь может означать также домашних или всё домашнее хозяйство.
    reason: Греческое οἶκος может обозначать жилище, семью и домашнее хозяйство.
lexical_decisions:
- source_word: ἐπισκέπτεται
  choice: проверяет
  rationale: Глагол обозначает деятельное внимание и надзор. В отношении собственного дома «проверяет» передаёт целенаправленное исследование лучше, чем буквальное «посещает».
- source_word: διὰ παντός
  choice: постоянно
  rationale: Оборот выражает непрерывное или привычно повторяющееся действие.
- source_word: ὁ δίκαιος
  choice: праведник
  rationale: Русское существительное естественно передаёт единственное число и мужской род, не утяжеляя фразу сочетанием «праведный человек».
- source_word: τὸν οἶκον αὐτοῦ
  choice: свой дом
  rationale: «Дом» сохраняет возможность понимать οἶκος и как жилище, и как домашнее хозяйство или семью.
- source_word: τοῦ ἐξᾶραι
  choice: чтобы устранять
  rationale: Артикулярный инфинитив выражает цель; несовершенный вид согласуется с постоянным, повторяющимся надзором.
- source_word: ἀδικίαν
  choice: неправду
  rationale: Здесь слово обозначает нравственное зло вообще, а не только общественную несправедливость.
- source_word: ἐν παραπτώματι αὐτοῦ
  choice: когда сам совершает проступок
  rationale: 'Так передано вероятное обстоятельственное значение ἐν: праведник не безгрешен, но, оступившись, принимает меры против неправды. Слово «сам» ясно относит местоимение к праведнику; буквальная неоднозначность отмечена в сноске.'
theological_decisions:
- issue: Допускает ли стих, что праведник может согрешить
  choice: Фраза допускает, что праведник совершает проступок, после чего стремится устранить неправду.
  alternative: Можно формально передать оборот как «в своём проступке» или причинно — «из-за своего проступка», не уточняя временную связь.
  rationale: Местоимение αὐτοῦ естественнее всего относится к праведнику. Перевод не приписывает ему безгрешия, но и не развивает сверх текста учение о природе его проступка.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической мудрости. Формулировка проста и ясна; сохранены активный самоанализ праведника, целевая конструкция и богословское напряжение между праведностью и возможностью проступка.
