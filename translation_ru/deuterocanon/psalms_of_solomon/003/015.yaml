lexical_decisions:
- source_word: αὕτη
  choice: Вот
  rationale: Указательное местоимение отсылает к только что описанному исходу; русское «вот» естественно и выразительно передаёт это указание.
- source_word: ἡ μερὶς
  choice: доля
  rationale: «Доля» сохраняет значение доставшейся или назначенной участи и в данном кратком изречении звучит естественнее, чем более отвлечённая «часть».
- source_word: τῶν ἁμαρτωλῶν
  choice: грешников
  rationale: Родительный падеж множественного числа обозначает людей, характеризуемых грехом; «грешников» — прямой и общепонятный эквивалент.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Устойчивое греческое выражение передаёт непреходящую длительность; «навеки» сохраняет её силу и соответствует возвышенному поэтическому регистру.
