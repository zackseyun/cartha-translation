  text: Sing a hymn and praise to God[a], the One worthy of praise. Sing, and keep watch for his watching[c][b], for a psalm to God from a good heart is good.
translation:
  language: ru
  text: Пойте Богу гимн и хвалебную песнь — Богу, достойному хвалы[a]. Пой и бодрствуй в отношении Его бдения[b], ибо псалом Богу, исходящий из доброго сердца, хорош.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достохвальному» либо «Богу, Которого восхваляют».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение необычно; возможно также: «будь бдителен в отношении Его бдительности» или «бодрствуй перед Его бдением». Точное отношение между двумя частями фразы неясно.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ὕμνον καὶ αἶνον
  choice: гимн и хвалебную песнь
  rationale: 'Сохранены два однородных понятия: ὕμνος как гимн и αἶνος как выражение хвалы. Добавление слова «песнь» делает сочетание естественным по-русски, не сливая два греческих существительных.'
- source_word: ψάλλετε / ψάλλε
  choice: пойте / пой
  rationale: Передан намеренный переход от повелительного наклонения во множественном числе к единственному; ψάλλω в данном контексте означает исполнение священной песни.
- source_word: τῷ θεῷ τῷ αἰνετῷ
  choice: Богу — Достойному хвалы
  rationale: αἰνετός может обозначать как того, кто достоин хвалы, так и того, кого восхваляют. Основной текст естественно передаёт первое значение, а альтернативу сохраняет сноска.
- source_word: γρηγόρησον ἐπὶ τὴν γρηγόρησιν αὐτοῦ
  choice: бодрствуй ради Его бдения
  rationale: Сохранён однокоренной повтор глагола и существительного, а также необычность греческой конструкции. «Ради» передаёт возможную целевую или соотносительную силу ἐπί с винительным падежом, не уточняя её чрезмерно.
- source_word: ψαλμός
  choice: псалом
  rationale: «Псалом» сохраняет религиозно-литературный характер слова и соответствует контексту обращения к Богу.
- source_word: ἐξ ἀγαθῆς καρδίας
  choice: исходящий из доброго сердца
  rationale: Предлог ἐκ передан как происхождение или источник; ἀγαθός переведено основным значением «добрый», без усиления до «чистый».
- source_word: ἀγαθὸς ... ἀγαθῆς
  choice: добр ... доброго
  rationale: Сохранён риторический повтор одного и того же греческого прилагательного, хотя краткая форма «добр псалом» имеет возвышенно-поэтическую окраску.
theological_decisions:
- issue: Значение Божьего «бдения» в необычной фразе
  choice: Не уточнять, означает ли оно Божью охрану, бодрствование или внимание
  alternative: 'Перевести истолковательно: «бодрствуй, ожидая Его охраны»'
  rationale: Греческий текст не объясняет характер γρηγόρησις и не даёт достаточных оснований сводить его к конкретному богословскому представлению о Божьей защите.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Архаизмы сведены к минимуму; краткая форма «добр» сохранена ради повтора ἀγαθός и ритмической выразительности. Переход «пойте» — «пой» воспроизводит грамматический сдвиг оригинала.
