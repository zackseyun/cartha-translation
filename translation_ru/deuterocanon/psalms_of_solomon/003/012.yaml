lexical_decisions:
- source_word: προσεθήκεν
  choice: прибавлял
  rationale: Аорист προστίθημι передаёт совершившееся накопление; русское «прибавлял» сохраняет образ последовательного добавления и естественно сочетается с «к своей жизни».
- source_word: ἁμαρτίας ἐφʼ ἁμαρτίαις
  choice: грехи за грехами
  rationale: Сохранено намеренное множественное число обоих существительных и выражена нарастающая повторяемость. Оборот «грехи за грехами» естественен для современного русского языка.
- source_word: τῇ ζωῇ αὐτοῦ
  choice: к своей жизни
  rationale: Дательный падеж естественно понимать как косвенное дополнение при «прибавлял». Возвратное «своей» по-русски однозначно относит жизнь к подлежащему и сохраняет связь с образом его жизни в контексте.
theological_decisions:
- issue: Сфера действия или косвенное дополнение в τῇ ζωῇ αὐτοῦ
  choice: к своей жизни
  alternative: в своей жизни
  rationale: Греческий дательный допускает понимание сферы, однако при προσεθήκεν он естественно обозначает то, к чему добавляются грехи. Основной текст сохраняет эту более непосредственную синтаксическую связь, а альтернативу приводит сноска.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достоинственный. Множественное число оригинала сохранено; неоднозначность дательного оборота отмечена в сноске.
