  text: The righteous will remember the Lord continually[c][b][a], with thanksgiving and vindicating the judgments of the Lord.
translation:
  language: ru
  text: Праведные будут непрестанно помнить Господа, с благодарением и признанием справедливости судов Господа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в благодарении и оправдании судов Господа». Слово ἐξομολόγησις может также означать хвалу или исповедание, а δικαίωσις — оправдание или подтверждение правоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: праведные
  rationale: Субстантивированное прилагательное обозначает людей, отличающихся праведностью; традиционное и естественное русское соответствие.
- source_word: μνημονεύσουσιν
  choice: будут помнить
  rationale: Передаёт будущее время и продолжающееся памятование без добавления значения публичного упоминания.
- source_word: διὰ παντός
  choice: непрестанно
  rationale: Греческий оборот означает постоянство; слово сохраняет возвышенный псалмический регистр и остаётся понятным современному читателю.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Соответствует устойчивому библейскому употреблению κύριος как божественного титула.
- source_word: ἐν ἐξομολογήσει
  choice: с благодарением
  rationale: В библейском и псалмическом греческом ἐξομολόγησις может обозначать благодарение, хвалу или исповедание; контекст и отличие от термина «хвала» в предыдущем стихе поддерживают «благодарение».
- source_word: δικαιώσει
  choice: признанием справедливости
  rationale: Передаёт значение оправдания или подтверждения правоты применительно к судам Господа, не создавая впечатления, будто люди делают их справедливыми.
- source_word: τὰ κρίματα τοῦ κυρίου
  choice: судов Господа
  rationale: Сохраняет юридико-богословский смысл κρίματα как судебных решений или приговоров и близко следует греческой конструкции.
theological_decisions:
- issue: Смысл δικαίωσις применительно к судам Господа
  choice: признание их справедливости
  alternative: оправдание судов Господа
  rationale: Выбранная формулировка выражает подтверждение правоты Божьих судов, но не предполагает, что они нуждаются в том, чтобы человек сделал их правыми; при этом сохраняется богословское напряжение человеческого признания Божьего суда.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. «Непрестанно» и «благодарение» сохраняют достоинство текста; синтаксис сделан ясным без устранения смысловой многозначности греческих существительных.
