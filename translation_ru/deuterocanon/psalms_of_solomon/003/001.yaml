lexical_decisions:
- source_word: Ἵνα τί
  choice: Почему
  rationale: Естественно передаёт вопрос с оттенком упрёка или призыва пробудиться.
- source_word: ὑπνοῖς
  choice: ты спишь
  rationale: Передаёт настоящее время, действительный залог и второе лицо единственного числа, сохраняя прямой риторический вопрос.
- source_word: ψυχή
  choice: душа
  rationale: Греческое слово употреблено как прямое обращение; притяжательное местоимение «моя» в исходном тексте отсутствует.
- source_word: εὐλογεῖς
  choice: благословляешь
  rationale: Сохраняет обычное библейское значение εὐλογέω при обращённом к Богу прославлении.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В контексте поклонения κύριος естественно передаётся традиционным и понятным титулом «Господь».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Прямое обращение «душа» сохранено без добавления «моя»; греческая неоднозначность между обычным и продолжающимся действием не требует отдельной сноски в русском, где форма «спишь» допускает оба оттенка.
