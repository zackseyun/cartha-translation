  text: But those who fear the Lord will rise to eternal life, and their life in the light of the Lord will never cease.
translation:
  language: ru
  text: Но боящиеся Господа воскреснут для вечной жизни, и их жизнь в свете Господа больше не прекратится.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβούμενοι
  choice: боящиеся
  rationale: Субстантивированное причастие обозначает людей, чьё постоянное отношение к Богу выражено страхом перед Ним. «Боящиеся» сохраняет библейскую смысловую насыщенность и звучит естественно в современном литературном русском.
- source_word: κύριον / Κυρίου
  choice: Господа
  rationale: В обоих случаях κύριος относится к Богу; традиционное «Господь» точно и понятно передаёт это наименование без привнесения различий, которых греческий текст здесь не выражает.
- source_word: ἀναστήσονται
  choice: воскреснут
  rationale: Будущая форма ἀνίστημι в сочетании с «для вечной жизни» естественно имеет эсхатологический смысл воскресения. «Воскреснут» передаёт его прямо, сохраняя непассивную форму греческого глагола.
- source_word: εἰς ζωὴν αἰώνιον
  choice: для вечной жизни
  rationale: Предлог εἰς выражает направленность или результат. Русское «для вечной жизни» естественно сочетается с глаголом «воскреснут» и сохраняет эсхатологическую цель; буквальное «в вечную жизнь» по-русски здесь менее естественно.
- source_word: ἐν φωτὶ Κυρίου
  choice: в свете Господа
  rationale: Прямое предложное соответствие сохраняет образ пребывания в исходящем от Господа свете и не сужает его до инструментального значения.
- source_word: οὐκ ἐκλείψει ἔτι
  choice: уже не угаснет
  rationale: ἐκλείπω означает прекращаться, иссякать, угасать. В сочетании со «светом» в ближайшем контексте «угаснет» создаёт естественную образную связь, тогда как «уже не» точно передаёт οὐκ ... ἔτι.
theological_decisions:
- issue: Смысл ἀναστήσονται εἰς ζωὴν αἰώνιον
  choice: Будущее воскресение для вечной жизни выражено в основном тексте словом «воскреснут».
  alternative: Более общее «восстанут к вечной жизни», допускающее не только телесное воскресение.
  rationale: Сочетание ἀναστήσονται с εἰς ζωὴν αἰώνιον в эсхатологическом противопоставлении наиболее естественно указывает на воскресение, хотя сам глагол в иных контекстах может означать просто «встать» или «восстать».
- issue: Образ жизни, которая не прекратится
  choice: Сохранена связь жизни со светом Господа и употреблено образное «не угаснет».
  alternative: «Их жизнь ... уже не прекратится» или «не иссякнет».
  rationale: Греческое ἐκλείψει допускает несколько близких оттенков. «Не угаснет» сохраняет вечность жизни и одновременно поддерживает непосредственно предшествующий образ света, не превращая его в отдельное догматическое утверждение.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис близок к греческому, но естественен по-русски; архаизмы и конфессионально маркированные формулы не использованы.
