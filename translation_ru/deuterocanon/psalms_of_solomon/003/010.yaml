  yaml_path: translation/deuterocanon/psalms_of_solomon/003/010.yaml
  text: And the Lord cleanses every devout man and his house[a][b][c].
translation:
  language: ru
  text: И Господь очищает всякого благочестивого человека[a] и его дом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святого человека»; также возможно: «набожного человека».'
    reason: Лексема ὅσιος может обозначать святость, благочестие или набожность.
  - marker: b
    text: 'Или: «его домашних», «его семью».'
    reason: Слово οἶκος может означать не только дом как жилище, но и живущих в нём людей.
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Передаёт κύριος с определённым артиклем как обычный божественный титул; русская форма естественно употребляется без дополнительного артиклевого эквивалента.
- source_word: καθαρίζει
  choice: очищает
  rationale: Сохраняет настоящее время и допускает как нравственный, так и ритуальный оттенок глагола καθαρίζω.
- source_word: πᾶν ἄνδρα
  choice: всякого … человека
  rationale: Передаёт дистрибутивное значение πᾶν с существительным в единственном числе. Слово «человек» естественно по-русски и не устраняет грамматически мужскую форму исходного текста.
- source_word: ὅσιον
  choice: благочестивого
  rationale: В данном контексте выражает личную верность Богу и благочестие; «святого» также возможно, но может сильнее обозначать статус посвящённости.
- source_word: οἶκον
  choice: дом
  rationale: Сохраняет прямое значение οἶκος и лексическую связь с тем же словом в ближайшем контексте; по смыслу «дом» может включать и домашних.
theological_decisions:
- issue: Объём значения οἶκος
  choice: Сохранено «дом» без уточнения, идёт ли речь о жилище, семье или всём домашнем круге.
  alternative: «домочадцы» или «семья»
  rationale: Греческое слово допускает как предметное, так и коллективное понимание; конкретизация в основном тексте преждевременно сняла бы эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Синтаксис близок к греческому, но естественен по-русски; сохранены настоящее время, дистрибутивность и смысловая неоднозначность слова «дом».
