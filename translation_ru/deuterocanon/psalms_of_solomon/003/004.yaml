lexical_decisions:
- source_word: ὀλιγωρήσει
  choice: не пренебрежёт
  rationale: Глагол означает считать маловажным, не принимать всерьёз, пренебрегать. Такое соответствие естественно по-русски и сохраняет утвердительную форму будущего времени с отрицанием.
- source_word: δίκαιας / δίκαιος
  choice: праведник
  rationale: В предоставленной строке стоит грамматически необычное δίκαιας рядом с παιδευόμενους, тогда как засвидетельствованное при сверке чтение δίκαιος παιδευόμενος даёт ясное подлежащее в единственном числе. Основной текст передаёт этот смысл, а расхождение отмечено в сноске.
- source_word: παιδευόμενος / παιδευόμενους
  choice: вразумлением
  rationale: παιδεύω здесь обозначает исправляющее и воспитывающее воздействие Господа. «Вразумление» сохраняет одновременно наставительный и исправительный оттенки и естественно сочетается с «не пренебрежёт».
- source_word: εὐδοκία
  choice: радость
  rationale: С притяжательным αὐτοῦ слово относится к внутреннему благому расположению или удовольствию праведника. «Радость» звучит естественно и соответствует контексту; более формальные варианты — «благоволение» или «благое желание».
- source_word: διὰ παντός
  choice: всегда
  rationale: Оборот выражает непрерывность или постоянство; краткое «всегда» ясно и сохраняет возвышенный ритм.
- source_word: ἔναντι Κυρίου
  choice: пред Господом
  rationale: Формально прозрачная библейская формула сохраняет пространственно-отношенческий образ греческого выражения.
- source_word: κυρίου / Κυρίου
  choice: Господа / Господом
  rationale: В обоих случаях κύριος относится к Богу; традиционное «Господь» сохраняет библейскую преемственность без дополнительного истолкования.
theological_decisions:
- issue: К кому относится αὐτοῦ в выражении ἡ εὐδοκία αὐτοῦ
  choice: 'к праведнику: «его радость»'
  alternative: 'к Господу: «Его благоволение»'
  rationale: При чтении δίκαιος παιδευόμενος подлежащим первой части является праведник, и ближайшая связная референция αὐτοῦ — тот же праведник. Вариант с Божьим благоволением возникает прежде всего при попытке синтаксически выправить необычные формы предоставленной строки.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: В данном богореферентном употреблении «Господь» соответствует устойчивому библейскому словоупотреблению и не вносит конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Пред Господом» сохранено как понятная традиционная формула; архаические формы и узкоконфессиональная терминология не используются.
