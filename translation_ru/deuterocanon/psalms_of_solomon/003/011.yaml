  text: A sinner stumbled[a], and he curses his life, the day of his birth and his mother’s labor pains.
translation:
  language: ru
  text: Грешник споткнулся[a] и проклинает свою жизнь, день своего рождения и родовые муки своей матери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потерпел крах». Греческий глагол может означать как буквальное преткновение, так и образное падение, приведшее к бедствию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέκοψεν
  choice: споткнулся
  rationale: Глагол προσκόπτω буквально означает «споткнуться» или «удариться обо что-либо» и может образно обозначать падение или бедствие. «Споткнулся» сохраняет яркий образ и не уточняет сверх текста степень постигшей грешника гибели.
- source_word: ἁμαρτωλός
  choice: грешник
  rationale: Прямое и естественное соответствие существительному ἁμαρτωλός в библейском контексте.
- source_word: καταρᾶται
  choice: проклинает
  rationale: Передаёт прямое значение глагола и сохраняет силу высказывания; настоящее время греческого текста сохранено.
- source_word: ζωὴν αὐτοῦ
  choice: свою жизнь
  rationale: Возвратное местоимение естественно по-русски указывает на жизнь самого подлежащего.
- source_word: τὴν ἡμέραν γενέσεως αὐτοῦ
  choice: день своего рождения
  rationale: Точная и торжественная передача выражения, обозначающего день, когда он родился.
- source_word: ὠδῖνας μητρός
  choice: родовые муки своей матери
  rationale: ὠδῖνες обозначает схватки и муки родов. «Родовые муки» сохраняет образ рождения и соответствует достоинству поэтического контекста; «своей» естественно проясняет подразумеваемое отношение к матери грешника.
