translation_notes:
  register: 'Современный литературный русский язык с кратким, торжественным синтаксисом. Сохранена смена времени: аорист «споткнулся» и настоящее «проклинает». Перечисление после «свою жизнь» оставлено без пояснительного знака, чтобы не устранять возможную синтаксическую напряжённость греческого текста.'
