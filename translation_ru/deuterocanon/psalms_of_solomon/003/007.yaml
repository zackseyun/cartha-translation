base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/007.yaml
  text: The truth of the righteous is from God their savior[b][a]; sin upon sin does not lodge in the house of a righteous man.
translation:
  language: ru
  text: Истина праведных — от Бога, их Спасителя[a]; грех за грехом не остаётся на ночлег в доме праведника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Верность праведных»; здесь «истина» может обозначать также правдивость или внутреннюю цельность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια
  choice: истина
  rationale: Основное значение слова передано прямо, без сужения до одной лишь правдивости речи. В данном нравственном контексте оно может также обозначать верность или цельность характера, что отмечено в сноске.
- source_word: παρὰ θεοῦ
  choice: от Бога
  rationale: Παρά с родительным падежом указывает здесь на источник или происхождение.
- source_word: σωτῆρος αὐτῶν
  choice: их Спасителя
  rationale: Сохраняет прямое значение σωτήρ и ясно относит притяжательное местоимение к праведным.
- source_word: οὐκ αὐλίζεται
  choice: не остаётся на ночлег
  rationale: Передаёт конкретный образ временного ночлега или пребывания, заложенный в αὐλίζομαι, естественным современным русским выражением.
- source_word: ἐν οἴκῳ δικαίου
  choice: в доме праведника
  rationale: Сохраняет единственное число и грамматически мужскую форму греческого δικαίου.
- source_word: ἁμαρτία ἐφʼ ἁμαρτίαν
  choice: грех за грехом
  rationale: Передаёт накопление и повторяемость греха, сохраняя риторическую повторность оригинала.
theological_decisions:
- issue: Смысл ἀλήθεια как нравственного качества праведных
  choice: истина
  alternative: верность; правдивость; цельность
  rationale: «Истина» наиболее непосредственно соответствует греческому слову и сохраняет его смысловую широту; более узкие контекстуальные варианты вынесены в сноску, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Конструкция «не остаётся на ночлег» сохраняет образность глагола, а «грех за грехом» — нарастающий ритм второй части стиха.
