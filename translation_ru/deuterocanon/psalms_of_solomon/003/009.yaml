lexical_decisions:
- source_word: ἐξιλάσατο
  choice: совершает искупление
  rationale: 'Глагол имеет культовый смысл искупления. Аорист передан настоящим временем как гномический: в контексте описывается обычное благочестивое поведение праведника.'
- source_word: περὶ ἀγνοίας
  choice: за грех, совершённый по неведению
  rationale: В культовом контексте ἀγνοία обозначает проступок, совершённый без сознательного намерения; слово «грех» проясняет подразумеваемый библейский смысл, а «по неведению» сохраняет прямое значение греческого существительного.
- source_word: ἐν νηστείᾳ
  choice: постясь
  rationale: Предлог ἐν выражает здесь образ действия или средство; деепричастие естественно передаёт это по-русски.
- source_word: καὶ ταπεινώσει ψυχὴν αὐτοῦ
  choice: и смиряет свою душу
  rationale: Форма ταπεινώσει при винительном ψυχὴν естественно разбирается как глагол «смирит», однако в данном обобщающем описании передана настоящим временем. Выражение «смирять душу» сохранено как библейский оборот, не сведённый молча к общему «смиряться».
theological_decisions:
- issue: Связь поста и смирения души с искуплением
  choice: Сохранена прямая связь действий с совершением искупления без дополнительного догматического объяснения.
  alternative: Ослабить связь, представив пост и смирение лишь сопутствующими признаками покаяния.
  rationale: Греческий текст непосредственно связывает ἐξιλάσατο с ἐν νηστείᾳ и последующим смирением души; перевод не должен заранее разрешать богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и библейской образности. Конструкция слегка сглажена для ясности, но культовая лексика «совершает искупление» и идиома «смиряет свою душу» сохранены.
