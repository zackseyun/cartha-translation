lexical_decisions:
- source_word: ἀποσκοπεύει
  choice: всматривается
  rationale: Глагол передаёт напряжённое, внимательное и ожидающее наблюдение; «всматривается» естественно выражает этот оттенок в современном русском языке.
- source_word: ὅθεν
  choice: откуда
  rationale: Наречие указывает на источник или направление происхождения; «откуда» прямо и естественно сохраняет это значение.
- source_word: ἥξει
  choice: придёт
  rationale: Будущая форма обозначает приход или прибытие; в сочетании со «спасением» наиболее естественно русское «придёт».
- source_word: σωτηρία
  choice: спасение
  rationale: Это широкий эквивалент, соответствующий религиозному регистру Псалмов Соломона; возможное значение избавления не исключается и отмечено в сноске.
- source_word: αὐτῷ
  choice: к нему
  rationale: Дательный падеж при глаголе движения естественно передаётся направительным оборотом «к нему», близким к греческой конструкции.
