base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/013.yaml
  text: He has fallen[a], because his fall is evil, and he will not rise. The destruction of the sinner is forever[b],
translation:
  language: ru
  text: Он пал, ибо падение его тяжко[a], и не восстанет. Гибель грешника — навеки,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «падение его пагубно»; возможно также: «труп его отвратителен».'
    reason: Греческое πτῶμα может означать как падение или крушение, так и труп, а πονηρόν — тяжкое, пагубное, дурное или злое.
lexical_decisions:
- source_word: ἔπεσεν
  choice: Он пал
  rationale: Простой аорист передан естественным русским прошедшим временем; дальнейшие слова показывают окончательность падения без необходимости добавлять «уже».
- source_word: πονηρὸν τὸ πτῶμα αὐτοῦ
  choice: тяжко его падение
  rationale: Созвучная пара ἔπεσεν/πτῶμα передана словами «пал/падение». В данном сочетании πονηρόν естественно выражает тяжесть, бедственность или пагубность падения; возможная моральная окраска и значение «труп» отмечены в сноске.
- source_word: οὐκ ἀνιστήσεται
  choice: не восстанет
  rationale: Передаёт прямое значение «не встанет, не поднимется» и сохраняет краткость и суровую окончательность греческой фразы, не добавляя отсутствующего в тексте слова «снова».
- source_word: ἀπώλεια
  choice: гибель
  rationale: «Гибель» — весомое и понятное современному читателю соответствие, более естественное здесь, чем книжная «погибель», и не ослабляет смысла до простого «ущерба» или «краха».
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: В контексте окончательного суда выражает непреходящую длительность и звучит кратко и торжественно.
theological_decisions:
- issue: Возможный оттенок воскресения в ἀνιστήσεται
  choice: не восстанет
  alternative: не поднимется
  rationale: Выбрано более формальное и ёмкое соответствие, сохраняющее присущую греческому глаголу возможность более широкого прочтения, но перевод не добавляет прямого указания на воскресение.
translation_notes:
  register: Современный литературный русский с кратким, торжественным ритмом. Сохранена образная связь «пал — падение» и конечная запятая исходного фрагмента, поскольку предложение продолжается в следующем стихе.
