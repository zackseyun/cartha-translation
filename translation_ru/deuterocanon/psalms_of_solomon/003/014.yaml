  text: and he will certainly not be remembered when he visits the righteous[a][b][c].
translation:
  language: ru
  text: И о нём никогда не вспомнят[a], когда он посетит[b] праведных[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будет вспомянут». Подразумеваемым лицом, вероятнее всего, является грешник; грамматически возможна и связь с «погибелью» из предыдущей строки: «о ней никогда не вспомнят».'
    reason: alternative_reading
  - marker: b
    text: Глагол «посетит» может также означать «присмотрит», «позаботится». Субъект в греческом тексте не назван; возможно, здесь подразумевается Бог.
    reason: lexical_and_syntactic_ambiguity
  - marker: c
    text: 'Или: «праведных людей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: никогда не
  rationale: Двойное отрицание выражает решительное отрицание; сочетание «никогда не» естественно передаёт его усиленный характер по-русски.
- source_word: μνησθήσεται
  choice: о нём … не вспомнят
  rationale: Греческая страдательная форма буквально означает «не будет вспомянут». Русская неопределённо-личная конструкция звучит естественнее и сохраняет смысл памятования.
- source_word: ἐπισκέπτηται
  choice: посетит
  rationale: Глагол означает посещение, нередко с оттенком внимания или попечения. «Посетит» ближе всего к форме источника и не устраняет возможный библейский смысл посещения.
- source_word: δικαίους
  choice: праведных
  rationale: Прямое и устойчивое обозначение нравственно праведных людей в библейском контексте.
- source_word: implicit subject of μνησθήσεται
  choice: о нём
  rationale: Мужское местоимение следует контекстуальному пониманию, согласно которому речь продолжается о грешнике; примечание сохраняет грамматически возможную связь с погибелью из предыдущей строки.
theological_decisions:
- issue: Не названный в греческом тексте субъект глагола «посетит»
  choice: Сохранено местоимение «он» без уточнения личности
  alternative: 'Уточнить: «когда Бог посетит праведных» или отнести действие к грешнику'
  rationale: Греческий текст не называет субъекта; явное добавление «Бог» либо однозначное отнесение к грешнику сняло бы реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с библейски уместной сдержанностью. Неестественная калька «не будет вспомянут» заменена конструкцией «о нём не вспомнят»; усиление οὐ μή передано словом «никогда». Неявные субъекты не раскрыты догматически.
