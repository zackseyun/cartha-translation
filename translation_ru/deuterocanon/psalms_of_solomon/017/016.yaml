    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: всё, что
  rationale: Передаёт всеохватный смысл и относительную конструкцию естественным современным русским языком.
- source_word: ἐποίησεν
  choice: сделал
  rationale: Сохраняет широкий смысл глагола, не уточняя без достаточных оснований характер совершённых действий.
- source_word: ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Прямое и естественное выражение места действия.
- source_word: καθὼς καὶ
  choice: было подобно тому, что
  rationale: Делает понятной эллиптическую сравнительную конструкцию, не конкретизируя сверх текста точный характер сходства.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: Более буквально передаёт греческое выражение и не выдвигает на первый план противопоставление иудеев и язычников.
- source_word: ἐν ταῖς πόλεσι
  choice: в своих городах
  rationale: Возвратное притяжательное местоимение естественно выражает подразумеваемую принадлежность городов названным народам.
- source_word: τοὺς θεοὺς αὐτῶν
  choice: со своими богами
  rationale: Сохраняет слово «боги», не заменяя его толковательным «идолы»; предлог «со» отражает возможное объектное отношение при эллиптически опущенном глаголе.
