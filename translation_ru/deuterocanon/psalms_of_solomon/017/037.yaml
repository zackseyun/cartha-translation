lexical_decisions:
- source_word: ἐλπιεῖ ἐπὶ
  choice: будет возлагать надежду на
  rationale: Передаёт прямое значение «надеяться на» и одновременно подразумеваемую в военном контексте опору на перечисленные средства, не заменяя надежду более узким понятием доверия.
- source_word: ἵππον καὶ ἀναβάτην καὶ τόξον
  choice: коня, всадника и лук
  rationale: Сохраняет конкретный и лаконичный перечень военных ресурсов; добавлять определение «боевой» нет необходимости.
- source_word: πληθυνεῖ αὐτῷ
  choice: станет копить для себя
  rationale: Буквально глагол означает «умножать, увеличивать», но применительно к золоту и серебру современное русское «копить» естественно выражает накопление, а αὐτῷ передано словами «для себя».
- source_word: χρυσίον οὐδὲ ἀργύριον
  choice: ни золота, ни серебра
  rationale: Повторное οὐδὲ при отрицании естественно передаётся русской конструкцией «ни… ни…»; конкретные названия драгоценных металлов сохранены.
- source_word: εἰς πόλεμον
  choice: на войну
  rationale: В сочетании с накоплением средств оборот указывает на их предназначение; «на войну» кратко и естественно передаёт эту цель.
- source_word: πολλοῖς οὐ συνάξει ἐλπίδας
  choice: не станет черпать надежду во множестве людей
  rationale: Греческое выражение с дательным πολλοῖς сжато и допускает разные оттенки. Перевод передаёт надежду, основанную на многочисленности людей, но не вводит прямо отсутствующее в тексте слово «войско»; буквальная конструкция отмечена в сноске.
- source_word: εἰς ἡμέραν πολέμου
  choice: ко дню битвы
  rationale: Предлог εἰς здесь допускает направленность или подготовку к предстоящему столкновению; «ко дню битвы» сохраняет этот оттенок и естественно звучит по-русски.
theological_decisions:
- issue: Характер надежды на человеческие и военные средства
  choice: Сохранён параллелизм надежды на коня, всадника и лук, накопления богатства и надежды на множество людей.
  alternative: Обобщить всё как отказ полагаться на военную мощь.
  rationale: Обобщение сделало бы богословский смысл явнее, но устранило бы конкретные образы и напряжение исходного перечисления. Перевод не уточняет, на кого вместо этого направлена надежда, поскольку данный стих прямо этого не говорит.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. «Возлагать надежду» сохраняет ключевую лексику текста, тогда как «копить» и «черпать надежду» делают фразу понятной без архаизации. Точка с запятой разграничивает два крупных звена длинного греческого предложения.
