  yaml_path: translation/deuterocanon/psalms_of_solomon/017/038.yaml
  text: The Lord himself is their king[a], the hope of the mighty one in God[d][c][b]; and he will have mercy on all the nations before him in fear.
translation:
  language: ru
  text: Сам Господь — их Царь[a]. Надежда сильного — надежда на Бога[b]; и он помилует все народы перед ним, в страхе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «его Царь» вместо «их Царь»; при таком чтении яснее выражено подчинение давидического правителя Господу.'
    reason: textual_variant
  - marker: b
    text: 'Греческое выражение в этой строке дошло в необычной и, возможно, повреждённой форме. Возможны разные способы его понимания, в том числе: «надежда сильного — в Боге».'
    reason: textual_variant
  - marker: c
    text: 'Или: «с благоговением перед ним»; слово «страх» может обозначать также почтительный трепет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος αὐτὸς
  choice: Сам Господь
  rationale: Передаёт усилительное αὐτός и сохраняет традиционное, понятное обозначение Бога словом «Господь».
- source_word: βασιλεὺς αὐτῶν
  choice: их Царь
  rationale: Следует чтению Свита с местоимением множественного числа αὐτῶν; прописная буква указывает на царское именование Господа, не устраняя различия между Ним и давидическим правителем в контексте.
- source_word: ἐλπὶς τοῦ δυνατοῦ
  choice: Надежда сильного
  rationale: Сохраняет личное значение субстантивированного δυνατός и повтор ключевого слова «надежда», не превращая выражение в отвлечённое «могущество».
- source_word: ἐλπὶθ θεοῦ
  choice: надежда на Бога
  rationale: Передаёт наиболее вероятную направленность надежды к Богу, но трудность и нерегулярность дошедшего греческого чтения отмечены в сноске.
- source_word: ἐλεήσει
  choice: помилует
  rationale: Краткий и естественный русский эквивалент глагола милосердного действия, сохраняющий его богословскую весомость.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: Передаёт широкий смысл ἔθνη без более узкого толкования «язычники».
- source_word: ἐνώπιον αὐτοῦ ἐν φόβῳ
  choice: пребывающие пред ним в страхе
  rationale: «Пред ним» сохраняет пространственно-реляционное значение ἐνώπιον, а «в страхе» — неоднозначность между страхом и благоговейным трепетом; причастие делает синтаксическую связь естественной по-русски.
theological_decisions:
- issue: Соотношение царствования Господа и давидического правителя
  choice: «Сам Господь — их Царь» по основному тексту Свита
  alternative: «Сам Господь — его Царь» по варианту некоторых свидетелей
  rationale: Основной текст представляет Господа высшим Царём народа, тогда как вариант единственного числа прямо подчёркивает подчинённость давидического правителя Господу; вариант сохранён в сноске.
- issue: К кому относится подлежащее глагола «помилует»
  choice: Местоимение «он» оставлено со строчной буквы
  alternative: «Он» как однозначное указание на Господа либо явное повторение существительного
  rationale: Греческий глагол допускает восстановление подлежащего из контекста, а соседнее упоминание «сильного» создаёт потенциальное напряжение. Строчная буква не вводит в перевод лишнего однозначного толкования.
- issue: Смысл выражения ἐν φόβῳ
  choice: «в страхе»
  alternative: «с благоговением» или «в благоговейном трепете»
  rationale: Буквальная формулировка сохраняет возможность как страха, так и почтительного трепета перед царём.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Пред ним» выбрано вместо разговорно-нейтрального «перед ним» ради достоинства регистра; синтаксис разделён точкой после первой независимой части в соответствии с сильной пунктуацией греческого текста.
