lexical_decisions:
- source_word: ὑψώσον
  choice: возвысь
  rationale: Императив ὑψόω передаёт возвышение или вознесение избранной фигуры; «возвысь» сохраняет этот образ и высокий, но понятный регистр.
- source_word: ἰσχὺν
  choice: в силе
  rationale: Винительный падеж здесь допускает наречное понимание или указание на образ действия. «В силе» сохраняет компактность и некоторую неоднозначность греческой конструкции, не сводя её однозначно к наделению силой.
- source_word: θραῦσαι
  choice: чтобы он сокрушил
  rationale: Инфинитив выражает цель. Личная конструкция естественна по-русски, а «сокрушил» передаёт сильное значение разрушения или слома.
- source_word: ἄρχοντας
  choice: правителей
  rationale: Слово обозначает лиц, обладающих властью; «правители» ясно и достаточно широко передаёт политический смысл.
- source_word: ἀδίκους
  choice: несправедливых
  rationale: В отношении правителей прилагательное имеет нравственно-общественный оттенок неправедного и несправедливого управления; «несправедливых» естественно передаёт его здесь.
