    text: 'Или: «сердце его было отчуждено от нашего Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀλλοτριότητι
  choice: как чужак
  rationale: Оборот передаёт чуждость врага; в данном контексте он может указывать не только на отчуждение, но и на положение иноплеменного захватчика. Русское «как чужак» естественно и сохраняет связь с прилагательным ἀλλοτρία во второй части стиха.
- source_word: ὁ ἐχθρός
  choice: враг
  rationale: Прямой и естественный русский эквивалент.
- source_word: ἐποίησεν
  choice: поступал
  rationale: Глагол употреблён без прямого дополнения и обозначает образ действий; «поступал» естественно выражает это по-русски.
- source_word: ἐν ὑπερηφανίᾳ
  choice: с гордостью
  rationale: Передаёт отрицательно окрашенную надменность и при этом звучит ясно и современно.
- source_word: ἀλλοτρία ἀπὸ τοῦ θεοῦ ἡμῶν
  choice: было чуждо нашему Богу
  rationale: Сохраняет конструкцию с ἀπό и двусмысленность между непричастностью, чуждостью и отчуждением, не предполагая непременно прежней близости к Богу.
- source_word: ἡ καρδία αὐτοῦ
  choice: сердце его
  rationale: Традиционное и понятное библейское обозначение внутреннего человека; порядок слов поддерживает возвышенный регистр.
theological_decisions:
- issue: Характер чуждости врага Богу
  choice: «чужак» / «чуждо»
  alternative: «в отчуждении» / «было отчуждено»
  rationale: Формулировка не утверждает, что враг прежде состоял в заветной близости с Богом, а затем отпал; она допускает исторический смысл иноплеменного врага и одновременно сохраняет нравственно-религиозную чуждость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Повтор «чужак — чуждо» намеренно отражает общий корень ἀλλοτριότης / ἀλλότριος; пунктуация сохраняет двухчастную структуру греческого текста.
