  text: The enemy acted in estrangement[a], in pride[c][b]; and his heart was estranged from our God.
translation:
  language: ru
  text: Враг поступил как чужак[a], с гордостью; и сердце его было чуждо нашему Богу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
