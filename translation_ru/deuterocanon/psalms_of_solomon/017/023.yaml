translation:
  language: ru
  text: Взгляни, Господи, и воздвигни для них их царя, сына Давида, в срок, который Ты усмотрел, Боже, чтобы Твой слуга[a] царствовал над Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раб». Греческое слово может обозначать слугу, раба или отрока; здесь оно относится к царю, который будет царствовать над Израилем.'
    reason: Сохраняет смысловой диапазон παῖς и разъясняет синтаксическую связь, способную вызвать неоднозначность в переводе.
lexical_decisions:
- source_word: ἴδε
  choice: Взгляни
  rationale: Передаёт повелительное «посмотри/воззри» естественным современным русским языком, сохраняя торжественное молитвенное обращение.
- source_word: ἀνάστησον
  choice: воздвигни
  rationale: В данном контексте означает поставить, явить или поднять царя; «воздвигни» сохраняет образность и уместный библейский регистр.
- source_word: υἱὸν Δαυίδ
  choice: сына Давида
  rationale: Приложение к «их царя»; русский язык не требует передачи отсутствующего в греческом артикля неопределённым местоимением.
- source_word: εἰς τὸν καιρὸν ὃν ἴδες σύ
  choice: в срок, который Ты усмотрел
  rationale: Сохраняет буквальный образ «который Ты увидел», но передаёт контекстуальный смысл назначенного Богом времени без добавления идеи произвольного выбора.
- source_word: παῖδά σου
  choice: Твой слуга
  rationale: По греческому синтаксису это подлежащее инфинитива «царствовать» и относится к будущему царю, а не к Израилю. «Слуга» естественно передаёт служение Богу, при этом вариант «раб» отмечен в сноске.
theological_decisions:
- issue: Определённость выражения «сын Давида»
  choice: сына Давида
  alternative: одного из сыновей Давида
  rationale: Греческое выражение стоит как характеристика или титульное приложение к «их царю». Отсутствие артикля само по себе не требует неопределённого смысла; русский перевод не должен искусственно решать вопрос добавлением «одного».
- issue: К кому относится παῖδά σου («Твой слуга/раб»)?
  choice: к царю, который будет царствовать
  alternative: к Израилю («над Израилем, Твоим слугой»)
  rationale: В конструкции τοῦ βασιλεῦσαι ἐπʼ Ἰσραὴλ παῖδά σου винительный падеж παῖδά σου естественно обозначает субъект инфинитива βασιλεῦσαι, тогда как Израиль является объектом предлога ἐπί.
translation_notes:
  register: Современный литературный русский с умеренно торжественным молитвенным звучанием. Формы «воздвигни» и «Боже» поддерживают библейский регистр, не делая весь стих архаичным.
