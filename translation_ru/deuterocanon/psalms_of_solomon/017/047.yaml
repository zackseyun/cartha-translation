  source_fidelity: 'Основные соответствия сохранены: εὐπρέπεια передано как «величие», ἔγνω — как «знал», ἀναστῆσαι — как «воздвигнуть», а παιδεῦσαι — как «воспитать». Однако в русском тексте относительное «которое знал Бог» синтаксически тяжеловесно и не позволяет естественно связать последующие инфинитивы с божественным действием. Смысловая неоднозначность ἔγνω не должна устраняться.'
  naturalness: '«Таково величие царя Израиля, которое знал Бог» звучит по-русски неестественно: глагол «знать» в таком сочетании обычно требует конструкции «о котором знал». Перестройка с «о котором» делает фразу современной литературной русской, не меняя референта и не навязывая значения предведения, избрания или одобрения.'
  terminology: «Дом Израиля», «воздвигнуть» и «воспитать» уместны. «Величие» допустимо для εὐπρέπεια, хотя «великолепие» также возможно; замена не необходима. В примечании a «предузнал» следует сохранить как альтернативу, но не вводить в основной текст.
