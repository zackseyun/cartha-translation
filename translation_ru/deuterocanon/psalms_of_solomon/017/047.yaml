lexical_decisions:
- source_word: εὐπρέπεια
  choice: величие
  rationale: Слово обозначает красоту, достоинство и внушительность; «величие» естественно передаёт его царственный оттенок, не сводя смысл лишь к внешнему блеску.
- source_word: ἔγνω
  choice: знал
  rationale: Прямое соответствие сохраняет широту греческого глагола и возможный библейский оттенок избрания или предведения, не закрепляя ни один из этих смыслов в основном тексте.
- source_word: ἀναστῆσαι
  choice: воздвигнуть
  rationale: Глагол сохраняет образ того, что Бог поднимает и ставит царя на предназначенное ему место; перевод не сужает значение до формального назначения.
- source_word: ἐπʼ οἶκον Ἰσραήλ
  choice: над домом Израиля
  rationale: Предлог с винительным падежом здесь естественно выражает поставление царя над народом; «дом Израиля» сохраняет исходное собирательное выражение.
- source_word: παιδεῦσαι
  choice: воспитать
  rationale: Глагол охватывает обучение, формирование и исправляющую дисциплину. «Воспитать» передаёт формирующий смысл и оставляет более строгие оттенки для примечания.
theological_decisions:
- issue: Означает ли Божье знание царя простое знание, предведение, избрание или одобрение
  choice: знал
  alternative: предузнал; признал; одобрил
  rationale: Форма ἔγνω сама по себе не требует одного узкого догматического толкования. Буквальный глагол «знал» сохраняет богословскую насыщенность и неоднозначность.
- issue: Синтаксическая связь инфинитивов ἀναστῆσαι и παιδεῦσαι
  choice: 'пояснение после двоеточия: «воздвигнуть… и воспитать»'
  alternative: «которое Бог явил, воздвигнув… и воспитав…»
  rationale: Инфинитивы могут пояснять содержание Божьего знания или замысла; двоеточие сохраняет эту связь, не превращая их безоговорочно в обстоятельства совершённого действия.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Инверсия и двоеточие отражают сжатый греческий синтаксис; местоимения последовательно относятся к царю.
