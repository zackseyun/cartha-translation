  text: И они не прославили Твоё чтимое имя; во славе они установили царство вместо своего возвышения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместо их высокого положения». Буквально: «вместо их возвышения». Слово «возвышение» может пониматься как высокое положение, а контекстуально — как гордость; поэтому встречается также толковательный перевод: «из-за своей гордыни».'
    reason: Сохраняет непосредственное значение ἀντὶ ὕψους αὐτῶν и отмечает, не подменяя основной текст, контекстуальное толкование заключительной фразы.
lexical_decisions:
- source_word: οὐκ ἐδόξασαν
  choice: не прославили
  rationale: Сохраняет прямое значение δοξάζω — воздавать славу, прославлять — и естественно звучит в обращении к Богу.
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: Твоё чтимое имя
  rationale: ἔντιμος обозначает то, что почитают и высоко ценят. «Чтимое» передаёт это значение без архаической тяжеловесности.
- source_word: ἐν δόξῃ
  choice: с пышностью
  rationale: Здесь δόξα, вероятно, характеризует внешнее великолепие и торжественность учреждения царства. «С пышностью» отличает эту человеческую помпезность от славы, которую следовало воздать Богу.
- source_word: ἔθεντο
  choice: утвердили
  rationale: В сочетании с βασίλειον форма τίθημι означает учреждение или установление политического порядка; «утвердили» естественно передаёт этот смысл.
- source_word: βασίλειον
  choice: царство
  rationale: Слово может обозначать царство, царскую власть или царский дом. «Царство» сохраняет наиболее прямой и наименее уточняющий вариант.
- source_word: ἀντὶ ὕψους αὐτῶν
  choice: из-за своей гордыни
  rationale: В данном контексте ὕψος может обозначать гордость или высокомерие, а ἀντί с родительным — основание или побуждение. Перевод даёт связный контекстуальный смысл, тогда как более буквальное понимание сохранено в сноске.
