lexical_decisions:
- source_word: πάροικος
  choice: пришелец
  rationale: Слово обозначает человека, живущего среди народа без статуса коренного жителя. «Пришелец» сохраняет этот смысл и соответствует возвышенному библейскому регистру.
- source_word: ἀλλογενής
  choice: иноплеменник
  rationale: Термин подчёркивает принадлежность к иному народу или роду; «иноплеменник» позволяет отличить его от πάροικος.
- source_word: παροικήσει
  choice: поселится среди них
  rationale: Глагол означает проживание на чужой земле или среди чужого народа. «Поселится» естественно по-русски и отчасти сохраняет смысловую связь с существительным πάροικος.
- source_word: λαούς
  choice: народы
  rationale: Множественное «народы» передаёт собирательное значение и сохраняет отличие от следующего ἔθνη.
- source_word: ἔθνη
  choice: племена
  rationale: В паре с λαούς перевод «племена» сохраняет два разных обозначения человеческих общностей и не сливает их в одно повторённое слово.
- source_word: σοφίᾳ
  choice: мудрости
  rationale: В царско-судебном контексте слово обозначает мудрое разумение, которым руководствуется судящий.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: «Праведность» сохраняет более широкий нравственный смысл δικαιοσύνη; возможное судебное значение «справедливость» отмечено в сноске.
- source_word: διάψαλμα
  choice: Села
  rationale: Традиционная транслитерация сохраняет неопределённость литургического или музыкального термина и не навязывает ему точного толкования.
theological_decisions:
- issue: Значение δικαιοσύνη в контексте царского суда
  choice: своей праведности
  alternative: своей справедливости
  rationale: Контекст суда допускает «справедливость», однако «праведность» не сужает выражение до одной судебной функции и сохраняет указание на нравственное качество судящего.
- issue: Связь родительного δικαιοσύνης с σοφίᾳ
  choice: в мудрости своей праведности
  alternative: с мудростью и праведностью
  rationale: Формулировка сохраняет зависимость родительного падежа и присущую греческому выражению смысловую напряжённость, не превращая два понятия в независимую пару.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Конструкция «ни… ни… не» естественно передаёт отрицание при двух однородных подлежащих; точка с запятой сохраняет деление греческой фразы.
