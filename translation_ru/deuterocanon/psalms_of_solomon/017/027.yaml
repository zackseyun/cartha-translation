lexical_decisions:
- source_word: ὀλοθρεῦσαι
  choice: истребить
  rationale: Передаёт решительную силу аористного инфинитива и естественно сочетается с объектом «народы», не усиливая значение до обязательного полного уничтожения.
- source_word: ἔθνη παράνομα
  choice: беззаконные народы
  rationale: «Народы» передаёт ἔθνη без позднейшего узкотехнического смысла «язычники», а «беззаконные» сохраняет связь παράνομα с законом.
- source_word: ἐν λόγῳ στόματος αὐτοῦ
  choice: словом своих уст
  rationale: Сохраняет конкретный образ суда, совершаемого словом, и звучит естественно в современном литературном русском с библейской торжественностью.
- source_word: ἐν ἀπειλῇ αὐτοῦ
  choice: при его угрозе
  rationale: 'Передаёт обстоятельственное значение ἐν: бегство народов происходит в ответ на его угрозу; формулировка не уточняет сверх текста, является ли угроза только средством или также поводом.'
- source_word: φυγεῖν ἔθνη ἀπὸ προσώπου αὐτοῦ
  choice: чтобы народы бежали от его лица
  rationale: Русская конструкция с «чтобы» ясно передаёт зависимый инфинитив, а «от его лица» сохраняет традиционный пространственно-судебный образ греческого выражения.
- source_word: ἐλέγξαι
  choice: обличить
  rationale: Глагол допускает значения выявления вины, порицания и изобличения. «Обличить» сохраняет эту широту и уместную здесь судебно-нравственную силу.
- source_word: ἐν λόγῳ καρδίας αὐτῶν
  choice: словом их сердца
  rationale: Сохраняет сжатый и необычный образ внутренней речи, а также единственное число καρδίας при множественном антецеденте, не разрешая неоднозначность толкованием.
theological_decisions:
- issue: Суд мессианского правителя посредством речи
  choice: Сохранено прямое указание на истребление, бегство и обличение посредством слова и угрозы правителя.
  alternative: Понимать слово и угрозу лишь как отвлечённые символы верховной власти.
  rationale: Греческий текст последовательно подчёркивает λόγος, στόμα и ἀπειλή; перевод сохраняет эту образность, не привнося позднейших доктринальных объяснений.
- issue: Смысл «слова их сердца»
  choice: Сохранена грамматически сжатая формулировка «словом их сердца».
  alternative: Развернуть как «тем, что говорят их сердца», «их собственными помыслами» или связать сердце с обличающим правителем.
  rationale: Синтаксис допускает понимание внутренней речи или намерения самих грешников, но не выражает это достаточно явно, чтобы закреплять одно толкование в основном тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Местоимения, относящиеся к правителю, даны со строчной буквы, поскольку греческий текст сам по себе не требует конфессионально обусловленной капитализации. Параллельная цепочка целевых действий сохранена конструкциями с «чтобы».
