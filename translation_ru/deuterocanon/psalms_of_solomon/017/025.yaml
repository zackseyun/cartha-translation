lexical_decisions:
- source_word: καθάρισον
  choice: очисти
  rationale: Аористный императив выражает решительный призыв к очищению; «очисти» сохраняет как религиозный, так и общественно-политический оттенок.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
- source_word: ἐθνῶν
  choice: народов
  rationale: Слово может обозначать народы вообще или язычников. В данном контексте речь идёт о чужеземных народах, угнетающих Иерусалим; «народы» не сужает смысл без необходимости.
- source_word: καταπατούντων
  choice: попирающих
  rationale: Причастие передаёт образ враждебного господства и унизительного подавления; «попирающих» сохраняет силу греческого образа и соответствует возвышенному регистру.
- source_word: ἐν ἀπωλείᾳ
  choice: на погибель
  rationale: Оборот выражает разрушительный результат или направленность попрания. «На погибель» близко передаёт компактность греческого выражения, не уточняя сверх текста, чья именно погибель подразумевается.
- source_word: ἐν σοφίᾳ
  choice: в мудрости
  rationale: Буквально и естественно передаёт обстоятельство образа действия или средства, не устраняя присущую греческому тексту смысловую компактность.
- source_word: ἐν δικαιοσύνῃ
  choice: в праведности
  rationale: «Праведность» сохраняет широкий нравственный и богословский диапазон δικαιοσύνη; контекстуально возможная «справедливость» указана в примечании.
theological_decisions:
- issue: Передавать ли ἐθνῶν как «народы» или как «язычники».
  choice: народы
  alternative: язычники
  rationale: «Народы» передаёт непосредственный образ чужеземных сил и не вводит более узкое религиозно-этническое противопоставление, хотя оно остаётся возможным.
- issue: К чему относятся заключительные обороты ἐν σοφίᾳ и ἐν δικαιοσύνῃ.
  choice: 'В основном тексте они поставлены перед повелением и относятся к просьбе очистить Иерусалим: «в мудрости и праведности очисти».'
  alternative: Обороты могут восприниматься как относящиеся к суду над народами или их удалению; порядок греческого текста допускает некоторую синтаксическую неоднозначность.
  rationale: Начальная позиция обеспечивает ясную и естественную русскую фразу, а примечание сохраняет более буквальный порядок и заложенную в нём неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-поэтической речи. Формы «очисти», «попирающих», «на погибель» сохраняют торжественный регистр, оставаясь понятными современному читателю; местоимение «его» согласовано с русским грамматическим родом названия «Иерусалим».
