  source_fidelity: В первой части греческое ἀποδώσεις — будущее изъявительное («Ты воздашь»), а не повелительная форма. Во второй части сохранено оптативное пожелание; «получат» является естественным русским смысловым соответствием без уточнения того, что именно будет им дано.
  naturalness: «По их грехам Ты воздашь им» и «пусть получат они по их делам» звучат естественно в современном литературном русском при умеренно возвышенном молитвенном регистре. «Да будет им» в исходном варианте слишком неопределённо и не передаёт естественно подразумеваемый результат греческого оборота.
  terminology: «Грехи», «воздашь», «Боже» и «дела» точно и последовательно передают ключевую лексику. Обращение «Боже» уместно; написание «Ты» отражает прямое обращение в русском религиозно-литературном регистре.
