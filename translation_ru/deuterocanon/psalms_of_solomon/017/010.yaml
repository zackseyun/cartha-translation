lexical_decisions:
- source_word: κατὰ τὰ ἁμαρτήματα αὐτῶν
  choice: по мере их грехов
  rationale: κατά с винительным обозначает меру или норму воздаяния; «по мере» естественно передаёт соразмерность, не ослабляя судебного смысла.
- source_word: ἀποδώσεις αὐτοῖς
  choice: воздай им
  rationale: Будущее ἀποδώσεις в молитвенном обращении по-русски естественно передаётся повелительной формой «воздай», выражающей просьбу о Божьем возмездии; буквальное «Ты воздашь» также возможно.
- source_word: ὁ θεός
  choice: Боже
  rationale: Формально именительный падеж употреблён как обращение; русский звательный остаток «Боже» сохраняет молитвенный и возвышенный тон.
- source_word: εὑρεθείη αὐτοῖς
  choice: да будет им
  rationale: Оптатив передаёт пожелание. Греческое выражение буквально означает «да найдётся им», но в контексте естественно понимается как то, что выпадет им или постигнет их.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: по их делам
  rationale: Оборот обозначает соответствие воздаяния поступкам; «дела» сохраняет традиционную библейскую лексику и формальную связь с ἔργα.
theological_decisions:
- issue: Характер второй части стиха
  choice: 'Сохранено пожелание: «да будет им»'
  alternative: 'Утверждение или прямое повеление: «воздай им по их делам»'
  rationale: Оптатив εὑρεθείη грамматически выражает пожелание; его не следует превращать в категорическое утверждение или сливать с первым глаголом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным регистром. Параллелизм двух частей сохранён; архаизмы сведены к уместному обращению «Боже».
