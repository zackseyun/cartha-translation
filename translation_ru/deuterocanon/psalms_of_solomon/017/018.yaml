  source_fidelity: Первая половина точно передаёт греческий текст и сохраняет неуточнённый референт ἀπʼ αὐτῶν («от них»). «Словно воробьи» хорошо передаёт ὡς στρουθία. Однако «гнездовье» означает скорее место гнездования/совокупность гнёзд и не является точным соответствием κοίτη — «месту лежания, покоя»; в птичьем сравнении уместно «гнездо». Английское audit-решение «nest» поддерживает эту контекстуальную передачу.
