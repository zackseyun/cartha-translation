  text: Those who loved the assemblies of the holy ones fled from them; like sparrows they flew away from their nest.
translation:
  language: ru
  text: Любившие собрания святых бежали от них; словно воробьи, они разлетелись из своего гнезда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «от места своего отдыха (лежания)».'
    reason: Указывает буквальное значение κοίτη; «гнездо» контекстуально передаёт птичий образ.
lexical_decisions:
- source_word: συναγωγὰς ὁσίων
  choice: собрания святых
  rationale: 'Передаёт «собрания людей, верных Богу»: συναγωγή здесь означает собрание, а ὅσιοι — святых или благочестивых. Краткое «святых» сохраняет достоинство и ёмкость греческого выражения.'
- source_word: ἔφυγοσαν ἀπʼ αὐτῶν
  choice: бежали от них
  rationale: Сохраняет прямое значение глагола φεύγω и местоименную неопределённость исходного текста, не подставляя явно названного преследователя или места.
- source_word: ὡς στρουθία ἐξεπετάσθησαν
  choice: словно воробьи, они разлетелись
  rationale: Стρουθία — маленькие птицы, обычно воробьи; ἐξεπετάσθησαν описывает их стремительный разлёт. «Разлетелись» естественно передаёт образ группы, покидающей прежнее место.
- source_word: ἀπὸ κοίτης αὐτῶν
  choice: из своего гнездовья
  rationale: Κοίτη буквально обозначает место лежания или отдыха. В сравнении с воробьями «гнездовье» естественно выражает птичье место пребывания, не превращая его непременно в одно отдельное гнездо.
theological_decisions:
- issue: Кого обозначает местоимение αὐτῶν в выражении «бежали от них»
  choice: Сохранить местоимение «них» без поясняющей подстановки
  alternative: Назвать предполагаемых гонителей или врагов по ближайшему контексту
  rationale: Сам стих использует местоимение и зависит от контекста; конкретизация внутри перевода могла бы необоснованно снять референциальную неоднозначность.
- issue: Значение ὅσιοι
  choice: святые
  alternative: благочестивые / верные Богу
  rationale: «Святые» — естественное религиозное обозначение посвящённых и верных Богу людей, при этом оно не вводит узкой конфессиональной категории.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью псалма. Синтаксический параллелизм и образ внезапно разлетающихся птиц сохранены; местоименная неоднозначность греческого текста не устранена.
