  terminology: «Собрания святых» — допустимая, нейтральная передача συναγωγὰς ὁσίων; она не навязывает конфессионального смысла. «Любившие» и «бежали от них» сохраняют сжатый регистр и синтаксическую неопределённость оригинала.
