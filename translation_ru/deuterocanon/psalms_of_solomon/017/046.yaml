lexical_decisions:
- source_word: ἐν ἰσότητι
  choice: по справедливости
  rationale: ἰσότης может обозначать равенство или беспристрастную, справедливую меру. В контексте правления естественное русское выражение «по справедливости» передаёт характер руководства, не превращая строку в отвлечённое утверждение о равенстве.
- source_word: πάντας αὐτοὺς
  choice: их всех
  rationale: Сохраняет подчёркнутую всеохватность греческого оборота и естественно звучит по-русски.
- source_word: ἄξει
  choice: поведёт
  rationale: Обычное значение ἄγω — «вести»; форма «поведёт» сохраняет образ руководства и возможный пастырский оттенок контекста.
- source_word: ὑπερηφανία
  choice: высокомерие
  rationale: Передаёт не просто внутреннюю гордость, а надменность и склонность возвышаться над другими, что соответствует социальному контексту строки.
- source_word: τοῦ καταδυναστευθῆναι
  choice: чтобы кто-либо подвергался угнетению
  rationale: Сохраняет формально пассивный инфинитив καταδυναστευθῆναι и трудную смысловую связь с «высокомерием». Неясность конструкции не устраняется заменой пассива на активное «угнетать».
- source_word: ἐν αὐτοῖς
  choice: среди них
  rationale: Для сообщества людей это естественный русский эквивалент; повтор сохранён, поскольку соответствующий оборот дважды присутствует в греческом тексте.
theological_decisions:
- issue: Общественный характер правления царя
  choice: Строка говорит о справедливом руководстве и об отсутствии внутри народа высокомерия, связанного с угнетением.
  alternative: Понимать ἰσότης как отвлечённое равенство либо активным переводом прямо назвать высокомерных членов общины угнетателями.
  rationale: Греческий текст ясно связывает царское руководство со справедливостью и отсутствием надменного господства, но пассивная форма последнего инфинитива оставляет синтаксическую напряжённость. Перевод сохраняет социально-нравственный смысл, не добавляя более узкого доктринального толкования.
translation_notes:
  register: Современный литературный русский язык, сдержанный и возвышенный без архаизмов. Формулировка основного текста намеренно сохраняет пассивную форму и повтор «среди них», отражая трудность греческого текста; сноска поясняет вероятный смысл.
