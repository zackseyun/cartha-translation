    text: 'Буквально: «и не будет среди них высокомерия, [чтобы/для того] быть угнетённым среди них». Греческий инфинитив имеет страдательную форму, а вся конструкция трудна для истолкования. Вероятный смысл: среди них не будет надменного господства, из-за которого одни угнетают других.'
