  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могуществе»; возможно также: «с силой».'
    reason: Лексема ἰσχύς и конструкция ἐν ἰσχύϊ допускают близкие варианты передачи, между которыми контекст не позволяет сделать бесспорный выбор.
lexical_decisions:
- source_word: εὐλογία
  choice: благословение
  rationale: Прямой и естественный эквивалент существительного, сохраняющий как действие благословения, так и даруемое благо.
- source_word: Κυρίου
  choice: Господа
  rationale: 'Родительный падеж передаёт принадлежность или источник: «благословение Господа».'
- source_word: μετʼ αὐτοῦ
  choice: с ним
  rationale: μετά с родительным падежом обычно означает совместность; перевод не добавляет идеи «на нём» или «сопровождает его».
- source_word: ἐν ἰσχύϊ
  choice: в силе
  rationale: Формально сохраняет предложную конструкцию и многозначность ἰσχύς, которое может обозначать силу, могущество или мощь.
- source_word: '[подразумеваемая связка]'
  choice: пребывает
  rationale: В греческом глагольная связка отсутствует. «Пребывает» делает русскую фразу грамматически и стилистически естественной и передаёт устойчивое присутствие благословения, не меняя основной мысли.
