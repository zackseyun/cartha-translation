base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/041.yaml
  text: And he himself will be pure from sin[a], to rule great peoples, to rebuke rulers[c][b], and to remove sinners by the strength of his word.
translation:
  language: ru
  text: И сам он будет чист от греха[a], чтобы править великими народами, обличать правителей и устранять грешников[b] силой слова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непричастен греху».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изгонять грешников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρὸς ἀπὸ ἁμαρτίας
  choice: чист от греха
  rationale: Передаёт образ нравственной чистоты, выраженный καθαρός, и прямо сохраняет конструкцию отделения от греха; речь не о ритуальной чистоте.
- source_word: ἄρχειν
  choice: править
  rationale: Естественно обозначает осуществление власти и соответствует царскому контексту, не сужая значение до конкретной формы правления.
- source_word: λαοὺς μεγάλους
  choice: великими народами
  rationale: Сохраняет множественное число λαοί и прямое значение μεγάλους, не подменяя «народы» государственно-политическим словом «нации».
- source_word: ἐλέγξαι
  choice: обличать
  rationale: Передаёт властное порицание и выявление неправоты правителей; слово уместно в судебно-царском контексте.
- source_word: ἐξᾶραι
  choice: устранять
  rationale: Сохраняет широкий смысл удаления, не уточняя без достаточных оснований, идёт ли речь об изгнании, отстранении или уничтожении.
- source_word: ἐν ἰσχύϊ λόγου
  choice: силой слова
  rationale: Точно передаёт действенную мощь речи. Притяжательное местоимение в греческом отсутствует, поэтому оно не добавлено, хотя по контексту слово естественно связывается с действующим лицом.
theological_decisions:
- issue: Нравственная чистота мессианского правителя
  choice: чист от греха
  alternative: свободен от греха / непричастен греху
  rationale: «Чист» сохраняет собственный образ καθαρός и прямо утверждает нравственную чистоту, не вводя более позднюю догматическую терминологию и не заменяя образ чистоты понятием свободы.
- issue: Принадлежность действенного слова
  choice: силой слова
  alternative: силой своего слова
  rationale: В исходном тексте при λόγου нет притяжательного местоимения. Беспредложное русское выражение сохраняет эту формальную неопределённость, при этом контекст допускает понимание слова как речи самого правителя.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтическо-царского контекста. Инфинитивы переданы однородными целевыми конструкциями после «чтобы». Связка «будет» восстановлена по контексту, поскольку в греческой именной конструкции она не выражена явно.
