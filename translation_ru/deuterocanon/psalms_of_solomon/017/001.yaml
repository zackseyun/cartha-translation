base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/001.yaml
  text: O Lord[a], you are our King forever and ever; for in you, our God[b], our soul will boast.
translation:
  language: ru
  text: Господи, Ты — наш Царь во веки веков[a], ибо Тобой, Боже наш, будет хвалиться наша душа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на век и ещё далее»; возможно также: «навеки».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет гордиться»; возможен также оттенок: «будет торжествовать, прославляя Тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος в прямом обращении к Богу естественно и традиционно передаётся русским звательным обращением «Господи».
- source_word: Βασιλεὺς
  choice: Царь
  rationale: «Царь» прямо передаёт образ царского правления Бога и соответствует возвышенному, но понятному регистру псалма.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: во веки веков
  rationale: Устойчивое русское выражение естественно передаёт усиленное указание на нескончаемую длительность; буквальная необычность сочетания отмечена в сноске.
- source_word: ἐν σοὶ
  choice: Тобой
  rationale: При русском глаголе «хвалиться» творительный падеж естественно передаёт основание и предмет хвалы, выраженные греческим ἐν с дательным.
- source_word: καυχήσεται
  choice: будет хвалиться
  rationale: Сохраняет основное значение глагола — хвалиться, ставить кого-либо предметом своей хвалы, — не устраняя возможного оттенка торжества.
- source_word: ἡ ψυχὴ ἡμῶν
  choice: наша душа
  rationale: Сохраняет греческое единственное число с местоимением множественного числа и тем самым коллективный образ единой души общины.
theological_decisions:
- issue: Предмет хвалы в выражении ἐν σοὶ
  choice: «Тобой … будет хвалиться»
  alternative: «о Тебе будет ликовать»
  rationale: Выбранный вариант сохраняет прямую направленность хвалы на Бога и более точно отражает καυχάομαι, не сводя его только к эмоциональному ликованию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Формы «Господи» и «Боже наш» естественно обозначают прямое обращение; порядок слов в целом современный, а образ «наша душа» сохранён без истолковывающего перефразирования.
