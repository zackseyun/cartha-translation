  text: Κύριε, σύ Βασιλεὺς ἡμῶν εἰς τὸν αἰῶνα καὶ ἔτι· ὅτι ἐν σοὶ, ὁ θεὸς ἡμῶν, καυχήσεται ἡ ψυχὴ ἡμῶν.
