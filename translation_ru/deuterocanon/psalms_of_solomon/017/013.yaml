  text: The lawless one laid waste our land, emptying it of its inhabitants; they wiped out young and old, and their children together.
translation:
  language: ru
  text: Беззаконник опустошил нашу землю, лишив её жителей; они[a] истребили и молодых, и старых, а вместе с ними — их детей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте подлежащее сначала стоит в единственном числе («беззаконник»), а затем глагол неожиданно переходит во множественное («они истребили»). Перевод сохраняет эту смену, не сглаживая её.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἠρήμωσεν
  choice: опустошил
  rationale: Передаёт разрушительное превращение земли в безлюдное, разорённое место и естественно сочетается со словом «землю».
- source_word: ὁ ἄνομος
  choice: беззаконник
  rationale: Сохраняет определённое лицо в единственном числе и прямую связь ἄνομος с нарушением закона, не расширяя значение до общего «нечестивец».
- source_word: ἀπὸ ἐνοικούντων αὐτήν
  choice: лишив её жителей
  rationale: 'Естественно по-русски выражает подразумеваемый результат: земля опустошена удалением тех, кто жил на ней.'
- source_word: ἠφάνισαν
  choice: истребили
  rationale: Передаёт уничтожение людей и соответствует высокому, но понятному повествовательному регистру.
- source_word: νέον καὶ πρεσβύτην
  choice: и молодых, и старых
  rationale: Естественная русская возрастная меризма, охватывающая обе крайности, без неуместной буквальной скованности единственного числа.
- source_word: τέκνα αὐτῶν ἅμα
  choice: а вместе с ними — их детей
  rationale: 'Сохраняет принадлежность детей названным людям и силу ἅμα: дети были уничтожены одновременно и вместе с ними.'
