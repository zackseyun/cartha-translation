  source_fidelity: 'Перевод точно передаёт ключевые элементы греческого текста: единственное число «Беззаконник» (ὁ ἄνομος), опустошение земли вследствие утраты жителей (ἠρήμωσεν … ἀπὸ ἐνοικούντων αὐτήν), а затем намеренно сохранённый переход к глаголу во множественном числе (ἠφάνισαν). Возрастная пара «молодых и старых» естественно выражает греческую меризму νέον καὶ πρεσβύτην. Формула «а вместе с ними — их детей» адекватно передаёт включительное ἅμα, не снимая связи детей с ранее названными людьми.'
