base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/006.yaml
  text: And in our sins sinners rose up against us[a]; they attacked us and drove us out[c][b]. Those to whom you had not promised it took it away by force.
translation:
  language: ru
  text: И из-за наших грехов восстали против нас грешники; они напали на нас и изгнали нас. Те, кому Ты не обещал, силой отняли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте не сказано прямо, что именно они отняли.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἁμαρτίαις ἡμῶν
  choice: из-за наших грехов
  rationale: Предложное сочетание связывает нашествие грешников с грехами общины. По-русски причинный оборот естественно передаёт эту связь, не уточняя сверх текста, было ли нашествие наказанием.
- source_word: ἐπανέστησαν ἡμῖν
  choice: восстали против нас
  rationale: Глагол обозначает враждебное выступление; этот перевод сохраняет образ восстания и направленность действия.
- source_word: ἐπέθεντο ἡμῖν
  choice: напали на нас
  rationale: В контексте насилия и изгнания это естественная современная передача враждебного нападения.
- source_word: ἐξώσαντο ἡμᾶς
  choice: изгнали нас
  rationale: Глагол выражает принудительное удаление; «изгнали» ясно и достойно передаёт его смысл.
- source_word: οἷς οὐκ ἐπηγγείλω
  choice: те, кому Ты не обещал
  rationale: οἷς — дательный падеж мужского рода множественного числа, относящийся к грешникам, а ἐπηγγείλω — форма второго лица единственного числа. Заглавная буква сохраняет продолжающееся из предыдущего контекста обращение к Богу.
- source_word: μετὰ βίας ἀφείλαντο
  choice: силой отняли
  rationale: Оборот передаёт насильственное завладение, при этом объект глагола, отсутствующий в греческом тексте, не добавляется.
theological_decisions:
- issue: Лицо говорящего в οὐκ ἐπηγγείλω
  choice: 'Передать как обращение к Богу во втором лице: «Ты не обещал».'
  alternative: 'Понять форму как первое лицо: «я не обещал», либо обезличить: «им не было обещано».'
  rationale: Форма ἐπηγγείλω является вторым лицом единственного числа и продолжает прямое обращение к Господу из контекста; её нельзя смешивать с первым лицом.
- issue: Не выраженный объект при ἀφείλαντο
  choice: 'Оставить объект подразумеваемым: «силой отняли».'
  alternative: Добавить «это», «царство» или «наследие».
  rationale: Греческий текст не называет отнятый предмет. Его уточнение устранило бы намеренную или контекстуальную недосказанность и внесло бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Синтаксис остаётся ясным для широкого читателя; повтор «нас» сохранён вслед за настойчивой последовательностью греческого текста. Местоимение «Ты» написано с прописной буквы как прямое обращение к Богу.
