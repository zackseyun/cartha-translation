  yaml_path: translation/deuterocanon/psalms_of_solomon/017/048.yaml
  text: His words are refined beyond the finest precious gold[a]; in the assemblies he will judge the people[d][c][b], the tribes of the sanctified.
translation:
  language: ru
  text: Слова его очищены огнём лучше, чем самое отборное золото[a]; в собраниях он рассудит народ[b] — племена освящённых[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слова его испытаны огнём; они чище самого отборного золота».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в собраниях он различит народ» или «отделит народ».'
    reason: alternative_reading
  - marker: c
    text: 'Греческое выражение синтаксически сжато; буквально причастие «освящённый» стоит в единственном числе. Возможны также переводы: «племена освящённого» или «племена Святого», однако по контексту оно, вероятно, собирательно обозначает освящённый народ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ῥήματα
  choice: слова
  rationale: Передаёт произнесённые слова или изречения естественно и кратко, не сужая значение до особого жанра.
- source_word: πεπυρωμένα
  choice: очищены огнём
  rationale: Причастие сохраняет образ огненного испытания и очистки металла, непосредственно поддержанный последующим сравнением с золотом.
- source_word: ὑπὲρ χρυσίον τὸ πρῶτον τίμιον
  choice: лучше самого чистого драгоценного золота
  rationale: ὑπέρ выражает превосходство, а τὸ πρῶτον τίμιον усиливает представление о золоте высшего качества; русская формулировка передаёт это без неестественной буквальности.
- source_word: συναγωγαῖς
  choice: в собраниях
  rationale: Нейтрально обозначает места или случаи совместного собрания народа и не привносит более позднего институционального смысла слова «синагога».
- source_word: διακρινεῖ
  choice: рассудит
  rationale: В контексте правителя глагол допускает судебно-различающий смысл. «Рассудит» сохраняет связь как с вынесением решения, так и с проведением различий.
- source_word: ἡγιασμένου
  choice: освящённых
  rationale: Хотя в греческом стоит форма единственного числа, субстантивированное причастие здесь вероятнее всего имеет собирательное значение и относится к освящённому народу. Русское множественное число не создаёт ошибочного впечатления об одном человеке; формальная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Относится ли ἡγιασμένου к одному освящённому лицу или собирательно к освящённому народу
  choice: Собирательное «освящённых» в основном тексте
  alternative: «освящённого» / «Святого» как обозначение одного лица
  rationale: Сочетание с «народом» и «племенами» поддерживает коллективное понимание, однако греческая форма единственного числа оставляет синтаксическую сжатость и допускает иное прочтение, поэтому оно не устраняется из примечания.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранён образ очищения огнём; позднее конфессиональное значение слова «синагога» не вводится. Тире показывает, что «племена» поясняют слово «народ».
