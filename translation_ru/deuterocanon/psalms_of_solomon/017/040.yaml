lexical_decisions:
- source_word: εὐλογήσει
  choice: благословит
  rationale: Будущее время действительного залога от εὐλογέω; «благословит» естественно и точно передаёт действие без поясняющего расширения.
- source_word: λαὸν Κυρίου
  choice: народ Господа
  rationale: λαός обозначает народ как общину, а родительный Κυρίου выражает принадлежность; конструкция «народ Господа» сохраняет обе особенности.
- source_word: ἐν σοφίᾳ
  choice: мудро
  rationale: ἐν с дательным здесь вероятнее всего обозначает образ действия или сферу. Наречие «мудро» звучит естественно по-русски, тогда как буквальное «в мудрости» сохраняется в примечании как возможный вариант.
- source_word: μετʼ εὐφροσύνης
  choice: с радостью
  rationale: μετά с родительным выражает сопровождение, а εὐφροσύνη — радость, веселье или ликование. «С радостью» ясно и достойно передаёт основной смысл.
