  yaml_path: translation/deuterocanon/psalms_of_solomon/017/019.yaml
  text: They wandered in wildernesses[a], that their lives might be saved from evil, and in the eyes of the sojourning community[d][c][b], a life saved from among them was precious.
translation:
  language: ru
  text: Они скитались по пустынным местам[a], чтобы их жизни были спасены от зла; и в глазах общины, живущей на чужбине[c], была драгоценна жизнь[b], спасённая из их среды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по пустыням».'
    reason: lexical_alternative
  - marker: b
    text: Греч. ψυχή может означать «жизнь» или «душу»; здесь контекст опасности и спасения говорит в пользу значения «жизнь».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «переселенческой общины», «общины пришельцев»; греч. παροικία обозначает пребывание вне родной земли, а также живущую так общину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλανῶντο
  choice: скитались
  rationale: В сочетании с ἐν ἐρήμοις глагол обозначает физическое скитание, а не нравственное заблуждение.
- source_word: ἐν ἐρήμοις
  choice: по пустынным местам
  rationale: Множественное число указывает на безлюдные, необитаемые области; этот перевод не сужает образ до песчаных пустынь.
- source_word: σωθῆναι ψυχὰς αὐτῶν
  choice: чтобы их жизни были спасены
  rationale: Сохранены пассивная форма инфинитива и значение цели; ψυχή в контексте бегства от опасности означает жизнь.
- source_word: ἀπὸ κακοῦ
  choice: от зла
  rationale: Буквально сохраняет широкое значение κακόν, которое может включать зло, беду или вред.
- source_word: τίμιον
  choice: драгоценна
  rationale: Передаёт высокую ценность спасённой человеческой жизни для общины.
- source_word: παροικίας
  choice: общины изгнанников
  rationale: Передаёт собирательное значение сообщества, живущего вдали от родины, и звучит естественно по-русски.
- source_word: ψυχὴ σεσωμένη
  choice: жизнь, спасённая
  rationale: ψυχή обозначает здесь конкретную жизнь, а перфектное причастие — достигнутое состояние спасения.
- source_word: ἐξ αὐτῶν
  choice: из их среды
  rationale: Естественно передаёт выделение одной спасённой жизни из ранее названной группы.
theological_decisions:
- issue: Передача ψυχή в обоих случаях
  choice: жизнь / жизни
  alternative: душа / души
  rationale: Контекст скитаний ради избавления от опасности говорит о сохранении жизни; перевод «душа» мог бы привнести более специальное антропологическое значение.
- issue: Неуказанный деятель спасения в σωθῆναι
  choice: сохранена пассивная конструкция «были спасены»
  alternative: активное «спасти свои жизни»
  rationale: Греческий аористный пассивный инфинитив не называет деятеля; перевод не должен приписывать спасение самим странникам.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Пассивная конструкция оригинала сохранена; синтаксис слегка упорядочен ради ясности, без устранения смысловой широты выражений «зло» и «община изгнанников».
