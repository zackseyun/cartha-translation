base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/011.yaml
  text: God did not have mercy on them[b][a]. He searched out their offspring and did not leave one of them.
translation:
  language: ru
  text: Бог не помиловал их[b]. Он разыскал их потомство[a] и не оставил из них ни одного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семя»; также: «потомков».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не пощадил их».'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλέησεν
  choice: помиловал
  rationale: Глагол прямо выражает проявление милости или сострадания. «Не помиловал» сохраняет этот смысл и не смешивает его с более узким «не пощадил».
- source_word: ἐξερεύνησεν
  choice: разыскал
  rationale: Форма передаёт тщательный, доведённый до конца поиск; «разыскал» естественно звучит в контексте суда и преследования.
- source_word: σπέρμα
  choice: потомство
  rationale: Здесь слово обозначает не буквальное семя, а потомков; «потомство» сохраняет родовой и собирательный смысл.
- source_word: οὐκ ἀφῆκεν αὐτῶν ἕνα
  choice: не оставил из них ни одного
  rationale: Перевод близко передаёт греческую конструкцию и её категорическое указание на полное отсутствие уцелевших.
theological_decisions:
- issue: Различение милости и пощады
  choice: не помиловал
  alternative: не пощадил
  rationale: ἐλεέω означает проявлять милость; перевод «не помиловал» сохраняет богословски значимое понятие милости и не подменяет его значением другого греческого глагола, φείδομαι.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Синтаксический параллелизм оригинала сохранён; лексика понятна широкому читателю без устранения суровости сцены суда.
