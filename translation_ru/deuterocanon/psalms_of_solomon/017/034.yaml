lexical_decisions:
- source_word: ἔρχεσθαι
  choice: чтобы … приходили
  rationale: Инфинитив зависит от предшествующего контекста и выражает цель или результат; его не следует превращать в самостоятельное будущее время.
- source_word: ἔθνη
  choice: народы
  rationale: Нейтрально обозначает народы вне Израиля, не усиливая без необходимости противопоставление «иудеев» и «язычников».
- source_word: ἀπ’ ἄκρου τῆς γῆς
  choice: с края земли
  rationale: Сохраняет единственное число греческого выражения и передаёт образ крайней удалённости.
- source_word: ἰδεῖν τὴν δόξαν αὐτοῦ
  choice: увидеть его славу
  rationale: Прямой и естественный перевод, сохраняющий богословскую ёмкость слова δόξα.
- source_word: φέροντες δῶρα
  choice: принося в дар
  rationale: Формулировка показывает, что последующее «её … сыновей» поясняет, что именно приносят как дар.
- source_word: τοὺς ἐξησθενηκότας
  choice: ослабевших
  rationale: Перфектное причастие описывает возникшее и сохраняющееся состояние слабости, не уточняя без основания его причину.
- source_word: υἱοὺς αὐτῆς
  choice: её … сыновей
  rationale: Сохраняются женский род местоимения, отсылающий в контексте к Иерусалиму, и мужской род существительного.
theological_decisions:
- issue: Сыновья Иерусалима представлены как приносимый народами дар
  choice: принося в дар её … сыновей
  alternative: принося дары — её … сыновей
  rationale: Основной вариант естественно передаёт предикативно-пояснительную связь между δῶρα и υἱούς, не смягчая необычный образ и не добавляя толкования.
