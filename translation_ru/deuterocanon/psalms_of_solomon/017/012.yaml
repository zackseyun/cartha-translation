  yaml_path: translation/deuterocanon/psalms_of_solomon/017/012.yaml
  text: The Lord is faithful in all his judgments that he carries out on the earth[a].
translation:
  language: ru
  text: Господь верен во всех Своих судах, которые Он совершает на земле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «во всех судах Его, которые Он совершает на земле».'
    reason: Сохраняет для справки более формальное расположение αὐτοῦ («Его»), тогда как в основном тексте русское «Своих» яснее связывает принадлежность судов с подлежащим «Господь».
lexical_decisions:
- source_word: πιστός
  choice: верен
  rationale: Предикативное прилагательное характеризует Господа как неизменно верного и заслуживающего доверия; «верен» естественно передаёт эту характеристику, не подменяя её понятием праведности.
- source_word: κύριος
  choice: Господь
  rationale: Традиционное и понятное русское соответствие титулу κύριος, сохраняющее благоговейный регистр и связь с употреблением Септуагинты.
- source_word: κρίμασιν
  choice: судах
  rationale: Здесь κρίματα обозначает Божьи судебные решения или совершаемые Им акты суда; «суды» сохраняет конкретность и не перегружает текст толкованием.
- source_word: ποιεῖ
  choice: совершает
  rationale: Сочетание «совершает суды» естественно для возвышенного современного русского языка и передаёт смысл осуществляемого действия, выраженный ποιεῖ.
- source_word: ἐπὶ τὴν γῆν
  choice: на земле
  rationale: Передаёт наиболее прямой и широкий пространственный смысл выражения, не сужая γῆ до отдельной страны или земли.
- source_word: αὐτοῦ
  choice: Своих
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит суды с подлежащим «Господь» и сохраняет явно выраженное греческое αὐτοῦ.
theological_decisions:
- issue: Подчёркивается ли верность Самого Господа или только правильность Его судов
  choice: «Господь верен во всех Своих судах»
  alternative: «Господь праведен во всех Своих судах»
  rationale: πιστός непосредственно характеризует Господа и говорит о Его верности и надёжности; вариант «праведен» вводил бы иной лексический смысл. Упоминание судов одновременно показывает, как эта верность проявляется в Его действиях.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные буквы в «Своих» и «Он» служат принятому благоговейному оформлению местоимений, относящихся к Богу; синтаксис остаётся ясным для обычного читателя.
