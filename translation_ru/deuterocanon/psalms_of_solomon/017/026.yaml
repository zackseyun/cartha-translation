lexical_decisions:
- source_word: ἐξῶσαι
  choice: изгнать
  rationale: Передаёт решительное, насильственное удаление и естественно сочетается с конструкцией «из наследия».
- source_word: κληρονομίας
  choice: наследия
  rationale: Сохраняет основной смысл унаследованного или полученного в удел владения и возможный заветно-земельный оттенок.
- source_word: ἐκτρῖψαι
  choice: сокрушить
  rationale: Глагол обозначает уничтожение или истребление; в сочетании с образом глиняных сосудов «сокрушить» сохраняет конкретную картину разрушения.
- source_word: ὑπερηφανίαν
  choice: гордыню
  rationale: Передаёт осуждаемое высокомерное самовозвышение точнее, чем нейтральное «гордость».
- source_word: ἁμαρτωλοῦ
  choice: грешника
  rationale: Сохранено единственное число греческого текста; оно может быть собирательным или представительным.
- source_word: σκεύη κεραμέως
  choice: глиняные сосуды
  rationale: Естественный русский библейский оборот; κεραμεύς буквально обозначает горшечника, а выражение — изготовленные им сосуды.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: железным жезлом
  rationale: Творительный падеж естественно передаёт орудийное значение ἐν; «жезл» сохраняет библейскую аллюзивность.
- source_word: συντρίψαι
  choice: разбить
  rationale: Передаёт насильственное разрушение и избегает немотивированного повторения «сокрушить».
- source_word: πᾶσαν ὑπόστασιν αὐτῶν
  choice: всё их достояние
  rationale: ὑπόστασις допускает значения имущества, основы существования или положения; «достояние» естественно передаёт совокупность принадлежащего им, не сужая смысл исключительно до богатства.
theological_decisions:
- issue: Объект сравнения в обороте ὡς σκεύη κεραμέως
  choice: 'Сравнение отнесено к гордыне грешника: «сокрушить гордыню грешника, словно глиняные сосуды»'
  alternative: Понимать образ свободнее как сравнение самого грешника или грешников с глиняными сосудами
  rationale: По синтаксису ближайший прямой объект ἐκτρῖψαι — ὑπερηφανίαν; перевод сохраняет необычное, но подлинное напряжение образа и не исправляет его богословски.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инфинитивная синтаксическая форма сохранена, поскольку стих представляет продолжение предшествующей конструкции. Лексика конкретна и понятна; «жезл», «гордыня» и «достояние» поддерживают возвышенный, но не архаический регистр.
