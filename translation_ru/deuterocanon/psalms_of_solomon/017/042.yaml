base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/042.yaml
  text: And he will not grow weak in his days in his God[a], because God has made him powerful in the Holy Spirit, and wise in the counsel of understanding[c][b], with strength and righteousness.
translation:
  language: ru
  text: И он не ослабеет во дни свои, уповая на своего Бога[a], потому что Бог сделал его могущественным в святом духе[b], мудрым в разумном совете, обладающим силой и праведностью[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на своём Боге»; выражение может обозначать опору на Бога или зависимость от Него.'
    reason: Сохраняется смысловая широта ἐπί с дательным.
  - marker: b
    text: 'Возможно также: «в Святом Духе» или «Святым Духом».'
    reason: Греческое выражение допускает различия в определённости и в понимании ἐν как сферы либо средства.
  - marker: c
    text: 'Или: «справедливостью».'
    reason: δικαιοσύνη может обозначать как праведность, так и справедливость.
lexical_decisions:
- source_word: ἀσθενήσει
  choice: не ослабеет
  rationale: Будущая форма глагола передаёт утрату или недостаток силы; «не ослабеет» естественно выражает это по-русски, не усиливая смысл до поражения или падения.
- source_word: ἐπὶ θεῷ αὐτοῦ
  choice: уповая на своего Бога
  rationale: ἐπί с дательным здесь естественно указывает на опору и доверие. «Уповая на» сохраняет образ опоры на Бога и соответствует возвышенному, но современному библейскому регистру.
- source_word: κατηργάσατο
  choice: сделал
  rationale: В данном контексте необычный глагол обозначает результат Божьего действия над этим лицом. Простое «сделал» ясно связывает его со сказуемыми «могущественным» и «мудрым».
- source_word: δυνατὸν
  choice: могущественным
  rationale: Прилагательное обозначает силу и способность. «Могущественным» хорошо передаёт личную действенную силу, не смешивая её с последующим существительным ἰσχύος.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: в святом духе
  rationale: Буквальная предложная конструкция сохраняет возможные значения сферы и средства. Строчные буквы не предрешают, следует ли понимать выражение как прямое именование Святого Духа.
- source_word: σοφὸν ἐν βουλῇ συνέσεως
  choice: мудрым в совете разумения
  rationale: Перевод сохраняет тесную связь мудрости, совета и разумения, а также генитивную конструкцию оригинала, не превращая её без необходимости в перечень отдельных качеств.
- source_word: ἰσχύος
  choice: силой
  rationale: «Сила» — прямой и естественный эквивалент; в заключительной предложной группе она сочетается с «праведностью».
- source_word: δικαιοσύνης
  choice: праведностью
  rationale: «Праведность» сохраняет нравственно-религиозную широту δικαιοσύνη; юридически окрашенная «справедливость» остаётся возможной альтернативой.
theological_decisions:
- issue: Следует ли πνεύματι ἁγίῳ однозначно переводить как личное именование Святого Духа
  choice: «в святом духе» со строчных букв и с примечанием
  alternative: «в Святом Духе» или «Святым Духом»
  rationale: Отсутствие артикля само по себе не исключает определённого значения, однако конструкция допускает качественное, сферическое и инструментальное прочтение. Основной текст не разрешает эту богословскую неоднозначность молча.
- issue: Оттенок δικαιοσύνης
  choice: «праведность»
  alternative: «справедливость»
  rationale: Контекст допускает как нравственно-религиозный, так и общественно-судебный оттенок. В основном тексте выбран более широкий традиционный эквивалент, а альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Обороты «во дни свои» и «уповая на» понятны современному читателю и поддерживают достоинство поэтической речи; более буквальное «совет разумения» сохранено ради структуры и смысловой напряжённости оригинала.
