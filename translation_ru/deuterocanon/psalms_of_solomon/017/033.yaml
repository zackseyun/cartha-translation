  text: И он очистит Иерусалим в святости[a], как было от начала[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в освящении». Греческое выражение может указывать на святость как состояние, сферу или средство очищения.'
