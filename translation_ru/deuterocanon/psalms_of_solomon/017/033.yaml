lexical_decisions:
- source_word: καθαριεῖ
  choice: очистит
  rationale: Глагол означает сделать чистым или очистить, в том числе в религиозно-ритуальном смысле. «Очистит» естественно звучит по-русски и сохраняет смысловую связь с чистотой, не добавляя к тексту более узкого толкования.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Употреблено общепринятое русское написание географического названия.
- source_word: ἐν ἁγιασμῷ
  choice: в святости
  rationale: Слово ἁγιασμός может обозначать святость, освящение или посвящение Богу. Буквальное «в святости» сохраняет неопределённость греческого оборота относительно состояния, сферы или средства очищения.
- source_word: ὡς καὶ τὸ ἀπ’ ἀρχῆς
  choice: как было от начала
  rationale: 'Греческий оборот эллиптичен: средний артикль τὸ указывает на подразумеваемое состояние или положение. В русском добавлено «было», чтобы сравнение оставалось понятным, но подразумеваемое существительное не уточняется.'
theological_decisions:
- issue: Соотношение очищения и святости в выражении ἐν ἁγιασμῷ
  choice: Сохранено буквальное «в святости»
  alternative: «посредством освящения» или «сделав святым»
  rationale: Греческий предлог ἐν не требует однозначно понимать святость как средство, результат или сферу очищения; перевод не должен устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис оставлен кратким; эллипсис заключительной фразы слегка восполнен ради понятности, а его неопределённость отмечена в сноске.
