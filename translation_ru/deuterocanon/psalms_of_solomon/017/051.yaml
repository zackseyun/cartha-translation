  naturalness: Текст звучит естественно на современном литературном русском, сохраняя умеренно возвышенный псалмический регистр. «Да поспешит Бог явить Израилю Свою милость» и «Сам Господь — наш Царь» ясны и не выглядят искусственно архаичными.
  terminology: «Милость», «нечистота», «Господь» и «Царь» уместны и последовательны. «Нечестивых» является допустимым контекстуальным соответствием βεβήλων; примечание корректно отмечает более буквальный оттенок «чуждых святыне», а также вариант «безбожных».
