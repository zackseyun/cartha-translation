  text: ταχύναι ὁ θεὸς ἐπὶ Ἰσραὴλ τὸ ἔλεος αὐτοῦ. ῥύσεται ἡμᾶς ἀπὸ ἀκαθαρσίας ἐχθρῶν βεβήλων. Κύριος αὐτὸς βασιλεὺς ἡμῶν εἰς τὸν αἰῶνα καὶ ἔτι.
