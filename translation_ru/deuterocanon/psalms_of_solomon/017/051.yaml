base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/051.yaml
  text: May God hasten his mercy upon Israel[a]. He will rescue us from the uncleanness of profane enemies[c][b]. The Lord himself is our king forever and ever.
translation:
  language: ru
  text: Да поспешит Бог явить Израилю Свою милость[a]. Он избавит нас от нечистоты[b] нечестивых[c] врагов. Сам Господь — наш Царь во веки и вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь стоит инфинитив «поспешить»; он передан как молитвенное пожелание: «Да поспешит Бог…»'
    reason: alternative_reading
  - marker: b
    text: 'Или: «осквернения».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чуждых святыне»; возможно также: «безбожных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχύναι
  choice: да поспешит… явить
  rationale: Начальный инфинитив передан как молитвенное пожелание. Такая конструкция сохраняет настойчивость греческого текста и естественно звучит по-русски.
- source_word: ἔλεος
  choice: милость
  rationale: «Милость» прямо и ёмко передаёт Божье сострадание и благоволение, не добавляя отсутствующих в строке оттенков.
- source_word: ῥύσεται
  choice: избавит
  rationale: Будущее время выражает уверенность в грядущем избавлении; «избавит» естественно сочетается с предлогом «от».
- source_word: ἀκαθαρσίας
  choice: нечистоты
  rationale: Слово сохраняет нравственно-религиозную образность нечистоты; возможен также оттенок осквернения.
- source_word: βεβήλων
  choice: нечестивых
  rationale: В данном контексте обозначает врагов, чуждых святости и попирающих её. «Нечестивых» понятно современному читателю и сохраняет религиозный оттенок.
- source_word: Κύριος
  choice: Господь
  rationale: Обычное и контекстуально точное обозначение Бога как истинного Царя Израиля.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: во веки и вовеки
  rationale: Устойчивая возвышенная русская формула передаёт усиленное утверждение бесконечности царствования, выраженное словами «в век и ещё».
theological_decisions:
- issue: Смысл начального инфинитива ταχύναι
  choice: 'Молитвенное пожелание: «Да поспешит Бог явить…»'
  alternative: Буквальная инфинитивная конструкция («Богу ускорить…») или утверждение («Бог спешит…»)
  rationale: Изолированный инфинитив в начале строки наиболее убедительно понимается как пожелание или молитвенный возглас. Перевод не превращает его в обычное повествовательное утверждение.
- issue: Характер избавления от ἀκαθαρσίας
  choice: Сохранён образ избавления от нечистоты врагов
  alternative: Разъяснительный перевод как избавление от осквернения, причинённого врагами
  rationale: Родительная конструкция допускает оттенок нечистоты, исходящей от врагов или связанной с ними. Основной текст сохраняет эту сжатость и не уточняет причинную связь сверх греческого.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, молитвенно-псалмическим звучанием. Порядок слов остаётся ясным для обычного читателя; формула «во веки и вовеки» намеренно сохраняет торжественное усиление финала.
