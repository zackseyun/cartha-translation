  text: In the wrath of his splendor he sent them away as far as the west[a], and the rulers of the land to mockery[c][b]; and he did not spare.
translation:
  language: ru
  text: В ярости его красоты[a] он отослал их до самого запада и правителей земли — на посмешище[b]; и не пощадил[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в гневе его красоты». Необычное выражение сохранено по греческому тексту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предал правителей земли осмеянию».'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте не указано, кого именно он не пощадил.
    reason: ambiguity
lexical_decisions:
- source_word: ἐν ὀργῇ κάλλους αὐτοῦ
  choice: в ярости его красоты
  rationale: 'Сохранено необычное греческое сочетание с родительным падежом: κάλλος означает «красота», а αὐτοῦ относится к нему. Более гладкое «в ярости своего великолепия» могло бы скрыть странность исходного текста и ошибочно придать выражению оттенок божественного величия.'
- source_word: ἐξαπέστειλεν
  choice: отослал
  rationale: Глагол выражает усиленное «послал прочь». «Отослал» сохраняет значение удаления, не добавляя более сильного смысла «изгнал».
- source_word: ἕως ἐπὶ δυσμῶν
  choice: до самого запада
  rationale: δυσμαί обозначает запад, буквально область захода солнца; ἕως передаёт достижение дальней границы.
- source_word: ἄρχοντας τῆς γῆς
  choice: правителей земли
  rationale: Нейтрально и буквально передаёт политических властителей; «земли» сохраняет возможное значение как страны, так и земли вообще.
- source_word: εἰς ἐμπαιγμόν
  choice: на посмешище
  rationale: Передаёт направленность εἰς и значение публичного осмеяния. Эллипсис общего глагола сохранён через тире.
- source_word: οὐκ ἐφείσατο
  choice: не пощадил
  rationale: Сохранено абсолютное употребление без добавленного объекта «их», поскольку в греческом тексте объект не выражен.
theological_decisions:
- issue: Отнесение необычного выражения κάλλους αὐτοῦ
  choice: Сохранить буквальное «его красоты» без указания на божественное великолепие
  alternative: «в ярости своего великолепия»
  rationale: Контекст не требует понимать действующее лицо как Бога; перевод не должен привносить богословски нагруженное толкование.
translation_notes:
  register: Современный литературный русский язык с намеренно сохранённой необычностью первой фразы. Эллиптическое построение второй части передано тире; финальная фраза оставлена без дополнения, как в греческом.
