lexical_decisions:
- source_word: οἱ λόγοι αὐτοῦ
  choice: Его слова
  rationale: Прямо передаёт λόγοι и сохраняет повтор существительного λόγοι во второй части стиха.
- source_word: ὡς
  choice: как
  rationale: Естественно выражает сравнение, не превращая подобие в тождество.
- source_word: λόγοι ἁγίων
  choice: слова святых
  rationale: ἁγίων понято субстантивированно как обозначение святых людей, а не как определение к слову «слова».
- source_word: ἐν μέσῳ
  choice: среди
  rationale: Передаёт нахождение внутри группы и звучит естественнее в современном русском, чем буквальное «посреди» в данном контексте.
- source_word: λαῶν ἡγιασμένων
  choice: освящённых народов
  rationale: 'Сохраняет множественное число λαῶν и результативно-пассивный оттенок причастия ἡγιασμένων: народы, которые были освящены.'
theological_decisions:
- issue: Кого обозначает ἁγίων
  choice: святых, то есть святых людей
  alternative: святые слова
  rationale: Родительный падеж множественного числа ἁγίων естественно понимать субстантивированно; перевод сохраняет личное обозначение и не добавляет конфессионально специфического смысла.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка. Повтор «слова — как слова» намеренно сохранён вслед за греческим текстом. Различие между «святыми» и «освящёнными народами» также сохранено.
