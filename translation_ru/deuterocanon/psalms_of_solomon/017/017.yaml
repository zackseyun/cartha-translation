  yaml_path: translation/deuterocanon/psalms_of_solomon/017/017.yaml
  text: And the sons of the covenant prevailed over them in the midst of the mixed nations[a]; there was no one among them, in Jerusalem[b], doing mercy and truth.
translation:
  language: ru
  text: И сыны завета превосходили их[a] среди смешанных народов; и среди них, в Иерусалиме, не было никого, кто творил бы милость и истину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брали над ними верх».'
    reason: Лексически ἐπικρατέω может обозначать как превосходство, так и преобладание или господство над кем-либо; в данном контексте основной текст передаёт превосходство, не конкретизируя его как политическое или военное господство.
  - marker: b
    text: 'Или: «милость и верность».'
    reason: В этом сочетании ἀλήθεια может иметь оттенок надёжности или верности.
lexical_decisions:
- source_word: ἐπεκρατοῦσαν αὐτῶν
  choice: превзошли их
  rationale: Глагол с родительным местоимением выражает превосходство над кем-либо. В данном контексте «превзошли их» естественно передаёт сравнение, не создавая обязательного впечатления политического или военного господства; имперфект описывает положение или продолжавшееся действие в повествовательном прошлом.
- source_word: υἱοὶ τῆς διαθήκης
  choice: сыны завета
  rationale: Сохранены мужской род и образное обозначение принадлежности к завету. «Сыны завета» — понятное и торжественное выражение в русском библейском регистре.
- source_word: ἐθνῶν συμμίκτων
  choice: среди смешанных народов
  rationale: Слово συμμίκτων означает «смешанных, перемешанных»; «народы» сохраняет коллективно-этнический смысл ἐθνῶν, не уточняя природу смешения, которой текст не объясняет.
- source_word: ὁ ποιῶν
  choice: никого, кто творил бы
  rationale: Русская придаточная конструкция естественно передаёт субстантивированное причастие и сохраняет широкий нравственный смысл глагола ποιέω.
- source_word: ἔλεος
  choice: милость
  rationale: Прямой и уместный в религиозно-нравственном контексте эквивалент, допускающий оттенки сострадания и доброты.
- source_word: ἀλήθειαν
  choice: истину
  rationale: Буквальный эквивалент сохраняет традиционную пару «милость и истина», тогда как возможный оттенок верности указан в сноске.
theological_decisions:
- issue: Передача заветного обозначения υἱοὶ τῆς διαθήκης
  choice: сыны завета
  alternative: дети завета; народ завета
  rationale: Греческий текст явно употребляет существительное мужского рода во множественном числе. Сохранение образа не нейтрализует идентификационную и заветную окраску выражения.
- issue: Смысл ἐπεκρατοῦσαν в контексте нравственного сравнения
  choice: превзошли их
  alternative: брали над ними верх; господствовали над ними
  rationale: Основной текст передаёт превосходство, но не определяет его как политическое господство. Возможность более формального понимания глагола сохранена в сноске.
- issue: Передача сочетания ἔλεος καὶ ἀλήθειαν
  choice: милость и истину
  alternative: милость и верность
  rationale: Буквальная пара сохраняет семитскую нравственно-заветную напряжённость и не сводит многозначное ἀλήθεια исключительно к верности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Выражение «сыны завета» намеренно сохранено как образное обозначение группы; синтаксис второй части слегка развёрнут ради ясности, при этом вставное «в Иерусалиме» следует неоднозначному расположению обстоятельств в греческом тексте.
