- from: Блаженны те, кто будет жить в те дни[a] и увидит блага Израиля при собрании колен. Да совершит это Бог![b]
  to: Блаженны те, кому доведётся жить в те дни[a] и увидеть блага Израиля в собрании колен. Да совершит это Бог![b]
  rationale: Правка делает русскую фразу более плавной и ближе к греческой инфинитивной конструкции, заменяя личное «увидит» на «увидеть». «В собрании колен» непосредственно передаёт ἐν συναγωγῇ φυλῶν, не навязывая различия между процессом собирания и собранием. Основное волитивное прочтение финальной фразы сохранено, а сноска b переформулирована так, чтобы ясно и грамматически корректно отражать альтернативное зависимое прочтение.
