  yaml_path: translation/deuterocanon/psalms_of_solomon/017/050.yaml
  text: Blessed are those who are alive in those days[a], to see the good things of Israel in the assembly of the tribes. May God bring it to pass!
translation:
  language: ru
  text: Блаженны те, кому доведётся жить в те дни[a] и увидеть блага Израиля в собрании колен. Да совершит это Бог![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто родится в те дни».'
    reason: γενόμενοι может обозначать как тех, кто окажется или будет жить в то время, так и тех, кто тогда родится.
  - marker: b
    text: 'Возможно также: «…увидеть блага Израиля в собрании колен, которые совершит Бог».'
    reason: Сжатый заключительный оборот ποιῆσαι ὁ θεός можно понимать не только как самостоятельное пожелание, но и как зависимое пояснение к предшествующим «благам».
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Традиционный и естественный для библейского провозглашения эквивалент, сохраняющий возвышенный и эсхатологический оттенок.
- source_word: οἱ γενόμενοι ἐν ταῖς ἡμέραις ἐκείναις
  choice: те, кто будет жить в те дни
  rationale: Оборот буквально говорит о тех, кто «окажется» или «будет» в те дни; выбранная формулировка естественно передаёт мысль о людях, которым предстоит дожить до этого времени, не утверждая однозначно, что они тогда родятся.
- source_word: ἰδεῖν
  choice: и увидит
  rationale: Инфинитив указывает, что именно предстоит пережить названным блаженными людям. Союз «и» делает русскую фразу естественной, сохраняя смысл греческого оборота.
- source_word: τὰ ἀγαθὰ Ἰσραήλ
  choice: блага Израиля
  rationale: «Блага» точно передаёт субстантивированное τὰ ἀγαθά, а родительный падеж «Израиля» сохраняет открытым отношение принадлежности или предназначения.
- source_word: ἐν συναγωγῇ φυλῶν
  choice: при собрании колен
  rationale: συναγωγή здесь обозначает собирание или собрание; «при собрании» естественно выражает обстоятельство, не уточняя сверх текста, идёт ли речь о процессе или уже состоявшемся собрании.
- source_word: ποιῆσαι ὁ θεός
  choice: Да совершит это Бог!
  rationale: 'После знака разделения краткий оборот естественно понимать как самостоятельное молитвенное пожелание: пусть Бог осуществит описанное.'
theological_decisions:
- issue: Синтаксическая роль заключительного ποιῆσαι ὁ θεός
  choice: 'Самостоятельное молитвенное пожелание: «Да совершит это Бог!»'
  alternative: 'Связать оборот с предшествующим высказыванием: «…что совершит Бог»'
  rationale: Пунктуация издания и параллельное пожелание в следующем стихе поддерживают самостоятельное волитивное прочтение, однако сжатый греческий оборот допускает и зависимое понимание, поэтому оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён ровно настолько, чтобы стих был понятен при чтении вслух; неоднозначность оборотов γενόμενοι и ποιῆσαι ὁ θεός сохранена в сносках.
