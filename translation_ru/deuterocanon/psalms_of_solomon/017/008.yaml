lexical_decisions:
- source_word: ἠρήμωσαν
  choice: опустошили
  rationale: Передаёт сильное значение приведения в запустение или разорения, сохраняя образ исходного глагола.
- source_word: τὸν θρόνον Δαυὶδ
  choice: престол Давида
  rationale: Прямая и естественная передача династического и царского смысла.
- source_word: ἐν ὑπερηφανίᾳ ἀλλάγματος
  choice: надменно присвоив его себе
  rationale: Сжатая греческая фраза буквально связана с гордостью и заменой/переменой; в политико-династическом контексте естественно выражает высокомерное присвоение чужого престола, но альтернативный буквальный смысл отмечен в сноске.
- source_word: καταβαλεῖς
  choice: низвергнешь
  rationale: Будущее время и решительный образ свержения переданы одним глаголом высокого, но понятного регистра.
- source_word: ἀρεῖς
  choice: истребишь
  rationale: В сочетании с потомством и удалением с земли глагол обозначает устранение; «истребишь» естественно передаёт контекст суда, хотя буквальнее возможно «удалишь», что отмечено в сноске.
- source_word: σπέρμα αὐτῶν
  choice: их потомство
  rationale: Сохраняет родовой и поколенческий смысл σπέρμα без неестественного буквального «семя».
- source_word: ἀπὸ τῆς γῆς
  choice: с земли
  rationale: Не сужает значение до определённой страны и естественно обозначает исчезновение из мира живых.
