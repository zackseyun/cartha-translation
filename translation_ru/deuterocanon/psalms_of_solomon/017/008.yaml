  source_fidelity: Греческие καταβαλεῖς и ἀρεῖς — формы будущего времени; «низвергнешь» верно передаёт первую. Однако «истребишь» для ἀρεῖς чрезмерно конкретизирует способ устранения. Основное значение — «уберёшь/удалишь», и его следует сохранить. «Опустошили престол Давида» адекватно передаёт ἠρήμωσαν τὸν θρόνον Δαυίδ. Передача спорного ἐν ὑπερηφανίᾳ ἀλλάγματος через присвоение престола допустима при сохранении буквальной альтернативы в сноске.
