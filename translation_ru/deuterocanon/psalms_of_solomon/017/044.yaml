  text: And his hope in the Lord will not grow weak; and who can stand against him? He is strong in his deeds and mighty in the fear of God,
translation:
  language: ru
  text: И надежда его на Господа не ослабеет; и кто может противостоять ему? Он силён в делах своих и могуч в страхе Божьем,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενήσει
  choice: не ослабеет
  rationale: Будущая форма глагола означает утрату силы или ослабление; применительно к надежде «не ослабеет» сохраняет образ исходного текста и естественно звучит по-русски.
- source_word: ἡ ἐλπὶς αὐτοῦ ἐπὶ Κύριον
  choice: надежда его на Господа
  rationale: Предлог ἐπί здесь выражает направленность упования на Господа; традиционная и понятная русская конструкция сохраняет эту связь без поясняющего пересказа.
- source_word: Κύριον
  choice: Господа
  rationale: Κύριος передано принятым библейским соответствием «Господь»; падеж обусловлен конструкцией «надежда на».
- source_word: τίς δύναται πρὸς αὐτόν;
  choice: кто сможет противостоять ему?
  rationale: Краткая греческая конструкция имеет состязательный, враждебный смысл. «Противостоять» естественно выражает способность выступить против него, не добавляя явного утверждения о победе.
- source_word: ἰσχυρὸς ἐν ἔργοις αὐτοῦ
  choice: силён в делах своих
  rationale: ἰσχυρός обозначает силу, а ἔργα — дела или деяния. Формулировка близка к структуре греческого текста и сохраняет возвышенный библейский регистр.
- source_word: κραταιὸς ἐν φόβῳ θεοῦ
  choice: могуч в страхе Божьем
  rationale: κραταιός продолжает и усиливает характеристику силы. «Страх Божий» сохраняет весомую библейскую формулу, не сводя её только к почтению.
- source_word: '[implied copula]'
  choice: Он силён
  rationale: В греческом именная конструкция обходится без выраженной связки; в русском для ясного начала нового предложения добавлены местоимение и нулевая связка настоящего времени.
theological_decisions:
- issue: Значение φόβος θεοῦ
  choice: страх Божий
  alternative: благоговение перед Богом
  rationale: Более буквальная формула сохраняет возможный диапазон от трепета и страха до благоговейного почитания и не снимает богословского напряжения исходного выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «надежда его» и выражения «в делах своих», «страх Божий» сохраняют достоинство и ритм исходного текста, оставаясь понятными современному читателю. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
