lexical_decisions:
- source_word: συνάξει
  choice: соберёт
  rationale: Прямо передаёт будущее действие собирания народа и естественно звучит по-русски.
- source_word: λαὸν ἅγιον
  choice: святой народ
  rationale: Сохраняет религиозный и заветный смысл ἅγιος без излишне специальной лексики.
- source_word: ἀφήγήσεται
  choice: поведёт
  rationale: Передаёт руководство и водительство кратким естественным глаголом.
- source_word: ἐν δικαιοσύνῃ
  choice: в праведности
  rationale: Сохраняет широкий нравственно-религиозный смысл δικαιοσύνη и не сводит его исключительно к судебной справедливости.
- source_word: κρινεῖ
  choice: будет судить
  rationale: Сохраняет основное судебное значение κρίνω; возможный царский оттенок управления отмечен в сноске.
- source_word: φυλὰς
  choice: колена
  rationale: В контексте народа Божьего традиционное библейское «колена» точнее обозначает племенные подразделения.
- source_word: λαοῦ ἡγιασμένου
  choice: народа, освящённого
  rationale: Причастие согласовано с единственным числом λαοῦ, а совершённое пассивное действие передано словом «освящённого».
- source_word: ὑπὸ Κυρίου θεοῦ αὐτοῦ
  choice: Господом, его Богом
  rationale: Передаёт деятеля пассивного действия и сохраняет местоимение αὐτοῦ, не устраняя полностью возможную неоднозначность его отнесения.
theological_decisions:
- issue: Значение δικαιοσύνη
  choice: в праведности
  alternative: по справедливости
  rationale: «Праведность» сохраняет более широкий богословский и нравственный диапазон слова; царско-судебный контекст допускает также значение справедливости.
- issue: Значение κρινεῖ в царском контексте
  choice: будет судить
  alternative: будет править / управлять
  rationale: Основное значение глагола сохранено в тексте, а более широкий смысл царского управления не исключён и указан в сноске.
- issue: Отнесение αὐτοῦ
  choice: его Богом
  alternative: своим Богом
  rationale: Форма с «его» ближе к греческому местоимению и не навязывает однозначно его референта там, где греческая формулировка допускает напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Порядок «соберёт он» подчёркивает продолжение пророческого описания; термин «колена» уместен для племён народа. Пунктуация показывает, что «освящённого» относится к «народа», а не к «колена».
