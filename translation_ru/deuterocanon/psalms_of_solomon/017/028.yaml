  text: And he will gather a holy people[a], whom he will lead in righteousness[d][c][b]; and he will judge the tribes of the people sanctified by the Lord his God.
translation:
  language: ru
  text: И соберёт он святой народ и поведёт его в праведности[a], и будет судить[b] колена народа, освящённого Господом, его Богом.
  philosophy: optimal-equivalence
  footnotes:
