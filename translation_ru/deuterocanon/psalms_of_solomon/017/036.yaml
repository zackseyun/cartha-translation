base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/036.yaml
  text: And there will be no injustice in his days among them[a], because all are holy[b], and their king is the Lord Messiah.
translation:
  language: ru
  text: И среди них в его дни не будет[a] несправедливости, потому что все они святы, и царь их — Мессия, Господь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «нет» или «не бывает»; будущее время выбрано по контексту грядущего царствования.'
    reason: source_ambiguity
  - marker: b
    text: 'Возможно также: «Господь-Мессия»; по иному пониманию: «Мессия Господень». В греческом оба слова стоят в именительном падеже: χριστὸς κύριος.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδικία
  choice: несправедливость
  rationale: Передаёт как нравственную неправду, так и общественную несправедливость; в данном контексте естественнее и шире, чем «неправедность».
- source_word: ἡμέραις αὐτοῦ
  choice: в его дни
  rationale: Сохраняет временной образ греческого выражения, не сводя его без необходимости к более толковательному «во время его царствования».
- source_word: ἐν μέσῳ αὐτῶν
  choice: среди них
  rationale: Естественно передаёт жизнь внутри общины; буквальное «посреди них» здесь звучало бы пространственно и менее уместно.
- source_word: ἅγιοι
  choice: святы
  rationale: Прямое и прозрачное соответствие, не вводя более позднего терминологического оттенка существительного «святые».
- source_word: χριστός
  choice: Мессия
  rationale: Здесь слово выступает как титул помазанного царя; «Мессия» сохраняет иудейский царский контекст.
- source_word: κύριος
  choice: Господь
  rationale: Обычное титульное соответствие κύριος; сохранено рядом с «Мессия» без добавления отсутствующего в греческом притяжательного отношения.
theological_decisions:
- issue: Временное значение οὐκ ἔστιν в будущем мессианском контексте
  choice: не будет
  alternative: нет / не бывает
  rationale: Хотя ἔστιν имеет форму настоящего времени, окружающий контекст описывает грядущее царствование, а «в его дни» задаёт будущую временную рамку. Альтернатива отмечена, чтобы не скрывать морфологическую форму оригинала.
- issue: Передача сочетания χριστὸς κύριος
  choice: Мессия, Господь
  alternative: Господь-Мессия; Мессия Господень
  rationale: Основной текст сохраняет оба именительных титула и порядок греческих слов, не превращая κύριος в невыраженный родительный падеж. Пунктуация отражает возможное приложение, но другие синтаксические понимания сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического пророческого текста. Синтаксис близок к оригиналу, но естественен для обычного читателя; богословская неоднозначность титульного сочетания сохранена.
