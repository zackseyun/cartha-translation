  yaml_path: translation/deuterocanon/psalms_of_solomon/017/020.yaml
  text: Those who loved the assemblies of the the pious fled from them; their scattering by lawless men spread over all the earth, because heaven held back from dripping rain upon the earth.
translation:
  language: ru
  text: Любящие собрания благочестивых[a] бежали от них; беззаконники рассеяли их по всей земле, потому что небо удержало дождь, не дав ему пролиться на землю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верных»; возможно также: «святых».'
    reason: Слово ὅσιοι обозначает благочестивых, верных Богу людей и допускает несколько близких передач.
  - marker: b
    text: 'Буквально: «небо удержалось от того, чтобы пролить (капать) дождь на землю».'
    reason: Греческое выражение изображает небо удерживающим дождь; глагол στάζω буквально связан с капанием, струением.
lexical_decisions:
- source_word: ἔφυγοσαν
  choice: бежали
  rationale: Передаёт прямое значение глагола — спасаться бегством — кратко и естественно.
- source_word: συναγωγὰς
  choice: собрания
  rationale: Нейтрально обозначает совместные собрания или общины и не вносит позднейших институциональных ассоциаций слова «синагога».
- source_word: ὁσίων
  choice: благочестивых
  rationale: Ὅσιος здесь подчёркивает верность Богу и благочестие; этот выбор точнее контексту Псалмов Соломона, чем термин «святые».
- source_word: σκορπισμὸς αὐτῶν ὑπὸ ἀνόμων
  choice: беззаконники рассеяли их
  rationale: Естественная русская активная конструкция ясно передаёт названных в греческом тексте виновников рассеяния, не меняя смысла.
- source_word: ἀνόμων
  choice: беззаконники
  rationale: Сохраняет нравственно-правовой оттенок ἄνομος и не ослабляет его до общего «злодеи».
- source_word: ἀνέσχεν
  choice: перестало
  rationale: В сочетании с инфинитивом передаёт прекращение действия; по-русски звучит естественнее буквального «удержалось».
- source_word: στάξαι ὑετὸν
  choice: источать дождь
  rationale: Сохраняет конкретный образ στάζω — капать, источать — при приемлемом литературном русском выражении.
theological_decisions:
- issue: Значение ὅσιοι
  choice: благочестивые
  alternative: святые; верные
  rationale: Текст характеризует людей по их благочестию или верности и не требует позднейшего конфессионального понимания слова «святые».
- issue: Причинная связь с отсутствием дождя
  choice: сохранено прямое «потому что»
  alternative: ослабить связь до «ведь» или истолковать засуху как отдельное следствие
  rationale: Греческое ὅτι прямо вводит основание, хотя логическая связь остаётся напряжённой; перевод не должен её сглаживать толкованием.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис упрощён лишь там, где буквальная греческая именная конструкция была бы тяжеловесна; причинная связь и неясный референт местоимения «них» сохранены.
