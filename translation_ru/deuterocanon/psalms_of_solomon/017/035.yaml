lexical_decisions:
- source_word: δόξαν
  choice: славу
  rationale: «Слава» передаёт возвышенный библейский регистр и допускает оттенок явленного величия и почёта, дарованного городу.
- source_word: Κυρίου
  choice: Господа
  rationale: В сочетании ἡ δόξα Κυρίου естественно означает «слава Господа»; традиционное «Господь» сохраняет библейский регистр.
- source_word: ἐδόξασεν
  choice: прославил
  rationale: Однокоренное сочетание «славу… прославил» сохраняет намеренный повтор греческих δόξα и δοξάζω, хотя по-русски оно звучит необычно.
- source_word: αὐτὴν
  choice: её
  rationale: Форма женского рода отсылает к олицетворённому городу, вероятнее всего к Иерусалиму, и потому передана женским местоимением.
- source_word: βασιλεὺς δίκαιος
  choice: праведным царём
  rationale: «Праведный» естественно передаёт религиозно-нравственный смысл δίκαιος и соответствует библейскому словоупотреблению.
- source_word: διδακτὸς ὑπὸ θεοῦ
  choice: наученным Богом
  rationale: «Наученный Богом» прямо передаёт значение διδακτός и не уточняет содержание полученного от Бога наставления.
- source_word: ἐπ’ αὐτούς
  choice: над ними
  rationale: При слове «царь» оборот естественно обозначает царскую власть над людьми.
theological_decisions:
- issue: Подразумеваемая связка во второй части
  choice: будет
  alternative: оставить именную конструкцию без выраженной связки
  rationale: В греческом тексте глагол отсутствует, однако русское предложение требует связки; будущее время соответствует направленности контекста и не добавляет отдельного богословского утверждения.
- issue: К чему относится «наученным Богом»
  choice: поставить оборот после «царём над ними»
  alternative: «и сам он, праведный царь, наученный Богом, будет над ними»
  rationale: Выбранный порядок естественно связывает ἐπ’ αὐτούς с царской властью, сохраняя при этом характеристику царя как наученного Богом; иной порядок слов возможен из-за компактного греческого синтаксиса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранён однокоренной повтор «славу… прославил», отражающий греческую словесную связь; необычность оборота пояснена сноской. Пунктуация и порядок слов подчёркивают, что «над ними» относится к царствованию.
