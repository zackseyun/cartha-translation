base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/022.yaml
  text: The king was in lawlessness[a], and the judge in disobedience[c][b], and the people in sin.
translation:
  language: ru
  text: Царь пребывал в беззаконии[a], судья — в неповиновении[b], а народ — в грехе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте нет глагола-связки; прошедшее время восполнено по контексту. Возможен буквальный перевод: «Царь — в беззаконии…».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в мятеже»; греческое ἀπείθεια может означать неповиновение или бунт.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεὺς
  choice: царь
  rationale: Прямое и естественное обозначение монарха; контекст не требует более общего слова «правитель».
- source_word: ἐν
  choice: в
  rationale: Повторяющийся предлог обозначает состояние или сферу и сохраняет ритмический параллелизм греческого текста.
- source_word: παρανομίᾳ
  choice: беззаконии
  rationale: Передаёт нарушение закона и установленного порядка, сохраняя нравственно-правовой оттенок существительного.
- source_word: κριτὴς
  choice: судья
  rationale: Прямое современное обозначение названной в греческом тексте должности.
- source_word: ἀπειθείᾳ
  choice: неповиновении
  rationale: В общественно-нравственном контексте означает отказ повиноваться; вариант «неверие» был бы неоправданно узким.
- source_word: λαὸς
  choice: народ
  rationale: Естественно передаёт собирательное значение без усиленного геополитического оттенка.
- source_word: ἁμαρτίᾳ
  choice: грехе
  rationale: Прямой перевод, сохраняющий краткость заключительного элемента трёхчастного обвинения.
theological_decisions:
- issue: Временная отнесённость безглагольного предложения
  choice: 'Прошедшее время: «пребывал»'
  alternative: 'Настоящее время: «пребывает» или «находится»'
  rationale: В греческом стихе связка отсутствует, однако предшествующий повествовательный контекст, в частности ἦν в 17:21, указывает на описание прошлого. Прошедшее время сохраняет эту связь, а сноска отмечает формальную неоднозначность.
translation_notes:
  register: Современный литературный и достоинственный русский язык. «Пребывал» естественно сочетается с трёхкратно подразумеваемым «в», передаёт состояние и позволяет сохранить лаконичный параллелизм; тире во втором и третьем членах устраняет тяжеловесное повторение глагола.
