revisions:
- from: И у него будут народы племён, чтобы служить ему под его ярмом[a], и он прославит Господа на месте, видном всей земле[b].
  to: И он будет держать в подчинении народы других племён под своим ярмом[a] и прославит Господа на месте, видном всей земле[b].
  rationale: Исправление устраняет неестественную кальку «народы племён» и целевой оттенок «чтобы служить». Формулировка «будет держать в подчинении» естественно передаёт в русском контексте ἕξει ... δουλεύειν вместе с уточнением «под своим ярмом». Образ ярма, титул «Господь», глагол «прославит» и пространственная неоднозначность ἐν ἐπισήμῳ πάσης τῆς γῆς сохранены.
  reviewer_model: gpt-5.6-terra
