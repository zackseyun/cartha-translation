lexical_decisions:
- source_word: ἕξει … δουλεύειν
  choice: у него будут … чтобы служить
  rationale: 'Оборот ἔχω с дополнением и инфинитивом передан как обладание людьми, предназначенными для служения, а не однозначно как понуждение: так сохраняется конструкция и её смысловая напряжённость.'
- source_word: λαοὺς ἐθνῶν
  choice: народы племён
  rationale: Различение между λαοί и ἔθνη сохранено посредством двух русских слов; перевод не сводит выражение без необходимости к конфессионально нагруженному слову «язычники».
- source_word: δουλεύειν
  choice: служить
  rationale: Глагол обозначает служение и подчинение; образ ярма в той же фразе достаточно ясно передаёт несвободу такого служения.
- source_word: ζυγὸν
  choice: ярмо
  rationale: Сохраняется конкретная метафора подчинения, присутствующая в греческом тексте.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычный библейский русский эквивалент титула κύριος в данном богословском контексте.
- source_word: δοξάσει
  choice: прославит
  rationale: Прямой, естественный и богословски весомый эквивалент δοξάζω.
- source_word: ἐν ἐπισήμῳ πάσης τῆς γῆς
  choice: на месте, видном всей земле
  rationale: Субстантивированное ἐπισήμῳ понято пространственно — как заметное, всем видимое место; родительный πάσης τῆς γῆς не истолкован как сравнительный оборот «выше всей земли».
theological_decisions:
- issue: Кого обозначает ἔθνη
  choice: племена
  alternative: язычники
  rationale: Основной текст сохраняет этническое значение слова и не решает заранее, употреблено ли оно здесь как специальное обозначение язычников.
- issue: Характер власти над народами
  choice: служить ему под его ярмом
  alternative: быть его рабами под его ярмом
  rationale: Перевод сохраняет реальность подчинения через образ ярма, но не усиливает δουλεύειν до однозначного обозначения рабского статуса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Необычное сочетание «народы племён» сознательно сохраняет два разных греческих существительных; возможное значение «язычники» вынесено в примечание. Порядок частей и повтор местоимения «он» обеспечивают ясность длинного сложного предложения.
