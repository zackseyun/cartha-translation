base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/021.yaml
  text: The everlasting springs from the depths[a], from the lofty mountains, were restrained, because there was no one among them doing righteousness and justice; from their ruler to the least of the people[b], all were in every kind of sin.
translation:
  language: ru
  text: Вечные источники, бьющие из бездн и с высоких гор, были удержаны[a], потому что среди них не было никого, кто творил бы праведность и правосудие. От их правителя до самого малого из народа[b] — все были во всяком грехе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «древние источники»; слово может указывать как на непреходящую длительность, так и на существование издревле.'
    reason: lexical_alternative
  - marker: b
    text: То есть до человека, занимающего самое низкое положение в народе.
    reason: clarification
lexical_decisions:
- source_word: πηγαὶ
  choice: источники
  rationale: Слово обозначает природные источники текущей воды; «источники» ясно и естественно передаёт образ.
- source_word: συνεσχέθησαν
  choice: были удержаны
  rationale: Пассивная форма означает, что течение было сдержано или остановлено; перевод сохраняет образ внешнего удержания и не подменяет его простым «иссякли».
- source_word: αἰώνιοι
  choice: вечные
  rationale: Передаёт длительность и возвышенный псалмический регистр; возможное значение «древние» отмечено в сноске.
- source_word: ἐξ ἀβύσσων
  choice: бьющие из бездн
  rationale: Предлог указывает на происхождение воды. Добавленное по смыслу причастие «бьющие» естественно связывает источники с местом их выхода, не меняя образа.
- source_word: ἀπὸ ὀρέων ὑψηλῶν
  choice: с высоких гор
  rationale: Прямой и естественный русский эквивалент, обозначающий второе место происхождения источников.
- source_word: ποιῶν δικαιοσύνην καὶ κρίμα
  choice: творил бы праведность и правосудие
  rationale: Сохраняется активный характер нравственного действия и различие между этической праведностью и судебно-общественным правосудием.
- source_word: ἄρχοντος
  choice: правителя
  rationale: Широкое обозначение лица, стоящего во главе общества, соответствует противопоставлению самому малому из народа.
- source_word: ἐλαχίστου
  choice: самого малого
  rationale: Суперлатив обозначает нижнюю ступень общественной иерархии; формулировка сохраняет намеренно широкий охват.
- source_word: ἐν πάσῃ ἁμαρτίᾳ
  choice: во всяком грехе
  rationale: Близко передаёт всеобъемлющую формулу греческого текста и сохраняет библейский регистр.
theological_decisions:
- issue: Передача δικαιοσύνη в паре с κρίμα
  choice: праведность и правосудие
  alternative: правда и суд; поступать праведно и справедливо
  rationale: 'Выбранный вариант не сводит оба понятия к одной идее: δικαιοσύνη передано как нравственная праведность, а κρίμα — как правосудие. Тем самым сохраняется этико-судебное напряжение исходной пары.'
- issue: Всеобщность греха в заключительной фразе
  choice: От их правителя до самого малого из народа — все были во всяком грехе
  alternative: от их правителя и до самого малого из народа — во всяком грехе
  rationale: В греческом заключение эллиптично. «Все были» делает русскую фразу понятной, не превращая её в утверждение о конкретном одном грехе и сохраняя всеобщий охват.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Синтаксис проясняет, что бездны и высокие гор — места происхождения источников, а не места, от которых их удерживали. Эллипсис последней греческой фразы раскрыт минимально.
