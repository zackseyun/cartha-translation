  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: αἰώνιοι отражено как «вечные» с уместной альтернативой «древние» в сноске; ἐξ ἀβύσσων и ἀπὸ ὀρέων ὑψηλῶν ясно обозначены как происхождение источников; συνεσχέθησαν корректно передано страдательной формой «были удержаны». Всеобщий охват заключительной фразы и её эллиптическая структура переданы без существенного добавления смысла.'
