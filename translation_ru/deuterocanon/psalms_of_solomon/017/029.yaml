lexical_decisions:
- source_word: ἀφήσει
  choice: не позволит
  rationale: Будущее время ἀφίημι с инфинитивом μεῖναι выражает здесь недопущение продолжения состояния; «не позволит… оставаться» естественно передаёт эту конструкцию.
- source_word: ἀδικίαν
  choice: неправедности
  rationale: ἀδικία обозначает неправедность, несправедливость или беззаконие; «неправедность» сохраняет нравственно-религиозный регистр псалма.
- source_word: ἔτι
  choice: больше не
  rationale: При отрицании указывает на прекращение прежнего состояния и идиоматично передаётся сочетанием «больше не».
- source_word: μεῖναι
  choice: оставаться
  rationale: Сохраняет основное значение пребывания или продолжения существования и естественно сочетается с «не позволит».
- source_word: ἐν αὐτῶν
  choice: среди них
  rationale: Переданный греческий текст здесь грамматически неровен, однако контекст указывает на пребывание неправедности внутри общины; «среди них» сохраняет коллективный смысл.
- source_word: κατοικήσει
  choice: будет жить
  rationale: κατοικέω означает устойчивое проживание. «Будет жить» звучит естественно в современном русском, сохраняя смысл постоянного пребывания.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Единственное число имеет обобщающее значение; «человек» сохраняет форму исходного текста без ограничения смысла только мужчинами.
- source_word: εἰδὼς κακίαν
  choice: знающий нечестие
  rationale: Причастие с дополнением передаёт знакомство с нравственным злом, возможно и причастность к нему; буквальная формулировка сохраняет эту смысловую напряжённость.
- source_word: κακίαν
  choice: нечестие
  rationale: κακία здесь обозначает широкое нравственное зло, а не только злой умысел; «нечестие» соответствует возвышенному нравственному контексту.
theological_decisions:
- issue: Нравственное исключение из восстановленной общины
  choice: Стих говорит об устранении неправедности и о том, что человек, знающий нечестие, не будет жить среди народа.
  alternative: Передать ἀδικία как «несправедливость», а εἰδὼς κακίαν истолковать более явно как «творящий зло».
  rationale: Выбранный вариант сохраняет различие между абстрактной неправедностью и человеком, знакомым с нечестием, не добавляя отсутствующего в греческом тексте прямого утверждения о совершении зла и не привнося позднейших доктринальных категорий.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмической речи. Синтаксис сделан ясным, но выражение «знающий нечестие» сохранено намеренно, чтобы не устранять неоднозначность греческого оборота εἰδὼς κακίαν.
