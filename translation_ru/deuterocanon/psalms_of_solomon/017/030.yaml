  yaml_path: translation/deuterocanon/psalms_of_solomon/017/030.yaml
  text: For he will recognize them[a], that they all are sons of their God[c][b], and he will apportion them among their tribes upon the land.
translation:
  language: ru
  text: 'Ибо он узнает их: все они — сыновья Бога своего[a], и он распределит их по их коленам на земле[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети Бога своего». В греческом тексте буквально: «сыновья».'
