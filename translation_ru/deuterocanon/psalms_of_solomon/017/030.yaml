  - marker: b
    text: «На земле» может относиться как к земле Израиля, так и к земле в более широком смысле.
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσεται
  choice: узнает
  rationale: Будущая форма γινώσκω здесь обозначает распознавание и признание тех, о ком идет речь, а не простое получение сведений.
- source_word: υἱοὶ θεοῦ εἰσιν αὐτῶν
  choice: все они — сыновья их Бога
  rationale: Сохраняется явно мужское множественное υἱοί и естественно передается притяжательное αὐτῶν при θεοῦ; формулировка выражает принадлежность и достоинство, не добавляя доктринального толкования.
- source_word: καταμερίσει
  choice: распределит
  rationale: Глагол передает разделение или назначение по долям; «распределит» естественно по-русски и сохраняет смысл упорядоченного наделения.
- source_word: ἐν ταῖς φυλαῖς αὐτῶν
  choice: по их коленам
  rationale: В контексте Израиля φυλαί — «колена»; предлог ἐν здесь допускает распределительный смысл, естественно передаваемый по-русски сочетанием «по их коленам».
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Передает ἐπί с родительным и сохраняет лексическую неоднозначность γῆ между конкретной землей/страной и землей в более широком смысле.
theological_decisions:
- issue: Передача υἱοὶ θεοῦ
  choice: сыновья их Бога
  alternative: дети их Бога
  rationale: Основной текст сохраняет мужское существительное источника и возможный оттенок заветного статуса; более обобщенная русская передача отмечена в сноске.
- issue: Значение ἐπὶ τῆς γῆς
  choice: на земле
  alternative: в стране / на Земле
  rationale: Контекст может указывать на землю Израиля, однако само γῆ допускает более широкий смысл. Русское «на земле» сохраняет эту подлинную неоднозначность, а сноска поясняет варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Двоеточие после «узнает их» яснее передает содержание последующего ὅτι; «колена» сохраняет традиционное и понятное обозначение племен Израиля.
