lexical_decisions:
- source_word: κατάξει
  choice: сокрушит
  rationale: Печатный текст Суита содержит κατάξει — будущее время от κατάγνυμι, «сломать, разбить, сокрушить». Перевод следует засвидетельствованному тексту, а не предполагаемой конъектуре πατάξει («поразит»).
- source_word: γῆν
  choice: землю
  rationale: γῆ может обозначать как всю землю, так и конкретную страну или землю; в основном тексте сохранён более широкий и возвышенный вариант, а локальное значение отмечено в сноске.
- source_word: τῷ λόγῳ τοῦ στόματος αὐτοῦ
  choice: словом своих уст
  rationale: Близкий перевод сохраняет библейский образ властного слова, которым царь совершает суд, не превращая его в отвлечённые «приказ» или «веление».
- source_word: εἰς αἰῶνα
  choice: навеки
  rationale: Естественное для современного русского языка выражение длительности и окончательности действия, сохраняющее торжественный тон.
theological_decisions:
- issue: Возможная отсылка к Исайе 11:4 и суд мессианского царя посредством слова
  choice: Сохранить образ сокрушения земли словом уст
  alternative: «Будет править землёй своим повелением» или «поразит землю словом своих уст»
  rationale: Греческий текст изображает действенную судебную власть речи. При этом «сокрушит» передаёт именно напечатанное κατάξει, тогда как «поразит» отражало бы вероятную конъектуру πατάξει и более прямое согласование с Исайей 11:4.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Порядок слов сделан естественным для русского языка; образ «слово уст» намеренно сохранён как поэтически и богословски значимый.
