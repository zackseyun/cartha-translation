  text: You[a], Lord, chose David as king over Israel, and you swore to him concerning his offspring forever[b], that his kingdom would not fail before you.
translation:
  language: ru
  text: Ты, Господи, избрал Давида царём над Израилем и поклялся ему, что его потомство пребудет вовеки[a] и что его царство[b] не прекратится перед Тобой.
