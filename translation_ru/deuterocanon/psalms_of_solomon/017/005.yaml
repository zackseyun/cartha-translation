lexical_decisions:
- source_word: ᾑρέτισω
  choice: избрал
  rationale: Глагол обозначает Божий выбор Давида на царство; «избрал» точно передаёт смысл и сохраняет возвышенный, но современный регистр.
- source_word: Κύριε
  choice: Господи
  rationale: Форма звательного обращения к Богу естественно передаётся традиционным русским обращением «Господи».
- source_word: βασιλέα ἐπʼ Ἰσραήλ
  choice: царём над Израилем
  rationale: Оборот обозначает царскую власть над Израилем; творительный падеж после «избрал» звучит по-русски естественно.
- source_word: περὶ τοῦ σπέρματος
  choice: о его потомстве
  rationale: В контексте σπέρμα означает линию потомков Давида. «Потомство» ясно современному читателю, а буквальное «семя» приведено в сноске.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: В языке обетования оборот выражает непреходящую длительность; «навеки» сохраняет и смысл, и торжественный тон.
- source_word: τοῦ μὴ ἐκλείπειν
  choice: не прекратится
  rationale: Оборот передаёт отсутствие конца или пресечения. «Не прекратится» естественно сочетается с царством и не уточняет сверх текста способ исполнения обещания.
- source_word: ἀπέναντί σου
  choice: пред Тобой
  rationale: Формулировка сохраняет пространственно-реляционный образ пребывания царства перед Богом и соответствует достоинству молитвенного обращения.
- source_word: βασίλειον αὐτοῦ
  choice: царство его
  rationale: Это ближайшее формальное соответствие греческому существительному; возможный династический оттенок сохраняется в сноске, а не подменяет основной текст.
theological_decisions:
- issue: Обетование Давиду о продолжении царской линии
  choice: «царство его не прекратится пред Тобой»
  alternative: «его династия не пресечётся пред Тобой»
  rationale: Греческий текст соединяет упоминание потомства (σπέρμα) и царства (βασίλειον). Основной перевод сохраняет эту напряжённость и не сводит «царство» исключительно к династии, тогда как сноска отмечает вероятный династический смысл.
- issue: Связь выражения εἰς τὸν αἰῶνα
  choice: «о его потомстве навеки» в рамках содержания клятвы
  alternative: «поклялся ему навеки о его потомстве»
  rationale: Положение оборота допускает некоторую синтаксическую подвижность. Выбранный порядок естественен по-русски и передаёт вечную силу обетования о линии Давида, не превращая клятву в отдельное действие, совершаемое «навеки».
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-заветного контекста. Сохранены прямое обращение к Богу, параллельное повторение местоимения и лексическая связь между потомством Давида и его царством; архаизирующие формы сведены к уместному «пред Тобой».
