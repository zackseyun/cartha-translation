  yaml_path: translation/deuterocanon/psalms_of_solomon/017/003.yaml
  text: But we will hope in God our savior, because the dominion of our God is forever with mercy, and the kingdom of our God is forever over the nations.
translation:
  language: ru
  text: Мы же будем уповать на Бога, Спасителя нашего, потому что владычество Бога нашего — вовеки, с милостью, и Царство Бога нашего — вовеки над народами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλπιοῦμεν ἐπὶ
  choice: будем уповать на
  rationale: Передаёт будущее время и направленное доверие, выраженное конструкцией с ἐπί.
- source_word: σωτῆρα ἡμῶν
  choice: Спасителя нашего
  rationale: Точно передаёт личное наименование Бога как спасителя; порядок слов сохраняет возвышенный поэтический регистр.
- source_word: τὸ κράτος
  choice: владычество
  rationale: Передаёт не только силу, но и властное господство; соответствует параллельному «Царство», не сливаясь с ним.
- source_word: μετʼ ἐλέους
  choice: с милостью
  rationale: Формально сохраняет краткую и несколько неоднозначную предложную конструкцию греческого текста.
- source_word: ἡ βασιλεία
  choice: Царство
  rationale: Обычное и контекстуально точное обозначение царской власти и царства Бога.
- source_word: ἐπὶ τὰ ἔθνη
  choice: над народами
  rationale: Передаёт господство, распространяющееся на народы; множественное число не ограничивает смысл язычниками как отдельной религиозной категорией.
theological_decisions:
- issue: Соотношение вечного владычества Бога и милости
  choice: «навеки, с милостью»
  alternative: «владычество Бога нашего с милостью — навеки»
  rationale: 'Сохранена синтаксическая напряжённость оригинала: «с милостью» можно слышать как характеристику вечного владычества, не уточняя искусственно точную связь.'
- issue: Объём Божьего Царства
  choice: «над народами»
  alternative: «над язычниками»
  rationale: «Народы» сохраняет широкий смысл ἔθνη и не вносит более узкого конфессионального противопоставления.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инверсия «Спасителя нашего» и прописное «Царство» поддерживают сакрально-поэтический регистр, не делая текст архаичным.
