base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/002.yaml
  text: And what is the span of a man's life on the earth? According to his span[b][a], so also is his hope upon him.
translation:
  language: ru
  text: И каков срок жизни человека на земле? Каков его срок, такова и надежда на него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «на него» могут относиться либо к человеку, либо к сроку его жизни.
    reason: alternative_reading
lexical_decisions:
- source_word: χρόνος ζωῆς
  choice: срок жизни
  rationale: Сочетание обозначает ограниченную продолжительность земной жизни человека; «срок жизни» естественно передаёт эту меру и сохраняет образ конечности.
- source_word: ἀνθρώπου
  choice: человека
  rationale: Единственное число имеет обобщающий смысл и в современном русском естественно передаётся словом «человек».
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Прямое и естественное обозначение земной сферы человеческой жизни.
- source_word: κατὰ τὸν χρόνον αὐτοῦ
  choice: каков его срок
  rationale: Парная конструкция «каков… такова…» передаёт соответствие или соразмерность, выраженную κατά, не сводя её лишь к одновременной продолжительности.
- source_word: ἐλπὶς
  choice: надежда
  rationale: Обычный и точный эквивалент существительного ἐλπίς в данном контексте.
- source_word: ἐπʼ αὐτόν
  choice: на него
  rationale: Русское «него» сохраняет мужской род греческого местоимения и может относиться как к человеку, так и к сроку, не устраняя подлинную синтаксическую неоднозначность.
theological_decisions:
- issue: К чему относится местоимение в ἐπʼ αὐτόν
  choice: Сохранить неоднозначное «на него» в основном тексте
  alternative: Явно отнести местоимение либо к человеку («на человека»), либо к сроку жизни («на этот срок»)
  rationale: Греческое местоимение мужского рода грамматически допускает обе связи. Контекст следующего стиха может поддерживать мысль о надежде на человека, тогда как ближайшее существительное χρόνος позволяет связь со сроком; русский перевод способен естественно сохранить обе возможности.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной параллельной конструкцией. Повтор слова «срок» сохраняет связь двух употреблений χρόνος; формула «каков… такова…» передаёт соразмерность и звучит естественно и достойно.
