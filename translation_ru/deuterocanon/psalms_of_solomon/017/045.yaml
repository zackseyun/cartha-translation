  text: Shepherding the Lord’s flock in faithfulness and righteousness[d][c][b][a], he will not allow any among them to grow weak in their pasture.
translation:
  language: ru
  text: Пася стадо Господа с верностью[a] и праведностью[b], он не даст никому из них ослабеть на их пастбище[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в вере»; греческое πίστει может означать как веру, так и верность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливостью».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее: «не даст ослабеть среди них на их пастбище»; субъект глагола «ослабеть» в греческом прямо не назван.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ποιμαίνων
  choice: Пася
  rationale: Причастие сохраняет пастырский образ царского правления и формально соответствует греческой форме, естественно связываясь с последующим личным глаголом.
- source_word: τὸ ποίμνιον
  choice: стадо
  rationale: Передаёт группу овец и ясно продолжает образ пастыря; в данном контексте по-русски естественнее, чем уменьшительное «малое стадо».
- source_word: Κυρίου
  choice: Господа
  rationale: Родительный падеж передаёт принадлежность стада Господу и соответствует принятой передаче κύριος.
- source_word: ἐν πίστει
  choice: с верностью
  rationale: В контексте правления речь, вероятнее всего, о верном, надёжном исполнении пастырского служения. Предлог «с» естественно выражает образ действия, не устраняя возможного значения «в вере».
- source_word: δικαιοσύνῃ
  choice: праведностью
  rationale: Сохраняет широкое нравственно-богословское значение δικαιοσύνη; «справедливость» остаётся допустимой контекстуальной альтернативой.
- source_word: οὐκ ἀφήσει
  choice: не даст
  rationale: В сочетании с инфинитивом глагол означает недопущение; «не даст ... ослабеть» — естественная современная русская конструкция.
- source_word: ἀσθενῆσαι
  choice: ослабеть
  rationale: Передаёт наступление состояния слабости, выраженное аористным инфинитивом.
- source_word: ἐν αὐτοῖς
  choice: никому из них
  rationale: Дистрибутивно раскрывает подразумеваемого субъекта инфинитива внутри стада, не превращая слабость в свойство стада как целого.
- source_word: ἐν τῇ νομῇ αὐτῶν
  choice: на их пастбище
  rationale: Сохраняет пастушескую образность и естественно обозначает место выпаса.
theological_decisions:
- issue: Значение πίστει
  choice: верность правителя-пастыря
  alternative: вера
  rationale: Синтаксически выражение характеризует то, как он пасёт стадо; поэтому «верность» здесь вероятнее, но многозначность отмечена в сноске.
- issue: Подразумеваемый субъект ἀσθενῆσαι
  choice: никто из стада
  alternative: стадо как совокупность
  rationale: ἐν αὐτοῖς естественно понимается дистрибутивно — «среди них / кто-либо из них»; перевод не уточняет причину возможной слабости.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Пастырская метафора последовательно сохранена словами «пася», «стадо» и «пастбище». Причастное начало отражает форму греческого ποιμαίνων и сохраняет некоторую синтаксическую напряжённость оригинала, не делая фразу неестественной.
