translation:
  language: ru
  text: когда против них восстал человек, чужой нашему роду[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человек, чужой нашему народу».'
    reason: 'Лексическая альтернатива: γένος может обозначать как род и происхождение, так и народ как общность.'
lexical_decisions:
- source_word: ἐν τῷ ἐπαναστῆναι
  choice: когда … восстал
  rationale: Сочетание ἐν с субстантивированным инфинитивом имеет здесь временное значение; «когда … восстал» естественно передаёт эту конструкцию и сохраняет глагольную силу выражения.
- source_word: αὐτοῖς
  choice: против них
  rationale: При ἐπανίστημι дательный падеж обозначает тех, кому противостоят; по-русски это естественно передаётся сочетанием «против них».
- source_word: ἄνθρωπον
  choice: человек
  rationale: Существительное стоит в единственном числе; «человек» точно и естественно сохраняет форму исходного текста, не добавляя лишней конкретизации.
- source_word: ἀλλότριον
  choice: чужой
  rationale: В данном контексте слово указывает на принадлежность к иной этнической или родовой общности. «Чужой» естественно сочетается с дательным «нашему роду» и не сводит значение исключительно к гражданству или месту рождения.
- source_word: γένους ἡμῶν
  choice: нашему роду
  rationale: γένος может обозначать род, происхождение или народ. «Нашему роду» близко к греческой форме и сохраняет оттенок общности по происхождению; более широкое «нашему народу» вынесено в примечание.
