translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, псалмическим звучанием. Сохранена синтаксическая незавершённость исходного фрагмента и строчная буква в начале. Порядок слов «против них восстал» подчёркивает направленность выступления, не утяжеляя фразу.
