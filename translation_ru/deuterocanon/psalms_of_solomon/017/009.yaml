  source_fidelity: Текст точно передаёт временную конструкцию ἐν τῷ + инфинитив («когда»), противительное значение дательного при ἐπανίστημι («против них») и единственное число ἄνθρωπον («человек»). Формула «чужой нашему роду» адекватно выражает ἀλλότριον γένους ἡμῶν, не сужая значение до гражданства или географии.
  naturalness: Фраза грамматически ясна и естественна для современного литературного русского с уместно сдержанным возвышенным оттенком. Инверсия «против них восстал» хорошо передаёт акцент исходного выражения. Строчная буква и фрагментарность оправданы тем, что это часть продолжающегося предложения.
  terminology: «Род» является допустимым и близким к γένος обозначением общности происхождения; примечание корректно фиксирует возможное более широкое понимание как «народ». «Чужой» сохраняет этно-родовой смысл ἀλλότριος без современной юридической окраски слова «иностранец».
