  yaml_path: translation/deuterocanon/psalms_of_solomon/004/021.yaml
  text: May the flesh of people-pleasers be scattered by wild beasts[a], and the bones of the lawless lie before the sun in dishonor.
translation:
  language: ru
  text: Пусть дикие звери растащат плоть тех, кто угождает людям, а кости[a] беззаконников пусть лежат перед солнцем в бесчестии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В предоставленной греческой строке стоит οὐτὰ, однако в издании Swete напечатано ὀστᾶ — «кости».
    reason: Текстологическое пояснение исправления ошибки в переданном тексте источника.
lexical_decisions:
- source_word: σκορπισθείησαν
  choice: пусть … растащат
  rationale: Аористный пассивный оптатив выражает пожелание-проклятие. Активная конструкция с «пусть» естественна по-русски, сохраняет образ рассеяния останков зверями и не превращает пожелание в предсказание.
- source_word: σάρκες
  choice: плоть
  rationale: Слово обозначает телесную плоть и сохраняет конкретный, мрачный образ; «тела» было бы более обобщённым.
- source_word: ἀνθρωπαρέσκων
  choice: тех, кто угождает людям
  rationale: Описательный перевод точно передаёт значение сложного слова и звучит понятнее для современного читателя, чем редкое «человекоугодники».
- source_word: ὑπὸ θηρίων
  choice: дикие звери
  rationale: θηρία обозначает диких, опасных животных; в русской активной конструкции они становятся грамматическим подлежащим без изменения смысловой роли.
- source_word: ὀστᾶ (в предоставленной строке ошибочно οὐτὰ)
  choice: кости
  rationale: В издании Swete напечатано ὀστᾶ, «кости». Это чтение образует точный смысловой параллелизм с «плотью» в первой половине стиха.
- source_word: παρανόμων
  choice: беззаконников
  rationale: Передаёт нравственно-правовой смысл тех, кто поступает вопреки закону, и соответствует возвышенному регистру текста.
- source_word: κατέναντι τοῦ ἡλίου
  choice: перед солнцем
  rationale: Близко сохраняет греческий образ открытого, публичного выставления останков, не сводя его только к значению «под солнцем».
- source_word: ἐν ἀτιμίᾳ
  choice: в бесчестии
  rationale: Сохраняет значение лишения чести и позорного состояния, а также торжественно-судебный тон проклятия.
