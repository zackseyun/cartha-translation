  text: И они не помнили Бога и не боялись Бога при всём этом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: не помнили
  rationale: Аористная форма μιμνῄσκομαι означает помнить или держать в уме; «не помнили Бога» прямо и естественно передаёт смысл, не добавляя толкования.
- source_word: ἐφοβήθησαν
  choice: не боялись
  rationale: При Боге как объекте φοβέομαι может включать страх и благоговение. «Не боялись Бога» сохраняет образ и нравственную весомость исходного текста, не сводя значение лишь к почтению.
- source_word: ἐν πᾶσι τούτοις
  choice: при всём этом
  rationale: Оборот указывает на совокупность описанных обстоятельств. «При всём этом» естественно по-русски передаёт контекстуальный смысл греческой фразы.
