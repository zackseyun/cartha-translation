    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρήμωσεν
  choice: разорил
  rationale: Глагол обозначает опустошение и доведение до разорения; «разорил» естественно по-русски и сохраняет тяжесть действия.
- source_word: οἴκους
  choice: дома
  rationale: Передаёт прямое значение слова, не исключая подразумеваемого расширенного смысла — домочадцев или семей; этот смысл отмечен в сноске.
- source_word: ἀνθρώπων
  choice: людские
  rationale: Передаёт родительный оборот «людей» идиоматичным русским определением и не вводит неоправданно мужского значения.
- source_word: ἐν ἀτιμίᾳ
  choice: в бесчестии
  rationale: Сохраняет существительное со значением бесчестия и позора, не уточняя без достаточных оснований, относится ли оно прежде всего к способу действия или к состоянию пострадавших.
- source_word: ἐσκόρπισεν
  choice: рассеял
  rationale: Прямо сохраняет образ разбрасывания и распада единства.
- source_word: ἐπιθυμίᾳ
  choice: похотью
  rationale: Контекст бесчестия поддерживает отрицательное значение страстного желания; творительный падеж сохраняет возможный инструментальный или причинный оттенок греческого дательного.
