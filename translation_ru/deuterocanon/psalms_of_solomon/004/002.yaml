  text: Excessive in speech, excessive in outward show above all others, the one harsh in speech to condemn sinners in judgment.
translation:
  language: ru
  text: Неумерен в речах, в своей внешней показности — больше всех; суров в речах, чтобы осуждать грешников на суде.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περισσὸς ἐν λόγοις
  choice: неумерен в речах
  rationale: Передаёт значение чрезмерности, не сводя выражение только к многословию; λόγοις здесь относится к речи или словам.
- source_word: περισσὸς ἐν σημειώσει
  choice: выставляет себя напоказ
  rationale: σημείωσις в данном контексте обозначает заметную внешнюю демонстративность; естественная русская формулировка сохраняет отрицательную оценку, не добавляя указания на показное благочестие, которого прямо нет в греческом тексте.
- source_word: ὁ σκληρὸς ἐν λόγοις
  choice: тот, кто суров в речах
  rationale: Сохраняет определённую субстантивированную конструкцию с артиклем и повтор λόγοις.
- source_word: κατακρῖναι ἁμαρτωλοὺς ἐν κρίσει
  choice: осуждая грешников на суде
  rationale: Передаёт судебную лексику κατακρῖναι и κρίσει без уточнения, идёт ли речь о человеческом или ином суде.
theological_decisions:
- issue: Характер суда в выражении ἐν κρίσει
  choice: на суде
  alternative: при вынесении приговора
  rationale: Более буквальный вариант сохраняет неопределённость исходного текста и не вводит конкретную богословскую трактовку суда.
translation_notes:
  register: Современный литературный русский язык; обличительный, афористичный строй оригинала сохранён. Тире помогает естественно связать начальные характеристики с субстантивированной конструкцией ὁ σκληρός, не устраняя некоторую синтаксическую напряжённость греческого текста.
