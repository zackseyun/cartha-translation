  rationale: 'Исправлена только передача περισσὸς ἐν σημειώσει: вместо глагольного «выставляет себя напоказ» поставлена именная характеристика, соответствующая повтору περισσός и английскому «excessive in outward show». «В своей» добавлено как естественная русская связка и не определяет, что именно демонстрируется. Точка с запятой делит две параллельные пары характеристик, а «чтобы осуждать» ближе передаёт κατακρῖναι.'
