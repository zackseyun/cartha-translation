lexical_decisions:
- source_word: παρελογίσατο
  choice: ложно рассудил
  rationale: Глагол обозначает ошибочное или обманчивое рассуждение. Этот вариант сохраняет мыслительный оттенок и не уточняет без достаточных оснований, обманул ли человек самого себя или пытался обмануть других.
- source_word: ἐν λόγοις
  choice: в своих словах
  rationale: Так передаётся связь ошибочного рассуждения со словами или высказыванием; местоимение «своих» естественно для русского языка и не меняет подразумеваемого субъекта.
- source_word: ὁρῶν
  choice: видит
  rationale: Субстантивированное причастие настоящего времени естественно передаётся придаточным «кто видит», сохраняя значение наблюдения.
- source_word: κρίνων
  choice: судит
  rationale: Причастие образует пару с «видит» и обозначает нравственную либо судебную оценку; «судит» — наиболее прямой эквивалент.
theological_decisions:
- issue: Подразумеваемый субъект причастий ὁρῶν и κρίνων
  choice: «Нет никого, кто видит и судит»
  alternative: «Он не видит и не судит» или прямое упоминание Бога
  rationale: Греческий текст отрицает существование видящего и судящего наблюдателя, но прямо не называет Бога. Перевод сохраняет эту формальную неопределённость и не вводит отсутствующий в строке субъект.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического религиозного текста. Формулировка близка к греческому синтаксису, но естественна по-русски; двусмысленность глагола вынесена в сноску.
