  source_fidelity: «Да будет» точно передаёт молитвенно-пожелательный аористный оптатив γένοιτο. Обращение «Господи» соответствует звательному Κύριε; «милость Твоя» передаёт τὸ ἔλεός σου; «на всех любящих Тебя» сохраняет ἐπὶ πάντας и субстантивированный причастный оборот πάντας τοὺς ἀγαπῶντάς σε без добавления толкований.
