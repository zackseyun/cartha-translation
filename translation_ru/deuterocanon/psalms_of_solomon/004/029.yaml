  text: Да будет милость Твоя, Господи, на всех любящих Тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γένοιτο
  choice: да будет
  rationale: Аорист оптатива γίνομαι выражает пожелание-молитву; «да будет» естественно передаёт эту силу и сохраняет возвышенный молитвенный тон.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος является прямым обращением к Богу; русская звательная форма «Господи» традиционна, ясна и соответствует контексту.
- source_word: τὸ ἔλεός σου
  choice: милость Твоя
  rationale: ἔλεος прямо обозначает милость или сострадание; «милость» здесь точно и естественно, а порядок слов поддерживает молитвенный регистр.
- source_word: ἐπὶ
  choice: на
  rationale: ἐπί с винительным обозначает направленность или пребывание милости на людях; русское «на» кратко и идиоматично в библейской молитвенной речи.
- source_word: πάντας τοὺς ἀγαπῶντάς σε
  choice: всех любящих Тебя
  rationale: Субстантивированное причастие настоящего времени обозначает всех людей, для которых характерна любовь к Богу; русская конструкция точно сохраняет значение и лаконизм оригинала.
theological_decisions:
- issue: Передача κύριος при прямом обращении к Богу
  choice: Господи
  alternative: Владыка
  rationale: «Господи» непосредственно соответствует κύριος в молитвенном обращении, сохраняет библейскую преемственность и не вносит дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Заглавные буквы в местоимениях «Твоя», «Тебя» отмечают обращение к Богу и соответствуют принятому русскому религиозному письму; архаическая лексика не используется.
