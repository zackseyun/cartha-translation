lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπὶ πᾶσαν γυναῖκα
  choice: Глаза его устремлены на всякую женщину
  rationale: Сохранён конкретный образ глаз как направленного взгляда; ἐπί с винительным передаёт направленность, а πᾶσαν — всеобщность без исключения.
- source_word: ἄνευ διαστολῆς
  choice: без разбора
  rationale: διαστολή буквально связана с различением или разграничением. «Без разбора» естественно передаёт неразборчивую направленность взгляда, не устраняя возможного оттенка отсутствия сдержанности.
- source_word: ἡ γλῶσσα ψευδὴς
  choice: язык его лжив
  rationale: Сохранена метонимия языка как орудия речи; «лжив» точно выражает качество речи, обозначенное ψευδής.
- source_word: ἐν συναλλάγματι
  choice: при заключении сделки
  rationale: συνάλλαγμα обозначает сделку, соглашение или договорное обязательство. Оборот передаёт конкретную ситуацию и не сужает её до строго юридического договора.
- source_word: μεθʼ ὅρκου
  choice: с клятвой
  rationale: Буквально передаёт сопровождение сделки клятвой, не привнося значения официального свидетельства в суде.
