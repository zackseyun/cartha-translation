lexical_decisions:
- source_word: οὐκ ἀπέστη
  choice: не остановился
  rationale: В данном контексте глагол выражает не физический уход, а упорное продолжение губительных действий; современное русское «не остановился» естественно передаёт этот смысл.
- source_word: ἐνίκησεν
  choice: добился того
  rationale: С последующим инфинитивом слово обозначает успешное достижение цели, а не буквальную военную победу.
- source_word: σκορπίσαι
  choice: рассеял их
  rationale: Греческий текст не называет прямого дополнения; местоимение «их» передаёт подразумеваемых людей, не вводя заранее «дом» из следующей части стиха.
- source_word: ὡς ἐν ὀρφανίᾳ
  choice: словно осиротевших
  rationale: Фраза в греческом необычна и допускает разные оттенки. Перевод сохраняет образ людей, оставшихся без семьи или защиты, а буквальная форма и альтернативы отмечены в сноске.
- source_word: ἠρήμωσεν οἶκον
  choice: опустошил дом
  rationale: «Опустошил» передаёт значение приведения в запустение, а «дом» сохраняет конкретный образ греческого οἶκον, который в контексте может означать и семейство.
- source_word: ἕνεκεν ἐπιθυμίας παρανόμου
  choice: ради беззаконного желания
  rationale: «Беззаконное» сохраняет нравственно-правовую окраску παρανόμου, тогда как «желание» не сужает более широкое значение ἐπιθυμία до одного лишь сексуального вожделения.
