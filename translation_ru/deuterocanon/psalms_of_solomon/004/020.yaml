  text: May his old age be in the solitude of childlessness[b][a], for removal.
translation:
  language: ru
  text: Пусть его старость будет одинокой, бездетной — до тех пор, пока он не будет взят.[a]
  philosophy: optimal-equivalence
  footnotes:
