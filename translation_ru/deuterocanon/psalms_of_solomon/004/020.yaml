lexical_decisions:
- source_word: μονίᾳ
  choice: в одиночестве
  rationale: Слово обозначает состояние уединённости и изоляции; в контексте проклятия «одиночество» естественно передаёт личную оставленность.
- source_word: ἀτεκνίας
  choice: бездетности
  rationale: Точно обозначает отсутствие детей и сохраняет связь с семейным наказанием.
- source_word: γῆρας
  choice: старость
  rationale: Обычный и точный русский эквивалент для периода преклонных лет.
- source_word: εἰς ἀνάλημψιν
  choice: до тех пор, пока он не будет взят
  rationale: Передаёт идею взятия или удаления, не уточняя прямо, что речь идёт о смерти; временное прочтение естественно связывает этот оборот с продолжающимся состоянием старости.
- source_word: '[подразумеваемая оптативно-проклинающая сила]'
  choice: Пусть старость его пройдёт
  rationale: Греческая фраза безглагольна, но контекст последовательных проклятий требует передать подразумеваемое пожелание суда.
theological_decisions:
- issue: Передавать ли безглагольную фразу как пожелание или как нейтральное описание
  choice: 'Передать как проклинающее пожелание: «Пусть…»'
  alternative: 'Оставить как именное описание: «Старость его — …»'
  rationale: Контекст представляет собой последовательность молитвенных пожеланий суда, поэтому нейтральное описание ослабило бы силу оригинала.
- issue: Следует ли отождествлять ἀνάλημψις со смертью
  choice: Сохранить образ «будет взят», не называя смерть прямо
  alternative: Перевести «до самой смерти»
  rationale: Контекст допускает смерть как вероятный смысл, однако греческое слово само по себе означает взятие или удаление; прямое упоминание смерти устранило бы сохраняющуюся неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой проклятия. Конструкция «одиночество бездетности» сохранена близко к греческому тексту; глагол «пройдёт» добавлен ради естественности русского синтаксиса.
