  text: May God remove those who live in hypocrisy among the pious[d][c][b][a], in the corruption of his flesh and poverty his life.
translation:
  language: ru
  text: Да удалит Бог тех, кто живёт в лицемерии среди благочестивых[a], и в тлении его плоти и нищете да отнимет его жизнь.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди верных Богу». Греческое ὅσιοι обозначает благочестивых, преданных Богу людей; перевод «святые» также возможен, но может создать не требуемые здесь более поздние ассоциации.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза предельно сжата; буквально: «в тлении его плоти и нищете — его жизнь». Винительное «его жизнь» можно понимать как второе дополнение к «да удалит / отнимет». Единственное число «его» может относиться к типичному представителю названной группы; возможно и распределительное понимание: «их плоть… их жизнь».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐξάραι
  choice: да удалит; да отнимет
  rationale: В первом дополнении глагол передаёт устранение людей из среды благочестивых; при подразумеваемом повторе перед «жизнью» естественное русское соответствие — «отнимет жизнь». Это сохраняет единый греческий глагол, не сводя его значение к прямому физическому уничтожению уже в первой части.
- source_word: ὑποκρίσει
  choice: в лицемерии
  rationale: Прямое и общепонятное соответствие нравственно-религиозному значению ὑπόκρισις.
- source_word: ὁσίων
  choice: благочестивых
  rationale: ὅσιοι здесь обозначает людей, преданных Богу и благочестивой жизни; «благочестивые» точнее передаёт это, чем «святые», которое могло бы смешать ὅσιος с ἅγιος и внести более поздние церковные ассоциации.
- source_word: ἐν φθορᾷ
  choice: среди тления
  rationale: «Тление» сохраняет конкретную связь φθορά с плотью и суровый регистр строки. Предлог «среди» позволяет отнести обстоятельство к отнятию жизни, не превращая его однозначно в характеристику нравственной испорченности.
- source_word: σαρκός αὐτοῦ
  choice: его плоти
  rationale: Сохранены буквальное «плоть» и намеренный переход греческого текста от множественного класса к единственному представителю.
- source_word: πενίᾳ
  choice: нищеты
  rationale: «Нищета» прямо передаёт крайнюю бедность и соответствует обличительно-пророческому регистру.
- source_word: τὴν ζωὴν αὐτοῦ
  choice: жизнь у такого человека
  rationale: Винительный τὴν ζωήν понят как второе дополнение при подразумеваемом повторе ἐξάραι. Формула «у такого человека» сохраняет единственное число αὐτοῦ и ясно показывает его собирательно-представительный характер.
theological_decisions:
- issue: Синтаксическая сила начального ἐξάραι
  choice: 'Молитвенное пожелание: «Да удалит Бог…»'
  alternative: Утверждение «Бог удаляет…» или зависимый инфинитив «чтобы Богу удалить…»
  rationale: Хотя греческая конструкция с инфинитивом сжата, контекст обличения естественнее всего допускает пожелание или проклятие. Русская частица «да» сохраняет эту модальность без превращения строки в простое сообщение.
- issue: Связь τὴν ζωὴν αὐτοῦ с ἐξάραι
  choice: 'Подразумеваемый повтор глагола: «да отнимет жизнь»'
  alternative: Считать «жизнь» частью обстоятельственного оборота либо воспроизвести бессвязную буквальную последовательность
  rationale: Винительный падеж τὴν ζωήν позволяет понимать словосочетание как ещё одно дополнение к ἐξάραι. Повтор глагола по-русски делает сжатый синтаксис понятным, а сноска сохраняет доступ к формальной неоднозначности.
- issue: Единственное число αὐτοῦ после множественного τοὺς… ζῶντας
  choice: 'Сохранить переход к одному типичному представителю: «такого человека… его»'
  alternative: 'Согласовать по смыслу во множественном числе: «их плоть… их жизнь»'
  rationale: Единственное число в источнике может быть не просто механически распределительным, а возвратом к образу отдельного лицемера. Поэтому оно не сглажено во множественное.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-обличительной речи. Формула «да удалит… да отнимет» передаёт импрекативный характер, а «такого человека» делает резкий переход к единственному числу понятным, не устраняя его.
