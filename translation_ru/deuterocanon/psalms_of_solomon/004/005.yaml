lexical_decisions:
- source_word: ἐν νυκτὶ
  choice: Ночью
  rationale: Естественное русское обстоятельство времени, сохраняющее смысл действия под покровом ночи.
- source_word: ἐν ἀποκρύφοις
  choice: в потаённых местах
  rationale: Субстантивированное прилагательное во множественном числе указывает скорее на скрытые места, чем только на образ действия; перевод сохраняет эту конкретность.
- source_word: ἁμαρτάνει
  choice: он грешит
  rationale: Прямой перевод сохраняет нравственную и религиозную весомость греческого глагола.
- source_word: ὡς οὐχ ὁρώμενος
  choice: будто никто его не видит
  rationale: Естественная русская формулировка передаёт сравнительное ὡς и поведение человека, считающего себя незамеченным, не утверждая, что он действительно невидим.
- source_word: ἐν ὀφθαλμοῖς αὐτοῦ λαλεῖ
  choice: глазами он говорит
  rationale: Сохранён яркий телесный образ безмолвной, многозначительной передачи намерения взглядом.
- source_word: πάσῃ γυναικὶ
  choice: каждой женщине
  rationale: Дательный падеж передан прямо; «каждой» сохраняет распределительное значение πάσῃ.
- source_word: ἐν συνταγῇ κακίας
  choice: замышляя зло
  rationale: Греческое выражение обозначает устроение, замысел или сговор, направленный ко злу. Глагольная русская формулировка звучит естественно и передаёт преднамеренность, а возможные более буквальные оттенки отмечены в сноске.
