  text: At night and in secret places he sins as though unseen[c][b][a]; with his eyes he speaks to every woman in a scheme of evil.
translation:
  language: ru
  text: Ночью и в потаённых местах[a] он грешит, будто никто его не видит; глазами он говорит[b] каждой женщине по злому умыслу[c].
