  - severity: low
    issue: Формулировка сноски b не согласована с основной синтаксической передачей
    rationale: 'При основной передаче «судящий праведно» вариант «Судья в праведности» не является равнозначной естественной русской альтернативой. Следует дать лексический вариант для «праведно»: «по справедливости».'
