base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/028.yaml
  text: May God remove those who do every kind of unrighteousness in arrogance[c][b][a], for the Lord our God is a great and mighty judge in righteousness.
translation:
  language: ru
  text: Да удалит Бог тех, кто в гордыне творит всякую неправду[a], ибо Господь, Бог наш, — великий и могучий Судья, и Он судит праведно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершает всякую несправедливость».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξᾶραι
  choice: Да удалит
  rationale: Аористный инфинитив в молитвенно-проклинающем контексте передан как пожелание; «удалит» сохраняет широту значения и не усиливает образ до «истребит».
- source_word: τοὺς ποιοῦντας
  choice: тех, кто ... творит
  rationale: Причастие обозначает людей, для которых такое действие характерно; «творит» естественно сочетается с «неправдой» в возвышенном современном русском.
- source_word: ἐν ὑπερηφανίᾳ
  choice: в гордыне
  rationale: Сохранена именная конструкция и нравственно-религиозная окраска греческого выражения.
- source_word: πᾶσαν ἀδικίαν
  choice: всякую неправду
  rationale: «Неправда» охватывает как неправедность, так и несправедливость, не сужая значение до юридического контекста.
- source_word: κριτὴς
  choice: Судья
  rationale: Судебное значение непосредственно соответствует контексту Божьего праведного суда.
- source_word: κραταιὸς
  choice: могучий
  rationale: Передаёт силу и величие в достойном библейском регистре без архаизации.
- source_word: Κύριος
  choice: Господь
  rationale: Обычная русская передача κύριος как божественного титула.
- source_word: ἐν δικαιοσύνῃ
  choice: судящий праведно
  rationale: В русском языке наречная конструкция ясно связывает выражение с ролью Судьи и естественно передаёт образ действия; добавленное «судящий» имплицировано словом κριτής.
theological_decisions:
- issue: Значение δικαιοσύνη в контексте Божьего суда
  choice: праведно
  alternative: по справедливости
  rationale: «Праведно» сохраняет широкую нравственную и богословскую окраску δικαιοσύνη, тогда как «по справедливости» сильнее сужает её до судебной справедливости.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Порядок слов перестроен ради ясности; пожелательно-императивная сила начальной конструкции сохранена посредством «да удалит».
