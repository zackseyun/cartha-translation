  yaml_path: translation/deuterocanon/psalms_of_solomon/004/001.yaml
  text: Why do you[a], profane one, sit in a holy council, while your heart has gone far away from the Lord[b], provoking the God of Israel with proverbs?
translation:
  language: ru
  text: Зачем ты, нечестивец, сидишь в благочестивом совете, когда сердце твоё далеко отступило от Господа, вызывая гнев Бога Израиля притчами?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насмешками», «пословицами» или «загадочными речами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βέβηλε
  choice: нечестивец
  rationale: Обращение обозначает человека, чуждого святыне и непочтительного к Богу; «нечестивец» естественно звучит по-русски и сохраняет резкий контраст с советом благочестивых.
- source_word: συνεδρίῳ ὁσίῳ
  choice: в совете благочестивых
  rationale: συνέδριον — совещательное собрание или совет; ὅσιος здесь может характеризовать его принадлежностью к благочестивым. Такой перевод сохраняет отличие ὅσιος от ἅγιος и естественнее сочетания «благочестивый совет».
- source_word: ἡ καρδία σου μακρὰν ἀφέστηκεν
  choice: сердце твоё далеко отступило
  rationale: Перфект ἀφέστηκεν передаёт совершившееся удаление и продолжающееся отчуждение; «далеко отступило» сохраняет образ и результирующее состояние.
- source_word: τοῦ κυρίου
  choice: от Господа
  rationale: В контексте κύριος относится к Богу; традиционное и ясное русское соответствие — «Господь».
- source_word: ἐν παροιμίαις
  choice: притчами своими
  rationale: παροιμία буквально означает притчу, пословицу или иносказательное изречение. Творительный падеж естественно передаёт инструментальное ἐν; местоимение «своими» эксплицирует подразумеваемую связь с адресатом.
- source_word: παροργίζων
  choice: вызываешь гнев
  rationale: Причастие означает «побуждая к гневу, раздражая»; развёрнутая формулировка ясно выражает причинение гнева без неестественного русского «провоцируя Бога».
theological_decisions:
- issue: Значение ὅσιος в выражении συνεδρίῳ ὁσίῳ
  choice: совет благочестивых
  alternative: святой совет
  rationale: ὅσιος может значить «благочестивый, верный Богу, священный». Контекст противопоставляет βέβηλος богобоязненному сообществу; перевод не отождествляет слово автоматически с ἅγιος и не вводит название определённой религиозной партии.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. Инверсия «сердце твоё» поддерживает достоинство стиля, оставаясь понятной. Союз «и» перед последней частью делает связь греческого причастия с подлежащим явной.
