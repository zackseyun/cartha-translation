    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτῶν ἐπʼ οἶκον ἀνδρός
  choice: они не сводят глаз с дома человека
  rationale: Идиоматическое русское выражение сохраняет образ пристального, недоброго наблюдения. «Дом» оставляет открытым как буквальный, так и более широкий социальный смысл.
- source_word: ἐν εὐσταθείᾳ
  choice: живущего в благополучии
  rationale: εὐστάθεια буквально указывает на устойчивость, прочность или устроенность; в контексте человека и его дома естественный русский эквивалент — «благополучие», без сведения смысла только к богатству.
- source_word: ὡς ὄφις
  choice: словно змей
  rationale: Сравнение сохранено прямо; «змей» соответствует возвышенному библейскому регистру и передаёт образ скрытной угрозы.
- source_word: διαλῦσαι
  choice: разрушить
  rationale: Инфинитив цели передан конструкцией «чтобы». Глагол может означать разложить, расстроить или уничтожить; «разрушить» естественно сочетается с абстрактным дополнением «мудрость».
- source_word: σοφίαν ἀλλήλων
  choice: мудрость друг друга
  rationale: Сохранены и ключевое понятие σοφία, и взаимное местоимение ἀλλήλων, хотя сочетание намеренно остаётся смыслово напряжённым.
- source_word: ἐν λόγοις παρανόμων
  choice: словами беззаконников
  rationale: παρανόμων — родительный падеж множественного числа, поэтому это не согласованное определение «беззаконными» при λόγοις, а указание на слова, принадлежащие беззаконникам.
theological_decisions:
- issue: К кому относится сравнение ὡς ὄφις
  choice: 'к действующим лицам: «словно змей, они…»'
  alternative: 'к их глазам или взгляду: «глаза их… словно у змея»'
  rationale: Греческая конструкция допускает образную связь сравнения со всем действием. Русская формулировка избегает неестественного сравнения дома или благополучия со змеем, не добавляя специального богословского толкования.
- issue: Необычное выражение σοφίαν ἀλλήλων
  choice: «мудрость друг друга»
  alternative: «мудрость других» или «взаимное благоразумие»
  rationale: Буквальное взаимное значение ἀλλήλων сохранено, поскольку его возможная смысловая трудность присутствует уже в источнике и не должна устраняться догадкой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Змей» выбран вместо разговорно-зоологического «змея»; синтаксис сделан естественным для русского языка, при этом необычное взаимное выражение источника сохранено.
