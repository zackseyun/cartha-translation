lexical_decisions:
- source_word: γένοιτο
  choice: да будет
  rationale: Оптатив передаёт молитвенное пожелание; «да будет» сохраняет его просительный и одновременно импрекаторный характер.
- source_word: μερὶς
  choice: участь
  rationale: Слово обозначает долю или удел, выпавший человеку; «участь» естественно передаёт здесь смысл назначенной судьбы в контексте суда.
- source_word: ἀτιμίᾳ
  choice: бесчестие
  rationale: Абстрактное существительное сохраняет нравственно-судебный оттенок греческого слова и не сводит его лишь к субъективному чувству стыда.
- source_word: ἔξοδος
  choice: выход
  rationale: Буквальное соответствие сохраняет намеренную пару с εἴσοδος и узнаваемый библейский оборот.
- source_word: στεναγμοῖς
  choice: стенания
  rationale: Множественное число передаёт повторяющиеся проявления скорби и соответствует форме источника.
- source_word: εἴσοδος
  choice: вход
  rationale: Сохраняет прямую антитезу «выход — вход».
- source_word: ἀρᾷ
  choice: под проклятием
  rationale: Это естественное русское обозначение состояния человека, на котором лежит проклятие; буквальная конструкция отмечена в сноске.
- source_word: Κύριε
  choice: Господи
  rationale: Нормальная русская форма прямого обращения к Богу, соответствующая звательному Κύριε.
theological_decisions:
- issue: Импрекаторная форма пожелания
  choice: Передать стих как обращённую к Господу молитву-пожелание суда над нечестивым.
  alternative: Передать его как нейтральное предсказание будущего суда.
  rationale: Оптатив γένοιτο вместе с обращением Κύριε указывает на молитвенное пожелание, а не на простое сообщение; напряжённость импрекаторного текста не смягчается.
- issue: Значение пары «выход — вход»
  choice: Сохранить буквальную парную формулу, не ограничивая её толкование одним событием.
  alternative: Истолковать её непосредственно как рождение и смерть либо как весь жизненный путь.
  rationale: Греческий текст допускает широкий меризм, охватывающий передвижения или течение жизни, но не уточняет его однозначно.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным строем. Форма «Господи» и оборот «да будет» уместны для прямого обращения, но остальная лексика остаётся ясной современному читателю. Параллелизм трёх частей подчёркнут тире во второй и третьей частях.
