review_pass:
  verdict: revise
  source_fidelity: «Да обнажит Бог» верно передаёт желательное значение инфинитива ἀνακαλύψαι в контексте проклятия. «Человекоугодник» удачно сохраняет традиционную нравственную категорию, а повтор «дела» соответствует повтору τὰ ἔργα / τὰ ἔργα αὐτοῦ. Однако сочетание «его дела, с осмеянием и поруганием» синтаксически не завершено и не позволяет ясно связать осмеяние с публичным посрамлением этих дел.
  naturalness: «Обнажит» возможно, но в современном литературном русском применительно к делам менее естественно, чем «раскроет». Конструкция с тире и инструментальным оборотом звучит как неотредактированный фрагмент. «Выставив ... на посмешище и поругание» ясно и литературно передаёт смысл публичного позора, не меняя молитвенно-поэтического регистра.
  terminology: '«Человекоугодник» — точный и уместный термин. «Посмешище и поругание» различает καταγέλως и μυκτηρισμός и естественно сочетается с глаголом публичного разоблачения. Сноска об иной трактовке должна сохранять обозначение синтаксической трудности, но не представлять вариант «дела, угодные людям» как столь же прямое грамматическое соответствие: ἀρεσκόν в данной форме естественнее относится к лицу.'
