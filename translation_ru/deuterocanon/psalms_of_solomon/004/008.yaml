lexical_decisions:
- source_word: ἀνακαλύψαι ὁ θεὸς
  choice: Да обнажит Бог
  rationale: Формально ἀνακαλύψαι — инфинитив, однако в контексте молитвенного проклятия он выражает пожелание. Конструкция «да обнажит» передаёт и побудительно-желательное значение, и образ раскрытия скрытых дел.
- source_word: τὰ ἔργα
  choice: дела
  rationale: «Дела» естественно обозначает нравственно оцениваемые поступки и сохраняет повтор греческого существительного.
- source_word: ἀνθρώπων ἀρεσκόν
  choice: человекоугодника
  rationale: Передаёт устойчивую нравственную характеристику человека, стремящегося угождать людям. Синтаксис греческой фразы труден, поэтому возможное иное понимание отмечено в сноске.
- source_word: ἐν καταγέλωτι
  choice: с осмеянием
  rationale: Передаёт публичное выставление на смех и сохраняет обстоятельственный оттенок предлога ἐν.
- source_word: μυκτηρισμῷ
  choice: поруганием
  rationale: Слово обозначает презрительную насмешку; «поругание» сохраняет торжественный поэтический регистр и не сливается по значению полностью с «осмеянием».
