  yaml_path: translation/deuterocanon/psalms_of_solomon/004/026.yaml
  text: Blessed are those who fear the Lord in their innocence[a][b].
translation:
  language: ru
  text: Блаженны боящиеся Господа в своей незлобивости[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своей невинности»; возможно также: «в своей бесхитростности».'
    reason: lexical_alternative
  - marker: b
    text: «Бояться» здесь означает испытывать перед Господом благоговейный страх, а не просто ужас.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Традиционная и естественная для библейского изречения формула, сохраняющая смысл благословенного состояния, а не только эмоционального счастья.
- source_word: φοβούμενοι
  choice: боящиеся
  rationale: Буквально передаёт греческий глагол и сохраняет библейское смысловое напряжение; в данном контексте речь идёт о благоговейном страхе перед Господом.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычная русская передача κύριος как божественного титула; прописная буква соответствует религиозному контексту.
- source_word: ἐν ἀκακίᾳ αὐτῶν
  choice: в своей незлобивости
  rationale: ἀκακία обозначает отсутствие зла, злобы или коварства. «Незлобивость» точнее сохраняет моральное содержание слова, чем широкая «невинность», и естественно сочетается с предложной конструкцией ἐν.
theological_decisions:
- issue: Характер страха перед Господом
  choice: Сохранено прямое «боящиеся», с пояснением благоговейного смысла в сноске.
  alternative: «Почитающие Господа» или «благоговеющие перед Господом»
  rationale: Парафраза сделала бы смысл однозначнее, чем греческое φοβούμενοι, и устранила бы присущее библейскому языку напряжение между страхом и почтением.
translation_notes:
  register: Современный литературный русский с достоинством библейского изречения. «Блаженны» и «Господь» сохраняют узнаваемый сакральный регистр; «незлобивость» несколько возвышенно, но понятно и лексически близко к греческому.
