  text: ἐν ὀδύναις καὶ πενίᾳ καὶ ἀπορίᾳ ἡ ζωὴ αὐτοῦ, Κύριε, ὁ ὕπνος αὐτοῦ ἐν λύπαις καὶ ἡ ἐξέγερσις αὐτοῦ ἐν ἀπορίαις.
