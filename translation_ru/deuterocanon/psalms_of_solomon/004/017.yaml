base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/017.yaml
  text: May his life be in pains and poverty and want[a], O Lord; his sleep in griefs[b], and his waking in distresses.
translation:
  language: ru
  text: Да будет его жизнь в страданиях, бедности и нужде[a], Господи; его сон — в скорбях, а пробуждение — в лишениях[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в бедственном положении» или «в безысходности». Греческое слово может обозначать крайнюю нужду, беспомощность или бедствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально здесь употреблено множественное число того же греческого слова, которое выше переведено как «нужда». Все три части стиха в греческом тексте не имеют выраженного глагола; перевод «да будет» следует контексту продолжающегося молитвенного пожелания. Возможен также перевод: «Его жизнь — в страданиях, бедности и нужде, Господи; его сон — в скорбях, а пробуждение — в лишениях».'
    reason: source_ambiguity
lexical_decisions:
- source_word: ὀδύναις
  choice: в страданиях
  rationale: Слово охватывает как физическую боль, так и душевные муки; «страдания» естественно передаёт эту широту, не усиливая значение до «истязаний».
- source_word: πενίᾳ
  choice: в бедности
  rationale: Существительное обозначает материальную бедность или нужду; «бедность» ясно и точно передаёт основное значение.
- source_word: ἀπορίᾳ
  choice: в нужде
  rationale: В сочетании с бедностью слово указывает скорее на тяжёлую нехватку и беспомощное положение, чем на интеллектуальное недоумение.
- source_word: ζωὴ
  choice: жизнь
  rationale: Обычное и точное соответствие; здесь речь идёт обо всём жизненном состоянии человека.
- source_word: λύπαις
  choice: в скорбях
  rationale: Множественное число передаёт повторяющиеся или окружающие человека горести; «скорби» сохраняет эмоциональную тяжесть выражения.
- source_word: ἐξέγερσις
  choice: пробуждение
  rationale: Слово обозначает пробуждение или вставание после сна; «пробуждение» естественно противопоставлено сну.
- source_word: ἀπορίαις
  choice: в лишениях
  rationale: Это множественное число того же слова, ранее переведённого как «нужда». Здесь «лишения» естественно отражает множественность и сохраняет смысл тяжёлой нехватки и бедственного положения.
- source_word: Κύριε
  choice: Господи
  rationale: Форма звательного обращения прямо обозначает молитвенное обращение к Господу.
