lexical_decisions:
- source_word: λόγοι
  choice: слова
  rationale: Прямой и естественный перевод, сохраняющий внимание к тому, что этот человек говорит, без сужения значения до речей или изречений.
- source_word: παραλογισμοί
  choice: ложные рассуждения
  rationale: Слово обозначает ошибочные или намеренно вводящие в заблуждение доводы. Такой перевод передаёт одновременно интеллектуальную и нравственную сторону понятия, не прибегая к излишне специальному термину.
- source_word: εἰς πρᾶξιν
  choice: направленные на осуществление
  rationale: 'Оборот выражает цель или направленность: слова служат не одной лишь мысли, а претворению желания в действие.'
- source_word: ἐπιθυμίας
  choice: желания
  rationale: Нейтрально широкое «желание» не сужает смысл до сексуальной страсти и сохраняет единственное число греческого слова.
- source_word: ἀδίκων
  choice: неправедных
  rationale: Форма допускает понимание как родительного множественного числа мужского рода — «неправедных людей». Субстантивированное русское прилагательное кратко и естественно сохраняет этот смысл; грамматически возможное понимание среднего рода вынесено в примечание.
theological_decisions:
- issue: Референт формы ἀδίκων
  choice: желание неправедных людей
  alternative: желание неправедных дел / несправедливого
  rationale: Греческая форма родительного падежа множественного числа одинакова для мужского и среднего рода, поэтому может обозначать либо людей, которым принадлежит желание, либо неправедные вещи как предмет желания. Основной текст следует традиционно засвидетельствованному личному прочтению, а подлинная грамматическая неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической обличительной речи. Конструкция с тире перед именной частью сказуемого естественна; причастный оборот ясно передаёт целевое εἰς πρᾶξιν. Формулировка избегает конфессионально окрашенной терминологии.
