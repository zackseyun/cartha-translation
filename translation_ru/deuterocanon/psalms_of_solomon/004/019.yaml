  text: And may his house lack everything that would fill his soul.
translation:
  language: ru
  text: И пусть дом его будет лишён всего, чем он мог бы насытить свою душу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самого себя»; здесь слово «душа» может также подразумевать желания или аппетит человека.'
    reason: Греческое ψυχή допускает значения «душа», «сам человек» и, по контексту насыщения, «желание, аппетит».
lexical_decisions:
- source_word: ἐλλιπὴς
  choice: будет лишён
  rationale: Прилагательное обозначает недостаток или отсутствие. В бессвязочной фразе, продолжающей ряд проклятий, конструкция «пусть… будет лишён» естественно передаёт пожелательный смысл.
- source_word: ὁ οἶκος αὐτοῦ
  choice: дом его
  rationale: «Дом» сохраняет конкретный образ οἶκος и одновременно может обозначать домочадцев и хозяйство.
- source_word: ἀπὸ παντὸς
  choice: всего
  rationale: При выражении лишения русский родительный падеж естественно передаёт греческую конструкцию с ἀπό.
- source_word: οὗ ἐμπλήσει
  choice: чем он мог бы насытить
  rationale: Оборот сохраняет образ наполнения, передавая его естественным русским глаголом «насытить»; условная форма уместно выражает то, что могло бы послужить удовлетворению, но будет отнято.
- source_word: ψυχὴν αὐτοῦ
  choice: свою душу
  rationale: «Душу» сохраняет широкий и образный смысл ψυχή, не сводя его только к телесному аппетиту; возвратное «свою» естественно по-русски указывает на подлежащее придаточной части.
