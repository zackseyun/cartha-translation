  text: And the Lord will rescue them from deceitful and sinful people[b][a], and he will rescue us from every lawless snare.
translation:
  language: ru
  text: И Господь избавит их от лживых людей и грешников и избавит нас от всякого беззаконного соблазна[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от всякой беззаконной ловушки»; возможно также: «от всякого соблазна от беззаконника (или беззаконников)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Передаёт обычный божественный титул в торжественном, но понятном современном русском языке.
- source_word: ῥύσεται
  choice: избавит
  rationale: Естественно выражает спасение от опасности или пагубного воздействия и одинаково подходит к обеим частям стиха.
- source_word: ἀνθρώπων
  choice: людей
  rationale: Греческое слово употреблено родово и не указывает исключительно на мужчин.
- source_word: δολίων
  choice: лживых
  rationale: Кратко и естественно передаёт идею обмана и коварства; определение согласовано с «людей».
- source_word: ἁμαρτωλῶν
  choice: грешных
  rationale: Согласование с ἀνθρώπων наиболее непосредственно отражает синтаксис фразы, при этом примечание сохраняет возможное субстантивированное понимание «грешников».
- source_word: σκανδάλου
  choice: соблазна
  rationale: Сохраняет образ причины нравственного падения и не сужает значение исключительно до физической ловушки.
- source_word: παρανόμου
  choice: беззаконного
  rationale: В основном тексте понято как определение к σκανδάλου; альтернативная возможность — родительный принадлежности, относящий к беззаконнику или беззаконникам, — отмечена в сноске.
theological_decisions:
- issue: Относится ли ἁμαρτωλῶν к ἀνθρώπων или обозначает отдельную группу «грешников»?
  choice: «людей лживых и грешных»
  alternative: «лживых людей и грешников»
  rationale: Оба определения могут грамматически относиться к ἀνθρώπων, что даёт плавное чтение; однако возможность отдельного группового обозначения «грешники» сохранена в примечании.
- issue: Какова синтаксическая связь παρανόμου со σκανδάλου?
  choice: «беззаконного соблазна»
  alternative: «соблазна от беззаконника / беззаконников»
  rationale: Совпадение форм родительного падежа допускает как согласованное определение, так и субстантивированное понимание. Основной текст выбирает наиболее прямое согласование, не устраняя альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «избавит» сохранён вслед за греческим текстом; инверсия и архаизмы не используются.
