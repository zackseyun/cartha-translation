  yaml_path: translation/deuterocanon/psalms_of_solomon/004/018.yaml
  text: May sleep be taken from his temples in the night; may they fall away from every work of his hands.
translation:
  language: ru
  text: Да будет отнят сон от его висков ночью; да отпадут они[a] от всякого дела его рук.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте субъект множественного числа здесь прямо не назван; возможно, подразумеваются его руки.
    reason: Сохраняет синтаксическую неоднозначность источника и предупреждает, что «они» не имеет однозначно выраженного антецедента.
lexical_decisions:
- source_word: κροτάφων
  choice: висков
  rationale: Прямое соответствие греческому «виски»; не заменено словом «глаза», которого в источнике нет.
- source_word: ἀφαιρεθείη
  choice: да будет отнят
  rationale: Сохраняет страдательное значение аориста оптатива и характер пожелания-проклятия.
- source_word: ἀποπέσοιεν
  choice: да отпадут они
  rationale: Передаёт множественное число и оптатив, не добавляя явно названного субъекта, отсутствующего в греческом тексте.
- source_word: παντὸς ἔργου χειρῶν αὐτοῦ
  choice: всякого дела его рук
  rationale: Близко передаёт конструкцию «всякого дела рук его» и сохраняет широкое значение ἔργον.
theological_decisions:
- issue: Неуказанный субъект формы ἀποπέσοιεν
  choice: Сохранить местоименное «они» и пояснить неопределённость в сноске
  alternative: Уточнить субъект как «руки его» либо иной подразумеваемый референт
  rationale: Греческая форма имеет множественное число, но в данном стихе не называет субъект прямо; его конкретизация устранила бы реальную текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественной формой пожелания «да будет… да отпадут», уместной для поэтического проклятия. Порядок слов сделан понятным, при этом образ «сон от висков» и неоднозначность второго полустишия сохранены.
