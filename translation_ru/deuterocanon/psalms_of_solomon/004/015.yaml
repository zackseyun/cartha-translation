base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/015.yaml
  text: He was filled with this lawlessness[a], and his eyes were set on another household to destroy it with relentless words; his soul is not satisfied, like Hades[c][b], with all these things.
translation:
  language: ru
  text: Он был полон этого беззакония, и взор его был обращён на другой дом[a], чтобы погубить его словами без промедления[b]; душа его, как Аид[c], не насыщается всем этим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на другую семью». Греческое οἶκος может означать как дом-жилище, так и семью или домочадцев.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение необычно и не вполне ясно; буквально: «словами без отсрочки (промедления)». Возможны также передачи: «без колебаний сказанными словами» или «неотступными речами».'
    reason: alternative_reading
  - marker: c
    text: '«Аид» — мир мёртвых, представленный здесь как ненасытный. Возможные передачи: «преисподняя», «могила» или «шеол».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη
  choice: был исполнен
  rationale: Передаёт пассивную форму и образ человека, целиком охваченного названным беззаконием, сохраняя при этом достойный литературный регистр.
- source_word: παρανομίᾳ ἐν ταύτῃ
  choice: этого беззакония
  rationale: «Беззаконие» сохраняет связь с нарушением закона и установленного порядка; указательное местоимение относится к этому конкретному беззаконию.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπʼ
  choice: взор его был устремлён на
  rationale: Естественная русская передача направленного взгляда, который в данном контексте связан с враждебным намерением.
- source_word: οἶκον ἕτερον
  choice: другой дом
  rationale: «Дом» близко соответствует οἶκος и по-русски может обозначать как жилище, так и семью или домочадцев; двусмысленность отмечена в сноске.
- source_word: ὀλοθρεύσαι
  choice: чтобы погубить его
  rationale: Инфинитив выражает цель, а «погубить» передаёт сильное разрушительное значение глагола.
- source_word: ἐν λόγοις ἀνυπερθέσεως
  choice: неотступными речами
  rationale: Передаёт напор слов, которые не откладываются и не прекращаются, не устраняя трудность необычного греческого выражения; альтернативы даны в сноске.
- source_word: οὐκ ἐμπίπλαται ἡ ψυχὴ αὐτοῦ
  choice: душа его не насыщается
  rationale: Сохраняет образ ненасытимости, особенно важный в последующем сравнении с преисподней.
- source_word: ὡς ᾅδης
  choice: словно преисподняя
  rationale: «Преисподняя» естественно обозначает по-русски мир мёртвых и сохраняет образ его ненасытимости; буквенное соответствие «Аид» указано в сноске.
theological_decisions:
- issue: Значение ᾅδης в сравнении
  choice: преисподняя
  alternative: Аид; могила; шеол
  rationale: Контекст говорит о ненасытимом мире мёртвых, а не требует уточнения учения о посмертном воздаянии; поэтому нейтральное «преисподняя» сохраняет образ и не вносит конфессиональной конкретизации.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Инверсия «взор его», «душа его» сохраняет поэтическое достоинство, не делая текст архаичным; трудные и многозначные места не сглажены, а отмечены сносками.
