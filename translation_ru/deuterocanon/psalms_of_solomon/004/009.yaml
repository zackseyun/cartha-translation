  yaml_path: translation/deuterocanon/psalms_of_solomon/004/009.yaml
  text: And may the devout vindicate the judgment of their God when sinners are removed from before the righteous man—even the one speaking what pleases a man, only with deceit.
translation:
  language: ru
  text: И пусть благочестивые признают справедливым суд своего Бога, когда грешников удалят от лица праведника[b] — говорящего то, что угодно человеку, лишь с коварством.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте после множественного «грешников» следует причастное описание в единственном числе — буквально: «говорящего…». Вероятно, так обобщённо характеризуется грешник; синтаксис дошедшего до нас текста необычен.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «из присутствия праведного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσιοι
  choice: благочестивые
  rationale: В данном нравственно-религиозном контексте слово обозначает преданных Богу, благочестивых людей, а не священные предметы или ангельских существ.
- source_word: δικαιώσαισαν
  choice: пусть … признают справедливым
  rationale: Аорист оптатива выражает пожелание. При прямом дополнении κρίμα глагол означает признать или подтвердить справедливость суда, а не «сделать праведным».
- source_word: κρίμα
  choice: суд
  rationale: 'Слово сохраняет широкий судебный смысл: Божье решение или приговор. «Суд» естественно сочетается с формулой «признать справедливым» и не сужает значение без необходимости.'
- source_word: ἐν τῷ ἐξαίρεσθαι
  choice: когда … удалят
  rationale: Конструкция ἐν τῷ с инфинитивом здесь передаёт обстоятельство времени. Русская неопределённо-личная форма позволяет сохранить грешников как объект удаления и яснее присоединить последующее определение в единственном числе.
- source_word: ἀπὸ προσώπου δικαίου
  choice: от лица праведника
  rationale: Сохранена образная семитизированная формула «от лица», означающая удаление из присутствия праведного человека; единственное число передано буквально.
- source_word: ἀνθρώπῳ ἀρέσκον
  choice: угодное человеку
  rationale: 'Средний род причастия ἀρέσκον лучше понимать субстантивированно как предмет речи: «то, что угодно человеку», а не как цель «чтобы угодить».'
- source_word: λαλοῦντα μόνον μετὰ δόλου
  choice: того, кто говорит … и только с коварством
  rationale: Причастие единственного числа передано как обобщённая характеристика грешника. Место μόνον перед μετὰ δόλου отражено сочетанием «и только с коварством».
theological_decisions:
- issue: Кто назван «праведником» в выражении ἀπὸ προσώπου δικαίου
  choice: праведный человек в обобщённом единственном числе
  alternative: «Праведник» как особая мессианская или иная конкретная фигура
  rationale: В самом стихе нет достаточных грамматических или контекстуальных оснований отождествлять δικαίου с определённой богословской фигурой; перевод сохраняет обобщённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, псалмическим звучанием. Частица «пусть» передаёт пожелание оптатива без излишней архаизации; формула «от лица праведника» сохранена ради образности оригинала. Необычный переход от множественного числа к единственному не сглажен молча и пояснён в сноске.
