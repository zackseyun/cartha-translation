revisions:
- from: И пусть благочестивые признают справедливым суд своего Бога, когда грешников удалят от лица праведника[b] — того, кто говорит угодное человеку, и только с коварством.[a]
  to: И пусть благочестивые признают справедливым суд своего Бога, когда грешников удалят от лица праведника[b] — говорящего то, что угодно человеку, лишь с коварством.[a]
  rationale: 'Исправлена только синтаксическая привязка одиночного причастного оборота: он более не может быть ошибочно прочитан как характеристика праведника, а остаётся намеренно неровным, как в греческом тексте, и объясняется сноской. Также устранён не имеющий соответствия в оригинале союз «и» перед «лишь с коварством».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:20:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основная передача верна: δικαιώσαισαν передано пожелательным «пусть … признают справедливым», ἀπὸ προσώπου δικαίου — как удаление от праведника, а ἀρέσκον правильно понято как субстантивированное среднеродное причастие: «то, что угодно человеку». Однако «и только с коварством» неточно и неестественно передаёт μόνον μετὰ δόλου: μόνον относится к способу речи в сочетании с «с коварством», без добавочного соединительного «и».'
  naturalness: Фраза «того, кто говорит угодное человеку, и только с коварством» синтаксически допускает, будто «того» поясняет праведника, хотя по греческому это одиночная характеристика среди «грешников» при намеренно сохранённом переходе к единственному числу. Тире с «а именно» или «— говорящего…» яснее связывает оборот с грешниками. «Говорит то, что угодно человеку» естественнее, чем субстантивированное «говорит угодное человеку».
  terminology: «Благочестивые», «суд своего Бога», «праведник» и «коварство» уместны в современном литературном, умеренно возвышенном регистре. «От лица праведника» хорошо сохраняет образ оригинала; сноска с вариантом «из присутствия праведного» полезна.
  issues:
  - severity: medium
    issue: Неясная синтаксическая привязка единственного причастного оборота
    rationale: Вариант «от лица праведника — того, кто говорит…» формально делает «того» приложением к «праведника». Но λαλοῦντα (винительный ед. ч.) в переданном греческом тексте характеризует одного грешника при предшествующем ἁμαρτωλούς (винительный мн. ч.); этот неровный переход следует сохранить, но не создавать противоположную связь с праведником.
  - severity: low
    issue: «И только с коварством»
    rationale: Союз «и» отсутствует в оригинале и делает фразу стилистически шероховатой. «Говорящего то, что угодно человеку, лишь с коварством» точнее передаёт λαλοῦντα ἀνθρώπῳ ἀρέσκον μόνον μετὰ δόλου, не решая спорную синтаксическую неровность сверх необходимого.
