  yaml_path: translation/deuterocanon/psalms_of_solomon/004/025.yaml
  text: And they provoked God[a], and stirred him up to remove them from the land[c][b], because by deceit they pretended to be innocent people.
translation:
  language: ru
  text: И они прогневали Бога и побудили Его удалить их из страны[a], потому что обманом выдавали себя за невинных людей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с земли». Греческое слово может обозначать страну, землю или весь земной мир.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «души невинных»; возможно также: «невинные жизни» или «невинные люди».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρώργυσαν
  choice: прогневали
  rationale: Глагол означает, что своими поступками они вызвали Божий гнев; «прогневали» кратко и естественно передаёт эту нравственную силу.
- source_word: παρώξυναν
  choice: побудили Его
  rationale: Глагол усиливает предыдущее обвинение и управляет инфинитивом ἐξᾶραι. Такой перевод ясно передаёт вызванное ими движение к суду, не добавляя отдельного глагола наказания.
- source_word: ἐξᾶραι αὐτοὺς ἀπὸ τῆς γῆς
  choice: удалить их из страны
  rationale: ἐξαίρω здесь означает удалить или убрать, возможно с суровым судебным оттенком. «Удалить» не усиливает значение до несомненного уничтожения, а «страна» естественно передаёт γῆ в контексте изгнания, при сохранении альтернативы в сноске.
- source_word: ψυχὰς ἀκάκων
  choice: невинных
  rationale: Буквально сочетание говорит о «душах невинных», но ψυχή может обозначать человека или жизнь. В русском «выдавали себя за невинных» естественно передаёт смысл, а буквальная образность и возможные оттенки сохранены в сноске.
- source_word: παραλογισμῷ
  choice: обманом
  rationale: В данном контексте существительное обозначает обманную уловку, а не нейтральное рассуждение.
- source_word: ὑπεκρίνοντο
  choice: выдавали себя за
  rationale: Глагол означает разыгрывать роль, притворяться или ложно представлять себя кем-либо; выбранное выражение современно, ясно и сохраняет оттенок лицемерного притворства.
theological_decisions:
- issue: Степень принуждения Бога в выражении παρώξυναν ἐξᾶραι
  choice: побудили Его удалить
  alternative: вынудили Его удалить; раздражили Его до того, что Он удалил
  rationale: «Побудили» сохраняет причинную связь между их поступками и Божьим судебным действием, но не создаёт более сильного богословского утверждения, будто Бога можно было принудить против Его воли; конструкция также не представляет удаление как уже непременно совершившийся факт.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического обвинения. Повтор двух близких глаголов передан без тяжеловесной тавтологии. Местоимение «Его» добавлено как подразумеваемое дополнение греческого παρώξυναν и делает русскую конструкцию ясной.
