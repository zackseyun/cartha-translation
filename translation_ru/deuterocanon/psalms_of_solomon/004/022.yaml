lexical_decisions:
- source_word: ὀφθαλμοὺς
  choice: глаза
  rationale: Обычное и точное соответствие; более физиологически подробное слово было бы избыточным усилением.
- source_word: ἐκκόψαισαν
  choice: пусть ... выклюют
  rationale: Аорист оптатива выражает пожелание или проклятие. В сочетании с воронами «выклюют» естественно передаёт насильственный образ и действие клювом.
- source_word: κόρακες
  choice: вороны
  rationale: κόραξ обозначает ворона; русское «вороны» сохраняет образ крупных птиц-падальщиков.
- source_word: ὑποκρινομένων
  choice: лицемерам
  rationale: Субстантивированное причастие обозначает тех, кто притворяется или скрывает истинные намерения. «Лицемеры» — краткое и естественное соответствие, при сохранении альтернативы в сноске.
