    text: 'Или: «сначала поднимает на него руку»; выражение ἐν πρώτοις можно понимать не как первенство среди обвинителей, а во временном смысле.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «как в рвении»; речь может идти о кажущемся рвении или о позе ревнителя.'
    reason: lexical_alternative
  - marker: c
    text: 'Форму ἁμαρτωλῶν здесь можно понимать как «греховных вещей (дел)». Возможно и иное понимание: «во множестве путей грешников».'
    reason: grammatical_ambiguity
  - marker: d
    text: 'Или: «в необузданных излишествах»; греческое слово означает отсутствие самообладания, невоздержанность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χείρ
  choice: рука
  rationale: Сохранён буквальный и выразительный телесный образ; в сочетании с направленностью «против него» рука обозначает враждебное действие.
- source_word: ἐν πρώτοις
  choice: одной из первых
  rationale: Передаёт наиболее вероятное значение первенства или поспешности среди обвинителей; временное понимание отмечено в сноске.
- source_word: ἐπʼ αὐτόν
  choice: против него
  rationale: При слове «рука» предлог естественно выражает направленное против другого человека действие.
- source_word: ὡς ἐν ζήλει
  choice: будто из рвения
  rationale: «Будто» сохраняет оттенок кажущегося или заявляемого рвения, уместный в обличении лицемерия, но не превращает притворство в прямо высказанный факт.
- source_word: ἔνοχος
  choice: виновен
  rationale: Естественный русский эквивалент с судебно-нравственным оттенком.
- source_word: ποικιλίᾳ ἁμαρτωλῶν
  choice: во всевозможных греховных делах
  rationale: ἁμαρτωλῶν истолковано как субстантивированная форма среднего рода множественного числа — «греховных вещей/дел»; «всевозможных» естественно передаёт ποικιλίᾳ.
- source_word: ἀκρασίαις
  choice: в проявлениях невоздержанности
  rationale: Передаёт отсутствие самообладания и потворство желаниям, сохраняя множественное число греческой формы через слово «проявления».
theological_decisions:
- issue: Характер рвения обвинителя
  choice: будто из рвения
  alternative: как в рвении
  rationale: Формула сохраняет возможную иронию и видимость благочестивого рвения, не утверждая однозначно ни искренность, ни сознательное притворство.
- issue: Грамматическое понимание ἁμαρτωλῶν
  choice: греховных делах
  alternative: путях грешников
  rationale: Форма допускает морфологическую неоднозначность, но средний род («греховные дела») лучше согласуется с личной виновностью обличаемого и с последующим перечислением проявлений невоздержанности; альтернативное понимание сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического обличения. Синтаксис слегка приподнят, но прозрачен; образ руки сохранён, а сжатые греческие обороты раскрыты лишь настолько, насколько требуется для естественного русского чтения.
