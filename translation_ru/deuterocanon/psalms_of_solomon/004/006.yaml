lexical_decisions:
- source_word: ταχὺς εἰσόδῳ
  choice: спешит войти
  rationale: Греческое выражение буквально описывает человека как «скорого на вхождение»; глагольная передача естественнее по-русски и сохраняет идею поспешности и готовности входить.
- source_word: εἰς πᾶσαν οἰκίαν
  choice: в каждый дом
  rationale: Прямая и естественная передача универсального πᾶσαν и οἰκίαν.
- source_word: ἱλαρότητι
  choice: с весёлым видом
  rationale: Существительное обозначает весёлость, приветливую бодрость; оборот «с весёлым видом» в контексте передаёт демонстрируемую манеру поведения, не утверждая искренности этого состояния.
- source_word: ὡς ἄκακος
  choice: словно невиновный
  rationale: ὡς сохраняет оттенок видимости или сравнения, а ἄκακος здесь характеризует человека как непричастного к злу или вине; «словно невиновный» естественно передаёт эту намеренную двусмысленность.
theological_decisions:
- issue: Является ли человек действительно невиновным или лишь производит такое впечатление
  choice: словно невиновный
  alternative: как невиновный
  rationale: Контекстуально греческое ὡς допускает сравнительно-притворный оттенок. «Словно» сохраняет дистанцию повествователя и не приписывает человеку подлинную невиновность.
translation_notes:
  register: Современный литературный русский язык; краткая, обличительная характеристика сохранена. Местоимение «он» добавлено ради естественного самостоятельного русского предложения и подразумевается формой греческого именного оборота.
