lexical_decisions:
- source_word: αἰνετὸς
  choice: достоин хвалы
  rationale: Греческое прилагательное означает «достойный хвалы, восхваляемый» и отличается от εὐλογητός («благословен»). Формулировка естественна для современного русского языка и сохраняет хвалебный характер изречения, не превращая прилагательное в прямое повеление.
- source_word: Κύριος
  choice: Господь
  rationale: Обычная и уместная передача κύριος как определённого титула Бога.
- source_word: ὁ κρίνων
  choice: судящий
  rationale: Причастие настоящего времени передаёт постоянное, характерное действие и естественно согласуется с существительным «Господь».
- source_word: πᾶσαν τὴν γῆν
  choice: всю землю
  rationale: В данном контексте γῆ имеет универсальный смысл — вся земля, а не отдельная страна; πᾶσαν передано словом «всю».
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: по Своей праведности
  rationale: Предлог ἐν здесь обозначает образ или норму суда. «По Своей праведности» звучит естественно по-русски и сохраняет более широкий нравственно-богословский смысл δικαιοσύνη; «по Своей справедливости» возможно как более узкая контекстуальная передача.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным славословным строем. Инверсия «Достоин хвалы Господь» сохраняет торжественное начало оригинала; местоимение «Своей» оформлено с традиционной прописной буквы при отнесении к Богу.
