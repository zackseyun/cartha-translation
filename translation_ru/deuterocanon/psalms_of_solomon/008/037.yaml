  text: And you are our God from the beginning, and on you is our hope, O Lord.
translation:
  language: ru
  text: И Ты — Бог наш от начала, и на Тебя — надежда наша, Господи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπʼ ἀρχῆς
  choice: от начала
  rationale: Буквально и естественно передаёт исходное выражение, не уточняя без основания, идёт ли речь о начале истории, существования народа или ином начале.
- source_word: ἐπὶ σὲ ἡ ἐλπὶς ἡμῶν
  choice: на Тебя — надежда наша
  rationale: Сохраняет образ надежды, направленной и опирающейся на Бога, а также именную конструкцию греческого текста; тире делает её понятной по-русски без добавления отсутствующего в оригинале глагола.
- source_word: Κύριε
  choice: Господи
  rationale: Стандартная русская звательная форма обращения, точно соответствующая греческому вокативу.
theological_decisions:
- issue: Смысл выражения «от начала»
  choice: Сохранить неопределённое «от начала»
  alternative: «изначально» или «с самого начала»
  rationale: Греческий текст не указывает, какое именно начало имеется в виду; перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. Инверсия «на Тебя — надежда наша» сохраняет поэтический параллелизм и акцент исходного текста; местоимения в обращении к Богу написаны с прописной буквы согласно принятой русской религиозной стилистике.
