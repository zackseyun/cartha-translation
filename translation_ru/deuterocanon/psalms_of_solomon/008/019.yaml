  yaml_path: translation/deuterocanon/psalms_of_solomon/008/019.yaml
  text: They made rough roads smooth before his entrance; they opened gates toward Jerusalem; they crowned her walls.
translation:
  language: ru
  text: Они выровняли неровные дороги перед его вступлением[a], открыли ворота, ведущие к Иерусалиму, и увенчали её стены[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от его вступления». Греческий оборот необычен; в основном тексте он понят как указание на приготовления перед его вступлением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «украсили её стены венками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡμάλισαν
  choice: выровняли
  rationale: Глагол обозначает выравнивание или разглаживание; «выровняли» естественно передаёт подготовку дороги.
- source_word: ὁδοὺς τραχείας
  choice: неровные дороги
  rationale: Сочетание сохраняет конкретный образ трудных, шероховатых дорог и хорошо сочетается с глаголом «выровняли».
- source_word: ἀπὸ εἰσόδου αὐτοῦ
  choice: перед его вступлением
  rationale: Буквальное «от его входа» по-русски неясно. «Перед» естественно передаёт вероятный пространственно-временной смысл семитизированного оборота, а «вступление» подходит к торжественному входу правителя или войска, не уточняя субъекта.
- source_word: ἤνοιξαν πύλας
  choice: открыли ворота
  rationale: Прямой и естественный перевод без добавления определённости, которой нет в греческом тексте.
- source_word: ἐπὶ Ἰερουσαλήμ
  choice: ведущие к Иерусалиму
  rationale: При воротах ἐπί естественно понимать как указание направления. Такая формулировка передаёт направленность и звучит по-русски яснее, чем буквальное «в сторону Иерусалима».
- source_word: ἐστεφάνωσαν
  choice: увенчали
  rationale: Сохраняется буквальный образ возложения венца и его торжественный оттенок; возможность значения «украсили венками» отмечена в сноске.
- source_word: τείχη αὐτῆς
  choice: её стены
  rationale: Местоимение женского рода относится к Иерусалиму; русский перевод сохраняет олицетворение города.
