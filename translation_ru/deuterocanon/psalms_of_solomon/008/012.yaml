lexical_decisions:
- source_word: τὰ ἅγια τοῦ θεοῦ
  choice: Божьи святыни
  rationale: Субстантивированное среднее множественное τὰ ἅγια естественнее всего обозначает принадлежащие Богу святые, священные предметы или ценности. «Святыни» сохраняет широту выражения и не сужает его до пространственного значения «святилище».
- source_word: διηρπάζοντο
  choice: расхищались
  rationale: Имперфект передаёт продолжавшееся или повторявшееся насильственное разграбление; «расхищались» естественно выражает и длительность, и святотатственное присвоение.
- source_word: ὡς μὴ ὄντος
  choice: словно не было
  rationale: Оборот вводит ирреальное сравнение и подчёркивает, что грабители действовали так, будто соответствующего наследника не существовало.
- source_word: κληρονόμου
  choice: наследника
  rationale: Сохранено обычное и прозрачное значение существительного без истолковывающего расширения до «защитника» или «избавителя».
- source_word: λυτρουμένου
  choice: который выкупил бы их
  rationale: Причастие среднего залога характеризует наследника как того, кто выкупает или возвращает святыни посредством избавления. Русское придаточное с условным оттенком естественно сочетается с «словно не было» и сохраняет смысл выкупа.
