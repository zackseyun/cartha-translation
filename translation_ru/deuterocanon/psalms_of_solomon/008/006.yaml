translation:
  language: ru
  text: Сердце моё устрашилось, кости мои задрожали, словно лён[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кости мои были потрясены, словно льняная ткань». Греческое слово может означать как лён, так и изготовленную из него ткань; само сравнение остаётся не вполне ясным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθη
  choice: устрашилось
  rationale: Аористная форма φοβέω выражает страх сердца. «Устрашилось» сохраняет образ и возвышенный, но понятный современному читателю тон.
- source_word: ἡ καρδία μου
  choice: сердце моё
  rationale: Буквальная и естественная передача, сохраняющая антропологический образ греческого текста.
- source_word: ἐταράχθη
  choice: задрожали
  rationale: Глагол обозначает потрясение, волнение или смятение; применительно к костям и в сочетании с физическим сравнением «задрожали» естественно передаёт телесное потрясение, не превращая образ в отвлечённое душевное состояние.
- source_word: τὰ ὀστᾶ μου
  choice: кости мои
  rationale: Сохраняется конкретный телесный образ оригинала без замены на более отвлечённые слова вроде «тело» или «всё существо».
- source_word: ὡς
  choice: словно
  rationale: Естественно вводит сравнение в современном литературном русском языке.
- source_word: λίνον
  choice: лён
  rationale: Основное предметное значение слова — лён; оно сохраняет трудный и не до конца прозрачный образ оригинала, тогда как «льняная ткань» уже уточняло бы стадию обработки материала.
