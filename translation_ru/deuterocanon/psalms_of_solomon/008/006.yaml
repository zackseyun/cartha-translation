  source_fidelity: «Сердце моё устрашилось» точно передаёт ἐφοβήθη ἡ καρδία μου, сохраняя образ сердца как носителя страха. «Кости мои задрожали» — естественная телесная передача ἐταράχθη τὰ ὀστᾶ μου; она хорошо соответствует принятому в английском аудите варианту «were shaken». Сравнение «словно лён» буквально сохраняет ὡς λίνον и не пытается искусственно объяснить трудный образ.
  naturalness: Текст звучит как современный литературный русский с уместной умеренно библейской окраской. Порядок слов и лексика естественны; «устрашилось» несколько возвышенно, но не архаично и соответствует регистру псалма.
