lexical_decisions:
- source_word: ὅσιοι
  choice: благочестивые
  rationale: Слово обозначает людей, отличающихся благочестием и преданностью Богу. «Благочестивые» точнее отличает ὅσιοι от ἅγιοι и не привносит позднейших значений слова «святые».
- source_word: ἀρνία
  choice: ягнята
  rationale: Греческое слово называет именно ягнят, а не овец вообще; образ передаёт беззащитность и невинность.
- source_word: ἐν ἀκακίᾳ
  choice: невинные
  rationale: Существительное ἀκακία выражает невинность, незлобие или отсутствие коварства. Прилагательное «невинные» естественно сочетается в русском языке с образом ягнят; более буквальная конструкция приведена в примечании.
- source_word: ἐν μέσῳ αὐτῶν
  choice: среди них
  rationale: Естественно передаёт пространственное значение оборота и сохраняет неопределённость того, к кому относится местоимение «них».
- source_word: καί
  choice: А
  rationale: В данном повествовательном контексте союз связывает стих с предшествующим текстом и одновременно оттеняет противопоставление; русское «А» передаёт эту связь естественнее буквального «И».
theological_decisions:
- issue: Передача οἱ ὅσιοι τοῦ θεοῦ
  choice: благочестивые Божьи
  alternative: верные Богу; святые Божьи
  rationale: «Благочестивые» сохраняет особое значение ὅσιοι — благочестие и преданность в отношениях с Богом — не смешивая его с обычным обозначением «святых» (ἅγιοι). Генитив τοῦ θεοῦ передан как принадлежность, без сведения смысла исключительно к верности.
