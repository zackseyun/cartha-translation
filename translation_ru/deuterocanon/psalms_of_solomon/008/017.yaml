lexical_decisions:
- source_word: ἔκρινεν
  choice: постановил
  rationale: Аорист κρίνω здесь обозначает властное решение или определение. «Постановил» сохраняет судебно-властный оттенок глагола, тогда как буквальное «судил войну» в современном русском звучит неясно и может быть понято как оценка войны.
- source_word: τὸν πόλεμον
  choice: вести войну
  rationale: πόλεμος означает войну, а не только отдельное сражение. Добавление инфинитива «вести» необходимо для естественного русского сочетания с глаголом «постановил» и не меняет характера действия.
- source_word: ἐπὶ
  choice: против
  rationale: В сочетании с войной и объектом нападения ἐπί указывает на враждебную направленность; естественный русский эквивалент — «против».
- source_word: Ἰερουσαλήμ
  choice: Иерусалима
  rationale: Устоявшаяся русская форма названия города; падеж определяется предлогом «против».
- source_word: γῆν
  choice: земли
  rationale: γῆ может обозначать землю, страну или территорию. «Земля» сохраняет широкое библейское значение и не навязывает узкого административного смысла.
- source_word: αὐτῆς
  choice: его
  rationale: В греческом местоимение женского рода согласуется с названием Иерусалима; в русском «Иерусалим» мужского рода, поэтому грамматически естественно «его». Отнесение местоимения к городу сохраняется.
theological_decisions:
- issue: Характер решения, выраженного κρίνω
  choice: передать как властное постановление о войне
  alternative: «судил войну» или «решил вопрос о войне»
  rationale: Контекст допускает судебный оттенок, но не требует понимать глагол как нравственную оценку войны. Перевод сохраняет образ авторитетного решения, не уточняя сверх текста, кто и каким образом должен осуществить войну.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формула «постановил вести войну» естественно передаёт властное решение; личное местоимение «его» согласовано с русским родом названия «Иерусалим».
