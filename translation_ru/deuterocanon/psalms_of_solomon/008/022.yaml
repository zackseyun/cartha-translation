lexical_decisions:
- source_word: ἤγαγεν
  choice: провёл
  rationale: Аорист ἄγω передаёт действие ведения или сопровождения; «провёл» естественно сочетается с указанием на безопасность и не уточняет сверх греческого, был ли он приведён к конкретной конечной точке.
- source_word: μετὰ ἀσφαλείας
  choice: безопасно
  rationale: Наречная передача сохраняет смысл «в безопасности, без опасности» и звучит естественно по-русски.
- source_word: ἐν τῇ πλανήσει αὐτῶν
  choice: благодаря их заблуждению
  rationale: В данном контексте πλάνησις вероятнее обозначает ошибку или заблуждение группы, а ἐν допускает обстоятельственно-инструментальный смысл. Такая формулировка ясна современному читателю; формально более буквальный и лексически альтернативные варианты сохранены в сносках.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение имеет мужской род и единственное число; «его» прямо сохраняет грамматическое указание исходного текста.
- source_word: αὐτῶν
  choice: их
  rationale: Родительный падеж множественного числа естественно передаётся русским притяжательным «их», сохраняя противопоставление одному человеку и группе.
theological_decisions:
- issue: Характер πλάνησις и роль человеческого заблуждения в Божьем действии
  choice: «благодаря их заблуждению» с вариантами в сносках
  alternative: «через их блуждание» или «в их заблуждении»
  rationale: Основной текст передаёт наиболее вероятный контекстуальный смысл, не называя Бога причиной заблуждения и не устраняя неоднозначность существительного и предлога, отмеченную в сносках.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Союз «ибо» сохраняет причинную связь стиха с контекстом; «провёл» и «безопасно» понятны широкому кругу читателей без архаизации.
