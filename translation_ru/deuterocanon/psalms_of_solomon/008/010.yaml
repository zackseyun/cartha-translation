lexical_decisions:
- source_word: υἱὸς
  choice: сын
  rationale: Существительное в единственном числе передано прямо; здесь оно имеет обобщённо-представительный характер, а не указывает на конкретное лицо.
- source_word: μετὰ
  choice: с
  rationale: μετά с родительным падежом обозначает совместность или связь; естественное русское соответствие — «с».
- source_word: μητρὸς
  choice: матерью
  rationale: Прямое обозначение родства, сохраняющее смысл описанного семейного нарушения.
- source_word: πατὴρ
  choice: отец
  rationale: Прямой перевод сохраняет параллелизм двух родственных сочетаний.
- source_word: θυγατρὸς
  choice: дочерью
  rationale: Прямое обозначение родства, симметричное слову «матерью».
- source_word: συνεφύροντο
  choice: вступали в смешение
  rationale: Форма передаёт продолжающееся или повторявшееся совместное смешение и в данном контексте служит эвфемизмом недозволенной половой связи. Выражение сохраняет образ греческого глагола, но по-русски не звучит как буквальное механическое перемешивание.
theological_decisions:
- issue: Следует ли прямо назвать кровосмесительную половую связь в основном тексте
  choice: 'Сохранить эвфемистический образ: «вступали в смешение».'
  alternative: «вступали в половую связь» / «сожительствовали»
  rationale: Родственные пары ясно указывают на кровосмешение, однако сам греческий глагол обозначает смешение и лишь контекстуально приобретает сексуальный смысл. Основной текст не должен делать формулировку более явной, чем источник.
translation_notes:
  register: Современный литературный русский язык с нарочито суровым, лаконичным строем перечня пороков. Неопределённый артикль греческому не свойствен; русские существительные оставлены без добавления «некий/один». Эвфемизм источника сохранён, а его подразумеваемый смысл пояснён в сноске.
