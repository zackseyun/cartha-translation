    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεξόμεθά
  choice: не отступим
  rationale: Будущая форма среднего залога от ἀπέχω/ἀφέχομαι с родительным личного местоимения означает держаться вдали, удаляться от кого-либо. «Не отступим от Тебя» естественно передаёт отказ общины удалиться от Бога и сохраняет оттенок верности.
- source_word: χρηστὰ
  choice: благи
  rationale: χρηστός может означать «добрый», «благой», «милостивый». Краткое «благи» сохраняет широту значения и достойный поэтическо-богословский регистр, не сводя смысл только к мягкости или выгоде.
- source_word: κρίματά
  choice: суды
  rationale: κρίματα обозначает судебные решения, приговоры или действия суда. «Суды» сохраняет формальный богословский смысл и не сужает выражение до постановлений либо наказаний.
- source_word: εἰς ἡμᾶς
  choice: над нами
  rationale: εἰς ἡμᾶς указывает на направленность или отношение Божьих судов к общине. Русское «суды над нами» идиоматично и сохраняет судебную образность, хотя возможен и более буквальный вариант «по отношению к нам».
theological_decisions:
- issue: Характер Божьих судов, выраженный словом χρηστά
  choice: благи
  alternative: милостивы / добры
  rationale: 'Перевод не устраняет напряжение между судом и благостью: община признаёт Божьи судебные действия благими, не уточняя, означает ли это их справедливость, милость или благотворность.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим регистром. Местоимение «Тебя» и притяжательное «Твои» написаны с прописной буквы как уважительное обращение к Богу. Порядок сносок приведён в последовательность [a], [b] и каждый маркер присутствует в основном тексте.
