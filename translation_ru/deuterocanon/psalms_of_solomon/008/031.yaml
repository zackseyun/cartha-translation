  text: Наши глаза увидели Твои суды[a], Боже; мы оправдали Твоё чтимое имя навеки[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь труден: буквально — «наши глаза дали Твои суды». Перевод «увидели» передаёт наиболее вероятный смысл в свете контекста.'
    reason: textual_variant
  - marker: b
