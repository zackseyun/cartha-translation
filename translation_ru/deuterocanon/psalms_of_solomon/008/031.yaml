    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοσαν
  choice: увидели
  rationale: Переданный греческий глагол буквально означает «дали», однако при подлежащем «наши глаза» эта конструкция крайне трудна. Контекст предшествующего стиха, где Бог являет Свой суд, указывает на восприятие увиденного; буквальная форма отмечена в сноске.
- source_word: τὰ κρίματά σου
  choice: Твои суды
  rationale: κρίματα обозначает Божьи судебные решения или совершаемые Им акты суда. «Суды» прямо передаёт значение и естественно звучит в библейском контексте.
- source_word: ἐδικαιώσαμεν
  choice: мы признали правоту
  rationale: Глагол буквально можно передать как «оправдали», но здесь люди не наделяют Бога праведностью, а признают справедливость, явленную в Его судах. Выражение «признали правоту» ясно передаёт этот смысл, не устраняя напряжения, связанного с тем, что объектом служит Божье имя.
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: Твоего чтимого имени
  rationale: ἔντιμος означает «пользующийся почётом, чтимый, драгоценный». «Чтимое имя» звучит естественно, достойно и сохраняет оттенок почитания.
- source_word: εἰς αἰῶνας
  choice: навеки
  rationale: Оборот выражает неограниченную продолжительность; «навеки» кратко и естественно передаёт его в поэтическом контексте.
theological_decisions:
- issue: Как передать ἐδικαιώσαμεν, когда его объектом является Божье имя
  choice: «мы признали правоту Твоего чтимого имени»
  alternative: «мы оправдали Твоё чтимое имя»
  rationale: Выбранный вариант передаёт признание людьми справедливости Бога после явления Его судов и не создаёт впечатления, будто люди делают Бога праведным. Более буквальный вариант сохраняется в сноске как возможное прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Обращение к Богу оформлено традиционными прописными буквами. Синтаксическая трудность первой строки и неоднозначность ἐδικαιώσαμεν не скрыты, а отражены в сносках.
