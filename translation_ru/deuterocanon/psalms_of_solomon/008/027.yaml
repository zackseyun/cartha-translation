  verdict: approve
  source_fidelity: '«Бог был признан правым» точно передаёт аористный пассив ἐδικαίωθη в данном контексте: Божья правота была публично подтверждена/явлена. «В Своих судах» адекватно соответствует ἐν τοῖς κρίμασιν αὐτοῦ и сохраняет судебно-нравственную сферу κρίματα. «Среди народов земли» верно передаёт ἐν τοῖς ἔθνεσι τῆς γῆς без неоправданного сужения до язычников или одной страны.'
  naturalness: Фраза естественна для современного литературного русского языка, кратка и обладает уместным библейским достоинством без архаизации. Порядок слов ясен; «был признан правым» не создаёт ложного впечатления, будто Бог прежде не был праведен.
  terminology: Выбор «признан правым» удачно избегает возможной русской двусмысленности «оправдан», которая может означать оправдание обвиняемого. «Суды» сохраняет терминологическую связь с κρίματα. Сноска с вариантом «оправдан» обоснованно отмечает более буквальную, традиционную судебную передачу; её якорь [a] стоит в корректной позиции.
