base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/027.yaml
  text: God was vindicated in his judgments among the nations of the earth,[a]
translation:
  language: ru
  text: Бог был признан правым в Своих судах среди народов земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог был оправдан в Своих судах среди народов земли».'
    reason: Лексическая альтернатива для ἐδικαίωθη; более буквальный вариант сохраняет традиционную судебную формулировку, но в современном русском может быть понят неоднозначно.
lexical_decisions:
- source_word: ἐδικαίωθη
  choice: был признан правым
  rationale: Пассивная форма δικαιόω здесь означает, что Бог был явлен или признан правым благодаря Своим действиям. Такой перевод естественен для современного русского языка и не создаёт впечатления, будто Бог прежде не был праведен.
- source_word: κρίμασιν
  choice: судах
  rationale: κρίμα обозначает судебное решение или акт суда. «В Своих судах» сохраняет юридический и нравственный смысл греческого выражения.
- source_word: ἔθνεσι
  choice: народов
  rationale: В данном контексте ἔθνη — народы мира вообще, а не специально язычники в противопоставлении иудеям.
- source_word: τῆς γῆς
  choice: земли
  rationale: 'В сочетании с «народами» выражение имеет всеобщий смысл: речь идёт о народах земли, а не отдельной страны.'
theological_decisions:
- issue: 'Как передать δικαιόω применительно к Богу: традиционным «оправдан» или ясным современным соответствием'
  choice: был признан правым
  alternative: был оправдан; был явлен праведным
  rationale: Греческий текст говорит не о том, что Бог стал праведен, а о признании или явлении Его правоты в Его судах. Формулировка сохраняет судебную образность и не привносит технический догматический смысл «оправдания».
translation_notes:
  register: Современный литературный русский язык, сдержанный и возвышенный без архаизации. Заглавная буква в местоимении «Своих» соответствует принятому благоговейному библейскому регистру. Порядок компонентов близок к греческому, но фраза остаётся естественной по-русски.
