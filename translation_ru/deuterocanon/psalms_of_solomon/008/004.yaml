lexical_decisions:
- source_word: φωνὴν
  choice: шум
  rationale: В ближайшем контексте φωνή обозначает слышимый шум, связанный с войной, трубой и множеством людей; «шум» сохраняет эту смысловую и риторическую связь лучше, чем «голос».
- source_word: ἤκουσα
  choice: я услышал
  rationale: Аорист прямо сообщает о восприятии звука и естественно передаётся совершенным видом.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Хотя εἰς обычно выражает направление, в позднегреческом возможна локативная функция; здесь местное значение наиболее естественно по контексту.
- source_word: πόλιν ἁγιάσματος
  choice: городе святости
  rationale: Передача сохраняет необычную именную конструкцию греческого текста и её возможную смысловую широту, не сводя её безоговорочно к привычному эпитету «святой город».
