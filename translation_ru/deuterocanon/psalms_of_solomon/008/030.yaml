lexical_decisions:
- source_word: ἰδοὺ δή
  choice: Вот же
  rationale: Сочетание служит усиленным указательным маркером. «Вот же» сохраняет торжественное привлечение внимания и естественно звучит в современной русской молитвенной речи.
- source_word: ὁ θεός
  choice: Боже
  rationale: В контексте прямого обращения русская звательная форма «Боже» естественно передаёт вокативную функцию греческого выражения.
- source_word: ἔδειξας
  choice: Ты показал
  rationale: Аорист обозначает совершившееся действие; русское прошедшее совершенного вида прямо и без лишнего толкования передаёт смысл глагола.
- source_word: τὸ κρῖμά σου
  choice: Свой суд
  rationale: κρῖμα обозначает Божье судебное решение или акт суда. «Суд» сохраняет юридическую весомость, не сужая значение до конкретного приговора; возвратное «Свой» естественно при совпадении деятеля и обладателя.
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: в Своей праведности
  rationale: Предлог ἐν наиболее прямо передан как «в», а δικαιοσύνη — как «праведность», что сохраняет одновременно нравственный и судебный оттенки. Возможное контекстуальное значение «справедливость» отмечено в сноске.
theological_decisions:
- issue: Передача δικαιοσύνη в контексте Божьего суда
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет более широкий нравственно-богословский диапазон δικαιοσύνη, тогда как «справедливость» яснее подчёркивает судебный оттенок. Основной текст не сводит выражение только к юридическому смыслу, а альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-поэтической речи. Синтаксис близок к греческому, но естественен по-русски; прописные местоимения при обращении к Богу используются как стилистическая норма данного проекта.
