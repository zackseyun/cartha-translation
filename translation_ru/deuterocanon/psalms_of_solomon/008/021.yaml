  source_fidelity: «Он овладел» точно передаёт κατελάβετο как установление контроля над укреплениями, не навязывая способ взятия. «Укреплёнными башнями» — оправданное и ясное решение для редкого πυργοβάρεις; сочетание со «стеной Иерусалима» сохранено без утраты структуры греческого текста.
