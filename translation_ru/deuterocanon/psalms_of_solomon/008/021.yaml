lexical_decisions:
- source_word: κατελάβετο
  choice: овладел
  rationale: В военном контексте глагол означает завладеть укреплениями, взять их под свой контроль. «Овладел» передаёт этот смысл, не уточняя без достаточных оснований, произошло ли это в результате штурма или занятия.
- source_word: τὰς πυργοβάρεις
  choice: укреплёнными башнями
  rationale: Редкое слово обозначает оборонительные сооружения башенного типа; перевод сохраняет вероятную связь с πύργος («башня») и естественно сочетается с последующим упоминанием стены.
- source_word: αὐτῆς
  choice: её
  rationale: Местоимение женского рода относится к Иерусалиму как к олицетворённому городу и сохраняет поэтический образ оригинала.
- source_word: τὸ τεῖχος Ἰερουσαλήμ
  choice: стеной Иерусалима
  rationale: Сохраняются единственное число собирательного обозначения городской стены и прямо названный Иерусалим.
