translation:
  language: ru
  text: Он увёл их сыновей и дочерей, которых они произвели на свет в осквернении.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в профанации». Греческое слово может означать осквернение или профанацию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγεν
  choice: увёл
  rationale: Аорист ἀπάγω обозначает удаление или увод; «увёл» сохраняет конкретный образ и не уточняет сверх текста, было ли это насильственным пленением.
- source_word: τοὺς υἱοὺς καὶ τὰς θυγατέρας αὐτῶν
  choice: их сыновей и дочерей
  rationale: 'Перевод сохраняет явно названную в греческом тексте пару: сыновья и дочери.'
- source_word: ἃ
  choice: которых
  rationale: Хотя греческое относительное местоимение стоит в среднем роде множественного числа и согласуется с совокупностью двух существительных разного рода, по-русски при обозначении людей естественно «которых».
- source_word: ἐγέννησαν
  choice: родили
  rationale: γεννάω может обозначать как рождение, так и порождение. «Родили» в русском языке естественно относится к родителям в целом и не ограничивает действие только матерями.
- source_word: ἐν βεβηλώσει
  choice: в осквернении
  rationale: βεβήλωσις выражает осквернение, профанацию, нарушение святости. «В осквернении» сохраняет нравственно-религиозную оценку исходного текста.
theological_decisions:
- issue: Нравственно-религиозный смысл ἐν βεβηλώσει
  choice: в осквернении
  alternative: в поругании святыни; в нечистоте
  rationale: Выражение передаёт не просто обстоятельство рождения, а отрицательную оценку, связанную с осквернением или профанацией. При этом перевод не уточняет, в чём именно состояло осквернение.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным библейским ритмом. Формулировка сохраняет последовательность и неоднозначность греческого текста; местоимение «они» оставлено без дополнительного истолкования.
