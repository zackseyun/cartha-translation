base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/018.yaml
  text: The rulers of the land met him with joy[a]; they said to him, “Blessed is your way. Come[c][b], enter with peace.”
translation:
  language: ru
  text: 'Правители страны[a] с радостью встретили его и сказали ему: «Желанен твой путь[b]! Придите же, войдите с миром».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земли». Греческое слово может обозначать землю, страну или край; здесь вероятнее местный политический смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Желанен твой приход». Буквально: «желанен твой путь»; выражение может приветствовать как дорогу или поход, так и само прибытие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπάντησαν
  choice: встретили
  rationale: Глагол обозначает встречу, нередко выход навстречу прибывающему; «встретили» естественно передаёт сцену торжественного приёма без избыточного уточнения.
- source_word: οἱ ἄρχοντες
  choice: правители
  rationale: Слово обозначает лиц, обладающих властью, и сохраняет здесь политический смысл.
- source_word: τῆς γῆς
  choice: страны
  rationale: В данном контексте речь, вероятнее всего, идёт о конкретной территории и её политическом руководстве. В русском «правители страны» звучит естественнее, чем двусмысленное «правители земли».
- source_word: μετὰ χαρᾶς
  choice: с радостью
  rationale: Прямая и естественная передача обстоятельства образа действия.
- source_word: Εὐκτὴ
  choice: желанен
  rationale: Прилагательное означает «желанный, желаемый, тот, о котором молились», а не собственно «процветающий». Выбор сохраняет необычную формулировку греческого текста и приветственный оттенок.
- source_word: ἡ ὁδός σου
  choice: твой путь
  rationale: '«Путь» сохраняет широту ὁδός: дорога, путешествие или предпринятый поход.'
- source_word: δεῦτε
  choice: придите же
  rationale: Пригласительное побуждение передано во множественном числе в согласии со следующим εἰσέλθατε; частица «же» придаёт реплике естественный призывный характер.
- source_word: εἰσέλθατε
  choice: войдите
  rationale: Точно передаёт аористный императив множественного числа и приглашение вступить внутрь.
- source_word: μετʼ εἰρήνης
  choice: с миром
  rationale: Близкая к форме греческого выражения и устойчивая русская формула мирного, безопасного вступления.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно торжественной интонацией. Необычный образ «желанен твой путь» сохранён ради близости к греческому и снабжён пояснением. Множественное число в приглашении отражает εἰσέλθατε, хотя ранее назван один человек, и тем самым сохраняет возможное обращение к нему вместе с сопровождающими.
