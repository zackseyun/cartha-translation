  text: Обрати, Боже, к нам Свою милость и сжалься над нами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστρεψον
  choice: Обрати
  rationale: Повелительная форма передаёт просьбу направить милость к молящимся; «обрати… к нам» сохраняет образ движения и естественно звучит по-русски.
- source_word: τὸ ἔλεός σου
  choice: Свою милость
  rationale: ἔλεος здесь означает милость, сострадательное благоволение Бога. Возвратное «Свою» естественно при обращении к Богу и точно соотносит милость с субъектом действия.
- source_word: ἐφʼ ἡμᾶς
  choice: к нам
  rationale: Предлог ἐπί с винительным выражает направленность; «к нам» ясно и современно передаёт этот смысл.
- source_word: οἰκτείρησον
  choice: сжалься над нами
  rationale: Глагол обозначает сострадательную жалость. «Сжалься» сохраняет отличие от уже употреблённого слова «милость» и соответствует молитвенному контексту.
