lexical_decisions:
- source_word: Θλίψιν
  choice: бедствие
  rationale: Передаёт тяжёлое несчастье или беду без более поздних богословских оттенков слова «скорбь».
- source_word: φωνὴν πολέμου
  choice: гул войны
  rationale: В данном слуховом контексте φωνή означает слышимый звук; «гул войны» естественно и образно передаёт военный шум.
- source_word: τὸ οὖς μου
  choice: ухо моё
  rationale: Сохранён конкретный телесный образ и необычный субъект греческого выражения.
- source_word: σάλπιγγος
  choice: трубы
  rationale: Нейтральное и традиционное обозначение сигнального военного инструмента.
- source_word: ἠχούσης
  choice: возвещающей
  rationale: 'При последующих винительных σφαγὴν καὶ ὄλεθρον причастие можно понимать транзитивно: труба звучит, возвещая или знаменуя резню и погибель; выбор также избегает тавтологии «звук… звучащей».'
- source_word: σφαγὴν
  choice: резню
  rationale: Сохраняет резкий смысл насильственного массового убийства.
- source_word: ὄλεθρον
  choice: погибель
  rationale: Передаёт губительное уничтожение и образует естественную, весомую пару со словом «резня».
