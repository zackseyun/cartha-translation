  yaml_path: translation/deuterocanon/psalms_of_solomon/008/002.yaml
  text: The sound of a great multitude was like a very strong wind[c][b][a], like a storm of great fire sweeping through the wilderness.
translation:
  language: ru
  text: Гул множества людей[a] был подобен очень сильному ветру, подобен буре огромного пламени, несущегося через пустыню[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голос многочисленного народа».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «подобен буре большого огня, несомого через пустыню».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: гул
  rationale: В контексте множества людей слово обозначает общий слышимый звук; «гул» естественно передаёт этот смысл, не сводя его к отдельному голосу.
- source_word: λαοῦ πολλοῦ
  choice: множества людей
  rationale: Передаёт собирательное значение λαός и подчёркнутую словом πολλοῦ многочисленность, оставаясь естественным для современного русского языка.
- source_word: ἀνέμου πολλοῦ σφόδρα
  choice: очень сильному ветру
  rationale: Идиоматично передаёт двойное усиление, выраженное πολλοῦ и σφόδρα.
- source_word: καταιγὶς
  choice: буре
  rationale: Ясный современный эквивалент, сохраняющий силу образа без излишней архаичности.
- source_word: πυρὸς πολλοῦ
  choice: огромного пламени
  rationale: «Пламя» естественнее русского буквального сочетания «много огня», а «огромного» сохраняет масштаб образа.
- source_word: φερομένου διʼ ἐρήμου
  choice: несущегося через пустыню
  rationale: Причастие грамматически относится к πυρός и описывает огонь, стремительно движущийся через безлюдное пространство.
theological_decisions: []
