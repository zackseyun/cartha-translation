  yaml_path: translation/deuterocanon/psalms_of_solomon/008/039.yaml
  text: May favor be upon us and our children forever[a]; O Lord our Savior[c][b], we shall never again be shaken forever.
translation:
  language: ru
  text: Нам и нашим детям — благоволение[a] навеки[b]. Господи, Спаситель наш, мы уже никогда не будем поколеблены[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благосклонность», «добрая воля».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза не содержит выраженного глагола и допускает также молитвенное прочтение: «Да пребудет благоволение с нами и нашими детьми навеки».'
    reason: source_ambiguity
  - marker: c
    text: 'Буквально: «не будем поколеблены более на вечное время»; это усиленное выражение непреходящей устойчивости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  choice: благоволение
  rationale: Слово обозначает благосклонность, одобрение или добрую волю. «Благоволение» сохраняет религиозно-поэтический оттенок и не уточняет сверх текста, идёт ли речь именно о Божьем благоволении.
- source_word: Κύριε
  choice: Господи
  rationale: Форма звательного обращения к Богу естественно передаётся традиционным русским обращением «Господи».
- source_word: σωτὴρ ἡμῶν
  choice: Спаситель наш
  rationale: Передаёт титульное значение σωτήρ и сохраняет порядок и торжественный регистр греческого обращения.
- source_word: σαλευθησόμεθα
  choice: не поколеблемся
  rationale: Будущая пассивная форма описывает утрату устойчивости; русское «поколеблемся» естественно сохраняет образ и допускает как буквальное, так и переносное понимание.
- source_word: ἔτι τὸν αἰῶνα χρόνον
  choice: уже никогда
  rationale: 'Сочетание ἔτι с усиленным обозначением неограниченной длительности выражает окончательность: впредь поколебать говорящих не удастся. «Уже никогда» передаёт это по-русски без тяжеловесного повтора «навеки».'
- source_word: ἡμῖν καὶ τοῖς τέκνοις ἡμῶν
  choice: нам и нашим детям
  rationale: Дательный падеж сохранён, а τέκνα передано общим словом «дети», без неоправданного сужения до сыновей.
theological_decisions:
- issue: Принадлежность благоволения Богу
  choice: Не добавлять «Твоё»
  alternative: «Твоё благоволение»
  rationale: В контексте благоволение, вероятно, понимается как Божье, однако притяжательное местоимение в греческом тексте отсутствует; перевод не делает подразумеваемое явным.
- issue: Высказывание или молитвенное пожелание в первой части
  choice: Сохранить безглагольную формулировку
  alternative: «Да пребудет благоволение с нами и нашими детьми навеки»
  rationale: Греческое предложение не содержит выраженного глагола и может читаться как уверенное утверждение либо как пожелание. Русская конструкция с тире сохраняет эту напряжённость, не выбирая одну трактовку.
translation_notes:
  register: Современный литературный русский язык с достойным псалмическим звучанием. Традиционные формы «Господи» и «Спаситель наш» уместны в прямом обращении; синтаксис остаётся понятным без архаизации.
