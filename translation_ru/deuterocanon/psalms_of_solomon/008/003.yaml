  text: 'И сказал я в сердце своём[a]: «Где же Бог будет судить его?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я сказал своему сердцу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ μου
  choice: сказал я в сердце своём
  rationale: Греческое выражение буквально означает «сказал моему сердцу». Русское «сказал я в сердце своём» естественно передаёт внутреннюю речь и сохраняет образ сердца; буквальный вариант приведён в примечании.
- source_word: Ποῦ ἄρα
  choice: Где же
  rationale: Ποῦ выражает вопрос о месте, а ἄρα придаёт ему оттенок размышления или вывода; частица «же» естественно передаёт этот оттенок по-русски.
- source_word: κρινεῖ
  choice: будет судить
  rationale: Сохранено основное значение κρίνω — «судить». Более узкое «осудит» преждевременно устранило бы возможную смысловую широту глагола.
- source_word: αὐτόν
  choice: его
  rationale: Прямое соответствие греческому местоимению мужского рода в винительном падеже; референт определяется контекстом.
- source_word: ὁ θεός
  choice: Бог
  rationale: Стандартная и контекстуально уместная передача греческого обозначения Бога.
theological_decisions:
- issue: Характер Божьего суда в κρινεῖ
  choice: будет судить
  alternative: осудит
  rationale: Греческий глагол сам по себе не требует значения обвинительного приговора, поэтому перевод сохраняет открытость между судебным разбирательством и осуждением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «сказал я» и выражение «в сердце своём» сохраняют поэтический регистр и образность источника, оставаясь понятными современному читателю.
