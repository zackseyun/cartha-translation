base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/023.yaml
  text: He destroyed their rulers and everyone wise in counsel[c][b][a]; he poured out the blood of those dwelling in Jerusalem like unclean water.
translation:
  language: ru
  text: Он погубил их правителей и всех мудрых в совете[a]; он пролил кровь живущих в Иерусалиме, как воду нечистоты[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякого мудрого советника»; греческое выражение сжато и может иметь собирательный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как нечистую воду». Буквально: «как воду нечистоты»; выражение может подразумевать также ритуальную нечистоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: погубил
  rationale: Передаёт доведение до гибели, не сводя значение исключительно к казни; последующая строка прямо говорит о кровопролитии.
- source_word: ἄρχοντας αὐτῶν
  choice: их правителей
  rationale: Сохраняет притяжательное местоимение и политический смысл обозначения лиц, облечённых властью.
- source_word: πᾶν σοφὸν ἐν βουλῇ
  choice: всех мудрых в совете
  rationale: Сохраняет сжатость и собирательный характер греческого оборота, не превращая его однозначно в должностное наименование «советники».
- source_word: ἐξέχεεν
  choice: пролил
  rationale: Это естественное русское сочетание со словом «кровь», сохраняющее конкретный образ излияния.
- source_word: τῶν οἰκούντων Ἰερουσαλήμ
  choice: живущих в Иерусалиме
  rationale: Передаёт причастную конструкцию и звучит естественно в современном русском языке.
- source_word: ὡς ὕδωρ ἀκαθαρσίας
  choice: как воду нечистоты
  rationale: Сохраняет генитивную конструкцию «вода нечистоты» и её возможный культовый оттенок, не заменяя существительное ἀκαθαρσία простым прилагательным.
theological_decisions:
- issue: Возможный культовый оттенок выражения ὕδωρ ἀκαθαρσίας
  choice: вода нечистоты
  alternative: нечистая вода
  rationale: Буквальная генитивная форма сохраняет как общее значение загрязнённости, так и возможную связь с ритуальной нечистотой, не разрешая эту смысловую напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксический параллелизм и резкий образ изливаемой крови сохранены; архаизмы и конфессионально окрашенные уточнения не вводятся.
