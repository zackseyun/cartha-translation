lexical_decisions:
- source_word: ἐμοιχῶντο
  choice: прелюбодействовал
  rationale: Глагол обозначает супружескую измену; несовершенный вид русского глагола передаёт длительный или повторяющийся характер греческого имперфекта.
- source_word: ἕκαστος
  choice: Каждый из них
  rationale: Явно передаёт распределительное значение единственного числа и естественно звучит по-русски.
- source_word: τὴν γυναῖκα τοῦ πλησίον αὐτοῦ
  choice: с женой своего ближнего
  rationale: Сохраняет прямой смысл генитивной конструкции и традиционно-достойное, но понятное обозначение другого человека словом «ближний».
- source_word: συνέθεντο συνθήκας
  choice: заключали соглашения
  rationale: Устойчивое русское сочетание точно передаёт составное значение глагола и существительного; «соглашения» не привносит более узкий богословский оттенок слова «завет».
- source_word: αὐτοῖς
  choice: между собой
  rationale: В данном контексте передаёт вероятный взаимный характер договорённостей участников, не скрывая в примечании возможность более буквального понимания «с ними».
- source_word: μετὰ ὅρκου
  choice: скрепляя их клятвой
  rationale: Естественно выражает то, что соглашения подтверждались или делались обязательными посредством клятвы.
- source_word: περὶ τούτων
  choice: об этом
  rationale: Отсылает к только что названным поступкам и сохраняет смысл греческой фразы без ненужной тяжеловесности.
