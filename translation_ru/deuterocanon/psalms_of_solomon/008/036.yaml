  yaml_path: translation/deuterocanon/psalms_of_solomon/008/036.yaml
  text: Do not overlook us[a], our God[b], lest the nations swallow us up as though there were no one to redeem.
translation:
  language: ru
  text: Не оставь нас без внимания, Боже наш, чтобы народы не поглотили нас, словно нет никого, кто избавил бы нас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  choice: Не оставляй нас без внимания
  rationale: Глагол означает «смотреть мимо», «не замечать», «пренебрегать». Выбранная формулировка естественна для современной русской молитвенной речи и не усиливает значение до презрения.
- source_word: ὁ θεὸς ἡμῶν
  choice: Боже наш
  rationale: Именительная форма имеет звательную функцию. Русское обращение «Боже наш» точно и естественно передаёт молитвенный характер.
- source_word: ἵνα μὴ
  choice: чтобы … не
  rationale: Конструкция выражает предотвращаемый или опасаемый результат; в современном русском «чтобы не» звучит естественнее архаичного «дабы не».
- source_word: καταπίωσιν
  choice: поглотили
  rationale: Сохраняет яркий образ буквального проглатывания и одновременно естественно описывает уничтожение народа.
- source_word: ἔθνη
  choice: народы
  rationale: В контексте имеются в виду чужеземные народы. «Народы» прозрачно передаёт греческое слово, не привнося позднейшей конфессиональной окраски слова «язычники».
- source_word: ὡς μὴ ὄντος λυτρουμένου
  choice: словно нет никого, кто избавит
  rationale: Передаёт родительный абсолют с субстантивированным причастием как отсутствие действующего избавителя, сохраняя словесный характер выражения и не превращая его в формальный титул.
theological_decisions:
- issue: Передача λυτρουμένου
  choice: кто избавит
  alternative: избавителя; кто искупит
  rationale: Причастие обозначает того, кто совершает избавление или выкуп. «Кто избавит» сохраняет действие и не вводит без необходимости титул «Избавитель»; «искупит» могло бы сузить смысл до богословского понятия искупления.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Образ «поглотили» сохранён; синтаксис сделан ясным без архаизмов и конфессионально маркированной лексики.
