  source_fidelity: 'Греч. μὴ ὑπερίδῃς — запретительное аористное сослагательное: «не оставь без внимания / не пренебреги нами». «Не оставляй нас без внимания» в целом передаёт смысл, но несовершенный вид несколько смещает его к длительному «не переставай заботиться». В заключительном ὡς μὴ ὄντος λυτρουμένου родительный абсолют с настоящим причастием обозначает отсутствие того, кто избавляет; «кто избавит» вводит будущее время и оставляет объект глагола невыраженным. Исправление сохраняет образ καταπίνω («поглотить») и смысл ἔθνη («народы»).'
  naturalness: Исправленный текст звучит естественно в современном литературном русском и сохраняет достоинство молитвенного обращения. «Словно нет никого, кто избавил бы нас» грамматически завершено и не придаёт λυτρουμένου характера фиксированного титула.
