  text: God exposed their sins before the sun[a]; all the earth came to know the righteous judgments of God.
translation:
  language: ru
  text: Бог обнажил их грехи перед солнцем; вся земля узнала праведные суды Божьи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
