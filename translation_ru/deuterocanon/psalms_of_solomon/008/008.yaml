lexical_decisions:
- source_word: ἀνεκάλυψεν
  choice: обнажил
  rationale: Глагол обозначает снятие покрова и явление скрытого. «Обнажил» сохраняет яркий образ публичного раскрытия грехов и естественно сочетается с контекстом позора.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: их грехи
  rationale: Прямой и общепонятный эквивалент, не смягчающий нравственного смысла ἁμαρτίας.
- source_word: ἐναντίον τοῦ ἡλίου
  choice: перед солнцем
  rationale: Буквальный перевод сохраняет необычный образ открытого, видимого всем разоблачения и не подменяет его более привычным оборотом «под солнцем».
- source_word: ἔγνω
  choice: узнала
  rationale: Аорист передаёт наступившее узнавание как результат публичного Божьего действия; русский совершенный вид естественно выражает это значение.
- source_word: πᾶσα ἡ γῆ
  choice: вся земля
  rationale: Передаёт широкий, всеобщий охват выражения, не сужая его до отдельной страны или области.
- source_word: τὰ κρίματα τοῦ θεοῦ τὰ δίκαια
  choice: праведные суды Божьи
  rationale: «Суды» прямо передаёт κρίματα, а «праведные» сохраняет нравственный и судебный оттенки δίκαια. Форма «Божьи» звучит современно и достойно.
theological_decisions:
- issue: Передача δίκαια применительно к Божьим κρίματα
  choice: праведные суды
  alternative: справедливые суды
  rationale: «Праведные» подчёркивает соответствие Божьих судов правде и сохраняет библейскую богословскую лексику; «справедливые» сильнее выделяет судебно-правовой оттенок и потому отмечено как допустимая альтернатива.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Сохранён необычный исходный образ «перед солнцем», а не заменён толкующим оборотом. Точка с запятой отражает тесную причинно-смысловую связь двух частей стиха.
