  yaml_path: translation/deuterocanon/psalms_of_solomon/008/040.yaml
  text: Praised is the Lord in his judgments in the mouth of the holy ones[d][c][b][a], and blessed is Israel by the Lord forever.
translation:
  language: ru
  text: Господь прославляется[a] за Свои суды устами благочестивых[b], и благословен Израиль Господом навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достоин хвалы».'
    reason: лексическая альтернатива для αἰνετός
  - marker: b
    text: 'Или: «верных»; буквально: «в устах благочестивых».'
    reason: сохранение лексической и образной неоднозначности ὁσίων и ἐν στόματι
lexical_decisions:
- source_word: αἰνετὸς
  choice: Хвалим
  rationale: Краткое предикативное прилагательное передаёт утверждение о восхвалении Господа и сохраняет параллель с «благословен», не превращая строку явно в пожелание.
- source_word: Κύριος
  choice: Господь
  rationale: Обычная русская передача κύριος как божественного титула.
- source_word: ἐν τοῖς κρίμασιν αὐτοῦ
  choice: за Свои суды
  rationale: В данном контексте ἐν указывает на основание хвалы; «за Свои суды» естественно по-русски и сохраняет широкий смысл κρίματα как Божьих судебных решений и деяний.
- source_word: ἐν στόματι
  choice: устами
  rationale: Русский творительный естественно обозначает тех, чьими устами звучит хвала, сохраняя образ произнесённой хвалы.
- source_word: ὁσίων
  choice: благочестивых
  rationale: ὅσιοι обозначает людей, преданных Богу и верных Ему; «благочестивые» отличает это слово от ἅγιοι («святые») и не привносит узкоконфессиональных ассоциаций.
- source_word: εὐλογημένος
  choice: благословен
  rationale: Предикативная форма сохраняет декларативный характер и синтаксический параллелизм с αἰνετός.
- source_word: Ἰσραὴλ
  choice: Израиль
  rationale: Устоявшаяся русская форма имени.
- source_word: ὑπὸ Κυρίου
  choice: Господом
  rationale: 'Творительный передаёт деятеля при греческом ὑπό с родительным: Господь является источником благословения Израиля.'
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Естественная и достойная русская передача устойчивого выражения о непрекращающейся длительности.
theological_decisions:
- issue: Значение ὅσιοι
  choice: благочестивые
  alternative: святые; верные
  rationale: Выбор сохраняет особый нравственно-заветный оттенок ὅσιοι и не отождествляет его без необходимости с ἅγιοι.
- issue: Модальность αἰνετός и εὐλογημένος
  choice: декларативные «хвалим» и «благословен»
  alternative: пожелательные «да будет восхвалён» и «да будет благословен»
  rationale: Греческие формы сами по себе являются предикативными прилагательными и не требуют внесения пожелательной частицы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Параллелизм «Хвалим… и благословен…» сохранён; архаические и узкоконфессиональные обозначения избегаются.
