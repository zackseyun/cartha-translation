lexical_decisions:
- source_word: ἐποίησαν
  choice: поступали
  rationale: Широкое по значению «делали» в сочетании с κατά естественно передаётся как образ поведения; несовершенный вид по-русски уместно выражает повторяющиеся или характерные поступки.
- source_word: κατὰ
  choice: по
  rationale: Предлог передаёт соответствие поведения определяющему его образцу или склонности, сохраняя краткость греческой конструкции.
- source_word: τὰς ἀκαθαρσίας αὐτῶν
  choice: по своим нечистотам
  rationale: «Нечистоты» сохраняет множественное число и нравственно-ритуальный оттенок ἀκαθαρσίαι; возвратное «своим» естественно соотносит их с подлежащим.
- source_word: καθὼς
  choice: как и
  rationale: Ясно выражает сопоставление и преемственность поведения.
- source_word: οἱ πατέρες αὐτῶν
  choice: их отцы
  rationale: Прямо сохраняет семейно-родовую лексику греческого текста, не заменяя её толковательным «предки».
