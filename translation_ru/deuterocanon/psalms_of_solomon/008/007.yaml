base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/007.yaml
  text: I said[a], “They direct their ways in righteousness.” I considered the judgments of God from the creation of heaven and earth[d][c][b]; I declared God righteous in his judgments from of old.
translation:
  language: ru
  text: 'Я сказал: «Они направляют свои пути в праведности».[a] Я размышлял о судах Божьих от сотворения неба и земли и признал Бога праведным в Его судах, которые от века.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможна и иная пунктуация, при которой слова «я сказал» относятся к предыдущему высказыванию, а здесь начинается фраза: «Они направляют свои пути в праведности».'
    reason: textual_punctuation_ambiguity
  - marker: b
    text: 'Или: «в Его вечных судах»; выражение может указывать как на глубокую древность, так и на вечность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατευθύνουσιν
  choice: направляют
  rationale: Глагол означает направлять верно или делать путь прямым. «Направляют» естественно сочетается с образом жизненного пути и не добавляет отсутствующего в тексте результата.
- source_word: ὁδοὺς
  choice: пути
  rationale: «Пути» сохраняет распространённый нравственный образ образа жизни и соответствует множественному числу греческого слова.
- source_word: δικαιοσύνῃ
  choice: в праведности
  rationale: Фраза описывает нравственный характер поведения; «праведность» сохраняет также смысловую связь с последующим ἐδικαίωσα.
- source_word: ἀνελογισάμην
  choice: размышлял
  rationale: Средний залог передаёт вдумчивое рассмотрение и внутреннее обдумывание; «размышлял» звучит естественно и достойно.
- source_word: κρίματα
  choice: суды
  rationale: «Суды» охватывает как Божьи судебные решения, так и их осуществление и сохраняет богословскую весомость выражения.
- source_word: ἐδικαίωσα
  choice: признал Бога праведным
  rationale: Так передаётся признание правоты Бога, а не наделение Его праведностью; одновременно сохраняется повтор корня, связывающий δικαιοσύνῃ и ἐδικαίωσα.
- source_word: τοῖς ἀπʼ αἰῶνος
  choice: которые от века
  rationale: Формулировка сохраняет возможность понимать выражение как указание либо на изначальную древность, либо на вечность Божьих судов, не выбирая метафизически более сильное толкование.
theological_decisions:
- issue: Как передать ἐδικαίωσα τὸν θεόν
  choice: признал Бога праведным
  alternative: оправдал Бога; признал правоту Бога
  rationale: Основной вариант сохраняет декларативный смысл и повтор корня «правед-», подчёркивающий контраст между человеческой праведностью и подлинной праведностью Бога, но не создаёт впечатления, будто говорящий наделяет Бога праведностью.
- issue: Смысл τοῖς ἀπʼ αἰῶνος при Божьих судах
  choice: Его судах, которые от века
  alternative: Его вечных судах; Его судах издревле
  rationale: Греческое выражение допускает как значение давней древности, так и значение вечности. Эллиптическая формула «которые от века» сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; повтор корня «правед-» намеренно сохранён как значимая черта греческого текста.
