base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/015.yaml
  text: Therefore God mixed for them a spirit of delusion[a]; he made them drink a cup of undiluted wine to drunkenness.
translation:
  language: ru
  text: Поэтому Бог смешал для них дух заблуждения[a] и напоил их чашей неразбавленного вина до опьянения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В печатном тексте Суита стоит трудное εὕρε («нашёл»), вероятно, вследствие ошибки передачи текста; по явной параллели с Ис 19:14 (LXX) следует читать πνεῦμα — «дух».
    reason: Текстологическая трудность существенно влияет на перевод и должна быть обозначена, а не скрыта.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт вывод и связь с предшествующими обвинениями кратко и естественно.
- source_word: ἐκέρασεν
  choice: смешал
  rationale: Сохраняет конкретный образ приготовления напитка, продолженный словами о чаше вина.
- source_word: πνεῦμα πλανήσεως (в исправленном чтении вместо печатного εὕρε πλανήσεως)
  choice: дух заблуждения
  rationale: Исправление подтверждается явной параллелью с Ис 19:14 по Септуагинте; «заблуждение» передаёт нравственно-духовный смысл πλάνη, не устраняя образ «духа».
- source_word: ἐπότισεν αὐτούς
  choice: напоил их
  rationale: 'Естественно по-русски выражает каузативное значение: Бог дал им пить; в контексте суда оттенок принуждения понятен без тяжеловесной конструкции.'
- source_word: ποτήριον οἴνου ἀκράτου
  choice: чашей неразбавленного вина
  rationale: ἀκράτου обозначает вино, не смешанное с водой; творительный падеж после «напоил» звучит естественно и сохраняет образ чаши.
- source_word: εἰς μέθην
  choice: до опьянения
  rationale: Передаёт достигнутый результат и звучит естественнее буквального «к опьянению».
theological_decisions:
- issue: Божественное действие, приводящее к заблуждению
  choice: Сохранить прямую формулировку «Бог смешал для них дух заблуждения»
  alternative: 'Смягчить причинность: «Бог допустил, чтобы они впали в заблуждение»'
  rationale: Греческий текст прямо приписывает действие Богу как суд; смягчение устранило бы богословское напряжение источника.
translation_notes:
  register: Современный литературный русский с достоинством поэтического судебного изречения. Сохранены параллельные образы смешанного напитка, чаши и опьянения; синтаксис слегка сглажен союзом «и».
