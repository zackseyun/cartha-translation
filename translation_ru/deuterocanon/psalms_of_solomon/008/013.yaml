lexical_decisions:
- source_word: ἐπίπουσαν
  choice: они попирали
  rationale: Переданная греческая форма трудна, однако близко засвидетельствованное чтение и контекст насильственного культового осквернения поддерживают смысл «попирали». Текстовая неуверенность отмечена в сноске.
- source_word: τὸ θυσιαστήριον Κυρίου
  choice: жертвенник Господа
  rationale: Прямой и естественный эквивалент культового выражения; «жертвенник» сохраняет храмовый контекст.
- source_word: ἀπὸ πάσης ἀκαθαρσίας
  choice: всякой нечистотой
  rationale: «Нечистота» ясно передаёт ритуально-культовое значение ἀκαθαρσία; русский творительный естественно выражает средство осквернения при выбранном глаголе.
- source_word: ἐν ἀφέδρῳ αἵματος
  choice: менструальной кровью
  rationale: ἄφεδρος в греческом библейском употреблении обозначает именно менструальную нечистоту; перевод делает явной конкретную и намеренно шокирующую разновидность культового осквернения.
- source_word: ἐμίανιν
  choice: оскверняли
  rationale: Глагол естественно передаёт μιαίνω в ритуальном контексте и сочетается с жертвами и кровью.
- source_word: τὰς θυσίας
  choice: жертвы
  rationale: Прямой, краткий и понятный эквивалент, уместный в храмовом контексте.
- source_word: ὡς κρέα βέβηλα
  choice: словно обычное мясо
  rationale: βέβηλος противопоставляет непосвящённое священному. «Обычное мясо» по-русски яснее, чем двусмысленное «нечистое мясо», и сохраняет различие между священным и обыденным.
theological_decisions:
- issue: Характер крови в выражении ἐν ἀφέδρῳ αἵματος
  choice: менструальная кровь
  alternative: кровяные выделения
  rationale: Употребление ἄφεδρος в Септуагинте указывает на менструальную нечистоту, поэтому общий перевод ослабил бы конкретность обвинения.
- issue: Значение βέβηλα в сравнении с жертвами
  choice: обычное мясо
  alternative: осквернённое мясо
  rationale: Слово прежде всего выражает противопоставление священного и непосвящённого, а не просто состояние загрязнения; перевод не добавляет особого конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достойным, но понятным культовым словарём. «Жертвенник», «нечистота» и «оскверняли» сохраняют храмовый регистр; «обычное мясо» естественно передаёт противопоставление священного и обыденного.
