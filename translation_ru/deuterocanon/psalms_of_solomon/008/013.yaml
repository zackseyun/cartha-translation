  source_fidelity: 'Основной смысл передан верно: трудная начальная форма обоснованно передана как «попирали», θυσιαστήριον Κυρίου — «жертвенник Господа», а ἄφεδρος αἵματος в данном библейско-ритуальном контексте уместно конкретизирована как «менструальная кровь». Однако сочетание «попирали жертвенник ... всякой нечистотой» по-русски создаёт неестественное впечатление, будто нечистота является орудием попрания. Перестройка делает связь с культовым осквернением ясной, не снимая текстовой трудности, отмеченной в сноске.'
