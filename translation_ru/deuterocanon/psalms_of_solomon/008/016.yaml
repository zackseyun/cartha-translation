lexical_decisions:
- source_word: ἤγαγεν
  choice: Он привёл
  rationale: Аорист ἄγω обозначает появление действующего лица вследствие того, что некто его привёл; «привёл» естественно передаёт движение и не уточняет сверх греческого текста, кто подразумевается под субъектом.
- source_word: τὸν ἀπʼ ἐσχάτου τῆς γῆς
  choice: того, кто от края земли
  rationale: Оборот указывает на происхождение фигуры из географически предельного места. Формулировка сохраняет образ «края земли» и синтаксическое повторение определённого артикля с причастной конструкцией.
- source_word: παίοντα
  choice: того, кто наносит удары
  rationale: Причастие настоящего времени от παίω означает «ударять, наносить удары». Выражение «наносит удары» современно, ясно и сохраняет деятельный характер формы.
- source_word: κραταιῶς
  choice: могучие
  rationale: Наречие означает действие с большой силой. По-русски его смысл естественно передаётся прилагательным при слове «удары», сохраняя возвышенный тон.
