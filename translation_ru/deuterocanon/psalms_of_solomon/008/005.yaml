lexical_decisions:
- source_word: συντριβὴ
  choice: была сокрушена
  rationale: Существительное обозначает сокрушение, раздробленность или надлом. В безглагольной греческой конструкции оно передано русским сказуемым в прошедшем времени, согласованном с повествовательным контекстом.
- source_word: ἡ ὀσφύς μου
  choice: поясница моя
  rationale: «Поясница» прямо передаёт единственное число и телесный образ, оставаясь понятнее современному читателю, чем архаичное «чресла».
- source_word: ἀπὸ ἀκοῆς
  choice: от услышанного
  rationale: Фраза указывает на причину телесной реакции — то, что говорящий услышал. Перевод сохраняет возможность понимать ἀκοή как услышанное известие, не уточняя его содержание.
- source_word: παρελύθη
  choice: подкосились
  rationale: Аорист пассива описывает утрату силы или способности держаться. С коленями русское «подкосились» естественно выражает телесную слабость и внезапный отказ, не утверждая буквального медицинского паралича.
- source_word: γόνατά μου
  choice: колени мои
  rationale: Прямой лексический эквивалент с сохранением притяжательного местоимения.
