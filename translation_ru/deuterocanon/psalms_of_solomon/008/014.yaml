translation:
  language: ru
  text: Они не оставили несовершённым ни одного греха, превзойдя в этом народы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не было греха, которого они не совершили больше, чем народы».'
    reason: Греческую сравнительную фразу ὑπὲρ τὰ ἔθνη можно связать непосредственно с глаголом «совершили», а не передавать отдельным обстоятельственным оборотом.
lexical_decisions:
- source_word: παρέλειπον
  choice: не оставили … несовершённым
  rationale: 'Глагол означает «оставлять, пропускать, не делать». Русское выражение естественно передаёт здесь всеохватное отрицание: они не упустили ни одного греха.'
- source_word: ἁμαρτίαν
  choice: греха
  rationale: «Грех» прямо передаёт нравственно-религиозное значение существительного и соответствует возвышенному контексту.
- source_word: ἐποίησαν
  choice: совершённым
  rationale: Буквально глагол означает «сделали», но по-русски грех обычно «совершают». Причастная конструкция сохраняет смысл греческого относительного оборота без неестественного двойного отрицания.
- source_word: ὑπὲρ τὰ ἔθνη
  choice: превзойдя народы
  rationale: ὑπέρ с винительным выражает превышение или превосходство. Такой перевод сохраняет сравнительную силу фразы и не сужает ἔθνη до конфессионально окрашенного «язычники».
