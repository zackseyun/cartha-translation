lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: Союз вводит основание предшествующей молитвы или исповедания; «ибо» естественно сохраняет пояснительно-причинную связь.
- source_word: σὺ ὁ θεός
  choice: Ты — Бог
  rationale: Именная конструкция с явным местоимением передаёт смысл с естественным для русского языка логическим выделением.
- source_word: τῆς δικαιοσύνης
  choice: праведности
  rationale: «Праведность» сохраняет сочетание нравственной правоты Бога и справедливости Его суда; возможный более узкий вариант отмечен в сноске.
- source_word: κρίνων
  choice: судящий
  rationale: Причастие настоящего времени сохраняет характеристику продолжающегося действия Бога и синтаксическую связь с основной конструкцией.
- source_word: τὸν Ἰσραήλ
  choice: Израиль
  rationale: Стандартная русская форма библейского имени; винительный падеж выражен синтаксически.
- source_word: ἐν παιδείᾳ
  choice: подвергая его вразумлению
  rationale: παιδεία здесь означает исправляющее воспитание, наказание или взыскание, а ἐν указывает на способ осуществления суда. Развёрнутая формулировка звучит естественнее, чем буквальное «во вразумлении».
theological_decisions:
- issue: Соотношение Божьего суда и παιδεία
  choice: Суд совершается посредством исправляющего вразумления
  alternative: Суд и наказание могут восприниматься как два раздельных действия
  rationale: Греческое ἐν παιδείᾳ тесно связывает суд над Израилем с воспитательно-исправительной мерой, не определяя при этом её точную форму.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенно-поэтическим звучанием. Заглавное «Ты» уместно как традиционное обращение к Богу, не добавляя богословского толкования.
