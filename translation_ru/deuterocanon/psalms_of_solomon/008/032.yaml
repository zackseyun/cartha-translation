  - severity: low
    issue: Сноска b предлагает «посредством взыскания».
    rationale: «Взыскание» в современном русском преимущественно звучит как санкция, требование или взыскание долга и хуже передаёт воспитательно-исправительный диапазон παιδεία. Более нейтральны «наставляя» и «с дисциплиной».
