  source_fidelity: '«А мы» вводит противительный союз, которого в греческом тексте нет: оба соответствующих союза — καί. Хотя контраст контекстуально понятен, в данном кратком высказывании его лучше не грамматикализировать. «Твоя верность с нами» точно передаёт πίστις σου μεθʼ ἡμῶν; «ожесточили свою шею» сохраняет образ и собирательное единственное число τράχηλον. «Наш воспитатель» передаёт παιδευτής шире, чем «тот, кто нас исправляет», включая воспитательно-дисциплинарный смысл.'
  naturalness: Исправленный текст остаётся современным литературным русским. «Ожесточили свою шею» — намеренно сохранённый библейский образ, значение которого ясно пояснено в сноске. «Наш воспитатель» естественнее и семантически полнее, чем описательное «тот, кто нас исправляет».
  terminology: «Верность» для πίστις в отношении Бога обоснованна; формально возможное «вера» сохранено как лексическая альтернатива. «Воспитатель» для παιδευτής удерживает обучение, формирование и исправляющую дисциплину, не сводя термин к наказанию.
