base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/035.yaml
  text: For your faithfulness is with us[a], and we have stiffened our neck[c][b], and you are our disciplinarian.
translation:
  language: ru
  text: Ибо твоя верность с нами[a], и мы ожесточили свою шею[b], и ты — наш воспитатель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоя вера с нами».'
    reason: lexical_alternative
  - marker: b
    text: «Ожесточить шею» — библейский образ упрямства и непокорности.
    reason: cultural_note
lexical_decisions:
- source_word: πίστις σου
  choice: твоя верность
  rationale: При обращении к Богу сочетание естественнее всего обозначает его неизменную верность народу. При этом формально возможное значение «твоя вера» сохранено в примечании.
- source_word: μεθʼ ἡμῶν
  choice: с нами
  rationale: Прямо передаёт μετὰ с родительным и сохраняет мысль о присутствующей среди народа Божьей верности.
- source_word: ἐσκληρύναμεν τράχηλον ἡμῶν
  choice: мы ожесточили свою шею
  rationale: Сохранён библейский образ упрямого сопротивления; единственное число «шею» соответствует греческому собирательному единственному числу.
- source_word: παιδευτής
  choice: тот, кто нас исправляет
  rationale: Передаёт как воспитательную, так и исправительно-дисциплинарную сторону слова, не сужая его до простого обучения и не усиливая до одного лишь наказания.
theological_decisions:
- issue: Значение πίστις σου применительно к Богу
  choice: твоя верность
  alternative: твоя вера
  rationale: В контексте обращения к Богу вероятнее имеется в виду его надёжность и постоянство по отношению к народу; более буквальная, но смыслово неоднозначная возможность отмечена в сноске.
- issue: Связь Божьей верности с упрямством народа
  choice: а мы ожесточили
  alternative: и мы ожесточили
  rationale: Противительный союз естественно выражает смысловой контраст, подчёркнутый местоимениями, хотя греческий καί буквально означает «и»; буквальный вариант сохранён в сноске.
- issue: Характер Божьего действия в παιδευτής
  choice: исправляет
  alternative: воспитывает; наставляет; наказывает
  rationale: Выбранное слово удерживает вместе педагогический и корректирующий аспекты, не навязывая исключительно карательного понимания.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской образности. Местоимения, относящиеся к Богу, даны со строчной буквы по общим современным издательским нормам. Формула «тот, кто нас исправляет» звучит естественно и сохраняет смысл παιδευτής без архаизма и чрезмерно карательного оттенка.
