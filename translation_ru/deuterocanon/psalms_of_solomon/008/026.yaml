lexical_decisions:
- source_word: ἐμίανεν
  choice: осквернил
  rationale: Глагол μίανω обозначает ритуальное или нравственное осквернение; «осквернил» естественно передаёт эту смысловую область и подходит как к городу, так и к святыням.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Традиционная русская форма названия города.
- source_word: τὰ ἡγιασμένα
  choice: всё освящённое
  rationale: Субстантивированное причастие среднего рода множественного числа обозначает совокупность освящённых предметов или святынь; форма «всё освящённое» сохраняет пассивное значение и не уточняет без основания, о каких именно предметах идёт речь.
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: имени Бога
  rationale: Дательный оборот присоединён к «освящённому» и естественно понимается как посвящение имени Бога. Русское «освящённое имени Бога» сохраняет эту направленность, не превращая имя в явно выраженное орудие освящения.
theological_decisions:
- issue: Смысл дательного τῷ ὀνόματι τοῦ θεοῦ
  choice: освящённое имени Бога
  alternative: освящённое именем Бога / освящённое во имя Бога
  rationale: Контекст допускает оттенки посвящения и связи с Божьим именем. Основной текст передаёт дательный как дательный посвящения, а примечание сохраняет возможные инструментальное и формульное прочтения.
translation_notes:
  register: Современный литературный русский язык с достоинством сакрального текста. «Всё освящённое» понятно широкому читателю и ближе к греческой форме, чем более конкретное «святыни», хотя последнее возможно по смыслу.
