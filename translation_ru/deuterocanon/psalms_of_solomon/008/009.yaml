  text: Their lawless deeds were in secret chambers[a], in provocation.
translation:
  language: ru
  text: Их беззакония совершались в тайных местах, вызывая гнев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в провокации»; возможно также: «в дерзком неповиновении».'
    reason: ἐν παροργισμῷ может обозначать провокацию, в том числе провоцирование гнева, либо вызывающее, дерзкое поведение. В греческой строке не назван тот, чей гнев подразумевается.
lexical_decisions:
- source_word: ἐν καταγώγαις κρυφίοις
  choice: в тайных убежищах
  rationale: καταγωγή обозначает место пребывания, пристанище или помещение, а κρύφιος — скрытое, тайное. «Тайные убежища» естественно передаёт скрытый характер мест, не уточняя без достаточных оснований их устройство.
- source_word: αἱ παρανομίαι αὐτῶν
  choice: их беззакония
  rationale: παρανομία означает нарушение закона и нравственно неправое деяние. «Беззакония» сохраняет правовой и нравственный оттенки и уместно в библейском литературном регистре.
- source_word: ἐν παροργισμῷ
  choice: вызывая гнев
  rationale: παροργισμός связано с возбуждением гнева, негодования. Деепричастная передача выражает провоцирующий характер беззаконий, но не называет того, чей это гнев, поскольку объект в греческом тексте не указан.
- source_word: '[подразумеваемая связка]'
  choice: творились
  rationale: Греческая строка не содержит выраженного глагола. «Творились» делает русское предложение полноценным и естественно сочетается с «беззакониями», не меняя основного смысла.
theological_decisions:
- issue: Чей гнев вызывают беззакония
  choice: Не называть обладателя гнева прямо
  alternative: «вызывая Его гнев»
  rationale: Контекст может подразумевать Божий гнев, однако в данной греческой строке местоимения или иного явного объекта нет. Перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой. Формулировка краткая и торжественная; синтаксис прояснён только настолько, насколько это необходимо по-русски.
