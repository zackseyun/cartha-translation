    reason: lexical_alternative
lexical_decisions:
- source_word: συνάγαγε
  choice: Собери
  rationale: Аористный императив выражает молитвенный призыв к собиранию; «собери» естественно и точно передаёт действие.
- source_word: τὴν διασπορὰν Ἰσραήλ
  choice: рассеяние Израиля
  rationale: Сохраняет форму греческого собирательного существительного διασπορά и его историко-богословский оттенок; в контексте речь идёт о рассеянном народе Израиля.
- source_word: μετὰ ἐλέους
  choice: с милостью
  rationale: Передаёт μετά с родительным как сопутствующее качество или образ действия, не устраняя возможной смысловой широты.
- source_word: χρηστότητος
  choice: благостью
  rationale: «Благость» передаёт нравственную доброту и благожелательность χρηστότης в достойном молитвенном регистре; возможен более обиходный вариант «добротой».
theological_decisions:
- issue: Конкретный или собирательно-абстрактный смысл διασπορά
  choice: Сохранено существительное «рассеяние»
  alternative: «рассеянных израильтян» / «рассеянный народ Израиля»
  rationale: Греческий текст использует существительное, способное обозначать как состояние рассеяния, так и находящихся в рассеянии людей. Основной текст сохраняет эту напряжённость, а сноска поясняет коллективный смысл.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным молитвенным звучанием. Формально маркированное «рассеяние» сохранено ради соответствия греческому существительному и его историческому оттенку; сноска даёт естественный личностный вариант.
