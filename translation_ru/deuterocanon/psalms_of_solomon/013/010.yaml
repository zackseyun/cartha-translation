translation:
  language: ru
  text: Но грешники будут унесены[a] на погибель, и памяти о них больше не останется[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут удалены»; «будут взяты прочь».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «и больше не найдётся памятования о них»; возможно также: «мемориала о них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτωλοὶ
  choice: грешники
  rationale: Прямо передаёт существительное со значением людей, характеризуемых грехом, не заменяя его более толковательным «нечестивцы».
- source_word: ἀρθήσονται
  choice: будут унесены
  rationale: Будущее страдательного залога от αἴρω; передаёт удаление или устранение, а в данном контексте суда естественно сочетается с направлением «на погибель».
- source_word: εἰς ἀπώλειαν
  choice: на погибель
  rationale: Передаёт направление к гибели или уничтожению и сохраняет суровость выражения без конфессионально окрашенной лексики.
- source_word: μνημόσυνον
  choice: памяти
  rationale: В данном поэтическом контексте означает сохраняющуюся память или воспоминание о ком-либо; русское «памяти о них» звучит естественно.
- source_word: ἔτι
  choice: больше не
  rationale: 'В отрицательном предложении естественно выражает прекращение: отныне память о них уже не сохранится.'
theological_decisions:
- issue: Характер погибели грешников
  choice: Сохранено общее «на погибель» без уточнения природы или длительности суда.
  alternative: «на вечную погибель» либо «к уничтожению»
  rationale: Греческое ἀπώλεια обозначает погибель, гибель или разрушение, но само по себе здесь не уточняет ни длительность, ни метафизический характер участи.
translation_notes:
  register: 'Современный литературный русский с достоинством поэтической речи. Синтаксис слегка сглажен ради естественности: безличное греческое «не найдётся памятования» передано как «памяти… не останется», а буквальный вариант сохранён в примечании.'
