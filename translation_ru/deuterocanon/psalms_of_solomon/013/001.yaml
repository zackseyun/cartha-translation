base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/001.yaml
  text: The right hand of the Lord sheltered me[b][a]; the right hand of the Lord spared us.
translation:
  language: ru
  text: Правая рука Господа укрыла меня[a], правая рука Господа пощадила нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покрыла меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сберегла нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεξιὰ
  choice: правая рука
  rationale: Субстантивированная форма женского рода подразумевает «руку»; это естественно передаёт библейский образ силы и защиты, не делая его архаичным.
- source_word: Κυρίου
  choice: Господа
  rationale: 'Родительный падеж выражает принадлежность: «правая рука Господа». Для κύριος сохранено принятое соответствие «Господь».'
- source_word: ἐσκέπασέν
  choice: укрыла
  rationale: Глагол обозначает покрытие, дающее защиту. «Укрыла» сохраняет и конкретный образ, и защитный смысл.
- source_word: με
  choice: меня
  rationale: Прямое соответствие местоимению первого лица единственного числа в роли дополнения.
- source_word: ἐφείσατο
  choice: пощадила
  rationale: Глагол φείδομαι означает щадить, удерживаться от причинения вреда или уничтожения; «пощадила» кратко и точно передаёт этот смысл.
- source_word: ἡμῶν
  choice: нас
  rationale: При φείδομαι родительный падеж обозначает тех, кого пощадили; по-русски требуется винительный падеж «нас».
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — обычное и контекстуально уместное соответствие κύριος; оснований заменять его более узким или стилистически маркированным вариантом нет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Выражение «правая рука» понятнее современному читателю, чем более архаичная «десница»; повтор исходного оборота сохранён.
