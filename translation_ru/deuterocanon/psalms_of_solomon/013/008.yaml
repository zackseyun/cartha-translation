translation:
  language: ru
  text: Ибо Он вразумит праведника, как возлюбленного сына[a], и его воспитание — как у первенца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сына любви».'
