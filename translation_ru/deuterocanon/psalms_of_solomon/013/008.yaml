    text: 'Или: «и его наставление (или дисциплина) — как у первенца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νουθετήσει
  choice: вразумит
  rationale: Глагол обозначает наставление с целью исправления; «вразумит» передаёт и наставительный, и корректирующий оттенок, не сводя действие к наказанию.
- source_word: δίκαιον
  choice: праведника
  rationale: Субстантивированное прилагательное стоит в единственном числе; «праведника» сохраняет единичный образ, согласованный с образами сына и первенца.
- source_word: υἱὸν ἀγαπήσεως
  choice: возлюбленного сына
  rationale: Родительный падеж имеет качественное значение; естественное русское выражение «возлюбленный сын» передаёт смысл, сохраняя сыновний образ.
- source_word: παιδεία
  choice: будет воспитывать
  rationale: Существительное означает формирующее воспитание, наставление и дисциплину. В русском языке преобразование именной конструкции в глагольную делает эллиптическую греческую фразу ясной и естественной.
- source_word: πρωτοτόκου
  choice: первенца
  rationale: Субстантивированное прилагательное передаёт образ перворождённого сына; «первенец» сохраняет этот образ без лишнего пояснения.
theological_decisions:
- issue: Подразумеваемое лицо, осуществляющее вразумление
  choice: Местоимение «Он» написано с прописной буквы в соответствии с ближайшим контекстом, где деятелем является Господь.
  alternative: Писать «он» со строчной буквы или не вводить местоимение.
  rationale: Русское предложение требует явного подлежащего; выбор отражает контекст, не добавляя к стиху нового действующего лица.
- issue: Отношение αὐτοῦ к παιδεία
  choice: 'Передано как действие, направленное на праведника: «будет воспитывать его».'
  alternative: «Его воспитание — как воспитание первенца», где местоименная связь остаётся более формально неоднозначной.
  rationale: В контексте отцовского вразумления наиболее естественно понимать αὐτοῦ как относящее воспитание к праведнику; альтернативная именная передача отмечена в сноске, поскольку греческая конструкция допускает формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Вразумит» и «воспитывать» понятны широкому читателю и сохраняют параллель между исправляющим наставлением и отцовским формированием. Именная эллиптическая конструкция второй половины стиха раскрыта глагольно ради естественности русского синтаксиса; более формальная передача сохранена в сноске.
