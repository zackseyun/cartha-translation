  yaml_path: translation/deuterocanon/psalms_of_solomon/013/006.yaml
  text: For the discipline of the righteous in ignorance is not like the destruction of the sinner[c][b][a];
translation:
  language: ru
  text: Ибо вразумление праведных[a] в неведении[b] не подобно гибели грешника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В одном из вариантов текста: «грешников» вместо «праведных».'
    reason: textual_variant
  - marker: b
    text: Выражение можно понимать как указание на проступки, совершённые по неведению.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὁμοία
  choice: не подобно
  rationale: Передаёт сравнительное противопоставление двух участей, не сводя его лишь к количественному различию.
- source_word: παιδεία
  choice: вразумление
  rationale: В данном контексте речь идёт о исправляющем воздействии на праведных; «вразумление» сохраняет воспитательно-коррективный оттенок и естественно противопоставляется гибели.
- source_word: τῶν δικαίων
  choice: праведных
  rationale: Точно передаёт субстантивированное обозначение группы и соответствует библейскому русскому словоупотреблению.
- source_word: ἐν ἀγνοίᾳ
  choice: в неведении
  rationale: Формально сохраняет краткость и неоднозначность греческого выражения, не добавляя прямо отсутствующего слова «грехи».
- source_word: καταστροφὴ
  choice: гибель
  rationale: Передаёт катастрофический, окончательный характер участи грешника и звучит естественно в данном противопоставлении.
- source_word: τοῦ ἁμαρτωλοῦ
  choice: грешника
  rationale: Сохраняет единственное число и обобщающее значение греческого субстантивированного прилагательного.
theological_decisions:
- issue: Характер испытания праведных
  choice: Вразумление праведных противопоставлено гибели грешника как иная по характеру участь.
  alternative: Понимать παιδεία прежде всего как наказание без явного исправительного оттенка.
  rationale: «Вразумление» отражает воспитательно-исправительный диапазон παιδεία, однако перевод не уточняет ни меру, ни окончательный богословский смысл этого воздействия.
- issue: Значение ἐν ἀγνοίᾳ
  choice: Сохранить выражение «в неведении» в основном тексте.
  alternative: Передать как «за грехи, совершённые по неведению».
  rationale: Греческий текст допускает связь с неумышленными проступками, но прямо не содержит слова «грехи»; примечание сообщает вероятное понимание, не устраняя неоднозначности основного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и прозрачен; формальная неоднозначность выражения ἐν ἀγνοίᾳ сохранена и пояснена в примечании.
