lexical_decisions:
- source_word: θηρία ... πονηρά
  choice: злые звери
  rationale: Передаёт существительное «звери» и постпозитивное πονηρά («злые, свирепые, губительные») без добавления отсутствующей в греческом оценки «дикие».
- source_word: ἐπέδραμοσαν αὐτοῖς
  choice: набросились на них
  rationale: Естественно передаёт стремительное враждебное нападение, выраженное ἐπιτρέχω с дательным дополнением.
- source_word: ἔτιλλον σάρκας αὐτῶν
  choice: терзали их плоть
  rationale: ἔτιλλον обозначает вырывание или раздирание; «терзали» сохраняет многократность несовершенного вида и образ нападения зубами.
- source_word: ἐν ταῖς μυλαῖς
  choice: коренными зубами
  rationale: μύλαι буквально связано с «жерновами», но в данном анатомическом контексте означает жевательные, коренные зубы.
- source_word: ἔθλων ὀστᾶ αὐτῶν
  choice: дробили их кости
  rationale: Передаёт сильное раздавливание; несовершенный вид сохраняет длительный характер действия.
- source_word: ἐρρύσατο ἡμᾶς Κύριος
  choice: Господь избавил нас
  rationale: Обычное и точное библейское соответствие для ῥύομαι; порядок слов в русском делает субъект ясным и естественным.
theological_decisions:
- issue: Соотношение «их» и «нас»
  choice: 'Сохранить смену третьего лица на первое: «на них… их… нас»'
  alternative: Согласовать все местоимения как относящиеся к одной группе
  rationale: Греческий текст намеренно или по контекстуально обусловленной смене перспективы различает αὐτοῖς/αὐτῶν и ἡμᾶς; перевод не должен устранять эту потенциально значимую неоднозначность.
- issue: Значение Кύριος
  choice: Господь
  alternative: Яхве
  rationale: В данном греческом источнике стоит Κύριος без доступного еврейского Vorlage; «Господь» сохраняет форму непосредственного источника и не реконструирует имя.
- issue: Связь заключительной части
  choice: «Но от всего этого…»
  alternative: «И от всего этого…»
  rationale: καί формально значит «и», однако здесь заключение контрастирует пережитое нападение с избавлением. «Но» естественно выражает этот дискурсивный поворот, не меняя богословского содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Сохранены резкие телесные образы и смена местоименной перспективы; синтаксис сделан ясным без смягчения насилия.
