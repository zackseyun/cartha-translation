base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/009.yaml
  text: For the Lord will spare his faithful ones[a], and he will wipe away their trespasses by discipline[c][b]; for the life of the righteous is forever.
translation:
  language: ru
  text: Ибо Господь пощадит верных Ему[a] и изгладит их проступки посредством вразумления[b], ведь жизнь праведных — навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благочестивых Своих».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в наказании»; греческое слово может обозначать воспитание, исправление, вразумление или наказание.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: φείσεται
  choice: пощадит
  rationale: Передаёт конкретный смысл удержания от полного наказания и хорошо сочетается с последующим упоминанием исправляющего вразумления.
- source_word: Κύριος
  choice: Господь
  rationale: Естественная передача греческого божественного титула κύριος в данном контексте.
- source_word: τῶν ὁσίων αὐτοῦ
  choice: верных Ему
  rationale: ὅσιοι здесь обозначает благочестивых, хранящих верность Богу; формулировка избегает смешения с ἅγιοι и естественно звучит по-русски.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: их проступки
  rationale: παράπτωμα указывает на нравственные падения или прегрешения; «проступки» сохраняет эту конкретность без чрезмерного усиления.
- source_word: ἐξαλείψει
  choice: изгладит
  rationale: Сохраняет образ полного стирания или устранения проступков и соответствует возвышенному, но современному русскому регистру.
- source_word: ἐν παιδείᾳ
  choice: посредством вразумления
  rationale: Передаёт вероятный инструментальный смысл ἐν и исправительно-воспитательный оттенок παιδεία, не сводя его только к карательному наказанию.
- source_word: ἡ ζωὴ τῶν δικαίων
  choice: жизнь праведных
  rationale: Прямая и естественная передача выражения без добавления отсутствующего в греческом уточнения.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Кратко и естественно выражает неограниченную продолжительность жизни в данном контексте.
theological_decisions:
- issue: Соотношение милости и вразумления
  choice: Божье щажение соединено с устранением проступков посредством исправляющего вразумления.
  alternative: Вразумление можно понимать как сферу, в которой изглаживаются проступки, либо преимущественно как карающее наказание.
  rationale: Синтаксис тесно связывает щажение с изглаживанием проступков ἐν παιδείᾳ. Перевод сохраняет напряжение между милостью и исправлением, не утверждая освобождения от всякого взыскания.
- issue: Значение ὅσιοι
  choice: верные Ему
  alternative: благочестивые; святые Его
  rationale: В Псалмах Соломона слово обозначает общину преданных Богу людей. «Верные Ему» подчёркивает заветную преданность и не смешивает ὅσιοι с обычным обозначением «святых» через ἅγιοι.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Ибо», «изгладит» и «навеки» сохраняют достоинство поэтического текста, оставаясь понятными современному читателю.
