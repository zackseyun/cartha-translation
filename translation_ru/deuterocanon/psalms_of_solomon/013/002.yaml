  text: The arm of the Lord saved us from the sword passing through[b][a], from famine and the death of sinners.
translation:
  language: ru
  text: Мышца Господа спасла нас от проходящего меча[a], от голода и смерти грешников[b].
  philosophy: optimal-equivalence
  footnotes:
