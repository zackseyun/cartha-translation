lexical_decisions:
- source_word: βραχίων
  choice: мышца
  rationale: Сохранён конкретный библейский образ руки как выражения спасающей силы Господа; «мышца Господа» — узнаваемое и достойное выражение в русской библейской речи.
- source_word: Κυρίου
  choice: Господа
  rationale: Передаёт κύριος как божественный титул без внесения в греческий текст особого написания, связанного с передачей еврейского имени Бога.
- source_word: ἔσωσεν
  choice: спасла
  rationale: Прямо передаёт аорист глагола σῴζω и сохраняет религиозный смысл Божьего избавления.
- source_word: ῥομφαίας
  choice: меча
  rationale: Стандартный и естественный русский эквивалент названия большого клинкового оружия; родительный падеж обусловлен предлогом ἀπό.
- source_word: διαπορευομένης
  choice: проходящего повсюду
  rationale: Причастие передаёт движение через некоторое пространство. «Повсюду» делает выражение естественным по-русски, не устраняя образ распространяющейся угрозы; более буквальный вариант отмечен в сноске.
- source_word: λιμοῦ
  choice: голода
  rationale: В перечне общих бедствий слово обозначает массовый голод, а не только индивидуальное чувство голода.
- source_word: θανάτου
  choice: смерти
  rationale: Прямой эквивалент, сохраняющий точность и силу греческого существительного.
- source_word: ἁμαρτωλῶν
  choice: грешников
  rationale: Родительный падеж прозрачно сохраняет неуточнённую связь между «смертью» и «грешниками», не разрешая неоднозначность греческой конструкции.
theological_decisions:
- issue: Связь родительного падежа в θανάτου ἁμαρτωλῶν
  choice: смерти грешников
  alternative: смерти для грешников; смерти, причинённой грешниками
  rationale: Греческий родительный допускает несколько смысловых отношений. Основной текст сохраняет наиболее формально близкую и столь же неоднозначную конструкцию, а возможные истолкования приводятся в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Образ «мышцы Господа» сохранён как намеренная метафора; синтаксис сделан понятным, при этом неоднозначность заключительного родительного оборота не устранена.
