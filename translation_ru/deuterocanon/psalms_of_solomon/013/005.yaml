  text: For the destruction of the sinner is dreadful[a], and none of all these things will touch the righteous.
translation:
  language: ru
  text: Ибо страшна гибель грешника, а праведника не коснётся ничто из всего этого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεινή
  choice: страшна
  rationale: Передаёт тяжёлый, внушающий ужас характер гибели и естественно звучит в современном литературном русском языке.
- source_word: καταστροφή
  choice: гибель
  rationale: Выражает окончательное бедствие и разорение грешника, не сужая значение до военного поражения или физического разрушения.
- source_word: ἁμαρτωλοῦ
  choice: грешника
  rationale: Прямо и идиоматично передаёт субстантивированное существительное в единственном числе.
- source_word: ἅψεται
  choice: не коснётся
  rationale: Сохраняет конкретный образ греческого глагола и естественно обозначает, что перечисленные бедствия не постигнут праведника.
- source_word: δικαίου
  choice: праведника
  rationale: Передаёт родительный падеж единственного числа и сохраняет обобщённое обозначение нравственной категории.
- source_word: οὐδὲν ἐκ πάντων τούτων
  choice: ни одно из всего этого
  rationale: 'Сохраняет усиленную всеохватность πάντων: праведника не коснётся ни одно из ранее названных бедствий.'
theological_decisions:
- issue: Характер обещания о праведнике
  choice: 'Сохранено безоговорочное утверждение текста: перечисленные бедствия не коснутся праведника.'
  alternative: Ослабить утверждение формулировкой «не причинит окончательного вреда».
  rationale: Греческий текст прямо говорит οὐχ ἅψεται и не уточняет, что речь лишь об окончательном или духовном вреде; такое уточнение было бы толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «страшна гибель» сохраняет риторический акцент оригинала, оставаясь естественной по-русски.
