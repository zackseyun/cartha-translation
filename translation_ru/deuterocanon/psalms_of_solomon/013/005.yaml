  naturalness: 'Фраза «ни одно из всего этого» возможна, но звучит менее естественно и несколько неопределённо: «одно» обычно предполагает явно названные исчисляемые предметы. «Ничто из всего этого» — обычная современная литературная передача и точнее соответствует οὐδὲν.'
