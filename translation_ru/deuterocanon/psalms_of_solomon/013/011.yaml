lexical_decisions:
- source_word: ὁσίους
  choice: благочестивыми
  rationale: Передаёт нравственно-религиозный смысл ὅσιος и его функцию как обозначения благочестивых людей, не смешивая его с ἅγιος и не привнося позднейших оттенков слова «святые».
- source_word: ἔλεος
  choice: милость
  rationale: Прямой и естественный библейский эквивалент, сохранённый в обоих параллельных членах стиха.
- source_word: Κυρίου
  choice: Господа
  rationale: Обычная библейская передача κύριος применительно к Богу; родительный падеж естественно соответствует греческой конструкции.
- source_word: φοβουμένους
  choice: боящимися Его
  rationale: Сохраняет сильную библейскую формулу страха Божьего, включающую благоговение, но не сводимую к более мягкому «почитающим».
theological_decisions:
- issue: Следует ли смягчать язык страха перед Богом
  choice: боящимися Его
  alternative: благоговеющими перед Ним
  rationale: Греческое φοβουμένους сохраняет традиционное библейское понятие страха Божьего. Буквальная формула удерживает присущее ему богословское напряжение.
- issue: Как передать ὅσιοι как обозначение религиозно верных людей
  choice: благочестивые
  alternative: святые
  rationale: «Благочестивые» сохраняет отличие ὅσιοι от ἅγιοι и не создаёт ненужной связи с позднейшим церковным титулом.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Параллельная конструкция и двукратное упоминание милости сохранены; тире помогают естественно оформить безглагольные предложения.
