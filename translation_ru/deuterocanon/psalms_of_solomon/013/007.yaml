base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/007.yaml
  text: A righteous man is disciplined in secret[c][b][a], so that the sinner may not gloat over the righteous man.
translation:
  language: ru
  text: Праведника вразумляют втайне[a], чтобы грешник не злорадствовал[b] над праведником.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сдержанно» или «с умеренностью».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не торжествовал» или «не радовался над» праведником.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν περιστολῇ
  choice: втайне
  rationale: Здесь περιστολή допускает значение укрытия, сокрытия. Целевая часть стиха — чтобы грешник не злорадствовал — указывает на то, что вразумление праведника скрыто от постороннего взгляда. Значение «сдержанно, умеренно» сохранено в сноске как реальная лексическая альтернатива.
- source_word: παιδεύεται
  choice: вразумляют
  rationale: Глагол обозначает воспитательное исправление или наказующее наставление. Русское «вразумляют» сохраняет исправительную направленность и не сводит действие ни к простому обучению, ни исключительно к карательному наказанию. Безличная конструкция естественно передаёт греческий пассив, не называя действующего лица.
- source_word: δίκαιος
  choice: праведника / праведником
  rationale: Мужской род и единственное число сохранены; форма имеет обобщающий, типический смысл. Повтор существительного удерживает явное противопоставление праведника и грешника.
- source_word: ἐπιχαρῇ
  choice: не злорадствовал
  rationale: Составной глагол выражает радость по поводу чужой беды или торжество над другим. «Злорадствовать над» естественно передаёт враждебный оттенок контекста.
- source_word: ὁ ἁμαρτωλός
  choice: грешник
  rationale: Определённая форма передана как обобщённое обозначение нравственного типа, параллельное слову «праведник».
theological_decisions:
- issue: Обобщающее мужское единственное число δίκαιος
  choice: праведник
  alternative: праведный человек / праведный
  rationale: Греческая форма грамматически мужского рода и в единственном числе, но употреблена обобщённо. «Праведник» точно и естественно сохраняет форму и традиционное нравственное противопоставление.
- issue: Характер вразумления праведника
  choice: вразумляют втайне
  alternative: наказывают сдержанно / подвергают умеренному взысканию
  rationale: 'Текст не объясняет, почему праведник нуждается во вразумлении, и не отождествляет его с грешником. Перевод сохраняет напряжение: праведник подвергается исправляющему воздействию, но оно сокрыто, чтобы грешник не получил повода злорадствовать.'
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Безличное «вразумляют» звучит естественнее тяжёлой пассивной конструкции и не вводит в текст явно названного деятеля. Синтаксический повтор слова «праведник» сохранён вслед за греческим оригиналом.
