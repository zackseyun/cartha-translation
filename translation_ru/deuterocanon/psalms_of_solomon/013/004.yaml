  text: The ungodly was troubled because of his transgressions[b][a], lest he be taken away with sinners.
translation:
  language: ru
  text: 'Нечестивец пришёл в смятение из-за своих прегрешений: как бы его не увлекли[a][b] вместе с грешниками.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не тогда, когда его увлекут вместе с грешниками». Греческий оборот μὴ ὅτε συμπαραληφθῇ синтаксически труден; в основном тексте он понят как выражение опасения: «как бы его не увлекли».'
    reason: alternative_reading
  - marker: b
    text: «Увлекли» можно также перевести как «унесли» или «взяли вместе с другими»; речь идёт об общей участи с грешниками.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: пришёл в смятение
  rationale: Пассивная форма ταράσσω обозначает потрясение, тревогу или внутреннее смятение. Выражение сохраняет широту значения и естественно звучит по-русски.
- source_word: ὁ ἀσεβής
  choice: нечестивец
  rationale: ἀσεβής указывает на человека, чуждого благочестию и почтению к Богу. «Нечестивец» передаёт религиозно-нравственный оттенок точнее, чем более общее «злодей».
- source_word: διὰ παραπτώματα αὐτοῦ
  choice: из-за своих прегрешений
  rationale: διά с винительным падежом имеет причинное значение. παραπτώματα обозначает нравственные проступки или нарушения; «прегрешения» сохраняет серьёзный библейский регистр, не сводя смысл к юридическим преступлениям.
- source_word: μὴ ὅτε συμπαραληφθῇ
  choice: как бы не быть увлечённым
  rationale: Греческая конструкция синтаксически трудна и сжата. Основной текст понимает μὴ превентивно, а συμπαραληφθῇ — как совместное увлечение или унесение на суд; безличный инфинитивный оборот по-русски сохраняет сжатость исходной фразы.
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: вместе с грешниками
  rationale: Оборот обозначает участие в общей участи. «Вместе с» естественно подчёркивает совместность, заложенную также в приставке συμ- глагола.
theological_decisions:
- issue: Связь смятения нечестивца с возможным общим судом над грешниками
  choice: 'Сохранено как опасение: «как бы не быть увлечённым»'
  alternative: «не тогда, когда он будет увлечён вместе с грешниками»
  rationale: Превентивное понимание даёт наиболее связный смысл, но синтаксис μὴ ὅτε допускает и временное прочтение; альтернативу поэтому следует сохранить в примечании, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Нечестивец» и «прегрешения» сохраняют религиозно-нравственную окраску, а тире передаёт сжатый и несколько неровный переход греческого текста, не сглаживая его неоднозначность.
