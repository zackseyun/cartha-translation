base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/019.yaml
  text: For the dreams that troubled them foretold this[b][a], so that they might not perish without knowing why they were suffering.
translation:
  language: ru
  text: Ибо сны, встревожившие их, заранее возвестили об этом[a], чтобы они не погибли, не зная, из-за чего терпят бедствие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заранее предупредили об этом»; греческий глагол может означать предварительное извещение или предостережение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из-за чего они терпят зло»; возможно также: «почему они страдают».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ γὰρ ὄνειροι
  choice: Ибо сны
  rationale: Множественное ὄνειροι прямо означает «сны»; γάρ связывает стих с предшествующим объяснением.
- source_word: θορυβήσαντες αὐτοὺς
  choice: встревожившие их
  rationale: Причастие передаёт вызванное снами смятение и тревогу; русский оборот сохраняет его форму и эмоциональную силу.
- source_word: τοῦτο προεμήνυσαν
  choice: заранее возвестили им об этом[a]
  rationale: προμηνύω обозначает предварительное извещение, предсказание или предостережение. «Заранее возвестили» сохраняет временную приставочную семантику; «им» естественно указывает адресатов сообщения, подразумеваемых контекстом.
- source_word: ἵνα μὴ ... ἀπόλωνται
  choice: чтобы они не погибли
  rationale: ἵνα с сослагательным наклонением естественнее всего выражает цель; ἀπόλωνται передано литературным «погибли».
- source_word: ἀγνοοῦντες διʼ ὃ
  choice: не зная, за что
  rationale: Причастие обозначает состояние неведения, а διʼ ὃ — причину постигшего их страдания. «За что» в данном контексте передаёт причину как основание кары, не уточняя её сверх текста.
- source_word: κακῶς πάσχουσιν
  choice: терпят бедствие[b]
  rationale: Сочетание πάσχω с κακῶς означает тяжело страдать, претерпевать зло или бедствие. «Терпят бедствие» звучит естественно и сохраняет отрицательную силу κακῶς.
theological_decisions:
- issue: Назначение зловещих снов
  choice: Сны представлены как предварительное извещение, данное с целью, чтобы страдающие не погибли в неведении о причине бедствия.
  alternative: 'ἵνα можно слабее понять как указание на результат: сны привели к тому, что они не погибли, не зная причины.'
  rationale: В данном контексте ἵνα естественно выражает цель. Перевод сохраняет напряжение между суровым бедствием и предварительным откровением его причины.
- issue: Причина страдания в выражении διʼ ὃ
  choice: «за что терпят бедствие»
  alternative: «почему страдают» или буквально «из-за чего терпят зло»
  rationale: «За что» уместно в контексте кары и передаёт причинную связь, однако сноска сохраняет более нейтральную возможность понимания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет причинное γάρ, причастную конструкцию и целевое значение ἵνα, оставаясь понятным обычному читателю.
