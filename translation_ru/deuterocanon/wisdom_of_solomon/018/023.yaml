  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/023.yaml
  text: For when heaps of dead had already fallen one upon another[a], he stood in the midst and checked the wrath, and cut off the way to the living.
translation:
  language: ru
  text: Ибо, когда мёртвые уже лежали грудами, один на другом, он встал между мёртвыми и живыми, остановил гнев и преградил ему путь к живым.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωρηδόν
  choice: грудами
  rationale: Наречие обозначает скопление тел в грудах; этот образ естественно передаётся творительным наречным оборотом.
- source_word: ἤδη πεπτωκότων
  choice: уже лежали
  rationale: Перфектное причастие описывает наступившее в результате падения состояние; «уже лежали» ясно и естественно передаёт это состояние мёртвых тел.
- source_word: ἐπʼ ἀλλήλων
  choice: один на другом
  rationale: Сохраняет зримый образ тел, лежащих друг на друге, и уточняет значение слова «грудами».
- source_word: μεταξὺ στὰς
  choice: он встал между ними
  rationale: Передаёт занятую посредине позицию между мёртвыми и живыми; местоимение не называет подразумеваемого в греческом субъекта по имени.
- source_word: ἀνέκοψεν
  choice: остановил
  rationale: Глагол означает остановить или удержать дальнейшее действие; современное «остановил» ясно выражает прекращение гнева.
- source_word: τὴν ὀργήν
  choice: гнев
  rationale: В контексте речь идёт о карающем Божьем гневе; слово сохраняет богословскую весомость без пояснительной вставки.
- source_word: διέσχισεν
  choice: перерезал
  rationale: Сохраняет сильный пространственный образ рассечения или пресечения пути, не сводя выражение к отвлечённому «прекратил».
- source_word: τὴν πρὸς τοὺς ζῶντας ὁδόν
  choice: ему путь к живым
  rationale: Сохраняет метафору пути, по которому гнев направлялся к ещё живым; местоимение «ему» делает связь в русском предложении естественной.
theological_decisions:
- issue: Подразумеваемый субъект мужского рода
  choice: Сохранить местоимение «он», не называя Аарона.
  alternative: Вставить имя «Аарон» для ясности.
  rationale: В греческом имя отсутствует и восстанавливается из ближайшего контекста; местоимение сохраняет устройство исходного текста.
- issue: Смысл слова ὀργή
  choice: Передать как «гнев».
  alternative: «ярость» или пояснительное «Божья кара»
  rationale: «Гнев» сохраняет значение Божьего суда, не добавляя отсутствующего в стихе определения и не усиливая эмоциональную окраску сверх источника.
- issue: Образ пути к живым
  choice: 'Сохранить олицетворённый образ: «перерезал ему путь к живым».'
  alternative: 'Передать результат отвлечённо: «остановил бедствие, не дав ему поразить живых».'
  rationale: Греческий текст представляет продвижение гнева как путь; буквальный образ сохраняет поэтическое и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис сохраняет последовательность греческих образов; архаизмы и конфессионально окрашенные пояснения не вводятся.
