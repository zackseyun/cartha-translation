base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/024.yaml
  text: For on the full-length robe was the whole world[a], and the glory of the fathers was on the engraving of the four-rowed stones[b], and your majesty was on the diadem upon his head.
translation:
  language: ru
  text: Ибо на его одеянии до пят[a] был весь мир, слава отцов — на гравировке камней, расположенных четырьмя рядами[b], а Твоё величие — на диадеме на его голове.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на длинном одеянии». Буквально: «на одеянии, доходящем до ног».'
    reason: lexical_alternative
  - marker: b
    text: Это сжатое греческое выражение, вероятно, отсылает к нагруднику первосвященника с камнями, расположенными в четыре ряда.
    reason: cultural_note
lexical_decisions:
- source_word: ποδήρους ἐνδύματος
  choice: длинном одеянии
  rationale: ποδήρης обозначает одеяние, доходящее до ступней. Выражение «длинное одеяние» естественно по-русски и сохраняет образ первосвященнического облачения; более буквальный вариант дан в сноске.
- source_word: ὅλος ὁ κόσμος
  choice: весь мир
  rationale: κόσμος здесь имеет широкий смысл мира или миропорядка, символически представленного на одеянии. «Весь мир» сохраняет этот смысл, не усиливая его толкованием «всё творение».
- source_word: πατέρων δόξα
  choice: слава отцов
  rationale: Буквальная и возвышенная передача, сохраняющая открытым вопрос, подразумеваются ли достоинство предков, их память или их символическое представление. Слово «патриархи» отсутствует в греческом тексте.
- source_word: ἐπὶ τετραστίχου λίθου γλυφῆς
  choice: на резьбе камней, расположенных в четыре ряда
  rationale: Сжатое греческое выражение указывает на резные камни нагрудника, размещённые четырьмя рядами. Русская формулировка передаёт предметный образ без добавления имён, прямо не названных в тексте.
- source_word: μεγαλοσύνη σου
  choice: Твоё величие
  rationale: μεγαλοσύνη означает величие или величественность. «Величие» естественно в обращении к Богу и сохраняет возвышенный регистр.
- source_word: διάδημα
  choice: диадема
  rationale: «Диадема» точно сохраняет особое наименование головной повязки и её царственные ассоциации, тогда как «венец» было бы более общим словом.
theological_decisions:
- issue: Символическое описание первосвященнических одежд
  choice: Сохранено утверждение, что на одеждах первосвященника были представлены весь мир, слава отцов и Божье величие, без развёрнутого объяснения символов.
  alternative: Прямо назвать нагрудник и головной убор из Исхода 28 либо передать κόσμος как «вселенная», усилив космологическое толкование.
  rationale: Сам стих предполагает связь с первосвященническим облачением, но не поясняет её прямо. Перевод сохраняет образы и богословское напряжение, не подменяя текст толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, культовым регистром. Параллельное построение трёх частей сохранено с помощью тире; местоимение «Твоё» написано с прописной буквы как обращение к Богу.
