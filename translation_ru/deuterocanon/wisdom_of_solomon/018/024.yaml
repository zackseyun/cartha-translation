  - severity: low
    issue: «На диадеме у него на голове» стилистически тяжеловесно.
    rationale: «На диадеме на его голове» сохраняет исходное ἐπὶ διαδήματος κεφαλῆς αὐτοῦ и звучит по-русски естественнее.
