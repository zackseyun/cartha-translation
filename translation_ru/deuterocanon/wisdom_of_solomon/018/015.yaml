lexical_decisions:
- source_word: ὁ παντοδύναμός σου λόγος
  choice: Твоё всемогущее слово
  rationale: «Всемогущее» естественно передаёт παντοδύναμος, а строчная буква в слове «слово» сохраняет обычное значение λόγος и не навязывает позднейшее христологическое прочтение.
- source_word: ἀπʼ οὐρανῶν
  choice: с небес
  rationale: Сохраняет множественное число греческой формы и при этом звучит естественно и возвышенно по-русски.
- source_word: ἐκ θρόνων βασιλείων
  choice: от царских престолов
  rationale: Передаёт как царственный образ, так и грамматическое множественное число θρόνων.
- source_word: ἀπότομος
  choice: суровый
  rationale: В данном воинском контексте передаёт строгость и беспощадную решительность образа, не сужая значение до буквального «резкий» и не усиливая его до «безжалостный».
- source_word: πολεμιστής
  choice: воин
  rationale: Естественный русский эквивалент, сохраняющий возвышенный воинский образ.
- source_word: εἰς μέσον
  choice: в самую середину
  rationale: Ясно и выразительно передаёт направленное движение внутрь, в средоточие земли.
- source_word: τῆς ὀλεθρίας γῆς
  choice: обречённой земли
  rationale: В контексте суда ὀλεθρία указывает на землю, обречённую на гибель; этот вариант сохраняет смысл, не превращая землю в источник разрушения.
- source_word: ἥλατο
  choice: низринулось
  rationale: Передаёт стремительное движение сверху вниз и соответствует возвышенному регистру; образ внезапного броска сохраняется.
theological_decisions:
- issue: Следует ли оформлять λόγος как личное имя, подчёркивая христологическое прочтение
  choice: «слово» со строчной буквы
  alternative: «Слово» с прописной буквы
  rationale: Непосредственный контекст олицетворяет действенное Божье слово, однако сам греческий текст не требует однозначного личностного или христологического отождествления. Строчная буква сохраняет эту богословскую открытость, а возможное иное прочтение отмечено в сноске.
- issue: Как передать суровость образа Божьего суда
  choice: «суровый воин»
  alternative: «неумолимый воин»
  rationale: «Суровый» сохраняет грозную воинскую образность и широту значения ἀπότομος, тогда как «неумолимый» сильнее фиксирует психологическое качество, прямо не выраженное словом.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным регистром. Тире выделяют приложение «суровый воин», непосредственно отражая греческую конструкцию без сравнительного «как». Все маркеры сносок присутствуют в основном тексте.
