  text: But the discordant cry of enemies echoed back[a], and the pitiful lament for children being mourned was carried abroad.
translation:
  language: ru
  text: Но в ответ раздавался нестройный вопль врагов, и повсюду разносился жалобный плач по оплакиваемым детям.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντήχει
  choice: в ответ раздавался
  rationale: Глагол обозначает ответное звучание или отзвук; сочетание сохраняет этот оттенок и естественно звучит по-русски.
- source_word: ἀσύμφωνος
  choice: нестройный
  rationale: Передаёт буквальную идею несогласованного, лишённого гармонии звучания и уместно описывает общий вопль.
- source_word: ἐχθρῶν
  choice: врагов
  rationale: Родительный падеж указывает, кому принадлежал вопль; контекстуально речь идёт о врагах Божьего народа, но перевод не уточняет их сверх текста стиха.
- source_word: ἡ βοή
  choice: вопль
  rationale: В контексте смерти и скорби это слово точнее передаёт громкий крик отчаяния, чем нейтральное «крик» или воинственное «клич».
- source_word: οἰκτρά
  choice: жалобный
  rationale: Средний род множественного числа допускает субстантивное или наречное понимание; по-русски значение естественно выражается определением к «плачу».
- source_word: διεφέρετο
  choice: повсюду разносился
  rationale: Имперфект медиально-пассивной формы рисует продолжающееся распространение звука; «разносился» сохраняет образ слышимого плача, а «повсюду» передаёт движение из места в место.
- source_word: θρηνουμένων
  choice: оплакиваемым
  rationale: 'Форма грамматически допускает пассивное понимание при παίδων: дети являются предметом оплакивания, а не теми, кто плачет.'
- source_word: παίδων
  choice: детям
  rationale: Сохраняется широкое значение «дети»; хотя контекст говорит о первенцах, сам стих не употребляет более узкого обозначения.
theological_decisions:
- issue: Следует ли уточнять, что речь идёт о первенцах
  choice: детям
  alternative: первенцам / детям-первенцам
  rationale: Контекст главы связан с гибелью египетских первенцев, однако παίδων означает здесь просто «детей». Перевод не вносит контекстуальное уточнение в основной текст.
- issue: Кто совершает действие θρηνουμένων
  choice: дети, которых оплакивают
  alternative: плачущие дети
  rationale: 'Согласование и контекст поддерживают пассивное понимание причастия: умерших детей оплакивают. Это также сохраняет связь со смертью первенцев в ближайшем контексте.'
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. «Нестройный вопль» сохраняет звуковой образ ἀσύμφωνος, а параллельные формы «раздавался / разносился» воспроизводят слуховую выразительность греческой строки без архаизации.
