  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/018.yaml
  text: and another[a], cast down elsewhere, half-dead[b], made known the cause for which he was dying.
translation:
  language: ru
  text: А другой, поверженный[a] в ином месте, полумёртвый, открывал причину, по которой умирал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брошенный», «отброшенный».'
    reason: Греческое причастие буквально обозначает того, кого бросили или швырнули; «поверженный» естественно передаёт результат этого действия, не уточняя его способ.
lexical_decisions:
- source_word: ἀλλαχῇ
  choice: в ином месте
  rationale: Наречие указывает на иное место по сравнению с предшествующим случаем; этот перевод естественно и ясно сохраняет пространственное противопоставление.
- source_word: ῥιφεὶς
  choice: поверженный
  rationale: Страдательное причастие передаёт образ человека, которого бросило или повергло наземь, не уточняя действующее лицо и не добавляя отсутствующую в греческом указание на удар.
- source_word: ἡμίθνητος
  choice: полумёртвый
  rationale: 'Прямой и выразительный эквивалент сложного прилагательного: человек ещё жив, но близок к смерти.'
- source_word: διʼ ἣν ... αἰτίαν
  choice: причину, по которой
  rationale: Формулировка сохраняет прямую связь между раскрываемой причиной и происходящим умиранием.
- source_word: ἔθνησκεν
  choice: умирал
  rationale: Имперфект изображает продолжающийся процесс, а не уже завершившуюся смерть.
- source_word: ἐνεφάνιζεν
  choice: открывал
  rationale: Глагол означает делать явным, обнаруживать или сообщать; форма несовершенного вида согласуется с имперфектом и сохраняет развёртывающуюся сцену.
theological_decisions:
- issue: Временной аспект сообщения умирающего
  choice: «умирал» — продолжающийся процесс
  alternative: «умер» — завершённое событие
  rationale: Имперфект ἔθνησκεν показывает, что полумёртвый человек ещё находился при смерти, когда открывал её причину. Это грамматическое решение сохраняет напряжение повествовательной сцены.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис следует последовательности греческого текста, но остаётся естественным; повтор смыслов «полумёртвый — умирал» сохранён как намеренная выразительная особенность оригинала.
