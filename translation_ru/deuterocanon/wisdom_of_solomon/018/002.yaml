lexical_decisions:
- source_word: οἱ οὐ βλάπτοντιν
  choice: те… им не причиняли вреда
  rationale: Переданная греческая форма βλάπτοντιν синтаксически затруднительна. Активное значение βλάπτω («причинять вред») сохранено без превращения формы в невыраженный греческим пассив; конструкция по-русски передаёт наиболее вероятный контекстуальный смысл.
- source_word: προπολεμημένοι
  choice: с кем они прежде враждовали
  rationale: Причастие обозначает предшествующее состояние войны или вражды; такой перевод сохраняет временное значение προ- и не добавляет отсутствующего в греческом уточнения о том, кто первым напал.
- source_word: εὐχαριστοῦσιν
  choice: благодарили
  rationale: Естественная русская передача глагола со значением благодарности; прошедшее время согласовано с повествовательным контекстом.
- source_word: τὸ διενεχθῆναι
  choice: прежней вражды
  rationale: Субстантивированный инфинитив от διαφέρω здесь указывает на разлад, отчуждение или враждебный конфликт, а не просто на отвлечённое различие.
- source_word: χάριν ἐδέοντο
  choice: просили о милости
  rationale: Передаёт буквальную идею просьбы о χάρις — благосклонности или милости — не сужая её без необходимости до формального прощения.
theological_decisions:
- issue: Синтаксически трудная и, вероятно, повреждённая формулировка οἱ οὐ βλάπτοντιν προπολεμημένοι
  choice: 'Передать контекстуально вероятный смысл: прежде враждовавшие теперь благодарят за отсутствие причинённого им вреда'
  alternative: «потому что не причиняющие вреда, прежде подвергшиеся нападению, благодарят»
  rationale: Избранный вариант даёт связный смысл в контексте, но сноска прямо сохраняет неопределённость греческого свидетельства и не выдаёт реконструкцию за бесспорный текст.
- issue: Значение χάριν ἐδέοντο при τὸ διενεχθῆναι
  choice: «просили о милости из-за прежней вражды»
  alternative: «просили прощения за свою враждебность»
  rationale: «Милость» сохраняет широту χάρις и не вводит более определённое понятие прощения, тогда как «вражда» естественно выражает конфликтный смысл инфинитива.
