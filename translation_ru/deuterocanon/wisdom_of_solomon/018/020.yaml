base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/020.yaml
  text: But the trial of death also touched the righteous[a], and a destruction of the multitude occurred in the wilderness[b]; yet the wrath did not remain for long.
translation:
  language: ru
  text: Но и праведных коснулось испытание смертью[a], и в пустыне произошло сокрушение множества[b]; однако гнев продолжался недолго.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опыт смерти»; или: «испытание со стороны смерти».'
    reason: Греческое πεῖρα может обозначать испытание, пробу или пережитый опыт, а связь с θανάτου допускает несколько близких способов передачи.
  - marker: b
    text: 'Или: «разгром множества»; или: «гибель множества».'
    reason: Греческое θραῦσις буквально связано с ломкой или сокрушением, но в данном контексте может обозначать тяжёлое поражение или гибель многих.
lexical_decisions:
- source_word: Ἥψατο
  choice: коснулось
  rationale: 'Сохраняет метафору греческого ἅπτομαι: смертельное испытание затронуло праведных, но формулировка сама по себе не означает их полного уничтожения.'
- source_word: δικαίων
  choice: праведных
  rationale: Субстантивированное прилагательное передаёт нравственно-религиозную категорию без добавочного уточнения.
- source_word: πεῖρα θανάτου
  choice: испытание смертью
  rationale: Передаёт πεῖρα как испытание или тяжёлый опыт и сохраняет сжатость выражения; творительный падеж допускает смысл испытания посредством смерти, не утверждая окончательной гибели праведных.
- source_word: θραῦσις
  choice: сокрушение
  rationale: Сохраняет образ ломки, сокрушения или разгрома, заложенный в θραῦσις, и соответствует контексту тяжёлого поражения народа.
- source_word: πλήθους
  choice: множества
  rationale: Передаёт коллективное значение πλῆθος и не сужает его до конкретно названной группы.
- source_word: ἐν ἐρήμῳ
  choice: в пустыне
  rationale: Естественное русское библейское обозначение места странствия Израиля.
- source_word: ὀργή
  choice: гнев
  rationale: Передаёт судебно-карательный оттенок ὀργή, не добавляя отсутствующего в греческом тексте притяжательного определения.
- source_word: οὐκ ἐπὶ πολὺ ἔμεινεν
  choice: продолжался недолго
  rationale: 'Естественно передаёт временной смысл: гнев не оставался и не длился долго.'
theological_decisions:
- issue: Следует ли прямо назвать гнев Божьим
  choice: гнев
  alternative: Божий гнев; Его гнев
  rationale: Контекст указывает на Божий гнев, однако в греческом тексте стоит только ἡ ὀργή без притяжательного определения; перевод не делает подразумеваемое явным.
- issue: Насколько сильно выразить воздействие смерти на праведных
  choice: праведных коснулось испытание смертью
  alternative: праведные испытали смерть; смерть поразила и праведных
  rationale: 'Формулировка сохраняет напряжение текста: смертельное бедствие затронуло праведных, но перевод не утверждает, что они были окончательно уничтожены наравне со всем поражённым множеством.'
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Синтаксис сохраняет параллельность греческих частей; «сокрушение множества» намеренно слегка возвышенно, чтобы удержать образность θραῦσις. Все сноски отмечены в основном тексте.
