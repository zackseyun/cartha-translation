revisions:
- from: И у всех разом, под единым приговором смерти, оказалось бесчисленное множество мёртвых; ведь живых не хватало даже для погребения, потому что в одно мгновение было истреблено самое почитаемое их потомство[a].
  to: Все разом, под единым приговором смерти, имели бесчисленное множество мёртвых; ведь живых не хватало даже, чтобы похоронить их, потому что в одно мгновение погибло их наиболее почитаемое потомство[a].
  rationale: Правка устраняет тяжеловесность синтаксиса и делает связь живых с погребением умерших явной. «Наиболее почитаемое потомство» сохраняет описательный характер греческого сравнительного выражения; сноска удерживает допустимую контекстуальную идентификацию с первенцами. «Погибло» передаёт результат διεφθάρη без дополнительного оттенка способа уничтожения.
