  source_fidelity: 'В целом смысл передан точно: общая внезапная гибель, невозможность живых похоронить умерших и уничтожение особо почитаемого потомства сохранены. «Под единым приговором смерти» — допустимое контекстуальное раскрытие трудного ἐν ἑνὶ ὀνόματι θανάτου, хотя оно несколько интерпретирует образ «одного имени смерти».'
