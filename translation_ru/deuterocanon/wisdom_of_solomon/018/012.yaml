base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/012.yaml
  text: And all together[a], under one sentence of death, they had countless dead; for the living were not even sufficient to bury them, since in a single moment their most honored offspring was destroyed.
translation:
  language: ru
  text: Все разом, под единым приговором смерти, имели бесчисленное множество мёртвых; ведь живых не хватало даже, чтобы похоронить их, потому что в одно мгновение погибло их наиболее почитаемое потомство[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их первенцы». Контекст отсылает к поражению первенцев в Египте, хотя греческий текст буквально говорит о «их наиболее почитаемом потомстве (или поколении)».'
    reason: Сохраняет контекстуально ясную отсылку, не подменяя ею более широкую формулировку греческого текста.
lexical_decisions:
- source_word: ὁμοθυμαδὸν δὲ πάντες
  choice: И у всех разом
  rationale: Передаёт одновременность общей беды, не приписывая людям согласованного намерения, которое в данном контексте не подразумевается.
- source_word: ἐν ἑνὶ ὀνόματι θανάτου
  choice: под единым приговором смерти
  rationale: Сохраняет образ единого определения смерти и передаёт общую для всех смертную участь; буквальное «под одним именем смерти» по-русски неясно.
- source_word: νεκροὺς εἶχον ἀναριθμήτους
  choice: оказалось бесчисленное множество мёртвых
  rationale: Естественно передаёт греческую конструкцию обладания и подчёркивает не поддающееся счёту число погибших.
- source_word: οὐδὲ γὰρ πρὸς τὸ θάψαι οἱ ζῶντες ἦσαν ἱκανοί
  choice: ведь живых не хватало даже для погребения
  rationale: Сохраняет противопоставление живых и мёртвых и выражает невозможность справиться с погребением.
- source_word: πρὸς μίαν ῥοπὴν
  choice: в одно мгновение
  rationale: Передаёт крайнюю внезапность события естественным современным русским выражением.
- source_word: ἡ ἐντιμοτέρα γένεσις αὐτῶν
  choice: самое почитаемое их потомство
  rationale: γένεσις здесь обозначает потомство или род, а ἐντιμοτέρα — его особую ценность и почёт. Контекстуально речь идёт о первенцах, но в самой фразе нет слова πρωτότοκος.
- source_word: διεφθάρη
  choice: было истреблено
  rationale: Пассивная форма и сильный глагол передают насильственную и катастрофическую гибель в контексте суда.
theological_decisions:
- issue: Следует ли прямо назвать погибших первенцами
  choice: самое почитаемое их потомство
  alternative: их первенцы
  rationale: Контекст явно отсылает к поражению египетских первенцев, однако греческий текст использует описательное выражение ἡ ἐντιμοτέρα γένεσις, а не прямое обозначение первенцев. Основной текст сохраняет эту формулировку, а примечание поясняет аллюзию.
- issue: Как понимать ἐν ἑνὶ ὀνόματι θανάτου
  choice: под единым приговором смерти
  alternative: одним видом смерти
  rationale: Греческое выражение допускает буквальное понимание через «имя/обозначение», но здесь указывает на единое определение смертной участи, постигшей всех. Вариант «вид смерти» возможен, однако несколько сужает образ.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис слегка перестроен ради естественности: греческое «все имели» передано как «у всех оказалось». Термины не привязаны к конфессиональной традиции; неоднозначность выражений об «имени смерти» и «почитаемом потомстве» сохранена и пояснена.'
