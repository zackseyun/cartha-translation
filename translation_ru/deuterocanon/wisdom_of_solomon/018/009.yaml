base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/009.yaml
  text: For the holy children of good men were secretly offering sacrifices[a], and in unity they established the divine law, that the holy ones would share alike in the same good things and dangers[c][b], while their fathers were already singing beforehand hymns of praise.
translation:
  language: ru
  text: Ибо благочестивые дети достойных людей тайно приносили жертвы[a] и единодушно установили божественный закон[b], чтобы святые одинаково разделяли и блага, и опасности, тогда как их отцы уже заранее воспевали хвалебные песни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «втайне». Греческое слово подчёркивает, что жертвоприношение совершалось скрытно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «закон божественности». Греческое выражение необычно и может обозначать закон, имеющий божественное происхождение или относящийся к Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυφῇ
  choice: тайно
  rationale: Наречное употребление передаёт скрытый характер жертвоприношения; «тайно» естественно и точно по-русски.
- source_word: ἐθυσίαζον
  choice: приносили жертвы
  rationale: Имперфект допускает длительное или повторявшееся действие, а выражение ясно сохраняет культовый смысл.
- source_word: ὅσιοι
  choice: благочестивые
  rationale: Здесь слово характеризует верность Богу и почтительность; «благочестивые» естественнее по-русски применительно к людям, чем буквальное «святые», и сохраняет отличие от τοὺς ἁγίους далее.
- source_word: παῖδες ἀγαθῶν
  choice: дети достойных отцов
  rationale: παῖδες означает детей или сыновей, а субстантивированное ἀγαθῶν — достойных людей; упоминание отцов далее поддерживает родовой смысл, хотя слово «отцов» здесь контекстуально восполнено.
- source_word: τὸν τῆς θειότητος νόμον
  choice: Божий закон
  rationale: Необычная конструкция буквально связана с божественностью; «Божий закон» ясно передаёт закон, относящийся к Богу, без тяжеловесного «закон божественности».
- source_word: ἐν ὁμονοίᾳ διέθεντο
  choice: единодушно установили
  rationale: ὁμόνοια обозначает согласие и единомыслие, а средний залог διατίθημι — совместное установление или принятие торжественного соглашения.
- source_word: μεταλήμψεσθαι
  choice: разделять
  rationale: Инфинитив выражает содержание принятого установления — совместное участие в общей доле.
- source_word: τῶν αὐτῶν ὁμοίως καὶ ἀγαθῶν καὶ κινδύνων
  choice: одинаково разделять и блага, и опасности
  rationale: Переданы равное участие и симметричное сочетание благоприятного с опасным; «блага» ближе к ἀγαθά, чем более толковательное «благословения».
- source_word: τοὺς ἁγίους
  choice: святым
  rationale: Форма сохраняет буквальное значение «святые» без добавления позднейшего конфессионального уточнения.
- source_word: πατέρων
  choice: их отцы
  rationale: В контексте естественно обозначает отцов или предков упомянутой общины; притяжательное местоимение проясняет связь.
- source_word: προαναμελπόντων αἴνους
  choice: уже заранее воспевали хвалу
  rationale: «Воспевали» передаёт музыкальный оттенок, προ- — предварительность, а αἴνους — хвалу или хвалебные песни.
theological_decisions:
- issue: Историческая принадлежность действующих лиц
  choice: Сохранить подразумеваемое указание на верных израильтян в пасхальную ночь без добавления этнонима.
  alternative: Прямо назвать их израильтянами или обобщённо перевести как праведников.
  rationale: Контекст Исхода устанавливает историческую сцену, но сам стих не содержит этнонима; перевод не должен ни скрывать контекст, ни добавлять отсутствующее обозначение.
- issue: Значение τοὺς ἁγίους
  choice: «святым»
  alternative: «народу святых» или «праведникам»
  rationale: Буквальное обозначение сохраняет сакральный и общинный смысл, не вводя более позднего технического толкования.
- issue: Характер τὸν τῆς θειότητος νόμον
  choice: «Божий закон» с примечанием о необычной греческой конструкции.
  alternative: «закон божественности»
  rationale: Основной текст остаётся понятным, а примечание сохраняет лексическую необычность и возможную смысловую напряжённость оригинала.
