base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/025.yaml
  text: The destroyer gave way before this man[a], and feared these things[c][b]; for the mere testing of wrath was sufficient.
translation:
  language: ru
  text: Губитель отступил перед ним[a], а они устрашились всего этого[b]; ведь одного лишь испытания гнева было достаточно[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот, кто губит»; традиционно это также понимают как «ангел-губитель», но слово «ангел» в греческом тексте отсутствует.'
    reason: alternative_reading
  - marker: b
    text: «Всего этого» передаёт греческое «эти вещи». Вероятно, речь идёт о священнических одеждах и памятных знаках из предыдущего стиха, однако отсылка не уточнена. Греческий глагол стоит во множественном числе, но его субъект не назван; «они» передаёт этот подразумеваемый субъект, не отождествляя его с губителем.
    reason: textual_and_cross_reference
  - marker: c
    text: «Испытание» можно также передать как «проба», «опыт» или «проверка» гнева; греческое выражение предельно сжато.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: перед ним
  rationale: Указательное местоимение отсылает к священнику, описанному в предыдущих стихах. Русское «перед ним» естественно сочетается с глаголом уступки и не добавляет имени.
- source_word: εἶξεν
  choice: отступил
  rationale: Глагол означает уступить, податься или дать дорогу. «Отступил» сохраняет образ губителя, вынужденного прекратить наступление.
- source_word: ὀλοθρεύων
  choice: губитель
  rationale: Субстантивированное причастие буквально означает «губящий». «Губитель» передаёт это без добавления отсутствующего в греческом слова «ангел».
- source_word: ταῦτα
  choice: всего этого
  rationale: Форма среднего рода множественного числа указывает на упомянутые ранее предметы или знаки, не называя их прямо. «Всего этого» сохраняет обобщённую и не вполне определённую отсылку.
- source_word: ἐφοβήθησαν
  choice: устрашился
  rationale: В переданном греческом тексте стоит форма множественного числа («устрашились»), хотя ближайший смысловой субъект — единственное число «губитель». Основной текст следует связному контексту, а морфологическая трудность отмечена в сноске.
- source_word: πεῖρα
  choice: испытание
  rationale: Слово может означать испытание, пробу, опыт или проверку. «Испытание» сохраняет сжатость и многозначность выражения.
- source_word: ὀργῆς
  choice: гнев
  rationale: В контексте Божьего суда «гнев» передаёт не только чувство, но и карающее действие.
- source_word: ἱκανή
  choice: было достаточно
  rationale: 'Предикативное прилагательное выражает достаточность: уже совершившееся проявление гнева не требовало продолжения.'
theological_decisions:
- issue: Кто назван ὀλοθρεύων
  choice: губитель
  alternative: ангел-губитель
  rationale: Контекст допускает понимание как ангела, несущего погибель, однако греческий текст прямо не называет его ангелом.
- issue: К чему относится ταῦτα
  choice: всего этого
  alternative: священнических одежд и памятных знаков из предыдущего стиха
  rationale: Предыдущий стих подсказывает вероятную отсылку, но сам текст данного стиха не перечисляет предметы заново, поэтому неоднозначность сохранена.
- issue: Согласование ἐφοβήθησαν
  choice: 'смысловое согласование с «губителем»: «устрашился»'
  alternative: 'буквальное множественное число: «устрашились»'
  rationale: Предоставленная форма глагола множественного числа грамматически не согласуется с ближайшим субъектом ὀλοθρεύων в единственном числе; контекст и консультационный перевод предполагают продолжение действия того же губителя. Текстуальная трудность вынесена в сноску.
