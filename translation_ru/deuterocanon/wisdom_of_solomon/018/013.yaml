base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/013.yaml
  text: For though they had disbelieved everything because of their sorceries[b][a], at the destruction of the firstborn they acknowledged that this people was God's son.
translation:
  language: ru
  text: Ибо хотя из-за своих чародейств[a] они ничему не верили, при гибели первенцев признали, что этот народ — сын Божий[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «магических искусств». Греческое слово здесь означает оккультные практики, связанные с Египтом.'
    reason: lexical_alternative
  - marker: b
    text: Здесь сыном Божьим назван весь народ Израиля как единое целое, а не отдельный человек.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπιστοῦντες
  choice: ничему не верили
  rationale: Глагол выражает неверие или отказ принять свидетельство; в сочетании с πάντα естественный русский эквивалент — «ничему не верили».
- source_word: φαρμακείας
  choice: чародейств
  rationale: В данном контексте слово обозначает оккультные магические практики Египта, а не врачевание.
- source_word: ὀλέθρῳ
  choice: гибели
  rationale: Передаёт катастрофическую смерть первенцев без добавления отсутствующего в тексте образа насилия; конструкция ἐπὶ τῷ обозначает обстоятельство, побудившее к признанию.
- source_word: πρωτοτόκων
  choice: первенцев
  rationale: Сохранено отсутствие притяжательного местоимения в греческом тексте; из контекста ясно, что речь идёт о египетских первенцах.
- source_word: ὡμολόγησαν
  choice: признали
  rationale: Глагол обозначает открытое признание того, что прежде отрицалось; «признали» естественно в повествовательном контексте и не привносит специально культового оттенка.
- source_word: θεοῦ υἱὸν
  choice: Сын Божий
  rationale: Сочетание передаёт предикативное определение Израиля как Божьего сына; единственное число сохранено.
- source_word: λαὸν
  choice: этот народ
  rationale: Указательное «этот» естественно обозначает уже известный из контекста народ Израиля, не меняя корпоративного смысла существительного.
theological_decisions:
- issue: Корпоративное именование Израиля сыном Божьим
  choice: этот народ — Сын Божий
  alternative: этот народ — один из сыновей Бога; этот народ — дети Божьи
  rationale: Греческий текст ставит λαόν и υἱόν в единственном числе и представляет весь народ как одного сына. Перевод сохраняет этот библейский образ, не превращая его ни в индивидуальный титул, ни во множественное «дети».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Уступительная конструкция «хотя…» естественно передаёт связь причастного оборота с последующим признанием; именная конструкция без связки сохраняет временную нейтральность греческого оборота.
