  text: And servant and master alike were punished with the same judgment[a], and the commoner suffered the same things as the king.
translation:
  language: ru
  text: И раб, и господин подверглись одинаковому наказанию[a], а простой человек перенёс то же, что и царь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одинаковому воздаянию». Греческое слово δίκη может означать наказание, воздаяние или суд.'
    reason: Сохранение смыслового диапазона δίκη и возможного судебного оттенка.
lexical_decisions:
- source_word: ὁμοία
  choice: одинаковому
  rationale: В параллели с τὰ αὐτά и при сопоставлении людей разного положения речь идёт о равной мере наказания, а не просто о сходстве.
- source_word: δίκη
  choice: наказанию
  rationale: В контексте казни египетских первенцев слово обозначает конкретную кару; возможный оттенок судебного воздаяния отмечен в сноске.
- source_word: δοῦλος
  choice: раб
  rationale: Прямо передаёт несвободный статус и сохраняет резкий социальный контраст с δεσπότης.
- source_word: δεσπότῃ
  choice: господин
  rationale: Естественная русская пара к слову «раб» в данном социальном контексте.
- source_word: κολασθείς
  choice: подверглись ... наказанию
  rationale: Передаёт страдательное значение причастия, а согласование во множественном числе естественно объединяет раба и господина, одинаково охваченных карой.
- source_word: δημότης
  choice: простой человек
  rationale: В противопоставлении царю обозначает человека без высокого общественного положения; этот вариант понятнее современному читателю, чем книжное «простолюдин».
- source_word: βασιλεῖ
  choice: царь
  rationale: Точно сохраняет царский титул и противопоставление рядовому человеку.
- source_word: τὰ αὐτὰ πάσχων
  choice: страдал так же
  rationale: Естественно по-русски выражает одинаковость пережитого, не добавляя отсутствующего в греческом понятия судьбы.
theological_decisions:
- issue: Передача социальных различий перед лицом суда
  choice: Сохранить слова «раб» и «господин»
  alternative: «слуга» и «господин»
  rationale: Греческая пара δοῦλος—δεσπότης подчёркивает крайние ступени общественной иерархии и то, что кара не сделала между ними различия; смягчение до «слуги» ослабило бы этот смысл.
- issue: Значение δίκη в контексте Божьего суда
  choice: «наказание» с указанием альтернативы в сноске
  alternative: «суд» или «воздаяние»
  rationale: Контекст требует конкретного результата суда — постигшей людей кары, однако более широкий судебный оттенок греческого слова не исключается и потому сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза построена симметрично и ясно. Союз «а» естественно вводит вторую параллельную пару, не выражая смыслового противопоставления сильнее, чем допускает контекст.
