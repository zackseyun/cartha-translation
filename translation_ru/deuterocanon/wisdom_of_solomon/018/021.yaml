base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/021.yaml
  text: For a blameless man hurried forward and fought in the front line[a], bringing the weapon of his own service—prayer and atonement by incense; he stood against the wrath and put an end to the disaster[b], showing that he is your servant.
translation:
  language: ru
  text: Ибо безупречный человек поспешил вперёд и сразился в первых рядах, принеся оружие своего служения — молитву и искупление посредством каждения[a]. Он противостал гневу и положил конец бедствию, показав, что он — Твой служитель[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молитву и умилостивление каждением». Греческое слово ἐξιλασμός в культовом контексте допускает несколько близких переводов.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое θεράπων означает человека, состоящего в почётном личном служении; возможно также: «Твой слуга».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπεύσας
  choice: поспешил вперёд
  rationale: Причастие аориста передаёт безотлагательное, стремительное вмешательство; добавление «вперёд» естественно связывает его с последующей воинской метафорой.
- source_word: ἀνὴρ ἄμεμπτος
  choice: безупречный муж
  rationale: Сохраняются мужской род, единственное число и характеристика человека, которому нельзя поставить в вину проступок; «муж» придаёт фразе уместную библейскую торжественность.
- source_word: προεμάχησεν
  choice: сразился в первых рядах
  rationale: Глагол содержит воинский образ выступления впереди других; перевод сохраняет метафору, не сводя её к общему «защитил».
- source_word: λειτουργίας
  choice: служения
  rationale: В контексте речь идёт о священном служении Аарона, однако само слово не развёрнуто в более узкий термин; «служение» сохраняет культовый оттенок и остаётся понятным.
- source_word: ὅπλον
  choice: оружие
  rationale: 'Сохраняется явная воинская метафора: молитва и каждение представлены как средство противостояния бедствию.'
- source_word: προσευχὴν καὶ θυμιάματος ἐξιλασμόν
  choice: молитву и умилостивление каждением
  rationale: «Умилостивление» передаёт культовый смысл ἐξιλασμός как действия, отвращающего гнев, а творительный оборот естественно выражает роль каждения как средства.
- source_word: ἀντέστη τῷ θυμῷ
  choice: противостал гневу
  rationale: Сохраняется сильный образ непосредственного противостояния; принадлежность гнева Богу не добавлена, поскольку в греческом тексте она лишь подразумевается контекстом.
- source_word: πέρας ἐπέθηκε τῇ συμφορᾷ
  choice: положил конец бедствию
  rationale: Естественный русский оборот точно передаёт прекращение постигшего народ несчастья.
- source_word: θεράπων
  choice: служитель
  rationale: Слово обозначает человека, состоящего в почётном личном служении; «служитель» звучит достойно и не смешивает его с обозначением раба.
theological_decisions:
- issue: Значение ἐξιλασμός в культовом контексте
  choice: умилостивление
  alternative: искупление; очищение
  rationale: Выбор передаёт действие священнослужителя, которым отвращается гнев, но сноска сохраняет более широкую смысловую возможность греческого культового термина и не определяет механизм действия точнее оригинала.
- issue: К кому относится θυμός
  choice: гнев без добавления обладателя
  alternative: гнев Божий
  rationale: По контексту подразумевается Божий карающий гнев, однако греческий текст прямо не добавляет «Божий», поэтому перевод сохраняет эту имплицитность.
- issue: Статус θεράπων
  choice: служитель
  alternative: слуга; преданный служитель
  rationale: Перевод сохраняет достоинство почётного служения Богу и не вносит оттенка рабского положения, характерного для другого греческого слова.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Воинская метафора оригинала сохранена последовательно: «сразился», «оружие», «противостал». Заглавная буква в «Твой» отражает обращение к Богу по принятой русской издательской традиции, не добавляя имени, отсутствующего в греческом тексте.'
