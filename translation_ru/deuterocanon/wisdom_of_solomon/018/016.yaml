translation:
  language: ru
  text: Неся Твоё непритворное повеление[a] — острый меч, он, встав, наполнил всё смертью; он касался неба[b], а на земле уже стоял.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нелицемерное повеление»; возможны также смысловые передачи «искреннее повеление» или «непреклонный приказ».'
    reason: lexical_alternative
  - marker: b
    text: 'Исполнитель суда изображён в космическом масштабе: он касается неба и стоит на земле, что подчёркивает всеохватность суда.'
    reason: cultural_note
lexical_decisions:
- source_word: ξίφος ὀξὺ … τὴν ἀνυπόκριτον ἐπιταγήν σου φέρων
  choice: неся Твоё нелицемерное повеление, словно острый меч
  rationale: Два винительных оборота передают повеление как острый меч, который несёт действующее лицо. Сравнительная формулировка по-русски ясно сохраняет воинский образ, не превращая меч в отдельный предмет.
- source_word: ἀνυπόκριτον
  choice: нелицемерное
  rationale: Слово означает отсутствие притворства или двуличия. Хотя сочетание с «повелением» необычно, оно сохраняет намеренно напряжённый образ греческого текста; более гладкое «непреложное» сильнее истолковывало бы смысл.
- source_word: ἐπιταγήν
  choice: повеление
  rationale: Передаёт властный приказ и соответствует возвышенному, но понятному современному русскому регистру.
- source_word: στὰς
  choice: встав
  rationale: Аористное причастие от ἵστημι обозначает занятие положения перед основным действием; краткое «встав» сохраняет последовательность и образ.
- source_word: ἐπλήρωσεν τὰ πάντα θανάτου
  choice: он наполнил всё смертью
  rationale: Буквально сохраняет всеохватность τὰ πάντα и резкую образность родительного θανάτου.
- source_word: οὐρανοῦ μὲν ἥπτετο
  choice: неба он касался
  rationale: ἅπτομαι здесь естественно передаётся как «касаться»; образ космического размаха сохранён без поясняющей вставки в основной текст.
- source_word: βέβηκει δʼ ἐπὶ γῆς
  choice: а на земле уже стоял
  rationale: Плюсквамперфектная форма от βαίνω указывает на уже достигнутое и сохраняющееся положение на земле. «Уже стоял» естественно выражает этот результат в русском языке.
theological_decisions:
- issue: Личностное изображение исполнителя Божьего суда
  choice: Сохранить мужской субъект и воинскую персонификацию повеления, не отождествляя исполнителя прямо ни с ангелом, ни с отдельным божественным Лицом.
  alternative: Назвать его ангелом-губителем или прямо определить как ипостасное Слово.
  rationale: В ближайшем контексте Божье слово изображено как воинственный исполнитель суда, но данный стих сам по себе не устанавливает более точной онтологической идентификации.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским ритмом. Необычное сочетание «нелицемерное повеление» намеренно сохранено как отражение греческой лексической напряжённости; пунктуация делает ясными образ меча и последовательность действий.
