base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/004.yaml
  text: For those men were worthy to be deprived of light and imprisoned in darkness[a], they who had kept your sons shut in, through whom the imperishable light of the law was about to be given to the age.
translation:
  language: ru
  text: Ведь они заслуживали быть лишёнными света и заключёнными во тьме — те, кто держал взаперти Твоих сынов, через которых непреходящий свет закона должен был быть дан миру[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на все времена». В греческом тексте буквально: «веку» (единственное число); это слово может иметь как временной, так и космический смысл.'
    reason: Сохраняется смысловая широта греческого τῷ αἰῶνι; основное чтение «миру» передаёт его космический смысл естественным русским выражением.
lexical_decisions:
- source_word: ἄξιοι
  choice: заслуживали
  rationale: В контексте суда слово выражает заслуженность наказания; современное русское «заслуживали» естественно передаёт этот смысл.
- source_word: στερηθῆναι φωτός
  choice: быть лишёнными света
  rationale: Пассивная конструкция сохраняет значение карательного лишения и связь с казнью тьмой.
- source_word: φυλακισθῆναι σκότει
  choice: заключёнными во тьме
  rationale: Передаёт тюремный образ φυλακίζω и подчёркивает воздаяние угнетателям.
- source_word: οἱ κατακλείστους φυλάξαντες
  choice: те, кто держал взаперти
  rationale: Естественно по-русски выражает длительное удержание в заточении, заложенное в сочетании κατακλείστους и φυλάξαντες.
- source_word: τοὺς υἱούς σου
  choice: Твоих сынов
  rationale: Сохраняет явно мужской образ греческого текста и обозначение Израиля как Божьих сынов.
- source_word: διʼ ὧν
  choice: через которых
  rationale: Ближайший грамматический антецедент — «Твоих сынов»; местоимение сохраняет личную отнесённость и значение посредства.
- source_word: ἤμελλεν ... δίδοσθαι
  choice: должен был быть дан
  rationale: Передаёт предстоящее или предназначенное действие без чрезмерного акцента на его непосредственной близости.
- source_word: τὸ ἄφθαρτον νόμου φῶς
  choice: непреходящий свет закона
  rationale: «Непреходящий» естественно выражает ἄφθαρτον применительно к свету, сохраняя смысл неуничтожимости и длительности.
- source_word: τῷ αἰῶνι
  choice: веку
  rationale: Близко сохраняет дательный падеж и единственное число αἰών, не устраняя его временную и космическую многозначность.
theological_decisions:
- issue: К кому относится «через которых» и какова роль сынов в даровании света закона
  choice: «Через которых» относится к «Твоим сыновьям», то есть к Израилю.
  alternative: Возможна более свободная отсылка к связанным с ними событиям.
  rationale: Ближайший грамматический антецедент διʼ ὧν — τοὺς υἱούς σου; перевод сохраняет эту непосредственную связь, не развивая её доктринально.
- issue: Значение αἰών
  choice: В основном тексте — «веку».
  alternative: «миру» или «на все времена».
  rationale: Греческое слово допускает временной и миропорядковый оттенки; буквальное «веку» сохраняет напряжение между ними, а примечание указывает естественные варианты.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис несколько приподнят, но понятен; тире ясно связывает заслуженное наказание с его причиной. Местоимение, обращённое к Богу, написано с прописной буквы по принятой русской библейской традиции.
