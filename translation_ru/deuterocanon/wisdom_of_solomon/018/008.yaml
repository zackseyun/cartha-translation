  text: For just as you punished the adversaries[a], so by this, having summoned us, you glorified us.
translation:
  language: ru
  text: Ведь тем же, чем Ты наказал противников, Ты, призвав нас[a], прославил нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвав нас к Себе». Греческое слово может означать «призвать», «позвать» или «пригласить»; возможно, оно подразумевает призыв к себе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτιμώρησας
  choice: наказал
  rationale: Глагол может обозначать наказание или возмездие; «наказал» ясно передаёт действие, не уточняя его мотив сверх текста.
- source_word: τοὺς ὑπεναντίους
  choice: противников
  rationale: Слово обозначает тех, кто противостоит или враждует; «противников» сохраняет этот широкий смысл, не ограничивая его военной враждой.
- source_word: ὡς … τούτῳ
  choice: тем же, чем
  rationale: Эта русская конструкция естественно передаёт соотнесённость наказания противников и прославления Божьего народа, а также инструментальный оттенок дательного τούτῳ.
- source_word: προκαλεσάμενος
  choice: призвав нас к Себе
  rationale: Средняя форма может означать призвать или позвать к себе; выбранный перевод сохраняет возможный направленный к действующему лицу оттенок, не делая его обязательным без пояснения.
- source_word: ἐδόξασας
  choice: прославил нас
  rationale: «Прославил» сохраняет смысл наделения славой и богословскую весомость δοξάζω; более нейтральная альтернатива — «почтил».
theological_decisions:
- issue: Соотношение суда над противниками и прославления народа
  choice: Один и тот же Божий акт представлен как наказание противников и прославление «нас».
  alternative: 'Можно передать лишь более общее сопоставление: «как Ты наказал противников, так… прославил нас».'
  rationale: Конструкция ὡς … τούτῳ связывает два результата Божьего действия; перевод сохраняет это напряжённое единство суда и прославления, не развивая его в отдельное учение.
- issue: Направленность призыва в προκαλεσάμενος
  choice: «призвав нас к Себе» с примечанием
  alternative: «призвав нас» или «позвав нас» без указания направления
  rationale: Средний залог допускает оттенок призыва к себе, однако этот оттенок не бесспорен, поэтому возможная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Инверсия вокруг причастного оборота сохраняет смысловую связь между призванием и прославлением.
