base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/001.yaml
  text: But for your holy ones there was very great light[a]; hearing their voice but not seeing their form, since they indeed had not suffered the same things[b], they counted them blessed.
translation:
  language: ru
  text: А для Твоих благочестивых[a] был великий свет. Слыша их голос, но не видя их облика, они — поскольку и те тосковали[b] — считали их блаженными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоих святых».'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол обычно означает «сильно желали, тосковали». В данном контексте выражение трудно; некоторые понимают его как указание на то, что те «претерпели то же». Отрицания «не претерпели» в представленном греческом тексте нет.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ... ὁσίοις σου
  choice: для Твоих святых
  rationale: ὅσιος обозначает людей, благочестивых и верных Богу. «Святых» кратко и естественно передаёт религиозный смысл, не уточняя его конфессионально.
- source_word: μέγιστον ... φῶς
  choice: ярчайший свет
  rationale: Превосходная степень μέγιστον усиливает характеристику света; «ярчайший» естественно передаёт её по-русски.
- source_word: φωνὴν
  choice: голоса
  rationale: В сочетании с личным местоимением и противопоставлением видимому облику φωνή здесь лучше понимать как человеческий голос; множественное число естественно при групповом референте.
- source_word: μορφὴν
  choice: облика
  rationale: μορφή означает видимую форму или внешний облик. «Облик» сохраняет противопоставление между слышимым и видимым.
- source_word: ἐπεπώθεισαν
  choice: тосковали
  rationale: Данная греческая форма происходит от ἐπιποθέω — «сильно желать, тосковать, стремиться». Хотя контекст труден, перевод следует представленному исходному тексту и не вводит отсутствующего в нём отрицания.
- source_word: ἐμακάριζον
  choice: называли их счастливыми
  rationale: μακαρίζω значит признавать или называть кого-либо счастливым, блаженным. Здесь «счастливыми» понятно современному читателю и не придаёт фразе лишнего специального оттенка.
theological_decisions:
- issue: Кто совершает действия «слыша», «не видя» и «называли»
  choice: Подразумеваемое подлежащее — египтяне, слышавшие Божий народ во время тьмы.
  alternative: Подлежащим могут быть «святые» либо фраза может сжато описывать взаимное восприятие двух групп.
  rationale: Контекст противопоставляет тьму египтян свету Божьего народа; поэтому естественнее всего понимать египтян как слышавших и называвших других счастливыми.
- issue: Референт κἀκεῖνοι («и те тоже»)
  choice: Местоимение оставлено как «те», то есть отдельная от подразумеваемого подлежащего группа, без дополнительного пояснения в основном тексте.
  alternative: Можно отнести выражение к тому же подлежащему и перевести «и сами».
  rationale: Указательное κἀκεῖνοι может отмечать смену референта. Сохранение «те» не сглаживает синтаксическую неоднозначность трудного греческого предложения.
- issue: Трудное чтение ἐπεπώθεισαν
  choice: Передано в обычном лексическом значении «тосковали».
  alternative: По контексту фразу предлагают понимать как «претерпели то же» или, с добавлением отсутствующего отрицания, «не претерпели того же».
  rationale: В предоставленном греческом тексте стоит форма от ἐπιποθέω и нет отрицательной частицы. Поэтому контекстуальную реконструкцию нельзя молча помещать в основной текст; она отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение, обращённое к Богу, написано с прописной буквы. Тире помогает прочитать вложенную причинную конструкцию, не устраняя исходной неоднозначности.
