base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/005.yaml
  text: When they had resolved to kill the infants of the holy ones[a], and one child had been exposed and rescued[b], you took away their multitude of children as a rebuke and destroyed them all together in mighty water.
translation:
  language: ru
  text: Когда они замыслили убить младенцев святых и один ребёнок был оставлен и спасён[a], Ты в обличение отнял у них множество детей и всех разом погубил в могучей воде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот оставленный и спасённый ребёнок, вероятно, — Моисей, которого положили в корзину среди тростника и затем спасли (Исх. 2:3–10).
    reason: cross_reference
  - marker: b
    text: 'Буквально: «в могучей воде»; возможны также переводы: «в бурной воде», «в неудержимой воде». Речь идёт о море как орудии гибели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλευσαμένους
  choice: решили
  rationale: Причастие передаёт обдуманное намерение; «решили» естественно и ясно выражает сознательный замысел.
- source_word: τὰ τῶν ὁσίων ... νήπια
  choice: младенцев святых
  rationale: νήπια обозначает малых детей, а ὅσιοι — принадлежащий Богу святой народ; «святых» сохраняет исходное обозначение без уточнения, отсутствующего в греческом.
- source_word: ἑνὸς ... τέκνου
  choice: один ребёнок
  rationale: τέκνον не указывает пол; общий термин сохраняет формальную широту греческого текста, хотя контекст намекает на Моисея.
- source_word: ἐκτεθέντος
  choice: был оставлен на погибель
  rationale: Глагол означает выставление или оставление младенца; контекстуальная формулировка передаёт угрозу жизни и звучит по-русски естественнее буквального «был выставлен».
- source_word: σωθέντος
  choice: спасён
  rationale: Передаёт избавление ребёнка от непосредственной опасности и соответствует обычному значению глагола в повествовательном контексте.
- source_word: εἰς ἔλεγχον
  choice: в обличение
  rationale: Формулировка сохраняет судебно-нравственный оттенок ἔλεγχος и намеренно не уточняет, было ли это обличением, доказательством вины или наказующим укором.
- source_word: ἀφεῖλον
  choice: отнял
  rationale: Прямо передаёт устранение и утрату; форма второго лица сохраняет обращение к Богу.
- source_word: πλῆθος τέκνων
  choice: множество детей
  rationale: Сохраняет риторический контраст между одним спасённым ребёнком и множеством отнятых детей.
- source_word: ὁμοθυμαδόν
  choice: всех разом
  rationale: В данном контексте наречие подчёркивает совместность и одновременность гибели.
- source_word: ἐν ὕδατι σφοδρῷ
  choice: в могучих водах
  rationale: «Могучих» передаёт силу и неудержимость σφοδρός; русское множественное «водах» естественно обозначает морскую стихию, хотя в греческом стоит собирательное единственное число.
theological_decisions:
- issue: Кого обозначает один оставленный и спасённый ребёнок
  choice: Текст оставлен без имени, с примечанием о вероятной отсылке к Моисею.
  alternative: Прямо назвать Моисея в основном тексте.
  rationale: Греческий текст имени не называет, хотя формулировка явно напоминает Исх 2:3–10; перевод сохраняет эту меру недосказанности.
- issue: Значение ὅσιοι
  choice: святые
  alternative: благочестивые; верные; народ Божий
  rationale: «Святые» близко передаёт греческое обозначение посвящённого Богу народа и не вводит отсутствующего в тексте пояснения.
- issue: Смысл εἰς ἔλεγχον
  choice: в обличение
  alternative: в наказание; как доказательство их вины; в укор
  rationale: Исходное выражение допускает оттенки обличения, изобличения и наказующего укорения; выбранная формулировка сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет длинное причинно-сопоставительное движение греческой фразы; прописное «Ты» поддерживает традиционное благоговейное обращение к Богу. Маркеры примечаний поставлены непосредственно после соответствующих выражений.
