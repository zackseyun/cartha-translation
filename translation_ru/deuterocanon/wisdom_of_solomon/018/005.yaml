    issue: Неверная привязка сноски a
    rationale: Сноска о «одном оставленном и спасённом ребёнке» поставлена после «святых», а должна быть привязана к словам об одном ребёнке.
  - severity: medium
    issue: Добавленное значение в «оставлен на погибель»
    rationale: ἐκτεθέντος означает, что ребёнка выставили/оставили; выражение «на погибель» прямо не сказано и чрезмерно конкретизирует исходный текст.
  - severity: low
    issue: Множественное число «в могучих водах»
    rationale: Греческий текст имеет συλλективное единственное ἐν ὕδατι σφοδρῷ. Русское единственное число возможно и лучше сохраняет образ оригинала.
