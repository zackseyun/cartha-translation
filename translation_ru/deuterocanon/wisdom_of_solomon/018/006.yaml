base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/006.yaml
  text: That night was made known beforehand to our fathers[a], so that, knowing with certainty the oaths in which they had trusted[c][b], they might be encouraged.
translation:
  language: ru
  text: Та ночь была заранее открыта нашим отцам[a], чтобы они, твёрдо зная, каким клятвам поверили, ободрились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Та ночь была заранее узнана нашими отцами». В данном контексте греческий глагол, вероятно, означает, что о ней им было заранее открыто.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνη ἡ νύξ
  choice: Та ночь
  rationale: Естественно передаёт указательное значение греческого оборота без лишнего усиления.
- source_word: προεγνώσθη
  choice: была заранее открыта
  rationale: Форма допускает буквальное «была заранее узнана», но в контексте речь, вероятнее всего, о предварительном возвещении ночи избавления; пассивная конструкция сохранена.
- source_word: πατράσιν ἡμῶν
  choice: нашим отцам
  rationale: Сохраняет прямое значение греческого выражения и его связь с праотцами Израиля.
- source_word: ἀσφαλῶς εἰδότες
  choice: твёрдо зная
  rationale: Кратко и естественно передаёт уверенное, несомненное знание.
- source_word: οἷς ἐπίστευσαν ὅρκοις
  choice: каким клятвам поверили
  rationale: Сохраняет относительную конструкцию и буквальное «клятвам», не уточняя в основном тексте, кем они были даны.
- source_word: ἐπευθυμήσωσιν
  choice: ободрились
  rationale: Передаёт значение обретения бодрости и мужества; по-русски звучит естественнее, чем буквальные описательные варианты.
theological_decisions:
- issue: К кому относится действие προεγνώσθη
  choice: Ночь была заранее открыта отцам
  alternative: Ночь была заранее узнана отцами
  rationale: Контекст предварительно возвещённого избавления поддерживает значение раскрытия свыше, однако грамматически возможная неоднозначность отмечена в сноске.
- issue: Референт клятв
  choice: Не уточнять в основном тексте, чьи это клятвы
  alternative: Божьи клятвенные обещания праотцам Израиля
  rationale: Контекст указывает на Божьи обещания, но сам стих говорит лишь о «клятвах»; перевод не должен устранять эту сдержанность текста.
translation_notes:
  register: Современный литературный русский язык; синтаксис сдержанный и торжественный, но понятный. «Отцам» сохранено как традиционное и точное обозначение праотцов; «ободрились» передаёт результат внутреннего укрепления без конфессионального уточнения.
