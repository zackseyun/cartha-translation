  source_fidelity: «Та ночь была заранее открыта нашим отцам» адекватно передаёт ἐκείνη ἡ νὺξ προεγνώσθη πατράσιν ἡμῶν. «Открыта» является контекстуально обоснованным выбором для пассива προεγνώσθη, а сноска честно сохраняет более буквальную возможность. «Твёрдо зная, каким клятвам поверили» передаёт ἀσφαλῶς εἰδότες οἷς ἐπίστευσαν ὅρκοις, не уточняя сверх текста, кем даны клятвы. «Ободрились» соответствует целевому ἐπευθυμήσωσιν.
