base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/022.yaml
  text: He overcame the multitude not by strength of body, nor by the force of weapons, but by a word he subdued the punisher, reminding him of the oaths to the fathers and the covenants.
translation:
  language: ru
  text: Он одолел множество не телесной силой и не мощью оружия, но словом усмирил карающего[a], напомнив ему о клятвах, данных праотцам[b], и о заветах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, кто карал». Греческий текст прямо не уточняет, идёт ли речь о Боге, ангеле-губителе или об олицетворённой карающей силе.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «о клятвах праотцев»; греческий родительный падеж допускает такую передачу, однако в контексте выражение, вероятно, означает клятвенные обещания, данные праотцам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησεν
  choice: одолел
  rationale: Передаёт победу или успешное преодоление, не добавляя образа кровопролитного военного завоевания.
- source_word: τὸν ὄχλον
  choice: множество
  rationale: ὄχλος означает толпу или множество; выбран нейтральный собирательный термин, соответствующий представленному греческому тексту.
- source_word: οὐκ ἰσχύι τοῦ σώματος
  choice: не телесной силой
  rationale: Естественно передаёт дательный падеж средства и сохраняет противопоставление оружию и слову.
- source_word: οὐχ ὅπλων ἐνεργείᾳ
  choice: не мощью оружия
  rationale: ἐνέργεια здесь обозначает действенную силу; «мощь оружия» звучит по-русски естественно и сохраняет инструментальный смысл.
- source_word: ἀλλὰ λόγῳ
  choice: но словом
  rationale: Сохраняет краткость оригинала и контраст между физической силой, оружием и речью, не разворачивая λόγος в толкование «ходатайством».
- source_word: τὸν κολάζοντα
  choice: карающего
  rationale: 'Субстантивированное причастие оставлено без уточнения личности действующего: текст прямо не называет ни Бога, ни ангела, ни олицетворённую карающую силу.'
- source_word: ὑπέταξεν
  choice: усмирил
  rationale: Передаёт подчинение и обуздание в данном контексте, но не создаёт излишне резкого впечатления абсолютного господства человека над Богом.
- source_word: ὅρκους πατέρων
  choice: клятвах, данных праотцам
  rationale: В контексте выражение указывает на клятвенные обещания, относящиеся к праотцам; добавленное «данных» делает эту связь ясной в современном русском, а грамматическая неоднозначность отмечена в сноске.
- source_word: καὶ διαθήκας
  choice: и о заветах
  rationale: В библейском греческом διαθήκη обычно означает завет; множественное число оригинала сохранено.
- source_word: ὑπομνήσας
  choice: напомнив ему
  rationale: Деепричастие передаёт сопутствующий способ действия; местоимение делает подразумеваемый объект напоминания явным, не отождествляя его с конкретной личностью.
theological_decisions:
- issue: Кто назван «карающим» и кому напоминают о клятвах
  choice: Оставить «карающего» неопределённым и употребить только местоимение «ему».
  alternative: Назвать Бога, ангела-губителя либо олицетворённую кару.
  rationale: Греческий текст использует субстантивированное причастие, но прямо не устанавливает личность карающего; перевод сохраняет эту богословскую неопределённость.
- issue: Смысл λόγῳ
  choice: Перевести как «словом».
  alternative: «речью», «ходатайством» или «разумом».
  rationale: Непосредственный контраст относится к телесной силе, оружию и словесному обращению; краткий перевод не привносит в основной текст расширительного толкования.
- issue: Направленность выражения ὅρκους πατέρων
  choice: Передать как клятвы, данные праотцам.
  alternative: «клятвы праотцев», что может пониматься как клятвы, произнесённые самими праотцами.
  rationale: Контекст заветных обязательств поддерживает понимание клятвенных обещаний праотцам, однако формальная неоднозначность греческого родительного падежа сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Синтаксический параллелизм «не… и не…, но…» сохраняет риторический строй оригинала; неопределённость личности карающего не разрешается в основном тексте.
