base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/003.yaml
  text: Instead of these things[a], you provided a pillar blazing with fire, both as a guide for an unknown journey and as a harmless sun for their honored exile.
translation:
  language: ru
  text: Вместо этого Ты дал им столп, огнём пылающий, как проводника в неведомом странствии и как безвредное солнце для их достойного пребывания на чужбине.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для их благородного пребывания на чужбине». Греческое выражение φιλοτίμου ξενιτείας трудно для точной передачи: оно может подчёркивать достоинство пребывания Израиля в чужой земле, а не изгнание исключительно в отрицательном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: Вместо этого
  rationale: Оборот выражает противопоставление предшествующим бедствиям; единственное число «этого» естественно по-русски обозначает всю предшествующую ситуацию.
- source_word: πυριφλεγῆ στῦλον
  choice: столп, пылающий огнём
  rationale: Сохраняет конкретный и усиленный огненный образ, а также узнаваемую связь с повествованием об исходе.
- source_word: ὁδηγόν
  choice: проводником
  rationale: Передаёт функцию столпа как ведущего путников и естественно сочетается с образом пути.
- source_word: ἀγνώστου ὁδοιπορίας
  choice: в неведомом пути
  rationale: 'Сохраняет неопределённость греческого выражения: неизвестным или непривычным мог быть сам путь либо маршрут.'
- source_word: ἥλιον
  choice: солнцем
  rationale: Передаёт буквальный образ солнца, не сводя его к более общему «свету».
- source_word: ἀβλαβῆ
  choice: безвредным
  rationale: Сохраняет явное значение отсутствия вреда и контраст с губительными явлениями, постигшими египтян.
- source_word: φιλοτίμου ξενιτείας
  choice: в их почётном пребывании на чужбине
  rationale: ξενιτεία обозначает пребывание вдали от родины или на чужбине, а трудное φιλοτίμου придаёт ему оттенок чести или достоинства; формулировка не сужает значение до строго отрицательного изгнания.
- source_word: παρέσχες
  choice: Ты дал им
  rationale: Прямое обращение к Богу передано ясно и естественно; местоимение «им» по-русски делает получателей дара явными из контекста.
theological_decisions:
- issue: Связь образов столпа и солнца с исходом
  choice: Сохранены конкретные образы огненного столпа и солнца.
  alternative: 'Передать обобщённо: «Ты дал им свет, который вёл их».'
  rationale: Конкретная образность существенна для отсылки к Божьему водительству во время исхода и не должна быть сведена к абстрактному свету.
- issue: Значение ξενιτεία
  choice: «пребывание на чужбине»
  alternative: «изгнание»
  rationale: Греческое слово может означать как изгнание, так и более нейтральное пребывание в чужой земле. Выбранный вариант сохраняет эту широту и позволяет положительному определению φιλοτίμου звучать естественно.
- issue: Трудное сочетание φιλοτίμου ξενιτείας
  choice: «почётное пребывание на чужбине» с примечанием
  alternative: «благородное странствование» или «славное изгнание»
  rationale: Сочетание допускает несколько смысловых оттенков. Основной текст передаёт положительную оценку, а примечание сохраняет реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Столп» сохранён ради устойчивого библейского образа; остальная лексика рассчитана на обычного современного читателя. Заглавное «Ты» отмечает прямое обращение к Богу без добавления конфессионально обусловленных толкований.
