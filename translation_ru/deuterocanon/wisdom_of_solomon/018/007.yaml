lexical_decisions:
- source_word: προσεδέχθη
  choice: ожидал
  rationale: Аорист προσδέχομαι здесь передаёт ожидание предстоящего события; «ожидал» естественно по-русски и сохраняет направленность в будущее.
- source_word: λαοῦ σου
  choice: народ твой
  rationale: Сохраняет прямое обращение к Богу и собирательное значение λαός.
- source_word: σωτηρία
  choice: спасение
  rationale: Передаёт как конкретное избавление в историческом контексте, так и более широкий богословский смысл слова σωτηρία.
- source_word: δικαίων
  choice: праведных
  rationale: Субстантивированное прилагательное во множественном числе естественно передаёт нравственно-богословскую категорию без добавления слова «людей».
- source_word: ἐχθρῶν
  choice: врагов
  rationale: Сохраняет буквальную неопределённость греческого родительного падежа и не добавляет отсутствующее в тексте притяжательное «их».
- source_word: ἀπωλία
  choice: гибель
  rationale: В данном контексте означает погибель или уничтожение; «гибель» образует ясную и естественную антитезу спасению.
theological_decisions:
- issue: 'Сохранение двойного исхода: спасения праведных и гибели врагов'
  choice: 'Обе стороны противопоставления переданы параллельно и без смягчения: «спасения праведных и гибели врагов».'
  alternative: «избавления праведных и уничтожения их врагов»
  rationale: Конструкция μὲν…δὲ выражает резкое сопоставление. Перевод сохраняет одновременно избавление и суд, но не уточняет, что враги принадлежат именно народу или праведным, поскольку притяжательного местоимения в греческом нет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «народ твой» сохраняет достоинство прямого обращения; союз «И» отражает связь стиха с предшествующим контекстом. Маркер сноски поставлен непосредственно после предложения.
