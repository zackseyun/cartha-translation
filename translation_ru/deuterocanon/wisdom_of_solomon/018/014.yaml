  text: For while a calm silence encompassed all things[a], and the night in its swift course was halfway gone,
translation:
  language: ru
  text: Ибо, когда безмятежная тишина объяла всё и ночь в своём стремительном беге достигла середины,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
