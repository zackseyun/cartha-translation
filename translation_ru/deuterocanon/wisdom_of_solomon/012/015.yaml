base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/015.yaml
  text: But being righteous[a], you govern all things righteously[b], considering it foreign to your power to condemn one who does not deserve to be punished.
translation:
  language: ru
  text: Но, будучи праведен, Ты праведно управляешь всем и считаешь несвойственным Твоей силе[a] осудить того, кто не подлежит наказанию.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несовместимым с Твоей силой». Буквально: «чуждым Твоей силе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «того, кто не должен быть наказан»; возможно также: «того, кто не заслуживает наказания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος … δικαίως
  choice: будучи праведен … праведно
  rationale: Сохранены однокоренная связь и риторический повтор греческого текста; формулировка выражает как качество Бога, так и образ Его правления.
- source_word: τὰ πάντα διέπεις
  choice: всем управляешь
  rationale: Передаёт всеохватность τὰ πάντα и значение упорядоченного руководства в διέπεις без неоправданного сужения до вселенной.
- source_word: αὐτὸν τὸν μὴ ὀφείλοντα κολασθῆναι
  choice: того, кто не подлежит наказанию
  rationale: ὀφείλω с инфинитивом выражает долженствование или подлежащую исполнению обязанность; в отрицательной форме здесь — отсутствие основания или обязательства подвергать человека наказанию.
- source_word: καταδικάσαι
  choice: осудить
  rationale: Сохраняет судебное значение глагола и естественно звучит в современном русском языке.
- source_word: ἀλλότριον … τῆς σῆς δυνάμεως
  choice: несвойственным Твоей силе
  rationale: Передаёт образ чего-то чуждого, не принадлежащего Божьей силе, и при этом избегает неестественного буквального выражения «чуждым Твоей силе».
- source_word: ἡγούμενος
  choice: считаешь
  rationale: Естественно передаёт значение оценочного суждения причастия в синтаксисе русского предложения.
theological_decisions:
- issue: Соотношение Божьей силы и праведности
  choice: Осуждение не подлежащего наказанию названо несвойственным Божьей силе.
  alternative: Осуждение невиновного лишь недостойно Бога либо выходит за пределы Его законной власти.
  rationale: Греческий текст связывает Божью праведность, праведное управление всем и несовместимость неправедного осуждения с Его силой. Перевод сохраняет эту связь, не сводя δύναμις только к достоинству или юридическому праву.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Однокоренной повтор «праведен — праведно» намеренно сохраняет греческую риторику.
