base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/002.yaml
  text: Therefore you rebuke those who fall away little by little[a], and by reminding them of the things in which they sin you warn them, so that, having been set free from wickedness, they may put faith in you, Lord.
translation:
  language: ru
  text: Поэтому тех, кто оступается, Ты понемногу обличаешь и, напоминая им, в чём они грешат, вразумляешь их, чтобы они, освободившись от зла, уверовали в Тебя[a], Господи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверились Тебе». Греческое πιστεύσωσιν ἐπὶ σέ выражает веру, направленную к Богу, и может подчёркивать доверие Ему.'
    reason: alternative_reading
lexical_decisions:
- source_word: διό
  choice: Поэтому
  rationale: Передаёт логический вывод из предшествующего рассуждения.
- source_word: τοὺς παραπίπτοντας
  choice: тех, кто оступается
  rationale: παραπίπτω обозначает уклонение или впадение в проступок; «оступается» естественно передаёт нравственное падение, не усиливая его до окончательного отпадения.
- source_word: κατʼ ὀλίγον ἐλέγχεις
  choice: понемногу обличаешь
  rationale: 'По синтаксису и контексту κατʼ ὀλίγον естественно относится к ἐλέγχεις: Бог исправляет постепенно, мерой за мерой. «Обличаешь» сохраняет смысл выявления вины ради исправления.'
- source_word: ἐν οἷς ἁμαρτάνουσιν ὑπομιμνήσκων
  choice: напоминая им, в чём они грешат
  rationale: Сохраняет причастную конструкцию и указание на конкретные проявления греха.
- source_word: νουθετεῖς
  choice: вразумляешь их
  rationale: Передаёт нравственное наставление и предостережение, направленное на исправление; по-русски «вразумлять» естественно сочетается с данным контекстом.
- source_word: ἀπαλλαγέντες τῆς κακίας
  choice: освободившись от зла
  rationale: Передаёт освобождение от состояния нравственного зла; возвратная форма по-русски естественно выражает результат пассивного освобождения.
- source_word: πιστεύσωσιν ἐπὶ σέ
  choice: уверовали в Тебя
  rationale: Передаёт направленную к Богу веру; «доверились Тебе» остаётся допустимым смысловым оттенком и отмечено в сноске.
- source_word: Κύριε
  choice: Господи
  rationale: Русская форма звательного обращения к Богу.
theological_decisions:
- issue: Значение πιστεύσωσιν ἐπὶ σέ
  choice: уверовали в Тебя
  alternative: доверились Тебе
  rationale: Основной текст сохраняет богословски значимый язык веры, а сноска отмечает присутствующий в греческой конструкции оттенок личного доверия Богу.
- issue: Связь κατʼ ὀλίγον
  choice: понемногу обличаешь
  alternative: тех, кто понемногу оступается
  rationale: Наиболее естественно наречное выражение характеризует меру или постепенность Божьего обличения. Это соответствует контексту милосердного, постепенного исправления, хотя линейное положение допускает поверхностное отнесение к причастию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы; обращение Κύριε передано естественной русской формой «Господи».
