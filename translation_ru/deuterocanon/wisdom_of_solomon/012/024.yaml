base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/024.yaml
  text: For they wandered even farther in the ways of error[a], supposing as gods even the dishonored creatures among the animals of their enemies[b], having been deceived like foolish infants.
translation:
  language: ru
  text: Ведь они ещё дальше забрели по путям заблуждения[a], принимая за богов даже презренных животных своих врагов[b], будучи обмануты, словно неразумные младенцы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были увлечены ещё дальше по путям заблуждения». Греческое выражение может подчёркивать как их собственное блуждание, так и то, что их ввели в заблуждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «даже бесчестных среди животных своих врагов». Греческая конструкция может более буквально выделять лишённых почёта среди животных, связанных с их врагами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν πλάνης ὁδῶν
  choice: по путям заблуждения
  rationale: Сохраняет метафору пути и передаёт πλάνη как заблуждение в контексте идолопоклонства.
- source_word: μακρότερον ἐπλανήθησαν
  choice: ещё дальше забрели
  rationale: Передаёт сравнительное усиление μακρότερον и созвучную контексту метафору удаления по ложному пути; медиально-пассивная форма допускает также значение «были увлечены ещё дальше».
- source_word: θεοὺς ὑπολαμβάνοντες
  choice: принимая за богов
  rationale: Естественно передаёт ошибочное признание или представление, выраженное ὑπολαμβάνοντες.
- source_word: τὰ καὶ ἐν ζῴοις τῶν ἐχθρῶν ἄτιμα
  choice: даже презренных животных своих врагов
  rationale: Синтаксически компактно передаёт субстантивированное τὰ ἄτιμα и его отнесение к животным врагов; «презренных» сохраняет отрицательную оценку ἄτιμα.
- source_word: νηπίων δίκην ἀφρόνων
  choice: словно неразумные младенцы
  rationale: Сохраняет сравнение, возрастное значение νηπίων и упрёк, заключённый в ἀφρόνων, без грубого усиления.
- source_word: ψευσθέντες
  choice: обманувшись
  rationale: Русская возвратная форма естественно передаёт состояние введённых в заблуждение, не уточняя названного виновника обмана.
theological_decisions:
- issue: Нравственная оценка идолопоклонства
  choice: Сохранены выражения «заблуждение», «презренные» и «обманувшись».
  alternative: Смягчить оценку словами «ошибка», «низшие» или «ошибившись».
  rationale: Греческий текст прямо изображает идолопоклонство как глубокое заблуждение, бесчестную переоценку животных и обман; перевод не должен нейтрализовать эту критику.
- issue: Направленность заблуждения в ἐπλανήθησαν
  choice: «забрели» — акцент на их блуждании.
  alternative: «были увлечены ещё дальше» — акцент на том, что их ввели в заблуждение.
  rationale: Форма и контекст допускают оба оттенка, поэтому альтернативное понимание отмечено в сноске, а основной текст сохраняет образ пути.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Метафора пути сохранена; причастные обороты переданы естественной для русского последовательностью действий. Все сноски обозначены в основном тексте.
