base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/017.yaml
  text: For you show your strength when your perfect power is disbelieved[b][a], and among those who know it you expose boldness.
translation:
  language: ru
  text: Ибо Ты являешь силу, когда не верят в полноту Твоего могущества,[a] и среди знающих обличаешь дерзость.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «когда Тебе не верят относительно полноты Твоего могущества». Греческая фраза сжата и может указывать как на недоверие к самому Богу, так и на сомнение в полноте Его могущества.'
    reason: alternative_reading
  - marker: b
    text: '«Дерзость» здесь имеет отрицательный смысл: наглость, самонадеянность или вызывающая дерзость. В выражении «среди знающих» греческий текст не уточняет, кого или что они знают.'
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: ἰσχὺν
  choice: силу
  rationale: «Сила» естественно передаёт ἰσχύς и позволяет отличить это слово от δύναμις, переведённого далее как «могущество».
- source_word: ἐνδείκνυσαι
  choice: являешь
  rationale: Глагол означает «показывать, обнаруживать, демонстрировать»; «являешь» сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: ἀπιστούμενος ἐπὶ δυνάμεως τελειότητι
  choice: когда не верят в полноту Твоего могущества
  rationale: Передаёт сжатую греческую конструкцию как сомнение в полноте Божьего могущества, не уточняя, кто именно не верит.
- source_word: δυνάμεως τελειότητι
  choice: полноту Твоего могущества
  rationale: τελειότης обозначает полноту или совершенство, а δύναμις — силу или могущество; «полнота могущества» сохраняет различие с ἰσχύς.
- source_word: ἐν τοῖς εἰδόσι
  choice: среди знающих
  rationale: Греческий текст не называет объект знания. Эллиптическое «среди знающих» сохраняет эту неопределённость вместо добавления «Тебя» или «это».
- source_word: τὸ θράσος
  choice: дерзость
  rationale: В контексте обличения θράσος имеет отрицательный оттенок — наглость, вызывающая самоуверенность; «дерзость» сохраняет смысловую широту слова.
- source_word: ἐξελέγχεις
  choice: обличаешь
  rationale: ἐξελέγχω означает выявлять неправоту, уличать или обличать; «обличаешь» точно сочетается с нравственно отрицательной «дерзостью».
theological_decisions:
- issue: К кому относится неверие и что именно подвергается сомнению
  choice: «когда не верят в полноту Твоего могущества»
  alternative: «когда Тебе не верят относительно полноты могущества»
  rationale: Страдательное причастие ἀπιστούμενος буквально может относить недоверие к самому Богу, тогда как предложная группа указывает на полноту могущества. Основной текст естественно выражает сомнение в полноте Божьей силы, а примечание сохраняет более формальный разбор.
- issue: Неуказанный объект знания в ἐν τοῖς εἰδόσι
  choice: 'Не добавлять объект: «среди знающих»'
  alternative: «среди знающих Тебя» или «среди тех, кто знает о нём»
  rationale: Греческий текст оставляет объект знания подразумеваемым; добавление конкретного объекта неоправданно разрешило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Эллипсис «среди знающих» намеренно сохранён ради соответствия греческой неоднозначности.
