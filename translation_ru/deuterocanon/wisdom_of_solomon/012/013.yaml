base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/013.yaml
  text: For there is no god besides you who cares for all[a], so that you should show that you did not judge unjustly[b];
translation:
  language: ru
  text: Ибо нет бога, кроме Тебя, Который заботится обо всём[a], чтобы Ты показал, что судил не несправедливо[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заботится обо всех». Греческое πάντων может относиться как ко всему сущему, так и ко всем людям.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы Ты показал, что судил не несправедливо»; по смыслу: «что Ты судил справедливо».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὔτε γὰρ θεός ἐστιν πλὴν σοῦ
  choice: Ведь нет Бога, кроме Тебя
  rationale: γάρ передаёт пояснение («ведь»), а исключительная конструкция естественно выражается по-русски как «нет Бога, кроме Тебя».
- source_word: ᾧ μέλει περὶ πάντων
  choice: Который заботится обо всём
  rationale: Передаёт безличную греческую конструкцию естественным русским оборотом и сохраняет широкий, неуточнённый охват πάντων.
- source_word: ἵνα δείξῃς
  choice: так что Тебе не нужно доказывать
  rationale: В контексте отсутствия иного бога, способного потребовать отчёта, ἵνα имеет оттенок следствия; русская формулировка делает логическую связь ясной, не вводя внешнего судью.
- source_word: οὐκ ἀδίκως ἔκρινας
  choice: Ты судил не несправедливо
  rationale: Сохранена отрицательная форма греческого выражения, а κρίνω передано широким судебным глаголом «судить».
theological_decisions:
- issue: Исключительность Бога в формуле θεός ... πλὴν σοῦ
  choice: нет Бога, кроме Тебя
  alternative: нет бога, кроме Тебя
  rationale: В русском тексте «Бог» как обозначение единственного истинного Бога нормативно пишется с прописной буквы; сама конструкция по-прежнему отрицает существование иного Бога.
- issue: Логическая сила ἵνα δείξῃς
  choice: так что Тебе не нужно доказывать
  alternative: чтобы Ты показал
  rationale: Контекст связывает отсутствие другого всезаботящегося бога с отсутствием необходимости оправдывать Божий суд; сохранён оттенок следствия, тогда как буквальное «чтобы Ты показал» по-русски может ошибочно звучать как реальная обязанность Бога дать доказательство.
- issue: Отрицательная форма οὐκ ἀδίκως
  choice: судил не несправедливо
  alternative: судил справедливо
  rationale: Литота исходного текста сохранена, чтобы не сглаживать его риторическую форму до прямого положительного утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, обращённые к Богу, написаны с прописной буквы согласно русской религиозно-издательской традиции. Сохранена отрицательная формулировка последней части стиха.
