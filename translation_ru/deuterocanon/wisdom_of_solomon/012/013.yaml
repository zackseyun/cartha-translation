    issue: Неверно передано ἵνα δείξῃς.
    rationale: '«Тебе не нужно доказывать» отсутствует в оригинале и заменяет целевое придаточное с субъектом «Ты» утверждением о ненужности оправдания. Следует восстановить: «чтобы Ты показал».'
  - severity: medium
    issue: Сноска b предлагает смысл, которого нет в тексте.
    rationale: Греческое δείξῃς означает «Ты показал/доказал», а не «кто-либо доказывал Тебе». Сноска должна объяснять буквальную отрицательную формулу либо её положительный смысл.
  revised_text: Ибо нет бога, кроме Тебя, Который заботится обо всём[a], чтобы Ты показал, что судил не несправедливо[b].
