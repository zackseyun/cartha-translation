base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/016.yaml
  text: For your strength is the beginning of righteousness[b][a], and your mastery over all makes you spare all.
translation:
  language: ru
  text: Ведь Твоя сила — начало праведности[a][b], и Твоя власть над всеми побуждает Тебя щадить всех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «источник» либо «основа праведности». Греческое ἀρχή может означать начало, источник или основополагающее начало.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливости». Греческое δικαιοσύνη охватывает значения праведности, справедливости и правосудия.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰσχύς
  choice: сила
  rationale: Передаёт способность и могущество без излишне отвлечённого оттенка слова «мощь».
- source_word: δικαιοσύνης
  choice: праведности
  rationale: Сохраняет основной проектный эквивалент для δικαιοσύνη и указывает на нравственную правоту Божьего действия; значение «справедливость» отмечено в сноске.
- source_word: ἀρχή
  choice: начало
  rationale: Это прямой эквивалент, сохраняющий возможные смыслы исходной точки, источника и основополагающего начала; альтернативы указаны в сноске.
- source_word: δεσπόζειν
  choice: Твоя власть над всеми
  rationale: Естественно передаёт владычество и полновластие, заключённые в греческом артиклевом инфинитиве, не привнося отрицательного оттенка «господствовать».
- source_word: φείδεσθαι
  choice: щадить
  rationale: Точно выражает воздержание от кары или уничтожения и сохраняет лаконичность греческого глагола.
- source_word: ποιεῖ
  choice: побуждает Тебя
  rationale: Естественно по-русски передаёт причинную связь между всеобщей властью Бога и Его снисхождением, избегая неуместного оттенка внешнего принуждения в слове «заставляет».
- source_word: πάντων ... πάντων
  choice: над всеми ... всех
  rationale: Сохраняет повтор и всеобщий охват исходного текста; русская форма соответствует управлению слов «власть» и «щадить».
theological_decisions:
- issue: Значение δικαιοσύνη в утверждении о Божьем характере и правлении
  choice: праведность
  alternative: справедливость, правосудие
  rationale: «Праведность» сохраняет широкий нравственный смысл, тогда как судебно-распределительный оттенок «справедливости» остаётся возможным и отмечен в сноске.
- issue: Причинная связь между всеобщей властью Бога и Его снисхождением
  choice: власть побуждает щадить
  alternative: власть заставляет щадить; власть служит основанием щадить
  rationale: Формулировка сохраняет причинность ποιεῖ, но не представляет Бога как подчинённого внешнему принуждению и не сводит связь лишь к разрешению или возможности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Повтор «всеми ... всех» сохраняет риторическую всеобщность греческого текста.
