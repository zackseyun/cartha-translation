base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/019.yaml
  text: But by such deeds you taught your people that the righteous must be humane[a], and you made your children full of good hope[b], because you grant repentance for sins.
translation:
  language: ru
  text: Но такими делами Ты научил Свой народ, что праведник должен быть человеколюбивым[a], и исполнил Своих сынов доброй надежды[b], потому что даруешь покаяние в грехах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добрым к людям».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынов»; здесь они представляют Божий народ как Его сынов.'
    reason: lexical_clarification
  - marker: c
    text: 'Или: «даёшь покаяние за грехи»; греческий оборот обозначает покаяние в связи с совершёнными грехами.'
    reason: source_ambiguity
lexical_decisions:
- source_word: διὰ τῶν τοιούτων ἔργων
  choice: такими делами
  rationale: διά с родительным имеет инструментальное значение, а ἔργα указывает на описанные ранее действия Бога. «Делами» конкретно и естественно передаёт смысл без лишнего богословского оттенка слова «дела» как термина.
- source_word: δεῖ τὸν δίκαιον εἶναι
  choice: праведник должен быть
  rationale: δεῖ выражает нравственную необходимость; греческий субстантивированный единственный мужской род естественно передаётся русским родовым наименованием «праведник».
- source_word: φιλάνθρωπον
  choice: человеколюбивым
  rationale: Прилагательное означает расположение, доброту и благожелательность к людям. «Человеколюбивым» близко греческому слову по смыслу и форме и уместно в современном литературном библейском регистре.
- source_word: εὐέλπιδας ἐποίησας
  choice: исполнил ... доброй надежды
  rationale: Оборот сохраняет значение «сделал исполненными доброй надежды» и звучит по-русски естественнее буквального «сделал надеющимися».
- source_word: τοὺς υἱούς σου
  choice: Своих сынов
  rationale: Греческий текст прямо говорит «сынов»; возвратное «Своих» нормативно по-русски при подлежащем «Ты» и сохраняет отношение принадлежности.
- source_word: διδοῖς ἐπὶ ἁμαρτήμασιν μετάνοιαν
  choice: даруешь покаяние в грехах
  rationale: «Даруешь» передаёт действие Бога и оттенок благодатного предоставления, не добавляя отсутствующих в тексте слов «время» или «возможность». «Покаяние в грехах» естественно обозначает покаяние по поводу совершённых грехов.
theological_decisions:
- issue: Родовое значение форм мужского рода
  choice: Сохранить «праведник» и «Своих сынов»
  alternative: «праведный человек»; «Своих детей»
  rationale: Обе мужские формы выражены в греческом тексте. Русское «праведник» естественно имеет представительное общее значение, а «сынов» сохраняет образ сыновнего отношения народа к Богу.
- issue: Божественное действие и μετάνοια
  choice: «даруешь покаяние в грехах»
  alternative: «даёшь возможность раскаяться в грехах»; «допускаешь покаяние после грехов»
  rationale: Основной вариант сохраняет утверждение о Божьем даровании покаяния, но не уточняет механизм и не вводит отсутствующие в греческом тексте понятия возможности, времени или позволения.
- issue: Характер надежды сынов
  choice: «исполнил Своих сынов доброй надежды»
  alternative: «сделал Своих сынов полными доброй надежды»; «дал Своим сынам добрую надежду»
  rationale: Выбранная формулировка сохраняет причинённое Богом состояние εὐέλπιδας, не превращая его без необходимости в прямой объект «дал надежду».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Сохранены параллельные действия Бога и причинная связь заключительной части стиха.
