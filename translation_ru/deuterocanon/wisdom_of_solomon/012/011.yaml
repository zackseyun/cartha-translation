    reason: alternative_reading
lexical_decisions:
- source_word: σπέρμα
  choice: семя
  rationale: Сохраняет образ греческого текста; здесь слово обозначает потомство или народ.
- source_word: κατηραμένον
  choice: проклятое
  rationale: Передаёт состояние под проклятием и сохраняет торжественно-судебный тон.
- source_word: ἀπʼ ἀρχῆς
  choice: от начала
  rationale: Близкая и естественная передача временного оборота.
- source_word: εὐλαβούμενος
  choice: из страха перед
  rationale: В сочетании с τινα может обозначать страх, опасение или почтительную оглядку на кого-либо; выбранный вариант естественен по-русски, а неоднозначность отмечена в сноске.
- source_word: ἄδειαν
  choice: освобождение от наказания
  rationale: В данном судебном контексте речь идёт о невзыскании или иммунитете от заслуженного наказания; этот вариант точнее, чем многозначное «прощение».
- source_word: ἐδίδους
  choice: давал
  rationale: Имперфект передан несовершенным видом, сохраняющим длительный или характерный характер действия.
- source_word: ἐφʼ οἷς ἥμαρταν
  choice: за то, в чём они согрешили
  rationale: Сохраняет смысл основания наказания и необычную конструкцию исходного текста без излишнего уточнения.
theological_decisions:
- issue: Следует ли прямо отождествить «семя» с хананейскими народами
  choice: Сохранить метафору «семя» без поясняющего названия народа в основном тексте.
  alternative: «потомство» или «род»
  rationale: Контекст указывает на референта, но сам стих употребляет σπέρμα; добавление этнонима вышло бы за пределы формулировки источника.
- issue: Связь причастного оборота εὐλαβούμενός τινα с отказом дать ἄδεια
  choice: Понимать как отсутствие у Бога страха перед кем-либо, который мог бы удержать Его от суда.
  alternative: «не оказывая почтения никому» или «не считаясь ни с кем»
  rationale: Греческий оборот допускает оттенки страха, осторожности и почтительной оглядки; основной текст сохраняет прямое значение страха, а сноска — альтернативу.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Обращение к Богу обозначено прописным «Ты» по принятой русской издательской традиции. Синтаксис сохраняет напряжение и некоторую неоднозначность греческого текста.
