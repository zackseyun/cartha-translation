  text: For it was a seed accursed from the beginning[a], and not fearing anyone because of the things in which they sinned[b], you granted them no pardon.
translation:
  language: ru
  text: Ведь они были проклятым от начала семенем[a], и, не страшась никого, Ты не давал им освобождения от наказания за то, в чём они согрешили[b].
