lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь и
  rationale: Сочетание сохраняет пояснительную силу γάρ и добавочное усиление καί, естественно вводя продолжение мысли.
- source_word: τοὺς παλαιοὺς
  choice: древних
  rationale: Передаёт значение прежних, живших издревле людей без лишнего уточнения.
- source_word: οἰκήτορας
  choice: обитателей
  rationale: Точно обозначает живущих в определённом месте и соответствует достоинству контекста; «поселенцы» могло бы привнести не выраженную в греческом идею заселения.
- source_word: τῆς ἁγίας σου γῆς
  choice: Твоей святой земли
  rationale: В контексте γῆ означает конкретную землю, а не весь мир; притяжательное местоимение сохраняет прямое обращение к Богу.
theological_decisions:
- issue: Передавать ли γῆ широко как «земля» в значении мира или как конкретную территорию
  choice: Твоей святой земли
  alternative: Твоей святой Земли / Твоего святого края
  rationale: Речь идёт о конкретной земле в истории Израиля. Формулировка сохраняет географический смысл, не добавляя отсутствующих в тексте богословских уточнений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Фрагментарная синтаксическая форма сохранена, поскольку греческий стих продолжается в следующем стихе. «Твоей» написано с прописной буквы как традиционное уважительное обращение к Богу, без изменения смысла оригинала.
