  text: For even the ancient inhabitants of your holy land,[a]
translation:
  language: ru
  text: Ведь и древних обитателей Твоей святой земли[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто издревле жил в Твоей святой земле».'
