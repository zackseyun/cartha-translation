revisions:
- from: Ибо если даже врагов Твоих детей, заслуживавших смерти, Ты почтил столь великой заботой и долготерпением[a], дав им время и возможность избавиться от нечестия,
  to: Ибо если Ты с таким великим вниманием и мольбой отнёсся к врагам детей Твоих, заслуживающих смерти, дав им время и возможность, чтобы они избавились от нечестия,[a]
  rationale: Основной текст исправлен только там, где прежний вариант подменял значение δεήσεως. «Отнёсся к» естественно связывает «внимание и мольбу» с обращением к врагам и передаёт контекстуальное употребление ἐτίμησας без неестественного «почтил мольбой». Сноска перенесена к финальной целевой конструкции, чтобы также документировать пассивную форму ἀπαλλαγῶσι; значение δεήσεως уже отражено в основном тексте.
