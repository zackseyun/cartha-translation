base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/020.yaml
  text: For if you honored with such great care and forbearance the enemies of your children[a], even those deserving death, giving them time and opportunity by which they might be freed from wickedness,
translation:
  language: ru
  text: Ибо если Ты с таким великим вниманием и мольбой отнёсся к врагам детей Твоих, заслуживающих смерти, дав им время и возможность, чтобы они избавились от нечестия,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через которые они могли бы быть освобождены от нечестия». Греческое выражение «с ... мольбой» необычно в этом контексте; δεήσις означает «просьба, мольба, ходатайство».'
    reason: Сохраняет пассивный оттенок ἀπαλλαγῶσι и поясняет необычное, но лексически определённое значение δεήσεως, не подменяя его «долготерпением».
lexical_decisions:
- source_word: ἐχθροὺς παίδων σου
  choice: врагов Твоих детей
  rationale: Сохраняет прямое отношение родительного падежа и неоднозначность παῖς, которое может означать ребёнка, сына или слугу; в данном контексте «детей» естественно передаёт семейно-заветный оттенок.
- source_word: ὀφειλομένους θανάτῳ
  choice: заслуживавших смерти
  rationale: Передаёт судебный смысл обязанности или повинности смерти современным и понятным русским выражением.
- source_word: ἐτίμησας
  choice: Ты почтил
  rationale: Сохраняет основной смысл τιμάω — «почитать, удостаивать чести», хотя в данном контексте речь идёт о бережном и сдержанном обращении с виновными.
- source_word: μετὰ τοσαύτης προσοχῆς καὶ δεήσεως
  choice: столь великой заботой и долготерпением
  rationale: «Забота» передаёт προσοχή как внимательное отношение; «долготерпение» контекстуально выражает милостивую отсрочку суда, обозначенную здесь δεήσεως, при этом буквальная лексическая возможность вынесена в примечание.
- source_word: δοὺς χρόνους καὶ τόπον
  choice: дав им время и возможность
  rationale: Передаёт буквальные «времена и место» естественной русской идиомой, обозначающей предоставленные условия для нравственного изменения.
- source_word: ἀπαλλαγῶσι τῆς κακίας
  choice: избавиться от нечестия
  rationale: Глагол обозначает освобождение или избавление, а κακία — нравственное зло; «нечестие» уместно в возвышенном библейском регистре и не сводит смысл к одной лишь злонамеренности.
theological_decisions:
- issue: Смысл δεήσεως в описании отношения Бога к нечестивым
  choice: Контекстуально передано как «долготерпение».
  alternative: 'Более буквально: «мольба», «прошение» или «увещевание».'
  rationale: Буквальное «мольба» могло бы создать впечатление, будто Бог умолял осуждённых, тогда как ход рассуждения подчёркивает отсрочку наказания и предоставленную возможность оставить зло. Примечание сохраняет необычность и лексическую неоднозначность греческого выражения.
- issue: Субъект освобождения в ἀπαλλαγῶσι
  choice: Передано возвратным «избавиться», не уточняя способ избавления.
  alternative: «Чтобы они были освобождены».
  rationale: Русское «избавиться» естественно выражает прекращение связи с нечестием и не навязывает тексту подробной доктринальной схемы нравственного изменения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранена незавершённая синтаксическая форма стиха, поскольку придаточное условное предложение продолжается в следующем стихе. Местоимение «Твоих» и форма «Ты» написаны с прописной буквы как традиционное уважительное обращение к Богу.
