  text: Ни царь, ни тиран не сможет взглянуть Тебе в лицо по поводу тех, кого Ты наказал[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предстать перед Тобой» или «встретиться с Тобой взглядом»; редкий греческий глагол передаёт образ прямого столкновения лицом к лицу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε βασιλεὺς ἢ τύραννος
  choice: Ни царь, ни тиран
  rationale: Парная отрицательная конструкция естественно передаётся по-русски как «ни… ни…»; различие между обычным царским титулом и самовластным правителем сохранено.
- source_word: ἀντοφθαλμῆσαι
  choice: взглянуть Тебе в лицо
  rationale: Редкий глагол создаёт яркий образ непосредственной встречи лицом к лицу и одновременно подразумевает смелость открыто противостать; перевод сохраняет образ, не сводя его к судебной формуле.
- source_word: δυνήσεταί σοι
  choice: не сможет … Тебе
  rationale: Будущая форма передаёт невозможность такого противостояния, а дательный падеж обозначает того, с кем пытаются встретиться лицом к лицу.
- source_word: περὶ ὧν
  choice: из-за тех, кого
  rationale: Оборот допускает буквальное «относительно того, что», однако в контексте естественно относится к людям, подвергшимся наказанию. «Из-за тех, кого» ясно выражает повод для предполагаемого противостояния, сохраняя личное прочтение.
- source_word: ἐκόλασας
  choice: Ты наказал
  rationale: Глагол здесь обозначает карательное действие Божьего суда; «наказал» точнее, чем более узкие «исправил» или «наставил».
theological_decisions:
- issue: Смысл образа непосредственного взгляда в обращении к Богу
  choice: Ни один земной властитель не способен прямо противостать Богу из-за Его наказаний.
  alternative: Ни один властитель не может призвать Бога к ответу или оспорить Его суд.
  rationale: Греческий глагол подразумевает прямое столкновение лицом к лицу, но сам по себе не формулирует законченной юридической идеи. Образ сохранён, а подразумеваемый смысл не превращён в явное толкование.
- issue: Референт περὶ ὧν
  choice: Люди, которых Бог наказал.
  alternative: Дела или обстоятельства, за которые Бог наказал.
  rationale: Форма относительного местоимения допускает некоторую неоднозначность, но ближайший контекст и смысл фразы поддерживают личный референт. Сноска не требуется, поскольку основной перевод остаётся смыслово точным и естественным.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для обращения к Богу. Прописные формы «Тебе» и «Ты» обозначают адресата молитвенной речи. Выражение «взглянуть Тебе в лицо» сохраняет конкретный греческий образ; сноска раскрывает подразумеваемое противостояние.
