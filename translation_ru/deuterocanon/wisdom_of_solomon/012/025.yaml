lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт выводное значение выражения и естественно связывает стих с предшествующим рассуждением.
- source_word: ὡς παισὶν ἀλογίστοις
  choice: словно неразумным детям
  rationale: 'Сохраняет сравнительную силу ὡς: речь идёт об обращении с ними как с детьми, лишёнными рассудительности, а не об их буквальном возрасте.'
- source_word: τὴν κρίσιν
  choice: суд
  rationale: Сохраняет судебный и карательный оттенки κρίσις, не сужая значение до одного лишь наказания или приговора.
- source_word: εἰς ἐμπαιγμόν
  choice: в посмеяние
  rationale: Передаёт направленность или результат, выраженные εἰς, и сохраняет резкую риторическую окраску ἐμπαιγμός; конструкция имеет уместное библейское достоинство и понятна современному читателю.
- source_word: ἔπεμψας
  choice: послал
  rationale: Сохраняет конкретный образ исходного глагола πέμπω, не заменяя его истолковывающим «навёл» или «подверг».
theological_decisions:
- issue: Является ли выражение о неразумных детях буквальным определением или сравнением
  choice: 'Сравнение: Бог обращается с ними словно с неразумными детьми.'
  alternative: «как неразумным детям», что по-русски может звучать несколько более прямо и оставлять меньше явного указания на уподобление
  rationale: ὡς допускает сравнительное понимание; «словно» ясно сохраняет риторическое уподобление и не превращает его в утверждение о буквальном возрасте.
- issue: Следует ли конкретизировать κρίσις как наказание
  choice: суд
  alternative: наказание; приговор
  rationale: «Суд» сохраняет широту греческого судебного термина и не вводит более узкого богословского истолкования.
- issue: Как понимать εἰς ἐμπαιγμόν
  choice: в посмеяние
  alternative: для осмеяния; как посмешище
  rationale: Греческая конструкция допускает оттенки цели и результата. Основной текст сохраняет эту напряжённость, не уточняя, кто именно осмеивает и является ли осмеяние целью или следствием суда.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Заглавное «Ты» отражает прямое обращение к Богу. Оборот «в посмеяние» выбран ради краткости и сохранения неоднозначности исходной конструкции.
