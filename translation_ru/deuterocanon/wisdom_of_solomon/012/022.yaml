base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/022.yaml
  text: So, while disciplining us, you scourge our enemies by the ten thousands, so that when we judge we may reflect on your goodness, and when we are judged we may expect mercy.
translation:
  language: ru
  text: Итак, наставляя нас, Ты бичуешь наших врагов бесчисленными ударами[a], чтобы, судя, мы размышляли о Твоей благости, а когда судят нас — ожидали милости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несметным числом ударов»; греческое выражение подчёркивает огромное число либо чрезвычайную суровость бичевания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύων
  choice: наставляя
  rationale: 'Передаёт исправительно-воспитательный смысл причастия: речь не только о наказании, но и о нравственном научении.'
- source_word: ἐν μυριότητι μαστιγοῖς
  choice: бесчисленными бичами
  rationale: Сохраняет образ ударов бичом и передаёт идиоматическое указание на их огромное число или чрезвычайную суровость без неестественного буквального оборота.
- source_word: μεριμνῶμεν
  choice: помышляли
  rationale: В данном контексте глагол означает внимательное нравственное размышление и заботливое принятие во внимание, а не тревогу.
- source_word: κρίνοντες
  choice: судя других
  rationale: Передаёт обстоятельственное причастие и делает подразумеваемый объект суда естественно понятным по-русски.
- source_word: κρινόμενοι
  choice: когда судят нас
  rationale: Сохраняет пассивное значение и параллельный контраст между тем, как люди судят, и тем, как судят их самих.
- source_word: προσδοκῶμεν ἔλεος
  choice: ожидали милости
  rationale: Передаёт ожидание милости, не усиливая его до гарантированной уверенности и не ослабляя до одного лишь желания.
- source_word: ἀγαθότητα
  choice: благости
  rationale: «Благость» охватывает как нравственную доброту, так и благожелательность Бога и соответствует возвышенному, но понятному библейскому регистру.
theological_decisions:
- issue: Соотношение Божьего наставления «нас» и поражения «наших врагов»
  choice: Бог исправительно наставляет Свой народ, тогда как врагов поражает бесчисленными бичами.
  alternative: Слова о бесчисленных ударах можно было бы отнести к наказанию «нас».
  rationale: Греческий синтаксис естественнее всего связывает ἡμᾶς с παιδεύων, а τοὺς ἐχθροὺς ἡμῶν — с μαστιγοῖς; так сохраняется контраст между воспитательным воздействием и суровым судом.
- issue: Смысл μεριμνῶμεν перед «Твоей благостью»
  choice: При вынесении суда следует размышлять о Божьей благости и принимать её во внимание.
  alternative: Глагол может подчёркивать заботу о Божьей благости или внимательность к ней.
  rationale: Буквальное значение, связанное с тревогой, здесь по-русски вводило бы в заблуждение; «помышляли» сохраняет нравственную направленность фразы, не устраняя её смысловой широты.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Ты» и притяжательное «Твоей» написаны с прописной буквы как обращение к Богу. Параллелизм «судя других… когда судят нас» сохранён в естественной русской форме.
