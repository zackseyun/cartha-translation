base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/023.yaml
  text: Therefore you also tormented[a], through their own abominations, those unrighteous men who had lived in the folly of life.
translation:
  language: ru
  text: Поэтому и неправедных, проживших жизнь в безрассудстве, Ты подверг мучениям посредством их собственных мерзостей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредством их собственных отвратительных дел». Греческое слово может широко обозначать мерзкие вещи, включая идолопоклоннические действия или предметы.'
    reason: Лексическая неоднозначность слова βδελύγματα и возможный диапазон обозначаемых им действий или предметов.
lexical_decisions:
- source_word: ὅθεν καὶ
  choice: Поэтому и
  rationale: Передаёт вывод из предшествующего рассуждения и добавочное значение καί.
- source_word: τοὺς ... ἀδίκους
  choice: неправедных
  rationale: Субстантивированное прилагательное обозначает людей, отличающихся неправедностью; русский вариант не требует добавления слова «людей».
- source_word: ἐν ἀφροσύνῃ ζωῆς βιώσαντας
  choice: проживших жизнь в безрассудстве
  rationale: Сохраняет значение завершённого образа жизни и существительное ἀφροσύνη — «безрассудство», не сводя выражение к отдельным глупым поступкам.
- source_word: διὰ τῶν ἰδίων ... βδελυγμάτων
  choice: посредством их собственных мерзостей
  rationale: διά с родительным падежом здесь естественно выражает средство; βδελύγματα оставлено широким по значению и может охватывать мерзкие дела, обряды или предметы.
- source_word: ἐβασάνισας
  choice: Ты подверг мучениям
  rationale: Передаёт сильное значение βασανίζω в контексте суда, не ослабляя его до общего «наказал».
theological_decisions:
- issue: Характер воздаяния в выражении διὰ τῶν ἰδίων βδελυγμάτων
  choice: Бог подверг их мучениям посредством их собственных мерзостей.
  alternative: Бог наказал их за их мерзости; Бог наказал их через существ или идолов, связанных с их мерзостями.
  rationale: Греческая конструкция прежде всего указывает на средство наказания, но стих не уточняет его механизм. Перевод сохраняет эту неопределённость и идею соответствующего проступкам воздаяния.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Обращение к Богу передано традиционным прописным «Ты»; порядок слов сохраняет логический акцент и остаётся естественным.
