base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/018.yaml
  text: But you[a], being master of strength, judge with gentleness, and with great forbearance you govern us[b]; for the power is yours whenever you will.
translation:
  language: ru
  text: Но Ты, владычествуя над силой, судишь со снисхождением[a] и с великой сдержанностью управляешь нами; ведь способность действовать всегда находится в Твоём распоряжении, когда бы Ты ни пожелал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с кротостью» либо «с мягкой справедливостью»; греческое слово может обозначать мягкость, снисходительность и справедливость, учитывающую обстоятельства.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ведь у Тебя имеется возможность, когда бы Ты ни пожелал», то есть способность действовать всегда находится в Твоём распоряжении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόζων ἰσχύος
  choice: владычествуя над силой
  rationale: Причастие δεσπόζων передаёт господство или полновластное распоряжение, а ἰσχύος обозначает силу. Такое сочетание сохраняет активный смысл греческого выражения и не смешивает ἰσχύς с последующим τὸ δύνασθαι.
- source_word: ἐν ἐπιεικείᾳ
  choice: со снисхождением
  rationale: ἐπιείκεια может означать мягкость, снисходительность и умеренную справедливость. «Со снисхождением» естественно передаёт добровольную мягкость сильного судьи.
- source_word: κρίνεις
  choice: судишь
  rationale: Сохранено прямое судебное значение обычного греческого глагола.
- source_word: μετὰ πολλῆς φειδοῦς
  choice: с великой сдержанностью
  rationale: φειδώ обозначает бережное, щадящее обращение и воздержание от полного применения силы. «Сдержанность» передаёт эту меру, не усиливая значение до богословски нагруженного «милосердия».
- source_word: διοικεῖς ἡμᾶς
  choice: управляешь нами
  rationale: διοικεῖς означает управлять, устраивать или заведовать; явное местоимение ἡμᾶς сохранено как «нами».
- source_word: πάρεστιν γάρ σοι ... τὸ δύνασθαι
  choice: ведь способность действовать в Твоём распоряжении
  rationale: Субстантивированный инфинитив τὸ δύνασθαι означает возможность или способность, а πάρεστιν σοι — её наличность и доступность. Русская формулировка передаёт готовую к осуществлению способность без неестественной кальки.
- source_word: ὅταν θέλῃς
  choice: когда бы Ты ни пожелал
  rationale: Оборот выражает неограниченную повторяемость и зависимость действия исключительно от Божьего желания.
theological_decisions:
- issue: Сочетание всевластной силы с мягкостью суда
  choice: Сохранено противопоставление господства над силой и добровольно сдержанного суда и управления.
  alternative: Передать стих преимущественно языком абсолютной власти либо усилить φειδώ до «милосердия».
  rationale: Греческий текст намеренно соединяет полную способность действовать с мягкостью и сдержанностью; перевод не превращает силу в суровость, а сдержанность — в бессилие.
- issue: Объект управления ἡμᾶς
  choice: Сохранено буквальное «нами».
  alternative: Обобщить до «всем» или подразумевать всё творение.
  rationale: Первое лицо множественного числа явно присутствует в источнике и включает говорящего и его общину.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные местоимения при обращении к Богу сохранены как принятая русская издательская норма; синтаксис остаётся ясным для широкого читателя.
