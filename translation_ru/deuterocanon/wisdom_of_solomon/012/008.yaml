base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/008.yaml
  text: But even these[a], since they were human beings, you spared, and you sent hornets ahead as forerunners of your army, so that they might destroy them little by little[c][b];
translation:
  language: ru
  text: Но и их Ты пощадил как людей[a] и послал шершней[b] как предвестников Своего войска[c], чтобы они постепенно истребили их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поскольку они были людьми». Греческое выражение может указывать на их человеческую природу как на основание Божьей пощады.'
    reason: lexical_alternative
  - marker: b
    text: Образ шершней, посылаемых Богом впереди Израиля против враждебных народов, встречается также в Исх. 23:28; Втор. 7:20; Нав. 24:12.
    reason: cross_reference
  - marker: c
    text: 'Или: «лагеря». Греческое слово может означать как «войско», так и «военный лагерь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ τούτων
  choice: Но и их
  rationale: Передаёт противопоставительно-присоединительное ἀλλὰ καί и отсылку τούτων к ранее упомянутому народу.
- source_word: ὡς ἀνθρώπων
  choice: как людей
  rationale: Формально сохраняет ёмкую конструкцию ὡς с родительным и не сводит её однозначно к причинному значению; в контексте она указывает, что Бог щадил их, принимая во внимание их человеческую природу.
- source_word: ἐφείσω
  choice: ты пощадил
  rationale: Естественно и точно передаёт значение воздержания от немедленного причинения вреда или уничтожения.
- source_word: ἀπέστειλάς τε
  choice: и послал
  rationale: Передаёт аорист и соединительную силу τε без ненужного утяжеления.
- source_word: προδρόμους
  choice: предвестников
  rationale: Сохраняет образ тех, кто идёт впереди основной силы; зависимость от «войска» выражена местоимением «его».
- source_word: τοῦ στρατοπέδου σου
  choice: своим войском
  rationale: στρατόπεδον может означать как военный лагерь, так и войско; «войско» естественнее в данном образе наступающей силы.
- source_word: σφῆκας
  choice: шершней
  rationale: Традиционный и контекстуально уместный русский эквивалент, сохраняющий библейский образ жалящих насекомых, посланных впереди Израиля.
- source_word: ἵνα αὐτοὺς κατὰ βραχὺ ἐξολεθρεύσωσιν
  choice: чтобы они истребляли их понемногу
  rationale: «Чтобы» передаёт цель, «понемногу» — постепенность κατὰ βραχύ, а «истребляли» сохраняет силу ἐξολεθρεύω.
theological_decisions:
- issue: Основание Божьей пощады
  choice: «как людей» сохраняет указание на человеческую природу как основание или обстоятельство пощады.
  alternative: «поскольку они были людьми» — явно причинное прочтение.
  rationale: Греческое ὡς ἀνθρώπων допускает причинный оттенок, но формулировка «как людей» лучше сохраняет её сжатость и некоторую неоднозначность.
- issue: Военный образ Божьего действия
  choice: «войско» сохраняет военную метафору.
  alternative: «лагерь» — другое словарное значение στρατόπεδον.
  rationale: В контексте шершней, идущих впереди, речь естественнее воспринимается как образ войска, а не его стоянки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным; местоимение «его» устраняет возможную связь «предвестников» непосредственно с адресатом. Подлинная неоднозначность ὡς ἀνθρώπων отмечена в сноске.
