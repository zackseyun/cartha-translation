  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/026.yaml
  text: But those who were not instructed by childish punishments will experience a judgment worthy of God[a][b].
translation:
  language: ru
  text: Те же, кого не вразумили детские наказания[a], испытают на себе суд, достойный Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лёгкие, почти игровые взыскания»; греческое выражение подчёркивает сравнительно мягкий, словно детский характер прежних исправительных мер.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «испытают суд, достойный Бога», то есть познают его, претерпев его. Слова «достойный Бога» могут также пониматься как указание на Божий суд или суд от Бога.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: παιγνίοις ἐπιτιμήσεως
  choice: детские наказания
  rationale: Сжатое греческое выражение обозначает сравнительно лёгкие, почти игровые меры взыскания. Перевод сохраняет образ детскости, а примечание поясняет возможные оттенки.
- source_word: μὴ νουθετηθέντες
  choice: кого не вразумили
  rationale: Νουθετέω выражает наставление через предостережение или исправление; «вразумить» естественно передаёт здесь одновременно педагогический и исправительный смысл пассива.
- source_word: ἀξίαν θεοῦ κρίσιν
  choice: суд, достойный Бога
  rationale: Так сохраняется наиболее вероятная связь ἀξίαν с κρίσιν и качественный оттенок родительного θεοῦ, без сведения выражения просто к «Божьему суду».
- source_word: πειράσουσιν
  choice: испытают на себе
  rationale: Буквально глагол означает «испытают, попробуют»; в контексте речь о познании суда через его претерпевание, что ясно выражено оборотом «на себе».
theological_decisions:
- issue: Значение θεοῦ в выражении ἀξίαν θεοῦ κρίσιν
  choice: «суд, достойный Бога» — суд, соответствующий Богу
  alternative: «достойный Божий суд» или «суд от Бога»
  rationale: Греческая конструкция допускает оттенки принадлежности или источника, однако положение ἀξίαν естественнее указывает на суд, подобающий Богу. Основной текст сохраняет эту напряжённую формулировку, а примечание отмечает неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка. «Детские наказания» сознательно сохраняет необычный образ оригинала и сопровождается пояснением; «испытают на себе» делает естественным контекстуальный смысл πειράσουσιν.
