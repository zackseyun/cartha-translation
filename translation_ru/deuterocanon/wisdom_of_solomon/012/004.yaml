lexical_decisions:
- source_word: μισήσας
  choice: возненавидев их
  rationale: Аористное причастие относится к Богу, а подразумеваемое дополнение — к прежним жителям святой земли из предыдущего стиха. Русское «их» восстанавливает необходимую контекстную связь, не перенося ненависть с людей исключительно на их поступки.
- source_word: ἐπὶ τῷ … πράσσειν
  choice: за … дела, которые они совершали
  rationale: Оборот выражает основание или причину ненависти. Такая формулировка естественна по-русски и передаёт деятельный смысл πράσσειν.
- source_word: ἔχθιστα
  choice: самые мерзостные
  rationale: Превосходная степень выражает крайнюю нравственную отвратительность; «мерзостные» звучит естественно, сильно и достойно в данном контексте.
- source_word: ἔργα
  choice: дела
  rationale: Прямое и ёмкое соответствие, сохраняющее нравственную оценку конкретных поступков.
- source_word: φαρμακειῶν
  choice: чародейство
  rationale: В данном культовом контексте слово обозначает прежде всего магические занятия, хотя может включать применение снадобий или ядов; неоднозначность отмечена в сноске.
- source_word: τελετὰς
  choice: обряды
  rationale: Широкое обозначение культовых церемоний, иногда посвятительных; перевод не сужает значение до конкретного мистериального культа.
- source_word: ἀνοσίους
  choice: нечестивые
  rationale: Передаёт нарушение священного и должного благочестия и естественно сочетается со словом «обряды».
theological_decisions:
- issue: К кому относится μισήσας и что является объектом ненависти
  choice: «возненавидев их» — Бог возненавидел прежних жителей за совершённые ими дела
  alternative: «ненавидя их дела» или «дела, которые Ты ненавидел»
  rationale: По синтаксису μισήσας относится к Богу, а его подразумеваемый объект — названные в предыдущем стихе жители. Перенос ненависти только на поступки смягчил бы подлинное напряжение греческого текста и изменил бы грамматическую связь.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Причастная форма сохраняет связь с предыдущим стихом; двоеточие ясно вводит перечень мерзостных дел. Все сноски отмечены в основном тексте.
