base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/012.yaml
  text: For who will say[b][a], “What have you done?” Or who will oppose your judgment? And who will bring a charge against you concerning the nations that you destroyed? Or who will come before you as an avenger against unrighteous men?
translation:
  language: ru
  text: 'Ибо кто скажет: «Что Ты сделал?» Или кто воспротивится Твоему суду? Кто предъявит Тебе обвинение за народы, которые Ты погубил?[b] Или кто предстанет перед Тобой как мститель против неправедных людей?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто выступит против Тебя как мститель против несправедливых людей?» Греческий оборот, переведённый словами «предстанет перед Тобой», труден и может иметь более явно состязательный или судебный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «за погибшие народы, которые Ты сделал / с которыми Ты поступил». В контексте речь идёт о народах, которых Бог привёл к гибели; поэтому смысл сжатого греческого оборота передан словами «которые Ты погубил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐρεῖ
  choice: Ибо кто скажет
  rationale: Сохраняет пояснительное γάρ, будущее время и форму риторического вопроса.
- source_word: Τί ἐποίησας
  choice: Что Ты сделал?
  rationale: Прямая формула вызова; перевод не добавляет отсутствующего в греческом вопроса «зачем».
- source_word: ἀντιστήσεται τῷ κρίματί σου
  choice: воспротивится Твоему суду
  rationale: Передаёт активное противостояние Божьему судебному решению; «суд» сохраняет широту κρίμα.
- source_word: ἐγκαλέσει σοι
  choice: предъявит Тебе обвинение
  rationale: Сохраняет выраженный юридический смысл глагола.
- source_word: κατὰ ἐθνῶν ἀπολωλότων, ἃ σὺ ἐποίησας
  choice: за народы, которые Ты погубил
  rationale: 'Передаёт сжатую и трудную греческую конструкцию естественно по-русски: обвинение касалось бы народов, приведённых Богом к гибели. Неясность буквального оборота отмечена в сноске.'
- source_word: εἰς κατάστασίν σοι ἐλεύσεται
  choice: предстанет перед Тобой
  rationale: Передаёт образ выступления перед Богом, вероятно в состязательном или судебном смысле, не делая этот редкий оборот чрезмерно определённым.
- source_word: ἔκδικος κατὰ ἀδίκων ἀνθρώπων
  choice: как мститель за неправедных людей
  rationale: «Мститель» сохраняет личный и судебный оттенок ἔκδικος; «за неправедных людей» естественно выражает парадокс предполагаемого выступления в их защиту, при этом синтаксическая трудность отмечена в сноске.
theological_decisions:
- issue: Подотчётность Бога в риторических вопросах
  choice: 'Передать последовательность как сильное утверждение: никто не может предъявить Богу обвинение или успешно оспорить Его суд.'
  alternative: Ослабить смысл до одной лишь практической невозможности противостоять Богу.
  rationale: Повторяющееся τίς и судебная лексика утверждают неоспоримость Божьего суда, но перевод не добавляет отвлечённых философских положений.
- issue: ἀδίκων ἀνθρώπων и родовое обозначение людей
  choice: неправедных людей
  alternative: неправедных мужей
  rationale: ἄνθρωποι здесь обозначает людей как виновных в судебно-нравственном контексте, а не подчёркивает их мужской пол; «людей» точно и естественно передаёт референцию.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-судебного обращения. Заглавные формы «Ты», «Твоему», «Тебе», «Тобой» отмечают прямое обращение к Богу. Юридическая лексика сохранена без канцелярской перегрузки.
