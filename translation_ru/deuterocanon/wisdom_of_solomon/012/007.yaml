    text: 'Или: «достойную колонию». Греческое слово может обозначать колонию, поселение или поселившееся сообщество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое значение греческого союза естественной русской конструкцией.
- source_word: ἀξίαν ἀποικίαν
  choice: достойное поселение
  rationale: «Достойное» сохраняет оценочное значение ἀξίαν, а «поселение» передаёт ἀποικία как основанное на новом месте сообщество, не привнося современных политических ассоциаций слова «колония».
- source_word: δέξηται
  choice: приняла
  rationale: Передаёт значение «принять» без добавочного оттенка радушного приветствия; форма после «чтобы» естественно выражает цель.
- source_word: θεοῦ παίδων
  choice: Божьих детей
  rationale: παῖς допускает значение «ребёнок, дитя» без обязательного указания на мужской пол; контекст говорит о народе, принадлежащем Богу в семейном отношении.
- source_word: ἡ ... γῆ
  choice: земля
  rationale: Речь идёт о конкретной земле, предназначенной для Божьего народа, а не о земле как вселенной или планете.
- source_word: ἡ παρὰ σοὶ πασῶν τιμιωτάτη
  choice: земля, самая драгоценная для Тебя среди всех
  rationale: Сохраняет превосходную степень τιμιωτάτη и выраженную оборотом παρὰ σοὶ оценку с Божьей точки зрения.
theological_decisions:
- issue: Передача θεοῦ παίδων
  choice: Божьих детей
  alternative: сынов Божьих; слуг Божьих
  rationale: В данном контексте παῖς естественно обозначает детей Божьих как народ, поселяемый в земле. Перевод «сынов» неоправданно сужает значение по полу, а «слуг» снимает присутствующий семейный смысл.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимение «Тебя» написано с прописной буквы как обращённое к Богу. Порядок слов слегка перестроен ради ясности, при этом сохранены цель высказывания, Божья оценка земли и неоднозначность ἀποικία.
