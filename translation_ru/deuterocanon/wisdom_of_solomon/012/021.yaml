  text: with how much care you judged your sons[a], to whose fathers you gave oaths and covenants with good promises[c][b];
translation:
  language: ru
  text: С какой же тщательностью Ты судил Своих сыновей[a], отцам которых дал клятвы и заветы с благими обещаниями[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «С какой же строгостью Ты судил Своих сыновей»; греческое слово может указывать как на тщательность и точность, так и на строгость.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «клятвы и заветы, заключавшие благие обещания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πόσης ἀκριβείας
  choice: с какой же тщательностью
  rationale: Оборот передаёт усиленную, восклицательную форму греческой фразы и значение точности, строгости и особой заботливости; «тщательность» естественно звучит по-русски и не сводит смысл только к суровости.
- source_word: ἔκρινας
  choice: Ты судил
  rationale: Сохраняется судебно-нравственное значение κρίνω в контексте Божьего обращения с Израилем.
- source_word: τοὺς υἱούς σου
  choice: Своих сыновей
  rationale: Передаётся прямо выраженное мужское множественное число υἱούς и сохраняется библейский образ сыновства Израиля.
- source_word: ὧν τοῖς πατράσιν
  choice: отцам которых
  rationale: Относительная конструкция прямо связывает сыновей с их праотцами и естественно передаёт греческий дательный падеж.
- source_word: ὅρκους
  choice: клятвы
  rationale: Прямой эквивалент ὅρκους; термин сохраняется отдельно от следующего обозначения завета.
- source_word: συνθήκας
  choice: заветы
  rationale: В библейском контексте слово обозначает торжественные обязательства перед праотцами; «заветы» передаёт этот смысл лучше, чем нейтральные «соглашения».
- source_word: ἀγαθῶν ὑποσχέσεων
  choice: с благими обещаниями
  rationale: Формулировка естественна для современного русского языка и сохраняет связь клятв и заветов с обещанными благами, не устраняя возможную неоднозначность родительного оборота.
theological_decisions:
- issue: Сыновнее обозначение Израиля
  choice: Своих сыновей
  alternative: Своих детей
  rationale: Греческий текст содержит υἱούς («сыновей»), и буквальное обозначение сохраняет значимый образ заветного сыновства.
- issue: Различение терминов завета
  choice: клятвы и заветы
  alternative: клятвенные обещания
  rationale: Два греческих существительных переданы раздельно, чтобы не сглаживать накопление заветной лексики и богословский акцент на обязательствах Бога перед праотцами.
- issue: Связь благих обещаний с клятвами и заветами
  choice: клятвы и заветы с благими обещаниями
  alternative: клятвы и заветы, заключавшие благие обещания
  rationale: 'Сжатая конструкция сохраняет неоднозначность греческого родительного оборота: обещания могут пониматься как содержание либо как характеристика данных клятв и заветов.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Богу, написаны с прописной буквы. Восклицательная конструкция отражает усиленную форму μετὰ πόσης и риторический характер фразы.
