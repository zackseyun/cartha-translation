lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Союз поясняет основание предшествующей мысли; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: ἄφθαρτόν
  choice: нетленный
  rationale: Слово обозначает не подверженное тлению или разрушению; «нетленный» сохраняет онтологический смысл и соответствует возвышенному регистру книги.
- source_word: πνεῦμά σου
  choice: Твой Дух
  rationale: Контекст указывает на принадлежащий Богу животворящий и поддерживающий Дух. Заглавные буквы обозначают божественную отнесённость, не уточняя сверх текста позднейшую догматическую формулировку.
- source_word: ἐν πᾶσιν
  choice: во всём
  rationale: Форма πᾶσιν допускает краткое универсальное выражение; «во всём» естественно по-русски и не сужает смысл до одних лишь людей.
- source_word: ἐστιν
  choice: пребывает
  rationale: Буквально глагол означает «есть/находится». «Пребывает» естественно выражает устойчивое присутствие в данном возвышенном контексте, не добавляя идеи движения или действия.
theological_decisions:
- issue: Отнесённость и написание πνεῦμά σου
  choice: Твой Дух
  alternative: твой дух
  rationale: Контекст говорит о Божьем присутствии во всём творении. Написание с заглавной буквы обозначает божественный референт, но само по себе не навязывает более поздней догматической конкретизации.
- issue: Объём выражения ἐν πᾶσιν
  choice: во всём
  alternative: во всех
  rationale: «Во всём» передаёт вероятный средний род множественного числа и всеобщий охват творения; «во всех» может быть понято преимущественно как относящееся к лицам.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, библейски уместным регистром. Инверсия устранена ради естественности; связь с предшествующим контекстом сохранена словом «ведь».
