base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/010.yaml
  text: But in judging them little by little[a], you were giving room for repentance, not being unaware that their origin was evil and their wickedness innate, and that their way of thinking would never change forever[b],
translation:
  language: ru
  text: Но, судя их постепенно, Ты давал им возможность покаяться[a], зная, что их происхождение было злым[b], их порочность была врождённой и что образ их мыслей вовек не изменится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты давал им время для покаяния»; буквально: «давал место для покаяния».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рождение их было злым» или «род их был злым». Греческое γένεσις может означать происхождение, рождение или род.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνων δὲ κατὰ βραχύ
  choice: Но, судя их понемногу
  rationale: Сохраняет причастную конструкцию и постепенный характер суда, не уточняя без необходимости, идёт ли речь именно о наказании.
- source_word: ἐδίδους τόπον μετανοίας
  choice: Ты давал им место для покаяния
  rationale: Передаёт метафору τόπος («место, пространство») и одновременно понятный смысл предоставленной возможности покаяться.
- source_word: οὐκ ἀγνοῶν
  choice: зная при этом
  rationale: Естественно передаёт литоту «не не зная», то есть полную осведомлённость, без тяжеловесного буквального отрицания.
- source_word: πονηρὰ ἦ γένεσις αὐτῶν
  choice: происхождение их было злым
  rationale: γένεσις допускает значения происхождения, рождения или рода; «происхождение» сохраняет широту выражения и не усиливает биологический детерминизм.
- source_word: ἔμφυτος ἡ κακία αὐτῶν
  choice: порочность была им врождена
  rationale: «Врождена» точно передаёт ἔμφυτος, а «порочность» выражает нравственный смысл κακία в достойном современном регистре.
- source_word: ὁ λογισμὸς αὐτῶν
  choice: образ их мыслей
  rationale: Передаёт устойчивый склад мышления, а не единичное рассуждение или отдельный замысел.
- source_word: οὐ μὴ ἀλλαγῇ ... εἰς τὸν αἰῶνα
  choice: не изменится вовек
  rationale: Сильное отрицание οὐ μή и временная формула εἰς τὸν αἰῶνα переданы кратко и выразительно, с сохранением идеи окончательной неизменности.
theological_decisions:
- issue: Следует ли понимать стих как прямое утверждение о метафизической неспособности к покаянию
  choice: Сохранено напряжение между предоставленным местом для покаяния и утверждением, что образ их мыслей не изменится вовек.
  alternative: Истолковать врождённую порочность как позднейшую догматическую формулу о наследуемой вине или, напротив, ослабить её до простой склонности ко злу.
  rationale: Греческий текст резко говорит о злом происхождении, врождённой порочности и неизменности мышления, но сам не формулирует более поздние систематические категории.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавное «Ты» обозначает обращение к Богу. Синтаксис сохраняет движение греческого периода, но избегает неестественной русской кальки «не не зная».
