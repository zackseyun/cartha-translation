lexical_decisions:
- source_word: αὐθέντας
  choice: убивавших
  rationale: В данном контексте слово характеризует родителей как виновников кровопролития; причастная конструкция естественна по-русски и передаёт действие, не привнося позднего значения «властители».
- source_word: γονεῖς
  choice: родителей
  rationale: Обычное инклюзивное обозначение отцов и матерей; сохраняет семейный смысл контекста.
- source_word: ψυχῶν
  choice: жизни
  rationale: Здесь ψυχή конкретно указывает на жизнь живого существа, отнятую при убийстве, а не обязательно на нематериальную душу.
- source_word: ἀβοηθήτων
  choice: беззащитные
  rationale: Передаёт отсутствие помощи и защитника и естественно характеризует уязвимых жертв.
- source_word: ἐβουλήθης
  choice: Ты решил
  rationale: Выражает обдуманную волю и намерение; современная литературная формулировка без излишней архаичности.
- source_word: ἀπολέσαι
  choice: погубить
  rationale: Передаёт причинение гибели и судебное уничтожение, сохраняя широту греческого глагола.
- source_word: διὰ χειρῶν πατέρων ἡμῶν
  choice: руками наших отцов
  rationale: Сохраняет инструментальный смысл и яркую греческую идиому; «отцы» здесь обозначает предков Израиля.
theological_decisions:
- issue: Значение ψυχῶν ἀβοηθήτων
  choice: беззащитные жизни
  alternative: беззащитные души / беззащитные люди
  rationale: Контекст осуждает убийство, связанное с принесением детей в жертву. «Жизни» удерживает внимание на уязвимых жертвах и не навязывает позднейшего противопоставления души и тела.
- issue: Сила αὐθέντας
  choice: убивавших
  alternative: убийц
  rationale: Перевод сохраняет обвинительный смысл слова, но не усиливает его сверх необходимого; вариант «убийц» возможен и отражён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавное «Ты» употреблено как принятая русская форма почтительного обращения к Богу. Частица «даже» передаёт риторическое выделение группы, хотя прямого отдельного соответствия в греческом нет; она помогает естественно связать стих с предшествующим контекстом.
