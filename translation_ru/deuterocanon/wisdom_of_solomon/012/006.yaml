  text: И родителей, убивавших беззащитных людей,[a] Ты решил погубить руками наших отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родителей — убийц беззащитных душ». Греческое ψυχῶν может означать «души» или «людей»; в данном контексте оно, вероятно, относится к беззащитным жертвам и может быть передано по смыслу как «жизни».'
