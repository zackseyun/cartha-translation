lexical_decisions:
- source_word: οὐκ ἀδυνατῶν
  choice: не потому, что Ты не мог
  rationale: Отрицательная причастная конструкция указывает, что постепенность суда объяснялась не недостатком силы. В русском причинный смысл естественно выражается придаточным оборотом; обращение к Богу следует из контекста.
- source_word: ἐν παρατάξει
  choice: в сражении
  rationale: παράταξις обозначает боевое построение или само сражение; выбран ясный современный военный эквивалент.
- source_word: ἀσεβεῖς
  choice: нечестивых
  rationale: Слово обозначает людей, восстающих против благочестия и почитания Бога; «нечестивые» сохраняет религиозно-нравственный оттенок.
- source_word: ὑποχειρίους δοῦναι
  choice: покорить
  rationale: Оборот буквально описывает передачу под чью-либо руку, то есть подчинение власти. «Покорить» естественно передаёт итог такого действия в контексте сражения.
- source_word: θηρίοις δεινοῖς
  choice: свирепыми зверями
  rationale: Сочетание говорит о диких животных, внушающих страх; «свирепые звери» передаёт и опасность, и выразительность оригинала.
- source_word: λόγῳ ἀποτόμῳ
  choice: суровым словом
  rationale: ἀπότομος допускает значения «резкий», «суровый», «неумолимый». Выбор сохраняет образ могущественного Божьего слова, не сводя его однозначно к приказу.
- source_word: ὑφʼ ἓν
  choice: разом
  rationale: Греческая идиома означает совершение всего одним действием, сразу; краткое русское «разом» передаёт эту цельность.
- source_word: ἐκτρῖψαι
  choice: истребить
  rationale: Глагол выражает полное уничтожение; «истребить» сохраняет его сильное значение и соответствует возвышенному регистру.
theological_decisions:
- issue: Подразумеваемое подлежащее и причинный смысл причастной конструкции
  choice: 'Прямое обращение к Богу: «не потому, что Ты не мог»'
  alternative: 'Буквально: «не будучи бессильным»'
  rationale: Контекст обращён к Богу и противопоставляет Его силу постепенному суду. Русская формулировка ясно показывает, что сдержанность не была следствием бессилия, не добавляя нового богословского утверждения.
- issue: Характер выражения λόγῳ ἀποτόμῳ
  choice: «суровым словом» с сохранением образа слова
  alternative: «грозным повелением» или «разящим словом»
  rationale: Оригинал говорит именно о λόγος и допускает как буквальный образ острого слова, так и смысл строгого повеления. Основной текст не устраняет эту многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сохраняет связь со следующим контекстом, поэтому стих оканчивается точкой с запятой; местоимение «Ты» оформлено с прописной буквы как прямое обращение к Богу.
