base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/027.yaml
  text: For in the very things by which they themselves suffered and were indignant—those things they thought were gods—by these[a], while being punished, they saw and recognized as the true God the one whom they had formerly refused to know. Therefore also the final end of condemnation came upon them.
translation:
  language: ru
  text: Ибо, страдая от того самого, что они считали богами и чем возмущались, и будучи этим наказаны, они увидели и признали истинным Богом Того, Кого прежде отказывались знать.[a] Поэтому их постигло и окончательное осуждение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они поистине познали Бога, Которого прежде отказывались знать». Греческое слово, переведённое как «истинным», можно понять и наречно — «поистине».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφʼ οἷς ... ἐπὶ τούτοις ... ἐν αὐτοῖς
  choice: страдая от того самого... от того... и будучи этим наказаны
  rationale: 'Повтор указательных конструкций сохраняет риторическую связь: то, что они принимали за богов и чем возмущались, стало средством их наказания. Русская формулировка передаёт вероятный инструментальный смысл без неестественной буквальности.'
- source_word: ἠγανάκτουν
  choice: возмущались
  rationale: Глагол выражает сильное недовольство и негодование; «возмущались» естественно и достойно звучит в современном русском.
- source_word: οὓς ἐδόκουν θεούς
  choice: то, что считали богами
  rationale: Передаёт субъективную и ошибочную оценку язычников, сохраняя иронию контекста. Средний род согласуется с неопределённым обозначением явлений или существ, служивших предметами почитания.
- source_word: κολαζόμενοι
  choice: будучи ... наказаны
  rationale: Сохраняет страдательное причастное значение и не уточняет сверх текста ни характер, ни цель кары.
- source_word: ὧν πάλαι ἠρνοῦντο εἰδέναι θεὸν
  choice: Того, Кого прежде отказывались знать
  rationale: Передаёт временное πάλαι и волевой оттенок ἠρνοῦντο; местоименная конструкция делает сложную греческую фразу естественной по-русски.
- source_word: ἐπέγνωσαν ἀληθῆ
  choice: признали истинным Богом
  rationale: ἐπιγινώσκω здесь указывает на узнавание или признание, а ἀληθῆ вероятнее всего характеризует Бога как истинного в противопоставлении ложным богам.
- source_word: τὸ τέρμα τῆς καταδίκης
  choice: окончательный приговор осуждения
  rationale: Формулировка передаёт предельный, завершающий смысл τέρμα и судебный оттенок καταδίκη, не сводя выражение только к процессу наказания.
- source_word: ἐπʼ αὐτοὺς ἐπῆλθεν
  choice: их постиг
  rationale: Естественный русский эквивалент образа приговора или бедствия, пришедшего на людей.
theological_decisions:
- issue: Синтаксическая роль ἀληθῆ в сочетании θεὸν ἐπέγνωσαν ἀληθῆ
  choice: они признали истинным Богом Того, Кого прежде отказывались знать
  alternative: они поистине познали Бога, Которого прежде отказывались знать
  rationale: Форма ἀληθῆ допускает связь с θεόν («истинного Бога») и наречное понимание («поистине»). Контраст с тем, что они считали богами, поддерживает первое прочтение, но подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Сложный греческий период разделён тире и причастным оборотом, чтобы сохранить его риторическую структуру и сделать ход мысли понятным. Прописные буквы в «Того, Кого» употреблены как обычное русское почтительное обозначение Бога, без добавления конфессионально специфической терминологии.
