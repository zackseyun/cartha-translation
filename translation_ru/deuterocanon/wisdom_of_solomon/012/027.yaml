revisions:
- from: Ибо, страдая от того самого, чем они возмущались, — от того, что считали богами, — и будучи этим наказаны, они увидели и признали истинным Богом Того, Кого прежде отказывались знать.[a] Поэтому их постиг и окончательный приговор осуждения.
  to: Ибо, страдая от того самого, что они считали богами и чем возмущались, и будучи этим наказаны, они увидели и признали истинным Богом Того, Кого прежде отказывались знать.[a] Поэтому их постигло и окончательное осуждение.
  rationale: 'Перестроен первый период, чтобы недвусмысленно связать страдание, ложное признание богов и наказание с одними и теми же объектами, как в греческом повторе указательных конструкций. Заключительное выражение заменено на естественное «окончательное осуждение»: оно сохраняет τέρμα как указание на окончательность и καταδίκη как осуждение. Неоднозначность ἀληθῆ сохранена в сноске.'
