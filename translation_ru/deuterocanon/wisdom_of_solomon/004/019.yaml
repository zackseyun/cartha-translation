  naturalness: «Будут опустошены до конца» и «окажутся в мучении» звучат по-русски несколько неестественно. «Будут совершенно разорены» и «будут страдать» дают современное литературное звучание, сохраняя силу образа суда.
  terminology: «Бесчестный труп», «позор среди мёртвых», «безмолвными» и «память о них исчезнет» приемлемы. Местоимение субъекта следует писать со строчной буквы; это сохраняет неявность оригинала. Сноску о неявном субъекте следует поставить у самого местоимения, а не у слова «мучении».
  issues:
