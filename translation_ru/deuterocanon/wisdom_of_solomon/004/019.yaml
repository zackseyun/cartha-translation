base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/019.yaml
  text: And after this they will become a dishonored corpse and a reproach among the dead forever[a]. For he will dash them down headlong and speechless, and shake them from their foundations; they will be laid waste to the uttermost, and they will be in pain[b], and their memory will perish.
translation:
  language: ru
  text: А после этого они станут бесчестным трупом и вечным позором среди мёртвых[a]. Ибо он[b] низвергнет их ничком и безмолвными, сотрясёт их до самых оснований; они будут совершенно разорены, будут страдать, и память о них исчезнет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «павшим телом, лишённым чести». Греческое πτῶμα может означать падение или павшее тело, здесь подчёркивая позор их конца.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте субъект глаголов «низвергнет» и «сотрясёт» прямо не назван; по контексту речь идёт о Божьем суде.
    reason: implicit_subject
lexical_decisions:
- source_word: πτῶμα ἄτιμον
  choice: бесчестным трупом
  rationale: πτῶμα в контексте суда обозначает павшее тело, труп, а ἄτιμον подчёркивает лишение чести и позор. Сочетание сохраняет конкретность и резкость греческого образа.
- source_word: ὕβριν ἐν νεκροῖς
  choice: позором среди мёртвых
  rationale: Здесь ὕβρις передаёт состояние унижения и поругания, а ἐν νεκροῖς естественно означает «среди мёртвых».
- source_word: διʼ αἰῶνος
  choice: вечным
  rationale: В сочетании с «позором» прилагательная конструкция естественно передаёт длительную, неограниченную перспективу греческого оборота.
- source_word: ῥήξει ... πρηνεῖς
  choice: повергнет ... ничком
  rationale: ῥήξει выражает насильственное сокрушение или низвержение, а πρηνεῖς — положение лицом вниз. «Повергнет ничком» сохраняет образ и звучит естественно по-русски.
- source_word: ἀφώνους
  choice: безмолвными
  rationale: Слово может означать лишённых голоса или неспособных говорить. «Безмолвными» сохраняет обе возможности и соответствует возвышенному регистру.
- source_word: σαλεύσει ... ἐκ θεμελίων
  choice: поколеблет ... до основания
  rationale: Русский оборот передаёт насильственное расшатывание самых основ, выраженное греческой фразой, без излишне буквального «из оснований».
- source_word: ἕως ἐσχάτου χερσωθήσονται
  choice: будут опустошены до конца
  rationale: χερσόω обозначает доведение до запустения или бесплодия, а ἕως ἐσχάτου усиливает полноту действия. Перевод сохраняет метафору опустошения.
- source_word: ἐν ὀδύνῃ
  choice: в мучении
  rationale: ὀδύνη обозначает сильную боль или мучение; единственное число сохраняет форму и собирательную силу оригинала.
- source_word: ἡ μνήμη αὐτῶν ἀπολεῖται
  choice: память о них исчезнет
  rationale: Естественный русский эквивалент, точно передающий исчезновение памяти о них.
theological_decisions:
- issue: Неявный субъект глаголов суда
  choice: «Он повергнет… и поколеблет» без прямого именования
  alternative: «Бог повергнет… и поколеблет» либо безличная конструкция
  rationale: В греческом субъект выражен формами третьего лица единственного числа, но в данном предложении прямо не назван. Заглавная буква у местоимения в русском ясно указывает на Бога по контексту, не добавляя отсутствующего существительного.
