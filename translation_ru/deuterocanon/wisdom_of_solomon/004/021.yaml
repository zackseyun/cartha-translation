lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественно передаёт временную последовательность и связь с предшествующей сценой суда.
- source_word: στήσεται
  choice: предстанет
  rationale: Будущая форма среднего залога употреблена непереходно; «предстанет» естественно передаёт и стояние, и выступление в сцене оправдания, не вводя идеи принуждения.
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: с великой смелостью
  rationale: παρρησία здесь означает бесстрашие и открытую уверенность; «смелость» сохраняет публично-судебный оттенок, а πολλῇ — усиление.
- source_word: ὁ δίκαιος
  choice: праведник
  rationale: Русское существительное естественно сохраняет мужской род и единственное число греческого обозначения представительного праведного человека.
- source_word: κατὰ πρόσωπον
  choice: перед
  rationale: Идиоматически выражает непосредственное присутствие и противостояние; буквальный образ лица отмечен в сноске.
- source_word: τῶν θλιψάντων αὐτὸν
  choice: теми, кто притеснял его
  rationale: θλίβω обозначает причинение тягот, давление и враждебное угнетение; «притеснял» передаёт длительное враждебное обращение без неоправданного сужения смысла.
theological_decisions:
- issue: Представительный мужской род и единственное число в ὁ δίκαιος
  choice: праведник
  alternative: праведный человек; праведный
  rationale: Выбор сохраняет грамматическую форму и образ конкретного праведника, при этом по-русски может иметь представительное значение.
- issue: Характер будущего оправдания в στήσεται
  choice: предстанет
  alternative: будет поставлен; встанет
  rationale: Греческая форма здесь допускает непереходное значение. Перевод не уточняет, сам ли праведник занимает место или Бог ставит его, и тем самым не устраняет возможное богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для премудростной и судебной сцены. «Предстанет» и «с великой смелостью» ясны обычному читателю и сохраняют торжественный тон без архаизации.
