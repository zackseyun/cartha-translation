lexical_decisions:
- source_word: ἐλεύσονται
  choice: они придут
  rationale: Будущая форма ἔρχομαι передаёт приближение или явление; простое «придут» естественно сохраняет образ предстоящего суда.
- source_word: ἐν συλλογισμῷ ἁμαρτημάτων αὐτῶν
  choice: размышляя о своих грехах
  rationale: συλλογισμός обозначает рассуждение, обдумывание или внутренний расчёт. Деепричастный оборот естественно передаёт сопутствующий внутренний процесс, не добавляя прямо ни раскаяния, ни сожаления.
- source_word: δειλοί
  choice: в робости
  rationale: Предикативное δειλοί характеризует их как боязливых, оробевших. «В робости» сохраняет оттенок малодушного страха, не сводя значение к нейтральному чувству страха.
- source_word: ἐλέγξει
  choice: обличат
  rationale: ἐλέγχω здесь означает вывести вину наружу и доказательно изобличить. Русское «обличат» сохраняет одновременно нравственный и судебный оттенки.
- source_word: ἐξ ἐναντίας
  choice: лицом к лицу
  rationale: 'Выражение буквально указывает на положение напротив и в данном контексте рисует открытое противостояние: собственные дела непосредственно выступают против виновных.'
- source_word: τὰ ἀνομήματα αὐτῶν
  choice: их беззаконные дела
  rationale: ἀνόμημα — поступок, нарушающий закон. «Беззаконные дела» отличает это выражение от предшествующих «грехов» и сохраняет риторическое усиление.
theological_decisions:
- issue: Соотношение ἁμαρτήματα и ἀνομήματα
  choice: 'Передать разными выражениями: «грехи» и «беззаконные дела».'
  alternative: Оба слова перевести как «грехи» либо второе — как «беззакония».
  rationale: 'Греческий текст употребляет два близких, но не тождественных нравственных термина: сначала речь идёт о внутреннем размышлении над грехами, затем — о собственных противозаконных поступках как об обличающем свидетельстве.'
- issue: Характер обличения собственными делами
  choice: 'Сохранить олицетворение: сами беззаконные дела обличают совершивших их.'
  alternative: 'Переформулировать без олицетворения: «они будут обличены за свои беззаконные дела».'
  rationale: В исходном тексте τὰ ἀνομήματα является грамматическим субъектом ἐλέγξει. Сохранение этого образа подчёркивает, что поступки сами становятся свидетельством против виновных, не уточняя внешнего судью.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан плавным и понятным, при этом сохранены олицетворение беззаконных дел, различие двух нравственных терминов и неоднозначный оттенок δειλοί.
