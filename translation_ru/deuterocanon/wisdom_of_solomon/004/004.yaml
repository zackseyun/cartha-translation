  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/004.yaml
  text: For even if it puts forth shoots for a time in its branches[a], standing insecurely it will be shaken by the wind[b], and by the force of the winds it will be uprooted.
translation:
  language: ru
  text: Ибо, даже если оно на время пустит побеги в ветвях[a], то, непрочно держась, будет раскачано ветром[b] и силой ветров будет вырвано с корнем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «вновь расцветёт» или «на короткое время зазеленеет»; греческое выражение сохраняет образ временного роста растения.'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «оно» продолжает растительный образ предыдущего стиха; сам предмет сравнения здесь прямо не назван.
    reason: cross_reference
lexical_decisions:
- source_word: κἂν
  choice: пусть даже
  rationale: Сочетание καὶ ἐάν вводит уступительное условие; «пусть даже» естественно передаёт его силу по-русски.
- source_word: ἐν κλάδοις
  choice: среди ветвей
  rationale: Предлог ἐν с множественным κλάδοις буквально указывает на рост среди ветвей; притяжательное местоимение в греческом не выражено.
- source_word: πρὸς καιρόν
  choice: на время
  rationale: Оборот обозначает ограниченную, временную продолжительность.
- source_word: ἀναθάλῃ
  choice: пустит побеги
  rationale: Глагол описывает появление новой растительности или побегов и сохраняет ботанический образ.
- source_word: ἐπισφαλῶς βεβηκότα
  choice: стоя непрочно
  rationale: Наречие выражает неустойчивость, а перфектное причастие — состояние стоящего или утвердившегося растения.
- source_word: σαλευθήσεται
  choice: зашатается
  rationale: Будущий пассив обозначает приведение в колебание; «зашатается» естественно передаёт действие ветра и неустойчивость растения.
- source_word: ὑπὸ βίας ἀνέμων
  choice: силой ветров
  rationale: Сохраняется существительное βία со значением силы или напора и множественное число «ветров».
- source_word: ἐκριζωθήσεται
  choice: будет вырвано с корнем
  rationale: Передаёт буквальный ботанический смысл искоренения и звучит естественно в современном русском языке.
theological_decisions:
- issue: Не названный прямо субъект единственного числа, продолжающий растительный образ предыдущего стиха
  choice: Передать местоимением «оно», не называя прямо ребёнка или потомство
  alternative: «они» либо явное «дитя/потомство»
  rationale: Греческие формы стоят в единственном числе, а существительное-субъект в этом стихе не повторено. Местоимение сохраняет связь с контекстом и не снимает образную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Синтаксис остаётся ясным, растительная метафора последовательно сохранена; добавлено только необходимое русское местоимение среднего рода.
