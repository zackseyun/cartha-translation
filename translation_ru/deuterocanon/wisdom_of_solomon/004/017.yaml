base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/017.yaml
  text: For they will see the end of the wise man[a], and will not understand what the Lord planned concerning him[b], or for what purpose he made him secure.
translation:
  language: ru
  text: Ведь они увидят кончину мудрого[a], но не поймут, что Господь замыслил о нём и для чего обеспечил ему безопасность[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конец мудрого». Греческое слово может означать как конец, так и смерть.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оградил его», «сохранил его в безопасности». В греческом тексте не уточняется, в чём именно состоит эта защищённость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: увидят
  rationale: Прямо передаёт будущее время ὁράω и естественно звучит по-русски.
- source_word: τελευτὴν
  choice: кончину
  rationale: В данном контексте слово указывает на смерть мудрого, но «кончина» сохраняет оттенок завершения жизненного пути; более широкая возможность отмечена в сноске.
- source_word: σοφοῦ
  choice: мудрого
  rationale: Субстантивированное прилагательное мужского рода передано формой, точно сохраняющей грамматику и личностный характер выражения.
- source_word: οὐ νοήσουσιν
  choice: не поймут
  rationale: Передаёт неспособность постичь смысл увиденного, а не простое отсутствие восприятия.
- source_word: ἐβουλεύσατο
  choice: замыслил
  rationale: Средний залог βουλεύω выражает намерение и обдуманный замысел; «замыслил» сохраняет это значение и достойный регистр.
- source_word: περὶ αὐτοῦ
  choice: о нём
  rationale: Естественно и точно передаёт περί с родительным падежом без навязывания значения «для него».
- source_word: εἰς τί
  choice: для чего
  rationale: Сохраняет направленность к цели, не раскрывая эту цель сверх сказанного в тексте.
- source_word: ἠσφαλίσατο
  choice: сделал его неуязвимым
  rationale: Передаёт каузативное значение «обеспечить безопасность, оградить» и сохраняет парадокс между видимой смертью и дарованной Господом подлинной защищённостью; возможные более нейтральные варианты указаны в сноске.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Устоявшееся русское обозначение Бога в библейском контексте.
theological_decisions:
- issue: Объём значения τελευτή применительно к мудрому
  choice: «кончина» с указанием варианта «конец» в сноске
  alternative: «конец» или «смерть»
  rationale: Контекст говорит о смерти праведного, однако значение завершения допускает более широкую перспективу. «Кончина» естественно соединяет оба оттенка, а сноска сохраняет лексическую неоднозначность.
- issue: Характер безопасности в ἠσφαλίσατο αὐτόν
  choice: «сделал его неуязвимым» с пояснением в сноске
  alternative: «оградил его», «сохранил его в безопасности», «защитил его»
  rationale: Греческий текст не уточняет способ или сферу этой безопасности. Формулировка сохраняет напряжение между увиденной кончиной и Божьим охранением, не сводя его к физическому спасению от смерти.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Связка «ведь… но» сохраняет объяснительно-противительный ход греческой фразы. Местоимения в отношении Бога не капитализированы; титул «Господь» дан с прописной буквы.
