  text: Ибо Его избранным — благодать и милость, а Его святым — посещение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «попечение», «надзор» или «бдительная забота». Греческое слово может означать Божье посещение или надзор; в этом контексте оно, по-видимому, имеет благожелательный оттенок заботы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Сохраняет богословскую весомость слова и естественно сочетается с «милостью».
- source_word: ἔλεος
  choice: милость
  rationale: Прямой и привычный русский эквивалент в контексте Божьего благоволения и сострадания.
- source_word: ἐκλεκτοῖς
  choice: избранных
  rationale: Точно передаёт значение «избранные», не добавляя более поздних конфессиональных оттенков.
- source_word: ἐπισκοπή
  choice: попечение
  rationale: В параллели с благодатью и милостью слово указывает прежде всего на благожелательную Божью заботу, но примечание сохраняет более широкое значение посещения и надзора.
- source_word: ὁσίοις
  choice: святых
  rationale: Прозрачно передаёт людей, отличающихся святостью и благочестием; контекст не требует более узкого «праведных» или конфессионально окрашенного обозначения.
- source_word: ἐν
  choice: на / о
  rationale: 'Различная русская передача одной греческой конструкции обусловлена естественной сочетаемостью: благодать и милость пребывают «на» людях, тогда как попечение осуществляется «о» них.'
theological_decisions:
- issue: Смысл Божьей ἐπισκοπή
  choice: благожелательное Божье попечение
  alternative: посещение, надзор или испытующее посещение, способное подразумевать суд
  rationale: Параллелизм с «благодатью и милостью» поддерживает положительный смысл заботы. Примечание, однако, сохраняет присущую греческому слову широту и не исключает оттенков посещения и надзора.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Симметрия двух частей сохранена; тире делает эллиптическую греческую конструкцию ясной без добавления глагола. Местоимение «Его» написано с прописной буквы по принятой русской библейской традиции.
