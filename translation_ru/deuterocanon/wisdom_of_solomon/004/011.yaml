lexical_decisions:
- source_word: ἡρπάγη
  choice: был взят
  rationale: Пассивная форма передаёт внезапное изъятие праведника, не уточняя прямо действующего лица; нейтральное «взят» сохраняет эту недосказанность.
- source_word: κακία
  choice: зло
  rationale: Широкое нравственное значение существительного естественно передаётся словом «зло», без неоправданного сужения до конкретного порока.
- source_word: ἀλλάξῃ
  choice: изменило
  rationale: Передаёт значение перемены или искажения, сохраняя прямую связь со словом «разумение».
- source_word: σύνεσιν
  choice: разумения
  rationale: «Разумение» обозначает способность понимать и рассуждать и соответствует возвышенному, но доступному регистру книги.
- source_word: δόλος
  choice: коварство
  rationale: Передаёт не просто ложь, а обманный умысел.
- source_word: ἀπατήσῃ
  choice: обмануло
  rationale: Прямо отражает значение введения в заблуждение и сохраняет образ воздействия на душу.
- source_word: ψυχὴν
  choice: душу
  rationale: Обычный библейский и литературный эквивалент ψυχή в контексте внутренней жизни человека.
theological_decisions:
- issue: Неуказанный деятель при ἡρπάγη
  choice: Сохранена пассивная конструкция «был взят»
  alternative: «Бог взял его» или «он был восхищен»
  rationale: Греческий текст не называет действующего лица; его прямое обозначение внесло бы толкование, а «восхищен» могло бы сузить смысл до особого способа взятия.
- issue: Цель или предотвращённая возможность в μή с сослагательным наклонением
  choice: «чтобы ... не»
  alternative: «дабы не» или «как бы не»
  rationale: Конструкция выражает предотвращение возможного пагубного воздействия; современное «чтобы не» ясно передаёт её без архаизации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм двух частей сохранён; архаизмы и конфессионально нагруженные уточнения исключены.
