translation:
  language: ru
  text: Но праведник, если и умрёт рано[a], будет в покое.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, буквальнее: «если достигнет смерти прежде [срока]»; греческий оборот, вероятно, означает, что он умрёт рано, прежде ожидаемого срока.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода обозначает отдельного человека, отличающегося праведностью; «праведник» естественно и точно передаёт эту форму.
- source_word: ἐὰν
  choice: если и
  rationale: 'Условный союз передан с частицей «и», поскольку в контексте условие имеет уступительный оттенок: праведник обретёт покой, даже если умрёт рано.'
- source_word: φθάσῃ τελευτῆσαι
  choice: умрёт рано
  rationale: Сочетание φθάνω с инфинитивом τελευτῆσαι здесь указывает на смерть раньше ожидаемого срока. Естественное русское выражение «умрёт рано» сохраняет смысл, не делая преждевременность нравственной оценкой.
- source_word: ἐν ἀναπαύσει ἔσται
  choice: обретёт покой
  rationale: Идиоматичная русская передача состояния покоя. Она сохраняет утешительный смысл и будущее время, не уточняя метафизическую природу этого покоя.
theological_decisions:
- issue: Следует ли передавать ἐν ἀναπαύσει термином, однозначно относящимся к загробной жизни
  choice: обретёт покой
  alternative: будет в мире; упокоится
  rationale: Греческий текст говорит о покое, но не раскрывает его метафизическую природу. Выбранная формулировка сохраняет богословскую открытость текста и не привносит более разработанного учения.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и утешительным звучанием. Частица «и» естественно передаёт контекстуальный уступительный оттенок, а «обретёт покой» избегает как неуклюжего буквализма, так и чрезмерной догматической конкретизации.
