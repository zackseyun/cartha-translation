base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/005.yaml
  text: Unfinished branches will be broken off[a], and their fruit is useless, unripe for eating and fit for nothing[b];
translation:
  language: ru
  text: Недоразвившиеся[a] ветви будут обломаны, и плод их будет бесполезен — незрел для еды и ни на что не годен[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «незавершённые ветви»; греческое слово обозначает то, что не достигло полноты или завершения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «несвоевременен для еды»; применительно к плоду выражение «незрел» лучше передаёт образ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περικλασθήσονται
  choice: будут обломаны
  rationale: Будущее страдательного залога указывает на предстоящее действие над ветвями; «обломаны» естественно передаёт их повреждение или отсечение.
- source_word: κλῶνες
  choice: ветви
  rationale: Обычное ботаническое значение сохраняет буквальный сельскохозяйственный образ.
- source_word: ἀτέλεστοι
  choice: недоразвившиеся
  rationale: Слово обозначает не достигшее завершённости; применительно к ветвям «недоразвившиеся» звучит естественно и сохраняет смысл незавершённого роста.
- source_word: καρπὸς
  choice: плод
  rationale: Прямое соответствие, сохраняющее образ ветвей и плода.
- source_word: ἄχρηστος
  choice: бесполезен
  rationale: Передаёт отсутствие пользы или пригодности без усиления до «ничтожен» или «никчёмен».
- source_word: ἄωρος
  choice: незрел
  rationale: В контексте плода и еды это наиболее естественное значение; возможный оттенок несвоевременности отмечен в сноске.
- source_word: εἰς βρῶσιν
  choice: для еды
  rationale: Ясно и естественно выражает непригодность плода к употреблению в пищу.
- source_word: εἰς οὐδὲν ἐπιτήδειος
  choice: ни на что не годен
  rationale: Современное идиоматическое выражение точно передаёт полную непригодность.
theological_decisions:
- issue: Метафорический смысл образов ветвей и плода
  choice: Сохранить буквальные образы ветвей и плода, не называя прямо потомство нечестивых.
  alternative: Разъяснить метафору в тексте как указание на потомство или детей.
  rationale: Сам стих формулирует мысль посредством растительного образа; его нравственный и антропологический смысл раскрывается контекстом. Эксплицитная замена образа толкованием сузила бы смысл.
translation_notes:
  register: Современный литературный русский язык; строй фразы dignified и доступный. Сохранены сельскохозяйственная метафора, страдательная конструкция и смысловое нарастание от бесполезности к полной непригодности.
