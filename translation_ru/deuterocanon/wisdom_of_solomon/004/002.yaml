base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/002.yaml
  text: When she is present[a], they imitate her, and they long for her when she has gone; and through the age she marches in triumph, wearing a victor’s wreath, having won the contest of the undefiled prizes.
translation:
  language: ru
  text: В её присутствии ей подражают, а после её ухода тоскуют по ней. И вовеки[a] она торжественно шествует, увенчанная победным венком, одержав победу в состязании за неосквернённые награды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во все века». Греческое выражение буквально означает «в веке» и может указывать на непреходящую славу.'
    reason: Лексическая неоднозначность выражения ἐν τῷ αἰῶνι.
lexical_decisions:
- source_word: παροῦσάν
  choice: когда она рядом
  rationale: Передаёт присутствие естественным современным русским выражением и сохраняет противопоставление последующему уходу.
- source_word: μιμοῦνται
  choice: ей подражают
  rationale: Прямо и ясно передаёт значение глагола — подражать, брать за образец.
- source_word: ποθοῦσιν
  choice: о ней тоскуют
  rationale: Выражает сильное желание и чувство утраты после её ухода, не ослабляя эмоциональной окраски греческого глагола.
- source_word: ἀπελθοῦσαν
  choice: когда она уходит
  rationale: Естественно передаёт уход как основание последующей тоски; русский вид позволяет прочесть действие в его контекстуальной завершённости.
- source_word: ἐν τῷ αἰῶνι
  choice: вовеки
  rationale: Кратко и естественно выражает непреходящую, охватывающую век славу, не превращая фразу в узко философское утверждение о метафизической вечности.
- source_word: στεφανηφοροῦσα
  choice: в венке победительницы
  rationale: Сохраняет образ победного венка и женскую персонификацию добродетели.
- source_word: πομπεύει
  choice: торжественно шествует
  rationale: Передаёт публичное триумфальное шествие без тяжеловесного буквального повтора слова «процессия».
- source_word: ἀμιάντων
  choice: неосквернённые
  rationale: Сохраняет нравственный оттенок чистоты и незапятнанности.
- source_word: ἄθλων
  choice: награды
  rationale: Обозначает награды, получаемые за победу в состязании, и поддерживает атлетическую образность.
- source_word: ἀγῶνα
  choice: состязание
  rationale: Передаёт атлетический контекст, не сужая образ до конкретного вида бега или борьбы.
- source_word: νικήσασα
  choice: одержав победу
  rationale: Передаёт завершённую победу, предшествующую триумфальному шествию.
theological_decisions:
- issue: К кому относятся местоимения женского рода
  choice: Сохранена женская персонификация добродетели из ближайшего контекста.
  alternative: 'Передать отвлечённо: «добродетель» или «благородство», повторяя существительное вместо местоимений.'
  rationale: Греческий текст продолжает персонификацию; местоименная форма сохраняет литературный образ и связь с предыдущим стихом.
- issue: Значение ἐν τῷ αἰῶνι
  choice: «вовеки» как обозначение непреходящей славы и торжества.
  alternative: «в течение века», «навечно», «в вечности».
  rationale: Фраза допускает как временно-протяжённое, так и усиленное значение постоянства. Основной текст звучит естественно, а примечание сохраняет широту греческого выражения.
