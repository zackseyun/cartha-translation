base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/001.yaml
  text: Better is childlessness with virtue[a], for immortality is in her memory[b], because she is known both by God and by men.
translation:
  language: ru
  text: Лучше бездетность, соединённая с добродетелью, ибо в памяти о ней — бессмертие[a], потому что она известна и Богу, и людям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «ней» естественнее всего относить к добродетели. Возможно также отнесение к бездетности или к подразумеваемой бездетной женщине.
    reason: alternative_reading
lexical_decisions:
- source_word: κρείσσων
  choice: Лучше
  rationale: Предикативная сравнительная форма выражает оценку; краткое «лучше» сохраняет характер изречения.
- source_word: ἀτεκνία
  choice: бездетность
  rationale: Обозначает отсутствие детей, не сводя смысл к физиологическому бесплодию.
- source_word: μετὰ ἀρετῆς
  choice: соединённая с добродетелью
  rationale: Передаёт сопутствующее нравственное качество и естественно согласуется в русском с существительным «бездетность».
- source_word: ἀθανασία γάρ ἐστιν ἐν μνήμῃ αὐτῆς
  choice: ведь память о ней бессмертна
  rationale: Естественная русская передача образного утверждения о бессмертии, заключённом в памяти; местоимение сохраняет неоднозначность женского антецедента.
- source_word: γινώσκεται
  choice: её признают
  rationale: В данном контексте передаёт не простую осведомлённость, а признание и почитание перед Богом и людьми.
- source_word: παρὰ θεῷ ... καὶ παρὰ ἀνθρώποις
  choice: и Бог, и люди
  rationale: Передаёт две сферы признания; ἄνθρωποι обозначает людей вообще, поэтому современное русское «люди» точнее, чем гендерно ограниченное «мужчины».
theological_decisions:
- issue: К чему относится αὐτῆς в выражении ἐν μνήμῃ αὐτῆς и подразумеваемый объект γινώσκεται
  choice: Основное прочтение связывает местоимение с добродетелью.
  alternative: Местоимение может относиться к бездетности, представленной как женский образ, либо к подразумеваемой бездетной женщине.
  rationale: Ближайший антецедент — ἀρετή, и ход мысли лучше объясняется непреходящей памятью о добродетели. Однако грамматический женский род допускает другие связи, поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский, сдержанный и афористичный. Формулировка «память о ней бессмертна» естественнее буквального «бессмертие — в памяти о ней» и сохраняет метафору. Маркер сноски поставлен непосредственно при неоднозначном местоимении.
