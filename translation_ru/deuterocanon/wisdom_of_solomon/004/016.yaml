base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/016.yaml
  text: But the righteous one[a], though dead, will condemn the living ungodly[b]; and youth brought to completion quickly will condemn the many-year old age of the unrighteous.
translation:
  language: ru
  text: Но праведник, умерев, осудит живых нечестивцев, и юность, быстро достигшая полноты, осудит многолетнюю старость неправедного.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακρινεῖ
  choice: осудит
  rationale: Будущее время глагола передаёт вынесение осуждающего приговора; «осудит» кратко и естественно сохраняет этот смысл.
- source_word: δίκαιος
  choice: праведник
  rationale: Субстантивированное прилагательное в единственном числе естественно передаётся личным существительным «праведник».
- source_word: καμών
  choice: умерев
  rationale: В контексте ранней смерти праведника причастие κάμνω обозначает смерть; деепричастие сохраняет временную и возможную уступительную неоднозначность, не добавляя союза «хотя».
- source_word: τοὺς ζῶντας ἀσεβεῖς
  choice: живых нечестивцев
  rationale: Фраза противопоставляет умершего праведника всё ещё живущим людям, отличающимся нечестием.
- source_word: νεότης
  choice: юность
  rationale: Прямой и естественный эквивалент νεότης, сохраняющий противопоставление старости.
- source_word: τελεσθεῖσα
  choice: достигшая полноты
  rationale: Передаёт идею завершённости и осуществлённости, не сводя её ни к физической зрелости, ни к безгрешному совершенству.
- source_word: ταχέως
  choice: быстро
  rationale: Прямо передаёт быстроту наступления завершённости.
- source_word: πολυετὲς γῆρας
  choice: многолетнюю старость
  rationale: Сохраняет необычное, но понятное буквальное противопоставление краткой юности и старости многих лет.
- source_word: ἀδίκου
  choice: неправедного
  rationale: Генитив указывает на человека, которому принадлежит старость; «неправедного» сохраняет лексическое противопоставление слову «праведник».
theological_decisions:
- issue: Значение καμών в контексте
  choice: умерев
  alternative: хотя и умер; после смерти
  rationale: Контекст главы говорит о ранней смерти праведника. «Умерев» ясно выражает смерть, но не закрепляет только уступительное или только временное отношение.
- issue: Передача τελεσθεῖσα языком совершенства
  choice: достигшая полноты
  alternative: быстро завершившаяся; быстро достигшая совершенства
  rationale: Выбранная формулировка сохраняет телеологическую идею достижения полноты, не навязывая современного смысла абсолютной нравственной безупречности.
- issue: Подразумеваемый глагол во второй части
  choice: осудит восстановлено посредством тире
  alternative: прямо повторить «осудит»
  rationale: В греческом общий глагол κατακρινεῖ относится и ко второй паре противопоставленных понятий. Русское тире естественно обозначает эллипсис и сохраняет компактный параллелизм.
translation_notes:
  register: 'Современный литературный русский язык; достоинство и афористический параллелизм оригинала сохранены. Формулировка остаётся близкой к греческому синтаксису, но звучит естественно. Сноски не требуются: значимые неоднозначности отражены непосредственно в тексте и решениях.'
