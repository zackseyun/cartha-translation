  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/014.yaml
  text: For his soul was pleasing to the Lord; therefore he hastened him out of the midst of wickedness. But the peoples, seeing and not understanding, nor taking such a thing to heart,
translation:
  language: ru
  text: Ибо душа его была угодна Господу, поэтому Он поспешил увести его из среды зла.[a] Народы же видели, но не поняли и не приняли этого во внимание,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он поспешил увести его из среды нечестия». Греческий глагол подчёркивает поспешность, а πονηρία может означать как зло вообще, так и нравственную порочность или нечестие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρεστὴ ... Κυρίῳ
  choice: угодна Господу
  rationale: Естественно и точно передаёт значение «приятна, угодна» и направленность отношения к Господу.
- source_word: ἡ ψυχὴ αὐτοῦ
  choice: душа его
  rationale: Сохраняет антропологическую и богословскую весомость ψυχή, не сужая смысл до одной лишь физической жизни.
- source_word: ἔσπευσεν
  choice: Он поспешил увести его
  rationale: Передаёт заложенную в глаголе идею поспешности; местоимение «Он» обозначает подразумеваемого субъекта — Господа.
- source_word: ἐκ μέσου πονηρίας
  choice: из среды зла
  rationale: Сохраняет пространственную метафору ἐκ μέσου и допускаемый контекстом широкий нравственный смысл πονηρία.
- source_word: οἱ δὲ λαοί
  choice: народы же
  rationale: Сохраняет грамматическое множественное число λαοί и противопоставление, выраженное δέ.
- source_word: ἰδόντες καὶ μὴ νοήσαντες
  choice: видели, но не поняли
  rationale: Естественная русская конструкция ясно передаёт контраст между видением и непониманием.
- source_word: μηδὲ θέντες ἐπὶ διανοίᾳ
  choice: и не приняли ... к сердцу
  rationale: Русский идиом точно выражает осмысленное внутреннее принятие и серьёзное размышление, подразумеваемые греческим оборотом.
- source_word: τὸ τοιοῦτο
  choice: этого
  rationale: Местоимение естественно отсылает ко всему только что описанному Божьему действию, не добавляя толкования.
theological_decisions:
- issue: Подразумеваемое подлежащее при ἔσπευσεν
  choice: Господь подразумевается как действующее лицо; в переводе это выражено местоимением «Он».
  alternative: 'Безличное выражение: «поэтому его поспешно увели».'
  rationale: Ближайшее названное действующее лицо — Господь, а контекст представляет удаление праведника как Божье действие. Заглавная буква помогает обозначить отсылку, не добавляя имени в сам текст.
- issue: Смысл πονηρία
  choice: зло
  alternative: нечестие; порочность
  rationale: «Зло» сохраняет широкое значение слова и не ограничивает его только нравами людей или личной порочностью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены синтаксическая незавершённость стиха и запятая в конце, поскольку мысль продолжается в следующем стихе; множественное число «народы» следует греческому οἱ λαοί.
