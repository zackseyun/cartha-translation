  text: Ведь седина для людей — благоразумие, а незапятнанная жизнь — это возраст старости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολιὰ
  choice: седина
  rationale: Передаёт образ седых волос как традиционного признака преклонного возраста.
- source_word: φρόνησις
  choice: благоразумие
  rationale: Обозначает практическую рассудительность и здравое суждение; это точнее, чем более широкое «мудрость».
- source_word: ἀνθρώποις
  choice: для людей
  rationale: Греческое слово относится к людям вообще, без необходимости ограничивать смысл мужчинами.
- source_word: ἡλικία γήρως
  choice: возраст старости
  rationale: Сохраняет намеренно парадоксальную формулировку оригинала и параллель между физическим возрастом и нравственной жизнью.
- source_word: βίος ἀκηλίδωτος
  choice: незапятнанная жизнь
  rationale: Сохраняет образ жизни без пятна или нравственного порока.
theological_decisions:
- issue: Переосмысление признаков почтенной старости
  choice: Сохранить прямое отождествление седины с благоразумием, а возраста старости — с незапятнанной жизнью.
  alternative: Разъяснить смысл как «истинная седина» и «подлинная старость».
  rationale: Оригинал выражается парадоксально и не вводит уточняющих слов «истинная» или «подлинная»; перевод не должен устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. Синтаксический параллелизм греческого текста сохранён; формулировка «возраст старости» оставлена ради точности и смыслового напряжения.
