review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: ἀνόμων ὕπνων — эвфемистическое обозначение недозволенных отношений, а τέκνα γεννώμενα — дети, рождённые от них. Однако «становятся свидетелями» вносит не выраженный в греческом переходный оттенок: μάρτυρές εἰσιν означает «являются свидетелями» / «служат свидетельством». Формулировка «при испытании» также неудачна по-русски и может создавать впечатление физического испытания; ἐξετασμός — проверка, исследование, разбирательство, в том числе судебное.'
  naturalness: «Беззаконные связи» и «порочность» уместны в современном литературном библейском регистре. «Служат свидетельством» естественнее, чем «становятся свидетелями», а «во время разбирательства» яснее передаёт судебно-исследовательский оттенок без неестественного оборота «при испытании».
  terminology: «Беззаконные», «свидетельство», «порочность» и «разбирательство» сохраняют нравственно-правовой и судебный регистр оригинала. В основном тексте выражено направленное против родителей значение κατά; сноска отмечает менее эксплицитный вариант. Неоднозначность αὐτῶν не разрешается догматически и объясняется в примечании.
