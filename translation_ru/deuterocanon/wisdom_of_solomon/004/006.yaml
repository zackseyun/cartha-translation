  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/006.yaml
  text: For children born from lawless unions are witnesses of their parents’ wickedness at their examination[a][b][c].
translation:
  language: ru
  text: Ибо дети, рождённые от беззаконных связей, служат свидетельством против своих родителей, обличая их порочность во время разбирательства[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от беззаконных лож»; это греческий эвфемизм для недозволенных половых отношений.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «являются свидетелями порочности своих родителей».'
    reason: alternative_reading
  - marker: c
    text: Слово, переведённое как «разбирательство», может означать также «расследование», «проверку» или «рассмотрение дела». Греческое местоимение «их» может относиться либо к детям, либо к родителям.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμων
  choice: беззаконных
  rationale: Прилагательное обозначает противное закону и нравственному порядку; «беззаконных» сохраняет прямую нравственно-правовую силу греческого слова.
- source_word: ὕπνων
  choice: связей
  rationale: Буквально — «лож», «соитий»; здесь это эвфемизм для недозволенных половых отношений. «Связей» естественно передаёт смысл, а буквальный образ отмечен в сноске.
- source_word: τέκνα γεννώμενα
  choice: дети, рождённые
  rationale: Передаёт причастную конструкцию ясно и естественно, сохраняя значение происхождения детей от таких отношений.
- source_word: μάρτυρές εἰσιν
  choice: становятся свидетелями
  rationale: Сохраняет судебно-свидетельский оттенок выражения и естественно сочетается с обстоятельством испытания.
- source_word: πονηρίας
  choice: порочности
  rationale: Передаёт нравственное зло родителей весомым, но понятным современным словом.
- source_word: κατὰ γονέων
  choice: своих родителей
  rationale: В сочетании со «свидетелями» подразумевается направленность свидетельства против родителей; явный вариант дан в сноске, чтобы не перегружать основной текст.
- source_word: ἐν ἐξετασμῷ αὐτῶν
  choice: при испытании
  rationale: ἐξετασμός допускает значения проверки, исследования или судебного разбирательства. Безличная формулировка сохраняет неоднозначность αὐτῶν относительно того, кто именно подвергается испытанию.
theological_decisions:
- issue: Нравственный смысл эвфемизма ἀνόμων ὕπνων
  choice: беззаконные связи
  alternative: беззаконные ложа; недозволенные соития
  rationale: Основной вариант сохраняет осуждение недозволенных отношений и одновременно эвфемистический, достойный регистр греческого текста.
- issue: Референт αὐτῶν в ἐν ἐξετασμῷ αὐτῶν
  choice: не уточнять в основном тексте, кто подвергается испытанию
  alternative: когда испытывают детей; когда исследуют дело родителей
  rationale: Местоимение грамматически допускает более одного соотнесения. Нейтральное «при испытании» не устраняет подлинную неоднозначность, а варианты поясняются в сноске.
- issue: Отношение свидетельства к родителям в κατὰ γονέων
  choice: свидетельство о порочности родителей
  alternative: свидетельство против родителей
  rationale: Обе формулировки отражают обвинительный смысл κατά с родительным; более явный судебный вариант сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим Писанию. Судебный оттенок слов «свидетели» и «испытание» сохранён; синтаксическая неоднозначность греческого местоимения не устранена.
