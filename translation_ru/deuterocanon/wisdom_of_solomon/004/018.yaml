lexical_decisions:
- source_word: ὄψονται
  choice: увидят
  rationale: Будущая форма ὁράω передана простым и естественным глаголом «увидят» без добавления отсутствующего в данной греческой строке объекта.
- source_word: ἐξουδενήσουσιν
  choice: презрят
  rationale: Глагол означает «считать за ничто, презирать». «Презрят» кратко и точно выражает презрительное отношение, сохраняя эллиптическую конструкцию оригинала.
- source_word: ὁ κύριος
  choice: Господь
  rationale: В данном контексте κύριος обозначает Бога; традиционное и литературно естественное соответствие — «Господь».
- source_word: ἐκγελάσεται
  choice: посмеётся над ними
  rationale: ἐκγελάω обозначает насмешливый смех. Русское «посмеётся над ними» естественно передаёт как смех, так и уничижительную направленность действия.
theological_decisions:
- issue: Передача κύριος в контексте суда Бога
  choice: Господь
  alternative: владыка
  rationale: Речь идёт о Боге, поэтому «Господь» сохраняет богословский смысл и устойчивое библейское словоупотребление, не внося конфессионально специфического толкования.
- issue: Антропоморфный образ насмешки Господа
  choice: посмеётся над ними
  alternative: высмеет их
  rationale: Образ сохранён прямо, без смягчения и без объяснительного переосмысления; тем самым удерживается напряжённость греческого текста.
translation_notes:
  register: 'Современный литературный русский язык с кратким, торжественным библейским звучанием. Эллипсис исходного текста сохранён: после «увидят» и «презрят» не добавлен объект, отсутствующий в данной греческой строке.'
