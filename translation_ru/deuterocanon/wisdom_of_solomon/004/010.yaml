  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/010.yaml
  text: Having become pleasing to God[a], he was loved; and while living among sinners, he was taken away.
translation:
  language: ru
  text: Став угодным Богу, он был любим; и, живя среди грешников, был взят[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был удалён»; «был перенесён». Греческое слово не уточняет, идёт ли речь прежде всего о преждевременной смерти, об избавлении Богом от греховного окружения или о взятии, подобном взятию Еноха.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐάρεστος τῷ θεῷ γενόμενος
  choice: став угодным Богу
  rationale: Оборот естественно передаёт состояние угодности Богу и сохраняет предшествующее по отношению к главному глаголу значение аористного причастия γενόμενος.
- source_word: ἠγαπήθη
  choice: он был любим
  rationale: Страдательная форма точно передаёт греческий пассив, не добавляя прямо не названного деятеля; связь с Богом ясна из первой части стиха.
- source_word: ζῶν μεταξὺ ἁμαρτωλῶν
  choice: живя среди грешников
  rationale: Деепричастный оборот передаёт одновременность ζῶν, а «среди грешников» прямо и естественно соответствует μεταξὺ ἁμαρτωλῶν.
- source_word: μετετέθη
  choice: был взят
  rationale: «Был взят» сохраняет возможность понимать глагол как божественное изъятие из греховного окружения, преждевременную смерть или взятие, подобное участи Еноха, не сводя смысл лишь к одному варианту.
theological_decisions:
- issue: 'Смысл μετετέθη: смерть или особое взятие Богом'
  choice: был взят
  alternative: был удалён; был перенесён
  rationale: Греческий глагол обозначает перемещение или изъятие и в библейском контексте может напоминать о взятии Еноха. Нейтральное «был взят» сохраняет эту богословскую напряжённость и не уточняет того, чего не уточняет текст.
translation_notes:
  register: Современный литературный русский язык; краткий, достоинственный синтаксис. Формулировка сохраняет пассивные конструкции оригинала и его намеренную смысловую открытость.
