lexical_decisions:
- source_word: γῆρας
  choice: старость
  rationale: Слово обозначает старость как возраст и состояние, а не пожилого человека; это прямой и естественный русский эквивалент.
- source_word: τίμιον
  choice: почтенная
  rationale: В данном нравственно-назидательном контексте слово указывает на достоинство и уважение, а не на материальную ценность.
- source_word: οὐ τὸ πολύχρονον
  choice: не та, что длится много лет
  rationale: Передаёт противопоставление достойной старости простому долголетию, сохраняя естественный русский синтаксис.
- source_word: οὐδὲ
  choice: и ... не
  rationale: В русском предложении эта конструкция естественно присоединяет второе отрицание к первому.
- source_word: ἀριθμῷ ἐτῶν
  choice: числом лет
  rationale: Точно передаёт меру или критерий измерения, выраженный дательным падежом в греческом.
- source_word: μεμέτρηται
  choice: измеряется
  rationale: Настоящее время в русском естественно выражает общее, непреходящее суждение, тогда как буквальная передача перфекта была бы стилистически тяжеловесной.
theological_decisions:
- issue: Основание почтенности старости
  choice: Почтенность старости не определяется одной лишь продолжительностью жизни или количеством прожитых лет.
  alternative: Старость сама по себе почтенна независимо от числа лет.
  rationale: Греческий текст отрицает тождество почтенной старости и многолетия, но не раскрывает положительное основание её достоинства до следующего стиха; перевод не должен преждевременно разрешать это напряжение.
