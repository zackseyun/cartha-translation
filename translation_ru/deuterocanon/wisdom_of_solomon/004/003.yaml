base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/003.yaml
  text: But the many offspring of the ungodly will be of no use[a], and from bastard shoots they will not give a root into depth[b], nor will they set a firm foundation.
translation:
  language: ru
  text: 'Но многочисленное потомство нечестивых не принесёт пользы: оно, происшедшее от незаконнорождённых побегов[a], не пустит глубоких корней[b] и не заложит прочного основания.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «побочных побегов», «неподлинных отростков». Греческое слово имеет резкий оттенок незаконного происхождения и употреблено здесь в растительной метафоре.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не даст корня в глубину», то есть не укоренится глубоко.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολύγονον ... πλῆθος
  choice: многочисленное потомство
  rationale: Передаёт собирательное значение πλῆθος и идею многочисленности потомства в естественной для русского языка форме.
- source_word: ἀσεβῶν
  choice: нечестивых
  rationale: Сохраняет религиозно-нравственную направленность слова, не сводя его значение лишь к общей порочности.
- source_word: οὐ χρησιμεύσει
  choice: не принесёт пользы
  rationale: Естественно передаёт значение бесполезности и сохраняет форму будущего времени.
- source_word: ἐκ νόθων μοσχευμάτων
  choice: от незаконнорождённых побегов
  rationale: Сохраняет резкость νόθος и одновременно удерживает растительный образ μοσχεύματα. Необычность сочетания намеренна и отражает наложение образов происхождения и растения в греческом тексте.
- source_word: οὐ δώσει ῥίζαν εἰς βάθος
  choice: не пустит корня в глубину
  rationale: Близко передаёт буквальный образ греческого выражения, оставаясь понятным по-русски.
- source_word: οὐδὲ ἀσφαλῆ βάσιν ἐδράσει
  choice: и не заложит прочного основания
  rationale: Передаёт значения надёжности, основания и утверждения, сохраняя образ устойчивости.
theological_decisions:
- issue: Религиозно-нравственная характеристика ἀσεβῶν
  choice: нечестивых
  alternative: безбожных; порочных
  rationale: «Нечестивых» сохраняет направленность против Бога, но не приписывает персонажам специально современное отрицание существования Бога.
- issue: Сохранение резкого νόθων в метафоре
  choice: незаконнорождённых побегов
  alternative: побочных побегов; ложных отростков
  rationale: Источник использует социально окрашенное и резкое слово внутри растительной метафоры. Перевод не смягчает эту напряжённость и не решает однозначно, относится ли образ прежде всего к незаконному происхождению или к неподлинности побегов.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Сохранены смешанные образы потомства, побегов, корня и основания; необычное сочетание «незаконнорождённых побегов» намеренно отражает резкость и образную напряжённость греческого текста.
