revisions:
- from: Ведь наша жизнь — лишь скользящая тень, и от нашего конца нет возврата, потому что он запечатан, и никто не возвращается.
  to: Ведь наша жизнь подобна прохождению тени, и после нашего конца нет возврата, потому что он запечатан, и никто не возвращается.
  rationale: Уточнён образ «прохождения тени» в соответствии с σκιᾶς πάροδος; оборот о невозможности возврата сделан более естественным по-русски. Неоднозначность референта в «он запечатан» намеренно сохранена.
