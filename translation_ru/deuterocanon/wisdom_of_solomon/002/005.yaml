base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/005.yaml
  text: For our life is the passing of a shadow, and there is no turning back from our end, because it has been sealed, and no one returns.
translation:
  language: ru
  text: Ведь наша жизнь подобна прохождению тени, и после нашего конца нет возврата, потому что он запечатан, и никто не возвращается.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκιᾶς ... πάροδος
  choice: скользящая тень
  rationale: Передаёт образ тени, которая быстро проходит и исчезает; по-русски звучит естественнее буквального «прохождение тени».
- source_word: ὁ βίος ἡμῶν
  choice: наша жизнь
  rationale: Прямое и естественное соответствие греческому выражению.
- source_word: ἀναποδισμὸς
  choice: возврат
  rationale: Сохраняет смысл невозможности обратить путь назад после конца жизни.
- source_word: τῆς τελευτῆς ἡμῶν
  choice: от нашего конца
  rationale: Сохраняет эвфемистическую и несколько неоднозначную формулировку источника, не заменяя её прямо словом «смерть».
- source_word: κατεσφραγίσθη
  choice: он запечатан
  rationale: Сохраняет метафору окончательности и недоступности изменения, присутствующую в греческом перфективном пассиве.
- source_word: ἀναστρέφει
  choice: возвращается
  rationale: В данном контексте глагол означает возвращение; настоящее время передаёт общее утверждение.
theological_decisions:
- issue: Референт в ὅτι κατεσφραγίσθη
  choice: потому что он запечатан
  alternative: потому что всё запечатано
  rationale: Мужской род греческого глагола естественно соотносится с ближайшим существительным мужского рода ἀναποδισμός («возврат»), однако русская конструкция позволяет местоимению также восприниматься в связи с «концом», не устраняя образную напряжённость текста.
- issue: Характер утверждения οὐδεὶς ἀναστρέφει
  choice: никто не возвращается
  alternative: никто не возвращает
  rationale: Непереходное понимание лучше соответствует контексту невозможности вернуться после конца жизни и не вводит неуказанный объект.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и афористичная, с сохранением мрачной образности речи нечестивых в контексте главы. Тире подчёркивает уподобление жизни тени.
