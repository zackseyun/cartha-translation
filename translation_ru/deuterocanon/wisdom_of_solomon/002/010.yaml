base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/010.yaml
  text: Let us oppress the righteous poor man[a]; let us not spare the widow[b], nor show regard for the gray hairs of an old man advanced in years.
translation:
  language: ru
  text: Притесним праведного бедняка[a], не пощадим вдовы и не проявим почтения к сединам старца, прожившего много лет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедного праведника». В греческом оба определения относятся к одному человеку.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «и не устыдимся седины старца, прожившего много лет». Греческий глагол может выражать как стыд перед кем-либо, так и почтительное уважение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταδυναστεύσωμεν
  choice: притесним
  rationale: Глагол обозначает жестокое, угнетательское применение власти; «притесним» естественно передаёт побудительное значение аористного конъюнктива и не ослабляет насилия.
- source_word: πένητα
  choice: бедняка
  rationale: πένης — бедный или нуждающийся человек; мужской род единственного числа и связь с δίκαιον указывают на конкретно представленную жертву.
- source_word: δίκαιον
  choice: праведного
  rationale: «Праведный» сохраняет нравственно-религиозный контраст главы; грамматически определение относится к тому же человеку, что и πένητα.
- source_word: μὴ φεισώμεθα
  choice: не пощадим
  rationale: φείδομαι означает щадить, удерживаться от причинения вреда; краткий русский эквивалент точно передаёт смысл.
- source_word: χήρας
  choice: вдовы
  rationale: Единственное число имеет обобщающий характер и представляет вдову как типично беззащитного человека.
- source_word: μηδὲ ... ἐντραπῶμεν
  choice: и не почтим
  rationale: В данном контексте ἐντρέπομαι выражает уважение или почтительное отношение, а не только внутреннее чувство стыда.
- source_word: πρεσβύτου
  choice: старца
  rationale: Здесь слово обозначает пожилого мужчину, а не должностного старейшину; «старец» соответствует возвышенному библейскому регистру без архаической неясности.
- source_word: πολιάς
  choice: седины
  rationale: Существительное называет седые волосы как зримый знак преклонного возраста; «седины» сохраняет конкретный образ.
- source_word: πολυχρονίους
  choice: прожившего много лет
  rationale: Определение усиливает указание на преклонный возраст; этот оборот прозрачно сохраняет буквальный образ «многих лет».
theological_decisions:
- issue: Передача δίκαιον в противопоставлении нечестивых и их жертвы
  choice: праведного
  alternative: справедливого
  rationale: «Праведный» яснее передаёт нравственно-религиозную характеристику человека в контексте Премудрости 2, тогда как «справедливый» может восприниматься преимущественно как характеристика беспристрастности.
- issue: Значение ἐντραπῶμεν по отношению к сединам старика
  choice: не почтим
  alternative: не постыдимся перед
  rationale: Греческий глагол допускает значения стыда и почтительного уважения. При объекте «седины» контекст естественнее указывает на отказ выказать почтение, однако альтернативная формулировка отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллелизм трёх побудительных форм сохранён; конкретный образ седины и усиление преклонного возраста переданы без сглаживания.
