base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/019.yaml
  text: Let us test him with insolence and torture[b][a], so that we may know his gentleness and test his forbearance.
translation:
  language: ru
  text: Испытаем его оскорблением и пыткой[a], чтобы узнать его кротость и оценить его терпение в обидах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дерзким надругательством и мучением». Греческие слова могут обозначать оскорбительное, унизительное обращение и причинение мучений как средство испытания.'
    reason: lexical_alternative
  - marker: b
    text: То есть его способность терпеливо переносить причинённое зло, не отвечая злом.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὕβρει
  choice: оскорблением
  rationale: Слово обозначает дерзкое, унизительное и оскорбительное обращение; «оскорблением» естественно передаёт это в данном контексте, не сужая смысл только до словесной насмешки.
- source_word: βασάνῳ
  choice: пыткой
  rationale: В контексте испытания через страдание слово указывает на мучительное воздействие как средство проверки; «пыткой» сохраняет конкретность и силу выражения.
- source_word: ἐτάσωμεν
  choice: испытаем
  rationale: 'Побудительный конъюнктив выражает предложение подвергнуть человека проверке: «испытаем».'
- source_word: ἐπιείκειαν
  choice: кротость
  rationale: Здесь имеется в виду мягкость и незлобивость человека под давлением; «кротость» — понятное и уместное обозначение этой нравственной черты.
- source_word: δικάσωμεν
  choice: оценить
  rationale: Хотя глагол имеет судебный оттенок «судить», в этом контексте он означает составить суждение о качестве человека на основании испытания. «Оценить» сохраняет отличие от первого глагола «испытать».
- source_word: ἀνεξικακίαν
  choice: терпение в обидах
  rationale: Существительное обозначает терпеливое перенесение причинённого зла без ответной враждебности. Выражение «терпение в обидах» передаёт эту направленность точнее, чем общее «терпение».
theological_decisions:
- issue: Различение двух добродетелей праведника перед лицом гонения
  choice: Передать ἐπιείκεια как «кротость», а ἀνεξικακία как «терпение в обидах».
  alternative: «мягкость» и «долготерпение»
  rationale: 'Разные русские выражения сохраняют параллельные, но не тождественные качества: мягкий нрав и терпеливое перенесение причинённого зла без возмездия.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Сохранены два действия — испытать и оценить — и две отдельные нравственные характеристики праведника.
