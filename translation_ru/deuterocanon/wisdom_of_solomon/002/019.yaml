  verdict: approve
  source_fidelity: «Испытаем его» точно передаёт побудительный конъюнктив ἐτάσωμεν. «Оскорблением и пыткой» адекватно воспроизводит ὕβρει καὶ βασάνῳ как враждебные средства испытания. «Кротость» передаёт ἐπιείκεια приемлемо в контексте поведения праведника под давлением, а «терпение в обидах» удачно раскрывает направленное на причинённое зло ἀνεξικακία. «Оценить» для δικάσωμεν сохраняет смысл составить суждение по результатам испытания и не создаёт ложного впечатления формального судебного процесса.
  naturalness: Текст звучит естественно на современном литературном русском, кратко и выразительно. Инструментальная конструкция «оскорблением и пыткой» и целевая конструкция «чтобы узнать… и оценить…» ясны. «Терпение в обидах» несколько более разъяснительно, чем однословный вариант, но хорошо читается и точно подходит контексту.
