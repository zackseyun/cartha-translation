  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/017.yaml
  text: Let us see whether his words are true[a], and let us test what will happen at his end.
translation:
  language: ru
  text: Посмотрим, правдивы ли его слова, и испытаем, что ждёт его в конце.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каков будет его исход». Греческое выражение может указывать на его конец либо на конечный результат происходящего с ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδωμεν
  choice: Посмотрим
  rationale: Увещевательное сослагательное наклонение первого лица множественного числа естественно передаётся формой «посмотрим», сохраняющей оттенок намерения проверить.
- source_word: οἱ λόγοι αὐτοῦ
  choice: его слова
  rationale: λόγοι обозначает слова, высказывания или утверждения; «его слова» близко к греческому и не сужает смысл.
- source_word: ἀληθεῖς
  choice: правдивы
  rationale: В сочетании со «словами» это естественно выражает их соответствие истине, не перенося основной акцент на нравственное качество говорящего.
- source_word: πειράσωμεν
  choice: испытаем
  rationale: Глагол означает подвергнуть проверке или испытанию; выбранный вариант сохраняет намеренно враждебный характер проверки в контексте.
- source_word: τὰ ἐν ἐκβάσει αὐτοῦ
  choice: что ждёт его в конце
  rationale: ἐκβάσις может обозначать исход, конец или результат. Русская формулировка естественно передаёт то, что обнаружится в конечной участи человека, не уточняя её сверх текста.
theological_decisions:
- issue: Значение ἐκβάσις применительно к словам праведника
  choice: «что ждёт его в конце»
  alternative: «каков будет его исход»
  rationale: Передача сохраняет связь между проверкой слов праведника и его конечной участью, включая возможность окончательного оправдания Богом, но не вводит более определённого эсхатологического учения, чем выражено в греческом.
translation_notes:
  register: Современный литературный русский язык; речь краткая, решительная и враждебная по тону. Синтаксис двух побудительных форм сохранён, а греческий идиоматический оборот передан естественно и без излишнего толкования.
