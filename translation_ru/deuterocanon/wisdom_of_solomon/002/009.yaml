base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/009.yaml
  text: Let none of us be without a share in our revelry; everywhere let us leave tokens of our merriment[a], because this is our portion, and this our lot.
translation:
  language: ru
  text: Пусть никто из нас не будет без доли в нашем разгуле[a]; повсюду оставим знаки нашего веселья, ведь это наша доля и это наш жребий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в нашей гордости», «в нашем высокомерии». Греческое слово может выражать заносчивость или гордыню, хотя в этом контексте, вероятнее всего, речь идёт о необузданном веселье и потворстве своим желаниям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμοιρος
  choice: без доли
  rationale: Передаёт отсутствие причитающейся доли и сохраняет смысловую связь с последующими μερίς («доля») и κλῆρος («жребий»).
- source_word: ἀγερωχίας
  choice: разгуле
  rationale: В контексте призыва нечестивых к безудержным удовольствиям слово обозначает заносчивое, необузданное веселье. «Разгул» естественно передаёт праздничную распущенность, не устраняя возможного оттенка гордыни.
- source_word: πανταχῇ
  choice: повсюду
  rationale: Точно и естественно передаёт наречие со значением «везде, во всяком месте».
- source_word: καταλίπωμεν
  choice: оставим
  rationale: Форма увещевательного сослагательного наклонения передана русской побудительной конструкцией первого лица множественного числа.
- source_word: σύμβολα
  choice: знаки
  rationale: В данном контексте речь идёт о заметных следах или свидетельствах веселья; «знаки» сохраняют широту греческого слова.
- source_word: εὐφροσύνης
  choice: веселья
  rationale: Передаёт праздничную радость и хорошее настроение в контексте погони за удовольствиями, не придавая слову возвышенно-духовного оттенка.
- source_word: μερὶς
  choice: доля
  rationale: Сохраняет образ причитающейся человеку части и перекликается с выражением «без доли» в первой части стиха.
- source_word: κλῆρος
  choice: жребий
  rationale: Передаёт представление о выпавшей или назначенной участи и сохраняет параллелизм с «долей» без сужения смысла до юридического наследства.
theological_decisions:
- issue: Значение ἀγερωχίας в речи нечестивых
  choice: наш разгул
  alternative: наша гордость; наше высокомерие; наша заносчивость
  rationale: Ближайший контекст — призыв наслаждаться земными удовольствиями перед смертью — поддерживает значение необузданного веселья. Однако греческое слово способно обозначать гордыню или высокомерие, поэтому эта существенная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Побудительный строй оригинала сохранён; параллель «доля — жребий» передана прямо. «Разгул» подчёркивает гедонистический контекст, а сноска сохраняет отрицательные значения ἀγερωχία.
