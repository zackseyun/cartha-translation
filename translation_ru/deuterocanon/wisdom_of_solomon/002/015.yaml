  text: for his life is unlike that of others[a], and his ways are different.
translation:
  language: ru
  text: ведь жизнь его не похожа на жизнь других[a], и пути его иные.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «образ жизни его не похож на образ жизни других».'
    reason: βίος допускает значение не только «жизнь», но и «образ жизни».
lexical_decisions:
- source_word: ἀνόμοιος
  choice: не похожа на
  rationale: Передаёт значение несходства и сравнительную конструкцию с τοῖς ἄλλοις естественным современным русским выражением.
- source_word: βίος
  choice: жизнь
  rationale: βίος может означать как жизнь, так и образ жизни; прямое «жизнь» сохраняет широту исходного слова, а контекст путей указывает на поведение.
- source_word: ἐξηλλαγμέναι
  choice: иные
  rationale: Перфектное причастие обозначает отличающееся, изменённое состояние. В данном противопоставлении «иные» естественно передаёт достигшее результата отличие, не вводя не названного в тексте деятеля изменения.
- source_word: τρίβοι
  choice: пути
  rationale: Сохраняет образ проторённых троп как метафору поведения и жизненного направления.
theological_decisions:
- issue: Следует ли прямо истолковать βίος и τρίβοι как нравственное поведение
  choice: Сохранить слова «жизнь» и «пути» без поясняющего расширения.
  alternative: «образ жизни» и «поведение»
  rationale: Греческий текст выражает мысль обычным словом и метафорой; буквальная образность сохраняет смысловую широту и не навязывает более узкого нравственного толкования.
- issue: Передача результирующего значения ἐξηλλαγμέναι
  choice: «пути его иные»
  alternative: «пути его изменены»
  rationale: В контексте речь прежде всего об отличии праведника от окружающих. «Изменены» могло бы необоснованно подчеркнуть событие изменения и вызвать вопрос о его деятеле, тогда как «иные» передаёт наличное состояние.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого параллелизма и метафоры путей. Союз «ведь» передаёт объяснительное ὅτι в связи с предыдущим стихом.
