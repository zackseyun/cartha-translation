  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/007.yaml
  text: Let us fill ourselves with costly wine and perfumes[a], and let no flower of spring pass us by.
translation:
  language: ru
  text: Насладимся дорогим вином и благовониями[a], и пусть ни один весенний цветок не минует нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ароматическими маслами» либо «умащениями». Греческое слово μύρον обозначает душистое масло или благовонное умащение, служившее предметом роскоши.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴνου πολυτελοῦς
  choice: дорогим вином
  rationale: Родительный падеж при πλησθῶμεν обозначает то, чем хотят насытиться; πολυτελής указывает на высокую стоимость и роскошь.
- source_word: μύρων
  choice: благовониями
  rationale: Слово обозначает ароматические масла или умащения; «благовония» естественно передаёт здесь атмосферу роскоши, не создавая медицинских ассоциаций.
- source_word: πλησθῶμεν
  choice: насладимся
  rationale: Побудительный конъюнктив первого лица множественного числа выражает совместный призыв. В сочетании с вином и благовониями буквальное «наполнимся» по-русски звучит неестественно, тогда как «насладимся» сохраняет смысл чувственного пресыщения в контексте.
- source_word: μὴ παροδευσάτω ἡμᾶς
  choice: пусть … не минует нас
  rationale: Сохраняется запрещающий императив и образ удовольствия, которое говорящие не желают упустить.
- source_word: ἄνθος ἔαρος
  choice: весенний цветок
  rationale: Естественная современная русская формулировка, сохраняющая поэтический образ греческого выражения.
