lexical_decisions:
- source_word: αὐτοσχεδίως
  choice: случайно
  rationale: Наречие выражает представление говорящих о самопроизвольном, не обусловленном замыслом возникновении; «случайно» естественно передаёт это по-русски.
- source_word: ἐγενήθημεν
  choice: мы возникли
  rationale: Передаёт становление или появление на свет, не добавляя явно названного деятеля.
- source_word: πνοή
  choice: дыхание
  rationale: В сочетании «в наших ноздрях» обозначает дыхание, жизненное дуновение.
- source_word: λόγος
  choice: разум
  rationale: В антропологическом контексте искры, возникающей при движении сердца, слово указывает на разумную способность; вариант «слово/речь» возможен лексически, но здесь менее вероятен.
- source_word: ἐν κινήσει καρδίας ἡμῶν
  choice: при биении нашего сердца
  rationale: Естественная русская передача движения сердца как его биения, сохраняющая физиологический образ.
theological_decisions:
- issue: Высказывание о случайном происхождении человека
  choice: Сохранено как утверждение нечестивых в контексте речи персонажей, без редакционного исправления.
  alternative: Ослабить формулировку до «неожиданно» или явно опровергнуть её в самом стихе.
  rationale: Греческий текст прямо передаёт мировоззрение говорящих; перевод не должен устранять заложенное в книге богословское напряжение.
- issue: Значение λόγος
  choice: разум
  alternative: речь / слово
  rationale: Контекст описывает жизненные и познавательные свойства человека, а связь с сердцем поддерживает значение разумной способности, хотя лексическая многозначность признаётся.
