  text: and our name will be forgotten in time[a], and no one will remember our works; and our life will pass by like the trace of a cloud, and will be scattered like mist[b], driven off by the sun’s rays and weighed down by its heat.
translation:
  language: ru
  text: И имя наше со временем забудется, и никто не вспомнит наших дел; и жизнь наша пройдёт, словно след облака, и рассеется, словно дымка, разогнанная лучами солнца и отягчённая[a] его жаром.
