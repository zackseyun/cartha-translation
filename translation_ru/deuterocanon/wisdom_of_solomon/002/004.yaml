    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐπιλησθήσεται ἐν χρόνῳ
  choice: со временем забудется
  rationale: Передаёт будущий пассив и неопределённое течение времени естественным современным русским выражением.
- source_word: μνημονεύσει τῶν ἔργων ἡμῶν
  choice: вспомнит наших дел
  rationale: В параллели с «забудется» глагол прежде всего означает память, а ἔργα — совершённые дела.
- source_word: παρελεύσεται ὁ βίος ἡμῶν
  choice: жизнь наша пройдёт
  rationale: Сохраняет образ движения и быстротечности, не усиливая его до прямого утверждения о смерти.
- source_word: ἴχνη νεφέλης
  choice: след облака
  rationale: Русское единственное число естественно передаёт собирательный образ исчезающего следа; буквальное множественное «следы облака» звучит неестественно.
- source_word: ὁμίχλη διασκεδασθήσεται
  choice: рассеется, словно дымка
  rationale: «Дымка» передаёт лёгкую атмосферную пелену, которую рассеивают солнечные лучи, и позволяет естественно сохранить женский род последующих причастий.
- source_word: διωχθεῖσα ὑπὸ ἀκτίνων ἡλίου
  choice: разогнанная лучами солнца
  rationale: Передаёт пассивное принудительное удаление дымки под действием солнечных лучей.
- source_word: ὑπὸ θερμότητος αὐτοῦ βαρυνθεῖσα
  choice: отягчённая его жаром
  rationale: Сохраняет необычную метафору βαρυνθεῖσα («сделанная тяжёлой, отягчённая»), не заменяя её более привычным, но менее точным образом.
