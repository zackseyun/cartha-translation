  terminology: «Праведник», «закон», «грехи», «прегрешения» терминологически уместны. «Воспитание» — естественный основной вариант для παιδεία в данном контексте нравственного формирования; сноска корректно отмечает варианты «наставление» и «дисциплина». Сноска a не навязывает конкретного мессианского или иного доктринального референта.
