  source_fidelity: Русский текст точно передаёт побудительное ἐνεδρεύσωμεν, единственное число τὸν δίκαιον и последовательность оснований обвинения. «Устроим засаду» допустимо передаёт намеренное подстерегание; «неудобен для нас» уместно сохраняет оценочный смысл δύσχρηστος, не сужая его до физического препятствия. Обороты «грехах против закона» и «прегрешениях против нашего воспитания» адекватно отражают зависимые родительные конструкции, при этом примечание сохраняет диапазон παιδεία.
