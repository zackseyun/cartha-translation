base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/012.yaml
  text: But let us lie in wait for the righteous man, because he is troublesome to us and opposes our deeds, and reproaches us for sins against the law, and charges us with sins against our training.
translation:
  language: ru
  text: Но устроим засаду на праведника[a], потому что он неудобен для нас, противится нашим делам, укоряет нас в грехах против закона и обвиняет нас в прегрешениях против нашего воспитания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведного». Единственное число в греческом тексте может обозначать типического праведного человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «против нашего наставления» или «против нашей дисциплины». Греческое слово παιδεία может означать воспитание, обучение, наставление или дисциплину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύσωμεν
  choice: устроим засаду
  rationale: Увещевательное сослагательное наклонение передано формой совместного побуждения; выражение сохраняет смысл намеренного подстерегания и заговора.
- source_word: τὸν δίκαιον
  choice: праведника
  rationale: Субстантивированное прилагательное с артиклем обозначает конкретного либо типического праведного человека; русское единственное число сохраняет эту открытость.
- source_word: δύσχρηστος
  choice: неудобен для нас
  rationale: В данном контексте слово означает того, с кем трудно иметь дело и чьё присутствие мешает нечестивым; «неудобен» естественно передаёт их оценку.
- source_word: ἐναντιοῦται τοῖς ἔργοις ἡμῶν
  choice: противится нашим делам
  rationale: Передаёт деятельное противостояние поступкам говорящих и сохраняет нравственную окраску ἔργα.
- source_word: ὀνειδίζει ἡμῖν
  choice: укоряет нас
  rationale: «Укоряет» передаёт словесное порицание без добавления оттенка насмешки.
- source_word: ἁμαρτήματα νόμου
  choice: грехах против закона
  rationale: Родительный падеж понят как обозначение нормы, против которой совершены грехи; формулировка сохраняет как нравственный, так и правовой смысл.
- source_word: ἐπιφημίζει ἡμῖν
  choice: обвиняет нас в
  rationale: Глагол выражает вменение проступков или выдвижение обвинения; русский оборот ясен и не усиливает возможный оттенок публичного оглашения.
- source_word: ἁμαρτήματα παιδείας ἡμῶν
  choice: прегрешениях против нашего воспитания
  rationale: παιδεία охватывает воспитание, обучение и дисциплину. «Воспитание» естественно обозначает полученное нравственное формирование, нормам которого говорящие не соответствуют.
theological_decisions:
- issue: Референт τὸν δίκαιον
  choice: праведника
  alternative: праведного
  rationale: Перевод сохраняет мужской род и единственное число, не решая, имеется ли в виду отдельный человек, типический праведник или фигура с более широким представительским смыслом.
- issue: Смысл παιδεία
  choice: наше воспитание
  alternative: наше наставление / наша дисциплина
  rationale: Контекст предполагает нравственное формирование, но греческое слово остаётся многозначным; основной текст использует наиболее естественное русское соответствие, а примечание сохраняет альтернативы.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет последовательность обвинений оригинала; лексика понятна широкому читателю, а неоднозначность παιδεία вынесена в примечание.
