  text: Они так рассуждали и впали в заблуждение, ибо их ослепила собственная порочность.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: так
  rationale: В сочетании с глаголом рассуждения естественно связывает стих с изложенными выше мыслями нечестивых; множественность отсылаемых суждений передаётся контекстом.
- source_word: ἐλογίσαντο
  choice: рассуждали
  rationale: Передаёт обдумывание и внутреннее умозаключение, не сводя значение к мимолётной мысли или механическому расчёту.
- source_word: ἐπλανήθησαν
  choice: заблуждались
  rationale: Медиально-пассивная форма обозначает пребывание в ошибке; русское возвратное выражение естественно сохраняет смысл ухода от истины, не вводя явно внешнего обманщика.
- source_word: ἀπετύφλωσεν
  choice: ослепила
  rationale: Сохраняет сильный образ причинённой нравственно-духовной слепоты.
- source_word: κακία
  choice: порочность
  rationale: Обозначает внутреннюю нравственную испорченность; это шире, чем отдельный злой умысел, и естественно объясняет утрату верного восприятия.
- source_word: αὐτῶν
  choice: собственная
  rationale: В русском контексте подчёркивает, что причиной слепоты была присущая им самим порочность, не приписывая её внешней силе.
theological_decisions:
- issue: Нравственная причина ослепления
  choice: их ослепила собственная порочность
  alternative: их ослепило зло
  rationale: Греческий текст прямо связывает заблуждение с их собственной нравственной испорченностью. Формулировка не вводит ни божественного ожесточения, ни внешнего обмана, о которых стих не говорит.
- issue: Характер заблуждения
  choice: заблуждались
  alternative: были введены в заблуждение
  rationale: Русская возвратная форма сохраняет неоднозначность греческого пассива относительно механизма заблуждения и не предполагает не названного в тексте внешнего деятеля.
translation_notes:
  register: Современный литературный русский язык; краткий, выразительный и достойный стиль. Тире обозначает смысловой перелом между ошибочным рассуждением и его результатом; причинный союз ясно передаёт γάρ.
