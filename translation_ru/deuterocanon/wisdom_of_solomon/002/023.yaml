base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/023.yaml
  text: For God created man for incorruptibility[b][a], and made him in the image of his own nature.
translation:
  language: ru
  text: Ибо Бог сотворил человека для нетления[a] и сделал его образом Своей собственной природы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для бессмертия»; возможно также: «чтобы он не подвергался гибели». Греческое слово означает состояние, не подверженное тлению или смерти.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Своего собственного естества», «Своего отличительного свойства» или «Своего собственного бытия». Греческое выражение необычно и допускает несколько близких переводов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκτισε
  choice: сотворил
  rationale: Глагол κτίζω обозначает приведение в бытие; «сотворил» точно и естественно передаёт смысл в контексте Божьего творения.
- source_word: τὸν ἄνθρωπον
  choice: человека
  rationale: Единственное число имеет обобщённый, представительный смысл и относится к человеку как к человечеству, сохраняя при этом форму оригинала.
- source_word: ἐπʼ ἀφθαρσίᾳ
  choice: для нетления
  rationale: ἀφθαρσία означает состояние, не подверженное тлению, разрушению и смерти. «Нетление» сохраняет широту греческого понятия и не сужает его до одной лишь бесконечности существования.
- source_word: εἰκόνα
  choice: образом
  rationale: Предикативный творительный после «сделал его» естественно передаёт, что человек был сделан образом, и сохраняет отзвук повествования о сотворении в Бытии.
- source_word: τῆς ἰδίας ἰδιότητος
  choice: Своей собственной природы
  rationale: Необычное выражение указывает на присущее самому Богу свойство или природу. Этот вариант понятен по-русски, а подлинная лексическая неоднозначность отмечена в сноске.
- source_word: ἐποίησεν αὐτόν
  choice: сделал его
  rationale: Прямой перевод ποιέω сохраняет параллелизм со «сотворил» без ненужного стилистического усложнения.
theological_decisions:
- issue: Объём значения τὸν ἄνθρωπον
  choice: Единственное число «человека» в представительном смысле
  alternative: «человеческий род» или «человечество»
  rationale: Высказывание относится ко всему человечеству, но форма единственного числа сохраняет связь с языком повествования о сотворении человека.
- issue: Значение ἀφθαρσία
  choice: «нетление»
  alternative: «бессмертие» или «неподверженность гибели»
  rationale: «Нетление» охватывает свободу и от распада, и от смерти, не навязывая более узкого учения о бессмертии души.
- issue: Смысл τῆς ἰδίας ἰδιότητος
  choice: «Своей собственной природы»
  alternative: «Своего собственного естества», «Своего отличительного свойства» или «Своего собственного бытия»
  rationale: Греческое сочетание необычно и допускает несколько близких толкований. Основной вариант остаётся читаемым, а сноска сохраняет неопределённость без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис краток и близок к греческому; прописное «Своей» используется как традиционное уважительное указание на Бога. Необычность второй части стиха частично сохранена, а не сглажена толкованием.
