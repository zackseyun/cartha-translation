base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/024.yaml
  text: But through the devil’s envy death entered into the world[a], and those who belong to his portion test it.
translation:
  language: ru
  text: Но из-за зависти дьявола смерть вошла в мир, и те, кто принадлежит к его уделу, испытывают её.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «те, кто из его удела, испытывают её (или его)». Греческое выражение необычно: местоимение, вероятнее всего, относится к смерти, а глагол может означать «испытывать», «проверять» или, по смыслу здесь, «переживать на себе».'
    reason: Сохранение лексической и референциальной неоднозначности выражения πειράζουσιν αὐτόν.
lexical_decisions:
- source_word: φθόνῳ
  choice: из-за зависти
  rationale: Дательный падеж выражает причину или средство. «Из-за зависти» естественно передаёт причинную связь и не уточняет её сверх текста.
- source_word: διαβόλου
  choice: дьявола
  rationale: В данном иудейско-греческом контексте διάβολος обозначает личностного носителя зла, а не просто любого клеветника или обвинителя.
- source_word: θάνατος
  choice: смерть
  rationale: Прямое соответствие греческому существительному без неоправданного сужения или расширения смысла.
- source_word: εἰσῆλθεν εἰς τὸν κόσμον
  choice: вошла в мир
  rationale: Сохраняется образ движения, выраженный глаголом εἰσέρχομαι, в естественной русской форме.
- source_word: πειράζουσιν
  choice: испытывают
  rationale: Глагол обычно означает «испытывать, проверять, искушать». При дополнении «смерть» русское «испытывают её» может передавать переживание смерти, не устраняя полностью необычность и многозначность греческой фразы.
- source_word: αὐτὸν
  choice: её
  rationale: Местоимение наиболее естественно относится к слову θάνατος («смерть»). В греческом оно мужского рода по грамматическому роду существительного, а в русском согласуется со словом «смерть» в женском роде.
- source_word: οἱ τῆς ἐκείνου μερίδος ὄντες
  choice: те, кто принадлежит к его уделу
  rationale: Формулировка сохраняет образ μερίς — «доля, часть, удел» — и указывает на принадлежность людей стороне дьявола, не заменяя этот образ толкованием.
theological_decisions:
- issue: Кого обозначает διάβολος
  choice: личностного дьявола
  alternative: обычного клеветника или обвинителя
  rationale: Вхождение смерти в мир связывается с завистью определённого носителя зла; контекст и словоупотребление поддерживают традиционное личностное понимание, не требуя дополнительных доктринальных уточнений.
- issue: Смысл πειράζουσιν αὐτόν
  choice: принадлежащие уделу дьявола испытывают смерть
  alternative: они испытывают или проверяют её; при иной связи местоимения — испытывают его
  rationale: 'Греческое выражение необычно: πειράζω буквально связано с испытанием или проверкой, но смерть как его объект позволяет понять фразу как переживание смерти. Основной текст сохраняет русскую многозначность глагола, а примечание отмечает буквальную трудность.'
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Образ «удела» сохранён ради близости к греческому тексту; трудность второй части не сглажена полностью и пояснена в сноске.
