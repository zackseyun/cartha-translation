    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ σβεσθέντος
  choice: когда она угаснет
  rationale: Генитив абсолютный от σβέννυμι отсылает к «искре» из предыдущего стиха. Русское местоимение женского рода согласуется с «искрой» и сохраняет образ угасания.
- source_word: τέφρα ἀποβήσεται
  choice: станет пеплом
  rationale: 'ἀποβαίνω с τέφρα выражает переход в состояние или итог: тело станет пеплом. Эта формулировка точна и естественна по-русски.'
- source_word: τὸ σῶμα
  choice: тело
  rationale: Прямое соответствие греческому существительному без добавления притяжательного местоимения и без преждевременного толкования как «труп».
- source_word: τὸ πνεῦμα
  choice: дух
  rationale: Сохраняет противопоставление тела и πνεῦμα, при этом сноска указывает на возможный смысл «дыхание» или «жизненное дыхание».
- source_word: διαχυθήσεται
  choice: рассеется
  rationale: Будущая пассивная форма передаёт растворение и рассеивание в воздухе; русское возвратное слово естественно выражает этот образ.
- source_word: ὡς χαῦνος ἀήρ
  choice: словно лёгкий воздух
  rationale: χαῦνος обозначает лёгкость, рыхлость, пустоту или невещественность. «Лёгкий воздух» сохраняет образ и не вводит идиоматическое значение русского выражения «раствориться в воздухе».
theological_decisions:
- issue: Антропологический смысл πνεῦμα в речи нечестивых о смерти
  choice: дух
  alternative: дыхание; жизненное дыхание
  rationale: «Дух» сохраняет буквальное противопоставление тела и πνεῦμα, но контекст и сравнение с воздухом не позволяют превращать эту формулировку в утверждение о бессмертной душе. Сноска сохраняет смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная без архаизмов. Местоимение «она» связывает стих с образом искры в предыдущем контексте. Маркеры сносок поставлены непосредственно после слов и выражений, к которым относятся.
