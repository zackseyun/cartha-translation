  text: когда она угаснет, тело станет пеплом, а дух[a] рассеется, словно разреженный воздух[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дыхание», «жизненное дыхание». Греческое πνεῦμα допускает здесь эти смысловые оттенки.'
