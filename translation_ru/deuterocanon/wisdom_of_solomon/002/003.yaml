  source_fidelity: 'В целом перевод точно передаёт синтаксис и образы греческого текста: генитив абсолютный, превращение тела в пепел, а также рассеивание πνεῦμα. «Дух» с альтернативами в сноске удачно сохраняет смысловую открытость πνεῦμα. Однако «лёгкий воздух» по-русски звучит менее определённо и может означать приятный/свежий воздух, тогда как χαῦνος означает рыхлый, разреженный, неплотный, неустойчивый.'
