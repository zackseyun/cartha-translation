  text: Come then[a], let us enjoy the good things that exist, and let us make use of creation eagerly, as in youth[c][b];
translation:
  language: ru
  text: Итак, давайте насладимся благами, которые есть[a], и станем пользоваться творением[b] с юношеским пылом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нынешними благами»; «благами, которые доступны». Буквально: «существующими благами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сотворённым миром».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «усердно, как в юности». Вероятно, имеется в виду пыл и безудержность, свойственные юности.'
    reason: cultural_note
lexical_decisions:
- source_word: δεῦτε οὖν
  choice: Итак, давайте
  rationale: Естественный современный призыв; «итак» передаёт выводно-продолжительную силу οὖν, а «давайте» — побудительное δεῦτε с последующими формами первого лица множественного числа.
- source_word: ἀπολαύσωμεν
  choice: насладимся
  rationale: Передаёт удовольствие и наслаждение, сохраняя гедонистическую направленность речи персонажей.
- source_word: τῶν ὄντων ἀγαθῶν
  choice: благами, которые есть
  rationale: Достаточно буквально сохраняет причастие ὄντων и не сводит смысл безоговорочно к «нынешним» или «доступным» благам.
- source_word: χρησώμεθα
  choice: станем пользоваться
  rationale: 'Сохраняет отличие χράομαι от ἀπολαύω: речь не только о наслаждении, но и об использовании.'
- source_word: τῇ κτίσει
  choice: творением
  rationale: Передаёт κτίσις как совокупность сотворённого, не сужая значение до отдельного создания.
- source_word: ὡς νεότητι σπουδαίως
  choice: с юношеским пылом
  rationale: Естественно передаёт сжатое греческое сравнение и наречие σπουδαίως как энергичность, рвение и пыл, свойственные юности.
theological_decisions:
- issue: Значение τῶν ὄντων ἀγαθῶν
  choice: благами, которые есть
  alternative: нынешними благами; доступными благами
  rationale: Основной текст сохраняет буквальную широту выражения, а примечание указывает вероятные контекстуальные оттенки.
- issue: Объём значения τῇ κτίσει
  choice: творением
  alternative: сотворённым миром
  rationale: «Творение» сохраняет широту греческого слова и не ограничивает его только материальными ресурсами.
- issue: Связь ὡς νεότητι и σπουδαίως
  choice: с юношеским пылом
  alternative: усердно, словно в юности
  rationale: Греческая конструкция сжата и допускает более буквальную передачу; выбранный вариант ясно выражает вероятный смысл, не приписывая говорящим отсутствующего в тексте «нашего» возраста.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Речь передаёт настойчивый призыв к наслаждению; «с юношеским пылом» делает сжатую греческую конструкцию понятной, а буквальная возможность отмечена в сноске.
