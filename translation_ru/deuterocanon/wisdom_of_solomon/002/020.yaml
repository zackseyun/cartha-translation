base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/020.yaml
  text: Let us condemn him to a shameful death[a], for there will be an examination of him according to his words.
translation:
  language: ru
  text: Осудим его на позорную смерть, ибо, по его словам, его ожидает посещение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о нём будет попечение», «за него вступятся»; возможно также: «его слова будут проверены тем, что с ним произойдёт». Греческое слово может означать посещение, внимание, надзор или вмешательство; в данном контексте оно, вероятно, относится к Божьему действию.'
    reason: «Посещение» передаёт основное и намеренно широкое значение ἐπισκοπή, не предрешая характера этого действия.
lexical_decisions:
- source_word: θανάτῳ ἀσχήμονι
  choice: на позорную смерть
  rationale: Дательный падеж при καταδικάζω обозначает назначаемую кару; «осудить на смерть» естественно по-русски. «Позорную» передаёт бесчестный, унизительный характер ἀσχήμων.
- source_word: καταδικάσωμεν
  choice: Осудим
  rationale: Аорист конъюнктива первого лица множественного числа имеет побудительное значение; русское «осудим» сохраняет и призыв, и судебный оттенок.
- source_word: ἐπισκοπή
  choice: попечение
  rationale: Слово обозначает внимание, надзор, посещение или вмешательство. В контексте речь, вероятно, идёт об ожидаемом внимании Бога к праведнику; «попечение» звучит естественно и не уточняет окончательно, будет ли это забота, избавление, оправдание или испытание.
- source_word: ἐκ λόγων αὐτοῦ
  choice: по его словам
  rationale: Оборот можно понимать как указание на основание ожидания — на собственные слова праведника. Русское выражение сохраняет эту связь без излишнего уточнения.
theological_decisions:
- issue: Значение ἐπισκοπή применительно к утверждениям праведника о Боге
  choice: попечение
  alternative: посещение; вмешательство; оправдание; проверка
  rationale: Контекст допускает божественное внимание или вмешательство в пользу праведника, однако сам греческий термин не определяет исход однозначно. Основной текст сохраняет эту открытость, а примечание называет возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и судебным звучанием. Синтаксис остаётся доступным, а богословская неоднозначность второй части стиха вынесена в примечание.
