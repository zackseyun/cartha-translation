  text: For if the righteous man is God's son, he will help him and rescue him from the hand of those who oppose him.
translation:
  language: ru
  text: Ведь если праведник — сын Бога[a], Бог поддержит его и избавит от руки тех, кто восстал против него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «сын Божий» или «Сын Божий». Греческое выражение допускает разные оттенки; основной текст сохраняет утверждение о сыновстве, не превращая его однозначно в более поздний христологический титул.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δίκαιος
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода обозначает конкретного праведного человека; «праведник» естественно и точно передаёт нравственно-религиозный смысл.
- source_word: υἱὸς θεοῦ
  choice: сын Бога
  rationale: Безартиклевая именная часть допускает качественное или неопределённое понимание. Строчная буква не превращает выражение в позднейший христологический титул, а примечание сохраняет возможные прочтения.
- source_word: ἀντιλήμψεται αὐτοῦ
  choice: Бог поддержит его
  rationale: Глагол означает вступиться, поддержать, прийти на помощь. Явное повторение «Бог» устраняет в русском двусмысленность субъекта, который в греческом подразумевается из предшествующего θεοῦ.
- source_word: ῥύσεται αὐτόν
  choice: избавит
  rationale: Глагол обозначает избавление или спасение от угрожающей силы; «избавит» сохраняет библейский регистр без ненужного расширения смысла.
- source_word: ἐκ χειρὸς
  choice: от руки
  rationale: Сохранён прозрачный библейский образ руки как власти или контроля.
- source_word: ἀνθεστηκότων
  choice: тех, кто восстал против него
  rationale: Причастие совершенного вида изображает людей, занявших враждебную позицию; формулировка передаёт устойчивое и деятельное противостояние.
theological_decisions:
- issue: Следует ли понимать υἱὸς θεοῦ как титул «Сын Божий»
  choice: «сын Бога» со строчной буквы и с примечанием о грамматической неоднозначности
  alternative: «Сын Божий» или «один из сынов Бога»
  rationale: Сам греческий оборот в данном контексте не требует титульного христологического прочтения, хотя допускает его в истории толкования. Перевод не навязывает позднейшую интерпретацию и не исключает её.
- issue: Кто является подразумеваемым субъектом ἀντιλήμψεται и ῥύσεται
  choice: Бог
  alternative: оставить местоимение «он», формально воспроизводя невыраженный субъект
  rationale: По смыслу испытующего высказывания именно Бог должен поддержать и избавить праведника, называемого его сыном. Повтор существительного необходим для ясности по-русски и не добавляет нового участника.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «От руки» сознательно сохраняет понятную исходную метафору; синтаксис остаётся ясным для широкого читателя.
