base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/016.yaml
  text: We were considered by him to be counterfeit[a], and he keeps away from our ways as from uncleannesses; he calls the end of the righteous blessed[c][b], and boasts that God is his father.
translation:
  language: ru
  text: Он считает нас фальшивыми[a] и сторонится наших путей, словно нечистот; он называет блаженной конечную участь праведников[b] и похваляется, что Бог — его отец[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ненастоящими», «ложными», «низкопробными». Греческое слово обозначает то, что сочтено неподлинным, в частности поддельный или низкопробный металл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «конец праведников», «последнее состояние праведников», «исход жизни праведников».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «похваляется отцом-Богом»; то есть утверждает, что Бог — его отец.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κίβδηλον
  choice: фальшивыми
  rationale: Слово обозначает нечто неподлинное, поддельное или низкопробное. «Фальшивыми» естественно характеризует людей по-русски и сохраняет образ неподлинности.
- source_word: ἐλογίσθημεν
  choice: считает нас
  rationale: 'Настоящее время по-русски естественно передаёт результат греческого аориста в контексте жалобы: в его оценке мы являемся фальшивыми.'
- source_word: ἀπέχεται
  choice: сторонится
  rationale: Передаёт сознательное удаление и хорошо сочетается с образом чуждых путей.
- source_word: ὁδῶν
  choice: путей
  rationale: Сохранена традиционная и понятная библейская метафора образа жизни.
- source_word: ἀκαθαρσιῶν
  choice: нечистоты
  rationale: Русское собирательное единственное число звучит естественнее буквального множественного и сохраняет язык ритуально-нравственной нечистоты.
- source_word: μακαρίζει
  choice: называет блаженной
  rationale: Передаёт признание чего-либо блаженным, а не просто субъективно счастливым.
- source_word: ἔσχατα δικαίων
  choice: конечную участь праведников
  rationale: Передаёт неоднозначное множественное ἔσχατα как итог, конец или окончательное состояние, не сводя его лишь к моменту смерти.
- source_word: ἀλαζονεύεται
  choice: похваляется
  rationale: Сохраняет отрицательный оттенок самонадеянного хвастовства и соответствует обвинительной речи нечестивых.
- source_word: πατέρα θεόν
  choice: что его Отец — Бог
  rationale: Естественно раскрывает сжатую греческую конструкцию как притязание на сыновнее отношение к Богу.
theological_decisions:
- issue: Смысл πατέρα θεόν при ἀλαζονεύεται
  choice: нечестивые обвиняют праведника в том, что он похваляется Богом как своим Отцом
  alternative: он похваляется Богом-Отцом / похваляется, что имеет Бога своим Отцом
  rationale: Высказывание остаётся частью речи нечестивых, а не прямым утверждением повествователя. Перевод ясно выражает отношение отцовства, не придавая стиху более поздней узкоконфессиональной конкретизации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет последовательность обвинений; лексика «пути», «блаженная», «праведники» поддерживает библейскую образность, оставаясь понятной современному читателю.
