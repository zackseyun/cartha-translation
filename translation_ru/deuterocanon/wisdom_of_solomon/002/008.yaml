lexical_decisions:
- source_word: στεψώμεθα
  choice: Увенчаем себя
  rationale: Аорист конъюнктива имеет побудительное значение. «Увенчаем себя» естественно передаёт образ праздничного украшения венком.
- source_word: ῥόδων κάλυξιν
  choice: бутонами роз
  rationale: Сочетание родительного множественного ῥόδων («роз») с κάλυξιν, обозначающим бутоны или цветочные чашечки, указывает на свежие бутоны либо цветы роз; «бутонами роз» ясно и нетехнически передаёт этот образ.
- source_word: πρὶν ἢ
  choice: прежде чем
  rationale: Обычный временной союз, вводящий событие, которое ещё не наступило.
- source_word: μαρανθῆναι
  choice: они увянут
  rationale: Аорист пассивного инфинитива от μαραίνω означает «увянуть, поблекнуть»; «увянут» сохраняет конкретный растительный образ.
