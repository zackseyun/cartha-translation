  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Украсим себя венком из розовых цветов, пока они не поблекли». Греческое выражение соединяет слово «розы» со словом, обозначающим бутоны или цветочные чашечки, и рисует образ свежих бутонов или цветов роз.'
