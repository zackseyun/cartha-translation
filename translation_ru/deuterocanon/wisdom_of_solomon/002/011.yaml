base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/011.yaml
  text: But let our strength be the law of justice[a], for what is weak is shown to be useless.
translation:
  language: ru
  text: Но пусть наша сила будет законом справедливости[a], ибо слабое признаётся бесполезным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «законом праведности». Греческое δικαιοσύνη может означать как справедливость, так и праведность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω
  choice: пусть ... станет
  rationale: Императив третьего лица от εἰμί выражает призыв установить силу в качестве закона; «пусть ... станет» естественно передаёт это по-русски.
- source_word: ἡμῶν ἡ ἰσχὺς
  choice: наша сила
  rationale: ἰσχύς обозначает силу или мощь; нейтральное «сила» сохраняет широту греческого слова.
- source_word: νόμος
  choice: закон
  rationale: 'Буквальное «закон» сохраняет резкий тезис говорящих: сила должна определять норму справедливости.'
- source_word: τῆς δικαιοσύνης
  choice: справедливости
  rationale: В контексте общественной нормы δικαιοσύνη естественно означает справедливость; возможный нравственно-религиозный оттенок «праведности» сохранён в сноске.
- source_word: τὸ ἀσθενὲς
  choice: слабое
  rationale: Субстантивированное прилагательное среднего рода выражает обобщённое понятие; «слабое» не сужает смысл до слабого человека.
- source_word: ἄχρηστον
  choice: бесполезным
  rationale: Передаёт прямое значение «непригодное, не приносящее пользы» и циничную логику говорящих.
- source_word: ἐλέγχεται
  choice: оказывается
  rationale: В данном утверждении глагол означает, что слабое обнаруживается или выявляется как бесполезное; «оказывается» звучит естественно и не навязывает судебного оттенка.
theological_decisions:
- issue: Значение δικαιοσύνη в речи нечестивых
  choice: справедливость
  alternative: праведность
  rationale: Здесь речь идёт о силе как о правиле, определяющем должный порядок, поэтому «справедливость» контекстуально естественнее. Однако греческое слово допускает также значение «праведность», что отмечено в сноске и сохраняет намеренно извращённую нечестивыми нравственную формулу.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и намеренно циничная речь сохранена. Формулировка остаётся понятной без сглаживания нравственного напряжения стиха.
