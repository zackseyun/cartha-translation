  text: He claims to have knowledge of God[a], and calls himself a child of the Lord;
translation:
  language: ru
  text: Он заявляет, что обладает знанием Бога, и называет себя сыном Господа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугой Господа»; греческое слово παῖς может означать «ребёнок», «сын» или, в некоторых контекстах, «слуга».'
    reason: Сохраняет возможное служебное значение παῖς и указывает на более широкое лексическое поле слова.
lexical_decisions:
- source_word: ἐπαγγέλλεται
  choice: заявляет
  rationale: В данном контексте глагол передаёт публичное утверждение о себе, не предрешая, истинно оно или ложно; «обещает» здесь не соответствует конструкции с инфинитивом.
- source_word: γνῶσιν ἔχειν θεοῦ
  choice: обладает знанием Бога
  rationale: Сохраняет именную конструкцию оригинала («иметь знание Бога») и её несколько возвышенный оттенок, оставаясь естественной по-русски.
- source_word: θεοῦ
  choice: Бога
  rationale: Родительный падеж передан без добавочного уточнения; отсутствие артикля не требует смыслового разграничения в русском.
- source_word: παῖδα
  choice: чадом
  rationale: В контексте естественнее всего родственное значение слова παῖς. «Чадо» сохраняет возвышенный библейский регистр и не сужает значение до однозначно мужского «сына»; возможное значение «слуга» отмечено в сноске.
- source_word: Κυρίου
  choice: Господа
  rationale: Передаёт κύριος согласно устойчивому библейскому употреблению и сохраняет отличие от предшествующего θεός.
- source_word: ἑαυτὸν ὀνομάζει
  choice: называет себя
  rationale: Естественная русская передача возвратной конструкции со значением самообозначения.
theological_decisions:
- issue: Передача παῖδα Κυρίου при возможном родственном или служебном значении
  choice: чадом Господа
  alternative: сыном Господа; слугой Господа
  rationale: Ближайший контекст подчёркивает особые отношения праведника с Богом, поэтому родственное значение вероятнее служебного. При этом многозначность παῖς сохранена в примечании.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — естественный и устойчивый эквивалент κύριος в данном библейском контексте; оснований конкретизировать выражение как «Господь Бог» нет.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Чадо» выбрано как понятное в религиозном контексте слово, позволяющее сохранить родственное значение и не вводить излишнюю конкретизацию.
