base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/014.yaml
  text: He became a reproof to our thoughts[a]; even being seen is burdensome to us[b],
translation:
  language: ru
  text: Он стал для нас обличением наших помыслов[a]; нам тяжело даже видеть его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обличением наших внутренних рассуждений». Греческое ἔλεγχος может означать обличение, выявляющее неправоту, а ἐννοίαι — внутренние мысли или рассуждения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «он тягостен для нас, даже когда его видят», то есть им трудно вынести уже один его вид.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: стал
  rationale: Аорист γίνομαι обозначает наступившее состояние; «стал» естественно передаёт это значение, не добавляя отсутствующего в греческом перфектного оттенка.
- source_word: εἰς ἔλεγχον
  choice: обличением
  rationale: ἔλεγχος означает обличение, выявляющее неправоту. «Обличение» сохраняет нравственный смысл и не усиливает его до судебного осуждения.
- source_word: ἐννοιῶν
  choice: помыслов
  rationale: ἐννοίαι обозначает внутренние мысли или рассуждения. «Помыслы» передаёт внутренний и нравственно окрашенный характер мыслей в данном контексте.
- source_word: βαρύς
  choice: тяжело
  rationale: 'Предикативное βαρύς употреблено метафорически: присутствие праведника для говорящих невыносимо. Безличная русская конструкция звучит естественно и сохраняет образ тяжести.'
- source_word: βλεπόμενος
  choice: видеть его
  rationale: Пассивное причастие буквально значит «будучи видимым». По-русски смысл естественно передаётся активной конструкцией «видеть его», относящей восприятие к говорящим.
theological_decisions:
- issue: Подразумеваемое подлежащее
  choice: Он
  alternative: праведник; этот человек
  rationale: Стих продолжает речь о праведнике из ближайшего контекста. Местоимение сохраняет невыраженное в греческом тексте подлежащее и не добавляет поясняющего существительного.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для русского, при этом сохранены две параллельные жалобы говорящих и нравственная напряжённость оригинала.
