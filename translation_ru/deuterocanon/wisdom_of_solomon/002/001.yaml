  source_fidelity: Требуется исправление двух существенных мест. ἐν ἑαυτοῖς означает «сами с собой / в себе», а не взаимный разговор «друг другу». Основной смысл ὁ ἀναλύσας ἐξ ᾅδου в данном контексте — тот, кто вернулся (вышел) из Аида; вариант «освободился» возможен лишь как примечание. «Аид» точнее передаёт ᾅδης, чем «ад», поскольку последнее в современном русском обычно вызывает более узкую ассоциацию с местом посмертного наказания.
  naturalness: Исправленный текст сохраняет сжатую литературную форму и делает конструкцию о конце жизни естественнее, не заменяя её толкованием «смерть».
  terminology: «Аид» сохраняет греческое наименование царства мёртвых. «Исцеление» допустимо для ἴασις и сохраняет образ исходника; примечание поясняет возможное значение τελευτή как смерти.
