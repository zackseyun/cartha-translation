base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/001.yaml
  text: For they said among themselves[a], reasoning wrongly, “Our life is short and sorrowful, and there is no remedy at the end of a man's life[b], and no one has been known to return from Hades.”
translation:
  language: ru
  text: 'Ибо они говорили сами с собой, рассуждая неверно: «Коротка и печальна наша жизнь, и нет исцеления в конце человеческой жизни[a], и неизвестен тот, кто вернулся из Аида[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при конце человека»; «конец» может означать смерть человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тот, кто освободился из Аида». Греческое причастие ἀναλύσας допускает значение «освободившийся» или «ушедший»; в данном контексте подразумевается возвращение из Аида, области мёртвых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον γὰρ ἐν ἑαυτοῖς
  choice: Ведь они сказали друг другу
  rationale: γάρ передано причинно-пояснительным «ведь»; ἐν ἑαυτοῖς здесь естественно означает внутренний разговор в кругу этих людей — «друг другу».
- source_word: λογισάμενοι οὐκ ὀρθῶς
  choice: рассуждая неверно
  rationale: Сохраняет обстоятельственный характер причастия и прямую оценку их рассуждения как ошибочного.
- source_word: ὀλίγος ἐστὶν καὶ λυπηρὸς ὁ βίος ἡμῶν
  choice: Коротка и печальна наша жизнь
  rationale: ὀλίγος при βίος обозначает краткость жизни, а λυπηρός — её скорбный, причиняющий печаль характер; русская инверсия звучит естественно и достойно.
- source_word: οὐκ ἔστιν ἴασις ἐν τελευτῇ ἀνθρώπου
  choice: нет исцеления, когда человек приходит к концу
  rationale: ἴασις передано широким образом «исцеление», без сведения метафоры к медицинскому средству; τελευτή допускает значения «конец» и «смерть», поэтому основной текст сохраняет образ конца, а примечание поясняет смысл.
- source_word: οὐκ ἐγνώσθη
  choice: неизвестен
  rationale: Пассивная форма выражает отсутствие известного людям примера; краткая русская конструкция сохраняет обобщённый смысл.
- source_word: ὁ ἀναλύσας ἐξ ᾅδου
  choice: тот, кто освободился из ада
  rationale: ἀναλύω буквально связано с развязыванием, освобождением или уходом; «освободился» сохраняет эту форму точнее, чем однозначное «вернулся». ᾅδης передан традиционным русским «ад» со строчной буквы как область мёртвых, с пояснением в сноске.
theological_decisions:
- issue: Обобщённое ἀνθρώπου
  choice: человек
  alternative: мужчина; человеческая жизнь
  rationale: Греческое существительное стоит в единственном числе, но обозначает любого человека, а не только мужчину; русское «человек» точно сохраняет обобщённость.
- issue: Смысл ἴασις при человеческом конце
  choice: исцеление
  alternative: средство; избавление
  rationale: «Исцеление» сохраняет метафору греческого слова и не вводит более узкого учения о том, что именно могло бы последовать после смерти.
- issue: Передача ὁ ἀναλύσας
  choice: тот, кто освободился
  alternative: тот, кто вернулся
  rationale: Более буквальная передача сохраняет подлинную лексическую неоднозначность причастия; предполагаемый смысл возвращения из области мёртвых указан в сноске.
- issue: Передача ᾅδης
  choice: ад
  alternative: царство мёртвых; преисподняя
  rationale: Традиционное соответствие сохраняет название области мёртвых, но сноска предотвращает автоматическое отождествление здесь с местом окончательного наказания.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем речи нечестивых. Сохранены причинное «ведь», авторская оценка ошибочности их рассуждения и неоднозначность выражения ὁ ἀναλύσας. Все сноски имеют маркеры в основном тексте.
