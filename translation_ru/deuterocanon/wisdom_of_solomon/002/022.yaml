    text: 'Или: «Его сокровенного».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на награду за благочестие».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не судили о чести непорочных душ»; греческое выражение сжато и может означать также: «не признавали чести непорочных душ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: не познали
  rationale: Передаёт аорист γινώσκω как отсутствие постижения скрытых Божьих замыслов; литературно и естественно в данном контексте.
- source_word: μυστήρια
  choice: тайн
  rationale: «Тайны» сохраняет значение скрытых реалий и богословскую весомость слова, не уточняя их содержание сверх греческого текста.
- source_word: αὐτοῦ
  choice: Его
  rationale: Сохранено местоимение оригинала; прописная буква естественно указывает на Бога как контекстуального референта.
- source_word: μισθὸν
  choice: награду
  rationale: В нравственно-религиозном контексте «награда» естественнее буквального и коммерчески окрашенного «плата».
- source_word: ἤλπισαν
  choice: не надеялись на
  rationale: Прямо передаёт направленную в будущее надежду, выраженную ἐλπίζω.
- source_word: ὁσιότητος
  choice: за святость
  rationale: ὁσιότης обозначает святость, благочестие или благоговейную праведность; «святость» сохраняет широкую нравственно-религиозную силу термина.
- source_word: ἔκριναν
  choice: не признавали
  rationale: В сжатой конструкции выражает отрицательную оценку или непризнание; по-русски звучит естественнее буквального «не судили».
- source_word: γέρας
  choice: чести, уготованной
  rationale: γέρας — почесть, почётная награда или преимущество. Добавление «уготованной» раскрывает подразумеваемое отношение к душам, не превращая честь в их внутреннее достоинство.
- source_word: ψυχῶν
  choice: душам
  rationale: Сохраняет антропологическое и эсхатологическое звучание ψυχή в контексте участи праведных.
- source_word: ἀμώμων
  choice: непорочным
  rationale: Передаёт отсутствие нравственного пятна или порока; «непорочный» соответствует возвышенному, но понятному регистру.
theological_decisions:
- issue: Референт αὐτοῦ в выражении «Его тайн»
  choice: Местоимение сохранено, а прописная буква указывает на Бога
  alternative: Оставить «его» формально неоднозначным или раскрыть как «Божьих»
  rationale: Контекст указывает на Бога, однако существительное не подставляется вместо местоимения оригинала; тем самым сохраняется форма исходного текста.
- issue: Значение ψυχῶν
  choice: «душам»
  alternative: «людям» или «жизням»
  rationale: «Душам» сохраняет связь с посмертной участью праведных, не добавляя более определённой антропологической доктрины.
- issue: Смысл сжатого сочетания γέρας ψυχῶν ἀμώμων
  choice: «чести, уготованной непорочным душам»
  alternative: «не считали непорочные души достойными чести» или буквально «не судили о чести непорочных душ»
  rationale: Греческое выражение допускает понимание γέρας как почести или награды, относящейся к непорочным душам. Выбранный вариант сохраняет эту связь и не утверждает, что сами нечестивые должны были воздавать им честь.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Три отрицательные части оригинала переданы параллельными однородными сказуемыми; конечная сжатая греческая конструкция осторожно раскрыта ради ясности.
