base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/024.yaml
  text: They no longer keep either lives or marriages pure[a]; instead, one kills another by treachery[b], or by adultery causes grief.
translation:
  language: ru
  text: 'Они уже не хранят в чистоте ни свою жизнь, ни браки: один убивает другого, подстерегая его[a], или причиняет боль супружеской изменой[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устроив засаду»; греческое слово означает тайно подстерегать кого-либо для нападения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «искажая (или оскверняя), причиняет боль»; в связи с упомянутыми браками имеется в виду нарушение супружеской верности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βίους
  choice: свою жизнь
  rationale: Множественное βίους может обозначать жизнь или образ жизни каждого из людей. Русское собирательное «свою жизнь» естественно передаёт нравственный смысл в перечне пороков, не сужая его до средств к существованию.
- source_word: γάμους
  choice: браки
  rationale: В сочетании с «хранят в чистоте» речь идёт о сохранении чистоты брачных союзов, а не о свадебных обрядах.
- source_word: καθαροὺς ... φυλάσσουσιν
  choice: хранят в чистоте
  rationale: Сочетание передаёт как значение сохранения и оберегания, так и нравственную чистоту; оно естественно применимо и к жизни, и к бракам.
- source_word: λοχῶν
  choice: подстерегая его
  rationale: Причастие обозначает выслеживание, ожидание в засаде или скрытое нападение. «Подстерегая» сохраняет конкретный образ тайного умысла.
- source_word: ἀναιρεῖ
  choice: убивает
  rationale: Прямое и нейтральное соответствие обычному значению глагола «убивать, устранять», без добавления юридической квалификации.
- source_word: νοθεύων
  choice: супружеской изменой
  rationale: Глагол буквально связан с подделыванием, примесью или порчей, а в контексте брака указывает на нарушение супружеской верности. Русская формулировка ясно передаёт подразумеваемую измену.
- source_word: ὀδυνᾷ
  choice: причиняет боль
  rationale: Глагол означает причинять боль, мучить или огорчать. «Причиняет боль» сохраняет широту телесного или душевного страдания и не уточняет объект, которого нет в греческом тексте.
theological_decisions:
- issue: Объём понятия нравственной чистоты в βίους ... γάμους καθαρούς
  choice: Стих осуждает утрату чистоты как в жизни людей, так и в брачных отношениях.
  alternative: Можно понимать βίους уже — как образ жизни или средства к существованию, а всё выражение — в ритуальном смысле.
  rationale: Контекст описывает нравственный распад, связанный с идолопоклонством. Перевод сохраняет общий этический смысл, не сводя его к ритуальной чистоте или хозяйственной деятельности.
- issue: Характер действия νοθεύων
  choice: Нарушение супружеской верности, причиняющее боль.
  alternative: 'Более буквально: «оскверняя» или «делая незаконным», без прямого называния измены.'
  rationale: Непосредственное упоминание браков делает супружескую неверность наиболее вероятным значением, однако примечание сохраняет более широкий образ порчи брака.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет парное противопоставление двух проявлений нравственного распада; конкретность «подстерегая» и сдержанное «причиняет боль» удерживают образность и смысловую широту греческого текста.
