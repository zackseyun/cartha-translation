base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/012.yaml
  text: For the beginning of sexual immorality is the devising of idols[b][a], and the invention of them is the corruption of life.
translation:
  language: ru
  text: Ибо начало распутства — замысел идолов, а их изобретение — разрушение жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гибель жизни»; также возможно: «растление жизни».'
    reason: Лексема φθορά может означать порчу, разложение, разрушение или гибель.
lexical_decisions:
- source_word: Ἀρχὴ
  choice: начало
  rationale: 'Сохраняет краткую именную конструкцию греческого текста и допускает как временной, так и причинный оттенок: начало, происхождение.'
- source_word: πορνείας
  choice: распутства
  rationale: Передаёт широкий смысл недозволенного полового поведения и не сводит слово ни к проституции, ни к метафорической неверности.
- source_word: ἐπίνοια
  choice: замысел
  rationale: Обозначает возникший в уме и продуманный замысел; сохраняет отличие от последующего εὕρεσις — фактического изобретения.
- source_word: εἰδώλων
  choice: идолов
  rationale: В иудейско-греческом контексте речь идёт именно об объектах идолопоклонства, а не о нейтральных изображениях.
- source_word: εὕρεσις
  choice: изобретение
  rationale: В параллели с ἐπίνοια указывает на человеческое измышление и введение идолов, а не на обнаружение уже существовавшего.
- source_word: αὐτῶν
  choice: их
  rationale: Местоимение отсылает к идолам и естественно передаёт греческую родительную конструкцию.
- source_word: φθορὰ ζωῆς
  choice: разрушение жизни
  rationale: Передаёт широкий диапазон φθορά — порчу, разложение, гибель — и сохраняет компактность и весомость исходной формулы.
theological_decisions:
- issue: Понимать ли πορνεία буквально или как обозначение идолопоклонства и духовной неверности
  choice: Передать как «распутство», сохранив прямое значение сексуальной безнравственности.
  alternative: «неверность» или «идолопоклонство»
  rationale: В стихе замысел идолов назван началом πορνεία; отождествление этих понятий стёрло бы выраженную автором связь между ними. Возможный метафорический отзвук сохраняется благодаря контексту.
- issue: Насколько конкретизировать φθορὰ ζωῆς
  choice: Оставить широкую формулировку «разрушение жизни».
  alternative: «гибель жизни», «растление жизни» или более узкое «уничтожение человеческой жизни»
  rationale: Греческое выражение может охватывать нравственную порчу, упадок и гибель. Перевод не ограничивает его только физической смертью или только нравственным разложением.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой оригинала. «Распутство» понятно широкому кругу читателей и сохраняет сексуальный смысл без архаизма «блуд»; тире воспроизводят две параллельные именные формулы.
