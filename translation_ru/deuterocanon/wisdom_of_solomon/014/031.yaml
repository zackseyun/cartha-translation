  verdict: revise
  source_fidelity: Основная противопоставительная структура, образ ενεργного преследования (ἐπεξέρχεται) и постоянство действия (ἀεί) переданы верно. Однако «преступление» в современном русском прежде всего означает уголовно наказуемое деяние и несколько сужает παράβασις, то есть нарушение/преступление нравственной нормы. «Кара согрешающим» понятна как кара, обращённая на согрешающих, но конструкция менее естественна, чем «возмездие за грех», при этом последнее достаточно точно передаёт судебно-возмездный смысл δίκη τῶν ἁμαρτανόντων.
  naturalness: Синтаксис «не…, но… всегда преследует…» литературен и понятен. Замена «кара согрешающим» на «возмездие за грех» делает фразу более естественной и избегает не вполне обычного дательного управления при слове «кара». «Нарушение неправедных» сохраняет высокий, но современно понятный нравственно-судебный регистр.
  terminology: «Возмездие» уместно передаёт δίκη как последствие и наказание за грех, не сводя термин к отвлечённому «правосудию» и не привнося конкретной богословской схемы. «Нарушение» точнее передаёт παράβασις, чем юридически более узкое «преступление». Неоднозначность τῶν ὀμνυμένων сохранена в «того, чем клянутся» и в примечании.
  issues:
