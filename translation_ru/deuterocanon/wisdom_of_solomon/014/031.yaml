    rationale: Греческое παράβασις обозначает переход за установленную границу, нарушение, проступок; контекст морально-судебный, но не обязательно уголовно-правовой.
  - severity: low
    issue: «Кара согрешающим» стилистически менее естественно и несколько тяжеловесно.
    rationale: Дательный падеж верно указывает на тех, кого кара постигает, однако «возмездие за грех» яснее выражает связь δίκη с ἁμαρτανόντων без изменения смысла.
