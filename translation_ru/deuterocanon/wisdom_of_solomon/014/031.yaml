base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/031.yaml
  text: For it is not the power of the things by which they swear[a], but the punishment of those who sin[b], that always pursues the transgression of the unrighteous.
translation:
  language: ru
  text: Ибо не сила того, чем клянутся[a], но возмездие за грех[b] всегда преследует нарушение неправедных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сила клятв»; или: «сила тех, кем клянутся». Греческое выражение сжато и может относиться либо к самой клятве, либо к тому, что призывают при клятве.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кара согрешающих»; возможно также: «наказание грешников».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Ибо не
  rationale: Передаёт пояснительно-причинную связь с предшествующей мыслью и сохраняет отрицательное противопоставление οὐ… ἀλλά.
- source_word: ἡ τῶν ὀμνυμένων δύναμις
  choice: сила того, чем клянутся
  rationale: Сжатая греческая конструкция может указывать как на клятву, так и на призываемый при клятве предмет или сущность. Нейтральное «того, чем» сохраняет эту неоднозначность и не приписывает объектам клятвы реальной силы.
- source_word: ἡ τῶν ἁμαρτανόντων δίκη
  choice: кара согрешающим
  rationale: δίκη здесь обозначает судебно-возмездный ответ на грех. «Кара» естественно передаёт наказание, а «согрешающим» ясно показывает, на кого оно обращено, избегая двусмысленного русского сочетания «кара согрешающих».
- source_word: ἐπεξέρχεται
  choice: преследует
  rationale: Глагол выражает активное следование по пятам или преследование; этот образ сильнее и точнее, чем нейтральное «постигает».
- source_word: ἀεὶ
  choice: всегда
  rationale: Прямой и естественный эквивалент наречия, сохраняющий всеобщность утверждения.
- source_word: τὴν τῶν ἀδίκων παράβασιν
  choice: преступление неправедных
  rationale: «Преступление» сохраняет смысл нарушения установленной нормы в παράβασις, а «неправедных» передаёт нравственно-судебную окраску ἀδίκων.
theological_decisions:
- issue: Характер δίκη как ответа на грех
  choice: кара согрешающим
  alternative: правосудие над согрешающими; возмездие согрешающим
  rationale: Контекст требует действенного карательного последствия, противопоставленного мнимой силе того, чем клянутся. «Кара» передаёт возмездный аспект, не уточняя сверх текста, непосредственно ли действует Бог или установленный им нравственный порядок.
- issue: К чему относится τῶν ὀμνυμένων
  choice: того, чем клянутся
  alternative: клятв; тех, кем клянутся
  rationale: Формулировка сохраняет возможность понимать выражение и как относящееся к клятвенным формулам, и как относящееся к призываемым в клятве сущностям, не разрешая неоднозначность конфессионально нагруженным толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной афористики. Синтаксическое противопоставление «не… но…» следует греческой структуре; лексика ясна широкому читателю и сохраняет судебно-нравственный тон стиха.
