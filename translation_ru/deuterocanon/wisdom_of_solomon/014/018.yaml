  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/018.yaml
  text: And the ambition of the craftsman urged on even those who were ignorant toward an intensification of worship[a].
translation:
  language: ru
  text: Честолюбие мастера побуждало даже тех, кто оставался в неведении, к усилению поклонения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к усилению религиозного почитания»; букв. «к усилению религии».'
    reason: Сочетание ἐπίτασιν θρησκείας допускает передачу «усиление религиозного почитания»; слово θρησκεία также может означать «религия».
lexical_decisions:
- source_word: ἐπίτασιν
  choice: всё больше усердствовать
  rationale: Существительное обозначает усиление или возрастание интенсивности; глагольная конструкция естественно передаёт направленность εἰς и сочетается с «побуждало».
- source_word: θρησκείας
  choice: в поклонении
  rationale: В контексте изготовления идолов слово относится прежде всего к культовому почитанию, а не к религии как отвлечённому понятию.
- source_word: ἀγνοοῦντας
  choice: тех, кто ничего не знал
  rationale: Причастие обозначает не знающих, несведущих людей; перевод сохраняет неопределённость относительно того, чего именно они не знали.
- source_word: τεχνίτου
  choice: мастера
  rationale: Слово обозначает умелого изготовителя изображения; «мастер» — естественное и современное русское соответствие.
- source_word: προετρέψατο
  choice: побуждало
  rationale: Глагол выражает побуждение или склонение к действию без обязательного оттенка принуждения.
- source_word: φιλοτιμία
  choice: честолюбие
  rationale: Слово буквально связано со стремлением к почёту и здесь указывает на желание мастера добиться признания; «честолюбие» сохраняет этот мотив точнее, чем нейтральное «усердие».
theological_decisions:
- issue: Передача θρησκεία в полемике с идолопоклонством
  choice: поклонение
  alternative: религия; религиозное почитание
  rationale: «Поклонение» подчёркивает практическое культовое действие, соответствующее контексту, не превращая термин в позднейшее богословское понятие.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство и полемический тон текста. Перестройка именной конструкции в глагольную устраняет тяжеловесность без утраты смысла усиления поклонения.
