base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/001.yaml
  text: Again[a], someone preparing to sail and about to pass through wild waves boards more fragile wood than the ship that carries him.
translation:
  language: ru
  text: 'И снова: человек, собираясь в плавание и готовясь пересечь свирепые волны, взывает к куску дерева, более ветхому, чем несущий его корабль.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взывает к дереву, более ветхому, чем несущий его корабль». Под «деревом» здесь подразумевается сделанный из дерева идол.'
    reason: Сохраняется буквальный образ ξύλον и кратко поясняется подразумеваемый в контексте предмет обращения.
lexical_decisions:
- source_word: πλοῦν … στελλόμενος
  choice: собираясь в плавание
  rationale: В засвидетельствованном тексте издания Swete πλοῦν («плавание, морской путь») вместе со στελλόμενος передаёт подготовку к морскому путешествию; русское выражение естественно и сохраняет морской контекст.
- source_word: τις
  choice: человек
  rationale: Неопределённое местоимение обозначает типичного представителя людей; «человек» здесь естественно по-русски и не превращает его в конкретное лицо.
- source_word: πάλιν
  choice: И снова
  rationale: Наречие вводит следующий пример в продолжающемся рассуждении.
- source_word: ἄγρια … κύματα
  choice: свирепые волны
  rationale: ἄγρια изображает волны как необузданные и опасные; «свирепые» сохраняет выразительность образа.
- source_word: διοδεύειν
  choice: пересечь
  rationale: Глагол означает пройти через или преодолеть пространство; применительно к морским волнам «пересечь» звучит естественно.
- source_word: τοῦ φέροντος αὐτὸν πλοίου
  choice: чем несущий его корабль
  rationale: Сохраняется сравнительная конструкция и причастное описание корабля как средства, которое несёт путника.
- source_word: σαθρότερον
  choice: более ветхому
  rationale: Сравнительная форма указывает на худшее физическое состояние — непрочность, рыхлость или гнилость. «Ветхому» сохраняет эту широту лучше, чем более узкое «гнилому».
- source_word: ξύλον
  choice: к куску дерева
  rationale: В контексте речь идёт о деревянном идоле, которому противопоставлен корабль; «кусок дерева» передаёт и материальность предмета, и иронию текста.
- source_word: ἐπιβοᾶται
  choice: взывает
  rationale: Текст Swete 1909 читает ἐπιβοᾶται — «взывает, призывает на помощь», что соответствует полемике против идолов и синтаксису с дательным ξύλον.
theological_decisions:
- issue: Предмет обращения мореплавателя
  choice: взывает к куску дерева
  alternative: всходит на более непрочное дерево
  rationale: В печатном тексте указанного издания стоит ἐπιβοᾶται («взывает»), а не ἐπιβᾶται («всходит, садится»). Это также объясняет дательный ξύλον и сохраняет направленную против идолопоклонства мысль контекста без её дополнительного истолкования.
- issue: Степень физической испорченности идола
  choice: более ветхому
  alternative: более гнилому / более хрупкому
  rationale: σαθρός допускает значения непрочности, ветхости и гнилости. Выбор не ограничивает смысл исключительно буквальным гниением, но сохраняет сравнительный контраст с кораблём.
translation_notes:
  register: 'Современный литературный русский язык с достоинством сапиенциальной речи. Фраза построена ясно, но сохраняет ироническое сопоставление корабля и деревянного предмета, к которому обращается мореплаватель. Перевод следует печатному греческому тексту Swete, исправляя очевидные ошибки предоставленного нормализованного слоя: Ἰλοῦν вместо πλοῦν и ἐπιβᾶται вместо ἐπιβοᾶται.'
