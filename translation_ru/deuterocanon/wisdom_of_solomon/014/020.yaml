base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/020.yaml
  text: And the multitude[a], drawn by the charm of the workmanship, now regarded as an object of worship the man who a little before had been honored.
translation:
  language: ru
  text: Множество людей, увлечённое красотой работы мастера, теперь стало считать предметом поклонения[a] человека, которому ещё недавно оказывали почести.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идолом»; или: «священным изображением».'
    reason: Лексические варианты для σέβασμα, которое может обозначать предмет поклонения, идола или почитаемое священное изображение.
lexical_decisions:
- source_word: πλῆθος
  choice: множество людей
  rationale: Передаёт собирательное значение большого числа людей и звучит естественно в современном литературном русском языке.
- source_word: ἐφελκόμενον
  choice: увлечённое
  rationale: Причастие выражает притягивающее воздействие внешней привлекательности; «увлечённое» сохраняет эту пассивную направленность без тяжеловесности.
- source_word: διὰ τὸ εὔχαρι τῆς ἐργασίας
  choice: красотой исполнения
  rationale: εὔχαρι обозначает приятность и привлекательность, а ἐργασία — выполненную работу, мастерство исполнения; сочетание передаёт причину воздействия изображения естественным русским оборотом.
- source_word: τὸν πρὸ ὀλίγου τιμηθέντα ἄνθρωπον
  choice: человека, которого ещё недавно почитали
  rationale: Сохраняет временной контраст и различие между прежним человеческим почитанием и последующим религиозным поклонением.
- source_word: νῦν
  choice: стало
  rationale: Русская видо-временная конструкция «стало считать» естественно выражает наступившую перемену, которую νῦν противопоставляет прежнему состоянию; «ещё недавно» делает этот контраст явным.
- source_word: σέβασμα
  choice: предмет поклонения
  rationale: Широко передаёт объект религиозного почитания, не сужая значение заранее до «идола» или конкретного священного изображения.
- source_word: ἐλογίσαντο
  choice: стало считать
  rationale: Передаёт значение «сочли, признали кем-либо или чем-либо» и согласуется с собирательным подлежащим «множество».
theological_decisions:
- issue: Характер осуждаемого действия, выраженного словом σέβασμα
  choice: Человека стали считать предметом поклонения.
  alternative: Человека стали считать идолом или священным изображением.
  rationale: Греческий текст описывает переход от недавнего почитания человека к религиозному поклонению ему через художественное изображение. Более широкая формулировка сохраняет богословский смысл и не навязывает более узкого значения.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим книге Премудрости. Синтаксис упрощён до естественной русской конструкции, при этом сохранены причинная связь и резкий переход от человеческого почитания к поклонению.
