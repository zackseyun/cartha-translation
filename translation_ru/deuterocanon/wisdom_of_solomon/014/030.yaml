base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/030.yaml
  text: But justice will pursue them both[a], because they thought wrongly about God by giving heed to idols, and they swore unjustly in deceit[c][b], despising holiness.
translation:
  language: ru
  text: 'Но за то и другое их настигнет справедливое воздаяние[a]: они неверно мыслили о Боге, обратившись к идолам[b], и несправедливо клялись, прибегая к обману и презирая святость[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их настигнет правосудие за оба проступка»; возможно также: «обоих настигнет справедливое воздаяние».'
    reason: Сохраняется неоднозначность ἀμφότερα и собирательное значение τὰ δίκαια.
  - marker: b
    text: То есть они составили неверное представление о Боге, привязавшись к идолам.
    reason: Поясняется смысл сочетания κακῶς ἐφρόνησαν περὶ θεοῦ προσχόντες εἰδώλοις.
  - marker: c
    text: 'Или: «презирая благочестие»; возможно также: «пренебрегая тем, что свято».'
    reason: ὁσιότης допускает значения святости, благочестия и почтения к священному.
lexical_decisions:
- source_word: ἀμφότερα … τὰ δίκαια
  choice: за то и другое … справедливое воздаяние
  rationale: ἀμφότερα указывает на два названных далее проступка, а субстантивированное τὰ δίκαια обозначает справедливые последствия или требования правосудия. «Справедливое воздаяние» естественно по-русски передаёт карательный оттенок μετελεύσεται, не уточняя вид кары.
- source_word: μετελεύσεται
  choice: настигнет
  rationale: Глагол выражает преследование с целью взыскания или наказания. «Настигнет» сохраняет образ неизбежно достигающего виновных воздаяния.
- source_word: κακῶς ἐφρόνησαν περὶ θεοῦ
  choice: неверно мыслили о Боге
  rationale: Речь идёт об ошибочном представлении или суждении о Боге, а не только о злых чувствах по отношению к Нему.
- source_word: προσχόντες εἰδώλοις
  choice: обратившись к идолам
  rationale: Причастие обозначает направленность внимания и приверженность идолам. «Обратившись» передаёт это естественно, не усиливая выражение до явно не названного культового служения.
- source_word: ἀδίκως ὤμοσαν ἐν δόλῳ
  choice: несправедливо клялись, прибегая к обману
  rationale: ἀδίκως шире, чем просто «ложно», и подчёркивает неправедность клятв; ἐν δόλῳ указывает на обманный характер или способ принесения клятвы.
- source_word: καταφρονήσαντες ὁσιότητος
  choice: презирая святость
  rationale: ὁσιότης может означать святость, благочестие или почтение к священному. «Святость» сохраняет весомость и широту термина.
theological_decisions:
- issue: Референт ἀμφότερα и значение τὰ δίκαια
  choice: «То и другое» относится к двум проступкам, названным далее; τὰ δίκαια передано как «справедливое воздаяние».
  alternative: «Обоих» может относиться к двум группам людей из предшествующего контекста, а τὰ δίκαια можно передать как «правосудие» или «то, чего требует справедливость».
  rationale: Средний род множественного числа ἀμφότερα естественно указывает на два деяния, однако синтаксис допускает контекстуальное понимание. Формулировка и сноска сохраняют эту неоднозначность.
- issue: Смысл ὁσιότης
  choice: «святость»
  alternative: «благочестие» или «то, что свято»
  rationale: Греческое слово охватывает почтение к Богу и священному; основной текст не сужает его до личной религиозности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис сохраняет причинную связь и параллелизм двух проступков; архаизмы и конфессионально окрашенные уточнения исключены.
