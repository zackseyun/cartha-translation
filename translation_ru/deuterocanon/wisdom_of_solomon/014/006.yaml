base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/006.yaml
  text: For when the proud giants were being destroyed at the beginning[a], the hope of the world, taking refuge on a raft, left to the age to come a seed of generation[b], steered by your hand.
translation:
  language: ru
  text: Ибо когда в начале погибали надменные исполины, надежда мира, укрывшись на плоту[a], оставила грядущему веку семя рода[b], направленная Твоей рукой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на судне», «на небольшом плавучем сооружении». В греческом тексте буквально стоит «плот» — намеренно необычное слово вместо обычного обозначения корабля или ковчега.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «семя рождения (происхождения)». Здесь «век» передаёт греческое αἰών, отличное от слова κόσμος («мир») в словосочетании «надежда мира».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχῆς
  choice: в начале
  rationale: Родительный падеж имеет временное значение и указывает на древнейшую эпоху; «в начале» естественно передаёт это без метафизического уточнения.
- source_word: ἀπολλυμένων
  choice: погибали
  rationale: Причастие настоящего времени передаёт продолжающуюся гибель. Непереходное «погибали» сохраняет допустимую средне-пассивную неоднозначность формы.
- source_word: ὑπερηφάνων γιγάντων
  choice: надменные исполины
  rationale: «Надменные» ясно выражает нравственно отрицательную гордыню, а «исполины» естественно отсылает к древнему преданию книги Бытия, не привнося ассоциаций с греческими титанами.
- source_word: ἡ ἐλπὶς τοῦ κόσμου
  choice: надежда мира
  rationale: Сохранена возвышенная персонификация, которая может обозначать Ноя, спасённый остаток человечества или саму надежду, не устраняя эту смысловую многозначность.
- source_word: ἐπὶ σχεδίας
  choice: на плоту
  rationale: σχεδία буквально обозначает плот или простое плавучее сооружение, а не обычный корабль или ковчег; необычный образ оригинала сохранён.
- source_word: καταφυγοῦσα
  choice: укрывшись
  rationale: Глагол выражает бегство в безопасное место и обретение убежища; деепричастие кратко и естественно передаёт оба оттенка.
- source_word: τῷ αἰῶνι
  choice: грядущему веку
  rationale: В отличие от κόσμος («мир») слово αἰών здесь имеет временную направленность и обозначает последующую эпоху человеческой истории.
- source_word: σπέρμα γενέσεως
  choice: семя рода
  rationale: «Семя» сохраняет исходную метафору, а «рода» естественно передаёт идею рождения, происхождения и продолжения человечества, не добавляя отсутствующего в греческом слова «новый».
- source_word: τῇ σῇ κυβερνηθείσῃ χειρί
  choice: ведомая Твоей рукой
  rationale: Передаёт управление спасительным плаванием и Божественное действие. «Ведомая» звучит естественно по-русски и не ограничивает образ исключительно техническим управлением судном.
theological_decisions:
- issue: Кого или что означает «надежда мира»
  choice: Сохранить персонифицированное выражение без уточняющей подстановки имени Ноя или понятия остатка
  alternative: Прямо назвать Ноя либо спасённый остаток человечества
  rationale: Женский род причастия согласуется с ἐλπίς, а контекст позволяет видеть за образом Ноя и продолжившееся через него человечество. Перевод не устраняет намеренную образность.
- issue: Различение κόσμος и αἰών
  choice: κόσμος передать как «мир», а αἰών — как «грядущий век»
  alternative: Оба слова передать как «мир» либо αἰών перевести «потомству»
  rationale: Разные греческие слова создают смысловое различие между миром как целым и будущим ходом человеческой истории; временная передача αἰών сохраняет это различие.
- issue: Божественное руководство спасением
  choice: «ведомая Твоей рукой»
  alternative: «управляемая Твоей рукой» или «направляемая Твоей рукой»
  rationale: Формулировка сохраняет морской оттенок κυβερνάω и прямое указание на действие Бога, не уточняя сверх текста способ этого руководства.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет единую развернутую фразу оригинала, но остаётся понятным. Местоимение «Твоей» написано с прописной буквы как традиционное уважительное обращение к Богу; это не меняет смысла исходного текста.
