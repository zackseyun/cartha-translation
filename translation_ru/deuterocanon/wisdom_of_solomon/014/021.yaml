base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/021.yaml
  text: And this became an ambush against life[a], because men, enslaved by calamity or by tyranny, bestowed the incommunicable name on stones and wood.
translation:
  language: ru
  text: И это стало для жизни западнёй, потому что люди, порабощённые бедствием или тиранией, наделили камни и дерево именем, которого нельзя разделять ни с кем[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть исключительным именем — в данном контексте именем или честью, не подлежащими приписыванию идолам.
    reason: Поясняет антиидолопоклоннический контекст выражения, сохраняя в основном тексте буквальную идею неразделяемого имени и не утверждая больше, чем сказано непосредственно.
lexical_decisions:
- source_word: ἔνεδρον
  choice: западня
  rationale: Передаёт образ скрытой смертельной опасности; «засада» буквальнее, но по-русски менее естественно сочетается с отвлечённым «для жизни».
- source_word: τῷ βίῳ
  choice: для жизни
  rationale: Сохраняет широкий смысл βίος и конструкцию, в которой идолопоклонство становится западнёй, угрожающей человеческой жизни.
- source_word: συμφορᾷ
  choice: бедствием
  rationale: Передаёт тяжёлые неблагоприятные обстоятельства в достойном литературном регистре.
- source_word: τυραννίδι
  choice: тиранией
  rationale: Прямое соответствие обозначению деспотической власти или господства.
- source_word: δουλεύσαντες
  choice: порабощённые
  rationale: Сохраняет сильное значение подчинения и несвободы, выраженное глаголом δουλεύω.
- source_word: τὸ ἀκοινώνητον ὄνομα
  choice: имя, которого нельзя разделять ни с кем
  rationale: Передаёт буквальную идею имени, не являющегося общим и не подлежащего передаче другим, не вводя в основной текст специального богословского термина.
- source_word: λίθοις καὶ ξύλοις
  choice: камни и дерево
  rationale: Сохраняет конкретные материалы идолов без добавления отсутствующего в греческом слова «изображения».
- source_word: περιέθεσαν
  choice: наделили
  rationale: Естественно выражает приписывание имени камню и дереву; не воспроизводит механически буквальное пространственное значение глагола.
theological_decisions:
- issue: Смысл выражения τὸ ἀκοινώνητον ὄνομα в контексте идолопоклонства
  choice: имя, которого нельзя разделять ни с кем
  alternative: исключительное имя; несообщимое имя
  rationale: Формулировка сохраняет исключительность имени, вероятно Божьего, но не превращает подразумеваемое значение в прямое пояснение основного текста.
