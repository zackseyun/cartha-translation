translation:
  language: ru
  text: забвение благодеяний[a], осквернение душ, искажение деторождения[b], беспорядок в браках, прелюбодеяние и распутство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «забвение благодати». Греческое χάρις может означать благодеяние, благосклонность, благодать или благодарность — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «изменение (или перемена) рождения / происхождения». Вероятно, речь идёт об искажении естественного порядка рождения и продолжения рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτος ἀμνησία
  choice: забвение благодеяний
  rationale: Передаёт утрату памяти об оказанном благе и подразумеваемую неблагодарность, не привнося в перечень пороков узкобогословского значения слова «благодать».
- source_word: ψυχῶν μιασμός
  choice: осквернение душ
  rationale: Сохраняет нравственно-духовный и возможный культовый оттенок μιασμός, а также прямое значение ψυχαί.
- source_word: γενέσεως ἐναλλαγή
  choice: искажение деторождения
  rationale: Контекстуально передаёт порочное изменение порядка рождения и продолжения рода; сноска сохраняет буквальную неоднозначность сжатого греческого выражения.
- source_word: γάμων ἀταξία
  choice: беспорядок в браках
  rationale: Естественно по-русски передаёт нарушение должного порядка в брачных отношениях, не уточняя сверх текста конкретный вид проступка.
- source_word: μοιχεία
  choice: прелюбодеяние
  rationale: Точный и устойчивый русский термин для нарушения супружеской верности.
- source_word: ἀσέλγεια
  choice: распутство
  rationale: Передаёт бесстыдное и необузданное чувственное поведение в ясной современной форме.
theological_decisions:
- issue: Следует ли передавать χάριτος явно богословским словом «благодать»
  choice: забвение благодеяний
  alternative: забвение благодати
  rationale: Здесь дан перечень нравственных и общественных зол, а не учение о спасительной благодати. Выбранный вариант сохраняет значение оказанных благ и не снимает лексическую альтернативу, указанную в сноске.
- issue: Следует ли передавать ψυχῶν более нейтрально как «людей» или «жизней»
  choice: осквернение душ
  alternative: осквернение людей
  rationale: «Душ» сохраняет нравственно-духовный регистр Книги Премудрости, не навязывая при этом позднейшей систематической антропологии.
- issue: Насколько определённо истолковывать γενέσεως ἐναλλαγή
  choice: искажение деторождения
  alternative: изменение рождения
  rationale: В контексте брачных и половых пороков выражение имеет отрицательный смысл, однако его точный предмет остаётся сжатым и неоднозначным; буквальная возможность отражена в сноске.
translation_notes:
  register: 'Современный литературный русский язык; форма краткого перечня сохранена. Лексика торжественная, но понятная: «прелюбодеяние» уместно как точный библейский и юридико-нравственный термин, тогда как «распутство» остаётся общеупотребительным.'
