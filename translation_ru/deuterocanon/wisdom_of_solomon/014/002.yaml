  text: For it was desire for profit that devised that one[a], and skillful wisdom constructed it;
translation:
  language: ru
  text: Ведь его задумало стремление к выгоде[a], а изготовила искусная мудрость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стремление к приобретению»; греческое выражение может означать желание прибыли, выгоды или приобретения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο
  choice: его
  rationale: Местоимение среднего рода указывает на упомянутый в предыдущем стихе корабль; русское «его» естественно сохраняет эту отсылку без лишнего повторения существительного.
- source_word: ὄρεξις πορισμῶν
  choice: жажда наживы
  rationale: ὄρεξις обозначает сильное желание, а πορισμῶν — приобретение или прибыль; в контексте морской торговли выражение передаёт стремление к материальной выгоде.
- source_word: ἐπενόησεν
  choice: задумала
  rationale: Глагол обозначает мысленное изобретение или замысел и образует ясный контраст с последующим изготовлением.
- source_word: τεχνῖτις σοφία
  choice: умелая мудрость
  rationale: τεχνῖτις придаёт σοφία оттенок ремесного мастерства; сохранено ключевое для книги слово «мудрость».
- source_word: κατεσκεύασεν
  choice: создала
  rationale: Глагол означает изготовить, соорудить или устроить; «создала» естественно сочетается с олицетворённой мудростью и подразумеваемым кораблём.
theological_decisions:
- issue: Передача σοφία в контексте практического мастерства
  choice: мудрость
  alternative: мастерство
  rationale: «Мудрость» сохраняет ключевой тематический термин книги, тогда как определение τεχνῖτις выражает практический, ремесленный оттенок.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная структура и олицетворение желания и мудрости сохранены. «Жажда наживы» передаёт сильный и экономически окрашенный характер выражения, не делая подразумеваемый корабль явным.
