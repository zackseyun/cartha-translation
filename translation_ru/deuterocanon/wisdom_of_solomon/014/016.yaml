lexical_decisions:
- source_word: εἶτα ἐν χρόνῳ
  choice: Затем, с течением времени
  rationale: Передаёт как последовательную связь с предыдущей мыслью, так и постепенное развитие во времени.
- source_word: κρατυνθὲν τὸ ἀσεβὲς ἔθος
  choice: этот нечестивый обычай укоренился
  rationale: «Укоренился» естественно передаёт укрепление и утверждение обычая; «нечестивый» сохраняет религиозно-нравственную оценку ἀσεβές.
- source_word: ὡς νόμος ἐφυλάχθη
  choice: стал соблюдаться как закон
  rationale: Сохраняет значение соблюдения обычая с силой или статусом закона, не утверждая, что он формально стал законом.
- source_word: τυράννων ἐπιταγαῖς
  choice: по повелениям тиранов
  rationale: «Повеления» передаёт обязательные распоряжения, а «тираны» сохраняет оценочную окраску τύραννοι.
- source_word: ἐθρησκεύετο τὰ γλυπτά
  choice: стали поклоняться изваяниям
  rationale: Безличная русская конструкция естественно передаёт греческое сказуемое в единственном числе при среднем множественного рода; «изваяния» сохраняет указание на изготовленные, высеченные изображения.
theological_decisions:
- issue: Передавать ли τυράννων нейтрально как «правителей»
  choice: тиранов
  alternative: правителей
  rationale: Контекст обличает принудительное распространение идолопоклонства, а греческое слово несёт отрицательную оценку, которую не следует сглаживать.
- issue: Передавать ли τὰ γλυπτά истолковывающе как «идолы»
  choice: изваяниям
  alternative: идолам
  rationale: Греческое слово подчёркивает высеченную или резную природу предметов; их идольский характер уже ясно выражен глаголом поклонения.
