base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/005.yaml
  text: But you intend that the works of your wisdom should not be idle[a]; therefore even with the smallest piece of wood men entrust their lives, and passing through the waves on a raft[b], they were brought safely through.
translation:
  language: ru
  text: Но Ты желаешь, чтобы дела Твоей мудрости не были бездейственны; поэтому люди вверяют свои жизни[a] даже самому малому куску дерева[b] и, пройдя на плоту через бушующие волны, были спасены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои души». В контексте морской опасности речь, вероятнее всего, идёт о жизнях людей.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово буквально означает «дерево» или «древесина»; в данном контексте оно относится к крайне малому деревянному плавательному средству. Выражение подчёркивает его хрупкость в противопоставлении сохраняющему действию Божьей мудрости.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις
  choice: Ты желаешь
  rationale: Глагол выражает волю и намерение Бога; «желаешь» прямо передаёт настоящее время и целенаправленную волю.
- source_word: μὴ ἀργὰ εἶναι
  choice: не оставались бездейственными
  rationale: Передаёт значение ἀργός — «бездействующий, не производящий действия», сохраняя образ дел мудрости, которые не остаются без действия.
- source_word: τὰ τῆς σοφίας σου ἔργα
  choice: дела Твоей мудрости
  rationale: Сохраняет родительную конструкцию и богословски значимое упоминание Божьей мудрости без излишнего истолкования её статуса.
- source_word: ἐλαχίστῳ ξύλῳ
  choice: самому малому куску дерева
  rationale: Суперлатив ἐλάχιστος передан буквально, а ξύλον обозначает здесь дерево как хрупкий материал судна или плота.
- source_word: πιστεύουσιν … ψυχάς
  choice: вверяют свои жизни
  rationale: Конструкция означает доверить или поручить себя чему-либо; в морском контексте ψυχαί — жизни, подвергаемые опасности.
- source_word: κλύδωνα
  choice: бушующие волны
  rationale: κλύδων обозначает сильное морское волнение или вздымающуюся волну; множественное число естественно передаёт образ по-русски.
- source_word: σχεδίᾳ
  choice: на плоту
  rationale: σχεδία — плот или простейшее плавучее средство; предложная конструкция естественно передаёт инструментальный дательный.
- source_word: διεσώθησαν
  choice: были благополучно спасены
  rationale: 'Пассивная форма сохранена, а «благополучно» передаёт усилительное значение приставки δια-: безопасно пройти через опасность.'
theological_decisions:
- issue: Статус «Твоей мудрости» и действие Божьего промысла
  choice: Сохранено прямое обращение к Богу и выражение «дела Твоей мудрости» без уточнения, является ли мудрость самостоятельной персонифицированной фигурой.
  alternative: Истолковать Мудрость либо как отдельного личного деятеля, либо только как отвлечённое свойство Бога.
  rationale: Греческий текст приписывает действенность Божьей мудрости, но сам по себе не требует разрешать заложенную в формулировке богословскую неоднозначность.
- issue: Пассив в διεσώθησαν
  choice: Сохранено «были … спасены», не назван деятель спасения.
  alternative: 'Передать активно: «благополучно добрались» или прямо назвать Бога спасителем.'
  rationale: Пассив допускает подразумеваемое Божье действие, но не выражает деятеля явно; перевод сохраняет эту сдержанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные местоимения при обращении к Богу соответствуют русской издательской традиции. Синтаксис сохраняет движение греческого предложения от Божьей воли к примеру спасения на море.
