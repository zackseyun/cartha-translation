  text: For the worship of nameless idols is the beginning and cause and end of every evil[a][b].
translation:
  language: ru
  text: Ибо поклонение безымянным идолам — начало, причина и конец всякого зла.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идолов, не имеющих имени». Греческое прилагательное может подчёркивать, что у этих идолов нет истинного или достойного имени.'
