lexical_decisions:
- source_word: θρησκεία
  choice: почитание
  rationale: В данном контексте слово обозначает культовое служение, обращённое к идолам. «Почитание» естественно по-русски и не расширяет смысл до религии вообще.
- source_word: ἀνωνύμων
  choice: безымянных
  rationale: Буквально — «не имеющих имени», «неназванных». «Безымянных» кратко передаёт риторическую силу слова, не уточняя, почему именно идолы так названы.
- source_word: εἰδώλων
  choice: идолов
  rationale: В контексте книги речь идёт о ложных божествах, представленных изображениями; «идолы» точно передаёт религиозно-полемический смысл.
- source_word: παντὸς ... κακοῦ
  choice: всякого зла
  rationale: Родительный оборот имеет всеохватный смысл; эта формулировка естественна и сохраняет категоричность утверждения.
- source_word: ἀρχὴ
  choice: начало
  rationale: Прямое соответствие сохраняет трёхчастную риторическую последовательность.
- source_word: αἰτία
  choice: причина
  rationale: Слово выражает причинность; выбранный вариант точен и сохраняет лаконизм греческой фразы.
- source_word: πέρας
  choice: конец
  rationale: Слово может означать конец, предел, цель или завершение. «Конец» сохраняет намеренную ёмкость и напряжение исходного текста.
theological_decisions:
- issue: Передача триады ἀρχὴ κακοῦ καὶ αἰτία καὶ πέρας
  choice: начало, причина и конец всякого зла
  alternative: исток, причина и завершение всякого зла
  rationale: Буквальная и выразительная триада сохраняет сжатость и всеохватное обличение идолопочитания, не истолковывая πέρας однозначно как результат, цель или кульминацию.
- issue: Смысл ἀνωνύμων применительно к идолам
  choice: безымянных идолов
  alternative: идолов, не имеющих имени
  rationale: Исходный текст не поясняет, означает ли это отсутствие истинного имени, устойчивой сущности или достоинства быть названными; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и полемически заострённая. Именная конструкция с тире естественно передаёт греческое ἐστίν и сохраняет акцент на трёхчастном перечислении.
