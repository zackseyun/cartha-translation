lexical_decisions:
- source_word: πάντα
  choice: всё
  rationale: Форма среднего рода множественного числа имеет всеохватный смысл; русское «всё» естественно передаёт полноту обвинения.
- source_word: ἐπιμὶξ ἔχει
  choice: смешалось
  rationale: Греческое выражение описывает беспорядочное смешение; возвратная форма по-русски естественно вводит перечень пороков.
- source_word: αἷμα
  choice: кровь
  rationale: Сохранено буквальное значение; в данном перечне слово, вероятно, подразумевает кровопролитие, что отмечено в сноске.
- source_word: φόνος
  choice: убийство
  rationale: В нравственном перечне обозначает неправомерное лишение жизни; «убийство» ясно и точно.
- source_word: κλοπή
  choice: воровство
  rationale: Передаёт действие и порок понятным современным словом; «кража» звучала бы более узко и юридически.
- source_word: δόλος
  choice: обман
  rationale: Естественно передаёт широкий смысл хитрости, лукавства и мошенничества без ненужного уточнения.
- source_word: φθορά
  choice: растление
  rationale: В нравственном контексте слово обозначает порчу и развращение; «растление» сохраняет образ разрушительного нравственного разложения.
- source_word: ἀπιστία
  choice: неверность
  rationale: Слово здесь, в перечне общественных и нравственных зол, вероятнее означает ненадёжность и нарушение верности; при этом «неверность» не сводит его к одной узкой разновидности проступка.
- source_word: τάραχος
  choice: смута
  rationale: Передаёт возмущение, беспорядок и общественное волнение в краткой форме, соответствующей ритму перечня.
- source_word: ἐπιορκία
  choice: нарушение клятв
  rationale: Ясно выражает ложную клятву или преступление присяги, не ограничивая смысл современным судебным употреблением слова «лжесвидетельство».
- source_word: θόρυβος ἀγαθῶν
  choice: смятение относительно добра
  rationale: Трудное сочетание допускает несколько связей между «смятением» и «благами/добром». Выбранный вариант передаёт нравственную дезориентацию, но неоднозначность отмечена в сноске.
theological_decisions:
- issue: Значение ἀπιστία в перечне пороков
  choice: неверность
  alternative: неверие
  rationale: Ближайший контекст описывает распад нравственных и общественных отношений, поэтому значение нарушения верности вероятнее узко вероучительного «неверия». Выбор всё же сохраняет более широкий оттенок отсутствия веры и надёжности.
- issue: Толкование θόρυβος ἀγαθῶν
  choice: смятение относительно добра
  alternative: нарушение благого порядка / смута из-за благ
  rationale: Греческое сочетание грамматически и семантически трудно. Основной текст осторожно отражает возможную нравственную дезориентацию, а сноска сохраняет предметные и причинные варианты связи.
