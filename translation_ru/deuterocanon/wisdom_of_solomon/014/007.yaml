lexical_decisions:
- source_word: εὐλόγηται
  choice: благословенно
  rationale: 'Перфект страдательного залога передаёт сохраняющееся состояние: дерево пребывает благословенным.'
- source_word: γὰρ
  choice: ибо
  rationale: Сохраняет пояснительную связь с предшествующим высказыванием и соответствует достоинству литературного регистра.
- source_word: ξύλον
  choice: дерево
  rationale: В контексте речь идёт о древесном материале как средстве спасения; «дерево» естественно по-русски и не уточняет сверх греческого текста конкретный предмет.
- source_word: δι’ οὗ
  choice: через которое
  rationale: Местоимение среднего рода относится к ξύλον; оборот сохраняет значение посредства или орудия.
- source_word: γίνεται
  choice: совершается
  rationale: Передаёт возникновение или осуществление названной праведности, не сводя выражение лишь к её пространственному «приходу».
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Сохраняет широкий нравственно-богословский смысл слова, тогда как возможное значение «справедливость» отмечено в сноске.
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет более широкий нравственный и богословский диапазон греческого слова; «справедливость» остаётся реальной контекстуальной возможностью и поэтому приводится в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Причинный союз γὰρ сохранён; неоднозначность δικαιοσύνη не устранена, а отражена в сноске.
