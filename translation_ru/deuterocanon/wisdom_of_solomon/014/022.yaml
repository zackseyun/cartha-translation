base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/022.yaml
  text: Then it was not enough for them to go astray concerning the knowledge of God[a], but also, living in a great war of ignorance[b], they call such great evils peace.
translation:
  language: ru
  text: Итак, им было недостаточно заблуждаться в познании Бога[a], но они, живя среди великой войны неведения[b], называют миром столь великие бедствия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быть введёнными в заблуждение относительно познания Бога». Греческая форма допускает более пассивный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «великая война неведения» сохраняет греческую метафору: неведение представлено как состояние войны или глубокого противоборства.'
    reason: cultural_note
lexical_decisions:
- source_word: Εἶτʼ
  choice: Но
  rationale: В данном контексте вводит дальнейшую ступень обличения; по-русски противопоставительное «но» естественно связывает фразу с последующим οὐκ… ἀλλὰ καὶ.
- source_word: οὐκ ἤρκεσεν
  choice: им было мало
  rationale: Передаёт безличную конструкцию естественным современным русским оборотом, не превращая её в утверждение об их удовлетворённости.
- source_word: τὸ πλανᾶσθαι
  choice: заблуждаться
  rationale: Сохраняет нравственно-интеллектуальное отклонение и не закрепляет однозначно внешнего виновника заблуждения.
- source_word: περὶ τὴν τοῦ θεοῦ γνῶσιν
  choice: в познании Бога
  rationale: Естественно передаёт сферу заблуждения и сохраняет богословскую весомость γνῶσις; «познание» здесь указывает на верное знание и признание Бога.
- source_word: μεγάλῳ ... ἀγνοίας πολέμῳ
  choice: среди великой войны неведения
  rationale: Сохраняет сильную метафору войны, не сглаживая её до смятения или беспорядка; родительный падеж оставляет открытой связь войны с неведением.
- source_word: ζῶντες
  choice: живя
  rationale: Причастный оборот сохраняет обстоятельственную связь с главным глаголом.
- source_word: τὰ τοσαῦτα κακὰ
  choice: столь великие бедствия
  rationale: Передаёт указательно-усилительное τοσαῦτα и широкий смысл κακά как тяжёлых зол и бедствий в контексте общественного разложения.
- source_word: εἰρήνην
  choice: миром
  rationale: Сохраняет прямое значение и резкую иронию исходного противопоставления.
- source_word: προσαγορεύουσιν
  choice: называют
  rationale: Краткий и естественный русский эквивалент акта ложного именования.
theological_decisions:
- issue: Следует ли передавать πλανᾶσθαι явно пассивно
  choice: заблуждаться
  alternative: быть введёнными в заблуждение
  rationale: Греческая форма допускает средний или пассивный оттенок, но стих не устанавливает прямо внешнего деятеля; нейтрально-возвратное русское выражение сохраняет эту неопределённость.
- issue: Следует ли расширять εἰρήνην как «мир и безопасность»
  choice: миром
  alternative: порядком или безопасностью
  rationale: В греческом стоит только εἰρήνην; простое «миром» сохраняет иронию и не добавляет политико-богословских смыслов.
- issue: Как понимать κακά в τὰ τοσαῦτα κακὰ
  choice: бедствия
  alternative: злодеяния / зло
  rationale: κακά может обозначать как нравственное зло, так и его пагубные проявления и последствия. «Бедствия» естественно в сочетании с «называют миром», а примечание сохраняет более широкий диапазон.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сильная греческая метафора войны сохранена. Конструкция «им было мало… они ещё и…» естественно передаёт οὐκ ἤρκεσεν… ἀλλὰ καὶ и нарастание обвинения.
