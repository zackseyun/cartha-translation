review_pass:
  verdict: revise
  source_fidelity: Греческое τεκνοφόνους τελετάς точнее передавать как обряды, включающие убийство детей, а не отвлечённым «обряды детоубийства». Кώμους обозначает разгульные праздничные шествия/гулянья, шире и точнее, чем «пиршества». Ἐξάλλων θεσμῶν означает «необычных/чуждых установлений, обычаев»; в русском естественнее отнести этот признак к празднествам через «с чуждыми обычаями».
  naturalness: «Исступлённые пиршества по чуждым обычаям» грамматически понятно, но звучит несколько тяжеловесно и сужает κῶμος до застолья. «Неистовые разгульные празднества с чуждыми обычаями» современно, сохраняет высокий регистр и не добавляет сексуального смысла.
  terminology: «Мистерии» удачно передаёт μυστήρια в языческо-культовом контексте и не смешивает их с христианскими таинствами. «Обряды с убийством детей» ясно передаёт τεκνοφόνους τελετάς без эвфемизации.
  issues:
  - severity: medium
    issue: «Пиршества» сужает значение κώμους.
    rationale: Κῶμος — не просто пир, а шумное разгульное празднество/гулянье, нередко связанное с процессией и культовым празднованием.
  - severity: low
    issue: «Обряды детоубийства» менее прямо выражает связь обряда с убийством детей.
    rationale: Греческое прилагательное τεκνοφόνους буквально характеризует обряды как детоубийственные; оборот «обряды с убийством детей» яснее в современном русском.
  - severity: low
    issue: Связка «пиршества по чуждым обычаям» стилистически не вполне естественна.
    rationale: Более плавная конструкция «празднества с чуждыми обычаями» сохраняет смысл ἐξάλλων θεσμῶν, не уточняя спорно, являются ли эти установления именно чужеземными.
