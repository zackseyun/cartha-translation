  text: For they were conducting either child-killing rites, or secret mysteries, or frenzied revelries with strange customs,
translation:
  language: ru
  text: Ведь они совершали то обряды с убийством детей, то тайные мистерии, то неистовые разгульные празднества с чуждыми обычаями,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεκνοφόνους τελετάς
  choice: обряды детоубийства
  rationale: Передаёт буквальный смысл «обряды, связанные с убийством детей» ясно и без смягчения.
- source_word: κρύφια μυστήρια
  choice: тайные мистерии
  rationale: «Мистерии» сохраняет значение закрытых культовых обрядов и не смешивает их с христианским употреблением слова «таинства».
- source_word: ἐμμανεῖς ... κώμους
  choice: исступлённые пиршества
  rationale: Сочетает значение безумной, неистовой разнузданности с празднично-пиршественным характером κῶμος, не добавляя обязательного сексуального оттенка слова «оргии».
- source_word: ἐξάλλων θεσμῶν
  choice: по чуждым обычаям
  rationale: Передаёт необычность и отчуждённость установлений естественным русским оборотом; связь с пиршествами сохранена без чрезмерно буквального и неясного «чуждых установлений».
- source_word: ἢ ... ἢ ... ἢ
  choice: то ... то ... то
  rationale: Естественно воспроизводит перечисление альтернативных порочных практик в русском языке.
