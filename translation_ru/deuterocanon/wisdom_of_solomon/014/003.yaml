  text: But your providence[a], Father, steers it, because you gave a way even in the sea, and a safe path in the waves,
translation:
  language: ru
  text: Но Твоё провидение, Отец, правит им[a], потому что Ты даровал путь даже в море и безопасную стезю в волнах.
