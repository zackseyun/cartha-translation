lexical_decisions:
- source_word: διακυβερνᾷ
  choice: управляет им
  rationale: 'Глагол имеет морской оттенок: речь об управлении судном. Местоимение передаёт подразумеваемый объект из контекста, не заменяя его пояснением.'
- source_word: πρόνοια
  choice: провидение
  rationale: Слово соединяет предусмотрительность с деятельной Божьей заботой и руководством; «провидение» сохраняет его богословскую весомость.
- source_word: πάτερ
  choice: Отец
  rationale: Сохранено прямое обращение к Богу без архаического усиления.
- source_word: ἔδωκας
  choice: даровал
  rationale: Передаёт буквальное «дал» в естественном для молитвенного обращения возвышенном, но понятном русском регистре.
- source_word: ὁδὸν
  choice: путь
  rationale: Естественно передаёт дорогу, данную Богом в море, и сохраняет библейский образ.
- source_word: τρίβον
  choice: тропу
  rationale: Отличает второе существительное от ὁδός и сохраняет поэтический параллелизм.
- source_word: ἀσφαλῆ
  choice: безопасную
  rationale: Прямо передаёт защищённость от опасности, не добавляя идеи физической твёрдости.
- source_word: ἐν θαλάσσῃ / ἐν κύμασι
  choice: в море / в волнах
  rationale: Сохранён повтор греческого ἐν и поэтический параллелизм двух предложных оборотов.
theological_decisions:
- issue: Передача πρόνοια применительно к Богу
  choice: провидение
  alternative: предусмотрительность; забота
  rationale: «Провидение» выражает не только предвидение, но и деятельное Божье руководство, не уточняя его в рамках какой-либо конфессиональной системы.
- issue: Образ Божьего руководства судном
  choice: управляет им
  alternative: ведёт его; правит им
  rationale: Выбор сохраняет морской смысл глагола и одновременно допускаемый им более широкий смысл руководства, не устраняя образную многозначность.
