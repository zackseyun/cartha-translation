base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/029.yaml
  text: For because they trusted in lifeless idols[b][a], after swearing wickedly they do not expect to be harmed.
translation:
  language: ru
  text: Ибо, полагаясь на безжизненных идолов[a], они, нечестиво поклявшись, не ожидают, что потерпят вред[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пустых идолов»; возможно также: «ничтожных идолов». Определение подчёркивает их пустоту, нереальность или отсутствие у них жизненной силы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «что с ними поступят несправедливо»; по смыслу возможно также: «что они понесут наказание». Греческое выражение широко обозначает причинение вреда, а в контексте может подразумевать возмездие за нечестивую клятву.'
    reason: alternative_reading
lexical_decisions:
- source_word: αἴγνιοι
  choice: безжизненных
  rationale: Согласно предоставленному критически проверенному чтению и контексту, определение характеризует идолов как лишённых жизни и реальной силы. Русское «безжизненных» ясно и естественно передаёт эту мысль; более абстрактные варианты вынесены в примечание.
- source_word: πεποιθότες
  choice: полагаясь
  rationale: Перфектное причастие обозначает устойчивую уверенность и опору на идолов. Деепричастие «полагаясь» естественно выражает продолжающееся доверие и сохраняет причинную связь с последующей мыслью.
- source_word: εἰδώλοις
  choice: идолов
  rationale: В данном контексте речь идёт о культовых изображениях, почитаемых как божества; «идолы» точно передаёт религиозно-полемический смысл.
- source_word: κακῶς
  choice: нечестиво
  rationale: Наречие даёт нравственную оценку клятве, не сводя смысл исключительно к ложной клятве. «Нечестиво» уместно в контексте клятвы перед идолами и сохраняет широту греческого выражения.
- source_word: ὀμόσαντες
  choice: поклявшись
  rationale: 'Аористное причастие передано деепричастием предшествующего действия: сначала они клянутся, затем не ожидают дурных последствий.'
- source_word: ἀδικηθῆναι
  choice: что им будет причинён вред
  rationale: 'Пассивный инфинитив допускает широкий смысл: потерпеть вред, оказаться обиженным или понести кару. Основной текст сохраняет эту широту, а возможные уточнения приведены в примечании.'
- source_word: οὐ προσδέχονται
  choice: не ожидают
  rationale: Глагол выражает отсутствие ожидания или предчувствия последствий; «не ожидают» — ясный и современный русский эквивалент.
theological_decisions:
- issue: Смысл последствия нечестивой клятвы
  choice: Полагающиеся на бессильных идолов не ожидают, что после нечестивой клятвы им будет причинён какой-либо вред.
  alternative: Они не ожидают наказания за ложную клятву либо не боятся, что сами идолы поступят с ними несправедливо.
  rationale: Греческое ἀδικηθῆναι не уточняет ни действующего лица, ни точного вида последствия. Широкое выражение «будет причинён вред» сохраняет намеренную неопределённость и не сужает текст до одной трактовки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Причастные конструкции исходного текста переданы естественными русскими деепричастными оборотами; богословская неоднозначность заключительной фразы сохранена.
