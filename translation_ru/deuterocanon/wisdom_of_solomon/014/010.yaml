  text: For the thing done[a], together with the one who did it, will be punished.
translation:
  language: ru
  text: Ведь и сделанное[a] будет наказано вместе с тем, кто его сделал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что было сделано». В данном контексте выражение относится к изготовленному идолу и его создателю.'
