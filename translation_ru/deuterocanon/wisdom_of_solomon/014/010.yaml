lexical_decisions:
- source_word: καὶ γάρ
  choice: Ведь и
  rationale: Передаёт пояснительную связь с предыдущей мыслью и сохраняет усилительно-присоединительное значение καί.
- source_word: τὸ πραχθέν
  choice: сделанное
  rationale: Субстантивированное страдательное причастие допускает значение как результата действия, так и изготовленного предмета. В контексте речь идёт об идоле, однако общий характер греческого выражения сохранён.
- source_word: σὺν τῷ δράσαντι
  choice: вместе с тем, кто его сделал
  rationale: Передаёт совместность наказания и естественно связывает деятеля со «сделанным», не вводя прямо отсутствующее в стихе слово «идол».
- source_word: κολασθήσεται
  choice: будет наказано
  rationale: Будущее страдательное наклонение выражает грядущее карательное воздаяние; это ясная и нейтральная формулировка на современном русском языке.
theological_decisions:
- issue: Следует ли прямо назвать сделанное идолом
  choice: Сохранить более общее «сделанное»
  alternative: «идол» или «изваяние»
  rationale: Контекст указывает на изготовленного идола, но в самой фразе соответствующего существительного нет. Общее выражение сохраняет лексическую широту и не добавляет отсутствующее в греческом уточнение.
- issue: Понимать τὸ πραχθέν как поступок или как изготовленный предмет
  choice: Использовать допускающее обе стороны слово «сделанное», пояснив контекст в сноске
  alternative: «совершённое» или «изготовленная вещь»
  rationale: Греческая форма неоднозначна сама по себе, хотя контекст склоняет к изготовленному предмету. Перевод не должен устранять эту неоднозначность без необходимости.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная формулировка. Местоимение «его» естественно указывает на субстантивированное «сделанное».
