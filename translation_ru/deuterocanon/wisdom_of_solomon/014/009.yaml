  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/009.yaml
  text: For the ungodly man and his ungodliness are equally hateful to God;[a]
translation:
  language: ru
  text: Ибо в равной мере ненавистны Богу и нечестивец, и его нечестие.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо одинаково ненавистны Богу и поступающий нечестиво, и его нечестие».'
    reason: Лексическая альтернатива, более явно передающая причастный характер ὁ ἀσεβῶν.
lexical_decisions:
- source_word: ἐν ἴσῳ
  choice: в равной мере
  rationale: Передаёт значение «одинаково, в одинаковой степени» и ясно распространяется на оба однородных подлежащих.
- source_word: μισητά
  choice: ненавистны
  rationale: 'Сохраняет форму именного сказуемого и прямой смысл: оба названы предметами Божьей ненависти; более сильное «мерзки» внесло бы иной смысловой оттенок.'
- source_word: θεῷ
  choice: Богу
  rationale: Дательный падеж естественно передаётся русским дательным при кратком прилагательном «ненавистны».
- source_word: ὁ ἀσεβῶν
  choice: нечестивец
  rationale: Субстантивированное причастие обозначает мужчину, характеризуемого нечестием; «нечестивец» кратко, естественно и сохраняет связь с «нечестие».
- source_word: ἡ ἀσέβεια αὐτοῦ
  choice: его нечестие
  rationale: Точно сохраняет существительное, притяжательную связь и однокоренную пару с обозначением нечестивого человека.
theological_decisions:
- issue: Божья ненависть направлена и на нечестивца, и на его нечестие
  choice: Прямо назвать равно ненавистными Богу как нечестивца, так и его нечестие.
  alternative: Смягчить высказывание, отнеся Божью ненависть только к нечестию или переведя «осуждены Богом».
  rationale: Греческий текст ставит и ὁ ἀσεβῶν, и ἡ ἀσέβεια αὐτοῦ под общим сказуемым μισητά θεῷ. Перевод сохраняет эту богословскую напряжённость, не превращая отдельное высказывание стиха в более широкую систематическую формулу.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной синтаксической формой. Однокоренные «нечестивец / нечестие» воспроизводят греческую связь ἀσεβῶν / ἀσέβεια; союзная конструкция «и…, и…» ясно объединяет оба предмета одной оценкой.
