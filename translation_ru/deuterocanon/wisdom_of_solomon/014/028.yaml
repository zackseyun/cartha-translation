revisions:
- from: Ибо они либо, предаваясь веселью, безумствуют, либо пророчествуют ложь, либо живут несправедливо, либо без колебаний клянутся ложно[a].
  to: Ибо они либо безумствуют, веселясь, либо пророчествуют ложное, либо живут несправедливо, либо с готовностью дают ложные клятвы[a].
  rationale: Правка устраняет небольшую синтаксическую тяжеловесность, точнее передаёт объект при «пророчествуют» и исправляет формулировку примечания. Четырёхчленная структура, этическое значение ἀδίκως и смысл ταχέως как готовности/поспешности при ложной клятве сохранены.
