  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/028.yaml
  text: For either[a], while reveling, they go mad; or they prophesy lies; or they live unjustly; or they quickly swear false oaths[b];
translation:
  language: ru
  text: Ибо они либо безумствуют, веселясь, либо пророчествуют ложное, либо живут несправедливо, либо с готовностью дают ложные клятвы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с лёгкостью совершают клятвопреступление». Греческий глагол означает «ложно клясться» или «совершать клятвопреступление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφραινόμενοι
  choice: предаваясь веселью
  rationale: Передаёт состояние праздничного веселья и допускаемый контекст разгула, не добавляя прямо не выраженного указания на пьянство.
- source_word: μεμήνασιν
  choice: безумствуют
  rationale: Глагол μαίνομαι обозначает безумие или исступлённое поведение; настоящее время в русском естественно передаёт результирующее состояние греческого перфекта в ряду повторяющихся характеристик.
- source_word: προφητεύουσιν ψευδῆ
  choice: пророчествуют ложь
  rationale: Сохраняет резкую глагольно-объектную конструкцию оригинала и не смягчает обвинение до значения «ошибочно пророчествуют».
- source_word: ζῶσιν ἀδίκως
  choice: живут несправедливо
  rationale: Сохраняет связь ἀδίκως с несправедливостью и неправедностью, не сужая смысл до отдельного порока.
- source_word: ἐπιορκοῦσιν
  choice: клянутся ложно
  rationale: Прямо передаёт ложную клятву; значение клятвопреступления указано как допустимая альтернатива в примечании.
- source_word: ταχέως
  choice: без колебаний
  rationale: В данном сочетании наречие выражает не только быстроту, но и готовность с лёгкостью дать ложную клятву; буквальное «быстро» по-русски могло бы звучать как указание лишь на темп речи.
theological_decisions:
- issue: Смысл ἀδίκως в этическом контексте Премудрости
  choice: несправедливо
  alternative: неправедно
  rationale: «Несправедливо» сохраняет общественно-этическую сторону слова, тогда как «неправедно» может восприниматься как более узкий конфессионально-богословский термин; при этом моральное осуждение остаётся ясным.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для текста Премудрости. Четырёхчастная конструкция «либо… либо…» сохранена; формулировки ясны обычному читателю и не привносят конфессиональных уточнений.
