  source_fidelity: 'Переданы основные элементы греческого текста: невозможность лично воздавать почести из-за расстояния, воспроизведение облика, создание зримого изображения царя и цель — угодливо льстить отсутствующему. «Воздавать почести», «почитаемый царь», «зримое изображение» и «усердие» хорошо соответствуют τιμᾶν, τιμώμενος βασιλεύς, ἐμφανὴς εἰκών и σπουδή. Необходимо лишь более естественно выразить русскую антитезу ἀπόντα ὡς παρόντα.'
