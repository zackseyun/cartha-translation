base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/017.yaml
  text: Since men were not able to honor them in person because they lived far away[a], they reproduced the distant appearance and made a visible image of the honored king[b], so that by their zeal they might flatter the absent one as though present.
translation:
  language: ru
  text: Люди, не имевшие возможности лично воздавать им почести, потому что те жили далеко, воспроизводили их облик, виденный издали[a], и создавали зримое изображение почитаемого царя, чтобы своим усердием льстить отсутствующему, словно он был рядом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспроизводили видимый издалека облик».'
    reason: Греческое выражение допускает небольшое различие в том, относится ли «издали» к восприятию облика или характеризует сам удалённый облик.
  - marker: b
    text: 'Или: «чтобы своим усердием снискать благосклонность отсутствующего, словно он присутствовал».'
    reason: Глагол κολακεύω может означать как прямую лесть, так и угодливое стремление добиться расположения.
lexical_decisions:
- source_word: ἐν ὄψει
  choice: лично
  rationale: Выражение буквально связано со зрительным присутствием; в противопоставлении расстоянию и отсутствию естественное русское «лично» точно передаёт смысл.
- source_word: τιμᾶν
  choice: воздавать почести
  rationale: Сохраняет широкий общественно-политический смысл почитания и не вводит прежде времени явно культовое «поклоняться».
- source_word: διὰ τὸ μακρὰν οἰκεῖν
  choice: потому что те жили далеко
  rationale: Передаёт причину невозможности личного почитания; указательное «те» устраняет возможное в русском ошибочное отнесение действия к людям, создающим изображение.
- source_word: τὴν πόρρωθεν ὄψιν
  choice: их облик, виденный издали
  rationale: ὄψις обозначает вид или облик, а πόρρωθεν — восприятие издалека; формулировка сохраняет зрительный оттенок и связь с удалённостью правителя.
- source_word: ἀνατυπωσάμενοι
  choice: воспроизводили
  rationale: Причастие означает создание изображения по образцу; «воспроизводили» естественно для контекста изготовления образа.
- source_word: ἐμφανῆ εἰκόνα
  choice: зримое изображение
  rationale: Подчёркивает наглядное, доступное взору присутствие изображения в противоположность отсутствующему царю.
- source_word: τοῦ τιμωμένου βασιλέως
  choice: почитаемого царя
  rationale: 'Передаёт пассивный смысл причастия: царь является объектом почитания.'
- source_word: τὸν ἀπόντα ὡς παρόντα
  choice: отсутствующему, как присутствующему
  rationale: Сохраняет краткое и значимое противопоставление отсутствия и присутствия.
- source_word: κολακεύωσιν
  choice: льстить
  rationale: Глагол несёт критический оттенок лести и угодничества, а не нейтрального выражения почтения.
- source_word: διὰ τῆς σπουδῆς
  choice: своим усердием
  rationale: σπουδή здесь обозначает рвение и старательность, проявленные при создании изображения.
theological_decisions:
- issue: Следует ли передавать τιμᾶν явно культовым словом
  choice: воздавать почести
  alternative: поклоняться; чтить
  rationale: Непосредственно речь идёт о почестях правителю, из которых затем развивается идолопоклонство. Нейтрально-политическая формулировка сохраняет ход мысли автора и не усиливает культовый смысл раньше текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены политический контекст почитания царя, критический оттенок лести и антитеза отсутствующего и присутствующего.
