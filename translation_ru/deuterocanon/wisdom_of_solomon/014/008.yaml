  source_fidelity: 'Перевод точно передаёт синтаксис и смысл греческого текста: τὸ χειρόποιητον — «сделанное руками», ἐπικατάρατον — «проклято», а также двойной объект осуждения — сам предмет и сделавший его. «Трудился над ним» обоснованно сохраняет процессуальный оттенок ἠργάζετο; противопоставление μὲν ... δὲ передано союзом «а». «Тленное было названо богом» верно отражает τὸ φθαρτὸν θεὸς ὠνομάσθη, не навязывая спорную определённость («Богом» / «одним из богов»).'
