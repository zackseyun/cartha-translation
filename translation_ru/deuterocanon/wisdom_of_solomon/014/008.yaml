base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/008.yaml
  text: But the thing made by hands is accursed[a], both it and the one who made it, because the one made it[b], but the perishable thing was called god.
translation:
  language: ru
  text: А сделанное руками[a] проклято — и оно само, и тот, кто его сделал, потому что он трудился над ним[b], а тленное было названо богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть в данном контексте — идол. Буквально: «сделанное руками».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «работал над ним»; возможно также: «изготовил его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χειρόποιητον
  choice: сделанное руками
  rationale: Передаёт буквальный смысл греческого прилагательного «рукотворное, сделанное руками», не подставляя прямо слово «идол», хотя контекст ясно указывает на идола.
- source_word: ἐπικατάρατον
  choice: проклято
  rationale: Кратко и весомо передаёт состояние под проклятием; форма согласована с субстантивированным выражением «сделанное руками».
- source_word: ὁ ποιήσας αὐτό
  choice: тот, кто его сделал
  rationale: Сохраняет личную причастную конструкцию и не добавляет отсутствующего в греческом обозначения пола или ремесла.
- source_word: ἠργάζετο
  choice: трудился над ним
  rationale: Сохраняет процессуальный оттенок работы над предметом и не сводит глагол к простому повторению «сделал».
- source_word: φθαρτὸν
  choice: тленное
  rationale: Субстантивированное прилагательное естественно и ёмко передаёт смертную, разрушимую природу предмета в противопоставлении присвоенному ему божественному имени.
- source_word: θεὸς ὠνομάσθη
  choice: было названо богом
  rationale: Передаёт предикативное θεός без искусственного уточнения определённости; русская конструкция сохраняет полемический смысл присвоения тленному предмету наименования божества.
theological_decisions:
- issue: Следует ли прямо назвать рукотворный предмет идолом
  choice: Сохранить более широкое «сделанное руками»
  alternative: «рукотворный идол» или «идол, сделанный руками»
  rationale: Идол подразумевается контекстом, но существительного «идол» в греческом стихе нет. Буквальная формулировка сохраняет риторический акцент на человеческом происхождении предмета.
- issue: Как передать θεὸς без артикля
  choice: «названо богом»
  alternative: «названо Богом» или более явно «названо одним из богов»
  rationale: Строчная буква и творительный падеж в русском не вынуждают выбирать между значениями «бог» и «некий бог» и сохраняют осуждение самого присвоения тленному предмету божественного наименования.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Конструкция с тире делает пояснение ясным, а слова «тленное» и «названо богом» сохраняют резкий контраст оригинала. Все примечания отмечены в основном тексте.
