    reason: alternative_reading
lexical_decisions:
- source_word: οὔτε γὰρ ... οὔτε
  choice: Ведь ... не ... и не
  rationale: γάρ передано пояснительным «ведь», а соотносительное отрицание οὔτε ... οὔτε — естественной русской конструкцией «не ... и не».
- source_word: ἦν
  choice: не было
  rationale: Безлично-указательная конструкция с «этого» сохраняет подразумеваемый контекстом субъект и естественно звучит по-русски.
- source_word: ἀπ' ἀρχῆς
  choice: от начала
  rationale: Точная и традиционно понятная передача значения происхождения или существования с самого начала.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Выражает неограниченную длительность в будущем и сохраняет возвышенный, но понятный библейский регистр.
- source_word: ἔσται
  choice: не будет
  rationale: Простая форма будущего времени сохраняет параллелизм с «не было».
theological_decisions:
- issue: Подразумеваемый субъект не назван в греческом тексте
  choice: Передать указательным местоимением «этого», не называя прямо ни идолов, ни идолопоклонство.
  alternative: «Идолов не было от начала...» или «Идолопоклонства не было от начала...»
  rationale: Греческий текст оставляет субъект невыраженным и связывает его с предшествующим контекстом. Указательное «этого» сохраняет такую неоднозначность и не вносит лишней конкретизации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «Вовеки» употреблено как ясный и достоинственный эквивалент εἰς τὸν αἰῶνα; синтаксис сохраняет краткость и параллелизм оригинала.
