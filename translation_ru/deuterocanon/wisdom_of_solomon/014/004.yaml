lexical_decisions:
- source_word: δεικνὺς
  choice: показывая
  rationale: Причастие настоящего времени продолжает мысль предыдущего стиха и выражает явное свидетельство Божьей способности спасать.
- source_word: δύνασαι
  choice: Ты можешь
  rationale: Прямо передаёт обращённое к Богу утверждение о Его способности; прописная буква отражает русский издательский обычай, не добавляя отдельного титула.
- source_word: ἐκ παντὸς
  choice: от всего
  rationale: Сохраняет широту греческого выражения и не сводит его без необходимости только к морским опасностям; контекстуальный вариант отмечен в сноске.
- source_word: σώζειν
  choice: спасать
  rationale: Передаёт основной смысл глагола и сохраняет как непосредственное значение избавления, так и более широкое богословское звучание.
- source_word: ἵνα κἂν
  choice: так что даже
  rationale: Естественно передаёт оттенок результата или цели и усилительную силу κἂν, не навязывая более узкой синтаксической трактовки.
- source_word: ἄνευ τέχνης
  choice: не владеющий ремеслом
  rationale: τέχνη обозначает практическое умение или ремесло; формулировка сохраняет общность греческого выражения, а морской смысл поясняется в сноске.
- source_word: τις
  choice: не владеющий
  rationale: Неопределённое местоимение естественно выражено субстантивированным причастным оборотом с обобщённым значением лица.
- source_word: ἐπιβῇ
  choice: может выйти в море
  rationale: В данном морском контексте глагол означает взойти на судно или отправиться в плавание; русская формулировка звучит естественно и ясно.
theological_decisions:
- issue: Объём Божьей спасительной силы в выражении ἐκ παντὸς σώζειν
  choice: «спасать от всего»
  alternative: «спасать от всякой опасности»
  rationale: Буквально широкое выражение сохранено в основном тексте, чтобы не ограничивать утверждение морской опасностью; непосредственный контекст отражён в сноске.
- issue: Оттенок ἵνα в связи с Божьим промыслом
  choice: «так что»
  alternative: «чтобы»
  rationale: Греческая конструкция допускает оттенки цели и результата. «Так что» естественно связывает проявление Божьей силы с возможностью выйти в море, не превращая неумелость морехода в самостоятельную цель Бога.
