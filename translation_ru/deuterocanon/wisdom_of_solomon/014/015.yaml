base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/015.yaml
  text: For a father[a], worn down by untimely grief for the child quickly taken away, made an image of the one then dead, and now honored him as a god, and handed down mysteries and rites to those under his authority[b];
translation:
  language: ru
  text: Ибо отец, изнурённый безвременным горем по ребёнку, быстро отнятому у него[a], сделал изображение того, кто тогда был мёртвым человеком, и теперь почтил его как бога; а подвластным ему передал таинства и обряды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внезапно отнятому» или «отнятому слишком рано». Греческое выражение буквально указывает на быстроту утраты; «безвременное горе» подчёркивает, что смерть наступила прежде ожидаемого срока.'
    reason: lexical_alternative
  - marker: b
    text: «Таинства и обряды» — тайные или посвятительные религиозные действия, связанные с культовой практикой.
    reason: cultural_note
lexical_decisions:
- source_word: ἀώρῳ πένθει
  choice: безвременной скорбью
  rationale: Сочетание передаёт скорбь, наступившую прежде должного времени из-за преждевременной смерти ребёнка. «Безвременной» сохраняет связь с исходным образом времени и звучит достойно в литературном русском.
- source_word: τρυχόμενος
  choice: изнурённый
  rationale: Причастие обозначает человека, которого скорбь истощает и изматывает; «изнурённый» естественно передаёт длительное разрушительное воздействие.
- source_word: τοῦ ταχέως ἀφαιρεθέντος τέκνου
  choice: по ребёнку, внезапно отнятому у него
  rationale: τέκνον передано нейтральным по полу словом «ребёнок». ἀφαιρέω сохраняет пассивный образ отнятия, а ταχέως в контексте смерти естественно выражено как «внезапно»; слова «у него» проясняют отношение утраты, не называя подразумеваемого деятеля.
- source_word: εἰκόνα
  choice: изображение
  rationale: Нейтральное «изображение» не вносит заранее полемическую оценку «идол», хотя дальнейший контекст говорит об идолопоклонстве.
- source_word: τὸν τότε νεκρὸν ἄνθρωπον
  choice: того, кто тогда был мёртвым человеком
  rationale: Формулировка сохраняет значимое противопоставление τότε («тогда») и νῦν («теперь»), а также прямое указание на человеческую природу умершего.
- source_word: νῦν ὡς θεὸν ἐτίμησεν
  choice: теперь почтил как бога
  rationale: Передано именно оказание божественной чести умершему человеку, без утверждения его истинной божественности.
- source_word: παρέδωκεν
  choice: передал
  rationale: Глагол может означать передачу или установление передаваемой практики. «Передал» сохраняет эту широту и не усиливает текст до однозначного «учредил».
- source_word: τοῖς ὑποχειρίοις
  choice: подвластным ему
  rationale: Выражение обозначает находящихся под властью или контролем отца; русский вариант не ограничивает их ни домашними слугами, ни политическими подданными.
- source_word: μυστήρια καὶ τελετάς
  choice: таинства и обряды
  rationale: «Таинства» сохраняет историко-культовый смысл тайных или посвятительных действий, а «обряды» передаёт более общее ритуальное значение τελεταί.
theological_decisions:
- issue: Передача θεός в полемическом контексте происхождения идолопоклонства
  choice: как бога
  alternative: как божественного
  rationale: Текст говорит о воздании умершему человеку почестей в качестве бога. Строчная буква и сравнительно-статусная конструкция не подразумевают признания истинной божественности.
- issue: Обозначение культовых действий μυστήρια καὶ τελετάς
  choice: таинства и обряды
  alternative: тайные посвящения и церемонии
  rationale: Выбранный вариант сохраняет культовую лексику и её историческую многозначность, не связывая её с таинствами какой-либо позднейшей конфессиональной традиции.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет причинное «ибо» и контраст «тогда — теперь», но порядок слов слегка перестроен ради ясности. Пол ребёнка не уточняется, а культовая терминология оставлена достаточно широкой.
