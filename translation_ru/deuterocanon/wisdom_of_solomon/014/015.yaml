  to: Ибо отец, изнурённый безвременным горем по ребёнку, быстро отнятому у него[a], сделал изображение того, кто тогда был мёртвым человеком, и теперь почтил его как бога; а подвластным ему передал таинства и обряды[b].
  rationale: 'Исправлены два существенных момента: основному переводу возвращено прямое значение ταχέως («быстро»), а синтаксис перестроен так, чтобы недвусмысленно связать изображение с умершим человеком и сохранить контраст «тогда — теперь». «Безвременное горе» более естественно в современном литературном русском. Сноска a отражает допустимый контекстуальный вариант «внезапно», не выдавая его за основное лексическое значение.'
