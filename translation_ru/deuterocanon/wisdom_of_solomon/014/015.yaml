  - severity: medium
    issue: Неудачная синтаксическая связка после «сделал его изображение»
    rationale: Сочинение «сделал его изображение и того, кто тогда был мёртвым человеком, теперь почтил» затрудняет восприятие и недостаточно ясно выражает, что изображение сделано именно умершего человека. Перестройка не меняет смысла.
