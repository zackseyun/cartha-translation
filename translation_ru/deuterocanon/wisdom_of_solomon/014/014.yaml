  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/014.yaml
  text: For by human vanity it entered into the world, and because of this their end was devised to be brief.
translation:
  language: ru
  text: Ибо из-за людского тщеславия оно[a] вошло в мир, и потому был замыслен их недолгий конец.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Подлежащее при словах «вошло в мир» в греческом тексте не названо; из контекста речь идёт о появлении идолов или идолопоклонства.
    reason: alternative_reading
  - marker: b
    text: Греческая пассивная форма «был замыслен» не указывает прямо, кем был замыслен их недолгий конец.
    reason: alternative_reading
lexical_decisions:
- source_word: κενοδοξίᾳ ἀνθρώπων
  choice: из-за людского тщеславия
  rationale: Дательный падеж передаёт причину или средство. «Тщеславие» естественно выражает пустую самославу, заложенную в κενοδοξία, а «людское» сохраняет общий смысл ἀνθρώπων.
- source_word: εἰσῆλθεν εἰς κόσμον
  choice: оно вошло в мир
  rationale: Глагол стоит в единственном числе, но его подлежащее в греческом не названо и восстанавливается из контекста. Нейтральное «оно» сохраняет эту недосказанность.
- source_word: διὰ τοῦτο
  choice: и потому
  rationale: Кратко и ясно передаёт причинно-следственную связь.
- source_word: σύντομον ... τέλος
  choice: скорый конец
  rationale: В данном сочетании σύντομον указывает на близость или краткость наступления конца; «скорый конец» звучит естественно и не усиливает значение до «гибели» или «кары».
- source_word: αὐτῶν
  choice: их
  rationale: Сохраняет множественное число греческого местоимения и его контекстуальную отсылку к идолам или изображениям.
- source_word: ἐπενόηθη
  choice: был замыслен
  rationale: Пассивная форма сохраняет значение обдуманного установления или замысла, не называя не указанного в тексте деятеля.
theological_decisions:
- issue: Подразумеваемое подлежащее при εἰσῆλθεν
  choice: Передано местоимением «оно» с пояснением в сноске.
  alternative: 'Эксплицировать: «идолопоклонство вошло в мир» или употребить множественное «идолы вошли».'
  rationale: Греческий текст оставляет подлежащее невыраженным. Местоимение минимально истолковывает фразу, а сноска сообщает вероятную контекстуальную связь.
- issue: Деятель при ἐπενόηθη
  choice: 'Сохранён безличный по отношению к деятелю пассив: «был замыслен».'
  alternative: Назвать Бога или перевести «им был назначен».
  rationale: Греческий текст не называет того, кто замыслил конец; его уточнение внесло бы отсутствующее в стихе богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис остаётся близким к греческому, но звучит естественно; контекстуальные неоднозначности не устранены без пояснения.
