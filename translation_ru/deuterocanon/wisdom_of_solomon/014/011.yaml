base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/011.yaml
  text: Therefore there will also be a visitation upon the idols of the nations[a], because among God’s creatures they became an abomination, and a stumbling block to the souls of men[b], and a snare for the feet of fools.
translation:
  language: ru
  text: Поэтому и идолы народов подвергнутся суду[a], потому что в Божьем творении они стали мерзостью, преткновением для человеческих душ и западнёй для ног неразумных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «и на идолах народов будет посещение (взыскание)».'
    reason: Сноска сохраняет буквальный образ и смысловой диапазон ἐπισκοπή, который в данном контексте означает посещение с целью суда.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Кратко и естественно передаёт выводное значение выражения и связь с предыдущим рассуждением.
- source_word: ἐν εἰδώλοις ἐθνῶν ἐπισκοπὴ ἔσται
  choice: и идолы народов подвергнутся суду
  rationale: ἐπισκοπή обозначает посещение или надзор, здесь — с явно карательным смыслом. Русское «подвергнутся суду» естественно передаёт смысл, тогда как более буквальное «посещение» в современном русском не выражает его без пояснения. καί передано словом «и».
- source_word: ἐν κτίσματι θεοῦ
  choice: среди Божьих творений
  rationale: κτίσμα допускает собирательное или предметное понимание; в данном контексте выражение указывает на место идолов среди сотворённого Богом. Перевод сохраняет эту связь и звучит естественно.
- source_word: εἰς βδέλυγμα ἐγενήθησαν
  choice: они стали мерзостью
  rationale: «Мерзость» сохраняет сильную религиозно-нравственную окраску βδέλυγμα.
- source_word: εἰς σκάνδαλα ψυχαῖς ἀνθρώπων
  choice: преткновением для человеческих душ
  rationale: Собирательное единственное «преткновением» естественно по-русски, а «человеческих душ» точно и без гендерного сужения передаёт ψυχαῖς ἀνθρώπων.
- source_word: εἰς παγίδα ποσὶν ἀφρόνων
  choice: западнёй для ног неразумных
  rationale: Сохраняется конкретная метафора ловушки для ног. «Неразумные» передаёт характерную для литературы Премудрости нравственную, а не только интеллектуальную, оценку ἄφρων.
theological_decisions:
- issue: Значение ἐπισκοπή в контексте воздаяния
  choice: идолы народов подвергнутся суду
  alternative: на идолы народов придёт посещение / взыскание
  rationale: Греческое слово сохраняет образ посещения или надзора, но причины, перечисленные далее, придают ему карательный смысл. Основной текст передаёт этот смысл ясным современным русским выражением, а буквальная образность отмечена в сноске.
- issue: Референт ἀνθρώπων
  choice: человеческих душ
  alternative: душ людей
  rationale: Слово обозначает людей вообще; выбранный вариант исключает неоправданное гендерное сужение и сохраняет существительное ψυχαί как «души».
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим библейской премудростной литературе. Синтаксический параллелизм трёх обвинительных характеристик сохранён; архаичное и в современном русском двусмысленное «посещение» вынесено в сноску.
