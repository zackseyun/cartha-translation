translation:
  language: ru
  text: Но ожидание, будучи внутренне слабее, считает незнание причины, вызывающей мучение, более тяжким.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полагает, что не знать причины мучения — хуже». Буквально греческий оборот говорит, что ожидание считает незнание причины, вызывающей мучение, «бо́льшим».'
    reason: Лексическая альтернатива и пояснение сжатого сравнительного оборота.
lexical_decisions:
- source_word: ἔνδοθεν
  choice: изнутри
  rationale: Наречие указывает на внутренний источник или состояние слабости; перевод сохраняет пространственно-психологический образ греческого текста.
- source_word: ἥττων
  choice: слабее
  rationale: Сравнительная форма передана сравнительной степенью без добавления отсутствующего в тексте объекта сравнения.
- source_word: προσδοκία
  choice: ожидание
  rationale: Нейтральное «ожидание» сохраняет широту значения и не уточняет без необходимости, идёт ли речь о предчувствии, тревоге или надежде.
- source_word: πλείονα λογίζεται
  choice: считает … чем-то более тяжким
  rationale: Оборот означает признание чего-либо большим или более весомым; «более тяжким» естественно по-русски передаёт оценку в контексте мучения, а буквальный образ отмечен в сноске.
- source_word: ἄγνοιαν
  choice: незнание
  rationale: «Незнание» точно передаёт отсутствие знания и звучит естественнее, чем отвлечённое «неведение», при указанном далее объекте.
- source_word: τῆς παρεχούσης τὴν βάσανον αἰτίας
  choice: причины, вызывающей мучение
  rationale: Причастный оборот относится к «причине»; «вызывающей мучение» сохраняет причинную связь и силу слова βάσανος.
