base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/002.yaml
  text: For when lawless men supposed that they were oppressing a holy nation[a], they lay imprisoned by darkness and bound fast by a long night, shut in under their roofs[c][b], fugitives from eternal providence.
translation:
  language: ru
  text: Ибо беззаконники[a], полагая, что угнетают святой народ, лежали, пленённые тьмой и скованные долгой ночью[b], запертые под кровлями, — беглецы от вечного Промысла[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беззаконные». В греческом тексте — прилагательное мужского рода во множественном числе, употреблённое как существительное.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «узники тьмы и скованные долгой ночью».'
    reason: lexical_alternative
  - marker: c
    text: «Промысл» передаёт греческое πρόνοια — здесь, вероятно, вечное устрояющее попечение Бога, а не только предвидение.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπειληφότες
  choice: возомнив
  rationale: Причастие передаёт ошибочное и самонадеянное предположение; «возомнив» естественно выражает оба оттенка, не превращая мысль в простую фантазию.
- source_word: καταδυναστεύειν
  choice: иметь власть угнетать
  rationale: Глагол обозначает жестокое господство и злоупотребление властью. Сочетание сохраняет как властный, так и нравственно отрицательный оттенок.
- source_word: ἔθνος ἅγιον
  choice: святой народ
  rationale: «Народ» естественно по-русски передаёт ἔθνος в данном заветном контексте и сохраняет библейский отзвук выражения.
- source_word: ἄνομοι
  choice: беззаконники
  rationale: Субстантивированное прилагательное мужского рода множественного числа передано существительным, сохраняющим грамматический род и нравственную характеристику.
- source_word: δέσμιοι σκότους
  choice: узники тьмы
  rationale: 'Буквальный и естественный образ: тьма представлена как темница или сила, удерживающая людей в плену.'
- source_word: μακρᾶς πεδῆται νυκτός
  choice: скованные долгой ночью
  rationale: πεδῆται обозначает закованных, находящихся в путах; перевод сохраняет образ оков и синтаксическую связь с ночью.
- source_word: κατακλεισθέντες ὀρόφοις
  choice: запертые под кровлями
  rationale: Сохраняется конкретный образ кровель, не обобщённый до «домов», и выражается вынужденная замкнутость.
- source_word: φυγάδες
  choice: беглецы
  rationale: 'Слово обозначает находящихся в бегстве. Сохраняется парадокс: будучи заперты, они всё же названы беглецами от Промысла.'
- source_word: τῆς αἰωνίου προνοίας
  choice: от вечного Промысла
  rationale: В контексте книги πρόνοια указывает не просто на предвидение, а на непрестанное устрояющее попечение Бога; русское «Промысл» передаёт этот смысл кратко и традиционно.
- source_word: ἔκειντο
  choice: лежали
  rationale: Сохраняет статичность и зримость греческой формы, показывающей их беспомощное состояние.
theological_decisions:
- issue: Значение προνοία в контексте Премудрости Соломона
  choice: Промысл
  alternative: предвидение
  rationale: Здесь речь, вероятнее всего, об устрояющем и хранящем действии Бога, а не только о знании будущего. Примечание сохраняет возможность понять широкий смысл термина.
- issue: Субстантивированное мужское множественное ἄνομοι
  choice: беззаконники
  alternative: беззаконные
  rationale: Выбранное существительное естественно в современном русском языке и не нейтрализует мужскую грамматическую форму оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским ритмом. Конкретные образы тьмы, оков, кровель и бегства сохранены; синтаксис упрощён лишь настолько, чтобы длинная греческая конструкция оставалась ясной обычному читателю.
