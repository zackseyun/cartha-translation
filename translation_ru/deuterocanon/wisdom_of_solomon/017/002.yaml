- from: Ибо беззаконники[a], возомнив, что имеют власть угнетать святой народ, лежали узниками тьмы, скованными долгой ночью[b], запертые под кровлями, — беглецы от вечного Промысла[c].
  to: Ибо беззаконники[a], полагая, что угнетают святой народ, лежали, пленённые тьмой и скованные долгой ночью[b], запертые под кровлями, — беглецы от вечного Промысла[c].
