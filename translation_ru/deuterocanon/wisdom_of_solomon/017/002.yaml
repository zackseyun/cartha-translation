  naturalness: Исходное сочетание «лежали узниками тьмы, скованными долгой ночью, запертые» смешивает несогласованные именные формы и причастия, отчего фраза звучит синтаксически шероховато. Согласованная цепочка причастий сохраняет торжественный библейский ритм и естественна для современного литературного русского.
  terminology: «Беззаконники», «святой народ» и «вечный Промысл» уместны. «Промысл» точно передаёт πρόνοια в богословски насыщенном контексте Премудрости, а пояснение не навязывает конфессионального толкования.
