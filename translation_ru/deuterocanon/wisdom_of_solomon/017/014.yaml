  verdict: revise
  source_fidelity: Греческое ἀδύνατον повторено в характеристике ночи и Аида; этот повтор следует сохранить. В данном мрачном контексте «бессильная ночь» по-русски скорее означает ночь, лишённую силы, и потому искажает наиболее вероятный смысл — ночь, которой невозможно противостоять или которую невозможно вынести. «Неодолимая» передаёт контекстуальную силу слова без подмены Аида «адом».
  naturalness: Сочетания «бессильная ночь» и «бессильный Аид» семантически сбивают современного читателя. «Спали одним и тем же сном» естественнее и ближе к конструкции τὸν αὐτὸν ὕπνον κοιμώμενοι, чем «погружённые в один и тот же сон». Незавершённый характер фразы сохранён, поскольку предложение продолжается в следующем стихе.
  terminology: «Аид» — корректная передача ᾅδης и не вносит позднейших представлений, связанных со словом «ад». Повтор «неодолимая / неодолимого» воспроизводит повтор ἀδύνατος. Сноска фиксирует буквальную, но в русском основном тексте неудачную возможность «бессильный».
