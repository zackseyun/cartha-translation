  text: Они же, спавшие одним и тем же сном, когда на них надвинулась поистине неодолимая ночь из глубин неодолимого Аида[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более буквальным сохранением значения греческого слова: «поистине бессильная ночь… из глубин бессильного Аида». В обоих случаях греческий текст повторяет одно и то же слово (ἀδύνατος), буквально — «не имеющий силы». В этом контексте оно может означать также то, чему человек не в силах противостоять.'
    reason: Сохраняет лексический повтор и отмечает буквальную, но в современном русском семантически менее ясную альтернативу.
lexical_decisions:
- source_word: ἀδύνατον … ἀδυνάτου
  choice: бессильная … бессильного
  rationale: Один и тот же русский корень сохраняет намеренный повтор греческого ἀδύνατος. Основное значение — «не имеющий силы», хотя в данном контексте возможно подразумеваемое значение «неодолимый для человека»; неоднозначность отмечена в сноске.
- source_word: ὄντως
  choice: поистине
  rationale: Передаёт усилительное значение наречия и соответствует возвышенному, но понятному регистру книги.
- source_word: νύκτα
  choice: ночь
  rationale: Прямое и естественное соответствие.
- source_word: ᾅδου
  choice: Аида
  rationale: Сохраняет греческое обозначение мира мёртвых и не отождествляет его без пояснения с позднейшим богословским понятием ада как места окончательного наказания.
- source_word: μυχῶν
  choice: из глубин
  rationale: Передаёт образ сокрытых внутренних областей или недр.
- source_word: ἐπελθοῦσαν
  choice: надвинулась на них
  rationale: Передаёт наступление ночи как угрожающей силы; форма придаточного предложения естественнее русского буквального причастного оборота.
- source_word: τὸν αὐτὸν ὕπνον κοιμώμενοι
  choice: погружённые в один и тот же сон
  rationale: Естественно передаёт греческую внутреннюю конструкцию «спящие тем же сном» и подчёркивает общий для всех сон.
theological_decisions:
- issue: Передача ᾅδης в греческой второканонической книге
  choice: Аид
  alternative: царство мёртвых; ад
  rationale: «Аид» сохраняет понятийный мир исходного греческого текста. «Царство мёртвых» яснее, но представляет собой разъясняющую перифразу, а «ад» может привнести более поздние представления о месте окончательного наказания.
- issue: Смысл повторённого ἀδύνατος
  choice: бессильный — с сохранением повтора и сноской
  alternative: неодолимый; неотвратимый
  rationale: Буквальное значение не снимает необычности и богословско-поэтического напряжения текста. Контекстуальное понимание «неодолимый для людей» дано как возможность, а не внесено в основной текст.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным, мрачным звучанием. Сохранена незавершённость синтаксиса исходного стиха: предложение продолжается в следующем стихе. Сноска обозначена в основном тексте маркером [a].'
