lexical_decisions:
- source_word: μιᾷ ... ἁλύσει σκότους
  choice: одной цепью тьмы
  rationale: Творительный передаёт орудийное значение дательного падежа, а буквальный образ цепи сохраняет представление о тьме как о сковывающей силе.
- source_word: πάντες ἐδέθησαν
  choice: все были скованы
  rationale: Сохранён страдательный залог и образ пленения; «скованы» естественно сочетается с «цепью».
- source_word: εἴ τε ... ἢ ... ἢ
  choice: будь то ... или ... или
  rationale: Конструкция ясно вводит ряд возможных звуков, не устраняя синтаксическую незавершённость перечня, продолжающегося далее.
- source_word: πνεῦμα συρίζον
  choice: свист ветра
  rationale: В окружении звуков птиц и воды πνεῦμα естественнее понимать как ветер; существительное «свист» сохраняет звуковой акцент причастия συρίζον.
- source_word: περὶ ἀμφιλαφεῖς κλάδους
  choice: в густых ветвях
  rationale: ἀμφιλαφής обозначает густые, широко разросшиеся ветви; русская формулировка передаёт образ птиц, находящихся среди них.
- source_word: ὀρνέων ἦχος εὐμελής
  choice: мелодичный голос птиц
  rationale: «Мелодичный» передаёт εὐμελής, а собирательное «голос птиц» сохраняет единственное число ἦχος и не уточняет звук как пение или щебет.
- source_word: ῥυθμὸς ὕδατος πορευομένου βίᾳ
  choice: шум бурно текущей воды
  rationale: В данном звуковом перечне ῥυθμός обозначает воспринимаемое движение или звучание; «бурно текущей» передаёт πορευομένου βίᾳ без неестественной буквальности слова «ритм».
theological_decisions:
- issue: Значение πνεῦμα в перечне вызывающих страх ночных звуков
  choice: ветер
  alternative: дух
  rationale: Непосредственный контекст перечисляет природные звуки птиц и воды, поэтому «ветер» наиболее вероятен; возможное значение «дух» сохранено в сноске.
