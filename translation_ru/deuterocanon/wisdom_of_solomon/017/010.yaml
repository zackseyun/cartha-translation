  text: They were being destroyed[a], trembling and refusing even to look at the air, though there was nowhere to flee from it.
translation:
  language: ru
  text: Они гибли[a], дрожа и отказываясь даже взглянуть на воздух, от которого невозможно было убежать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они погибали в ужасе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διώλλυντο
  choice: гибли
  rationale: Имперфект передаёт продолжающееся гибельное состояние; медиально-пассивная форма не называет действующего лица. «Гибли» естественно по-русски сохраняет эту неопределённость.
- source_word: ἔντρομοι
  choice: дрожа
  rationale: Передаёт и страх, и яркий телесный образ дрожи, естественно соединяясь с глагольной конструкцией.
- source_word: μηδαμόθεν … φευκτόν
  choice: от которого невозможно было убежать
  rationale: Греческое сочетание выражает полную невозможность избежать воздуха; русский оборот передаёт смысл без искусственной буквальности.
- source_word: ἀέρα
  choice: воздух
  rationale: Прямое и обычное значение слова; сохраняет намеренно поразительный образ окружающего воздуха.
- source_word: προσιδεῖν
  choice: взглянуть на
  rationale: Естественно передаёт направленный взгляд или созерцание, не добавляя толкования «встретиться лицом к лицу».
- source_word: ἀρνούμενοι
  choice: отказываясь даже
  rationale: 'Причастие означает отказ; «даже» естественно подчёркивает крайность: они не желали и взглянуть на воздух.'
theological_decisions:
- issue: Характер описанной гибели
  choice: Продолжающаяся гибель под судом без указания непосредственного деятеля
  alternative: Явно назвать Бога причиняющим гибель либо свести выражение к психологическому надлому
  rationale: Форма διώλλυντο допускает медиально-пассивное понимание и в самой фразе не называет деятеля. Контекст суда сохраняется, но перевод не делает подразумеваемую божественную причинность явной.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным и естественным; необычный образ отказа взглянуть на воздух сохранён.
