lexical_decisions:
- source_word: φθειρόμενον
  choice: уничтожалось
  rationale: В контексте воздействия огня глагол обозначает физическое разрушение или гибель вещества, а не нравственное разложение.
- source_word: ἁπλῶς
  choice: лишь
  rationale: 'Частица подчёркивает поразительную лёгкость результата: для таяния было достаточно одного только нагревания солнечным лучом. Русское «лишь» естественно передаёт эту мысль, не перегружая фразу.'
- source_word: βραχείας
  choice: краткого
  rationale: При слове «луч» прилагательное может указывать на краткость или незначительность воздействия; «краткого» сохраняет образ и временной оттенок.
- source_word: ἀκτῖνος ἡλίου
  choice: луча солнца
  rationale: Близкая к греческой конструкции передача сохраняет конкретный поэтический образ и звучит естественно по-русски.
- source_word: θερμαινόμενον
  choice: согревшись
  rationale: Причастие описывает нагревание солнечным лучом; деепричастная форма делает русское предложение плавным и сохраняет связь с последующим таянием.
- source_word: ἐτήκετο
  choice: таяло
  rationale: Имперфект описывает происходившее таяние; несовершенный вид «таяло» точно передаёт длительный аспект.
- source_word: τὸ ... μὴ φθειρόμενον
  choice: то, что не уничтожалось
  rationale: Субстантивированное причастие передано нейтральной относительной конструкцией без добавления не названного в стихе предмета.
