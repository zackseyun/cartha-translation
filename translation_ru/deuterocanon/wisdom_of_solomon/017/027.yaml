  source_fidelity: 'В черновике верно переданы общий физический контраст, неопределённый предмет τὸ … μὴ φθειρόμενον и несовершенный вид ἐτήκετο. Однако «лишь согревшись» неточно: деепричастие совершенного вида представляет нагревание как предварительно завершённое действие, тогда как θερμαινόμενον — одновременное страдательное причастие. Кроме того, «лишь» недостаточно ясно передаёт ἁπλῶς в связи с малостью солнечного воздействия, а «краткий луч» по-русски менее естественен и хуже передаёт βραχείας в данном образе.'
