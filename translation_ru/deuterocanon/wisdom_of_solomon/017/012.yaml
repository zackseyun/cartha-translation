  text: For fear is nothing but the betrayal of the helps that come from reason[a].
translation:
  language: ru
  text: Ведь страх — не что иное, как предательство опор, которые даёт рассудок[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предательство средств помощи, происходящих от рассуждения».'
    reason: Лексическая альтернатива сохраняет более формальное соответствие словам βοηθημάτων и λογισμοῦ.
lexical_decisions:
- source_word: φόβος
  choice: страх
  rationale: Основное и достаточно широкое значение слова; варианты «ужас» и «паника» неоправданно усилили бы выражение.
- source_word: οὐθὲν ... εἰ μὴ
  choice: не что иное, как
  rationale: 'Естественная русская конструкция, передающая исключительное определение: страх есть не что иное, кроме названного далее.'
- source_word: προδοσία
  choice: предательство
  rationale: Сохраняет сильную метафору измены или вероломного оставления собственных внутренних опор; более мягкое «отказ» возможно, но ослабляет греческий образ.
- source_word: βοηθημάτων
  choice: опор
  rationale: Передаёт множественное число и смысл средств поддержки в естественной русской форме. Буквальное «средств помощи» точнее формально, но тяжелее стилистически.
- source_word: τῶν ἀπὸ λογισμοῦ
  choice: которые даёт рассудок
  rationale: Передаёт источник этих опор и философский смысл λογισμός как способности рассуждать, не сводя слово ни к вычислению, ни к отвлечённой доктрине о разуме.
theological_decisions:
- issue: Антропологический и философский оттенок λογισμός
  choice: рассудок
  alternative: рассуждение; разумное размышление
  rationale: Высказывание описывает страх как оставление доступных человеку рациональных опор. «Рассудок» кратко и ясно называет способность здраво рассуждать, не привнося специального конфессионального смысла.
translation_notes:
  register: Современный литературный русский язык с афористическим ритмом. Метафора «предательства» сохранена, а тяжеловесное буквальное «средства помощи» в основном тексте заменено естественным «опоры»; более буквальный вариант дан в сноске.
