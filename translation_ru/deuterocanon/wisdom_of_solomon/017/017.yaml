  text: For if someone was a farmer, or a shepherd, or a worker at toils in the wilderness, once seized, he remained under the inescapable necessity.
translation:
  language: ru
  text: Ведь если кто-то был земледельцем, пастухом или работником, трудившимся в безлюдной местности, то, будучи настигнут, он оставался во власти неотвратимой необходимости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непреодолимого принуждения». Греческое выражение может обозначать как неотвратимую необходимость, так и принуждение, от которого невозможно избавиться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τε γὰρ
  choice: Ведь будь то
  rationale: Передаёт пояснительный γάρ и вводит перечисление возможных занятий естественной русской конструкцией, не превращая фразу в условие, от которого зависит последующее утверждение.
- source_word: γεωργὸς
  choice: земледелец
  rationale: Точный и общеупотребительный литературный эквивалент для человека, обрабатывающего землю.
- source_word: ποιμὴν
  choice: пастух
  rationale: Прямой современный эквивалент греческого названия пасущего стадо.
- source_word: τῶν κατʼ ἐρημίαν ἐργάτης μόχθων
  choice: работник, трудившийся в пустынном месте
  rationale: Сохраняет значение тяжёлого труда и неопределённость рода занятий; ἐρημία здесь может обозначать пустынную, безлюдную местность, а не обязательно географическую пустыню.
- source_word: προλημφθεὶς
  choice: застигнутый врасплох
  rationale: Передаёт пассивное значение внезапного захвата или настигшего человека бедствия и хорошо соответствует контексту неожиданно окутавшей тьмы.
- source_word: ἔμενεν
  choice: оставался во власти
  rationale: Передаёт продолженное состояние, выраженное имперфектом, и образ подчинённости последующей ἀνάγκη.
- source_word: τὴν δυσάλυκτον ... ἀνάγκην
  choice: неизбежной участи
  rationale: δυσάλυκτος обозначает то, от чего трудно или невозможно ускользнуть; ἀνάγκη допускает оттенки необходимости, принуждения и неотвратимого положения. «Участь» естественно звучит в контексте общей судьбы застигнутых тьмой, не снимая её гнетущего характера.
