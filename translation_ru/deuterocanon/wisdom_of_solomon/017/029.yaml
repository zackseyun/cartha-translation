base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/029.yaml
  text: For the hope of the ungrateful will melt like wintry frost[b][a], and will run off like useless water.
translation:
  language: ru
  text: Ибо надежда неблагодарного растает, как зимний иней, и утечёт, как бесполезная вода.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, имеется в виду вода, которая утекает и потому не может принести пользы.
    reason: cultural_note
lexical_decisions:
- source_word: ἀχαρίστου
  choice: неблагодарного
  rationale: Субстантивированное прилагательное в родительном падеже обозначает человека, которому свойственна неблагодарность; этот прямой нравственный смысл не следует расширять до «нечестивого».
- source_word: ἐλπίς
  choice: надежда
  rationale: Основное и естественное соответствие в данном нравственно-поэтическом контексте.
- source_word: χειμέριος πάχνη
  choice: зимний иней
  rationale: Сочетание передаёт образ инея, характерного для зимней поры; «зимний иней» звучит естественно и сохраняет конкретность образа.
- source_word: τακήσεται
  choice: растает
  rationale: Будущая форма τήκω непосредственно описывает таяние инея.
- source_word: ῥυήσεται
  choice: утечёт
  rationale: Глагол передаёт движение воды прочь; «утечёт» кратко выражает как течение, так и утрату.
- source_word: ὕδωρ ἄχρηστον
  choice: бесполезная вода
  rationale: ἄχρηστος значит «непригодный, бесполезный»; буквальный образ намеренно сохранён, несмотря на его необычность.
theological_decisions:
- issue: Нравственная характеристика ἀχαρίστου
  choice: неблагодарного
  alternative: нечестивого
  rationale: Греческое слово прямо указывает на отсутствие благодарности, а не обозначает более широкую категорию нечестия.
translation_notes:
  register: Современный литературный русский язык; сохранены лаконичный ход фразы, причинное «ибо» и два параллельных образа. Необычное выражение «бесполезная вода» оставлено ради смысловой напряжённости оригинала.
