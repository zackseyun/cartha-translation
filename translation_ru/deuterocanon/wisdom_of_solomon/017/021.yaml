  text: But upon those alone heavy night was imposed[a], an image of the darkness that was about to receive them[b]; yet they were heavier to themselves than darkness.
translation:
  language: ru
  text: Только над ними простёрлась тяжёлая ночь — образ тьмы, которой предстояло принять их[a]; но самим себе они были тяжелее тьмы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Тьма, которой предстояло принять их, может указывать за пределы непосредственного бедствия на грядущий суд, однако текст не определяет его точнее.
    reason: alternative_reading
  - marker: b
    text: 'Или: «но сами себе они были тягостнее тьмы». В греческом тексте слова «тяжёлая» и «тяжелее» намеренно перекликаются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνοις δὲ ἐκείνοις
  choice: только над ними
  rationale: Передаёт подчёркнутую исключительность μόνοις и естественно сочетается с образом ночи, простёршейся над людьми.
- source_word: ἐπέτατο
  choice: простёрлась
  rationale: Глагол обозначает простирание или наложение поверх чего-либо; применительно к ночи «простёрлась» сохраняет пространственный образ и звучит естественно по-русски.
- source_word: βαρεῖα νύξ
  choice: тяжёлая ночь
  rationale: Буквальное «тяжёлая» передаёт гнетущий характер ночи и сохраняет словесную перекличку с последующим βαρύτεροι.
- source_word: εἰκὼν
  choice: образ
  rationale: Прямое и стилистически уместное соответствие, обозначающее, что нынешняя ночь представляет или предвосхищает грядущую тьму.
- source_word: τοῦ μέλλοντος αὐτοὺς διαδέχεσθαι σκότους
  choice: тьмы, которой предстояло принять их
  rationale: μέλλοντος передано как предстоящее, а διαδέχεσθαι — как «принять», что сохраняет зловещий образ будущей тьмы, не уточняя сверх текста её природу.
- source_word: ἑαυτοῖς δὲ ἦσαν βαρύτεροι σκότους
  choice: но сами для себя они были тяжелее тьмы
  rationale: Формально сохраняет дательный ἑαυτοῖς и сравнительную форму βαρύτεροι, а также намеренный повтор корня «тяжёлый» из первой части стиха.
theological_decisions:
- issue: Природа грядущей тьмы
  choice: Сохранён намёк на грядущий суд без уточнения, исторический ли это, эсхатологический или посмертный образ.
  alternative: Истолковать тьму исключительно как психологический страх либо прямо назвать её посмертным наказанием.
  rationale: Фраза говорит о тьме, которой предстояло принять их, но не определяет её точнее; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной образностью. Синтаксис близок к греческому, но естественен для русского чтения; повтор «тяжёлая — тяжелее» сохранён как важная риторическая связь.
