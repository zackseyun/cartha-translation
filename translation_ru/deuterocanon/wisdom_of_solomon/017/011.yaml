review_pass:
  verdict: revise
  source_fidelity: 'В основном переданы нравственная трусость, давление совести и постоянное ожидание беды. Однако «когда сама себя осуждает» не соответствует залогу καταδικαζομένη («будучи/когда осуждена»): возвратность и действительный залог в оригинале не выражены. Кроме того, такой перевод не передаёт μαρτυρεῖ («свидетельствует»). Синтаксическая связь δειλὸν с μαρτυρεῖ неоднозначна, поэтому её следует сохранить в основном тексте и отразить альтернативу в сноске.'
  naturalness: «Теснимая совестью» и «всегда ожидает худшего» естественны для современного литературного русского. Конструкция «свидетельствует особенно трусливо» несколько менее афористична, но ясна и позволяет не устранять глагол оригинала; разделение на два предложения делает её читаемой.
  terminology: «Порочность» уместно передаёт πονηρία как отвлечённое нравственное качество. «Совесть» точно передаёт συνείδησις. «Осуждённая» сохраняет пассивный залог χωρίς внесения утверждения, что порочность осуждает именно себя.
  issues:
  - severity: high
    issue: «когда сама себя осуждает» меняет καταδικαζομένη
    rationale: Греческое причастие стоит в страдательном залоге и не содержит возвратного местоимения. Вариант чересчур определённо превращает осуждение в действие самой порочности.
  - severity: high
    issue: В основном тексте пропущен смысл μαρτυρεῖ
    rationale: «Сама себя осуждает» не передаёт глагол «свидетельствует». Его нельзя исключать из перевода, поскольку он составляет сказуемое первой части.
  - severity: medium
    issue: Сноска не вполне согласована с основным текстом и не отражает наиболее прямую альтернативу синтаксиса
    rationale: 'Альтернативу лучше сформулировать как предикативное понимание δειλὸν: «порочность... особенно труслива», сохранив при этом «свидетельствует» в другом возможном разборе.'
