base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/011.yaml
  text: For wickedness is especially cowardly[a], being condemned by itself; and, being pressed by conscience, it always assumes the worst.
translation:
  language: ru
  text: Ибо порочность, будучи осуждённой, свидетельствует особенно трусливо. Теснимая совестью, она всегда ожидает худшего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо порочность, будучи осуждённой, особенно труслива; теснимая совестью, она всегда ожидает страшного».'
    reason: Греческая конструкция допускает понимание δειλὸν как сказуемого («особенно труслива»), а τὰ χαλεπὰ — как «страшное», «тяжёлое».
lexical_decisions:
- source_word: δειλὸν
  choice: труслива
  rationale: Передаёт нравственную трусость, приписываемую порочности, а не только чувство страха.
- source_word: ἰδίως
  choice: особенно
  rationale: Естественное современное наречие, сохраняющее усилительный смысл.
- source_word: πονηρία
  choice: порочность
  rationale: Обозначает нравственное зло как качество; «зло» было бы шире, а «порок» — уже.
- source_word: μαρτυρεῖ καταδικαζομένη
  choice: когда сама себя осуждает
  rationale: Передаёт внутреннее свидетельство против себя и самоосуждение в контексте совести, не вводя внешнего судебного разбирательства. Неоднозначность конструкции отмечена в сноске.
- source_word: προσειληφεν τὰ χαλεπὰ
  choice: всегда ожидает худшего
  rationale: Контекст виновной совести указывает на постоянное ожидание тяжёлого или страшного; русское выражение естественно передаёт этот смысл.
- source_word: συνεχομένη τῇ συνειδήσει
  choice: теснимая совестью
  rationale: Сохраняет образ внутреннего давления, выраженный глаголом συνέχω, и нравственное значение συνείδησις.
theological_decisions:
- issue: Нравственно-психологическое действие виновной совести
  choice: Порочность труслива, поскольку внутренне осуждает себя и ожидает худшего под давлением совести.
  alternative: 'Слова можно понимать менее рефлексивно: осуждённая порочность свидетельствует о своей особенной боязливости и ожидает страшного.'
  rationale: Сочетание καταδικαζομένη с συνεχομένη τῇ συνειδήσει поддерживает внутреннее, связанное с совестью прочтение, но синтаксическая связь δειλὸν и μαρτυρεῖ допускает иной оттенок, сохранённый в сноске.
translation_notes:
  register: Современный литературный русский язык; афористический и достойный тон. «Порочность» сохраняет отвлечённый нравственный смысл, а «теснимая совестью» — образность оригинала.
