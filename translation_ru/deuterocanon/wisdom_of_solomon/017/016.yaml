  verdict: revise
  source_fidelity: В черновике хорошо переданы образ «темницы без железа», пассивное значение ἐφρουρεῖτο и усиленная неопределённость субъекта. Однако «кто бы ни оказался там» придаёт ἦν («был, находился») оттенок прибытия/случайного попадания, которого в греческом нет. «Оставался под стражей» также предполагает предшествующее состояние, тогда как ἐφρουρεῖτο просто означает, что человека держали под охраной.
  naturalness: Сочетание «кто бы ни оказался там, падая, оставался под стражей» синтаксически тяжеловесно и не вполне ясно связывает падение с последующим заключением. Перестройка с деепричастным оборотом делает фразу естественнее, не истолковывая падение как нечто иное.
  terminology: «Темница без железа» — удачное, литературное и близкое к ἀσίδηρον εἱρκτήν решение. Сноска сохраняет буквальный характер необычного образа; её пояснение не следует переносить в основной текст.
  issues:
  - severity: medium
    issue: «оказался там» вместо «был/находился там»
    rationale: ἦν — форма глагола «быть»; «оказался» добавляет значение прибытия или случайного попадания.
  - severity: medium
    issue: «оставался под стражей» вместо простого пассива
    rationale: «Оставался» подразумевает продолжение уже существовавшего состояния. Имперфект ἐφρουρεῖτο передаёт пребывание под охраной, но не обязательно «оставание».
  - severity: low
    issue: Неясная связь «падая» с главным сказуемым
    rationale: В исходном порядке русский деепричастный оборот читается неловко. «Упав там» ясно и естественно передаёт обстоятельственную функцию καταπίπτων; различие вида здесь обусловлено русской синтаксической нормой, а не сменой образа.
  revised_text: И тогда всякий, кто бы ни был там, упав, оказывался под стражей, запертый в темнице без железа.[a]
