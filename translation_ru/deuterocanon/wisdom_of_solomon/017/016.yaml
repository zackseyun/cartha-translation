lexical_decisions:
- source_word: εἶθʼ οὕτως
  choice: И тогда
  rationale: Передаёт переход к следующему моменту повествования; сочетание сохраняет обе части греческого оборота, не утяжеляя русский текст.
- source_word: ὃς δὴ ποτʼ οὖν ἦν ἐκεῖ
  choice: всякий, кто бы ни оказался там
  rationale: 'Сохраняет усиленную неопределённость греческого выражения: личность человека несущественна, участь постигает любого оказавшегося там.'
- source_word: καταπίπτων
  choice: падая
  rationale: Передаёт обстоятельственное причастие настоящего времени и сохраняет конкретный образ падения, не заменяя его толкованием.
- source_word: ἐφρουρεῖτο
  choice: оставался под стражей
  rationale: Сохраняет пассивный характер действия и значение удержания под охраной; несовершенный вид соответствует имперфекту.
- source_word: εἰς τὴν ἀσίδηρον εἱρκτήν
  choice: в темнице без железа
  rationale: Буквально и естественно передаёт необычный образ заключения без железных оков или решёток, не раскрывая метафору прямо в основном тексте.
- source_word: κατακλεισθείς
  choice: запертый
  rationale: Передаёт результат предшествующего заключения и усиливает образ невозможности выйти.
theological_decisions:
- issue: Род и число неопределённого субъекта
  choice: всякий, кто
  alternative: все, кто; любой человек
  rationale: Греческий текст использует мужской род единственного числа, однако русское «всякий, кто» естественно сохраняет и грамматическую форму, и обобщённость, не превращая её в утверждение исключительно о мужчинах.
- issue: Природа темницы
  choice: сохранить метафору «темница без железа»
  alternative: истолковать как заключение во тьме или страхе
  rationale: Греческий текст оставляет образ метафорически напряжённым; явное отождествление темницы с тьмой или страхом внесло бы толкование в перевод.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским словарём. «Темница» выбрана вместо более бытового «тюрьма», поскольку поддерживает образность контекста; синтаксис остаётся ясным для обычного читателя.
