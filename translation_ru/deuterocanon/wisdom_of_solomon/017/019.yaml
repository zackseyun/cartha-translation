translation:
  language: ru
  text: или суровый грохот низвергающихся камней[a], или невидимый бег скачущих животных[b], или рёв свирепейших зверей, или эхо, отражённое от горных полостей[c], — всё это, наводя на них ужас, парализовало их.
  philosophy: optimal-equivalence
  footnotes:
