    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «невидимый бег скачущих животных».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «эхо, отражённое из полости гор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτύπος ἀπηνὴς
  choice: суровый грохот
  rationale: κτύπος обозначает сильный ударный звук, а ἀπηνής — его резкий, жестокий характер; «суровый грохот» сохраняет образ и звучит литературно.
- source_word: καταρριπτομένων πετρῶν
  choice: низвергающихся камней
  rationale: Причастие передаёт направленное вниз падение и может допускать оттенок низвержения; выбранная форма сохраняет эту неоднозначность лучше, чем простое «падающих».
- source_word: σκιρτώντων ζῴων δρόμος ἀθεώρητος
  choice: невидимый бег скачущих животных
  rationale: Формально переданы δρόμος как «бег», ἀθεώρητος как «невидимый» и σκιρτώντων как «скачущих», без сведения образа только к шуму.
- source_word: ὠρυομένων ἀπηνεστάτων θηρίων φωνή
  choice: рёв свирепейших зверей
  rationale: ὠρύομαι обозначает громкий звериный рёв, ἀπηνεστάτων имеет превосходную степень; русское выражение естественно передаёт оба элемента, а φωνή подразумевается существительным «рёв».
- source_word: ἀντανακλωμένη ἐκ κοιλότητος ὀρέων ἠχώ
  choice: эхо, отражённое горными ущельями
  rationale: ἀντανακλωμένη передаёт отражение звука, а κοιλότης ὀρέων — полое или углублённое пространство в горах; «горные ущелья» естественно выражают образ, оставляя буквальную форму в примечании.
- source_word: παρέλυεν αὐτοὺς ἐκφοβοῦντα
  choice: всё это, устрашая их, лишало их сил
  rationale: παραλύω здесь означает обессиливать, делать неспособными действовать; отдельное «устрашая» сохраняет причастную конструкцию ἐκφοβοῦντα и её причинно-обстоятельственный оттенок.
