  text: so that it might be known that one must rise before the sun to give thanks to you[b][a], and at the dawning of the light make petition to you.
translation:
  language: ru
  text: 'чтобы стало известно: нужно вставать раньше солнца, чтобы благодарить Тебя[a], и с восходом света обращаться к Тебе с мольбой[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опережать солнце в благодарении Тебе». Буквально по-гречески: «опережать солнце для благодарения Тебе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «при рассвете молиться Тебе». Греческое выражение буквально означает: «при восходе света обращаться к Тебе с прошением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γνωστὸν ἦν
  choice: чтобы стало известно
  rationale: Целевая конструкция ὅπως передаёт предполагаемый результат — осознание того, чему научили описанные события; по-русски это естественнее, чем буквальное «чтобы было известно».
- source_word: δεῖ
  choice: нужно
  rationale: Безличная форма сохраняет выраженную в греческом необходимость, не вводя конкретного субъекта и не превращая фразу в отдельно сформулированную заповедь.
- source_word: φθάνειν τὸν ἥλιον
  choice: вставать раньше солнца
  rationale: φθάνω с винительным означает опережать, приходить раньше. В контексте утреннего благодарения такая передача ясно выражает временной смысл и естественно звучит по-русски; буквальная образность отмечена в сноске.
- source_word: ἐπʼ εὐχαριστίαν σου
  choice: чтобы благодарить Тебя
  rationale: Эллиптическая предложная конструкция обозначает благодарение, направленное Богу. Глагольная передача естественна для современного русского языка.
- source_word: πρὸς ἀνατολὴν φωτός
  choice: с восходом света
  rationale: Сохраняется образ восходящего света и одновременно ясно обозначается наступление рассвета.
- source_word: ἐντυγχάνειν σοι
  choice: обращаться к Тебе с мольбой
  rationale: В данном религиозном контексте глагол обозначает обращение с просьбой или прошением. Выбор сохраняет оттенок конкретного моления, не сужая его до технического термина.
theological_decisions:
- issue: Обязательность утреннего благодарения и молитвы
  choice: 'Сохранена безличная необходимость: «нужно», в связи с тем, что должно было стать известно.'
  alternative: Передать стих как прямое всеобщее предписание обязательных часов молитвы.
  rationale: Греческое δεῖ выражает необходимость, однако сам стих не формулирует учения об обязательных канонических часах. Перевод сохраняет назидательную силу и не добавляет конфессиональной нормы.
- issue: Характер обращения к Богу в ἐντυγχάνειν σοι
  choice: «обращаться к Тебе с мольбой»
  alternative: «молиться Тебе» или «ходатайствовать перед Тобой».
  rationale: Перевод передаёт просьбу, направленную Богу, не приписывая здесь узкого значения ходатайства за других и не устраняя просительный оттенок более общим словом «молиться».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Тебя/Тебе» при обращении к Богу написано с прописной буквы согласно распространённой русской издательской традиции. Синтаксис остаётся ясным для обычного читателя, а подлинная образность и возможные буквальные варианты сохранены в сносках.
