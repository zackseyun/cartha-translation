  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes man[c][b], but your word preserves those who trust in you.
translation:
  language: ru
  text: 'чтобы Твои сыновья, которых Ты возлюбил, узнали, Господи: не урожай питает человека, но Твоё слово хранит тех, кто доверяет Тебе.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто верит Тебе». Греческий глагол может означать как веру, так и личное доверие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: чтобы… узнали
  rationale: ἵνα с сослагательным наклонением выражает цель; «чтобы… узнали» естественно передаёт эту конструкцию.
- source_word: οἱ υἱοί σου
  choice: Твои сыновья
  rationale: υἱοί — явно мужское множественное число «сыновья»; форма источника сохранена без нейтрализации.
- source_word: οὓς ἠγάπησας
  choice: которых Ты возлюбил
  rationale: Аорист передан совершенным видом; «возлюбил» сохраняет возвышенный библейский регистр и значение глагола ἀγαπάω.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма прямого обращения естественно передаётся русским звательным остатком «Господи».
- source_word: οὐχ αἱ γενέσεις τῶν καρπῶν
  choice: не плоды земли
  rationale: γενέσεις τῶν καρπῶν обозначает произрастание или урожай, то есть земные плоды, а не буквальные «рождения плодов»; выбран краткий и естественный сельскохозяйственный образ.
- source_word: τρέφουσιν ἄνθρωπον
  choice: питают человека
  rationale: τρέφω означает «питать, кормить», а единственное ἄνθρωπον имеет здесь обобщающее значение.
- source_word: ἀλλὰ τὸ ῥῆμά σου
  choice: но Твоё слово
  rationale: ῥῆμα означает произнесённое слово или реченье; «слово» естественно и сохраняет богословскую ёмкость выражения.
- source_word: τοὺς σοὶ πιστεύοντας
  choice: тех, кто доверяет Тебе
  rationale: πιστεύω с дательным лица выражает веру и личное доверие; вариант «доверяет Тебе» ясно передаёт зависимость от Бога, не исключая значения веры.
- source_word: διατηρεῖ
  choice: хранит
  rationale: διατηρέω означает сохранять, оберегать, поддерживать; «хранит» звучит естественно и сохраняет возможный оттенок охраны, не сводя смысл только к физическому пропитанию.
theological_decisions:
- issue: Обобщающее значение ἄνθρωπον
  choice: человека
  alternative: людей / человека вообще
  rationale: Единственное число источника сохранено; по-русски «человека» естественно имеет родовое, общечеловеческое значение.
- issue: Смысл πιστεύοντας при дательном σοὶ
  choice: тех, кто доверяет Тебе
  alternative: тех, кто верит Тебе / верует в Тебя
  rationale: Греческая конструкция допускает оттенки веры, доверия и опоры на Бога. Основной текст передаёт личное доверие, а примечание сохраняет смысловую широту.
- issue: Характер действия διατηρεῖ
  choice: хранит
  alternative: сохраняет / поддерживает жизнь
  rationale: «Хранит» не ограничивает действие одним физическим насыщением и сохраняет богословское напряжение между обычной пищей и Божьим словом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис сделан ясным и пригодным для публичного чтения; двоеточие передаёт содержание того, что сыновья должны узнать.
