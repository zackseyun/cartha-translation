base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/006.yaml
  text: Only a self-kindled fire[a], full of fear, appeared to them; and, being terrified by that unseen appearance[b], they considered the things they saw to be worse.
translation:
  language: ru
  text: Им являлся лишь сам собой вспыхнувший огонь[a], полный страха; устрашённые же тем невидимым видением[b], они считали то, что видели, ещё хуже.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самовозгоревшийся огонь»; буквально — огонь, возникший сам собой.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте буквально: «то невидимое видение» — намеренно парадоксальное выражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφαίνετο
  choice: являлся
  rationale: Глагол в имперфекте передаёт продолжавшееся или повторявшееся явление; «являлся» естественно описывает зловещее зрелище и не сужает значение до одного лишь свечения.
- source_word: μόνον
  choice: лишь
  rationale: 'Сохраняет подчёркнутое ограничение: им являлся только этот огонь.'
- source_word: αὐτομάτη πυρά
  choice: сам собой вспыхнувший огонь
  rationale: Передаёт значение самопроизвольности, заключённое в αὐτομάτη, и сохраняет необычный, зловещий характер явления.
- source_word: φόβου πλήρης
  choice: полный страха
  rationale: Буквально сохраняет неоднозначный греческий оборот, который может описывать как внушаемый огнём страх, так и общую атмосферу ужаса.
- source_word: ἐκδειματούμενοι
  choice: устрашённые
  rationale: Передаёт сильный испуг, выраженный причастием, в достойном литературном регистре.
- source_word: τῆς μὴ θεωρουμένης ἐκείνης ὄψεως
  choice: тем невидимым видением
  rationale: Сохраняет намеренно парадоксальное сочетание «видения», которое не было видимо, не устраняя напряжение исходного текста.
- source_word: ἡγοῦντο
  choice: считали
  rationale: Точно передаёт рассудочную оценку или суждение.
- source_word: χείρω τὰ βλεπόμενα
  choice: считали то, что видели, ещё хуже
  rationale: Сохраняет сравнительную степень χείρω и противопоставление видимого невидимому; «ещё» делает сравнительную конструкцию естественной по-русски, не уточняя основание сравнения.
theological_decisions:
- issue: Следует ли сгладить парадокс «невидимого видения»
  choice: Сохранить в основном тексте выражение «невидимое видение»
  alternative: «невидимый призрак» или «видение, которого они не могли разглядеть»
  rationale: Парадокс служит изображению психологического ужаса и искажённого восприятия; его сохранение ближе к греческому тексту и не навязывает объяснения.
- issue: Как передать αὐτομάτη в необычном, возможно сверхъестественном контексте
  choice: «сам собой вспыхнувший»
  alternative: «самовозгоревшийся» или «возникший сам собой»
  rationale: Выбранный оборот передаёт самопроизвольность огня и его зловещую необычность, не утверждая прямо его сверхъестественного происхождения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов и повтор корня в выражении «невидимым видением» намеренно сохраняют парадокс оригинала; неоднозначное «полный страха» также оставлено без истолковывающего сглаживания.
