  - severity: medium
    issue: Не вполне сохранена синтаксическая связь определений в последнем образе.
    rationale: ἀμειδήτοις и κατηφῆ относятся к προσώποις («лицам»). В черновике «мрачные» грамматически определяет «призраки», тогда как лица остаются только «неулыбчивыми».
