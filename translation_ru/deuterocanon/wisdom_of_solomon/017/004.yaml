    reason: lexical_alternative
lexical_decisions:
- source_word: μυχὸς
  choice: сокровенное место
  rationale: Слово обозначает внутреннее, укрытое пространство или дальний угол; этот вариант естественно передаёт место убежища, не уточняя без необходимости, что речь именно о комнате.
- source_word: ὁ κατέχων αὐτούς
  choice: укрывавшее их
  rationale: Причастие указывает на место, которое заключало или удерживало их внутри; в данном контексте «укрывавшее» передаёт функцию убежища, не усиливая смысл до принудительного заточения.
- source_word: ἀφόβως διεφύλασσεν
  choice: не оберегало их от страха
  rationale: Сочетание буквально связано с тщательной охраной без страха; отрицательная конструкция по-русски естественно выражает неспособность убежища избавить находившихся там людей от страха.
- source_word: ἦχοι ἐκταράσσοντες αὐτούς
  choice: тревожившие их звуки
  rationale: ἦχοι — звуки или шумы, а ἐκταράσσω обозначает сильное смятение и тревогу; перевод сохраняет психологическое воздействие без добавления источника звуков.
- source_word: ἐτρεκόμπουν
  choice: вокруг них гремели
  rationale: Редкий глагол, вероятно, передаёт повторяющийся окружающий грохот или отзвук; «гремели вокруг» сохраняет пространственный и звуковой образ.
- source_word: φάσματα
  choice: призраки
  rationale: Слово обозначает сверхъестественные или зловещие видения, явления; «призраки» понятно современному читателю, а примечание сохраняет более широкий диапазон значения.
- source_word: ἀμειδήτοις κατηφῆ προσώποις
  choice: с неулыбчивыми лицами
  rationale: ἀμείδητος буквально означает «неулыбчивый», а κατηφής — мрачный, угрюмый, понурый. Поскольку «мрачные» уже относится к призракам, формулировка избегает тяжёлого повтора, сохраняя конкретный образ лиц.
- source_word: ἐνεφανίζετο
  choice: являлись
  rationale: Глагол означает становиться видимым, показываться или являться; множественное число по-русски согласовано с собирательно воспринимаемыми φάσματα.
theological_decisions:
- issue: Природа явлений, названных φάσματα
  choice: Передать как «призраки», не определяя, были ли это объективные сверхъестественные существа или устрашающие видения.
  alternative: «видения», «привидения», «зловещие образы»
  rationale: Греческий текст описывает видимые пугающие явления, но не устанавливает их точную природу; перевод не должен разрешать эту неоднозначность догматически.
