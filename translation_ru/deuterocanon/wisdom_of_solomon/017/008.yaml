  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/008.yaml
  text: For those who promised to drive away fears and disturbances from a sick soul were themselves sick with a ridiculous fear[a].
translation:
  language: ru
  text: Ведь те, кто обещал изгнать из больной души страхи и смятение, сами были больны смехотворной боязливостью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смехотворной робостью». Греческое εὐλάβεια может также означать «осторожность» и даже «благоговение», но здесь контекст указывает на отрицательный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπισχνούμενοι
  choice: обещал
  rationale: Причастие обозначает тех, кто обещал или брался что-либо сделать; «обещал» прямо и естественно передаёт смысл.
- source_word: δείματα
  choice: страхи
  rationale: Множественное число охватывает различные переживания или причины страха, не усиливая их до «ужасов».
- source_word: ταραχὰς
  choice: смятение
  rationale: Слово обозначает внутреннее беспокойство и душевное волнение; собирательное «смятение» естественно звучит по-русски.
- source_word: ἀπελαύνειν
  choice: изгонять
  rationale: Глагол выражает энергичное удаление или изгнание и сохраняет образность греческого текста.
- source_word: ψυχῆς νοσούσης
  choice: из больной души
  rationale: Сохраняется метафора болезни и широкое значение ψυχή как души, а не только разума.
- source_word: καταγέλαστον
  choice: смехотворной
  rationale: Передаёт значение чего-то достойного насмешки и сохраняет осуждающую иронию.
- source_word: εὐλάβειαν
  choice: боязливостью
  rationale: В данном отрицательном контексте слово обозначает робкую осторожность или боязнь; «боязливость» сохраняет смысловое отличие от уже упомянутых «страхов».
- source_word: ἐνόσουν
  choice: страдали
  rationale: Русское «страдали ... боязливостью» естественно передаёт состояние болезни; метафора дополнительно поддерживается предшествующим выражением «больной души».
theological_decisions:
- issue: Значение εὐλάβεια в отрицательном контексте
  choice: боязливость
  alternative: осторожность; благоговение; страх
  rationale: Сочетание с καταγέλαστον и контекст страхов и душевного смятения требуют отрицательного, иронического смысла. «Благоговение» внесло бы неуместный положительный религиозный оттенок, тогда как «боязливость» сохраняет и неодобрение, и возможный оттенок робкой осторожности.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены ирония оригинала и параллель между больной душой и теми, кто сам страдает внутренним недугом; синтаксис слегка упрощён ради естественности.
