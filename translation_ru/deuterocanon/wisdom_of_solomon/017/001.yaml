base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/001.yaml
  text: For your judgments are great and hard to describe[c][b][a]; therefore undisciplined souls went astray.
translation:
  language: ru
  text: Ведь велики Твои суды, и их трудно описать[a]; поэтому души[c], не получившие наставления[b], заблудились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трудно изложить», «трудно объяснить» или «невозможно вполне пересказать».'
