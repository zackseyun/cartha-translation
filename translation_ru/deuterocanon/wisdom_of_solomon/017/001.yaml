  - marker: b
    text: 'Или: «необученные», «невоспитанные» или «ненаставленные».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «души»; по смыслу возможно также: «люди».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεγάλαι
  choice: велики
  rationale: Передаёт величие и значительность Божьих судов, не сужая смысл до одной лишь силы или строгости.
- source_word: κρίσεις
  choice: суды
  rationale: Сохраняет судебно-богословский смысл греческого слова, обозначающего Божьи решения и действия суда.
- source_word: δυσδιήγητοι
  choice: их трудно изложить
  rationale: Греческое сложное слово указывает на трудность полного повествования или объяснения; эта формулировка естественна по-русски и не усиливает смысл до абсолютной невыразимости.
- source_word: ἀπαίδευτοι
  choice: не наставленные
  rationale: Передаёт отсутствие обучения, воспитания и нравственного формирования, сохраняя более широкий смысл, чем просто недостаток сведений.
- source_word: ψυχαὶ
  choice: души
  rationale: Сохраняет явную антропологическую лексику греческого текста и его нравственно-духовную выразительность.
- source_word: ἐπλανήθησαν
  choice: заблудились
  rationale: Естественно передаёт результат уклонения в заблуждение, не навязывая внешнего виновника, поскольку форма может пониматься и как пассивная, и как непереходная по смыслу.
- source_word: διὰ τοῦτο
  choice: потому
  rationale: Кратко и естественно выражает причинно-следственную связь с предыдущим утверждением.
- source_word: γὰρ
  choice: ведь
  rationale: Сохраняет пояснительную связь стиха с предшествующим контекстом.
theological_decisions:
- issue: Передавать ли ψυχαὶ буквально как «души» или идиоматически как «люди»
  choice: души
  alternative: люди
  rationale: В греческом тексте прямо употреблено «души»; по-русски это понятно и сохраняет нравственно-духовный оттенок без догматического уточнения состава человека.
- issue: Указывает ли ἐπλανήθησαν на внешнего деятеля, который ввёл их в заблуждение
  choice: заблудились
  alternative: были введены в заблуждение
  rationale: Выбранная форма сохраняет смысл ухода с верного пути, не определяя причину точнее, чем позволяет греческая форма.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «велики Твои суды» сохраняет достоинство и акцент греческого текста, оставаясь понятной современному читателю.
