base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/003.yaml
  text: For while they thought to remain hidden in their secret sins[a], they were scattered under the dark veil of forgetfulness, terribly aghast and shaken by apparitions.
translation:
  language: ru
  text: Ибо, думая, что их тайные грехи останутся незамеченными, они были рассеяны под беспросветным покровом забвения, охваченные страшным ужасом и потрясённые призрачными образами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «видениями», «призраками» или «фантомами». Греческое слово может обозначать образ либо призрачное явление.'
    reason: Лексическая неоднозначность слова ἰνδάλμασιν.
lexical_decisions:
- source_word: λανθάνειν
  choice: останутся незамеченными
  rationale: Инфинитив при νομίζοντες передаёт их уверенность, что они смогут укрыться от чужого внимания. Формулировка сохраняет идею незаметности и естественно звучит по-русски.
- source_word: κρυφαίοις ἁμαρτήμασιν
  choice: со своими тайными грехами
  rationale: κρυφαίοις означает «скрытые, тайные», а ἁμαρτήμασιν — «грехи, греховные поступки». Предлог «со» естественно связывает их мнимую незаметность с тайными грехами, не ослабляя нравственного смысла.
- source_word: ἀφεγγεῖ
  choice: беспросветным
  rationale: Слово буквально обозначает отсутствие света. «Беспросветным» сохраняет образ полной тьмы и хорошо сочетается с «покровом».
- source_word: λήθης
  choice: забвения
  rationale: λήθη может означать забвение или забытьё. «Забвение» сохраняет образный родительный оборот и не придаёт ему лишнего метафизического содержания.
- source_word: παρακαλύμματι
  choice: покровом
  rationale: Существительное обозначает покрытие или завесу. «Покров» естественно передаёт образ того, что скрывает и окутывает.
- source_word: ἐσκορπίσθησαν
  choice: рассеялись
  rationale: Пассивная форма σκορπίζω означает быть рассеянными или разбросанными. Русская возвратная форма кратко сохраняет основной образ, тогда как последующие слова раскрывают внутреннее смятение.
- source_word: θαμβούμενοι δεινῶς
  choice: придя в страшный ужас
  rationale: θαμβέω выражает сильное потрясение или оцепенение, а δεινῶς усиливает его. В данном контексте преобладает оттенок ужаса.
- source_word: ἰνδάλμασιν
  choice: призрачных образов
  rationale: ἴνδαλμα может обозначать образ, видение, фантом или призрак. «Призрачные образы» сохраняет неопределённость между воспринимаемыми видениями и объективными призрачными явлениями.
- source_word: ἐκταρασσόμενοι
  choice: смятение
  rationale: Причастие указывает на глубокую тревогу и внутреннее потрясение. Конструкция «прийти в смятение от» естественно передаёт это состояние по-русски.
theological_decisions:
- issue: Природа пугающих явлений, обозначенных словом ἰνδάλμασιν
  choice: призрачные образы
  alternative: видения; призраки; фантомы
  rationale: Греческое слово не решает, были ли эти явления субъективными видениями или объективно воспринимаемыми призрачными формами. Перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской образностью. Сохранены метафоры рассеяния, беспросветного покрова забвения и пугающих образов; синтаксис слегка перестроен ради естественности русского выражения.
