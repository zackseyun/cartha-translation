  text: And no force of fire prevailed to give light[a], nor did the brilliant flames of the stars endure to illumine that dreadful night.
translation:
  language: ru
  text: И никакая сила огня не могла дать света, и яркие пламена звёзд не могли озарить ту страшную ночь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мрачную ночь»; возможно также: «ненавистную ночь». Греческое прилагательное выражает сильное отвращение или ужас.'
    reason: Лексическая многозначность στυγνήν.
lexical_decisions:
- source_word: πυρὸς … βία
  choice: сила огня
  rationale: Сохранена генитивная связь и значение действенной силы, не сводя βία к физическому насилию.
- source_word: κατίσχυεν φωτίζειν
  choice: не могла дать света
  rationale: Передаёт продолжительную неспособность огня достичь результата; по-русски звучит естественно и сохраняет причинное значение φωτίζειν.
- source_word: ἔκλαμπροι φλόγες ἄστρων
  choice: яркие пламена звёзд
  rationale: Поэтический образ звёздного света как пламени сохранён без прозаического упрощения.
- source_word: καταυγάζειν ὑπέμενον
  choice: не могли озарить
  rationale: Естественно передаёт неспособность звёздного пламени противостоять этой ночи и освещать её; буквальное «не выдерживали озарять» по-русски неидиоматично.
- source_word: στυγνὴν
  choice: страшную
  rationale: В контексте передаёт сильную отрицательную, внушающую ужас окраску прилагательного στυγνός; возможные оттенки отмечены в сноске.
theological_decisions:
- issue: Поэтически-космическое описание тьмы
  choice: Сохранить образ необычайной ночи, которую не способны осветить ни огонь, ни звёзды.
  alternative: Истолковать стих только как описание обычной физической тьмы или только психологического ужаса.
  rationale: Греческий текст связывает физическую невозможность освещения с устрашающим характером ночи, но не объясняет точную природу этого явления.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного поэтического образа. «Пламена» намеренно выбрано вместо нейтрального «пламя», чтобы передать множественное число и образность греческого текста.
