  text: And the tricks of magical art were laid low, and the boast of wisdom was disgracefully exposed.
translation:
  language: ru
  text: И уловки магического искусства были повержены, а хвастовство мудростью подверглось позорному обличению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμπαίγματα
  choice: уловки
  rationale: В данном контексте слово обозначает обманные приёмы или трюки магического искусства; «уловки» естественно передаёт отрицательный оттенок.
- source_word: κατέκειτο
  choice: были повержены
  rationale: Сохранён образ низложения и полного бессилия, а не просто разоблачения.
- source_word: φρόνησις
  choice: мудрость
  rationale: Здесь речь о той мудрости или рассудительности, которой хвастались; краткое «мудростью» сохраняет широту греческого слова.
- source_word: ἀλαζονία
  choice: хвастовство
  rationale: Передаёт самонадеянную претензию и кичливость без внесения более узкого богословского смысла.
- source_word: ἔλεγχος ἐφύβριστος
  choice: позорное обличение
  rationale: Сочетание выражает унизительное, посрамляющее разоблачение ложной претензии.
theological_decisions:
- issue: Характер человеческой мудрости в контексте суда
  choice: хвастовство мудростью
  alternative: гордыня, основанная на разумении
  rationale: Перевод не осуждает мудрость как таковую, а сохраняет направленность текста против самонадеянного хвастовства ею.
