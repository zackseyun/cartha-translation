  text: Some were driven by terrifying apparitions[a], and others were paralyzed by the betrayal of their soul[b]; for sudden and unexpected fear came upon them.
translation:
  language: ru
  text: Одних гнали страшные видения[a], а другие были парализованы предательством собственной души[b], ибо внезапный и неожиданный страх охватил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призрачные явления». Греческое слово обозначает явившиеся образы; они могут быть жуткими или обманчивыми.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «были парализованы предательством души». Эта необычная фраза может описывать внутренний крах, при котором собственная душа словно обращается против человека.'
    reason: alternative_reading
lexical_decisions:
- source_word: τέρασιν φαντασμάτων
  choice: ужасающие призраки
  rationale: Сочетание передаёт жуткий, необычайный характер явлений; «призраки» сохраняет возможность как мнимых, так и сверхъестественных видений, не определяя их природу.
- source_word: ἠλαύνοντο
  choice: гнали
  rationale: Пассивная форма обозначает, что видения преследовали или понуждали людей; краткое «гнали» естественно передаёт внешнее давление.
- source_word: παρελύοντο
  choice: парализовало
  rationale: Глагол может означать лишение сил или способности действовать; «парализовало» уместно передаёт внутреннее оцепенение от страха.
- source_word: προδοσίᾳ τῆς ψυχῆς
  choice: предательство собственной души
  rationale: Сохранена необычная и сжатая метафора греческого текста без сведения её к совести, малодушию или конкретной психологической реакции.
- source_word: αἰφνίδιος ... καὶ ἀπροσδόκητος φόβος
  choice: внезапно нашёл неожиданный страх
  rationale: Наречие «внезапно» и прилагательное «неожиданный» сохраняют двойное усиление оригинала, избегая тяжеловесного сочетания «внезапный и неожиданный страх».
- source_word: ἐπῆλθεν
  choice: нашёл
  rationale: Русское выражение «страх нашёл на них» естественно передаёт образ страха, обрушившегося на людей.
theological_decisions:
- issue: Неясная метафора προδοσίᾳ τῆς ψυχῆς
  choice: предательство собственной души
  alternative: внутреннее предательство; душа лишала их сил; собственная душа изменила им
  rationale: 'Буквально-метафорический вариант сохраняет напряжение оригинала: внутреннее начало человека словно обращается против него. Текст не уточняет, идёт ли речь о совести, утрате мужества или общем внутреннем крахе.'
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Синтаксис сделан ясным для широкого читателя, но трудная метафора о «предательстве души» намеренно сохранена; оба маркера сносок присутствуют в основном тексте.
