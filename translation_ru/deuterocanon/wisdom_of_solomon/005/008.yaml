translation:
  language: ru
  text: Что дала нам гордыня? И что принесло нам богатство, соединённое с хвастовством?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερηφανία
  choice: гордыня
  rationale: Передаёт высокомерную гордость как нравственно отрицательное качество и естественно звучит в данном риторическом вопросе.
- source_word: ὠφέλησεν
  choice: дала
  rationale: В сочетании «что дала нам» естественно выражает смысл пользы или выгоды без стилистической тяжеловесности.
- source_word: πλοῦτος
  choice: богатство
  rationale: Прямой и общепонятный эквивалент греческого существительного.
- source_word: μετὰ ἀλαζονίας
  choice: соединённое с хвастовством
  rationale: Сохраняет связь богатства с ἀλαζονία — кичливым, самонадеянным хвастовством; причастная конструкция делает эту связь ясной по-русски.
- source_word: συμβέβληται ἡμῖν
  choice: принесло нам
  rationale: Передаёт контекстуальный смысл того, что богатство дало или принесло говорящим; буквальное «содействовало нам» звучало бы неестественно.
theological_decisions:
- issue: Соотношение гордыни, богатства и хвастовства
  choice: Сохранены два параллельных риторических вопроса, причём богатство представлено как соединённое с хвастовством.
  alternative: Истолковать богатство само по себе как безусловно порочное или слить гордыню и хвастовство в одно понятие.
  rationale: Греческий текст порицает гордыню и богатство в связи с ἀλαζονία, не формулируя отвлечённого учения о всяком богатстве.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная риторика исповеди. Параллелизм греческого текста сохранён, синтаксис сделан естественным для широкого читателя.
