  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/001.yaml
  text: Then the righteous man will stand with great boldness before those who afflicted him and those who disregarded his labors[a][b][c].
translation:
  language: ru
  text: Тогда праведник с великим дерзновением[a] предстанет перед[b] теми, кто притеснял его, и теми, кто пренебрегал его трудами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с великой смелостью» либо «с полной уверенностью». Греческое слово может обозначать смелую, открытую и уверенную речь или манеру держаться.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед лицом»; выражение подчёркивает непосредственное присутствие и открытое противостояние.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тяготами» либо «страданиями». Греческое слово может обозначать труд, изнурение, тяготу или боль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественно передаёт временной переход к следующей сцене.
- source_word: στήσεται
  choice: предстанет
  rationale: Передаёт образ вставшего праведника и его непосредственное появление перед прежними притеснителями; русское «предстанет перед» естественно в сцене публичного оправдания.
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: с великим дерзновением
  rationale: «Дерзновение» сочетает открытость, смелость и уверенность; высокий, но понятный регистр соответствует сцене оправдания.
- source_word: ὁ δίκαιος
  choice: праведник
  rationale: Сохраняет субстантивированное прилагательное в мужском роде и единственном числе без ненужного добавления слова «человек».
- source_word: κατὰ πρόσωπον
  choice: перед
  rationale: Естественно выражает непосредственное присутствие и противостояние; буквальное «перед лицом» по-русски здесь было бы тяжеловеснее.
- source_word: τῶν θλιψάντων αὐτὸν
  choice: теми, кто притеснял его
  rationale: «Притеснял» передаёт причинённые давление и страдание, не ограничивая смысл политическим угнетением.
- source_word: τῶν ἀθετούντων
  choice: пренебрегал
  rationale: Передаёт отношение к трудам праведника как к чему-то незначительному и не заслуживающему признания.
- source_word: τοὺς πόνους αὐτοῦ
  choice: его трудами
  rationale: «Труды» сохраняет основное значение усилий и тягот, не сводя широкий смысл πόνος только к физической боли.
theological_decisions:
- issue: Мужской род и единственное число в ὁ δίκαιος
  choice: праведник
  alternative: праведный человек; праведный
  rationale: Греческая форма конкретно представлена мужским родом и единственным числом; русский существительный эквивалент сохраняет это без нейтрализации.
- issue: Оттенок παρρησία в сцене оправдания
  choice: с великим дерзновением
  alternative: с великой смелостью; с полной уверенностью
  rationale: «Дерзновение» сохраняет одновременно публичную открытость, смелость и уверенность, не сводя значение лишь к внутреннему чувству.
- issue: Диапазон значения πόνος
  choice: труды
  alternative: тяготы; страдания
  rationale: Контекст допускает как тяжкий труд, так и связанные с ним тяготы и боль; основной текст не должен без достаточных оснований ограничивать слово одним видом страдания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Дерзновение» сохраняет значимую многозначность исходного слова, а синтаксис остаётся ясным для обычного читателя.
