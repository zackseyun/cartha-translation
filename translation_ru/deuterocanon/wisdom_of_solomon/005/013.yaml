  verdict: revise
  source_fidelity: 'Начальные части переданы точно: «Так и мы» сохраняет сравнительно-выводную связь οὕτως καὶ ἡμεῖς, «родившись» — временное значение γενηθέντες, а «исчезли» допустимо передаёт ἐξελίπομεν. «Добродетель» адекватно передаёт ἀρετή в данном нравственном контексте. Однако «были истощены собственной порочностью» преобразует ἐν τῇ κακίᾳ ἡμῶν («в нашей порочности/злобе») в причинно-инструментальную конструкцию и тем самым чрезмерно уточняет отношение. Следует сохранить образ растраченной жизни в сфере собственной порочности.'
  naturalness: Черновик в целом литературен и понятен. Формулировка «у нас не было ни единого признака добродетели, который мы могли бы предъявить» естественнее, чем «не могли показать», поскольку ближе к ἔσχομεν δεῖξαι («имели, чтобы показать») и не переносит акцент только на неспособность. «Были растрачены в своей порочности» — сжатая литературная метафора, сохраняющая пассивность греческого глагола и предложное отношение ἐν.
  terminology: «Добродетель» является удачным современно-литературным соответствием ἀρετή и не навязывает конфессионального толкования. Для κακία «порочность» допустима; местоимение «своей» достаточно передаёт ἡμῶν. «Растрачены» точнее «истощены» передаёт κατεδαπανήθημεν — быть израсходованными, растраченными.
