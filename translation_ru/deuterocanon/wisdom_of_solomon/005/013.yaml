lexical_decisions:
- source_word: οὕτως καὶ ἡμεῖς
  choice: Так и мы
  rationale: Сохраняет сравнительную связь с предшествующими образами мимолётности и естественно звучит по-русски.
- source_word: γενηθέντες
  choice: родившись
  rationale: Кратко и естественно передаёт аористное причастие со значением появления на свет.
- source_word: ἐξελίπομεν
  choice: исчезли
  rationale: Передаёт прекращение существования или исчезновение, не уточняя способ ухода.
- source_word: ἀρετῆς
  choice: добродетели
  rationale: В данном нравственном контексте обозначает моральное достоинство, что традиционно и понятно выражается словом «добродетель».
- source_word: σημεῖον οὐδὲν ἔσχομεν δεῖξαι
  choice: не могли показать ни единого признака
  rationale: Идиоматично передаёт буквальную конструкцию «не имели никакого знака, чтобы показать», сохраняя смысл отсутствия видимого свидетельства.
- source_word: κακίᾳ ἡμῶν
  choice: собственной порочностью
  rationale: Передаёт нравственную испорченность и принадлежность самим говорящим; «порочность» естественно сочетается с глаголом в этом контексте.
- source_word: κατεδαπανήθημεν
  choice: были истощены
  rationale: Сохраняет пассивную форму и значение полного израсходования или исчерпания, не добавляя прямо идею наказания.
theological_decisions:
- issue: Значение ἀρετή в нравственном контексте Книги Премудрости
  choice: добродетель
  alternative: нравственное достоинство; совершенство
  rationale: «Добродетель» сохраняет этический и сапиенциальный смысл, не превращая слово в позднейший технический богословский термин.
- issue: Связь порочности с истощением в ἐν δὲ τῇ κακίᾳ ἡμῶν κατεδαπανήθημεν
  choice: были истощены собственной порочностью
  alternative: истощились в своей порочности
  rationale: Творительный падеж естественно передаёт возможный инструментальный или причинный оттенок ἐν, тогда как пассив «были истощены» сохраняет грамматическую форму и напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом покаянного признания. Сохранены нравственная лексика, пассивная конструкция заключительной части и смысловая напряжённость образа жизни, исчерпанной порочностью.
