base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/014.yaml
  text: For the hope of the ungodly is like down carried by the wind[a], and like thin frost driven away by a storm, and like smoke dispersed by the wind, and passes by like the remembrance of a one-day guest.
translation:
  language: ru
  text: Ибо надежда нечестивого — как пух, уносимый ветром, как тонкий иней, разогнанный бурей, как дым, рассеянный ветром; она проходит, как память о госте, остановившемся всего на один день.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как упоминание о постояльце, пробывшем всего один день». Греческое καταλύτης обозначает человека, временно остановившегося на ночлег, а μνεία может означать как «память», так и «упоминание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπὶς
  choice: надежда
  rationale: Обычное и точное соответствие, сохраняющее смысл надежды или упования в данном нравственном контексте.
- source_word: ἀσεβοῦς
  choice: нечестивого
  rationale: Передаёт направленную против Бога нравственно-религиозную окраску слова, не сводя его к общей порочности.
- source_word: χνοῦς
  choice: пух
  rationale: Греческое слово обозначает лёгкий пух или пушинку; этот образ точнее, чем «солома» или «пыль».
- source_word: πάχνη ... λεπτὴ
  choice: тонкий иней
  rationale: πάχνη означает иней или изморозь, а λεπτὴ подчёркивает его тонкость и непрочность.
- source_word: λαίλαπος
  choice: бурей
  rationale: Слово обозначает сильную бурю или шквал; «буря» естественно и выразительно передаёт силу стихии.
- source_word: διωχθεῖσα
  choice: разогнанный
  rationale: В погодном образе пассивное причастие естественно передаётся как насильственное удаление инея бурей.
- source_word: διεχύθη
  choice: рассеянный
  rationale: Применительно к дыму глагол описывает его рассеивание под действием ветра.
- source_word: μνεία
  choice: память
  rationale: Сохраняет основной смысл «воспоминание, память»; возможное значение «упоминание» отмечено в сноске.
- source_word: καταλύτου μονοημέρου
  choice: о путнике, остановившемся лишь на один день
  rationale: καταλύτης — временно остановившийся человек, постоялец или путник; развёрнутая формулировка ясно передаёт временность, выраженную μονοήμερος.
theological_decisions:
- issue: Передача ἀσεβοῦς
  choice: нечестивого
  alternative: безбожного; неправедного
  rationale: «Нечестивый» сохраняет религиозно-нравственную направленность греческого слова, тогда как «неправедный» шире, а «безбожный» может чрезмерно акцентировать сознательное отрицание Бога.
- issue: Подлежащее последнего глагола παρῴδευσεν
  choice: она проходит — то есть надежда нечестивого
  alternative: без явно выраженного подлежащего
  rationale: Русская грамматика требует ясного подлежащего; местоимение естественно возвращает читателя к «надежде», не устраняя образной последовательности стиха.
translation_notes:
  register: Современный литературный русский язык с dignified библейской ритмикой. Последовательность сравнений сохранена; повтор «как» поддерживает структуру греческого текста. В основном тексте выбран понятный образ путника, кратко остановившегося в пути, а лексическая неоднозначность последней фразы сохранена в сноске.
