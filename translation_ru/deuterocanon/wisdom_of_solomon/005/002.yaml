  text: When they see him[a], they will be shaken with dreadful fear, and they will be astonished at the unexpectedness of his salvation.
translation:
  language: ru
  text: Увидев его[a], они содрогнутся от ужасного страха и будут поражены неожиданностью его спасения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «Увидев, они содрогнутся от ужасного страха и будут поражены неожиданностью спасения». Местоимения «его» в обоих случаях восполнены по контексту: в предыдущем стихе говорится о праведнике.'
    reason: Лексико-контекстуальное уточнение подразумеваемого референта.
lexical_decisions:
- source_word: ἰδόντες
  choice: Увидев его
  rationale: Аористное причастие от ὁράω передаёт предшествующее или сопутствующее обстоятельство. Объект «его» восполнен из непосредственного контекста — речь идёт о праведнике из предыдущего стиха — и отмечен сноской.
- source_word: ταραχθήσονται
  choice: они содрогнутся
  rationale: Будущее страдательное от ταράσσω обозначает сильное внутреннее потрясение; «содрогнутся» естественно и выразительно передаёт эту силу.
- source_word: φόβῳ δεινῷ
  choice: от страшного ужаса
  rationale: Дательный указывает на причину или состояние, вызвавшее потрясение. Сочетание передаёт усилительное значение δεινός и интенсивность φόβος, не прибегая к архаической речи.
- source_word: ἐκστήσονται
  choice: будут поражены
  rationale: Будущее среднее от ἐξίστημι здесь выражает крайнее изумление, а не буквальную утрату рассудка. «Будут поражены» звучит естественно в современном литературном русском.
- source_word: ἐπὶ τῷ παραδόξῳ
  choice: неожиданностью
  rationale: Субстантивированное παράδοξος означает нечто неожиданное, противоречащее ожиданиям. Отвлечённое существительное естественно связывается с последующим родительным падежом.
- source_word: τῆς σωτηρίας
  choice: его спасения
  rationale: σωτηρία передано богословски ёмким словом «спасение». Притяжательное «его» восполняет подразумеваемую связь с праведником из контекста; это уточнение отмечено сноской.
theological_decisions:
- issue: Подразумеваемый объект при ἰδόντες и принадлежность спасения
  choice: 'В основном тексте уточнить: «Увидев его» и «его спасения».'
  alternative: 'Сохранить греческий эллипсис: «Увидев, они… неожиданностью спасения».'
  rationale: Греческий текст не выражает местоимения прямо, но непосредственный контекст указывает на праведника. Восполнение делает русский текст ясным и естественным, не добавляя отдельного богословского утверждения; буквальная форма дана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим премудростной книге. Сохранены интенсивность страха, изумление и неожиданность спасения; синтаксический эллипсис оригинала разъяснён сноской.
