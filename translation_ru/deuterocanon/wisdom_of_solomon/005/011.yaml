  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/011.yaml
  text: 'or like a bird flying through the air: no evidence of its path is found[a], though the light air, whipped by the stroke of its pinions and split by force with the whirring of moving wings, was traversed[b], and after that no sign of its passage was found in it.'
translation:
  language: ru
  text: 'или как от птицы, пролетающей по воздуху: не находится никакого свидетельства её пути[a]; лёгкий воздух, хлестаемый ударами её крыльев и с силой рассекаемый свистом движущихся крыльев, был ею пройден[b], и после этого в нём не нашлось следа её пролёта.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никакого доказательства её пути»; τεκμήριον подчёркивает отсутствие различимого, убедительного признака пройденного маршрута.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «лёгкий воздух… был пройден»; πνεῦμα κοῦφον можно также передать как «лёгкое дуновение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρνέου διιπτάντος ἀέρα
  choice: птицы, пролетающей по воздуху
  rationale: Передаёт общий образ птицы и её движения сквозь воздух, не уточняя вид и сохраняя естественный русский синтаксис.
- source_word: τεκμήριον πορείας
  choice: свидетельства о её пути
  rationale: τεκμήριον обозначает убедительное свидетельство или доказательный признак, а πορεία — путь, маршрут движения.
- source_word: πληγῇ ... ταρσῶν
  choice: хлёсткими ударами их концов
  rationale: Сохраняется силовая метафора удара; ταρσοί здесь понимаются как рабочие наружные части крыльев, а местоимение связывает их с уже названными крыльями.
- source_word: πνεῦμα κοῦφον
  choice: лёгкий воздух
  rationale: В данном физическом образе πνεῦμα — воздушная среда, рассекаемая птицей; «лёгкий» передаёт κοῦφον без превращения воздуха в ветер.
- source_word: σχιζόμενον βίᾳ ῥοιζῷ
  choice: рассечённый силой со свистом
  rationale: Переданы расщепление воздуха, сила движения и ῥοιζός как свистящий или стремительный шум крыльев.
- source_word: κινουμένων πτερύγων
  choice: движущихся крыльев
  rationale: Формально и ясно передаёт родительный оборот, не добавляя отсутствующего в греческом уточнения о характере движения.
- source_word: διωδεύθη
  choice: был пройден ею
  rationale: Сохранена пассивная перспектива греческого текста, где воздух представлен средой, через которую прошла птица; «ею» добавлено для ясности референта.
- source_word: σημεῖον ἐπιβάσεως
  choice: следа её пролёта
  rationale: В контексте птицы «пролёт» естественно конкретизирует прохождение через воздух, а «след» передаёт отсутствие оставшегося знака.
