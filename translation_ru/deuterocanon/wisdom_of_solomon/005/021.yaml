base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/021.yaml
  text: Well-aimed bolts of lightning will go forth[a], and like from a well-drawn bow of clouds they will leap to the target[b],
translation:
  language: ru
  text: Меткие стрелы молний полетят и, словно из лука облаков, выгнутого ровной дугой[a], устремятся к цели[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «из лука в облаках»; образ может подразумевать небесный грозовой лук или радугу. Греческий текст буквально говорит о «луке облаков».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ринутся к цели», «прыгнут к мишени». Греческий глагол ярко изображает стремительное движение, но его точный оттенок здесь не вполне однозначен.'
    reason: alternative_reading
lexical_decisions:
- source_word: πορεύσονται
  choice: полетят
  rationale: Будущее время πορεύομαι обозначает движение; применительно к стрелам молний «полетят» естественно передаёт их стремительное движение, не ослабляя поэтического образа.
- source_word: εὔστοχοι βολίδες ἀστραπῶν
  choice: меткие стрелы молний
  rationale: εὔστοχοι означает точно попадающие в цель, а βολίδες — метательные снаряды или стрелы. Русское сочетание сохраняет воинский образ и связь с последующим луком.
- source_word: ὡς ἀπὸ εὐκύκλου τόξου τῶν νεφῶν
  choice: словно из хорошо изогнутого лука облаков
  rationale: εὔκυκλος буквально указывает на правильную, хорошую изогнутость; перевод сохраняет образ «лука облаков», не уточняя его как радугу.
- source_word: ἐπὶ σκοπόν
  choice: к цели
  rationale: σκοπός здесь означает мишень или цель; предлог ἐπί при глаголе движения передаёт направленность к ней.
- source_word: ἁλοῦνται
  choice: устремятся
  rationale: Форма передаёт яркое стремительное движение или бросок к цели. «Устремятся» звучит естественно по-русски и сохраняет динамику, не навязывая строго технического значения.
theological_decisions:
- issue: Возможный образ радуги или небесного грозового лука в τῶν νεφῶν
  choice: лук облаков
  alternative: радуга; лук в облаках
  rationale: Греческий текст буквально говорит о «луке облаков». Хотя образ может вызывать представление о радуге или грозовом луке, прямого уточнения нет, поэтому неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической образностью. Синтаксис остаётся ясным для широкого читателя; военная метафора молний как стрел и облаков как лука сохранена.
