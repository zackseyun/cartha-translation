base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/020.yaml
  text: He will sharpen severe wrath into a sword[a], and the world will join battle with him against the senseless.
translation:
  language: ru
  text: Он заострит суровый гнев, превратив его в меч, и мир будет сражаться вместе с ним против безумцев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против неразумных». Здесь речь о людях, которые в своём противлении Богу поступают вопреки разуму и нравственному смыслу, а не о психическом расстройстве в медицинском смысле.'
    reason: Лексическая альтернатива и предотвращение ошибочного клинического прочтения παράφρονας.
lexical_decisions:
- source_word: ὀξυνεῖ
  choice: заострит
  rationale: Будущее время ὀξύνω означает «заострять, оттачивать»; выбор сохраняет образ подготовки оружия.
- source_word: ἀπότομον ὀργὴν
  choice: неумолимый гнев
  rationale: ἀπότομος может выражать резкость и суровость; «неумолимый» естественно передаёт беспощадную силу гнева в судебно-воинском контексте, не ослабляя возвышенного регистра.
- source_word: εἰς ῥομφαίαν
  choice: превратив его в меч
  rationale: εἰς здесь указывает на результат; развернутая конструкция по-русски ясно сохраняет метафору превращения гнева в оружие. ῥομφαία — большой меч, однако общее «меч» естественнее и не вносит спорной технической конкретизации.
- source_word: συνεκπολεμήσει
  choice: вместе с ним выступит на войну
  rationale: Сложный глагол обозначает совместное ведение войны; эта формулировка передаёт как совместность, так и военный характер действия.
- source_word: ὁ κόσμος
  choice: мир
  rationale: Прямой русский эквивалент сохраняет возможный широкий смысл — мироздание или сотворённый порядок, участвующий в суде.
- source_word: ἐπὶ τοὺς παράφρονας
  choice: против безумцев
  rationale: παράφρων обозначает людей, лишённых здравого рассудка, в данном контексте — нравственно и духовно неразумных. «Безумцы» сохраняет резкую полемическую окраску; сноска исключает непреднамеренное клиническое понимание.
theological_decisions:
- issue: К кому относится αὐτῷ («с ним»)
  choice: Сохранено местоимение «с ним» без явного называния Бога.
  alternative: Передать «вместе с Богом» либо отнести местоимение к праведнику.
  rationale: Контекст суда указывает прежде всего на Бога, однако сам греческий текст не называет референта; сохранение местоимения не устраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным судебно-воинским звучанием. Сохранены метафора гнева как меча, участие мира в битве и неопределённый референт местоимения.
