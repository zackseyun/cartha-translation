lexical_decisions:
- source_word: λήμψεται
  choice: возьмёт
  rationale: Будущее время среднего залога от λαμβάνω. В контексте вооружения естественно передаёт принятие или взятие оружия; «возьмёт в руки» было бы более пояснительным.
- source_word: ἀσπίδα
  choice: щит
  rationale: Обычное современное обозначение щита, точно сохраняющее военный образ.
- source_word: ἀκαταμάχητον
  choice: непобедимый
  rationale: Передаёт значение того, что невозможно одолеть в бою, и сохраняет военную метафору без архаизма.
- source_word: ὁσιότητα
  choice: святость
  rationale: Передаёт качество благочестия и праведности перед Богом; в образе добродетели как доспеха звучит широко и возвышенно.
theological_decisions:
- issue: Передавать ли ὁσιότητα как общее нравственно-религиозное качество или как более узкое благочестие.
  choice: святость
  alternative: благочестие
  rationale: «Святость» сохраняет широкий нравственный и богословский смысл греческого слова и не сводит его к внешней религиозности; при этом возможное значение «благочестие» отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным регистром. Сохранены порядок образов и лаконичность греческого текста.
