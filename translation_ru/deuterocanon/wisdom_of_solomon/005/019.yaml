  text: He will take holiness as an unconquerable shield,[a]
translation:
  language: ru
  text: Он возьмёт святость как непобедимый щит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благочестие».'
