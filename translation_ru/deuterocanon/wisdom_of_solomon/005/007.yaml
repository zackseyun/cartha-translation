base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/007.yaml
  text: We were filled with paths of lawlessness and destruction[a], and we traveled through trackless deserts[b], but the way of the Lord we did not know.
translation:
  language: ru
  text: Мы были полны путей беззакония и погибели[a] и прошли через непроходимые пустыни[b], но путь Господа не познали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более свободный перевод: «мы ходили путями беззакония и погибели». Греческий текст буквально связывает образ наполненности с «путями».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бездорожные пустыни»; греческое слово может означать места, по которым нельзя пройти, либо места без доступного пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνομίας … τρίβοις καὶ ἀπωλείας
  choice: путей беззакония и погибели
  rationale: 'Родительные ἀνομίας и ἀπωλείας естественно понимать как характеристики слова τρίβοις: это пути, отмеченные беззаконием и ведущие к погибели. Существительные сохраняют образность и тяжесть греческой формулировки.'
- source_word: ἐνεπλήσθημεν
  choice: мы были полны
  rationale: Передаёт значение наполненности и сохраняет метафору оригинала, не заменяя её истолкованием вроде «мы ходили».
- source_word: τρίβοις
  choice: путей
  rationale: «Пути» — ясный современный эквивалент для троп или дорог; он также поддерживает контраст с единственным «путём Господа».
- source_word: ἀπωλείας
  choice: погибели
  rationale: «Погибель» передаёт и разрушение, и конечную гибель, сохраняя торжественный библейский регистр без узкоконфессионального оттенка.
- source_word: διωδεύσαμεν
  choice: прошли через
  rationale: Глагол обозначает прохождение или пересечение пространства; выбранная формулировка естественна по-русски и передаёт завершённое действие аориста.
- source_word: ἐρήμους ἀβάτους
  choice: непроходимые пустыни
  rationale: 'Сохраняет напряжённый образ: говорящие прошли через места, которые названы недоступными или непроходимыми. Это не сглаживает выразительный парадокс оригинала.'
- source_word: τὴν … ὁδὸν Κυρίου
  choice: пути Господа
  rationale: Устойчивое и понятное библейское выражение, сохраняющее возможность как нравственно-духовного, так и образно-пространственного прочтения.
- source_word: οὐκ ἔγνωμεν
  choice: не познали
  rationale: «Не познали» передаёт не только отсутствие сведений, но и отсутствие узнавания или опытного знакомства; форма уместна для исповедального тона стиха.
theological_decisions:
- issue: Значение выражения «путь Господа»
  choice: Сохранён метафорически ёмкий оборот «путь Господа» без пояснения в основном тексте.
  alternative: Явно истолковать его как праведный образ жизни или как установленный Господом путь.
  rationale: Контраст с путями беззакония указывает на нравственно-духовный смысл, однако сама формулировка допускает более широкий образ пути; перевод не должен преждевременно сужать его.
- issue: Образ наполненности путями
  choice: Сохранена необычная метафора «были полны путей».
  alternative: Сгладить её как «мы ходили путями» или «мы блуждали по путям».
  rationale: Греческий текст говорит именно о наполненности; замена на движение сделала бы фразу привычнее, но устранила бы подлинную образную напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Необычная метафора оригинала сохранена намеренно; инверсия «пути Господа не познали» поддерживает исповедальный ритм и контраст.
