base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/022.yaml
  text: And hailstones full of stony wrath will be hurled, and the water of the sea will rage against them; and rivers will suddenly overwhelm them.
translation:
  language: ru
  text: И градины, полные камнемётного гнева[a], будут брошены; морская вода вознегодует на них, и реки внезапно затопят их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каменного гнева». Греческое слово обозначает то, что мечет камни; точный оттенок этого редкого поэтического сочетания не вполне ясен.'
    reason: Сохраняет неоднозначность πετροβόλου θυμοῦ и не навязывает толкование о праще либо ином конкретном орудии.
lexical_decisions:
- source_word: ἐκ πετροβόλου
  choice: каменного
  rationale: Редкое и трудное сочетание буквально связано с камнем и метанием камней. В контексте града передано прилагательным «каменного», сохраняющим образ каменной сокрушительной силы без добавления прямо не названной пращи.
- source_word: θυμοῦ πλήρεις
  choice: исполненный ... гнева
  rationale: Сохраняет персонифицированный образ града, наполненного гневом, и не сводит θυμός лишь к физической силе.
- source_word: ῥιφήσονται χάλαζαι
  choice: град ... будет брошен
  rationale: Греческое множественное χάλαζαι обозначает градины или градовые удары; русское собирательное «град» звучит естественно, а пассивное «будет брошен» передаёт ῥιφήσονται.
- source_word: ἀγανακτήσει
  choice: вознегодует
  rationale: Передаёт сильное возмущение или ярость моря, сохраняя поэтическое олицетворение.
- source_word: συγκλύσουσιν ἀποτόμως
  choice: внезапно затопят
  rationale: συγκλύζω означает захлестнуть или затопить, а ἀποτόμως здесь передаёт резкость и внезапность действия.
theological_decisions:
- issue: Олицетворение творения как орудия суда
  choice: Сохранены гнев града и негодование моря
  alternative: Ослабить метафоры до «яростно обрушится» и «бурно поднимется»
  rationale: Греческий текст представляет природные силы деятельными участниками суда; буквальная образность сохраняет богословское напряжение и поэтику отрывка.
- issue: Неявный деятель пассивного глагола ῥιφήσονται
  choice: Оставлен пассив «будет брошен» без указания деятеля
  alternative: Добавить «Бог бросит»
  rationale: Источник не называет деятеля непосредственно, поэтому перевод не должен устранять эту неявность.
