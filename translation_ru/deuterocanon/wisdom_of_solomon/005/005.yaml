  - marker: b
    text: 'Или: «доля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: Как же
  rationale: Передаёт вопросительное «как» и оттенок изумления говорящих в контексте.
- source_word: κατελογίσθη
  choice: был причислен
  rationale: Сохраняет страдательный залог и смысл включения в определённую группу.
- source_word: ἐν υἱοῖς θεοῦ
  choice: к сынам Божьим
  rationale: Русское управление с «причислен» требует предлога «к»; «сыны Божьи» точно сохраняет мужской род и статусное обозначение греческого текста.
- source_word: ἅγιοις
  choice: среди святых
  rationale: Субстантивированное «святые» естественно передаёт обозначение святых лиц, не уточняя их природу вопреки неоднозначности текста.
- source_word: κλῆρος
  choice: удел
  rationale: Передаёт назначенную долю или место; звучит естественнее современного русского «жребий» в данной конструкции и сохраняет возвышенный регистр.
- source_word: αὐτοῦ ἐστιν
  choice: его удел —
  rationale: Именная конструкция с тире естественна по-русски и сохраняет акцент на принадлежащем ему уделе.
theological_decisions:
- issue: Передача υἱοῖς θεοῦ
  choice: сынам Божьим
  alternative: детям Божьим
  rationale: Греческий текст прямо использует существительное мужского рода во множественном числе; основной перевод сохраняет эту форму как обозначение статуса, а более обобщённый вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Частица «же» передаёт изумление, а синтаксис сохраняет единый риторический вопрос и не устраняет смысловую напряжённость между причислением к сынам Божьим и уделом среди святых.
