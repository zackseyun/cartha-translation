  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/005.yaml
  text: How was he counted among the sons of God[b][a], and his lot is among the holy ones?
translation:
  language: ru
  text: Как же он был причислен к сынам Божьим[a], и его удел[b] — среди святых?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к детям Божьим». В греческом тексте буквально: «к сынам Бога».'
