base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/003.yaml
  text: 'They will say among themselves[a], repenting, and will groan because of anguish of spirit: “This is the one whom we once held in derision.”'
translation:
  language: ru
  text: 'Они скажут между собой, раскаиваясь, и будут стонать от душевной муки: «Это тот, над кем мы когда-то смеялись»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которого мы когда-то выставляли на посмешище»; букв.: «которого мы когда-то держали за предмет смеха».'
    reason: Лексическая альтернатива для ἔσχομέν ποτε εἰς γέλωτα, сохраняющая образ предмета насмешек.
lexical_decisions:
- source_word: ἐροῦσιν
  choice: они скажут
  rationale: Будущее время λέγω прямо передано естественной русской формой будущего времени.
- source_word: ἐν ἑαυτοῖς
  choice: между собой
  rationale: Выражение допускает как внутреннее размышление, так и речь внутри группы; контекст коллективной прямой речи поддерживает вариант «между собой», не исключающий внутреннего раскаяния.
- source_word: μετανοοῦντες
  choice: раскаиваясь
  rationale: Причастие настоящего времени обозначает состояние говорящих и сохраняет нравственную силу μετανοέω, не утверждая результата их раскаяния.
- source_word: διὰ στενοχωρίαν πνεύματος
  choice: от душевной муки
  rationale: στενοχωρία передаёт сильную тесноту, скорбь и мучительное состояние, а πνεύματος здесь указывает на внутреннюю сферу человека. Формулировка естественна по-русски и сохраняет интенсивность.
- source_word: στενάξονται
  choice: будут стонать
  rationale: Глагол обозначает слышимое выражение тяжёлого страдания; «стонать» точнее по силе, чем «вздыхать».
- source_word: Οὗτος ἦν
  choice: это тот
  rationale: Такое построение естественно вводит узнавание человека, прежде бывшего предметом насмешек; прошедшая перспектива выражена последующим «когда-то».
- source_word: ἔσχομέν ποτε εἰς γέλωτα
  choice: над кем мы когда-то смеялись
  rationale: Конструкция ἔχω εἰς с винительным означает считать или держать кого-либо предметом чего-либо; здесь — предметом смеха. Русская формулировка ясна, современна и передаёт презрение.
theological_decisions:
- issue: Смысл μετανοοῦντες в речи нечестивых
  choice: раскаиваясь
  alternative: сожалея; испытывая угрызения совести
  rationale: «Раскаиваясь» сохраняет нравственно-религиозную силу греческого слова, однако контекст не говорит, является ли это раскаяние спасительным; перевод оставляет данный богословский вопрос открытым.
