  text: like a ship passing through surging water[a], after it has gone by no trace can be found, nor the track of its keel in the waves[b];
translation:
  language: ru
  text: 'словно корабль, проходящий через взволнованную воду[a]: после того как он пройдёт, невозможно найти ни следа, ни пути, проложенного его килем среди волн[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через вздымающуюся волнами воду». Греческое выражение подчёркивает, что вода волнуется.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово, переведённое как «киль», — морской термин; при более свободном переводе выражение можно понять как путь или курс корабля.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναῦς
  choice: корабль
  rationale: Общее обозначение морского судна; «корабль» естественно передаёт масштаб образа.
- source_word: διερχομένη
  choice: проходящий через
  rationale: Причастие обозначает движение сквозь среду; выбранный оборот точно и естественно передаёт это значение.
- source_word: κυμαινόμενον ὕδωρ
  choice: волнующаяся вода
  rationale: Причастие от κυμαίνω изображает воду, вздымающуюся волнами; выражение сохраняет динамику греческого текста без излишнего усиления.
- source_word: ἧς διαβάσης
  choice: когда он пройдёт
  rationale: Родительный абсолют указывает на действие, завершённое прежде невозможности обнаружить след; в русском личная конструкция звучит естественнее.
- source_word: ἴχνος
  choice: след
  rationale: Передаёт отсутствие какого-либо видимого знака прошедшего корабля.
- source_word: ἀτραπός
  choice: путь
  rationale: Слово обозначает тропу или путь и здесь метафорически относится к линии движения судна.
- source_word: τρόπιος αὐτῆς
  choice: его киля
  rationale: В морском контексте τρόπις обозначает киль; местоимение согласовано с русским словом «корабль».
- source_word: ἐν κύμασιν
  choice: среди волн
  rationale: Естественно передаёт нахождение исчезающего пути в волнующейся водной среде.
