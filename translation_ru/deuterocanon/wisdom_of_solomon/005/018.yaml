lexical_decisions:
- source_word: ἐνδύσεται
  choice: облачится
  rationale: Будущая форма среднего залога передаёт намеренное облачение в доспехи; «облачится» естественно сочетается с образом нагрудника и сохраняет возвышенный регистр.
- source_word: θώρακα
  choice: нагрудник
  rationale: Обычное обозначение защитного доспеха для груди; ясно и привычно в библейской воинской образности.
- source_word: δικαιοσύνης
  choice: праведность
  rationale: δικαιοσύνη обозначает как праведность, так и справедливость. В метафоре Божьих доспехов «праведность» сохраняет нравственно-богословскую широту, а возможное значение «справедливость» отмечено в сноске.
- source_word: περιθήσεται
  choice: наденет
  rationale: Будущая форма среднего залога от περιτίθημι означает возложение или надевание на себя; применительно к шлему естественный русский эквивалент — «наденет».
- source_word: κόρυθα
  choice: шлем
  rationale: Прямое и современное обозначение воинского головного доспеха.
- source_word: κρίσιν
  choice: суд
  rationale: Слово сохраняет судебный и деятельный смысл κρίσις, не сужая его до абстрактной справедливости.
- source_word: ἀνυπόκριτον
  choice: нелицеприятный
  rationale: Буквально прилагательное означает «нелицемерный, неподдельный». В сочетании с «суд» слово «нелицеприятный» естественно выражает суд без притворства и пристрастия; буквальная форма сохранена в сноске.
theological_decisions:
- issue: Значение δικαιοσύνη в воинской метафоре
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет широкий смысл нравственной правоты, воплощённой в действии, тогда как «справедливость» остаётся реальной лексической возможностью и указана в сноске.
- issue: Характер суда в выражении κρίσιν ἀνυπόκριτον
  choice: нелицеприятный суд
  alternative: нелицемерный (неподдельный) суд
  rationale: Перевод передаёт практический смысл суда без пристрастия, но сноска сохраняет буквальную необычность греческого выражения и не устраняет его смысловой оттенок подлинности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской воинской образности. Конструкция «как в нагрудник» и «как шлем» делает метафору прозрачной; точка с запятой сохраняет незавершённость стиха в более широком предложении.
