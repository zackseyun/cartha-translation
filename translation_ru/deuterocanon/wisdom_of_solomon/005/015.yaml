  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/015.yaml
  text: But the righteous live forever[a], and their reward is with the Lord[b], and their care is with the Most High.
translation:
  language: ru
  text: Но праведные живут вовеки, и награда их — у Господа[a], и попечение о них — у Всевышнего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «в Господе».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «их благополучие — у Всевышнего» или «Всевышний заботится о них». Греческий оборот краток и допускает эти близкие по смыслу толкования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: праведные
  rationale: Субстантивированное прилагательное обозначает людей, отличающихся праведностью; «праведные» — естественный и традиционно понятный русский эквивалент.
- source_word: εἰς τὸν αἰῶνα ζῶσιν
  choice: живут вовеки
  rationale: Передаёт продолжающуюся жизнь без временного предела, сохраняя возвышенный, но понятный библейский регистр.
- source_word: ἐν Κυρίῳ ὁ μισθὸς αὐτῶν
  choice: награда их — у Господа
  rationale: μισθός здесь означает воздаяние или награду, а ἐν Κυρίῳ в данном обороте естественно понимать как нахождение награды у Господа, в его присутствии или хранении. Буквальное «в Господе» отмечено в сноске.
- source_word: ἡ φροντὶς αὐτῶν
  choice: попечение о них
  rationale: φροντίς допускает значения заботы, попечения и предмета заботы. Оборот «попечение о них» краток и передаёт наиболее вероятное контекстуальное понимание, не разворачивая его в отдельное утверждение.
- source_word: παρὰ Ὑψίστῳ
  choice: у Всевышнего
  rationale: παρά с дательным указывает на пребывание при ком-либо или в его присутствии; «у Всевышнего» естественно по-русски и сохраняет параллелизм с «у Господа».
theological_decisions:
- issue: Смысл ἡ φροντὶς αὐτῶν
  choice: попечение о них — у Всевышнего
  alternative: их благополучие — у Всевышнего; Всевышний заботится о них
  rationale: Компактный греческий оборот допускает понимание как заботы Всевышнего о праведных, так и их благополучия, находящегося в его ведении. Основной текст сохраняет сжатость, а близкие варианты вынесены в сноску.
- issue: Передача ἐν Κυρίῳ
  choice: у Господа
  alternative: в Господе
  rationale: Буквальное «в Господе» возможно, однако применительно к награде по-русски может восприниматься неясно или излишне мистически. «У Господа» передаёт нахождение награды в его присутствии или хранении, не исключая буквального варианта, указанного в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «награда их» и слово «вовеки» поддерживают достоинство стиля, оставаясь понятными; параллельные конструкции «у Господа» и «у Всевышнего» отражают структуру греческого текста.
