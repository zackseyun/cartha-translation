  source_fidelity: 'Текст точно передаёт греческий оригинал: δίκαιοι — «праведные», εἰς τὸν αἰῶνα ζῶσιν — «живут вовеки», а параллельные конструкции о награде и попечении сохранены. «У Господа» удачно передаёт контекстуальный смысл ἐν Κυρίῳ, не выдавая спорный буквальный вариант за единственно возможный. «Попечение о них — у Всевышнего» сохраняет компактность и не уточняет сверх необходимого, кто именно осуществляет заботу.'
