  text: All those things passed away like a shadow[a], and like a report running past;
translation:
  language: ru
  text: Всё это прошло, как тень, и как весть, промчавшаяся мимо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как сообщение, быстро пронёсшееся мимо». Греческое ἀγγελία может означать «весть», «сообщение» или «известие», а παρατρέχουσα подчёркивает стремительное прохождение мимо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθεν
  choice: прошло
  rationale: Аорист παρέρχομαι передаёт завершившееся исчезновение или минование; «прошло» естественно по-русски выражает быстротечность, не уточняя излишне, исчезло ли всё бесследно или лишь осталось позади.
- source_word: ἐκεῖνα πάντα
  choice: всё это
  rationale: Сочетание указывает на всё ранее упомянутое. Русское «всё это» естественнее буквального «все те вещи» и сохраняет собирательный смысл.
- source_word: ὡς σκιὰ
  choice: как тень
  rationale: Прямо сохраняет образ тени, выражающий мимолётность и непрочность.
- source_word: ἀγγελία
  choice: весть
  rationale: Слово может означать весть, сообщение или известие. «Весть» сохраняет образ передаваемой информации и подходит к возвышенному поэтическому контексту.
- source_word: παρατρέχουσα
  choice: промчавшаяся мимо
  rationale: Причастие от παρατρέχω буквально изображает нечто бегущее или быстро проходящее мимо. «Промчавшаяся мимо» естественно и ярко передаёт стремительность образа.
