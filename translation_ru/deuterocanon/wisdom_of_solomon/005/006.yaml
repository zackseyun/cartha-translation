base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/006.yaml
  text: So then we went astray from the way of truth[a], and the light of righteousness did not shine on us, and the sun did not rise for us.
translation:
  language: ru
  text: Итак, мы сбились с пути истины, и свет праведности[a] не сиял нам, и солнце не восходило для нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свет справедливости». Греческое слово δικαιοσύνη может обозначать как нравственную праведность, так и справедливость или правосудие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Итак
  rationale: Передаёт вывод, к которому нечестивые приходят, оглядываясь на свою жизнь; естественно звучит в современной русской речи.
- source_word: ἐπλανήθημεν
  choice: мы сбились
  rationale: Средне-пассивная форма здесь допускает непереходное понимание. Выбор сохраняет образ пути и не вводит прямо не названного внешнего обманщика.
- source_word: ἀπὸ ὁδοῦ ἀληθείας
  choice: с пути истины
  rationale: Сохраняет конкретную метафору дороги и естественно передаёт греческое сочетание с родительным падежом.
- source_word: τὸ τῆς δικαιοσύνης φῶς
  choice: свет праведности
  rationale: Близко воспроизводит структуру греческого выражения; «праведность» передаёт основной нравственный смысл, тогда как судебный оттенок отмечен в сноске.
- source_word: οὐκ ἔλαμψεν ἡμῖν
  choice: не сиял нам
  rationale: Сохраняет образ света и дательный ἡμῖν без добавления пространственного оттенка «на нас», которого греческий текст однозначно не требует.
- source_word: ὁ ἥλιος οὐκ ἀνέτειλεν ἡμῖν
  choice: солнце не восходило для нас
  rationale: Прямо передаёт образ восходящего солнца и значение отношения или пользы в дательном ἡμῖν.
theological_decisions:
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость, правосудие
  rationale: В контексте нравственного пути «праведность» звучит наиболее естественно, но греческое слово сохраняет также общественно-судебный оттенок, который указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной речи. Сохранены параллельные образы пути, света и восходящего солнца; синтаксис сделан ясным без устранения смысловой широты δικαιοσύνη.
