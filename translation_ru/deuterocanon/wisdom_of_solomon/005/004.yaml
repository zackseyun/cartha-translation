lexical_decisions:
- source_word: παραβολήν
  choice: присловьем
  rationale: В сочетании с ὀνειδισμοῦ слово обозначает ставшее общеизвестным насмешливое изречение или уничижительное прозвище, а не «притчу» в узком жанровом смысле. «Присловье» сохраняет образ публично повторяемых слов и естественно звучит по-русски.
- source_word: ὀνειδισμοῦ
  choice: для поношения
  rationale: 'Родительный падеж выражает характер или назначение присловья: оно служит унижению и бесчестью праведника. «Поношение» сохраняет библейскую торжественность, оставаясь понятным.'
- source_word: οἱ ἄφρονες
  choice: мы, неразумные
  rationale: Именительный оборот поясняет, кем были говорящие. Восклицательная подача передаёт их позднее осознание собственной ошибочности, не превращая оборот в отстранённое замечание рассказчика.
- source_word: ἐλογισάμεθα
  choice: мы считали
  rationale: Глагол обозначает сделанную оценку или суждение. «Считали» ясно передаёт прежний ошибочный вывод говорящих.
- source_word: βίον
  choice: жизнь
  rationale: В контексте речь может идти как о жизни человека в целом, так и об образе его жизни; русское «жизнь» сохраняет эту широту.
- source_word: μανίαν
  choice: безумием
  rationale: Слово выражает резкое презрительное суждение о жизни праведника; «безумие» передаёт его силу без ненужного медицинского оттенка.
- source_word: τελευτήν
  choice: конец
  rationale: Греческое слово может обозначать завершение жизни и непосредственно смерть. «Конец» сохраняет исходную широту, а возможное уточнение вынесено в сноску.
- source_word: ἄτιμον
  choice: бесславным
  rationale: Прилагательное означает лишённый чести, не удостоенный почёта. «Бесславный» естественно сочетается с «концом» и передаёт оценку говорящих.
theological_decisions:
- issue: Кто произносит признание
  choice: 'οἱ ἄφρονες передано как самоопределение говорящих: «мы, неразумные!»'
  alternative: 'Отстранённое авторское замечание: «неразумные» или «среди неразумных»'
  rationale: Форма первого лица множественного числа ἐλογισάμεθα и контекст исповеди нечестивых указывают, что они сами признают ошибочность своего прежнего суда. При этом синтаксическая обособленность греческого оборота сохранена.
- issue: Значение τελευτήν
  choice: Сохранено более широкое «его конец»
  alternative: Уточняющее «его смерть» или «его кончину»
  rationale: Слово в контексте явно связано с завершением земной жизни, однако исходная формулировка допускает акцент как на смерти, так и на её обстоятельствах или воспринимаемом исходе. Основной текст не сужает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Начальное «и» сохранено, поскольку стих синтаксически продолжает предыдущее высказывание. Пунктуация подчёркивает внезапное самообличение говорящих.
