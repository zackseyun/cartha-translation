  terminology: «Стрела», «мишень», «воздух», «сомкнулся» удачны. Для δίοδος основным соответствием остаётся «путь»; допустимы «проход» и «траектория» как контекстуальные альтернативы. Богословски нагруженной терминологии в стихе нет.
