lexical_decisions:
- source_word: βέλους βληθέντος
  choice: стрела, выпущенная
  rationale: βέλος в данном образе естественно передаётся как «стрела», а форма от βάλλω обозначает её направление к цели; «выпущенная» — современное и точное выражение для выстрела из лука.
- source_word: ἐπὶ σκοπόν
  choice: в цель
  rationale: σκοπός здесь обозначает конкретную мишень, в которую направлена стрела; русское «в цель» естественно передаёт этот образ.
- source_word: τμηθεὶς ὁ ἀήρ
  choice: рассечённый ею воздух
  rationale: Причастие от τέμνω сохраняет яркий образ воздуха, рассекаемого стрелой; добавление «ею» проясняет естественную для греческого контекста связь без изменения смысла.
- source_word: εὐθέως εἰς ἑαυτὸν ἀνελύθη
  choice: тотчас вновь сомкнулся
  rationale: Буквальное движение воздуха «обратно в самого себя» в контексте означает, что разделённый воздух сразу соединился; «вновь сомкнулся» ясно и образно выражает это по-русски.
- source_word: ὡς ἀγνοῆσαι
  choice: так что нельзя было распознать
  rationale: 'Конструкция выражает результат: после смыкания воздуха след движения уже невозможно определить.'
- source_word: τὴν δίοδον αὐτοῦ
  choice: её путь
  rationale: δίοδος обозначает путь, проход или след движения через среду. Женский род местоимения соотнесён в русском с «стрелой», хотя греческое αὐτοῦ формально соотносится с βέλος среднего рода.
