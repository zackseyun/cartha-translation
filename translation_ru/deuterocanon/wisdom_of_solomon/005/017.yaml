base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/017.yaml
  text: He will take his zeal as full armor[a], and he will arm creation for defense against enemies[b];
translation:
  language: ru
  text: Он возьмёт своё рвение[a] как полное вооружение и обратит творение в оружие для отпора врагам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ревность». Греческое ζῆλος может означать как рвение, так и ревность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вооружит творение». Глагол буквально относится к изготовлению или оснащению оружием; здесь творение представлено как оружие против врагов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λήμψεται
  choice: возьмёт
  rationale: Будущее среднего залога от λαμβάνω; «возьмёт» сохраняет прямое действие и соответствует воинскому образу.
- source_word: πανοπλίαν
  choice: полное вооружение
  rationale: Слово обозначает всё снаряжение тяжеловооружённого воина; «полное вооружение» ясно передаёт идею целостного боевого оснащения.
- source_word: τὸν ζῆλον αὐτοῦ
  choice: своё рвение
  rationale: ζῆλος допускает значения «рвение» и «ревность». В контексте суда «рвение» естественно передаёт пламенную решимость Бога, не устраняя иной возможный оттенок.
- source_word: ὁπλοποιήσει
  choice: вооружит
  rationale: Глагол связан с изготовлением оружия или превращением во что-либо пригодное для боя; «вооружит» кратко и естественно передаёт результат действия.
- source_word: τὴν κτίσιν
  choice: творение
  rationale: κτίσις здесь обозначает сотворённый мир в целом, который становится орудием Божьего действия.
- source_word: εἰς ἄμυναν ἐχθρῶν
  choice: для отпора врагам
  rationale: ἄμυνα означает защиту, отражение нападения или отпор. Русское «для отпора врагам» естественно сохраняет оборонительно-военный смысл и не добавляет отсутствующего в греческом притяжательного местоимения.
theological_decisions:
- issue: Кто является подразумеваемым субъектом
  choice: Местоимение «Он» относится к Богу, представленному в ближайшем контексте как божественный Воитель.
  alternative: Олицетворённая божественная справедливость.
  rationale: Греческая форма указывает на подразумеваемый субъект в третьем лице единственного числа, а контекст продолжает описание действий Господа; перевод не вводит более узкого определения.
- issue: Значение ζῆλος в образе божественного Воителя
  choice: Божье рвение метафорически представлено как полное вооружение.
  alternative: Божья ревность как вооружение.
  rationale: «Рвение» сохраняет воинскую метафору и не сужает многозначность ζῆλος; допустимый оттенок «ревности» отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного воинского образа. Прописная буква в начальном «Он» обусловлена началом предложения; последующее местоимение «своё» не получает конфессионально обусловленной капитализации.
