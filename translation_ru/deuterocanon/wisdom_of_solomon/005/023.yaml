base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/023.yaml
  text: A spirit of power will stand against them[a], and like a whirlwind it will winnow them away;
translation:
  language: ru
  text: Дух силы восстанет против них[a] и, словно вихрь, развеет их;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветер силы восстанет против них»; возможно также: «могучее дуновение восстанет против них». Греческое πνεῦμα может означать «дух», «ветер» или «дыхание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιστήσεται
  choice: восстанет против
  rationale: Будущая форма ἀνθίστημι выражает активное противостояние; «восстанет против» сохраняет конкретный и деятельный характер глагола.
- source_word: πνεῦμα
  choice: дух
  rationale: πνεῦμα может означать «дух», «ветер» или «дыхание». В данном предложении оно выступает как деятельный субъект, тогда как образ бури отдельно передан сравнением «словно вихрь».
- source_word: δυνάμεως
  choice: силы
  rationale: Родительный падеж определяет πνεῦμα; буквальное «силы» не уточняет сверх текста, идёт ли речь о могуществе, мощи или крепости.
- source_word: λαῖλαψ
  choice: вихрь
  rationale: λαῖλαψ обозначает сильную бурю или вихрь; «вихрь» естественно и выразительно передаёт образ неудержимой разрушительной силы.
- source_word: ἐκλικμήσει
  choice: развеет
  rationale: Глагол связан с веянием зерна и удалением мякины. «Развеет» сохраняет этот образ и одновременно передаёт насильственное рассеивание.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение прямо отсылает к нечестивым противникам в контексте.
theological_decisions:
- issue: Передавать ли πνεῦμα как личностно окрашенный «дух» или как безличный «ветер»
  choice: дух
  alternative: ветер; могучее дуновение
  rationale: Синтаксически πνεῦμα δυνάμεως является субъектом, который «восстанет против них», что допускает деятельное, олицетворённое понимание. Однако греческое слово сохраняет значение ветра или дуновения, поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной образностью. Сохранены параллелизм двух частей, деятельное противостояние и метафора веяния; подлинная неоднозначность πνεῦμα вынесена в сноску.
