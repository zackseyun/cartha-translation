base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/016.yaml
  text: Therefore they will receive the kingdom of splendor and the crown of beauty from the hand of the Lord[a], because with his right hand he will shelter them[b], and with his arm he will defend them.
translation:
  language: ru
  text: Поэтому они получат царство великолепия[a] и венец красоты[b] из руки Господа, потому что Он укроет их Своей правой рукой и Своей мышцей защитит их[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царский венец великолепия». Греческое βασίλειον может пониматься как царство или как предмет царских регалий; соседнее «венец» поддерживает второе понимание.'
    reason: lexical_alternative
  - marker: b
    text: Греческое διάδημα точнее обозначает царскую диадему.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «выступит в их защиту»; греческая конструкция подчёркивает действие ради них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Передаёт вывод из предшествующего описания оправдания праведных и естественно связывает стихи.
- source_word: λήμψονται
  choice: получат
  rationale: Будущая форма λαμβάνω в сочетании с «из руки Господа» указывает на принятие дара, а не на овладение силой.
- source_word: τὸ βασίλειον τῆς εὐπρεπείας
  choice: царство великолепия
  rationale: Сохраняет конкретный образ царства и допускаемую греческим выражением идею царского достоинства, не сводя её к отвлечённой почести. Неоднозначность βασίλειον отмечена в сноске.
- source_word: τὸ διάδημα τοῦ κάλλους
  choice: венец красоты
  rationale: «Венец» звучит естественно и торжественно в современном русском; более специальное значение царской диадемы указано в сноске.
- source_word: ἐκ χειρὸς Κυρίου
  choice: из руки Господа
  rationale: Прямо сохраняет библейский образ Господа как лично дарующего награду.
- source_word: τῇ δεξιᾷ σκεπάσει αὐτούς
  choice: Он укроет их Своей правой рукой
  rationale: Инструментальный дательный передан оборотом «рукой»; «укроет» выражает одновременно покрытие и защиту.
- source_word: τῷ βραχίονι ὑπερασπιεῖ αὐτῶν
  choice: Своей мышцей защитит их
  rationale: «Мышца» сохраняет традиционный возвышенный библейский образ действующей силы, а «защитит их» естественно передаёт защиту в их пользу.
theological_decisions:
- issue: Значение κύριος
  choice: Господь
  alternative: Владыка
  rationale: В данном контексте κύριος обозначает Бога как верховного Дарителя и Защитника; «Господь» соответствует русскому библейскому словоупотреблению.
- issue: Характер награды праведных
  choice: Сохранены царские образы «царство… венец»
  alternative: Передать обобщённо как «царская честь» или истолковать βασίλειον как ещё один царский головной убор
  rationale: Греческий текст оставляет напряжение между дарованием царства, царского достоинства и образами регалий; основной текст не превращает эту образность в отвлечённое толкование, а лексическая неоднозначность отмечена в сносках.
translation_notes:
  register: Современный литературный русский с торжественной библейской образностью. Местоимения, относящиеся к Господу, написаны с прописной буквы. Слово «мышца» сохранено как понятный возвышенный библейский образ, тогда как синтаксис остаётся современным и прозрачным.
