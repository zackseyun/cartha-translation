base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/004.yaml
  text: But if they were astonished by their power and activity[a], let them understand from them how much more powerful is the one who made them;
translation:
  language: ru
  text: Если же они были поражены их силой и деятельностью[a], пусть поймут по ним, насколько могущественнее тот, кто создал их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их мощью и действием». Греческие слова δύναμις и ἐνέργεια образуют смысловую пару, обозначая силу и действующую активность сотворённых явлений.'
    reason: Лексическая альтернатива и пояснение смысловой пары.
lexical_decisions:
- source_word: δυνάμει
  choice: силой
  rationale: Передаёт способность и мощь сотворённых явлений и сохраняет смысловую связь со сравнительной формой δυνατώτερός — «могущественнее».
- source_word: ἐνεργείᾳ
  choice: действием
  rationale: Обозначает проявляющуюся вовне деятельность или действие; в паре с «силой» передаёт как внутреннюю мощь, так и её активное проявление.
- source_word: ἐκπλαγέντες
  choice: были поражены
  rationale: Естественно передаёт сильное изумление, не усиливая его до ужаса или подавленности.
- source_word: νοησάτωσαν
  choice: пусть поймут
  rationale: Императив призывает к разумному выводу на основании наблюдаемого.
- source_word: ἀπʼ αὐτῶν
  choice: по ним
  rationale: По-русски естественно выражает вывод, сделанный на основании упомянутых сотворённых явлений.
- source_word: πόσῳ
  choice: насколько
  rationale: В сравнительной конструкции кратко и естественно выражает меру превосходства создателя над созданным.
- source_word: ὁ κατασκευάσας αὐτὰ
  choice: Тот, Кто создал их
  rationale: Сохраняет описательное обозначение создателя, не добавляя отсутствующего в греческом тексте слова «Бог»; «создал» здесь естественнее механического «соорудил».
- source_word: δυνατώτερός
  choice: могущественнее
  rationale: Передаёт сравнительную степень и сохраняет аргумент от силы сотворённого к превосходящей мощи создателя.
theological_decisions:
- issue: Подразумеваемый создатель
  choice: Тот, Кто создал их
  alternative: Бог; Творец
  rationale: Греческий текст описывает создателя причастным оборотом и не называет Его прямо Богом или Творцом; описательная формулировка сохраняет ход рассуждения.
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим премудростной литературе. Синтаксис остаётся ясным для обычного читателя; прописные буквы в «Тот, Кто» указывают на подразумеваемого Бога, не вставляя Его имя в текст.
