base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/013.yaml
  text: But the refuse from these[a], useful for nothing, a crooked piece of wood and full of knots—taking it, he carved it with the diligence of his idleness, and with the skill of his leisure he shaped it, and made it like the image of a man[b],
translation:
  language: ru
  text: А негодный остаток от них[a] — кривой, сучковатый, ни на что не пригодный кусок дерева — он взял и тщательно вырезал в часы своей праздности, а затем, с искусностью, обретённой на досуге, придал ему форму и уподобил его образу человека[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отброшенный кусок», «отход», «обрезок». Греческое слово обозначает то, что выбросили как ненужное.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с усердием своей праздности» и «с искусностью досуга». Это ироническое описание тщательного труда, потраченного на изготовление идола.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἀπόβλημα
  choice: негодный остаток
  rationale: Слово обозначает отброшенный как ненужный остаток. Такой перевод передаёт и связь с ранее упомянутым материалом, и его презренную непригодность, не уточняя сверх текста вид древесного отхода.
- source_word: εἰς οὐδὲν εὔχρηστον
  choice: ни на что не пригодный
  rationale: Естественно и полно передаёт подчёркнутую полную непригодность.
- source_word: ξύλον σκολιὸν καὶ ὅζοις συμπεφυκός
  choice: кривой, сучковатый кусок дерева
  rationale: ξύλον здесь означает древесный материал, σκολιόν — его кривизну, а выражение с ὅζοις — вросшие сучья или сучки. «Сучковатый» кратко и естественно описывает дефектную древесину.
- source_word: ἐγλύψεν
  choice: вырезал
  rationale: Глагол обозначает резьбу по материалу; в данном контексте речь идёт о резьбе по дереву.
- source_word: ἐν ἐπιμελείᾳ ἀργίας αὐτοῦ
  choice: с усердием своей праздности
  rationale: 'Формулировка сохраняет намеренный парадокс и сатирический тон: усердие тратится в праздности на изготовление идола.'
- source_word: ἐμπειρίᾳ ἀνέσεως
  choice: с искусностью досуга
  rationale: Передаёт умение или навык, применяемый в часы покоя и досуга, и сохраняет риторическую параллель с предыдущим выражением.
- source_word: ἐτύπωσεν αὐτό
  choice: придал ему форму
  rationale: Глагол означает формирование или придание очертаний; русский оборот естественен для работы резчика.
- source_word: ἀπεικάσεν αὐτὸ εἰκόνι ἀνθρώπου
  choice: уподобив образу человека
  rationale: Передаёт создание подобия человеческого образа, не внося отсутствующего в греческом тексте уточнения о поле изображённого.
theological_decisions:
- issue: Человеческий образ в выражении εἰκόνι ἀνθρώπου
  choice: образу человека
  alternative: образу мужчины
  rationale: ἄνθρωπος может обозначать человека как такового; контекст не требует считать изображение именно мужским. Русское «человек» сохраняет исходную широту выражения.
- issue: Ирония выражений о праздности и досуге
  choice: с усердием своей праздности… с искусностью досуга
  alternative: старательно вырезал на досуге… искусно придал форму
  rationale: Более буквальная параллель сохраняет сатирическое напряжение греческого текста, где тщательность и умение намеренно сопряжены с праздностью и досугом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис сохраняет накопление характеристик древесного остатка и иронический параллелизм исходного текста; необычные сочетания о праздности и досуге намеренно не сглажены и пояснены сноской.
