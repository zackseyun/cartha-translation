base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/018.yaml
  text: But for life he considers the dead thing worthy; for help he begs the one most inexperienced; and for a journey[a], the one unable even to use its foot,
translation:
  language: ru
  text: О жизни он просит у безжизненного предмета, о помощи умоляет самого неопытного, а о путешествии — того, кто не может даже ступить[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не может даже воспользоваться своим основанием (подставкой)». Греческое βάσις может означать шаг, опору для шага или основание; двусмысленность усиливает насмешку над идолом, который не способен сам двигаться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ ζωῆς
  choice: А о жизни
  rationale: Оборот περὶ с родительным обозначает предмет просьбы; краткое «о жизни» сохраняет параллельное построение стиха.
- source_word: τὸ νεκρόν
  choice: мёртвое
  rationale: Субстантивированное прилагательное среднего рода указывает на безжизненный предмет — идола; русское «мёртвое» сохраняет его безличность и полемическую резкость.
- source_word: ἀξιοῖ
  choice: просит
  rationale: В данном контексте глагол обозначает обращение с просьбой или притязанием. Буквальное «считает достойным» в русском оставило бы неясным, чего именно достоин предмет, тогда как «просит» естественно передаёт действие в ряду параллельных обращений.
- source_word: ἐπικουρίας
  choice: о помощи
  rationale: Прямое и естественное соответствие, сохраняющее параллель с «о жизни» и «о путешествии».
- source_word: τὸν ἀπειρότατον
  choice: самого неопытного
  rationale: Передаёт превосходную степень ἀπειρότατος и не подменяет отсутствие опыта более широким понятием полной неспособности.
- source_word: ἱκετεύει
  choice: умоляет
  rationale: Передаёт настойчивую, почтительную просьбу и сатирический контраст между молящимся и беспомощным идолом.
- source_word: ὁδοιπορίας
  choice: о путешествии
  rationale: Нейтральное литературное обозначение пути или странствия, уместное в параллельном ряду просьб.
- source_word: τὸ μηδὲ βάσει χρῆσθαι δυνάμενον
  choice: того, кто не может даже воспользоваться ногой
  rationale: Сохраняет конкретный образ неспособности идола двигаться. Возможное значение βάσις как основания или подставки отмечено в сноске.
theological_decisions:
- issue: Чередование среднего и мужского рода в обозначении идола
  choice: Передать τὸ νεκρόν безличным «мёртвое», а формы мужского рода — выражениями «самого неопытного» и «того, кто».
  alternative: Во всех трёх частях прямо повторить слово «идол» или везде употребить безличное «оно».
  rationale: 'Так сохраняется риторическое чередование исходного текста: идол одновременно разоблачается как безжизненный предмет и иронически представлен как тот, к кому обращаются с просьбой.'
- issue: Смысл ἀξιοῖ в контексте обращения к идолу
  choice: Перевести функционально как «просит».
  alternative: «Считает достойным» или «считает способным».
  rationale: Русское «считает достойным мёртвое» требует отсутствующего дополнения и звучит незавершённо, а «считает способным» добавляет значение способности. «Просит» сохраняет контекст обращения, не вводя предмет просьбы сверх выражения «о жизни».
translation_notes:
  register: Современный литературный русский язык с кратким параллельным синтаксисом. Тон достоинственный, но сатирическая направленность против безжизненного идола сохранена. Маркер сноски поставлен непосредственно после слова, к которому относится лексическая неоднозначность.
