lexical_decisions:
- source_word: ἀποβλήματα
  choice: обрезки, оставшиеся от работы
  rationale: Существительное обозначает отброшенные или оставшиеся куски материала; в контексте работы по дереву «обрезки» естественно передаёт смысл, а добавление «оставшиеся от работы» выражает связь с τῆς ἐργασίας.
- source_word: ἐργασίας
  choice: работы
  rationale: Широкое обозначение труда или производимой работы; контекст указывает на ремесло, поэтому дополнительное уточнение не требуется.
- source_word: εἰς ἑτοιμασίαν τροφῆς
  choice: на приготовление пищи
  rationale: Предложная конструкция выражает назначение; такой перевод точен и естественен в современном русском языке.
- source_word: ἀναλώσας
  choice: употребил
  rationale: Причастие означает израсходовать или употребить материал. «Употребил» сохраняет широкий смысл, не добавляя прямо не названного в греческом тексте сжигания.
- source_word: ἐνεπλήσθη
  choice: насытился
  rationale: Хотя буквально глагол означает «был наполнен», в связи с приготовлением пищи он идиоматически описывает утоление голода; «насытился» передаёт этот образ естественно и без смысловой потери.
- source_word: τὰ δὲ
  choice: А
  rationale: δέ обозначает переход и лёгкое противопоставление предшествующему; русское «А» здесь естественнее более сильного «Но».
