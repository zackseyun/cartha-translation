  text: But after using up the scraps from his work to prepare food, he was filled.
translation:
  language: ru
  text: А обрезки, оставшиеся от работы, он употребил на приготовление пищи[a] и насытился[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть использовал оставшиеся после ремесленной работы куски материала; вероятно, как топливо для приготовления пищи.
