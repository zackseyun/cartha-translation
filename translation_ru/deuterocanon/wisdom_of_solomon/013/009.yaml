revisions:
- from: Ведь если они оказались способны познать так много, что смогли исследовать мир[a], то как же они не нашли скорее Владыку всего этого?
  to: Ведь если они были способны узнать так много, что могли размышлять о мире[a], то почему же они не нашли скорее Владыку всего этого?
  rationale: Заменено «исследовать» на «размышлять о», чтобы передать умозрительный оттенок στοχάσασθαι. Сноска переработана так, чтобы отмечать, а не разрешать спорную семантику αἰών. Остальная структура перевода, включая сдержанный титул «Владыка», сохранена.
