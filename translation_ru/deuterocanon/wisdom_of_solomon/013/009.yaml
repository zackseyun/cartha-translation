  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/009.yaml
  text: For if they had power to know so much that they could speculate about the age, how did they not more quickly find its Master?
translation:
  language: ru
  text: Ведь если они были способны узнать так много, что могли размышлять о мире[a], то почему же они не нашли скорее Владыку всего этого?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. αἰών может означать также «век», «эпоха» или «миропорядок».
    reason: Сохраняет многозначность αἰών при естественном русском переводе «мир».
lexical_decisions:
- source_word: τοσοῦτον ἴσχυσαν εἰδέναι
  choice: оказались способны познать так много
  rationale: Передаёт меру познавательной способности без неестественного буквального «имели столько силы знать».
- source_word: στοχάσασθαι
  choice: исследовать
  rationale: В данном контексте глагол означает достигать понимания путём рассуждения и наблюдения; «исследовать» естественно передаёт интеллектуальный поиск.
- source_word: τὸν αἰῶνα
  choice: мир
  rationale: В контексте Прем 13 речь идёт о познании сотворённого порядка; «мир» понятно современному читателю, а многозначность греческого слова отмечена в сноске.
- source_word: τὸν τούτων δεσπότην
  choice: Владыку всего этого
  rationale: «Владыка» сохраняет значение верховного господства δεσπότης; «всего этого» ясно связывает его с ранее названным миром и познанными явлениями.
- source_word: τάχιον
  choice: скорее
  rationale: Сохраняет сравнительное значение наречия и риторическое напряжение исходного вопроса.
theological_decisions:
- issue: Отношение познания мира к познанию его Владыки
  choice: Сохранён риторический вопрос без пояснения, каким именно образом познание творения должно вести к Владыке.
  alternative: Добавить причинное пояснение или прямо назвать Владыку Богом.
  rationale: Исходный текст подразумевает связь, но не раскрывает её и использует титул δεσπότης, поэтому перевод не должен устранять эту сдержанность.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной речи. Синтаксис сохраняет условно-риторическую структуру оригинала, но избегает тяжёлой кальки.
