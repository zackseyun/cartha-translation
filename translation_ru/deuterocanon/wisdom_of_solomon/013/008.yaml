lexical_decisions:
- source_word: πάλιν δʼ
  choice: но … всё же
  rationale: Сочетание возобновляет мысль и придаёт ей лёгкий противительный оттенок. В современном русском «но … всё же» естественно передаёт этот поворот рассуждения.
- source_word: οὐδʼ αὐτοὶ
  choice: и они … не
  rationale: Конструкция означает «даже они не». В данном порядке слов частица «и» перед местоимением естественно сохраняет греческое усиление.
- source_word: συγγνωστοί
  choice: не заслуживают снисхождения
  rationale: Прилагательное обозначает тех, кому можно простить вину, сделать послабление или найти оправдание. Эта формулировка сохраняет оценку виновности, не сводя смысл исключительно к межличностному прощению.
theological_decisions:
- issue: Степень виновности, выраженная словом συγγνωστοί
  choice: «не заслуживают снисхождения»
  alternative: «не имеют оправдания»; «не заслуживают прощения»
  rationale: Выбранный вариант передаёт отсутствие основания для снисхождения к виновным и не вносит более поздних догматических категорий. Смысл «оправдания» и «прощения» отмечен как допустимая лексическая грань.
