base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/001.yaml
  text: For all men are by nature futile, in whom there was ignorance of God; and from the good things that are seen they were not able to know the One who is, nor by paying attention to his works did they recognize the craftsman.
translation:
  language: ru
  text: 'Ибо все люди по природе суетны: им было свойственно незнание Бога; по видимым благам они не смогли познать Сущего и, обратив внимание на дела, не распознали Мастера.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μάταιοι
  choice: суетны
  rationale: Передаёт значение тщетности, пустоты и несостоятельности, не сводя слово только к интеллектуальной глупости.
- source_word: φύσει
  choice: по природе
  rationale: Формально сохраняет многозначность греческого выражения и не уточняет без основания, идёт ли речь о врождённом состоянии или общем человеческом положении.
- source_word: τῶν ὁρωμένων ἀγαθῶν
  choice: видя благие творения
  rationale: Естественно передаёт видимые благие вещи в контексте последующего упоминания дел и Творца; слово «творения» выражает контекстуальную связь, не добавляя конкретных объектов.
- source_word: τὸν ὄντα
  choice: Того, Кто есть
  rationale: Сохраняет субстантивированную формулу греческого текста и её возможный богословский отзвук, не заменяя её пояснением.
- source_word: προσχόντες
  choice: вглядываясь
  rationale: Передаёт направленное и внимательное обращение к делам, оставаясь естественным по-русски.
- source_word: τὸν τεχνίτην
  choice: Творца
  rationale: В данном контексте обозначает искусного создателя видимых благ; «Творец» звучит естественно и достойно, хотя несколько ослабляет ремесленный оттенок слова.
theological_decisions:
- issue: Смысл выражения φύσει
  choice: Сохранить «по природе» без разъясняющей вставки.
  alternative: «по своему естеству», «от природы» или толкование как врождённой неспособности
  rationale: Греческий текст допускает напряжение между природным состоянием людей и их фактической несостоятельностью; перевод не должен превращать его в разработанное учение о врождённой неспособности.
- issue: Божественное именование τὸν ὄντα
  choice: «Того, Кто есть»
  alternative: «Сущего» или просто «Бога»
  rationale: Выбранная формулировка сохраняет буквальный смысл и возможную связь с библейским языком о Божьем бытии, не делая эту связь более определённой, чем в тексте.
- issue: Ответственность людей за непознание Бога
  choice: 'Сохранена последовательность: видимые блага были доступны, но люди не смогли познать и распознать.'
  alternative: Усилить нравственную вину словами «не захотели» или ослабить её словом «не сумели» как нейтральной невозможностью
  rationale: Оригинал говорит о неспособности и нераспознании, но не формулирует здесь прямо ни отказ воли, ни полное отсутствие доступного свидетельства.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис слегка упрощён относительно греческого периода; двоеточие сохраняет причинно-пояснительную связь. Заглавные буквы в божественных наименованиях применены по русской библейской издательской традиции.
