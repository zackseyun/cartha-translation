revisions:
- from: 'Ибо суетны по природе все люди, в которых было незнание Бога: видя благие творения, они не смогли познать Того, Кто есть, и, вглядываясь в дела, не распознали Творца.'
  to: 'Ибо все люди по природе суетны: им было свойственно незнание Бога; по видимым благам они не смогли познать Сущего и, обратив внимание на дела, не распознали Мастера.'
  rationale: Перевод исправлен только там, где проект менял синтаксис и семантический диапазон оригинала. Сохранены «по природе» для φύσει и субстантивированное божественное именование для τὸν ὄντα; «Сущий» даёт более естественную русскую форму при той же смысловой открытости. Точка с запятой отделяет вторую параллельную отрицательную мысль, как в греческом οὔτε.
  reviewer_model: gpt-5.6-terra
