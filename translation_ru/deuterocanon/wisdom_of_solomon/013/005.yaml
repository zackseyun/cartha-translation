  text: For from the greatness and beauty of created things[a], their Creator is seen by analogy.
translation:
  language: ru
  text: Ибо из величия и красоты творений по аналогии познаётся их Создатель.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их Создатель познаётся соответственно им». Греческое наречие указывает на умозаключение, соразмерное свойствам творений: от них судят о Том, кто их создал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: по
  rationale: 'Передаёт основание умозаключения: свойства Создателя постигаются через рассмотрение сотворённого.'
- source_word: μεγέθους
  choice: величию
  rationale: Сохраняет широкий смысл масштаба и величественности, не сводя слово только к физическому размеру.
- source_word: καλλονῆς
  choice: красоте
  rationale: Прямой и естественный русский эквивалент, обозначающий красоту сотворённого.
- source_word: κτισμάτων
  choice: творений
  rationale: Передаёт множественное число и охватывает всё созданное, а не только живых существ.
- source_word: ἀναλόγως
  choice: по аналогии
  rationale: Сохраняет мысль о соразмерном умозаключении от свойств творений к их Создателю.
- source_word: ὁ γενεσιουργὸς αὐτῶν
  choice: их Создателя
  rationale: Редкое существительное обозначает того, кто производит или приводит к бытию; «Создатель» естественно сочетается с «творениями».
- source_word: θεωρεῖται
  choice: можно постигать
  rationale: Передаёт не непосредственное зрительное видение, а распознавание посредством созерцания и размышления; безличная конструкция естественна по-русски.
theological_decisions:
- issue: Естественное откровение
  choice: можно по аналогии постигать их Создателя
  alternative: их Создатель усматривается соразмерно
  rationale: Перевод утверждает возможность умозаключения о Создателе на основании творений, но не расширяет это утверждение до полной или спасительной богопознавательной достаточности.
