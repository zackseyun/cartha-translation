- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: творения человеческих рук
  rationale: Сохраняет библейский образ рукотворных идолов и передаёт родовое значение ἀνθρώπων.
- source_word: τέχνης ἐμμελέτημα
  choice: искусные изделия
  rationale: Передаёт результат умелого, продуманного ремесленного труда, не превращая выражение в эстетическую похвалу.
- source_word: ἀπεικάσματα ζώων
  choice: изображения животных
  rationale: Ясно и непосредственно передаёт образы или подобия живых существ в данном контексте.
- source_word: λίθον ἄχρηστον
  choice: бесполезный камень
  rationale: Сохраняет буквальную полемическую характеристику камня как не приносящего пользы.
- source_word: χειρὸς ἔργον ἀρχαίας
  choice: дело древней руки
  rationale: Сохраняет компактность, необычный образ и возможный акцент на давнем человеческом происхождении изваяния.
theological_decisions:
- issue: Смысл выражения «надежды — среди мёртвых»
  choice: Сохранить широкий метафорический образ без уточнения референта.
  alternative: «надежды возложены на мёртвые вещи» или «надежды — с умершими»
  rationale: Греческая формулировка допускает намеренное совмещение представлений о безжизненных идолах и смертной тщете; конкретизация сняла бы эту напряжённость.
- issue: Родовое значение ἀνθρώπων
  choice: «человеческих рук»
  alternative: «рук людей» или традиционное «рук человеческих»
  rationale: Форма относится ко всему человечеству, а не только к мужчинам; выбранный вариант точен и естественен.
