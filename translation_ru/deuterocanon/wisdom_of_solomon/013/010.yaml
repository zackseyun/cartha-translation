base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/010.yaml
  text: But miserable are they[a], and their hopes are among the dead, who called gods the works of human hands—gold and silver, the product of skill, and images of animals, or a useless stone[b], the work of an ancient hand.
translation:
  language: ru
  text: 'Но жалки и те, чьи надежды — среди мёртвых[a]: те, кто назвал богами изделия человеческих рук — золото и серебро, плод искусного мастерства, изображения животных или бесполезный камень[b], дело древней руки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «их надежды — в мёртвых вещах» или «их надежды — с мёртвыми». Краткое греческое выражение может одновременно указывать на безжизненных идолов и на сопряжённую со смертью тщетность.'
    reason: alternative_reading
  - marker: b
    text: Выражение «дело древней руки» может означать каменного идола, изваянного в давние времена, и подчёркивать как его древность, так и его сугубо человеческое происхождение.
    reason: lexical_alternative
