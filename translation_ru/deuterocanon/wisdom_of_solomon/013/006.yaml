base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/006.yaml
  text: Yet even for these there is only slight blame, for they too perhaps go astray while seeking God and wanting to find him;
translation:
  language: ru
  text: Но всё же и они заслуживают небольшого упрёка, ведь, возможно, они сбиваются с пути, ища Бога[a] и желая найти Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ища божество». В греческом перед словом «Бог» нет артикля, однако по контексту, вероятнее всего, имеется в виду истинный Бог, Которого они, хотя и ошибочным путём, стремятся найти.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: Но всё же
  rationale: Естественно передаёт одновременно противительное и уступительное значение сочетания.
- source_word: ἐπὶ τούτοις
  choice: и они заслуживают
  rationale: Оборот относится к ранее названным людям; предикативная перестройка делает русскую фразу ясной, не меняя смысла.
- source_word: μέμψις ὀλίγη
  choice: небольшого упрёка
  rationale: μέμψις обозначает порицание или упрёк, а не тяжёлую юридическую вину; ὀλίγη смягчает оценку.
- source_word: τάχα
  choice: возможно
  rationale: Сохраняет выраженную в греческом осторожность утверждения.
- source_word: πλανῶνται
  choice: сбиваются с пути
  rationale: Передаёт образ заблуждения или блуждания, не уточняя внешнюю причину ошибки.
- source_word: θεὸν ζητοῦντες
  choice: ища Бога
  rationale: В контексте речь, вероятнее всего, об истинном Боге, хотя существительное употреблено без артикля; одновременность действия передана деепричастием.
- source_word: θέλοντες εὑρεῖν
  choice: желая найти Его
  rationale: Передаёт волевое стремление этих людей и естественно восполняет подразумеваемый объект местоимением.
theological_decisions:
- issue: Определённое или неопределённое понимание θεόν
  choice: Бога
  alternative: божество / какого-либо бога
  rationale: Контекст Премудрости 13 говорит о людях, пытающихся через творение найти истинного Творца. Однако отсутствие артикля допускает более неопределённое прочтение, поэтому оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но общедоступным библейским регистром. Синтаксис перестроен ради естественности; уступительность, осторожность τάχα и смысловое напряжение безартиклевого θεόν сохранены.
