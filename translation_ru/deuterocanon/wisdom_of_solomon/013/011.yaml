  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/011.yaml
  text: Or if some woodcutter[a], a carpenter, has sawed down a manageable tree and skillfully stripped off all its bark, and with proper craftsmanship made a useful vessel for the service of life[b],
translation:
  language: ru
  text: Но если какой-нибудь лесоруб-плотник, спилив дерево, подходящее для обработки[a], умело соскоблит с него всю кору и, искусно обработав его, сделает полезный предмет для житейских нужд[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дерево, с которым легко работать». Греческое слово может указывать на дерево, удобное для перемещения или обработки.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для служения жизни»; то есть для повседневного использования или житейских потребностей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑλοτόμος τέκτων
  choice: лесоруб-плотник
  rationale: Сочетание обозначает мастера, который рубит древесину и затем обрабатывает её; сложное наименование сохраняет обе стороны его занятия без лишней описательности.
- source_word: εὐκίνητον φυτὸν
  choice: подходящее для обработки дерево
  rationale: В данном ремесленном контексте εὐκίνητον указывает на древесину, с которой удобно обращаться или работать, а φυτὸν естественно означает дерево.
- source_word: ἐκπρίσας
  choice: спилит
  rationale: Глагол обозначает действие пилой; применительно к дереву «спилит» точно и естественно.
- source_word: περιέξυσεν εὐμαθῶς πάντα τὸν φλοιὸν αὐτοῦ
  choice: умело снимет с него всю кору
  rationale: Передаёт соскабливание или удаление коры по всей поверхности и ремесленную сноровку, выраженную наречием.
- source_word: τεχνησάμενος εὐπρεπῶς
  choice: искусно обработав его
  rationale: Формулировка сохраняет идею умелой, надлежащей ремесленной работы и избегает тяжеловесного повтора.
- source_word: χρήσιμον σκεῦος
  choice: полезный предмет
  rationale: σκεῦος здесь обозначает неопределённый предмет или изделие практического назначения; «предмет» не сужает значение до сосуда.
- source_word: εἰς ὑπηρεσίαν ζωῆς
  choice: для житейских нужд
  rationale: Выражение относится к практическим потребностям повседневной человеческой жизни; русская формулировка естественна и сохраняет общий смысл.
theological_decisions:
- issue: Обычное ремесло как подготовка к последующему рассуждению об изготовлении идола
  choice: Сохранить нейтральное описание полезной работы плотника
  alternative: Заранее придать описанию отрицательную окраску, предвосхищающую осуждение идолопоклонства
  rationale: В самом стихе говорится об изготовлении полезного бытового предмета. Полемический поворот следует далее, поэтому здесь его не следует вносить в перевод преждевременно.
