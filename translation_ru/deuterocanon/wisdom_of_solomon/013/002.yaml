base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/002.yaml
  text: Instead[a], they considered either fire, or wind, or swift air, or the circle of the stars, or violent water, or the lights of heaven, to be gods[c][b], rulers of the world.
translation:
  language: ru
  text: Но они сочли богами — владыками мира[c] — огонь, или ветер[a], или стремительный воздух, или круг звёзд[b], или неистовую воду, или небесные светила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух» либо «дыхание»; здесь контекст природных стихий указывает на ветер.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «круговое движение звёзд» или «звёздный круг».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «предводителями (правителями) мира».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ἢ
  choice: Но они… огонь, или…
  rationale: Союз ἀλλά передаёт противопоставление предыдущей мысли, а повторяющееся ἤ вводит ряд взаимоисключающих отождествлений. В русском перечне первое ἤ естественно выражено построением «огонь, или…».
- source_word: πῦρ
  choice: огонь
  rationale: Прямое обозначение природной стихии без необходимости в поясняющем расширении.
- source_word: πνεῦμα
  choice: ветер
  rationale: В ряду природных сил значение «ветер» лучше всего соответствует контексту; оно также позволяет отличить πνεῦμα от следующего ἀήρ.
- source_word: ταχινὸν ἀέρα
  choice: стремительный воздух
  rationale: «Стремительный» сохраняет идею быстрого движения, а «воздух» прямо передаёт ἀήρ и не смешивает его с πνεῦμα, переведённым как «ветер».
- source_word: κύκλον ἄστρων
  choice: круг звёзд
  rationale: Буквальный и образный перевод, не определяющий однозначно, имеется ли в виду звёздный круг, небесная сфера или круговое движение звёзд.
- source_word: βίαιον ὕδωρ
  choice: неистовую воду
  rationale: Передаёт силу и бурность, выраженные βίαιον, сохраняя собирательное единственное число ὕδωρ.
- source_word: φωστῆρας οὐρανοῦ
  choice: небесные светила
  rationale: Современное и ясное русское обозначение небесных источников света, точно соответствующее сочетанию.
- source_word: πρυτάνεις κόσμου
  choice: владыками мира
  rationale: «Владыки» передаёт тех, кто главенствует и управляет; приложение выделено тире, чтобы сохранить его отношение к «богами» и не превратить в отдельный член перечня.
- source_word: θεοὺς ἐνόμισαν
  choice: сочли богами
  rationale: Естественно передаёт суждение, выраженное ἐνόμισαν, и сохраняет предикативную конструкцию с θεούς.
theological_decisions:
- issue: 'Значение πνεῦμα: «ветер» или «дух»'
  choice: ветер
  alternative: дух; дыхание
  rationale: Контекст перечисляет природные стихии и небесные явления, ошибочно принятые за богов. «Ветер» сохраняет этот смысл и не привносит представление о личном духовном существе.
- issue: Связь πρυτάνεις κόσμου с θεούς
  choice: богами — владыками мира —
  alternative: богами, правящими миром; богами, властителями космоса
  rationale: Греческое выражение представляет «владык мира» как приложение к «богам». Русская конструкция с тире ясно сохраняет это приложение и не решает сверх текста вопрос о точном характере их предполагаемой власти.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Перечень сохранён ритмичным и понятным; тире подчёркивают приложительный характер слов «владыками мира». Различие между πνεῦμα и ἀήρ передано словами «ветер» и «воздух».
