lexical_decisions:
- source_word: ποιήσας
  choice: сделав
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно сохраняет эту связь.
- source_word: αὐτῷ
  choice: для него
  rationale: Местоимение относится к изготовленному изображению; мужской род в русском обусловлен грамматическим родом подразумеваемого «идола» или «образа» и сам по себе не приписывает предмету личностности.
- source_word: αὐτοῦ ἄξιον
  choice: достойное его
  rationale: Сохраняет оценочную двусмысленность ἄξιος — «достойный, соответствующий, подходящий» — и возможную иронию контекста.
- source_word: οἴκημα
  choice: жилище
  rationale: 'Передаёт буквальный смысл места обитания и сохраняет иронию: рукотворному изображению устраивают место для пребывания. «Святилище» было бы более узким толкованием.'
- source_word: ἐν τοίχῳ
  choice: в стене
  rationale: ἐν с дательным обозначает местонахождение; выражение допускает размещение в нише или иную установку внутри стены, не уточняя устройство.
- source_word: ἔθηκεν
  choice: поместил
  rationale: Нейтрально и естественно передаёт простое действие размещения предмета.
- source_word: ἀσφαλισάμενος
  choice: закрепив
  rationale: Передаёт сопутствующее действие, посредством которого изображение было сделано устойчивым или защищено от смещения.
- source_word: σιδήρῳ
  choice: железом
  rationale: Творительный падеж естественно передаёт инструментальный дательный, не добавляя отсутствующей в греческом конкретики о виде крепления.
theological_decisions:
- issue: Как передать местоимения, относящиеся к идолу
  choice: «для него… его… его» по грамматическому роду подразумеваемого идола или образа
  alternative: «для него самого» либо перестройка фразы с повторением существительного
  rationale: В русском нет нейтрального местоимения, применимого независимо от рода названного предмета. Мужской род здесь грамматический и не наделяет рукотворное изображение личностным статусом.
- issue: Оценочный или функциональный смысл αὐτοῦ ἄξιον
  choice: «достойное его»
  alternative: «подходящее для него»
  rationale: Более буквальная формулировка сохраняет как значение соответствия, так и ироническую оценочную напряжённость авторской критики идолопоклонства.
