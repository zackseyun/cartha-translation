  text: And after making for it a dwelling fit for it[a], he set it in a wall, securing it with iron.
translation:
  language: ru
  text: И, сделав для него подходящее жилище[a], он поместил идола в стене, закрепив железом.
  philosophy: optimal-equivalence
  footnotes:
