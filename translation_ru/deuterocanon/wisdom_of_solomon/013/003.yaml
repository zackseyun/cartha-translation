  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/003.yaml
  text: If, then, delighting in their beauty, they supposed them to be gods, let them know how much better than these is their Master; for the creator of beauty created them.
translation:
  language: ru
  text: Если же, восхищаясь их красотой, они принимали их за богов, пусть узнают, насколько Владыка превосходит их, ведь их сотворил Творец красоты.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ καλλονῇ τερπόμενοι
  choice: восхищаясь их красотой
  rationale: Передаёт удовольствие и очарование красотой естественным современным русским выражением.
- source_word: θεοὺς ὑπελάμβανον
  choice: принимали их за богов
  rationale: ὑπολαμβάνω здесь обозначает мнение или предположение; русское выражение сохраняет ошибочность такого вывода.
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: Сохраняет значение господства и превосходства над творениями; прописная буква указывает на Бога в данном контексте.
- source_word: βελτίων
  choice: превосходнее
  rationale: В контексте сравнения Творца с красотой творений речь идёт не просто о нравственной «лучшести», а о превосходстве.
- source_word: ὁ τοῦ κάλλους γενεσιούργης
  choice: Творец красоты
  rationale: γενεσιουργός означает того, кто производит или даёт начало; «Творец» точно и естественно передаёт смысл без громоздкости.
- source_word: ἔκτισεν αὐτά
  choice: их сотворил
  rationale: Глагол κτίζω передан обычным библейским и современным русским «сотворил»; местоимение относится к видимым прекрасным вещам.
theological_decisions:
- issue: Соотношение красоты творений и Бога
  choice: «насколько превосходнее их Владыка»
  alternative: «насколько лучше их Господин»
  rationale: Формулировка сохраняет аргумент от красоты сотворённого к превосходству Творца, не уточняя сверх текста природу этого превосходства.
- issue: Бог как источник красоты
  choice: «Творец красоты»
  alternative: «Создатель прекрасного»
  rationale: Выбор сохраняет абстрактное κάλλος как «красоту» и прямо выражает творческое действие, не вводя конфессиональных уточнений.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для Писания. Синтаксис сделан ясным для обычного читателя; повтор «их» сохранён ради явной связи с предметами творения. «Владыка» и «Творец» употреблены как контекстуальные наименования Бога.
