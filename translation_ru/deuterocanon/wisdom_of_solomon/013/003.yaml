    rationale: В русском это естественно воспринимается как притяжательная группа, тогда как в оригинале τούτων означает «чем эти [вещи]» / «их» как объект сравнения. Следует явно обозначить сравнительное отношение.
  revised_text: Если же, восхищаясь их красотой, они принимали их за богов, пусть узнают, насколько Владыка превосходит их, ведь их сотворил Творец красоты.
