revisions:
- from: А о средствах к жизни, работе и успехе своих рук[a] он просит способности действовать у того, что менее всего способно действовать руками[b].
  to: А о средствах к жизни, работе и успехе своих рук[a] он просит у того, что совершенно бездеятельно[b], способности действовать руками.
  rationale: Исправление восстанавливает силу греческой превосходной степени и устраняет необоснованное утверждение, будто текст прямо говорит о неспособности идола действовать именно руками. «Руками» сохранено в основном тексте как характеристика искомой практической действенности, а сноска честно отмечает возможное альтернативное синтаксическое понимание.
