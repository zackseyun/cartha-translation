base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/019.yaml
  text: But concerning provision and work and success of his hands[b][a], he asks strength from that thing most inactive with his hands.
translation:
  language: ru
  text: А о средствах к жизни, работе и успехе своих рук[a] он просит у того, что совершенно бездеятельно[b], способности действовать руками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «успехе рук», то есть успехе в том, что человек делает.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у самого бездеятельного», «у совершенно неподвижного». Греческая превосходная степень подчёркивает полную неспособность идола действовать. Положение слова «руками» допускает также понимание, что оно относится к тому, как человек обращается с просьбой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορισμοῦ
  choice: средствах к жизни
  rationale: Слово обозначает приобретение или добывание необходимых средств. Такой перевод передаёт материальное обеспечение, не сужая смысл до прибыли.
- source_word: ἐργασίας
  choice: работе
  rationale: Широкое и естественное соответствие для труда или деятельности.
- source_word: χειρῶν ἐπιτυχίας
  choice: успехе своих рук
  rationale: Сохраняет буквальный образ «успеха рук» и подразумевает удачный исход того, что человек делает собственными руками.
- source_word: τὸ ἀδρανέστατον
  choice: того, что менее всего способно действовать
  rationale: Греческая форма среднего рода указывает на идола как на предмет, а превосходная степень подчёркивает его полную неспособность к действию.
- source_word: ταῖς χερσὶν
  choice: руками
  rationale: Дательный падеж связывает неспособность к действию с руками идола; краткое «руками» сохраняет параллель с «своих рук» в первой части стиха.
- source_word: εὐδράνειαν
  choice: способности действовать
  rationale: Редкое существительное выражает действенность или способность к успешному действию. Формулировка сохраняет смысловой контраст с ἀδρανέστατον.
- source_word: αἰτεῖται
  choice: просит
  rationale: Прямой и естественный перевод глагола со значением просьбы.
theological_decisions:
- issue: К кому относится субстантивированная форма среднего рода τὸ ἀδρανέστατον
  choice: К идолу как к неодушевлённому предмету, совершенно неспособному действовать руками
  alternative: К божеству, представленному образом, без особого акцента на материальной неподвижности самого изображения
  rationale: Контекст главы говорит об изготовленном руками изображении; средний род, упоминание рук и резкая ирония просьбы указывают прежде всего на сам идол как предмет.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Намеренный повтор «действовать» передаёт греческий контраст между εὐδράνεια и ἀδρανέστατον; образ рук сохранён в обеих частях стиха.
