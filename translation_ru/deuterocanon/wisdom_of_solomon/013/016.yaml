  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/016.yaml
  text: So then[a], lest it fall, he made provision for it, knowing that it is unable to help itself; for it is an image and has need of help.
translation:
  language: ru
  text: Итак, чтобы оно не упало, он заранее позаботился о нём, зная, что оно не в силах помочь самому себе; ведь это образ[a], нуждающийся в помощи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идол». Греческое слово буквально означает «образ» или «изображение», но здесь речь идёт об изготовленном предмете поклонения.'
    reason: Лексическая альтернатива и контекстуальное уточнение εἰκών.
lexical_decisions:
- source_word: ἵνα μὲν οὖν μὴ καταπέσῃ
  choice: Итак, чтобы изваяние не упало
  rationale: ἵνα с μή и аористом сослагательного наклонения выражает предотвращаемую цель. Русское «чтобы ... не упало» естественно передаёт этот смысл. Существительное «изваяние» проясняет подразумеваемый неодушевлённый предмет из контекста, не подменяя последующее εἰκών.
- source_word: προενόησεν αὐτοῦ
  choice: он заранее позаботился о нём
  rationale: προενόησεν обозначает предварительную заботу и заблаговременно принятые меры; «заранее позаботился» сохраняет как приставочный оттенок, так и практический смысл.
- source_word: εἰδὼς ὅτι ἀδυνατεῖ ἑαυτῷ βοηθῆσαι
  choice: зная, что оно не в силах помочь самому себе
  rationale: Сохраняется причастная связь εἰδὼς и подчёркнутая греческим ἀδυνατεῖ неспособность предмета оказать помощь себе самому.
- source_word: εἰκὼν
  choice: образ
  rationale: Основное значение εἰκών — «образ, изображение, подобие». «Образ» сохраняет исходную лексику и авторскую иронию, тогда как «идол» прямо называет функцию предмета, явную лишь из контекста.
- source_word: χρείαν ἔχει βοηθείας
  choice: сам нуждается в помощи
  rationale: Естественная современная передача греческого оборота «имеет нужду в помощи». Добавленное «сам» не вводит нового содержания, а по-русски подчёркивает заложенный в контексте иронический контраст.
theological_decisions:
- issue: Значение εἰκών в контексте критики идолопоклонства
  choice: 'В основном тексте: «образ»'
  alternative: «идол» или «изваяние»
  rationale: 'Контекст несомненно описывает изготовленный предмет поклонения, однако само εἰκών означает «образ/изображение». Буквальное значение сохраняет риторическое напряжение: предмет, от которого ожидают помощи, сам нуждается в помощи. Контекстуальная передача «идол» отмечена в сноске.'
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным, но понятным синтаксисом. Ирония оригинала сохранена повтором темы помощи: образ не способен помочь себе и сам в ней нуждается.'
