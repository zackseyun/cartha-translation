base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/017.yaml
  text: But concerning his possessions and his marriage and children[a], while praying he is not ashamed to address the lifeless thing; and concerning health, he calls on what is weak[c][b],
translation:
  language: ru
  text: А молясь о своём имуществе, браке и детях[a], он не стыдится обращаться к безжизненному; и, прося о здоровье, призывает на помощь немощное[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «браках»; возможно также: «брачных делах».'
    reason: Сохраняет сведения о множественном числе γάμων и о возможном собирательном значении выражения.
  - marker: b
    text: «Безжизненное» и «немощное» — презрительные описания лишённого жизни и силы идола; сам идол здесь прямо не назван.
    reason: Поясняет риторический приём греческого текста, не подменяя его истолкованием в основном переводе.
lexical_decisions:
- source_word: κτημάτων
  choice: имуществе
  rationale: Передаёт широкий смысл принадлежащей человеку собственности, не сужая его до земли или отдельных вещей.
- source_word: γάμων
  choice: браке
  rationale: Хотя в греческом стоит множественное число, в данном перечислении оно естественно обозначает сферу брака или брачные дела; буквальное «браках» по-русски могло бы без достаточных оснований подразумевать несколько браков.
- source_word: τέκνων
  choice: детях
  rationale: Прямое и естественное соответствие греческому слову со значением детей или потомства.
- source_word: προσευχόμενος
  choice: молясь
  rationale: Деепричастие естественно передаёт обстоятельственное значение греческого причастия и связывает молитву с последующим обращением.
- source_word: οὐκ αἰσχύνεται
  choice: не стыдится
  rationale: Точно сохраняет нравственно-полемическую окраску исходного выражения.
- source_word: τῷ ἀψύχῳ
  choice: к безжизненному
  rationale: Сохраняет субстантивированное определение, отсутствие прямого слова «идол» и акцент на лишённости жизни; форма среднего рода звучит по-русски намеренно предметно.
- source_word: προσλαλῶν
  choice: обращаться
  rationale: Естественно обозначает речь, направленную к кому-либо или чему-либо, без добавления отсутствующей в самом глаголе идеи мольбы.
- source_word: ὑγείας
  choice: о здоровье
  rationale: Прямо передаёт предмет просьбы и поддерживает контраст между желаемым здоровьем и немощью того, кого призывают.
- source_word: τὸ ἀσθενές
  choice: немощное
  rationale: Субстантивированное прилагательное среднего рода сохраняет презрительно-парадоксальную характеристику без внесения существительного «идол».
- source_word: ἐπικαλεῖται
  choice: призывает на помощь
  rationale: В контексте молитвы выражает обращение за помощью яснее, чем одно «призывает», при этом не утверждает, что помощь действительно возможна.
theological_decisions:
- issue: Полемическое описание идола словами ἀψύχῳ и τὸ ἀσθενές
  choice: Сохранить описательные формы «безжизненному» и «немощное», не называя предмет прямо идолом.
  alternative: «безжизненному идолу» и «бессильного идола»
  rationale: Греческий текст намеренно пользуется субстантивированными определениями. Их сохранение передаёт риторическое презрение автора и не добавляет поясняющего существительного в основной текст.
- issue: Множественное число γάμων
  choice: Передать естественным русским единственным числом «браке», отметив формальную альтернативу в сноске.
  alternative: «браках» или «брачных делах»
  rationale: Множественное число может обозначать брачную сферу вообще. Русское «о своих браках» способно породить более узкое представление о нескольких последовательных браках, которого контекст не требует; сноска сохраняет прозрачность формы оригинала.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и ясной полемической силой. Синтаксис немного упорядочен: причастный оборот перенесён ближе к началу, а эллиптическое «о здоровье» раскрыто как «прося о здоровье». Формы среднего рода «безжизненному» и «немощное» намеренно сохраняют предметность и авторское уклонение от прямого называния идола.'
