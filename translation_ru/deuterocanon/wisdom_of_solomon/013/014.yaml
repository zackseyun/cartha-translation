translation_notes:
  register: Современный литературный русский язык с умеренно высоким, но общедоступным регистром. Повтор греческого καταχρίσας передан разными однокоренными по смыслу глаголами («обмазав», «замазав»), чтобы естественно различить окрашивание поверхности и сокрытие дефектов. Конечная запятая сохранена, поскольку стих синтаксически продолжается.
