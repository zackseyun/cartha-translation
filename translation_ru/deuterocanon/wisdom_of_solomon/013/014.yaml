    reason: cultural_note
lexical_decisions:
- source_word: ζώῳ τινὶ εὐτελεῖ
  choice: какому-нибудь невзрачному животному
  rationale: ζῷον означает «животное, живое существо», а εὐτελής указывает на незначительность, низкую ценность или заурядность. «Невзрачному» естественно передаёт пренебрежительный оттенок, не приписывая животному нравственной порочности.
- source_word: ὡμοίωσεν αὐτό
  choice: уподобил его
  rationale: Глагол ὁμοιόω означает «делать подобным, уподоблять»; формулировка сохраняет действие мастера, придающего изображению сходство с животным.
- source_word: καταχρίσας
  choice: обмазав / замазав
  rationale: Повторённое причастие обозначает нанесение вещества на поверхность. В первом случае «обмазав» описывает покрытие краской, во втором «замазав» естественно выражает сокрытие изъянов.
- source_word: μίλτῳ
  choice: красной охрой
  rationale: μίλτος — красная земля или минеральный красный пигмент; «красная охра» является понятным и точным современным соответствием.
- source_word: φύκει
  choice: красителем
  rationale: φῦκος может обозначать красноватый краситель или косметический пигмент, исторически связываемый также с морскими водорослями. Общее слово «краситель» сохраняет предметный смысл без ложной чрезмерной точности.
- source_word: ἐρυθῆνας χρῶαν αὐτοῦ
  choice: придав его поверхности красный цвет
  rationale: χρόα может означать цвет, наружный вид или поверхность. В контексте деревянного изваяния «поверхности» звучит естественно, а вся конструкция передаёт действие окрашивания в красный цвет.
- source_word: πᾶσαν κηλῖδα τὴν ἐν αὐτῷ
  choice: всякий изъян на нём
  rationale: κηλίς означает пятно, порок или изъян. Здесь речь идёт о видимом несовершенстве изделия, которое мастер скрывает покрытием; поэтому «изъян» точнее, чем буквальное «пятно».
