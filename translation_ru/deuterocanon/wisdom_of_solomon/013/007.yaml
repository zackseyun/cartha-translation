  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/007.yaml
  text: For while moving among his works[a], they examine them closely, and they are persuaded by what they see, because the things being seen are beautiful.
translation:
  language: ru
  text: Ведь, находясь среди Его творений, они тщательно исследуют их и убеждаются, видя, что всё видимое прекрасно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что всё видимое хорошо». Греческое слово καλά может означать как «прекрасно», так и «хорошо»; здесь основной текст подчёркивает красоту, воспринимаемую зрением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστρεφόμενοι
  choice: находясь среди
  rationale: Причастие передаёт пребывание и деятельность людей среди Божьих творений; этот вариант сохраняет пространственно-опытный оттенок и естественно звучит по-русски.
- source_word: διεραυνῶσιν
  choice: тщательно исследуют
  rationale: Глагол обозначает углублённое, пристальное исследование; наречие передаёт усилительное значение приставки.
- source_word: πείθονται
  choice: убеждаются
  rationale: Средне-пассивная форма здесь описывает убеждение, возникающее под воздействием зрительного восприятия.
- source_word: τῇ ὄψει
  choice: глядя на них
  rationale: Греческий дательный указывает на зрение как основание убеждения; деепричастный оборот естественно передаёт это по-русски, не сводя выражение лишь к внешнему облику.
- source_word: καλά
  choice: прекрасно
  rationale: В контексте зрительного восприятия на первом плане эстетический оттенок καλός, хотя слово также может означать «хороший» или «благой»; неоднозначность отмечена в сноске.
- source_word: τὰ βλεπόμενα
  choice: всё видимое
  rationale: Субстантивированное причастие обозначает совокупность наблюдаемых творений; собирательное русское выражение точно и естественно.
theological_decisions:
- issue: Референт αὐτοῦ
  choice: Его творений — речь о Боге, Создателе, упомянутом в окружающем рассуждении
  alternative: его творений — с формально неуточнённым личным референтом
  rationale: Контекст рассуждения ведёт от творений к их Создателю. Личное местоимение сохраняет этот референт, не добавляя к тексту особого конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, без архаизмов. Синтаксис сохраняет причинно-наблюдательную логику греческого текста, а неоднозначность καλά вынесена в сноску.
