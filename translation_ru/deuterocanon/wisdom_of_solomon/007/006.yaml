  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/006.yaml
  text: But there is one entrance into life for all[a], and an equal departure.
translation:
  language: ru
  text: Но у всех один вход в жизнь[a], и одинаковый исход.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но у всех один и тот же вход в жизнь и один и тот же выход». В греческом тексте «вход» и «исход» образуют уравновешенную метафору начала и конца человеческой жизни.'
    reason: Лексический вариант и пояснение образной пары.
lexical_decisions:
- source_word: μία
  choice: один
  rationale: Передаёт единственность и общность входа для всех, сохраняя краткость греческого выражения.
- source_word: πάντων
  choice: у всех
  rationale: 'Естественно по-русски выражает универсальность: всем людям свойствен один и тот же вход в жизнь.'
- source_word: εἴσοδος
  choice: вход
  rationale: Сохраняет пространственную метафору и образует точную смысловую пару со словом «исход».
- source_word: εἰς τὸν βίον
  choice: в жизнь
  rationale: Следует греческому тексту, не подменяя «жизнь» более истолковывающим словом «мир».
- source_word: ἔξοδος
  choice: исход
  rationale: Сохраняет метафору выхода и не делает подразумеваемую смерть неоправданно явной.
- source_word: ἴση
  choice: одинаковый
  rationale: В данном контексте естественно выражает равенство и общность человеческого конца; буквальное «равный» по-русски звучало бы менее ясно.
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкий контраст с предшествующим рассуждением о царском достоинстве.
theological_decisions:
- issue: Делать ли подразумеваемые рождение и смерть явными
  choice: Сохранить метафоры «вход в жизнь» и «исход»
  alternative: «У всех одно рождение и одинаковая смерть»
  rationale: Греческий текст употребляет парные метафоры εἴσοδος и ἔξοδος, а не прямые обозначения рождения и смерти; перевод сохраняет образность и не снимает заложенную в тексте недосказанность.
- issue: Как передать ἴση при описании исхода
  choice: «одинаковый исход»
  alternative: «равный исход» или «тот же исход»
  rationale: «Одинаковый» ясно передаёт общую для всех человеческую участь, не уточняя сверх текста характер этой общности.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественно-сдержанная фраза. Парность «вход — исход» сохраняет риторическое равновесие оригинала.
