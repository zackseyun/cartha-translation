base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/009.yaml
  text: Nor did I compare to her any precious stone[a], because all gold in her sight is a little sand[b], and silver will be regarded as clay before her.
translation:
  language: ru
  text: Я не сравнил с ней ни одного неоценимого камня[a], потому что перед ней всё золото — лишь немного песка[b], а серебро перед ней будет сочтено глиной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «драгоценного камня». Греческое выражение обозначает камень, ценность которого невозможно определить.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «немного песка»; смысл в том, что по сравнению с мудростью золото имеет ничтожную ценность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ ὡμοίωσα αὐτῇ
  choice: Не сравнил я с ней и
  rationale: ὁμοιόω означает уподоблять или сравнивать; дательный αὐτῇ передан сочетанием «с ней». Женское местоимение сохраняет олицетворение мудрости.
- source_word: λίθον ἀτίμητον
  choice: неоценимого камня
  rationale: В данном контексте ἀτίμητος означает «не имеющий цены, бесценный», а не «ничего не стоящий». «Неоценимый камень» передаёт чрезвычайную ценность и сохраняет образ камня.
- source_word: ὅτι ὁ πᾶς χρυσός
  choice: потому что ... всё золото
  rationale: 'ὅτι вводит основание сравнения, а ὁ πᾶς χρυσός имеет собирательное значение: всё золото без исключения.'
- source_word: ἐν ὄψει αὐτῆς
  choice: перед ней
  rationale: Передаёт пространственный образ присутствия, не сводя выражение только к отвлечённому «по сравнению с ней».
- source_word: ψάμμος ὀλίγη
  choice: лишь немного песка
  rationale: Сохраняет буквальный образ «немного песка»; частица «лишь» естественно выражает подразумеваемую ничтожность ценности золота.
- source_word: καὶ ὡς πηλὸς λογισθήσεται ἄργυρος
  choice: а серебро будет сочтено глиной
  rationale: Будущий страдательный залог λογισθήσεται передан формой «будет сочтено»; πηλός здесь естественно означает глину.
- source_word: ἐναντίον αὐτῆς
  choice: перед ней
  rationale: Сохраняет олицетворение мудрости и пространственно оформленное сравнение.
theological_decisions:
- issue: Женское олицетворение мудрости
  choice: Сохранить женское местоимение «ней»
  alternative: Повторить слово «мудрость» или передать её как безличное понятие
  rationale: Греческий текст использует формы женского рода, продолжая литературное олицетворение мудрости; перевод сохраняет его, не придавая ему дополнительных догматических значений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но ясным строем. Инверсия «Не сравнил я» поддерживает поэтический тон книги, не создавая архаичности. Параллельное «перед ней» сохраняет образность и олицетворение исходного текста.
