  choice: Обычные зачатие и внутриутробное формирование переданы без современной биологической конкретизации.
  alternative: Передать παγεὶς буквально как «сгустившись» либо прямо назвать половое соитие.
  rationale: Контекст подчёркивает, что говорящий разделяет обычное человеческое происхождение; перевод сохраняет этот смысл, древнюю телесную образность и сдержанный эвфемизм источника.
