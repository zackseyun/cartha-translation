lexical_decisions:
- source_word: δεκαμηνιαίῳ χρόνῳ
  choice: за десять месяцев
  rationale: Дательный оборот обозначает срок формирования. Краткое «за десять месяцев» естественно по-русски и сохраняет древний способ исчисления беременности.
- source_word: παγεὶς
  choice: я был образован
  rationale: Причастие от πήγνυμι может означать затвердевание, сгущение или формирование. «Был образован» ясно передаёт эмбриологический контекст, а альтернативный конкретный образ вынесен в сноску.
- source_word: ἐν αἵματι
  choice: в крови
  rationale: Сохраняется прямое значение ἐν и конкретная телесная образность греческого текста.
- source_word: ἐκ σπέρματος ἀνδρός
  choice: от семени мужчины
  rationale: Передаёт значение σπέρμα в контексте зачатия без излишне медицинского регистра.
- source_word: ἡδονῆς
  choice: наслаждения
  rationale: ἡδονή означает удовольствие или наслаждение; в данном контексте речь идёт о половом наслаждении, но греческая сдержанность сохранена.
- source_word: ὕπνῳ συνελθούσης
  choice: соединившегося со сном
  rationale: Формулировка близко сохраняет необычный и эвфемистический греческий оборот, не заменяя его прямым упоминанием полового акта.
