  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/028.yaml
  text: For God loves nothing except the one who dwells with wisdom[a].
translation:
  language: ru
  text: Ибо Бог не любит ничего, кроме того, кто живёт с мудростью[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с Мудростью». В этой главе мудрость ярко представлена как личность.'
    reason: Лексическая альтернатива и сохранение персонифицированного смысла.
lexical_decisions:
- source_word: οὐθὲν
  choice: ничего
  rationale: Средний род единственного числа передаёт абсолютное дополнение «ничего»; это сохраняет более широкую формулировку греческого текста, хотя исключение относится к человеку.
- source_word: ἀγαπᾷ
  choice: любит
  rationale: Прямое и естественное соответствие ἀγαπάω, сохраняющее богословскую весомость высказывания.
- source_word: εἰ μὴ
  choice: кроме
  rationale: В данном контексте оборот вводит исключение, а не условие.
- source_word: τὸν ... συνοικοῦντα
  choice: того, кто живёт с
  rationale: Субстантивированное причастие обозначает человека, постоянно пребывающего в тесной связи с мудростью; «живёт с» естественно передаёт образ совместной жизни.
- source_word: σοφίᾳ
  choice: мудростью
  rationale: Дательный падеж выражает совместность. Строчная буква сохраняет лексическое значение и не устраняет возможную персонификацию в контексте.
theological_decisions:
- issue: Следует ли писать «Мудрость» с прописной буквы как имя персонифицированного образа
  choice: мудростью
  alternative: Мудростью
  rationale: В ближайшем контексте мудрость ярко персонифицирована, однако греческое письмо не требует здесь однозначного решения; строчная буква сохраняет литературно-богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достойная и близкая к структуре греческого текста. «Живёт с» выбрано вместо более возвышенного «обитает с», поскольку естественнее передаёт συνοικέω и сохраняет образ совместной жизни.
