base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/015.yaml
  text: But may God grant me to speak with sound judgment and to think in a manner worthy of the things given[c][b][a], because he himself is both the guide of wisdom and the one who sets the wise right.
translation:
  language: ru
  text: Мне же да даст Бог говорить со здравым разумением[a] и достойно мыслить о дарованном[b], ибо Он Сам — руководитель мудрости и Тот, кто исправляет мудрых[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорить согласно разумению». Греческий оборот может означать речь, соответствующую здравому суждению или пониманию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о том, что дано» или «о данных дарах». В греческом не уточняется, что именно было даровано.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «исправитель мудрых» или «руководитель мудрых». Греческое слово обозначает того, кто исправляет, выправляет или направляет правильно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: да даст
  rationale: Оптатив выражает пожелание-молитву; конструкция «да даст» естественно и торжественно передаёт это значение по-русски.
- source_word: εἰπεῖν κατὰ γνώμην
  choice: говорить со здравым разумением
  rationale: Оборот означает речь, согласную со здравым суждением или пониманием; выбранная формулировка сохраняет обе смысловые стороны и звучит литературно.
- source_word: ἐνθυμηθῆναι
  choice: мыслить
  rationale: Глагол обозначает внутреннее обдумывание или размышление; «мыслить» кратко и естественно сочетается с наречием ἀξίως.
- source_word: ἀξίως
  choice: достойно
  rationale: Передаёт значение соответствия достоинству или значимости дарованного без лишнего смыслового уточнения.
- source_word: τῶν δεδομένων
  choice: о дарованном
  rationale: Субстантивированное причастие оставляет предмет дара неопределённым; единственное собирательное «дарованном» сохраняет эту широту.
- source_word: ὁδηγός
  choice: направляет
  rationale: Греческое существительное обозначает ведущего или проводника. Глагольная передача делает фразу естественной по-русски, сохраняя образ руководства.
- source_word: διορθωτής
  choice: наставляет ... на верный путь
  rationale: Слово обозначает того, кто выправляет, исправляет или направляет правильно. Формулировка сохраняет корректирующий оттенок без неестественного русского существительного «исправитель».
- source_word: τῶν σοφῶν
  choice: мудрых
  rationale: Субстантивированное прилагательное во множественном числе естественно передаётся русским «мудрых».
theological_decisions:
- issue: Референт и объём τῶν δεδομένων
  choice: собирательное и открытое «о дарованном»
  alternative: «о данных дарах» или «о том, что дано»
  rationale: Греческий текст не уточняет, что именно было дано. Перевод не сужает смысл до определённого дара, учения или содержания.
- issue: Отношение Бога к мудрости в τῆς σοφίας ὁδηγός
  choice: «направляет мудрость»
  alternative: «путеводитель мудрости» или «ведущий к мудрости»
  rationale: Родительный падеж допускает неодинаковое понимание связи. Основной текст следует наиболее прямой конструкции «руководитель мудрости», не превращая её без достаточных оснований в «ведущего людей к мудрости».
- issue: Смысл διορθωτής применительно к мудрым
  choice: Бог наставляет мудрых на верный путь
  alternative: Бог исправляет мудрых или руководит мудрыми
  rationale: 'Сохранён смысл выправления и правильного направления: даже мудрые зависят от Божьего руководства. При этом перевод не усиливает слово до карательного наказания.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной молитвенной конструкцией «да даст». Глагольный параллелизм в заключительной части выбран ради естественности и ясности; неопределённость «дарованного» и корректирующая роль Бога по отношению к мудрым сохранены.
