  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/012.yaml
  text: And I rejoiced in them all, because wisdom leads them; but I did not know that she is their mother.
translation:
  language: ru
  text: Я радовался всему этому, ибо мудрость ведёт всё это; но не знал, что она — источник всего этого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «происхождение (начало) всего этого». Греческое γένεσις может означать происхождение, возникновение или источник.'
    reason: Уточняет семантический диапазон γένεσις, не вводя невыраженный в оригинале образ «матери».
lexical_decisions:
- source_word: εὐφράνθην
  choice: я радовался
  rationale: 'Передаёт аорист пассивной по форме, но непереходный по значению: «возрадовался, испытал радость».'
- source_word: ἐπὶ πάντων
  choice: всему этому
  rationale: Контекстуально указывает на перечисленные ранее блага; русское «всему этому» звучит естественно и сохраняет собирательный смысл.
- source_word: ἡγεῖται
  choice: идёт впереди
  rationale: Сохраняет основной образ предводительства и формально допускает неоднозначность греческого местоимения αὐτῶν.
- source_word: γένεσιν
  choice: мать
  rationale: В данном олицетворённом контексте обозначает начало или породивший источник; «мать» естественно передаёт образ происхождения, отражённый и в консультационном английском тексте.
theological_decisions:
- issue: Олицетворение мудрости
  choice: местоимение «она» и слово «мать»
  alternative: «она — источник всего этого»
  rationale: Грамматический женский род и олицетворение сохранены; перевод не уточняет природу Мудрости сверх сказанного в стихе.
- issue: Референт αὐτῶν при ἡγεῖται
  choice: «идёт впереди него» с поясняющей сноской
  alternative: «ведёт всё это»
  rationale: Форма αὐτῶν допускает связь либо с совокупностью благ, либо с богатством из предыдущего стиха; двусмысленность не следует скрывать.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис близок к греческому, но не калькирован; подлинная неоднозначность местоименной связи отмечена в решениях, а смысл γένεσις раскрыт сноской.
