lexical_decisions:
- source_word: ἀπαύγασμα
  choice: сияние
  rationale: Слово может обозначать исходящее сияние или отражённый блеск. «Сияние» естественно по-русски и сохраняет образ света, не устраняя полностью его смысловую многозначность; альтернативное понимание отмечено в сноске.
- source_word: φωτὸς ἀϊδίου
  choice: вечного света
  rationale: Родительный падеж передан непосредственно; «вечный» точно и естественно выражает ἀΐδιος в возвышенном контексте.
- source_word: ἔσοπτρον
  choice: зеркало
  rationale: Прямой современный эквивалент греческого слова.
- source_word: ἀκηλίδωτον
  choice: незапятнанное
  rationale: Передаёт отсутствие пятна или скверны и естественно сочетается с образом зеркала.
- source_word: τῆς τοῦ θεοῦ ἐνεργείας
  choice: действия Божьего
  rationale: «Действие» передаёт деятельную силу и работу Бога, не привнося позднейшего специального богословского значения слова «энергия».
- source_word: εἰκών
  choice: образ
  rationale: Прямой и богословски содержательный эквивалент, сохраняющий образный ряд стиха.
- source_word: ἀγαθότητος
  choice: благости
  rationale: «Благость» сохраняет широкий смысл божественной доброты и возвышенный регистр исходного текста.
theological_decisions:
- issue: Олицетворение Премудрости в женском роде
  choice: Сохранено местоимение «она»
  alternative: Повторить «Премудрость» или использовать безличную перефразировку
  rationale: Женский род и личностное изображение Премудрости соответствуют греческому контексту; перевод сохраняет литературно-богословское напряжение, не представляя её отдельным божеством.
