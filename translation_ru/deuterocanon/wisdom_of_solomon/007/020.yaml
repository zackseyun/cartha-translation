lexical_decisions:
- source_word: φύσεις ζῴων
  choice: природные свойства животных
  rationale: Множественное φύσεις обозначает присущие животным природные свойства или особенности; перевод сохраняет естественно-научный оттенок и звучит по-русски естественнее буквального «природы животных».
- source_word: θυμοὺς θηρίων
  choice: нравы диких зверей
  rationale: θυμός здесь указывает на характерный нрав, темперамент или порывистость, а θηρίον — на дикого зверя; «нравы» сохраняет широту значения без излишней психологизации.
- source_word: πνευμάτων βίας
  choice: буйство ветров
  rationale: В перечне знаний о мире πνεύματα естественно понимать как ветры, а βίαι — как их бурные, неукротимые проявления. Выражение остаётся образным и передаёт силу явления.
- source_word: διαλογισμοὺς ἀνθρώπων
  choice: помыслы людей
  rationale: διαλογισμός охватывает мысли, размышления и рассуждения. «Помыслы» соответствует возвышенному регистру книги и обозначает внутренний ход человеческой мысли.
- source_word: διαφορὰς φυτῶν
  choice: различия между растениями
  rationale: διαφοράς означает различия или отличительные признаки; такой перевод не сужает смысл до ботанических разновидностей.
- source_word: δυνάμεις ῥιζῶν
  choice: силы корней
  rationale: δύναμις означает силу, способность или действенное свойство; буквальное «силы» сохраняет древнее представление о природной, в том числе возможной целебной, действенности корней, не добавляя её прямо в текст.
theological_decisions:
- issue: Неоднозначность πνευμάτων βίας
  choice: буйство ветров
  alternative: сила духов / неистовство духов
  rationale: πνεῦμα может означать как ветер, так и дух. Контекст перечисления познаваемых явлений сотворённого мира поддерживает значение «ветры», однако возможное значение «духи» сохранено в сноске, чтобы не устранять подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, но понятной лексикой. Синтаксис сохраняет форму продолжающегося перечня; начальная строчная буква уместна, поскольку стих является частью более длинного предложения.
