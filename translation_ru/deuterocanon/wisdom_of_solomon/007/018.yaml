lexical_decisions:
- source_word: ἀρχὴν
  choice: начало
  rationale: В сочетании с «концом» и «серединой» слово обозначает начало временного отрезка, а не философское первоначало.
- source_word: τέλος
  choice: конец
  rationale: В трёхчастной временной последовательности естественно означает конец.
- source_word: μεσότητα
  choice: середину
  rationale: Передаёт среднюю часть или середину в параллели с началом и концом.
- source_word: χρόνων
  choice: времён
  rationale: Сохраняет широкое значение периодов и протяжённостей времени без излишнего уточнения.
- source_word: τροπῶν
  choice: солнцеворотов
  rationale: В астрономическом контексте множественное τροπαί может обозначать поворотные точки годового движения солнца, то есть солнцестояния; «солнцевороты» сохраняет образ поворота и допускает пояснение.
- source_word: ἀλλαγὰς
  choice: смены
  rationale: Естественно передаёт изменения или чередования и позволяет отличить слово от следующего μεταβολάς.
- source_word: μεταβολὰς
  choice: перемены
  rationale: Передаёт близкое, но не полностью тождественное значение второго существительного, сохраняя лексическое варьирование оригинала.
- source_word: καιρῶν
  choice: времён
  rationale: Здесь слово может обозначать сезоны, сроки или установленные периоды; общее «времён» сохраняет широту значения и отличие от астрономических τροπαί.
