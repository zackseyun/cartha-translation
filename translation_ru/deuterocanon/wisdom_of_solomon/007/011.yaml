base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/011.yaml
  text: But all good things came to me together with her[a], and in her hands was wealth beyond counting[b];
translation:
  language: ru
  text: А вместе с нею[a] пришли ко мне и все блага, и в руках её — несметное богатство[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть вместе с Премудростью, которая в окружающем контексте представлена в образе женщины.
    reason: cross_reference
  - marker: b
    text: 'Или: «неисчислимое богатство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: пришли
  rationale: Аорист ἔρχομαι передан естественным русским глаголом движения; множественное число согласовано с подлежащим «все блага».
- source_word: τὰ ἀγαθὰ
  choice: блага
  rationale: '«Блага» сохраняет широкий смысл выражения: не только материальное имущество, но всё доброе и полезное.'
- source_word: ὁμοῦ πάντα
  choice: вместе ... все
  rationale: 'Так переданы и совокупность, и полнота: все блага пришли вместе с Премудростью.'
- source_word: μετ’ αὐτῆς
  choice: вместе с нею
  rationale: Форма «нею» естественна после составного предлога и сохраняет женский род местоимения, отсылающего к олицетворённой Премудрости.
- source_word: ἀναρίθμητος πλοῦτος
  choice: несметное богатство
  rationale: Устойчивое современное выражение точно передаёт буквальный смысл «богатство, не поддающееся счёту» и гиперболическую силу греческого сочетания.
- source_word: ἐν ταῖς χερσὶν αὐτῆς
  choice: в руках её
  rationale: Сохранён конкретный образ греческого текста, который одновременно подразумевает, что Премудрость обладает богатством и приносит его.
theological_decisions:
- issue: К кому относится местоимение αὐτῆς женского рода
  choice: К олицетворённой Премудрости
  alternative: Теоретически возможна иная антецедентная связь с существительным женского рода, но ближайший контекст её не поддерживает.
  rationale: В 7-й главе Премудрость изображена как женщина; женское местоимение сохраняет это литературно-богословское олицетворение без дополнительного истолкования в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Инверсия «в руках её» сохраняет образность и умеренную возвышенность, оставаясь понятной современному читателю.
