  source_fidelity: 'Текст точно передаёт греческую структуру и смысл: τὰ ἀγαθὰ ... πάντα — «все блага», ὁμοῦ μετ’ αὐτῆς — «вместе с нею», ἀναρίθμητος πλοῦτος — «несметное богатство», а образ ἐν ταῖς χερσὶν αὐτῆς сохранён как «в руках её». Союз «А» уместно передаёт δέ без излишнего смыслового усиления.'
