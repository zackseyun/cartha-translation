  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/024.yaml
  text: For wisdom is more mobile than any movement[b][a], and because of her purity she passes through and penetrates all things.
translation:
  language: ru
  text: Ибо мудрость подвижнее всякого движения[a] и благодаря своей чистоте проходит и проникает сквозь всё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деятельнее всякого движения». Греческое сравнительное прилагательное подчёркивает превосходящую способность мудрости к движению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης ... κινήσεως
  choice: всякого движения
  rationale: Передаёт всеохватность πάσης в сравнительной конструкции и сохраняет повтор корня движения.
- source_word: κινητικώτερον
  choice: подвижнее
  rationale: Сравнительная степень указывает на превосходящую способность к движению; «подвижнее» естественно передаёт её без добавления идеи нравственной или умственной активности.
- source_word: σοφία
  choice: мудрость
  rationale: Обычный и контекстуально центральный эквивалент; женский род русского слова естественно сохраняет олицетворение.
- source_word: διήκει
  choice: проходит
  rationale: Передаёт движение через что-либо и позволяет сохранить отличие от следующего глагола.
- source_word: χωρεῖ
  choice: проникает
  rationale: Передаёт продвижение внутрь и сквозь всё, сохраняя второй, усиливающий глагол греческого текста.
- source_word: διὰ πάντων
  choice: сквозь всё
  rationale: Сохраняет всеохватность выражения и естественно сочетается с обоими русскими глаголами.
- source_word: διὰ τὴν καθαρότητα
  choice: благодаря своей чистоте
  rationale: Передаёт причинное значение διά с винительным; возвратное «своей» ясно связывает чистоту с мудростью.
theological_decisions:
- issue: Олицетворение мудрости
  choice: Сохранить олицетворение посредством грамматически женского слова «мудрость», не вводя прописную букву.
  alternative: Писать «Мудрость» как имя или ослабить олицетворение более отвлечённой формулировкой.
  rationale: Греческая σοφία имеет женский род и в контексте олицетворяется, однако сам стих не требует представлять её отдельной божественной ипостасью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Корневой повтор «подвижнее… движения» намеренно сохраняет форму и смысл греческого выражения; два глагола движения переданы раздельно.
