  text: and I came to know both what is hidden and what is plain;[a]
translation:
  language: ru
  text: И я познал всё — и сокрытое, и явное.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И я узнал всё — и скрытое, и очевидное».'
    reason: Лексически возможная передача κρυπτὰ, ἐμφανῆ и ἔγνων.
lexical_decisions:
- source_word: ὅσα
  choice: всё
  rationale: Местоимение среднего рода множественного числа охватывает всё, что было познано; по-русски «всё» естественно и передаёт обобщающий смысл.
- source_word: τε
  choice: и… и…
  rationale: Парная конструкция естественно передаёт соотносительную силу τε при κρυπτὰ καὶ ἐμφανῆ.
- source_word: κρυπτὰ
  choice: сокрытое
  rationale: Передаёт то, что скрыто или недоступно явному наблюдению, не добавляя оттенка намеренно хранимой тайны.
- source_word: ἐμφανῆ
  choice: явное
  rationale: Сохраняет прямое противопоставление сокрытому и охватывает значения видимого, очевидного и открытого.
- source_word: ἔγνων
  choice: познал
  rationale: Аорист γινώσκω обозначает обретение знания; «познал» кратко выражает результат и допускает оттенок «пришёл к познанию».
