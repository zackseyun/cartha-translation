base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/001.yaml
  text: For I also am a mortal man[a], equal to all, and a descendant of the earth-born first-formed man[b]; and in my mother’s womb I was molded into flesh.
translation:
  language: ru
  text: Я тоже смертен, равен всем и являюсь потомком первозданного человека, произошедшего из земли[a]; во чреве моей матери я был сформирован как плоть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имеется в виду Адам — первый человек, созданный из земли.
    reason: cross_reference
  - marker: b
    text: 'Или: «я был образован во плоти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θνητός
  choice: смертен
  rationale: Передаёт общую для всех людей подверженность смерти; краткая предикативная форма естественна по-русски.
- source_word: ἴσος ἅπασιν
  choice: равен всем
  rationale: Сохраняет прямое значение равного положения и не сводит выражение лишь к сходству.
- source_word: γηγενοῦς
  choice: произошедшего из земли
  rationale: Передаёт буквальный образ происхождения от земли, оставаясь понятным современному читателю.
- source_word: ἀπόγονος
  choice: потомком
  rationale: Точно выражает происхождение от предка.
- source_word: πρωτοπλάστου
  choice: первозданного человека
  rationale: Сохраняет описательное обозначение первого сформированного человека, не подставляя в основной текст имя Адам.
- source_word: ἐγλύφην
  choice: был вылеплен
  rationale: Сохраняет яркий образ придания формы, заложенный в глаголе, и подходит к контексту внутриутробного формирования.
- source_word: σάρξ
  choice: в плоть
  rationale: Передаёт буквальное значение существительного и конструкцию результата формирования, не заменяя «плоть» более общим словом «тело».
theological_decisions:
- issue: Кого обозначает πρωτοπλάστου
  choice: Описательно передано как «первозданный человек», с указанием на Адама в сноске.
  alternative: Прямо назвать «Адамом» в основном тексте.
  rationale: Греческий текст употребляет не имя, а описательное обозначение; перевод сохраняет эту форму и не делает подразумеваемое имя частью основного текста.
- issue: Связь γηγενοῦς с πρωτοπλάστου
  choice: «первозданного человека, произошедшего из земли»
  alternative: «землерождённого первозданного»
  rationale: Выбранный вариант сохраняет земное происхождение первого человека, но избегает неестественного для современного русского языка сложного эпитета и возможного мифологического оттенка слова «землерождённый».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет последовательность греческого текста; образ «вылеплен в плоть» намеренно удерживает телесность и образ формирования, не сглаживая их до нейтрального «получил тело».
