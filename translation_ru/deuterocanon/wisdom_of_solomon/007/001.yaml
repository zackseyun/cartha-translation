    rationale: Греческое ἐν κοιλίᾳ μητρός в данном контексте означает «в утробе/чреве моей матери», а не просто «в материнской утробе» вообще.
  - severity: medium
    issue: «Был вылеплен в плоть» неестественно и синтаксически неясно по-русски.
    rationale: Сочетание «вылепить в плоть» не является нормативно-идиоматичным. «Был сформирован как плоть» естественнее и передаёт σάρξ как результат/характер формирования, не заменяя его словом «тело».
