  text: For he himself gave me unerring knowledge of the things that exist[a], to know the structure of the world and the activity of the elements[c][b],
translation:
  language: ru
  text: Ибо Сам Он дал мне истинное знание о том, что существует[a], чтобы знать устройство мира[b] и действие стихий[c].
  philosophy: optimal-equivalence
  footnotes:
