base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/023.yaml
  text: humane[a], steadfast, secure, free from care, all-powerful, all-seeing, and passing through all intelligent, pure[c][b], most subtle spirits.
translation:
  language: ru
  text: человеколюбивый[a], твёрдый, надёжный, безмятежный, всесильный[b], всевидящий и проходящий сквозь все разумные, чистые, тончайшие духи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благожелательный к людям».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всемогущий».'
    reason: lexical_alternative
  - marker: c
    text: Слова «проходящий сквозь все разумные, чистые, тончайшие духи» можно также понять как «пронизывающий все разумные, чистые, тончайшие духи».
    reason: alternative_reading
lexical_decisions:
- source_word: φιλάνθρωπον
  choice: человеколюбивый
  rationale: Передаёт любовь и благожелательность к людям; слово естественно для возвышенного библейского перечня и не сужает значение до одной лишь жалости.
- source_word: βέβαιον
  choice: твёрдый
  rationale: Обозначает устойчивость и непоколебимость; «твёрдый» сохраняет краткую форму последовательного перечня свойств.
- source_word: ἀσφαλές
  choice: надёжный
  rationale: Передаёт идею безопасности, верности и отсутствия риска; по-русски естественнее в характеристике духа, чем буквальное «безопасный».
- source_word: ἀμέριμνον
  choice: безмятежный
  rationale: Выражает отсутствие тревоги и беспокойства, не приобретая легкомысленного оттенка слова «беззаботный».
- source_word: παντοδύναμον
  choice: всесильный
  rationale: Прямо и компактно передаёт обладание всей силой, не усиливая выражение за счёт более традиционного богословского титула «всемогущий».
- source_word: πανεπίσκοπον
  choice: всевидящий
  rationale: Передаёт способность видеть и обозревать всё; это естественная и краткая русская форма для данного перечня.
- source_word: διὰ πάντων χωροῦν
  choice: проходящий сквозь все
  rationale: Сохраняет образ движения через названные далее духи и не устраняет возможность понимания как проникновения или пронизывания.
- source_word: πνευμάτων
  choice: духи
  rationale: В данном контексте речь идёт о разумных духовных сущностях или духах; «дыхания» здесь было бы чрезмерно буквальным.
- source_word: νοερῶν
  choice: разумные
  rationale: Передаёт связь с умом и пониманием ясным современным словом.
- source_word: καθαρῶν
  choice: чистые
  rationale: Прямой и стилистически уместный эквивалент в возвышенном описании.
- source_word: λεπτοτάτων
  choice: тончайшие
  rationale: Сохраняет превосходную степень и идею предельной тонкости; не сводит её к нравственной утончённости.
theological_decisions:
- issue: Передача παντοδύναμον традиционным богословским титулом
  choice: всесильный
  alternative: всемогущий
  rationale: «Всесильный» непосредственно передаёт составное греческое слово и в этом перечне свойств не навязывает более позднюю титульную окраску.
- issue: Синтаксическое и смысловое понимание διὰ πάντων χωροῦν πνευμάτων
  choice: проходящий сквозь все разумные, чистые, тончайшие духи
  alternative: пронизывающий все разумные, чистые, тончайшие духи
  rationale: Выбранный вариант сохраняет выраженный предлогом διά образ прохождения, а сноска отмечает допустимый оттенок всеохватного проникновения, не разрешая неоднозначность насильственно.
translation_notes:
  register: Современный литературный русский язык с достоинством возвышенного перечня. Сохранена краткая цепь определений, грамматически продолжающая описание духа Премудрости из предыдущего контекста; искусственное повторение подлежащего не добавлено.
