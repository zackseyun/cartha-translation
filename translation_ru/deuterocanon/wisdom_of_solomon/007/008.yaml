  text: I preferred her to scepters and thrones, and I considered wealth as nothing in comparison with her;
translation:
  language: ru
  text: Я предпочёл её скипетрам и престолам, а богатство счёл ничем в сравнении с ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέκρινα
  choice: предпочёл
  rationale: Передаёт осознанное предпочтение одного другому и сохраняет сравнительную силу греческого глагола.
- source_word: αὐτὴν
  choice: её
  rationale: Местоимение относится к персонифицированной Премудрости; женский род естественен и в греческом, и в русском языке.
- source_word: σκήπτρων
  choice: скипетрам
  rationale: Сохраняет конкретный образ царской власти, не заменяя его отвлечённым понятием.
- source_word: θρόνων
  choice: престолам
  rationale: Буквально передаёт образ верховной власти и поддерживает параллель со скипетрами.
- source_word: πλοῦτον
  choice: богатство
  rationale: Ясно и современно обозначает материальное достояние.
- source_word: οὐδὲν ἡγησάμην
  choice: счёл ничем
  rationale: Естественно передаёт оценочное суждение, согласно которому богатство не имеет ценности при таком сравнении.
- source_word: ἐν συγκρίσει αὐτῆς
  choice: в сравнении с ней
  rationale: Сохраняет явно выраженное в греческом основание сравнения.
theological_decisions:
- issue: Персонификация Премудрости
  choice: Сохранить личное местоимение женского рода «её/ней».
  alternative: Передать Премудрость безлично, как отвлечённое качество.
  rationale: Греческий текст представляет Премудрость в женском роде и в личностно окрашенном образе; русский язык позволяет сохранить это без внесения дополнительных доктринальных утверждений.
translation_notes:
