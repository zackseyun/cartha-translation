base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/007.yaml
  text: Therefore I prayed[a], and understanding was given to me; I called upon God[b], and a spirit of wisdom came to me.
translation:
  language: ru
  text: Поэтому я помолился — и мне был дарован разум; я воззвал[a] — и пришёл ко мне дух мудрости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воззвал к Богу», «призвал». В греческом тексте объект действия прямо не назван.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Дух мудрости». Греческое выражение допускает как более общее, так и более определённое богословское понимание; основной текст не превращает его в формальный титул.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно передаёт причинно-следственную связь с предшествующим контекстом.
- source_word: ηὐξάμην
  choice: я помолился
  rationale: Прямо и естественно передаёт аорист среднего залога εὔχομαι в значении молитвы.
- source_word: φρόνησις
  choice: разум
  rationale: Передаёт способность к здравому, осмысленному суждению и сохраняет различие с σοφία («мудрость») во второй части стиха.
- source_word: ἐδόθη μοι
  choice: мне был дарован
  rationale: Пассивная конструкция подчёркивает, что разум был получен как дар, а не достигнут собственными силами.
- source_word: ἐπεκαλεσάμην
  choice: я воззвал
  rationale: Передаёт молитвенное призывание, не добавляя отсутствующий в греческом тексте объект.
- source_word: ἦλθέν μοι
  choice: пришёл ко мне
  rationale: Близко передаёт глагол движения с дательным падежом без усиления смысла до «сошёл на меня».
- source_word: πνεῦμα σοφίας
  choice: дух мудрости
  rationale: Сохраняет духовно-богословскую открытость выражения и не сводит его к одной лишь психологической склонности.
theological_decisions:
- issue: Следует ли понимать πνεῦμα σοφίας как личностный Дух или как дарованное расположение к мудрости
  choice: дух мудрости
  alternative: Дух мудрости; мудрый дух; расположение к мудрости
  rationale: Строчная буква не превращает выражение в формальный титул Святого Духа, но и не устраняет возможный духовно-богословский смысл.
- issue: Следует ли прямо называть Бога объектом глагола ἐπεκαλεσάμην
  choice: я воззвал
  alternative: я воззвал к Богу; я призвал Бога
  rationale: В контексте подразумевается молитвенное обращение к Богу, однако объект в греческом тексте прямо не назван; основной текст сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм двух частей сохранён; тире подчёркивает связь между молитвой и даром, воззванием и приходом духа мудрости.
