  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/030.yaml
  text: For this is succeeded by night[b][a], but evil does not prevail against wisdom.
translation:
  language: ru
  text: Ведь вслед за этим приходит ночь[a], но зло не одолевает мудрости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь вслед за светом приходит ночь»; в греческом тексте стоит указательное местоимение «это», отсылающее к свету, упомянутому в предыдущем стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но зло не может противостоять мудрости».'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: этим
  rationale: Указательное местоимение оставлено нерасшифрованным, как в греческом тексте; оно отсылает к свету, упомянутому в предыдущем стихе.
- source_word: διαδέχεται
  choice: вслед за … приходит
  rationale: 'Оборот естественно передаёт последовательность и смену: ночь приходит после того, на что указывает τοῦτο.'
- source_word: νύξ
  choice: ночь
  rationale: Прямое значение слова; в контексте ночь противопоставлена свету предыдущего стиха.
- source_word: σοφίας
  choice: мудрости
  rationale: Устоявшийся и контекстуально точный эквивалент; зависимость от ἀντισχύει передана русским родительным падежом при отрицании.
- source_word: οὐκ ἀντισχύει
  choice: не одолевает
  rationale: Передаёт образ противоборства и отсутствие победы над мудростью, не усиливая высказывание модальным «не может» в основном тексте.
- source_word: κακία
  choice: зло
  rationale: Широкий естественный эквивалент, охватывающий нравственное зло без неоправданного сужения до злобы или порочности.
theological_decisions:
- issue: Неявный референт τοῦτο
  choice: Сохранить указание «этим», не заменяя его словом «светом».
  alternative: Ведь вслед за светом приходит ночь.
  rationale: В греческом стоит местоимение, а не повтор существительного «свет»; неявная отсылка сохраняет связь с предыдущим стихом и исходную меру определённости.
- issue: Смысл ἀντισχύει в противопоставлении зла и мудрости
  choice: но зло не одолевает мудрости
  alternative: но зло не может противостоять мудрости
  rationale: Основной вариант сохраняет образ состязания и форму утверждения без добавления явно выраженной модальности невозможности.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Оборот «вслед за этим приходит ночь» естественно передаёт греческую последовательность и сохраняет неявную отсылку; «не одолевает мудрости» удерживает образ противоборства.
