  text: And I too, when I was born, drew in the common air, and fell upon the earth that suffers alike with all; and my first voice was the same as everyone's, as I cried.
translation:
  language: ru
  text: И я, родившись, вдохнул общий для всех воздух[a] и упал на землю, разделяющую общую участь[b]; первым же моим голосом был плач, как у всех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздух, которым дышат все». Греческое выражение подчёркивает, что говорящий вступил в ту же человеческую жизнь, что и остальные.'
    reason: lexical_alternative
  - marker: b
    text: Греческое определение может также означать «испытывающую то же», «подверженную тем же страданиям» или «имеющую ту же участь».
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: родившись
  rationale: В контексте появления младенца на свет причастие естественно передаётся как «родившись», сохраняя временное значение.
- source_word: ἔσπασα
  choice: вдохнул
  rationale: С прямым дополнением «воздух» глагол обозначает первый вдох; «вдохнул» конкретно и естественно передаёт образ.
- source_word: τὸν κοινὸν ἀέρα
  choice: общий для всех воздух
  rationale: κοινός означает «общий, разделяемый всеми»; формулировка подчёркивает одинаковые для всех условия человеческой жизни.
- source_word: ἐπὶ τὴν ὁμοιοπαθῆ ... γῆν
  choice: на землю, подверженную тем же страданиям
  rationale: ὁμοιοπαθής указывает на одинаковую подверженность переживаниям или страданиям. Перевод сохраняет необычное определение земли и не сводит его просто к слову «та же».
- source_word: κατέπεσον
  choice: упал
  rationale: Глагол буквально означает падение вниз или на что-либо; здесь сохранён телесный образ рождения.
- source_word: πρώτην φωνὴν τὴν ὁμοίαν πᾶσιν ἶσα κλαίων
  choice: и первым моим голосом, как у всех, был плач
  rationale: Фраза по-русски естественно объединяет «первый голос» и причастие «плача», сохраняя главное ударение на том, что первый звук говорящего ничем не отличался от плача остальных младенцев.
theological_decisions:
- issue: Антропологический акцент стиха
  choice: Подчеркнуть полную общность говорящего со всеми людьми в рождении, телесности и уязвимости
  alternative: Сгладить повторяющиеся указания на общность или придать рождению царственный, возвышенный оттенок
  rationale: Греческий текст последовательно подчёркивает общность словами κοινόν, ὁμοιοπαθῆ и ὁμοίαν πᾶσιν; перевод сохраняет этот риторический акцент, не вводя позднейших доктринальных выводов.
- issue: Значение ὁμοιοπαθής при слове «земля»
  choice: «подверженную тем же страданиям»
  alternative: «испытывающую то же», «одинаковой природы» или просто «ту же землю»
  rationale: Выбранный вариант сохраняет возможный оттенок страдания и уязвимости, но сноска отмечает более широкое значение одинаковой участи и переживаний.
