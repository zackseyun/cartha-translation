lexical_decisions:
- source_word: ἐν σπαργάνοις
  choice: в пелёнках
  rationale: σπάργανα обозначает пелены или полосы ткани, которыми оборачивали младенца. «В пелёнках» — естественное и понятное современному русскому читателю выражение, сохраняющее конкретный образ младенчества.
- source_word: ἀνετράφην
  choice: меня растили
  rationale: Пассивный аорист от ἀνατρέφω передаёт смысл вскармливания и выращивания ребёнка. Безличная конструкция «меня растили» естественна по-русски и ясно подчёркивает зависимость младенца от других.
- source_word: ἐν φροντίσιν
  choice: в заботах
  rationale: φροντίς может означать заботу, попечение, хлопоты или тревогу. «В заботах» кратко воспроизводит греческую конструкцию и сохраняет возможность понимать выражение как заботливое попечение о младенце либо как сопряжённые с ним хлопоты и тревоги.
theological_decisions:
- issue: Смысл φροντίσιν применительно к младенчеству
  choice: в заботах
  alternative: в хлопотах; среди тревог; окружённый попечением
  rationale: Стих подчёркивает обычность и зависимость человеческого младенчества говорящего. Выражение «в заботах» не сводит смысл исключительно к ласковому уходу или исключительно к тревогам, сохраняя многозначность греческого слова.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и dignified, с сохранением параллелизма двух предложных оборотов и смысловой неоднозначности φροντίσιν.
