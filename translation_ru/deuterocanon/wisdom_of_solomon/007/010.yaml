  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/010.yaml
  text: I loved her more than health and beauty[a], and I chose to have her rather than light, because the radiance that comes from her never sleeps.
translation:
  language: ru
  text: Я полюбил её больше, чем здоровье и красоту, и предпочёл иметь её вместо света, потому что исходящее от неё сияние не угасает.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сияние от неё неусыпно»; то есть оно светит непрестанно.'
    reason: Сохраняет буквальный образ ἀκοίμητον и поясняет его применение к сиянию.
lexical_decisions:
- source_word: ὑπὲρ ὑγίειαν καὶ εὐμορφίαν
  choice: больше здоровья и красоты
  rationale: ὑπέρ имеет здесь сравнительное значение и выражает предпочтение; сочетание прямо и естественно передаёт превосходящую ценность мудрости.
- source_word: ἠγάπησα αὐτήν
  choice: Я полюбил её
  rationale: Форма женского рода сохраняет олицетворение мудрости, заданное греческим текстом и контекстом.
- source_word: προειλόμην αὐτὴν ἀντὶ φωτὸς ἔχειν
  choice: предпочёл обладать ею, а не светом
  rationale: προειλόμην обозначает осознанный выбор или предпочтение, а ἀντί — выбор одного вместо другого. «Обладать ею» естественно передаёт ἔχειν в данном возвышенном контексте.
- source_word: ἀκοίμητον
  choice: не угасает
  rationale: Буквально прилагательное означает «неусыпное, не знающее сна». Применительно к сиянию русское «не угасает» естественно выражает непрерывность света, а буквальный образ отмечен в сноске.
- source_word: τὸ ἐκ ταύτης φέγγος
  choice: исходящее от неё сияние
  rationale: φέγγος — «сияние, свет, блеск»; причастная конструкция точно и по-русски естественно передаёт ἐκ ταύτης, не повторяя ранее упомянутый «свет».
theological_decisions:
- issue: Олицетворение мудрости в женском роде
  choice: Сохранить местоимение «её»
  alternative: Передать мудрость безлично или местоимением среднего рода
  rationale: Греческий текст последовательно представляет мудрость в женском роде; русский род существительного «мудрость» позволяет без натяжки сохранить этот поэтический образ.
- issue: Образ неусыпного сияния
  choice: 'Основной текст: «сияние не угасает»; буквальный образ — в сноске'
  alternative: «сияние не спит» или «сияние неусыпно»
  rationale: Греческая метафора сохранена как значимая альтернатива, однако буквальное «сияние не спит» менее естественно в современном русском. «Не угасает» передаёт смысл непрекращающегося света без дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис близок к греческому, но естественен для обычного читателя; олицетворение мудрости сохранено.
