base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/025.yaml
  text: For she is a breath of the power of God[a], and a pure emanation of the glory of the Almighty[b]; therefore nothing defiled enters into her.
translation:
  language: ru
  text: Ибо она — дыхание силы Божьей[a] и чистое истечение славы Вседержителя[b]; поэтому ничто осквернённое в неё не проникает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испарение» либо «пар». Греч. ἀτμίς может обозначать дыхание, выдыхание или пар, поднимающийся от источника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «незамутнённое истечение»; εἰλικρινής может означать чистое, ясное или несмешанное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτμὶς
  choice: дыхание
  rationale: Слово обозначает дыхание, испарение или пар. «Дыхание» естественно по-русски передаёт образ исходящего от источника и не сводит его к физическому явлению; возможный образ пара отмечен в сноске.
- source_word: δυνάμεως
  choice: силы
  rationale: «Сила» точно и естественно передаёт значение существительного в родительном падеже при образе дыхания.
- source_word: ἀπόρροια
  choice: истечение
  rationale: Слово изображает нечто исходящее или текущее из источника. «Истечение» сохраняет выразительность и метафизическую напряжённость образа без позднейшего догматического уточнения.
- source_word: εἰλικρινής
  choice: чистое
  rationale: В данном контексте слово означает чистое, несмешанное, незамутнённое; «чистое» также поддерживает связь со следующим утверждением об осквернении.
- source_word: παντοκράτορος
  choice: Вседержителя
  rationale: Традиционное и понятное русское наименование Бога, передающее всеобъемлющее владычество παντοκράτωρ.
- source_word: μεμιαμμένον
  choice: осквернённое
  rationale: Причастие совершенного вида указывает на состояние загрязнённости или ритуально-нравственной нечистоты; «осквернённое» сохраняет широту значения.
- source_word: παρεμπίπτει
  choice: проникает
  rationale: Глагол буквально выражает попадание внутрь или вторжение. «Проникает» естественно передаёт невозможность доступа чего-либо осквернённого к Премудрости.
theological_decisions:
- issue: Женская персонификация Премудрости
  choice: Сохранено местоимение женского рода «она» и «в неё»
  alternative: Повторять «Премудрость» либо использовать обезличенную конструкцию
  rationale: Греческий текст грамматически и литературно продолжает персонификацию Премудрости; женский род сохраняет этот образ, не добавляя утверждений сверх текста.
- issue: Отношение Премудрости к Богу в образах происхождения
  choice: Образы прямо переданы как «дыхание силы Божьей» и «чистое истечение славы Вседержителя»
  alternative: Ослабить образ производности пересказом либо придать ему позднейшую техническую догматическую формулировку
  rationale: Греческий текст использует сильные образы исходящего от источника, но сам не систематизирует их. Перевод сохраняет эту богословскую напряжённость и подлинную образность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохранён близким к греческому, но естественным; «Божьей» выбрано как современная форма, а «Вседержитель» — как устоявшийся высокий титул.
