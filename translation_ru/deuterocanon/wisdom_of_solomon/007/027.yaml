base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/027.yaml
  text: Though she is one[a], she can do all things, and while remaining in herself she renews all things; and passing into holy souls from generation to generation, she makes them friends of God and prophets[b];
translation:
  language: ru
  text: Хотя она едина, она всё может и, пребывая сама в себе, всё обновляет[a]; входя в святые души из поколения в поколение[b], она делает их друзьями Бога и пророками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё делает новым». Греческий глагол может означать как обновление, так и приведение в новое состояние.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «переходя в святые души». Причастие описывает движение Премудрости в святые души на протяжении сменяющихся поколений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μία δὲ οὖσα
  choice: Оставаясь единой
  rationale: 'Передаёт уступительно-сопоставительный смысл: Премудрость едина, однако способна на всё. «Единой» сохраняет значение единства без добавочного оттенка одиночества.'
- source_word: πάντα δύναται
  choice: она всё может
  rationale: Кратко и естественно выражает всеобъемлющую способность, сохраняя широту πάντα.
- source_word: μένουσα ἐν αὐτῇ
  choice: пребывая сама в себе
  rationale: Возвратное понимание αὐτῇ соответствует олицетворённой Премудрости и сохраняет напряжение между её неизменным пребыванием и действием во всём.
- source_word: τὰ πάντα καινίζει
  choice: всё обновляет
  rationale: Глагол καινίζει может означать обновление или приведение в новое состояние; основной вариант естественен для современного русского языка.
- source_word: κατὰ γενεὰς
  choice: из поколения в поколение
  rationale: Идиоматично передаёт последовательное действие на протяжении сменяющихся поколений.
- source_word: εἰς ψυχὰς ὁσίας μεταβαίνουσα
  choice: переходя ... в святые души
  rationale: Сохраняет динамику μεταβαίνουσα и прямое значение ψυχὰς, не сводя «души» к более общему «людям».
- source_word: φίλους θεοῦ
  choice: друзьями Бога
  rationale: Прямо передаёт отношение, выраженное родительным падежом θεοῦ.
- source_word: προφήτας
  choice: пророками
  rationale: Стандартное и контекстуально точное соответствие.
- source_word: κατασκευάζει
  choice: делает их
  rationale: В данном сочетании речь идёт о том, что святые души становятся друзьями Бога и пророками; «делает их» ясно передаёт этот результат и естественно связывает оба именных сказуемых.
theological_decisions:
- issue: Олицетворённая Премудрость как субъект женского рода
  choice: Сохранить местоимение «она» и формы женского рода
  alternative: Повторить слово «Премудрость» либо использовать безличную конструкцию
  rationale: Греческая грамматика последовательно представляет Премудрость как олицетворённый субъект женского рода; перевод сохраняет литературную и богословскую напряжённость, не определяя её природу сверх сказанного текстом.
- issue: Значение выражения «святые души»
  choice: Сохранить «святые души»
  alternative: Передать как «святых людей»
  rationale: ψυχὰς прямо означает «души»; более общее «людей» сгладило бы антропологический язык источника.
- issue: Результат действия κατασκευάζει
  choice: «делает их друзьями Бога и пророками»
  alternative: «приготовляет друзей Бога и пророков»
  rationale: Контекст естественно указывает, что именно святые души становятся друзьями Бога и пророками. Местоимение «их» проясняет синтаксическую связь, не добавляя нового участника или доктринального вывода.
translation_notes:
  register: Современный литературный русский язык с достоинством сапиенциальной речи. Синтаксис сохраняет движение длинной греческой фразы, но остаётся понятным обычному читателю; ключевые повторы «всё» и образ «святых душ» удержаны.
