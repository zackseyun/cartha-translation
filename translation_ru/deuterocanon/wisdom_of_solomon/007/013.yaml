  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/013.yaml
  text: And I learned without deceit[a], and I share without envy; I do not hide her wealth.
translation:
  language: ru
  text: Без лукавства я научился и без зависти делюсь[a]; её богатство я не скрываю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «щедро, не скупясь».'
    reason: Греческое ἀφθόνως буквально указывает на отсутствие зависти или нежелания делиться, а в данном контексте также выражает щедрость.
lexical_decisions:
- source_word: ἀδόλως
  choice: без лукавства
  rationale: Передаёт отсутствие обмана и хитрости, сохраняя нравственный оттенок греческого наречия и не сводя его к общему «искренне».
- source_word: ἔμαθον
  choice: я научился
  rationale: Прямо передаёт аорист μανθάνω и сохраняет повествование от первого лица.
- source_word: ἀφθόνως
  choice: без зависти
  rationale: Буквально выражает отсутствие зависти или нежелания делиться; в контексте подразумевает щедрую передачу полученного знания.
- source_word: μεταδίδωμι
  choice: делюсь
  rationale: Естественно передаёт значение «давать другим долю, сообщать»; подразумеваемый предмет — мудрость и её богатство.
- source_word: πλοῦτον
  choice: богатства
  rationale: Форма родительного падежа после отрицания передаёт единственное число πλοῦτον — «богатство» — и сохраняет метафору изобилия мудрости.
- source_word: αὐτῆς
  choice: её
  rationale: Относится к олицетворённой Премудрости и сохраняет женский личный образ греческого текста.
- source_word: ἀποκρύπτομαι
  choice: не скрываю
  rationale: Форма среднего залога употреблена здесь в активном смысле; выбран краткий и современный русский эквивалент.
theological_decisions:
- issue: Олицетворение мудрости в местоимении αὐτῆς
  choice: 'Сохранить личное местоимение женского рода: «богатства её»'
  alternative: «её богатства» с возможным менее явным олицетворением или безличная передача «богатства мудрости»
  rationale: Контекст представляет Премудрость как женский личный образ. Такая передача отражает грамматику и литературное богословие текста, не отождествляя этот образ с какой-либо позднейшей доктринальной концепцией.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Инверсия «богатства её я не скрываю» сохраняет олицетворение Премудрости и позволяет ясно передать единственное число слова «богатство» при естественном родительном падеже после отрицания.
