  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/016.yaml
  text: For in his hand are both we and our words, and all understanding and knowledge of crafts.
translation:
  language: ru
  text: Ведь в его руке и мы, и наши слова, всё разумение[a] и знание ремёсел[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё благоразумие»; греческое слово может означать рассудительность или практическую мудрость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «знание искусных занятий», «знание мастерства»; речь идёт о знании, связанном с умелым практическим трудом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ... χειρὶ αὐτοῦ
  choice: в его руке
  rationale: Сохраняет библейский образ власти, владения и зависимости, не заменяя его истолкованием вроде «в его власти».
- source_word: ἡμεῖς
  choice: мы
  rationale: Передаёт явно выраженное греческое местоимение и сохраняет параллель «мы — наши слова».
- source_word: οἱ λόγοι ἡμῶν
  choice: наши слова
  rationale: Естественно и достаточно широко передаёт λόγοι как человеческую речь или словесное выражение.
- source_word: πᾶσά τε φρόνησις
  choice: всё разумение
  rationale: φρόνησις обозначает разумение, рассудительность или практическую мудрость. «Разумение» сохраняет широту значения, а форма «всё разумение» естественно включается в перечисление.
- source_word: ἐργατειῶν ἐπιστήμη
  choice: знание ремёсел
  rationale: Сочетание обозначает знание, связанное с практической, умелой деятельностью; «ремёсла» передают конкретный характер такого труда, а «знание» прямо соответствует ἐπιστήμη.
theological_decisions:
- issue: К кому относится αὐτοῦ
  choice: его — то есть Бога, без вставки имени в основной текст
  alternative: в руке Бога
  rationale: Контекст указывает на Бога, однако местоименная форма оригинала сохранена, чтобы не делать неявное явным непосредственно в переводе.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет лаконичную структуру и образность греческого текста. Местоимение «его» написано со строчной буквы как обычная грамматическая форма, без добавления конфессионально обусловленной графической маркировки.
