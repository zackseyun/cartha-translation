base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/014.yaml
  text: For it is an unfailing treasure for men; those who have made use of it gained friendship with God, having been commended through the gifts that come from instruction.
translation:
  language: ru
  text: 'Ведь это — неистощимое сокровище для людей: те, кто им воспользовался, обрели дружбу с Богом, получив признание благодаря дарам наставления.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεκλιπής
  choice: неистощимое
  rationale: Передаёт значение сокровища, которое не иссякает и не оскудевает.
- source_word: θησαυρός
  choice: сокровище
  rationale: Прямое и естественное соответствие греческому существительному.
- source_word: οἱ χρησάμενοι
  choice: те, кто пользуется ею
  rationale: Передаёт практическое обращение с мудростью; настоящее время по-русски естественно выражает общий принцип, заключённый в аористе.
- source_word: ἐστείλαντο φιλίαν
  choice: приобретают дружбу
  rationale: Редкое сочетание означает обретение или приобретение дружбы; формулировка сохраняет активный оттенок выражения.
- source_word: παιδεία
  choice: наставление
  rationale: В данном контексте обозначает формирующее обучение и воспитание; «наставление» звучит естественно и не сужает смысл до наказания или дисциплины.
- source_word: συσταθέντες
  choice: снискав одобрение
  rationale: Передаёт значение быть рекомендованными, засвидетельствованными с похвалой или признанными достойными.
theological_decisions:
- issue: Связь пользования мудростью с дружбой с Богом
  choice: приобретают дружбу с Богом
  alternative: становятся друзьями Бога
  rationale: Сохранена причинно-смысловая напряжённость греческого текста без добавления конфессионального объяснения механизма этой дружбы.
- issue: К чему относится местоимение ὅν
  choice: к сокровищу, то есть к мудрости
  alternative: явно повторить «это сокровище»
  rationale: В русском тексте употреблено «ею», поскольку в контексте главы сокровищем названа мудрость; явное повторение сделало бы фразу тяжеловесной.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Синтаксис сохраняет две связанные части греческого высказывания; богословская причинность не ослаблена и не расширена.
