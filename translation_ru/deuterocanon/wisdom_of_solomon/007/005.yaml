lexical_decisions:
- source_word: οὐδεὶς … βασιλέων
  choice: ни у одного царя
  rationale: 'Греческое сочетание выражает всеобщее отрицание внутри группы: ни один из царей. Русская конструкция естественно согласуется с оборотом «не было».'
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующей мыслью естественнее для современного русского текста, чем более книжное «ибо».
- source_word: ἑτέραν
  choice: иного
  rationale: Указывает на иное, отличное начало; слово «иного» сохраняет сопоставительный смысл и достойный литературный регистр.
- source_word: ἔσχεν
  choice: не было
  rationale: Греческое «имел» в русском идиоматично передано конструкцией обладания «ни у одного… не было».
- source_word: γενέσεως
  choice: рождения
  rationale: В ближайшем контексте речь идёт об общем для всех людей появлении на свет. При этом более широкий смысл «происхождение, возникновение» сохранён в сноске.
- source_word: ἀρχήν
  choice: начала
  rationale: Прямо передаёт значение исходной точки и сохраняет формулировку греческого текста, не сводя её лишь к обстоятельствам родов.
theological_decisions:
- issue: Равенство царей и прочих людей по человеческому происхождению
  choice: Царь не имеет иного начала рождения, чем другие люди.
  alternative: Ни у одного царя не было иного начала существования.
  rationale: Перевод сохраняет контекстуальное утверждение об общей человеческой участи, не расширяя его до отдельного доктринального тезиса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Ведь» ясно передаёт пояснение, а синтаксис остаётся естественным и доступным.
