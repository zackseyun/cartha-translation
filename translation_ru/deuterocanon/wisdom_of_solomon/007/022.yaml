base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/022.yaml
  text: For wisdom[a], the craftswoman of all things, taught me. For in her is an intelligent, holy, unique, manifold, subtle, agile, clear, undefiled, distinct[b], unharmed, loving-the-good, keen, unhindered, beneficent spirit,
translation:
  language: ru
  text: Ибо мудрость, искусница всего, научила меня. Ведь в ней пребывает дух разумный, святой, уникальный[a], многообразный, тонкий, подвижный, ясный, незапятнанный, отчётливый, невредимый[b], любящий добро, проницательный, беспрепятственный, благотворный,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «единородный», «единственный в своём роде». Здесь греческое μονογενές, вероятнее всего, означает уникальность, а не происхождение через рождение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «безвредный», то есть не причиняющий вреда. Греческое слово может обозначать как того, кто не затронут вредом, так и того, кто не наносит вреда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεχνῖτις
  choice: искусница
  rationale: Существительное женского рода обозначает искусного мастера и сохраняет женскую персонификацию Премудрости; «искусница всего» естественно передаёт πάντων τεχνῖτις.
- source_word: σοφία
  choice: Премудрость
  rationale: Традиционное и понятное русское обозначение персонифицированной божественной Мудрости; прописная буква подчёркивает персонификацию, не превращая её в отдельное имя собственное.
- source_word: πνεῦμα νοερόν
  choice: дух разумный
  rationale: πνεῦμα здесь означает дух, а νοερόν — способность разуметь; сочетание сохраняет порядок и возвышенный регистр греческого перечня.
- source_word: μονογενές
  choice: единственный
  rationale: В данном нефилиальном контексте слово естественнее понимать как «единственный в своём роде, уникальный», не внося сюда смысл рождения; традиционный вариант указан в сноске.
- source_word: πολυμερές
  choice: многообразный
  rationale: Передаёт наличие многих сторон или проявлений без тяжеловесного буквального «многочастный».
- source_word: λεπτόν
  choice: тонкий
  rationale: Сохраняет образ тонкости, утончённости и способности проникать, не сводя качество к хрупкости.
- source_word: εὐκίνητον
  choice: подвижный
  rationale: Обозначает лёгкость движения; это естественный русский эквивалент в перечне качеств духа.
- source_word: τρανόν
  choice: ясный
  rationale: Передаёт ясность и очевидность; близкое σαφές намеренно переведено иначе, чтобы не устранить два отдельных определения.
- source_word: ἀμόλυντον
  choice: незапятнанный
  rationale: Сохраняет значение отсутствия осквернения или загрязнения и его нравственный оттенок.
- source_word: σαφές
  choice: отчётливый
  rationale: Передаёт определённость и различимость, сохраняя смысловое соседство, но не полное словесное совпадение с τρανόν — «ясный».
- source_word: ἀπήμαντον
  choice: невредимый
  rationale: Сохраняет возможный пассивный смысл — не затронутый вредом; активное значение «не причиняющий вреда» отмечено в сноске.
- source_word: φιλάγαθον
  choice: любящий добро
  rationale: Прямо передаёт составное значение прилагательного и звучит ясно для современного читателя.
- source_word: ὀξύ
  choice: проницательный
  rationale: В описании разумного духа передаёт остроту восприятия лучше буквального «острый».
- source_word: ἀκώλυτον
  choice: неудержимый
  rationale: Передаёт то, чему невозможно воспрепятствовать, и звучит естественнее буквального «беспрепятственный».
- source_word: εὐεργετικόν
  choice: благотворный
  rationale: Передаёт способность творить добро и приносить пользу в краткой форме, соответствующей перечню.
theological_decisions:
- issue: Значение μονογενές в описании духа Премудрости
  choice: единственный
  alternative: единородный; единственный в своём роде
  rationale: Слово относится к πνεῦμα внутри персонифицированной Премудрости, а не описывает сыновнее отношение или рождение. Поэтому основной текст сохраняет значение уникальности, а богословски значимый традиционный вариант оставлен в сноске.
- issue: Направленность значения ἀπήμαντον
  choice: невредимый
  alternative: безвредный, не причиняющий вреда
  rationale: Греческое слово допускает как пассивный смысл свободы от вреда, так и активный смысл непричинения вреда. Основной текст следует пассивному оттенку, не устраняя альтернативу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Женская персонификация сохранена сочетанием «Премудрость — искусница». Цепочка определений передана без добавочных связок, чтобы удержать ритм и структуру греческого текста; конечная запятая сохранена, поскольку предложение продолжается в следующем стихе.
