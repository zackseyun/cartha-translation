  text: For she is more beautiful than the sun, and above every arrangement of the stars. Compared with the light, she is found to be earlier.
translation:
  language: ru
  text: Ведь она прекраснее солнца и превосходит весь строй звёзд; при сравнении со светом она оказывается первой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оказывается прежде света»; греческое слово может обозначать как предшествование, так и первенство.'
    reason: Поясняет смысловой диапазон προτέρα, не навязывая исключительно хронологическое или качественное понимание.
lexical_decisions:
- source_word: εὐπρεπεστέρα
  choice: прекраснее
  rationale: Передаёт сравнительную степень внешней красоты и великолепия естественным современным русским словом.
- source_word: ὑπὲρ πᾶσαν ἄστρων θέσιν
  choice: превосходит весь строй звёзд
  rationale: «Строй звёзд» сохраняет образ их расположения или упорядоченности, а «превосходит» естественно передаёт сравнительное значение ὑπέρ без чрезмерно пространственного прочтения.
- source_word: προτέρα
  choice: первее
  rationale: Сохраняет смысл первенства, который может включать как предшествование, так и превосходство; более узкие варианты «раньше» и «лучше» устранили бы эту многозначность.
theological_decisions:
- issue: Первенство персонифицированной Премудрости по отношению к свету
  choice: оказывается первее
  alternative: оказывается превосходнее / существовала раньше
  rationale: Греческое προτέρα допускает оттенки предшествования и превосходства. Перевод не сводит высказывание исключительно к хронологии или качественной оценке и тем самым не навязывает определённой богословской интерпретации.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Женское местоимение относится к персонифицированной Премудрости из контекста.
