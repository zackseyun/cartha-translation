base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/017.yaml
  text: He gave the holy ones the reward of their labors[a], guided them in a marvelous way[c][b], and became for them a shelter by day and a flame of stars by night.
translation:
  language: ru
  text: Она воздала святым[a] награду за их труды, вела их дивным путём и стала для них укрытием днём и пламенем звёзд[b] ночью[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благочестивым».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пламенем звёзд»; возможно также понимание «звёздным пламенем».'
    reason: lexical_alternative
  - marker: c
    text: Эти образы напоминают о Божьем водительстве и защите при исходе, особенно об облаке днём и огне ночью; здесь греческий текст лишь намекает на этот образ, не воспроизводя полную традиционную формулу.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπέδωκεν
  choice: воздала
  rationale: Глагол означает «отдать, воздать, отплатить». В сочетании с μισθὸν передаёт предоставление заслуженной награды; «воздала» сохраняет эту смысловую связь и возвышенный тон.
- source_word: ὁσίοις
  choice: святым
  rationale: ὅσιος обозначает людей, преданных Богу, благочестивых или святых. Субстантивированное «святым» близко к форме оригинала и не вводит более узкой позднейшей категории.
- source_word: μισθὸν κόπων αὐτῶν
  choice: награду за их труды
  rationale: μισθός может означать плату или награду, а κόπος — тяжёлый, требующий усилий труд. Выбранное сочетание естественно по-русски и сохраняет идею воздаяния за понесённые труды.
- source_word: ὡδήγησεν αὐτοὺς ἐν ὁδῷ θαυμαστῇ
  choice: вела их дивным путём
  rationale: ὁδηγέω означает направлять или вести, а θαυμαστός — дивный, чудесный, достойный изумления. «Дивным путём» сохраняет образ реального пути и его необыкновенный характер.
- source_word: σκέπην ἡμέρας
  choice: укрытием днём
  rationale: σκέπη — покров, укрытие или защита; родительный ἡμέρας имеет временное значение. «Укрытие» ясно выражает защитную функцию, не добавляя отсутствующего в тексте образа облачного столпа.
- source_word: φλόγα ἄστρων τὴν νύκτα
  choice: пламенем звёзд ночью
  rationale: Буквально сжатое выражение содержит «пламя» и родительный «звёзд». Перевод сохраняет необычный образ и не заменяет его поясняющим «огненным столпом».
theological_decisions:
- issue: Подразумеваемое подлежащее ряда глаголов
  choice: Местоимение «Она», относящееся к олицетворённой Премудрости
  alternative: Явно повторить «Премудрость» либо употребить мужское «Он»
  rationale: В самом стихе подлежащее не названо заново, однако ближайший литературный контекст указывает на Премудрость. Русский язык требует согласования по роду, поэтому «Она» естественно сохраняет контекстуальную отсылку, не подменяя её явным пояснением.
- issue: Аллюзия на исход и столпы облака и огня
  choice: Передать непосредственные образы оригинала и пояснить аллюзию в сноске
  alternative: Развернуть текст как «столп облачный днём и столп огненный ночью»
  rationale: Аллюзия очевидна, но греческая формулировка намеренно не совпадает с полной традиционной формулой. Расширение разрешило бы образ вместо оригинала и добавило бы отсутствующие слова.
- issue: Необычное выражение «пламя звёзд»
  choice: Сохранить родительную конструкцию и её образную неоднозначность
  alternative: Перевести как «звёздное пламя» или истолковать как огонь среди звёзд
  rationale: φλόγα ἄστρων допускает образное понимание, но текст не уточняет точного отношения между пламенем и звёздами. Близкая формулировка сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис остаётся ясным для широкого читателя; редкий образ «пламя звёзд» намеренно сохранён и пояснён в сноске.
