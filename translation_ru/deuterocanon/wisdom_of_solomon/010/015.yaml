lexical_decisions:
- source_word: αὕτη
  choice: Она
  rationale: Указательное местоимение женского рода отсылает к олицетворённой Премудрости. «Она» естественно сохраняет эту анафорическую связь, не подставляя существительное, которого нет в греческом тексте.
- source_word: λαὸν
  choice: народ
  rationale: Передаёт коллективное обозначение Израиля и сохраняет отличие от ἔθνος далее в стихе.
- source_word: ὅσιον
  choice: святой
  rationale: Сохраняет религиозно-нравственную характеристику народа и естественно сочетается со словом «народ».
- source_word: σπέρμα
  choice: потомство
  rationale: Передаёт собирательное значение единственного числа без неестественного для современного русского буквального «семя».
- source_word: ἄμεμπτον
  choice: безупречное
  rationale: Передаёт значение отсутствия вины или повода для порицания, не усиливая его специальными догматическими оттенками.
- source_word: ἐρρύσατο
  choice: избавила
  rationale: Глагол означает избавление от бедствия или угнетения; «избавила» уместно в возвышенном, но современном библейском регистре.
- source_word: ἐξ
  choice: от
  rationale: В сочетании с глаголом «избавила» русский предлог «от» естественно выражает удаление из-под власти или воздействия.
- source_word: ἔθνους
  choice: народа
  rationale: В данном контексте обозначает иноземное национальное сообщество, вероятно Египет; «народа» звучит естественнее, чем «нации», хотя частично нивелирует различие с λαός.
- source_word: θλιβόντων
  choice: угнетателей
  rationale: Субстантивированное причастие передано существительным во множественном числе, что сохраняет образ народа, состоящего из тех, кто угнетает. Возможное определительное понимание отмечено в сноске.
theological_decisions:
- issue: К кому относится αὕτη
  choice: Местоимение относится к олицетворённой Премудрости и передано как «Она».
  alternative: Для ясности можно было бы сказать «Премудрость» либо буквально «эта».
  rationale: Контекст представляет Премудрость действующим лицом женского рода. Местоименное обозначение сохраняет литературную персонификацию и не добавляет отсутствующее в стихе имя.
- issue: Характеристика Израиля словами ὅσιον и ἄμεμπτον
  choice: 'Определения сохранены прямо: «святой» и «безупречное».'
  alternative: Возможны «благочестивый» и «непорочное» либо «не заслуживающее упрёка».
  rationale: Так сохраняется напряжённая риторическая характеристика спасённого народа и потомства без ослабления смысла и без привнесения позднейших догматических категорий.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и следует структуре греческого стиха; неоднозначность заключительной генитивной конструкции вынесена в сноску.
