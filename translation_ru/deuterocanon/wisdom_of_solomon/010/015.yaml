  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от угнетавшего их народа»; возможно также: «от народа, причинявшего страдания». Греческое причастие θλιβόντων допускает как субстантивное, так и определительное понимание.'
