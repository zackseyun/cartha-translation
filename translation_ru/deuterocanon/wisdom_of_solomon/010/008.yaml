base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/008.yaml
  text: For by passing wisdom by[a], they were harmed not only by not knowing what is good, but they also left behind for life a memorial of their folly, so that in the things in which they went astray they might not even be able to escape notice.
translation:
  language: ru
  text: Ибо, пройдя мимо мудрости, они не только потерпели вред оттого, что не познали добра, но и оставили в человеческой жизни[a] памятник своему безрассудству, так что даже не могут остаться незамеченными в том, в чём заблуждались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди живущих»; греческое βίος здесь может обозначать человеческую жизнь вообще, то есть мир людей, а не жизнь одного человека.'
    reason: Лексическая широта βίος допускает как общее понятие человеческой жизни, так и общество живущих людей.
lexical_decisions:
- source_word: παροδεύσαντες
  choice: пройдя мимо
  rationale: Сохраняет образ буквального прохождения мимо и одновременно передаёт сознательное пренебрежение мудростью.
- source_word: ἐβλάβησαν
  choice: потерпели вред
  rationale: Передаёт пассивную форму и широкий смысл ущерба — нравственного и жизненного, — не уточняя его сверх текста.
- source_word: τοῦ μὴ γνῶναι τὰ καλά
  choice: оттого, что не познали добра
  rationale: Передаёт причинно-смысловую связь инфинитивной конструкции; «добро» сохраняет этическую широту τὰ καλά, которое также может обозначать прекрасное или благородное.
- source_word: τῆς ἀφροσύνης
  choice: своему безрассудству
  rationale: «Безрассудство» естественно выражает отсутствие здравого разумения и сохраняет нравственную оценку греческого слова.
- source_word: ἀπέλιπον
  choice: оставили
  rationale: 'Передаёт результат их поступков: после них осталось долговечное свидетельство.'
- source_word: τῷ βίῳ
  choice: в человеческой жизни
  rationale: В данном контексте βίος, вероятно, означает сферу жизни людей, где сохраняется память об их поступках, а не только жизнь отдельного человека.
- source_word: μνημόσυνον
  choice: памятник
  rationale: Передаёт не просто воспоминание, а устойчивое и заметное свидетельство их безрассудства.
- source_word: ἔσφαλησαν
  choice: заблуждались
  rationale: Передаёт уклонение от верного пути или ошибочность действий, не сводя смысл к случайной ошибке.
- source_word: μηδὲ λαθεῖν δυνηθῶσιν
  choice: даже не могут остаться незамеченными
  rationale: Сохраняет значение λανθάνω — ускользать от внимания, оставаться незамеченным — и усиление μηδέ.
theological_decisions:
- issue: Нравственный смысл τὰ καλά
  choice: добра
  alternative: того, что хорошо; благородного
  rationale: «Добро» сохраняет этическую силу выражения, не ограничивая его эстетическим или материальным благом.
- issue: Связь заключительной цели с историческим результатом
  choice: так что даже не могут остаться незамеченными
  alternative: чтобы они не могли остаться незамеченными
  rationale: 'Греческое ἵνα формально вводит цель или результат. Русское «так что» естественно передаёт здесь итог: оставленный ими памятник делает их заблуждение явным, не приписывая кому-либо прямо выраженного намерения.'
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Образ «пройти мимо мудрости» и метафора «памятника безрассудству» сохранены; синтаксис слегка упрощён ради ясности без устранения смысловой напряжённости оригинала.
