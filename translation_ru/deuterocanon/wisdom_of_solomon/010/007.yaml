revisions:
- from: Свидетельством её нечестия доныне остаются дымящаяся пустошь, растения, приносящие незрелые плоды, и стоящий соляной столп — памятник неверующей душе.[a]
  to: Свидетельством её нечестия доныне остаются дымящаяся пустошь, растения, приносящие плоды, которые не созревают, и стоящий соляной столп — памятник неверующей души.[a]
  rationale: Исправлен падеж, чтобы сохранить генитивную связь μνημεῖον ἀπιστούσης ψυχῆς, и уточнено описание плодов как не достигающих зрелости. Аллюзия на жену Лота остаётся только в сноске, поскольку греческий текст не называет её прямо.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:05:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Нужна безопасная правка в двух местах. В сочетании ἀτελέστιοι … καρποφοροῦντα φυτά речь идёт о растениях, приносящих плоды, не достигающие зрелости; «незрелые плоды» несколько ослабляет незавершённость процесса. Главное: ἀπιστούσης ψυχῆς — родительный падеж при μνημεῖον, поэтому русский дательный «неверующей душе» меняет отношение на «памятник, посвящённый душе».'
  naturalness: Перечень и образ «дымящаяся пустошь» естественны для современного литературного русского. Конструкция «соляной столп — памятник неверующей души» ясна и сохраняет возвышенный, но не архаичный регистр.
  terminology: «Нечестие» точно передаёт нравственный смысл πονηρία; «соляной столп» и «памятник» соответствуют στήλη ἁλός и μνημεῖον. Неоднозначность ἀπιστούσης корректно оставлена в сноске как «неверующей» / «неверной».
  issues:
  - severity: high
    issue: Неверный падеж в «памятник неверующей душе».
    rationale: 'Греческое ἀπιστούσης ψυχῆς стоит в родительном падеже и зависит от μνημεῖον: столп является памятником неверующей (или неверной) души, а не памятником, адресованным ей.'
  - severity: medium
    issue: «Незрелые плоды» не вполне передаёт аспект ἀτελέστιοι.
    rationale: Прилагательное выражает то, что плод не приходит к завершению/зрелости. «Плоды, которые не созревают» точнее передаёт это значение и согласуется с английским аудит-трейлом.
