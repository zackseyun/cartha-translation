  text: whose wickedness still has as its witness a smoking wasteland[a], plants bearing fruit that never ripens[b], and a pillar of salt standing as a memorial of an unbelieving soul.
translation:
  language: ru
  text: Свидетельством её нечестия доныне остаются дымящаяся пустошь, растения, приносящие плоды, которые не созревают, и стоящий соляной столп — памятник неверующей души.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Соляной столп напоминает о жене Лота (Быт. 19:26), хотя здесь она прямо не названа. «Неверующей» можно также перевести как «неверной».
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἧς … τῆς πονηρίας
  choice: её нечестия
  rationale: Родительный оборот связывает свидетельство с ранее упомянутой землёй или местностью; «нечестие» передаёт нравственный смысл πονηρία.
- source_word: ἔτι μαρτύριον … καθέστηκε
  choice: свидетельством … доныне остаются
  rationale: Перфект καθέστηκε выражает сохраняющееся состояние, а ἔτι — его продолжение; множественное число естественно согласует по-русски перечисленные свидетельства.
- source_word: καπνιζομένη χέρσος
  choice: дымящаяся пустошь
  rationale: χέρσος обозначает опустошённую, бесплодную землю, а причастие передаёт продолжающееся дымление.
- source_word: ἀτελέστιοι ὥρας καρποφοροῦντα φυτά
  choice: растения, приносящие незрелые плоды
  rationale: Текст синтаксически труден, но ἀτελέστιοι передаёт незавершённость или недозрелость; перевод сохраняет сельскохозяйственный образ без неподтверждённого добавления «в срок».
- source_word: ἀπιστούσης ψυχῆς
  choice: неверующей душе
  rationale: ἀπιστέω допускает значения неверия и неверности; основной текст сохраняет формально близкое «неверующей», а альтернатива отмечена в сноске.
- source_word: μνημεῖον ἑστηκυῖα στήλη ἁλός
  choice: стоящий соляной столп — памятник
  rationale: Перфектное причастие подчёркивает продолжающееся состояние столпа; μνημεῖον здесь означает памятник или напоминание.
theological_decisions:
- issue: Кого обозначают соляной столп и неверующая душа
  choice: Не называть жену Лота в основном тексте, сохранив описательную формулировку источника.
  alternative: Прямо назвать жену Лота.
  rationale: Аллюзия на Бытие 19:26 ясна, однако греческий текст не называет эту женщину; явная идентификация вынесена в примечание.
- issue: Значение ἀπιστούσης
  choice: неверующей
  alternative: неверной
  rationale: Оба оттенка лексически возможны, поэтому основной вариант близок форме оригинала, а подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис сделан естественным для русского, при этом сохранены образность, длительность последствий суда и неоднозначность ἀπιστούσης.
