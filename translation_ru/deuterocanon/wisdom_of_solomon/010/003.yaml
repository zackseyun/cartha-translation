  text: But an unrighteous man, having departed from her, perished in his brother-murdering rage.
translation:
  language: ru
  text: Но неправедный, отступив от неё, погиб в братоубийственной ярости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστὰς ἀπ' αὐτῆς
  choice: отступив от неё
  rationale: Передаёт сознательное удаление от олицетворённой Премудрости; местоимение сохраняет связь с предшествующим контекстом.
- source_word: ἄδικος
  choice: неправедный
  rationale: Субстантивированное прилагательное обозначает неправедного человека; добавлять слово «человек» по-русски необязательно.
- source_word: ἀδελφοκτόνοις ... θυμοῖς
  choice: в братоубийственной ярости
  rationale: Сохраняет прямую связь ярости с убийством брата и передаёт интенсивность θυμός; греческое множественное число естественно выражено по-русски единственным числом.
- source_word: συναπώλετο
  choice: погиб
  rationale: В данном контексте глагол означает гибель; приставочное значение совместности не имеет явно названного второго участника и не должно искусственно уточняться.
theological_decisions:
- issue: Личность неправедного не названа прямо
  choice: не добавлять имя Каин
  alternative: «Каин» или «неправедный Каин»
  rationale: Контекст прозрачно отсылает к Каину, однако исходный стих оставляет его неназванным.
- issue: Референт женского местоимения αὐτῆς
  choice: сохранить «неё»
  alternative: явно написать «Премудрости»
  rationale: Так сохраняется анафорическая форма оригинала и связь с олицетворённой Премудростью без добавочного разъяснения.
