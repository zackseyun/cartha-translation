    text: 'Или: «нисходившего огня». Греческое выражение описывает огонь, сходящий на Пятиградие, но прямо не говорит, что он сошёл «с неба».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Она
  rationale: Указательное местоимение женского рода отсылает к олицетворённой Премудрости в ближайшем контексте; «Она» сохраняет это олицетворение без избыточного повторения имени.
- source_word: δίκαιον
  choice: праведника
  rationale: Форма винительного падежа единственного числа обозначает спасённого человека; слово сохраняет нравственно-религиозный смысл δίκαιος, не называя Лота прямо.
- source_word: ἐξαπολλυμένων ἀσεβῶν
  choice: когда нечестивые погибали
  rationale: Родительный самостоятельный оборот передан придаточным времени; несовершенный вид «погибали» сохраняет процессуальный смысл причастия, а «нечестивые» передаёт религиозно-нравственную окраску ἀσεβής.
- source_word: ἐρρύσατο
  choice: спасла
  rationale: Глагол означает избавление от непосредственной опасности; «спасла» естественно звучит по-русски и не добавляет неуказанного способа избавления.
- source_word: φυγόντα
  choice: он бежал
  rationale: Аористное причастие относится к праведнику. Отдельное поясняющее предложение ясно выражает связь бегства со спасением, не утверждая более точной временной последовательности, чем позволяет контекст.
- source_word: πῦρ καταβάσιον
  choice: огня, сходившего
  rationale: καταβάσιος означает «нисходящий, сходящий вниз». Выбранная формулировка сохраняет направление движения огня, но не добавляет отсутствующих в греческом слов «с неба».
- source_word: Πενταπόλεως
  choice: Пятиградие
  rationale: Греческое название обозначает объединение пяти городов. Традиционно понятное русское образование передаёт значение собственного географического наименования без тяжеловесного описания.
theological_decisions:
- issue: К кому относится αὕτη женского рода
  choice: К олицетворённой Премудрости; в тексте — «Она»
  alternative: «Эта» или явное повторение «Премудрость»
  rationale: В главе продолжается ряд спасительных деяний Премудрости. Местоимение сохраняет литературное олицетворение, не привнося позднейших догматических отождествлений.
- issue: Кто такой праведник и что такое Пятиградие
  choice: В основном тексте имена не раскрываются; аллюзия на Лота и города вокруг Содома поясняется в сноске
  alternative: Прямо назвать Лота и Содом в основном тексте
  rationale: Греческий текст не называет ни Лота, ни Содом. Сохранение косвенного обозначения уважает авторскую форму повествования и не подменяет перевод толкованием.
- issue: Источник нисходящего огня
  choice: Не уточнять, откуда сходил огонь
  alternative: «огонь с неба»
  rationale: καταβάσιος указывает на движение вниз, но в данной фразе источник огня прямо не назван; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Двоеточие естественно раскрывает обстоятельство спасения и позволяет избежать тяжёлой цепочки причастий. Термин «Пятиградие» краток и сохраняет характер географического названия; его смысл пояснён в сноске.
