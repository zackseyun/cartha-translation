  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/006.yaml
  text: She rescued a righteous man when the ungodly were perishing[b][a], as he fled the fire descending on the Five Cities.
translation:
  language: ru
  text: Она спасла праведника, бежавшего от огня, сходившего[b] на Пятиградие[a], когда погибали нечестивые.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть объединение пяти городов, связанное с Содомом; здесь подразумевается бегство Лота.
    reason: cross_reference
