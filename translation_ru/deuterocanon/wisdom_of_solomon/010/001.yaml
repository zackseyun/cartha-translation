  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/001.yaml
  text: She guarded the first-formed father of the world[a], when he alone had been created, and she delivered him from his own transgression[b],
translation:
  language: ru
  text: Она сохранила первозданного отца мира[a], когда он был сотворён один, и избавила его от собственного прегрешения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть первого человека — Адама.
    reason: cross_reference
  - marker: b
    text: 'Или: «от собственного проступка»; возможен перевод «от собственного падения», однако слово «падение» здесь более интерпретирующее, чем греческое слово.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὕτη
  choice: Она
  rationale: Указательное местоимение женского рода отсылает к олицетворённой Премудрости в предшествующем контексте; «Она» сохраняет эту анафору, не добавляя имени в основной текст.
- source_word: πρωτόπλαστον
  choice: первозданного
  rationale: Передаёт значение «первым сформированный/созданный» и сохраняет возвышенный, но естественный русский стиль.
- source_word: πατέρα κόσμου
  choice: отца мира
  rationale: Близко следует греческой конструкции и оставляет образ прародителя мира без пояснительной подмены словом «человечество».
- source_word: μόνον κτισθέντα
  choice: сотворённого в одиночестве
  rationale: Передаёт одиночное состояние первого человека при сотворении и естественно связывается с причастным оборотом.
- source_word: διεφύλαξεν
  choice: сохранила
  rationale: Глагол означает оберегать и сохранять; «сохранила» хорошо передаёт результативную защиту.
- source_word: ἐξείλατο
  choice: избавила
  rationale: Естественный русский эквивалент со значением освобождения или спасения от чего-либо.
- source_word: παραπτώματος ἰδίου
  choice: от собственного прегрешения
  rationale: «Прегрешение» передаёт образ нравственного проступка, не вводя более поздний богословский термин «грехопадение»; «собственного» сохраняет усиление ἰδίου.
theological_decisions:
- issue: Кого обозначает «первозданный отец мира»
  choice: В основном тексте Адам не назван прямо, как и в греческом оригинале.
  alternative: Явно написать «Адам».
  rationale: Описательное обозначение ясно указывает на Адама, но сохранение имплицитности вернее литературной форме источника.
- issue: Передача παραπτώματος
  choice: прегрешение
  alternative: грехопадение
  rationale: «Грехопадение» является более интерпретирующим богословским обозначением; «прегрешение» сохраняет нравственный смысл греческого слова и не снимает заложенную в нём широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сделан естественным для русского; описательность греческого текста и его богословская неоднозначность сохранены.
