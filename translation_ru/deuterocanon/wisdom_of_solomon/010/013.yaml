  source_fidelity: 'Текст точно передаёт греческий оригинал: αὕτη сохранено женским «Она» с контекстуальной отсылкой к Премудрости; πραθέντα δίκαιον естественно передано как «праведника, когда его продали»; οὐκ ἐγκατέλιπεν — «не оставила»; ἐξ ἁμαρτίας ἐρρύσατο αὐτόν — «избавила его от греха». Неоднозначность того, в каком именно отношении Иосиф был избавлен от греха, не устранена переводом.'
