lexical_decisions:
- source_word: αὕτη
  choice: Она
  rationale: Женское местоимение сохраняет отсылку к Премудрости из контекста главы.
- source_word: πραθέντα δίκαιον
  choice: праведника, когда его продали
  rationale: Причастная конструкция передана естественным русским придаточным предложением; речь идёт об Иосифе, проданном в рабство.
- source_word: οὐκ ἐγκατέλιπεν
  choice: не оставила
  rationale: Точно передаёт смысл оставления или покинутости без ненужного усиления.
- source_word: ἐξ ἁμαρτίας ἐρρύσατο αὐτόν
  choice: избавила его от греха
  rationale: Сохраняет прямое значение ἁμαρτία как «грех» и спасительный оттенок глагола ῥύομαι.
theological_decisions:
- issue: Значение выражения ἐξ ἁμαρτίας
  choice: от греха
  alternative: от греховного поступка / от падения в грех
  rationale: Греческий текст прямо говорит о грехе; перевод не уточняет, идёт ли речь о сохранении от совершения греха, освобождении от его власти или избавлении от его последствий.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка с сохранением женского рода персонифицированной Премудрости и смысловой неоднозначности заключительной фразы.
