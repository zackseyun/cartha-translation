base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/020.yaml
  text: Therefore the righteous plundered the ungodly[a], and they sang praise to your holy name, O Lord[b]; and with one accord they praised your defending hand.
translation:
  language: ru
  text: Поэтому праведные взяли добычу у нечестивых[a], воспели святое имя Твоё, Господи, и единодушно прославили Твою руку, защищающую их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишили нечестивых добычи»; то есть взяли добычу у побеждённых.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твою руку, сражающуюся за них». Греческое прилагательное означает «выступающий на чьей-либо стороне, защищающий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Естественно передаёт вывод и связь с предшествующим избавлением.
- source_word: δίκαιοι
  choice: праведные
  rationale: Субстантивированное прилагательное сохраняет нравственно-богословскую характеристику без добавления этнического обозначения.
- source_word: ἐσκύλευσαν ἀσεβεῖς
  choice: взяли добычу у нечестивых
  rationale: Передаёт конкретный смысл взятия трофеев у побеждённых и звучит по-русски естественнее, чем двусмысленное «разграбили нечестивых».
- source_word: ὕμνησαν
  choice: воспели
  rationale: Сохраняет оттенок хвалебного пения и отличается от более общего ᾔνεσαν.
- source_word: Κύριε
  choice: Господи
  rationale: Нормальная русская форма звательного обращения к Богу.
- source_word: τὸ ὄνομα τὸ ἅγιόν σου
  choice: святое имя Твоё
  rationale: Сохраняет устойчивый библейский образ и торжественный порядок слов.
- source_word: τήν τε ὑπέρμαχόν σου χεῖρα
  choice: защищающую их руку Твою
  rationale: Сохраняет метафору Божьей руки и значение действия в защиту кого-либо; местоимение «их» поясняет подразумеваемых праведных, не превращая образ в отвлечённую «силу».
- source_word: ᾔνεσαν
  choice: прославили
  rationale: Передаёт общее значение хвалы и позволяет сохранить отличие от музыкально окрашенного «воспели».
- source_word: ὁμοθυμαδόν
  choice: единодушно
  rationale: Выражает общность устремления, а не только одновременность действия.
theological_decisions:
- issue: Кого обозначают «праведные» и «нечестивые»
  choice: Сохранены общие нравственно-религиозные обозначения.
  alternative: «праведные израильтяне» и «нечестивые египтяне»
  rationale: Контекст указывает на Израиль и Египет, но греческий текст не называет народы и тем самым сохраняет более широкую типологическую формулировку.
- issue: Образ Божьей руки как ὑπέρμαχος
  choice: «защищающую их руку Твою»
  alternative: «могучую руку Твою» или «защищающую силу Твою»
  rationale: Перевод удерживает телесную метафору «руки» и смысл активного выступления на стороне праведных, не сводя его к общей идее могущества.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Два близких глагола хвалы разведены как «воспели» и «прославили»; синтаксический параллелизм греческого текста сохранён.
