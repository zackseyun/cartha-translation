lexical_decisions:
- source_word: ἐν πλεονεξίᾳ
  choice: алчные люди
  rationale: Существительное πλεονεξία обозначает алчность, корыстолюбие. В сочетании с субстантивированным причастием оборот естественно передаётся по-русски как характеристика действующих лиц; нравственная окраска сохраняется.
- source_word: κατισχυόντων αὐτόν
  choice: одолевали его
  rationale: κατισχύω выражает превосходство сил и значение «одерживать верх над, одолевать». Несовершенный вид естественно передаёт обстоятельство, на фоне которого Премудрость пришла на помощь.
- source_word: παρέστη
  choice: встала рядом с ним
  rationale: παρίστημι здесь означает стать рядом, выступив в поддержку. Формулировка сохраняет пространственный образ и подразумеваемую помощь, не заменяя его толкованием.
- source_word: ἐπλούτισεν αὐτόν
  choice: обогатила его
  rationale: Глагол πλουτίζω значит «делать богатым, обогащать». «Обогатила» — ясный и достойный современный эквивалент.
theological_decisions:
- issue: Не выраженное в этой клаузе подлежащее при παρέστη и ἐπλούτισεν
  choice: «она», то есть Премудрость по контексту главы
  alternative: Оставить подлежащее невыраженным
  rationale: В контексте Премудрости Соломона 10 действующим лицом остаётся персонифицированная Премудрость. Русская фраза требует явного подлежащего; женское местоимение отражает контекст, не внося дополнительного богословского определения.
- issue: Отношение ἐν πλεονεξίᾳ к κατισχυόντων
  choice: Алчность представлена как характеристика тех, кто одолевал его
  alternative: «Когда его одолевали из-за алчности» или «Когда над ним брали верх в алчности»
  rationale: Греческий оборот допускает обстоятельственное либо инструментальное понимание. Основной текст выбран ради естественного русского языка, а формально более близкая конструкция отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Образ «встала рядом» сохранён; синтаксис упрощён лишь настолько, чтобы стих был понятен обычному читателю.
