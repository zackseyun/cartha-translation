base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/012.yaml
  text: She protected him from enemies[a], and from those lying in ambush she kept him safe; and she awarded him a strong contest[b], so that he might know that godliness is stronger than everything.
translation:
  language: ru
  text: Она хранила его от врагов и оберегала от тех, кто устраивал ему засаду; она даровала ему тяжкое состязание[a], чтобы он узнал, что благочестие[b] сильнее всего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий глагол связан с образом судьи состязания, присуждающего награду. Возможен также перевод: «присудила ему награду в тяжком состязании».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «богопочитание». Греческое εὐσέβεια означает почтение к Богу, выраженное в образе жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφύλαξεν
  choice: хранила
  rationale: Глагол обозначает тщательную охрану и сохранение от опасности; «хранила» естественно сочетается с «от врагов» и сохраняет возвышенный регистр.
- source_word: ἐχθρῶν
  choice: врагов
  rationale: Прямой и общеупотребительный эквивалент для обозначения враждебных лиц.
- source_word: ἐνεδρευόντων
  choice: тех, кто устраивал ему засаду
  rationale: Причастие передаёт конкретный образ людей, подстерегающих в засаде; развёрнутая формулировка яснее и точнее, чем отвлечённое «злоумышленников».
- source_word: ἠσφαλίσατο
  choice: оберегала
  rationale: Средний глагол выражает обеспечение безопасности. «Оберегала» естественно продолжает мотив защиты и избегает канцелярского «обеспечила безопасность».
- source_word: ἀγῶνα ἰσχυρόν
  choice: в тяжкой борьбе
  rationale: ἀγών может обозначать состязание, борьбу или конфликт, а ἰσχυρός подчёркивает его напряжённость. «Тяжкая борьба» сохраняет широту образа и звучит естественно по-русски.
- source_word: ἐβράβευσεν αὐτῷ
  choice: присудила победу ему
  rationale: ἐβράβευσεν связано с решением судьи и присуждением награды; в сочетании с дательным αὐτῷ выражает решение борьбы в его пользу. Формулировка передаёт состязательно-судейский образ, а неоднозначность отмечена в сноске.
- source_word: ἵνα γνῷ
  choice: чтобы он узнал
  rationale: Сохраняет целевое значение конструкции ἵνα с конъюнктивом и звучит естественно в современном русском языке.
- source_word: παντὸς δυνατωτέρα
  choice: сильнее всего
  rationale: Сравнительная степень с родительным выражает превосходство над всем; краткая русская формула точна и выразительна.
- source_word: εὐσέβεια
  choice: благочестие
  rationale: Слово обозначает почтительное отношение к Богу, проявляемое в жизни. «Благочестие» сохраняет как религиозный, так и нравственно-практический смысл.
theological_decisions:
- issue: Подразумеваемое подлежащее женского рода
  choice: Передать местоимением «она», относящимся к олицетворённой Премудрости в контексте.
  alternative: Повторить имя «Премудрость».
  rationale: В самом стихе подлежащее не названо, но женский род и контекст указывают на Премудрость. Местоимение сохраняет связность и не добавляет отсутствующего в стихе существительного.
- issue: Смысл ἐβράβευσεν в сочетании с ἀγῶνα ἰσχυρόν
  choice: Передать как присуждение ему победы в тяжкой борьбе.
  alternative: «Даровала ему тяжкую борьбу» или «присудила ему награду в тяжкой борьбе».
  rationale: Глагол несёт образ судьи состязания, решающего дело в чью-либо пользу. Основной текст выражает наиболее естественный для контекста смысл, а сноска сохраняет необычность и возможные оттенки греческой конструкции, не сводя её к простой помощи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм защитных действий сохранён; конкретный образ засады и состязательно-судейская метафора переданы без архаизации.
