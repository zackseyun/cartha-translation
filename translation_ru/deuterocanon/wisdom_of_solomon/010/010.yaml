base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/010.yaml
  text: She guided the righteous man[a], a fugitive from his brother’s anger, in straight paths; she showed him the kingdom of God, and gave him knowledge of holy things; she prospered him in his labors[b], and increased the fruits of his toil.
translation:
  language: ru
  text: Она вела праведника, бежавшего от гнева брата, прямыми путями; показала ему Царство Божье и дала ему знание святых вещей[a]; даровала ему успех в трудах и умножила плоды его трудов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знание святых». Греческое выражение может относиться как к святым вещам, так и к святым людям или небесным существам.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «умножила его труды (или страдания)». Здесь, вероятно, имеются в виду плоды, добытые его трудом, поскольку весь стих говорит о благодеяниях Премудрости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Она
  rationale: Указательное местоимение женского рода отсылает к олицетворённой Премудрости в ближайшем контексте; русское «Она» сохраняет анафору и олицетворение.
- source_word: φυγάδα ὀργῆς ἀδελφοῦ δίκαιον
  choice: праведника, бежавшего от гнева брата
  rationale: Субстантивированное δίκαιον передано как «праведника», а φυγάδα — естественным русским причастным оборотом, обозначающим человека, вынужденного бежать из-за гнева брата.
- source_word: ὡδήγησεν ἐν τρίβοις εὐθείαις
  choice: вела ... прямыми путями
  rationale: Сохраняется библейский образ прямых путей; творительный падеж естественно передаёт греческое ἐν в данном сочетании.
- source_word: βασιλείαν θεοῦ
  choice: Царство Божье
  rationale: Устоявшаяся, понятная и точная передача выражения «Царство Бога» в современном литературном русском.
- source_word: γνῶσιν ἁγίων
  choice: знание святынь
  rationale: «Святынь» естественно выражает возможное среднее множественное «святые вещи», не конкретизируя их характер; допустимое понимание как «святых» отмечено в сноске.
- source_word: εὐπόρησεν αὐτὸν ἐν μόχθοις
  choice: даровала ему успех в трудах
  rationale: εὐπορέω обозначает преуспевание или благополучие; эта формулировка ясна по-русски и сохраняет благотворный смысл действия Премудрости.
- source_word: ἐπλήθυνεν τοὺς πόνους αὐτοῦ
  choice: умножила плоды его трудов
  rationale: Буквально возможно «умножила его труды/страдания», однако последовательность благодеяний позволяет понимать πόνοι метонимически как результаты тяжёлого труда. Смысловая конкретизация вынесена в сноску.
theological_decisions:
- issue: Кто является субъектом женского рода
  choice: Олицетворённая Премудрость, обозначенная местоимением «Она»
  alternative: Повторить существительное «Премудрость»
  rationale: Греческое αὕτη анафорически отсылает к Премудрости, но существительного в самом стихе нет; местоимение точнее сохраняет форму оригинала.
- issue: Значение γνῶσιν ἁγίων
  choice: «знание святынь»
  alternative: «знание святых» — святых людей или небесных существ
  rationale: Греческая форма допускает отнесение как к святыням, так и к святым существам или людям. В основном тексте выбрано естественное контекстуальное прочтение, а подлинная неоднозначность сохранена в сноске.
- issue: Значение τοὺς πόνους αὐτοῦ в благотворном контексте
  choice: «плоды его трудов»
  alternative: «его труды» или «его страдания»
  rationale: Буквальный вариант создаёт напряжение с рядом благодеяний Премудрости. Метонимическое понимание как результатов труда контекстуально вероятно, но буквальная возможность не скрыта и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксический параллелизм оригинала сохранён; архаизмы и конфессионально окрашенные уточнения не вводятся. Маркеры [a] и [b] размещены непосредственно при неоднозначных выражениях.
