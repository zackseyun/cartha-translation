  text: But he flooded their enemies[a], and from the depth of the abyss he cast them up.
translation:
  language: ru
  text: Врагов же их она затопила, а из глубины бездны выбросила их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подняла их из глубины бездны». Греческий глагол может обозначать, что нечто бурно поднимается или выбрасывается из глубины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς δὲ ἐχθροὺς αὐτῶν
  choice: Врагов же их
  rationale: Сохраняется противопоставительное δέ и обычное значение ἐχθρούς; местоимение αὐτῶν естественно передано как «их».
- source_word: κατέκλυσεν
  choice: затопила
  rationale: Глагол означает покрыть или погубить нахлынувшей водой. «Затопила» сохраняет водную образность, не добавляя прямо отсутствующих в греческом тексте слов «утопила» или «умертвила».
- source_word: ἐκ βάθους ἀβύσσου
  choice: из глубины бездны
  rationale: Передача следует единственному числу βάθους и сохраняет возвышенный образ глубокой морской бездны.
- source_word: ἀνέβρασεν αὐτούς
  choice: извергла их наверх
  rationale: ἀναβράζω может обозначать вызванное кем-либо всплытие, бурное поднятие или выбрасывание из глубины. «Извергла ... наверх» передаёт силу и направленность действия, не поясняя сверх текста, что речь идёт о телах погибших.
theological_decisions:
- issue: Неявный субъект глаголов
  choice: она
  alternative: он; безличная или пассивная конструкция
  rationale: В ближайшем контексте действующим лицом остаётся Премудрость, грамматически женского рода; русское местоимение делает эту связь ясной, не меняя образа.
- issue: Образ суда в море
  choice: Сохранить конкретные глаголы водного суда без добавления слов «утопила», «погибли» или «тела».
  alternative: 'Истолковательно уточнить: «утопила врагов и вынесла их мёртвые тела из глубины».'
  rationale: Греческий текст ярко изображает затопление и поднятие из бездны, но сам по себе не называет врагов мёртвыми и не употребляет существительное «тела».
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Инверсия «Врагов же их» сохраняет акцент и противопоставление греческого текста; «бездна» уместно передаёт космическую и морскую образность ἄβυσσος.
