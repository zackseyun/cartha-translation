  text: But wisdom rescued those who served her from hardships[a].
translation:
  language: ru
  text: Но мудрость избавила от тягот тех, кто служил ей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от трудов», «от бед» или «от страданий». Греческое слово может обозначать тяжкий труд, боль и бедствие вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: мудрость
  rationale: Передано нарицательным существительным; олицетворение сохраняется благодаря действию мудрости и местоимению «ей».
- source_word: θεραπεύσαντας
  choice: тех, кто служил
  rationale: θεραπεύω может обозначать служение, попечение и преданное почитание; «служил» естественно выражает здесь преданность олицетворённой мудрости.
- source_word: αὐτὴν
  choice: ей
  rationale: Женский род местоимения естественно соответствует русскому существительному «мудрость» и сохраняет её олицетворение.
- source_word: ἐκ πόνων
  choice: от тягот
  rationale: πόνος охватывает тяжкий труд, страдание, боль и бедствия; «тяготы» сохраняет эту широту и хорошо сочетается с глаголом избавления.
- source_word: ἐρρύσατο
  choice: избавила
  rationale: Глагол означает вызволить или уберечь от бедствия; «избавила» точно и естественно передаёт результат, не усиливая без необходимости сотериологическую окраску.
theological_decisions:
- issue: Олицетворение мудрости
  choice: Сохранить личностное действие и местоимение женского рода, написав «мудрость» со строчной буквы.
  alternative: Написать «Мудрость» как имя либо ослабить олицетворение более абстрактной формулировкой.
  rationale: Греческий текст представляет мудрость действующим лицом, но не требует превращать обозначение в собственное имя. Русская грамматика позволяет естественно сохранить эту смысловую напряжённость.
translation_notes:
  register: 'Современный литературный русский язык; краткая, dignified формулировка. Порядок слов слегка перестроен ради ясности: дополнение «тех, кто служил ей» поставлено после указания на избавление.'
