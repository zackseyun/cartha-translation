lexical_decisions:
- source_word: διεβίβασεν
  choice: переправил
  rationale: Глагол выражает понуждение или содействие при переходе на другую сторону; «переправил» естественно передаёт каузативный смысл.
- source_word: θάλασσαν ἐρυθράν
  choice: Красное море
  rationale: Устоявшееся современное географическое название, прямо указывающее на событие исхода.
- source_word: διήγαγεν
  choice: провёл
  rationale: Передаёт направляемое движение через пространство и сохраняет отличие от предшествующего глагола «переправил».
- source_word: διʼ ὕδατος πολλοῦ
  choice: через великие воды
  rationale: Достойная и понятная русская формулировка, передающая огромную массу воды; примечание сохраняет буквальное единственное число греческого собирательного существительного.
theological_decisions:
- issue: Аллюзия на исход и название моря
  choice: Красное море
  alternative: красное море; Чермное море
  rationale: Греческий текст использует обычное название моря в повествовании об исходе. Современное «Красное море» ясно передаёт эту связь без архаизации.
translation_notes:
