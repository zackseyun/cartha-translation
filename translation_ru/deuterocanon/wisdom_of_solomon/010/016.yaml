base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/016.yaml
  text: She entered into the soul of a servant of the Lord[b][a], and stood against fearsome kings with wonders and signs.
translation:
  language: ru
  text: Она вошла в душу служителя Господа[a] и противостала грозным царям чудесами и знамениями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Из контекста следует, что служитель Господа — Моисей.
    reason: cross_reference
  - marker: b
    text: 'Или: «с чудесами и знамениями». Греческое выражение может указывать как на средство, так и на сопутствующее обстоятельство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: вошла
  rationale: Аорист εἰσέρχομαι обозначает вхождение; форма женского рода сохраняет олицетворение Премудрости, подразумеваемой контекстом.
- source_word: ψυχὴν
  choice: душу
  rationale: В данном контексте ψυχή означает внутреннее существо человека; «душа» сохраняет антропологическую и богословскую насыщенность образа.
- source_word: θεράποντος Κυρίου
  choice: служителя Господа
  rationale: θεράπων обозначает слугу или преданного служителя и может иметь почётный оттенок. «Служитель» естественно передаёт этот оттенок, не подменяя нарицательное обозначение именем Моисея.
- source_word: ἀντέστη
  choice: противостала
  rationale: Глагол означает выступить против, оказать сопротивление; «противостала» сохраняет энергичный и возвышенный характер выражения.
- source_word: βασιλεῦσι φοβεροῖς
  choice: грозным царям
  rationale: βασιλεῦσι прямо означает «царям», а φοβεροῖς здесь описывает тех, кто внушает страх; «грозным» естественно передаёт этот смысл.
- source_word: ἐν τέρασι καὶ σημείοις
  choice: чудесами и знамениями
  rationale: Предлог ἐν допускает инструментальное значение и значение сопутствующего обстоятельства. Творительный падеж кратко и по-библейски передаёт основное инструментальное прочтение; альтернативный оттенок отмечен в сноске.
theological_decisions:
- issue: Подразумеваемый субъект женского рода
  choice: «Она» — олицетворённая Премудрость
  alternative: Повторить существительное «Премудрость» либо опустить местоимение
  rationale: В самом стихе субъект не назван, однако контекст главы продолжает повествование об олицетворённой Премудрости. Местоимение сохраняет связность и не добавляет отсутствующего в греческой фразе существительного.
- issue: Личность «служителя Господа»
  choice: Сохранить нарицательное выражение
  alternative: Назвать Моисея непосредственно
  rationale: Контекст указывает на Моисея, но греческий текст употребляет нарицательное θεράπων. Имя вынесено в пояснение, чтобы перевод не подменял формулировку источника контекстуальным отождествлением.
- issue: Связь чудес и знамений с противостоянием царям
  choice: 'Передать преимущественно как средство: «чудесами и знамениями»'
  alternative: 'Понимать как сопутствующее обстоятельство: «с чудесами и знамениями»'
  rationale: ἐν с дательным допускает оба оттенка; основной текст выбирает естественное для русского инструментальное выражение, а подлинная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и близок к греческому; сохранены олицетворение Премудрости, образ вхождения в душу и формула «чудеса и знамения».
