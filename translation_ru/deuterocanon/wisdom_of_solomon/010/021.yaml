base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/021.yaml
  text: For wisdom opened the mouths of the mute[c][b][a], and made the tongues of infants eloquent.
translation:
  language: ru
  text: Ибо мудрость открыла уста немых[a][b] и сделала языки младенцев внятными[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глухих»: греческое слово может обозначать неспособных как слышать, так и говорить; здесь контекст речи поддерживает перевод «немых».'
    reason: lexical_alternative
  - marker: b
    text: 'Мудрость здесь олицетворена; возможное написание: «Мудрость».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «ясными», «членораздельными». Греческое слово указывает прежде всего на ясность и отчётливость речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: мудрость
  rationale: Строчная буква сохраняет основное значение существительного и не устраняет олицетворение, очевидное из того, что мудрость действует.
- source_word: ἤνοιξεν
  choice: открыла
  rationale: Прямо передаёт аорист ἀνοίγω и сохраняет образ открытия уст как дарования речи.
- source_word: στόμα κωφῶν
  choice: уста немых
  rationale: κωφός может означать как неспособного слышать, так и неспособного говорить; параллелизм с языками и тема речи поддерживают значение «немых». «Уста» естественно сохраняет возвышенный телесный образ.
- source_word: γλώσσας νηπίων
  choice: языки младенцев
  rationale: Сохраняется буквальный образ органов речи; νήπιοι обозначает младенцев или совсем малых детей, ещё не владеющих полноценной речью.
- source_word: ἔθηκεν τρανάς
  choice: сделала ... внятными
  rationale: τρανός означает ясный, отчётливый, членораздельный. «Внятными» естественно сочетается с «языками» в поэтическом русском и не добавляет более сильной идеи красноречия.
theological_decisions:
- issue: Олицетворение σοφία
  choice: «мудрость» со строчной буквы
  alternative: «Мудрость» с прописной буквы
  rationale: Греческий текст представляет мудрость действующим лицом, но русская прописная буква могла бы чрезмерно закрепить её как особое имя или отдельную ипостась. Строчная буква сохраняет и лексический смысл, и литературное олицетворение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Параллелизм «уста немых / языки младенцев» сохранён; архаизирующие формы, кроме привычного поэтического «уста», не используются.
