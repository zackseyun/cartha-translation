base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/005.yaml
  text: She also[a], when the nations were thrown into confusion in their wicked conspiracy, found the righteous man and kept him blameless before God[c][b], and kept him strong against his compassion for his child.
translation:
  language: ru
  text: Она также, когда народы, единодушные во зле[a], были приведены в смятение, нашла праведника[b], сохранила его непорочным перед Богом и сохранила его твёрдым, несмотря на его нежную привязанность к ребёнку[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в злом единомыслии» или «в порочном согласии». Речь идёт об общей злой цели народов.'
    reason: lexical_alternative
  - marker: b
    text: Судя по контексту, «праведник» — Авраам, но здесь греческий текст не называет его по имени.
    reason: cross_reference
  - marker: c
    text: 'Или: «сохранила его стойким вопреки его нежным чувствам к ребёнку». Греческое слово обозначает глубокую внутреннюю привязанность или сострадание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη καὶ
  choice: Она также
  rationale: Местоимение женского рода указывает на олицетворённую Премудрость из контекста; «также» передаёт присоединительное καί.
- source_word: ἐν ὁμονοίᾳ πονηρίᾳ ἐθνῶν συγχυθέντων
  choice: когда народы, единодушные во зле, были приведены в смятение
  rationale: Генитив абсолютный передан обстоятельственным придаточным. ὁμόνοια означает согласие или единомыслие, а πονηρά придаёт ему нравственно отрицательный смысл; συγχέω передано как приведение в смятение, с сохранением вероятного намёка на Вавилон.
- source_word: εὗρεν τὸν δίκαιον
  choice: нашла праведника
  rationale: Субстантивированное прилагательное мужского рода передано без добавления имени, которого в греческом тексте нет.
- source_word: ἐτήρησεν αὐτὸν ἄμεμπτον θεῷ
  choice: сохранила его непорочным перед Богом
  rationale: τηρέω выражает сохранение или охрану, ἄμεμπτος — непорочность, а дательный θεῷ естественно передаётся отношением «перед Богом».
- source_word: ἐπὶ τέκνου σπλάγχνοις ἰσχυρὸν ἐφύλαξεν
  choice: сохранила его твёрдым, несмотря на любовь к своему ребёнку
  rationale: σπλάγχνα обозначает глубокую внутреннюю привязанность или сострадание; ἰσχυρόν имеет предикативное значение «твёрдым, стойким». Формулировка сохраняет напряжение между стойкостью праведника и его родительской любовью, не добавляя прямо не названного жертвоприношения.
theological_decisions:
- issue: Кого обозначает «праведник»
  choice: В основном тексте оставлено «праведник».
  alternative: Авраам
  rationale: Контекст, особенно упоминание ребёнка, указывает на Авраама, однако греческий текст не называет его по имени.
- issue: Смысл заключительной фразы
  choice: Премудрость сохранила праведника твёрдым, несмотря на любовь к ребёнку.
  alternative: Сохранила его сильным против сострадания к ребёнку; сохранила его стойким в деле, касавшемся сына.
  rationale: Перевод передаёт эмоциональное напряжение рассказа об испытании Авраама, но не конкретизирует действие сверх того, что выражено в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет связность длинного греческого периода, но остаётся понятным современному читателю. Термины «праведник», «непорочный» и «перед Богом» сохранены как естественные и богословски нейтральные библейские выражения.
