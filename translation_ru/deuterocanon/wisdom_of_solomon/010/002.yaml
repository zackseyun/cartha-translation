  text: and gave him strength to rule over all things[a].
translation:
  language: ru
  text: и дала ему силу властвовать над всем[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «овладеть всем». Греческий глагол может означать как осуществление власти, так и обретение господства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκέν
  choice: дала
  rationale: Форма аориста передаёт завершённое действие; женский род обусловлен подразумеваемым в контексте подлежащим — Премудростью.
- source_word: τε
  choice: и
  rationale: Связывает эту часть с предыдущим высказыванием без излишнего усиления.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж личного местоимения относится к упомянутому в контексте первозданному человеку.
- source_word: ἰσχὺν
  choice: силу
  rationale: Прямо и естественно передаёт значение силы или могущества и сочетается с последующим инфинитивом.
- source_word: κρατῆσαι
  choice: властвовать
  rationale: Передаёт осуществление власти и господства; при этом не уточняет объект сверх того, что сказано в греческом тексте.
- source_word: ἁπάντων
  choice: над всем
  rationale: Сохраняет всеобъемлющий характер формы родительного падежа, зависящей от κρατῆσαι, не добавляя слов «творение» или «живые существа».
theological_decisions:
- issue: Объём власти, дарованной первозданному человеку
  choice: «властвовать над всем» без уточнения объектов власти
  alternative: «властвовать над всем творением»
  rationale: Греческий текст выражается всеобъемлюще, но не называет ни творение, ни живых существ; широкая формулировка сохраняет возможную отсылку к человеческому владычеству и не вводит отсутствующего уточнения.
- issue: Смысл κρατῆσαι
  choice: «властвовать»
  alternative: «овладеть»
  rationale: Глагол допускает оттенки как осуществления власти, так и обретения контроля. Основной текст передаёт значение господства, а примечание сохраняет лексическую альтернативу.
translation_notes:
  register: Краткий, возвышенный, но современный литературный русский язык. Женский род «дала» восстанавливает подразумеваемое подлежащее «Премудрость» из контекста; формулировка не добавляет отсутствующего в греческом тексте объекта вроде «творения».
