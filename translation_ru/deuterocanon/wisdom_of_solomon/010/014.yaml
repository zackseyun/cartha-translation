base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/014.yaml
  text: She went down with him into the pit[a], and in chains she did not abandon him, until she brought him the scepter of a kingdom and authority over those who had ruled him; she showed those who had slandered him to be false[b], and gave him everlasting glory.
translation:
  language: ru
  text: Она сошла с ним в яму[a] и не оставила его в оковах, пока не принесла ему скипетры царской власти и власть над теми, кто господствовал над ним; она обличила во лжи тех, кто порицал его[b], и даровала ему вечную славу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в темницу»; греческое слово буквально означает «яма» и может обозначать яму или цистерну, служившую местом заключения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «показала, что порицавшие его лгали».'
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατέβη
  choice: сошла с ним
  rationale: Передаёт совместное нисхождение, выраженное приставочным глаголом с συν-, и сохраняет олицетворение Премудрости.
- source_word: εἰς λάκκον
  choice: в яму
  rationale: Сохраняет конкретный образ λάκκος; слово может обозначать также темницу, устроенную в яме или цистерне, что вынесено в примечание.
- source_word: ἐν δεσμοῖς
  choice: в оковах
  rationale: Современное и вместе с тем dignified обозначение уз и заключения.
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: не оставила его
  rationale: Естественно передаёт значение оставления или покидания без усиления, не обязательного для греческого текста.
- source_word: ἕως ἤνεγκεν αὐτῷ
  choice: пока не принесла ему
  rationale: Сохраняет конкретное значение φέρω и естественную русскую конструкцию с дательным падежом.
- source_word: σκῆπτρα βασιλείας
  choice: скипетры царской власти
  rationale: Сохраняет множественное число σκῆπτρα и передаёт βασιλεία как царскую власть, а не как территориальное царство.
- source_word: ἐξουσίαν τυραννούντων αὐτοῦ
  choice: власть над теми, кто господствовал над ним
  rationale: Передаёт переворот положения Иосифа и властный оттенок τυραννέω, не сужая значение до явно жестокого угнетения.
- source_word: ψευδεῖς ... ἔδειξεν
  choice: показала лживость
  rationale: Передаёт смысл конструкции «показала ложными» естественным русским оборотом.
- source_word: τοὺς μωμησαμένους αὐτόν
  choice: тех, кто обвинял его
  rationale: μωμάομαι означает порицать, винить или обвинять; «обвинял» соответствует контексту, не вводя более узкого понятия клеветы в основной текст.
- source_word: δόξαν αἰώνιον
  choice: вечную славу
  rationale: Традиционное, ясное и точное соответствие устойчивому греческому выражению.
theological_decisions:
- issue: Женский субъект глаголов
  choice: Местоимение «Она», относящееся к олицетворённой Премудрости из ближайшего контекста
  alternative: Повторить в начале стиха имя «Премудрость»
  rationale: Греческий текст продолжает речь о Премудрости без повторного называния; местоимение сохраняет связность и литературное олицетворение.
- issue: Характер власти прежних господ Иосифа
  choice: «кто господствовал над ним»
  alternative: «его угнетателями» или «теми, кто тиранил его»
  rationale: Формулировка сохраняет властно-негативный оттенок τυραννέω и одновременно не усиливает его до единственно возможного смысла «тиранить».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранены женское олицетворение Премудрости, конкретный образ ямы и необычное множественное число «скипетры».
