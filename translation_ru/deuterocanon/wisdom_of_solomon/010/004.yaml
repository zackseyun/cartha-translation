base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/004.yaml
  text: Because of him[a], when the earth was being flooded, wisdom again saved it, steering the righteous man by means of a humble piece of wood.
translation:
  language: ru
  text: Из-за него[a], когда земля была охвачена потопом, мудрость снова спасла её, направляя праведника посредством невзрачного дерева[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть из-за нечестивца, упомянутого в предыдущем стихе; возможно также: «через него».'
    reason: Уточняет наиболее вероятную причинную отсылку δι’ ὃν, сохраняя грамматически возможный более буквальный вариант.
  - marker: b
    text: 'Буквально: «посредством непримечательного (или малоценного) дерева». Имеется в виду ковчег; глагол «направляя» описывает управление судном.'
    reason: Сохраняет необычный образ εὐτελοῦς ξύλου и поясняет его связь с ковчегом и морским значением κυβερνήσασα.
lexical_decisions:
- source_word: δι' ὃν
  choice: Из-за него
  rationale: Оборот с винительным падежом естественно передаёт причинное значение и сохраняет местоименную отсылку к нечестивцу из предыдущего стиха.
- source_word: κατακλυζομένην γῆν
  choice: когда земля была затопляема
  rationale: Сохраняет пассивное и продолжающееся значение причастия, а γῆ в контексте потопа передано как «земля».
- source_word: πάλιν διέσωσεν
  choice: снова спасла
  rationale: Прямо передаёт πάλιν и значение безопасного проведения через опасность у διασῴζω.
- source_word: σοφία
  choice: мудрость
  rationale: Строчная буква сохраняет олицетворение мудрости, не превращая слово в собственное имя.
- source_word: δι' εὐτελοῦς ξύλου
  choice: посредством невзрачного дерева
  rationale: «Невзрачного» передаёт низкую ценность и непримечательность εὐτελής без современного оттенка плохого качества, присущего слову «дешёвый»; «дерево» сохраняет материальный образ ξύλον и намеренную сжатость греческого текста.
- source_word: τὸν δίκαιον
  choice: праведника
  rationale: Естественное русское обозначение праведного мужчины; в контексте подразумевается Ной, но имя в основной текст не добавлено.
- source_word: κυβερνήσασα
  choice: направляя
  rationale: Передаёт управление судном, оставаясь естественным при олицетворённом подлежащем «мудрость»; морской смысл пояснён в примечании.
theological_decisions:
- issue: Олицетворение мудрости
  choice: мудрость как действующее олицетворённое начало со строчной буквы
  alternative: «Мудрость» как квазисобственное имя
  rationale: Греческий текст изображает σοφία лично действующей, но сам по себе не требует оформления слова как имени или отдельной ипостаси.
- issue: Отсылка местоимения δι' ὃν
  choice: «него» относится к нечестивцу из предыдущего стиха
  alternative: сохранить отсылку совершенно без пояснения
  rationale: Причинное чтение соответствует ближайшему контексту, однако неоднозначная местоименная форма сохранена в тексте и разъяснена только в сноске.
- issue: Кого обозначает τὸν δίκαιον
  choice: подразумевается Ной, но имя не вставлено
  alternative: перевести «Ноя»
  rationale: Так сохраняется формулировка источника и одновременно не затемняется контекст потопа.
