base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/009.yaml
  text: Those who have trusted in him will understand truth[a], and the faithful will remain with him in love[b], because grace and mercy are for his chosen ones.
translation:
  language: ru
  text: Те, кто доверился Ему, поймут истину, а верные останутся с Ним[a] в любви, ведь благодать и милость — для Его избранных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут ждать Его». Греческий глагол может означать как продолжительное пребывание с кем-либо, так и ожидание кого-либо.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для избранных Им».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πεποιθότες ἐπʼ αὐτῷ
  choice: те, кто доверился Ему
  rationale: Перфектное причастие передаёт доверие, возникшее ранее и сохраняющееся как устойчивое состояние. «Доверился Ему» естественно выражает направленность доверия в современном русском языке.
- source_word: συνήσουσιν ἀλήθειαν
  choice: поймут истину
  rationale: Будущее время συνίημι прямо означает «поймут», а отсутствие артикля при ἀλήθειαν позволяет не уточнять выражение до «всей истины» или иной более определённой формулы.
- source_word: οἱ πιστοὶ
  choice: верные
  rationale: В контексте слово обозначает людей, сохраняющих верность; перевод «верные» также поддерживает параллелизм с теми, кто доверился Богу, не сводя смысл лишь к обозначению религиозной группы.
- source_word: ἐν ἀγάπῃ
  choice: в любви
  rationale: Сжатая греческая формулировка не уточняет, чья именно любовь имеется в виду. Буквальный и естественный оборот «в любви» сохраняет эту открытость.
- source_word: προσμενοῦσιν αὐτῷ
  choice: останутся с Ним
  rationale: προσμένω с дательным может выражать продолжительное пребывание при ком-либо или ожидание кого-либо. В данном контексте «останутся с Ним» естественно передаёт устойчивую близость, а альтернативный смысл отмечен в сноске.
- source_word: χάρις καὶ ἔλεος
  choice: благодать и милость
  rationale: Это прозрачные, общепринятые русские соответствия, сохраняющие различие двух греческих понятий и их богословскую насыщенность.
- source_word: τοῖς ἐκλεκτοῖς αὐτοῦ
  choice: для Его избранных
  rationale: Формулировка ясно передаёт принадлежность избранных Богу и значение дательного адресата, не добавляя в стих позднейших догматических уточнений.
theological_decisions:
- issue: 'Значение πιστοὶ: верность или только вера'
  choice: верные
  alternative: верующие
  rationale: В контексте испытанной праведности слово естественно указывает на стойкую верность. При этом перевод не разрывает смысловую связь с предшествующим доверием Богу.
- issue: Значение προσμενοῦσιν αὐτῷ
  choice: останутся с Ним
  alternative: будут ждать Его
  rationale: Контекст участи праведных поддерживает значение продолжительного пребывания с Богом, однако глагол допускает и значение ожидания, поэтому оно сохранено в сноске.
- issue: Характер любви в ἐν ἀγάπῃ
  choice: в любви без уточнения её субъекта
  alternative: в любви к Нему / в Его любви
  rationale: Греческий текст не определяет прямо, идёт ли речь об их любви к Богу, Божьей любви к ним или любви как сфере отношений; перевод сохраняет эту богословскую многозначность.
- issue: Передача ἐκλεκτοῖς
  choice: Его избранных
  alternative: избранных Им
  rationale: Оба варианта выражают божественное избрание; выбранный вариант короче и естественнее, не развивая учение об избрании сверх сказанного в стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» в отношении Бога оформлено с прописной буквы согласно принятой русской религиозной издательской практике. Синтаксис остаётся ясным для широкого читателя; неоднозначности слов προσμένω и ἀγάπη не устранены толкованием.
