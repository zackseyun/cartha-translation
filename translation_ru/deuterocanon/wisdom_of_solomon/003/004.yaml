base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/004.yaml
  text: For even if they are punished in the sight of men[a], their hope is full of immortality.
translation:
  language: ru
  text: Ведь даже если в глазах людей они терпят наказание[a], их надежда полна бессмертия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвергаются вразумлению»; также возможно: «терпят взыскание». Греческий глагол может обозначать как карательное, так и исправительное страдание; слова «в глазах людей» подчёркивают отличие внешней видимости от окончательной реальности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὄψει ἀνθρώπων
  choice: в глазах людей
  rationale: Передаёт человеческую точку зрения и подчёркивает различие между внешней видимостью и подлинной участью праведных.
- source_word: ἐὰν κολασθῶσιν
  choice: даже если ... они терпят наказание
  rationale: Глагол κολάζω может обозначать как карательное наказание, так и исправительное взыскание. Выбран сильный и естественный русский эквивалент, а возможная двусмысленность отмечена в сноске.
- source_word: ἡ ἐλπὶς αὐτῶν
  choice: их надежда
  rationale: Естественная русская передача принадлежности надежды праведным.
- source_word: ἀθανασίας
  choice: бессмертия
  rationale: Обычное и точное соответствие ἀθανασία в контексте книги Премудрости; родительный падеж передаёт содержание, которым исполнена надежда.
- source_word: πλήρης
  choice: полна
  rationale: Кратко и точно передаёт предикативное значение πλήρης при подразумеваемой связке.
theological_decisions:
- issue: Характер страдания праведных
  choice: «терпят наказание» при сохранении рамки «в глазах людей»
  alternative: «подвергаются вразумлению» или «терпят взыскание»
  rationale: Фраза «в глазах людей» сохраняет напряжение между внешним впечатлением о наказании и окончательной участью праведных, не превращая их страдание в однозначный приговор Бога.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достойная и понятная. Союз «ведь» передаёт καὶ γάρ, а конструкция «даже если» — уступительный смысл καὶ ... ἐάν.
