  text: And the eunuch who has not worked lawlessness with his hand, nor conceived evil things against the Lord, will be given the chosen grace of faith and a more delightful inheritance in the temple of the Lord.
translation:
  language: ru
  text: И скопцу, который своей рукой не совершил беззакония и не замышлял зла против Господа, будут даны избранная благодать веры[a] и более желанный удел[b] в храме Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избранный дар веры», «избранная благодать верности» или «избранная благодать доверия». Греческое выражение кратко и допускает несколько оттенков как для слова «благодать», так и для слова «вера».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «более приятная доля» либо «более желанный жребий» в храме Господа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχος
  choice: скопец
  rationale: Точное обозначение евнуха; оно сохраняет конкретный социальный и телесный смысл слова в контексте.
- source_word: ὁ μὴ ἐργασάμενος ἐν χειρὶ ἀνόμημα
  choice: который не совершил рукой беззакония
  rationale: «Совершил» естественно передаёт ἐργάζομαι применительно к дурному поступку, а единственное число «рукой» сохраняет конкретный образ греческого текста.
- source_word: μηδὲ ἐνθυμηθεὶς κατὰ τοῦ κυρίου πονηρά
  choice: и не замышлял зла против Господа
  rationale: ἐνθυμέομαι здесь обозначает внутреннее обдумывание или замысел; оборот «зло против Господа» сохраняет направленность враждебного намерения.
- source_word: δοθήσεται
  choice: будет дана
  rationale: Прямое соответствие будущему времени страдательного залога.
- source_word: τῆς πίστεως χάρις ἐκλεκτὴ
  choice: избранная благодать веры
  rationale: 'Близко передаёт компактную и неоднозначную греческую конструкцию: χάρις может означать благодать, милость или дар, πίστις — веру либо верность, а ἐκλεκτή — избранную или превосходную.'
- source_word: κλῆρος
  choice: удел
  rationale: Передаёт значение назначенной доли или жребия, не добавляя прямо выраженной идеи наследования.
- source_word: ἐν ναῷ Κυρίου
  choice: в храме Господа
  rationale: Прямое и узнаваемое соответствие ναός и Κυρίου.
- source_word: θυμηρέστερος
  choice: более желанный
  rationale: Сохраняет сравнительную степень и значение большей приятности или желанности; грамматически согласуется со словом «удел».
theological_decisions:
- issue: Значение πίστις в выражении τῆς πίστεως χάρις ἐκλεκτή
  choice: вера
  alternative: верность; доверие
  rationale: Основной текст сохраняет традиционное и широкое «вера», а примечание отражает реальную смысловую открытость существительного и всей сжатой конструкции.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» является естественным библейским соответствием и не вносит в текст непредставленное различение.
- issue: Соотношение χάρις и πίστις
  choice: благодать веры
  alternative: дар веры; благодать за верность; избранный дар верности
  rationale: Греческий родительный оборот не уточняет однозначно вид связи между словами; основной перевод сохраняет его компактность, а варианты вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Скопец», «беззаконие», «благодать», «удел» и «Господь» сохраняют достоинство и смысловую плотность исходного текста; синтаксис упрощён до естественного русского порядка без снятия богословской неоднозначности.
