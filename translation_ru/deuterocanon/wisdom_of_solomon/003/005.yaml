  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/005.yaml
  text: And after being disciplined a little[a], they will receive great good[c][b], because God tested them and found them worthy of himself.
translation:
  language: ru
  text: И, пройдя через недолгое вразумление[a], они получат великие блага[b], потому что Бог испытал их и нашёл достойными Себя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пройдя через небольшое вразумление» или «будучи вразумлены лишь немного»; греческое выражение может указывать как на краткость, так и на небольшую меру вразумления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они будут щедро облагодетельствованы». Греческий текст говорит о получении великих благ.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «достойными для Себя». Выражение подчёркивает, что они признаны достойными по отношению к Самому Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: недолгое
  rationale: Передаёт вероятное значение ограниченной продолжительности и сохраняет контраст с μεγάλα; греческая форма допускает также ограниченную меру.
- source_word: παιδευθέντες
  choice: претерпев вразумление
  rationale: Сохраняет сочетание воспитательного и исправительного смысла παιδεύω, не сводя его ни к обучению, ни исключительно к наказанию.
- source_word: μεγάλα εὐεργετηθήσονται
  choice: они получат великие блага
  rationale: Естественно по-русски передаёт будущую пассивную форму εὐεργετέω и μεγάλα как великие благодеяния или блага, даруемые им.
- source_word: ἐπείρασεν
  choice: испытал
  rationale: Обозначает проверку и выявление качеств, не создавая смысла склонения ко злу.
- source_word: ἀξίους ἑαυτοῦ
  choice: достойными Себя
  rationale: Близко передаёт конструкцию с родительным падежом и сохраняет направленность оценки на Самого Бога, не уточняя её как принадлежность или предназначение.
theological_decisions:
- issue: Связь страдания с Божьим испытанием
  choice: Бог испытал их
  alternative: Бог проверил их / подверг их испытанию
  rationale: Формулировка сохраняет утверждение текста о Божьем испытании, но не истолковывает страдание как наказание и не разворачивает отсутствующее в стихе учение о его причинах.
- issue: Смысл выражения ἀξίους ἑαυτοῦ
  choice: достойными Себя
  alternative: достойными для Себя
  rationale: 'Буквальная и богословски открытая формулировка сохраняет неясность: речь может идти о достоинстве по отношению к Богу либо о пригодности для Него.'
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Претерпев вразумление» несколько возвышенно, но понятно и позволяет передать пассивный, воспитательно-исправительный оттенок греческого причастия. Местоимение «Себя» написано с прописной буквы по принятой русской библейской традиции.
