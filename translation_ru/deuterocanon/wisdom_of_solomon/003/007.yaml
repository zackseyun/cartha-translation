lexical_decisions:
- source_word: καιρῷ
  choice: время
  rationale: Передаёт решающий, уместный момент, не добавляя отсутствующего в тексте уточнения «назначенное».
- source_word: ἐπισκοπῆς
  choice: посещение
  rationale: 'Сохраняет широту греческого слова: речь может идти о Божьем вмешательстве ради испытания, суда или оправдания.'
- source_word: ἀναλάμψουσιν
  choice: воссияют
  rationale: Передаёт яркое внезапное сияние и соответствует возвышенному образному строю стиха.
- source_word: σπινθῆρες
  choice: искры
  rationale: Прямой и ясный современному читателю эквивалент.
- source_word: καλάμῃ
  choice: стерня
  rationale: В данном огненном сравнении обозначает сухие стебли, по которым быстро распространяются искры.
- source_word: διαδραμοῦνται
  choice: побегут по
  rationale: Сохраняет образ стремительного движения через пространство; по-русски естественно сочетается со «стернёй».
theological_decisions:
- issue: Смысл выражения «во время их посещения»
  choice: Оставить широкое значение Божьего вмешательства в отношении праведных
  alternative: Явно истолковать как время их оправдания либо как время суда и испытания
  rationale: Контекст предполагает оправдание праведных, однако ἐπισκοπή само по себе допускает посещение, испытание, суд или благоприятное вмешательство; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. «Воссияют» сохраняет достоинство стиля, а синтаксис остаётся ясным и естественным.
