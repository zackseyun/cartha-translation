lexical_decisions:
- source_word: γενεᾶς
  choice: рода
  rationale: γενεά может обозначать поколение, род или потомство. В данном контексте, где речь идёт о детях и потомках, «род» естественно сохраняет коллективный и родовой смысл, не сводя его только к одному поколению.
- source_word: ἀδίκου
  choice: неправедного
  rationale: «Неправедный» передаёт нравственно-религиозное значение ἄδικος и согласуется с определяемым словом «род», не сужая смысл до юридической несправедливости.
- source_word: χαλεπὰ
  choice: тяжки
  rationale: χαλεπός означает тяжёлый, суровый, мучительный. Краткая форма «тяжки» сохраняет лаконичность и торжественную строгость греческой фразы.
- source_word: τὰ τέλη
  choice: концы
  rationale: Множественное число «концы» формально отражает τὰ τέλη и допускает смысл различных конечных исходов или судеб, хотя по-русски возможен и более гладкий единственный вариант «конец».
theological_decisions:
- issue: Следует ли понимать γενεᾶς ἀδίκου как нравственно охарактеризованное поколение или как род и потомство неправедного.
  choice: неправедного рода
  alternative: неправедного поколения; потомства неправедных
  rationale: Ближайший контекст говорит о потомстве, поэтому «род» сохраняет вероятный родовой оттенок. При этом примечание удерживает более широкий смысл γενεά и не превращает высказывание в однозначное учение о наследственной вине.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем. Инверсия «тяжки концы» сохраняет афористичность оригинала; лексическая неоднозначность γενεά вынесена в примечание.
