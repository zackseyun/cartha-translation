  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/017.yaml
  text: For even if they become long-lived[a], they will be counted as nothing[b], and in the end their old age will be dishonored.
translation:
  language: ru
  text: Ведь даже если они проживут долго, их сочтут за ничто, и под конец их старость будет лишена почёта.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν τε γὰρ
  choice: Ведь даже если
  rationale: Передаёт условно-уступительный смысл ἐὰν и связующую силу τε γὰρ естественным русским оборотом.
- source_word: μακρόβιοι γένωνται
  choice: они проживут долго
  rationale: Естественно выражает возможность достижения долголетия, заключённую в сочетании прилагательного μακρόβιοι с γένωνται.
- source_word: εἰς οὐθὲν λογισθήσονται
  choice: их сочтут за ничто
  rationale: Сохраняет пассивную оценочную семантику λογισθήσονται и резкость выражения εἰς οὐθέν.
- source_word: ἐπʼ ἐσχάτων
  choice: под конец
  rationale: Передаёт временное указание на заключительный период жизни без добавления отсутствующей в тексте интерпретации.
- source_word: ἄτιμον ... τὸ γῆρας αὐτῶν
  choice: их старость будет лишена почёта
  rationale: Сохраняет категорию чести и бесчестия в ἄτιμον и предикативное построение греческой фразы.
theological_decisions:
- issue: Нравственная оценка нечестивых при их долголетии
  choice: Долгая жизнь не обеспечивает им значимости и почёта.
  alternative: Понимать стих лишь как социальное наблюдение о репутации в старости.
  rationale: Контекст противопоставляет участь праведных и нечестивых, однако перевод не добавляет слов «перед Богом», которых в данном стихе нет.
translation_notes:
  register: Современный литературный русский язык; строй фразы сдержанный и торжественный. Сохранены оценочная резкость «за ничто» и мотив утраты почёта.
