  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/013.yaml
  text: For blessed is the undefiled barren woman[a], who has not known a bed in transgression[b]; she will have fruit at the visitation of souls.
translation:
  language: ru
  text: Ибо блаженна бесплодная женщина, неосквернённая, которая не познала ложа в грехе[a]; она обретёт плод во время посещения душ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не познала ложа в грехе». «Ложе» здесь служит иносказанием половой связи.'
    reason: lexical_alternative
  - marker: b
    text: «Посещение душ» может означать будущее Божье посещение или рассмотрение человеческих душ — время суда либо оправдания.
    reason: alternative_reading
lexical_decisions:
- source_word: μακαρία
  choice: блаженна
  rationale: «Блаженна» сохраняет возвышенную библейскую оценку и выражает не просто субъективное счастье или житейское благополучие.
- source_word: στεῖρα
  choice: неплодная
  rationale: Прилагательное прямо обозначает женщину, не способную иметь детей; субстантивированная форма «неплодная» естественна в данном изречении и поддерживает последующий контраст с плодом.
- source_word: ἀμίαντος
  choice: оставшаяся неосквернённой
  rationale: Передаёт отсутствие нравственного осквернения; причастная конструкция естественно связывает характеристику с последующим пояснением о греховном ложе.
- source_word: ἔγνω
  choice: не познала
  rationale: Сохраняет библейский эвфемизм сексуальной связи и словесную фактуру источника, не превращая перевод в толкование.
- source_word: κοίτην
  choice: ложа
  rationale: Буквально «ложе»; здесь это метонимия сексуальной связи. Возвышенное слово соответствует жанру и сохраняет образ оригинала.
- source_word: ἐν παραπτώματι
  choice: в грехе
  rationale: Естественно по-русски обозначает нравственно неправомерный характер связи, не уточняя вид проступка сверх греческого текста.
- source_word: ἕξει καρπὸν
  choice: обретёт плод
  rationale: 'Сохраняет метафору плода и намеренный парадокс: неплодная всё же будет иметь плод. «Обретёт» звучит естественнее буквального «будет иметь» и не утверждает физическое деторождение.'
- source_word: ἐν ἐπισκοπῇ
  choice: при посещении
  rationale: Сохраняет возможность как благосклонного Божьего посещения, так и проверки или суда, не сужая смысл до одного толкования.
- source_word: ψυχῶν
  choice: душ
  rationale: Прямое соответствие греческому слову, уместное в антропологическом и эсхатологическом контексте книги.
theological_decisions:
- issue: Смысл выражения «при посещении душ»
  choice: Будущее Божье посещение или рассмотрение участи человеческих душ, без уточнения, является ли оно прежде всего оправданием или судом.
  alternative: «В день суда» либо «когда Бог милостиво посетит души».
  rationale: Контекст говорит о посмертной участи и оправдании праведных, однако само греческое выражение допускает как благосклонное посещение, так и судебное рассмотрение; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Эвфемизм «познала ложа» и метафора плода сохранены ради образности и смыслового контраста оригинала; двусмысленность «посещения» не устранена.
