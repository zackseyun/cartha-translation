lexical_decisions:
- source_word: ἔδοξαν
  choice: казались
  rationale: Передаёт оценку наблюдателей, а не объективное утверждение, и сохраняет контраст с последующей Божьей перспективой.
- source_word: ἐν ὀφθαλμοῖς ἀφρόνων
  choice: в глазах неразумных
  rationale: Естественно передаёт греческий оборот и нравственно-духовный смысл ἀφρόνων, не сводя его к недостатку образования или ума.
- source_word: τεθνάναι
  choice: умершими
  rationale: Русская именная конструкция после «казались» естественно выражает результирующее состояние, обозначенное перфектным инфинитивом.
- source_word: ἐλογίσθη
  choice: был сочтён
  rationale: Передаёт пассивную форму и значение оценки или суждения со стороны наблюдателей.
- source_word: ἡ ἔξοδος αὐτῶν
  choice: их уход
  rationale: Сохраняет метафорическое значение ἔξοδος и не заменяет его прямым словом «смерть».
theological_decisions:
- issue: Метафорическое обозначение смерти словом ἔξοδος
  choice: их уход
  alternative: их смерть; их конец
  rationale: «Уход» сохраняет образность и напряжение между человеческим восприятием смерти праведных и раскрываемой далее действительностью.
- issue: Отсутствие дополнения к ἐλογίσθη в предоставленном греческом тексте
  choice: не восполнять смысл словом «бедствием» в основном тексте
  alternative: а их уход был сочтён бедствием
  rationale: Предоставленный источник заканчивается словами ἡ ἔξοδος αὐτῶν и запятой; κακοῦ в нём отсутствует. Восполнение изменило бы границы засвидетельствованного исходного текста.
