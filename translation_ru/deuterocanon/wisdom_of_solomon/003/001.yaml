  source_fidelity: 'Текст точно передаёт греческий оригинал: Δικαίων δὲ ψυχαί — «Но души праведных»; ἐν χειρὶ θεοῦ — «в руке Бога» с сохранением образа; усиленное οὐ μή ... ἅψηται — «никакое мучение никогда не коснётся их»; βάσανος передано словом «мучение». Синтаксическое отношение βάσανος к αὐτῶν передано естественным русским винительным управлением («коснётся их»).'
  naturalness: Фраза звучит естественно в современном литературном русском и сохраняет сдержанно-библейский регистр. Двойное усиление «никакое ... никогда не» уместно для передачи emphatic οὐ μή и не воспринимается как стилистическая ошибка. «В руке Бога» — понятный и литературно приемлемый библейский образ.
  terminology: «Праведные», «души», «Бог» и «мучение» выбраны последовательно и без конфессионального переосмысления. Примечание корректно сохраняет более широкую возможность βάσανος («тяжкое страдание») и не навязывает единственного оттенка. Маркер [a] стоит в конце утверждения, к которому относится лексическая альтернатива, и структурно корректен.
