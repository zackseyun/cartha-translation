base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/001.yaml
  text: But the souls of the righteous are in the hand of God[a], and no torment will ever touch them.
translation:
  language: ru
  text: Но души праведных — в руке Бога, и никакое мучение никогда не коснётся их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и никакое тяжкое страдание никогда не коснётся их». Греческое βάσανος может означать сильное страдание или мучение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαίων
  choice: праведных
  rationale: Родительный падеж множественного числа субстантивированного δίκαιος передаёт нравственно-богословскую категорию естественным для русского библейского языка словом «праведные».
- source_word: ψυχαὶ
  choice: души
  rationale: В ближайшем контексте речь продолжается за пределами видимой смерти; «души» прямо сохраняет антропологическую и эсхатологическую значимость ψυχαί, не уточняя её сверх сказанного в тексте.
- source_word: ἐν χειρὶ θεοῦ
  choice: в руке Бога
  rationale: Сохранён понятный библейский образ, способный выражать Божью власть, принадлежность Ему и защиту, без сведения его к одному толкованию.
- source_word: οὐ μὴ ἅψηται
  choice: никогда не коснётся
  rationale: Сочетание «никакое… никогда не» естественно передаёт усиленное отрицание οὐ μή с аористом конъюнктива и ожидаемую направленность утверждения.
- source_word: βάσανος
  choice: мучение
  rationale: Слово передаёт сильное страдание или мучение; в данном контексте оно сохраняет интенсивность βάσανος лучше, чем более слабые «боль» или «испытание».
theological_decisions:
- issue: Значение ψυχαί применительно к существованию после смерти
  choice: Сохранить в основном тексте «души»
  alternative: «жизни» или «люди»
  rationale: Ближайший контекст говорит о праведных после их видимой смерти. «Души» сохраняет богословскую силу текста, не привнося разработанной антропологической доктрины.
- issue: Смысл образа ἐν χειρὶ θεοῦ
  choice: 'Передать буквально: «в руке Бога»'
  alternative: «под Божьей защитой» или «под Божьей опекой»
  rationale: Буквальный образ понятен по-русски и сохраняет совокупность смыслов — власть, принадлежность и защиту, — тогда как пояснительный перевод сузил бы метафору.
- issue: Объём значения βάσανος
  choice: В основном тексте «мучение», с примечанием об альтернативе
  alternative: «тяжкое страдание»
  rationale: «Мучение» хорошо передаёт интенсивность слова, но греческое βάσανος допускает и более общее значение тяжкого страдания; неоднозначность отмечена, а не устранена.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно библейской образностью. Тире после подлежащего подчёркивает контраст, вводимый δέ, не утяжеляя фразу; образ «в руке Бога» сохранён буквально. Маркер примечания поставлен после всего утверждения, к которому относится лексическая альтернатива.
