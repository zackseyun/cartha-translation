  text: But the ungodly will have punishment according to what they reasoned[b][a], having neglected the righteous man and having departed from the Lord.
translation:
  language: ru
  text: Нечестивые же понесут наказание сообразно своим помыслам,[a] ибо они пренебрегли праведником[b] и отступили от Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соответственно тому, как они рассуждали»; возможно также: «за то, что они замышляли». Греческое выражение связывает их наказание с их собственными мыслями, расчётами или намерениями.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «праведным человеком»; буквально: «праведника». Единственное число, вероятно, указывает на образ праведника в рассуждении книги.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: нечестивые
  rationale: Передаёт как нравственную порочность, так и отсутствие благоговения перед Богом; естественно для литературного русского языка.
- source_word: καθʼ ἃ ἐλογίσαντο
  choice: соответственно своим замыслам
  rationale: Сохраняет соответствие наказания их собственным мыслям, расчётам или намерениям, не сводя выражение исключительно к злому умыслу.
- source_word: ἕξουσιν ἐπιτιμίαν
  choice: понесут наказание
  rationale: Естественно передаёт будущее ἕξουσιν и значение ἐπιτιμία как кары или наказания.
- source_word: ἀμελήσαντες τοῦ δικαίου
  choice: потому что пренебрегли праведником
  rationale: Причастие передано причинной конструкцией для ясного современного русского синтаксиса; τοῦ δικαίου сохранено как личное существительное мужского рода в единственном числе.
- source_word: τοῦ κυρίου ἀποστάντες
  choice: отступили от Господа
  rationale: «Отступили» точно передаёт удаление и отказ от верности, не прибегая к более узкому техническому термину «отпали от веры».
theological_decisions:
- issue: Референт τοῦ δικαίου
  choice: праведник — единичная личная фигура, представляющая праведного человека в ближайшем контексте
  alternative: праведные как собирательное понятие или праведность как абстрактный принцип
  rationale: Артикль и форма единственного числа, а также ход рассуждения в Прем 2–5 поддерживают личный референт; перевод не сужает его до прямо названной мессианской идентификации.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: В иудейском греческом контексте слово обозначает Бога; «Господь» сохраняет богословский вес и привычную библейскую форму.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Причастные обороты греческого текста переданы причинной конструкцией; сохранены единственное число «праведник» и богословски значимое «Господь».
