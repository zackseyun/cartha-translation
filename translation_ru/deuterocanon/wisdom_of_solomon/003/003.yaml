lexical_decisions:
- source_word: πορεία
  choice: уход
  rationale: В контексте смерти праведников слово обозначает их удаление от оставшихся в живых. «Уход» сохраняет образ движения и не заменяет его прямым словом «смерть».
- source_word: ἀφʼ ἡμῶν
  choice: от нас
  rationale: Передаёт пространственно-личное отношение к тем, кто остался, не превращая выражение в пояснительное «по нашему мнению».
- source_word: σύντριμμα
  choice: гибель
  rationale: Слово обозначает сокрушение, разрушение, катастрофу. В данном контексте «гибель» естественно выражает кажущийся окончательным бедственный исход, не утверждая уничтожения как действительности.
- source_word: οἱ δὲ
  choice: но они
  rationale: Сохраняет резкий контраст между человеческим восприятием участи праведников и их подлинным состоянием.
- source_word: ἐν εἰρήνῃ
  choice: в мире
  rationale: 'Близко передаёт греческое выражение и сохраняет его смысловую широту: покой, безопасность и благополучие.'
theological_decisions:
- issue: Следует ли явно обозначить человеческое восприятие как кажущееся, хотя в данном полустишии нет отдельного глагола со значением «казаться»
  choice: казался гибелью
  alternative: был гибелью
  rationale: Оборот продолжает мысль предыдущего контекста о том, как неразумные оценивали участь праведников. Добавление подразумеваемого «казался» не выдаёт ошибочное человеческое суждение за объективную истину и сохраняет контраст с фразой «но они пребывают в мире».
translation_notes:
  register: Современный литературный русский язык; краткая, достоинственная формулировка. «Пребывают» выбрано для устойчивого состояния и смыслового контраста, без конфессионально окрашенного уточнения природы посмертного мира.
