lexical_decisions:
- source_word: ἐάν τε
  choice: даже если
  rationale: В контексте сочетание вводит уступительное условие; «даже если» естественно передаёт этот смысл по-русски.
- source_word: ὀξέως
  choice: скоро
  rationale: Наречие прежде всего указывает на быстроту; «скоро» сохраняет прямой смысл, не добавляя более толковательного значения «преждевременно».
- source_word: τελευτήσωσιν
  choice: умрут
  rationale: В данном контексте глагол означает окончание жизни; «умрут» ясно и естественно передаёт смысл.
- source_word: ἐλπίδα
  choice: надежды
  rationale: Обычное и контекстуально уместное соответствие, сохраняющее эсхатологическую направленность высказывания.
- source_word: ἡμέρᾳ διαγνώσεως
  choice: в день суда
  rationale: διάγνωσις может обозначать решение, распознание или судебную оценку; в контексте окончательного воздаяния «день суда» наиболее понятно, а подлинная лексическая неоднозначность отмечена в сноске.
- source_word: παραμύθιον
  choice: утешения
  rationale: Существительное обозначает утешение или ободрение; «утешение» точно и естественно в этом контексте.
theological_decisions:
- issue: Эсхатологический смысл выражения ἡμέρᾳ διαγνώσεως
  choice: день суда
  alternative: день решения; день распознания
  rationale: Контекст Премудрости 3 противопоставляет посмертную участь праведных и нечестивых, поэтому «день суда» передаёт вероятный эсхатологический смысл. Сноска сохраняет возможность более буквальных оттенков, не устраняя смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, ясная и достойная по тону. Сохранён параллелизм «нет надежды и нет утешения». Маркер сноски поставлен после выражения «день суда», к которому относится лексическая альтернатива.
