    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: дети
  rationale: Обычное обозначение детей или потомков; сохраняет семейный смысл и не ограничивает речь сыновьями.
- source_word: μοιχῶν
  choice: прелюбодеев
  rationale: Родительный падеж множественного числа обозначает людей, совершающих прелюбодеяние; краткий и прямой русский эквивалент.
- source_word: ἀτέλεστα
  choice: не достигнут полноты
  rationale: Передаёт отсутствие завершённости или полного развития, не уточняя, в чём именно оно состоит, и не приписывая детям нравственного несовершенства.
- source_word: ἐκ παρανόμου κοίτης
  choice: от беззаконного ложа
  rationale: Сохраняет правовой и нравственный оттенок παρανόμου и образ ложа как метонимии недозволенной половой связи.
- source_word: σπέρμα
  choice: потомство
  rationale: В данном контексте греческое «семя» обозначает потомков; «потомство» ясно передаёт коллективный смысл по-русски.
- source_word: ἀφανισθήσεται
  choice: исчезнет
  rationale: Передаёт пассивно-результативную идею устранения из виду, исчезновения или гибели, не усиливая её до однозначного «будет уничтожено».
theological_decisions:
- issue: Суровое суждение о детях, рождённых от прелюбодейной или беззаконной связи
  choice: Сохранить прямое и тяжёлое высказывание текста, не сводя его лишь к общественному порицанию.
  alternative: Истолковать стих исключительно как указание на социальную стигму или прямо сформулировать учение о наследуемой вине.
  rationale: Греческий текст связывает судьбу потомства с прелюбодеянием и беззаконным ложем, но не объясняет механизм этого суждения. Перевод сохраняет напряжение, не добавляя отсутствующей в стихе доктринальной конкретизации.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной краткости и резкости исходного изречения. «Не достигнут полноты» намеренно сохраняет смысловую открытость ἀτέλεστα; образ «беззаконного ложа» удерживает греческую метонимию, а сноска поясняет её.
