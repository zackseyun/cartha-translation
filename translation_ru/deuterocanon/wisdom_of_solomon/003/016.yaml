  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/016.yaml
  text: But the children of adulterers will be imperfect[b][a], and the offspring of an unlawful union will perish.
translation:
  language: ru
  text: Но дети прелюбодеев не достигнут полноты[a], и потомство от незаконного союза[b] исчезнет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не достигнут зрелости», «останутся незавершёнными». Греческое слово указывает на отсутствие завершённости или полного развития, не уточняя характера этого недостатка.'
