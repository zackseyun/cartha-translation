lexical_decisions:
- source_word: ὡς χρυσὸν
  choice: как золото
  rationale: Сохраняет прямое сравнение и образ драгоценного металла, подлинность которого проверяется огнём.
- source_word: ἐν χωνευτηρίῳ
  choice: в горниле
  rationale: χωνευτήριον обозначает приспособление или место для плавки и очистки металла; «горнило» естественно передаёт этот образ в возвышенном, но понятном русском языке.
- source_word: ἐδοκίμασεν
  choice: испытал
  rationale: Глагол δοκιμάζω означает проверку, выявляющую подлинность или качество; «испытал» сохраняет как смысл проверки, так и связь с образом золота.
- source_word: ὁλοκάρπωμα θυσίας
  choice: жертву всесожжения
  rationale: Передаёт культовый смысл приношения, сжигаемого целиком, и естественно выражает сочетание с θυσίας по-русски без избыточного повтора.
- source_word: προσεδέξατο
  choice: принял
  rationale: В контексте жертвоприношения глагол означает благосклонное принятие; «принял» сохраняет этот культовый оттенок без дополнительного истолкования.
theological_decisions:
- issue: Жертвенный образ ὁλοκάρπωμα θυσίας
  choice: жертву всесожжения
  alternative: всесожжение; жертву, сжигаемую целиком
  rationale: Перевод сохраняет конкретную храмовую метафору благосклонного принятия праведных и не сводит её к общему понятию жертвы. При этом он не уточняет сверх текста, кто именно приносит жертву и каким образом образ соотносится со страданиями праведных.
