  text: Like gold in a furnace he tested them[b][a], and like a whole burnt offering he accepted them.
translation:
  language: ru
  text: Как золото в горниле[a], он испытал их и, как жертву всесожжения, принял их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
