  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/012.yaml
  text: Their women are foolish[a], and their children are evil[b]; their offspring is accursed.
translation:
  language: ru
  text: Жёны их неразумны[a], дети их злы, и род их проклят[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женщины их». Греческое слово γυναῖκες в зависимости от контекста может означать как «жёны», так и «женщины».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потомство их»; возможен также смысл «их родовая линия». Греческое γένεσις может обозначать происхождение, потомство или род.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: жёны
  rationale: В сочетании с αὐτῶν и далее с упоминанием детей семейный контекст делает значение «жёны» наиболее естественным; возможное значение «женщины» сохранено в примечании.
- source_word: ἄφρονες
  choice: неразумны
  rationale: Передаёт недостаток рассудительности и понимания, сохраняя нравственно-интеллектуальную оценку без излишне разговорного оттенка.
- source_word: πονηρά
  choice: злы
  rationale: В данном контексте слово выражает нравственную порочность, а не просто плохое качество.
- source_word: τέκνα
  choice: дети
  rationale: Обычное и точное соответствие, позволяющее отличить непосредственных детей от более широкого понятия рода в последней части стиха.
- source_word: ἐπικατάρατος
  choice: проклят
  rationale: Сохраняет сильный и торжественный смысл состояния под проклятием; по-русски естественно сочетается со словом «род».
- source_word: γένεσις
  choice: род
  rationale: В семейном контексте обозначает происхождение, потомство или продолжающуюся родовую линию; «род» кратко и естественно сохраняет эту широту.
theological_decisions:
- issue: Сила осуждения семьи и потомства нечестивых
  choice: 'Сохранено прямое и суровое осуждение: жёны названы неразумными, дети — злыми, род — проклятым.'
  alternative: Смягчить высказывание, представив его как описание несчастья или неблагополучия.
  rationale: Греческий текст употребляет резкие предикативные определения и не даёт основания ослаблять нравственный и судебный смысл; напряжённость высказывания сохранена.
translation_notes:
