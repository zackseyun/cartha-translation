lexical_decisions:
- source_word: κρινοῦσιν
  choice: будут судить
  rationale: Будущее время κρίνω прежде всего передаёт судебное действие; возможный оттенок управления сохраняется контекстом и параллельной строкой.
- source_word: ἔθνη
  choice: народы
  rationale: Обычное значение — «народы»; перевод «язычники» внёс бы не выраженное здесь прямо противопоставление.
- source_word: κρατήσουσι
  choice: будут властвовать над
  rationale: С родительным падежом глагол выражает власть или господство; «властвовать над» естественно передаёт этот смысл и сохраняет отличие от βασιλεύσει.
- source_word: λαῶν
  choice: племенами
  rationale: Выбор позволяет в русском тексте различить λαοί и предшествующее ἔθνη. «Племена» здесь обозначает сообщества людей, а не только родовые группы.
- source_word: βασιλεύσει
  choice: будет царствовать
  rationale: Глагол прямо обозначает царское правление; «царствовать» сохраняет его образ и соответствует возвышенному, но понятному регистру.
- source_word: αὐτῶν
  choice: над ними
  rationale: Родительный падеж при βασιλεύω естественно передаётся как объект царствования. Местоимение оставлено без уточняющей замены, чтобы не устранять неоднозначность его отнесения.
- source_word: Κύριος
  choice: Господь
  rationale: Титул Κύριος в данном контексте передан традиционным и общеупотребительным русским соответствием «Господь».
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Греческий оборот выражает нескончаемую длительность; «вовеки» кратко и естественно передаёт её в современном литературно-библейском регистре.
theological_decisions:
- issue: К кому относится αὐτῶν в словах о царствовании Господа
  choice: Сохранено местоимение «над ними» без явного определения; в ближайшем контексте оно естественно может относиться к праведным.
  alternative: Его можно отнести шире — к только что упомянутым народам и племенам.
  rationale: Греческое местоимение само не устраняет неоднозначности. Сохранение местоименной формы не навязывает одно богословское прочтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллелизм двух первых глагольных сочетаний сохранён; «властвовать» и «царствовать» различают κρατέω и βασιλεύω. Архаизирующая форма «вовеки» остаётся прозрачной для современного читателя и уместна в кратком торжественном заключении.
