base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/015.yaml
  text: For the fruit of good labors is glorious[a], and the root of understanding does not fail.
translation:
  language: ru
  text: Ведь плод добрых трудов славен, а корень разумения неиссякаем[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоразумия»; или: «непреходящ».'
    reason: φρόνησις может обозначать как разумение в широком смысле, так и практическое благоразумие; ἀδιάπτωτος допускает передачу «непреходящ» наряду с «неиссякаем».
lexical_decisions:
- source_word: ἀγαθῶν πόνων
  choice: добрых трудов
  rationale: Сочетание передаёт нравственно положительный характер усилий и сохраняет значение напряжённого труда, не сводя его лишь к страданию.
- source_word: καρπός
  choice: плод
  rationale: Сохранена сельскохозяйственная метафора, образующая параллель с «корнем» во второй части стиха.
- source_word: εὐκλεής
  choice: славен
  rationale: Слово обозначает славу, доброе имя и почёт; краткое прилагательное естественно звучит в русском изречении и не ограничивает смысл только известностью.
- source_word: ἀδιάπτωτος
  choice: непоколебим
  rationale: Передаёт основное значение устойчивости и неспособности отпасть или потерпеть крах; применительно к корню сохраняет образ прочности.
- source_word: ῥίζα
  choice: корень
  rationale: Прямой эквивалент сохраняет параллельную образность «плод — корень».
- source_word: φρονήσεως
  choice: разумения
  rationale: Передаёт практическую способность верно понимать и рассуждать, при этом не смешивает φρόνησις с σοφία и сохраняет несколько возвышенный тон премудростной литературы.
theological_decisions:
- issue: Передача φρόνησις в терминологии книги Премудрости
  choice: разумение
  alternative: благоразумие; мудрость
  rationale: «Разумение» сохраняет практико-интеллектуальный оттенок φρόνησις и не отождествляет его без необходимости с σοφία; вариант «благоразумие» отмечен в сноске как более узкий, но возможный.
- issue: Образная структура плода и корня
  choice: сохранить обе метафоры
  alternative: передать смысл отвлечённо, например «добрые труды приносят славный и прочный результат»
  rationale: В греческом тексте две части изречения связаны сельскохозяйственными образами; их сохранение передаёт литературное построение без толковательного упрощения.
translation_notes:
  register: Современный литературный русский язык с достоинством премудростного изречения. Союз «ведь» передаёт γάρ, а «а» естественно оформляет параллель двух частей без усиления противопоставления.
