base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/011.yaml
  text: For miserable is the one who despises wisdom and instruction[a], and their hope is empty, their labors are unprofitable, and their works are useless.
translation:
  language: ru
  text: 'Ибо несчастен тот, кто презирает мудрость и наставление[a]: надежда таких людей пуста, их труды неразумны, а их дела бесполезны.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспитание», «дисциплину». Греческое παιδεία охватывает обучение, формирование характера и исправляющее воздействие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφίαν
  choice: мудрость
  rationale: 'Обычное значение в литературе Премудрости: нравственное и духовное разумение, а не только практическое умение.'
- source_word: παιδείαν
  choice: наставление
  rationale: Слово обозначает воспитание и обучение, включая исправляющую дисциплину; «наставление» естественно в паре с «мудростью», а более широкий оттенок отмечен в сноске.
- source_word: ὁ ἐξουδενῶν
  choice: тот, кто презирает
  rationale: Причастие выражает активное пренебрежение, отношение к чему-либо как к не имеющему значения.
- source_word: ταλαίπωρος
  choice: жалок
  rationale: Передаёт бедственное и достойное сожаления состояние без архаического оттенка.
- source_word: κενὴ ἡ ἐλπὶς αὐτῶν
  choice: надежда таких людей пуста
  rationale: «Пуста» непосредственно передаёт κενή; «таких людей» естественно обозначает переход греческого текста от единичного представителя к целой группе.
- source_word: οἱ κόποι ἀνόητοι
  choice: труды их неразумны
  rationale: ἀνόητοι буквально характеризует труды как лишённые разумения; перевод сохраняет отличие от следующего ἄχρηστα, означающего бесполезность.
- source_word: ἄχρηστα τὰ ἔργα αὐτῶν
  choice: дела бесполезны
  rationale: ἄχρηστα означает непригодные, не приносящие пользы; «дела» естественно передаёт ἔργα в данном нравственном контексте.
theological_decisions:
- issue: Переход от единственного числа ὁ ἐξουδενῶν к множественному αὐτῶν
  choice: Сохранить единичного представителя в начале («тот, кто»), а затем явно перейти к группе («таких людей… их»).
  alternative: 'Полностью унифицировать число: «те, кто презирает… их» или «тот, кто презирает… его».'
  rationale: Греческий текст сам переходит от обобщённого лица в единственном числе к множественному, представляя одного человека как тип целой группы. Русская формулировка сохраняет этот смысловой переход и избегает грамматической неясности.
- issue: Соотношение значений ἀνόητοι и ἄχρηστα
  choice: Различить их как «неразумны» и «бесполезны».
  alternative: 'Передать оба выражения через идею тщетности: «труды тщетны, дела бесполезны».'
  rationale: 'Так сохраняются два разных суждения источника: трудам недостаёт разумения, а дела не приносят пользы; богословское и нравственное напряжение не сводится к одной лишь безрезультатности.'
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Двоеточие перед перечислением естественно оформляет последствия названного презрения; лексически различены «неразумны» и «бесполезны».
