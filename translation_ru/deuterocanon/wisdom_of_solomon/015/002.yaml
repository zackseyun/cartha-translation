base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/002.yaml
  text: For even if we sin[a], we are yours, knowing your power; but we will not sin[c][b], knowing that we have been counted as yours.
translation:
  language: ru
  text: Ведь даже если мы согрешим, мы — Твои[a], зная Твоё могущество[b]; но мы не согрешим, зная, что сочтены Твоими[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы принадлежим Тебе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твою силу».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «причислены к Тебе». Греческий глагол означает «считать, учитывать, признавать» и здесь выражает принадлежность Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь даже
  rationale: «Ведь» передаёт пояснительную связь γάρ, а «даже» — уступительный оттенок условия, естественно вводя обе части высказывания.
- source_word: ἐὰν ἁμάρτωμεν
  choice: даже если мы согрешим
  rationale: Аорист сослагательного наклонения с ἐάν выражает возможное условие; перевод не превращает его ни в утверждение о совершённом грехе, ни в отвлечённую привычку.
- source_word: σοὶ ἐσμεν
  choice: мы — Твои
  rationale: Дательный σοὶ при глаголе «быть» обозначает принадлежность. Краткая русская формула сохраняет личный и заветный характер выражения.
- source_word: εἰδότες
  choice: зная
  rationale: Причастная форма сохранена в обеих половинах стиха; возможный причинный смысл остаётся доступен из контекста без пояснительной вставки.
- source_word: σου τὸ κράτος
  choice: Твоё могущество
  rationale: κράτος означает силу или могущество, особенно действенную и проявленную; «могущество» звучит естественно и не сужает смысл до политического владычества.
- source_word: οὐχ ἁμαρτησόμεθα
  choice: мы не согрешим
  rationale: Будущее время передано прямо. Повтор того же русского глагола сохраняет намеренное напряжение с предшествующим «если мы согрешим».
- source_word: ὅτι σοὶ λελογίσμεθα
  choice: что сочтены Твоими
  rationale: Перфект страдательного залога λογίζομαι передаёт устойчивый результат признания или причисления; «сочтены» сохраняет оттенок учёта, а «Твоими» — отношение принадлежности, выраженное дательным σοὶ.
theological_decisions:
- issue: Напряжение между «если мы согрешим» и «мы не согрешим»
  choice: Обе части переведены прямо, без согласующего истолкования.
  alternative: Передать вторую часть как призыв («не будем грешить») или как общее настоящее («мы не грешим»).
  rationale: Греческий текст одновременно допускает возможность греха и утверждает будущее несовершение греха в свете принадлежности Богу. Перевод сохраняет это риторическое и богословское напряжение.
- issue: Смысл принадлежности в σοὶ ἐσμεν и σοὶ λελογίσμεθα
  choice: 'Передать обе формулы как личную принадлежность Богу: «мы — Твои» и «сочтены Твоими».'
  alternative: 'Передать вторую формулу административно: «причислены к Тебе».'
  rationale: Одинаковое σοὶ связывает две части стиха, тогда как λογίζομαι добавляет во второй части метафору счёта или признания; выбранный перевод удерживает оба элемента.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают традиционный русский библейский регистр; лексика остаётся понятной без архаизмов.
