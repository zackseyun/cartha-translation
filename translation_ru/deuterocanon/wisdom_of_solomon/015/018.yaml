  text: Even the most hateful animals they revere; for[a], compared in foolishness with the others, they are worse.
translation:
  language: ru
  text: Даже самых отвратительных животных они почитают[a], ибо в неразумии они хуже остальных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклоняются» или «воздают почитание». Греческий глагол может обозначать религиозное почитание в широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ζῷα
  choice: животных
  rationale: ζῷον обозначает живое существо или животное; в контексте почитания их изображений обычное русское «животных» наиболее ясно.
- source_word: τὰ ἔχθιστα
  choice: самых отвратительных
  rationale: Превосходная степень передаёт крайнюю отрицательную оценку; «отвратительных» естественнее по-русски применительно к животным, чем буквальное «ненавистных».
- source_word: σέβονται
  choice: почитают
  rationale: σέβομαι выражает благоговейное, в данном контексте религиозное почтение, но само по себе не требует более узкого перевода «поклоняются».
- source_word: ἀνοίᾳ
  choice: по своему неразумию
  rationale: Дательный падеж указывает на признак или область сравнения; «неразумие» сохраняет нравственно-интеллектуальный оттенок ἄνοια.
- source_word: συγκρινόμενα τῶν ἄλλων
  choice: в сравнении с остальными
  rationale: Оборот естественно передаёт сравнительное значение причастия и генитива, не уточняя сверх текста, какие именно прочие животные имеются в виду.
- source_word: χείρονα
  choice: хуже
  rationale: Прямой и естественный эквивалент сравнительной формы χείρων.
theological_decisions:
- issue: Религиозная сила σέβονται
  choice: почитают
  alternative: поклоняются
  rationale: «Почитают» сохраняет религиозный оттенок в контексте идолопоклонства, не сужая широкого значения греческого глагола до конкретной формы культа.
translation_notes:
  register: Современный литературный русский язык; инверсия устранена ради ясности. Местоимение «те» ясно относит вторую часть к животным, а не к почитающим их людям; сравнительная конструкция и оценочная напряжённость оригинала сохранены.
