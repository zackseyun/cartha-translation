revisions:
- from: Ведь и горшечник, с трудом разминая мягкую землю, лепит из неё разные сосуды для наших нужд. Но из одной и той же глины он одинаково вылепляет и сосуды, служащие для чистых дел[a], и сосуды противоположного назначения. А как использовать каждый из них, решает сам горшечник.
  to: Ведь и горшечник, с трудом разминая мягкую землю, лепит каждый сосуд для наших нужд. Но из одной и той же глины он одинаково вылепляет и сосуды, предназначенные для чистого употребления[a], и сосуды противоположного назначения. Каково назначение каждого из них, решает горшечник.
  rationale: Правка устраняет добавленное значение в «разные», передаёт ἕκαστον как «каждый», уточняет функциональный смысл «чистых дел» без догматического сужения и восстанавливает в последней фразе вопрос о назначении каждого сосуда. Сноска сохраняет буквальный метафорический образ δοῦλα; «противоположное назначение» оставляет τὰ ἐναντία намеренно не конкретизированным.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:06:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Нужна небольшая правка. «Разные сосуды» добавляет различие, которого нет в распределительном ἕκαστον («каждый сосуд»). Заключительная фраза говорит о назначении каждого сосуда, а не о способе его использования. Остальные ключевые соответствия в целом верны: сохранено различение «мягкая земля» / «глина», трудоёмкость работы, а также неуточнённый характер τὰ ἐναντία.'
  naturalness: Текст в целом литературный и понятный. «Чистые дела» в применении к сосудам звучит несколько менее естественно, чем «чистое употребление»; последнее лучше передаёт функциональный контекст ἔργα. Формула «каково назначение каждого из них, решает горшечник» естественна и точнее исходного смысла.
  terminology: «Горшечник», «мягкая земля», «глина» и «сосуды» удачны. Метафорический оттенок δοῦλα следует сохранить в основном тексте через «предназначенные/служащие», а буквальный образ подчинённости пояснить в сноске, не превращая τὰ ἐναντία в прямо названное «нечистое» употребление.
  issues:
  - severity: medium
    issue: Добавлено значение различия в «разные сосуды».
    rationale: Ἕκαστον означает «каждый [сосуд]», а не «разные сосуды». Добавленное определение способно создать невыраженный в греческом акцент на различии изделий.
  - severity: medium
    issue: Заключительная фраза передана как «как использовать каждый из них».
    rationale: Τίς ἑκάστου ἐστὶν ἡ χρῆσις спрашивает, каково употребление/назначение каждого; κριτής обозначает того, кто это определяет или рассуживает. Речь не о практической инструкции по использованию.
  - severity: low
    issue: «Чистые дела» звучит в русском как действия, а не как сфера применения сосудов.
    rationale: В данном контексте ἔργα связано с употреблением и назначением. «Чистое употребление» сохраняет возможный ритуальный оттенок καθαρά, не сужая его.
