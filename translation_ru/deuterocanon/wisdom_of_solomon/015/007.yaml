base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/007.yaml
  text: For a potter[a], kneading soft earth with toil, molds each vessel for our service; yet from the same clay he formed both the vessels that are servants to clean uses and those for the contrary, all alike. But which is the use of each of them, the potter is the judge.
translation:
  language: ru
  text: Ведь и горшечник, с трудом разминая мягкую землю, лепит каждый сосуд для наших нужд. Но из одной и той же глины он одинаково вылепляет и сосуды, предназначенные для чистого употребления[a], и сосуды противоположного назначения. Каково назначение каждого из них, решает горшечник.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сосуды, порабощённые чистым делам [употреблениям]». Слово «предназначенные» передаёт метафору сосудов, подчинённых определённому употреблению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεραμεύς
  choice: горшечник
  rationale: Обычное и точное русское название мастера, изготовляющего глиняные сосуды.
- source_word: ἁπαλὴν γῆν
  choice: мягкую землю
  rationale: Сохранено буквальное «землю», поскольку далее автор отдельно употребляет πηλός — «глина».
- source_word: θλίβων ἐπίμοχθον
  choice: с трудом разминая
  rationale: Передаёт как физическое разминание или сдавливание материала, так и подчёркнутую тяжесть труда.
- source_word: πλάσσει ... ἕκαστον
  choice: лепит из неё разные сосуды
  rationale: В контексте подразумевается каждый отдельный сосуд; по-русски множественное число естественно передаёт распределительное значение ἕκαστον.
- source_word: πρὸς ὑπηρεσίαν ἡμῶν
  choice: для наших нужд
  rationale: Естественно выражает практическое назначение изготовляемых предметов без неуместной персонификации.
- source_word: ἐκ τοῦ αὐτοῦ πηλοῦ
  choice: из одной и той же глины
  rationale: Точный и естественный эквивалент, сохраняющий акцент на общем материале.
- source_word: τὰ τῶν καθαρῶν ἔργων δοῦλα σκεύη
  choice: сосуды, служащие для чистых дел
  rationale: 'Метафорическое δοῦλα передано глаголом «служащие»: сохраняется образ подчинённости назначению, но фраза остаётся естественной по-русски. Неоднозначность καθαρῶν как ритуально чистого или просто чистого сохраняется.'
- source_word: τὰ ἐναντία
  choice: сосуды противоположного назначения
  rationale: Греческий текст не называет их прямо «нечистыми», поэтому перевод не конкретизирует подразумеваемую противоположность.
- source_word: πάνθʼ ὁμοίως
  choice: одинаково вылепляет
  rationale: Наречное включение в сказуемое ясно передаёт одинаковый способ изготовления всех сосудов.
- source_word: κριτὴς ὁ πηλουργός
  choice: решает сам горшечник
  rationale: Передаёт роль мастера как определяющего назначение каждого изделия; «сам» воспроизводит эмфатическое заключительное положение субъекта.
theological_decisions:
- issue: Метафорическое значение δοῦλα применительно к сосудам
  choice: «сосуды, служащие для чистых дел» с пояснением в сноске
  alternative: «сосуды — рабы чистых дел» / «сосуды для чистого употребления»
  rationale: Буквальное «рабы» по-русски звучит неестественно применительно к неодушевлённым сосудам, тогда как «служащие» сохраняет метафору закреплённой службы и не сводит выражение к простому предлогу «для».
- issue: Характер противопоставленного употребления сосудов
  choice: «противоположного назначения»
  alternative: «для нечистых дел»
  rationale: Оригинал употребляет субстантивированное τὰ ἐναντία — «противоположные», не называя вторую категорию прямо нечистой; перевод сохраняет эту недосказанность.
- issue: Значение καθαρῶν
  choice: «чистых»
  alternative: «ритуально чистых» / «благородных»
  rationale: «Чистых» сохраняет возможную связь с чистотой употребления, включая ритуальный оттенок, не ограничивая значение одной интерпретацией.
translation_notes:
  register: Современный литературный русский язык с ясным, несколько возвышенным повествовательным строем. Сохранены смена «земля» — «глина», образ тяжёлой ручной работы и неоднозначность противопоставления чистого и противоположного назначения.
