base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/016.yaml
  text: For a man made them[a], and one who had borrowed the spirit formed them; for no man has the strength to fashion a god like himself.
translation:
  language: ru
  text: Ведь человек сделал их и, взяв дух[a] взаймы, вылепил их; ведь ни один человек не в силах вылепить бога, подобного себе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дыхание», «дыхание жизни». Греческое слово может здесь обозначать жизненное дыхание, которым мастер владеет лишь как взятым взаймы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: человек
  rationale: Слово употреблено в единственном числе и подчёркивает контраст между смертным изготовителем и мнимым богом; «человек» естественно и точно передаёт это значение без ненужного указания на пол.
- source_word: ἐποίησεν
  choice: сделал
  rationale: Широкий по значению глагол обозначает изготовление идолов; «сделал» ясно передаёт смысл и позволяет отличить его от последующего πλάσσω.
- source_word: τὸ πνεῦμα
  choice: дух
  rationale: «Дух» формально соответствует греческому слову и сохраняет возможность понимать его как дух или жизненное дыхание; альтернативный оттенок отмечен в сноске.
- source_word: δεδανεισμένος
  choice: взяв ... взаймы
  rationale: 'Сохраняет метафору заимствования: сам мастер обладает жизнью не от себя, а как полученной и временной.'
- source_word: ἔπλασεν / πλάσαι
  choice: вылепил / вылепить
  rationale: Глагол πλάσσω обозначает придание формы материалу и уместен в контексте изготовления идолов; «вылепить» сохраняет ремесленный и иронический оттенок.
- source_word: ὅμοιον
  choice: подобного себе
  rationale: Передаёт сходство изготовленного бога с самим человеком-мастером и сохраняет риторическую иронию текста.
- source_word: ἰσχύει
  choice: не в силах
  rationale: Выражает способность и силу, сохраняя подчёркнутую невозможность для человека создать настоящего бога.
- source_word: θεόν
  choice: бога
  rationale: В полемике с идолами речь идёт о мнимом божестве, а не об истинном Боге, поэтому используется строчная буква.
theological_decisions:
- issue: Смысл выражения «взяв дух взаймы» применительно к человеческой жизни
  choice: Изготовитель идола сам обладает духом и жизнью лишь как полученными, а не принадлежащими ему изначально.
  alternative: Понимать πνεῦμα преимущественно как физическое «дыхание» или «дыхание жизни», подчёркивающее смертность.
  rationale: Основной текст сохраняет широкое слово «дух» и метафору займа, не устраняя возможный оттенок жизненного дыхания; тем самым подчёркивается зависимость человека и бессилие созданного им идола.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Повтор «ведь» отражает два γάρ; «сделал» и «вылепил» сохраняют различие между ποιέω и πλάσσω. Метафора займа оставлена явной, а неоднозначность πνεῦμα вынесена в сноску.
