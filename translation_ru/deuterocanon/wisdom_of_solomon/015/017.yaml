  rationale: Исправлены шероховатость «создаёт мёртвое», возможная оценочная двусмысленность «лучше» и необязательный временной оттенок «некогда». Перевод сохраняет структуру, антитезу и неопределённость греческого νεκρόν, а также не сужает σεβάσματα до «идолов» в основном тексте.
