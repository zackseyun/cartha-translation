base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/017.yaml
  text: Yet being mortal[a], he makes a dead thing with lawless hands; for he is better than the things he worships, since he himself once lived, but those never did.
translation:
  language: ru
  text: 'Но, будучи смертным, он беззаконными руками создаёт нечто мёртвое; ведь он превосходит предметы своего почитания[a]: сам он жил, а они никогда не жили.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих идолов».'
    reason: Лексически более конкретная, контекстуально возможная передача τῶν σεβασμάτων αὐτοῦ.
lexical_decisions:
- source_word: θνητὸς
  choice: смертным
  rationale: Передаёт подверженность смерти и сохраняет противопоставление совершенно безжизненному идолу.
- source_word: νεκρὸν
  choice: мёртвое
  rationale: Субстантивированное прилагательное обозначает нечто мёртвое; такая передача естественна в контексте изготовления идолов и не создаёт ошибочной ассоциации с трупом.
- source_word: ἐργάζεται
  choice: создаёт
  rationale: В контексте ремесленного изготовления означает «делает, производит»; «создаёт» ясно выражает действие изготовителя.
- source_word: χερσὶν ἀνόμοις
  choice: беззаконными руками
  rationale: Сохраняет инструментальное значение и прямой смысл ἀνόμοις как находящихся вне закона, не сводя выражение к общему «злыми».
- source_word: κρείττων
  choice: лучше
  rationale: Передаёт широкое сравнительное значение без преждевременного уточнения, в чём именно состоит превосходство изготовителя.
- source_word: τῶν σεβασμάτων αὐτοῦ
  choice: тех, кому поклоняется
  rationale: Передаёт предметы почитания через естественную русскую конструкцию; контекст ясно указывает на идолов, но сам термин шире слова «идолы».
- source_word: ἔζησεν
  choice: некогда жил
  rationale: Аорист утверждает, что изготовитель обладал жизнью; «некогда» подчёркивает контраст с теми, кто не жил никогда.
- source_word: οὐδέποτε
  choice: никогда
  rationale: Кратко и ясно отрицает какое-либо обладание жизнью у предметов поклонения.
theological_decisions:
- issue: Передача σεβάσματα в контексте обличения идолопоклонства
  choice: тех, кому поклоняется
  alternative: своих идолов; предметов своего почитания
  rationale: Выбранная формулировка сохраняет смысл поклонения и полемический контекст, но не подменяет более широкое греческое существительное контекстуально верным, однако более истолковательным словом «идолы».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксический параллелизм финала сохранён; тире делает противопоставление естественным и выразительным.
