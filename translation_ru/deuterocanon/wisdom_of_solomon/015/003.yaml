  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/003.yaml
  text: For to know you is complete righteousness[a], and to know your power is the root of immortality.
translation:
  language: ru
  text: Ибо знать Тебя — совершенная праведность[a], и знать Твою силу — корень бессмертия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершенная справедливость»: «Ибо знать Тебя — совершенная справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασθαί
  choice: знать
  rationale: Инфинитив обозначает знание и осознание; простой глагол «знать» естественно передаёт смысл и поддерживает параллелизм с εἰδέναι.
- source_word: ὁλόκληρος
  choice: полнота
  rationale: Предикативное сочетание ὁλόκληρος δικαιοσύνη выражает праведность во всей её полноте; именная конструкция «полнота праведности» естественна по-русски и сохраняет смысл целостности.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: В контексте познания Бога слово обозначает полноту правильного отношения к Нему; «праведность» сохраняет богословскую широту, тогда как «справедливость» может восприниматься преимущественно в общественно-правовом смысле.
- source_word: εἰδέναι
  choice: знать
  rationale: Основное значение — знать, осознавать. Одинаковый перевод обоих греческих глаголов сохраняет ясный синтаксический параллелизм, не навязывая сомнительного смыслового различия.
- source_word: κράτος
  choice: сила
  rationale: Слово обозначает действенную мощь; «сила» звучит естественно и не сужает значение до политического владычества.
- source_word: ῥίζα
  choice: корень
  rationale: Сохранена явная и понятная метафора греческого текста, которую не следует сглаживать словами «источник» или «основание».
- source_word: ἀθανασίας
  choice: бессмертие
  rationale: «Бессмертие» — точный и общепринятый русский эквивалент, соответствующий возвышенному философско-богословскому регистру книги.
theological_decisions:
- issue: Значение δικαιοσύνη в контексте богопознания
  choice: праведность
  alternative: справедливость
  rationale: Связь познания Бога с бессмертием указывает на всеобъемлющую правильность отношений с Богом, а не только на общественную или судебную справедливость. Альтернативное лексическое значение отмечено в сноске, чтобы сохранить смысловую широту греческого слова.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным ритмом. Обращённые к Богу местоимения написаны с прописной буквы. Параллелизм двух оборотов «знать…» сохранён; метафора корня оставлена без поясняющего расширения.
