  terminology: «Золотых и серебряных дел мастера» — естественное современное литературное обозначение χρυσουργοί и ἀργυροχόοι. «Мастера, работающие с бронзой» передаёт χαλκοπλάσται без спорного уточнения способа изготовления. «Подделки» обоснованно передаёт κίβδηλα и сохраняет отрицательно-иронический оттенок.
