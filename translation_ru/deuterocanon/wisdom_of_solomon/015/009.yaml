  source_fidelity: 'В целом смысл передан верно: мастер не думает о собственной немощи и краткости жизни, соревнуется с ремесленниками, подражает бронзовых дел мастерам и гордится изготовлением κίβδηλα. Однако «вскоре» добавляет временную конкретизацию, которой μέλλει само по себе не требует; лучше передать предстоящее событие без неоправданного указания на близкий срок. «Мастера по золоту и серебру» звучит неестественно и менее точно расчленяет две профессии.'
