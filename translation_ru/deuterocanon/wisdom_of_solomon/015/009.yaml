base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/009.yaml
  text: Yet his concern is not that he is about to grow weary[a], nor that his life is short; rather, he competes with goldsmiths and silversmiths, imitates bronze-workers[b], and considers it a glory that he molds counterfeit things.
translation:
  language: ru
  text: Но его заботит не то, что ему предстоит изнемочь[a], и не то, что жизнь его недолговечна; напротив, он соперничает с золотых и серебряных дел мастерами, подражает мастерам, работающим с бронзой, и считает славой то, что изготавливает подделки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заболеет»; греческий глагол может обозначать как изнеможение, так и болезнь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ложные изделия»; греческое слово также употребляется о фальшивом или низкопробном.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φροντίς
  choice: заботит
  rationale: Передаёт то, что занимает мысли мастера, не усиливая значение до тревоги или страха.
- source_word: μέλλει κάμνειν
  choice: вскоре он изнеможет
  rationale: Сочетание выражает предстоящее ослабление или изнеможение и подчёркивает бренность мастера.
- source_word: βραχυτελῆ βίον
  choice: жизнь его коротка
  rationale: Естественно по-русски передаёт жизнь, быстро приходящую к концу.
- source_word: ἀντερείδεται
  choice: соперничает с
  rationale: Глагол обозначает состязательное противостояние и соответствует ироническому изображению притязаний ремесленника.
- source_word: χρυσουργοῖς καὶ ἀργυροχόοις
  choice: с мастерами по золоту и серебру
  rationale: Ясное современное обозначение двух названных в греческом тексте ремёсел без громоздкой кальки.
- source_word: χαλκοπλάστας
  choice: мастерам, отливающим бронзу
  rationale: Передаёт ремесленников, формующих изделия из бронзы; конкретность материала сохранена.
- source_word: μιμεῖται
  choice: подражает
  rationale: Сохраняет прямой смысл глагола и оттенок вторичности его мастерства.
- source_word: δόξαν ἡγεῖται
  choice: почитает за славу
  rationale: Сохраняет возвышенную и одновременно ироническую оценочную формулу оригинала.
- source_word: κίβδηλα
  choice: подделки
  rationale: Слово обозначает фальшивые, неподлинные или низкопробные изделия; в контексте изготовления идолов «подделки» ёмко сохраняют материальный и нравственный оттенки.
- source_word: πλάσσει
  choice: лепит
  rationale: Конкретно передаёт формование изделий и соответствует контексту работы мастера с податливым материалом.
theological_decisions:
- issue: Ироническая оценка гордости изготовителя идолов
  choice: Фраза подчёркивает, что смертный мастер гордится изготовлением неподлинных вещей.
  alternative: Передать κίβδηλα нейтральнее как «изделия-подражания», ослабив нравственную оценку.
  rationale: Контекст обличения идолопоклонства и значение κίβδηλα поддерживают отрицательную оценку, но перевод не добавляет к ней конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический контраст «не то… и не то…; напротив» сохраняет ход греческой фразы; ремесленная лексика сделана понятной без устаревших профессиональных наименований.
