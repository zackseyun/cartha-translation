base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/008.yaml
  text: And with wicked toil he molds a futile god from the same clay—he who a little before had come from the earth[a], and after a short time goes back to the earth from which he was taken, when the debt of his soul is demanded.
translation:
  language: ru
  text: И этот несчастный труженик лепит из той же глины никчёмного бога — он, незадолго до того возникший из земли и вскоре уходящий туда, откуда был взят, когда с него взыщут долг его души[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долг его жизни». Греческое слово ψυχή может означать как «душу», так и «жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακόμοχθος
  choice: трудясь во зло
  rationale: Передаёт и значение тяжкого труда, и отрицательную нравственную характеристику занятия; наречная конструкция естественнее по-русски, чем буквальное редкое прилагательное.
- source_word: θεὸν μάταιον
  choice: ничтожного бога
  rationale: «Ничтожный» выражает пустоту, несостоятельность и бесполезность рукотворного божества, сохраняя иронию греческого текста.
- source_word: πλάσσει
  choice: лепит
  rationale: Глагол обозначает придание формы и в контексте глины естественно передаётся русским «лепит».
- source_word: ἐκ τοῦ αὐτοῦ πηλοῦ
  choice: из той же глины
  rationale: Сохраняет подчёркнутое тождество материала идола и прочих глиняных изделий.
- source_word: ὃς
  choice: он
  rationale: Местоимение отнесено к мастеру, а не к идолу; повтор «он» ясно обозначает действующее лицо.
- source_word: πρὸ μικροῦ ἐκ γῆς γενηθεὶς
  choice: незадолго до того возникший из земли
  rationale: Сохраняет временную близость и широкое значение γενηθεὶς, не сужая его до буквального рождения.
- source_word: μετʼ ὀλίγον πορεύεται
  choice: вскоре уходящий
  rationale: Передаёт близость смерти и движение к названному далее месту, не добавляя глаголу излишней конкретики.
- source_word: ἐξ ἧς ἐλήμφθη
  choice: туда, откуда был взят
  rationale: Место назначения естественно выводится из упомянутой земли; формулировка сохраняет отзвук повествования о сотворении человека.
- source_word: τὸ τῆς ψυχῆς ἀπαιτηθεὶς χρέος
  choice: когда с него взыщут долг его души
  rationale: «Взыщут долг» точно сохраняет метафору обязательства и требование возврата; ψυχή передано как «душа», а допустимое значение «жизнь» отмечено в сноске.
theological_decisions:
- issue: Значение ψυχή в контексте человеческой смертности
  choice: душа
  alternative: жизнь
  rationale: «Душа» сохраняет антропологическую лексику и богословское напряжение оригинала; поскольку ψυχή может обозначать также жизнь, этот вариант не исключён, а указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной поэзии. Причастные обороты сохраняют плотную структуру греческой фразы, а лексика остаётся понятной широкому читателю.
