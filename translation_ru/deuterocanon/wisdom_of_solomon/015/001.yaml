  source_fidelity: Перевод точно передаёт противопоставление Σὺ δέ («Но Ты»), обращение «наш Бог», четыре характеристики Бога и всеобщий характер διοικῶν τὰ πάντα. «Всем управляешь с милосердием» естественно воспроизводит настоящее действие и обстоятельство образа действия ἐλέει, не сужая «всё» до одного мироздания и не добавляя богословских выводов.
