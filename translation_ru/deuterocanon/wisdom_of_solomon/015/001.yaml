  text: Но Ты, наш Бог, благ и истинен, долготерпелив и всем управляешь с милосердием.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Но Ты
  rationale: Передаёт прямое обращение и контраст, выраженный частицей δέ; формулировка естественна для современного русского языка.
- source_word: χρηστός
  choice: благ
  rationale: Слово обозначает доброту и благость; «благ» кратко, достойно по регистру и уместно как характеристика Бога.
- source_word: ἀληθής
  choice: истинен
  rationale: Сохраняет широкое значение истинности и подлинности характера Бога, не сужая его до одной лишь правдивости речи.
- source_word: μακρόθυμος
  choice: долготерпелив
  rationale: Передаёт терпение и медлительность на гнев; слово остаётся понятным в современном литературном русском и точнее простого «терпелив».
- source_word: ἐλέει
  choice: с милосердием
  rationale: Творительный по смыслу оборот передаёт дательный образа действия и сохраняет существительное «милосердие».
- source_word: διοικῶν
  choice: управляешь
  rationale: Передаёт продолжающееся Божье устроение и управление всем сущим; личная глагольная форма естественно согласуется в русском с обращением «Ты».
- source_word: τὰ πάντα
  choice: всем
  rationale: Кратко и полно передаёт всеохватность греческого выражения без добавления более узкого понятия «вселенная».
theological_decisions:
- issue: Божье управление и милосердие в причастном обороте
  choice: «всем управляешь с милосердием» — Бог представлен как управляющий всем, причём это управление совершается с милосердием
  alternative: «милостиво всё устрояешь»
  rationale: Выбранный вариант сохраняет одновременно всеохватность Божьего управления и милосердный образ его осуществления, не превращая текст в утверждение какой-либо более разработанной доктринальной системы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Благ», «истинен» и «долготерпелив» сохраняют достоинство оригинала, оставаясь понятными; синтаксис сделан естественным для прямого обращения.
