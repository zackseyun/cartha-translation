lexical_decisions:
- source_word: ἐπλάνησεν
  choice: ввела в заблуждение
  rationale: Передаёт как обман, так и уклонение с верного пути; в данном контексте звучит естественно и сохраняет смысл заблуждения.
- source_word: ἀνθρώπων κακότεχνος ἐπίνοια
  choice: искусная в злом выдумка людей
  rationale: Сохраняет связь κακότεχνος с искусным изготовлением и одновременно его отрицательную нравственную оценку; ἐπίνοια передано как замысел-изобретение.
- source_word: σκιαγράφων
  choice: живописцев
  rationale: Греческое слово обозначает художников, работающих очертаниями, светотенью или иллюзорной живописью; в основном тексте выбран ясный русский род деятельности, а специальный оттенок пояснён в сноске.
- source_word: πόνος ἄκαρπος
  choice: бесплодный труд
  rationale: Естественное русское сочетание, точно выражающее усилие, не приносящее подлинной пользы.
- source_word: εἶδος
  choice: образ
  rationale: В контексте идолопоклонства обозначает зримое изготовленное изображение, сохраняя также более широкий смысл формы или облика.
- source_word: σπιλωθὲν
  choice: запятнанный
  rationale: Сохраняет конкретный образ нанесённых красок и отрицательную окраску глагола, не сводя его только к нейтральному раскрашиванию.
- source_word: χρώμασιν διηλλαγμένοις
  choice: разными красками
  rationale: Передаёт различие цветов; «краски» естественно соответствует контексту живописного изображения.
theological_decisions:
- issue: Передача полемики против искусства, служащего изготовлению идолов
  choice: Сохранить нравственное осуждение человеческой выдумки и бесплодности труда, не осуждая изобразительное искусство вообще.
  alternative: Передать выражения нейтрально как простое художественное творчество или, напротив, распространить осуждение на всякую живопись.
  rationale: Греческий текст порицает конкретную искусную выдумку и изготовленный образ в контексте идолопоклонства; κακότεχνος и ἄκαρπος требуют отрицательной оценки, но не дают основания осуждать всякое искусство.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной образностью. Синтаксис сохраняет парную конструкцию «ни… ни…», а тире связывает бесплодный труд с его результатом — раскрашенным образом. Все маркеры сносок включены в основной текст.
