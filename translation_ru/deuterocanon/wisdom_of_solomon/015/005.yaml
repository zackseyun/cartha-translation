base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/005.yaml
  text: The sight of them comes to fools as a reproach[a], and they long for the form of a lifeless image.
translation:
  language: ru
  text: Их вид оказывается позором для неразумных[a], и они жаждут бездыханной формы мёртвого образа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их вид становится позором для неразумных, и [кто-то] желает бездыханной формы мёртвого образа». Греческий глагол «желает» стоит в единственном числе, а его субъект формально не назван; в основном тексте подразумеваемыми субъектами названы неразумные, что соответствует контексту.'
    reason: Сохраняет сведения о сжатом и формально неоднозначном греческом синтаксисе ποθεῖ, не навязывая буквальное, но неясное прочтение.
lexical_decisions:
- source_word: ὄψις
  choice: вид
  rationale: Слово может обозначать зрелище, внешний вид или облик. «Их вид» естественно передаёт здесь видимый облик изображений и сохраняет связь относительного ὧν с предшествующим контекстом.
- source_word: ἄφροσιν
  choice: для безумных
  rationale: Ἄφρων обозначает человека, лишённого разумения и мудрости. «Безумные» сохраняет нравственный контраст книги между мудростью и неразумием.
- source_word: εἰς ὄνειδος ἔρχεται
  choice: оборачивается … позором
  rationale: 'Оборот передаёт результат: вид изображений становится для безумных причиной или знаком позора. «Оборачивается позором» звучит естественно по-русски, не устраняя оттенка последующего результата.'
- source_word: ποθεῖ
  choice: они жаждут
  rationale: Глагол выражает сильное желание. В русском подразумеваемым субъектом сделаны «безумные», как того требует смысл контекста, хотя греческий синтаксис с единственным числом сжат и допускает более буквальное, но неясное прочтение.
- source_word: νεκρᾶς εἰκόνος
  choice: мёртвого образа
  rationale: Сочетание буквально характеризует изображение как мёртвое. «Образ» сохраняет широкий смысл εἰκών и не сужает его до статуи или идола определённого типа.
- source_word: εἶδος
  choice: облик
  rationale: Εἶδος означает видимую форму или наружность. «Облик» отличает это слово от ранее употреблённого ὄψις и остаётся понятным современному читателю.
- source_word: ἄπνουν
  choice: бездыханного
  rationale: Буквально — «не имеющего дыхания». «Бездыханный» сохраняет образ отсутствия дыхания и усиливает намеренную характеристику изображения как неживого.
theological_decisions:
- issue: Субъект желания во второй части стиха
  choice: 'Подразумеваемым субъектом названы безумные: «они жаждут».'
  alternative: 'Буквально связать глагол единственного числа с «видом»: «и вид жаждет…»; либо оставить неопределённое «человек жаждет».'
  rationale: Греческая конструкция с ποθεῖ сжата и формально неоднозначна. Контекст обличает влечение неразумных людей к изображениям; явное местоимение даёт понятный русский текст, а сноска сохраняет сведения о синтаксической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной образностью. Сочетание «бездыханного облика мёртвого образа» намеренно сохраняет двойное подчёркивание безжизненности в νεκρᾶς … ἄπνουν; «безумные» соответствует устойчивому нравственному словарю Премудрости.
