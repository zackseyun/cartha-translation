  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/011.yaml
  text: because he did not know the one who formed him[b][a], and the one who breathed into him an active soul and breathed into him a life-giving spirit.
translation:
  language: ru
  text: потому что он не познал[a] того, кто образовал его, вдохнул в него деятельную душу[b] и вдунул в него жизнетворный дух.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не признал».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «душу, способную действовать»; более толковательно: «живую душу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγνόησεν
  choice: не познал
  rationale: Передаёт отсутствие знания или узнавания, не уточняя без основания, было ли оно простым неведением или сознательным непризнанием.
- source_word: πλάσαντα
  choice: образовал
  rationale: Сохраняет смысл придания формы и творческую образность глагола πλάσσω, не добавляя прямо не названного материала.
- source_word: ἐμπνεύσαντα
  choice: вдохнул в него
  rationale: Передаёт конкретный образ вложения дыхания и сохраняет отзвук повествования о сотворении человека.
- source_word: ψυχὴν ἐνεργοῦσαν
  choice: деятельную душу
  rationale: Сохраняет прямой смысл ἐνεργοῦσαν — действующую, деятельную — и не сводит выражение к более толковательному «живую душу».
- source_word: ἐμφυσήσαντα
  choice: вдунул в него
  rationale: Отличает второй глагол дыхания от ἐμπνεύσαντα и одновременно сохраняет параллелизм и подразумеваемое направление действия на человека.
- source_word: πνεῦμα ζωτικόν
  choice: жизнетворный дух
  rationale: Передаёт отдельно πνεῦμα и ζωτικόν, сохраняя значение духа, сообщающего жизнь, и не уподобляя выражение дословно формуле «дыхание жизни».
theological_decisions:
- issue: Различение ψυχή и πνεῦμα в описании человека
  choice: 'Передать разными словами: «душа» и «дух»'
  alternative: Обобщить оба понятия как жизнь или дыхание
  rationale: Греческий текст намеренно употребляет два разных существительных в параллельных оборотах. Их различение сохраняется без навязывания поздней систематической антропологии.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Слова «душа» и «дух» сохранены раздельно; два греческих глагола дыхания переданы как «вдохнул» и «вдунул». Местоименные обозначения Бога не капитализированы, поскольку прописная буква отсутствует в исходном различении и не нужна для ясности.
