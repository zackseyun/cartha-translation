base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/015.yaml
  text: For they even considered all the idols of the nations to be gods—things that have neither the use of eyes for seeing[a], nor noses for drawing in air, nor ears to hear, nor fingers of hands for feeling, and their feet are useless for walking.
translation:
  language: ru
  text: Ведь они сочли богами даже всех идолов народов, у которых нет ни глаз, чтобы видеть, ни ноздрей, чтобы втягивать воздух[a], ни ушей, чтобы слышать, ни пальцев на руках, чтобы осязать, а ноги их неспособны ходить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дышать воздухом»; буквально: «ноздрей для втягивания воздуха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλογίσαντο
  choice: сочли
  rationale: Передаёт значение «признали, стали считать кем-либо» кратко и естественно, сохраняя оценочный характер глагола.
- source_word: εἴδωλα τῶν ἐθνῶν
  choice: идолов народов
  rationale: «Идолы» сохраняет полемический смысл культовых изображений, а «народов» прямо передаёт ἐθνῶν без привнесения новозаветного оттенка слова «язычники».
- source_word: ὀμμάτων χρῆσις εἰς ὅρασιν
  choice: глаз, чтобы видеть
  rationale: Естественная русская передача функциональной конструкции; смысл отсутствия способности видеть сохранён без тяжеловесного буквального оборота «употребления глаз для зрения».
- source_word: ῥῖνες εἰς συνολκὴν ἀέρος
  choice: ноздрей, чтобы втягивать воздух
  rationale: Сохраняет конкретный образ втягивания воздуха и параллельное перечисление частей тела и их функций.
- source_word: δάκτυλοι χειρῶν εἰς ψηλάφησιν
  choice: пальцев на руках, чтобы осязать
  rationale: «Осязать» точно передаёт ψηλάφησις как восприятие посредством прикосновения; «пальцев на руках» звучит по-русски естественнее буквального «пальцев рук».
- source_word: ἀργοὶ πρὸς ἐπίβασιν
  choice: неспособны ходить
  rationale: В контексте неподвижных идолов передаёт функциональную бесполезность ног для шага и передвижения ясным современным языком.
theological_decisions:
- issue: Сила полемики против идолов
  choice: Идолы представлены как безжизненные предметы, которых ошибочно сочли богами.
  alternative: Смягчить «идолы» до нейтрального «изображения».
  rationale: Контекст и εἴδωλα требуют сохранить прямую религиозную полемику, не добавляя к ней толкований.
- issue: Значение ἐθνῶν
  choice: народов
  alternative: язычников
  rationale: «Народов» сохраняет широкое значение греческого слова и не усиливает конфессионально окрашенное противопоставление.
translation_notes:
  register: Современный литературный русский язык; достоинство и ритмический параллелизм исходного перечисления сохранены. Синтаксис слегка сглажен ради ясности, без устранения полемической силы текста.
