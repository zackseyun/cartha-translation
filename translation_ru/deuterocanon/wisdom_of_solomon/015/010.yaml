lexical_decisions:
- source_word: σποδός
  choice: пепел
  rationale: Прямой именной предикат передаёт образ внутренней опустошённости и ничтожности; «пепел» естественен в русском библейско-поэтическом регистре.
- source_word: καρδία
  choice: сердце
  rationale: Сохраняет широкий библейский смысл внутреннего средоточия человека, не сужая его до ума или чувств.
- source_word: γῆς
  choice: земли
  rationale: Родительный падеж выражает основание сравнения; «земля» сохраняет широкий вещественный образ и параллель с глиной.
- source_word: εὐτελεστέρα
  choice: ничтожнее
  rationale: Передаёт крайнюю малую ценность без неуместного сведения смысла к денежной дешевизне.
- source_word: ἐλπίς
  choice: надежда
  rationale: Обычное и точное соответствие, уместное для ложного упования в контексте обличения идолопоклонства.
- source_word: πηλοῦ
  choice: глины
  rationale: В контексте изготовления идолов «глина» точнее, чем «грязь», и поддерживает образ вещественного материала.
- source_word: ἀτιμότερος
  choice: презреннее
  rationale: Передаёт отсутствие чести и уважения; по-русски звучит естественнее буквального «бесчестнее» применительно к жизни.
- source_word: βίος
  choice: жизнь
  rationale: В трёхчастном ряду «сердце — надежда — жизнь» обозначает всё человеческое существование.
