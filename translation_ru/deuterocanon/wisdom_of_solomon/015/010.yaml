- issue: Метафорическая сила трёх характеристик идолопоклонника
  choice: Сохранить прямые метафоры и резкие сравнительные оценки без смягчения.
  alternative: Передать как уподобление («сердце его подобно пеплу») или психологическое пояснение.
  rationale: В греческом тексте употреблены прямой именной предикат и сравнительные формы; такая передача сохраняет полемическую силу и богословское напряжение текста.
