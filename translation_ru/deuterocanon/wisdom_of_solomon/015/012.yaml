base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/012.yaml
  text: But he considered our life to be a game[a], and our way of life a profitable festival; for, he says, one must get resources from wherever one can[b], even from evil.
translation:
  language: ru
  text: Но он счёл нашу жизнь игрой[a], а наш жизненный путь — прибыльным празднеством; ведь, говорит он, средства нужно добывать, откуда только возможно[b], даже из зла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «забавой».'
    reason: Существительное παίγνιον может обозначать игру, забаву или предмет развлечения.
  - marker: b
    text: 'Или: «наживаться нужно на чём угодно, даже на неправедном деле»; возможно также: «извлекать средства из любых обстоятельств, даже из беды».'
    reason: Оборот допускает более явное указание на неправедный способ наживы либо, менее вероятно в данном контексте, на дурные обстоятельства как источник выгоды.
lexical_decisions:
- source_word: ἐλογίσατο
  choice: счёл
  rationale: Аорист λογίζομαι передаёт осознанную оценку; «счёл» естественно выражает её в русском повествовании.
- source_word: παίγνιον
  choice: игрой
  rationale: Слово обозначает нечто игровое, служащее забавой. «Игра» сохраняет образ и не вносит излишне разговорного оттенка слова «шутка».
- source_word: ζωὴν
  choice: жизнь
  rationale: Основное значение слова; противопоставление с βίος сохраняется посредством выражения «жизненный путь».
- source_word: βίον
  choice: жизненный путь
  rationale: Передаёт течение и уклад земной жизни, не повторяя буквально уже употреблённое ζωή; экономический оттенок контекста раскрывается последующими словами о прибыли и добывании средств.
- source_word: πανηγυρισμὸν
  choice: празднеством
  rationale: Сохраняет образ торжественного праздничного собрания и соответствует возвышенному литературному регистру.
- source_word: ἐπικερδῆ
  choice: прибыльным
  rationale: Передаёт корыстный, коммерческий оттенок прилагательного и его прямую связь с «празднеством».
- source_word: δεῖν
  choice: нужно
  rationale: Естественно передаёт безличную необходимость в косвенно цитируемом утверждении.
- source_word: ὅθεν δὴ κἂν
  choice: откуда угодно
  rationale: Выражает подчёркнутое безразличие к источнику приобретаемых средств.
- source_word: ἐκ κακοῦ
  choice: из зла
  rationale: Сохраняет широкую нравственную категорию исходного выражения и не сводит его безусловно к конкретному виду неправедного поступка.
- source_word: πορίζειν
  choice: добывать средства
  rationale: Передаёт значение приобретения или обеспечения средствами и поддерживает материально-корыстный смысл контекста.
theological_decisions:
- issue: Нравственный смысл ἐκ κακοῦ
  choice: '«даже из зла»: получение выгоды из нравственного зла или посредством него'
  alternative: '«даже из беды / дурных обстоятельств»: извлечение выгоды из несчастья'
  rationale: Контекст обличает корыстное и нравственно испорченное мировоззрение, поэтому основной перевод сохраняет нравственный смысл «зла». Более слабое обстоятельственное понимание остаётся возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим премудростной книге. Синтаксический параллелизм ζωή/βίος сохранён как «жизнь / жизненный путь», а коммерческая направленность выражена словами «прибыльным» и «добывать средства».
