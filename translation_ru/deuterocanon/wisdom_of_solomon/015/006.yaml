base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/006.yaml
  text: Lovers of evil are worthy of such hopes[b][a], both those who make them and those who desire them and those who worship them.
translation:
  language: ru
  text: Любящие зло — те, кто изготавливает их, те, кто желает их, и те, кто поклоняется им, — достойны таких надежд[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достойны подобных надежд». Эти слова отсылают к надеждам, связанным с идолами в окружающем контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακῶν ἐρασταί
  choice: любящие зло
  rationale: Сочетание передаёт нравственный смысл родительного множественного κακῶν и значение ἐρασταί как людей, привязанных любовью или влечением ко злу; по-русски естественнее единственное собирательное «зло», чем «злые дела» или «зло́в».
- source_word: ἄξιοί τε τοιούτων ἐλπίδων
  choice: достойны таких надежд
  rationale: Сохранены предикативное значение ἄξιοι и указательная сила τοιούτων. Несколько резкое сочетание намеренно удерживает ироническую связь между идолопоклонниками и надеждами, возлагаемыми на идолов.
- source_word: οἱ δρῶντες
  choice: те, кто создаёт их
  rationale: Само δρῶντες буквально означает «делающие», однако в ближайшем контексте речь идёт об изготовлении идолов. «Создаёт их» передаёт подразумеваемый объект и остаётся менее узким, чем «вырезает» или «лепит».
- source_word: οἱ ποθοῦντες
  choice: те, кто желает их
  rationale: ποθέω обозначает сильное желание или стремление. «Желает» звучит ясно и литературно, не усиливая значение до «жаждет» без необходимости.
- source_word: οἱ σεβόμενοι
  choice: те, кто поклоняется им
  rationale: В религиозном контексте σέβομαι выражает почитание и поклонение; «поклоняется» ясно передаёт культовый смысл.
theological_decisions:
- issue: Подразумеваемый объект трёх причастий
  choice: Передать его местоимениями «их/им», относящимися к идолам из контекста; для δρῶντες употребить «создаёт».
  alternative: 'Оставить объект невыраженным: «те, кто делает, желает и поклоняется», либо понять δρῶντες как общее «творящие зло».'
  rationale: В греческом объект восстанавливается из окружающего рассуждения об изготовленных идолах. Русский текст требует его обозначить для ясности, но прямое называние «идолов» в самом стихе добавило бы слово, отсутствующее в нём. Контекст указывает, что δρῶντες — изготовители изображений, а не вообще совершающие зло.
- issue: Оценочный смысл выражения «достойны таких надежд»
  choice: Сохранить буквальную конструкцию и её возможную иронию.
  alternative: Разъяснить как «заслуживают участи, на которую надеются» или «заслуживают таких ожиданий».
  rationale: ἐλπίδων означает «надежд» или «ожиданий», а τοιούτων отсылает к надеждам, связанным с идолами. Развёрнутая передача преждевременно определила бы, идёт ли речь прежде всего о ложности надежд или об ожидаемой участи.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной синтаксической структурой. Повтор «и те, кто» сохраняет трёхчастный ритм греческого текста; местоименные формы поддерживают связь с идолами из контекста, не вводя лишнего уточнения в основной текст.
