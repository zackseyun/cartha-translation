lexical_decisions:
- source_word: οὐδʼ ὅσον ἐπιποθῆσαι
  choice: не настолько красиво, чтобы его желать
  rationale: Передаёт отрицательное сравнение и инфинитив естественной современной русской конструкцией, не усиливая смысл до полной невозможности желания.
- source_word: ὡς ἐν ζῴων ὄψει καλὰ τυγχάνει
  choice: как желают прекрасных с виду живых существ
  rationale: Связывает красоту с внешним видом живых существ и сохраняет сравнительный смысл; синтаксическая неоднозначность греческого оборота отмечена в сноске.
- source_word: ἐκπέφευγεν
  choice: его миновали
  rationale: 'Передаёт перфектный результат и отрицательный для предмета смысл: похвала и благословение не достались ему. Это яснее по-русски, чем буквальное «оно избежало», которое могло бы звучать как успешное или намеренное уклонение.'
- source_word: τὸν τοῦ θεοῦ ἔπαινον
  choice: Божья похвала
  rationale: Близко передаёт греческий генитив, не сводя его безоговорочно к более толковательному «одобрению от Бога».
- source_word: τὴν εὐλογίαν αὐτοῦ
  choice: Его благословение
  rationale: Прямой и естественный перевод; местоимение относится к Богу.
theological_decisions:
- issue: К чему относится подразумеваемое подлежащее
  choice: Местоимение «оно» продолжает речь об изготовленном изображении или идоле как представителе своего класса.
  alternative: Речь может идти о самом изображённом животном или шире — о живых существах.
  rationale: Ближайший контекст направлен против рукотворных изображений, но перевод не добавляет слова «идол» и тем самым не устраняет полностью референциальную напряжённость.
- issue: Смысл ἐκπέφευγεν применительно к Божьей похвале и благословению
  choice: 'Отрицательное лишение: они миновали предмет, и он их не получил.'
  alternative: Буквальное «оно избежало» могло бы обозначать намеренное или благоприятное избавление.
  rationale: Контекст осуждения требует ясно передать утрату, а не удачное уклонение, сохраняя при этом образ движения мимо.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Формулировка понятна широкому читателю; неоднозначность первой части не скрыта, а вынесена в сноску. Заглавное «Его» употреблено по принятой русской библейской традиции для ясной отсылки к Богу.
