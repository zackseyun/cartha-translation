  verdict: approve
  source_fidelity: 'Перевод верно передаёт все основные элементы греческого текста: πάντες («все они»), усиленную превосходную степень ἀφρονέστατοι («крайне неразумны»), сравнительный оборот τάλανες ὑπὲρ ψυχὴν νηπίου («несчастнее души младенца»), а также приложение о врагах народа и их угнетении. «Крайне неразумны» несколько менее формально выражает превосходную степень, чем «самые неразумные», но надёжно передаёт её интенсивное значение и не меняет смысла. Местоимение «его» обоснованно воспроизводит греческое αὐτόν, относящееся к грамматически единственному λαός («народ»).'
