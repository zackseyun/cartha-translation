  terminology: «Младенец», «душа», «народ» и «угнетавшие» уместны и терминологически нейтральны. Написание «Твоего» соответствует принятому благоговейному библейскому оформлению и не навязывает конфессионального истолкования. Сноска корректно отмечает диапазон ψυχή («душа/жизнь») и смысловую трудность сравнения, не представляя один вариант как несомненный.
