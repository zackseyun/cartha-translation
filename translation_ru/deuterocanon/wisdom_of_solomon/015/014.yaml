translation:
  language: ru
  text: Но все они крайне неразумны и несчастнее души младенца[a] — враги Твоего народа, угнетавшие его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «более достойны жалости, чем младенец»; возможно также: «несчастнее жизни младенца». Греческое выражение буквально сопоставляет их с «душой (или жизнью) младенца» и может подчёркивать крайнюю слабость и жалкое состояние.'
    reason: Лексическая и образная неоднозначность ψυχή и сжатого сравнительного оборота.
lexical_decisions:
- source_word: πάντες
  choice: все они
  rationale: Сохраняет всеохватность высказывания и естественно предваряет последующее приложение о врагах народа.
- source_word: ἀφρονέστατοι
  choice: крайне неразумны
  rationale: Передаёт превосходную степень и сильный смысловой акцент без устаревшего или чрезмерно разговорного оттенка.
- source_word: τάλανες ὑπὲρ ψυχὴν νηπίου
  choice: несчастнее души младенца
  rationale: Передаёт сравнительное употребление ὑπέρ и сохраняет необычный, сжатый греческий образ, не устраняя его неоднозначность.
- source_word: ψυχή
  choice: душа
  rationale: Сохраняет прямое значение греческого слова; возможное значение «жизнь» отмечено в сноске.
- source_word: νήπιος
  choice: младенец
  rationale: Точно обозначает совсем маленького ребёнка и сохраняет образ крайней слабости и беспомощности.
- source_word: οἱ ἐχθροὶ τοῦ λαοῦ σου
  choice: враги Твоего народа
  rationale: Прямо передаёт приложение, поясняющее, кого обозначают слова «все они».
- source_word: οἱ καταδυναστεύσαντες αὐτόν
  choice: угнетавшие его
  rationale: Причастная конструкция сохраняет завершённое действие аориста; «его» естественно согласуется с русским существительным «народ» и соответствует греческому местоимению мужского рода единственного числа.
theological_decisions:
- issue: Смысл сравнения ὑπὲρ ψυχὴν νηπίου
  choice: несчастнее души младенца
  alternative: более достойны жалости, чем младенец; несчастнее жизни младенца
  rationale: Греческое выражение допускает понимание ψυχή как «душа» или «жизнь» и сжато описывает жалкое, беспомощное состояние. Основной текст сохраняет буквальный образ, а сноска указывает возможные смысловые варианты, не превращая их в догматическое толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Необычность сравнения сохранена в основном тексте, но разъяснена в сноске. Местоимение «Твоего» оформлено с прописной буквы как традиционное уважительное обращение к Богу, без внесения конфессионально специфического толкования.
