lexical_decisions:
- source_word: ἀντί
  choice: вместо
  rationale: 'Передаёт замещение: вместо ожидаемого источника воды им досталось нечто иное.'
- source_word: πηγῆς
  choice: источника
  rationale: Сохраняет основной смысл родника или истока и естественно сочетается с последующим родительным оборотом.
- source_word: ἀενάου
  choice: вечно текущей
  rationale: Передаёт непрерывность течения, сохраняя наглядный образ греческого прилагательного.
- source_word: ποταμοῦ
  choice: реки
  rationale: Это обычное значение слова; более узкое «поток» здесь не требуется.
- source_word: αἵματι λυθώδει
  choice: мутной кровью
  rationale: Передаёт кровь как загрязнённую, илистую жидкость; буквальное «илистой кровью» по-русски звучало бы неестественно.
- source_word: ταραχθέντες
  choice: они были потревожены
  rationale: Сохраняет пассивную форму и смысл испытанного ими потрясения, не уточняя сверх текста, было ли оно прежде всего физическим или душевным.
theological_decisions:
- issue: Аллюзия на превращение воды Нила в кровь
  choice: Не добавлять слова «вода», «Нил» или «превратилась».
  alternative: «они были потревожены водой реки, превратившейся в мутную кровь»
  rationale: Греческий текст выражен сжато и предполагает знакомство с повествованием об египетской казни. Развёрнутая формулировка устранила бы поэтическую недосказанность и внесла отсутствующие слова.
