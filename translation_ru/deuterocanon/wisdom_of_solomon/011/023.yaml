base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/023.yaml
  text: But you have mercy on all[a], because you are able to do all things[b], and you overlook the sins of men for repentance.
translation:
  language: ru
  text: Но Ты милуешь всех, потому что всё можешь, и не взыскиваешь за грехи людей, чтобы они покаялись.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεεῖς
  choice: милуешь
  rationale: Передаёт деятельное милосердие, а не только чувство жалости; естественно звучит в современном литературном русском языке.
- source_word: πάντας
  choice: всех
  rationale: Сохраняет краткость и неограниченный охват греческого слова.
- source_word: πάντα δύνασαι
  choice: всё можешь
  rationale: Прямо и естественно выражает всеобъемлющее могущество без добавления отсутствующего в тексте объекта действия.
- source_word: παρορᾷς
  choice: не взыскиваешь
  rationale: В данном контексте обозначает милостивое воздержание от немедленного воздаяния. В отличие от «не замечаешь», эта формулировка не предполагает неведения или безразличия Бога ко греху.
- source_word: ἁμαρτήματα ἀνθρώπων
  choice: за грехи людей
  rationale: «Грехи» — ясный и точный эквивалент; ἀνθρώπων здесь относится ко всему человечеству, поэтому современное русское «людей» точнее по смыслу, чем гендерно ограниченное «мужчин».
- source_word: εἰς μετάνοιαν
  choice: чтобы они покаялись
  rationale: 'Естественно передаёт целевое значение εἰς: Божье долготерпение предоставляет людям возможность прийти к покаянию.'
theological_decisions:
- issue: Смысл παρορᾷς применительно к человеческим грехам
  choice: Бог в милости не взыскивает за грехи немедленно, давая людям возможность покаяться.
  alternative: Бог не замечает грехов или уже окончательно прощает их в этом высказывании.
  rationale: Связь с εἰς μετάνοιαν указывает на долготерпение, направленное к покаянию, а не на неведение, нравственное безразличие или прямо выраженное окончательное отпущение.
- issue: Значение εἰς μετάνοιαν
  choice: 'цель: «чтобы они покаялись»'
  alternative: Более формальное и неоднозначное «к покаянию» или «для покаяния».
  rationale: Целевое прочтение хорошо соответствует контексту, однако не уточняет способ или результат сверх сказанного в греческом тексте.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Заглавное «Ты» принято как русская издательская норма уважительного обращения к Богу. Синтаксис краткий и параллельный оригиналу; архаизмы и конфессионально маркированная терминология исключены.
