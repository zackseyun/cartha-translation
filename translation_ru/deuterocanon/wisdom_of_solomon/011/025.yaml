base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/025.yaml
  text: For how could anything have remained[a], if you had not willed it? Or how could what had not been called by you have been preserved?
translation:
  language: ru
  text: И как могло бы что-либо существовать, если бы Ты этого не пожелал? Или как сохранилось бы то, что не было призвано Тобой[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «призвано Тобой к бытию». В греческом тексте сказано просто «призвано», но в данном контексте может подразумеваться Божий творческий призыв.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ
  choice: И как могло бы
  rationale: Оборот вводит риторический вопрос, подразумевающий невозможность существования чего-либо помимо Божьей воли; частица δέ передана естественной связкой «и».
- source_word: ἔμεινεν ἄν τι
  choice: что-либо продолжать существовать
  rationale: Μένω означает «оставаться, пребывать, продолжаться»; в данном контексте речь идёт о продолжении существования. «Что-либо» естественно передаёт неопределённое τι.
- source_word: εἰ μὴ σὺ ἠθέλησας
  choice: если бы Ты этого не пожелал
  rationale: Θέλω обозначает волю или желание. «Не пожелал» сохраняет смысл свободного волеизъявления и звучит естественно по-русски; местоимение «Ты» передаёт выраженное и акцентированное σὺ.
- source_word: τὸ μὴ κληθὲν ὑπὸ σοῦ
  choice: то, что не было призвано Тобой
  rationale: Основной текст сохраняет буквальное значение κληθέν — «призвано», не добавляя отсутствующего в греческом тексте уточнения «к бытию»; ὑπὸ σοῦ ясно указывает на действующее лицо.
- source_word: διετηρήθη
  choice: сохранилось бы
  rationale: Глагол означает «сберечь, сохранить, поддержать». Возвратная форма естественно передаёт греческий пассив и в риторическом вопросе подразумевает сохранение благодаря Богу.
theological_decisions:
- issue: Следует ли раскрыть τὸ μὴ κληθέν как творческий призыв к бытию
  choice: В основном тексте оставить «то, что не было призвано Тобой»
  alternative: «то, что не было призвано Тобой к бытию»
  rationale: Контекст допускает указание на Божий творческий призыв, однако греческий текст прямо говорит лишь «призвано». Более явное толкование вынесено в сноску, чтобы не устранять смысловую открытость оригинала.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но общепонятным звучанием. Риторический параллелизм двух вопросов сохранён; обращение к Богу оформлено традиционным прописным «Ты».
