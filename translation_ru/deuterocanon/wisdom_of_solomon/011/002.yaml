  text: Они прошли через необитаемую пустыню и в непроходимых местах разбили шатры.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διώδευσαν
  choice: прошли через
  rationale: Глагол обозначает движение через местность; выражение «прошли через» естественно передаёт пересечение пустыни.
- source_word: ἔρημον
  choice: пустыню
  rationale: В контексте исхода слово обозначает безлюдную, пустынную местность; «пустыня» точно и привычно передаёт этот образ, не предполагая непременно песчаный ландшафт.
- source_word: ἀοίκητον
  choice: необитаемую
  rationale: Прилагательное прямо указывает на местность, где никто не живёт.
- source_word: ἀβάτοις
  choice: в непроходимых местах
  rationale: Слово может означать места недоступные, нехоженые или лишённые путей. «Непроходимые места» сохраняет эту смысловую широту и звучит естественно.
- source_word: ἔπηξαν
  choice: разбили
  rationale: В сочетании с «шатрами» глагол означает поставить или закрепить их; по-русски естественно сказать «разбили шатры».
- source_word: σκηνάς
  choice: шатры
  rationale: Речь идёт о переносных жилищах странников. «Шатры» соответствует библейскому контексту, оставаясь понятным современному читателю.
theological_decisions:
- issue: Образ странствия Израиля по пустыне
  choice: Сохранить конкретное описание пути и стоянки без добавочного толкования.
  alternative: 'Передать более истолковательно: «они расположились станом в пустыне».'
  rationale: Греческий текст отсылает к странствию после исхода, однако сам стих носит описательный характер и не раскрывает богословский смысл этой аллюзии.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified повествовательная формулировка. Синтаксический параллелизм греческого текста сохранён, точка с запятой заменена союзом «и» в пределах одного предложения.
