    reason: lexical_alternative
lexical_decisions:
- source_word: διπλῆ
  choice: двойная
  rationale: Сохраняет прямой образ удвоенной скорби и естественно звучит по-русски.
- source_word: ἔλαβε
  choice: охватили
  rationale: В сочетании с обозначениями переживания глагол передаёт мысль о том, что скорбь и стон овладели ими; множественное число требуется русским синтаксисом при двух однородных подлежащих.
- source_word: λύπη
  choice: скорбь
  rationale: Передаёт сильную душевную боль и соответствует возвышенному, но понятному регистру.
- source_word: στεναγμός
  choice: стон
  rationale: Передаёт слышимое выражение страдания и сохраняет интенсивность греческого слова.
- source_word: μνημῶν
  choice: при воспоминании
  rationale: Естественно передаёт сжатую генитивную связь со стоном, не сводя её однозначно только к причине.
- source_word: τῶν παρελθουσῶν
  choice: о случившемся
  rationale: Передаёт субстантивированное причастие как указание на уже происшедшие события.
