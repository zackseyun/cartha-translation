translation:
  language: ru
  text: 'чтобы они узнали: чем человек согрешает, тем и наказывается.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через что человек согрешает, через то и наказывается». Повтор одного и того же греческого предлога подчёркивает соответствие между грехом и наказанием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γνῶσιν
  choice: чтобы они узнали
  rationale: Союз ἵνα с аористом сослагательного наклонения выражает цель или предполагаемый результат; такая формулировка естественна по-русски и не устраняет оттенок целенаправленности.
- source_word: διʼ ὧν ... διὰ τούτων
  choice: чем ... тем и
  rationale: Парная русская конструкция кратко и ясно передаёт повтор διά и подчёркивает соответствие между орудием греха и орудием наказания.
- source_word: τις
  choice: человек
  rationale: Неопределённое местоимение имеет обобщённое значение; «человек» звучит естественно и сохраняет универсальность высказывания.
- source_word: ἁμαρτάνει
  choice: согрешает
  rationale: Передаёт нравственно-богословский смысл глагола, не ослабляя его до общего «поступает неправильно».
- source_word: κολάζεται
  choice: наказывается
  rationale: В контексте воздаяния обозначает претерпевание наказания; страдательная форма греческого текста сохранена.
theological_decisions:
- issue: Соразмерное воздаяние
  choice: Наказание приходит посредством того же, чем человек согрешает.
  alternative: Общая связь наказания с грехом без подчёркнутого соответствия средств.
  rationale: Повторная конструкция διʼ ὧν ... διὰ τούτων явно подчёркивает соответствие между грехом и наказанием, однако перевод не уточняет характер этого соответствия сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная конструкция «чем… тем и…» сохраняет достоинство стиля и смысловой параллелизм оригинала.
