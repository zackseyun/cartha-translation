base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/017.yaml
  text: For your almighty hand[a], which created the world out of formless matter, was not powerless to send upon them a multitude of bears or fierce lions,
translation:
  language: ru
  text: Ведь Твоя всемогущая рука, сотворившая мир из бесформенной материи[a], не была бессильна наслать на них множество медведей или свирепых львов,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из неоформленной материи». Греческое выражение отражает эллинистический космологический язык; его не следует само по себе считать решением более поздних богословских споров о способе творения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπόρει
  choice: не была бессильна
  rationale: Отрицательная конструкция сохраняет литоту греческого οὐ ἠπόρει и передаёт отсутствие недостатка в силе, не заменяя её усиленным пересказом «легко могла».
- source_word: παντοδύναμός
  choice: всемогущая
  rationale: Обычный и богословски ёмкий русский эквивалент, согласованный с существительным «рука».
- source_word: χείρ
  choice: рука
  rationale: Сохранён исходный образ руки как выражения Божьей силы и действия.
- source_word: κτίσασα
  choice: сотворившая
  rationale: Причастие относится к «руке» и обосновывает способность Бога судить Его творческой силой.
- source_word: κόσμον
  choice: мир
  rationale: Естественный русский эквивалент κόσμος в значении сотворённого мира; «вселенная» была бы более узким истолкованием.
- source_word: ἐξ ἀμόρφου ὕλης
  choice: из бесформенной материи
  rationale: Передаёт эллинистическое космологическое выражение достаточно буквально, не разрешая более поздний спор о способе творения.
- source_word: ἐπιπέμψαι
  choice: наслать на них
  rationale: Естественно передаёт направленное против них действие и контекст суда.
- source_word: πλῆθος ἄρκων
  choice: множество медведей
  rationale: Сохраняет количественный акцент существительного πλῆθος.
- source_word: θρασεῖς λέοντας
  choice: свирепых львов
  rationale: В контексте опасных хищников θρασεῖς обозначает угрожающую дерзость и ярость; «свирепых» звучит естественно по-русски.
theological_decisions:
- issue: Передача литоты о Божьей способности
  choice: не была бессильна наслать
  alternative: могла наслать; не испытывала недостатка в силе, чтобы наслать
  rationale: Выбранный вариант сохраняет отрицательную форму и мысль о неограниченной силе, не усиливая текст до «могла без труда».
- issue: Передача ἐξ ἀμόρφου ὕλης
  choice: из бесформенной материи
  alternative: из неоформленной материи
  rationale: Формулировка сохраняет космологический язык стиха и сама по себе не используется для решения последующих доктринальных споров о творении.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Местоимение «Твоя» написано с прописной буквы как уважительное обращение к Богу. Литота оригинала сохранена, несмотря на некоторую необычность оборота. Конечная запятая оставлена, поскольку стих синтаксически продолжается далее.
