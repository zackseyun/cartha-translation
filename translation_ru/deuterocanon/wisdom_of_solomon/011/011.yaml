  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/011.yaml
  text: And both those absent and those present were afflicted alike;[a]
translation:
  language: ru
  text: И отсутствующие, и присутствующие одинаково изнемогали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одинаково мучились»; греческий глагол передаёт состояние изнурения, тяготы или мучения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόντες
  choice: отсутствующие
  rationale: Причастие от ἄπειμι обозначает тех, кто находится вдали или не присутствует; «отсутствующие» кратко и точно сохраняет противопоставление с παρόντες.
- source_word: παρόντες
  choice: присутствующие
  rationale: Причастие от πάρειμι означает тех, кто присутствует; «присутствующие» естественно образует формальную антитезу с «отсутствующие».
- source_word: ὁμοίως
  choice: одинаково
  rationale: Наречие указывает на сходную меру или одинаковый характер переживаемого; русский вариант ясен и не уточняет сверх текста, в чём именно состояло сходство.
- source_word: ἐτρύχοντο
  choice: изнемогали
  rationale: Имперфект передаёт продолжительное состояние, а τρύχω — изнурение, истощение или страдание. «Изнемогали» сохраняет образ постепенного изнурения и не сужает смысл до физической пытки.
theological_decisions:
- issue: Характер страдания, выраженного глаголом ἐτρύχοντο
  choice: общее изнеможение и страдание
  alternative: «мучились», «терзались», «были изнуряемы»
  rationale: Греческий глагол допускает значения изнурения, тяготы и мучения. Выбор «изнемогали» передаёт длительность и тяжесть состояния, не вводя более узкого представления о карательной пытке.
translation_notes:
  register: Современный литературный русский язык; сохранены краткость стиха, симметрия «отсутствующие — присутствующие» и продолжительный характер действия.
