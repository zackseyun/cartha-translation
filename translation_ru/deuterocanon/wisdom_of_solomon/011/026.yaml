base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/026.yaml
  text: But you spare all things[a], because they are yours, O Master who loves life. For your imperishable spirit is in all things.
translation:
  language: ru
  text: Но Ты щадишь всё, потому что всё — Твоё, Владыка, любящий жизнь[a]. Ибо Твой нетленный Дух пребывает во всём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «любящий души»; возможно также понимание «любящий всё живое». Греческое φιλόψυχε допускает как более узкое указание на души или живых существ, так и широкое — на жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φείδῃ
  choice: щадишь
  rationale: Глагол обозначает сдержанность от причинения вреда или уничтожения; «щадишь» прямо и кратко передаёт этот смысл.
- source_word: πάντων
  choice: всё
  rationale: Форма охватывает всю совокупность творения; русское «всё» естественно выражает этот универсальный охват.
- source_word: σά ἐστιν
  choice: всё — Твоё
  rationale: Притяжательная конструкция отсылает к ранее названному «всему»; такая формулировка ясна и сохраняет смысл принадлежности.
- source_word: Δέσποτα
  choice: Владыка
  rationale: Слово обозначает полновластного хозяина и господина; «Владыка» сохраняет отличие от обычной передачи κύριος как «Господь» и соответствует возвышенному обращению.
- source_word: φιλόψυχε
  choice: любящий жизнь
  rationale: Сложное слово может обозначать любовь к жизни или к живым существам; в контексте заботы Бога обо всём творении «любящий жизнь» сохраняет широкий смысл.
- source_word: ἄφθαρτόν
  choice: нетленный
  rationale: «Нетленный» точно передаёт неподверженность порче и распаду и естественно звучит в русском библейском регистре.
- source_word: πνεῦμά
  choice: Дух
  rationale: Здесь речь идёт о принадлежащем Богу животворящем присутствии, а не просто о дыхании; «Дух» сохраняет богословскую и литературную ёмкость слова.
- source_word: ἐν πᾶσιν
  choice: во всём
  rationale: Выражение перекликается с πάντων и сохраняет широкий охват, не уточняя сверх греческого текста, идёт ли речь обо всём творении или обо всех живых существах.
theological_decisions:
- issue: Смысл φιλόψυχε применительно к Божьему отношению к творению
  choice: любящий жизнь
  alternative: любящий души; любящий всё живое
  rationale: Ближайший контекст говорит, что Бог щадит всё как принадлежащее Ему и что Его нетленный Дух пребывает во всём. Широкая формулировка передаёт направленность на творение, не сводя её лишь к человеческим душам.
- issue: Передача титула Δέσποτα
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: «Владыка» передаёт власть и право владения, важные в данном контексте, и не стирает лексическое отличие Δέσποτα от κύριος.
- issue: Смысл утверждения о Божьем Духе ἐν πᾶσιν
  choice: Твой нетленный Дух пребывает во всём
  alternative: Твой нетленный дух есть во всём
  rationale: «Пребывает» естественно выражает присутствие, не объясняя его природу и не превращая стих в более узкое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены прямое обращение и параллелизм двух всеохватных выражений. Местоимения и титулы при обращении к Богу написаны с прописной буквы согласно принятому русскому религиозно-литературному употреблению.
