base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/022.yaml
  text: For the whole world before you is like a speck on the scales[a], and like a drop of morning dew that falls upon the earth.
translation:
  language: ru
  text: Ведь весь мир перед Тобой — словно пылинка на чаше весов[a] и словно капля утренней росы, упавшая на землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно колебание чаши весов» или «словно крошечная гирька на весах»; греческий образ подчёркивает крайнюю малость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥοπὴ ἐκ πλαστίγγων
  choice: пылинка на чаше весов
  rationale: Греческий образ указывает на нечто крайне малое и почти невесомое при взвешивании. «Пылинка на чаше весов» естественно звучит по-русски, сохраняет образ весов и не сводит неоднозначное ῥοπή только к наклону чаши.
- source_word: ὅλος ὁ κόσμος
  choice: весь мир
  rationale: κόσμος обозначает мир как целое; «весь мир» передаёт полноту охвата естественно и без излишнего уточнения «вселенная».
- source_word: ἐναντίον σου
  choice: перед Тобой
  rationale: Сохраняет буквальный пространственно-реляционный смысл выражения и позволяет самим сравнениям показать несоизмеримость мира с Богом.
- source_word: ῥανὶς δρόσου ὄρθρινὴ
  choice: капля утренней росы
  rationale: Точно и естественно передаёт существительное «капля» и временную характеристику росы как утренней.
- source_word: κατελθοῦσα ἐπὶ γῆν
  choice: упавшая на землю
  rationale: Причастие означает «сошедшая, опустившаяся»; применительно к капле росы русское «упавшая» ясно и поэтично передаёт движение вниз.
theological_decisions:
- issue: Сравнительное изображение малости мира перед Богом
  choice: Сохранить два конкретных поэтических сравнения без отвлечённого истолкования.
  alternative: «Весь мир перед Тобой — ничто».
  rationale: Греческий текст говорит посредством образов весов и росы, а не формулирует метафизическое утверждение о ничтожности или отсутствии ценности творения.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской образностью. Местоимение, обращённое к Богу, написано с прописной буквы. Союз «Ведь» передаёт причинное ὅτι в связи с предшествующим контекстом.
