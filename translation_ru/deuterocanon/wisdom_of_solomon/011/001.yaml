  text: He prospered their works by the hand of a holy prophet[a].
translation:
  language: ru
  text: Она даровала успех их делам рукою святого пророка[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «святым пророком», вероятнее всего, подразумевается Моисей, судя по окружающему контексту, хотя в греческом тексте этого стиха он не назван.
    reason: cross_reference
lexical_decisions:
- source_word: Εὐόδωσεν
  choice: даровала успех
  rationale: Передаёт каузативное значение глагола εὐοδόω — «обеспечить успех, сделать успешным» — естественным современным русским выражением.
- source_word: τὰ ἔργα αὐτῶν
  choice: их делам
  rationale: 'ἔργα имеет широкое значение: дела, деяния, предприятия. «Их делам» сохраняет эту широту и лаконичность греческого текста.'
- source_word: ἐν χειρὶ
  choice: рукою
  rationale: Сохраняет образ греческого выражения «рукой» и обозначает посредничество пророка; форма «рукою» уместна в возвышенном библейском регистре.
- source_word: προφήτου ἁγίου
  choice: святого пророка
  rationale: Греческий текст не называет пророка и не содержит притяжательного местоимения, поэтому в основной текст не добавлены ни имя Моисея, ни слово «своего».
theological_decisions:
- issue: Неявно выраженное подлежащее
  choice: «Она» — Премудрость, продолжающая действовать как подлежащее из предшествующего контекста
  alternative: «Он» — Бог; либо явное «Бог»/«Господь»
  rationale: В самой глагольной форме подлежащее не выражено, однако ближайший развернутый контекст описывает действия Премудрости. Русское местоимение требует грамматического рода, поэтому женская форма сохраняет контекстуальную связь, не подменяя её добавленным именем Бога.
- issue: Личность святого пророка
  choice: Оставлено общее обозначение «святого пророка»
  alternative: «Моисея»; «своего святого пророка»
  rationale: По контексту речь, вероятнее всего, идёт о Моисее, но в данном греческом стихе он не назван. Перевод сохраняет исходную степень определённости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «даровала успех» понятен широкому читателю, а «рукою святого пророка» сохраняет исходный образ посредничества без тяжеловесной буквальности.
