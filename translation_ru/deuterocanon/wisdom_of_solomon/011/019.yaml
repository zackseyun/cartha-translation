  source_fidelity: 'Вторая часть требует уточнения синтаксиса: ὧν относится к обоим образам, а ἡ ὄψις ἐκφοβήσασα означает, что уже сам вид, внушив ужас, мог погубить. «Причинённый ими вред» допустимо, но менее прозрачно связывает относительное местоимение с двумя предшествующими образами. В первой части добавленное «словно мякина» является толковательным сравнением, которого в греческом нет; безопаснее передать сам образ веяния без отождествления дыма с мякиной.'
