  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/024.yaml
  text: For you love all things that exist[a], and you detest none of the things you made; for if you had hated anything[b], you would not have fashioned it.
translation:
  language: ru
  text: Ведь Ты любишь всё существующее и не гнушаешься ничем из того, что сотворил; ведь если бы Ты что-либо ненавидел, то не создал бы этого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то не устроил бы его». Глагол κατασκευάζω может означать «устраивать», «подготавливать», «создавать» или «сооружать» и подчёркивать намеренное устроение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷς
  choice: Ты любишь
  rationale: Прямо передаёт настоящее время и широкий положительный смысл ἀγαπάω без добавления эмоциональных или богословских оттенков.
- source_word: τὰ ὄντα πάντα
  choice: всё существующее
  rationale: Естественное современное русское выражение, сохраняющее всеохватность и онтологический смысл причастия ὄντα.
- source_word: οὐδὲν βδελύσσῃ
  choice: не гнушаешься ничем
  rationale: «Гнушаться» передаёт сильное отвращение, выраженное βδελύσσομαι, и сохраняет возвышенный, но понятный регистр.
- source_word: ὧν ἐποίησας
  choice: из того, что сотворил
  rationale: «Сотворил» естественно в контексте Божьего творения и передаёт ποιέω, не отождествляя его формально со следующим κατασκευάζω.
- source_word: μισῶν τι
  choice: если бы Ты что-либо ненавидел
  rationale: Условная конструкция по-русски ясно передаёт контрфактический смысл причастия с ἄν и аористом.
- source_word: κατεσκεύασας
  choice: не создал бы этого
  rationale: В данном контексте κατασκευάζω означает намеренно привести нечто в существование или устроить; «создал» звучит естественно, хотя частично сглаживает отличие от ἐποίησας.
theological_decisions:
- issue: Связь Божьей любви с творением
  choice: Сохранено прямое утверждение, что Бог любит всё существующее и не испытывает отвращения ни к чему сотворённому Им.
  alternative: Ограничить высказывание первоначальной благостью творения либо истолковать его как безусловное одобрение каждого состояния сотворённого мира.
  rationale: Греческий текст говорит широко о «всём существующем» и обо всём сотворённом Богом. Перевод не вводит ограничений и вместе с тем не превращает эту фразу в утверждение об одобрении всякого состояния или поступка.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Заглавное «Ты» употреблено как традиционная форма обращения к Богу. Повтор γάρ передан повтором «ведь». Единственная сноска отмечена в основном тексте.
