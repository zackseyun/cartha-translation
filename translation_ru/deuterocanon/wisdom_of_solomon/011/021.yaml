base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/021.yaml
  text: For it is always in your power to show great strength[a], and who will withstand the might of your arm?
translation:
  language: ru
  text: Ибо в твоей власти всегда явить великую силу,[a] и кто сможет противостоять мощи твоей руки?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо тебе всегда доступно проявлять великую силу».'
    reason: Лексико-синтаксический вариант для τὸ μεγάλως ἰσχύειν πάρεστίν σοι πάντοτε; передаёт значение постоянной возможности и сохраняет глагольный характер греческого выражения.
lexical_decisions:
- source_word: μεγάλως ἰσχύειν
  choice: великая сила
  rationale: Сочетание наречия μεγάλως с инфинитивом ἰσχύειν передаёт обладание или действие чрезвычайной силой; именная конструкция естественна по-русски и сохраняет смысл.
- source_word: πάρεστίν σοι πάντοτε
  choice: всегда в твоём распоряжении
  rationale: Оборот указывает не только на возможность, но и на постоянно доступную Богу силу.
- source_word: κράτει
  choice: перед мощью
  rationale: κράτος обозначает действенную, проявленную мощь; «мощь» сохраняет возвышенный, но современный регистр.
- source_word: βραχίονός σου
  choice: твоей руки
  rationale: Сохранён библейский антропоморфный образ руки как выражения действенной силы.
- source_word: τίς ἀντιστήσεται
  choice: кто устоит
  rationale: Риторический вопрос подразумевает, что никто не способен успешно противостоять; «устоит» передаёт это естественно и ёмко.
theological_decisions:
- issue: Антропоморфный образ Божьей руки
  choice: 'сохранить буквально: «твоей руки»'
  alternative: «твоей силы»
  rationale: Буквальный образ соответствует греческому тексту и сохраняет его библейскую и богословскую выразительность.
- issue: Характер Божьей силы в первой части стиха
  choice: «всегда в твоём распоряжении»
  alternative: «ты всегда можешь проявить великую силу»
  rationale: Выбранный вариант сохраняет оттенок постоянной доступности силы, не сводя выражение лишь к отвлечённой возможности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием; обращение к Богу передано со строчной буквы согласно обычной современной издательской практике. Метафора руки сохранена.
