  source_fidelity: Первая часть черновика превращает греческий инфинитив μεγάλως ἰσχύειν («проявлять/являть великую силу») в самостоятельное существительное «великая сила», которая находится в распоряжении. Хотя общий смысл близок, глагольный характер выражения лучше сохранить. Во второй части «противостоять» точнее передаёт ἀντιστήσεται, чем «устоять перед».
