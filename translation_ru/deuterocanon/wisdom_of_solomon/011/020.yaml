base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/020.yaml
  text: And even apart from these things, they could have fallen by a single breath, pursued by justice and winnowed by the breath of your power; but you have arranged all things by measure and number and weight.
translation:
  language: ru
  text: Но и помимо этого они могли пасть одним дуновением[a], преследуемые правосудием[b] и провеянные дуновением Твоей силы; однако Ты всё устроил мерой, числом и весом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одним духом» или «одним порывом ветра»; греческое πνεῦμα может означать дуновение, ветер или дух.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «преследуемые карой» или «гонимые судом»; греческое δίκη может означать правосудие, суд или наказание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ τούτων
  choice: Но и помимо этого
  rationale: Передаёт значение «отдельно от, без» и сохраняет противопоставление ранее названным средствам суда; единственное «этого» естественно указывает на совокупность предшествующего.
- source_word: ἐνὶ πνεύματι
  choice: от одного дуновения
  rationale: ἐνί прямо означает «одним», а πνεῦμα здесь допускает значения «дуновение», «ветер» и «дух». «Дуновение» согласуется с последующим образом развеивания и не навязывает личностно-пневматологического прочтения.
- source_word: πεσεῖν
  choice: могли пасть
  rationale: Сохраняет буквальный образ πίπτω и в контексте передаёт возможность гибели без пояснительной замены глаголом «погибнуть».
- source_word: ὑπὸ τῆς δίκης διωχθέντες
  choice: преследуемые правосудием
  rationale: δίκη может обозначать правосудие, суд или кару. «Правосудие» сохраняет олицетворение действующей нравственно-судебной силы.
- source_word: λικμηθέντες
  choice: развеянные
  rationale: Глагол относится к веянию зерна и отделению мякины. «Развеянные» естественно передаёт результат действия ветра и сохраняет сельскохозяйственный образ лучше, чем менее понятное «провеянные».
- source_word: ὑπὸ πνεύματος δυνάμεώς σου
  choice: дуновением Твоей силы
  rationale: Сохраняет генитивную конструкцию и перекличку с первым πνεῦμα; «дуновение» поддерживает образ развеивания, не сужая значение до «Духа».
- source_word: πάντα ... διέταξας
  choice: Ты всё устроил
  rationale: διέταξας означает упорядочить, расположить, устроить. Формулировка современна, торжественна и сохраняет идею установленного Богом порядка.
- source_word: μέτρῳ καὶ ἀριθμῷ καὶ σταθμῷ
  choice: мерой, числом и весом
  rationale: Инструментальные дательные переданы творительным падежом; сохранены форма и последовательность значимой трёхчастной формулы.
theological_decisions:
- issue: Передача πνεῦμα как физического дуновения, ветра или духа
  choice: Оба употребления переданы словом «дуновение»
  alternative: «дух» или «ветер»
  rationale: Образ развеивания благоприятствует значению движущегося воздуха, тогда как «Дух» чрезмерно конкретизировал бы личностное богословское прочтение. Лексическая многозначность отмечена в сноске.
- issue: Передача δίκη как правосудия, суда или кары
  choice: правосудие
  alternative: «суд» или «кара»
  rationale: Причастие изображает δίκη как преследующего деятеля; «правосудие» сохраняет олицетворённый нравственно-судебный смысл, не сводя его только к наказанию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет единство греческого периода и заключительное противопоставление; местоимение «Твоей» и «Ты» оформлено с традиционной прописной буквы при обращении к Богу.
