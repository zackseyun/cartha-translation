  language: ru
  text: Они противостали неприятелям и отразили врагов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они устояли против неприятелей и отбились от врагов». В греческом тексте употреблены две близкие по смыслу пары слов, обозначающие противников и сопротивление им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέστησαν
  choice: противостали
  rationale: Аорист ἀνθίστημι обозначает сопротивление или выступление против кого-либо. «Противостали» передаёт активное противодействие и сохраняет краткость греческого текста.
- source_word: πολεμίοις
  choice: неприятелям
  rationale: Дательный падеж множественного числа от πολέμιος, слова с выраженным военным оттенком. «Неприятелям» естественно передаёт противников в бою и позволяет сохранить различие между двумя близкими греческими обозначениями врага.
- source_word: ἠμύναντο
  choice: отразили
  rationale: Средний аорист ἀμύνω может означать защищаться от нападения, отбиваться или отражать противника. «Отразили» лаконично выражает успешное оборонительное действие, не превращая его в наступательное.
- source_word: ἐχθρούς
  choice: врагов
  rationale: Винительный падеж множественного числа от ἐχθρός. Обычное и ясное «врагов» сохраняет параллелизм с «неприятелям», не повторяя то же русское слово.
