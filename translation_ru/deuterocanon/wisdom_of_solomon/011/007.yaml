lexical_decisions:
- source_word: εἰς
  choice: в
  rationale: Предлог вводит цель или результат; в зависимом фрагменте русское «в обличение» естественно передаёт эту функцию.
- source_word: ἔλεγχον
  choice: обличение
  rationale: Слово может означать опровержение, изобличение или порицание; «обличение» сохраняет и выявление вины, и нравственное осуждение.
- source_word: νηπιοκτόνου
  choice: повелевавшего убивать младенцев
  rationale: Составное прилагательное буквально означает «убивающий младенцев». Развёрнутый оборот естественнее по-русски и показывает, что смертоносным было содержание указа.
- source_word: διατάγματος
  choice: указа
  rationale: Речь идёт об официальном властном предписании; «указ» ясно и кратко передаёт этот смысл.
theological_decisions:
- issue: Историко-богословская отсылка к умерщвлению еврейских младенцев в Египте
  choice: «указа, повелевавшего убивать младенцев»
  alternative: «детоубийственного указа»
  rationale: Развёрнутая формулировка сохраняет конкретную отсылку, не называя фараона и не добавляя отсутствующих в греческом тексте подробностей.
translation_notes:
  register: Современный литературный русский язык; фрагмент сохраняет синтаксическую зависимость от окружающего предложения. «Обличение» выбрано как достойное и понятное слово, передающее одновременно выявление и осуждение вины.
