base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/014.yaml
  text: For they rejected with mockery the one who had long ago been cast out at his exposure[a]; but at the end of those events they marveled[b], having thirsted unlike the righteous.
translation:
  language: ru
  text: Ведь того, кого некогда бросили, оставив на произвол судьбы[a], они с насмешкой отвергли; но в конце этих событий изумились[b], испытав жажду не так, как праведные.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть младенец, некогда оставленный на произвол судьбы, — намёк на Моисея.
    reason: cross_reference
  - marker: b
    text: 'Или: «при конечном исходе событий»; греческое выражение может указывать на окончательный результат всего произошедшего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκθέσει
  choice: при оставлении на произвол судьбы
  rationale: ἔκθεσις обозначает оставление младенца вне дома, то есть его подкидывание или обречение на произвол судьбы. Выбор передаёт историческую реалиию естественным современным русским языком, не называя Моисея прямо.
- source_word: ῥιφέντα
  choice: был брошен
  rationale: Причастие от ῥίπτω сохраняет конкретный образ брошенного ребёнка и хорошо сочетается с ἐν ἐκθέσει.
- source_word: ἀπεῖπον
  choice: отвергли
  rationale: Глагол выражает отказ, отречение или решительное неприятие; «отвергли» сохраняет широту значения.
- source_word: χλευάζοντες
  choice: с насмешкой
  rationale: 'Обстоятельственный оборот естественно передаёт образ действия: отвержение сопровождалось глумлением.'
- source_word: ἐπὶ τέλει τῶν ἐκβάσεων
  choice: в конце этих событий
  rationale: Передаёт заключительный этап и результат развернувшихся событий; возможный оттенок «исходов, результатов» отмечен в сноске.
- source_word: ἐθαύμασαν
  choice: изумились
  rationale: Передаёт сильное удивление, выраженное глаголом θαυμάζω, без добавления оценки.
- source_word: οὐχ ὅμοια δικαίοις διψήσαντες
  choice: испытав жажду не так, как праведные
  rationale: Сохраняет явное сопоставление жажды египтян и праведных, оставаясь ясным по-русски.
theological_decisions:
- issue: Кого подразумевает брошенный младенец
  choice: Не называть Моисея в основном тексте, сохранив косвенное указание оригинала.
  alternative: Прямо написать «Моисея».
  rationale: Греческий текст не называет его по имени; идентификация как Моисея уместна в пояснительной сноске, а не как добавление к переводу.
- issue: Характер различия между жаждой египтян и праведных
  choice: Сохранить общее сравнение «не так, как праведные».
  alternative: Пояснить различие как разницу в причине, обстоятельствах или исходе жажды.
  rationale: Оригинал утверждает различие, но не уточняет здесь его точный аспект; перевод не должен устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет причинное «ведь» и резкий контраст двух частей стиха; косвенное указание на Моисея и неоднозначность выражения об исходе событий сохранены.
