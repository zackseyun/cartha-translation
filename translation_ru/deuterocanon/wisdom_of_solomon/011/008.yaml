  text: You gave them abundant water unexpectedly[a], showing through their thirst at that time how you punished their adversaries.
translation:
  language: ru
  text: Ты неожиданно дал им воду в изобилии[a], показав через их тогдашнюю жажду, как Ты наказал их противников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда они уже не надеялись получить её»; греческое слово может означать также «сверх надежды» или «вопреки ожиданию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκας
  choice: Ты дал
  rationale: Прямо передаёт аорист δίδωμι и сохраняет обращение к Богу во втором лице.
- source_word: δαψιλὲς ὕδωρ
  choice: воду в изобилии
  rationale: Естественно по-русски передаёт мысль об обильном количестве воды, не утяжеляя фразу.
- source_word: ἀνελπίστως
  choice: неожиданно
  rationale: Передаёт наречное значение «вопреки ожиданию»; возможный более сильный оттенок отсутствия надежды отмечен в сноске.
- source_word: δείξας
  choice: показав
  rationale: Сохраняет обстоятельственное причастие и его доказательное значение.
- source_word: διὰ τοῦ τότε δίψους
  choice: через их тогдашнюю жажду
  rationale: Сохраняет διά как указание на средство и явно передаёт временное τότε; местоимение «их» естественно восстанавливается из контекста.
- source_word: τοὺς ὑπεναντίους
  choice: их противников
  rationale: Передаёт людей, противостоящих Божьему народу; «противники» звучит естественно и не конкретизирует их сверх текста.
- source_word: ἐκόλασας
  choice: Ты наказал
  rationale: Ясно передаёт карательный смысл κολάζω без смягчения.
theological_decisions:
- issue: Соотношение «им» и «их противников»
  choice: Местоимения сохранены; «им» в контексте относится к Божьему народу, а «их противников» — к наказываемым врагам.
  alternative: Обобщённое противопоставление праведных и их противников.
  rationale: Ближайший контекст противопоставляет дарование воды Израилю и наказание его врагов, однако сам стих не называет эти группы прямо, поэтому конкретные этнонимы не добавлены.
- issue: Связь жажды с показанным наказанием
  choice: Сохранена конструкция «через их тогдашнюю жажду, как Ты наказал», не разъясняющая контраст дополнительно.
  alternative: 'Развернуть смысл: по жажде Израиля показать, каким образом были наказаны враги.'
  rationale: Греческий текст выражает эту связь сжато; перевод сохраняет богословское и риторическое напряжение, не вводя отсутствующего пояснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавное «Ты» употреблено как норма уважительного обращения к Богу; синтаксис греческого причастного оборота сохранён там, где он остаётся понятным.
