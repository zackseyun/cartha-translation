  terminology: «Неправедность», «поклонялись», «пресмыкающиеся», «презренные звери», «наслал», «наказание» уместны. Повтор «неразумные ... неразумных» следует сохранить как соответствие повтору ἄλογος. Сноска о вариантах связи λογισμῶν и ἀδικίας должна соответствовать основному тексту и не называть несоответствующий ему вариант единственной альтернативой.
