base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/015.yaml
  text: But in return for the foolish reasonings of their unrighteousness[a], by which, having been led astray, they worshiped irrational creeping things and worthless beasts, you sent upon them a multitude of irrational animals for punishment[c][b],
translation:
  language: ru
  text: Но в воздаяние за неразумные рассуждения, свойственные их неправедности[a], из-за которых они, заблудившись, поклонялись неразумным пресмыкающимся и презренным зверям, Ты наслал на них множество неразумных животных в наказание[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за неразумные помыслы их неправедности». Греческая конструкция допускает несколько способов передать связь между «рассуждениями» и «неправедностью».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте одно и то же слово «неразумный» относится и к пресмыкающимся, которым они поклонялись, и к животным, посланным им в наказание.
    reason: rhetorical_echo
  - marker: c
    text: 'Или: «для возмездия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ
  choice: в воздаяние за
  rationale: Передаёт соответствующее проступку возмездие, а не простое замещение.
- source_word: λογισμῶν ἀσυνέτων
  choice: неразумные умствования
  rationale: Сохраняет значение рассуждений или построений мысли и их отрицательную оценку; «умствования» естественно передаёт здесь порочное рассуждение.
- source_word: ἀδικίας αὐτῶν
  choice: порождённые их неправедностью
  rationale: Родительная конструкция допускает смысловую связь рассуждений с неправедностью; такая передача делает её ясной, не сводя ἀδικία лишь к социальной несправедливости.
- source_word: ἐν οἷς
  choice: из-за которых
  rationale: Передаёт связь заблуждения с неразумными умствованиями естественным русским оборотом.
- source_word: πλανηθέντες
  choice: впав в заблуждение
  rationale: Сохраняет значение ухода в ошибку, не уточняя сверх текста, были ли они обмануты внешней силой.
- source_word: ἐθρήσκευον
  choice: поклонялись
  rationale: В контексте идолопоклонства ясно обозначает религиозное почитание.
- source_word: ἄλογα ἑρπετὰ
  choice: неразумным пресмыкающимся
  rationale: «Неразумным» сохраняет повтор корня ἄλογος, а «пресмыкающимся» естественно передаёт ἑρπετά.
- source_word: κνώδαλα εὐτελῆ
  choice: презренным зверям
  rationale: Различает κνώδαλα и последующее ζῷα и передаёт уничижительную окраску εὐτελῆ.
- source_word: ἐπαπέστειλας
  choice: Ты наслал на них
  rationale: «Наслал» идиоматично передаёт направление бедствия против адресатов суда.
- source_word: πλῆθος ἀλόγων ζῴων
  choice: множество неразумных животных
  rationale: Сохраняет повтор ἄλογος и более общее значение ζῷα в отличие от κνώδαλα.
- source_word: εἰς ἐκδίκησιν
  choice: в наказание
  rationale: Передаёт судебно-карательный смысл, не усиливая его до личной мстительности.
theological_decisions:
- issue: Нравственно-религиозная сила ἀδικία
  choice: неправедность
  alternative: несправедливость; беззаконие
  rationale: «Неправедность» сохраняет широкий нравственный и религиозный смысл в контексте идолопоклонства.
- issue: Повтор ἄλογος
  choice: неразумным ... неразумных
  alternative: бессловесным ... неразумных; лишённым разума ... неразумных
  rationale: Повтор одного определения сохраняет ироническое соответствие между предметами поклонения и орудием наказания.
- issue: Смысл ἐκδίκησις применительно к Божьему суду
  choice: наказание
  alternative: возмездие; отмщение
  rationale: «Наказание» выражает судебный характер действия и не разрешает текст в сторону эмоциональной мстительности.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Местоимение «Ты» подчёркивает прямое обращение к Богу. Сохранены нравственно-религиозный вес «неправедности», различие между κνώδαλα и ζῷα и риторический повтор ἄλογος.
