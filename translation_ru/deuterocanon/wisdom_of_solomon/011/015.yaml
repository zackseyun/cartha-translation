  verdict: revise
  source_fidelity: 'Основной смысл передан верно: воздаяние соотнесено с их неправедностью и заблуждением, сохранены предметы ложного почитания, множественность посланных животных и цель наказания. Однако «порождённые их неправедностью» однозначно делает неправедность причиной умствований, тогда как родительный падеж ἀδικίας допускает более тесную, но не обязательно причинную связь. «Неразумные рассуждения» точнее и нейтральнее передаёт λογισμοί ἀσύνετοι, чем несколько разговорно-полемическое «умствования».'
