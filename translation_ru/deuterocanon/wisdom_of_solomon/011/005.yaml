lexical_decisions:
- source_word: διʼ ὧν ... διὰ τούτων
  choice: через то, чем ... через то
  rationale: 'Повтор сохраняет инструментальную связь и подчёркивает иронический поворот: одно и то же послужило наказанию врагов и благу Божьего народа. Во второй части русское «через то» подразумевается конструкцией «они сами... получили помощь» без тяжеловесного буквального повтора.'
- source_word: ἐκολάσθησαν
  choice: были наказаны
  rationale: Ясно и естественно передаёт пассивную форму и значение карательного воздействия.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: их враги
  rationale: Естественная русская передача греческой притяжательной конструкции.
- source_word: αὐτοὶ
  choice: они сами
  rationale: Сохраняет эмфатическое противопоставление народа его врагам.
- source_word: ἀποροῦντες
  choice: оказавшись в нужде
  rationale: В данном контексте причастие указывает на нужду или затруднительное положение; формулировка не сводит его значение лишь к растерянности.
- source_word: εὐεργετήθησαν
  choice: получили помощь
  rationale: Естественно передаёт пассивное получение благодеяния, не называя прямо действующее лицо, которое в греческом также не выражено.
theological_decisions:
- issue: Инструментальный поворот в Божьем действии
  choice: Сохранена мысль, что то же самое средство послужило наказанию врагов и помощью народу.
  alternative: Передать лишь общий контраст между наказанием врагов и благом народа, не сохраняя инструментального соответствия.
  rationale: Повтор διʼ ὧν ... διὰ τούτων составляет смысловой центр стиха и выражает мотив обращения одного и того же явления в суд для одних и благо для других, не требуя дополнительного догматического уточнения.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная, но доступная. Синтаксис сохраняет причинное «Ибо», пассив наказания, эмфатическое «они сами» и контраст между наказанием и помощью.
