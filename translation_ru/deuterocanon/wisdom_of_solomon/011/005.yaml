  text: For by the very things through which their enemies were punished[a], they themselves, when in need, were benefited.
translation:
  language: ru
  text: Ибо тем, чем были наказаны их враги, они сами, оказавшись в нужде[a], получили помощь.
  philosophy: optimal-equivalence
  footnotes:
