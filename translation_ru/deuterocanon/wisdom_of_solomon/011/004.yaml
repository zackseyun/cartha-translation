base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/004.yaml
  text: They were thirsty and called on you[a], and water was given to them from a sheer rock[b], and a remedy for thirst from hard stone.
translation:
  language: ru
  text: Они испытывали жажду и воззвали к Тебе, и дана была им вода из отвесной скалы, и средство от жажды[a] — из твёрдого камня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лекарство от жажды»; вода представлена как целительное средство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίψησαν
  choice: томились от жажды
  rationale: Передаёт аорист διψάω естественным современным русским выражением и сохраняет переживаемую ими нужду.
- source_word: ἐπεκαλέσαντό σε
  choice: воззвали к Тебе
  rationale: Глагол обозначает обращение за помощью; «воззвали» сохраняет молитвенный оттенок и остаётся понятным в литературном русском.
- source_word: ἐδόθη αὐτοῖς
  choice: дана была им
  rationale: Сохранён греческий пассив без прямого добавления Бога как действующего лица, хотя из контекста Его участие очевидно.
- source_word: ἐκ πέτρας ἀκροτόμου
  choice: из отвесной скалы
  rationale: ἀκρότομος указывает на круто обрывающуюся, словно срезанную скалу; «отвесная» кратко передаёт этот образ.
- source_word: ὕδωρ
  choice: вода
  rationale: Прямое и естественное соответствие.
- source_word: ἄκος δίψης
  choice: средство от жажды
  rationale: Сохраняет заключённый в ἄκος образ целительного средства, не сводя выражение просто к утолению жажды.
- source_word: ἐκ λίθου σκληροῦ
  choice: из твёрдого камня
  rationale: Точно передаёт σκληρός и сохраняет параллелизм с упоминанием скалы.
theological_decisions:
- issue: Следует ли прямо назвать Бога подателем воды
  choice: Сохранить безлично-пассивное «дана была им», не добавляя «Ты дал».
  alternative: «Ты дал им воду»
  rationale: Греческий текст оставляет подателя невыраженным; контекст подразумевает Бога, но перевод не должен делать это указание более явным, чем оригинал.
- issue: Насколько явно сохранять целительный образ в ἄκος δίψης
  choice: «средство от жажды»
  alternative: «утоление жажды»
  rationale: Выбранный вариант сохраняет метафору лекарства или целительного средства и поэтическое напряжение исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Воззвали» передаёт молитвенное обращение без архаической тяжеловесности; прописная буква в «Тебе» указывает на обращение к Богу. Синтаксический параллелизм двух заключительных оборотов сохранён.
