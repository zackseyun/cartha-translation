base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/009.yaml
  text: For when they were tested[a], though being disciplined with mercy, they learned how the ungodly were tormented while being judged in wrath[c][b];
translation:
  language: ru
  text: Ведь когда их испытывали[a], хотя и милостиво вразумляли[b], они узнали, как нечестивые[c], судимые в гневе, подвергались мучениям.
  philosophy: optimal-equivalence
  footnotes:
