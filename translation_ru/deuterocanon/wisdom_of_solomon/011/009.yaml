    text: 'Или: «подвергали испытанию»; греческое слово может означать испытание или проверку и здесь не подразумевает прежде всего искушение ко греху.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наставляли» или «исправляли»; греческое слово включает обучение, воспитание и исправительное воздействие.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «безбожные»; греческое слово особо подчёркивает непочтительность по отношению к Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράσθησαν
  choice: их испытывали
  rationale: Глагол обозначает испытание или проверку; в данном контексте речь не об искушении ко греху. Пассивная форма сохранена естественной русской конструкцией.
- source_word: καίπερ
  choice: хотя … и
  rationale: Передаёт уступительное значение греческого оборота и ясно противопоставляет милостивое вразумление суду в гневе.
- source_word: ἐν ἐλέει
  choice: с милостью
  rationale: Естественно передаёт способ обращения с испытываемыми, сохраняя существительное «милость».
- source_word: παιδευόμενοι
  choice: их … вразумляли
  rationale: «Вразумлять» охватывает наставление и исправительное воздействие, не сводя смысл ни к простому обучению, ни к карательному наказанию.
- source_word: ἔγνωσαν
  choice: они узнали
  rationale: Передаёт приобретённое через опыт знание, не добавляя отсутствующего в тексте пояснения.
- source_word: ἐν ὀργῇ
  choice: в гневе
  rationale: Сохраняет краткую и богословски значимую формулировку оригинала.
- source_word: κρινόμενοι
  choice: судимые
  rationale: Прямо передаёт продолжающееся подвергание суду, не усиливая значение до окончательного осуждения.
- source_word: ἀσεβεῖς
  choice: нечестивые
  rationale: Русское слово выражает прежде всего непочтительность и безбожие, а не только нравственную порочность.
- source_word: ἐβασανίζοντο
  choice: мучились
  rationale: Передаёт тяжесть страдания, не конкретизируя способ мучения сверх греческого текста.
theological_decisions:
- issue: Характер испытания одних и страдания нечестивых
  choice: Милостивое «вразумление» противопоставлено мучению нечестивых, «судимых в гневе».
  alternative: Передать παιδευόμενοι как «наставляемые» либо «наказываемые».
  rationale: Так сохраняется заложенное в стихе различие между исправительным обращением с первыми и гневным судом над нечестивыми, без отрицания болезненности самого испытания.
translation_notes:
  register: Современный литературный русский язык; синтаксис сделан ясным посредством личных конструкций, при этом сохранены уступительное отношение и контраст между милостью и гневом. Формулировка торжественная, но не архаическая.
