    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε γὰρ
  choice: Ибо, услышав
  rationale: «Ибо» передаёт пояснительную силу γάρ, а деепричастная конструкция естественно выражает временное значение ὅτε вместе с ἤκουσαν.
- source_word: ἤκουσαν
  choice: услышав
  rationale: Сохраняет основное значение получения известия на слух; по-русски такая форма естественно связывает придаточное обстоятельство с главным действием.
- source_word: διὰ τῶν ἰδίων κολάσεων
  choice: через наказания, постигшие их самих
  rationale: '«Через» передаёт инструментальное значение διά с родительным падежом; оборот «постигшие их самих» ясно сохраняет иронию: благо другим пришло посредством наказаний самих египтян.'
- source_word: εὐεργετουμένους αὐτούς
  choice: другим было оказано благо
  rationale: Передаёт пассивное значение причастия εὐεργετουμένους и контраст местоимения αὐτούς с теми, кого постигли наказания. «Другим» обозначает израильтян по контексту, не вводя их название в текст стиха.
- source_word: ᾔσθοντο
  choice: познали
  rationale: Глагол обозначает восприятие или пришедшее осознание. «Познали» уместно в возвышенной прозе, но его возможное сильное богословское звучание ограничено примечанием.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: κύριος здесь обозначает Бога; традиционное и ясное русское соответствие — «Господь».
theological_decisions:
- issue: Соотношение группы наказанных и тех, кому было оказано благо
  choice: Наказания постигают египтян, а благо через них получают другие — израильтяне.
  alternative: 'Оставить местоименные соотношения полностью неявными: «им было оказано благо через их собственные наказания».'
  rationale: Контекст главы противопоставляет египтян и израильтян. Русский оборот устраняет грамматическую путаницу, но не добавляет в сам стих названия групп.
- issue: Смысл выражения ᾔσθοντο τοῦ κυρίου
  choice: «познали Господа» как осознание его присутствия или действия
  alternative: «ощутили Господа» или «осознали присутствие Господа»
  rationale: Греческий текст допускает восприятие или узнавание и не требует понимания этого события как полного обращения или исповедания веры. Примечание сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис перестроен ради ясности участников действия, при этом сохранены причинная связь, иронический контраст и богословская неоднозначность заключительного глагола.
