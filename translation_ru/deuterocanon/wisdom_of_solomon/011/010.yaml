lexical_decisions:
- source_word: τούτους μὲν ... ἐκείνους δὲ
  choice: этих ... тех
  rationale: Сохраняет указательное противопоставление двух групп, явно выраженное в греческом тексте, не называя их прямо.
- source_word: νουθετῶν
  choice: вразумляя
  rationale: Передаёт наставление с исправительной и предостерегающей направленностью, а не простое обучение.
- source_word: ἐδοκίμασας
  choice: испытывал
  rationale: Передаёт проверку или испытание и соответствует контексту отеческого исправления.
- source_word: ἀπότομος
  choice: суровый
  rationale: Выражает строгость и непреклонность царского суда без излишнего усиления до жестокости.
- source_word: καταδικάζων
  choice: осуждая
  rationale: Сохраняет судебный смысл вынесения неблагоприятного приговора.
- source_word: ἐξήτασας
  choice: исследовал
  rationale: Передаёт тщательное рассмотрение и сохраняет отличие от ἐδοκίμασας в первой части стиха.
theological_decisions:
- issue: Различный характер Божьего обращения с двумя группами
  choice: Сохранено противопоставление отеческого исправительного испытания одних и сурового царского суда над другими.
  alternative: Обе части можно было передать одним общим понятием испытания, сгладив различие.
  rationale: Греческий текст использует разные образы, причастия и глаголы; перевод сохраняет напряжение между отеческим вразумлением и судебным осуждением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Прямое обращение к Богу передано местоимением «Ты» с прописной буквы. Параллелизм и контраст греческой фразы сохранены.
