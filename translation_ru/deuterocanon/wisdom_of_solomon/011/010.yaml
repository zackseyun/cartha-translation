  terminology: '«Вразумляя», «испытывал», «исследовал», «осуждая» и «суровый царь» уместны и сохраняют как исправительный, так и судебный регистр греческого текста. Примечание b следует привести к действительно близкой лексической альтернативе для ἀπότομος: «строгий», а не «неумолимый», которое добавляет оттенок непреклонности, не выраженный прямо.'
