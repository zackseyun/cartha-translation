  source_fidelity: 'Смысловой каркас передан верно: сохранены контраст «этих… тех», отеческое вразумление в первой части и царское судебное осуждение во второй, а также различие между «испытывал» (ἐδοκίμασας) и «исследовал» (ἐξήτασας). Однако в русском тексте подразумеваемые дополнения при деепричастиях лучше выразить явно: так несомненно, что Бог вразумляет первую группу и осуждает вторую.'
