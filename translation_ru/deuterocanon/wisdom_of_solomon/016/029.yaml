  text: For the hope of the ungrateful will melt like wintry frost[c][b][a], and will run off like useless water.
translation:
  language: ru
  text: Ибо надежда неблагодарного растает, как зимний иней, и утечёт, как бесполезная вода.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀχάριστου
  choice: неблагодарного
  rationale: Субстантивированное прилагательное в родительном падеже обозначает неблагодарного человека; русский вариант сохраняет нравственную оценку и естественно сочетается со словом «надежда».
- source_word: ἐλπὶς
  choice: надежда
  rationale: Основное значение слова и естественный русский эквивалент в контексте непрочной надежды.
- source_word: χειμέριος πάχνη
  choice: зимний иней
  rationale: πάχνη обозначает иней или изморозь, а χειμέριος — зимний; образ указывает на быстрое таяние.
- source_word: τακήσεται
  choice: растает
  rationale: Будущая форма передаёт таяние; простой русский глагол точно и естественно выражает образ.
- source_word: ῥυήσεται
  choice: утечёт
  rationale: Форма означает, что нечто потечёт или стечёт прочь; «утечёт» сохраняет идею исчезновения воды.
- source_word: ὕδωρ ἄχρηστον
  choice: бесполезная вода
  rationale: ἄχρηστον означает непригодное, не приносящее пользы; буквальный образ в русском понятен без пояснения.
theological_decisions:
- issue: Нравственная характеристика ἀχάριστου
  choice: неблагодарного
  alternative: непризнательного
  rationale: «Неблагодарного» ясно передаёт отсутствие благодарности как нравственное качество, не добавляя специальных богословских оттенков.
translation_notes:
