base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/019.yaml
  text: But at times[a], even in the midst of water, fire burns beyond its power[b], so that it may destroy the unrighteous produce of the earth.
translation:
  language: ru
  text: А порой даже посреди воды огонь пылает сверх своей обычной силы[a], чтобы уничтожить неправедный плод земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сверх силы огня»; то есть, находясь среди воды, огонь действует сильнее, чем ему обычно свойственно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «неправедное порождение земли». Вероятно, речь идёт о плодах земли, связанных с неправедными людьми.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποτὲ δὲ
  choice: А порой
  rationale: Передаёт как контрастивный переход δέ, так и значение ποτὲ — «порой, иногда»; естественно связывает стих с предшествующим рядом примеров.
- source_word: μεταξὺ ὕδατος
  choice: посреди воды
  rationale: Сохраняет пространственное значение выражения и парадоксальный образ огня, пылающего в воде.
- source_word: ὑπὲρ τὴν πυρὸς δύναμιν
  choice: сверх своей обычной силы
  rationale: Ὑπέρ с винительным падежом обозначает превышение. Добавление «обычной» проясняет, что огонь действует за пределами присущей ему естественной силы, а местоимение «своей» соотносит δύναμις с огнём.
- source_word: φλέγει
  choice: огонь пылает
  rationale: Глагол означает «пылает, горит»; явно названный субъект «огонь» восстанавливается из πυρός и делает русскую фразу ясной.
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевое значение придаточного без ненужной тяжеловесности.
- source_word: ἄδικον
  choice: неправедный
  rationale: Передаёт нравственно-религиозную окраску слова и сохраняет его прямую связь с γέννημα, не сводя значение только к юридической несправедливости.
- source_word: γῆς γέννημα
  choice: плод земли
  rationale: Γέννημα — то, что рождено или произведено; «плод земли» естественно обозначает земное произрастание и одновременно сохраняет образность оригинала.
- source_word: διαφθείρῃ
  choice: уничтожить
  rationale: В контексте суда глагол обозначает полное погубление или разрушение.
theological_decisions:
- issue: Нравственная характеристика ἄδικον при γῆς γέννημα
  choice: «неправедный плод земли» — определение сохранено при самом плоде
  alternative: «плод земли, принадлежащий неправедным» или «урожай нечестивых»
  rationale: Греческий текст непосредственно называет γέννημα «неправедным». Основной перевод сохраняет эту необычную и богословски напряжённую формулировку, а примечание указывает вероятную контекстуальную связь плода с неправедными людьми, не подменяя ею текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка остаётся ясной для широкого читателя; парадокс огня среди воды и необычное сочетание «неправедный плод земли» сохранены, а не истолкованы прямо в основном тексте.
