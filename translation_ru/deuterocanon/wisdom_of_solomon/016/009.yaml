  text: For those whom the bites of locusts and flies killed, no healing was found for their life, because they were worthy to be punished by such things;
translation:
  language: ru
  text: Ведь для тех, кого умертвили укусы саранчи и мух, не нашлось средства, чтобы спасти их жизнь[a], ибо они заслуживали быть наказанными подобным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для их души». Здесь греческое слово ψυχή в данном контексте, вероятно, означает жизнь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «быть наказанными подобным». Греческое выражение может относиться к подобным существам или, шире, к подобным вещам либо средствам наказания.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἀκρίδων
  choice: саранчи
  rationale: Обычное значение ἀκρίς; оно также естественно в контексте бедствий.
- source_word: μυιῶν
  choice: мух
  rationale: Прямое и ненамеренно не суженное соответствие обычному значению слова.
- source_word: δήγματα
  choice: укусы
  rationale: δήγματα может обозначать укусы или ужаления; общее слово «укусы» подходит к обоим названным видам насекомых и не уточняет механизм поражения.
- source_word: ἀπέκτεινεν
  choice: умертвили
  rationale: Передаёт прямое причинение смерти и сохраняет возвышенный, но современный библейский регистр.
- source_word: οὐχ εὑρέθη ἴαμα
  choice: не исцелило никакое средство
  rationale: Естественная русская передача отсутствия найденного целительного средства; сохраняет медицинский смысл ἴαμα, хотя пассивная греческая конструкция преобразована ради ясности.
- source_word: τῇ ψυχῇ αὐτῶν
  choice: их жизнь
  rationale: В контексте телесной смерти ψυχή обозначает жизнь; выбор не вводит утверждения о метафизическом состоянии души.
- source_word: ἄξιοι ἦσαν
  choice: заслуживали
  rationale: Естественно выражает заложенное в обороте значение заслуженности или соответствия воздаянию.
- source_word: ὑπὸ τοιούτων κολασθῆναι
  choice: такого наказания
  rationale: Идиоматично передаёт мысль о заслуженном наказании, а более буквальная и неоднозначная отсылка к средству или деятелю наказания сохранена в примечании.
theological_decisions:
- issue: Значение ψυχή в контексте смерти и исцеления
  choice: жизнь
  alternative: душа
  rationale: Речь идёт о смерти от укусов и отсутствии целительного средства; «жизнь» соответствует непосредственному контексту и не разрешает текст в пользу позднейшего противопоставления души и тела.
- issue: Судебно-нравственный смысл ἄξιοι ἦσαν ... κολασθῆναι
  choice: они заслуживали такого наказания
  alternative: они были достойны быть наказанными подобными [существами/вещами]
  rationale: Сохраняется прямое утверждение о заслуженности наказания без расширения его богословского смысла; неоднозначность ὑπὸ τοιούτων отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Двоеточие делает причинно-пояснительную связь ясной. Формулировка стремится к естественности, а неоднозначные ψυχή и ὑπὸ τοιούτων сопровождаются сносками.
