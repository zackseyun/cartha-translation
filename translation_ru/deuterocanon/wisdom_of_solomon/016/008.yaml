  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/008.yaml
  text: And by this also you convinced our enemies that you are the one who rescues from every evil[a].
translation:
  language: ru
  text: И этим Ты также убедил наших врагов, что именно Ты избавляешь от всякого зла[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от всякой беды» или «от всякого вреда». Греческое κακοῦ может широко обозначать зло, вред или несчастье.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: этим
  rationale: Оборот имеет здесь инструментальное значение и указывает на предшествующее событие как на средство доказательства; «этим» естественно передаёт и предлог, и указательное местоимение.
- source_word: ἔπεισας
  choice: убедил
  rationale: Глагол означает «убедить, удостоверить»; «убедил» прямо и естественно вводит содержание того, что поняли враги.
- source_word: τοὺς ἐχθροὺς ἡμῶν
  choice: наших врагов
  rationale: Прямой и идиоматичный перевод с сохранением общинного первого лица.
- source_word: ὅτι σὺ εἶ
  choice: что именно Ты
  rationale: Слово «именно» передаёт подчёркнутое греческое местоимение σὺ, не утяжеляя русскую фразу.
- source_word: ὁ ῥυόμενος
  choice: избавляешь
  rationale: Субстантивированное причастие настоящего времени обозначает характерное действие Бога; личная форма естественнее по-русски после «Ты» и сохраняет длительно-характерный смысл.
- source_word: ἐκ παντὸς κακοῦ
  choice: от всякого зла
  rationale: κακόν широко охватывает зло, беду и вред; «зло» сохраняет эту смысловую и богословскую широту, а примечание фиксирует возможные оттенки.
theological_decisions:
- issue: Объём значения κακοῦ
  choice: от всякого зла
  alternative: от всякой беды; от всякого вреда
  rationale: Контекст допускает как нравственное зло, так и бедствие или причинённый вред. Основной текст сохраняет широкую формулировку, а примечание не позволяет неоправданно сузить её.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавное «Ты» принято как редакционный знак обращения к Богу, не меняющий смысла оригинала. Конструкция сделана естественной для русского языка без устранения широты слова κακοῦ.
