  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/024.yaml
  text: For creation[a], serving you its maker, strains itself for the punishment of the unrighteous, and relaxes for the benefit of those who have put their trust in you.
translation:
  language: ru
  text: Ибо творение, служа Тебе, своему Создателю, напрягается для наказания неправедных и ослабляет своё напряжение, чтобы творить благо для тех, кто возложил надежду на Тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально здесь противопоставлены образы натяжения и ослабления: творение «напрягается» для наказания и ослабляет это напряжение, чтобы творить благо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: творение
  rationale: Передаёт весь сотворённый мир как действующее орудие Бога и не сводит смысл к безличной «природе».
- source_word: σοι τῷ ποιήσαντι
  choice: Тебе, своему Создателю
  rationale: 'Сохраняет пояснительное отношение: творение служит Богу как Тому, Кто его создал.'
- source_word: ὑπηρετοῦσα
  choice: служа
  rationale: Естественно передаёт подчинённое исполнение Божьих целей без излишне культового оттенка.
- source_word: ἐπιτείνει
  choice: напрягается
  rationale: Сохраняет образ натяжения или усиления, противопоставленный последующему ослаблению.
- source_word: εἰς κόλασιν κατὰ τῶν ἀδίκων
  choice: для наказания неправедных
  rationale: Близко передаёт целевую конструкцию и нравственно-судебный смысл ἀδίκων.
- source_word: ἀνίεται
  choice: ослабевает
  rationale: Передаёт ослабление натяжения и поддерживает намеренный физический контраст с ἐπιτείνει.
- source_word: εἰς εὐεργεσίαν
  choice: чтобы благодетельствовать
  rationale: Передаёт деятельное совершение добра, а не только отвлечённую пользу.
- source_word: ὑπὲρ τῶν εἰς σὲ πεποιθότων
  choice: тем, кто возложил надежду на Тебя
  rationale: Совершенный вид греческого причастия выражает возникшее и сохраняющееся состояние доверия; русский оборот естественно отражает эту устойчивую надежду.
theological_decisions:
- issue: Действие творения в суде и благодеянии
  choice: Творение представлено как служащее Богу и исполняющее Его цели как в наказании, так и в благодеянии.
  alternative: Понимать творение или природу как самостоятельную безличную силу.
  rationale: ὑπηρετοῦσα и σοι τῷ ποιήσαντι прямо подчёркивают подчинённость творения своему Создателю, не устраняя при этом образ его активного действия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Обращение к Богу оформлено прописными местоимениями. Синтаксический и образный параллелизм греческого текста сохранён.
