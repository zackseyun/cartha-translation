lexical_decisions:
- source_word: τὸ ... μὴ φθειρόμενον
  choice: то, что не разрушалось
  rationale: Субстантивированное причастие отсылает к чудесной пище в контексте. «Не разрушалось» передаёт физическое воздействие огня и сохраняет видовое значение причастия.
- source_word: ὑπὸ πυρὸς
  choice: от огня
  rationale: В русском описании физического воздействия естественно сказать «разрушалось от огня»; это передаёт значение ὑπό с родительным.
- source_word: ἁπλῶς
  choice: едва
  rationale: 'В сочетании с βραχείας выражение подчёркивает резкий контраст: пищу не разрушал огонь, но для таяния было достаточно незначительного солнечного тепла. «Едва» естественно передаёт эту ограниченность, не утяжеляя фразу отдельным «просто».'
- source_word: ὑπὸ βραχείας ἀκτῖνος ἡλίου
  choice: слабым солнечным лучом
  rationale: βραχείας допускает значение малости, слабости или краткости. «Слабым солнечным лучом» естественно по-русски передаёт незначительность воздействия и сохраняет образ луча.
- source_word: θερμαινόμενον
  choice: согретое
  rationale: Причастная форма сохраняет связь с предметом и указывает на умеренное нагревание; «согретое» здесь естественнее и мягче, чем «нагретое».
- source_word: ἐτήκετο
  choice: таяло
  rationale: Имперфект передаёт протекавший процесс; русское несовершенное «таяло» сохраняет этот аспект и физический смысл τήκω.
theological_decisions:
- issue: Описание чуда или обобщённое высказывание о природе
  choice: Передать конкретный парадокс чудесной пищи без поясняющей интерпретации.
  alternative: Истолковать фразу как общее изречение о свойствах сотворённых вещей.
  rationale: Греческая формулировка связана с повествованием о чудесной пище и противопоставляет её устойчивость к огню таянию от слабого солнечного тепла. Перевод сохраняет это напряжение, не объясняя механизм.
