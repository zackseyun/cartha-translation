    issue: «Едва согретое» неоднозначно передаёт ἁπλῶς.
    rationale: Русское «едва согретое» прежде всего описывает слабую степень нагрева; греческое наречие подчёркивает, что для таяния оказалось достаточно самого согревания слабым/кратким лучом. «Всего лишь» точнее сохраняет риторическую функцию без устранения лексической неоднозначности βραχείας.
  - severity: low
