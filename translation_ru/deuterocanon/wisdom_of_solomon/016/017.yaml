base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/017.yaml
  text: 'For what was most astonishing was this: in the water that extinguishes everything[a], the fire had even greater power, for the world fights on behalf of the righteous.'
translation:
  language: ru
  text: 'И вот что всего удивительнее: в воде, которая всё гасит, огонь действовал ещё сильнее, потому что мир[a] сражается за праведных.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мироздание — защитник праведных»; или: «мир выступает в защиту праведных».'
    reason: Лексико-синтаксическая вариативность κόσμος и ὑπέρμαχος.
lexical_decisions:
- source_word: παραδοξότατον
  choice: всего удивительнее
  rationale: Превосходная степень передаёт нечто в высшей мере неожиданное и поразительное; русское выражение естественно вводит описываемое чудо.
- source_word: σβεννύντι
  choice: которая всё гасит
  rationale: Причастие указывает на обычное свойство воды гасить огонь; глагол «гасит» краток и естественен в данном контексте.
- source_word: πλεῖον ἐνήργει
  choice: действовал ещё сильнее
  rationale: Сохраняет значение усиленного действия или действенности огня, не заменяя его отвлечённым понятием силы.
- source_word: ὑπέρμαχος
  choice: сражается за
  rationale: 'Передаёт защитный и воинственный оттенок слова: мир персонифицирован как тот, кто выступает на стороне праведных.'
- source_word: κόσμος
  choice: мир
  rationale: Прямой и ёмкий эквивалент, обозначающий здесь устроенный сотворённый мир; возможное понимание как «мироздание» отмечено в сноске.
- source_word: δικαίων
  choice: праведных
  rationale: Субстантивированное прилагательное естественно передаёт родительный падеж множественного числа и сохраняет нравственно-богословскую категорию.
theological_decisions:
- issue: Смысл выражения κόσμος ὑπέρμαχος δικαίων
  choice: мир сражается за праведных
  alternative: мироздание — защитник праведных; мир выступает в защиту праведных
  rationale: Перевод сохраняет олицетворение сотворённого порядка и воинственно-защитный оттенок ὑπέρμαχος, не превращая образ в более широкое учение о природе.
translation_notes:
  register: Современный литературный русский язык; торжественный, но доступный строй. Конструкция «И вот что всего удивительнее» естественно передаёт пояснительное τὸ γὰρ παραδοξότατον, а несовершенный вид «действовал» отражает длительное ἐνήργει.
