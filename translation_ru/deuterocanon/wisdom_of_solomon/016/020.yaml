base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/020.yaml
  text: Instead of these things[a], you fed your people with the food of angels, and without their labor you sent them ready bread from heaven, able to satisfy every delight and suited to every taste.
translation:
  language: ru
  text: Вместо этого Ты накормил Свой народ пищей ангелов[a] и послал им с неба готовый хлеб без труда с их стороны, способный доставить всякое наслаждение и подходящий для любого вкуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ангельской пищей»; возможно также понимание: «пищей, достойной ангелов». Греческое выражение не требует более точного истолкования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: Вместо этого
  rationale: Оборот противопоставляет Божьи суды над врагами Его заботе о Своём народе; перевод сохраняет контраст и естественно звучит по-русски.
- source_word: ἀγγέλων τροφήν
  choice: пищей ангелов
  rationale: Сохраняет родительную конструкцию и не уточняет сверх греческого текста, принадлежит ли эта пища ангелам или лишь достойна их.
- source_word: ἐψώμισας
  choice: накормил
  rationale: Прямой и естественный эквивалент глагола со значением «дать пищу, накормить».
- source_word: ἕτοιμον ἄρτον
  choice: готовый хлеб
  rationale: Передаёт мысль о хлебе, уже приготовленном и предоставленном Богом.
- source_word: ἀκοπιάτως
  choice: не требовавший от них труда
  rationale: В контексте небесного хлеба выражает отсутствие человеческого труда для его приготовления, не создавая впечатления, будто речь идёт о лёгкости действия для Бога.
- source_word: πᾶσαν ἡδονὴν ἰσχύοντα
  choice: способный доставить всякое наслаждение
  rationale: Передаёт значение способности или действенности (ἰσχύοντα) в отношении всякого приятного ощущения (ἡδονή), не сводя его только к насыщению.
- source_word: πρὸς πᾶσαν ἁρμόνιον γεῦσιν
  choice: подходящий для любого вкуса
  rationale: Естественно передаёт приспособленность хлеба ко всякому вкусу или вкусовому восприятию.
theological_decisions:
- issue: Смысл выражения «пища ангелов»
  choice: Сохранить выражение без пояснения его природы в основном тексте.
  alternative: «пища, достойная ангелов» или «пища от ангелов»
  rationale: Греческая родительная конструкция не требует выбирать между принадлежностью, соответствием или иным отношением; акцент стиха лежит на небесном даре Бога, а не на учении об ангелах.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Местоимения, обращённые к Богу, написаны с прописной буквы; синтаксис сохраняет единство длинной греческой фразы без излишней архаизации.
