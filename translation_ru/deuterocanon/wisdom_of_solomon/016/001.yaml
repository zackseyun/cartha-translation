lexical_decisions:
- source_word: διὰ τοῦτο
  choice: За это
  rationale: Оборот связывает наказание с предшествующим поступком и естественно передаёт причинно-следственную связь в данном контексте.
- source_word: διʼ ὁμοίων
  choice: через подобное
  rationale: Формулировка сохраняет неопределённость греческого выражения и мысль о соответствии средства наказания проступку, не добавляя отсутствующего в стихе пояснения.
- source_word: ἐκολάσθησαν
  choice: были наказаны
  rationale: Глагол здесь обозначает карательное воздействие; «наказаны» точно и нейтрально передаёт его судебный оттенок.
- source_word: ἀξίως
  choice: по справедливости
  rationale: Выражает заслуженный и надлежащий характер наказания; эта формулировка ясна и естественна в современном русском языке.
- source_word: διὰ πλήθους κνωδάλων
  choice: от множества животных
  rationale: Предлог обозначает средство или причину мучений, а πλήθους подчёркивает многочисленность; «животных» сохраняет широкий объём κνωδάλων и не сужает его до пресмыкающихся.
- source_word: ἐβασανίσθησαν
  choice: терпели мучения
  rationale: Передаёт сильное страдание без излишне узкого современного оттенка преднамеренной пытки, возможного у слова «пытали».
theological_decisions:
- issue: Соответствие наказания проступку
  choice: Сохранить общее выражение «через подобное»
  alternative: 'Передать толковательно: «посредством тех же существ, с которыми был связан их грех»'
  rationale: Греческий текст утверждает сходство или соответствие, но в самом стихе не раскрывает его полностью. Перевод не расширяет формулировку за счёт контекста.
