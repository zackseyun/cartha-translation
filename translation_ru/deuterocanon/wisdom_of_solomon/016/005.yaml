base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/005.yaml
  text: For even when a terrible fury of wild beasts came upon them[a], and they were being destroyed by the bites of crooked serpents, your wrath did not remain to the end;
translation:
  language: ru
  text: Ведь даже когда на них обрушилась страшная ярость диких зверей и они погибали от укусов извивающихся змей[a], Твой гнев не продолжался до конца;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изогнутых змей», «вьющихся змей». Греческое прилагательное буквально означает «кривой» или «изогнутый» и здесь, вероятно, описывает форму или движение змей, а не нравственное качество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεινὸς
  choice: страшная
  rationale: Передаёт силу и грозный характер нападения, не усиливая значение сверх греческого прилагательного.
- source_word: θηρίων θυμός
  choice: ярость диких зверей
  rationale: θηρίων обозначает зверей, а θυμός здесь — неистовую ярость; сочетание сохраняет образность и звучит естественно по-русски.
- source_word: ἐπῆλθεν
  choice: обрушилась на них
  rationale: В контексте бедствия и нападения этот глагол естественно передаёт внезапное наступление опасности.
- source_word: δήγμασίν
  choice: от укусов
  rationale: Прямое и ясное соответствие существительному со значением укусов.
- source_word: σκολιῶν ὄφεων
  choice: извивающихся змей
  rationale: σκολιός буквально означает «кривой, изогнутый»; применительно к змеям речь, вероятнее всего, идёт об их извилистой форме или движении, а не о нравственной характеристике.
- source_word: διεφθείροντο
  choice: погибали
  rationale: Имперфект среднего/пассивного залога описывает продолжавшуюся гибель; русское «погибали» естественно сохраняет длительный характер действия.
- source_word: οὐ μέχρι τέλους ἔμεινεν
  choice: не пребывал до конца
  rationale: Формулировка близко сохраняет глагол «оставаться, пребывать» и временное выражение «до конца», не превращая его в толкование.
- source_word: ἡ ὀργή σου
  choice: Твой гнев
  rationale: «Гнев» соответствует торжественному контексту Божьего суда и не ослабляет силу ὀργή.
theological_decisions:
- issue: Временный характер Божьего суда в данном эпизоде
  choice: Твой гнев не пребывал до конца
  alternative: Твой гнев не продолжался бесконечно
  rationale: 'Перевод прямо сохраняет утверждение греческого текста: Божий гнев был действительным, однако в этом событии не остался «до конца». Интерпретирующий вывод о бесконечности или окончательности не добавляется.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавная буква в «Твой» указывает на обращение к Богу. Точка с запятой сохранена, поскольку мысль продолжается в следующем стихе.
