base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/002.yaml
  text: Instead of this punishment[a], you did good to your people; for a strange craving of appetite[b], you prepared quail as food for them.
translation:
  language: ru
  text: 'Вместо того наказания Ты сделал добро Своему народу: ради их сильного желания пищи Ты приготовил им в пищу перепелов с необычным вкусом.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ради желания аппетита — необычный вкус»; греческая фраза сжата. «Необычный вкус» может характеризовать приготовленных перепелов, тогда как точная синтаксическая связь слов в оригинале не вполне явна.'
    reason: Сохранение буквального образа и синтаксической сжатости исходного текста.
lexical_decisions:
- source_word: ἀνθʼ ἧς κολάσεως
  choice: Вместо того наказания
  rationale: ἀντί с родительным падежом выражает замену или контраст; указательное «того» естественно связывает стих с наказанием, описанным выше.
- source_word: εὐεργετήσας τὸν λαόν σου
  choice: оказал благо Своему народу
  rationale: Причастие εὐεργετήσας означает совершение добра или оказание благодеяния. Формулировка передаёт это прямо, не добавляя идеи благословения, которой само слово не требует.
- source_word: εἰς ἐπιθυμίαν ὀρέξεως
  choice: в угоду желанию их аппетита
  rationale: Сочетание двух близких по смыслу слов подчёркивает сильное желание пищи. Оборот с εἰς допускает целевое прочтение; «в угоду» передаёт его без чрезмерно явного добавления результата вроде «чтобы насытить».
- source_word: ξένην γεῦσιν
  choice: необычное лакомство
  rationale: Буквально сочетание указывает на «необычный вкус». В данном контексте русское «лакомство» естественно обозначает пищу с необычным, желанным вкусом, сохраняя при этом оттенок необычности ξένην.
- source_word: τροφὴν ἡτοίμασας ὀρτυγομήτραν
  choice: Ты приготовил им в пищу перепелов
  rationale: τροφὴν и ἡτοίμασας переданы как «приготовил в пищу», а ὀρτυγομήτραν — обычным русским названием птицы «перепела». Множественное число естественно в повествовании о пище, данной всему народу.
theological_decisions:
- issue: Противопоставление наказания других народов благодеянию Божьему народу
  choice: «Вместо того наказания Ты оказал благо Своему народу»
  alternative: «В связи с тем наказанием Ты оказал благо Своему народу»
  rationale: Конструкция ἀνθʼ ἧς наиболее естественно выражает противопоставление или замену. Перевод сохраняет контраст между наказанием, упомянутым в контексте, и Божьим благодеянием Своему народу, не уточняя его сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прописные местоимения при обращении к Богу использованы последовательно. Сжатость греческой конструкции раскрыта в основном тексте, а её буквальная форма и неоднозначность отмечены в сноске.
