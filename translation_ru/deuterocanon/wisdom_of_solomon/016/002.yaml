  naturalness: «Оказал благо» и «в угоду желанию их аппетита» звучат искусственно. «Сделал добро» и «ради их сильного желания пищи» сохраняют смысл и усиление двух греческих слов, но читаются по-русски естественно. «Перепелов с необычным вкусом» ясно связывает ξένην γεῦσιν с данной пищей.
  terminology: «Наказание», «народ», «перепела» переданы верно. Прописные местоимения при обращении к Богу сохранены как допустимая особенность умеренно возвышенного библейского регистра.
