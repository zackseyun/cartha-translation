base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/011.yaml
  text: For they were being pricked as a reminder of your sayings, and were quickly rescued, so that, after falling into deep forgetfulness, they might not become cut off from your beneficence.
translation:
  language: ru
  text: Ведь их жалили, чтобы напомнить им о Твоих речениях, и быстро спасали, чтобы они, впав в глубокое забвение, не оказались отчуждёнными от Твоего благодеяния.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не оказались отстранёнными от Твоего благодеяния». Греческое ἀπερίσπαστοι допускает близкие оттенки отчуждённости, отстранённости или утраты связи.'
    reason: Необычное употребление ἀπερίσπαστοι с родительным падежом не следует сводить к одному бесспорному оттенку.
lexical_decisions:
- source_word: λογίων
  choice: речениях
  rationale: Передаёт значение священных, исходящих от Бога изречений, не сужая его до заповедей и не обобщая до любых слов.
- source_word: ἐνεκεντρίζοντο
  choice: их жалили
  rationale: В контексте укусов змей глагол естественно означает болезненное ужаление; несовершенный вид сохраняет длительно-повторительный оттенок имперфекта.
- source_word: ὀξέως διεσώζοντο
  choice: быстро спасали
  rationale: «Быстро» передаёт ὀξέως, а «спасали» — усиленный глагол избавления διεσώζοντο; русская пассивная конструкция заменена естественной неопределённо-личной.
- source_word: εὐεργεσίας
  choice: благодеянию
  rationale: Сохраняет значение конкретного Божьего благотворного действия или дара, не подменяя его более широкими понятиями милости или благодати.
theological_decisions:
- issue: Значение ἀπερίσπαστοι с родительным τῆς σῆς εὐεργεσίας
  choice: не стали невосприимчивы к Твоему благодеянию
  alternative: не лишились Твоего благодеяния
  rationale: Выбранный вариант сохраняет акцент на состоянии людей после глубокого забвения и не утверждает однозначно, что Бог прекратил бы благодеяние; неоднозначность оборота отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Местоимение «Твоих/Твоему» написано с прописной буквы как традиционное уважительное обращение к Богу. Синтаксис сделан естественным для современного читателя без устранения образа ужаления и смысловой напряжённости заключительной фразы.
