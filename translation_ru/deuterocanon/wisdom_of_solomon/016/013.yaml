  - marker: b
    text: 'Или: «выводишь наверх» или «поднимаешь». Греческий глагол просто обозначает движение вверх и противопоставлен слову «низводишь».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν ἔχεις
  choice: Ты властен
  rationale: Выражение передаёт суверенную власть и право распоряжаться, а не только способность; по-русски естественнее, чем буквальное «имеешь власть».
- source_word: ζωῆς καὶ θανάτου
  choice: над жизнью и смертью
  rationale: Предложное управление естественно передаёт греческие родительные при ἐξουσίαν и сохраняет прямое противопоставление.
- source_word: κατάγεις
  choice: низводишь
  rationale: Сохраняет направленность вниз и образную параллель с ἀνάγεις, оставаясь уместным в достоинственном литературном регистре.
- source_word: πύλας ᾅδου
  choice: вратам царства мёртвых
  rationale: «Царство мёртвых» передаёт ᾅδης как область пребывания умерших, не смешивая её с могилой или местом окончательного наказания; «врата» сохраняют конкретный образ.
- source_word: ἀνάγεις
  choice: возводишь оттуда
  rationale: Сохраняет противопоставление нисхождения и восхождения. «Оттуда» делает подразумеваемую точку исхода понятной по-русски, не добавляя технического утверждения о воскресении.
theological_decisions:
- issue: Передача ᾅδου
  choice: царство мёртвых
  alternative: ад; преисподняя; могила
  rationale: Греческое слово обозначает область мёртвых. «Ад» в современном русском часто понимается исключительно как место наказания, а «могила» чрезмерно сужает смысл; «царство мёртвых» сохраняет широту понятия.
- issue: Смысл ἀνάγεις
  choice: возводишь оттуда
  alternative: воскрешаешь; выводишь наверх
  rationale: Глагол выражает движение вверх и противопоставлен κατάγεις. Перевод не превращает его без необходимости в специальный термин воскресения, сохраняя богословскую напряжённость исходника.
translation_notes:
  register: Современный литературный русский с достоинственным библейским звучанием. Парные глаголы «низводишь — возводишь» сохраняют риторическую симметрию греческого текста; заглавное «Ты» соответствует принятому русскому благоговейному обращению к Богу.
