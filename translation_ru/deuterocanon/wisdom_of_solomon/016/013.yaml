  text: For you have authority over life and death[b][a], and you bring down to the gates of Hades and bring up.
translation:
  language: ru
  text: Ведь Ты властен над жизнью и смертью и низводишь к вратам Аида[a], и возводишь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
