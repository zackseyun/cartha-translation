base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/004.yaml
  text: For it was necessary that unavoidable want should come upon those who tyrannized[b][a], but to these only that it should be shown how their enemies were being tormented.
translation:
  language: ru
  text: Ибо тех, кто угнетал[a], должна была постигнуть неотвратимая нужда[b], а этим было лишь показано, как мучились их враги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тиранов»; греческая форма подчёркивает их действие — то, что они угнетали других.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «неизбежное лишение необходимого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: должна была
  rationale: Передаёт выраженную безличным глаголом необходимость того, что должно было произойти, без сведения смысла лишь к нравственной уместности.
- source_word: ἀπαραίτητον ἔνδειαν
  choice: неотвратимая нужда
  rationale: Сохраняет сочетание неизбежности с тяжёлым недостатком необходимого, не сужая значение до одного только голода.
- source_word: ἐπελθεῖν
  choice: постигнуть
  rationale: Естественно по-русски передаёт бедствие, приходящее на людей и настигающее их.
- source_word: τυραννοῦσιν
  choice: тех, кто угнетал
  rationale: Сохраняет глагольную силу греческой формы и подчёркивает совершаемое притеснение, а не только постоянное наименование «тираны».
- source_word: τούτοις δὲ μόνον
  choice: а этим — лишь
  rationale: Сохраняет резкое противопоставление двух групп и ограничительное значение μόνον.
- source_word: δειχθῆναι
  choice: показано
  rationale: 'Сохраняет страдательный залог: речь не просто о том, что они увидели, а о том, что им было показано.'
- source_word: πῶς
  choice: как
  rationale: Передаёт содержание показанного, сохраняя возможный оттенок образа или характера страдания.
- source_word: ἐβασανίζοντο
  choice: мучились
  rationale: Передаёт сильное страдание, не вводя более узкого современного представления о судебной пытке.
theological_decisions:
- issue: Различие суда над угнетателями и участи Божьего народа
  choice: Угнетателей должна была непосредственно постигнуть тяжёлая нужда, тогда как другой группе было лишь показано мучение её врагов.
  alternative: 'Вторую часть можно передать более динамично: «а этим нужно было лишь увидеть, как мучились их враги».'
  rationale: 'Противопоставление τούτοις δὲ μόνον и страдательное δειχθῆναι подчёркивают различную участь двух групп: одни испытывают бедствие, другим его показывают. Перевод сохраняет эту асимметрию, не добавляя богословского объяснения.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «а этим — лишь» кратко и выразительно сохраняет греческое противопоставление; местоимение «этим» оставлено без поясняющей вставки, чтобы не устранять контекстуальную соотнесённость оригинала.
