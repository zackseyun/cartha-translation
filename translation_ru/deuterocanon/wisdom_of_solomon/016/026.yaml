base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/026.yaml
  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes a man[b], but your word preserves those who trust in you.
translation:
  language: ru
  text: чтобы Твои сыны, которых Ты возлюбил, Господи, узнали, что не урожай питает человека[a], но Твоё слово сохраняет тех, кто уповает на Тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вероятная отсылка ко Второзаконию 8:3: жизнь человека поддерживается не одной пищей, но словом Бога.'
    reason: cross_reference
  - marker: b
    text: 'Или: «верит Тебе». Греческое выражение может обозначать как доверие и упование на Бога, так и веру в сказанное Им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: чтобы ... узнали
  rationale: Союз ἵνα с сослагательным наклонением выражает цель; русская конструкция «чтобы ... узнали» естественно передаёт эту функцию.
- source_word: οἱ υἱοί σου
  choice: Твои сыны
  rationale: υἱοί — форма мужского рода множественного числа. «Сыны» сохраняет точность исходного текста и уместно в возвышенной молитвенной речи.
- source_word: οὓς ἠγάπησας
  choice: которых Ты возлюбил
  rationale: Аорист передан простым прошедшим временем; «возлюбил» соответствует достоинству контекста, не добавляя отсутствующих в греческом аспектуальных оттенков.
- source_word: Κύριε
  choice: Господи
  rationale: Форма звательного обращения естественно передаётся традиционным русским звательным «Господи».
- source_word: αἱ γενέσεις τῶν καρπῶν
  choice: урожай
  rationale: В данном контексте выражение означает произрастание или урожай плодов земли. «Урожай» ясно и естественно передаёт сельскохозяйственный смысл без буквальной тяжеловесности.
- source_word: τρέφουσιν ἄνθρωπον
  choice: питает человека
  rationale: τρέφω означает «питать, кормить», а ἄνθρωπον употреблено в обобщённом единственном числе; русское «человека» сохраняет эту форму.
- source_word: τὸ ῥῆμά σου
  choice: Твоё слово
  rationale: ῥῆμα означает слово или изречение. «Твоё слово» естественно и сохраняет вероятную связь со Второзаконием 8:3.
- source_word: τοὺς σοὶ πιστεύοντας
  choice: тех, кто уповает на Тебя
  rationale: πιστεύω с дательным может обозначать веру, доверие и полагающуюся на кого-либо надежду. «Уповает на Тебя» передаёт личное доверие Богу, не исключая значения веры.
- source_word: διατηρεῖ
  choice: сохраняет
  rationale: διατηρέω означает сохранять, оберегать или поддерживать жизнь. «Сохраняет» удерживает широту значения и соответствует противопоставлению физическому питанию.
theological_decisions:
- issue: Вероятная отсылка ко Второзаконию 8:3
  choice: 'Сохранить формулировку самого текста: «не урожай питает человека, но Твоё слово сохраняет»'
  alternative: Расширить или гармонизировать текст формулой «не хлебом одним живёт человек»
  rationale: Греческий текст Книги Премудрости содержит собственную формулировку. Перевод сохраняет её смысл и библейский отзвук, не превращая аллюзию в прямую цитату.
- issue: Значение πιστεύοντας
  choice: уповает на Тебя
  alternative: верит Тебе; верует в Тебя
  rationale: Дательный σοὶ допускает как доверие сказанному Богом, так и личное упование на Него. Основной текст передаёт контекстуально вероятное доверительное упование, а примечание сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-библейским регистром. Формы «сыны», «возлюбил» и «Господи» сохраняют достоинство обращения; синтаксис остаётся ясным для современного читателя. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятым русским благоговейным оформлением.
