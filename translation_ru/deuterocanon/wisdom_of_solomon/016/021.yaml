  footnotes:
  - marker: a
    text: 'Или: «Твоя природа». Греческое ὑπόστασις может означать «сущность», «природа» или «лежащая в основе реальность». В данном контексте оно, вероятно, связано с чудесной пищей — манной — и её свойствами.'
    reason: lexical_alternative
  - marker: b
    text: То есть чудесная пища изменяла свои свойства сообразно вкусу и желанию каждого человека.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπόστασίς
  choice: данная Тобой пища
  rationale: В ближайшем контексте речь идёт о манне; конкретизация естественна по-русски и не превращает выражение в утверждение о метафизической сущности Бога. Буквальная неоднозначность отмечена в сноске.
- source_word: γλυκύτητα
  choice: сладость
  rationale: Сохраняет одновременно вкусовой образ и переносный смысл благости Бога.
- source_word: τέκνα
  choice: детям
  rationale: Обозначает весь Божий народ, а не только мужчин.
- source_word: τοῦ προσφερομένου
  choice: того, кто её вкушал
  rationale: В контексте чудесной пищи оборот указывает на получателя, который принимает её как пищу; русский вариант передаёт это естественно.
- source_word: ἐπιθυμίᾳ ὑπηρετῶν
  choice: угождая желанию
  rationale: Передаёт образ служения индивидуальному желанию без излишне буквального и тяжеловесного оборота.
- source_word: μετεκιρνᾶτο
  choice: становилась такой
  rationale: Глагол обозначает изменение состава или свойств; формулировка передаёт приспособление пищи к желаемому вкусу.
- source_word: πρὸς ὃ τις ἐβούλετο
  choice: какой хотел каждый
  rationale: 'Сохраняет распределительный смысл: пища приспосабливалась к желанию каждого человека.'
theological_decisions:
- issue: Референт выражения ἡ ὑπόστασίς σου
  choice: Богом данная пища, то есть манна, в её чудесных свойствах
  alternative: «Твоя сущность» или «Твоя природа» как непосредственное указание на природу Бога
  rationale: Продолжение стиха описывает изменение пищи сообразно желанию вкушающего, поэтому ближайшим референтом служит манна. Сноска сохраняет лексическую неоднозначность греческого выражения.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. «Сладость» намеренно сохраняет двойной, вкусовой и нравственный, образ. Местоимения, относящиеся к Богу, написаны с прописной буквы.
