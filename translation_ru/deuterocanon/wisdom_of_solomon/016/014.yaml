base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/014.yaml
  text: But a man kills by his own wickedness[a], and when a spirit has gone out, he does not bring it back, nor does he release a soul that has been taken.
translation:
  language: ru
  text: Но человек своей злобой убивает; отошедший дух он не возвращает и не освобождает взятую душу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а когда дыхание отошло, он не возвращает его и не освобождает отнятую жизнь». Греческие слова πνεῦμα и ψυχή в зависимости от контекста могут означать соответственно «дух / дыхание» и «душа / жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: человек
  rationale: Родовое единственное число обозначает человека как такового и в контексте противопоставляет ограниченность людей Божьей власти.
- source_word: ἀποκτέννει
  choice: убивает
  rationale: Прямой и естественный эквивалент глагола со значением лишения жизни.
- source_word: τῇ κακίᾳ αὐτοῦ
  choice: по своей злобе
  rationale: κακία здесь указывает на нравственное зло, злобу или злой умысел; оборот сохраняет притяжательное αὐτοῦ и причинно-орудийную силу дательного падежа.
- source_word: ἐξελθὸν ... πνεῦμα
  choice: вышедший дух
  rationale: Сохраняет образ ухода и широту πνεῦμα, которое в контексте смерти может означать дух или дыхание.
- source_word: οὐκ ἀναστρέφει
  choice: не возвращает
  rationale: Передаёт невозможность человека вернуть ушедший дух.
- source_word: οὐδὲ ἀναλύει
  choice: и не освобождает
  rationale: Сохраняет значение развязывания или освобождения, не подменяя его общим понятием восстановления жизни.
- source_word: ψυχὴν παραλημφθεῖσαν
  choice: взятую душу
  rationale: Сохраняет отдельный термин ψυχή и пассивный образ того, что душа была взята; возможное контекстуальное значение «жизнь» отмечено в сноске.
theological_decisions:
- issue: Значение πνεῦμα и ψυχή в контексте смерти
  choice: В основном тексте передать как «дух» и «душа».
  alternative: Передать как «дыхание» и «жизнь».
  rationale: Греческий текст использует два различных, но частично пересекающихся антропологических термина. Их сохранение не стирает концептуальную фактуру стиха, а сноска предупреждает, что они не обязательно выражают жёсткое метафизическое разграничение.
translation_notes:
  register: Современный литературный русский язык; краткий, весомый синтаксис сохраняет противопоставление человеческой способности убить и неспособности обратить смерть. Маркер сноски поставлен после всего антропологического высказывания, к которому относится пояснение.
