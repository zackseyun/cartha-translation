    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμοῦντες τροφήν
  choice: хотя и желали пищи
  rationale: Оборот передаёт сильное желание еды, не усиливая его до «жаждали», и сохраняет уступительный смысл контекста.
- source_word: διὰ τὴν δειχθεῖσαν τῶν ἐπαπεσταλμένων
  choice: при виде посланных на них существ
  rationale: Греческая конструкция несколько сжата и трудна; перевод передаёт зрительное восприятие посланных против египтян существ как причину отвращения, не уточняя их вид.
- source_word: τὴν ἀναγκαίαν ὄρεξιν
  choice: необходимой потребности в еде
  rationale: Сочетание обозначает аппетит, вызываемый телесной необходимостью. По-русски «необходимая потребность в еде» естественнее буквального «необходимый аппетит».
- source_word: ἀποστρέφωνται
  choice: отвернулись
  rationale: Сохраняет образ отворачивания от пищи; вызванное отвращение ясно из контекста.
- source_word: ἐπʼ ὀλίγον ἐνδεεῖς γενόμενοι
  choice: недолго пробыв в нужде
  rationale: Передаёт и кратковременность, и состояние нехватки, не вводя отсутствующего в тексте понятия голода.
- source_word: ξένης μετάσχωσι γεύσεως
  choice: вкусили необычной пищи
  rationale: Буквальная «чуждая проба/вкус» в русском неестественна. Контекст говорит об участии в необычной, прежде незнакомой пище; глагол «вкусили» сохраняет игру с γεύσεως.
theological_decisions:
- issue: Кого обозначают противопоставленные ἐκεῖνοι и αὐτοί
  choice: Сохранено местоименное противопоставление «те» и «эти»; контекст соотносит первых с египтянами, а вторых — с народом Божьим.
  alternative: 'Назвать группы прямо: «египтяне» и «твой народ/израильтяне».'
  rationale: Имена групп понятны из ближайшего контекста, но в самом стихе не употреблены. Сохранение местоимений избегает внесения пояснения в основной текст.
- issue: Значение ξένης γεύσεως
  choice: «необычной пищи» — незнакомая, чудесно дарованная пища.
  alternative: «необычного вкуса» или «чуждого вкуса».
  rationale: Выражение может акцентировать необычный вкус или необычный вид пищи. Выбранный вариант естественен по-русски, а примечание сохраняет оттенок исходного образа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксическое противопоставление «те — эти» сохранено; тяжёлые буквальные сочетания переданы естественно, а существенная образность и неоднозначность отмечены в сносках.
