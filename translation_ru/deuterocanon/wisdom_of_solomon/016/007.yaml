  - marker: b
    text: 'Греческое выражение можно понимать широко: «Спасителю всех» или «Спасителю всего». Текст не уточняет объём этого определения. Буквально противопоставлены «созерцаемое» и «Ты»: видимый предмет сам по себе не был источником спасения — спасал Бог.'
    reason: ambiguity
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: обратившийся
  rationale: Субстантивированное причастие от ἐπιστρέφω обозначает того, кто повернулся к назначенному знамению. «Обратившийся» сохраняет направленность действия, не сводя его ни к простому взгляду, ни к покаянию.
- source_word: τὸ θεωρούμενον
  choice: то, на что смотрел
  rationale: Субстантивированное страдательное причастие от θεωρέω указывает на созерцаемый предмет. Такой перевод естественен по-русски и сохраняет мысль о видимом объекте, на который был направлен взгляд.
- source_word: ἐσώζετο
  choice: спасался
  rationale: Имперфект страдательного залога передан несовершенным видом, что сохраняет аспектуальную форму греческого текста и хорошо соответствует пояснительному характеру высказывания.
- source_word: σωτῆρα
  choice: Спасителю
  rationale: «Спаситель» прямо передаёт божественный титул и сохраняет словесную связь с глаголом «спасался».
- source_word: πάντων
  choice: всех
  rationale: Форма родительного падежа множественного числа имеет широкий объём. «Всех» сохраняет всеохватность выражения, не уточняя её догматически.
theological_decisions:
- issue: Причинное противопоставление видимого знамения и Бога
  choice: «не благодаря тому, на что смотрел, а благодаря Тебе»
  alternative: «не через то, на что смотрел, а через Тебя»
  rationale: Оборот οὐ διὰ … ἀλλὰ διὰ явно противопоставляет видимый предмет Богу как истинному источнику спасения. «Благодаря» естественно передаёт причинно-инструментальное значение, не отрицая повествовательной роли самого знамения.
- issue: Объём πάντων в божественном титуле
  choice: «Спасителю всех»
  alternative: «Спасителю всего»
  rationale: Греческая форма допускает широкое понимание. Перевод «всех» сохраняет традиционно и естественно звучащий титул, а примечание не позволяет неоправданно сузить его только до одной группы.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным звучанием. Местоимение «Тебе» написано с прописной буквы как уважительное обращение к Богу. Синтаксический параллелизм «не благодаря… а благодаря…» сохраняет риторический контраст оригинала.
