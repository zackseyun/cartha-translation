translation:
  language: ru
  text: А оно снова забыло о собственной силе, чтобы праведники были накормлены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утратило собственную силу» или «отказалось от собственной силы». Греческий текст олицетворяет предмет или стихию, говоря, что оно «забыло» о собственной силе.'
    reason: Лексическая альтернатива и пояснение сохранённого олицетворения.
lexical_decisions:
- source_word: τοῦτο πάλιν δʼ
  choice: А оно, в свою очередь
  rationale: Средний род местоимения сохраняет отсылку к ранее названному явлению; «в свою очередь» естественно передаёт πάλιν как смену действия в последовательности, а δέ — как переход и лёгкое противопоставление.
- source_word: ἵνα τραφῶσιν
  choice: чтобы ... получили пищу
  rationale: Передаёт целевое значение ἵνα с сослагательным наклонением и пассивную направленность τρέφω, не создавая тяжеловесного русского пассива.
- source_word: δίκαιοι
  choice: праведники
  rationale: Субстантивированное прилагательное обозначает людей, характеризуемых праведностью; «праведники» кратко и естественно для библейского регистра.
- source_word: ἐπιλησθῇ
  choice: забыло
  rationale: Сохраняет прямое значение глагола «забывать» и яркое олицетворение природной стихии.
- source_word: τῆς ἰδίας ... δυνάμεως
  choice: даже о собственной силе
  rationale: «Собственной» передаёт рефлексивный оттенок ἰδίας, а «силе» сохраняет широкий смысл δύναμις как действующей способности или мощи. Частица «даже» естественно подчёркивает необычность описанного, хотя в данном греческом тексте отдельного καί перед оборотом нет.
theological_decisions:
- issue: Олицетворение сотворённой стихии в связи с Божьим попечением
  choice: 'Сохранено буквальное олицетворение: «забыло ... о собственной силе».'
  alternative: «лишилось своей обычной силы» или «перестало действовать как обычно»
  rationale: Греческий глагол прямо описывает предмет или стихию как способную забыть. Это поддерживает характерное для книги Премудрости изображение творения, откликающегося на Божью волю ради праведников, без поясняющего догматического расширения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Необычное олицетворение сохранено, а тяжеловесная пассивная конструкция заменена естественным выражением «получили пищу».
