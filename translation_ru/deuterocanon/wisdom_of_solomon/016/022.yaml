base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/022.yaml
  text: But snow and ice endured fire and did not melt[a], so that they might know that fire, blazing in the hail and flashing in the rainstorms, was destroying the fruits of the enemies;
translation:
  language: ru
  text: Но снег и лёд выдержали огонь и не растаяли, чтобы они узнали, что огонь, пылая среди града и сверкая в ливнях, уничтожал плоды врагов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «урожай врагов», «произведения земли врагов». Буквально по-гречески: «плоды врагов».'
    reason: Лексема καρποί может обозначать как плоды, так и урожай или земные произведения вообще.
lexical_decisions:
- source_word: χιὼν
  choice: снег
  rationale: Основное значение слова — «снег»; это также сохраняет отличие от χαλάζῃ («град») далее в стихе.
- source_word: κρύσταλλος
  choice: лёд
  rationale: В сочетании со снегом и в противопоставлении таянию слово обозначает лёд; буквальное «кристалл» здесь вводило бы в заблуждение.
- source_word: ὑπέμεινε πῦρ
  choice: выдержали огонь
  rationale: Передаёт стойкость снега и льда перед действием огня и сохраняет парадокс исходного текста.
- source_word: οὐκ ἐτήκετο
  choice: не растаяли
  rationale: Естественный русский эквивалент применительно к снегу и льду.
- source_word: ἵνα γνῶσιν
  choice: чтобы они узнали
  rationale: Сохраняет целевое значение ἵνα и не уточняет не названный в греческом тексте субъект.
- source_word: κατέφθειρε
  choice: уничтожал
  rationale: Несовершенный вид передаёт длительное действие греческого имперфекта.
- source_word: φλεγόμενον ἐν τῇ χαλάζῃ
  choice: пылая среди града
  rationale: Причастие относится к огню; «среди града» естественно выражает его присутствие в граде.
- source_word: ἐν τοῖς ὑετοῖς διαστράπτον
  choice: сверкая в ливнях
  rationale: Передаёт молниеподобное сверкание огня в сильных дождях; множественное число сохранено естественной русской формой.
- source_word: τοὺς τῶν ἐχθρῶν καρποὺς
  choice: плоды врагов
  rationale: Формально сохраняет образ καρποί и допускает сельскохозяйственное значение «урожай», указанное в примечании.
theological_decisions:
- issue: Целевая конструкция и субъект познания
  choice: «чтобы они узнали» без уточнения, кто именно должен был узнать
  alternative: «чтобы враги узнали» или более обобщённое «чтобы люди узнали»
  rationale: В греческом глагол стоит во множественном числе без явно выраженного субъекта. Перевод сохраняет эту неоднозначность и не сужает круг подразумеваемых лиц.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет образное противопоставление огня снегу и льду, а также длительность уничтожающего действия; архаизмы и конфессионально окрашенные уточнения исключены.
