base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/018.yaml
  text: For at one time the flame was subdued[a], so that it might not burn up the creatures sent against the ungodly; but they themselves, seeing it[c][b], might know that they were being pursued by the judgment of God.
translation:
  language: ru
  text: Ибо порой пламя укрощалось[a], чтобы не сжечь животных, посланных против нечестивых[b], но чтобы сами нечестивые, видя это[c], поняли, что Божий суд гонит их[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смирялось», «становилось кротким».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «живых существ, посланных против нечестивых».'
    reason: lexical_alternative
  - marker: c
    text: 'В греческом тексте предмет наблюдения прямо не назван; возможно также: «наблюдая происходящее».'
    reason: source_ambiguity
  - marker: d
    text: 'Или: «что Божий суд преследует их»; также возможно: «что их гонят по Божьему приговору».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεροῦτο
  choice: укрощалось
  rationale: Глагол ἡμερόω означает «укрощать, делать кротким, смягчать». В сочетании с пламенем «укрощалось» сохраняет яркий образ и не подразумевает, что огонь угас.
- source_word: φλόξ
  choice: пламя
  rationale: φλόξ обозначает именно пламя, а не огонь вообще; единственное число исходного текста сохранено.
- source_word: καταφλέξῃ
  choice: сжечь
  rationale: Приставочный глагол передаёт полное уничтожение огнём. В данном контексте естественное русское «сжечь» выражает этот результат.
- source_word: τὰ ἐπʼ ἀσεβεῖς ἀπεσταλμένα ζῷα
  choice: существ, посланных против нечестивых
  rationale: ζῷα — живые существа, в контексте казней также животные. Более широкое «существа» не сужает референт, а «против» передаёт враждебную направленность ἐπί.
- source_word: ἀσεβεῖς
  choice: нечестивых
  rationale: «Нечестивые» сохраняет нравственно-религиозное значение ἀσεβεῖς и соответствует возвышенному, но понятному библейскому регистру.
- source_word: βλέποντες
  choice: видя это
  rationale: В греческом объект не выражен; местоимение «это» естественно отсылает к наблюдаемому укрощению пламени, не уточняя его сверх контекста.
- source_word: εἴδωσιν
  choice: поняли
  rationale: Здесь εἴδωσιν обозначает достигнутое через наблюдение осознание; «поняли» естественно передаёт переход от видения к знанию.
- source_word: θεοῦ κρίσει
  choice: Божий суд
  rationale: κρίσις имеет судебно-богословский смысл. Конструкция «их гонит Божий суд» передаёт творительный оттенок греческого дательного и сохраняет явную связь происходящего с Божьим судом.
- source_word: ἐλαύνονται
  choice: их гонит
  rationale: ἐλαύνω может означать «гнать, теснить, преследовать». «Их гонит» сохраняет динамику длительного давления и звучит естественно по-русски.
theological_decisions:
- issue: Характер Божьего действия в образе казни
  choice: Божий суд представлен как сила, гонящая нечестивых
  alternative: Нечестивых преследуют в соответствии с Божьим приговором
  rationale: θεοῦ κρίσει прямо связывает происходящее с Божьим судебным действием; перевод не ослабляет эту связь до простого стечения обстоятельств, но и не уточняет механизм причинности сверх сказанного в стихе.
- issue: Предмет наблюдения в βλέποντες
  choice: «видя это» с контекстуальной отсылкой к происходящему
  alternative: «наблюдая» без выраженного дополнения
  rationale: Греческий текст не называет объект прямо. Местоимение среднего рода сохраняет широкую контекстуальную отсылку и не утверждает догматически, что наблюдалось только пламя или только посланные существа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Образ «укрощённого» пламени сохранён; синтаксис двух целевых придаточных передан симметричной конструкцией «чтобы… но чтобы…». Лексика понятна широкому читателю и не вносит конфессиональных уточнений.
