  source_fidelity: 'Греческий текст передан в целом точно: ἡμεροῦτο — «укрощалось», φλόξ — «пламя», а двойная конструкция ἵνα сохранена. Однако местоимение «они» после ближайшего слова «существ» создаёт в русском тексте нежелательную синтаксическую двусмысленность: αὐτοί относится к нечестивым, а не к посланным животным. Это следует выразить явно.'
  naturalness: Фраза звучит в современном литературном русском и сохраняет умеренно библейский регистр. Замена «они сами» на «сами нечестивые» делает противопоставление ясным и естественным. «Божий суд гонит их» сохраняет образ и несколько яснее связывает действующее начало с судом.
  terminology: «Нечестивые» адекватно передаёт ἀσεβεῖς; «Божий суд» — θεοῦ κρίσει. «Животные» точнее и естественнее для ζῷα в контексте казней, чем слишком широкое «существа», при этом вариант «существа» можно оставить в сноске.
