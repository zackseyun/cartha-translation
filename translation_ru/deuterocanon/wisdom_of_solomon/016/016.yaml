base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/016.yaml
  text: For because they refused to know you[a], the ungodly were scourged by the strength of your arm, pursued by strange rains and hail and relentless storms[b], and consumed by fire.
translation:
  language: ru
  text: Ибо нечестивые отказались знать Тебя и были бичеваны силой Твоей руки; их преследовали необычные дожди[a], град и неотвратимые ливни[b], а огонь пожирал их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чужими» или «чуждыми дождями»; речь идёт о необычных, небывалых дождях.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «неизбежными ливнями»; греческое слово обозначает то, чего нельзя отвести, отклонить или избежать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνούμενοι … σε εἰδέναι
  choice: отказавшись знать Тебя
  rationale: Оборот передаёт сознательный отказ, выраженный ἀρνέομαι с инфинитивом, и сохраняет прямое значение εἰδέναι — «знать», не заменяя его толкованием «признавать».
- source_word: ἀσεβεῖς
  choice: нечестивые
  rationale: Слово обозначает людей, проявляющих нечестие по отношению к Богу; «нечестивые» точнее религиозно-нравственного оттенка, чем более общее «злые».
- source_word: ἐν ἰσχύι βραχίονός σου
  choice: силой Твоей руки
  rationale: Сохранены инструментальное значение оборота и библейский образ Божьей руки как выражения силы.
- source_word: ἐμαστιγώθησαν
  choice: были бичуемы
  rationale: Глагол буквально связан с бичеванием и здесь образно описывает суровую кару; выбранный вариант сохраняет яркость образа.
- source_word: ξένοις ὑετοῖς
  choice: необычными дождями
  rationale: ξένος здесь указывает на небывалый, необычайный характер дождей; буквальное «чужими дождями» в современном русском звучит неясно.
- source_word: χαλάζαις
  choice: градом
  rationale: Естественный русский эквивалент названия погодного явления; множественное число греческого не требуется воспроизводить буквально.
- source_word: ὄμβροις ἀπαραιτήτοις
  choice: неотвратимыми ливнями
  rationale: ὄμβρος обозначает сильный дождь или ливень, а ἀπαραίτητος — то, что невозможно отвести, отклонить или избежать.
- source_word: διωκόμενοι
  choice: преследуемы
  rationale: Сохраняется олицетворённый образ стихий, которые гонятся за нечестивыми.
- source_word: πυρὶ καταναλισκόμενοι
  choice: пожираемы огнём
  rationale: Передаёт уничтожающую силу огня и сохраняет возвышенный, образный характер греческого выражения.
theological_decisions:
- issue: Смысл «знать» Бога в εἰδέναι
  choice: знать Тебя
  alternative: признать Тебя; познать Тебя
  rationale: Греческий текст прямо говорит «знать». Контекст подразумевает сознательное непризнание Бога, однако перевод не разворачивает это в богословское пояснение и сохраняет смысловую открытость.
- issue: Образ бичевания как Божьей кары
  choice: были бичуемы
  alternative: были наказаны; были поражены
  rationale: Хотя кара осуществляется посредством стихий, автор намеренно употребляет яркий образ бичевания; более общий вариант ослабил бы напряжённость текста.
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Сохранены цепочка страдательных форм и олицетворённое преследование стихиями; прописные местоимения при обращении к Богу соответствуют русской библейской издательской традиции.
