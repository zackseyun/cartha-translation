  text: But it is impossible to escape your hand[a].
translation:
  language: ru
  text: Но избежать Твоей руки невозможно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убежать от Твоей руки». Греческий текст сохраняет конкретный образ Божьей руки как обозначение Его силы и власти, от которых невозможно укрыться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὴν ... σὴν χεῖρα
  choice: Твоей руки
  rationale: χείρ буквально означает «рука» и здесь образно указывает на Божью силу и власть. Конкретный образ сохранён, поскольку он естественен по-русски и передаёт неотвратимость Божьего действия.
- source_word: φυγεῖν
  choice: избежать
  rationale: φυγεῖν может означать «бежать», но с прямым дополнением здесь выражает смысл уклонения или избавления от чьей-либо власти; «избежать» звучит естественно и точно.
- source_word: ἀδύνατόν ἐστιν
  choice: невозможно
  rationale: Безличная конструкция прямо выражает невозможность и естественно передаётся русским «невозможно».
- source_word: δὲ
  choice: Но
  rationale: δέ обозначает контраст с предшествующей мыслью; союз «но» ясно сохраняет это противопоставление.
theological_decisions:
- issue: Антропоморфный образ Божьего действия
  choice: Сохранить в основном тексте выражение «Твоей руки»
  alternative: Твоей власти; Твоей силы
  rationale: Греческий текст использует телесный образ для обозначения действенной Божьей власти. Перевод сохраняет этот образ и его богословскую напряжённость, не заменяя его отвлечённым толкованием.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и естественная формулировка. Местоимение «Твоей» написано с прописной буквы как традиционное уважительное обращение к Богу.
