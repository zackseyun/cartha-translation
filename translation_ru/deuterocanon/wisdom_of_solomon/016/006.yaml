base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/006.yaml
  text: But for a short time they were troubled as a warning, having a sign of salvation, for a reminder of the commandment of your law;
translation:
  language: ru
  text: Но для вразумления они были потревожены лишь ненадолго, имея знак спасения[a], напоминавший о заповеди Твоего закона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знамение спасения»; «символ спасения»; возможно также: «знак избавления».'
    reason: Лексема σύμβολον допускает значения «знак», «знамение» и «символ», а σωτηρία в данном контексте может означать «спасение» или «избавление».
lexical_decisions:
- source_word: εἰς νουθεσίαν
  choice: в наставление
  rationale: Передаёт цель краткого бедствия — вразумить и исправить; сохраняет более широкий смысл, чем только «как предупреждение».
- source_word: πρὸς ὀλίγον
  choice: лишь ненадолго
  rationale: Ясно выражает ограниченную продолжительность и естественно звучит по-русски.
- source_word: ἐταράχθησαν
  choice: были потревожены
  rationale: Сохраняет пассивную форму и широкий смысл беспокойства или бедствия, не усиливая его до «были сокрушены».
- source_word: σύμβολον
  choice: знамение
  rationale: Обозначает видимый знак, указывающий на спасительное действие Бога; «знамение» уместно в библейском регистре и не столь абстрактно, как «символ».
- source_word: σωτηρίας
  choice: спасения
  rationale: Сохраняет как непосредственный смысл избавления от смерти, так и более широкую богословскую значимость слова.
- source_word: εἰς ἀνάμνησιν
  choice: напоминавшее
  rationale: Естественно связывает цель знамения с последующей родительной конструкцией и передаёт функцию напоминания.
- source_word: ἐντολῆς νόμου σου
  choice: о заповеди Твоего закона
  rationale: Сохраняет оба существительных и не решает сверх текста, имеется ли в виду конкретная заповедь или повеление закона как таковое.
theological_decisions:
- issue: Значение σωτηρίας в контексте телесного избавления с более широкими богословскими оттенками
  choice: спасения
  alternative: избавления
  rationale: «Спасение» охватывает избавление от смертельной опасности и сохраняет богословскую ёмкость греческого слова, не вводя позднейших уточнений.
- issue: Функция σύμβολον в рассказе о медном змее
  choice: знамение спасения
  alternative: символ спасения; знак избавления
  rationale: «Знамение» передаёт видимый предмет, указывающий за пределы самого себя, но не определяет точный характер связи между знаком и спасением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимение «Твоего» написано с прописной буквы как обращение к Богу. Синтаксис сделан естественным для русского языка при сохранении последовательности мысли греческого текста.
