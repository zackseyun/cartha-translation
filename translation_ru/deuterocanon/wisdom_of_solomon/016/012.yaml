base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/012.yaml
  text: For neither herb nor poultice healed them[a], but your word, O Lord[b], heals all things.
translation:
  language: ru
  text: Ведь ни целебная трава[a], ни припарка[b] не исцелили их — их исцелило Твоё, Господи, слово, исцеляющее всё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «растение». Здесь, вероятно, имеется в виду растение, применяемое для лечения.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть мягкое лечебное средство, которое накладывали на тело; возможный перевод: «лечебная повязка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βοτάνη
  choice: целебная трава
  rationale: В данном контексте слово обозначает растение, употребляемое как лечебное средство. Уточнение «целебная» естественно передаёт контекст, не превращая растение в отвлечённое «лекарство».
- source_word: μάλαγμα
  choice: припарка
  rationale: Существительное обозначает мягкое лечебное средство, накладываемое на тело. «Припарка» сохраняет предметность и медицинский смысл греческого слова.
- source_word: ἐθεράπευσεν
  choice: не исцелили / исцелило
  rationale: Аорист указывает на совершившееся исцеление, а не просто на лечение или уход. Повтор глагола по-русски ясно выражает противопоставление средств и действующей силы.
- source_word: λόγος
  choice: слово
  rationale: «Слово» сохраняет смысл действенного Божьего изречения и его богословскую насыщенность, не сужая значение до «приказа».
- source_word: ὁ πάντα ἰώμενος
  choice: исцеляющее всё
  rationale: Причастный оборот сохраняет описательную силу настоящего причастия и широкий охват среднего множественного πάντα.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и естественная для современного литературного русского форма прямого обращения к Господу.
theological_decisions:
- issue: Противопоставление лечебных средств и Божьего действия
  choice: Стих говорит, что в данном случае исцеление совершило слово Господа, а не обычные лечебные средства.
  alternative: Понять стих как всеобщее отрицание пользы любых лекарств.
  rationale: Греческий текст описывает конкретное исцеление и не формулирует общего запрета или осуждения медицины.
- issue: Значение λόγος
  choice: Сохранено широкое «слово».
  alternative: Передать как «повеление» или придать слову позднейший строго технический христологический смысл.
  rationale: Контекст допускает смысл действенного Божьего изречения, но сам стих не требует дальнейшего догматического уточнения.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным молитвенным обращением. Повтор «их исцелили / их исцелило» устраняет неестественное согласование разнородных подлежащих и отчётливо передаёт греческое противопоставление.
