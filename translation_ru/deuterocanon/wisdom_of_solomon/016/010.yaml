base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/010.yaml
  text: But the teeth of venomous serpents did not overcome your sons[a], for your mercy came to their aid and healed them.
translation:
  language: ru
  text: Но сынов Твоих[a] не одолели даже зубы ядовитых змей, потому что Твоя милость пришла им на помощь и исцелила их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «детей Твоих». В греческом тексте буквально: «сынов Твоих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱούς
  choice: сынов
  rationale: Греческое слово имеет форму мужского рода во множественном числе и в контексте обозначает израильтян как Божьих сынов; прямое значение сохранено.
- source_word: ἰοβόλων
  choice: ядовитых
  rationale: Сложное прилагательное обозначает несущих или испускающих яд; «ядовитых» естественно передаёт смысл применительно к змеям.
- source_word: δρακόντων
  choice: змей
  rationale: В контексте укусов ядовитых существ в пустыне речь идёт о змеях; «драконов» вызвало бы у современного читателя неверные ассоциации.
- source_word: ἐνίκησαν
  choice: не одолели
  rationale: Глагол означает победить или одержать верх; «не одолели» сохраняет образ противоборства и звучит естественно по-русски.
- source_word: ἀντιπαρῆλθεν
  choice: пришла им на помощь
  rationale: Редкий сложный глагол здесь описывает милость Бога, выступившую навстречу беде и против неё; функциональный перевод ясно передаёт спасительное вмешательство.
- source_word: ἰάσατο
  choice: исцелила
  rationale: Прямое и стилистически уместное соответствие обычному греческому глаголу исцеления.
theological_decisions:
- issue: Кого обозначают «сыны Твои»
  choice: Сохранено обращение к Богу об Израиле как о «сынах Твоих».
  alternative: «детях Твоих»
  rationale: Так сохраняются мужская форма греческого слова и заветный характер обращения без добавления более широких богословских выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет вынесенное вперёд «сынов Твоих», а необычный глагол ἀντιπαρῆλθεν передан ясным выражением «пришла им на помощь».
