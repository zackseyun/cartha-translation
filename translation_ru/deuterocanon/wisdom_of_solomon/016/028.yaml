  text: so that it might be known that one must rise before the sun to give you thanks[b][a], and at the dawning of the light make petition to you.
translation:
  language: ru
  text: 'чтобы стало известно: следует вставать прежде восхода солнца, чтобы благодарить Тебя,[a] и с рассветом обращаться к Тебе с мольбой.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «опережать солнце ради благодарения Тебе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «молиться Тебе»; греческий глагол может означать обращение к кому-либо с просьбой или прошением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γνωστὸν ἦν
  choice: чтобы стало известно
  rationale: Целевая конструкция ὅπως передаёт цель или результат, а сочетание с γνωστὸν ἦν указывает на то, что нечто должно было стать явным.
- source_word: δεῖ
  choice: следует
  rationale: Безличное «следует» естественно передаёт общую необходимость, не вводя в текст конкретного субъекта.
- source_word: φθάνειν τὸν ἥλιον
  choice: вставать раньше солнца
  rationale: Глагол φθάνειν выражает опережение. В контексте утреннего благодарения эта формулировка ясно передаёт временной смысл, тогда как буквальное «опережать солнце» по-русски звучит неестественно.
- source_word: ἐπʼ εὐχαριστίαν σου
  choice: чтобы благодарить Тебя
  rationale: Эллиптический греческий оборот естественно раскрывается по-русски как цель раннего вставания — благодарение, обращённое к Богу.
- source_word: πρὸς ἀνατολὴν φωτός
  choice: с восходом света
  rationale: Формулировка сохраняет образ восходящего света и временную отнесённость к рассвету, не сводя его прямо к восходу солнца.
- source_word: ἐντυγχάνειν σοι
  choice: обращаться к Тебе с мольбой
  rationale: ἐντυγχάνειν с дательным падежом может обозначать обращение к кому-либо с просьбой; «с мольбой» сохраняет просительный оттенок и возвышенный молитвенный регистр.
theological_decisions:
- issue: Передаёт ли стих общее нравственное обязательство или особое предписание утренней литургии
  choice: 'Общая необходимость, выраженная языком поклонения: вставать до солнца для благодарения Богу и обращаться к Нему на рассвете.'
  alternative: Формальное литургическое предписание о строго установленной утренней молитве.
  rationale: Безличное δεῖ выражает необходимость, но сам текст не называет установленного обряда; поэтому перевод сохраняет силу наставления, не вводя отсутствующей конфессиональной конкретики.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Местоимение «Тебя» в обращении к Богу написано с прописной буквы согласно распространённой русской религиозно-литературной норме; синтаксис остаётся доступным и не предполагает специальной литургической терминологии.
