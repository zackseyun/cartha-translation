  text: Nor indeed will I accompany wasting envy[a], because it will have no share in wisdom.
translation:
  language: ru
  text: И с истаявшей завистью я не пойду, ибо она не будет причастна мудрости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с завистью, которая истаяла (или тает, изнурена)». Указательное слово в греческом тексте мужского рода; последние слова можно также понимать: «ибо такой человек не будет причастен мудрости», то есть человек, охваченный завистью.'
    reason: Сохраняет образную неоднозначность τετηκότι и возможную двойственность референта οὗτος, не приписывая зависти активное действие «иссушать».
lexical_decisions:
- source_word: οὔτε μὴν
  choice: Не стану я… и
  rationale: Передаёт продолжительное отрицание с усилением; инверсия сохраняет торжественный риторический тон, не прибегая к архаичному «ниже».
- source_word: φθόνῳ τετηκότι
  choice: иссушающей зависти
  rationale: φθόνος означает зависть или недоброжелательство, а совершенное причастие от τήκω несёт образ таяния, истощения, иссушения. Русское сочетание естественно передаёт губительную, изводящую природу зависти, хотя направление образа допускает и иное понимание.
- source_word: συνοδεύσω
  choice: не стану… спутником
  rationale: Сохраняет метафору совместного пути и одновременно выражает отказ от близости и соучастия.
- source_word: οὗτος
  choice: она
  rationale: В основном тексте местоимение естественно отнесено к персонифицированной зависти; грамматический род согласован с русским словом «зависть». Возможность отнесения к завистливому человеку отмечена в сноске.
- source_word: οὐ κοινωνήσει σοφίᾳ
  choice: не будет причастна мудрости
  rationale: κοινωνέω обозначает участие, общность или обладание долей; «быть причастной» кратко и точно сохраняет этот смысл.
theological_decisions:
- issue: К кому или чему относится οὗτος
  choice: К персонифицированной зависти
  alternative: К человеку, охваченному завистью
  rationale: Ближайший грамматический референт — φθόνος, и персонификация хорошо соответствует утверждению, что зависть не имеет участия в мудрости. Однако мужской указательный элемент может также вызывать представление о завистливом человеке, поэтому неоднозначность указана в сноске.
- issue: Направленность образа τετηκότι
  choice: Зависть изображена как иссушающая, губительная сила
  alternative: Зависть сама чахнет или истаяла
  rationale: Причастие буквально связано с таянием и истощением; контекст допускает как губительное действие зависти, так и её собственное изнеможение. Основной перевод выбран ради естественности, а буквальная возможность сохранена в сноске.
