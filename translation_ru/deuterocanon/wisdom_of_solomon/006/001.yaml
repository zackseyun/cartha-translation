lexical_decisions:
- source_word: Ἀκούσατε
  choice: слушайте
  rationale: Повелительная форма множественного числа призывает не просто услышать, а внимательно внять; «слушайте» естественно передаёт это в современном русском языке.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод или переход, связанный с предшествующим рассуждением, без излишне тяжеловесного «поэтому».
- source_word: βασιλεῖς
  choice: цари
  rationale: Сохраняет конкретное значение существительного и форму прямого обращения.
- source_word: σύνετε
  choice: разумейте
  rationale: Передаёт повеление понять и осмыслить; более возвышенное «разумейте» уместно в поэтическом обращении и сохраняет отличие от последующего «учитесь».
- source_word: μάθετε
  choice: учитесь
  rationale: Прямо передаёт повелительную форму μανθάνω и звучит естественно по-русски.
- source_word: δικασταί
  choice: судьи
  rationale: Сохраняет судебный оттенок слова, не расширяя его до общего обозначения правителей.
- source_word: περάτων γῆς
  choice: краёв земли
  rationale: Сохраняет образ дальних пределов земли и привычную библейскую идиому; речь обращена к судьям по всему миру.
