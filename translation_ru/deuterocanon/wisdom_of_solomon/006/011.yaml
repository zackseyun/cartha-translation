  text: Therefore desire my words[a]; long for them[b], and you will be instructed.
translation:
  language: ru
  text: Итак, желайте моих слов, жаждите их — и будете наставлены[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будете научены», «будете воспитаны»; греческое слово может обозначать как обучение, так и формирующее наставление или исправление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμήσατε
  choice: желайте
  rationale: Положительное повеление выражает осознанное стремление; «желайте» прямо передаёт смысл и не вносит отрицательного оттенка, возможного у некоторых более сильных русских глаголов.
- source_word: οὖν
  choice: итак
  rationale: Союз обозначает вывод из предшествующего рассуждения; «итак» естественно и ясно сохраняет логическую связь.
- source_word: τῶν λόγων μου
  choice: моих слов
  rationale: Буквальная и естественная передача родительного дополнения; «учения» было бы допустимо по контексту, но сужало бы значение λόγοι.
- source_word: ποθήσατε
  choice: жаждите их
  rationale: Глагол выражает более сильное, эмоционально окрашенное стремление, чем ἐπιθυμήσατε. Добавленное «их» естественно восполняет подразумеваемый объект — слова.
- source_word: καὶ
  choice: и (передано посредством тире и «и»)
  rationale: Сохраняется соединительное значение, при этом русская конструкция «— и» ясно передаёт также оттенок последующего результата.
- source_word: παιδευθήσεσθε
  choice: будете наставлены
  rationale: Будущее страдательного залога сохранено. «Наставлены» уместно в контексте премудростной речи и допускает как обучение, так и формирующее воздействие.
theological_decisions:
- issue: Смысловой диапазон παιδεύω в контексте премудрости
  choice: В основном тексте выдвинуто на первый план наставление и обучение.
  alternative: «будете научены»; «будете воспитаны»; «будете вразумлены»
  rationale: Контекст говорит о восприятии слов говорящего, поэтому наставление является ближайшим смыслом. Однако греческий глагол может обозначать также воспитание и исправляющую дисциплину; эта широта отмечена в сноске, а не устранена толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством премудростного увещания. Пара «желайте… жаждите» сохраняет усиление второго повеления; тире перед результатом делает фразу естественной, не превращая связь в явно целевую.
