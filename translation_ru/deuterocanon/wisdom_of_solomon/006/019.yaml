  text: and incorruptibility makes one near to God[a].
translation:
  language: ru
  text: а нетленность приближает человека к Богу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а бессмертие приближает человека к Богу». Греческое слово может означать нетленность, неподверженность тлению или бессмертие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφθαρσία
  choice: нетленность
  rationale: Слово обозначает неподверженность тлению и разрушению; «нетленность» сохраняет широкий онтологический смысл и не сужает его до одного лишь бессмертия.
- source_word: ἐγγὺς εἶναι
  choice: приближает
  rationale: Выражение буквально означает «делает так, чтобы [кто-либо] был близок»; по-русски причинное значение естественно передаётся глаголом «приближает».
- source_word: ποιεῖ
  choice: приближает
  rationale: Глагол употреблён каузативно; его значение объединено с ἐγγὺς εἶναι в естественной русской конструкции.
- source_word: θεοῦ
  choice: к Богу
  rationale: Родительный падеж при ἐγγύς выражает близость к Богу; русское управление требует предлога «к».
theological_decisions:
- issue: Не выраженный явно объект действия
  choice: человека
  alternative: 'не указывать объект: «приближает к Богу»'
  rationale: В контексте речь идёт о человеке, идущем путём мудрости. Добавление «человека» делает русское предложение ясным, не отождествляя подразумеваемый объект с самой мудростью.
- issue: Значение ἀφθαρσία
  choice: нетленность
  alternative: бессмертие
  rationale: «Нетленность» сохраняет более широкий смысл неподверженности тлению; «бессмертие» возможно, но семантически уже.
translation_notes:
  register: Современный литературный русский язык; краткая, плавная и достойная формулировка. Союз «а» передаёт δέ и сохраняет связь со ступенчатым рассуждением контекста.
