base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/004.yaml
  text: because[a], though you were ministers of his kingdom, you did not judge rightly, nor keep the law[c][b], nor walk according to the counsel of God.
translation:
  language: ru
  text: потому что вы, будучи служителями Его Царства[a], не судили по правде[b], не соблюдали закона и не поступали согласно замыслу Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугами» или «подчинёнными Его царской власти». Греческое слово указывает на тех, кто служит под властью вышестоящего; здесь речь, вероятно, о правителях как исполнителях при Божьем правлении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не судили правильно»; «не судили справедливо».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «по решению Бога»; «согласно воле Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπηρέται
  choice: служителями
  rationale: Слово обозначает подчинённых, исполняющих порученное им служение под властью вышестоящего. В обращении к правителям «служители» сохраняет и служебный, и властно-иерархический оттенок, не сводя их роль лишь к чиновничеству.
- source_word: βασιλείας
  choice: Царства
  rationale: βασιλεία может означать царство, царствование или царскую власть. «Царство» естественно по-русски и сохраняет образ установленного Богом порядка правления.
- source_word: ἐκρίνατε ὀρθῶς
  choice: не судили по правде
  rationale: Сочетание означает выносить суд правильно и справедливо. «Судить по правде» звучит естественно и достойно, передавая нравственно-судебный смысл наречия ὀρθῶς.
- source_word: ἐφυλάξατε νόμον
  choice: не соблюдали закона
  rationale: С глаголом φυλάσσω слово νόμος здесь обозначает закон как обязательную норму. Русское управление с родительным падежом после отрицания естественно и не требует определённого артикля.
- source_word: κατὰ τὴν βουλὴν τοῦ θεοῦ
  choice: по замыслу Бога
  rationale: βουλή может обозначать совет, замысел, решение или намерение. «Замысел» сохраняет оттенок обдуманного божественного намерения и не отождествляет слово без пояснения с более широким понятием воли.
- source_word: ἐπορεύθητε
  choice: не поступали
  rationale: В данном этическом контексте πορεύομαι описывает образ поведения. «Поступали» передаёт смысл современным литературным русским языком; буквальное «ходили» здесь было бы менее естественным.
theological_decisions:
- issue: Положение земных правителей под верховной властью Бога
  choice: Правители представлены как служители, чья власть подчинена Божьему Царству.
  alternative: Выражение можно шире отнести ко всем, кто наделён властью перед Богом.
  rationale: Ближайший контекст обращён к царям и судьям, а выражение ὑπηρέται τῆς αὐτοῦ βασιλείας показывает производный, подчинённый характер их власти, не развивая из этого отдельного учения о государстве.
- issue: Значение βουλή применительно к Богу
  choice: Переведено как «замысел Бога».
  alternative: Возможны «решение Бога», «совет Бога» или «воля Бога».
  rationale: «Замысел» удерживает значение обдуманного намерения, не устраняя присущую слову широту и не подменяя βουλή термином θέλημα.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранена трёхчастная последовательность обвинений. Метафорическое английское «walk» не перенесено механически: греческий этический смысл передан естественным русским «поступали». Прописная буква в «Его Царства» использована как издательское обозначение Божьего царского правления.'
