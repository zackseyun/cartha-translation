  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/015.yaml
  text: For thinking about her is the perfection of understanding, and the one who stays awake because of her will quickly be free from care.
translation:
  language: ru
  text: Ведь размышлять о ней — совершенство разумения, и тот, кто бодрствовал из-за неё, вскоре будет свободен от забот.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνθυμηθῆναι περὶ αὐτῆς
  choice: размышлять о ней
  rationale: Передаёт направленное внутреннее обдумывание; местоимение женского рода сохраняет отсылку к Премудрости из контекста.
- source_word: φρονήσεως τελειότης
  choice: совершенство разумения
  rationale: Сохраняет именную конструкцию и смысл полноты практического понимания, не сужая φρόνησις до простой осведомлённости.
- source_word: ὁ ἀγρυπνήσας δι' αὐτήν
  choice: кто бодрствует ради неё
  rationale: ἀγρυπνέω буквально обозначает бодрствование; διά с винительным здесь естественно выражает мотив или устремлённость, поэтому выбрано «ради неё» без более узкого толкования.
- source_word: ταχέως ἀμέριμνος ἔσται
  choice: тот вскоре освободится от забот
  rationale: Естественно по-русски передаёт будущее состояние ἀμέριμνος — отсутствие тревожащих забот; «вскоре» соответствует ταχέως.
theological_decisions:
- issue: Характер связи между бодрствованием и Премудростью
  choice: ради неё
  alternative: из-за неё / благодаря ей
  rationale: Греческое δι’ αὐτήν допускает причинно-мотивационный оттенок. «Ради неё» сохраняет направленность усердия к Премудрости и не приписывает ей явно ни причинение бессонницы, ни инструментальную роль.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура и достоинство оригинала сохранены. «Разумение» выбрано как доступное, но возвышенное соответствие φρόνησις.
