base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/021.yaml
  text: Therefore[a], if you delight in thrones and scepters, O rulers of peoples, honor wisdom, so that you may reign forever.
translation:
  language: ru
  text: Итак, если вам милы престолы и скипетры, властители народов[a], чтите мудрость, чтобы вам царствовать вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тираны народов». Греческое слово может обозначать правителей вообще, но в некоторых контекстах имеет отрицательный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδεσθε
  choice: вам милы
  rationale: Передаёт удовольствие и расположение к чему-либо, сохраняя возвышенный тон и естественное русское звучание.
- source_word: θρόνοις
  choice: престолы
  rationale: Сохраняет центральный образ царской власти; это прямое и традиционно понятное соответствие.
- source_word: σκήπτροις
  choice: скипетры
  rationale: Точно передаёт символ царской власти и естественно сочетается с «престолами».
- source_word: τύραννοι λαῶν
  choice: властители народов
  rationale: «Властители» допускает нейтральное обозначение правителей и не навязывает современного резко отрицательного смысла слова «тираны»; множественное «народов» отражает λαῶν.
- source_word: τιμήσατε
  choice: чтите
  rationale: Передаёт повеление оказывать мудрости честь и сохраняет достойный, возвышенный регистр.
- source_word: σοφίαν
  choice: мудрость
  rationale: Стандартное соответствие, сохраняющее как практический, так и возможный персонифицированный оттенок понятия в книге.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Идиоматически выражает неограниченную длительность и соответствует возвышенному, но понятному регистру.
- source_word: βασιλεύσητε
  choice: вам царствовать
  rationale: Сохраняет собственно царский смысл глагола и связь с образами престолов и скипетров.
theological_decisions:
- issue: Смысл τύραννοι в обращении к политическим правителям
  choice: властители народов
  alternative: тираны народов
  rationale: В эллинистическом греческом слово могло обозначать правителя без обязательной резко отрицательной оценки. Нейтральное основное чтение сохраняет неоднозначность, а возможный отрицательный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулы «чтите мудрость» и «царствовать вовеки» сохраняют торжественность без архаической перегруженности.
