  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/003.yaml
  text: For authority was given to you by the Lord[a], and sovereignty by the Most High, who will examine your works and investigate your plans[b];
translation:
  language: ru
  text: Потому что власть дана вам Господом, и владычество — Всевышним; Он рассмотрит ваши дела и исследует ваши замыслы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κράτησις
  choice: власть
  rationale: В обращении к правителям слово обозначает принадлежащую им и осуществляемую ими правящую власть; «власть» естественно и точно передаёт политический смысл.
- source_word: δυναστεία
  choice: могущество
  rationale: Слово обозначает правящую силу или владычество, а не династию; «могущество» сохраняет отличие от κράτησις и подчёркивает реальную силу правителей.
- source_word: παρὰ τοῦ κυρίου
  choice: Господом
  rationale: παρά с родительным указывает на источник; русский творительный при страдательной конструкции естественно передаёт как источник, так и Дающего.
- source_word: παρὰ Ὑψίστου
  choice: Всевышним
  rationale: Параллельный творительный сохраняет синтаксис первой части; «Всевышний» — устоявшаяся передача божественного титула Ὕψιστος.
- source_word: ἐξετάσει
  choice: испытáет
  rationale: Глагол выражает тщательную проверку и оценку; «испытáет» уместно в контексте Божьего суда и не дублирует следующий глагол.
- source_word: διεραυνήσει
  choice: исследует
  rationale: Сложный глагол обозначает глубокое, тщательное разыскание; «исследует» ясно передаёт проникновение в скрытые побуждения.
- source_word: βουλάς
  choice: намерения
  rationale: Здесь βουλαί охватывает внутренние замыслы, решения и совещательные намерения правителей; «намерения» естественно противопоставляются их внешним делам.
theological_decisions:
- issue: Параллельные божественные титулы κύριος и Ὕψιστος
  choice: «Господь» и «Всевышний»
  alternative: «Владыка» и «Всевышний»
  rationale: Два титула относятся к Богу как источнику власти земных правителей и Судье их дел и намерений. Устоявшиеся русские формы сохраняют параллелизм без внесения конфессионально специфической трактовки.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим обращению к правителям. Сохранены причинная связь с предыдущим контекстом, параллелизм двух источниковых оборотов и различие между внешними делами и внутренними намерениями.
