  source_fidelity: 'Основной смысл передан верно: грозное и быстрое явление адресату и суровый суд над лицами высокого положения. Однако «скоро» в современном русском преимущественно означает «в ближайшее время», тогда как ταχέως обозначает быстроту действия; «быстро» точнее. «Грозно» допустимо, но несколько слабее φρικτῶς, выражающего ужасающее, внушающее трепет воздействие.'
