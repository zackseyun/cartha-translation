  text: He will come upon you terribly and swiftly[a], because severe judgment comes upon those in high places.
translation:
  language: ru
  text: Он грозно и быстро предстанет перед вами[a], потому что над высокопоставленными совершается суровый суд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он страшно и быстро явится перед вами»; возможно также: «ибо внезапный (или резкий) суд совершается над высокопоставленными».'
    reason: Греческое ἐπιστήσεται допускает значения «явится», «предстанет», «настигнет»; φρικτῶς может подчёркивать ужасающее воздействие. Ἀπότομος может означать «суровый», «внезапный» или «резкий».
lexical_decisions:
- source_word: φρικτῶς
  choice: грозно
  rationale: Наречие передаёт внушающий ужас характер явления; «грозно» естественно и достойно звучит по-русски, не ослабляя угрозы.
- source_word: ταχέως
  choice: скоро
  rationale: Передаёт быстроту и близость предстоящего вмешательства, сохраняя торжественный регистр.
- source_word: ἐπιστήσεται ὑμῖν
  choice: предстанет перед вами
  rationale: Глагол может означать приблизиться, явиться, встать рядом или над кем-либо. Этот вариант сохраняет образ непосредственного появления и не уточняет сверх текста, идёт ли речь о нападении.
- source_word: κρίσις
  choice: суд
  rationale: В обращённом к правителям предупреждении речь идёт о судебном действии, а не об отвлечённой справедливости.
- source_word: ἀπότομος
  choice: суровый
  rationale: Слово допускает значения «резкий», «внезапный», «жестокий». «Суровый» передаёт строгость суда и избегает смыслового повторения с ταχέως.
- source_word: ἐν τοῖς ὑπερέχουσιν
  choice: над высокопоставленными
  rationale: Причастие обозначает превосходящих других по положению и власти; «высокопоставленные» ясно указывает на правителей в данном контексте, сохраняя образ высокого положения.
- source_word: γίνεται
  choice: совершается
  rationale: Глагол описывает наступление или осуществление суда; «совершается» естественно сочетается со словом «суд» в русском литературном языке.
theological_decisions:
- issue: Характер угрожающего действия
  choice: Божественный Судья грозно и скоро предстанет перед властителями, чтобы совершить над ними суровый суд.
  alternative: Высказывание можно понимать шире — как общий принцип, согласно которому высокопоставленные подвергаются строгому суду.
  rationale: Непосредственное обращение «перед вами» связывает общее утверждение о высокопоставленных с адресатами-правителями, однако формулировка не добавляет отсутствующих в греческом тексте подробностей о способе суда.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной судебной лексикой. Порядок слов сохраняет нарастание угрозы; подлинная многозначность ἐπιστήσεται и ἀπότομος вынесена в примечание.
