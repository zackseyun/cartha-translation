  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/006.yaml
  text: For the least is deserving of mercy[b][a], but the mighty will be examined mightily.
translation:
  language: ru
  text: Ведь малому будет оказано снисхождение[a], а могущественные подвергнутся строгой проверке[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «малый может быть прощён по милости». Греческое выражение говорит о снисходительном или прощающем отношении; оно не утверждает, что милость заслужена.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально в греческом тексте: «могущественные будут проверены могущественно»; здесь использована игра однокоренных слов. По смыслу: особенно строго или тщательно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάχιστος
  choice: самый малый
  rationale: Субстантивированная превосходная степень обозначает человека, занимающего самое низкое положение или обладающего наименьшей властью; этот перевод сохраняет противопоставление могущественным.
- source_word: συγγνωστός ἐστιν ἐλέους
  choice: достоин милости
  rationale: Кратко и естественно передаёт мысль о снисходительном, милосердном отношении, не уточняя сверх греческого текста, идёт ли речь преимущественно о прощении или об оправданном снисхождении.
- source_word: δυνατοὶ
  choice: могущественные
  rationale: В контексте обращения к правителям слово указывает на людей, наделённых властью и влиянием.
- source_word: δυνατῶς
  choice: строгому
  rationale: По смыслу наречие усиливает меру предстоящей проверки. Буквальное сохранение однокоренного повтора по-русски звучало бы неестественно, поэтому игра слов отмечена в сноске.
- source_word: ἐτασθήσονται
  choice: подвергнутся испытанию
  rationale: Будущее страдательного залога обозначает тщательную проверку или исследование; «испытание» сохраняет оценочно-судебный оттенок, не подменяя проверку уже вынесенным приговором.
theological_decisions:
- issue: Насколько явно выражать различие между милостью к малому и строгой ответственностью власть имущих
  choice: Сохранить контраст милости и строгого испытания без доктринального расширения.
  alternative: «Незначительному простят по милости, а могущественных сурово осудят».
  rationale: Греческий текст говорит о снисхождении к малому и особо тщательной проверке могущественных, но не утверждает прямо ни безусловного прощения первого, ни окончательного осуждения вторых.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, судебно-наставительным звучанием. Синтаксис краток и сохраняет резкое противопоставление двух частей стиха.
