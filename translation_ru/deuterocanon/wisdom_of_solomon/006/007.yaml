base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/007.yaml
  text: For the Master of all will not show partiality[a], nor will he be overawed by greatness; for he himself made both small and great[c][b], and he cares for all alike.
translation:
  language: ru
  text: 'Ведь Владыка всего[b] не проявит лицеприятия[a] и не оробеет перед величием: Он Сам сотворил и малого, и великого и одинаково заботится обо всех[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «не отступит перед лицом»; это идиоматическое выражение означает, что Он не проявит пристрастия или предпочтения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Повелитель всего». Здесь употреблено греческое δεσπότης, а не κύριος («Господь»).'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «равным образом промышляет обо всех», «одинаково печётся обо всех».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστελεῖται πρόσωπον
  choice: не будет лицеприятен
  rationale: Греческое выражение буквально связано с «лицом», но в данном контексте обозначает пристрастие к человеку из-за его положения. «Не будет лицеприятен» кратко и точно передаёт судебно-нравственный смысл, оставаясь понятным в современном литературном русском.
- source_word: ὁ πάντων δεσπότης
  choice: Владыка всего
  rationale: δεσπότης указывает на верховную власть и господство. «Владыка» сохраняет эту силу и не смешивает данный титул с обычной передачей κύριος словом «Господь».
- source_word: ἐντραπήσεται μέγεθος
  choice: не оробеет перед величием
  rationale: В контексте речь о том, что высокое положение или величие никого не заставит Бога уступить или проявить робость. Формулировка сохраняет образ «величия», не сужая его исключительно до общественного ранга.
- source_word: μικρὸν καὶ μέγαν
  choice: и малого, и великого
  rationale: Парное выражение обозначает людей низкого и высокого положения, но сохраняет более широкую меризматическую форму оригинала.
- source_word: ὁμοίως τε προνοεῖ περὶ πάντων
  choice: одинаково заботится обо всех
  rationale: προνοέω может обозначать заботу, предусмотрительность или промыслительное попечение. Основной текст передаёт ясный контекстуальный смысл, а примечание сохраняет более специальный оттенок.
theological_decisions:
- issue: Различение δεσπότης и κύριος
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: «Владыка» передаёт абсолютную власть δεσπότης и сохраняет отличие от титула κύριος, не вводя конфессионально обусловленного толкования.
- issue: Божественное нелицеприятие
  choice: не будет лицеприятен
  alternative: не посмотрит на лицо; не проявит пристрастия
  rationale: Выбранная формулировка прямо выражает отсутствие предпочтения по общественному положению, не превращая стих в более позднюю богословскую формулу.
- issue: Значение προνοεῖ
  choice: заботится обо всех
  alternative: промышляет обо всех; печётся обо всех
  rationale: «Заботится» естественно для современного читателя и сохраняет мысль о равном попечении; возможный оттенок промысла отмечен, а не навязан основному тексту.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис остаётся близким к греческой причинно-следственной структуре; «малого и великого» сохраняет традиционную меризматическую пару, а более редкие смысловые оттенки вынесены в примечания.
