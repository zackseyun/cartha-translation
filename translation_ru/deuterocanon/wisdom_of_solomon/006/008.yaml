lexical_decisions:
- source_word: τοῖς δὲ κραταιοῖς
  choice: А сильных
  rationale: κραταιοί обозначает сильных, могущественных людей; краткая формулировка сохраняет обобщённость греческого текста. δέ передано естественным русским противопоставительным «а».
- source_word: ἰσχυρὰ
  choice: суровое
  rationale: Прилагательное передаёт силу и строгость предстоящего разбирательства; «суровое» естественно сочетается со словом «испытание».
- source_word: ἐφίσταται
  choice: ожидает
  rationale: Глагол описывает то, что наступает или надвигается на адресатов; русская конструкция «их ожидает» ясно и естественно передаёт этот смысл.
- source_word: ἔραυνα
  choice: испытание
  rationale: ἔρευνα может означать исследование, проверку или испытание. В контексте проверки власть имущих «испытание» сохраняет судебно-проверочный оттенок, не сужая его до обычного расследования.
theological_decisions:
- issue: Характер предстоящей проверки сильных
  choice: суровое испытание
  alternative: строгое расследование
  rationale: Греческое ἔραυνα допускает оттенки исследования, проверки и испытания. Выбранный вариант сохраняет смысл Божьей взыскательной проверки, не уточняя сверх текста её процессуальную форму.
translation_notes:
  register: Современный литературный русский; краткая, весомая формулировка с сохранением противопоставления и предупреждающего тона оригинала.
