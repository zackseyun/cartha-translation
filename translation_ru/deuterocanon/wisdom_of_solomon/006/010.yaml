  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/010.yaml
  text: For those who have kept holy things holily will be made holy[b][a], and those who have been taught them will find a defense.
translation:
  language: ru
  text: Ибо те, кто свято соблюдали святое, будут освящены[a], а те, кто был научен этому, найдут защиту[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто благочестиво соблюдали святыни, будут освящены». В греческом тексте намеренно повторяются однокоренные слова со значением святости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «найдут ответ»; возможно также: «найдут оправдание». Греческое слово может означать защиту или ответ при разбирательстве либо обвинении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξαντες
  choice: соблюдал
  rationale: Глагол передаёт тщательное хранение и исполнение; «соблюдал» естественно выражает нравственно-религиозный смысл, не сводя его к физической охране.
- source_word: ὁσίως / τὰ ὅσια / ὁσιωθήσονται
  choice: свято / святое / будут освящены
  rationale: 'Однокоренная цепочка по возможности сохраняет намеренный греческий повтор понятий святости. «Святое» оставляет объём выражения широким: это могут быть святыни, священные установления или святые обязанности.'
- source_word: διδαχθέντες αὐτά
  choice: те, кто был этому научен
  rationale: Сохранена пассивная форма причастия, а местоимение отнесено к ранее названному «святому» как совокупности священных предметов или установлений.
- source_word: εὑρήσουσιν ἀπολογίαν
  choice: найдут защиту
  rationale: ἀπολογία обозначает ответ или защиту при рассмотрении обвинения. «Защита» сохраняет судебный оттенок, не превращая выражение в специальный богословский термин «оправдание».
theological_decisions:
- issue: Игра однокоренных слов ὁσίως / τὰ ὅσια / ὁσιωθήσονται
  choice: «свято соблюдал святое — будут освящены»
  alternative: «благочестиво соблюдал святыни — будут признаны святыми»
  rationale: Повтор является важной частью нравственно-богословской логики стиха. При этом пассив ὁσιωθήσονται передан без уточнения действующего лица.
- issue: Значение ἀπολογία
  choice: «защиту»
  alternative: «ответ» или «оправдание»
  rationale: Перевод сохраняет возможность судебной защиты или ответа перед судом, не навязывая более узкого догматического понимания оправдания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Несколько необычный повтор «свято — святое — освящены» сохранён ради риторики оригинала; смысловые альтернативы раскрыты в сносках.
