base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/016.yaml
  text: For she goes about seeking those worthy of her[a], and graciously appears to them on the paths, and meets them in every purpose.
translation:
  language: ru
  text: Потому что она обходит, ища достойных её, благосклонно является им на путях и встречает их во всяком замысле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во всякой мысли»; или: «во всяком намерении». Греческое слово может обозначать как мысль вообще, так и сформировавшийся замысел или намерение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς ἀξίους αὐτῆς
  choice: достойных её
  rationale: Сохраняет оценочное значение ἄξιος и зависимость родительного падежа, не уточняя, идёт ли речь о заслуге или пригодности.
- source_word: περιέρχεται ζητοῦσα
  choice: обходит всё вокруг, ища
  rationale: Передаёт как движение, выраженное περιέρχεται, так и продолжающийся целенаправленный поиск в причастии ζητοῦσα.
- source_word: ἐν ταῖς τρίβοις
  choice: на путях
  rationale: Сохраняет конкретный образ троп и дорог; по-русски сочетание «на путях» звучит естественно и возвышенно.
- source_word: φαντάζεται αὐτοῖς εὐμενῶς
  choice: благосклонно является им
  rationale: φαντάζεται здесь означает становиться видимой, являться, а εὐμενῶς выражает благосклонность; перевод сохраняет инициативу Премудрости.
- source_word: ἐν πάσῃ ἐπινοίᾳ
  choice: во всяком замысле
  rationale: ἐπίνοια может обозначать мысль, намерение или замысел. «Замысел» естественно передаёт сформированную внутреннюю направленность, а сноска сохраняет более широкую неоднозначность.
- source_word: ὑπαντᾷ αὐτοῖς
  choice: встречает их
  rationale: Кратко и непосредственно передаёт ὑπαντάω, сохраняя образ Премудрости, выходящей навстречу.
theological_decisions:
- issue: Олицетворение Премудрости как действующего женского лица
  choice: 'Сохранить женские местоимения и личные действия: «она», «её», «является», «встречает».'
  alternative: Передать Премудрость отвлечённо и избегать личного местоимения.
  rationale: Греческий текст последовательно изображает Премудрость в женском роде и приписывает ей активные личные действия; отвлечённый перевод ослабил бы этот литературно-богословский образ.
translation_notes:
