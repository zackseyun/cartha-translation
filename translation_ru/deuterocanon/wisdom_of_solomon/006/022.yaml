base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/022.yaml
  text: But what wisdom is and how it came to be[a], I will declare, and I will not hide mysteries from you; rather, from the beginning of its origin I will trace it out, and I will set the knowledge of it in the open[b], and I will by no means pass by the truth.
translation:
  language: ru
  text: А что такое мудрость и как она возникла[a], я возвещу и не скрою от вас тайн; но, начиная с самого её возникновения, прослежу её и сделаю знание о ней явным и ни в коем случае не пройду мимо истины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как она пришла в бытие». Греческое выражение допускает буквальный акцент на возникновении, не уточняя его природы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни в коем случае не обойду истину».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δέ ἐστιν σοφία
  choice: а что такое мудрость
  rationale: Прямая вопросительная конструкция сохраняет смысл греческого текста; союз δέ передан как «а», обозначая переход к новой теме.
- source_word: πῶς ἐγένετο
  choice: как она возникла
  rationale: «Возникла» естественно передаёт значение прихода к бытию или появления, не вводя специального утверждения о сотворённости мудрости.
- source_word: ἀπαγγελῶ
  choice: я возвещу
  rationale: Глагол означает объявить или сообщить; «возвещу» сохраняет возвышенный, но понятный регистр.
- source_word: οὐκ ἀποκρύψω ὑμῖν μυστήρια
  choice: не скрою от вас тайн
  rationale: «Тайны» естественно передаёт μυστήρια в данном контексте, сохраняя его содержательную весомость.
- source_word: ἀλλὰ ἀπ' ἀρχῆς γενέσεως ἐξιχνιάσω
  choice: но прослежу её от самого начала возникновения
  rationale: «Прослежу» сохраняет образ тщательного движения по следу, а выражение о начале возникновения передаёт плотную формулировку оригинала без метафизического уточнения.
- source_word: θήσω εἰς τὸ ἐμφανὲς τὴν γνῶσιν αὐτῆς
  choice: сделаю знание о ней явным
  rationale: Формулировка естественно выражает буквальную идею вынесения знания в явность, на всеобщее обозрение.
- source_word: οὐ μὴ παροδεύσω τὴν ἀλήθειαν
  choice: ни в коем случае не обойду истину
  rationale: «Ни в коем случае» передаёт усиленное отрицание οὐ μή, а «не обойду» сохраняет пространственную метафору παροδεύω.
theological_decisions:
- issue: Возможный метафизический смысл происхождения мудрости в πῶς ἐγένετο и γενέσεως
  choice: Передать языком возникновения, не уточняя, была ли мудрость сотворена.
  alternative: «как она была сотворена» или «как она появилась»
  rationale: Стих говорит о возникновении или происхождении мудрости, но сам по себе не разрешает богословский вопрос о сотворённой либо вечной Премудрости. Перевод сохраняет напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность обещаний оригинала; местоимение «она» ясно относится к мудрости.
