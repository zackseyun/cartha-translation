  - severity: low
    issue: «Не обойду истину» менее естественно, чем «не пройду мимо истины».
    rationale: παροδεύω образно означает пройти мимо, миновать, обойти стороной. В русском «не пройду мимо истины» непосредственно сохраняет этот образ и звучит яснее.
