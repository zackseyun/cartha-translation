lexical_decisions:
- source_word: φροντίς
  choice: забота
  rationale: Передаёт деятельное попечение и сохраняет отвлечённое существительное в последовательной цепи определений.
- source_word: παιδείας
  choice: о наставлении
  rationale: В данном контексте παιδεία означает нравственно формирующее обучение; «наставление» естественно звучит по-русски и сохраняет эту широту.
- source_word: ἀγάπη
  choice: любовь
  rationale: Прямое соответствие; повтор слова сохранён как значимый элемент построения стиха.
- source_word: τήρησις
  choice: соблюдение
  rationale: Точно передаёт исполнение и хранение законов в нормативно-нравственном смысле.
- source_word: νόμων
  choice: законов
  rationale: Прямой эквивалент множественного числа νόμων, уместный в этико-правовом контексте.
- source_word: αὐτῆς
  choice: её
  rationale: Сохраняет отсылку к олицетворённой Премудрости женского рода; в русском эта отсылка также грамматически естественна.
- source_word: προσοχή
  choice: внимание
  rationale: Передаёт направленную внимательность к законам, не усиливая значение до преданности или повиновения.
- source_word: βεβαίωσις
  choice: утверждение
  rationale: Передаёт делание твёрдым, упрочение; конструкция «утверждение в нетлении» сохраняет процессуальный оттенок лучше, чем «гарантия».
- source_word: ἀφθαρσίας
  choice: нетлении
  rationale: «Нетление» прямо выражает свободу от тления и распада и сохраняет отличие от более узкого истолкования как бессмертия.
theological_decisions:
- issue: Олицетворение Премудрости в αὐτῆς
  choice: Передать местоимением «её», относя его к олицетворённой Премудрости.
  alternative: Понять местоимение как отсылку к наставлению и перевести без явного личностного оттенка.
  rationale: Ближайший и более широкий контекст олицетворяет Премудрость; женская форма греческого местоимения и русский грамматический род позволяют сохранить этот образ.
- issue: Значение ἀφθαρσία
  choice: Перевести как «нетление».
  alternative: «Бессмертие» или «неуничтожимость».
  rationale: Греческое слово непосредственно обозначает неподверженность порче и тлению. «Нетление» сохраняет исходный образ и не сужает его заранее до одного догматического понимания.
translation_notes:
  register: Современный литературный русский с достоинством афористической речи. Сохранены повтор «любовь» и последовательная цепь отвлечённых существительных. Союзы передают связность греческого рассуждения; конечная запятая сохранена ввиду продолжения синтаксической цепи в следующем стихе.
