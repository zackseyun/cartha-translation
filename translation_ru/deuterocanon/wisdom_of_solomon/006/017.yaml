  text: For the truest beginning of her is the desire for instruction,[a]
translation:
  language: ru
  text: Ведь самое верное начало её — стремление к наставлению.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самое истинное начало её — желание учиться». Греческое παιδεία может означать наставление, обучение, воспитание или дисциплину.'
    reason: Лексическая многозначность παιδεία и возможная более буквальная передача ἀληθεστάτη и ἐπιθυμία.
lexical_decisions:
- source_word: ἀρχὴ
  choice: начало
  rationale: Сохраняет образ исходной точки или первого шага на пути к мудрости.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно вводит пояснение к предыдущей мысли.
- source_word: αὐτῆς
  choice: её
  rationale: Относится к олицетворённой Мудрости и сохраняет женский род греческого текста.
- source_word: ἡ ἀληθεστάτη
  choice: самое верное
  rationale: Передаёт превосходную степень и оттенок подлинности или несомненности; по-русски здесь звучит естественнее буквального «самое истинное».
- source_word: παιδείας
  choice: наставлению
  rationale: В контексте литературы мудрости охватывает обучение и формирующее воспитание, не сводясь к школьному образованию.
- source_word: ἐπιθυμία
  choice: стремление
  rationale: Передаёт направленное желание и естественно сочетается с дательным падежом «к наставлению».
theological_decisions:
- issue: Олицетворение Мудрости посредством местоимения женского рода
  choice: Сохранить форму «её»
  alternative: 'Передать безлично: «его» или повторить «мудрости»'
  rationale: Греческое αὐτῆς относится к олицетворённой Мудрости; женский род сохраняет литературно-богословский образ, не добавляя доктринального толкования.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим строем. «Самое верное» сохраняет усиление превосходной степени без неестественного оборота «самое истинное»; «наставление» уместно для литературы мудрости.
