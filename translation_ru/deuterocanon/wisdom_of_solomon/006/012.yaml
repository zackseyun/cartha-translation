  text: Wisdom is radiant and unfading[a], and is readily seen by those who love her;
translation:
  language: ru
  text: Мудрость лучезарна и не увядает; те, кто любит её, без труда видят её[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «легко постигают её» либо «легко созерцают её». Греческий глагол может означать как зрительное наблюдение, так и восприятие разумом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαμπρὰ
  choice: лучезарна
  rationale: Передаёт образ видимого сияния и сохраняет возвышенный, но понятный современному читателю тон.
- source_word: ἀμάραντός
  choice: не увядает
  rationale: Сохраняет конкретный образ неувядающей свежести, не заменяя его более отвлечённым понятием бессмертия или нетления.
- source_word: ἡ σοφία
  choice: Мудрость
  rationale: Русское существительное женского рода естественно поддерживает олицетворение, которое далее выражено местоимением «её».
- source_word: εὐχερῶς
  choice: без труда
  rationale: Естественно передаёт значение лёгкости и доступности, не добавляя идеи мгновенности.
- source_word: θεωρεῖται
  choice: видят
  rationale: Сохраняет зрительный образ, связанный с лучезарностью Мудрости, при этом допускает более широкое значение узнавания и постижения, отмеченное в сноске.
- source_word: ὑπὸ τῶν ἀγαπώντων αὐτήν
  choice: те, кто любит её
  rationale: Прямо и естественно передаёт причастную конструкцию и сохраняет личностное изображение Мудрости.
theological_decisions:
- issue: Олицетворение σοφία
  choice: Сохранить женское личное местоимение «её» и представить Мудрость как олицетворённую фигуру.
  alternative: Передать мудрость лишь как отвлечённое качество, избегая личного местоимения.
  rationale: Контекст изображает Мудрость как женскую фигуру; русский грамматический род позволяет сохранить это без искусственного усиления или догматического уточнения.
translation_notes:
