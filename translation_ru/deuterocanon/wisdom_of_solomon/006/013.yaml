  text: Она сама спешит открыться тем, кто стремится к ней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Она опережает тех, кто желает, чтобы её узнали заранее». Греческое выражение сжато; основной текст передаёт вероятный смысл: Премудрость сама идёт навстречу тем, кто стремится к ней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φθάνει
  choice: спешит
  rationale: Глагол может означать «опережать», «приходить прежде» или «достигать первым»; здесь он передаёт инициативу Премудрости и естественно сочетается с «открыться».
- source_word: τοὺς ἐπιθυμοῦντας
  choice: тем, кто её желает
  rationale: Причастие от ἐπιθυμέω обозначает сильное желание. Местоимение «её» восполняется из ближайшего контекста, где речь идёт о Премудрости.
- source_word: προγνωσθῆναι
  choice: открыться
  rationale: 'Формально пассивный инфинитив означает «быть узнанной заранее». В данном сжатом обороте «открыться» естественно выражает вероятный смысл: Премудрость сама даёт узнать себя прежде, чем ищущие её найдут.'
theological_decisions:
- issue: Женская персонификация Премудрости
  choice: 'Сохранить женский род: «она», «её»'
  alternative: Передать премудрость как безличное отвлечённое качество
  rationale: Греческий контекст представляет Премудрость как женский образ; перевод сохраняет эту литературную и богословскую персонификацию.
- issue: Инициатива Премудрости и неоднозначность προγνωσθῆναι
  choice: В основном тексте передать вероятный контекстуальный смысл её предваряющей инициативы
  alternative: 'Буквально: «Она опережает желающих быть узнанной заранее»'
  rationale: Греческая конструкция сжата и допускает формальное прочтение пассива. Основной текст должен быть понятен, но буквальная неоднозначность сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Женская персонификация Премудрости сохранена. Маркер примечания поставлен непосредственно в основном тексте.
