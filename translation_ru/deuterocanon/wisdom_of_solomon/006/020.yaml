lexical_decisions:
- source_word: ἐπιθυμία
  choice: стремление
  rationale: Слово обозначает сильное желание. «Стремление» естественно передаёт здесь направленное и устойчивое желание, не привнося отрицательного оттенка.
- source_word: ἄρα
  choice: итак
  rationale: Частица вводит вывод из предшествующего рассуждения; «итак» ясно и естественно выражает эту логическую связь.
- source_word: σοφίας
  choice: к мудрости
  rationale: Родительный падеж указывает здесь на предмет стремления. Конструкция «стремление к мудрости» естественна для современного русского языка и сохраняет смысл греческого выражения.
- source_word: ἀνάγει
  choice: ведёт
  rationale: Глагол буквально может означать «ведёт вверх», но здесь обозначает движение к цели или состоянию. «Ведёт» сохраняет образ и звучит естественно.
- source_word: ἐπὶ βασιλείαν
  choice: к царской власти
  rationale: Предлог с винительным падежом после ἀνάγει указывает на достигаемую цель. В данном контексте βασιλεία означает прежде всего царское достоинство или осуществление царской власти, а не территорию.
theological_decisions:
- issue: Значение βασιλεία в итоговом изречении о мудрости
  choice: царская власть
  alternative: царствование; царство
  rationale: Контекст обращён к правителям и говорит о достижении власти благодаря стремлению к мудрости. «Царская власть» передаёт статус и правление, не сводя слово к территориальному царству; подлинная лексическая многозначность отмечена в сноске.
translation_notes:
  register: Краткое афористичное предложение в современном литературном русском языке. Сохранена явная связь-вывод с предыдущими стихами и отмечена многозначность βασιλεία.
