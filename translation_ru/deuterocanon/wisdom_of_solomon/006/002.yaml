lexical_decisions:
- source_word: ἐνωτίσασθε
  choice: Вслушайтесь
  rationale: Аористный императив выражает настойчивый призыв внимательно слушать; «вслушайтесь» естественно передаёт не просто физическое слышание, а сознательное внимание.
- source_word: οἱ κρατοῦντες πλήθους
  choice: вы, кто властвует над множеством
  rationale: κρατέω здесь обозначает обладание властью, а не обязательно угнетение; единственное πλήθους сохранено собирательным «множеством».
- source_word: γεγαυρωμένοι
  choice: кичится
  rationale: Перфектное причастие указывает на горделивое самопревозношение; «кичится» сохраняет укоризненный тон сильнее нейтрального «гордится».
- source_word: ἐπὶ ὄχλοις ἐθνῶν
  choice: многочисленностью народов
  rationale: При γεγαυρωμένοι предлог ἐπί может указывать на основание гордости; выражение естественно передаёт гордость правителей из-за множества подвластных им народов, не превращая ὄχλοις в буквальные уличные «толпы».
