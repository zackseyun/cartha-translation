  text: Слушайте[a], вы, властвующие над множеством и кичащиеся толпами народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Внимайте, вы, держащие власть над множеством и превозносящиеся из-за сонмов народов».'
