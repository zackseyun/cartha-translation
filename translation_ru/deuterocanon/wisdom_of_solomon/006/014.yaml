  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/014.yaml
  text: Whoever rises early for her will not grow weary[b][a], for he will find her sitting beside his gates.
translation:
  language: ru
  text: Кто рано станет искать её[a], тот не утомится, ведь он найдёт её сидящей у своих ворот[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто рано встанет ради неё». Греческий глагол буквально связан с ранним подъёмом и в данном контексте может обозначать усердное раннее обращение к Мудрости.'
    reason: lexical_alternative
  - marker: b
    text: Мудрость представлена как личность, которая уже сидит у входа и ждёт ищущего.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ὀρθρίσας
  choice: Кто… встанет рано
  rationale: Причастие от ὀρθρίζω буквально обозначает ранний подъём, а в данном контексте также передаёт усердное стремление к Мудрости. Перевод сохраняет конкретный образ и обобщённый характер изречения.
- source_word: ἐπ' αὐτὴν
  choice: ради неё
  rationale: Предлог с винительным выражает направленность или цель; местоимение женского рода сохраняет олицетворение Мудрости.
- source_word: οὐ κοπιάσει
  choice: не утомится
  rationale: κοπιάω может означать тяжело трудиться или утомляться. Здесь подчёркнуто, что стремящийся к Мудрости не изнурится в поисках.
- source_word: πάρεδρον
  choice: сидящей у
  rationale: πάρεδρος обозначает того, кто сидит рядом или находится при ком-либо. Такая передача сохраняет конкретный образ ожидающей у входа Мудрости.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит объяснение, почему ищущий не утомится; «ведь» естественно передаёт эту связь в современном русском.
- source_word: τῶν πυλῶν αὐτοῦ
  choice: у своих ворот
  rationale: πύλη означает ворота или вход; возвратное «своих» ясно соотносит их с ищущим и не добавляет отсутствующего в греческом слова «дом».
theological_decisions:
- issue: Женское олицетворение Мудрости и мужская грамматическая форма ищущего
  choice: Сохранить женское местоимение «неё/её», а обобщённое указание на ищущего передать конструкцией «кто… тот» без избыточного акцента на его поле.
  alternative: Передать ищущего явно мужскими формами «тот, кто… он», следуя грамматическому роду греческого причастия.
  rationale: Женское олицетворение Мудрости существенно для образа и сохранено. Русская конструкция «кто… тот» естественно выражает общее правило и не устраняет исходную грамматическую форму посредством богословского переосмысления.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Сохранены женское олицетворение Мудрости, образ раннего подъёма и конкретная сцена у ворот; синтаксис сделан естественным для широкого круга читателей.
