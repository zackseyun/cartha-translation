base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/009.yaml
  text: Therefore my words are for you[a], O tyrants[b], so that you may learn wisdom and not fall away.
translation:
  language: ru
  text: Итак, к вам, тираны[a], обращены мои слова, чтобы вы научились мудрости и не сбились с пути[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «властители». Греческое слово может обозначать единовластных правителей вообще, однако здесь звучит резко и отрицательно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не оступились» или «не пали». Греческий глагол может широко означать ошибку, уклонение или падение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: к вам ... обращены
  rationale: Предложная конструкция указывает на адресатов слов; добавленное по-русски «обращены» естественно восполняет подразумеваемую связку, не меняя смысла.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод и переход от предшествующего предостережения к прямому обращению.
- source_word: ὦ τύραννοι
  choice: тираны
  rationale: Сохраняет резкую, отрицательно окрашенную характеристику властителей в контексте предостережения; более нейтральное «правители» ослабило бы риторическую силу.
- source_word: οἱ λόγοι μου
  choice: мои слова
  rationale: Прямо передаёт форму множественного числа и сохраняет достойный, ясный стиль.
- source_word: ἵνα μάθητε σοφίαν
  choice: чтобы вы научились мудрости
  rationale: Сохраняет целевое значение ἵνα с сослагательным наклонением и центральный для книги термин «мудрость».
- source_word: μὴ παραπέσητε
  choice: не сбились с пути
  rationale: Передаёт широкий образ уклонения, ошибки или нравственного падения, не сужая его до физического падения либо явно вероотступнического смысла.
theological_decisions:
- issue: Оценочная сила обращения τύραννοι к носителям власти
  choice: «тираны»
  alternative: «правители» или «властители»
  rationale: В данном предостерегающем контексте греческое слово имеет резкую отрицательную окраску; перевод сохраняет её, не добавляя отдельного учения о политической власти.
- issue: Характер неудачи в μὴ παραπέσητε
  choice: «не сбились с пути»
  alternative: «не пали», «не оступились» или «не отпали»
  rationale: Выбранная формулировка сохраняет нравственную направленность и смысл уклонения, но не превращает неоднозначный глагол в специальный термин вероотступничества.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Прямое обращение и резкость обличения сохранены; неоднозначность последнего глагола отмечена в сноске.
