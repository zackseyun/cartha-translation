  text: A multitude of the wise is the salvation of the world[b][a], and a prudent king is the stability of a people.
translation:
  language: ru
  text: Множество мудрых — спасение[a] мира, а благоразумный царь — устойчивость народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
