lexical_decisions:
- source_word: πλῆθος σοφῶν
  choice: множество мудрых
  rationale: Сохраняет именную конструкцию, обобщённый смысл и возвышенную афористичность греческого выражения.
- source_word: σωτηρία
  choice: спасение
  rationale: Передаёт полную смысловую весомость слова, которое здесь может обозначать спасение, избавление или сохранение мира, не сводя его только к общественному благополучию.
- source_word: κόσμου
  choice: мира
  rationale: Прямо передаёт родительный падеж и широкий смысл κόσμος, охватывающий человеческий мир.
- source_word: βασιλεὺς φρόνιμος
  choice: благоразумный царь
  rationale: «Царь» точно передаёт политический титул, а «благоразумный» подчёркивает практическую рассудительность и отличает φρόνιμος от σοφός в первой части стиха.
- source_word: εὐσταθία
  choice: устойчивость
  rationale: Сохраняет значение прочности и стабильности в общественно-политическом контексте, не добавляя отсутствующей в греческом метафоры.
- source_word: δήμου
  choice: народа
  rationale: Естественно передаёт δῆμος в общем изречении; возможные оттенки значения — население или гражданская община — отмечены в сноске.
theological_decisions:
- issue: Объём значения σωτηρία в контексте мудрости и управления
  choice: спасение
  alternative: избавление; сохранение; благополучие
  rationale: Хотя контекст имеет общественно-политический характер, греческое слово сохраняет более сильный смысл спасительного блага. Перевод не ограничивает его исключительно гражданским благополучием.
translation_notes:
