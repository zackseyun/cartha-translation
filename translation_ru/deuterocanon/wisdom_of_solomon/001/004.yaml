  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/004.yaml
  text: For wisdom will not enter a soul that devises evil[b][a], nor dwell in a body enslaved to sin.
translation:
  language: ru
  text: Ибо мудрость не войдёт в душу, замышляющую зло[a], и не будет обитать в теле, подвластном греху[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искусную во зле», «коварную»; греческое слово буквально указывает на умение измышлять или устраивать зло.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «повинном греху», «обременённом долгом перед грехом». Греческое слово может обозначать состояние долга, обязательства или подчинения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακότεχνον
  choice: замышляющую зло
  rationale: Прилагательное обозначает искусность в дурном, склонность изобретать или устраивать зло. Причастный оборот естественен по-русски и сохраняет оттенок злого умысла, не сводя значение лишь к обману.
- source_word: ψυχὴν
  choice: душу
  rationale: Прямое соответствие греческому слову, сохраняющее его нравственно-антропологический вес и противопоставление телу.
- source_word: εἰσελεύσεται
  choice: не войдёт
  rationale: Сохраняет будущее время и пространственный образ вхождения мудрости.
- source_word: σοφία
  choice: мудрость
  rationale: Обычное и контекстуально точное соответствие в литературе Премудрости.
- source_word: κατοικήσει
  choice: не будет обитать
  rationale: Передаёт длительное, устойчивое пребывание и сохраняет отличие от простого «войти».
- source_word: σώματι
  choice: теле
  rationale: Прямой перевод, необходимый для сохранения явного сопоставления души и тела.
- source_word: κατάχρεῳ
  choice: подвластном
  rationale: Передаёт состояние тела, находящегося под притязанием или властью греха, и звучит естественнее, чем буквальное долговое выражение.
- source_word: ἁμαρτίας
  choice: греху
  rationale: Простое и точное соответствие; дательный падеж обусловлен русским управлением слова «подвластный».
theological_decisions:
- issue: Соотношение души и тела
  choice: 'Сохранены оба самостоятельных обозначения: «душа» и «тело».'
  alternative: Передать ψυχή как «человек» или «внутреннее я».
  rationale: Греческий текст явно называет и душу, и тело; перевод сохраняет литературное и нравственное сопоставление, не выводя из него развитого учения об их природе.
- issue: Смысл κατάχρεῳ ἁμαρτίας
  choice: «подвластном греху»
  alternative: «повинном греху», «в долгу у греха», «порабощённом грехом»
  rationale: Греческое выражение допускает оттенки долга, обязательства и подчинения. «Подвластном» передаёт сильную зависимость, но не усиливает метафору до прямого рабства и не устраняет исходную смысловую широту.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной библейской интонацией. Параллелизм «не войдёт… и не будет обитать» сохраняет развитие греческого образа: от вхождения к постоянному пребыванию.'
