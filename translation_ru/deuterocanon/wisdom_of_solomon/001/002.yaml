  text: because he is found by those who do not test him[b][a], and he reveals himself to those who do not distrust him.
translation:
  language: ru
  text: потому что Его находят те, кто не подвергает Его испытанию[a], и Он открывается тем, кто не относится к Нему с недоверием[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не испытывает Его». Греческий глагол в некоторых контекстах может также означать «искушать».'
