  - marker: b
    text: 'Или: «не верит Ему» или «не имеет веры в Него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Передаёт причинную связь с предшествующим призывом ясно и естественно для современного русского языка.
- source_word: εὑρίσκεται
  choice: Его находят
  rationale: Сохраняет прямой смысл греческой формы и не уточняет сверх текста, каким образом Бог становится доступен ищущим.
- source_word: τοῖς μὴ πειράζουσιν αὐτόν
  choice: те, кто не испытывает Его
  rationale: «Испытывать» сохраняет широкий смысл πειράζω — проверять, подвергать испытанию; возможный оттенок «искушать» вынесен в примечание.
- source_word: ἐμφανίζεται
  choice: Он открывается
  rationale: Естественно передаёт проявление или самообнаружение личного субъекта, не сводя выражение лишь к зрительному явлению.
- source_word: τοῖς μὴ ἀπιστοῦσιν αὐτῷ
  choice: тем, кто не проявляет к Нему недоверия
  rationale: Сохраняет отрицательную форму и личностно-реляционный оттенок ἀπιστέω с дательным, не сужая смысл до одного лишь интеллектуального неверия.
theological_decisions:
- issue: 'Оттенок выражения ἀπιστοῦσιν αὐτῷ: неверие или недоверие Богу'
  choice: не проявляет к Нему недоверия
  alternative: не верит Ему; не имеет веры в Него
  rationale: Основной вариант передаёт отношение человека к Богу и одновременно сохраняет напряжение между недоверием, неверием и отсутствием веры; альтернативы указаны в примечании без догматического сужения.
- issue: Смысл πειράζω по отношению к Богу
  choice: не испытывает Его
  alternative: не подвергает Его испытанию; не искушает Его
  rationale: Нейтральное «испытывает» сохраняет семантическую широту глагола и не навязывает более сильный нравственный оттенок «искушает».
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксический параллелизм двух частей сохранён; местоимения о Боге написаны с прописной буквы согласно распространённой русской библейской издательской норме.
