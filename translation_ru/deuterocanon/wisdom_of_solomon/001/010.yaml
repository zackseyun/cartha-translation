lexical_decisions:
- source_word: οὖς
  choice: ухо
  rationale: Буквальная передача сохраняет олицетворённый образ всеслышащего божественного слуха.
- source_word: ζηλώσεως
  choice: ревности
  rationale: Слово «ревность» сохраняет напряжённость греческого ζηλώσεως и в русском языке может обозначать как ревнивую взыскательность, так и горячую преданность; контекст указывает не на мелочную зависть, а на неусыпную нравственную взыскательность.
- source_word: ἀκροᾶται
  choice: слышит
  rationale: Простая и точная передача глагола слухового восприятия; в сочетании с «всё» выражает полноту слышания.
- source_word: τὰ πάντα
  choice: всё
  rationale: Естественный современный русский эквивалент, сохраняющий всеохватность греческого выражения.
- source_word: θροῦς
  choice: звук
  rationale: Передаёт слуховой образ существительного, не сужая его заранее до шёпота или молвы.
- source_word: γογγυσμῶν
  choice: ропота
  rationale: «Ропот» передаёт приглушённое недовольство и нравственный оттенок греческого слова; собирательное единственное число естественно по-русски.
- source_word: οὐκ ἀποκρύπτεται
  choice: не остаётся скрытым
  rationale: Сохраняет пассивную конструкцию и подчёркивает невозможность утаить даже тихий ропот.
theological_decisions:
- issue: Смысл ζηλώσεως применительно к божественному восприятию
  choice: ревности
  alternative: рвения; ревностной бдительности
  rationale: «Ревность» сохраняет присущую греческому слову многозначность и образ нравственно взыскательного божественного слуха, не сводя его ни к греховной зависти, ни к одному лишь усердию.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной библейской интонацией. Синтаксический параллелизм и слуховой образ оригинала сохранены; неоднозначность ζηλώσεως вынесена в примечание.
