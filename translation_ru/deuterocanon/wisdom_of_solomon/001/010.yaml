translation:
  language: ru
  text: Ибо ревнивое ухо[a] слышит всё, и звук ропота[b] не остаётся скрытым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ухо рвения». Греческое слово может означать и ревность, и рвение; здесь образ передаёт неусыпную нравственную взыскательность.'
