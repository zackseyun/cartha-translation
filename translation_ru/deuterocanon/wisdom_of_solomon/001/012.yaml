base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/012.yaml
  text: Do not court death by the error of your life[b][a], nor draw destruction upon yourselves by the works of your hands.
translation:
  language: ru
  text: Не стремитесь к смерти, заблуждаясь в своей жизни[a], и не навлекайте на себя погибель делами своих рук[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «из-за заблуждения вашей жизни». Греческое выражение может указывать на заблуждение, уклонение или обман, связанный с образом жизни.'
    reason: lexical_alternative
  - marker: b
    text: «Дела своих рук» могут означать поступки вообще; конкретный образ также может напоминать о вещах, изготовленных человеком.
    reason: cultural_note
lexical_decisions:
- source_word: ζηλοῦτε
  choice: стремитесь
  rationale: Глагол ζηλόω может обозначать ревностное желание или усердное стремление. «Стремитесь» естественно передаёт направленное влечение к смерти, не ослабляя предостережения и не вводя дополнительного образа.
- source_word: θάνατον
  choice: смерти
  rationale: Прямое и однозначное соответствие греческому θάνατον.
- source_word: ἐν πλάνῃ ζωῆς ὑμῶν
  choice: заблуждаясь в своей жизни
  rationale: πλάνη охватывает значения заблуждения, уклонения и обмана. Деепричастная конструкция передаёт связь ошибочного образа жизни со стремлением к смерти, оставаясь естественной по-русски; возможная более формальная связь отмечена в сноске.
- source_word: ἐπισπᾶσθε
  choice: навлекайте на себя
  rationale: Средний залог выражает действие, которым люди сами вызывают для себя пагубное последствие. Русское выражение сохраняет эту возвратную направленность.
- source_word: ὄλεθρον
  choice: погибель
  rationale: Слово передаёт гибельный итог и разорение, сохраняя весомость ὄλεθρος без превращения его в специальный богословский термин.
- source_word: ἔργοις χειρῶν ὑμῶν
  choice: делами своих рук
  rationale: Сохранён конкретный греческий образ, который может обозначать как поступки вообще, так и созданное человеческими руками, без искусственного сужения смысла.
theological_decisions:
- issue: 'Передача ζηλόω при θάνατον: буквальное ревностное желание или деятельное стремление'
  choice: Не стремитесь к смерти
  alternative: Не желайте смерти; не ревнуйте о смерти
  rationale: «Стремитесь» ясно выражает деятельное влечение, подразумеваемое контекстом, но не добавляет отсутствующий в греческом тексте образ ухаживания или заигрывания со смертью.
- issue: Возвратная сила среднего залога ἐπισπᾶσθε
  choice: не навлекайте на себя погибель
  alternative: не притягивайте погибель; не приводите себя к погибели
  rationale: Выбранная формулировка прямо показывает, что погибель становится последствием собственных действий адресатов, не утверждая при этом больше, чем выражает греческая грамматика.
- issue: Возможный смысл выражения «дела рук»
  choice: сохранить конкретный образ без уточнения предмета
  alternative: передать обобщённо как «своими поступками» или истолковать как указание на идолов
  rationale: Греческая фраза допускает широкий смысл человеческих дел и возможный отзвук речи о рукотворных предметах. Перевод не должен заранее разрешать эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Синтаксис ясен для широкого читателя; конкретный образ «дел своих рук» сохранён, а тяжеловесные буквальные обороты устранены.
