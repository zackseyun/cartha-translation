base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/008.yaml
  text: Therefore no one who speaks unrighteous things will escape notice[b][a], nor will convicting justice pass him by.
translation:
  language: ru
  text: Поэтому никто, говорящий неправедное, не останется незамеченным[a], и обличающее правосудие не пройдёт мимо него[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никто, произносящий несправедливое, не ускользнёт от внимания».'
    reason: lexical_alternative
  - marker: b
    text: '«Правосудие» можно понимать и как олицетворённый суд: «и суд, обличая его, не пройдёт мимо».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно передаёт причинно-следственную связь с предшествующим утверждением.
- source_word: φθεγγόμενος ἄδικα
  choice: говорящий неправедное
  rationale: Причастная конструкция сохранена без стилистической тяжеловесности; субстантивированное единственное число «неправедное» естественно передаёт нейтральное множественное ἄδικα как содержание речи и сохраняет нравственный смысл корня δικ-.
- source_word: οὐδεὶς μὴ λάθῃ
  choice: никто ... не останется незамеченным
  rationale: Передаёт значение λανθάνω — укрыться от внимания, остаться незамеченным — и категоричность усиленного греческого отрицания.
- source_word: οὐδὲ μὴ παροδεύσῃ αὐτόν
  choice: и ... не пройдёт мимо него
  rationale: Сохраняет образное значение παροδεύω и подчёркивает, что виновный не будет обойдён.
- source_word: ἐλέγχουσα
  choice: обличающее
  rationale: Передаёт продолжающееся действие причастия и допускает значения выявления вины и вынесения уличающего суждения, не сужая его исключительно до судебного осуждения.
- source_word: ἡ δίκη
  choice: правосудие
  rationale: Передаёт судебно-нравственный смысл δίκη и позволяет сохранить присутствующую в греческом олицетворённость.
theological_decisions:
- issue: Сохранение нравственного и судебного смыслов ἄδικα и δίκη
  choice: «неправедное» и «правосудие»
  alternative: «несправедливое» и «суд» либо «неправду» и «кара»
  rationale: Основной вариант удерживает нравственную широту ἄδικα и судебную силу δίκη, не сводя последнюю только к наказанию и не вводя конфессионально обусловленного толкования.
- issue: Степень олицетворения δίκη
  choice: Сохранить олицетворение в сочетании «обличающее правосудие»
  alternative: 'Передать абстрактно: «он не избежит обличения правосудием»'
  rationale: Согласование артикля, причастия и существительного в греческом позволяет слышать олицетворённое Правосудие; русская конструкция сохраняет эту возможность, не делая её обязательной.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для библейского текста. Синтаксис близок к греческому, но остаётся естественным; причастное сочетание «обличающее правосудие» намеренно сохраняет напряжённую олицетворённость оригинала.
