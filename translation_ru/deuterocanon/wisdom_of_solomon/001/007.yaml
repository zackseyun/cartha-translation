  text: For the Spirit of the Lord has filled the inhabited world[b][a], and that which holds all things together has knowledge of every utterance.
translation:
  language: ru
  text: Ибо Дух Господа наполнил обитаемый мир, и то, что удерживает всё вместе[a], ведает обо всём сказанном[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что содержит всё», «то, что объемлет всё». Греческое причастие среднего рода может выражать охватывание, поддержание или скрепление всего сущего.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «имеет знание голоса». Здесь «голос» может означать речь, звук или произнесённое слово; смысл в том, что от Божьего Духа не укрывается ничто сказанное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα Κυρίου
  choice: Дух Господа
  rationale: Сочетание указывает на деятельное и всепроникающее Божье присутствие. Заглавная буква передаёт вероятный божественный референт, не навязывая более поздней догматической формулировки.
- source_word: πεπλήρωκεν
  choice: наполнил
  rationale: 'Перфект обозначает совершившееся действие с сохраняющимся результатом: Дух наполнил мир и пребывает в нём.'
- source_word: τὴν οἰκουμένην
  choice: обитаемый мир
  rationale: Передаёт обычное значение οἰκουμένη — населённая земля, обитаемый мир — и сохраняет отличие от более общего слова «мир».
- source_word: τὸ συνέχον τὰ πάντα
  choice: то, что объемлет всё
  rationale: Средний род субстантивированного причастия сохранён неперсонифицированной конструкцией. Глагол συνέχω здесь допускает значения охватывания, удерживания и скрепления; «объемлет» естественно выражает космический охват, не устраняя многозначности.
- source_word: γνῶσιν ἔχει φωνῆς
  choice: знает всякий голос
  rationale: Буквально выражение означает «имеет знание голоса». Русское «знает всякий голос» естественно передаёт всеохватность знания в контексте, сохраняя образ голоса и возможность понимать его как речь или произнесённое слово.
theological_decisions:
- issue: Следует ли понимать πνεῦμα Κυρίου как безличный дух или как Божий Дух
  choice: Дух Господа
  alternative: дух Господа
  rationale: Контекст приписывает Духу вселенское присутствие и знание голоса. Заглавная буква уместно обозначает божественный референт, но перевод не уточняет его в категориях позднейшего богословия.
- issue: Относится ли τὸ συνέχον τὰ πάντα лично к Духу или обозначает более отвлечённую всеобъемлющую силу
  choice: то, что объемлет всё
  alternative: Тот, кто удерживает всё вместе
  rationale: Греческое причастие стоит в среднем роде. Неперсонифицированная русская конструкция сохраняет грамматическую и богословскую неоднозначность, не исключая смысловой связи с Духом Господа.
