base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/014.yaml
  text: For he created all things so that they might exist[a], and the generations of the world are health-giving, and in them there is no poison of destruction, nor the dominion of Hades upon the earth[b];
translation:
  language: ru
  text: Ибо Он сотворил всё, чтобы оно существовало, и порождения мира благотворны[a]; нет в них яда погибели, и нет на земле власти Аида[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «создания мира целительны»; возможно также: «начала мира благотворны». Греческое выражение широко по смыслу и может обозначать происхождения, порождения либо возникшие в мире создания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царство Аида». Греческое слово может обозначать как царство или область, так и власть или господство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκτισεν
  choice: сотворил
  rationale: Глагол обозначает создание, приведение к существованию; «сотворил» точно передаёт божественное творческое действие и соответствует достойному библейскому регистру.
- source_word: εἰς τὸ εἶναι
  choice: чтобы оно существовало
  rationale: 'Оборот выражает цель или направленность результата: всё сотворено для существования, а не для гибели. Местоимение «оно» согласуется с собирательным русским «всё».'
- source_word: τὰ πάντα
  choice: всё
  rationale: Краткое и естественное русское соответствие всеохватному греческому выражению; означает совокупность всего сотворённого.
- source_word: σωτήριοι
  choice: благотворны
  rationale: В контексте противопоставления погибели слово указывает на сохраняющее жизнь, целительное или полезное действие. «Благотворны» сохраняет широту смысла и не сужает его до явно сотериологического значения.
- source_word: αἱ γενέσεις τοῦ κόσμου
  choice: порождения мира
  rationale: γένεσις может обозначать происхождение, возникновение и то, что возникло или было порождено. «Порождения мира» близко к форме оригинала и оставляет выражению присущую ему широту.
- source_word: φάρμακον ὀλέθρου
  choice: яд погибели
  rationale: В данном противопоставлении благотворному творению φάρμακον имеет значение вредоносного вещества. Генитивная конструкция сохранена без превращения образа в простое прилагательное «смертельный».
- source_word: ᾅδου βασίλειον
  choice: власть Аида
  rationale: βασίλειον допускает значение царства, области или царственной власти. «Власть Аида» естественно передаёт идею господства и не делает подземный мир исключительно географическим местом.
- source_word: ἐπὶ γῆς
  choice: на земле
  rationale: Естественно и точно обозначает земную сферу, в которой отрицается власть Аида.
theological_decisions:
- issue: Значение σωτήριοι в контексте творения
  choice: благотворны, то есть содействуют сохранению жизни
  alternative: спасительны; целительны; несут жизнь
  rationale: Ближайший контекст противопоставляет творение погибели и смерти. Выбор сохраняет жизнеутверждающий смысл, не вводя в стих явно выраженное учение о спасении, которого сама фраза однозначно не формулирует.
- issue: Передача ᾅδης
  choice: Аид
  alternative: ад; преисподняя; смерть
  rationale: Транслитерация сохраняет конкретное греческое понятие и не сводит его без необходимости ни к могиле, ни к смерти, ни к позднейшему представлению о месте окончательного наказания.
- issue: Значение βασίλειον
  choice: власть
  alternative: царство; область
  rationale: Контекст допускает как пространственное царство, так и господствующую силу. Основной текст передаёт абстрактное значение, а сноска сохраняет реальную лексическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; лексическая неоднозначность выражений αἱ γενέσεις τοῦ κόσμου и ᾅδου βασίλειον сохранена в основном тексте и пояснена в сносках.
