base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/011.yaml
  text: Therefore guard yourselves against useless grumbling[a], and spare your tongue from slander; for no secret utterance goes out empty[b], and a lying mouth destroys a soul.
translation:
  language: ru
  text: Итак, берегитесь бесполезного ропота и удерживайте язык от злословия, ведь тайное слово не проходит впустую[a], а лживые уста губят душу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не уходит пустым»; то есть тайно сказанное не остаётся без действия или последствий.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жизнь»; или: «человека». Греческое слово может означать душу, жизнь или человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξασθε
  choice: берегитесь
  rationale: Аористный средний императив призывает к сознательной самозащите; русское «берегитесь» естественно передаёт и повеление, и возвратный оттенок.
- source_word: τοίνυν
  choice: итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно вводит увещание.
- source_word: γογγυσμὸν ἀνωφελῆ
  choice: бесполезного ропота
  rationale: «Ропот» передаёт недовольное ворчание или сетование, а «бесполезного» сохраняет прямое значение ἀνωφελής.
- source_word: ἀπὸ καταλαλιᾶς φείσασθε γλώσσης
  choice: удерживайте язык от злословия
  rationale: Формулировка сохраняет образ языка и передаёт призыв воздерживаться от клеветнической, порочащей речи естественным современным русским языком.
- source_word: φθέγμα λαθραῖον
  choice: тайное слово
  rationale: «Слово» естественно передаёт произнесённое высказывание, а «тайное» сохраняет смысл скрытой, негласной речи.
- source_word: κενὸν οὐ πορεύεται
  choice: не проходит впустую
  rationale: Сохраняется образ движения и смысл того, что скрытая речь не остаётся без действия или последствий.
- source_word: στόμα ... καταψευδόμενον
  choice: лживые уста
  rationale: Краткая пословичная формула передаёт уста, произносящие ложь; слово «уста» уместно в современном литературном библейском регистре.
- source_word: ἀναιρεῖ ψυχήν
  choice: губят душу
  rationale: «Губят» передаёт сильное значение уничтожения или лишения жизни, не ограничивая выражение исключительно физической смертью.
- source_word: ψυχήν
  choice: душу
  rationale: «Душа» сохраняет антропологическую и нравственную весомость ψυχή, тогда как значения «жизнь» и «человек» отмечены в сноске.
theological_decisions:
- issue: Значение ψυχή в заключительной части стиха
  choice: «душу» в основном тексте
  alternative: «жизнь» или «человека»
  rationale: Такой перевод сохраняет нравственно-антропологическую глубину предупреждения и не сводит его только к физической смерти; допустимая широта греческого слова указана в сноске.
- issue: Смысл выражения κενὸν οὐ πορεύεται
  choice: «не проходит впустую»
  alternative: 'буквально: «не уходит пустым»; по смыслу: «не остаётся без последствий»'
  rationale: Основной текст сохраняет метафору греческого выражения, не определяя точный вид последствий тайной речи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образ языка, метафора речи, которая «не проходит впустую», и многозначность слова ψυχή; архаическая и конфессионально маркированная лексика не вводилась.
