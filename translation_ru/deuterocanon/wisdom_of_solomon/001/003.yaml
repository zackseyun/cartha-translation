  text: For crooked thoughts separate from God, and when his power is tested, it exposes the foolish.
translation:
  language: ru
  text: Ведь кривые помыслы отдаляют от Бога[a], а когда его силу испытывают, она обличает неразумных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превратные рассуждения отделяют от Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «она изобличает неразумных». В греческом буквально сказано «сила»; по контексту имеется в виду сила Бога.'
    reason: lexical_and_referential_alternative
lexical_decisions:
- source_word: σκολιοὶ λογισμοὶ
  choice: кривые помыслы
  rationale: Сочетание обозначает нравственно искажённые внутренние мысли и рассуждения. «Кривые помыслы» передаёт образность σκολιοί и звучит естественно для русской литературы Премудрости.
- source_word: χωρίζουσιν ἀπὸ θεοῦ
  choice: отдаляют от Бога
  rationale: Глагол выражает разделение или удаление. Такая формулировка сохраняет прямой смысл, не вводя более узкого богословского понятия отчуждения.
- source_word: δοκιμαζομένη
  choice: когда … испытывают
  rationale: Временная конструкция ясно передаёт причастие среднего/страдательного залога и сохраняет мысль о силе, подвергаемой испытанию.
- source_word: ἡ δύναμις
  choice: его силу
  rationale: Непосредственно предшествующее упоминание Бога естественно указывает на Божью силу. Местоимение делает русскую связь ясной, не вводя нового содержания.
- source_word: ἐλέγχει
  choice: обличает
  rationale: «Обличает» сохраняет диапазон значений — выявляет, доказывает неправоту, изобличает — без сведения выражения только к судебному осуждению.
- source_word: τοὺς ἄφρονας
  choice: неразумных
  rationale: Слово обозначает людей, лишённых разумения или мудрости. Субстантивированное «неразумных» соответствует стилю литературы Премудрости и не звучит как бытовое оскорбление.
theological_decisions:
- issue: К кому относится ἡ δύναμις
  choice: 'Отнесено к Богу: «его силу».'
  alternative: Буквальное и менее определённое «силу».
  rationale: Предшествующее ἀπὸ θεοῦ делает Божью силу наиболее естественным референтом, хотя в греческом стоит существительное с артиклем без притяжательного местоимения.
- issue: Смысл ἐλέγχει при испытании силы
  choice: «обличает неразумных».
  alternative: «изобличает неразумных» или «доказывает неправоту неразумных».
  rationale: «Обличает» сохраняет напряжение между выявлением истинного состояния человека, опровержением и возможным осуждением, не уточняя способ действия сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим книге Премудрости. Образ «кривые» сохранён; синтаксис сделан ясным без архаизмов. Местоимение «его» написано со строчной буквы по общим нормам современного русского языка.
