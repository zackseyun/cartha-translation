    text: 'Буквально: «слышание его слов»; то есть сказанное им будет услышано и дойдёт до Господа.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «выявления», «изобличения» или «доказательства вины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβουλίοις
  choice: замыслы
  rationale: Слово обозначает обдуманные намерения, планы или решения; в контексте нечестивого «замыслы» естественно передаёт возможный отрицательный оттенок, не превращая его в прямое обвинение.
- source_word: ἀσεβοῦς
  choice: нечестивого
  rationale: Сохраняет религиозно-нравственный смысл греческого слова и его обобщённую форму единственного числа.
- source_word: ἐξέτασις
  choice: будут исследованы
  rationale: Передаёт тщательное рассмотрение или проверку; пассивная конструкция по-русски естественно выражает греческое «будет исследование».
- source_word: λόγων
  choice: словах
  rationale: Прямой и достаточно широкий эквивалент, подходящий для речей, высказываний или сказанного.
- source_word: ἀκοὴ
  choice: весть
  rationale: Буквально слово связано со слышанием или услышанным; здесь «весть» естественно передаёт мысль о том, что сказанное становится известно Господу.
- source_word: Κύριον
  choice: Господа
  rationale: Традиционное и ясное соответствие κύριος в обращении к Богу.
- source_word: ἔλεγχον
  choice: обличения
  rationale: Сохраняет смысл выявления и доказательного изобличения вины, не сужая его только до наказания или осуждения.
- source_word: ἀνομημάτων
  choice: беззаконных дел
  rationale: Передаёт конкретные поступки, противные закону, и сохраняет множественное число исходного текста.
theological_decisions:
- issue: Обобщённое единственное число в ἀσεβοῦς и αὐτοῦ
  choice: 'Сохранено единственное число мужского рода: «нечестивого… его».'
  alternative: 'Передать обобщённым множественным числом: «нечестивых… их».'
  rationale: Греческий текст говорит об обобщённом представителе класса в единственном числе. Русская форма сохраняет грамматику источника и не означает, что утверждение относится исключительно к мужчинам.
- issue: Смысл εἰς ἔλεγχον
  choice: «для обличения»
  alternative: «для выявления» или «для доказательства вины».
  rationale: Греческое слово допускает оттенки выявления, опровержения, обличения и доказательства вины; «обличение» сохраняет эту смысловую напряжённость без преждевременного сведения выражения к судебному приговору.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён по сравнению с греческой именной конструкцией, но сохранены причинная связь, судебно-исследовательский оттенок и обобщённое единственное число.
