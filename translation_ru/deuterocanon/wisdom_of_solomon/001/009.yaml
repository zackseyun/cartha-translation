  source_fidelity: 'Первая часть точно передаёт ἐν ... διαβουλίοις ἀσεβοῦς ἐξέτασις ἔσται: «замыслы нечестивого будут исследованы» сохраняет будущую судебно-исследовательскую перспективу и обобщённое единственное число. Во второй части «весть о его словах» двусмысленно означает сообщение *о* словах, тогда как ἀκοὴ λόγων αὐτοῦ говорит о том, что сказанное нечестивым будет услышано и достигнет Господа. «Сказанное им» точнее передаёт этот смысл естественным русским выражением. «Для обличения его беззаконных дел» адекватно сохраняет εἰς ἔλεγχον ἀνομημάτων αὐτοῦ без сведения к приговору или наказанию.'
