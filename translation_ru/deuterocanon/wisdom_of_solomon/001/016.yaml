base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/016.yaml
  text: But the ungodly[a], with their hands and their words, called for him; considering him a friend, they wasted away, and they made a covenant with him[c][b], because they are worthy to belong to his portion.
translation:
  language: ru
  text: Но нечестивые руками и словами призвали его к себе[a]; сочтя его другом, они исчахли и заключили с ним союз[b], потому что достойны быть его уделом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «его» относится к Смерти, олицетворённой в предшествующем контексте.
    reason: cross_reference
  - marker: b
    text: 'Или: «заключили с ним договор»; буквально также возможно: «заключили с ним завет».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «принадлежать к его доле»; «удел» также может означать жребий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: нечестивые
  rationale: Передаёт религиозно-нравственный смысл слова, а не только общую порочность.
- source_word: ταῖς χερσὶ καὶ τοῖς λόγοις
  choice: руками и словами
  rationale: 'Сохраняет конкретный параллелизм греческого текста: физические действия и речь.'
- source_word: προσεκαλέσαντο αὐτόν
  choice: призвали его к себе
  rationale: Средний залог указывает на призывание к себе; формулировка также сохраняет местоимение исходного текста.
- source_word: φίλον ἡγησάμενοι αὐτόν
  choice: сочтя его другом
  rationale: Кратко и естественно передаёт конструкцию со значением «считать, признавать кем-либо» и сохраняет олицетворение Смерти.
- source_word: ἐτάκησαν
  choice: исчахли
  rationale: Передаёт образ таяния, истощения и угасания без добавления отсутствующего в греческом тексте объекта чувства.
- source_word: συνθήκην ἔθεντο πρὸς αὐτόν
  choice: заключили с ним союз
  rationale: «Союз» сохраняет торжественный смысл обязывающего соглашения, но в современном русском не навязывает исключительно библейско-заветную терминологию.
- source_word: ἄξιοί εἰσιν τῆς ἐκείνου μερίδος εἶναι
  choice: достойны принадлежать к его уделу
  rationale: Сохраняет как оценочное «достойны», так и образ доли или удела, принадлежащего олицетворённой Смерти.
theological_decisions:
- issue: К кому относится местоимение αὐτόν
  choice: В основном тексте сохранено «его», а в сноске указано, что речь идёт об олицетворённой Смерти.
  alternative: Заменить местоимение словом «Смерть».
  rationale: Греческий стих продолжает олицетворение из ближайшего контекста, но употребляет местоимение; перевод сохраняет эту литературную связь и не устраняет её посредством подстановки.
- issue: Значение συνθήκη в союзе со Смертью
  choice: «заключили с ним союз»
  alternative: «заключили с ним завет» или «договор»
  rationale: «Союз» выражает серьёзность и добровольность связи, не превращая контекст в прямую параллель к Божьему завету и не ослабляя его до бытовой договорённости.
- issue: Образ μερίς — доля или удел
  choice: «принадлежать к его уделу»
  alternative: «быть его долей»
  rationale: Выбранная формулировка сохраняет возможный смысл принадлежности сфере или жребию Смерти; альтернатива сильнее представляет самих нечестивых как доставшуюся ей долю.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, подходящим для Писания звучанием. Конкретные образы «руками и словами» и «удел» сохранены; редкое, но понятное «исчахли» удерживает образ внутреннего истощения греческого глагола.
