lexical_decisions:
- source_word: ὅτι
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предыдущей мыслью естественно для современного русского языка.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое соответствие греческому подлежащему.
- source_word: θάνατον
  choice: смерти
  rationale: Сохраняет абстрактное существительное без истолковывающего расширения.
- source_word: οὐκ ἐποίησεν
  choice: не сотворил
  rationale: В данном утверждении о происхождении смерти русское «сотворил» естественно передаёт ποιέω и сохраняет значение совершённого создания; вариант «не создал» также возможен.
- source_word: οὐδὲ
  choice: и не
  rationale: Естественно связывает два отрицательных утверждения; более книжное «и не… также» не требуется.
- source_word: τέρπεται
  choice: не радуется
  rationale: Передаёт удовольствие или радость от чего-либо и звучит ясно и достойно.
- source_word: ἐπʼ ἀπωλείᾳ
  choice: гибели
  rationale: Сочетание «радоваться гибели» идиоматично и передаёт ἀπώλεια как погибель, уничтожение или окончательное крушение без лишнего уточнения.
- source_word: ζώντων
  choice: живущих
  rationale: Сохраняет субстантивированное причастие и его широкий, не ограниченный только людьми охват.
theological_decisions:
- issue: Передача ἐποίησεν в утверждении об отношении Бога к смерти
  choice: не сотворил смерти
  alternative: не создал смерти
  rationale: «Сотворил» сохраняет прямое отрицание происхождения смерти от Божьего действия, не добавляя объяснения того, каким образом смерть возникла. Сноска отмечает допустимый более нейтральный вариант.
- issue: Объём значения ζώντων
  choice: живущих
  alternative: живых; живых существ
  rationale: «Живущих» сохраняет намеренно широкий референт греческого причастия и не ограничивает его людьми или иными существами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Ведь» ясно выражает связь с предшествующим контекстом; «гибели живущих» сохраняет ёмкость и общий охват греческого текста.
