  text: Ведь Бог не создал смерти[a] и не радуется гибели живых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сотворил смерти». Греческий глагол может быть передан обоими способами; «создал» выбрано как более нейтральное соответствие в данном контексте.'
