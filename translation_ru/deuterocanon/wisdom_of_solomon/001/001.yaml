base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/001.yaml
  text: Love righteousness[a], you who judge the earth; think about the Lord with goodness[c][b], and seek him with singleness of heart.
translation:
  language: ru
  text: Любите праведность[a], вы, судящие землю[b]; мыслите о Господе с добрым расположением и ищите Его в простоте сердца[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость». Греческое слово может означать и нравственную праведность, и справедливость; второе значение особенно уместно в обращении к тем, кто судит землю.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вы, правители земли». Буквально: «вы, судящие землю».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в искренности сердца». Греческое выражение указывает на прямое, цельное и нераздвоенное сердце.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: Любите
  rationale: Прямой и естественный современный императив, сохраняющий нравственную настоятельность греческого аориста без ненужной архаизации.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: Слово охватывает как нравственную правоту, так и справедливость. «Праведность» сохраняет более широкий смысл, а контекстуально вероятный вариант «справедливость» вынесен в примечание.
- source_word: οἱ κρίνοντες τὴν γῆν
  choice: вы, судящие землю
  rationale: Сохранён буквальный образ греческого причастного оборота. Вероятное обозначение земных правителей не подставлено в основной текст, чтобы не сужать смысл.
- source_word: φρονήσατε περὶ τοῦ κυρίου
  choice: мыслите о Господе
  rationale: Передаёт направленность ума и внутреннее отношение к Господу; звучит достойно и понятно в современном литературном русском языке.
- source_word: ἐν ἀγαθότητι
  choice: с добрым расположением
  rationale: Передаёт ἀγαθότης как благой, добрый внутренний настрой. Буквальное «в доброте» по-русски здесь звучало бы неестественно и могло бы быть понято лишь как доброта к другим людям.
- source_word: ἐν ἁπλότητι καρδίας
  choice: в простоте сердца
  rationale: Сохраняет образ исходного текста и обозначает цельность, прямоту и искренность сердца; возможное современное уточнение дано в примечании.
- source_word: ζητήσατε αὐτόν
  choice: ищите Его
  rationale: Естественно передаёт настойчивый императив ζητέω и сохраняет принятую библейскую формулировку.
theological_decisions:
- issue: Смысл δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: Обращение к судьям и правителям делает «справедливость» особенно уместной, однако греческое слово обладает более широким нравственным и религиозным значением. Основной текст сохраняет эту широту, а альтернативу отмечает сноска.
- issue: Кого обозначает οἱ κρίνοντες τὴν γῆν
  choice: вы, судящие землю
  alternative: вы, правители земли
  rationale: Оборот, вероятно, обращён к правителям, но исходный текст буквально говорит о тех, кто судит землю. Перевод не устраняет эту смысловую напряжённость.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — естественное и традиционное соответствие κύριος в данном богословском контексте; непосредственный контекст не требует более узкого значения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировки «мыслите о Господе» и «в простоте сердца» сохраняют достоинство и образность оригинала, не прибегая к устаревшей лексике.
