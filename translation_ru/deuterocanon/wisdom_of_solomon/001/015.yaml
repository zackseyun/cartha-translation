  text: For righteousness is immortal[a].
translation:
  language: ru
  text: Ибо праведность бессмертна[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость бессмертна». Греческое δικαιοσύνη может означать и праведность, и справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Слово охватывает как нравственную праведность, так и справедливость. В данном контексте «праведность» лучше сохраняет широкий этический и богословский смысл, а значимая альтернатива приведена в сноске.
- source_word: γάρ
  choice: ибо
  rationale: Союз обосновывает предыдущее высказывание; «ибо» кратко передаёт эту связь и соответствует возвышенному афористическому звучанию стиха.
- source_word: ἀθάνατος
  choice: бессмертна
  rationale: Прилагательное означает «не подверженная смерти»; «бессмертна» — точный и естественный русский эквивалент, согласованный с существительным женского рода.
- source_word: ἐστιν
  choice: бессмертна
  rationale: Греческая связка передана русским составным именным сказуемым с нулевой связкой настоящего времени; отдельное «есть» не требуется.
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет широкий нравственный и богословский смысл слова, не сводя его к юридической справедливости; при этом реальная смысловая альтернатива отмечена в сноске.
translation_notes:
  register: Краткая афористическая фраза в современном литературном русском языке. Союз «ибо» сохраняет логическую связь с предшествующим стихом и придаёт формулировке уместное достоинство без архаизации.
