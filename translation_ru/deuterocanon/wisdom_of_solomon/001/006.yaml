revisions:
- from: Ведь мудрость — человеколюбивый дух, и она не оставит без вины богохульника за слова его уст[a], потому что Бог — свидетель его сокровенных глубин[b], истинный наблюдатель его сердца и слышащий его язык.
  to: Ведь мудрость — человеколюбивый дух, и она не признает богохульника невиновным за слова его уст[a], потому что Бог — свидетель его сокровенных глубин[b], истинный наблюдатель его сердца и слышащий его речь.
  rationale: 'Правка ограничена двумя местами, где русский текст можно сделать точнее и естественнее: судебное «не признает невиновным» непосредственно передаёт οὐκ ἀθῳώσει, а «слышащий его речь» идиоматически раскрывает τῆς γλώσσης ἀκουστής. Олицетворение мудрости, богословская неоднозначность слова «дух», образ «почек» и порядок сносок сохранены.'
