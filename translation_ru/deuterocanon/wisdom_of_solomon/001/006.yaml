base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/006.yaml
  text: For wisdom is a spirit that loves humanity[a], and it will not acquit a blasphemer because of his lips; for God is witness of his inner motives[b], and a true observer of his heart and a hearer of his tongue.
translation:
  language: ru
  text: Ведь мудрость — человеколюбивый дух, и она не признает богохульника невиновным за слова его уст[a], потому что Бог — свидетель его сокровенных глубин[b], истинный наблюдатель его сердца и слышащий его речь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не признает богохульника невиновным из-за того, что исходит из его уст». Греческое выражение после слова «богохульника» сжато и допускает причинное понимание.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «его почек». В библейской образности почки обозначают сокровенный внутренний мир человека — его мысли, чувства и побуждения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλάνθρωπον
  choice: человеколюбивый
  rationale: Передаёт благожелательность и любовь к людям кратко, естественно и без гендерного ограничения.
- source_word: πνεῦμα σοφία
  choice: мудрость — человеколюбивый дух
  rationale: Сохраняет безартиклевую именную конструкцию и олицетворение мудрости, не отождествляя её прямо со Святым Духом.
- source_word: οὐκ ἀθῳώσει
  choice: не оставит без вины
  rationale: 'Передаёт судебный смысл глагола: не признает невиновным и не освободит от вины.'
- source_word: βλάσφημον
  choice: богохульника
  rationale: Сохраняет религиозно-нравственную силу обозначения человека, произносящего хулу.
- source_word: ἀπὸ χειλέων αὐτοῦ
  choice: за слова его уст
  rationale: Естественно выражает вероятную причинную силу сжатой греческой фразы и сохраняет телесный образ уст.
- source_word: τῶν νεφρῶν αὐτοῦ
  choice: его сокровенных глубин
  rationale: Передаёт древний образ почек как скрытого внутреннего мира человека, не сужая смысл исключительно до мотивов.
- source_word: μάρτυς
  choice: свидетель
  rationale: Сохраняет судебную лексику и параллелизм высказывания.
- source_word: ἐπίσκοπος ἀληθής
  choice: истинный наблюдатель
  rationale: Передаёт надёжность и полноту Божьего исследования сердца, избегая церковно-должностной ассоциации слова «епископ».
- source_word: τῆς καρδίας
  choice: его сердца
  rationale: Сохраняет обычный библейский образ внутреннего центра мысли и воли.
- source_word: τῆς γλώσσης ἀκουστής
  choice: слышащий его язык
  rationale: Сохраняет конкретный телесный образ и параллель с «свидетелем» и «наблюдателем», хотя по смыслу речь идёт о произносимых словах.
theological_decisions:
- issue: Следует ли прямо отождествить πνεῦμα σοφία со Святым Духом
  choice: Строчная форма «дух» без уточнения «Святой»
  alternative: «Мудрость — Святой Дух»
  rationale: Сам стих олицетворяет мудрость и называет её духом, но не требует прямого догматического отождествления; перевод сохраняет эту напряжённость.
- issue: Кто является подлежащим при οὐκ ἀθῳώσει
  choice: «она», то есть мудрость
  alternative: Безличная формулировка или подразумеваемый Бог
  rationale: Ближайшее грамматическое подлежащее — σοφία; русский перевод делает связь явной лишь настолько, насколько этого требует грамматика языка.
- issue: Как передать антропологический образ νεφρῶν
  choice: «сокровенных глубин» с буквальным пояснением в сноске
  alternative: «почек» или «внутренних побуждений»
  rationale: Так сохраняется широта образа скрытого внутреннего человека без анатомической неясности и без сужения смысла до одних мотивов.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены судебная лексика, олицетворение мудрости и параллелизм: «свидетель — наблюдатель — слышащий».'
