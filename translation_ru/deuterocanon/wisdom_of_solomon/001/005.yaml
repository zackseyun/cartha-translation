base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/005.yaml
  text: For a holy spirit of discipline will flee deceit[a], and it will depart from senseless thoughts[c][b], and it will be rebuked when unrighteousness comes upon it.
translation:
  language: ru
  text: Ибо святой дух наставления[a] убежит от обмана, отступит от неразумных помыслов и будет обличён[b], когда наступит неправда[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Святой Дух наставления». В греческом выражение стоит без артикля и может пониматься качественно, а не как закреплённое имя собственное.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «будет изобличён», «будет уличён» или «будет посрамлён».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «когда наступит неправедность»; возможно также: «когда придёт несправедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅγιον ... πνεῦμα
  choice: святой дух
  rationale: Безартиклевая греческая конструкция допускает качественное понимание и не требует оформления как закреплённого имени собственного; строчная буква сохраняет эту открытость.
- source_word: παιδείας
  choice: наставления
  rationale: Слово охватывает обучение, воспитание и исправление. «Наставление» естественно по-русски и сохраняет нравственно-формирующий смысл.
- source_word: φεύξεται δόλον
  choice: бежит от обмана
  rationale: Настоящее время в русском уместно для выражения общего свойства, переданного греческим будущим; «бежит» сохраняет яркий образ решительного удаления, а «обман» передаёт широкий смысл δόλος.
- source_word: ἀπαναστήσεται ἀπὸ λογισμῶν ἀσυνέτων
  choice: удаляется от неразумных помыслов
  rationale: Глагол обозначает отход и отделение; «удаляется» звучит естественно, а «помыслы» передают внутренние рассуждения и замыслы λογισμοί.
- source_word: ἐλεγχθήσεται
  choice: будет обличён
  rationale: Пассивная форма сохранена. «Обличён» передаёт смысл выявления, изобличения или порицания, не устраняя трудность того, что грамматическим субъектом остаётся дух.
- source_word: ἐπελθούσης ἀδικίας
  choice: при наступлении неправды
  rationale: Генитив абсолютный передан обстоятельственным оборотом. «Неправда» сохраняет широкий нравственный смысл ἀδικία, не сужая его только до общественной несправедливости.
theological_decisions:
- issue: Следует ли понимать ἅγιον ... πνεῦμα как закреплённое имя «Святой Дух»
  choice: святой дух наставления
  alternative: Святой Дух наставления
  rationale: Отсутствие артикля и контекст эллинистической Премудрости позволяют качественное прочтение. Основной текст не вносит более позднюю терминологическую определённость, а возможное личностно-божественное прочтение отмечено в сноске.
- issue: Как передать ἀδικία
  choice: неправда
  alternative: неправедность; несправедливость
  rationale: «Неправда» достаточно широка для нравственного и религиозного контекста и сохраняет связь как с нечестием, так и с несправедливостью.
- issue: Нужно ли сглаживать пассив ἐλεγχθήσεται, поскольку его субъектом грамматически выступает святой дух
  choice: 'сохранить: «будет обличён»'
  alternative: отступит; обнаружится; будет посрамлён
  rationale: Буквальная пассивная конструкция создаёт подлинную смысловую трудность текста. Её не следует молча устранять заменой субъекта или активным глаголом; допустимые оттенки указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи, без архаических форм. Синтаксис остаётся ясным, но необычный пассив последней части намеренно не сглажен. Все сноски обозначены в основном тексте.
