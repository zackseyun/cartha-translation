  - severity: low
    issue: Оборот «при наступлении неправды» менее прозрачен, чем временное придаточное.
    rationale: Генитив абсолютный естественно передаётся конструкцией «когда наступит…»; это также лучше отражает ἐπελθούσης как наступление/приход события.
