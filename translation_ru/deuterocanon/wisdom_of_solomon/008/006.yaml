  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/006.yaml
  text: And if understanding is effective[b][a], who among existing things is more skillful than she?
translation:
  language: ru
  text: Если же рассудительность действует[a], кто среди всего существующего искуснее её[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трудится» или «производит». Греческий глагол может подчёркивать как деятельную работу, так и её результативность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «кто из существующих — мастерица в большей мере, чем она?» Греческое слово обозначает искусную мастерицу и продолжает женское олицетворение рассудительности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνησις
  choice: рассудительность
  rationale: Слово обозначает практическое разумение и здравую способность судить. «Рассудительность» сохраняет отличие от σοφία («мудрость») в ближайшем контексте и, будучи существительным женского рода, позволяет передать греческое олицетворение.
- source_word: ἐργάζεται
  choice: действует
  rationale: Глагол выражает деятельную работу и результативность. «Действует» естественно звучит по-русски, не сужая значение до одного лишь изготовления; производительный оттенок отмечен в сноске.
- source_word: τῶν ὄντων
  choice: среди всего существующего
  rationale: Передаёт широкий смысл буквально «среди сущих / того, что существует», но без излишне философского звучания.
- source_word: τεχνῖτις
  choice: искуснее
  rationale: В основном тексте сравнительное «искуснее» естественно передаёт мастерство, подразумеваемое существительным τεχνῖτις. Буквальный образ искусной мастерицы сохранён в сноске.
theological_decisions:
- issue: Женское олицетворение φρόνησις
  choice: Сохранить женский род посредством «рассудительность» и местоимения «её».
  alternative: Передать понятие существительным среднего рода и местоимением «оно».
  rationale: Греческие αὐτῆς и τεχνῖτις прямо поддерживают женское олицетворение; нейтрализация рода устранила бы значимую особенность исходного текста.
- issue: Соотношение φρόνησις и σοφία в контексте
  choice: Перевести φρόνησις как «рассудительность», а не «мудрость».
  alternative: Перевести как «мудрость», отождествив термин с центральным образом контекста.
  rationale: Исходный текст употребляет здесь не σοφία, а отдельное слово φρόνησις; лексическое различие сохранено без навязывания их полного отождествления.
translation_notes:
  register: Современный литературный русский язык с краткой риторической конструкцией. Формулировка сохраняет достоинство премудростной речи, женское олицетворение и широту выражения «всё существующее», избегая тяжеловесного буквализма в основном тексте.
