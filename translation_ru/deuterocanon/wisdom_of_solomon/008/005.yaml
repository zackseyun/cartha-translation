  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/005.yaml
  text: And if wealth is a desirable possession in life, what is richer than wisdom, which works all things?
translation:
  language: ru
  text: Если богатство — желанное приобретение в жизни, то что богаче мудрости, которая совершает всё?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которая производит всё»; греческое выражение имеет широкий смысл и подчёркивает действенность мудрости во всём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῦτός
  choice: богатство
  rationale: Прямой и естественный эквивалент, сохраняющий связь с последующим сравнительным «богаче».
- source_word: ἐπιθυμητὸν κτῆμα
  choice: желанное приобретение
  rationale: Передаёт как желательность, так и значение чего-либо обретённого; в современном русском звучит естественнее, чем буквальное «желанное владение».
- source_word: ἐν βίῳ
  choice: в жизни
  rationale: Кратко и точно обозначает сферу человеческой жизни, не добавляя отсутствующего в греческом указания «этой».
- source_word: τί σοφίας πλουσιώτερον
  choice: что богаче мудрости
  rationale: Сохраняет риторический вопрос и словесную связь πλοῦτος / πλουσιώτερον — «богатство / богаче».
- source_word: σοφίας
  choice: мудрости
  rationale: Устойчивый русский эквивалент ключевого для книги понятия σοφία.
- source_word: τῆς τὰ πάντα ἐργαζομένης
  choice: которая совершает всё
  rationale: «Совершает» естественно передаёт действенную силу ἐργάζομαι и сохраняет широту выражения, не ограничивая его значением творения или производства.
theological_decisions:
- issue: Объём деятельности мудрости в τὰ πάντα ἐργαζομένης
  choice: которая совершает всё
  alternative: которая производит всё; которая всё приводит в действие
  rationale: Формулировка сохраняет всеохватную действенность мудрости, но не уточняет, идёт ли речь о сотворении, устроении или достижении результата, поскольку сам греческий текст этого не определяет.
