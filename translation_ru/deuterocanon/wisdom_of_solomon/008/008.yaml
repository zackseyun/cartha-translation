revisions:
- from: Если же кто желает также и обширных познаний[a], она знает древнее и заключает о грядущем; понимает обороты речи и разгадки загадок; заранее знает знамения и чудеса, исходы времён и сроков.
  to: Если же кто-то жаждет даже большого опыта[a], она знает древнее и делает выводы о грядущем; понимает обороты речи и разгадки загадок; заранее знает знамения и чудеса, исходы сроков и времён.
