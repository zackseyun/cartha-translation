base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/008.yaml
  text: And if anyone longs even for much experience[a], she knows the things of old and can infer the things to come; she understands turns of speech and solutions to riddles[b]; she knows beforehand signs and wonders and the outcomes of seasons and times.
translation:
  language: ru
  text: Если же кто-то жаждет даже большого опыта[a], она знает древнее и делает выводы о грядущем; понимает обороты речи и разгадки загадок; заранее знает знамения и чудеса, исходы сроков и времён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богатого опыта», «обширного опыта», «широкой осведомлённости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολυπειρίαν
  choice: обширных познаний
  rationale: Слово обозначает широкий опыт и обширную осведомлённость; «познания» естественно сочетается с желанием приобрести их и не сужает смысл до одной учёности. Альтернативы указаны в примечании.
- source_word: ποθεῖ
  choice: желает
  rationale: Передаёт сильное стремление без излишне эмоционального или архаического оттенка.
- source_word: τὰ ἀρχαῖα
  choice: древнее
  rationale: Сохраняет широкое указание на дела и события давних времён, не сводя выражение только к первоначалам.
- source_word: τὰ μέλλοντα εἰκάζειν
  choice: заключает о грядущем
  rationale: εἰκάζειν означает делать вывод или предположение; формулировка сохраняет более слабую степень уверенности по сравнению с последующим προγινώσκει.
- source_word: στροφὰς λόγων
  choice: обороты речи
  rationale: Естественно передаёт словесные, смысловые или риторические повороты, не ограничивая выражение одной техникой аргументации.
- source_word: λύσεις αἰνιγμάτων
  choice: разгадки загадок
  rationale: Ясная современная передача буквального образа решения или развязывания загадок.
- source_word: σημεῖα καὶ τέρατα
  choice: знамения и чудеса
  rationale: Сохраняет устойчивую библейскую пару и различие между указующим знаком и необычайным явлением.
- source_word: προγινώσκει
  choice: заранее знает
  rationale: Прозрачно передаёт знание наперёд и отличается по силе от «заключает» в предыдущей части стиха.
- source_word: ἐκβάσεις
  choice: исходы
  rationale: Передаёт результаты или то, к чему приводят соответствующие периоды.
- source_word: καιρῶν καὶ χρόνων
  choice: времён и сроков
  rationale: 'Сохраняет два близких, но не тождественных временных понятия: χρόνοι как времена или периоды и καιροί как особые, подходящие либо назначенные сроки.'
theological_decisions:
- issue: Олицетворение Премудрости
  choice: Сохранено местоимение женского рода «она».
  alternative: Повторить «Премудрость» или передать её как безличное абстрактное понятие.
  rationale: Контекст представляет Премудрость как действующее лицо женского рода; грамматика русского языка естественно поддерживает это олицетворение, не требуя дополнительных онтологических выводов.
- issue: Сила значения εἰκάζειν
  choice: «заключает о грядущем»
  alternative: «предвидит будущее» или «предсказывает грядущее».
  rationale: Глагол допускает вывод или предположение на основании признаков и слабее, чем последующее προγινώσκει — «заранее знает»; различие внутри стиха сохранено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм греческого перечня сохранён; лексика доступна широкому читателю. «Премудрость» подразумевается контекстом и обозначена местоимением «она».
