  source_fidelity: В черновике «обширных познаний» существенно сужает πολυπειρίαν до знания/учёности. Греческое слово обозначает большой, богатый опыт. «Заключает о грядущем» в целом передаёт более осторожное εἰκάζειν, но современнее и яснее «делает выводы о грядущем». Порядок καιρῶν καὶ χρόνων следует сохранить как «сроков и времён».
  naturalness: «Желает также и обширных познаний» тяжеловесно и неестественно. Предлагаемый текст сохраняет умеренно возвышенный, но современный литературный строй. Повторение «она» оправдано параллелизмом перечисления и ясно удерживает женскую персонификацию Премудрости.
  terminology: «Знамения и чудеса», «обороты речи», «разгадки загадок» и «заранее знает» удачны. «Большой опыт» точно передаёт πολυπειρίαν и не подменяет опыт познаниями. Примечание исправлено согласно основному чтению и сохраняет допустимые лексические альтернативы.
