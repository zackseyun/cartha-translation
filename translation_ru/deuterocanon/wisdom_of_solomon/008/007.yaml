base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/007.yaml
  text: And if anyone loves righteousness[a], her labors are virtues; for she teaches self-control and prudence, righteousness and courage[b], than which nothing is more useful for human beings in life.
translation:
  language: ru
  text: И если кто любит праведность[a], труды её — добродетели, ибо она учит умеренности и благоразумию, праведности и мужеству[b]; и нет для людей в жизни ничего полезнее их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость». Греческое слово может означать как нравственную праведность, так и справедливость.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте праведность представлена в женском образе: «труды её… она учит».'
    reason: cultural_note
lexical_decisions:
- source_word: δικαιοσύνην
  choice: праведность
  rationale: Передаёт широкий смысл нравственной правоты; возможное значение «справедливость» сохранено в сноске.
- source_word: ἀγαπᾷ
  choice: любит
  rationale: Прямо сохраняет личную и нравственную силу греческого глагола, не ослабляя её до простого предпочтения.
- source_word: οἱ πόνοι ταύτης
  choice: труды её
  rationale: Близко передаёт буквальный смысл πόνοι и сохраняет женский образ; вариант «плоды её трудов» добавил бы отсутствующее в греческом значение результата.
- source_word: ἀρεταί
  choice: добродетели
  rationale: Естественное русское обозначение нравственных качеств, далее перечисленных в стихе.
- source_word: σωφροσύνην
  choice: умеренности
  rationale: В контексте перечня основных добродетелей обозначает самообладание и сдержанность; «умеренность» звучит естественно и не смешивается с последующим благоразумием.
- source_word: φρόνησιν
  choice: благоразумию
  rationale: Передаёт практическую рассудительность и хорошо соответствует стилю перечня добродетелей.
- source_word: ἀνδρείαν
  choice: мужеству
  rationale: Обозначает стойкую храбрость; это ясный и традиционный русский эквивалент без ограничения добродетели мужчинами.
- source_word: χρησιμώτερον
  choice: полезнее
  rationale: Прямо и естественно передаёт сравнительную степень со значением пользы.
- source_word: ἐν βίῳ ἀνθρώποις
  choice: для людей в жизни
  rationale: Сохраняет и адресата пользы, и жизненную сферу, выраженные дательным падежом и предложным оборотом.
theological_decisions:
- issue: Женское олицетворение праведности
  choice: Сохранить формы «её» и «она учит»
  alternative: 'Обезличить: «её труды» понимать лишь грамматически либо перестроить фразу без местоимений'
  rationale: Греческий текст продолжает женский образ δικαιοσύνη посредством ταύτης и подразумеваемого женского субъекта ἐκδιδάσκει; русская формулировка сохраняет литературную ткань текста, не превращая её в отдельное догматическое утверждение.
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В данном этическом контексте слово обозначает нравственную правоту в широком смысле; более узкое либо общественно-правовое прочтение «справедливость» остаётся возможным и отмечено в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством, свойственным изречению Премудрости. Синтаксис остаётся близким к греческому, но заключительная сравнительная конструкция перестроена естественно для русского: «полезнее их… нет ничего». Термины четырёх добродетелей переданы общеупотребительными словами без архаизации.'
