lexical_decisions:
- source_word: διοικήσω
  choice: буду управлять
  rationale: Будущее время διοικέω обозначает руководство и управление; этот вариант естественен в политическом контексте и не усиливает смысл до жесткого господства.
- source_word: λαούς
  choice: народами
  rationale: Множественное число сохраняет собирательный смысл греческого λαούς и позволяет отличить его от ἔθνη в следующей части.
- source_word: ἔθνη
  choice: племена
  rationale: Так сохраняется лексическое различие между λαούς и ἔθνη; в данном контексте речь идет о человеческих общностях, без привнесения религиозного значения «язычники».
- source_word: ὑποταγήσεταί
  choice: подчинятся
  rationale: Форма будущего пассивного/среднего залога допускает смысл вхождения в подчинение; русское возвратное «подчинятся» сохраняет эту неоднозначность лучше, чем явно принудительное «будут подчинены».
- source_word: μοι
  choice: мне
  rationale: Дательный падеж прямо выражает того, кому будут подчиняться.
