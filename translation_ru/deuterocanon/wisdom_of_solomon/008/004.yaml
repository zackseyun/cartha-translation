lexical_decisions:
- source_word: μύστις
  choice: посвящена
  rationale: Слово обозначает посвящённую в тайны. Предикативная форма «посвящена» естественна по-русски и сохраняет мысль о допуске к сокровенному знанию, не внося поздних ассоциаций слова «мистик».
- source_word: ἐπιστήμης
  choice: знание
  rationale: Прямое и современное соответствие со значением знания или понимания; сочетание «Божие знание» не снимает полностью возможного оттенка как знания, принадлежащего Богу, так и знания о Нём.
- source_word: αἱρέτις
  choice: избирает
  rationale: Редкое существительное женского рода связано с выбором. Глагольная передача звучит естественнее по-русски, сохраняя основное значение и не устраняя возможного оттенка одобрения.
- source_word: ἔργων
  choice: дела
  rationale: «Дела» охватывает как действия Бога, так и совершаемое Им и является обычным русским соответствием.
- source_word: γάρ
  choice: ведь
  rationale: «Ведь» естественно передаёт пояснительно-причинную связь с предыдущим высказыванием.
theological_decisions:
- issue: Передача μύστις в религиозно-философском контексте
  choice: посвящена в Божие знание
  alternative: таинница Божия знания; посвящённая в знание Бога
  rationale: Выбранная формулировка выражает особый доступ Премудрости к божественному знанию, не называя её «мистиком» и не привнося более поздних богословских ассоциаций.
- issue: Передача αἱρέτις τῶν ἔργων αὐτοῦ
  choice: избирает Его дела
  alternative: одобряет Его дела
  rationale: Греческое выражение редкое и сжатое. Основной текст сохраняет значение выбора, а примечание отмечает возможный смысл рассудительного одобрения, не разрешая неоднозначность без достаточных оснований.
translation_notes:
