base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/009.yaml
  text: So I decided to take her to live with me[a], knowing that she would be a counselor of good things for me[b], and a comfort in cares and grief.
translation:
  language: ru
  text: Итак, я решил взять её к себе для совместной жизни[a], зная, что она будет мне советницей в добром и ободрением[b] в заботах и печали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жениться на ней», «взять её в жёны». Буквально по-гречески: «взять её для совместной жизни»; здесь продолжается образ олицетворённой Премудрости, но прямого обозначения брака в этом стихе нет.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «увещанием», «наставлением»; в данном контексте возможно также «утешением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα τοίνυν
  choice: Итак, я решил
  rationale: ἔκρινα выражает принятое, твёрдое решение, а τοίνυν связывает его как вывод с предшествующим рассуждением. Современное «решил» естественно передаёт смысл без излишней книжности.
- source_word: ταύτην
  choice: её
  rationale: Местоимение указывает на олицетворённую Премудрость; женский род сохраняется в русском естественным образом.
- source_word: ἀγαγέσθαι πρὸς συμβίωσιν
  choice: взять её к себе, чтобы жить вместе
  rationale: Оборот означает привести или взять кого-либо для совместной жизни. Перевод сохраняет бытовой и личностный образ, но не вводит прямо отсутствующие здесь слова «жениться» или «взять в жёны».
- source_word: εἰδὼς
  choice: зная
  rationale: Причастие указывает на основание принятого решения; русская форма сохраняет структуру и причинный оттенок греческого текста.
- source_word: ἔσται μοι σύμβουλος ἀγαθῶν
  choice: она будет мне советницей в добром
  rationale: σύμβουλος — «советник, советница», а широкое ἀγαθῶν относится к благому или доброму, не ограничивая смысл только нравственными либо практическими вопросами.
- source_word: παραίνεσις
  choice: ободрением
  rationale: Слово допускает значения наставления, увещания и ободрения. В сочетании с заботами и печалью «ободрение» естественно передаёт поддерживающую сторону значения, не сводя его полностью к утешению.
- source_word: φροντίδων καὶ λύπης
  choice: в заботах и печали
  rationale: φροντίδων обозначает тягостные заботы или тревоги, а λύπης — печаль, скорбь или душевную боль. Предлог «в» естественно выражает обстоятельства, среди которых Премудрость служит ободрением.
theological_decisions:
- issue: Следует ли передавать образ совместной жизни как прямое указание на брак
  choice: взять её к себе, чтобы жить вместе
  alternative: жениться на ней / взять её в жёны
  rationale: Контекст использует брачно-семейный образ олицетворённой Премудрости, однако в самом стихе сказано буквально о совместной жизни, без обычного прямого обозначения брака. Основной текст сохраняет эту смысловую открытость, а брачное прочтение отмечено в сноске.
- issue: Смысл παραίνεσις рядом с заботами и печалью
  choice: ободрением
  alternative: увещанием / наставлением / утешением
  rationale: Греческое слово имеет как наставительный, так и поддерживающий оттенок. Контекст забот и печали благоприятствует «ободрению», но прочие лексически допустимые значения не исключаются и приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, но без архаизации. Женский род поддерживает олицетворение Премудрости. Формулировка «советницей в добром» намеренно сохраняет широту греческого ἀγαθῶν, а «взять её к себе, чтобы жить вместе» — неоднозначность образа совместной жизни.
