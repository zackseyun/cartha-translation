    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθήσονταί με
  choice: убоятся меня
  rationale: Будущая форма φοβέομαι с прямым дополнением означает, что тираны станут бояться говорящего. «Убоятся меня» сохраняет прямоту и достойный библейский регистр, оставаясь понятным современному читателю.
- source_word: ἀκούσαντες
  choice: услышав обо мне
  rationale: Аористное причастие выражает предшествующее или сопутствующее обстоятельство. Добавление «обо мне» делает фразу естественной по-русски; поскольку в греческом объект не выражен, это уточнение отмечено сноской.
- source_word: τύραννοι φρικτοί
  choice: грозные тираны
  rationale: 'φρικτοί характеризует самих тиранов как внушающих страх, устрашающих. «Грозные» естественно передаёт этот оттенок и сохраняет смысловую игру: те, кто страшен другим, сами убоятся.'
- source_word: ἐν πλήθει
  choice: среди множества людей
  rationale: Передаёт широкое собирательное значение πλήθος и публичную обстановку, не сужая её до формального собрания.
- source_word: φανούμαι
  choice: я предстану
  rationale: Форма от φαίνω обозначает явление или восприятие. «Предстану» естественно сочетается с публичным контекстом и не решает окончательно, идёт ли речь о проявлении качества или о чужой оценке.
- source_word: ἀγαθὸς
  choice: добрым
  rationale: Сохраняет широкий смысл ἀγαθός — от нравственной доброты до благородства и благодетельности правителя; возможный контекстуальный оттенок пояснён в сноске.
- source_word: ἐν πολέμῳ ἀνδρεῖος
  choice: на войне — мужественным
  rationale: ἀνδρεῖος обозначает храбрость и доблесть. «Мужественным» передаёт традиционное название добродетели без дополнительного толкования.
theological_decisions:
- issue: Сочетание общественной добродетели и воинской храбрости говорящего
  choice: 'Сохранено непосредственное сопоставление: среди людей говорящий предстанет добрым, а на войне — мужественным.'
  alternative: Истолковать стих как развёрнутое описание идеального мудрого царя, благодетельного в управлении и доблестного в бою.
  rationale: Греческий текст допускает царский контекст, но сам стих лишь сополагает публичную доброту и воинское мужество. Перевод не превращает это сопоставление в более широкую политическую или богословскую концепцию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Убоятся» и «предстану» поддерживают достоинство речи, не делая её архаичной; параллелизм двух частей стиха сохранён.
