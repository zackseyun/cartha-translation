lexical_decisions:
- source_word: ταῦτα λογισάμενος
  choice: Обдумав всё это
  rationale: Аористное причастие передаёт внутреннее рассуждение; «обдумав» естественно выражает вдумчивое рассмотрение.
- source_word: ἐν ἐμαυτῷ
  choice: про себя
  rationale: Оборот обозначает внутреннее размышление; «про себя» ясно и естественно передаёт этот смысл.
- source_word: φροντίσας ἐν καρδίᾳ μου
  choice: и поразмыслив в сердце своём
  rationale: Сохраняется параллелизм с первым причастием и библейский образ сердца как средоточия размышления.
- source_word: ὅτι ἐστιν ἀθανασία
  choice: что … бессмертие
  rationale: ἀθανασία прямо означает «бессмертие»; именная конструкция в русском позволяет естественно соединить её с предложным оборотом.
- source_word: ἐν συγγενείᾳ σοφίας
  choice: в родстве с мудростью
  rationale: συγγένεια означает родство, близость или сродство. «В родстве с мудростью» сохраняет семейно-реляционный образ и не превращает связь в явно причинную.
theological_decisions:
- issue: Характер связи бессмертия с мудростью в выражении ἐν συγγενείᾳ σοφίας
  choice: в родстве с мудростью — бессмертие
  alternative: через сродство с мудростью обретается бессмертие
  rationale: Греческий текст утверждает наличие бессмертия в связи, обозначенной ἐν и существительным συγγένεια, но прямо не формулирует причинный механизм. Перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «в родстве с мудростью — бессмертие» сохраняет экзистенциальность и неоднозначность греческой конструкции.
