base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/021.yaml
  text: 'But knowing that I would not otherwise be self-controlled unless God gave it—and that this also was insight[a], to know whose gift it was—I appealed to the Lord and implored him, and I said with my whole heart:'
translation:
  language: ru
  text: 'Но, поняв, что иначе я не смогу владеть собой, если Бог не даст мне этого, — и само это знание, чей это дар[a], было признаком разумения, — я обратился к Господу, умолял Его и сказал от всего сердца:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чья это благодать (милость)». Греческое χάρις может означать «благодать», «милость» или «дар»; здесь имеется в виду, что самообладание исходит от Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: поняв
  rationale: Аористное причастие обозначает осознание, которое побудило говорящего к молитве; «поняв» естественно передаёт этот переход.
- source_word: οὐκ ἄλλως ἔσομαι ἐγκρατής
  choice: иначе я не смогу владеть собой
  rationale: Фраза подчёркивает невозможность самообладания без Божьего дара. «Владеть собой» ясно передаёт нравственное господство над желаниями и страстями.
- source_word: ἐὰν μὴ ὁ θεὸς δῷ
  choice: если Бог не даст мне этого
  rationale: Условная конструкция выражает необходимое условие; подразумеваемое дополнение раскрыто местоимением «этого», относящимся к самообладанию.
- source_word: καὶ τοῦτο δὲ ἦν φρονήσεως
  choice: и уже само знание … было проявлением разумения
  rationale: φρόνησις здесь означает рассудительное понимание. Перестройка фразы делает русское предложение естественным, сохраняя мысль, что распознание источника дара само свидетельствует о разумении.
- source_word: τὸ εἰδέναι τίνος ἡ χάρις
  choice: знание, чей это дар
  rationale: χάρις в контексте обозначает дарованное Богом благо; «дар» не вносит позднейшего узкотехнического смысла, а «чей» сохраняет указание на источник.
- source_word: ἐνέτυχον τῷ κυρίῳ
  choice: я обратился к Господу
  rationale: В молитвенном контексте ἐντυγχάνω означает обратиться с прошением; русский оборот естественен и не дублирует следующее «стал молить».
- source_word: ἐδεήθην αὐτοῦ
  choice: стал молить Его
  rationale: Передаёт настойчивую, искреннюю просьбу, выраженную глаголом δέομαι.
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: от всего сердца
  rationale: Устойчивое современное русское выражение, точно передающее полноту искренности и преданности.
theological_decisions:
- issue: Передача χάρις как «дар» или «благодать»
  choice: дар
  alternative: благодать; милость
  rationale: В данном контексте речь идёт о самообладании как о конкретном благе, полученном от Бога. «Дар» сохраняет эту конкретность и не сужает смысл до позднейшего богословского термина; лексическая неоднозначность отмечена в сноске.
- issue: Передача κύριος в обращении к Богу
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — естественное и традиционное соответствие κύριος в молитвенном контексте; непосредственный контекст не требует иного варианта.
- issue: Связь самообладания с Божьим даром
  choice: сохранена как необходимое условие
  alternative: ослабить до общей помощи Бога
  rationale: Греческое οὐκ ἄλλως … ἐὰν μή прямо утверждает, что говорящий не сможет владеть собой, если Бог не даст этого; перевод не смягчает богословское напряжение между человеческой добродетелью и Божьим даром.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-повествовательной речи. Синтаксис слегка перестроен ради ясности, но логика греческого текста и переход к молитве в следующей главе сохранены; двоеточие передаёт продолжение речи.
