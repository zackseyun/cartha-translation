  text: Her nobility is glorified by living together with God[a], and the Master of all loved her.
translation:
  language: ru
  text: Жизнь вместе с Богом[a] прославляет её благородство, и Владыка всего возлюбил её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совместная жизнь с Богом». Греческое слово συμβίωσις может означать совместную жизнь, близкое общение или пребывание вместе.'
    reason: Сохранение смыслового диапазона συμβίωσις.
lexical_decisions:
- source_word: εὐγένειαν
  choice: благородство
  rationale: Слово может обозначать знатное происхождение или благородное достоинство. «Благородство» сохраняет эту широту и уместно в описании персонифицированной Премудрости.
- source_word: δοξάζει
  choice: прославляет
  rationale: Передаёт активную форму греческого глагола и сохраняет εὐγένειαν как его прямое дополнение.
- source_word: συμβίωσις θεοῦ ἔχουσα
  choice: разделяя жизнь с Богом
  rationale: συμβίωσις обозначает совместную жизнь или близкое общение; причастие ἔχουσα относится к персонифицированной Премудрости. Формулировка передаёт конкретный образ общей жизни естественным русским языком.
- source_word: ὁ πάντων δεσπότης
  choice: Владыка всего
  rationale: «Владыка» сохраняет значение δεσπότης — господин, повелитель — и отличает его от обычной передачи κύριος словом «Господь».
- source_word: ἠγάπησεν αὐτήν
  choice: возлюбил её
  rationale: Аорист передан прошедшим временем, а местоимение женского рода сохраняет персонификацию Премудрости.
theological_decisions:
- issue: Персонификация Премудрости
  choice: Сохранено личное местоимение женского рода «её», а подразумеваемое подлежащее передано как «она».
  alternative: Передать Премудрость безлично как отвлечённое качество.
  rationale: Греческие формы женского рода представляют Премудрость как женский персонаж; перевод сохраняет этот литературно-богословский образ, не отождествляя её с какой-либо иной фигурой.
- issue: Синтаксис первой части стиха
  choice: 'Активная конструкция: «Она прославляет своё благородство».'
  alternative: 'Пассивная конструкция: «Её благородство прославляется совместной жизнью с Богом».'
  rationale: Форма δοξάζει активна, εὐγένειαν имеет форму винительного падежа, а ἔχουσα естественно согласуется с подразумеваемой Премудростью. Активное прочтение лучше отражает греческий синтаксис, хотя смысловой результат близок пассивной передаче.
- issue: Божественный титул δεσπότης
  choice: «Владыка», а не «Господь».
  alternative: «Господь всего» или «Повелитель всего».
  rationale: Так сохраняется различие между δεσπότης и κύριος без привнесения особого конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной лексикой. «Возлюбил» и «Владыка» поддерживают достоинство поэтического контекста; конструкция «разделяя жизнь с Богом» естественно передаёт образ совместной жизни.
