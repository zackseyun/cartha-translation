  text: And as a young man I will have glory among crowds[a], and honor before elders,
translation:
  language: ru
  text: Будучи молодым, я обрету славу среди множества людей[a] и почёт у старейшин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я, молодой, буду славен среди толп и удостоюсь почёта у старейшин». Греческая фраза ὁ νέος сжата и допускает передачу как «молодой человек», «будучи молодым» или «хотя я молод».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕξω
  choice: я обрету
  rationale: Будущее время от ἔχω означает будущее обладание или приобретение; «обрету» естественно передаёт достижение общественного признания.
- source_word: δόξαν
  choice: славу
  rationale: δόξα здесь обозначает славу, известность и доброе имя; «слава» сохраняет возвышенный регистр и общественный оттенок.
- source_word: ἐν ὄχλοις
  choice: среди множества людей
  rationale: ὄχλοι — толпы, множества людей; выбранная формулировка звучит естественно по-русски и передаёт широкое общественное признание.
- source_word: τιμήν
  choice: почёт
  rationale: τιμή означает честь, почёт или уважение; «почёт» хорошо выражает признание, оказываемое старейшинами.
- source_word: παρὰ πρεσβυτέροις
  choice: у старейшин
  rationale: παρά с дательным может указывать на оценку или признание со стороны лиц; «у старейшин» сохраняет эту возможность, не делая её чрезмерно явной.
- source_word: ὁ νέος
  choice: будучи молодым
  rationale: Формально это субстантивированное «молодой», относящееся к говорящему; оборот «будучи молодым» естественно передаёт возрастной статус и подчёркивает необычность почёта у старейшин.
