  text: Rather[a], being good, I came into an undefiled body.
translation:
  language: ru
  text: Вернее, будучи добрым, я пришёл в неосквернённое тело.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я вошёл в неосквернённое тело». Греческий глагол буквально означает «пришёл», но в данном контексте его можно понимать как вхождение в телесную жизнь.'
    reason: Лексический вариант, поясняющий контекстуально возможное значение глагола ἦλθον.
lexical_decisions:
- source_word: μᾶλλον δὲ
  choice: Вернее
  rationale: Оборот уточняет и корректирует предыдущее высказывание; «вернее» естественно передаёт эту функцию по-русски.
- source_word: ἀγαθὸς ὢν
  choice: будучи добрым
  rationale: Прямо передаёт нравственную характеристику говорящего, не усиливая её до более истолковывающего «добродетельным».
- source_word: ἦλθον
  choice: я пришёл
  rationale: Сохраняет обычное значение аориста ἔρχομαι и не вводит прямо не выраженную глаголом идею вселения или предсуществования.
- source_word: εἰς σῶμα
  choice: в тело
  rationale: Передаёт направленность εἰς и не добавляет определённости, отсутствующей в греческом; русский язык здесь естественно допускает существительное без артиклевого уточнения.
- source_word: ἀμίαντον
  choice: неосквернённое
  rationale: Сохраняет значение незапятнанности и оттенок ритуально-нравственной чистоты, характерный для ἀμίαντος.
theological_decisions:
- issue: Возможный намёк на предсуществование души или её вхождение в тело
  choice: Передать высказывание буквально как «я пришёл в неосквернённое тело», не разрешая антропологическую неоднозначность.
  alternative: Истолковать как «я вошёл в неосквернённое тело» либо как образное описание рождения с чистой природой.
  rationale: Греческий текст говорит о приходе в тело, но сам по себе не разъясняет, предполагается ли предсуществование. Перевод должен сохранить эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Мужской род «добрым» и «пришёл» следует грамматической форме греческого текста; неоднозначность высказывания намеренно сохранена.
