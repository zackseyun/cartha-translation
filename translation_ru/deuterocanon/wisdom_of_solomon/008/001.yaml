  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/001.yaml
  text: But she reaches mightily from one end to the other[a], and she governs all things well.
translation:
  language: ru
  text: Она же с силой простирается от края до края[a] и хорошо управляет всем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могущественно достигает от одного края до другого».'
    reason: 'Лексическая альтернатива: διατείνει может быть понято как «достигает», а εὐρώστως — как «могущественно».'
lexical_decisions:
- source_word: διατείνει
  choice: простирается
  rationale: Глагол передаёт протяжённость и действие по всему пространству; «простирается» сохраняет исходный образ, не усиливая его до более толковательного «пронизывает».
- source_word: ἀπὸ πέρατος εἰς πέρας
  choice: от края до края
  rationale: Естественное русское выражение, передающее полный охват — от одной крайней границы до другой.
- source_word: εὐρώστως
  choice: с силой
  rationale: Наречие выражает силу, мощь и действенность. Оборот «с силой» понятен современному читателю и сохраняет смысл без излишней архаизации.
- source_word: διοικεῖ
  choice: управляет
  rationale: Глагол означает управлять, устраивать или направлять; «управляет» ясно передаёт деятельное устроение всего сущего.
- source_word: τὰ πάντα
  choice: всем
  rationale: Местоименная форма естественно передаёт всеохватность греческого выражения и хорошо сочетается с глаголом «управляет».
- source_word: χρηστῶς
  choice: благотворно
  rationale: Слово может обозначать хорошее, доброе и благожелательное осуществление действия. «Благотворно» сохраняет как качество управления, так и оттенок блага, не сводя смысл лишь к умелости.
- source_word: δὲ
  choice: же
  rationale: Частица продолжает рассуждение и может иметь лёгкий оттенок сопоставления; русское «же» естественно связывает стих с предыдущим контекстом.
- source_word: implicit feminine subject (Wisdom)
  choice: она
  rationale: Подразумеваемое подлежащее относится к персонифицированной Премудрости женского рода; местоимение сохраняет эту литературную персонификацию.
theological_decisions:
- issue: Персонификация Премудрости
  choice: Сохранить женское личное местоимение «она».
  alternative: Повторить существительное «Премудрость», чтобы ослабить впечатление самостоятельной личности.
  rationale: Греческий контекст представляет Премудрость как действующий субъект женского рода. Местоимение передаёт эту персонификацию, не разрешая вопрос о её онтологическом или позднейшем догматическом понимании.
- issue: Характер управления Премудрости
  choice: Передать χρηστῶς как «благотворно».
  alternative: 'Передать нейтральнее: «хорошо» или «умело».'
  rationale: Греческое наречие допускает как оценку надлежащего управления, так и оттенок доброты и благотворности. Выбор сохраняет положительную богословскую окраску, не уточняя, каким именно образом осуществляется это благо.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом, соответствующим книге Премудрости. Формулировка сохраняет пространственный образ, женскую персонификацию Премудрости и смысл её сильного, благого управления.
