  text: When I am silent[a], they will wait for me, and when I speak, they will pay attention; and when I speak at greater length, they will lay a hand on their mouth.
translation:
  language: ru
  text: Когда я молчу, они будут ждать меня; когда я заговорю, будут внимать мне; а когда я буду говорить дольше, они положат руку на уста[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Жест «положить руку на уста» означает молчание, сдержанность или почтительное изумление перед говорящим.
    reason: cultural_note
lexical_decisions:
- source_word: σιγῶντά με
  choice: когда я молчу
  rationale: Причастный оборот передан естественным русским придаточным времени; настоящее время сохраняет обобщённый характер высказывания.
- source_word: περιμενοῦσιν
  choice: будут ждать меня
  rationale: Глагол означает «ждать, ожидать»; дополнение με сохранено явно, без добавления отсутствующего в греческом слова «речь».
- source_word: φθεγγομένῳ προσέξουσιν
  choice: когда я заговорю, будут внимать мне
  rationale: φθέγγομαι обозначает произнесение речи, а προσέχω — сосредоточенное внимание; «внимать» кратко и достойно передаёт внимательное слушание.
- source_word: λαλοῦντος ἐπὶ πλεῖον
  choice: когда я стану говорить дольше
  rationale: Конструкция указывает не на условие, а на продолжение речи в течение большего времени; временная связь сохранена.
- source_word: χεῖρα ἐπιθήσουσιν ἐπὶ στόμα αὐτῶν
  choice: они приложат руку к устам
  rationale: Сохранён буквальный образ общепринятого жеста молчания или почтительного сдерживания; русское «к устам» естественно передаёт греческую конструкцию.
