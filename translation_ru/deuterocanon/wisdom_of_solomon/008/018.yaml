base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/018.yaml
  text: And in her friendship there is good delight[a], and in the labors of her hands, unfailing wealth, and in companionship with her, prudence, and honor in sharing her words[c][b]. I went about seeking how I might take her to myself.
translation:
  language: ru
  text: И в дружбе с ней — добрая радость, в трудах её рук — неиссякаемое богатство, в совместном упражнении и общении с ней — благоразумие[a], а в приобщении к её словам — доброе имя[b]. Я повсюду искал, как принять её к себе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение можно также передать: «в совместном обучении через общение с ней». Оно соединяет представления о совместном упражнении, дисциплине и близком общении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слава», «почёт»; греческое слово означает доброе имя и уважение в глазах людей.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обрести её для себя». Выражение подчёркивает личное принятие олицетворённой Премудрости, но само по себе не уточняет, идёт ли речь о брачном образе, приобретении или внутреннем усвоении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλίᾳ αὐτῆς
  choice: в дружбе с ней
  rationale: Передаёт отношения с олицетворённой Премудростью, не придавая им излишне романтического оттенка.
- source_word: τέρψις ἀγαθή
  choice: добрая радость
  rationale: Сохраняет как значение удовольствия и отрады, так и явную положительную нравственную оценку ἀγαθή.
- source_word: πόνοις χειρῶν αὐτῆς
  choice: в трудах её рук
  rationale: Сохраняет конкретный образ рук и значение напряжённого, плодотворного труда.
- source_word: πλοῦτος ἀνεκλιπής
  choice: неиссякаемое богатство
  rationale: Естественно передаёт богатство, которое не оскудевает и не прекращается.
- source_word: συγγυμνασίᾳ ὁμιλίας αὐτῆς
  choice: в совместном упражнении и общении с ней
  rationale: Греческое выражение сжато соединяет совместное упражнение, дисциплину и близкое общение; перевод удерживает обе смысловые стороны, не сводя их только к беседе.
- source_word: φρόνησις
  choice: благоразумие
  rationale: Передаёт практическую, нравственно направленную рассудительность и избегает тавтологии со словом «Премудрость».
- source_word: εὔκλεια
  choice: доброе имя
  rationale: Термин обозначает почётную, добрую общественную репутацию; «доброе имя» точнее этого оттенка, чем общее «честь».
- source_word: κοινωνίᾳ λόγων αὐτῆς
  choice: в приобщении к её словам
  rationale: «Приобщение» выражает участие и сопричастность, а «слова» сохраняют словесное содержание λόγων без преждевременного сведения его к формальным учениям.
- source_word: περιῆλθον ζητῶν
  choice: я повсюду искал
  rationale: Естественная русская формулировка передаёт деятельный и настойчивый поиск, подразумеваемый глаголом движения с причастием.
- source_word: ὅπως λάβω αὐτὴν εἰς ἐμαυτόν
  choice: как принять её к себе
  rationale: Сохраняет личную направленность и образ принятия олицетворённой Премудрости, не делая выражение однозначно брачным или чисто приобретательным.
theological_decisions:
- issue: Олицетворение Премудрости
  choice: Сохранить женский род и говорить о личных отношениях с ней.
  alternative: Передать Премудрость только как отвлечённое качество без личных местоимений.
  rationale: Греческий текст последовательно использует местоимения женского рода и язык дружбы, общения и принятия к себе.
- issue: Смысл принятия Премудрости «к себе»
  choice: Сохранить личный, но не уточнённый образ принятия.
  alternative: Истолковать выражение прямо как брак либо исключительно как интеллектуальное усвоение.
  rationale: Контекст допускает такие ассоциации, однако сам стих не требует выбрать только одну из них.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Параллельная структура греческого перечня сохранена с помощью тире; редкое и сжатое выражение συγγυμνασίᾳ ὁμιλίας раскрыто минимально и снабжено примечанием. Написание «Премудрость» предполагается из контекста персонификации, хотя в самом стихе существительное не повторяется.
