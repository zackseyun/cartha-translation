base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/011.yaml
  text: I will be found keen in judgment[b][a], and in the sight of rulers I will be admired.
translation:
  language: ru
  text: Я окажусь проницательным в суждении[a] и перед правителями[b] буду вызывать восхищение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «острым в суждении». Греческое прилагательное буквально означает «острый» и здесь говорит об остроте ума.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на виду у властителей»; греческое выражение может подчёркивать присутствие и публичность оценки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξεῖς
  choice: проницательным
  rationale: Буквально прилагательное означает «острый»; применительно к суждению оно указывает на остроту ума и способность тонко разбираться, что естественно передаёт «проницательный».
- source_word: εὑρεθήσομαι
  choice: я окажусь
  rationale: Будущая пассивная форма допускает буквальное «буду найден», но здесь идиоматически означает «окажусь, проявлю себя», при этом субъект оценки остаётся не назван.
- source_word: ἐν κρίσει
  choice: в суждении
  rationale: κρίσις может означать суждение, решение или судебное разбирательство. Общее «в суждении» сохраняет смысловую широту и не сводит выражение исключительно к суду.
- source_word: ἐν ὄψει
  choice: перед
  rationale: Выражение буквально означает «на виду у» и указывает на присутствие или публичную оценку; русское «перед» передаёт это естественно.
- source_word: δυναστῶν
  choice: правителями
  rationale: δυνάστης обозначает обладающего властью; «правители» ясно и современно передаёт политико-общественный контекст.
- source_word: θαυμασθήσομαι
  choice: буду вызывать восхищение
  rationale: Пассивная форма означает стать предметом удивления или восхищения. Эта конструкция естественна по-русски и сохраняет положительную оценочную окраску.
