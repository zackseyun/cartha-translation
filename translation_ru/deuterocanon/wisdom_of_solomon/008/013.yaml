  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/013.yaml
  text: And through her I will have immortality[b][a], and I will leave behind an everlasting remembrance to those after me.
translation:
  language: ru
  text: И я обрету само бессмертие[b] и оставлю после себя вечную память у тех, кто придёт после меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «Бессмертие» может пониматься как личная неподвластность смерти или, в связи со следующей частью стиха, как непреходящая память; греческий текст не устраняет этой многозначности.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕξω
  choice: я буду иметь
  rationale: Будущее время от ἔχω прямо выражает обладание; перевод не добавляет идеи приобретения, которая была бы сильнее выражена в варианте «обрету».
- source_word: δὲ
  choice: и
  rationale: Здесь частица служит мягкой связкой в перечислении благ, связанных с Премудростью, и не требует сильного противопоставления «но».
- source_word: αὐτὴν
  choice: с нею
  rationale: Местоимение женского рода отсылает к олицетворённой Премудрости. «С нею» естественно по-русски сохраняет личностный образ и не сводит не вполне определённую связь исключительно к средству или причине.
- source_word: ἀθανασίαν
  choice: бессмертие
  rationale: Прямой и общепонятный русский эквивалент, сохраняющий возможность как буквального, так и связанного с непреходящей памятью прочтения.
- source_word: μνήμην αἰώνιον
  choice: вечную память
  rationale: Устойчивое и точное сочетание, передающее долговечную память или славу; оборот «оставлю по себе» делает фразу естественной в современном русском языке.
- source_word: τοῖς μετʼ ἐμὲ
  choice: тем, кто будет после меня
  rationale: Передаёт греческий дательный и указание на последующие поколения без книжного обобщения «потомкам».
- source_word: ἀπολείψω
  choice: оставлю по себе
  rationale: Передаёт значение «оставить после себя» применительно к памяти и звучит естественно по-русски.
theological_decisions:
- issue: Смысл «бессмертия» в связи с олицетворённой Премудростью
  choice: Сохранить слово «бессмертие», не ограничивая его ни личным неумиранием, ни одной лишь посмертной славой.
  alternative: Понять выражение только как продолжение жизни в памяти последующих поколений либо только как буквальную вечную жизнь.
  rationale: Соседство «бессмертия» и «вечной памяти» допускает связь между ними, но текст не отождествляет их явно; перевод сохраняет эту богословскую напряжённость.
- issue: Характер связи между Премудростью и бессмертием
  choice: Передать как «с нею», сохраняя ассоциативность и олицетворение.
  alternative: «Благодаря ей» или «через неё», что яснее выражало бы причинный либо инструментальный смысл.
  rationale: Форма местоимения в представленном греческом тексте не выражает отношение однозначным предлогом, поэтому основной перевод не должен чрезмерно уточнять его.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; олицетворение Премудрости и смысловая открытость слова «бессмертие» сохранены.
