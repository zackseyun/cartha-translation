  text: I loved her and sought her out from my youth[a], and I sought to take her as my bride, and I became a lover of her beauty.
translation:
  language: ru
  text: Я полюбил её и искал её с юности; я искал взять её себе в невесты и влюбился в её красоту.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταύτην
  choice: её
  rationale: Местоимение указывает на олицетворённую Премудрость; женский род сохраняет олицетворение и естественно звучит по-русски.
- source_word: ἐφίλησα
  choice: полюбил
  rationale: В данном контексте глагол выражает любовь и привязанность, а не буквальный поцелуй.
- source_word: ἐξεζήτησα ἐκ νεότητός μου
  choice: искал с юности
  rationale: Передаёт продолжительное, целенаправленное искание начиная с юных лет; приставочное усиление глагола естественно выражается контекстом.
- source_word: ἐζήτησα νύμφην ἀγαγέσθαι ἐμαυτῷ
  choice: стремился взять её себе в невесты
  rationale: Сохраняет повтор мотива искания/стремления, брачный образ и возвратное ἐμαυτῷ без неестественной буквальности.
- source_word: ἐραστὴς ἐγενόμην
  choice: стал пленённым
  rationale: Передаёт сильное любовное влечение в возвышенном современном русском и избегает возможного сниженного или преимущественно сексуального оттенка слова «любовник».
- source_word: τοῦ κάλλους αὐτῆς
  choice: её красотой
  rationale: κάλλος прямо обозначает красоту; творительный падеж естественно сочетается с «пленённым» и сохраняет предмет влечения.
theological_decisions:
- issue: Олицетворение Премудрости в брачно-любовных образах
  choice: Сохранить женский род, образ невесты и сильное любовное влечение
  alternative: Передать отвлечённо как стремление ценить достоинства мудрости
  rationale: Греческий текст явно представляет Премудрость женщиной и использует язык ухаживания и брака; смягчение образа устранило бы существенную поэтическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и лёгкой поэтической приподнятостью. Повтор греческого ζητέω передан близкими, но не одинаковыми словами ради естественности; брачная метафора сохранена явно.
