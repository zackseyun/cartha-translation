  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/016.yaml
  text: When I go into my house[a], I will find rest beside her; for her company has no bitterness, nor does living with her have pain, but gladness and joy.
translation:
  language: ru
  text: Войдя в свой дом, я отдохну рядом с ней[a], потому что в общении с ней нет горечи и в совместной жизни с ней нет страдания, но лишь веселье и радость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдохну с ней». Греческий глагол подразумевает покой в близком общении с Премудростью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν εἰς τὸν οἶκόν μου
  choice: Войдя в свой дом
  rationale: Аористное причастие передаёт обстоятельство, предшествующее главному действию; деепричастная конструкция естественна по-русски и близка греческой форме.
- source_word: προσαναπαύσομαι αὐτῇ
  choice: я отдохну рядом с ней
  rationale: Будущая средняя форма обозначает отдых в близком присутствии Премудрости; «рядом с ней» передаёт оттенок приставки προς-, не исключая смысла «вместе с ней».
- source_word: συναναστροφή
  choice: общение
  rationale: Слово обозначает пребывание в обществе кого-либо и взаимное общение; выбран современный и естественный русский эквивалент.
- source_word: πικρίαν
  choice: горечи
  rationale: Сохраняет образную и эмоциональную силу греческого слова, обозначающего неприятность или горечь.
- source_word: συμβίωσις
  choice: совместной жизни
  rationale: Передаёт буквальный смысл общей жизни, не внося современных побочных оттенков слова «сожительство».
- source_word: ὀδύνην
  choice: страдания
  rationale: Передаёт физическую или душевную боль в широком смысле и соответствует возвышенному контексту.
- source_word: εὐφροσύνην καὶ χαράν
  choice: веселье и радость
  rationale: 'Сохраняет два различных существительных и риторическую полноту оригинала: εὐφροσύνη — веселье, отрада; χαρά — радость.'
theological_decisions:
- issue: Олицетворение Премудрости в женском роде
  choice: Сохранить местоимение «ней»
  alternative: Повторить «Премудростью» или передать отвлечённо
  rationale: Греческий текст последовательно представляет Премудрость как женский образ посредством αὐτῇ и αὐτῆς; местоимение сохраняет литературное и богословское напряжение источника.
- issue: Оттенок προσαναπαύσομαι αὐτῇ
  choice: «отдохну рядом с ней» с примечанием
  alternative: «отдохну с ней»
  rationale: Основной текст отражает пространственно-ассоциативный оттенок приставки προς-, а примечание сохраняет допустимое более общее понимание тесного общения.
