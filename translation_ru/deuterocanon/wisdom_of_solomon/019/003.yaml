base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/003.yaml
  text: For while they still had their mourning in their hands and were still lamenting at the graves of the dead[a], they took up another plan of folly, and those whom they had driven out with pleading[c][b], these they pursued as fugitives.
translation:
  language: ru
  text: Ибо они, всё ещё держа в руках знаки скорби[a] и оплакивая умерших у их гробниц, приняли иной безрассудный замысел[b] и тех, кого с мольбами прогнали[c], преследовали как беглецов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «держа скорбь в руках» — яркий образ, вероятно указывающий на траурные обряды или видимые знаки скорби.'
    reason: cultural_note
  - marker: b
    text: 'Или: «иной помысел безумия». Греческое выражение может обозначать мысль, рассуждение или практический замысел.'
    reason: lexical_alternative
  - marker: c
    text: То есть тех же людей, которых прежде настойчиво просили уйти, затем стали преследовать как беглецов.
    reason: cross_reference
lexical_decisions:
- source_word: ἔτι
  choice: ещё
  rationale: Передаёт продолжающееся действие и его временное наложение на последующий резкий поворот.
- source_word: ἐν χερσὶν ἔχοντες τὰ πένθη
  choice: ещё держали в руках знаки скорби
  rationale: 'Сохраняет конкретный образ греческого выражения, одновременно делая понятным его вероятный смысл: они всё ещё были заняты траурными обрядами или держали их знаки.'
- source_word: προσοδυρόμενοι τάφους νεκρῶν
  choice: оплакивали умерших у их гробниц
  rationale: Причастие передаёт продолжающийся плач; предложное значение приставки и винительный падеж допускают смысл плача у гробниц. Формулировка избегает неестественного русского «оплакивали гробницы».
- source_word: ἕτερον ... λογισμὸν ἀνοίας
  choice: иной безрассудный замысел
  rationale: λογισμός в контексте обозначает практический замысел, а ἀνοία — безрассудство, отсутствие здравого смысла.
- source_word: ἐπεσπάσαντο
  choice: приняли
  rationale: Средний залог выражает усвоение или принятие нового образа мысли либо замысла; «приняли» естественно по-русски и не усиливает значение до «задумали».
- source_word: οὓς ἱκετεύοντες ἐξέβαλον
  choice: тех, кого они с мольбами прогнали
  rationale: Сохраняет одновременно настойчивую мольбу (ἱκετεύοντες) и активное удаление или изгнание (ἐξέβαλον), не добавляя прямо не названного адресата мольбы.
- source_word: τούτους ὡς φυγάδας ἐδίωκον
  choice: они стали преследовать как беглецов
  rationale: Передаёт и преследование, и иронию отношения к ранее изгнанным как к самовольно бежавшим людям.
theological_decisions:
- issue: Историко-богословская ирония перемены отношения египтян к Израилю
  choice: Передать контраст между изгнанием с мольбами и последующим преследованием без добавления деталей исхода.
  alternative: Прямо пояснить, что египтяне сначала просили израильтян уйти после казней, а затем гнались за ними у моря.
  rationale: Сам греческий текст ясно выражает иронию через противопоставление ἱκετεύοντες ἐξέβαλον и ὡς φυγάδας ἐδίωκον; историческое расширение вышло бы за пределы стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной образностью. Конструкция перестроена ради естественного русского синтаксиса; союз «но уже» подчёркивает парадоксально быстрый переход от траура к новому безрассудству. Все пояснительные добавления вынесены в сноски.
