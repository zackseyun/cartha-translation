base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/013.yaml
  text: And punishments came upon the sinners[a], not without the evidence of what had happened in the violence of the thunderbolts; for they justly suffered for their own wicked acts[b], because they practiced a more grievous hatred of strangers.
translation:
  language: ru
  text: И наказания постигли грешников — не без доказательств того, что уже произошло, явленных силой молний[a]. Ведь они справедливо страдали за собственные злодеяния, потому что проявляли более жестокую ненависть к чужакам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза сжата, и связь слов допускает разные оттенки: «не без доказательств, основанных на происшедших событиях, — силой молний». Общий смысл остаётся тем же: сила молний служит свидетельством, связанным с уже происшедшим.'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Или: «более тяжёлое негостеприимство». Греческое слово может означать не просто отказ в гостеприимстве, а деятельную враждебность к чужакам или гостям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμωρίαι
  choice: наказания
  rationale: Передаёт карательные меры или воздаяние за проступки, не усиливая смысл до личной мести.
- source_word: ἁμαρτωλοῖς
  choice: грешников
  rationale: Прямо передаёт субстантивированное обозначение людей, характеризуемых грехом.
- source_word: οὐκ ἄνευ τῶν γεγονότων τεκμηρίων
  choice: не без свидетельств случившегося
  rationale: Сохраняет отрицательную конструкцию οὐκ ἄνευ и доказательный оттенок τεκμήρια; γεγονότων отнесено к тому, что произошло.
- source_word: τῇ βίᾳ τῶν κεραυνῶν
  choice: явленных в сокрушительной силе молний
  rationale: βία передано как разрушительная, сокрушительная сила, а κεραυνοί — современным и естественным словом «молнии». Связь оборота с соседними членами фразы в греческом сжата, поэтому неоднозначность отмечена в сноске.
- source_word: δικαίως ἔπασχον
  choice: справедливо страдали
  rationale: Сохраняет судебно-нравственную оценку δικαίως и прямое значение глагола πάσχω.
- source_word: ταῖς ἰδίαις αὐτῶν πονηρίαις
  choice: за собственные злодеяния
  rationale: Множественное πονηρίαι передано конкретно как злые деяния, а дательный понят как указывающий на основание заслуженного страдания.
- source_word: χαλεπωτέραν μισοξενίαν
  choice: более жестокой ненависти к чужеземцам
  rationale: Сохраняет сравнительную степень χαλεπωτέραν и сильный смысл μισοξενία как враждебности к чужим, а не просто недостатка гостеприимства.
- source_word: ἐπετήδευσαν
  choice: предавались
  rationale: Передаёт устойчивую, сознательно практикуемую линию поведения, а не единичный поступок.
theological_decisions:
- issue: Нравственная сила слова μισοξενία
  choice: ненависть к чужеземцам
  alternative: негостеприимство; враждебность к гостям
  rationale: Составное слово выражает активное неприятие чужих или гостей; более сильная формулировка соответствует контексту справедливого наказания и сравнительной форме χαλεπωτέραν, не добавляя конфессионального толкования.
- issue: Причинное значение ταῖς ἰδίαις αὐτῶν πονηρίαις
  choice: страдали за собственные злодеяния
  alternative: страдали от собственных злодеяний; страдали из-за собственного зла
  rationale: 'Так сохраняется судебный смысл: страдание представлено как заслуженное следствие их собственных поступков. Формальная неоднозначность дательного не превращается в утверждение, будто сами поступки непосредственно причиняли страдание.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис первого предложения намеренно сохраняет часть сжатости греческого оригинала, но остаётся читаемым; альтернативная связь оборотов раскрыта в сноске. Лексика «чужеземцы» слегка возвышенная, однако понятная и уместная в контексте древнего повествования.
