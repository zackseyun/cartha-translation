  terminology: «Наказания», «грешники», «справедливо страдали» и «злодеяния» уместны. «Ненависть к чужакам» сохраняет силу μισοξενία; в сноске следует оставить вариант «негостеприимство» и уточнить, что речь может идти также о гостях.
