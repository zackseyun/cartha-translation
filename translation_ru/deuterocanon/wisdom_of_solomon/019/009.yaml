    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεμήθησαν
  choice: паслись
  rationale: Глагол передаёт образ животных, кормящихся на пастбище. «Паслись» сохраняет конкретную метафору и допускаемый средний смысл формы, не превращая её без необходимости в пассивное «их пасли».
- source_word: διεσκίρτησαν
  choice: скакали
  rationale: Глагол обозначает живые, повторяющиеся прыжки; «скакали» естественно сочетается с образом ягнят и передаёт радостное движение.
- source_word: ἀμνοί
  choice: ягнята
  rationale: Прямое и обычное соответствие, сохраняющее образ молодых животных.
- source_word: αἰνοῦντές
  choice: восхваляя
  rationale: Деепричастие передаёт сопутствующее действие причастия настоящего времени и сохраняет возвышенный, но понятный регистр.
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская звательная форма при прямом обращении к Богу.
- source_word: τὸν ῥυόμενον αὐτούς
  choice: своего Избавителя
  rationale: Субстантивированное причастие обозначает Того, кто спасает или избавляет их. Именное выражение естественно по-русски и сохраняет акцент на Боге как Избавителе.
theological_decisions:
- issue: Прямое обращение к Богу словом κύριος
  choice: Господи
  alternative: Владыка
  rationale: В данном контексте κύριος — обращение к Богу в хвале; «Господи» является общепринятым, неденоминационным и стилистически естественным соответствием.
- issue: Временной оттенок τὸν ῥυόμενον
  choice: своего Избавителя
  alternative: Того, кто избавляет их
  rationale: Греческое причастие формально настоящее, но характеризует Бога как совершающего спасение, а не обязательно задаёт узкое хронологическое время. Именное выражение не навязывает завершённость «избавившего» и естественно звучит в русском.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок образов и прямая хвала сохранены; «словно» помогает ясно оформить два сравнения, а тире выделяет пояснительное наименование Бога.
