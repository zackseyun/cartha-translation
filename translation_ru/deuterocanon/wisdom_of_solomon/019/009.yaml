translation:
  language: ru
  text: Ведь они паслись[a], словно кони, и скакали[b], словно ягнята, восхваляя Тебя, Господи, — Того, кто избавляет их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были выпасаемы»; греческий глагол рисует образ животных, кормящихся на пастбище.'
