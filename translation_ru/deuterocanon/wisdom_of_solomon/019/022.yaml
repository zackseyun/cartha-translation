lexical_decisions:
- source_word: Κατὰ πάντα
  choice: во всём
  rationale: Оборот κατά с винительным множественного числа выражает полноту охвата; «во всём» естественно по-русски и сохраняет возможный смысл «во всех отношениях».
- source_word: ἐμεγάλυνας
  choice: возвеличил
  rationale: Передаёт значение «сделал великим, возвысил» и сохраняет возвышенный библейский регистр.
- source_word: τὸν λαόν σου
  choice: Свой народ
  rationale: λαός в библейском греческом обычно означает Божий народ; возвратное «Свой» естественно соотносит его с подлежащим «Ты».
- source_word: ἐδόξασας
  choice: прославил
  rationale: Сохраняет связь с понятием славы и передаёт наделение народа славой и честью.
- source_word: οὐχ ὑπερεῖδες
  choice: не оставлял его без внимания
  rationale: ὑπεροράω означает «не замечать, пренебрегать, оставлять без внимания». Русский оборот передаёт заботливое Божье участие без неестественной буквальности.
- source_word: ἐν παντὶ καιρῷ καὶ τόπῳ
  choice: во всякое время и во всяком месте
  rationale: Точно сохраняет временную и пространственную всеохватность фразы и звучит естественно в современном литературном русском.
- source_word: παριστάμενος
  choice: пребывая рядом с ним
  rationale: Причастие обозначает присутствие рядом, часто с оттенком поддержки. Формулировка сохраняет образ близкого присутствия, не усиливая его до явно выраженного «приходя на помощь».
theological_decisions:
- issue: Обращение κύριε
  choice: Господи
  alternative: о Господи
  rationale: Это прямое обращение к Богу; русская звательная форма «Господи» reverentна и естественна, а частица «о» в греческом отсутствует.
- issue: Неявное дополнение при παριστάμενος
  choice: пребывая рядом с ним
  alternative: пребывая рядом; присутствуя
  rationale: В греческом дополнение не выражено, но контекст связывает Божье присутствие с Его народом. Местоимение делает русский текст ясным, не добавляя нового богословского утверждения.
- issue: Вид глагола в οὐχ ὑπερεῖδες
  choice: не оставлял
  alternative: не оставил
  rationale: Хотя греческая форма — аорист, контекст «во всякое время и во всяком месте» подчёркивает постоянство Божьей заботы; несовершенный вид по-русски естественно передаёт эту повторяемость, не отрицая итогового характера утверждения.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаичным библейским звучанием. Синтаксис сохраняет единое итоговое восхваление Бога и последовательность греческого текста; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
