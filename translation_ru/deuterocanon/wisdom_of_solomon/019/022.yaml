  text: For in every way[a], Lord, you magnified your people and glorified them, and you did not overlook them, standing by them at every time and place.
translation:
  language: ru
  text: Ибо во всём, Господи, Ты возвеличил и прославил Свой народ и не оставил его без внимания, пребывая рядом с ним во всякое время и во всяком месте.
