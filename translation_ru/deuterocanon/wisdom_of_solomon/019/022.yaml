    rationale: Греческий аорист представляет действие как целостное. Хотя последующее «во всякое время и во всяком месте» описывает постоянное присутствие, оно не отменяет аористный аспект главного сказуемого. «Не оставил без внимания» точнее и столь же естественно.
  revised_text: Ибо во всём, Господи, Ты возвеличил и прославил Свой народ и не оставил его без внимания, пребывая рядом с ним во всякое время и во всяком месте.
