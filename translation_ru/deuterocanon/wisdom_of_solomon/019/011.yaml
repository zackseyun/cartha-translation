base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/011.yaml
  text: Later they also saw a new generation of birds[a], when, driven by craving, they asked for delicacies of luxury[b];
translation:
  language: ru
  text: Позднее они увидели и новое появление птиц[a], когда, движимые страстным желанием, попросили изысканных яств[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «новый вид птиц». Греческое выражение может указывать прежде всего на новое появление, возникновение птиц, а возможно — на новый их вид.'
    reason: lexical_alternative
  - marker: b
    text: То есть пищи, которую искали ради удовольствия, а не только ради насыщения; ср. рассказ о желании пищи в пустыне в Исх. 16 и Чис. 11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐφʼ ὑστέρῳ
  choice: Позднее
  rationale: Передаёт последующий этап повествования естественным и лаконичным современным русским выражением.
- source_word: εἶδον
  choice: они увидели
  rationale: Прямо передаёт аорист глагола ὁράω и сохраняет повествовательную простоту.
- source_word: νέαν γένεσιν ὀρνέων
  choice: новое появление птиц
  rationale: γένεσις обозначает возникновение или приведение к бытию; «появление» естественно по-русски и не создаёт ложного впечатления, будто речь обязательно идёт о выведении птенцов. Возможное понимание как нового вида отмечено в сноске.
- source_word: ὅτε
  choice: когда
  rationale: Простой временной союз точно вводит обстоятельства появления птиц.
- source_word: ἐπιθυμίᾳ
  choice: страстным желанием
  rationale: Передаёт усиленное, выходящее за пределы простой нужды желание пищи, не внося в контекст сексуальных ассоциаций слова «похоть».
- source_word: προαχθέντες
  choice: движимые
  rationale: Передаёт значение побуждения или увлечения вперёд желанием и естественно сочетается с творительным падежом.
- source_word: ᾐτήσαντο
  choice: попросили
  rationale: Нейтрально передаёт средний аорист αἰτέω; более сильное «потребовали» превысило бы лексическую силу самого глагола.
- source_word: ἐδέσματα τρυφῆς
  choice: изысканных яств
  rationale: Передаёт не обычную пищу, а еду, желаемую ради удовольствия и роскоши. «Яства» сохраняет достоинство стиля, а «изысканных» естественно выражает оттенок τρυφή.
theological_decisions:
- issue: Нравственная оценка просьбы Израиля о пище в пустыне
  choice: Формулировка «движимые страстным желанием» и «изысканных яств» сохраняет содержащуюся в греческом тексте критику чрезмерного желания и стремления к удовольствию.
  alternative: Можно было перевести нейтральнее — «побуждаемые желанием, попросили пищи», — либо резче — «одержимые вожделением, потребовали роскоши».
  rationale: ἐπιθυμία и τρυφή имеют здесь оценочную окраску, но глагол ᾐτήσαντο сам по себе означает просьбу, а не обязательно требование. Перевод сохраняет напряжение текста, не усиливая обвинение сверх греческого источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Яства» выбрано как понятное, но достойное контекста слово; синтаксис остаётся ясным для широкого читателя. Все сноски обозначены в основном тексте.
