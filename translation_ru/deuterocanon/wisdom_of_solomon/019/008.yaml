lexical_decisions:
- source_word: διʼ οὗ
  choice: по нему
  rationale: Относительное сочетание с διά и родительным падежом указывает на путь или пространство, по которому совершался переход. «По нему» естественно продолжает контекст и не уточняет сверх текста, что именно было этим путём.
- source_word: πανεθνεὶ
  choice: всем народом
  rationale: 'Наречие выражает совместное, общенародное действие: защищённые Богом прошли как единый народ. Русский творительный образа действия передаёт эту корпоративную силу естественно и кратко.'
- source_word: διῆλθον
  choice: прошли
  rationale: Аорист от διέρχομαι обозначает завершённое прохождение. «Прошли» точно и без лишнего уточнения передаёт действие.
- source_word: οἱ τῇ σῇ σκεπαζόμενοι χειρί
  choice: те, кого укрывала Твоя рука
  rationale: Оборот сохраняет буквальный образ руки, которая укрывает и тем самым защищает. Прошедшее несовершенное «укрывала» естественно передаёт продолжающееся действие греческого причастия в рамках повествования.
- source_word: θεωρήσαντες
  choice: увидев
  rationale: Аористное причастие обозначает сопутствующее или предшествующее восприятие увиденного. Деепричастие сохраняет смысловую связь с основным глаголом, не навязывая слишком жёсткой временной последовательности.
- source_word: θαυμάσια τέρατα
  choice: дивные чудеса
  rationale: Сочетание двух близких по смыслу слов усиливает впечатление от необычайных чудесных явлений. «Дивные чудеса» сохраняет это риторическое усиление и звучит возвышенно, но понятно.
theological_decisions:
- issue: Образ Божьей защиты посредством «руки»
  choice: сохранить выражение «Твоя рука»
  alternative: «те, кого Ты защищал»
  rationale: Греческий текст прямо использует антропоморфный библейский образ руки как деятельной Божьей защиты. Его сохранение не сводит образ к отвлечённому понятию.
- issue: Коллективный характер спасения народа
  choice: «всем народом»
  alternative: «все вместе»
  rationale: πανεθνεὶ подчёркивает не только совместность, но и национально-корпоративное единство перешедших; перевод сохраняет этот оттенок без догматического расширения.
