base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/010.yaml
  text: 'For they still remembered the things in their time as foreigners: how[a], instead of the breeding of animals, the land brought forth gnats, and instead of creatures of the water[b], the river spewed out a multitude of frogs.'
translation:
  language: ru
  text: 'Ибо они всё ещё помнили то, что было во время своего пребывания на чужбине[a]: как вместо рождения животных земля произвела мошкару[b], а вместо водных существ река извергла множество лягушек.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своей жизни среди чужеземцев». Греческое слово означает проживание в чужой земле в положении пришельцев.'
    reason: lexical_alternative
  - marker: b
    text: Точный вид насекомого, обозначенного греческим словом, неизвестен; возможны также переводы «мошки» или «комары».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμέμνηντο … ἔτι
  choice: всё ещё помнили
  rationale: 'Передаёт сочетание имперфекта с ἔτι: воспоминание продолжало сохраняться.'
- source_word: παροικίᾳ
  choice: пребывания на чужбине
  rationale: Выражает временное проживание среди чужого народа и сохраняет значение положения пришельцев, не привнося идею позднейшего изгнания.
- source_word: γενέσεως ζῴων
  choice: рождения животных
  rationale: Сохраняет широкое значение γένεσις — возникновение или рождение живых существ — и не сужает его исключительно до целенаправленного разведения.
- source_word: ἐξήγαγεν
  choice: произвела
  rationale: Естественно описывает появление мошкары из земли, сохраняя представление о земле как источнике.
- source_word: σκνῖπα
  choice: мошкару
  rationale: Собирательное русское существительное хорошо соответствует форме с массовым значением; точный вид мелких насекомых определить нельзя.
- source_word: ἐνύδρων
  choice: водных существ
  rationale: Передаёт субстантивированное прилагательное как общее обозначение обитающих в воде существ.
- source_word: ἐξηρεύξατο
  choice: извергла
  rationale: Сохраняет резкий, телесный образ насильственного выброса, заложенный в греческом глаголе.
- source_word: πλῆθος βατράχων
  choice: множество лягушек
  rationale: Точно передаёт акцент на чрезвычайно большом количестве без добавления значения организованного роя.
theological_decisions:
- issue: Значение παροικία при воспоминании о египетских бедствиях
  choice: пребывание на чужбине
  alternative: странствование; изгнание; жизнь пришельцами
  rationale: Контекст указывает на проживание Израиля в Египте в положении чужеземцев. «Изгнание» было бы богословски перегруженным, а «странствование» могло бы ошибочно подразумевать постоянное передвижение.
- issue: Образ действия реки в ἐξηρεύξατο
  choice: река извергла
  alternative: река исторгла; река выпустила
  rationale: Выбор сохраняет намеренно сильный образ греческого текста и не превращает его в нейтральное описание появления лягушек.
- issue: Соотношение γενέσεως ζῴων и появления мошкары
  choice: вместо рождения животных
  alternative: вместо размножения животных; вместо появления живых существ
  rationale: Формулировка сохраняет широкую смысловую напряжённость γένεσις между рождением, возникновением и произведением живых существ, не сводя её только к биологическому размножению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. «Извергла» сохраняет силу исходной метафоры, тогда как «мошкара» остаётся понятным собирательным обозначением без ложной биологической точности. Все сноски поставлены непосредственно после слов, к которым относятся.
