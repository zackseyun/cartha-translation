revisions:
- from: А на нечестивых[a] до самого конца обрушился безжалостный гнев, потому что Он заранее знал и их самих, и то, что им предстояло[b],
  to: Но нечестивых до самого конца настигал безжалостный гнев, ибо Он заранее знал и их самих, и грядущее,
  rationale: Убрано добавленное «им», чтобы сохранить неограниченное значение τὰ μέλλοντα. Синтаксис первой части перестроен для ясного выражения «до самого конца» в современном русском. Союз «ибо» передаёт γάρ в литературном библейском регистре. Запятая в конце сохранена, поскольку стих образует незавершённую синтаксическую связь с продолжением.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:02:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: ἀσεβεῖς, ἀνελεήμων θυμός, προῄδει и парное αὐτῶν καὶ τὰ μέλλοντα отражены. Однако «им предстояло» добавляет отсутствующее в греческом ограничение будущего участью нечестивых; τὰ μέλλοντα шире: «грядущее» / «то, что должно было произойти».'
  naturalness: «А на нечестивых до самого конца обрушился…» допускает неудачное прочтение, будто гнев обрушился именно в конце. Перестройка с «настигал ... до самого конца» естественнее выражает временную протяжённость в русском, хотя греческий аорист отмечает наступление гнева как целостное событие.
  terminology: «Нечестивые», «безжалостный гнев» и «заранее знал» соответствуют современному литературному библейскому регистру. Заглавное «Он» допустимо при сохранении пояснения о невыраженном субъекте.
  issues:
  - severity: medium
    issue: Добавлено «им» в «то, что им предстояло».
    rationale: У τὰ μέλλοντα нет притяжательного или дательного уточнения. Контекст может связывать грядущее с нечестивыми, но сам текст этого не ограничивает; перевод не должен снимать данную широту.
  - severity: low
    issue: Позиция «до самого конца» при «обрушился» в русском синтаксически двусмысленна.
    rationale: Она может быть понята как указание на момент, когда гнев обрушился, а не на его действие до конца. Перестройка делает временную связь яснее.
  revised_text: Но нечестивых до самого конца настигал безжалостный гнев, ибо Он заранее знал и их самих, и грядущее,
  revised_footnotes:
