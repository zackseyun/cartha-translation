  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/001.yaml
  text: But for the ungodly, merciless wrath came upon them to the very end; for he knew beforehand both them and what was going to happen,
translation:
  language: ru
  text: Но нечестивых до самого конца настигал безжалостный гнев, ибо Он заранее знал и их самих, и грядущее,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβέσιν
  choice: нечестивых
  rationale: Передаёт религиозно-нравственный смысл ἀσεβής — людей, не почитающих Бога; естественнее в современном русском библейском регистре, чем «безбожных» или «неблагочестивых».
- source_word: μέχρι τέλους
  choice: до самого конца
  rationale: Сохраняет временное значение и усилительный характер выражения.
- source_word: ἀνελεήμων
  choice: безжалостный
  rationale: Прямо передаёт отсутствие милости и естественно сочетается в русском языке со словом «гнев».
- source_word: θυμός
  choice: гнев
  rationale: В контексте суда обозначает сильный карающий гнев; выбор сохраняет торжественный, но понятный регистр.
- source_word: ἐπέστη
  choice: обрушился
  rationale: Выражает внезапное и грозное наступление гнева на нечестивых; дательный объект естественно передан конструкцией «на нечестивых».
- source_word: προῄδει
  choice: заранее знал
  rationale: Прозрачно передаёт предшествующее знание, не привнося специального догматического смысла термина «предузнал».
- source_word: αὐτῶν καὶ τὰ μέλλοντα
  choice: и их самих, и то, что им предстояло
  rationale: Сохраняет координацию καί…καί и различие между знанием самих людей и будущего. «Им» естественно уточняет связь будущего с указанными людьми, хотя в греческом это местоимение не выражено явно.
theological_decisions:
- issue: Неявный субъект προῄδει
  choice: Он заранее знал
  alternative: Бог заранее знал
  rationale: В греческом субъект не назван. Местоимение сохраняет эту текстовую сдержанность, а примечание указывает, что контекст естественно относит действие к Богу.
- issue: Отнесённость τὰ μέλλοντα
  choice: то, что им предстояло
  alternative: то, что должно было произойти / грядущее
  rationale: Контекст связывает будущее с участью нечестивых, однако греческое выражение буквально шире — «то, что предстояло»; эта степень неоднозначности отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достойным библейским звучанием. Синтаксис сохраняет противопоставление δέ и причинную связь γάρ. Заглавное «Он» помогает читателю распознать вероятного референта, но сноска сохраняет формальную невыраженность субъекта в греческом.
