base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/021.yaml
  text: Flames[a], on the contrary, did not wither the flesh of the perishable living creatures that walked among them, nor did they melt the meltable[b], crystal-like kind of ambrosial food.
translation:
  language: ru
  text: Пламя же, напротив[a], не иссушало плоти тленных живых существ, ходивших среди него, и не растапливало плавкую, легко тающую, кристаллоподобную[b] разновидность амвросийной пищи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наоборот», «действуя противоположным образом». Греческое наречие подчёркивает, что пламя действовало противоположно тому, чего от него естественно ожидать.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ледоподобную», «кристаллическую». Греческое слово может описывать вид или консистенцию чудесной пищи.'
    reason: lexical_alternative
  - marker: c
    text: 'То есть пищи бессмертных; возможно также: «бессмертной пищи» или «небесной пищи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φλόγες
  choice: пламя
  rationale: Греческое множественное число обозначает огненное явление; в современном русском собирательное «пламя» естественнее буквального «языки пламени» и сохраняет конкретный образ.
- source_word: ἀνάπαλιν
  choice: вопреки обычному
  rationale: 'Наречие указывает на действие, обратное естественно ожидаемому: пламя не причиняет того, что обычно причиняет огонь.'
- source_word: εὐφθάρτων ζῴων
  choice: тленных живых существ
  rationale: «Живые существа» не сужает ζῷα до определённого вида животных, а «тленных» передаёт подверженность гибели и разрушению.
- source_word: οὐκ ἐμάραναν
  choice: не иссушало
  rationale: μαραίνω означает заставлять вянуть, сохнуть или чахнуть. «Не иссушало» сохраняет необычный образ воздействия огня, не подменяя его более ожидаемым «не сжигало».
- source_word: σάρκας
  choice: плоти
  rationale: Передаёт буквальное значение телесной плоти; притяжательное местоимение не добавлено, поскольку его нет в греческом.
- source_word: ἐμπεριπατούντων
  choice: ходивших среди него
  rationale: Причастие изображает существ движущимися внутри огненной среды. Единственное число местоимения согласовано с естественным русским «пламя».
- source_word: τηκτὸν εὔτηκτον
  choice: плавкую, легко тающую
  rationale: 'Два близких по смыслу определения сохранены как намеренное усиление: пища по своей природе способна и легко склонна таять, но пламя её не растапливает.'
- source_word: κρυσταλλοειδὲς
  choice: кристаллоподобную
  rationale: Сохраняет образ κρύσταλλος, который может подразумевать кристалл, лёд или прозрачную кристаллическую структуру, не выбирая одну трактовку без необходимости.
- source_word: γένος
  choice: разновидность
  rationale: Передаёт классифицирующее значение «род, вид» и естественно связывает ряд определений со словом «пища».
- source_word: ἀμβροσίας τροφῆς
  choice: амвросийной пищи
  rationale: Сохраняет возвышенную эллинистическую окраску и связь с амвросией — пищей бессмертных, не сводя выражение без пояснения к более узкому «небесная» или «бессмертная пища».
theological_decisions:
- issue: Передача образа чудесной пищи без внесения позднейшего доктринального толкования
  choice: амвросийной пищи
  alternative: бессмертной пищи; небесной пищи
  rationale: Редкое, но понятное в контексте слово сохраняет литературный образ греческого текста и не определяет, означает ли выражение происхождение пищи, её нетленность или её связь с бессмертием.
- issue: Степень явности нахождения существ внутри пламени
  choice: ходивших среди него
  alternative: ходивших внутри него; двигавшихся посреди него
  rationale: Формулировка ясно передаёт движение существ в огненной среде, но не расширяет лаконичный греческий оборот.
translation_notes:
  register: Современный литературный русский с возвышенной, но не архаической интонацией. Редкое «амвросийной» намеренно сохраняет эллинистический колорит и снабжено пояснением. Синтаксический параллелизм двух отрицаний и парадоксальная повторность «плавкую, легко тающую» удерживают риторическое напряжение оригинала.
