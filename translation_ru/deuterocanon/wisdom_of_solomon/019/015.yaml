lexical_decisions:
- source_word: οὐ μόνον
  choice: не только это
  rationale: Оборот продолжает мысль предыдущего стиха; добавленное «это» делает связь естественной по-русски, не меняя смысла.
- source_word: ἐπισκοπή
  choice: посещение
  rationale: Слово может обозначать посещение, надзор или проверку, а в данном контексте — Божье посещение ради суда. «Посещение» сохраняет смысловую широту и не превращает подразумеваемый суд в прямо названное наказание.
- source_word: ἀπεχθῶς
  choice: враждебно
  rationale: Наречие передаёт неприязненный, недружелюбный характер приёма; «враждебно» звучит естественно и сохраняет нравственную силу выражения.
- source_word: προσεδέχοντο
  choice: приняли
  rationale: Глагол означает принять или допустить к себе. Нейтральное «приняли» хорошо сочетается с определяющим его наречием «враждебно», тогда как «радушно приняли» противоречило бы контексту.
- source_word: τοὺς ἀλλοτρίους
  choice: чужеземцев
  rationale: Слово обозначает людей из другого народа. «Чужеземцы» ясно передаёт этническую и общественную чуждость и уместно в возвышенной повествовательной прозе.
theological_decisions:
- issue: Судебный оттенок ἐπισκοπή
  choice: их ещё ждёт посещение
  alternative: их ждёт взыскание / их подвергнут суду
  rationale: Контекст указывает на Божье посещение с целью суда, однако само существительное не называет наказание прямо. Поэтому основной текст сохраняет неоднозначность, а сноска поясняет вероятный судебный оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция «их ждёт посещение» несколько необычна, но понятна и сохраняет богословскую многозначность исходного слова; двоеточие естественно связывает добавочную мысль с её раскрытием.
