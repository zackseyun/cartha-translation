base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/006.yaml
  text: For the whole creation[a], in its own kind, was formed anew from above, serving your own commands, so that your children might be kept unharmed.
translation:
  language: ru
  text: Ибо всё творение, каждое в своём роде, вновь преобразовывалось свыше[a], служа Твоим собственным повелениям, чтобы Твои дети остались невредимы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вновь преобразовывалось с самого начала». Греческое ἄνωθεν может означать как «свыше», так и «с самого начала», а διετυποῦτο — «преобразовывалось», «переформировывалось».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλη ἡ κτίσις
  choice: всё творение
  rationale: Сочетание обозначает весь сотворённый порядок как единое целое; «всё творение» естественно передаёт собирательное значение.
- source_word: ἐν ἰδίῳ γένει
  choice: каждое в своём роде
  rationale: γένος означает род или разряд, а не прямо «природу». Добавление «каждое» по-русски проясняет распределительное значение при собирательном «всё творение».
- source_word: πάλιν ἄνωθεν
  choice: вновь … свыше
  rationale: πάλιν указывает на повторное или обновлённое действие, а ἄνωθεν допускает значение «свыше». Возможное значение «с самого начала» сохранено в сноске.
- source_word: διετυποῦτο
  choice: преобразовывалось
  rationale: Имперфект среднего/страдательного залога описывает продолжавшееся переустройство или придание нового облика; «преобразовывалось» передаёт и процесс, и обновление формы.
- source_word: ὑπηρετοῦσα ταῖς ἰδίαις ἐπιταγαῖς
  choice: подчиняясь данным ему повелениям
  rationale: ὑπηρετέω выражает служение или исполнение распоряжений. Буквальное «своим повелениям» по-русски могло бы ошибочно означать, что творение само отдаёт приказы; формулировка передаёт повеления, назначенные творению и исполняемые им.
- source_word: οἱ σοὶ παῖδες
  choice: Твои дети
  rationale: παῖδες может означать детей или слуг; здесь обращение к Богу и тема Его охраны поддерживают сыновнее значение без гендерного сужения.
- source_word: φυλαχθῶσιν ἀβλαβεῖς
  choice: остались невредимы
  rationale: Конструкция с ἵνα выражает цель сохранения от вреда; русский оборот краток и естественен, сохраняя защитный смысл.
theological_decisions:
- issue: Значение ἄνωθεν при обновлении творения
  choice: 'В основном тексте: «свыше»'
  alternative: «с самого начала» или «заново»
  rationale: «Свыше» сохраняет возможный намёк на Божье действие, но греческое наречие допускает также временное значение; эта неоднозначность отмечена в сноске.
- issue: Чья власть стоит за ταῖς ἰδίαις ἐπιταγαῖς
  choice: «данным ему повелениям»
  alternative: 'Буквально: «своим повелениям»; по контексту также возможно «Твоим повелениям»'
  rationale: Форма ἰδίαις грамматически соотносит повеления с творением как присущие или назначенные ему, тогда как контекст представляет Бога их источником. Перевод не делает творение самостоятельным законодателем и не подменяет греческое местоимение прямым вторым лицом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Распределительное «каждое» введено ради естественной связи собирательного подлежащего с выражением «в своём роде».
