lexical_decisions:
- source_word: σκιάζουσα
  choice: осенявшее
  rationale: Глагол обозначает покрытие тенью. «Осенявшее» сохраняет образ облака, простёршего над станом тень, и звучит естественно в возвышенном повествовании.
- source_word: παρεμβολήν
  choice: стан
  rationale: В контексте исхода слово обозначает лагерь Израиля; «стан» — понятное и уместное для библейского повествования русское соответствие.
- source_word: προϋφεστῶτος ὕδατος
  choice: воды, прежде стоявшей на этом месте
  rationale: Перфектное причастие указывает на воду, уже находившуюся и стоявшую там; перевод передаёт как временную предшествующесть, так и неподвижное местонахождение без неясного добавления «перед ними».
- source_word: ξηρᾶς ἀνάδυσις γῆς
  choice: показалась суша
  rationale: Греческое сочетание буквально описывает появление или выход сухой земли из воды. «Показалась суша» естественно передаёт этот зримый образ.
- source_word: ἐθεωρήθη
  choice: стало видно
  rationale: Пассивный аорист означает, что описанное было увидено или стало доступно взору. Безличная русская конструкция позволяет связать его с перечислением явившихся взору картин, не устраняя синтаксическую неровность исходного текста чрезмерной конкретизацией.
- source_word: ἐρυθρᾶς θαλάσσης
  choice: Красном море
  rationale: Греческий текст прямо называет Красное море. Предложная конструкция «в Красном море открылся… путь» естественно выражает возникновение пути внутри моря.
- source_word: ὁδὸς ἀνεμπόδιστος
  choice: беспрепятственный путь
  rationale: Сочетание подчёркивает свободный от препятствий проход; выбранный перевод точен, краток и сохраняет конкретный образ пути.
- source_word: χλοηφόρον πεδίον
  choice: зеленеющая равнина
  rationale: Сложное прилагательное означает «несущая зелень, покрытая молодой растительностью». «Зеленеющая равнина» сохраняет неожиданный образ живой зелени там, где прежде бушевала вода.
- source_word: κλύδωνος βιαίου
  choice: яростных волн
  rationale: Выражение обозначает сильное, бурное волнение воды. Множественное «волны» в русском языке естественно передаёт картину бушующего моря, не ослабляя интенсивности.
theological_decisions:
- issue: Передача ἐρυθρᾶς θαλάσσης в образе исхода
  choice: Красное море
  alternative: Тростниковое море
  rationale: Перевод следует непосредственно сохранившемуся греческому тексту, где стоит традиционное название «Красное море», и не заменяет его реконструкцией предполагаемого древнееврейского выражения. Возможный вариант, связанный с древнееврейским фоном повествования об исходе, отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Ритмическое перечисление и контраст между водой и сушей сохранены; архаическая тяжеловесность и конфессионально окрашенные уточнения исключены.
