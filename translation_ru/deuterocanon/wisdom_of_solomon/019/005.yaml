  text: and your people experienced a marvelous journey[b][a], but they found a strange death.
translation:
  language: ru
  text: и чтобы Твой народ пережил необычайное странствие[a], а они встретили странную смерть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытал удивительное путешествие». Глагол означает также испытать или претерпеть что-либо, а не только попытаться это сделать.'
