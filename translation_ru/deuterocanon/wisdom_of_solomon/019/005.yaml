    reason: lexical_alternative
lexical_decisions:
- source_word: λαός σου
  choice: Твой народ
  rationale: Обычное коллективное обозначение народа, принадлежащего Богу; прописная буква в местоимении соответствует принятому благоговейному русскому употреблению.
- source_word: παράδοξον
  choice: необычайное
  rationale: Передаёт то, что выходит за пределы ожидаемого и вызывает изумление, сохраняя здесь положительный оттенок чудесного события.
- source_word: ὁδοιπορίαν
  choice: странствие
  rationale: Обозначает путь или путешествие; «странствие» естественно звучит в повествовании об исходе и сохраняет возвышенный, но понятный регистр.
- source_word: πειράσῃ
  choice: пережил
  rationale: В сочетании с объектом глагол означает испытать или претерпеть нечто на собственном опыте, а не только попытаться это сделать.
- source_word: ἐκεῖνοι
  choice: они
  rationale: Местоимение сохраняет противопоставление Божьему народу, не добавляя отсутствующего в греческом тексте слова «люди»; референт определяется контекстом.
- source_word: ξένον
  choice: странную
  rationale: Сохраняет резкость греческого определения со значением чуждого, необычного или странного и не смешивает его с παράδοξον.
- source_word: εὕρωσι θάνατον
  choice: встретили смерть
  rationale: Русская идиома естественно передаёт греческое «нашли смерть» в значении столкнулись с ней, при этом θάνατον остаётся именно «смертью», а не более общим «гибелью».
theological_decisions:
- issue: Противопоставление народа Божьего и египтян
  choice: «Твой народ… а они…»
  alternative: «Твой народ… тогда как те…»
  rationale: Конструкция μέν…δέ выражает ясную антитезу. Местоимение «они» не уточняет референт сверх текста, но контраст сохраняется союзом «а».
- issue: Зависимость стиха от цели, выраженной в предшествующем контексте
  choice: «и чтобы…» с формами прошедшего времени в придаточном цели
  alternative: 'Начать самостоятельным повествовательным предложением: «И Твой народ пережил…»'
  rationale: Сослагательные формы πειράσῃ и εὕρωσι продолжают конструкцию с ἵνα из предыдущего контекста. «Чтобы» сохраняет синтаксическую связь и не превращает зависимое высказывание в независимое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Необычайное странствие» и «странная смерть» сохраняют различие между παράδοξον и ξένον, а также положительно-зловещий контраст. Начальное «и чтобы» намеренно удерживает связь с предшествующим предложением.
