  source_fidelity: 'Текст точно передаёт греческую антитезу μέν…δέ: Божий народ «пережил» (πειράσῃ) необычайное странствие, тогда как «они» встретили странную смерть. «Чтобы» уместно сохраняет зависимость сослагательных форм от цели, заданной предшествующим контекстом; начальное «и» соответствует καί.'
