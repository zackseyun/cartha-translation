translation:
  language: ru
  text: Ведь сухопутные существа превращались в водных существ, а существа, плавающие, перемещались на сушу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χερσαῖα
  choice: сухопутные существа
  rationale: Субстантивированное прилагательное обозначает обитателей суши; добавление слова «существа» делает фразу естественной по-русски, не сужая её до определённого вида животных.
- source_word: ἔνυδρα
  choice: водных
  rationale: Субстантивированное прилагательное обозначает существ, связанных с водой. Эллиптическое «в водных» сохраняет параллелизм греческих χερσαῖα и ἔνυδρα и остаётся понятным благодаря слову «существа» в первой части.
- source_word: μετεβάλλετο
  choice: превращались
  rationale: Глагол описывает переход из одного состояния в другое. «Превращались» передаёт направленность конструкции εἰς, но не уточняет механизм перемены.
- source_word: νηκτά
  choice: плавающие
  rationale: Субстантивированное прилагательное обозначает тех, кому свойственно плавать; русский субстантивированный эквивалент сохраняет лаконичность оригинала.
- source_word: μετέβαινεν
  choice: переходили
  rationale: Глагол выражает перемещение или переход из одной области в другую; «переходили на сушу» естественно передаёт пространственную смену среды.
- source_word: γῆς
  choice: сушу
  rationale: В контрасте с водной средой «суша» точнее и естественнее, чем более широкие «земля» или «почва».
theological_decisions:
- issue: Характер описанной перемены в творении
  choice: Передать смену вида или среды образным глаголом «превращались», не объясняя её механизм.
  alternative: Понимать слова как буквальное превращение видов либо лишь как описание необычного поведения и смены среды обитания.
  rationale: Греческий текст утверждает перемену сухопутных в водных и переход плавающих на сушу, но не поясняет её природу. Перевод сохраняет эту смысловую напряжённость и не навязывает естественно-научного или аллегорического толкования.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным библейским ритмом. Субстантивированные прилагательные сохраняют параллелизм оригинала; союз «ведь» естественно передаёт пояснительное γάρ.
