revisions:
- from: Ибо стихии перестраивались между собой, как на струнном инструменте звуки меняют название ритма, но сами всё время остаются звуками[a]. Это можно с точностью заключить, наблюдая происшедшее[b].
  to: Ибо стихии взаимно перестраивались, подобно тому как на струнном инструменте звуки ритма меняют своё обозначение, неизменно сохраняя звучание[a]. В этом можно с полной уверенностью убедиться, наблюдая происшедшее[b].
  rationale: Правка устраняет неестественную генитивную конструкцию, не навязывая спорного толкования музыкального образа. «Своё обозначение» передаёт τὸ ὄνομα как подразумеваемое обозначение звуков; сноска сохраняет буквальное «имя» и грамматическую неоднозначность причастия. Смысл заключительного вывода сохранён.
