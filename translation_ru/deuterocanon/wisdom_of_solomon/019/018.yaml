base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/018.yaml
  text: For the elements[a], changing among themselves, as in a harp the notes of the melody alter the name, while always remaining in the sound[b], as may be accurately inferred from the sight of what happened.
translation:
  language: ru
  text: Ибо стихии взаимно перестраивались, подобно тому как на струнном инструменте звуки ритма меняют своё обозначение, неизменно сохраняя звучание[a]. В этом можно с полной уверенностью убедиться, наблюдая происшедшее[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое музыкальное сравнение сжато и допускает разные понимания. Буквально сказано, что звуки ритма «меняют имя (обозначение)», неизменно оставаясь «в звучании». Причастие «оставаясь» по форме может относиться как к музыкальным звукам, так и, по аналогии, к стихиям.
    reason: lexical_and_grammatical_ambiguity
  - marker: b
    text: 'Буквально: «из вида (наблюдения) происшедших событий», то есть на основании того, что было увидено в описанных событиях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στοιχεῖα
  choice: стихии
  rationale: В контексте речь идёт о составляющих сотворённого мира и изменениях в природе. «Стихии» сохраняет конкретный космологический смысл, не превращая их в личностные силы.
- source_word: μεθαρμοζόμενα
  choice: перестраивались
  rationale: Глагол передаёт взаимную перенастройку или новое согласование; «перестраивались» естественно поддерживает следующую музыкальную метафору.
- source_word: διʼ ἑαυτῶν
  choice: между собой
  rationale: Передаёт взаимный характер изменений без добавления идеи полного превращения одной стихии в другую.
- source_word: ψαλτηρίῳ
  choice: струнном инструменте
  rationale: Называет понятный современному читателю класс инструмента; более узкое «псалтерий» малоупотребительно, а точное отождествление с арфой не обязательно.
- source_word: φθόγγοι
  choice: звуки
  rationale: В музыкальном сравнении слово обозначает различимые тоны или звуки. «Звуки» также позволяет сохранить повтор с ἤχῳ.
- source_word: τοῦ ῥυθμοῦ τὸ ὄνομα διαλλάσσουσιν
  choice: меняют название ритма
  rationale: 'Намеренно сохранены буквальные «название» и «ритм»: греческое выражение сжато и не вполне прозрачно, поэтому перевод не подменяет образ более определённым толкованием.'
- source_word: πάντοτε μένοντα ἤχῳ
  choice: но сами всё время остаются звуками
  rationale: Передана устойчивость звуковой природы при музыкальном изменении. Ближайшим antecedent являются «звуки», хотя грамматическая форма допускает неоднозначность, отмеченную в сноске.
- source_word: ὅπερ ἐστὶν εἰκάσαι ... ἀκριβῶς
  choice: Это можно с точностью заключить
  rationale: εἰκάσαι означает сделать вывод или распознать по свидетельству; ἀκριβῶς передано выражением «с точностью».
- source_word: ἐκ τῆς τῶν γεγονότων ὄψεως
  choice: наблюдая происшедшее
  rationale: Естественно передаёт зрительное наблюдение событий, на котором основан вывод.
theological_decisions:
- issue: Характер стихий и смысл их изменений
  choice: Показать стихии как части сотворённого порядка, поведение которых было перестроено в описанных событиях.
  alternative: Истолковать στοιχεῖα как личностные космические силы или как строго определённые философские первоэлементы.
  rationale: Ближайший контекст говорит о наблюдаемых изменениях природы. Текст не требует ни персонификации стихий, ни привнесения поздней философской системы.
- issue: К чему относится «остающиеся звуком»
  choice: В основном тексте отнести оборот к ближайшему существительному — музыкальным звукам, сохранив альтернативу в сноске.
  alternative: 'Отнести причастие к стихиям: они изменяют своё устройство, оставаясь теми же стихиями.'
  rationale: τὰ στοιχεῖα и φθόγγοι имеют форму среднего рода множественного числа, поэтому πάντοτε μένοντα грамматически может соотноситься с обоими; ближайшая связь со звуками естественнее, но неоднозначность нельзя устранять без оговорки.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Редкое название древнего инструмента заменено понятным «струнный инструмент», тогда как намеренно необычное «меняют название ритма» сохранено из-за трудности и образности греческой фразы. Длинное греческое предложение разделено на два для естественного русского синтаксиса.
