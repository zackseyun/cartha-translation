  text: because after they themselves[a] had turned back from letting them go, and had sent them on with urgency, they would pursue them[b], having changed their minds.
translation:
  language: ru
  text: ибо они сами, изменив решение отпустить их[a] и поспешно отправив их в путь, затем, пожалев об этом[b], погонятся за ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пересмотрев решение позволить им уйти»; буквально: «повернув назад от того, чтобы отпустить их».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «передумав»; греческое слово может обозначать сожаление, ведущее к перемене поступка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: склонившись
  rationale: Передаёт образ поворота или перемены намерения, не дублируя последующее μεταμεληθέντες и сохраняя связь с инфинитивной конструкцией τοῦ ἀπεῖναι.
- source_word: τοῦ ἀπεῖναι
  choice: к тому, чтобы отпустить их
  rationale: В контексте исхода речь идёт не просто об отсутствии людей, а о согласии на их уход; дополнение «их» восстанавливается из контекста.
- source_word: μετὰ σπουδῆς
  choice: поспешно
  rationale: В данном повествовательном контексте σπουδή выражает торопливость и настойчивость, с которой египтяне отправили народ.
- source_word: προπέμψαντες
  choice: отправив их в путь
  rationale: Сохраняет направительный оттенок глагола — отправить дальше, в дорогу, — не утверждая однозначно, что египтяне лично сопровождали их.
- source_word: διώξουσιν
  choice: погонятся за ними
  rationale: Глагол обозначает буквальную погоню; будущее время греческого текста сохранено.
- source_word: μεταμεληθέντες
  choice: пожалеют о своём решении
  rationale: Передаёт сожаление, вызвавшее новую перемену действий, и избегает возможного узкобогословского оттенка слова «раскаются».
theological_decisions:
- issue: Кто действует и к кому относятся местоимения
  choice: Подлежащее — египтяне, а подразумеваемое дополнение — отпущенные ими израильтяне; имена народов в стих не добавлены.
  alternative: Назвать египтян и израильтян прямо либо оставить все дополнения невыраженными.
  rationale: Контекст ясно определяет участников, однако сохранение местоимений не вносит в текст пояснений сверх оригинала.
- issue: Соотношение двух выражений перемены решения
  choice: ἐπιστρέψαντες передано как первоначальное решение отпустить, а μεταμεληθέντες — как последующее сожаление об этом решении.
  alternative: 'Передать оба оборота почти одинаково: «передумав отпускать» и «изменив решение».'
  rationale: Так сохраняются последовательность повествования и напряжение между отпусканием и последующей погоней без ненужного смыслового повтора.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис упрощён для ясности, но порядок действий, будущее время основной глагольной формы и неоднозначность лексики отмечены и сохранены.
