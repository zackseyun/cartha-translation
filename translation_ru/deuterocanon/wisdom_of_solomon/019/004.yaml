base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/004.yaml
  text: For a deserved necessity dragged them to this end[a], and cast forgetfulness of what had happened upon them[b], so that they might beforehand complete the punishment lacking in their torments.
translation:
  language: ru
  text: Ибо заслуженная необходимость влекла их к такому концу[a] и вселила в них забвение того, что произошло, чтобы они заранее довершили кару, которой ещё недоставало их мучениям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «необходимость, которой они заслуживали»; или: «подобающая необходимость». Греческое выражение сочетает нравственную заслуженность или уместность (ἀξία) с непреодолимым принуждением (ἀνάγκη).'
    reason: lexical_alternative
  - marker: b
    text: То есть кару, ещё не доведённую до полноты прежними мучениями. Глагол, переведённый как «заранее довершили», может также означать «заблаговременно восполнили».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷλκεν
  choice: влекла
  rationale: Передаёт настойчивое, принудительное движение к гибельному исходу, не придавая фразе разговорной грубости слова «тащила».
- source_word: ἡ ἀξία ... ἀνάγκη
  choice: заслуженная необходимость
  rationale: Сохраняет необычное сочетание нравственной заслуженности (ἀξία) и непреодолимого принуждения (ἀνάγκη), а также олицетворение необходимости.
- source_word: ἐπὶ τοῦτο πέρας
  choice: к такому концу
  rationale: πέρας обозначает конечный предел или исход; «к такому концу» естественно связывает выражение с описываемой гибельной развязкой.
- source_word: τῶν συμβεβηκότων
  choice: того, что произошло
  rationale: Перфектное причастие обобщённо указывает на уже случившиеся события; перевод не сужает их до какого-либо одного бедствия.
- source_word: ἀμνηστίαν ἐνέβαλεν
  choice: вселила в них забвение
  rationale: Сохраняет образ того, что забвение было внесено в них, но выражает его на естественном современном русском языке.
- source_word: προαναπληρώσωσιν
  choice: заранее восполнили
  rationale: Передаёт как значение полноты/восполнения, так и приставочное значение предварительности, хотя последнее в контексте допускает разные оттенки.
- source_word: τὴν λείπουσαν ... κόλασιν
  choice: наказание, которого ещё недоставало
  rationale: Причастие λείπουσαν указывает на наказание, которое оставалось недостающим или ещё не было завершено.
- source_word: ταῖς βασάνοις
  choice: их мучениям
  rationale: βάσανοι здесь обозначает тяжкие страдания в контексте кары; «мучения» сохраняет эту силу без чрезмерно узкого значения физической пытки.
theological_decisions:
- issue: Кто принуждает египтян и предаёт их забвению
  choice: Грамматическим деятелем оставлена олицетворённая «заслуженная необходимость»; Бог прямо не назван.
  alternative: Явно указать Бога как того, кто по Своему промыслу влёк их и заставил забыть.
  rationale: Греческий текст не называет Бога грамматическим субъектом. Перевод сохраняет напряжение между безличной неизбежностью, нравственным воздаянием и подразумеваемым божественным действием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Необычное олицетворение «заслуженной необходимости» сохранено ради смысловой и богословской неоднозначности оригинала; синтаксис остальной фразы сделан естественным для современного читателя.
