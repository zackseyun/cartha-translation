  source_fidelity: 'Основной смысл передан верно: речь о поражении слепотой, с аллюзией на людей у дверей праведника, и об окутывающей тьме. Однако «кто стоял» вносит отсутствующее в греческом действие, а единственное число «свою дверь» сглаживает исходное множественное θύρων. Заключительная греческая конструкция действительно трудна; контекстуальное «искал/пытался найти проход» допустимо, но сноска должна точнее обозначать, что ἐξῄει буквально относится к выходу, а не к поиску.'
  naturalness: После устранения добавленного «стоял» и сохранения множественного числа перевод остаётся естественным для современного литературного русского. «Окутанные глубокой тьмой» передаёт образ περιβληθέντες ἀχανεῖ σκότει без чрезмерного сужения ἀχανής до одной лишь «непроглядности».
  terminology: «Поражены слепотой» и «праведник» точны и стилистически уместны. Имя Лота оставлено для сноски, поскольку в основном тексте греческое τοῦ δικαίου является нарицательным обозначением. Сноска на Быт 19:11 корректно поясняет аллюзию, не подменяя текст.
