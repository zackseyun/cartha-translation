base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/017.yaml
  text: And they also were struck with blindness[a], like those at the doors of the righteous man, when, wrapped in deep darkness[b], each one kept seeking the way through his own door.
translation:
  language: ru
  text: Они тоже были поражены слепотой[a], как те, что были у дверей праведника, когда, окутанные глубокой тьмой[b], каждый из них пытался найти проход через свои двери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ср. Быт 19:11: мужчины у дверей дома Лота были поражены слепотой и выбились из сил, разыскивая вход.'
    reason: cross_reference
  - marker: b
    text: Конец греческой фразы синтаксически труден. Буквально здесь сказано о том, что каждый «выходил» (ἐξῄει) через «проход своих дверей»; точный смысл неясен. В переводе передан вероятный по контексту Быт 19:11 смысл безуспешных попыток найти проход.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγησαν ... ἀορασίᾳ
  choice: были поражены слепотой
  rationale: Пассив ἐπλήγησαν передаёт сильное поражение, а ἀορασία в данном контексте означает неспособность видеть; формулировка естественна по-русски и сохраняет связь с Быт 19:11.
- source_word: ὥσπερ ἐκεῖνοι ἐπὶ ταῖς τοῦ δικαίου θύραις
  choice: подобно тем, кто стоял у дверей праведника
  rationale: Сравнение и обозначение τοῦ δικαίου сохранены без внесения имени Лота в основной текст. Глагол «стоял» добавлен для естественной передачи локативного оборота в русском языке.
- source_word: ἀχανεῖ ... σκότει
  choice: непроглядной тьмой
  rationale: ἀχανής обозначает безмерную, зияющую или подавляюще глубокую тьму; «непроглядная тьма» идиоматично передаёт и её интенсивность, и невозможность видеть.
- source_word: περιβληθέντες
  choice: объятые
  rationale: Причастие означает окружённость или окутанность; «объятые» сохраняет образ и соответствует достоинству литературного регистра.
- source_word: ἕκαστος
  choice: каждый из них
  rationale: 'Сохранено распределительное значение: каждый человек в отдельности пытался отыскать проход.'
- source_word: τῶν αὐτοῦ θυρῶν τὴν δίοδον ἐξῄει
  choice: пытался найти проход через свою дверь
  rationale: Греческая конструкция текстуально трудна. δίοδος — «проход, путь через», а имперфект ἐξῄει буквально связан с выходом или движением наружу. С учётом контекста Быт 19:11 передан вероятный смысл без утверждения, что попытка увенчалась успехом.
theological_decisions:
- issue: Кого обозначает «праведник»
  choice: Сохранить в основном тексте нарицательное «праведник».
  alternative: Назвать его Лотом.
  rationale: В греческом стоит τοῦ δικαίου, а не имя собственное; имя Лота уместно пояснить в сноске, не подменяя формулировку источника.
- issue: Направление движения в заключительной фразе
  choice: Передать как попытку найти проход через дверь.
  alternative: Перевести буквально как успешный выход через собственные двери.
  rationale: Форма ἐξῄει допускает значение выхода, однако контекст явной аллюзии на Быт 19:11 и трудная конструкция фразы указывают на безуспешное ощупывание входа или прохода; сноска сохраняет сведения о неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Избегаются архаизмы вроде «поражены слепотою» и конфессионально окрашенные уточнения. Образ тьмы сохранён выразительно, а трудность последней греческой конструкции вынесена в сноску.
