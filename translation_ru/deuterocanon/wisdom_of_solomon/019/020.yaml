lexical_decisions:
- source_word: πῦρ
  choice: огонь
  rationale: Прямое соответствие, сохраняющее противопоставление огня и воды.
- source_word: ἴσχυεν
  choice: действовал
  rationale: Передаёт продолжительное проявление силы в несовершенном виде и естественно сочетается с указанием на необычную силу огня.
- source_word: ἐν ὕδατι
  choice: в воде
  rationale: 'Сохраняет пространственный смысл и парадокс: огонь действует внутри среды, которая обычно его гасит.'
- source_word: τῆς ἰδίας δυνάμεως
  choice: сверх собственной силы
  rationale: 'Передаёт вероятное сравнительно-мерное значение родительного падежа: действие огня превосходило присущую ему силу. Иная синтаксическая трактовка приведена в сноске.'
- source_word: ὕδωρ
  choice: вода
  rationale: Прямое соответствие, образующее антитетическую параллель с огнём.
- source_word: τῆς σβεστικῆς δυνάμεως
  choice: о своей способности гасить огонь
  rationale: Естественно по-русски выражает присущую воде способность тушить огонь, не теряя предметного смысла σβεστική.
- source_word: ἐπελανθάνετο
  choice: забывала
  rationale: Сохраняет олицетворение и продолжительный аспект греческого имперфекта.
theological_decisions:
- issue: Олицетворённое описание стихий в контексте чуда
  choice: 'Сохранено буквальное олицетворение: «вода забывала».'
  alternative: «вода переставала гасить огонь» или «вода утрачивала гасящую силу»
  rationale: Автор изображает изменённое поведение творения поэтически; буквальная персонификация сохраняет литературное и богословское напряжение, не добавляя объяснения.
- issue: Неоднозначность τῆς ἰδίας δυνάμεως
  choice: 'Родительный падеж понят сравнительно: «сверх собственной силы».'
  alternative: 'Отнесение выражения к присущей огню силе: «сохранял в воде присущую ему силу».'
  rationale: Конструкция допускает понимание меры или сравнения после ἴσχυεν, однако альтернативная связь также возможна и потому отмечена в сноске, а не устранена.
translation_notes:
  register: Современный литературный русский язык; высокий, но понятный регистр. Антитеза и олицетворение оригинала сохранены, а спорная связь родительного оборота отражена в сноске.
