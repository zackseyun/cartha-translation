- source_word: ἐκάκωσαν
  choice: обрекли
  rationale: В сочетании с дательным πόνοις передаёт причинение зла и страданий; русское выражение «обрекли на страдания» естественно и сохраняет тяжесть действия.
- source_word: πόνοις
  choice: на тяжкие страдания
  rationale: πόνος может обозначать боль, тяготы и страдание. «Тяжкие» естественно передаёт суровость описанного притеснения без чрезмерного усиления.
