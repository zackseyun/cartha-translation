base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/014.yaml
  text: For they did not welcome those who were present as strangers[c][b][a], but these enslaved foreign benefactors.
translation:
  language: ru
  text: Ведь те не принимали незнакомцев[a], когда те были у них, а эти обращали в рабство чужеземцев, которые были их благодетелями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тех, кого не знали»; возможно также: «незнакомых им людей, присутствовавших [там]».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «порабощали чужеземных благодетелей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ... οὗτοι δὲ
  choice: те ... а эти
  rationale: Сохраняет явное противопоставление двух групп, не называя их вопреки лаконичности греческого текста.
- source_word: τοὺς ἀγνοοῦντας
  choice: незнакомцев
  rationale: Субстантивированное причастие обозначает людей, которых не знали; в контексте гостеприимства естественное русское соответствие — «незнакомцы».
- source_word: οὐκ ἐδέχοντο
  choice: не принимали
  rationale: Глагол допускает значения «принимать» и «оказывать приём»; «не принимали» передаёт отказ в приёме без излишнего истолкования.
- source_word: παρόντας
  choice: пришедших к ним
  rationale: Буквально — «находившихся [там], присутствовавших». В данном контексте речь о незнакомцах, оказавшихся среди них; «пришедших к ним» звучит естественно, не добавляя идеи нужды.
- source_word: εὐεργέτας
  choice: которые были их благодетелями
  rationale: 'Передаёт лиц, оказавших им добро, и сохраняет нравственную иронию: в рабство обращены благодетели.'
- source_word: ξένους
  choice: чужеземцев
  rationale: Слово характеризует благодетелей как чужих, иноземных людей; существительное позволяет избежать тяжеловесного сочетания «чужеземных благодетелей».
- source_word: ἐδουλοῦντο
  choice: обращали в рабство
  rationale: Точно выражает действие δουλόω — делать рабами, порабощать — и ясно передаёт принудительный статус.
theological_decisions:
- issue: Историческая идентификация противопоставленных групп
  choice: 'Оставить группы без прямого наименования: «те ... а эти».'
  alternative: Назвать первую группу содомлянами, а вторую египтянами.
  rationale: Сам стих содержит лишь указательные местоимения. Хотя контекст позволяет установить референтов, их внесение в основной текст устранило бы сохранённую оригиналом неявность.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно возвышенный. Противопоставление групп и нравственная ирония оригинала сохранены; неподтверждённое уточнение «нуждавшихся» не добавлено.
