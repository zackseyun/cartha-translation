lexical_decisions:
- source_word: λογισμοὶ
  choice: рассуждения
  rationale: Передаёт процесс размышления и обдумывания, сохраняя отличие от ἐπίνοιαι.
- source_word: θνητῶν
  choice: смертных
  rationale: Сохраняет акцент на смертности и ограниченности людей, а не на их поле.
- source_word: δειλοί
  choice: робки
  rationale: Выражает боязливость и неуверенность человеческих рассуждений, не усиливая значение до нравственно осуждаемой трусости.
- source_word: ἐπισφαλεῖς
  choice: ненадёжны
  rationale: Передаёт неустойчивость и подверженность ошибке; в данном контексте естественнее, чем буквальное «шатки».
- source_word: ἐπίνοιαι
  choice: замыслы
  rationale: Слово обозначает мысленные построения, намерения или планы; «замыслы» сохраняет смысловое отличие от λογισμοί.
- source_word: ἡμῶν
  choice: наши
  rationale: Прямо сохраняет первое лицо множественного числа и включение говорящего в общую человеческую ограниченность.
theological_decisions:
- issue: Антропологический акцент θνητῶν
  choice: смертных
  alternative: людей
  rationale: «Смертных» сохраняет противопоставление ограниченного, подверженного смерти человечества божественной мудрости.
translation_notes:
  register: Современный литературный русский язык; краткий афористичный параллелизм оригинала сохранён. «Робки» и «ненадёжны» естественно характеризуют соответственно рассуждения и замыслы, не устраняя смыслового различия между двумя греческими существительными.
