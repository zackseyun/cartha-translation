lexical_decisions:
- source_word: σοφίᾳ
  choice: мудростью
  rationale: 'Дательный падеж передаёт средство: «мудростью». Это основное значение слова и сквозная тема книги; вариант «пониманием» здесь был бы слишком узким.'
- source_word: ἐσώθησαν
  choice: были спасены
  rationale: Аорист пассива от σῴζω обозначает спасение, избавление или сохранение. «Были спасены» сохраняет широкий смысл греческого глагола и не ограничивает его лишь физическим избавлением.
theological_decisions:
- issue: Смысл спасения в глаголе σῴζω
  choice: были спасены
  alternative: были избавлены; были сохранены
  rationale: Формулировка сохраняет богословскую широту греческого слова, не навязывая ему исключительно позднейший доктринальный смысл; возможный акцент на историческом избавлении или сохранении отмечен в сноске.
