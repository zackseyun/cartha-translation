base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/008.yaml
  text: You said to build a temple on your holy mountain[a], and an altar in the city of your dwelling, an imitation of the holy tent that you prepared from the beginning.
translation:
  language: ru
  text: Ты сказал построить храм на Твоей святой горе и жертвенник в городе Твоего обитания — подобие святого шатра[a], который Ты приготовил от начала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святой скинии». Греческое слово может означать обычный шатёр или, в библейском употреблении, священную скинию.'
    reason: Лексическая альтернатива для σκηνή и пояснение его библейского культового значения.
lexical_decisions:
- source_word: εἶπας
  choice: Ты сказал
  rationale: Передаёт прямое значение аориста λέγω и сохраняет обращение молитвы к Богу, не усиливая его до «Ты повелел».
- source_word: οἰκοδομῆσαι
  choice: построить
  rationale: Естественный русский инфинитив после «сказал», относящийся по смыслу и к храму, и к жертвеннику.
- source_word: ναὸν
  choice: храм
  rationale: Обычное и понятное соответствие греческому ναός в контексте Иерусалимского святилища.
- source_word: ἐν ὄρει ἁγίῳ σου
  choice: на Твоей святой горе
  rationale: Русский язык естественно употребляет «на» при обозначении расположения на горе; «святой горе» точно передаёт ἁγίῳ ὄρει.
- source_word: πόλει κατασκηνώσεώς σου
  choice: в городе Твоего обитания
  rationale: «Обитание» сохраняет значение пребывания и поселения, заложенное в κατασκήνωσις, и звучит достойно в молитвенном контексте.
- source_word: θυσιαστήριον
  choice: жертвенник
  rationale: Устоявшийся русский библейский термин для культового алтаря, на котором приносят жертвы.
- source_word: μίμημα
  choice: подобие
  rationale: Передаёт соответствие земного святилища ранее приготовленному образцу, не уточняя сверх текста, идёт ли речь о точной копии или более общем воспроизведении.
- source_word: σκηνῆς ἁγίας
  choice: святого шатра
  rationale: Буквально и понятно передаёт σκηνή как «шатёр»; традиционное «скиния» дано в примечании.
- source_word: ἣν προητοίμασας
  choice: который Ты приготовил
  rationale: Сохраняет действие предварительного приготовления; временная предшествующая направленность дополнительно выражена словами «от начала».
- source_word: ἀπʼ ἀρχῆς
  choice: от начала
  rationale: Точное и стилистически уместное выражение временной глубины без навязывания философского толкования.
theological_decisions:
- issue: Соотношение земного святилища и заранее приготовленного святого шатра в выражении μίμημα σκηνῆς ἁγίας
  choice: подобие святого шатра
  alternative: копия святой скинии
  rationale: «Подобие» сохраняет утверждаемое текстом соответствие образцу, но не вводит более разработанное учение о небесном первообразе и не делает воспроизведение непременно точной копией.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис оставлен ясным и близким к греческому; прописные местоимения поддерживают принятый русский религиозный регистр. Тире помогает показать, что «подобие святого шатра» характеризует описываемое святилище, не устраняя возможной синтаксической широты связи.
