translation:
  language: ru
  text: И дела мои будут угодны, и я буду справедливо судить Твой народ, и буду достоин престолов моего отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδεκτά
  choice: угодны
  rationale: Передаёт значение «благосклонно приняты, приемлемы» естественным и достойным русским выражением.
- source_word: διακρινῶ
  choice: буду судить
  rationale: В контексте правления означает выносить решения и вершить суд; это соответствует прямому значению глагола.
- source_word: δικαίως
  choice: справедливо
  rationale: Точно передаёт наречие со значением праведного, справедливого суда.
- source_word: θρόνων
  choice: престолов
  rationale: Сохранено грамматическое множественное число греческого текста, несмотря на возможную необычность выражения по-русски.
theological_decisions:
- issue: Число у слова θρόνων
  choice: престолов
  alternative: престола
  rationale: Греческий источник однозначно употребляет форму множественного числа; её следует сохранить, не исправляя по ожиданию читателя или по параллельным традициям.
- issue: Написание местоимения, обращённого к Богу
  choice: Твой
  alternative: твой
  rationale: Прописная буква соответствует принятому русскому благоговейному оформлению прямого обращения к Богу, не меняя смысла исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксический параллелизм трёх частей греческой фразы сохранён; необычное множественное число «престолов» не сглажено.
