  text: You chose me beforehand as king of your people and as judge of your sons and daughters;[a]
translation:
  language: ru
  text: Ты заранее избрал меня царём Твоего народа и судьёй Твоих сыновей и дочерей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначил меня» или «избрал меня заранее»; греческий глагол подразумевает выбор, совершённый заранее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύ
  choice: Ты
  rationale: Явное местоимение сохранено в начале фразы для смыслового акцента и прямого обращения к Богу.
- source_word: προείλω
  choice: заранее избрал меня
  rationale: Передаёт личный характер избрания и временное значение приставки προ-; форма «избрал» естественна для современного литературного русского.
- source_word: βασιλέα
  choice: царём
  rationale: Прямое и контекстуально уместное обозначение царского достоинства; творительный падеж естественно употребляется после «избрал меня».
- source_word: λαοῦ σου
  choice: Твоего народа
  rationale: Родительный падеж оригинала передан без добавления отсутствующего в греческом предлога; принадлежность и отношение царя к народу ясны из контекста.
- source_word: δικαστὴν
  choice: судьёй
  rationale: Сохраняет судебный смысл слова δικαστής, не расширяя его до общего понятия правителя.
- source_word: υἱῶν σου καὶ θυγατέρων
  choice: Твоих сыновей и дочерей
  rationale: Сохраняет явно названные в греческом тексте обе группы, не сводя их к обобщённому «детей».
theological_decisions:
- issue: Характер избрания Соломона на царство
  choice: заранее избрал меня
  alternative: назначил меня; предварительно избрал меня
  rationale: Формулировка сохраняет идею предшествующего Божьего выбора, заключённую в προ-, но не придаёт стиху более широкого догматического смысла о предопределении, чем требует контекст.
- issue: Гендерно конкретная сыновняя лексика
  choice: Твоих сыновей и дочерей
  alternative: Твоих детей
  rationale: Оригинал отдельно называет сыновей и дочерей; перевод сохраняет это различие.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции; синтаксис остаётся ясным и естественным.
