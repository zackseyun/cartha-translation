base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/010.yaml
  text: Send her out from the holy heavens[a], and send her from the throne of your glory, so that, being present with me, she may labor with me[c][b], and I may know what is pleasing to you.
translation:
  language: ru
  text: Ниспошли её со святых небес и пошли её от престола славы Твоей[a], чтобы она, пребывая со мной, трудилась[b] и чтобы я узнал, что угодно Тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Твоего славного престола». Буквально: «от престола славы Твоей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «трудилась со мной»; глагол может подразумевать тяжёлый, напряжённый труд. Мудрость здесь олицетворена как женщина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπόστειλον
  choice: Ниспошли
  rationale: Передаёт направленное ниспослание из небесной сферы и соответствует возвышенному регистру молитвы, не становясь архаичным.
- source_word: ἐξ ἁγίων οὐρανῶν
  choice: со святых небес
  rationale: Сохраняет множественное число οὐρανῶν; предлог «со» естественно сочетается в русском с «небес».
- source_word: ἀπὸ θρόνου δόξης σου
  choice: от престола славы Твоей
  rationale: Сохраняет генитивную конструкцию и торжественный стиль оригинала; возможное более свободное понимание отмечено в сноске.
- source_word: πέμψον
  choice: пошли
  rationale: Передаёт простой глагол отправления и сохраняет параллелизм с более выразительным ἐξαπόστειλον — «ниспошли».
- source_word: συνπαροῦσά μοι
  choice: пребывая со мной
  rationale: Передаёт совместное присутствие Мудрости рядом с говорящим, не добавляя идеи руководства, которой глагольная форма сама по себе не выражает.
- source_word: κοπιάσῃ
  choice: трудилась вместе со мной
  rationale: Глагол означает напряжённо трудиться; «вместе со мной» естественно выражает совместность, заданную ближайшим причастием и контекстом.
- source_word: γνῶ
  choice: я узнал
  rationale: Естественно передаёт аорист конъюнктива в целевой конструкции после ἵνα.
- source_word: τί εὐάρεστόν ἐστιν παρὰ σοί
  choice: что угодно Тебе
  rationale: Современная и естественная русская формула для того, что приятно и приемлемо перед Богом; сохраняет оценочную направленность выражения παρὰ σοί.
theological_decisions:
- issue: Олицетворение Мудрости как женского образа, ниспосылаемого с небес
  choice: Сохранить местоимение женского рода «её» и форму «она»
  alternative: Передать Мудрость как безличное качество либо повторить существительное «Мудрость»
  rationale: Греческие αὐτήν и συνπαροῦσά грамматически и литературно продолжают женское олицетворение Мудрости. Перевод сохраняет этот образ, не отождествляя его с какой-либо позднейшей доктринальной фигурой.
- issue: Совместный труд Мудрости и молящегося
  choice: «трудилась вместе со мной»
  alternative: «помогала мне в трудах»
  rationale: Выбранная формулировка сохраняет сильный образ совместного труда и не сводит роль Мудрости лишь к вспомогательной функции.
translation_notes:
  register: Современный литературный русский язык с молитвенно-возвышенным, но понятным регистром. Заглавные формы «Твоей», «Тебе» следуют принятой русской практике благоговейного обращения к Богу. Сохранены множественное число «небес», женское олицетворение Мудрости и параллелизм двух глаголов посылания.
