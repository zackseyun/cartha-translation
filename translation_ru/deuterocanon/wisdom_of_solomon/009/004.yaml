  text: Give me the wisdom that sits beside your thrones, and do not reject me from among your children.
translation:
  language: ru
  text: Даруй мне мудрость, восседающую рядом с Твоими престолами[a], и не отвергни меня из числа Твоих детей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мудрость, восседающую рядом с Твоим престолом». В греческом тексте слово «престолы» стоит во множественном числе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не отвергни меня из числа Твоих слуг». Греческое слово может означать как «детей», так и «слуг» — в зависимости от контекста.'
    reason: alternative_reading
lexical_decisions:
- source_word: δός
  choice: Даруй
  rationale: Прямое повеление от δίδωμι. «Даруй» естественно звучит в молитве и передаёт просьбу о Божьем даре, не меняя смысла глагола.
- source_word: πάρεδρον
  choice: восседающую рядом
  rationale: πάρεδρος обозначает того, кто сидит рядом как спутник или помощник. «Восседающую рядом» сохраняет пространственный образ престола и олицетворение мудрости.
- source_word: σοφίαν
  choice: мудрость
  rationale: Прямое дополнение и ключевое понятие книги. Строчная буква сохраняет обычное лексическое значение, а причастный оборот ясно передаёт олицетворение.
- source_word: τῶν σῶν θρόνων
  choice: с Твоими престолами
  rationale: В греческом тексте стоит множественное число θρόνων; оно сохранено, несмотря на более привычное в русском единственное число, чтобы не устранять возможный образ небесного царского окружения.
- source_word: ἀποδοκιμάσῃς
  choice: не отвергни
  rationale: Глагол выражает отвержение или признание негодным. «Не отвергни» ясно, естественно и уместно в молитвенной речи.
- source_word: ἐκ παίδων σου
  choice: из числа Твоих детей
  rationale: παῖδες может означать как детей, так и слуг. «Из числа Твоих детей» естественно передаёт ἐκ и сохраняет вероятный сыновний оттенок контекста.
theological_decisions:
- issue: Значение παῖδες применительно к отношениям с Богом
  choice: детей
  alternative: слуг
  rationale: Слово допускает оба значения. Основной текст сохраняет сыновний оттенок молитвы, а реальная лексическая неоднозначность отмечена в сноске без навязывания конфессионального толкования.
- issue: Множественное число θρόνων
  choice: престолами
  alternative: престолом
  rationale: Хотя единственное число привычнее применительно к Богу, греческая форма множественного числа сохранена, чтобы не сглаживать необычный образ и его возможную богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с естественным молитвенным возвышением. Олицетворение мудрости передано без превращения её в отдельное именованное лицо; необычное множественное число «престолами» и неоднозначность παῖδες сохранены и пояснены в сносках.
