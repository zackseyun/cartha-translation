  text: For what man can know the counsel of God? Or who can discern what the Lord wills?[a]
translation:
  language: ru
  text: Ведь кто из людей познает замысел Бога? Или кто постигнет, чего желает Господь?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь кто из людей может узнать намерение Бога? Или кто уразумеет, чего хочет Господь?»'
    reason: Лексические варианты для γνώσεται, βουλή, ἐνθυμηθήσεται и θέλει; «может узнать» явно передаёт подразумеваемое в риторическом вопросе ограничение человеческой способности.
lexical_decisions:
- source_word: τίς γὰρ ἄνθρωπος
  choice: Ведь какой человек
  rationale: Сохраняет причинно-пояснительное γάρ, форму риторического вопроса и единственное число родового ἄνθρωπος; в контексте речь идёт о любом человеке.
- source_word: γνώσεται
  choice: познает
  rationale: Будущая форма сохранена; в риторическом вопросе она также подразумевает ограниченность человеческой способности узнать Божий замысел.
- source_word: βουλὴν θεοῦ
  choice: замысел Бога
  rationale: βουλή может обозначать совет, намерение, решение или замысел. «Замысел» естественен по-русски, сохраняет оттенок целенаправленного намерения и не смешивается с последующим θέλει.
- source_word: ἐνθυμηθήσεται
  choice: постигнет
  rationale: Глагол указывает на внутреннее обдумывание и осмысление; в данном параллелизме «постигнет» передаёт достижение понимания, а не просто размышление.
- source_word: τί θέλει
  choice: чего желает
  rationale: Передаёт божественное желание или воление без сведения выражения к формализованному понятию «воля» и сохраняет отличие от βουλή.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Обычное и контекстуально уместное обозначение Бога для κύριος в библейском тексте.
theological_decisions:
- issue: Родовое значение ἄνθρωπος
  choice: какой человек
  alternative: кто из людей
  rationale: Основной текст сохраняет единственное число и открытую отнесённость ко всякому человеку, не ограничивая смысл мужчинами.
- issue: Соотношение βουλή и θέλει
  choice: замысел Бога ... чего желает Господь
  alternative: решение Бога ... чего хочет Господь
  rationale: 'Перевод сохраняет параллельные, но не полностью тождественные понятия: Божий замысел и то, чего Господь желает; он не навязывает им позднейшую систематическую терминологию.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Риторический параллелизм и два вопроса греческого текста сохранены; архаизмы по возможности исключены.
