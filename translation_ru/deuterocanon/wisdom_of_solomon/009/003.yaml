lexical_decisions:
- source_word: διέπῃ
  choice: править
  rationale: Передаёт управление и устроение мира; форма согласована с зависимостью от предыдущего стиха.
- source_word: κόσμον
  choice: миром
  rationale: Естественный русский эквивалент для κόσμος в значении сотворённого мира.
- source_word: ὁσιότητι
  choice: святости
  rationale: Сохраняет нравственно-религиозный оттенок благочестия и святости.
- source_word: δικαιοσύνῃ
  choice: праведности
  rationale: Передаёт качество справедливого и нравственно верного правления, не смешивая его с κρίσις.
- source_word: ἐν εὐθύτητι ψυχῆς
  choice: с прямотой души
  rationale: Близко к греческой конструкции и сохраняет образ внутренней нравственной прямоты.
- source_word: κρίσιν κρίνῃ
  choice: вершить суд
  rationale: Естественно передаёт греческую однокоренную конструкцию «судить судом», избегая неуклюжего буквального повтора.
theological_decisions:
- issue: Соотношение святости, праведности и суда
  choice: 'Сохранить три самостоятельных элемента: святость, праведность и суд'
  alternative: Свести δικαιοσύνη и κρίσις к общей идее справедливости
  rationale: Греческий текст различает качества правления и само совершение суда; перевод не должен сглаживать это различие.
