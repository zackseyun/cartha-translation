  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/017.yaml
  text: And who has known your counsel[a], unless you have given wisdom and sent your holy Spirit from on high?
translation:
  language: ru
  text: И кто познал Твой замысел, если не Ты даровал мудрость и не послал с высот Твой святой дух[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Твой Святой Дух». Греческий текст буквально говорит «Твой святой дух»; прописные буквы отражают толкование, а не различие в исходном тексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλήν
  choice: замысел
  rationale: Слово βουλή обозначает совет, намерение или замысел. «Замысел» естественно передаёт здесь Божье целенаправленное намерение, не сужая значения до отдельного повеления или желания.
- source_word: ἔγνω
  choice: познал
  rationale: Аорист в риторическом вопросе выражает завершённое достижение знания; «познал» сохраняет этот оттенок и звучит естественно в возвышенной литературной речи.
- source_word: σοφίαν
  choice: мудрость
  rationale: Прямое и традиционное соответствие, сохраняющее интеллектуальную, нравственную и богословскую многозначность термина в литературе Премудрости.
- source_word: τὸ ἅγιόν σου πνεῦμα
  choice: Твой святой дух
  rationale: Буквально — «Твой святой дух». Строчная буква не предрешает, употреблено ли выражение как личное имя; слово «дух» в данном контексте естественнее возможного «дыхание».
- source_word: ἀπὸ ὑψίστων
  choice: с высот
  rationale: Субстантивированное множественное число указывает на небесные высоты. «С высот» кратко и образно сохраняет пространственно-небесный оттенок греческого выражения.
theological_decisions:
- issue: Следует ли писать «Святой Дух» как личное божественное именование
  choice: Твой святой дух
  alternative: Твой Святой Дух
  rationale: Греческое написание само по себе не устанавливает позднейшую русскую догматическую капитализацию. Основной текст сохраняет неоднозначность выражения, а традиционное личностное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с русской религиозно-издательской традицией; богословская неоднозначность выражения «святой дух» сохранена.
