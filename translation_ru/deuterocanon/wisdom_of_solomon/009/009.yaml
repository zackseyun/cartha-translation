  terminology: «Мудрость» со строчной буквы и личными относительными предложениями точно сохраняет олицетворение без догматического отождествления. «Мир» — удачный основной эквивалент κόσμος; примечание может указать вариант «космос» и оттенок упорядоченного мира.
