base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/009.yaml
  text: And with you is wisdom[a], who knows your works, and was present when you made the world, and understands what is pleasing in your eyes and what is right according to your commandments.
translation:
  language: ru
  text: И с Тобой — мудрость[a], которая знает дела Твои, которая присутствовала, когда Ты создавал мир, и понимает, что угодно в Твоих глазах и что справедливо в Твоих заповедях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «космос». Греческое κόσμος может подчёркивать упорядоченность мира.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ σοῦ
  choice: с Тобой
  rationale: Передаёт тесное пребывание рядом и сохраняет естественную для русского языка связь без излишнего уточнения пространственного смысла.
- source_word: ἡ σοφία
  choice: мудрость
  rationale: Обычный эквивалент σοφία; последующие формы женского рода сохраняют олицетворённый образ без навязывания специального догматического отождествления.
- source_word: ἡ εἰδυῖα τὰ ἔργα σου
  choice: которая знает дела Твои
  rationale: Относительное предложение естественно передаёт определительное причастие и его значение устойчивого знания; «дела» охватывают Божьи деяния в широком смысле.
- source_word: παροῦσα
  choice: присутствовала
  rationale: Точно выражает присутствие мудрости при сотворении, не добавляя отсутствующего в греческом образа помощницы или соработницы.
- source_word: ὅτε ἐποίεις τὸν κόσμον
  choice: когда Ты создавал мир
  rationale: Имперфект ἐποίεις передан несовершенным видом; «мир» естественно обозначает κόσμος как устроенное творение.
- source_word: ἐπισταμένη
  choice: ведает
  rationale: Передаёт глубокое, осмысленное знание и позволяет избежать близкого повтора глагола «знает».
- source_word: τί ἀρεστὸν ἐν ὀφθαλμοῖς σου
  choice: что угодно в очах Твоих
  rationale: Сохраняет библейский образ Божьей оценки и остаётся понятным в dignified литературном русском.
- source_word: τί εὐθὲς ἐν ἐντολαῖς σου
  choice: что право согласно заповедям Твоим
  rationale: «Право» передаёт нравственную прямоту εὐθές, а «согласно» выражает нормативное отношение к заповедям, подразумеваемое ἐν.
theological_decisions:
- issue: Олицетворение мудрости
  choice: Сохранить личностное изображение посредством формы «которая знает… присутствовала… ведает», но писать «мудрость» со строчной буквы.
  alternative: Писать «Мудрость» с прописной буквы либо обезличить конструкцию.
  rationale: Греческие причастия ясно поддерживают олицетворение, однако сам стих не требует превращать его в однозначное имя или вводить позднейшее догматическое отождествление.
- issue: Значение κόσμος
  choice: мир
  alternative: космос; вселенная
  rationale: «Мир» естественен для современного литературного русского и достаточно широко обозначает устроенное Божье творение; «космос» звучит технически, а «вселенная» может вносить современный научный оттенок.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Формы «очи» и «угодно» сохраняют образность исходного текста, не делая фразу архаичной в целом. Местоимения, обращённые к Богу, написаны с прописной буквы как русская издательская конвенция.
