  source_fidelity: 'Греческие определения при σοφία переданы в целом верно: мудрость знает Божьи дела, была при создании κόσμος и знает Божьи нравственные мерила. Однако «что право согласно заповедям Твоим» звучит неестественно и несколько меняет синтаксическую связь ἐν ἐντολαῖς σου; лучше сохранить «в Твоих заповедях».'
