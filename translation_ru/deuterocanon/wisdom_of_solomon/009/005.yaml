lexical_decisions:
- source_word: δοῦλος
  choice: раб
  rationale: «Раб» прямо передаёт зависимое положение и уместен в контексте молитвенного самоуничижения; более мягкое «слуга» ослабило бы смысл.
- source_word: υἱὸς τῆς παιδίσκης σου
  choice: сын Твоей рабыни
  rationale: παιδίσκη обозначает рабыню или служанку; «рабыня» сохраняет смысловой параллелизм с δοῦλος и естественно звучит в возвышенной русской речи.
- source_word: ἄνθρωπος ἀσθενής
  choice: человек слабый
  rationale: ἄνθρωπος относится к говорящему как к смертному человеку, а ἀσθενής выражает его немощь и неспособность; прямой перевод сохраняет оба оттенка.
- source_word: ὀλιγόχρονιος
  choice: недолговечный
  rationale: Сложное прилагательное указывает на краткость человеческой жизни; «недолговечный» точно и сжато передаёт этот смысл.
- source_word: ἐλάσσων ἐν συνέσει
  choice: мне недостаёт разумения
  rationale: Греческое сравнительное выражение буквально говорит о меньшей или недостаточной способности понимать. Русская конструкция естественно передаёт недостаточность, не превращая её в полное отсутствие разума.
- source_word: κρίσεως καὶ νόμων
  choice: суда и законов
  rationale: Сохранены родительный падеж и множественное число νόμων. «Суд» оставляет открытыми связанные значения судебного решения, способности судить и отправления правосудия.
theological_decisions:
- issue: Язык рабского положения в обращении к Богу
  choice: «Твой раб» и «сын Твоей рабыни»
  alternative: «Твой слуга» и «сын Твоей служанки»
  rationale: Прямые соответствия сохраняют социальную подчинённость и смирение говорящего, не смягчая их до добровольного служения.
- issue: Степень умственной недостаточности говорящего
  choice: «мне недостаёт разумения»
  alternative: «я лишён разумения» или «я менее разумен»
  rationale: ἐλάσσων выражает сравнительную недостаточность, а не полное отсутствие разумения. Формулировка также не решает преждевременно, идёт ли речь прежде всего о судебном суждении или о понимании установлений.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис остаётся ясным для широкого читателя, а неоднозначность сочетания κρίσεως καὶ νόμων сохранена и пояснена в примечании.
