base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/015.yaml
  text: For a perishable body weighs down the soul[a], and the earthly tent burdens a mind full of cares.
translation:
  language: ru
  text: Ведь тленное тело отягощает душу, и земной шатёр обременяет ум, поглощённый множеством забот[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ум, занятый множеством мыслей».'
    reason: Греческое πολυφρόντιδα может указывать как на множество забот, так и шире — на множество мыслей и размышлений.
lexical_decisions:
- source_word: φθαρτὸν
  choice: тленное
  rationale: Передаёт подверженность тела разрушению и распаду, не сводя смысл только к смертности.
- source_word: σῶμα
  choice: тело
  rationale: Прямой и естественный эквивалент греческого слова.
- source_word: βαρύνει
  choice: отягощает
  rationale: Сохраняет образ тяжести и давления тела на душу.
- source_word: ψυχήν
  choice: душу
  rationale: Сохраняет различие между телом, душой и далее умом, выраженное в греческом тексте.
- source_word: βρίθει
  choice: обременяет
  rationale: Передаёт идею тяжести и сохраняет поэтический параллелизм, не повторяя дословно глагол первой строки.
- source_word: γεῶδες
  choice: земной
  rationale: Передаёт связь с землёй и вещественностью; определение относится к образу шатра.
- source_word: σκῆνος
  choice: шатёр
  rationale: Сохраняет метафору тела как временного жилища; «скиния» звучала бы архаично и чрезмерно культово.
- source_word: νοῦν
  choice: ум
  rationale: Естественно обозначает мыслительную и разумную способность.
- source_word: πολυφρόντιδα
  choice: поглощённый множеством забот
  rationale: Передаёт многозаботливость и умственную занятость, при этом не сужает значение до клинической тревожности.
theological_decisions:
- issue: Различение ψυχή и νοῦς в параллельных образах телесного бремени
  choice: ψυχή передано как «душа», а νοῦς — как «ум»
  alternative: Передать ψυχή как «жизнь» или «личность», а νοῦς — как «разум»
  rationale: Так сохраняется намеренное различение внутренних сторон человека, а поэтическое напряжение между телом, душой и умом не сглаживается.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Параллелизм двух полустиший сохранён; «шатёр» удерживает конкретную метафору временного земного жилища.
