base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/011.yaml
  text: For she knows all things and understands[a], and she will guide me prudently in my actions, and will guard me by her glory.
translation:
  language: ru
  text: Ведь она знает всё и понимает; она будет благоразумно направлять меня в моих делах и хранить меня своей славой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своей славе»; также возможно: «посредством своей славы». Греческий предлог ἐν здесь может иметь локативное или инструментальное значение.'
    reason: Сохранение неоднозначности предлога ἐν в выражении ἐν τῇ δόξῃ αὐτῆς.
lexical_decisions:
- source_word: οἶδε
  choice: знает
  rationale: Передаёт обычное значение глагола знания и сохраняет отличие от следующего συνίει.
- source_word: ἐκείνη
  choice: она
  rationale: Местоимение относится к персонифицированной Премудрости женского рода; русское «она» естественно сохраняет персонификацию.
- source_word: πάντα
  choice: всё
  rationale: Кратко и естественно передаёт всеохватное значение греческого винительного множественного числа.
- source_word: συνίει
  choice: понимает
  rationale: Сохраняет различие между знанием и пониманием, не сливая два греческих глагола.
- source_word: ὁδηγήσει
  choice: будет направлять
  rationale: Передаёт руководство в практической деятельности; форма несовершенного вида естественно выражает продолжающееся водительство.
- source_word: ἐν ταῖς πράξεσί μου
  choice: в моих делах
  rationale: «Дела» естественно охватывают поступки и практические действия, обозначенные πράξεις.
- source_word: σωφρόνως
  choice: благоразумно
  rationale: Передаёт здравомыслие, рассудительность и сдержанность в практическом поведении.
- source_word: φυλάξει
  choice: будет хранить
  rationale: Сохраняет смысл защитного оберегания и соответствует возвышенному, но понятному регистру.
- source_word: ἐν τῇ δόξῃ αὐτῆς
  choice: своей славой
  rationale: 'Творительный падеж передаёт вероятное инструментальное значение ἐν: слава Премудрости выступает средством защиты; пространственное прочтение отмечено в сноске.'
theological_decisions:
- issue: Значение ἐν τῇ δόξῃ αὐτῆς
  choice: 'инструментальное: «своей славой»'
  alternative: 'пространственное: «в своей славе»; также: «посредством своей славы»'
  rationale: Контекст описывает деятельную помощь Премудрости, поэтому инструментальное прочтение естественно, однако греческий предлог ἐν допускает и пространственное понимание; неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «знает всё и понимает» следует греческому тексту и не распространяет явно πάντα на оба глагола. Маркер сноски поставлен непосредственно после неоднозначного выражения.
