translation:
  language: ru
  text: Так были выпрямлены пути тех, кто живёт на земле, и люди были научены тому, что угодно Тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωρθώθησαν
  choice: выпрямились
  rationale: Пассивная форма обозначает исправление, приведение в прямое или правильное состояние. «Выпрямились» естественно сочетается с образом путей и сохраняет метафору.
- source_word: τρίβοι
  choice: пути
  rationale: Слово обозначает тропы или проторённые пути; «пути» сохраняет конкретный образ и его нравственный смысл в литературе мудрости.
- source_word: τῶν ἐπὶ γῆς
  choice: живущих на земле
  rationale: Субстантивированное выражение относится к людям, находящимся на земле. Добавление подразумеваемого «живущих» делает русскую фразу естественной, не сужая значения.
- source_word: τὰ ἀρεστά σου
  choice: тому, что угодно Тебе
  rationale: Субстантивированное прилагательное обозначает угодное Богу. В русском языке собирательная конструкция «тому, что угодно Тебе» звучит естественнее буквального множественного выражения.
- source_word: ἐδιδάχθησαν
  choice: научились
  rationale: Греческий аорист пассивного залога буквально указывает, что люди были научены; русское «научились» идиоматично передаёт достигнутый результат наставления, не называя наставника прямо.
- source_word: ἄνθρωποι
  choice: люди
  rationale: Ἄνθρωποι здесь имеет обобщённое значение и относится ко всему человечеству; современное русское «люди» точно передаёт этот смысл без ненужного указания только на мужчин.
theological_decisions:
- issue: Обобщённое значение ἄνθρωποι
  choice: люди
  alternative: мужи / человеки
  rationale: Контекст говорит о человечестве в целом. «Люди» сохраняет широкий референт греческого слова и соответствует современному литературному русскому языку.
- issue: Агент исправления путей и наставления людей
  choice: сохранён невыраженным
  alternative: явно назвать Бога действующим лицом
  rationale: Обе греческие глагольные формы пассивны и не называют деятеля. Перевод не добавляет прямого указания на Бога, хотя контекст допускает подразумеваемое божественное действие.
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим молитвенно-поэтическому контексту. Сохранён образ выпрямленных путей; синтаксис сделан ясным и естественным. Местоимение «Тебе» написано с прописной буквы как обращение к Богу.
