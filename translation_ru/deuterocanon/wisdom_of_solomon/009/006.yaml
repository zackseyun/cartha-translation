base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/006.yaml
  text: For even if someone is perfect among the sons of men[a], apart from the wisdom that comes from you, he will be regarded as nothing.
translation:
  language: ru
  text: Ведь даже если кто-нибудь совершенен среди сынов человеческих[a], без мудрости, исходящей от Тебя, он будет считаться ничем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди людей». По-гречески буквально: «среди сынов человеческих» — традиционное выражение, обозначающее человечество.'
    reason: Лексическая альтернатива и пояснение буквального антропологического оборота.
lexical_decisions:
- source_word: κἂν γάρ τις ᾖ
  choice: Ведь даже если кто-нибудь
  rationale: κἄν (καί + ἐάν) вводит уступительное условие «даже если», а γάρ сохраняет пояснительную связь с контекстом через «ведь».
- source_word: τέλειος
  choice: совершенен
  rationale: Передаёт возвышенное оценочное значение τέλειος; возможные оттенки полноты и зрелости не сужаются пояснительным пересказом.
- source_word: ἐν υἱοῖς ἀνθρώπων
  choice: среди сынов человеческих
  rationale: Сохраняет буквальный, традиционно-библейский антропологический оборот греческого текста; его общее значение пояснено в сноске.
- source_word: τῆς ἀπὸ σοῦ σοφίας ἀπούσης
  choice: без мудрости, исходящей от Тебя
  rationale: «Без» естественно передаёт отсутствие, выраженное ἀπούσης, а «исходящей от Тебя» сохраняет значение источника в ἀπό без отождествления этой мудрости со всякой человеческой мудростью.
- source_word: εἰς οὐδὲν λογισθήσεται
  choice: он будет считаться ничем
  rationale: Пассивное λογισθήσεται означает «будет сочтён/признан», а εἰς οὐδέν — «ничем»; формулировка сохраняет оценочный, а не онтологический смысл.
theological_decisions:
- issue: Мужской антропологический оборот
  choice: Сохранить в основном тексте «среди сынов человеческих»
  alternative: «среди людей» / «среди человеческого рода»
  rationale: Греческий текст буквально использует традиционное выражение υἱοῖς ἀνθρώπων. Оно относится к человечеству вообще, что отмечено в сноске, но его образная форма не устраняется.
- issue: Происхождение мудрости
  choice: «мудрости, исходящей от Тебя»
  alternative: «Твоей мудрости»
  rationale: Формулировка сохраняет явное указание ἀπό на источник мудрости и не вносит дополнительных догматических уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимение «Тебя» написано с прописной буквы как обращение к Богу; синтаксис остаётся ясным для современного читателя.
