  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/002.yaml
  text: and by your wisdom you made man to rule over the creatures that came into being through you[b][a],
translation:
  language: ru
  text: и мудростью твоей создал человека[a], чтобы он владычествовал[b] над творениями, созданными тобой,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеческий род»; в греческом стоит единственное число «человек», вероятно представляющее всё человечество в контексте творения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «правил»; выражение перекликается с данным человеку поручением владычествовать над творением в книге Бытие.'
    reason: alternative_reading
lexical_decisions:
- source_word: σοφίᾳ
  choice: мудростью
  rationale: 'Творительный падеж естественно передаёт инструментальный дательный: Бог создал человека своей мудростью. «Мудрость» сохраняет ключевое для книги богословское и литературное понятие.'
- source_word: κατεσκεύασας
  choice: создал
  rationale: В контексте творения глагол означает «создать, устроить, приготовить». «Создал» ясно и естественно передаёт смысл, не придавая действию механического оттенка.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Единственное число сохранено и в русском языке естественно обозначает как первого человека, так и человека как представителя всего человечества.
- source_word: ἵνα δεσπόζῃ
  choice: чтобы он владычествовал
  rationale: Конструкция с ἵνα выражает цель, а δεσπόζῃ — реальную власть над творением. «Владычествовал» сохраняет силу глагола и связь с языком повествования о творении.
- source_word: τῶν ... κτισμάτων
  choice: над творениями
  rationale: κτίσματα обозначает сотворённые существа или вещи. «Творения» охватывает обе возможности и звучит естественно в данном контексте.
- source_word: ὑπὸ σοῦ γενομένων
  choice: созданными тобой
  rationale: Причастный оборот указывает на Бога как источник бытия творений. Русская формулировка передаёт божественное действие прямо и избегает тяжеловесного «возникшими через тебя».
theological_decisions:
- issue: Представительное значение ἄνθρωπον в языке творения
  choice: человека
  alternative: человеческий род; человека как представителя человечества
  rationale: 'Единственное число оригинала сохранено без сведения его смысла только к мужчине: в контексте творения «человек» может представлять всё человечество.'
- issue: Сила δεσπόζῃ и отсылка к поручению владычествовать над творением
  choice: чтобы он владычествовал
  alternative: чтобы он правил; чтобы он господствовал
  rationale: «Владычествовал» передаёт предоставленную человеку власть и сохраняет возможное эхо языка Бытия, не добавляя идеи произвольного или жестокого господства.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Владычествовал» выбрано ради силы исходного глагола и отсылки к повествованию о творении; остальная фраза сохраняет ясный, общедоступный синтаксис. Строчная буква в местоимениях, относящихся к Богу, соответствует нейтральной современной издательской норме.
