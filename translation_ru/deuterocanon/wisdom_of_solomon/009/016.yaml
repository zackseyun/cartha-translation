review_pass:
  verdict: revise
  source_fidelity: «Едва постигаем» передаёт общую ограниченность познания, но εἰκάζομεν точнее обозначает предположение, догадку или составление приблизительного представления, а не собственно постижение. «Узнаём» несколько отдаляется от обычного εὑρίσκομεν («находим, обнаруживаем»). «Исследовал до конца» допустимо как экспликация приставочного значения ἐξ-, однако вопросительный глагол можно передать без добавления «до конца», сохранив полноту значения в примечании.
  naturalness: Предлагаемая редакция сохраняет современный литературный и достойный регистр. Оборот «можем составить себе представление» естественен по-русски и передаёт предположительный характер первого глагола. «То, что у нас под руками» — ясный идиоматический эквивалент для доступного, близкого.
  terminology: 'Пространственное противопоставление «на земле / на небесах» сохранено. Не вводятся отсутствующие в стихе понятия Божьего замысла или небесных тайн. Добавленное в черновике «даже» не требуется: нарастающий контраст уже выражен параллелизмом и риторическим вопросом.'
