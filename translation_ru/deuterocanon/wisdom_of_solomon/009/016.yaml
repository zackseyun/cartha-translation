base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/016.yaml
  text: And we can scarcely guess the things on earth[a], and we find the things at hand with labor[b]; but who has traced out the things in the heavens?
translation:
  language: ru
  text: И мы едва можем составить себе представление о том, что на земле, и с трудом находим то, что у нас под руками[a]; а то, что на небесах, кто исследовал?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что в руках»; выражение может означать близкое, непосредственно доступное человеку.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кто проследил?» Греческий глагол подразумевает тщательное исследование, прослеживание до конца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις εἰκάζομεν
  choice: едва постигаем
  rationale: Сочетание передаёт затруднённое и неполное понимание. «Постигаем» естественнее для русского возвышенного контекста, чем буквальное «угадываем», но сохраняет ограниченность человеческого знания благодаря «едва».
- source_word: τὰ ἐπὶ γῆς
  choice: то, что на земле
  rationale: Прямо сохраняет пространственное противопоставление земного небесному, не превращая выражение в отвлечённое «земные дела».
- source_word: τὰ ἐν χερσὶν
  choice: даже то, что у нас под руками
  rationale: Русское идиоматическое выражение передаёт близость и доступность предмета познания; «даже» делает явной подразумеваемую усилительную связь, не меняя смысла.
- source_word: εὑρίσκομεν μετὰ πόνου
  choice: с трудом узнаём
  rationale: Передаёт достижение знания ценой усилий. «Находим» здесь по-русски могло бы ошибочно восприниматься как физическое обнаружение предмета.
- source_word: τὰ δὲ ἐν οὐρανοῖς
  choice: а то, что на небесах
  rationale: Сохраняет множественное число греческого οὐρανοῖς и риторический контраст с тем, что на земле.
- source_word: τίς ἐξιχνίασεν
  choice: кто исследовал до конца?
  rationale: Передаёт значение тщательного прослеживания и полного исследования, заложенное в ἐξιχνιάζω, естественным современным русским оборотом.
theological_decisions:
- issue: Ограниченность человеческого познания небесных реалий
  choice: Сохранён риторический контраст между трудностью познания земного и невозможностью самостоятельно исследовать небесное до конца.
  alternative: Уточнить небесное как Божий замысел или тайны Бога.
  rationale: В самом стихе Божий замысел прямо не назван; такое уточнение преждевременно разрешило бы намеренно сохранённое контекстом напряжение.
