- from: И мы едва постигаем то, что на земле, и с трудом узнаём даже то, что у нас под руками[a]; а то, что на небесах, кто исследовал до конца?[b]
  to: И мы едва можем составить себе представление о том, что на земле, и с трудом находим то, что у нас под руками[a]; а то, что на небесах, кто исследовал?[b]
  rationale: Редакция точнее передаёт εἰκάζομεν как осторожное, приблизительное суждение, εὑρίσκομεν как «находим», а также сохраняет образный и риторический строй греческого текста. Сноски остаются привязанными к соответствующим словам и поясняют существенные лексические возможности.
