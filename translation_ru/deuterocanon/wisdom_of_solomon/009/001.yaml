  source_fidelity: 'Текст точно передаёт все элементы греческого обращения: звательный θεὲ — «Боже», πατέρων без добавленного «наших» — «отцов», Κύριε — «Господи», а также явно выраженное σου в «милости Твоей». Причастие «сотворивший» верно соответствует ὁ ποιήσας; «всё» передаёт τὰ πάντα; творительный «словом Твоим» естественно выражает инструментальное ἐν λόγῳ σου. Неопределённость λόγος не сужена до «повеления».'
