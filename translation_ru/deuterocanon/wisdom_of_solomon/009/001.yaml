translation:
  language: ru
  text: Боже отцов и Господи милости Твоей, сотворивший всё словом Твоим[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повелением Твоим». Буквально по-гречески: «словом Твоим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὲ
  choice: Боже
  rationale: Звательная форма прямого обращения естественно передаётся русской звательной формой «Боже».
- source_word: πατέρων
  choice: отцов
  rationale: В греческом стоит родительный множественного числа без притяжательного местоимения; «отцов» сохраняет эту сдержанность и традиционный смысл праотцов.
- source_word: Κύριε τοῦ ἐλέους σου
  choice: Господи милости Твоей
  rationale: Передаёт прямое обращение, родительную конструкцию и явное σου («Твоей»), не заменяя её более толковательным прилагательным «милостивый».
- source_word: ὁ ποιήσας
  choice: сотворивший
  rationale: Причастие сохраняет синтаксическую связь с обращением; «сотворивший» естественно для речи о Божьем творении и соответствует совершенному аористу.
- source_word: τὰ πάντα
  choice: всё
  rationale: Кратко и полно передаёт всеохватное значение выражения; «всё сущее» было бы толковательным расширением.
- source_word: ἐν λόγῳ σου
  choice: словом Твоим
  rationale: Творительный падеж естественно выражает инструментальное значение ἐν; «слово» сохраняет широту и возможные смысловые отзвуки λόγος, не сужая его до «повеления».
theological_decisions:
- issue: Значение λόγος в контексте творения
  choice: слово
  alternative: повеление
  rationale: «Слово» непосредственно соответствует греческой лексеме и сохраняет возможную межтекстовую и богословскую многозначность, не навязывая позднейшего прочтения; «повеление» допустимо контекстуально, но уже по смыслу.
- issue: Конструкция Κύριε τοῦ ἐλέους σου
  choice: Господи милости Твоей
  alternative: милостивый Господи
  rationale: Выбранный вариант сохраняет существительное «милость», родительную конструкцию и притяжательное местоимение σου; вариант с прилагательным звучит привычнее, но изменяет грамматику и оттенок исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного обращения. Формы «Боже», «Господи» и написание местоимения «Твоей/Твоим» с прописной буквы поддерживают возвышенный библейский регистр; необычная родительная конструкция сохранена ради точности исходного текста.
