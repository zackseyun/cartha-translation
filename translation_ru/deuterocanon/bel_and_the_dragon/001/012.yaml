  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/012.yaml
  text: And seal it with your ring. Then[a], when you come in the morning, if you do not find everything eaten by Bel, we will die—or else Daniel, who is lying against us.
translation:
  language: ru
  text: И запечатай своим перстнем. А утром, когда придёшь, если не найдёшь, что всё съедено Вилом, умрём мы — или умрёт Даниил, который лжёт против нас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который ложно обвиняет нас». Греческий оборот может означать ложь, направленную против кого-либо, в том числе ложное обвинение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφράγισον τῷ δακτυλίῳ σου
  choice: запечатай своей печатью
  rationale: В контексте речь о перстне-печатке царя и удостоверении неприкосновенности входа. По-русски «своей печатью» естественно передаёт действие и функцию перстня, не вводя лишнего пояснения.
- source_word: ἐλθὼν πρωὶ
  choice: когда придёшь утром
  rationale: Причастный оборот естественно передан придаточным времени; πρωί означает утреннее время.
- source_word: πάντα βεβρωμένα
  choice: что всё съедено
  rationale: 'Перфектное страдательное причастие указывает на завершённый результат: всё окажется съеденным.'
- source_word: ὑπὸ τοῦ Βήλ
  choice: Вилом
  rationale: Передано одно имя божества без добавления слова «бог», которого нет в греческом тексте; форма «Вил» соответствует традиционному русскому библейскому именованию.
- source_word: ἀποθανούμεθα
  choice: мы умрём
  rationale: Прямое и современное соответствие форме будущего времени.
- source_word: ὁ ψευδόμενος καθʼ ἡμῶν
  choice: который лжёт на нас
  rationale: Сохраняет буквальный образ направленной против них лжи и не сужает смысл до формального судебного обвинения.
theological_decisions:
- issue: Характер обвинения против Даниила
  choice: который лжёт на нас
  alternative: который ложно обвиняет нас
  rationale: Оборот ψεύδομαι κατά допускает как общее значение лжи против кого-либо, так и обвинительный оттенок. Основной текст сохраняет эту напряжённость, а сноска сообщает более явный обвинительный вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Краткие повелительные и условные конструкции сохранены; архаизмы избегаются.
