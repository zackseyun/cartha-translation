  source_fidelity: 'Требуется уточнить средство запечатывания: τῷ δακτυλίῳ σου означает «своим перстнем/кольцом», а не просто «своей печатью». Также во второй части греческий текст подразумевает глагол «умрёт» при имени Даниила; в русском его следует выразить.'
  naturalness: «Лжёт на нас» разговорно и для современного литературного русского неудачно. «Лжёт против нас» сохраняет направленность κατά и звучит нейтрально. Явное «умрёт Даниил» устраняет синтаксическую неполноту и двусмысленность.
  terminology: Имя «Вил» допустимо как традиционная русская библейская передача Βήλ. «Перстнем» точно передаёт δακτύλιος в контексте запечатывания, не добавляя отсутствующего в тексте обозначения «бог».
