  text: and forty sheep and six measures of wine. And the king revered him and went every day to bow down to him[a], but Daniel bowed down to his God. And the king said to him,
translation:
  language: ru
  text: 'и сорок овец, и шесть мер вина. Царь почитал его и каждый день ходил поклоняться ему[a], а Даниил поклонялся своему Богу. И царь сказал ему:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ходил кланяться ему»; греческий глагол προσκυνέω, употреблённый здесь и далее о Данииле, может означать как поклонение, так и земной поклон — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόβατα τεσσεράκοντα
  choice: сорок овец
  rationale: πρόβατα обычно обозначает овец или мелкий скот; «овец» — естественный и достаточно широкий русский эквивалент.
- source_word: οἴνου μετρηταὶ ἕξ
  choice: шесть мер вина
  rationale: μετρητής — мера объёма жидкости; «мер» передаёт количественный смысл, не навязывая спорного пересчёта в современные единицы.
- source_word: ἐσέβετο αὐτόν
  choice: почитал его
  rationale: σέβομαι может означать почитание или поклонение. «Почитал» сохраняет отличие от следующего προσκυνεῖν и естественно звучит в культовом контексте.
- source_word: ἐπορεύετο καθʼ ἑκάστην ἡμέραν
  choice: каждый день ходил
  rationale: Имперфект выражает регулярное действие; эта формулировка естественно передаёт ежедневный обычай.
- source_word: προσκυνεῖν αὐτῷ / προσεκύνει τῷ θεῷ αὐτοῦ
  choice: поклоняться ему / поклонялся своему Богу
  rationale: Одинаковый русский корень сохраняет намеренный повествовательный контраст между действиями царя и Даниила; многозначность глагола отмечена в сноске.
- source_word: Δανιὴλ
  choice: Даниил
  rationale: Традиционная русская форма библейского имени.
theological_decisions:
- issue: Следует ли передавать προσκυνέω как физическое «кланяться» или культовое «поклоняться»
  choice: В основном тексте использовать «поклоняться» для обоих употреблений προσκυνέω
  alternative: «Кланяться» или «падать ниц» в обоих случаях
  rationale: Контекст явно культовый, а одинаковый перевод обоих употреблений сохраняет литературное противопоставление царя и Даниила. При этом сноска сохраняет лексическую неоднозначность греческого глагола.
- issue: Следует ли одинаково перевести σέβομαι и προσκυνέω
  choice: Различить их как «почитал» и «поклоняться»
  alternative: Передать оба глагола словом «поклоняться»
  rationale: Греческий текст употребляет два разных глагола применительно к царю; различение сохраняет эту особенность и не устраняет смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сохраняет последовательность греческого повествования, но остаётся естественным для современного читателя.
