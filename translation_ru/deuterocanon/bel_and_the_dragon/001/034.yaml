  terminology: «Ангел Господа», «Аввакум», «Вавилон», «Даниил» и «львиный ров» уместны. «Еда» точнее передаёт в данном контексте конкретную переносимую трапезу, чем более общее и несколько книжное «пища», не навязывая времени приёма пищи. Сноски сохраняют неоднозначность ἄριστον и буквальный образ λάκκος τῶν λεόντων.
