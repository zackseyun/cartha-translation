  source_fidelity: 'Переданы все основные элементы греческого текста: неопределённый «ангел Господа», Аввакум, повеление доставить ἄριστον, Вавилон, Даниил и ров львов. Однако исходная русская пунктуация («Даниилу, в львиный ров») синтаксически разрывает конечную направительную группу и может создать впечатление, что «в львиный ров» — приложение к Даниилу, а не место доставки.'
