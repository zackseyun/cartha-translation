  text: And an angel of the Lord said to Habakkuk[a], “Carry the meal that you have to Babylon[b], to Daniel in the lions’ pit.”
translation:
  language: ru
  text: 'И ангел Господа сказал Аввакуму: «Отнеси в Вавилон еду[a], которую ты имеешь, — Даниилу в львиный ров[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пищу», «трапезу» либо «дневную трапезу». Греческое слово обозначает приём пищи, но само по себе не позволяет точно установить время дня.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «львиное логово». Буквально по-гречески: «ров львов» или «яма львов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος Κυρίου
  choice: ангел Господа
  rationale: Перед ἄγγελος нет артикля, поэтому оборот не следует искусственно превращать в титул «Ангел Господень». «Господа» передаёт κύριος как обозначение Бога Израиля.
- source_word: Ἀμβακοὺμ
  choice: Аввакум
  rationale: Употреблена традиционная и общепринятая русская форма имени пророка.
- source_word: Ἀπένεγκε
  choice: отнеси
  rationale: Повелительная форма обозначает перенос еды от Аввакума к Даниилу; «отнеси» естественно передаёт направление от исходной точки.
- source_word: τὸ ἄριστον
  choice: пищу
  rationale: Греческое слово обозначает еду или приём пищи, нередко утренний либо дневной. «Пища» не вводит не указанное прямо время дня.
- source_word: ὃ ἔχεις
  choice: которая у тебя
  rationale: Прямо передаёт относительное придаточное, не добавляя предположений о том, держит ли Аввакум пищу в руках.
- source_word: εἰς Βαβυλῶνα
  choice: в Вавилон
  rationale: Естественная передача направления, выраженного εἰς с названием места.
- source_word: εἰς τὸν λάκκον τῶν λεόντων
  choice: в львиный ров
  rationale: λάκκος буквально означает яму или ров; направление, выраженное εἰς, сохранено. Русское «львиный ров» понятно в данном повествовательном контексте и ближе к образу исходного текста, чем «логово».
theological_decisions:
- issue: Передача κύριος в выражении ἄγγελος Κυρίου
  choice: Господь (род. п. «Господа»)
  alternative: Владыка
  rationale: В данном рассказе κύριος обозначает Бога Израиля; «Господь» является естественным русским титулом и не вносит конфессионального уточнения.
- issue: Определённость выражения ἄγγελος Κυρίου
  choice: ангел Господа
  alternative: Ангел Господень
  rationale: Отсутствие артикля при ἄγγελος поддерживает неопределённое прочтение «один из ангелов», тогда как традиционное написание с прописной буквы может восприниматься как особый титул. Русский язык не требует отдельного неопределённого артикля.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет последовательность адресатов и направлений в греческом тексте; тире помогает ясно показать, что пищу следует доставить в Вавилон именно Даниилу.
