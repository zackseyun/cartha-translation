lexical_decisions:
- source_word: προσκυνεῖς
  choice: поклоняешься
  rationale: Передаёт и внешний жест почтения, и его религиозный смысл, не сводя глагол исключительно к внутреннему поклонению.
- source_word: σέβομαι
  choice: почитаю
  rationale: Сохраняет значение религиозного почитания и позволяет отличить этот глагол от предшествующего προσκυνέω.
- source_word: εἴδωλα χειροποίητα
  choice: рукотворных идолов
  rationale: Естественно и ёмко передаёт культовые изображения, изготовленные человеческими руками, в противопоставлении живому Творцу.
- source_word: τὸν ζῶντα θεόν
  choice: живого Бога
  rationale: Определённость и контраст с безжизненными идолами естественно передаются традиционным русским выражением.
- source_word: τὸν κτίσαντα
  choice: сотворившего
  rationale: Сохраняет возвышенный смысл творческого деяния Бога и причастную конструкцию оригинала.
- source_word: τὸν οὐρανὸν
  choice: небо
  rationale: Обычный русский эквивалент единственного числа в библейской формуле творения.
theological_decisions:
- issue: Незавершённость предложения в предоставленном греческом тексте
  choice: Сохранить незавершённую фразу после καί как «и…»
  alternative: Дополнить фразу словом «землю» из контекста или последующего текста
  rationale: Предоставленный исходный текст обрывается на союзе καί; дополнение отсутствующего объекта скрыло бы состояние данного источника.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Рукотворных» сохраняет заметный библейский оттенок, оставаясь понятным современному читателю; тире перед «живого Бога» подчёркивает контраст. Многоточие после «и» естественно обозначает технически незавершённый исходный текст.
