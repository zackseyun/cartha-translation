  text: And he said[a], “Are the seals intact, Daniel?” And he said, “They are intact, O king.”
translation:
  language: ru
  text: 'И он сказал: «Целы ли печати[a], Даниил?» Даниил ответил: «Целы, царь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Невредимы ли (или: в сохранности ли) печати, Даниил? … Невредимы, царь». В данном контексте вопрос означает, что печати остались ненарушенными.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σῶοι
  choice: целы
  rationale: Прилагательное означает «целы, невредимы, в сохранности». В контексте опечатанного входа «целы» естественно передаёт, что печати не были повреждены или нарушены.
- source_word: αἱ σφραγῖδες
  choice: печати
  rationale: Речь идёт о печатях или оттисках, которыми был защищён вход; русское «печати» точно и понятно передаёт значение.
- source_word: βασιλεῦ
  choice: царь
  rationale: Форма звательного обращения передана прямым обращением «царь», без добавления отсутствующего в греческом притяжательного оттенка.
- source_word: καὶ εἶπεν ... ὁ δὲ εἶπεν
  choice: И он сказал ... Даниил ответил
  rationale: Первое εἶπεν сохранено как «сказал», а второе по функции реплики естественно передано как «ответил». Имя «Даниил» проясняет референт местоимения, уже однозначно названный в вопросе, не меняя смысла.
