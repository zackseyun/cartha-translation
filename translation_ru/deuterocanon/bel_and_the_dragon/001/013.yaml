  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/013.yaml
  text: But they were unconcerned[a], because they had made a hidden entrance under the table, and through it they would go in
translation:
  language: ru
  text: Они же не придавали этому значения[a], потому что заранее сделали под столом потайной вход и через него входили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они отнеслись к этому с презрением»; греческий глагол также может означать «презирать» или «не принимать всерьёз».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεφρόνουν
  choice: не придавали этому значения
  rationale: Глагол может означать «презирать», «смотреть свысока» или «не принимать всерьёз». В данном повествовательном контексте выражение передаёт их пренебрежительную беспечность по отношению к предпринятой мере, не вводя прямо не названный личный объект презрения.
- source_word: πεποιήκεσαν
  choice: заранее сделали
  rationale: Плюсквамперфект указывает на предшествующее действие, которым объясняется их уверенность; наречие «заранее» естественно передаёт эту временную соотнесённость.
- source_word: ὑπὸ τὴν τράπεζαν κεκρυμμένην εἴσοδον
  choice: под столом потайной вход
  rationale: Сохраняется простое пространственное значение τράπεζα — «стол», без уточнения «жертвенник»; «потайной вход» естественно передаёт вход, устроенный так, чтобы оставаться скрытым.
- source_word: διʼ αὐτῆς
  choice: через него
  rationale: Местоимение относится к входу; русский мужской род согласован со словом «вход».
- source_word: εἰσεπορεύοντο
  choice: входили
  rationale: Имперфект передаёт повторявшееся или обычное в прошлом действие; в русском языке форма «входили» естественно сохраняет этот аспект в контексте.
