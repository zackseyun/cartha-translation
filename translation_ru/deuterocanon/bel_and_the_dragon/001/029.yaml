    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τὸν βασιλέα
  choice: придя к царю
  rationale: Деепричастный оборот естественно передаёт предшествующее действие аористного причастия и сохраняет последовательность событий.
- source_word: Παράδος ἡμῖν τὸν Δανιήλ
  choice: Выдай нам Даниила
  rationale: Императив παραδίδωμι требует передачи Даниила в их власть; «выдай» кратко и естественно передаёт требование о выдаче, а ἡμῖν явно сохранено как «нам».
- source_word: εἰ δὲ μή
  choice: иначе
  rationale: Естественная русская формулировка ультиматума, равнозначная буквальному «если же нет».
- source_word: ἀποκτενοῦμέν σε
  choice: мы убьём тебя
  rationale: Прямой эквивалент будущего времени ἀποκτείνω без добавления судебного или морального оттенка.
- source_word: τὸν οἶκόν σου
  choice: весь твой дом
  rationale: «Дом» сохраняет ёмкость οἶκος, способного обозначать не только жилище, но также семью и домочадцев; «весь» делает естественным русский смысл угрозы людям царского дома, не сужая его до кровных родственников.
theological_decisions:
- issue: Объём значения οἶκος в угрозе
  choice: весь твой дом
  alternative: твоих домочадцев; твою семью; твой дом
  rationale: Контекст указывает на угрозу людям, принадлежащим к царскому дому. Основной текст сохраняет традиционно ёмкое «дом», а примечание устраняет возможное понимание только как здания.
translation_notes:
  register: Современный литературный русский язык; речь толпы передана прямо и резко. Синтаксис сохраняет торжественную повествовательную связку «И», но избегает архаизмов.
