  text: And they came to the king and said[a], “Hand Daniel over to us[b]; otherwise we will kill you and your household.”
translation:
  language: ru
  text: 'И, придя к царю, они сказали: «Выдай нам Даниила[a], иначе мы убьём тебя и всех твоих домочадцев[b]».'
  philosophy: optimal-equivalence
  footnotes:
