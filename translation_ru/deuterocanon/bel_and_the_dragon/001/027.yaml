  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/027.yaml
  text: And Daniel took pitch and fat and hair[a], and boiled them together and made cakes, and put them into the dragon’s mouth; and when the dragon had eaten them, it burst apart. And he said, “See your objects of worship.”
translation:
  language: ru
  text: 'Даниил взял смолу, жир и волосы, сварил всё вместе, сделал лепёшки и дал их дракону в пасть. Дракон съел их и разорвался. Тогда Даниил сказал: «Вот предметы вашего поклонения».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот ваши святыни» или «Вот то, что вы почитаете»; греческое слово обозначает предметы, которые почитают или которым поклоняются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίσσαν
  choice: смолу
  rationale: Греческое πίσσα обозначает смолу или дёготь; «смола» — естественное и достаточно широкое соответствие в данном повествовании.
- source_word: στῖρ
  choice: жир
  rationale: Слово обозначает животный жир; общее «жир» не вносит неоправданной конкретизации вроде «сало» или «нутряной жир».
- source_word: τρίχας
  choice: волосы
  rationale: Прямое соответствие греческому множественному числу; оснований обобщать или смягчать образ нет.
- source_word: ἥψησεν ἐπὶ τὸ αὐτό
  choice: сварил всё вместе
  rationale: Передаёт как приготовление посредством варки, так и соединение ингредиентов в одну смесь.
- source_word: μάζας
  choice: лепёшки
  rationale: μᾶζα — сформованная лепёшка или ком из замешанной массы; «лепёшки» ясно передаёт приготовленные порции смеси.
- source_word: εἰς τὸ στόμα τοῦ δράκοντος
  choice: в пасть дракону
  rationale: Для крупного зверя по-русски естественно «пасть»; дательный оборот после «бросил» идиоматично передаёт направление в его рот.
- source_word: φαγὼν διερράγη
  choice: съел их и лопнул
  rationale: Сохраняет последовательность действий и резкий, драматичный смысл насильственного разрыва без лишнего пояснения.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: ваши святыни
  rationale: «Святыни» кратко передаёт почитаемые, сакральные предметы и сохраняет ироническую полемику, не подменяя исходное слово более толковательным «идолы».
theological_decisions:
- issue: Передача τὰ σεβάσματα ὑμῶν в полемике против языческого поклонения
  choice: ваши святыни
  alternative: ваши идолы; предметы вашего поклонения; то, что вы почитаете
  rationale: Греческое слово указывает на почитаемые или сакральные предметы, но само по себе не является прямым эквивалентом слова «идолы». «Святыни» сохраняет широту выражения и позволяет контексту нести полемический смысл.
translation_notes:
  register: Современный литературный русский язык с кратким, динамичным повествованием. «Дракон» сохраняет традиционное и контекстуально обусловленное название существа; «святыни» сохраняет неоднозначность греческого σεβάσματα. Маркер сноски поставлен непосредственно после относящейся к ней реплики.
