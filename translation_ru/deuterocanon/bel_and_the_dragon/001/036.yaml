lexical_decisions:
- source_word: ἐπελάβετο
  choice: схватил
  rationale: Передаёт внезапное и решительное действие; «взял» или «ухватился» звучало бы слабее.
- source_word: ἄγγελος Κυρίου
  choice: ангел Господа
  rationale: В повествовании имеется в виду сверхъестественный посланник; «Господа» прямо передаёт греческое Κυρίου, не вводя отсутствующего в данном свидетельстве божественного имени.
- source_word: τῆς κορυφῆς αὐτοῦ
  choice: за темя
  rationale: Корυφή применительно к голове означает её верхнюю часть, темя. Русское «за темя» естественно и сохраняет телесную конкретность выражения.
- source_word: βαστάσας τῆς κόμης τῆς κεφαλῆς αὐτοῦ
  choice: подняв за волосы на голове
  rationale: Сохраняет образ поднятия и удерживания за волосы, не добавляя значения «длинные локоны», хотя κόμη может обозначать длинные волосы.
- source_word: ἔθηκεν αὐτὸν
  choice: поставил
  rationale: В данном пространственном контексте естественно обозначает помещение человека в определённое место.
- source_word: ἐπάνω τοῦ λάκκου
  choice: над ямой
  rationale: Передаёт пространственное значение «над, выше», не уточняя, стоял ли он у края или находился непосредственно над отверстием.
- source_word: ῥοίζος
  choice: свистящий шум
  rationale: Слово обозначает стремительный свистящий, жужжащий или проносящийся шум. Сочетание передаёт и звук, и ощущение быстрого движения.
theological_decisions:
- issue: Передача κύριος в выражении ἄγγελος Κυρίου
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: В представленном греческом тексте стоит Κυρίου без явно указанного еврейского божественного имени, поэтому не следует вводить особое написание, предполагающее тетраграмматон.
- issue: Незавершённое окончание предоставленного греческого текста
  choice: Перевести только сохранившийся фрагмент и обозначить обрыв многоточием с примечанием
  alternative: Восстановить окончание по другим изданиям или контексту
  rationale: Источник обрывается после артикля τοῦ и не содержит дополнения. Восстановление сделало бы основной текст зависимым от слов, отсутствующих в предоставленном свидетельстве.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Повтор «за темя… за волосы на голове» сохранён ради конкретности исходного текста; незавершённость источника открыто обозначена многоточием и сноской.
