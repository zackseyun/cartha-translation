lexical_decisions:
- source_word: οἱ δὲ
  choice: А они
  rationale: δέ выражает продолжение повествования с лёгким оттенком противопоставления; «А они» естественно передаёт это в современном русском.
- source_word: ἔβαλον
  choice: бросили
  rationale: Аорист βάλλω обозначает решительное действие — «бросить»; этот вариант точнее и выразительнее нейтрального «поместили».
- source_word: εἰς τὸν λάκκον τῶν λεόντων
  choice: в ров со львами
  rationale: λάκκος означает яму или ров, а не логово; конструкция «ров со львами» естественно передаёт место, где содержались львы, не превращая родительный падеж в буквальное владение.
- source_word: ἦν ἐκεῖ
  choice: пробыл там
  rationale: В сочетании с указанием длительности русское «пробыл там» естественно передаёт состояние пребывания в течение названного срока.
- source_word: ἡμέρας ἕξ
  choice: шесть дней
  rationale: Винительный падеж обозначает продолжительность времени; русский винительный «шесть дней» выражает её без дополнительного предлога.
