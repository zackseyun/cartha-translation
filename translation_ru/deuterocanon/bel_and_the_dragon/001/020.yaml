  text: Whose footprints are these? And the king said, “I see the footprints of men and women and children.”
translation:
  language: ru
  text: '«Чьи это следы?» И царь сказал: «Я вижу следы мужчин, женщин и детей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος
  choice: Чьи
  rationale: Вопросительное местоимение в родительном падеже выражает принадлежность или указывает на тех, кто оставил следы; «чьи» естественно передаёт прямой вопрос.
- source_word: ἴχνη
  choice: следы
  rationale: Слово обозначает отпечатки или следы, оставленные ногами; в русском повествовательном контексте «следы» звучит естественнее, чем более узкое «отпечатки ног».
- source_word: ταῦτα
  choice: это
  rationale: Указательное местоимение относится к видимым следам; конструкция «чьи это следы?» является естественным русским соответствием.
- source_word: Ὁρῶ
  choice: Я вижу
  rationale: Прямо и естественно передаёт глагол зрительного восприятия в настоящем времени.
- source_word: ἀνδρῶν
  choice: мужчин
  rationale: Здесь речь идёт именно о взрослых лицах мужского пола, а не о людях вообще.
- source_word: γυναικῶν
  choice: женщин
  rationale: В перечне людей по оставленным следам имеется общее значение «женщины», а не родственное «жёны».
- source_word: παιδίων
  choice: детей
  rationale: Передаёт общее обозначение детей без неоправданного уточнения их возраста.
