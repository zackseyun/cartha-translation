translation:
  language: ru
  text: И Кир Персидский принял царство, а Даниил был близким спутником царя и пользовался большим почётом, чем все его друзья[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придворные» или «приближённые»; при царском дворе «друзьями» могли называть близких к царю людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: принял
  rationale: Передаёт вступление во владение царством, не уточняя, получил ли Кир его по наследству, по праву передачи или иным путём.
- source_word: τὴν βασιλείαν αὐτοῦ
  choice: его царство
  rationale: Сохраняет смысловую широту βασιλεία и неоднозначность местоимения αὐτοῦ; контекст не следует искусственно конкретизировать.
- source_word: συνβιωτής
  choice: близкий спутник
  rationale: Редкое слово буквально указывает на совместную жизнь и тесное общение. Выражение «близкий спутник» естественно передаёт близость к царю, не сводя её ни к простому соседству, ни к официальному придворному званию.
- source_word: ἔνδοξος
  choice: пользовался почётом
  rationale: В данном придворном контексте слово обозначает человека уважаемого и почитаемого; такая передача естественнее буквального «славный».
- source_word: ὑπὲρ πάντας τοὺς φίλους αὐτοῦ
  choice: бо́льшим почётом, чем все его друзья
  rationale: Сравнительное значение ὑπέρ передано явно, а φίλοι сохранено как «друзья»; возможный специальный придворный оттенок отмечен в сноске.
theological_decisions:
- issue: Придворный оттенок слова φίλοι
  choice: друзья
  alternative: придворные или приближённые
  rationale: Основное лексическое значение сохранено в тексте, тогда как возможное употребление φίλοι как обозначения приближённых монарха отражено в сноске без навязывания более узкого толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Ударение в слове «бо́льшим» обозначено для устранения возможного ошибочного прочтения как «большим» в значении размера.
