translation:
  language: ru
  text: И царь увидел, что они так сильно на него давят, и, будучи вынужден, передал им Даниила.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείγουσιν
  choice: давят на него
  rationale: Глагол передаёт настойчивое и сильное давление, а форма настоящего времени — продолжающееся действие. Это естественное современное русское выражение, подходящее к контексту принуждения.
- source_word: σφόδρα
  choice: сильно
  rationale: Наречие усиливает значение предшествующего глагола; сочетание «сильно давят» ясно и естественно передаёт его эмфатическую силу.
- source_word: ἀναγκασθείς
  choice: вынужденный уступить
  rationale: Пассивное причастие указывает, что царь действует под внешним принуждением. Добавление «уступить» естественно по-русски обозначает результат давления, не утверждая физического насилия.
- source_word: παρέδωκεν
  choice: отдал
  rationale: В данном контексте слово означает передачу человека во власть других. «Отдал им Даниила» кратко и естественно передаёт эту передачу.
- source_word: Δανιήλ
  choice: Даниил
  rationale: Традиционная русская форма библейского имени.
theological_decisions:
- issue: Степень принуждения царя
  choice: Царь действует под сильным внешним давлением и вынужден уступить.
  alternative: Царя лишь убедили; либо его принудили физической силой.
  rationale: Сочетание ἐπείγουσιν ... σφόδρα и ἀναγκασθείς описывает настойчивое давление, приведшее к вынужденному поступку, но не уточняет, было ли принуждение физическим.
translation_notes:
  register: Современный литературный русский язык; повествование звучит ясно и достойно. Синтаксическая связь с предыдущим контекстом сохранена начальным «И». Формулировка избегает архаичного «предал», которое может привнести дополнительные богословские ассоциации.
