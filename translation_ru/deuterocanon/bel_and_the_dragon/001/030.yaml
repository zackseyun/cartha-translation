  rationale: Убрана невыраженная в оригинале конкретизация «уступить». Сохранены интенсивность давления (ἐπείγουσιν ... σφόδρα), пассивный характер принуждения (ἀναγκασθείς) и смысл передачи Даниила в распоряжение этих людей (παρέδωκεν αὐτοῖς).
