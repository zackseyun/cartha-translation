  source_fidelity: 'Начальная часть точно передаёт καὶ εἶδεν ὁ βασιλεὺς ὅτι ἐπείγουσιν αὐτὸν σφόδρα: царь видит их сильное, настойчивое давление на него. Однако «вынужденный уступить» добавляет к ἀναγκασθείς конкретизацию «уступить», которой в греческом тексте нет; далее царь именно передаёт Даниила им.'
