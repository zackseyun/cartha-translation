  text: And Habakkuk the prophet was in Judea[a], and he had cooked a stew and crumbled bread into a bowl[c][b], and was going to the field to bring it to the reapers.
translation:
  language: ru
  text: Пророк Аввакум был в Иудее[a]. Он сварил похлёбку[b], накрошил хлеба[c] в миску и шёл в поле, чтобы отнести еду жнецам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в земле Иуды». Греческое слово Ἰουδαία может обозначать Иудею как область, а в некоторых контекстах — землю Иуды.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «варёную пищу».'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте — «хлебы»; по-русски здесь естественнее собирательное «хлеб».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμβακοὺμ ὁ προφήτης
  choice: пророк Аввакум
  rationale: Устоявшаяся русская форма имени и естественный порядок слов; артикль указывает на известного пророка.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: в Иудее
  rationale: Наиболее естественное географическое значение Ἰουδαία в эллинистическом греческом; возможность передачи «в Иуде» сохранена в примечании.
- source_word: ἥψησεν ἕψεμα
  choice: сварил похлёбку
  rationale: Глагол и существительное обозначают приготовление варёной пищи; «похлёбка» естественно передаёт смысл, не уточняя состав блюда.
- source_word: ἐνέθρυψεν ἄρτους
  choice: накрошил хлеба
  rationale: Передаёт дробление хлеба на небольшие куски; родительный «хлеба» естественен после глагола «накрошил», хотя в греческом употреблено множественное число «хлебы/каравай».
- source_word: εἰς σκάφην
  choice: в миску
  rationale: По контексту речь идёт о сосуде для приготовленной еды; «миска» здесь естественнее возможных более буквальных значений вроде «лохань».
- source_word: ἐπορεύετο εἰς τὸ πεδίον
  choice: направился в поле
  rationale: В контексте жатвы πεδίον естественно означает поле, а имперфект описывает начавшееся движение.
- source_word: ἀπενέγκαι τοῖς θερισταῖς
  choice: чтобы отнести еду жнецам
  rationale: Инфинитив выражает цель; дополнение подразумевает приготовленную пищу, поэтому оно ясно выражено по-русски словом «еду».
