lexical_decisions:
- source_word: ΚΑΙ
  choice: И
  rationale: Сохраняет простой повествовательный союз греческого текста, не добавляя явно не выраженного временного оттенка.
- source_word: ὁ βασιλεὺς
  choice: царь
  rationale: В сочетании с личным именем современный русский обычно не требует артиклевого уточнения; «царь Астиаг» естественно передаёт определённого правителя.
- source_word: Ἀστυάγης
  choice: Астиаг
  rationale: Употреблена закрепившаяся в русской исторической и библейской традиции форма имени.
- source_word: προσετέθη
  choice: приобщился
  rationale: Передаёт пассивную по смыслу идиому присоединения к умершим предкам, сохраняя библейскую образность и не сводя выражение к простому «умер».
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  choice: к своим предкам
  rationale: «Предки» ясно выражает родовое значение πατέρες в данном погребально-смертном обороте и звучит естественнее для современного русского читателя, чем буквальное «к своим отцам».
theological_decisions:
- issue: Передача идиомы προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: приобщился к своим предкам
  alternative: был присоединён к своим отцам; умер
  rationale: Сохранена исходная метафора присоединения к предкам и её библейский оттенок; при этом формулировка остаётся понятной и не утверждает больше, чем сам текст.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Идиома сохранена в понятной форме; более буквальная конструкция вынесена в примечание.
