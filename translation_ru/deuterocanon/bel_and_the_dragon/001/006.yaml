lexical_decisions:
- source_word: τὴν γῆν
  choice: землю
  rationale: В данном описании истинного Бога речь идёт о земле как части сотворённого мира, а не об отдельной стране.
- source_word: ἔχοντα πάσης σαρκὸς κυρίαν
  choice: властвующего над всякой плотью
  rationale: Естественная русская формулировка передаёт обладание властью; «всякая плоть» сохраняет широкий библейский оборот, не сужая его до одних людей или до всех живых существ.
- source_word: Οὐ δοκεῖ σοι
  choice: Неужели ты не считаешь
  rationale: В вопросе δοκεῖ σοι означает мнение или представление собеседника. Такая передача естественна по-русски и сохраняет риторический нажим царя.
- source_word: Βὴλ
  choice: Вила
  rationale: Имя поставлено в винительный падеж после глагола «считать»; форма соответствует принятой русской передаче имени Вил.
- source_word: ζῶν θεός
  choice: живым богом
  rationale: Предикативная конструкция без артикля относится к языческому божеству; строчная буква и неопределённый смысл не превращают слова царя в исповедальный титул «живой Бог».
- source_word: ὅσα ἐσθίει
  choice: сколько он ест
  rationale: ὅσα здесь подчёркивает количество пищи как якобы видимое доказательство жизни Вила, а не перечисление съедаемых предметов.
theological_decisions:
- issue: Объём выражения πάσης σαρκὸς в описании Божьей власти
  choice: всякой плотью
  alternative: всеми людьми; всеми живыми существами
  rationale: Сохранён библейский идиом с его намеренно широким объёмом, без искусственного ограничения значения.
- issue: Передача ζῶν θεός в речи языческого царя
  choice: живым богом
  alternative: живым Богом; живым божеством
  rationale: Греческая фраза без артикля называет Вила богом, который якобы жив; она не тождественна исповедальному титулу Бога Израиля.
- issue: Оборванное окончание исходного отрывка
  choice: сохранить незавершённость после «и»
  alternative: восстановить продолжение по иной рукописи или традиционному тексту
  rationale: Предоставленный греческий сегмент оканчивается союзом καὶ. Добавление отсутствующих слов необоснованно устранило бы реальное состояние источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «всякая плоть» сохранён ради библейской образности и смысловой широты; речь царя передана естественно и риторически выразительно. Начало стиха также представляет собой продолжение синтаксической конструкции предыдущего сегмента.
