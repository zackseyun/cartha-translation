  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/042.yaml
  text: Daniel[a], and there is no other besides you. And he pulled him up. But he threw those responsible for his destruction into the pit[b], and they were devoured at once before him.
translation:
  language: ru
  text: Даниил[a], и нет другого, кроме тебя. И он вытащил его. А виновников его гибели он бросил в ров[b], и они тотчас были пожраны перед ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст начинается резко: «Даниил, и нет другого, кроме тебя», по-видимому продолжая речь из предыдущего стиха. В некоторых переводах для плавности добавляют слова наподобие «царь сказал».'
    reason: textual_variant
  - marker: b
    text: 'Или: «в логово». Греческое слово буквально означает «ров», хотя здесь имеется в виду ров со львами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν πλὴν σοῦ ἄλλος
  choice: нет другого, кроме тебя
  rationale: Передаёт исключительность и обращение к Даниилу без добавления отсутствующих в греческом тексте слов.
- source_word: ἀνέσπασεν
  choice: вытащил
  rationale: Естественно передаёт извлечение снизу вверх изо рва; местоимение «его» сохраняет объект из контекста.
- source_word: τοὺς ... αἰτίους τῆς ἀπωλείας αὐτοῦ
  choice: виновников его гибели
  rationale: «Виновники» выражает и причинную ответственность, и вину; «гибель» сохраняет широту ἀπώλεια, не сводя её формально только к смерти.
- source_word: ἐνέβαλεν εἰς τὸν λάκκον
  choice: бросил в ров
  rationale: «Ров» буквально и уместно передаёт λάκκος, тогда как «львиный ров» было бы контекстуальным уточнением.
- source_word: κατεβρώθησαν
  choice: были растерзаны
  rationale: В контексте львов это естественное русское соответствие со значением «были пожраны», сохраняющее пассивную конструкцию и выразительность.
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Кратко и в достойном повествовательном регистре передаёт немедленность.
- source_word: ἐνώπιον αὐτοῦ
  choice: у него на глазах
  rationale: Идиоматически передаёт действие в чьём-либо присутствии; местоимение по контексту относится к царю.
theological_decisions:
- issue: Обрывочное начало фразы в греческом свидетельстве
  choice: Сохранить прямое обращение к Даниилу, не добавляя в основной текст указания «царь сказал».
  alternative: 'Добавить для плавности: «И царь сказал: „Даниил…“»'
  rationale: Греческий текст начинается с обращения «Даниил» и продолжает предыдущую речь; добавление говорящего устранило бы подлинную синтаксическую неровность источника.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Резкость начала сохранена и разъяснена в сноске; кавычка закрывает прямую речь, начатую в предыдущем стихе. Формулировки понятны широкому читателю и не вносят конфессиональных толкований.
