  terminology: «Ров» удачно передаёт λάκκος; «виновников его гибели» допустимо передаёт τοὺς αἰτίους τῆς ἀπωλείας αὐτοῦ. Для κατεβρώθησαν предпочтительно «были пожраны», поскольку это прямо выражает поедание.
