base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/040.yaml
  text: He set Habakkuk down at once in his own place[a]. Then the king came on the seventh day to mourn for Daniel, and he came to the pit and looked in, and behold[b], Daniel was sitting there.
translation:
  language: ru
  text: Он тотчас возвратил Аввакума на его место. А царь пришёл на седьмой день оплакать Даниила. Подойдя к яме, он заглянул туда — и вот, Даниил сидит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  choice: возвратил
  rationale: В данном контексте глагол обозначает, что Аввакум после чудесного перенесения вновь оказался на прежнем месте; «возвратил» естественно передаёт это движение, не уточняя способ.
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Сохраняет значение немедленности и соответствует достоинству повествовательного регистра.
- source_word: εἰς τὸν τόπον αὐτοῦ
  choice: на его место
  rationale: Буквально и естественно передаёт направление возвращения; местоимение отнесено к Аввакуму.
- source_word: πενθῆσαι
  choice: оплакать
  rationale: Передаёт целенаправленный траур царя, который считает Даниила погибшим, без добавочного богословского истолкования.
- source_word: λάκκον
  choice: ров
  rationale: Греческое λάκκος обозначает яму или углубление; «ров» согласуется с устойчивым русским обозначением места со львами, оставаясь шире специализированного «логово».
- source_word: ἐνέβλεψεν
  choice: заглянул туда
  rationale: Передаёт направленный внутрь взгляд и звучит естественно по-русски после упоминания рва.
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет внезапность обнаружения и повествовательную выразительность частицы.
- source_word: καθήμενος
  choice: сидит
  rationale: Настоящее историческое после «и вот» живо передаёт увиденную царём картину и естественно звучит по-русски.
theological_decisions:
- issue: Цель прихода царя к Даниилу
  choice: оплакать Даниила
  alternative: скорбеть о Данииле
  rationale: Формулировка сохраняет подразумеваемое ожидание смерти Даниила и эмоциональную силу действия, не утверждая от лица повествователя, что Даниил действительно умер.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским повествовательным тоном. Синтаксис слегка уплотнён во втором предложении, чтобы избежать тяжёлого буквального повтора «пришёл… и пришёл», при сохранении последовательности действий.
