  text: And Daniel said[a], “I will bow down to the Lord my God, because he is the living God.”
translation:
  language: ru
  text: 'И сказал Даниил: «Я поклонюсь[a] Господу, Богу моему, потому что Он — Бог живой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду поклоняться Господу, Богу моему». Греческий глагол может обозначать как поклон, так и поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσω
  choice: поклонюсь
  rationale: Глагол обозначает почтительное поклонение, часто выражаемое телесным преклонением. Русское «поклонюсь» естественно сохраняет и внешний жест, и религиозный смысл без излишнего уточнения.
- source_word: Κυρίῳ τῷ θεῷ μου
  choice: Господу, Богу моему
  rationale: Оба существительных стоят в дательном падеже и называют того, кому поклонится Даниил. Приложение с запятой точно и естественно передаёт греческое сочетание.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание для поклонения; причинное значение ясно выражено современным русским оборотом.
- source_word: θεὸς ζῶν
  choice: Бог живой
  rationale: Именная часть сказуемого без артикля качественно характеризует Бога как живого, в противопоставлении идолу. Порядок «Бог живой» сохраняет выразительность исходной формулы и не превращает её в определённое наименование без необходимости.
theological_decisions:
- issue: Передача προσκυνέω как телесного жеста или как религиозного поклонения
  choice: поклонюсь
  alternative: паду ниц; буду поклоняться
  rationale: '«Поклонюсь» сохраняет присущую греческому глаголу смысловую широту: и почтительный телесный жест, и поклонение Богу. Более конкретное «паду ниц» переопределило бы позу, а «буду поклоняться» могло бы звучать как длительная практика, тогда как форма будущего времени обозначает предстоящее действие.'
- issue: Определённость выражения θεὸς ζῶν
  choice: Он — Бог живой
  alternative: Он — живой Бог; Он — Бог, который жив
  rationale: Греческое безартиклевое именное сказуемое допускает качественный акцент. Выбранная формулировка сохраняет его и подчёркивает контраст с безжизненным идолом, не вводя неопределённого артиклевого смысла, отсутствующего в русском языке.
- issue: Передача κύριος применительно к Богу Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — естественное и традиционно узнаваемое соответствие κύριος в исповедании «Господь, Бог мой», без внесения дополнительных конфессиональных уточнений.
translation_notes:
  register: Современный литературный русский с библейской торжественностью без архаической грамматики. Инверсия «Богу моему» сохраняет достоинство исповедальной речи; местоимение «Он» написано с прописной буквы согласно устойчивой русской религиозной издательской практике.
