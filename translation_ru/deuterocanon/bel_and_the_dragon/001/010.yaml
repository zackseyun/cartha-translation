revisions:
- from: 'Даниил сказал царю: «Пусть будет по твоему слову». Священников Вила было семьдесят, не считая женщин и детей; и он вошёл[a].'
  to: 'Даниил сказал царю: «Пусть будет по твоему слову». У Вила было семьдесят жрецов, не считая женщин и детей; и он пришёл.'
  rationale: Заменено контекстуально предполагаемое «вошёл» на прямое «пришёл», чтобы не добавлять место назначения и сохранить синтаксическую неопределённость оригинала. Связанный с этим пояснением подстрочник больше не требуется. «Священников» заменено на «жрецов» как более обычное современное обозначение служителей языческого культа; смысл не изменён.
