lexical_decisions:
- source_word: Γινέσθω κατὰ τὸ ῥῆμά σου
  choice: Пусть будет по твоему слову
  rationale: Сохраняет форму повелительного наклонения третьего лица и торжественную формулу согласия, не усиливая ῥῆμα до значения «приказ».
- source_word: ἱερεῖς τοῦ Βὴλ
  choice: священников Вила
  rationale: Естественная русская передача служителей культа с традиционным склонением имени Вил.
- source_word: ἑβδομήκοντα
  choice: семьдесят
  rationale: Прямая передача количественного числительного.
- source_word: ἐκτὸς γυναικῶν καὶ τέκνων
  choice: не считая женщин и детей
  rationale: Ясно показывает, что женщины и дети не включены в число семидесяти.
- source_word: ἦλθεν
  choice: он вошёл
  rationale: Контекстуально естественная передача движения внутрь; место назначения в самом стихе не названо и поясняется сноской.
