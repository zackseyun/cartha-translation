lexical_decisions:
- source_word: οἱ δὲ ἱερεῖς
  choice: Но… жрецы
  rationale: δέ передаёт переход с лёгким противопоставлением; для служителей языческого божества естественно современное русское «жрецы».
- source_word: ἦλθον
  choice: пришли
  rationale: Прямое повествовательное соответствие аористу ἔρχομαι.
- source_word: τὴν νύκτα
  choice: ночью
  rationale: Естественно передаёт временной винительный и сохраняет указание на ночное время.
- source_word: κατὰ τὸ ἔθος αὐτῶν
  choice: по своему обычаю
  rationale: Близко передаёт устойчивую привычную практику и звучит естественно по-русски.
- source_word: καὶ αἱ γυναῖκες
  choice: и женщины
  rationale: γυναῖκες может обозначать как женщин вообще, так и жён; сама формулировка стиха не позволяет однозначно выбрать более узкое значение.
