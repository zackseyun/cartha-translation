lexical_decisions:
- source_word: διόλου καὶ ἀνήλουν αὐτά
  choice: и всё съедали без остатка
  rationale: Оборот передаёт полное употребление пищи; «без остатка» естественно выражает усилительное διόλου и сохраняет связь с предшествующим повествованием.
- source_word: παρέθηκεν τὰ βρώματα τῷ Βήλ
  choice: поставил пищу перед Вилом
  rationale: παρατίθημι обозначает помещение или подачу пищи перед кем-либо; формулировка сохраняет ритуальный смысл приношения, не добавляя его прямо в текст.
- source_word: παιδαρίοις
  choice: юным слугам
  rationale: Слово может обозначать мальчиков или молодых прислужников; контекст распоряжения Даниила указывает на служебную роль, а определение сохраняет возрастной оттенок.
- source_word: τέφραν
  choice: пепел
  rationale: Естественное русское собирательное обозначение вещества, рассыпанного по полу для обнаружения следов.
- source_word: κατέσποραν ὅλον τὸν ναόν
  choice: рассыпали его по всему храму
  rationale: Передаёт распространение пепла по всей площади святилища; «храм» является обычным соответствием ναός в данном контексте.
- source_word: ἐνώπιον τοῦ βασιλέως μόνου
  choice: в присутствии одного лишь царя
  rationale: Грамматическое согласование указывает на царя как единственного присутствовавшего при рассыпании пепла; русская формулировка сохраняет это смысловое ударение.
- source_word: ἐσφραγίσαντο ἐν τῷ δακτυλίῳ τοῦ βασιλέως
  choice: запечатали её царским перстнем
  rationale: Перстень служит официальной царской печатью; краткая русская формулировка передаёт и средство, и властный статус печати.
