lexical_decisions:
- source_word: τὰ τέκνα αὐτῶν
  choice: их дети
  rationale: τέκνα — общее обозначение детей, а не только сыновей; καί передаёт продолжение перечня посредством «и».
- source_word: κατέφαγον πάντα
  choice: съели всё без остатка
  rationale: Приставочный глагол κατέφαγον выражает полное поедание; «без остатка» естественно передаёт усиление, а πάντα — полноту объекта.
- source_word: ἐξέπιον
  choice: выпили всё
  rationale: Глагол означает «выпили до конца/целиком»; контекстуальное «всё» передаёт полноту действия без тяжеловесного повтора.
- source_word: ὤρθρισεν ... πρωί
  choice: рано утром ... встал
  rationale: ὤρθρισεν уже указывает на ранний подъём, а πρωί усиливает утреннее временное значение; сочетание «рано утром встал» сохраняет оба элемента естественным русским оборотом.
- source_word: Δανιὴλ μετʼ αὐτοῦ
  choice: Даниил был с ним
  rationale: В греческом это краткая безглагольная конструкция; в русском добавление связки «был» необходимо для ясного и естественного повествования.
