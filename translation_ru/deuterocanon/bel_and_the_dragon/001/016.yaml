  text: And their children too[a], and they ate up everything and drank it all. Then the king rose early in the morning, and Daniel with him.
translation:
  language: ru
  text: и их дети[a]; они съели всё без остатка и выпили всё. Рано утром царь встал, и Даниил был с ним.
  philosophy: optimal-equivalence
  footnotes:
