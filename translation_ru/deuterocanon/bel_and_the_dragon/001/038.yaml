  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/038.yaml
  text: Take the meal that God has sent you. And Daniel said[a], “For you have remembered me, O God, and have not forsaken those who love you.”
translation:
  language: ru
  text: '«Возьми пищу[a], которую послал тебе Бог». И Даниил сказал: «Ведь ты вспомнил обо мне, Боже, и не оставил тех, кто любит тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лучшую часть»; возможно также: «отборную пищу» или «трапезу». Греческое выражение может обозначать превосходную пищу либо главную трапезу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβε
  choice: Возьми
  rationale: Аористный императив от λαμβάνω передаёт прямое повеление; «возьми» естественно в ситуации передачи пищи.
- source_word: τὸ ἄριστον
  choice: пищу
  rationale: В данном контексте слово обозначает пищу или основную трапезу, доставленную Аввакумом. Нейтральное «пищу» ясно передаёт предмет речи, а возможный оттенок лучшей или отборной части сохранён в сноске.
- source_word: ἀπέστειλέν
  choice: послал
  rationale: Аорист обозначает совершившееся действие; в русском контексте естественна форма прошедшего времени «послал».
- source_word: Ἐμνήσθης
  choice: вспомнил обо мне
  rationale: Депонентная форма передаёт деятельную заботливую память; сочетание «вспомнил обо мне» естественно для молитвенной речи и не сводит смысл к простому воспоминанию факта.
- source_word: ἐγκατέλιπες
  choice: не оставил
  rationale: Глагол означает оставить или покинуть; «не оставил» сохраняет силу утверждения и естественно звучит в обращении к Богу.
- source_word: τοὺς ἀγαπῶντάς
  choice: тех, кто любит тебя
  rationale: Субстантивированное причастие передано естественной русской конструкцией; объект любви восстановлен из прямого обращения к Богу.
theological_decisions:
- issue: Не выраженный в сохранившейся греческой формулировке объект при «любящих»
  choice: тех, кто любит тебя
  alternative: тех, кто любит Бога
  rationale: Даниил непосредственно обращается к Богу («Боже»), поэтому подразумеваемый объект естественно передать местоимением второго лица. Это грамматическое прояснение, а не доктринальное добавление.
- issue: Связка γάρ в молитвенном ответе Даниила
  choice: Ведь
  alternative: Ибо
  rationale: «Ведь» сохраняет пояснительно-обосновывающую функцию γάρ и звучит естественно в современной русской прямой речи; «ибо» было бы заметно архаичнее.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной молитвенной интонацией. Обращение «Боже» сохраняет достоинство оригинала; местоимения, относящиеся к Богу, написаны со строчной буквы в соответствии с обычной современной орфографией и без внесения конфессиональной стилизации.
