base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/032.yaml
  text: There were seven lions in the pit[a], and each day they were given two bodies and two sheep; but then nothing was given to them, so that they might devour Daniel.
translation:
  language: ru
  text: В яме было семь львов. Каждый день им давали по два тела[a] и по две овцы, но тогда им ничего не дали, чтобы они пожрали Даниила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по два трупа» либо «по две туши»; в греческом тексте буквально сказано «тела» (σώματα), а из контекста ясно, что речь идёт о пище для львов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκῳ
  choice: яме
  rationale: Слово обозначает яму или углубление; «яма» ближе к греческому, чем контекстуально возможное «львиный ров».
- source_word: ἑπτὰ λέοντες
  choice: семь львов
  rationale: Прямое соответствие числительного и существительного.
- source_word: ἐδίδοτο αὐτοῖς τὴν ἡμέραν
  choice: каждый день им давали
  rationale: Несовершенный вид и временной оборот передают обычное, повторявшееся ежедневное кормление.
- source_word: δύο σώματα
  choice: по два тела
  rationale: σώματα буквально означает «тела». Контекст допускает значение трупов или туш, но основной текст сохраняет более широкое выражение источника; «по» естественно отмечает ежедневную норму.
- source_word: δύο πρόβατα
  choice: по две овцы
  rationale: Обычное значение πρόβατα; «по» согласует выражение с ежедневной нормой кормления.
- source_word: τότε δὲ οὐκ ἐδόθη αὐτοῖς
  choice: но тогда им ничего не дали
  rationale: Естественная русская передача отрицательной пассивной конструкции и противопоставления тогдашнего случая обычному кормлению.
- source_word: ἵνα καταφάγωσιν
  choice: чтобы они пожрали
  rationale: «Пожрали» передаёт усиленное значение полного съедения и подходит к хищным зверям, сохраняя целевое значение ἵνα.
- source_word: τὸν Δανιήλ
  choice: Даниила
  rationale: Традиционная русская форма имени в требуемом винительном падеже.
