  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/028.yaml
  text: And it happened that when the Babylonians heard[a], they became indignant and gathered together against the king and said, “The king has become a Jew; he has torn down Bel and killed the dragon and slaughtered the priests.”
translation:
  language: ru
  text: 'И случилось: когда вавилоняне услышали, они вознегодовали, собрались против царя и сказали: «Царь стал иудеем[a]! Он разрушил Вила, убил дракона и перебил жрецов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иудеянином». Греческое слово Ἰουδαῖος может обозначать как этническую и религиозную принадлежность («иудей»), так и принадлежность к Иудее в географическом или политическом смысле («иудеянин»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς ἤκουσαν
  choice: 'И случилось: когда ... услышали об этом'
  rationale: Сохраняет повествовательную переходную формулу, не усиливая значение до «как только». Дополнение «об этом» естественно передаёт подразумеваемый объект глагола «услышали».
- source_word: οἱ Βαβυλώνιοι
  choice: вавилоняне
  rationale: Естественное русское обозначение жителей или народа Вавилона.
- source_word: ἠγανάκτησαν
  choice: вознегодовали
  rationale: Передаёт сильное возмущение и негодование, не доводя смысл до прямо не выраженной ярости.
- source_word: συνεστράφησαν ἐπὶ τὸν βασιλέα
  choice: собрались против царя
  rationale: Сохраняет как коллективное действие, так и враждебную направленность, не вводя более узкого значения тайного заговора.
- source_word: Ἰουδαῖος γέγονεν ὁ βασιλεύς
  choice: Царь стал иудеем
  rationale: В контексте обвинение касается присоединения царя к народу и вере Даниила; при этом возможный географическо-политический оттенок отмечен в сноске.
- source_word: τὸν Βὴλ κατέσπασεν
  choice: Он сокрушил Вила
  rationale: Глагол обозначает низвержение или разрушение. «Сокрушил» сохраняет прямой объект и допускает, что речь идёт о божестве, представленном его изваянием или святилищем.
- source_word: τὸν δράκοντα ἀπέκτεινεν
  choice: убил дракона
  rationale: Прямая и современная передача обычного глагола со значением лишения жизни.
- source_word: τοὺς ἱερεῖς κατέσφαξεν
  choice: перебил жрецов
  rationale: Передаёт усиленное значение насильственного массового убийства; «жрецы» уместно обозначает служителей языческого культа.
theological_decisions:
- issue: Значение Ἰουδαῖος
  choice: иудей
  alternative: иудеянин / житель Иудеи
  rationale: Основной вариант лучше передаёт этнорелигиозную силу обвинения в данном контексте. Однако греческое слово может также обозначать географическо-политическую принадлежность к Иудее, поэтому эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским повествовательным звучанием. Формула «И случилось» сохраняет характер исходного повествования; лексика остаётся понятной современному читателю.
