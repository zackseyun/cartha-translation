  text: And there was a great dragon[a], and the Babylonians worshiped it.
translation:
  language: ru
  text: И был большой дракон[a], и вавилоняне поклонялись ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «большой змей». Греческое слово может обозначать дракона или большого змея.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: дракон
  rationale: Греческое слово обозначает дракона или огромного змея; «дракон» сохраняет традиционное название существа в этом повествовании и не сужает образ до обычной змеи.
- source_word: μέγας
  choice: огромный
  rationale: В сочетании с названием живого существа слово естественно указывает прежде всего на крупный размер; «огромный» звучит по-русски яснее, чем буквальное «великий дракон».
- source_word: ἐσέβοντο
  choice: поклонялись
  rationale: В данном культовом контексте глагол выражает религиозное почитание. Русское «поклонялись» ясно передаёт это значение, не добавляя подробностей о характере культа.
- source_word: οἱ Βαβυλώνιοι
  choice: вавилоняне
  rationale: Прямое и естественное обозначение жителей или народа Вавилона.
theological_decisions:
- issue: Характер отношения вавилонян к дракону
  choice: Религиозное почитание передано словом «поклонялись».
  alternative: «почитали»
  rationale: Контекст представляет дракона как объект культа. При этом примечание сохраняет более широкую лексическую возможность почитания или благоговения.
translation_notes:
  register: 'Современный литературный русский язык с кратким, повествовательным синтаксисом. Оборот «которому поклонялись» естественнее по-русски, чем буквальное повторение союза: «и вавилоняне поклонялись ему».'
