base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/011.yaml
  text: The king went with Daniēl into the house of Bel. And the priests of Bel said, “Look, we are going outside. But you, O king, set out the food, and after mixing the wine, set it out, and shut the door.”
translation:
  language: ru
  text: 'Царь вместе с Даниилом вошёл в дом Бела.[a] Священники Бела сказали: «Вот, мы выходим, а ты, царь, поставь еду, смешай вино и поставь его, а дверь закрой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм Бела». Буквально: «дом Бела» — так могло называться святилище или храм божества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς μετὰ Δανιὴλ εἰς τὸν οἶκον τοῦ Βήλ
  choice: Царь вместе с Даниилом вошёл в дом Бела
  rationale: Греческий текст представляет эллиптическую повествовательную фразу без выраженного глагола движения; по контексту естественно восполнено «вошёл». μετά с родительным передаёт сопровождение, а οἶκος сохранено как «дом», не заменяясь в основном тексте на толковательное «храм».
- source_word: Ἰδοὺ ἡμεῖς ἀποτρέχομεν ἔξω
  choice: Вот, мы выходим
  rationale: ἰδού передано современным вводным «вот», привлекающим внимание. ἀποτρέχομεν может буквально подразумевать отбегание, но здесь обозначает уход наружу; «выходим» естественно передаёт контекстуальный смысл без излишнего акцента на скорости.
- source_word: σύ δέ, βασιλεῦ
  choice: а ты, царь
  rationale: δέ выражает сопоставление действий священников и царя; звательный βασιλεῦ передан прямым обращением «царь».
- source_word: παράθες τὰ βρώματα
  choice: поставь еду
  rationale: παρατίθημι означает поставить или положить перед кем-либо, а βρώματα — пищу, съестные припасы. «Поставь еду» звучит естественно в описании приготовленного приношения.
- source_word: τὸν οἶνον κεράσας θές
  choice: смешай вино и поставь его
  rationale: 'Аористное причастие κεράσας формально обозначает действие, предшествующее θές: смешав вино, его следует поставить. Сочинительная передача сохраняет последовательность действий и в русском звучит яснее; «смешай» не уточняет, с чем именно смешивается вино, поскольку источник этого не называет.'
- source_word: ἀπόκλεισον τὴν θύραν
  choice: дверь запри
  rationale: ἀποκλείω обозначает закрыть доступ, затворить. В данном контексте «запри» передаёт более сильный оттенок полного закрытия помещения, не добавляя конкретного способа запирания.
theological_decisions:
- issue: Культовое значение οἶκος τοῦ Βήλ
  choice: дом Бела
  alternative: храм Бела
  rationale: Хотя речь идёт о святилище Бела, греческое οἶκος буквально означает «дом». Основной текст сохраняет образ источника, а вероятное культовое значение поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис прямой и понятный; архаизмы устранены, обращение «царь» сохранено как естественная передача звательного падежа.
