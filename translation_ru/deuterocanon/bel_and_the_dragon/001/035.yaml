lexical_decisions:
- source_word: Ἀμβακοὺμ
  choice: Аввакум
  rationale: Традиционная и общепринятая русская форма имени пророка.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος в прямом обращении к Богу естественно передаётся русским обращением «Господи».
- source_word: Βαβυλῶνα
  choice: Вавилона
  rationale: Стандартная русская форма географического названия в винительном падеже.
- source_word: οὐχ ἑώρακα
  choice: я не видел
  rationale: Перфект ὁράω обозначает отсутствие у Аввакума прежнего зрительного знакомства с Вавилоном; форма «не видел» ясно и естественно передаёт этот смысл по-русски.
- source_word: τὸν λάκκον
  choice: этой ямы
  rationale: λάκκος — общее обозначение углубления, ямы или рва. «Яма» наиболее прямо и без лишнего истолкования передаёт слово; указательное «этой» отражает определённость места, уже известного из контекста.
- source_word: οὐ γινώσκω
  choice: не знаю
  rationale: Настоящее время γινώσκω выражает отсутствие знания или знакомства; «не знаю» сохраняет простоту исходной фразы.
theological_decisions:
- issue: Передача κύριος в обращении к Богу
  choice: Господи
  alternative: Владыка
  rationale: Контекст указывает на обращение к Богу; «Господи» — естественное, традиционное и нейтральное соответствие, не вносящее дополнительного конфессионального оттенка.
translation_notes:
