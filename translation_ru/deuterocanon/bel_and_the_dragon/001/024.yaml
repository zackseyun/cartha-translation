  text: And the king said to Daniel[a], “You cannot say that this is not a living god; and bow down to him.”
translation:
  language: ru
  text: 'И царь сказал Даниилу: «Ты не можешь сказать, что это не живой бог, и поклонись ему[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклоняйся ему». Греческий глагол может означать поклон или выражение почтения, а при обращении к божеству — религиозное поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύνασαι εἰπεῖν
  choice: Ты не можешь сказать
  rationale: Прямо передаёт отрицание δύναμαι с инфинитивом и сохраняет форму царского вызова, не уточняя сверх текста, идёт ли речь о невозможности, непозволительности или риторическом возражении.
- source_word: οὐκ ἔστιν οὗτος θεὸς ζῶν
  choice: что он не живой бог
  rationale: Выражение θεὸς ζῶν естественно передано как «живой бог». Местоимение «он» в русском контексте естественно указывает на названное существо; строчная буква сохраняет точку зрения языческого царя и не превращает его слова в исповедание Бога Израиля.
- source_word: προσκύνησον αὐτῷ
  choice: поклонись ему
  rationale: Глагол προσκυνέω может обозначать как телесный поклон или выражение почтения, так и религиозное поклонение. Русское «поклонись» сохраняет эту смысловую широту; контекст предполагаемого божества придаёт действию религиозный оттенок.
- source_word: βασιλεὺς
  choice: царь
  rationale: В повествовательном контексте это уже известный читателю царь; русское существительное без обязательного указательного уточнения естественно передаёт греческую определённость.
- source_word: τῷ Δανιήλ
  choice: Даниилу
  rationale: Дательный падеж передаёт косвенное дополнение, а имя дано в принятой русской библейской форме.
theological_decisions:
- issue: Следует ли передавать θεὸς ζῶν как титул истинного Бога
  choice: живой бог
  alternative: живой Бог
  rationale: Царь говорит о существе, которое считает божеством. Заглавная буква могла бы ошибочно представить его слова как признание истинного Бога; строчная сохраняет перспективу говорящего и повествовательную иронию.
- issue: Следует ли переводить προσκύνησον явно религиозным словом
  choice: поклонись ему
  alternative: поклоняйся ему
  rationale: Исходный глагол допускает значение телесного поклона и поклонения божеству. Основной текст не устраняет эту многозначность, а религиозный смысл остаётся очевидным из контекста.
translation_notes:
  register: Современный литературный русский язык с простым, повествовательно ясным синтаксисом. Две фразы внутри прямой речи позволяют естественно передать присоединительное καί, не добавляя причинного значения вроде «поэтому».
