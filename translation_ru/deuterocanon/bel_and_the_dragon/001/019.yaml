  text: Not even one. And Daniel laughed[a], and held the king back from going inside, and said, “Now look at the floor, and take notice.”
translation:
  language: ru
  text: 'Ни одного. Даниил рассмеялся, удержал царя, не давая ему войти внутрь, и сказал: «Посмотри же на пол и пойми[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распознай»; буквально: «узнай». Здесь имеется в виду: внимательно посмотри и пойми, о чём свидетельствует пол.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ εἷς
  choice: Ни одного
  rationale: Кратко и с подчёркнутым отрицанием передаёт эллиптическое греческое выражение, не добавляя отсутствующего в тексте существительного.
- source_word: ἐγέλασεν
  choice: рассмеялся
  rationale: Передаёт основное значение глагола — засмеялся; варианты «усмехнулся» или «высмеял» излишне уточняли бы оттенок.
- source_word: ἐκράτησεν
  choice: удержал
  rationale: В сочетании с конструкцией предотвращения естественно обозначает, что Даниил остановил царя и не позволил ему войти.
- source_word: τοῦ μὴ εἰσελθεῖν αὐτὸν ἔσω
  choice: не давая ему войти внутрь
  rationale: Естественно передаёт значение предотвращения, выраженное артиклевым инфинитивом с отрицанием.
- source_word: Ἴδε δὴ
  choice: Посмотри же
  rationale: Императив сохраняет призыв обратить внимание, а частица «же» передаёт настойчивость и непосредственность δή.
- source_word: τὸ ἔδαφος
  choice: пол
  rationale: В контексте внутреннего помещения храма это точнее и естественнее общего слова «земля».
- source_word: γνῶθι
  choice: пойми
  rationale: Сохраняет основное значение повелительной формы «узнай/пойми» и её смысловой переход от осмотра к осознанию увиденного.
