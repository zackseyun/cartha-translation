  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/037.yaml
  text: And Habakkuk cried out[a], saying, “Daniel, Daniel, take the meal that God has sent you.”
translation:
  language: ru
  text: 'И воззвал Аввакум: «Даниил, Даниил! Возьми пищу, которую послал тебе Бог».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленная греческая строка обрывается после слов «Даниил, Даниил» и заканчивается отдельной буквой. Остальная часть перевода следует обычному продолжению этого стиха в Феодотионовой версии «Вила и дракона»: Аввакум сообщает Даниилу о пище, которую послал ему Бог.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐβόησεν
  choice: воззвал
  rationale: Глагол обозначает громкий возглас; «воззвал» сохраняет силу выражения и соответствует достоинству повествовательного регистра.
- source_word: Ἀμβακοὺμ
  choice: Аввакум
  rationale: Употреблена традиционная русская форма имени пророка, а не механическая передача греческого написания.
- source_word: λέγων
  choice: двоеточие перед прямой речью
  rationale: Греческое причастие естественно передано русской конструкцией с прямой речью; буквальное «говоря» здесь было бы тяжеловесно.
- source_word: Δανιὴλ Δανιήλ
  choice: Даниил, Даниил
  rationale: Повтор обращения сохранён, поскольку передаёт настойчивость и непосредственность возгласа.
- source_word: Β
  choice: Возьми пищу, которую послал тебе Бог
  rationale: Предоставленная греческая строка обрывается после повторного обращения и заканчивается изолированной буквой. Продолжение воспроизведено по стандартной форме данного стиха в Феодотионовой версии повествования и открыто отмечено в сноске.
theological_decisions:
- issue: Передача стиха при обрыве предоставленного греческого текста
  choice: Дать известное повествовательное продолжение о пище, посланной Богом Даниилу, и отметить повреждение исходной строки в сноске.
  alternative: 'Перевести только сохранившуюся часть: «И воззвал Аввакум: „Даниил, Даниил…“»'
  rationale: Так получается пригодный для чтения полный стих, но текстологическая неопределённость не скрывается и не выдаётся за непосредственно засвидетельствованную предоставленной строкой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Традиционные формы имён сохранены; синтаксис прямой речи сделан естественным для современного читателя.
