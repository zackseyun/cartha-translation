translation:
  language: ru
  text: Царь убил их, отдал Бела во власть Даниилу[a] и уничтожил его и его храм.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. буквально: «дал Бела как выданного Даниилу»; то есть отдал его во власть Даниила.'
