lexical_decisions:
- source_word: ἀπέκτεινεν
  choice: умертвил
  rationale: Аорист ἀποκτείνω означает причинение смерти. «Умертвил» ясно передаёт действие царя и естественно звучит в повествовании о казни, не прибегая к архаичному «предал смерти».
- source_word: ἔδωκεν ... ἔκδοτον
  choice: отдал ... во власть
  rationale: Сочетание глагола «дал» с ἔκδοτον выражает передачу кого-либо или чего-либо в распоряжение другого. «Отдал во власть» естественно передаёт этот смысл по-русски.
- source_word: τὸν Βὴλ
  choice: Бела
  rationale: Имя божества передано традиционной транслитерацией «Бел» и поставлено в винительный падеж.
- source_word: κατέστρεψεν
  choice: уничтожил
  rationale: Глагол означает разрушение или полное уничтожение; «уничтожил» одинаково применимо к Белу и его храму и сохраняет обобщённость греческого слова.
- source_word: τὸ ἱερὸν
  choice: храм
  rationale: В данном культовом контексте ἱερόν естественнее всего передаётся словом «храм».
- source_word: αὐτὸν
  choice: его
  rationale: Местоимение мужского рода согласуется с именем Бел. Русское «его» сохраняет грамматическую форму и не снимает заложенное в тексте представление о Беле как именованном божестве или идоле.
theological_decisions:
- issue: Передача местоимения мужского рода, относящегося к Белу
  choice: «его и его храм»
  alternative: «его изображение и его храм» или обезличенная конструкция
  rationale: Греческий текст прямо употребляет αὐτόν и αὐτοῦ мужского рода. Русский язык позволяет естественно сохранить их без добавления отсутствующего в оригинале слова «изображение» и без решения вопроса о том, обозначает ли Бел божество или его идол.
- issue: Кто уничтожил Бела и его храм
  choice: Сохранить цепочку однородных глаголов с царём как явным подлежащим
  alternative: Явно назвать Даниила исполнителем уничтожения
  rationale: В греческом тексте единственное выраженное подлежащее — ὁ βασιλεύς, а κατέστρεψεν продолжает последовательность личных глаголов. Добавление имени Даниила в качестве подлежащего выходило бы за пределы данной формулировки, хотя ближайший контекст может побуждать читателя связывать действие с ним.
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным синтаксисом. Сохранены повтор «его» и мужской род местоимений, соответствующие греческому тексту; архаизмы и конфессионально окрашенные уточнения не добавлялись.
