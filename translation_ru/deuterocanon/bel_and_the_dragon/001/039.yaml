lexical_decisions:
- source_word: σε
  choice: Тебя
  rationale: Винительный падеж местоимения второго лица единственного числа завершает фразу предыдущего стиха; прописная буква уместна как обращение к Богу, хотя сам фрагмент начинается лишь с последнего слова этой фразы.
- source_word: ἀναστὰς
  choice: встал
  rationale: 'Аористное причастие обозначает действие, предшествующее основному: Даниил встал, после чего поел.'
- source_word: ἔφαγεν
  choice: поел
  rationale: Простой повествовательный аорист; «поел» естественно передаёт завершённое действие в современном русском языке.
- source_word: ἄγγελος
  choice: ангел
  rationale: По контексту речь идёт о небесном существе, действующем от имени Бога; «вестник» неоправданно ослабил бы ясный повествовательный смысл.
- source_word: τοῦ θεοῦ
  choice: Божий
  rationale: Естественная и точная русская передача родительного оборота «Бога», определяющего слово «ангел».
- source_word: ἀπε-
  choice: …
  rationale: В предоставленном греческом извлечении сохранилось только начало слова. Префикс ἀπε- сам по себе не позволяет надёжно установить конкретный глагол, поэтому действие ангела не реконструируется в основном тексте.
theological_decisions:
- issue: Передача ἄγγελος в рассказе о сверхъестественном действии
  choice: ангел
  alternative: вестник
  rationale: Контекст представляет посланника Бога как сверхъестественное существо; «ангел» сохраняет прямой смысл текста без конфессионального уточнения.
- issue: Восстановление усечённого действия ангела
  choice: не восстанавливать глагол
  alternative: «удалился» / «ушёл»
  rationale: Видимое ἀπε- является лишь началом слова и не доказывает именно глагол ухода; восстановление внесло бы в перевод смысл, которого нельзя установить по предоставленному фрагменту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное «Тебя» намеренно сохранено как окончание фразы предыдущего стиха; многоточие честно отражает обрыв источника.
