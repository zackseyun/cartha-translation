lexical_decisions:
- source_word: ἀναβοήσας
  choice: громко воскликнув
  rationale: Аористное причастие передаёт сильный возглас; сочетание с наречием естественно по-русски и сохраняет интенсивность выражения.
- source_word: φωνῇ μεγάλῃ
  choice: громко
  rationale: Греческая идиома буквально означает «громким голосом»; наречие передаёт её смысл естественным современным русским языком.
- source_word: Μέγας εἶ
  choice: Велик Ты
  rationale: Начальная позиция сказуемого подчёркивает величие; такой порядок слов сохраняет торжественный и восклицательный характер обращения.
- source_word: Κύριε
  choice: Господи
  rationale: Форма звательного обращения к Богу естественно передаётся традиционной русской формой «Господи».
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Стандартный перевод θεός; артикль указывает на приложение к обращению «Господи», что по-русски естественно выражается пунктуацией без отдельного слова.
- source_word: τοῦ
  choice: не представлено отдельным словом в основном тексте
  rationale: Конечный артикль родительного падежа не имеет самостоятельного естественного соответствия в русском без отсутствующего существительного; обрыв исходного текста отмечен сноской, без домысливания продолжения.
theological_decisions:
- issue: Передача κύριος в обращении к Богу
  choice: Господи
  alternative: Владыка
  rationale: Контекст представляет прямое обращение к Богу; «Господи» является точным, общеупотребительным и конфессионально нейтральным соответствием.
- issue: Обращение с незавершённым исходным текстом, оканчивающимся на τοῦ
  choice: Сохранить смысловую незавершённость и пояснить её в сноске
  alternative: Восстановить предполагаемое продолжение по контексту или буквально поставить «[Бог] того»
  rationale: Предоставленный греческий источник обрывается на артикле родительного падежа. Продолжение нельзя надёжно восстановить из данного свидетельства, а буквальная передача артикля без существительного была бы неестественной и вводила бы ложный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством прямого обращения к Богу. Инверсия «Велик Ты» сохраняет эмфазу греческого Μέγας εἶ. Незавершённость источника обозначена сноской; кавычка намеренно не закрыта, поскольку прямая речь и сама фраза в предоставленном тексте не завершены.
