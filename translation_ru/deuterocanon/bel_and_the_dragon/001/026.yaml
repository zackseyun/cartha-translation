  text: But you[a], O king, give me authority, and I will kill the dragon without sword or staff. And the king said, “I give it to you.”
translation:
  language: ru
  text: 'Ты же, царь, дай мне власть, и я убью дракона без меча и посоха. Царь сказал: «Даю тебе власть».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺ δέ
  choice: Ты же
  rationale: Частица δέ обозначает переход или противопоставление, а явное σὺ придаёт обращению выразительное ударение. «Ты же» естественно передаёт обе особенности по-русски.
- source_word: βασιλεῦ
  choice: царь
  rationale: Передано прямое обращение в звательном употреблении; форма «царь» естественна в современном русском библейском повествовании и не добавляет отсутствующего в греческом придворного титула.
- source_word: δός μοι ἐξουσίαν
  choice: дай мне власть
  rationale: ἐξουσία здесь означает предоставленное царём право или полномочие действовать. «Власть» сохраняет существительное и официальный оттенок, тогда как «разреши мне» было бы более свободной передачей.
- source_word: ἀποκτενῶ
  choice: я убью
  rationale: Будущая форма глагола прямо означает лишение жизни. «Убью» ясно и современно, без архаизирующего оттенка.
- source_word: τὸν δράκοντα
  choice: дракона
  rationale: δράκων обозначает почитаемое в повествовании существо; «дракон» сохраняет традиционное и контекстуально уместное значение, не сужая его до «змея».
- source_word: ἄνευ μαχαίρας καὶ ῥάβδου
  choice: без меча и посоха
  rationale: ἄνευ относится к обоим существительным. μαχαίρα передано как «меч», а многозначное ῥάβδος — как «посох», что сохраняет прямое значение слова и не решает без необходимости, подразумевается ли боевая дубина.
- source_word: Δίδωμί σοι
  choice: Даю тебе
  rationale: Ответ царя эллиптически подразумевает только что запрошенную власть. Русская фраза «Даю тебе» сохраняет эту краткость и естественно допускает подразумеваемое дополнение.
