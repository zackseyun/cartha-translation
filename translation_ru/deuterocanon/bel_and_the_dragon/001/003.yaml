  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/003.yaml
  text: And there was an idol among the Babylonians whose name was Bel, and for it twelve artabas of fine flour were spent each day.
translation:
  language: ru
  text: У вавилонян был идол по имени Бел, и каждый день на него расходовалось двенадцать артаб[a] муки тонкого помола.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Артаба — древняя мера объёма; её величина в разные времена и в разных местах различалась.
    reason: Современному читателю мера, вероятно, неизвестна, а точный пересчёт спорен.
lexical_decisions:
- source_word: εἴδωλον
  choice: идол
  rationale: Прямой и естественный русский эквивалент, сохраняющий отрицательную библейскую характеристику культового изображения.
- source_word: τοῖς Βαβυλωνίοις
  choice: у вавилонян
  rationale: Естественно передаёт значение существования идола среди вавилонян или в их владении.
- source_word: Βὴλ
  choice: Бел
  rationale: Традиционная русская передача греческой формы имени Βὴλ.
- source_word: ἐδαπανῶντο εἰς αὐτὸν
  choice: на него расходовалось
  rationale: Сохраняет безлично-пассивный характер выражения и направленность расходов на идола, не уточняя не названных в тексте распорядителей.
- source_word: σεμιδάλεως
  choice: муки тонкого помола
  rationale: Передаёт высококачественную мелко смолотую муку, не сводя значение непременно к конкретному современному сорту.
- source_word: ἀρτάβαι δώδεκα
  choice: двенадцать артаб
  rationale: Сохраняет древнюю меру объёма, поскольку её точная величина варьировалась и пересчёт внёс бы ложную точность.
theological_decisions:
- issue: Референт местоимения αὐτόν
  choice: него
  alternative: него самого / его культ
  rationale: Местоимение грамматически относится к идолу; перевод не персонифицирует Бела сверх того, что выражено в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Порядок слов сделан естественным для русского; древняя мера сохранена и кратко пояснена.
