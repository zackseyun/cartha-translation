lexical_decisions:
- source_word: δαπάνην ταύτην
  choice: за эти расходы
  rationale: δαπάνη обозначает расход или издержки; форма с указательным местоимением отсылает к затратам на приношения Вилу. Предлог «за» естественно передаёт подразумеваемое основание наказания в продолжающемся предложении.
- source_word: ἀποθανεῖσθε
  choice: вы умрёте
  rationale: Будущее время выражает судебную угрозу; современная формулировка сохраняет её категоричность без архаизации.
- source_word: δείξητε
  choice: докажете
  rationale: В контексте испытания глагол означает не просто показать, а наглядно подтвердить утверждение; «докажете» естественно передаёт этот смысл.
- source_word: κατεσθίει αὐτά
  choice: съедает всё это
  rationale: κατεσθίω означает съедать или поглощать, а αὐτά отсылает ко всем выставленным приношениям. «Всё это» ясно и естественно по-русски.
- source_word: ἐβλασφήμησεν εἰς τὸν Βήλ
  choice: он хулил Вила
  rationale: «Хулил» сохраняет религиозно окрашенное обвинение, не утверждая тем самым божественность Вила. В русском языке объект глагола естественно ставится без предлога.
- source_word: καὶ
  choice: И
  rationale: Заключительный союз прямо присутствует в греческом тексте и связывает данный фрагмент со следующим стихом; он сохранён, несмотря на открытое продолжение фразы.
theological_decisions:
- issue: Передача βλασφημέω применительно к языческому божеству
  choice: хулил Вила
  alternative: кощунствовал против Вила
  rationale: Греческий глагол передаёт обвинение в оскорбительной, нечестивой речи о почитаемом божестве. «Хулил» сохраняет религиозную силу обвинения, но не подтверждает, что Вил действительно является богом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имя Βήλ передано традиционной русской формой «Вил». Начальная строчная буква и заключительное «И» сохраняют фрагментарную структуру стиха, который начинается и заканчивается внутри более длинного предложения.
