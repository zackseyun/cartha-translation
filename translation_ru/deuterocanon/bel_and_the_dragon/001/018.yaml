  text: And it happened, when the doors were opened, that the king looked at the table and cried out with a loud voice, “Great are you, Bel, and there is no deceit with you.”
translation:
  language: ru
  text: 'И когда открыли двери, царь взглянул на стол и громко воскликнул: «Велик ты, Вил, и нет у тебя никакого обмана!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: И
  rationale: В данном повествовательном контексте греческая переходная формула естественно передаётся русским соединительным «И»; буквальное «и случилось» было бы тяжеловесно и не добавляло бы содержания.
- source_word: ἅμα τῷ ἀνοῖξαι τὰς θύρας
  choice: когда двери открыли
  rationale: Передаёт временную связь действий без излишнего усиления немедленности; действующее лицо при открывании дверей в греческом тексте не названо.
- source_word: ἐπιβλέψας ... ἐπὶ τὴν τράπεζαν
  choice: взглянул на стол
  rationale: Сохраняет простое зрительное действие, не добавляя значения тщательного осмотра; τράπεζα обозначает именно стол, а его назначение ясно из контекста.
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: громко воскликнул
  rationale: Естественно по-русски передаёт и силу глагола, и указание на громкий голос, избегая буквального, но тяжёлого оборота «воззвал громким голосом».
- source_word: Μέγας εἶ
  choice: Велик ты
  rationale: Инверсия сохраняет торжественный и восклицательный характер слов царя и остаётся естественной в современном литературном русском.
- source_word: Βήλ
  choice: Вил
  rationale: Использована закрепившаяся в русской библейской традиции форма имени персонажа, известного по названию «Вил и дракон».
- source_word: οὐκ ἔστιν παρὰ σοὶ δόλος
  choice: нет у тебя никакого обмана
  rationale: Оборот «у тебя» близко передаёт παρὰ σοὶ и звучит естественно; «обман» сохраняет широкий смысл δόλος — обман, хитрость, коварная уловка. Слово «никакого» идиоматически подчёркивает отрицание, не меняя его содержания.
theological_decisions:
- issue: Восклицание царя может прозвучать как подтверждение величия Вила со стороны повествователя.
  choice: Слова сохранены как прямая речь царя без авторского пояснения или оговорки.
  alternative: Добавить указание, что царь лишь счёл Вила великим или ошибочно поверил в отсутствие обмана.
  rationale: Греческий текст прямо приводит слова царя. Их буквальная драматическая функция и ирония последующего разоблачения должны сохраняться без внесения в текст толковательного комментария.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной инверсией в прямой речи. Повествовательная часть проста и ясна; архаизмы и конфессионально окрашенные добавления исключены.
