  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/021.yaml
  text: Then the king became angry and arrested the priests and their wives and children[b][a], and they showed him the secret doors through which they used to go in and consume what was on the table.
translation:
  language: ru
  text: Тогда царь разгневался и взял под стражу жрецов, их жён и детей. Они показали ему потайные двери[a], через которые входили и съедали то, что было на столе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скрытые двери».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: разгневался
  rationale: Аористное причастие передаёт наступивший гнев царя; русская личная форма естественно продолжает повествование и не усиливает степень гнева сверх текста.
- source_word: συνέλαβεν
  choice: схватил
  rationale: Глагол обозначает захват или взятие под стражу. «Схватил» сохраняет конкретную силу греческого слова, не добавляя явно оформленной судебной процедуры.
- source_word: τοὺς ἱερεῖς
  choice: жрецов
  rationale: В контексте служителей языческого божества Вила слово «жрецы» точнее современного русского «священники».
- source_word: τὰς γυναῖκας καὶ τὰ τέκνα αὐτῶν
  choice: их жёнами и детьми
  rationale: Семейное перечисление и местоимение αὐτῶν указывают на жён и детей жрецов; широкий смысл τέκνα передан словом «дети».
- source_word: τὰς κρυπτὰς θύρας
  choice: потайные двери
  rationale: Сочетание обозначает скрытые проходы, служившие для тайного проникновения; «потайные двери» конкретно и идиоматично по-русски.
- source_word: διʼ ὧν εἰσεπορεύοντο
  choice: через которые входили
  rationale: Имперфект передаёт повторявшееся действие; русская форма несовершенного вида сохраняет этот оттенок без тяжеловесного уточнения «обычно».
- source_word: ἐδαπάνων
  choice: съедали
  rationale: Хотя δαπανάω буквально может означать «расходовать, поглощать», предметы на столе в данном контексте являются приношениями пищи; «съедали» ясно передаёт действие.
- source_word: τὰ ἐπὶ τῇ τραπέζῃ
  choice: всё, что было на столе
  rationale: Передаёт субстантивированное выражение без избыточного добавления слова «пища».
theological_decisions:
- issue: Обозначение служителей Вила
  choice: жрецы
  alternative: священники
  rationale: «Жрецы» в современном русском ясно указывает на служителей языческого культа и не создаёт неуместной связи с иудейским или христианским священством.
- issue: Значение γυναῖκας в семейном перечислении
  choice: жёны
  alternative: женщины
  rationale: Сочетание с «детьми» и притяжательным αὐτῶν естественно указывает на членов семей жрецов, при этом никакого дополнительного богословского вывода не вносится.
- issue: Характер действия царя в συνέλαβεν
  choice: схватил
  alternative: арестовал
  rationale: «Схватил» сохраняет более широкое значение исходного глагола и не конкретизирует формальную правовую процедуру, которой греческий текст прямо не описывает.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Потайные двери» звучит естественно и передаёт устройство для скрытого доступа; несовершенные формы «входили и съедали» сохраняют повторяемость действий в греческом имперфекте.
