- issue: Обрыв окончания стиха в предоставленном греческом свидетельстве
  choice: Перевести только сохранившиеся слова и обозначить незавершённость многоточием
  alternative: Восстановить продолжение по другим изданиям или по контексту
  rationale: Предоставленный греческий текст обрывается на καὶ οὐ («и не / и никогда»). Добавление предполагаемого продолжения вышло бы за пределы данного исходного свидетельства.
