  text: Does he drink every day? And Daniel said[a], laughing, “Do not be deceived, O king; for this one is clay inside and bronze outside, and never—”
translation:
  language: ru
  text: 'Пьёт он каждый день? И Даниил, рассмеявшись, сказал: «Не обманывайся, царь! Ведь этот внутри он из глины, а снаружи — из бронзы, и не…»[a]'
  philosophy: optimal-equivalence
