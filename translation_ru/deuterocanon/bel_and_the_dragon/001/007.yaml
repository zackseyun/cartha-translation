    reason: textual_variant
lexical_decisions:
- source_word: πίνει καθʼ ἑκάστην ἡμέραν
  choice: пьёт каждый день
  rationale: Греческое вопросительное предложение буквально говорит о питье «каждый день»; частица «разве» естественно передаёт подразумеваемое сомнение в русском вопросе.
- source_word: γελάσας
  choice: рассмеявшись
  rationale: Аористное причастие от γελάω обозначает смех Даниила при ответе; «рассмеявшись» естественно и сильнее, чем «улыбнувшись».
- source_word: Μὴ πλανῶ
  choice: не обманывайся
  rationale: Несмотря на некоторую формальную неровность греческого выражения, в контексте это предостережение царю не поддаваться обману.
- source_word: βασιλεῦ
  choice: царь
  rationale: Звательная форма передана прямым обращением, естественным для современного русского литературного языка.
- source_word: οὗτος
  choice: этот
  rationale: Сохранено указательное местоимение без добавления отсутствующих в греческом слов «бог» или «идол».
- source_word: ἔσωθέν ἐστι πηλός
  choice: внутри из глины
  rationale: Передаёт внутренний материал истукана и сохраняет прямое противопоставление внешней оболочке.
- source_word: ἔξωθεν δὲ χαλκός
  choice: а снаружи — из бронзы
  rationale: χαλκός применительно к древнему предмету естественно передаётся как «бронза»; конструкция ясно противопоставлена внутренней глине.
