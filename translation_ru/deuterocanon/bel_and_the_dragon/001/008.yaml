lexical_decisions:
- source_word: βέβρωκεν οὐδέποτε
  choice: никогда не ел
  rationale: Перфект βέβρωκεν с οὐδέποτε выражает отрицание действия вплоть до настоящего момента; по-русски это естественно передаётся формой «никогда не ел».
- source_word: θυμωθεὶς ὁ βασιλεὺς
  choice: тогда царь разгневался
  rationale: Причастие передаёт наступление гнева как обстоятельство последующего действия; отдельное сказуемое звучит естественно и не усиливает значение до «пришёл в ярость».
- source_word: ἐκάλεσεν τοὺς ἱερεῖς αὐτοῦ
  choice: призвал своих жрецов
  rationale: «Призвал» передаёт вызов к царю, а «жрецы» ясно обозначает служителей языческого культа Бела. Возвратное «своих» естественно передаёт αὐτοῦ при подлежащем «царь».
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Прямая и нейтральная передача обычной греческой формулы введения речи.
- source_word: Ἐὰν μὴ εἴπητέ μοι
  choice: Если вы не скажете мне
  rationale: Сохраняется условная конструкция ἐὰν μή с сослагательным наклонением без преобразования в более категоричное «пока не скажете».
- source_word: τίς ὁ κατεσθίων
  choice: кто съедает
  rationale: Настоящее причастие κατεσθίων обозначает того, кто регулярно или в данный момент поедает подразумеваемый далее предмет; «съедает» сохраняет значение усиленного κατεσθίω без стилистически резкого «пожирает».
- source_word: τὴν
  choice: …
  rationale: Греческий фрагмент обрывается на определённом артикле женского рода перед отсутствующим существительным. Русский язык не имеет артикля, поэтому незавершённость передана многоточием без домысливания объекта.
