lexical_decisions:
- source_word: ὁ ποιήσας
  choice: сотворивший
  rationale: Артикль с аористным причастием имеет субстантивированную, описательную силу. В контексте продолжающегося обращения к Богу русское причастие естественно сохраняет греческую синтаксическую связь; «сотворивший» уместно для речи о создании неба и земли и не добавляет содержания сверх ποιέω.
- source_word: τὸν οὐρανὸν
  choice: небо
  rationale: В космологической паре с землёй οὐρανός обозначает небо, а не только видимый небосвод.
- source_word: τὴν γῆν
  choice: землю
  rationale: В устойчивой всеохватной паре «небо и земля» γῆ означает землю как часть сотворённого мира, а не отдельную страну или территорию.
- source_word: σὺν
  choice: со
  rationale: Предлог выражает совместность и включает последующее понятие в число сотворённого; краткое русское «со» здесь естественно и точно.
- source_word: παντὶ τῷ κόσμῳ αὐτῶν
  choice: всем их устроением
  rationale: κόσμος здесь вероятнее означает упорядоченное устройство или стройную совокупность, принадлежащую небу и земле, а не повторно «мир». «Устроение» сохраняет значение порядка и организации, а местоимение «их» передаёт αὐτῶν.
theological_decisions:
- issue: Значение κόσμος в формуле о сотворении
  choice: «устроение», то есть упорядоченная совокупность неба и земли
  alternative: «мир», «убранство» или «всё, что в них»
  rationale: Небо и земля уже названы, поэтому перевод «мир» создавал бы неясное повторение. Греческое κόσμος может обозначать порядок, устройство или убранство; «устроение» сохраняет эту смысловую широту, не сводя выражение исключительно к содержимому неба и земли.
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейской торжественностью без архаизации. Причастная конструкция сохраняет связь с окружающим обращением; запятая в конце показывает продолжение фразы.
