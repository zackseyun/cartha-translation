base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/014.yaml
  text: and in me you will show your kindness[a]; for you will save me, though I am unworthy, according to your abundant mercy[b],
translation:
  language: ru
  text: и на мне Ты явишь Свою благость[a], потому что спасёшь меня, недостойного, по великой милости Твоей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «во мне»; возможно также: «ко мне» или «через меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δείξεις
  choice: явишь
  rationale: Будущее время от δείκνυμι означает «покажешь, явишь»; «явишь» естественно и достойно звучит в молитвенном контексте.
- source_word: ἐν ἐμοί
  choice: на мне
  rationale: Буквально греческое выражение означает «во мне», но здесь речь о том, что Божья благость станет видимой на примере говорящего. «На мне» сохраняет образ проявления Божьего свойства в судьбе Манассии, не сводя смысл только к благодеянию ему.
- source_word: χρηστότητά
  choice: благость
  rationale: χρηστότης обозначает благость или доброту. «Благость» сохраняет связь с тем же словом в стихе 11 и подходит возвышенному, но понятному молитвенному регистру.
- source_word: ἀνάξιον ὄντα
  choice: меня, недостойного
  rationale: Причастный оборот буквально означает «будучи недостойным». Русское приложение естественно выражает состояние говорящего и сохраняет подразумеваемое противопоставление спасению.
- source_word: σώσεις
  choice: спасёшь
  rationale: σῴζω здесь охватывает избавление и спасение; «спасёшь» сохраняет эту богословскую широту.
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: по великой милости Твоей
  rationale: κατά с винительным указывает на меру или основание действия, а πολὺ подчёркивает величие милости. Эта формулировка точна и естественна по-русски.
theological_decisions:
- issue: 'Как передать ἐν ἐμοί: буквально или истолковательно'
  choice: на мне
  alternative: во мне; ко мне; через меня
  rationale: Предлог ἐν буквально допускает «во мне», однако в данном обороте Божья благость проявляется в случае и судьбе молящегося. «На мне» сохраняет эту направленную на его личность образность и не ограничивает смысл одним из возможных толкований «ко мне» или «через меня».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы как регистровое решение. Порядок частей фразы следует греческому тексту, но синтаксис сделан естественным для русского языка.
