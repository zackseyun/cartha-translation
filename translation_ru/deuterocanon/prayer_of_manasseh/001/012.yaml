translation:
  language: ru
  text: Я согрешил, Господи, я согрешил, и я знаю свои беззакония[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нарушения закона». Греческое слово обозначает беззакония — поступки, нарушающие Божий закон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμάρτηκα
  choice: я согрешил
  rationale: Перфект ἁμαρτάνω обозначает совершённый грех, сохраняющий значение для настоящего момента. В современном русском исповедальном контексте это естественно передаётся прошедшим совершенного вида «согрешил».
- source_word: κύριε
  choice: Господи
  rationale: Звательная форма κύριος в прямом молитвенном обращении естественно и традиционно передаётся русской звательной формой «Господи» без добавления междометия.
- source_word: τὰς ἀνομίας μου
  choice: свои беззакония
  rationale: ἀνομία указывает на беззаконие, нарушение Божьего закона. «Беззакония» сохраняет связь с законом и нравственную весомость выражения; возвратное «свои» естественно передаёт принадлежность при совпадении субъекта и обладателя.
- source_word: γινώσκω
  choice: знаю
  rationale: Сохранено прямое когнитивное значение глагола. В покаянном контексте оно подразумевает признание, однако перевод «знаю» не устраняет возможную смысловую широту.
- source_word: ἐγώ
  choice: я
  rationale: Отдельное местоимение в греческом имеет эмфатическую силу, поскольку лицо уже выражено формой глагола. В русском явное «я» перед «знаю» естественно сохраняет умеренное ударение без тяжеловесного «я сам».
theological_decisions:
- issue: Передача нравственного термина ἀνομία в покаянной молитве
  choice: беззакония
  alternative: нарушения закона; преступления
  rationale: «Беззакония» прямо сохраняет семантическую связь с отсутствием или нарушением закона, не сводя выражение к общему понятию проступка и не внося специальной конфессиональной терминологии.
- issue: Передача κύριε в непосредственном обращении к Богу
  choice: Господи
  alternative: о Господи
  rationale: Греческая звательная форма не требует добавления междометия; «Господи» соответствует современному возвышенному молитвенному регистру.
- issue: Эмфаза отдельного местоимения ἐγώ
  choice: и я знаю
  alternative: и я сам знаю; и знаю
  rationale: Явное местоимение сохраняет присутствующую в оригинале эмфазу, но не усиливает её до «я сам», что могло бы звучать как противопоставление, не выраженное однозначно в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного исповедания. Повтор «я согрешил» сохранён как важный риторический и покаянный элемент; порядок слов остаётся естественным для русского языка, а явное второе «я» перед «знаю» передаёт эмфазу греческого ἐγώ.
