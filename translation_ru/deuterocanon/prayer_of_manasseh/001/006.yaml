translation:
  language: ru
  text: и милость твоего обещания безмерна и неисследима;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обещанная тобой милость»; или: «милость, явленная в твоём обещании». Греческую конструкцию с родительным падежом можно понимать несколькими близкими способами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμέτρητόν
  choice: безмерна
  rationale: Передаёт невозможность измерить милость и естественно сочетается с существительным «милость»; сохраняет количественный образ греческого слова.
- source_word: ἀνεξιχνίαστον
  choice: неисследима
  rationale: Сохраняет образ того, что невозможно до конца исследовать или проследить, и образует уместную возвышенную пару со словом «безмерна».
- source_word: ἔλεος
  choice: милость
  rationale: Прямое и привычное соответствие греческому ἔλεος, особенно уместное в покаянной молитве.
- source_word: ἐπαγγελίας
  choice: обещания
  rationale: Прямо передаёт значение ἐπαγγελία и сохраняет родительную конструкцию оригинала, не уточняя без необходимости характер связи между обещанием и милостью.
- source_word: τε καὶ
  choice: и
  rationale: Естественно соединяет два однородных определения в русском языке, сохраняя их тесную координацию без тяжеловесного «и… и».
theological_decisions:
- issue: Связь между «милостью» и «обещанием» в конструкции τὸ ἔλεος τῆς ἐπαγγελίας σου
  choice: «милость твоего обещания»
  alternative: «обещанная тобой милость»; «милость, явленная в твоём обещании»
  rationale: 'Формальная родительная конструкция русского перевода соответствует греческой и сохраняет открытым точный оттенок смысла: милость может мыслиться как принадлежащая обещанию, выраженная в нём или им гарантированная.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Строчная буква в местоимении «твоего» следует нейтральной современной издательской практике и не добавляет отсутствующего в греческом тексте графического различия.
