base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/009.yaml
  text: For I have sinned beyond the number of the sand of the sea. My lawless deeds have multiplied[a], Lord; my lawless deeds have multiplied, and I am not worthy to look up and see the height of heaven because of the multitude of my unrighteous acts.
translation:
  language: ru
  text: Ибо я согрешил больше, чем морского песка. Умножились беззакония мои, Господи, умножились беззакония мои, и я недостоин пристально взглянуть[a] и увидеть высоту неба из-за множества моих неправедных дел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устремить взор». Греческий глагол может обозначать пристальный, устремлённый взгляд; направление вверх подразумевается упоминанием высоты неба, но прямо в самом глаголе не выражено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥμαρτον
  choice: я согрешил
  rationale: Аорист передаёт совершённое согрешение; в русском исповедальном контексте естественна форма совершенного вида.
- source_word: ὑπὲρ ἀριθμὸν ψάμμου θαλάσσης
  choice: больше, чем песчинок в море
  rationale: Передаёт превышение исчислимого числа и сохраняет библейский образ бесчисленного морского песка в естественной современной русской форме.
- source_word: ἐπλήθυναν αἱ ἀνομίαι μου
  choice: умножились беззакония мои
  rationale: «Умножились» сохраняет количественную силу глагола, а «беззакония» — связь ἀνομία с нарушением Божьего закона; порядок слов поддерживает торжественный исповедальный ритм.
- source_word: κύριε
  choice: Господи
  rationale: Нормальная русская звательная форма прямого обращения к Богу.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: я недостоин
  rationale: Кратко и точно выражает признание личного недостоинства.
- source_word: ἀτενίσαι
  choice: устремить взор
  rationale: Передаёт направленный, напряжённый характер взгляда, не добавляя к греческому глаголу однозначного указания «вверх».
- source_word: ἰδεῖν τὸ ὕψος τοῦ οὐρανοῦ
  choice: увидеть высоту неба
  rationale: Сохраняет единственное число ὕψος и образ возвышенной высоты неба.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἀδικιῶν μου
  choice: из-за множества моих неправедных дел
  rationale: Предлог передан причинно по контексту; «неправедные дела» сохраняют отличие ἀδικίαι от ранее употреблённого ἀνομίαι.
theological_decisions:
- issue: Различение ἀνομίαι и ἀδικιῶν в одном исповедании
  choice: ἀνομίαι — «беззакония»; ἀδικιῶν — «неправедные дела»
  alternative: Передать оба слова как «грехи» или оба как «беззакония»
  rationale: Греческий текст употребляет два близких, но разных нравственно-правовых понятия; различение сохраняет риторическую полноту исповедания и не сглаживает лексику источника.
- issue: Направление взгляда в ἀτενίσαι
  choice: Не добавлять прямо значение «поднять глаза», а передать как «устремить взор»
  alternative: «поднять глаза» или «взглянуть вверх»
  rationale: Сам глагол прежде всего обозначает пристальный или устремлённый взгляд; направление вверх выводится из упоминания высоты неба, но не выражено глаголом однозначно.
translation_notes:
  register: Современный литературный русский с торжественным исповедальным ритмом. Повтор «умножились беззакония мои» сохранён как значимый риторический элемент оригинала; архаические и узкоконфессиональные выражения не вводятся.
