base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/008.yaml
  text: So you[a], Lord, God of the righteous, did not appoint repentance for the righteous—for Abraham and Isaac and Jacob, who did not sin against you—but you appointed repentance for me, the sinner,
translation:
  language: ru
  text: Итак, Ты, Господи, Боже праведных, не установил для праведных покаяния[a] — для Авраама, Исаака и Иакова, не согрешивших против Тебя, — но установил покаяние для меня, грешника,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не положил покаяния для праведных». Глагол может означать «положить», «установить» или «назначить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ οὖν
  choice: Итак, Ты
  rationale: οὖν выражает вывод или продолжение мысли; «итак» естественно передаёт эту связующую силу, а местоимение сохраняет эмфатическое σὺ.
- source_word: κύριε ὁ θεὸς τῶν δικαίων
  choice: Господи, Боже праведных
  rationale: Сохранено прямое обращение и родительная конструкция с её молитвенной торжественностью и богословским весом.
- source_word: οὐκ ἔθου μετάνοιαν
  choice: не назначил покаяния
  rationale: Средняя форма τίθημι здесь имеет смысл «положить, установить, назначить». «Назначил покаяние» сохраняет идею осознанного Божьего установления, хотя сочетание несколько необычно по-русски.
- source_word: δικαίοις
  choice: праведным
  rationale: Дательный падеж сохранён; повтор корня «правед-» поддерживает контраст с «грешником».
- source_word: τῷ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: Аврааму, Исааку и Иакову
  rationale: Имена стоят в приложении к «праведным» и потому переданы дательным падежом без добавления отсутствующего в греческом предлога.
- source_word: τοῖς οὐχ ἡμαρτηκόσιν σοι
  choice: не согрешившим против Тебя
  rationale: Перфектное причастие передано русским совершенным причастием; σοι обозначает Того, против Кого направлен грех.
- source_word: ἀλλ' ἔθου μετάνοιαν ἐμοὶ
  choice: но назначил покаяние мне
  rationale: Сохранены резкое противопоставление и лексический параллелизм с первой частью стиха.
- source_word: τῷ ἁμαρτωλῷ
  choice: грешнику
  rationale: Определённый артикль и приложение к ἐμοί переданы формой «мне, грешнику», сохраняющей самоуничижительный контраст с праведными.
theological_decisions:
- issue: Утверждение, что Авраам, Исаак и Иаков не согрешили против Бога
  choice: 'Сохранить прямую формулировку: «не согрешившим против Тебя»'
  alternative: 'Смягчить: «не согрешившим тяжко против Тебя», «не вменённым в грешники» или «не согрешившим в этом»'
  rationale: Греческий текст прямо говорит τοῖς οὐχ ἡμαρτηκόσιν σοι и не содержит ограничения. Риторическое и богословское напряжение молитвы не следует устранять гармонизацией.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавные буквы в местоимениях обращения к Богу соответствуют принятому русскому религиозному регистру. Необычное сочетание «назначил покаяние» оставлено ради параллелизма и близости к греческому; альтернативный буквальный образ дан в сноске.
