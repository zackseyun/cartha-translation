  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/007.yaml
  text: For you are the Lord Most High[a], compassionate, patient, and abounding in mercy[b], and relenting concerning the evils of men.
translation:
  language: ru
  text: Ибо Ты — Господь Всевышний, сострадательный, долготерпеливый и многомилостивый; Ты изменяешь Своё решение[a] относительно зла людей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол также может быть передан словами «раскаиваешься» или «отступаешь от прежнего решения». Применительно к Богу здесь речь не обязательно предполагает нравственное раскаяние, но выражает изменение решения о суде или бедствии.
    reason: lexical_alternative
  - marker: b
    text: Греческое «зло людей» может означать как человеческое зло, то есть злодеяния, так и бедствия, касающиеся людей; выражение намеренно оставлено неоднозначным.
    reason: textual_ambiguity
lexical_decisions:
- source_word: κύριος ὕψιστος
  choice: Господь Всевышний
  rationale: Сохраняет два божественных титула и естественно звучит в современной литературной русской речи.
- source_word: εὔσπλαγχνος
  choice: сострадательный
  rationale: Передаёт глубокое сострадание и не дублирует последующее πολυέλεος.
- source_word: μακρόθυμος
  choice: долготерпеливый
  rationale: Точно передаёт идею продолжительного терпения и сдержанности; слово понятно и уместно в возвышенной молитвенной речи.
- source_word: πολυέλεος
  choice: многомилостивый
  rationale: Передаёт усиленное значение сложного слова — изобилие милости — кратко и в традиционно понятной форме.
- source_word: μετανοῶν
  choice: отменяешь
  rationale: В отношении Бога глагол обозначает отказ от ранее намеченного бедствия или суда, а не нравственное раскаяние; личная глагольная форма естественна после обращения «Ты».
- source_word: ἐπὶ κακίαις ἀνθρώπων
  choice: бедствия, назначенные людям
  rationale: κακίαις в данном обороте может обозначать зло или бедствия; контекст с μετανοῶν позволяет понимать речь о бедствиях, которые Бог решает не наводить. Формулировка остаётся достаточно сжатой, а неоднозначность отмечена в примечании.
theological_decisions:
- issue: Как передать μετανοῶν применительно к Богу
  choice: Ты отменяешь
  alternative: Ты раскаиваешься / изменяешь решение
  rationale: «Раскаиваешься» в современном русском обычно предполагает признание нравственной вины, чего греческий оборот здесь не требует. «Отменяешь» передаёт Божий отказ от бедствия, не устраняя полностью идею Его отклика на человеческую ситуацию.
- issue: Как понимать κακίαις в сочетании ἐπὶ κακίαις ἀνθρώπων
  choice: бедствия, назначенные людям
  alternative: зло людей / людские злодеяния
  rationale: В библейском греческом κακία может обозначать как нравственное зло, так и бедствие. Сочетание с μετανοῶν часто относится к отмене грозящего бедствия; альтернативное прочтение сохранено в примечании.
- issue: Как передать родовое ἀνθρώπων
  choice: людям
  alternative: мужчинам / человекам
  rationale: ἄνθρωπος здесь относится к людям вообще, а не специально к лицам мужского пола; современное русское «людям» точно сохраняет этот объём значения.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Заглавное «Ты» поддерживает русскую традицию почтительного обращения к Богу. Точка с запятой разделяет ряд божественных качеств и последующее действие, не нарушая единства греческого предложения.
