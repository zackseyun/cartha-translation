  - severity: medium
    issue: «Отменяешь» делает μετανοῶν однозначным действием отмены.
    rationale: Глагол означает изменение отношения/решения, раскаяние или отказ от прежнего намерения в зависимости от контекста. «Изменяешь Своё решение» передаёт это значение без чрезмерного сужения.
