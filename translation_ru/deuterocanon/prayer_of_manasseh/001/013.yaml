  source_fidelity: В целом переданы повторная мольба о прощении, συν- в «вместе с», сила ἀνομίαι как «беззакония», образ нижних областей земли и «Бог кающихся». Однако «не гневайся вечно и не помни мне...» превращает греческое причастие μηνίσας в отдельное, равноправное прошение и несколько размывает его связь с «не храни/не помни ... против меня».
  naturalness: Текст звучит естественно и сохраняет молитвенную торжественность. Оборот «Я прошу Тебя, умоляя» понятен, но «Прошу Тебя, умоляю Тебя» по-русски более плавно и ясно передаёт усилительное сочетание личной формы с причастием. «Не храни против меня моих злых дел, гневаясь вечно» сохраняет синтаксическую связь оригинала и остаётся литературным русским.
  terminology: «Господи», «беззакония» и «кающихся» точны и регистрово уместны. «Злые дела» допустимо для τὰ κακά; «против меня» ясно передаёт неблагоприятный смысл μοι. «Самые глубокие места земли» приемлемо передаёт τοῖς κατωτάτοις τῆς γῆς, а «на пребывание в» — осторожная русская экспликация результата осуждения, отмеченная в сноске.
