base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/013.yaml
  text: 'I beg you[a], pleading with you: forgive me, Lord, forgive me, and do not destroy me along with my lawless deeds, nor, being angry forever, keep my evils against me, nor condemn me in the lowest parts of the earth; for you, Lord[b], are the God of those who repent[c],'
translation:
  language: ru
  text: 'Прошу Тебя, умоляю Тебя: прости меня, Господи, прости меня! Не погуби меня вместе с моими беззакониями; не храни против меня моих злых дел[a], гневаясь вечно; не осуди меня на пребывание в самых глубоких местах земли[b]. Ведь Ты, Господи, — Бог кающихся.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не храни мне моих злых дел»; то есть не сохраняй их против меня, не вменяй их мне.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не осуди меня в самых нижних местах земли». Выражение обозначает глубочайшие области под землёй; греческая конструкция допускает понимание как места или итогового состояния осуждения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτοῦμαι δεόμενός σου
  choice: Я прошу Тебя, умоляя
  rationale: Сочетание личной формы и причастия усиливает настойчивость и смирение просьбы; русский оборот сохраняет это нарастание без архаизации.
- source_word: ἄνες μοι
  choice: прости меня
  rationale: Буквальное значение связано с освобождением или отпущением, но в покаянной молитве естественно означает прощение.
- source_word: συναπολέσῃς με ταῖς ἀνομίαις μου
  choice: не погуби меня вместе с моими беззакониями
  rationale: «Вместе с» передаёт значение приставки συν-, а «беззакония» сохраняет более сильный оттенок ἀνομία, чем общее «грехи».
- source_word: εἰς τὸν αἰῶνα μηνίσας
  choice: не гневайся вечно
  rationale: Причастная греческая конструкция естественно передана русской личной формой при сохранении временного значения.
- source_word: τηρήσῃς τὰ κακά μοι
  choice: не помни мне моих злых дел
  rationale: Идиоматически передаёт сохранение злых дел против молящегося; буквальное «не храни мне» по-русски неестественно.
- source_word: ἐν τοῖς κατωτάτοις τῆς γῆς
  choice: на пребывание в самых глубоких местах земли
  rationale: Так сохраняется ἐν («в») как место итогового состояния после осуждения, а κατώτατα передано как предельно низкие или глубокие области.
- source_word: τῶν μετανοούντων
  choice: кающихся
  rationale: Причастное существительное обозначает людей, которые каются; краткий русский эквивалент сохраняет процессуальный оттенок.
- source_word: κύριε
  choice: Господи
  rationale: Традиционная и современно понятная русская форма прямого обращения к Богу.
theological_decisions:
- issue: Связь погибели с беззакониями
  choice: не погуби меня вместе с моими беззакониями
  alternative: не погуби меня за мои беззакония
  rationale: Греческое συν- указывает прежде всего на совместность, а не прямо на причинное значение; перевод не превращает образ в однозначное утверждение о наказании «за» грехи.
- issue: Место осуждения в нижних областях земли
  choice: не осуди меня на пребывание в самых глубоких местах земли
  alternative: не осуди меня в самых глубоких местах земли
  rationale: После глагола осуждения оборот может указывать либо на место, где совершается осуждение, либо на итоговое состояние. Выбранный вариант естественен по-русски и сохраняет локальное значение ἐν через «пребывание в».
- issue: Бог кающихся
  choice: Бог кающихся
  alternative: Бог тех, кто обращается
  rationale: μετανοέω здесь естественно означает покаяние; перевод не уточняет сверх текста ни порядок, ни условия божественного прощения.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. Сохранены повтор «прости меня» и последовательность настойчивых прошений. Местоимение «Тебя/Ты» написано с прописной буквы как принятое в русском благоговейном обращении, без добавления конфессионально специфической терминологии.
