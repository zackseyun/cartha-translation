- from: 'Я прошу Тебя, умоляя: прости меня, Господи, прости меня! Не погуби меня вместе с моими беззакониями; не гневайся вечно и не помни мне моих злых дел[a]; не осуди меня на пребывание в самых глубоких местах земли[b]. Ведь Ты, Господи, — Бог кающихся.'
