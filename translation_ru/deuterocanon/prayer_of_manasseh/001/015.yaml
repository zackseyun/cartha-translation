  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/015.yaml
  text: And I will praise you continually all the days of my life[a], for all the host of the heavens sings praise to you, and yours is the glory forever[c][b]. Amen.
translation:
  language: ru
  text: И я буду непрестанно восхвалять Тебя во дни моей жизни, ибо всё небесное воинство[a] воспевает Тебя, и Тебе принадлежит слава вовеки. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вся сила небес»; греческое выражение может также обозначать небесные силы или небесных существ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνέσω
  choice: буду восхвалять
  rationale: Будущее время передано прямо; «восхвалять» естественно для молитвенного и торжественного контекста.
- source_word: διὰ παντός
  choice: непрестанно
  rationale: Устойчивое наречное выражение означает постоянное, непрерывное действие.
- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς μου
  choice: во дни моей жизни
  rationale: Сохраняет предлог ἐν и образ «дней жизни», не добавляя отсутствующего в греческом тексте слова «все»; форма «во дни» уместна в dignified молитвенном регистре и остаётся понятной современному читателю.
- source_word: ὑμνεῖ
  choice: воспевает
  rationale: Передаёт не только хвалу, но и песнопевческий оттенок глагола ὑμνέω.
- source_word: πᾶσα ἡ δύναμις τῶν οὐρανῶν
  choice: всё небесное воинство
  rationale: В иудейско-греческом библейском употреблении δύναμις в небесном контексте может обозначать совокупность небесных сил или существ. «Небесное воинство» естественно передаёт вероятный собирательный смысл, а примечание сохраняет буквальную альтернативу.
- source_word: σοῦ ἐστιν ἡ δόξα
  choice: Тебе принадлежит слава
  rationale: Ясно передаёт эмфатическую принадлежность славы адресату молитвы и сохраняет доксологическое звучание.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Естественная русская формула вечной длительности в заключительной доксологии.
- source_word: ἀμήν
  choice: Аминь
  rationale: Сохранена традиционная русская литургическая транслитерация.
theological_decisions:
- issue: Значение πᾶσα ἡ δύναμις τῶν οὐρανῶν
  choice: собирательное обозначение небесного воинства, воспевающего Бога
  alternative: «вся сила небес» или «всякая небесная сила»
  rationale: Личный глагол хвалы и библейское употребление δύναμις в небесном контексте поддерживают понимание как небесных сил или существ, однако греческая формулировка допускает более буквальное абстрактное прочтение, которое сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Формы «во дни», «воспевает» и «вовеки» поддерживают торжественный ритм, оставаясь понятными. Местоимения, обращённые к Богу, написаны с прописной буквы как знак уважительного молитвенного обращения, без внесения конфессиональной специфики.
