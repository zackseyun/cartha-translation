lexical_decisions:
- source_word: ὁ κλείσας
  choice: Ты заключил
  rationale: Аористное причастие относится к адресату молитвы. В русском продолжение цепи обращений естественно передаётся личной формой; «заключил» сохраняет смысл закрытия и удержания бездны.
- source_word: τὴν ἄβυσσον
  choice: бездну
  rationale: «Бездна» — естественный библейский эквивалент ἄβυσσος, сохраняющий космический образ первозданной или неизмеримой глубины.
- source_word: σφραγισάμενος
  choice: запечатал
  rationale: Глагол точно передаёт действие наложения печати и надёжного закрытия; возвратное значение греческой средней формы отдельно выражать не требуется.
- source_word: αὐτὴν
  choice: её
  rationale: Местоимение относится к существительному женского рода «бездна» и позволяет избежать ненужного повтора.
- source_word: τῷ ... ὀνόματί σου
  choice: Своим ... именем
  rationale: 'Творительный падеж передаёт инструментальный дательный: имя выступает средством запечатания. Возвратное «Своим» нормативно соотносит принадлежность с подлежащим «Ты».'
- source_word: φοβερῷ
  choice: грозным
  rationale: «Грозный» в возвышенном современном русском обозначает внушающий страх и благоговейный трепет, не создавая двусмысленности слова «страшный» как «ужасный» или «плохой».
- source_word: ἐνδόξῳ
  choice: славным
  rationale: «Славный» прямо сохраняет связь с библейским понятием славы и естественно сочетается с «именем» в молитвенном регистре.
theological_decisions:
- issue: Передача φοβερῷ применительно к имени Бога
  choice: грозным
  alternative: внушающим трепет
  rationale: Основной вариант сохраняет представление об имени Бога как вызывающем страх и благоговение. Слово не сводится ни к ужасу, ни к простому восхищению; более разъяснительный оттенок дан в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного обращения. Прописные «Ты», «Своим» поддерживают традиционный русский молитвенный регистр, не добавляя отдельного богословского толкования.
