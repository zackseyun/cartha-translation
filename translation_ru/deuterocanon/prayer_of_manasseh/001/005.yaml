    text: 'Или: «и нестерпим гнев Твоей угрозы, обращённой против грешников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν πάντα φρίσσει καὶ τρέμει
  choice: пред Которым всё содрогается и трепещет
  rationale: Средний род πάντα обозначает всё сущее, а единственное число глаголов естественно передаётся русским собирательным «всё». Сочетание «содрогается и трепещет» сохраняет усилительный параллелизм φρίσσει и τρέμει.
- source_word: ἀπὸ προσώπου τῆς δυνάμεώς σου
  choice: при явлении Твоей силы
  rationale: Оборот буквально связан с «лицом/присутствием» силы. «При явлении» естественно выражает непосредственное присутствие и воздействие Божьей силы, не вводя неясного образа «лица силы».
- source_word: ἄστεκτος
  choice: невозможно вынести
  rationale: Слово может означать как невозможность вытерпеть, так и невозможность противостоять. В основном тексте выбран ясный современный оборот; иной оттенок отмечен в сноске.
- source_word: μεγαλοπρεπία τῆς δόξης σου
  choice: величие Твоей славы
  rationale: Передаёт возвышенное значение μεγαλοπρεπία и сохраняет традиционно весомое богословское понятие «слава» для δόξα.
- source_word: ἀνυπόστατος
  choice: невозможно устоять перед
  rationale: Передаёт то, чему нельзя противостоять или что нельзя выдержать, и сохраняет смысловой параллелизм с ἄστεκτος без дословного повтора.
- source_word: ἡ ὀργὴ τῆς ἐπὶ ἁμαρτωλοὺς ἀπειλῆς σου
  choice: гнев Твоей угрозы грешникам
  rationale: Сохраняет сильные существительные ὀργή («гнев») и ἀπειλή («угроза»), а ἐπὶ ἁμαρτωλούς передаёт направленность угрозы на грешников.
theological_decisions:
- issue: Личностный язык о Божьем гневе и угрозе
  choice: 'Сохранено: «гневом Твоей угрозы грешникам»'
  alternative: «угрожающим грешникам гневом» или смягчённое «предупреждением грешникам»
  rationale: Греческий текст прямо говорит и о гневе, и об угрозе. Перевод не смягчает судебную силу выражения и не превращает его в развёрнутое учение о наказании.
- issue: Оттенок двух близких прилагательных ἄστεκτος и ἀνυπόστατος
  choice: «невозможно вынести» и «невозможно устоять перед»
  alternative: 'Оба выражения можно передать одинаково: «нестерпимо/нестерпим»'
  rationale: Разные русские обороты отражают общий смысл неодолимости, сохраняя возможные оттенки терпения и противостояния, не делая их жёстким богословским различием.
translation_notes:
  register: Современный литературный русский с возвышенным молитвенным звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис сохраняет торжественный параллелизм греческого текста, но избегает архаизмов и буквального, неясного выражения «от лица Твоей силы».
