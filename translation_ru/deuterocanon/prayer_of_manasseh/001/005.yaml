  text: before whom all things shudder and tremble at the presence of your power[a], for the majesty of your glory is unendurable, and the wrath of your threat against sinners is unbearable[d][c][b],
translation:
  language: ru
  text: пред Которым всё содрогается и трепещет от присутствия Твоей силы, ибо невозможно вынести величие Твоей славы[a] и невозможно устоять перед гневом Твоей угрозы, обращённой против грешников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «величию Твоей славы невозможно противостоять».'
