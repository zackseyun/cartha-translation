lexical_decisions:
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма божественного обращения κύριος естественно и традиционно передаётся русским «Господи».
- source_word: παντοκράτωρ
  choice: Вседержитель
  rationale: Устоявшийся в русской библейской речи титул, передающий παντοκράτωρ как владычество и могущество Бога над всем.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Боже наших отцов
  rationale: Сохранена библейская формула завета и явно мужское обозначение πατέρων; русский звательный оборот согласован с обращением.
- source_word: τοῦ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: Авраама, Исаака и Иакова
  rationale: Имена патриархов переданы в их традиционной русской библейской форме; тире ясно показывает их пояснительное отношение к «нашим отцам» и сохраняет связь родительных форм с «Боже».
- source_word: σπέρματος
  choice: потомства
  rationale: В данном контексте слово обозначает родовую линию; «потомство» естественно по-русски и сохраняет собирательное значение единственного числа. Более буквальное «семя» вынесено в примечание.
- source_word: αὐτῶν
  choice: их
  rationale: Местоимение отнесено к только что названным трём патриархам, что соответствует ближайшему множественному антецеденту.
- source_word: τοῦ δικαίου
  choice: праведного
  rationale: Прилагательное согласовано с собирательным существительным «потомство» и сохраняет стандартную библейскую передачу δικαίου.
theological_decisions:
- issue: Гендерно маркированная формула τῶν πατέρων ἡμῶν
  choice: наших отцов
  alternative: наших предков
  rationale: Греческий текст прямо говорит об «отцах», а выражение имеет устойчивое заветное звучание; нейтрализация до «предков» здесь не требуется.
- issue: Передача σπέρμα в контексте линии завета
  choice: потомство
  alternative: семя
  rationale: «Потомство» понятно современному читателю и сохраняет собирательный смысл, тогда как «семя» точнее отражает буквальный образ и заветные ассоциации, но в основном тексте звучит менее естественно; эта значимая альтернатива отмечена в сноске.
- issue: Синтаксическая связь имён патриархов
  choice: имена оформлены как пояснение к «нашим отцам»
  alternative: Боже наших отцов, Боже Авраама, Исаака и Иакова
  rationale: Греческая цепочка родительных допускает понимание имён как дальнейшего определения Бога и одновременно конкретизирует «отцов». Оформление через тире естественно по-русски и не добавляет отсутствующего в источнике повторения слова «Боже».
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Формы «Господи», «Боже» и титул «Вседержитель» сохраняют достоинство молитвенного обращения без архаизации всего предложения. Маркер сноски поставлен непосредственно после слова, к которому относится.
