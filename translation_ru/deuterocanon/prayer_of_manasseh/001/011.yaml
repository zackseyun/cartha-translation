  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/011.yaml
  text: And now I bend the knee of my heart[a], imploring the kindness from you[b];
translation:
  language: ru
  text: И теперь я преклоняю колено сердца моего[a], моля о благости, исходящей от Тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «склоняю колено сердца моего». В греческом сохранена яркая метафора внутреннего коленопреклонения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «моля о Твоей благости». Буквально выражение подчёркивает, что эта благость исходит от Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: И теперь
  rationale: Сохраняет как соединительную силу καί, так и непосредственное временное значение νῦν.
- source_word: κλίνω
  choice: преклоняю
  rationale: Естественно сочетается в русском с «колено» и сохраняет образ смиренного телесного жеста.
- source_word: γόνυ καρδίας
  choice: колено сердца моего
  rationale: Передаёт единственное число и родительный оборот оригинала, не сглаживая яркую метафору внутреннего преклонения.
- source_word: δεόμενος
  choice: моля
  rationale: Передаёт настойчивую, смиренную просьбу и соответствует достоинству молитвенного регистра.
- source_word: τῆς παρὰ σοῦ χρηστότητος
  choice: о благости, исходящей от Тебя
  rationale: «Благость» передаёт χρηστότης в обращённом к Богу молитвенном контексте, а «исходящей от Тебя» явно сохраняет значение παρὰ σοῦ.
theological_decisions:
- issue: Метафора γόνυ καρδίας
  choice: Сохранить как «колено сердца моего»
  alternative: «смиренно преклоняю своё сердце»
  rationale: Оригинал выражает покаяние через необычный образ внутреннего коленопреклонения; его сохранение не вносит дополнительного толкования.
- issue: Смысл τῆς παρὰ σοῦ χρηστότητος
  choice: «о благости, исходящей от Тебя»
  alternative: «о Твоей благости»
  rationale: Развёрнутый вариант сохраняет особый акцент греческого παρὰ σοῦ на Боге как источнике благости.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Необычная метафора оригинала сохранена; прописная буква в «Тебя» отражает устойчивую русскую практику благоговейного обращения к Богу, не меняя смысла текста.
