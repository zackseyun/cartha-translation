base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/010.yaml
  text: I am bent down with many iron bonds[a], so that I cannot lift up my head, and there is no relief for me; because I provoked your wrath and did what is evil before you[b], setting up abominations and multiplying offenses.
translation:
  language: ru
  text: Я согбен многими железными оковами и не могу поднять головы[a]; нет мне облегчения, потому что я вызвал Твой гнев и сделал зло пред Тобой, воздвигнув мерзости[b] и умножив оскорбления.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не могу прийти в себя» или «не могу снова взглянуть вверх»; греческий глагол может обозначать как восстановление сил или самообладания, так и физическое движение вверх.'
    reason: lexical_alternative
  - marker: b
    text: «Мерзости» — вероятно, отвратительные пред Богом предметы или дела, особенно связанные с идолопоклонством.
    reason: cultural_note
lexical_decisions:
- source_word: κατακαμπτόμενος
  choice: я согбен
  rationale: Причастие передаёт образ человека, согнувшегося под тяжестью. «Согбен» сохраняет телесный и покаянный образ и соответствует достоинству молитвенного регистра.
- source_word: πολλῷ δεσμῷ σιδηρῷ
  choice: тяжёлыми железными оковами
  rationale: δεσμός может означать узы, цепь или оковы; πολλῷ здесь естественно передать как усиление тяжести и стеснения. Русское множественное «оковами» идиоматично, хотя греческая форма существительного единственного числа.
- source_word: εἰς τὸ ἀνανεῦσαί με
  choice: и не могу поднять головы
  rationale: ἀνανεύω допускает значения подняться, взглянуть вверх или прийти в себя. В сочетании с образом согбенности «поднять головы» сохраняет физическую метафору; невозможность выражена по смыслу контекста.
- source_word: ἄνεσις
  choice: облегчение
  rationale: Слово обозначает ослабление давления, облегчение или освобождение. «Облегчение» естественно охватывает и телесное стеснение, и бедственное состояние.
- source_word: παρώργισα τὸν θυμόν σου
  choice: я вызвал Твой гнев
  rationale: παροργίζω имеет каузативный смысл — вызвать или возбудить гнев. Формулировка сохраняет прямое библейское свидетельство о Божьем гневе без догматического расширения.
- source_word: τὸ πονηρὸν ἐνώπιόν σου ἐποίησα
  choice: сделал зло пред Тобой
  rationale: Сохранён устойчивый библейский оборот и направленность поступка по отношению к Богу; «пред Тобой» звучит естественно в современной возвышенной молитвенной речи.
- source_word: στήσας βδελύγματα
  choice: воздвигнув мерзости
  rationale: στήσας указывает на установление или воздвижение, а βδελύγματα — на отвратительные, вероятно идольские, предметы или деяния. Перевод сохраняет культовый оттенок, не делая его единственно возможным.
- source_word: πληθύνας προσοχθίσματα
  choice: умножив оскорбляющие Тебя дела
  rationale: Редкое προσοχθίσματα обозначает то, что вызывает отвращение, негодование или раздражение. Развёрнутая передача ясна по-русски и сохраняет отношение этих дел к Богу.
theological_decisions:
- issue: Передача выражения о Божьем гневе
  choice: вызвал Твой гнев
  alternative: разгневал Тебя; вызвал Твою ярость
  rationale: Греческий текст прямо говорит о θυμός Бога. «Гнев» сохраняет серьёзность суда, не усиливая выражение до «ярости» и не смягчая его.
- issue: Толкование εἰς τὸ ἀνανεῦσαί με
  choice: не могу поднять головы
  alternative: не могу прийти в себя; не могу снова взглянуть вверх
  rationale: Контекст согбенности под железными оковами поддерживает телесный образ, но лексическая неоднозначность отмечена в сноске.
- issue: Предполагаемый идолопоклоннический смысл βδελύγματα
  choice: мерзости с пояснением в сноске
  alternative: идолы; идольские мерзости
  rationale: Контекст молитвы Манассии делает идолопоклоннический смысл вероятным, однако само слово шире; основной текст не сужает его безусловно до идолов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Формы «согбен» и «пред Тобой» сохраняют достоинство и библейскую окраску, оставаясь понятными. Местоимения, обращённые к Богу, написаны с прописной буквы как издательская норма данного русского текста.
