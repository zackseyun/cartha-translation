lexical_decisions:
- source_word: ὁ πεδήσας
  choice: связавший
  rationale: Аористное причастие передаёт совершённое действие и сохраняет конкретный греческий образ связывания или сковывания. «Обуздавший» естественнее передаёт смысл ограничения, но ослабляет буквальную метафору.
- source_word: τὴν θάλασσαν
  choice: море
  rationale: Прямое соответствие θάλασσα; вариант «воды» неоправданно расширил бы значение.
- source_word: τῷ λόγῳ
  choice: словом
  rationale: Здесь λόγος обозначает властное произнесённое слово. «Словом» прямо передаёт греческий текст и сохраняет мотив действенности божественной речи.
- source_word: τοῦ προστάγματός σου
  choice: твоего повеления
  rationale: πρόσταγμα означает приказ или повеление. «Повеление» звучит достойно и естественно в молитвенном контексте, сохраняя конструкцию «словом твоего повеления».
theological_decisions:
- issue: Божественная власть над творением выражена образом связывания моря
  choice: 'Сохранён конкретный образ: «связавший море»'
  alternative: обуздавший море; сдержавший море; положивший предел морю
  rationale: Греческое причастие создаёт яркий образ связывания или сковывания. Его сохранение передаёт власть Бога над морем, не заменяя метафору толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Строчная буква в местоимении «твоего» соответствует современной нейтральной издательской практике; причастная форма сохраняет синтаксическую связь с окружающим обращением.
