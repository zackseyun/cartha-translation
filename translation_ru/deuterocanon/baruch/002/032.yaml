lexical_decisions:
- source_word: αἰνέσουσίν
  choice: будут восхвалять
  rationale: Будущее действительного залога от αἰνέω означает словесное выражение хвалы; «восхвалять» естественно передаёт направленность хвалы на Бога и сохраняет возвышенный, но современный регистр.
- source_word: ἐν γῇ
  choice: в земле
  rationale: Предлог ἐν с γῇ имеет локативное значение. Определённость выражения задаётся последующим родительным оборотом, поэтому по-русски естественно «в земле».
- source_word: ἀποικισμοῦ αὐτῶν
  choice: своего изгнания
  rationale: ἀποικισμός обозначает переселение и пребывание вдали от родины; в контексте суда и рассеяния «изгнание» лучше всего передаёт вынужденность положения. Возвратное «своего» естественно соотносит изгнание с подлежащим «они».
- source_word: μνησθήσονται
  choice: вспомнят
  rationale: Будущее от μιμνῄσκομαι прямо означает «вспомнят»; особого выражения среднего залога в русском здесь не требуется.
- source_word: τοῦ ὀνόματός μου
  choice: Моё имя
  rationale: Сохранён библейский оборот «Моё имя», способный обозначать не только наименование, но и явленную сущность и честь Бога, без разъясняющей парафразы в основном тексте.
theological_decisions:
- issue: Смысл выражения «Моё имя» в контексте завета
  choice: Сохранить буквально «Моё имя»
  alternative: «кто Я», «Моя слава» или «Моя репутация»
  rationale: Греческий текст сохраняет библейскую идиому «имя». Буквальная передача не сужает её богословскую многозначность и не подменяет её толкованием.
- issue: Значение ἀποικισμός в контексте суда и восстановления
  choice: «изгнание»
  alternative: «выселение», «переселение» или «рассеяние»
  rationale: «Изгнание» естественно выражает пребывание вдали от родины вследствие суда, не добавляя более узкой административной идеи депортации.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис близок к греческому, но естественен для русского; местоимения, относящиеся к Богу, оформлены с прописной буквы согласно распространённой русской библейской традиции.
