lexical_decisions:
- source_word: οὐκ ἐποιήθη ὑποκάτω παντὸς τοῦ οὐρανοῦ
  choice: Под всем небом не совершалось ничего подобного
  rationale: Греческая безличная пассивная конструкция буквально означает «не было сделано под всем небом»; естественная русская формулировка сохраняет смысл беспримерности события.
- source_word: καθὰ ἐποίησεν ἐν Ἰερουσαλήμ
  choice: тому, что Он совершил в Иерусалиме
  rationale: Сохранён переход от безличного пассива к личной форме глагола. Местоимение «Он» указывает на Бога из ближайшего контекста, не добавляя имени в основной текст.
- source_word: κατὰ τὰ γεγραμμένα
  choice: согласно написанному
  rationale: Передаёт нормативное соответствие произошедшего записанному в Писании и естественно звучит по-русски.
- source_word: ἐν τῷ νόμῳ Μωυσῆ
  choice: в законе Моисея
  rationale: Прямой и традиционно понятный эквивалент греческого выражения.
theological_decisions:
- issue: Субъект формы ἐποίησεν не назван внутри данного стиха
  choice: Он
  alternative: Бог / Господь
  rationale: Местоимение сохраняет анафорическую связь с контекстом и не вносит отсутствующее в стихе божественное наименование.
- issue: Соотношение Божьего действия и записанного в законе суда
  choice: Сохранить формулировку «Он совершил»
  alternative: «случилось» или «Он допустил»
  rationale: Активная греческая форма прямо приписывает действие подразумеваемому субъекту; смягчение до допущения разрешило бы богословское напряжение, которого исходный текст не разрешает.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Двоеточие в конце показывает, что синтаксическая мысль продолжается в следующем стихе; прописное «Он» ясно обозначает Бога при сохранении местоименной формы оригинала.
