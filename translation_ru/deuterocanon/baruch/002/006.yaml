  text: To the Lord our God belongs righteousness[a], but to us and to our fathers belongs shame of face[b], as it is this day.
translation:
  language: ru
  text: Господу, Богу нашему, принадлежит праведность[a], а нам и нашим отцам — стыд на лицах[b], как и ныне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость». Греческое слово может обозначать как праведность, так и справедливость; здесь речь также о том, что Бог прав.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «стыд лиц» — библейское выражение, означающее явное бесчестье и унижение.'
    reason: cultural_note
lexical_decisions:
- source_word: Τῷ κυρίῳ θεῷ ἡμῶν
  choice: Господу, Богу нашему, принадлежит
  rationale: Дательный оборот выражает принадлежность; такая передача сохраняет атрибутивную структуру греческого текста и противопоставление двух частей стиха.
- source_word: ἡ δικαιοσύνη
  choice: праведность
  rationale: 'Слово охватывает праведность, правоту и справедливость. В исповедальном контексте «праведность» сохраняет широту смысла: Бог прав, тогда как народ посрамлён.'
- source_word: ἡμῖν δὲ καὶ τοῖς πατράσιν ἡμῶν
  choice: а нам и нашим отцам
  rationale: Сохранены противопоставление δέ и явное включение предков в общее признание вины.
- source_word: ἡ αἰσχύνη τῶν προσώπων
  choice: стыд на лицах
  rationale: Близкая к буквальной передача сохраняет библейский образ и при этом звучит понятнее по-русски, чем «стыд лиц»; выражение указывает на явное бесчестье и унижение.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: как это и есть ныне
  rationale: Формула указывает на нынешнее, очевидное положение дел; «ныне» поддерживает достойный библейский регистр без архаической тяжеловесности.
theological_decisions:
- issue: Значение δικαιοσύνη применительно к Богу
  choice: Божья праведность и правота противопоставлены позору народа и его предков
  alternative: Божья справедливость противопоставлена их бесчестью
  rationale: «Праведность» не сводит высказывание только к судебной справедливости и сохраняет богословскую широту греческого слова; примечание отмечает допустимый вариант «справедливость».
translation_notes:
