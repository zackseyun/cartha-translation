  source_fidelity: Греческое ἐν τοῖς ἔθνεσιν означает «среди народов», а οὗ διέσπειρας ἡμᾶς — «куда/где Ты рассеял нас». Вариант «по которым Ты нас рассеял» смещает образ к движению по территориям и менее точно передаёт пребывание среди народов. Русское «куда» естественно выражает направление рассеяния; отдельное ἐκεῖ в греческом имеет указательный, почти избыточный характер и не требует неестественного буквального повтора в русском.
  naturalness: Начало стиха и «нас осталось мало» звучат естественно в современном литературном русском. Замена «по которым» на «куда» делает относительную конструкцию более идиоматичной и ясной.
  terminology: «Гнев», «народы» и молитвенное «Да отвратится» уместны и точно передают θυμός, ἔθνη и ἀποστραφήτω. Написание «Твой/Ты» соответствует принятой русской библейской традиции.
