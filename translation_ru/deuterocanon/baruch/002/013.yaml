lexical_decisions:
- source_word: ἀποστραφήτω
  choice: да отвратится
  rationale: Форма пожелания/мольбы передана возвышенной, но понятной русской конструкцией, сохраняющей образ поворота прочь.
- source_word: ὁ θυμός σου
  choice: Твой гнев
  rationale: θυμός здесь обозначает Божий гнев; притяжательное местоимение сохранено.
- source_word: ὅτι
  choice: потому что
  rationale: Сохранено причинное значение союза, соответствующее данному контексту.
- source_word: κατελείφθημεν ὀλίγοι
  choice: нас осталось мало
  rationale: Естественная русская передача состояния уцелевшего малочисленного остатка без добавления отсутствующего в тексте субъекта действия.
- source_word: ἐν τοῖς ἔθνεσιν οὗ διέσπειρας ἡμᾶς ἐκεῖ
  choice: среди народов, по которым Ты нас рассеял
  rationale: Передаёт нахождение среди народов и рассеяние по ним; отдельное «там» не воспроизведено, поскольку в русском оно было бы избыточно при относительной конструкции, тогда как греческое ἐκεῖ коррелирует с οὗ.
theological_decisions:
- issue: Просьба об отвращении Божьего гнева
  choice: Да отвратится от нас Твой гнев
  alternative: Отврати от нас Свой гнев
  rationale: Сохранена греческая форма третьего лица повелительного наклонения как молитвенное пожелание, а не преобразована в прямое повеление Богу.
- issue: Малочисленность рассеянного народа
  choice: нас осталось мало
  alternative: мы оставлены немногими
  rationale: Выбрана естественная русская формулировка, которая не уточняет богословски, кем именно они были оставлены, и сохраняет пассивный результат исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным оборотом «да отвратится». Обращённые к Богу местоимения написаны с прописной буквы по принятой русской библейской традиции. Синтаксически избыточное «там» опущено без потери смысла.
