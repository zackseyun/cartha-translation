lexical_decisions:
- source_word: τοῦ φαγείν
  choice: так что … ел
  rationale: Артикулярный инфинитив с τοῦ в данном фрагменте передаёт зависимое следственно-результативное действие. Русское «так что … ел» естественно выражает эту связь, не превращая отрывок в самостоятельное высказывание.
- source_word: ἄνθρωπον
  choice: мужчина
  rationale: Форма ἄνθρωπον дважды употреблена в единственном числе; «мужчина» сохраняет конкретность и параллелизм греческой конструкции.
- source_word: σάρκας
  choice: плоть
  rationale: Здесь речь идёт буквально о телесной плоти. Слово «плоть» прямо и с надлежащей серьёзностью передаёт смысл.
- source_word: υἱοῦ αὐτοῦ
  choice: своего сына
  rationale: Возвратное «своего» естественно по-русски соотносит сына с субъектом действия. Оно передаёт αὐτοῦ как притяжательное местоимение, не добавляя усилительного значения «собственного».
- source_word: θυγατρὸς αὐτοῦ
  choice: своей дочери
  rationale: Возвратное «своей» естественно соотносит дочь с субъектом действия и сохраняет параллель с первой половиной фразы.
