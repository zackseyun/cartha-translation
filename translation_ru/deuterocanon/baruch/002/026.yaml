lexical_decisions:
- source_word: ἔθηκας
  choice: сделал … таким
  rationale: Аорист τίθημι вместе с последующим оборотом состояния передаёт приведение дома в его нынешнее состояние; по-русски это естественно выражается конструкцией «сделал … таким».
- source_word: τὸν οἶκον
  choice: дом
  rationale: Слово буквально означает «дом» и в контексте указывает на храм. Сохранение «дом» передаёт библейский образ Божьего дома, не подменяя его пояснением.
- source_word: οὗ ἐπεκλήθη τὸ ὄνομά σου ἐπ᾽ αὐτῷ
  choice: над которым было наречено Твоё имя
  rationale: Формулировка сохраняет семитизированный греческий оборот, выражающий принадлежность и посвящённость Богу, но устраняет неприемлемую для русского языка избыточность буквального «над которым… над ним».
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: каков он ныне
  rationale: Библейская идиома обозначает нынешнее, очевидное состояние дома. Такой перевод естественен по-русски и ясно связывается с конструкцией «сделал … таким».
- source_word: διὰ πονηρίαν
  choice: за нечестие
  rationale: Предлог имеет причинное значение. «За» здесь также передаёт смысл последствий и воздаяния, а «нечестие» выражает нравственное зло в покаянном контексте.
- source_word: οἴκου Ἰσραὴλ καὶ οἴκου Ἰούδα
  choice: дома Израиля и дома Иуды
  rationale: Повтор слова «дом» сохраняет корпоративный и заветный язык источника, не сводя выражение просто к географическим или этническим названиям.
theological_decisions:
- issue: Значение «дома» и формулы наречения имени
  choice: Сохранены «дом» и формула «над которым было наречено Твоё имя»; в контексте речь идёт об Иерусалимском храме, отмеченном Божьим именем.
  alternative: «Храм, носящий Твоё имя».
  rationale: Основной текст сохраняет богословски значимый образ Божьего владения и присутствия, не заменяя его полностью истолковывающей парафразой.
- issue: Причина нынешнего состояния дома
  choice: «За нечестие» передаёт прямую связь между нечестием заветного народа и состоянием храма.
  alternative: «Из-за зла» или «вследствие нечестия».
  rationale: Перевод не ослабляет утверждаемую текстом ответственность домов Израиля и Иуды и одновременно не уточняет сверх источника характер Божьего действия.
translation_notes:
  register: Современный литературный русский с достоинством библейской молитвенной речи. Заглавные буквы в местоимениях, относящихся к Богу, сохранены как уместная русская издательская норма. Инверсия сведена к минимуму; повтор «дома» оставлен ради структуры и корпоративного смысла оригинала.
