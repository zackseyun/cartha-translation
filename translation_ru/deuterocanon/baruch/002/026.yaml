  terminology: «Дом Израиля» и «дом Иуды» следует сохранить. В основном тексте «дом, носящий Твоё имя» является естественным русским соответствием формулы; буквальная форма должна быть дана в сноске. Заглавные буквы в обращении к Богу сохранены.
