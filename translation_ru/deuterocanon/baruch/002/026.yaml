  source_fidelity: 'Смысл передан верно: речь о доме (в контексте храме), носящем Божье имя, приведённом к его нынешнему состоянию вследствие нечестия дома Израиля и дома Иуды. Однако «над которым было наречено Твоё имя» неточно и неестественно: «наречь имя» обычно значит дать имя, тогда как греческая семитская формула говорит о призывании/наречении Божьего имени над домом как знаке принадлежности.'
