  text: and I will bring them back to the land that I swore to their fathers—to Abraham and Isaac and Jacob—and they will rule over it; and I will multiply them[a], and they will certainly not be diminished.
translation:
  language: ru
  text: И Я возвращу их в землю, которую Я обещал с клятвой их отцам — Аврааму, Исааку и Иакову; и они будут господствовать над нею[a]. Я умножу их, и численность их вовсе не уменьшится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут владеть ею». Греческий глагол может обозначать владение или осуществление власти; в основном тексте передано его более прямое значение — господство над землёй.'
