lexical_decisions:
- source_word: ἀποστρέψω
  choice: возвращу
  rationale: Каузативное значение глагола в сочетании с направлением εἰς τὴν γῆν передаёт возвращение людей в прежнюю землю; по-русски «возвращу их» естественно выражает это движение.
- source_word: γῆν
  choice: землю
  rationale: В контексте клятвы патриархам речь идёт об обещанной земле, а не о земле как мире или почве.
- source_word: ὤμοσα
  choice: поклялся отдать
  rationale: «Поклялся» сохраняет прямое указание на клятву; инфинитив «отдать» естественно восполняет подразумеваемое в греческой конструкции содержание клятвы и направление к земле.
- source_word: πατράσιν
  choice: отцам
  rationale: Далее прямо названы Авраам, Исаак и Иаков, поэтому буквальное «отцам» уместно и сохраняет патриархальную формулировку источника.
- source_word: κυριεύσουσιν
  choice: будут владеть
  rationale: В отношении земли глагол обозначает господство над ней и допускает естественное русское «владеть»; вариант сохраняет связь обладания с властью, не сводя смысл лишь к проживанию.
- source_word: πληθυνῶ
  choice: умножу
  rationale: Передаёт каузативное увеличение народа и сохраняет узнаваемый язык заветного обещания.
- source_word: οὐ μὴ σμικρυνθῶσιν
  choice: никогда их не станет меньше
  rationale: «Никогда… не» естественно передаёт усиленное отрицание οὐ μή, а «не станет меньше» выражает уменьшение их числа без тяжеловесной пассивной конструкции.
theological_decisions:
- issue: Восстановление на основании клятвы патриархам
  choice: Сохранены клятва, слово «отцы» и имена Авраама, Исаака и Иакова
  alternative: 'Передать обобщённо: «в землю, обещанную их предкам»'
  rationale: Явная связь возвращения с Божьей клятвой конкретным патриархам существенна для стиха и не должна заменяться более общим пересказом.
- issue: Характер отношения народа к земле
  choice: «будут владеть ею» с примечанием о возможном значении господства
  alternative: «будут господствовать над ней»
  rationale: Контекст земли делает «владеть» естественным, но примечание сохраняет более сильный оттенок κυριεύω и не устраняет лексическую неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но ясным библейским звучанием. Синтаксис разделён на короткие фразы ради естественности; заглавная «Я» обозначает речь Бога. Усиленное отрицание передано идиоматически: «никогда их не станет меньше».'
