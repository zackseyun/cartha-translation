base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/008.yaml
  text: And we did not entreat the favor of the Lord[b][a], that each one might turn from the thoughts of their evil heart.
translation:
  language: ru
  text: И мы не умоляли Господа о милости[a], чтобы Он отвратил каждого от помыслов его злого сердца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не умоляли лица Господа». Это выражение означает обращаться к Господу, ища Его благоволения или милости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от замыслов (намерений) его злого сердца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθημεν
  choice: умоляли
  rationale: Глагол δέομαι означает настойчиво просить, молить; «умоляли» передаёт силу обращения и соответствует возвышенному покаянному контексту.
- source_word: τοῦ προσώπου Κυρίου
  choice: Господа о милости
  rationale: Буквально «лица Господа»; в сочетании с δέομαι это семитский оборот об обращении к Господу за благосклонностью и милостью. Русская конструкция естественно перестроена.
- source_word: τοῦ ἀποστρέψαι
  choice: чтобы ... отвернулся
  rationale: Артикулированный инфинитив передаёт цель или предполагаемый результат моления; «чтобы» сохраняет эту связь.
- source_word: ἕκαστον
  choice: каждый
  rationale: Сохраняет дистрибутивное, индивидуализирующее значение греческого единственного числа.
- source_word: νοημάτων
  choice: помыслов
  rationale: νόημα может означать мысли, намерения или замыслы. «Помыслы» естественно для библейского нравственного контекста и сохраняет смысловую широту.
- source_word: καρδίας
  choice: сердца
  rationale: Сохраняет библейский образ сердца как средоточия мысли и воли, не сводя его только к разуму или чувствам.
- source_word: αὐτῶν
  choice: своего
  rationale: После дистрибутивного «каждый» русское возвратное местоимение в единственном числе естественно соотносит сердце с каждым человеком; греческое множественное αὐτῶν относится ко всей группе.
- source_word: τῆς πονηρᾶς
  choice: злого
  rationale: Передаёт нравственную характеристику сердца, выраженную πονηρός, прямо и без ослабления.
theological_decisions:
- issue: Идиома «лицо Господа»
  choice: умоляли Господа о милости
  alternative: умоляли пред лицом Господа; искали благоволения Господа
  rationale: Контекст выражает не пространственное нахождение перед Богом, а мольбу о Его благосклонном внимании. «О милости» ясно передаёт идиоматический смысл, а буквальная форма отмечена в сноске.
- issue: Внутренний источник зла
  choice: помыслы своего злого сердца
  alternative: замыслы своего злого сердца; мысли своего нечестивого сердца
  rationale: Сохранён образ сердца как источника мыслей и намерений; «помыслы» не устраняет неоднозначность νόημα между мыслью, намерением и замыслом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис остаётся ясным для широкого читателя; образ сердца сохранён, а непрозрачная буквальная идиома о лице Господа раскрыта в основном тексте и отражена в сноске.
