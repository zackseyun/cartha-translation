lexical_decisions:
- source_word: οὐκ ἠκούσαμεν τῆς φωνῆς αὐτοῦ
  choice: не послушали Его голоса
  rationale: Глагол ἀκούω здесь означает не просто физически услышать, а внять сказанному. Формулировка сохраняет образ Божьего голоса и одновременно передаёт отказ повиноваться, не заменяя библейскую идиому прямым «не повиновались».
- source_word: πορεύεσθαι
  choice: ходить
  rationale: В контексте заповедей глагол обозначает образ жизни и поведения. «Ходить» сохраняет библейскую метафору, оставаясь понятным в сочетании «ходить по повелениям».
- source_word: τοῖς προστάγμασιν
  choice: по повелениям
  rationale: πρόσταγμα — предписание, приказ или повеление. «Повеления» точно передаёт обязательную силу сказанного и естественно звучит в данном религиозном контексте.
- source_word: Κυρίου
  choice: Господа
  rationale: Традиционное и точное соответствие κύριος в обозначении Бога.
- source_word: οἷς ἔδωκεν κατὰ πρόσωπον ἡμῶν
  choice: которые Он дал нам
  rationale: Греческий оборот буквально говорит о данных «перед нашим лицом» повелениях. В современном русском «дал нам» естественно передаёт вручение и предъявление народу заповедей; пространственный образ отмечен в сноске.
theological_decisions:
- issue: Означает ли ἀκούω простое слышание или послушание
  choice: не послушали Его голоса
  alternative: не повиновались Ему
  rationale: Выбранный вариант сохраняет богословски значимую библейскую связь между слышанием Божьего голоса и послушанием, не сводя её к одному лишь результату.
- issue: Следует ли сохранять метафору нравственного хождения в πορεύεσθαι
  choice: ходить по повелениям
  alternative: жить по повелениям
  rationale: «Ходить» передаёт исходную метафору жизненного пути; «жить» было бы яснее, но устранило бы образность текста.
- issue: Как передать κατὰ πρόσωπον ἡμῶν
  choice: дал нам с пояснением буквального образа в сноске
  alternative: поставил перед нами
  rationale: Основной текст передаёт смысл естественным современным русским языком, а сноска сохраняет сведения о пространственном образе оригинала без навязывания особого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Сочетания «Его голос» и «ходить по повелениям» намеренно сохраняют ключевые метафоры оригинала; архаические формы вроде «глас» и «пред лицем» не используются.
