lexical_decisions:
- source_word: ἔδωκεν αὐτοὺς ὑποχειρίους
  choice: отдал их под власть
  rationale: Сочетание выражает передачу людей во власть других и их подчинённое положение; русский оборот передаёт это естественно и сохраняет силу суда.
- source_word: πάσαις ταῖς βασιλείαις ταῖς κύκλῳ ἡμῶν
  choice: всех царств, окружающих нас
  rationale: Сохранены множественное число, всеохватность πάσαις и пространственное значение κύκλῳ.
- source_word: εἰς ὀνειδισμόν
  choice: на поругание
  rationale: ὀνειδισμός обозначает публичный позор, поношение или поругание; выбранный вариант уместен в высоком, но понятном библейском регистре.
- source_word: ἄβατον
  choice: запустение
  rationale: Буквально слово связано с непроходимым или нехоженым местом; в контексте суда «запустение» естественно передаёт итоговое состояние, а буквальная возможность отмечена в сноске.
- source_word: ἐν πᾶσι τοῖς λαοῖς τοῖς κύκλῳ οὗ
  choice: среди всех окрестных народов, куда
  rationale: 'Оборот передан естественно по-русски: λαοί — «народы», κύκλῳ — «окрестные», а οὗ сохраняет местное значение «куда/где» в связи с последующим глаголом рассеяния.'
- source_word: διέσπειρεν
  choice: рассеял
  rationale: Это обычное обозначение рассеяния народа в изгнании; «рассеял» точно и узнаваемо передаёт образ.
- source_word: Κύριος
  choice: Господь
  rationale: Стандартная передача κύριος в данном богословском контексте; сохраняет прямое приписывание рассеяния Господу.
theological_decisions:
- issue: Действующее лицо в ἔδωκεν и связь с Κύριος
  choice: «Он» с прописной буквы и далее «Господь»
  alternative: «он» со строчной буквы
  rationale: Контекст и явное Κύριος в конце относят действие к Господу. Прописная буква соответствует русской библейской издательской норме, не добавляя нового действующего лица.
- issue: Сила ἄβατον в контексте суда
  choice: «запустение» с лексической сноской
  alternative: «непроходимое место» или «нехоженая пустошь»
  rationale: Контекст допускает переносное обозначение опустошённости, однако буквальная пространственная окраска греческого слова остаётся подлинно возможной и потому не устраняется, а указывается в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «На поругание» сохраняет достоинство и смысл публичного позора; синтаксис упрощён лишь настолько, чтобы длинная греческая фраза оставалась ясной обычному читателю.
