base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/011.yaml
  text: And now[a], O Lord, God of Israel, who brought your people out of the land of Egypt with a mighty hand, with signs and wonders and with great power and with an uplifted arm, and made for yourself a name, as at this day,
translation:
  language: ru
  text: И ныне, Господи, Боже Израиля, Ты, Который вывел Свой народ из земли Египта могучей рукой, знамениями и чудесами, великой силой и высоко поднятой рукой[a] и сделал Себе имя, как это видно и по сей день,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздетой рукой». В греческом тексте буквально сказано «высокой (поднятой) рукой», а не употреблено более привычное в повествованиях об исходе выражение «простёртой рукой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: И ныне
  rationale: Сохраняет переход к обращению и возвышенный молитвенный тон; «ныне» уместно в современном литературном библейском стиле.
- source_word: Κύριε ὁ θεὸς Ἰσραήλ
  choice: Господи, Боже Израиля
  rationale: Форма звательного обращения естественно передаётся русскими звательными формами «Господи» и «Боже»; титул Бога Израиля сохранён без конфессиональных добавлений.
- source_word: ἐξήγαγες τὸν λαόν σου ἐκ γῆς Αἰγύπτου
  choice: вывел Свой народ из земли Египетской
  rationale: «Вывел» сохраняет устойчивый язык исхода; «земля Египетская» передаёт географическое обозначение в естественном библейском регистре.
- source_word: ἐν χειρὶ κραταιῷ
  choice: могучей рукой
  rationale: Передаёт образ действенной Божьей силы и звучит яснее для современного читателя, чем более архаичное «крепкою рукою».
- source_word: ἐν σημείοις καὶ ἐν τέρασιν
  choice: знамениями и чудесами
  rationale: Сохраняет традиционную и понятную пару терминов, обозначающих явные сверхъестественные деяния.
- source_word: ἐν δυνάμει μεγάλῃ
  choice: великой силой
  rationale: Прямо передаёт значение δύναμις и сохраняет нарастающий ряд выражений Божьего могущества.
- source_word: ἐν βραχίονι ὑψηλῷ
  choice: высоко поднятой рукой
  rationale: ὑψηλός означает «высокий, поднятый»; перевод не подменяет данное выражение более привычной формулой «простёртая рука».
- source_word: ἐποίησας σεαυτῷ ὄνομα
  choice: сделал Себе имя
  rationale: Сохраняет явное возвратное местоимение и библейскую идиому об обретении известности и славы.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: как и по сей день
  rationale: Естественно передаёт формулу о результате, который остаётся очевидным до настоящего времени.
theological_decisions:
- issue: Накопительный ряд образов исхода и Божьего могущества
  choice: 'Сохранить последовательность: «могучей рукой, знамениями и чудесами, великой силой и высоко поднятой рукой»'
  alternative: Сжать перечисление или объединить близкие образы ради плавности
  rationale: Повтор и нагнетание образов значимы для молитвенного воспоминания об исходе и подчёркивают явленную силу Бога.
- issue: Необычное выражение βραχίονι ὑψηλῷ
  choice: высоко поднятой рукой
  alternative: простёртой рукой
  rationale: Выбранный вариант сохраняет конкретную лексику греческого текста и не заменяет её знакомой по другим местам Писания формулой.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис сохраняет незавершённость стиха, поскольку фраза продолжается далее; поэтому в конце оставлена запятая. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому библейскому оформлению.
