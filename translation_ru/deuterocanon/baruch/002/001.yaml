base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/001.yaml
  text: And the Lord has confirmed his word that he spoke against us and against our judges who judged Israel[a], and against our kings and against our rulers[b], and against the people of Israel and Judah.
translation:
  language: ru
  text: И Господь исполнил Своё слово[a], которое изрёк против нас, против наших судей, судивших Израиль, против наших царей, против наших правителей и против народа Израиля и Иуды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утвердил»; «подтвердил». Греческий глагол буквально может означать «поставить, утвердить» слово, то есть сделать его действенным или исполнить.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «человека Израиля и Иуды». В греческом единственное число употреблено здесь в собирательном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: исполнил
  rationale: Буквально глагол означает «поставил, утвердил»; применительно к ранее изречённому слову суда он передаёт мысль о том, что Господь сделал это слово действенным, то есть исполнил его.
- source_word: Κύριος
  choice: Господь
  rationale: Обычный и естественный русский эквивалент κύριος как обозначения Бога.
- source_word: τὸν λόγον αὐτοῦ
  choice: Своё слово
  rationale: «Слово» сохраняет широту λόγος и указывает на ранее изречённое Богом предупреждение или приговор, не сужая смысл до «указа» либо «приговора».
- source_word: ἐλάλησεν ἐφ᾽ ἡμᾶς
  choice: изрёк против нас
  rationale: В контексте осуществившегося суда ἐπί с винительным имеет направленный, неблагоприятный смысл; «изрёк» сохраняет достоинство регистра и естественно сочетается со «словом».
- source_word: δικαστάς / τοὺς δικάσαντας τὸν Ἰσραήλ
  choice: судей, судивших Израиль
  rationale: Формально и ясно сохраняет корневую связь существительного и причастия, а также отличает судей от названных далее правителей.
- source_word: ἄρχοντας
  choice: правителей
  rationale: Передаёт общий смысл носителей власти без архаичного или более узкого значения слова «князья».
- source_word: ἄνθρωπον Ἰσραὴλ καὶ Ἰούδα
  choice: народа Израиля и Иуды
  rationale: Единственное число ἄνθρωπον употреблено собирательно в сжатом греческом выражении. «Народ» естественно передаёт охват всех людей Израиля и Иуды, а буквальная особенность отмечена в сноске.
theological_decisions:
- issue: Характер исполнения Божьего слова в контексте суда
  choice: Господь исполнил ранее изречённое слово суда
  alternative: Господь утвердил или подтвердил Своё слово
  rationale: Перечень тех, против кого было изречено слово, указывает на осуществление предсказанного наказания. При этом сноска сохраняет более буквальные оттенки глагола, не превращая перевод в богословское толкование.
- issue: Собирательное значение ἄνθρωπον
  choice: народ Израиля и Иуды
  alternative: каждый человек Израиля и Иуды / человек Израиля и Иуды
  rationale: Греческое единственное число здесь охватывает совокупность людей. Собирательный русский эквивалент естественнее и не ограничивает высказывание только мужчинами; грамматическая форма оригинала сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Повтор «против» сохранён для передачи настойчивой структуры греческого перечня; «изрёк» выбрано вместо разговорного «сказал» как естественное сочетание с Божьим словом суда.
