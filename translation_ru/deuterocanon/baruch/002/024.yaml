base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/024.yaml
  text: And we did not listen to your voice to serve the king of Babylon[a], and you have fulfilled your words that you spoke by the hands of your servants the prophets[c][b], that the bones of our kings and the bones of our fathers would be brought out from their place.
translation:
  language: ru
  text: 'И мы не послушались твоего голоса и не стали служить царю Вавилона[a]. И ты исполнил слова, которые изрёк через служителей твоих, пророков[b]: кости наших царей и кости наших предков будут вынесены из мест их погребения[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не повиновались твоему голосу». В греческом тексте буквально говорится о том, что голос не услышали или не послушали; в контексте подразумевается неповиновение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «руками служителей твоих, пророков» — то есть через них.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «из их места»; контекст подразумевает места погребения.'
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἠκούσαμεν τῆς φωνῆς σου
  choice: мы не послушались твоего голоса
  rationale: Русское «не послушались» сохраняет образ слышания голоса и одновременно естественно передаёт подразумеваемое неповиновение.
- source_word: ἐργάσασθαι τῷ βασιλεῖ Βαβυλῶνος
  choice: служить царю Вавилона
  rationale: При дательном обозначении лица глагол здесь выражает службу и подчинение вавилонскому царю, а не просто работу на него.
- source_word: ἔστησας τοὺς λόγους σου
  choice: ты исполнил слова
  rationale: В контексте осуществившегося суда выражение означает, что сказанное Богом было утверждено самим исполнением.
- source_word: ἐν χερσὶν τῶν παίδων σου τῶν προφητῶν
  choice: через служителей твоих, пророков
  rationale: Греческое «руками» является идиомой посредничества; естественное русское «через» ясно передаёт пророков как вестников Божьих слов.
- source_word: παίδων σου
  choice: служителей твоих
  rationale: В отношении пророков παῖς обозначает состоящих на Божьей службе посланников; «служители» точнее контекста, чем «дети» или социально более жёсткое «рабы».
- source_word: τοῦ ἐξενεχθῆναι τὰ ὀστᾶ
  choice: кости ... были вынесены
  rationale: Сохранено конкретное «кости», а пассивный инфинитив передан как содержание исполнившегося пророческого слова.
- source_word: ἐκ τοῦ τόπου αὐτῶν
  choice: из мест, где они покоились
  rationale: Буквально сказано «из их места»; контекст указывает на место погребения, что по-русски требует пояснения для ясности без уточнения вида гробницы.
theological_decisions:
- issue: Передавать ли первую фразу прямо как неповиновение
  choice: не послушались твоего голоса
  alternative: не повиновались тебе
  rationale: Выбранная формулировка сохраняет библейский образ Божьего голоса, не устраняя подразумеваемого значения неповиновения.
- issue: Как выразить действие Бога по отношению к словам суда
  choice: ты исполнил слова
  alternative: ты утвердил слова
  rationale: Контекст говорит об осуществлении пророческого предупреждения; «исполнил» передаёт это непосредственно, не добавляя постороннего богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Формы «твоего», «ты» даны со строчной буквы согласно обычной издательской практике библейского текста. «Изрёк» сохраняет возвышенный регистр, оставаясь понятным; греческая идиома «руками» вынесена в примечание ради естественности основного текста.
