  text: just as you spoke by the hand of your servant Moses[a], on the day when you commanded him to write your law before the sons of Israel, saying[b],
translation:
  language: ru
  text: 'как Ты сказал через Твоего служителя Моисея[a] в день, когда повелел ему написать Твой закон в присутствии сынов Израиля[b], сказав:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукою Твоего служителя Моисея»; это библейский оборот со значением «через, посредством».'
    reason: cultural_note
  - marker: b
    text: 'Или: «перед сынами Израиля» или «перед израильтянами». Буквально: «перед сынами Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὰ ἐλάλησας
  choice: как Ты говорил
  rationale: Передаёт соответствие ранее сказанному и сохраняет торжественный характер обращения к Богу.
- source_word: ἐν χειρὶ παιδός σου Μωυσῆ
  choice: через Твоего служителя Моисея
  rationale: Оборот ἐν χειρί обозначает посредничество; «через» естественно передаёт его по-русски. В данном контексте παῖς называет Моисея Божьим уполномоченным служителем.
- source_word: ἐν ἡμέρᾳ ἐντειλαμένου σου αὐτῷ
  choice: в тот день, когда повелел ему
  rationale: Генитив абсолютный передан ясной временной конструкцией; «тот» естественно связывает день с конкретным повелением.
- source_word: γράψαι τὸν νόμον σου
  choice: написать Твой закон
  rationale: Сохраняет прямое значение γράφω и общепринятое значение νόμος в контексте Моисеева закона.
- source_word: ἐναντίον υἱῶν Ἰσραήλ
  choice: перед сынами Израиля
  rationale: ἐναντίον при обозначении людей означает «перед, в присутствии»; буквальная форма «сыны Израиля» сохраняет явно мужской образ исходного выражения.
- source_word: λέγων
  choice: 'сказав:'
  rationale: Причастие вводит последующую прямую речь; деепричастие по-русски ясно соотносится с обращённым к Богу подлежащим и показывает продолжение предложения.
theological_decisions:
- issue: Значение παῖς применительно к Моисею
  choice: Твоего служителя
  alternative: Твоего раба
  rationale: «Служитель» передаёт почётную роль Моисея как Божьего посланника и не создаёт в современном русском излишне сильной ассоциации с подневольным рабством.
- issue: Передача υἱῶν Ἰσραήλ
  choice: сынов Израиля
  alternative: израильтян
  rationale: Исходный текст использует явно мужское υἱῶν; перевод сохраняет этот библейский образ, не сужая его искусственно пояснением.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Местоимения, относящиеся к Богу, написаны с прописной буквы. Двоеточие показывает, что прямая речь начинается в следующем стихе.
