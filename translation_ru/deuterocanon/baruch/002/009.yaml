base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/009.yaml
  text: And the Lord kept watch over the calamities and brought them upon us[b][a], because the Lord is righteous in all his works that he commanded us.
translation:
  language: ru
  text: И Господь неусыпно следил за бедствиями[a] и навёл их на нас, потому что Господь праведен[b] во всех Своих делах, которые Он заповедал нам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за несчастьями»; буквально возможно также «за злом». Здесь имеются в виду бедствия суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедлив».'
    reason: lexical_alternative
  - marker: c
    text: 'Греческая фраза сжата и допускает понимание: «во всём, что Он повелел нам совершать».'
    reason: ambiguity
lexical_decisions:
- source_word: ἐγρηγόρησεν
  choice: неусыпно следил
  rationale: Глагол γρηγορέω буквально связан с бодрствованием и здесь выражает деятельную бдительность Господа в отношении грядущих бедствий. «Неусыпно следил» сохраняет образ и звучит естественно по-русски.
- source_word: ἐπὶ τοῖς κακοῖς
  choice: за бедствиями
  rationale: В контексте последующего «навёл их на нас» τὰ κακά обозначает бедствия как суд, а не нравственное зло вообще. Управление «следил за» естественно передаёт сочетание с ἐπί.
- source_word: ἐπήγαγε
  choice: навёл
  rationale: Передаёт активное значение «привёл, навлёк на кого-либо» и сохраняет прямое утверждение, что Господь навёл бедствия на народ.
- source_word: δίκαιος
  choice: праведен
  rationale: «Праведен» сохраняет библейское нравственно-богословское звучание δίκαιος; возможное «справедлив» отмечено в сноске.
- source_word: ἐπὶ πάντα τὰ ἔργα αὐτοῦ
  choice: во всех Своих делах
  rationale: Передаёт сферу, в которой исповедуется праведность Господа, и сохраняет αὐτοῦ как притяжательное определение.
- source_word: ἃ ἐνετείλατο ἡμῖν
  choice: которые Он заповедал нам
  rationale: Сохраняет грамматическую связь относительного местоимения с «делами» и сжатость греческой фразы, не устраняя её смысловую трудность посредством истолковательного расширения.
theological_decisions:
- issue: Следует ли понимать τὰ κακά как нравственное зло или как бедствия суда
  choice: бедствия
  alternative: зло; несчастья
  rationale: Контекст прямо говорит, что Господь навёл это на народ, а следующая часть утверждает Его праведность. Речь идёт о карающих бедствиях, однако активная роль Господа в суде не смягчается.
- issue: Передача δίκαιος применительно к Господу
  choice: праведен
  alternative: справедлив
  rationale: «Праведен» соответствует традиционному диапазону δικ- и уместен в исповедании нравственной правоты Бога; юридический оттенок «справедлив» остаётся возможным.
- issue: Неясная связь ἃ ἐνετείλατο ἡμῖν с τὰ ἔργα αὐτοῦ
  choice: 'сохранить буквальную связь: «делах, которые Он заповедал нам»'
  alternative: «во всём, что Он повелел нам совершать»
  rationale: Греческий текст грамматически связывает относительное местоимение среднего рода множественного числа с «делами», но выражение смыслово сжато. Основной текст не должен молча превращать Божьи дела в предписанные людям поступки; пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Неусыпно следил» сохраняет образ бодрствования без архаичного «бдел». Заглавные местоимения при обращении к Богу использованы в соответствии с распространённой русской библейской издательской практикой.
