revisions:
- from: Но душа, скорбящая о великом своём бедствии[a], идущая согбенной и обессиленной, угасающие глаза и голодная душа — они воздадут Тебе славу и праведность[b], Господи.
  to: Но душа, скорбящая о великом бедствии, которая ходит, сгорбившись и обессилев, угасающие глаза и голодная душа — все они воздадут Тебе славу и праведность, Господи.
  rationale: Убрано отсутствующее в оригинале «своём». Синтаксис первого образа перестроен для естественного русского звучания при сохранении его связи с «душой», непрерывности действия и состояний согбенности и слабости. Добавлено «все они», чтобы явно передать множественное число греческого сказуемого и не создавать двусмысленности относительно подлежащего. Сноска a уточнена так, чтобы контекстуальное «бедствие» не выдавалось за явное слово исходного текста.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:53:23Z'
review_pass:
  verdict: revise
  source_fidelity: В целом переданы повтор ψυχή, образы согбенности, слабости, угасающих глаз и голода, а также итоговое множественное число δώσουσιν. Однако притяжательное «своём» не выражено в греческом тексте и неоправданно конкретизирует эллиптическое τὸ μέγεθος. Связь образа идущей, согбенной и ослабевшей души лучше выразить яснее, не меняя поэтической структуры.
  naturalness: Фраза «душа, ... идущая согбенной и обессиленной» грамматически возможна, но в современном литературном русском звучит тяжеловесно. Относительное придаточное с деепричастным оборотом делает образ понятнее и естественнее. «Воздадут Тебе славу и праведность» сохраняет нарочитую сжатость оригинала и допустимо в высоком молитвенном регистре.
  terminology: «Душа», «слава», «праведность» и «Господи» переданы последовательно. Для δικαιοσύνην сохраняется основной вариант «праведность»; вариант «справедливость» уместно оставить в сноске. Сноска к τὸ μέγεθος должна не утверждать подразумеваемое слово как часть текста, а отмечать контекстуальное восполнение.
  issues:
