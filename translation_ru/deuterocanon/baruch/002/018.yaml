  text: But the soul that is grieved over its great misery[a], that goes about bent over and weak, and the eyes that are failing and the soul that is hungry—these will give you glory and righteousness[b], O Lord.
translation:
  language: ru
  text: Но душа, скорбящая о великом бедствии, которая ходит, сгорбившись и обессилев, угасающие глаза и голодная душа — все они воздадут Тебе славу и праведность, Господи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχή
  choice: душа
  rationale: Повторение слова сохранено ради поэтической структуры и смысла внутренней жизни человека; «человек» сделало бы образ менее выразительным.
- source_word: λυπουμένη
  choice: скорбящая
  rationale: Передаёт продолжающуюся глубокую печаль естественным и достойным русским языком.
- source_word: ἐπὶ τὸ μέγεθος
  choice: о великом своём бедствии
  rationale: Греческое выражение эллиптично; контекст немощи, голода и угасающих глаз указывает на великое бедствие, при этом буквальная неоднозначность отмечена в сноске.
- source_word: βαδίζει κύπτον καὶ ἀσθενοῦν
  choice: идущая согбенной и обессиленной
  rationale: Сохраняет образ движения в состоянии физической подавленности и слабости; согласование с «душой» делает русскую фразу связной.
- source_word: οἱ ὀφθαλμοὶ οἱ ἐκλείποντες
  choice: угасающие глаза
  rationale: Передаёт глаза, теряющие силу и способность видеть, кратким и поэтически естественным выражением.
- source_word: πεινῶσα
  choice: голодная
  rationale: Прямо передаёт продолжающийся голод без усиления до крайнего истощения.
- source_word: δώσουσίν σοι δόξαν
  choice: воздадут Тебе славу
  rationale: Устойчивое современное выражение для признания Божьей славы, соответствующее прямой конструкции греческого текста.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: Сохраняет широкий смысл Божьей нравственной правоты; возможный оттенок справедливости указан в сноске.
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская форма прямого обращения к Богу.
theological_decisions:
- issue: Значение δικαιοσύνην в молитвенном обращении к Богу
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет более широкий смысл нравственной правоты Бога и не сводит слово только к судебной справедливости; второй возможный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической интонацией. Синтаксическая напряжённость оригинала слегка сглажена, но перечисление страдающих образов и итоговое множественное число сохранены. Местоимение «Тебе» написано с прописной буквы как уместная русская издательская норма в прямом обращении к Богу.
