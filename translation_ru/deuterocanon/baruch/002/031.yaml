lexical_decisions:
- source_word: γνώσονται
  choice: они узнают
  rationale: Будущее время от γινώσκω; «узнают» естественно передаёт наступающее признание и познание Бога, не сводя смысл лишь к умственному знанию.
- source_word: Κύριος
  choice: Господь
  rationale: Стандартная передача греческого божественного титула κύριος в данном контексте.
- source_word: ὁ θεὸς αὐτῶν
  choice: их Бог
  rationale: Естественная русская притяжательная конструкция, сохраняющая язык отношений Бога с народом.
- source_word: δώσω
  choice: дам
  rationale: Простая и естественная передача будущего времени δίδωμι; личное местоимение «Я» понятно из формы глагола и предыдущего предложения.
- source_word: καρδίαν
  choice: сердце
  rationale: Сохраняется конкретный антропологический образ внутреннего средоточия человека без замены на толкования вроде «разум» или «понимание».
- source_word: ὦτα ἀκούοντα
  choice: уши, которые слышат
  rationale: Передаёт причастную конструкцию буквально и понятно, сохраняя конкретный телесный образ и не подменяя слышание истолкованием как послушание.
theological_decisions:
- issue: Образ восстановления человека в выражении «сердце и уши, которые слышат»
  choice: Сохранить конкретные образы сердца и слышащих ушей.
  alternative: 'Передать отвлечённо: «понимание и восприимчивость» или истолковать как «послушное сердце и внимательные уши».'
  rationale: Греческий текст говорит о καρδίαν и ὦτα ἀκούοντα. Конкретные образы сохраняют напряжение между внутренним преображением, способностью слышать и возможным откликом, не превращая перевод в богословское пояснение.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью без архаизмов. Местоимение «Я» в речи Бога написано с прописной буквы по принятой русской библейской традиции. Завершающая запятая сохранена, поскольку стих синтаксически продолжается далее.
