  text: If you do not listen to my voice[b][a], surely this great and vast multitude will be reduced to a few among the nations where I will scatter them there.
translation:
  language: ru
  text: Если вы не послушаете Моего голоса, то это великое и многочисленное множество[a] непременно станет малочисленным среди народов — там, где Я рассею их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое βόμβησις буквально может означать «гул», «гудение», «рокот» или «шум». Здесь слово передано как «множество», поскольку далее большая масса противопоставлена малочисленности и в данном контексте метонимически обозначает людей.
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте место обозначено дважды: буквально «где Я рассею их там». Оборот «там, где» сохраняет это усиление в естественной русской форме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν μὴ ἀκούσητε τῆς φωνῆς μου
  choice: Если вы не послушаете Моего голоса
  rationale: Глагол ἀκούω с родительным падежом слова «голос» в контексте заветного предостережения означает не только услышать, но и внять. Прямой оборот «послушать голоса» естественен для возвышенной современной русской речи и сохраняет образ божественного обращения.
- source_word: εἰ μὴν
  choice: непременно
  rationale: Сочетание частиц подчёркивает несомненность объявленного последствия; «непременно» передаёт торжественную уверенность угрозы.
- source_word: ἡ βόμβησις ἡ μεγάλη ἡ πολλὴ αὕτη
  choice: это великое и многочисленное множество
  rationale: βόμβησις буквально обозначает гул, шум или гудение, но последующее противопоставление «до немногих» указывает на метонимическое обозначение большой массы людей. Прилагательные μεγάλη и πολλή переданы раздельно, чтобы сохранить двойное усиление.
- source_word: ἀποστρέψει εἰς μικρὰν
  choice: сократится до немногих
  rationale: Греческое выражение с подразумеваемым существительным сжато и буквально означает переход к малому числу. Русская формулировка ясно передаёт численное уменьшение, не добавляя причины сверх текста.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди народов
  rationale: В контексте рассеяния речь идёт об иноземных народах; этот вариант естественен и не привносит дополнительной конфессиональной окраски.
- source_word: οὗ διασπερῶ αὐτοὺς ἐκεῖ
  choice: там, где Я их рассею
  rationale: Перестановка «там, где» естественно воспроизводит оба греческих указания места — οὗ и ἐκεῖ — без неуклюжей русской тавтологии.
theological_decisions:
- issue: Божественное предостережение и последствие непослушания
  choice: Передать фразу как торжественное предупреждение о численном сокращении народа в рассеянии.
  alternative: Понять βόμβησις буквально как «гул» или «шум» и отнести уменьшение к звуку.
  rationale: Противопоставление большого множества «немногим», а также контекст рассеяния среди народов говорят о людях. Перевод сохраняет выраженную в тексте угрозу, не развивая её в отдельное учение о суде.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные буквы в «Моего» и «Я» обозначают речь Бога. Синтаксис остаётся ясным для широкого читателя, а тире выделяет повторное указание места.
