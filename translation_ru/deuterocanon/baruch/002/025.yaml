base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/025.yaml
  text: And behold[a], they have been exposed to the heat of the day and to the frost of the night; and they died in grievous sufferings, in famine and by the sword and in exile.
translation:
  language: ru
  text: И вот, они брошены под дневной зной и ночной мороз; они умерли в тяжких страданиях — от голода, от меча и в изгнании[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при выселении» или «в ссылке»; греческое слово буквально указывает на отправление прочь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: И вот
  rationale: Передаёт призыв обратить внимание естественным для современного литературного русского языка библейским оборотом без излишней архаизации.
- source_word: ἐξεριμμένα
  choice: брошены
  rationale: 'Сохраняет значение совершившегося пассивного действия: они были выброшены и потому оставались под воздействием стихий. Контекст позволяет понять их как тела умерших, но перевод не добавляет слова «тела», отсутствующего в стихе.'
- source_word: τῷ καύματι τῆς ἡμέρας
  choice: под дневной зной
  rationale: Передаёт воздействие сильной дневной жары и естественно сочетается в русском с глаголом «брошены».
- source_word: τῷ παγετῷ τῆς νυκτός
  choice: под ночной мороз
  rationale: Сохраняет конкретный образ παγετός — мороза, а также параллель с дневным зноем.
- source_word: ἐν πόνοις πονηροῖς
  choice: в тяжких страданиях
  rationale: Естественно передаёт усиленное обозначение мучений, сохраняя множественный и резко отрицательный смысл выражения.
- source_word: ἐν λιμῷ
  choice: от голода
  rationale: Русская конструкция естественно указывает на голод как причину смерти, соответствуя смыслу греческого оборота в перечне бедствий.
- source_word: ἐν ῥομφαίᾳ
  choice: от меча
  rationale: Сохраняет конкретный библейский образ насильственной смерти от меча, не заменяя его обобщением «война».
- source_word: ἐν ἀποστολῇ
  choice: в изгнании
  rationale: В контексте суда обозначает насильственное удаление из своей земли; «изгнание» понятно современному читателю, а более буквальные оттенки отмечены в сноске.
theological_decisions:
- issue: Значение ἀποστολή в контексте суда
  choice: в изгнании
  alternative: при выселении; в ссылке
  rationale: «Изгнание» передаёт историко-богословскую реальность насильственного удаления с земли, не уточняя сверх текста конкретный административный способ. Более буквальный смысл отправления или выселения сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм зноя и мороза сохранён; тире делает перечень причин и обстоятельств смерти ясным. Маркер сноски поставлен непосредственно после слова, к которому относится.
