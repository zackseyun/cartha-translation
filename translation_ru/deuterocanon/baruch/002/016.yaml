  text: Lord[a], look down from your holy house and take notice of us; incline your ear, Lord, and hear.
translation:
  language: ru
  text: Господи, взгляни с высоты Твоего святого дома[a] и обрати внимание на нас; приклони, Господи, ухо Твоё и услышь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с высоты Твоего святого храма». Буквально в греческом: «из Твоего святого дома».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος передана традиционным и по-прежнему понятным русским обращением «Господи».
- source_word: κάτιδε
  choice: взгляни вниз
  rationale: Императив содержит образ взгляда сверху вниз; перевод сохраняет пространственную направленность, поддержанную словами «из Твоего святого дома».
- source_word: ἐκ τοῦ οἴκου τοῦ ἁγίου σου
  choice: из Твоего святого дома
  rationale: οἶκος буквально означает «дом». Такой перевод не подменяет слово более узким культовым термином «храм» и допускает понимание святого небесного жилища Бога.
- source_word: ἐννόησον εἰς ἡμᾶς
  choice: обрати внимание на нас
  rationale: Выражение обозначает направленное, деятельное внимание к молящимся, а не только мысленное размышление.
- source_word: κλῖνον τὸ οὖς σου
  choice: приклони ухо Твоё
  rationale: Сохранён традиционный молитвенный образ склонённого уха; формулировка возвышенна, но понятна современному читателю.
- source_word: ἄκουσον
  choice: услышь
  rationale: Императив передан как просьба не просто слушать, но услышать обращённую к Богу молитву.
theological_decisions:
- issue: Передача οἶκος как «дом» или как «храм»
  choice: дом
  alternative: храм
  rationale: В греческом стоит οἶκος, а не более специальное обозначение святилища. «Дом» сохраняет исходную формулировку и не устраняет возможную широту образа Божьего святого жилища.
- issue: Сохранение образного молитвенного выражения κλῖνον τὸ οὖς σου
  choice: приклони ухо Твоё
  alternative: выслушай нас
  rationale: Выбранный вариант сохраняет телесную метафору и торжественность молитвы, не сводя две последовательные просьбы к одному общему выражению.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным строем. Традиционные формы «Господи», «приклони ухо Твоё» сохранены как понятные и уместные; более архаичное «воззри» не использовано.
