translation:
  language: ru
  text: ибо не ради праведных дел[a] наших отцов и наших царей мы приносим пред Тобою мольбу о милости[b], Господи, Боже наш,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведных поступков»; греческое слово может также означать «установления» или «постановления».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «приносим милость перед Твоим лицом»; «перед Твоим лицом» означает «в Твоём присутствии». По контексту речь идёт о мольбе о милости.'
    reason: idiom_clarification
lexical_decisions:
- source_word: δικαιώματα
  choice: праведные дела
  rationale: В покаянной молитве сочетание с «нашими отцами» и «нашими царями» естественнее указывает на их праведные поступки как возможное основание просьбы, а не на принадлежавшие им постановления; при этом сноска сохраняет лексическую неоднозначность.
- source_word: καταβάλλομεν
  choice: повергаем
  rationale: Глагол сохраняет конкретный образ возложения или повержения чего-либо перед Богом и соответствует возвышенному молитвенному контексту.
- source_word: τὸν ἔλεον
  choice: моление о милости
  rationale: Буквальное «милость» могло бы создать впечатление, будто молящиеся сами предлагают милость. Контекст требует смысла обращения к Богу за милостью.
- source_word: κατὰ πρόσωπόν σου
  choice: пред Тобой
  rationale: Естественно передаёт греческий оборот «перед Твоим лицом» в значении нахождения в Божьем присутствии, не утяжеляя современный русский текст.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: Господи, Боже наш
  rationale: Сохраняет прямое молитвенное обращение и традиционно-достоинный, но понятный современному читателю регистр.
theological_decisions:
- issue: Отрицается ли опора молитвы на заслуги предков и царей
  choice: Просители признают, что обращаются за милостью не ради праведных дел отцов и царей.
  alternative: 'Фразу можно понимать более юридически: просьба основана не на установлениях или правовых предписаниях, связанных с предками и царями.'
  rationale: Покаянный контекст и зависимое родительное выражение поддерживают смысл праведных поступков, однако лексическая сноска не устраняет возможный юридический оттенок.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. Формы «пред Тобой» и «Господи, Боже наш» сохраняют достоинство обращения, не делая синтаксис архаичным. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
