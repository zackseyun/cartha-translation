base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/023.yaml
  text: I will cause the sound of gladness and the sound of rejoicing to cease from the cities of Judah and from the outskirts of Jerusalem[a], the sound of bridegroom and the sound of bride[b], and all the land will become impassable because of its inhabitants.
translation:
  language: ru
  text: Я сделаю так, что в городах Иудеи и вне Иерусалима[a] умолкнут голос веселья и голос радости, голос жениха и голос невесты; и вся земля станет непроходимой из-за её жителей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вне Иерусалима». В некоторых переводах под влиянием параллельных пророческих формул стоит «на улицах Иерусалима», однако в сохранившемся греческом тексте сказано «вне».'
    reason: alternative_reading
  - marker: b
    text: 'Конец фразы в греческом тексте труден для понимания. Возможны также переводы: «вся земля станет непроходимой и останется без жителей» или «вся земля станет непроходимой, лишившись жителей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλείψειν ποιήσω
  choice: Я сделаю так, что… умолкнут
  rationale: 'Сочетание ποιήσω с инфинитивом выражает активную причинность: Бог не просто предсказывает прекращение звуков, а сделает так, что они умолкнут. Русское «умолкнут» естественно передаёт прекращение перечисленных голосов и звуков.'
- source_word: ἐκ πόλεων Ἰούδα καὶ ἔξωθεν Ἰερουσαλήμ
  choice: в городах Иудеи и в окрестностях Иерусалима
  rationale: Предлог ἐκ указывает на места, откуда исчезнет звук; по-русски это естественно выражается конструкцией «в… умолкнут». ἔξωθεν буквально указывает на пространство вне Иерусалима, поэтому «в окрестностях» передаёт смысл без заимствования отсутствующего в греческом слова «улицы».
- source_word: φωνὴν εὐφροσύνης καὶ φωνὴν χαρμοσύνης
  choice: голос веселья и голос радости
  rationale: Повтор слова «голос» сохраняет поэтический параллелизм. Близкие по значению «веселье» и «радость» не сливаются в одно понятие.
- source_word: φωνὴν νυμφίου καὶ φωνὴν νύμφης
  choice: голос жениха и голос невесты
  rationale: Буквальное и естественное обозначение свадебных голосов, продолжающее повтор φωνή.
- source_word: ἔσται πᾶσα ἡ γῆ εἰς ἄβατον
  choice: вся земля станет непроходимой
  rationale: ἄβατος обозначает место, по которому нельзя пройти или которое нельзя пересечь. «Непроходимой» точнее, чем обобщённое «опустошённой».
- source_word: ἀπὸ ἐνοικούντων
  choice: из-за тех, кто её населяет
  rationale: Передаёт возможное причинное понимание ἀπό и причастия ἐνοικούντων, не скрывая при этом трудность оборота; альтернативное понимание отмечено в сноске.
theological_decisions:
- issue: Следует ли согласовать стих с более привычной пророческой формулой из книги Иеремии
  choice: 'Сохранить чтение греческого текста: «в окрестностях Иерусалима» и трудный причинный оборот в конце.'
  alternative: 'Перевести по параллельной формуле: «на улицах Иерусалима» и «без жителей».'
  rationale: Сохраняется самостоятельное свидетельство дошедшего греческого текста, а возможные альтернативы сообщаются в примечаниях без молчаливой гармонизации.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским ритмом. Повторы «голос… голос…» сохранены ради поэтического параллелизма; синтаксис слегка перестроен для естественного русского звучания.
