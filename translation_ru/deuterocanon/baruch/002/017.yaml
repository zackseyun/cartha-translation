base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/017.yaml
  text: 'Open your eyes and see: it is not the dead in Hades, whose breath has been taken from their inward parts, who will give glory and righteousness to the Lord;'
translation:
  language: ru
  text: 'Открой глаза и посмотри: не мёртвые в Аиде, у которых дыхание[a] отнято из их внутренностей, воздадут Господу славу и признают Его праведность[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «признают Его справедливость»; также возможно: «признают Его правоту».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνοιξον ὀφθαλμούς σου καὶ ἴδε
  choice: Открой глаза и посмотри
  rationale: Два повелительных глагола переданы прямо и естественно; множественное «глаза» соответствует греческому тексту.
- source_word: οὐχ οἱ τεθνηκότες ἐν τῷ ᾅδῃ
  choice: не мёртвые в Аиде
  rationale: Сохранены отрицательное противопоставление и конкретное обозначение царства мёртвых ᾅδης без сведения его к могиле.
- source_word: ὧν ἐλήμφθη τὸ πνεῦμα αὐτῶν
  choice: у которых дыхание отнято
  rationale: В контексте смерти πνεῦμα естественно обозначает жизненное дыхание; возможное значение «дух» сохранено в сноске.
- source_word: ἀπὸ τῶν σπλάγχνων αὐτῶν
  choice: изнутри
  rationale: Передаёт удаление дыхания из внутренних частей человека, не прибегая к неестественному в данном контексте слову «внутренности».
- source_word: δώσουσιν δόξαν
  choice: воздадут славу
  rationale: Устойчивое и понятное выражение библейского регистра точно передаёт будущую форму и δόξα.
- source_word: δικαίωμα τῷ κυρίῳ
  choice: признают Его праведность
  rationale: Русская синтаксическая перестройка проясняет, что речь идёт о признании правоты или праведности Господа; буквальное «воздадут праведность Господу» звучало бы неясно и неестественно.
theological_decisions:
- issue: Значение πνεῦμα в контексте смерти
  choice: дыхание
  alternative: дух
  rationale: Контекст подчёркивает прекращение телесной жизни, поэтому на первом плане жизненное дыхание; однако антропологически значимое прочтение «дух» не исключено и отмечено в сноске.
- issue: Значение δικαίωμα применительно к Господу
  choice: признают Его праведность
  alternative: признают Его справедливость (или правоту)
  rationale: δικαίωμα здесь вероятнее обозначает признание того, что Господь праведен и прав, а не постановление закона. Вариант со «справедливостью» сохраняет судебный оттенок слова.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Сохранены обращение к Богу в единственном числе, термин «Аид» и незавершённость фразы, обозначенная точкой с запятой. Прописное «Его» служит ясности отсылки к Господу, не вводя отдельного богословского толкования.
