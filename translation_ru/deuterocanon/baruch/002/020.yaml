lexical_decisions:
- source_word: ἐνῆκας
  choice: навёл на нас
  rationale: Аорист передаёт совершившееся действие; «навёл на нас» естественно по-русски выражает направление Божьего суда на людей, не добавляя более узкого значения вроде «покарал».
- source_word: θυμόν
  choice: ярость
  rationale: Слово обозначает сильный, пылкий гнев; «ярость» сохраняет интенсивность и позволяет отличить его от следующего ὀργήν.
- source_word: ὀργήν
  choice: гнев
  rationale: «Гнев» — ясное и достойное соответствие в контексте Божьего суда; вместе с «яростью» сохраняет греческую пару близких по смыслу слов.
- source_word: καθάπερ
  choice: как и
  rationale: Выражает точное соответствие между наступившим судом и прежним пророческим словом.
- source_word: ἐλάλησας
  choice: говорил
  rationale: Несовершенный вид в русском естественно описывает прежние неоднократные пророческие возвещения, не меняя основного значения «говорить».
- source_word: ἐν χειρί
  choice: через
  rationale: Греческая библейская идиома буквально означает «рукою» и обозначает посредничество; «через» ясно и естественно передаёт эту функцию в современном русском.
- source_word: παίδων
  choice: служителей
  rationale: В сочетании с «пророками» παῖς означает состоящих на Божьем служении посланников, а не детей; «служителей» передаёт это без избыточного оттенка подневольности.
- source_word: προφητῶν
  choice: пророков
  rationale: Прямое соответствие; приложение уточняет, что названные служители были пророками.
theological_decisions:
- issue: Передача парных обозначений Божьего суда θυμός и ὀργή
  choice: «ярость Твою и гнев Твой»
  alternative: «гнев Твой и негодование Твоё»
  rationale: Выбранная формулировка сохраняет два близких, но не тождественных слова и усиливающий риторический параллелизм, не сводя их к одному понятию.
- issue: Посредничество пророков в обороте ἐν χειρὶ τῶν παίδων σου τῶν προφητῶν
  choice: «через служителей Твоих — пророков»
  alternative: «рукою служителей Твоих, пророков»
  rationale: «Через» точно раскрывает значение посредничества и естественно звучит по-русски; буквальный образ руки сохранён в примечании, поскольку он присутствует в греческом тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Порядок «ярость Твою и гнев Твой» сохраняет риторическую полноту оригинала; тире ясно оформляет приложение «пророков».
