base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/030.yaml
  text: For I knew that they would certainly not listen to me[a], because they are a stiff-necked people; but in the land of their exile they will return to their heart,
translation:
  language: ru
  text: Ведь Я знал, что они ни за что не станут слушать Меня, потому что они — народ жестоковыйный; но в стране своего изгнания они обратятся к своему сердцу[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «примут это близко к сердцу»; возможно также: «обратятся в своём сердце». Буквально по-гречески: «обратятся к своему сердцу».'
    reason: Лексико-идиоматическая неоднозначность выражения ἐπιστρέψουσιν ἐπὶ καρδίαν αὐτῶν.
lexical_decisions:
- source_word: ἔγνων
  choice: Я знал
  rationale: Аорист передан простым прошедшим временем и выражает предшествующее знание Бога о реакции народа.
- source_word: οὐ μὴ ἀκούσωσίν μου
  choice: они ни за что не послушают Меня
  rationale: Сочетание οὐ μή с сослагательным наклонением несёт усиленное отрицание будущего действия; «послушают Меня» сохраняет и значение слышания, и оттенок повиновения.
- source_word: λαὸς σκληροτράχηλος
  choice: народ жестоковыйный
  rationale: Традиционная библейская метафора точно отражает греческое сложное прилагательное и остаётся понятной в возвышенном литературном контексте.
- source_word: ἐπιστρέψουσιν ἐπὶ καρδίαν αὐτῶν
  choice: они обратятся к своему сердцу
  rationale: Формулировка сохраняет необычный образ исходного текста и не подменяет его более однозначным «покаются».
- source_word: ἐν γῇ ἀποικισμοῦ αὐτῶν
  choice: в земле своего изгнания
  rationale: ἀποικισμός обозначает насильственное переселение и пребывание вдали от родины; «изгнание» естественно передаёт это значение.
theological_decisions:
- issue: Смысл выражения «обратятся к своему сердцу»
  choice: Сохранить образ сердца в основном тексте и пояснить возможный идиоматический смысл в сноске.
  alternative: «примут это близко к сердцу», «обратятся в своём сердце» или «раскаются всем сердцем»
  rationale: Греческий текст говорит буквально об обращении к своему сердцу; это подразумевает внутреннее осознание и перемену, но не употребляет однозначного глагола «каяться».
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейской речи. «Жестоковыйный» оставлено как укоренённая библейская метафора; необычная сердечная образность сохранена ради точности и снабжена сноской.
