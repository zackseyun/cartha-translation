lexical_decisions:
- source_word: Οὕτως εἶπεν Κύριος
  choice: Так говорит Господь
  rationale: Устоявшаяся русская формула пророческой речи естественно передаёт греческий аорист εἶπεν настоящим временем, сохраняя силу авторитетного провозглашения.
- source_word: Κλίνατε τὸν ὦμον ὑμῶν
  choice: подставьте плечо
  rationale: Греческий текст буквально говорит о склонении плеча; по-русски «подставьте плечо» сохраняет телесный образ принятия на себя подчинённого труда и звучит естественнее буквального «склоните ваше плечо».
- source_word: ἐργάσασθε τῷ βασιλεῖ Βαβυλῶνος
  choice: служите царю Вавилона
  rationale: ἐργάζομαι означает трудиться или работать; при дательном обозначении царя в данном контексте «служите» ясно выражает труд в подчинении его власти, не сводя фразу к богослужебному смыслу.
- source_word: καθίσατε ἐπὶ τὴν γῆν
  choice: живите на земле
  rationale: Буквальное «сядьте на землю» здесь идиоматически означает поселиться или оставаться жить; «живите» передаёт контекстуальный смысл без неестественной кальки.
- source_word: ἣν δέδωκα
  choice: которую Я дал
  rationale: Перфект указывает на совершённый дар с сохраняющимся результатом; русское прошедшее время естественно выражает исторический акт дарования земли.
- source_word: τοῖς πατράσιν ὑμῶν
  choice: вашим отцам
  rationale: Сохраняется явно мужское и родственное обозначение πατέρες; возможное более широкое значение «предки» отмечено в сноске.
theological_decisions:
- issue: Передача Κύριος в формуле божественной речи
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — традиционное и современно понятное соответствие κύριος в библейской формуле; оно не вводит специального оформления имени YHWH, которого в данном греческом тексте нет.
- issue: Образ подчинения царю Вавилона
  choice: подставьте плечо и служите
  alternative: склоните плечо и работайте на
  rationale: Выбранная формулировка сохраняет повеление принять подчинённое служение чужеземному царю, не добавляя отсутствующего в греческом тексте слова «ярмо».
- issue: Обозначение получателей земли
  choice: вашим отцам
  alternative: вашим предкам
  rationale: Основной текст сохраняет форму πατράσιν; сноска указывает на возможный коллективный смысл, не устраняя гендерную форму источника.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся близким к греческому, но буквальные идиомы переданы естественно. Заглавная «Я» употреблена как уважительное оформление речи Бога.
