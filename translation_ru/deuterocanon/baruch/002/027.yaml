    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησας εἰς ἡμᾶς
  choice: Ты поступил с нами
  rationale: Оборот ποιεῖν εἰς с личным объектом означает действие или отношение к кому-либо; «поступил с нами» естественно передаёт этот смысл и аористную завершённость действия.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: Господи, Боже наш
  rationale: Сохранено прямое обращение к Богу; звательная форма «Господи» и порядок слов соответствуют торжественному молитвенному регистру русского языка.
- source_word: ἐπιεικίαν
  choice: снисходительностью
  rationale: В данном молитвенном контексте слово обозначает мягкость, незлобивую уступчивость или милостивую сдержанность. «Снисходительность» передаёт Божью благосклонную мягкость, не сливая её со следующим οἰκτειρμός.
- source_word: οἰκτειρμόν
  choice: состраданием
  rationale: οἰκτειρμός обозначает сострадание или милость; «сострадание» сохраняет эмоциональный оттенок и отличает этот термин от ἐπιείκεια.
- source_word: τὸν μέγαν
  choice: великим
  rationale: Прилагательное прямо характеризует сострадание; «великим» точно и без смыслового расширения передаёт μέγαν.
- source_word: κατὰ πᾶσαν ... καὶ κατὰ πάντα
  choice: со всей ... и со всем
  rationale: Повтор предлога и всеохватность πᾶς сохранены, но выражены естественной для современного русского языка конструкцией.
theological_decisions:
- issue: Передача двух близких обозначений Божьего милостивого отношения
  choice: Различить их как «снисходительность» и «сострадание»
  alternative: Передать оба понятия общим словом «милость» либо сочетанием «кротость» и «милосердие»
  rationale: Греческий текст употребляет разные слова, ἐπιείκεια и οἰκτειρμός. Их разграничение сохраняет риторическую полноту текста, не превращая различие в специальное богословское учение.
- issue: Передача κύριος в обращении к Богу
  choice: 'Господь (в обращении: «Господи»), без написания прописными буквами всего слова'
  alternative: ГОСПОДЬ
  rationale: В греческом источнике стоит κύριος, а не непосредственно засвидетельствованное здесь еврейское четырёхбуквенное имя; поэтому нейтральная передача «Господь» наиболее точна.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Повтор «со всей… и со всем…» сохраняет параллелизм греческой фразы, не создавая тяжеловесной кальки «по всей… и по всему…». Конечная запятая сохранена, поскольку исходный стих синтаксически продолжается далее.
