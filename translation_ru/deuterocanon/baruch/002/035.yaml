  source_fidelity: Греческое αὐτοῖς означает «для них», а не прямо «с ними»; поэтому «заключу с ними» несколько меняет синтаксическое отношение. Инфинитивное τοῦ εἶναί выражает цель/содержание устанавливаемого завета и должен быть передан в основном тексте либо ясно отмечен как альтернатива. «Не переселю больше» естественно передаёт κινήσω ἔτι в контексте удаления народа с данной земли.
  naturalness: Предлагаемый текст сохраняет современный литературный русский с торжественным библейским регистром. «Установлю для них завет» несколько формальнее, но в данном контексте точно и естественно; «переселю» яснее, чем «удалю ... из земли».
  terminology: «Вечный завет», «их Бог», «Мой народ» и «земля» сохраняют традиционную библейскую терминологию. Имя «Израиль» передано как приложение к «народ Мой» без изменения смысла.
