base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/035.yaml
  text: And I will establish for them an everlasting covenant[a], that I may be their God and they may be my people; and I will no longer remove my people Israel from the land that I gave to them.
translation:
  language: ru
  text: И установлю для них вечный завет[a], чтобы Я был их Богом, а они были Моим народом; и больше не переселю народ Мой, Израиль, с земли, которую Я дал им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечный завет — Я буду их Богом, а они будут Моим народом». Греческая инфинитивная конструкция может выражать цель или содержание завета.'
    reason: Сохраняет грамматическую неоднозначность инфинитивной конструкции τοῦ εἶναί и её возможную передачу личными формами.
lexical_decisions:
- source_word: στήσω
  choice: заключу
  rationale: В сочетании с «заветом» глагол означает установить, ввести в силу завет; по-русски естественно и торжественно «заключить завет».
- source_word: διαθήκην αἰώνιον
  choice: вечный завет
  rationale: Устоявшееся библейское выражение, передающее непреходящий характер завета.
- source_word: τοῦ εἶναί με αὐτοῖς εἰς θεόν
  choice: Я буду их Богом
  rationale: Естественно передаёт содержание и цель завета, выраженные греческой инфинитивной конструкцией.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: они будут Моим народом
  rationale: Сохраняет взаимную структуру формулы завета и ясно звучит по-русски.
- source_word: οὐ κινήσω ἔτι
  choice: впредь не удалю
  rationale: В контексте народа и земли κινέω означает перемещение или изгнание; «не удалю» сохраняет образ движения и не усиливает исходный текст.
- source_word: τὸν λαόν μου Ἰσραήλ
  choice: народ Мой, Израиль
  rationale: 'Запятые отражают приложение: Израиль отождествляется с Божьим народом, а притяжательное местоимение сохраняет заветный акцент.'
- source_word: ἀπὸ τῆς γῆς
  choice: из земли
  rationale: Здесь γῆ обозначает конкретную землю, данную Израилю, а не землю или мир вообще.
- source_word: ἧς ἔδωκα αὐτοῖς
  choice: которую Я дал им
  rationale: Прямо передаёт относительное предложение и предшествующий дар земли.
theological_decisions:
- issue: Смысл инфинитивной конструкции в формуле завета
  choice: Я буду их Богом, а они будут Моим народом
  alternative: чтобы Мне быть их Богом, а им быть Моим народом
  rationale: Греческое τοῦ εἶναι может обозначать цель или содержание вечного завета. Основной текст естественно выражает содержание завета личными формами, а примечание сохраняет возможный целевой оттенок.
- issue: Сила обещания οὐ κινήσω ἔτι
  choice: впредь не удалю народ Мой, Израиль, из земли
  alternative: больше не переселю / никогда более не исторгну
  rationale: Фраза обещает прекращение удаления народа из данной ему земли. Выбранная формулировка не привносит дополнительной эсхатологической системы и не усиливает глагол до «исторгну».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные буквы в «Я», «Моим», «Мой» обозначают речь Бога; синтаксис остаётся ясным для широкого круга читателей.
