    rationale: Основной текст с будущими формами передаёт содержание формулы, но не её связь с «заветом». Формулировка с «чтобы» точнее отражает τοῦ εἶναί, не устраняя отмеченную примечанием неоднозначность.
  - severity: low
    issue: «Не удалю ... из земли»
    rationale: Это возможно, но «не переселю ... с земли» в данном контексте точнее обозначает прекращение перемещения народа с дарованной ему земли.
