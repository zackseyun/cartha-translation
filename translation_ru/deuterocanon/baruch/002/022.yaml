lexical_decisions:
- source_word: ἐὰν μὴ ἀκούσητε
  choice: если вы не послушаете
  rationale: «Послушаете» сохраняет образ слышания и одновременно естественно передаёт подразумеваемое повиновение; условная конструкция соответствует греческому ἐὰν μή.
- source_word: τῆς φωνῆς
  choice: голоса
  rationale: Буквальное «голоса» сохраняет устойчивый библейский оборот и не сводит его истолковательно к одному лишь «повелению».
- source_word: Κυρίου
  choice: Господа
  rationale: Стандартная передача Κύριος в данном библейском контексте.
- source_word: ἐργάσασθαι
  choice: служить
  rationale: При дательном обозначении лица глагол передаёт работу или службу в пользу царя; «служить» естественно выражает политическое подчинение в контексте.
- source_word: τῷ βασιλεῖ Βαβυλῶνος
  choice: царю Вавилона
  rationale: Прямая и естественная передача греческой конструкции с родительным падежом.
theological_decisions:
- issue: Следует ли явно передать подразумеваемое повиновение в ἀκούσητε
  choice: Сохранить в основном тексте выражение «послушаете голоса Господа»
  alternative: «повинуетесь Господу»; «внемлете голосу Господа»
  rationale: Греческий оборот связывает слышание с послушанием, однако прямо использует образ голоса. Перевод сохраняет и этот образ, и смысловой оттенок повиновения, не устраняя их напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейской речи. Союз «и» перед вторым однородным сказуемым добавлен для естественного русского синтаксиса; конечная запятая сохранена, поскольку стих представляет незавершённую условную часть предложения.
