  text: and they became beneath and not above[b][a], because we sinned against the Lord our God by not listening to his voice.
translation:
  language: ru
  text: И они оказались внизу, а не наверху[a], потому что мы согрешили против Господа, Бога нашего, не слушая его голоса[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ниже, а не выше». Пространственное противопоставление также выражает низкое положение или унижение.'
    reason: lexical_alternative
  - marker: b
    text: В библейском языке «слушать его голос» означает также внимать Богу и повиноваться ему.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθησαν
  choice: они оказались
  rationale: Аорист γίνομαι обозначает наступившее состояние. «Оказались» естественно по-русски передаёт результат, не превращая глагол в статическое «были» и не навязывая значение внешнего принуждения.
- source_word: ὑποκάτω
  choice: внизу
  rationale: Сохраняет пространственную метафору и прямое противопоставление слову ἐπάνω; в контексте она также выражает униженное положение.
- source_word: ἐπάνω
  choice: наверху
  rationale: Естественная русская пара к «внизу», сохраняющая буквальный образ положения и статуса.
- source_word: ἡμάρτομεν
  choice: мы согрешили
  rationale: Прямой и общепонятный перевод ἁμαρτάνω, сохраняющий нравственную и богословскую весомость слова.
- source_word: Κυρίῳ θεῷ ἡμῶν
  choice: против Господа, Бога нашего
  rationale: Дательный падеж при ἁμαρτάνω передан естественной русской конструкцией «согрешить против». Приложение «Бога нашего» сохраняет структуру и торжественный библейский регистр.
- source_word: πρὸς τὸ μὴ ἀκούειν
  choice: не слушая
  rationale: Оборот указывает, в чём именно состоял грех. Деепричастная конструкция передаёт обстоятельственный смысл и сохраняет исходный образ слушания, не заменяя его толкованием «не повинуясь».
- source_word: τῆς φωνῆς αὐτοῦ
  choice: его голоса
  rationale: Буквально сохраняет φωνή — «голос». В библейском употреблении выражение включает смысл послушания, что пояснено в сноске.
theological_decisions:
- issue: Пространственная метафора униженного положения в языке заветных проклятий
  choice: они оказались внизу, а не наверху
  alternative: они стали ниже, а не выше
  rationale: Сохранена конкретная пространственная антитеза греческого текста, способная одновременно обозначать низкое общественное положение и унижение. Метафора не заменяется обобщающим толкованием.
- issue: Переход от третьего лица «они» к первому лицу «мы»
  choice: они оказались… потому что мы согрешили
  alternative: мы оказались… потому что мы согрешили
  rationale: Греческий текст действительно сочетает ἐγενήθησαν в третьем лице множественного числа с ἡμάρτομεν в первом лице. Этот напряжённый переход сохранён, а не исправлен ради грамматического единообразия.
- issue: Библейская идиома слушания голоса как послушания
  choice: не слушая его голоса
  alternative: не повинуясь ему
  rationale: Исходный текст прямо говорит о слушании голоса. Буквальный образ сохранён в основном тексте, а подразумеваемый смысл послушания раскрыт в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Лексика общепонятна; сохранены исходная пространственная метафора, смена грамматического лица и идиома «слушать голос». Местоимение «его» написано со строчной буквы по нормам современного русского издания.
