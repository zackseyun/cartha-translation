base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/012.yaml
  text: We have sinned[a], we have acted ungodly, we have done wrong, O Lord our God, against all your ordinances.
translation:
  language: ru
  text: Мы согрешили, поступили нечестиво и совершили неправду, Господи, Боже наш, — против всех Твоих установлений.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против всех Твоих праведных постановлений»; возможно также: «в отношении всех Твоих установлений». Греческое выражение допускает как смысл нарушения Божьих предписаний, так и более широкое указание на отношение к ним.'
    reason: Лексико-синтаксическая неоднозначность сочетания ἐπί с дательным и диапазона значений δικαιώματα.
lexical_decisions:
- source_word: ἡμάρτομεν
  choice: Мы согрешили
  rationale: Аорист выражает признание совершённого греха; русское прошедшее совершенного вида естественно передаёт исповедальный смысл.
- source_word: ἠσεβήσαμεν
  choice: поступали нечестиво
  rationale: Передаёт нечестивое, непочтительное к Богу поведение и сохраняет глагольный характер выражения.
- source_word: ἠδικήσαμεν
  choice: творили неправду
  rationale: Передаёт совершение неправого без добавления отсутствующего в греческом тексте личного объекта.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: Господи, Боже наш
  rationale: Естественная для русской молитвенной речи форма прямого обращения, точно отражающая оба греческих наименования.
- source_word: ἐπὶ πᾶσιν τοῖς δικαιώμασίν σου
  choice: против всех Твоих установлений
  rationale: В покаянном контексте ἐπί с дательным может обозначать отношение проступка к Божьим предписаниям; «установления» сохраняет правовой и заветный оттенок δικαιώματα, не сужая его до судебных приговоров.
theological_decisions:
- issue: Передача κύριος в обращении к Богу
  choice: Господи
  alternative: Владыка
  rationale: Греческое κύριος прямо передаётся как «Господь»; звательная форма «Господи» уместна в молитвенном обращении и не подменяет исходное слово реконструированным Божественным именем.
- issue: Значение δικαιώματα в покаянном признании
  choice: установления
  alternative: праведные суды; постановления; предписания
  rationale: «Установления» охватывает обязательные Божьи нормы и сохраняет юридико-заветный смысл слова, не ограничивая его только судебными решениями.
- issue: Отношение, выраженное ἐπί с дательным
  choice: против
  alternative: в отношении; касательно
  rationale: «Против» естественно выражает нарушение Божьих установлений в данном покаянном контексте, а допустимая более широкая соотносительная трактовка сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного исповедания. Трёхчастная последовательность признаний сохранена; союз перед третьим глаголом делает её естественной по-русски. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому благоговейному издательскому регистру.
