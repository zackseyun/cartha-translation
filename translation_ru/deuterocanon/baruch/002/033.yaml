base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/033.yaml
  text: And they will turn away from their stiff neck and from their evil deeds[a], because they will remember the way of their fathers who sinned before the Lord.
translation:
  language: ru
  text: И они отвернутся от своей упрямой спины[a] и от своих злых дел, потому что вспомнят путь своих отцов, согрешивших пред Господом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от своей жёсткой спины». Необычный греческий образ обозначает упрямство, непреклонность; в некоторых переводах он передаётся как «от своей жёсткой шеи» или просто «от своего упрямства».'
    reason: Сохранение необычного образа источника и разъяснение его метафорического смысла.
lexical_decisions:
- source_word: ἀποστρέψουσιν
  choice: отвернутся
  rationale: Будущее время передаёт предстоящую перемену направления; сочетание с ἀπό естественно выражается как «отвернутся от».
- source_word: ἀπὸ τοῦ νώτου αὐτῶν τοῦ σκληροῦ
  choice: от своей упрямой спины
  rationale: 'Сохраняется необычный телесный образ греческого текста: νῶτον означает «спина», а σκληρός в данном метафорическом контексте передаёт непреклонность и упрямство. Более привычный образ «жёсткой шеи» не подменяет исходное слово.'
- source_word: πονηρῶν πραγμάτων αὐτῶν
  choice: от своих злых дел
  rationale: πράγματα здесь обозначает поступки или практику, поэтому «злые дела» точнее и естественнее общего «злые вещи».
- source_word: μνησθήσονται
  choice: вспомнят
  rationale: Прямой и естественный эквивалент будущей формы со значением припоминания.
- source_word: τῆς ὁδοῦ
  choice: путь
  rationale: Сохраняется библейская метафора образа жизни или поведения без её преждевременного истолкования.
- source_word: πατέρων αὐτῶν
  choice: своих отцов
  rationale: Передаёт грамматически мужскую форму и контекст предков; возвратное «своих» естественно соотносит отцов с подлежащим.
- source_word: τῶν ἁμαρτόντων
  choice: согрешивших
  rationale: Причастие точно и компактно передаёт греческое аористное причастие.
- source_word: ἔναντι Κυρίου
  choice: пред Господом
  rationale: Сохраняет пространственно-судебный оттенок «перед, в присутствии» и не усиливает его до «против Господа».
theological_decisions:
- issue: Необычный образ «упрямой спины»
  choice: Сохранить телесный образ исходного текста.
  alternative: Передать как «от своего упрямства» или заменить образом «жёсткой шеи».
  rationale: Греческий текст содержит νώτου, «спины», а не обычное слово «шея». Сохранение образа обеспечивает прозрачность по отношению к источнику и не подменяет его более знакомой библейской идиомой.
- issue: πατέρων αὐτῶν
  choice: своих отцов
  alternative: своих предков
  rationale: Форма источника мужского рода; контекст допускает прямое обозначение отцов-предшественников без нейтрализации.
- issue: Κυρίου
  choice: Господом
  alternative: ГОСПОДОМ
  rationale: Перевод следует непосредственно греческому Κυρίου; прописное «ГОСПОДЬ», обычно сигнализирующее еврейское Имя, здесь не требуется.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Пред Господом» сохраняет достоинство регистра; необычный образ «упрямой спины» намеренно оставлен и пояснён сноской.
