translation:
  language: ru
  text: чтобы вся земля узнала, что Ты — Господь, наш Бог, ибо Твоим именем назван Израиль и его потомство[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Твоё имя наречено над Израилем и над его потомством». Или: «Твоё имя призвано над Израилем». Греческий оборот выражает принадлежность Израиля Богу и его отождествление с Его именем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γνῷ
  choice: чтобы … узнала
  rationale: ἵνα с аористом сослагательного наклонения выражает цель или предполагаемый результат; русское «чтобы … узнала» естественно передаёт эту связь.
- source_word: πᾶσα ἡ γῆ
  choice: вся земля
  rationale: γῆ может означать и землю вообще, и отдельную страну; сочетание с πᾶσα и мысль о всеобщем признании Бога Израиля поддерживают более широкое значение.
- source_word: σὺ Κύριος ὁ θεὸς ἡμῶν
  choice: Ты — Господь, наш Бог
  rationale: Формулировка сохраняет именную конструкцию греческого текста и не превращает Κύριος в звательную форму; «наш Бог» естественно передаёт ὁ θεὸς ἡμῶν.
- source_word: τὸ ὄνομά σου ἐπεκλήθη ἐπὶ
  choice: Твоё имя наречено над
  rationale: Сохранён библейский образ имени, наречённого над народом. Он допускает взаимосвязанные оттенки провозглашения, принадлежности и отождествления, разъяснённые в сноске.
- source_word: τὸ γένος αὐτοῦ
  choice: его потомство
  rationale: γένος здесь обозначает род и потомков; единственное число местоимения αὐτοῦ сохранено и отнесено к Израилю в соответствии с формой греческого текста.
theological_decisions:
- issue: Божье имя «наречено над» народом
  choice: Сохранить образно-идиоматическое выражение «Твоё имя наречено над Израилем»
  alternative: «Израиль носит Твоё имя» или «Твоё имя призвано над Израилем»
  rationale: Греческая фраза указывает на принадлежность Израиля Богу и его отождествление с Богом, но также сохраняет оттенок призывания или провозглашения имени. Буквенно-образная передача со сноской не сводит смысл только к одному оттенку.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Начальное «чтобы» оставлено со строчной буквы, поскольку стих синтаксически продолжает предшествующую молитву; тире делает именную конструкцию ясной. Необычный образ «имя наречено над» намеренно сохранён и пояснён сноской.
