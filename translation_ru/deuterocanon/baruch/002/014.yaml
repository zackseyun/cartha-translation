lexical_decisions:
- source_word: εἰσάκουσον
  choice: Услышь
  rationale: Естественная молитвенная формула, точно передающая просьбу внять молитве.
- source_word: δέησις
  choice: моление
  rationale: Передаёт настоятельное прошение и сохраняет отличие от более общего προσευχή — «молитва».
- source_word: ἕνεκεν σοῦ
  choice: ради имени Твоего
  rationale: В данном контексте речь о действии Бога ради Него Самого, то есть ради Его имени и чести; такая формулировка естественна по-русски и соответствует библейской молитвенной речи.
- source_word: χάριν κατὰ πρόσωπον
  choice: благосклонность в глазах
  rationale: Идиоматически передаёт просьбу о благоприятном отношении со стороны других людей.
- source_word: τῶν ἀποικισάντων ἡμᾶς
  choice: тех, кто увёл нас в плен
  rationale: Глагол обозначает насильственное переселение; контекстуальное «в плен» ясно передаёт положение изгнанников.
theological_decisions:
- issue: Значение ἕνεκεν σοῦ
  choice: ради имени Твоего
  alternative: ради Тебя Самого
  rationale: Первый вариант естественно выражает библейскую мысль о Божьем действии ради собственной чести, не приписывая заслугу молящимся. Однако слово «имени» в греческом тексте отсутствует, поэтому это умеренно эксплицирующий перевод.
translation_notes:
  register: Современный литературный русский с dignified молитвенной интонацией; синтаксис упрощён без утраты параллелизма исходного текста. Местоимение «Твоего» написано с прописной буквы как допустимая традиционная форма обращения к Богу.
