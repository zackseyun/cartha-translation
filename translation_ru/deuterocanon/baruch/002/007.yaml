translation:
  language: ru
  text: которые Господь изрёк против нас, — все эти бедствия, постигшие нас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё это зло»; греческое слово может также означать несчастья или бедствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: которые
  rationale: Относительное местоимение сохраняет связь с предшествующим контекстом и фрагментарное строение стиха.
- source_word: ἐλάλησεν
  choice: изрёк
  rationale: Передаёт совершившееся речевое действие Господа и уместно для торжественного повествования о возвещённом суде.
- source_word: Κύριος
  choice: Господь
  rationale: Прямое и традиционное соответствие греческому Κύριος без подстановки еврейского Божественного имени.
- source_word: ἐφ᾽ ἡμᾶς
  choice: против нас
  rationale: При глаголе речи и в контексте суда сочетание имеет направленный, неблагоприятный для говорящих смысл.
- source_word: πάντα τὰ κακὰ ταῦτα
  choice: все эти бедствия
  rationale: В данном контексте κακά обозначает постигшие народ губительные события. «Бедствия» естественно по-русски, а более буквальное «зло» отмечено в сноске для сохранения смысловой широты.
- source_word: ἦλθεν ἐφ᾽ ἡμᾶς
  choice: постигшие нас
  rationale: Естественная русская передача идиомы «пришли на нас» без изменения смысла.
theological_decisions:
- issue: Следует ли передавать τὰ κακά как нравственное «зло» или как пережитые народом бедствия
  choice: бедствия
  alternative: зло; несчастья
  rationale: Контекст указывает на губительные последствия Божьего суда, однако греческое слово шире. Основной текст передаёт контекстуальный смысл, а сноска сохраняет буквальную альтернативу и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инвертированная структура исходного текста и связь с предшествующим контекстом сохранены; тяжеловесное буквальное «пришедшие на нас» передано естественным оборотом «постигшие нас».
