  text: He sends out the light[a], and it goes; he called it, and it obeyed him with trembling.
translation:
  language: ru
  text: Он[a] посылает свет — и тот идёт; Он позвал его — и тот с трепетом повиновался Ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Тот, кто посылает свет, — и свет идёт». В греческом тексте стих начинается с причастия с артиклем, которое служит титулоподобным обозначением Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀποστέλλων
  choice: Он посылает
  rationale: Субстантивированное причастие с артиклем обозначает Бога, названного в ближайшем контексте. Личная форма естественна для современного русского языка, а примечание сохраняет формальную особенность греческого текста.
- source_word: τὸ φῶς
  choice: свет
  rationale: Речь идёт о сотворённом свете, подвластном Божьему повелению. В русском языке определённость не требует отдельного показателя.
- source_word: πορεύεται
  choice: идёт
  rationale: Простой глагол сохраняет прямую персонификацию света и настоящее время греческой формы.
- source_word: ἐκάλεσεν
  choice: позвал
  rationale: Передаёт личностный образ Божьего обращения к свету, не усиливая значение до формального приказа или призыва.
- source_word: ὑπήκουσεν αὐτῷ
  choice: повиновался Ему
  rationale: Глагол выражает отклик послушания. Прошедшее время сохраняет аорист греческого текста и его напряжённое соположение с настоящим временем первой части.
- source_word: τρόμῳ
  choice: с трепетом
  rationale: Творительный оборот естественно передаёт обстоятельственное значение дательного падежа и сохраняет поэтический образ благоговейного содрогания.
theological_decisions:
- issue: Персонификация света, повинующегося Богу
  choice: 'Сохранить прямую персонификацию: свет идёт, слышит зов и повинуется с трепетом.'
  alternative: Передать это как безличное описание установленного Богом порядка природы.
  rationale: Греческий текст намеренно изображает свет как личностно откликающийся на Божью власть; смягчение образа ослабило бы богословский акцент на владычестве Бога над творением.
- issue: Референт субстантивированного причастия ὁ ἀποστέλλων
  choice: Передать личным местоимением «Он», относящимся к Богу из контекста.
  alternative: «Посылающий свет» или «Тот, кто посылает свет».
  rationale: Контекст однозначно указывает на Бога. Личная форма делает русское предложение естественным, тогда как примечание сохраняет титулоподобное построение оригинала.
- issue: Смена времён между настоящим πορεύεται и аористами ἐκάλεσεν, ὑπήκουσεν
  choice: 'Сохранить: «идёт» — «позвал» — «повиновался».'
  alternative: Унифицировать всё в настоящем времени ради плавности.
  rationale: Необычная смена времён присутствует в источнике и не должна молча сглаживаться, поскольку может совмещать характеристику постоянного действия Бога с изображением завершённого отклика.
translation_notes:
  register: Современный литературный русский язык с поэтической, но понятной образностью. Тире подчёркивает немедленный отклик света. Прописное «Ему» поддерживает традиционно-библейский почтительный регистр без внесения дополнительного толкования.
