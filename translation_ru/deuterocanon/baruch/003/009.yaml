  language: en
  yaml_path: translation/deuterocanon/baruch/003/009.yaml
  text: Hear[a], O Israel, the commandments of life[b]; give ear to know prudence.
translation:
  language: ru
  text: Слушай, Израиль, заповеди жизни[a]; внимайте[b], чтобы познать благоразумие[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «животворящие заповеди»; или: «заповеди, ведущие к жизни». Буквально: «заповеди жизни».'
    reason: Сохранение неоднозначности греческого генитива ζωῆς.
  - marker: b
    text: В греческом тексте первое повеление («слушай») стоит в единственном числе, а второе («внимайте») — во множественном.
    reason: Пояснение сохранённой в переводе смены грамматического числа.
  - marker: c
    text: 'Или: «разумение»; «рассудительность».'
    reason: Передача диапазона значений φρόνησις.
lexical_decisions:
- source_word: Ἄκουε
  choice: Слушай
  rationale: Форма единственного числа обращена к Израилю как к единому народу; «слушай» естественно передаёт торжественный призыв и сохраняет число греческого императива.
- source_word: Ἰσραήλ
  choice: Израиль
  rationale: Общепринятая русская форма библейского имени.
- source_word: ἐντολὰς ζωῆς
  choice: заповеди жизни
  rationale: '«Заповеди» сохраняет вес авторитетного Божьего установления, а буквальная конструкция «жизни» не снимает неоднозначности генитива: это могут быть заповеди, дающие жизнь, относящиеся к жизни или ведущие к ней.'
- source_word: ἐνωτίσασθε
  choice: внимайте
  rationale: Императив множественного числа означает внимательно слушать, буквально — «принять в уши». «Внимайте» передаёт усиленный призыв и соответствует возвышенному, но понятному библейскому регистру.
- source_word: γνῶναι
  choice: чтобы познать
  rationale: Инфинитив передаёт цель; союз «чтобы» естественно выражает её по-русски, а «познать» сохраняет смысл обретения знания.
- source_word: φρόνησιν
  choice: благоразумие
  rationale: Слово обозначает разумное, рассудительное понимание с практической направленностью. «Благоразумие» точнее, чем общее «понимание», и избегает тяжеловесного сочетания «познать понимание».
theological_decisions:
- issue: Значение генитива в ἐντολὰς ζωῆς
  choice: «заповеди жизни»
  alternative: «животворящие заповеди»; «заповеди, ведущие к жизни»
  rationale: Компактная греческая конструкция допускает значение принадлежности, результата или цели. Основной текст сохраняет эту смысловую открытость, не утверждая однозначно, каким именно образом заповеди связаны с жизнью.
- issue: Переход от единственного числа к множественному в повелительных формах
  choice: «Слушай… внимайте»
  alternative: Согласовать обе формы в единственном или обе во множественном числе
  rationale: Греческий текст сначала обращается к Израилю как к единому целому, а затем использует множественное число. Перевод сохраняет этот заметный риторический переход, а не сглаживает его.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «внимайте» и «познать» торжественны, но общепонятны. Пунктуация сохраняет двучленную структуру греческого призыва.
