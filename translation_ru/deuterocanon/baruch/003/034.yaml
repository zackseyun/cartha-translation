lexical_decisions:
- source_word: ἀστέρες
  choice: звёзды
  rationale: Прямой и естественный русский эквивалент множественного числа, обозначающего небесные светила.
- source_word: ἔλαμψαν
  choice: воссияли
  rationale: Передаёт аорист λάμπω как завершённое действие и сохраняет возвышенный поэтический строй; «засияли» было бы более нейтральной альтернативой.
- source_word: ἐν ταῖς φυλακαῖς αὐτῶν
  choice: на своих стражах
  rationale: Сохраняет образ φυλακαί — «стражи», то есть назначенные периоды или места несения стражи, — не сводя его однозначно к орбитам, временам или стоянкам звёзд.
- source_word: εὐφράνθησαν
  choice: возрадовались
  rationale: Точно сохраняет приписанную звёздам радость и соответствует возвышенному поэтическому контексту.
theological_decisions:
- issue: Поэтическое олицетворение звёзд
  choice: 'Сохранить прямое олицетворение: звёзды «воссияли… и возрадовались».'
  alternative: Передать строку как безличное астрономическое описание.
  rationale: Греческий текст прямо приписывает звёздам радость, изображая творение как откликающееся на установленный Богом порядок; устранять это олицетворение не следует.
- issue: Неоднозначность выражения ἐν ταῖς φυλακαῖς αὐτῶν
  choice: Сохранить образ «на своих стражах» и пояснить его в сноске.
  alternative: Конкретизировать как «на своих местах», «на своих путях» или «на своих постах».
  rationale: φυλακαί допускает временное и пространственное понимание; контекст не требует выбирать только одно из них.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Формы «воссияли» и «возрадовались» поддерживают параллелизм и олицетворение, не прибегая к архаической грамматике.
