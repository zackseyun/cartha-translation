translation:
  language: ru
  text: Ты оставил источник мудрости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родник мудрости».'
    reason: Лексический вариант для πηγή, подчёркивающий образ бьющей из земли воды.
lexical_decisions:
- source_word: ἐγκατέλιπες
  choice: ты оставил
  rationale: Аорист действительного залога, 2-е лицо единственного числа, передаёт совершённое действие. «Оставил» звучит естественно и достойно; значение сознательного отступления раскрывается контекстом, тогда как «покинул» здесь несколько усиливает формулировку.
- source_word: πηγὴν
  choice: источник
  rationale: πηγή обозначает родник, источник воды. Русское «источник» сохраняет конкретный водный образ и одновременно естественно сочетается с «мудростью».
- source_word: σοφίας
  choice: мудрости
  rationale: Прямое соответствие σοφία; текст не уточняет «божественной», поэтому пояснение не добавлено.
theological_decisions:
- issue: Метафора «источник мудрости»
  choice: 'Сохранить образ в прямой форме: «источник мудрости».'
  alternative: '«родник мудрости»; более отвлечённое понимание: «начало мудрости».'
  rationale: Греческое πηγή создаёт конкретный образ источника воды. «Источник» в современном русском сохраняет этот образ, не определяя прямо, кого или что он обозначает.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка. Обращение во 2-м лице единственного числа сохранено.
