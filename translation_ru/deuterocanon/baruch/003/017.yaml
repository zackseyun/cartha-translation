translation:
  language: ru
  text: те, кто забавлялся с птицами небесными[a], копил серебро и золото, на которое полагались люди, и чьему имуществу нет конца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «играл среди птиц небесных»; греческое причастие может обозначать игру или развлечение вообще, не обязательно насмешку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπαίζοντες
  choice: забавлялся с
  rationale: Передаёт игру или развлечение, не сводя значение ни к словесной насмешке, ни исключительно к охоте; неоднозначность пояснена в сноске.
- source_word: ὀρνέοις τοῦ οὐρανοῦ
  choice: птицами небесными
  rationale: Естественное для литературного русского соответствие традиционному библейскому обороту при сохранении образа греческого текста.
- source_word: θησαυρίζοντες
  choice: копил
  rationale: Современный и ясный глагол со значением накопления ценностей.
- source_word: ἀργύριον καὶ τὸ χρυσίον
  choice: серебро и золото
  rationale: Контекстуально речь идёт о драгоценных металлах, а не просто о деньгах.
- source_word: ᾧ ἐπεποίθεισαν ἄνθρωποι
  choice: на которое полагались люди
  rationale: Средний род относительного местоимения согласован с собирательно понимаемым богатством; аорист передан прошедшим временем, а ἄνθρωποι — естественным родовым обозначением «люди».
- source_word: οὐκ ἔστιν τέλος τῆς κτήσεως αὐτῶν
  choice: чьим приобретениям нет конца
  rationale: κτῆσις может обозначать приобретение или нажитое имущество; «приобретения» сохраняет оттенок непрерывного стяжания и грамматическую связь с владельцами.
theological_decisions:
- issue: Родовое значение ἄνθρωποι
  choice: люди
  alternative: мужи / люди мужского пола
  rationale: В данном контексте слово обозначает людей вообще; нейтральное русское «люди» не добавляет утверждения об исключительно мужской группе.
- issue: Объект человеческого упования
  choice: на которое полагались
  alternative: которому доверяли
  rationale: Форма ᾧ формально единственного числа и среднего рода; перевод соотносит её с серебром и золотом как единым богатством, не устраняя грамматическое напряжение оригинала.
translation_notes:
  register: Современный литературный русский с умеренно библейской образностью. Стих представляет собой продолжение перечня, поэтому начальная форма «те, кто» намеренно сохраняет синтаксическую незавершённость контекста. Единственное число сказуемых отражает русское согласование с конструкцией «кто».
