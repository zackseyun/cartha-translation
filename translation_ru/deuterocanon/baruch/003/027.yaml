  text: Не этих[a] избрал Бог и не дал им пути знания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не их избрал Бог». В греческом стоит указательное местоимение, относящееся к названным ранее людям.'
