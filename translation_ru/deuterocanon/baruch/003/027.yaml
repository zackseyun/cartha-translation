lexical_decisions:
- source_word: οὐ τούτους ἐξελέξατο ὁ θεός
  choice: Не этих избрал Бог
  rationale: «Этих» сохраняет указательную силу τούτους и отсылает к названным ранее людям; вынесение отрицания и дополнения вперёд передаёт греческое смысловое ударение. ἐξελέξατο естественно передано глаголом «избрал» в библейском контексте.
- source_word: οὐδὲ
  choice: и не
  rationale: В русском «и не» естественно связывает второй отрицательный ряд с первым, сохраняя значение οὐδὲ без тяжеловесной конструкции.
- source_word: ὁδὸν ἐπιστήμης
  choice: пути знания
  rationale: Передаёт греческое сочетание буквально и сохраняет характерный для литературы мудрости образ пути, не добавляя направленного значения «к знанию».
- source_word: ἔδωκεν αὐτοῖς
  choice: не дал им
  rationale: Прямой и естественный эквивалент греческого выражения; местоимение ясно обозначает тех же лиц.
theological_decisions:
- issue: Сохранение указательного значения τούτους
  choice: этих
  alternative: их
  rationale: Указательное местоимение связывает высказывание с конкретными лицами из ближайшего контекста и не превращает их в неопределённую группу.
- issue: Толкование ὁδὸν ἐπιστήμης
  choice: путь знания
  alternative: путь к знанию; путь познания; путь понимания
  rationale: Форма «путь знания» сохраняет неоднозначность родительного падежа в греческом и не уточняет без основания, идёт ли речь о пути к обретению знания или о пути, которому свойственно знание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Инверсия «Не этих избрал Бог» сохраняет риторическое выделение конкретной группы; лексика проста и понятна без конфессионально окрашенных уточнений.
