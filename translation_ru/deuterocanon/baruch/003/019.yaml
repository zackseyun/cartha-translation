base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/019.yaml
  text: They vanished and went down to Hades[a], and others rose up in their place.
translation:
  language: ru
  text: Они исчезли и сошли в Аид[a], а вместо них поднялись другие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в царство мёртвых», «в преисподнюю»; греч. «Аид» — мир умерших.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠφανίσθησαν
  choice: исчезли
  rationale: 'Передаёт результативный смысл аориста: они пропали из виду, перестали существовать среди живых; вариант не усиливает значение до однозначного «погибли».'
- source_word: εἰς ᾅδου
  choice: в Аид
  rationale: Греческий текст прямо называет ᾅδης — царство мёртвых. «Аид» сохраняет термин источника, тогда как «могила» сужает смысл, а «шеол» привносит отсутствующее здесь еврейское слово.
- source_word: κατέβησαν
  choice: сошли
  rationale: Естественно передаёт направленное вниз движение, связанное в тексте с Аидом.
- source_word: ἄλλοι
  choice: другие
  rationale: Сохраняет неопределённое множественное число без добавления отсутствующего в греческом слова «люди».
- source_word: ἀντανέστησαν
  choice: поднялись
  rationale: Сохраняет образ вставания или появления вслед за прежними, но не создаёт столь сильной ассоциации с воскресением или мятежом, как «восстали».
- source_word: ἀντʼ αὐτῶν
  choice: вместо них
  rationale: Точно передаёт значение замещения или преемства при ἀντί с родительным падежом.
theological_decisions:
- issue: Передача ᾅδης в контексте второканонической литературы мудрости
  choice: Аид
  alternative: царство мёртвых; преисподняя; могила; шеол
  rationale: Перевод следует греческому источнику и сохраняет его обозначение мира умерших. Он не отождествляет Аид с адом как местом окончательного наказания и не заменяет греческий термин еврейским «шеолом».
translation_notes:
  register: Современный литературный русский язык с лаконичным, dignified библейским ритмом. «Поднялись» сохраняет образ исходного глагола, но избегает нежелательного однозначного намёка на воскресение или восстание.
