  text: because those who work in silver and are concerned[a], and there is no finding out their works.
translation:
  language: ru
  text: ибо те, кто обрабатывает серебро и поглощены заботами, — дел их невозможно постичь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…и нет возможности разыскать (или обнаружить) их дела». Греческое выражение кратко; ἔργα может обозначать как дела и деятельность, так и результаты труда, в том числе изделия.'
    reason: Сохраняет неоднозначность ἐξεύρεσις τῶν ἔργων αὐτῶν, не распространяя невозможность «найти» на самих ремесленников.
lexical_decisions:
- source_word: ὅτι
  choice: ведь
  rationale: Передаёт пояснительную силу союза и естественно продолжает вопрос и рассуждение предшествующего контекста.
- source_word: οἱ τὸ ἀργύριον τεκταίνοντες
  choice: тех, кто обрабатывал серебро
  rationale: τεκταίνομαι здесь обозначает ремесленную обработку или изготовление из материала; ἀργύριον понято буквально как серебро, а не деньги.
- source_word: μεριμνῶντες
  choice: был поглощён заботами
  rationale: Сохраняет значение напряжённой, тревожной занятости, не сводя слово ни к обычному усердию, ни исключительно к страху.
- source_word: οὐκ ἔστιν ἐξεύρεσις τῶν ἔργων αὐτῶν
  choice: не найти и дел их
  rationale: Передаёт буквальную идею отсутствия нахождения или обнаружения; «дел» сохраняет широту ἔργων и связь как с деятельностью, так и с её результатами.
theological_decisions:
- issue: Подразумеваемый объект оборота οὐκ ἔστιν ἐξεύρεσις
  choice: В основном тексте «не найти» распространено и на самих мастеров, и на их дела с опорой на эллиптический вопрос контекста.
  alternative: «дел их не постичь / невозможно исследовать их изделия»
  rationale: Греческая строка кратка и синтаксически трудна. Контекст спрашивает, где теперь прежние влиятельные и искусные люди; выбранный вариант сохраняет мотив их исчезновения, а сноска отмечает более узкое прочтение последней фразы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «дел их» поддерживает достоинство стиля, не вводя архаической лексики.
