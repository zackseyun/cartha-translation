lexical_decisions:
- source_word: ὅτι
  choice: Ведь
  rationale: Союз вводит основание предшествующей просьбы; «ведь» естественно передаёт пояснительно-причинную связь, не делая её чрезмерно жёсткой.
- source_word: σὺ
  choice: Ты
  rationale: Отдельно выраженное местоимение в греческом несёт смысловое ударение; оно сохранено и усилено естественной русской конструкцией с тире.
- source_word: Κύριος
  choice: Господь
  rationale: Здесь слово служит божественным титулом; традиционное и ясное русское соответствие — «Господь».
- source_word: ὁ θεὸς ἡμῶν
  choice: Бог наш
  rationale: Такой порядок слов сохраняет молитвенную торжественность и точно передаёт притяжательное значение.
- source_word: αἰνέσομέν
  choice: мы будем славить
  rationale: Будущее изъявительное наклонение передано прямо, без превращения в побуждение; «славить» является естественным библейским соответствием αἰνέω в обращении к Богу.
- source_word: σε
  choice: Тебя
  rationale: Прямое дополнение, относящееся к Богу, передано личным местоимением.
- source_word: Κύριε
  choice: Господи
  rationale: Русская звательная форма естественно и точно обозначает прямое обращение, не требуя отдельной частицы вроде «о».
theological_decisions:
- issue: Передача κύριος как божественного титула и обращения
  choice: Господь / Господи
  alternative: Владыка / Владыко
  rationale: «Господь» является общепринятым неденоминационным соответствием κύριος в контексте обращения к Богу; форма «Господи» ясно передаёт греческий вокатив.
