lexical_decisions:
- source_word: προσελογίσθης
  choice: ты был причислен
  rationale: Аорист пассивного залога передаёт причисление к определённой группе; «был причислен» естественно звучит по-русски и сохраняет пассивную конструкцию.
- source_word: μετὰ
  choice: к тем
  rationale: Хотя μετά с родительным буквально означает «с», при глаголе причисления русская идиома требует конструкции «причислен к тем».
- source_word: τῶν εἰς ᾅδου
  choice: тем, кто в аде
  rationale: Передаёт принадлежность к числу находящихся в царстве мёртвых, не подменяя выражение просто словом «мёртвые».
- source_word: ᾅδου
  choice: ад
  rationale: В современном русском библейском языке «ад» является традиционным соответствием греческому ᾅδης; сноска уточняет здесь значение царства мёртвых и предотвращает автоматическое отождествление с местом окончательного наказания.
theological_decisions:
- issue: Передача ᾅδου
  choice: ад
  alternative: царство мёртвых
  rationale: Основной текст сохраняет традиционный библейский термин, а сноска раскрывает его контекстуальный смысл и не сводит его ни к могиле, ни к месту окончательного наказания.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка. Местоимение «ты» сохранено по форме греческого глагола. Термин «ад» снабжён пояснением из-за возможного более узкого понимания в современном употреблении.
