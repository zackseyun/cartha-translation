translation:
  language: ru
  text: Там родились исполины — знаменитые с древнейших времён, огромные ростом и искусные в войне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖ
  choice: Там
  rationale: Простое указательное наречие места естественно отсылает к предшествующему контексту.
- source_word: ἐγεννήθησαν
  choice: родились
  rationale: Аорист пассивного залога от γεννάω здесь наиболее прямо передаёт появление на свет; «были рождены» звучало бы менее естественно.
- source_word: οἱ γίγαντες
  choice: исполины
  rationale: «Исполины» передаёт значение людей необычайно большого роста, сохраняет возвышенный библейский регистр и не уточняет их мифологическую или межтекстовую идентичность.
- source_word: οἱ ὀνομαστοὶ ἀπʼ ἀρχῆς γενόμενοι
  choice: именитые издревле
  rationale: Сжатый греческий оборот указывает на древность и известность этих исполинов. Русская формулировка сохраняет оба смысловых компонента без тяжеловесного буквального воспроизведения причастия γενόμενοι.
- source_word: εὐμεγέθεις
  choice: огромные ростом
  rationale: Прилагательное обозначает выдающиеся телесные размеры; добавление «ростом» ясно и естественно конкретизирует смысл по-русски.
- source_word: ἐπιστάμενοι πόλεμον
  choice: сведущие в военном деле
  rationale: Оборот выражает знание и умение в сфере войны. Эта формулировка передаёт компетентность, не сводя её лишь к боевому опыту.
theological_decisions:
- issue: Кем были названы οἱ γίγαντες
  choice: Сохранить обозначение «исполины» без дальнейшей идентификации.
  alternative: «нефилимы», «богатыри», «могучие люди»
  rationale: Греческий текст называет их γίγαντες, но не отождествляет прямо с какой-либо конкретной группой из другого текста. «Нефилимы» внесло бы спорное межтекстовое толкование, а «могучие люди» ослабило бы указание на необычайный размер.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Исполины» и «именитые» сохраняют достоинство стиля, оставаясь понятными; синтаксис сделан плавным без устранения неоднозначности греческого причастного оборота.
