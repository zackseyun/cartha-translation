lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  choice: Господи Вседержитель
  rationale: Устоявшееся и естественное для русской библейской речи обращение, сохраняющее смысл Божьей власти над всем.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: Бог Израиля
  rationale: Сохранён приложенный к обращению титул с его библейским и заветным звучанием.
- source_word: ψυχὴ
  choice: душа
  rationale: В контексте плача слово обозначает внутреннее «я» человека; «душа» сохраняет антропологическую образность и параллель с «духом».
- source_word: ἐν στενοῖς
  choice: терпящая бедствие
  rationale: Греческий оборот буквально связан со стеснённым, тяжёлым положением; выбранная формулировка естественно передаёт тяжёлую нужду без неясного буквализма.
- source_word: πνεῦμα ἀκηδιῶν
  choice: дух, изнемогающий от уныния
  rationale: Причастие выражает подавленность, упадок сил и потерю мужества. Формулировка сохраняет процессуальный оттенок и не превращает состояние в клинический диагноз.
- source_word: κέκραγεν πρὸς σέ
  choice: к Тебе воззвала
  rationale: «Воззвала» соответствует молитвенному крику и совершённому действию с сохраняющимся значением; постановка сказуемого перед однородными образами позволяет отразить греческое единственное число.
theological_decisions:
- issue: Соотношение ψυχή и πνεῦμα
  choice: Передать раздельно как «душа» и «дух», сохранив единственное число сказуемого
  alternative: Объединить их в одно выражение наподобие «всё моё существо» либо согласовать сказуемое во множественном числе
  rationale: Греческий текст сохраняет поэтическую пару двух обозначений внутреннего человека, но употребляет сказуемое в единственном числе. Русская конструкция передаёт оба аспекта, не навязывая технического разграничения и не устраняя грамматическое напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной молитвенной интонацией. Обращение «Господи Вседержитель» сохраняет узнаваемый библейский регистр; остальные формулировки понятны современному читателю. Местоимение «Тебе» написано с прописной буквы как принятая в русском религиозном тексте форма почтительного обращения.
