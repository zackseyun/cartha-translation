base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/007.yaml
  text: For because of this you have put your fear in our hearts[a], that we may call on your name; and we will praise you in our exile[d][c][b], because we have turned away from our hearts every unrighteousness of our fathers who sinned before you.
translation:
  language: ru
  text: Ибо для этого Ты вложил в наши сердца страх Твой[a], чтобы мы призывали имя Твоё; и мы будем славить Тебя в нашем изгнании[b], потому что отвратили от наших сердец всякую неправду[c] наших отцов, согрешивших пред Тобой[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страх перед Тобой». Буквально по-гречески: «страх Твой»; это библейское выражение может обозначать страх и благоговение, обращённые к Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в нашем пленении». Греческое слово может обозначать состояние переселения, изгнания или плена.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «всякое беззаконие»; «всякую несправедливость».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «согрешивших против Тебя». Буквально: «согрешивших пред Тобой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι διὰ τοῦτο
  choice: Ибо потому
  rationale: Сохраняет сочетание пояснительного ὅτι и причинно-следственного διὰ τοῦτο, не превращая его без необходимости в одно лишь «поэтому».
- source_word: ἔδωκας τὸν φόβον σου ἐπὶ καρδίαν ἡμῶν
  choice: Ты вложил в наши сердца страх Твой
  rationale: Глагол «вложил» естественно передаёт образ данного Богом внутреннего расположения; «страх Твой» сохраняет намеренную многозначность греческого выражения.
- source_word: ἐπικαλεῖσθαι τὸ ὄνομά σου
  choice: чтобы мы призывали имя Твоё
  rationale: Инфинитив передан как цель или результат предшествующего действия; «призывать имя» сохраняет библейскую молитвенную формулу.
- source_word: αἰνέσομέν σε
  choice: мы будем славить Тебя
  rationale: Прямо передаёт будущее время и естественно звучит в современном русском библейском регистре.
- source_word: ἐν τῇ ἀποικίᾳ ἡμῶν
  choice: в нашем изгнании
  rationale: В данном контексте ἀποικία обозначает состояние переселения и жизни вдали от родины; «изгнание» ясно передаёт этот смысл.
- source_word: ἀπεστρέψαμεν ἀπὸ καρδίας ἡμῶν
  choice: отвратили от наших сердец
  rationale: Сохраняет пространственный образ греческого текста и выражает сознательное удаление греховного из внутренней жизни.
- source_word: πᾶσαν ἀδικίαν
  choice: всякую неправду
  rationale: «Неправда» охватывает нравственную неправедность, проступок и несправедливость, сохраняя религиозно-нравственный регистр.
- source_word: πατέρων ἡμῶν
  choice: наших отцов
  rationale: Передаёт явно мужскую форму источника и традиционное обозначение предков без нейтрализации.
- source_word: τῶν ἡμαρτηκότων ἐναντίον σου
  choice: согрешивших пред Тобой
  rationale: «Пред Тобой» буквально сохраняет значение действия в Божьем присутствии и подразумеваемую ответственность перед Ним.
theological_decisions:
- issue: Значение τὸν φόβον σου
  choice: страх Твой
  alternative: страх перед Тобой; благоговение перед Тобой
  rationale: Буквальная конструкция сохраняет напряжение между страхом, благоговением и послушанием Богу, не сводя выражение только к одному из этих оттенков.
- issue: Отношение неправды отцов к кающимся потомкам
  choice: отвратили от наших сердец всякую неправду наших отцов
  alternative: отвернулись всем сердцем от всякой неправды наших отцов
  rationale: Выбранный вариант не утверждает ни наследственной вины как догмата, ни полного разрыва лишь на уровне поведения, а сохраняет образ удаления отеческой неправды из собственных сердец.
- issue: Передача πατέρων
  choice: наших отцов
  alternative: наших предков
  rationale: Формальная гендерная определённость исходного текста сохранена; при этом выражение естественно обозначает прежние поколения народа.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного текста. Сохранены традиционные библейские сочетания «страх Твой», «призывать имя» и «пред Тобой», однако синтаксис сделан понятным современному читателю. Заглавные местоимения в обращении к Богу последовательно сохранены.
