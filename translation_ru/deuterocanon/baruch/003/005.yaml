base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/005.yaml
  text: Do not remember the unrighteous acts of our fathers[b][a], but remember your hand and your name at this time.
translation:
  language: ru
  text: Не вспоминай неправедных дел наших отцов, но вспомни о руке Твоей[a] и имени Твоём в это время.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Рука» в библейской речи может означать силу или могущественное действие.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ μνησθῇς
  choice: Не вспоминай
  rationale: Передаёт молитвенную просьбу к Богу не держать в памяти прежние проступки и сохраняет словесный контраст с последующим μνήσθητι.
- source_word: ἀδικιῶν
  choice: неправедных дел
  rationale: Передаёт нравственно-религиозное значение ἀδικία, не сужая его до общественной несправедливости и не подменяя более специальным словом «грехи».
- source_word: πατέρων ἡμῶν
  choice: наших отцов
  rationale: Сохраняет прямо выраженное в греческом тексте указание на отцов, то есть предшествующие поколения.
- source_word: μνήσθητι
  choice: вспомни
  rationale: 'Повтор того же русского корня сохраняет риторическое противопоставление: не вспоминай их дел, но вспомни о Своей руке и имени.'
- source_word: χειρός σου
  choice: о руке Твоей
  rationale: 'Буквальный библейский образ сохраняет смысловой объём: рука может обозначать силу и могущественное действие Бога.'
- source_word: ὀνόματός σου
  choice: имени Твоём
  rationale: Сохраняет традиционный библейский образ, способный включать личность, славу, честь и верность Бога.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: в это время
  rationale: Естественно передаёт указание на нынешний момент и обстоятельства молитвы, не сводя выражение к простому «сейчас».
theological_decisions:
- issue: Смысл просьбы «вспомни о руке Твоей и имени Твоём»
  choice: Сохранена буквальная молитвенная формула, подразумевающая просьбу к Богу явить Свою силу и поступить сообразно Своему имени.
  alternative: Явно развернуть смысл как «вспомни о Своём могуществе и чести».
  rationale: Буквальная формулировка не навязывает единственного толкования и сохраняет богословскую насыщенность образов «рука» и «имя».
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Параллелизм «не вспоминай — но вспомни» сохранён; местоимения, обращённые к Богу, оформлены с прописной буквы согласно распространённой русской библейской традиции.
