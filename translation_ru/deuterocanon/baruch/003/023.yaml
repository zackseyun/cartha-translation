base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/023.yaml
  text: And the sons of Hagar also[a], who seek understanding on the earth—the merchants of Merran and Teman, and the myth-makers and seekers of understanding—did not know the way of wisdom[b], nor did they remember her paths.
translation:
  language: ru
  text: Также и сыны Агари, ищущие разумения на земле, и купцы Меррана[a] и Фемана, и сказители мифов[b], и искатели разумения — не познали путь мудрости и не вспомнили её стезей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном греческом списке стоит необычное название «Мерран»; в некоторых традициях его отождествляют с другим местом или передают иначе. Здесь сохранена форма имеющегося греческого текста без молчаливого исправления.
    reason: textual_variant
  - marker: b
    text: Греческое слово может также означать «рассказчики» или «сказители преданий»; речь идёт о людях, занимающихся мифами и преданиями.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε υἱοὶ Ἁγὰρ
  choice: И сыны Агари также
  rationale: «Сыны» близко передаёт υἱοί, не заменяя его толковательным «потомки»; «также» выражает присоединительную силу τε в продолжающемся перечне.
- source_word: οἱ ἐκζητοῦντες τὴν σύνεσιν
  choice: искавшие разумения
  rationale: ἐκζητέω означает настойчиво искать; «искавшие» естественно в контексте, а «разумение» сохраняет возвышенный, но понятный регистр и повтор σύνεσις.
- source_word: οἱ ἐπὶ γῆς
  choice: на земле
  rationale: Сохранена краткая и несколько неоднозначная греческая формулировка без сужения до значения «в этой стране».
- source_word: οἱ ἔμποροι τῆς Μερρὰν καὶ Θαιμάν
  choice: купцы Меррана и Фемана
  rationale: ἔμποροι естественно передано как «купцы». Необычная форма Μερράν сохранена транслитерацией «Мерран», а Θαιμάν передано традиционной русской библейской формой «Феман».
- source_word: οἱ μυθολόγοι
  choice: сказители мифов
  rationale: Передаёт людей, занимающихся мифами или преданиями, точнее простого «рассказчики», но без современного оттенка сознательного обмана.
- source_word: οἱ ἐκζητηταὶ τῆς συνέσεως
  choice: искатели разумения
  rationale: Сохранены как именная форма, так и риторический повтор того же корня и понятия, что в более раннем выражении.
- source_word: ὁδὸν δὲ σοφίας
  choice: пути мудрости
  rationale: «Путь мудрости» сохраняет метафору ὁδός; форма родительного падежа обусловлена русским управлением глагола «познали».
- source_word: οὐκ ἔγνωσαν
  choice: не познали
  rationale: Аорист передан прошедшим временем; «познали» естественно сочетается с образом пути и сохраняет смысл знания, а не только обнаружения.
- source_word: οὐδὲ ἐμνήσθησαν τὰς τρίβους αὐτῆς
  choice: и не вспомнили её стезей
  rationale: «Не вспомнили» прямо передаёт ἐμνήσθησαν, «стези» отличает τρίβοι от ранее употреблённого ὁδός, а «её» сохраняет олицетворение мудрости.
theological_decisions:
- issue: Олицетворение мудрости
  choice: Сохранить женское местоимение в выражении «её стезей»
  alternative: «его стезей» или «стезей мудрости» без местоименного олицетворения
  rationale: σοφία грамматически женского рода и в контексте представлена как олицетворённая; русское «её» естественно сохраняет эту литературно-богословскую черту.
- issue: Необычное географическое имя Μερράν
  choice: Сохранить форму «Мерран» с пояснением
  alternative: Без пояснения заменить более привычным или реконструированным названием
  rationale: Греческий источник прямо содержит Μερράν. Скрытая нормализация устранила бы реальную текстовую трудность и создала бы ложную определённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Разумение» и «стези» поддерживают поэтический строй отрывка, оставаясь понятными. Парные тире помогают обозначить приложение в длинном греческом перечислении. Маркеры сносок поставлены непосредственно при словах, к которым относятся пояснения.
