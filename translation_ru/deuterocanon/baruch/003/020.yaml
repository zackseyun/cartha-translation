  yaml_path: translation/deuterocanon/baruch/003/020.yaml
  text: The younger men saw the light and lived on the earth[b][a], but they did not know the way of knowledge.
translation:
  language: ru
  text: Младшие[a] увидели свет[b] и жили на земле, но пути знания не познали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодые», «те, кто моложе». В греческом тексте стоит форма мужского рода множественного числа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «увидели свет». Это выражение может подразумевать, что они были живы или жили, наслаждаясь жизнью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτεροι
  choice: младшие
  rationale: Субстантивированная сравнительная форма обозначает более молодых людей в противопоставлении прежним поколениям. «Младшие» сохраняет сравнительное значение и не добавляет отсутствующего в тексте существительного.
- source_word: εἶδον φῶς
  choice: увидели свет
  rationale: Это прямой перевод конкретного греческого образа. Выражение может подразумевать жизнь, но перевод не сводит метафору к одному толкованию.
- source_word: κατῴκησαν ἐπὶ τῆς γῆς
  choice: жили на земле
  rationale: κατοικέω здесь естественно передаётся как «жить», а γῆ в данном контексте имеет широкое значение «земля», не обязательно «страна».
- source_word: ὁδὸν
  choice: пути
  rationale: Сохраняется метафора пути как образа способа достижения или обретения знания. Родительный падеж обусловлен отрицанием и естественен в русском литературном языке.
- source_word: ἐπιστήμης
  choice: знания
  rationale: ἐπιστήμη обозначает знание или понимание; «знание» наиболее прямо передаёт слово и соответствует контексту литературы мудрости.
- source_word: οὐκ ἔγνωσαν
  choice: не познали
  rationale: «Не познали» сохраняет значение γινώσκω и образно-книжную связь с «путём знания», оставаясь понятным современному читателю.
theological_decisions:
- issue: Идиоматический смысл выражения «увидели свет»
  choice: Сохранить конкретный образ «увидели свет».
  alternative: «Жили» или «наслаждались жизнью».
  rationale: Выражение может подразумевать пребывание в живых, однако греческий текст непосредственно сохраняет образ света. Его буквальная передача удерживает поэтическую многозначность.
- issue: Род и референция νεώτεροι
  choice: Передать как «младшие» и пояснить грамматический мужской род в примечании.
  alternative: «Молодые люди», «молодые» или «младшее поколение».
  rationale: Греческая форма — мужской род множественного числа, употреблённый самостоятельно. «Младшие» передаёт сравнительность без неоправданного уточнения возраста или поколения.
