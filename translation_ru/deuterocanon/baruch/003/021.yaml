  text: Не постигли они и её стезей, не ухватились за неё; их сыновья оказались далеко от принадлежавшего им пути.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более свободно: «их сыновья далеко отошли от пути». В греческом тексте заключительная часть синтаксически затруднительна: буквально сказано, что сыновья «стали далеко от пути их». Основной текст сохраняет эту неопределённость.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: постигли
  rationale: Глагол συνίημι означает понимать, постигать. «Постигли» естественно сочетается с образным выражением «её стези» и сохраняет возвышенный, но понятный регистр.
- source_word: τρίβους
  choice: стезей
  rationale: τρίβος обозначает тропу, путь. «Стези» сохраняет метафору путей мудрости и уместно в современном литературном библейском тексте.
- source_word: ἀντελάβοντο
  choice: овладели
  rationale: Средняя форма ἀντιλαμβάνομαι может означать «ухватиться», «овладеть», «приобщиться». «Не овладели ею» передаёт образ обретения мудрости, не уточняя его сверх греческого текста.
- source_word: οἱ υἱοὶ αὐτῶν
  choice: их сыновья
  rationale: В греческом тексте прямо употреблено существительное мужского рода во множественном числе — «сыновья»; нейтрализация до «детей» не требуется.
- source_word: πόρρω ἐγενήθησαν
  choice: оказались далеко
  rationale: Выражение буквально означает «стали/оказались далеко». Выбранный вариант близок к форме источника и понятен по-русски, не превращая её без необходимости в глагол движения.
- source_word: ἀπὸ τῆς ὁδοῦ αὐτῶν
  choice: от их пути
  rationale: Передано множественное притяжательное местоимение αὐτῶν — «их», несмотря на некоторую синтаксическую неловкость фразы; это сохраняет засвидетельствованное чтение.
theological_decisions:
- issue: Родовое обозначение потомков
  choice: их сыновья
  alternative: их дети
  rationale: Греческое οἱ υἱοὶ имеет явно мужскую форму; контекст не требует обобщающей замены.
- issue: Синтаксически трудная заключительная фраза
  choice: их сыновья оказались далеко от их пути
  alternative: их сыновья далеко отошли от пути
  rationale: Основной текст следует засвидетельствованному αὐτῶν и сохраняет значение состояния в πόρρω ἐγενήθησαν. Более гладкий вариант дан в примечании, поскольку он частично истолковывает трудную конструкцию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Слова «постигли» и «стези» сохраняют поэтическую метафору, оставаясь понятными; трудная заключительная конструкция намеренно не сглажена.
