  terminology: «Путём Бога» допустимо и точно сохраняет генитив исходника, не подменяя образ «пути» законом или послушанием. «В мире» сохраняет значение εἰρήνη как состояния мира и благополучия; добавлять «покое» или «благополучии» не требуется.
