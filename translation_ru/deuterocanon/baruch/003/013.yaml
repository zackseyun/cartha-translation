  source_fidelity: 'Перевод верно передаёт условную конструкцию нереального прошлого: εἰ ἐπορεύθης соотнесено с «Если бы ты шёл», а κατῴκεις ἄν — с «жил бы». Метафора «путь Бога» сохранена, κατοικέω не перегружено неестественным «обитал бы», а ἐν εἰρήνῃ и τὸν αἰῶνα точно переданы как «в мире» и «вечно».'
