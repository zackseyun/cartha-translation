  text: Если бы ты шёл путём Бога, то жил бы в мире вечно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ὁδῷ τοῦ θεοῦ
  choice: путём Бога
  rationale: Сохраняется исходная метафора пути как образа образа жизни и поведения; творительный падеж естественно сочетается с русским «идти».
- source_word: εἰ ἐπορεύθης
  choice: если бы ты шёл
  rationale: Сочетание εἰ с аористом и ἄν в главной части выражает нереализованное условие в прошлом. В русском конструкция «если бы… то…» передаёт эту ирреальность, а несовершенный вид «шёл» сохраняет образ следования путём.
- source_word: κατῴκεις ἂν
  choice: то жил бы
  rationale: κατοικέω обозначает устойчивое пребывание или проживание. «Жил бы» звучит естественно по-русски и в сочетании «жил бы в мире» сохраняет значение продолжительного состояния.
- source_word: ἐν εἰρήνῃ
  choice: в мире
  rationale: Сохраняется существительное εἰρήνη и его смысл состояния мира, благополучия и покоя без сведения к наречию «мирно».
- source_word: τὸν αἰῶνα
  choice: вечно
  rationale: В данном обороте винительный времени имеет наречное значение неограниченной длительности; современное русское «вечно» передаёт его естественно и ясно.
theological_decisions:
- issue: Нереализованное условие, относящееся к прошлому
  choice: «Если бы ты шёл… то жил бы…»
  alternative: «Если ты пойдёшь… то будешь жить…»
  rationale: Греческая конструкция указывает не на обещание на будущее и не на общую максиму, а на сожаление о пути, которым адресат не пошёл.
- issue: Метафора «пути Бога»
  choice: Сохранить выражение «путём Бога»
  alternative: «исполнял закон Бога» или «повиновался Богу»
  rationale: Источник говорит шире о Божьем пути; замена на закон или повиновение неоправданно сузила бы образ и внесла отсутствующее в стихе уточнение.
- issue: Значение εἰρήνη
  choice: «в мире»
  alternative: «в покое»
  rationale: '«Мир» сохраняет традиционный богословский объём слова: не только внутренний покой, но и целостное состояние благополучия.'
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Формулировка проста и торжественна, без архаизмов; местоимение в единственном числе сохраняет обращение исходного текста.
