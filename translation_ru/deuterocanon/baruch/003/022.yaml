translation:
  language: ru
  text: О ней не слышали в Ханаане[a] и не видели её в Фемане;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь идёт о мудрости, упомянутой в окружающем контексте; в греческом тексте подлежащее этого стиха не названо прямо.
    reason: Уточнение контекстуального референта подразумеваемого подлежащего.
lexical_decisions:
- source_word: οὐδὲ … οὐδὲ
  choice: и не … и не
  rationale: Повторяющееся отрицательное соединение продолжает отрицание из предыдущего контекста. По-русски парная конструкция естественно передаёт накопительный параллелизм.
- source_word: ἠκούσθη
  choice: о ней не слышали
  rationale: Аорист пассива от ἀκούω. Буквальное «не была услышана» в данном контексте звучало бы так, будто речь идёт о звуке; оборот «о ней не слышали» естественно выражает неизвестность мудрости, не превращая глагол в более сильное «не знали».
- source_word: ἐν
  choice: в
  rationale: Предлог имеет здесь местное значение и вводит названия географических областей.
- source_word: Χαναὰν
  choice: Ханаане
  rationale: Устоявшаяся русская библейская форма названия Ханаан в предложном падеже.
- source_word: ὤφθη
  choice: не видели её
  rationale: Аорист пассива от ὁράω передан естественной русской неопределённо-личной конструкцией, сохраняющей зрительный образ и параллель с первым глаголом.
- source_word: Θαιμάν
  choice: Фемане
  rationale: «Феман» — традиционная русская библейская форма топонима Θαιμάν; предложный падеж обусловлен предлогом «в».
theological_decisions:
- issue: Подразумеваемое подлежащее при пассивных глаголах
  choice: Передать его местоимениями женского рода «ней» и «её», отсылающими к мудрости из ближайшего контекста.
  alternative: Прямо добавить существительное «мудрость» или сохранить буквальную пассивную конструкцию без названного референта.
  rationale: В греческом подлежащее не повторено, однако русский синтаксис требует более явного указания референта. Местоимения сохраняют контекстуальную связь с мудростью, не добавляя существительное в сам стих и не устраняя зависимость смысла от контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Неопределённо-личные формы естественнее буквального пассива и сохраняют параллелизм двух греческих глаголов. Точка с запятой оставлена как знак продолжения связного поэтического рассуждения.
