lexical_decisions:
- source_word: μέγας
  choice: велика
  rationale: Форма женского рода согласуется с Премудростью, названной в ближайшем контексте; слово сохраняет широкий смысл величия и не сужает его до размера или могущества.
- source_word: οὐκ ἔχει τελευτήν
  choice: не имеет конца
  rationale: Прямая и естественная передача греческого выражения; сохраняет образ конца, не заменяя его более отвлечённым понятием предела.
- source_word: ὑψηλός
  choice: высока
  rationale: Буквально передаёт пространственно-поэтическую характеристику без добавочного оттенка прославленности, который внесло бы слово «возвышенна».
- source_word: ἀμέτρητος
  choice: неизмерима
  rationale: Точно выражает невозможность измерить и сохраняет параллелизм с предыдущими краткими сказуемыми.
theological_decisions:
- issue: Подразумеваемое подлежащее из контекста
  choice: Подлежащее «Премудрость» не повторяется; род сказуемых указывает на него.
  alternative: Добавить в начале «Она».
  rationale: В греческом стих представляет собой краткое бессоюзное описание без выраженного подлежащего. Русский язык позволяет сохранить эту поэтическую компактность благодаря формам женского рода.
- issue: Значение величия
  choice: Сохранено общее «велика».
  alternative: Передать как «могущественна» или «огромна».
  rationale: Контекст допускает величие и протяжённость, но греческое μέγας само по себе не требует ни исключительно богословского смысла могущества, ни исключительно физического размера.
translation_notes:
  register: Современный литературный русский язык; краткая поэтическая строка с сохранением синтаксического параллелизма и подразумеваемого из контекста подлежащего.
