lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: Нет никого
  rationale: Естественно передаёт отрицательную экзистенциальную конструкцию и подчёркивает полное отсутствие такого человека.
- source_word: ὁ γινώσκων
  choice: кто знает
  rationale: Субстантивированное причастие настоящего времени прямо и естественно передаётся придаточным «кто знает».
- source_word: τὴν ὁδὸν αὐτῆς
  choice: путь к ней
  rationale: В контексте речь идёт о недоступности Премудрости и пути к месту её пребывания; такое прочтение сохраняет направительное значение образа и женский референт местоимения.
- source_word: οὐδὲ
  choice: никого
  rationale: Повтор отрицательной формы по-русски сохраняет параллелизм двух частей стиха естественнее буквального «и нет».
- source_word: ὁ ἐνθυμούμενος
  choice: кто размышляет
  rationale: Глагол обозначает внутреннее обдумывание или размышление; настоящее время сохраняет незавершённый характер действия.
- source_word: τὴν τρίβον αὐτῆς
  choice: о тропе к ней
  rationale: «Тропа» сохраняет поэтическое различие между τρίβος и ὁδός, а дополнение с «размышляет» требует предлога «о»; «к ней» отражает образ достижения Премудрости в контексте.
theological_decisions:
- issue: Референт и смысл αὐτῆς при ὁδός и τρίβος
  choice: «к ней», с отнесением к олицетворённой Премудрости
  alternative: «её путь / её тропа»
  rationale: Греческий родительный допускает притяжательное и направительное понимание. Ближайший контекст Вар 3:15 спрашивает о месте Премудрости и пути к нему, поэтому «путь к ней» хорошо передаёт связность рассуждения, не устраняя её олицетворение.
translation_notes:
  register: Современный литературный русский язык; лаконичный поэтический параллелизм сохранён. Формы «путь» и «тропа» передают лексическое варьирование греческого текста.
