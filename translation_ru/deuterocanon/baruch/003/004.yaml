base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/004.yaml
  text: Lord Almighty[a], God of Israel, please hear the prayer of the dead of Israel and of the sons who sinned before you, who did not listen to the voice of you, their God, and the evils have clung to us.
translation:
  language: ru
  text: Господи Вседержитель, Бог Израиля! Услышь же молитву умерших из Израиля и сыновей, грешащих пред Тобой, которые не послушали голоса Твоего, их Бога, и бедствия[a] прильнули к нам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «зло (или: беды) прильнуло к нам».'
    reason: Греческое τὰ κακά может обозначать как «зло», так и конкретные бедствия или несчастья; глагол сохраняет образ чего-то приставшего, прилипшего.
lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  choice: Господи Вседержитель
  rationale: Передаёт обращение и традиционный божественный титул, выражающий всеобъемлющее владычество Бога.
- source_word: ἄκουσον δὴ
  choice: Услышь же
  rationale: Императив сохранён, а частица δή передана частицей «же», подчёркивающей настоятельность мольбы.
- source_word: τῶν τεθνηκότων Ἰσραήλ
  choice: умерших из Израиля
  rationale: Сохраняет прямое значение перфектного причастия — «тех, кто умер», — и не заменяет необычный образ толкованием.
- source_word: υἱῶν τῶν ἁμαρτανόντων ἐναντίον σου
  choice: сыновей, согрешивших пред Тобой
  rationale: «Сыновей» точно передаёт υἱῶν; «пред Тобой» сохраняет пространственно-судебную широту ἐναντίον σου, не исключая смысла проступка против Бога.
- source_word: οἳ οὐκ ἤκουσαν τῆς φωνῆς σου
  choice: которые не послушали голоса Твоего
  rationale: «Не послушали» естественно передаёт одновременно слуховой образ и подразумеваемое неповиновение.
- source_word: θεοῦ αὐτῶν
  choice: их Бога
  rationale: Сохранено приложение к Богу, к чьему голосу они не прислушались; русская форма остаётся понятной в контексте прямого обращения.
- source_word: ἐκολλήθη ἡμῖν τὰ κακά
  choice: бедствия пристали к нам
  rationale: «Пристали» сохраняет яркую метафору κολλάω, а «бедствия» естественно передаёт контекстуальное значение τὰ κακά как постигших народ зол и несчастий.
theological_decisions:
- issue: Значение выражения «умершие из Израиля»
  choice: Сохранена буквальная отсылка к умершим израильтянам.
  alternative: Израиль как бы мёртвый либо духовно мёртвые израильтяне.
  rationale: Греческое выражение прямо обозначает умерших; возможный риторический или духовный подтекст не следует вносить в основной текст как установленное толкование.
- issue: Значение τὰ κακά
  choice: В основном тексте — «бедствия».
  alternative: «зло», «несчастья» или «бедствия» во множественном числе.
  rationale: В данном контексте речь идёт о постигших молящихся тяжёлых последствиях непослушания. Сноска сохраняет более буквальную лексическую широту греческого выражения.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного обращения. Формы «Господи», «Вседержитель», «пред Тобой» поддерживают библейский регистр без излишней архаизации; синтаксис по возможности сохраняет напряжённую структуру греческого текста.
