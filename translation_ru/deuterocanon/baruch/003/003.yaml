translation:
  language: ru
  text: ибо Ты восседаешь вовеки[a], а мы гибнем вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сидишь вовеки». В контексте это может подразумевать царственное восседание, хотя престол в греческом тексте прямо не упомянут.'
    reason: Лексическая альтернатива и сохранение возможной смысловой неоднозначности καθήμενος.
lexical_decisions:
- source_word: ὅτι
  choice: ибо
  rationale: Передаёт причинно-пояснительную связь с предшествующей мольбой и сохраняет достойный литературный регистр.
- source_word: σὺ
  choice: Ты
  rationale: Явное местоимение сохранено ради подчёркнутого противопоставления Богу местоимения «мы» во второй части.
- source_word: καθήμενος
  choice: восседаешь
  rationale: Передаёт буквальный образ пребывания сидя в естественной и достойной русской форме; применительно к Богу слово может подразумевать царственное пребывание, не называя престола прямо.
- source_word: τὸν αἰῶνα
  choice: вовеки
  rationale: Устойчиво передаёт винительный длительности со значением неограниченной продолжительности и позволяет сохранить параллельный повтор.
- source_word: ἡμεῖς
  choice: мы
  rationale: Явное местоимение сохранено для резкого контраста между неизменным пребыванием Бога и продолжающейся гибелью народа.
- source_word: ἀπολλύμενοι
  choice: гибнем
  rationale: Несовершенный вид передаёт продолжающийся процесс гибели, не уточняя без необходимости, идёт ли речь об уничтожении, разорении или угасании.
- source_word: τὸν αἰῶνα
  choice: вовеки
  rationale: Повторено так же, как в первой части, чтобы сохранить намеренный риторический параллелизм греческого текста.
theological_decisions:
- issue: Следует ли понимать καθήμενος как прямое указание на царское восседание Бога на престоле
  choice: В основном тексте дано «восседаешь», без добавления слова «на престоле»
  alternative: «сидишь» или «пребываешь»
  rationale: Контекст допускает образ царственного восседания, однако греческий текст прямо не упоминает престол. Выбранная формулировка сохраняет образ сидения, а примечание предупреждает о буквальном значении и возможной смысловой широте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Параллелизм «вовеки — вовеки» и противопоставление «Ты — мы» сохранены; форма «гибнем» подчёркивает продолжающийся процесс.
