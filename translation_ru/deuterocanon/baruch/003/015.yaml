base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/015.yaml
  text: Who found her place[a], and who entered into her treasuries?
translation:
  language: ru
  text: Кто нашёл её место, и кто вошёл в её сокровищницы[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровища». Греческое слово может обозначать и сами сокровища, и место их хранения; вариант «сокровищницы» лучше согласуется с глаголом «вошёл».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: кто
  rationale: Прямое вопросительное местоимение естественно передаёт риторический вопрос.
- source_word: εὗρεν
  choice: нашёл
  rationale: Аорист передан совершенным видом в прошедшем времени без добавления оттенка, которого нет в греческом тексте.
- source_word: τὸν τόπον αὐτῆς
  choice: её место
  rationale: «Место» сохраняет пространственный образ и не уточняет его как жилище; женское местоимение поддерживает олицетворение Премудрости в контексте.
- source_word: εἰσῆλθεν εἰς
  choice: вошёл в
  rationale: Передаёт направленное движение внутрь, выраженное глаголом и предлогом εἰς.
- source_word: τοὺς θησαυροὺς αὐτῆς
  choice: её сокровищницы
  rationale: θησαυρός может обозначать как сокровище, так и хранилище сокровищ; при глаголе «вошёл» пространственное значение «сокровищницы» наиболее естественно.
theological_decisions:
- issue: Олицетворение Премудрости
  choice: Сохранить женское местоимение «её»
  alternative: Передать Премудрость как безличное понятие
  rationale: Женские формы греческого текста и ближайший контекст представляют Премудрость олицетворённо; перевод сохраняет этот литературно-богословский образ, не развивая его сверх сказанного.
translation_notes:
  register: Современный литературный русский язык; краткая риторическая конструкция сохраняет параллелизм оригинала. Лексика dignified, но общепонятная.
