lexical_decisions:
- source_word: ἐξεῦρεν
  choice: открыл
  rationale: Передаёт значение обнаружения или постижения; в данном контексте звучит естественнее, чем буквальное «нашёл».
- source_word: πᾶσαν ὁδὸν ἐπιστήμης
  choice: всякий путь познания
  rationale: Сохраняет метафору пути, единственное число и широкий охват πᾶσαν; «познание» естественно обозначает знание как постигаемую область.
- source_word: ἔδωκεν αὐτήν
  choice: даровал его
  rationale: Местоимение относится к ὁδόν («путь»); мужской род обусловлен русской грамматикой. «Даровал» уместно для Божьего дара.
- source_word: τῷ παιδὶ αὐτοῦ
  choice: своему слуге
  rationale: παῖς допускает значения «слуга», «ребёнок» и «сын». В отношении Иакова к Богу контекстуально уместно «слуга», а неоднозначность отмечена в сноске.
- source_word: τῷ ἠγαπημένῳ ὑπʼ αὐτοῦ
  choice: своему возлюбленному
  rationale: Естественно передаёт субстантивированное страдательное причастие «тому, кого он возлюбил» и сохраняет параллелизм.
- source_word: Ἰακὼβ ... Ἰσραὴλ
  choice: Иаков ... Израиль
  rationale: Оба имени сохранены как отдельные параллельные обозначения согласно греческому тексту.
theological_decisions:
- issue: Значение παῖς применительно к Иакову
  choice: слуга
  alternative: ребёнок; сын
  rationale: «Слуга» соответствует контексту отношений избранного народа с Богом, но другие реальные значения слова не устранены и приведены в сноске.
- issue: Параллель Иаков — Израиль
  choice: сохранить оба имени
  alternative: объединить их в одно обозначение народа
  rationale: Греческий текст намеренно использует два имени в параллельных членах; их сохранение не устраняет литературное и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксический параллелизм оригинала сохранён; устаревшее «отрок» не используется.
