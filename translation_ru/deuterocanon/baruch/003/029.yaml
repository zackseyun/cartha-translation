lexical_decisions:
- source_word: τίς
  choice: Кто
  rationale: Прямо и естественно вводит риторический вопрос без добавочного усиления.
- source_word: ἀνέβη εἰς τὸν οὐρανόν
  choice: поднялся на небо
  rationale: Передаёт конкретное движение вверх; по-русски сочетание «на небо» естественнее буквального «в небо» в данном контексте.
- source_word: ἔλαβεν αὐτήν
  choice: взял её
  rationale: Сохраняет прямое значение глагола λαμβάνω и женский род местоимения, относящегося к олицетворённой Премудрости.
- source_word: κατεβίβασεν αὐτήν
  choice: спустил её
  rationale: 'Передаёт каузативный смысл: заставил или помог сойти вниз; краткая русская формулировка сохраняет параллелизм действий.'
- source_word: ἐκ τῶν νεφελῶν
  choice: с облаков
  rationale: Естественно передаёт исходную точку движения и сохраняет небесный образ греческого текста.
theological_decisions:
- issue: Род местоимения, относящегося к Премудрости
  choice: Передать αὐτήν как «её»
  alternative: Передать местоимением среднего рода или заменить существительным «Премудрость»
  rationale: Греческое местоимение женского рода соотносится с олицетворённой Премудростью в ближайшем контексте. Русское «её» сохраняет эту литературную и богословскую особенность, не добавляя толкования в основной текст.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос изложен кратко и торжественно, без архаизмов. Женское местоимение намеренно сохранено, а его референт пояснён в сноске.
