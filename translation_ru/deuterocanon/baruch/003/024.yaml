base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/024.yaml
  text: O Israel[a], how great is the house of God, and how vast is the place of his possession;
translation:
  language: ru
  text: О Израиль! Как велик дом Божий и как обширно место Его владения[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «место Его творения». Греческое κτῆσις может означать владение, собственность или приобретённое, а в некоторых контекстах — творение либо сотворённое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Ἰσραήλ
  choice: О Израиль!
  rationale: Сохраняет прямое торжественное обращение и звательный оттенок греческого Ὦ; отдельный восклицательный знак естественно передаёт его силу в современном русском.
- source_word: ὡς μέγας
  choice: как велик
  rationale: Передаёт восклицательное значение ὡς с прилагательным, не превращая фразу в нейтральное утверждение.
- source_word: ὁ οἶκος τοῦ θεοῦ
  choice: дом Божий
  rationale: Точная и естественная русская формулировка, сохраняющая смысловую широту слова «дом» и не сужающая его до храма, народа или домашнего сообщества.
- source_word: ἐπιμήκης
  choice: обширно
  rationale: В контексте пространственного описания передаёт протяжённость и огромный размер; буквальное «длинно» по-русски здесь звучало бы неестественно.
- source_word: ὁ τόπος
  choice: место
  rationale: Прямой эквивалент, сохраняющий конкретную и вместе с тем широкую пространственную образность оригинала.
- source_word: τῆς κτήσεως αὐτοῦ
  choice: Его владения
  rationale: κτῆσις может обозначать владение, собственность или приобретённое; родительная конструкция сохранена без излишнего уточнения того, каким образом это владение принадлежит Богу.
theological_decisions:
- issue: Значение κτήσεως применительно к Божьему «дому» и «месту»
  choice: Его владения
  alternative: Его творения
  rationale: Значение владения хорошо согласуется с пространственными образами дома и места и не вводит прямо отсутствующее в слове указание на акт сотворения. Однако значение творения или сотворённого мира лексически возможно, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Восклицательная конструкция отражает риторическую силу греческого текста; «дом Божий» сохраняет традиционное достоинство без конфессионального уточнения.
