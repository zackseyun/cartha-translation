lexical_decisions:
- source_word: τίς
  choice: кто
  rationale: Вводит риторический вопрос о недоступности мудрости для человеческих усилий.
- source_word: διέβη πέραν τῆς θαλάσσης
  choice: переправился за море
  rationale: Передаёт завершённое пересечение моря и пространственное значение πέραν — движение на другую сторону.
- source_word: εὗρεν αὐτήν
  choice: нашёл её
  rationale: Местоимение относится к мудрости; женский род в русском естественно сохраняет её олицетворение.
- source_word: οἴσει αὐτὴν
  choice: принесёт её
  rationale: Сохраняет прямое значение будущей формы φέρω и не добавляет отсутствующего в греческом тексте значения «назад».
- source_word: χρυσίου ἐκλεκτοῦ
  choice: в обмен на отборное золото
  rationale: Передаёт ценовое или обменное значение родительного оборота; «отборное» сохраняет смысл тщательно выбранного, превосходного золота.
theological_decisions:
- issue: Олицетворение мудрости в αὐτήν
  choice: Сохранить женское местоимение «её» в обоих случаях
  alternative: Передать безлично как «это» или повторить слово «мудрость»
  rationale: Контекст олицетворяет мудрость, а русский грамматический род позволяет сохранить этот образ естественно, не придавая ему дополнительных догматических значений.
translation_notes:
  register: Современный литературный русский язык с достоинством риторического вопроса. Синтаксис слегка приподнят, но понятен; добавление «назад» исключено как не выраженное в греческом тексте.
