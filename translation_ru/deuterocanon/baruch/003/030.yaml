  verdict: revise
  source_fidelity: 'Греческое τίς стоит один раз и охватывает три действия: «перешёл/переправился», «нашёл» и «принесёт». В черновике повторное «кто» перед «принесёт» создаёт две потенциально разные фигуры и ослабляет синтаксическое единство риторического вопроса. Исправленный вариант сохраняет временную последовательность аористов и будущего времени, пространственное «за море» для πέραν и женское местоимение αὐτήν.'
  naturalness: '«Кто переправился за море, нашёл её и принесёт её…?» — естественный для современного литературного русского риторический вопрос с намеренно приподнятым библейским регистром. Повтор дополнения «её» уместен: он соответствует повтору αὐτήν и ясно удерживает олицетворённую мудрость в фокусе.'
  terminology: «Отборное золото» адекватно передаёт χρυσίου ἐκλεκτοῦ. Оборот «за отборное золото» сохраняет лаконичную ценовую/обменную конструкцию оригинала, не уточняя спорное отношение точнее, чем позволяет греческий текст. Женский род «её» верно сохраняет олицетворение мудрости без догматического истолкования.
