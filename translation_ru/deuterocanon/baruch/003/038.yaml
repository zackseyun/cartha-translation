  source_fidelity: «После этого» точно передаёт μετὰ τοῦτο. «Он явился» — естественный идиоматический перевод ὤφθη, сохраняющий нераскрытый мужской субъект; «на земле» соответствует ἐπὶ τῆς γῆς, а «жил среди людей» верно передаёт длительное пребывание, выраженное συνανεστράφη ἐν τοῖς ἀνθρώποις.
