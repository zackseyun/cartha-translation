  language: en
  yaml_path: translation/deuterocanon/baruch/003/038.yaml
  text: After this he appeared on the earth[a], and lived among men.
translation:
  language: ru
  text: После этого он явился на земле[a] и жил среди людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был виден на земле и общался с людьми».'
    reason: Греческие ὤφθη и συνανεστράφη допускают соответственно более буквальные варианты «был виден» и «общался».
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: После этого
  rationale: Прямо передаёт явно выраженную временную последовательность и сохраняет структуру греческого оборота.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: В данном контексте речь идёт о земной сфере человеческой жизни; вариант «в стране» здесь неоправданно сужал бы смысл.
- source_word: ὤφθη
  choice: явился
  rationale: Аорист ὁράω в пассивной форме может означать как «был увиден», так и идиоматически «явился». Выбран естественный для современного русского языка вариант без добавочного объяснения характера явления.
- source_word: ἐν τοῖς ἀνθρώποις
  choice: среди людей
  rationale: ἀνθρώποις обозначает людей вообще; современное русское «среди людей» точно передаёт общий, а не гендерно ограниченный смысл.
- source_word: συνανεστράφη
  choice: жил среди
  rationale: Глагол описывает пребывание и общение в человеческом обществе. «Жил среди» естественно выражает продолжительное присутствие, не усиливая текст богословски.
theological_decisions:
- issue: Не названный в самом стихе субъект, соотносимый с предшествующим контекстом
  choice: Сохранить местоимение мужского рода «он» со строчной буквы
  alternative: Опустить местоимение; написать «Он» с прописной буквы; заменить субъект словом «мудрость»
  rationale: В греческом стихе субъект не назван прямо, но восстанавливается из предшествующего контекста. Мужской род русского местоимения сохраняет эту контекстную связь, а строчная буква не вносит отсутствующей в оригинале конфессиональной типографической интерпретации. Замена на «мудрость» или прямое христологическое уточнение преждевременно разрешила бы существующее богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная фраза. Сохранена сдержанность оригинала, без архаизмов и без конфессионально обусловленной капитализации местоимения.
