base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/014.yaml
  text: Learn where prudence is[a], where strength is, where understanding is, so that you may know at the same time where length of days and life are[b], where light for the eyes and peace are.
translation:
  language: ru
  text: Узнай, где благоразумие, где сила, где разумение, чтобы одновременно узнать, где долголетие[a] и жизнь, где свет очей[b] и мир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долгая жизнь». Греческое слово означает продолжительность жизни, долголетие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «свет глаз». Этот образ может подразумевать зрение, жизненную силу, радость или ясность.'
    reason: metaphorical_ambiguity
lexical_decisions:
- source_word: μάθε
  choice: Узнай
  rationale: Аористный императив μανθάνω призывает обрести знание. «Узнай» естественно вводит ряд косвенных вопросов с «где» и сохраняет побудительную силу.
- source_word: φρόνησις
  choice: благоразумие
  rationale: Слово обозначает практическую мудрость и здравую рассудительность. «Благоразумие» сохраняет отличие от σύνεσις.
- source_word: ἰσχύς
  choice: сила
  rationale: Прямой и нейтральный эквивалент со значением силы или могущества.
- source_word: σύνεσις
  choice: разумение
  rationale: Передаёт способность понимать и сохраняет смысловое отличие от практического благоразумия; слово уместно в возвышенной литературной речи.
- source_word: τοῦ γνῶναι
  choice: чтобы ... узнать
  rationale: Артикулярный инфинитив допускает целевое прочтение; придаточное цели естественно связывает приобретение знания с последующим познанием перечисленных благ.
- source_word: ἅμα
  choice: вместе с тем
  rationale: Сохраняет значение совместности и одновременного охвата перечисленных благ, не сводя наречие к простому «также».
- source_word: μακροβίωσις
  choice: долголетие
  rationale: Точно передаёт продолжительность жизни и позволяет сохранить отдельное καὶ ζωή — «и жизнь».
- source_word: ζωή
  choice: жизнь
  rationale: Обычный и контекстуально точный эквивалент.
- source_word: φῶς ὀφθαλμῶν
  choice: свет очей
  rationale: Сохраняет буквальную метафору и её библейское звучание, не ограничивая её возможный смысл только зрением, радостью или жизненной силой.
- source_word: εἰρήνη
  choice: мир
  rationale: Стандартный эквивалент, сохраняющий возможный широкий оттенок благополучия и цельности.
theological_decisions:
- issue: Различение терминов φρόνησις и σύνεσις
  choice: Переданы раздельно как «благоразумие» и «разумение».
  alternative: Свести оба термина к «мудрости» или «пониманию».
  rationale: Греческий текст намеренно перечисляет разные блага; их разграничение сохраняет структуру и богословское напряжение текста Премудрости.
- issue: Связь μακροβίωσις καὶ ζωή
  choice: «долголетие и жизнь»
  alternative: «долгая жизнь» или «долголетие и благополучие»
  rationale: В источнике два сочинённых существительных. Перевод не объединяет их и не вводит отсутствующего понятия благополучия.
- issue: Образ φῶς ὀφθαλμῶν
  choice: Сохранена метафора «свет очей».
  alternative: Истолковать как «радость», «жизненная сила» или «ясность».
  rationale: Метафора допускает несколько оттенков; буквальная передача не устраняет её продуктивную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «где» сохранён ради риторического строя оригинала; архаизирующее «очи» употреблено только внутри устойчивой и прозрачной метафоры.
