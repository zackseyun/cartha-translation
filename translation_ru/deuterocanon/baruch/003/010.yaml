revisions:
- from: Что случилось, Израиль?[a] Почему ты в земле врагов, состарился в чужой земле, осквернился вместе с мёртвыми?[b]
  to: Что с тобой, Израиль?[a] Почему ты на земле врагов? Ты состарился на чужой земле, осквернился мёртвыми,[b]
  rationale: Исправлены синтаксис и пунктуация в соответствии с двумя вопросами, за которыми в греческом следуют два утверждения. «Что с тобой?» сохраняет скорбную идиоматичность τί ἐστιν; «на земле врагов» не вводит отсутствующее притяжательное местоимение. Орудийная форма «мёртвыми» избегает ложного значения совместного действия и сохраняет допускаемую греческим неоднозначность. Запятая в конце оставлена, поскольку стих продолжается в следующем стихе.
  reviewer_model: gpt-5.6-terra
