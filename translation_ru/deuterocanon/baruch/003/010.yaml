  text: What is it, Israel? Why is it that you are in the land of enemies? You have grown old in a foreign land; you have become defiled with the dead,
translation:
  language: ru
  text: Что с тобой, Израиль?[a] Почему ты на земле врагов? Ты состарился на чужой земле, осквернился мёртвыми,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что случилось, Израиль?» Начальное выражение может звучать как скорбный вопрос или возглас.'
    reason: lexical_alternative
  - marker: b
    text: Слова «осквернился мёртвыми» могут указывать и на обрядовую нечистоту вследствие связи с умершими, и образно — на состояние изгнанников, словно оказавшихся среди мёртвых.
    reason: alternative_reading
lexical_decisions:
- source_word: τί ἐστιν
  choice: Что случилось
  rationale: Передаёт идиоматический скорбный вопрос естественным современным русским языком; более буквальное «Что это?» здесь звучало бы неясно.
- source_word: τί ὅτι
  choice: Почему
  rationale: В данном вопросительном обороте выражает причину и естественно передаётся словом «почему».
- source_word: ἐν γῇ τῶν ἐχθρῶν
  choice: в земле врагов
  rationale: Сохраняет отсутствие притяжательного местоимения в греческом тексте и образ пребывания на вражеской земле.
- source_word: ἐπαλαιώθης
  choice: состарился
  rationale: Передаёт наступившее состояние старости и сохраняет образ долгого изгнания.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: в чужой земле
  rationale: «Чужой» передаёт значение земли, принадлежащей другим и не являющейся родной для Израиля.
- source_word: συνεμιάνθης τοῖς νεκροῖς
  choice: осквернился вместе с мёртвыми
  rationale: Сохраняет идею осквернения через сопричастность или соприкосновение и не сводит выражение исключительно к обрядовой нечистоте либо к метафорической смерти.
theological_decisions:
- issue: Характер осквернения в συνεμιάνθης τοῖς νεκροῖς
  choice: Сохранить широкое выражение «осквернился вместе с мёртвыми»
  alternative: «осквернился от прикосновения к умершим» или «оказался среди мёртвых»
  rationale: Греческий текст допускает как отзвук обрядовой нечистоты от связи с умершими, так и образное уподобление изгнанников мёртвым; перевод не разрешает эту напряжённость однозначно.
