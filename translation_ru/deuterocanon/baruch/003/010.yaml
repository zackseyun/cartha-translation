  source_fidelity: Черновик в целом верно передаёт лексику, но объединяет два повествовательных совершенных глагола греческого текста (ἐπαλαιώθης, συνεμιάνθης) с предшествующими вопросами в один вопрос. В оригинале после двух вопросов следуют утверждения; это различие существенно для синтаксиса и риторики стиха.
  naturalness: «Что случилось, Израиль?» естественно, однако при сохранении структуры оригинала лучше отделить последующие утверждения. «Осквернился вместе с мёртвыми» по-русски может означать, что Израиль и мёртвые совместно совершили осквернение. «Осквернился мёртвыми» естественнее передаёт связь с мёртвыми как источник/сферу осквернения, не устраняя образную неоднозначность.
  terminology: «Израиль», «враги», «чужая земля» и «осквернился» уместны. Притяжательное местоимение к «врагам» не добавляется, поскольку его нет в греческом тексте. Формулировка об осквернении сохраняет как обрядовый, так и образный резонанс.
