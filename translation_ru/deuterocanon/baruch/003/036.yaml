  text: This is our God[a]; no other will be reckoned beside him.
translation:
  language: ru
  text: Вот наш Бог; никто другой не будет признан наряду с Ним[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никто другой не будет считаться равным Ему».'
    reason: Передаёт возможное сравнительное осмысление πρὸς αὐτόν и пассив λογισθήσεται; основной текст сохраняет более общий смысл «быть признанным наряду с».
lexical_decisions:
- source_word: οὗτος
  choice: Вот
  rationale: Указательное местоимение, употреблённое при именном сказуемом, естественно передаётся русской представительной конструкцией «Вот наш Бог», которая указывает на ранее названного и не утяжеляет фразу буквальным «Этот».
- source_word: ὁ θεὸς ἡμῶν
  choice: наш Бог
  rationale: Прямая и естественная передача греческого сочетания с притяжательным местоимением; сохраняет его общинный и заветный оттенок.
- source_word: οὐ λογισθήσεται
  choice: никто другой не сравнится
  rationale: Будущий пассив λογίζομαι буквально означает «не будет сочтён / принят в расчёт». В сочетании с πρὸς αὐτόν русское «не сравнится» естественно передаёт мысль о том, что никого нельзя поставить рядом с Богом для сравнения, хотя грамматический пассив раскрывается динамически.
- source_word: ἕτερος
  choice: никто другой
  rationale: Субстантивированное «другой» выражает исключительность; добавление «никто» требуется нормальным русским синтаксисом при отрицании.
- source_word: πρὸς αὐτόν
  choice: с Ним
  rationale: В данном обороте πρός обозначает отношение или сравнение, а не направление движения. Творительная конструкция с «с» естественна при русском глаголе «сравниться».
theological_decisions:
- issue: Исключительное утверждение об уникальности Бога в сравнительной конструкции
  choice: никто другой не сравнится с Ним
  alternative: никто другой не будет поставлен в один ряд с Ним
  rationale: Перевод сохраняет утверждение о несравненности Бога, не разворачивая его в более широкую догматическую формулу вроде «нет иного Бога». В сноске отмечена более формальная передача пассивно-сравнительной конструкции.
translation_notes:
  register: Современный литературный русский язык; краткая, возвышенная и понятная формулировка. «Вот наш Бог» звучит естественнее буквального «Этот — Бог наш», а «не сравнится» избегает тяжеловесного русского пассива. Местоимение «Ним» написано с прописной буквы как допустимый знак благоговейного библейского регистра.
