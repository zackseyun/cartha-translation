  text: Где правители народов и те, кто властвует над зверями[a] на земле?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дикими животными». Греческое слово θηρίον может обозначать как зверя вообще, так и, более узко, дикое животное.'
