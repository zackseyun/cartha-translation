lexical_decisions:
- source_word: ποῦ
  choice: Где
  rationale: Прямо передаёт вопрос о местонахождении или нынешней участи названных лиц, не добавляя отсутствующего в греческом тексте усиления «теперь».
- source_word: οἱ ἄρχοντες τῶν ἐθνῶν
  choice: правители народов
  rationale: «Правители» сохраняет политический смысл ἄρχοντες, а «народов» естественно передаёт ἐθνῶν без более узкого религиозного значения «язычников».
- source_word: οἱ κυριεύοντες
  choice: те, кто властвует над
  rationale: Передаёт активное осуществление господства и звучит естественно в современном литературном русском языке.
- source_word: τῶν θηρίων
  choice: зверями
  rationale: «Звери» сохраняет широкий и несколько возвышенный смысл греческого слова; возможное более узкое понимание «дикие животные» вынесено в примечание.
- source_word: τῶν ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Сохраняет ясное локативное значение греческого оборота и относится к зверям.
