base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/028.yaml
  text: And they perished for lack of understanding[a]; they perished because of their own lack of counsel.
translation:
  language: ru
  text: И погибли они, потому что им недоставало благоразумия[a]; погибли из-за собственной нерассудительности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понимания»; здесь имеется в виду практическое разумение, благоразумие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλοντο
  choice: погибли
  rationale: Глагол передаёт гибель или окончательную утрату, не уточняя, была ли она насильственной; повтор сохранён в обеих частях стиха.
- source_word: παρὰ τὸ μὴ ἔχειν
  choice: потому что им недоставало
  rationale: Конструкция выражает причину. Такой перевод естественен по-русски и сохраняет смысл отсутствия названного качества.
- source_word: φρόνησιν
  choice: благоразумия
  rationale: Слово обозначает практическое разумение и рассудительность; «благоразумие» сохраняет его интеллектуально-нравственный оттенок.
- source_word: διὰ τὴν ἀβουλίαν
  choice: из-за собственной нерассудительности
  rationale: ἀβουλία указывает на отсутствие здравого обдумывания или способности принять разумное решение. «Нерассудительность» передаёт этот смысл без сведения его к общей глупости.
- source_word: αὐτῶν
  choice: собственной
  rationale: Передаёт явно выраженную принадлежность и естественно подчёркивает, что причина заключалась в них самих, не добавляя иной причины.
theological_decisions:
- issue: Причина гибели
  choice: Гибель связывается с недостатком практического разумения и рассудительности.
  alternative: Можно было бы истолковать оба выражения обобщённо как «глупость» или «безумие».
  rationale: Греческий текст использует лексику разумения и обдумывания, не формулируя более широкого богословского объяснения; перевод сохраняет эту сдержанность и различие между двумя близкими понятиями.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формулировкой. Сохранены причинные связи и риторическое повторение «погибли».
