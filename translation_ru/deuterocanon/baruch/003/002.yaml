lexical_decisions:
- source_word: ἄκουσον
  choice: Услышь
  rationale: Повелительная форма передаёт прямое молитвенное обращение с просьбой услышать.
- source_word: ἐλέησον
  choice: помилуй
  rationale: Традиционное и понятное в современном литературном русском языке выражение просьбы о милости.
- source_word: ὅτι
  choice: потому что
  rationale: В данном контексте союз естественно вводит основание просьбы и сохраняет причинную связь.
- source_word: ἡμάρτομεν
  choice: мы согрешили
  rationale: Точно передаёт аорист первого лица множественного числа и открытое признание совершённого греха.
- source_word: ἐναντίον σου
  choice: перед Тобой
  rationale: Естественное русское библейское выражение для греха, совершённого в Божьем присутствии и против Его воли; не усиливает значение до однозначного «против Тебя».
theological_decisions:
- issue: Характер связи между признанием греха и просьбой о милости
  choice: потому что
  alternative: ибо / ведь
  rationale: Сохраняется причинная функция ὅτι без добавления богословского объяснения механизма прощения.
- issue: Передача ἐναντίον в исповедании греха
  choice: перед Тобой
  alternative: против Тебя
  rationale: «Перед Тобой» сохраняет судебно-реляционный оттенок формулы и не устраняет возможный смысл направленности греха против Бога.
translation_notes:
  register: Краткая, торжественная молитвенная речь на современном литературном русском языке. Сохранены прямое обращение и параллельные повелительные формы. Местоимение «Тобой» написано с прописной буквы как уважительное обращение к Богу.
