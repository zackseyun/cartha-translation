base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/032.yaml
  text: But he who knows all things knows her[a]; he found her out by his understanding. He who prepared the earth for everlasting time filled it with four-footed animals[c][b];
translation:
  language: ru
  text: Но Тот, кто знает всё, знает её; Своим разумением Он нашёл её[a]. Тот, кто устроил землю на все времена, наполнил её четвероногими животными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обрёл её». Греческий глагол означает «найти», «обнаружить», «открыть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: Тот, кто знает всё
  rationale: Субстантивированное причастие обозначает Бога как Того, кому известно всё; по-русски естественно передаётся придаточной конструкцией.
- source_word: γινώσκει αὐτήν
  choice: знает её
  rationale: Местоимение относится к мудрости из контекста. Русское «её» сохраняет женский род и допускает олицетворение мудрости.
- source_word: ἐξεῦρεν αὐτὴν
  choice: постиг её
  rationale: Глагол означает найти, открыть, установить или постичь. В данном контексте «постиг» естественно выражает совершенное знание мудрости, не создавая впечатления, будто она была потеряна.
- source_word: τῇ συνέσει αὐτοῦ
  choice: Своим разумом
  rationale: Творительный падеж передаёт инструментальное значение дательного; «разум» точно и естественно передаёт σύνεσις в контексте Божьего познания.
- source_word: ὁ κατασκευάσας τὴν γῆν
  choice: Тот, кто устроил землю
  rationale: «Устроил» сохраняет широкий смысл κατασκευάζω — приготовить, обустроить, утвердить — и не подменяет его более прямым глаголом «сотворить».
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: на все времена
  rationale: Естественная русская формулировка передаёт длительность и непреходящий характер выражения, в котором соединены αἰών и χρόνος.
- source_word: κτηνῶν τετραπόδων
  choice: четвероногими животными
  rationale: Ясный современный эквивалент, сохраняющий как общее обозначение животных, так и уточнение «четвероногие».
theological_decisions:
- issue: Олицетворение мудрости
  choice: Сохранить женское местоимение «её»
  alternative: Заменить местоимение словом «мудрость» или передать безлично
  rationale: Греческое местоимение женского рода отсылает к мудрости в ближайшем контексте. Русский язык позволяет естественно сохранить эту связь и литературное олицетворение, не превращая мудрость в отдельное божество.
- issue: Характер Божьего действия в κατασκευάσας
  choice: «устроил землю»
  alternative: «сотворил землю» или «утвердил землю»
  rationale: Выбранное слово не усиливает формулировку до прямого утверждения о сотворении и сохраняет лексическую широту исходного глагола.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Прописные буквы в «Тот», «Он» и «Своим» обозначают Бога согласно устойчивой русской религиозной письменной традиции. Синтаксический параллелизм двух предложений сохраняет строй греческого текста.
