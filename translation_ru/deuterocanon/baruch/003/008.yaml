base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/008.yaml
  text: Behold[a], today we are in our exile, where you scattered us, for reproach and for a curse and for payment, according to all the wrongdoings of our fathers, who turned away from the Lord our God.
translation:
  language: ru
  text: Вот, сегодня мы в изгнании, куда Ты рассеял нас, — на поругание, проклятие и взыскание[a] за все беззакония наших отцов, которые отступили от Господа, Бога нашего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возмездие» либо «долговую ответственность». Греческое слово означает возникший долг или обязательство уплатить, здесь — в контексте Божьего суда.'
    reason: Лексическая неоднозначность ὄφλησιν.
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Передаёт призыв обратить внимание и подчёркивает нынешнее положение говорящих, оставаясь естественным для современного русского языка.
- source_word: ἀποικίᾳ
  choice: в изгнании
  rationale: В данном контексте слово обозначает положение и место рассеянных среди чужих народов; «изгнание» передаёт исторический и заветный смысл лучше, чем буквальное «колония».
- source_word: διέσπειρας
  choice: рассеял
  rationale: Сохраняет образ распределения народа среди других земель и народов.
- source_word: ὀνειδισμὸν
  choice: поругание
  rationale: Передаёт публичный позор и положение объекта насмешек, сохраняя достоинство библейского регистра.
- source_word: ἀρὰν
  choice: проклятие
  rationale: Прямое и контекстуально точное соответствие греческому существительному.
- source_word: ὄφλησιν
  choice: взыскание
  rationale: Слово выражает наступившую долговую ответственность или обязательство уплатить, а в контексте суда также имеет оттенок кары. «Взыскание» удерживает обе стороны значения; варианты пояснены в сноске.
- source_word: κατὰ πάσας τὰς ἀδικίας
  choice: за все беззакония
  rationale: «За» естественно выражает судебно-причинную связь, а «беззакония» передаёт нравственные проступки, не сужая их до гражданской несправедливости.
- source_word: ἀπέστησαν
  choice: отступили
  rationale: Точно передаёт удаление и отпадение от Господа, не усиливая глагол до явно выраженного «восстали».
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: Господа, Бога нашего
  rationale: Естественная русская передача заветного наименования с сохранением обоих существительных.
theological_decisions:
- issue: Передача κύριος применительно к Богу Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» является естественным и устойчивым соответствием κύριος в заветном контексте, не вводя дополнительного толкования.
- issue: Смысл ὄφλησιν в контексте Божьего суда
  choice: взыскание
  alternative: возмездие; долговая ответственность
  rationale: 'Греческое слово шире простого «наказания»: оно указывает на возникший долг или обязательство и допускает карательный оттенок. Основной текст сохраняет эту напряжённость, а сноска раскрывает диапазон значения.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис в целом следует греческому тексту, но тире проясняет, что последующие существительные описывают результат рассеяния. Местоимение «Ты» написано с прописной буквы как обращение к Богу.
