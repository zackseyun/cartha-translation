base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/001.yaml
  text: Take off[a], O Jerusalem, the garment of your mourning and affliction[b], and put on forever the splendor of the glory from God.
translation:
  language: ru
  text: Сними, Иерусалим, одеяние траура и страдания[a] и навеки облекись в великолепие[b] славы, исходящей от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедствия»; возможно также: «угнетения» или «унижения».'
    reason: Греческое κάκωσις может обозначать страдание, бедственное состояние, угнетение или унижение.
  - marker: b
    text: 'Или: «красоту».'
    reason: Греческое εὐπρέπεια сочетает значения красоты, достоинства и великолепия.
lexical_decisions:
- source_word: Ἔκδυσαι
  choice: Сними
  rationale: Аористный медиальный императив ἐκδύω обозначает снятие одежды. «Сними» естественно передаёт повеление и сохраняет образ переодевания.
- source_word: στολὴν
  choice: одеяние
  rationale: στολή может обозначать одежду или облачение, нередко торжественное. «Одеяние» сохраняет единственное число и возвышенный поэтический образ.
- source_word: πένθους
  choice: плача
  rationale: πένθος означает скорбь и траур, в том числе их внешнее выражение. «Плач» естественно сочетается с метафорическим одеянием и передаёт публичную скорбь Иерусалима.
- source_word: κακώσεώς
  choice: бедствия
  rationale: κάκωσις охватывает страдание, угнетение, унижение и тяжёлое положение. «Бедствие» сохраняет широту значения, не уточняя его причину.
- source_word: ἔνδυσαι
  choice: облекись
  rationale: Медиальный императив ἐνδύω непосредственно противопоставлен ἔκδυσαι. «Облекись» сохраняет одежную метафору и соответствует возвышенному, но понятному регистру.
- source_word: εὐπρέπειαν
  choice: великолепие
  rationale: εὐπρέπεια выражает красоту, достоинство и величественную привлекательность. «Великолепие» уместно передаёт торжественный образ восстановления.
- source_word: δόξης
  choice: славы
  rationale: «Слава» является прямым и устойчивым библейским соответствием δόξα и сохраняет богословскую насыщенность термина.
- source_word: παρὰ τοῦ θεοῦ
  choice: исходящей от Бога
  rationale: παρά с родительным указывает на источник. Оборот «исходящей от Бога» ясно выражает происхождение славы, не заменяя его отношением принадлежности.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Устойчивое выражение обозначает непреходящую длительность; «навеки» кратко и естественно передаёт обещание постоянного восстановления.
theological_decisions:
- issue: Олицетворение Иерусалима
  choice: Сохранено прямое обращение к Иерусалиму и повеление сменить одеяние скорби на великолепие славы.
  alternative: Передать Иерусалим лишь как совокупность жителей, ослабив олицетворение и образ одежды.
  rationale: Греческий текст прямо обращается к Ἰερουσαλήμ и строится на парных повелениях «сними» и «облекись». Олицетворение существенно для пророческого образа восстановленного города и народа.
- issue: Источник славы
  choice: «славы, исходящей от Бога»
  alternative: «славы Божьей» или «славы Бога»
  rationale: παρὰ τοῦ θεοῦ прежде всего указывает на источник или происхождение. Выбранный вариант не превращает эту конструкцию в обычный притяжательный оборот и не уточняет способ дарования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Парные глаголы «сними» и «облекись» сохраняют композицию и метафору исходного текста; формулировка избегает как разговорности, так и избыточной церковнославянизации.
