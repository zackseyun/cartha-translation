base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/009.yaml
  text: For God will lead Israel with gladness[a], by the light of his glory, with mercy and righteousness from him.
translation:
  language: ru
  text: Ибо Бог поведёт Израиль с радостью, при свете Своей славы, с милостью и праведностью[a], исходящей от Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливостью».'
    reason: Лексема δικαιοσύνη может обозначать как праведность в широком библейском смысле, так и справедливость.
lexical_decisions:
- source_word: ἡγήσεται
  choice: поведёт
  rationale: Будущая форма ἡγέομαι здесь означает, что Бог будет вести Израиль; «поведёт» естественно передаёт образ исхода и восстановления, не добавляя неуказанной цели пути.
- source_word: μετʼ εὐφροσύνης
  choice: с радостью
  rationale: εὐφροσύνη обозначает радость, ликование; «с радостью» сохраняет приподнятый тон и не уточняет без достаточных оснований, кому именно принадлежит эта радость.
- source_word: τῷ φωτὶ τῆς δόξης αὐτοῦ
  choice: при свете Своей славы
  rationale: Дательный падеж допускает инструментальный или сопроводительный оттенок. «При свете Своей славы» звучит естественно по-русски и сохраняет образ Божьей славы как света, сопровождающего и направляющего Израиль.
- source_word: ἐλεημοσύνῃ
  choice: милостью
  rationale: Хотя слово может означать милостыню, в сочетании с δικαιοσύνη и применительно к Богу здесь имеется в виду Его милость или милосердное действие.
- source_word: δικαιοσύνῃ
  choice: праведностью
  rationale: «Праведность» сохраняет широкий библейский смысл δικαιοσύνη как качества и действия Бога; более узкое «справедливость» отмечено как допустимый вариант.
- source_word: τῇ παρʼ αὐτοῦ
  choice: исходящей от Него
  rationale: Оборот прямо определяет стоящее перед ним слово «праведность» и указывает на Бога как её источник. Женский род единственного числа в русском сохраняет эту ближайшую грамматическую связь.
theological_decisions:
- issue: Передача δικαιοσύνη в описании Божьего сопровождения Израиля
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» лучше сохраняет полноту библейского понятия, тогда как «справедливость» подчёркивает преимущественно судебно-этический аспект. Контекст допускает оба оттенка, поэтому альтернатива вынесена в примечание.
- issue: К чему относится τῇ παρʼ αὐτοῦ («от Него»)
  choice: непосредственно к праведности
  alternative: к милости и праведности вместе
  rationale: Артикль и причастный по смыслу оборот стоят в женском роде единственного числа и непосредственно согласуются с δικαιοσύνῃ. Вместе с тем по смыслу обе сопровождающие Израиль реальности происходят от Бога; текст не следует расширять так, чтобы устранить эту синтаксическую особенность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Своей» и «Него» оформлено с прописной буквы по принятой русской традиции при указании на Бога. Синтаксис сохраняет последовательность греческих обстоятельственных оборотов и не снимает неоднозначность того, чья именно радость подразумевается.
