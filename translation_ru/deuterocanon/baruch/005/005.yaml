base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/005.yaml
  text: Rise up[a], Jerusalem, and stand on the height, and look toward the east, and see your children gathered from the setting of the sun to its rising, at the word of the Holy One[b], rejoicing in the remembrance of God.
translation:
  language: ru
  text: Поднимись, Иерусалим, встань на возвышенность, посмотри на восток и увидь своих детей, собранных от заката солнца до его восхода по слову Святого[a] и радующихся памяти Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словом Святого». Дательный оборот τῷ ῥήματι может указывать на средство, которым дети были собраны.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тому, что Бог помнит о них» или «памяти о Боге». Краткое греческое выражение может означать как то, что Бог помнит о Своём народе, так и то, что народ помнит Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνάστηθι
  choice: Поднимись
  rationale: Аористный императив передаёт призыв Иерусалиму подняться; это естественно по-русски и позволяет избежать повтора «встань… стань».
- source_word: στῆθι ἐπὶ τοῦ ὑψηλοῦ
  choice: стань на высоте
  rationale: Сохраняется единственное число и общий смысл возвышенного места без добавления отсутствующего в греческом слова «гора».
- source_word: περίβλεψαι πρὸς ἀνατολάς
  choice: посмотри на восток
  rationale: В сочетании с направительным оборотом глагол естественно передаётся как «посмотри»; множественное ἀνατολάς имеет обычное географическое значение направления на восток.
- source_word: συνηγμένα τὰ τέκνα
  choice: своих детей, собранных
  rationale: Перфектное страдательное причастие обозначает уже достигнутое состояние; τέκνα не ограничивает речь сыновьями.
- source_word: ἀπὸ ἡλίου δυσμῶν ἕως ἀνατολῶν
  choice: от заката солнца до его восхода
  rationale: Сохранён образ движения солнца, не сведённый к нейтральному «с запада до востока».
- source_word: τῷ ῥήματι
  choice: по слову
  rationale: Дательный падеж допускает смысл основания или средства; «по слову» естественно указывает на действенное повеление Святого, не заменяя ῥῆμα словом «приказ».
- source_word: τοῦ ἁγίου
  choice: Святого
  rationale: Субстантивированное прилагательное передано как почтительный титул без добавления слова «Бог», которого здесь в греческом нет.
- source_word: χαίροντες
  choice: радующихся
  rationale: Причастная форма сохраняет связь с собранными детьми и одновременность их радости.
- source_word: τῇ τοῦ θεοῦ μνείᾳ
  choice: тому, что Бог помнит о них
  rationale: В современном русском это естественное выражение вероятного субъектного значения родительного τοῦ θεοῦ. Поскольку греческая конструкция допускает также память людей о Боге, эта возможность сохранена в примечании.
theological_decisions:
- issue: Значение τῇ τοῦ θεοῦ μνείᾳ
  choice: «тому, что Бог помнит о них»
  alternative: «памяти о Боге», то есть тому, что они помнят Бога
  rationale: Греческий родительный допускает как Божье памятование о народе, так и памятование народа о Боге. По-русски буквальная двусмысленная конструкция была бы неестественной, поэтому основной текст передаёт один смысл, а другой явно сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Образ заката и восхода сохранён; синтаксис слегка упрощён ради естественности. Все богословски значимые альтернативы отмечены без конфессионального уточнения.
