base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/007.yaml
  text: For God has ordered that every high mountain and the everlasting hills be made low[a], and the valleys be filled for the leveling of the ground, so that Israel may walk safely in the glory of God.
translation:
  language: ru
  text: Ведь Бог повелел, чтобы всякая высокая гора и вековечные холмы были понижены, а ущелья заполнены, чтобы земля стала ровной, чтобы Израиль мог безопасно идти во славе Божьей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря славе Божьей»; «силой славы Божьей». Греческий дательный падеж может указывать как на сферу или сопровождение, так и на средство действия.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνέταξεν
  choice: повелел
  rationale: Передаёт властное распоряжение Бога и естественно вводит придаточное предложение с «чтобы».
- source_word: ταπεινοῦσθαι
  choice: стали ниже
  rationale: В отношении гор обозначает физическое понижение; такой перевод ясен и не привносит нравственного смысла «смирились».
- source_word: πᾶν ὄρος ὑψηλὸν
  choice: всякая высокая гора
  rationale: Сохраняет распределительное значение πᾶν и прямое значение ὑψηλόν.
- source_word: θῖνας αἰωνίους
  choice: вековечные холмы
  rationale: В данном топографическом ряду θῖνας обозначает возвышенности, а «вековечные» передаёт образ их древней устойчивости и возвышенный стиль αἰωνίους.
- source_word: φάραγγας
  choice: ущелья
  rationale: Ближе к обычному значению греческого слова — овраги, теснины или ущелья — и хорошо сочетается с их заполнением.
- source_word: πληροῦσθαι
  choice: были заполнены
  rationale: Сохраняет пассивное значение инфинитива и образ заполнения низин.
- source_word: εἰς ὁμαλισμὸν τῆς γῆς
  choice: и земля выровнена
  rationale: Естественно выражает предполагаемый результат понижения возвышенностей и заполнения ущелий — ровную поверхность земли.
- source_word: ἵνα βαδίσῃ
  choice: чтобы ... мог ... идти
  rationale: Сохраняет целевое значение ἵνα и образ народа, идущего по приготовленному пути.
- source_word: ἀσφαλῶς
  choice: безопасно
  rationale: Прямо передаёт отсутствие опасности и надёжность пути.
- source_word: τῇ τοῦ θεοῦ δόξῃ
  choice: во славе Божьей
  rationale: Передаёт возможное значение сферы или сопровождения, не сводя дательный падеж исключительно к средству действия.
theological_decisions:
- issue: Значение τῇ τοῦ θεοῦ δόξῃ применительно к безопасному шествию Израиля
  choice: во славе Божьей
  alternative: благодаря славе Божьей; силой славы Божьей
  rationale: Греческий дательный допускает понимание славы Бога как сферы или сопровождения, а также как средства, обеспечивающего безопасный путь. Основной текст сохраняет более широкое пространственно-ассоциативное прочтение, а инструментальное отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Синтаксис сделан плавным и понятным; «вековечные» сохраняет поэтическую торжественность исходного текста, а «во славе Божьей» — его намеренную смысловую открытость.
