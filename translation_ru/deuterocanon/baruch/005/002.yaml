base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/002.yaml
  text: Put on the robe of the righteousness that comes from God[d][c][b][a], and place on your head the turban of the glory of the Eternal.
translation:
  language: ru
  text: Облекись в мантию праведности, исходящей от Бога[a], и возложи себе на голову тюрбан славы Вечного[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мантию справедливости, исходящей от Бога». Слово, переведённое как «мантия», обозначает широкое верхнее одеяние, а «праведность» может также означать «справедливость».'
    reason: Лексические варианты для διπλοΐδα и δικαιοσύνη; выражение παρὰ τοῦ θεοῦ указывает на источник.
  - marker: b
    text: 'Или: «головной убор вечной славы». Греческое выражение, вероятнее всего, означает «слава Вечного», то есть Бога.'
    reason: Сохраняет менее вероятное альтернативное понимание родительной конструкции и вариант значения μίτρα.
lexical_decisions:
- source_word: περιβαλοῦ
  choice: облекись
  rationale: Возвратное повелительное наклонение естественно передаёт действие надевания на себя и сохраняет возвышенный поэтический образ.
- source_word: διπλοΐδα
  choice: мантия
  rationale: Слово обозначает верхнее широкое одеяние; «мантия» сохраняет достоинство и церемониальность образа, не навязывая буквального «двойного одеяния».
- source_word: τῆς παρὰ τοῦ θεοῦ δικαιοσύνης
  choice: праведности, дарованной Богом
  rationale: δικαιοσύνη передано как «праведность», а παρὰ τοῦ θεοῦ — как указание на источник. «Дарованной» естественно выражает происхождение от Бога, хотя греческий текст буквально не употребляет глагол «даровать».
- source_word: ἐπίθου
  choice: возложи
  rationale: Сохраняет прямое повеление положить головной убор на голову и соответствует торжественному регистру.
- source_word: μίτραν
  choice: тюрбан
  rationale: Греческое слово обозначает повязанный головной убор; «тюрбан» понятнее современному читателю, чем церковно окрашенная «митра».
- source_word: τῆς δόξης τοῦ αἰωνίου
  choice: славы Вечного
  rationale: Родительная конструкция наиболее естественно понимается как «слава Вечного», где αἰώνιος употреблено субстантивированно как обозначение Бога.
theological_decisions:
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В образе одеяния «праведность» лучше сохраняет нравственно-заветный смысл; возможное значение «справедливость» отмечено в примечании.
- issue: Субстантивированное τοῦ αἰωνίου
  choice: Вечного
  alternative: вечной славы
  rationale: Синтаксис вероятнее указывает на славу, принадлежащую Вечному, то есть Богу; альтернативное согласование αἰωνίου с δόξης менее вероятно и отмечено в примечании.
translation_notes:
  register: Современный литературный русский с торжественной поэтической окраской. «Облекись» и «возложи» поддерживают достоинство пророческого обращения; редкие слова используются лишь там, где они ясны из контекста.
