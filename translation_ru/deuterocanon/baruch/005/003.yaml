translation:
  language: ru
  text: Ибо Бог покажет всей поднебесной твоё великолепие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сияние», «слава» или «блеск».'
    reason: Слово λαμπρότητα может обозначать видимую яркость, великолепие или почётную славу.
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Ибо
  rationale: Передаёт пояснительно-обосновывающую связь γάρ с предшествующим контекстом и сохраняет достоинство библейского стиля.
- source_word: θεὸς
  choice: Бог
  rationale: Прямое обозначение Бога Израиля; смысловой неоднозначности здесь нет.
- source_word: δείξει
  choice: покажет
  rationale: Будущее время действительного залога от δείκνυμι; перевод прямо выражает действие Бога, который сделает великолепие Иерусалима видимым.
- source_word: τῇ ὑπʼ οὐρανὸν πάσῃ
  choice: всему, что под небом
  rationale: Форма женского рода согласуется с подразумеваемым словом вроде «земля» или «обитаемая земля». Формулировка сохраняет образ и всеобщий охват оригинала, не добавляя отсутствующего существительного.
- source_word: τὴν σὴν
  choice: твоё
  rationale: Сохраняет обращение во втором лице единственного числа к Иерусалиму/Сиону.
- source_word: λαμπρότητα
  choice: великолепие
  rationale: Передаёт одновременно видимый блеск, красоту и возвышенное достоинство; не смешивает λαμπρότης с более специальным богословским словом δόξα.
theological_decisions:
- issue: Передача восстановленного достоинства Иерусалима в слове λαμπρότητα
  choice: великолепие
  alternative: сияние; слава; блеск
  rationale: «Великолепие» сохраняет сочетание светового и почётного оттенков, не усиливая богословскую нагрузку посредством слова «слава».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к греческому, но остаётся естественным и понятным.
