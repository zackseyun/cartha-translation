lexical_decisions:
- source_word: ἐσκίασαν
  choice: осеняли
  rationale: Передаёт значение «давали тень, покрывали тенью» в возвышенном, но понятном литературном регистре; форма множественного числа соответствует составному подлежащему.
- source_word: οἱ δρυμοί
  choice: леса
  rationale: В контексте слово обозначает лесистые места или рощи; «леса» естественно и согласуется с параллельным английским консультационным текстом.
- source_word: πᾶν ξύλον εὐωδίας
  choice: всякое благоуханное дерево
  rationale: Сохраняет греческую конструкцию и образ деревьев, источающих приятный аромат.
- source_word: τῷ Ἰσραήλ
  choice: Израиль
  rationale: Дательный обозначает того, кому предоставляется тень; по-русски управление глагола «осенять» требует винительного падежа.
- source_word: προστάγματι τοῦ θεοῦ
  choice: по повелению Бога
  rationale: 'Естественно передаёт дательный причины или основания: действие совершается согласно Божьему повелению.'
theological_decisions:
- issue: Характер действия Божьего повеления
  choice: по повелению Бога
  alternative: повелением Бога
  rationale: Формулировка сохраняет прямую причинно-властную связь с Божьим повелением, не добавляя представления о способе действия сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Союзная конструкция «И леса, и...» естественно передаёт καὶ... καὶ и подчёркивает совокупность образов.
