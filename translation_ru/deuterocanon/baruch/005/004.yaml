lexical_decisions:
- source_word: κληθήσεται ... σου τὸ ὄνομα
  choice: даст тебе имя
  rationale: Греческая пассивная формула буквально говорит, что имя будет названо; по-русски «Бог даст тебе имя» естественно передаёт присвоение Богом нового имени, не превращая его лишь в характеристику.
- source_word: παρὰ τοῦ θεοῦ
  choice: Бог
  rationale: Παρά с родительным обозначает источник или деятеля; активная русская конструкция ясно сохраняет Божье действие при наречении.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Кратко и естественно передаёт устойчивое выражение о непреходящей длительности.
- source_word: εἰρήνη
  choice: Мир
  rationale: Слово входит в состав дарованного имени; прописная буква и кавычки обозначают его титульную функцию.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: «Праведность» сохраняет широкий нравственный и библейский смысл δικαιοσύνη; возможное значение «справедливость» отмечено в сноске.
- source_word: δόξα
  choice: слава
  rationale: «Слава» сохраняет библейские оттенки чести, величия и сияния.
- source_word: θεοσεβείας
  choice: благочестия
  rationale: В современном литературном русском «благочестие» кратко и достойно передаёт почтительное отношение к Богу; более явное «почитание Бога» дано как альтернатива.
theological_decisions:
- issue: Значение δικαιοσύνης в составе нового имени
  choice: праведности
  alternative: справедливости
  rationale: Основной вариант сохраняет широкий нравственный и религиозный диапазон слова, не сужая его до общественной или судебной справедливости; реальная лексическая альтернатива вынесена в сноску.
- issue: Синтаксическая роль заключительных слов
  choice: оформить их как содержание дарованного имени в кавычках
  alternative: оставить как неоформленное приложение
  rationale: Два именительных сочетания после формулы наречения естественно понимаются как само новое имя; кавычки лишь делают эту функцию ясной современному читателю.
- issue: Значение θεοσεβείας
  choice: благочестия
  alternative: почитания Бога
  rationale: Основной вариант сохраняет ёмкость абстрактного существительного, а альтернатива явно раскрывает направленность почтения к Богу.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным строем. Активная формула «Бог ... даст тебе имя» устраняет неестественный русский пассив, сохраняя смысл божественного наречения. Кавычки и прописная буква показывают, что финальная фраза является именем.
