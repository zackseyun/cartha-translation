review_pass:
  verdict: revise
  source_fidelity: «Возвращает» явным образом добавляет значение повторного возвращения, тогда как εἰσάγει означает «вводит, приводит»; контекст восстановления его подразумевает, но сам глагол этого не выражает. «Приводит их к тебе» передаёт направление πρὸς σέ без добавления. Образ «несомых во славе, словно на царском престоле» допустимо и естественно воспроизводит сжатое сравнение ὡς θρόνον βασιλείας.
  naturalness: Текст звучит современно и сохраняет торжественную интонацию. Причастные формы «уводимые» и «несомых» уместны в поэтическом библейском регистре. После замены «возвращает» на «приводит» фраза остаётся плавной.
  terminology: '«Бог», «враги», «слава» и «царский престол» выбраны точно. Примечание в черновике не следует сохранять: предлагаемый им «буквальный» русский вариант «словно царский престол» не является осмысленной передачей образа, а объяснение о формальном отнесении винительного падежа к «несомым» грамматически необоснованно.'
  issues:
  - severity: medium
    issue: «возвращает их к тебе» для εἰσάγει
    rationale: Русское «возвращает» вносит приставочное значение «обратно», отсутствующее в самом греческом глаголе. Контекст позволяет читателю увидеть возвращение, но перевод должен сохранить более нейтральное «приводит/вводит».
  - severity: medium
    issue: Неточное и вводящее в заблуждение примечание к ὡς θρόνον βασιλείας
    rationale: Вариант «словно царский престол» не передаёт смысл по-русски, а заявленная синтаксическая неоднозначность не следует из одного лишь винительного падежа. Сжатый образ лучше оставить в основном тексте без такого примечания.
  revised_text: Ведь они ушли от тебя пешком, уводимые врагами, а Бог приводит их к тебе, несомых во славе, словно на царском престоле.
