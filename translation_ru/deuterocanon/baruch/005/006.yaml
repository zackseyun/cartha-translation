  text: For they went out from you on foot[a], being led away by enemies, but God brings them to you[b], carried with glory as on a royal throne.
translation:
  language: ru
  text: Ведь они ушли от тебя пешком, уводимые врагами, а Бог приводит их к тебе, несомых во славе, словно на царском престоле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον γὰρ παρὰ σοῦ
  choice: Ведь они ушли от тебя
  rationale: Передаёт причинное γάρ и движение прочь от олицетворённого Иерусалима без добавления оттенков, отсутствующих в греческом.
- source_word: πεζοὶ
  choice: пешком
  rationale: Естественное русское соответствие, сохраняющее контраст между унизительным уходом и почётным возвращением.
- source_word: ἀγόμενοι ὑπʼ ἐχθρῶν
  choice: уводимые врагами
  rationale: Пассивная конструкция передаёт движение под властью врагов и контекст плена, не усиливая образ до насильственного «угоняемые».
- source_word: εἰσάγει δὲ αὐτοὺς ὁ θεὸς πρὸς σὲ
  choice: а Бог возвращает их к тебе
  rationale: Хотя εἰσάγει буквально значит «вводит/приводит», сочетание с πρὸς σὲ и контекст возвращения к Иерусалиму естественно передаются русским «возвращает к тебе».
- source_word: αἰρομένους
  choice: несомых
  rationale: Сохраняет пассивный образ почётного перенесения и противопоставление слову «пешком»; не уточняет, кем именно их несут.
- source_word: μετὰ δόξης
  choice: во славе
  rationale: Естественно передаёт сопровождающую их славу и сохраняет религиозно-поэтическую ёмкость δόξα.
- source_word: ὡς θρόνον βασιλείας
  choice: словно на царском престоле
  rationale: Греческая фраза сжата и буквально допускает сопоставление самих несомых с престолом; по контексту русская формулировка выражает образ их царственного перенесения, не устраняя текстовую трудность полностью благодаря примечанию.
theological_decisions:
- issue: Возвращение как обращение вспять унижения изгнания
  choice: 'Сохранён контраст: они ушли пешком под властью врагов, но Бог возвращает их с царскими почестями.'
  alternative: «Бог приводит их к тебе» — более буквальная передача εἰσάγει без явного обозначения возвращения.
  rationale: Контекст ясно описывает восстановление изгнанников, однако субъектом этого обращения судьбы прямо остаётся Бог.
- issue: Сжатый образ царственного возвышения
  choice: «несомых во славе, словно на царском престоле»
  alternative: «несомых во славе, словно царский престол»
  rationale: Основной текст делает образ понятным по-русски, а примечание сохраняет подлинную грамматическую неоднозначность и не превращает метафору в отвлечённое объяснение.
