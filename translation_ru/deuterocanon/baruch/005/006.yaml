revisions:
- from: Ведь они ушли от тебя пешком, уводимые врагами, а Бог возвращает их к тебе, несомых во славе, словно на царском престоле.[a]
  to: Ведь они ушли от тебя пешком, уводимые врагами, а Бог приводит их к тебе, несомых во славе, словно на царском престоле.
  rationale: Заменено «возвращает» на «приводит», чтобы точно передать εἰσάγει, не устраняя контекстуально очевидный мотив возвращения. Удалены знак сноски и примечание, поскольку они создавали ложную грамматическую проблему и предлагали неудачный русский вариант. Остальной текст верно передаёт контраст между уходом пешком под властью врагов и почётным возвращением, совершаемым Богом.
  reviewer_model: gpt-5.6-terra
