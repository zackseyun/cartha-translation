lexical_decisions:
- source_word: ἔκλαιον
  choice: плакали
  rationale: Имперфект обозначает продолжавшееся или повторявшееся действие; в русском повествовании несовершенный вид естественно передаёт эту длительность.
- source_word: ἐνήστευον
  choice: постились
  rationale: Несовершенный вид сохраняет продолжительный характер греческого имперфекта и точно передаёт религиозный пост.
- source_word: ηὔχοντο
  choice: молились
  rationale: Обычное и контекстуально точное обозначение молитвы; несовершенный вид соответствует имперфекту.
- source_word: ἐναντίον
  choice: пред
  rationale: В сочетании «пред Господом» естественно выражает пребывание в Божьем присутствии и сохраняет возвышенный библейский регистр без архаической неясности.
- source_word: Κυρίου
  choice: Господом
  rationale: В данном иудейском контексте титул относится к Богу Израиля; традиционное русское «Господь» точно и естественно передаёт κύριος.
theological_decisions:
- issue: Передача Κυρίου в иудейском контексте Септуагинты
  choice: Господом
  alternative: Владыкой
  rationale: «Господь» — устоявшееся reverential обозначение Бога Израиля и прямой эквивалент κύριος; вариант «Владыка» привнёс бы дополнительный смысловой оттенок.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Однородные глаголы несовершенного вида сохраняют длительный характер трёх греческих имперфектов. Начальный союз «и» сохранён, поскольку стих продолжает предыдущее повествование.
