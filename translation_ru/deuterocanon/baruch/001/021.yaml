lexical_decisions:
- source_word: οὐκ ἠκούσαμεν
  choice: не слушали
  rationale: В данном контексте ἀκούω с родительным падежом означает не просто восприятие на слух, а внимательное принятие сказанного. «Не слушали» сохраняет библейский образ и нравственный смысл, не сводя его прямо к более толковательному «не повиновались».
- source_word: τῆς φωνῆς
  choice: голоса
  rationale: Прямое соответствие φωνή; сохраняется библейское выражение «слушать голос», а не вводится более отвлечённое «послание».
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  choice: Господа, Бога нашего
  rationale: Передаёт греческое наименование κύριος ὁ θεὸς ἡμῶν в естественной русской библейской форме, не подменяя греческое Κύριος графическим обозначением имени YHWH.
- source_word: κατὰ πάντας τοὺς λόγους τῶν προφητῶν
  choice: возвещённого во всех словах пророков
  rationale: Буквальное «согласно всем словам пророков» при глаголе «слушать» звучит по-русски неясно. Выбранная формулировка естественно связывает голос Господа со всеми словами посланных пророков, сохраняя полноту πάντας.
- source_word: ὧν ἀπέστειλεν πρὸς ἡμᾶς
  choice: которых Он посылал к нам
  rationale: Относительное местоимение соотнесено с пророками; πρὸς ἡμᾶς передано как «к нам». Несовершенный вид «посылал» естественно выражает неоднократность пророческого посланничества в контексте.
theological_decisions:
- issue: Заветный смысл выражения «слушать голос Господа»
  choice: не слушали голоса Господа
  alternative: не повиновались голосу Господа
  rationale: 'Основной текст сохраняет образ и смысловую напряжённость исходной формулировки: речь идёт и о слушании, и о виновном отказе внимать. Вариант с явным значением повиновения указан в примечании.'
- issue: Соотношение Божьего голоса и слов пророков
  choice: голос Господа, возвещённый во всех словах пророков
  alternative: голос Господа согласно всем словам пророков
  rationale: Формулировка показывает пророков как посланных носителей Божьих слов, не утверждая тождества их личности с Богом и не вводя конфессионально специфического учения о вдохновении.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Порядок «Господа, Бога нашего» сохраняет достоинство и узнаваемость выражения; местоимение «Он» написано с прописной буквы согласно принятой русской религиозной издательской норме.
