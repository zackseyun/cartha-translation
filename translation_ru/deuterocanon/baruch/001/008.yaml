base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/008.yaml
  text: when he received the vessels of the house of the Lord that had been carried out from the temple[a], to return them to the land of Judah, on the tenth of Sivan—silver vessels that Zedekiah son of Josiah, king of Judah, had made—
translation:
  language: ru
  text: когда он получил сосуды дома Господа, вынесенные из храма, чтобы вернуть их в землю Иуды[a], в десятый день месяца сивана, — серебряные сосуды, которые изготовил Седекия, сын Иосии, царь Иуды, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы доставить их обратно в землю Иуды».'
    reason: Лексически ἀποστρέψαι может подчёркивать как возвращение предметов, так и их доставку обратно; вариант сохраняет этот оттенок движения.
lexical_decisions:
- source_word: ἐν τῷ λαβεῖν αὐτὸν
  choice: когда он получил
  rationale: Конструкция ἐν с субстантивированным инфинитивом выражает одновременность; личное местоимение αὐτόν передано явно. Такая формулировка естественна по-русски и сохраняет временную связь.
- source_word: τὰ σκεύη οἴκου Κυρίου
  choice: сосуды дома Господа
  rationale: В храмовом контексте σκεύη обозначает священные сосуды или принадлежности. «Сосуды» — традиционный и понятный эквивалент, а «дом Господа» сохраняет образное наименование храма.
- source_word: τὰ ἐξενεχθέντα ἐκ τοῦ ναοῦ
  choice: вынесенные из храма
  rationale: Аористное страдательное причастие указывает на предшествовавшее удаление предметов; краткая русская форма точно передаёт физическое перемещение.
- source_word: ἀποστρέψαι εἰς γῆν Ἰούδα
  choice: чтобы вернуть их в землю Иуды
  rationale: Инфинитив естественно выражает цель, а γῆ сохраняется как «земля», то есть территория Иуды. Местоимение «их» добавлено по нормам русского языка для ясной связи с сосудами.
- source_word: τῇ δεκάτῃ τοῦ Σειουάν
  choice: в десятый день месяца сивана
  rationale: Развёрнутая русская формула даты понятнее буквального «в десятый сивана»; название месяца передано принятой русской транслитерацией.
- source_word: σκεύη ἀργυρᾶ
  choice: серебряные сосуды
  rationale: Прямо передаёт материал и повтор ключевого существительного, присутствующий в греческом тексте.
- source_word: ἃ ἐποίησεν
  choice: которые изготовил
  rationale: «Изготовил» естественно относится к предметам и не вносит дополнительного оттенка художественного ремесла, возможного у слова «выковал».
- source_word: Σεδεκίας υἱὸς Ἰωσεία βασιλεὺς Ἰούδα
  choice: Седекия, сын Иосии, царь Иуды
  rationale: Сохранены имя, родословное уточнение и царский титул в порядке, близком к источнику и естественном для русского синтаксиса.
theological_decisions:
- issue: Передача Κυρίου в храмовом наименовании
  choice: Господа
  alternative: Владыки; ГОСПОДА
  rationale: Греческое κύριος передано обычным библейским соответствием «Господь» без попытки восстановить иной исходный божественный титул, не выраженный непосредственно в данном греческом тексте.
- issue: Отношение инфинитива ἀποστρέψαι к храмовым сосудам
  choice: чтобы вернуть их
  alternative: чтобы доставить их обратно
  rationale: Контекст указывает на возвращение сосудов в землю Иуды. Основной текст передаёт это прямо, а синонимический оттенок движения обратно отмечен в сноске без добавления богословской интерпретации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксическая незавершённость и заключительное тире сохранены, поскольку стих продолжает предложение соседних стихов. Название месяца написано со строчной буквы по нормам русского языка.
