base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/010.yaml
  text: And they said[a], ‘Behold, we have sent you money; and with the money buy burnt offerings and sin offerings and frankincense, and prepare a grain offering and offer them on the altar of the Lord our God,’
translation:
  language: ru
  text: 'И они сказали: «Вот, мы послали вам серебро. Купите на это серебро всесожжения, жертвы за грех и ладан, приготовьте хлебное приношение[a] и вознесите всё это на жертвенник Господа, Бога нашего».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь греческое μάννα обозначает хлебное, то есть приготовленное из зерна, приношение, а не манну, которой народ питался в пустыне.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον
  choice: серебро
  rationale: Греческое слово буквально означает серебро и в данном случае служит платёжным средством. Русское «серебро» естественно сохраняет и вещественное, и денежное значение оригинала.
- source_word: ἀγοράσατε
  choice: купите
  rationale: Прямой и естественный эквивалент повелительной формы со значением покупки.
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Устоявшийся русский библейский термин для жертв, полностью сжигавшихся на жертвеннике; он передаёт значение цельности жертвы.
- source_word: περὶ ἁμαρτίας
  choice: жертвы за грех
  rationale: В жертвенном контексте оборот обозначает приношения за грех. Развёрнутая формулировка понятнее современному читателю, чем более специальное «жертвы очищения».
- source_word: λίβανον
  choice: ладан
  rationale: Точное и общеупотребительное русское название благовонной смолы, обозначенной греческим словом.
- source_word: ποιήσατε μάννα
  choice: приготовьте хлебное приношение
  rationale: В данном жертвенном перечне μάννα понимается как мучное или хлебное приношение, а не как манна пустынного странствия.
- source_word: ἀνοίσατε
  choice: вознесите
  rationale: В культовом контексте глагол означает поднять или принести на жертвенник. «Вознесите» сохраняет образ движения вверх и передаёт жертвенное действие.
- source_word: θυσιαστήριον
  choice: жертвенник
  rationale: Стандартный русский библейский эквивалент места принесения жертв.
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: Господа, Бога нашего
  rationale: Естественно передаёт греческую конструкцию, относя титулы «Господь» и «Бог» к одному лицу.
theological_decisions:
- issue: Передача κύριος применительно к Богу Израиля в греческой девтероканонической книге
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Непосредственный источник содержит греческое Κύριος, а не еврейское четырёхбуквенное имя. Поэтому обычное «Господь» точнее отражает засвидетельствованную форму и не вносит отсутствующую в ней типографическую интерпретацию.
- issue: Референт подразумеваемого дополнения при ἀνοίσατε
  choice: вознесите всё это
  alternative: вознесите его
  rationale: Греческое дополнение не выражено явно. Контекст допускает отнесение действия ко всему перечню приношений; «всё это» естественно передаёт совокупный смысл, не ограничивая действие только хлебным приношением.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Вот» передаёт Ἰδού без архаического «се»; специальные жертвенные термины сохранены там, где они укоренены и понятны по контексту.
