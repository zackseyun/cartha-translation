base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/009.yaml
  text: after Nebuchadnezzar king of Babylon had taken Jeconiah and the rulers and the prisoners and the mighty men and the people of the land from Jerusalem into exile[a], and had brought him to Babylon.
translation:
  language: ru
  text: после того как Навуходоносор, царь Вавилона, увёл из Иерусалима в изгнание Иехонию, правителей, узников, могущественных людей и народ земли и привёл его в Вавилон.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте — «его»; по-видимому, речь идёт именно об Иехонии. Однако по смыслу это место можно понимать шире — как относящееся ко всей группе уведённых в изгнание: «их».'
    reason: Сохранение неоднозначности референта и объяснение неожиданного единственного числа.
lexical_decisions:
- source_word: μετὰ τὸ ἀποικίσαι
  choice: после того как ... переселил
  rationale: Оборот с μετά и субстантивированным инфинитивом выражает предшествование во времени. Глагол ἀποικίζω здесь означает принудительное переселение; «переселил» естественно передаёт это значение, не добавляя отсутствующего в греческом тексте направления.
- source_word: Ναβουχοδονοσὸρ βασιλέα Βαβυλῶνος
  choice: Навуходоносор, царь Вавилона
  rationale: Использованы традиционная русская форма имени и прямое соответствие царскому титулу.
- source_word: τὸν Ἰεχονίαν
  choice: Иехонию
  rationale: Традиционная русская библейская форма имени, непосредственно соответствующая греческому Ἰεχονίας.
- source_word: τοὺς ἄρχοντας
  choice: правителей
  rationale: Передаёт значение лиц, обладающих властью, без излишнего уточнения их должностей.
- source_word: τοὺς δεσμώτας
  choice: узников
  rationale: Сохраняет прямое значение людей, находящихся в заключении или оковах, и отличает их от остальных переселяемых.
- source_word: τοὺς δυνατοὺς
  choice: могущественных людей
  rationale: Сохраняет широкое значение δυνατοί — влиятельных, сильных или знатных мужчин — без неоправданного сведения только к воинам.
- source_word: τὸν λαὸν τῆς γῆς
  choice: народ земли
  rationale: Формально прозрачная передача выражения, которое может иметь как общее, так и социально-групповое значение; неоднозначность не снимается.
- source_word: ἀπὸ Ἰερουσαλήμ
  choice: из Иерусалима
  rationale: Прямо передаёт исходный пункт переселения.
- source_word: καὶ ἤγαγεν αὐτὸν εἰς Βαβυλῶνα
  choice: и привёл его в Вавилон
  rationale: Сохранено единственное число местоимения αὐτόν; наиболее естественный ближайший личный референт — Иехония.
theological_decisions:
- issue: Число местоимения в заключительной части стиха
  choice: 'Сохранить единственное число: «его».'
  alternative: 'Передать по общему смыслу во множественном числе: «их».'
  rationale: Греческий источник имеет αὐτόν, «его», вероятнее всего относящееся к Иехонии. Хотя по контексту возможно понимание всей группы переселенцев, перевод не должен молча заменять грамматическое число источника.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет зависимость стиха от предшествующего контекста: текст начинается со строчной буквы и представляет собой временную придаточную конструкцию. «Народ земли» оставлен как прозрачное и потенциально терминологическое выражение.'
