base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/014.yaml
  text: And you shall read this book that we have sent to you[a], to proclaim in the house of the Lord on a feast day and on days of appointed time,
translation:
  language: ru
  text: И прочтите эту книгу, которую мы послали вам, чтобы провозгласить её в доме Господа в день праздника и в установленные дни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «в день праздника и в дни назначенного времени». Греческое выражение в конце стиха необычно; возможный смысл: «в праздничные дни и в установленные сроки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνώσεσθε
  choice: прочтите
  rationale: Будущая форма в данном контексте передаёт предписание. Русское повелительное «прочтите» естественно выражает эту силу; публичное чтение подразумевается обстановкой, но слово «вслух» в источник не добавлено.
- source_word: τὸ βιβλίον τοῦτο
  choice: эту книгу
  rationale: βιβλίον обозначает книгу, свиток или письменный документ. «Книга» — наиболее естественный современный эквивалент без уточнения материальной формы.
- source_word: ἀπεστείλαμεν
  choice: мы послали вам
  rationale: Аорист указывает на совершившуюся отправку документа; русское прошедшее время естественно передаёт эту связь с нынешним предписанием. Местоимение «вам» отражает πρὸς ὑμᾶς.
- source_word: ἐξαγορεῦσαι
  choice: чтобы провозгласить её
  rationale: Инфинитив выражает цель и может означать публично объявить или огласить. «Провозгласить» сохраняет формальный, публичный характер действия; дополнение «её» естественно отсылает к книге.
- source_word: ἐν οἴκῳ Κυρίου
  choice: в доме Господа
  rationale: Сохранён традиционный библейский образ дома Господа; он обозначает храм, но перевод не заменяет образ толкованием.
- source_word: ἐν ἡμέρᾳ ἑορτῆς
  choice: в день праздника
  rationale: ἑορτή обозначает религиозный праздник; формулировка близка греческому тексту и естественна по-русски.
- source_word: ἐν ἡμέραις καιροῦ
  choice: в установленные дни
  rationale: καιρός может означать назначенное или надлежащее время. Передача «установленные дни» сохраняет календарный смысл и звучит естественнее буквального, но неясного «в дни времени».
theological_decisions:
- issue: Передача Κυρίου
  choice: Господа
  alternative: ГОСПОДА
  rationale: В греческом источнике стоит Κυρίου, а не непосредственно еврейский тетраграмматон. «Господа» текстуально обосновано и соответствует русскому библейскому регистру.
- issue: Характер действия ἐξαγορεῦσαι
  choice: провозгласить её
  alternative: прочитать её вслух
  rationale: Контекст предполагает публичное чтение в храме, однако сам глагол шире и означает объявить или высказать публично. Выбранный вариант не сводит значение только к технике чтения и сохраняет возможную смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены «книга», «дом Господа» и публично-культовый оттенок «провозгласить». Маркер сноски помещён в основном тексте.
