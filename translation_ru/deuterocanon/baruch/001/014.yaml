  terminology: «Дом Господа» точно сохраняет образ ἐν οἴκῳ Κυρίου, не подменяя его толковательным «храм». «День праздника» и «установленные дни» естественно передают календарную лексику. Сноска добросовестно отмечает необычность ἐν ἡμέραις καιροῦ и даёт более близкий к форме источника вариант наряду с осмысляющей альтернативой.
