  source_fidelity: Перевод верно передаёт предписывающую силу ἀναγνώσεσθε через «прочтите», объект «эту книгу», совершившуюся отправку адресатам и целевой инфинитив ἐξαγορεῦσαι. «Чтобы провозгласить её» сохраняет публично-декларативный оттенок глагола, не добавляя прямо не выраженного «вслух». Культовые и календарные обстоятельства переданы без смысловых добавлений.
