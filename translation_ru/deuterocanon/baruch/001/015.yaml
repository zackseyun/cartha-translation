  text: And you shall say[a], ‘To the Lord our God belongs righteousness, but to us shame of face, as it is this day—to the people of Judah and to the inhabitants of Jerusalem,’
translation:
  language: ru
  text: 'И скажите: «Господу, Богу нашему, принадлежит праведность, а нам — стыд на лицах, как это и есть ныне, — нам, народу Иуды и жителям Иерусалима».[a]'
  philosophy: optimal-equivalence
  footnotes:
