lexical_decisions:
- source_word: ἐρεῖτε
  choice: скажите
  rationale: Будущее изъявительное здесь имеет предписывающую силу; русский повелительный вид естественно передаёт литургическое указание.
- source_word: τῷ κυρίῳ θεῷ ἡμῶν
  choice: Господу, Богу нашему
  rationale: Дательный сохранён в конструкции принадлежности; приложение с запятой ясно передаёт «Господу, нашему Богу» и звучит торжественно.
- source_word: ἡ δικαιοσύνη
  choice: принадлежит праведность
  rationale: Греческая именная фраза эллиптична; глагол «принадлежит» восполняет подразумеваемую связь. «Праведность» сохраняет нравственный и исповедальный смысл δικαιοσύνη, не исключая оттенка справедливости.
- source_word: αἰσχύνη τῶν προσώπων
  choice: стыд на лицах
  rationale: Естественный русский способ сохранить семитизированный образ видимого, публичного стыда без чрезмерного истолкования.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: как и ныне
  rationale: Передаёт формульное указание на очевидное нынешнее положение; буквальное «как этот день» по-русски неестественно.
- source_word: ἀνθρώπῳ Ἰούδα
  choice: народу Иуды
  rationale: Единственное ἀνθρώπῳ употреблено собирательно и соотнесено с последующей группой; «народ Иуды» естественно передаёт коллективный смысл.
- source_word: τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: жителям Иерусалима
  rationale: Краткое и точное соответствие субстантивированному причастию «живущим в Иерусалиме».
theological_decisions:
- issue: Значение δικαιοσύνη в покаянном противопоставлении Бога и народа
  choice: праведность
  alternative: справедливость
  rationale: '«Праведность» лучше сохраняет широкий нравственный и заветный смысл исповедания: Бог прав, тогда как народ покрыт стыдом. «Справедливость» лексически возможна, но несколько сужает смысл до судебной справедливости.'
translation_notes:
