  text: in the fifth year[a], on the seventh day of the month, at the time when the Chaldeans captured Jerusalem and burned it with fire.
translation:
  language: ru
  text: в пятый год, в седьмой день месяца[a], в то время, когда халдеи взяли Иерусалим и сожгли его огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «в седьмой месяца»; здесь подразумевается обычная формула датировки: «в седьмой день месяца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ πέμπτῳ
  choice: в пятый год
  rationale: Прямо и естественно передаёт временную конструкцию с ἐν, сохраняя форму исходного текста.
- source_word: ἐν ἑβδόμῃ τοῦ μηνός
  choice: в седьмой день месяца
  rationale: Женская форма порядкового числительного подразумевает опущенное ἡμέρᾳ («день»); это обычная эллиптическая формула датировки.
- source_word: ἐν τῷ καιρῷ ᾧ
  choice: в то время, когда
  rationale: Сохраняет явно выраженное временное значение καιρός и звучит естественно по-русски.
- source_word: ἔλαβον
  choice: взяли
  rationale: В сочетании с названием города «взяли» естественно выражает военный захват и формально близко к λαμβάνω.
- source_word: οἱ Χαλδαῖοι
  choice: халдеи
  rationale: Прямое соответствие греческому этнониму Χαλδαῖοι; вариант «вавилоняне» был бы историческим пояснением.
- source_word: ἐνέπρησαν
  choice: сожгли
  rationale: Точно передаёт действие поджога или сожжения, не добавляя идеи полного уничтожения сверх сказанного в греческом тексте.
- source_word: ἐν πυρί
  choice: огнём
  rationale: Естественная русская передача инструментального значения оборота; сохраняет эксплицитное упоминание огня.
