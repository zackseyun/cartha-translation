base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/019.yaml
  text: From the day when the Lord brought our fathers out from the land of Egypt until this day[a], we have been disobedient to the Lord our God, and we have been negligent in not listening to his voice.
translation:
  language: ru
  text: Со дня, когда Господь вывел наших отцов из земли Египетской, и вплоть до нынешнего дня мы не повиновались Господу, Богу нашему, и были нерадивы, не слушая Его голоса[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступали беспечно, не слушая Его голоса». Употреблённый здесь греческий глагол редок и может обозначать нерадение или беспечность, не обязательно сознательное упрямство.'
    reason: Лексическая неоднозначность редкого глагола ἐσχεδιάζομεν.
lexical_decisions:
- source_word: ἀπὸ τῆς ἡμέρας ἧς ... καὶ ἕως τῆς ἡμέρας ταύτης
  choice: Со дня, когда... и вплоть до нынешнего дня
  rationale: Передаёт начальную точку и непрерывность периода до момента исповедания; «вплоть до» ясно выражает длительность в современном русском языке.
- source_word: ἐξήγαγεν
  choice: вывел
  rationale: Точно и естественно передаёт действие выведения из Египта, сохраняя связь с исходом.
- source_word: Κύριος
  choice: Господь
  rationale: Обычный русский эквивалент греческого Κύριος; в данном контексте обозначает Бога Израиля.
- source_word: τοὺς πατέρας ἡμῶν
  choice: наших отцов
  rationale: Сохраняет явно мужскую форму греческого выражения и его библейский смысл — праотцы Израиля.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: из земли Египетской
  rationale: Сохраняет упоминание земли и исход из неё; формула литературна, понятна и уместна в библейском повествовании.
- source_word: ἤμεθα ἀπειθοῦντες
  choice: мы не повиновались
  rationale: В сочетании с временной рамкой «со дня... вплоть до» русский несовершенный вид передаёт продолжавшееся и повторявшееся непослушание.
- source_word: πρὸς Κύριον θεὸν ἡμῶν
  choice: Господу, Богу нашему
  rationale: Естественное управление глагола «повиноваться» сохраняет направленность отношения к Господу и приложение «Богу нашему».
- source_word: ἐσχεδιάζομεν
  choice: были нерадивы
  rationale: Редкий греческий глагол, по контексту, указывает на небрежность или беспечность в послушании. «Были нерадивы» сохраняет эту смысловую широту, не усиливая её до прямого упрямого бунта.
- source_word: πρὸς τὸ μὴ ἀκούειν τῆς φωνῆς αὐτοῦ
  choice: не слушая Его голоса
  rationale: Естественно передаёт сферу или проявление нерадения и сохраняет библейский образ слушания Божьего голоса, не заменяя «голос» толковательным «слово».
theological_decisions:
- issue: Передача заветного именования Κύριος в греческом тексте
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: В источнике стоит греческое Κύριος, а не непосредственно еврейское четырёхбуквенное имя. «Господь» точно передаёт текст, тогда как особое типографское оформление привнесло бы решение, не выраженное греческой формой.
- issue: Продолжительность непослушания от исхода до момента исповедания
  choice: со дня... вплоть до нынешнего дня мы не повиновались... и были нерадивы
  alternative: со дня... до нынешнего дня мы были непослушны...
  rationale: Временная рамка вместе с несовершенным видом сохраняет длительный и повторяющийся характер поведения, выраженный греческой перифрастической конструкцией.
- issue: Степень волевого сопротивления в ἐσχεδιάζομεν
  choice: были нерадивы
  alternative: упрямо отказывались
  rationale: Редкость глагола допускает оттенки небрежности, беспечности или невнимательности. Перевод как упрямого отказа чрезмерно конкретизировал бы мотив и усилил бы обвинение сверх явно выраженного смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Формы «земля Египетская» и «Богу нашему» сохраняют торжественный регистр, оставаясь понятными; архаичные глагольные и местоименные формы не используются.
