    issue: Несколько неестественное сочетание «ярость и гнев ... не отвратились от нас».
    rationale: Греческий глагол означает «отвернулся/отступил», но русское возвратное «отвратиться от» в данном контексте менее идиоматично. «Не отступили от нас» точнее передаёт продолжающееся пребывание гнева и лучше соответствует целевому современному литературному регистру.
  revised_text: И молитесь о нас Господу, Богу нашему, потому что мы согрешили против Господа, Бога нашего, и гнев Господа и Его ярость не отступили от нас до сего дня.
