  text: And pray for us to the Lord our God, because we have sinned against the Lord our God, and the anger of the Lord and his wrath has not turned away from us to this day.
translation:
  language: ru
  text: И молитесь о нас Господу, Богу нашему, потому что мы согрешили против Господа, Бога нашего, и гнев Господа и Его ярость не отступили от нас до сего дня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεύξασθε περὶ ἡμῶν
  choice: молитесь о нас
  rationale: Естественно и точно передаёт повелительное наклонение и ходатайственную направленность молитвы.
- source_word: ἡμάρτομεν τῷ κυρίῳ θεῷ ἡμῶν
  choice: мы согрешили против Господа, Бога нашего
  rationale: Дательный после ἁμαρτάνω обозначает того, против кого совершён грех; «против» ясно передаёт смысл по-русски.
- source_word: ὁ θυμὸς Κυρίου καὶ ἡ ὀργὴ αὐτοῦ
  choice: ярость Господа и гнев Его
  rationale: Сохраняет два близких, но отдельных греческих существительных, не сводя их к одному понятию.
- source_word: οὐκ ἀπέστρεψεν ... ἀφʼ ἡμῶν
  choice: не отвратились от нас
  rationale: Передаёт образ гнева, который не удалился от народа; множественное число естественно согласует в русском два однородных подлежащих, несмотря на греческий глагол в единственном числе.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: до сего дня
  rationale: Устойчивое, понятное выражение высокого повествовательного регистра.
theological_decisions:
- issue: Отношение Божьего гнева к согрешившему народу
  choice: сохранено прямое утверждение, что ярость и гнев Господа не отвратились от народа
  alternative: смягчить как «последствия Его гнева остаются»
  rationale: Греческий текст прямо говорит о θυμός и ὀργή Господа; замена на последствия была бы богословским истолкованием.
- issue: Согласование сказуемого при двух обозначениях гнева
  choice: «не отвратились» во множественном числе
  alternative: «не отвратился» в единственном числе вслед за формой ἀπέστρεψεν
  rationale: В греческом единственное число может согласовываться с ближайшим подлежащим либо представлять пару как единое целое; русский текст с двумя самостоятельными существительными требует естественного множественного числа и не навязывает их полного тождества.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Синтаксический параллелизм и повтор «Господа, Бога нашего» сохранены; «до сего дня» выбрано как понятная традиционная формула.
