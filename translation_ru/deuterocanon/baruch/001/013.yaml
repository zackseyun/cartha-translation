  source_fidelity: 'Смысл передан точно: повеление молиться о говорящих, исповедание греха перед Господом, Богом народа, и продолжающееся до настоящего дня действие Божьего гнева сохранены. Два существительных θυμός и ὀργή переданы раздельно; русское множественное сказуемое при двух однородных подлежащих естественно.'
  naturalness: '«Не отвратились от нас» возможно в традиционном библейском стиле, но для современного литературного русского несколько искусственно: обычно отворачивается лицо или человек. «Не отступили от нас» сохраняет пространственный образ греческого ἀπέστρεψεν ... ἀφʼ ἡμῶν и звучит естественнее.'
  terminology: «Господь, Бог наш», «согрешили против», «гнев» и «ярость» уместны. Перестановка на «гнев Господа и Его ярость» воспроизводит порядок греческих θυμός ... ὀργή и не приписывает двум словам различного богословского содержания.
  issues:
