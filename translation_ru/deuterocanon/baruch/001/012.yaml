base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/012.yaml
  text: And the Lord will give us strength and enlighten our eyes[a], and we will live under the shadow of Nebuchadnezzar king of Babylon and under the shadow of Belshazzar his son[b], and we will serve them many days and find favor before them.
translation:
  language: ru
  text: И Господь даст нам силу и даст свет нашим глазам, и мы будем жить под сенью[a] Навуходоносора, царя Вавилона, и под сенью Валтасара, его сына, и будем служить им много дней и обретём у них благоволение.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «под тенью». Этот образ может означать как покровительство, так и зависимое положение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «найдём благоволение перед ними».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχὺν
  choice: силу
  rationale: Прямой и естественный эквивалент, передающий даруемую Богом способность выстоять.
- source_word: φωτίσει τοὺς ὀφθαλμοὺς ἡμῶν
  choice: даст свет нашим глазам
  rationale: Сохраняет образ греческого выражения и допускает оттенки ясности, оживления и восстановления, не сводя его к одному толкованию.
- source_word: ζησόμεθα
  choice: будем жить
  rationale: Точно передаёт обычное значение ζάω; вариант «выживем» был бы более истолковывающим.
- source_word: ὑπὸ τὴν σκιὰν
  choice: под сенью
  rationale: Сохраняет метафору тени в естественной для литературного русского форме; образ может указывать как на покровительство, так и на зависимое положение.
- source_word: Ναβουχοδονοσὸρ
  choice: Навуходоносора
  rationale: Употреблена традиционная русская библейская форма имени.
- source_word: Βαλτασὰρ
  choice: Валтасара
  rationale: Употреблена традиционная русская библейская форма имени.
- source_word: δουλεύσομεν
  choice: будем служить
  rationale: Передаёт политическое служение и подчинение чужеземным царям, не усиливая без необходимости значение до буквального рабства.
- source_word: ἡμέρας πολλὰς
  choice: много дней
  rationale: Сохраняет конкретный временной образ исходного текста; смысл — продолжительное время.
- source_word: εὑρήσομεν χάριν ἐναντίον αὐτῶν
  choice: обретём у них благоволение
  rationale: Естественно передаёт библейскую идиому «найти благоволение перед кем-либо», сохраняя её смысл.
theological_decisions:
- issue: Смысл образа пребывания «под тенью» языческих царей
  choice: Сохранить метафору в выражении «под сенью», не уточняя её как защиту или власть.
  alternative: «под защитой» либо «под властью»
  rationale: Греческий образ допускает одновременно оттенки покровительства и подчинения; явное уточнение устранило бы заложенное в тексте политическое и богословское напряжение.
- issue: Значение δουλεύσομεν в условиях изгнания
  choice: «будем служить им»
  alternative: «будем у них в рабстве» или «будем им подвластны»
  rationale: Контекст говорит о продолжительном подчинённом служении правителям. «Служить» сохраняет широту глагола, тогда как «быть в рабстве» без необходимости сужает его значение.
translation_notes:
  register: Современный литературный русский с умеренно библейской образностью. «Под сенью» выбрано как понятное возвышенное выражение, позволяющее сохранить метафору; синтаксис упрощён лишь настолько, чтобы длинное перечисление оставалось ясным.
