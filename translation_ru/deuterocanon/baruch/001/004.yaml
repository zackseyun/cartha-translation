lexical_decisions:
- source_word: ἐν ὠσίν / ἐν ὠσὶ
  choice: в присутствии
  rationale: Буквально «в уши»; в данном контексте это идиома публичного чтения перед собравшимися. «В присутствии» естественно передаёт ситуацию, не воспроизводя неясный для современного читателя буквализм.
- source_word: τῶν δυνατῶν
  choice: знатных
  rationale: Слово обозначает влиятельных, могущественных или видных людей. В перечислении общественных групп «знатные» передаёт социальное положение, не сводя значение к физической силе.
- source_word: υἱῶν τῶν βασιλέων
  choice: сыновей царей
  rationale: Сохранено буквальное родственное обозначение во множественном числе; перевод «царевичей» мог бы неоправданно придать выражению значение устойчивого придворного титула.
- source_word: τῶν πρεσβυτέρων
  choice: старейшин
  rationale: В контексте общины речь, вероятнее всего, идёт о признанных старших и руководителях, а не просто о пожилых мужчинах.
- source_word: παντὸς τοῦ λαοῦ
  choice: всего народа
  rationale: Прямо передаёт совокупное значение греческого выражения.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: от малого до великого
  rationale: Сохранён традиционно понятный меризм, охватывающий людей любого положения; греческий текст не требует ограничивать его возрастом.
- source_word: πάντων τῶν κατοικούντων
  choice: всех, кто жил
  rationale: Естественная русская передача субстантивированного причастия с сохранением охвата всех жителей.
- source_word: ἐν Βαβυλῶνι
  choice: в Вавилоне
  rationale: Общепринятая русская форма географического названия.
- source_word: ἐπὶ ποταμοῦ Σούδ
  choice: у реки Суд
  rationale: Предлог ἐπί с родительным имеет здесь локативный смысл — нахождение у реки или вдоль неё. Название передано транслитерацией.
