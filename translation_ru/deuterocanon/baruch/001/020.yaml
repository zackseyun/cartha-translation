base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/020.yaml
  text: And the calamities and the curse that the Lord appointed for Moses his servant clung to us[a], on the day when he brought our fathers out to give us a land flowing with milk and honey[c][b], as it is this day.
translation:
  language: ru
  text: И пристали к нам бедствия[a] и проклятие, которое Господь предписал[b] Моисею, Своему служителю[c], в тот день, когда вывел наших отцов, чтобы дать нам землю, текущую молоком и мёдом, — как и ныне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несчастья», «злые беды»; здесь речь, вероятно, идёт о пагубных карах, а не о нравственном зле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «установил», «повелел».'
    reason: lexical_alternative
  - marker: c
    text: Греческое слово может также означать «ребёнок» или «слуга»; применительно к Моисею здесь имеется в виду служитель Бога.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολλήθη εἰς ἡμᾶς
  choice: постигли нас
  rationale: Греческий оборот буквально изображает бедствия и проклятие как нечто приставшее к народу. Русское «постигли нас» естественно передаёт наступившее и продолжающееся действие кары, хотя несколько ослабляет исходную метафору.
- source_word: τὰ κακὰ
  choice: бедствия
  rationale: В контексте последствий нарушения завета речь идёт не о нравственном зле, а о пагубных событиях и карах.
- source_word: ἡ ἀρά
  choice: проклятие
  rationale: Слово обозначает проклятие, здесь — объявленную за непослушание санкцию завета; нейтральное «проклятие» сохраняет смысл без излишней терминологизации.
- source_word: συνέταξεν
  choice: предписал
  rationale: Глагол выражает распоряжение или установление. «Предписал Моисею» прямо и естественно передаёт греческий дательный τῷ Μωυσῇ, не превращая его без достаточных оснований в конструкцию «через Моисея».
- source_word: παιδὶ αὐτοῦ
  choice: Своему служителю
  rationale: παῖς допускает значения «ребёнок», «слуга» и «служитель», но применительно к Моисею здесь уместно обозначение служителя Бога.
- source_word: ἐξήγαγεν τοὺς πατέρας ἡμῶν
  choice: вывел наших отцов
  rationale: Сохраняется традиционная формула исхода и родовое обозначение предков.
- source_word: γῆν ῥέουσαν γάλα καὶ μέλι
  choice: землю, текущую молоком и мёдом
  rationale: Сохранён узнаваемый библейский образ, буквально соответствующий греческому выражению.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: как и ныне
  rationale: Краткая формула сохраняет указание на нынешнее для говорящих положение, не уточняя искусственно, относится ли она прежде всего к обладанию землёй или к исполнению объявленной кары.
theological_decisions:
- issue: Характер бедствий и проклятия
  choice: Сохранена связь с установленными через Моисеев завет карами без добавления слова «завет».
  alternative: Передать как общие несчастья и проклятие без аллюзии на санкции за непослушание.
  rationale: Сочетание бедствий, проклятия, Моисея, исхода и дара земли ясно вызывает контекст Второзакония, но стих не называет завет прямо.
- issue: Связь относительного придаточного
  choice: «которое» грамматически относится только к «проклятию».
  alternative: 'Отнести установленное Господом одновременно и к бедствиям, и к проклятию: «которые Господь предписал».'
  rationale: Греческое ἣν стоит в женском роде единственного числа и согласуется с ἡ ἀρά, поэтому формальная связь именно с проклятием должна быть сохранена.
- issue: Роль Моисея при глаголе συνέταξεν
  choice: «предписал Моисею»
  alternative: «установил через Моисея» или «назначил для Моисея»
  rationale: Дательный падеж естественно обозначает адресата распоряжения. Вариант «через Моисея» богословски правдоподобен, но выражает посредничество явнее, чем сам греческий текст; «для Моисея» может ошибочно представить проклятие предназначенным лично ему.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Наших отцов», «землю, текущую молоком и мёдом» и «как и ныне» сохраняют межтекстовые библейские связи; синтаксис упрощён ровно настолько, чтобы стих оставался понятным при чтении вслух.
