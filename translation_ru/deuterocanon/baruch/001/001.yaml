  text: And these are the words of the book that Baruch son of Neriah[a], son of Maaseiah, son of Zedekiah, son of Hasadiah, son of Hilkiah, wrote in Babylon,
translation:
  language: ru
  text: И вот слова книги, которые написал в Вавилоне Варух, сын Нирии, сына Маасеи, сына Седекии, сына Асадии, сына Хелкии,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ΚΑΙ οὗτοι
  choice: И вот
  rationale: Сохраняет присоединительное καί и естественно передаёт указательное οὗτοι в начале повествования.
- source_word: οἱ λόγοι τοῦ βιβλίου
  choice: слова книги
  rationale: Буквально и ясно передаёт содержание написанной книги, не расширяя λόγοι до «повествования» или «событий».
- source_word: οὓς ἔγραψεν
  choice: которые написал
  rationale: Передаёт относительное придаточное и простой факт завершённого написания без добавления значения предпрошедшего времени.
- source_word: Βαροὺχ
  choice: Варух
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: υἱὸς
  choice: сын
  rationale: Повторяющаяся родословная формула сохранена прямо, без ослабления до значения «потомок».
- source_word: Νηρίου
  choice: Нирии
  rationale: Устоявшаяся русская библейская передача семитской формы имени.
- source_word: Μαασαίου
  choice: Маасеи
  rationale: Русская передача предполагаемой семитской формы имени, а не грецизированного окончания.
- source_word: Σεδεκίου
  choice: Седекии
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: Ἀσαδίου
  choice: Хасадии
  rationale: Передаёт общепринятую семитскую форму имени; прямое чтение греческой формы «Асадия» отмечено в сноске.
- source_word: Χελκίου
  choice: Хелкии
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: ἐν Βαβυλῶνι
  choice: в Вавилоне
  rationale: Прямо передаёт место написания; обстоятельство перенесено ближе к глаголу ради естественного русского порядка слов.
theological_decisions:
- issue: Формы родословных имён в греческой второканонической книге
  choice: 'Использовать традиционные русские библейские формы семитских имён: Нирия, Маасея, Седекия, Хасадия, Хелкия'
  alternative: 'Передать имена непосредственно по греческим формам: Нерий, Маасай, Седекий, Асадий, Хелкий'
  rationale: Так имена остаются узнаваемыми в русской библейской традиции, при этом существенное расхождение в форме Ἀσαδίου прозрачно отмечено в сноске. Решение носит текстово-переводческий, а не конфессиональный характер.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Союзно-указательное начало «И вот» сохраняет связь с последующим рассказом; длинная родословная цепочка оставлена без упрощения. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
