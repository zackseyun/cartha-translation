lexical_decisions:
- source_word: βασιλεῦσιν
  choice: царями
  rationale: Прямой и естественный эквивалент для обозначения монархов; дательный падеж обусловлен синтаксисом продолжающегося перечня.
- source_word: ἄρχουσιν
  choice: правителями
  rationale: Передаёт широкое обозначение лиц, наделённых властью, не сужая его до конкретной должности.
- source_word: ἱερεῦσιν
  choice: священниками
  rationale: Устоявшийся русский эквивалент греческого обозначения служителей культа.
- source_word: προφήταις
  choice: пророками
  rationale: Прямой и традиционный эквивалент без контекстуальных оснований для иной передачи.
- source_word: πατράσιν
  choice: отцами
  rationale: Сохраняет мужской родственный термин оригинала и его традиционное общинно-заветное звучание; в данном контексте возможно значение «предки», отмеченное в сноске.
- source_word: ἡμῶν
  choice: нашими
  rationale: Притяжательное местоимение сохранено при каждом члене перечня, как в греческом тексте, ради ритма и подчёркнутой общинной сопричастности.
- source_word: καί
  choice: и
  rationale: Повтор союза сохранён, чтобы передать накопительную структуру продолжающегося перечня.
theological_decisions:
- issue: Передача πατράσιν в контексте общинного исповедания
  choice: отцами
  alternative: предками
  rationale: Основной текст сохраняет буквальный родственный термин и его заветно-исторический оттенок, не исключая более широкого значения «предки», которое указано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Повтор «нашими» и союза «и» намеренно сохранён. Начальное «и перед» отражает продолжение синтаксической конструкции предыдущего стиха.
