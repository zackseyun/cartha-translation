  text: And each of us went off in the intent of his evil heart[a], to serve other gods, to do evil in the sight of the Lord our God.
translation:
  language: ru
  text: И каждый из нас ушёл, следуя злому помышлению своего сердца[a], чтобы служить иным богам и делать зло пред очами Господа, Бога нашего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «руководствуясь помышлением своего злого сердца». Греческое выражение подчёркивает внутренний образ мыслей или намерение.'
    reason: Лексическая неоднозначность слова διάνοια и конструкции ἐν διανοίᾳ.
lexical_decisions:
- source_word: ᾠχόμεθα
  choice: пошёл
  rationale: Форма οἴχομαι обозначает уход или удаление; «пошёл» естественно передаёт движение по пути непослушания, не добавляя отсутствующей в тексте детали.
- source_word: ἕκαστος
  choice: каждый из нас
  rationale: 'Сохраняет распределительный смысл: общее признание относится к каждому человеку в отдельности.'
- source_word: ἐν διανοίᾳ καρδίας αὐτοῦ τῆς πονηρᾶς
  choice: за помыслами своего злого сердца
  rationale: «Помыслы» передают внутреннюю направленность διάνοια, а «сердце» сохраняет библейское обозначение внутреннего человека; конструкция по-русски естественно выражает следование внутренним злым побуждениям.
- source_word: ἐργάζεσθαι θεοῖς ἑτέροις
  choice: служить иным богам
  rationale: При дательном θεοῖς глагол здесь выражает деятельность на службе кому-либо; в контексте отступничества речь идёт об идольском служении.
- source_word: ποιῆσαι τὰ κακά
  choice: делать зло
  rationale: Кратко и прямо передаёт субстантивированное «злое» во множественном числе, сохраняя нравственную оценку.
- source_word: κατʼ ὀφθαλμοὺς Κυρίου θεοῦ ἡμῶν
  choice: пред очами Господа, Бога нашего
  rationale: Сохраняет образ глаз и привычный библейский смысл поступков, совершаемых перед Богом и подлежащих Его оценке.
- source_word: Κυρίου
  choice: Господа
  rationale: В данном контексте титул относится к Богу Израиля; «Господь» является точным и устойчивым русским соответствием.
theological_decisions:
- issue: Значение служения иным богам
  choice: служить иным богам
  alternative: трудиться для иных богов
  rationale: Контекст ясно указывает на идолопоклонническое служение, тогда как буквальное «трудиться» по-русски затемняет религиозный смысл.
- issue: Передача κύριος применительно к Богу Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет заветный и библейский характер наименования, не привнося дополнительного оттенка.
- issue: Связь внутреннего намерения с поступком
  choice: пошёл за помыслами своего злого сердца
  alternative: пошёл, руководствуясь намерением своего злого сердца
  rationale: Выбранный вариант сохраняет напряжение между внутренней направленностью и последующим действием, не сводя διάνοια исключительно к заранее составленному плану.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Формулы «иные боги» и «пред очами» сохранены как понятные устойчивые библейские выражения; синтаксис упрощён для ясного чтения.
