base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/007.yaml
  text: and they sent to Jerusalem[a], to Jehoiakim son of Hilkiah, son of Shallum, the priest, and to the priests, and to all the people who were found with him in Jerusalem,
translation:
  language: ru
  text: И послали в Иерусалим к священнику Иоакиму, сыну Хелкии, который был сыном Салома, к священникам и ко всему народу, находившемуся с ним[a] в Иерусалиме,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально «с ним» — в единственном числе. К кому именно относится местоимение, в этом стихе прямо не указано; возможен и более общий смысл: люди, находившиеся там.'
    reason: Сохранение грамматического числа и подлинной неясности исходного текста.
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: послали
  rationale: Простой аорист глагола «посылать»; дополнение, как и в греческом тексте, здесь не уточняется.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: Предлог εἰς обозначает направление движения; с названием города естественно по-русски «в Иерусалим».
- source_word: πρὸς Ἰωακεὶμ ... τὸν ἱερέα
  choice: к священнику Иоакиму, сыну Хелкии, сына Салома
  rationale: πρός указывает на адресата, а ἱερεύς означает именно «священник», не «первосвященник». Положение слова «священник» перед именем естественно для русского языка и ясно связывает его с Иоакимом.
- source_word: τοὺς ἱερεῖς
  choice: к священникам
  rationale: Точная и естественная передача формы множественного числа ἱερεύς.
- source_word: πάντα τὸν λαόν
  choice: ко всему народу
  rationale: Сохранено собирательное единственное число греческого выражения.
- source_word: τοὺς εὑρεθέντας
  choice: находившемуся
  rationale: Причастие буквально означает «оказавшемуся / найденному», но в данном контексте естественно выражает присутствие людей в этом месте; «находившемуся» сохраняет связь с εὑρίσκω без неестественного русского оборота «которые были найдены».
- source_word: μετ᾽ αὐτοῦ
  choice: с ним
  rationale: Сохранено единственное число местоимения αὐτοῦ; неясный антецедент не нормализован во множественное число.
