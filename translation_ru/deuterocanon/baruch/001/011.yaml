base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/011.yaml
  text: And pray for the life of Nebuchodonosor king of Babylon[a], and for the life of Baltasar his son[b], so that their days may be like the days of heaven upon the earth.
translation:
  language: ru
  text: И молитесь о жизни Навуходоносора, царя Вавилона, и о жизни Валтасара, его сына, чтобы дни их были как дни неба над землёй.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть, вероятно, чтобы жизнь их была долгой, как долго небо пребывает над землёй. В греческом тексте это пожелание выражено ярким образом: «дни неба над землёй».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεύξασθε
  choice: молитесь
  rationale: Аористный императив множественного числа передаёт прямое побуждение; «молитесь» естественно и точно сохраняет его силу.
- source_word: περὶ τῆς ζωῆς
  choice: о жизни
  rationale: Оборот περί с родительным падежом обозначает предмет или того, ради кого совершается молитва. «О жизни» сохраняет явное значение ζωή, не расширяя его до общего «благополучия».
- source_word: Ναβουχοδονοσὸρ
  choice: Навуходоносор
  rationale: Передаёт греческую форму имени и вместе с тем соответствует укоренившемуся русскому библейскому написанию.
- source_word: Βαλτασὰρ
  choice: Валтасар
  rationale: Прямая и естественная русская передача греческой формы Βαλτασάρ.
- source_word: ἵνα ὦσιν αἱ ἡμέραι αὐτῶν
  choice: чтобы дни их были
  rationale: Союз «чтобы» ясно передаёт целевое значение ἵνα, а порядок «дни их» поддерживает возвышенный, но понятный библейский регистр.
- source_word: ὡς αἱ ἡμέραι τοῦ οὐρανοῦ ἐπὶ τῆς γῆς
  choice: как дни неба над землёй
  rationale: Формулировка сохраняет необычный образ и возможный библейский отзвук, не сводя его к поясняющему пересказу «очень долго».
theological_decisions:
- issue: Передать заключительный образ буквально или истолковать его как пожелание долголетия
  choice: 'Сохранить образ: «чтобы дни их были как дни неба над землёй»'
  alternative: «чтобы они жили на земле так же долго, как существует небо»
  rationale: Греческий текст выражается метафорически. Сохранение образа удерживает его поэтическое и богословское напряжение, тогда как парафраз однозначно истолковал бы подразумеваемый смысл.
- issue: Нормализовать ли царские имена по иной языковой традиции
  choice: 'Передать формы греческого свидетеля: «Навуходоносор» и «Валтасар»'
  alternative: Использовать формы, реконструированные непосредственно по еврейской или арамейской традиции
  rationale: Перевод опирается прежде всего на данный греческий текст; выбранные русские формы точно отражают его и остаются узнаваемыми.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным, а заключительная метафора намеренно не сглажена.
