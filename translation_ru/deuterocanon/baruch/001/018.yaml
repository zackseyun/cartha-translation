    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπειθήσαμεν αὐτῷ
  choice: мы не повиновались Ему
  rationale: Аорист ἀπειθέω выражает неповиновение или отказ повиноваться; краткая активная формулировка естественна по-русски и сохраняет прямое дополнение αὐτῷ.
- source_word: οὐκ ἠκούσαμεν τῆς φωνῆς
  choice: не слушали голоса
  rationale: Передаёт буквальный образ слушания голоса и одновременно допускает подразумеваемое в библейском обороте непослушание, не сводя выражение только к одному из этих смыслов.
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: Господа, Бога нашего
  rationale: Сохраняет греческий божественный титул κύριος и естественное для русского библейского регистра приложение «Бога нашего».
- source_word: πορεύεσθαι
  choice: ходить
  rationale: Сохраняет исходную метафору пути как образа поведения; вариант «жить» был бы яснее, но более истолковывающим.
- source_word: τοῖς προστάγμασιν
  choice: по повелениям
  rationale: πρόσταγμα обозначает предписанное или приказанное. «Повеления» передаёт властный и нормативный оттенок, оставаясь понятным современному читателю.
- source_word: ἔδωκεν κατὰ πρόσωπον ἡμῶν
  choice: которые Он поставил перед нами
  rationale: 'Идиоматическая русская передача сочетания «дал перед нашим лицом»: повеления были предложены народу как обязательные для исполнения.'
theological_decisions:
- issue: Передача κύριος в греческом тексте Варуха
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Непосредственный источник — греческий текст с κύριος, а не еврейская строка с видимым тетраграмматоном; обычное «Господь» следует первичности исходного языка.
- issue: Выражать ли послушание прямо в οὐκ ἠκούσαμεν τῆς φωνῆς
  choice: не слушали голоса
  alternative: не послушались
  rationale: Исходный оборот содержит образ слушания, хотя в контексте подразумевает повиновение. Основной текст сохраняет и образ, и смысловую напряжённость, а примечание поясняет возможную передачу.
- issue: Сохранять ли метафору πορεύεσθαι
  choice: ходить
  alternative: жить / поступать
  rationale: «Ходить» сохраняет традиционную этическую метафору поведения, не заменяя её объясняющей парафразой.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Заглавные местоимения при обращении к Богу соответствуют принятому русскому религиозному регистру. Синтаксис сохраняет зависимость инфинитива «ходить» от выражения «слушали голоса», не превращая её в отдельное утверждение.
