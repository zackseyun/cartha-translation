  text: И собрали серебро — каждый сколько мог[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сколько могла рука каждого», то есть сообразно возможностям или средствам каждого.'
    reason: Сноска сохраняет образное выражение оригинала, которое в основном тексте передано естественным русским оборотом.
lexical_decisions:
- source_word: συνήγαγον
  choice: собрали
  rationale: Аорист συνάγω обозначает завершённый сбор; в контексте пожертвований «собрали» естественно и точно передаёт действие.
- source_word: ἀργύριον
  choice: серебро
  rationale: Слово буквально означает серебро и может обозначать серебряные деньги. «Серебро» сохраняет предметность греческого текста, не сводя его смысл к более общему «деньги».
- source_word: καθὰ ἑκάστου ἠδύνατο ἡ χείρ
  choice: каждый сколько мог
  rationale: Оборот буквально говорит о том, сколько «могла рука» каждого, то есть о личных возможностях или средствах. Русское «каждый сколько мог» естественно передаёт распределительный и соразмерный смысл.
