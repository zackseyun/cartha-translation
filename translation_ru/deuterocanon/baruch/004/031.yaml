lexical_decisions:
- source_word: δείλαιοι
  choice: Горе тем
  rationale: В данном контексте предикативное δείλαιοι выражает скорбно-обличительный возглас о жалкой участи виновных. Русское «Горе тем» естественно передаёт этот тон, не превращая слово в явно сформулированное проклятие.
- source_word: οἱ σε κακώσαντες
  choice: кто причинил тебе зло
  rationale: Причастие κακώσαντες обозначает тех, кто сделал зло или нанёс вред. Формулировка «причинил тебе зло» сохраняет широту значения и звучит естественно и достойно.
- source_word: ἐπιχαρέντες
  choice: радовался
  rationale: Глагол означает радоваться чему-либо, в особенности чужой беде. Прямой эквивалент «радовался» сохраняет исходную формулировку, тогда как оттенок злорадства раскрывается контекстом и сноской.
- source_word: τῇ σῇ πτώσει
  choice: твоему падению
  rationale: πτῶσις буквально означает «падение» и здесь метафорически указывает на гибельное поражение Иерусалима. «Твоему падению» близко к греческому и понятно по-русски.
