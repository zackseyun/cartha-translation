base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/025.yaml
  text: Children[a], endure patiently the wrath that has come upon you from God. The enemy pursued you, but you will soon see his destruction, and you will step upon their necks.
translation:
  language: ru
  text: Дети, терпеливо переносите гнев, пришедший на вас от Бога. Враг преследовал тебя, и вскоре ты увидишь его гибель и наступишь на их шеи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «его гибель… их шеи». Враг сначала обозначен в единственном числе, а затем употреблено множественное число; вероятно, он представлен одновременно как единый противник и как вражеская сила в целом.'
    reason: Сохранён переход в греческом тексте от единственного числа к множественному.
lexical_decisions:
- source_word: τέκνα
  choice: Дети
  rationale: Форма обращения во множественном числе передаёт тёплый, семейный тон, не добавляя отсутствующего в греческом местоимения «мои».
- source_word: μακροθυμήσατε
  choice: терпеливо переносите
  rationale: Аористный императив призывает стойко и терпеливо выдерживать бедствие; сочетание естественно звучит по-русски и сохраняет деятельный оттенок глагола.
- source_word: τὴν παρὰ τοῦ θεοῦ ἐπελθοῦσαν ὑμῖν ὀργήν
  choice: гнев, постигший вас от Бога
  rationale: Сохраняются и образ постигшего людей гнева, и прямо выраженный источник — Бог; формулировка не подменяет «гнев» толковательным словом «наказание».
- source_word: κατεδίωξέν
  choice: преследовал
  rationale: Передаёт враждебное гонение или погоню, не сужая смысл до одной конкретной формы притеснения.
- source_word: ἀπώλειαν
  choice: гибель
  rationale: В контексте участи врага «гибель» естественно и сильно передаёт его уничтожение или окончательное крушение.
- source_word: ἐν τάχει
  choice: вскоре
  rationale: Передаёт временное значение скорого наступления события, а не образ быстроты действия.
- source_word: ἐπὶ τραχήλους αὐτῶν ἐπιβήσῃ
  choice: наступишь на их шеи
  rationale: Сохраняет конкретный образ победы над поверженными врагами и грамматический переход к множественному числу.
theological_decisions:
- issue: Участие Бога в постигшем народ страдании
  choice: «гнев, постигший вас от Бога»
  alternative: «постигшее вас наказание» или упоминание гнева без слов «от Бога»
  rationale: Греческий текст прямо связывает гнев с Богом. Перевод сохраняет эту богословскую напряжённость, не смягчая её и не превращая гнев в истолкованное понятие наказания.
- issue: Образ победы над врагами
  choice: «наступишь на их шеи»
  alternative: «одержишь над ними победу»
  rationale: Телесный образ покорения выражен в источнике прямо; его сохранение передаёт силу текста и не заменяет метафору отвлечённым объяснением.
- issue: Переход от единственного врага к множеству
  choice: «его гибель… их шеи»
  alternative: последовательное единственное или множественное число
  rationale: Греческий текст говорит сначала о враге и «его» гибели в единственном числе, а затем об «их» шеях во множественном; этот смысловой сдвиг не сглажен.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной интонацией. Сохранены смена обращения с множественного числа («Дети… вас») на единственное («тебя… ты») и последующий переход от единственного врага к множеству; союз καί передан нейтральным «и», без добавления противительного оттенка.
