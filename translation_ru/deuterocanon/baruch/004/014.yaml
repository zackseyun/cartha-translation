  text: Let the neighboring women of Zion come, let the neighboring women come, and remember the captivity of my sons and daughters, which the Eternal One brought upon them.
translation:
  language: ru
  text: Пусть придут соседки Сиона[a], пусть придут соседки[b] и вспомнят плен моих сыновей и дочерей, который навёл на них Вечный.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришлые жительницы Сиона», «женщины, живущие возле Сиона». Греческое πάροικοι может означать как живущих рядом, так и пришлых либо временных жительниц.'
    reason: lexical_alternative
  - marker: b
    text: Греческий текст дважды повторяет призыв «пусть придут соседки».
    reason: repetition
lexical_decisions:
- source_word: ἐλθάτωσαν
  choice: пусть придут
  rationale: Аористный императив третьего лица передан естественной русской побудительной конструкцией.
- source_word: αἱ πάροικοι
  choice: соседки
  rationale: Форма с артиклем женского рода множественного числа указывает на женщин; πάροικος может обозначать живущего поблизости либо пришельца. В основном тексте выбрано контекстуально естественное «соседки», а неоднозначность отмечена в сноске.
- source_word: Σειών
  choice: Сиона
  rationale: Устоявшаяся русская форма библейского топонима; родительный падеж обусловлен сочетанием «соседки Сиона».
- source_word: μνήσθητε
  choice: вспомнят
  rationale: Императив согласован с продолжающейся конструкцией «пусть придут... и вспомнят»; значение глагола передано прямо.
- source_word: τὴν αἰχμαλωσίαν
  choice: о пленении
  rationale: Слово обозначает захват в плен или состояние плена. «Пленение» сохраняет событийный оттенок и естественно сочетается с глаголом «вспомнить».
- source_word: τῶν υἱῶν μου καὶ θυγατέρων
  choice: моих сыновей и дочерей
  rationale: Сохранено явное называние обеих групп без обобщения словом «детей».
- source_word: ἐπήγαγεν
  choice: навёл на них
  rationale: Передаёт буквальную каузативную направленность «привёл/навёл на них», не усиливая её до «покарал» или «обрёк».
- source_word: ὁ αἰώνιος
  choice: Вечный
  rationale: Субстантивированное прилагательное служит титулом Бога; «Вечный» сохраняет форму эпитета и его богословский вес.
theological_decisions:
- issue: Божественный титул ὁ αἰώνιος
  choice: Вечный
  alternative: Предвечный; Вечно Сущий
  rationale: Греческий текст употребляет эпитет, а не личное имя. «Вечный» — ясный и традиционно понятный русский титул, не подменяющий исходное выражение иным именем Бога.
- issue: Значение αἱ πάροικοι в контексте
  choice: соседки
  alternative: пришелицы; живущие рядом женщины
  rationale: Женский род формы сохранён, а контекст призыва к Сиону благоприятствует значению живущих по соседству. Возможное значение временных или пришлых жительниц вынесено в сноску.
- issue: Божественная причинность пленения
  choice: которое навёл на них Вечный
  alternative: которому Вечный их подверг
  rationale: Формулировка сохраняет прямое утверждение греческого текста о том, что пленение было наведено Богом, не смягчая и не объясняя это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический повтор оригинала сохранён; женский род αἱ πάροικοι выражен словом «соседки». Форма «Вечный» оформлена с прописной буквы как божественный титул.
