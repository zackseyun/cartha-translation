  text: И увели тех, кого любила вдова, а её оставили без дочерей, опустошённой и одинокой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а среди дочерей они сделали опустошённой единственную». Греческое τὴν μόνην буквально означает «единственную» или «одинокую»; синтаксис допускает более буквальное понимание, но по смыслу речь идёт о вдове, оставшейся одна вследствие утраты дочерей.'
