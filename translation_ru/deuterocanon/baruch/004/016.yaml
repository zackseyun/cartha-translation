lexical_decisions:
- source_word: ἀπήγαγον
  choice: увели
  rationale: Глагол означает увести или забрать; «увели» естественно передаёт насильственное удаление людей, не уточняя сверх текста, что именно имеется в виду плен.
- source_word: τοὺς ἀγαπητοὺς
  choice: любимых детей
  rationale: Субстантивированное прилагательное обозначает любимых людей. В контексте речи персонифицированной матери «детей» ясно передаёт подразумеваемое отношение, сохраняя эмоциональную силу множественного числа.
- source_word: τῆς χήρας
  choice: вдовы
  rationale: Родительный падеж сохранён как естественное русское определение; образ вдовы не заменён пояснением о Иерусалиме или Сионе.
- source_word: ἀπὸ τῶν θυγατέρων
  choice: среди дочерей
  rationale: Оборот с ἀπό и родительным обозначает выделение или отделение из группы; сочетание с τὴν μόνην допускает смысл «единственную среди дочерей».
- source_word: τὴν μόνην
  choice: её, единственную
  rationale: Форма женского рода единственного числа буквально указывает на «единственную» или «оставшуюся одну» и грамматически может относиться к вдове как объекту глагола.
- source_word: ἠρήμωσαν
  choice: оставили в запустении
  rationale: Глагол означает сделать пустынной, опустошить, лишить людей. Формулировка передаёт результирующее состояние, не сводя значение только к эмоциональному одиночеству.
theological_decisions:
- issue: Персонификация вдовы и дочерей
  choice: Сохранить семейный образ без прямой замены вдовы на Иерусалим или Сион.
  alternative: Назвать Иерусалим или Сион непосредственно в основном тексте.
  rationale: Греческий текст говорит поэтическим языком персонификации; истолковывающая замена ослабила бы образ и сняла бы намеренную метафоричность.
- issue: Синтаксическая неоднозначность τὴν μόνην
  choice: 'Связать «единственную» с вдовой: её оставили единственной среди дочерей и в запустении.'
  alternative: 'Передать общий результирующий смысл: «среди дочерей оставили её опустошённой и одинокой».'
  rationale: Женский винительный падеж τὴν μόνην естественно согласуется с подразумеваемым объектом-вдовой, однако порядок слов допускает более идиоматическое понимание состояния одиночества; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической персонификации. Синтаксис намеренно несколько приподнят, но понятен; сноска сохраняет реальную неоднозначность греческого текста.
