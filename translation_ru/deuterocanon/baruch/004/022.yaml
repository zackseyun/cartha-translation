base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/022.yaml
  text: For I have hoped in the Eternal One for your salvation, and joy has come to me from the Holy One because of the mercy that will quickly come to you from your eternal Savior.
translation:
  language: ru
  text: Ибо я уповала на Вечного, ожидая вашего спасения, и от Святого пришла ко мне радость о милости, которая вскоре придёт к вам от вашего вечного Спасителя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤλπισα ἐπὶ τῷ αἰωνίῳ τὴν σωτηρίαν ὑμῶν
  choice: я уповала на Вечного, ожидая вашего спасения
  rationale: «Уповала на Вечного» естественно передаёт конструкцию ἐλπίζω ἐπί с дательным; причастный оборот сохраняет отдельное упоминание σωτηρίαν ὑμῶν, не делая спасение непосредственным объектом глагола «уповать».
- source_word: παρὰ τοῦ ἁγίου
  choice: от Святого
  rationale: Субстантивированное θεонимическое обозначение передано кратко и с прописной буквы.
- source_word: ἐλεημοσύνῃ
  choice: милости
  rationale: В данном контексте речь идёт о милости, исходящей от Бога, а не о человеческой милостыне.
- source_word: ἐν τάχει
  choice: вскоре
  rationale: Передаёт временной смысл скорого наступления события естественным современным русским языком.
- source_word: τοῦ αἰωνίου σωτῆρος ὑμῶν
  choice: вашего вечного Спасителя
  rationale: Сохраняет определение «вечный» и личный титул Спасителя; прописная буква указывает на божественное именование без добавления отсутствующих в тексте уточнений.
theological_decisions:
- issue: Соотношение надежды на Вечного и спасения адресатов
  choice: «уповала на Вечного, ожидая вашего спасения»
  alternative: «надеялась на Вечного ради вашего спасения»
  rationale: Греческая конструкция синтаксически сжата. Выбранный вариант ясно сохраняет и основание надежды — Вечного, и её содержание — спасение адресатов, не утверждая более узкой причинной связи.
- issue: Значение ἐλεημοσύνη
  choice: божественная «милость»
  alternative: «милостыня»
  rationale: Ближайший контекст описывает то, что придёт от вечного Спасителя; поэтому здесь имеется в виду проявление Божьего милосердия.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Женский род «уповала» соответствует говорящей в контексте олицетворённой матери/Иерусалиму. Порядок фразы слегка перестроен ради естественности русского синтаксиса.
