  text: For I sent you out with mourning and weeping[a], but God will give you back to me with joy and gladness forever.
translation:
  language: ru
  text: Ведь я отправила вас прочь со скорбью и плачем, но Бог вернёт вас мне с радостью и ликованием навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέπεμψα
  choice: я отпустила вас
  rationale: ἐκπέμπω означает «посылать прочь, отпускать». В контексте олицетворённого Иерусалима форма женского рода естественно обозначает говорящую мать; «отпустила» передаёт разлуку, не усиливая её до формального изгнания.
- source_word: μετὰ πένθους καὶ κλαυθμοῦ
  choice: со скорбью и плачем
  rationale: πένθος обозначает скорбь, особенно выраженную в оплакивании утраты, а κλαυθμός — плач. Парная формула сохраняет два близких, но не тождественных образа переживания.
- source_word: ἀποδώσει ... μοι
  choice: вернёт ... мне
  rationale: ἀποδίδωμι с дательным μοι здесь имеет смысл возвращения детей говорящей матери. «Вернёт вас мне» ясно сохраняет как значение глагола, так и явное «мне».
- source_word: ὁ θεὸς
  choice: Бог
  rationale: В современном русском контексте артикль отдельно не передаётся; имя нарицательное употреблено как обозначение единого Бога.
- source_word: μετὰ χαρμοσύνης καὶ εὐφροσύνης
  choice: с радостью и ликованием
  rationale: Оба существительных обозначают радость, но второе допускает оттенок праздничного веселия. «Радость и ликование» сохраняет усилительную пару без неестественного повтора.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Устойчивая формула выражает непреходящую длительность; «навеки» кратко, ясно и соответствует возвышенному регистру.
theological_decisions:
- issue: Говорящая и образ возвращения
  choice: 'Сохранено первое лицо олицетворённого Иерусалима-матери: «я отпустила вас» и «Бог вернёт вас мне».'
  alternative: Безличное «Бог восстановит вас» или «Бог возвратит вас».
  rationale: Греческий текст прямо содержит μοι («мне»), а контекст представляет Иерусалим матерью. Сохранение этой формулировки удерживает семейный и общинный образ текста и не сводит его к отвлечённому восстановлению.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис остаётся прозрачным; «ликование» поддерживает торжественную кульминацию, не создавая архаического звучания.
