base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/012.yaml
  text: Let no one gloat over me[a], a widow and abandoned by many; I have been left desolate because of the sins of my children, because they turned aside from the law of God.
translation:
  language: ru
  text: Пусть никто не злорадствует надо мной[a] — вдовой, покинутой многими. Я была разорена из-за грехов моих детей, потому что они уклонились от закона Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть никто не радуется моей беде». Греческий глагол означает радость по поводу постигшего другого несчастья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ἐπιχαιρέτω μοι
  choice: Пусть никто не злорадствует надо мной
  rationale: Отрицательная форма передаёт запрет или пожелание, а ἐπιχαίρω обозначает радость по поводу чужой беды; «злорадствовать» естественно и точно выражает этот оттенок.
- source_word: τῇ χήρᾳ
  choice: вдовой
  rationale: Форма согласуется с подразумеваемой говорящей и сохраняет её прямое самоописание без поясняющей вставки «Иерусалим» или «Сион».
- source_word: καταλειφθείσῃ ὑπὸ πολλῶν
  choice: покинутой многими
  rationale: Сохраняет пассивное значение причастия и неопределённое «многими», не усиливая его до «всеми».
- source_word: ἠρημώθην
  choice: Я опустошена
  rationale: Пассивная форма и результирующее состояние переданы кратко; «опустошена» уместно как для олицетворённого города, так и для переживающей утрату матери.
- source_word: διὰ τὰς ἁμαρτίας τῶν τέκνων μου
  choice: из-за грехов моих детей
  rationale: διά с винительным выражает причину; τέκνα не следует сужать до «сыновей».
- source_word: ἐξέκλιναν ἐκ νόμου θεοῦ
  choice: они уклонились от закона Бога
  rationale: «Уклонились» сохраняет образ отклонения от пути или нормы, а «закон Бога» передаёт исходную конструкцию без конфессионального уточнения.
theological_decisions:
- issue: Олицетворение Иерусалима/Сиона как овдовевшей и оставленной матери
  choice: Сохранено женское самоописание от первого лица без прямого наименования говорящей.
  alternative: Добавить в основной текст «Иерусалим» или «Сион».
  rationale: В самом греческом стихе говорящая не названа; её личность устанавливается контекстом. Экспликация устранила бы намеренную образность текста.
- issue: Причинная связь опустошения с грехами детей
  choice: 'Передано прямо: «из-за грехов моих детей».'
  alternative: Ослабить до «в связи с» либо истолковать как указание на конкретный механизм наказания.
  rationale: διά с винительным ясно обозначает причину, однако стих не раскрывает её богословский механизм; перевод не должен добавлять такое объяснение.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Тире отделяет два согласованных определения, относящихся к говорящей; лексика сохраняет плачевный и поэтический характер стиха.
