base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/020.yaml
  text: I have taken off the robe of peace[a], but I have put on the sackcloth of my supplication[b]; I will cry out to the Eternal One in my days.
translation:
  language: ru
  text: Я сняла с себя одеяние мира и надела вретище[a] моей мольбы; в дни мои я буду взывать к Вечному[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вретище — грубая одежда, которую надевали в знак скорби, покаяния или тяжёлого бедствия.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «к Вечному» или «к Вечно Сущему». Греческое прилагательное «вечный» употреблено здесь самостоятельно как божественный титул.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδυσάμην
  choice: сняла с себя
  rationale: Средний залог передаёт снятие одежды с себя; женский род обусловлен тем, что в контексте говорит олицетворённый Иерусалим.
- source_word: τὴν στολὴν τῆς εἰρήνης
  choice: одеяние мира
  rationale: «Одеяние» сохраняет возвышенный оттенок στολή и метафору одежды, а «мира» передаёт εἰρήνης без сужения смысла до отсутствия войны.
- source_word: ἐνεδυσάμην
  choice: надела
  rationale: Сохраняет прямой контраст со «сняла с себя» и образ переодевания.
- source_word: σάκκον
  choice: вретище
  rationale: Традиционное и точное обозначение грубой одежды, которую носили в знак скорби, покаяния или бедствия; культурный смысл пояснён в сноске.
- source_word: τῆς δεήσεώς μου
  choice: моей мольбы
  rationale: δέησις означает настойчивую, просительную молитву; «мольба» передаёт её напряжённость и сохраняет образ «вретища мольбы».
- source_word: κεκράξομαι
  choice: буду взывать
  rationale: Передаёт громкое, настойчивое обращение κράζω и естественно сочетается с направлением «к Вечному».
- source_word: τὸν αἰώνιον
  choice: к Вечному
  rationale: Субстантивированное прилагательное сохранено как особый божественный титул, без подстановки слов «Бог» или «Господь».
- source_word: ἐν ταῖς ἡμέραις μου
  choice: в дни мои
  rationale: Близко передаёт греческую временную формулу и не добавляет отсутствующего в тексте значения «во все дни».
theological_decisions:
- issue: Передача божественного титула τὸν αἰώνιον
  choice: Вечному
  alternative: Предвечному; Вечно Сущему
  rationale: Греческий текст содержит субстантивированное прилагательное «вечный», а не θεός или κύριος. «Вечному» сохраняет необычный титул и его смысловую открытость, не заменяя его более привычным божественным именованием.
- issue: Грамматический род говорящего
  choice: 'женский род: «сняла… надела»'
  alternative: Перестройка фразы без выражения рода
  rationale: Греческие аористные формы не выражают рода, но в ближайшем контексте говорит олицетворённый Иерусалим как мать; русский язык требует выразить род в прошедшем времени. Выбран женский род, следующий контексту, а не дополнительному богословскому толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм «сняла… надела» и метафоры одежды сохранены; редкое слово «вретище» пояснено. Формула «в дни мои» оставлена без усиления до «во все дни мои».
