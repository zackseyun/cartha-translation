base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/024.yaml
  text: For just as the neighbors of Zion have now seen your captivity[b][a], so they will soon see the salvation from your God that will come upon you with great glory and the splendor of the Eternal.
translation:
  language: ru
  text: Ибо как теперь живущие по соседству с Сионом увидели ваш плен, так вскоре они увидят спасение[a] от вашего Бога, которое придёт к вам с великой славой и сиянием Вечного[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавление». Греческое слово может означать спасение, освобождение или избавление.'
    reason: lexical_alternative
  - marker: b
    text: То есть Вечного Бога; в греческом тексте употреблено субстантивированное прилагательное «Вечный».
    reason: lexical_clarification
lexical_decisions:
- source_word: οἱ πάροικοι Σειὼν
  choice: живущие по соседству с Сионом
  rationale: πάροικοι здесь естественнее всего обозначает людей или народы, живущие рядом с Сионом; перевод сохраняет пространственный смысл, не вводя значения правового статуса пришельцев.
- source_word: αἰχμαλωσίαν
  choice: плен
  rationale: Слово обозначает плен или состояние уведённых в плен; краткое русское «плен» конкретнее, чем более широкое «изгнание».
- source_word: ἐν τάχει
  choice: вскоре
  rationale: В данном обещании выражение указывает на близость события во времени.
- source_word: σωτηρίαν
  choice: спасение
  rationale: «Спасение» сохраняет широкий библейский смысл σωτηρία, хотя в ближайшем контексте речь также идёт об избавлении из плена.
- source_word: παρὰ τοῦ θεοῦ ὑμῶν
  choice: от вашего Бога
  rationale: 'παρά с родительным падежом обозначает источник: спасение исходит от их Бога.'
- source_word: ἐπελεύσεται ὑμῖν
  choice: придёт к вам
  rationale: Передаёт направленное приближение обещанного спасения естественным современным русским языком; более буквальное «найдёт на вас» здесь звучало бы угрожающе.
- source_word: μετὰ δόξης μεγάλης
  choice: с великой славой
  rationale: Сохраняет обычное библейское значение δόξα и возвышенный тон.
- source_word: λαμπρότητος
  choice: сиянием
  rationale: λαμπρότης означает яркость, сияние или великолепие; «сияние» отчётливо передаёт образ света и не дублирует «славу».
- source_word: τοῦ αἰωνίου
  choice: Вечного
  rationale: Субстантивированное прилагательное выступает как именование Бога; «Вечного» сохраняет эту титульную функцию, не добавляя отсутствующего существительного.
theological_decisions:
- issue: Значение σωτηρία в контексте возвращения из плена
  choice: спасение
  alternative: избавление
  rationale: Непосредственный контекст допускает «избавление», но «спасение» сохраняет более широкий богословский диапазон греческого слова и остаётся понятным в контексте Божьего освобождения.
- issue: τοῦ αἰωνίου как божественный титул
  choice: Вечного
  alternative: вечного Бога
  rationale: Греческий текст использует субстантивированное прилагательное. Перевод «Вечного» сохраняет титульность и не вставляет повторно слово «Бог», которого в этой части фразы нет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм «как… так…» сохранён; двусмысленность σωτηρία отмечена в сноске, а божественный титул передан без добавления существительного в основном тексте.
