base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/018.yaml
  text: For the one who brought these evils upon you will rescue you from the hand of your enemies[a].
translation:
  language: ru
  text: Ибо Тот, Кто навёл на вас эти бедствия[a], избавит вас от руки ваших врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эти несчастья»; греческое τὰ κακὰ здесь может обозначать тяжёлые беды, несчастья или страдания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγαγὼν
  choice: навёл на вас
  rationale: Аористное причастие от ἐπάγω означает «привести, навлечь на кого-либо»; «навёл на вас» естественно передаёт направленность действия и сохраняет прямое указание на действующего.
- source_word: τὰ κακὰ
  choice: эти бедствия
  rationale: В данном контексте κακά обозначает тяжёлые несчастья или бедствия; указательное «эти» передаёт определённый артикль и связь с уже названными страданиями, не приписывая слову исключительно нравственный смысл.
- source_word: ἐξελεῖται
  choice: избавит
  rationale: Будущая форма среднего залога от ἐξαιρέω здесь означает спасение или избавление от опасности и власти врагов; «избавит» соответствует библейскому регистру и понятно современному читателю.
- source_word: ἐκ χειρὸς
  choice: от руки
  rationale: Сохранён устойчивый библейский образ руки как власти и контроля; по-русски сочетание «избавит от руки» остаётся ясным и торжественным.
- source_word: ἐχθρῶν
  choice: врагов
  rationale: Обычное и контекстуально точное соответствие существительному ἐχθροί.
theological_decisions:
- issue: Божественное действие в суде и избавлении
  choice: Один и тот же подразумеваемый Божественный деятель навёл бедствия и впоследствии избавит народ.
  alternative: Смягчить причинность и перевести так, будто бедствия лишь постигли народ без прямого действия Бога.
  rationale: 'Греческая конструкция прямо называет одного деятеля: «Тот, Кто навёл… избавит». Перевод сохраняет богословское напряжение между судом и спасением и не устраняет явную причинность.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавная буква в «Тот, Кто» указывает на подразумеваемого Бога из контекста, не добавляя Его имени; образ «от руки ваших врагов» сохранён как понятная библейская метафора власти.
