  yaml_path: translation/deuterocanon/baruch/004/003.yaml
  text: Do not give your glory to another[b][a], nor what benefits you to a foreign nation.
translation:
  language: ru
  text: Не отдавай другому своей славы[a] и не отдавай чужому народу того, что служит тебе на благо[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чести». Греческое слово δόξα здесь может иметь оба значения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своего благополучия» или «своих преимуществ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δῷς
  choice: Не отдавай
  rationale: Передаёт прямой запрет с μή и аористным сослагательным наклонением. «Отдавай» естественно сочетается с мыслью о передаче принадлежащего адресату, не усиливая глагол до «уступай» или «предавай».
- source_word: ἑτέρῳ
  choice: другому
  rationale: 'Сохраняет краткость и неопределённость греческого ἑτέρῳ: речь идёт о другом лице или коллективном адресате без дальнейшего уточнения.'
- source_word: τὴν δόξαν σου
  choice: своей славы
  rationale: «Слава» сохраняет возвышенное и богословски ёмкое значение δόξα, не сужая его до чести, положения или заветного преимущества.
- source_word: τὰ συμφέροντά σοι
  choice: того, что служит тебе на благо
  rationale: Передаёт субстантивированное среднее множественное число и широкий смысл пользы или выгоды, не ограничивая его материальным либо духовным благополучием.
- source_word: ἔθνει ἀλλοτρίῳ
  choice: чужому народу
  rationale: «Народ» естественно передаёт ἔθνος в данном контексте, а «чужому» выражает принадлежность к иной общности и перекликается с противопоставлением своему благу.
theological_decisions:
- issue: Значение выражения τὴν δόξαν σου
  choice: Сохранить широкое выражение «своей славы».
  alternative: «своей чести»; «славы, данной тебе Богом»; «своего заветного преимущества»
  rationale: Греческий текст не определяет, что именно обозначает δόξα. «Слава» сохраняет смысловую и богословскую широту, не внося в текст более узкого толкования.
- issue: Значение выражения τὰ συμφέροντά σοι
  choice: 'Передать обобщённо: «того, что служит тебе на благо».'
  alternative: «своего благополучия»; «своих преимуществ»; «того, что тебе выгодно»
  rationale: Выражение охватывает всё полезное или благоприятное для адресата. Обобщённый перевод не сводит его ни к материальной выгоде, ни исключительно к духовному благу.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным увещевательным тоном. Тире перед «чужому народу» делает ясным общий адресат двух однородных дополнений и при этом не устраняет смысловой широты оригинала.
