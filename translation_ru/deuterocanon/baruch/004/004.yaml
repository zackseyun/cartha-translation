  text: We are blessed[a], O Israel[b], because what is pleasing to God is known to us.
translation:
  language: ru
  text: Блаженны мы[a], Израиль, потому что нам известно то, что угодно Богу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «счастливы», «благополучны»; греческое слово обозначает состояние блаженства и особого благополучия, а не только чувство счастья.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «угодное Богу известно нам».'
    reason: literal_rendering
lexical_decisions:
- source_word: μακάριοί
  choice: блаженны
  rationale: Передаёт состояние особого благополучия и благоволения, сохраняя библейскую торжественность; смысл шире простого эмоционального счастья.
- source_word: ἐσμεν
  choice: мы
  rationale: В русском составном именном сказуемом настоящего времени связка обычно опускается; лицо и число выражены местоимением «мы».
- source_word: Ἰσραήλ
  choice: Израиль
  rationale: Сохранено прямое обращение, выделенное запятыми; частица «о» в современном русском здесь звучала бы излишне архаично.
- source_word: τὰ ἀρεστὰ
  choice: то, что угодно
  rationale: Естественно передаёт субстантивированное сочетание во множественном числе, не сужая его до закона или отдельных заповедей.
- source_word: τοῦ θεοῦ
  choice: Богу
  rationale: При русском «угодно» дательный падеж естественно выражает того, кому нечто угодно.
- source_word: ἡμῖν γνωστά ἐστιν
  choice: нам известно
  rationale: Точно и естественно передаёт дательный лица и значение известности, не добавляя отсутствующего в греческом явного указания «было открыто».
theological_decisions:
- issue: Характер преимущества Израиля
  choice: Израиль назван блаженным, поскольку ему известно то, что угодно Богу.
  alternative: Прямо назвать известное Израилю законом или Торой.
  rationale: Контекст допускает связь с Торой и заветным наставлением, однако греческий текст использует более широкое выражение; перевод не должен устранять эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Обращение «Израиль» сохранено без архаизирующей частицы «о»; порядок слов подчёркивает «мы», не нарушая естественности русской речи.
