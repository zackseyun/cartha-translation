lexical_decisions:
- source_word: οἱ τρυφεροί μου
  choice: Мои дети, выросшие в неге
  rationale: Субстантивированное выражение обозначает тех, кто прежде жил в мягкости и достатке. Слово «дети» естественно восстанавливает подразумеваемых лиц в контексте плача матери, а «выросшие в неге» передаёт контраст между прежней жизнью и нынешними тяготами без резко неодобрительного оттенка слова «изнеженные».
- source_word: ἐπορεύθησαν
  choice: шли
  rationale: Простое и естественное соответствие глаголу движения; вместе с упоминанием дорог оно не добавляет лишней конкретизации.
- source_word: ὁδοὺς τραχείας
  choice: по тяжёлым дорогам
  rationale: Сохраняется конкретный образ трудного пути; «тяжёлым» по-русски естественно передаёт суровость и мучительность дороги.
- source_word: ἤρθησαν
  choice: их увели
  rationale: Пассивная форма в данном контексте означает насильственное удаление или увод в плен, а не буквальное поднятие.
- source_word: ὡς ποίμνιον
  choice: словно стадо
  rationale: Сохраняется прямое сравнение и собирательный образ уязвимого стада; уменьшительный оттенок формы не подчёркивается искусственно.
- source_word: ἡρπασμένον
  choice: захваченное
  rationale: Передаёт насильственный характер действия ἁρπάζω и естественно сочетается со словами «стадо» и «врагами».
- source_word: ὑπὸ ἐχθρῶν
  choice: врагами
  rationale: Сохранено множественное число греческого текста без сужения значения до одного врага.
theological_decisions:
- issue: Смысл образа стада
  choice: Сохранено сравнение людей с уязвимым стадом, насильно захваченным врагами.
  alternative: Истолковать образ прямо как указание на плен или изгнание.
  rationale: Греческий текст использует сравнение и не называет плен или изгнание прямо; перевод не устраняет эту образную сдержанность.
translation_notes:
  register: Современный литературный русский язык с интонацией плача. Формулировка «выросшие в неге» звучит достойно и ясно, передавая прежнюю защищённость без излишне осуждающего оттенка.
