base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/001.yaml
  text: This is the book of the commandments of God[a], and the law that endures forever; all who hold fast to it are for life, but those who forsake it will die.
translation:
  language: ru
  text: Вот книга заповедей Бога и закон, пребывающий вовеки. Все, кто держится её, обретут жизнь[a], а те, кто оставляет её, умрут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все, кто держится её, — к жизни». Греческое выражение эллиптично; его можно также понять как «будут жить».'
    reason: Сноска сохраняет синтаксическую неоднозначность εἰς ζωὴν и поясняет более естественный перевод в основном тексте.
lexical_decisions:
- source_word: βίβλος
  choice: книга
  rationale: «Книга» естественно обозначает письменный свод и соответствует выражению «книга заповедей»; «свиток» неоправданно конкретизировал бы материальную форму текста.
- source_word: προσταγμάτων
  choice: заповедей
  rationale: Слово обозначает властные предписания; в сочетании с упоминанием Бога и закона «заповеди» ясно передают религиозно-правовой смысл.
- source_word: νόμος
  choice: закон
  rationale: Параллель с «заповедями Бога» указывает на обязательное Божье установление, поэтому «закон» точнее, чем более широкие варианты «учение» или «наставление».
- source_word: ὁ ὑπάρχων εἰς τὸν αἰῶνα
  choice: пребывающий вовеки
  rationale: Так передаётся непрерывное существование и непреходящая сила закона; формулировка сохраняет возвышенность, оставаясь понятной современному читателю.
- source_word: κρατοῦντες αὐτῆς
  choice: кто держится её
  rationale: κρατέω выражает крепкую, постоянную приверженность. Женское местоимение в греческом грамматически соотносится с βίβλος, что естественно сохраняется русским «её» после слова «книга».
- source_word: εἰς ζωὴν
  choice: обретут жизнь
  rationale: Греческое выражение эллиптично, буквально «к жизни». В основном тексте смысл передан естественно по-русски, а формальная неоднозначность отмечена в сноске.
- source_word: καταλείποντες αὐτὴν
  choice: те, кто оставляет её
  rationale: Глагол означает оставлять или покидать. «Оставляет» сохраняет образ и не усиливает текст до непременно сознательного вероотступничества, как могло бы сделать «отрекается».
- source_word: ἀποθανοῦνται
  choice: умрут
  rationale: Прямой перевод будущего времени сохраняет резкое противопоставление жизни и смерти.
theological_decisions:
- issue: Как передать эллиптическое противопоставление εἰς ζωὴν и ἀποθανοῦνται
  choice: 'В тексте: «обретут жизнь … умрут», с указанием буквальной конструкции в сноске.'
  alternative: «все, кто держится её, — к жизни»
  rationale: Основной вариант понятен по-русски и сохраняет явную богословскую полярность жизни и смерти; сноска не скрывает того, что первая половина в греческом синтаксически неоднозначнее.
- issue: Следует ли передавать νόμος как более широкое «учение»
  choice: закон
  alternative: учение; наставление
  rationale: Соседнее выражение «заповеди Бога» поддерживает смысл обязательного Божьего установления, а не только мудрого наставления.
- issue: К чему относится местоимение αὐτῆς / αὐτήν
  choice: Сохранено женское «её», грамматически отсылающее к «книге».
  alternative: Заменить местоимение словом «закон» или нейтрально переформулировать фразу.
  rationale: Греческое местоимение женского рода естественно соотносится с βίβλος, тогда как νόμος имеет мужской род. Сохранение местоименной связи не навязывает более узкого толкования содержания книги и закона.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Вот» естественно вводит определение книги; «вовеки» сохраняет торжественный регистр без архаической перегруженности. Местоимение «её» последовательно относится к «книге».
