  text: Take courage[a], children; cry out to God, and he will deliver you from oppression[b], from the hand of enemies.
translation:
  language: ru
  text: Мужайтесь, дети! Воззовите к Богу, и Он избавит вас от господства, от руки врагов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Рука врагов» — библейский образ, означающий власть или контроль врагов.
    reason: cultural_note
lexical_decisions:
- source_word: Θαρρεῖτε
  choice: Мужайтесь
  rationale: Повелительное наклонение во множественном числе призывает обрести мужество и уверенность; «мужайтесь» кратко, естественно и сохраняет прямую силу увещания.
- source_word: τέκνα
  choice: дети
  rationale: Форма обращения во множественном числе означает детей независимо от пола и сохраняет семейный тон речи.
- source_word: βοήσατε πρὸς τὸν θεόν
  choice: Воззовите к Богу
  rationale: Глагол передаёт настойчивый громкий призыв, обращённый к Богу; «воззовите» уместно для молитвенного обращения и сохраняет торжественный, но понятный регистр.
- source_word: ἐξελεῖται
  choice: Он избавит вас
  rationale: Будущая форма ἐξαιρέω обозначает спасение или избавление из-под чужой власти; «избавит» естественно передаёт обещанное действие Бога.
- source_word: ἐκ δυναστείας
  choice: от господства
  rationale: δυναστεία может обозначать власть, господство или владычество; здесь отрицательный смысл возникает из контекста вражеской власти, поэтому «господство» сохраняет широту слова, не усиливая его до «тирании».
- source_word: ἐκ χειρὸς ἐχθρῶν
  choice: от руки врагов
  rationale: Сохранён конкретный библейский образ руки как власти или контроля; пояснение вынесено в сноску.
theological_decisions:
- issue: Обещание Божьего избавления
  choice: и Он избавит вас
  alternative: и Он спасёт вас / и Он вырвет вас
  rationale: Греческий текст прямо обещает будущее избавление Богом. Выбор не уточняет способ избавления и не добавляет отсутствующих в тексте богословских положений.
- issue: Соотношение двух оборотов с ἐκ
  choice: от господства, от руки врагов
  alternative: из-под власти врагов
  rationale: Сохранены оба параллельных оборота исходного текста и его образность; второй оборот может уточнять первый, но перевод не сводит их безусловно в одну конструкцию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Восклицательный знак после обращения подчёркивает увещание, не меняя смысла. Заглавное «Он» следует принятой русской издательской традиции при ясном указании на Бога.
