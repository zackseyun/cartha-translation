  yaml_path: translation/deuterocanon/baruch/004/009.yaml
  text: 'For he saw the wrath that came upon you from God[a], and he said, “Hear, you neighbors of Zion: God has brought upon me great mourning.”'
translation:
  language: ru
  text: 'Ибо он увидел гнев, постигший вас от Бога, и сказал: «Слушайте, живущие близ Сиона[a]: Бог навёл на меня великую скорбь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришельцы Сиона», «живущие при Сионе». Греческое πάροικοι может означать людей, живущих рядом или среди местных жителей, иногда — чужеземцев с неполноправным статусом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: увидел
  rationale: Передаёт прямое значение аориста и сохраняет образ Сиона как говорящего лица, наблюдающего бедствие.
- source_word: ἐπελθοῦσαν ὑμῖν ὀργὴν
  choice: гнев, постигший вас
  rationale: Причастие обозначает гнев, настигший или обрушившийся на людей; «постигший» естественно передаёт наступившее бедствие.
- source_word: παρὰ τοῦ θεοῦ
  choice: от Бога
  rationale: Предлог с родительным указывает на источник; перевод прямо сохраняет исходящую от Бога кару, не смягчая её.
- source_word: Ἀκούσατε
  choice: Слушайте
  rationale: Естественная современная форма повелительного призыва, сохраняющая торжественный тон обращения.
- source_word: οἱ πάροικοι Σειών
  choice: живущие близ Сиона
  rationale: πάροικοι может обозначать живущих рядом, пришельцев или неполноправных поселенцев. Основной перевод сохраняет пространственное значение, а неоднозначность отмечена в сноске.
- source_word: ἐπήγαγέ μοι
  choice: навёл на меня
  rationale: Передаёт активное причинение или принесение бедствия и сохраняет прямое указание на действие Бога.
- source_word: πένθος μέγα
  choice: великий траур
  rationale: πένθος означает не только внутреннюю скорбь, но и состояние или выражение оплакивания; «траур» сохраняет этот оттенок.
theological_decisions:
- issue: Божественное действие в постигшем бедствии
  choice: Гнев исходит от Бога, и Бог наводит великий траур.
  alternative: Смягчить причинность формулировкой о безлично наступившем бедствии.
  rationale: Греческий текст прямо связывает и гнев, и траур с Богом; перевод сохраняет эту богословскую напряжённость без смягчения.
