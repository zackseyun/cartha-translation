translation:
  language: ru
  text: Мужайтесь, народ мой, память Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «памятный знак Израиля». Греческое слово может означать память, напоминание или предмет, сохраняющий память.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρσεῖτε
  choice: Мужайтесь
  rationale: Повелительное наклонение множественного числа от θαρσέω выражает прямой призыв обрести мужество; «Мужайтесь» естественно и достойно передаёт эту силу.
- source_word: λαός μου
  choice: народ мой
  rationale: Прямое соответствие греческому сочетанию с притяжательным местоимением; сохраняет общинный и заветный оттенок без добавления междометия.
- source_word: μνημόσυνον
  choice: память
  rationale: Слово может обозначать память, напоминание или памятный знак. В обращении-приложении «память» сохраняет отвлечённо-предметную неоднозначность греческого текста и звучит естественнее, чем «памятник».
- source_word: Ἰσραήλ
  choice: Израиля
  rationale: Родительный падеж передаёт греческую конструкцию μνημόσυνον Ἰσραήλ как «память Израиля», не уточняя, является ли Израиль субъектом или объектом памяти.
theological_decisions:
- issue: Смысл приложения μνημόσυνον Ἰσραήλ
  choice: 'Сохранить как второе обращение-приложение: «народ мой, память Израиля»'
  alternative: «народ мой, воспоминание об Израиле»; «народ мой, памятник Израиля»; «народ мой, остаток Израиля»
  rationale: Греческий текст даёт именную фразу без поясняющего глагола. Перевод не определяет, кто кого помнит, и не подменяет метафору богословским толкованием вроде «остатка Израиля».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским звучанием. Необычная метафора оригинала сохранена; синтаксис обращения передан без добавочного «о».
