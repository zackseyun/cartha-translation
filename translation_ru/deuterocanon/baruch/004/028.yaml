  text: For just as your mind was set on going astray from God[a], so, as you return, seek him ten times more.
translation:
  language: ru
  text: Ибо как ваш ум устремился к тому, чтобы уклониться от Бога, так, обращаясь к Нему, ищите Его вдесятеро усерднее.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «удесятерите, обращаясь, чтобы искать Его»; что именно следует увеличить вдесятеро, в греческом тексте подразумевается из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάνοια ὑμῶν
  choice: ваши помыслы
  rationale: διάνοια обозначает внутренний строй мыслей, намерение или расположение ума. Множественное «помыслы» естественно по-русски передаёт общую внутреннюю направленность народа.
- source_word: ἐγένετο ... εἰς τὸ πλανηθῆναι
  choice: устремились к тому, чтобы уклониться
  rationale: Оборот описывает возникшую направленность к удалению от Бога. «Устремились» сохраняет динамику ἐγένετο и связь с внутренним расположением, не усиливая возможный пассивный оттенок πλανηθῆναι.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: от Бога
  rationale: ἀπό прямо выражает отделение или удаление; краткое «от Бога» точно и естественно.
- source_word: δεκαπλασιάσατε
  choice: вдесятеро усерднее
  rationale: Глагол буквально значит «увеличьте в десять раз», но объект усиления в греческом подразумевается. Наречное выражение связывает усиление с последующим «ищите Его» и даёт ясный русский текст.
- source_word: ἐπιστρέφοντες
  choice: обращаясь к Нему
  rationale: Причастие обозначает возвращение или поворот обратно. Дополнение «к Нему» ясно из контекста и естественно связывает обращение с поиском Бога.
- source_word: ζητῆσαι αὐτόν
  choice: ищите Его
  rationale: ζητέω в религиозном контексте означает стремиться найти Бога и обратиться к Нему; «ищите Его» сохраняет традиционную весомость и понятность.
theological_decisions:
- issue: Связь δεκαπλασιάσατε с обращением и поиском Бога
  choice: 'Передать как усиленный призыв: «ищите Его вдесятеро усерднее»'
  alternative: «обращаясь, взыщите Его вдесятеро» или буквально «удесятерите, обращаясь, чтобы искать Его»
  rationale: В греческом объект глагола «удесятерите» не назван. Контекст позволяет отнести усиление к поиску Бога, однако примечание сохраняет исходную эллиптичность и возможный более буквальный синтаксис.
- issue: Направленность выражения ἐπιστρέφοντες
  choice: «обращаясь к Нему»
  alternative: «возвращаясь»
  rationale: Оба значения допустимы. «Обращаясь к Нему» естественно передаёт религиозный поворот к Богу без добавления конфессионально специфического содержания.
