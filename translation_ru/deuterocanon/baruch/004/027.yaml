base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/027.yaml
  text: Take courage[a], children, and cry out to God, for you will be remembered by the one who brought this upon you.
translation:
  language: ru
  text: Мужайтесь, дети, и взывайте к Богу, ибо о вас вспомнит тот, кто навёл на вас это бедствие.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ибо будет о вас воспоминание у того, кто навёл [это]».'
    reason: Сохраняет буквальную безличную конструкцию ἔσται ... μνεία и отмечает, что объект при «навёл» подразумевается контекстом.
lexical_decisions:
- source_word: Θαρρήσατε
  choice: Мужайтесь
  rationale: Аористный императив множественного числа от θαρρέω выражает призыв обрести мужество и не падать духом. «Мужайтесь» естественно и кратко передаёт увещевание.
- source_word: τέκνα
  choice: дети
  rationale: Форма звательного множественного числа означает «дети» и обращена ко всему народу без указания пола.
- source_word: βοήσατε
  choice: взывайте
  rationale: Глагол βοάω обозначает громкий, настойчивый зов, здесь обращённый к Богу. «Взывайте» сохраняет силу мольбы и соответствует возвышенному, но понятному регистру.
- source_word: πρὸς τὸν θεόν
  choice: к Богу
  rationale: Предлог πρὸς после глагола призыва указывает адресата; по-русски естественно «взывать к Богу».
- source_word: ἔσται ... ὑμῶν ... μνεία
  choice: о вас вспомнит
  rationale: Буквально конструкция означает «будет о вас воспоминание/память». Личная форма по-русски звучит естественно и сохраняет обещание будущего действия.
- source_word: ὑπὸ τοῦ ἐπάγοντος
  choice: тот, кто навёл на вас это бедствие
  rationale: Субстантивированное причастие обозначает того, кто навёл или вызвал подразумеваемое из контекста бедствие. Дополнение «это бедствие» проясняет опущенный в греческом объект, не называя действующего прямо Богом.
theological_decisions:
- issue: Кто обозначен словами «тот, кто навёл»
  choice: 'Сохранить косвенное обозначение: «тот, кто навёл на вас это бедствие»'
  alternative: 'Прямо назвать Бога: «Бог, который навёл на вас это бедствие»'
  rationale: Ближайший контекст указывает на Бога как на того, кто допустил или навёл суд и затем вспомнит народ, однако греческий текст не повторяет θεός, а употребляет косвенное причастное обозначение. Перевод сохраняет эту формальную сдержанность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Мужайтесь» и «взывайте» понятны современному читателю; косвенное обозначение деятеля сохранено без конфессионального уточнения.
