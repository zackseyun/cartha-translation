base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/034.yaml
  text: And I will take away from her the rejoicing of her many people[b][a], and turn her pride into mourning.
translation:
  language: ru
  text: И отниму у неё ликование, вызванное её многолюдством[a], а её гордость[b] обращу в скорбь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ликование её великого множества». Греческое выражение может обозначать как многолюдство города, так и радость, вызванную им.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «надменность» или «великолепие». Греческое слово может обозначать и гордое самовозвышение, и его пышное внешнее проявление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελῶ
  choice: отниму
  rationale: Будущая форма περιαιρέω выражает удаление или лишение; «отниму» естественно передаёт прямое действие говорящего над городом.
- source_word: ἀγαλλίαμα
  choice: ликование
  rationale: Слово обозначает радостное торжество; «ликование» сохраняет эмоциональную силу и возвышенный регистр.
- source_word: τῆς πολυοχλίας
  choice: из-за её многолюдства
  rationale: πολυοχλία означает многочисленность населения или большое скопление людей. Родительный падеж допускает связь как с самим многолюдством, так и с вызванным им ликованием; предлог «из-за» ясно передаёт основание радости, не сводя выражение просто к людям.
- source_word: ἀγαυρίαμα
  choice: горделивое величие
  rationale: Термин может обозначать гордость, надменное самовозвышение или пышное великолепие. Сочетание сохраняет одновременно нравственный и внешний оттенки слова.
- source_word: εἰς πένθος
  choice: обращу в скорбь
  rationale: εἰς указывает на итоговое превращение. В русском требуется восполнить подразумеваемый во второй части глагол; «обращу» естественно выражает переход к скорби.
theological_decisions:
- issue: Во второй части греческого предложения глагол опущен
  choice: Восполнить подразумеваемое действие словами «обращу в скорбь»
  alternative: 'Сохранить эллипсис буквально: «а её горделивое величие — в скорбь»'
  rationale: Греческий параллелизм допускает эллипсис, но буквальная конструкция по-русски неясна. Восполнение глагола передаёт подразумеваемое превращение, не добавляя богословского толкования.
- issue: Смысловая широта ἀγαυρίαμα
  choice: «горделивое величие»
  alternative: «гордость», «надменность» или «великолепие»
  rationale: Выбранное выражение не снимает напряжения между внутренней гордостью и её внешним пышным проявлением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Город персонифицирован местоимением женского рода. Порядок с двумя параллельными объектами сохранён, но во второй части восполнен подразумеваемый глагол ради ясности.
