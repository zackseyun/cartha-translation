lexical_decisions:
- source_word: ἰδοὺ
  choice: посмотрите
  rationale: Частица привлекает внимание слушателей; повелительное «посмотрите» естественно передаёт её функцию в современном русском языке, не добавляя значения «я увидела».
- source_word: γὰρ
  choice: ведь
  rationale: Сохраняет пояснительную связь с предыдущими словами и звучит естественнее здесь, чем более книжное «ибо».
- source_word: τὴν αἰχμαλωσίαν
  choice: в плену
  rationale: Передаёт состояние насильственного пленения; перестройка именной конструкции делает фразу естественной по-русски. Возможное значение выселения в изгнание отмечено в сноске.
- source_word: τῶν υἱῶν μου καὶ τῶν θυγατέρων
  choice: мои сыновья и дочери
  rationale: Сохраняет явно названные в греческом тексте обе группы, не сводя их к общему «дети».
- source_word: ἣν
  choice: его
  rationale: Местоимение отсылает к плену и сохраняет относительную связь исходной фразы в естественной русской синтаксической перестройке.
- source_word: ἐπήγαγεν
  choice: навёл на них
  rationale: 'Передаёт каузативный смысл: Вечный сделал так, что плен постиг их; формулировка также сохраняет тяжесть божественного действия.'
- source_word: ὁ αἰώνιος
  choice: Вечный
  rationale: Передаёт субстантивированное божественное именование без добавления отсутствующего в греческом слова «Бог» и не заменяет его обычным титулом «Господь».
theological_decisions:
- issue: Передача божественного титула ὁ αἰώνιος
  choice: Вечный
  alternative: Предвечный; вечный Бог
  rationale: «Вечный» сохраняет особый субстантивированный титул и его отличие от κύριος; вариант «вечный Бог» добавлял бы существительное, которого в исходном тексте нет.
- issue: Божественная причинность пленения
  choice: его навёл на них Вечный
  alternative: которому Вечный допустил постигнуть их
  rationale: Глагол ἐπήγαγεν прямо представляет Вечного как того, кто навёл плен; перевод не смягчает это утверждение до простого допущения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Начальное «ведь посмотрите» передаёт и пояснительную связь γάρ, и призыв к вниманию ἰδού. Исходная именная конструкция перестроена в ясное русское предложение без добавления отсутствующего глагола восприятия от первого лица.
