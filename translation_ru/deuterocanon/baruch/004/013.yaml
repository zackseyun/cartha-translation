base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/013.yaml
  text: and they did not know his righteous decrees[a], nor did they walk in the ways of God's commandments[b], nor did they step onto the paths of discipline in his righteousness.
translation:
  language: ru
  text: и не познали Его установлений, не ходили путями Божьих заповедей и не вступали на стези наставления[a] в Его праведности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспитания». Греческое παιδεία означает формирующее обучение, воспитание и исправление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Его справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώματα αὐτοῦ
  choice: Его установлений
  rationale: «Установления» естественно передаёт нормативно-правовой смысл δικαιώματα, не сужая его до технического термина «законы»; притяжательное местоимение сохраняет αὐτοῦ.
- source_word: οὐκ ἔγνωσαν
  choice: не познали
  rationale: «Не познали» сохраняет прямой смысл ἔγνωσαν и допускает не только умственное непонимание, но и отсутствие деятельного знакомства с Божьими установлениями.
- source_word: οὐδὲ ἐπορεύθησαν ὁδοῖς ἐντολῶν θεοῦ
  choice: не ходили путями Божьих заповедей
  rationale: Сохраняется библейский образ хождения как образа жизни, а также генитивная связь между «путями» и «заповедями».
- source_word: τρίβους
  choice: стези
  rationale: «Стези» отличает τρίβους от ранее употреблённого ὁδοῖς («пути») и сохраняет образ проторённой дороги; слово понятно в современном возвышенном библейском регистре.
- source_word: παιδίας (παιδείας)
  choice: наставления
  rationale: В данном контексте слово обозначает формирующее обучение и воспитание; «наставление» звучит естественно и не сводит смысл лишь к наказанию или исправлению.
- source_word: ἐπέβησαν
  choice: не вступали на
  rationale: Передаёт конкретный образ ἐπιβαίνω — ступить на путь, начать идти по нему — без тяжеловесной буквальности.
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: в Его праведности
  rationale: Формально сохраняет компактную греческую конструкцию и её возможную смысловую связь как с наставлением, так и с хождением по его стезям.
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет нравственно-богословскую широту δικαιοσύνη в контексте Божьих заповедей и наставления; «справедливость» остаётся возможным, более юридически окрашенным прочтением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Параллелизм трёх отрицательных конструкций сохранён; повтор «не» делает синтаксис ясным, а слова «пути» и «стези» отражают различие ὁδοί и τρίβοι.
