  yaml_path: translation/deuterocanon/baruch/004/019.yaml
  text: Go[a], children, go[b], for I have been left desolate.
translation:
  language: ru
  text: Ступайте[a], дети, ступайте, ведь я осталась опустошённой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Идите». Греческий глагол буквально обозначает ходьбу, но здесь выражает настойчивое повеление уйти.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «одна» или «покинутой». Греческое слово может обозначать безлюдное, опустошённое или одинокое состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαδίζετε
  choice: ступайте
  rationale: Повелительная форма буквально связана с ходьбой, но здесь служит настойчивым призывом уйти. «Ступайте» естественно передаёт и движение, и побуждение к уходу; повтор сохранён.
- source_word: τέκνα
  choice: дети
  rationale: Общее родственное обращение без указания только на сыновей; соответствует образу города-матери в контексте.
- source_word: κατελείφθην
  choice: я осталась
  rationale: Пассивная форма означает, что говорящая была оставлена, с акцентом на наступившее состояние. Русская конструкция «я осталась» передаёт результат естественно, не усиливая смысл до прямого обвинения в оставлении.
- source_word: ἔρημος
  choice: опустошённой
  rationale: Слово может описывать безлюдное, покинутое, одинокое или опустошённое состояние. «Опустошённой» сохраняет одновременно образ обезлюдевшего города и эмоциональную силу плача.
theological_decisions:
- issue: Эмоциональный и образный смысл состояния говорящей
  choice: я осталась опустошённой
  alternative: я осталась одна; я осталась покинутой
  rationale: Греческое ἔρημος допускает как буквальное запустение и безлюдность, так и одиночество. Основной вариант сохраняет широту образа и скорбный тон, не сводя его только к внутреннему переживанию или к утверждению о намеренном оставлении.
translation_notes:
  register: Современный литературный русский язык с торжественно-скорбным, но понятным звучанием. Повтор повеления сохранён. Женский род обусловлен контекстуальным образом Иерусалима как матери и необходим русской грамматике; сам греческий глагол рода не выражает.
