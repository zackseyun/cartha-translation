base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/037.yaml
  text: Look[a], your sons are coming, whom you sent away; they are coming, gathered from east to west at the word of the Holy One[b], rejoicing in the glory of God.
translation:
  language: ru
  text: Вот, идут твои сыновья, которых ты отослала; они идут, собранные с востока до запада по слову Святого[a], радуясь славе Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словом Святого». Дательный падеж τῷ ῥήματι может указывать как на средство, так и на слово-повеление, которому повинуются.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также смысл: «радуясь из-за славы Бога». Дательный падеж может обозначать предмет или повод радости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Современное и естественное указательное слово, сохраняющее призыв обратить внимание на открывающуюся картину.
- source_word: οἱ υἱοί σου
  choice: твои сыновья
  rationale: Передаёт явно мужскую форму греческого текста, не заменяя её более общим словом «дети».
- source_word: ἐξαπέστειλας
  choice: ты отослала
  rationale: Глагол означает послать прочь или отослать. Женский род обусловлен обращением к олицетворённому Иерусалиму в ближайшем контексте.
- source_word: συνηγμένοι
  choice: собранные
  rationale: 'Сохраняет результативное пассивное значение причастия: сыновья приходят уже собранными воедино.'
- source_word: ἀπʼ ἀνατολῶν ἕως δυσμῶν
  choice: с востока до запада
  rationale: Естественно передаёт пространственный меризм, охватывающий весь горизонт.
- source_word: τῷ ῥήματι
  choice: по слову
  rationale: Формулировка допускает понимание слова Святого как повеления, которому последовали, и остаётся близкой к дательному падежу оригинала.
- source_word: τοῦ ἁγίου
  choice: Святого
  rationale: Субстантивированное прилагательное передано как почтительный титул Бога без добавления отсутствующего в этой фразе существительного.
- source_word: χαίροντες
  choice: радуясь
  rationale: Деепричастие сохраняет сопутствующее действие и описывает, с каким чувством сыновья приходят.
- source_word: τῇ τοῦ θεοῦ δόξῃ
  choice: славе Бога
  rationale: Русский дательный после «радоваться» естественно передаёт славу Бога как предмет или повод радости, не делая причинное значение единственно возможным.
theological_decisions:
- issue: Божественный титул τοῦ ἁγίου
  choice: Святого
  alternative: Святого Бога
  rationale: Греческий текст употребляет субстантивированное «Святого». Заглавная буква обозначает божественный титул, а отсутствие добавленного слова «Бога» сохраняет лаконичность и формальную особенность оригинала.
- issue: Связь собирания с τῷ ῥήματι
  choice: по слову Святого
  alternative: словом Святого
  rationale: Дательный падеж допускает как отклик на повеление, так и инструментальное значение. Основной текст передаёт первое, а примечание сохраняет второе.
- issue: Значение дательного τῇ ... δόξῃ при χαίροντες
  choice: радуясь славе Бога
  alternative: радуясь из-за славы Бога
  rationale: Дательный может обозначать предмет либо повод радости; перевод не превращает эту связь в более определённое богословское утверждение об участии в славе.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Повтор «идут» сохранён как риторическая особенность греческого текста; обращение к Иерусалиму передано женской формой глагола.
