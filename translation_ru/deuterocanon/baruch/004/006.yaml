  text: You were sold to the nations, not for destruction; but because you provoked God to anger, you were handed over to your adversaries.
translation:
  language: ru
  text: Вы были проданы народам не на погибель; но за то, что вы прогневили Бога, вы были преданы своим противникам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθητε
  choice: вы были проданы
  rationale: Аорист страдательного залога от πιπράσκω. Перевод сохраняет образ продажи и не уточняет сверх текста, каким именно образом народ оказался под чужой властью.
- source_word: τοῖς ἔθνεσιν
  choice: народам
  rationale: В контексте изгнания ἔθνη обозначает чужеземные народы. «Народам» передаёт смысл прямо и без позднейшей конфессиональной окраски слова «язычники».
- source_word: οὐκ εἰς ἀπώλειαν
  choice: не на погибель
  rationale: Оборот εἰς ἀπώλειαν допускает оттенок цели или результата. «Не на погибель» естественно по-русски и сохраняет утверждение, что изгнание не означало окончательной гибели.
- source_word: διὰ δὲ τὸ παροργίσαι
  choice: но за то, что вы прогневили
  rationale: Артиклевый инфинитив с διά выражает причину. Глагол παροργίζω означает вызвать гнев; «прогневили» кратко и точно передаёт это значение в достойном современном регистре.
- source_word: τὸν θεόν
  choice: Бога
  rationale: Прямое дополнение при παροργίσαι; в русском языке собственное обозначение единого Бога естественно передаётся без артикля.
- source_word: παρεδόθητε
  choice: вы были преданы
  rationale: Страдательная форма παραδίδωμι указывает на передачу под чужую власть. «Были преданы» сохраняет судебно-исторический оттенок и не добавляет прямо не названного деятеля.
- source_word: τοῖς ὑπεναντίοις
  choice: своим противникам
  rationale: ὑπεναντίος обозначает тех, кто противостоит кому-либо. «Противникам» точнее сохраняет это значение, чем более сильное и широкое «врагам»; «своим» естественно выражает подразумеваемое отношение к адресатам.
theological_decisions:
- issue: Характер изгнания и суда над Израилем
  choice: Продажа народам представлена не как окончательная погибель, а как следствие того, что адресаты прогневили Бога и были преданы противникам.
  alternative: Можно истолковать это как исправительное наказание, не ведущее к уничтожению.
  rationale: Греческий текст прямо противопоставляет «не на погибель» причинному указанию на вызванный Божий гнев. Перевод сохраняет это напряжение, но не вводит отсутствующего в стихе разъяснения о цели наказания.
- issue: Неуказанный деятель страдательных форм
  choice: Сохранены страдательные конструкции «были проданы» и «были преданы» без прямого называния деятеля.
  alternative: 'Можно раскрыть подразумеваемого деятеля как Бога: «Бог предал вас».'
  rationale: Хотя контекст связывает событие с Божьим судом, в данном греческом стихе деятель обеих страдательных форм прямо не назван. Его эксплицирование сняло бы подлинную грамматическую сдержанность текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксический параллелизм и противопоставление оригинала сохранены; архаичные «языцы», «супостаты» и разговорные обороты исключены.
