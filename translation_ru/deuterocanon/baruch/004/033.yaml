base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/033.yaml
  text: For just as she rejoiced over your fall and was glad over your downfall[b][a], so she will grieve over her own desolation.
translation:
  language: ru
  text: Ибо как она[a] радовалась твоему падению и ликовала из-за твоего крушения[b], так будет скорбеть о своём запустении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «она», вероятно, относится к враждебному городу или народу, о котором говорится в ближайшем контексте; традиционно здесь понимают Вавилон.
    reason: cross_reference
  - marker: b
    text: 'Или: «гибели». Греческое πτῶμα в данном контексте означает бедствие или крах, а не буквальный труп.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ ... οὕτως
  choice: Ибо как ... так
  rationale: Передаёт пояснительное значение γάρ и сохраняет явную сравнительную конструкцию ὥσπερ ... οὕτως.
- source_word: ἐχάρη
  choice: радовалась
  rationale: Естественно передаёт аорист χαίρω и злорадную реакцию на бедствие Сиона.
- source_word: πτώσει
  choice: падению
  rationale: Сохраняет основной образ падения и смысл постигшего бедствия.
- source_word: εὐφράνθη
  choice: ликовала
  rationale: Передаёт усиленную радость и позволяет сохранить различие между двумя близкими греческими глаголами.
- source_word: πτώματί
  choice: крушении
  rationale: В данном параллелизме слово означает гибельное бедствие или крах, а не буквальный труп; «крушение» сохраняет связь с образом падения, не повторяя то же слово.
- source_word: λυπηθήσεται
  choice: будет скорбеть
  rationale: Естественно передаёт будущую страдательно-депонентную форму и грядущую перемену участи.
- source_word: ἐρημίᾳ
  choice: запустении
  rationale: В контексте суда обозначает опустошённое, разорённое состояние; «запустение» звучит естественно и сохраняет пророческий регистр.
- source_word: ἑαυτῆς
  choice: собственном
  rationale: 'Передаёт возвратное значение: запустение постигнет её саму.'
theological_decisions:
- issue: К кому относится подлежащее женского рода
  choice: Сохранить местоимение «она», не называя город или народ в основном тексте.
  alternative: Прямо назвать Вавилон или враждебный город.
  rationale: Греческий текст использует формы женского рода, но в самом стихе не называет референта; местоимение сохраняет эту особенность и не устраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Парные глаголы «радовалась» и «ликовала» и существительные «падение» и «крушение» сохраняют риторический параллелизм без неестественного повтора.
