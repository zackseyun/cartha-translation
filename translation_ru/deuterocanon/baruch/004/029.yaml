  text: For the one who brought evils upon you will bring you everlasting gladness with your salvation[a][b].
translation:
  language: ru
  text: Ведь Тот, кто навёл на вас бедствия, принесёт вам вечную радость вместе с вашим спасением[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавлением». Греческое слово σωτηρία может означать как спасение, так и избавление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἐπαγαγὼν ... ἐπάξει
  choice: Тот, кто навёл ... принесёт
  rationale: Сохраняется прямая субъектность одного и того же деятеля и смысловой повтор глагола ἐπάγω, но по-русски естественно разграничены «навести бедствия» и «принести радость».
- source_word: τὰ κακὰ
  choice: бедствия
  rationale: В данном контексте κακά обозначает постигшие народ несчастья или бедствия; этот вариант естественнее русского «зло» во множественном числе и не добавляет отсутствующего в греческом указательного «эти».
- source_word: τὴν αἰώνιον εὐφροσύνην
  choice: вечную радость
  rationale: εὐφροσύνη означает радость, веселье или ликование; «вечная радость» точно и естественно передаёт сочетание с αἰώνιον.
- source_word: μετὰ τῆς σωτηρίας ὑμῶν
  choice: вместе с вашим спасением
  rationale: Передаёт μετὰ как сопутствие, а σωτηρία — широким словом «спасение», сохраняя также возможный контекстуальный оттенок избавления.
theological_decisions:
- issue: Божественная субъектность в бедствии и восстановлении
  choice: Один и тот же деятель прямо назван наведшим бедствия и тем, кто принесёт вечную радость и спасение.
  alternative: Смягчить первую часть до безличного «допустил бедствия» или скрыть деятеля.
  rationale: Греческий текст прямо связывает обе стороны с одним субъектом посредством форм одного глагола ἐπάγω; перевод сохраняет эту богословскую напряжённость.
- issue: Значение σωτηρία
  choice: спасение
  alternative: избавление
  rationale: «Спасение» сохраняет полноту значения термина, тогда как конкретный смысл избавления отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Заглавная буква в «Тот» уместно указывает на подразумеваемого Бога, не заменяя сохранённую в греческом описательную конструкцию именем.
