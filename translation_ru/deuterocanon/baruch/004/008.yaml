translation:
  language: ru
  text: Вы забыли вечного Бога, вскормившего вас, и также огорчили Иерусалим, воспитавший вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάθεσθε
  choice: Вы забыли
  rationale: Прямо передаёт аорист ἐπιλανθάνομαι и сохраняет обличительный характер высказывания.
- source_word: τὸν τροφεύσαντα ὑμᾶς
  choice: вскормившего вас
  rationale: Передаёт заботу и питание со стороны Бога, сохраняя образ того, кто растит и поддерживает.
- source_word: θεὸν αἰώνιον
  choice: вечного Бога
  rationale: Естественное для современного русского языка определительное сочетание, точно передающее αἰώνιον.
- source_word: ἐλυπήσατε
  choice: огорчили
  rationale: Передаёт причинение скорби; в данном контексте звучит естественнее, чем более тяжеловесное «причинили скорбь».
- source_word: δὴ καὶ
  choice: и
  rationale: Καί выражает присоединение, а усилительный оттенок δή в русском достаточно поддерживается параллельным построением фразы; отдельное «к тому же» было бы стилистически тяжелее.
- source_word: τὴν ἐκθρέψασαν ὑμᾶς
  choice: воспитавший вас
  rationale: Передаёт ἐκτρέφω как выращивание и воспитание, отличая этот образ от «вскормившего» в первой части.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Традиционная русская форма имени; мужской грамматический род требует согласования «воспитавший», при этом олицетворение города сохраняется.
theological_decisions:
- issue: Олицетворение Иерусалима как взрастившего народ
  choice: 'Сохранить личностный образ: «Иерусалим, воспитавший вас»'
  alternative: «Иерусалим, который воспитал вас»; «мать вашу, Иерусалим»
  rationale: Женский причастный оборот в греческом олицетворяет Иерусалим, но прямо не называет его матерью. Русский грамматический род имени меняет форму причастия, не устраняя самого олицетворения.
- issue: Божественный эпитет αἰώνιον
  choice: «вечного Бога»
  alternative: «Бога вечного»; «предвечного Бога»
  rationale: «Вечный» точно и без конфессионального уточнения передаёт значение αἰώνιος; «предвечный» добавлял бы оттенок, не обязательный в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм исходного текста сохранён; архаизмы и добавление слова «мать» исключены.
