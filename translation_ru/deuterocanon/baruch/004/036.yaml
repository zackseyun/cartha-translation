lexical_decisions:
- source_word: περίβλεψαι
  choice: Оглянись
  rationale: Аористный императив среднего залога от περιβλέπω призывает направить взгляд. «Оглянись» естественно передаёт значение сложного глагола и отличается от следующего ἴδε — «увидь».
- source_word: πρὸς ἀνατολάς
  choice: на восток
  rationale: Во множественном числе ἀνατολαί может означать «восходы», но здесь устойчиво обозначает восточное направление; по-русски естественно «на восток».
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Стандартная русская форма названия города; синтаксис сохраняет прямое обращение к олицетворённому Иерусалиму.
- source_word: ἴδε
  choice: увидь
  rationale: Аористный императив от ὁράω передаёт призыв не только посмотреть, но и увидеть приближающуюся радость. Форма современна и сохраняет императив.
- source_word: εὐφροσύνην
  choice: радость
  rationale: εὐφροσύνη означает радость, веселье, ликование; «радость» ясно и ёмко передаёт основной смысл.
- source_word: τὴν παρὰ τοῦ θεοῦ
  choice: от Бога
  rationale: 'παρά с родительным падежом указывает на источник: радость исходит от Бога.'
- source_word: σοι
  choice: к тебе
  rationale: Дательный местоимения связан с направленным движением причастия ἐρχομένην; «к тебе» естественно передаёт приближение к олицетворённому городу.
- source_word: ἐρχομένην
  choice: идущую
  rationale: Причастие настоящего времени обозначает радость, которая находится в движении к Иерусалиму. «Идущую к тебе» сохраняет образ приближения без ненужного уточнения способа.
theological_decisions:
- issue: Олицетворение Иерусалима
  choice: Сохранено прямое обращение к Иерусалиму как к лицу
  alternative: Передать название города без выраженного прямого обращения
  rationale: Греческий текст непосредственно обращается к Иерусалиму и согласует с ним повеления и местоимение второго лица; это сохраняет пророческую поэтичность.
- issue: Источник приближающейся радости
  choice: «от Бога» непосредственно относится к радости
  alternative: Перестроить фразу как «радость, которую Бог посылает тебе»
  rationale: Греческое παρά с родительным обозначает источник, но не выражает прямо глагол «посылает»; перевод не добавляет отсутствующего действия.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Пара императивов «оглянись… и увидь» сохраняет ритм и различие двух греческих глаголов; архаизмы не используются.
