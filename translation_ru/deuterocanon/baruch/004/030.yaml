lexical_decisions:
- source_word: Θάρσει
  choice: Мужайся
  rationale: Повелительная форма призывает обрести мужество и уверенность. «Мужайся» естественно и достойно звучит в современном русском библейском тексте, сохраняя побудительную силу греческого слова.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Общепринятая русская форма названия города; обращение передано звательной интонацией.
- source_word: παρακαλέσει
  choice: утешит
  rationale: Будущее время παρακαλέω. В контексте страдающего Иерусалима значение утешения точнее контекстуально, чем возможное «ободрит».
- source_word: ὁ ὀνομάσας σε
  choice: Тот, кто дал тебе имя
  rationale: Субстантивированное причастие обозначает действующее лицо. Оборот «дал тебе имя» естественнее по-русски, чем буквальное «назвал тебя», и сохраняет личную направленность действия без добавления имени или титула Бога.
theological_decisions:
- issue: Кого обозначает выражение ὁ ὀνομάσας σε
  choice: 'Описательно передать: «Тот, кто дал тебе имя», не добавляя в основной текст слово «Бог» или «Господь».'
  alternative: «Господь, давший тебе имя»; «Бог, который дал тебе имя».
  rationale: Из контекста понятно, что речь идёт о Боге, однако в самом греческом стихе нет божественного имени или титула. Описательная передача сохраняет формулировку и литературное напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского обращения. Краткий императив и восклицательный знак передают ободряющую интонацию; местоименные формы относятся к персонифицированному Иерусалиму.
