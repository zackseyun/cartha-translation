base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/015.yaml
  text: For he brought against them a nation from far away[a], a shameless and foreign-speaking nation, which showed no respect for the old man and had no mercy on the child[b],
translation:
  language: ru
  text: Ибо Он навёл на них издалека народ — народ бесстыдный и иноязычный; они не оказали почтения старику и не пожалели ребёнка[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слова «старик» и «ребёнок» стоят в единственном числе и служат собирательными образами уязвимых людей.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπήγαγεν ... ἐπʼ αὐτούς
  choice: навёл на них
  rationale: Передаёт действие враждебной силы, приведённой на народ, и естественно сочетается в русском с предлогом «на».
- source_word: ἔθνος μακρόθεν
  choice: издалека народ
  rationale: Сохраняет значение географической удалённости и повтор существительного ἔθνος в следующей фразе.
- source_word: ἔθνος ἀναιδές
  choice: народ бесстыдный
  rationale: «Бесстыдный» прямо передаёт основное значение ἀναιδής — отсутствие стыда, не подменяя его более интерпретирующим «безжалостный».
- source_word: ἀλλόγλωσσον
  choice: иноязычный
  rationale: Точно и кратко обозначает народ, говорящий на другом языке; слово естественно для современного литературного русского.
- source_word: οὐκ ᾐσχύνθησαν πρεσβύτην
  choice: не постыдились перед стариком
  rationale: Сохраняет образ стыда как нравственной преграды и передаёт подразумеваемое отсутствие почтения к пожилому человеку.
- source_word: οὐδὲ παιδίον ἠλέησαν
  choice: и не пожалели ребёнка
  rationale: Естественно передаёт отсутствие жалости или милосердия, сохраняя единственное число παιδίον.
theological_decisions:
- issue: Собирательное единственное число ἔθνος и последующие глаголы во множественном числе
  choice: народ… они
  alternative: народ… который не постыдился и не пожалел
  rationale: Греческий текст переходит от существительного единственного числа к глаголам множественного числа, представляя народ как совокупность людей. Русский переход «народ… они» сохраняет эту особенность и яснее указывает на действия захватчиков.
- issue: Единственное число в обозначениях уязвимых людей
  choice: стариком… ребёнка
  alternative: стариками… детьми
  rationale: Сохранены греческие формы единственного числа πρεσβύτην и παιδίον, риторически представляющие целые категории уязвимых людей.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Повтор «народ — народ» сохранён ради риторического акцента оригинала; местоимение «Он» относится к Богу из контекста.
