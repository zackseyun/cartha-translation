lexical_decisions:
- source_word: ἐπιστρέφου
  choice: Повернись
  rationale: Возвратный императив передаёт направленное движение «повернись»; значение «вернись» также возможно и отмечено в сноске, чтобы не снимать подлинную неоднозначность.
- source_word: Ἰακώβ
  choice: Иаков
  rationale: Сохранено прямо названное в греческом тексте имя, хотя в контексте оно обозначает народ Израиля.
- source_word: ἐπιλαβοῦ αὐτῆς
  choice: ухватись за неё
  rationale: Глагол означает крепко взяться, ухватиться; женское местоимение сохранено, чтобы не сглаживать олицетворение и связь с существительными женского рода в контексте.
- source_word: διόδευσον
  choice: иди
  rationale: Императив обозначает продвижение, следование по пути. Простое «иди» естественно по-русски и сохраняет образ движения.
- source_word: πρὸς τὴν λάμψιν
  choice: к сиянию
  rationale: πρός передаёт направленность, а λάμψις — блеск или сияние; выбранное сочетание сохраняет возвышенную световую образность.
- source_word: κατέναντι τοῦ φωτὸς αὐτῆς
  choice: навстречу её свету
  rationale: κατέναντι может означать «напротив», «перед», «лицом к». «Навстречу» выражает ориентацию к свету и звучит естественнее буквального «напротив её света», не устраняя необычную параллель «сияние — свет».
theological_decisions:
- issue: Олицетворение объекта в αὐτῆς
  choice: Сохранить женское «за неё / её свет»
  alternative: 'Передать безлично: «ухватись за него» или «держись этого», соотнося местоимение с законом или повелением'
  rationale: Греческое местоимение женского рода поддерживает олицетворение закона/мудрости в контексте. Сохранение женского рода удерживает литературно-богословское напряжение и не сводит образ лишь к безличному предписанию.
- issue: Направление действия в ἐπιστρέφου
  choice: «Повернись»
  alternative: «Вернись» или «Обратись»
  rationale: Форма допускает как физическое обращение, так и возвращение. «Повернись» не навязывает исключительно покаянного или пространственного толкования; возможное «вернись» указано в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтической приподнятостью, соответствующей образам пути, сияния и света. Обращение «Иаков» оставлено без междометия «о», которое в современном русском звучало бы архаично. Необычная образность греческой фразы сохранена, но синтаксис сделан понятным для обычного читателя.
