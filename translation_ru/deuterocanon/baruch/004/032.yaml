    reason: lexical_alternative
lexical_decisions:
- source_word: δείλαιαι
  choice: несчастны / несчастна
  rationale: Передаёт восклицательное выражение скорби и осуждения, сохраняя форму прилагательного и не превращая её в истолковывающее «горе».
- source_word: αἱ πόλεις
  choice: города
  rationale: Речь идёт об определённых городах, известных из контекста; по-русски определённость не требует отдельного показателя.
- source_word: αἷς ἐδούλευσαν
  choice: у которых … были в рабстве
  rationale: Глагол δουλεύω здесь обозначает подневольное, рабское служение. Такая формулировка естественно звучит по-русски, передаёт силу контекста изгнания и сохраняет связь с городами.
- source_word: τὰ τέκνα σου
  choice: твои дети
  rationale: τέκνα обозначает детей в широком смысле, а не только сыновей.
- source_word: ἡ δεξαμένη
  choice: та, что приняла
  rationale: Сохраняется женский род и олицетворение города как женщины; «приняла» не уточняет сверх исходного текста, был ли приём добровольным или враждебным.
- source_word: τοὺς υἱούς σου
  choice: твоих сыновей
  rationale: υἱούς означает именно сыновей; сохранён намеренный лексический переход от более общего «дети».
theological_decisions:
- issue: Значение δουλεύω в контексте изгнания и суда
  choice: были в рабстве
  alternative: служили как рабы
  rationale: Контекст указывает не на обычную службу, а на подневольное положение детей Сиона. При этом сноска сохраняет более формально активную передачу греческого глагола.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной параллельной конструкцией. Повтор «несчастны / несчастна» воспроизводит риторическую симметрию греческого текста; олицетворение во второй части сохранено.
