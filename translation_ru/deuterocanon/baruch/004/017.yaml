translation:
  language: ru
  text: А я — чем могу вам помочь?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ
  choice: А я
  rationale: Явное местоимение сохраняет смысловое выделение говорящей; начальная конструкция «А я» естественно передаёт это по-русски.
- source_word: δὲ
  choice: А
  rationale: Частица обозначает мягкое противопоставление или переход; союз «а» передаёт его без излишнего усиления.
- source_word: τί
  choice: чем
  rationale: Буквально «что», но вместе с δυνατή и инфинитивом вопрос выражает невозможность оказать какую-либо помощь. Русское «чем могу помочь?» естественно сохраняет и форму, и риторическую силу вопроса.
- source_word: δυνατὴ
  choice: могу
  rationale: Прилагательное с инфинитивом выражает способность или возможность; русское «могу» точно и естественно передаёт эту конструкцию.
- source_word: βοηθῆσαι
  choice: помочь
  rationale: Глагол означает оказать помощь; краткое «помочь» соответствует контексту и современному литературному русскому языку.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж множественного числа непосредственно передаётся формой «вам».
