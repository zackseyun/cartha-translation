  text: For I nourished them with gladness, but I sent them away with weeping and mourning.
translation:
  language: ru
  text: Ибо я растила их с радостью, а отправила с плачем и скорбью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθρεψα
  choice: растила
  rationale: Глагол τρέφω может означать кормить, питать или растить. «Растила» естественно передаёт и заботу, и родительский образ речи, не сужая смысл до одного кормления.
- source_word: μετʼ εὐφροσύνης
  choice: с радостью
  rationale: Оборот естественно передаёт сопровождающее чувство радости и сохраняет параллелизм со следующим «с плачем и скорбью».
- source_word: ἐξαπέστειλα
  choice: отправила
  rationale: «Отправила» передаёт удаление тех, кого говорящая прежде растила, и не добавляет прямо не названного в стихе пояснения об изгнании.
- source_word: μετὰ κλαυθμοῦ
  choice: с плачем
  rationale: «С плачем» точно и естественно передаёт κλαυθμός и формально соответствует предыдущему обороту с μετά.
- source_word: πένθους
  choice: скорбью
  rationale: «Скорбь» передаёт тяжёлое переживание утраты и в сочетании с «плачем» звучит естественно в современном литературном русском языке.
theological_decisions:
- issue: Материнский голос говорящей и контекст изгнания
  choice: Сохранить речь от первого лица в женском роде, не называя изгнание прямо.
  alternative: Добавить пояснение, что детей отправили в изгнание.
  rationale: В контексте говорит олицетворённый Иерусалим в материнском образе, поэтому русский женский род уместен. Сам стих выражает контраст радости и скорби, но не называет изгнание прямо; его не следует вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и эмоционально сдержанная. Сохранены причинное «ибо», контраст «а» и параллель двух предложных оборотов.
