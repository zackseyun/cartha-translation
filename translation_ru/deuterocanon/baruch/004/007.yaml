lexical_decisions:
- source_word: παρωξύνατε
  choice: прогневили
  rationale: Аорист действительного залога указывает на совершённое действие. В контексте идолопоклонства «прогневили» естественно передаёт вызванный проступком гнев, не прибегая к более тяжеловесному «возбудили гнев».
- source_word: τὸν ποιήσαντα ὑμᾶς
  choice: Того, Кто создал вас
  rationale: Сохраняет структуру субстантивированного причастия и ясно обозначает Бога как Создателя; прописные буквы уместны для личного обозначения Бога в русском библейском тексте.
- source_word: θύσαντες
  choice: принося жертвы
  rationale: Причастный оборот передаёт средство или обстоятельство, посредством которого адресаты прогневили Создателя. Формулировка естественна по-русски и сохраняет связь с жертвоприношением.
- source_word: δαιμονίοις
  choice: бесам
  rationale: В иудейско-греческом контексте жертв идолам слово обозначает враждебных Богу духовных существ. «Бесам» — ясный и укоренённый в русском библейском языке эквивалент.
- source_word: καὶ οὐ θεῷ
  choice: а не Богу
  rationale: Оба существительных стоят в дательном падеже при θύσαντες и обозначают адресатов жертвы. Русское противопоставление «а не» естественнее буквального «и не».
theological_decisions:
- issue: Значение δαιμονίοις в контексте идольских жертв
  choice: бесам
  alternative: злым духам; идольским силам
  rationale: Перевод сохраняет утверждение текста о духовных адресатах идольских жертв и не сводит его к метафоре или безличным силам.
