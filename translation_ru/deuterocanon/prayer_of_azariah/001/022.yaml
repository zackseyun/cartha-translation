lexical_decisions:
- source_word: γνώτωσαν
  choice: пусть узнают
  rationale: Аористный императив третьего лица множественного числа передан естественной русской побудительной конструкцией; совершенный вид допускает оттенок «пусть придут к пониманию».
- source_word: σὺ
  choice: Ты
  rationale: Отдельно выраженное греческое местоимение несёт смысловое ударение; в русском оно сохранено. Прописная буква соответствует благоговейному регистру обращения к Богу.
- source_word: Κύριος θεὸς
  choice: Господь Бог
  rationale: Оба слова образуют божественное именование; «Господь» — устоявшаяся и точная передача Κύριος в данном молитвенном контексте.
- source_word: μόνος
  choice: один
  rationale: В сочетании «Ты один» естественно и ясно выражает исключительность, не снимая синтаксической связи со сказуемым «Господь Бог».
- source_word: ἔνδοξος
  choice: славен
  rationale: Предикативное краткое прилагательное передаёт славу и величие Бога, не превращая выражение в страдательное «прославлен».
- source_word: ἐφʼ ὅλην τὴν οἰκουμένην
  choice: по всей обитаемой земле
  rationale: «Обитаемая земля» сохраняет конкретную семантику οἰκουμένη, а «по всей» естественно передаёт пространственный охват ἐπί с винительным падежом.
theological_decisions:
- issue: Исключительность Бога в μόνος при Κύριος θεὸς
  choice: Ты один — Господь Бог
  alternative: Ты — единственный Господь Бог
  rationale: Выбранная конструкция сохраняет монотеистическую силу греческого текста и эмфатическое «Ты», не вводя дополнительного толкования.
- issue: Связь двух предикатов через καὶ
  choice: Господь Бог и славен
  alternative: Господь Бог, славный
  rationale: Союз «и» сохранён, чтобы отразить два координированных предиката и не подчинять «славен» именованию «Господь Бог».
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. Синтаксис остаётся ясным для широкого читателя; тире обозначает именную связку и подчёркивает исключительность адресата.
