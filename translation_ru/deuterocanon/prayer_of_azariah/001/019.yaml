translation:
  language: ru
  text: Не посрами нас, но яви нам милость по Твоему снисхождению и по изобилию Твоей милости,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταισχύνῃς
  choice: посрами
  rationale: Глагол означает «опозорить, подвергнуть стыду». «Не посрами нас» — точная, естественная для молитвы и понятная современному читателю формулировка.
- source_word: ποίησον μεθʼ ἡμῶν ἔλεος
  choice: яви нам милость
  rationale: 'Буквально: «сотвори с нами милость». Выбранная формулировка естественно передаёт просьбу о милостивом поступке, сохраняя действенный характер выражения.'
- source_word: ἐπιείκειάν
  choice: снисхождению
  rationale: Существительное обозначает мягкость, кроткую уступчивость или снисходительность. В контексте просьбы к Богу «снисхождение» точнее передаёт милостивую мягкость и не смешивает это качество с ἔλεος.
- source_word: πλῆθος
  choice: великому множеству
  rationale: Слово выражает многочисленность или изобилие. Сочетание «великое множество» звучит торжественно и ясно передаёт безмерность милости.
- source_word: ἐλέους
  choice: милости
  rationale: В покаянной молитве ἔλεος обозначает милость к нуждающемуся в прощении и помощи; «милость» сохраняет молитвенный и богословский смысл.
theological_decisions:
- issue: Различение ἐπιείκεια и ἔλεος как двух Божьих качеств
  choice: «снисхождение» и «милость»
  alternative: Передать оба слова через «милость» или употребить «кротость» и «милосердие»
  rationale: 'Греческий текст использует два близких, но не тождественных понятия: мягкое снисхождение и обильную милость. Их различение сохраняет смысловой параллелизм и не сводит оба качества к одному.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Местоимение «Твоему/Твоей» написано с прописной буквы согласно принятой русской практике благоговейного обращения к Богу. Синтаксис следует греческому параллелизму, но остаётся естественным по-русски.
