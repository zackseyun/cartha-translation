  text: Bless the Lord, frost and cold; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, иней и холод; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Форма повелительного наклонения во множественном числе обращена к силам творения. «Благословляйте» сохраняет литургический и славословный характер повторяющегося призыва.
- source_word: πάγος
  choice: мороз
  rationale: Слово может обозначать мороз, иней или лёд. В паре с ψῦχος здесь естественно назвать природное явление — мороз, не сливая его полностью с более общим понятием холода.
- source_word: ψῦχος
  choice: холод
  rationale: Прямое и понятное соответствие существительному со значением холода или стужи.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Стандартная передача κύριος в обращённом к Богу славословии; форма винительного падежа обусловлена глаголом «благословляйте».
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Передаёт не просто хвалу, а хвалу в песнопении, сохраняя поэтический строй гимна.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русский глагол выражает усиленное возвеличивание, заложенное в греческом сложном глаголе.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткая, естественная для библейского гимна передача устойчивого выражения о непрестанной, вечной хвале.
theological_decisions:
- issue: Передача κύριος в греческом девтероканоническом гимне
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: В источнике стоит κύριος, а не еврейское четырёхбуквенное имя; поэтому нейтральная и традиционная передача «Господь» не вносит в текст отсутствующего графического различия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной гимнической лексикой. Формы «воспевайте», «превозносите» и «вовеки» сохраняют достоинство и ритм славословия, оставаясь понятными современному читателю.
