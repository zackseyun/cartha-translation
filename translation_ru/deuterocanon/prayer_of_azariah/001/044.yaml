base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/044.yaml
  text: Bless the Lord[a], frost and cold; sing hymns and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа[a], стужа и холод; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Хвалите Господа, стужа и холод». Греческое εὐλογεῖτε может означать «благословляйте» или в более общем смысле «хвалите»; основной вариант сохраняет повторяющийся рефрен песни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Повелительное наклонение множественного числа призывает творение благословлять, то есть хвалить Господа. «Благословляйте» сохраняет литургический повтор песни, тогда как «хвалите» передаёт смысл шире.
- source_word: ῥῖγος
  choice: стужа
  rationale: Обозначает сильный холод, мороз или стужу. «Стужа» естественно выступает как олицетворённое явление и позволяет отличить слово от следующего ψῦχος.
- source_word: καὶ
  choice: и
  rationale: Простой сочинительный союз, соединяющий два природных явления.
- source_word: ψῦχος
  choice: холод
  rationale: Обозначает холод; нейтральное современное соответствие, не сливающееся со «стужей».
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычное русское библейское соответствие κύριος; форма винительного падежа обусловлена управлением глагола.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол указывает на хвалу в песнопении. «Воспевайте» передаёт музыкальный оттенок естественнее, чем буквальное «пойте гимны».
- source_word: καὶ ὑπερυψοῦτε
  choice: и превозносите
  rationale: Сложный глагол выражает усиленное возвышение и прославление. Русское «превозносите» само содержит усилительный оттенок и хорошо подходит к гимническому контексту.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение относится к Господу; прописная буква соответствует принятому русскому благоговейному написанию в библейском тексте.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое, понятное и уместное в славословии соответствие выражению вечной продолжительности.
theological_decisions:
- issue: Передача κύριος в греческом девтероканоническом гимне
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — стандартное русское библейское соответствие κύριος; контекст не требует более узкого значения «Владыка».
- issue: Объект двух повелений во второй части стиха
  choice: Местоимение «Его» явно относится к Господу и служит общим объектом «воспевайте» и «превозносите»
  alternative: Повторить «Господа» при каждом глаголе
  rationale: Так сохраняются синтаксис греческого текста и его гимническая краткость без внесения дополнительного повтора.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным гимническим звучанием. Слова «стужа», «воспевайте», «превозносите» и «вовеки» понятны современному читателю и сохраняют поэтический параллелизм исходного текста.
