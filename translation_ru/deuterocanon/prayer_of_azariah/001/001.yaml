lexical_decisions:
- source_word: Οὕτως οὖν
  choice: Так
  rationale: «Так» естественно передаёт указание на образ действия в οὕτως; связующая сила οὖν подразумевается контекстом и не требует тяжеловесного сочетания «итак, таким образом».
- source_word: προσηύξατο
  choice: молились
  rationale: Глагол означает «молиться». Русское множественное число согласовано с составным подлежащим, хотя в греческом стоит форма единственного числа.
- source_word: Ἀνανίας καὶ Ἀζαρίας καὶ Μισαήλ
  choice: Анания, Азария и Мисаил
  rationale: Использованы традиционные русские формы данных здесь еврейских имён; повторение союзов передано естественным русским перечислением.
- source_word: ὕμνησαν
  choice: воспевали
  rationale: «Воспевали» сохраняет присущий ὑμνέω смысл хвалебного пения и звучит естественно в возвышенном библейском повествовании.
- source_word: τῷ κυρίῳ
  choice: Господа
  rationale: В контексте молитвы и хвалы κύριος обозначает Бога; «Господь» сохраняет принятое библейско-богословское значение.
- source_word: ὅτε
  choice: когда
  rationale: Передаёт временное значение союза без необоснованного уточнения последовательности событий.
- source_word: προσέταξεν ἐμβληθῆναι
  choice: приказал бросить их
  rationale: Естественная русская конструкция сохраняет значение царского приказа и насильственного помещения в печь, выраженное пассивным инфинитивом.
- source_word: εἰς τὴν κάμινον
  choice: в печь
  rationale: «Печь» — ясное и традиционное соответствие κάμινος в рассказе Даниила; определение «раскалённую» в данном стихе отсутствует.
theological_decisions:
- issue: Передача κύριος применительно к Богу
  choice: Господь
  alternative: владыка
  rationale: Контекст молитвы и хвалебного пения указывает на Бога; «Господь» сохраняет обычное для Писания богословское наименование.
- issue: Формы имён трёх юношей
  choice: Анания, Азария и Мисаил
  alternative: Седрах, Мисах и Авденаго
  rationale: Греческий текст приводит их еврейские имена в греческой форме, а не вавилонские придворные имена; перевод следует непосредственно данному тексту.
