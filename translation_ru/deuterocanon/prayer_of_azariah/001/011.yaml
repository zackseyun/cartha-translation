base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/011.yaml
  text: Do not give us over utterly for the sake of your name[b][a], and do not break your covenant.
translation:
  language: ru
  text: Не предавай нас окончательно ради твоего имени[a] и не разрушай свой завет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до конца»; возможно также: «совершенно» или «навсегда».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально греческий глагол означает «рассеивать» или «разбрасывать»; по смыслу возможно также: «не расторгай» или «не нарушай свой завет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ παραδῷς ἡμᾶς
  choice: Не предавай нас
  rationale: παραδίδωμι означает «передавать, выдавать, предавать во власть». Русское «предавать» сохраняет смысл оставления во власти гибели или врагов, не уточняя того, что греческий текст не называет.
- source_word: εἰς τέλος
  choice: окончательно
  rationale: Буквально выражение означает «до конца», но здесь естественно передаёт полноту и необратимость оставления. «Окончательно» сохраняет эту смысловую напряжённость без добавления значения «навсегда».
- source_word: διὰ τὸ ὄνομά σου
  choice: ради твоего имени
  rationale: Оборот выражает просьбу, основанную на Божьем имени — его явленной сущности, чести и верности. «Ради твоего имени» естественно и точно передаёт эту формулу.
- source_word: μὴ διασκεδάσῃς σου τὴν διαθήκην
  choice: не разрушай свой завет
  rationale: διασκεδάζω буквально значит «рассеивать, разбрасывать», но с «заветом» образ указывает на его разрушение. «Разрушай» оставляет образное звучание и не сводит выражение исключительно к юридическому «расторгай»; буквальный образ отмечен в сноске.
theological_decisions:
- issue: Смысл εἰς τέλος в мольбе о милости
  choice: окончательно
  alternative: до конца; навсегда; совершенно
  rationale: Текст может указывать как на доведение предания до конца, так и на полное оставление. «Окончательно» передаёт итоговый и полный характер угрозы, не превращая её однозначно во временное «навсегда».
- issue: Необычное сочетание διασκεδάζω с διαθήκη
  choice: не разрушай свой завет
  alternative: не рассеивай свой завет; не расторгай свой завет; не нарушай свой завет
  rationale: Буквальное «рассеивать завет» в русском почти непонятно, тогда как «разрушать» сохраняет конкретность греческого образа. «Расторгать» было бы более юридическим, а «нарушать» могло бы сильнее подчеркнуть неверность одной из сторон, чем позволяет исходная метафора.
