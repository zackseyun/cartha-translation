lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Естественный временной переход, точно передающий греческое наречие.
- source_word: οἱ τρεῖς
  choice: трое
  rationale: Сохраняет лаконичность оригинала, где существительное не повторяется; русская собирательная форма естественна для трёх лиц мужского пола.
- source_word: ὡς ἐξ ἑνὸς στόματος
  choice: словно едиными устами
  rationale: Сохраняет яркий образ греческого выражения и передаёт полное единство их хвалы; «словно» отражает ὡς.
- source_word: ὕμνουν
  choice: воспевали
  rationale: Передаёт продолженное действие имперфекта и песенный характер хвалы без тяжеловесного оборота «пели гимны».
- source_word: ἐδόξαζον
  choice: прославляли
  rationale: Сохраняет отдельное значение воздавания славы и не сливает этот глагол с соседними глаголами хвалы.
- source_word: εὐλόγουν
  choice: благословляли
  rationale: Формально и богословски нейтрально сохраняет самостоятельный глагол оригинала.
- source_word: τὸν θεὸν
  choice: Бога
  rationale: Обычная русская передача определённого обозначения единого Бога в данном контексте.
- source_word: ἐν τῇ καμίνῳ
  choice: в печи
  rationale: «Печь» — естественное и традиционно понятное русское обозначение огненной печи в повествовании Даниила.
- source_word: λέγοντες
  choice: говоря
  rationale: Прямо передаёт причастие, вводящее последующую речь.
