  text: Bless the Lord[a], spirits and souls of the righteous[b]; sing hymns and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, духи и души праведных; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Форма повелительного наклонения во множественном числе. «Благословляйте» сохраняет литургический и славословный оттенок греческого глагола; возможное «прославляйте» менее буквально.
- source_word: πνεύματα καὶ ψυχαὶ
  choice: духи и души
  rationale: Сохранены оба греческих существительных и их различие без сведения выражения к одному антропологическому понятию.
- source_word: δικαίων
  choice: праведных
  rationale: 'Родительный падеж естественно относится к обоим однородным существительным: «духи и души праведных».'
- source_word: τὸν κύριον
  choice: Господа
  rationale: Традиционное и контекстуально уместное соответствие κύριος в иудейско-греческом богослужебном тексте.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Передаёт именно песенное, гимническое прославление и звучит естественно в современном литературном русском языке.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русский глагол передаёт усиленное возвеличивание, выраженное греческим сложным глаголом.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткая и естественная для славословного рефрена передача устойчивой формулы «на века».
theological_decisions:
- issue: Соотношение «духов» и «душ» праведных
  choice: 'Сохранить оба понятия раздельно: «духи и души праведных».'
  alternative: Передать как единое понятие, например «души праведных», или истолковать как «праведные всем духом и душой».
  rationale: Греческий текст прямо называет πνεύματα и ψυχαί. Их сохранение не навязывает определённой антропологической схемы и не устраняет присущую тексту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с dignified литургическим звучанием. Формы «воспевайте», «превозносите» и «вовеки» уместны в поэтическом славословии, понятны современному читателю и поддерживают параллелизм рефрена.
