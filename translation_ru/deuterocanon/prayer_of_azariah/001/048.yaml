  text: Bless the Lord, nights and days; sing praise and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, ночи и дни; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Повелительное наклонение множественного числа. «Благословляйте» сохраняет библейское и литургическое звучание и не сливается по смыслу с последующим ὑμνεῖτε.
- source_word: νύκτες καὶ ἡμέραι
  choice: ночи и дни
  rationale: Греческий текст содержит множественное число и прямое обращение к олицетворённым временам суток; русский вариант сохраняет оба признака.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычный и естественный русский эквивалент κύριος в греческом богослужебном контексте.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу, выражаемую в песнопении; «воспевайте» естественно передаёт музыкально-поэтический оттенок.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русский глагол передаёт усиленное значение сложного греческого глагола — возвеличивать в высшей степени — без тяжеловесного наречия.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение является общим прямым дополнением при двух однородных повелительных глаголах; в русском оно естественно ставится перед заключительным обстоятельством.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивый, понятный и уместный для песнопения русский эквивалент идиомы, выражающей непрестанную длительность.
theological_decisions:
- issue: Передача κύριος в литургическом славословии
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Исходный текст содержит греческое κύριος, а не непосредственно засвидетельствованное здесь еврейское четырёхбуквенное имя; поэтому обычное «Господь» точнее отражает данный источник.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным литургическим звучанием. Сохранены поэтическое обращение к ночам и дням, параллелизм двух повелений и краткость рефрена.
