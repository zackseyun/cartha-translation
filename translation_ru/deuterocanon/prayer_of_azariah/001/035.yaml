translation:
  language: ru
  text: Благословляйте Господа, ангелы Господни; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Множественное повелительное наклонение εὐλογέω в богослужебном призыве; «благословляйте» сохраняет библейский и литургический оттенок греческого глагола.
- source_word: ἄγγελοι
  choice: ангелы
  rationale: В космическом гимническом призыве речь идёт о небесных существах, а не о человеческих посланниках.
- source_word: Κυρίου / τὸν κύριον
  choice: Господни / Господа
  rationale: κύριος здесь обозначает Господа; сочетание «ангелы Господни» естественно и достоинственно передаёт родительный оборот.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол ὑμνέω подразумевает хвалебное пение; «воспевайте» передаёт музыкально-гимнический смысл естественнее буквального «пойте гимны».
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русское «превозносите» сохраняет усилительный смысл приставочного греческого глагола и подходит к торжественному рефрену.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивый библейский эквивалент, передающий непрекращающуюся длительность и соответствующий гимническому регистру.
theological_decisions:
- issue: Передача κύριος в греческом гимне
  choice: Господь
  alternative: Владыка
  rationale: Контекст прославления Бога и выражение «ангелы Господни» требуют обычной библейской передачи «Господь»; вариант «Владыка» без необходимости менял бы словесную связь.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейско-гимническим регистром. Формы «Господни», «воспевайте», «превозносите» и «вовеки» сохраняют торжественность, оставаясь понятными современному читателю.
