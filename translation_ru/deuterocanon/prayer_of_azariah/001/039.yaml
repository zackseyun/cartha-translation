    text: 'Букв.: «на века».'
    reason: Более буквальная передача греческого выражения εἰς τοὺς αἰῶνας.
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Повелительное наклонение множественного числа; «благословляйте» сохраняет повторяющуюся литургическую формулу и одновременно передаёт призыв воздавать Богу хвалу.
- source_word: ἥλιος καὶ σελήνη
  choice: солнце и луна
  rationale: Прямое поэтическое обращение к небесным светилам; в русском языке форма именительного падежа естественно выполняет функцию обращения.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В данном иудейском гимническом контексте κύριος обозначает Бога; традиционное и ясное русское соответствие — «Господь».
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол означает хвалить песнопением; «воспевайте» кратко и естественно сохраняет музыкально-гимнический оттенок.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Приставочный глагол выражает усиленное возвеличивание; «превозносите» передаёт эту интенсивность без тяжеловесного наречия.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое русское выражение передаёт значение непрестанного, вечного прославления, сохраняя возвышенный литургический регистр.
theological_decisions:
- issue: Передача κύριος в иудейском гимническом контексте
  choice: Господь
  alternative: Владыка
  rationale: «Господь» естественно обозначает Бога Израиля и не вводит отсутствующих в греческом тексте типографических или конфессиональных уточнений.
