  text: And now we follow after you with our whole heart[a], and we fear you, and we seek your face.
translation:
  language: ru
  text: И ныне мы следуем за Тобой всем сердцем, боимся Тебя и ищем Твоего лица.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ищем Твоего присутствия». Буквально по-гречески: «ищем Твоего лица» — библейский образ стремления к Божьему присутствию или благоволению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: И ныне
  rationale: Сохраняет соединительный καί и непосредственность перехода к нынешнему обращению; «ныне» уместно в возвышенной молитвенной речи и понятно современному читателю.
- source_word: ἐξακολουθοῦμεν
  choice: мы следуем за Тобой
  rationale: Передаёт продолжающееся следование и верность без избыточного уточнения «продолжаем»; подразумеваемое дополнение ясно из последующего местоимения и контекста обращения к Богу.
- source_word: ἐν ὅλῃ καρδίᾳ ἡμῶν
  choice: всем сердцем
  rationale: Естественный русский библейский оборот, выражающий целостную, неразделённую преданность.
- source_word: φοβούμεθά σε
  choice: боимся Тебя
  rationale: Прямо сохраняет значение страха перед Богом и не сводит его лишь к почтению или благоговению.
- source_word: ζητοῦμεν τὸ πρόσωπόν σου
  choice: ищем Твоего лица
  rationale: Сохраняет буквальный образ и библейскую межтекстовую связь; значение Божьего присутствия или благоволения поясняется в сноске.
theological_decisions:
- issue: Передача φοβούμεθά σε применительно к Богу
  choice: боимся Тебя
  alternative: благоговеем перед Тобой
  rationale: Греческий текст прямо употребляет лексику страха. Основной текст сохраняет богословское напряжение, не ограничивая смысл одним благоговением.
- issue: Передача ζητοῦμεν τὸ πρόσωπόν σου
  choice: ищем Твоего лица
  alternative: ищем Твоего присутствия
  rationale: Буквальный образ сохранён ради прозрачности и библейского звучания; возможный идиоматический смысл вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской религиозно-издательской традиции; синтаксис остаётся ясным и естественным.
