  source_fidelity: 'Русский текст точно передаёт все элементы греческого оригинала: καὶ νῦν — «И ныне»; ἐξακολουθοῦμεν — «следуем за Тобой»; ἐν ὅλῃ καρδίᾳ ἡμῶν — «всем сердцем»; φοβούμεθά σε — «боимся Тебя»; ζητοῦμεν τὸ πρόσωπόν σου — «ищем Твоего лица». Порядок действий и молитвенное обращение сохранены. «Следуем за Тобой» передаёт смысл глагола без неоправданного добавления «продолжаем».'
