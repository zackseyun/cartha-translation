translation:
  language: ru
  text: Благословляйте Господа, иней и снега; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Повелительное наклонение множественного числа сохранено буквально; «благословляйте» поддерживает литургический рефрен Песни и передаёт призыв ко всему творению воздавать Богу хвалу.
- source_word: πάχναι
  choice: иней
  rationale: Слово обозначает иней или изморозь. «Иней» — точное и понятное современному читателю обозначение природного явления.
- source_word: χιόνες
  choice: снега
  rationale: Форма множественного числа отражает греческое множественное χιόνες и естественна в возвышенной поэтической речи.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычное русское соответствие κύριος в обращённом к Богу литургическом контексте; прописная буква ясно указывает на божественный титул.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу в песнопении. «Воспевайте» сохраняет музыкальный оттенок и звучит естественно в русском гимническом тексте.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Интенсивное значение греческого глагола передано приставочным русским глаголом, означающим чрезвычайно высоко возносить и прославлять.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое русское литургическое выражение естественно передаёт значение нескончаемой продолжительности в данном рефрене.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Господь с типографическим выделением «ГОСПОДЬ»
  rationale: Греческий текст содержит обычное κύριος и сам по себе не требует типографически обозначать ветхозаветное имя Бога; стандартный титул «Господь» не вносит дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным гимническим звучанием. Сохранены повелительные формы, прямое обращение к природным явлениям и параллельная структура рефрена; архаизирующая форма «вовеки» остаётся общеупотребительной и прозрачной в библейско-литургическом контексте.
