  text: Bless the Lord, stars of heaven; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, звёзды небесные; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Повелительная форма множественного числа сохраняет литургический призыв благословлять Бога и повторяющуюся структуру песни.
- source_word: ἄστρα τοῦ οὐρανοῦ
  choice: звёзды небесные
  rationale: ἄστρα прямо обозначает звёзды, а естественное русское сочетание «звёзды небесные» передаёт принадлежность к небу и возвышенный поэтический регистр.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В гимническом обращении κύριος выступает как божественный титул; традиционное и ясное русское соответствие — «Господь».
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол означает петь хвалу или гимн; «воспевайте» естественно передаёт одновременно музыкальный и хвалебный оттенки.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Приставочный глагол выражает усиленное возвеличивание; «превозносите» сохраняет эту интенсивность без тяжеловесного пояснения.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: В литургическом рефрене выражение указывает на непрестанную, вечную хвалу; «вовеки» кратко и уместно для возвышенного гимнического текста.
theological_decisions:
- issue: Передача κύριος в обращённом к Богу второканоническом гимне
  choice: Господа
  alternative: Владыку
  rationale: Греческий текст содержит κύριον; «Господь» передаёт обычный божественный титул, не добавляя отсутствующего в данном греческом свидетельстве указания на тетраграмматон.
