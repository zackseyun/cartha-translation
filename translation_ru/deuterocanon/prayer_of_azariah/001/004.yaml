base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/004.yaml
  text: For you are righteous in all that you have done to us, and all your works are true, and your ways are straight, and all your judgments are true.
translation:
  language: ru
  text: Ибо Ты праведен во всём, что сделал с нами; все дела Твои истинны, пути Твои прямы, и все суды Твои истинны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: праведен
  rationale: Передаёт нравственную правоту Бога и сохраняет привычное библейско-богословское звучание; «справедлив» было бы допустимо, но несколько сужало бы смысл.
- source_word: πᾶσιν οἷς ἐποίησας ἡμῖν
  choice: во всём, что сделал с нами
  rationale: Естественно передаёт охват греческой конструкции и её прямое указание на действия Бога по отношению к говорящим.
- source_word: ἔργα
  choice: дела
  rationale: Прямой, естественный и устойчивый русский эквивалент для деяний Бога.
- source_word: ἀληθινὰ / ἀληθιναί
  choice: истинны
  rationale: Сохраняет повтор исходного текста и широкий смысл истинности и надёжности, не сужая его до одной лишь верности.
- source_word: ὁδοί
  choice: пути
  rationale: Сохраняет библейскую метафору образа действий Бога и понятно современному читателю.
- source_word: εὐθεῖαι
  choice: прямы
  rationale: Передаёт буквальный образ прямоты путей, не заменяя его истолкованием «праведны» или «справедливы».
- source_word: κρίσεις
  choice: суды
  rationale: Соответствует контексту Божьих приговоров и решений и сохраняет традиционно понятную библейскую лексику.
theological_decisions:
- issue: Праведность Бога в связи со страданиями, пережитыми говорящими
  choice: 'Сохранено прямое утверждение: «что сделал с нами».'
  alternative: Можно было бы передать косвенно — как то, что Бог допустил случиться с ними.
  rationale: Греческий текст прямо говорит ἐποίησας ἡμῖν, поэтому перевод не смягчает Божественную субъектность и сохраняет напряжение между пережитым бедствием и исповеданием Божьей праведности.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного библейского регистра. Заглавные буквы в местоимениях, относящихся к Богу, использованы как уместная русская издательская конвенция. Синтаксический параллелизм и повтор слова «истинны» сохранены.
