base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/067.yaml
  text: Bless the Lord[a], all you who fear the Lord, the God of gods; sing praise and give thanks, for his mercy is forever[b], even forever and ever.
translation:
  language: ru
  text: Все, кто чтит Господа[a], благословляйте Бога богов; воспевайте и благодарите Его, ибо милость Его — вовек[b] и во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклоняются Господу»; или: «благоговеют перед Господом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ибо неизменна навеки Его любовь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Сохраняет повелительную форму множественного числа и литургическое значение глагола; «прославляйте» было бы более общим.
- source_word: πάντες οἱ σεβόμενοι τὸν κύριον
  choice: все, кто чтит Господа
  rationale: σέβομαι обозначает благоговейное почитание и поклонение. «Чтит» передаёт это без подмены греческого глагола словом «боится», соответствующим иной исходной лексеме.
- source_word: τὸν θεὸν τῶν θεῶν
  choice: Бога богов
  rationale: Сохраняет традиционный библейский титул и прозрачную родительную конструкцию греческого текста.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Передаёт не просто хвалу, а хвалебное пение, заключённое в значении глагола.
- source_word: ἐξομολογεῖσθε
  choice: благодарите Его
  rationale: В гимническом контексте глагол означает благодарение или открытое прославление; сочетание с ὑμνεῖτε и последующим упоминанием милости поддерживает значение благодарения. Местоимение делает русскую фразу естественной, не меняя подразумеваемого адресата.
- source_word: ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ
  choice: ибо милость Его — вовек
  rationale: «Милость» непосредственно передаёт ἔλεος, а «вовек» сохраняет краткую литургическую формулу εἰς τὸν αἰῶνα.
- source_word: καὶ εἰς τὸν αἰῶνα τῶν αἰώνων
  choice: и во веки веков
  rationale: Устоявшаяся и понятная русская формула точно сохраняет усиление «в век веков».
theological_decisions:
- issue: Значение σεβόμενοι применительно к отношению к Господу
  choice: кто чтит Господа
  alternative: кто поклоняется Господу; кто благоговеет перед Господом; кто боится Господа
  rationale: Греческое σέβομαι выражает почитание, благоговение или поклонение, но не является глаголом «бояться». Основной текст сохраняет исходную лексику и не вводит традиционную формулу «боящиеся Господа», хотя близкие оттенки отмечены в сноске.
- issue: Передача ἔλεος
  choice: милость
  alternative: неизменная любовь
  rationale: Перевод исходит непосредственно из греческого ἔλεος. «Милость» — наиболее прозрачный русский эквивалент, тогда как «неизменная любовь» допустима как контекстуальное раскрытие смысла.
translation_notes:
  register: 'Современный литературный русский с dignified литургическим звучанием. Порядок первой части перестроен ради ясного русского синтаксиса: обращение вынесено вперёд, а «Бога богов» выступает прямым дополнением к «благословляйте». Формулы «вовек» и «во веки веков» сохранены как понятные библейско-гимнические выражения.'
