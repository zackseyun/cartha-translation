translation:
  language: ru
  text: Пусть земля благословляет Господа, воспевает и превозносит Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογείτω
  choice: да благословит
  rationale: Форма повелительного наклонения третьего лица передана литургическим призывом с частицей «да»; «благословит» сохраняет библейский смысл хвалы, обращённой к Богу.
- source_word: ἡ γῆ
  choice: земля
  rationale: В последовательности космического гимна речь идёт о земле как части творения, а не об отдельной стране или области.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычный и уместный в молитвенно-гимническом контексте русский эквивалент κύριος.
- source_word: ὑμνείτω
  choice: да воспевает
  rationale: «Воспевать» естественно передаёт музыкально-хвалебный оттенок ὑμνέω и не требует добавления отсутствующего в греческом существительного «гимны».
- source_word: ὑπερυψούτω
  choice: превозносит
  rationale: Русское «превозносить» передаёт усилительное значение сложного глагола — чрезвычайно возвышать и прославлять.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение относится к Господу; прописная буква соответствует принятому русскому благоговейному написанию.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое, краткое и литургически уместное соответствие формуле, обозначающей непрестанную хвалу во все времена.
theological_decisions:
- issue: Передача κύριος в греческом девтероканоническом гимне
  choice: Господь
  alternative: Владыка
  rationale: Контекст представляет установленное богослужебное именование Бога; «Господь» сохраняет традиционный титул без внесения дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным литургическим регистром. Параллелизм двух призывов сохранён; второе «да» не повторяется перед «превозносит», поскольку оба сказуемых относятся к одному побуждению и естественно соединяются союзом «и».
