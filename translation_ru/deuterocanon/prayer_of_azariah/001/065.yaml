- from: Благословляйте Господа, Анания, Азария и Мисаил; воспевайте и превозносите Его вовеки, потому что Он избавил нас из ада[a], спас нас от руки смерти, вызволил нас из самого пылающего пламени и искупил нас из огня.
  to: Благословляйте Господа, Анания, Азария и Мисаил; воспевайте и превозносите Его вовеки, потому что Он избавил нас из Аида[a], спас нас от руки смерти, вызволил нас из самой середины пылающего пламени и искупил нас из огня.
  rationale: Исправлены современное смысловое смещение термина «ад» и грамматическая ошибка в описании пламени. Перевод сохраняет повелительное обращение к трём юношам, гимнический параллелизм и различение глаголов избавления; спорная образность ᾅδης не истолковывается как учение о посмертном наказании.
