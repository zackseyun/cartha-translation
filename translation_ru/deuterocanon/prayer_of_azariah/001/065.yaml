base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/065.yaml
  text: Bless the Lord[a], Hananiah, Azariah, and Mishael; sing praise to him and highly exalt him forever. For he has delivered us from Hades, and saved us from the hand of death, and rescued us from the midst of the burning flame, and redeemed us from the fire.
translation:
  language: ru
  text: Благословляйте Господа, Анания, Азария и Мисаил; воспевайте и превозносите Его вовеки, потому что Он избавил нас из Аида[a], спас нас от руки смерти, вызволил нас из самой середины пылающего пламени и искупил нас из огня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из могилы». Греч. ᾅδης — Аид, область мёртвых.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Передаёт повелительное наклонение множественного числа и сохраняет литургический смысл обращённого к Богу благословения; «прославляйте» было бы возможно, но менее точно соответствует глаголу.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Естественная и традиционно прозрачная передача κύριος как божественного титула в иудейско-греческом богослужебном контексте.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Передаёт не только хвалу, но и песенный оттенок греческого глагола; звучит естественно в возвышенном русском гимническом тексте.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Глагол сохраняет усиленное значение составной греческой формы и хорошо подходит повторяющемуся гимническому призыву.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткая, понятная и стилистически уместная передача формулы неограниченной длительности.
- source_word: ἐξείλετο
  choice: избавил
  rationale: Передаёт совершившееся освобождение от опасности и позволяет отличить этот глагол от последующих глаголов спасения.
- source_word: ἐξ ᾅδου
  choice: из ада
  rationale: Прямо передаёт ᾅδης как область мёртвых и сохраняет богословскую образность исходного текста; возможное контекстуальное понимание «из могилы» вынесено в сноску.
- source_word: ἔσωσεν
  choice: спас
  rationale: Прямой русский эквивалент σώζω; в данном контексте обозначает конкретное спасение от смертельной опасности.
- source_word: ἐκ χειρὸς θανάτου
  choice: от руки смерти
  rationale: Сохраняет присутствующую в греческом тексте семитскую метафору и олицетворение власти смерти.
- source_word: ἐρρύσατο
  choice: вызволил
  rationale: Передаёт спасение из непосредственной опасности и лексически отличает этот глагол от предшествующих «избавил» и «спас».
- source_word: ἐκ μέσου καιομένης φλογός
  choice: из самого пылающего пламени
  rationale: «Из самого» естественно выражает ἐκ μέσου — спасение изнутри пламени, а «пылающего» передаёт причастие καιομένης без тяжеловесности.
- source_word: ἐλυτρώσατο
  choice: искупил
  rationale: Сохраняет выкупительно-освободительный оттенок λυτρόω, не сводя его лишь к ещё одному синониму физического спасения.
theological_decisions:
- issue: Передача ᾅδης в благодарении за избавление от смертельной опасности
  choice: из ада
  alternative: из могилы; из мира мёртвых
  rationale: Греческий текст прямо называет ᾅδης, а не только смерть или могилу. Основной текст сохраняет традиционный русский библейский термин и богословскую напряжённость образа; более контекстуальное понимание дано в сноске.
- issue: Передача λυτρόω применительно к физическому избавлению из огня
  choice: искупил
  alternative: освободил; избавил
  rationale: «Искупил» сохраняет собственный оттенок глагола и его возможный богословский резонанс, хотя непосредственный контекст говорит о конкретном избавлении.
translation_notes:
  register: Современный литературный русский с достоинством гимнической речи. Сохранены параллелизм, последовательность глаголов избавления и прямое обращение к трём юношам; архаизмы ограничены устойчивым богослужебным словом «вовеки».
