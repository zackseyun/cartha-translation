  text: Blessed are you on the throne of your kingdom[a], and greatly praised and highly exalted forever.
translation:
  language: ru
  text: Благословен Ты на престоле Твоего царства[a], в высшей степени прославлен и возвышен вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на престоле Твоей царской власти»; греческое слово βασιλεία может означать «царство», «царская власть» или «царствование».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος
  choice: Благословен
  rationale: Именная часть сказуемого в литургической формуле благословения; сохраняет славословный характер греческого выражения, не добавляя отсутствующего в тексте повелительного оттенка.
- source_word: ἐπὶ θρόνου
  choice: на престоле
  rationale: Прямо передаёт пространственное значение ἐπί с родительным падежом и сохраняет конкретный образ престола.
- source_word: τῆς βασιλείας σου
  choice: Твоего царства
  rationale: βασιλεία может означать царство, царскую власть или царствование. «Царство» естественно сочетается с образом престола, а неоднозначность отмечена в сноске.
- source_word: ὑπερυμνητός
  choice: превозносимый
  rationale: Передаёт усиленное значение хвалы в возвышенном, но понятном современном русском языке; причастная форма сохраняет параллелизм с последующим словом.
- source_word: ὑπερυψωμένος
  choice: превознесённый
  rationale: Передаёт высшую степень возвышения и сохраняет созвучный риторический параллелизм греческих сложных слов.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивый и понятный русский библейский эквивалент идиомы, обозначающей непреходящую длительность.
theological_decisions:
- issue: Славословное обращение и образ престола
  choice: 'Прямое обращение к Богу: «Благословен Ты на престоле Твоего царства»'
  alternative: «Благословен Ты, восседающий на престоле Твоего царства»
  rationale: Греческий текст прямо обращён к Богу, но не содержит причастия «восседающий»; перевод сохраняет образ и не расширяет синтаксис толкованием.
translation_notes:
  register: Современный литературный русский с возвышенным славословным звучанием. Формы «Ты» и «Твоего» написаны с прописной буквы как знак почтительного прямого обращения к Богу; «вовеки» сохраняет естественный для библейской поэзии регистр.
