  text: And now we cannot open our mouth[a]; shame and reproach have come upon your servants and those who revere you.
translation:
  language: ru
  text: И ныне мы не можем открыть уст; стыд и поношение постигли рабов Твоих и почитающих Тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοῖξαι τὸ στόμα
  choice: открыть уст
  rationale: Греческий оборот буквально сохраняет образ открывания рта и означает возможность или свободу говорить. По-русски «не можем открыть уст» естественно передаёт униженное молчание и сохраняет библейскую образность.
- source_word: αἰσχύνη
  choice: стыд
  rationale: Прямое и естественное соответствие, обозначающее переживаемый стыд и состояние позора.
- source_word: ὄνειδος
  choice: поношение
  rationale: Передаёт публичный укор, осмеяние или оскорбление и хорошо сохраняет отличие от αἰσχύνη.
- source_word: ἐγενήθη
  choice: постигли
  rationale: Хотя буквально форма означает «стали/возникли», в данном сочетании русское «постигли» естественно выражает наступившее бедственное состояние.
- source_word: τῶν δούλων σου
  choice: рабов Твоих
  rationale: В обращённой к Богу молитве традиционное русское «рабы Твои» сохраняет значения принадлежности, зависимости и подчинения, не вызывая преимущественно социально-исторических ассоциаций современного слова «невольники».
- source_word: τῶν σεβομένων σε
  choice: почитающих Тебя
  rationale: Причастие обозначает благоговейное уважение и религиозную преданность; «почитающих» не сужает смысл ни до чувства страха, ни только до культового поклонения.
theological_decisions:
- issue: Передача δοῦλος в обращении к Богу
  choice: рабов Твоих
  alternative: слуг Твоих
  rationale: «Рабов Твоих» точнее сохраняет выраженные в δοῦλος принадлежность и подчинённость Богу, тогда как «слуг» может подразумевать более свободные служебные отношения. В русском библейском регистре «раб Божий» остаётся понятным и не является утверждением о человеческом рабовладении.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным регистром. Сохранены традиционно понятные формы «и ныне», «открыть уст», «рабы Твои», но синтаксис остаётся ясным для современного читателя. Прописные местоимения обращения к Богу поддерживают принятый русский религиозный регистр.
