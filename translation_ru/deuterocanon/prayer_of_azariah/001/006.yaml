lexical_decisions:
- source_word: ἡμάρτομεν
  choice: мы согрешили
  rationale: Аорист от ἁμαρτάνω передан естественной для исповедания формой прошедшего времени; она обозначает совершённый грех без внесения дополнительных временных оттенков.
- source_word: ἐν πᾶσι
  choice: во всём
  rationale: Кратко и естественно сохраняет всеобъемлющий характер греческого выражения, не уточняя искусственно, идёт ли речь обо всех делах или обо всех отношениях.
- source_word: ἠνομήσαμεν
  choice: поступили беззаконно
  rationale: Передаёт связь ἀνομέω с нарушением закона и не сводит смысл к общему «поступили дурно».
- source_word: ἀποστῆναι ἀπὸ σοῦ
  choice: отступив от Тебя
  rationale: Деепричастный оборот естественно выражает содержание или способ беззаконного поступка и сохраняет как relational, так и вероотступнический оттенок глагола.
- source_word: ἐξημάρτομεν
  choice: тяжко согрешили
  rationale: Усиленное выражение отличает этот глагол от предшествующего ἡμάρτομεν и передаёт возрастание силы исповедания.
theological_decisions:
- issue: Сохранять ли различие между ἡμάρτομεν и усиленным ἐξημάρτομεν
  choice: Первый глагол передан как «согрешили», второй — как «тяжко согрешили».
  alternative: 'Оба глагола передать одинаково: «согрешили».'
  rationale: Разные греческие глагольные формы создают намеренное усиление; его сохранение точнее передаёт риторику покаянного исповедания, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного исповедания. Местоимение «Тебя» написано с прописной буквы как традиционная уважительная форма обращения к Богу; синтаксис оставлен ясным и не архаизирован.
