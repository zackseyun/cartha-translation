translation:
  language: ru
  text: ибо мы во всём согрешили, и поступили беззаконно, отступив от Тебя, и во всём тяжко согрешили[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы во всём тяжко согрешили». В последней части стиха греческий глагол сильнее, чем первое «согрешили».'
