base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/041.yaml
  text: Bless the Lord[a], all rain and dew; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, все дожди и росы[a]; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякий дождь и всякая роса». Греческое выражение допускает как собирательное, так и распределительное понимание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Повелительное наклонение множественного числа; «благословляйте» сохраняет повторяющуюся литургическую формулу и образ творения, благословляющего Господа.
- source_word: πᾶς ὄμβρος καὶ δρόσος
  choice: все дожди и росы
  rationale: Русское множественное число естественно передаёт собирательный охват всех дождей и рос; возможность дистрибутивного понимания отмечена в сноске.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Прямое и традиционное соответствие греческому κύριος в обращённом к Богу литургическом контексте.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол передаёт не просто хвалу, а хвалебное пение; «воспевайте» естественно звучит в возвышенном поэтическом контексте.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русский глагол сохраняет усилительное значение греческого сложного глагола и соответствует торжественному регистру рефрена.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткое и естественное для библейской поэзии выражение неограниченной длительности.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Греческий текст содержит κύριος, а не еврейское написание Божьего имени; «Господь» передаёт текст прямо, не добавляя отсутствующего в нём различения.
translation_notes:
  register: Современный литературный русский язык с торжественным литургико-поэтическим звучанием. Параллельные повелительные формы и краткое «вовеки» сохраняют ритм рефрена.
