  text: Bless the Lord[a], sea creatures and all that move in the waters; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, великие морские существа[a] и всё, что движется в водах; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крупные морские животные», «киты» или «морские чудовища». Греческое κήτη — широкое обозначение крупных обитателей вод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Повелительное наклонение множественного числа; «благословляйте» сохраняет литургический повтор и не сводит значение к более общему «прославляйте».
- source_word: κήτη
  choice: морские исполины
  rationale: Греческое слово обозначает крупных морских животных, а иногда морских чудовищ. «Морские исполины» передаёт крупный размер, не сужая значение до китов и не усиливая мифологическую окраску.
- source_word: πάντα τὰ κινούμενα
  choice: всё движущееся
  rationale: Субстантивированное причастие среднего рода с πάντα имеет всеохватный смысл; буквальная и естественная русская формулировка сохраняет широту выражения.
- source_word: ἐν τοῖς ὕδασι
  choice: в водах
  rationale: Сохраняется множественное число греческого текста и библейский образ водной стихии.
- source_word: τὸν κύριον
  choice: Господа
  rationale: κύριος в данном иудейском гимническом контексте является обычным греческим божественным титулом и естественно передаётся как «Господь».
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол указывает на хвалу в песнопении; «воспевайте» кратко и естественно передаёт музыкально-гимнический оттенок.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Глагол содержит усиленное значение возвышения; «превозносите» передаёт интенсивность и соответствует торжественному регистру рефрена.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое русское библейское выражение естественно передаёт идею непрестанной, вечной хвалы.
theological_decisions:
- issue: Передача κύριος в девтероканоническом греческом гимне
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Непосредственный источник содержит κύριος, а не еврейский тетраграмматон; поэтому используется титул «Господь» без типографического обозначения имени YHWH.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным гимническим звучанием. Синтаксический параллелизм и повелительные формы исходного рефрена сохранены; архаизирующее «вовеки» уместно как живое литургико-библейское слово.
