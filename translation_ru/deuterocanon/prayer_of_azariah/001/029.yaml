base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/029.yaml
  text: Blessed are you[a], Lord, the God of our fathers, and praised and highly exalted forever; and blessed is your holy, glorious name, and supremely praised and highly exalted through all the ages.
translation:
  language: ru
  text: Благословен Ты, Господи, Боже отцов наших, достоин хвалы и превознесён вовеки; и благословенно святое имя славы Твоей[a], достойно высшей хвалы и превознесено во все века.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу: «Твоё святое, славное имя». Греческое выражение буквально построено как «святое имя славы Твоей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς εἶ
  choice: Благословен Ты
  rationale: Сохраняет прямое обращение и именную форму греческого славословия, не превращая её в пожелание «да будет благословен».
- source_word: Κύριε ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Господи, Бог отцов наших
  rationale: «Господи» естественно передаёт звательный падеж Κύριε, а «Бог отцов наших» сохраняет традиционное семейно-заветное выражение и мужской род πατέρων.
- source_word: αἰνετὸς
  choice: достоин хвалы
  rationale: Передаёт значение «достойный хвалы» естественным современным русским языком и не смешивает его с последующим усиленным выражением.
- source_word: ὑπερυψούμενος
  choice: превознесён
  rationale: Передаёт усилительное значение сложного греческого слова и допускает последовательное употребление в обеих частях стиха.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткая и устойчивая русская формула для неограниченной длительности, уместная в славословии.
- source_word: τὸ ὄνομα τῆς δόξης σου τὸ ἅγιον
  choice: святое имя славы Твоей
  rationale: Сохраняет генитивную конструкцию и порядок смысловых компонентов греческого текста, не устраняя его сжатость.
- source_word: ὑπεραινετὸν
  choice: достойно высшей хвалы
  rationale: Передаёт усилительную приставку ὑπερ- современно и понятно, отличая слово от простого αἰνετός.
- source_word: εἰς ἅπαντας τοὺς αἰῶνας
  choice: во все века
  rationale: Явно отражает ἅπαντας («все») и сохраняет отличие от более краткого первого выражения.
theological_decisions:
- issue: Формула благословения как констатация или пожелание
  choice: Благословен Ты
  alternative: Да будет благословен Ты
  rationale: В греческом стоит именная конструкция с εἶ («Ты есть»), поэтому перевод сохраняет прямое славословное утверждение, а не вводит отсутствующее в тексте пожелание.
- issue: Передача πατέρων
  choice: отцов
  alternative: предков
  rationale: Греческое слово имеет мужской род и входит в устойчивое библейское выражение; контекст не требует обобщающей замены.
- issue: Сжатая конструкция «имя славы Твоей, святое»
  choice: святое имя славы Твоей
  alternative: Твоё святое, славное имя
  rationale: Основной текст сохраняет необычную генитивную связь исходника, а сноска указывает естественное смысловое прочтение, не объявляя его единственно возможным.
translation_notes:
  register: Современный литературный русский с достоинством библейского славословия. Формы «Господи», «вовеки» и «во все века» сохраняют возвышенный регистр, оставаясь понятными; синтаксис следует параллелизму греческого текста.
