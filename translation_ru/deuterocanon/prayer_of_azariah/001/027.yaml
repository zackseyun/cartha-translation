base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/027.yaml
  text: And he made the inside of the furnace like a whistling dew-laden wind[a], and the fire did not touch them at all, nor did it distress or trouble them.
translation:
  language: ru
  text: И сделал он так, что внутри печи было словно от свистящего ветра, несущего росу[a]; огонь же совсем не коснулся их, не причинил им боли и не потревожил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно от росного ветра»; возможно также: «словно от духа росы». Греческое πνεῦμα может означать «ветер», «дуновение» или «дух».'
    reason: Сохранение лексической неоднозначности πνεῦμα и необычного образа πνεῦμα δρόσου.
lexical_decisions:
- source_word: ἐποίησε
  choice: сделал он так, что
  rationale: Такая конструкция естественно передаёт греческое «сделал» при последующем образном описании состояния внутри печи, не уточняя способ чуда.
- source_word: τὸ μέσον τῆς καμίνου
  choice: посреди печи
  rationale: Передаёт внутреннее пространство печи современным и ясным русским выражением.
- source_word: ὡς πνεῦμα δρόσου
  choice: словно ветер, несущий росу
  rationale: В данном физическом контексте πνεῦμα вероятнее всего означает ветер или дуновение, а δρόσου указывает на росу и связанную с ней прохладу. Слово «росу» сохранено явно, без сведения образа просто к прохладе.
- source_word: διασυρίζον
  choice: свистящий
  rationale: Сохраняет звуковой и динамический образ проходящего сквозь печь воздушного потока.
- source_word: οὐχ ἥψατο αὐτῶν τὸ καθόλου τὸ πῦρ
  choice: огонь же совсем не коснулся их
  rationale: «Коснулся» прямо передаёт ἥψατο, а «совсем не» сохраняет усиленную форму отрицания τὸ καθόλου.
- source_word: ἐλύπησεν
  choice: не причинил им боли
  rationale: В контексте огненной печи глагол обозначает причинение страдания или боли; перевод сохраняет физический смысл, не исключая более широкого страдания.
- source_word: παρηνώχλησεν
  choice: не потревожил их
  rationale: Передаёт значение причинения беспокойства или тяготы и сохраняет второе, отдельное отрицание вреда.
theological_decisions:
- issue: К кому относится подразумеваемое подлежащее при ἐποίησε
  choice: Сохранено местоименное «он» без прямого называния действующего лица.
  alternative: 'Уточнить: «Бог сделал» или «ангел сделал».'
  rationale: В греческом тексте субъект здесь прямо не назван. Сохранение «он» следует ходу повествования и не разрешает сверх текста вопрос о непосредственном деятеле.
- issue: Значение πνεῦμα в описании чуда
  choice: «ветер»
  alternative: «дух» или «дуновение»
  rationale: Образ прохлады внутри печи прежде всего предполагает движение воздуха, однако многозначность греческого слова отмечена в сноске и не скрыта.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. Греческая конструкция слегка перестроена ради естественного русского синтаксиса; образ ветра, росы и его свиста сохранён.
