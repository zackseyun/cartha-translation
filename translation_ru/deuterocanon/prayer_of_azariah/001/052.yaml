  text: Bless the Lord, mountains and hills; sing praise and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, горы и холмы; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Форма повелительного наклонения во множественном числе буквально призывает творение благословлять Господа; этот выбор сохраняет литургическую формулу и не сводит её к общему «хвалите».
- source_word: ὄρη καὶ βουνοί
  choice: горы и холмы
  rationale: Естественная русская передача двух видов возвышенностей, сохраняющая поэтическую парность исходного текста.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Прямая передача греческого κύριος в богослужебном обращении; винительный падеж обусловлен управлением глагола.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу, выражаемую в песнопении; «воспевайте» естественно передаёт одновременно музыкальный и хвалебный оттенки.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русский глагол передаёт усиленное значение сложного греческого глагола — чрезвычайно возвышать, не создавая тяжеловесной конструкции.
- source_word: αὐτὸν
  choice: Его
  rationale: Личное местоимение относится к Господу; прописная буква соответствует принятому русскому библейскому регистру.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткая и естественная для гимнического контекста передача устойчивой формулы вечной продолжительности.
theological_decisions:
- issue: Передача κύριος в славословном обращении
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Источник содержит греческое κύριος, поэтому перевод не вводит типографическое обозначение еврейского тетраграмматона, отсутствующее в данном греческом тексте.
translation_notes:
  register: Современный литературный русский с возвышенным гимническим звучанием. Формы «благословляйте», «воспевайте», «превозносите» сохраняют трёхчастный призыв и ритм исходной строки; «вовеки» поддерживает повторяющийся литургический рефрен.
