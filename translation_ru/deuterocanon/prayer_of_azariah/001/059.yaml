base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/059.yaml
  text: Bless the Lord[a], sons of men; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, сыны человеческие[a]; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны людей»; по смыслу также возможно: «дети человеческие» или «люди».'
    reason: 'Лексическая альтернатива: греческое выражение οἱ υἱοὶ τῶν ἀνθρώπων формально мужского рода, но может обозначать людей вообще.'
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Повелительная форма множественного числа; «благословляйте» сохраняет прямой литургический и славословный смысл глагола εὐλογέω.
- source_word: οἱ υἱοὶ τῶν ἀνθρώπων
  choice: сыны человеческие
  rationale: Передаёт явно мужскую форму греческого выражения и его библейский собирательный смысл — всё человечество, — не сводя образ к нейтральному пересказу.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычный и естественный русский эквивалент κύριος в данном греческом богослужебном контексте.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол означает хвалить в песнопении; «воспевайте» естественно передаёт одновременно музыкальный и славословный оттенки.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Приставочная форма усиливает значение возвышения; «превозносите» сохраняет эту интенсивность и уместна в торжественной речи.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивый русский богослужебно-библейский эквивалент формулы со значением непрестанной, вечной хвалы.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Греческий текст содержит κύριος, а не еврейское имя Божье; форма «Господь» сохраняет исходное обозначение без обратной реконструкции тетраграмматона.
- issue: Гендерно маркированное обозначение человечества
  choice: сыны человеческие
  alternative: люди
  rationale: Исходное выражение буквально мужского рода, но имеет собирательный антропологический смысл. Основной текст сохраняет его форму и библейскую образность, а примечание поясняет возможное значение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, песнопенным звучанием. Формы «благословляйте», «воспевайте», «превозносите» воспроизводят параллелизм трёх греческих императивов; «вовеки» поддерживает ритм и традиционный библейский регистр.
