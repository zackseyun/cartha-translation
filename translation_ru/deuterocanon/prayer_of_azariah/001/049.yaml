  text: Bless the Lord[a], light and darkness; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Свет и тьма, благословляйте Господа; воспевайте и превозносите его вечно[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во веки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Форма повелительного наклонения во множественном числе обращена к свету и тьме; «благословляйте» сохраняет литургический и славословный оттенок повторяющегося призыва.
- source_word: φῶς καὶ σκότος
  choice: свет и тьма
  rationale: Прямая и естественная передача пары космических противоположностей; формы единственного числа сохранены.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Винительный объект при повелительном глаголе; традиционное и ясное соответствие κύριος в данном славословии.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Передаёт не только хвалу, но и песенно-гимнический характер греческого глагола.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русский глагол естественно передаёт усиленное возвеличивание, выраженное приставочным греческим глаголом.
- source_word: εἰς τοὺς αἰῶνας
  choice: вечно
  rationale: Ясный современный эквивалент устойчивой доксологической формулы; буквальный образ множественных «веков» отмечен в сноске.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет устойчивое библейское наименование и не вносит дополнительного смыслового оттенка власти, который мог бы усилить вариант «Владыка».
- issue: Доксологическая формула εἰς τοὺς αἰῶνας
  choice: вечно
  alternative: во веки
  rationale: Основной текст передаёт идею непрекращающейся хвалы естественным современным русским языком, а более буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением торжественного гимнического строя. Обращение «свет и тьма» оставлено после сказуемого, как в греческом тексте. Местоимение «его» дано со строчной буквы согласно нейтральной современной издательской норме.
