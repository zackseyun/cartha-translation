  text: And the flame spread above the furnace to forty-nine cubits,[a]
translation:
  language: ru
  text: И пламя простиралось над печью на сорок девять локтей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Локоть — древняя мера длины, приблизительно равная расстоянию от локтя до кончиков пальцев.
    reason: cultural_note
lexical_decisions:
- source_word: διείχετο
  choice: простиралось
  rationale: Форма имперфекта описывает продолжающееся распространение или протяжённость пламени; «простиралось» естественно передаёт эту картину, не сводя её только к движению вверх.
- source_word: ἡ φλὸξ
  choice: пламя
  rationale: Прямое соответствие существительному единственного числа; сохраняет яркий образ исходного текста.
- source_word: ἐπάνω τῆς καμίνου
  choice: над печью
  rationale: Предлог ἐπάνω с родительным падежом обозначает положение выше чего-либо; «над печью» — ясное и естественное русское выражение.
- source_word: ἐπὶ πήχεις τεσσαράκοντα ἐννέα
  choice: на сорок девять локтей
  rationale: Оборот указывает на меру протяжённости или высоты пламени. Сохранена древняя единица длины без приблизительного пересчёта.
