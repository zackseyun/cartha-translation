  text: Bless the Lord, lightnings and clouds; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, молнии и облака; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Прямо передаёт повелительное наклонение и сохраняет литургический повтор песни.
- source_word: ἀστραπαὶ
  choice: молнии
  rationale: Форма множественного числа соответствует греческому множественному числу и обращению к явлениям природы.
- source_word: νεφέλαι
  choice: облака
  rationale: Обычное современное обозначение облаков, соответствующее греческому множественному числу.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Передаёт не просто пение, а хвалебное прославление; естественно звучит в поэтическом и богослужебном контексте.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Сохраняет усиленное значение возвеличивания и подходит к возвышенному регистру песни.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устоявшаяся и краткая русская формула для непрестанного, вечного прославления.
theological_decisions:
- issue: Референт местоимения αὐτόν
  choice: Его
  alternative: его
  rationale: Местоимение относится к Господу; прописная буква соответствует русской библейской издательской традиции, не меняя смысла исходного текста.
translation_notes:
