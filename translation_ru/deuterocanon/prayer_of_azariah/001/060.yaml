  text: Bless the Lord[a], Israel; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа[a], Израиль; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Хвалите Господа, Израиль». В этом гимническом контексте греческое εὐλογεῖτε может означать и «хвалите».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляй
  rationale: Императив во множественном числе согласуется с собирательным обращением «Израиль». «Благословляй» сохраняет библейский литургический оборот, направленный к Богу, не сводя его просто к «хвали».
- source_word: Ἰσραήλ
  choice: Израиль
  rationale: Форма передаёт прямое обращение к народу; в современном русском частица «о» не обязательна и здесь звучала бы более архаично.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычный и естественный русский эквивалент κύριος в обращённом к Богу гимне; форма винительного падежа обусловлена глаголом.
- source_word: ὑμνεῖτε
  choice: воспевай
  rationale: «Воспевай» передаёт не только хвалу, но и песенно-гимнический оттенок греческого ὑμνέω.
- source_word: ὑπερυψοῦτε
  choice: превозноси
  rationale: Глагол сохраняет усиленное значение сложного ὑπερυψόω и естественно звучит в русском богослужебно-поэтическом контексте.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткий и устоявшийся русский эквивалент формулы вечной хвалы, соответствующий гимническому регистру.
theological_decisions:
- issue: Передача κύριος в гимне, обращённом к Богу
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Греческий текст содержит κύριος, а не непосредственно тетраграмматон; поэтому написание обычным регистром точнее следует данной форме источника и не вносит дополнительного толкования.
translation_notes:
  register: Современный литературный русский с возвышенным гимническим звучанием. Единственное число повелительных форм («благословляй», «воспевай», «превозноси») естественно согласовано с собирательным обращением «Израиль»; местоимение «Его» написано с прописной буквы как уважительная издательская конвенция.
