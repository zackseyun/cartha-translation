base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/026.yaml
  text: But the angel of the Lord went down into the furnace together with those around Azariah[a], and drove the flame of the fire out of the furnace,
translation:
  language: ru
  text: Но ангел Господа сошёл в печь вместе с теми, кто был рядом с Азарией[a], и выбросил пламя огня из печи,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со спутниками Азарии». Буквально: «с теми, кто был вокруг Азарии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Но
  rationale: δέ продолжает повествование с лёгким оттенком противопоставления предшествующей опасности; «Но» передаёт этот переход, не усиливая его чрезмерно.
- source_word: ἄγγελος Κυρίου
  choice: ангел Господа
  rationale: Определённый артикль при ἄγγελος и родительный Κυρίου естественно передаются устойчивым выражением «ангел Господа».
- source_word: συνκατέβη
  choice: сошёл
  rationale: Глагол обозначает движение вниз вместе с другими; значение совместности далее явно передано словами «вместе с».
- source_word: ἅμα τοῖς περὶ τὸν Ἀζαρίαν
  choice: вместе с теми, кто был рядом с Азарией
  rationale: Формулировка сохраняет буквальный образ людей «вокруг Азарии», оставаясь понятной на современном русском; более толковательное «спутниками Азарии» вынесено в сноску.
- source_word: κάμινον
  choice: печь
  rationale: В контексте Даниила речь идёт об огненной печи; «печь» — естественное и традиционное русское соответствие.
- source_word: ἐξετίναξεν
  choice: выбросил
  rationale: Глагол выражает резкое, силовое удаление — буквально вытряхивание или выбрасывание; «выбросил» сохраняет эту динамику.
- source_word: τὴν φλόγα τοῦ πυρός
  choice: пламя огня
  rationale: Достаточно буквальная передача родительной конструкции сохраняет выразительность греческого текста и не сглаживает его до простого «огонь».
- source_word: ἐκ τῆς καμίνου
  choice: из печи
  rationale: ἐκ указывает на движение изнутри наружу; русское «из печи» точно передаёт пространственный образ.
theological_decisions:
- issue: Передача Κυρίου
  choice: Господа
  alternative: Владыки; ГОСПОДА
  rationale: «Господа» естественно передаёт греческое κύριος в данном греческом повествовании, не вводя типографического различения, основанного на реконструкции еврейского Божьего имени.
- issue: Кем является «ангел Господа»
  choice: Сохранить обозначение без уточнения природы ангела
  alternative: Истолковать его как богоявление или как обычного сотворённого ангела
  rationale: Сам стих называет действующее лицо только «ангелом Господа»; перевод не разрешает богословскую неоднозначность за пределами сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Сохранены движение вниз, совместность действия и силовой характер удаления пламени; синтаксис оставлен открытым запятой в соответствии с продолжением предложения в источнике.
