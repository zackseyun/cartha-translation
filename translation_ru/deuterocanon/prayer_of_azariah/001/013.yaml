lexical_decisions:
- source_word: ἐλάλησας πρὸς αὐτοὺς
  choice: Ты говорил им
  rationale: Передаёт обращённую к предкам речь Бога; «говорил» сохраняет торжественный тон и естественно звучит по-русски.
- source_word: λέγων πολυπληθῦναι
  choice: что сделаешь ... столь же многочисленным
  rationale: Причастие вводит содержание обещания, а инфинитив выражает умножение потомства; конструкция передана естественной русской косвенной речью.
- source_word: τὸ σπέρμα αὐτῶν
  choice: их потомство
  rationale: «Потомство» ясно передаёт коллективное значение σπέρμα в современном русском; буквальное «семя» и его связь с обещанием предкам отмечены в сноске.
- source_word: ὡς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: столь же многочисленным, как звёзды небесные
  rationale: Передаёт сравнение по численности, выраженное дательным τῷ πλήθει, сохраняя библейское «звёзды небесные».
- source_word: ὡς τὴν ἄμμον τὴν παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: как песок у берега моря
  rationale: χείλος буквально означает «край» или «кромка»; в данном обороте речь о морском береге, что и передано естественно по-русски.
theological_decisions:
