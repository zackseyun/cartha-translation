translation:
  language: ru
  text: Благословляйте Господа, росы и снегопады; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Прямо передаёт повелительную форму и сохраняет литургический параллелизм стиха.
- source_word: δρόσοι
  choice: росы
  rationale: Точное и естественное соответствие греческому множественному числу δρόσοι.
- source_word: νιφετοί
  choice: снегопады
  rationale: νιφετός обозначает падающий снег, снегопад; это точнее греческого текста, чем «ливни» или общее «осадки».
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Передаёт призыв прославлять песнопением и соответствует возвышенному поэтическому регистру.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Выражает усиленное «возвышайте чрезвычайно», не перегружая русскую строку наречием.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устоявшееся краткое литургическое соответствие формуле длительности «на века».
