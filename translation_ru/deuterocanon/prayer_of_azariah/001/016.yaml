  text: но да будем мы приняты с сокрушённой душой и смирённым духом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с разбитой душой и уничижённым духом».'
    reason: Лексическая альтернатива, более буквально отражающая образы συντετριμμένῃ и τεταπεινωμένῳ.
lexical_decisions:
- source_word: ἀλλʼ
  choice: но
  rationale: Передаёт противопоставление предыдущему контексту, где говорится об отсутствии жертвенных приношений.
- source_word: ἐν
  choice: с
  rationale: В данном обороте обозначает состояние или внутреннее расположение, с которым молящиеся просят принять их; по-русски естественно передаётся предлогом «с».
- source_word: ψυχῇ
  choice: душой
  rationale: Сохраняет антропологическую и молитвенную значимость ψυχή и не смешивает его с параллельным πνεῦμα.
- source_word: συντετριμμένῃ
  choice: сокрушённой
  rationale: Передаёт состояние сломленности и раскаяния; «сокрушённая душа» естественно и достойно звучит в русском библейском регистре.
- source_word: πνεύματι
  choice: духом
  rationale: Сохраняет отдельное обозначение внутреннего духа в параллели с «душой».
- source_word: τεταπεινωμένῳ
  choice: смирённым
  rationale: Передаёт состояние уничижения и смирения перед Богом без нежелательного оттенка насильственного унижения.
- source_word: προσδεχθείημεν
  choice: да будем мы приняты
  rationale: Пассивный оптатив выражает молитвенное пожелание о благосклонном принятии; конструкция с «да» сохраняет пожелательный оттенок и возвышенный регистр.
theological_decisions:
- issue: Соотношение ψυχή и πνεῦμα
  choice: Передать раздельно как «душа» и «дух»
  alternative: Обобщить оба понятия как внутреннее состояние человека
  rationale: Греческий текст использует два разных слова в поэтическом параллелизме; их разграничение сохраняет литературное и богословское напряжение текста.
- issue: Образ συντετριμμένῃ
  choice: «сокрушённой»
  alternative: «разбитой» или «раскаявшейся»
  rationale: «Сокрушённой» сохраняет исходный образ сломленности, оставаясь естественным для молитвенного русского языка; «раскаявшейся» уже истолковывает образ, а «разбитой» звучит менее уместно в данном регистре.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным звучанием. Конструкция «да будем мы приняты» передаёт греческий оптатив; местоимение «мы» выражено для ясности и естественного ритма.
