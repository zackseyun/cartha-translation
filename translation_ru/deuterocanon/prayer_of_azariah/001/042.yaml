base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/042.yaml
  text: Bless the Lord[a], all spirits; sing praise and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, все духи[a]; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все ветры», если πνεύματα означает движущиеся потоки воздуха, а не духовных существ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Форма повелительного наклонения во множественном числе; «благословляйте» сохраняет литургический смысл и повторяющуюся структуру песни.
- source_word: πάντα τὰ πνεύματα
  choice: все духи
  rationale: Обращение к совокупности духов; это наиболее прямое соответствие греческому выражению, при сохранении в сноске возможного значения «ветры».
- source_word: τὸν κύριον
  choice: Господа
  rationale: В иудейско-греческом гимническом контексте κύριος служит почтительным наименованием Бога; традиционное и естественное русское соответствие — «Господь».
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу в песнопении; «воспевайте» передаёт музыкально-гимнический оттенок естественным литературным русским языком.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русский глагол «превозносить» выражает усиленное возвеличивание, заложенное в греческом сложном глаголе.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое, понятное и возвышенное русское выражение для неограниченной длительности, уместное в рефрене гимна.
theological_decisions:
- issue: Передача κύριος в славословии, обращённом к Богу
  choice: Господь
  alternative: Владыка
  rationale: «Господь» соответствует обычному употреблению κύριος как божественного титула в Септуагинте и не вводит более узкое толкование.
- issue: Кого обозначает πάντα τὰ πνεύματα
  choice: все духи
  alternative: все ветры
  rationale: Основной текст сохраняет прямое личностное прочтение «духи», однако многозначность πνεῦμα не позволяет исключить природное значение «ветры», поэтому оно отмечено в сноске без догматического разрешения.
translation_notes:
  register: Современный литературный русский с возвышенным гимническим звучанием. Формы «воспевайте», «превозносите» и «вовеки» понятны современному читателю и поддерживают поэтический рефрен без излишней архаизации.
