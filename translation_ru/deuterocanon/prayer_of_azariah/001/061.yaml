  text: Bless the Lord[a], priests[b]; sing hymns and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте[a] Господа, священники; воспевайте[b] и превозносите Его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Прославляйте Господа». Глагол допускает более общее значение «прославлять», однако «благословляйте» сохраняет повторяющуюся литургическую формулу греческого текста.'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол подразумевает хвалу, выраженную в гимне или песнопении; поэтому здесь — «воспевайте».
    reason: lexical_clarification
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Форма повелительного наклонения множественного числа. «Благословляйте» сохраняет повторяющуюся литургическую формулу греческого текста; «прославляйте» возможно по смыслу, но менее точно передаёт выбранный в рефрене глагол.
- source_word: ἱερεῖς
  choice: священники
  rationale: Звательная по функции форма множественного числа, прямо обращённая к священникам. В русском языке обращение естественно передаётся именительным падежом.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Прямое соответствие греческому κύριος в винительном падеже; прописная буква ясно указывает на Бога, не вводя типографического различения, отсутствующего в греческом источнике.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол означает прославлять в песнопении. «Воспевайте» кратко и естественно сохраняет музыкально-гимнический оттенок.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Приставочный глагол выражает усиленное возвеличивание. «Превозносите» передаёт эту интенсивность естественным для русского библейско-литургического регистра словом.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивый и понятный русский эквивалент доксологической формулы, выражающей непрекращающуюся длительность.
theological_decisions:
- issue: Передача κύριος в славословном обращении
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Источник содержит греческое κύριος, а не само четырёхбуквенное еврейское имя. Поэтому обычное написание «Господь» точнее отражает непосредственно засвидетельствованный текст и не привносит отсутствующее в нём типографическое толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно литургическим звучанием. Синтаксический параллелизм и краткость рефрена сохранены; архаическое «во веки веков» не добавлено, поскольку греческий текст имеет εἰς τοὺς αἰῶνας без удвоенной формулы.
