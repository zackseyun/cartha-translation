  text: And we have not obeyed the commands of your law, nor kept them, nor done as you commanded us, so that it might go well with us.
translation:
  language: ru
  text: И мы не послушались повелений Твоего закона, не соблюдали их и не поступали так, как Ты повелел нам, чтобы нам было хорошо.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολῶν τοῦ νόμου σου
  choice: повелений Твоего закона
  rationale: «Повеления» естественно передаёт ἐντολαί и сохраняет связь с законом; притяжательное «Твоего» относится к Богу, к Которому обращена молитва.
- source_word: ὑπηκούσαμεν
  choice: послушались
  rationale: Передаёт значение повиновения услышанному приказанию; отрицательная форма согласована с οὐχ.
- source_word: συνετηρήσαμεν
  choice: соблюдали
  rationale: В контексте заповедей глагол означает тщательно хранить и исполнять; «соблюдали» звучит естественно и не дублирует буквально последующий глагол действия.
- source_word: ἐποιήσαμεν
  choice: поступали
  rationale: В сочетании с καθὼς ἐνετείλω передаёт не просто отдельное действие, а исполнение повеления на деле.
- source_word: ἵνα εὖ ἡμῖν γένηται
  choice: чтобы нам было хорошо
  rationale: Сохраняет целевую конструкцию ἵνα и намеренно не уточняет, идёт ли речь о благополучии, успехе или общем благе.
theological_decisions:
- issue: Связь послушания с благом
  choice: 'сохранена цель: «чтобы нам было хорошо»'
  alternative: «и потому нам не было хорошо»
  rationale: Греческий текст выражает цель через ἵνα, а не прямо формулирует причинно-следственный итог; перевод не должен разрешать эту синтаксическую и богословскую связь иначе.
translation_notes:
  register: Современный литературный русский язык с молитвенно-исповедальным, но доступным регистром. Местоимения, обращённые к Богу, даны с прописной буквы по принятой русской библейской традиции. Трёхчастный параллелизм исходного текста сохранён.
