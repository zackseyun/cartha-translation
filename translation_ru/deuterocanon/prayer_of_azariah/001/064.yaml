  text: Bless the Lord[a], you holy and humble in heart; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, благочестивые и смиренные сердцем; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Повелительное наклонение множественного числа в литургическом призыве; «благословляйте» сохраняет прямой смысл прославления Бога словом и соответствует возвышенному регистру.
- source_word: ὅσιοι
  choice: благочестивые
  rationale: ὅσιος здесь обозначает людей, преданных Богу и живущих благочестиво. «Благочестивые» естественно передаёт этот смысл, не смешивая его с иными оттенками слова «святые».
- source_word: ταπεινοὶ τῇ καρδίᾳ
  choice: смиренные сердцем
  rationale: Фраза указывает на внутреннее расположение; «смиренные сердцем» кратко, естественно и точно передаёт греческую конструкцию.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычный и контекстуально уместный эквивалент κύριος в обращённом к Богу литургическом тексте.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол означает хвалить песнопением; «воспевайте» сохраняет музыкально-литургический оттенок и звучит естественно в поэтическом призыве.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Глагол выражает усиленное возвеличивание. «Превозносите» передаёт интенсивность без громоздкой добавочной конструкции.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивый русский литургико-поэтический эквивалент идиомы, обозначающей непрестанное, вечное прославление.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» является естественным обозначением Бога в данном богослужебном контексте и не вносит дополнительного толкования.
- issue: Передача ὅσιοι
  choice: благочестивые
  alternative: святые
  rationale: Выбрано «благочестивые», поскольку ὅσιοι подчёркивает преданность Богу и благочестие; вариант «святые» возможен, но может восприниматься как более специальное обозначение статуса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, песенно-литургическим звучанием. Синтаксический параллелизм и трёхчастный призыв оригинала сохранены; архаизирующая форма «вовеки» уместна в рефрене и остаётся понятной современному читателю.
