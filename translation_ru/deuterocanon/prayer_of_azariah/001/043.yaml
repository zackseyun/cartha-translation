  yaml_path: translation/deuterocanon/prayer_of_azariah/001/043.yaml
  text: Bless the Lord[a], fire and heat; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, огонь и зной; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Повелительное наклонение множественного числа; «благословляйте» сохраняет буквальный и повторяющийся литургический призыв песни.
- source_word: πῦρ
  choice: огонь
  rationale: Прямое обозначение огня как части творения, призываемой благословлять Господа.
- source_word: καῦμα
  choice: зной
  rationale: Передаёт сильный, палящий жар и при этом не сливается по смыслу с πῦρ («огонь»); в поэтическом перечне звучит естественно и достойно.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычная русская передача κύριος как божественного титула в форме винительного падежа.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Передаёт не просто хвалу, а хвалебное пение, заложенное в греческом глаголе.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Сохраняет усиленное значение глагола — чрезвычайно высоко возносить, возвеличивать — без тяжеловесной дополнительной наречной конструкции.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Естественная для русской библейской поэзии краткая передача устойчивого выражения о непрестанной, вечной хвале.
theological_decisions:
- issue: Передача κύριος в девтероканоническом литургическом рефрене
  choice: Господь
  alternative: Владыка; ГОСПОДЬ
  rationale: «Господь» точно соответствует греческому божественному титулу и сложившемуся русскому библейскому употреблению, не вводя явно тетраграмматон, которого в греческом тексте нет.
translation_notes:
  register: Современный литературный русский с достоинством библейского гимна. Сохранены два параллельных императива и лаконичный ритм рефрена; «зной» передаёт καῦμα точнее, чем более общее «жар», а «вовеки» уместно в поэтическом литургическом регистре.
