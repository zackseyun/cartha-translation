lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Благословен
  rationale: Предикативное прилагательное в литургической формуле благословения; передаёт прямое обращение и возвышенный доксологический строй.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος в функции Божественного титула; русская звательная форма естественна для молитвенного обращения.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Боже наших отцов
  rationale: Сохраняет прямое значение греческого πατέρων и традиционное библейское выражение заветной преемственности; «предков» возможно, но менее буквально.
- source_word: αἰνετὸν
  choice: достойно хвалы
  rationale: Прилагательное означает достойное восхваления. Такой перевод точнее передаёт значение, чем двусмысленное «хвально», и естественно сочетается со словом «имя».
- source_word: δεδοξασμένον
  choice: прославлено
  rationale: Перфектное страдательное причастие от δοξάζω; «прославлено» сохраняет аспект оказанной и пребывающей славы, не сводя смысл к общему «почитаемо».
- source_word: τὸ ὄνομά σου
  choice: имя Твоё
  rationale: Сохранена библейская метонимия Божьего открытого имени, личности и славы без поясняющего расширения.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивый русский библейский эквивалент греческой идиомы «в века», выражающей непреходящую длительность.
theological_decisions:
- issue: Передача заветного выражения τῶν πατέρων ἡμῶν
  choice: наших отцов
  alternative: наших предков
  rationale: Греческий текст прямо говорит об «отцах»; основной текст сохраняет мужской род и заветно-библейский оттенок, а более широкое по объёму «предков» отмечено как допустимая альтернатива.
- issue: Передача конструкции καὶ αἰνετὸν καὶ δεδοξασμένον τὸ ὄνομά σου
  choice: и имя Твоё достойно хвалы и прославлено
  alternative: и хвально и прославлено имя Твоё
  rationale: Сохранена бессвязочная доксологическая конструкция и различие между качеством «достойно хвалы» и состоянием «прославлено»; модальное «да будет прославлено» не вводится, поскольку его нет в греческом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Формы «Господи», «Боже» и «вовеки» сохраняют узнаваемую библейско-литургическую торжественность, оставаясь понятными современному читателю. Местоимение и притяжательная форма при обращении к Богу написаны с прописной буквы согласно устойчивой русской религиозной издательской практике.
