translation:
  language: ru
  text: Небеса, благословляйте Господа; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Множественное число повелительного наклонения; «благословляйте» сохраняет буквальный смысл и повторяющуюся литургическую форму песни.
- source_word: οὐρανοί
  choice: небеса
  rationale: Форма обращения во множественном числе. В русском поэтическом синтаксисе обращение естественно передаётся без частицы «о».
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычный и уместный перевод κύριος в обращённом к Богу гимне; написание не имитирует отсутствующий в греческом тексте тетраграмматон.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Передаёт как хвалу, так и песенный характер глагола естественным литературным русским словом.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Передаёт усиленное возвеличивание, выраженное приставочным глаголом ὑπερυψόω, и сохраняет возвышенный гимнический регистр.
- source_word: αὐτὸν
  choice: Его
  rationale: Явное местоименное дополнение сохранено; прописная буква соответствует русской традиции благоговейного обозначения Бога.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткий устойчивый библейско-гимнический эквивалент выражения вечной продолжительности, подходящий рефрену.
theological_decisions:
- issue: Передача κύριος в обращении к Богу
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Греческий источник содержит κύριος, а не еврейское имя YHWH; поэтому написание «ГОСПОДЬ» необоснованно подразумевало бы иной исходный текст.
- issue: Объект глагола ὑπερυψοῦτε
  choice: Сохранить явное «Его»
  alternative: Опустить местоимение как подразумеваемое
  rationale: Греческое αὐτόν выражено прямо, и его сохранение поддерживает смысловую ясность без добавления толкования.
translation_notes:
  register: Современный литературный русский с dignified гимнической окраской. Формы «благословляйте», «воспевайте», «превозносите» сохраняют параллелизм трёх повелений; «вовеки» поддерживает ритм рефрена без излишней архаизации.
