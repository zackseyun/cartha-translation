translation:
  language: ru
  text: И Ты предал нас в руки наших беззаконных врагов, самых ненавистных отступников, и в руки несправедливого царя — злейшего на всей земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέδωκας
  choice: предал
  rationale: Точно передаёт действие вручения во власть противников и сохраняет библейскую торжественность без архаизации.
- source_word: ἀνόμων
  choice: беззаконных
  rationale: Сохраняет нравственно-религиозный смысл греческого ἄνομος, а не сводит его только к нарушению гражданского закона.
- source_word: ἐχθίστων
  choice: ненавистных
  rationale: Передаёт превосходную степень сильного отрицательного отношения; в сочетании с «отступников» звучит естественнее буквального «самых ненавистных».
- source_word: ἀποστατῶν
  choice: отступников
  rationale: Передаёт значение мятежного отпадения или отступничества, не уточняя без достаточного основания, является ли оно прежде всего политическим или религиозным.
- source_word: πονηροτάτῳ
  choice: самому злому
  rationale: Ясно сохраняет превосходную степень и широкий нравственный смысл πονηρός.
- source_word: παρὰ πᾶσαν τὴν γῆν
  choice: на всей земле
  rationale: 'В данном сочетании естественно передаёт сопоставительный смысл: царь превосходит злом всех на земле.'
theological_decisions:
- issue: Характер обозначения ἀποστατῶν
  choice: отступников
  alternative: мятежников
  rationale: «Отступники» сохраняет возможную религиозно-нравственную окраску слова, но не устраняет его значение измены или мятежа.
- issue: Степень утверждения о царе
  choice: самому злому на всей земле
  alternative: злейшему, чем кто-либо на всей земле
  rationale: Сохранена превосходная оценка текста без смягчения; выбран более естественный современный русский синтаксис.
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейской возвышенностью. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Координация греческой фразы сохранена, но тире делает превосходную характеристику царя ясной и естественной.
