base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/021.yaml
  text: And let all who show evil to your servants be put to shame[a], and let them be disgraced from all their dominion[c][b], and let their strength be broken.
translation:
  language: ru
  text: И да устыдятся все, кто причиняет зло твоим рабам[a]; да будут они посрамлены во всём своём могуществе[b], и да сокрушится их сила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоим слугам». Греческое слово δοῦλοι подчёркивает их принадлежность Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможны также переводы: «лишены всего своего могущества» или «посрамлены, несмотря на всё своё могущество». Связь предлога ἀπό со словом «могущество, владычество» здесь неоднозначна.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐντραπείησαν
  choice: да устыдятся
  rationale: Аористный пассивный оптатив выражает пожелание в молитве; «да устыдятся» естественно передаёт молитвенно-пожелательный оттенок и сохраняет отличие от следующего глагола стыда.
- source_word: οἱ ἐνδεικνύμενοι … κακά
  choice: кто причиняет зло
  rationale: Буквально оборот означает «показывающие/проявляющие зло», но по-русски применительно к враждебным действиям естественно сказать «причиняет зло», не сужая κακά до одного лишь физического вреда.
- source_word: τοῖς δούλοις σου
  choice: твоим рабам
  rationale: «Рабы» сохраняет значение принадлежности Богу и в русском библейском и молитвенном регистре звучит естественнее, чем буквальное социальное прочтение слова вне контекста.
- source_word: καταισχυνθείησαν
  choice: да будут они посрамлены
  rationale: Сохраняется публичный оттенок позора и риторическое различие между ἐντραπείησαν и καταισχυνθείησαν.
- source_word: ἀπὸ πάσης τῆς δυναστείας
  choice: во всём своём могуществе
  rationale: Оборот с ἀπό синтаксически неоднозначен. Основной текст передаёт δυναστεία как власть и могущество, а сноска сохраняет возможные отношения лишения или уступки.
- source_word: ἡ ἰσχὺς αὐτῶν συντριβείη
  choice: да сокрушится их сила
  rationale: «Сокрушится» сохраняет сильный образ разрушения в συντρίβω и продолжает ряд молитвенных пожеланий.
theological_decisions:
- issue: Передача δοῦλοι в отношении принадлежащих Богу людей
  choice: твои рабы
  alternative: твои слуги
  rationale: В молитвенном контексте русское «рабы» сохраняет сильное значение принадлежности Богу и укоренено в библейском употреблении; «слуги» возможно, но ослабляет эту связь.
- issue: Связь посрамления с δυναστεία
  choice: посрамлены во всём своём могуществе
  alternative: лишены всего своего могущества; посрамлены, несмотря на всё своё могущество
  rationale: Греческое ἀπὸ допускает более одного смыслового отношения. Основной перевод не превращает неоднозначный оборот однозначно в лишение власти, а альтернативы приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной молитвенной формой «да…». Местоимение «твоим» дано со строчной буквы по нормам современного издания. Параллелизм трёх греческих оптативов сохранён.
