  text: Blessed are you in the temple of your holy glory, and highly praised and exceedingly glorious forever.
translation:
  language: ru
  text: Благословен Ты в храме святой славы Твоей, превозносимый и преславный вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένος
  choice: Благословен
  rationale: Традиционное и естественное для русского библейского славословия соответствие, сохраняющее форму именного сказуемого.
- source_word: ἐν τῷ ναῷ τῆς ἁγίας δόξης σου
  choice: в храме святой славы Твоей
  rationale: 'Формально сохраняет греческую родительную конструкцию и её поэтическую многозначность: храм характеризуется Божьей святой славой.'
- source_word: ὑπερυμνητός
  choice: превозносимый
  rationale: Передаёт усиленное значение словесной хвалы без тяжеловесного буквального неологизма.
- source_word: ὑπερένδοξος
  choice: преславный
  rationale: Передаёт превосходную степень присущей Богу славы, не превращая прилагательное в страдательное «прославляемый».
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткая устойчивая формула для обозначения вечной длительности в поэтическом библейском регистре.
theological_decisions:
- issue: 'Значение ὑπερένδοξος: присущая слава или действие прославления'
  choice: преславный
  alternative: препрославляемый
  rationale: Греческая форма является прилагательным со значением чрезвычайной славы; выбранный вариант сохраняет это качество и не подменяет его действием людей.
- issue: Связь «святой славы» с храмом
  choice: храме святой славы Твоей
  alternative: Твоём святом и славном храме
  rationale: Сохранена исходная родительная конструкция, чтобы не снимать возможное богословское напряжение между храмом как местом славы и самой Божьей славой.
translation_notes:
  register: Современный литературный русский с торжественным гимническим звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы как редакционная норма благоговейного библейского регистра; архаизм «вовеки» сохранён как общеупотребительная литургико-библейская формула.
