lexical_decisions:
- source_word: εὐλογητός
  choice: Благословен
  rationale: Традиционное и естественное русское соответствие в обращённой к Богу хвале.
- source_word: ἐν τῷ στερεώματι τοῦ οὐρανοῦ
  choice: на тверди небесной
  rationale: Сохраняет космологический образ στερέωμα и значение конструкции с ἐν; выражение звучит возвышенно и понятно в библейском регистре.
- source_word: ὑμνητός
  choice: воспеваемый
  rationale: Передаёт связь слова с гимническим восхвалением точнее, чем общее «хвалимый».
- source_word: δεδοξασμένος
  choice: прославленный
  rationale: Сохраняет результативный оттенок перфектного причастия и обычную библейскую лексику δόξα.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткое и устойчивое литургико-библейское соответствие формуле вечной хвалы.
theological_decisions:
- issue: Соотношение ὑμνητός и δεδοξασμένος
  choice: воспеваемый и прославленный
  alternative: достоин хвалы и прославлен
  rationale: Выбранная формулировка сохраняет две отдельные характеристики и не превращает ὑμνητός в утверждение лишь о достоинстве быть хвалимым.
