  - marker: b
    text: 'Или: «восседающий над херувимами». Буквальнее: «сидящий на херувимах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος εἶ
  choice: Благословен Ты
  rationale: Предикативное прилагательное с формой второго лица передаёт прямое литургическое обращение к Богу.
- source_word: ὁ ἐπιβλέπων
  choice: взирающий
  rationale: Сохраняет зрительное значение причастия и возвышенный молитвенный регистр, не добавляя идеи попечения, которой глагол здесь не требует.
- source_word: ἀβύσσους
  choice: бездны
  rationale: Множественное число передаёт греческую форму и сохраняет образ космических глубин.
- source_word: καθήμενος
  choice: восседающий
  rationale: Передаёт буквальный смысл «сидящий» естественным для библейского и богослужебного контекста русским словом; царственный оттенок не превращён в явно отсутствующее слово «царствующий».
- source_word: ἐπὶ χερουβεὶν
  choice: на херувимах
  rationale: Близко следует обычному пространственному значению ἐπί и сохраняет библейский образ, не разрешая его однозначно как «над херувимами».
- source_word: αἰνετὸς
  choice: достохвален
  rationale: Краткое предикативное прилагательное выражает, что Бог достоин хвалы, и сохраняет параллелизм греческой доксологической формулы.
- source_word: ὑπερυψούμενος
  choice: превозносим
  rationale: Передаёт усиленное значение составного глагола и его форму, указывающую на воздаваемое Богу высочайшее возвеличивание.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Естественный и традиционный русский эквивалент доксологической формулы вечной длительности.
theological_decisions:
- issue: Образ Божьего пребывания относительно херувимов
  choice: восседающий на херувимах
  alternative: восседающий над херувимами
  rationale: Греческое ἐπὶ допускает контекстуальное понимание «над», однако непосредственная формулировка не требует заменять «на» более истолковывающим вариантом.
- issue: Значение αἰνετὸς в славословии
  choice: достохвален
  alternative: хвалим; достоин хвалы
  rationale: Выбранный вариант сохраняет оценочное значение — Бог заслуживает хвалы — и одновременно поддерживает краткую цепь предикатов исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным звучанием. Формы «взирающий», «восседающий», «достохвален» и «вовеки» уместны в славословии, но синтаксис остаётся ясным для современного читателя.
