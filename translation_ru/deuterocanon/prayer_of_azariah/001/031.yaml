base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/031.yaml
  text: Blessed are you[a], who look upon the depths, seated upon the cherubim[b], and praised and highly exalted forever.
translation:
  language: ru
  text: Благословен Ты, взирающий на бездны[a], восседающий на херувимах[b], достоин хвалы и превозносим вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глубины». Множественное число может обозначать космические бездны.'
