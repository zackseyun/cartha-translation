base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/012.yaml
  text: And do not withdraw your mercy from us[a], for the sake of Abraham your beloved, and Isaac your servant[b], and Israel your holy one.
translation:
  language: ru
  text: И не отнимай от нас твоей милости[a] ради Авраама, возлюбленного тобою, ради Исаака, твоего служителя, и Израиля, твоего святого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не удаляй от нас твоей милости».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «Израиль» — патриарх Иаков, названный своим заветным именем.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστήσῃς
  choice: не отнимай
  rationale: В переходном употреблении ἀφίστημι с прямым дополнением означает удалить или отнять. «Не отнимай» естественно передаёт молитвенную просьбу и сохраняет возможность понимать действие как прекращение являемой народу милости.
- source_word: τὸ ἔλεός σου
  choice: твоей милости
  rationale: ἔλεος в контексте молитвы обозначает милость и сострадание; «милость» — краткий и устойчивый русский эквивалент без добавления отсутствующих в греческом тексте оттенков.
- source_word: διὰ
  choice: ради
  rationale: Предлог διά с винительным падежом указывает здесь на основание просьбы. Русское «ради» естественно передаёт обращение к отношениям Бога с патриархами как основанию для милости.
- source_word: ἠγαπημένον ὑπὸ σοῦ
  choice: возлюбленного тобою
  rationale: 'Так сохраняются страдательное значение причастия и прямо выраженный деятель ὑπὸ σοῦ: Авраам — тот, кого любит Бог.'
- source_word: δοῦλόν
  choice: служителя
  rationale: В почётном обозначении патриарха δοῦλος подчёркивает верное служение Богу; «служитель» здесь уместнее социально окрашенного «раб» и естественнее сочетается с обращением «твой».
- source_word: ἅγιόν
  choice: святого
  rationale: Субстантивированное прилагательное в единственном числе называет Израиля человеком, посвящённым Богу. Конструкция «твоего святого» сохраняет форму и смысл греческого текста.
- source_word: Ἰσραήλ
  choice: Израиля
  rationale: Сохранено данное в греческом тексте заветное имя патриарха; оно не заменено именем «Иаков».
theological_decisions:
- issue: Передача δοῦλος как титула патриарха
  choice: служитель
  alternative: раб
  rationale: В ряду почётных наименований праотцов на первом плане стоит верное служение Исаака Богу, а не его общественно-правовое положение. «Служитель» сохраняет эту функцию, не усиливая социальный оттенок.
- issue: Смысл обращения к патриархам после διά
  choice: ради Авраама… ради Исаака… и Израиля
  alternative: из-за Авраама… Исаака… и Израиля; по причине Авраама…
  rationale: «Ради» передаёт патриархов как основание молитвенной просьбы, не уточняя сверх текста, каким именно образом их отношения с Богом связаны с продолжением милости.
- issue: Кого обозначает имя Израиль
  choice: патриарх под именем Израиль
  alternative: народ Израиля
  rationale: Параллельный ряд Авраам — Исаак — Израиль и формы единственного числа указывают здесь на Иакова под его заветным именем, а не на народ в целом.
translation_notes:
  register: Современный литературный русский язык с молитвенно-торжественным, но понятным строем. Местоимения, относящиеся к Богу, даны со строчной буквы по нормам современного издания. Повтор «ради» перед Авраамом и Исааком отражает повторение διά в греческом тексте, а перед последним членом ряда по-русски достаточно союза «и».
