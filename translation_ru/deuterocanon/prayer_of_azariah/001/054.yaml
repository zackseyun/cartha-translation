  text: Bless the Lord, rains and springs; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, дожди и источники; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Повелительное наклонение множественного числа, призывающее творение прославлять Господа; «благословляйте» сохраняет повторяющуюся литургическую формулу песни.
- source_word: ὄμβροι
  choice: дожди
  rationale: Множественное число обозначает дожди или ливни; «дожди» точно передаёт форму и естественно звучит в перечне явлений творения.
- source_word: πηγαί
  choice: источники
  rationale: Речь о природных источниках воды; это современный и точный русский эквивалент.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Форма винительного падежа является дополнением при повелительном глаголе; традиционное и нейтральное соответствие κύριος в обращённом к Богу гимне.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу в песнопении; «воспевайте» естественно передаёт музыкально-гимнический оттенок и возвышенный регистр.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Интенсивный глагол означает чрезвычайно возвышать или превозносить; русский глагол сохраняет усиленный литургический смысл без громоздкого наречия.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивая литургическая передача выражения о непрестанной, вечной хвале; кратка и понятна в современном литературном русском.
theological_decisions:
- issue: Передача κύριος в девтероканоническом гимне, обращённом к Богу Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» является традиционным, общеупотребительным и конфессионально нейтральным соответствием; оно сохраняет литургическую формулу и не привносит особой интерпретации.
translation_notes:
  register: Современный литературный русский с возвышенным литургическим звучанием. Сохранены множественное число обращений, параллелизм двух повелений и усиленное значение ὑπερυψοῦτε. Местоимение «Его» добавлено как необходимое в русском дополнение к однородным повелениям и соответствует αὐτόν.
