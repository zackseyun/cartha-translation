base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/002.yaml
  text: Then Azariah stood and prayed thus[a], and opening his mouth he gave thanks to the Lord together with his companions in the midst of the fire, while the furnace was being intensely heated by the Chaldeans. And they said,
translation:
  language: ru
  text: 'Тогда Азария встал и помолился так, и, открыв уста, он вместе со своими товарищами прославлял Господа[a] посреди огня, в то время как халдеи усиленно разжигали печь. И сказали они:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодарил Господа»; или: «исповедовался перед Господом». Греческий глагол в зависимости от контекста может обозначать исповедание, благодарение или хвалу.'
    reason: Лексическая неоднозначность глагола ἐξωμολογεῖτο.
lexical_decisions:
- source_word: στὰς
  choice: встал
  rationale: Аористное причастие обозначает действие, предшествующее молитве; личная форма звучит естественно по-русски и сохраняет последовательность повествования.
- source_word: προσηύξατο οὕτως
  choice: помолился так
  rationale: Прямо передаёт молитвенное действие и вводит последующие слова без излишнего усложнения.
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: открыв уста
  rationale: Сохранён торжественный библейский оборот, отмечающий начало значимой речи.
- source_word: ἐξωμολογεῖτο
  choice: прославлял
  rationale: В библейском греческом глагол может обозначать прославление или благодарение Бога, а также исповедание. Основной вариант естественен в данном молитвенном контексте, а смысловая неоднозначность сохранена в сноске.
- source_word: τῷ κυρίῳ
  choice: Господа
  rationale: В данном иудейском библейском контексте κύριος является почтительным обозначением Бога; русский винительный падеж обусловлен управлением глагола «прославлял».
- source_word: ἅμα τοῖς συνεταίροις αὐτοῦ
  choice: вместе со своими товарищами
  rationale: Передаёт совместность действия и называет находящихся с Азарией юношей естественным современным языком.
- source_word: ἐν μέσῳ τῷ πυρί
  choice: посреди огня
  rationale: Сохраняет выразительное указание на место действия.
- source_word: ὑποκαιομένης τῆς καμίνου ὑπὸ τῶν Χαλδαίων σφόδρα
  choice: пока халдеи усиленно разжигали печь
  rationale: Греческий генитив абсолютный передан придаточным одновременности; активная русская конструкция яснее пассивной и сохраняет действующих лиц, интенсивность и продолжающееся разжигание.
- source_word: καὶ εἶπαν
  choice: И сказали они
  rationale: Сохранено множественное число греческого текста, хотя после единственного числа «Азария» оно звучит несколько резко; оно согласуется с упоминанием товарищей и вводит совместную речь.
theological_decisions:
- issue: Значение ἐξωμολογεῖτο в молитве, содержащей и прославление Бога, и признание греха
  choice: прославлял Господа
  alternative: благодарил Господа; исповедовался перед Господом
  rationale: Глагол допускает значения исповедания, благодарения и хвалы. Основной вариант не сводит молитву только к признанию греха, а остальные реальные значения явно сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Оборот «открыв уста» сохранён ради торжественного характера сцены; остальные конструкции сделаны ясными и естественными для широкого читателя.
